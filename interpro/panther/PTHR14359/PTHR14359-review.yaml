notes: >-
  Used by modules/coenzyme_a_biosynthesis.yaml in the homooligomeric_ppcdc_variant (family
  PTHR14359, node PTN000372091) and in the heterotrimeric_cab3_hal3_ppcdc_variant (SF6 for Cab3,
  SF17 for Sis2/Vhs3). Two inconsistencies to report. (1) The module lists S. pombe hal3
  (Q9UTI7) as a representative member of PTHR14359, but PANTHER 19.0 (fission yeast
  classification and the repo member index) assigns Q9UTI7 to PTHR11548:SF2, the thymidylate
  synthase family, probably because its C-terminal TS domain dominates the HMM match. (2) The
  S. cerevisiae CAB3, SIS2 and VHS3 gene reviews ACCEPT the RCA (YeastPathways) row 'enables
  GO:0004633', while their IDA/IMP rows and the biology both say contributes_to. MJ0730 domain
  content was checked in UniProt Q58140 on 2026-10-06.
