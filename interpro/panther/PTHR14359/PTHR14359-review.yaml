  assessment: SOUND
  assessment_reason: >-
    FMN binding is the basis of the family's chemistry, and the active-site flavin sits at the
    trimer interface. The budding-yeast subunits keep it: purified PPCDC domains of Hal3, Vhs3
    and Cab3 show protein-bound flavin by circular dichroism. Gene reviews for Cab3, Sis2 and
    Vhs3 keep the IBA as non-core, which is consistent with this.
  supported_by:
  - reference_id: PMID:26514574
    supporting_text: Since the flavins of PD proteins are bound in the active sites that are found
      at the trimer interfaces
term_assessments:
- assessed_term:
    id: GO:0004633
    label: phosphopantothenoylcysteine decarboxylase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The activity belongs to the PPCDC/CoaC members of SF6. The yeast Hal3-type subunits of SF17
    take part only as contributors to the Cab3 heterotrimer, so contributes_to and not enables is
    the right qualifier for Cab3, Sis2 and Vhs3. SF6 is listed because it holds the
    self-sufficient PPCDCs. Its EpiD and MrsD members are lantibiotic decarboxylases and are not
    covered. SF17 is not listed because none of its members has the activity on its own. The
    coenzyme A module uses the whole family (PTHR14359) for the homo-oligomeric annoton, and SF6
    and SF17 for the Cab3 and Sis2/Vhs3 subunits of the heterotrimer. That matches this scope.
    The module also lists S. pombe hal3 (Q9UTI7) as a representative of PTHR14359, but PANTHER
    classifies that protein in PTHR11548 (thymidylate synthase). Its N-terminal Hal3-like PPCDC
    domain is not what PANTHER classified.
    SF17 is listed only with the contributes_to qualifier: the SIS2 and VHS3 reviews keep
    the activity as contributes_to, as subunits of the Cab3 heterotrimer.
