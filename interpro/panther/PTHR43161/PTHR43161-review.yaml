    label: SORD
    organism: Homo sapiens
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Sorbitol-to-fructose oxidation is the function of the animal SORD/Sodh seeds and fits the
    yeast sorbitol dehydrogenases SOR1/SOR2 and fission yeast tms1. The node also reaches the
