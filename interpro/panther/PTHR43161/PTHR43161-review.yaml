- subfamily_id: PANTHER:PTHR43161:SF26
  label: GALACTITOL 1-PHOSPHATE 5-DEHYDROGENASE
  description: >-
    Bacterial (R,R)-butanediol dehydrogenases (B. subtilis BdhA, Neisseria BudC) under the
    PANTHER label of galactitol-1-phosphate dehydrogenase. Their butanediol dehydrogenase
    activity is asserted at a separate node (PTN001707533), independent of the yeast BDH1 clade.
  representative_members:
