family_id: PANTHER:PTHR43161
family_name: SORBITOL DEHYDROGENASE
preferred_name: Zinc medium-chain polyol dehydrogenases (sorbitol, xylitol, L-arabinitol and butanediol dehydrogenases)
summary: >-
  Zinc-containing medium-chain dehydrogenase/reductase (MDR) enzymes that reversibly oxidise
  polyols and diols to the corresponding ketoses or hydroxyketones, mostly with NAD+. The family
  includes animal and yeast sorbitol dehydrogenases (SORD, S. cerevisiae SOR1/SOR2, fission
  yeast tms1), fungal and bacterial xylitol dehydrogenases (D-xylulose reductases: S. cerevisiae
  XYL2, Scheffersomyces stipitis XYL2, Aspergillus xdhA), fungal L-arabinitol 4-dehydrogenases,
  E. coli L-idonate 5-dehydrogenase IdnD, plant L-idonate dehydrogenase, and (R,R)-butanediol
  dehydrogenases from yeast (BDH1) and bacteria (B. subtilis BdhA). Substrate specificity is
  the main axis of divergence, and the polyol substrates overlap: sorbitol dehydrogenases also
  oxidise xylitol.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members are zinc MDR polyol/diol dehydrogenases, but no single specific activity spans the
  family. SF9 (SORBITOL DEHYDROGENASE) mixes sorbitol dehydrogenases, dedicated xylitol
  dehydrogenases (S. cerevisiae XYL2, S. stipitis XYL2, Aspergillus xdhA) and E. coli IdnD.
  SF12 holds the fungal L-arabinitol 4-dehydrogenases, SF17 plant L-idonate dehydrogenase, SF23
  the yeast (R,R)-butanediol dehydrogenase BDH1 and its uncharacterized paralog BDH2, and SF26
  (named for galactitol-1-phosphate dehydrogenase) holds the bacterial (R,R)-butanediol
  dehydrogenases BdhA/BudC. Butanediol dehydrogenase activity therefore appears in two separate
  clades (SF23 fungal, SF26 bacterial), each with its own PAINT node.
