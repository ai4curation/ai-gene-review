    id: GO:0000721
    label: (R,R)-butanediol dehydrogenase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The term the alcoholic fermentation module requires of this family (BDH1). Safe for the
    fungal BDH1 clade (SF23). The bacterial BdhA/BudC enzymes in SF26 have the same activity
    through their own node (PTN001707533), but SF26 is named for galactitol-1-phosphate
    dehydrogenase and is not listed here as a whole. Not safe for the sorbitol, xylitol or
    arabinitol dehydrogenase subfamilies.
