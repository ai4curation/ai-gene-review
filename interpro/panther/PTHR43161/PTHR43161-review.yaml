notes: >-
  Node membership read from the PAINT UniProt GAF. PTN002455918 (GO:0050572 L-idonate
  5-dehydrogenase activity, GO:0046183 L-idonate catabolic process; bacterial) is seeded by
  E. coli IdnD and reaches 13 bacterial proteins; PTN001707508 (GO:0046526, GO:0006060 sorbitol
  metabolic process; taxon 1437201) is seeded by Arabidopsis SDH; PTN001707533 (GO:0000721;
  Firmicutes) is seeded by B. subtilis BdhA. None of these reach a gene-reviewed member. The
  alcoholic fermentation module labels this family "SORBITOL DEHYDROGENASE" for BDH1, which is
  the official family name; BDH1 itself is in SF23. No residue sites asserted.
