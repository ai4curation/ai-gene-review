    gene_symbol: bdhA
    organism: Bacillus subtilis 168
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR43161:SF12
  label: L-ARABINITOL 4-DEHYDROGENASE
  description: Fungal L-arabinitol 4-dehydrogenases of L-arabinose catabolism (Neurospora ard-1, Aspergillus ladA, Trichoderma lad1).
  representative_members:
  - id: UniProtKB:Q7SI09
    label: L-arabinitol 4-dehydrogenase
    gene_symbol: ard-1
    organism: Neurospora crassa
  diverged_from_family: true
  divergence_description: >-
    Specialized for L-arabinitol oxidation to L-xylulose in fungal L-arabinose catabolism. Ard-1
    nevertheless inherits sorbitol dehydrogenase (GO:0003939) and fructose biosynthetic process
    (GO:0046370) from PTN000190705; these were not examined here because no member of SF12 has a
    gene review in this repository.
