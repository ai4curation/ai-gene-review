term_assessments:
- assessed_term:
    id: GO:0008762
    label: UDP-N-acetylmuramate dehydrogenase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The reaction defines the family: all members share the MurB three-domain fold with its bound FAD,
    no member is known to catalyse anything else, and the enzyme is essential in the bacteria where it
    has been tested. The plant members are the only ones whose activity rests on inference rather than
    assay; granting the term family-wide is nevertheless the better reading, because they are orthologs
    inside a plastid peptidoglycan pathway that is demonstrably operative (complete Mur set and
    macrochloroplast knockout phenotypes in moss; nine Mur genes retained in angiosperms such as Citrus
    sinensis) and because the one plant Mur ligase that has been assayed performs the bacterial
    reaction. If a plant MurB is ever shown to be a pseudoenzyme, the right correction is a member
    exception or a PAINT loss on that branch, not withdrawal of the family-level grant.
  supported_by:
  - reference_id: PMID:8448160
    supporting_text: The enzyme utilizes the 4-pro-S hydrogen of NADPH to reduce the enolpyruvyl group
      of UDP-N-acetylglucosamine enolpyruvate to the lactyl ether in UDP-N-acetylmuramic acid.
  - reference_id: PMID:41351887
    supporting_text: In the several angiosperm genomes such as the monocot Asparagus officinalis and
      eudicot Citrus sinensis, nine Mur genes but not a bifunctional Pbp gene were identified.
  - reference_id: PMID:16618924
    supporting_text: Gene disruption of the PpMurE gene in P. patens resulted in the appearance of
      macrochloroplasts both in protonema and in leaf cells.
- assessed_term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  scope: FAMILY_WIDE
  scope_reason: >-
    The flavin is bound stoichiometrically by the fold and cycles during catalysis, so cofactor binding
    travels with membership even where the substrate chemistry has not been measured. Note that the
    more specific child FAD binding (GO:0071949) is the better statement for any member with direct
    cofactor evidence, as the E. coli gene review records.
  supported_by:
  - reference_id: PMID:8448160
    supporting_text: It was found to be a monomer and to contain stoichiometric amounts of bound FAD
      which is reducible in catalytic turnover.
  - reference_id: PMID:7727397
    supporting_text: yielded homogeneous enzyme containing 1 mol/mol bound FAD
