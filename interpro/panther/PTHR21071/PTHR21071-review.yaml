notes: >-
  All four PAINT rows sit at the same node, PTN001843295, which is the root of the family tree (60
  leaves); PAINT records no taxon for it. Member counts and subfamily assignments are from
  PTHR21071-entries.csv. No residue sites are recorded: the catalytic Ser229 and the flavin-binding
  residues of E. coli MurB are conserved across the clade and would not discriminate between members.
