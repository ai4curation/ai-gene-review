family_id: PANTHER:PTHR21071
family_name: UDP-N-ACETYLENOLPYRUVOYLGLUCOSAMINE REDUCTASE
preferred_name: MurB (UDP-N-acetylenolpyruvoylglucosamine reductase) family
summary: >-
  FAD-containing oxidoreductases of the MurB type, which catalyse the second committed step of
  peptidoglycan synthesis: NADPH-dependent reduction of the enolpyruvyl group of
  UDP-N-acetylglucosamine enolpyruvate to the D-lactyl ether of UDP-N-acetylmuramate. Each subunit
  carries one stoichiometric, catalytically cycling FAD, and the reaction proceeds by a two-half
  reaction (ping-pong) mechanism in which NADPH first reduces the flavin and the reduced flavin then
  transfers hydride to the substrate. The family contains the bacterial murB genes (single copy in most
  phyla, with a second copy in the Bacillus group) and the MurB orthologs of streptophyte plants, which
  belong to the retained plastid peptidoglycan pathway.
functional_coherence: COHERENT
coherence_reason: >-
  All 460 SF4 and 12 SF5 members carry the same three-domain MurB architecture with its bound FAD, the
  two subfamilies are paralog clades of the same enzyme rather than functionally distinct groups, and
  no member has been shown to do anything else. The plant members are orthologs within the plastid
  peptidoglycan gene set, which is operative in moss and gymnosperms and retained in some angiosperm
  genomes; none has been assayed directly, which is a gap in the evidence rather than a divergence.
