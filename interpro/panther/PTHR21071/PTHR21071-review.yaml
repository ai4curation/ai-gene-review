      protein Pbp, and dd-carboxypeptidase (Dac).'
  - reference_id: PMID:41351887
    supporting_text: Enzymatic assay of recombinant PaMurE proteins revealed they catalyze the same
      reaction performed by their bacterial MurE homologs.
- node_id: PANTHER:PTN001843295
