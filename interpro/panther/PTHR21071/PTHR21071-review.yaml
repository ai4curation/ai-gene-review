- node_id: PANTHER:PTN001843295
  asserted_term:
    id: GO:0005829
    label: cytosol
  evidence: IBD
  negated: false
  paint_snapshot: '20210305'
  seeds:
  - id: UniProtKB:P08373
    label: UDP-N-acetylenolpyruvoylglucosamine reductase
    gene_symbol: murB
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/murB/murB-ai-review.yaml
  assessment: UNRESOLVED
  assessment_reason: >-
    Right for the bacterial members and doubtful for the plant ones, and PAINT has no node that
    separates them. E. coli MurB is a soluble protein recovered in the cytosolic fraction, and the same
    holds for its bacterial orthologs, but the streptophyte leaves below this node are plastid-targeted
    members of the plastid peptidoglycan pathway: GFP fusions of the moss and spruce Mur proteins that
    have been localised are seen in chloroplasts, so a plant MurB in the plastid stroma would not be in
    the cytosol as a bacterial cytosol row intends. No plant MurB localisation is available in this
    repository, the plant leaves sit inside SF4 with the bacterial ones so the subfamily axis cannot
    express the distinction, and the row has a single bacterial seed, so the extent of the cytosol
    claim is left undecided rather than pruned on inference.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21071/PTHR21071-paint.tsv
    supporting_text: "PTHR21071\tPTN001843295\tGO:0005829\tC\tIBD\tfalse"
