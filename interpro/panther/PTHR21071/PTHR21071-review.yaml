    label: UDP-N-acetylenolpyruvoylglucosamine reductase
    gene_symbol: murB
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/murB/murB-ai-review.yaml
  assessment: SOUND
  assessment_reason: >-
    FAD is an integral, stoichiometric cofactor of the MurB fold rather than an accessory ligand: the
    purified E. coli enzyme is a monomer with one mole of bound FAD per mole of protein, and that flavin
    is reduced and reoxidised during turnover, so every member of the clade that performs the reaction
    binds it. The E. coli gene review refines this row to the child term FAD binding (GO:0071949),
    which the gene already carries by direct evidence; that is a granularity improvement on an
    otherwise correct node assertion, not a challenge to the placement.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21071/PTHR21071-paint.tsv
    supporting_text: "PTHR21071\tPTN001843295\tGO:0050660\tF\tIBD\tfalse"
  - reference_id: PMID:8448160
    supporting_text: It was found to be a monomer and to contain stoichiometric amounts of bound FAD
      which is reducible in catalytic turnover.
  - reference_id: PMID:7727397
    supporting_text: yielded homogeneous enzyme containing 1 mol/mol bound FAD
  - reference_id: file:genes/ECOLI/murB/murB-ai-review.yaml
    supporting_text: The MurB-family node legitimately carries flavin binding
