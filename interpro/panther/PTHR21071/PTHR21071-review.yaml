node_assessments:
- node_id: PANTHER:PTN001843295
  asserted_term:
    id: GO:0008762
    label: UDP-N-acetylmuramate dehydrogenase activity
  evidence: IBD
  negated: false
  paint_snapshot: '20210305'
  seeds:
  - id: UniProtKB:P08373
    label: UDP-N-acetylenolpyruvoylglucosamine reductase
    gene_symbol: murB
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/murB/murB-ai-review.yaml
  assessment: SOUND
  assessment_reason: >-
    PTN001843295 is the root of the family's 60-leaf tree and the function is ancestral to it: MurB
    activity is a property of the fold, demonstrated in detail for the E. coli seed (hydride transfer
    from the 4-pro-S position of NADPH, ping-pong kinetics, NADPH-specific), and the clade contains
    nothing but MurB orthologs. The node spans the streptophyte members as well as the bacterial ones,
    which is the only point worth checking: plant MurB belongs to the cyanobacteria-derived plastid
    peptidoglycan pathway, which is demonstrably operative in moss, where the Mur gene set is complete
    and knockouts give macrochloroplasts and where the chloroplast is surrounded by peptidoglycan, and
    which is retained in some angiosperm genomes. Recombinant plant Mur enzymes that have been assayed
    (the Picea abies MurE ligase) catalyse the same reaction as their bacterial homologs, so inheritance
    of the reaction by the plant leaves is the expected reading. No plant MurB has itself been assayed;
    see the term assessment for how far that licenses a family-level grant.
