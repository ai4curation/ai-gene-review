    gene_symbol: murB
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/murB/murB-ai-review.yaml
  assessment: SOUND
  assessment_reason: >-
    Defensible but broad. MurB makes a cytoplasmic nucleotide precursor, so its connection to the wall
    is through the product rather than through any action on the wall itself; the E. coli gene review
    therefore keeps this row as non-core while accepting it, and peptidoglycan biosynthetic process
    (GO:0009252), which the gene carries from other sources, is the informative statement. Nothing
    below the node is outside the claim: the plant members contribute to the plastid peptidoglycan
    layer, which is a cell wall in the same sense.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21071/PTHR21071-paint.tsv
    supporting_text: "PTHR21071\tPTN001843295\tGO:0071555\tP\tIBD\tfalse"
  - reference_id: PMID:9020778
    supporting_text: MurB catalyzes the second committed step in the synthesis of peptidoglycan, a key
      component of the bacterial cell wall.
  - reference_id: PMID:27325639
