  name:
    name: Endoplasmic Reticulum-Associated Degradation Derlin
    short: ERAD_Derlin
  description:
  - text: The Derlin family proteins are integral components of the endoplasmic reticulum-associated
      degradation (ERAD) pathway, which targets misfolded proteins for ubiquitin-dependent
      proteasomal degradation. They are involved in the retrotranslocation of misfolded
      proteins from the ER lumen into the cytosol. Derlins form channels within the
      ER membrane, some with lateral gates for direct access to membrane proteins.
      They interact with VCP/p97 and may play a role in ER stress-induced pre-emptive
      quality control by rerouting newly synthesized proteins for degradation. Derlin
      family members are implicated in the selective degradation of misfolded lumenal
      glycoproteins and may regulate cellular processes such as the insulin-like growth
      factor receptor signaling pathway.
