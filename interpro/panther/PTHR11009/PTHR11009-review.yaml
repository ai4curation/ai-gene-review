- assessed_term:
    id: GO:0030968
    label: endoplasmic reticulum unfolded protein response
  scope: NOT_APPLICABLE
  scope_reason: >-
    No reviewed human PTHR11009 member is a core UPR signal transducer. DERL2
    and DERL3 are induced by the UPR and all three Derlins protect the ER
    through ERAD, but that is downstream effector biology rather than direct
    participation in GO:0030968.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11009/PTHR11009-paint.tsv
    supporting_text: "PTHR11009\tPTN000109990\tGO:0030968\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0036503
    label: ERAD pathway
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR11009:SF1
    label: DERLIN-1
  - id: PANTHER:PTHR11009:SF5
    label: DERLIN-2
  - id: PANTHER:PTHR11009:SF4
    label: DERLIN-3
  scope_reason: >-
    ERAD is the conserved role of the three reviewed human DERL paralogs; the
    RHBDD2 branch does not have support for this pathway.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11009/PTHR11009-paint.tsv
    supporting_text: "PTHR11009\tPTN000109990\tGO:0036503\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0005047
    label: signal recognition particle binding
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR11009:SF1
    label: DERLIN-1
  - id: PANTHER:PTHR11009:SF5
    label: DERLIN-2
  - id: PANTHER:PTHR11009:SF4
    label: DERLIN-3
  scope_reason: >-
    Human DERL1, DERL2 and DERL3 bind SRP/SRPR and reroute selected nascent ER
    proteins during ER stress-induced pre-emptive quality control. Human RHBDD2
    is a Golgi inactive rhomboid-like branch with no SRP/SRPR-binding evidence
    and should not inherit a root SRP-binding assertion from the ERAD Derlins.
  supported_by:
  - reference_id: PMID:26565908
    supporting_text: Derlin family proteins (Derlins), which are ER-associated degradation components,
      reroute specific ER proteins, but not ER chaperones, from the translocon to the proteasome through
      interactions with the signal recognition particle (SRP)
  - reference_id: PMID:23386608
    supporting_text: only the S 2 fraction (the Golgi membrane fraction) contains an appreciable amount
      of RHBDD2 protein
