notes: >-
  The compact PANTHER 19.0 tree used for this review is cached at
  .cache/panther_trees/19.0/PTHR11009.json.gz. In that tree PTN002475685 is the
  human DERL1 leaf, PTN002475690 is the human DERL2 leaf, PTN002475689 is the
  human DERL3 leaf, and PTN002553948 is the human RHBDD2 leaf. No internal node
  contains all three reviewed human Derlin leaves while excluding RHBDD2, so the
  ER-membrane and ERAD corrections are represented as proposed IRDs at the
  RHBDD2 leaf. GO:0005047 is likewise scoped to the three human ERAD Derlins and
  away from RHBDD2; the committed 2026-08-28 PAINT slice has no GO:0005047 row
  for PTN000109990 to cross-check as a formal node_assessment.
