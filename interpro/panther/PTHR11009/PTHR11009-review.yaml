family_id: PANTHER:PTHR11009
family_name: DER1-LIKE PROTEIN, DERLIN
preferred_name: Derlin/rhomboid-like family
summary: >-
  PTHR11009 groups ER-resident Derlin-family retrotranslocation factors with
  more divergent rhomboid-like proteins. The reviewed human DERL1, DERL2 and
  DERL3 branches are multi-pass ER membrane ERAD factors. DERL1 helps form
  p97/VCP-coupled retrotranslocation complexes for misfolded lumenal or
  membrane substrates, while DERL2 and DERL3 are specialized for misfolded
  glycoprotein ERAD and connect EDEM-family recognition to p97. Human RHBDD2 is
  a Golgi/cis-Golgi inactive rhomboid-like protein with no established ERAD,
  SRP-binding or peptidase activity.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  PTN000109990 is the broad family root and spans the reviewed human DERL1,
  DERL2, DERL3 and RHBDD2 leaves plus active rhomboid-protease branches. Its ER
  membrane, ERAD and SRP-binding IBDs are supported for the human DERL paralogs
  but over-propagate to RHBDD2; its UPR IBD conflates UPR-regulated ERAD
  factors with core UPR signal transducers.
