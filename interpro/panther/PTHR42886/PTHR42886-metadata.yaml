  name:
    name: ABHD4/ABHD5 lipid metabolism
    short: ABHD4/ABHD5_lipid_metab
  description:
  - text: The ABHD4/ABHD5 protein family consists of enzymes involved in lipid metabolism
      and homeostasis. Members of this family function as acyltransferases, lysophospholipases,
      and phospholipases, contributing to various processes such as cardiolipin remodeling,
      triacylglycerol storage regulation, and the biosynthesis of bioactive lipids
      like N-acyl ethanolamines. These enzymes exhibit a preference for specific lipid
      substrates and acyl donors, and their activity is essential for maintaining
      cellular lipid balance. They play roles in energy distribution during nutritional
      deprivation, keratinocyte differentiation, and resistance to environmental stresses.
      The family is characterized by a conserved HXXXXD motif essential for acyltransferase
      activity, which may also bind the phosphate moiety of glycerol-3-phosphate.
