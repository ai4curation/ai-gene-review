term_assessments:
  - assessed_term:
      id: GO:0016747
      label: acyltransferase activity, transferring groups other than amino-acyl groups
    scope: FAMILY_WIDE
    scope_reason: >-
      Every characterized BKACE member transfers the acyl fragment of a beta-keto
      acid to CoA from acetyl-CoA, releasing acetoacetate; this parent holds
      whatever the substrate. It is the term the carnitine module asserts for the
      CdhC step, with the exact reaction (EC 2.3.1.317) proposed as a new GO
      term.
    supported_by:
      - reference_id: PMID:24240508
        supporting_text: >-
          we investigated the DUF849 Pfam family and unearthed 14 potential new
          enzymatic activities, leading to the designation of these proteins as
          β-keto acid cleavage enzymes.
      - reference_id: file:genes/PSEAE/cdhC/cdhC-uniprot.txt
        supporting_text: >-
          Reaction=3-dehydrocarnitine + acetyl-CoA = N,N,N-trimethylglycyl-CoA
          + acetoacetate;
  - assessed_term:
      id: GO:0043720
      label: 3-keto-5-aminohexanoate cleavage activity
    scope: UNRESOLVED
    scope_reason: The exact substrate is supported for characterized Kce enzymes but is not
      restricted to proteins named Kce. KT2440 Q88R31 is the directly screened BKACE511 and has
      substantial raw (S)-KAH signals; the positive-call threshold was not recovered, so this target
      claim remains unresolved. Other G5 enzymes show KAH promiscuity. Neither carnitine physiology
      nor family nomenclature proves absence of secondary KAH chemistry. No corresponding extracted
      PAINT IBD was available.
    supported_by:
      - reference_id:
          file:analysis/module_audits/bacterial_l_carnitine_catabolism/family-consultation/evidence.md
        supporting_text: KAH activity is therefore unresolved, not excluded because the protein
          participates in carnitine catabolism.
      - reference_id:
          file:analysis/module_audits/bacterial_l_carnitine_catabolism/psepk-consultation/evidence.md
        supporting_text: 'The target was screened: the prior provider/review statement that it had never
          been assayed is incorrect.'
