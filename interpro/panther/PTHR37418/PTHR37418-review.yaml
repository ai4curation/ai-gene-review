notes: >-
  The PAINT fetch resolved 17 nodes for PTHR37418 but no node-level GO
  annotations, so there are no IBD assertions to adjudicate. The InterPro2GO
  mapping of IPR008567 to 3-keto-5-aminohexanoate cleavage activity
  (GO:0043720) holds only for Kce orthologs with member-level evidence; the
  CdhC/BcoG and PP_0303 reviews modify it to GO:0016747. SF1 has no reviewed
  members in the entries inventory and is not described here.
