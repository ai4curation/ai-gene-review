family_id: PANTHER:PTHR37418
family_name: 3-KETO-5-AMINOHEXANOATE CLEAVAGE ENZYME-RELATED
preferred_name: Beta-keto acid cleavage enzymes (BKACE, former DUF849)
summary: >-
  Zinc-dependent TIM-barrel enzymes (Pfam PF05853, BKACE) that cleave a
  beta-keto acid with acetyl-CoA, transferring the acyl fragment beyond the
  keto group to CoA and releasing acetoacetate. A systematic screen of the
  former DUF849 family found many distinct substrate specificities. Reviewed
  members of SF2 include the lysine-fermentation 3-keto-5-aminohexanoate
  cleavage enzymes (Kce), 3-oxoadipate:acetyl-CoA acetyltransferase,
  3,5-dioxohexanoate:acetyl-CoA acetone transferase, and the
  3-dehydrocarnitine:acetyl-CoA trimethylamine transferases of aerobic
  L-carnitine catabolism (P. aeruginosa CdhC, S. meliloti BcoG).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All characterized members share the acetyl-CoA-dependent beta-keto acid
  cleavage chemistry, so the acyltransferase parent is safe family-wide, but the
  beta-keto acid substrate varies between members of the same subfamily
  (3-keto-5-aminohexanoate, 3-oxoadipate, 3,5-dioxohexanoate,
  3-dehydrocarnitine). Substrate-specific terms, including the InterPro-mapped
  3-keto-5-aminohexanoate cleavage activity, do not transfer from family or
  subfamily membership.
