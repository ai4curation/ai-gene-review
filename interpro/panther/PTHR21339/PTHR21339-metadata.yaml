  name:
    name: RSAD2 and Viperin antiviral
    short: RSAD2/Viperin_antiviral
  description:
  - text: The RSAD2 and Viperin protein family includes enzymes that are involved
      in the antiviral response of cells. Members of this family catalyze the conversion
      of nucleotides such as CTP, GTP, and UTP to their dehydrated forms via a SAM-dependent
      radical mechanism. These modified nucleotides act as chain terminators for viral
      RNA polymerases, thereby inhibiting viral replication. The family plays a crucial
      role in the antiviral state induced by interferons and can also modulate immune
      responses, such as facilitating T-cell activation and differentiation. Some
      family members are involved in the ubiquitination process that leads to IFN-beta
      production in dendritic cells. Additionally, certain bacterial members confer
      resistance to phages by blocking viral polymerase transcription.
