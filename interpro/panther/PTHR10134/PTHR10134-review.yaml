family_id: PANTHER:PTHR10134
family_name: CYTOCHROME B-C1 COMPLEX SUBUNIT RIESKE, MITOCHONDRIAL
preferred_name: Rieske iron-sulfur protein of cytochrome bc1 complex
summary: >-
  PTHR10134 is the Rieske iron-sulfur subunit (UQCRFS1, yeast Rip1) of mitochondrial complex III, which
  transfers electrons from ubiquinol to cytochrome c1 in the inner mitochondrial membrane.
functional_coherence: COHERENT
coherence_reason: All members are complex III Rieske subunits.
