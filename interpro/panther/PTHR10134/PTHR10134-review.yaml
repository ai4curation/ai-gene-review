  paint_snapshot: '20260528'
  node_taxon:
    id: NCBITaxon:2759
    label: Eukaryota
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    PTN000015359 is the eukaryotic Rieske iron-sulfur protein clade (UQCRFS1/Rip1, 170 leaves). The node's
    IBDs place it in respiratory chain complex III. The conflicting row is a Candida albicans RIP1 plasma-membrane
    IDA from a whole plasma-membrane proteome (PMID:19824013); detection in a fractionated membrane proteome
    does not show residence there, and abundant inner-membrane complex III subunits are common carry-over
    in such preparations. The loss of plasma membrane is supported.
