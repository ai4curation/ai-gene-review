  name:
    name: DHHC Palmitoyltransferase
    short: DHHC_Palmitoyltransf
  description:
  - text: The DHHC palmitoyltransferase family is characterized by the presence of
      a conserved DHHC domain, which is essential for its enzymatic activity as a
      palmitoyltransferase. Members of this family are involved in the post-translational
      modification of proteins through the addition of palmitate, a process known
      as palmitoylation. This modification can affect protein function, stability,
      and localization, and is critical for a variety of cellular processes including
      signal transduction, membrane trafficking, and cytoskeletal organization. Specific
      members within the family have been shown to palmitoylate a range of target
      proteins, such as casein kinase 1, SNAP25, DLG4/PSD95, GAD2, SYT1, HTT, and
      others, playing roles in neuronal function, axonogenesis, and Mg(2+) transport.
      The family includes proteins with diverse biological functions beyond palmitoylation,
      such as roles in pre-mRNA splicing, endocytosis, and mechanotransduction in
      cochlear hair cells.
