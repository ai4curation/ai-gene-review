  name:
    name: Tumor Necrosis Factor
    short: TNF
  description:
  - text: The Tumor Necrosis Factor (TNF) family is a group of cytokines that can
      cause cell death in certain tumor cell lines and play a role in immune system
      regulation. Members of this family bind to various TNF receptors, leading to
      diverse biological effects, including fever induction, cachexia, cell proliferation,
      differentiation, insulin resistance, angiogenesis, and osteoclastogenesis. They
      are involved in apoptosis, anti-apoptotic signaling, B-cell activation, T-cell
      proliferation, and cytokine production. Some family members also contribute
      to immune response termination by inducing activation-induced cell death in
      T-cells. The family includes ligands that act as costimulatory molecules for
      T-cells and are involved in immunoglobulin class switching.
