family_id: PANTHER:PTHR11471
family_name: TUMOR NECROSIS FACTOR FAMILY MEMBER
preferred_name: TNF superfamily cytokines (FASLG, TNF, LTA, LTB, TNFSF10/TRAIL, TNFSF11/RANKL, CD40LG, TNFSF14, TNFSF15)
summary: >-
  PANTHER family PTHR11471 encompasses metazoan tumor necrosis factor (TNF)
  superfamily ligands that share a C-terminal beta-jellyroll TNF-homology
  domain (THD) and assemble as non-covalent homotrimers (or LTA/LTB
  heterotrimers), generally synthesized as type II transmembrane proteins that
  can also be proteolytically shed as soluble extracellular cytokines. At the
  molecular-function and parent signaling level, the family is unified by
  extracellular or cell-surface cytokine activity (GO:0005125), tumor necrosis
  factor receptor superfamily binding (GO:0005164), and cell surface receptor
  signaling pathway (GO:0007166). However, individual subfamilies engage
  distinct TNFR-superfamily receptors with divergent intracellular signaling
  architectures: death-receptor ligands such as FASLG (SF33, engaging FAS/CD95)
  and TNFSF10/TRAIL (SF27, engaging TNFRSF10A/DR4 and TNFRSF10B/DR5) directly
  assemble FADD/caspase-8 death-inducing signaling complexes (DISCs) to execute
  extrinsic apoptosis (GO:0008625, GO:0036337, GO:0036462); TNF (SF23) and LTA
  (SF31) engage TNFR1/TNFR2 to balance complex-I NF-kappaB inflammatory
  signaling and complex-II apoptosis/necroptosis (GO:0033209); and TRAF-coupled
  costimulatory/developmental ligands such as CD40LG (SF5, engaging CD40) and
  TNFSF11/RANKL (SF3, engaging RANK/TNFRSF11A) drive B-cell activation/isotype
  switching and osteoclast differentiation (GO:0045672) without death domains.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All PTHR11471 members share the trimeric TNF-homology domain fold, type II
  membrane / secreted extracellular topology (GO:0005576, GO:0005886), and
  core cytokine activity (GO:0005125) / TNFR-superfamily receptor binding
  (GO:0005164) initiating cell-surface receptor signaling (GO:0007166). The
  family is MOSTLY_COHERENT rather than fully uniform because receptor
  specificity and downstream signaling pathways partition strictly by subfamily
  between death-domain-receptor apoptotic ligands (FASLG in SF33, TRAIL in
  SF27), dual survival/death inflammatory cytokines (TNF in SF23, LTA in SF31),
  and TRAF-binding non-apoptotic ligands (CD40LG in SF5, TNFSF11/RANKL in SF3).
