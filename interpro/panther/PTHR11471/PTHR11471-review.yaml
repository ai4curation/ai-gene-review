    diverged_from_family: true
    divergence_description: >-
      Engages the non-death-domain costimulatory receptor CD40 (TNFRSF5) to
      activate TRAF-dependent B-cell proliferation and immunoglobulin class
      switching rather than death-receptor apoptosis.
