subfamilies:
  - subfamily_id: PANTHER:PTHR11471:SF33
    clade_node_id: PANTHER:PTN002607446
    label: TUMOR NECROSIS FACTOR LIGAND SUPERFAMILY MEMBER 6
    description: >-
      Vertebrate Fas ligand (FASLG / CD95L / TNFSF6) orthologs that form
      homotrimers at the external side of the plasma membrane or as shed
      extracellular ectodomains and bind the death receptor FAS (CD95 /
      TNFRSF6) to assemble the FADD/CASP8 death-inducing signaling complex
      (DISC), initiating the Fas signaling pathway (GO:0036337) and extrinsic
      apoptotic signaling via death domain receptors (GO:0008625).
    representative_members:
      - id: UniProtKB:P48023
        label: FASLG_HUMAN
        gene_symbol: FASLG
        organism: Homo sapiens (Human)
        gene_review: genes/human/FASLG/FASLG-ai-review.yaml
      - id: UniProtKB:P41047
        label: FASLG_MOUSE
        gene_symbol: Fasl
        organism: Mus musculus (Mouse)
      - id: UniProtKB:P36940
        label: FASLG_RAT
        gene_symbol: Faslg
        organism: Rattus norvegicus (Rat)
    diverged_from_family: true
    divergence_description: >-
      Selectively binds the death receptor FAS (CD95) to nucleate the FADD/CASP8
      death-inducing signaling complex and initiate the Fas signaling pathway
      (GO:0036337) and extrinsic apoptosis (GO:0008625).
    supported_by:
      - reference_id: PMID:7826947
        supporting_text: induces apoptosis by binding to its receptor, Fas
      - reference_id: PMID:9228058
        supporting_text: >-
          The death-inducing receptor Fas is activated when cross-linked by the
          type II membrane protein Fas ligand (FasL).
  - subfamily_id: PANTHER:PTHR11471:SF27
    label: TUMOR NECROSIS FACTOR LIGAND SUPERFAMILY MEMBER 10
    description: >-
      TNFSF10 (TRAIL / Apo2L) orthologs that form homotrimers and bind death
      receptors TNFRSF10A (DR4) and TNFRSF10B (DR5) as well as decoy receptors
      TNFRSF10C/D, initiating the TRAIL-activated apoptotic signaling pathway
      (GO:0036462) and extrinsic apoptotic signaling via death domain receptors
      (GO:0008625).
    representative_members:
      - id: UniProtKB:P50591
        label: TNF10_HUMAN
        gene_symbol: TNFSF10
        organism: Homo sapiens (Human)
        gene_review: genes/human/TNFSF10/TNFSF10-ai-review.yaml
      - id: UniProtKB:P50592
        label: TNF10_MOUSE
        gene_symbol: Tnfsf10
        organism: Mus musculus (Mouse)
    diverged_from_family: true
    divergence_description: >-
      Selectively engages the death receptors DR4 (TNFRSF10A) and DR5
      (TNFRSF10B) to initiate the TRAIL-activated apoptotic signaling pathway
      (GO:0036462).
    supported_by:
      - reference_id: PMID:8663110
        supporting_text: >-
          Like Fas/Apo-1 ligand and TNF, the C-terminal extracellular region of
          Apo-2L (amino acids 114-281) exhibits a homotrimeric subunit
          structure. Soluble Apo-2L induces extensive apoptosis in lymphoid as
          well as non-lymphoid tumor cell lines.
      - reference_id: PMID:10549288
        supporting_text: >-
          Formation of a complex between Apo2L (also called TRAIL) and its
          signaling receptors, DR4 and DR5, triggers apoptosis by inducing the
          oligomerization of intracellular death domains.
  - subfamily_id: PANTHER:PTHR11471:SF23
    clade_node_id: PANTHER:PTN002607429
    label: TUMOR NECROSIS FACTOR
    description: >-
      Vertebrate tumor necrosis factor (TNF / TNF-alpha / TNFSF2) orthologs
      that signal through TNFRSF1A (TNFR1) and TNFRSF1B (TNFR2) to initiate the
      tumor necrosis factor-mediated signaling pathway (GO:0033209), activating
      complex-I canonical NF-kappaB inflammatory signaling (GO:0043123) and,
      when complex-I survival checkpoints are bypassed, complex-II
      FADD/caspase-8 extrinsic apoptosis (GO:0008625) or necroptosis.
    representative_members:
      - id: UniProtKB:P01375
        label: TNFA_HUMAN
        gene_symbol: TNF
        organism: Homo sapiens (Human)
        gene_review: genes/human/TNF/TNF-ai-review.yaml
      - id: UniProtKB:P06804
        label: TNFA_MOUSE
        gene_symbol: Tnf
        organism: Mus musculus (Mouse)
      - id: UniProtKB:P16599
        label: TNFA_RAT
        gene_symbol: Tnf
        organism: Rattus norvegicus (Rat)
    diverged_from_family: true
    divergence_description: >-
      Engages TNFR1 and TNFR2 to initiate the tumor necrosis factor-mediated
      signaling pathway (GO:0033209) through sequential membrane complex I
      (TRADD/RIPK1/TRAF2 NF-kappaB activation) and cytoplasmic complex II
      (FADD/CASP8 apoptosis).
    supported_by:
      - reference_id: PMID:12887920
        supporting_text: >-
          The initial plasma membrane bound complex (complex I) consists of
          TNFR1, the adaptor TRADD, the kinase RIP1, and TRAF2 and rapidly
          signals activation of NF-kappa B. In a second step, TRADD and RIP1
          associate with FADD and caspase-8, forming a cytoplasmic complex
          (complex II).
  - subfamily_id: PANTHER:PTHR11471:SF3
    clade_node_id: PANTHER:PTN008518640
    label: TUMOR NECROSIS FACTOR LIGAND SUPERFAMILY MEMBER 11
    description: >-
      Tetrapod TNFSF11 (RANKL / TRANCE / OPGL) orthologs that bind the
      non-death-domain receptor TNFRSF11A (RANK) and decoy receptor TNFRSF11B
      (OPG) to drive TRAF6-dependent NF-kappaB activation and osteoclast
