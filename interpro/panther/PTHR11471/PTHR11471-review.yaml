        gene_symbol: TNFSF11
        organism: Homo sapiens (Human)
      - id: UniProtKB:O35235
        label: TNF11_MOUSE
        gene_symbol: Tnfsf11
        organism: Mus musculus (Mouse)
      - id: UniProtKB:Q9ESE2
        label: TNF11_RAT
        gene_symbol: Tnfsf11
        organism: Rattus norvegicus (Rat)
    diverged_from_family: true
    divergence_description: >-
      Binds the non-death-domain receptor RANK (TNFRSF11A) to drive
      TRAF6-mediated osteoclast differentiation (GO:0045672) rather than
      death-receptor apoptosis.
  - subfamily_id: PANTHER:PTHR11471:SF5
    label: CD40 LIGAND
    description: >-
      Tetrapod CD40LG (CD40L / CD154 / TNFSF5) orthologs expressed on activated
      T cells that engage the non-death-domain costimulatory receptor CD40
      (TNFRSF5) on antigen-presenting cells and B cells to promote B-cell
      proliferation, germinal center formation, and immunoglobulin isotype
      switching rather than apoptosis.
    representative_members:
