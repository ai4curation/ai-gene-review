term_assessments:
- assessed_term:
    id: GO:0003985
    label: acetyl-CoA C-acetyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Asserted by mevalonate_pathway and ketogenesis. It is the defining activity of the acetoacetyl-CoA
    thiolase subfamilies, and the long-chain thiolases also act on acetoacetyl-CoA, which is why
    their reviews retain it as non-core.
  supported_by:
  - reference_id: file:interpro/panther/PTHR18919/PTHR18919-paint.tsv
    supporting_text: "PTHR18919\tPTN000432378\tGO:0003985\tF\tIBD\tfalse"
