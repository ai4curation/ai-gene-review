  label: ACETYL-COA ACETYLTRANSFERASE, CYTOSOLIC
  description: >-
    Mixed subfamily. Degradative bacterial thiolases: PcaF/CatF 3-oxoadipyl-CoA thiolases of the
    beta-ketoadipate pathway (Pseudomonas putida, P. aeruginosa, Pseudomonas sp. B13,
    Acinetobacter baylyi) and FadI anaerobic beta-oxidation thiolases. Biosynthetic
