    supporting_text: >-
      Phylogenetic propagation of the core biological process. ACAA2 catalyzes the final
      (thiolytic) step of each beta-oxidation cycle.
- assessed_term:
    id: GO:0033812
    label: 3-oxoadipyl-CoA thiolase activity
  scope: UNRESOLVED
  scope_reason: >-
    The beta-ketoadipate-pathway thiolase activity belongs to the PcaF/CatF clade, which PANTHER
    places in the mixed SF107 together with FadI, PhaA and ACAT2, so no subfamily-level grant is
    safe. The NCBIfam TIGR02430 (pcaF) model identifies the clade and is used as the family term
    by the beta_ketoadipate_lower_pathway module.
  supported_by:
  - reference_id: file:genes/PSEPK/pcaF/pcaF-uniprot.txt
    supporting_text: NCBIfam; TIGR02430; pcaF; 1.
  - reference_id: PMID:11741863
    supporting_text: >-
      ORF4, termed catF, codes for a protein of 401 amino acid residues
      with a predicted mass of 41,678 Da with 3-oxoadipyl-CoA thiolase activity.
