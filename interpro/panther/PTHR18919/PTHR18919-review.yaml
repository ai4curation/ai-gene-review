family_id: PANTHER:PTHR18919
family_name: ACETYL-COA C-ACYLTRANSFERASE
preferred_name: Thiolase family (acetoacetyl-CoA thiolase and 3-ketoacyl-CoA thiolase)
summary: >-
  Class II (biosynthetic) and class I (degradative) thiolases cleave or form carbon-carbon bonds
  between acyl-CoAs. Acetoacetyl-CoA thiolases (S. cerevisiae ERG10, S. pombe erg10, human ACAT1/ACAT2,
  bacterial AtoB) condense two acetyl-CoA for the mevalonate pathway and ketone body metabolism.
  3-Ketoacyl-CoA thiolases (human ACAA2, the HADHB beta subunit of the mitochondrial trifunctional
  protein, bacterial FadA/FadI, PcaF) cleave longer 3-oxoacyl-CoAs in beta-oxidation and aromatic
  catabolism.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Chain-length and substrate specificity differ by subfamily: acetoacetyl-CoA (SF165, SF156, SF164,
  SF161), long-chain 3-ketoacyl-CoA (SF145, SF153) and aromatic or other substrates (PcaF and FadI
  in SF107, PaaJ in SF12). SF107 is itself functionally mixed: it holds the degradative
  3-oxoadipyl-CoA thiolase PcaF of the beta-ketoadipate pathway and the beta-oxidation thiolase
  FadI, but also biosynthetic acetoacetyl-CoA thiolases (PhaA of polyhydroxybutyrate synthesis,
  human cytosolic ACAT2), and its members receive IBAs from different PAINT nodes (PcaF of
  P. aeruginosa from PTN001823071, FadI and ACAT2 from PTN000432378).
