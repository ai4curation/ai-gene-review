    supporting_text: >-
      PAINT IBA from the acetoacetyl-CoA thiolase node PTN000432378 (cytosolic ACAT2-type thiolases,
      seeded with Erg10
- assessed_term:
    id: GO:0006635
    label: fatty acid beta-oxidation
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Fatty acid beta-oxidation is the role of the degradative thiolases (ACAA2, HADHB, FadI/Acaa).
    Mitochondrial ACAT1 (SF156) also completes beta-oxidation of short-chain substrates and its review
    keeps the term. SF107 is listed for FadI, but it also contains the beta-ketoadipate-pathway
    PcaF thiolases (excepted below) and biosynthetic PhaA/ACAT2 acetoacetyl-CoA thiolases, so
    the term should not be applied to SF107 members without member-level evidence.
  member_exceptions:
  - member:
      id: UniProtKB:Q88N39
      label: Beta-ketoadipyl-CoA thiolase
      gene_symbol: pcaF-I
      organism: Pseudomonas putida KT2440
      gene_review: genes/PSEPK/pcaF/pcaF-ai-review.yaml
    exception_reason: >-
      PcaF is the 3-oxoadipyl-CoA thiolase of the beta-ketoadipate pathway; its natural
      substrate is beta-ketoadipyl-CoA and no physiological fatty acid beta-oxidation role is
      known.
    pruned_node_id: PANTHER:PTN001823071
    supported_by:
    - reference_id: PMID:32647822
      supporting_text: β-Ketoadipyl CoA is the natural substrate of PcaF
  - member:
      id: UniProtKB:Q43974
      label: Beta-ketoadipyl-CoA thiolase
      gene_symbol: pcaF
      organism: Acinetobacter baylyi ADP1
      gene_review: genes/ACIAD/pcaF/pcaF-ai-review.yaml
    exception_reason: >-
      Acinetobacter PcaF is encoded in the pca operon for protocatechuate catabolism and
      catalyzes the last beta-ketoadipate-pathway step; no fatty acid beta-oxidation role is
      known.
    pruned_node_id: PANTHER:PTN001823071
    supported_by:
    - reference_id: PMID:8063101
      supporting_text: >-
        The six enzymes required for catabolism of protocatechuate to succinate
        and acetylCoA are encoded by the pca genes
  applicable_subfamilies:
  - id: PANTHER:PTHR18919:SF145
    label: 3-KETOACYL-COA THIOLASE, MITOCHONDRIAL
