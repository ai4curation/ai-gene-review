- subfamily_id: PANTHER:PTHR18919:SF12
  label: ACYLTRANSFERASE RV0859-RELATED
  description: >-
    Per its UniProt cross-reference and InterPro's member list, this subfamily holds E. coli PaaJ
    (P0C7L2, K-12; P0C7L3, strain W), the 3-oxoadipyl-CoA / 3-oxo-5,6-dehydrosuberyl-CoA thiolase
    of phenylacetate catabolism. PANTHER 19.0's own E. coli classification file instead places
    P0C7L2 in PTHR43853:SF2 (3-OXOADIPYL-COA_3-OXO-5,6-DEHYDROSUBERYL-COA THIOLASE), together with
    P. putida KT2440 PaaJ, and the PaaJ IBA rows descend from the PTHR43853 root node
    PTN001823071. The PaaJ assignment to this subfamily is therefore disputed; PTHR43853:SF2 is the
    better-supported home and is what the phenylacetate_catabolism module uses.
  representative_members:
  - id: UniProtKB:P0C7L2
    label: 3-oxoadipyl-CoA/3-oxo-5,6-dehydrosuberyl-CoA thiolase
    gene_symbol: paaJ
    organism: Escherichia coli (strain K12)
    gene_review: genes/ECOLI/paaJ/paaJ-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    PaaJ cleaves ring-derived 3-oxo-5,6-dehydrosuberyl-CoA and 3-oxoadipyl-CoA in aromatic
    catabolism, not acetoacetyl-CoA or fatty acyl-CoAs; fatty acid beta-oxidation does not hold
    for it.
  supported_by:
  - reference_id: file:genes/ECOLI/paaJ/paaJ-uniprot.txt
    supporting_text: "DR   PANTHER; PTHR18919:SF12; ACYLTRANSFERASE RV0859-RELATED; 1."
  - reference_id: file:genes/ECOLI/paaJ/paaJ-uniprot.txt
    supporting_text: >-
      FUNCTION: Catalyzes the thiolytic cleavage of the beta-keto C8
      intermediate 3-oxo-5,6-dehydrosuberyl-CoA with CoA to yield the C6
      intermediate 2,3-dehydroadipyl-CoA and acetyl-CoA.
