notes: >-
  PaaJ classification conflict: E. coli PaaJ (P0C7L2) carries the UniProt cross-reference
  PTHR18919:SF12, but PANTHER 19.0's E. coli classification file places it in PTHR43853:SF2 and its
  PAINT IBAs descend from the PTHR43853 root node PTN001823071, which therefore appears in this
  slice as an out-of-family node. Node mapping from PANTHER's PAINT_TreeGrafter_Annotations_TOTAL.txt
  (paint/current, 2026-10-23). The FAMILY_WIDE scope of GO:0003985 was set in an earlier pass; no
  acetoacetyl-CoA thiolase activity is documented for SF12 PaaJ, which acts on 3-oxoadipyl-CoA.
  Module consistency: mevalonate_pathway and ketogenesis select the base family; SF165 (ERG10) and
  SF156 (ACAT1) are the specific selectors. beta_ketoadipate_lower_pathway grounds PcaF with
  NCBIfam TIGR02430 rather than this family or SF107, because SF107 mixes degradative PcaF/FadI
  with biosynthetic PhaA/ACAT2 thiolases.
