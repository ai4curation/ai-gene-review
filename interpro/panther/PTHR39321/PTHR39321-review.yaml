  - id: UniProtKB:Q9BZQ4
  - id: UniProtKB:Q9HAN9
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Every seed is a eukaryotic NMNAT. Bacterial NadD in SF3 adenylylates NMN
    much more slowly than NaMN (at least 20-fold for E. coli NadD), so NMN
    adenylylation is real in vitro but not established as a physiological
    function in this subfamily; the E. coli nadD review marks this IBA as
    over-annotated. A NOT or loss at the NadD clade would keep the term on the
    eukaryotic NMNATs that use both substrates.
