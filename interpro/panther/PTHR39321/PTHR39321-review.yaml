family_id: PANTHER:PTHR39321
family_name: NICOTINATE-NUCLEOTIDE ADENYLYLTRANSFERASE-RELATED
preferred_name: Bacterial nicotinate mononucleotide adenylyltransferase (NadD) family
summary: >-
  Bacterial NadD enzymes that adenylylate nicotinate D-ribonucleotide (NaMN) to
  deamido-NAD+, the step shared by L-aspartate de novo NAD+ synthesis and
  Preiss-Handler salvage. All reviewed members in the release used here fall in
  the single subfamily SF3, which includes E. coli, B. subtilis and P. putida
  NadD. The characterized members strongly prefer NaMN over NMN. PANTHER names
  SF3 "phosphopantetheine adenylyltransferase", which does not describe its
  reviewed members. The local PAINT file for this family carries IBDs on
  PTN000247701, the node also used for the eukaryotic NMNAT family PTHR12039,
  and most of that node's seeds are eukaryotic NMNATs.
functional_coherence: COHERENT
coherence_reason: >-
  The single subfamily consists of NadD-type NaMN adenylyltransferases; the
  characterized members share the NaMN-preferring activity.
