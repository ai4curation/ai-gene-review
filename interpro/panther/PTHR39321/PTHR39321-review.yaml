notes: >-
  E. coli NadD (P0A752) is assigned to PTHR39321:SF3 by its UniProt PANTHER
  cross-reference but to PTHR12039:SF0 by the PANTHER classification files used
  to build the member index; the index keeps both. B. subtilis NadD (P54455),
  which both sources place in PTHR39321:SF3, is therefore used as the reference
  protein.
