family_id: PANTHER:PTHR13355
family_name: GLUCOSAMINE 6-PHOSPHATE N-ACETYLTRANSFERASE
preferred_name: Glucosamine-6-phosphate N-acetyltransferase (GNA1/GNPNAT1) GNAT family
summary: >-
  GNAT acetyltransferases that acetylate glucosamine 6-phosphate to GlcNAc 6-phosphate in UDP-GlcNAc
  synthesis (S. cerevisiae GNA1, S. pombe gna1, human GNPNAT1, plant GNA1). Smaller subfamilies hold
  bacterial and plastid GNATs of other specificity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  GlcN6P acetylation holds for SF11 and SF19; the bacterial SF22/SF9 and plastid GNAT3 subfamilies
  have other substrates.
