notes: |-
  DROME/NtR: Q9W288, 585 aa, sequence version 1; cohorts FLY41. Source extracts preserve evidence codes, reviewed status and generated-description flags. PANTHER placement is a classification observation. Curated biological prose and member experiments inform the boundary, with unresolved coverage stated explicitly. No ancestral node placement or residue-loss projection is asserted without a checked tree/alignment and sequence anchor. Term assessments include functional-transfer hypotheses and are not a transcription of ProtNLM output; the cohort prediction snapshots remain authoritative about what was emitted.

  Placement evidence (2026-10-02)

  | Protein / source | Frozen UniProt placement (historical observation) | Official PANTHER 19.0 row |
  |---|---|---|
  | Q9W288 (fruit_fly / 1707) | PTHR36695:SF12 — AGAP008648-PA | PTHR18945:SF430 |

  Parent membership is unresolved. This protein is comparative evidence outside structured membership; neither parent is asserted as a replacement.

  NtR Q9W288 has a neuronal-channel ligand-binding architecture and a hydrophobic C-terminal membrane region consistent with a Cys-loop channel subunit. The published phylogeny places Dmel NTR outside both shaded nicotinic acetylcholine-receptor groups (PMID:30429615, Extended Data Figure 10d), and the retained FlyBase evidence assigns unclassified ligand-gated ion-channel subunits. These are comparative target observations, not an established in-family anchor for PTHR36695. They identify neither a gating ligand nor an ion selectivity and do not prove that acetylcholine cannot gate NtR. No exact-target electrophysiological gating assay was available in the inspected sources. The additional methyltransferase-domain match does not establish a methyltransferase reaction. GO:0005230 (extracellular ligand-gated monoatomic ion channel activity) remains an unresolved target question; with no established in-family anchor it is no longer a structured family term assessment. Its original source references and the complete earlier assessment remain available below and in the linked prior revision.

  The table records source observations, not live membership declarations. Complete earlier descriptors and assessments are preserved at https://github.com/ai4curation/ai-gene-review/blob/e82261ba811dadbb944cd3770e7fdd2889ec69a4/interpro/panther/PTHR36695/PTHR36695-review.yaml. Current structured term assessments are authoritative; duplicate historical copies have been removed from these notes.

  Persistent provenance: file:projects/PROTNLM_EVALUATION/family-curation/PANTHER-classification-conflicts-2026-10-02.md. Diagnostic run 36943928592, compact artifact 11201891369, SHA256 9861e63fc8279e570e57ad56d639c36edafeac62809ee9867681a27175707136. Official sequence-file dates, exact row labels, URLs and verification limits are retained in that report. Full raw-body hashes remain runner-recorded rather than locally recomputed. No PAINT-node placement or replacement family is inferred. Review remains IN_PROGRESS.

  Bounded comparator audit (2026-10-02): source run 36956025748, compact artifact 11205408249, SHA256 7df7b0367d5d10dc5be4c919adc9af3a89ea3e057ba788fc4b067eaa0d926931. All 17 outcomes were authenticated; the 15 matching rows were replayed locally against the unchanged parser. The two whole-file NO_MATCH results are runner observations. The persistent report records all 17 targets, original labels and source dates. Complete source-body hashes are runner-recorded, not independently recomputed locally. Classification observations do not establish evolutionary cause or complete family coverage.

  The GO:0005230 assessment records the investigated NtR channel question, not an established in-family activity. Its supported_by objects are restored from the earlier assessment without changing the source excerpts. NtR is not reintroduced as an unnumbered representative: omitting subfamily_id would bypass the current membership check but would still imply a parent placement contradicted by the observed official row. The biological summary describes the comparative channel architecture and does not establish that every currently classified PTHR36695 member has that architecture.
