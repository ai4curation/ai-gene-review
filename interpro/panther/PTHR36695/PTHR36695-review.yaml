notes: |-
  DROME/NtR: Q9W288, 585 aa, sequence version 1; cohorts FLY41. Source extracts preserve evidence codes, reviewed status and generated-description flags. PANTHER placement is a classification observation. Curated biological prose and member experiments inform the boundary, with unresolved coverage stated explicitly. No ancestral node placement or residue-loss projection is asserted without a checked tree/alignment and sequence anchor. Term assessments include functional-transfer hypotheses and are not a transcription of ProtNLM output; the cohort prediction snapshots remain authoritative about what was emitted.

  PANTHER classification conflict assessment (2026-10-01). Unresolved parent-family classification for UniProtKB:Q9W288: the frozen UniProt record records PTHR36695:SF12 (AGAP008648-PA), whereas the authenticated official PANTHER 19.0 fruit_fly sequence-classification row 1707 records PTHR18945:SF430 (ACETYLCHOLINE RECEPTOR SUBUNIT ALPHA-LIKE 2-RELATED). The latter is also the tested upstream membership index assignment. This target is retained below as unresolved comparative evidence, not an asserted member of either parent family. No replacement family or ancestral placement is inferred.

  Withdraw the sole asserted member; retain UNKNOWN coherence and UNRESOLVED channel activity. Move the complete NtR functional interpretation to unresolved comparative notes. No channel function is newly assigned to the unresolved family or acetylcholine gating inferred from the alternate label.

  Provenance: diagnostic run 36943928592, attempt 1, source head 86ffe004ffe04b167981c081a14c1c526fb24da2; compact artifact 11201891369 (SHA256 9861e63fc8279e570e57ad56d639c36edafeac62809ee9867681a27175707136). The official inputs declare PTHR19.0 and HTTP Last-Modified 2024-06-20; panther.obo and the parser also declare 19.0. The UniProt and PAINT snapshots are later observations but do not establish a different PANTHER release. Full raw-source digests are runner-recorded, not independently recomputed from this compact artifact. No PAINT node or alternate functional assignment is inferred. This review is IN_PROGRESS until the conflicting placement is resolved.

  Preserved previous placement and biological interpretation (historical evidence; membership assertions below are not current claims):
  summary: NtR belongs to an insect branch of the Cys-loop ligand-gated ion-channel superfamily. The neuronal-channel
    ligand-binding architecture and C-terminal membrane region support a channel-subunit role, while its
    gating ligand and ion selectivity remain unidentified.
  coherence_reason: The published Cys-loop phylogeny places Dmel NTR outside both nicotinic acetylcholine-receptor
    groups (PMID:30429615, Extended Data Figure 10d), and FlyBase classifies it with unclassified ligand-gated
    ion-channel subunits. This supports a channel-family mechanism without identifying acetylcholine, another
    transmitter or a particular ion as its ligand/substrate. No exact-target electrophysiological gating
    assay is available in the inspected sources, so the exhaustive activity grant remains unresolved. The
    additional methyltransferase-domain match is not evidence for a methyltransferase reaction.
