family_id: PANTHER:PTHR36695
family_name: AGAP008648-PA
summary: >-
  Drosophila NtR provides comparative biology for a Cys-loop-channel-like protein, but its
  membership in the AGAP008648-PA (PTHR36695) family is unresolved. It combines a neuronal-channel
  ligand-binding region with a hydrophobic membrane-spanning region. NtR lies outside the canonical
  nicotinic acetylcholine-receptor groups in the cited phylogeny; sequence resemblance alone does
  not determine its gating ligand or ion selectivity.
functional_coherence: UNKNOWN
coherence_reason: >-
  No current representative or complete cached member inventory establishes an in-family functional
  anchor. NtR Q9W288 has conflicting parent assignments, so its channel architecture and
  phylogenetic context remain comparative target evidence. Neither channel activity nor a gating
  ligand is assigned to PTHR36695.
subfamilies: []
term_assessments:
- assessed_term:
    id: GO:0005230
    label: extracellular ligand-gated monoatomic ion channel activity
  scope: UNRESOLVED
  scope_reason: >-
    The investigated question is whether the channel-like NtR comparison supports extracellular ligand-gated
    ion channel activity. Its domain architecture, FlyBase grouping and the cited phylogenetic context
    motivate the question but do not establish a gating ligand, ion selectivity or measured channel activity.
    Moreover, NtR Q9W288 has a positive cross-parent conflict: frozen PTHR36695:SF12 versus official PTHR18945:SF430.
    It is comparative evidence, not a structured PTHR36695 member. Preserve this investigated question
    as UNRESOLVED without granting channel activity or implying that the cited target establishes the
    biological membership of this numbered family.
