family_id: PANTHER:PTHR48083
family_name: MEDIUM-CHAIN SPECIFIC ACYL-COA DEHYDROGENASE, MITOCHONDRIAL-RELATED
preferred_name: Acyl-CoA dehydrogenase family (FadE, MCAD, LCAD, ACAD10/11 and ACAD-fold monooxygenases)
summary: FAD-dependent proteins of the acyl-CoA dehydrogenase fold, with heterogeneous chemistry and substrate
  ranges. Bacterial extended FadE proteins in SF18 participate in fatty-acyl-CoA dehydrogenation, but
  their physiological electron acceptor is unresolved; the ETF requirement in GO:0003995 and its chain-specific
  descendants is not established by growth genetics. Mitochondrial MCAD and LCAD are distinct characterized
  implementations. The family also includes HsaA monooxygenases and enzymes of specialized metabolism,
  so an ACAD fold does not by itself establish fatty-acid beta-oxidation.
functional_coherence: HETEROGENEOUS
coherence_reason: 'Shared fold does not imply a shared complete reaction: HsaA performs monooxygenation,
  while acyl-CoA dehydrogenases vary in substrate range and electron-transfer machinery. The family-root
  PAINT assertions span these distinct clades. SF18 generic acyl-CoA oxidation is supported, but ETF-linked
  chemistry must remain ungranted until its acceptor is established.'
