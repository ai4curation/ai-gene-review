family_id: PANTHER:PTHR48083
family_name: MEDIUM-CHAIN SPECIFIC ACYL-COA DEHYDROGENASE, MITOCHONDRIAL-RELATED
preferred_name: Acyl-CoA dehydrogenase family (FadE, MCAD, LCAD, ACAD10/11 and ACAD-fold monooxygenases)
summary: >-
  FAD-dependent flavoenzymes of the acyl-CoA dehydrogenase fold. Most characterized members are acyl-CoA
  dehydrogenases that start each turn of fatty acid beta-oxidation by oxidizing an acyl-CoA to trans-2-enoyl-CoA
  with electron-transfer flavoprotein as acceptor: the bacterial FadE enzymes (SF18; E. coli FadE, Pseudomonas
  putida FadE), mitochondrial medium-chain (SF2, ACADM) and long-chain (SF20, ACADL) acyl-CoA dehydrogenases,
  and ACAD10 (SF35) and ACAD11 (SF13). The family also contains ACAD-fold proteins with other chemistry,
  notably the flavin-dependent monooxygenase HsaA of mycobacterial steroid degradation (SF19), and several
  fungal and actinobacterial secondary-metabolism dehydrogenases (SF1, SF5, SF15, SF17, SF31) whose substrates
  are not fatty acyl-CoAs.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  FAD binding and the ACAD fold are shared, but the reaction is not: SF19 HsaA is an oxygenase, and chain-length
  preference differs between the FadE, MCAD and LCAD subfamilies. Acyl-CoA dehydrogenase activity and
  its role in beta-oxidation are supported by experiment for SF18, SF2 and SF20, but PAINT places both
  at the family root, which also covers SF19.
