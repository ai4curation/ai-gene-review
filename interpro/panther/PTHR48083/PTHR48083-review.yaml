family_id: PANTHER:PTHR48083
family_name: MEDIUM-CHAIN SPECIFIC ACYL-COA DEHYDROGENASE, MITOCHONDRIAL-RELATED
preferred_name: Medium-Chain Specific Acyl-Coa Dehydrogenase, Mitochondrial-Related
summary: MEDIUM-CHAIN SPECIFIC ACYL-COA DEHYDROGENASE, MITOCHONDRIAL-RELATED (PANTHER:PTHR48083) is characterized
  in PANTHER PAINT across 6 ancestral PTN node(s) (PANTHER:PTN000098033, PANTHER:PTN000098409, PANTHER:PTN000744083,
  PANTHER:PTN000856662 (+2 more)) with 13 IBD node assertion(s) and 0 term(s) carrying negated IRD/IKR
  branch blocks, covering mitochondrion (GO:0005739, CC), medium-chain fatty acyl-CoA dehydrogenase activity
  (GO:0070991, MF), medium-chain fatty acid catabolic process (GO:0051793, BP), flavin adenine dinucleotide
  binding (GO:0050660, MF) and 7 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR48083 (MEDIUM-CHAIN SPECIFIC ACYL-COA DEHYDROGENASE,
  MITOCHONDRIAL-RELATED) span 6 distinct ancestral PTN nodes (PANTHER:PTN000098033, PANTHER:PTN000098409,
  PANTHER:PTN000744083, PANTHER:PTN000856662, PANTHER:PTN000856953 (+1 more)) with different molecular
  function assignments across clades (medium-chain fatty acyl-CoA dehydrogenase activity (GO:0070991),
  oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen,
  reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen (GO:0016712), long-chain
  fatty acyl-CoA dehydrogenase activity (GO:0004466), acyl-CoA dehydrogenase activity (GO:0003995) and
  1 additional molecular function term(s)), indicating clade-level functional specialization across the
  family.
