  name:
    name: Folliculin-Interacting
    short: FNIP
  description:
  - text: The FNIP family proteins function as binding partners of the GTPase-activating
      protein FLCN, playing a key role in the cellular response to amino acid availability.
      They regulate the non-canonical mTORC1 signaling cascade that controls MiT/TFE
      factors TFEB and TFE3. FNIP proteins are involved in the assembly and disassembly
      of the lysosomal folliculin complex, which modulates mTORC1 activity and influences
      the nuclear translocation of TFEB and TFE3. They also contribute to autophagy
      regulation through interaction with GABARAP following phosphorylation by ULK1.
      Additionally, FNIP proteins serve as co-chaperones of HSP90AA1/Hsp90, inhibiting
      its ATPase activity and affecting the activation of kinase and non-kinase client
      proteins. They compete with AHSA1 for HSP90AA1 binding, providing a regulatory
      mechanism for chaperoning client proteins. FNIP proteins are also implicated
      in the reductive stress response and may play a role in apoptosis signaling
      pathways.
