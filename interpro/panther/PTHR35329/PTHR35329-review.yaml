family_id: PANTHER:PTHR35329
family_name: CHITIN SYNTHASE EXPORT CHAPERONE
preferred_name: Fungal CHS7 chitin-synthase export chaperones
summary: >-
  PTHR35329 is a Chs7-domain chitin synthase export chaperone family. Its
  cached local fungal members all belong to PTHR35329:SF2, while Neurospora
  CSE-8/Q1K536 is in SF1 and serves the class I chitin synthase CHS-3. The
  single PAINT ancestor PTN002175570 correctly carries the fungal CHS7-family
  endoplasmic reticulum membrane, protein folding chaperone, chitin biosynthetic
  process, and protein folding assertions.
functional_coherence: COHERENT
coherence_reason: >-
  PTHR35329 has two PANTHER subfamilies with the same official label. The local
  member table contains 19 cached fungal members, all in the CHS7/CSE-7-like SF2
  branch, and UniProt places N. crassa CSE-8/NCU01814 in the otherwise uncached
  SF1 branch. Reviewed S. cerevisiae, C. albicans, and N. crassa SF2 members and
  the N. crassa CSE-8 literature all support a conserved multipass ER membrane
  chaperone/export role for cognate chitin synthases.
reference_protein:
