    supporting_text: "PTHR35329\tPTN002175570\tGO:0005789\tC\tIBD\tfalse\tSGD:S000001184\ttaxon:4751\t20170228"
  - reference_id: PMID:29601947
    supporting_text: >-
      CSE-7 was revealed at delimited regions of the ER at the immediacies
      of nuclei, at the NEC, and remarkably also at septa and the SPK.
- node_id: PANTHER:PTN002175570
  asserted_term:
    id: GO:0044183
