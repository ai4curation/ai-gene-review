    id: NCBITaxon:4751
    label: Fungi
  assessment: SOUND
  assessment_reason: >-
    PTN002175570 is the correct fungal CHS7-family ancestor for the ER-membrane
    assertion. S. cerevisiae Chs7 is an ER membrane protein, and direct N.
    crassa CSE-7 imaging shows ER-associated localization without contradicting
    the inherited ER-membrane placement.
  supported_by:
