  assessment: SOUND
  assessment_reason: >-
    The 2026 GO:0044183 IBD is the current molecular-function placement for
    fungal CHS7 proteins, replacing obsolete unfolded-protein-binding transfers
    with a better description of the Shr3-like ER chaperone role.
  supported_by:
  - reference_id: file:interpro/panther/PTHR35329/PTHR35329-paint.tsv
    supporting_text: "PTHR35329\tPTN002175570\tGO:0044183\tF\tIBD\tfalse\tSGD:S000001184\ttaxon:4751\t20260611"
  - reference_id: PMID:15623581
    supporting_text: >-
      These findings indicate that polytopic membrane proteins depend on
      specialized membrane-localized chaperones to prevent inappropriate
      interactions between membrane-spanning segments as they insert and fold
      in the lipid bilayer of the ER membrane.
  - reference_id: PMID:39926406
    supporting_text: >-
      These proteins function as specialized chaperones that prevent the
      aggregation of PM proteins at the ER by ensuring proper folding
