- assessed_term:
    id: GO:0044183
    label: protein folding chaperone
  scope: FAMILY_WIDE
  scope_reason: >-
    GO:0044183 is appropriate for fungal CHS7/CSE proteins across the sampled
    SF2 branch and the CSE-8-like SF1 branch; the PAINT row is correctly placed
    on the fungal PTN002175570 ancestor.
  supported_by:
  - reference_id: file:interpro/panther/PTHR35329/PTHR35329-paint.tsv
    supporting_text: "PTHR35329\tPTN002175570\tGO:0044183\tF\tIBD\tfalse\tSGD:S000001184\ttaxon:4751\t20260611"
- assessed_term:
    id: GO:0006031
    label: chitin biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    GO:0006031 is appropriate for fungal CHS7-family export chaperones because
    they directly prevent ER aggregation and enable ER export of cognate chitin
    synthases, contributing client-specific chaperone work needed for chitin
    synthase biogenesis. The client differs by branch: SF2 includes class IV
    CHS-4/CaChs3 clients, whereas the SF1 CSE-8 branch acts on class I CHS-3.
  supported_by:
  - reference_id: file:interpro/panther/PTHR35329/PTHR35329-paint.tsv
    supporting_text: "PTHR35329\tPTN002175570\tGO:0006031\tP\tIBD\tfalse\tCGD:CAL0000175393|SGD:S000001184\ttaxon:4751\t20260529"
  - reference_id: PMID:15623581
    supporting_text: >-
      synthase-III, respectively, aggregate and consequently fail to exit the ER
      membrane.
  - reference_id: PMID:39926406
    supporting_text: this study, CSE-8 was identified as an export protein for CHS-3 (class I).
