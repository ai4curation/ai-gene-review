family_id: PANTHER:PTHR35329
family_name: CHITIN SYNTHASE EXPORT CHAPERONE
preferred_name: Fungal CHS7 chitin-synthase export chaperones
summary: >-
  PTHR35329 is a compact chitin synthase export chaperone family. Its cached
  local fungal members all belong to PTHR35329:SF2 and the single PAINT
  ancestor PTN002175570 correctly carries the fungal CHS7-family endoplasmic
  reticulum membrane, protein folding chaperone, chitin biosynthetic process,
  and protein folding assertions.
functional_coherence: COHERENT
coherence_reason: >-
  The local PTHR35329 member table contains fungal CHS7-family proteins in a
  single CHITIN SYNTHASE EXPORT CHAPERONE subfamily. Reviewed members from S.
  cerevisiae, C. albicans, and N. crassa all support a conserved multipass ER
  membrane chaperone/export role for class IV chitin synthases.
