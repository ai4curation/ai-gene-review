term_assessments:
- assessed_term:
    id: GO:0007219
    label: Notch signaling pathway
  scope: FAMILY_WIDE
  scope_reason: >-
    Members of both paralog groups perform a proteolytic step in the pathway: the ADAM10 group
    does receptor S2 cleavage (Kuz, SUP-17, ADAM10), Kul cleaves Delta, and the ADAM17 group
    does ligand-independent S2 cleavage (Tace, ADAM17) or acts redundantly with SUP-17 (ADM-4).
    The term is therefore defensible family-wide as participation. It is a core function only
    for SF4 (vertebrate ADAM10) and SF2 (Kuz, SUP-17). For vertebrate ADAM17, gene reviews should
    keep it as non-core, because ligand-induced vertebrate Notch1 activation needs ADAM10 and not
    ADAM17.
  supported_by:
  - reference_id: PMID:19704010
    supporting_text: Specifically, ADAM10 was absolutely required for N1 signaling induced by
      ligands, while signaling independent of ligands required ADAM17.
  - reference_id: PMID:19704010
    supporting_text: ADAM10 knockout mice display classic Notch loss-of-function phenotypes (
      4 , 14 , 56 ), while ADAM17 mutant mice clearly do not
  - reference_id: PMID:16197940
    supporting_text: We found that reduced adm-4 activity, like reduced sup-17 activity, suppresses
      an allele of glp-1 that encodes a
  - reference_id: PMID:18535782
    supporting_text: Notch in a ligand-independent manner. Altogether, these data demonstrate
      the
  - reference_id: PMID:9244301
    supporting_text: biochemical evidence that Notch is an in vivo substrate for the KUZ protease,
  - reference_id: PMID:15576412
    supporting_text: flies, and has previously been shown not to be necessary for Notch processing
