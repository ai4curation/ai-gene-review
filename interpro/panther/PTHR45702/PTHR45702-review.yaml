    organism: Caenorhabditis elegans
  assessment: SOUND
  assessment_reason: >-
    In the PANTHER 19 tree, PTN001374824 is the root DUPLICATION node that splits the ADAM10
    group (PTN000225128, Bilateria) from the ADAM17 group (PTN000225479, Bilateria). PAINT gives
    no taxon for it. Seeds come from both sides of the duplication: Kuz, Kul, SUP-17 and mouse
    Adam10 on the ADAM10 side, and Tace and ADM-4 on the ADAM17 side. A single node covering
    both paralog groups can only sit at the duplication, so the placement matches the seeds.
    This is a participation claim of the right kind, because these proteases perform the
    proteolytic step: S2 cleavage of the receptor, or, for Kul, cleavage of Delta. Two caveats,
    neither enough to call the node wrong. (1) Vertebrate ADAM17 (SF6/SF5/SF7) inherits the term
    although its role in vertebrate Notch signaling is limited to ligand-independent and
    oncogenic activation. That is still participation, but gene reviews of vertebrate ADAM17
    should mark it non-core rather than remove it. (2) The node has no non-bilaterian
    descendants among the model organisms, so the claim does not extend to lineages without Notch.
