- assessed_term:
    id: GO:0005112
    label: Notch binding
  scope: UNRESOLVED
  scope_reason: >-
    Notch binding here would describe an enzyme binding its substrate, which is not an
    informative molecular function for a protease. The metalloendopeptidase activity with Notch
    as input is the right description. No PAINT node asserts this term. Do not propagate it at
    family level.
