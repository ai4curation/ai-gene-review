family_id: PANTHER:PTHR45702
family_name: ADAM10/ADAM17 METALLOPEPTIDASE FAMILY MEMBER
preferred_name: ADAM10/Kuzbanian and ADAM17/TACE sheddases
summary: >-
  Type I transmembrane zinc metalloproteases of the adamalysin (ADAM) class that act as
  membrane-proximal "sheddases", cleaving the juxtamembrane stalk of many transmembrane
  substrates. The family comprises two ancient bilaterian paralog groups that arose by a
  duplication before the protostome/deuterostome split: the ADAM10 group (vertebrate ADAM10,
  Drosophila Kuzbanian and Kuzbanian-like, C. elegans SUP-17) and the ADAM17 group (vertebrate
  ADAM17/TACE, Drosophila Tace, C. elegans ADM-4). All characterized members retain the
  HEXGHXXGXXH catalytic zinc motif. In Notch signaling the ADAM10 group performs the
  ligand-induced site-2 (S2) cleavage of the receptor that precedes gamma-secretase S3 cleavage,
  and Kuzbanian-like additionally cleaves the ligand Delta in Drosophila. ADAM17 can cleave
  Notch at S2 in ligand-independent and gain-of-function contexts, and C. elegans ADM-4 acts
  redundantly with SUP-17 in LIN-12/GLP-1 signaling, but in vertebrates ADAM17 is not required
  for ligand-induced Notch activation. Both groups shed many unrelated substrates (APP,
  cadherins, EGF-family ligands, TNF-alpha and others), so Notch is one substrate class among many.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Metalloendopeptidase (sheddase) activity is shared family-wide. Participation in Notch
  signaling is also found in both paralog groups in invertebrates (fly Kuz, Kul and Tace; worm
  SUP-17 and ADM-4). The exception is vertebrate ADAM17 (SF6, SF5, SF7). It can cleave Notch1
  at S2 only in ligand-independent or leukemia-mutant settings, and ADAM17 mutant mice lack Notch
  loss-of-function phenotypes. The physiological ligand-induced S2 cleavage belongs to ADAM10
  (SF4) in vertebrates and to Kuzbanian/SUP-17 (SF2) in invertebrates. Drosophila Kuzbanian-like
  (SF3) is also divergent: it contributes to Notch signaling by cleaving the ligand Delta, not
  the receptor.
