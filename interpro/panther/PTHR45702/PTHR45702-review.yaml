notes: >-
  Tree topology, subfamily assignments and PTN node positions come from the PANTHER 19 treeinfo
  service (pantherdb.org/services/oai/pantherdb/treeinfo), filtered to human, mouse, zebrafish,
  fly, worm, Dictyostelium and Arabidopsis. Seed ids were resolved to UniProt with
  UniProt REST xref queries. The family has no members outside Bilateria among these model
  organisms. Non-homologous S2 activity: van Tetering et al. (PMID:19726682) found residual S2
  cleavage of Notch1 after metalloprotease inhibition, which points to unidentified proteases
  that are not ADAMs. No lineage is known to have replaced ADAM10 with a non-homologous
  protease for physiological S2 cleavage. Zebrafish ADAM10 and ADAM17 have several unreviewed
  UniProt entries. The accessions given are those returned by ZFIN xref and gene-name queries.
