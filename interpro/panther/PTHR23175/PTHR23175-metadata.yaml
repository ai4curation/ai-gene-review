  name:
    name: Rho GTPase-activating protein
    short: Rho_GAP
  description:
  - text: This family of proteins includes Rho GTPase-activating proteins (GAPs) that
      are involved in the regulation of Rho family GTPases. Members of this family
      function by catalyzing the conversion of active GTP-bound Rho GTPases to their
      inactive GDP-bound state, thus acting as negative regulators of Rho GTPase signaling
      pathways. These proteins play a role in various cellular processes, including
      the control of the Golgi apparatus structure and function, as well as the regulation
      of cell junctions through the recruitment of specific catenins to adherens junctions.
      The activity of these GAPs is crucial for maintaining cellular dynamics and
      architecture.
