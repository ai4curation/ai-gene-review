  name:
    name: Ankyrin repeat domain-containing protein
    short: Ankyrin_repeat_domain
  description:
  - text: This family of proteins includes members that are involved in a variety
      of cellular processes, including transcriptional regulation, signal transduction,
      and immune response. Some proteins in this family function as inhibitors of
      the NF-kappa-B pathway, regulating the expression of cytokines and inflammatory
      responses. Others are involved in the regulation of histone deacetylases and
      may play a role in chromatin remodeling. Additionally, members of this family
      can act as substrate-recognition components of E3 ubiquitin-protein ligase complexes,
      targeting specific proteins for ubiquitination and degradation. The ankyrin
      repeat domain is a common feature in this family, facilitating protein-protein
      interactions with various motifs, such as the PxLPxI/L motif. Phosphorylation
      of certain residues within these motifs can modulate these interactions.
