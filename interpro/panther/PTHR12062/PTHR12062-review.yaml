family_id: PANTHER:PTHR12062
family_name: N-ACETYLGLUCOSAMINYLTRANSFERASE VI
preferred_name: GT54 MGAT4/GnT-IV and GnT-VI-related glycosyltransferase family
summary: PTHR12062 contains type-II secretory-pathway members of glycosyltransferase family 54,
  including the assayed human MGAT4A and MGAT4B GnT-IV enzymes, a putative human MGAT4C branch, the
  non-human SF11 MGAT4E/GnT-VI-like clade and the catalytically diverged SF10 MGAT4D/GnT1IP clade.
  This human-gene-driven review assesses the four human branches and the PAINT nodes that reach them,
  not every non-human and unreviewed PTHR12062 subfamily.
review_status: COMPLETE
functional_coherence: MOSTLY_COHERENT
coherence_reason: The MGAT4A/B branches share a directly assayed GnT-IV activity, the MGAT4C branch is
  retained by UniProt/Reactome as a putative related Golgi transferase, and the SF11 chicken seed
  carries a distinct GnT-VI activity on the alpha-1,6 arm. SF10/MGAT4D has lost detectable GnT-IV
  catalysis and acts as a regulator of MGAT1 instead. PAINT's catalytic IBD therefore uses the broad
  acetylglucosaminyltransferase term at PTN000948759 but needs a loss on the MGAT4D clade, and its
  MGAT4D-seeded ER/ERGIC/Golgi-stack location IBDs should move from PTN000948760 to the same SF10
  clade.
