- site_id: conserved_cys344
  label: Bacterial conserved cysteine (E. coli Cys344)
  description: >-
    Described in 2001 as the only cysteine conserved in all sequenced ThiI. It lies
    outside the rhodanese domain (404-482), so rhodanese-less bacteria keep it: B.
    subtilis Cys345 and Shewanella Cys346 by global alignment. In E. coli it forms a
    redox-active disulfide with Cys456 during turnover (UniProt DISULFID 344..456,
    PubMed:16855700), and substitution loses function in vivo. It is not conserved
    family-wide: M. jannaschii ThiI (Q58341) has Pro at the aligned position, and M.
    maripaludis ThiI uses PP-loop-domain Cys265 and Cys268 instead. It is not needed
    for thiazole synthesis.
