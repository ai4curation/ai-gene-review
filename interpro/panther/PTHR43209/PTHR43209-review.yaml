- site_id: rhodanese_persulfide
  label: Rhodanese-domain persulfide cysteine (E. coli Cys456)
  description: >-
    Cys456 in the C-terminal rhodanese domain carries the IscS-derived persulfide. It is
    essential for s4U in the rhodanese-containing clade, but rhodanese-less members (B.
    subtilis, archaea) make s4U without it, so for s4U it contributes rather than being
    required. It is required for thiazole synthesis: in Salmonella it is the only one of
    the five s4U residues tested that is also needed for thiazole, and C456S abolishes
    complementation even by the isolated rhodanese domain. (The abstract's statement that
    s4U residues were not involved in thiazole synthesis is a generalisation the
    results qualify.)
