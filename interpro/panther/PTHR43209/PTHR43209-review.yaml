    rationale: Mutating either residue abolishes s4U production in vivo; ThiI adenylates its substrate at the expense of ATP.
    supported_by:
    - reference_id: PMID:10595545
      supporting_text: the Asp in the motif was converted to Ala (D189A), and a screen for in vivo 4-thiouridine production revealed the altered enzyme to be inactive
