- site_id: rhodanese_persulfide
  label: Rhodanese-domain persulfide cysteine (E. coli Cys456)
  description: >-
    Cys456 in the C-terminal rhodanese domain carries the IscS-derived persulfide. It is
    essential for s4U in the rhodanese-containing clade, but rhodanese-less members (B.
    subtilis, archaea) make s4U without it, so across the family it contributes rather
    than being required. It is not the thiazole determinant: in Salmonella, residues
    needed for s4U are dispensable for thiazole.
  anchor:
    id: UniProtKB:P77718
    label: thiI
    organism: Escherichia coli K-12
  anchor_sequence_version: 1
  site_source: UNIPROT_FEATURE
  residues:
  - position: 456
    expected: [C]
    role: persulfide-forming active-site cysteine (rhodanese domain)
  required_for:
  - term:
      id: GO:0140741
      label: tRNA-uracil-4 sulfurtransferase activity
    strength: CONTRIBUTES
    rationale: >-
      Essential within the rhodanese-containing clade only: in E. coli, C456A cannot
      support s4U in vitro or in vivo. Rhodanese-less members make s4U without it.
    supported_by:
    - reference_id: PMID:10722656
      supporting_text: the C456A ThiI is incapable of supporting generation of 4-thiouridine in tRNA both in vitro and in vivo
  positive_controls:
  - id: UniProtKB:P77718
    label: thiI
    organism: Escherichia coli K-12
    control_position: 456
    control_residue: C
  - id: UniProtKB:A0KZA4
    label: thiI
    organism: Shewanella sp. ANA-3
    control_position: 458
    control_residue: C
- site_id: thiazole_signature
  label: Thiazole-specific C-terminal signature (IPR026340 / TIGR04271)
  description: >-
    Presence of the thiazole-specific signature of the rhodanese module, which separates
    thiazole-competent ThiI from the rest. The rhodanese domain alone (IPR001763) is not
    enough: Pyrobaculum Q8ZT61 has it without the signature, and nothing claims a thiazole
    role for it. The site marks presence of the signature rather than any single residue;
    E. coli Cys456 is listed only as an anchor inside the module. Members lacking the
    signature (Q8ZT61; B. subtilis and M. jannaschii, which also lack the rhodanese
    domain) are the negative controls.
  anchor:
    id: UniProtKB:P77718
    label: thiI
    organism: Escherichia coli K-12
  anchor_sequence_version: 1
  site_source: LITERATURE
  external_ref:
    id: InterPro:IPR026340
    source_db: INTERPRO
  residues:
  - position: 456
    expected: [C]
    role: anchor residue inside the rhodanese module carrying the thiazole signature
  required_for:
  - term:
      id: GO:0052837
      label: thiazole biosynthetic process
    strength: REQUIRED
    rationale: >-
      The requirement is on the module, not on the chemistry of Cys456. The rhodanese
      domain alone supports thiazole synthesis in Salmonella, while residues needed for
      s4U were not involved in thiazole synthesis. Members without the module (B.
      subtilis, M. maripaludis) are not required for thiamine.
    supported_by:
    - reference_id: PMID:21724998
      supporting_text: the C-terminal rhodanese domain of ThiI was sufficient for thiazole synthesis in vivo
    - reference_id: PMID:21724998
      supporting_text: ThiI residues required for 4-thiouridine synthesis were not involved in thiazole biosynthesis
    - reference_id: PMID:22773787
      supporting_text: indicate the requirement of ThiI and NifZ for the biosynthesis of 4-thiouridine, but not thiamine
  positive_controls:
