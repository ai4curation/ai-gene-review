    expected: [C]
    role: conserved cysteine; disulfide partner of Cys456 during turnover
  required_for:
  - term:
      id: GO:0140741
      label: tRNA-uracil-4 sulfurtransferase activity
    strength: CONTRIBUTES
    rationale: >-
      Required in bacterial ThiI (E. coli C344A cannot complement in vivo and loses
      2700-fold activity in vitro), but archaeal ThiI makes s4U with other cysteines, so
      across the family it contributes rather than being required.
    supported_by:
    - reference_id: PMID:11443125
