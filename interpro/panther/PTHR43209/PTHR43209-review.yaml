    label: thiI
    organism: Escherichia coli K-12
    control_position: 189
    control_residue: D
  - id: UniProtKB:O34595
    label: thiI
    organism: Bacillus subtilis 168
    control_position: 189
    control_residue: D
  - id: UniProtKB:A0KZA4
    label: thiI
