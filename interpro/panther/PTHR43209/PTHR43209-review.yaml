    Decided by the thiazole-specific signature of the rhodanese module, not by a
    subfamily: the only PANTHER subfamily (SF1) covers the whole family. Members with
    the signature (clade PTN000769419) supply sulfur for thiazole. Members without it
    (B. subtilis, M. maripaludis) do not need ThiI for thiamine, and Pyrobaculum Q8ZT61
    has the rhodanese domain without the signature. The thiazole chemistry needs Cys456
    and Arg414 (rhodanese_persulfide, thiazole_signature). The schema has no slot for
    domain-conditioned scope, so this is expressed through the thiazole_signature site
    and its controls.
