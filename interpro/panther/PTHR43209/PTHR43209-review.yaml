- site_id: rhodanese_persulfide
  label: Rhodanese-domain persulfide cysteine and its disulfide partner
  description: >-
    Cys456 in the C-terminal rhodanese domain carries the IscS-derived persulfide, and
    Cys344 forms a disulfide with it during turnover. In the rhodanese-containing clade
    both are essential for s4U. Rhodanese-less members (B. subtilis, archaea) make s4U
    without Cys456, using other cysteines, so this site is required only within
    PTN000769419. It is not the thiazole determinant: residues needed for s4U are
    dispensable for thiazole in Salmonella.
  anchor:
    id: UniProtKB:P77718
    label: thiI
    organism: Escherichia coli K-12
  anchor_sequence_version: 1
  site_source: LITERATURE
  residues:
  - position: 456
    expected: [C]
    role: persulfide-forming active-site cysteine (rhodanese domain)
  - position: 344
    expected: [C]
    role: forms a Cys344-Cys456 disulfide during turnover
  required_for:
  - term:
      id: GO:0140741
      label: tRNA-uracil-4 sulfurtransferase activity
    strength: CONTRIBUTES
    rationale: >-
      Essential within the rhodanese-containing clade only; rhodanese-less members make
      s4U without Cys456, so across the family the site contributes rather than being
      required. In E. coli, C456A cannot support s4U in vitro or in vivo, and C344 substitution
      loses function in vivo with a 2700-fold drop in vitro. The requirement holds within
      the rhodanese-containing clade only.
    supported_by:
    - reference_id: PMID:10722656
      supporting_text: the C456A ThiI is incapable of supporting generation of 4-thiouridine in tRNA both in vitro and in vivo
    - reference_id: PMID:11443125
      supporting_text: Substitution of Cys-344, the only cysteine residue conserved among all sequenced ThiI, resulted in the loss of function in vivo and a 2700-fold reduction in activity measured in vitro
  positive_controls:
  - id: UniProtKB:P77718
    label: thiI
    organism: Escherichia coli K-12
    control_position: 456
    control_residue: C
  - id: UniProtKB:A0KZA4
    label: thiI
    organism: Shewanella sp. ANA-3
    control_position: 458
    control_residue: C
- site_id: rhodanese_domain
  label: C-terminal rhodanese module (thiazole determinant)
  description: >-
    Presence of the C-terminal rhodanese-like domain (IPR001763; E. coli residues
    404-482), marked here by its active-site loop. The domain is necessary and
    sufficient for the thiazole role in Salmonella, and the thiazole term follows
    domain presence rather than any single residue. Members lacking the whole domain
    (B. subtilis, M. jannaschii) are the negative controls; they make s4U but are not
    needed for thiamine.
  anchor:
    id: UniProtKB:P77718
    label: thiI
    organism: Escherichia coli K-12
  anchor_sequence_version: 1
  site_source: LITERATURE
  residues:
  - position: 456
    expected: [C]
    role: active-site cysteine of the rhodanese loop, used here as the domain marker
  motif:
    pattern_regex: "[WY]CERG"
    start: 455
    end: 459
    role: rhodanese active-site loop
  required_for:
  - term:
      id: GO:0052837
      label: thiazole biosynthetic process
    strength: REQUIRED
    rationale: >-
      The rhodanese domain alone supports thiazole synthesis in Salmonella, and
      rhodanese-less ThiI is not required for thiamine in B. subtilis or M. maripaludis.
      The dependency is on the domain; whether Cys456 itself is needed for thiazole is
      not settled, since residues needed for s4U were dispensable for thiazole.
    supported_by:
    - reference_id: PMID:21724998
      supporting_text: the C-terminal rhodanese domain of ThiI was sufficient for thiazole synthesis in vivo
  positive_controls:
  - id: UniProtKB:P77718
    label: thiI
    organism: Escherichia coli K-12
    control_position: 456
    control_residue: C
  - id: UniProtKB:A0KZA4
    label: thiI
    organism: Shewanella sp. ANA-3
    control_position: 458
    control_residue: C
  negative_controls:
  - id: UniProtKB:O34595
    label: thiI
    gene_symbol: thiI
    organism: Bacillus subtilis 168
    gene_review: genes/BACSU/thiI/thiI-ai-review.yaml
  - id: UniProtKB:Q58654
    label: ThiI
    organism: Methanocaldococcus jannaschii
term_assessments:
- assessed_term:
    id: GO:0140741
    label: tRNA-uracil-4 sulfurtransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    s4U synthesis is shown in all three major lineages (E. coli, B. subtilis, M.
    maripaludis). The Trichomonas members are untested. MJ0421 (Q57864) is excluded: it is
    a SPOUT methylase assigned to this family by its UniProt PANTHER cross-reference but
    not in the PANTHER tree.
  member_exceptions:
  - member:
      id: UniProtKB:Q57864
      label: Uncharacterized protein MJ0421
      organism: Methanocaldococcus jannaschii
    exception_reason: >-
      THUMP-SPOUT methylase (IPR025849, IPR041730) with no ThiI PP-loop domain. It
      matches the ThiI family signature IPR003720, so InterPro2GO gives it sulfurtransferase
      activity and tRNA thio-modification. PANTHER's tree places it in PTHR14911.
    supported_by:
    - reference_id: PMID:10595545
      supporting_text: ThiI catalyzes the adenylation of a substrate at the expense of ATP
  supported_by:
  - reference_id: PMID:15037613
    supporting_text: IscS catalyzes sulfur transfer from l-cysteine to ThiI, which utilizes Mg-ATP to activate uridine 8 in tRNA and transfers sulfur to give s4U
  - reference_id: PMID:22773787
    supporting_text: In vitro synthesis of 4-thiouridine by ThiI and NifZ
- assessed_term:
    id: GO:0002937
    label: tRNA 4-thiouridine biosynthesis
  scope: FAMILY_WIDE
  scope_reason: As for GO:0140741; the PAINT IBD at the root (PTN001804941) is sound.
  supported_by:
  - reference_id: PMID:22904325
    supporting_text: deletion of ThiI (MMP1354) abolished the biosynthesis of s(4)U
- assessed_term:
    id: GO:0052837
    label: thiazole biosynthetic process
  scope: RESIDUE_DETERMINED
  scope_reason: >-
    Decided by the presence of the C-terminal rhodanese module, not by a subfamily: the
    only PANTHER subfamily (SF1) covers the whole family. Members with the module
    (clade PTN000769419) supply sulfur for thiazole. Members without it (B. subtilis,
    M. maripaludis) do not need ThiI for thiamine. The schema has no slot for
    domain-conditioned scope, so this is expressed through the rhodanese_domain site,
    with members carrying or lacking the module as controls.
  determined_by_site: rhodanese_domain
  supported_by:
  - reference_id: PMID:21724998
    supporting_text: the C-terminal rhodanese domain of ThiI was sufficient for thiazole synthesis in vivo
  - reference_id: PMID:22773787
    supporting_text: indicate the requirement of ThiI and NifZ for the biosynthesis of 4-thiouridine, but not thiamine
- assessed_term:
    id: GO:0004810
    label: CCA tRNA nucleotidyltransferase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    No member adds CCA to tRNA. The term reaches every ThiI only through InterPro2GO
    IPR020536 (ThiI AANH domain), which is wrong; reported as go-annotation#6646. The
    AANH domain adenylates U8.
  supported_by:
  - reference_id: PMID:10595545
    supporting_text: ThiI catalyzes the adenylation of a substrate at the expense of ATP
