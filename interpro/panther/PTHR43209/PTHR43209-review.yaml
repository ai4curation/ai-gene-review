      label: tRNA-uracil-4 sulfurtransferase activity
    strength: CONTRIBUTES
    rationale: >-
      Essential within the rhodanese-containing clade only: in E. coli, C456A cannot
      support s4U in vitro or in vivo. Rhodanese-less members make s4U without it.
    supported_by:
    - reference_id: PMID:10722656
