- site_id: thiazole_signature
  label: Thiazole-specific C-terminal signature (IPR026340 / TIGR04271)
  description: >-
    Presence of the thiazole-specific signature of the rhodanese module, used here as the
    predictor of a thiazole-competent module. The thiazole chemistry runs through Cys456
    and Arg414, both required in Salmonella, but those residues do not predict scope:
    Pyrobaculum Q8ZT61 has the rhodanese domain and, by alignment, the cysteine (C444)
    and arginine (R406), yet lacks the signature, and nothing claims a thiazole role for
    it. That IPR026340 discriminates is an inference: the experiments show necessity and
    sufficiency for the rhodanese domain, and Q8ZT61 is untested rather than known to lack
    the activity. The negative controls (Q8ZT61; B. subtilis and MJ1257, which also lack
    the rhodanese domain) deliberately declare no position: declaring 456 on Q8ZT61 would
    check a residue it does have.
  anchor:
    id: UniProtKB:P77718
    label: thiI
    organism: Escherichia coli K-12
  anchor_sequence_version: 1
  site_source: LITERATURE
  external_ref:
    id: InterPro:IPR026340
    source_db: INTERPRO
  residues:
  - position: 456
    expected: [C]
    role: persulfide cysteine; C456S abolishes thiazole synthesis (Salmonella)
  - position: 414
    expected: [R]
    role: R414H abolishes thiazole synthesis, including by the isolated rhodanese domain
  required_for:
  - term:
      id: GO:0052837
      label: thiazole biosynthetic process
    strength: REQUIRED
    rationale: >-
      The rhodanese module is necessary and sufficient for thiazole synthesis in
      Salmonella, through Cys456 and Arg414. Members without it (B. subtilis, M.
      maripaludis) are not required for thiamine, and the authors recommend that ThiI
      with only the AANH and THUMP domains be annotated as 4-thiouridine
      sulfurtransferases. Using the IPR026340 signature rather than IPR001763 as the
      scope marker is an inference that separates Q8ZT61.
    supported_by:
    - reference_id: PMID:21724998
      supporting_text: the C-terminal rhodanese domain of ThiI was sufficient for thiazole synthesis in vivo
    - reference_id: PMID:21724998
      supporting_text: or when Arg414 was changed to His
    - reference_id: PMID:21724998
      supporting_text: would be better annotated as 4-thiouridine sulfurtransferases
    - reference_id: PMID:22773787
      supporting_text: indicate the requirement of ThiI and NifZ for the biosynthesis of 4-thiouridine, but not thiamine
