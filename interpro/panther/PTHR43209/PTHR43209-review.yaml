- site_id: pp_loop_adenylation
  label: PP-loop ATP-pyrophosphatase residues (U8 adenylation)
  description: >-
    The SGGxDS PP-loop and the catalytic lysine of the AANH domain, which adenylate U8
    with ATP. Conserved in every characterized ThiI, rhodanese domain or not: B. subtilis
    has Asp189 and Lys321 at the same positions, Shewanella has them at 191 and 323.
    UniProt curates both as experimental MUTAGEN features (PubMed:10595545). The
    adenylation activity is not needed for thiazole synthesis: in Salmonella, D189A, K321M
    and C207S variants all still complement a thiI mutant for thiamine.
