residue_sites:
- site_id: pp_loop_adenylation
  label: PP-loop ATP-pyrophosphatase residues (U8 adenylation)
  description: >-
    The SGGxDS PP-loop and the catalytic lysine of the AANH domain, which adenylate U8
    with ATP. Conserved in every characterized ThiI, rhodanese domain or not. B. subtilis
    has Asp189 and Lys321 at the same positions; Shewanella has them at 191 and 323.
  anchor:
    id: UniProtKB:P77718
    label: thiI
    organism: Escherichia coli K-12
  anchor_sequence_version: 1
  site_source: LITERATURE
  residues:
  - position: 189
    expected: [D]
    role: PP-loop aspartate (SGGFDS); D189A is inactive
  - position: 321
    expected: [K]
    role: adenylation lysine; essential by mutagenesis
  motif:
    pattern_regex: SGG.DS
    start: 185
    end: 190
    role: PP-loop ATP-binding motif
  required_for:
  - term:
      id: GO:0140741
      label: tRNA-uracil-4 sulfurtransferase activity
    strength: REQUIRED
    rationale: Mutating either residue abolishes s4U production in vivo; ThiI adenylates its substrate at the expense of ATP.
    supported_by:
    - reference_id: PMID:10595545
      supporting_text: the Asp in the motif was converted to Ala (D189A), and a screen for in vivo 4-thiouridine production revealed the altered enzyme to be inactive
  positive_controls:
