family_id: PANTHER:PTHR43209
family_name: TRNA SULFURTRANSFERASE
preferred_name: ThiI tRNA-uracil-4 sulfurtransferase family
summary: >-
  ThiI makes 4-thiouridine (s4U) at position 8 of tRNA. All members share an N-terminal
  THUMP and ferredoxin-like tRNA-binding region and a PP-loop (AANH) pyrophosphatase
  domain that adenylates U8 with ATP. The family splits on one module, a C-terminal
  rhodanese-like domain. ThiI of Enterobacterales, Vibrionales, Alteromonadales and
  Pseudomonadales (E. coli, Salmonella, Yersinia, Vibrio, Shewanella, Pseudomonas) carries
  it, with a thiazole-specific C-terminal signature (IPR026340 / TIGR04271): its active-site cysteine (E. coli Cys456)
  takes persulfide sulfur from IscS, and the same domain supplies sulfur to ThiS for
  thiazole and thiamine synthesis. Firmicute, mycoplasmal, Thermotoga and Coxiella ThiI,
  and almost all archaeal and eukaryotic members, lack the rhodanese domain. Where
  tested (B. subtilis, M. maripaludis), they make s4U but have no role in thiamine
  synthesis. The PANTHER tree (25 reference-proteome leaves) splits into a bacterial
  clade (PTN001804955) and an archaeal/eukaryotic clade (PTN001804942); the six members
  with the thiazole signature form exactly one bacterial subclade, PTN000769419.
  Coxiella, although a gamma-proteobacterium, lacks the module and falls outside it.
  Leaf-level domain content is in PTHR43209-tree-leaves.yaml.
functional_coherence: MOSTLY_COHERENT
reference_protein:
  id: UniProtKB:P77718
  label: tRNA sulfurtransferase
  gene_symbol: thiI
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/thiI/thiI-ai-review.yaml
subfamilies:
- clade_node_id: PANTHER:PTN000769419
  label: Rhodanese and thiazole-signature ThiI (Enterobacterales, Vibrionales, Alteromonadales, Pseudomonadales)
  description: >-
    E. coli, Salmonella, Yersinia, Vibrio, Shewanella and Pseudomonas ThiI. All six
    leaves carry the rhodanese domain (IPR001763) and the thiazole-specific C-terminal
    signature (IPR026340 / TIGR04271); no other leaf in the tree carries the signature.
    This is not "gamma-proteobacterial ThiI": Coxiella burnetii (Q83CD9, Legionellales),
    a gamma-proteobacterium, lacks the module and sits in the sister clade PTN008100960,
    so a Gammaproteobacteria taxon constraint would re-create the over-propagation.
  representative_members:
  - id: UniProtKB:P77718
    gene_symbol: thiI
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/thiI/thiI-ai-review.yaml
  - id: UniProtKB:P55913
    gene_symbol: thiI
    organism: Salmonella typhimurium LT2
  - id: UniProtKB:A0KZA4
    gene_symbol: thiI
    organism: Shewanella sp. ANA-3
    gene_review: genes/SHESA/thiI/thiI-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Gained the rhodanese module and with it the second activity, sulfur transfer to ThiS
    for thiazole synthesis. The rhodanese domain is necessary and sufficient for the
    thiazole role in Salmonella.
  supported_by:
  - reference_id: PMID:21724998
    supporting_text: the C-terminal rhodanese domain of ThiI was sufficient for thiazole synthesis in vivo
  - reference_id: file:interpro/panther/PTHR43209/PTHR43209-tree-leaves.yaml
    supporting_text: 'thiazole_signature_IPR026340: true'
- clade_node_id: PANTHER:PTN008100960
  label: Rhodanese-less bacterial ThiI (Firmicutes, Mycoplasma, Thermotoga, Coxiella)
  description: >-
    Sister clade to PTN000769419 within the bacterial clade PTN001804955. These members
    lack the rhodanese domain. In B. subtilis, ThiI is required for s4U and not for
    thiamine, and its sulfur donor is the cysteine desulfurase NifZ.
  representative_members:
  - id: UniProtKB:O34595
    gene_symbol: thiI
    organism: Bacillus subtilis 168
    gene_review: genes/BACSU/thiI/thiI-ai-review.yaml
  - id: UniProtKB:Q2FXL1
    gene_symbol: thiI
    organism: Staphylococcus aureus NCTC 8325
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:22773787
    supporting_text: Gene inactivation experiments in B. subtilis indicate the requirement of ThiI and NifZ for the biosynthesis of 4-thiouridine, but not thiamine
- clade_node_id: PANTHER:PTN001804942
  label: Archaeal and eukaryotic ThiI
  description: >-
    Archaeal ThiI (Methanocaldococcus, Methanosarcina, Thermococcus, Sulfolobus,
    Halobacterium, Korarchaeum, Pyrobaculum) and two Trichomonas proteins. All lack the
    rhodanese domain except Pyrobaculum Q8ZT61, which has it without the thiazole
    signature. In M. maripaludis, ThiI is needed for s4U but not for thiamine. Sulfur
    there comes from sulfide through PP-loop-domain cysteines, not from a cysteine
    desulfurase. The Trichomonas members are uncharacterized.
  representative_members:
  - id: UniProtKB:Q58654
    label: Uncharacterized protein MJ1257
    organism: Methanocaldococcus jannaschii
  - id: UniProtKB:Q980G6
    organism: Saccharolobus solfataricus P2
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:22904325
    supporting_text: deletion of ThiI (MMP1354) abolished the biosynthesis of s(4)U but not of thiamine
