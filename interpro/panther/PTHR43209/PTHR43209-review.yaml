- clade_node_id: PANTHER:PTN008100960
  label: Rhodanese-less bacterial ThiI (Firmicutes, Mycoplasma, Coxiella)
  description: >-
    One of the two subclades of the bacterial clade PTN001804955 (the other is
    PTN000769419). Thermotoga maritima ThiI (Q9X220, also rhodanese-less) attaches
    directly under PTN001804955 as leaf PTN001804957 and belongs to neither subclade.
    These members lack the rhodanese domain. In B. subtilis, ThiI is required for s4U and not for
    thiamine, and its sulfur donor is the cysteine desulfurase NifZ.
