- site_id: conserved_cys344
  label: Family-wide conserved cysteine (E. coli Cys344)
  description: >-
    The only cysteine conserved in all ThiI sequenced in 2001. It lies outside the
    rhodanese domain (404-482), so it is present in rhodanese-less members too: B.
    subtilis Cys345 and Shewanella Cys346 by global alignment. In E. coli it forms a
    redox-active disulfide with Cys456 during turnover (UniProt DISULFID 344..456,
    PubMed:16855700). Substitution loses function in vivo.
  anchor:
    id: UniProtKB:P77718
    label: thiI
    organism: Escherichia coli K-12
  anchor_sequence_version: 1
  site_source: UNIPROT_FEATURE
  residues:
  - position: 344
    expected: [C]
    role: conserved cysteine; disulfide partner of Cys456 during turnover
  required_for:
  - term:
      id: GO:0140741
      label: tRNA-uracil-4 sulfurtransferase activity
    strength: REQUIRED
    rationale: C344A cannot complement in vivo and has a 2700-fold drop in activity in vitro.
    supported_by:
    - reference_id: PMID:11443125
      supporting_text: Substitution of Cys-344, the only cysteine residue conserved among all sequenced ThiI, resulted in the loss of function in vivo and a 2700-fold reduction in activity measured in vitro
    - reference_id: PMID:16855700
      supporting_text: chemical trapping and mass spectrometry have now provided direct and definitive evidence of these key intermediates
