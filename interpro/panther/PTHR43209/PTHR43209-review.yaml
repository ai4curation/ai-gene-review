notes: >-
  Tree membership is from the PANTHER treeinfo API, cached via
  ai_gene_review.etl.panther_trees; the domain content of the 25 leaves is from UniProt
  InterPro cross-references (IPR001763 rhodanese, IPR026340 thiazole signature). Residue
  correspondences come from global BLOSUM62 alignments: E. coli D189, K321, C344, C456
  correspond to B. subtilis D189, K321, C345 and no C456, and to Shewanella D191, K323,
  C346, C458.

  Schema gaps this family exposes:
  (1) term scope cannot be conditioned on a domain or clade node when PANTHER has a single
  subfamily, so the thiazole term uses RESIDUE_DETERMINED with a domain-presence site;
  (2) the substrate determinants in PMID:15037613 (minimal acceptor/T-stem mini-helix,
  bulge of at least 4 nt starting at U8, a 3' overhang required, distance from the 3' end
  to U8) have no structured home;
  (3) InterPro2GO errors found here are recorded only as gene-level source defects and in
  this note: IPR020536 to GO:0004810 (all ThiI) and IPR003720 to GO:0016783/GO:0034227
  on the non-ThiI member MJ0421.
