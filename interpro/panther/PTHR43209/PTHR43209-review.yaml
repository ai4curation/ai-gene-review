notes: >-
  Tree membership is from the PANTHER treeinfo API (cached via
  ai_gene_review.etl.panther_trees, PANTHER 19); the domain content of the 25 leaves is from
  UniProt InterPro cross-references. Both are committed as PTHR43209-tree-leaves.yaml beside
  this review. The committed entries.csv corroborates the split by length: the six
  thiazole-signature members are 482-484 aa, everything else 191-436 aa (191 is a
  Thermococcus fragment, Q5JCY3), with Pyrobaculum
  Q8ZT61 (484 aa, rhodanese without the signature) the lone exception. Residue
  correspondences are from global BLOSUM62 alignments: E. coli D189, K321, C344, C456
  correspond to B. subtilis D189, K321, C345 and no C456, and to Shewanella D191, K323,
  C346, C458.

  Schema gaps this family exposes:
  (1) term scope cannot be conditioned on a domain or clade node when PANTHER has a single
  subfamily, so the thiazole term uses RESIDUE_DETERMINED with a signature-presence site;
  (2) whole-domain absence cannot be stated as a residue claim, so the B. subtilis gene
  review argues the loss in prose (position 456 does not exist in a 401-aa protein);
  (3) NodeAssessmentEnum has no value for "node not in this family's tree", so
  PTN000382878, which leaks in through a mis-assigned member, is UNRESOLVED;
  (4) the substrate determinants in PMID:15037613 (minimal acceptor/T-stem mini-helix,
  bulge of at least 4 nt starting at U8, a 3' overhang required, distance from the 3' end
  to U8) have no structured home;
  (5) InterPro2GO errors found here are recorded only as gene-level source defects and in
  this note: IPR020536 to GO:0004810 (all ThiI) and IPR003720 to GO:0016783/GO:0034227 on
  the non-ThiI member MJ0421.
