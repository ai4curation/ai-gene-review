family_id: PANTHER:PTHR18896
family_name: PHOSPHOLIPASE D
preferred_name: Classical phospholipase D lipid-signaling enzymes
summary: Classical phospholipase D proteins hydrolyze glycerophospholipids to phosphatidic acid and a
  released head group. The family includes animal PLD1/PLD2 and multiple plant PLD classes with different
  regulatory and membrane-interaction features. Lipid hydrolysis is the common mechanistic theme, while
  stimulus dependence, preferred substrates and cellular signaling outputs vary.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The inventory contains classical animal and plant PLDs with conserved phospholipase
  architecture. Fly Pld loss and rescue experiments link phosphatidic-acid signaling to phototransduction
  (PMID:15883198), while separate experiments support vesicle trafficking during cellularization (PMID:17156430).
  These physiological outputs differ from the common lipid-hydrolysis reaction and should not be generalized
  to all PLDs. No catalytic-loss claim is supported for the exact fly input.
