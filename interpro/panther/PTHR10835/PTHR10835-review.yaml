family_id: PANTHER:PTHR10835
family_name: SQUALENE MONOOXYGENASE
preferred_name: Squalene monooxygenase (squalene epoxidase; ERG1/SQLE) family
summary: >-
  FAD-dependent squalene monooxygenases epoxidize squalene to 2,3-oxidosqualene, the second committed
  step of sterol synthesis. They are ER membrane enzymes and the target of allylamine antifungals.
  The family contains S. cerevisiae ERG1, S. pombe erg1, human SQLE and the plant squalene epoxidases,
  which form several paralog subfamilies.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Squalene monooxygenase activity is established for SF0 (fungal, animal and some plant enzymes).
  Activity of the plant paralog subfamilies (SF22, SF20, SF15, SF9) was not assessed here.
