notes: Used by modules/bacterial_ribose_uptake_and_entry.yaml at PANTHER:PTHR37831:SF1 with E. coli and
  KT2440 RbsD as exemplars. Spontaneous ring interconversion means RbsD accelerates rather than uniquely
  enables furanose supply. The remaining FucU-clade IBDs at PTN002061292 (GO:0016857 racemase and epimerase
  activity, acting on carbohydrates and derivatives; GO:0006004 fucose metabolic process) are outside the
  ribose-module scope and are not assessed here.
