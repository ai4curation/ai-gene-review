family_id: PANTHER:PTHR37831
family_name: D-RIBOSE PYRANASE
preferred_name: RbsD/FucU sugar mutarotases
summary: Small cytoplasmic RbsD/FucU-fold mutarotases that assemble into toroidal oligomers. Bacterial
  RbsD (SF1) catalyzes the beta-pyranose to beta-furanose conversion of D-ribose ahead of ribokinase,
  as shown by NMR for E. coli RbsD. A separate PAINT node covers FucU-type fucose mutarotases (E. coli
  FucU and mammalian FUOM).
functional_coherence: MOSTLY_COHERENT
coherence_reason: All members interconvert sugar ring forms, but substrate splits between the RbsD (D-ribose)
  and FucU (L-fucose) clades.
