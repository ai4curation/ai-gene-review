    family or subfamily grant is asserted.
  supported_by:
  - reference_id: PMID:20610658
    supporting_text: 'We show that the purified

      Rvs161-Rvs167 complex binds to liposomes in a curvature-independent manner and

      promotes tubule formation in vitro.'
  - reference_id: PMID:20610658
    supporting_text: Rvs161 consists solely of a BAR domain, whereas Rvs167 is composed of a BAR domain
      followed by a region rich in glycine, proline, and alanine (GPA), and an SH3 (Src-homology 3) domain
      at its C-terminus
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR47174-evidence.md
    supporting_text: 'This family includes a group of BAR-domain containing proteins, including BIN3 from
      human, its homologues RVS161 and hob3 from S. cerevisiae and S. pombe, respectively, and related
      proteins, which contain the N-BAR domain, related to the amphiphysin family of proteins [[cite:PUB00086944],
      [cite:PUB00101553]]. BIN3 is widely expressed in many tissues except in the brain. It plays roles
      in regulating filamentous actin localization and in cell division [[cite:PUB00086944]].


      This entry also includes reduced viability upon starvation protein 167 (RVS167) from S. cerevisiae
      and its homologue in S. pombe, hob1 [[cite:PUB00101550], [cite:PUB00101551], [cite:PUB00101552]].
      RVS161/167 are components of a cytoskeletal structure that is required for the formation of endocytic
      vesicles at the plasma membrane level and form a complex that regulates actin, endocytosis, and
      viability following starvation or osmotic stress. Hob1 is structurally similar to RVS167, while
      hob3 is more similar to human BIN3 and RVS161, however, neither hob1 nor hob3 is required for endocytosis,
      [[cite:PUB00101552]]. Hob1 is dispensable for endocytosis, actin organization, or osmotic sensitivity
      but it participates in DNA damage signalling as a part of stress response processes.'
