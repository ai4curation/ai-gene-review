family_id: PANTHER:PTHR47174
family_name: BRIDGING INTEGRATOR 3
summary: BIN3/Rvs-related BAR-domain proteins couple membrane organization to cytoskeletal and cellular
  processes. Related fungal proteins differ in their contributions to endocytosis, actin organization
  and stress responses.
functional_coherence: HETEROGENEOUS
coherence_reason: Purified budding-yeast Rvs161/Rvs167 binds and tubulates liposomes (PMID:20610658),
  supporting direct membrane remodeling. Curated IPR046982 distinguishes these endocytic proteins from
  pombe Hob1/Hob3, which lack the same endocytic requirement. NCU04637 maps to the Rvs167 branch; its
  BAR-domain association supports a membrane/cytoskeleton comparison but does not establish neuronal function
  or every yeast endocytosis phenotype.
