    label: lipid binding
  scope: UNRESOLVED
  scope_reason: Purified budding-yeast Rvs161/Rvs167 binds and tubulates liposomes (PMID:20610658), supporting
    direct membrane remodeling. Curated IPR046982 distinguishes these endocytic proteins from pombe Hob1/Hob3,
    which lack the same endocytic requirement. NCU04637 maps to the Rvs167 branch; its BAR-domain association
