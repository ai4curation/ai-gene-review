  name:
    name: Thyrotropin-releasing hormone regulator
    short: TRH_regulator
  description:
  - text: This family of proteins serves as regulators of thyroid-stimulating hormone
      (TSH) biosynthesis in the anterior pituitary gland. They play a role as neurotransmitters
      or neuromodulators in the central and peripheral nervous systems. Additionally,
      in humans, they are involved in the regulation of thyroid hormone synthesis
      and hair growth, including hair-shaft elongation, prolongation of the hair cycle
      growth phase, and antagonism of its termination by TGFB2. They also stimulate
      proliferation and inhibit apoptosis in hair matrix keratinocytes.
