  name:
    name: Vacuolar Protein Sorting-Associated 17
    short: VPS17
  description:
  - text: This family of proteins is involved in the endosomal sorting and trafficking
      pathway. Members play a crucial role in the retrograde transport from endosomes
      to the Golgi apparatus. They are components of the retromer complex, which is
      essential for the retrieval of specific cargo proteins, including the vacuolar
      protein sorting receptor. These proteins are also implicated in the recycling
      of soluble vacuolar hydrolases, retention of late Golgi membrane proteins, vacuolar
      biogenesis, and vacuolar maintenance during cellular stress conditions.
