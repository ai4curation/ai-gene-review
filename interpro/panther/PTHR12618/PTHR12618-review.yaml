family_id: PANTHER:PTHR12618
family_name: PHD AND RING FINGER DOMAIN-CONTAINING PROTEIN 1
preferred_name: PHD/RING-containing Asr1-related proteins
summary: PHRF1-related PHD/RING proteins include poorly characterized eukaryotic interaction proteins
  and a Komagataella micropexophagic-apparatus component catalogued as Atg36/Atg35. Shared zinc-binding
  domains do not establish identical ubiquitin-ligase substrates or a conserved autophagy-receptor mechanism.
functional_coherence: UNKNOWN
coherence_reason: Curated IPR047157 identifies PHRF1-related proteins and a Komagataella protein catalogued
  as Atg36/Atg35 that contributes to micropexophagic apparatus formation. This naming does not identify
  the Saccharomyces Atg36 pexophagy receptor. Pombe Asr1/C126.07c lies with the PHRF1 group; RING/PHD
  architecture alone neither establishes its ubiquitin-ligase substrate nor transfers a distinct budding-yeast
  Asr1 RNA-polymerase-II mechanism.
