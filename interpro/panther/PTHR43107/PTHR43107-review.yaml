family_id: PANTHER:PTHR43107
family_name: LONG-CHAIN FATTY ACID TRANSPORT PROTEIN
preferred_name: Long-Chain Fatty Acid Transport Protein
summary: LONG-CHAIN FATTY ACID TRANSPORT PROTEIN (PANTHER:PTHR43107) is characterized in PANTHER PAINT
  across 7 ancestral PTN node(s) (PANTHER:PTN000645309, PANTHER:PTN001186241, PANTHER:PTN001186290, PANTHER:PTN001945407
  (+3 more)) with 14 IBD node assertion(s) and 2 term(s) carrying negated IRD/IKR branch blocks, covering
  peroxisomal membrane (GO:0005778, CC), endoplasmic reticulum membrane (GO:0005789, CC), peroxisome (GO:0005777,
  CC), lipid droplet (GO:0005811, CC) and 10 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR43107 (LONG-CHAIN FATTY ACID TRANSPORT PROTEIN) span
  7 distinct ancestral PTN nodes (PANTHER:PTN000645309, PANTHER:PTN001186241, PANTHER:PTN001186290, PANTHER:PTN001945407,
  PANTHER:PTN002534562 (+2 more)) with different molecular function assignments across clades (long-chain
  fatty acid-CoA ligase activity (GO:0004467), long-chain fatty acid transmembrane transporter activity
  (GO:0005324), oleoyl-CoA ligase activity (GO:0090434)), indicating clade-level functional specialization
  across the family.
