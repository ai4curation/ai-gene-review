family_id: PANTHER:PTHR10938
family_name: TRANSLATION INITIATION FACTOR IF-3
preferred_name: Bacterial-type translation initiation factor IF3 (bacterial, mitochondrial and plastid)
summary: >-
  PTHR10938 is the translation initiation factor IF3 family. IF3 has an N-terminal and a C-terminal
  domain joined by a flexible linker. It binds the 30S ribosomal subunit at the platform, where the C
  domain overlaps the 50S contact site, so IF3 acts as an anti-association factor that keeps subunits
  free for initiation, stabilizes 30S subunits released by RRF and EF-G during recycling, and
  discriminates against non-canonical start codons and non-initiator tRNAs. The family contains
  bacterial IF3 (reference E. coli infC, P0A707) and the nuclear-encoded IF3 of mitochondria and
  plastids, which descend from the endosymbiotic ancestors. Unlike IF1 and IF2, IF3 has no ortholog
  in the archaeal or eukaryotic cytosolic initiation machinery (eIF3 is unrelated), so this family is
  bacterial in origin and organellar in eukaryotes. The PANTHER subfamily SF0 is labelled
  "MITOCHONDRIAL" but holds nearly all bacterial IF3 proteins.
functional_coherence: COHERENT
coherence_reason: >-
  The parsed entries file holds 315 Swiss-Prot entries. 313 are in PTHR10938:SF0: bacterial infC
  proteins from all major phyla (E. coli P0A707, Bacillus subtilis P55872, Pseudomonas putida Q88K26)
  plus mitochondrial IF3 (human MTIF3 Q9H2K0, mouse, bovine, fission yeast mti3) and plastid IF3 (red
  algal plastid infC, Arabidopsis IF3-4). The two singleton subfamilies are Arabidopsis IF3-2
  (chloroplast, SF3) and IF3-1 (mitochondrion, SF4). All characterized members act as initiation
  factors on bacterial-type 70S/55S ribosomes; the differences are compartmental (cytosol, mitochondrial
  matrix, plastid) and in mitochondria-specific extensions, not in the core activity.
