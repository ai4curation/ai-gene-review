notes: >-
  Structural basis of the family activity in the reference protein: hydroxyl-radical probing places
  the IF3 C domain at the 30S platform interface, coinciding with 23S helix 69, which explains the
  anti-association activity (PMID:11684020); IF3 also stabilizes the subunits transiently split by RRF
  and EF-G (PMID:16043510). Subfamily placement in PANTHER mixes compartments (SF0 holds bacterial,
  mitochondrial and some plastid members), so compartment terms are scoped by PAINT node and taxon,
  not by subfamily. An earlier automated draft of this review (open PR #5077) placed Arabidopsis IF3-1
  (SF4) below the chloroplast node PTN000859419; QuickGO shows IF3-1 retains the mitochondrion IBA from
  PTN000101472, so that placement was not adopted.
