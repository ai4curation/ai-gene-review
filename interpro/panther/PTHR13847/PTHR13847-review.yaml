notes: 'Adopted from the automated draft in open PR #5077 and extended for the bacterial dimethylglycine
  and sarcosine catabolism module: SF287 is recorded as a mixed FOXRED1/SoxB subfamily, and SoxB is excepted
  from the eukaryote-specific mitochondrion and complex I assembly assertions. Because neither the family
  nor SF287 is specific to sarcosine oxidase, the module grounds its SoxB role on NCBIfam TIGR01373 instead.
  Corrected the SoxB covalent cofactor from FAD to FMN on 2026-11-06, with collective activity qualified;
  all original PAINT node assessments and term verdicts remain unchanged. Heterotetrameric sarcosine oxidases
  contain noncovalent FAD and covalent FMN, unlike covalent-FAD monomeric enzymes.


  Adopted from the automated draft in open PR #5077 and extended for the bacterial dimethylglycine and
  sarcosine catabolism module: SF287 is recorded as a mixed FOXRED1/SoxB subfamily, and SoxB is excepted
  from the eukaryote-specific mitochondrion and complex I assembly assertions. Because neither the family
  nor SF287 is specific to sarcosine oxidase, the module grounds its SoxB role on NCBIfam TIGR01373 instead.
  The 2026-11-11 hydroxyproline-catabolism pass records SF289 as a mixed subfamily that includes the KT2440
  cis-4-hydroxy-D-proline dehydrogenase PP_1255. The module therefore grounds that step on the PP_1255
  exemplar and asserts no family or subfamily term for it.'
