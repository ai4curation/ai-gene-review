term_assessments:
- assessed_term:
    id: GO:0016641
    label: oxidoreductase activity, acting on the CH-NH2 group of donors, oxygen as acceptor
  scope: UNRESOLVED
  scope_reason: >-
    O2-dependent oxidation of a CH-NH2 donor is carried by more than one subfamily: SF275, the
    gamma-glutamylputrescine oxidoreductase (PuuB) subfamily, whose characterized member E. coli PuuB oxidizes
    gamma-L-glutamylputrescine with O2 (RHEA:28414), and SF289, the glycine oxidases (ThiO) used in thiamine
    biosynthesis. Other subfamilies hold enzymes with different substrates, acceptors and roles, such as
    sarcosine-oxidizing SoxB subunits and the complex I assembly factor FOXRED1. The full set of subfamilies
    carrying the parent term has not been enumerated here, so no family-wide or subfamily-only grant is made;
    assign it per member from its own reaction.
  supported_by:
  - reference_id: file:ECOLI/puuB/puuB-uniprot.txt
    supporting_text: >-
      Reaction=gamma-L-glutamylputrescine + O2 + H2O = 4-(gamma-L-
      glutamylamino)butanal + H2O2 + NH4(+); Xref=Rhea:RHEA:28414
  - reference_id: PMID:15590624
    supporting_text: oxidization of gamma-glutamylputrescine
