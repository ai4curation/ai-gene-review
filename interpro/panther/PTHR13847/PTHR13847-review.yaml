  diverged_from_family: false
  description: >-
    Bacterial gamma-glutamylputrescine oxidoreductases (PuuB), the second enzymes of the gamma-glutamyl
    putrescine catabolic route; E. coli PuuB is characterized and Pseudomonas putida KT2440 PuuB is assigned
    here by UniProt's PANTHER cross-reference. No PAINT node in this family carries a PuuB-specific term, and GO
    lacks a gamma-glutamylputrescine oxidase molecular function.
