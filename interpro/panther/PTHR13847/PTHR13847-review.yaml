- subfamily_id: PANTHER:PTHR13847:SF287
  label: FAD-DEPENDENT OXIDOREDUCTASE DOMAIN-CONTAINING PROTEIN 1
  description: 'Mixed subfamily: animal FOXRED1 (a mitochondrial complex I assembly factor) together with
    the bacterial SoxB beta subunits of heterotetrameric sarcosine oxidase (Corynebacterium sp. U-96 SoxB;
    Pseudomonas putida KT2440 SoxB is placed here by UniProt''s PANTHER cross-reference). The subfamily
    label reflects FOXRED1 and is not specific to sarcosine oxidation.'
  diverged_from_family: true
  divergence_description: Bacterial SoxB carries the sarcosine oxidation site with noncovalently bound
    FAD and covalently bound FMN in the cytoplasmic SoxABDG heterotetramer. This is distinct from monomeric
    sarcosine oxidases with covalent FAD. Whole THF-coupled turnover is an assembled-complex activity;
    the isolated beta constructs tested did not establish autonomous complete activity. Eukaryotic mitochondrial
    and FOXRED1-dependent complex-I assembly assertions do not apply to these bacterial SoxB members.
  supported_by:
  - reference_id: file:CORS9/soxB/soxB-uniprot.txt
    supporting_text: Heterotetramer composed of subunits alpha (SoxA), beta (SoxB), gamma (SoxG) and delta
      (SoxD).
  - reference_id: file:CORS9/soxB/soxB-uniprot.txt
    supporting_text: DR   PANTHER; PTHR13847:SF287; FAD-DEPENDENT OXIDOREDUCTASE DOMAIN-CONTAINING PROTEIN
      1; 1.
  - reference_id: PMID:9185627
    supporting_text: noncovalently bound FAD and NAD+, and covalently bound FMN attached to the beta subunit
  representative_members:
  - id: UniProtKB:Q3TQB2
    label: FAD-dependent oxidoreductase domain-containing protein 1
    gene_symbol: Foxred1
    organism: Mus musculus
  - id: UniProtKB:Q50LF2
    label: Sarcosine oxidase subunit beta
    gene_symbol: soxB
    organism: Corynebacterium sp. (strain U-96)
  - id: UniProtKB:Q5EA45
    label: FAD-dependent oxidoreductase domain-containing protein 1
    gene_symbol: FOXRED1
    organism: Bos taurus
- subfamily_id: PANTHER:PTHR13847:SF289
  label: GLYCINE OXIDASE
  description: >-
    Mixed bacterial subfamily: ThiO glycine oxidases, the HcnC subunit of hydrogen cyanide
    synthase, and the single-chain cis-4-hydroxy-D-proline dehydrogenase of Pseudomonas putida
    KT2440 (PP_1255). The subfamily label reflects the ThiO members and does not predict the
    amino-acid substrate.
  diverged_from_family: true
  divergence_description: >-
    PP_1255 is a homomeric FAD enzyme that oxidizes cis-4-hydroxy-D-proline in hydroxyproline
    catabolism, not glycine. Glycine-oxidase or thiamine-biosynthesis terms should not be transferred
    to it from its SF289 relatives, and hydroxyproline-pathway terms should not be transferred to ThiO
    or HcnC. The P. aeruginosa D-hydroxyproline dehydrogenase is a heterotrimeric enzyme of different
    origin, so this activity is not an SF289-wide trait.
  supported_by:
  - reference_id: PMID:22833679
    supporting_text: >-
      D-hydroxyproline dehydrogenases from P. putida and P. aeruginosa were completely different from
      known bacterial proline dehydrogenases and showed similar high specificity for substrate
      (D-hydroxyproline) and some artificial electron acceptor(s).
  - reference_id: PMID:22833679
    supporting_text: the former is a homomeric enzyme only containing FAD as a prosthetic group
  representative_members:
