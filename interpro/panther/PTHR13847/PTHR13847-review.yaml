family_id: PANTHER:PTHR13847
family_name: SARCOSINE DEHYDROGENASE-RELATED
preferred_name: Sarcosine Dehydrogenase-Related
summary: SARCOSINE DEHYDROGENASE-RELATED (PANTHER:PTHR13847) is characterized in PANTHER PAINT across
  7 ancestral PTN node(s) (PANTHER:PTN000354057, PANTHER:PTN000354303, PANTHER:PTN001014589, PANTHER:PTN001014663
  (+3 more)) with 11 IBD node assertion(s) and 0 term(s) carrying negated IRD/IKR branch blocks, covering
  cytoplasm (GO:0005737, CC), mitochondrion (GO:0005739, CC), mitochondrial matrix (GO:0005759, CC), late
  endosome (GO:0005770, CC) and 7 additional GO term(s). The family is a broad DAO-fold FAD oxidoreductase
  family; besides mitochondrial dimethylglycine and sarcosine dehydrogenases, FOXRED1, PDPR, D-amino acid
  dehydrogenases, glycine oxidase and MnmC, it contains the bacterial SoxB beta subunits of heterotetrameric
  sarcosine oxidase (in SF287).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR13847 (SARCOSINE DEHYDROGENASE-RELATED) span 7 distinct
  ancestral PTN nodes (PANTHER:PTN000354057, PANTHER:PTN000354303, PANTHER:PTN001014589, PANTHER:PTN001014663,
  PANTHER:PTN001015057 (+2 more)) with different molecular function assignments across clades (tRNA (5-methylaminomethyl-2-thiouridylate)(34)-methyltransferase
  activity (GO:0004808), D-amino-acid dehydrogenase activity (GO:0008718)), indicating clade-level functional
  specialization across the family.
