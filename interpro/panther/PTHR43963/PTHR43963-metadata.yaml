  name:
    name: Short-chain Dehydrogenases/Reductases (SDR)
    short: SDR
  description:
  - text: The Short-chain Dehydrogenases/Reductases (SDR) family encompasses enzymes
      with NADPH-dependent reductase activity, exhibiting broad substrate specificity.
      Members of the family catalyze the reduction of various carbonyl compounds,
      including quinones, prostaglandins, and xenobiotics, to their corresponding
      alcohols. They are involved in the metabolism of antitumor anthracyclines, converting
      them to cardiotoxic compounds, and participate in glucocorticoid metabolism.
      Some family members are implicated in the biosynthesis of secondary metabolites,
      such as fumigermin and mycotoxins like atranones, playing roles in fungal defense
      and competition. The family also includes enzymes that reduce S-nitrosoglutathione
      and bind glutathione, which may confer higher affinity for glutathione-conjugated
      substrates. Their activity regulation can be influenced by various compounds,
      including quercetin and rutenin derivatives.
