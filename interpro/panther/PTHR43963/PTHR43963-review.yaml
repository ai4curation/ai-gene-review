family_id: PANTHER:PTHR43963
family_name: Short-chain Dehydrogenases/Reductases
preferred_name: CBR1/CBR3 NADPH-dependent carbonyl reductases
summary: >-
  PTHR43963 is a short-chain dehydrogenase/reductase family whose reviewed human
  animal branch contains the cytosolic monomeric carbonyl reductases CBR1 and
  CBR3. CBR1, in PTHR43963:SF2, is a broad NADPH-dependent carbonyl reductase
  that reduces xenobiotic carbonyls, quinones, prostaglandins,
  S-nitrosoglutathione and cortisol. CBR3, in PTHR43963:SF3, preserves the same
  cytosolic SDR scaffold but has a narrower orthoquinone-biased carbonyl
  reductase profile and lacks direct support for the prostaglandin activities
  that distinguish CBR1.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  PAINT's GO:0004090 carbonyl reductase node is sound for the metazoan
  CBR1/CBR3 branch and is supported by both human paralogs and mammalian CBR1
  orthologs. The older GO:0016491 oxidoreductase assertion is very broad but is
  biologically true for the same SDR fold. More specific prostaglandin,
  glucocorticoid and S-nitrosoglutathione activities are CBR1 paralog
  specializations and should not be projected onto CBR3.
notes: >-
  PTHR43963 also contains fungal short-chain reductases in PTHR43963:SF6. The
  current PAINT file places only the generic oxidoreductase term at the
  eukaryotic root PTN000673323 and places carbonyl reductase (NADPH) activity at
  PTN001214843, the eumetazoan animal carbonyl-reductase branch seeded by human
  CBR1, human CBR3 and mammalian CBR1/CBR3 orthologs. No IRD or IKR loss is
  reported on either human lineage.
review_status: COMPLETE
