  name:
    name: HAD-like hydrolase superfamily
    short: HAD-like_hydrolase_sf
  description:
  - text: The HAD-like hydrolase superfamily protein family is characterized by its
      members' ability to catalyze various dephosphorylation reactions. Members of
      this family are involved in diverse biological processes, including the degradation
      of rRNA, glycerol metabolism, and carbohydrate intermediate regulation. Some
      proteins within the family act as pseudouridine-5'-phosphatases, dephosphorylating
      pseudouridine 5'-phosphate, which is a potential intermediate in rRNA degradation,
      leading to the excretion of pseudouridine. Others function as glycerol-3-phosphatases,
      showing stereospecificity for L-glycerol-3-phosphate, and are involved in glycerol
      metabolism. Additionally, beta-phosphoglucomutase, which is part of this family,
      plays a crucial role in glycolysis and the formation of UDP-glucose by catalyzing
      the interconversion of glucose 1-phosphate and glucose 6-phosphate. The family
      showcases a broad substrate specificity, indicating a wide range of physiological
      roles.
