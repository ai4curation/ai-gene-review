family_id: PANTHER:PTHR18901
family_name: 2-DEOXYGLUCOSE-6-PHOSPHATE PHOSPHATASE 2
preferred_name: Diverse HAD-like phosphatases and phosphomutases
summary: This HAD-like family contains pseudouridine-5-prime-phosphatases, glycerol-3-phosphatases, carbohydrate
  phosphatases and beta-phosphoglucomutase. The shared fold supports phosphate-group chemistry but does
  not specify the physiological substrate or distinguish hydrolysis from intramolecular phosphate transfer.
  Human HDHD1/PUDP is experimentally selective for pseudouridine 5-prime-phosphate.
functional_coherence: HETEROGENEOUS
coherence_reason: HAD-superfamily phosphatases share a catalytic scaffold but vary in their cap domains
  and phosphometabolite recognition. Recombinant human HDHD1/PUDP hydrolyzes pseudouridine 5-prime-phosphate
  with high specificity, exceeding its activity on UMP by over three orders of magnitude (PMID:20722631).
  This is positive evidence for one substrate-specific branch, not a license to transfer pseudouridine-phosphate
  or 2-deoxyglucose-6-phosphate hydrolysis to every HAD member. CG5565 remains a phosphatase-family protein
  with unresolved physiological substrate.
