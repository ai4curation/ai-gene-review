  assessment: SOUND
  assessment_reason: >-
    The node is seeded by three fungal SAICAR synthetases with experimental support. All three seeds
    are fungal, but the cached PAINT GAF shows that the node's 85 recipients include bacterial,
    archaeal and plant members (M. tuberculosis PurC, Arabidopsis PUR7, Haloarchaea, Bacteroides,
    Leptospira and others), consistent with an ancient, conserved activity. A Pfam check of all
    recipients found the SAICAR synthetase domain in every recipient with Pfam data except one,
    Bacteroides thetaiotaomicron BT_1474 (Q8A7Q0). BT_1474 has a RimK-like ATP-grasp N-terminal domain
    and a D-Ala-D-Ala ligase C-terminal domain. That leaf should not inherit the term, but a single
    misplaced leaf does not undermine the node. The ADE1 and ade7 gene reviews accept the inherited
    activity, and the companion GO:0006189 IBD at the same node.
