family_id: PANTHER:PTHR43700
family_name: PHOSPHORIBOSYLAMINOIMIDAZOLE-SUCCINOCARBOXAMIDE SYNTHASE
preferred_name: Fungal/plant-type (PurC2-type) standalone SAICAR synthetases
summary: >-
  Standalone SAICAR synthetases of the type found in fungi (S. cerevisiae Ade1, S. pombe ade7,
  Candida ADE1), plants (Arabidopsis PUR7, chloroplastic) and many bacteria and archaea
  (M. tuberculosis PurC and others). They catalyse step 7 of de novo IMP synthesis: the ATP-dependent
  ligation of L-aspartate to CAIR, giving SAICAR. They share the SAICAR synthetase domain (Pfam
  PF01259) with the PurC/PAICS family PTHR43599, but PANTHER treats them as a separate family. In
  S. cerevisiae the product, SAICAR, is also the metabolic signal that promotes Bas1-Bas2 activation
  of the ADE genes.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed members in the fetched inventory (162 in SF1) are annotated as
  phosphoribosylaminoimidazole-succinocarboxamide synthases. All the model-organism members (yeast
  Ade1, pombe ade7, Arabidopsis PUR7, M. tuberculosis PurC) carry the SAICAR synthetase domain, and
  the activity is demonstrated for yeast Ade1 and pombe ade7. Of the 85 PAINT recipients, one
  (Bacteroides thetaiotaomicron BT_1474) lacks the domain; it is a misplaced leaf rather than a
  divergent subfamily.
