term_assessments:
- assessed_term:
    id: GO:0004632
    label: phosphopantothenate--cysteine ligase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for the PPCS subfamily SF2 only, never for the cornichon subfamilies. The coenzyme A
    module grounds the ppcs_activity annoton on PANTHER:PTHR12290:SF2, the correct descriptor.
    The nucleotide used differs by lineage: human PPCS prefers ATP, while recombinant yeast Cab2
    can use ATP or CTP in vitro. The term covers both.
