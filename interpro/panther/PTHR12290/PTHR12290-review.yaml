      PPA in vitro.
  - reference_id: PMID:11923312
    supporting_text: The individual human enzymes were overexpressed in E. coli and purified, and
      the corresponding activities were experimentally verified.
  - reference_id: PMID:19266201
    supporting_text: Null mutants could be complemented by their bacterial counterparts coaBC, coaD
