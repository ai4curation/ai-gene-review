family_id: PANTHER:PTHR12290
family_name: CORNICHON-RELATED
preferred_name: Cornichon cargo receptors plus eukaryotic phosphopantothenate--cysteine ligase (PPCS)
summary: >-
  A composite PANTHER family that groups two unrelated kinds of protein. Most subfamilies are
  cornichon proteins: small multi-pass ER membrane proteins (Pfam Cornichon, PF03311) that act
  as COPII cargo receptors (S. cerevisiae Erv14/Erv15, Drosophila cni, plant CNIHs). Vertebrate
  CNIH2/CNIH3 are also AMPA receptor auxiliary subunits. Subfamily SF2 holds the eukaryotic
  monofunctional phosphopantothenate--cysteine ligases (PPCS, EC 6.3.2.5/6.3.2.51): human PPCS,
  S. cerevisiae Cab2, S. pombe ppc1 and Arabidopsis PPCS1/PPCS2. These are soluble DFP-domain
  enzymes (Pfam PF04127) that condense 4'-phosphopantothenate with L-cysteine, the second step
  of coenzyme A synthesis. PANTHER's own InterPro description names the family
  Cornichon/Phosphopantothenate--cysteine ligase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The cornichon subfamilies (ER-export cargo receptors, AMPA receptor auxiliary subunits) and
  the PPCS subfamily SF2 (a CoA biosynthetic ligase) share no function, domain or compartment.
  PPCS has no transmembrane segments and carries the DFP domain; Erv14 has three transmembrane
  segments and the Cornichon domain. PAINT keeps the two apart: PPCS terms sit on node
  PTN000265180, cornichon terms on PTN000265245/PTN000265246 and the vertebrate
  CNIH2/CNIH3 nodes. No PPCS member inherits a cornichon term. No term is safe at the family
  level, and the family name describes only the cornichon part.
