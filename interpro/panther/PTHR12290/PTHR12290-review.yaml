notes: >-
  Used by modules/coenzyme_a_biosynthesis.yaml (ppcs_activity, PANTHER:PTHR12290:SF2), which is
  consistent with this review. SF2 membership of PPCS, CAB2 and ppc1 is confirmed by the PANTHER
  19.0 classification files for human, budding yeast and fission yeast, and by the repo member
  index. The family's entries.csv leaves the subfamily blank for every Swiss-Prot member,
  because UniProt's PANTHER cross-reference gives only the family. Domain content (DFP PF04127
  in PPCS and Cab2; Cornichon PF03311 and three transmembrane segments in Erv14) was checked in
  UniProt Q9HAB8, P40506 and P53173 on 2026-10-06. No cornichon gene review exists in this repo,
  so the cornichon PAINT terms (cargo receptor activity, ER-to-Golgi transport, COPII vesicle,
  synapse/dendrite) are left unassessed. The S. pombe ppc1 gene review is still a stub with
  every action PENDING.
