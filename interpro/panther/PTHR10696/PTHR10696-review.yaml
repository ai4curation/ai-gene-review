family_id: PANTHER:PTHR10696
family_name: GAMMA-BUTYROBETAINE HYDROXYLASE-RELATED
preferred_name: Carnitine-biosynthesis 2-oxoglutarate dioxygenase family
summary: >-
  PTHR10696 contains Fe(II)/2-oxoglutarate oxygenases. In humans it has two
  reviewed Swiss-Prot members: mitochondrial TMLHE (PTHR10696:SF51), which
  hydroxylates trimethyllysine as the first step of L-carnitine biosynthesis,
  and cytosolic BBOX1 (PTHR10696:SF33), which hydroxylates gamma-butyrobetaine
  as the terminal step. PAINT correctly places carnitine biosynthesis at their
  shared eukaryotic clade, then separates the BBOX and TMLHE molecular functions.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family is unified by the 2-oxoglutarate oxygenase fold but diverges by
  substrate and pathway. Human BBOX1 and TMLHE act on different carnitine
  intermediates in different compartments, and other subfamilies include related
  fungal/animal enzymes and bacterial dioxygenases that do not catalyze either
  human reaction.
