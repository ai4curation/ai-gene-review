    supporting_text: "PTHR10696\tPTN000075565\tGO:0045329\tP\tIRD\ttrue"
  - reference_id: PMID:41022783
    supporting_text: C. elegans model of BBOX1 homolog, gbh-1, and strains harboring patient-derived
  - reference_id: PMID:41022783
    supporting_text: for the gbh-1 loss-of-function strains, which was rescued upon L-carnitine
