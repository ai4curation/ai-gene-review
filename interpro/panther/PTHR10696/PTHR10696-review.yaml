family_id: PANTHER:PTHR10696
family_name: GAMMA-BUTYROBETAINE HYDROXYLASE-RELATED
preferred_name: Gamma-butyrobetaine hydroxylase and TMLHE
summary: >-
  PTHR10696 contains the Fe(II)/2-oxoglutarate-dependent dioxygenases of carnitine biosynthesis, gamma-butyrobetaine
  hydroxylase (BBOX1, worm GBH-1) and trimethyllysine dioxygenase (TMLHE).
functional_coherence: MOSTLY_COHERENT
coherence_reason: Both enzymes are carnitine-biosynthesis dioxygenases acting on different steps.
node_assessments:
- node_id: PANTHER:PTN000075565
  asserted_term:
    id: GO:0045329
    label: carnitine biosynthetic process
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN000075473
    label: PTN000075473 (ancestral IBD node; IRD source)
  paint_snapshot: '20260828'
  node_taxon:
    id: NCBITaxon:1206794
    label: Ecdysozoa
  assessment: LOSS_CONTRADICTED
  proposed_action:
    paint_action: REMOVE_LOSS
  assessment_reason: >-
    PTN000075565 is an ecdysozoan clade (10 leaves, SF33) of gamma-butyrobetaine hydroxylase homologs:
    C. elegans GBH-1, Drosophila CG10814 and Pristionchus relatives. GBH-1 is the worm BBOX1 homolog:
    gbh-1 knockout and patient-variant strains have very low L-carnitine and raised gamma-butyrobetaine,
    and the embryonic lethality is rescued by L-carnitine (PMID:41022783). The clade's carnitine biosynthesis
    function is retained.
  supported_by:
