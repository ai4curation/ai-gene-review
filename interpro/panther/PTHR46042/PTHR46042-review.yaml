family_id: PANTHER:PTHR46042
family_name: DIPHTHINE METHYLTRANSFERASE
preferred_name: Dph7 (RRT2/WDR85) WD40-repeat diphthine methylesterase family
summary: >-
  Dph7 is a WD40-repeat beta-propeller enzyme of eukaryotic diphthamide biosynthesis on
  translation elongation factor 2. It hydrolyses the diphthine methyl ester made by the
  eukaryotic Dph5 methyltransferase to diphthine and methanol (EC 3.1.1.97), which lets the
  ATP-dependent ligase Dph6 amidate the free carboxylate to diphthamide. It was the first WD40
  protein shown to have enzymatic activity, and its catalytic residues are not established.
  The family is eukaryote-specific, consistent with the absence of the esterification step in
  archaea, whose Dph5 does not make the methyl ester. PANTHER's and UniProt's name "diphthine
  methyltransferase" is misleading: the enzyme is a hydrolase, not a methyltransferase.
  Budding-yeast Rrt2/Dph7 is also known as Ere1, an endosomal protein needed for
  retromer-dependent recycling of the arginine permease Can1; that second role has been
  reported only in S. cerevisiae.
functional_coherence: COHERENT
coherence_reason: >-
  The family has one subfamily (SF1, DIPHTHINE METHYLTRANSFERASE) and, in the InterPro
  taxonomy breakdown, only eukaryotic members (no archaeal or bacterial proteins). The
  characterized members (yeast Rrt2/Dph7 biochemically, human DPH7 as the PAINT seed for the
  pathway) are the diphthamide-pathway methylesterase. The yeast Ere1 endosomal recycling role
  is a lineage-specific observation, not a family property.
