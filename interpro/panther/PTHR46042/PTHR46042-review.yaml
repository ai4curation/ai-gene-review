    additional, non-core location.
term_assessments:
- assessed_term:
    id: GO:0061685
    label: diphthine methylesterase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the term the diphthamide module asserts for the Dph7 role. It is shown
    biochemically for yeast Dph7 (IDA/IMP, accepted in the RRT2 review), and the family is a
    single eukaryote-only orthologous group that tracks the eukaryote-specific methyl-ester
    step. No PAINT node currently asserts it; the MF has to be added to members individually.
    It could be placed at PTN000522690, where the process term already sits.
  supported_by:
  - reference_id: PMID:24739148
    supporting_text: Dph7 is a methylesterase that hydrolyzes methylated diphthine to produce diphthine
  - reference_id: PMID:24739148
    supporting_text: Consistent with this, archaea lack the demethylation enzyme, Dph7.
- assessed_term:
    id: GO:0017183
    label: protein histidyl modification to diphthamide
  scope: FAMILY_WIDE
  scope_reason: See the PTN000522690 node assessment.
  supported_by:
  - reference_id: PMID:22188241
    supporting_text: YBR246W is required for the third step of diphthamide biosynthesis.
- assessed_term:
    id: GO:0017178
    label: diphthine-ammonia ligase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    Yeast RRT2 carries this term from the YeastPathways RCA conversion, which assigned the
    amidation reaction to RRT2. Dph7 has no ATP-binding (adenine nucleotide alpha hydrolase)
    domain; the amidating ligase is Dph6 (PTHR12196). The RRT2 review removes the row, and the
    module corrects the YeastCyc assignment. No member of this family should carry the term.
  supported_by:
  - reference_id: PMID:23169644
    supporting_text: However, we thought it was a scaffold or adaptor protein instead of the actual
      enzyme that catalyzes the amidation reaction because it lacks an ATP-dependent catalytic domain.
  - reference_id: file:genes/yeast/RRT2/RRT2-ai-review.yaml
    supporting_text: It lacks an ATP-binding domain and is not the diphthamide synthetase.
- assessed_term:
    id: GO:0032456
    label: endocytic recycling
  scope: UNRESOLVED
  scope_reason: >-
    Shown only for S. cerevisiae Rrt2/Ere1, which is needed for retromer-mediated recycling of
    Can1. Whether any other Dph7 ortholog has such a role is unknown. It is not a family
    property and should not be propagated.
  supported_by:
  - reference_id: PMID:21880895
    supporting_text: Ere1 is required for Can1 recycling via the retromer-mediated pathway
