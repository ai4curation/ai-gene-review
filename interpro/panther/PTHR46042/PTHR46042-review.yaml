notes: >-
  Module: modules/diphthamide_biosynthesis.yaml uses PANTHER:PTHR46042 (family level) for the
  Dph7 annoton with GO:0061685; consistent with this review. The module's evidence note that
  the UniProt name "diphthine methyltransferase" is misleading applies equally to PANTHER's
  family and subfamily names. PAINT node taxon (taxon:2759 in the paint tsv) was expanded to
  NCBITaxon:2759. Inheritance was checked against the PAINT UniProt GAF: PTN000522690 gives
  both terms to 92 taxa, all eukaryotic. .cache/panther/IBD.gaf has no IRD/IKR rows for this
  node. Seed UniProtKB:Q587G9 for the cytoplasm row was resolved with
  the UniProt REST API (unreviewed T. brucei entry, ORF Tb927.2.2910); its supporting
  experiment was not reviewed here.
