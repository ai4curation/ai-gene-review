family_id: PANTHER:PTHR12935
family_name: GAMMA-GLUTAMYLCYCLOTRANSFERASE
preferred_name: Gamma-glutamylcyclotransferase (GGCT) family
summary: >-
  Gamma-glutamylcyclotransferase releases 5-oxoproline from gamma-glutamyl dipeptides in the gamma-glutamyl
  cycle (human GGCT). The family also contains fungal homologs in secondary-metabolite clusters such
  as Clonostachys VerK.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF0); the fungal cluster-associated members are uncharacterized beyond homology.
