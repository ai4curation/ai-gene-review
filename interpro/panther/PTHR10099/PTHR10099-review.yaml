term_assessments:
- assessed_term:
    id: GO:0004642
    label: phosphoribosylformylglycinamidine synthase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The de_novo_purine_synthesis module uses PTHR10099 for the step-4 FGAM synthase annoton, and
    PAINT places this activity at PTN008493809. The activity holds for every single-chain
    large-PurL/PFAS member. Two caveats: an archaeal PurQ protein contributes only the glutaminase
    half-reaction to a PurQ/PurL/PurS complex, so for those proteins the activity is at most
    contributes_to; and the herpesvirus FGARAT-like tegument proteins have no demonstrated activity.
    Neither group receives the IBA. Read the family-wide scope as covering the cellular large-PurL
    enzymes that the module and PAINT actually address.
  supported_by:
  - reference_id: PMID:9331966
    supporting_text: The ADE6 gene of Saccharomyces cerevisiae yeast encoding the enzyme formylglycinamidine-ribonucleotide
      (FGAM)-synthetase of de novo synthesis of purine nucleotides was cloned and sequenced.
  - reference_id: PMID:10548741
    supporting_text: The P1 clone corrects the purine auxotrophy and protein deficiency of Chinese hamster
      ovary (CHO) cell mutants (AdeB) deficient in both the activity and the protein for FGARAT.
  - reference_id: file:genes/yeast/ADE6/ADE6-ai-review.yaml
    supporting_text: Cytosolic FGAM synthase catalysing step 4 (FGAR + Gln + ATP -> FGAM) of de novo IMP
      biosynthesis.
  - reference_id: file:genes/human/PFAS/PFAS-ai-review.yaml
    supporting_text: 'Phosphoribosylformylglycinamidine synthase (FGAM synthase, FGARAT; EC 6.3.5.3): the
      ATP- and glutamine-dependent amidotransferase catalysing step four of de novo purine synthesis,
      converting FGAR to FGAM.'
  - reference_id: file:modules/de_novo_purine_synthesis.yaml
    supporting_text: 'role_description: Introduces the second ring nitrogen to form FGAM.'
- assessed_term:
    id: GO:0006164
    label: purine nucleotide biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    FGAM synthase catalyses a step of de novo IMP synthesis, so the enzyme does part of the work of
    purine nucleotide biosynthesis. The term is correct but general; the specific process is
    GO:0006189 'de novo' IMP biosynthetic process. Same caveat as for the activity: PurQ subunits
    and the viral tegument proteins are not covered by the node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10099/PTHR10099-paint.tsv
    supporting_text: "PTHR10099\tPTN008493809\tGO:0006164\tP\tIBD\tfalse\tPomBase:SPAC6F12.10c|SGD:S000003293|UniProtKB:O15067"
  - reference_id: PMID:10548741
    supporting_text: One notable exception is the phosphoribosylformylglycineamide amidotransferase (FGARAT)
      gene, which encodes the fourth step of this pathway.
