family_id: PANTHER:PTHR10099
family_name: PHOSPHORIBOSYLFORMYLGLYCINAMIDINE SYNTHASE
preferred_name: Large single-chain FGAM synthase (PurL/FGARAT) family
summary: >-
  Phosphoribosylformylglycinamidine (FGAM) synthase, also called FGAR amidotransferase (FGARAT),
  catalyses step 4 of de novo IMP biosynthesis: the ATP- and glutamine-dependent conversion of
  formylglycinamide ribonucleotide (FGAR) to formylglycinamidine ribonucleotide (FGAM). The members
  of this family that carry out the reaction are the large single-chain enzymes (E. coli and
  Pseudomonas PurL, S. cerevisiae Ade6, S. pombe ade3, animal PFAS, plant At1g74260), in which a
  glutaminase domain supplies ammonia to the synthetase domain within one polypeptide. The family
  inventory also holds the separate PurQ glutaminase subunits of archaeal small-PurL systems and
  herpesvirus tegument proteins (Epstein-Barr virus BNRF1, KSHV ORF75 and related antigens) that
  are homologous to FGAM synthase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All cellular large-PurL/PFAS members catalyse the same reaction, and every reviewed protein that
  receives the PAINT IBD from PTN008493809 is one of them. Two groups in the same PANTHER subfamily
  (SF1) do not share the whole function. The archaeal PurQ proteins are only the glutaminase
  subunit of a three-protein (PurQ/PurL/PurS) small-PurL synthase. The herpesvirus tegument
  proteins (BNRF1, ORF75 and related antigens) are virion components whose FGAM synthase activity
  has not been shown. Neither group inherits the PAINT IBAs, so the PAINT placement already
  excludes them.
