notes: >-
  The PAINT recipient set for PTN008493809 was enumerated from the cached PAINT UniProt GAF
  (.cache/panther/gene_association.paint_uniprot.gaf.gz). PurQ subunit accessions (A4G010, A6VIG8,
  Q6M0U0 and others) and herpesvirus tegument proteins (BNRF1, ORF75, antigens 3 and 75) carry no
  IBA from this node. Bacillus-type small PurL synthetases are not in this PANTHER family. The
  catalytic status of the viral FGARAT-like proteins was not examined, and nothing here asserts that
  they are inactive.
