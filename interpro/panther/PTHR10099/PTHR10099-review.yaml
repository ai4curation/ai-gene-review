  assessment: SOUND
  assessment_reason: >-
    The seeds span bacteria (E. coli PurL), fungi (Ade6) and animals (fly and human PFAS). The 135
    UniProt proteins that inherit the term from this node in the PAINT GAF include, among reviewed
    entries, only large-PurL/PFAS enzymes: E. coli, Pseudomonas, Salmonella, Vibrio and other
    bacterial PurL, S. cerevisiae Ade6, S. pombe ade3, Dictyostelium purL, human, mouse, fly and
    worm PFAS, and Arabidopsis At1g74260. Neither the archaeal PurQ subunits nor the herpesvirus
    tegument proteins in the same subfamily inherit it. The gene reviews of Ade6, ade3 and PFAS
    accept the inherited activity. The companion IBDs at this node (GO:0006164 purine nucleotide
    biosynthetic process, GO:0005737 cytoplasm) reach the same set and are accepted in the same
    reviews.
