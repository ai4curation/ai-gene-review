term_assessments:
- assessed_term:
    id: GO:0097163
    label: sulfur carrier activity
  scope: FAMILY_WIDE
  scope_reason: sulfur carrier activity (GO:0097163) is supported by PAINT IBD assertion(s) at PANTHER:PTN002200704
    across the family phylogeny. The official tree/MSA and primary E. coli relay evidence were inspected;
    exact KT2440 membership is independently supported by its UniProt record. This scope does not license
    arbitrary cross-species pairing or autonomous sulfur transfer by structural subunits.
  supported_by:
  - reference_id: file:interpro/panther/PTHR37010/PTHR37010-paint.tsv
    supporting_text: "PTHR37010\tPTN002200704\tGO:0097163\tF\tIBD\tfalse\tUniProtKB:P0AB18\ttaxon:\t20170906"
  - *id001
- assessed_term:
    id: GO:0002143
    label: tRNA wobble position uridine thiolation
  scope: UNRESOLVED
  scope_reason: Established for the TusE orthologs of Tus-encoding Gammaproteobacteria (E. coli
    experimentally; KT2440 TusE by family membership and the tus locus), which form clade PTN002200710 in the
    reference tree. PTHR37010 has a single subfamily that also holds DsrC proteins of dissimilatory sulfur
    metabolism (Thermodesulfovibrio, Desulfovibrio DsvC) and an archaeal member, so the process cannot be
    granted family-wide and no subfamily boundary separates the two groups. Missing evidence for the
    non-Tus members is tRNA thiolation (s2U34) data; until then the term is safe only for the TusE clade.
  supported_by:
  - reference_id: file:interpro/panther/PTHR37010/PTHR37010-paint.tsv
    supporting_text: "PTHR37010\tPTN002200704\tGO:0002143\tP\tIBD\tfalse\tUniProtKB:P0AB18\ttaxon:\t20170906"
  - reference_id: file:modules/bacterial_mnma_trna_thiolation-analysis/tree-check.txt
    supporting_text: "UniProtKB:B5YKQ2 THEYE_A0985 [Thermodesulfovibrio yellowstonii] PTHR37010:SF1"
  - reference_id: file:interpro/panther/PTHR37010/PTHR37010-entries.csv
    supporting_text: P45573,"Sulfite reductase, dissimilatory-type subunit gamma",protein
  - *id001
