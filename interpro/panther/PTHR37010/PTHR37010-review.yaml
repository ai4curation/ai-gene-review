family_id: PANTHER:PTHR37010
family_name: SULFURTRANSFERASE TUSE
preferred_name: TusE terminal sulfur-relay carriers
summary: TusE associates with TusBCD and the MnmA–tRNA complex during wobble-uridine thiolation. Its relay
  role does not establish autonomous tRNA thiolation or interchangeable binding to every MnmA homolog.
functional_coherence: COHERENT
coherence_reason: The reviewed PAINT clade and extant functional evidence support the stated relay or
  complex role. Family-wide scope, where retained, concerns that role; it does not assert the same upstream
  donor, complete pathway, autonomous catalysis or obligate essentiality in every bacterium.
