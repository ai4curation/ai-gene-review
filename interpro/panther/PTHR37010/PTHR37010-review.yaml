family_id: PANTHER:PTHR37010
family_name: SULFURTRANSFERASE TUSE
preferred_name: DsrC/TusE family of C-terminal-cysteine sulfur carriers
summary: >-
  Small DsrC/TusE-family proteins with a conserved C-terminal cysteine that is
  persulfurated during sulfur relay. Escherichia coli TusE is the terminal carrier
  of the IscS-TusA-TusBCD-TusE-MnmA relay: it binds TusBCD, accepts sulfur from
  TusD on Cys108 and interacts with the MnmA-tRNA complex. The same single PANTHER
  subfamily also holds DsrC proteins of dissimilatory sulfur metabolism, including
  the gamma subunit (DsvC) of Desulfovibrio dissimilatory sulfite reductase and
  DsrC-like proteins of Thermodesulfovibrio and the archaeon Pyrobaculum.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members share the persulfide-carrying C-terminal cysteine, and PAINT places
  sulfur carrier activity at the single node PTN002200704, which covers every
  reference-tree leaf. The process the carrier serves differs: tRNA wobble-uridine
  thiolation for the enterobacterial and Pseudomonas TusE orthologs, dissimilatory
  sulfite reduction or sulfur oxidation for DsrC members.
