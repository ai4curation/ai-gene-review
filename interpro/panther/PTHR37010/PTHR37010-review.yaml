node_assessments:
- node_id: PANTHER:PTN002200704
  asserted_term:
    id: GO:0097163
    label: sulfur carrier activity
  evidence: IBD
  paint_snapshot: '20170906'
  seeds:
  - id: UniProtKB:P0AB18
  assessment: SOUND
  assessment_reason: >-
    The node covers all ten reference-tree leaves (TusE orthologs and DsrC-like
    proteins). Carrying sulfur on the conserved C-terminal cysteine is shared by
    TusE (Cys108) and by DsrC, which is persulfurated by DsrEFH in sulfur
    oxidizers, so a family-root carrier call is sound.
  supported_by:
  - reference_id: file:interpro/panther/PTHR37010/PTHR37010-paint.tsv
    supporting_text: "PTHR37010\tPTN002200704\tGO:0097163\tF\tIBD\tfalse"
  - reference_id: file:genes/ECOLI/tusE/tusE-uniprot.txt
    supporting_text: Could accept sulfur from TusD.
  - reference_id: UniProtKB:D3RPC0
    supporting_text: >-
      TusA serves as the sulfur donor for DsrEFH, which persulfurates DsrC;
      persulfurated DsrC very probably serves as a direct substrate for
      reverse-acting sulfite reductase, DsrAB.
- node_id: PANTHER:PTN002200704
  asserted_term:
    id: GO:0002143
    label: tRNA wobble position uridine thiolation
  evidence: IBD
  paint_snapshot: '20170906'
  seeds:
  - id: UniProtKB:P0AB18
  assessment: TOO_DEEP
  assessment_reason: >-
    The process is placed at the same node as the carrier activity, so it is
    inherited by the DsrC-like proteins of Thermodesulfovibrio yellowstonii
    (THEYE_A0003, THEYE_A0985) and Pyrobaculum aerophilum (PAE2566), whose
    characterized relatives act in dissimilatory sulfur metabolism. The process
    should sit on the clade of TusE orthologs encoded with TusBCD, not on the
    family root.
  supported_by:
  - reference_id: file:interpro/panther/PTHR37010/PTHR37010-paint.tsv
    supporting_text: "PTHR37010\tPTN002200704\tGO:0002143\tP\tIBD\tfalse"
  - reference_id: file:modules/bacterial_mnma_trna_thiolation-analysis/tree-check.txt
    supporting_text: "UniProtKB:B5YGS7 THEYE_A0003 [Thermodesulfovibrio yellowstonii] PTHR37010:SF1"
  - reference_id: UniProtKB:P45573
    supporting_text: >-
      Catalyzes the reduction of sulfite to sulfide. This is the
      terminal oxidation reaction in sulfate respiration, a process catalyzed
      by the sulfate-reducing bacteria.
