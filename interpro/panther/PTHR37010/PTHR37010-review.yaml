node_assessments:
- node_id: PANTHER:PTN002200704
  asserted_term:
    id: GO:0097163
    label: sulfur carrier activity
  assessment: SOUND
  assessment_reason: The recorded PAINT IBD assertion belongs to node PTN002200704 in the PTHR37010 TusE
    family. Characterized E. coli TusE (P0AB18) and the conserved family architecture support the inherited
    claim. This is a distinct protein family, not a shared TusB/TusC/TusE ancestral clade. Target absence
    from a sampled tree is not evidence of loss; the seed count is not a measure of node validity.
  paint_snapshot: '20170906'
  seeds:
  - id: UniProtKB:P0AB18
  supported_by:
  - reference_id: file:interpro/panther/PTHR37010/PTHR37010-paint.tsv
    supporting_text: "PTHR37010\tPTN002200704\tGO:0097163\tF\tIBD\tfalse\tUniProtKB:P0AB18\ttaxon:\t20170906"
  - &id001
    reference_id: PMID:16387657
    supporting_text: 'TusE binds TusBCD complex and stimulates sulfur transfer from

      TusA to TusD.'
  evidence: IBD
- node_id: PANTHER:PTN002200704
  asserted_term:
    id: GO:0002143
    label: tRNA wobble position uridine thiolation
  assessment: TOO_DEEP
  assessment_reason: The IBD is placed at the family root together with the sulfur-carrier IBD, so it is
    inherited by every member. In the PANTHER reference tree PTN002200704 also covers the DsrC-like
    Thermodesulfovibrio yellowstonii proteins THEYE_A0003 and THEYE_A0985 and the archaeal Pyrobaculum
    aerophilum PAE2566, none of which has an established tRNA-thiolation role; the family also contains the
    gamma subunit (DsvC, P45573) of Desulfovibrio dissimilatory sulfite reductase. Sulfur carrier activity
    is plausibly ancestral to the DsrC/TusE fold, but the relay process is supported only for the TusE
    orthologs of the Tus-encoding Gammaproteobacteria. Descendant node PTN002200710 holds exactly those seven
    reference-tree leaves (Escherichia, Salmonella, Yersinia, Haemophilus, Vibrio, Shewanella, Pseudomonas)
    and excludes the DsrC and archaeal leaves, so the process IBD should move there.
  paint_snapshot: '20170906'
  seeds:
  - id: UniProtKB:P0AB18
  proposed_action:
    paint_action: MOVE_IBD
    target_node_id: PANTHER:PTN002200710
    target_node_taxon:
      id: NCBITaxon:1236
      label: Gammaproteobacteria
  supported_by:
  - reference_id: file:interpro/panther/PTHR37010/PTHR37010-paint.tsv
    supporting_text: "PTHR37010\tPTN002200704\tGO:0002143\tP\tIBD\tfalse\tUniProtKB:P0AB18\ttaxon:\t20170906"
  - reference_id: file:modules/bacterial_mnma_trna_thiolation-analysis/tree-check.txt
    supporting_text: "UniProtKB:B5YGS7 THEYE_A0003 [Thermodesulfovibrio yellowstonii] PTHR37010:SF1"
  - reference_id: file:modules/bacterial_mnma_trna_thiolation-analysis/tree-check.txt
    supporting_text: "UniProtKB:Q8ZUX1 PAE2566 [Pyrobaculum aerophilum] PTHR37010:SF1"
  - reference_id: file:modules/bacterial_mnma_trna_thiolation-analysis/tree-check.txt
    supporting_text: "clade PTN002200710: 7 leaves: VC_1356 [Vibrio cholerae], tusE [Shewanella oneidensis],
      tusE [Haemophilus influenzae], tusE [Salmonella typhimurium], tusE [Escherichia coli], tusE [Yersinia
      pestis], PA2608 [Pseudomonas aeruginosa]"
  - reference_id: file:interpro/panther/PTHR37010/PTHR37010-entries.csv
    supporting_text: P45573,"Sulfite reductase, dissimilatory-type subunit gamma",protein
