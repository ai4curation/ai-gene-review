  scope: FAMILY_WIDE
  scope_reason: >-
    Family-root PAINT call supported by E. coli TusE and consistent with DsrC
    persulfuration; the conserved C-terminal cysteine is the carrier site.
  supported_by:
  - reference_id: file:interpro/panther/PTHR37010/PTHR37010-paint.tsv
    supporting_text: "PTHR37010\tPTN002200704\tGO:0097163\tF\tIBD\tfalse"
  - reference_id: PMID:16387657
    supporting_text: TusE binds TusBCD complex and stimulates sulfur transfer from TusA to TusD.
- assessed_term:
    id: GO:0002143
    label: tRNA wobble position uridine thiolation
  scope: UNRESOLVED
  scope_reason: >-
    True for TusE orthologs of the Tus relay (E. coli experimentally; KT2440
    TusE by family, active-site cysteine and tus locus), but the single subfamily
    also holds DsrC proteins of sulfate reduction and sulfur oxidation, so it
    cannot be granted family-wide, and PANTHER has no subfamily boundary that
    separates the two. Missing evidence: a tree node or subfamily that delimits
    the TusE clade, and tRNA-thiolation data for the DsrC members.
  supported_by:
  - reference_id: UniProtKB:P45573
    supporting_text: >-
      Catalyzes the reduction of sulfite to sulfide. This is the
      terminal oxidation reaction in sulfate respiration, a process catalyzed
      by the sulfate-reducing bacteria.
  - reference_id: file:genes/ECOLI/tusE/tusE-uniprot.txt
    supporting_text: >-
      Part of a sulfur-relay system required for 2-thiolation of 5-
      methylaminomethyl-2-thiouridine (mnm(5)s(2)U) at tRNA wobble positions.
