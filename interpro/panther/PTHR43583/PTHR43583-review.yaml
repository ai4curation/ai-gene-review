family_id: PANTHER:PTHR43583
family_name: 2-IMINOACETATE SYNTHASE
preferred_name: ThiH 2-iminoacetate synthase family (radical SAM tyrosine lyases)
summary: >-
  PTHR43583 groups radical SAM enzymes of the ThiH type. Its characterized members (subfamily SF1,
  E. coli and Salmonella ThiH) are 2-iminoacetate synthases (tyrosine lyases): a [4Fe-4S] cluster
  cleaves S-adenosyl-L-methionine to a 5'-deoxyadenosyl radical, which drives cleavage of the
  L-tyrosine Calpha-Cbeta bond to dehydroglycine (2-iminoacetate) and p-cresol. In the ThiGH
  heterodimer the dehydroglycine is condensed by thiazole synthase ThiG with 1-deoxy-D-xylulose
  5-phosphate and ThiS thiocarboxylate into the thiamine thiazole. A second PANTHER subfamily (SF2,
  THIAZOLE BIOSYNTHESIS PROTEIN) has no reviewed member in the frozen inventory. The family is
  integrated in InterPro IPR034428, whose representative structure is the [FeFe]-hydrogenase
  maturase HydG, a related tyrosine-cleaving radical SAM enzyme that converts dehydroglycine to CO
  and cyanide rather than passing it to ThiG.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All PAINT assertions sit on one bacterial node (PTN000541008) seeded by E. coli ThiH, and every
  reviewed member (SF1) is a ThiH 2-iminoacetate synthase. The exceptions are not characterized
  here: SF2 has no reviewed member, and HydG-, NosL- and CofG-like radical SAM relatives that share
  the BATS/tyrosine-lyase chemistry under the broader InterPro entry use the radical intermediate
  for other products (CO/CN- for hydrogenase maturation, 3-methylindole-2-carboxylate in
  nosiheptide synthesis, the F420 precursor FO), so the ThiH-specific activity and thiamine
  process terms are granted only to SF1.
