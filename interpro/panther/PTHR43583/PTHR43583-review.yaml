notes: >-
  All four PAINT rows are IBD gains at one Bacteria node (PTN000541008) seeded only by E. coli ThiH;
  there are no IRD/IKR rows. The frozen inventory lists only two Swiss-Prot members, both SF1 ThiH.
  HydG appears only as the InterPro representative structure; its PANTHER subfamily placement, and
  whether NosL- or CofG-like proteins fall in this family at all, were not resolvable from the local
  files, so the divergence statements about them are kept to the chemistry and no member is listed.
