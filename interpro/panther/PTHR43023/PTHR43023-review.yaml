- assessed_term:
    id: GO:0120014
    label: phospholipid transfer activity
  scope: UNRESOLVED
  scope_reason: MlaF supplies the ATP-dependent contribution to phospholipid transport in its assembled
    transporter; an isolated ATPase is not thereby a complete aqueous-phase carrier. MceG fatty-acid/cholesterol
