    organism: Escherichia coli (strain K12)
  assessment: SOUND
  assessment_reason: 'The one assertion that is true of every member: each is a stand-alone ABC nucleotide-binding
    domain whose job is ATP hydrolysis, and the two seeds are independently grounded experiments on the
    two ends of the family''s range - purified MlaFEB has high intrinsic ATPase activity (E. coli, IMP
    from PMID:27529189), and TGD3 shows basal ATPase activity in vitro (Arabidopsis, IDA curated by TAIR
    from PMID:17938172). P63386 appearing among its own IBA sources is expected and correct: its experimental
    annotation is one of the descendant evidences the IBD rests on, and the IBA then adds the phylogenetic
    claim that the activity is inherited rather than lineage-specific. The node is deep (it reaches cyanobacteria,
    Aquifex, Helicobacter and all green plants) but ATP hydrolysis is the family''s founding property,
    so depth is not a problem here.'
