family_id: PANTHER:PTHR43023
family_name: PROTEIN TRIGALACTOSYLDIACYLGLYCEROL 3, CHLOROPLASTIC
preferred_name: >-
  ATP-binding (nucleotide-binding domain) subunits of MCE-type lipid transport systems:
  MlaF of the diderm-bacterial Mla pathway, mycobacterial Mkl/MceG, and plant TGD3
summary: >-
  Small, stand-alone ABC nucleotide-binding domains (~260-360 aa, a single P-loop
  NTPase/ABC_tran module with no fused transmembrane domain) that energize lipid
  transport across a two-membrane envelope. The best-characterized member is
  Escherichia coli MlaF, which dimerizes at the cytoplasmic face of the inner membrane
  within the MlaFEDB complex: two MlaF ATPases pair with two copies of the MlaE
  permease (PTHR30188) and an MlaD (MCE) hexamer (PTHR33371), with the STAS-domain
  protein MlaB bound to each MlaF. The same three-component architecture recurs in two
  settings that define the family's functional boundaries. In mycobacteria the single
  ATPase Mkl/MceG (Rv0655) serves several Mce transporters whose substrates are not
  phospholipids: Mce1 imports host fatty acids and Mce4 imports cholesterol, and MceG
  is both the shared energizer and a stability factor for both. In plants and algae
  the orthologous ATPase TGD3 works with the TGD1 permease and the TGD2 MCE protein at
  the chloroplast inner envelope, importing ER-derived lipid (phosphatidic acid)
  toward thylakoid lipid synthesis; TGD3 is stromal rather than periplasmic, has
  measured basal ATPase activity, and a tgd3 mutant accumulates oligogalactolipids and
  triacylglycerols. So the conserved property of the family is the ATPase that drives
  an MCE-type lipid translocator; what varies is the lipid, the compartment pair, and
  whether the system runs toward the inner membrane or away from it. PANTHER's family
  name is taken from the plant member and is a poor description of the family as a
  whole, which is overwhelmingly bacterial: the InterPro slice records 17489 proteins
  across 11882 proteomes in three subfamilies, while the fetched entries.csv covers
  only the 10 UniProtKB/Swiss-Prot members (six enterobacterial/Haemophilus MlaF,
  three mycobacterial Mkl, and Arabidopsis TGD3).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member is the nucleotide-binding subunit of an MCE-type lipid transport system,
  and the generic terms (ATP hydrolysis activity, lipid transport) are safe throughout.
  Two identified groups diverge in what is transported and where. The mycobacterial
  Mkl/MceG proteins (inside SF6, alongside MlaF) energize cholesterol and fatty-acid
  importers, so phospholipid-specific terms do not hold for them. The plant/algal TGD3
  clade (SF3) acts in the chloroplast stroma on ER-derived plastid lipid import, so
  neither the bacterial plasma-membrane complex term nor the diderm-envelope
  intermembrane-transfer term applies; PAINT already handles that by restricting the
  corresponding node to taxon 2 (Bacteria). SF4 ("AMINO ACID ABC TRANSPORTER
  ATP-BINDING PROTEIN") carries a name implying a different substrate class altogether,
  but no member of it could be verified in the fetched entries or in UniProt queries
  restricted to model organisms, so its divergence is recorded as unassessed rather
  than asserted.
reference_protein:
  id: UniProtKB:P63386
  label: Intermembrane phospholipid transport system ATP-binding protein MlaF
  gene_symbol: mlaF
  organism: Escherichia coli (strain K12)
  gene_review: genes/ECOLI/mlaF/mlaF-ai-review.yaml

subfamilies:
  - subfamily_id: PANTHER:PTHR43023:SF6
    label: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM ATP-BINDING PROTEIN MLAF
    description: >-
      The subfamily the Mla module uses. It holds the enterobacterial and Haemophilus
      MlaF proteins (the ATPase of MlaFEDB), the Pseudomonas orthologs, and -
      importantly for term propagation - the mycobacterial Mkl/MceG proteins and
      actinobacterial relatives such as Streptomyces coelicolor SCO2422. So a single
      PANTHER subfamily spans both the phospholipid-handling Mla ATPase and the
      cholesterol/fatty-acid Mce ATPase, which is why the substrate-specific
      divergence below is recorded as member exceptions rather than as a subfamily
      scope.
    representative_members:
      - id: UniProtKB:P63386
        label: Intermembrane phospholipid transport system ATP-binding protein MlaF
        gene_symbol: mlaF
        organism: Escherichia coli (strain K12)
        gene_review: genes/ECOLI/mlaF/mlaF-ai-review.yaml
      - id: UniProtKB:Q88P94
        label: Intermembrane phospholipid transport system ATP-binding protein MlaF
        gene_symbol: mlaF
        organism: Pseudomonas putida (strain KT2440)
        gene_review: genes/PSEPK/mlaF/mlaF-ai-review.yaml
      - id: UniProtKB:P45031
        label: Intermembrane phospholipid transport system ATP-binding protein MlaF
        gene_symbol: mlaF
        organism: Haemophilus influenzae (strain KW20 / Rd)
      - id: UniProtKB:P9WQL5
        label: Probable ribonucleotide transport ATP-binding protein mkl
        gene_symbol: mkl
        organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
    supported_by:
      - reference_id: PMID:33236984
        supporting_text: At the center of the complex, a core ABC transporter module is formed from two copies each of the MlaF ATPase and the MlaE transmembrane domains (TMDs).
  - subfamily_id: PANTHER:PTHR43023:SF3
    label: PROTEIN TRIGALACTOSYLDIACYLGLYCEROL 3, CHLOROPLASTIC
    description: >-
      The subfamily PANTHER names the family after: plant and algal TGD3, the ATPase of
      the chloroplast inner-envelope TGD1/TGD2/TGD3 lipid importer, together with a set
      of bacterial paralogs that are not part of the canonical mlaFEDCB operon
      (Pseudomonas PP_0141 and PA3212, Helicobacter HP_1465, Synechocystis sll1041 and
      sll1001, Aquifex aq_1531). TGD3 has demonstrated basal ATPase activity and is
      localized beyond the inner chloroplast envelope membrane, i.e. in the stroma.
    representative_members:
      - id: UniProtKB:Q9AT00
        label: Protein TRIGALACTOSYLDIACYLGLYCEROL 3, chloroplastic
        gene_symbol: TGD3
        organism: Arabidopsis thaliana
      - id: UniProtKB:Q88RI8
        label: ABC transporter, ATP-binding protein
        gene_symbol: PP_0141
        organism: Pseudomonas putida (strain KT2440)
      - id: UniProtKB:P72734
        label: ABC transporter
        gene_symbol: sll1041
        organism: Synechocystis sp. (strain PCC 6803)
    diverged_from_family: true
    divergence_description: >-
      Eukaryotic organellar rather than diderm-bacterial envelope transport: TGD3 drives
      import of ER-derived lipid (phosphatidic acid) across the chloroplast inner
      envelope with TGD1 and TGD2, and sits in the chloroplast stroma. The diderm
      intermembrane transfer term (GO:0120010) therefore does not apply here, and PAINT
      already restricts the node carrying it to Bacteria; GO:1990531 does not apply
      either, but for a different reason that holds family-wide (it denotes a P-type
      flippase complex, while the plant TGD translocator, like every other member's
      complex, is an ABC transporter). The generic ATP
      hydrolysis and lipid transport terms remain correct, and the chloroplast location
      is asserted on its own plant-scoped node.
    supported_by:
      - reference_id: PMID:17938172
        supporting_text: "The TGD3 protein shows basal ATPase activity and is localized inside the chloroplast beyond the inner chloroplast envelope membrane."
      - reference_id: PMID:22544736
        supporting_text: TGD1, -2, and -3 (systematically named AtABCI4, -5, and -3) form a putative ABC transporter found in the chloroplast inner envelope membrane of plants and algae, in which TGD1 is similar to an ABC transporter permease, TGD3 to an NBD, and TGD2 to an SBD ( 8 , 9 ).
  - subfamily_id: PANTHER:PTHR43023:SF4
    label: AMINO ACID ABC TRANSPORTER ATP-BINDING PROTEIN
    description: >-
      Third subfamily of the family, whose PANTHER name asserts a different substrate
      class (amino acids) from the lipid-transport role of SF3 and SF6. No member of
      this subfamily appears in the fetched PTHR43023-entries.csv (which covers only
      reviewed entries), and a UniProt cross-reference query for this subfamily
      restricted to the organisms used elsewhere in this review returned no proteins,
      so no representative_members are asserted and the divergence is deliberately not
      claimed. Treat the subfamily as unassessed: a family-wide lipid term should not be
      assumed safe here, and this is the first thing to check if a future release
      propagates one into it.
    diverged_from_family: false

node_assessments:
  - node_id: PANTHER:PTN000655692
    asserted_term:
      id: GO:0016887
      label: ATP hydrolysis activity
    evidence: IBD
    paint_snapshot: "20250919"
    seeds:
      - id: AGI_LocusCode:AT1G65410
        label: TGD3
        organism: Arabidopsis thaliana
      - id: UniProtKB:P63386
        label: Intermembrane phospholipid transport system ATP-binding protein MlaF
        organism: Escherichia coli (strain K12)
    assessment: SOUND
    assessment_reason: >-
      The one assertion that is true of every member: each is a stand-alone ABC
      nucleotide-binding domain whose job is ATP hydrolysis, and the two seeds are
      independently grounded experiments on the two ends of the family's range -
      purified MlaFEB has high intrinsic ATPase activity (E. coli, IMP from
      PMID:27529189), and TGD3 shows basal ATPase activity in vitro (Arabidopsis, IDA
      curated by TAIR from PMID:17938172). P63386 appearing among its own IBA sources is
      expected and correct: its experimental annotation is one of the descendant
      evidences the IBD rests on, and the IBA then adds the phylogenetic claim that the
      activity is inherited rather than lineage-specific. The node is deep (it reaches
      cyanobacteria, Aquifex, Helicobacter and all green plants) but ATP hydrolysis is
      the family's founding property, so depth is not a problem here.
    supported_by:
      - reference_id: PMID:27529189
        supporting_text: In addition, we have demonstrated that MlaFEB possesses high intrinsic ATPase activity that is attenuated by MlaD association (Figure 5A).
      - reference_id: PMID:17938172
        supporting_text: "The TGD3 protein shows basal ATPase activity and is localized inside the chloroplast beyond the inner chloroplast envelope membrane."
  - node_id: PANTHER:PTN000655692
    asserted_term:
      id: GO:0120014
      label: phospholipid transfer activity
    evidence: IBD
    paint_snapshot: "20250919"
    seeds:
      - id: UniProtKB:P63386
        label: Intermembrane phospholipid transport system ATP-binding protein MlaF
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Defensible where it is seeded and wrong at the edges. The seed is E. coli MlaF,
      which carries an IDA to this term from the MlaFEDB structural and transport work
      (PMID:33199922), so the assertion reflects a curator's decision to attribute the
      complex's transfer activity to its ATP-binding subunit. But the node is the whole
      family root: the same IBA reaches the mycobacterial Mkl/MceG proteins, whose
      transporters move cholesterol (Mce4) and fatty acids (Mce1) rather than
      phospholipids, and it reaches the SF3 bacterial paralogs that are not part of an
      mla operon at all. The branch that needs an IRD is the actinobacterial
      Mkl/MceG clade; a generic lipid term (GO:0006869, already asserted at this same
      node) is what those members should keep. No affected_subfamilies are named because
      the boundary runs inside SF6, which holds MlaF and Mkl together, so a
      subfamily-level exclusion would wrongly strip the reference protein's own clade.
      A second, broader caveat for a future PAINT curator: a phospholipid *transfer
      activity* - carrying a lipid through an aqueous phase in a hydrophobic pocket - is
      performed by MlaC and by the MlaD hexamer, not by a cytoplasmic ATPase, so the
      term is arguably a complex-level attribution throughout this family. That is a
      question about the seed annotation rather than about node placement, and it is
      recorded here rather than acted on.
    supported_by:
      - reference_id: PMID:36642182
        supporting_text: "Fatty acids and cholesterol are imported across the Mtb cell wall via the dedicated Mce1 and Mce4 transporters, respectively."
      - reference_id: PMID:36642182
        supporting_text: "However, unlike canonical bacterial ABC transporters, Mce1 and Mce4 appear to share a single ATPase, MceG."
  - node_id: PANTHER:PTN000655692
    asserted_term:
      id: GO:0006869
      label: lipid transport
    evidence: IBD
    paint_snapshot: "20250919"
    seeds:
      - id: AGI_LocusCode:AT1G65410
        label: TGD3
        organism: Arabidopsis thaliana
      - id: UniProtKB:P63386
        label: Intermembrane phospholipid transport system ATP-binding protein MlaF
        organism: Escherichia coli (strain K12)
      - id: UniProtKB:P9WQL5
        label: Probable ribonucleotide transport ATP-binding protein mkl
        organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
    assessment: SOUND
    assessment_reason: >-
      This is the family-level term done right, and it is worth saying why: the seed set
      is exactly the three functional groups the family contains - MlaF (phospholipid),
      TGD3 (ER-derived plastid lipid) and Mkl/MceG (host cholesterol and fatty acids) -
      and the term chosen is the substrate-neutral parent that all three satisfy.
      Because GO:0006869 abstracts over the lipid class, the divergence that makes
      GO:0120014 and GO:0120010 unsafe at this depth costs nothing here. The
      mycobacterial seed is independently grounded: MceG is required for both Mce1-
      and Mce4-mediated lipid transport, and Rv0655/MceG was recovered in a
      macrophage-infection screen for fatty-acid import.
    supported_by:
      - reference_id: PMID:36642182
        supporting_text: "Fatty acids and cholesterol are imported across the Mtb cell wall via the dedicated Mce1 and Mce4 transporters, respectively."
      - reference_id: PMID:30735132
        supporting_text: "This screen identified the novel genes as rv2799 and rv0966c as be necessary for fatty acid import and confirmed the central role for Rv3723/LucA and putative components of the Mce1 fatty acid transporter (Rv0200/OmamB, Rv0172/Mce1D, and Rv0655/MceG) in this process."
  - node_id: PANTHER:PTN000655704
    asserted_term:
      id: GO:1990531
      label: phospholipid-translocating ATPase complex
    evidence: IBD
    node_taxon:
      id: NCBITaxon:2
      label: Bacteria
    paint_snapshot: "20250919"
    seeds:
      - id: UniProtKB:P63386
        label: Intermembrane phospholipid transport system ATP-binding protein MlaF
        organism: Escherichia coli (strain K12)
    assessment: WRONG_NODE
    assessment_reason: >-
      The problem is the term choice, not the node position. GO:1990531 is defined as a
      protein complex that functions as a phospholipid-translocating P-Type ATPase, i.e.
      a P4-ATPase flippase complex. Every member of this family is instead the
      nucleotide-binding subunit of an ABC transporter, so no descendant of this node is
      part of a P-type ATPase complex and the seed cannot support the term at any node.
      The seed annotation itself (E. coli MlaF, IPI to the MlaFEDB complex,
      PMID:27529189) correctly records membership in a transporter complex; what is wrong
      is the complex type chosen for it, and the IBD carries that error to every
      bacterial descendant - the Pseudomonas, Haemophilus and Aquifex MlaF proteins and
      the actinobacterial Mkl/MceG ATPases of the Mce1 and Mce4 importers. GO:0043190
      (ATP-binding cassette (ABC) transporter complex) is the term that fits, and it
      holds family-wide. The completed E. coli mlaD and mlaE gene reviews make exactly
      this replacement. No affected_subfamilies are named because the term is
      inapplicable throughout rather than in one clade; the taxon-2 scope is incidental
      here, although it does keep the term off plant TGD3.
    supported_by:
      - reference_id: PMID:27529189
        supporting_text: "MlaE and MlaF constitute the core components of the ABC transporter and are predicted to form the transmembrane domains (TMDs) and nucleotide-binding domains (NBDs), respectively (Malinverni and Silhavy, 2009)."
      - reference_id: PMID:33236984
        supporting_text: At the center of the complex, a core ABC transporter module is formed from two copies each of the MlaF ATPase and the MlaE transmembrane domains (TMDs).
  - node_id: PANTHER:PTN000655704
    asserted_term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    evidence: IBD
    node_taxon:
      id: NCBITaxon:2
      label: Bacteria
    paint_snapshot: "20250919"
    seeds:
      - id: UniProtKB:P63386
        label: Intermembrane phospholipid transport system ATP-binding protein MlaF
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Same node, same boundary. For the diderm-bacterial Mla systems the term is exactly
      right - MlaFEDB moves phospholipids between the inner and outer membranes through
      the periplasm, and the E. coli seed has an IDA from the structural work - and the
      bacterial taxon scope correctly excludes plants. The problem is again the
      actinobacterial clade below the node: mycobacterial MceG serves importers of host
      cholesterol and fatty acids, so both the substrate (not a phospholipid) and the
      route (across the mycobacterial cell envelope from the host, not between the two
      membranes of a diderm envelope in a maintenance cycle) differ. The actinobacterial
      Mkl/MceG branch needs an IRD; GO:0006869 lipid transport, asserted at the family
      root, is what should remain for it.
    supported_by:
      - reference_id: PMID:33236984
        supporting_text: At the center of the complex, a core ABC transporter module is formed from two copies each of the MlaF ATPase and the MlaE transmembrane domains (TMDs).
      - reference_id: PMID:27529189
        supporting_text: "The Mce4 pathway in Mycobacterium tuberculosis is important for cholesterol uptake (Pandey and Sassetti, 2008) while the TGD system in the chloroplasts of Arabidopsis thaliana functions to transport phosphatidic acid (PA) from the plastid OM to the IM (Benning, 2009), providing support for the proposed role of the OmpC-Mla system in lipid transport."
  - node_id: PANTHER:PTN005140750
    asserted_term:
      id: GO:0009507
      label: chloroplast
    evidence: IBD
    node_taxon:
      id: NCBITaxon:33090
      label: Viridiplantae
    paint_snapshot: "20250919"
    seeds:
      - id: AGI_LocusCode:AT1G65410
        label: TGD3
        organism: Arabidopsis thaliana
    assessment: SOUND
    assessment_reason: >-
      A location assertion scoped to the clade that has the organelle, seeded by the
      only member with a direct localization experiment: TGD3 is curated to chloroplast
      by TAIR (IDA) and the primary paper localizes it beyond the inner chloroplast
      envelope membrane, i.e. in the stroma. The single seed is not a weakness - the
      judgement being propagated is that the plant orthologs of this ATPase are plastid
      proteins, which follows from the chloroplast transit peptide and the role in
      plastid lipid import. QuickGO shows the propagation reaching green-plant orthologs
      only (36 taxa within Viridiplantae), as the node taxon requires. If anything the
      term is coarser than the evidence (chloroplast stroma is the curated UniProt
      location), which is the safe direction for a node assertion.
    supported_by:
      - reference_id: PMID:17938172
        supporting_text: "The TGD3 protein shows basal ATPase activity and is localized inside the chloroplast beyond the inner chloroplast envelope membrane."
term_assessments:
  - assessed_term:
      id: GO:0016887
      label: ATP hydrolysis activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The defining molecular function of every member, with independent experimental
      grounding at both extremes of the family (E. coli MlaFEB ATPase assays; Arabidopsis
      TGD3 basal ATPase activity). No subfamily is exempt.
    supported_by:
      - reference_id: PMID:27529189
        supporting_text: In addition, we have demonstrated that MlaFEB possesses high intrinsic ATPase activity that is attenuated by MlaD association (Figure 5A).
  - assessed_term:
      id: GO:0006869
      label: lipid transport
    scope: FAMILY_WIDE
    scope_reason: >-
      The substrate-neutral process term, and the right family-level home for the
      biology: phospholipids in the Mla systems, cholesterol and fatty acids in the
      mycobacterial Mce systems, ER-derived phosphatidic acid in the plant TGD system.
      Where a more specific child is unsafe (GO:0120010, GO:0015914 applied to
      actinobacteria), this is the term that should be kept instead.
  - assessed_term:
      id: GO:0005524
      label: ATP binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Not asserted by PAINT in this family, but true of every member by domain content
      (ABC_tran/P-loop NTPase with intact Walker A and B motifs) and already present on
      members from InterPro mappings. Listed so that a gene review keeping it is not
      mistaken for an unsupported claim.
  - assessed_term:
      id: GO:0120014
      label: phospholipid transfer activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Safe only where the transported lipid is a phospholipid: the Mla ATPases of SF6
      (seeded by the E. coli IDA) and, for the plant TGD system whose substrate is
      phosphatidic acid, SF3. It must not reach the mycobacterial Mkl/MceG members,
      which share SF6 with MlaF - hence the member exception below rather than a
      subfamily exclusion. Scope is about which members the term is safe for, and that
      question is settled here. A separate question, open and orthogonal to scope, is
      the relation, raised in this family's node assessment: carrying a phospholipid
      between membranes is a property of the assembled transporter that an ATPase
      subunit cannot enable on its own, since MlaF contacts no lipid and contributes ATP
      hydrolysis (GO:0016887). The completed E. coli mlaF review therefore marks its
      enables-qualified rows MARK_AS_OVER_ANNOTATED and records contributes_to
      GO:0120014 in core_functions, the same reading applied to MlaB, MlaD and MlaE. The
      family/gene cross-check therefore lists one advisory line for this term, which is
      what that check is for.
    applicable_subfamilies:
      - id: PANTHER:PTHR43023:SF6
        label: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM ATP-BINDING PROTEIN MLAF
      - id: PANTHER:PTHR43023:SF3
        label: PROTEIN TRIGALACTOSYLDIACYLGLYCEROL 3, CHLOROPLASTIC
    member_exceptions:
      - member:
          id: UniProtKB:P9WQL5
          label: Probable ribonucleotide transport ATP-binding protein mkl
          gene_symbol: mkl
          organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
        exception_reason: >-
          Mkl/MceG is the shared ATPase of the mycobacterial Mce1 and Mce4 transporters,
          which import host fatty acids and cholesterol respectively; neither substrate
          is a phospholipid, and the protein has no phospholipid-transport evidence of
          its own. It is annotated to cholesterol import by IDA (MTBBASE). The generic
          GO:0006869 is the correct term for it.
        pruned_node_id: PANTHER:PTN000655692
        supported_by:
          - reference_id: PMID:36642182
            supporting_text: "Fatty acids and cholesterol are imported across the Mtb cell wall via the dedicated Mce1 and Mce4 transporters, respectively."
  - assessed_term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The diderm-envelope process term: phospholipid movement between the inner and
      outer membranes through the periplasm. It belongs to the Mla ATPases of SF6 and
      not to SF3, whose plant members act across the chloroplast envelope (and whose
      bacterial paralogs are not mla-operon encoded); PAINT already enforces the plant
      exclusion with the taxon-2 scope on PTN000655704. Within SF6 the mycobacterial
      Mce ATPases are excepted.
    applicable_subfamilies:
      - id: PANTHER:PTHR43023:SF6
        label: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM ATP-BINDING PROTEIN MLAF
    member_exceptions:
      - member:
          id: UniProtKB:P9WQL5
          label: Probable ribonucleotide transport ATP-binding protein mkl
          gene_symbol: mkl
          organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
        exception_reason: >-
          The mycobacterial Mce systems import host-derived apolar lipids across the cell
          envelope rather than cycling phospholipids between the two membranes of a
          diderm envelope, so the specific route encoded by this term does not describe
          MceG's complexes.
        pruned_node_id: PANTHER:PTN000655704
        supported_by:
          - reference_id: PMID:36642182
            supporting_text: "However, unlike canonical bacterial ABC transporters, Mce1 and Mce4 appear to share a single ATPase, MceG."
  - assessed_term:
      id: GO:1990531
      label: phospholipid-translocating ATPase complex
    scope: NOT_APPLICABLE
    scope_reason: >-
      Not safe for any member, on the term definition rather than on substrate: a
      phospholipid-translocating ATPase complex is a P-type (P4-ATPase) flippase
      complex, and every member of this family is the nucleotide-binding subunit of an
      ABC transporter. MlaFEDB, the mycobacterial Mce1/Mce4 importers and the plant
      TGD1/TGD2/TGD3 translocator are all ABC systems, so the right term for all of them
      is GO:0043190. The E. coli mlaD and mlaE gene reviews reach the same conclusion and
      replace their GO:1990531 rows with GO:0043190; a gene review that keeps GO:1990531
      for any member of this family is in conflict with this assessment.
    supported_by:
      - reference_id: PMID:33236984
        supporting_text: At the center of the complex, a core ABC transporter module is formed from two copies each of the MlaF ATPase and the MlaE transmembrane domains (TMDs).
  - assessed_term:
      id: GO:0009507
      label: chloroplast
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Only the plant/algal TGD3 clade has the organelle. PAINT asserts it on a
      Viridiplantae-scoped node, so the scope is already enforced in the propagated
      data; recorded here so that the bacterial paralogs that also sit in SF3 are not
      taken to inherit it.
    applicable_subfamilies:
      - id: PANTHER:PTHR43023:SF3
        label: PROTEIN TRIGALACTOSYLDIACYLGLYCEROL 3, CHLOROPLASTIC
  - assessed_term:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    scope: FAMILY_WIDE
    scope_reason: >-
      The substrate-neutral complex term, safe for every member: each is the
      nucleotide-binding subunit of an ABC transporter assembled with an MlaE/YrbE/TGD1
      permease and an MCE substrate-binding protein. This is the replacement term for
      the inapplicable GO:1990531 throughout the family, as the completed E. coli mlaD
      and mlaE gene reviews also conclude.

references:
