notes: >-
  Written to support the Mla module's MlaF part
  (modules/bacterial_mla_intermembrane_phospholipid_transport.yaml), which selects
  PANTHER:PTHR43023:SF6 with the PSEPK exemplar Q88P94. All node ids, asserted terms,
  seeds, taxa and snapshot dates are verbatim from the cached PTHR43023-paint.tsv (one
  assessment per row, six rows); subfamily labels are verbatim from
  interpro/panther/panther.obo; member accessions are from PTHR43023-entries.csv or
  from UniProt cross-reference queries, and each representative member's subfamily
  assignment was read from its own UniProt DR PANTHER lines. Propagation outcomes
  quoted in the assessments were checked in QuickGO on 2026-10-23 (PTN000655692: 240
  annotations; PTN000655704: 36; PTN005140750: 49).

  Two things a later curator should know. First, PANTHER's family name is the plant
  member's name, which makes this family look eukaryotic when it is overwhelmingly
  bacterial; family_name is left exactly as PANTHER has it and the readable description
  is in preferred_name. Second, the functional boundary in this family does not line up
  with the subfamily boundaries: SF6 contains both the phospholipid-handling MlaF and
  the cholesterol/fatty-acid Mkl/MceG, so three term assessments carry member
  exceptions for P9WQL5 instead of excluding a subfamily, and the corresponding node
  assessments are NEEDS_PRUNING with no affected_subfamilies named.

  Mycobacterial MceG, listed in UniProt as "Probable ribonucleotide transport
  ATP-binding protein mkl", is not a ribonucleotide transporter: the name predates the
  Mce work and the UniProt FUNCTION line still reads "Not known, could be involved in
  the transport of ribonucleotides". The protein is the shared ATPase of Mce1 and Mce4
  and carries an IDA to cholesterol import from MTBBASE. That is an upstream naming
  issue in UniProt rather than a PAINT problem, so it is recorded here rather than as a
  source defect on an annotation.

  No residue_sites: nothing in this family's term propagation turns on individual
  positions. Walker A/B motifs are intact across the members examined, and the
  boundaries that matter are substrate and compartment, which are clade properties.
