- node_id: PANTHER:PTN000655704
  asserted_term:
    id: GO:1990531
    label: phospholipid-translocating ATPase complex
  evidence: IBD
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  paint_snapshot: '20250919'
  seeds:
  - id: UniProtKB:P63386
    label: Intermembrane phospholipid transport system ATP-binding protein MlaF
    organism: Escherichia coli (strain K12)
  assessment: WRONG_NODE
  assessment_reason: The problem is the term choice, not the node position. GO:1990531 is defined as a
    protein complex that functions as a phospholipid-translocating P-Type ATPase, i.e. a P4-ATPase flippase
    complex. Every member of this family is instead the nucleotide-binding subunit of an ABC transporter,
    so no descendant of this node is part of a P-type ATPase complex and the seed cannot support the term
    at any node. The seed annotation itself (E. coli MlaF, IPI to the MlaFEDB complex, PMID:27529189)
    correctly records membership in a transporter complex; what is wrong is the complex type chosen for
    it, and the IBD carries that error to every bacterial descendant - the Pseudomonas, Haemophilus and
    Aquifex MlaF proteins and the actinobacterial Mkl/MceG ATPases of the Mce1 and Mce4 importers. GO:0043190
    (ATP-binding cassette (ABC) transporter complex) is the term that fits, and it holds family-wide.
    The completed E. coli mlaD and mlaE gene reviews make exactly this replacement. No affected_subfamilies
    are named because the term is inapplicable throughout rather than in one clade; the taxon-2 scope
    is incidental here, although it does keep the term off plant TGD3.
  supported_by:
  - reference_id: PMID:27529189
    supporting_text: MlaE and MlaF constitute the core components of the ABC transporter and are predicted
      to form the transmembrane domains (TMDs) and nucleotide-binding domains (NBDs), respectively (Malinverni
