    phospholipid function. SF6 mixes MlaF/MceG, SF3 mixes TGD3/bacterial proteins and SF4 has additional
    ABC members. No supported universal gain or substrate-loss boundary follows from those labels. GO0120010
    is not restricted to bacterial diderms.
