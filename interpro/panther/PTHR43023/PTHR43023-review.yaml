- subfamily_id: PANTHER:PTHR43023:SF3
  label: PROTEIN TRIGALACTOSYLDIACYLGLYCEROL 3, CHLOROPLASTIC
  description: 'The subfamily PANTHER names the family after: plant and algal TGD3, the ATPase of the
    chloroplast inner-envelope TGD1/TGD2/TGD3 lipid importer, together with a set of bacterial paralogs
    that are not part of the canonical mlaFEDCB operon (Pseudomonas PP_0141 and PA3212, Helicobacter HP_1465,
    Synechocystis sll1041 and sll1001, Aquifex aq_1531). TGD3 has demonstrated basal ATPase activity and
    is localized beyond the inner chloroplast envelope membrane, i.e. in the stroma.'
