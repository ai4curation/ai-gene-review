- assessed_term:
    id: GO:1990531
    label: phospholipid-translocating ATPase complex
  scope: NOT_APPLICABLE
  scope_reason: 'Not safe for any member, on the term definition rather than on substrate: a phospholipid-translocating
    ATPase complex is a P-type (P4-ATPase) flippase complex, and every member of this family is the nucleotide-binding
    subunit of an ABC transporter. MlaFEDB, the mycobacterial Mce1/Mce4 importers and the plant TGD1/TGD2/TGD3
    translocator are all ABC systems, so the right term for all of them is GO:0043190. The E. coli mlaD
    and mlaE gene reviews reach the same conclusion and replace their GO:1990531 rows with GO:0043190;
    a gene review that keeps GO:1990531 for any member of this family is in conflict with this assessment.'
  supported_by:
  - reference_id: PMID:33236984
    supporting_text: At the center of the complex, a core ABC transporter module is formed from two copies
      each of the MlaF ATPase and the MlaE transmembrane domains (TMDs).
- assessed_term:
    id: GO:0009507
    label: chloroplast
  scope: UNRESOLVED
  scope_reason: The original Viridiplantae PAINT node PTN005140750 remains SOUND, with positive TGD3 localization.
    SF3 also contains bacterial proteins, so a whole-SF3 chloroplast grant would be wrong. A taxon-qualified
    clade cannot be represented as an entire subfamily here; universal scope is unresolved, not a withdrawal
    of plant localization evidence.
- assessed_term:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  scope: FAMILY_WIDE
  scope_reason: The conserved ABC nucleotide-binding architecture supports participation in an ABC transporter
    complex. Characterized members work with MlaE, YrbE or TGD1 partners, but those specific permeases
    and MCE-associated architecture are not asserted for every additional or source-disputed ABC member.
    Exact partners and cargo require member-specific evidence; the substrate-neutral ABC-complex term
    does not license a complete Mla system.
