family_id: PANTHER:PTHR43023
family_name: PROTEIN TRIGALACTOSYLDIACYLGLYCEROL 3, CHLOROPLASTIC
preferred_name: 'ATP-binding (nucleotide-binding domain) subunits of MCE-type lipid transport systems:
  MlaF of the diderm-bacterial Mla pathway, mycobacterial Mkl/MceG, and plant TGD3'
summary: Stand-alone ABC nucleotide-binding proteins include MlaF, the shared mycobacterial MceG ATPase,
  plant TGD3 and additional ABC proteins. MlaF supplies ATP-dependent energy to MlaE-containing phospholipid
  transport assemblies; E. coli MlaB stabilizes the ATPase and supports complex assembly, whereas Bordetella
  has a characterized F/E/D/A/C locus without an identifiable MlaB. MceG supports fatty-acid and cholesterol
  uptake systems and TGD3 acts in chloroplast lipid transport. These positive cargo examples do not establish
  absence of secondary activities. The official SF4 reference branch and current UniProt assignments disagree
  for some proteins, so neither lipid specificity nor a universal six-component architecture follows from
  the family label.
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'The ABC fold and ATP motifs are conserved in the official MSA: all 90 extant reference
  sequences have a Walker-A candidate, and all four SF4 leaves also have LSGGQ. Cargo and partners differ,
  and SF4 is not an empty branch. Reference-tree classifications of Q9F3K7 and Q2FVL4 as PTHR43023:SF4
  disagree with current UniProt PTHR43166 classifications; both sources are retained without an override.'
