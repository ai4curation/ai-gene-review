  diverged_from_family: true
  divergence_description: Plant TGD3 and bacterial paralogs share SF3. TGD3 has organellar localization
    and basal ATPase activity; its chloroplast lipid route differs from bacterial Mla. GO0120010 itself
    permits transfer between organellar membranes, so TGD3 cannot be excluded merely because it is not
    in a bacterial diderm. Bacterial SF3 paralogs do not inherit a chloroplast location from their subfamily
    name.
  supported_by:
  - reference_id: PMID:17938172
    supporting_text: The TGD3 protein shows basal ATPase activity and is localized inside the chloroplast
      beyond the inner chloroplast envelope membrane.
  - reference_id: PMID:22544736
    supporting_text: TGD1, -2, and -3 (systematically named AtABCI4, -5, and -3) form a putative ABC transporter
      found in the chloroplast inner envelope membrane of plants and algae, in which TGD1 is similar to
      an ABC transporter permease, TGD3 to an NBD, and TGD2 to an SBD ( 8 , 9 ).
- subfamily_id: PANTHER:PTHR43023:SF4
  label: AMINO ACID ABC TRANSPORTER ATP-BINDING PROTEIN
  description: 'The official PANTHER19 tree has four SF4 leaves: Streptomyces atrC Q9F3K7, Bradyrhizobium
    Q89T24, Staphylococcus Q2FVL4 and Yersinia yecC A0A3N4B1K8. The MSA preserves ABC Walker-A and signature
    motifs. Current UniProt assigns Q9F3K7 and Q2FVL4 to PTHR43166, a source disagreement rather than
    evidence that the PANTHER tree is absent. Exact lipid substrate and Mla participation are not established
    for this branch.'
