    property of this family or every member of SF2. Conversely, SF2 cannot be excluded wholesale because
    Haloferax D4GYE6 has direct 1-PFK evidence. A complete safe subfamily/member partition has not been
    established. TagK secondary activity does not establish the native fructose-catabolic role.
