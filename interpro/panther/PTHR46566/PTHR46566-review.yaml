notes: >-
  Written for the bacterial fructose PTS uptake and catabolism modules. Subfamily
  membership was read from the PANTHER entries inventory (68 reviewed members: SF5 58
  [8 FruK, 50 LacC], SF1 6 [4 FruK, 2 TagK], SF2 4 PfkB) and from the DR PANTHER line
  of the unreviewed P. putida KT2440 FruK (Q88PQ4, SF5). No PANTHER tree was available
  locally, so node scopes below the seeds are left UNRESOLVED where the descendants'
  activity is not established. The fructose PTS modules ground their FruK step on
  SF5 with GO:0008662; because that subfamily also holds tagatose-6-phosphate kinases,
  the 1-phosphofructokinase scope is recorded as UNRESOLVED rather than granted to the
  whole subfamily, and the module relies on its reviewed FruK representatives.
