family_id: PANTHER:PTHR46566
family_name: 1-PHOSPHOFRUCTOKINASE-RELATED
preferred_name: PfkB-type sugar-phosphate kinases (1-phosphofructokinase, phosphofructokinase-2 and tagatose-phosphate kinases)
summary: >-
  Bacterial ATP-dependent kinases of the PfkB (ribokinase-like) carbohydrate kinase
  fold that phosphorylate hexose monophosphates to hexose bisphosphates. Three
  biochemically distinct groups are classified here: 1-phosphofructokinases (FruK),
  which convert fructose 1-phosphate produced by the fructose phosphotransferase
  system into fructose 1,6-bisphosphate; the minor 6-phosphofructokinase isozyme 2
  (PfkB) of E. coli and Mycobacterium tuberculosis; and tagatose-6-phosphate kinases
  (LacC) of the Gram-positive lactose/galactose tagatose pathway and
  tagatose-1-phosphate kinases (TagK). The substrate specificity does not follow the
  PANTHER subfamily boundaries: SF5 holds proteobacterial FruK together with
  Gram-positive LacC, and SF1 holds Firmicute/Mollicute FruK together with TagK.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members share the PfkB kinase fold and ATP-dependent phosphorylation of a
  ketohexose monophosphate, but the sugar phosphate accepted (fructose 1-phosphate,
  fructose 6-phosphate, tagatose 6-phosphate or tagatose 1-phosphate) differs between
  members within the same subfamily. Reaction-specific GO terms such as
  1-phosphofructokinase activity cannot be read from the family or subfamily id.
