family_id: PANTHER:PTHR46566
family_name: 1-PHOSPHOFRUCTOKINASE-RELATED
functional_coherence: HETEROGENEOUS
preferred_name: PfkB carbohydrate kinases with differing phosphorylated-sugar substrates
summary: PfkB-related carbohydrate kinases phosphorylate distinct sugar-phosphate substrates. E. coli
  FruK converts fructose 1-phosphate to fructose 1,6-bisphosphate, whereas E. coli PfkB uses fructose
  6-phosphate. Bacillus licheniformis TagK preferentially uses tagatose 1-phosphate but also accepts fructose
  1-phosphate with lower catalytic efficiency. Functional interpretation therefore requires the substrate
  and phosphate position, not merely a kinase-family or pfkB label.
coherence_reason: 'The family contains 1-phosphofructokinase, 6-phosphofructokinase and tagatose-1-phosphate
  kinase activities. The named subfamilies are not universal substrate classes: SF2 contains the experimentally
  characterized Haloferax 1-phosphofructokinase as well as E. coli 6-phosphofructokinase; SF1 includes
  TagK.'
