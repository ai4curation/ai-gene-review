notes: Broad GO:0008443 phosphofructokinase activity is not synonymous with 6-phosphofructokinase; no
  IBA is rejected merely for using the broad term. The ribokinase PAINT node and its precise descendant
  membership require a phylogenetic assessment; the family name and the presence of a kinase fold do not
  adjudicate it. The 2024 FruK purified construct matches Salmonella sequence rather than canonical E.
  coli K-12; see the E. coli member review for assay provenance. This is a completed review of applicability
  to the fused-fructose module; the explicit unresolved family-wide partitions and PAINT-node placement
  are not asserted as settled.
