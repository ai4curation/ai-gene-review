term_assessments:
- assessed_term:
    id: GO:0008662
    label: 1-phosphofructokinase activity
  scope: UNRESOLVED
  scope_reason: >-
    1-phosphofructokinase activity is experimentally established for E. coli FruK
    (SF5) and supported for P. putida FruK (SF5), but neither SF5 nor SF1 is uniform:
    SF5 also contains the LacC tagatose-6-phosphate kinases and SF1 the TagK
    tagatose-1-phosphate kinases, and SF2 members are 6-phosphofructokinases. No
    curated residue separating fructose 1-phosphate from tagatose phosphate acceptors
    is available, so the activity must be judged per member (for example by the
    NCBIfam 1-phosphofructokinase model) rather than from a PANTHER id. Missing
    evidence: a specificity-determining site or a subfamily split separating FruK from
    LacC.
  supported_by:
  - reference_id: file:ECOLI/fruK/fruK-uniprot.txt
    supporting_text: Catalyzes the ATP-dependent phosphorylation of fructose-l-
      phosphate to fructose-l,6-bisphosphate (PubMed:10833389, Ref.6).
  - reference_id: file:interpro/panther/PTHR46566/PTHR46566-entries.csv
    supporting_text: A5IUY2,Tagatose-6-phosphate kinase,protein
  - reference_id: file:interpro/panther/PTHR46566/PTHR46566-entries.csv
    supporting_text: Q8VS15,D-tagatose-1-phosphate kinase,protein
- assessed_term:
    id: GO:0016301
    label: kinase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member is an ATP-dependent sugar-phosphate kinase of the PfkB fold, whichever
