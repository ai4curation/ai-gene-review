  assessment: UNRESOLVED
  assessment_reason: >-
    The family root covers all 32 reference-tree leaves, including protist,
    fungal, actinobacterial and Firmicute glycerate kinases. Both seeds are E.
    coli enzymes shown to form 2-phosphoglycerate, so the term is sound for the
    enterobacterial GarK/GlxK clades. No product-specificity data exist in this
    corpus for any deep-branching member, and the UniProt name of E. coli GlxK
    still says "glycerate 3-kinase". Whether the 2-kinase regiochemistry is
    ancestral or arose within Proteobacteria cannot be decided without
    2-phospho versus 3-phospho product assays on eukaryotic and Gram-positive
    members (for example B. subtilis GlxK, Dictyostelium DDB_G0277163).
