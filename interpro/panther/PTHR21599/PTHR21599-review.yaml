family_id: PANTHER:PTHR21599
family_name: GLYCERATE KINASE
preferred_name: Glycerate kinase type-1 (GlxK/GarK) family
summary: >-
  ATP-dependent D-glycerate kinases of the type-1 (GlxK) family, found in
  bacteria and in several protists and fungi. The two E. coli members, GarK
  (SF7) and GlxK (SF0), phosphorylate D-glycerate at C2 to
  2-phosphoglycerate rather than at C3. This was settled by an in vivo
  selection in a phosphoglycerate-mutase-null strain, which shows that E. coli
  lacks a glycerate 3-kinase. GarK is the glycerate kinase of the
  enterobacterial glucarate/galactarate route (garPLRK operon). GlxK serves the
  glyoxylate/glycolate route. SF7 is a small enterobacterial GarK clade nested
  within the broader SF0 group.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members are D-glycerate kinases. Product specificity
  (2-phospho versus 3-phospho) has been established only for the E. coli
  enzymes; the eukaryotic and deep-branching bacterial members are
  uncharacterized in this corpus, and several SF0 members (Mycobacterium
  Rv2205c, Synechocystis slr1840) are unnamed proteins.
