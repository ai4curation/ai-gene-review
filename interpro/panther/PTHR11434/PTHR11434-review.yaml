family_id: PANTHER:PTHR11434
family_name: NADH-UBIQUINONE OXIDOREDUCTASE SUBUNIT ND4L
preferred_name: Complex I / NDH-1 subunit K family (NuoK / mitochondrial ND4L / plastid NdhE)
summary: >-
  Small three-transmembrane-helix membrane subunit of proton-pumping NADH:quinone
  oxidoreductases: bacterial NuoK, mitochondrially encoded ND4L and the plastid NdhE of
  the chloroplast NDH complex. In E. coli NDH-1, NuoK forms part of the E-channel proton
  pathway next to the quinone site with NuoA, NuoJ and NuoH, and its conserved
  membrane-embedded glutamates are needed to couple electron transfer to proton
  translocation. Bacterial and mitochondrial members act in respiratory complex I, which
  reduces ubiquinone (or menaquinone). Plastid NdhE acts in the thylakoid NDH complex,
  which reduces plastoquinone with ferredoxin as donor. The compartment-neutral term
  NADH dehydrogenase complex holds family-wide; respiratory chain complex I does not hold
  for the plastid clade.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are the same structural subunit of homologous proton-pumping quinone
  oxidoreductases. The exception is plastid NdhE (in subfamily SF16 together with
  proteobacterial NuoK), which belongs to the ferredoxin:plastoquinone NDH complex rather
  than to respiratory complex I. In SF16 the boundary is therefore a clade inside a
  subfamily, not a subfamily boundary. SF0 is mitochondrial ND4L; SF21 is a second
  bacterial NuoK group.
