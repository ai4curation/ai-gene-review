notes: >-
  Written to back the E. coli and P. putida KT2440 nuoK reviews for the bacterial
  respiratory complex I module. Node/term pairs, seeds and snapshot dates are verbatim from
  PTHR11434-paint.tsv (two IBD rows; no IRD/IKR rows). Subfamily composition is from
  PTHR11434-entries.csv. Scoping of PTN000153444 away from the bacterial and plastid
  clades was checked against the GOA files of E. coli nuoK, P. putida nuoK and poplar
  ndhE, none of which carries the GO:0045271 IBA. No residue_sites: the E-channel
  glutamates (E. coli Glu-36, Glu-72) are conserved coupling residues, but no GO term in
  this family is residue-determined.
