  - id: UniProtKB:P0AFE4
    label: NADH-quinone oxidoreductase subunit K
    organism: Escherichia coli (strain K12)
  assessment: SOUND
  assessment_reason: >-
    The compartment-neutral complex term is true for every descendant: bacterial NDH-1,
    mitochondrial complex I and the plastid NDH complex are all NADH dehydrogenase
    complexes. The bacterial gene reviews (E. coli and P. putida nuoK) and the poplar ndhE
    review refine the inherited term to the more specific complex (GO:0045271 or
    GO:0010598). That is a granularity improvement and agrees with this placement.
- node_id: PANTHER:PTN000153444
  asserted_term:
    id: GO:0045271
    label: respiratory chain complex I
  evidence: IBD
  paint_snapshot: '20241120'
  seeds:
  - id: FB:FBgn0013683
  - id: MGI:MGI:102497
  - id: UniProtKB:P03901
  - id: UniProtKB:P03902
  assessment: SOUND
  assessment_reason: >-
    Complex I membership is placed on a narrower node seeded only by mitochondrial ND4L
    proteins. Neither E. coli nor P. putida nuoK, nor poplar ndhE, receives a GO:0045271
    IBA, so the plastid clade does not inherit it and the bacterial clade is not covered.
    Correctly scoped. The bacterial NuoK members carry GO:0045271 from experimental
    evidence (E. coli, PMID:17722886) and orthology instead.
term_assessments:
- assessed_term:
    id: GO:0015990
    label: electron transport coupled proton transport
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member is a membrane-arm subunit (NuoK/ND4L/NdhE) of a proton-pumping complex of the complex I
    superfamily: bacterial NDH-1, mitochondrial complex I, plastid NDH or archaeal F420H2
    dehydrogenase. In all of these the redox reaction is coupled to proton translocation, whatever the
    electron donor, so the coupled process holds family-wide; the entries file contains no member from a
    complex that is not a proton pump.
- assessed_term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  scope: UNRESOLVED
  scope_reason: >-
    The term holds, as contributes_to, for subunits of NADH-oxidising, ubiquinone-reducing complex I
    (e.g. E. coli and P. putida Nuo, mitochondrial complex I). It does not hold for members of plastid NDH
    (ferredoxin donor, plastoquinone acceptor), archaeal F420H2 dehydrogenase, or menaquinone-reducing
    actinobacterial complexes, and PANTHER subfamily boundaries in this family do not separate these
    lineages, so no subfamily scope is honest. Resolving it needs clade-level placement of the complex I
    versus NDH/Fpo lineages in the PANTHER tree (PTN nodes), which the cached files do not provide.
