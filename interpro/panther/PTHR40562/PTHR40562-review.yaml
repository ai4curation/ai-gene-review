- node_id: PANTHER:PTN008082957
  asserted_term:
    id: GO:0009344
    label: nitrite reductase complex [NAD(P)H]
  evidence: IBD
  negated: false
  paint_snapshot: '20260617'
  seeds:
  - id: UniProtKB:P0A9I8
  assessment: SOUND
  assessment_reason: >-
    E. coli NirD is a structural subunit of NirBD: it co-purifies with NirB and
    activity needs both proteins. The small-subunit role is the defining property
    of the family, so placing complex membership at the family root is sound. The
    Pseudomonas and Mycolicibacterium members sit next to nirB in the same operon
    and are classified in the same subfamily.
  supported_by:
  - reference_id: file:interpro/panther/PTHR40562/PTHR40562-paint.tsv
    supporting_text: "PTHR40562\tPTN008082957\tGO:0009344\tC\tIBD\tfalse\tUniProtKB:P0A9I8"
  - reference_id: PMID:1435259
    supporting_text: NirD remained associated with NirB during the initial stages of purification of
      the active enzyme, suggesting that NirD is a second structural subunit of the enzyme.
- node_id: PANTHER:PTN008082957
  asserted_term:
