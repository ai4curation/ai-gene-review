    label: nitrite reductase (NADH) activity
  evidence: IBD
  negated: false
  paint_snapshot: '20260617'
  seeds:
  - id: UniProtKB:P0A9I8
  assessment: SOUND
  assessment_reason: >-
    Sound as a contribution to the NirBD activity, which is how the seed's own
    experimental rows are qualified (contributes_to in the E. coli NirD review).
    NirD carries no sirohaem or flavin centre; activity requires both subunits.
    Propagated IBA rows on the small subunit should therefore carry the
    contributes_to qualifier rather than independent enabling.
  supported_by:
  - reference_id: file:interpro/panther/PTHR40562/PTHR40562-paint.tsv
    supporting_text: "PTHR40562\tPTN008082957\tGO:0106316\tF\tIBD\tfalse\tUniProtKB:P0A9I8"
  - reference_id: PMID:1435259
    supporting_text: No NADH-dependent nitrite reductase activity was detected in extracts from bacteria
      lacking either NirB or NirD, but a mixture of the two was as active as an extract from wild-type
      bacteria.
