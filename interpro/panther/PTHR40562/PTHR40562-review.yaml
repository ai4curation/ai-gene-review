family_id: PANTHER:PTHR40562
family_name: FAMILY NOT NAMED
preferred_name: Nitrite reductase (NADH) small subunit NirD family
summary: >-
  NirD is the small subunit of the cytoplasmic NADH-dependent sirohaem nitrite
  reductase NirBD of enterobacteria and many other bacteria. It carries no
  catalytic centre of its own but is required for activity: extracts lacking
  either NirB or NirD have no NADH-dependent nitrite reductase activity, and NirD
  co-purifies with NirB as a second structural subunit. Members outside the
  Enterobacteriaceae include the Pseudomonas putida KT2440 NirD (Q88M68) and the
  Mycolicibacterium smegmatis small subunit MSMEG_0428 (A0QPK3), both encoded
  immediately downstream of their nirB genes. E. coli NirD has an additional,
  independently characterized role as an inhibitor of the stringent-response
  synthetase RelA, which is not a family-level property.
functional_coherence: COHERENT
coherence_reason: >-
  All four Swiss-Prot members are enterobacterial NirD orthologs in one subfamily
  (PTHR40562:SF1), and the module members from Pseudomonas and Mycolicibacterium are
  classified in the same subfamily. Every characterized member acts as the
  required small partner of a NirB-type large subunit.
