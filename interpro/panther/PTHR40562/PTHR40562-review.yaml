  assessment: UNRESOLVED
  assessment_reason: >-
    PAINT records a loss below PTN004443754 (Aspergillus nidulans FGSC A4). Fungal
    assimilatory nitrite reductase is a single NiiA polypeptide (P22944, in
    PTHR43809) rather than a two-subunit NirBD, which makes loss of a separate
    small-subunit complex role plausible, but the Aspergillus leaf itself was not
    inspected here and no experiment on it was found. Needed: the identity and
    expression of the Aspergillus PTHR40562 member and whether it associates with
    NiiA.
  supported_by:
