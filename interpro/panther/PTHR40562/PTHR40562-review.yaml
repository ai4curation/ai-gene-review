term_assessments:
- assessed_term:
    id: GO:0009344
    label: nitrite reductase complex [NAD(P)H]
  scope: FAMILY_WIDE
  scope_reason: >-
    The small-subunit role is the family's defining property; the bacterial
    members characterized or modelled here are NirB partners. The fungal IRD clade
    is not represented among reviewed members.
  supported_by:
  - reference_id: PMID:1435259
    supporting_text: NirD remained associated with NirB during the initial stages of purification of
      the active enzyme, suggesting that NirD is a second structural subunit of the enzyme.
- assessed_term:
    id: GO:0106316
    label: nitrite reductase (NADH) activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Applies as a contribution to the NirBD activity (contributes_to), not as an
    activity of the isolated small subunit. Members whose physiological donor is
    unmeasured (Q88M68, A0QPK3) are reviewed at the donor-generic
    nitrite reductase [NAD(P)H] level.
  supported_by:
  - reference_id: PMID:1435259
    supporting_text: No NADH-dependent nitrite reductase activity was detected in extracts from bacteria
      lacking either NirB or NirD, but a mixture of the two was as active as an extract from wild-type
      bacteria.
- assessed_term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  scope: UNRESOLVED
  scope_reason: >-
    The NirD fold resembles Rieske-type ferredoxins, but no iron-sulfur cluster
    has been demonstrated in any member, and the conserved cysteine complement
    differs between members; the member reviews treat this IEA term as
    over-annotated or removed depending on their cysteine counts.
  supported_by:
  - reference_id: file:genes/ECOLI/nirD/nirD-uniprot.txt
    supporting_text: 'SIMILARITY: To B.subtilis NasE.'
