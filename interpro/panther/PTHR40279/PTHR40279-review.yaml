    id: GO:0033732
    label: pyrroloquinoline-quinone synthase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    True of the proteobacterial PqqC clade (PTN002220347) only. PANTHER has a
    single subfamily, so the term cannot be scoped by subfamily id; the CT_610
    4-aminobenzoate synthase and the uncharacterized archaeal, plant and other
    bacterial members must not inherit it. The PqqC clade is recognized
    specifically by InterPro IPR011845 and NCBIfam TIGR02111, which is why the
    PQQ biosynthesis module grounds this step on IPR011845 rather than on this
    PANTHER family.
