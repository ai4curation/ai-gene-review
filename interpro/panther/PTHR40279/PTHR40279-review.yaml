- subfamily_id: PANTHER:PTHR40279:SF3
  label: 4-AMINOBENZOATE SYNTHASE
  description: >-
    The only subfamily; it spans the whole family, so its name, taken from
    Chlamydia CT_610, does not describe the PqqC members. All reviewed PqqC
    entries, including the KT2440, AM1 and Klebsiella pneumoniae proteins, fall
    here. Pathway-specific divergence (PQQ synthase versus 4-aminobenzoate
    synthase) is recorded at the tree level, at the proteobacterial clade
    PTN002220347, which PANTHER does not name as a subfamily.
