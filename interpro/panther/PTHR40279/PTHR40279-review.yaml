notes: >-
  Reviewed for the PQQ biosynthesis module. PAINT has no node-level annotations for
  this family (fetch-panther-paint retained no slice), so there are no node
  assessments; tree_check.py needs a PAINT slice, so the reference tree was dumped
  with tree_dump.py instead. A PAINT curator placing GO:0033732 should place it at
  PTN002220347, not at the root.
