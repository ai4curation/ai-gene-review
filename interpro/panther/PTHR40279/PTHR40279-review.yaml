family_id: PANTHER:PTHR40279
family_name: PQQC-LIKE PROTEIN
preferred_name: PqqC/TENA-like iron-containing redox enzyme family
summary: >-
  PTHR40279 groups proteins with the TENA/THI-4, haem-oxygenase-like multi-helical
  fold. Its best-characterized members are the pyrroloquinoline-quinone synthases
  (PqqC, EC 1.3.3.11) of PQQ-producing Proteobacteria, cofactor-independent
  oxidases that perform the terminal ring cyclization and eight-electron oxidation
  of the late quinoline intermediate to PQQ. The family also contains
  4-aminobenzoate synthase (CT_610) of Chlamydia trachomatis, whose name PANTHER
  gives to the whole family's single subfamily SF3, and uncharacterized
  iron-containing redox proteins from other bacteria, archaea and plants. In the
  PANTHER 19 reference tree the PqqC sequences form one proteobacterial clade
  (PTN002220347) inside a Eubacteria node that also holds CT_610 and the other
  bacterial paralogs. PQQ-synthase activity is therefore a property of the PqqC
  clade, not of the family. M. extorquens AM1 PqqCD, a natural PqqC-PqqD fusion,
  is classified here through its N-terminal PqqC region.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The PqqC clade is a coherent group of pyrroloquinoline-quinone synthases, but the
  family also contains 4-aminobenzoate synthase and uncharacterized redox proteins
  with different chemistry, and the single PANTHER subfamily does not separate them.
