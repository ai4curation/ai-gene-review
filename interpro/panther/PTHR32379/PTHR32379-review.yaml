family_id: PANTHER:PTHR32379
family_name: GUANIDINOACETATE N-METHYLTRANSFERASE
preferred_name: Rmt2/GAMT methyltransferase family
summary: >-
  PTHR32379 is a compact eukaryotic class I-like SAM-dependent
  methyltransferase family whose fungal members are Rmt2 protein arginine
  N5-methyltransferases and whose vertebrate members are guanidinoacetate
  N-methyltransferases. PAINT correctly keeps the exact fungal Rmt2 activity on
  the fungal PTN001285370 node and the guanidinoacetate methyltransferase and
  creatine-biosynthesis rows on the separate vertebrate GAMT node, while
  asserting only broad active compartments and generic SAM-dependent
  methyltransferase activity at the eukaryotic root.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family shares a SAM-dependent methyltransferase fold, but substrate and
  product diverge: fungal Rmt2 enzymes methylate the N5/delta nitrogen of
  arginine residues in proteins, with budding-yeast Rpl12 as the characterized
  substrate, whereas vertebrate GAMT enzymes methylate guanidinoacetate during
  creatine biosynthesis.
