family_id: PANTHER:PTHR42894
family_name: N-(5'-PHOSPHORIBOSYL)ANTHRANILATE ISOMERASE
preferred_name: Phosphoribosylanthranilate isomerase (TrpF/TRP1) family
summary: >-
  PRA isomerases carry out the Amadori rearrangement of phosphoribosylanthranilate, the third step
  of tryptophan synthesis (bacterial TrpF, S. cerevisiae TRP1). In some lineages the domain is fused
  to TrpC.
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF1).
