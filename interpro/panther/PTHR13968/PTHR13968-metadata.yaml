  name:
    name: RRM HNRPC family, RALY subfamily
    short: RRM_HNRPC/RALY_subfam
  description:
  - text: The RRM HNRPC family, RALY subfamily, comprises RNA-binding proteins involved
      in various aspects of RNA metabolism. Members of this family bind to pre-mRNA
      and are implicated in the assembly of hnRNP particles, playing a role in mRNA
      stability, translation, and splicing. They interact with poly-U tracts in mRNA
      UTRs and respond to m6A modifications, which can influence mRNA splicing. Some
      family members are involved in transcriptional regulation of cholesterol biosynthesis
      by binding non-coding RNAs like LeXis. Others may contribute to nucleosome assembly
      and maintenance of mRNA levels. The family is characterized by the RNA recognition
      motif (RRM) and is associated with heterogeneous nuclear ribonucleoproteins
      (hnRNPs), which are key components in the post-transcriptional regulation of
      gene expression.
