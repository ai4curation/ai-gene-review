family_id: PANTHER:PTHR11733
family_name: ZINC METALLOPROTEASE FAMILY M13 NEPRILYSIN-RELATED
summary: M13 metallopeptidase relatives include neprilysins, endothelin-converting enzymes, PHEX and other
  extracellular or membrane-associated proteins. Characterized enzymes share a zinc-dependent proteolytic
  framework while differing substantially in peptide substrate selection and biological role.
functional_coherence: HETEROGENEOUS
coherence_reason: M13 proteins include active zinc endopeptidases and divergent neprilysin-like proteins.
  The fly family analysis distinguishes seven Nep genes retaining the catalytic motifs from 21 Nepl genes
  predicted to lack catalytic competence; biochemical activity had been demonstrated for only a subset
  of Nep proteins (PMID:34189422). Metal-site mutagenesis establishes that altered ligands can abolish
  or greatly reduce NEP catalysis (PMID:8099556), while ECE-1 structure documents a related fold with
  a distinct peptide-processing role (PMID:18992253). Thus Nepl19 cannot inherit peptidase activity solely
  from its M13 assignment. Exact-target motif integrity and sequence completeness are separate requirements;
  neither universal activity nor universal inactivity is asserted.
