family_id: PANTHER:PTHR10788
family_name: TREHALOSE-6-PHOSPHATE SYNTHASE
preferred_name: Trehalose-6-phosphate synthase/phosphatase (GT20) family
summary: >-
  GT20 glycosyltransferases and their phosphatase-domain relatives make trehalose. Catalytic class
  I TPS (S. cerevisiae TPS1, S. pombe tps1, SF106) makes trehalose 6-phosphate from UDP-glucose and
  glucose 6-phosphate. TPS2 and S. pombe tpp1 (SF123, SF121) dephosphorylate it. The regulatory subunits
  TPS3 and TSL1 (SF15) scaffold the fungal trehalose synthase complex. Plant class II TPS paralogs
  (TPS5-11) are largely non-catalytic.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family shares the GT20 and phosphatase-like domains, but catalytic synthase (SF106), phosphatase
  (SF123, SF121), regulatory (SF15) and plant class II subfamilies differ in activity.
