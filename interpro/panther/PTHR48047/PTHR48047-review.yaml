family_id: PANTHER:PTHR48047
family_name: GLYCOSYLTRANSFERASE
preferred_name: Diverse small-molecule UDP-glycosyltransferases
summary: These glycosyltransferases act on diverse plant metabolites, with variation in sugar donor, acceptor
  and modified position. The retrieved family includes enzymes for flavonoids, terpenoids and other specialized
  metabolites.
functional_coherence: HETEROGENEOUS
coherence_reason: The walnut target's glycosyltransferase fold is compatible with glycosyl transfer. Identifying
  one family member's anthocyanin, hormone or triterpene substrate does not specify the walnut reaction.
  Evolutionary analysis should compare characterized acceptor-specific clades rather than assign the family
  name as an EC reaction.
