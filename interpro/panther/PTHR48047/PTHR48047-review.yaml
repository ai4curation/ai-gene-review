    label: UDP-glucosyltransferase activity
  scope: UNRESOLVED
  scope_reason: The walnut protein retains N-terminal glycosyltransferase and UDP-glycosyltransferase
    signatures. These support nucleotide-sugar transfer as a hypothesis, but donor glucose is narrower
    than UDP-sugar use, and closely related plant enzymes can differ in both donor and acceptor. Direct
    substrate testing or an established donor-specific branch is needed before delimiting UDP-glucosyltransferase
    activity across the family.
