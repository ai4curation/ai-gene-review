family_id: PANTHER:PTHR42891
family_name: D-GLYCERO-BETA-D-MANNO-HEPTOSE-1,7-BISPHOSPHATE 7-PHOSPHATASE
summary: GmhB, the histidinol-phosphate-phosphatase-like (HAD superfamily, subfamily IIIB) enzyme that
  removes the C-7 phosphate from D-glycero-beta-D-manno-heptose 1,7-bisphosphate to give the 1-phosphate
  substrate for adenylylation. The family is narrow and functionally uniform, and its members act in ADP-heptose
  synthesis for lipopolysaccharide cores and, in actinobacteria, for heptose-containing secondary metabolites.
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF1) carrying PANTHER's official family name, with all reviewed
  members performing the same phosphatase step; no divergent group is apparent.
