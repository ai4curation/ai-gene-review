    gene_symbol: sen15
    organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
    gene_review: genes/SCHPO/sen15/sen15-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0006388
    label: tRNA splicing, via endonucleolytic cleavage and ligation
  scope: FAMILY_WIDE
  scope_reason: The conserved function represented by tRNA splicing, via endonucleolytic cleavage and
    ligation is the family core for intact members. Participation in tRNA intron removal is compatible
    with Sen15's structural role. Intrinsic tRNA endonuclease activity belongs to the catalytic subunits
    and should not be inherited by Sen15 merely because the protein is part of the endonuclease complex.
  supported_by:
  - reference_id: PMID:9200603
    supporting_text: 'Our

      results demonstrate that the eucaryal tRNA splicing endonuclease contains two

      functionally independent active sites for cleavage of the 5'' and 3'' splice

      sites, encoded by SEN2 and SEN34, respectively.'
  - reference_id: file:genes/SCHPO/sen15/sen15-uniprot.txt
    supporting_text: DR   InterPro; IPR042777; Sen15_fungi.
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR28518-evidence.md
    supporting_text: Non-catalytic subunit of the tRNA-splicing endonuclease complex, a complex responsible
      for identification and cleavage of the splice sites in pre-tRNA. It cleaves pre-tRNA at the 5' and
      3' splice sites to release the intron. The products are an intron and two tRNA half-molecules bearing
      2',3' cyclic phosphate and 5'-OH termini. There are no conserved sequences at the splice sites,
      but the intron is invariably located at the same site in the gene, placing the splice sites an invariant
      distance from the constant structural features of the tRNA body (By similarity)
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR28518-evidence.md
    supporting_text: This entry includes Sen15 from fungi.
