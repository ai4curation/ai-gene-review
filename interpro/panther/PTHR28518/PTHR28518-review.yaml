family_id: PANTHER:PTHR28518
family_name: TRNA-SPLICING ENDONUCLEASE SUBUNIT SEN15
summary: Sen15 proteins are structural components of eukaryotic tRNA-splicing endonuclease complexes.
  They support the assembly and function of a complex whose catalytic subunits cleave intron-containing
  precursor tRNAs.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Sen15 is a structural subunit of the eukaryotic tRNA-splicing endonuclease, whereas
  primary yeast experiments locate the two cleavage active sites in Sen2 and Sen34 (PMID:9200603). Pombe
  Sen15 has the fungal Sen15 signature. Participation in tRNA intron removal is conserved, but isolated
  Sen15 endonuclease activity is not supported. The evidence does not require a Sen15/Sen34-only alpha2-beta2
  model of the functional heterotetramer.
subfamilies:
