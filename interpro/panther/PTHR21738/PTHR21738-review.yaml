family_id: PANTHER:PTHR21738
family_name: RIBOSOMAL RNA PROCESSING PROTEIN 36 HOMOLOG
preferred_name: Rrp36 small-subunit ribosome biogenesis factors
summary: Rrp36 proteins participate in early pre-rRNA processing and small-ribosomal-subunit biogenesis.
  They are preribosomal assembly factors rather than structural constituents of the mature ribosome. A
  requirement for cleavage at an early processing step does not establish intrinsic nuclease activity.
functional_coherence: COHERENT
coherence_reason: The 72 inspected inventory entries consistently identify Rrp36, and curated IPR009292
  supports early prerRNA processing. This is a ribosome-assembly role rather than membership in the mature
  translating ribosome. A depletion phenotype at a cleavage step would establish a requirement for Rrp36
  but not the chemistry of an autonomous RNA nuclease.
