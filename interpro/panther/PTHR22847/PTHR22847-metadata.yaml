  description:
  - text: This family of proteins includes components involved in various cellular
      processes such as mitochondrial fission, regulation of dynein motor activity,
      transcriptional repression, and histone modification. Members act as adapter
      proteins forming complexes essential for mitochondrial division, influencing
      microtubule dynamics by regulating dynein, and participating in the modulation
      of chromatin structure to control gene expression. Some proteins in this family
      are also implicated in the regulation of deubiquitinating complexes, contributing
      to protein stability and turnover.
