  description:
  - text: The ADCK protein kinase family is part of the larger protein kinase superfamily.
      Members of the ADCK family are characterized by the presence of an aarF domain
      and are typically associated with mitochondrial functions. Although the precise
      biochemical activities of these kinases are not fully understood, they are believed
      to be involved in the mitochondrial import of CoQ precursors, which is essential
      for muscle mitochondrial function and fatty acid beta-oxidation. The exact substrates
      for their kinase activity, whether they phosphorylate serine, threonine, or
      tyrosine residues, remain to be determined.
