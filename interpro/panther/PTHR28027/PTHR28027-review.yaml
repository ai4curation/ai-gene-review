  assessment: UNRESOLVED
  assessment_reason: >-
    The Candida Wor1 seed supports positive regulation for the seed lineage,
    and PTN001997771 is the same SF2 WOPR node that soundly carries the
    DNA-binding transcription-factor activities. The exact positive sign is not
    established for every SF2 recipient, however. S. cerevisiae Rof1 is a WOPR
    transcription factor in this subfamily, but the budding-yeast
    overexpression data point to a repressive regulon, and no Rof1 ChIP/CUT&RUN
    dataset yet shows which genes are direct targets. Leave the row unresolved
    until Rof1's direct target sign is known.
