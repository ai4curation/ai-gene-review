  assessment: UNRESOLVED
  assessment_reason: >-
    The Candida Wor1 seed supports positive regulation for the seed lineage, and
    PTN001997771 is the same SF2 fungal WOPR node that soundly carries the
    DNA-binding transcription-factor activities. The exact positive sign is not
    established for every SF2 recipient, however: S. cerevisiae Rof1 is a WOPR
    transcription factor in this subfamily, but its current yeast review generalizes
    the inherited IBA to the direction-neutral parent because the S. cerevisiae
    overexpression data indicate repression rather than positive regulation of the
    observed regulon. The PAINT change needs a precise Rof1 branch target before this
    node can be called NEEDS_PRUNING.
