family_id: PANTHER:PTHR28027
family_name: TRANSCRIPTIONAL REGULATOR MIT1
preferred_name: Fungal WOPR transcriptional regulators
summary: >-
  PTHR28027 contains fungal WOPR-domain transcription factors. Its reviewed SF2
  branch includes Candida albicans Wor1, Saccharomyces cerevisiae Mit1 and Rof1,
  Schizosaccharomyces pombe Gti1 and filamentous-fungal Sge1/FGP1 regulators, all
  members of the fungal Wor1/Mit1/Ryp1 regulatory family. PAINT places nuclear
  DNA-binding transcription-factor and sequence-specific DNA-binding activity at
  the SF2 ancestral node, which is consistent with the conserved WOPR domain and
  with primary literature showing WOPR proteins bind specific DNA sites to control
  fungal morphology programs. The same node also carries positive regulation of
  RNA polymerase II transcription from the C. albicans Wor1 seed; that sign-specific
  term is not resolved for all SF2 descendants because S. cerevisiae Rof1 is a
  WOPR transcription factor whose observed overexpression regulon is repressed.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The local PAINT rows are scoped to the SF2 branch and capture the conserved
  nuclear sequence-specific transcription-factor role of Wor1/Mit1/Ryp1-like WOPR
  proteins. The smaller SF1 branch contains Pac2/LIV3-like WOPR regulators and does
  not inherit the reviewed SF2 node; the exact activation or repression sign is
  not uniform even inside SF2.
