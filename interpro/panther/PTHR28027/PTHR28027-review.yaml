family_id: PANTHER:PTHR28027
family_name: TRANSCRIPTIONAL REGULATOR MIT1
preferred_name: Fungal WOPR transcriptional regulators
summary: >-
  PTHR28027 contains fungal WOPR-domain transcription factors. Its main SF2
  branch, rooted at PAINT node PANTHER:PTN001997771, includes Candida albicans
  Wor1, Saccharomyces cerevisiae Mit1 and Rof1, Schizosaccharomyces pombe Gti1
  and filamentous-fungal Sge1/FGP1 regulators. PAINT places nuclear
  localization, DNA-binding transcription-factor activity and sequence-specific
  DNA-binding activity on PTN001997771, and the two DNA-binding activities are
  supported by the family-defining WOPR domain across both SF2 and the
  Pac2/LIV3-like SF1 branch. The same node also carries positive regulation of
  RNA polymerase II transcription from the C. albicans Wor1 seed; that
  sign-specific term is unresolved because S. cerevisiae Rof1 is a WOPR
  transcription factor whose observed overexpression regulon is repressed and
  whose direct in vivo targets remain unmapped.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reviewed PAINT rows sit on PTN001997771, the current Wor1/Mit1/Ryp1-like
  SF2 node rather than the Pac2/LIV3-like SF1 branch. The core WOPR-domain
  DNA-binding transcription-factor role is nevertheless family-wide, while the
  exact activation or repression sign is not uniform even inside SF2.
