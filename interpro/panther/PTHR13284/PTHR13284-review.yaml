family_id: PANTHER:PTHR13284
family_name: GH01354P
preferred_name: SECISBP2 / SECISBP2L L7Ae-domain RNA-binding proteins
summary: >-
  Eukaryotic proteins with an L7Ae/L30e-type RNA-binding domain related to
  selenocysteine insertion sequence-binding protein 2 (SECISBP2, SBP2). The family
  has three populated subfamilies in the PANTHER tree (54 leaves): SF9, vertebrate
  SECISBP2, the 3'-UTR SECIS-binding factor that docks on the 40S subunit and enables
  EEFSEC to deliver Sec-tRNA(Sec) at UGA; SF10, vertebrate SECISBP2L, a paralog named
  for SECISBP2 similarity; and SF4 ("C2H2-type domain-containing protein"), an
  uncharacterized group of invertebrate, protist, algal and fungal homologs. Only
  SF9 and SF10 have Swiss-Prot members (mammalian SECISBP2 and SECISBP2L). The
  family name is an uninformative Drosophila clone name.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Only SF9 SECISBP2 has a demonstrated role in selenocysteine incorporation. SF10
  SECISBP2L is a paralog whose function has not been established in the cached
  evidence, and SF4 contains homologs from fungi (Neurospora crassa, Phaeosphaeria
  nodorum) that belong to lineages without selenoproteins, so a SECIS-dependent
  function cannot be general to the family.
