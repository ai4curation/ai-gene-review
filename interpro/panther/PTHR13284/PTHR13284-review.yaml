  assessment: TOO_DEEP
  assessment_reason: >-
    The only seed is Trypanosoma brucei Q57Y14, an SF4 protein whose mitochondrial
    annotation comes from a genome-wide tagging screen. Placing it at the eukaryotic
    root propagates a mitochondrial location to every SECISBP2 and SECISBP2L. Human
