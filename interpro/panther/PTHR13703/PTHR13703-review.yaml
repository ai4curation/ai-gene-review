family_id: PANTHER:PTHR13703
family_name: SMAD
preferred_name: SMAD family, inhibitory SMAD slice
review_status: IN_PROGRESS
summary: >-
  PTHR13703 contains the receptor-regulated, common-mediator and inhibitory SMAD
  transcriptional regulators that relay or attenuate TGF-beta superfamily signaling.
  This review covers the human inhibitory SMAD branches represented by SMAD6 and
  SMAD7. SMAD6 and SMAD7 lack the R-SMAD C-terminal receptor-phosphorylation motif
  and instead inhibit signaling by binding receptors or R-SMADs, by recruiting
  SMURF ubiquitin ligases to signaling proteins, and, for SMAD7, by blocking SMAD
  transcriptional complexes in the nucleus.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family is coherent for MH2-domain SMAD biology, heteromeric SMAD complexes
  and regulation of RNA polymerase II transcription downstream of TGF-beta family
  receptors. It is not coherent for the direction or receptor specificity of every
  signaling term: R-SMADs transduce BMP, TGF-beta or activin inputs, SMAD4 is a
  common mediator, and SMAD6/7 are inhibitory branches whose transcription-factor
  and DNA-binding IBDs are already blocked by IRD losses at the inhibitory-SMAD
  clade.
