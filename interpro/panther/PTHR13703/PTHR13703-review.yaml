- node_id: PANTHER:PTN001008964
  asserted_term:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  evidence: IRD
  negated: true
  assessment: LOSS_TOO_BROAD
  proposed_action:
    paint_action: MOVE_LOSS
    target_node_id: PANTHER:PTN008550639
  assessment_reason: >-
    The inhibitory SMAD6/7 branch diverged from the canonical R-SMAD/co-SMAD
    MH1-domain DNA-binding factors, but the IRD is too broad because human SMAD7
    has MH2-domain sequence-specific DNA-binding evidence in vitro and is
    recovered by ChIP at the PAI-1 promoter in vivo. Move the loss to the
    SMAD6-specific branch so SMAD7 can keep the noncanonical DNA-binding
    mechanism without inheriting the canonical root IBD.
  supported_by:
  - reference_id: file:interpro/panther/PTHR13703/PTHR13703-paint.tsv
    supporting_text: "PTHR13703\tPTN001008964\tGO:0000978\tF\tIRD\ttrue"
  - reference_id: PMID:17438144
