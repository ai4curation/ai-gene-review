family_id: PANTHER:PTHR10194
family_name: RAS GTPASE-ACTIVATING PROTEINS
preferred_name: Ras and Rap GTPase-activating proteins
summary: RasGAP-related proteins accelerate GTP hydrolysis by small GTPases rather than hydrolyzing free
  GTP as the principal catalyst themselves. Ras versus Rap preference and regulatory localization vary
  across the group.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The mosquito target carries a RasGAP domain and conserved-site signature. General GTPase-activator
  activity is mechanistically consistent, while a specific GTPase substrate or signaling pathway needs
  branch-specific evidence. A conserved domain does not dispense with checking the catalytic interface
  in divergent members.
