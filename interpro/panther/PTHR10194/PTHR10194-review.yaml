  scope: UNRESOLVED
  scope_reason: Neurofibromin and p120GAP mutagenesis directly establish Ras GTPase activation through
    a catalytic interface that positions the arginine-finger region. The mosquito RasGAP domain and conserved-site
    signature support a comparable GAP mechanism. Ras versus Rap preference and inactive interface variants
    require branch-specific analysis; the complete functional set is not restricted to the benchmark Raskol
    subfamily.
