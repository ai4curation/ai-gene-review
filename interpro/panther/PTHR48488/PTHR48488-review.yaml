notes: >-
  PTHR48488 is a single-subfamily family (PTHR48488:SF1) rooted at Euteleostomi
  node PTN009232695. PAINT already asserts GO:0005125 (cytokine activity) and
  GO:0005576 (extracellular region) at PTN009232695, but omits GO:0140865
  (interleukin-22-mediated signaling pathway), which currently has only a single
  gene product (IL22RA1) annotated in GOA.
