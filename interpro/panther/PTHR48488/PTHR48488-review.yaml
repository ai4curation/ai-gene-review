family_id: PANTHER:PTHR48488
family_name: INTERLEUKIN-22
preferred_name: Interleukin-22 cytokine family
summary: >-
  Jawed-vertebrate (Euteleostomi) family of secreted alpha-helical cytokines of
  the IL-10 superfamily orthologous to human Interleukin-22 (IL22). Produced
  predominantly by activated T cells (Th17, Th22, gamma-delta T cells) and
  group 3 innate lymphoid cells (ILC3), IL22 acts selectively on non-hematopoietic
  epithelial and stromal cells and hepatocytes by binding the heterodimeric
  class II cytokine receptor complex composed of high-affinity IL22RA1 (IL-22R1)
  and shared IL10RB (IL-10R2). Receptor engagement activates JAK1 and TYK2 to
  phosphorylate STAT3 (as well as STAT1 and STAT5), driving antimicrobial
  peptide production, mucus secretion, acute-phase protein synthesis, and
  epithelial regeneration at barrier surfaces. Extracellular IL22 activity is
  negatively regulated by the soluble high-affinity decoy receptor IL22RA2
  (IL-22BP).
