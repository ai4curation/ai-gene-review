    assessment: UNRESOLVED
    assessment_reason: >-
      IL22 exerts context-dependent dual effects on tissue inflammation: while
      it protects mucosal barriers and limits tissue damage during acute
      infection, it also induces acute-phase reactants and drives pathogenic
      inflammation in psoriasis and other chronic inflammatory conditions. The
      human IL22 gene review therefore modifies GO:0050728 to the parent term
      GO:0050727 (regulation of inflammatory response).
term_assessments:
  - assessed_term:
      id: GO:0005125
      label: cytokine activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member of PTHR48488 is a secreted cytokine ligand for the
      IL22RA1/IL10RB receptor complex.
    supported_by:
      - reference_id: PMID:10875937
        supporting_text: >-
          A new member of the interferon receptor family, which we term IL-22R,
          functions as a second component together with CRF2-4 to enable IL-22
          signaling.
  - assessed_term:
      id: GO:0140865
      label: interleukin-22-mediated signaling pathway
    scope: FAMILY_WIDE
    scope_reason: >-
      All members of PTHR48488 initiate the interleukin-22-mediated signaling
      pathway (GO:0140865) by binding the heterodimeric IL22RA1/IL10RB receptor
      complex and activating JAK1/TYK2-STAT3 signaling. PAINT currently omits
      GO:0140865 at PTN009232695, leaving GO:0140865 with zero ligand
      annotations in GOA.
    supported_by:
      - reference_id: PMID:18599299
        supporting_text: >-
          IL-22 biological activity is initiated by binding to a cell-surface
          complex composed of IL-22R1 and IL-10R2 receptor chains and further
          regulated by interactions with a soluble binding protein, IL-22BP,
          which shares sequence similarity with an extracellular region of
          IL-22R1 (sIL-22R1).
      - reference_id: PMID:18675809
        supporting_text: >-
          Its signaling mechanism involves the sequential binding of IL-22 to
          interleukin-22 receptor 1 (IL-22R1), and of this dimer to
          interleukin-10 receptor 2 (IL-10R2) extracellular domain.
  - assessed_term:
      id: GO:0005576
      label: extracellular region
    scope: FAMILY_WIDE
    scope_reason: >-
      All PTHR48488 members are secreted proteins functioning in the
      extracellular space/region.
    supported_by:
      - reference_id: PMID:11481447
        supporting_text: >-
          We demonstrate that IL-22RA2 binds specifically to IL-22 and
          neutralizes IL-22-induced proliferation of BaF3 cells expressing
          IL-22 receptor subunits.
  - assessed_term:
      id: GO:0050728
      label: negative regulation of inflammatory response
    scope: UNRESOLVED
    scope_reason: >-
      Because IL22 exhibits both tissue-protective anti-inflammatory and
      pro-inflammatory effects depending on tissue context and co-present
      cytokines, the unsigned parent term GO:0050727 (regulation of
      inflammatory response) is preferred over GO:0050728 alone.
    supported_by:
      - reference_id: PMID:18599299
        supporting_text: >-
          Thus, IL-22 exhibits paradoxical pro- and anti- inflammatory
          properties on epithelial cells, which are strikingly similar to the
          activity profile of IL-10 on immune cells
