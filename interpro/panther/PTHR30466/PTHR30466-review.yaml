subfamilies:
- subfamily_id: PANTHER:PTHR30466:SF11
  label: FLAVIN-DEPENDENT MONOOXYGENASE, REDUCTASE SUBUNIT HSAB
  description: >-
    Reductase components paired with diverse oxygenases: mycobacterial HsaB (steroid ring
    degradation), NtaB (nitrilotriacetate), NpcB (4-nitrophenol), trigonelline and
    p-hydroxyphenylacetate monooxygenase reductases, DszD, AsuE2 and the sulfoquinovose
    pathway reductase SmoA. Thirteen of the 100 inventory members.
  representative_members:
  - id: UniProtKB:Q7CS24
    gene_symbol: smoA
    organism: Agrobacterium fabrum C58
    gene_review: genes/AGRFC/smoA/smoA-ai-review.yaml
  - id: UniProtKB:P54990
