term_assessments:
- assessed_term:
    id: GO:0052874
    label: FMN reductase (NADH) activity
  scope: UNRESOLVED
  scope_reason: >-
    NADH-dependent FMN reduction is established for SmoA (SF11) and is the activity named for
    RutF (SF1), but family members differ in flavin (the inventory also names members such as
    "NADH-dependent FAD reductase" and "NADH:FAD oxidoreductase") and reductant preference, and most members are unassayed; no subfamily can
    be shown to be uniform for this specific term.
  supported_by:
  - reference_id: PMID:35074914
    supporting_text: indicating that NADH is the preferred cofactor for SmoA
- assessed_term:
    id: GO:0006208
    label: pyrimidine nucleobase catabolic process
  scope: NOT_APPLICABLE
  scope_reason: >-
    The process is set by the partner oxygenase RutA and applies only to RutF orthologs; it is
    not a family or subfamily property (see the TOO_DEEP assessment of PTN001252919). The SF11
    member SmoA acts instead in sulfoquinovose catabolism.
  supported_by:
  - reference_id: PMID:20369853
    supporting_text: Here we demonstrate that the flavoenzyme RutA, along with the flavin reductase RutF,
      catalyzes the initial uracil ring opening
  - reference_id: PMID:35074914
    supporting_text: SmoC was incubated with SQ in the presence of SmoA, FMN, and NADH, which generate
      FMNH2 in situ
