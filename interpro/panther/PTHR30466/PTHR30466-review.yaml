  assessment: SOUND
  assessment_reason: >-
    NAD(P)H-dependent reduction of free flavins (EC 1.5.1.x, flavin N5 as the CH-NH acceptor
    site) is the chemistry the family shares, and the four seeds span both subfamilies and
    fungi. The A. fabrum SmoA review independently confirms the activity class (NADH-dependent
    FMN reduction) for an SF11 member outside the seed set. The term is general enough to hold
    for every member regardless of flavin or reductant preference.
  supported_by:
