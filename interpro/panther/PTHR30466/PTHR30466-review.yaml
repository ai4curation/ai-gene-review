    gene_symbol: rutF
    organism: Escherichia coli K-12
  assessment: TOO_DEEP
  assessment_reason: >-
    Pyrimidine catabolism is a property of RutF's partner oxygenase RutA, not of the flavin
    reductase fold, yet the node propagates the process to reductases of unrelated pathways,
    including the 4-hydroxyphenylacetate monooxygenase reductases HpaC (aromatic catabolism)
    and the actinorhodin-cluster protein ActVB. For RutF itself the process is correct; the
    term belongs on the RutF ortholog clade within SF1, not at this Bacteria-level node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30466/PTHR30466-paint.tsv
