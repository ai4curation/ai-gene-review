family_id: PANTHER:PTHR30466
family_name: FLAVIN REDUCTASE
preferred_name: NAD(P)H-dependent flavin reductases of two-component monooxygenases (RutF/HpaC/HsaB/SmoA)
summary: >-
  Small split-barrel (flavin reductase-like domain) NAD(P)H:flavin oxidoreductases, most of
  which serve as the reductase component of bacterial two-component flavin-dependent
  monooxygenases, supplying reduced FMN or FAD to a separate oxygenase. Characterized members
  include E. coli RutF, which with RutA opens the uracil ring in pyrimidine catabolism; the
  4-hydroxyphenylacetate 3-monooxygenase reductases (HpaC); the styrene monooxygenase reductase
  StyB; the mycobacterial steroid-degradation reductase HsaB; the nitrilotriacetate
  monooxygenase reductase NtaB; and Agrobacterium SmoA, the NADH-dependent FMN reductase of the
  sulfoquinovose monooxygenase SmoC. Fungal members include S. pombe Coq12. PANTHER divides the
  family into SF1 (RutF/HpaC-like) and SF11 (HsaB/NtaB/SmoA-like); the partner oxygenase and
  therefore the physiological process differ member by member.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reductase chemistry (NAD(P)H-dependent reduction of a free flavin, EC 1.5.1 class) is
  shared, but the flavin (FMN versus FAD), the preferred reductant (NADH versus NADPH) and the
  biological process (pyrimidine, aromatic, steroid, nitrilotriacetate or sulfoquinovose
  catabolism, or antibiotic biosynthesis) are set by each member's partner oxygenase, so only
  the generic reductase class can be inherited family-wide.
