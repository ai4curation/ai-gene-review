  evidence: IBD
  paint_snapshot: '20250423'
  seeds:
  - id: UniProtKB:P75893
    gene_symbol: rutF
    organism: Escherichia coli K-12
  assessment: UNRESOLVED
  assessment_reason: >-
    The seed's experimental basis for an NADPH-dependent riboflavin reductase activity is not
    in the cached literature: the RutA/RutF study used RutF with NADH and FMN. Characterized
    members related to this lineage prefer NADH (SmoA uses NADPH at about 0.2% of its NADH
    efficiency, and SmoA's TreeGrafter copy of this term is corrected to FMN reductase (NADH)
    in its gene review). Resolving the node needs the primary assay behind the RutF seed
    (riboflavin and NADPH as substrates) and reductant-preference data for the HpaC and
    Streptomyces recipients.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30466/PTHR30466-paint.tsv
    supporting_text: "PTHR30466\tPTN001252919\tGO:0042602\tF\tIBD\tfalse\tUniProtKB:P75893"
