    organism: Aminobacter aminovorans
  diverged_from_family: false
  divergence_description: >-
    No divergence in reductase chemistry; the subfamily differs from SF1 only in which
    oxygenases its members partner, which does not map onto a single process.
- subfamily_id: PANTHER:PTHR30466:SF1
  label: FMN REDUCTASE (NADH) RUTF
  description: >-
    The larger subfamily (87 of 100 inventory members), dominated by RutF orthologs of the Rut
    pyrimidine-utilization pathway but also containing HpaC 4-hydroxyphenylacetate
    monooxygenase reductases, StyB, the actinorhodin-pathway protein ActVB, ferric-chelate
    reductases and fungal Coq12.
  representative_members:
