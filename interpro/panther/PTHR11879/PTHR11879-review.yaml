    label: L-aspartate biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    PAINT restricts it to the cytosolic opisthokont clade (SF55, SF3), which in yeast supplies
    most aspartate. The mitochondrial isozymes can also make aspartate (malate-aspartate shuttle;
    the AAT1 review lists it in AAT1's core process), so this is a conservative lower bound, not
