family_id: PANTHER:PTHR11879
family_name: ASPARTATE AMINOTRANSFERASE
preferred_name: Subfamily Ia aspartate and aromatic-amino-acid aminotransferases (AspAT/GOT, AspC, TyrB)
summary: >-
  PLP-dependent fold-type I (subfamily Ia) aminotransferases. The eukaryotic members are the
  aspartate aminotransferases (L-aspartate:2-oxoglutarate transaminases) that interconvert
  aspartate + 2-oxoglutarate and oxaloacetate + glutamate. These include the cytosolic
  isozymes (S. cerevisiae AAT2, S. pombe caa1, human GOT1) and the mitochondrial isozymes (S.
  cerevisiae AAT1, S. pombe SPBC725.01/maa1, human GOT2), which together run the
  malate-aspartate shuttle, plus plant mitochondrial, cytosolic and plastid isozymes. The
  bacterial members are E. coli AspC, a broad aspartate/aromatic aminotransferase, and the TyrB
  aromatic-amino-acid aminotransferases that make phenylalanine and tyrosine. A few fungal
  secondary-metabolism aminotransferases are also classified here.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Aspartate aminotransferase activity is shared by the eukaryotic isozymes and bacterial AspC.
  Specialization comes in two forms. First, substrate: the bacterial TyrB enzymes (SF37) are
  aromatic-amino-acid aminotransferases, and E. coli AspC covers both aspartate and the aromatic
  2-oxo acids. Second, compartment: mitochondrial versus cytosolic isozymes arose by duplication
  in opisthokonts, while plant cytosolic and plastid isozymes branch inside the mitochondrial-type
  clade. PANTHER subfamily names do not follow compartment or substrate. SF22 "ASPARTATE
  AMINOTRANSFERASE, MITOCHONDRIAL" also holds E. coli AspC, plant cytoplasmic isozymes and
  bacterial aromatic aminotransferases. Human GOT2 is in its own subfamily SF39, while other
  mammalian GOT2 orthologs are in SF22.
