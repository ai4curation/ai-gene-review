term_assessments:
- assessed_term:
    id: GO:0004069
    label: L-aspartate:2-oxoglutarate transaminase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Shared by the cytosolic and mitochondrial eukaryotic isozymes and by bacterial AspC. PAINT
    places it at the eukaryotic mitochondrial-type node, the cytosolic node and a
    gammaproteobacterial AspC node. TyrB also transaminates aspartate, but its physiological role
    is aromatic; the fungal secondary-metabolism members (tasG, ucdG) were not checked. The
    aspartate/asparagine and malate-aspartate shuttle modules use the family id with
    compartment-specific representatives, which is appropriate.
  supported_by:
  - reference_id: PMID:9288922
    supporting_text: We demonstrate that the gene AAT2 codes for the cytosolic and peroxisomal AAT activities.
  - reference_id: PMID:1482685
    supporting_text: Sequence comparison of this yeast AspAT with AspATs from other organisms shows a high degree
      of homology in regions previously shown to be important for catalysis.
  - reference_id: PMID:15983
    supporting_text: inactivates a nonrespressible aspartate aminotransferase that also has activity on the aromatic
      amino acids
- assessed_term:
    id: GO:0008793
    label: aromatic-amino-acid:2-oxoglutarate transaminase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The physiological activity of bacterial TyrB (SF37) and a secondary activity of E. coli AspC
    (SF22). Not a property of the eukaryotic AspATs. The phenylalanine/tyrosine biosynthesis
    module selects the whole family for this activity; with its single TyrB representative it
    should select SF37 (with AspC noted). PAINT itself uses the more specific
    L-tyrosine:2-oxoglutarate transaminase (GO:0004838) at PTN000222931.
