family_id: PANTHER:PTHR47964
family_name: ATP-DEPENDENT DNA HELICASE HOMOLOG RECG, CHLOROPLASTIC
preferred_name: RecG and Mfd superfamily 2 DNA motor family
summary: A superfamily 2 ATPase family that contains two functionally distinct bacterial proteins and
  plant organellar homologs. RecG is a monomeric 3'-5' DNA helicase specific for branched DNA that branch-migrates
  Holliday junctions and regresses stalled replication forks; Mfd (transcription-repair coupling factor)
  is a DNA translocase that releases RNA polymerase stalled at lesions and recruits nucleotide excision
  repair. They share the helicase/translocase core but differ in their accessory domains (the RecG wedge
  domain; the Mfd RNA-polymerase-interacting and UvrB-homology domains) and in function.
functional_coherence: HETEROGENEOUS
coherence_reason: 'Of the 58 reviewed members in the cached inventory, 28 are RecG, 29 are Mfd (transcription-repair-coupling
  factor) and one is Arabidopsis RECG1; all 58 are assigned to subfamily SF1, so PANTHER''s subfamily
  split does not separate RecG from Mfd. PAINT does separate them below SF1: PTN002773745 carries the
  RecG helicase assertions (seeds are RecG proteins) and PTN008553567 the Mfd assertions (seed E. coli
  Mfd). Membership sources disagree for Mfd: the release-pinned PANTHER 19.0 classification files used
  by the member index place E. coli Mfd (P30958) in PTHR14025:SF29 (TRANSCRIPTION-REPAIR-COUPLING FACTOR),
  while UniProt and the InterPro inventory place it in PTHR47964:SF1. The heterogeneity therefore depends
  on which assignment is current. SF2 (RECG WEDGE DOMAIN-CONTAINING PROTEIN) has no reviewed members and
  is not assessed.'
