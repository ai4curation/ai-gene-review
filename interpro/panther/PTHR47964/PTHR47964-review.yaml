notes: KT2440 RecG (Q88C73) and KT2440 Mfd (Q88KZ1) are both unreviewed and both carry PTHR47964:SF1 cross-references.
  The RuvABC module grounds RecG to InterPro IPR004609; the nucleotide excision repair module grounds
  Mfd to this family with the Mfd-specific domain IPR004576 as its required domain. If PANTHER's reassignment
  of Mfd to PTHR14025:SF29 is confirmed, that grounding and the PTN008553567 assessments here should be
  revisited.
