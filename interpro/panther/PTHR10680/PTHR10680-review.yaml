family_id: PANTHER:PTHR10680
family_name: PEPTIDYL-GLYCINE ALPHA-AMIDATING MONOOXYGENASE
preferred_name: Peptide-amidation PHM/PAL proteins
summary: Peptide amidation proceeds through monooxygenase and lyase reactions, carried in separate proteins
  or combined in bifunctional PAM. Copper/ascorbate-dependent monooxygenase chemistry and PAL lyase chemistry
  reside in different structural modules.
functional_coherence: HETEROGENEOUS
coherence_reason: The quail target contains both monooxygenase and PAL-associated architecture. PAL activity
  and ascorbate interaction must be assigned to their respective modules, not inferred from the other
  reaction. The retrieved family includes separate PHM and PAL proteins and therefore neither module-specific
  activity is universal.
