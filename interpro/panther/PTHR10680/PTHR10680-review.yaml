term_assessments:
- assessed_term:
    id: GO:0004598
    label: peptidylamidoglycolate lyase activity
  scope: UNRESOLVED
  scope_reason: PAL structural and mutagenesis data establish the lyase reaction in a zinc-containing
    beta-propeller module. Bifunctional PAM and separate PAL proteins can retain this module, whereas
    PHM-only proteins cannot inherit the lyase activity from their monooxygenase domain. The complete
    set of PAL-bearing functional branches, including shortened products, is not delimited.
  supported_by:
  - reference_id: PMID:19604476
    supporting_text: 'The structures show that PAL

      folds as a six-bladed beta-propeller'
