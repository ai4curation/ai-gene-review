    scope: FAMILY_WIDE
    scope_reason: >-
      All characterized subfamilies mediate endocytic retrieval and recycling of
      transmembrane cargos from endosomes to the trans-Golgi network or plasma
      membrane.
    supported_by:
      - reference_id: file:genes/human/VPS26A/VPS26A-uniprot.txt
        supporting_text: >-
          The SNX27-retromer is believed to be involved in endosome-to-plasma
          membrane trafficking and recycling of a broad spectrum of cargo
          proteins (Probable).
      - reference_id: PMID:28892079
        supporting_text: >-
          Following endocytosis into the endosomal network, integral membrane
          proteins undergo sorting for lysosomal degradation or are retrieved
          and recycled back to the cell surface. Here we describe the discovery
          of an ancient and conserved multiprotein complex that orchestrates
          cargo retrieval and recycling and, importantly, is biochemically and
          functionally distinct from the established retromer pathway.
