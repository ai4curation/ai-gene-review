family_id: PANTHER:PTHR12233
family_name: VACUOLAR PROTEIN SORTING 26 RELATED
preferred_name: Arrestin-fold endosomal cargo-adaptor subunits (VPS26A, VPS26B, VPS26C)
summary: >-
  Arrestin-fold cargo-adaptor subunits of endosomal retrieval complexes across
  Eukaryota, encompassing the retromer cargo-selective complex (CSC) subunits
  VPS26A and VPS26B (and single-copy invertebrate/fungal Vps26/Pep8 orthologs)
  as well as the retriever complex subunit VPS26C (DSCR3). All characterized
  members adopt a bilobed beta-sandwich arrestin-like fold that docks onto the
  N-terminal region of an alpha-solenoid scaffold (VPS35 in retromer or VPS35L
  in retriever) and cooperates with sorting nexins (SNX3, SNX27, or SNX17) to
  recognize cytosolic sorting motifs on transmembrane cargos for endosomal
  retrieval and recycling.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Family members share a conserved arrestin-like cargo-adaptor fold and
  endosomal retrieval/recycling role across eukaryotes, but diverge between the
  canonical retromer subfamilies (PANTHER:PTHR12233:SF1, PANTHER:PTHR12233:SF4,
  PANTHER:PTHR12233:SF5), which assemble with VPS35 and VPS29 to mediate
  SNX3/SNX27/SNX-BAR-coupled retrograde endosome-to-TGN and endosome-to-plasma
  membrane transport, and the retriever subfamily (PANTHER:PTHR12233:SF2,
  VPS26C), which assembles with VPS35L and VPS29 in the Commander pathway to
  mediate SNX17-coupled recycling of NPxY/NxxY-motif cargos.
reference_protein:
  id: UniProtKB:O75436
  label: Vacuolar protein sorting-associated protein 26A
  gene_symbol: VPS26A
  organism: Homo sapiens
subfamilies:
  - subfamily_id: PANTHER:PTHR12233:SF1
    label: VACUOLAR PROTEIN SORTING-ASSOCIATED PROTEIN 26
    description: >-
      Ancestral/invertebrate and fungal retromer Vps26/Pep8 subunit (including
      Drosophila Vps26 and yeast Pep8) that forms the heterotrimeric retromer
      cargo-selective complex with Vps35 and Vps29.
    representative_members:
      - id: UniProtKB:Q9W552
        label: Vacuolar protein sorting-associated protein 26
        gene_symbol: Vps26
        organism: Drosophila melanogaster
      - id: UniProtKB:P40335
        label: Carboxypeptidase Y-deficient protein 8
        gene_symbol: PEP8
        organism: Saccharomyces cerevisiae
    diverged_from_family: false
    supported_by:
      - reference_id: file:genes/DROME/Vps26/Vps26-uniprot.txt
        supporting_text: >-
          Component of the retromer complex which acts in conjunction with
          wingless (wg) and clathrin-mediated endocytosis to sustain a wntless
          (wls) traffic loop.
  - subfamily_id: PANTHER:PTHR12233:SF4
    label: VACUOLAR PROTEIN SORTING-ASSOCIATED PROTEIN 26A
    description: >-
      Vertebrate retromer subunit VPS26A that binds the N-terminus of VPS35 and
      recognizes cargo tails in concert with SNX3 and SNX27.
    representative_members:
      - id: UniProtKB:O75436
        label: Vacuolar protein sorting-associated protein 26A
        gene_symbol: VPS26A
        organism: Homo sapiens
      - id: UniProtKB:P40336
        label: Vacuolar protein sorting-associated protein 26A
        gene_symbol: Vps26a
        organism: Mus musculus
    diverged_from_family: false
    supported_by:
      - reference_id: file:genes/human/VPS26A/VPS26A-uniprot.txt
        supporting_text: >-
          Component of the heterotrimeric retromer cargo-selective complex (CSC),
          also described as vacuolar protein sorting subcomplex (VPS), formed by
          VPS26 (VPS26A or VPS26B), VPS29 and VPS35 (PubMed:11102511,
          PubMed:28892079).
  - subfamily_id: PANTHER:PTHR12233:SF5
    label: VACUOLAR PROTEIN SORTING-ASSOCIATED PROTEIN 26B
    description: >-
      Vertebrate paralog VPS26B that forms an alternative retromer
      cargo-selective complex with VPS35 and VPS29.
    representative_members:
      - id: UniProtKB:Q4G0F5
        label: Vacuolar protein sorting-associated protein 26B
        gene_symbol: VPS26B
        organism: Homo sapiens
      - id: UniProtKB:Q8C0E2
        label: Vacuolar protein sorting-associated protein 26B
        gene_symbol: Vps26b
        organism: Mus musculus
    diverged_from_family: false
    supported_by:
      - reference_id: PMID:16190980
        supporting_text: >-
          Vps26B co-precipitated with Vps35 from transfected cells and the
          direct interaction between these two proteins was confirmed by yeast
          2-hybrid analysis, thereby establishing Vps26B as a subunit of the
          retromer complex.
  - subfamily_id: PANTHER:PTHR12233:SF2
    label: VACUOLAR PROTEIN SORTING-ASSOCIATED PROTEIN 26C
    description: >-
      Divergent arrestin-fold paralog (VPS26C/DSCR3) that assembles with VPS35L
      and VPS29 into the retriever subcomplex of the Commander assembly rather
      than canonical retromer.
    representative_members:
      - id: UniProtKB:O14972
        label: Vacuolar protein sorting-associated protein 26C
        gene_symbol: VPS26C
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      VPS26C (DSCR3) incorporates into the heterotrimeric retriever complex
      (VPS26C-VPS35L-VPS29) within the Commander assembly rather than the
      canonical retromer cargo-selective complex (VPS26A/B-VPS35-VPS29),
      directing SNX17-dependent endosome-to-plasma membrane recycling rather
      than endosome-to-Golgi retrograde transport.
    supported_by:
      - reference_id: PMID:28892079
        supporting_text: >-
          We have called this complex 'retriever'; it is a heterotrimer composed
          of DSCR3, C16orf62 and VPS29, and bears striking similarity to
          retromer. We establish that retriever associates with the cargo
          adaptor sorting nexin 17 (SNX17) and couples to CCC (CCDC93, CCDC22,
          COMMD) and WASH complexes to prevent lysosomal degradation and promote
          cell surface recycling of α5β1 integrin.
