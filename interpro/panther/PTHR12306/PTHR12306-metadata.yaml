  name:
    name: Cell death-inducing DFFA-like effector domain-containing protein
    short: CIDE_domain-containing_protein
  description:
  - text: This family of proteins includes lipid transferases that are involved in
      the formation and enlargement of unilocular lipid droplets, primarily by mediating
      lipid droplet fusion. These proteins localize on the lipid droplet surface and
      facilitate the directional transfer of neutral lipids, which can lead to the
      enlargement of lipid droplets and the restriction of lipolysis, thus promoting
      lipid storage. Some family members also interact with transcription factors
      such as CEBPB to regulate gene expression in lipid metabolism. Additionally,
      certain proteins in this family are implicated in vesicle biogenesis and transport,
      including the maturation of very-low-density lipoproteins (VLDL) and the sterol-regulated
      export of SCAP-SREBP complexes. The family also includes proteins that can induce
      apoptosis under specific overexpression conditions or stress.
