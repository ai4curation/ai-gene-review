    label: hydroxyacylglutathione hydrolase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Directly measured for E. coli GloB and inherited through the bacterial PAINT node PTN002463577; the single
    subfamily is uniformly GloB. Accepted as core by the E. coli, P. putida KT2440 and P. aeruginosa gene reviews.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43705/PTHR43705-paint.tsv
    supporting_text: "PTHR43705\tPTN002463577\tGO:0004416\tF\tIBD\tfalse\tUniProtKB:P0AC84"
