- assessed_term:
    id: GO:0051596
    label: methylglyoxal catabolic process
  scope: FAMILY_WIDE
  scope_reason: >-
    GloB performs the second glyoxalase step; in E. coli it makes the major contribution to methylglyoxal
    detoxification, acting additively with the accessory isozyme GloC.
  supported_by:
  - reference_id: PMID:25670698
    supporting_text: The two isoenzymes have additive effects and ensure maximal MG degradation.
- assessed_term:
    id: GO:0008270
    label: zinc ion binding
  scope: FAMILY_WIDE
  scope_reason: >-
    E. coli GloB is a binuclear zinc enzyme, and the HAMAP rule applied across the family predicts two Zn2+ per
    subunit; a cofactor property, not the core function.
  supported_by:
  - reference_id: PMID:17196158
    supporting_text: Zn2+ activates the E. coli GlxII enzyme, with no evidence for Ni2+ metal utilization.
