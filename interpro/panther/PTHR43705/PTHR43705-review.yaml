family_id: PANTHER:PTHR43705
family_name: HYDROXYACYLGLUTATHIONE HYDROLASE
preferred_name: Bacterial GloB hydroxyacylglutathione hydrolase (glyoxalase II) family
summary: >-
  Bacterial metallo-beta-lactamase-fold hydroxyacylglutathione hydrolases (glyoxalase II, GloB) with a binuclear
  zinc site. They hydrolyse (R)-S-lactoylglutathione, made by glyoxalase I, to D-lactate and glutathione, the
  second step of glutathione-dependent methylglyoxal detoxification. E. coli GloB is the characterised member: a
  monomeric binuclear-zinc enzyme that supplies most of the cell's glyoxalase II activity, with the unrelated
  accessory isozyme GloC (YcbL) acting additively. Eukaryotic glyoxalase II (HAGH, GLO2/GLO4) is a separate
  PANTHER family, PTHR11935.
functional_coherence: COHERENT
coherence_reason: >-
  The family has a single subfamily (SF1); all 267 Swiss-Prot members are named GloB/hydroxyacylglutathione
  hydrolase, carry the HAMAP glyoxalase II rule, and E. coli GloB is characterised directly.
