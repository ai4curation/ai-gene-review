family_id: PANTHER:PTHR10799
family_name: SNF2/RAD54 HELICASE FAMILY
preferred_name: SNF2/RAD54 ATP-dependent chromatin remodelers
summary: >-
  PTHR10799 is the broad SNF2/RAD54 family of ATP-dependent chromatin remodelers.
  It contains multiple eukaryotic remodeler branches whose shared ATPase core
  supports general nuclear, chromatin, DNA-binding, and chromatin-binding PAINT
  assertions, but branch-specific activities have to be confined below the family
  root. S. cerevisiae Snf2 is a SWI/SNF ATPase in the Snf2/Sth1 branch; it should
  not inherit the ISWI/Fun30 nucleosome-array-spacing assertion now placed at the
  SNF2-like ATPase root.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family is unified by an ATP-dependent chromatin-remodeler core, but its
  branches specialize in different remodeling reactions and biological contexts,
  including SWI/SNF transcriptional remodeling, RSC remodeling, ISWI nucleosome
  spacing, Fun30/SMARCAD repair-linked remodeling, and DDM1-like heterochromatin
  functions.
