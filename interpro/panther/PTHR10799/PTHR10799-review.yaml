      - id: SGD:S000000449
    assessment: WRONG_NODE
    proposed_action:
      paint_action: MOVE_IBD
      target_node_id: PANTHER:PTN000848260
    assessment_reason: >-
      PTN004198564 is the 743-leaf SNF2-like ATPase root, but the six
      nucleosome-array-spacing seeds sit in the ISWI clade and the separate
      Fun30/SMARCAD clade, with no seed in the Snf2/Brm clade that contains S.
      cerevisiae Snf2. This IBD should be removed from the root and replaced by
      narrower placements, including an ISWI-clade placement at PTN000848260.
    supported_by:
      - reference_id: file:interpro/panther/PTHR10799/PTHR10799-paint.tsv
        supporting_text: "PTHR10799\tPTN004198564\tGO:0140750\tF\tIBD\tfalse\tAGI_LocusCode:AT3G06400|AGI_LocusCode:AT5G18620|FB:FBgn0011604|PomBase:SPAC25A8.01c|PomBase:SPCC1235.05c|SGD:S000000449\ttaxon:\t20250902"
      - reference_id: file:genes/yeast/SWI2/SWI2-ai-review.yaml
        supporting_text: >-
          Snf2 should instead be represented by ATP-dependent chromatin remodeler
          activity, nucleosomal DNA binding, and SWI/SNF complex membership
