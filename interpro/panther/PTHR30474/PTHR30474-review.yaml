term_assessments:
- assessed_term:
    id: GO:0008955
    label: peptidoglycan glycosyltransferase activity
  scope: UNRESOLVED
  scope_reason: Direct purified FtsW and RodA work supports the chemistry in characterized members, including
    different functional subfamilies; the term is not exclusive to SF2. An exhaustive catalytic assignment
    to all PTHR30474 members, including SpoVE, is not established here. Use verified SF2 membership together
    with independent polymerase and division-role evidence for a divisome selector, not the broad family alone.
    This uncertainty is about full propagation scope, not a denial of the experimentally supported activities.
  supported_by:
  - reference_id: PMID:30692671
    supporting_text: 'purified FtsW polymerizes

      lipid II into peptidoglycan'
  - reference_id: PMID:27525505
    supporting_text: RodA is a member of the SEDS
