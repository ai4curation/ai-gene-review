family_id: PANTHER:PTHR30474
family_name: CELL CYCLE PROTEIN
preferred_name: SEDS peptidoglycan polymerase family with division, elongation and sporulation roles
summary: SEDS integral membrane proteins include FtsW partners of division-associated class B penicillin-binding
  proteins, RodA/MrdB components of elongation machinery, and SpoVE sporulation proteins. Purified FtsW and
  RodA studies establish peptidoglycan polymerization for characterized members. Shared family membership does
  not specify a vegetative septal role or a cognate PBP partner.
functional_coherence: HETEROGENEOUS
coherence_reason: The family joins FtsW, RodA/MrdB and SpoVE implementations with different cellular roles.
  The common polymerase chemistry is supported for characterized FtsW and RodA, but this bounded assessment
  does not establish catalytic activity for every unassayed family member.
reference_protein:
