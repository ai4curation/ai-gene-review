family_id: PANTHER:PTHR24304
family_name: CYTOCHROME P450 FAMILY 7
preferred_name: CYP51 sterol 14-demethylases and CYP7/CYP39 sterol hydroxylases
summary: >-
  PTHR24304 contains sterol-modifying heme-thiolate cytochrome P450s. The fungal
  branch reviewed here consists of ER-membrane CYP51 enzymes that catalyze
  sterol 14-demethylation in ergosterol biosynthesis; the same family also
  contains vertebrate CYP7A1, CYP7B1, and CYP39A1 hydroxylases, plant CYP51s,
  and bacterial CYP51 representatives.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Fungal, plant, vertebrate, and bacterial CYP51 enzymes share sterol
  14-demethylase chemistry, but PTHR24304 also includes bile-acid/cholesterol
  hydroxylases on CYP7A1, CYP7B1, and CYP39A1 branches. PANTHER subfamily SF2
  is especially mixed, containing fungal CYP51s, plant CYP51s, vertebrate
  CYP51A1, and CYP39A1 despite its official CYP39-derived label.
