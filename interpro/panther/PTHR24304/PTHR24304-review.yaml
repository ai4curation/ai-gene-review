term_assessments:
- assessed_term:
    id: GO:0008398
    label: sterol 14-demethylase activity
  scope: UNRESOLVED
  scope_reason: >-
    The PTN008399779 CYP51 node is sound for sterol 14-demethylase activity,
    but the PTHR24304 root and official SF2 subfamily are broader than CYP51:
    they include CYP7, CYP39A1, and bacterial CYP51-related branches with
    different substrate scopes.
  supported_by:
  - reference_id: file:interpro/panther/PTHR24304/PTHR24304-paint.tsv
    supporting_text: "PTHR24304\tPTN008399779\tGO:0008398\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0006696
    label: ergosterol biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    Ergosterol biosynthesis is sound for the fungal CYP51 node PTN001209323 and
    must not be applied across the whole PTHR24304 family. It also cannot be
    expressed cleanly as a PANTHER subfamily-level rule because SF2 contains
    non-fungal CYP51 and CYP39A1 proteins in addition to the fungal CYP51s.
  supported_by:
  - reference_id: file:interpro/panther/PTHR24304/PTHR24304-paint.tsv
    supporting_text: "PTHR24304\tPTN001209323\tGO:0006696\tP\tIBD\tfalse"
