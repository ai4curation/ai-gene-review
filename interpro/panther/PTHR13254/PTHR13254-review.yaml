family_id: PANTHER:PTHR13254
family_name: GOLGI AUTOANTIGEN, GOLGIN SUBFAMILY A, 7
preferred_name: Erf4/GOLGA7 Ras palmitoyltransferase accessory proteins
summary: >-
  PTHR13254 contains Erf4/GOLGA7-family accessory subunits of DHHC
  Ras-family palmitoyltransferase complexes. S. cerevisiae Shr5/Erf4 and human
  GOLGA7/GCP16 are the experimental anchors: both stabilize their cognate DHHC
  catalytic subunits rather than contributing the active-site cysteine, but both
  are required for efficient Ras palmitoyltransferase activity. PAINT's
  family-root complex and Ras membrane-targeting rows are sound for the family;
  the ER-specific fungal complex term fits S. cerevisiae and its close
  budding-yeast relatives but needs an IRD for the fission-yeast leaf, whose
  direct localization evidence is mixed between ER and Golgi/cell-periphery
  pools.
functional_coherence: COHERENT
coherence_reason: >-
  Reviewed members are Erf4/GOLGA7-like accessory proteins for DHHC
  palmitoyltransferases. The main divergence is compartmental: S. cerevisiae
  Erf2-Erf4 is ER-associated, S. pombe has a high-throughput ER row but was
  also observed at Golgi and cell-periphery sites, and mammalian DHHC9-GOLGA7
  is a Golgi complex.
