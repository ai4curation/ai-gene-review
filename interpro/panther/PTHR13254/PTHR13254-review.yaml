term_assessments:
- assessed_term:
    id: GO:0002178
    label: palmitoyltransferase complex
  scope: FAMILY_WIDE
  scope_reason: >-
    Erf4/GOLGA7 proteins are accessory subunits of DHHC
    palmitoyltransferase complexes; the generic complex term is broad enough
    for the fungal ERF4, metazoan GOLGA7, and metazoan GOLGA7B branches.
  supported_by:
  - reference_id: file:interpro/panther/PTHR13254/PTHR13254-paint.tsv
    supporting_text: "PTHR13254\tPTN000327115\tGO:0002178\tC\tIBD\tfalse\tSGD:S000005470|UniProtKB:Q7Z5G4\ttaxon:\t20200808"
- assessed_term:
    id: GO:0031211
    label: endoplasmic reticulum palmitoyltransferase complex
  scope: UNRESOLVED
  scope_reason: >-
    The ER-specific term is sound for S. cerevisiae and close budding-yeast
    ERF4 orthologs, but the current PANTHER subfamilies do not isolate that
    clade: PTHR13254:SF0 also contains S. pombe erf4, whose direct
    localization evidence includes both ER and Golgi/cell-periphery calls.
    Treat the family-level scope as unresolved until PAINT can represent the
    narrower Saccharomycotina placement or a fission-yeast loss.
  supported_by:
  - reference_id: file:interpro/panther/PTHR13254/PTHR13254-paint.tsv
    supporting_text: "PTHR13254\tPTN001777135\tGO:0031211\tC\tIBD\tfalse\tSGD:S000005470\ttaxon:451864\t20170228"
- assessed_term:
    id: GO:0006612
    label: protein targeting to membrane
  scope: FAMILY_WIDE
  scope_reason: >-
    Ras-family protein palmitoylation by Erf4/GOLGA7 complexes promotes
    substrate membrane targeting in the characterized yeast and metazoan
    branches, so the parent process is safe at the family root.
  supported_by:
  - reference_id: file:interpro/panther/PTHR13254/PTHR13254-paint.tsv
    supporting_text: "PTHR13254\tPTN000327115\tGO:0006612\tP\tIBD\tfalse\tSGD:S000005470\ttaxon:\t20170228"
