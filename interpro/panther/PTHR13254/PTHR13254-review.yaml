  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The ER-specific term is valid for the S. cerevisiae seed and likely for
    close Saccharomycotina ERF4 orthologs. The Dikarya node also emits it to
    fission-yeast erf4, where the direct evidence is mixed: the 2006 ORFeome
    curation reports ER signal, but 2023 nmt1-driven C-terminal GFP fusions of
    Erf2-Erf4 appeared at the cell periphery and Golgi. An IRD at the
    fission-yeast leaf would preserve the Saccharomycotina ER call while
    stopping this over-specific term from reaching S. pombe.
