  name:
    name: DNA Repair Protein RAD50
    short: RAD50
  description:
  - text: The RAD50 family is involved in the maintenance of genome integrity through
      its central role in the repair of DNA double-strand breaks (DSBs). Members of
      the family are essential components of the MRN complex, which also includes
      MRE11 and NBS1, and is known for its single-stranded DNA endonuclease and 3'
      to 5' exonuclease activities. The RAD50 protein contributes to the complex by
      mediating ATP-binding, which is crucial for binding DNA ends and holding them
      in close proximity during the repair process. This facilitates the search for
      homologous sequences and stimulates the activity of DNA ligases, while also
      potentially restricting MRE11's nuclease activity to prevent excessive degradation.
      The RAD50 family also plays a role in telomere maintenance, meiosis, and DNA
      damage signaling, which is important for the activation of the ATM kinase. The
      characteristic zinc-hook domain of RAD50 is critical for the formation of a
      V-shaped homodimer, which is a distinctive structural feature of the family.
