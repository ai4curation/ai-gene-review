family_id: PANTHER:PTHR10133
family_name: DNA POLYMERASE I
preferred_name: Family A (Pol I-type) DNA polymerases
summary: >-
  The family A DNA polymerases: template-directed DNA polymerases built on the Pol I-type palm,
  fingers and thumb polymerase domain. It includes bacterial DNA polymerase I (PolA), which in
  most bacteria also carries an N-terminal 5'-3' exonuclease (5' nuclease) domain and a central
  3'-5' proofreading exonuclease domain and acts in Okazaki-fragment maturation and repair gap
  filling; the T7-type polymerases of bacteriophages; the plant organellar Pol I-like polymerases
  (POLIA and POLIB) that replicate and repair plastid and mitochondrial DNA; and the animal
  polymerases nu (POLN) and theta (POLQ). Pol theta adds an N-terminal helicase-like ATPase
  domain and is the polymerase of microhomology-mediated (theta-mediated) end joining. DNA-directed
  DNA polymerase activity is shared by all characterized members; the two exonuclease activities
  and the cellular pathways differ between lineages.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The cached reviewed inventory has 60 members: 52 in SF27 (DNA POLYMERASE NU), 7 in SF62 (DNA
  POLYMERASE THETA) and 1 in SF53 (DNA POLYMERASE I A, CHLOROPLASTIC_MITOCHONDRIAL). SF27 is
  itself mixed despite its name: 36 bacterial DNA polymerases I (including 5 thermostable Thermus
  enzymes), 11 phage polymerases (including T7 gene 5) and 5 eukaryotic proteins (human and mouse
  Pol nu, Arabidopsis POLIB and rice POLIA/POLIB). SF62 holds 5 eukaryotic Pol theta / TEBICHI
  proteins and 2 phage polymerases (T3 and Pseudomonas phage M6 gp62), so the nearly identical T3
  and T7 polymerases fall in different subfamilies. The polymerase activity is coherent across
  the family; the accessory activities are not: the 5'-3' exonuclease domain is a bacterial Pol I
  feature, and the 3'-5' proofreading domain is degenerate in some members (for example Thermus
  Pol I), so neither exonuclease term is safe at family or subfamily level.
