term_assessments:
- assessed_term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Holds for every subfamily with characterized members: SF27 (E. coli Pol I; human Pol nu; P.
    putida PolA conserves all checked polymerase active-site residues), SF62 (human Pol theta), and
    the plant organellar polymerases, which PAINT covers through the root IBD. This covers the
    family-level PANTHER:PTHR10133 grounding of the PolA annoton in the nucleotide excision repair
    module. Exonuclease-deficient members (Thermus Pol I) retain polymerase activity.
  supported_by:
  - reference_id: PMID:6262323
    supporting_text: E. coli DNA polymerase I was needed to fill the short gap left by DNA polymerase III holoenzyme,
      and to remove the primer and replace it with DNA.
  - reference_id: PMID:14576298
    supporting_text: Purified POLQ showed DNA polymerase activity on nicked double-stranded DNA and on a
      singly primed DNA template.
  - reference_id: PMID:16787914
    supporting_text: POLN has a processivity of DNA synthesis (1-100 nucleotides) similar to the exonuclease-deficient
      Klenow fragment of E. coli pol I, is inhibited by dideoxynucleotides, and resistant to aphidicolin.
  - reference_id: file:genes/PSEPK/polA/polA-bioinformatics/RESULTS.md
    supporting_text: 'Polymerase site: E. coli R668, D705, Y766, R841, N845, Q849, D882, E883 align to Q88RK6
      R655, D692, Y753, R828, N832, Q836, D869, E870.'
- assessed_term:
    id: GO:0008409
    label: 5'-3' exonuclease activity
  scope: UNRESOLVED
  scope_reason: >-
    The 5' nuclease domain is a bacterial Pol I feature (present in E. coli and P. putida PolA)
    and is absent from T7-type, Pol nu and Pol theta members, all of which share SF27 or SF62 with
    Pol I-type proteins, so no PANTHER family or subfamily id captures it. Ground it per protein
    or by the 5' nuclease domain signature instead.
  supported_by:
  - reference_id: PMID:9159471
    supporting_text: The 5'-3' exonuclease is known to be a structure-specific nuclease that cleaves a 5'
      displaced strand at the junction between single-stranded and duplex regions.
- assessed_term:
    id: GO:0008408
    label: 3'-5' exonuclease activity
  scope: UNRESOLVED
  scope_reason: >-
    The proofreading activity requires the intact Klenow-type exonuclease site (conserved in P.
    putida PolA) but the domain is degenerate in some SF27 members, so the activity is decided per
    protein rather than by subfamily. A residue-determined scope would need a curated exonuclease
    site in this review; that site is not yet recorded.
  supported_by:
  - reference_id: PMID:2832946
    supporting_text: Site-directed mutagenesis of the large fragment of DNA polymerase I (Klenow fragment) yielded
      two mutant proteins lacking 3',5'-exonuclease activity but having normal polymerase activity.
  - reference_id: file:genes/PSEPK/polA/polA-bioinformatics/RESULTS.md
    supporting_text: "3'-5' exonuclease site: E. coli D355, E357, D424, D501, Y497 align to Q88RK6 D339, E341,
      D408, D487, Y483."
