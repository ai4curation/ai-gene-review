notes: >-
  The PANTHER name of SF27 ("DNA POLYMERASE NU") is dominated by one eukaryotic member; bacterial
  Pol I is correctly classified there (E. coli P00582, B. subtilis O34996, P. putida Q88RK6 and
  phage T7 P00581 are all SF27 in the PANTHER member index). Modules should ground bacterial PolA
  at the family level for polymerase activity, as the NER module does, and should not use the SF27
  name as a description. The PAINT GO:0003887 IBA reaches E. coli Pol I; P. putida PolA gets the
  same terms electronically instead (GO:0003887 by GO_REF:0000120 and GO:0006302 by TreeGrafter,
  GO_REF:0000118, both via PTN002228076).
