family_id: PANTHER:PTHR10404
family_name: N-ACETYLATED-ALPHA-LINKED ACIDIC DIPEPTIDASE
preferred_name: M28B glutamate carboxypeptidase II / transferrin receptor superfamily
summary: >-
  Large eukaryotic family built on the M28 zinc-metallopeptidase fold (protease-associated
  domain + M28 peptidase domain + transferrin-receptor-like dimerisation domain). It spans
  functionally very different groups that share the fold but not the chemistry: (1) active
  binuclear-zinc carboxypeptidases - glutamate carboxypeptidase II (FOLH1/GCPII/PSMA, the
  best-characterized member, a membrane glutamate carboxypeptidase acting on N-acetyl-
  aspartyl-glutamate and folyl-poly-gamma-glutamates), NAALAD2, and the related ileal
  aminopeptidase NAALADL1; (2) the plant AMP1/LAMP1/VP8 clade of putative glutamate
  carboxypeptidases controlling meristem maintenance; (3) transferrin receptors TFRC/TFR2,
  which lost peptidase activity and repurposed the ectodomain fold for transferrin binding
  and endocytic iron import; (4) fungal TRE1/TRE2 and VPS70 trafficking-related proteins;
  and (5) the vertebrate pseudoenzyme NAALADL2, which retains the fold but has a degenerate
  active site (the GCPII catalytic-glutamate motif SW-DAEE is SW-GGTA in human NAALADL2)
  and no established molecular function. The family is therefore a showcase for both
  taxon-aware and activity-aware PAINT curation: catalytic terms are safe only on the
  clades that kept the catalytic machinery.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family lumps active carboxy/aminopeptidases (GCPII, NAALAD2, NAALADL1, plant AMP1
  clade) with lineages that demonstrably lost catalysis and evolved new roles - transferrin
  receptors (TFRC/TFR2: receptor/iron import), fungal TRE1/TRE2 (adaptor-like regulators of
  transporter ubiquitination), and the functionless pseudoenzyme NAALADL2 clade. No
  catalytic term is safe family-wide; even among the active members the chemistry differs
  (carboxypeptidase GCPII/NAALAD2 vs aminopeptidase NAALADL1).
reference_protein:
  id: UniProtKB:Q04609
  label: Glutamate carboxypeptidase 2
  gene_symbol: FOLH1
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR10404:SF32
    label: INACTIVE N-ACETYLATED-ALPHA-LINKED ACIDIC DIPEPTIDASE-LIKE PROTEIN 2
    clade_node_id: PANTHER:PTN002572070
    representative_members:
      - id: UniProtKB:Q58DX5
        label: Inactive N-acetylated-alpha-linked acidic dipeptidase-like protein 2
        gene_symbol: NAALADL2
        organism: Homo sapiens
        gene_review: genes/human/NAALADL2/NAALADL2-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      Pseudoenzyme clade (Euteleostomi; all 19 leaves under PTN002572070 in the PANTHER 19
      tree are NAALADL2 orthologs). UniProt CAUTION states it lacks the conserved
      zinc-binding and active sites; the gcpii_catalytic_glu_pair site below shows the
      catalytic Glu-Glu of GCPII is Thr-Ala in human NAALADL2. MEROPS classifies it as a
      non-peptidase homolog (M28.975). No catalytic term should descend into this clade.
  - subfamily_id: PANTHER:PTHR10404:SF26
    label: TRANSFERRIN RECEPTOR PROTEIN 1
    representative_members:
      - id: UniProtKB:P02786
        label: Transferrin receptor protein 1
        gene_symbol: TFRC
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      Transferrin receptor clade (with SF33/TFR2, under PTN008499203): non-peptidase
      homologs that repurposed the M28 ectodomain fold for transferrin binding and
      receptor-mediated endocytic iron import. PAINT correctly blocks the ancestral
      carboxypeptidase term here with an explicit IRD/NOT.
  - subfamily_id: PANTHER:PTHR10404:SF50
    label: AMINOPEPTIDASE NAALADL1
    representative_members:
      - id: UniProtKB:Q9UQQ1
        label: Aminopeptidase NAALADL1
        gene_symbol: NAALADL1
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      Active peptidase, but an aminopeptidase (UniProt: "Aminopeptidase NAALADL1", the
      human ileal brush-border aminopeptidase) rather than a carboxypeptidase, so the
      carboxypeptidase-specific term inherited from the deep IBD misstates its chemistry
      even though the zinc catalytic machinery is retained.

node_assessments:
  - node_id: PANTHER:PTN000044792
    asserted_term:
      id: GO:0004180
      label: carboxypeptidase activity
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20250902"
    seeds:
      - id: AGI_LocusCode:AT3G54720
        label: AMP1
        organism: Arabidopsis thaliana
      - id: MGI:MGI:1858193
        label: folate hydrolase 1
        gene_symbol: Folh1
        organism: Mus musculus
      - id: MGI:MGI:1919810
        label: N-acetylated alpha-linked acidic dipeptidase 2
        gene_symbol: Naalad2
        organism: Mus musculus
      - id: UniProtKB:Q04609
        label: Glutamate carboxypeptidase 2
        gene_symbol: FOLH1
        organism: Homo sapiens
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Deep placement at the eukaryote root is defensible for the peptidase backbone of the
      family (seeds span plants and mammals), but several derived clades no longer carry
      the activity and must not inherit the term. The transferrin receptor clade
      (PTN008499203) is already blocked by an explicit IRD (see below). The NAALADL2 clade
      (PTN002572070; verified from the live PANTHER 19 tree to descend from this node, via
      PTN000823181 > PTN000823186 > ... > PTN008305657) is a pseudoenzyme clade - human
      NAALADL2 has Thr/Ala in place of GCPII's catalytic E424/E425 (see
      gcpii_catalytic_glu_pair) and UniProt flags it "May be catalytically inactive" - yet
      no IRD row for it appears in the cached paint.tsv. Since human NAALADL2 in fact
      receives no IBA (PAN-GO reports 0 phylogenetic annotations), the clade is most
      likely silently tree-pruned in PAINT; an explicit IRD/NOT, as used for the TfR
      clade, would make the exclusion auditable and robust to re-propagation. Secondary
      caveats: NAALADL1 (SF50) is an aminopeptidase, so carboxypeptidase specificity is
      wrong for that branch even though it is catalytically active; and the fungal
      TRE1/TRE2 and VPS70 branches have trafficking roles with no demonstrated peptidase
      activity. Propagation of this term to human NAALADL2 would be a textbook
      pseudoenzyme over-annotation and must not happen.
