        label: Glutamate carboxypeptidase 2
        gene_symbol: FOLH1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Narrowly scoped to the amniote GCPII clade (PTN000044837 lies on FOLH1's lineage in
      the PANTHER tree and is not ancestral to NAALADL2 or the TfR clade). GCPII is a
      well-established type II plasma-membrane glycoprotein; correct placement and scope.
