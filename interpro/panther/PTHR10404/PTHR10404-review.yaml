review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Written to back the human NAALADL2 gene review (PAINT human no-IBA project). All node
  ids, terms, seeds and snapshot dates are verbatim from the cached PTHR10404-paint.tsv;
  tree topology facts (NAALADL2 clade = PTN002572070 under PTN000044792; sister
  NAALADL1 clade PTN002572036; FOLH1 under PTN000044837; TFRC/TFR2 under PTN008499203)
  were read from the live PANTHER 19 treeinfo service on 2026-09-04. Seed identities
  verified: MGI:1858193 = Folh1 and MGI:1919810 = Naalad2 (MGI), SGD:S000006097 = TRE1
  (SGD), AT3G54720 = AMP1 and AT5G19740 = LAMP1 (TAIR/UniProt Q7Y228). Residue positions
  in gcpii_catalytic_glu_pair are from the FOLH1 (Q04609, SV=1) UniProt feature table;
  the control positions were located by pairwise BLOSUM62 alignment (global and local
  parameterizations agree) against Q04609, in each control's own numbering, and the
  identities are machine-checked by family_residue_validator. Central finding: PAINT
  curation of this family exists and is largely careful (explicit IRD blocks the
  carboxypeptidase term for the TfR clade), and human NAALADL2's "no IBA" status is the
  biologically correct outcome - it descends from the GO:0004180 IBD node but is
  evidently excluded, most likely by silent tree pruning. The single recommendation is
  to convert that silent exclusion into an explicit IRD/NOT at PTN002572070 so the
  pseudoenzyme clade can never re-inherit the catalytic term. The human gene review
  (genes/human/NAALADL2) accordingly records no catalytic annotation and treats the
  gene as a pseudoenzyme of unknown molecular function.
