residue_sites:
  - site_id: gcpii_catalytic_glu_pair
    label: GCPII catalytic glutamate pair (SW-DAEE motif)
    description: >-
      Adjacent glutamates in the M28 domain of glutamate carboxypeptidase II: E424 is the
      catalytic residue (UniProt ACT_SITE "Nucleophile; for NAALADase activity") and E425
      is a ligand of the binuclear zinc centre (UniProt BINDING Zn(2+)). They sit in the
      conserved FASW-DAEE block, whose FxSW anchor aligns unambiguously across the family
      (TFRC: FASW-SAGD; NAALADL2: FCSW-GGTA), making this the crispest single marker of
      retained vs lost M28 catalysis in this family.
    anchor:
      id: UniProtKB:Q04609
      label: Glutamate carboxypeptidase 2
      gene_symbol: FOLH1
      organism: Homo sapiens
    anchor_sequence_version: 1
    residues:
      - position: 424
        expected: [E]
        role: catalytic glutamate (activates the zinc-bound water nucleophile)
      - position: 425
        expected: [E]
        role: zinc ligand (binuclear zinc centre)
    required_for:
      - term:
          id: GO:0004180
          label: carboxypeptidase activity
        strength: REQUIRED
        rationale: >-
          M28 catalysis runs through a binuclear zinc centre and a glutamate general base
          that activates the zinc-bridging water; losing either the catalytic glutamate
          (424) or the glutamate zinc ligand (425) abolishes hydrolysis. Both are UniProt
          feature-annotated in GCPII and conserved in the active paralog NAALAD2
          (E414/E415) but replaced in the non-peptidase members (TFRC G456/D457, NAALADL2
          T499/A500).
    site_source: UNIPROT_FEATURE
    positive_controls:
      - id: UniProtKB:Q9Y3Q0
        label: N-acetylated-alpha-linked acidic dipeptidase 2
        gene_symbol: NAALAD2
        organism: Homo sapiens
        control_position: 414
        control_residue: E
    negative_controls:
      - id: UniProtKB:Q58DX5
        label: Inactive N-acetylated-alpha-linked acidic dipeptidase-like protein 2
        gene_symbol: NAALADL2
        organism: Homo sapiens
        control_position: 499
        control_residue: T
      - id: UniProtKB:P02786
        label: Transferrin receptor protein 1
        gene_symbol: TFRC
        organism: Homo sapiens
        control_position: 456
        control_residue: G

term_assessments:
  - assessed_term:
      id: GO:0004180
      label: carboxypeptidase activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Safe only where the M28 catalytic machinery is retained AND the chemistry is
      carboxy-terminal: the GCPII/NAALAD2 clades and, on phenotype-plus-homology grounds,
      the plant AMP1 clade (AMP1 is a "putative glutamate carboxypeptidase"; direct
      biochemistry is thin, so the term rests on the PAINT seeds' MOD annotations). Not
      safe for: NAALADL2 (SF32; degenerate active site, see gcpii_catalytic_glu_pair),
      the transferrin receptors (SF26/SF33; explicit PAINT IRD already in place), the
      fungal TRE/VPS70 branches (no demonstrated peptidase activity), or NAALADL1 (SF50;
      active, but an aminopeptidase - the carboxypeptidase term misstates its
      specificity).
    applicable_subfamilies:
      - id: PANTHER:PTHR10404:SF36
        label: GLUTAMATE CARBOXYPEPTIDASE 2
      - id: PANTHER:PTHR10404:SF38
        label: N-ACETYLATED-ALPHA-LINKED ACIDIC DIPEPTIDASE 2
      - id: PANTHER:PTHR10404:SF75
        label: GLUTAMATE CARBOXYPEPTIDASE AMP1-RELATED
  - assessed_term:
      id: GO:0008233
      label: peptidase activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Even the generic peptidase term is unsafe family-wide: transferrin receptors,
      NAALADL2 and (absent biochemical evidence) the fungal TRE/VPS70 branches are
      non-peptidase homologs. It is safe for the catalytically intact peptidase
      subfamilies, including aminopeptidase NAALADL1, for which it is the honest
      chemistry-neutral choice.
    applicable_subfamilies:
      - id: PANTHER:PTHR10404:SF36
        label: GLUTAMATE CARBOXYPEPTIDASE 2
      - id: PANTHER:PTHR10404:SF38
        label: N-ACETYLATED-ALPHA-LINKED ACIDIC DIPEPTIDASE 2
      - id: PANTHER:PTHR10404:SF50
        label: AMINOPEPTIDASE NAALADL1
      - id: PANTHER:PTHR10404:SF75
        label: GLUTAMATE CARBOXYPEPTIDASE AMP1-RELATED

