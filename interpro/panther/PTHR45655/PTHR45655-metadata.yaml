  description:
  - text: The adenylyl cyclase class-4/guanylyl cyclase family is involved in the
      synthesis of cyclic GMP (cGMP) from GTP, a key second messenger in various signal
      transduction pathways. Members of this family mediate responses to nitric oxide
      (NO) by catalyzing the biosynthesis of cGMP, which plays a crucial role in physiological
      processes such as phototransduction, social feeding behavior, oxygen sensation,
      and avoidance of hyperoxia. In mammals, these enzymes are activated by NO in
      the presence of magnesium or manganese ions. In contrast, some members in C.
      elegans and Drosophila are regulated by molecular oxygen and are not NO-activated,
      indicating a divergence in regulatory mechanisms across species. The family
      contributes to a wide range of functions, including embryogenesis, sensitivity
      to environmental stimuli, and regulation of social and sensory behaviors.
