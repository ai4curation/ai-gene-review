residue_sites:
- site_id: region_ii_glu_his
  label: Region II glutamate-histidine pair of the Mur ligase superfamily
  description: >-
    Comparison of MurC, MurD, MurE and MurF across genera identified four regions of homology that are
    shared with the folyl-gamma-polyglutamate ligases, and two highly conserved residues in the second of
    them were tested directly in E. coli MurF: Glu158 and His188. Alanine substitution of either reduced
    specific activity by 200- to 4500-fold, which is the strongest residue-level evidence available for
    this family and is evidence about the shared amide-ligase chemistry rather than about substrate
    choice. Both residues are retained in the bacterial MurF members checked here (Pseudomonas putida
    Q88N80 at 160 and 190, Staphylococcus aureus Q2FWH4 at 164 and 194, Mycobacterium tuberculosis
    P9WJL0 at 187 and 217) and in Methanosarcina barkeri coenzyme F(430) synthetase Q46FL3 at 190 and
    230, which is consistent with the generic ligase term the family root asserts. For the two other
    archaeal members the global alignment to P11880 places a gap at the histidine position (and a serine
    at the glutamate position of Q8TJZ6), but those two proteins differ in length from P11880 by 48 and
    20 residues and the two Methanosarcina enzymes disagree with each other, so the alignment is not
    reliable enough there to assert a loss, and no negative control is declared. Positions in other
    proteins were obtained by global pairwise alignment (BLOSUM62) to P11880 and are stated in each
    protein's own numbering; the controls below make them re-checkable. Nothing in this site, or in any
    annotated feature of the family, distinguishes the MurF reaction from the coenzyme F(430) synthetase
    reaction or the meso-DAP tripeptide from the L-lysine one - that is the point of recording it.
  anchor:
    id: UniProtKB:P11880
    label: UDP-N-acetylmuramoyl-tripeptide--D-alanyl-D-alanine ligase
    gene_symbol: murF
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/murF/murF-ai-review.yaml
  anchor_sequence_version: 2
  site_source: LITERATURE
  residues:
  - position: 158
    expected:
    - E
    role: conserved region II carboxylate, essential for activity
  - position: 188
    expected:
    - H
    role: conserved region II histidine, essential for activity
  required_for:
  - term:
      id: GO:0016874
      label: ligase activity
    strength: CONTRIBUTES
    rationale: >-
      The Mur ligases and the folyl-gamma-polyglutamate ligases proceed through an ordered kinetic
      mechanism and form product via an acyl phosphate intermediate, and these two residues sit in the
      homology region that tracks with that catalytic function, so they support the ATP-dependent
      bond-forming step itself rather than recognition of any one substrate. Substituting either in
      E. coli MurF costs two to more than three orders of magnitude of specific activity, which is a
      material contribution; it is recorded as CONTRIBUTES rather than REQUIRED because activity was
      reduced rather than abolished and because no member of this family is independently verified to
      have lost ligase activity, so there is no negative control against which a REQUIRED claim could be
      held.
    supported_by:
    - reference_id: PMID:9166795
      supporting_text: Two highly conserved residues in region II were examined through site-directed
        mutagenesis of the murein D-alanyl-D-alanine-adding enzyme from Escherichia coli (murF; E158 and
        H188).
    - reference_id: PMID:9166795
      supporting_text: All mutations were highly detrimental to activity with enzyme specific activity
        reductions of 200-4500-fold, validating the critical nature of these residues.
    - reference_id: PMID:9166795
      supporting_text: both enzyme families proceed through an ordered kinetic mechanism and form product
        via an acyl phosphate intermediate
