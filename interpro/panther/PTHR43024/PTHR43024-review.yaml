family_id: PANTHER:PTHR43024
family_name: UDP-N-ACETYLMURAMOYL-TRIPEPTIDE--D-ALANYL-D-ALANINE LIGASE
preferred_name: MurF D-Ala-D-Ala-adding ligases, with an archaeal coenzyme F430 synthetase branch
summary: >-
  ATP-dependent Mur-ligase-superfamily enzymes grouped around MurF, the D-alanyl-D-alanine-adding
  enzyme that performs the last cytoplasmic step of peptidoglycan precursor synthesis: it joins the
  D-Ala-D-Ala dipeptide made by Ddl to UDP-N-acetylmuramoyl-tripeptide, giving the UDP-MurNAc-pentapeptide
  that MraY then transfers to undecaprenyl phosphate. Loss of the activity is lethal and diagnostic:
  thermosensitive murF mutants stop making murein and pile up UDP-MurNAc-tripeptide. Unlike MurE, MurF
  does not choose the third residue of the stem peptide - it receives whichever tripeptide its organism's
  MurE made - so the same enzyme is a meso-diaminopimelate ligase in Escherichia coli, the pseudomonads
  and the mycobacteria and an L-lysine-tripeptide ligase in Staphylococcus aureus and the other
  Bacillota, and the E. coli enzyme shows the matching relaxed third-position tolerance in vitro.
  Alongside the bacterial MurF enzymes the family holds a small archaeal branch of coenzyme F(430)
  synthetases (CfbE) from the methanogens, which share the fold and the ATP chemistry but make the
  nickel tetrapyrrole cofactor of methyl-coenzyme M reductase rather than a cell-wall precursor.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Two unrelated reactions sit in this family and the PANTHER subfamily axis separates neither of them.
  All 21 members of the cached inventory are assigned to the single subfamily PANTHER:PTHR43024:SF1,
  whose official name is the MurF name, yet three of those members are archaeal coenzyme F(430)
  synthetases (Methanosarcina barkeri Q46FL3, Methanocaldococcus jannaschii Q57706, Methanosarcina
  acetivorans Q8TJZ6) in organisms that have no peptidoglycan at all. Within the MurF members
  themselves a second, finer split runs through the family: GO offers only stem-specific ligase terms,
  GO:0008766 for the meso-diaminopimelate tripeptide and GO:0047480 for the L-lysine tripeptide, and
  they are siblings under GO:0016881 rather than parent and child, so a family or subfamily grant of
  either one is wrong for part of the clade. Only the generic ligase term is safe family-wide. What
  saves the PAINT rows here is not the subfamily axis but the taxon field: the three MurF-specific rows
  are confined to Bacteria, which keeps them off the archaeal branch.
