    to it is visible in the slice: the curator added the sibling L-lysine term GO:0047480 at the same
    node in 2026 with an S. aureus seed, so both forms now sit together and between them cover the clade.
    The useful recommendation is upstream of PAINT - GO should gain a stem-agnostic parent for the two
    sibling terms (they share only GO:0016881 acid-amino acid ligase activity today), after which a
    single row at this node would say exactly what is inherited. No pruning action is proposed, since no
    bacterial branch has lost the ligation.
