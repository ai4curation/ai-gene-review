notes: >-
  Member counts and subfamily assignments are from PTHR43024-entries.csv (all 21 members in SF1, of
  which three are the cfbE genes Q46FL3, Q57706 and Q8TJZ6); the family and subfamily names are
  interpro/panther/panther.obo verbatim. Residue positions in members other than P11880 were obtained by
  global pairwise alignment (BLOSUM62) to P11880 and are stated in each protein's own numbering, so the
  declared controls can be re-checked against the current UniProt sequences. Items for upstream
  attention. (1) GO has no stem-agnostic term for the MurF reaction: GO:0008766 (meso-DAP) and
  GO:0047480 (L-lysine) are siblings under GO:0016881, so every MurF annotation has to commit to a stem
  type that MurF itself does not select. The same gap exists for MraY (GO:0008963 against GO:0051992) and
  MurG (GO:0050511 against GO:0051991), and a single new parent for each pair would fix three families at
  once. (2) PANTHER files three archaeal coenzyme F(430) synthetases under the MurF subfamily name;
  InterPro's own LLM-generated description of the integrated entry IPR051046 does mention the F430 branch,
  so the heterogeneity is known there but is not visible in the PANTHER name. (3) No publication on
  coenzyme F(430) synthetase is cached in this repository, so this review asserts nothing about the CfbE
  mechanism; what it records is their membership, their organisms, their ATP-site and region II residues,
  and the fact that only the Bacteria taxon restriction keeps the peptidoglycan terms off them. (4) The
  dual-specificity measurement that would settle the two UNRESOLVED term assessments - purified MurF of a
  DAP-type and an L-lysine-type organism assayed against both tripeptides - is reported in the literature
  but is not in this repository's publication cache, so it is not quoted here.
