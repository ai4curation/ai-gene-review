- assessed_term:
    id: GO:0008766
    label: UDP-N-acetylmuramoylalanyl-D-glutamyl-2,6-diaminopimelate-D-alanyl-D-alanine ligase activity
  scope: UNRESOLVED
  scope_reason: >-
    No scope the schema offers is accurate, and saying so is more useful than forcing one. The term names
    the meso-diaminopimelate tripeptide, so it is the physiological activity of every member whose
    organism builds a meso-DAP stem peptide - which is most of this inventory, including E. coli,
    Pseudomonas, Mycobacterium, Treponema and Rickettsia - and not the physiological activity of the
    L-lysine-type Bacillota members such as S. aureus Q2FWH4. That division is not a subfamily, because
    the family has only one and it contains both; and it is not residue-determined, because MurF does
    not read the third residue at all - MurE selects it and MurF ligates D-Ala-D-Ala onto whatever
    tripeptide it is handed, which is why the characterised E. coli enzyme turns over three different
    third-position variants with very similar kinetics. The determination is made per member by the
    organism's stem-peptide chemistry, one level up from this family. The usable statements are therefore
    the clade-level one, PTN000566380 restricted to Bacteria with both sibling terms asserted together,
    and the per-gene one; and the real fix is a stem-agnostic parent term in GO.
  supported_by:
  - reference_id: PMID:8021219
    supporting_text: The kinetic parameters of the MurF synthetase catalyzing the addition of
      D-alanyl-D-alanine were very similar for the meso-A2pm-,L-allo-cystathionine-, and
      meso-lanthionine-containing UDP-MurNAc tripeptides.
  - reference_id: file:ECOLI/murF/murF-uniprot.txt
    supporting_text: UDP-N-acetyl-alpha-D-muramoyl-L-alanyl-gamma-D-glutamyl-meso-2,6-diaminopimelate
- assessed_term:
    id: GO:0047480
    label: UDP-N-acetylmuramoyl-tripeptide-D-alanyl-D-alanine ligase activity
  scope: UNRESOLVED
  scope_reason: >-
    The mirror image of the meso-DAP term and undecidable for the same reason, with one extra wrinkle
    that the two reviewed members of this family disagree about. GO:0047480 is defined on the L-lysine
    tripeptide, so it is the physiological reaction for the Bacillota members and not for the DAP-type
    ones; but because MurF tolerates variation at the third position, the L-lysine ligation is also a
    real in vitro capability of a DAP-type enzyme. The E. coli review therefore keeps the term as a
    genuine non-core activity while the P. putida review marks it over-annotated, and both readings are
    defensible on the published evidence. A family-level grant would endorse the first and a
    family-level denial the second, so neither is asserted here; the honest record is that the term is
    true of the clade as a capability and physiological only for part of it. A direct test of a
    DAP-type and an L-lysine-type MurF against both tripeptides, published and cached, would settle it,
    and a stem-agnostic parent term would make the question unnecessary for curation.
  supported_by:
  - reference_id: PMID:8021219
    supporting_text: The kinetic parameters of the MurF synthetase catalyzing the addition of
      D-alanyl-D-alanine were very similar for the meso-A2pm-,L-allo-cystathionine-, and
      meso-lanthionine-containing UDP-MurNAc tripeptides.
  - reference_id: file:genes/ECOLI/murF/murF-ai-review.yaml
    supporting_text: The L-Lys ligation is therefore a real in vitro activity, but E. coli never makes a
      Lys-tripeptide because MurE excludes L-lysine, so it is non-core.
