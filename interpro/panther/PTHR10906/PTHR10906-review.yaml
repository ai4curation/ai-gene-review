term_assessments:
  - assessed_term:
      id: GO:0008320
      label: protein transmembrane transporter activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The pore is formed by this subunit in every lineage; bacterial SecY is
      the enabling subunit of SecYEG, and SecE/SecG only contribute.
    supported_by:
      - reference_id: file:ECOLI/SecY/SecY-uniprot.txt
        supporting_text: The central subunit of the protein translocation channel SecYEG.
  - assessed_term:
      id: GO:0043952
      label: protein transport by the Sec complex
    scope: UNRESOLVED
    scope_reason: >-
      True for bacterial SecY (and B. subtilis SecY with its own SecA and SecEG),
      but the eukaryotic Sec61 and plastid members use different partner
      complexes, and the cached inventory provides no subfamily that separates
      the bacterial clade; the bacterial PAINT node PTN000097337 carries the
      bacterial-specific location and complex terms instead.
    supported_by:
      - reference_id: PMID:10559168
        supporting_text: Translocation of B. subtilis prePhoB, on the other hand, showed a strict dependence on the translocase subunit composition and occurred efficiently only with the homologous translocase.
notes: >-
  The bacterial post-translational Sec module uses this family for its channel
  step, with E. coli, B. subtilis and P. putida SecY as representatives. The
  eukaryotic and plastid nodes were assessed for placement only; their
  phenotype-derived plastid process rows are left UNRESOLVED.
