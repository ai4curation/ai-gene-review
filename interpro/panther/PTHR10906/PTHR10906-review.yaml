family_id: PANTHER:PTHR10906
family_name: SECY/SEC61-ALPHA FAMILY MEMBER
functional_coherence: MOSTLY_COHERENT
preferred_name: SecY/Sec61-alpha protein-conducting channel family
summary: >-
  PTHR10906 contains the pore-forming subunit of the universally conserved
  protein-conducting channel: SecY in bacteria and archaea, Sec61-alpha (and the
  yeast paralog Ssh1) in the eukaryotic endoplasmic reticulum, and the plastid
  SecY paralogs SCY1 (thylakoid) and SCY2 (inner envelope) of plants. Each
  member has ten transmembrane segments forming an hourglass pore with a
  hydrophobic constriction ring, a plug helix, and a lateral gate through which
  signal sequences and transmembrane segments exit into the lipid bilayer. The
  channel receives substrates cotranslationally from SRP-targeted ribosomes in
  all domains of life and post-translationally from SecA in bacteria and
  plastids or with Sec62/Sec63 in eukaryotes.
coherence_reason: >-
  The channel activity and signal-sequence binding are conserved across the
  family. Partners, compartment and the post-translational driving machinery
  differ between bacterial SecYEG, eukaryotic Sec61 and plastid SCY1/SCY2, so
  location, complex and route terms are clade-specific. The cached reviewed
  inventory gives no subfamily assignment for any member, so divergence is
  recorded through the PAINT nodes rather than subfamily ids.
