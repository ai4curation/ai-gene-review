  name:
    name: Notch signaling pathway
    short: Notch_signaling
  description:
  - text: The Notch signaling pathway family is involved in a wide range of developmental
      processes and cell fate determinations. Members of this family function as receptors
      for membrane-bound ligands, such as Jagged and Delta proteins, to regulate differentiation,
      proliferation, and apoptosis. Activation of Notch receptors leads to the release
      of the Notch intracellular domain, which forms a transcriptional activator complex
      and initiates gene expression. This family plays a crucial role in neurogenesis,
      angiogenesis, somitogenesis, and the development of various tissues including
      the vascular system, immune system, and muscles. It is also implicated in maintaining
      stem cell populations and in lateral inhibition, a process ensuring that neighboring
      cells do not adopt the same differentiation pathway.
