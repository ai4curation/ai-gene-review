  - assessed_term:
      id: GO:0045746
      label: negative regulation of Notch signaling pathway
    scope: UNRESOLVED
    scope_reason: >-
      Cis-inhibition is a real property of several Delta-type ligands (and the main
      activity of DLL3), but whether it should be a family- or clade-level IBA for
      ligands whose principal role is trans-activation is a curation-policy question.
      It must not descend to the receptor subfamilies SF505 and SF489 in any case.
