notes: >-
  Classification sources disagree for this family, and the disagreement explains
  the PTN002371879 puzzle. (1) PANTHER's own 19.0 sequence classification files
  (data.pantherdb.org sequence_classifications, which match the tree that PAINT
  annotates and are the source of interpro/panther/panther-members.tsv) place
  human DLL1 O00548 in PTHR24044:SF380 DELTA-LIKE PROTEIN 1, JAG1 in SF448, JAG2 and
  Drosophila Ser in SF421, Drosophila Dl in SF488, C. elegans apx-1 in SF502, C.
  elegans lin-12 in SF505, and NOTCH4 in SF489. (2) InterPro 110.0 / UniProt
  2026_03 DR PANTHER cross-references, computed by HMM scoring against the same
  release, instead put DLL1, DLL3, DLL4, DNER, Drosophila Dl, Drosophila N, C.
  elegans lin-12 and apx-1 in PTHR24049 (CRUMBS FAMILY MEMBER), JAG1, Drosophila Ser
  and zebrafish dlb in PTHR12916 (CYTOCHROME C OXIDASE POLYPEPTIDE VIC-2), and
  NOTCH4, C. elegans glp-1 and zebrafish notch1a in PTHR45836:SF23. For IBA
  purposes the tree/classification-file assignment is authoritative: PTN002371879
  and PTN001170801 are nodes of the PTHR24044 tree (PANTHER treeinfo API,
  family=PTHR24044) and do not occur in the PTHR45836 tree. The per-family PAINT
  slices are built from InterPro member lists, so these nodes also appear in the
  PTHR45836 and PTHR24049 slices. Tools that key on UniProt DR PANTHER (e.g. the
  family/gene cross-check) will not map DLL1, JAG1, Dl, Ser or lin-12 to this
  family. Notch receptors are scattered across at least five PANTHER families
  (PTHR45836 NOTCH1-3; PTHR24044 NOTCH4 and lin-12; PTHR22804:SF57 Drosophila N;
  PTHR24033:SF232 C. elegans glp-1; PTHR12916:SF9 zebrafish notch1a), so no single
  PANTHER family or node can anchor "Notch receptor" or "DSL ligand" across species.
  In C. elegans the DOS-motif co-ligand function supplied in cis by the EGF repeats
  of Delta/Serrate is provided in trans by separate secreted proteins (OSM-11,
  OSM-7, DOS-1 to DOS-3; OSM-11 is PTHR35015:SF1), which are not members of this
  family. The nematode DSL ligands are split between this family (SF502) and
  PTHR22669. Membership of representative proteins was read from PANTHER 19.0
  classification files for human, mouse, fly, worm and zebrafish; seeds were
  resolved through UniProt cross-references and those classification files.
