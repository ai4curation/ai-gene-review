family_id: PANTHER:PTHR24044
family_name: NOTCH LIGAND FAMILY MEMBER
preferred_name: Delta/Jagged DSL ligands plus heterogeneous multi-EGF-repeat proteins
summary: >-
  In the PANTHER 19.0 tree this family groups the canonical animal Notch ligands
  -- the Delta-like (DLL1, DLL3, DLL4, Drosophila Delta) and Jagged/Serrate (JAG1,
  JAG2, Drosophila Serrate) DSL-domain transmembrane proteins, plus the C. elegans
  DSL ligands APX-1, ARG-1 and DSL-4 -- with a set of other multi-EGF-repeat
  proteins: the non-canonical Notch ligand DNER, the Notch2 N-terminal-like
  proteins (NOTCH2NL), DLK2, Drosophila Weary and C. elegans EAT-20, SNED1,
  attractin-like 1, eyes-shut-like proteins, Drosophila Crumbs, and even two Notch
  receptors (vertebrate NOTCH4 and C. elegans LIN-12, with C. briggsae GLP-1).
  DSL ligands bind the EGF repeats of Notch receptors in trans and, after
  ubiquitin-dependent endocytosis in the signal-sending cell, exert the pulling
  force that exposes the receptor to ADAM and gamma-secretase cleavage; many
  also cis-inhibit Notch in the cells that express them. The non-ligand members
  share only the EGF-repeat architecture. The family is therefore a grouping by
  EGF-repeat similarity rather than an orthology group for one Notch role, and
  its membership is unstable between classification methods (see notes).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Canonical DSL ligands (SF380 DLL1, SF308 DLL3, SF320 DLL4, SF488 Drosophila
  Delta, SF418, SF421 JAGGED-2 incl. Drosophila Serrate, SF448 JAGGED-1, and the
  nematode SF502 APX-1/ARG-1/DSL-4) are the only groups with a conserved Notch
  ligand role. Other groups diverge: SF467 DNER is a DSL-less non-canonical ligand;
  SF507 NOTCH2NL is a human-specific truncated NOTCH2 paralog that binds receptors
  but is not a membrane ligand; SF489 NOTCH4 and SF505 LIN-12 are Notch RECEPTORS
  placed inside this ligand family by the tree; SF506 contains Drosophila Crumbs, an
  apical polarity protein; SF411 SNED1 is an extracellular-matrix protein; SF487
  ATTRACTIN-LIKE 1 and SF495 ATTRACTIN are attractin-family transmembrane proteins;
  SF417 Weary/EAT-20 are EGF-repeat proteins of mostly uncharacterised function. The
  PANTHER tree also places the nematode DSL ligands of SF502 in a clade with
  attractin-like proteins (PTN008602513) rather than with Delta/Jagged, and places
  LIN-12 inside the Delta clade (PTN001170801), which shows that topology inside
  this family follows EGF-repeat content and is not a reliable guide to receptor
  versus ligand role.
