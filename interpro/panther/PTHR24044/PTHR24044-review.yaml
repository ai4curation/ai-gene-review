node_assessments:
  - node_id: PANTHER:PTN002371879
    asserted_term:
      id: GO:0005112
      label: Notch binding
    paint_snapshot: "20240919"
    seeds:
      - {id: UniProtKB:O00548, label: DLL1, organism: Homo sapiens}
      - {id: UniProtKB:Q9NR61, label: DLL4, organism: Homo sapiens}
      - {id: UniProtKB:P78504, label: JAG1, organism: Homo sapiens}
      - {id: UniProtKB:Q9Y219, label: JAG2, organism: Homo sapiens}
      - {id: UniProtKB:P0DPK3, label: NOTCH2NLB, organism: Homo sapiens}
      - {id: FB:FBgn0000463, label: Dl, organism: Drosophila melanogaster}
      - {id: FB:FBgn0004197, label: Ser, organism: Drosophila melanogaster}
      - {id: FB:FBgn0051665, label: wry, organism: Drosophila melanogaster}
      - {id: MGI:MGI:104659, label: Dll1, organism: Mus musculus}
      - {id: MGI:MGI:107471, label: Notch4, organism: Mus musculus}
      - {id: MGI:MGI:2152889, label: Dner, organism: Mus musculus}
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      PTN002371879 is the Eumetazoa duplication node just below the root of the
      PTHR24044 tree (PANTHER treeinfo API, version 19); it spans 415 of the 426
      leaves, i.e. essentially the whole family. PAINT records no taxon for the row.
      Seeds come from four of the five major clades beneath it -- Delta/Jagged
      (PTN009076542), DNER (PTN009076572), NOTCH2NL/Weary (PTN009076580) and NOTCH4
      (PTN009076609) -- so placing the term at their common ancestor is the
      parsimonious PAINT choice, and the node is not simply too deep. But the term
      then descends to groups with no evidence and different functions: SNED1
      (SF411), attractin-like 1 (SF487), Drosophila Crumbs (SF506), DLK2 (SF423) and
      the uncharacterised nematode EGF proteins. It also descends to receptors (NOTCH4,
      LIN-12), for which Notch binding means a receptor-receptor interaction, not a
      ligand activity. The node is therefore NOT a ligand-specific anchor: a module
      that needs a Delta/Jagged ancestry anchor should cite the Delta clade
      PTN001170801 (with the LIN-12 caveat) or the unannotated DSL clade
      PTN009076542, not this node. This node is absent from the PTHR45836 tree; its
      rows in PTHR45836-paint.tsv and PTHR24049-paint.tsv come from InterPro's HMM
      classification of some descendants (NOTCH4, DLL1) into those families.
    affected_subfamilies:
      - {id: PANTHER:PTHR24044:SF411, label: "SUSHI, NIDOGEN AND EGF-LIKE DOMAIN-CONTAINING PROTEIN 1"}
      - {id: PANTHER:PTHR24044:SF487, label: ATTRACTIN-LIKE PROTEIN 1}
      - {id: PANTHER:PTHR24044:SF495, label: ATTRACTIN}
      - {id: PANTHER:PTHR24044:SF506, label: NEUROGENIC LOCUS NOTCH HOMOLOG PROTEIN 2-LIKE}
      - {id: PANTHER:PTHR24044:SF423, label: PROTEIN DELTA HOMOLOG 2}
      - {id: PANTHER:PTHR24044:SF490, label: EGF-LIKE DOMAIN-CONTAINING PROTEIN}
      - {id: PANTHER:PTHR24044:SF491, label: EGF-LIKE DOMAIN-CONTAINING PROTEIN}
  - node_id: PANTHER:PTN001170801
    asserted_term:
      id: GO:0007219
      label: Notch signaling pathway
    node_taxon: {id: NCBITaxon:33213, label: Bilateria}
    paint_snapshot: "20240919"
    seeds:
      - {id: UniProtKB:O00548, label: DLL1, organism: Homo sapiens}
      - {id: UniProtKB:Q9NR61, label: DLL4, organism: Homo sapiens}
      - {id: FB:FBgn0000463, label: Dl, organism: Drosophila melanogaster}
      - {id: MGI:MGI:104659, label: Dll1, organism: Mus musculus}
      - {id: WB:WBGene00003001, label: lin-12, organism: Caenorhabditis elegans}
      - {id: ZFIN:ZDB-GENE-000125-4, label: dlc, organism: Danio rerio}
    assessment: SOUND
    assessment_reason: >-
      PTN001170801 is the Bilateria Delta clade (82 leaves: SF380 DLL1, SF308 DLL3,
      SF320 DLL4, SF488 Drosophila Delta, SF418, the nematode SF501/SF504 EGF
      proteins, and SF505 LIN-12). Every characterised descendant -- Delta ligands and
      the LIN-12 receptor -- participates in Notch signalling, so the process term is
      correct for all of them even though LIN-12's placement in a ligand clade is a
      tree artifact. Only the uncharacterised nematode C02B10.3-type proteins are
      inferred without direct support.
  - node_id: PANTHER:PTN001170801
    asserted_term:
      id: GO:0005886
      label: plasma membrane
    node_taxon: {id: NCBITaxon:33213, label: Bilateria}
    paint_snapshot: "20260529"
    assessment: SOUND
    assessment_reason: >-
      All Delta-clade members and LIN-12 are single-pass type I transmembrane
      proteins that act at the cell surface; DLL3 is mostly Golgi-retained in
      mammals but still carries a plasma-membrane pool.
  - node_id: PANTHER:PTN001170801
    asserted_term:
      id: GO:0045746
      label: negative regulation of Notch signaling pathway
    node_taxon: {id: NCBITaxon:33213, label: Bilateria}
    paint_snapshot: "20230406"
    seeds:
      - {id: MGI:MGI:1859388, label: Dll4, organism: Mus musculus}
      - {id: RGD:70953, label: Dll3, organism: Rattus norvegicus}
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Cis-inhibition of Notch by co-expressed DSL ligands is a conserved property of
      Delta-type ligands, so the term is defensible for the ligand subfamilies.
      However, the node also contains the LIN-12 receptor subfamily (SF505), which
      inherits "negative regulation of Notch signaling pathway" purely because of
      the anomalous placement of LIN-12 inside the Delta clade. That branch needs an
      IRD/NOT. The term also foregrounds a secondary activity of the ligands: their
      primary role is trans-activation, which this term does not describe.
    affected_subfamilies:
      - {id: PANTHER:PTHR24044:SF505, label: PROTEIN LIN-12}
