review_date: '2026-11-14'
notes: >-
  PANTHER 19.0 classification and tree disagree for this family, and the disagreement shapes
  everything in its PAINT slice. The family's 58 reviewed entries come from InterPro's HMM
  classification, which UniProt's PANTHER cross-references repeat (for KISS1R, "DR PANTHER;
  PTHR45695:SF23; GALANIN-LIKE G-PROTEIN COUPLED RECEPTOR NPR-9"). Of those 58, only the GPR151,
  BRS3, GRPR, NMBR, CCHamide receptor and NPR-9 entries are leaves of PANTHER's PTHR45695 tree
  (treeinfo service, 306 leaves). The mammalian galanin, kisspeptin, orexin, QRFP and FFAR4
  receptors, GPR19 and NPR-15 are leaves of PTHR24230, PTHR24241, PTHR24243 and PTHR24228, and
  eight entries (amphibian BB4, the guinea-pig and sheep BRS3 and crab-eating macaque FFAR4
  orthologs, tilapia gpr54, the Bombyx and Aedes receptors and HHV-6 U51) are leaves of none of
  the five trees checked. The PAINT slice is
  built by collecting the nodes cited by members' leaf IBAs, so 11 of its 13 nodes (24 of 28
  rows) belong to those other trees, as PANTHER's own TreeGrafter node table confirms; only
  PTN001203169 (the PTHR45695 root) and PTN000663291 are PTHR45695 nodes. The node-level
  validator accepts all 13 because it reads family membership from the slice itself. The same
  disagreement is why `just paint-losses` reports "Q91V45 is not a leaf of this tree" for mouse
  Kiss1r and "Q969F8 is not a leaf of this tree" for human KISS1R: it takes the family from the
  UniProt cross-reference and looks for the protein in the PTHR45695 tree, where it is absent,
  and it then prints "No IRD or IKR loss on this gene's lineage" even though it checked nothing.
  Checked directly against the PTHR24230 tree, the human and mouse KISS1R lineages carry only
  five PAINT gains (plasma membrane, G protein-coupled peptide receptor
  activity and neuropeptide signaling pathway at PTN000660491; neuropeptide receptor activity
  and positive regulation of hormone secretion at PTN009086039) and no IRD or IKR, so both
  campaign gene reviews' IBA judgements stand. The two PTHR24230 problems found here (galanin
  receptor activity placed too deep at PTN002796297, and peptide-receptor and
  neuropeptide-signalling terms at the PTHR24230 root inherited by the cysteinyl leukotriene,
  leukotriene B4 and GPR84 receptors, as their IBA rows in QuickGO on 2026-11-14 show) are
  recorded as node verdicts without proposed_action,
  because their target nodes lie outside this family's tree; they belong in a PTHR24230 family
  review, which does not exist yet. The tree placements cited here are reproducible with
  `uv run python interpro/panther/PTHR45695/tree_check.py`.
