- subfamily_id: PANTHER:PTHR45695:SF23
  label: GALANIN-LIKE G-PROTEIN COUPLED RECEPTOR NPR-9
  description: >-
    Mixed subfamily of galanin-receptor-like neuropeptide receptors. In PANTHER's tree its 31
    leaves are invertebrate receptors: C. elegans NPR-9 (an allatostatin/galanin-like receptor
    acting in the AIB interneurons to restrain local search), and receptors from amphioxus, sea
    urchin, leech and mosquito. InterPro and UniProt also assign here the silkworm A-type
    allatostatin receptor, the tilapia kisspeptin receptor and the mammalian kisspeptin
    receptors KISS1R/Kiss1r. The mammalian kisspeptin receptors are leaves of PTHR24230:SF78
    (KISS-1 RECEPTOR) in PANTHER's tree, below PAINT node PTN009086039, and take their IBA
    annotations from there. KISS1R binds the kisspeptin RF-amide neuropeptides derived from
    KISS1 and signals through Gq/11 and phospholipase C; GO has no kisspeptin-specific receptor
    term, so neuropeptide receptor activity is its most specific receptor term.
