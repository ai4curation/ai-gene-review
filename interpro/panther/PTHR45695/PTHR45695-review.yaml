family_id: PANTHER:PTHR45695
family_name: LEUCOKININ RECEPTOR-RELATED
preferred_name: >-
  Leucokinin, bombesin-like and CCHamide receptors and related class A neuropeptide GPCRs
  (InterPro classification also assigns galanin, kisspeptin, orexin, QRFP and FFAR4 receptors
  here)
summary: >-
  PTHR45695 is a family of class A (rhodopsin-like) seven-transmembrane G protein-coupled
  receptors, most of whose characterized members are receptors for neuropeptides. PANTHER's own
  phylogenetic tree for the family (306 reference-proteome leaves, root node PTN001203169)
  contains the vertebrate bombesin-like peptide receptors (the neuromedin B receptor NMBR, the
  gastrin-releasing peptide receptor GRPR and the orphan bombesin receptor subtype 3 BRS3)
  together with their insect counterparts, the CCHamide-1 and CCHamide-2 receptors; the
  arthropod leucokinin receptors after which the family is named, with a large cnidarian
  expansion in the same subfamily; the orphan vertebrate receptor GPR151; the C. elegans
  allatostatin/galanin-like receptor NPR-9 and related invertebrate receptors; and several small
  subfamilies of non-mammalian galanin-, orexin-, QRFP-, FFAR4- and GnRH-receptor-like sequences.
  InterPro's HMM-based classification, which UniProt reflects in its PANTHER cross-references,
  additionally places in this family the mammalian galanin receptors GALR1, GALR2 and GALR3, the
  kisspeptin receptor KISS1R (GPR54), the orexin receptors HCRTR1 and HCRTR2, the QRFP receptor
  QRFPR, the long-chain fatty acid receptor FFAR4 (GPR120), the orphan receptor GPR19,
  C. elegans NPR-15, insect A-type allatostatin and ACP receptors, and the human herpesvirus 6
  chemokine-receptor homolog U51. None of the mammalian receptors in that list is a leaf of the
  PTHR45695 tree: PANTHER's trees place them in PTHR24230, PTHR24241, PTHR24243 and PTHR24228,
  and their IBA annotations descend from nodes of those trees. The two classifications also
  disagree in the other direction: Drosophila opsin Rh2 and rodent Pgr15l are tree members of
  PTHR45695 subfamilies SF15 and SF32 but are assigned by UniProt to other families. The shared
  function is G protein-coupled receptor activity at the plasma membrane. Ligand specificity is
  set at the subfamily level: bombesin-family peptides, CCHamides, leucokinins, galanin,
  kisspeptins, A-type allatostatins, orexins, QRFP and the insect ACP peptide for the
  characterized peptide receptors, long-chain fatty acids for FFAR4 and light for opsin Rh2.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Every member is a rhodopsin-like GPCR, so G protein-coupled receptor activity (GO:0004930), the
  G protein-coupled receptor signaling pathway (GO:0007186) and plasma-membrane location
  (GO:0005886) are safe across the family, and PAINT asserts exactly those three at the family
  root PTN001203169. Nothing more specific is safe family-wide. Most subfamilies are peptide
  receptors, but each recognizes a different peptide: bombesin-family peptides for SF6, SF7 and
  SF8, CCHamides for SF24 and SF26, leucokinin for the tree members of SF9, galanin for SF25,
  SF33 and SF35, kisspeptins and A-type allatostatins for different members of SF23, orexins for
  SF32, QRFP for SF20 and the ACP peptide for SF22. Other groups do not bind peptides at all or
  have no known ligand: FFAR4 (SF37) is a long-chain fatty acid receptor; SF15 is named for, and
  in the tree contains, the Drosophila visual opsin Rh2; the HHV-6 U51 member of SF9 binds
  chemokines; and GPR151 (SF1), mammalian BRS3 (SF6) and GPR19 (SF9) are orphans. The one
  specific molecular-function assertion PAINT makes within this family's own tree, neuropeptide
  receptor activity at PTN000663291, is confined to the bombesin and CCHamide receptor clade,
  which is where the experimental evidence lies.
