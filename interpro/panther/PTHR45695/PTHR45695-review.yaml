- subfamily_id: PANTHER:PTHR45695:SF9
  label: LEUCOKININ RECEPTOR
  description: >-
    The family's namesake subfamily. In PANTHER's tree its 96 leaves include the arthropod
    leucokinin receptors, among them the Drosophila leucokinin receptor Lkr (UniProtKB:Q9VRM0,
    gene CG10626), which responds to drosokinin through intracellular calcium, and mosquito and
    tick orthologs, together with amphioxus receptors and a large set of uncharacterized
    Nematostella receptors. The reviewed proteins InterPro and
    UniProt assign to SF9 are different: human GPR19, an orphan receptor proposed as an adropin
    receptor, which is a leaf of PTHR24243:SF224 in PANTHER's tree, and the human herpesvirus 6A
    U51 protein, a viral chemokine-receptor homolog.
  representative_members:
  - id: UniProtKB:Q15760
    label: Probable G protein-coupled receptor 19
    gene_symbol: GPR19
    organism: Homo sapiens (Human)
  - id: UniProtKB:P52382
    label: G protein-coupled receptor homolog U51
    gene_symbol: U51
    organism: Human herpesvirus 6A (strain Uganda-1102)
  diverged_from_family: true
  divergence_description: >-
    The subfamily's tree members are neuropeptide (leucokinin) receptors, but neither reviewed
    member assigned to it by InterPro shares that function. GPR19 has no established ligand
    (adropin is a candidate from a knockdown study), and U51 is a constitutively active viral
    GPCR whose reported ligands are CC chemokines, not neuropeptides. Neuropeptide-receptor terms
    should not be transferred to these members on the strength of the subfamily name.
  supported_by:
  - reference_id: PMID:12163486
    supporting_text: >-
      only one gene (CG10626) encoded a protein that responded to Drosokinin.
  - reference_id: PMID:26739651
    supporting_text: >-
      identify a potential adropin receptor, the orphan G protein-coupled receptor, GPR19.
  - reference_id: PMID:16332987
    supporting_text: >-
      The human herpes virus 6 (HHV-6)-encoded chemokine receptor U51 constitutively activates
      phospholipase C (PLC)
  - reference_id: PMID:16140767
    supporting_text: >-
      HHV-6A U51 has been reported to bind to CC chemokines including RANTES, but the biological
      function of U51 remains uncertain.
