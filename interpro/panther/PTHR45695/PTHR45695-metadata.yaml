  name:
    name: G-protein Coupled Receptor 1
    short: GPCR1
  description:
  - text: This family of proteins includes G-protein coupled receptors (GPCRs) that
      are involved in various physiological processes such as sensory perception,
      regulation of food intake, modulation of sleep and arousal, and reproductive
      functions. They respond to a range of ligands, including neuropeptides, hormones,
      and other signaling molecules, triggering intracellular signaling cascades that
      often result in changes in cytoplasmic calcium levels or inhibition of adenylate
      cyclase activity. Some members are involved in the perception of itch and pain,
      while others contribute to the regulation of respiratory rhythms such as sighing
      and sneezing. Additionally, certain receptors within this family play roles
      in the immune response to viral infections and in cell proliferation.
