family_id: PANTHER:PTHR42752
family_name: IMIDAZOLONEPROPIONASE
preferred_name: Imidazolonepropionase (HutI/AMDHD1) family
summary: >-
  Family of zinc- or iron-dependent amidohydrolase-superfamily enzymes that
  hydrolyse the imidazolone ring of 4-imidazolone-5-propanoate to
  N-formimidoyl-L-glutamate (imidazolonepropionase, EC 3.5.2.7), the third
  step of histidine catabolism and the branch point for terminal FIGLU
  processing. Members include bacterial HutI (Pseudomonas aeruginosa and P.
  putida HutI, Bacillus subtilis HutI) and the animal ortholog AMDHD1. All
  inventoried members fall in one PANTHER subfamily (SF1,
  IMIDAZOLONEPROPIONASE-RELATED), which also contains a few fused or
  substrate-variant members, such as a Brucella HutI-HutH fusion and an
  N(tau)-methylimidazolonepropionase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Nearly all members are named imidazolonepropionase or probable
  imidazolonepropionase, and the single PAINT node at the family root carries
  the activity and the process, seeded by P. aeruginosa HutI, whose mutant
  phenotype places it in histidine degradation. Exceptions are rare and
  recognizable by name: an N(tau)-methylimidazolonepropionase that acts on
  the methylated analog in a methylhistidine-degradation context, and a
  bifunctional HutI-HutH fusion that carries the activity plus histidase. The
  animal AMDHD1 activity is inferred from orthology; a human study reports an
  additional non-catalytic SMAD4-stabilizing role.
