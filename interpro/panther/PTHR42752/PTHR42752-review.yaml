    organism: Pseudomonas aeruginosa PAO1
  assessment: SOUND
  assessment_reason: >-
    Placement at the family root is consistent with a family whose members
    are almost all imidazolonepropionases and share the HutI-specific HAMAP
    and NCBIfam signatures. The seed's evidence is genetic and physiological
    (the P. aeruginosa histidine-degrading pathway), and the B. subtilis and
    P. putida orthologs lie in hut operons. A single well-grounded seed is
    adequate here. The N(tau)-methyl variant is a substrate-analog exception
    noted in the term assessment, not a reason to move the node.
