node_assessments:
- node_id: PANTHER:PTN008510054
  asserted_term:
    id: GO:0016274
    label: protein-arginine N-methyltransferase activity
  evidence: IBD
  negated: false
  paint_snapshot: '20260528'
  assessment: SOUND
  assessment_reason: >-
    The root protein-arginine N-methyltransferase gain is appropriate for the
    reviewed human PRMT branches: CARM1, PRMT1, PRMT2 and PRMT3 all retain
    type-I PRMT catalytic activity, even though PRMT2 is much weaker than PRMT1
    on histone H4 in vitro.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11006/PTHR11006-paint.tsv
    supporting_text: "PTHR11006\tPTN008510054\tGO:0016274\tF\tIBD\tfalse"
  - reference_id: file:human/PRMT3/PRMT3-uniprot.txt
    supporting_text: Protein-arginine N-methyltransferase that catalyzes both the monomethylation and asymmetric dimethylation
- node_id: PANTHER:PTN008510054
  asserted_term:
    id: GO:0042054
    label: histone methyltransferase activity
  evidence: IBD
  negated: false
  paint_snapshot: '20250902'
  assessment: TOO_DEEP
  assessment_reason: >-
    Histone methylation is not a safe root assertion for all PRMT-domain
    descendants. It is core for CARM1 and PRMT1 and a regulated non-core branch
    for PRMT3, but PRMT2 has only weak in vitro H4 activity and should not inherit
    a family-root histone methyltransferase row from this node.
  proposed_action:
    paint_action: REMOVE_IBD
  supported_by:
  - reference_id: file:interpro/panther/PTHR11006/PTHR11006-paint.tsv
    supporting_text: "PTHR11006\tPTN008510054\tGO:0042054\tF\tIBD\tfalse"
  - reference_id: PMID:19405910
    supporting_text: PRMT2 activity is substantially lower than PRMT1 in vitro
- node_id: PANTHER:PTN008510054
  asserted_term:
    id: GO:0006338
    label: chromatin remodeling
  evidence: IBD
  negated: false
  paint_snapshot: '20250902'
  assessment: TOO_DEEP
  assessment_reason: >-
    PRMT-mediated chromatin regulation applies strongly to CARM1 and PRMT1 and
    conditionally to nuclear PRMT3, but it is unsafe at the PRMT family root
    because PRMT branches such as PRMT2 do not have a direct conserved chromatin
    remodeling activity.
  proposed_action:
    paint_action: REMOVE_IBD
  supported_by:
  - reference_id: file:interpro/panther/PTHR11006/PTHR11006-paint.tsv
    supporting_text: "PTHR11006\tPTN008510054\tGO:0006338\tP\tIBD\tfalse"
  - reference_id: file:human/PRMT3/PRMT3-uniprot.txt
    supporting_text: Mediates asymmetric arginine dimethylation of histone H4 'Arg-3'
- node_id: PANTHER:PTN008510054
  asserted_term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence: IBD
  negated: false
  paint_snapshot: '20260528'
  assessment: TOO_DEEP
  assessment_reason: >-
    DNA-templated transcriptional regulation is a downstream output of several
    reviewed PRMTs, but the evidence does not support placing this biological
    process at the root of the type-I PRMT family rather than on specific
    chromatin/coactivator branches.
  proposed_action:
    paint_action: REMOVE_IBD
  supported_by:
  - reference_id: file:interpro/panther/PTHR11006/PTHR11006-paint.tsv
    supporting_text: "PTHR11006\tPTN008510054\tGO:0006355\tP\tIBD\tfalse"
  - reference_id: file:human/CARM1/CARM1-uniprot.txt
    supporting_text: leading to activation of transcription via chromatin remodeling
- node_id: PANTHER:PTN000109641
  asserted_term:
    id: GO:0070611
    label: histone H3R2 methyltransferase activity
  evidence: IBD
  negated: false
  paint_snapshot: '20231128'
  assessment: WRONG_NODE
  assessment_reason: >-
    H3R2 methylation should not be propagated through this CARM1-containing node.
    Reactome records that CARM1 can methylate H3R2 in vitro, but the direct
    PRMT6 paper establishes PRMT6 as the enzyme that controls global H3R2me2a
    in vivo and Reactome describes PRMT6 as the major cellular H3R2 enzyme.
  proposed_action:
    paint_action: REMOVE_IBD
  supported_by:
  - reference_id: file:interpro/panther/PTHR11006/PTHR11006-paint.tsv
    supporting_text: "PTHR11006\tPTN000109641\tGO:0070611\tF\tIBD\tfalse"
  - reference_id: Reactome:R-HSA-5205824
    supporting_text: PRMT6 predominantly asymmetrically dimethylates H3R2 and is the major cellular H3R2 methyltransferase.
- node_id: PANTHER:PTN000865076
