family_id: PANTHER:PTHR11006
family_name: PROTEIN ARGININE N-METHYLTRANSFERASE
preferred_name: Type-I PRMT split, CARM1-PRMT3
summary: >-
  PTHR11006 contains type-I, type-II and type-III protein arginine methyltransferases.
  This review covers the first human split in this family: CARM1/PRMT4, PRMT1,
  PRMT2 and PRMT3. The four reviewed proteins all retain the PRMT catalytic fold,
  but their core substrates differ: CARM1 preferentially methylates H3R17 in
  promoter chromatin, PRMT1 is the major H4R3 and broad non-histone type-I enzyme,
  PRMT2 has weak methyltransferase activity and nuclear-receptor/NF-kappaB
  coregulatory roles, and PRMT3 acts mainly on cytosolic RPS2 with a regulated
  ZNF200-dependent nuclear H4R3 branch.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Protein-arginine N-methyltransferase activity is the coherent family-level
  assertion for this slice. Histone methyltransferase, chromatin remodeling and
  transcriptional-regulation terms are safe for CARM1 and PRMT1 and have
  context-specific support in PRMT3, but they are not a sound root placement for
  every type-I PRMT branch.
