family_id: PANTHER:PTHR42884
family_name: PROPROTEIN CONVERTASE SUBTILISIN/KEXIN-RELATED
summary: Subtilisin/kexin-related serine proteases process protein precursors in diverse organisms. Animal
  proprotein convertases include enzymes that mature peptide hormones; fungal and bacterial members act
  in other proteolytic settings. Substrate recognition, maturation and trafficking distinguish their biological
  roles.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory includes PC1/PC2, furins, fungal Kexin and bacterial Mycosin/NalP proteins.
  Proteolytic processing is coherent, but neither animal hormone substrates nor dibasic-site specificity
  is universal across these branches. In Drosophila, cell-specific rescue and mass spectrometry directly
  connect amon to mature AKH production (PMID:20523747). The separate disputed Slit substrate does not
  undermine this established hormone-processing function.
