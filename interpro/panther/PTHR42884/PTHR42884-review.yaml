    id: NCBITaxon:33213
    label: Bilateria
  assessment: LOSS_CONTRADICTED
  assessment_reason: >-
    PTN001647685 is the PC1/3 (PCSK1) orthogroup (29 leaves, all SF14). PAINT placed the TGN
    IBD on the opisthokont node PTN000082856 on 2024-11-21, seeded by furin (mouse
    MGI:97513, human P09958), yeast KEX2 (SGD:S000005182), rat Pcsk5 (RGD:620326) and rat Pcsk1
    (RGD:3272). On the same date it placed TGN IRDs on this node and on several other
    bilaterian and vertebrate convertase nodes. A matching Golgi-membrane pattern dates from
    2024-02-12. Here the IBDs that remain are extracellular region and neuron projection.
    This reads as an intent to keep the TGN only for the constitutive, TGN-resident
    convertases (furin, KEX2), treating PC1/3 as a regulated-secretory-granule enzyme. The
    biology is right that PC1/3 is mainly a dense-core-granule and secreted enzyme. But GO
    located_in records where a product is observed, not only where it resides, and PC1/3 is
    observed in the TGN, where it is sorted into the regulated pathway. Rat Pcsk1 is itself
    a seed of the TGN IBD and sits inside this clade, so the IRD negates its own seed. The
    source is the rat-brain immunolocalization (PMID:10906712, abstract-only), whose abstract
    explicitly places PC1 in the TGN. The IRD should be retracted, or the PAINT curator
    should say why a seed's own localization is excluded. Confidence is moderate because
    the disagreement is partly about term scope (transit compartment versus residence).
  supported_by:
  - reference_id: PMID:10906712
    supporting_text: PC1 and PC2 immunoreactive signals were localized within the trans-Golgi network
      and nerve terminals, in keeping with the biosynthetic pathways of neuropeptides.
  - reference_id: PMID:10906712
    supporting_text: both convertases are efficiently targeted to the neuronal regulated secretory
      pathway
