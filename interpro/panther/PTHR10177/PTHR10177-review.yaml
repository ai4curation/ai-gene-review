family_id: PANTHER:PTHR10177
family_name: CYCLINS
summary: Cyclins are regulatory proteins that control cyclin-dependent kinases. Different cyclin groups
  specify cell-cycle transitions and other transcriptional or regulatory programs through distinct partners
  and expression patterns.
functional_coherence: HETEROGENEOUS
coherence_reason: Fly CycA contributes to mitotic cell-cycle progression and cyclin-mediated CDK substrate
  recognition (PMID:2564316; PMID:17431409). The native CycA-PC sequence differs from the reviewed 491-residue
  form by only Gln66 and retains the entire cyclin domain, supporting kinase regulation for this isoform.
  The broader family includes cyclins with distinct partners and regulatory outputs; kinase regulation
  is not intrinsic kinase catalysis. The complete set with direct CDK-regulator activity is unresolved
  beyond these positively supported branches.
