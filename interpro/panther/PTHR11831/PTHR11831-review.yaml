  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    PTN000216482 is the IMP3 clade (112 leaves, SF1), which carries PAINT IBDs for the Mpp10 complex,
    the small-subunit processome and rRNA processing. IMP3 is a U3 snoRNP and processome component of
    pre-rRNA processing, not a subunit of the mature ribosome. The conflicting Arabidopsis At5g15750 row
    is a CAFA-curated IDA from a mass-spectrometry survey of purified cytosolic ribosomes (PMID:17934214),
    where co-purifying biogenesis factors are expected and detection does not show a structural role.
    The loss is supported.
