family_id: PANTHER:PTHR11831
family_name: 30S 40S RIBOSOMAL PROTEIN
preferred_name: Ribosomal protein uS4 family and IMP3
summary: >-
  PTHR11831 contains ribosomal protein uS4 (eukaryotic RPS9) and the paralogous IMP3, a component of the
  U3 snoRNP and small-subunit processome that acts in pre-rRNA processing.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  uS4 is a ribosomal structural protein; IMP3 is a ribosome-biogenesis factor that is not part of the
  mature ribosome.
