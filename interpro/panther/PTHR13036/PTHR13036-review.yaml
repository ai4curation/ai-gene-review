preferred_name: ALG1 chitobiosyldiphosphodolichol beta-mannosyltransferase family
summary: >-
  ALG1 adds the first, beta-1,4-linked mannose to GlcNAc2-PP-dolichol with GDP-mannose on the cytoplasmic
  face of the ER (S. cerevisiae ALG1, S. pombe alg1, human ALG1). Human ALG1L2 forms a separate,
  uncharacterized subfamily.
functional_coherence: MOSTLY_COHERENT
coherence_reason: ALG1 activity holds for SF0 and SF1; ALG1L2 (SF2) is uncharacterized.
