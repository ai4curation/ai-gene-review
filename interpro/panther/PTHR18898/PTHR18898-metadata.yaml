  name:
    name: Nuclear Pore Complex-Associated Protein
    short: NPC-Associated_Protein
  description:
  - text: This family of proteins is involved in various aspects of nuclear architecture
      and function. They are components of the nuclear pore complex (NPC), which is
      essential for nucleocytoplasmic transport of proteins and mRNAs. These proteins
      function as scaffolding elements within the NPC and play roles in chromatin
      compartmentalization, mRNA quality control, and retention of unspliced mRNAs.
      They are implicated in nuclear export of certain mRNAs and may regulate nuclear
      protein export. Additionally, they participate in the spindle-assembly checkpoint
      during mitosis, ensuring proper chromosome segregation. Some family members
      are involved in the structural organization of perinuclear chromatin and may
      interact with spindle assembly checkpoint proteins. Others have roles in telomere
      length regulation and repair of double-strand breaks. The family also includes
      proteins that function in the regulation of gene expression and maintenance
      of stem cell division asymmetry.
