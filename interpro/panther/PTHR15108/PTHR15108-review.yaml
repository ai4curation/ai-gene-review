family_id: PANTHER:PTHR15108
family_name: N-ACYLGLUCOSAMINE-2-EPIMERASE
preferred_name: AGE-family (alpha/alpha)6-barrel sugar epimerases and aldose-ketose isomerases
summary: >-
  Cofactor-independent sugar epimerases and aldose-ketose isomerases built on the (alpha/alpha)6-barrel
  scaffold of N-acyl-D-glucosamine 2-epimerase (AGE). The reviewed members in the local inventory comprise
  vertebrate AGE (renin-binding protein, RENBP), bacterial cellobiose 2-epimerases, mannose 2-epimerases,
  D-mannose isomerases, a Rhizobium mannose-6-phosphate isomerase and the enterobacterial sulfoquinovose
  isomerase YihS. E. coli YihS, the first enzyme of the sulfoglycolytic Embden-Meyerhof-Parnas pathway,
  isomerizes beta-sulfoquinovose to 6-deoxy-6-sulfofructose and lacks AGE activity, although it retains
  weak isomerase activity on mannose, fructose, glucose, lyxose and xylulose.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The scaffold and the proton-transfer chemistry at C2 are shared, but the reaction and substrate differ
  between characterized members: AGE epimerizes N-acylglucosamine, cellobiose 2-epimerases and mannose
  2-epimerases epimerize at C2 of other sugars, mannose isomerases and YihS interconvert an aldose and
  a ketose, and YihS specifically binds the sulfonate of sulfoquinovose. PANTHER does not split the 20
  reviewed members into subfamilies, so substrate-specific terms must be carried by PAINT nodes or curated
  per member.
