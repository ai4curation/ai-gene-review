  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterized member catalyses an epimerization or aldose-ketose isomerization (AGE, cellobiose
    and mannose 2-epimerases, mannose isomerases, YihS), all of which are isomerase activities.
  supported_by:
  - reference_id: PMID:18328504
    supporting_text: The three-dimensional structure of a Salmonella enterica hypothetical protein YihS is
      significantly similar to that of N-acyl-D-glucosamine 2-epimerase (AGE) with respect to a common scaffold,
      an alpha6/alpha6-barrel
- assessed_term:
    id: GO:0061593
    label: sulfoquinovose isomerase activity
  scope: UNRESOLVED
  scope_reason: >-
    The activity belongs to the enterobacterial YihS clade (PAINT node PTN001431668), not to the family.
    PANTHER defines no subfamily for this clade, so no subfamily can be named, and no curated residue site
    is recorded here; membership of an uncharacterized protein in the clade must be decided from the PAINT
    node or from the HAMAP SQ_isomerase rule (MF_00998).
  supported_by:
  - reference_id: PMID:33791429
    supporting_text: Comparison of this data with that for d-mannose reported by Itoh and co-workers20 shows
      that SQ is 178-fold better as a substrate for EcYihS (in terms of kcat/KM).
