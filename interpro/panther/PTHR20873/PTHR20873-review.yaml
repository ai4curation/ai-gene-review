family_id: PANTHER:PTHR20873
family_name: L-SERYL-TRNA(SEC) KINASE
preferred_name: PSTK O-phosphoseryl-tRNA(Sec) kinases
summary: >-
  L-seryl-tRNA(Sec) kinases (PSTK, EC 2.7.1.164) phosphorylate the seryl moiety of
  Ser-tRNA(Sec) to give O-phospho-L-seryl-tRNA(Sec), the substrate of SepSecS in the
  two-step selenocysteine synthesis route of archaea and eukaryotes. The family has a
  single subfamily (SF0). Its four Swiss-Prot members are the human and mouse
  enzymes and the archaeal PstK proteins of Methanocaldococcus jannaschii and
  Methanopyrus kandleri. The PANTHER tree contains 35 leaves, all eukaryotic
  (metazoa, Dictyostelium, kinetoplastids, Plasmodium, Paramecium and Chlamydomonas);
  the two archaeal Swiss-Prot members are classified in the family by HMM but are not
  tree leaves. Bacteria, which make Sec-tRNA(Sec) directly with SelA, lack the family.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member is a Ser-tRNA(Sec) kinase: mouse PSTK was cloned and
  assayed, and the archaeal and human members are named and annotated for the same
  reaction. The occurrence of the family tracks the presence of Sec insertion
  machinery, and no member is reported to have a different function.
