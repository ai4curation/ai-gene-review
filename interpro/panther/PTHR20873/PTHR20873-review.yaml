notes: >-
  Reviewed for the selenocysteine biosynthesis and incorporation module, where PSTK is
  the first enzyme of the eukaryotic Sec-tRNA(Sec) route. The archaeal Swiss-Prot
  members (Q58933, Q8TUS5) are HMM-classified in SF0 but absent from the PANTHER tree,
  so no PAINT node covers them. PSTK homologs were horizontally transferred to
  non-Sec-decoding Cyanobacteria and fungi (PMID:17142313); none is a Swiss-Prot member
  or tree leaf here, and their activity is unknown, so the FAMILY_WIDE scope is a
  statement about the members PANTHER currently classifies.
