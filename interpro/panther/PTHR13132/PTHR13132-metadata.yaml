  name:
    name: Alpha-(1,6)-fucosyltransferase
    short: Glycosyltransferase_23
  description:
  - text: The glycosyltransferase 23 family is characterized by enzymes that catalyze
      the transfer of fucose in an alpha 1-6 linkage to the first N-acetylglucosamine
      (GlcNAc) residue adjacent to peptide chains in N-glycans. This modification
      is a key step in the synthesis of complex N-glycans and is essential for various
      biological processes. The addition of fucose is prevented if the GlcNAc residue
      is already modified with fucose. Members of this family are involved in determining
      susceptibility to certain pathogens and are regulated by metal ions such as
      Fe(3+), Ni(2+), and Cu(2+). The activity of these enzymes is crucial for proper
      protein function and cellular communication.
