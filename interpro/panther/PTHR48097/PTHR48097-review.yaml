family_id: PANTHER:PTHR48097
family_name: L-THREONINE ALDOLASE-RELATED
preferred_name: Low-specificity L-threonine aldolase family
summary: >-
  PLP-dependent L-threonine aldolases (S. cerevisiae GLY1, E. coli and Pseudomonas LtaE, Arabidopsis
  THA1/2) that cleave threonine to glycine and acetaldehyde. Some fungal SF9 members (AveF) act in
  secondary metabolism.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Most members are threonine aldolases; SF9 includes secondary-metabolism homologs.
