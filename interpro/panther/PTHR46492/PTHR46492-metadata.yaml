  description:
  - text: This family of proteins is involved in the development of the cerebral neocortex,
      specifically in neuronal migration. Members of this family are also implicated
      in the regulation of estrogen receptor stability and proteasomal degradation,
      which is crucial for neuronal differentiation, survival, and plasticity. Additionally,
      these proteins function as axonemal dynein assembly factors, playing a vital
      role in ciliary motility, which is essential for the proper functioning of cilia.
