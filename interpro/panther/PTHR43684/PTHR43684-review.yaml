family_id: PANTHER:PTHR43684
family_name: FAMILY NOT NAMED
preferred_name: Enoyl-CoA delta-isomerase 2 (ECI2/ECI1) and CDY family
summary: >-
  Crotonase-fold proteins. SF1 holds the peroxisomal delta(3)-delta(2)-enoyl-CoA isomerases (S. cerevisiae
  ECI1, fly Dci) and dienoyl-CoA isomerase DCI1 used in beta-oxidation of unsaturated fatty acids.
  SF2, SF5 and SF6 are the chromodomain Y proteins (CDY, CDYL, CDYL2), nuclear chromatin readers;
  PAINT negates the isomerase for that clade.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  SF1 is the enoyl-CoA isomerases; the CDY subfamilies are nuclear chromatin proteins without the
  isomerase.
