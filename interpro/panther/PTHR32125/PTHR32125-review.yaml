  description: Gram-positive TarI enzymes that make CDP-ribitol for wall teichoic acid synthesis.
  diverged_from_family: true
  divergence_description: >-
    Named and classified as ribitol-5-phosphate cytidylyltransferases (TarI), which use ribitol
    5-phosphate rather than MEP as the cytidylyl acceptor; they are not MEP-pathway enzymes.
