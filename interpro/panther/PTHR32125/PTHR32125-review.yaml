family_id: PANTHER:PTHR32125
family_name: 2-C-METHYL-D-ERYTHRITOL 4-PHOSPHATE CYTIDYLYLTRANSFERASE, CHLOROPLASTIC
preferred_name: IspD / TarI cytidylyltransferase family
summary: >-
  CTP-dependent sugar-phosphate cytidylyltransferases of the nucleotide-diphospho-sugar transferase
  fold. The large IspD subfamily (SF4) catalyses the third reaction of the methylerythritol phosphate
  (MEP) pathway, converting 2-C-methyl-D-erythritol 4-phosphate (MEP) and CTP into
  4-diphosphocytidyl-2-C-methyl-D-erythritol (CDP-ME) and diphosphate; it includes the bacterial IspD
  enzymes and the plastid ISPD of plants. A small Gram-positive subfamily (SF8, TarI) instead makes
  CDP-ribitol from ribitol 5-phosphate for wall teichoic acid synthesis, so the family is not uniform
  for the IspD reaction.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF4 (80 of 84 leaves in the PANTHER 19 tree) is IspD. SF8 (4 leaves: tarI of Streptococcus
  pneumoniae, Staphylococcus aureus and Listeria monocytogenes) is the ribitol-5-phosphate
  cytidylyltransferase TarI, a different substrate specificity that should not inherit the IspD
  activity placed at the root.
