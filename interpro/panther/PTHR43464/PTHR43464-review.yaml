family_id: PANTHER:PTHR43464
family_name: METHYLTRANSFERASE
preferred_name: SAM-dependent methyltransferase family including UbiG/COQ3
summary: >-
  Class I SAM-dependent methyltransferases. SF19 holds UbiG/COQ3, which performs both O-methylations
  of ubiquinone biosynthesis (E. coli and P. putida UbiG, S. cerevisiae COQ3, S. pombe coq3). Other
  subfamilies are tRNA U34 carboxymethyltransferase CmoB, BioC, juvenile hormone acid O-methyltransferase,
  NodS and others.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Methyl acceptors differ by subfamily: quinone precursors (SF19), tRNA (SF95), malonyl-ACP (SF94),
  juvenile hormone acid (SF23) and others.
