  assessment: TOO_DEEP
  assessment_reason: >-
    All five seeds come from glycogen-making lineages: budding yeast, Candida, mammals and
    Dictyostelium. The node is placed at Eukaryota, so plant UGPases (Arabidopsis UGP1 in SF7 and
    UGP2 in SF4) inherit glycogen metabolic process, although plants store starch made from
    ADP-glucose and not glycogen. S. pombe fyu1 and SPCC794.10 inherit it too, and the PANTHER 19
    fission-yeast and Arabidopsis proteomes have no member of the glycogen synthase family
    (PTHR10176), which S. cerevisiae has (GSY1, GSY2). Even in glycogen-making lineages the term
    describes supplying the donor rather than doing a step of glycogen synthesis. That is why the
    UGP1 and YHL012W reviews keep it as non-core. Recommend restricting the IBD to the
    Opisthokonta/Amoebozoa clades that make glycogen, with an IRD at the S. pombe branch.
term_assessments:
- assessed_term:
    id: GO:0003983
    label: UTP:glucose-1-phosphate uridylyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the defining activity of the eukaryotic UDPGP type 1 family. All four modules that use
    the family assert it, with catalytic representatives: dolichol_phosphate_sugar_donor_supply
    (as SF4, with UGP1, fyu1 and UGP2), glycogen_metabolism_fungal (UGP1, UGP2), and
    glycogen_biosynthesis (UGP2). The only exception is the S. pombe paralog SPCC794.10, which
    PAINT records as diverged.
  member_exceptions:
  - member:
      id: UniProtKB:O59819
      label: Probable UTP--glucose-1-phosphate uridylyltransferase
      organism: Schizosaccharomyces pombe
    exception_reason: >-
      PAINT places an IRD (NOT GO:0003983) on this S. pombe branch, PTN000237191. Unlike fyu1,
      overexpressing SPCC794.10 did not boost UDP-glucose-dependent glucoside production in
      fission yeast. The evidence is indirect: no direct enzyme assay is reported, and UniProt
      still lists UGPase binding-site features for it by similarity. Treat this as provisional
      until the protein is assayed.
    lost_in_clade_node_id: PANTHER:PTN000237191
    supported_by:
    - reference_id: PMID:21862693
      supporting_text: by overexpressing the fission yeast gene SPCC1322.04, a potential UDP-glucose
        pyrophosphorylase (UGPase), but not by overexpression of SPCC794.10
  supported_by:
  - reference_id: PMID:7588797
    supporting_text: encodes UDP-glucose pyrophosphorylase (UGPase), the enzyme which catalyses the
