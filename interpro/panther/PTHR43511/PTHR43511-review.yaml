notes: >-
  The fetched entries.csv has no subfamily column for this family, so subfamily placements come
  from the PANTHER 19.0 per-organism classification files. The paint tsv omits the IRD at
  PTN000237191 (NOT GO:0003983, taxon 284812, dated 2026-08-28), which was found in IBD.gaf.
  SPCC794.10 is identified as the IRD target because it is the only S. pombe member that does not
  receive GO:0003983 in the PAINT GAF, while it does receive the other three PTN000237130 terms.
  The glycogen-synthase absence was checked against the PANTHER 19.0 per-organism files (no
  PTHR10176 entries for fission yeast or Arabidopsis; two, GSY1 and GSY2, for budding yeast). The
  fyu1 gene review (now COMPLETE) keeps the GO:0005977 IBA as non-core. The family review treats
  that IBA as over-propagation to S. pombe (see the PTN000237130 glycogen assessment), so a
  MARK_AS_OVER_ANNOTATED call for fyu1 would fit better. No SPCC794.10 gene review exists.
