family_id: PANTHER:PTHR43511
family_name: FAMILY NOT NAMED
preferred_name: Eukaryotic UDP-glucose pyrophosphorylase (UDPGP type 1) family
summary: >-
  Eukaryotic UDP-glucose pyrophosphorylases (UGPases, UDPGP type 1 family) reversibly condense
  glucose 1-phosphate and UTP into UDP-glucose and pyrophosphate. UDP-glucose is the glucosyl
  donor for glycogen (in fungi and animals), trehalose, cell-wall glucans, sucrose and cell-wall
  polysaccharides (in plants), glucosylated dolichol and N-glycan quality control, and for UDP-
  galactose interconversion in the Leloir pathway. Members include S. cerevisiae UGP1 (essential)
  and its uncharacterized whole-genome-duplication paralog YHL012W, S. pombe fyu1 and SPCC794.10,
  human and mouse UGP2, fly UGP, worm UGP homologs, Dictyostelium uppA and ugpB, Arabidopsis UGP1
  and UGP2, and trypanosomatid UGPases. Bacterial GalU-type UGPases belong to a different family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  UGPase activity is shared by the characterized fungal, animal, plant, Dictyostelium and
  trypanosomatid members. Two things depart from that. First, PAINT records a rapid-divergence
  loss of UGPase activity (IRD, NOT GO:0003983 at PTN000237191, S. pombe) on the second
  S. pombe paralog SPCC794.10. That row is in IBD.gaf but missing from the fetched paint tsv.
  Overexpression data are consistent with it: overexpressing fyu1, but not SPCC794.10, raised
  UDP-glucose-dependent glucoside production. Second, the downstream use of UDP-glucose is
  lineage-specific. Glycogen is made only in fungi such as S. cerevisiae and Candida, in animals
  and in Dictyostelium. Plants make starch from ADP-glucose and use UDP-glucose for sucrose and
  cell walls. S. pombe has no glycogen synthase family member in the PANTHER 19 classification.
  The PANTHER subfamily SF4 mixes fungi, animals and Arabidopsis UGP2, so lineage-specific process
  terms cannot be scoped by subfamily.
