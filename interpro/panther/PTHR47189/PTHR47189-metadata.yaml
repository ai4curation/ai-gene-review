  name:
    name: MHC class II transactivator
    short: MHC-II_transactivator
  description:
  - text: This family of proteins is involved in the regulation of MHC class II gene
      expression. They function as transactivators essential for the transcriptional
      activity of the MHC class II promoter, operating through a proximal promoter
      without directly binding DNA. These proteins may act in a coactivator-like manner,
      interacting with other factors bound to the MHC class II promoter or with components
      of the transcription machinery. They can also modify proteins that bind to the
      MHC class II promoter, thus activating transcription. Additionally, they are
      involved in the enhanced transcription of MHC class I genes and can substitute
      for TAF1 in this role. They activate CD74 transcription and possess intrinsic
      GTP-stimulated acetyltransferase activity. They also exhibit serine/threonine
      protein kinase activity, capable of phosphorylating various substrates including
      histones and transcription factors. Furthermore, they have antiviral activity
      against certain viruses by up-regulating specific isoforms of CD74, which inhibits
      viral fusion. They can also exert a dominant-negative effect on MHC class II
      gene expression.
