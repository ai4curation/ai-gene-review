family_id: PANTHER:PTHR11606
family_name: GLUTAMATE DEHYDROGENASE
preferred_name: Glutamate dehydrogenase (GLUD/GDH2) family
summary: >-
  Glutamate dehydrogenases interconvert glutamate and 2-oxoglutarate plus ammonia. The family contains
  animal GLUD1/GLUD2, which use NAD+ or NADP+ and are allosterically regulated by ADP and GTP in
  the mitochondrial matrix, and the large NAD-specific GDHs of fungi and plants (S. cerevisiae GDH2,
  S. pombe gdh2), which mainly catabolize glutamate.
functional_coherence: COHERENT
coherence_reason: >-
  All members are glutamate dehydrogenases. Cofactor use (NAD only, or NAD and NADP) and compartment
  differ by subfamily.
