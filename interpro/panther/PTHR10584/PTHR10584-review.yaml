family_id: PANTHER:PTHR10584
family_name: SUGAR KINASE
preferred_name: PfkB-family carbohydrate kinases including ribokinase
summary: PfkB-fold kinases that transfer the gamma-phosphate of ATP to sugars and sugar phosphates. PAINT-seeded
  activities in the family include ribokinase (E. coli RbsK, human RBKS, yeast, Arabidopsis, Leishmania),
  ketohexokinase, sulfofructose kinase (YihV) and 2-dehydro-3-deoxygluconokinase. Ribokinases phosphorylate
  D-ribose at O-5 with Mg-ATP and are activated by monovalent cations.
functional_coherence: HETEROGENEOUS
coherence_reason: The family contains several distinct substrate specificities (ribokinase, ketohexokinase,
  sulfofructose kinase, 2-dehydro-3-deoxygluconokinase), so ribokinase activity is defined by the ribokinase
  PAINT node and subfamily, not by family membership.
