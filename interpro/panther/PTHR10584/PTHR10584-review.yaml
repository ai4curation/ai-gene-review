    supporting_text: P32143,Sulfofructose kinase,protein,83333,Escherichia coli (strain K12)
  - reference_id: PMID:33791429
    supporting_text: Instead, a KRN sulfonate recognition triad (K27-R138-N109) was identified in the SFP
      and SF complexes, which is conserved in annotated YihV kinases (Figures S16 and S18).
- subfamily_id: PANTHER:PTHR10584:SF166
  label: RIBOKINASE
  description: >-
    The large subfamily holding 31 of the 32 reviewed members: ribokinases, deoxyribokinase, nucleoside
    kinases, pseudouridine kinase, guanosine-inosine kinase, 2-dehydro-3-deoxygluconokinase and uncharacterized
    sugar kinases. Functionally mixed despite its name; ribokinase activity cannot be inferred from membership.
    The SF166 assignment of some non-ribokinase members (PsuK P30235, YdjH P77493) comes from UniProt's
    PANTHER cross-reference; PANTHER's own classification files place them in PTHR43085, so the mixture is
    smaller than the cross-references suggest. B. subtilis RbsK (P36945) is a second ribokinase exemplar.
  representative_members:
