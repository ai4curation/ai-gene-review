    id: GO:0004747
    label: ribokinase activity
  scope: UNRESOLVED
  scope_reason: >-
    Ribokinase activity is the function of the 14 members named ribokinase in subfamily SF166 (for example
    E. coli RbsK and human RBKS), but SF166 is mixed: the same subfamily holds pseudouridine kinase PsuK,
    guanosine-inosine kinase, nucleoside kinases, deoxyribokinases, a 2-dehydro-3-deoxygluconokinase and
    uncharacterized sugar kinases. PAINT withdraws ribokinase activity below the sulfofructose kinase node
    PTN000061922 (IRD), and no PANTHER subfamily isolates the ribokinase clade, so neither family nor SF166
    membership establishes the activity; it has to be decided per member.
