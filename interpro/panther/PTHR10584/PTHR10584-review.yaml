  negated: true
  paint_snapshot: '20260528'
  seeds:
  - id: PANTHER:PTN000061929
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    The IRD removes the ancestral ribokinase activity (PTN000061929) from the sulfofructose kinase
    clade. Its characterized member YihV phosphorylates the C1 hydroxyl of a ketohexose sulfonate, binds
    the sulfonate through a KRN triad, and does not even act on the closely related fructose 6-phosphate
    (PMID:33791429). Ribose itself was not reported as tested, but nothing suggests retained ribokinase
    activity, and the substrate pocket is remodelled for the sulfonate.
  supported_by:
