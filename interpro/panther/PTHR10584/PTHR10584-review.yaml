family_id: PANTHER:PTHR10584
family_name: SUGAR KINASE
preferred_name: PfkB carbohydrate kinase family (ribokinase superfamily)
summary: >-
  ATP-dependent sugar and nucleoside kinases of the PfkB (ribokinase-like) fold, with a Rossmann-like
  catalytic domain and a beta-sheet lid that forms a beta-clasp dimer. Characterized members include
  ribokinases (RbsK, RBKS), nucleoside and pseudouridine kinases, 2-dehydro-3-deoxygluconokinase (KdgK),
  ketohexokinase (KHK) and the sulfofructose kinase YihV of the sulfoglycolytic Embden-Meyerhof-Parnas
  pathway, which phosphorylates 6-deoxy-6-sulfo-D-fructose at C1 and recognises the substrate sulfonate
  through a Lys-Asn-Arg triad. The local member inventory lists 32 reviewed members, 31 in the large
  ribokinase subfamily SF166 and YihV alone in SF157 (SULFOFRUCTOSE KINASE).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Phosphoryl transfer from ATP to a sugar or nucleoside hydroxyl is shared, but the phosphate acceptor
  differs between clades (ribose, nucleosides, pseudouridine, 2-keto-3-deoxygluconate, fructose, sulfofructose),
  and PAINT itself records losses of the ancestral ribokinase activity in the sulfofructose kinase and
  archaeal nucleoside kinase clades. Substrate-specific terms must be scoped to clades or subfamilies.
