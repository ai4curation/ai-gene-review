  KdgK, archaeal nucleoside kinase, pseudouridine kinase) are recorded as UNRESOLVED with the missing
  evidence named, because no literature or gene review for their seeds is cached. The local inventory
  holds the 32 reviewed members only (metadata reports 54,602 proteins).
  Merged with a parallel review written for modules/bacterial_ribose_uptake_and_entry.yaml, which grounds
  the RbsK ribokinase annoton at SF166 with E. coli and KT2440 RbsK and the PAINT node PTN000061929. That
  review used E. coli RbsK as reference protein and judged PTN000061929 SOUND and ribokinase activity
  SUBFAMILY_ONLY; this merged file keeps the sulfoquinovose review's reference protein (YihV) and its more
  cautious UNRESOLVED assessments, because the PAINT pseudouridine kinase node PTN008678475 (seeded by
  PsuK) lies in this family's tree and its position relative to PTN000061929 is not established here. The
  missing seventh seed of PTN000061929 (human RBKS Q9H477, present in the paint.tsv row) was added. Both
  branches had identical fetched PTHR10584 data files (paint.tsv, entries.csv, metadata.yaml); these were
  kept unchanged.
