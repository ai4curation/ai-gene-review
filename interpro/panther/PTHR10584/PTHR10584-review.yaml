  diverged_from_family: true
  divergence_description: >-
    Phosphorylates the sulfosugar 6-deoxy-6-sulfo-D-fructose at C1 instead of ribose; PAINT records the
    loss of ribokinase activity for this clade (IRD at PTN000061922) and places SF kinase activity on it.
  supported_by:
