    gene_symbol: rbsK
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/rbsK/rbsK-ai-review.yaml
  - id: UniProtKB:P36945
    label: Ribokinase
    gene_symbol: rbsK
    organism: Bacillus subtilis
