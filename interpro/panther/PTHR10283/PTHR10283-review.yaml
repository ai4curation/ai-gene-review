family_id: PANTHER:PTHR10283
family_name: SOLUTE CARRIER FAMILY 13 MEMBER
summary: This transporter family includes membrane proteins with citrate-transporter-like architecture
  and diverse solute preferences. Fungal SPX-containing members connect transport with phosphate homeostasis.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory includes sodium-dependent organic-acid transporters and fungal Pho87/90/91
  phosphate-related proteins. NCU01540 has an SF92 Pho91 assignment and SPX/transporter architecture.
  Budding-yeast Pho91 localization and polyphosphate phenotypes support vacuolar phosphate mobilization
  (PMID:17804816), but that study presents export direction as a mechanistic hypothesis rather than a
  direct flux measurement. Citrate specificity and plasma-membrane import cannot be transferred to this
  branch.
