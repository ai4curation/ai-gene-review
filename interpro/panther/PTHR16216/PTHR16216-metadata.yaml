  name:
    name: Dynein Axonemal Assembly Factor
    short: DNAAF
  description:
  - text: This family of proteins is involved in ciliary motility, specifically in
      the assembly and delivery of axonemal dynein to the motile cilium. Members of
      this family are cytoplasmic and play a crucial role in the formation of the
      dynein inner and outer arms, which are essential for the movement of cilia.
      These arms are attached to the peripheral outer doublet A microtubule of the
      axoneme, the core structural component of a cilium.
