family_id: PANTHER:PTHR10176
family_name: GLYCOGEN SYNTHASE
preferred_name: Eukaryotic glycogen synthase (GT3; GYS/GSY) family
summary: >-
  UDP-glucose-dependent glycogen synthases of fungi and animals (glycosyltransferase family 3). They
  extend alpha-1,4-glucan chains on glycogenin-primed glycogen and are regulated by phosphorylation
  and glucose-6-phosphate. Fungi have GSY1/GSY2-type paralogs (SF3); vertebrates have the muscle
  (GYS1, SF2) and liver (GYS2, SF1) isoforms.
functional_coherence: COHERENT
coherence_reason: >-
  All three subfamilies are active glycogen synthases. They differ in tissue expression and regulation,
  not activity.
