family_id: PANTHER:PTHR43073
family_name: DIHYDROPYRIMIDINE DEHYDROGENASE [NADP(+)]
preferred_name: Dihydropyrimidine dehydrogenase and dihydroorotate dehydrogenase B family
summary: >-
  Iron-sulfur flavoproteins that reduce a pyrimidine C5=C6 bond. The family holds three architectures.
  Eukaryotic DPYD (human, animals, Dictyostelium, plants) is a single chain with an N-terminal NADPH/FAD
  and iron-sulfur region and a C-terminal FMN, pyrimidine-binding catalytic region; it reduces uracil
  and thymine with NADPH in the first step of reductive pyrimidine degradation. Bacterial dihydropyrimidine
  dehydrogenase is split into two subunits that both belong here: PreT/PydX, equivalent to the N-terminal
  electron-input region, and PreA/PydA, equivalent to the C-terminal catalytic region; the PreT-PreA heterotetramer
  is NADH-specific. The family also contains archaeal dihydroorotate dehydrogenase B catalytic subunits
  (PyrD), which oxidize dihydroorotate in pyrimidine biosynthesis.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Pyrimidine-ring oxidoreductase chemistry is shared, but the specific activity differs: NADPH-dependent
  dihydropyrimidine dehydrogenase for eukaryotic DPYD (node PTN000234105), NADH-dependent dihydropyrimidine
  dehydrogenase contributed by two separate subunits in bacteria, and dihydroorotate dehydrogenase for
  archaeal PyrD. PANTHER assigns every member to SF2, so the distinctions are visible only at PAINT nodes
  and in member architecture.
