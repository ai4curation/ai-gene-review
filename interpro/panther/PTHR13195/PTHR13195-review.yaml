family_id: PANTHER:PTHR13195
family_name: PSEUDOURIDINE SYNTHASE-RELATED
preferred_name: TRUB2-related RNA pseudouridylation proteins
summary: TRUB2-related proteins are associated with mitochondrial RNA pseudouridylation. Family membership
  supports an RNA-modification hypothesis but does not identify the RNA substrate or guarantee catalytic
  competence of a fragment.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The pigeon protein is only 142 residues with an N-terminal pseudouridine-synthase annotation.
  Published TRUB2 evidence concerns specific mitochondrial mRNA residues; it does not by itself establish
  tRNA pseudouridine synthase activity for this short sequence. Full-domain completeness and substrate
  assignment remain unresolved.
subfamilies:
