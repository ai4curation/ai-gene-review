    id: GO:0106029
    label: tRNA pseudouridine synthase activity
  scope: UNRESOLVED
  scope_reason: The cited human TRUB2 depletion and pseudouridine-Seq study identifies specific mitochondrial
    mRNA targets, not a tRNA substrate. It therefore supports RNA pseudouridylation while leaving this
    particular tRNA activity unestablished. The pigeon product is only 142 residues with an N-terminal
    synthase-associated region, adding a domain-completeness problem independent of RNA substrate choice.
  supported_by:
