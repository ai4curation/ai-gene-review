  label: PSEUDOURIDYLATE SYNTHASE TRUB2, MITOCHONDRIAL
  description: Recorded placement of A0A2I0M3K7. The pigeon protein is only 142 residues with an N-terminal
    pseudouridine-synthase annotation. Published TRUB2 evidence concerns specific mitochondrial mRNA residues;
    it does not by itself establish tRNA pseudouridine synthase activity for this short sequence. Full-domain
    completeness and substrate assignment remain unresolved.
