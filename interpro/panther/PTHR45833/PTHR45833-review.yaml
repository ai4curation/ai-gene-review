family_id: PANTHER:PTHR45833
family_name: METHIONINE SYNTHASE
preferred_name: Cobalamin-dependent methionine synthase (MetH/MTR) family
summary: Canonical MetH/MTR proteins remethylate homocysteine using a cobalamin intermediate and methyl-tetrahydrofolate,
  with a separate reductive-reactivation module. This PANTHER family also contains a distinct SF2 lineage
  with homocysteine-methyltransferase and methylenetetrahydrofolate-reductase domains; family membership
  alone therefore does not specify the complete MetH reaction.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The official tree separates canonical MetH SF1 from SF2 YitJ/MetF-like domain fusions.
  Q748M7 retains an official SF2 assignment; O06745 has a PANTHER-tree versus current UniProt assignment
  disagreement, preserved without remapping. Shared homocysteine-binding architecture is not proof of
  the same methyl donor or complete B12-dependent mechanism.
