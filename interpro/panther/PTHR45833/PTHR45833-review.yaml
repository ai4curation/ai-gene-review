family_id: PANTHER:PTHR45833
family_name: METHIONINE SYNTHASE
preferred_name: Cobalamin-dependent methionine synthase (MetH/MTR) family
summary: >-
  Modular cobalamin-dependent methionine synthases (human MTR, E. coli and P. putida MetH) that transfer
  the methyl group of 5-methyl-THF to homocysteine via methylcobalamin. Fungi lack MetH and use the
  cobalamin-independent MET6.
