    organism: Escherichia coli K-12
  assessment: TOO_DEEP
  assessment_reason: >-
    The single seed is E. coli SsuD, whose broad alkanesulfonate desulfonase activity is
    directly assayed, but the node also covers members with a different substrate. The clear
    case is E. coli RutA (P75898), which the member inventory places in the same subfamily as
    SsuD: RutA opens the uracil ring between N3 and C4 in the Rut pyrimidine-utilisation
    pathway, a reaction that is not a desulfonation and releases no sulfite, so the
    alkanesulfonate-specific activity cannot be inherited across this node. P. aeruginosa
    MsuD is the boundary case in the other direction and does not weaken the row, because
    methanesulfonate is itself an alkanesulfonate. The family additionally contains
    eukaryotic members whose relation to this node could not be resolved from committed
    data; they are not used as an argument here. The activity is best placed on the SsuD/MsuD
    sulfonate branch rather than at this node, whose own recorded taxon is Bacteria. No
    subfamily can be named under affected_subfamilies, because the member inventory places
    SsuD and RutA alike in SF4.
