  - id: UniProtKB:P80645
    gene_symbol: ssuD
    organism: Escherichia coli K-12
  assessment: TOO_DEEP
  assessment_reason: >-
    The single seed is E. coli SsuD, whose broad alkanesulfonate desulfonase activity is
    directly assayed, but the node's descendants include members with a different
    substrate. E. coli RutA (P75898) receives this IBA, yet RutA opens the uracil ring in
    the Rut pyrimidine pathway; its reaction is not a desulfonation and releases no sulfite.
    P. aeruginosa MsuD is a closer case, because methanesulfonate is itself an
    alkanesulfonate, but the fungal descendants (Sclerotinia SS1G_04086, Stagonospora
    SNOG_00264, Neurospora NCU10015) take a bacterium-seeded sulfur-scavenging activity
    into a lineage with no characterized Ssu system, even though the node's own recorded
    taxon is Bacteria. The activity is best placed on the SsuD/MsuD sulfonate branch rather
    than at this node. No subfamily can be named under affected_subfamilies because the
    local member inventory places all of these proteins, SsuD and RutA alike, in SF4.
