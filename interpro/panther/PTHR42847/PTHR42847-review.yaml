  scope: FAMILY_WIDE
  scope_reason: >-
    Reduced-flavin- and oxygen-dependent monooxygenase chemistry on a luciferase-like
    TIM-barrel scaffold is what the family shares. It holds even for RutA, whose formal
    hydrolysis proceeds through addition of a flavin hydroperoxide to the uracil C4
    carbonyl, so oxygen is incorporated in the catalytic cycle.
