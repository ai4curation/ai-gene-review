notes: >-
  Reviewed while completing the bacterial alkanesulfonate uptake and desulfonation module
  (modules/bacterial_alkanesulfonate_uptake_desulfonation.yaml), which grounds the SsuD
  role to subfamily SF4 of this family. PANTHER's own family name (ALKANESULFONATE
  MONOOXYGENASE) is narrower than the family's content; InterPro's integrated entry
  IPR050172 and the metadata description both treat it as the SsuD/RutA monooxygenase
  family, which is the reading used here.
