family_id: PANTHER:PTHR42847
family_name: ALKANESULFONATE MONOOXYGENASE
preferred_name: SsuD/RutA reduced-flavin-dependent luciferase-like monooxygenases
summary: >-
  TIM-barrel, bacterial-luciferase-like monooxygenases that use reduced FMN supplied by a
  separate NAD(P)H:FMN reductase together with molecular oxygen. The best characterized
  member is Escherichia coli SsuD, which converts a broad range of linear alkanesulfonates
  and substituted ethanesulfonates, including the buffers HEPES, MOPS and PIPES, to sulfite
  and the corresponding aldehyde during sulfate-starvation sulfur scavenging; SsuD orthologs
  in Pseudomonas, Bacillus and rhizobia do the same job. The family also holds enzymes with
  the same reduced-flavin chemistry but different substrates: the pyrimidine monooxygenase
  RutA, which opens the uracil ring in the Rut nitrogen-scavenging pathway, the
  methanesulfonate monooxygenase MsuD, the dimethylsulfone monooxygenase SfnG, and
  biosynthetic monooxygenases such as BtrO, plus many uncharacterized actinobacterial and
  fungal paralogs. PANTHER assigns every characterized SwissProt member, SsuD and RutA
  alike, to one subfamily (SF4), so neither the family nor that subfamily separates
  alkanesulfonate desulfonases from the substrate-divergent members.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The reduced-flavin, oxygen-dependent luciferase-like chemistry is shared, but substrate
  and physiological process differ among characterized members: SsuD and MsuD desulfonate
  sulfonates for sulfur assimilation, RutA opens the pyrimidine ring for nitrogen
  scavenging, and BtrO acts in aminoglycoside biosynthesis. A substrate-specific term such
  as alkanesulfonate monooxygenase activity therefore cannot be inherited by every
  descendant, and the single populated subfamily does not separate these functions.
