term_assessments:
- assessed_term:
    id: GO:0008726
    label: alkanesulfonate monooxygenase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The term holds for the SsuD orthologs of SF4, which are directly assayed in E. coli and
    genetically grounded in P. putida, and is defensible for MsuD, since methanesulfonate is
    itself an alkanesulfonate. It is not family-wide: SF4 is the only populated subfamily and
    also contains RutA, whose substrate is uracil, so the scope is recorded here as this
    subfamily with RutA excepted by name. The uncharacterized actinobacterial and fungal
    members of the subfamily are neither supported nor excluded; they are left without an
    exception entry because no evidence places them on either side, and a member-level
    assertion should not be manufactured from silence.
  applicable_subfamilies:
  - id: PANTHER:PTHR42847:SF4
    label: ALKANESULFONATE MONOOXYGENASE-RELATED
  member_exceptions:
  - member:
      id: UniProtKB:P75898
      label: Pyrimidine monooxygenase RutA
      gene_symbol: rutA
      organism: Escherichia coli K-12
    exception_reason: >-
      RutA uses the family's reduced-flavin chemistry on a different substrate: it opens the
      uracil ring between N3 and C4 via a flavin hydroperoxide to give 3-ureidoacrylate, the
      first committed step of the Rut pyrimidine-utilisation pathway. It desulfonates
      nothing and releases no sulfite, so the alkanesulfonate-specific term does not hold for
      it even though PANTHER places it in the same subfamily as SsuD.
    supported_by:
    - reference_id: PMID:20369853
      supporting_text: catalyzes the initial uracil ring-opening reaction to give 3-ureidoacrylate.
    - reference_id: PMID:16540542
      supporting_text: propose that the genes of this operon be named rutA-G for pyrimidine
