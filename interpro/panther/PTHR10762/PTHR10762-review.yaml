- assessed_term:
    id: GO:0090560
    label: 2-(3-amino-3-carboxypropyl)histidine synthase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member is part of an ACP-histidine synthase, but the qualifier differs by subfamily.
    The catalytic subunit enables the activity: eukaryotic Dph1 and the archaeal Dph2 homodimer,
    both in SF1. Eukaryotic Dph2 (SF2) is a required non-catalytic subunit of the heterodimer and
    should carry the term as contributes_to (see the SF2 divergence), which is how the S.
    cerevisiae DPH2 and zebrafish dph2 gene reviews record it. An enables-qualified transfer to
    SF2 members would overstate their role. The module asserts the activity for the Dph1-Dph2
    complex (GO:0120513), with both subunits as base-family selectors, which fits this reading.
  supported_by:
  - reference_id: PMID:24422557
    supporting_text: yeast Dph1 and Dph2 form a complex (Dph1-Dph2) that is equivalent to the homodimer
      of PhDph2 and is sufficient to catalyze the first step in vitro
