    label: dph2
    gene_symbol: dph2
    organism: Danio rerio
    gene_review: genes/DANRE/dph2/dph2-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Not catalytic on its own. The eukaryotic Dph2 cluster helps reduce the catalytic Dph1 cluster
    and does not perform ACP transfer itself, so the ACP-histidine synthase activity applies as
    contributes_to, through the Dph1-Dph2 complex. Participation in diphthamide biosynthesis is
    unchanged. The S. cerevisiae DPH2 and zebrafish dph2 gene reviews use 4Fe-4S cluster binding
    as the enabled function and contributes_to for the synthase activity.
  supported_by:
