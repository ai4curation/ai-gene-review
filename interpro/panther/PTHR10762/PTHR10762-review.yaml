notes: >-
  Modules using this family: diphthamide_biosynthesis. The dph1_unit and dph2_unit active units
  of the eukaryotic Dph1-Dph2 complex both use the base family PTHR10762 (labelled "Dph1
  subfamily" and "Dph2 subfamily" in preferred_term only). A base-family selector cannot tell the
  two subunits apart. PANTHER:PTHR10762:SF1 and PANTHER:PTHR10762:SF2 would make the subunit
  selectors precise. The SF1 selector would still include archaeal Dph2, so a eukaryotic taxon
  constraint would also be needed for dph1_unit. The module's archaeal_dph2_homodimer_variant
  sets no family id and says that no PANTHER classification is available locally for the
  archaeal exemplar. In fact this family's entries.csv classifies P. horikoshii dph2 (O58832) and
  M. jannaschii dph2 (Q57907) in PTHR10762:SF1, so that variant could use PTHR10762:SF1 with an
  archaeal taxon constraint. The gene reviews (DPH1, DPH2, zebrafish dph2) are consistent with
  this review. The zebrafish dph2 review marks an enables-qualified GO:0090560 IEA as
  over-annotated and keeps contributes_to, which matches the qualifier split recorded here.
