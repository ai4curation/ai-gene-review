family_id: PANTHER:PTHR10762
family_name: DIPHTHAMIDE BIOSYNTHESIS PROTEIN
preferred_name: Dph1/Dph2 2-(3-amino-3-carboxypropyl)histidine synthase family
summary: >-
  Non-canonical radical-SAM [4Fe-4S] enzymes that carry out the first step of diphthamide
  synthesis on translation elongation factor 2. They cleave S-adenosylmethionine at the Cγ-S bond
  and transfer the 3-amino-3-carboxypropyl (ACP) group to the target histidine. Archaea have a
  single Dph2 that works as a homodimer, and Pyrococcus horikoshii Dph2 alone catalyses the step
  in vitro. Eukaryotes have two paralogs, Dph1 and Dph2, which form an obligate heterodimer.
  The Dph1 cluster is catalytic, and the Dph2 cluster is needed for the physiological
  Dph3/Cbr1/NADH reducing system to reduce the Dph1 cluster. Archaeal Dph2 is closer in sequence
  to eukaryotic Dph1 than to Dph2.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member takes part in ACP transfer for diphthamide synthesis. The catalytic role is
  divided after the eukaryotic duplication. Dph1 (SF1) carries the catalytic cluster. Eukaryotic
  Dph2 (SF2) is a required, non-catalytic partner whose cluster supports electron delivery, so
  for SF2 the activity is contributes_to and not enables. Archaeal Dph2 homodimers, which are
  complete enzymes on their own, are classified in SF1 together with eukaryotic Dph1. That
  agrees with their greater similarity to Dph1, but it means SF1 is not a eukaryote-only
  subunit-1 group.
