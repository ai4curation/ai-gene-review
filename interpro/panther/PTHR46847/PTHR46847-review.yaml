  scope: UNRESOLVED
  scope_reason: Ribose import is established for E. coli RbsB and inferred for orthologs encoded in rbs
    operons (B. subtilis, KT2440), but SF1 also contains allose, polyol and TorT receptors. No subfamily
    or node separates the ribose receptors, so the term must be assigned per protein.
  supported_by:
  - reference_id: PMID:25533465
    supporting_text: The ribose transporter in Escherichia coli is a tripartite complex consisting of
      a cytoplasmic ATP-binding cassette protein, RbsA, with fused nucleotide binding domains; a transmembrane
      domain homodimer, RbsC2; and a periplasmic substrate binding protein, RbsB.
  - reference_id: file:interpro/panther/PTHR46847/PTHR46847-entries.csv
    supporting_text: P39265,D-allose-binding periplasmic protein
notes: Used by modules/bacterial_ribose_uptake_and_entry.yaml as the family term for the RbsB active unit,
  with E. coli and KT2440 RbsB as exemplars. The family label names D-allose because AlsB is a prominent
  member; the module does not treat the family as ribose-specific. The LacI-regulator node PTN001248758
  is outside the ribose-module scope and is not assessed here. TorT (P38683) carries a UniProt SF1 cross-reference
  but PANTHER's classification files place it in PTHR30146, so it is not used as an SF1 representative.
  The YtfQ-clade node PTN005323170 (GO:0015757 galactose transmembrane transport, seeded by P39325) is also
  outside the ribose-module scope and is not assessed here.
