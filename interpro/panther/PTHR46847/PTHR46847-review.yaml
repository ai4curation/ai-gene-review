family_id: PANTHER:PTHR46847
family_name: D-ALLOSE-BINDING PERIPLASMIC PROTEIN-RELATED
preferred_name: Periplasmic-binding-protein type 1 sugar receptors and related LacI-fold proteins
summary: 'A family built on the type 1 periplasmic-binding-protein fold. Its reviewed members are substrate-binding
  subunits of bacterial carbohydrate ABC importers with different ligands: D-ribose (E. coli and B. subtilis
  RbsB), D-allose (AlsB), galactofuranose (YtfQ), xylitol and D-threitol (Mycolicibacterium XypA, ThpA).
  PAINT also places LacI-family transcription factors, which share the fold, under a node of this family.
  Ligand identity therefore cannot be read from membership; for ribose import it comes from the receptor''s
  own binding evidence and its rbs operon partners.'
functional_coherence: HETEROGENEOUS
coherence_reason: The shared activity is ligand binding in the periplasm, but ligands differ between members
  (ribose, allose, galactofuranose, xylitol, threitol), and the family also contains LacI-fold transcription
  factors. SF1 alone mixes RbsB with AlsB and the polyol-binding proteins.
