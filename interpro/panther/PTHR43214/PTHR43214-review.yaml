family_id: PANTHER:PTHR43214
family_name: TWO-COMPONENT RESPONSE REGULATOR
preferred_name: NarL/FixJ-type (receiver plus LuxR-HTH) two-component response regulators
summary: >-
  Bacterial two-component response regulators built from an N-terminal
  CheY-like receiver domain, carrying the conserved phospho-accepting aspartate,
  and a C-terminal GerE/LuxR-type helix-turn-helix DNA-binding domain. Receiver
  phosphorylation by a cognate sensor histidine kinase (frequently a HisKA_3
  kinase of PANTHER PTHR24421, or an Hpt domain in multistep relays such as
  RcsC-RcsD-RcsB) promotes dimerization and DNA binding, and the proteins then
  activate or repress transcription of target operons. Characterized members
  include E. coli NarL and NarP (nitrate and nitrite respiration), UhpA (hexose
  phosphate uptake), RcsB (capsule and envelope stress), UvrY and its
  pseudomonad orthologs GacA (Gac/Rsm global control), B. subtilis DegU, ComA,
  DesR and LiaR, staphylococcal NreC and VraR, mycobacterial DosR (DevR),
  Bordetella BvgA, and a group of regulators of periplasmic PQQ-dependent
  alcohol dehydrogenase genes: Pseudomonas ExaE/PedR2, Paracoccus MoxX and
  Methylorubrum extorquens MxaB and MxcE. Output specificity (target promoters,
  activation versus repression) is member-specific.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Phosphorelay response regulator activity and sequence-specific DNA-binding
  transcription factor activity are conserved across the characterized members,
  because all share the receiver plus LuxR-HTH architecture. Heterogeneity lies
  in the input kinase, the regulated genes and the sign of regulation, which
  PANTHER subfamily labels do not predict: SF43 is labelled only as a generic
  two-component response regulator yet groups the alcohol-dehydrogenase
  regulators of pseudomonads and methylotrophs, and SF41 (named for NarP) also
  holds BvgA, FimZ and PprB. Some members additionally act through
  phosphorylation-independent heterodimers (e.g. RcsB with auxiliary partners),
  which this review does not attempt to generalize.
