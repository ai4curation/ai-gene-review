notes: >-
  Reviewed as the family grounding for the PedR2 (ExaE) response regulator in
  MODULE:pseudomonad_lanthanide_switch_pqq_alcohol_oxidation. The family id
  grounds only the generic phosphorelay response regulator activity of PedR2;
  its role in the lanthanide switch (activating pedE, contributing to pedH
  repression) is a member-level property supported by PMID:30158283. SF43
  groups PQQ-alcohol-dehydrogenase regulators from pseudomonads and
  methylotrophs, but those systems differ in input and target logic, so SF43
  membership alone does not imply lanthanide-switch control. Node coverage was
  read from the PANTHER 19 tree (pantherdb.org treeinfo service, fetched
  2026-10-23); PedR2/ExaE (Q88JH7) is not a leaf of that tree. Seeds without a
  recorded gene symbol (Q9HXD3, Q9HX68, Q9I2C7, Q9I0P6) are listed by accession
  only.
