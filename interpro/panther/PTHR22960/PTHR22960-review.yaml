    in the fused C-terminal MoaC-like (MOCS1B) domain. PTN000539172 is the MoaA-domain clade, so placing
    the MoaC activity here propagates it to standalone bacterial MoaA proteins (SF28, and the MoaA members
    of SF0) that have no MoaC domain. The activity belongs on the fused MOCS1 clades or on the MoaC subfamily,
    not on the MoaA ancestor.
