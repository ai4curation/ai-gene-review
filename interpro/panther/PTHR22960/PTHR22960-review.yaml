  assessment_reason: In the PANTHER 19 tree PTN000539172 is the LUCA speciation node whose leaf subfamilies
    are the MoaA/MOCS1-named SF0, SF25, SF26 and SF28; the MoaC subfamily SF29 lies outside it. The node
    is not free of MoaC, though. The mixed SF0, which makes up 130 of its 141 leaves, also holds standalone
    MoaC-named proteins, and the GO:0061798 term assessment lists 57 of them as member exceptions. The
    placement is sound for the MoaA and MOCS1 descendants, which carry the radical-SAM MoaA domain, and
    the E. coli seed is the experimentally characterized MoaA. Selecting the GTP 3',8'-cyclase through
    this node therefore needs a member-level check (the required activity, or the MoaA domain) to exclude
    the MoaC members.
