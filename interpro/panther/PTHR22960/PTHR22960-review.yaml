family_id: PANTHER:PTHR22960
family_name: MOLYBDOPTERIN COFACTOR SYNTHESIS PROTEIN A
preferred_name: MoaA/MoaC/MOCS1 cPMP-formation family
summary: PTHR22960 groups the two enzymes that convert GTP to cyclic pyranopterin monophosphate (cPMP),
  the first stage of molybdenum cofactor biosynthesis. Radical-SAM MoaA proteins cyclize GTP to (8S)-3',8-cyclo-7,8-dihydroguanosine
  5'-triphosphate, and MoaC proteins rearrange that intermediate to cPMP. Eukaryotic MOCS1 proteins
  carry both activities, either as a fusion or as separate gene products. The family therefore contains
  two distinct catalytic activities, carried by different proteins or domains.
functional_coherence: HETEROGENEOUS
coherence_reason: The family mixes two non-equivalent activities. The GTP 3',8'-cyclase reaction belongs
  to the radical-SAM MoaA domain, and the cPMP synthase reaction belongs to the MoaC domain. The frozen
  inventory shows standalone MoaC proteins unassigned to a subfamily or in SF29, standalone MoaA proteins
  in SF28, and SF0 mixing MoaA-named, MoaC-named and fused MOCS1 proteins. Both activities share the
  Mo-molybdopterin cofactor biosynthetic process, which is family-wide.
