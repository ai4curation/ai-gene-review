- subfamily_id: PANTHER:PTHR22960:SF29
  label: CYCLIC PYRANOPTERIN MONOPHOSPHATE SYNTHASE
  description: Standalone MoaC cPMP synthases. The frozen SF29 entries are all named cyclic pyranopterin
    monophosphate synthase. They lack the radical-SAM MoaA domain, so the GTP cyclase activity of the
    family does not apply to them.
  representative_members:
  - id: UniProtKB:Q88NC0
    label: Cyclic pyranopterin monophosphate synthase
    gene_symbol: moaC
    organism: Pseudomonas putida (strain KT2440)
    gene_review: genes/PSEPK/moaC/moaC-ai-review.yaml
  diverged_from_family: true
  divergence_description: MoaC proteins carry the second (cPMP synthase) activity of the family and lack
    the radical-SAM GTP 3',8'-cyclase domain.
  supported_by:
  - reference_id: file:interpro/panther/PTHR22960/PTHR22960-entries.csv
    supporting_text: Q88NC0,Cyclic pyranopterin monophosphate synthase,protein,160488
  - reference_id: file:genes/PSEPK/moaC/moaC-uniprot.txt
    supporting_text: Belongs to the MoaC family.
- subfamily_id: PANTHER:PTHR22960:SF0
  label: MOLYBDENUM COFACTOR BIOSYNTHESIS PROTEIN 1
  description: A mixed subfamily. Its frozen entries include standalone MoaA-named proteins such as the
    Pseudomonas putida KT2440 GTP 3',8-cyclase, standalone MoaC-named proteins and fused eukaryotic MOCS1
    proteins. Neither activity can be assigned at the subfamily level; the domain content of each member
    decides it.
  representative_members:
