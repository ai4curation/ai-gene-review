  name:
    name: E3 ubiquitin-protein ligase
    short: E3_ubiquitin-ligase
  description:
  - text: The E3 ubiquitin-protein ligase family is involved in the ubiquitination
      process, where they accept ubiquitin from E2 ubiquitin-conjugating enzymes as
      thioesters and transfer them directly to target substrates. This family plays
      a critical role in protein quality control, targeting misfolded or unwanted
      proteins for proteasomal degradation. Members of the family are involved in
      various cellular processes, including protein sorting, signal transduction,
      cell proliferation, and stress responses. They mediate both 'Lys-48'- and 'Lys-63'-linked
      polyubiquitination, influencing the fate of proteins in endosomal trafficking,
      degradation, and quality control processes. Some members also participate in
      the regulation of transcription factors and membrane receptors, as well as in
      ciliogenesis and the immune response.
