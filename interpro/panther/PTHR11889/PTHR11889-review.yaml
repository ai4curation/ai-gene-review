    description: >-
      A single cached member, the zebrafish dhh gene, placed in its own subfamily rather
      than with the tetrapod Desert hedgehog proteins. Recorded here so that the subfamily
      is not mistaken for a functional group; with one classified member in the local slice
      there is nothing to generalize from.
