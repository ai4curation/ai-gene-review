review_status: NEEDS_REVIEW
reviewed_by: claude-code
review_date: '2026-09-23'
notes: >-
  Coherence call. MOSTLY_COHERENT rather than COHERENT because of Desert hedgehog, and the
  distinction matters for how the exception is used: DHH's chemistry and receptor target are
  the family's, and what differs is potency and range. A reader should not take the
  divergence flag on PTHR11889:SF56 as licence to remove Patched binding or the
  autoprocessing terms from DHH.

  What this review does not assert. No residue_sites are recorded, which is a real gap for
  this family in particular: the calcium and zinc coordinating positions of the signaling
  domain, and the catalytic cysteine of the Hint/Hog domain, are exactly the kind of claim
  the ResidueSite mechanism exists for, and the calcium term above is left unresolved
  precisely because those positions were not checked. Residue validation resolves positions
  against UniProt sequences, the local sequence cache is empty, and UniProt is unreachable
  from this environment, so the claims would have been unverifiable at the moment of
  writing. A session with network access should add them and revisit the calcium
  assessment.

  Taxon labels. The node taxa are expanded from the bare PAINT ids so they can be
  checked. NCBITaxon validation routes through OLS, which is unreachable from this
  environment, so NCBITaxon:32524 (Amniota) in particular is an expansion that no local
  artifact corroborates and that the first reviewer with ontology access should confirm.
  NCBITaxon:6072 (Eumetazoa) is corroborated elsewhere in this repository.

  Seed identities. PAINT seeds given as model-organism identifiers were named only where the
  node context makes the identity certain. Three mouse seeds (MGI:MGI:98297, MGI:MGI:96533,
  MGI:MGI:94891) recur throughout the slice and correspond to the mouse Shh, Ihh and Dhh
  genes as a set, but the cached artifacts do not say which identifier is which, so they are
  either omitted or carried without a gene symbol rather than guessed. The same rule was
  applied to RGD:3673.

  Subfamily oddity. PTHR11889:SF84 holds a single cached member, the zebrafish dhh gene,
  while the tetrapod Desert hedgehog proteins sit in PTHR11889:SF56. Whether that reflects a
  real split or an artifact of the classification cannot be judged from the member table
  alone; it is recorded rather than smoothed over.
