      vertebrate cell-type process inherited by an unknown clade is worth confirming before
      it is relied on.
    paint_snapshot: '20190110'
term_assessments:
  - assessed_term:
      id: GO:0005113
      label: patched binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Binding Patched is what makes a protein a Hedgehog ligand. It is asserted at the
      family's main node with seeds spanning flies and vertebrates, and no subfamily has
      evidence of losing it. Head-to-head comparison of the three human paralogs found them
      similar in affinity for Patched even where their potencies differed widely, which is
      the cleanest demonstration that this particular term is safe across paralogs.
    supported_by:
      - reference_id: PMID:11472839
        supporting_text: >-
          While we observed that the proteins were similar in their affinities for the
          Hh-binding proteins; Patched (Ptc) and Hedgehog-interacting protein (Hip), and
          were equipotent in their ability to induce Islet-1 in chick neural plate explant;
          there were dramatic differences in their potencies in several other assays.
  - assessed_term:
      id: GO:0007224
      label: smoothened signaling pathway
    scope: FAMILY_WIDE
    scope_reason: >-
      The pathway every member initiates, in flies and vertebrates alike. Safe for all
      subfamilies including Desert hedgehog, whose restricted range changes which cells
      receive the signal, not which pathway they run.
  - assessed_term:
      id: GO:0140853
      label: cholesterol-protein transferase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The Hint/Hog domain carries out cleavage and cholesterol transfer as one reaction
      cycle, and that domain defines the family. This is a genuine catalytic activity of the
      ligand itself, which is why the Hedgehog module places the reaction on the ligand
      rather than on an external enzyme. Not asserted in the cached PAINT slice, so it is
      recorded here from the biochemistry rather than propagated from a node.
    supported_by:
      - reference_id: PMID:29995851
        supporting_text: >-
          The Hh precursor undergoes autocatalytic processing in the endoplasmic reticulum
          to release an amino-terminal signaling domain (Hh-N) with cholesterol covalently
          coupled to its carboxyl terminus.
  - assessed_term:
      id: GO:0016540
      label: protein autoprocessing
    scope: FAMILY_WIDE
    scope_reason: >-
      The companion process term for the reaction above: the precursor is its own protease,
      so no separate enzyme is needed and the process belongs to the ligand. The Desert
      hedgehog qualification concerns how much autoprocessing happens in cultured cells, not
      whether the domain has the capability.
  - assessed_term:
      id: GO:0016015
      label: morphogen activity
    scope: UNRESOLVED
    scope_reason: >-
      Morphogen activity asserts action over a concentration gradient, which is well
      established for Sonic and Indian hedgehog and is how the Hedgehog module describes the
      mature ligand. Desert hedgehog is the open case: one study of the full-length
      preproteins reports that it neither autoprocesses substantially nor secretes, and
      signals by cell contact instead. That is a single cell-culture result, too thin to
      strip a term from a subfamily but too specific to ignore, so the family-level scope is
      left undecided rather than asserted as family-wide. In vivo measurement of DHH
      secretion and range would resolve it.
    supported_by:
      - reference_id: PMID:24342078
        supporting_text: >-
          Rather, DHH functions as a juxtacrine signaling ligand to activate a cell
          contact-mediated HH signaling response, consistent with its localised signaling in
          vivo.
  - assessed_term:
      id: GO:0005509
      label: calcium ion binding
    scope: UNRESOLVED
    scope_reason: >-
      Established for the vertebrate ligands, where the calcium and zinc sites have assigned
      roles at the ligand surface, and asserted by PAINT for all eumetazoan members on
      human-only seeds. The sequence evidence for conservation of the coordinating residues
      outside the vertebrates has not been checked here, and checking it needs sequences that
      are not available in this environment. Left undecided rather than promoted or pruned.
    supported_by:
      - reference_id: PMID:19561611
        supporting_text: >-
          reveal previously uncharacterized and distinct functions for the Hh Zn2+ and Ca2+
          binding sites--functions that may be common to all vertebrate Hh proteins
  - assessed_term:
      id: GO:0010468
      label: regulation of gene expression
    scope: UNRESOLVED
    scope_reason: >-
      True but uninformative, and structurally a downstream-consequence term: the ligand
      binds a receptor, and the Ci/GLI transcription factors perform the regulation. Nothing
      here contradicts the annotation, but smoothened signaling pathway says what the ligand
      does with more precision and already covers the same members. Flagged so that it is
      not read as an independent family-level activity.
  - assessed_term:
      id: GO:0048709
      label: oligodendrocyte differentiation
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      A vertebrate cell-type process, asserted at two shallow nodes whose seeds are a mouse
      gene and zebrafish shha. It belongs to the Sonic hedgehog subfamily and must not be
      read as a property of the Hedgehog ligands generally; the invertebrate subfamily has
      no oligodendrocytes to differentiate.
    applicable_subfamilies:
      - id: PANTHER:PTHR11889:SF36
        label: SONIC HEDGEHOG PROTEIN
