    assessment_reason: >-
      The node placement is not the problem: Hedgehog ligands do change target-gene
      expression in every clade seeded here, so the assertion descends correctly. The term
      is nonetheless the least informative one at this node, because the ligand causes the
      change at several removes while the entity that performs the regulation is the Ci/GLI
      transcription factor. It is recorded as sound placement of a weak term rather than as
      a misplacement, and the accompanying term assessment says what should be preferred.
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: '20241120'
