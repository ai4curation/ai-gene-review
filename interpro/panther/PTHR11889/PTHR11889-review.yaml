        organism: Danio rerio
      - id: RGD:3673
        organism: Rattus norvegicus
    assessment: SOUND
    assessment_reason: >-
      Concentration-dependent assignment of cell identity is the shared developmental output
      of Hedgehog ligands in both flies and vertebrates, and the seeds reflect that spread.
      The term is general enough that the Eumetazoa placement does not over-commit to any
      particular tissue.
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: '20210904'
  - node_id: PANTHER:PTN001726121
    asserted_term:
      id: GO:0005509
      label: calcium ion binding
    seeds:
      - id: UniProtKB:Q15465
        gene_symbol: SHH
        organism: Homo sapiens
        gene_review: genes/human/SHH/SHH-ai-review.yaml
      - id: UniProtKB:Q14623
        gene_symbol: IHH
        organism: Homo sapiens
      - id: UniProtKB:O43323
        gene_symbol: DHH
        organism: Homo sapiens
    assessment: UNRESOLVED
    assessment_reason: >-
      The Hedgehog signaling domain does carry calcium and zinc sites, and they matter: the
      structural work on the HHIP complex assigns them distinct roles at the ligand surface.
      But that work states the generalization for vertebrate Hedgehog proteins, and all
      three seeds here are human paralogs, while the node is placed at Eumetazoa and
      therefore extends the claim to Drosophila Hedgehog and to any cnidarian descendant.
      Whether the calcium-coordinating residues are conserved outside the vertebrates is a
      sequence question that can be settled directly, and until it is, the depth of this
      particular row is the least supported of the six at this node.
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
