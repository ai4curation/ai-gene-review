      than an order of magnitude. Separately, work on the full-length preproteins reports
      that DHH, unlike SHH and IHH, does not substantially autoprocess or get secreted and
      instead signals juxtacrine. Both observations are cell-culture based, so this is
      recorded as a qualification on family-wide range claims rather than as a loss of
      function.
