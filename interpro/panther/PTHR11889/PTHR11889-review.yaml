family_id: PANTHER:PTHR11889
family_name: HEDGEHOG
preferred_name: Hedgehog morphogen family (Hint/Hog autoprocessing ligands)
summary: >-
  PTHR11889 contains the Hedgehog ligands, the secreted signals that initiate Hedgehog
  pathway activity across animals. Every member is made as a precursor with two parts: an
  N-terminal signaling domain that carries all the known receptor-binding activity, and a
  C-terminal Hint/Hog domain that is not a signal at all but an enzyme, cleaving the
  precursor and transferring cholesterol onto the new C-terminus of the signaling domain in
  a single reaction cycle. An acyltransferase outside this family then palmitoylates the new
  N-terminus, and the dually lipidated product engages Patched on the receiving cell. The
  family is functionally tight in a way that most PANTHER families are not: the same
  precursor architecture, the same self-processing chemistry, and the same receptor target
  run from the single Drosophila hh gene to the vertebrate SHH, IHH and DHH paralogs. What
  varies between members is not the molecular function but the range and potency of
  signaling, and the vertebrate paralogs differ substantially on both.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All five subfamilies share the Hedgehog precursor architecture, autoprocessing with
  cholesterol transfer, and Patched binding, so the core molecular functions are safe
  family-wide. The exception worth recording is Desert hedgehog (PTHR11889:SF56): when the
  three human ligands are compared head to head, DHH is far less potent than SHH or IHH in
  cell-based assays, and a study of the full-length preproteins reports that DHH does not
  undergo substantial autoprocessing or secretion and signals by cell contact rather than
  at a distance. That does not remove DHH from the family's chemistry, but it makes
  "morphogen", a term implying action over a concentration gradient, unsafe to assert
  across the family without qualification.
