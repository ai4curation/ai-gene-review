family_id: PANTHER:PTHR43828
family_name: ASPARAGINASE
preferred_name: L-asparaginases and fungal Swi4/Mbp1/Swi6 APSES cell-cycle regulators
summary: >-
  PTHR43828 currently spans two functionally different branches: fungal L-asparaginases
  and a derived fungal/APSES ankyrin-repeat transcription-regulator branch containing
  Swi4, Mbp1, Swi6, Cdc10, Res1, Res2, Xbp1-like proteins and Yar1/Rps3 chaperones.
  PAINT already blocks the ancestral asparaginase catalytic and metabolic terms before
  they reach the APSES branch, but several APSES/MBF/SBF transcription and localization
  IBDs are placed too high within the ankyrin-repeat branch and still propagate to
  metazoan chromodomain proteins, Yar1-like Rps3 chaperones, or the wrong duplicated
  fungal subclade.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family root is a mix of L-asparagine amidohydrolases and a fungal ankyrin-repeat
  transcription-regulator radiation. Within the fungal regulator branch, cell-cycle
  transcription functions further subdivide between DNA-binding Swi4/Mbp1/Res1/Res2
  proteins, the Swi6/Cdc10 regulatory subunits that contribute to those complexes, the
  Xbp1-like repressors, and compact Yar1-like Rps3 carrier chaperones that lack the
  KilA-N/APSES DNA-binding domain and are not MBF/SBF subunits.
