family_id: PANTHER:PTHR12045
family_name: ALLANTOICASE
preferred_name: Allantoicase (DAL2/ALLC) family
summary: >-
  Allantoicases hydrolyse allantoate to ureidoglycolate and urea in the uric acid degradation pathway
  of bacteria, fungi (S. cerevisiae DAL2, S. pombe SPAC1F7.09c) and non-amniote vertebrates. Amniotes
  lost the pathway, and human ALLC, though retained and transcribed, has no allantoicase activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Allantoicase activity holds for the microbial and fungal members. Amniote ALLC (human) is inactive,
  although it sits in the same subfamily (SF3).
