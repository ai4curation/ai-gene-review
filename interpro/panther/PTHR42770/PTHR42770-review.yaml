subfamilies:
- subfamily_id: PANTHER:PTHR42770:SF18
  label: ARGININE_AGMATINE ANTIPORTER
  description: Enterobacterial AdiC arginine/agmatine antiporters of the arginine-dependent acid resistance
    system (E. coli, Shigella, Salmonella, Yersinia), plus uncharacterized Mycoplasma (MG225/MG226) and
    M. tuberculosis (Rv1979c) members.
  representative_members:
  - *id001
  - id: UniProtKB:Q8ZGS9
    label: Arginine/agmatine antiporter
    gene_symbol: adiC
    organism: Yersinia pestis
  diverged_from_family: true
  divergence_description: Strictly coupled L-arginine/agmatine exchange (GO:0043862), established for
    E. coli AdiC by reconstitution; the PAINT node PTN000208967 confines the term to Gammaproteobacteria,
    so the uncharacterized Mycoplasma and Mycobacterium members of SF18 do not inherit it.
  supported_by:
  - &id002
    reference_id: PMID:17099215
    supporting_text: Purified AdiC reconstituted into liposomes exchanges arginine and agmatine in a strictly
      coupled, electrogenic fashion.
  - reference_id: file:interpro/panther/PTHR42770/PTHR42770-entries.csv
    supporting_text: P60061,Arginine/agmatine antiporter
  - reference_id: file:interpro/panther/PTHR42770/PTHR42770-entries.csv
    supporting_text: P9WQM5,Uncharacterized transporter Rv1979c
- subfamily_id: PANTHER:PTHR42770:SF7
  label: MEMBRANE PROTEIN
  description: 'Mixed subfamily: TIGR00908/IPR004757 ethanolamine permeases (Eat) encoded beside eutBC
    (P. putida PP_0544, P. aeruginosa PA4023), together with uncharacterized transporters that lack IPR004757
    (M. tuberculosis Rv1999c, Mycoplasma pneumoniae MPN_095, Sinorhizobium R00093, a Sulfolobus virus
    protein). PANTHER''s own release-19.0 classification files place P. aeruginosa PA4023 in PTHR43243:SF48
    rather than PTHR42770:SF7 (UniProt''s cross-reference), so even the PANTHER family of the Eat clade
    is unsettled; PP_0544 is assigned to SF7 by UniProt.'
  representative_members:
  - id: UniProtKB:Q88QF0
    label: Ethanolamine transporter
    gene_symbol: PP_0544
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/PP_0544/PP_0544-ai-review.yaml
  - id: UniProtKB:Q9HX04
    label: Probable transport protein
    gene_symbol: PA4023
    organism: Pseudomonas aeruginosa PAO1
  - id: UniProtKB:P9WQM3
    label: Uncharacterized transporter Rv1999c
    gene_symbol: Rv1999c
    organism: Mycobacterium tuberculosis H37Rv
  diverged_from_family: true
  divergence_description: The IPR004757-positive members are predicted ethanolamine permeases (GO:0034228)
    from family-model seeds and conserved eut-locus context; no member has a direct transport assay. Because
    SF7 also contains IPR004757-negative uncharacterized transporters, the ethanolamine assignment must
    be made by IPR004757/TIGR00908 membership, not by SF7.
  supported_by:
  - &id005
    reference_id: file:genes/PSEPK/PP_0544/PP_0544-bioinformatics/RESULTS.md
    supporting_text: The three genes used as the seed for this model (from Burkholderia pseudomallei,
      Pseudomonas aeruginosa and Clostridium acetobutylicum are all adjacent to genes for the catabolism
      of ethanolamine.
  - &id006
    reference_id: file:genes/PSEPK/PP_0544/PP_0544-bioinformatics/RESULTS.md
    supporting_text: '| P9WQM3 | Rv1999c | Uncharacterized transporter Rv1999c | IPR002293;IPR050367;
      | PTHR42770;PTHR42770:SF7; |  | no |'
  - &id007
    reference_id: file:genes/PSEPK/PP_0544/PP_0544-bioinformatics/RESULTS.md
    supporting_text: '| Q9HX04 | PA4023 | Probable transport protein | IPR002293;IPR050367;IPR004757;
      | PTHR42770;PTHR42770:SF7; | TIGR00908; | yes |'
  - reference_id: PMID:27325678
    supporting_text: This pathway is encoded by the PA4022-eat-eutBC operon and consists of a transport
      protein (Eat), an ethanolamine-ammonia lyase (EutBC), and an acetaldehyde dehydrogenase (PA4022).
