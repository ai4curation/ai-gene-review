family_id: PANTHER:PTHR42770
family_name: AMINO ACID TRANSPORTER-RELATED
preferred_name: 'APC superfamily: prokaryotic amino acid/polyamine antiporters and permeases (AdiC-like)'
summary: 'Prokaryotic (mostly bacterial, some archaeal) members of the amino acid-polyamine-organocation
  (APC) superfamily of secondary transporters. All members are predicted or shown to be 12-transmembrane-helix
  cytoplasmic-membrane proteins with the LeuT-like 5+5 inverted-repeat fold, for which the E. coli arginine/agmatine
  antiporter AdiC is the structural paradigm. Substrates and coupling differ between subfamilies: the
  acid-resistance decarboxylase-coupled exchangers AdiC (arginine/agmatine), CadB (lysine/cadaverine)
  and GadC (glutamate/GABA); arginine/ornithine antiporters (ArcD) of the arginine deiminase pathway;
  the putrescine transporters PotE, PuuP and PlaP; the methionine/branched-chain amino acid exporter YjeH;
  the chlamydial arginine/agmatine exchanger AaxC, which acquired its function convergently; and the ethanolamine
  permeases (Eat; NCBIfam TIGR00908, InterPro IPR004757) encoded next to eutBC in Pseudomonas, Burkholderia,
  Rhodococcus and Clostridium, which sit in the otherwise uncharacterized subfamily SF7. Transmembrane
  transporter activity and plasma-membrane location are safe for the whole family; substrate-specific
  terms are safe only within the clades in which they were measured.'
functional_coherence: HETEROGENEOUS
coherence_reason: 'The family shares one fold and transport mechanism class but lumps transporters of
  unrelated substrates and coupling modes: arginine/agmatine (SF18 AdiC; SF4 chlamydial AaxC), arginine/ornithine
  (SF4 ArcD), lysine/cadaverine (SF5 CadB), putrescine/ornithine (SF6 PotE), putrescine uptake (SF8 PuuP,
  SF1 PlaP), glutamate/GABA (SF15 GadC), methionine/branched-chain amino acid export (SF13 YjeH) and ethanolamine
  (IPR004757 members of SF7). Even single subfamilies are mixed: SF4 contains both ArcD arginine/ornithine
  antiporters and AaxC arginine/agmatine antiporters, SF18 adds uncharacterized Mycoplasma and Mycobacterium
  proteins to the enterobacterial AdiC clade, and SF7 ("MEMBRANE PROTEIN") mixes TIGR00908 ethanolamine
  permeases with uncharacterized mycobacterial, Mycoplasma and Sinorhizobium transporters that lack the
  IPR004757 signature. No substrate-specific term is therefore safe at family level, and the ethanolamine-permease
  assignment cannot be grounded to PTHR42770 or to SF7.'
