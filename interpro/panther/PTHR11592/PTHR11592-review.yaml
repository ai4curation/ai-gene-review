    label: response to oxidative stress
  scope: UNRESOLVED
  scope_reason: BtuE is induced by oxidative-stress elicitors and reduces several peroxide substrates;
    characterized GPX4 provides an additional lipid-peroxide-defense branch. Neither difference in electron
    donor nor substrate specialization excludes a general oxidative-stress role. Secretory and specialized
    GPX-fold proteins still require physiological evidence, so the complete stress-response-positive set
    is unresolved rather than restricted to BtuE.
