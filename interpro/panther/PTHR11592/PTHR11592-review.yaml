family_id: PANTHER:PTHR11592
family_name: GLUTATHIONE PEROXIDASE
preferred_name: Glutathione-peroxidase-fold peroxide enzymes
summary: GPX-fold proteins reduce peroxide substrates using distinct electron-donor systems. The family
  includes glutathione-dependent enzymes, thioredoxin-supported enzymes, cysteine and selenocysteine forms,
  and specialized secretory-pathway members.
functional_coherence: HETEROGENEOUS
coherence_reason: BtuE biochemical peroxide reduction is relevant to the Xanthomonas BtuE-like target,
  supporting an oxidative-stress role. Glutathione specificity must not be inferred for every homolog,
  and general oxidative-stress participation does not establish lipid-peroxide substrate preference or
  ferroptosis regulation.
