family_id: PANTHER:PTHR10078
family_name: INTERLEUKIN-1 FAMILY MEMBER
preferred_name: Interleukin-1 Family Member
summary: INTERLEUKIN-1 FAMILY MEMBER (PANTHER:PTHR10078) is characterized in PANTHER PAINT across 5 ancestral PTN
  node(s) (PANTHER:PTN000008588, PANTHER:PTN000008680, PANTHER:PTN002560644, PANTHER:PTN002560666 (+1 more)) with
  13 IBD node assertion(s) and 3 term(s) carrying negated IRD/IKR branch blocks, covering positive regulation of
  T cell differentiation (GO:0045582, BP), positive regulation of immature T cell proliferation in thymus (GO:0033092,
  BP), positive regulation of canonical NF-kappaB signal transduction (GO:0043123, BP), regulation of ERK1 and ERK2
  cascade (GO:0070372, BP) and 9 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR10078 (INTERLEUKIN-1 FAMILY MEMBER) span 5 distinct ancestral
  PTN nodes (PANTHER:PTN000008588, PANTHER:PTN000008680, PANTHER:PTN002560644, PANTHER:PTN002560666, PANTHER:PTN007419360)
  with different molecular function assignments across clades (cytokine activity (GO:0005125), interleukin-1 receptor
  antagonist activity (GO:0005152)), indicating clade-level functional specialization across the family.
