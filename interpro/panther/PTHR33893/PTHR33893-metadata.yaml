  name:
    name: Insulin-like regulatory peptides
    short: Insulin-like_regulatory
  description:
  - text: This family of proteins includes insulin-like peptides that are implicated
      in the regulation of synapse development at neuromuscular junctions and may
      influence aging processes. They are likely involved in the negative regulation
      of dauer formation in response to environmental conditions, acting through the
      daf-2/InsR signaling pathway. Some members also affect chemotaxis responses
      to high salt concentrations by acting on specific sensory neurons.
