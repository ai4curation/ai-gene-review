  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    PTN001138802 is a single leaf, the Nematostella vectensis draft-genome protein A7T9W3
    (NEMVEDRAFT_v1g224310), sitting inside the bacterial MurD clade. Stopping the term here is right,
    and for a reason stronger than divergence: peptidoglycan is a bacterial (and plastid) macromolecule,
    an anthozoan has no peptidoglycan, no other step of the pathway, and no substrate for the reaction,
    so the ligase activity has nowhere to act. The placement is best read as a bacterial sequence in
    the draft assembly rather than a cnidarian gene: the adjacent gene model NEMVEDRAFT_v1g224311
    (A7T9W4) is classified in the MurC family PTHR43445, which is the pattern a contaminating
    bacterial contig produces and not what a eukaryotic host pathway would look like. An IRD, which
    stops the ancestral IBD without leaving a NOT annotation on the gene, is the appropriate mechanism;
    the companion IRD on the process term is assessed separately below.
