term_assessments:
- assessed_term:
    id: GO:0008764
    label: UDP-N-acetylmuramoylalanine-D-glutamate ligase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The reaction defines the family and PANTHER keeps every member in one subfamily, so a family-wide
    grant is the only scope the classification can express, and it is right for the bacterial members
    (characterised in E. coli, with the S. aureus and P. aeruginosa orthologs seeding the PAINT node)
    and for the plant orthologs of the plastid peptidoglycan pathway. Three qualifications belong with
    it: Nematostella vectensis A7T9W3 is excepted below; the archaeal MTH_531 (O26631) is 312 residues
    and uncharacterised, so its activity is assumed rather than known; and the ten murD2 entries that
    UniProt names L-glutamate ligases would, if that naming reflects real stereospecificity, need a
    separate term, which no cached publication establishes either way.
  member_exceptions:
  - member:
      id: UniProtKB:A7T9W3
      label: NEMVEDRAFT_v1g224310
      organism: Nematostella vectensis
    exception_reason: >-
      An anthozoan protein inside the bacterial MurD clade, with no peptidoglycan, no pathway and no
      substrate in its organism; the neighbouring gene model A7T9W4 falls in the MurC family, which
      points to a bacterial sequence in the draft assembly. PAINT already withholds the term here with
