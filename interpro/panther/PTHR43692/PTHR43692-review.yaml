family_id: PANTHER:PTHR43692
family_name: UDP-N-ACETYLMURAMOYLALANINE--D-GLUTAMATE LIGASE
preferred_name: MurD (UDP-MurNAc-L-Ala--D-glutamate ligase) family
summary: >-
  ATP-dependent Mur-ligase-superfamily enzymes that add the second residue of the peptidoglycan stem
  peptide, catalysing ligation of D-glutamate to UDP-N-acetylmuramoyl-L-alanine with hydrolysis of ATP
  to ADP and phosphate. The enzyme is a soluble, three-domain protein whose domains close around the
  nucleotide precursor and Mg-ATP, and in E. coli it is essential and kinetically well characterised;
  it is the structural prototype for the whole MurC/MurD/MurE/MurF series and for folylpolyglutamate
  synthetase. The family contains the bacterial murD genes, the plastid-pathway MurD orthologs of
  streptophyte plants, a single archaeal entry of unknown function, and one cnidarian sequence that
  PAINT explicitly excludes with an IRD.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  D-glutamate addition to UDP-MurNAc-L-Ala is shared by the characterised members and PANTHER keeps the
  entire family in one subfamily, so there is no divergence along the subfamily axis. Two groups sit
  outside that consensus and are recorded as exceptions rather than as subfamilies, because PANTHER
  provides no accession that separates them: Nematostella vectensis A7T9W3, which PAINT removes with an
  IRD at its own leaf, and the archaeal Methanothermobacter entry O26631 (MTH_531, 312 residues against
  a typical 440-500), which is too short for the complete three-domain architecture and has no
  characterised activity. Ten entries named "UDP-N-acetylmuramoyl-L-alanine--L-glutamate ligase"
  (murD2 of Xanthomonas, Xylella, Salinispora and Micromonospora) raise a specificity question the
  cached literature cannot settle.
