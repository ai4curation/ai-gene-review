notes: >-
  Member counts are from PTHR43692-entries.csv (486 members, all in SF1); clade membership and the
  identity of PTN001138802 as the Nematostella vectensis A7T9W3 leaf are from the PANTHER tree for this
  family (54 leaves). No residue sites are recorded: the carbamylated active-site lysine and the
  Mg-ATP ligands of MurD are conserved across the clade and would not discriminate between members,
  and no residue-level account of the murD2 L-glutamate question is available. Two items for upstream
  attention: whether the murD2 entries of Xanthomonadales and Micromonosporaceae really ligate
  L-glutamate, which would need a different GO term, and whether the two Nematostella draft-genome
  Mur-like sequences (A7T9W3 here, A7T9W4 in PTHR43445) should be in reference proteome data at all.
