  assessment: SOUND
  assessment_reason: >-
    MurD performs the second amino-acid addition of the stem peptide, a step with no alternative route:
    its product is required by MurE and MurF, and the cytoplasmic pathway has been reconstituted in
    vitro through to UDP-MurNAc-pentapeptide using these enzymes. The process claim therefore holds for
    every bacterial leaf below the node, and the reviewed recipients accept it. As with the activity
    row, the single E. coli seed is the enzyme on which the step was defined, so a short seed list is
    not weak support here.
