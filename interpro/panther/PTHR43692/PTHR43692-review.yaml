  assessment: SOUND
  assessment_reason: >-
    The node holds 34 of the tree's 54 leaves: bacterial murD genes from across the phyla, seeded by
    three experimentally grounded members (the purified, kinetically characterised and crystallised
    E. coli enzyme, plus the S. aureus and P. aeruginosa orthologs). Its boundary is informative: the
    twenty streptophyte MurD leaves lie outside it, so plant orthologs inherit nothing from this row,
    and the one metazoan leaf that is inside is withdrawn by the IRD assessed below. Two points were
    checked and do not change the verdict. Xanthomonas campestris Q8P775, below the node, is one of the
    ten entries UniProt names an L-glutamate rather than D-glutamate ligase; no cached publication
    tests the stereospecificity of any of them, so the possibility that this branch uses a different
    isomer is recorded as an open question rather than treated as a loss. The archaeal MTH_531 is not
    below the node and so is unaffected.
