family_id: PANTHER:PTHR23515
family_name: HIGH-AFFINITY NITRATE TRANSPORTER 2.3
preferred_name: Nitrate/nitrite porter (NNP) family of the major facilitator superfamily
summary: >-
  The nitrate/nitrite porter (NNP, TC 2.A.1.8) family of the major facilitator
  superfamily. Members move nitrate, and in many cases nitrite, across the plasma
  membrane: bacterial NarK and NarU, which import nitrate and export or import
  nitrite during nitrate respiration; bacterial assimilatory nitrate porters such
  as Bacillus subtilis NasA and Pseudomonas putida KT2440 NasA (PP_2092); fungal
  CrnA; and the plant NRT2 high-affinity nitrate transporters. Plant NRT2.7 is
  the exception in location: it sits in the vacuolar membrane rather than the
  plasma membrane. The energy coupling (nitrate/H+ symport or nitrate/nitrite
  antiport) differs between members and is unresolved for NarU.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Nearly all of the 45 Swiss-Prot members are nitrate or nitrate/nitrite
  transporters (NarK, NarU, NarT, NrtP, NasA, CrnA, plant NRT2). One fungal
  member, the elsinochrome efflux transporter ECT1 of Elsinoe fawcettii, is not a
  nitrate transporter. Nitrite transport is demonstrated for NarK/NarU but not
  for the assimilatory NasA porters, and NRT2.7 has moved to the vacuolar
  membrane.
