  assessment_reason: >-
    Nitrate transport is the ancestral, shared activity of the NNP family. Seeds
    span plants, fungi and E. coli NarU, and the bacterial assimilatory members
    are independently supported: B. subtilis nasA mutants cannot grow on nitrate
    although they keep nitrate reductase, and PP_2092 is the nitrate transporter
    identified by KT2440 fitness profiling. The fungal ECT1 outlier is the only
    member for which the inherited activity is doubtful.
