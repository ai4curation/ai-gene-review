term_assessments:
- assessed_term:
    id: GO:0015112
    label: nitrate transmembrane transporter activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The shared activity of the NNP family, placed at the root by PAINT and
    supported independently for respiratory NarU and for the assimilatory NasA
    porters of Bacillus and Pseudomonas. The fungal elsinochrome transporter ECT1
    (B1A0U4) is a known outlier that has no gene review here.
  supported_by:
  - reference_id: file:interpro/panther/PTHR23515/PTHR23515-paint.tsv
    supporting_text: "PTHR23515\tPTN009073875\tGO:0015112\tF\tIBD\tfalse"
  - reference_id: PMID:18691156
    supporting_text: NarK and NarU, catalyse nitrate uptake, nitrite export and nitrite uptake across
      the Escherichia coli cytoplasmic membrane
- assessed_term:
    id: GO:0015113
    label: nitrite transmembrane transporter activity
  scope: UNRESOLVED
  scope_reason: >-
    Nitrite transport is shown for E. coli NarK and NarU and inferred for a fungal
    clade, but not for the assimilatory NasA porters: B. subtilis nasA mutants
    still use nitrite, and PP_2092 shows no nitrite-condition fitness defect. It
    must be judged member by member; the NasA reviews mark the InterPro-derived
    nitrite rows as over-annotated.
  supported_by:
  - reference_id: PMID:35285712
    supporting_text: However, no significant phenotype could be detected for this gene in the nitrite
      condition, suggesting that it may be specific to nitrate.
