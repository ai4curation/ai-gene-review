family_id: PANTHER:PTHR34772
family_name: RNA-BINDING PROTEIN HFQ
preferred_name: Hfq Sm-like RNA chaperone family
summary: 'Bacterial Hfq proteins: Sm-like hexameric RNA chaperones that bind small regulatory RNAs and
  mRNAs through proximal, distal and rim faces, promoting sRNA-mRNA pairing, protecting sRNAs and modulating
  translation and mRNA decay. In Pseudomonadaceae Hfq additionally partners with the co-repressor Crc
  to recognise A-rich catabolite-activity motifs and repress translation of catabolic mRNAs.'
functional_coherence: COHERENT
coherence_reason: One subfamily of Hfq orthologs sharing RNA binding; the Crc partnership is a lineage-specific
  use of the conserved distal-face A-rich binding rather than a divergence.
