family_id: PANTHER:PTHR20950
family_name: GALANIN-RELATED PEPTIDE
preferred_name: Galanin-like peptide (GALP) family
summary: >-
  Secreted mammalian prepro-neuropeptide precursors of the galanin-like peptide family
  (PANTHER:PTHR20950:SF1, InterPro:IPR039244), proteolytically processed into mature 60-residue
  non-amidated galanin-like peptide (GALP, residues 25-84 of human prepro-GALP) and alarin (a
  25-residue splice variant). Mature GALP(1-60) contains a 13-residue core segment (GALP
  residues 9-21: Gly-Trp-Thr-Leu-Asn-Ser-Ala-Gly-Tyr-Leu-Leu-Gly-Pro) that is 100% identical to
  the N-terminal receptor-activating pharmacophore of galanin (GAL residues 1-13), enabling
  GALP to act as an endogenous neuropeptide hormone (GO:0005184) that binds and activates
  galanin G protein-coupled receptors (preferentially GALR2 and GALR3 over GALR1) in the
  galanin-activated signaling pathway (GO:0090663) to regulate hypothalamic feeding behavior,
  energy homeostasis, and gonadotropin-releasing hormone / luteinizing hormone secretion.
functional_coherence: COHERENT
coherence_reason: >-
  PANTHER:PTHR20950 is a single-subfamily mammalian neuropeptide family (PANTHER:PTHR20950:SF1
  GALANIN-LIKE PEPTIDE) whose orthologs all encode secreted galanin-like peptide (GALP)
  precursors enabling neuropeptide hormone activity (GO:0005184) in the extracellular region
  (GO:0005576) and initiating the galanin-activated signaling pathway (GO:0090663). Currently,
  PAINT places only the organismal phenotype term GO:0042595 (behavioral response to starvation)
  at the Eutheria root node PTN001463568, omitting GO:0005576 (extracellular region), GO:0005184
  (neuropeptide hormone activity), and GO:0090663 (galanin-activated signaling pathway)
  (Category A pathway gap).
