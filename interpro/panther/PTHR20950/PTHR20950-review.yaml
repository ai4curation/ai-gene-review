  description: >-
    Mammalian galanin-like peptide (GALP) orthologs. Synthesized in arcuate nucleus
    hypothalamic neurons and posterior pituitary pituicytes as a 115- to 120-residue precursor
    and processed into mature 60-residue GALP, whose residues 9-21 are identical to galanin
    residues 1-13 and which acts as an endogenous neuropeptide hormone agonist of galanin
    receptors (GALR2, GALR3, and GALR1) in the galanin-activated signaling pathway (GO:0090663).
