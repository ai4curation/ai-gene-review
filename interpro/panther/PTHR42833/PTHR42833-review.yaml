family_id: PANTHER:PTHR42833
family_name: URIDYLATE KINASE
preferred_name: PyrH-type (amino-acid-kinase fold) UMP kinase family
summary: >-
  Bacterial-type UMP kinases (PyrH) phosphorylate UMP to UDP with ATP. They belong to the
  amino-acid kinase (aspartokinase) fold, which is unrelated to the adenylate-kinase-fold UMP/CMP
  kinases of the eukaryotic cytosol (PTHR23359). PyrH is the UMP kinase of bacteria, and the same
  family supplies the plastid enzyme of plants. Arabidopsis PUMPKIN is the sole plastid UMP
  kinase; it converts UMP to UDP in vitro and also binds group II introns of plastid transcripts.
  The reviewed membership (555 entries, almost all 217 to 270 residues) is nearly all bacterial
  PyrH in SF4. PANTHER also places Azotobacter vinelandii MosB, a molybdenum storage protein
  subunit, in this family. S. cerevisiae and S. pombe have no member.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  UMP kinase activity is shared by the characterized bacterial and plastid members. The one
  reviewed member with a different name is Azotobacter MosB (P84253, molybdenum storage protein
  subunit beta, in SF4), whose UMP kinase activity has not been checked here. It receives no
  PAINT IBA, so nothing currently propagates to it. PUMPKIN's RNA binding is an extra plant
  function on top of the conserved catalysis.
