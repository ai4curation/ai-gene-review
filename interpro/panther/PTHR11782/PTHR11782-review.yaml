family_id: PANTHER:PTHR11782
family_name: ADENOSINE/GUANOSINE DIPHOSPHATASE
summary: NTPDase/apyrase-related enzymes hydrolyze nucleoside di- and triphosphates. Members operate extracellularly
  or in secretory compartments, with different preferences for ATP, ADP, UDP, GDP and other nucleotides.
  These differences connect the family to either extracellular nucleotide signaling or organellar glycosylation
  and nucleotide metabolism.
functional_coherence: HETEROGENEOUS
coherence_reason: NTPDase/apyrase proteins share nucleotide-phosphate hydrolysis but differ in substrate
  preference and membrane orientation. Direct characterization of the single fly NTPase/NTPDase6 found
  an intracellular, primarily ER-localized enzyme that hydrolyzes UDP, GDP and IDP efficiently, with other
  NDPs/NTPs poor substrates (PMID:19467631). Thus the family does not imply a cell-surface ATP-removing
  ectoenzyme for every member. The fly result supports a nucleotide-diphosphatase mechanism in an endomembrane
  context, while ATP preference, extracellular purinergic signaling and an exact glycosylation role require
  separate evidence.
