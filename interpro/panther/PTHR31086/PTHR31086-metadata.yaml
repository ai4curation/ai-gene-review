  name:
    name: Aluminum-activated malate transporter
    short: Al-activated_malate_transptr
  description:
  - text: The Aluminum-activated malate transporter family is involved in the transport
      of malate across membranes, which is critical for aluminum tolerance in plants.
      Members of the family are permeable to chloride, nitrate, sulfate, and malate,
      and are regulated by external aluminum. Some are involved in stomatal closure,
      which is induced by various factors including darkness, CO2, abscisic acid,
      and water deficiency. The family includes vacuolar malate channels with selectivity
      for malate over fumarate and may exhibit weak chloride conductance. The expression
      of some members is dependent on the STOP1 transcription factor.
