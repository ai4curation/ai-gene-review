family_id: PANTHER:PTHR43411
family_name: ADENYLOSUCCINATE LYASE
preferred_name: Gammaproteobacterial-type PurB adenylosuccinate lyases (E. coli PurB family)
summary: >-
  Adenylosuccinate lyase (PurB/ADSL; EC 4.3.2.2) is a homotetrameric member of the fumarase
  C/argininosuccinate lyase superfamily. One active site catalyses two non-consecutive
  fumarate-eliminating steps of purine synthesis: SAICAR to AICAR plus fumarate (step 8 of de novo
  IMP synthesis), and adenylosuccinate to AMP plus fumarate (the second step of the IMP-to-AMP
  branch). PANTHER splits PurB proteins into two families. This one holds the E. coli-type enzymes
  of gammaproteobacteria (E. coli, Haemophilus, Pseudomonas, Vibrio, Legionella, Buchnera) together
  with Dictyostelium purB and the Arabidopsis homologs. The other, PTHR43172, holds B. subtilis PurB
  and the animal and fungal ADSL enzymes.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed members in the fetched inventory (11, all SF1) are PurB adenylosuccinate lyases. The
  PAINT recipients of the family's activity node are PurB/ADSL proteins. No paralog with a different
  substrate (for example the fluopsin C lyases or 3-carboxy-cis,cis-muconate cycloisomerase) is
  classified here; those sit in PTHR43172.
