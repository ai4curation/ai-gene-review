  name:
    name: Interferon Regulatory Factor
    short: IRF
  description:
  - text: The IRF family comprises transcriptional regulators with diverse roles in
      immunity, including the regulation of interferon (IFN) and IFN-inducible genes,
      cellular responses to viral and bacterial infections, hematopoiesis, inflammation,
      immune responses, cell proliferation and differentiation, cell cycle regulation,
      DNA damage response, and apoptosis. Members can act as transcriptional activators
      or repressors, binding to interferon-stimulated response elements (ISRE) in
      gene promoters. They are involved in innate and adaptive immune responses, affecting
      the maturation and activity of various immune cells, and can also function as
      tumor suppressors. Some family members are regulated by phosphorylation, which
      affects their dimerization, nuclear localization, and DNA-binding activity.
