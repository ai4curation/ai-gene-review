family_id: PANTHER:PTHR10480
family_name: PROTEIN UNC-13 HOMOLOG
preferred_name: Munc13/UNC-13 synaptic vesicle priming factors
summary: >-
  Large multidomain presynaptic active-zone proteins of animals: vertebrate
  Munc13-1, -2 and -3 (UNC13A, UNC13B, UNC13C) and their invertebrate
  orthologs (C. elegans UNC-13, Drosophila Dunc-13). Each carries a
  diacylglycerol/phorbol-ester-binding C1 domain, C2 domains (C2A, C2B, C2C)
  and the MUN domain, which catalyses the transition of syntaxin-1 from the
  closed syntaxin-Munc18 complex into the SNARE complex. This priming step
  renders docked synaptic vesicles, and dense-core vesicles and secretory
  granules, competent for calcium-triggered fusion. Munc13-4 (UNC13D) and
  BAIAP3 are not members of this PANTHER family.
functional_coherence: COHERENT
coherence_reason: >-
  All characterized members are vesicle priming factors acting through the MUN
  domain on syntaxin-1 at the presynaptic plasma membrane, and every PAINT term
  in the family descends from two closely nested animal nodes. The vertebrate
  paralogs differ in expression and in which synapses depend on them (Munc13-1
  is essential at most glutamatergic synapses), not in molecular function.
