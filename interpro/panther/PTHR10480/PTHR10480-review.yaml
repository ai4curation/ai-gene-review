notes: >-
  All six subfamilies inherit all ten PAINT terms (TreeGrafter annotation
  rows), so no subfamily-level divergence is claimed. Seed identities given as
  RGD and MGI ids were not resolved to gene symbols and the seed papers were not
  read; in particular the single seed of the synaptic vesicle membrane
  assertion (RGD:628592) is unexamined. Members not examined: UNC13B, UNC13C,
  mouse and rat paralogs, Drosophila Dunc-13 and the small SF14/SF15
  subfamilies. Glutamatergic transmission, neuromuscular junction and terminal
  bouton were judged as context terms only; the transmitter-type dependence of
  individual paralogs (Munc13-1 at glutamatergic versus Munc13-2 at some GABA
  synapses) was not assessed.
