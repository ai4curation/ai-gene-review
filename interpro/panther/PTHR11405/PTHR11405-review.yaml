family_id: PANTHER:PTHR11405
family_name: CARBAMOYLTRANSFERASE FAMILY MEMBER
preferred_name: Carbamoyl-phosphate synthase chains and CAD-type multifunctional proteins
summary: 'Carbamoyl-phosphate synthase (CPS) proteins. SF53 holds the CPS large (synthetase) chains: bacterial
  CarB, the fungal arginine-specific CPSase A large chains (S. cerevisiae CPA2, S. pombe arg4), plant
  chloroplastic CARB, Bacillus-type pyrimidine-specific PyrAB, split archaeal CarB halves, and vertebrate
  mitochondrial CPS1. SF4 holds the fungal and plant arginine-specific small (glutamine amidotransferase)
  chains such as S. cerevisiae CPA1. SF5 holds the CAD-type multifunctional proteins of pyrimidine synthesis
  (human CAD, yeast URA2, S. pombe ura1), which fuse glutamine amidotransferase, synthetase and aspartate
  carbamoyltransferase domains.'
functional_coherence: HETEROGENEOUS
coherence_reason: Members share carbamoyl-phosphate synthesis but differ in subunit role (synthetase large
  chain versus glutaminase small chain), nitrogen donor (glutamine-dependent CarB/CPSase A versus ammonia-dependent
  vertebrate CPS1), pathway (arginine-specific, pyrimidine-specific, shared, or urea cycle) and domain
  architecture (CAD-type fusions add aspartate carbamoyltransferase and, outside fungi, dihydroorotase).
