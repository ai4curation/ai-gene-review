- node_id: PANTHER:PTN000892150
  asserted_term:
    id: GO:0004088
    label: carbamoyl-phosphate synthase (glutamine-hydrolyzing) activity
  evidence: IRD
  negated: true
  paint_snapshot: '20181129'
  seeds:
  - id: PANTHER:PTN000150223
  assessment: UNRESOLVED
  assessment_reason: This IRD stops glutamine-dependent carbamoyl-phosphate synthase activity at the fungal
    arginine-specific large-chain node (S. cerevisiae CPA2, S. pombe arg4). CPA2 accepts the ammonia cleaved
    from glutamine by CPA1 and performs the rest of the glutamine-dependent reaction, and the CPA2 review
    accepts experimental GO:0004088 rows, so the large chain does contribute to the heterodimer's activity.
    The large chain alone does not hydrolyse glutamine, however, and PAINT cannot express contributes_to,
    so the IRD may be PAINT's way of withholding an enables claim from the subunit. Whether the loss is
    right depends on the enables versus contributes_to relation for each subunit, which the term assessment
    below leaves unresolved; no upstream change is requested until that is settled.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11405/PTHR11405-paint.tsv
    supporting_text: "PTHR11405\tPTN000892150\tGO:0004088\tF\tIRD\ttrue"
