  synthase (glutamine-hydrolyzing) activity (GO:0004088), aspartate carbamoyltransferase activity (GO:0004070),
  dihydroorotase activity (GO:0004151), carbamoyl-phosphate synthase (ammonia) activity (GO:0004087)),
