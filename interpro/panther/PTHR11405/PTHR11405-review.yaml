    label: carbamoyl-phosphate synthase (glutamine-hydrolyzing) activity
  applicable_subfamilies:
  - id: PANTHER:PTHR11405:SF5
    label: CAD PROTEIN
  scope: SUBFAMILY_ONLY
  scope_reason: Glutamine-dependent synthesis is the activity of the two-chain complex or of the fused
    CAD-type protein. Only the SF5 CAD-type proteins carry the glutamine amidotransferase and synthetase
    domains in one chain, so only they enable the term on their own. Large chains (CarB, CPA2) of SF53
    and small chains (CPA1) of SF4 each contribute one half within a heterodimer and are not granted
    the term as an enabled activity; vertebrate CPS1 in SF53 uses free ammonia and should not carry it
    at all.
  supported_by:
  - reference_id: PMID:2679804
    supporting_text: Starting from the amino terminus of the protein, these are glutamine amido
      transferase, CPSase, a domain that resembles dihydroorotase (DHOase-like) but
      does not have DHOase activity, and ATCase.
  - *id001
