family_id: PANTHER:PTHR36504
family_name: LIPOPOLYSACCHARIDE EXPORT SYSTEM PROTEIN LPTA
preferred_name: LptA periplasmic LPS-bridge protein family
summary: LptA-family proteins form a periplasmic beta-jellyroll bridge between the inner-membrane lipid
  extractor and the outer-membrane translocon. In characterized LPS systems, hydrophobic grooves shield
  lipid chains during transfer toward LptD. E. coli LptA has direct binding/transfer evidence, and the
  sequence-matched Neisseria LptH homolog supports native surface LPS delivery. Head-to-tail association
  supports bridge formation, but a fixed universal native copy number is not established. Homologs in
  non-LPS-producing diderms have unresolved cargo.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The single SF1 includes characterized LPS carriers and Deinococcus Q9RS08/DR_2319, whose
  native substrate is unresolved in a non-LPS-producing diderm. A conserved carrier fold does not supply
  universal LPS specificity. Exact Neisseria Q7DDQ9 falls under the same PAINT root and has an independently
  verified H44/76 sequence bridge.
