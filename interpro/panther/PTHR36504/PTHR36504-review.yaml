family_id: PANTHER:PTHR36504
family_name: LIPOPOLYSACCHARIDE EXPORT SYSTEM PROTEIN LPTA
preferred_name: LptA periplasmic LPS-bridge protein family
summary: >-
  LptA proteins are periplasmic beta-jellyroll proteins of the lipopolysaccharide transport
  (Lpt) system of diderm bacteria. Head-to-tail oligomers of LptA connect the beta-jellyroll
  of the inner-membrane protein LptC to the N-terminal beta-jellyroll of the outer-membrane
  translocon LptD, forming a continuous hydrophobic groove through which LPS molecules are
  pushed across the periplasm. In Escherichia coli LptA is essential, binds LPS, and its
  depletion causes LPS to accumulate in the inner membrane. The family consists of a single
  PANTHER subfamily and its members share this bridging role wherever the remaining Lpt
  components are present.
functional_coherence: COHERENT
coherence_reason: >-
  One subfamily (SF1); every PAINT reference-tree member descends from the single IBD node
  PTN002194456, and characterized members (E. coli LptA, P. aeruginosa LptH) are Lpt bridge
  proteins.
