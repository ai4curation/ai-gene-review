notes: Neisseria Q7DDQ9 is the carrier called LptH in PMID21705335, not the unrelated neisserial lipid
  A modifying LptA. Its MC58 record matches the natural H44/76 protein sequence, but native mutant assays
  remain H44/76/HB-1. The 2026 E. coli LptC-A fusion is an engineered structural construct, not a universal
  native bridge stoichiometry measurement. PSEPK outer-membrane association is no longer described as
  an over-annotation. No PAINT payload or loss is invented.
