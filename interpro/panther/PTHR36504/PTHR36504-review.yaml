- assessed_term:
    id: GO:0015920
    label: lipopolysaccharide transport
  scope: UNRESOLVED
  scope_reason: Positive E. coli LPS transfer and native Neisseria LptH participation support the named
    LPS/LOS-bearing module members. However, SF1 also contains Deinococcus Q9RS08/DR_2319 from a non-LPS-producing
    organism. Its native cargo is unresolved; the single subfamily cannot encode a universal LPS-specific
    grant. Retain the positive ancestral PAINT judgment while requiring substrate and compatible-bridge
    context for current module capacity. Oligomerization and engineered fusion structures do not establish
    a fixed universal native LptA stoichiometry.
  supported_by:
