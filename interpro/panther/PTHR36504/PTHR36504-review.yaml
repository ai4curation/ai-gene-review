- node_id: PANTHER:PTN002194456
  asserted_term:
    id: GO:0009279
    label: cell outer membrane
  evidence: IBD
  paint_snapshot: '20170921'
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  seeds:
  - id: UniProtKB:P0ADV1
  assessment: UNRESOLVED
  assessment_reason: >-
    LptA is a soluble periplasmic protein. It associates with the outer membrane only
    through its contact with the LptD N-terminal domain within the trans-envelope bridge,
    and co-fractionation with membranes reflects that bridge. Whether this warrants a
    family-wide outer-membrane location is a convention question; the PSEPK member review
    marks the term over-annotated, and the periplasmic location is the informative one.
  supported_by:
  - reference_id: file:interpro/panther/PTHR36504/PTHR36504-paint.tsv
    supporting_text: "PTHR36504\tPTN002194456\tGO:0009279\tC\tIBD\tfalse"
