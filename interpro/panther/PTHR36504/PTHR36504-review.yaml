  - id: UniProtKB:P0ADV1
  assessment: SOUND
  assessment_reason: >-
    The node placement is right: LptA moves a glycolipid (LPS) between membranes while
    shielding its acyl chains in a hydrophobic groove. The more specific GO:0140332
    lipopolysaccharide transfer activity is preferred by the member gene reviews; it is not
    an is_a child of GO:0017089 in current GO, so the two terms are recorded side by side
    rather than as a refinement.
  supported_by:
