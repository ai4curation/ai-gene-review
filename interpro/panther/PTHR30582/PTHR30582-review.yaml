family_id: PANTHER:PTHR30582
family_name: L,D-TRANSPEPTIDASE
preferred_name: Bacterial L,D-transpeptidase family (YkuD / ErfK-YbiS-YcfS-YnhG and 3-3 crosslinking Ldts)
summary: >-
  A large bacterial family of YkuD-domain L,D-transpeptidases. All members share
  a cysteine catalytic residue that cleaves the mDap(3)-D-Ala(4) bond of a
  tetrapeptide peptidoglycan donor stem and forms a new amide bond to an
  acceptor. The family splits by acceptor: one group (the Enterobacterial
  ErfK/YbiS/YcfS/YnhG enzymes, LdtA-F, including the SF24 ErfK subfamily)
  transfers the stem onto the C-terminal lysine of Braun's lipoprotein Lpp or
  the pseudomonad lipoprotein OprI, covalently anchoring an outer-membrane
  lipoprotein to peptidoglycan; another group (the YciB-related SF2 enzymes,
  e.g. the Mycobacterium tuberculosis LdtMt proteins) forms 3-3 peptidoglycan
  crosslinks between two stems. Some members are inactivated by carbapenems that
  acylate the catalytic cysteine.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family shares the YkuD catalytic fold and L,D-transpeptidase chemistry
  (GO:0071972 is safe family-wide), but the physiological acceptor and process
  differ by subfamily: the ErfK/YbiS/YcfS/YnhG group anchors an outer-membrane
  lipoprotein to peptidoglycan (peptidoglycan-protein cross-linking, GO:0018104),
  whereas the YciB/Mtb group forms 3-3 peptide crosslinks. No single process
  term below GO:0071972 is safe across all subfamilies.
