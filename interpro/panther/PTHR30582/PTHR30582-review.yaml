notes: >-
  Reviewed for the module gram_negative_lipoprotein_peptidoglycan_tether_remodeling.
  The module grounds its tether-formation step on SF24 (ErfK/LdtPae2), whose
  OprI-anchoring activity is experimentally established for P. aeruginosa PA2854
  (PMID:42100858) and PA14 LdtPae2 (PMID:37255442). PTN001255072 is a deep node
  spanning the lipoprotein-anchoring and 3-3-crosslinking subfamilies; GO:0071972
  is family-wide while GO:0018104 is scoped to the anchoring subfamilies.
