term_assessments:
- assessed_term:
    id: GO:0071972
    label: peptidoglycan L,D-transpeptidase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    All PTHR30582 members are YkuD-domain L,D-transpeptidases that cleave the
    mDap-D-Ala bond of a tetrapeptide donor and transfer the stem to an acceptor;
    the catalytic class is shared whether the acceptor is another stem (3-3
    crosslink) or a lipoprotein lysine (anchoring).
  supported_by:
  - reference_id: file:interpro/panther/PTHR30582/PTHR30582-paint.tsv
    supporting_text: "PTHR30582\tPTN001255072\tGO:0071972\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0018104
    label: peptidoglycan-protein cross-linking
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Covalent anchoring of an outer-membrane lipoprotein to peptidoglycan is the
    process of the ErfK/YbiS/YcfS/YnhG anchoring subfamilies, not the YciB/Mtb
    3-3-crosslinking subfamily. It is directly demonstrated for the SF24 enzyme
    PA2854 (OprI anchoring) and realized by the E. coli YbiS/YcfS/YnhG enzymes on
    Braun's lipoprotein.
  applicable_subfamilies:
