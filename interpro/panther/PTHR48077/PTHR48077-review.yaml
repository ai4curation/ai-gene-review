family_id: PANTHER:PTHR48077
family_name: TRYPTOPHAN SYNTHASE-RELATED
preferred_name: Tryptophan synthase (TrpB / fungal TRP5) family
summary: >-
  PLP-dependent tryptophan synthases: bacterial TrpB beta chains (P. putida TrpB) and fungal single-chain
  alpha-beta fusions (S. cerevisiae TRP5, S. pombe trp2) that condense indole with serine to make
  tryptophan.
functional_coherence: COHERENT
coherence_reason: Both subfamilies (SF3, SF6) are tryptophan synthase beta proteins.
