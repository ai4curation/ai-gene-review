family_id: PANTHER:PTHR48077
family_name: TRYPTOPHAN SYNTHASE-RELATED
preferred_name: Tryptophan synthase beta chain (TrpB) and fungal single-chain tryptophan synthase family
summary: >-
  PLP-dependent fold-type II enzymes that condense indole with L-serine to form
  L-tryptophan. SF3 holds the canonical TrpB beta chains of bacteria and
  plants, which work with TrpA (PTHR43406) in the alpha2-beta2 tryptophan
  synthase (E. coli TrpB, P. putida TrpB, Arabidopsis TSB1/TSB2). It also holds
  the fungal single-chain tryptophan synthases, in which an N-terminal TrpA-like
  domain is fused to the TrpB domain (S. cerevisiae TRP5, S. pombe trp2,
  Neurospora trp-3, P13228; the Neurospora trp-1 protein, P00908, is the
  trifunctional TrpG-TrpC-TrpF enzyme classified in PTHR43418:SF4). SF6 holds the TrpB2-type proteins of archaea and
  thermophilic bacteria, a distinct beta-chain lineage that is not part of the
  canonical TrpA-TrpB complex.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF3 (427 reviewed members) is uniformly the tryptophan synthase beta chain or
  the fused fungal enzyme. SF6 (28 reviewed members, mostly archaeal, many
  named trpB2) forms a separate beta-chain lineage whose partnership with TrpA,
  and so whether it performs the full GO:0004834 reaction, is not reviewed here.
