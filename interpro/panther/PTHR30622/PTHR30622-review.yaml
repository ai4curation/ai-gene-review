- node_id: PANTHER:PTN001255889
  asserted_term:
    id: GO:0005886
    label: plasma membrane
  evidence: IBD
  paint_snapshot: '20240912'
  seeds:
  - id: UniProtKB:P60932
  assessment: SOUND
  assessment_reason: >-
    All members are polytopic membrane proteins, and in prokaryotes the cytoplasmic
    (inner) membrane is the only membrane where the lipid carrier is handled.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30622/PTHR30622-paint.tsv
    supporting_text: "PTHR30622\tPTN001255889\tGO:0005886\tC\tIBD\tfalse"
