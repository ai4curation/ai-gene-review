- node_id: PANTHER:PTN001255889
  asserted_term:
    id: GO:0000270
    label: peptidoglycan metabolic process
  evidence: IBD
  paint_snapshot: '20240912'
  seeds:
  - id: UniProtKB:P60932
  assessment: TOO_DEEP
  assessment_reason: >-
    Correct for bacterial members, which supply and recycle the carrier used for
    peptidoglycan synthesis. But PAINT placed it at the family root, which also covers
    the archaeal UppP homologs (SF2, and methanogen members of SF3/SF4 such as
    Methanococcus and Methanopyrus). These organisms make no peptidoglycan. The GO:0000270
    definition (checked in OLS) describes peptidoglycans as "any of a class of
    glycoconjugates found only in bacterial cell walls". Pseudomurein-forming archaea
    (Methanobacteriales, e.g. Methanobrevibacter, Methanothermobacter) probably use an
    analogous polyprenyl-phosphate carrier cycle for their wall polymer, which would make
    their UppP homologs part of a pseudomurein or other glycan process, not peptidoglycan
    metabolism. The term belongs on a Bacteria-restricted node, or should be negated for
    archaeal clades.
  affected_subfamilies:
  - id: PANTHER:PTHR30622:SF2
    label: UNDECAPRENYL-DIPHOSPHATASE
  supported_by:
  - reference_id: file:interpro/panther/PTHR30622/PTHR30622-paint.tsv
    supporting_text: "PTHR30622\tPTN001255889\tGO:0000270\tP\tIBD\tfalse"
  - reference_id: file:interpro/panther/PTHR30622/PTHR30622-entries.csv
    supporting_text: Q8TW25,Undecaprenyl-diphosphatase,protein,190192
term_assessments:
- assessed_term:
    id: GO:0050380
    label: undecaprenyl-diphosphatase activity
  scope: FAMILY_WIDE
  scope_reason: Defining activity with family-wide conserved catalytic motifs.
  supported_by:
  - reference_id: PMID:24855653
    supporting_text: >-
      Sequence alignment reveals two consensus regions, containing
      glutamate-rich (E/Q)XXXE plus PGXSRSXXT motifs and a histidine residue, specific
      to the bacterial UppP enzymes.
- assessed_term:
    id: GO:0046677
    label: response to antibiotic
  scope: UNRESOLVED
  scope_reason: >-
    Bacitracin resistance on overexpression follows directly from the activity in
    bacteria, where bacitracin blocks cell-wall synthesis by sequestering C55-PP; it is
    a consequence of the activity and is kept non-core in the gene reviews. It has the
    same boundary as GO:0000270: archaeal members (SF2, and methanogen members of SF3
    and SF4) have not been tested for a bacitracin response. The subfamilies do not
    split by domain of life, so no subfamily boundary captures the applicable set.
  supported_by:
  - reference_id: PMID:15138271
    supporting_text: >-
      This finding was perfectly consistent with the mechanism
      of action of bacitracin that consists in the sequestration of undecaprenyl
      pyrophosphate, the BacA enzyme substrate.
- assessed_term:
    id: GO:0000270
    label: peptidoglycan metabolic process
  scope: UNRESOLVED
  scope_reason: >-
    True for bacterial members but not for archaeal members. The subfamilies do not
    split by domain of life (archaea occur in SF2, SF3 and SF4), so no subfamily
    boundary captures the applicable set.
  supported_by:
  - reference_id: PMID:15778224
    supporting_text: >-
      The enzyme function is to synthesize the carrier lipid
      undecaprenyl phosphate that is essential for the biosynthesis of peptidoglycan
      and other cell wall components.
