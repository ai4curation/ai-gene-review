family_id: PANTHER:PTHR30622
family_name: UNDECAPRENYL-DIPHOSPHATASE
preferred_name: UppP/BacA undecaprenyl-diphosphatase family
summary: >-
  PTHR30622 is the BacA/UppP family (InterPro IPR003824, Pfam PF02673, HAMAP
  MF_01006). Its members are polytopic integral-membrane phosphatases that hydrolyze
  undecaprenyl diphosphate (C55-PP) to undecaprenyl phosphate (C55-P), the lipid carrier
  for peptidoglycan and other envelope glycans. E. coli BacA is the reference: it is a
  seven-transmembrane inner-membrane enzyme that accounts for about 75% of membrane
  C55-PP phosphatase activity. Its conserved (E/Q)XXXE and PGXSRSXXT motifs, with the
  essential Glu21, Ser27 and Arg174, lie in periplasmic loops, and it requires Mg2+ or
  Ca2+. Overexpression confers bacitracin resistance. The family has no sequence
  relationship to the PAP2-type C55-PP phosphatases (PgpB, YbjG, LpxT, B. subtilis
  BcrC), which supply overlapping activity. Members occur across Bacteria and in many
  Archaea; the archaeal homologs have not been characterized biochemically.
functional_coherence: COHERENT
coherence_reason: >-
  All 640 cached reviewed members are named undecaprenyl-diphosphatase (some genomes
  carry paralogs 1 and 2), and the three subfamilies (SF2, SF3, SF4) share the same
  official name and the conserved catalytic motifs. Archaeal members, mostly in SF2 and
  in methanogen branches of SF3 and SF4, keep the fold, but their polyprenyl
  diphosphate substrate and the envelope polymer they serve are not established, which
  limits how far process terms should propagate.
