  name:
    name: Bacterial transglutaminase-like
    short: Bact_TGase-like
  description:
  - text: This family of proteins includes enzymes with transglutaminase activity,
      which is typically found within a periplasmic domain. These enzymes play a crucial
      role in the viability of certain bacteria, potentially contributing to essential
      functions related to cell wall processes. The transglutaminase activity involves
      the post-translational modification of proteins by catalyzing the formation
      of isopeptide bonds between glutamine and lysine residues, impacting the stability
      and function of protein assemblies.
