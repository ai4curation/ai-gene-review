family_id: PANTHER:PTHR42964
family_name: ENOYL-COA HYDRATASE
preferred_name: Mixed-function crotonase family including hydroxycinnamoyl-CoA hydratase-lyases
summary: >-
  A small PANTHER family of the enoyl-CoA hydratase/isomerase (crotonase)
  superfamily whose single subfamily (SF1) gathers enzymes with different
  reactions. The reviewed members include the hydroxycinnamoyl-CoA
  hydratase-lyase HCHL of Pseudomonas fluorescens, which hydrates feruloyl-CoA
  and cleaves it to vanillin and acetyl-CoA, the trans-2-decenoyl-ACP isomerase
  FabM of streptococci, the bacillaene polyketide dehydratase PksH of Bacillus
  subtilis, and the enoyl-CoA hydratases of Alternaria host-selective toxin
  biosynthesis. The PANTHER tree also holds the Pseudomonas aeruginosa
  methylglutaconyl-CoA hydratase LiuC, the only PAINT seed of the family. The
  KT2440 feruloyl-CoA hydratase/lyase Ech is a TreeGrafter-placed member.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members share the crotonase fold and CoA- or ACP-thioester chemistry, but the
  reaction differs: hydration plus retro-aldol cleavage of hydroxycinnamoyl-CoA
  (HCHL, Ech), cis/trans isomerization of decenoyl-ACP (FabM), polyketide
  dehydration (PksH), hydration of 3-methylglutaconyl-CoA (LiuC), and toxin
  biosynthetic steps (ACTT6, AKT6, AFT6). PANTHER does not separate these into
  subfamilies, so the subfamily label does not predict the reaction. A
  non-PANTHER signature does: the NCBIfam model NF006588 (PRK09120.1,
  p-hydroxycinnamoyl CoA hydratase/lyase) matches both HCHL and KT2440 Ech.
