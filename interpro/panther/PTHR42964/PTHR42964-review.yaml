node_assessments:
  - node_id: PANTHER:PTN001733227
    asserted_term:
      id: GO:0004490
      label: methylglutaconyl-CoA hydratase activity
    evidence: IBD
    negated: false
    paint_snapshot: '20241203'
    seeds:
      - id: UniProtKB:Q9I298
        gene_symbol: liuC
        organism: Pseudomonas aeruginosa PAO1
    assessment: TOO_DEEP
    assessment_reason: >-
      In the PANTHER 19 treeinfo topology PTN001733227 subtends all 13 leaves of
      the family (all SF1), so a term seeded only by LiuC descends to the whole
      family. GO:0004490 is defined as "Catalysis of the reaction:
      (S)-3-hydroxy-3-methylglutaryl-CoA = trans-3-methylglutaconyl-CoA + H2O."
      That reaction is not performed by the hydroxycinnamoyl-CoA hydratase-lyase
      clade (HCHL, KT2440 Ech), whose substrate is feruloyl-CoA and which also
      cleaves the hydrated product, nor by the FabM ACP isomerases or the PksH
      polyketide dehydratase. The term belongs on the LiuC clade only. The
      TreeGrafter graft of SF1 carries this node's terms to every placed member.
    supported_by:
      - reference_id: file:interpro/panther/PTHR42964/PTHR42964-paint.tsv
        supporting_text: "PTHR42964\tPTN001733227\tGO:0004490\tF\tIBD\tfalse\tUniProtKB:Q9I298"
      - reference_id: PMID:10222033
        supporting_text: >-
          The enzyme is a homodimer and is active with three closely related
          substrates, 4-coumaroyl-CoA, caffeoyl-CoA, and feruloyl-CoA
  - node_id: PANTHER:PTN001733227
    asserted_term:
      id: GO:0046247
      label: terpene catabolic process
    evidence: IBD
    negated: false
    paint_snapshot: '20241203'
    seeds:
      - id: UniProtKB:Q9I298
        gene_symbol: liuC
        organism: Pseudomonas aeruginosa PAO1
    assessment: TOO_DEEP
    assessment_reason: >-
      Same root node and single LiuC seed as the GO:0004490 row. The process
      reaches the hydroxycinnamoyl-CoA hydratase-lyases through TreeGrafter: both
      KT2440 Ech (UniProtKB:Q88HJ8) and P. fluorescens HCHL (UniProtKB:O69762)
      receive isoprenoid catabolic process (GO_REF:0000118), which their gene
      reviews repoint to ferulate catabolic process. HCHL acts in
      4-hydroxycinnamate degradation, and the KT2440 ech mutant cannot grow on
      ferulate, so the terpene process should be restricted to the LiuC clade.
    supported_by:
      - reference_id: file:interpro/panther/PTHR42964/PTHR42964-paint.tsv
        supporting_text: "PTHR42964\tPTN001733227\tGO:0046247\tP\tIBD\tfalse\tUniProtKB:Q9I298"
      - reference_id: PMID:12764569
        supporting_text: >-
          The corresponding mutant strains KT2440 fcsOmegaKm, KT2440 echOmegaKm,
          and KT2440 vdhOmegaKm were not able to grow on ferulic acid.
  - node_id: PANTHER:PTN000941828
    asserted_term:
      id: GO:0006635
      label: fatty acid beta-oxidation
    evidence: IBD
    negated: false
    paint_snapshot: '20170228'
    seeds:
      - id: MGI:MGI:94871
      - id: RGD:61892
      - id: RGD:69330
      - id: UniProtKB:P30084
        gene_symbol: ECHS1
        organism: Homo sapiens
    assessment: UNRESOLVED
    assessment_reason: >-
      This 2017 row is not part of the current family: PTN000941828 does not
      occur in the PANTHER 19 treeinfo topology for PTHR42964, and its seeds are
      mammalian mitochondrial enoyl-CoA hydratases (human ECHS1 among them),
      none of which is a leaf of this family's current tree. The node cannot be
      placed, so its clade cannot be judged here. It does not reach SF1: the
      TreeGrafter terms for SF1 are only those of PTN001733227. What is missing
      is the PANTHER release in which the node and its seeds sat in this family.
    supported_by:
      - reference_id: file:interpro/panther/PTHR42964/PTHR42964-paint.tsv
        supporting_text: "PTHR42964\tPTN000941828\tGO:0006635\tP\tIBD\tfalse\tMGI:MGI:94871|RGD:61892|RGD:69330|UniProtKB:P30084"
