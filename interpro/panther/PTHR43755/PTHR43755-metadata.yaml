  name:
    name: Sulfide-quinone oxidoreductase
    short: SQRD
  description:
  - text: This family of proteins includes enzymes that are involved in the oxidation
      of sulfides, such as hydrogen sulfide, using quinones as electron acceptors.
      The reaction catalyzed by these enzymes leads to the formation of polysulfide
      products at the active site cysteine residues. These products are released when
      they reach a certain size, often as cyclooctasulfur. Members of this family
      are known to be inhibited by various compounds, including quinone analogs and
      cyanide, and can be inactivated by alkylation of the active site cysteine.
