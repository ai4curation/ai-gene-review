  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Proton transmembrane transport remains a coherent PTN000389800 assertion for
    the proton-translocating rotary ATPase catalytic subunits that span archaeal
    A-type, Thermus V-type and eukaryotic V-type ATPases; it should not be moved
    down to PTN000389802/Eukaryota. The PTHR43607 member list also contains
    Enterococcus hirae NtpA, a bacterial V-type sodium ATPase A subunit, so a
    confirmed sodium-pump ntp clade would need an IRD for this proton-specific
    process term. Because Q08636 is absent from the local PAINT tree, this
    assessment deliberately does not name a speculative ADD_IRD target.
