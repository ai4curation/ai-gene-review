family_id: PANTHER:PTHR43607
family_name: V-TYPE PROTON ATPASE CATALYTIC SUBUNIT A
preferred_name: V/A-type ATPase catalytic A-subunit family
summary: >-
  PTHR43607 contains catalytic A subunits of rotary V/A-type ATPases. The
  reviewed fungal Saccharomyces cerevisiae VMA1, Schizosaccharomyces pombe
  vma1, Candida albicans TFP1 and Neurospora crassa vma-1 members are
  eukaryotic V-type ATPase A subunits in the soluble V1 domain and hydrolyze ATP
  to power proton transport through the coupled membrane sector at the fungal
  vacuole. PAINT's vacuolar, plant vacuole, lysosomal and phagocytic-vesicle
  location rows are scoped to descendant organellar clades. Its two
  proton-specific PTN000389800 rows are appropriate for the proton-pumping
  archaeal A-type, Thermus V-type and eukaryotic V-type ATPases in the cached
  inventory, but need a sodium-pump loss only if the Enterococcus NtpA branch
  descends from that shared PAINT node.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family shares the rotary ATPase A-subunit fold and catalytic role, but the
  transported cation and the organelle differ. The archaeal A-type, bacterial
  Thermus V-type and eukaryotic V-type branches are proton pumps; bacterial
  V-type ATPases also include the sodium-pumping Enterococcus hirae NtpA member,
  and organelle membrane terms are necessarily confined to eukaryotic descendant
  clades.
