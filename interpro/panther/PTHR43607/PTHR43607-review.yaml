  evidence: IBD
  paint_snapshot: '20260115'
  seeds:
  - id: MGI:MGI:1201780
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    PTN000389800 is a shared rotary ATPase catalytic node rather than a
    PTHR43607-specific root, and the proton-pumping activity is not a eukaryotic
    novelty: archaeal A-type ATP synthase A subunits and bacterial Thermus
    V-type ATPase alpha chains in the cached member inventory are also
    proton-translocating. PANTHER nevertheless also classifies the Enterococcus
    hirae V-type sodium ATPase catalytic A subunit NtpA in PTHR43607, so an
    ntp/sodium-pump descendant clade should receive an IRD if it sits below
    PTN000389800 in the PAINT tree. The local PAINT tree does not contain Q08636,
    and its PTN001807649 leaf is Clostridium botulinum AtpA rather than
    Enterococcus NtpA, so this review records the pruning need without exporting
    a target node.
  supported_by:
