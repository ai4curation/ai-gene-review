  name:
    name: Isochorismate Synthase
    short: Isochorismate_synthase
  description:
  - text: The isochorismate synthase family encompasses enzymes that play a crucial
      role in the biosynthesis of various compounds by catalyzing the conversion of
      chorismate to isochorismate. This reaction is a key step in the production of
      siderophores such as enterobactin and amonabactin, which are important for iron
      acquisition in bacteria. Additionally, members of the family are involved in
      the biosynthesis of menaquinone (vitamin K2) via the menaquinone biosynthesis
      pathway and in the conversion of chorismate to salicylate, a precursor for various
      plant defense compounds. The family's enzymes are characterized by their ability
      to facilitate the isomerization of chorismate, a common intermediate in aromatic
      amino acid biosynthesis, highlighting their diverse functional roles in microbial
      metabolism and secondary metabolite production.
