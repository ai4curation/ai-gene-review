notes: >-
  The PAINT slice was fetched with just fetch-panther-paint on 2026-11-16. Only SLC24A1 (SF36) among the
  human members has a finished gene review. The tree topology below the root and below PTN000851795 is not
  visible here, so node verdicts name only subfamilies whose membership under the node is shown by a member's
  IBA rows or seeds. The PTN000091013 sensory perception of smell IBD (Tetrapoda, seeded by mouse Slc24a4)
  is not on the SLC24A1 lineage and is not assessed. That MaX1 is K+-independent rests on its UniProt record
  (Q8TPA6), which cites PMID:22287543; the cached abstract says only that it is NCX-like.
