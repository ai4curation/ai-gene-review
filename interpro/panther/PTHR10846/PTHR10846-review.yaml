family_id: PANTHER:PTHR10846
family_name: SODIUM/POTASSIUM/CALCIUM EXCHANGER
preferred_name: K+-dependent Na+/Ca2+ exchanger (NCKX, SLC24) and YrbG-like Ca2+/cation antiporter family
summary: >-
  Members of this branch of the Ca2+/cation antiporter (CaCA) superfamily move Ca2+ across a membrane by
  coupled exchange against Na+. The animal members are the five SLC24 K+-dependent Na+/Ca2+ exchangers
  (NCKX1-5, with the Drosophila Nckx30C and CG1090-related proteins), which exchange 4 Na+ for 1 Ca2+
  plus 1 K+ and serve tissue-specific roles: NCKX1 in rod outer segments, NCKX2 in cones and neurons,
  NCKX4 in olfactory neurons and enamel, NCKX5 in the melanocyte trans-Golgi network and melanosome.
  The family also holds the prokaryotic YrbG-like proteins (PTHR10846:SF8), one of which, archaeal
  MaX1, is a Na+/Ca2+ exchanger with NCX-like rather than K+-dependent properties.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Na+-coupled Ca2+ transmembrane transport is shared by every characterized member, prokaryotic MaX1
  included. The K+ co-transport that defines the NCKX exchangers is established for the animal SLC24
  subfamilies but not for the prokaryotic YrbG-like subfamily, whose one characterized member behaves like
  a K+-independent NCX. Plasma-membrane residence is general except for NCKX5, which works intracellularly
  (PAINT records an IRD for it). Tissue-level processes recorded for single paralogs (NCKX2 synaptic
  plasticity) are not family properties.
