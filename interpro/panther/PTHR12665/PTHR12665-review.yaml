      label: Eukaryota
    paint_snapshot: "20240730"
    seeds:
      - id: SGD:S000003270
      - id: SGD:S000004342
      - id: UniProtKB:Q8N138
        label: ORM1-like protein 3
        gene_symbol: ORMDL3
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Physical membership in the SPT complex is demonstrated at both
      phylogenetic extremes of the family: in yeast (the two SGD seeds, the
      Orm1/Orm2 components of the SPOTS complex) and in human, where ORMDL3
      co-immunoprecipitates with SPTLC1 (PMID:20182505) and is resolved inside
      the SPT holoenzyme by two independent cryo-EM structures (PMID:33558761,
      PMID:33558762). Placement at the eukaryotic root node is therefore well
      supported. Human ORMDL3 appearing among the seeds of its own IBA is
      expected — its experimental annotation helped place the IBD — and the
      resulting IBA is reviewed ACCEPT in the ORMDL3 gene review.
  - node_id: PANTHER:PTN000292374
    asserted_term:
      id: GO:0006672
      label: ceramide metabolic process
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20170228"
    seeds:
      - id: UniProtKB:Q53FV1
        label: ORM1-like protein 2
        gene_symbol: ORMDL2
        organism: Homo sapiens
      - id: UniProtKB:Q8N138
        label: ORM1-like protein 3
        gene_symbol: ORMDL3
        organism: Homo sapiens
      - id: UniProtKB:Q9P0S3
        label: ORM1-like protein 1
        gene_symbol: ORMDL1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Seeded by the redundant triple-knockdown experiment covering all three
      human paralogs (ORMDL1/2/3 RNAi raises ceramide about three-fold in HeLa
      cells, PMID:20182505). Because ORMDL proteins gate the rate-limiting step
      upstream of ceramide synthesis, ceramide-level control follows mechanically
      from the conserved SPT-regulatory function and is safe at the family root;
      the descending IBA to human ORMDL3 is reviewed ACCEPT. This is the oldest
      row (2017) and a mammal-only seed set, but the mechanism argument and the
      yeast rescue data make the deep placement sound rather than TOO_DEEP.
  - node_id: PANTHER:PTN000292374
    asserted_term:
      id: GO:0090156
      label: intracellular sphingolipid homeostasis
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260828"
    seeds:
      - id: AGI_LocusCode:AT1G01230
      - id: AGI_LocusCode:AT5G42000
      - id: SGD:S000003270
      - id: SGD:S000004342
    assessment: SOUND
    assessment_reason: >-
      The homeostatic feedback role is asserted from plant and yeast seeds, and
      is exactly the ancestral function defined for the family: Orm proteins are
      "dynamic negative regulators of serine palmitoyltransferase whose
      inhibitory activity is dependent on adequate levels of downstream
      sphingolipids" (PMID:20182505), and the human complex is directly
      ceramide-responsive (PMID:37308477). Human ORMDL3 receives this IBA (GOA
      date 2025-09-03) and the gene review accepts it as a core function.

term_assessments:
  - assessed_term:
      id: GO:0090155
      label: negative regulation of sphingolipid biosynthetic process
    scope: FAMILY_WIDE
    scope_reason: >-
      The direction of regulation — negative — is conserved family-wide and is
      more informative than the direction-neutral terms PAINT currently asserts
      (GO:0030148/GO:0006672). Yeast Orm1/Orm2, plant ORMs and human ORMDL1/2/3
      all inhibit SPT; loss of function elevates sphingolipid intermediates in
      both yeast and human cells. A future PAINT update could safely propagate
      this term (or its regulatory MF counterpart) from the same PTN000292374
      node; the ORMDL3 gene review proposes it as a NEW annotation.
    supported_by:
      - reference_id: PMID:20182505
        supporting_text: "we identify Orm proteins as negative regulators of sphingolipid synthesis that form a conserved complex with serine palmitoyltransferase"

