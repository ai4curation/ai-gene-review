family_id: PANTHER:PTHR12665
family_name: ORMDL PROTEINS
preferred_name: ORM/ORMDL family of serine palmitoyltransferase regulatory subunits
summary: >-
  Small (about 150-220 aa), deeply conserved family of multi-pass ER membrane
  proteins comprising yeast Orm1/Orm2, plant ORM proteins, insect ORMDL and the
  three vertebrate paralogs ORMDL1/2/3. All characterized members are
  stoichiometric regulatory subunits of the serine palmitoyltransferase (SPT)
  complex, the first and rate-limiting enzyme of de novo sphingolipid
  biosynthesis, and act as its sphingolipid-responsive negative regulators:
  the ORMDL N-terminus occludes the SPT substrate entry tunnel, and ceramide
  binding stabilizes this inhibitory conformation, implementing a homeostatic
  negative feedback loop. The functional equivalence across the family is
  experimentally direct — human ORMDL3 rescues the yeast orm1/orm2 double
  mutant, and triple knockdown of ORMDL1/2/3 in HeLa cells raises ceramide
  about three-fold. Human ORMDL3 (17q21) is additionally the strongest
  replicated childhood-asthma GWAS locus, but its immune phenotypes are
  downstream of the conserved sphingolipid-regulatory job. The family is a
  textbook case where family-wide propagation of the SPT-complex and
  sphingolipid-homeostasis terms is safe.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member from yeast to human is an ER-membrane regulatory
  subunit of the SPT complex acting in sphingolipid homeostasis; cross-species
  rescue (human ORMDL3 in yeast orm1/orm2) and redundant paralog phenotypes
  (mammalian ORMDL1/2/3 triple knockdown) demonstrate conserved, interchangeable
  function. No fetched member has a documented divergent molecular job.
