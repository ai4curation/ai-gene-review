notes: >-
  Written for the PAINT "human no-IBA" project, but the no-IBA status of human
  ORMDL3 is stale: the current GOA slice carries four IBA rows from
  PTN000292374 (GO:0030148 sphingolipid biosynthetic process, GO:0090156,
  GO:0017059, GO:0006672), all reviewed ACCEPT in
  genes/human/ORMDL3/ORMDL3-ai-review.yaml. Snapshot discrepancy: the cached
  PTHR12665-paint.tsv contains IBD rows for only three of these terms — there
  is no GO:0030148 row — although GOA's GO:0030148 IBA (dated 2025-09-03, WITH
  PANTHER:PTN000292374|TAIR:locus:2035352) clearly derives from an IBD at the
  same node; the cached slice and GOA were taken at different times. That
  assertion is not adjudicated as a node_assessment here because its seeds and
  date cannot be copied verbatim from the cached tsv, but on the evidence above
  it would also be SOUND. Node ids, seeds, taxa and dates in node_assessments
  are verbatim from the cached paint.tsv; taxon:2759 expanded to NCBITaxon:2759
  Eukaryota; SGD/AGI seed ids left unlabeled rather than guessed. PANTHER
  assigns no subfamily values in the fetched reviewed slice (the subfamily
  column of PTHR12665-entries.csv is empty), so no subfamilies section is
  recorded. No residue_sites: regulation works through the N-terminal tunnel
  plug and a ceramide site (Asn13 in ORMDL3, PMID:37308477), but human ORMDL3's
  UniProt record carries no active/binding-site features to anchor a
  machine-checkable site, so per policy none is asserted.
