notes: >-
  Counts re-derived from the cached entries.csv with a CSV parser: 4 reviewed member
  entries, all in PTHR40089:SF1 (ETHANOLAMINE PERMEASE EUTH-RELATED); InterPro's
  metadata reports 1080 matched proteins over 1702 taxa and a single subfamily, so the
  cached list is the Swiss-Prot slice rather than the whole family. The family's paint.tsv
  holds exactly one node row (PTN002219906, GO:0005886, IBD, 20170228), assessed above;
  there are no IRD or IKR losses on it, and `just paint-losses SALTY eutH` confirms none
  on the reference protein's lineage. Mechanistically open at family level: whether EutH
  is a passive facilitator or couples uptake to the proton motive force is untested in any
  member, so no residue site is curated here - there is no published structure, no
  mutational analysis, and no catalytic residue to anchor.
