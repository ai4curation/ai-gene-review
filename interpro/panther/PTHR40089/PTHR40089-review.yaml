family_id: PANTHER:PTHR40089
family_name: ETHANOLAMINE UTILIZATION PROTEIN EUTH
preferred_name: EutH ethanolamine facilitator family
summary: >-
  Polytopic bacterial inner-membrane proteins of the EutH (ethanolamine facilitator,
  TCDB 9.A.28) family, defined by the EutH signature IPR007441 / Pfam PF04346 /
  PIRSF019466 and by a conserved architecture of about eleven predicted helical
  transmembrane segments with no nucleotide-binding or carrier-superfamily domain.
  The characterized members are the EutH proteins encoded within ethanolamine
  utilization (eut) operons of Salmonella enterica, Escherichia coli and Listeria
  monocytogenes, where EutH facilitates entry of the uncharged form of ethanolamine
  across the cytoplasmic membrane. Because ethanolamine has a pKa near 9.5, the
  uncharged species is scarce at acidic pH, and the EutH requirement is conditional:
  eutH mutants use ethanolamine normally at pH 7.0 with abundant substrate but fail
  when pH or substrate concentration lowers the uncharged-ethanolamine concentration
  below roughly 25 micromolar, including inside the acidified macrophage vacuole.
  The family is small and shallow - PANTHER places all members in the single
  subfamily PTHR40089:SF1 - and the only cached member outside a eut operon context
  is the uncharacterized Bacillus subtilis protein YxeR.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All four cached members are single-subfamily (PTHR40089:SF1) polytopic membrane
  proteins carrying the EutH signature, and three of them (Salmonella P41796,
  Escherichia coli P76552, Listeria A0A0H3GFN0) are eutH genes whose products are
  implicated in ethanolamine uptake, with the acid-dependent requirement demonstrated
  in both Salmonella and Listeria. The membrane-protein character is therefore safe
  family-wide. The identified exception to the ethanolamine-specific function is
  Bacillus subtilis YxeR, an uncharacterized protein in a genome with no eut operon,
  for which no substrate has been tested.
