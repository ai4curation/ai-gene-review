term_assessments:
- assessed_term:
    id: GO:0005886
    label: plasma membrane
  scope: FAMILY_WIDE
  scope_reason: >-
    Asserted by PAINT at the family's bacterial root node and supported by the shared
    polytopic architecture plus direct localization of the Salmonella member. Nothing
    in the family suggests a soluble or periplasmic member.
  supported_by:
  - reference_id: file:interpro/panther/PTHR40089/PTHR40089-paint.tsv
    supporting_text: "PTHR40089\tPTN002219906\tGO:0005886\tC\tIBD\tfalse"
  - reference_id: PMID:15466042
    supporting_text: furthermore, fusion of EutH to fluorescent Yfp protein provided
      evidence that EutH is a membrane protein.
- assessed_term:
    id: GO:0034228
    label: ethanolamine transmembrane transporter activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the function the family is named for and the term InterPro2GO attaches to
    IPR007441. It is demonstrated for the Salmonella member (conditional, pH-dependent
    requirement for ethanolamine use, ethanolamine toxicity, membrane localization) and
    corroborated in vivo for the Listeria member in the same acid-dependent way, which
    spans the gammaproteobacterial and firmicute halves of the cached family. The term
    is kept family-wide rather than subfamily-scoped because PANTHER declares a single
    subfamily, so there is no axis on which to restrict it; the one member for which the
    substrate has never been tested, B. subtilis YxeR, is recorded as a member exception
    rather than as a reason to narrow the family-level term.
  member_exceptions:
  - member:
      id: UniProtKB:P54957
      label: Uncharacterized protein YxeR
      gene_symbol: yxeR
      organism: Bacillus subtilis (strain 168)
    exception_reason: >-
      YxeR is an uncharacterized EutH-like protein of B. subtilis, a species with no
      eut operon and no reported ethanolamine ammonia-lyase, so there is no pathway
      context that would make ethanolamine its substrate and no transport assay has
      been reported. Its membrane character is not in doubt; only the ethanolamine
      specificity is. Treat the activity term as unestablished for this member rather
      than inherited.
    supported_by:
    - reference_id: file:interpro/panther/PTHR40089/PTHR40089-entries.csv
      supporting_text: P54957,Uncharacterized protein YxeR,protein,224308,Bacillus subtilis
        (strain 168)
  supported_by:
  - reference_id: PMID:15466042
    supporting_text: It is suggested that EutH facilitates diffusion of Eth0.
  - reference_id: PMID:29531136
    supporting_text: These findings suggested a model in which EutH facilitates diffusion
      of ethanolamine into the bacterial cell in acidic environments.
- assessed_term:
    id: GO:0034229
    label: ethanolamine transport
  scope: FAMILY_WIDE
  scope_reason: >-
    The process counterpart of the activity, with the same evidence and the same single
    exception: the characterized members perform the translocation step themselves.
  member_exceptions:
  - member:
      id: UniProtKB:P54957
      label: Uncharacterized protein YxeR
      gene_symbol: yxeR
      organism: Bacillus subtilis (strain 168)
    exception_reason: >-
      Same as for the activity term: no substrate has been tested for YxeR and its
      genome has no ethanolamine utilization pathway for it to serve.
    supported_by:
    - reference_id: file:interpro/panther/PTHR40089/PTHR40089-entries.csv
      supporting_text: P54957,Uncharacterized protein YxeR,protein,224308,Bacillus subtilis
        (strain 168)
  supported_by:
  - reference_id: PMID:29531136
    supporting_text: Our findings indicate that EutH is important for survival and
      replication of the facultative intracellular pathogens Salmonella enterica serovar
      Typhimurium and Listeria monocytogenes during prolonged or transient exposure to
      the phagosome, respectively.
- assessed_term:
    id: GO:0046336
    label: ethanolamine catabolic process
  scope: UNRESOLVED
  scope_reason: >-
    UniProt's UniPathway mapping gives this process term to eut-operon members, and it
    is defensible as pathway context, but no member catalyses a step of the degradation:
    EutH supplies the substrate across the membrane while ethanolamine ammonia-lyase and
    the downstream aldehyde enzymes do the chemistry. Whether the family should carry the
    catabolic process term at all is a GO convention question about uptake proteins
    rather than a phylogenetic one, so it is left undecided at family level; the
    Salmonella gene review keeps it as non-core. It is in any case not family-wide,
    since B. subtilis YxeR sits in a genome with no ethanolamine catabolic pathway.
  supported_by:
  - reference_id: PMID:15466042
    supporting_text: The eutH gene is part of an operon that allows Salmonella enterica
      to use ethanolamine as a sole source of nitrogen, carbon, and energy.
