  - id: UniProtKB:P76552
    label: Probable ethanolamine permease EutH
    gene_symbol: eutH
    organism: Escherichia coli (strain K12)
  assessment: SOUND
  assessment_reason: >-
    The single seed is E. coli K-12 EutH, and the claim it carries - that the protein
    is active in the plasma membrane - is the one property every member of this family
    shares. All cached members are 370-408 residue proteins with the EutH signature
    and about eleven predicted helical transmembrane segments, and the Salmonella
    ortholog was shown to be a membrane protein by a EutH-Yfp fusion, so the node
    placement at the bacterial root of the family is as deep as the property itself.
    A one-seed node is not weak support here: the function being asserted is membrane
    residence, which is read directly from the shared architecture, and no member is
    known or expected to be soluble.
  supported_by:
  - reference_id: file:interpro/panther/PTHR40089/PTHR40089-paint.tsv
    supporting_text: "PTHR40089\tPTN002219906\tGO:0005886\tC\tIBD\tfalse\tUniProtKB:P76552\ttaxon:2\t20170228"
  - reference_id: PMID:15466042
    supporting_text: furthermore, fusion of EutH to fluorescent Yfp protein provided
