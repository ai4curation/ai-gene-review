review_status: COMPLETE
reviewed_by: antigravity
review_date: '2026-11-11'
notes: >-
  No experimental 3D structure or site-directed mutagenesis of actin-binding or FAK80-binding residues
  has been reported for any PTHR13651 member, and members lack the catalytic lipoylation lysine motif
  of canonical mitochondrial GCV_H proteins; residue_sites are therefore omitted rather than guessed from
  sequence conservation. PANTHER:PTHR13651:SF0 is the sole subfamily covering the entire eukaryotic family
  (from PTN000342111), so subfamily membership provides no clade discrimination and clade-specific scope
  restrictions are expressed via explicit member_exceptions. Unreviewed TrEMBL entry UniProtKB:D4AE08
  (Rattus norvegicus Abitram, 193 aa) is included in representative_members because rat lacks a reviewed
  Swiss-Prot Abitram entry—causing Swiss-Prot-filtered PTHR13651-entries.csv to omit rat—while D4AE08
  is the canonical 193-aa RGD/UniProt reference-proteome rat Abitram protein curated in
  genes/rat/Abitram/Abitram-ai-review.yaml (89.6% global sequence identity [173/193] to mouse Q80ZQ9;
  see genes/human/ABITRAM/ABITRAM-bioinformatics/RESULTS.md).
