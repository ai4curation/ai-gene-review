  asserted_term:
    id: GO:0030833
    label: regulation of actin filament polymerization
  evidence: IBD
  negated: false
  assessment: SOUND
  assessment_reason: Purified recombinant mouse Abitram reduces spontaneous G-actin polymerization by
    29% in cell-free ultracentrifugation cosedimentation assays while binding F-actin laterally without
    depolymerizing filaments, and in living cells and neurons (IMP) narrows filopodial F-actin FRAP turnover
    variance and stabilizes proximal dendritic branches via F-actin interaction (PMID:24782708), corroborated
    in protostomes by actin-bristle morphogenetic defects upon Gerris buenoi Simiate RNAi (PMID:35193982).
    Retaining unsigned GO:0030833 rather than narrowing to negative regulation GO:0030837 accurately captures
    both cell-free attenuation of spontaneous G-actin assembly and cellular F-actin stabilization/remodeling.
  supported_by:
  - reference_id: PMID:24782708
    supporting_text: A quantification (Figure 2B) revealed that the amount of Actin polymerized after
      a period of 3 h is reduced by 29% in the presence of Simiate
  - reference_id: PMID:24782708
    supporting_text: While there is a significantly elevated number of branches present at proximal dendrites,
      distal dendrites are unaffected, hence suggesting that Simiate stabilizes existing branches via
      its interaction with F-Actin following a rearrangement toward proximal dendrites.
  - reference_id: PMID:35193982
    supporting_text: Simiate RNAi knockdown in G. buenoi resulted in embryos with bristles that are disorganized
      and variable in size, as well as shorter legs
