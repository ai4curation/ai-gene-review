family_id: PANTHER:PTHR13651
family_name: PROTEIN ABITRAM
preferred_name: ABITRAM / Simiate actin-binding and nuclear-speckle proteins
summary: Eukaryotic family of small (~17-24 kDa) single-domain cytosolic and nuclear proteins built on
  a lipoyl-carrier-like barrel-sandwich hybrid fold (InterPro IPR039169 / Pfam PF01597 GCV_H / SUPERFAMILY
  SSF51230 Single hybrid motif) lacking a mitochondrial transit peptide or lipoyl-lysine motif. Across
  characterized bilaterians, ABITRAM (Simiate, formerly FAM206A) directly binds monomeric G-actin and
  filamentous F-actin to temper actin filament polymerization and localizes to the cell nucleus. In jawed
  vertebrates, ABITRAM additionally concentrates in the core domain of SC35-positive nuclear speckles—where
  it associates with nuclear focal adhesion kinase (PTK2/FAK80) and supports cell survival—and modulates
  cortical actin turnover in lamellipodia, filopodia tips, growth cones, and developing dendritic arbors,
  whereas in insects (Gerris buenoi) knockdown perturbs actin-bundled sensory bristles and embryonic leg
  elongation.
functional_coherence: MOSTLY_COHERENT
coherence_reason: All PTHR13651 members belong to a single orthologous subfamily (PTHR13651:SF0) and share
  the conserved GCV_H/Abitram single-hybrid-motif fold supporting core nuclear localization and G/F-actin
  binding/polymerization regulation, whereas specialized mammalian cellular protrusion and neuronal dendritogenesis
  contexts (lamellipodium, filopodium tip, dendrite, dendrite morphogenesis) placed by PAINT at Bilateria
  (PTN000342113) from a single mouse seed do not generalize across divergent uncharacterized protostomes
  or non-metazoan amoebozoans.
