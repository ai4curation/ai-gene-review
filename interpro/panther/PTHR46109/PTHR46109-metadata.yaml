  name:
    name: Lin-28 homolog RNA-binding protein
    short: Lin-28_RNA-binding
  description:
  - text: This family of proteins is involved in the regulation of microRNA (miRNA)
      biogenesis and mRNA translation. Members of this family bind to primary miRNA
      transcripts, particularly those with a 5'-GGAG-3' motif, and can sequester them
      to prevent processing into mature miRNAs. They are also known to bind mRNAs
      and enhance their translation, particularly those related to developmental timing,
      pluripotency, and metabolism. The proteins can recognize structural features
      in RNA, such as G-quartets, and are associated with the translational machinery,
      affecting initiation events and mRNA stability. They have roles in muscle differentiation,
      tissue repair, and maintaining the pluripotent state of stem cells by suppressing
      differentiation-inducing miRNAs like let-7.
