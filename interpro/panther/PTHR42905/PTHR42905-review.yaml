family_id: PANTHER:PTHR42905
family_name: PHOSPHOENOLPYRUVATE CARBOXYLASE
preferred_name: Isocitrate lyase/PEP mutase superfamily (PrpB methylisocitrate lyases and relatives)
summary: >-
  Members of the isocitrate lyase/phosphoenolpyruvate mutase superfamily, which share a TIM-barrel
  fold and a Mg2+-dependent chemistry that stabilises an alpha-carboxy carbanion or enolate
  intermediate. Despite PANTHER's family name, the reviewed members are not phosphoenolpyruvate
  carboxylases. The family contains three functionally distinct groups: the PrpB
  2-methylisocitrate lyases of the bacterial 2-methylcitrate cycle (Escherichia coli, Salmonella,
  Shewanella, Corynebacterium, Bacillus subtilis MmgF, Pseudomonas), which cleave
  (2R,3S)-2-methylisocitrate to succinate and pyruvate; the oxaloacetate decarboxylases of
  Pseudomonas and Rhodopseudomonas; and phosphoenolpyruvate phosphomutases and related
  phosphonate-pathway enzymes.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Subfamilies carry different reactions on a shared fold. SF5 holds the PrpB 2-methylisocitrate
  lyases; SF3 holds oxaloacetate decarboxylases (a carboxy-lyase reaction); SF7 holds
  phosphoenolpyruvate phosphomutases (an intramolecular phosphotransferase, not a lyase); SF16 holds
  uncharacterized Mycobacterium tuberculosis proteins. Methylisocitrate lyase activity must not be
  propagated beyond SF5.
reference_protein:
  id: UniProtKB:P77541
  label: 2-methylisocitrate lyase
  gene_symbol: prpB
  organism: Escherichia coli (strain K12)
  gene_review: genes/ECOLI/prpB/prpB-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR42905:SF5
  label: CARBOXYVINYL-CARBOXYPHOSPHONATE PHOSPHORYLMUTASE, CHLOROPLASTIC
  description: >-
    Despite the PANTHER label, the reviewed bacterial members are PrpB 2-methylisocitrate lyases
    of the 2-methylcitrate cycle (E. coli, Salmonella, Shewanella, Corynebacterium glutamicum,
    B. subtilis MmgF, P. putida). They show no activity with isocitrate.
  representative_members:
  - id: UniProtKB:P77541
    gene_symbol: prpB
    organism: Escherichia coli (strain K12)
    gene_review: genes/ECOLI/prpB/prpB-ai-review.yaml
  - id: UniProtKB:Q88KF6
    gene_symbol: prpB
    organism: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / NCIMB 11950 / KT2440)
    gene_review: genes/PSEPK/prpB/prpB-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR42905:SF3
  label: OXALOACETATE DECARBOXYLASE
  description: Oxaloacetate decarboxylases of Pseudomonas and Rhodopseudomonas.
  diverged_from_family: true
  divergence_description: >-
    Decarboxylate oxaloacetate to pyruvate rather than cleaving 2-methylisocitrate; these paralogs
    must not inherit methylisocitrate lyase activity or propionate catabolism.
- subfamily_id: PANTHER:PTHR42905:SF7
  label: PHOSPHOENOLPYRUVATE PHOSPHOMUTASE
  description: Phosphoenolpyruvate phosphomutases of phosphonate biosynthesis.
  diverged_from_family: true
  divergence_description: >-
    Catalyse intramolecular phosphoryl transfer (phosphoenolpyruvate to phosphonopyruvate), an
    isomerase reaction rather than a lyase reaction.
