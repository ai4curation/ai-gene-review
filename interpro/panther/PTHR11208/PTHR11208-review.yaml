family_id: PANTHER:PTHR11208
family_name: RNA-BINDING PROTEIN RELATED
summary: KH-domain RNA-binding proteins in this family regulate RNA maturation and expression. SF1/branchpoint-binding
  proteins recognize intronic branchpoint regions during early spliceosome assembly, whereas STAR/QKI/KHDRBS-related
  proteins regulate selected RNA targets through alternative splicing and other post-transcriptional mechanisms.
functional_coherence: HETEROGENEOUS
coherence_reason: The shared KH-containing RNA-recognition machinery supports broad RNA binding, with
  different recognition mechanisms in STAR/QKI and SF1 branches. QKI/GLD-1 structures show how Qua1 dimerization
  and the KH-Qua2 unit recognize a specific RNA element (PMID:23630077). This does not make every KH protein
  an identical sequence-specific translational regulator, nor does it transfer the SF1 splice-branchpoint
  role to qkr58E-1. RNA binding is the conserved broad molecular activity; target sequences, oligomerization
  requirements and splicing versus translational outputs remain branch-specific.
