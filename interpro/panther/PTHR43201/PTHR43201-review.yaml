  id: UniProtKB:Q88HK0
  label: Feruloyl-CoA synthetase
  gene_symbol: fcs
  organism: Pseudomonas putida KT2440
  gene_review: genes/PSEPK/fcs/fcs-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR43201:SF32
    label: 2-SUCCINYLBENZOATE--COA LIGASE, CHLOROPLASTIC_PEROXISOMAL
    description: >-
      Reviewed members are o-succinylbenzoate-CoA ligases (Arabidopsis AAE14,
      Bacillus MenE); KT2440 Fcs is classified here by UniProt/InterPro. The
      subfamily thus joins menaquinone/phylloquinone-pathway ligases with an
      aromatic hydroxycinnamate-CoA ligase, so its label does not predict the
      substrate of a placed member.
