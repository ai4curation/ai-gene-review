term_assessments:
  - assessed_term:
      id: GO:0050563
      label: trans-feruloyl-CoA synthase activity
    scope: UNRESOLVED
    scope_reason: >-
      Feruloyl-CoA synthetase activity is established for KT2440 Fcs, which
      PANTHER places in SF32 next to o-succinylbenzoate-CoA ligases. No PANTHER
      subfamily or PAINT node isolates hydroxycinnamate-CoA ligases, although a
      non-PANTHER signature does: Fcs matches the dedicated NCBI CDD model
      cd05921 (FCS, feruloyl-CoA synthetase). The reviewed SF32 members with
      known function are MenE-type enzymes, so the boundary of the activity
      within the PANTHER family is not determined; CDD cd05921, not PANTHER,
      is the sequence-level discriminator.
    supported_by:
      - reference_id: PMID:12764569
        supporting_text: The enzyme activities of Fcs and Vdh were determined in protein extracts of these cells.
      - reference_id: file:genes/PSEPK/fcs/fcs-uniprot.txt
        supporting_text: 'DR   CDD; cd05921; FCS; 1.'
