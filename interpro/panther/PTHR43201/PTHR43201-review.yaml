node_assessments:
  - node_id: PANTHER:PTN000644517
    asserted_term:
      id: GO:0031956
      label: medium-chain fatty acid-CoA ligase activity
    evidence: IBD
    negated: false
    paint_snapshot: '20200212'
    seeds:
      - id: UniProtKB:Q96CM8
        gene_symbol: ACSF2
        organism: Homo sapiens
    assessment: TOO_DEEP
    assessment_reason: >-
      PTN000644517 is the root of the PANTHER 19 tree (all 358 leaves, every
      subfamily), and its only seed for this term is human ACSF2 in SF5. A
      medium-chain fatty-acid substrate term therefore descends through
      TreeGrafter to the o-succinylbenzoate-CoA ligases of SF32, to
      crotonobetaine/carnitine-CoA ligases and to the KT2440 feruloyl-CoA
      synthetase Fcs (UniProtKB:Q88HK0), whose gene review repoints the row to
      trans-feruloyl-CoA synthase activity because Fcs activates ferulate. The
      medium-chain fatty-acid term should sit on the ACSF2 clade; even the
      generic CoA-ligase activity would not be safe at the root, because the
      bifunctional Aas members activate acids onto acyl carrier protein rather
      than CoA.
    supported_by:
      - reference_id: file:interpro/panther/PTHR43201/PTHR43201-paint.tsv
        supporting_text: "PTHR43201\tPTN000644517\tGO:0031956\tF\tIBD\tfalse\tUniProtKB:Q96CM8"
      - reference_id: PMID:12764569
        supporting_text: >-
          To confirm the physiological function of these structural genes as
          feruloyl-CoA synthetase (Fcs), enoyl-CoA hydratase/aldolase (Ech), and
          vanillin dehydrogenase (Vdh), respectively, they were cloned and
          expressed in Escherichia coli.
