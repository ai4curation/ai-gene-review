family_id: PANTHER:PTHR43201
family_name: ACYL-COA SYNTHETASE
preferred_name: ANL superfamily acyl- and aryl-CoA ligases (ACSF2/ACSF3/MenE-like)
summary: >-
  A PANTHER family of the ANL (acyl-CoA synthetase, NRPS adenylation domain,
  luciferase) superfamily: ATP-dependent enzymes that adenylate a carboxylic
  acid and transfer it to coenzyme A. Reviewed members include the mammalian
  medium-chain acyl-CoA ligase ACSF2 and malonyl/methylmalonyl-CoA synthetase
  ACSF3, the Enterobacterial crotonobetaine/carnitine-CoA ligase CaiC and
  bifunctional Aas, o-succinylbenzoate-CoA ligases MenE/AAE14 of
  menaquinone/phylloquinone biosynthesis, 4-chlorobenzoate-CoA ligase, and
  fungal acyl-CoA ligases of siderophore and secondary-metabolite biosynthesis.
  The KT2440 feruloyl-CoA synthetase Fcs is a TreeGrafter-placed member of
  SF32.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The ATP-dependent CoA-ligase mechanism (adenylate then thioester) is shared,
  but the acid substrate varies: medium-chain fatty acids (ACSF2), malonate
  (ACSF3), crotonobetaine/carnitine (CaiC), o-succinylbenzoate (MenE),
  4-chlorobenzoate, hydroxycinnamates such as ferulate (Fcs) and fungal
  secondary-metabolite acids, and the bifunctional Aas proteins form acyl-ACP
  rather than acyl-CoA. Subfamilies do not cleanly separate these:
  SF5 contains ACSF2, CaiC and MenE orthologs, and SF32 joins plant/Bacillus
  MenE with the Pseudomonas feruloyl-CoA synthetase.
