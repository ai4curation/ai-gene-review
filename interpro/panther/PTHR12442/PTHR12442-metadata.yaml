  name:
    name: Dynein Intermediate Chain
    short: Dynein_IC
  description:
  - text: The dynein intermediate chain family is involved in the structure and function
      of dynein complexes, which are motor proteins that drive the movement of vesicles,
      organelles, and other cargos along microtubules. Members of the family play
      roles in linking dynein to these cargos and to adapter proteins, regulating
      dynein function. They are essential for intracellular retrograde motility, ciliary
      motility, and are involved in various cellular processes including ciliogenesis,
      cell migration, and mitosis. Some members act as negative regulators of signaling
      pathways and are involved in the assembly of the axonemal dynein complex, critical
      for respiratory cilia function and potentially in the regulation of cilia function
      more broadly.
