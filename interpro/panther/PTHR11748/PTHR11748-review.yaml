    supporting_text: PP_4493 putatively oxidizes d-2HG to 2KG and connects d-lysine to central metabolism.
- subfamily_id: PANTHER:PTHR11748:SF103
  label: GLYCOLATE OXIDASE SUBUNIT GLCE
  description: >-
    The FAD-binding GlcE subunit of the bacterial heterotrimeric glycolate oxidase/dehydrogenase
    GlcDEF (E. coli GlcE, P. putida KT2440 GlcE/PP_3746). The complex oxidizes glycolate to
    glyoxylate (and D-lactate to pyruvate) with a membrane-associated, non-oxygen electron
    acceptor. Insertion mutants in any of glcD, glcE or glcF abolish glycolate oxidase activity, so
    GlcE contributes to the complex activity rather than catalysing it alone. Used by the
    glycolate/glyoxylate assimilation module.
  representative_members:
  - id: UniProtKB:P52073
    label: Glycolate oxidase subunit GlcE
    gene_symbol: glcE
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/glcE/glcE-ai-review.yaml
  - id: UniProtKB:Q88GH7
    label: Glycolate oxidase, putative FAD-binding subunit
    gene_symbol: glcE
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/glcE/glcE-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Functions only as one subunit of a three-subunit complex (with GlcD of PTHR42934 and the
    iron-sulfur GlcF of PTHR32479), and the complex prefers glycolate. Neither GlcE in the
    corpus receives the PTN000202298 D-lactate dehydrogenase terms, consistent with this subfamily
    lying outside that node.
  supported_by:
  - reference_id: PMID:8606183
    supporting_text: The insertional mutation by a chloramphenicol acetyltransferase cassette in either
      glcD, glcE, or glcF abolished glycolate oxidase activity, indicating that presumably these proteins
      are subunits of this enzyme.
  - reference_id: file:genes/ECOLI/glcE/glcE-uniprot.txt
    supporting_text: 'FUNCTION: Component of a complex that catalyzes the oxidation of'
