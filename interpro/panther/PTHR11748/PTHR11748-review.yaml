- subfamily_id: PANTHER:PTHR11748:SF119
  label: D-2-HYDROXYGLUTARATE DEHYDROGENASE
  description: >-
    Bacterial D-2-hydroxyglutarate dehydrogenases (E. coli YdiJ, P. putida KT2440 YdiJ/PP_4493)
    that oxidize D-2-hydroxyglutarate to 2-oxoglutarate. Besides the FAD domain they carry a
    4Fe-4S ferredoxin-like region. In P. putida the enzyme connects D-lysine catabolism to central
    metabolism.
  representative_members:
  - id: UniProtKB:P77748
    label: D-2-hydroxyglutarate dehydrogenase
    gene_symbol: ydiJ
    organism: Escherichia coli K-12
  - id: UniProtKB:Q88EH0
    label: D-2-hydroxyglutarate dehydrogenase
    gene_symbol: ydiJ
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/ydiJ/ydiJ-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Substrate preference has shifted from D-lactate to D-2-hydroxyglutarate, and the subunit
    carries an additional 4Fe-4S cluster. The clade sits under the PAINT node PTN000202298 (E. coli
    YdiJ is a seed for its FAD-binding IBD), so it also inherits that node's D-lactate dehydrogenase
    and lactate catabolic process terms, which no member of this subfamily has been shown to have.
  supported_by:
