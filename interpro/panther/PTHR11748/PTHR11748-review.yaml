family_id: PANTHER:PTHR11748
family_name: D-LACTATE DEHYDROGENASE
preferred_name: FAD-linked (2R)-2-hydroxyacid dehydrogenases of the PCMH/VAO fold (D-lactate dehydrogenase, D-2-hydroxyglutarate dehydrogenase, glycolate oxidase GlcE, vanillyl-alcohol oxidase-like)
summary: >-
  A large family of FAD-containing oxidoreductases with the PCMH-type (vanillyl-alcohol
  oxidase/p-cresol methylhydroxylase) FAD-binding fold. The family name reflects its
  best-characterized eukaryotic members, the mitochondrial FAD-dependent D-lactate
  dehydrogenases (yeast DLD1, Arabidopsis D-LDH, vertebrate LDHD; SF111), which oxidize
  D-lactate and other (2R)-2-hydroxyacids and pass electrons to cytochrome c. Bacterial
  subfamilies include the 4Fe-4S-containing D-2-hydroxyglutarate dehydrogenases (E. coli and
  P. putida YdiJ; SF119), the GlcE FAD-binding subunit of the heteromeric GlcDEF glycolate
  oxidase/dehydrogenase (SF103), and vanillyl-alcohol oxidase/p-cresol methylhydroxylase-like
  flavoenzymes acting on phenolic alcohols (SF114).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  FAD binding and two-electron oxidation of a hydroxylated carbon are shared, but substrates,
  quaternary context and physiological roles differ by subfamily. SF111 enzymes are monomeric
  mitochondrial D-lactate/(2R)-2-hydroxyacid dehydrogenases; SF119 YdiJ enzymes oxidize
  D-2-hydroxyglutarate in lysine catabolism and carry an extra 4Fe-4S cluster; SF103 GlcE is not
  a standalone enzyme but one of three subunits (GlcD, GlcE, GlcF) of the bacterial glycolate
  oxidase complex, whose activity requires all three subunits; SF114 acts on aromatic alcohols.
  The PAINT D-lactate dehydrogenase terms are therefore subfamily-level, not family-wide.
