notes: >-
  The glycolate/glyoxylate assimilation module grounds its GlcE role on SF103, not on the family,
  because a family-level selector would take in mitochondrial D-lactate dehydrogenases,
  D-2-hydroxyglutarate dehydrogenases and vanillyl-alcohol oxidases. The PAINT activity and process
  IBDs at PTN000202298 are right for the D-LDH lineage but also reach the D-2-hydroxyglutarate
  dehydrogenases (SF119); the NAD+ D-LDH IBD uses the wrong acceptor for this flavoprotein family.
  GlcE subunits in the corpus receive none of these terms.
