family_id: PANTHER:PTHR43540
family_name: PEROXYUREIDOACRYLATE/UREIDOACRYLATE AMIDOHYDROLASE-RELATED
preferred_name: Isochorismatase-fold cysteine hydrolases (RutB, EntB, nicotinamidases, biuret hydrolase,
  NicF and relatives)
summary: >-
  Members of the isochorismatase-like hydrolase fold (Pfam Isochorismatase, IPR000868). In the
  characterized enzymes a Cys-Asp-Lys catalytic arrangement attacks a carbonyl or vinyl-ether carbon.
  The family is functionally diverse. It includes ureidoacrylate amidohydrolase RutB of pyrimidine
  utilization (SF6), plant nicotinamidases (in SF6), isochorismatase EntB/VibB of siderophore
  synthesis (SF3), biuret and triuret amidohydrolases (SF9), N-carbamoylsarcosine amidase and
  streptothricin hydrolase (SF1), and Pseudomonas putida NicF (SF1). NicF is the maleamate
  amidohydrolase of aerobic nicotinate degradation, and its recombinant extracts release ammonia from
  maleamate. Most members hydrolyse amide or ureido C-N bonds; the EntB-type isochorismatases instead
  cleave a vinyl ether.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The fold and catalytic chemistry are shared, but substrate and even bond class differ between
  subfamilies (ureidoacrylate, nicotinamide, biuret, N-carbamoylsarcosine, streptothricin, maleamate
  amide bonds; isochorismate vinyl ether). SF1 itself combines N-carbamoylsarcosine amidase,
  streptothricin hydrolase, NicF and uncharacterized proteins, so no substrate-specific function can
  be scoped by subfamily.
