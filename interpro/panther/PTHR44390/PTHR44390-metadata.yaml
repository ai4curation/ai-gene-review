  name:
    name: Centrosomal protein 41
    short: CEP41
  description:
  - text: This family of proteins is involved in the process of ciliogenesis, specifically
      in the post-translational modification of tubulin through glutamylation. Members
      of this family are implicated in the intracellular transport of tubulin polyglutamylases,
      such as TTLL6, from the basal body to the cilium. This modification is crucial
      for the proper function and structure of cilia. Although some members contain
      a rhodanese domain, they do not exhibit phosphatase activity, indicating that
      they are enzymatically inactive in this respect.
