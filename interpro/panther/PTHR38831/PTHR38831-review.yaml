family_id: PANTHER:PTHR38831
family_name: TYPE II SECRETION SYSTEM PROTEIN K
preferred_name: GspK minor pseudopilins of type II secretion systems
summary: >-
  GspK minor pseudopilins, the largest of the four low-abundance prepilin-type subunits that cap
  the type II secretion pseudopilus. Members carry a prepilin-type N terminus that the prepilin
  peptidase processes, followed by a large periplasmic region with no counterpart in the major
  pseudopilins. GspK completes the tip complex: in Pseudomonas, XcpX (GspK) is recruited by XcpV
  (GspI) and interacts directly with the major pseudopilin XcpT, and raising the amount of XcpX
  shortens the pseudopilus while its absence lengthens it, so the subunit limits filament
  elongation. In Klebsiella, PulK binding to the PulI-PulJ pair partially extracts it from the
  membrane and sets the register for major-pseudopilin addition. All reviewed members are T2SS
  GspK proteins of proteobacterial and xanthomonad secretion loci.
functional_coherence: COHERENT
coherence_reason: >-
  Both subfamilies hold T2SS GspK minor pseudopilins with the same prepilin processing,
  inner-membrane anchoring and tip-capping role; SF2 is a single Xanthomonas member separated by
  sequence divergence, not by function.
