  assessment_reason: >-
    Seeded by P. aeruginosa XcpX, whose membership of the Xcp machine rests on co-purification in
    the XcpV-XcpW-XcpX and XcpU-V-W-X complexes and on a direct interaction with the major
    pseudopilin XcpT. Every reviewed member of this family is a GspK protein encoded in a T2SS
    locus, in both subfamilies, so a family-level node is appropriate here; unlike the GspI family,
    there is no deep non-T2SS branch below the node in the local PANTHER slice. The taxon is
    recorded as Bacteria, which is wider than the diderm lineages that have T2SS, but the family's
    own membership is confined to those lineages.
