notes: >-
  Used by modules/bacterial_type_ii_secretion.yaml for the GspK minor-pseudopilin annoton, at
  PANTHER:PTHR38831 with P. aeruginosa XcpX (Q00518), P. putida KT2440 XcpX (Q88P11) and
  Klebsiella PulK (P15750) as exemplars. GspK is the one minor pseudopilin whose family is not
  shared with type IV pilus or competence systems: PANTHER keeps the prepilin-type N terminus
  together with the large GspK-specific periplasmic region, so the family does not extend to
  pilins. The length-control role of XcpX is modelled in the module as tip capping rather than as a
  separate regulatory step; see the open question in genes/PSEAE/xcpX/xcpX-ai-review.yaml about
  whether every substrate requires XcpX.
