family_id: PANTHER:PTHR34266
family_name: THIAZOLE SYNTHASE
preferred_name: ThiG thiazole synthase family
summary: >-
  ThiG thiazole synthases (EC 2.8.1.10) are TIM-barrel enzymes that form the thiazole phosphate
  moiety of thiamine. They bind 1-deoxy-D-xylulose 5-phosphate as a Schiff base on a conserved
  lysine and condense it with 2-iminoacetate and the sulfur of ThiS thiocarboxylate. The
  family has a single PANTHER subfamily (SF2) holding all reviewed bacterial ThiG proteins.
  Members differ in where their 2-iminoacetate comes from, not in their own activity. In
  E. coli and other ThiH-containing bacteria, the radical-SAM tyrosine lyase ThiH makes it and
  ThiG forms a ThiGH complex. In aerobes such as Bacillus subtilis and Pseudomonas putida, the
  glycine oxidase ThiO makes it and there is no ThiH.
functional_coherence: COHERENT
coherence_reason: >-
  Thiazole synthase activity and the thiamine biosynthesis process hold across the family. The
  only lineage-dependent assertion is membership of the ThiGH 2-iminoacetate synthase complex,
  which depends on whether the organism encodes the partner ThiH, not on ThiG itself.
