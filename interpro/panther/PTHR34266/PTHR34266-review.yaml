  assessment: SOUND
  assessment_reason: >-
    Thiazole phosphate is a dedicated precursor of de novo thiamine diphosphate, and the ThiG
    reaction is the same in every member. The KT2440 reference protein's review accepts this
    term.
  supported_by:
  - reference_id: file:interpro/panther/PTHR34266/PTHR34266-paint.tsv
    supporting_text: "PTHR34266\tPTN002152321\tGO:0009229\tP\tIBD\tfalse\tUniProtKB:P30139\ttaxon:2\t20240912"
  - reference_id: file:genes/PSEPK/thiG/thiG-ai-review.yaml
    supporting_text: ThiG performs the thiazole-forming step of de novo thiamine diphosphate biosynthesis.
term_assessments:
- assessed_term:
    id: GO:1990107
    label: thiazole synthase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The catalytic Schiff-base lysine and DXP-binding residues are shared by E. coli, B. subtilis
    and KT2440 ThiG, and the family has a single subfamily. The thiamine diphosphate biosynthesis
    module uses this term for its ThiG step, selecting the base family. PAINT has no IBD for this
    MF; GOA reaches members through the EC/Rhea mapping.
  supported_by:
  - reference_id: file:genes/PSEPK/thiG/thiG-bioinformatics/RESULTS.md
    supporting_text: Q88CS6 retains the catalytic lysine and the DXP phosphate/sugar-binding residues
      of characterised ThiG enzymes
  - reference_id: PMID:17403671
    supporting_text: yield dehydroglycine, which is required by ThiG for the thiazole cyclization
      reaction.
  - reference_id: file:genes/PSEPK/thiG/thiG-uniprot.txt
    supporting_text: Catalyzes the rearrangement of 1-deoxy-D-xylulose 5-phosphate (DXP) to produce
      the thiazole phosphate moiety of thiamine.
- assessed_term:
    id: GO:0009229
    label: thiamine diphosphate biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Placed by PAINT at the family root (PTN002152321), and judged sound for all members.
  supported_by:
  - reference_id: file:interpro/panther/PTHR34266/PTHR34266-paint.tsv
    supporting_text: "PTHR34266\tPTN002152321\tGO:0009229\tP\tIBD\tfalse\tUniProtKB:P30139\ttaxon:2\t20240912"
- assessed_term:
    id: GO:1902508
    label: 2-iminoacetate synthase complex
  scope: UNRESOLVED
  scope_reason: >-
    True only for members in organisms that encode ThiH, a property of the genome rather than of
    any PANTHER subfamily. The family's single subfamily mixes ThiH-route (E. coli) and
    ThiO-route (B. subtilis, P. putida) members, so no subfamily grant is correct.
  member_exceptions:
  - member:
      id: UniProtKB:Q88CS6
      gene_symbol: thiG
      organism: Pseudomonas putida KT2440
    exception_reason: >-
      KT2440 has no ThiH and makes the imine with ThiO, so its ThiG cannot be in a ThiGH
      2-iminoacetate synthase complex.
    supported_by:
    - reference_id: file:genes/PSEPK/thiG/thiG-bioinformatics/RESULTS.md
      supporting_text: KT2440 and B. subtilis encode ThiO but no ThiH
  - member:
      id: UniProtKB:O31618
      gene_symbol: thiG
      organism: Bacillus subtilis 168
    exception_reason: >-
      B. subtilis uses the ThiO glycine oxidase route and has no ThiH entry, so the ThiGH
      complex cannot form.
    supported_by:
    - reference_id: PMID:12627963
      supporting_text: we demonstrate that ThiO is required for the biosynthesis of the thiazole moiety
        of thiamin pyrophosphate
