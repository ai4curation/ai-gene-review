node_assessments:
- node_id: PANTHER:PTN002152321
  asserted_term:
    id: GO:1902508
    label: 2-iminoacetate synthase complex
  evidence: IBD
  paint_snapshot: '20240912'
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  seeds:
  - id: UniProtKB:P30139
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The ThiGH complex is real in E. coli: ThiH forms a heterodimer with ThiG, and the complex is
    capable of 2-iminoacetate synthase activity (tyrosine-dependent radical SAM chemistry).
    Placing the term at the bacterial root, however, sends it to ThiG proteins of organisms that
    encode no ThiH and make the imine with the glycine oxidase ThiO. B. subtilis 168 and
    P. putida KT2440 have a ThiO entry and no ThiH entry in UniProt, and the KT2440 ThiO has been
    purified and shown to supply the glyoxyl imine. In those organisms ThiG cannot be part of a
    2-iminoacetate synthase complex. The ThiH/ThiO split follows lifestyle across many bacterial
    lineages rather than one ThiG clade, so the term should be confined to ThiH-containing
    clades, or blocked by IRDs on the ThiO-route clades that include Bacillus and Pseudomonas.
  supported_by:
  - reference_id: file:interpro/panther/PTHR34266/PTHR34266-paint.tsv
    supporting_text: "PTHR34266\tPTN002152321\tGO:1902508\tC\tIBD\tfalse\tUniProtKB:P30139\ttaxon:2\t20240912"
  - reference_id: file:genes/ECOLI/thiH/thiH-uniprot.txt
    supporting_text: 'SUBUNIT: Forms a heterodimer with ThiG. {ECO:0000269|PubMed:12650933}.'
  - reference_id: file:genes/PSEPK/thiG/thiG-bioinformatics/RESULTS.md
    supporting_text: KT2440 and B. subtilis encode ThiO but no ThiH, so their ThiG proteins cannot be
      part of a ThiG-ThiH 2-iminoacetate synthase complex.
  - reference_id: PMID:26875494
    supporting_text: Glycine oxidase, encoded by the thiO gene, participates in the biosynthesis of
      thiamin by providing glyoxyl imine to form the thiazole moiety of thiamin.
- node_id: PANTHER:PTN002152321
  asserted_term:
    id: GO:0009228
    label: thiamine biosynthetic process
  evidence: IBD
  paint_snapshot: '20240912'
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  seeds:
  - id: UniProtKB:P30139
  assessment: SOUND
  assessment_reason: >-
    Every ThiG makes the thiazole moiety of thiamine, whichever route supplies its imine. The
    seed E. coli thiG is genetically required for the thiazole. The KT2440 review accepts the
    same term (InterPro2GO row) for the reference protein.
  supported_by:
  - reference_id: file:interpro/panther/PTHR34266/PTHR34266-paint.tsv
    supporting_text: "PTHR34266\tPTN002152321\tGO:0009228\tP\tIBD\tfalse\tUniProtKB:P30139\ttaxon:2\t20240912"
  - reference_id: PMID:8432721
    supporting_text: The thiE, thiF, thiG, and thiH gene products are required for synthesis of the
      thiazole.
  - reference_id: file:genes/PSEPK/thiG/thiG-ai-review.yaml
    supporting_text: ThiG makes the thiazole moiety of thiamine, so it does part of the work of thiamine
      biosynthesis.
- node_id: PANTHER:PTN002152321
  asserted_term:
    id: GO:0009229
    label: thiamine diphosphate biosynthetic process
  evidence: IBD
  paint_snapshot: '20240912'
  node_taxon:
