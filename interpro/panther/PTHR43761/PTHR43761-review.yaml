notes: >-
  Built on the templated review in the open PANTHER family-review PR (#5078), keeping its nodes,
  representatives and references. The reference protein is changed from Shewanella PdxB A0KV91,
  which has no gene review, to P. putida SerA Q88CM5. S. pombe ser3 (P87228) is in SF1 by its
  UniProt cross-reference but in PTHR10996:SF282 by PANTHER's own 19.0 classification files, so
  it is cited as a reviewed member rather than listed as an SF1 representative.
  Open question for PANTHER/PAINT: PTN000107912 (GO:0004617 and GO:0006564, seeded by M.
  tuberculosis SerA P9WNX3) is exported in both the PTHR43761 and the PTHR42789 PAINT files. Which
  family's tree does the node belong to in the current PANTHER release, and do the SF1 SerA
  members of PTHR43761 descend from it? Until that is answered the node is assessed
  identically in both reviews.
