    label: Bacteria
  evidence: IBD
  paint_snapshot: '20201209'
  seeds:
  - id: UniProtKB:P9WNX3
  assessment: SOUND
  assessment_reason: >-
    The single seed is M. tuberculosis SerA, an experimentally characterized phosphoglycerate
    dehydrogenase. The SerA members of SF1 that receive this IBA (P. putida SerA, S. pombe ser3,
    M. extorquens SerA) retain the activity in their own reviews. The node is sound for the SerA
    clade; the PdxB and hydroxypyruvate reductase members of SF1 must lie outside it, and nothing
    in the local data shows that they inherit it.
  supported_by:
