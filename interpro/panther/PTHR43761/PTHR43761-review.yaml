family_id: PANTHER:PTHR43761
family_name: D-ISOMER SPECIFIC 2-HYDROXYACID DEHYDROGENASE FAMILY PROTEIN (AFU_ORTHOLOGUE AFUA_1G13630)
preferred_name: D-isomer 2-hydroxyacid dehydrogenases of the PdxB/SerA-type (InterPro PdxB subfamily)
summary: >-
  NAD-dependent D-isomer-specific 2-hydroxyacid dehydrogenases (InterPro IPR050418, "PdxB
  subfamily"). The Swiss-Prot inventory is dominated by 4-phosphoerythronate dehydrogenases (PdxB)
  of Shewanella, Vibrio, Acinetobacter and other gamma-proteobacteria, and also contains
  D-3-phosphoglycerate dehydrogenases with an ACT regulatory domain (P. putida, H. influenzae,
  Methylorubrum extorquens, Dictyostelium and S. pombe SerA/ser3) and hydroxypyruvate/glycerate
  reductases (Methylorubrum hprA, Blautia hpr). PANTHER assigns all of them to a single
  subfamily, SF1.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  One subfamily holds three substrate specificities (4-phospho-D-erythronate, 3-phospho-D-glycerate
  and hydroxypyruvate), so the subfamily assignment does not determine the reaction; the only
  PAINT node (PTN000107912) asserts phosphoglycerate dehydrogenase activity at a Bacteria-level
  node seeded by M. tuberculosis SerA, a protein UniProt places in PTHR42789.
reference_protein:
