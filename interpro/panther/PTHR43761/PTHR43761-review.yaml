  description: >-
    The only subfamily. Mixed PdxB, SerA and hydroxypyruvate reductase members; the SerA members
    are the step-1 enzymes of MODULE:phosphorylated_serine_biosynthesis for P. putida and S. pombe.
  diverged_from_family: false
  representative_members:
