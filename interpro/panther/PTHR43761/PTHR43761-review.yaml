term_assessments:
- assessed_term:
    id: GO:0004617
    label: phosphoglycerate dehydrogenase activity
  scope: UNRESOLVED
  scope_reason: >-
    Held by the SerA members of SF1 (P. putida Q88CM5, S. pombe P87228, M. extorquens C5APD6, H.
    influenzae P43885), but SF1 also holds PdxB 4-phosphoerythronate dehydrogenases and
    hydroxypyruvate reductases, and it is the family's only subfamily. Neither the family nor the
    subfamily determines the activity, and no residue determinant is curated here.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43761/PTHR43761-paint.tsv
    supporting_text: "PTHR43761\tPTN000107912\tGO:0004617\tF\tIBD\tfalse\tUniProtKB:P9WNX3\ttaxon:2"
