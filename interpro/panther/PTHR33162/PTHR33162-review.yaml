    supporting_text: As per degree of homology, TatA and TatB evolved early from a common ancestor whilst TatE emerged from TatA by a late gene duplication event.
  - reference_id: file:interpro/panther/PTHR33162/PTHR33162-paint.tsv
    supporting_text: "PTHR33162\tPTN002109144\tGO:0043953\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0033281
    label: TAT protein transport complex
  scope: FAMILY_WIDE
  scope_reason: >-
    TatB and TatA are both constituents of the Tat translocase; the purified E.
    coli complex contains only TatA, TatB and TatC.
  supported_by:
  - reference_id: PMID:11279240
    supporting_text: we have purified the Tat complex from E. coli, and we show that it contains only TatA, TatB, and TatC.
- assessed_term:
    id: GO:0005048
    label: signal sequence receptor activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Signal-peptide recognition by the TatBC receptor is the conserved activity
    of the TatB members. 154 of the 165 reviewed entries are in scope: 149
    bacterial tatB in SF1, 4 plant TATB in SF3, and Synechocystis P73010. It is a
    manual term assessment; no PAINT node asserts it. The other 11 cyanobacterial
    and plastid TatA proteins in SF1 are listed as exceptions. P73010 (gene
    tatA1) is kept in scope because its 126-residue length is TatB-like, whereas
    the excepted cyanobacterial TatA proteins are 77 to 91 residues long.
  supported_by:
  - reference_id: PMID:29358647
    supporting_text: TatB interacts with the Tat signal peptide downstream of the RR-consensus motif in a proton-motive force independent manner11,14,18.
  - reference_id: PMID:26068441
    supporting_text: TatB and TatC are known to cooperate in binding RR-signal peptides and to form higher-order oligomeric structures.
