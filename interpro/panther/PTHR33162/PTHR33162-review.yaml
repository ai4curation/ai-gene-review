family_id: PANTHER:PTHR33162
family_name: SEC-INDEPENDENT PROTEIN TRANSLOCASE PROTEIN TATA, CHLOROPLASTIC
preferred_name: TatB family with cyanobacterial and plastid TatA (Tat receptor and translocase subunits)
summary: >-
  PTHR33162 groups the single-spanning TatA-type proteins of the TatB clade:
  bacterial TatB, plant chloroplast TATB (HCF106), and the cyanobacterial and
  chloroplast TatA (THA4) proteins that descend from the cyanobacterial lineage.
  TatA and TatB share a transmembrane helix followed by an amphipathic helix and
  evolved early from a common ancestor, but they are not interchangeable. In E.
  coli, TatB links TatC monomers into the signal-peptide receptor and binds the
  folded mature domain of the precursor, whereas TatA is recruited to perform
  translocation. Every member is a subunit of a proton-motive-force-dependent
  Tat translocase; the receptor role is specific to the TatB members.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members act in Tat transport and are Tat-complex subunits, and the PAINT
  node PTN002109144, seeded by E. coli TatB, maize HCF106, maize THA4 and
  Arabidopsis HCF106, asserts the transport terms for the whole clade. The
  family is not coherent for the receptor activity: of the 165 reviewed members
  parsed from the entries CSV, 149 are bacterial tatB and 4 are plant TATB (SF3),
  while 12 are cyanobacterial or plastid TatA proteins classified in SF1 that act
  in translocation rather than signal-peptide recognition.
