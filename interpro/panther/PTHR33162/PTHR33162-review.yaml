notes: >-
  The module bacterial_twin_arginine_translocation grounds its TatB receptor
  step on PTHR33162:SF1 and PTN002109144. Because SF1 also holds 12
  cyanobacterial and plastid TatA-type proteins, the GO:0005048 signal sequence
  receptor assessment (matching the NEW rows on the E. coli and P. putida TatB
  gene reviews) excepts the 11 that are plain TatA. No term_assessment is
  recorded for GO:0009977: the activity belongs to the assembled TatABC
  complex, and gene reviews of both TatA and TatB treat 'enables' rows as a
  qualifier defect (contributes_to). Counts were parsed from the entries
  CSV with a CSV parser.
