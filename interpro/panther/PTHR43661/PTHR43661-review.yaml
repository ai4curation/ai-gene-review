- subfamily_id: PANTHER:PTHR43661:SF1
  label: PHOSPHOGLUCONATE DEHYDRATASE
  description: >-
    6-phosphogluconate dehydratases (Edd) of the Entner-Doudoroff pathway, e.g. E. coli Edd
    (P0ADF6) and Rhizobium meliloti Edd (Q9Z3S0); seven reviewed members.
  representative_members:
  - id: UniProtKB:P0ADF6
    label: edd
    gene_symbol: edd
    organism: Escherichia coli (strain K12)
  - id: UniProtKB:Q9Z3S0
    label: edd
    gene_symbol: edd
    organism: Rhizobium meliloti (strain 1021)
  diverged_from_family: true
  divergence_description: >-
    Substrate and pathway shift. Edd dehydrates 6-phospho-D-gluconate to
    2-dehydro-3-deoxy-6-phospho-D-gluconate in the Entner-Doudoroff pathway of sugar-acid
    catabolism. It does not act in branched-chain amino acid synthesis, so dihydroxy-acid
    dehydratase activity and the branched-chain amino acid biosynthesis terms must not descend
    into SF1.
  supported_by:
  - reference_id: PMID:1624451
    supporting_text: encodes the 602-amino-acid, 64,446-Da protein 6-phosphogluconate dehydratase.
node_assessments:
- node_id: PANTHER:PTN000470254
  asserted_term:
    id: GO:0016836
    label: hydro-lyase activity
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: UniProtKB:P05791
    label: ilvD
    organism: Escherichia coli
  - id: UniProtKB:P0ADF6
    label: edd
    organism: Escherichia coli
  - id: UniProtKB:P39358
    label: yjhG
    organism: Escherichia coli
  - id: UniProtKB:P77596
    label: yagF
    organism: Escherichia coli
  assessment: SOUND
  assessment_reason: >-
    Root node of the family (PTHR43661:AN0 in the PANTHER 19.0 TreeGrafter annotation file). The
    seeds deliberately span the three activities in the family (dihydroxy-acid dehydratase,
    6-phosphogluconate dehydratase and D-xylonate dehydratase), and the curator placed only the
    shared parent, hydro-lyase activity, at the root. That is correct for every member. The
    consequence is that no PAINT node in this family asserts dihydroxy-acid dehydratase activity
    (GO:0004160), so E. coli IlvD and the other IlvD members of SF3 get only the generic
    hydro-lyase IBA. This is an under-annotation, not an error. A GO:0004160 node would have to
    sit below SF3 on a clade that excludes YjhG and YagF.
  supported_by:
  - reference_id: PMID:35535733
    supporting_text: It belongs to the ilvD/EDD superfamily that also includes sugar acid dehydratases (DHTs).
