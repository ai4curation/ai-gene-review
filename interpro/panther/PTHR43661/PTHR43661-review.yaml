family_id: PANTHER:PTHR43661
family_name: D-XYLONATE DEHYDRATASE
preferred_name: Bacterial-type IlvD/EDD Fe-S hydro-lyases (E. coli-type dihydroxy-acid dehydratase, Edd, D-xylonate dehydratases)
summary: >-
  Prokaryotic members of the IlvD/EDD superfamily of iron-sulfur-dependent sugar-acid and
  dihydroxy-acid dehydratases. Most members of the reviewed inventory are dihydroxy-acid
  dehydratases (IlvD, EC 4.2.1.9), which dehydrate (2R)-2,3-dihydroxy-3-methylbutanoate to
  2-oxoisovalerate (valine and leucine precursor) and
  (2R,3R)-2,3-dihydroxy-3-methylpentanoate to 3-methyl-2-oxopentanoate (isoleucine precursor),
  the third shared step of branched-chain amino acid biosynthesis. The family also holds two
  paralogous activities on the same chemistry: 6-phosphogluconate dehydratase (Edd), the first
  enzyme of the Entner-Doudoroff pathway, and the E. coli D-xylonate dehydratases YjhG and YagF
  of D-xylose oxidation. The characterized E. coli IlvD, and the IlvD enzymes of Staphylococcus
  aureus and Campylobacter jejuni in the same family, carry a [4Fe-4S] cluster that is
  inactivated by oxygen. Plant, fungal and mycobacterial dihydroxy-acid dehydratases, which
  include the [2Fe-2S] spinach-type enzyme lineage, are in the separate PANTHER family
  PTHR21000. All members are soluble cytoplasmic enzymes of bacteria and archaea.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared chemistry (Fe-S-cluster-dependent dehydration of a 2,3-dihydroxy acid) holds
  family-wide, so the generic hydro-lyase term is safe. The specific substrate is not.
  PTHR43661:SF1 is the Entner-Doudoroff 6-phosphogluconate dehydratase Edd, which has no role in
  branched-chain amino acid synthesis. PTHR43661:SF3 is itself mixed: of its 425 reviewed members
  423 are named dihydroxy-acid dehydratases, but it also contains, and is named after, the
  E. coli D-xylonate dehydratases YagF and YjhG, which coexist in E. coli with the dedicated
  dihydroxy-acid dehydratase IlvD. Dihydroxy-acid dehydratase activity is therefore safe only for
  the IlvD-named members of SF3, not for the family.
