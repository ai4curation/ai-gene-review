subfamilies:
- subfamily_id: PANTHER:PTHR43661:SF3
  label: D-XYLONATE DEHYDRATASE YAGF-RELATED
  description: >-
    The main subfamily (425 of 432 reviewed members). It holds the bacterial and archaeal
    biosynthetic dihydroxy-acid dehydratases, including E. coli IlvD (P05791), Pseudomonas putida
    KT2440 IlvD (Q88CQ2), and the [4Fe-4S] IlvD enzymes of Staphylococcus aureus and
    Campylobacter jejuni. In the branched-chain amino acid pathway these enzymes carry out the
    third shared step, upstream of the transaminase. PANTHER's name comes from the two E. coli
    D-xylonate dehydratases YagF (P77596) and YjhG (P39358), which are also in SF3; they belong to
    D-xylose oxidation, not to branched-chain amino acid synthesis. The BCAA module does not use
    a PANTHER selector for this step: it uses NCBIfam TIGR00110 because the fungal and plant
    enzymes are in PTHR21000.
