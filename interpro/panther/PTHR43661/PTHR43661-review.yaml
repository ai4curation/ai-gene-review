notes: >-
  Member counts and subfamily assignments are from the reviewed (Swiss-Prot) inventory in
  entries.csv (432 members: 425 SF3, 7 SF1); panther.obo lists only SF1 and SF3. Node receivers
  were read from the PAINT UniProt GAF. P. putida KT2440 IlvD (Q88CQ2) is SF3 in both its UniProt
  PANTHER cross-reference and the PANTHER 19.0 classification, but it is not in the PAINT UniProt
  GAF, so its IBA receipt was not checked. UniProt's cofactor line for E. coli IlvD ([2Fe-2S],
  from HAMAP MF_00012) conflicts with the experimental [4Fe-4S] finding for the purified enzyme;
  this review follows the experimental papers. The PSEPK ilvD gene review marks the IEA rows for
  hydro-lyase activity and branched-chain amino acid biosynthetic process as over-annotated,
  whereas this review judges both terms correct for IlvD (the first is merely generic). The E. coli
  ilvD gene review was being written in parallel when this family review was created.
