  assessment: SOUND
  assessment_reason: >-
    The family contains only bacteria and archaea (no eukaryotic entries in the reviewed
    inventory), and its characterized members are soluble cytoplasmic enzymes with no
    membrane or secretion role reported. Cytosol is correct for every member. The 40 receivers in the PAINT UniProt GAF are
    all prokaryotic IlvD, Edd, YjhG and YagF proteins.
