  - reference_id: PMID:35535733
    supporting_text: Inductively-coupled plasma-optical emission
      spectroscopy (ICP-OES) measurements are consistent with the presence of [4Fe-4S]
      clusters in both enzymes.
  - reference_id: PMID:26083940
