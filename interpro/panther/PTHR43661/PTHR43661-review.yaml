residue_sites:
- site_id: fes_cluster_ligands
  label: Fe-S cluster cysteine ligands (E. coli-type IlvD)
  description: >-
    Cysteines that UniProt (HAMAP rule MF_00012) annotates as cluster ligands in E. coli IlvD.
    HAMAP describes the cluster as [2Fe-2S], but the purified E. coli enzyme contains a [4Fe-4S]
    cluster (PMID:8325851, PMID:7771772), so the positions are recorded as cluster ligands
    without asserting the cluster type. Members of the [2Fe-2S] PTHR21000 lineage carry a third
    cysteine ligand that this numbering does not include.
  anchor:
    id: UniProtKB:P05791
    label: ilvD
    gene_symbol: ilvD
    organism: Escherichia coli (strain K12)
  anchor_sequence_version: 5
  residues:
  - position: 122
    expected:
    - C
    role: Fe-S cluster ligand
  - position: 195
    expected:
    - C
    role: Fe-S cluster ligand
  required_for:
  - term:
      id: GO:0016836
      label: hydro-lyase activity
    strength: CONTRIBUTES
    rationale: >-
      In the IlvD/EDD family the active-site Fe-S cluster acts as the Lewis acid that binds and
      activates the substrate hydroxyl for dehydration, so loss of the cluster ligands removes
      the catalytic cofactor. Kept at CONTRIBUTES because the positions come from an automatic
      HAMAP annotation rather than a structure of this protein.
    supported_by:
    - reference_id: PMID:35535733
      supporting_text: One of the main characteristics of this family is the presence of an Fe−S
        cluster in the active site, that is essential for the catalytic function of these enzymes.
  site_source: UNIPROT_FEATURE
  positive_controls:
  - id: UniProtKB:Q88CQ2
    label: ilvD
    gene_symbol: ilvD
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/ilvD/ilvD-ai-review.yaml
    control_position: 122
    control_residue: C
- site_id: catalytic_mg_site
  label: Magnesium ligands and catalytic serine (E. coli-type IlvD)
  description: >-
    UniProt (HAMAP rule MF_00012) Mg(2+)-binding residues of E. coli IlvD (Asp81, Asp123, the
    carboxylated Lys124 and Glu491) and the proton-acceptor Ser517.
  anchor:
    id: UniProtKB:P05791
    label: ilvD
    gene_symbol: ilvD
    organism: Escherichia coli (strain K12)
  anchor_sequence_version: 5
  residues:
  - position: 81
    expected:
    - D
    role: Mg(2+) ligand
  - position: 123
    expected:
    - D
    role: Mg(2+) ligand
  - position: 124
    expected:
    - K
    role: Mg(2+) ligand via N6-carboxylysine
  - position: 491
    expected:
    - E
    role: Mg(2+) ligand
  - position: 517
    expected:
    - S
    role: proton acceptor
  required_for:
  - term:
      id: GO:0004160
      label: dihydroxy-acid dehydratase activity
    strength: CONTRIBUTES
    rationale: >-
      The metal site positions the dihydroxy-acid substrate next to the Fe-S cluster and the
      serine abstracts the C3 proton in the dehydration. The positions are HAMAP-propagated, so
      the strength is not raised to REQUIRED.
  site_source: UNIPROT_FEATURE
  positive_controls:
