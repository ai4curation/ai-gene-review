family_id: PANTHER:PTHR43661
family_name: D-XYLONATE DEHYDRATASE
preferred_name: IlvD/Edd iron-sulfur sugar-acid dehydratase family
summary: >-
  PTHR43661 is the IlvD/Edd family of iron-sulfur cluster hydro-lyases that dehydrate
  vicinal-diol sugar acids to 2-keto-3-deoxy products. PANTHER splits it into two
  functionally distinct subfamilies. SF3 holds the dihydroxy-acid dehydratases (IlvD) of
  branched-chain amino acid biosynthesis together with the E. coli D-xylonate dehydratases
  YjhG and YagF. SF1 holds the 6-phosphogluconate dehydratases (Edd) that catalyse the first
  committed step of the Entner-Doudoroff pathway, converting 6-phospho-D-gluconate to
  2-dehydro-3-deoxy-6-phospho-D-gluconate (KDPG), in E. coli, Zymomonas, Pseudomonas,
  Rhizobium and Helicobacter. The hydro-lyase chemistry is family-wide; substrate and
  pathway are set by subfamily.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The committed member inventory lists 425 reviewed SF3 entries (nearly all named
  dihydroxy-acid dehydratase, plus D-xylonate dehydratases) and 7 reviewed SF1 entries, all
  named phosphogluconate dehydratase. The shared activity is generic dehydration of a sugar
  acid; the specific substrates and pathways differ between the subfamilies.
