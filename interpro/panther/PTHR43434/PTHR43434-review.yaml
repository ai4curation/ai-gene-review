  assessment_reason: >-
    The sole seed is M. tuberculosis PtkA, reported as a protein-tyrosine kinase. A protein kinase
    activity in an HAD-fold hydrolase would be unusual, since HAD enzymes transfer phosphoryl groups
    through an aspartyl-phosphate intermediate and normally hydrolyse rather than transfer them, and
    the PtkA study is not cached here, so the seed cannot be judged. What can be judged is the
    propagation: the P. putida SF20 member PP_0094, a 216-residue HAD hydrolase with no kinase
    domain, receives the term from this node and its review removes it. Even if PtkA is a genuine
    kinase, the node probably sits too deep for that activity.
