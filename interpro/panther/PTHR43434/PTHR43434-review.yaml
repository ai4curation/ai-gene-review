  assessment_reason: >-
    The seed shows that Gph dephosphorylates the 2-phosphoglycolate released by repair of
    3'-phosphoglycolate DNA ends, a salvage step downstream of repair rather than part of it: Gph
    does not act on DNA, and the gph mutation did not change susceptibility to bleomycin or
    peroxide. The E. coli gph review therefore marks the IBA as over-annotated, while the P. putida
