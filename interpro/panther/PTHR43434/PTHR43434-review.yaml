notes: >-
  The glycolate/glyoxylate assimilation module grounds its phosphoglycolate phosphatase role on
  SF1 (E. coli Gph, P. putida PP_0416), not on the family: a family-level selector would take in
  PhnX phosphonatases, MupP MurNAc-6P phosphatases, YrfG-type nucleotidases and PpaX
  pyrophosphatases. The PAINT phosphoglycolate phosphatase and DNA repair IBDs at PTN001052204
  reach the PhnX (SF19) and MupP (SF23) subfamilies; both corpus members remove them. Open points:
  the PP_0094 review proposes phosphoglycolate phosphatase for an SF20 member below the PAINT IRD
  that removes it, and the PP_1907 review accepts the term in SF24 although the MupP study doubts
  it, so SF24 is included in the term scope only provisionally.
