family_id: PANTHER:PTHR43434
family_name: PHOSPHOGLYCOLATE PHOSPHATASE
preferred_name: HAD subfamily IA small-molecule phosphohydrolases (phosphoglycolate phosphatase Gph/CbbZ, phosphonoacetaldehyde hydrolase PhnX, MurNAc-6-phosphate phosphatase MupP, nucleotidases, PpaX pyrophosphatase)
summary: >-
  A large bacterial family of haloacid dehalogenase (HAD)-superfamily hydrolases (subfamily IA,
  the CbbY/CbbZ/Gph/YieH group) that share the Rossmann-like HAD core with an N-terminal DxD
  motif whose first aspartate is the covalent nucleophile, Mg2+ as cofactor, and a small cap
  domain that shapes the substrate pocket. The family name reflects its best-characterized
  members, the bacterial 2-phosphoglycolate phosphatases (E. coli Gph and its orthologs; SF1),
  which hydrolyse the 2-phosphoglycolate released when 3'-phosphoglycolate DNA ends are repaired
  and so return the two-carbon unit to glycolate metabolism; related Calvin-cycle-associated
  CbbZ phosphoglycolate phosphatases sit in SF13 and SF24. Other subfamilies have different
  substrates and, in one case, a different reaction: phosphonoacetaldehyde hydrolases (PhnX;
  SF19) cleave a carbon-phosphorus bond through a Schiff-base lysine supplied by the cap domain,
  MupP (SF23) dephosphorylates N-acetylmuramate 6-phosphate in Pseudomonas peptidoglycan
  recycling, and further subfamilies contain nucleotidases (E. coli YrfG, SF3; SF20) and the
  PpaX pyrophosphatases (SF26).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  HAD aspartyl-phosphate chemistry and Mg2+ dependence are shared, but substrate and reaction
  differ by subfamily. Phosphoglycolate phosphatase is established for SF1 (E. coli Gph,
  biochemically) and is the HAMAP-rule call for its orthologs. SF19 PhnX enzymes are C-P bond
  hydrolases that use a Schiff-base mechanism; SF23 contains the experimentally characterized
  MurNAc-6P phosphatase MupP, whose discoverers argue 2-phosphoglycolate is not its substrate;
  SF3 and SF20 carry nucleotidase names and SF20 also holds Mycobacterium PtkA, reported as a
  protein-tyrosine kinase; SF26 holds the PpaX pyrophosphatases. The PAINT phosphoglycolate
  phosphatase IBD sits deep enough that it reaches the PhnX and MupP subfamilies.
