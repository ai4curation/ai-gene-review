    Sound for the Gph lineage (SF1): E. coli Gph, the only seed, is a highly specific
    2-phosphoglycolate phosphatase, and the gph review accepts the IBA. The node, however, is deep:
    corpus members in SF19 (P. putida PhnX), SF23 (P. putida MupP) and SF24 (PP_1907) all receive
    the term from it, and only the SF20 clade below PTN001822758 is cut off by an IRD. PhnX is a
    phosphonoacetaldehyde C-P hydrolase and MupP a MurNAc-6P phosphatase that its discoverers
    argue does not act on 2-phosphoglycolate; both gene reviews remove the term. SF3 (YrfG) and
    SF26 (PpaX) are probably also below this node, but no corpus member confirms it. IRDs at the
    PhnX and MupP clades would confine the term to the phosphoglycolate phosphatase lineages.
