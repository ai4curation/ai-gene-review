  label: PHOSPHOGLYCOLATE PHOSPHATASE
  description: >-
    Bacterial 2-phosphoglycolate phosphatases of the Gph type (E. coli K-12 Gph, P. putida KT2440
    PP_0416). They hydrolyse 2-phosphoglycolate to glycolate and phosphate with high specificity,
    requiring Mg2+ (and, for E. coli Gph, chloride). In vivo, Gph salvages the 2-phosphoglycolate
    released during repair of 3'-phosphoglycolate DNA ends. This subfamily holds the family's
    PAINT seed and is the one used by the glycolate/glyoxylate module.
