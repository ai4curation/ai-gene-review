family_id: PANTHER:PTHR10279
family_name: ORNITHINE DECARBOXYLASE ANTIZYME
preferred_name: Ornithine decarboxylase antizyme family
summary: >-
  Antizymes are polyamine-induced inhibitors of ornithine decarboxylase. Their synthesis needs a
  polyamine-stimulated +1 ribosomal frameshift; they bind ODC monomers, block dimerization and target
  ODC for ubiquitin-independent proteasomal degradation. The family contains the metazoan antizymes
  1-3 and the fungal antizymes, such as S. pombe spa1 and S. cerevisiae OAZ1.
functional_coherence: COHERENT
coherence_reason: >-
  All characterized members inhibit ODC. Antizyme 3 (SF9) is testis-specific and the paralogs differ
  in regulation, but the activity is shared.
