  function assignments across clades (sphingosine kinase activity (GO:0008481), ATP-dependent diacylglycerol kinase activity
  (GO:0004143), lipid kinase activity (GO:0001727), ceramide kinase activity (GO:0001729) and 1 additional molecular function
  term(s)), indicating clade-level functional specialization across the family.
