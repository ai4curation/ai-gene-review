family_id: PANTHER:PTHR12358
family_name: SPHINGOSINE KINASE
preferred_name: lipid kinases with sphingosine, ceramide and acylglycerol specificity
summary: >-
  PTHR12358 is a broad lipid-kinase family that contains reviewed human CERK,
  CERKL, AGK, SPHK1 and SPHK2. Its shared fold supports lipid phosphorylation,
  but substrate specificity separates the human subfamilies: CERK phosphorylates
  ceramide, SPHK1 and SPHK2 phosphorylate sphingosine/sphinganine, AGK
  phosphorylates monoacylglycerol and diacylglycerol in the mitochondrial
  intermembrane space, and CERKL is a non-catalytic CERK-like retinal protein.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  A broad lipid kinase activity is plausible across the experimentally supported
  human kinase branches, but individual substrates and processes must stay on
  subfamily nodes. The root includes bacterial YegS/DagK-like lipid kinases,
  fungal mitochondrial TIM54-like proteins, metazoan sphingosine kinases,
  vertebrate CERK, vertebrate AGK, and a CERKL branch that has retained
  cytoplasmic/nuclear localization and apoptotic-process annotations while
  losing detectable ceramide or sphingosine kinase activity.
