  assessment: UNRESOLVED
  assessment_reason: >-
    This node covers the two human sphingosine kinase subfamilies, but the term
    is the wrong direction for the supporting human enzymes: SPHK1 and SPHK2
    consume sphingosine to form S1P rather than biosynthesizing the sphingosine
    base. The human reviews MODIFY inherited GO:0046512 rows to sphingosine
    metabolic process where the row evidence is a sphingosine kinase source.
    PAINT has no structured action for changing an asserted term while leaving
    its node in place, so this request needs upstream term replacement rather
    than a PAINT move or pruning action.
