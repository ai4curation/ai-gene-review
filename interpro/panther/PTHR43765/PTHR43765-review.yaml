notes: >-
  Used by modules/coenzyme_a_biosynthesis.yaml (panE_activity). The module grounds the annoton
  on the whole family PANTHER:PTHR43765, but the ketopantoate reductase function is SF2-only;
  PANTHER:PTHR43765:SF2 would be the precise descriptor. All module representative members
  (Q88N64, P0A9J4, Q9HW09, P38787, Q9HDU6) are SF2. The CBS2 domain content comes from UniProt
  P14905 (InterPro/Pfam cross-references, checked 2026-10-06). The family root node
  PTN000496347 (oxidoreductase activity, cytoplasm) is seeded in part by SGD:S000004044 (OSW2),
  which PANTHER 19.0 classifies in PTHR21708, not this family. That cytoplasm seed looks stale
  against the current tree. No reviewed gene in this repo receives the root terms, so they are
  not assessed here. The S. pombe pan5 gene review is still a stub with every action PENDING.
