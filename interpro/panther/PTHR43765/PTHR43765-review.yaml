- subfamily_id: PANTHER:PTHR43765:SF4
  label: CYTOCHROME B TRANSLATIONAL ACTIVATOR PROTEIN CBS2
  description: >-
    S. cerevisiae CBS2, a nuclear-encoded mitochondrial protein required for translation of
    the mitochondrial COB (cytochrome b) mRNA. It acts through the 5' untranslated leader.
  representative_members:
  - id: UniProtKB:P14905
    label: CBS2
    gene_symbol: CBS2
    organism: Saccharomyces cerevisiae
  diverged_from_family: true
  divergence_description: >-
    UniProt P14905 lists only Pfam PF08546 (ApbA_C) and InterPro IPR013752 (KPR_C). There is
    no ApbA/KPR_N Rossmann domain (PF02558, IPR013332), which Pan5 (P38787) and E. coli PanE
    both have. The NADPH-binding half of the enzyme is therefore missing. The function CBS2
    is known for is mitochondrial translational activation of COB mRNA, not pantoate
    synthesis.
  supported_by:
