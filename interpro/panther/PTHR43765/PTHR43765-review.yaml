family_id: PANTHER:PTHR43765
family_name: 2-DEHYDROPANTOATE 2-REDUCTASE-RELATED
preferred_name: Ketopantoate reductase (PanE/ApbA) family, with the fungal CBS2 paralog
summary: >-
  Ketopantoate reductases (PanE/ApbA, EC 1.1.1.169) reduce 2-dehydropantoate to (R)-pantoate with
  NADPH, the second step of pantoate synthesis. They are two-domain enzymes: an N-terminal
  Rossmann-fold NADP-binding domain (Pfam ApbA, PF02558) and a C-terminal helical domain
  (ApbA_C, PF08546). Bacterial PanE, S. cerevisiae Pan5 and S. pombe pan5 sit in subfamily SF2.
  The family also holds S. cerevisiae CBS2 (SF4), a mitochondrial translational activator of
  cytochrome b mRNA. CBS2 keeps only the C-terminal ApbA_C domain and has no Rossmann
  NADP-binding domain.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The SF2 ketopantoate reductases share the reaction and the two-domain architecture it needs.
  The exception is CBS2 (SF4). It lacks the N-terminal ApbA/Rossmann NADP-binding domain, has no
  known reductase activity, and works in mitochondria as a COB mRNA-specific translational
  activator. Because CBS2 nests inside the PanE node, it inherits the ketopantoate reductase
  and NADP binding terms. The fungal mitochondrion node seeded by CBS2 in turn passes CBS2's
  location to the cytoplasmic Pan5 ketopantoate reductases.
