    supporting_text: Yeast nuclear gene CBS2, required for translational activation of cytochrome
      b, encodes a basic protein of 45 kDa.
  - reference_id: PMID:2270079
    supporting_text: The nuclear genome encoded yeast protein CBS2 is required for translational
      activation of mitochondrial cytochrome b RNA.
