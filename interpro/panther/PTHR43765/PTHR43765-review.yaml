node_assessments:
- node_id: PANTHER:PTN002464833
  asserted_term:
    id: GO:0008677
    label: 2-dehydropantoate 2-reductase activity
  paint_snapshot: '20260530'
  seeds:
  - id: UniProtKB:P0A9J4
    label: panE
    organism: Escherichia coli
  - id: UniProtKB:P37402
    label: panE
    organism: Salmonella typhimurium
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Placing the reaction at the PanE node is sound for the SF2 members: bacterial PanE,
    S. cerevisiae Pan5 and S. pombe pan5 all carry both KPR domains. In the PAINT UniProt GAF,
    however, CBS2 (P14905, SF4) also descends from this node and so receives
    2-dehydropantoate 2-reductase activity. CBS2 lacks the N-terminal ApbA Rossmann domain that
    binds NADPH, has no reported reductase activity, and has a different, characterized
    function. An IRD at the CBS2 branch is needed. The NADP binding term at the same node
    (GO:0050661, snapshot 20180502) needs the same pruning, since the missing domain is the
    NADP-binding one.
  affected_subfamilies:
  - id: PANTHER:PTHR43765:SF4
    label: CYTOCHROME B TRANSLATIONAL ACTIVATOR PROTEIN CBS2
  supported_by:
  - reference_id: PMID:3070350
    supporting_text: It has no significant homology to any known protein.
- node_id: PANTHER:PTN001093729
  asserted_term:
    id: GO:0005739
    label: mitochondrion
  node_taxon:
    id: NCBITaxon:4751
    label: Fungi
  paint_snapshot: '20230112'
  seeds:
  - id: SGD:S000002605
    label: CBS2
    organism: Saccharomyces cerevisiae
  assessment: TOO_DEEP
  assessment_reason: >-
    The only seed is CBS2, and its mitochondrial location comes from its translational
    activator role on mitochondrial COB mRNA. Putting the term on the Fungi node makes every
    fungal ketopantoate reductase inherit it, including S. cerevisiae Pan5 and S. pombe pan5
    (SF2). Pan5 has no targeting presequence and has been seen only in the cytoplasm. The
    S. cerevisiae gene review removes the IBA, and the coenzyme A module places the reductase
    in the cytosol. The term should be restricted to the CBS2 branch (SF4).
  affected_subfamilies:
  - id: PANTHER:PTHR43765:SF2
    label: 2-DEHYDROPANTOATE 2-REDUCTASE
  supported_by:
  - reference_id: PMID:2270079
    supporting_text: Identification of CBS2 as a mitochondrial protein in Saccharomyces cerevisiae.
  - reference_id: file:genes/yeast/PAN5/PAN5-ai-review.yaml
    supporting_text: Localization propagated from a functionally divergent paralog (CBS2); no evidence
      places the ketopantoate
term_assessments:
- assessed_term:
    id: GO:0008677
    label: 2-dehydropantoate 2-reductase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for the SF2 ketopantoate reductases, not for CBS2 (SF4). The coenzyme A module asserts
    the term for the whole family (panE_activity, family PANTHER:PTHR43765), which is broader
    than the biology. SF2 is the precise scope, and the module's ancestral node PTN002464833
    reaches CBS2 unless pruned. S. cerevisiae Pan5 is not the only ketopantoate reductase in
    yeast: pan5 deletion mutants remain prototrophic.
  applicable_subfamilies:
  - id: PANTHER:PTHR43765:SF2
    label: 2-DEHYDROPANTOATE 2-REDUCTASE
  supported_by:
  - reference_id: PMID:19266201
    supporting_text: loss of PAN5 (related to panE from E. coli) still allows prototrophic growth
  - reference_id: file:genes/yeast/PAN5/PAN5-uniprot.txt
    supporting_text: 'SIMILARITY: Belongs to the ketopantoate reductase family.'
- assessed_term:
    id: GO:0050661
    label: NADP binding
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    NADPH is the hydride donor, and the Rossmann ApbA domain binds it. SF2 members have that
    domain; CBS2 (SF4) does not.
  applicable_subfamilies:
  - id: PANTHER:PTHR43765:SF2
    label: 2-DEHYDROPANTOATE 2-REDUCTASE
  supported_by:
  - reference_id: file:genes/yeast/PAN5/PAN5-uniprot.txt
    supporting_text: DR   Pfam; PF02558; ApbA; 1.
- assessed_term:
    id: GO:0005739
    label: mitochondrion
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    True of CBS2 (SF4), which is imported into mitochondria. No experimental evidence places
    any SF2 ketopantoate reductase there. See the PTN001093729 node assessment.
  applicable_subfamilies:
  - id: PANTHER:PTHR43765:SF4
    label: CYTOCHROME B TRANSLATIONAL ACTIVATOR PROTEIN CBS2
  supported_by:
  - reference_id: PMID:2270079
    supporting_text: Intramitochondrial localization of CBS2 was verified by in vitro import of
      CBS2 protein
- assessed_term:
    id: GO:0005737
    label: cytoplasm
  scope: FAMILY_WIDE
  scope_reason: >-
    The SF2 reductases are soluble cytoplasmic enzymes. In GO the mitochondrion is part of the
    cytoplasm, so the term is also formally true for CBS2. PAINT seeds the term at
    PTN002464833 with CBS2, which is an odd choice, but the conclusion holds for Pan5, whose
    own GFP localization is cytoplasmic.
  supported_by:
  - reference_id: file:genes/yeast/PAN5/PAN5-ai-review.yaml
    supporting_text: The only listed donor is SGD:S000002605 (CBS2), an unusual seed,
