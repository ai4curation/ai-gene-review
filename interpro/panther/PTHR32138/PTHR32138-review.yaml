family_id: PANTHER:PTHR32138
family_name: PHOSPHATIDYLETHANOLAMINE N-METHYLTRANSFERASE
preferred_name: Fungal CHO2/PEM1 phosphatidylethanolamine N-methyltransferase family
summary: >-
  CHO2 (PEM1) is the large, multi-pass ER-membrane methyltransferase that makes the first,
  committing methylation of phosphatidylethanolamine (PE) to phosphatidyl-N-methylethanolamine
  (PMME), using S-adenosyl-L-methionine. OPI3 (PEM2) then makes the second and third
  methylations to phosphatidylcholine. All Swiss-Prot members of the family are fungal. CHO2
  is not related to the small OPI3/PEMT phospholipid methyltransferases of PTHR15458, although
  both are PE-methylation enzymes.
functional_coherence: COHERENT
coherence_reason: >-
  The family has one subfamily (SF0). All 61 Swiss-Prot members are fungal CHO2/choA/chol-1
  orthologs. The single PAINT node, PTN000784835, puts PE N-methyltransferase activity, PC
  biosynthesis and the ER membrane on every descendant. Its seeds are S. cerevisiae CHO2,
  S. pombe cho2 and Neurospora chol-1. No member with a different activity is known.
