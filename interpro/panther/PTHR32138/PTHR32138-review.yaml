      itself.
term_assessments:
- assessed_term:
    id: GO:0004608
    label: phosphatidylethanolamine N-methyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the defining activity, the first methylation of PE to PMME. It is shown for yeast
    PEM1/CHO2 and inherited by all fungal members.
  supported_by:
  - reference_id: PMID:2445736
    supporting_text: The membrane fraction obtained from the transformants carrying PEM1 only catalyzed the
      conversion of PE to phosphatidyl-N-monomethylethanolamine (PMME), the first step of the methylation pathway.
  - reference_id: PMID:22345606
    supporting_text: the first of which is catalyzed by the CHO2-encoded PE methyltransferase
- assessed_term:
    id: GO:0006656
    label: phosphatidylcholine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    CHO2 does the first of the three methylations on the PE-to-PC route, so it takes part in PC
    synthesis directly.
  supported_by:
  - reference_id: PMID:22345606
    supporting_text: PE then undergoes three sequential methylation reactions in the ER
- assessed_term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  scope: FAMILY_WIDE
  scope_reason: >-
    CHO2 is an integral ER-membrane enzyme. Both the module and the PAINT node assert this
    location.
  supported_by:
  - reference_id: PMID:22345606
    supporting_text: PE then undergoes three sequential methylation reactions in the ER
