  assessment: SOUND
  assessment_reason: >-
    PAINT labels the node taxon Eukaryota, but every Swiss-Prot descendant receiving the IBA is
    a fungal CHO2 ortholog. The node is therefore the root of a fungal family, and its seeds
    span yeasts and a filamentous ascomycete. The co-asserted GO:0006656 phosphatidylcholine
    biosynthetic process and GO:0005789 endoplasmic reticulum membrane are equally sound. The
    CHO2 review accepts all three IBAs.
