  name:
    name: Phosphatidylethanolamine N-methyltransferase
    short: CHO2
  description:
  - text: The CHO2 family consists of enzymes known as Phosphatidylethanolamine N-methyltransferases.
      These enzymes are responsible for the SAM-dependent methylation of phosphatidylethanolamine
      (PE) to form phosphatidylmonomethylethanolamine (PMME), which is the first step
      in the methylation pathway of phosphatidylcholine biosynthesis. Members of the
      CHO2 family play a crucial role in the synthesis of phosphatidylcholine, a major
      component of biological membranes and a precursor for signaling molecules. The
      family belongs to the class VI-like SAM-binding methyltransferase superfamily,
      indicating a commonality in their structure and mechanism of action involving
      S-adenosylmethionine (SAM) as the methyl donor.
