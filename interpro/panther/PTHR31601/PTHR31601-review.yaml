  Kgd4 (S. cerevisiae KGD4/YMR31, S. pombe kgd4; mammalian MRPS36, first described as a mitoribosomal
  protein) is a small adaptor that tethers the E3 dihydrolipoyl dehydrogenase to the E1-E2 core of
  the 2-oxoglutarate dehydrogenase complex.
