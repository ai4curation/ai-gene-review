family_id: PANTHER:PTHR43709
family_name: ACONITATE ISOMERASE-RELATED
preferred_name: Aconitate and related organic-acid isomerases
summary: This family includes aconitate-delta-isomerases and enzymes assigned to methylitaconate and oxalomesaconate
  interconversion, including the gallate-pathway tautomerase GalD and the protocatechuate 4,5-cleavage
  pathway allylic isomerase LigU. A shared enzyme fold does not identify the substrate or physiological
  pathway.
functional_coherence: HETEROGENEOUS
coherence_reason: PrpF-family placement supports comparison to the experimentally characterized Shewanella
  methylaconitate isomerase. The exact methylitaconate GO reaction is chemically distinct and requires
  substrate-specific evidence. The Bordetella record name and an electronic EC assignment cannot substitute
  for that evidence.
reference_protein:
  id: UniProtKB:Q88JY0
  label: 4-oxalomesaconate tautomerase
  gene_symbol: galD
  organism: Pseudomonas putida KT2440
  gene_review: genes/PSEPK/galD/galD-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43709:SF3
  label: ISOMERASE YBHH-RELATED
  description: >-
    Holds two experimentally characterized 4-oxalomesaconate (OMA) isomerases with different
    reactions: Pseudomonas putida GalD, a keto-enol tautomerase of the gallate pathway, and
    Novosphingobium KA1 LigU, a 1,3-allylic isomerase that converts OMA to
    (3Z)-2-keto-4-carboxy-3-hexenedioate in the protocatechuate 4,5-cleavage pathway, plus
    the uncharacterized Escherichia coli YbhH. Both characterized reactions transpose a C=C
    bond, but the product differs, so subfamily membership does not determine which OMA
    isomer is formed.
  representative_members:
  - id: UniProtKB:Q88JY0
    gene_symbol: galD
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/galD/galD-ai-review.yaml
  - id: UniProtKB:Q0KJL4
    gene_symbol: ligU
    organism: Novosphingobium sp. KA1
    gene_review: genes/NOVK1/ligU/ligU-ai-review.yaml
  supported_by:
  - reference_id: file:genes/PSEPK/galD/galD-uniprot.txt
    supporting_text: Catalyzes the tautomerization of the 4-oxalomesaconic acid
  - reference_id: file:genes/NOVK1/ligU/ligU-uniprot.txt
    supporting_text: migrated between C3 and C4 via a 1,3-allylic isomerization.
- subfamily_id: PANTHER:PTHR43709:SF2
  label: DUF453 DOMAIN PROTEIN (AFU_ORTHOLOGUE AFUA_6G00360)
  description: Recorded placement of Q7VZI5. Q7VZI5 provides an additional bacterial benchmark member.
    Distinguish isomerization or tautomerization of each organic acid from structurally related reactions
    before propagating an EC label. The current family membership establishes a comparison set, not a
    substrate assignment.
  representative_members:
  - id: UniProtKB:Q7VZI5
    gene_symbol: Q7VZI5
    organism: Bordetella pertussis (strain Tohama I / ATCC BAA-589 / NCTC 13251)
    gene_review: genes/BORPE/Q7VZI5/Q7VZI5-ai-review.yaml
node_assessments:
- node_id: PANTHER:PTN002017920
  asserted_term:
    id: GO:0016863
    label: intramolecular oxidoreductase activity, transposing C=C bonds
  evidence: IBD
  paint_snapshot: '20241126'
  seeds:
  - id: UniProtKB:Q8EJW4
  assessment: SOUND
  assessment_reason: >-
    Seeded by Shewanella PrpF (SF2). Every characterized member reviewed here moves a C=C
    bond within an unsaturated tricarboxylate: PrpF (methylaconitate), GalD (OMA keto-enol
    tautomerization) and LigU (OMA 1,3-allylic isomerization, SF3), so the broad term holds
    across both subfamilies. Substrate-specific children must not be propagated.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43709/PTHR43709-paint.tsv
    supporting_text: "PTHR43709\tPTN002017920\tGO:0016863\tF\tIBD\tfalse"
  - reference_id: file:genes/NOVK1/ligU/ligU-uniprot.txt
    supporting_text: migrated between C3 and C4 via a 1,3-allylic isomerization.
term_assessments:
- assessed_term:
    id: GO:0016863
    label: intramolecular oxidoreductase activity, transposing C=C bonds
  scope: FAMILY_WIDE
  scope_reason: >-
    The broad C=C-transposing isomerase activity is shared by the characterized members of
    both sampled subfamilies (PrpF and methylitaconate/aconitate isomerases in SF2; GalD and
    LigU in SF3). The specific reaction and substrate differ by member and are not family-wide.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43709/PTHR43709-paint.tsv
    supporting_text: "PTHR43709\tPTN002017920\tGO:0016863\tF\tIBD\tfalse"
  - reference_id: file:genes/PSEPK/galD/galD-uniprot.txt
    supporting_text: Catalyzes the tautomerization of the 4-oxalomesaconic acid
  - reference_id: file:genes/NOVK1/ligU/ligU-uniprot.txt
    supporting_text: migrated between C3 and C4 via a 1,3-allylic isomerization.
- assessed_term:
    id: GO:0050100
    label: methylitaconate delta-isomerase activity
  scope: UNRESOLVED
  scope_reason: Biochemical work on Shewanella PrpF establishes a methylaconitate-isomerization role in
    the AcnD-dependent methylcitrate pathway, with in vitro aconitate activity in an earlier assay. These
    reactions must not be equated to methylitaconate delta-isomerization simply because the protein or
    EC label is similar. Q7VZI5 has PrpF-family architecture but no substrate assay or verified pathway
    context establishing this exact GO reaction, and the complete substrate-specific family boundary remains
    unresolved.
  supported_by:
  - reference_id: file:genes/BORPE/Q7VZI5/Q7VZI5-uniprot.txt
    supporting_text: Belongs to the PrpF family
  - reference_id: PMID:29145506
    supporting_text: 'Given that SoPrpF is an isomerase, that SoAcnD is

      a dehydratase'
  - reference_id: PMID:17567742
    supporting_text: 'Results from in

      vitro studies show that PrpF isomerizes trans-aconitate to cis-aconitate.'
