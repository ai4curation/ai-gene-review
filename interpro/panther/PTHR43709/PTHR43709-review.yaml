  seeds:
  - id: UniProtKB:Q8EJW4
  assessment: UNRESOLVED
  assessment_reason: >-
    Seeded by Shewanella PrpF (SF2). The term is sound for PrpF-type isomerases and for the
    LigU 1,3-allylic isomerase (SF3), which move an existing C=C bond. It does not fit the
    GalD-type 4-oxalomesaconate tautomerases (SF3), which catalyze keto-enol interconversion
    (EC 5.3.2.8, GO:0016862). GalD and LigU share subfamily SF3, so the GalD lineage cannot be
    pruned at subfamily level, and the tree position of the GalD clade relative to this node
    was not inspected. Whether the node should reach GalD-type tautomerases is left open; GalD
    is recorded as a member exception in the term assessment.
  supported_by:
