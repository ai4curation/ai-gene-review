family_id: PANTHER:PTHR43709
family_name: ACONITATE ISOMERASE-RELATED
preferred_name: Aconitate and related organic-acid isomerases
summary: This family includes aconitate-delta-isomerases and enzymes assigned to methylitaconate and oxalomesaconate
  interconversion. A shared enzyme fold does not identify the substrate or physiological pathway.
functional_coherence: HETEROGENEOUS
coherence_reason: PrpF-family placement supports comparison to the experimentally characterized Shewanella
  methylaconitate isomerase. The exact methylitaconate GO reaction is chemically distinct and requires
  substrate-specific evidence. The Bordetella record name and an electronic EC assignment cannot substitute
  for that evidence.
subfamilies:
- subfamily_id: PANTHER:PTHR43709:SF2
  label: DUF453 DOMAIN PROTEIN (AFU_ORTHOLOGUE AFUA_6G00360)
  description: Recorded placement of Q7VZI5. Q7VZI5 provides an additional bacterial benchmark member.
    Distinguish isomerization or tautomerization of each organic acid from structurally related reactions
    before propagating an EC label. The current family membership establishes a comparison set, not a
    substrate assignment.
  representative_members:
  - id: UniProtKB:Q7VZI5
    gene_symbol: Q7VZI5
    organism: Bordetella pertussis (strain Tohama I / ATCC BAA-589 / NCTC 13251)
    gene_review: genes/BORPE/Q7VZI5/Q7VZI5-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0050100
    label: methylitaconate delta-isomerase activity
  scope: UNRESOLVED
  scope_reason: Biochemical work on Shewanella PrpF establishes a methylaconitate-isomerization role in
    the AcnD-dependent methylcitrate pathway, with in vitro aconitate activity in an earlier assay. These
    reactions must not be equated to methylitaconate delta-isomerization simply because the protein or
    EC label is similar. Q7VZI5 has PrpF-family architecture but no substrate assay or verified pathway
    context establishing this exact GO reaction, and the complete substrate-specific family boundary remains
    unresolved.
  supported_by:
  - reference_id: file:genes/BORPE/Q7VZI5/Q7VZI5-uniprot.txt
    supporting_text: Belongs to the PrpF family
  - reference_id: PMID:29145506
    supporting_text: 'Given that SoPrpF is an isomerase, that SoAcnD is

      a dehydratase'
  - reference_id: PMID:17567742
    supporting_text: 'Results from in

      vitro studies show that PrpF isomerizes trans-aconitate to cis-aconitate.'
references:
- id: file:genes/BORPE/Q7VZI5/Q7VZI5-uniprot.txt
