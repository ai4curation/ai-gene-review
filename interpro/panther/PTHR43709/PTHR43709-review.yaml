  title: The PrpF protein of Shewanella oneidensis MR-1 catalyzes the isomerization of 2-methyl-cis-aconitate
    during the catabolism of propionate via the AcnD-dependent 2-methylcitric acid cycle.
- id: PMID:17567742
  title: 'The three-dimensional crystal structure of the PrpF protein of Shewanella oneidensis complexed
    with trans-aconitate: insights into its biological function.'
