    supporting_text: "PTHR43709\tPTN002017920\tGO:0016863\tF\tIBD\tfalse"
  - reference_id: file:genes/NOVK1/ligU/ligU-uniprot.txt
    supporting_text: migrated between C3 and C4 via a 1,3-allylic isomerization.
  - reference_id: PMID:29145506
    supporting_text: We show that the SoPrpF protein isomerizes the product of the
      AcnD reaction into the PrpD product (2-MCA]
term_assessments:
- assessed_term:
    id: GO:0016853
    label: isomerase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterized member catalyses an isomerization of an unsaturated organic acid, whether by
    moving a C=C bond (PrpF, LigU) or by keto-enol tautomerization (GalD); all are EC class 5. The
    general isomerase class therefore holds family-wide, while the reaction type and substrate are
    member-specific (see the GO:0016863 and GO:0016862 assessments).
  supported_by:
  - reference_id: PMID:29145506
    supporting_text: Given that SoPrpF is an isomerase
  - reference_id: file:genes/PSEPK/galD/galD-uniprot.txt
    supporting_text: ChEBI:CHEBI:58142; EC=5.3.2.8;
- assessed_term:
    id: GO:0016863
    label: intramolecular oxidoreductase activity, transposing C=C bonds
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    C=C-transposing isomerase activity holds for the PrpF-type members of SF2 and for the
    LigU-type allylic isomerase of SF3. It does not hold for the GalD-type keto-enol
    tautomerases in SF3, listed as a member exception. The specific reaction and substrate
    differ by member and are not family-wide.
  applicable_subfamilies:
  - id: PANTHER:PTHR43709:SF2
    label: DUF453 DOMAIN PROTEIN (AFU_ORTHOLOGUE AFUA_6G00360)
  - id: PANTHER:PTHR43709:SF3
    label: ISOMERASE YBHH-RELATED
  member_exceptions:
