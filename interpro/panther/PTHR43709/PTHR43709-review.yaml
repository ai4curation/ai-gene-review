family_id: PANTHER:PTHR43709
family_name: ACONITATE ISOMERASE-RELATED
preferred_name: Aconitate and related organic-acid isomerases
summary: This family includes aconitate-delta-isomerases and enzymes assigned to methylitaconate and oxalomesaconate
  interconversion, including the gallate-pathway tautomerase GalD and the protocatechuate 4,5-cleavage
  pathway allylic isomerase LigU. A shared enzyme fold does not identify the substrate or physiological
  pathway.
functional_coherence: HETEROGENEOUS
coherence_reason: PrpF-family placement supports comparison to the experimentally characterized Shewanella
  methylaconitate isomerase. The exact methylitaconate GO reaction is chemically distinct and requires
  substrate-specific evidence. The Bordetella record name and an electronic EC assignment cannot substitute
  for that evidence.
reference_protein:
  id: UniProtKB:Q88JY0
  label: 4-oxalomesaconate tautomerase
  gene_symbol: galD
  organism: Pseudomonas putida KT2440
  gene_review: genes/PSEPK/galD/galD-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43709:SF3
  label: ISOMERASE YBHH-RELATED
  description: >-
    Holds two experimentally characterized 4-oxalomesaconate (OMA) isomerases with different
    reactions: Pseudomonas putida GalD, a keto-enol tautomerase of the gallate pathway, and
    Novosphingobium KA1 LigU, a 1,3-allylic isomerase that converts OMA to
    (3Z)-2-keto-4-carboxy-3-hexenedioate in the protocatechuate 4,5-cleavage pathway, plus
    the uncharacterized Escherichia coli YbhH. The two reactions belong to different EC
    sub-subclasses: GalD interconverts keto and enol tautomers (EC 5.3.2.8; the C4 carbonyl
    becomes a new C=C bond), whereas LigU moves an existing C=C bond (EC 5.3.3.-). Subfamily
    membership therefore does not determine the reaction type or which OMA isomer is formed.
  representative_members:
  - id: UniProtKB:Q88JY0
    gene_symbol: galD
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/galD/galD-ai-review.yaml
  - id: UniProtKB:Q0KJL4
    gene_symbol: ligU
    organism: Novosphingobium sp. KA1
    gene_review: genes/NOVK1/ligU/ligU-ai-review.yaml
  supported_by:
  - reference_id: file:genes/PSEPK/galD/galD-uniprot.txt
    supporting_text: Catalyzes the tautomerization of the 4-oxalomesaconic acid
  - reference_id: file:genes/NOVK1/ligU/ligU-uniprot.txt
    supporting_text: migrated between C3 and C4 via a 1,3-allylic isomerization.
- subfamily_id: PANTHER:PTHR43709:SF2
  label: DUF453 DOMAIN PROTEIN (AFU_ORTHOLOGUE AFUA_6G00360)
  description: PrpF methylaconitate isomerases of the AcnD-dependent 2-methylcitrate cycle (Shewanella
    oneidensis, Pseudomonas putida), plus the recorded placement of Q7VZI5. Q7VZI5 provides an additional bacterial benchmark member.
    Distinguish isomerization or tautomerization of each organic acid from structurally related reactions
    before propagating an EC label. The current family membership establishes a comparison set, not a
    substrate assignment.
  representative_members:
  - id: UniProtKB:Q8EJW4
    gene_symbol: prpF
    organism: Shewanella oneidensis (strain ATCC 700550 / JCM 31522 / CIP 106686 / LMG 19005 / NCIMB 14063 / MR-1)
    gene_review: genes/SHEON/prpF/prpF-ai-review.yaml
  - id: UniProtKB:Q88KF3
    gene_symbol: prpF
    organism: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / NCIMB 11950 / KT2440)
    gene_review: genes/PSEPK/prpF/prpF-ai-review.yaml
  - id: UniProtKB:Q7VZI5
    gene_symbol: Q7VZI5
    organism: Bordetella pertussis (strain Tohama I / ATCC BAA-589 / NCTC 13251)
    gene_review: genes/BORPE/Q7VZI5/Q7VZI5-ai-review.yaml
