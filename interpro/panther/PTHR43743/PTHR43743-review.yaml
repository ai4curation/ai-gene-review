notes: '2026-11-07 Kdp reconciliation: final E. coli PMID41259220 strengthens direct ion conduction through
  the KdpA-to-KdpB tunnel using wild-type nanodisc structure and functional mutations. PMID41384914 combines
  simulations with experimental tests of conduction/coupling; detailed interface hydration and gating
  remain mechanistic questions. Historical primary sources and all existing PAINT identities, verdicts
  and evidence are retained. The family transfer concerns the conserved subunit role, not every tested
  ion affinity or regulatory residue in every organism.'
