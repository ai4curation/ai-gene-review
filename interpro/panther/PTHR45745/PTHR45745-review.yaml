    supporting_text: PGM2L1 showed only low (<5%) phosphopentomutase and phosphoglucomutase
      activities compared with PGM2
- subfamily_id: PANTHER:PTHR45745:SF3
  label: PHOSPHOPENTOMUTASE
  description: Vertebrate PGM2, the phosphopentomutase of mammalian cells.
  diverged_from_family: false
node_assessments:
- node_id: PANTHER:PTN001860097
  asserted_term:
    id: GO:0008973
    label: phosphopentomutase activity
  evidence: IBD
  paint_snapshot: '20220925'
  seeds:
  - id: SGD:S000004891
    label: PRM15
    organism: Saccharomyces cerevisiae
  - id: UniProtKB:Q96G03
    label: PGM2
    organism: Homo sapiens
  assessment: UNRESOLVED
  assessment_reason: >-
    Both seeds are eukaryotic enzymes whose main in-vivo role is pentose phosphate mutation, but
    the node also covers the bacterial SF1 phosphoglucomutases, so B. subtilis PgcA and P. putida
    Pgm inherit phosphopentomutase activity. Activity on ribose 1-phosphate is plausible for
    these promiscuous mutases (even the PGM1-type yeast Pgm2 has it), yet no bacterial SF1 member
    has been assayed on pentose phosphates, and bacteria such as B. subtilis carry a separate
    dedicated phosphopentomutase. The placement cannot be confirmed or refuted for the bacterial
    clade without such an assay; the bacterial gene reviews treat the inherited term as
    over-annotation of their physiological role rather than as a demonstrated absence.
  supported_by:
  - reference_id: file:interpro/panther/PTHR45745/PTHR45745-paint.tsv
    supporting_text: "PTHR45745\tPTN001860097\tGO:0008973\tF\tIBD\tfalse"
  - reference_id: PMID:23103740
    supporting_text: The Pgm2 and Pgm3 proteins had almost equal kinetic properties on
      ribose-1-phosphate, but Pgm2 had a 2000 times higher preference for glucose-1-phosphate
      when compared to Pgm3.
- node_id: PANTHER:PTN001860097
  asserted_term:
    id: GO:0006166
    label: purine ribonucleoside salvage
  evidence: IBD
  paint_snapshot: '20211210'
  seeds:
