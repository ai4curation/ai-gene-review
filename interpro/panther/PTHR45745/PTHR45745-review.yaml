family_id: PANTHER:PTHR45745
family_name: PHOSPHOMANNOMUTASE 45A
preferred_name: PGM2-type phosphohexo/phosphopentomutase family (PgcA, PGM3/PRM15, PGM2, PGM2L1)
summary: >-
  A family of the alpha-D-phosphohexomutase superfamily, only distantly related to the PGM1-type
  phosphoglucomutases (PTHR22573), whose members interconvert sugar 1-phosphates and 6- or
  5-phosphates with different substrate preferences in different lineages. Bacterial members
  (SF1), such as Bacillus subtilis PgcA, staphylococcal PgcA, Komagataeibacter CelB and
  Pseudomonas putida Pgm, act as the dedicated alpha-phosphoglucomutase that supplies glucose
  1-phosphate for UDP-glucose and the glucolipid and teichoic acid envelope polymers. The same
  subfamily includes S. cerevisiae Pgm3/PRM15, the major phosphoribomutase of yeast, which has
  only weak phosphoglucomutase activity. Vertebrate PGM2 (SF3) is primarily a phosphopentomutase
  for ribose and deoxyribose 1-phosphate, and vertebrate PGM2L1 (SF2) is a
  1,3-bisphosphoglycerate-dependent glucose-1,6-bisphosphate synthase with little mutase
  activity.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members share the phosphomutase fold, but the physiologically dominant reaction differs:
  phosphoglucomutase in bacterial SF1 members, phosphoribomutase in yeast Pgm3 (also SF1) and
  vertebrate PGM2 (SF3), and glucose-1,6-bisphosphate synthase in vertebrate PGM2L1 (SF2). Single
  enzymes are often promiscuous, so these are differences of preference, and few bacterial
  members have been tested on pentose phosphates.
