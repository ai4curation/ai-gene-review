- subfamily_id: PANTHER:PTHR45745:SF2
  label: GLUCOSE 1,6-BISPHOSPHATE SYNTHASE
  description: Vertebrate PGM2L1, glucose-1,6-bisphosphate synthase.
  diverged_from_family: true
  divergence_description: >-
    PGM2L1 has low phosphopentomutase and phosphoglucomutase activity and works mainly as a
    1,3-bisphosphoglycerate-dependent glucose-1,6-bisphosphate synthase. PAINT records the loss
    with an IRD (NOT GO:0008973, NOT GO:0006166) and a gain of GO:0047933 at PTN002907319.
  supported_by:
