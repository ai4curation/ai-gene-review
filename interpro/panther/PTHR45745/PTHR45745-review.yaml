notes: >-
  PANTHER names the family "PHOSPHOMANNOMUTASE 45A" after the Drosophila member; InterPro calls it
  "Phosphohexose Mutase". Node coverage was read from the PAINT UniProt GAF: B. subtilis PgcA
  (P18159) inherits GO:0008973 and GO:0006166 from PTN001860097, and P. putida Pgm receives the
  same terms by IEA. S. cerevisiae Pgm3 is the PRM15 locus (SGD:S000004891, UniProt Q03262, SF1).
  The PGM1-type phosphoglucomutases (E. coli Pgm, yeast Pgm1/Pgm2, human PGM1) are in PTHR22573.
