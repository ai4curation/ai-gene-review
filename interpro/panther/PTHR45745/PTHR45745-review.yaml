term_assessments:
- assessed_term:
    id: GO:0004614
    label: phosphoglucomutase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The established physiological activity of the bacterial SF1 members (B. subtilis PgcA, by
    mutant enzyme assays and genetics), asserted for SF1 by the
    udp_glucose_and_udp_galactose_biosynthesis module with B. subtilis PgcA and P. putida Pgm.
    Vertebrate PGM2 (SF3) retains weaker phosphoglucomutase activity and PGM2L1 (SF2) little;
    yeast Pgm3 in SF1 is mainly a phosphoribomutase. PAINT places no phosphoglucomutase IBD in
    this family.
