    label: PRM15
    organism: Saccharomyces cerevisiae
  assessment: UNRESOLVED
  assessment_reason: >-
    Supported for yeast Pgm3, whose deletion leads to ribose 1-phosphate accumulation after a
    purine perturbation, but seeded only by that one fungal protein and propagated to the
    bacterial phosphoglucomutases, whose established role is glucose 1-phosphate supply for
    envelope polymers. The same caveat as the GO:0008973 assessment applies.
  supported_by:
  - reference_id: file:interpro/panther/PTHR45745/PTHR45745-paint.tsv
    supporting_text: "PTHR45745\tPTN001860097\tGO:0006166\tP\tIBD\tfalse"
  - reference_id: PMID:23103740
    supporting_text: Only mutants with a deletion of PGM3 hyper-accumulated ribose-1-phosphate.
- node_id: PANTHER:PTN002907319
