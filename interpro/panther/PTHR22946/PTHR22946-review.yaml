family_id: PANTHER:PTHR22946
family_name: DIENELACTONE HYDROLASE DOMAIN-CONTAINING PROTEIN-RELATED
preferred_name: FrsA-like alpha/beta-hydrolase family
summary: >-
  PTHR22946 is a family of alpha/beta-hydrolase-fold enzymes whose catalytic
  domain resembles the Peptidase S9 domain. Its reviewed members are
  esterases and related hydrolases rather than peptidases: Enterobacterial
  esterase FrsA, cutinases and PET hydrolases, fungal polyketide-tailoring
  hydrolases, the fungal heptaketide hydrolyase AYG1 of conidial pigment
  synthesis, the nicotine-catabolic 2,6-dihydropseudooxynicotine hydrolase,
  and the bacterial FdeB proteins predicted to open a flavonoid-derived lactone.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Hydrolase activity on ester or carbon-carbon bonds is shared, but substrates
  range from triglycerides and polyesters to aromatic polyketides and
  alkaloid-degradation intermediates, and the catalytic mechanism (ester versus
  C-C bond hydrolysis) differs between subfamilies. SF12 is itself mixed: it
  contains fungal heptaketide hydrolyases, an Arthrobacter nicotine-pathway
  hydrolase and the bacterial FdeB proteins.
