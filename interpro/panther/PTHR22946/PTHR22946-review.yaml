- assessed_term:
    id: GO:0016787
    label: hydrolase activity
  scope: FAMILY_WIDE
  scope_reason: All reviewed members are hydrolases of the alpha/beta fold.
  supported_by:
  - reference_id: file:interpro/panther/PTHR22946/PTHR22946-paint.tsv
    supporting_text: "PTHR22946\tPTN007719808\tGO:0016787\tF\tIBD\tfalse\tUniProtKB:P04335"
- assessed_term:
    id: GO:0008236
    label: serine-type peptidase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    The Peptidase S9 catalytic-domain signature reflects the shared fold; no
    reviewed member is named or characterized as a peptidase, and the FdeB
    members lack the beta-propeller that gates substrates in true S9
    peptidases. InterPro2GO rows for peptidase activity and proteolysis on
    FdeB proteins were removed in their gene reviews.
  supported_by:
  - reference_id: file:genes/HERSS/Hsero_1004/Hsero_1004-uniprot.txt
    supporting_text: InterPro; IPR050261; FrsA_esterase-like.
  - reference_id: file:genes/PSEPK/PP_3195/PP_3195-hypotheses/function-hypothesis-go-0008236/openscientist.md
    supporting_text: far too small** to contain the ~250–300-aa seven-bladed β-propeller that is a defining, substrate-gating feature of bona fide S9-family peptidases
- assessed_term:
    id: GO:0052689
    label: carboxylic ester hydrolase activity
  scope: UNRESOLVED
  scope_reason: >-
    Ester hydrolysis is characterized for FrsA-type and cutinase members and
    predicted for FdeB, but AYG1 and 2,6-dihydropseudooxynicotine hydrolase
    cleave carbon-carbon bonds, so the term is not family-wide and no
    subfamily boundary for it can be drawn from the local data.
  supported_by:
  - reference_id: file:interpro/panther/PTHR22946/PTHR22946-entries.csv
    supporting_text: G2X3G9,Heptaketide hydrolyase AYG1
