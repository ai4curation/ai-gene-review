    heptaketide hydrolyases of DHN-melanin synthesis; the bacterial members
    include 2,6-dihydropseudooxynicotine hydrolase and the fde-locus FdeB
    proteins (Hsero_1004, PP_3195). The subfamily name reflects the fungal
    members, and the melanin-pathway role does not apply to the bacteria.
