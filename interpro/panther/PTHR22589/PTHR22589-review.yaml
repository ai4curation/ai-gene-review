family_id: PANTHER:PTHR22589
family_name: CARNITINE O-ACYLTRANSFERASE
preferred_name: Choline/carnitine O-acyltransferase family (CPT1/CPT2/CRAT/CROT/ChAT; yeast CAT2/YAT1/YAT2)
summary: >-
  Choline/carnitine O-acyltransferases transfer an acyl group between coenzyme A and the
  hydroxyl of L-carnitine (or, in choline acetyltransferase, choline) by a conserved
  histidine-dependent mechanism. Acyl-chain preference defines the paralog groups: carnitine
  palmitoyltransferases 1 and 2 (CPT1A/B/C, CPT2) act on long-chain acyl-CoAs and drive the
  mitochondrial carnitine shuttle in animals; carnitine octanoyltransferase (CROT) is
  peroxisomal and medium-chain; carnitine acetyltransferases (animal CRAT, S. cerevisiae CAT2,
  YAT1, YAT2) act on acetyl-CoA. Fungi such as budding yeast use only short-chain carnitine
  acetyltransferases: CAT2 (one gene, mitochondrial and peroxisomal isoforms), YAT1
  (mitochondrial outer membrane) and cytosolic YAT2. Choline acetyltransferase (ChAT) makes the
  neurotransmitter acetylcholine. Brain CPT1C has little carnitine palmitoyltransferase activity
  and is ER-localized.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All carnitine-acceptor members share carnitine O-acyltransferase chemistry (GO:0016406), but
  the specific molecular function terms are paralog-specific: carnitine O-palmitoyltransferase
  (CPT1A/B, CPT2), carnitine O-acetyltransferase (CRAT, CAT2, YAT1, YAT2) and carnitine
  O-octanoyltransferase (CROT). ChAT (SF14) has changed acceptor from carnitine to choline, and
  CPT1C (SF55) has lost most CPT activity. Neither GO:0004095 nor GO:0004092 is safe at family
  level; both must follow PAINT nodes or subfamilies.
