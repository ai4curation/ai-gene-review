notes: >-
  Subfamily assignments from entries.csv and the PANTHER 19.0 model-organism classification
  files; propagation sets from the cached PAINT UniProt GAF. Module inconsistency: the carnitine
  shuttle module uses the bare family id PANTHER:PTHR22589 for four annotons with two different
  activities (GO:0004095 for CPT1A/CPT2, GO:0004092 for CAT2/YAT1/YAT2). Subfamily ids (or the
  PAINT nodes listed above) would make the activity scoping explicit. The module notes and the
  YeastPathways GO-CAM disagree on CAT2/YAT1 location (GO-CAM puts all three in cytosol); PAINT
  agrees with the gene reviews (CAT2 mitochondrion+peroxisome, YAT1 mitochondrion, YAT2
  cytosol). The CAT2 gene review core function has no process or location; not a family issue.
