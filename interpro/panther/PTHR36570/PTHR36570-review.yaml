family_id: PANTHER:PTHR36570
family_name: DISULFIDE BOND FORMATION PROTEIN B
preferred_name: DsbB and DsbI membrane protein-disulfide relays
summary: DsbB-family membrane proteins recycle exported thiol-disulfide oxidoreductases. E. coli DsbB
  and Pseudomonas DsbB paralogs transfer electrons from protein thiols to quinones. The family also includes
  DsbI proteins associated with specialized DsbL pathways; conserved relay chemistry does not imply identical
  clients, interchangeable partners or a universal quinone species.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Protein disulfide relay chemistry is coherent across DsbB/DsbI, but SF1 DsbI and the
  two DsbB subfamilies differ in pathway context. Quinone-dependent catalysis is directly established
  for representative DsbB proteins, not every family member.
reference_protein: &id001
  id: UniProtKB:P0A6M2
  gene_symbol: dsbB
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/dsbB/dsbB-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR36570:SF1
  label: PROTEIN-DISULFIDE OXIDOREDUCTASE DSBI
  description: Specialized DsbI branch, present under the reviewed PAINT node. Its pathway context must
    not be replaced with the generic E. coli DsbA client inventory.
  representative_members:
  - id: UniProtKB:P0A1H1
    gene_symbol: dsbI
    organism: Salmonella typhimurium
- subfamily_id: PANTHER:PTHR36570:SF2
  label: DISULFIDE BOND FORMATION PROTEIN B
  description: DsbB relay branch containing E. coli DsbB and PA14 DsbB1. PAO1 paralog names in the PAINT
    tree do not equal PA14 gene names.
  representative_members:
  - *id001
  - id: UniProtKB:Q02TM7
    gene_symbol: dsbB1
    organism: Pseudomonas aeruginosa PA14
    gene_review: genes/PSEAB/dsbB1/dsbB1-ai-review.yaml
- subfamily_id: PANTHER:PTHR36570:SF3
  label: DISULFIDE BOND FORMATION PROTEIN B
  description: Second DsbB branch. Branch placement alone does not identify native quinone or prove interchangeable
    kinetics in another Pseudomonas strain.
  representative_members:
  - id: UniProtKB:P21482
    gene_symbol: dsbB1
    organism: Pseudomonas aeruginosa PAO1
term_assessments:
- assessed_term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  scope: FAMILY_WIDE
  scope_reason: The reversible protein thiol-disulfide reaction is compatible with oxidation of reduced
    DsbA or DsbL by the membrane relay. The reductase label does not restrict physiological direction,
    and the protein donor is not a generic small thiol.
  supported_by: &id004
  - &id002
    reference_id: PMID:10428033
    supporting_text: DsbB uses quinones as electron acceptors, allowing various choices for electron transport
      to support disulfide bond formation.
  - &id003
    reference_id: PMID:24327342
    supporting_text: In vitro reconstitution of the pathway confirms that both PaDsbB1 and PaDsbB2 shuttle
      electrons from PaDsbA1 to membrane-bound quinones.
- assessed_term:
    id: GO:0016672
    label: oxidoreductase activity, acting on a sulfur group of donors, quinone or similar compound as
      acceptor
  scope: SUBFAMILY_ONLY
  scope_reason: Purified E. coli and PA14 reconstitutions ground quinone-linked DsbB catalysis in the
    two DsbB subfamilies. SF1 DsbI is excluded from this family-scope assertion pending equivalent direct
    acceptor evidence; exclusion is an evidence boundary, not a demonstrated loss.
  supported_by:
  - *id002
  - *id003
  applicable_subfamilies:
  - id: PANTHER:PTHR36570:SF2
    label: DISULFIDE BOND FORMATION PROTEIN B
  - id: PANTHER:PTHR36570:SF3
    label: DISULFIDE BOND FORMATION PROTEIN B
- assessed_term:
    id: GO:0006457
    label: protein folding
  scope: FAMILY_WIDE
  scope_reason: The membrane relay performs the cofactor-regeneration step of oxidative folding by reoxidizing
    its protein oxidoreductase partner. This is participation in the reaction system, not merely a knockout
    requirement or a claim that DsbB is a folding substrate. Specialized DsbL/DsbI context does not change
    that role.
  supported_by: &id005
  - *id002
  - *id003
