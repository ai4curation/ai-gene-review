  name:
    name: Bacterial Ice Nucleation
    short: Bact_Ice_Nucleation_Prot
  description:
  - text: Ice nucleation protein family members are specialized bacterial proteins
      that facilitate the nucleation of ice crystals in supercooled water. These proteins
      are characterized by the presence of numerous imperfect repeats of a consensus
      octapeptide, which contributes to their unique function. The octapeptide sequence
      typically includes the amino acids A-G-Y-G-S-T-L-T or A-G-Y-G-S-T-X-T, with
      X representing a variable amino acid. The structure of these proteins is further
      defined by a 16-residue and a regional 48-residue periodicity, which may play
      a role in their ice-nucleating activity. Ice nucleation proteins are crucial
      for certain bacteria to influence their environment, potentially playing a role
      in frost damage to plants, precipitation formation, and other ecological processes.
