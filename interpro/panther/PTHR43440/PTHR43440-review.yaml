family_id: PANTHER:PTHR43440
family_name: UREASE
preferred_name: Urease catalytic alpha subunit / alpha domain family
summary: >-
  Nickel-dependent ureases (EC 3.5.1.5) built around the TIM-barrel amidohydrolase
  catalytic unit that carries the carbamylated-lysine-bridged dinickel active site.
  The family groups the catalytic chain of every common urease architecture: the
  alpha subunit (UreC) of the three-chain (alpha-beta-gamma)3 bacterial enzyme
  (Klebsiella aerogenes, Pseudomonas putida), the alpha chain named UreB in the
  two-chain Helicobacter enzyme, and the C-terminal catalytic region of the
  single-chain plant ureases (Arabidopsis URE, soybean and jack bean ureases).
  The active site is assembled in vivo by the UreD/UreF/UreG (plus UreE in bacteria)
  activation machinery, and the mature enzyme hydrolyses urea to ammonia and
  carbamate/bicarbonate. Fungal single-chain ureases (for example
  Schizosaccharomyces pombe ure1) are classified by PANTHER in PTHR33569, not here.
functional_coherence: COHERENT
coherence_reason: >-
  All 271 cached members fall in the single subfamily PTHR43440:SF1 and are named
  urease, urease subunit alpha, or (in two-chain Helicobacter-type operons) urease
  subunit beta; the dinickel ligand set (four His, the carbamylated Lys and an Asp)
  is conserved at aligned positions in bacterial, Helicobacter and plant members.
  The only incoherent PAINT signal (cyclic-amide hydrolase activity from
  PTN000182670) reaches one member through a tree misplacement, not through a
  functional difference.
