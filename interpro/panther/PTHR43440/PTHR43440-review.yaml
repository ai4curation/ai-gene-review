    supporting_text: "PTHR43440\tPTN001702453\tGO:0043419\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0016812
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in cyclic amides
  scope: NOT_APPLICABLE
  scope_reason: >-
    Urea is a linear amide, and urease activity sits under linear-amide hydrolase
    activity. The term reaches this family only via the misplacement of
    Synechocystis P73061 under the dihydropyrimidinase node PTN000182670.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43440/PTHR43440-paint.tsv
    supporting_text: "PTHR43440\tPTN000182670\tGO:0016812\tF\tIBD\tfalse"
