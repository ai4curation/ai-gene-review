residue_sites:
- site_id: dinickel_active_site
  label: Carbamate-bridged dinickel active site
  description: >-
    Ni(1) is bound by His134, His136 and Asp360, Ni(2) by His246 and His272, and
    both are bridged by the carbamate of Lys217 (K. aerogenes UreC numbering).
    His320 is the general acid. The apoenzyme is preorganized, so these ligands
    are what the UreD/UreF/UreG(/UreE) machinery loads with CO2 and nickel. The
    same six ligands sit at aligned positions in the Helicobacter alpha chain
    (offset +2) and in the C-terminal catalytic region of plant single-chain urease.
  anchor:
    id: UniProtKB:P18314
    label: ureC
    organism: Klebsiella aerogenes
  anchor_sequence_version: 1
  site_source: UNIPROT_FEATURE
  residues:
  - position: 134
    expected: [H]
    role: Ni(2+) 1 ligand
  - position: 136
    expected: [H]
    role: Ni(2+) 1 ligand
  - position: 217
    expected: [K]
    role: N6-carboxylysine bridging both nickel ions
  - position: 246
    expected: [H]
    role: Ni(2+) 2 ligand
  - position: 272
    expected: [H]
    role: Ni(2+) 2 ligand
  - position: 360
    expected: [D]
    role: Ni(2+) 1 ligand
  required_for:
  - term:
      id: GO:0009039
      label: urease activity
    strength: CONTRIBUTES
    rationale: >-
      The two nickel ions and the bridging carbamate are the catalytic centre, and
      the apoenzyme, which lacks only the carbamate and nickel, is inactive. The
      requirement is mechanistically absolute, but it is recorded as CONTRIBUTES
      because no family member is known to have lost the site, so no natural
      negative control exists to license contradicting a gene review.
    supported_by:
    - reference_id: PMID:8718850
      supporting_text: >-
        With the exception of
        the active site, in which a water molecule takes the place of the missing
        carbamate and nickel atoms, the structure of the apoenzyme is nearly identical
        to that of the holoenzyme
  positive_controls:
  - id: UniProtKB:Q88J04
    label: ureC
    organism: Pseudomonas putida KT2440
    control_position: 217
    control_residue: K
  - id: UniProtKB:P69996
    label: ureB
    organism: Helicobacter pylori 26695
    control_position: 219
    control_residue: K
  - id: UniProtKB:Q9SR52
    label: URE
    organism: Arabidopsis thaliana
    control_position: 488
    control_residue: K
term_assessments:
- assessed_term:
    id: GO:0009039
    label: urease activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Ancestral at the family root node, the dinickel ligand set is conserved, and no
    reviewed member lacks the activity. In multi-chain ureases the alpha chain is
    the catalytic unit, so the term is correctly enabled by members of this family;
    the gamma/beta (or fused gamma-beta) chains only contribute.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43440/PTHR43440-paint.tsv
    supporting_text: "PTHR43440\tPTN001702453\tGO:0009039\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0043419
    label: urea catabolic process
  scope: FAMILY_WIDE
  scope_reason: Direct consequence of urease activity; asserted at the same root node.
  supported_by:
