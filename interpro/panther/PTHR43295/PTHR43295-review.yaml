family_id: PANTHER:PTHR43295
family_name: ARGININE DECARBOXYLASE
preferred_name: Biosynthetic arginine decarboxylase (SpeA/ADC) family
summary: >-
  Fold-type III pyridoxal 5'-phosphate decarboxylases that convert L-arginine to agmatine
  and CO2 (EC 4.1.1.19), the first step of the arginine route to putrescine. The family
  joins bacterial biosynthetic SpeA (SF9; E. coli, Pseudomonas, cyanobacteria and many
  other Proteobacteria) with the plant arginine decarboxylases (SF1, SF2, SF7; Arabidopsis
  ADC1/ADC2, oat and rice ADC2, tomato ADC). It is distinct from the fold-type I
  acid-inducible biodegradative arginine decarboxylase AdiA and from the pyruvoyl-dependent
  archaeal-type arginine decarboxylases. The closest relatives outside the family are the
  fold-type III ornithine and diaminopimelate decarboxylases (PTHR11482 and others).
functional_coherence: COHERENT
coherence_reason: >-
  Every Swiss-Prot member in the cached inventory (105 entries in four populated
  subfamilies) is named an arginine decarboxylase, and the experimentally studied members,
  E. coli SpeA and the Arabidopsis ADC1/ADC2 paralogs, are PAINT seeds for both arginine
  decarboxylase activity and putrescine biosynthesis at the same node. No catalytically
  divergent subfamily is known.
