  assessment: SOUND
  assessment_reason: >-
    Arginine decarboxylation is the first step of the arginine route to putrescine in
    both bacteria and plants, and the enzyme performs that step itself. In P. aeruginosa
    SpeA and SpeC are redundant putrescine sources whose double loss causes putrescine
    auxotrophy. The E. coli SpeA review accepts the IBA.
