  name:
    name: Methylthiotransferase t(6)A modification
    short: Methylthiotransferase_t6A
  description:
  - text: 'The Methylthiotransferase family is responsible for the post-transcriptional
      modification of certain tRNAs. Members of this family catalyze the methylthiolation
      of N6-threonylcarbamoyladenosine (t(6)A), resulting in the formation of 2-methylthio-N6-threonylcarbamoyladenosine
      (ms(2)t(6)A) at position 37. This modification occurs in tRNAs that read codons
      starting with adenine, which is essential for the proper functioning of the
      genetic code translation machinery. The family includes two distinct subfamilies:
      CDKAL1, which is found across various species including humans, and MtaB, which
      is identified in a range of bacteria. The enzymatic activity of the Methylthiotransferase
      family is crucial for maintaining the accuracy and efficiency of protein synthesis.'
