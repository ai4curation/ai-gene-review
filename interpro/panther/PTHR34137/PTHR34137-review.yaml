family_id: PANTHER:PTHR34137
family_name: EXODEOXYRIBONUCLEASE 7 SMALL SUBUNIT
preferred_name: Exonuclease VII small subunit (XseB)
summary: >-
  Bacterial Exonuclease VII small subunits (XseB). XseB is a short, noncatalytic
  protein that associates with the catalytic large subunit XseA (PTHR30008) to
  form the heterooligomeric Exonuclease VII, a metal-independent enzyme that
  degrades single-stranded DNA bidirectionally. The small subunit is a
  structural gene of the enzyme and is required for DNA binding and activity.
  The holoenzyme is one of several redundant single-stranded DNA exonucleases
  that excise the error-containing strand in mismatch repair.
functional_coherence: COHERENT
coherence_reason: >-
  The family has a single subfamily (SF1), and all 426 reviewed members in the
  cached inventory are named Exodeoxyribonuclease 7 small subunit (gene xseB).
  PAINT places the activity and the cytosol location on one bacterial node
  seeded by E. coli XseB.
