    assessment_reason: >-
      YajC is an inner-membrane protein of the holo-translocon; location is the
      only PAINT assertion, and it is correct for the family. PAINT asserts no
      function, which matches the absence of a known activity.
    supported_by:
      - reference_id: PMID:27435098
        supporting_text: Here, we show the bacterial holo-translocon (HTL) - a supercomplex of SecYEG-SecDF-YajC-YidC - is a bona fide resident of the Escherichia coli inner membrane
term_assessments:
  - assessed_term:
      id: GO:0043952
      label: protein transport by the Sec complex
    scope: UNRESOLVED
    scope_reason: >-
      YajC is part of Sec assemblies, but mutant analysis shows no required role
      in export, so participation in the process is not established and the
      term is not asserted for the family.
    supported_by:
      - reference_id: PMID:7507921
        supporting_text: An analysis of yajC mutations constructed in vitro and recombined onto the chromosome indicates that yajC is neither essential nor a sec gene.
notes: >-
  Membership of the SecDF-YajC and holo-translocon assemblies is the only
  well-supported statement for this family. The post-translational Sec module
  therefore lists YajC as a complex-associated subunit with no molecular
  function.
