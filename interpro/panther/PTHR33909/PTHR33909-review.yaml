family_id: PANTHER:PTHR33909
family_name: SEC TRANSLOCON ACCESSORY COMPLEX SUBUNIT YAJC
functional_coherence: MOSTLY_COHERENT
preferred_name: YajC/YrbF Sec translocon accessory subunit family
summary: >-
  PTHR33909 contains YajC (YrbF in Bacillus subtilis), a small bacterial inner
  membrane protein with one transmembrane segment and a cytoplasmic domain.
  YajC is encoded with SecD and SecF in many bacteria and co-purifies with them
  as the SecDF-YajC subcomplex and with SecYEG and YidC in the holo-translocon.
  Its own mechanistic contribution is unknown: E. coli yajC mutants are viable
  and show no secretion defect.
coherence_reason: >-
  All 32 cached reviewed members are in subfamily SF1 and are the same kind of
  translocon-associated protein, so membership and location are coherent. No
  molecular activity is established for any member, so the family is not
  coherent in the sense of a shared, characterized function.
