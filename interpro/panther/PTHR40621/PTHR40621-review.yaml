term_assessments:
- assessed_term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  scope: FAMILY_WIDE
  scope_reason: The conserved function represented by DNA-binding transcription factor activity is the
    family core for intact members. DNA-binding transcriptional regulation is the common framework, but
    oxidative-stress sensing, metal resistance and a particular target regulon need branch-specific evidence.
    NCU07379 should not inherit every phenotype of yeast Yap1 or other fungal paralogs.
  supported_by:
  - reference_id: PMID:2542125
    supporting_text: 'Disruption of the YAP1 gene demonstrates

      this gene is not essential but is required for AP-1 recognition

      element-dependent transcriptional activation.'
