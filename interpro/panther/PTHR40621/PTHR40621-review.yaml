family_id: PANTHER:PTHR40621
family_name: TRANSCRIPTION FACTOR KAPC-RELATED
summary: Fungal Yap/AP-1-related bZIP transcription factors regulate stress-responsive gene expression.
  Their shared DNA-binding and dimerization architecture is used in distinct oxidative, chemical and metabolic
  response programs.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory includes multiple Yap paralogs, HapX, Cap1 and arsenic-response Arr1 proteins.
  Primary Yap1 experiments establish AP-1-element-dependent transcriptional activation (PMID:2542125).
  NCU07379 has a fungal bZIP-family placement supporting transcriptional regulation, but cysteine-based
  peroxide sensing, iron regulation and arsenic resistance are different branch-specific programs, not
  a universal oxidative-stress annotation.
subfamilies:
