family_id: PANTHER:PTHR38761
family_name: GLUTAMATE--CYSTEINE LIGASE
preferred_name: Bacterial glutamate-cysteine ligase (GshA) family
summary: >-
  Gamma-proteobacterial glutamate-cysteine ligases (GshA) make gamma-glutamylcysteine, the first
  step of glutathione synthesis (P. putida GshA). Some Firmicutes have bifunctional GshAB fusions.
  They are unrelated to eukaryotic GCLC (PTHR11164).
