family_id: PANTHER:PTHR38761
family_name: GLUTAMATE--CYSTEINE LIGASE
preferred_name: Bacterial glutamate--cysteine ligase (GshA and GshAB/GshF) family
summary: >-
  Bacterial type-1 glutamate--cysteine ligases of the glutamine-synthetase-like fold that make
  gamma-L-glutamyl-L-cysteine, the first step of glutathione synthesis. The single subfamily
  (SF1) holds monofunctional GshA (104 of 119 inventoried members, e.g. E. coli and P. putida
  KT2440 GshA) and bifunctional GshAB/GshF fusions (15 members, e.g. Pasteurella multocida),
  whose N-terminal GshA-like domain is followed by an ATP-grasp glutathione synthetase domain.
  The family is unrelated in sequence to the eukaryotic catalytic subunit GCLC/GSH1
  (PTHR11164).
functional_coherence: COHERENT
coherence_reason: >-
  One subfamily in which every member is named glutamate--cysteine ligase or GshAB, and the
  characterized members (E. coli GshA, P. multocida GshF) share the activity. GshAB members
  additionally carry glutathione synthetase activity through a second, non-PANTHER domain.
