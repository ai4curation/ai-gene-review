family_id: PANTHER:PTHR23423
family_name: ORGANIC SOLUTE TRANSPORTER-RELATED
preferred_name: OST-alpha/TMEM184/Hfl1 membrane proteins
summary: This membrane-protein group includes OST-alpha transporters, TMEM184 proteins and fungal Hfl1.
  Characterized mammalian OST-alpha works with OST-beta in organic-solute transport, while Hfl1 recruits
  Atg8 during vacuolar membrane-protein turnover. A membrane-transport name therefore does not specify
  a conserved substrate or even the same cellular mechanism for every member.
functional_coherence: HETEROGENEOUS
coherence_reason: Curated IPR005178 explicitly includes OST-alpha, TMEM184 proteins and fungal Hfl1, while
  the inventory also contains plant LAZ1 proteins. OST-alpha/OST-beta bile-acid export and Hfl1-mediated
  Atg8 recruitment are distinct mechanisms. CG6836 is an OST-alpha-like sequence with inferred transport
  function; the evidence does not identify its substrate or require a mammalian intestinal transport mechanism.
