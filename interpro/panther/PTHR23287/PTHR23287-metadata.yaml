  name:
    name: Hermansky-Pudlak syndrome 5 (HPS5)
    short: HPS5
  description:
  - text: The HPS5 family proteins are primarily involved in the biogenesis of specialized
      organelles such as eye pigment granules, which are akin to late endosomes or
      lysosomes. These proteins are essential for the delivery of molecular components
      to lysosomes, a process crucial for the formation of pigment granules in the
      eye. In humans and mice, HPS5 family members are implicated in the regulation
      of lysosome synthesis and function, as well as the formation of melanosomes
      and platelet dense granules. They also play a role in intracellular vesicular
      trafficking in fibroblasts and may influence the general functions of integrins.
