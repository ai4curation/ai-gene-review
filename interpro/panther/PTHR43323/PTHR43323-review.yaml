family_id: PANTHER:PTHR43323
family_name: 3-HYDROXY-3-METHYLGLUTARYL COENZYME A SYNTHASE
preferred_name: HMG-CoA synthase family
summary: >-
  Hydroxymethylglutaryl-CoA synthases: cytosolic HMGCS1 and fungal ERG13/hcs1 supply the mevalonate
  pathway, and mitochondrial HMGCS2 catalyses the rate-limiting step of ketogenesis.
functional_coherence: COHERENT
coherence_reason: >-
  All subfamilies are HMG-CoA synthases; they differ in compartment and pathway (sterol synthesis
  vs ketogenesis).
