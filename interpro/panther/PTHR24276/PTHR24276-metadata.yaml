  name:
    name: Peptidase S1 family serine proteases
    short: Peptidase_S1
  description:
  - text: The peptidase S1 family is a diverse group of serine proteases with a variety
      of biological functions. Members of this family are involved in digestion, blood
      meal processing, and immune evasion. Some exhibit fibrinolytic activity, cleaving
      specific peptide bonds in fibrinogen, which can lead to anticoagulant effects.
      Others are involved in the establishment of parasitic infections by binding
      to host cells or transforming parasites into forms suitable for infection. Additionally,
      certain members act as secreted effectors in plant-pathogen interactions, targeting
      host endoglucanases to suppress plant defense responses. The family also includes
      enzymes that regulate insect development and reproduction, as well as allergens
      with protease activity.
