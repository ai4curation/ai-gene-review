      Hexapeptide FANSHY motif (Phe2172-Tyr2177) in the cytosolic tail of human
      SORL1 recognized by the VPS26A arrestin-fold subunit of the retromer
      cargo-selective complex for endosome-to-TGN retrieval.
    anchor:
