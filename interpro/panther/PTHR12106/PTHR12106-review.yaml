    residues:
      - position: 2172
        expected:
          - F
        role: >-
          N-terminal phenylalanine of the cytosolic FANSHY motif (2172..2177);
          FANSHY->AAASHA substitution does not block initial endocytosis from
          the plasma membrane
      - position: 2177
        expected:
          - Y
        role: >-
          C-terminal tyrosine of the cytosolic FANSHY motif (2172..2177)
    motif:
      pattern_regex: "FANSHY"
      start: 2172
      end: 2177
      role: Cytosolic sorting motif in the SORL1 cytoplasmic tail
    required_for:
      - term:
          id: GO:0006892
          label: post-Golgi vesicle-mediated transport
        strength: CONTRIBUTES
        rationale: >-
          The cytosolic FANSHY motif (2172..2177) in the cytoplasmic tail of
