family_id: PANTHER:PTHR12106
family_name: SORTILIN RELATED
preferred_name: VPS10-domain cargo-sorting receptors (Sortilin, SORL1, SorCS1-3, Vps10)
summary: >-
  VPS10-domain sorting receptors (IPR006581 / IPR050310) across Eukaryota,
  including fungal Vps10/Pep1 vacuolar hydrolase receptors (SF27), metazoan
  sortilin (SORT1, SF23), mosaic sortilin-related receptor (SORL1/SORLA, SF27),
  and vertebrate SorCS1-3 receptors (SF8, SF9, SF10). All family members are
  single-pass type I transmembrane glycoproteins bearing an N-terminal
  10-bladed beta-propeller VPS10 luminal ligand-binding domain and a short
  cytosolic tail containing sorting motifs recognized by retromer
  (VPS26-VPS35-VPS29) and GGA/AP-1 clathrin adaptors, enabling iterative
  cargo-sorting cycles between the trans-Golgi network (TGN), endosomes, and
  the cell surface.
functional_coherence: COHERENT
coherence_reason: >-
  All characterized subfamilies (SF27 Vps10/SORL1, SF23 SORT1, SF8-SF10
  SorCS1-3) function as transmembrane VPS10-domain cargo-sorting receptors that
  bind luminal/extracellular protein cargos and cycle between the TGN,
  endosomes, and plasma membrane via retromer-mediated retrograde retrieval and
  GGA/AP-1/AP-2 anterograde/endocytic transport.
