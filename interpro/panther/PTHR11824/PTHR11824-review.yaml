family_id: PANTHER:PTHR11824
family_name: VOLTAGE-DEPENDENT CALCIUM CHANNEL BETA SUBUNIT
summary: Voltage-gated calcium-channel beta subunits are cytosolic auxiliary proteins that regulate channel
  assembly, trafficking and gating through interaction with pore-forming alpha1 subunits. Their SH3/guanylate-kinase-like
  architecture supports protein interactions. It does not create a calcium-conducting pore or establish
  guanylate-kinase catalysis.
functional_coherence: COHERENT
coherence_reason: The reviewed human CACNB3 record and calcium-channel-beta classification support channel
  regulation. Different beta paralogs and splice forms tune different channel complexes, so an L-type
  complex cannot be assumed for all members. The distinction between regulatory-subunit activity and contributing
  to a channel complex is mechanistically essential.
