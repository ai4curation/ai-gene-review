family_id: PANTHER:PTHR12039
family_name: NICOTINAMIDE MONONUCLEOTIDE ADENYLYLTRANSFERASE
preferred_name: Eukaryotic NMN/NaMN adenylyltransferase (NMA/NMNAT) family
summary: >-
  Nicotinamide/nicotinate mononucleotide adenylyltransferases make NAD or deamido-NAD from NMN or
  NaMN and ATP, the step shared by all NAD synthesis routes. The family contains S. cerevisiae NMA1/NMA2,
  S. pombe SPAC806.06c, Drosophila Nmnat and human NMNAT1 (nuclear), NMNAT2 (Golgi/axonal) and NMNAT3
  (mitochondrial).
functional_coherence: COHERENT
coherence_reason: All subfamilies use both NMN and NaMN; the human paralogs differ in compartment.
