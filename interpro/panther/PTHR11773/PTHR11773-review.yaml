family_id: PANTHER:PTHR11773
family_name: GLYCINE DEHYDROGENASE, DECARBOXYLATING
preferred_name: Glycine dehydrogenase (decarboxylating) (GcvP/GLDC/GCV2) family
summary: >-
  The PLP-dependent P protein of the glycine cleavage system decarboxylates glycine and transfers
  the aminomethyl group to the lipoyl arm of the H protein. The family contains bacterial GcvP (single-chain,
  or split into GcvPA/GcvPB), S. cerevisiae GCV2, S. pombe gcv2, plant GDCSP and animal GLDC.
functional_coherence: COHERENT
coherence_reason: All subfamilies are glycine cleavage P proteins.
