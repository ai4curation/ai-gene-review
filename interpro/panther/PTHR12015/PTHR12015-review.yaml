- assessed_term:
    id: GO:0070098
    label: chemokine-mediated signaling pathway
  scope: FAMILY_WIDE
  scope_reason: >-
    Every functional chemokine in PANTHER:PTHR12015 initiates a chemokine-mediated signaling
    pathway upon binding its cognate GPCR (note that PAINT currently asserts GO:0070098 on
    PTN000245709, PTN000428508, and PTN008302571, but omits it from the ELR+ CXC clade
    PTN002564680, even though CXCL8 and its relatives carry direct experimental evidence
    for GO:0070098 and its child GO:0038112).
  supported_by:
  - reference_id: PMID:32610344
    supporting_text: >-
      Here we present the cryo-electron microscopy structures of interleukin-8 (IL-8, also
      known as CXCL8)-activated human CXC chemokine receptor 2 (CXCR2) in complex with Gi
      protein, along with a crystal structure of CXCR2 bound to a designed allosteric
      antagonist.
- assessed_term:
    id: GO:0038112
    label: interleukin-8-mediated signaling pathway
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    GO:0038112 specifically describes the series of molecular signals initiated by
    interleukin-8 (CXCL8) binding to its receptors CXCR1 and CXCR2, and is therefore
    restricted to the INTERLEUKIN-8 subfamily (PANTHER:PTHR12015:SF200). Other ELR+ CXC
    chemokines that activate CXCR2 (such as CXCL1, CXCL2, CXCL5, and CXCL6) participate in
    the parent process GO:0070098 (chemokine-mediated signaling pathway) rather than the
    ligand-specific GO:0038112 term.
  applicable_subfamilies:
