    label: interleukin-8 receptor binding
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Direct high-affinity dual agonism of both CXCR1 (IL8RA) and CXCR2 (IL8RB) is the
    signature activity of the INTERLEUKIN-8 subfamily (PANTHER:PTHR12015:SF200), alongside
    CXCL6 (PANTHER:PTHR12015:SF201) and CXCL1 (PANTHER:PTHR12015:SF192) which bind CXCR2
    (and CXCR1 for CXCL6).
  applicable_subfamilies:
