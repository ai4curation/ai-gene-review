- assessed_term:
    id: GO:0048245
    label: eosinophil chemotaxis
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Direct eosinophil chemotaxis within PANTHER:PTHR12015 is mediated by CCR3-binding
    chemokines—principally the eotaxins (CCL11 in SF146, CCL24 in SF100) and multi-receptor
    CCR3 agonists such as CCL5 (SF170) and CCL13 (SF147)—whereas CCR5-selective chemokines
    such as CCL4 (SF103) and CXCR1/2-selective chemokines such as CXCL8 (SF200) do not
    directly chemoattract CCR3+ eosinophils as a core function.
