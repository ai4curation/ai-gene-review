family_id: PANTHER:PTHR12015
family_name: SMALL INDUCIBLE CYTOKINE A
preferred_name: Chemokine (CC, CXC, XC, and CX3C intercrine alpha/beta) family
summary: >-
  Secreted chemotactic cytokines (chemokines) sharing the conserved intercrine alpha/beta
  fold (a three-stranded antiparallel beta-sheet overlain by a C-terminal alpha-helix
  stabilized by one or two disulfide bonds). Family members bind class A seven-transmembrane
  G-protein-coupled chemokine receptors (primarily Gi/o-coupled CXCR, CCR, XCR, and CX3CR
  receptors) and glycosaminoglycans on endothelial and extracellular matrix surfaces to
  establish haptotactic and chemotactic gradients that direct leukocyte trafficking,
  degranulation, and inflammatory signaling. Major vertebrate clades within this family
  include ELR+ CXC chemokines (such as CXCL8/IL-8 and CXCL1-3/5-7, which signal through
  CXCR1 and CXCR2 on neutrophils), ELR- CXC chemokines (such as CXCL9/10/11 via CXCR3 and
  CXCL12 via CXCR4), and CC chemokines (such as CCL2, CCL3, CCL4, CCL5, and eotaxins via
  CCR receptors).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Virtually all family members are secreted extracellular signaling ligands that possess
  chemokine activity (GO:0008009), initiate chemokine-mediated GPCR signaling pathways
  (GO:0070098), and direct cell chemotaxis (GO:0060326). Functional divergence across
  subfamilies reflects receptor-class specificity (CXCR vs CCR vs XCR/CX3CR), target
  leukocyte subset (e.g., neutrophil chemotaxis for ELR+ CXC chemokines vs eosinophil
  chemotaxis for CCR3-binding eotaxins vs monocyte/T-cell recruitment for CCR5 agonists),
  and specific receptor-mediated pathway terms such as interleukin-8-mediated signaling
  pathway (GO:0038112) restricted to the CXCL8 subfamily (PANTHER:PTHR12015:SF200).
