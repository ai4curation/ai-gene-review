- assessed_term:
    id: GO:0008009
    label: chemokine activity
  scope: FAMILY_WIDE
  scope_reason: >-
    All members of PANTHER:PTHR12015 are secreted chemokines that act as chemotactic ligands
    for seven-transmembrane chemokine receptors.
  supported_by:
