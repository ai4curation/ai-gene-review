  - id: PANTHER:PTN000212531
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    The clade below the node (42 leaves) holds the animal, choanoflagellate and Dictyostelium SUCLG2-type
    subunits, among them the experimentally characterised GTP-specific enzymes. The evidence for the loss
    is the pigeon G-type enzyme, which is highly specific for GTP/GDP, the pig GTP-specific enzyme, and
    descent; for the Monosiga and invertebrate members it rests on descent alone. For Dictyostelium there
    is an assay of the enzyme and not of the gene: the enzyme purified from growing D. discoideum uses GTP
    (PMID:7771809), and its partially purified alpha subunit is phosphorylated with GTP and little or not
    at all with ATP (PMID:8448193). That is consistent with loss of ADP use, but the abstracts do not
    assign it to the beta gene Q869S7, which has no experimental annotation, and Dictyostelium also has
    an A-type beta gene. Gln at
    position 20, which 38 of the 42 leaves carry, is a conserved feature of the clade and supports the
    paired gain of GTP use. It is not evidence for loss of ADP use: the E. coli Pro20-to-Gln mutant has a
    lower apparent Km for GTP with the parameters for the other substrates unchanged, and the ATP-specific
    Blastocystis enzyme has Gln20. The loss is right for the unikont G-type clade. Whether it extends
    deeper is open, because four Paramecium tetraurelia leaves with Gln20 (PTN002624621) sit in the sister
    clade, keep the ADP-forming term and are unassayed. Plant, trypanosomatid and Trichomonas beta subunits
    are outside the node and keep the root ADP-forming term.
    Two leaves below the node are misplaced. Leaf PTN001721370, Xanthomonas campestris SucC (Q8P676), has
    Pro20 and is 58% identical to E. coli SucC against 45% to human SUCLG2; PANTHER puts it below a
    horizontal-transfer node inside the animal clade, and it wrongly receives NOT GO:0004775. The verdict
    stays LOSS_SUPPORTED and not LOSS_TOO_BROAD because no narrower node holds the G-type members and
    excludes this leaf: the defect is the placement of one bacterial sequence, not the depth of the loss.
    Leaf PTN002273929 is a Ustilago maydis protein (A0A0D1E3R8) that lacks the N-terminal ATP-grasp domain,
    so position 20 does not exist in it; both sequence trees place it outside the clade.
    Human SUCLG2 sits below this node and its review accepts the resulting NOT annotation, noting that no
    assay of the human enzyme with ADP was read and that the negative rests on descent and on the pigeon,
    pig and human enzymes being GTP-specific. The yeast, S. pombe and human SUCLA2 genes are in the other
    daughter clade.
