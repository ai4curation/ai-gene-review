  assessment_reason: >-
    Changed from SOUND. The gain is placed at the node that contains the experimentally characterised
    seeds, rat, pig and human SUCLG2; human SUCLG2 accepts it as its core activity. Gln at position 20,
    which contacts guanine in the pig enzyme, is a conserved feature of the clade (38 of 42 leaves) and not
    a marker of the activity. GDP-forming activity of the unassayed members (Monosiga, invertebrates) is
    inferred from descent. Dictyostelium is not unassayed: the enzyme purified from growing D. discoideum
    uses GTP (PMID:7771809), its alpha subunit is phosphorylated with GTP and little or not at all with ATP
    (PMID:8448193), and GDP is a substrate from which the enzyme forms GTP (PMID:8240297). These assays are
    on the enzyme and are not assigned to the beta gene Q869S7, which has no experimental annotation. The term does not reach the fungal beta subunits of the tree,
    which are in the other daughter clade, or plant, trypanosomatid and Trichomonas subunits. The node does
    not capture every GDP-using member: Trichomonas vaginalis lies outside it and has GDP-dependent
    activity by assay, and the bacterial SucC enzymes that accept GTP are outside it too. PAINT seeds
    GDP-forming activity with bacterial SucD at the LUCA node of the alpha family (PTHR11117) but did not
    seed this tree with E. coli SucC, which has experimental evidence for the activity (PMID:10353839), so
    bacterial SucC gets no GDP-forming IBA while bacterial SucD does. The Paramecium Gln20 clade
