notes: |-
  Re-reviewed on 2026-11-11 from an evolutionary perspective, together with PTHR11117. The PANTHER tree (release 19) was read node by node (the node ids PTN008330414, PTN002483419, PTN008982090, PTN008961326, PTN002273929, PTN002624621 and PTN000929379, which are not in the PAINT slice, are emitted by the analysis script under panther_tree_nodes in results.yaml; node ids PTN000212656 and PTN004310554 were read from the PANTHER release 19 treeinfo service on 2026-11-12 and are not in results.yaml) and the A-type/G-type split was checked with independent bootstrapped trees (genes/yeast/LSC2/LSC2-bioinformatics). The dating of the beta duplication differs from PMID:9765291, which placed it early in multicellular eukaryotes; Dictyostelium and a choanoflagellate each have both copies, and PMID:18452512 reports that a taxonomically broad range of eukaryotes possess two distinct forms of the beta subunit. Two OpenScientist runs (genes/yeast/LSC1/LSC1-hypotheses, genes/yeast/LSC2/LSC2-hypotheses) reached the same annotation verdicts and followed PMID:9765291 on the dating. Human SUCLG2 (Q96I99) and E. coli SucC (P0A836), both PAINT seeds, were reviewed afterwards. The SUCLG2 review also corrects an InterPro2GO ATP binding annotation (from the ATP-grasp subdomain signature IPR013815) to GTP binding; that mapping is wrong for the characterised GTP-specific members of the clade below PTN000929335. The S. pombe ATP-citrate synthase subunit O13907 was checked on 2026-11-12: it is in the InterPro member list of SF10, is not a leaf of the PAINT tree and carries no succinyl-CoA synthetase annotation in QuickGO; the same holds for Arabidopsis ACLA-1 (Q9SGY2) and ACLA-2 (O22718).

  Retrospective audit corrections (2026-11-12).
  Node verdicts changed. At PTN000212531, GO:0042709, GO:0004775 and GO:0006104 went from SOUND to NEEDS_PRUNING for the Aquifex aeolicus leaf O67330 (PTN000212656), a citryl-CoA synthetase large-subunit ortholog that is a leaf of the PAINT tree. GO:0006099 at PTN000212531 went from SOUND to NEEDS_PRUNING for the hydrogenosomal Trichomonas vaginalis clade PTN008982090 and the same Aquifex leaf. GO:0004776 at PTN000929335 went from SOUND to NEEDS_PRUNING for the Ustilago maydis leaf PTN002273929, a protein without an ATP-grasp domain. The IKR for GO:0004775 at PTN000929335 stays LOSS_SUPPORTED; SF12 was added to its affected subfamilies, and the misplaced Xanthomonas SucC leaf is named as a tree defect. The audit also proposed LOSS_TOO_BROAD for that row; it was not adopted, because no narrower node separates the G-type members from the one misplaced leaf.
  Statements corrected. The earlier text called Gln at position 20 a marker of GDP specificity confined to the clade below PTN000929335. It is not confined to that clade (Paramecium, two bacterial SucC leaves) and it is neither required nor sufficient (Thermus aquaticus, Blastocystis). The earlier text said that plant, stramenopile and excavate subunits keep the ancestral residue and are ADP-forming; trypanosomatids have Glu and Trichomonas has Gly, and Trichomonas vaginalis also has GDP-dependent activity. The earlier text said that fungi kept only the A-type copy; that holds for the 15 fungal genomes in the PANTHER tree and not for Mortierellomycota, Basidiobolus and Rozella (nor for the ascomycete Saitoella complicata, whose Gln20 entry is of unresolved origin). The earlier text said that GDP specificity is a derived state inside the G daughter; that depends on PANTHER's placement of plant subunits in the G daughter, which the sequence trees do not support, so the origin of Gln20 is recorded as unresolved. The statement that the eukaryotic subunit duplicated once at the root of eukaryotes was PANTHER's reconciliation stated as fact and is now attributed to PANTHER. The earlier text said that a Ustilago maydis protein has Ala at position 20; the protein has no ATP-grasp domain and no such position. The earlier text said that the Ustilago position is unstable between tree methods; both sequence trees place it outside the eukaryotic G-type clade and only PANTHER places it inside. The plant seed of the GO:0006104 node is tomato, not Arabidopsis. SF11 was anchored to PTN000929335 and is the Homininae node PTN004310554. The residue site source was STRUCTURE without a PDB entry and is now UNIPROT_FEATURE (P53590 BINDING 58, ligand GTP). The earlier notes said that the InterPro2GO ATP binding mapping is wrong for every member of the clade below PTN000929335; only the pig and human members are characterised. Subfamilies SF12, SF13 and SF16 were added to the scopes that had omitted them.
  Inferences and limits. GDP-forming activity of unassayed Gln20 members below PTN000929335 (Monosiga, invertebrates) is inferred from descent. Dictyostelium was listed here as unassayed and is not: the enzyme purified from growing D. discoideum uses GTP (PMID:7771809), its alpha subunit is phosphorylated with GTP and little or not at all with ATP (PMID:8448193), and GDP is a substrate from which it forms GTP (PMID:8240297). The three abstracts describe the enzyme and its alpha subunit; they do not assign the activity to the beta gene Q869S7, which has no experimental annotation. The residue counts per PANTHER clade come from the position 20 table in genes/yeast/LSC2/LSC2-bioinformatics/RESULTS.md. Sequence identities quoted for the Aquifex leaf (O67330 against Q75VW8 and P0A836; O67546 against P0A836), the Xanthomonas leaf (Q8P676 against P0A836 and Q96I99) and the Trichomonas leaf (A2EBX0 against Q03184, 406 of 407 residues) are local BLOSUM62 alignments of the UniProt sequences made on 2026-11-12; they are not stored in a committed analysis. The Aquifex identities are given as rounded ranges because the value depends on the alignment settings and on whether gap columns are counted: an independent global alignment (identical residues over aligned columns) gave 79.7% and 33.7% for O67330. The audit's count of position 20 residues over the whole InterPro member list was not reproduced here and is not used. The only plant assay found is a 1969 partially purified tobacco preparation (PMID:20925657, abstract only), so plant ATP specificity is modestly supported. The Trichomonas vaginalis activity (PMID:1898409, abstract only) was measured on hydrogenosomal fractions and is not assigned to one of the three beta paralogs.
  For report to PAINT and PANTHER. Leaf PTN001721370 (Xanthomonas campestris SucC, Q8P676) is a bacterial sequence placed inside the metazoan G-type clade; it receives NOT GO:0004775 and GO:0004776 through that placement. Leaf PTN002273929 (Ustilago maydis A0A0D1E3R8) needs an IRD for GO:0004776. The same leaf, which lacks the ATP-grasp domain, also inherits GO:0042709, GO:0006104, GO:0006099 and GO:0005739 (QuickGO, 2026-11-12); whether it is a subunit of any succinyl-CoA synthetase is unknown and those terms were not adjudicated. Leaf PTN000212656 (Aquifex aeolicus O67330) needs an IRD for GO:0004775, GO:0006099, GO:0006104 and GO:0042709. The Trichomonas vaginalis clade PTN008982090 needs an IRD for GO:0005739. E. coli SucC has experimental evidence for GDP-forming activity (PMID:10353839) and is not a seed for GO:0004776 in this tree, while bacterial SucD seeds the term in PTHR11117. Neocallimastix frontalis P53587, malate-CoA ligase beta (P53594, Q98KT9) and sulfoacetate-CoA ligase beta (E5Y8P8) receive node terms as TreeGrafter IEAs, which PAINT loss annotations do not stop.
