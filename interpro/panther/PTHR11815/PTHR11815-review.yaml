residue_sites:
- site_id: nucleotide_base_position_20
  label: Residue that reads the purine base (position 20 of the mature beta subunit)
  description: >-
    Gln20 of mature pig GTP-specific SUCLG2 (residue 58 of the UniProt sequence) contacts the guanine base.
    ADP-forming beta subunits have Pro here: E. coli SucC Pro20, human SUCLA2 Pro72, yeast LSC2 Pro50 (precursor
    numbering). The residue is a marker, not a complete determinant: E. coli and Thermus aquaticus enzymes
    have Pro at this position and still accept GTP, so the site is recorded as contributing, and absence of
    Gln must not be used to deny GDP use for a bacterial member.
  anchor:
    id: UniProtKB:P53590
    label: SUCLG2
    organism: Sus scrofa
  anchor_sequence_version: 2
  site_source: STRUCTURE
  residues:
  - position: 58
    expected: [Q]
    role: contacts the guanine base
  required_for:
  - term:
      id: GO:0004776
      label: succinate-CoA ligase (GDP-forming) activity
    strength: CONTRIBUTES
    rationale: >-
      The Gln side chain and backbone atoms provide guanine specificity in the pig enzyme. Enzymes with Pro at
      this position can still use GTP, so the residue contributes to, and does not decide, GDP use.
    supported_by:
    - reference_id: PMID:16481318
      supporting_text: interactions of the
        guanine base with a glutamine residue (Gln-20beta) and with backbone atoms
        provide the specificity
    - reference_id: PMID:22751660
      supporting_text: This leads to the preference for
        GDP/GTP, but does not hinder the binding of ADP/ATP
  positive_controls:
  - id: UniProtKB:P53590
    label: SUCLG2
    organism: Sus scrofa
    control_position: 58
    control_residue: Q
  - id: UniProtKB:Q96I99
    label: SUCLG2
    organism: Homo sapiens
    control_position: 57
    control_residue: Q
  negative_controls:
  - id: UniProtKB:P53312
    label: LSC2
    organism: Saccharomyces cerevisiae
    control_position: 50
    control_residue: P
  - id: UniProtKB:Q9P2R7
    label: SUCLA2
    organism: Homo sapiens
    control_position: 72
    control_residue: P
