residue_sites:
- site_id: nucleotide_base_position_20
  label: Residue that reads the purine base (position 20 of the mature beta subunit)
  description: >-
    Gln20 of mature pig GTP-specific SUCLG2 contacts the guanine base. It is residue 58 of the UniProt
    sequence P53590, where the UniProt feature table records a GTP binding site (BINDING 58). Pro is the
    commonest residue at this position in the family: E. coli SucC Pro20, human SUCLA2 Pro72 and yeast LSC2
    Pro50 (precursor numbering), 59 of the 63 leaves of the A daughter, 14 of the 26 bacterial leaves and 5
    of the 6 archaeal leaves of the PANTHER tree. Gln is found in 38 of the 42 leaves below PTN000929335, in
    four Paramecium tetraurelia leaves outside that node and in two bacterial SucC leaves (Deinococcus
    radiodurans, Neisseria meningitidis). The residue contributes to GTP affinity and does not decide
    nucleotide use. Gln is not required for GTP use: E. coli SCS has Pro20 and uses both nucleotides, and
    Thermus aquaticus SCS has Pro20 and prefers GTP. Gln is not sufficient for GDP specificity: Blastocystis
    SCS (B3FHP0, Gln34 of the precursor, position 20 of the mature subunit) is ATP-specific with no
    detectable activity with GTP, and in the Blastocystis structure Gln20 hydrogen-bonds the adenine base.
    The E. coli Pro20-to-Gln mutant has a lower apparent Km for GTP with the other parameters unchanged.
    Neither the absence nor the presence of Gln decides nucleotide use for an unassayed member, and presence
    of Gln must not be used to assert GDP use.
  anchor:
    id: UniProtKB:P53590
    label: SUCLG2
    organism: Sus scrofa
  anchor_sequence_version: 2
  site_source: UNIPROT_FEATURE
  residues:
  - position: 58
    expected: [Q]
    role: contacts the guanine base
  required_for:
  - term:
      id: GO:0004776
      label: succinate-CoA ligase (GDP-forming) activity
    strength: CONTRIBUTES
    rationale: >-
      The Gln side chain and backbone atoms provide guanine specificity in the pig enzyme. Enzymes with Pro at
      this position can still use GTP, and an enzyme with Gln at this position (Blastocystis) is ATP-specific,
      so the residue contributes to, and does not decide, GDP use.
    supported_by:
    - reference_id: PMID:16481318
      supporting_text: interactions of the
        guanine base with a glutamine residue (Gln-20beta) and with backbone atoms
        provide the specificity
    - reference_id: PMID:22751660
      supporting_text: A water molecule and Pro20β in T. aquaticus take the place of Gln20β
        in pig GTP-specific SCS, interacting well with the guanine base and other
        residues of the nucleotide-binding site. This leads to the preference for
        GDP/GTP, but does not hinder the binding of ADP/ATP
    - reference_id: PMID:18452512
      supporting_text: the appearance of Gln at position 20 in Blastocystis SCS coupled with its ATP specificity
        indicates that it is not this residue that dictates nucleotide specificity
    - reference_id: PMID:10353839
      supporting_text: had a Km(app) for GTP that was more than 5 times lower than that of wild-type SCS,
        whereas parameters for the other substrates remained unchanged
    - reference_id: PMID:31282474
      supporting_text: hydrogen-bonding interactions between the adenine base and Gln20β
