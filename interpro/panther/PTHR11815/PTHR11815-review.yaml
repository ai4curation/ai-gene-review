  assessment_reason: >-
    The placement is right: PTN000212530 is the duplication node at the base of the eukaryotic beta
    subunits, so both daughter clades inherit the location, and the seeds come from both. The reviewed
    mitochondrial recipients retain the IBA: LSC2 (yeast), SPCC1620.08 (S. pombe), human SUCLA2, human
    SUCLG2 and Dictyostelium scsB and scsC. For the two Dictyostelium subunits the location is also measured
    on the proteins: both are enriched in Percoll-purified mitochondria of growing cells (PMID:35602934),
    with the caveat that both were among the reference proteins used to scale the enrichment. One
    branch of the tree needs pruning: the Trichomonas vaginalis beta subunits (PTN008982090; A2FVK7,
    A2D987, A2EBX0) descend from this node. A2EBX0 differs at one of 407 residues from the reviewed
    UniProt entry Q03184, the characterised T. vaginalis beta subunit, which is a soluble protein of the
    hydrogenosome, and GO does not class the hydrogenosome (GO:0042566) under mitochondrion. The Q03184
    gene review removes the term; Q03184 itself is not a leaf and carries the term as a TreeGrafter IEA
    grafted to the A2EBX0 leaf, and UniProt also names the three T. vaginalis leaf entries mitochondrial
    from a HAMAP rule, which a PAINT loss would not correct. The alpha
    family (PTHR11117) needs the same pruning at its Trichomonas clade PTN008961326. PAINT already stops
    the term at a Xanthomonas leaf (PTN001721370). A second hydrogenosomal member, Neocallimastix frontalis
    SCSB (P53587; located in the hydrogenosome by experiment), is not a leaf of the tree. It receives
    mitochondrion and tricarboxylic acid cycle as TreeGrafter IEAs from the fungal node PTN000929379, which
    a PAINT loss annotation cannot stop. The Ustilago maydis leaf PTN002273929 (A0A0D1E3R8), which lacks the
    ATP-grasp domain, also inherits this term; whether it is a subunit of any succinyl-CoA synthetase is
    unknown and it was not adjudicated.
    Blastocystis is treated differently from Trichomonas, and the two Blastocystis gene reviews agree.
    The beta subunit B3FHP0 is not a leaf; its TreeGrafter rows name this node in their source column, which
    the SCSb review reads as the graft point. Both reviews mark the mitochondrion row over-annotated, on the
    usage comment of GO:0005739 and the review it cites (PMID:24316280), accept the hydrogenosome rows and
    use hydrogenosome as the core location. The row is not removed, because the Blastocystis organelle has
    cristae, a membrane potential, a genome and complexes I and II and hydrogen production has not been
    shown. No PAINT action follows, since neither protein is a leaf. The Actinomortierella ambigua subunit A0A9P6TY68, also not a leaf, accepts
    the term by descent.
