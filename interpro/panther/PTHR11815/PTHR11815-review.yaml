  - id: PANTHER:PTN000212531
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    The clade below the node is the animal, choanoflagellate and Dictyostelium G-type lineage. Its sampled
    members have Gln at position 20, the residue that contacts the guanine base in pig GTP-specific SCS, where
    A-type, plant and bacterial sequences have Pro; and the pigeon G-type enzyme is highly specific for
    GTP/GDP. The loss is placed at the right depth: plant and excavate beta subunits are outside the node and
    keep ADP-forming activity. Two leaves below the node are doubtful and do not affect the verdict: the
    Xanthomonas campestris leaf and a divergent Ustilago maydis protein with Ala at position 20, whose
    position is unstable between tree methods. Human
    SUCLG2 sits below this node and its review accepts the resulting NOT annotation, noting that no assay of
    the human enzyme with ADP was read and that the negative rests on descent, the key residue and the
    pigeon and pig enzymes. The yeast, S. pombe and human SUCLA2 genes are in the other daughter clade.
