family_id: PANTHER:PTHR11815
family_name: SUCCINYL-COA SYNTHETASE BETA CHAIN
preferred_name: Succinyl-CoA synthetase beta subunit (SucC/LSC2) family
summary: >-
  The beta subunit of succinyl-CoA synthetase binds the nucleotide and so sets ADP or GDP specificity.
  The family contains bacterial SucC, S. cerevisiae LSC2, S. pombe SPCC1620.08, and animal SUCLA2
  (ADP-forming) and SUCLG2 (GDP-forming).
functional_coherence: COHERENT
coherence_reason: >-
  All members are succinyl-CoA synthetase beta subunits. Nucleotide specificity differs; PANTHER
  names SF10 GDP-forming but it contains the ADP-forming bacterial SucC.
