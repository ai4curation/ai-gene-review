family_id: PANTHER:PTHR11815
family_name: SUCCINYL-COA SYNTHETASE BETA CHAIN
preferred_name: Succinyl-CoA synthetase beta subunit (SucC/LSC2/SUCLA2/SUCLG2) family
summary: >-
  The beta subunit of succinyl-CoA synthetase carries the ATP-grasp nucleotide site and the succinate site, and
  sets ADP or GDP specificity. PANTHER roots the family at LUCA (PTN000212531). Bacteria and archaea have one
  beta subunit (SucC). The eukaryotic beta subunit duplicated once, at the root of eukaryotes (PTN000212530).
  One daughter clade (PTN008330414, the A-type lineage) contains animal SUCLA2, the fungal beta subunits
  (S. cerevisiae LSC2, S. pombe SPCC1620.08) and one Dictyostelium gene. The other (PTN002483419) contains
  animal and Dictyostelium SUCLG2 and, in the PANTHER tree, the beta subunits of plants, stramenopiles and
  excavates. GDP specificity is a derived state inside the second clade, in the animal, choanoflagellate and
  Dictyostelium branch (PTN000929335), marked by Gln at position 20 of the mature subunit; plant, stramenopile
  and excavate subunits keep the ancestral residue and are ADP-forming. Animals, choanoflagellates and
  Dictyostelium kept both copies and fungi kept only the A-type copy. Two points are robust across the
  PANTHER tree and independent distance and maximum-likelihood trees: the fungal subunits group with animal
  SUCLA2, and the Gln-carrying subunits of animals, a choanoflagellate and Dictyostelium form one clade.
  Which copy the plant, stramenopile and excavate subunits descend from is not resolved. The InterPro member list also
  places ATP-citrate synthase subunits, malate-CoA ligase beta and sulfoacetate-CoA ligase beta in the family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Changed from COHERENT. The members of the PAINT tree are succinyl-CoA synthetase beta subunits that differ
  in nucleotide specificity. The exceptions are ATP-grasp subunits of related CoA ligases and lyases that
  InterPro assigns to SF10: plant and S. pombe ATP-citrate synthase subunits, malate-CoA ligase beta (MtkA)
  and sulfoacetate-CoA ligase beta (SauC, SqwK). PANTHER names SF10 GDP-forming although it is the root
  subfamily and holds the ADP-forming bacterial SucC.
