notes: >-
  Re-reviewed on 2026-11-11 from an evolutionary perspective, together with PTHR11117. The PANTHER tree
  (release 19) was read node by node (node ids not in the PAINT slice, such as PTN008330414, PTN002483419 and
  PTN008982090, are emitted by the analysis script under panther_tree_nodes in results.yaml) and the A-type/G-type split was checked with an independent bootstrapped
  tree (genes/yeast/LSC2/LSC2-bioinformatics). The dating of the beta duplication differs from PMID:9765291,
  which placed it early in multicellular eukaryotes; Dictyostelium and a choanoflagellate each have both
  copies. Two OpenScientist runs (genes/yeast/LSC1/LSC1-hypotheses, genes/yeast/LSC2/LSC2-hypotheses) reached
  the same annotation verdicts and followed PMID:9765291 on the dating; a maximum-likelihood tree with the
  Dictyostelium and choanoflagellate paralogs supports the earlier date. Human SUCLG2 (Q96I99) and E. coli SucC (P0A836), both PAINT seeds, were reviewed afterwards and
  their actions agree with the node verdicts. The SUCLG2 review also corrects an InterPro2GO ATP binding
  annotation (from the ATP-grasp subdomain signature IPR013815) to GTP binding; that mapping is wrong for
  every member of the GTP-specific clade below PTN000929335. Not yet reviewed: the S. pombe ATP-citrate
  synthase subunit O13907, to check that it does not inherit succinyl-CoA synthetase terms.
