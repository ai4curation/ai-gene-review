family_id: PANTHER:PTHR11815
family_name: SUCCINYL-COA SYNTHETASE BETA CHAIN
preferred_name: Succinyl-CoA synthetase beta subunit (SucC/LSC2/SUCLA2/SUCLG2) family
summary: >-
  The beta subunit of succinyl-CoA synthetase carries the ATP-grasp nucleotide site and the succinate site, and
  sets ADP or GDP specificity. The PANTHER tree is rooted at a LUCA node (PTN000212531). Most bacteria and
  archaea in the tree have one beta subunit (SucC). PANTHER places a duplication node (PTN000212530) at the
  base of the eukaryotic clade. One daughter clade (PTN008330414, the A daughter) contains animal SUCLA2,
  the fungal beta subunits of the tree (S. cerevisiae LSC2, S. pombe SPCC1620.08) and one Dictyostelium
  gene. The other (PTN002483419, the G daughter) contains animal and Dictyostelium SUCLG2 and, in the
  PANTHER tree, the beta subunits of plants, stramenopiles, trypanosomatids and Trichomonas. Independent
  neighbor-joining and maximum-likelihood trees agree with PANTHER on two points: the fungal subunits group
  with animal SUCLA2, and the SUCLG2-type subunits of animals and a choanoflagellate form one clade, which
  the SUCLG2-type genes of early-diverging fungi join. The same trees place plant and trypanosomatid
  subunits with SUCLA2 and not in the G daughter, without strong support, and the Phytophthora and
  Thalassiosira subunits with SUCLA2 with strong maximum-likelihood support (ultrafast bootstrap 98) but
  weak neighbor-joining support, so the copy from which those subunits descend is not resolved. The trees support only that the duplication predates the
  divergence of animals, fungi and Dictyostelium; Paramecium has genes in both PANTHER daughter clades,
  which suggests that the duplication is older.
  The experimentally characterised GTP-specific enzymes (pig and human SUCLG2) lie below PTN000929335, the
  node that holds the animal, choanoflagellate and Dictyostelium SUCLG2-type subunits. Its members have Gln
  at position 20 of the mature subunit (38 of 42 leaves), the residue that contacts guanine in the pig
  enzyme. The residue is not diagnostic of nucleotide specificity: four Paramecium leaves outside that node
  and two bacterial SucC leaves also have Gln20, the ATP-specific Blastocystis enzyme has Gln20, and the
  GTP-preferring Thermus aquaticus enzyme has Pro20. Whether Gln20 arose on the stem of the G-type lineage
  or within it is not resolved.
  Outside PTN000929335 the lineages differ. Plant subunits have Pro20, and the one plant assay of nucleotide
  requirement found (a 1969 tobacco preparation) reports specificity for ATP. The sampled Phytophthora and Thalassiosira subunits have Pro20 and are
  unassayed. Blastocystis has Gln20 and is ATP-specific by assay. Trypanosomatid subunits have Glu20, and
  Trypanosoma brucei mitochondria make ATP through the enzyme; GDP has not been tested. Trichomonas
  vaginalis subunits have Gly20, and its hydrogenosomes have both ADP-dependent and GDP-dependent activity.
  Animals, choanoflagellates, Dictyostelium and Paramecium have a gene in each PANTHER daughter clade. The
  15 fungal genomes in the PANTHER tree have only an A-type gene; Mortierellomycota, Basidiobolus and
  Rozella, which are not in the tree, keep a SUCLG2-type gene, so the G-type gene was lost within fungi and
  not by all fungi. Within Dikarya one Taphrinomycotina species, Saitoella complicata, also has a Gln20
  SUCLG2-type entry (A0A0E9NQG5); it groups with the Mortierellomycota genes only weakly, so vertical
  retention, transfer and contamination are not distinguished and its origin is unresolved.
  The PAINT tree also contains an Aquifex aeolicus ortholog of the large subunit of citryl-CoA synthetase
  and a Ustilago maydis protein that lacks the ATP-grasp domain. The InterPro member list also places
  ATP-citrate synthase subunits, malate-CoA ligase beta and sulfoacetate-CoA ligase beta in the family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The leaves of the PAINT tree are succinyl-CoA synthetase beta subunits that differ in nucleotide
  specificity, with two exceptions: the Aquifex aeolicus leaf O67330 (PTN000212656), an ortholog of the
  citryl-CoA synthetase large subunit, and the Ustilago maydis protein A0A0D1E3R8 (PTN002273929), which
  lacks the N-terminal ATP-grasp domain. Malate-CoA ligase beta (MtkA: P53594, Q98KT9) and sulfoacetate-CoA
  ligase beta (SauC E5Y8P8, SqwK) are in the InterPro member list of SF10 and are not leaves, but they
  receive GO:0004775, GO:0042709 and GO:0006104 as TreeGrafter IEAs. Plant and S. pombe ATP-citrate
  synthase subunits (Arabidopsis ACLA, S. pombe O13907) are also in the InterPro member list of SF10; they
  are not leaves and carry no succinyl-CoA synthetase GO term. PANTHER names SF10 GDP-forming although it
  is the root subfamily and holds the ADP-forming bacterial SucC.
