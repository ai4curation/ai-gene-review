  name:
    name: Rho-type GTPase-activating protein
    short: Rho-type_GAP
  description:
  - text: This family of proteins includes GTPase-activating proteins (GAPs) primarily
      for the p21-rac subfamily of Rho GTPases. Members of this family are involved
      in the negative regulation of Rac by accelerating the hydrolysis of GTP to GDP,
      thereby inactivating the GTPase. This action is crucial for controlling various
      cellular processes such as cytoskeletal dynamics, cell migration, and axon guidance.
      Some members also function as phorbol ester receptors, linking extracellular
      signals to intracellular responses. The regulation of their activity is often
      mediated by phospholipid binding, which induces conformational changes that
      relieve steric inhibition of the active site, allowing for Rac binding and subsequent
      GAP activity. In neuronal systems, certain family members interact with EPHA4,
      playing a role in the assembly of locomotor circuits. Dysregulation of these
      proteins may contribute to the progression of certain tumors.
