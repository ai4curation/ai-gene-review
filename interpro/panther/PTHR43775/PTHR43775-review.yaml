family_id: PANTHER:PTHR43775
family_name: FATTY ACID SYNTHASE
preferred_name: Type I fatty acid synthase / polyketide synthase family
summary: >-
  Multidomain type I synthases. Animal fatty acid synthase (FASN, SF7) makes palmitate. Most Swiss-Prot
  members are fungal and bacterial iterative or modular polyketide synthases: non-reducing PKS such
  as A. nidulans wA, highly reducing PKS, hybrid PKS-NRPS, and modular erythronolide synthase (EryA).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Products differ by subfamily: fatty acids (SF7) or various polyketides (most other subfamilies).
