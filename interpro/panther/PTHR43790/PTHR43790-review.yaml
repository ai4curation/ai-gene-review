family_id: PANTHER:PTHR43790
family_name: CARBOHYDRATE TRANSPORT ATP-BINDING PROTEIN MG119-RELATED
preferred_name: Carbohydrate ABC importer ATPases with tandem nucleotide-binding domains
summary: 'ATP-binding subunits of CUT2-type carbohydrate ABC importers, each with two fused nucleotide-binding
  domains. Subfamilies follow substrate: ribose and allose (RbsA, AlsA; SF3), galactose/methyl-galactoside
  (MglA; SF7), L-arabinose (AraG; SF6), xylose (XylG; SF1), autoinducer-2 (LsrA; SF2), galactofuranose
  (YtfR; SF9) and nucleosides (NupO; SF4). All couple ATP hydrolysis to import through a cognate permease,
  so ATPase activity and membrane association are family-wide while the transported substrate is subfamily-
  or operon-specific.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: The energy-coupling mechanism is shared across the family, but substrate specificity,
  which defines the GO transporter-activity term, diverges between subfamilies and even within SF3 (RbsA
  versus AlsA).
