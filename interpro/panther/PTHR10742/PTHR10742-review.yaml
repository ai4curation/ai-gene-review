family_id: PANTHER:PTHR10742
family_name: FLAVIN MONOAMINE OXIDASE
preferred_name: >-
  Flavin amine oxidase family (polyamine oxidases, LSD histone demethylases, L-amino-acid oxidases)
summary: >-
  FAD-dependent amine oxidases of the monoamine oxidase/LSD fold. The family is very diverse: polyamine
  oxidases (S. cerevisiae FMS1, human PAOX and SMOX), lysine-specific histone demethylases (KDM1A,
  KDM1B, Arabidopsis FLD/LDL), L-amino-acid oxidases (snake venom LAAO, IL4I1), and bacterial flavin
  monooxygenases that oxidatively decarboxylate amino acids (P. putida DavB lysine 2-monooxygenase,
  IaaM tryptophan 2-monooxygenase).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Each subfamily has its own substrate and reaction: polyamine back-conversion (PAOX, SF405; FMS1),
  spermine oxidation (SMOX, SF416), histone H3K4 demethylation (SF386, SF260), L-amino-acid oxidation
  (SF21, SF355), and amino-acid 2-monooxygenation (DavB, IaaM). In PANTHER 19, FMS1, DavB and IaaM
  are all placed in SF410, so even that subfamily is not uniform.
