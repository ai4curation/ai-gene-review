family_id: PANTHER:PTHR12196
family_name: DOMAIN OF UNKNOWN FUNCTION 71  DUF71 -CONTAINING PROTEIN
preferred_name: Dph6 (ATPBD4/YLR143W) diphthine-ammonia ligase and DUF71 PP-loop ATPase family
summary: >-
  The family is defined by the DUF71 adenine nucleotide alpha hydrolase-like (PP-loop ATP
  pyrophosphatase) domain. Its characterized members are Dph6, the diphthine-ammonia ligase
  (diphthamide synthetase, EC 6.3.1.14) that completes diphthamide on translation elongation
  factor 2. Using ATP and free ammonium (not glutamine), it amidates the carboxylate of
  diphthine, releasing AMP and diphosphate. Yeast YLR143W/Dph6 was identified by chemogenomic
  cofitness and reconstituted in vitro, and the human ortholog ATPBD4/DPH6 fully complements
  the yeast deletion. Yeast Dph6 carries a long C-terminal extension that the human protein
  lacks. Dph6 homologs occur in eukaryotes and archaea, the two domains whose EF2 carries
  diphthamide. The PANTHER family also contains many bacterial DUF71 proteins, annotated only
  as PP-loop or ATP-binding proteins. Bacteria make no diphthamide, so these have an unknown
  function.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The eukaryotic and archaeal members form the Dph6 diphthine-ammonia ligase group, which
  PAINT covers with node PTN000257633. Its inheritors are all eukaryotic or archaeal (93 taxa).
  The family also includes about 1,700 bacterial DUF71 proteins. PANTHER puts these in the same
  single subfamily (SF2, DIPHTHINE--AMMONIA LIGASE) as Dph6, but they fall outside the PAINT
  node. Bacteria have no diphthamide and so no diphthine substrate. Whatever they do with the
  shared PP-loop ATPase domain is uncharacterized. The subfamily label therefore does not
  separate the ligase from the bacterial proteins of unknown function; the PAINT node does.
