    id: GO:0017178
    label: diphthine-ammonia ligase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    This is the term the diphthamide module asserts for the Dph6 role. It is safe for the
    eukaryotic and archaeal Dph6 group under PTN000257633. SF2 is listed only because it is
    PANTHER's single subfamily. Its bacterial DUF71 members, which sit outside PTN000257633,
    must not inherit the term, because bacteria have no diphthamide pathway. Apply by the PAINT
    node, not by the subfamily label.
