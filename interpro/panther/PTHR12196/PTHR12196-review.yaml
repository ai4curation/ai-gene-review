notes: >-
  Module: modules/diphthamide_biosynthesis.yaml uses PANTHER:PTHR12196 (family level) for the
  Dph6 annoton with GO:0017178. That is correct for its yeast and human representatives, but a
  family-level selector also captures the bacterial DUF71 proteins. The family name (DUF71)
  carries no function, which is consistent with this. The kingdom composition (eukaryotes
  4618, archaea 644, bacteria 1701, all SF2 in every sampled InterPro per-protein match) was
  read from the InterPro API. Inheritance of PTN000257633 was checked in the PAINT UniProt GAF
  and taxa were mapped to superkingdom with UniProt taxonomy. .cache/panther/IBD.gaf has no
  IRD/IKR rows for this node. The SGGKDS PP-loop-like motif is described as strictly conserved
  among YLR143W orthologs (PMID:23169644). No residue_site was curated, because no inactive
  member is known to act as a negative control.
