node_assessments:
- node_id: PANTHER:PTN000257633
  asserted_term:
    id: GO:0017178
    label: diphthine-ammonia ligase activity
  paint_snapshot: '20170420'
  seeds:
  - id: SGD:S000004133
    label: DPH6
    organism: Saccharomyces cerevisiae
  - id: UniProtKB:Q7L8W6
    label: DPH6
    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    PAINT records no taxon for this node. Its inheritors in the PAINT UniProt GAF are 88
    eukaryotic and 5 archaeal taxa, with no bacteria, so the bacterial DUF71 proteins of the
    family do not receive the term. Yeast Dph6 has the activity in vitro, and human DPH6
    complements the yeast deletion. The seeds therefore cover fungi and animals. Extending the
    term to archaeal homologs is plausible, because archaeal EF2 carries diphthamide and archaea
    need an amidation step. It has not been shown: Pyrococcus horikoshii PH1257 did not rescue
    the yeast deletion, which the authors attributed to failure to recognize yeast EF2. The
    archaeal extension is accepted as phylogenetically reasonable, not verified.
  supported_by:
  - reference_id: PMID:23169644
    supporting_text: We found that yeast protein YLR143W is the diphthamide synthetase catalyzing the
      last amidation step using ammonium and ATP.
  - reference_id: PMID:23169644
    supporting_text: P. horikoshii ATPBD4 (PH1257) also failed to restore the diphthamide biosynthesis
      in Δylr143w . We think this is likely because of its inability to recognize yeast eEF-2.
