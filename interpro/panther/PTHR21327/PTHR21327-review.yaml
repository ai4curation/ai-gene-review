  diverged_from_family: false
- subfamily_id: PANTHER:PTHR21327:SF34
  label: 3,4-DIHYDROXY-2-BUTANONE 4-PHOSPHATE SYNTHASE
  description: 'RibBX-type proteins of Pseudomonas, Neisseria and Photobacterium: an N-terminal DHBP synthase
    domain fused to a C-terminal GTP cyclohydrolase II-like domain. In P. putida KT2440 ribAB-I (PP_0516)
    and ribAB-II (PP_3813) the C-terminal domain lacks the three zinc-binding cysteines and the catalytic
    arginine of RibA, and RibBX proteins tested experimentally lack GTP cyclohydrolase II activity. Members
    are DHBP synthases; GTP cyclohydrolase II activity should not be inherited by this subfamily.'
