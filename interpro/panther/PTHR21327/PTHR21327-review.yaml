family_id: PANTHER:PTHR21327
family_name: GTP CYCLOHYDROLASE II-RELATED
preferred_name: GTP cyclohydrolase II / DHBP synthase (RibA/RibB) family
summary: The two enzymes that start riboflavin synthesis. GTP cyclohydrolase II (RibA; S. cerevisiae RIB1,
  S. pombe rib1) opens the imidazole ring of GTP and releases formate and pyrophosphate. 3,4-Dihydroxy-2-butanone
  4-phosphate synthase (RibB; S. cerevisiae RIB3, S. pombe SPBC23E6.06c) makes the four-carbon unit from
  ribulose 5-phosphate. Many bacteria and plants fuse the two as bifunctional RibBA. Many Proteobacteria
  also carry RibBX, a DHBP synthase fused to a GTP cyclohydrolase II-like domain that has lost its catalytic
  residues (SF34).
functional_coherence: HETEROGENEOUS
coherence_reason: 'GTP cyclohydrolase II and DHBP synthase are distinct activities carried by distinct
  domains, and subfamilies do not separate them cleanly. SF29 holds fungal and plant monofunctional GTP
  cyclohydrolase II (RIB1, rib1). SF18 is mixed: it holds bacterial monofunctional GTP cyclohydrolase
  II (E. coli and P. putida RibA), fungal monofunctional DHBP synthases (RIB3, SPBC23E6.06c) and bifunctional
  RibBA proteins. SF38 and SF46 are monofunctional bacterial and archaeal DHBP synthases. SF34 holds RibBX
  proteins whose GTP cyclohydrolase II-like domain lacks the catalytic zinc cysteines. Plant SF48/SF39
  are bifunctional.'
