family_id: PANTHER:PTHR21327
family_name: GTP CYCLOHYDROLASE II-RELATED
preferred_name: GTP cyclohydrolase II / DHBP synthase (RibA/RibB) family
summary: >-
  The two enzymes that start riboflavin synthesis. GTP cyclohydrolase II (RibA; S. cerevisiae RIB1,
  S. pombe rib1) opens the imidazole ring of GTP and releases formate and pyrophosphate. 3,4-Dihydroxy-2-butanone
  4-phosphate synthase (RibB; S. cerevisiae RIB3, S. pombe SPBC23E6.06c) makes the four-carbon unit
  from ribulose 5-phosphate. Many bacteria and plants fuse the two as bifunctional RibBA.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  GTP cyclohydrolase II (SF29) and DHBP synthase (SF38, SF34, SF46) are distinct activities. SF18
  holds both monofunctional DHBP synthases (RIB3) and bifunctional RibBA proteins, and plant SF48/SF39
  are bifunctional.
