residue_sites:
- site_id: gtpchii_catalytic_core
  label: GTP cyclohydrolase II zinc triad and catalytic residues
  description: 'The catalytic zinc ligands (Cys54, Cys65, Cys67) and the proton acceptor and nucleophile
    (Asp126, Arg128) of the GTP cyclohydrolase II domain, as annotated by HAMAP rule MF_00179 on P. putida
    KT2440 RibA (identical positions on E. coli RibA). The RibBX-type proteins of SF34 keep a recognisable
    GTP cyclohydrolase II-like fold but substitute every one of these positions (P. putida ribAB-I: Asp263,
    Pro274, Arg276, Ser332, Arg128 unaligned; ribAB-II: Asp257, Ala268, Pro270, Gln332, Arg128 unaligned),
    which is why the activity cannot be read from subfamily or fold alone.'
  anchor:
    id: UniProtKB:Q88QH1
    label: RibA
    organism: Pseudomonas putida KT2440
  anchor_sequence_version: 1
  site_source: UNIPROT_FEATURE
  residues:
  - position: 54
    expected:
    - C
    role: Zn(2+) binding
  - position: 65
    expected:
    - C
    role: Zn(2+) binding
  - position: 67
    expected:
    - C
    role: Zn(2+) binding
  - position: 126
    expected:
    - D
    role: proton acceptor
  - position: 128
    expected:
    - R
    role: nucleophile
  required_for:
  - term:
      id: GO:0003935
      label: GTP cyclohydrolase II activity
    strength: REQUIRED
    rationale: The zinc activates the water that hydrolyses the imidazole ring of GTP, and the catalytic
      arginine and aspartate act at the active site; RibBX proteins that have lost these residues lack
      GTP cyclohydrolase II activity (PMID:24097946).
  positive_controls:
  - id: UniProtKB:Q88QH1
    label: RibA
    organism: Pseudomonas putida KT2440
    control_position: 54
    control_residue: C
  - id: UniProtKB:P0A7I7
    label: RibA
    organism: Escherichia coli K-12
    control_position: 54
    control_residue: C
  negative_controls:
  - id: UniProtKB:Q88QH7
    label: ribAB-I
    organism: Pseudomonas putida KT2440
    control_position: 274
    control_residue: P
  - id: UniProtKB:Q88GB1
    label: ribAB-II
    organism: Pseudomonas putida KT2440
    control_position: 268
    control_residue: A
term_assessments:
- assessed_term:
    id: GO:0003935
    label: GTP cyclohydrolase II activity
  scope: RESIDUE_DETERMINED
  scope_reason: Applicability is decided by the GTP cyclohydrolase II catalytic core, not by subfamily.
    SF29 members have it, but SF18 mixes active RibA and RibBA with 13 monofunctional DHBP synthases that
    lack the domain, and SF34 RibBX proteins carry a GTP cyclohydrolase II-like domain with every catalytic
    position substituted. Members with the zinc-ligand cysteines and the catalytic Asp/Arg at the gtpchii_catalytic_core
    positions (RIB1, rib1, E. coli and P. putida RibA) have the activity; members lacking them (ribAB-I,
    ribAB-II) or lacking the domain (RIB3, SPBC23E6.06c) do not.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21327/PTHR21327-paint.tsv
    supporting_text: "PTHR21327\tPTN000481639\tGO:0003935\tF\tIBD\tfalse"
  - reference_id: file:genes/PSEPK/ribAB-I/ribAB-I-bioinformatics/RESULTS.md
    supporting_text: Neither ribAB-I nor ribAB-II retains the zinc-binding cysteine triad or the catalytic
      residues of GTP cyclohydrolase II
  - reference_id: PMID:24097946
    supporting_text: We examined the functionality of representative ribBX genes from Beta-, Gamma-, and
      Epsilonproteobacteria and found that, consistent with sequence-based predictions, the encoded GTP
      cyclohydrolase II domains lack catalytic activity.
  determined_by_site: gtpchii_catalytic_core
- assessed_term:
    id: GO:0008686
    label: 3,4-dihydroxy-2-butanone-4-phosphate synthase activity
  scope: UNRESOLVED
  scope_reason: DHBP synthase activity is carried by the DHBP synthase domain. SF38, SF34, SF46, SF48
    and SF39 members have it, but SF18 mixes DHBP synthases and RibBA with 132 monofunctional GTP cyclohydrolase
    II proteins that lack the domain (the PAINT NOT annotation at PTN000481639). Resolving the scope would
    need a per-member domain survey of SF18, which was not done; riboflavin_biosynthesis grounds the activity
    on gene-reviewed representatives (RIB3, SPBC23E6.06c, P. putida RibB, ribAB-I, ribAB-II).
  supported_by:
  - reference_id: file:interpro/panther/PTHR21327/PTHR21327-paint.tsv
    supporting_text: "PTHR21327\tPTN000481609\tGO:0008686\tF\tIBD\tfalse"
