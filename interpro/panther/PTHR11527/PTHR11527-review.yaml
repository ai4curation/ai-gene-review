notes: 'PHATC/B7FXQ8: requested accession B7FXQ8; current record B7FXQ8; sequence length 163; source cohort
  ARGO50. Family boundaries were assessed using the fetched member set and the cited domain, literature
  and analytical evidence. Gene-review verdicts and ARBA assertions are not independent validation. PANTHER
  subfamily labels and membership are recorded from the frozen UniProt records and panther.obo; they do
  not by themselves prove functional uniformity within a subfamily. PAINT rows were inspected as ancestral
  assertions, but node placement is not adjudicated without the relevant descendant tree/alignment. No
  residue requirement is encoded without a verified sequence-version anchor. A target-level refutation
  is not a family-wide NOT_APPLICABLE judgment. Exact protein-name-only predictions are treated as family-identification
  hypotheses rather than invented GO predictions. The original B7FXQ8 ProtNLM output includes GO:0051082
  (unfolded protein binding), which current QuickGO marks obsolete. Its biological binding hypothesis
  remains supported at the general small-HSP level by PMID:29983375. This paper demonstrates oligomer-dependent
  binding to destabilized clients and describes aggregation suppression; it does not establish the diatom
  target''s delivery to an acceptor or location required by the current GO:0140309 unfolded protein holdase
  activity definition. GO:0044183 protein folding chaperone instead requires assistance in folding the
  client. A specific current molecular-function replacement remains unresolved, so neither activity is
  granted merely from the old binding prediction. The original prediction is preserved unchanged in its
  source review.'
