    label: protein complex oligomerization
  scope: UNRESOLVED
  scope_reason: The Hsp16.5 study directly demonstrates 24-, 48- and engineered intermediate oligomeric
    assemblies, establishing oligomerization in characterized small HSPs. Their variable oligomeric states
    and specialized alpha-crystallin relatives prevent a fixed assembly stoichiometry or unconditional
    grant to every detected fragment. The complete assembly-competent set is unresolved.
