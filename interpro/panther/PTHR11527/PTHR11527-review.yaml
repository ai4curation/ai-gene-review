- assessed_term:
    id: GO:0006457
    label: protein folding
  scope: UNRESOLVED
  scope_reason: Binding unfolded clients and preventing aggregation can assist productive folding through
    a chaperone network, but neither proves autonomous refolding or an exact folding pathway for the diatom
    target. The cited work measures client binding and oligomer plasticity. It supports a holdase-related
    hypothesis while leaving the broad protein-folding process and its complete branch distribution unresolved.
