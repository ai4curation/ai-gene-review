    label: response to heat
  scope: UNRESOLVED
  scope_reason: Heat response is common in small-HSP biology but must be established physiologically,
    especially for constitutive alpha-crystallins and lineage-specific proteins. The cited structural
    study does not test heat-induced expression or thermotolerance of the diatom protein. The family fold
    alone does not identify the heat-responsive branches.
