family_id: PANTHER:PTHR11527
family_name: HEAT-SHOCK PROTEIN 20 FAMILY MEMBER
preferred_name: Small heat-shock and alpha-crystallin proteins
summary: Small heat-shock proteins and alpha-crystallins form oligomeric assemblies that interact with
  non-native proteins. Client recognition, oligomer structure, expression response and cellular localization
  vary among organisms and paralogs.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The diatom target has the small-HSP domain, and biochemical small-HSP studies establish
  unfolded-client binding and oligomerization. Heat, salt and hydrogen-peroxide responses require the
  relevant organism and conditions. Holdase-mediated protection is not proof that the target independently
  refolds denatured clients.
