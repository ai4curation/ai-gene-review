- subfamily_id: PANTHER:PTHR24220:SF689
  label: LIPOPROTEIN-RELEASING SYSTEM ATP-BINDING PROTEIN LOLD
  description: >-
    LolD nucleotide-binding subunits, including the experimentally characterized E. coli LolCDE ATPase.
    The SF689 inventory also includes Caulobacter and Myxococcus members; classification does not prescribe
    a heteromeric LolCE versus homomeric LolF membrane partner.
  representative_members:
  - id: UniProtKB:P75957
    gene_symbol: lolD
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/lolD/lolD-ai-review.yaml
  - id: UniProtKB:Q88KY4
    gene_symbol: lolD
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/lolD/lolD-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Couples ATP hydrolysis to lipoprotein extraction and transfer to LolA in characterized Lol systems.
    SF689 is the supported subfamily scope here, not proof that all other classifications lack this activity.
- subfamily_id: PANTHER:PTHR24220:SF470
  label: CELL DIVISION ATP-BINDING PROTEIN FTSE
  description: >-
    FtsE, the ATPase partner of FtsX in cell-wall hydrolase regulation. The membrane partner transmits
    the conformational signal to the extracytoplasmic hydrolase machinery rather than carrying a solute
    through the bilayer; the term periplasmic applies to diderm examples.
  representative_members:
  - id: UniProtKB:P0A9R7
    gene_symbol: ftsE
    organism: Escherichia coli K-12
  diverged_from_family: true
  divergence_description: Cell-division signalling ATPase; not involved in lipoprotein trafficking.
- subfamily_id: PANTHER:PTHR24220:SF86
  label: ABC TRANSPORTER ABCH.1
  description: >-
    Heterogeneous subfamily of uncharacterized and MacB-associated ATPases,
    including LolD-named homologs from non-proteobacterial or deltaproteobacterial
    lineages (Chlorobium, Bdellovibrio) whose lipoprotein-release activity has not
    been tested.
  diverged_from_family: false
