notes: >-
  Seed PANTHER placements (Rv2688c PTHR42711, YejF PTHR43776, NikD PTHR43297,
  YknY and PhnL PTHR42798) were checked against current UniProt PANTHER
  cross-references; they indicate that PTN000655654 sits above several
  current ABC ATPase families, so its transport terms reach PTHR24220 by deep
  descent rather than from PTHR24220 seeds. Only the LolD subfamily is
  reviewed in depth here; FtsE and HrtA are summarized for scope only.
