family_id: PANTHER:PTHR24220
family_name: IMPORT ATP-BINDING PROTEIN
preferred_name: ABC ATPase family including LolD, FtsE and HrtA
summary: >-
  PTHR24220 groups ABC nucleotide-binding proteins, including LolD (SF689), FtsE (SF470), HrtA (SF666),
  and uncharacterized or MacB-associated proteins. Current HMM classifications and the broader PAINT tree
  have different boundaries: the latter also contains characterized substrate-transporting ABC ATPases.
  In the Lol system, ATP hydrolysis drives extraction of mature lipoproteins from the periplasmic leaflet
  and transfer to LolA, without carrying the cargo across the lipid bilayer. FtsEX instead couples ATPase
  activity to cell-wall hydrolase regulation. These specialized activities do not negate transport functions
  of other ABC branches.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The ABC nucleotide-binding architecture is shared, but its coupled outputs differ, including lipoprotein
  release, cell-wall hydrolase regulation and substrate transport. Lol pathway activity is supported for
  the characterized LolD lineage; neither it nor transmembrane transport can be assigned from the broad
  family identifier alone. Current subfamily labels and PAINT ancestry are evaluated separately.
