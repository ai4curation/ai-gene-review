notes: >-
  The directly retrieved PAINT tree, not contemporary HMM labels, establishes the common root of the LolD/FtsE
  and substrate-transporting ABC branches. Current classification and historical ancestry are distinct
  evidence layers. The LolD and YejF subtrees are now resolved; the PhnL-linked node is unavailable. All
  original PAINT ids, seeds, dates and assertion terms are preserved. This audit retains non-Lol ABC knowledge
  and makes no unobserved evolutionary loss claim. SF689 is a supported positive LolD subset; verified
  Acinetobacter LolD Q9EYM2 lies in PTHR42798:SF2 and requires its own exact-member descriptor rather
  than repointing this family.
