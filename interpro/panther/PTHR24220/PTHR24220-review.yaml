term_assessments:
- assessed_term:
    id: GO:0016887
    label: ATP hydrolysis activity
  scope: FAMILY_WIDE
  scope_reason: >-
    ATP hydrolysis is the conserved biochemical role of the ABC nucleotide-binding proteins represented
    by this family and is directly measured for E. coli LolD. This family-level inference does not imply
    that every uncharacterized member has been individually assayed, or that its partner transports a
    substrate across a membrane.
  supported_by:
  - reference_id: PMID:17509078
    supporting_text: the ATPase activities of LolD and LolCDE were examined under various conditions
- assessed_term:
    id: GO:0140306
    label: lipoprotein releasing activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Established for E. coli LolD within the assembled LolCDE release machinery and supported for the LolD
    SF689 lineage. The subunit supplies ATPase-driven work; the full release reaction requires the membrane
    partners and carrier. Other classifications such as SF86 include untested LolD-named proteins, so
    this supported subset is not a universal negative outside SF689.
  applicable_subfamilies:
  - id: PANTHER:PTHR24220:SF689
  supported_by:
  - reference_id: PMID:10783239
    supporting_text: catalyses the release of lipoproteins in LolA- and sorting-signal-dependent
      manners
- assessed_term:
    id: GO:0044874
    label: lipoprotein localization to outer membrane
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The verified PTN000656700 clade and characterized LolD proteins support the SF689 positive scope.
    Other ABC outputs are not Lol pathway evidence, but untested LolD-like members outside this subset
    are not declared incapable of lipoprotein localization.
  applicable_subfamilies:
  - id: PANTHER:PTHR24220:SF689
  supported_by:
  - reference_id: file:interpro/panther/PTHR24220/PTHR24220-paint.tsv
    supporting_text: "PTHR24220\tPTN000656700\tGO:0044874\tP\tIBD\tfalse\tUniProtKB:P75957|UniProtKB:Q9HZL7\t\
      taxon:1224"
