family_id: PANTHER:PTHR10285
family_name: URIDINE KINASE
preferred_name: Uridine kinase-like P-loop kinase family (UCK, NRK, type I pantothenate kinase)
summary: >-
  P-loop kinases that phosphorylate ribose-containing metabolites or pantothenate. The family contains
  the uridine-cytidine kinases (S. cerevisiae URK1, S. pombe urk1, human UCK1/UCK2/UCKL1, bacterial
  Udk), the nicotinamide/nicotinate riboside kinases of NAD salvage (S. cerevisiae NRK1, S. pombe
  nrk1, human NMRK1/NMRK2), the bacterial type I pantothenate kinases (CoaA), and S. cerevisiae YFH7,
  a kinase of unknown substrate.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrate specificity is set by subfamily: uridine/cytidine for the UCK subfamilies (SF70, SF66,
  SF131, SF68), nicotinamide/nicotinate riboside for the NRK subfamilies (SF158, SF126, SF143), and
  pantothenate for type I PanK (SF139). PAINT handles the NRK split with an IRD (NOT uridine kinase
  activity) at PTN008496869.
