  description: >-
    MCC and PCC alpha subunits (MCCC1, MccA, LiuD, PCCA). The substrate of the holoenzyme is set by the
    partner beta subunit, so MCC activity is a member-level property within SF33: the leucine-pathway
    members are human MCCC1, P. aeruginosa LiuD (direct MCC enzymology) and P. putida MccA.
