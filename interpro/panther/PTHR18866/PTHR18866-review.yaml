family_id: PANTHER:PTHR18866
family_name: CARBOXYLASE:PYRUVATE/ACETYL-COA/PROPIONYL-COA CARBOXYLASE
preferred_name: Biotin-dependent carboxylase family (MCC/PCC alpha, urea amidolyase)
summary: >-
  Biotin-dependent carboxylases with biotin carboxylase and biotin carboxyl carrier domains. The
  family contains the alpha subunits of methylcrotonoyl-CoA carboxylase (human MCCC1, P. putida MccA)
  and propionyl-CoA carboxylase (human PCCA), and fungal urea amidolyase (S. cerevisiae DUR1,2),
  which fuses urea carboxylase to allophanate hydrolase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The carboxylated substrate is set by lineage and subunit partner: 3-methylcrotonoyl-CoA (MCC),
  propionyl-CoA (PCC) or urea (DUR1,2, SF128). PANTHER places MCCC1 and PCCA together in SF33.
