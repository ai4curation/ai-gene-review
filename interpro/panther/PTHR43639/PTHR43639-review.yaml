notes: >-
  Reviewed for modules/bacterial_sulfoquinovose_catabolism.yaml, which grounds the sulfo-ED SQ
  dehydrogenase annoton to SF1 with P0DOV5 as representative. Tree membership was checked against the
  PANTHER treeinfo tree (55 leaves); three PAINT nodes in the slice (PTN002449287, PTN002455807,
  PTN008679369) are absent from that tree. As a module grounding, PTN002462421 is a sound but
  uninformative family-root node: it supports only generic oxidoreductase activity (an ancestor of the
  module's GO:0016616) and is not evidence for sulfoquinovose dehydrogenase activity, which rests on
  the direct enzymology of P0DOV5.
