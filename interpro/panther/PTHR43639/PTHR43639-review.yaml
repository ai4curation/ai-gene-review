    sulfoquinovose 1-dehydrogenase together with glucose, xylose, fucose and galactose
    1-dehydrogenases and with members of other specificities (pteridine reductase PTR1, FabL,
    ChcA, fungal secondary-metabolism SDRs). Membership does not establish sulfoquinovose
    dehydrogenase activity; the sulfonate-binding arginine and genomic context with sulfo-ED genes
    are needed for that.
