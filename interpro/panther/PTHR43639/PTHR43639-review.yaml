family_id: PANTHER:PTHR43639
family_name: OXIDOREDUCTASE, SHORT-CHAIN DEHYDROGENASE/REDUCTASE FAMILY (AFU_ORTHOLOGUE AFUA_5G02870)
preferred_name: Classical SDR family including sugar 1-dehydrogenases, sulfoquinovose dehydrogenase and FolM
summary: >-
  Classical short-chain dehydrogenases/reductases (SDR) with the Rossmann NAD(P)-binding fold and the
  Asn-Ser-Tyr-Lys catalytic tetrad. The 65 SwissProt members in the local inventory fall into two
  subfamilies. SF1 (47 members) is functionally diverse: sugar 1-dehydrogenases (Priestia megaterium
  glucose 1-dehydrogenases, Caulobacter D-xylose 1-dehydrogenase XylB, Burkholderia L-fucose
  dehydrogenase, Rhizobium galactose dehydrogenase GalD), the sulfoglycolytic sulfoquinovose
  1-dehydrogenase of Pseudomonas putida SQ1, dihydrodiol and diol dehydrogenases, fungal
  hydroxynaphthalene reductases, diacetyl reductase, but also the pteridine reductase PTR1, the
  enoyl-ACP reductase FabL and 1-cyclohexenylcarbonyl-CoA reductase, which reduce C=N or C=C bonds
  rather than oxidizing alcohols. SF6 (18 members) is the enterobacterial dihydromonapterin reductase
  FolM. All members are NAD(P)-dependent oxidoreductases; the donor group and substrate are not
  predicted by membership.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The oxidoreductase chemistry (hydride transfer with NAD(P)) is shared by every member, but the
  donor group differs: most SF1 members act on CH-OH groups (sugar 1-dehydrogenases, SQ
  dehydrogenase, diol dehydrogenases, keto reductases), whereas PTR1 and FolM reduce pterins (CH-NH)
  and FabL and ChcA reduce C=C double bonds. Substrates range from aldoses and sulfosugars to
  polyketide intermediates, so no substrate-specific activity can be inherited across the family or
  across SF1.
