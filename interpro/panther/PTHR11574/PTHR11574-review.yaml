family_id: PANTHER:PTHR11574
family_name: KIT LIGAND
preferred_name: Kit ligand (stem cell factor / steel factor)
summary: >-
  Vertebrate (Euteleostomi) family of short-chain four-helix-bundle cytokines
  orthologous to mammalian KITLG (stem cell factor, SCF; steel factor; mast cell
  growth factor). Synthesized as single-pass type I transmembrane precursors that
  form non-covalent homodimers at the plasma membrane and undergo regulated
  proteolytic shedding to release soluble homodimeric cytokines. Both
  membrane-bound and soluble forms bind the extracellular immunoglobulin-like
  domains (D1-D3) of the receptor tyrosine kinase KIT, driving receptor
  homodimerization, trans-autophosphorylation, and downstream Kit signaling in
  hematopoietic stem and progenitor cells, mast cells, melanocyte precursors,
  primordial germ cells, and interstitial cells of Cajal. Teleosts retain two
  co-orthologs from the teleost whole-genome duplication (kitlga and kitlgb in
  Danio rerio) that partition the splice-isoform and developmental functions of
  tetrapod KITLG.
