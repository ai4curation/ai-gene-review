term_assessments:
  - assessed_term:
      id: GO:0005125
      label: cytokine activity
    scope: FAMILY_WIDE
    scope_reason: >-
      All members of PTHR11574 are four-helix-bundle cytokines (stem cell factor /
      Kit ligand) that act as extracellular receptor ligands to activate the KIT
      receptor tyrosine kinase.
    supported_by:
      - reference_id: PMID:17662946
        supporting_text: Stem Cell Factor (SCF) initiates its multiple cellular responses by binding to the ectodomain of KIT, resulting in tyrosine kinase activation.
      - reference_id: PMID:2208279
        supporting_text: SCF is able to augment the proliferation of both myeloid and lymphoid hematopoietic progenitors in bone marrow cultures.
  - assessed_term:
      id: GO:0038109
      label: Kit signaling pathway
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member is a Kit ligand that initiates the Kit signaling pathway by
      binding and dimerizing the KIT receptor ectodomain. PAINT currently lacks a
      node-level IBD for GO:0038109 on PTN002611905 despite experimental
      annotations on mouse Kitl.
    supported_by:
      - reference_id: PMID:17662946
        supporting_text: The structures show that KIT dimerization is driven by SCF binding whose sole role is to bring two KIT molecules together.
      - reference_id: PMID:17257055
        supporting_text: We conclude that following genome duplication, kita and kitla have maintained their receptor-ligand relationship, coevolved complementary expression patterns, and that functional analysis reveals that most or all of the kita receptor's function in the embryo are promoted by its interaction with kitla.
  - assessed_term:
      id: GO:0005173
      label: stem cell factor receptor binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Direct binding to the KIT receptor ectodomain is conserved across the
      family; under GO ligand conventions, the effector molecular function on the
      ligand is captured by GO:0005125 (cytokine activity) with KIT as the target.
    supported_by:
      - reference_id: PMID:17662946
        supporting_text: Stem Cell Factor (SCF) initiates its multiple cellular responses by binding to the ectodomain of KIT, resulting in tyrosine kinase activation.
  - assessed_term:
