notes: >-
  PTHR11574 is a compact, functionally homogeneous vertebrate cytokine family
  with a single subfamily (PTHR11574:SF0) and Euteleostomi root node
  PTN002611905. PAINT currently places IBDs for GO:0005886 (plasma membrane) and
  GO:0008284 (positive regulation of cell population proliferation) at
  PTN002611905, but does not yet place GO:0005125 (cytokine activity) or
  GO:0038109 (Kit signaling pathway) at that node.
