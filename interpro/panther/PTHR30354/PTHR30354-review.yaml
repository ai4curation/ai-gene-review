node_assessments:
- node_id: PANTHER:PTN000031793
  asserted_term:
    id: GO:0022857
    label: transmembrane transporter activity
  evidence: IBD
  negated: false
  paint_snapshot: '20260828'
  assessment: SOUND
  assessment_reason: >-
    A deep node, seeded mainly by eukaryotic SLC13-type transporters (the same
    node appears in the PTHR10283 PAINT slice), that asserts only generic
    transmembrane transporter activity. Every Gnt-family member is a
    multi-pass secondary transporter, so the claim is true for all
    descendants, including BhbP. The plasma-membrane (GO:0005886) and
    transmembrane-transport (GO:0055085) assertions on the same node are sound
    for the same reason.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30354/PTHR30354-paint.tsv
    supporting_text: "PTHR30354\tPTN000031793\tGO:0022857\tF\tIBD\tfalse"
  - reference_id: file:PSEPK/bhbP/bhbP-uniprot.txt
    supporting_text: "FT   TRANSMEM        29..52"
- node_id: PANTHER:PTN000769104
  asserted_term:
    id: GO:0005886
    label: plasma membrane
  evidence: IBD
  negated: false
  paint_snapshot: '20260828'
  assessment: SOUND
  assessment_reason: >-
    Seeded by the E. coli Gnt-family permeases including DsdX and YgbN. In
    Gram-negative bacteria these alpha-helical multi-pass transporters sit in
    the cytoplasmic (plasma) membrane. BhbP carries this location by
    TreeGrafter, and its own seven predicted transmembrane helices agree.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30354/PTHR30354-paint.tsv
    supporting_text: "PTHR30354\tPTN000769104\tGO:0005886\tC\tIBD\tfalse"
- node_id: PANTHER:PTN000769107
  asserted_term:
    id: GO:0015128
    label: gluconate transmembrane transporter activity
  evidence: IBD
  negated: false
  paint_snapshot: '20260828'
  assessment: UNRESOLVED
  assessment_reason: >-
    All four seeds (GntP, GntU, GntT, IdnT of E. coli) are genuine gluconate
    permeases, so the claim is correct for the gluconate clade. Whether the
    node also covers the substrate-divergent subfamilies (D-serine DsdX, the
    citrate transporters, SF7 BhbP) cannot be determined from the local PAINT
    slice, which lists node annotations but not tree membership. DsdX is a
    seed of the parent plasma-membrane node PTN000769104 but not of this
    node, and BhbP receives no gluconate row from TreeGrafter, both of which
    suggest the node is placed within the gluconate clade; if it is not, an
    IRD would be needed for those branches. The GO:0035429 gluconate
    transmembrane transport assertion on the same node has the same status.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30354/PTHR30354-paint.tsv
    supporting_text: "PTHR30354\tPTN000769107\tGO:0015128\tF\tIBD\tfalse"
  - reference_id: file:interpro/panther/PTHR30354/PTHR30354-entries.csv
