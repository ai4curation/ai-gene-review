notes: >-
  Written for the ketone_body_oxidation module, whose optional uptake step uses
  KT2440 BhbP (SF7). The module grounds that step on subfamily SF7, the clade
  to which GO:0008028 applies, rather than on the base family or the
  family-wide InterPro signature IPR003474, both of which also cover the
  D-serine (SF6) and metal-citrate (SF26) transporters. No SF7 member has a
  transport assay, so the SF7 substrate remains a prediction from the
  Pseudomonas transporter-bdhA operon.
  BhbP is the reference protein because it is the only member with a completed
  gene review in this repository; the E. coli gluconate permeases are the
  experimentally characterized members and would be better anchors once
  reviewed. The remaining PAINT rows (GO:0005886, GO:0055085 on PTN000031793;
  GO:0022857 and GO:0055085 on PTN000769104; GO:0015726 on PTN002018206) follow
  the assessments of their sibling rows on the same nodes.
