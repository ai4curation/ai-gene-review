family_id: PANTHER:PTHR30354
family_name: GNT FAMILY GLUCONATE TRANSPORTER
preferred_name: Gnt family of carboxylate:H+ symporters (GntP/GntT/GntU, IdnT, DsdX, CitM/CitN, BhbP)
summary: >-
  The Gnt (gluconate:H+ symporter, TC 2.A.8) family comprises bacterial
  inner-membrane secondary transporters with about twelve transmembrane
  helices that import organic acids coupled to the proton gradient. The
  best-characterized members are the Escherichia coli gluconate permeases GntP
  (high affinity), GntT and GntU, the Gnt-II L-idonate/gluconate permease IdnT,
  and the Bacillus subtilis gluconate permease GntP. The family is not
  substrate-uniform: it also contains the E. coli D-serine transporter DsdX and
  the B. subtilis metal-citrate transporters CitM and CitN. Subfamily SF7
  contains Pseudomonas putida BhbP (PP_3074), encoded with the
  D-3-hydroxybutyrate dehydrogenase hbdH; its P. aeruginosa ortholog PA2004 is
  co-transcribed with bdhA in an (R)-3-hydroxybutyrate-inducible operon that is
  required for growth on that substrate, making D-3-hydroxybutyrate the
  probable SF7 substrate.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Plasma-membrane location and proton-coupled transmembrane transport of an
  organic anion are shared by the whole family, but the substrate differs by
  subfamily: gluconate (SF20, SF8, SF22), L-idonate plus gluconate (SF9),
  D-serine (SF6), metal-citrate complexes (SF26) and, by operon context,
  D-3-hydroxybutyrate (SF7). The family name and the InterPro2GO mapping of
  IPR003474 to gluconate transport therefore over-specify the substrate for
  members outside the gluconate subfamilies.
