review_status: COMPLETE
reviewed_by: Claude (AI-assisted)
review_date: '2026-11-04'
notes: >-
  Written while promoting modules/bacterial_imuabc_damage_induced_mutagenesis.yaml
  to COMPLETE, which grounds its ImuA and ImuB steps here. Three points worth
  carrying forward. First, the family term is far too broad to be the module's
  descriptor, so the module grounds the ImuA role on InterPro families and the
  ImuB role on the Pfam IMS domain, and points here for the subfamily split.
  Second, the SulA-derived cell-division term that reaches ImuA proteins is not
  an absent-signature artifact: IPR004596 genuinely matches the ImuA clade,
  because ImuA and SulA are homologous, and it carries GO:0051782 and GO:0009432
  in InterPro2GO. The family entry IPR050356, which covers this whole PANTHER
  family, carries no GO mapping at all. The removal in the member review
  therefore rests on biology, not on the signature set.

  Third, the ImuA proteins are split across two InterPro families that do not
  correspond to one PANTHER subfamily: P. putida ImuA (Q88I84) carries IPR047610
  and sits in SF3, while Caulobacter ImuA (Q9A3J1) carries IPR017026 and has no
  PANTHER assignment at all, so SF3 cannot be used as the module's selector for
  the ImuA role. Fourth, the actinobacterial counterpart ImuA' (M. tuberculosis
  Rv3395c, P9WKZ9) has a distinct sequence/domain classification and is modeled
  as another family realization of the accessory step, not as a member of this
  family. No unified family assignment is established here; distinct sequence
  classifications do not exclude homology of RecA-like structural components. Node depth for
  PTN002176549 was read from the PANTHER 19 treeinfo service
  (pantherdb.org/services/oai/pantherdb/treeinfo?family=PTHR35369).
