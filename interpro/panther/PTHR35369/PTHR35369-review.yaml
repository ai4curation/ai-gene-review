family_id: PANTHER:PTHR35369
family_name: BLR3025 PROTEIN-RELATED
preferred_name: SulA cell-division inhibitors and the ImuA/ImuB accessory proteins of damage-induced mutagenesis
summary: >-
  A small bacterial family that PANTHER keeps together on sequence similarity but
  which contains two functionally unrelated kinds of SOS protein. SF4 holds the
  SulA cell-division inhibitors, which bind FtsZ and block Z-ring assembly after
  DNA damage. SF2 holds the ImuB proteins: UmuC/Y-family folds that have lost
  the catalytic carboxylates and act as the adaptor of the ImuA-ImuB-DnaE2
  damage-induced mutagenesis cassette, binding ImuA, the DnaE2 polymerase and the
  beta clamp. SF3 holds the proteobacterial ImuA accessory proteins of the same
  cassette, which share weak similarity with SulA and RecA. Nothing in the family
  is a DNA polymerase and nothing in it repairs DNA: SF4 delays division, SF2 and
  SF3 hand damaged templates to a polymerase encoded elsewhere.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Membership of the SOS response is all the subfamilies share. SF4 inhibits cell
  division through FtsZ binding; SF2 and SF3 are accessory components of
  translesion synthesis and have no effect on division. Neither molecular
  function nor biological process transfers across that boundary, and the family
  name, taken from an uncharacterized Bradyrhizobium protein, describes neither
  group.
reference_protein:
  id: UniProtKB:Q9A3J2
  label: Protein ImuB
  gene_symbol: imuB
  organism: Caulobacter vibrioides CB15
  gene_review: genes/CAUVC/imuB/imuB-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR35369:SF2
    label: BLR3025 PROTEIN
    description: >-
      ImuB proteins: catalytically dead UmuC/Y-family folds that act as the
      interaction hub of the ImuA-ImuB-DnaE2 cassette. The characterized
      mycobacterial member binds ImuA', DnaE1, DnaE2 and the beta clamp, and
      disrupting its clamp-binding motif abolishes cassette function as
      completely as deleting the gene. UniProt flags the loss of the residues
      required to propagate the UmuC feature annotation.
    representative_members:
      - id: UniProtKB:Q9A3J2
        label: Protein ImuB
        gene_symbol: imuB
        organism: Caulobacter vibrioides CB15
        gene_review: genes/CAUVC/imuB/imuB-ai-review.yaml
      - id: UniProtKB:B8H428
        label: Protein ImuB
        gene_symbol: imuB
        organism: Caulobacter vibrioides NA1000
    diverged_from_family: true
    divergence_description: >-
      Not cell-division inhibitors and not polymerases. These proteins keep the
      Y-family polymerase architecture without its chemistry and serve as
      adaptors in translesion synthesis, so both the SulA process terms of SF4
      and any polymerase activity implied by the UmuC fold are wrong for them.
    supported_by:
      - reference_id: file:interpro/panther/PTHR35369/PTHR35369-entries.csv
        supporting_text: Q9A3J2,Protein ImuB,protein
      - reference_id: PMID:20615954
        supporting_text: >-
          Despite retaining structural features characteristic of Y-family
          members, ImuB homologs lack conserved active-site amino acids required
          for polymerase activity.
      - reference_id: PMID:20615954
        supporting_text: >-
          Our evidence indicates a central role for ImuB in cassette function
          that is independent of polymerase activity.
  - subfamily_id: PANTHER:PTHR35369:SF3
    label: TRANSLESION DNA SYNTHESIS-ASSOCIATED PROTEIN IMUA
    description: >-
      Proteobacterial ImuA accessory proteins of the same cassette, encoded
      immediately upstream of imuB. No catalytic or DNA-binding activity has been
      demonstrated for any member; deletion of the Caulobacter ortholog abolishes
      mitomycin C-induced mutagenesis and sensitizes cells to the damage.
    representative_members:
      - id: UniProtKB:Q88I84
        label: Translesion DNA synthesis-associated protein ImuA
        gene_symbol: PP_3117
        organism: Pseudomonas putida KT2440
        gene_review: genes/PSEPK/PP_3117/PP_3117-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      Shares real homology with SulA but has no role in cell division. The
      similarity is the source of a long-standing misidentification: InterPro's
      ImuA entry records that this protein was previously misnamed SulA in
      Pseudomonas putida. The homology is strong enough that the SulA family
      signature IPR004596 still matches ImuA proteins, so its GO mapping
      (GO:0051782 and GO:0009432) reaches them; P. putida ImuA matches IPR004596
      alongside the four entries UniProt cross-references (IPR047610
      ImuA_translesion, IPR027417 P-loop_NTPase, IPR050356 SulA_CellDiv_inhibitor
      and IPR017166 UCP037290). IPR050356 does not carry the term independently:
      it is the PANTHER-integrated family entry for this whole heterogeneous
      family and has no InterPro2GO mapping at all. The cell-division term is
      therefore removed in the member review on biological grounds, not because
      the signature is absent.
    supported_by:
      - reference_id: file:genes/PSEPK/PP_3117/PP_3117-uniprot.txt
        supporting_text: 'DR   PANTHER; PTHR35369:SF3; TRANSLESION DNA SYNTHESIS-ASSOCIATED PROTEIN IMUA; 1.'
      - reference_id: file:genes/PSEPK/PP_3117/PP_3117-uniprot.txt
        supporting_text: 'DR   NCBIfam; NF033429; ImuA_translesion; 1.'
      - reference_id: PMID:15886391
        supporting_text: >-
          The genes imuA and imuB encode previously uncharacterized proteins,
          which are shown here for the first time to be involved in DNA damage
          tolerance.
  - subfamily_id: PANTHER:PTHR35369:SF4
    label: CELL DIVISION INHIBITOR SULA
    description: >-
      SulA cell-division inhibitors: SOS-induced proteins that bind
      polymerization-competent FtsZ and prevent Z-ring assembly, delaying
      division until damage is dealt with. This is the only subfamily of the
      family for which the division-inhibition terms hold.
    representative_members:
      - id: UniProtKB:P0AFZ5
        label: Cell division inhibitor SulA
        gene_symbol: sulA
        organism: Escherichia coli K-12
      - id: UniProtKB:Q9HZJ8
        label: Cell division inhibitor SulA
        gene_symbol: sulA
        organism: Pseudomonas aeruginosa PAO1
    diverged_from_family: false
    supported_by:
      - reference_id: file:interpro/panther/PTHR35369/PTHR35369-entries.csv
        supporting_text: A1A9M7,Cell division inhibitor SulA,protein
      - reference_id: file:interpro/panther/panther.obo
        supporting_text: 'name: CELL DIVISION INHIBITOR SULA'
      - reference_id: PMID:9501185
        supporting_text: >-
          Here we show that a MalE-SulA fusion that retains this inhibitory
          function in vivo inhibits the GTPase activity and polymerization of
          FtsZ in vitro.
node_assessments:
  - node_id: PANTHER:PTN002176549
    asserted_term:
      id: GO:0006281
      label: DNA repair
    evidence: IBD
    negated: false
    paint_snapshot: '20240305'
    node_taxon:
      id: NCBITaxon:2
      label: Bacteria
    seeds:
      - id: UniProtKB:O50419
    assessment: TOO_DEEP
    assessment_reason: >-
      The only seed is M. tuberculosis Rv3394c (ImuB), whose MTBBASE annotation
      rests on deletion and clamp-motif-mutant phenotypes in the mutagenesis
      cassette. The PANTHER 19 treeinfo service reports PTN002176549 as the ROOT
      node of PTHR35369 (a duplication node with taxonomic range Eubacteria), so
      the assertion reaches the whole family, including the SulA clade of SF4.
      SulA is a cell-division inhibitor that binds FtsZ; it is SOS-induced but
      does nothing to DNA, so DNA repair does not hold for it. The consequence is
      visible in GOA: E. coli SulA (P0AFZ5) and P. aeruginosa SulA (Q9HZJ8) both
      carry GO:0006281 IBA from this node and this seed, beside their own
      experimental cell-division annotations. The term belongs at the SF2/SF3
      ImuB-ImuA node or lower, not at the root. Separately, the term is broader
      than the seed experiment supports even where it does hold: the cassette
      tolerates lesions rather than repairing them, so the member reviews refine
      it to GO:0042276 error-prone translesion synthesis.
    affected_subfamilies:
      - id: PANTHER:PTHR35369:SF4
        label: CELL DIVISION INHIBITOR SULA
    supported_by:
      - reference_id: file:interpro/panther/PTHR35369/PTHR35369-paint.tsv
        supporting_text: "PTHR35369\tPTN002176549\tGO:0006281\tP\tIBD\tfalse\tUniProtKB:O50419"
      - reference_id: PMID:20615954
        supporting_text: >-
          Here, we confirm that Rv3395c (designated imuA ′) and Rv3394c ( imuB )
          are individually essential for induced mutagenesis and damage
          tolerance.
term_assessments:
  - assessed_term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The adaptor activity is the ImuB role and is established for the
      mycobacterial member by two-hybrid interactions with ImuA', DnaE1, DnaE2
      and the beta clamp plus a clamp-binding allele that abolishes function. It
      is asserted for SF2 only. It is not claimed for the ImuA proteins of SF3,
      for which no molecular activity has been demonstrated at all, and not for
      the SulA inhibitors of SF4, whose FtsZ binding is an inhibitory
      interaction rather than an adaptor function. The
      bacterial_imuabc_damage_induced_mutagenesis module asserts this activity
      for its ImuB annoton on this basis.
    applicable_subfamilies:
      - id: PANTHER:PTHR35369:SF2
        label: BLR3025 PROTEIN
    supported_by:
      - reference_id: PMID:20615954
        supporting_text: >-
          Notably, disruption of this motif in the imuB AAAAGG allele eliminated
          cassette function, strongly implying that ImuB—through β—is required to
          mediate access of DnaE2 to the replication fork.
  - assessed_term:
      id: GO:0051782
      label: negative regulation of cell division
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Division inhibition is the SulA role of SF4, where it is mechanistically
      characterized: SulA binds polymerization-competent FtsZ and blocks Z-ring
      assembly. It must not be transferred to SF2 or SF3, whose members act on
      damaged templates with DnaE2 and for which no division phenotype has been
      reported. InterPro2GO nevertheless propagates this term to ImuA proteins,
      because the SulA family signature IPR004596 carries it and still matches
      the homologous ImuA clade; the P. putida ImuA review removes the resulting
      row and records the upstream defect.
    applicable_subfamilies:
      - id: PANTHER:PTHR35369:SF4
        label: CELL DIVISION INHIBITOR SULA
    supported_by:
      - reference_id: PMID:9501185
        supporting_text: >-
          These results indicate that SulA blocks Z ring formation by blocking
          FtsZ polymerization.
      - reference_id: PMID:9501185
        supporting_text: >-
          In Escherichia coli the formation of the Z ring is prevented by
          induction of the cell division inhibitor SulA (SfiA), a component of
          the SOS response.
  - assessed_term:
      id: GO:0042276
      label: error-prone translesion synthesis
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Participation in damage-tolerant, mutagenic synthesis holds for the ImuB
      proteins of SF2 and the ImuA proteins of SF3, which are required for it in
      both characterized systems, and is wrong for SF4. Within SF2 and SF3 the
      mutagenic child term is used where the cassette's output is shown to be
      error-prone (Caulobacter, M. tuberculosis). The P. putida members keep the
      parent GO:0019985 to encompass condition-dependent outcomes: DnaE2 suppresses
      stationary-phase base substitutions in PMID:17331811, whereas PMID:28118378
      establishes ImuC-dependent MMS mutagenesis in PaW85, described as isogenic
      to KT2440. Neither outcome defines invariant fidelity across conditions.
    applicable_subfamilies:
      - id: PANTHER:PTHR35369:SF2
        label: BLR3025 PROTEIN
      - id: PANTHER:PTHR35369:SF3
        label: TRANSLESION DNA SYNTHESIS-ASSOCIATED PROTEIN IMUA
    supported_by:
      - reference_id: PMID:15886391
        supporting_text: >-
          The results show that the dnaE2 operon is upregulated in response to
          DNA damage in a recA-dependent manner, and demonstrate that all three
          genes that compose this expression unit are involved in UV and
          mitomycin C-induced mutagenesis.
      - reference_id: PMID:17331811
        supporting_text: it acted as an anti-mutator in accumulation of base substitution
      - reference_id: PMID:28118378
        supporting_text: indicating that ImuC is responsible for the MMS mutability in P. putida
  - assessed_term:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    scope: NOT_APPLICABLE
    scope_reason: >-
      No member of this family is a DNA polymerase. The ImuB proteins of SF2
      retain the Y-family fold but have lost the active-site carboxylates, which
      UniProt records as a caution on propagating the UmuC feature annotation,
      and the cassette's polymerase is DnaE2, a member of PTHR32294. Any
      polymerase activity or EC 2.7.7.7 reaching an ImuB protein from its
      PolY-like domain architecture is a pseudoenzyme over-annotation; the
      P. putida ImuB prediction review adjudicates one such case.
    supported_by:
      - reference_id: file:genes/MYCTU/Rv3394c/Rv3394c-uniprot.txt
        supporting_text: >-
          CC   -!- CAUTION: Lacks conserved residue(s) required for the
          propagation of
      - reference_id: PMID:20615954
        supporting_text: >-
          Despite retaining structural features characteristic of Y-family
          members, ImuB homologs lack conserved active-site amino acids required
          for polymerase activity.
