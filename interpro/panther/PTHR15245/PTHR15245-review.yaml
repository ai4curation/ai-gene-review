family_id: PANTHER:PTHR15245
family_name: SYMPLEKIN-RELATED
preferred_name: Symplekin/Pta1 RNA 3-prime processing scaffolds
summary: Symplekin and Pta1 are scaffolding components of eukaryotic RNA 3-prime-end processing machinery.
  They organize cleavage/polyadenylation factors and associated regulatory components. Historical names
  referring to pre-tRNA processing do not define an intrinsic endonuclease reaction for the family.
functional_coherence: COHERENT
coherence_reason: The inventory and curated IPR021850 connect animal symplekin to fungal Pta1. These proteins
  scaffold mRNA 3-prime-end-processing complexes; animal histone-mRNA cleavage can be uncoupled from polyadenylation.
  The historical pre-tRNA-processing name does not establish a catalytic tRNA endonuclease, and complex
  membership does not confer poly(A) polymerase chemistry on Pta1.
reference_protein:
  id: UniProtKB:Q10222
  gene_symbol: pta1
  organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
  label: mRNA cleavage and polyadenylation specificity factor complex subunit pta1
  gene_review: genes/SCHPO/pta1/pta1-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR15245:SF20
  label: SYMPLEKIN
  description: The inventory links animal symplekin with fungal Pta1 and the curated pombe record supports
    cleavage/polyadenylation-complex membership by orthology. The conserved scaffolding role is coherent;
    catalytic cleavage and poly(A) polymerization belong to other components.
