family_id: PANTHER:PTHR10836
family_name: GLYCERALDEHYDE 3-PHOSPHATE DEHYDROGENASE
preferred_name: Glyceraldehyde-3-phosphate dehydrogenase (GAPDH) family
summary: >-
  NAD-dependent phosphorylating GAPDHs oxidize glyceraldehyde 3-phosphate to 1,3-bisphosphoglycerate,
  the sixth step of glycolysis and its reverse in gluconeogenesis. The family contains bacterial
  Gap, S. cerevisiae TDH1-3, S. pombe tdh1 and gpd3, plant cytosolic GapC, and animal GAPDH and testis-specific
  GAPDHS. Animal GAPDH also has moonlighting roles (S-nitrosylation, RNA binding).
functional_coherence: COHERENT
coherence_reason: >-
  All subfamilies are NAD-dependent phosphorylating GAPDHs, differing in expression and moonlighting
  roles.
