  name:
    name: Bacterial Peptidoglycan Processing Enzymes
    short: Bact_PeptidoProc_Enz
  description:
  - text: The protein family includes enzymes involved in peptidoglycan processing,
      such as D-alanyl-D-alanine carboxypeptidases and endopeptidases. These enzymes
      play a role in bacterial cell wall synthesis and remodeling by cleaving specific
      peptide bonds in peptidoglycan precursors. D-alanyl-D-alanine carboxypeptidases
      remove the terminal D-alanine residue from pentapeptide chains in peptidoglycan
      precursors, which is a key step in cell wall maturation and recycling. Some
      family members are involved in antibiotic resistance by hydrolyzing depsipeptides
      that mimic antibiotic targets. Endopeptidases in the family cleave the L-alanine-D-glutamate
      bond in the peptidoglycan, contributing to cell wall turnover and maintenance.
      The family's activity is generally not inhibited by beta-lactam antibiotics,
      indicating a distinct mechanism of action from beta-lactamase enzymes.
