notes: >-
  The six PAINT node annotations (PANTHER 19.0 slice) are all assessed. P. putida KT2440 CysE
  Q88PL0 is classified only to the family level, so the module's KT2440 representative is not
  attributed to SF5. E. coli WcaB (P0ACC9), a putative colanic-acid acetyltransferase, appears in
  the InterPro-derived entries file but not in PANTHER's E. coli classification under this
  family, and is not treated as a member here.
