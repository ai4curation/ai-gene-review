family_id: PANTHER:PTHR42811
family_name: SERINE ACETYLTRANSFERASE
preferred_name: Serine O-acetyltransferase (CysE/SAT) family
summary: >-
  Hexapeptide-repeat (left-handed beta-helix) acyltransferases that transfer the acetyl group of
  acetyl-CoA to L-serine, forming O-acetyl-L-serine, the carbon skeleton consumed by
  O-acetylserine sulfhydrylases in the first committed step of de novo cysteine synthesis. The
  family spans bacterial CysE (E. coli, Salmonella, B. subtilis, M. tuberculosis, Pseudomonas),
  fungal SAT-like proteins (S. pombe SPAC1039.08) and the plant SAT/SERAT isoforms, which are
  distributed between cytosol, chloroplast and mitochondrion.
functional_coherence: COHERENT
coherence_reason: >-
  PAINT places serine O-acetyltransferase activity and cysteine biosynthesis at the family node
  PTN000602332, seeded by bacterial (E. coli, Salmonella, B. subtilis), protist (Leishmania) and
  Arabidopsis SATs, and records no loss of either term anywhere in the family. The only PAINT
  divergence is in location: plant organellar isoforms leave the cytosol (IRD at PTN000602385),
  with chloroplast and mitochondrion nodes added in Brassicaceae.
