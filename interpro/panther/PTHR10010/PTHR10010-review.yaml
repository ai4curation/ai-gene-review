family_id: PANTHER:PTHR10010
family_name: SOLUTE CARRIER FAMILY 34  SODIUM PHOSPHATE , MEMBER 2-RELATED
preferred_name: Type II sodium-phosphate cotransporter family
summary: >-
  PTHR10010 contains the vertebrate SLC34/NaPi-II sodium-phosphate cotransporters and more
  distant bacterial YjbB/PhoU-domain branches. The reviewed human members are the renal
  3 Na+ : 1 Pi electrogenic NaPi-IIa transporter SLC34A1, the epithelial 3 Na+ : 1 Pi
  NaPi-IIb transporter SLC34A2 and the renal 2 Na+ : 1 Pi electroneutral NaPi-IIc transporter
  SLC34A3. The cached PANTHER 19 compact tree places the PTN000000493 sodium:phosphate
  symporter, sodium-dependent phosphate transport and phosphate-homeostasis gains below the
  bacterial SF39 leaves and the Bacillus SF46 leaf, and the Chordata PTN001293650 localization
  node reaches the three human NaPi-II paralogs without crossing into those bacterial leaves.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The human SF21, SF23 and SF35 branches are functionally coherent type II sodium/phosphate
  cotransporters with different tissue distributions and Na+:Pi stoichiometries. The PANTHER
  root also contains bacterial YjbB/PhoU-domain branches, but the currently exported PAINT
  gains that reach the human NaPi-II paralogs are restricted to SLC34-like animal or chordate
  NaPi transporters and do not project sodium:phosphate symporter activity into the bacterial
  branches.
