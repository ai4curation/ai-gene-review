notes: >-
  The compact PANTHER 19.0 tree was present in .cache/panther_trees/19.0/PTHR10010.json.gz.
  In that tree PTN000000493 reaches the human SF21/SLC34A1, SF23/SLC34A2 and SF35/SLC34A3
  branches and two SF47 fish NaPi leaves, while excluding the Escherichia and Salmonella SF39
  YjbB leaves and the Bacillus SF46 P54463 leaf; PTN001293650 reaches those human branches
  and an invertebrate chordate SF46 expansion, but not the Bacillus SF46 leaf. No module
  review was added: the three human proteins are tissue-specialized alternative transporters
  rather than separate physical parts of a common module. No production GO-CAM review was
  added; the relevant cached models here are Reactome transport events, not GO-CAM source
  files under gocams/.
