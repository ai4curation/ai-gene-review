notes: >-
  The compact PANTHER 19.0 tree was present in .cache/panther_trees/19.0/PTHR10010.json.gz.
  In that tree PTN000000493 reaches the human SF21/SLC34A1, SF23/SLC34A2 and SF35/SLC34A3
  branches, and PTN001293650 also reaches all three human NaPi-II paralogs. No module review
  was added: the three human proteins are tissue-specialized alternative transporters rather
  than separate physical parts of a common module. No production GO-CAM review was added; the
  relevant cached models here are Reactome transport events, not GO-CAM source files under gocams/.
