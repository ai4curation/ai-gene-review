  name:
    name: Asparagine Synthetase
    short: Asn_Synthetase
  description:
  - text: The asparagine synthetase family is involved in the biosynthesis of asparagine,
      a process that is essential for nitrogen assimilation, distribution, and remobilization
      within organisms. Members of this family catalyze the ATP-dependent conversion
      of aspartate to asparagine using glutamine as a nitrogen source. Some family
      members can also use ammonia as a nitrogen source. This reaction is crucial
      in various biological contexts, including plant nitrogen transport via the phloem
      and potentially in the remobilization of nitrogen during senescence in flowers.
      Additionally, related enzymes within this family are involved in the biosynthesis
      of beta-lactam antibiotics, such as carbapenem, by catalyzing the formation
      of specific intermediates.
