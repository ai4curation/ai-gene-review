term_assessments:
- assessed_term:
    id: GO:0004066
    label: asparagine synthase (glutamine-hydrolyzing) activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The module's core activity for this family and a PAINT IBD at PTN000206334, the family
    root for the asparagine synthetases. Direct evidence exists in yeast (two cytosolic
    asparagine synthetases; double disruption gives total asparagine auxotrophy) and for
    recombinant human ASNS. All four gene reviews in the family (ASN1, ASN2, ASNS; asn1 is a
    stub) accept the IBA. The SF2 beta-lactam synthetases are excepted.
  member_exceptions:
  - member:
      id: UniProtKB:P0DJQ7
      label: Carboxyethyl-arginine beta-lactam-synthase
      gene_symbol: bls
      organism: Streptomyces clavuligerus
    exception_reason: >-
      SF2 member recruited to clavulanic acid biosynthesis; it forms a beta-lactam ring rather
      than amidating aspartate. It does not receive the PAINT IBA.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11772/PTHR11772-entries.csv
      supporting_text: P0DJQ7,Carboxyethyl-arginine beta-lactam-synthase,protein,1901
  - member:
      id: UniProtKB:Q9XB61
      label: Carbapenam-3-carboxylate synthase
      gene_symbol: carA
      organism: Pectobacterium carotovorum
    exception_reason: >-
      SF2 member of carbapenem biosynthesis; a beta-lactam synthetase, not an asparagine
      synthetase. It does not receive the PAINT IBA.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11772/PTHR11772-entries.csv
      supporting_text: Q9XB61,Carbapenam-3-carboxylate synthase,protein,555
  supported_by:
  - reference_id: PMID:6105958
    supporting_text: This unusual situation is shown to result from the occurrence of two L-asparagine
      synthetases.
  - reference_id: PMID:8951815
    supporting_text: Simultaneous disruption of both genes leads to a total asparagine auxotrophy
  - reference_id: PMID:2564390
    supporting_text: ammonia- and glutamine-dependent asparagine synthetase activity in vitro.
- assessed_term:
