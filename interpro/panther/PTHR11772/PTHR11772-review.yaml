      gene_symbol: bls
      organism: Streptomyces clavuligerus
    exception_reason: Beta-lactam synthetase of clavulanic acid biosynthesis, not an asparagine-forming enzyme.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11772/PTHR11772-entries.csv
      supporting_text: P0DJQ7,Carboxyethyl-arginine beta-lactam-synthase,protein,1901
  - member:
      id: UniProtKB:Q9XB61
      label: Carbapenam-3-carboxylate synthase
      gene_symbol: carA
      organism: Pectobacterium carotovorum
    exception_reason: Beta-lactam synthetase of carbapenem biosynthesis, not an asparagine-forming enzyme.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11772/PTHR11772-entries.csv
      supporting_text: Q9XB61,Carbapenam-3-carboxylate synthase,protein,555
  supported_by:
  - reference_id: PMID:8951815
    supporting_text: Simultaneous disruption of both genes leads to a total asparagine auxotrophy
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: FAMILY_WIDE
  scope_reason: >-
    Asserted at PTN000206335 (eukaryotic clade, seeds mouse and human ASNS) and at
    PTN000206513 (bacteria, seed E. coli AsnB). Yeast enzymes are not mitochondrial and are
    probably cytosolic, and human ASNS is cytosolic. No member is known to be organellar.
  supported_by:
