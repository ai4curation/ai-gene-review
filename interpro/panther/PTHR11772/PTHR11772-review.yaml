notes: >-
  Used by modules/aspartate_asparagine_metabolism.yaml (asparagine_synthetase_activity
  annoton, family-level id). The module's note that human ASNS is in SF36 while the fungal
  and E. coli AsnB enzymes are in SF2 is correct, so using the family-level id is the right
  choice. Gene reviews for ASN1, ASN2 and ASNS accept all three IBAs (activity, process,
  cytosol); the S. pombe asn1 review is a stub with the IBAs still PENDING. PANTHER 19.0
  classification files and UniProt agree on the subfamily of every member checked.
