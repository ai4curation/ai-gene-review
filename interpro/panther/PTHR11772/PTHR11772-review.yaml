family_id: PANTHER:PTHR11772
family_name: ASPARAGINE SYNTHETASE
preferred_name: Glutamine-dependent asparagine synthetases (AsnB-type)
summary: >-
  Class II glutamine amidotransferases with an N-terminal Ntn glutaminase domain and a
  C-terminal adenylating synthetase domain that convert L-aspartate, L-glutamine and ATP to
  L-asparagine, L-glutamate, AMP and diphosphate (EC 6.3.5.4). Members include the two
  redundant S. cerevisiae enzymes ASN1 and ASN2, S. pombe asn1, E. coli AsnB and the
  Arabidopsis ASN1-ASN3 (SF2, SF38, SF48), vertebrate ASNS (SF23, SF36) and other plant
  paralogues. A small number of bacterial beta-lactam synthetases sit in SF2.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterised eukaryotic member and E. coli AsnB is a glutamine-dependent asparagine
  synthetase, and PAINT places both the activity and L-asparagine biosynthesis at one deep
  node (PTN000206334) with seeds from yeast, human, mouse, rat and E. coli. The divergent
  members are bacterial secondary-metabolite enzymes in SF2 that use the same fold for
  beta-lactam ring formation (Streptomyces carboxyethyl-arginine beta-lactam synthase bls,
  Pectobacterium carbapenam-3-carboxylate synthase carA). They do not receive the IBA in the
  current PAINT GAF, but they share a subfamily with the yeast enzymes, so SF2 membership
  alone does not guarantee asparagine synthetase activity.
