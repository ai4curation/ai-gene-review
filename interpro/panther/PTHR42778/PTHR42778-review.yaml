family_id: PANTHER:PTHR42778
family_name: 2-AMINOETHYLPHOSPHONATE--PYRUVATE TRANSAMINASE
preferred_name: PhnW 2-aminoethylphosphonate:pyruvate transaminases (class-V PLP-dependent aminotransferases)
summary: >-
  A narrow bacterial family of homodimeric, pyridoxal-5'-phosphate (PLP)-dependent class-V
  aminotransferases, the PhnW 2-aminoethylphosphonate (AEP) transaminases. PhnW transfers the
  amino group of AEP to pyruvate, giving phosphonoacetaldehyde and L-alanine. This is the first,
  shared step of the hydrolytic PhnWX and oxidative PhnWAY AEP degradation routes. The reference
  member, Salmonella typhimurium LT2 PhnW, has been purified, kinetically characterized and
  crystallized, and is highly specific for AEP. The family has a single PANTHER subfamily (SF1),
  which holds every member in the cached inventory, from Pseudomonadota (Salmonella,
  Burkholderia, Pseudomonas, Vibrio), Bacillota (Bacillus, Clostridioides) and Bacteroidota
  (Bacteroides).
functional_coherence: COHERENT
coherence_reason: >-
  All 84 members in the cached inventory are classified in SF1 and carry the PhnW name, and the
  family matches the PhnW-specific HAMAP rule and InterPro signature used to annotate the reviewed
  KT2440, Salmonella and Bacillus members. The only biochemically characterized member, Salmonella
  PhnW, discriminates strongly for AEP over other amino donors, and its discoverers report that the
  catalytic residues are conserved across the PhnW sequences then known. No member in this corpus
  has evidence of a different substrate or reaction. Coherence is a family-wide inference anchored
  on one assayed enzyme, not a survey of activities across the family.
