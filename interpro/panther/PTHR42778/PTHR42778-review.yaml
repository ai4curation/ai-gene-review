notes: >-
  `just fetch-panther-paint PTHR42778` resolved 25 PTN nodes and found no node-level PAINT
  annotations, so there are no IBD assertions to assess and node_assessments is intentionally
  empty; the PhnW GO annotations of the member genes come from InterPro2GO, HAMAP/UniRule and
  combined IEA pipelines, not from PAINT. The InterPro description for this family is
  LLM-generated and unchecked; it was not used as evidence. No ancestral-node placement is
  asserted. The 2-aminoethylphosphonate degradation module grounds its first step on SF1, which
  equals the whole family; SF1 is cited as the narrower, explicitly named unit.
