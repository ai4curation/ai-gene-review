family_id: PANTHER:PTHR11907
family_name: AMIDOPHOSPHORIBOSYLTRANSFERASE
preferred_name: PurF glutamine PRPP amidotransferase family
summary: >-
  Amidophosphoribosyltransferase (glutamine phosphoribosylpyrophosphate amidotransferase, PurF, EC
  2.4.2.14) catalyses the committed first step of de novo purine synthesis: PRPP and glutamine are
  converted to 5-phosphoribosylamine, glutamate and pyrophosphate. The enzyme combines an N-terminal
  class II (Ntn) glutamine amidotransferase domain, whose N-terminal cysteine is exposed by removal of
  a propeptide, with a C-terminal type I phosphoribosyltransferase domain. It is feedback-inhibited by
  purine nucleotides. Members include bacterial PurF (E. coli, B. subtilis, Pseudomonas), fungal ADE4
  (S. cerevisiae, S. pombe), animal PPAT, and the plastid isozymes of plants. A few reviewed members
  carry only the glutamine-amidotransferase domain (Rhizobium GlxB, Methanothermobacter MTH_191). There
  is also a fungal PurF paralog, FrzK, in an alkaloid biosynthetic gene cluster.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Full-length members share the two-domain PurF architecture and the PRPP amidotransferase reaction.
  The exceptions are proteins with only the glutamine-amidotransferase domain (Pfam GATase_7, no
  Pribosyltran domain): Rhizobium meliloti GlxB (O87390) and Methanothermobacter MTH_191 (O26293).
  These cannot perform the phosphoribosyltransfer half of the reaction. The reviewed entries carry no
  subfamily assignment, so no subfamily boundaries can be used. A separate, technical problem is that
  Synechocystis PurF (Q55621), which InterPro classifies here, receives IBAs from the GFAT nodes of
  PTHR10937 in the PAINT GAF (see node assessments).
