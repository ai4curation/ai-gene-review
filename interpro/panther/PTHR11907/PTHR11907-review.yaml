term_assessments:
- assessed_term:
    id: GO:0004044
    label: amidophosphoribosyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the defining activity of the family. It is shown for the yeast and fission-yeast enzymes
    and is inherited from PTN000225535, whose placement is sound. The module attaches it to the whole
    family. The exceptions are the GATase-domain-only members, which do not inherit the IBA anyway.
    FrzK keeps the full PurF architecture and is described as a PRPP amidotransferase, so it is not
    excepted.
