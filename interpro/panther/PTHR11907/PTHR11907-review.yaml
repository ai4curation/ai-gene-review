  assessment_reason: >-
    This is the GFAT node of PTHR10937, which is where the PANTHER 19 per-organism files put
    S. cerevisiae GFA1. It appears in this family's paint.tsv only because one protein classified in
    PTHR11907, Synechocystis PurF (Q55621, 495 aa), receives its IBAs in the PAINT GAF: GO:0004360 and
