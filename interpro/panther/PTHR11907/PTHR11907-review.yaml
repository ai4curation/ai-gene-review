notes: >-
  Gene reviews checked: yeast ADE4 (DRAFT; accepts the PTN000225535/PTN000225537 IBAs), human PPAT
  (accepts GO:0004044 IBA), P. putida purF, S. pombe ade4 (COMPLETE; accepts the PTN000225535 and PTN000225537 IBAs), yeast GFA1
  (accepts the PTN000101302 GFAT IBAs, which is correct for GFA1). The de_novo_purine_synthesis module
  uses the whole family for the PurF leaf, which is consistent with this review. The PANTHER obo
  lists subfamilies SF0, SF20-SF22 and SF24-SF26, all named AMIDOPHOSPHORIBOSYLTRANSFERASE (SF21 and
  SF24 chloroplastic). The reviewed-entry export has no SF assignment, and the PANTHER 19 yeast file
  places ADE4 in SF0. Subfamilies are therefore not described here.
