    GFAT node is sound for GFATs (the GFA1 review accepts it). What is wrong is the leaf: the Q55621
    sequence sits in the GFAT tree. It should be moved to the PurF tree or blocked with an IRD/NOT. Why
    the leaf is placed there was not determined.
