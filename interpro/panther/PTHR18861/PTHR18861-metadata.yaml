  name:
    name: ERC/RB6I2 CAZ Organization and Vesicle Trafficking
    short: ERC_RB6I2_CAZ_VesicleTraf
  description:
  - text: The ERC/RB6I2 protein family is involved in the organization and regulation
      of the cytomatrix at the nerve terminals active zone (CAZ), which is crucial
      for neurotransmitter release. Family members may work in conjunction with BSN
      and recruit liprin-alpha proteins to the CAZ. Additionally, some members play
      a role in centrosome maturation and mitotic spindle assembly during early zygotic
      division, as well as in vesicle trafficking and Rab-6 regulated endosome-to-Golgi
      transport. Regulatory functions in the IKK complex, potentially involving the
      recruitment of IkappaBalpha/NFKBIA, are also indicated for certain family members.
