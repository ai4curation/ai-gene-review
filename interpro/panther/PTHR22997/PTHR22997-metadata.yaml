  name:
    name: PIH1 family, Kintoun subfamily
    short: PIH1/Kintoun_subfamily
  description:
  - text: The PIH1 family, specifically the Kintoun subfamily, is involved in the
      cytoplasmic pre-assembly of axonemal dyneins, which are essential for the motility
      of cilia and flagella across a range of species. Members of this family play
      a crucial role in organizing dynein arm complexes in the cytoplasm prior to
      their transport into the ciliary compartment via intraflagellar transport. Additionally,
      some members are implicated in pre-rRNA processing, snoRNP particle assembly,
      and regulation of gene transcription and mTORC1 complex activity.
