      E4PDH had an apparent Km value for E4P [Kmapp(E4P)] of 0.96 mM, an
      apparent kcat catalytic constant for E4P [kcatapp(E4P)] of 200 s-1
- assessed_term:
    id: GO:0004365
    label: glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating) activity
  scope: UNRESOLVED
  scope_reason: >-
    The activity holds for the characterized GAPDH members and is excluded
    from SF3 by the node pruning above. Which of the other subfamilies it
