  - id: UniProtKB:P09124
  - id: UniProtKB:P0A9B6
  - id: UniProtKB:P17721
  - id: UniProtKB:P9WN83
  assessment: SOUND
  assessment_reason: >-
    NAD binding is shared by the GAPDHs and by Epd, whose kinetics were
    measured with NAD+ and whose dissociation constant for NAD was determined
    directly. It is a cofactor-binding term rather than the defining activity.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43148/PTHR43148-paint.tsv
    supporting_text: "PTHR43148\tPTN001652504\tGO:0051287\tF\tIBD\tfalse"
  - reference_id: PMID:9182530
    supporting_text: The KD constant of GapB-encoded protein for NAD is 800-fold higher than that of GAPDH.
- node_id: PANTHER:PTN001652504
  asserted_term:
    id: GO:0006006
    label: glucose metabolic process
  evidence: IBD
  paint_snapshot: '20170421'
  seeds:
  - id: UniProtKB:O34425
  - id: UniProtKB:P0A9B6
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The term describes the glycolytic or gluconeogenic GAPDHs. Epd acts on
    erythrose 4-phosphate in PLP biosynthesis, not on a glucose-metabolism
    intermediate, so seeding the node with Epd and propagating it to SF3 is
    an over-annotation; the node should be pruned for SF3.
  affected_subfamilies:
