family_id: PANTHER:PTHR43148
family_name: GLYCERALDEHYDE-3-PHOSPHATE DEHYDROGENASE 2
preferred_name: Type I GAPDH-like family including Epd erythrose-4-phosphate dehydrogenase
summary: >-
  Cys-dependent NAD(P)-binding aldehyde dehydrogenases of the type I
  glyceraldehyde-3-phosphate dehydrogenase (GAPDH) fold. Most members are
  phosphorylating GAPDHs: bacterial GapA/GapB enzymes, Mycobacterium Gap, the
  cyanobacterial Calvin-cycle Gap2 and plant chloroplast GapA/GapB. The
  gammaproteobacterial Epd subfamily (SF3) has diverged into a
  non-phosphorylating D-erythrose-4-phosphate dehydrogenase. Epd forms
  4-phospho-D-erythronate, the first intermediate of the DXP-dependent de
  novo pyridoxal 5'-phosphate pathway, and oxidizes glyceraldehyde
  3-phosphate only at a trace rate. The major E. coli GAPDH, GapA, is not in
  this PANTHER family.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Parsed from the entries file (175 reviewed members): 92 are named
  D-erythrose-4-phosphate dehydrogenase and the remaining 83 carry
  glyceraldehyde-3-phosphate dehydrogenase names (bacterial, plasmid,
  chromosomal and chloroplast forms). Epd and the GAPDHs share the fold and
  the catalytic cysteine but differ in substrate and in whether the
  acyl-enzyme is phosphorolysed or hydrolysed. The entries file carries no
  subfamily column for this family; subfamily placements below come from
  PANTHER's own organism classification files.
reference_protein:
  id: UniProtKB:P0A9B6
  label: D-erythrose-4-phosphate dehydrogenase
  gene_symbol: epd
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/epd/epd-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43148:SF3
  label: D-ERYTHROSE-4-PHOSPHATE DEHYDROGENASE
  description: >-
    Epd non-phosphorylating D-erythrose-4-phosphate dehydrogenases of the
    PLP pathway.
  representative_members:
  - id: UniProtKB:P0A9B6
    gene_symbol: epd
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/epd/epd-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Epd hydrolyses rather than phosphorolyses the thioacyl intermediate and
    prefers erythrose 4-phosphate; its residual glyceraldehyde-3-phosphate
    oxidation is at least 2000-fold less efficient.
  supported_by:
  - reference_id: PMID:9182530
    supporting_text: >-
      This enzyme shows an efficient non-phosphorylating erythrose-4-phosphate
      dehydrogenase activity
  - reference_id: PMID:9182530
    supporting_text: >-
      The rate of oxidation of glyceraldehyde 3-phosphate is 0.12 s-1 and is
      hydride transfer limiting, at least 2000-fold less efficient compared with
      that of erythrose 4-phosphate.
node_assessments:
- node_id: PANTHER:PTN001652504
  asserted_term:
    id: GO:0004365
    label: glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating) activity
  evidence: IBD
  paint_snapshot: '20260530'
  seeds:
  - id: AGI_LocusCode:AT3G26650
  - id: UniProtKB:O34425
  - id: UniProtKB:P09124
  - id: UniProtKB:P0A9B6
  - id: UniProtKB:P17721
  - id: UniProtKB:P47543
  - id: UniProtKB:P80505
  - id: UniProtKB:P9WN83
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Phosphorylating GAPDH activity is ancestral for the family, and the
    reviewed Synechocystis Gap2 seed keeps it on experimental evidence. But
    the Epd subfamily (SF3) diverged. Purified E. coli Epd is an
    erythrose-4-phosphate dehydrogenase, not a second GAPDH, and its
    glyceraldehyde-3-phosphate rate is at noise level. E. coli has a
    dedicated GAPDH (GapA) in another family. Listing Epd among the seeds and
    propagating the term to SF3 over-annotates it; the node should be pruned
    for SF3.
  affected_subfamilies:
  - id: PANTHER:PTHR43148:SF3
    label: D-ERYTHROSE-4-PHOSPHATE DEHYDROGENASE
  supported_by:
  - reference_id: file:interpro/panther/PTHR43148/PTHR43148-paint.tsv
    supporting_text: "PTHR43148\tPTN001652504\tGO:0004365\tF\tIBD\tfalse"
  - reference_id: PMID:7751290
    supporting_text: >-
      We found that the gapB-encoded enzyme is indeed an E4PDH and not a second
      GA3PDH
  - reference_id: file:genes/SYNY3/gap2/gap2-ai-review.yaml
    supporting_text: >-
      Purified native and recombinant Gap2 show NAD-dependent as well as
      NADP-dependent GAPDH activity.
- node_id: PANTHER:PTN001652504
  asserted_term:
    id: GO:0051287
    label: NAD binding
  evidence: IBD
  paint_snapshot: '20250904'
  seeds:
