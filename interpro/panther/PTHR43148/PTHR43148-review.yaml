    label: D-ERYTHROSE-4-PHOSPHATE DEHYDROGENASE
  supported_by:
  - reference_id: file:interpro/panther/PTHR43148/PTHR43148-paint.tsv
    supporting_text: "PTHR43148\tPTN001652504\tGO:0006006\tP\tIBD\tfalse\tUniProtKB:O34425|UniProtKB:P0A9B6"
  - reference_id: PMID:9696782
    supporting_text: >-
      These results implicate the GapA and Epd dehydrogenases in de novo PLP and
      PMP coenzyme biosynthesis.
