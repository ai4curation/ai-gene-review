review_date: '2026-09-10'
notes: Benchmark representatives and subfamily identifiers are verified against the frozen UniProt records
  and PANTHER vocabulary. The summary distinguishes family classification from biological evidence. No
  PAINT ancestral-node placement is asserted without a tree-based assessment, and no catalytic-residue
  loss is inferred from a short or incomplete input sequence. On 2026-11-27 (claude-code) term assessments and node assessments were added for the terms PAINT
  propagates to the three human PDE6 catalytic subunits (PDE6A, PDE6B, PDE6C, all with COMPLETE gene reviews);
  subfamily assignments (PDE6A SF115, PDE6B SF73, PDE6C SF23) were read from the PANTHER geneinfo service,
  since the UniProt records carry no subfamily cross-reference. The PANTHER tree and alignment were not
  inspected, and node rows off the PDE6 lineage (PDE1, PDE2, PDE8, PDE10, PDE11 and Dictyostelium nodes) were
  not assessed.
term_assessments:
- assessed_term:
    id: GO:0004115
    label: 3',5'-cyclic-AMP phosphodiesterase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    PAINT asserts cAMP hydrolysis at the family root (PTN001682918), and it is the ancestral and majority
    activity: it is the established activity of cAMP-specific enzymes as distant as Dictyostelium RegA and
    Drosophila dunce (PDE4), as well as of the PDE4, PDE7 and PDE8 and the dual-specificity PDE1, PDE2,
    PDE3, PDE10 and PDE11 lineages. It is not a function of the photoreceptor PDE6 catalytic subunits,
    which are cGMP-specific: UniProt records only cGMP hydrolysis for PDE6A, PDE6B and PDE6C, and all
    three gene reviews mark the inherited IBA over-annotated. Those three are recorded as exceptions,
    pruned at the root. The other cGMP-selective lineages, PDE5 (SF20) and PDE9 (SF228, named high
    affinity cGMP-specific by PANTHER), are probable further exceptions but have no gene review here and
    were not adjudicated.
