- assessed_term:
    id: GO:0047555
    label: 3',5'-cyclic-GMP phosphodiesterase activity
  scope: UNRESOLVED
  scope_reason: >-
    The core function of the PDE6 catalytic subunits, measured for PDE6A, PDE6B and PDE6C; the PDE6C
    gene review ACCEPTs the root IBA, and PDE6A and PDE6B carry the term on experimental and other rows.
    It is also the activity of the dual-specificity and other cGMP-directed lineages (PDE1, PDE2, PDE3,
    PDE5, PDE9, PDE10, PDE11). PAINT places it at the family root, which would also give it to the
    lineages PANTHER names cAMP-specific (PDE4, PDE7, PDE8) and to Dictyostelium RegA, whose gene review
    leaves cGMP hydrolysis UNDECIDED. None of those cAMP-specific members has a completed review here, so
    whether the root needs pruning for them is not settled. Safe for the PDE6 subfamilies (SF115, SF73,
    SF23); not settled family-wide.
  supported_by:
  - reference_id: PMID:20940301
    supporting_text: The k cat values for cGMP hydrolysis were calculated as V max /[PDE].
  - reference_id: PMID:39739818
    supporting_text: In contrast, cone holoPDE6 is a catalytic homodimer of PDE6C (PDE6α′) subunits bound
      to cone-specific Pγc inhibitory subunits.
- assessed_term:
    id: GO:0042622
    label: photoreceptor outer segment membrane
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    PAINT places this term separately at the rod PDE6A node (PTN008516324) and the rod PDE6B node
    (PTN002602875), not at a deep node. The rod catalytic subunits are prenylated and sit on the disc
    membranes of rod outer segments; both gene reviews MODIFY the IBA only to refine it to rod
    photoreceptor disc membrane. The cone subunit PDE6C (SF23) is equally an outer segment disc
    membrane protein, so the term would also be sound there, though PAINT does not place it on that
    node. No other lineage of the family is a photoreceptor outer segment protein.
  applicable_subfamilies:
