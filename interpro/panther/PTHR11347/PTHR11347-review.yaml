  supported_by:
  - reference_id: PMID:20940301
    supporting_text: Similar to EGFP-PDE6C, EGFP-PDE6C-A and EGFP-PDE6C-B were targeted to the rod outer
      segments and concentrated at the disc rims.
- assessed_term:
    id: GO:0060041
    label: retina development in camera-type eye
  scope: NOT_APPLICABLE
  scope_reason: >-
    PAINT places this term at the rod PDE6A and PDE6B nodes, each seeded by a mouse mutant (Pde6a, Pde6b)
    whose rods degenerate after they have formed. Photoreceptor death in PDE6 deficiency follows from
    cGMP accumulation in cells that cannot hydrolyse it; PDE6 does not take part in building the retina.
    Both gene reviews mark the IBA over-annotated. No other lineage of the family has a retinal
    developmental role.
  supported_by:
  - reference_id: PMID:30240620
    supporting_text: In the rd1/rd1 retina, most rods degenerate rapidly (within the first week after
      birth) and all rods disappear completely by about 7 weeks of age.
- assessed_term:
    id: GO:0007601
    label: visual perception
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    PAINT places this term at the cone PDE6C node (PTN002602891), seeded by mouse, human and zebrafish
    PDE6C. Biallelic PDE6C mutations cause achromatopsia and early-onset cone dystrophy, and missense
    alleles abolish or reduce catalytic activity; the PDE6C gene review ACCEPTs the IBA. The rod
    subunits PDE6A and PDE6B have the same role in rod vision. Other lineages of the family have no
    visual role.
  applicable_subfamilies:
  - id: PANTHER:PTHR11347:SF115
    label: ROD CGMP-SPECIFIC 3',5'-CYCLIC PHOSPHODIESTERASE SUBUNIT ALPHA
  - id: PANTHER:PTHR11347:SF73
    label: ROD CGMP-SPECIFIC 3',5'-CYCLIC PHOSPHODIESTERASE SUBUNIT BETA
  - id: PANTHER:PTHR11347:SF23
    label: CONE CGMP-SPECIFIC 3',5'-CYCLIC PHOSPHODIESTERASE SUBUNIT ALPHA'
  supported_by:
  - reference_id: PMID:19615668
    supporting_text: Our findings identify PDE6C as a gene for cone photoreceptor disorders
  - reference_id: PMID:21127010
    supporting_text: Four of the six PDE6C missense mutations led to baseline PDE activities and most
      likely represent functional null alleles.
