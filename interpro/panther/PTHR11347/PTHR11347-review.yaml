family_id: PANTHER:PTHR11347
family_name: CYCLIC NUCLEOTIDE PHOSPHODIESTERASE
summary: Cyclic-nucleotide phosphodiesterases terminate or shape second-messenger signals by hydrolyzing
  cyclic nucleotides. Members differ in cAMP versus cGMP preference, dual specificity and regulatory domains.
  PDE4/Dunce-type enzymes belong to a cAMP-directed branch, distinct from retinal cGMP phosphodiesterases.
functional_coherence: HETEROGENEOUS
coherence_reason: Cyclic-nucleotide phosphodiesterases share hydrolysis of a cyclic phosphodiester bond
  but include cAMP-selective, cGMP-selective and dual-specificity enzymes. The reviewed fly Pde4 record
  assigns the PDE4 subfamily and cAMP hydrolysis by similarity to a characterized homolog; the actual
  family inventory separately includes cGMP-directed PDEs. A general phosphodiesterase label therefore
  cannot determine the cyclic-nucleotide substrate. Learning, phototransduction and reproductive phenotypes
  remain substrate-, cell- and branch-dependent.
