term_assessments:
- assessed_term:
    id: GO:0003856
    label: 3-dehydroquinate synthase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for SF7, the canonical DHQS clade that PAINT annotates. Not safe for SF3 (sedoheptulose
    7-phosphate cyclases) or for SF1 as a whole, which mixes AroB with 2-deoxy-scyllo-inosose
    synthases and a glycerol-1-phosphate dehydrogenase. The shikimate module asserts GO:0003856
    with the family-level selector PANTHER:PTHR43622, which is broader than this scope;
    PANTHER:PTHR43622:SF7 would match its P. putida representative (Q88CV2, SF7).
  applicable_subfamilies:
  - id: PANTHER:PTHR43622:SF7
    label: 3-DEHYDROQUINATE SYNTHASE, CHLOROPLASTIC
  supported_by:
  - reference_id: PMID:6386050
    supporting_text: The synthase is encoded by the aroB gene
  - reference_id: PMID:22741921
    supporting_text: which includes DHQ synthases, aminoDHQ synthases, and 2-deoxy-scyllo-inosose
      synthases
- assessed_term:
    id: GO:0009073
    label: aromatic amino acid biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: Same scope as the DHQS activity; the cyclitol and aminoglycoside synthases and
    EgsA do not feed aromatic amino acid synthesis.
  applicable_subfamilies:
  - id: PANTHER:PTHR43622:SF7
    label: 3-DEHYDROQUINATE SYNTHASE, CHLOROPLASTIC
  supported_by:
  - reference_id: PMID:24832673
    supporting_text: ValA has a fold and active site organization resembling those of the sugar phosphate
      cyclase dehydroquinate synthase (DHQS)
- assessed_term:
