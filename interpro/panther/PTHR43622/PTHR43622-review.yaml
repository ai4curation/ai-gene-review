family_id: PANTHER:PTHR43622
family_name: 3-DEHYDROQUINATE SYNTHASE
preferred_name: 3-dehydroquinate synthase (AroB) and related sugar phosphate cyclases
summary: >-
  NAD+- and metal-dependent sugar phosphate cyclases and their relatives. The best-known members
  are the monofunctional 3-dehydroquinate synthases (DHQS, AroB) of bacteria and plants, which
  convert 3-deoxy-D-arabino-heptulosonate 7-phosphate (DAHP) to 3-dehydroquinate in the second
  step of the shikimate pathway. The family also contains sedoheptulose 7-phosphate cyclases of
  natural-product pathways (2-epi-5-epi-valiolone synthases such as ValA and AcbC,
  2-epi-valiolone synthases, demethyl-4-deoxygadusol synthases, and eukaryotic EEVS),
  2-deoxy-scyllo-inosose synthases of aminoglycoside biosynthesis, and the Bacillus subtilis
  glycerol-1-phosphate dehydrogenase EgsA/AraM. The fungal and apicomplexan pentafunctional
  AROM DHQS domain is classified in a different family (PTHR21090).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The fold and NAD+/metal-dependent chemistry are shared, but substrate and product differ
  between groups: DHQS (DAHP to 3-dehydroquinate) in SF7 and part of SF1; sedoheptulose
  7-phosphate cyclases in SF3; 2-deoxy-scyllo-inosose synthases, a 2-epi-valiolone synthase and
  the glycerol-1-phosphate dehydrogenase EgsA in SF1, which is a mixed default subfamily that
  also holds archaeal and firmicute AroB. Only the DHQS members belong in the shikimate pathway.
reference_protein:
  id: UniProtKB:P07639
  label: 3-dehydroquinate synthase
  gene_symbol: aroB
  organism: Escherichia coli K-12
subfamilies:
- subfamily_id: PANTHER:PTHR43622:SF7
  label: 3-DEHYDROQUINATE SYNTHASE, CHLOROPLASTIC
  description: >-
    Canonical monofunctional DHQS of bacteria and plants (E. coli, B. subtilis and M.
    tuberculosis AroB, Helicobacter AroB, Arabidopsis DHQS, P. putida AroB PP_5078). Corresponds
    to the PAINT node PTN000472619.
  clade_node_id: PANTHER:PTN000472619
  representative_members:
  - id: UniProtKB:P07639
    label: 3-dehydroquinate synthase
    gene_symbol: aroB
    organism: Escherichia coli K-12
  - id: UniProtKB:Q88CV2
    label: 3-dehydroquinate synthase
    gene_symbol: aroB
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/aroB/aroB-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR43622:SF1
  label: 3-DEHYDROQUINATE SYNTHASE
  description: >-
    Mixed default subfamily: archaeal and firmicute AroB (Pyrobaculum, Sulfolobus, Streptococcus
    pyogenes), 2-deoxy-scyllo-inosose synthases of aminoglycoside clusters (BtrC, NeoC, KanC,
    GtmA), a 2-epi-valiolone synthase (Stigmatella STAUR_3140) and B. subtilis EgsA (AraM), a
    glycerol-1-phosphate dehydrogenase.
  representative_members:
  - id: UniProtKB:P94527
    label: Glycerol-1-phosphate dehydrogenase [NAD(P)+]
    gene_symbol: egsA
    organism: Bacillus subtilis 168
  - id: UniProtKB:Q980I9
    label: 3-dehydroquinate synthase
    gene_symbol: aroB
    organism: Saccharolobus solfataricus
  diverged_from_family: true
  divergence_description: >-
    Not a single function. Its AroB members are presumably DHQS, but it also holds enzymes with
    other substrates and products (2-deoxy-scyllo-inosose synthase, 2-epi-valiolone synthase,
    glycerol-1-phosphate dehydrogenase). None of its members receives the PAINT DHQS IBA.
  supported_by:
  - reference_id: PMID:18558723
    supporting_text: the purified protein forms a homodimer that reversibly reduces dihydroxyacetone
      phosphate (DHAP) to glycerol-1-phosphate (G1P) in a NADH-dependent manner
  - reference_id: file:interpro/panther/PTHR43622/PTHR43622-entries.csv
    supporting_text: Q53U19,2-deoxy-scyllo-inosose synthase,protein
- subfamily_id: PANTHER:PTHR43622:SF3
  label: 2-EPI-5-EPI-VALIOLONE SYNTHASE
  description: >-
    Sedoheptulose 7-phosphate cyclases: 2-epi-5-epi-valiolone synthases (ValA, AcbC, SalQ, GacC,
    CetA) and demethyl-4-deoxygadusol synthases of cyanobacteria; in the PANTHER tree the
    eukaryotic EEVS (zebrafish eevs) sits on the corresponding Eukaryota node PTN001078702.
  representative_members:
  - id: UniProtKB:H2K887
    label: 2-epi-5-epi-valiolone synthase
    gene_symbol: valA
    organism: Streptomyces hygroscopicus subsp. jinggangensis 5008
  diverged_from_family: true
  divergence_description: >-
    Cyclize sedoheptulose 7-phosphate rather than DAHP, giving cyclitol precursors of
    natural products (validamycin, acarbose, mycosporine-like amino acids). Not shikimate-pathway
    enzymes, and correctly outside the PAINT DHQS node.
  supported_by:
  - reference_id: PMID:22741921
    supporting_text: These proteins are phylogenetically related to the dehydroquinate (DHQ) synthases
      from the shikimate pathway and are part of the more recently recognized superfamily of sugar
      phosphate cyclases
  - reference_id: PMID:24832673
    supporting_text: which makes 2-epi-5-epi-valiolone as part of the biosynthesis of the agricultural
      antifungal agent validamycin A
