notes: >-
  Used by modules/bacterial_shikimate_chorismate_biosynthesis.yaml (discrete-enzyme architecture,
  arob_dehydroquinate_synthase) with the family-level selector PANTHER:PTHR43622 and GO:0003856.
  Topology from the PANTHER 19 treeinfo service filtered to model organisms: root PTN000472585
  (LUCA) splits into a Eukaryota node PTN001078702 (A. nidulans ANIA_06403, zebrafish eevs and a
  paralog) and a duplication node PTN001843642 joining B. subtilis EgsA (P94527; UniProt synonym
  araM) with the DHQS node PTN000472619 (E. coli, H. influenzae, B. subtilis and M. tuberculosis
  AroB, Arabidopsis DHQS). IBA recipients from the PAINT UniProt GAF are all SF7. The P. putida
  AroB review (Q88CV2) takes GO:0003856 and GO:0009423 as core, consistent with this review.
