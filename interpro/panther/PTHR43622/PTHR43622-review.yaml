  - id: UniProtKB:P56081
    label: aroB
    organism: Helicobacter pylori 26695
  - id: UniProtKB:P9WPX9
    label: aroB
    organism: Mycobacterium tuberculosis H37Rv
  assessment: SOUND
  assessment_reason: >-
    The node is the SF7 DHQS clade (Terrabacteria and Gammaproteobacteria, with Arabidopsis DHQS
    nested inside). It excludes the
    sister lineages: the Eukaryota node with EEVS (PTN001078702) and B. subtilis EgsA, so the
    sugar phosphate cyclases and the glycerol-1-phosphate dehydrogenase do not inherit DHQS
    activity. The recorded taxon (Bacteria) understates the clade because of the plant member.
    Archaeal and firmicute AroB in SF1 do not inherit the term; whether they are true DHQS was
    not checked here.
  supported_by:
  - reference_id: PMID:6386050
    supporting_text: The synthase is encoded by the aroB gene
