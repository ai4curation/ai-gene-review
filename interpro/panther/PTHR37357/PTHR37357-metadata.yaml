  name:
    name: Izumo sperm-egg fusion
    short: Izumo_fusion
  description:
  - text: This family of proteins is involved in the process of sperm-egg fusion,
      a critical event in fertilization. Members of this family are characterized
      by their role in mediating the recognition and binding between sperm and oocyte
      membranes, facilitating the fusion of these two distinct gametes. The proteins
      are typically expressed in the testis and are present on the surface of sperm
      cells. They are essential for the species-specific recognition that ensures
      fertilization occurs only between gametes of the same species, thus contributing
      to reproductive isolation and speciation.
