  name:
    name: Sentrin-specific protease
    short: Sentrin-specific_protease
  description:
  - text: This family of proteins includes sentrin-specific proteases that are involved
      in the post-translational modification of proteins through the process of SUMOylation,
      where small ubiquitin-like modifier (SUMO) proteins are attached to target proteins.
      Members of this family are responsible for the cleavage of SUMO2 and SUMO3 from
      substrates, a process known as desumoylation. They play a crucial role in regulating
      various cellular processes, including DNA repair, transcriptional activation,
      and cell cycle progression. Specifically, they act as regulators of the cGAS-STING
      pathway by desumoylating CGAS, which enhances its DNA-binding activity and subsequent
      activation. Additionally, they are involved in chromosome alignment and spindle
      assembly by modulating the kinetochore complex and protecting certain proteins
      from ubiquitin-mediated degradation.
