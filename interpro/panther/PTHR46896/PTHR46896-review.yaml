family_id: PANTHER:PTHR46896
family_name: SENTRIN-SPECIFIC PROTEASE
summary: Ulp2/SENP-related proteases regulate SUMO modification by processing SUMO conjugates and chains.
  Their catalytic framework is coupled to different cellular substrates and localization mechanisms across
  lineages.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The inventory spans SENP6/7 and Ulp2-like proteins. Pombe Ulp2 has direct SUMO-deconjugation
  evidence and predominantly nuclear foci with a smaller cytoplasmic fraction (PMID:24818994). eIF4G sumoylation
  and co-purification identify a relevant substrate context, whereas eIF3h co-purification did not establish
  its sumoylation. Vertebrate SUMO2/3 preference and cGAS-STING control are not universal properties of
  this protease family.
