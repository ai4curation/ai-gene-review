      that MCE transporters translocate lipids through a closed channel formed by the pores of multiple
      stacked MCE rings (e.g., YebT), or a combination of rings and a hollow, needle-like projection formed
      by long C-terminal helices (e.g., PqiB, and the MCE proteins from M. tuberculosis and chloroplasts;
      Figure S7B and S7C).
- node_id: PANTHER:PTN002530749
  asserted_term:
    id: GO:0044409
    label: symbiont entry into host
  evidence: IBD
  paint_snapshot: '20240418'
  seeds:
  - id: UniProtKB:Q79FZ9
    label: Mce-family protein Mce1A
    organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
  assessment: TOO_DEEP
  assessment_reason: 'The function, such as it is, is specific to the pathogenic mycobacterial Mce1 clade,
    and the node is broader than that. Two problems. First, the propagation reaches Streptomyces coelicolor:
    six S. coelicolor proteins receive this IBA alongside the 24 M. tuberculosis ones (QuickGO, 2026-10-23).
    S. coelicolor is a soil saprophyte with no host, so entry into a host is not something its MCE proteins
    can do, and a host-interaction term there is simply false. The clade that should not inherit the term
    is the non-pathogenic actinobacterial branch, and more strictly everything outside the Mtb mce1 locus.
    Second, even within M. tuberculosis the evidence is thin and historical: the "mammalian cell entry"
    name comes from a 1993 experiment in which cloned M. tuberculosis DNA conferred on a nonpathogenic
    E. coli strain the ability to invade HeLa cells, and the modern characterization of these proteins
    is as substrate-binding subunits of lipid importers, with host-interaction phenotypes that are plausibly
    downstream of nutrient acquisition rather than of an entry mechanism. Propagating a host-invasion
    process from one such seed across a whole actinobacterial family is exactly the pattern this term
    should not have. affected_subfamilies is left empty because the division is taxonomic (pathogen versus
    saprophyte) and operon-specific (mce1), and PANTHER''s subfamilies are defined by operon position,
    so no subfamily corresponds to the affected set.'
  supported_by:
  - reference_id: PMID:8367727
    supporting_text: tuberculosis have been cloned; these confer on a nonpathogenic Escherichia coli strain
      an ability to invade HeLa cells, augment macrophage phagocytosis, and survive for at least 24 hours
      inside the human macrophage.
  - reference_id: PMID:28708968
    supporting_text: The Mce family of proteins in Mtb were originally associated with mammalian cell
      entry
term_assessments:
- assessed_term:
    id: GO:0005886
    label: plasma membrane
  scope: FAMILY_WIDE
  scope_reason: Every member is anchored in the inner/plasma membrane, whether by an N-terminal helix
    (MlaD), a lipoprotein anchor (the SF15 Lpr proteins) or the equivalent in the other Mce positions.
    Independently supported by IDA on E. coli MlaD and IMP on M. tuberculosis Mce1A, i.e. on both sides
    of the family's functional split.
- assessed_term:
    id: GO:0006869
    label: lipid transport
  scope: FAMILY_WIDE
  scope_reason: The substrate-neutral process accommodates positive phospholipid handling in the Mla clade
    and fatty-acid/cholesterol uptake in characterized mycobacterial Mce systems. It preserves these positive
    lipid roles without requiring a phospholipid-negative judgment or defining a pruning boundary.
- assessed_term:
    id: GO:0005319
    label: lipid carrier activity
  scope: UNRESOLVED
  scope_reason: A lipid carrier must directly bind lipid and deliver it to an acceptor. MlaD binding and
    complex transfer are supported, but individual roles in differentiated Mce heteroassemblies cannot
    all be equated with an autonomous carrier from the shared MCE fold. Preserve positive complex contribution
    and measured binding; universal individual carrier activity is unresolved.
- assessed_term:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  scope: FAMILY_WIDE
  scope_reason: Each member is the substrate-binding subunit of an ABC transporter - MlaD within MlaFEDB,
    the Mce proteins within the Mce1-Mce4 transporters driven by the shared MceG ATPase. Substrate-neutral,
    so no exceptions, and it is the correct replacement for GO:1990531 (defined for P-type flippase complexes,
    hence inapplicable to any member), which the completed E. coli mlaD review modifies to this term.
  supported_by:
  - reference_id: PMID:33236984
    supporting_text: At the center of the complex, a core ABC transporter module is formed from two copies
      each of the MlaF ATPase and the MlaE transmembrane domains (TMDs).
- assessed_term:
    id: GO:0005543
    label: phospholipid binding
  scope: UNRESOLVED
  scope_reason: E. coli MlaD has measured phospholipid binding and participates in lipid handoff through
    the Mla complex. Positive Mce1 fatty-acid and Mce4 cholesterol roles do not by themselves establish
    a secondary phospholipid-negative assay or a loss at the mixed SF4 boundary. GO0120014 describes membrane
    removal, aqueous shielding and delivery; complete activity is assigned at the assembled-system level
    with positive subunit contributions, rather than rejected from an inert enables qualifier. No exclusive
    subfamily grant or substrate-loss boundary is currently warranted.
