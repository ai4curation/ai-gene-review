term_assessments:
  - assessed_term:
      id: GO:0005886
      label: plasma membrane
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member is anchored in the inner/plasma membrane, whether by an N-terminal
      helix (MlaD), a lipoprotein anchor (the SF15 Lpr proteins) or the equivalent in
      the other Mce positions. Independently supported by IDA on E. coli MlaD and IMP on
      M. tuberculosis Mce1A, i.e. on both sides of the family's functional split.
  - assessed_term:
      id: GO:0006869
      label: lipid transport
    scope: FAMILY_WIDE
    scope_reason: >-
      The substrate-neutral process term: phospholipids for the Mla clade, host fatty
      acids and cholesterol for the mycobacterial Mce systems. Not currently asserted by
      PAINT in this family, and it is the term that should remain wherever the
      phospholipid-specific children are pruned.
  - assessed_term:
      id: GO:0005319
      label: lipid carrier activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The substrate-neutral molecular function, and the right family-level counterpart to
      the MCE architecture: binding a lipid and delivering it to an acceptor is what an
      MCE ring does, regardless of the lipid class. Recommended as the replacement for
      GO:0120014 on the mycobacterial members, and as a safer family-root function term
      than the phospholipid-specific one PAINT currently asserts.
  - assessed_term:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    scope: FAMILY_WIDE
    scope_reason: >-
      Each member is the substrate-binding subunit of an ABC transporter - MlaD within
      MlaFEDB, the Mce proteins within the Mce1-Mce4 transporters driven by the shared
      MceG ATPase. Substrate-neutral, so no exceptions, and it is the correct replacement
      for GO:1990531 (defined for P-type flippase complexes, hence inapplicable to any
      member), which the completed E. coli mlaD review modifies to this term.
    supported_by:
      - reference_id: PMID:33236984
        supporting_text: At the center of the complex, a core ABC transporter module is formed from two copies each of the MlaF ATPase and the MlaE transmembrane domains (TMDs).
