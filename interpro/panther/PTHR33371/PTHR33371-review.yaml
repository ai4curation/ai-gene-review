review_status: NEEDS_REVIEW
reviewed_by: AI-assisted family review supporting modules/bacterial_mla_intermembrane_phospholipid_transport.yaml
review_date: "2026-10-24"
notes: >-
  Written to support the Mla module's MlaD part
  (modules/bacterial_mla_intermembrane_phospholipid_transport.yaml), which selects
  PANTHER:PTHR33371:SF4 with the PSEPK exemplar Q88P92. All node ids, asserted terms,
  seeds, taxa and snapshot dates are verbatim from the cached PTHR33371-paint.tsv (one
  assessment per row, five rows); subfamily labels are verbatim from
  interpro/panther/panther.obo; member accessions come from PTHR33371-entries.csv or
  from UniProt cross-reference queries, with each representative member's subfamily read
  from its own UniProt DR PANTHER lines. Propagation counts quoted in the assessments
  were checked in QuickGO on 2026-10-23 (PTN002120837: 153 annotations across three
  terms; PTN002530749: 60 across two).

  This is the most heterogeneous of the three Mla families, and the reason is
  structural: PANTHER's subfamilies are defined by position within the mycobacterial mce
  operon (A, B, C, D, E/lipoprotein, F), so each subfamily contains one position from all
  four operons - fatty-acid, cholesterol and two uncharacterized systems - while the
  canonical MlaD proteins share SF4 with the four Mce*D proteins. There is therefore no
  subfamily whose scope corresponds to "Mla phospholipid system", and that is why the
  phospholipid term assessments carry member exceptions inside their own applicable
  subfamily. A future PAINT curator wanting to fix this properly would place IRDs on the
  actinobacterial Mce clade for GO:0120010 and GO:0120014 and let GO:0006869 or
  GO:0005319 serve those members.

  The GO:0044409 row is the clearest over-propagation found here: a host-invasion process
  reaching the MCE proteins of a non-pathogenic soil bacterium from a single
  M. tuberculosis seed whose own support is a 1993 heterologous invasion assay. It is
  assessed TOO_DEEP on the node, and the term assessment is left UNRESOLVED rather than
  scoped to a subfamily, because whether any member genuinely participates in host entry
  (as opposed to being required for persistence through lipid acquisition) is a question
  the cached literature does not settle.

  No residue_sites: the boundaries here are substrate, compartment and lifestyle, all
  clade properties. The MCE ring's lipid conduit is formed by the hexamer's pore-lining
  loops rather than by a small set of identifiable residues, and no claim in this review
  or the member gene reviews turns on a position.
