  - node_id: PANTHER:PTN002530749
    asserted_term:
      id: GO:0009274
      label: peptidoglycan-based cell wall
    evidence: IBD
    paint_snapshot: "20260529"
    seeds:
      - id: UniProtKB:Q79FZ9
        label: Mce-family protein Mce1A
        organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
    assessment: SOUND
    assessment_reason: >-
      The mycobacterial/actinobacterial node, seeded by the Mce1A IDA to
      peptidoglycan-based cell wall (MTBBASE). The location follows from the
      architecture: the long C-terminal helical projections of mycobacterial MCE proteins
      are predicted to span the cell-wall compartment outward from the plasma-membrane
      anchor, so a cell-wall assignment is the expected complement of the
      plasma-membrane term the same proteins receive from PTN002120837. Propagation is
      confined to the clade that has this structure - 24 M. tuberculosis and 6 S.
      coelicolor proteins, both actinobacteria with peptidoglycan-based cell walls
      (QuickGO, 2026-10-23) - and does not reach the diderm MlaD proteins, for which it
      would be wrong. Accepted as placed; it would become TOO_DEEP if a future release
      moved it up to the bacterial root.
    supported_by:
      - reference_id: PMID:28388411
        supporting_text: of multiple stacked MCE rings (e.g., YebT), or a combination of rings and a hollow, needle-like projection formed by long C-terminal helices (e.g., PqiB, and the MCE proteins from M. tuberculosis and chloroplasts; Figure S7B and S7C)
  - node_id: PANTHER:PTN002530749
    asserted_term:
      id: GO:0044409
      label: symbiont entry into host
    evidence: IBD
    paint_snapshot: "20240418"
    seeds:
      - id: UniProtKB:Q79FZ9
        label: Mce-family protein Mce1A
        organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
    assessment: TOO_DEEP
    assessment_reason: >-
      The function, such as it is, is specific to the pathogenic mycobacterial Mce1
      clade, and the node is broader than that. Two problems. First, the propagation
      reaches Streptomyces coelicolor: six S. coelicolor proteins receive this IBA
      alongside the 24 M. tuberculosis ones (QuickGO, 2026-10-23). S. coelicolor is a
      soil saprophyte with no host, so entry into a host is not something its MCE
      proteins can do, and a host-interaction term there is simply false. The clade that
      should not inherit the term is the non-pathogenic actinobacterial branch, and more
      strictly everything outside the Mtb mce1 locus. Second, even within M.
      tuberculosis the evidence is thin and historical: the "mammalian cell entry" name
      comes from a 1993 experiment in which cloned M. tuberculosis DNA conferred on a
      nonpathogenic E. coli strain the ability to invade HeLa cells, and the modern
      characterization of these proteins is as substrate-binding subunits of lipid
      importers, with host-interaction phenotypes that are plausibly downstream of
      nutrient acquisition rather than of an entry mechanism. Propagating a
      host-invasion process from one such seed across a whole actinobacterial family is
      exactly the pattern this term should not have. affected_subfamilies is left empty
      because the division is taxonomic (pathogen versus saprophyte) and operon-specific
      (mce1), and PANTHER's subfamilies are defined by operon position, so no subfamily
      corresponds to the affected set.
