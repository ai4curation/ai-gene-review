    evidence: IBD
    node_taxon:
      id: NCBITaxon:2
      label: Bacteria
    paint_snapshot: "20240418"
    seeds:
      - id: UniProtKB:P64604
        label: Intermembrane phospholipid transport system binding protein MlaD
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Same node and the same boundary, now on the process side. For MlaD the term is
      correct and experimentally supported (IDA from the MlaFEDB transport work, accepted
      in the E. coli gene review), and it is the term the mlaD and mlaE reviews refine
      their generic GO:0015914 rows into. For the mycobacterial Mce proteins both halves
      of the term fail: the cargo is not a phospholipid, and the route is import across
