        organism: Escherichia coli (strain K12)
      - id: UniProtKB:Q79FZ9
        label: Mce-family protein Mce1A
        organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
    assessment: SOUND
    assessment_reason: >-
      The one row in this family whose seeds straddle the functional split: E. coli MlaD
      (IDA to plasma membrane from two studies, accepted in its gene review) and M.
      tuberculosis Mce1A (IMP to plasma membrane, MTBBASE). Both the Mla and Mce systems
      are anchored in the inner/plasma membrane, from which the MCE ring projects
      outward, so the location is the family's best-conserved property and is correctly
      placed at the bacterial root. Mce1A appearing as a seed and also receiving the
      IBA is the expected pattern for a node whose placement its own experimental
      annotation helped establish, not circularity.
    supported_by:
      - reference_id: PMID:27529189
        supporting_text: Within this complex, MlaD forms an SDS-resistant hexamer via its soluble domain, and we demonstrate that this domain binds PLs.
  - node_id: PANTHER:PTN002120837
    asserted_term:
      id: GO:0120014
      label: phospholipid transfer activity
    evidence: IBD
    node_taxon:
