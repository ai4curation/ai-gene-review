- assessed_term:
    id: GO:0009274
    label: peptidoglycan-based cell wall
  scope: UNRESOLVED
  scope_reason: Retain the existing actinobacterial cell-wall PAINT node unchanged. Its 30 reference leaves
    include the five specialized subfamilies AND six SF4 MceD relatives; excluding all SF4 would contradict
    the node. The mixed SF4 also contains periplasmic MlaD proteins. A full-subfamily grant/exclusion
    cannot express this clade, so universal term scope is unresolved while the supported clade assertion
    remains intact.
- assessed_term:
    id: GO:0044409
    label: symbiont entry into host
  scope: UNRESOLVED
  scope_reason: Deliberately left unresolved rather than granted to a subfamily. The term currently descends
    from PTN002530749 to every actinobacterial member, including six Streptomyces coelicolor proteins,
    where it cannot be true; that part is clear and is recorded as TOO_DEEP on the node. What is not clear
    is whether the term is right for any member. Its only grounding is the 1993 heterologous-expression
    experiment behind the "mammalian cell entry" name plus Mtb-specific infection phenotypes, while the
    proteins' characterized role is substrate binding in lipid importers - so the host-entry phenotype
    may well be a downstream consequence of nutrient acquisition rather than participation in an entry
    process, which is the distinction GO process terms are supposed to respect. Resolving this needs a
    curator with the Mce1A primary literature in hand; until then no subfamily scope is asserted, and
    a gene review for any member should treat the term as unsettled rather than inherited.
  supported_by:
  - reference_id: PMID:8367727
    supporting_text: tuberculosis have been cloned; these confer on a nonpathogenic Escherichia coli strain
      an ability to invade HeLa cells, augment macrophage phagocytosis, and survive for at least 24 hours
      inside the human macrophage.
- assessed_term:
    id: GO:1990531
    label: phospholipid-translocating ATPase complex
  scope: NOT_APPLICABLE
  scope_reason: 'Inapplicable throughout, on the term definition: it denotes a complex functioning as
    a phospholipid-translocating P-Type ATPase (a P4-ATPase flippase complex), whereas MlaFEDB and the
    mycobacterial Mce transporters are ABC systems. E. coli MlaD carries the term by IPI and its completed
    gene review modifies it to GO:0043190, which is the correct term for every member here. PAINT does
    not assert it in this family.'
