- subfamily_id: PANTHER:PTHR33371:SF4
  label: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM BINDING PROTEIN MLAD
  description: 'The subfamily the Mla module uses. It holds the enterobacterial and Haemophilus MlaD proteins,
    the Pseudomonas orthologs, Aquifex aq_493/aq_494 - and the "D" position members of all four mycobacterial
    mce operons (Mce1D, Mce2D, Mce3D, Mce4D) plus Streptomyces SCO2416. So this subfamily is itself functionally
    mixed: scoping a phospholipid term to SF4 would still reach the mycobacterial fatty-acid and cholesterol
    importers, which is why member exceptions are used below. Mce1D (Rv0172) is one of the components
    whose loss reduces fatty-acid import in macrophages.'
