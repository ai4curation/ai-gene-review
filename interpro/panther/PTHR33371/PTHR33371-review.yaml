family_id: PANTHER:PTHR33371
family_name: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM BINDING PROTEIN MLAD-RELATED
preferred_name: 'MCE-domain substrate-binding subunits: E. coli MlaD and the mycobacterial Mce/Lpr proteins
  of the mce1-mce4 lipid importers'
summary: MCE-domain proteins include the MlaD hexameric phospholipid-binding component and the differentiated
  MceA-F proteins of mycobacterial lipid import assemblies. E. coli MlaD binds phospholipids, contacts
  MlaC and caps the MlaE membrane component; the assembled system supports transfer and ATP-dependent
  retrograde bias. Mycobacterial Mce complexes have distinct fatty-acid/cholesterol uptake roles and extended
  envelope-spanning architecture. SF4 contains both MlaD and mycobacterial MceD, so an MCE domain or shared
  subfamily does not identify the Mla substrate or compatible partners. Positive alternate cargo does
  not establish a secondary phospholipid loss.
functional_coherence: HETEROGENEOUS
coherence_reason: The shared MCE architecture links MlaD phospholipid-binding rings with differentiated
  mycobacterial lipid-import assemblies. SF4 contains both MlaD and Mce1D/Mce2D/Mce3D/Mce4D, while other
  subfamilies follow operon positions. Positive alternate cargo and extended cell-wall architecture do
  not show loss of all phospholipid activity or erase membrane anchoring. The separate inherited host-entry
  node judgment is retained outside this bounded Mla-role audit; no new host-entry exclusion is inferred
  here.
