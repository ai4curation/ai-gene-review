  assessment_reason: 'The one row in this family whose seeds straddle the functional split: E. coli MlaD
    (IDA to plasma membrane from two studies, accepted in its gene review) and M. tuberculosis Mce1A (IMP
    to plasma membrane, MTBBASE). Both the Mla and Mce systems are anchored in the inner/plasma membrane,
    from which the MCE ring projects outward, so the location is the family''s best-conserved property
    and is correctly placed at the bacterial root. Mce1A appearing as a seed and also receiving the IBA
    is the expected pattern for a node whose placement its own experimental annotation helped establish,
    not circularity.'
