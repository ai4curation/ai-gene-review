    proteins receive from PTN002120837. Propagation is confined to the clade that has this structure -
    24 M. tuberculosis and 6 S. coelicolor proteins, both actinobacteria with peptidoglycan-based cell
    walls (QuickGO, 2026-10-23) - and does not reach the diderm MlaD proteins, for which it would be wrong.
