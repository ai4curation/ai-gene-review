notes: 2026-11-07 audit targets Mla-specific functional boundaries. Exact original PAINT payloads and
  unrelated plasma-membrane, actinobacterial cell-wall and host-entry node judgments are retained; the
  older host-entry judgment is not independently re-adjudicated in this bounded Mla consultation. Former
  phospholipid-negative exceptions are archived and explicitly withdrawn to uncertainty. Pqi/Let and generic
  MCE architecture are not substitutes for positively qualified MlaD. No causal specificity residues are
  inferred from the alignment.
