        label: Intermembrane phospholipid transport system binding protein MlaD
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Well grounded on its seed and over-extended at the root. E. coli MlaD has an IDA
      to this term and an independent IDA to phospholipid binding: its soluble hexameric
      domain carries endogenous phospholipids and forms part of the transfer pathway, so
      for the Mla clade the term is apt. But the node is bacterial-wide and this family's
      largest contingent by far is the mycobacterial Mce set: 24 M. tuberculosis proteins
      and 6 S. coelicolor proteins receive this IBA (QuickGO, 2026-10-23), covering every
      position of all four mce operons. Those rings carry host fatty acids (Mce1) and
      cholesterol (Mce4), not phospholipids, so the specific substrate claim is wrong for
      them; GO:0005319 lipid carrier activity, or no molecular function at all pending
      evidence, is the honest alternative. The branch needing an IRD is the
      actinobacterial Mce clade. No affected_subfamilies are named because the boundary
      runs through SF4, which contains both MlaD and the mycobacterial Mce*D proteins;
      the two best-evidenced mycobacterial members are recorded as member exceptions
      instead.
    supported_by:
      - reference_id: PMID:36642182
        supporting_text: cholesterol are imported across the Mtb cell wall via the dedicated Mce1 and
      - reference_id: PMID:27529189
        supporting_text: We have demonstrated that MlaD forms homo-hexamers (Figure 2), suggesting a maximum of six PL binding sites within the MlaFEDB complex.
  - node_id: PANTHER:PTN002120837
    asserted_term:
