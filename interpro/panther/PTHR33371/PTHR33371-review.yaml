family_id: PANTHER:PTHR33371
family_name: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM BINDING PROTEIN MLAD-RELATED
preferred_name: >-
  MCE-domain substrate-binding subunits: E. coli MlaD and the mycobacterial Mce/Lpr
  proteins of the mce1-mce4 lipid importers
summary: >-
  Substrate-binding subunits built around the MCE (mammalian cell entry) domain, which
  oligomerizes into a ring that projects from the inner membrane into the periplasm or
  cell-wall compartment and carries lipid through it. The reference member, Escherichia
  coli MlaD, is anchored in the inner membrane by a single N-terminal helix and forms an
  SDS-resistant homohexamer whose soluble domain binds endogenous phospholipids; within
  MlaFEDB it caps the MlaE permease (PTHR30188) and modulates the MlaF ATPase
  (PTHR43023), and cryo-EM shows the lipid pathway running from the MlaE site through
  the MlaD ring into the periplasm. MCE proteins are ubiquitous in double-membraned
  bacteria and in chloroplasts and absent from monoderms. Mycobacteria are the extreme
  case of expansion: each of the four mce operons encodes six MCE proteins (Mce1A-F and
  so on, several of them lipoproteins named LprK/LprL/LprM/LprN), which are thought to
  assemble heterohexameric rings with long needle-like projections spanning the thick
  mycobacterial envelope. Those systems are importers of host-derived apolar lipids -
  Mce1 for fatty acids, Mce4 for cholesterol - energized by a single shared ATPase,
  MceG, and they are virulence determinants: the family name "mammalian cell entry"
  comes from a 1993 experiment in which an M. tuberculosis DNA fragment conferred on
  E. coli the ability to invade HeLa cells. PANTHER splits the family into six
  subfamilies, five of them defined by mycobacterial Mce paralog position within the
  operon. The InterPro slice records 42662 proteins across 9713 proteomes, while the
  fetched entries.csv covers only six reviewed members.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared property is architectural rather than functional: an MCE domain that
  oligomerizes into a lipid-conducting ring attached to an ABC transporter. Beyond
  that, the family lumps at least three functionally distinct groups. (i) MlaD and its
  diderm-bacterial orthologs bind phospholipids and work in outer-membrane lipid
  asymmetry maintenance. (ii) The mycobacterial Mce proteins of SF15-SF19, and the
  mycobacterial members of SF4, are substrate-binding subunits of importers for host
  fatty acids and cholesterol, located in the cell wall rather than at the plasma
  membrane, with roles in host interaction and persistence; phospholipid-specific terms
  do not hold for them. (iii) Within that mycobacterial set, only the Mce1 clade has
  any evidence bearing on host-cell entry, and the actinobacterial relatives in
  Streptomyces coelicolor - a soil saprophyte with no host - inherit host-interaction
  terms they cannot possibly perform. Subfamily boundaries follow operon position, not
  function, so SF4 contains both E. coli MlaD and mycobacterial Mce1D/Mce2D/Mce3D/Mce4D.
