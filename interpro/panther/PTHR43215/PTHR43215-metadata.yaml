  name:
    name: Radial spoke head 1 and chloroplast division regulators
    short: RSH1_Chloroplast_div_reg
  description:
  - text: The Radial spoke head 1 homolog family is involved in the motility of sperm
      and cilia through its role in axonemal radial spoke complexes. The Protein ACCUMULATION
      AND REPLICATION OF CHLOROPLASTS 3, chloroplastic member regulates chloroplast
      division and positioning of the FtsZ ring, acting as a disassembly factor for
      FtsZ2 filaments, thus controlling chloroplast expansion and stromule frequency.
      The Protein TIC 100 member is crucial for protein precursor import into chloroplasts,
      possibly as part of a translocation complex at the inner envelope, and is important
      during embryogenesis and chloroplast biogenesis.
