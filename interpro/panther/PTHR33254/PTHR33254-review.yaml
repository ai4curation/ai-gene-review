family_id: PANTHER:PTHR33254
family_name: 4-HYDROXY-4-METHYL-2-OXOGLUTARATE ALDOLASE 3-RELATED
preferred_name: RraA-like class II (HMG/CHA) aldolases
summary: >-
  RraA-like (Pfam RraA-like) metal-dependent class II aldolases. Characterized members
  cleave 4-hydroxy-4-methyl-2-oxoglutarate (HMG) and/or 4-carboxy-4-hydroxy-2-oxoadipate
  (CHA) to pyruvate plus pyruvate or oxaloacetate, and several also decarboxylate
  oxaloacetate. Subfamily SF16 holds the CHA aldolases of aromatic-acid catabolism:
  Sphingobium sp. SYK-6 LigK (protocatechuate 4,5-cleavage pathway) and Pseudomonas putida
  KT2440 GalC (gallate pathway). Subfamily SF28 holds the Saccharomyces cerevisiae HMG
  aldolase that seeds the family-level PAINT node, and SF29 holds the enterobacterial
  regulator of ribonuclease activity RraA.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The aldolase/oxaloacetate-decarboxylase chemistry is supported experimentally in SF16 and
  by the yeast seed in SF28, but the large SF29 RraA subfamily is annotated for RNase E
  regulation and its catalytic status was not adjudicated here.
