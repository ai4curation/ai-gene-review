notes: >-
  Reviewed for the bacterial gallate catabolism module, where SF16 members perform the
  terminal CHA aldol cleavage. LigK is the reference protein because it is the best
  biochemically characterized SF16 member. SF4 (putative actinobacterial HMG aldolases) and
  SF17 were not adjudicated. PAINT tree topology was not inspected.
