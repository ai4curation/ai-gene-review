family_id: PANTHER:PTHR24082
family_name: NUCLEAR HORMONE RECEPTOR
preferred_name: Nuclear receptor subfamily 1, PPAR slice
summary: >-
  PTHR24082 contains NR1-family nuclear receptors, including thyroid hormone receptors,
  retinoic-acid receptors, liver X receptors, vitamin D receptors, xenobiotic receptors and
  the peroxisome proliferator-activated receptors. This review covers the three human
  PPAR branches: PPARA, PPARD and PPARG. All three PPARs are ligand-activated nuclear
  receptors that heterodimerize with RXR proteins, bind regulatory DNA through the conserved
  nuclear-receptor DNA-binding domain and regulate RNA polymerase II transcription, but their
  preferred ligands, tissues and metabolic outputs differ.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reviewed PPAR branches share RXR-dependent nuclear receptor activity, PPRE DNA binding
  and RNA polymerase II transcriptional regulation. The broader PTHR24082 family is coherent
  only at this high level: other NR1 subfamilies respond to thyroid hormone, retinoic acid,
  vitamin D, bile acids, oxysterols and xenobiotics rather than to peroxisome-proliferator and
  fatty-acid ligands, so PPAR-specific lipid and energy-homeostasis terms are not safe for the
  whole family.
