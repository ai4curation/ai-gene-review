notes: >-
  The node assessment and family-root reading build on the machine-drafted review of this family in
  open PR #5077 (branch cmungall/aigr-agy2-pr3a-panther-10k-19k), which used PhzS as reference protein.
  This review uses KT2440 NicC instead because it has a gene review here and direct biochemical and
  structural evidence, and it adds the subfamily-level finding that the NicC reaction is split across
  SF309 and SF318. Neither NicC protein is a leaf of the cached PANTHER 19.0 tree.
