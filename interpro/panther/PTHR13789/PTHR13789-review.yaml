notes: >-
  Reviewed for modules/bacterial_flavonoid_degradation.yaml. Member counts are
  from the 54 Swiss-Prot entries in PTHR13789-entries.csv, not the full
  InterPro membership. Subfamily SF309, which holds the module members, and
  SF318, which holds the characterized Bordetella NicC, are described; the
  other six subfamilies in the inventory were not assessed individually. The family is the correct PANTHER grounding for FdeE-family
  monooxygenases, but it is far broader than the FdeE orthology group (KEGG
  K26180), which should not be equated with the family or with SF309.
