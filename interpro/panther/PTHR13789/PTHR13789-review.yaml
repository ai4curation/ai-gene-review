family_id: PANTHER:PTHR13789
family_name: MONOOXYGENASE
preferred_name: Class A FAD-dependent aromatic hydroxylases (NicC, HpxO, 3-hydroxybenzoate 6-hydroxylase,
  PhzS and fungal secondary-metabolite monooxygenases)
summary: >-
  Class A flavoprotein monooxygenases of the p-hydroxybenzoate hydroxylase (PHBH) fold. Each member binds
  FAD and uses NAD(P)H and O2 to hydroxylate an aromatic or heteroaromatic substrate. Characterized
  bacterial members include the 6-hydroxynicotinate 3-monooxygenases NicC of aerobic nicotinate
  degradation, which perform an unusual decarboxylative hydroxylation to 2,5-dihydroxypyridine; the
  FAD-dependent urate hydroxylase HpxO; 3-hydroxybenzoate 6-hydroxylases (NagX, MhbM, XlnD, HbzD);
  3-hydroxy-2-methylpyridine-5-carboxylate monooxygenase of vitamin B6 degradation; the
  3-amino-4-hydroxybenzoate 2-monooxygenases of natural-product biosynthesis; 2-heptyl-3-hydroxy-
  4(1H)-quinolone synthase AqdB; and the phenazine hydroxylase PhzS. A large fungal radiation
  hydroxylates polyketide and terpenoid intermediates in secondary metabolism. Monooxygenase activity
  with FAD is family-wide; the substrate varies between and within subfamilies.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  FAD-dependent, NAD(P)H-dependent aromatic monooxygenase chemistry is shared by every characterized
  member, consistent with the single family-root PAINT assertion of monooxygenase activity.
  Substrate specificity does not follow PANTHER subfamilies. The NicC reaction is carried by members of
  two subfamilies: P. putida KT2440 NicC is in SF309, alongside urate hydroxylases, AqdB and fungal
  enzymes, whereas Bordetella bronchiseptica and Pseudomonas fluorescens NicC are in SF318, alongside
  3-hydroxybenzoate 6-hydroxylases and 3-amino-4-hydroxybenzoate 2-monooxygenases. A
  6-hydroxynicotinate-specific term therefore cannot be scoped by subfamily accession.
