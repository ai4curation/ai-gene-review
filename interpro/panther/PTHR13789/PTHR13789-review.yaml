family_id: PANTHER:PTHR13789
family_name: MONOOXYGENASE
preferred_name: Group A FAD-dependent aromatic monooxygenase family
summary: >-
  PTHR13789 groups single-component FAD-dependent (group A flavoprotein)
  monooxygenases that use NAD(P)H and O2 to hydroxylate aromatic and
  heteroaromatic substrates. Characterized members include bacterial
  6-hydroxynicotinate 3-monooxygenase NicC, urate hydroxylase HpxO,
  3-hydroxybenzoate 6-hydroxylases, the phenazine hydroxylase PhzS, the
  flavonoid 8-hydroxylase FdeE (Hsero_1007) of naringenin degradation, and many
  fungal secondary-metabolite monooxygenases. Substrate and regiochemistry vary
  between subfamilies and even within them; the shared function is the
  flavin-dependent monooxygenase reaction class.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Of the 54 reviewed members listed in the family inventory, 51 are named as
  FAD-dependent monooxygenases, hydroxylases or oxidases, and the other three
  are 2-heptyl-3-hydroxy-4(1H)-quinolone synthases, which form the product by
  hydroxylation; all share the FAD-binding fold, so the monooxygenase reaction
  class is shared. Substrate
  specificity is heterogeneous: subfamily SF309 alone contains a flavonoid
  8-hydroxylase, 6-hydroxynicotinate 3-monooxygenase, urate hydroxylase and
  quinolone synthases, so no substrate-specific term can be propagated at the
  family or subfamily level.
