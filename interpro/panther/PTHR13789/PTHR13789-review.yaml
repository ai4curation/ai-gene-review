- assessed_term:
    id: GO:0016709
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular oxygen, NAD(P)H as one donor, and incorporation of one atom of oxygen
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    FdeE (Hsero_1007, SF309) requires NADPH, and NicC (the KT2440 protein
    Q88FY2 in SF309 and the biochemically characterized Bordetella
    bronchiseptica RB50 protein A0A0H3LKL4 in SF318) uses NADH. Both use the
    reduced pyridine nucleotide and O2 to insert one oxygen atom, so the
    reaction class holds in SF309 and SF318 regardless of substrate. The SF318
    PANTHER name ("geranylgeranyl diphosphate reductase") does not describe
    these members. The class is probably shared by the other subfamilies of
    this group A flavoprotein monooxygenase family, but they were not
    adjudicated in this review.
