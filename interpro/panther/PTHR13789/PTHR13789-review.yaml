notes: >-
  Reviewed for modules/bacterial_flavonoid_degradation.yaml. Member counts are
  from the 54 Swiss-Prot entries in PTHR13789-entries.csv, not the full
  InterPro membership. Subfamily SF309, which holds the module members, and
  SF318, which holds the characterized Bordetella NicC, are described; the
  other six subfamilies in the inventory were not assessed individually. The family is the correct PANTHER grounding for FdeE-family
  monooxygenases, but it is far broader than the FdeE orthology group (KEGG
  K26180), which should not be equated with the family or with SF309.
  Merged with the independent review written for modules/aerobic_nicotinate_degradation.yaml
  (PR #5897). That review added the SF268 PhzS seed subfamily, extra SF309/SF318 representatives,
  the family-root tree reading of PTN002492679, NicC FAD evidence and the UNRESOLVED
  6-hydroxynicotinate 3-monooxygenase scope. The flavonoid review's Hsero_1007 reference protein
  and its GO:0016709 SUBFAMILY_ONLY scope over SF309 and SF318 are kept. The two reviews agree:
  the NADH-dependent monooxygenase class is subfamily-wide, while the NicC substrate reaction is
  not. The aerobic nicotinate module asserts no PANTHER id for NicC, so the two scopes do not
  conflict with it.
