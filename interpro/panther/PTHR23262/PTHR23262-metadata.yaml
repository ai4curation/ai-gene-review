  name:
    name: Keratin-associated
    short: KRTAP
  description:
  - text: Keratin-associated proteins (KRTAPs) are critical components of the hair
      cortex. They are embedded in an interfilamentous matrix with hair keratin intermediate
      filaments. KRTAPs play a crucial role in the formation of a rigid and resistant
      hair shaft by facilitating extensive disulfide bond cross-linking with the cysteine
      residues of hair keratins. This cross-linking process contributes to the structural
      integrity and mechanical strength of hair fibers, as KRTAPs are rich in sulfur
      and contain high levels of glycine-tyrosine.
