family_id: PANTHER:PTHR11051
family_name: GLYCOSYL HYDROLASE-RELATED
preferred_name: Glycoside hydrolase family 65 (acid trehalase, maltose phosphorylase)
summary: >-
  GH65 enzymes act on alpha-glucosides. The family contains fungal acid trehalases (S. cerevisiae
  ATH1, vacuolar), animal protein-glucosylgalactosylhydroxylysine glucosidase (PGGHG; both in SF8),
  bacterial maltose and trehalose phosphorylases (SF14), and mycobacterial glycosyltransferases (SF13).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Hydrolysis versus phosphorolysis, and the alpha-glucoside substrate, differ by subfamily. Even
  SF8 mixes acid trehalase with the PGGHG collagen-glycoside glucosidase.
