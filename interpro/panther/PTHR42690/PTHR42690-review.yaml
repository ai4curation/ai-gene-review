    putida Q88MU7), fungal THR4 (S. cerevisiae P16120, S. pombe Q42598) and the vertebrate THNSL2
    proteins (human Q86YJ6, mouse Q80W22) are all assigned here. The vertebrate THNSL2 members
    (PTN000816888) are the functionally divergent group and are handled as member exceptions in
    the term assessments.
