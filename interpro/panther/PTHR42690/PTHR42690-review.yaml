family_id: PANTHER:PTHR42690
family_name: THREONINE SYNTHASE FAMILY MEMBER
preferred_name: ThrC/THR4-type threonine synthases and vertebrate THNSL2 phospho-lyases
summary: >-
  Fold-type II pyridoxal 5'-phosphate (PLP) enzymes related to threonine synthase. Bacterial ThrC
  (E. coli thrC) and fungal THR4 (S. cerevisiae THR4, S. pombe thrc) catalyse the last step of
  L-threonine biosynthesis, the PLP-dependent gamma-elimination of phosphate from
  O-phospho-L-homoserine followed by beta-addition of water. The family also contains the
  vertebrate threonine synthase-like 2 proteins (THNSL2). Vertebrates do not make threonine, and
  recombinant mouse THNSL2 binds PLP and O-phospho-homoserine but does not make L-threonine; it
  instead acts as a phospho-lyase that degrades O-phospho-threonine and O-phospho-homoserine to
  2-oxobutanoate, ammonia and phosphate. Plant threonine synthases (Arabidopsis TS1/MTO2) are
  classified in a different PANTHER family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  PLP binding and the fold-type II scaffold are shared by all members. Threonine synthase activity
  and threonine biosynthesis hold for the bacterial ThrC and fungal THR4 members but not for the
  vertebrate THNSL2 clade (PTN000816888), which lost the biosynthetic reaction when metazoa lost
  the threonine pathway and retained a catabolic phospho-lyase activity. PANTHER defines a single
  subfamily, SF1, whose official name (THREONINE SYNTHASE-LIKE 2) is taken from the vertebrate
  paralog, so the subfamily label cannot separate the two functions; the PTN node can.
