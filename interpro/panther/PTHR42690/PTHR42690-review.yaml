term_assessments:
- assessed_term:
    id: GO:0004795
    label: threonine synthase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Safe for the bacterial ThrC and fungal THR4 members, which make up most of the family and all
    of the members the aspartate-family threonine module uses (THR4, S. pombe thrc, E. coli
    thrC). Because PANTHER has one subfamily (SF1) for the whole family, scope cannot be set by
    subfamily. The vertebrate THNSL2 proteins are the exception: they belong to the same SF1 but
    do not make threonine, and PAINT already records the loss at PTN000816888.
  member_exceptions:
  - member:
      id: UniProtKB:Q86YJ6
      label: Threonine synthase-like 2
      gene_symbol: THNSL2
      organism: Homo sapiens
    exception_reason: >-
      Vertebrate THNSL2 ortholog. The mouse ortholog binds PLP and O-phospho-homoserine but does
      not synthesize threonine; it degrades phosphorylated substrates as a phospho-lyase. PAINT
      gives human THNSL2 a NOT annotation for this term from PTN000816888.
    lost_in_clade_node_id: PANTHER:PTN000816888
    supported_by:
    - reference_id: PMID:17034760
      supporting_text: Recombinant mTSH2 contained bound pyridoxal-5'-phosphate (PLP), but did not
        synthesize l-Thr.
  - member:
      id: UniProtKB:Q80W22
      label: Threonine synthase-like 2
      gene_symbol: Thnsl2
      organism: Mus musculus
    exception_reason: >-
      The characterized mouse threonine synthase homolog 2 (mTSH2) itself: no threonine synthesis,
      catabolic phospho-lyase activity on O-phospho-threonine and O-phospho-homoserine.
    lost_in_clade_node_id: PANTHER:PTN000816888
    supported_by:
    - reference_id: PMID:17034760
      supporting_text: mTSH2 also degraded O-phospho-threonine (PThr) to alpha-ketobutyrate, showing
        that it can act as a catabolic phospho-lyase on both gamma- and beta-phosphorylated substrates.
  supported_by:
  - reference_id: PMID:8082795
    supporting_text: we have determined that this activity depends on the presence in the cell of
      an active form of the THR4 gene
  - reference_id: PMID:11756443
    supporting_text: Threonine synthase catalyzes the final step of threonine biosynthesis, the pyridoxal
      5'-phosphate (PLP)-dependent conversion of O-phosphohomoserine into threonine and inorganic
      phosphate.
