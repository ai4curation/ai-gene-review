  - id: SGD:S000000649
    label: THR4
    organism: Saccharomyces cerevisiae
  assessment: SOUND
  assessment_reason: >-
    The node sits above both the fungal THR4 clade and the vertebrate THNSL2 clade, and the loss
    in vertebrates is already recorded by PAINT as an IKR (NOT threonine synthase activity) at
    PTN000816888, so human THNSL2 receives a NOT annotation rather than the activity. In the
    PAINT UniProt GAF the positive IBA reaches only fungal members (S. cerevisiae THR4, S. pombe
    thrc, Eremothecium THR4). The bacterial ThrC enzymes, including E. coli thrC, lie outside this
    node in the PANTHER 19 tree and receive no IBA for the activity, so the placement is narrower
    than the biology but not wrong. The THR4 gene review accepts the IBA.
  supported_by:
