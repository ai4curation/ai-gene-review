notes: >-
  Used by modules/aspartate_family_threonine_biosynthesis.yaml (threonine synthase step,
  ThrC-type variant) with the selector PANTHER:PTHR42690:SF1 and GO:0004795. Because SF1 is the
  only subfamily, that selector also captures the vertebrate THNSL2 proteins, which are not
  threonine synthases; a strictly correct selector would need the fungal/bacterial nodes or an
  explicit exclusion of THNSL2. Topology checked with the PANTHER 19 treeinfo service filtered to
  model organisms: the Opisthokont node PTN000034282 joins the vertebrate THNSL2 clade
  (Euteleostomi) and the Ascomycota THR4 clade; Gammaproteobacterial thrC (E. coli, H.
  influenzae) branches outside it. IBA recipients were read from the PAINT UniProt GAF. Human
  THNSL2 isoform SOFAT has a reported role in inducing osteoblastic IL6 production; that
  isoform-specific function is not assessed here.
