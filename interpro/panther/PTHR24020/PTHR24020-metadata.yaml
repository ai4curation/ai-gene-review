  name:
    name: Extracellular Matrix Assembly and Organization
    short: ECM_Assembly_Org
  description:
  - text: The protein family is involved in the structural integrity and organization
      of extracellular matrices in various tissues. Members of this family are major
      components of cartilage extracellular matrix and are involved in matrix assembly,
      promoting cell adhesion and playing roles in the formation of filamentous networks.
      Some proteins within the family interact with collagen, integrating collagen
      bundles and contributing to cell-binding. Others are involved in the organization
      of skeletal muscles and the formation of neuromuscular junctions. Additionally,
      certain members have roles in hemostasis, acting as molecular bridges in platelet
      adhesion or as chaperones for coagulation factors. The family also includes
      proteins that regulate cell shape and motility, as well as the proliferation
      and differentiation of neural stem cells, indicating a broader significance
      in tissue development and maintenance.
