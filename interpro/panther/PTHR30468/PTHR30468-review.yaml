family_id: PANTHER:PTHR30468
family_name: ALPHA-KETOGLUTARATE-DEPENDENT SULFONATE DIOXYGENASE
preferred_name: TauD/TfdA-like Fe(II)/2-oxoglutarate-dependent dioxygenases
summary: >-
  Soluble non-heme Fe(II) enzymes of the TauD/TfdA fold that couple oxidative
  decarboxylation of 2-oxoglutarate to oxidation of a primary substrate. The
  characterized members split by substrate. Bacterial TauD (E. coli,
  P. putida KT2440) cleaves taurine to sulfite and aminoacetaldehyde for sulfur
  scavenging. Yeast JLP1 and its S. pombe relative desulfonate other
  sulfonates, with taurine a poor substrate. RdpA from Delftia and Sphingobium
  cleaves the ether bond of (R)-phenoxypropionate herbicides. AtsK-type
  enzymes and Rv3406 cleave alkyl sulfate esters. Several fungal members
  (cnsP, cnsM, oryG, btcD, esdpJ) are tailoring enzymes of secondary-metabolite
  gene clusters. The 2-oxoglutarate-dependent dioxygenase chemistry and the
  cytoplasmic location are family-wide; taurine dioxygenase activity belongs
  only to the bacterial TauD clade inside SF1.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared fold, Fe(II) cofactor and 2-oxoglutarate co-substrate make the
  general dioxygenase activity safe across the family, but the primary
  substrate differs between and within subfamilies (taurine, other sulfonates,
  aryloxyalkanoate ethers, alkyl sulfate esters, polyketide and terpenoid
  intermediates). SF1 itself mixes taurine dioxygenases with RdpA, JLP1 and
  communesin-cluster enzymes, so substrate-specific terms must be scoped below
  the subfamily level.
