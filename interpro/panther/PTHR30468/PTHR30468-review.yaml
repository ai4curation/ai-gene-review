notes: >-
  Reviewed while completing the bacterial taurine uptake and desulfonation
  module (modules/taurine_uptake_and_desulfonation.yaml), which grounds the TauD
  role to SF1 and to PAINT node PTN000765929. SF1 composition (seven members:
  P37610, Q88RA3, P83310, Q8KSC8, Q12358, A0A0A2IJP3, A0A0A2J5V5) and the other
  subfamilies come from a csv parse of PTHR30468-entries.csv (16 members:
  SF1 7, SF5 5, SF10 3, SF31 1). Because SF1 is mixed, the module pairs the SF1
  family term with a required taurine dioxygenase function and with the
  PTN000765929 ancestral node rather than claiming the activity for the whole
  subfamily. Node reach was read from current QuickGO annotations of the non-TauD
  members (2026-11-11): none carries GO:0000908. The UniProt records quoted by
  url were fetched on the same date.
