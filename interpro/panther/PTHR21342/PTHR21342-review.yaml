  description: >-
    Bacterial CoaD (PPAT). It includes E. coli CoaD (P0A6I6), the PAINT seed proteins of H. pylori
    (O26010), M. tuberculosis (P9WPA5) and S. pneumoniae (Q8DNE6), and P. putida KT2440 CoaD (Q88CQ7).
    The coenzyme_a_biosynthesis module uses this subfamily as the selector for the standalone
    bacterial PPAT.
  representative_members:
