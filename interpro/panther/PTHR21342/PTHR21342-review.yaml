- subfamily_id: PANTHER:PTHR21342:SF0
  label: BIFUNCTIONAL NMN ADENYLYLTRANSFERASE_NUDIX HYDROLASE
  description: >-
    Mostly archaeal nicotinamide-nucleotide adenylyltransferases (NadM). One is the characterized
    Methanocaldococcus jannaschii MJ0541 (Q57961). The subfamily also holds bacterial bifunctional
    NadM-Nudix proteins (Synechocystis slr0787, Q55928; Acinetobacter baylyi NadM, Q6F999), a
    phosphonoformate cytidylyltransferase (Q5IW36) and uncharacterized archaeal proteins. These are
    NAD+ biosynthetic enzymes and play no part in CoA synthesis.
