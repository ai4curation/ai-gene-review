family_id: PANTHER:PTHR21342
family_name: PHOSPHOPANTETHEINE ADENYLYLTRANSFERASE
preferred_name: Bacterial phosphopantetheine adenylyltransferase (CoaD) and archaeal-type NMN adenylyltransferase
summary: >-
  PTHR21342 groups nucleotidylyltransferases (HIGH-motif superfamily) with two functions. SF1 is the
  bacterial phosphopantetheine adenylyltransferase CoaD (PPAT). It reversibly adenylylates
  4'-phosphopantetheine with ATP to give 3'-dephospho-CoA and pyrophosphate, the penultimate step of
  CoA synthesis. E. coli CoaD is the characterized example: a homohexamer feedback-inhibited by CoA.
  SF0 is a different enzyme. It is chiefly archaeal nicotinamide-nucleotide adenylyltransferase (NadM),
  which makes NAD+ from NMN and ATP, with bacterial bifunctional NadM-Nudix proteins, a phosphonoformate
  cytidylyltransferase, and uncharacterized archaeal proteins. PPAT activity is therefore a subfamily
  property and not a family-wide one. Eukaryotes do not use this family for PPAT: their PPAT is the
  COASY/Cab4 domain in PTHR10695.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The parsed entries file holds 707 entries: 659 in SF1, all named phosphopantetheine
  adenylyltransferase, and 48 in SF0 (BIFUNCTIONAL NMN ADENYLYLTRANSFERASE_NUDIX HYDROLASE). Of the
  SF0 entries, 40 are named nicotinamide-nucleotide adenylyltransferase; the rest include NMN
  adenylyltransferase/Nudix hydrolase, nicotinate-nucleotide adenylyltransferase, phosphonoformate
  cytidylyltransferase and uncharacterized proteins. The two subfamilies share the adenylyltransferase
  fold but act on different substrates.
