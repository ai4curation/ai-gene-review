notes: >-
  Used by modules/bacterial_type_ii_secretion.yaml for the GspE secretion-ATPase annoton, with
  P. aeruginosa XcpR (Q00512), P. putida KT2440 GspE (Q88P06) and Klebsiella PulE (P15645) as
  exemplars; the module grounds that annoton on an InterPro GspE domain entry rather than on this
  PANTHER family, because PTHR30258 mixes the secretion ATPases with the type IV pilus and
  competence ATPases. The subfamily names in this family are unusually misleading: the T2SS
  secretion ATPases sit in a subfamily named after a bacteriophage adsorption protein, and the
  ComGA subfamily contains genuine T2SS ATPases, so membership was read from the member table
  rather than from the labels. The PTN002016240 IBD seeds are the PseudoCAP XcpR rows whose
  evidence-code defects are recorded in genes/PSEAE/xcpR/xcpR-ai-review.yaml.
