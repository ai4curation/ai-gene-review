family_id: PANTHER:PTHR30258
family_name: TYPE II SECRETION SYSTEM PROTEIN GSPE-RELATED
preferred_name: GspE/PilB-type secretion and pilus assembly ATPases
summary: >-
  Walker-motif traffic ATPases that energise the assembly of prepilin-type filaments. All members
  are cytoplasmic proteins recruited to the inner-membrane face of a filament-assembly machine,
  where they oligomerise and hydrolyse ATP. The family covers the secretion ATPases of type II
  secretion systems (SF27: P. aeruginosa XcpR, Klebsiella PulE, Vibrio EpsE, Dickeya OutE,
  Aeromonas ExeE, E. coli GspE), the assembly ATPases of type IV pilus systems (SF1: P. aeruginosa
  PilB, Neisseria PilF, Haemophilus and E. coli HofB, Vibrio TcpT, and the bacteriophage-adsorption
  protein NfrB), and the ComGA-type ATPases of competence systems and of second-tier secretion loci
  such as Xanthomonas XpsE and the Pseudomonas Hxc system (SF2). PAINT keeps the generic ATPase and
  membrane terms at a family-wide node and the T2SS-specific terms at a gammaproteobacterial
  subnode.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  ATP hydrolysis and inner-membrane recruitment are shared, but the machines are different: SF27
  powers exoprotein secretion through a secretin, SF1 powers extension of a surface pilus, and SF2
  powers competence pili or lineage-specific secretion systems. The T2SS complex and process terms
  must stay on the GspE clade.
