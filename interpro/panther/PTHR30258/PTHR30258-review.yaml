- subfamily_id: PANTHER:PTHR30258:SF1
  label: PROTEIN TRANSPORT PROTEIN HOFB HOMOLOG
  description: >-
    Type IV pilus assembly ATPases and relatives: P. aeruginosa PilB, Neisseria PilF, E. coli and
    Haemophilus HofB, Aeromonas TapB, Vibrio cholerae TcpT, and E. coli NfrB.
  representative_members:
  - id: UniProtKB:P22608
    label: Type IV pilus assembly ATPase PilB
  - id: UniProtKB:P0AFA5
    label: Bacteriophage adsorption protein B
  diverged_from_family: true
  divergence_description: >-
    These ATPases drive extension of a cell-surface type IV pilus, not secretion through a
    secretin. Their localisation requirements differ too: polar targeting of PilB depends on the
    pilus platform protein PilC, whereas XcpR depends on the T2SS platform protein XcpY. Mutating
    the ATP-binding site of PilB abolishes pilus biogenesis while the equivalent XcpR mutation
    abolishes secretion, which is exactly the functional split between the subfamilies.
  supported_by:
  - reference_id: PMID:8102361
    supporting_text: These studies show that the putative ATP-binding sites of XcpR and PilB are
      essential for their functions in protein secretion and assembly of pili, respectively.
  - reference_id: PMID:15659660
    supporting_text: YFP-PilB exhibited diffuse cytoplasmic localization in a pilC mutant,
      suggesting that PilC is required for polar localization of PilB
- subfamily_id: PANTHER:PTHR30258:SF2
  label: COMG OPERON PROTEIN 1
  description: >-
    ComGA-type ATPases of monoderm competence systems (Bacillus subtilis, Streptococcus
    pneumoniae, Halalkalibacterium halodurans) together with the ATPases of lineage-specific
    secretion loci, Xanthomonas XpsE and the Pseudomonas second T2SS ATPase HxcR.
  representative_members:
  - id: UniProtKB:P25953
    label: Competence protein ComGA
  - id: UniProtKB:Q9I5N9
    label: Type II secretion system protein HxcR
  diverged_from_family: true
  divergence_description: >-
    The competence members power DNA-uptake pili in bacteria without an outer membrane, so no
    secretin and no T2SS complex exists for them to join; the subfamily nevertheless also contains
    genuine T2SS ATPases (XpsE, HxcR), so the subfamily label alone does not decide the question and
    membership must be read per protein.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30258/PTHR30258-entries.csv
    supporting_text: P25953,Competence protein ComGA
