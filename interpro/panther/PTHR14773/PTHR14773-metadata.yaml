  name:
    name: WD repeat-containing DNA damage-binding protein
    short: WD_repeat_DNA-damage-binding
  description:
  - text: This family of proteins includes members that are involved in DNA-binding
      and recognition of specific DNA modifications. They are known to bind to both
      single- and double-stranded DNA, with a preference for UV-damaged DNA, suggesting
      a role in DNA repair and maintenance. Some family members have been identified
      as specific readers of the modified DNA base 5-hydroxymethylcytosine (5hmC),
      which is important in epigenetic regulation. The presence of WD repeats indicates
      a potential role in protein-protein interactions, which may be crucial for their
      function in DNA-metabolic processes.
