family_id: PANTHER:PTHR14773
family_name: WD REPEAT-CONTAINING PROTEIN 76
preferred_name: DRS1-related WD-repeat DNA-associated proteins
summary: WDR76/CMR1-related WD40 proteins have experimentally supported nuclear/chromatin associations
  in characterized homologs. Arabidopsis DRS1 has direct drought and ABA-dependent leaf-water-loss phenotypes,
  while its biochemical connection to chromatin remains unresolved. Broad DNA/chromatin association must
  be distinguished from a particular modified-base-reader mechanism.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Human WDR76 colocalizes with heterochromatin proteins and responds rapidly to DNA damage,
  whereas two Arabidopsis drs1 alleles establish a physiological drought/ABA role. This supports related
  nuclear interaction biology without assigning the same modified-DNA specificity, checkpoint regulation
  or ligase substrates to every member. Sensitive Arabidopsis chemical assays constrain genomic 5hmC abundance,
  so an animal-like 5hmC reader is not a safe family-wide default.
subfamilies:
- subfamily_id: PANTHER:PTHR14773:SF0
  label: WD REPEAT-CONTAINING PROTEIN 76
  description: The available family description is unchecked LLM-generated text and the decisive Arabidopsis
    functional statement has ARBA provenance. Direct evidence distinguishing damaged-DNA recognition,
    ordinary DNA binding and 5hmC recognition is needed before a coherent family activity can be assigned.
    The WD-repeat architecture alone does not resolve that question.
