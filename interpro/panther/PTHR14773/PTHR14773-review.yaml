notes: The selected plant record is Q9SAI7/AT1G80710. The emitted 5hmC donor Q4KLQ5 is Xenopus Wdr76 with
  an inferred function comment. The primary AraNet study explicitly identifies DRS1 and tests its mutants;
  its experiments, rather than the underlying network prediction, establish the plant phenotype. Trace
  modified-base binding in vitro remains a different hypothesis from a physiological genomic-DNA reader.
  No unsupported PAINT node placement or substrate-receptor specificity is asserted.
