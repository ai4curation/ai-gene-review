  assessment: SOUND
  assessment_reason: Root-level assertion for the seven-beta-strand protein methyltransferases of this
    family, seeded by characterised lysine, histidine and arginine protein methyltransferases from human,
    mouse and budding yeast. SAM-dependent protein methylation is the shared activity of the N-terminal
    methyltransferase domain; S. pombe rib2 keeps the inherited row as non-core because its own substrate
    is unknown.
