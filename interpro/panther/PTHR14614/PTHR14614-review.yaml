notes: 'Written during riboflavin_biosynthesis module curation because S. pombe rib2, the fungal riboflavin
  deaminase, is classified in this family. The module does not ground the deaminase activity on this family:
  the deaminase belongs to rib2''s fused C-terminal domain. Nodes seeded only by animal and budding-yeast
  enzymes are left UNRESOLVED with the missing evidence named.'
