family_id: PANTHER:PTHR14614
family_name: HEPATOCELLULAR CARCINOMA-ASSOCIATED ANTIGEN
preferred_name: Hepatocellular Carcinoma-Associated Antigen
summary: HEPATOCELLULAR CARCINOMA-ASSOCIATED ANTIGEN (PANTHER:PTHR14614) is characterized in PANTHER PAINT
  across 10 ancestral PTN node(s) (PANTHER:PTN000378681, PANTHER:PTN000378682, PANTHER:PTN000378684, PANTHER:PTN000378734
  (+6 more)) with 14 IBD node assertion(s) and 0 term(s) carrying negated IRD/IKR branch blocks, covering
  protein methyltransferase activity (GO:0008276, MF), nucleus (GO:0005634, CC), cytoplasm (GO:0005737,
  CC), histone H3R17 methyltransferase activity (GO:0035642, MF) and 6 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR14614 (HEPATOCELLULAR CARCINOMA-ASSOCIATED ANTIGEN)
  span 10 distinct ancestral PTN nodes (PANTHER:PTN000378681, PANTHER:PTN000378682, PANTHER:PTN000378684,
  PANTHER:PTN000378734, PANTHER:PTN000473396 (+5 more)) with different molecular function assignments
  across clades (protein methyltransferase activity (GO:0008276), histone H3R17 methyltransferase activity
  (GO:0035642), protein-L-histidine N-tele-methyltransferase activity (GO:0018064), protein-lysine N-methyltransferase
  activity (GO:0016279)), indicating clade-level functional specialization across the family.
