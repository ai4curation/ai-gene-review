family_id: PANTHER:PTHR14614
family_name: HEPATOCELLULAR CARCINOMA-ASSOCIATED ANTIGEN
preferred_name: METTL21/EFM-type seven-beta-strand protein methyltransferase family
summary: 'SAM-dependent seven-beta-strand methyltransferases that methylate proteins: lysine methyltransferases
  of translation factors and chaperones (METTL21A, EEF1AKMT3, EEF2KMT, VCPKMT, yeast EFM2/EFM3/EFM7),
  histidine methyltransferases of ribosomal protein L3 (yeast HPM1, human METTL18) and the histone-arginine
  methyltransferase METTL23. In fission yeast the methyltransferase domain is fused to a C-terminal riboflavin-pathway
  pyrimidine deaminase domain (rib2, SF132).'
functional_coherence: HETEROGENEOUS
coherence_reason: Members share the protein methyltransferase fold and chemistry but differ in target
  residue (lysine, histidine, arginine) and substrate protein, which are subfamily-specific; S. pombe
  rib2 additionally carries a fused cytidine deaminase-family domain that supplies a riboflavin biosynthesis
  step absent from every other member.
reference_protein:
  id: UniProtKB:P87241
  label: Bifunctional protein rib2
  gene_symbol: rib2
  organism: Schizosaccharomyces pombe
  gene_review: genes/SCHPO/rib2/rib2-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR14614:SF132
  label: PROTEIN-LYSINE METHYLTRANSFERASE C42C1.13
  description: Fungal members with a C-terminal fusion. S. pombe rib2 (SPCC4G3.16) has an N-terminal protein-lysine
    methyltransferase domain (substrate unknown) and a C-terminal CMP/dCMP deaminase-family domain that
    carries the riboflavin-pathway DRAP deaminase step. The deaminase is a property of the fused domain
    only and is not inherited by the family.
  representative_members:
