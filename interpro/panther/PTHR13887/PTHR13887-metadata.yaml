  name:
    name: ClpXP adapter protein SpxH
    short: ClpXP_adapter_SpxH
  description:
  - text: The SpxH family comprises adapter proteins that facilitate the degradation
      of the Spx protein by the ClpXP protease complex under non-stress conditions.
      Members of this family interact with Spx, which not only stabilizes the Spx
      protein but also exposes its C-terminus for recognition and subsequent proteolysis
      by ClpXP. The family is characterized by a histidine-rich N terminus essential
      for Spx interaction and may contain a DsbA-like thioredoxin domain. Some members
      are known to bind zinc ions and may have a domain resembling the winged helix-turn-helix
      fold. The activity of these adapter proteins can be regulated by stress conditions,
      leading to their aggregation and inhibition, which results in the stabilization
      of Spx. Additionally, they are specific to Spx and do not enhance proteolysis
      by other proteases such as ClpCP.
