notes: Official family/subfamily labels follow the pinned PANTHER OBO. Member classifications and actual
  PAINT descendant scope are recorded in interpro/panther/PTHR13887/PTHR13887-source-analysis/scope-evidence.md.
  UNRESOLVED scope is an evidence boundary, not a negative enzymatic assertion. No residue losses or PTN
  nodes were invented. The InterPro metadata display name has drifted to ClpXP adapter protein SpxH; raw
  metadata is preserved.
