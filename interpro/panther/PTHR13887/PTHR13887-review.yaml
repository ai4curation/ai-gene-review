family_id: PANTHER:PTHR13887
family_name: GLUTATHIONE S-TRANSFERASE KAPPA
preferred_name: DsbA-like, thioredoxin-like and GST-kappa-related proteins
summary: This heterogeneous family includes membrane-associated Bacillus BdbD, other DsbA-like oxidoreductases,
  thioredoxin-like reductases, GST-kappa-related proteins and SpxH adaptor proteins. BdbD directly oxidizes
  a protein-derived dithiol peptide, whereas PA14 DsbA2 is a distinct highly oxidizing protein in the
  Rv2466c-labelled subfamily. Neither the GST-kappa family label nor an individual DsbA-like representative
  defines the chemistry of the entire family.
functional_coherence: HETEROGENEOUS
coherence_reason: The current reviewed entries contain BdbD, Rv2466c and SpxH; the PAINT tree additionally
  samples multiple eukaryotic and archaeal groups. Even SF14 is broader than the experimentally characterized
  bacterial BdbD set, and SF56 includes both PA14 DsbA2 and thioredoxin-like reductases.
reference_protein: &id001
  id: UniProtKB:O32218
  gene_symbol: bdbD
  organism: Bacillus subtilis 168
  gene_review: genes/BACSU/bdbD/bdbD-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR13887:SF14
  label: DISULFIDE BOND FORMATION PROTEIN D
  description: Contains BdbD and other DsbA-like proteins, but also archaeal/eukaryotic sampled leaves;
    no entire-subfamily oxidative-folding grant follows from BdbD alone.
  representative_members:
  - *id001
  - id: UniProtKB:O33272
    gene_symbol: dsbA
    organism: Mycobacterium tuberculosis H37Rv
- subfamily_id: PANTHER:PTHR13887:SF56
  label: THIOREDOXIN-LIKE REDUCTASE RV2466C
  description: Functionally diverse thioredoxin-like proteins. PA14 DsbA2 membership is real despite the
    Rv2466c label; do not transfer its substrate or donor specificity to Rv2466c.
  representative_members:
  - id: UniProtKB:A0A0H2ZG77
    gene_symbol: PA14_59960
    organism: Pseudomonas aeruginosa PA14
    gene_review: genes/PSEAB/PA14_59960/PA14_59960-ai-review.yaml
  - id: UniProtKB:O53193
    gene_symbol: Rv2466c
    organism: Mycobacterium tuberculosis H37Rv
- subfamily_id: PANTHER:PTHR13887:SF47
  label: CLPXP ADAPTER PROTEIN SPXH
  description: SpxH adaptor proteins in the current reviewed member catalog. Their presence prevents interpreting
    the family label as an enzyme-wide guarantee.
  representative_members:
  - id: UniProtKB:O31606
    gene_symbol: spxH
    organism: Bacillus subtilis 168
term_assessments:
- assessed_term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  scope: UNRESOLVED
  scope_reason: Direct BdbD peptide oxidation and PA14 DsbA2 biochemistry support these individual members.
    They do not establish protein-disulfide activity for every SF14 or SF56 descendant, much less the
    mixed family. The reversible GO reaction can represent oxidative direction where supported; no evolutionary
    loss or blanket absence is inferred.
  supported_by:
  - &id002
    reference_id: PMID:19535335
    supporting_text: These experiments clearly demonstrate that oxidized sBdbD is able to transfer its
      disulfide bond to the apo-cytochrome c550 active site mimic peptide.
  - reference_id: PMID:24327342
    supporting_text: PaDsbA2 is able to catalyze insulin reduction, although less efficiently than EcDsbA
      and PaDsbA1.
- assessed_term:
    id: GO:0006457
    label: protein folding
  scope: UNRESOLVED
  scope_reason: BdbD and selected DsbA-like members participate in exported substrate oxidative folding.
    Their roles do not license the same process for GST-kappa, SpxH or uncharacterized archaeal/eukaryotic
    entries.
  supported_by:
  - *id002
- assessed_term:
    id: GO:0003756
    label: protein disulfide isomerase activity
  scope: UNRESOLVED
  scope_reason: Protein oxidation, a thioredoxin-like fold and the label ISOMERASE on another subfamily
    do not demonstrate rearrangement of mispaired protein disulfides. No family-wide isomerase judgment
    is supported, and this is not a universal negative assertion.
  supported_by:
  - *id002
review_status: COMPLETE
reviewed_by: codex
review_date: '2026-11-06'
references:
