review_status: COMPLETE
reviewed_by: codex
review_date: '2026-09-10'
notes: This family is gene-context support for A0A140LHW5, which has no exact-record PANTHER assignment.
  The 74-residue product retains the first 66 residues of Q9CYN2 and lacks both canonical transmembrane
  helices. Any noncatalytic interaction role of the peptide remains untested. The family-wide complex
  role is limited to intact SPCS2/Spc2 proteins and does not assert peptidase activity.
