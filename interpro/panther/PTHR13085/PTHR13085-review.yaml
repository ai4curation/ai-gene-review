family_id: PANTHER:PTHR13085
family_name: MICROSOMAL SIGNAL PEPTIDASE 25 KDA SUBUNIT
preferred_name: SPCS2/Spc2 signal peptidase accessory subunits
summary: SPCS2/Spc2 proteins are membrane-associated accessory components of the eukaryotic signal peptidase
  complex. They promote complex activity and coordination with protein translocation, while SEC11-related
  subunits supply signal-peptide cleavage catalysis.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Human substrate-bound signal-peptidase structures distinguish accessory SPCS2 from catalytic
  SEC11A/SEC11C. The conserved family role is complex participation rather than autonomous proteolysis.
  The short mouse benchmark sequence is only an N-terminal segment and lacks the canonical membrane helices,
  so same-gene identity does not establish its incorporation into the complex.
subfamilies:
- subfamily_id: PANTHER:PTHR13085:SF0
  label: SIGNAL PEPTIDASE COMPLEX SUBUNIT 2
  description: Mouse canonical Spcs2 is placed here. The short benchmark record has a verified same-gene
    relationship but no exact-record PANTHER assignment.
  representative_members:
  - id: UniProtKB:Q9CYN2
    gene_symbol: Spcs2
    organism: Mus musculus
term_assessments:
- assessed_term:
    id: GO:0005787
    label: signal peptidase complex
  scope: FAMILY_WIDE
  scope_reason: Membership in the eukaryotic signal peptidase complex is the conserved family role for
    intact SPCS2/Spc2 proteins. This complex-membership grant does not assert intrinsic peptidase activity
    and cannot establish that the short benchmark product is incorporated.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR13085-evidence.md
    supporting_text: Spc2 has been shown to enhance the enzymatic activity of the SPC and facilitate the
      interactions between different components of the translocation site [[cite:PUB00094331]].
  - reference_id: PMID:42173868
    supporting_text: the catalytic SPC subunit (paralog Sec11A or Sec11C, respectively) is joined by SPCS1
      (also known as SPC12), SPCS2 (SPC25), and SPCS3 (SPC22/23).
