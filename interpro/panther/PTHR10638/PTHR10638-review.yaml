  assessment_reason: >-
    This IRD NOT sits on the eutherian AOC3 clade (21 leaves; human, mouse and rat AOC3 and their
    orthologues in PTHR10638:SF23 MEMBRANE PRIMARY AMINE OXIDASE, plus a few unnamed great-ape
    SF94 sequences) and blocks the GO:0008131 IBD placed at PTN000067313. AOC3 is VAP-1, the
    semicarbazide-sensitive amine oxidase (SSAO), one of the best-characterised copper amine
    oxidases. The cloning paper showed semicarbazide- and hydroxylamine-inhibitable activity of
    recombinant and tonsil-purified VAP-1 toward benzylamine and, among endogenous amines, toward
    methylamine; a topaquinone-dead Y471F mutant is catalytically inactive; and plasma SSAO activity
    tracks soluble VAP-1 in rodents. Human, mouse and rat members all carry independent direct assays
    for the activity. PAINT itself uses human AOC3 to seed the copper-binding IBD at PTN000067313 and
    the localisation IBDs at this very node, and nothing in the cited work suggests divergence that
    would remove the catalytic function. The loss
    is contradicted; the IRD should be retired so the ancestral IBD descends to AOC3. If the curator's
    concern was that methylamine is not AOC3's only or main physiological substrate, that is a
    substrate-scope question, not a loss of primary-amine oxidase activity.
