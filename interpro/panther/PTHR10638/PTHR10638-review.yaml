family_id: PANTHER:PTHR10638
family_name: COPPER AMINE OXIDASE
summary: Copper amine oxidases oxidatively deaminate primary amines, producing an aldehyde, ammonia and
  hydrogen peroxide through copper/topaquinone-dependent chemistry. Family members differ in their preferred
  monoamine, diamine or polyamine substrates and in whether they act intracellularly, at membranes or
  extracellularly.
functional_coherence: HETEROGENEOUS
coherence_reason: Pombe Cao1 has primary experimental support for copper-dependent oxidative deamination
  of primary amines. Heterologous budding-yeast assays support ethylamine utilization; native copper-loading
  experiments identify Atx1 as a copper source, and microscopy directly places Cao1 in meiotic forespores.
  These observations do not establish mammalian histamine clearance, vascular adhesion or identical substrate
  preferences across the family.
