family_id: PANTHER:PTHR47870
family_name: CYTOCHROME C-TYPE BIOGENESIS PROTEIN CCMH
preferred_name: CcmH/CycH/NrfF cytochrome c maturation family
summary: PTHR47870 groups membrane-associated periplasmic components of cytochrome c maturation, including
  redox-active CcmH, separate TPR-rich CcmI/CycH accessories and Nrf-specific paralogs. SF1 contains E.
  coli and Pseudomonas CcmH and Rhodobacter Ccl2, but also Rhodobacter CcmI/CycH D5ALI6. SF1 membership
  therefore does not imply the CcmH redox architecture. E. coli CcmH combines a redox-active N-terminal
  region with a C-terminal CcmI-like accessory domain. Separate CcmI/CycH proteins occur in both SF1 and
  SF4; SF4 also contains E. coli NrfG. SF2 contains NrfF, dedicated to NrfA maturation. Molecular roles
  require architecture and experimental evidence beyond the subfamily name.
functional_coherence: HETEROGENEOUS
coherence_reason: Redox-active CcmH and TPR substrate-handling CcmI/CycH roles overlap within SF1 rather
  than partitioning cleanly by subfamily. SF4 contains additional CcmI/CycH and NrfG proteins, and SF2
  includes the NrfA-specific NrfF paralog. The original PAINT membrane-location assertion and family-scope
  verdicts are retained; no single molecular function is generalized across this mixed family.
