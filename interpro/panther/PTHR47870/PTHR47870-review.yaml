- assessed_term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  scope: UNRESOLVED
  scope_reason: Canonical CcmH exchanges disulfides with apocytochrome, whereas CcmG directly reduces
    protein-disulfide substrates and CcmH helps ensure ligation stereospecificity. SF1 also contains the
    distinct TPR-rich Rhodobacter CcmI/CycH D5ALI6, so a redox activity cannot be generalized from the
    SF1 label. The family-wide standalone protein-disulfide reductase assignment remains unresolved; this
    does not deny experimentally supported mixed-disulfide chemistry in CcmH.
  supported_by:
  - reference_id: PMID:28634234
    supporting_text: We conclude that CcmG confers efficiency, and CcmH ensures stereo-specificity during
      Ccm
