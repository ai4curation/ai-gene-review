family_id: PANTHER:PTHR47870
family_name: CYTOCHROME C-TYPE BIOGENESIS PROTEIN CCMH
preferred_name: CcmH/CycH/NrfF cytochrome c maturation family
summary: >-
  PTHR47870 groups membrane-anchored periplasmic components of the system I
  heme-ligation stage. SF1 contains CcmH proper (E. coli CcmH, Pseudomonas
  CcmH, Rhodobacter Ccl2), whose N-terminal domain carries a redox-active
  LRCxxC motif; CcmH forms mixed disulfides with apocytochrome c, is reduced
  by CcmG, and with CcmF forms the heme lyase (holocytochrome c synthase)
  complex that ensures stereospecific heme attachment. In E. coli the
  CcmH protein also carries a C-terminal TPR domain equivalent to the separate
  CcmI/CycH protein of other lineages. SF4 contains the separate CycH/CcmI
  proteins (Bradyrhizobium CycH, Pseudomonas CycH) and E. coli NrfG, which
  are TPR-rich ligation accessories; SF2 contains NrfF, a CcmH paralog
  dedicated to maturation of the nitrite reductase NrfA.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family spans three distinct roles: CcmH redox/ligation subunits (SF1),
  CycH/CcmI TPR accessories and the NrfG paralog (SF4), and the NrfA-specific
  NrfF paralog (SF2). Only a plasma membrane location is asserted by PAINT,
  and no molecular function applies across the whole family.
