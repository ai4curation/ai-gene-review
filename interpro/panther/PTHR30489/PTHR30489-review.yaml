notes: >-
  The E. coli LolC/LolE division of labor is not imposed on lineages with a single LolF-type membrane
  component. Homomeric LolDF is directly structurally and biochemically characterized in Acinetobacter
  (PMID:42091888). That comparison does not itself assign an Acinetobacter sequence to a subfamily. PMID:41557797
  supports the E. coli substrate-LolE interface; it does not turn shared SF0 membership or operon order
  into universal role proof. The actual tree and frozen member classifications are recorded in the family
  consultation. PMID:17509078 also reports conditional LolD/LolE-only reconstitution, distinct from native
  E. coli LolC essentiality.
