family_id: PANTHER:PTHR30489
family_name: LIPOPROTEIN-RELEASING SYSTEM TRANSMEMBRANE PROTEIN LOLE
preferred_name: LolC/LolE lipoprotein-release membrane subunit family
summary: >-
  PTHR30489 contains membrane components of bacterial Lol lipoprotein-release machinery. Characterized
  E. coli LolC and LolE each have four transmembrane segments and a large periplasmic domain. In that
  heteromeric complex, LolC recruits LolA and LolE makes specific contacts with the lipoprotein peptide,
  while both subunits build the cargo-binding and release machinery driven by LolD. Other lineages use
  homomeric LolF-type membrane components. The shared family or subfamily identifier alone does not determine
  the E. coli division of labor or the compatible partner combination. Extraction occurs from the periplasmic
  leaflet rather than across the lipid bilayer.
functional_coherence: COHERENT
coherence_reason: >-
  The represented LolC/LolE proteins contribute to ATP-dependent membrane release of mature lipoproteins.
  Their functional specialization and partnership vary between lineages. This coherence concerns participation
  in the release machinery, not autonomous catalytic activity of each membrane subunit or universal assignment
  of separate LolC and LolE roles.
