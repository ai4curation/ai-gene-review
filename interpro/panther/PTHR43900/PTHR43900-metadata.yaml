  name:
    name: Glutathione S-transferase superfamily
    short: GST_superfamily
  description:
  - text: This family of proteins is involved in the detoxification process by catalyzing
      the conjugation of reduced glutathione to a variety of exogenous and endogenous
      hydrophobic electrophiles. Members of this family are known to play a role in
      the metabolism of toxic substances, including herbicides, and may also participate
      in the transport and accumulation of plant secondary metabolites such as anthocyanins
      and proanthocyanidins. Some members exhibit peroxidase activity, which may contribute
      to cellular protection against oxidative stress. The family includes enzymes
      that are involved in the biosynthesis of specific secondary metabolites, such
      as hypothemycin, and may also bind and transport small bioactive molecules.
