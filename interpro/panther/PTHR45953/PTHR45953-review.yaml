notes: >-
  Written for the bacterial choline-O-sulfate uptake and desulfation module.
  The module grounds BetC to InterPro IPR017785 (choline-sulfatase) rather than
  to PTHR45953, because the PANTHER family and its only subfamily SF1 also
  contain IDS, arylsulfatases and ulvan sulfatases, so the PANTHER assignment
  cannot carry the choline-sulfatase claim. Node placements were judged from
  the seed sets, the cross-family PAINT slice and the members' GOA routes; the
  PANTHER tree itself was not inspected.
