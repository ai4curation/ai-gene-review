  assessment: SOUND
  assessment_reason: >-
    Seeds span animal IDS and the mycobacterial sulfatase AtsG (Q6MX51), so the
    assertion sits at a node covering both bacterial and animal members.
    Sulfate-ester hydrolysis through the formylglycine mechanism is the shared
    catalytic property: the bacterial choline sulfatase O69787, outside the
    seed set, hydrolyzes both choline-O-sulfate and the arylsulfate
    4-nitrophenyl sulfate. The term is broad enough to hold across the
    substrate-specific clades; specific activities are assessed separately.
