- assessed_term:
    id: GO:0047753
    label: choline-sulfatase activity
  scope: UNRESOLVED
  scope_reason: >-
    Choline-sulfatase activity is demonstrated for S. meliloti BetC and
    supported genetically for P. putida BetC, but it is a property of the
    TIGR03417 choline-sulfatase clade, which PANTHER does not separate from
    IDS and the other sulfatases in SF1. It must not be inherited from the
    PANTHER family or subfamily assignment; use the TIGR03417 / IPR017785
    signature (or direct evidence) to assign it.
  supported_by:
  - reference_id: PMID:9736747
    supporting_text: Choline sulfatase activity was absent from betC but not from betB mutants
  - reference_id: PMID:29458126
    supporting_text: a conserved glutamate (Glu386) plays a role in recognition of the quaternary ammonium group of the choline substrate
