subfamilies:
- subfamily_id: PANTHER:PTHR45953:SF1
  label: IDURONATE 2-SULFATASE
  description: >-
    The single PANTHER subfamily, covering the whole family. It contains the
    animal IDS orthologs and all of the bacterial sulfatases listed in the
    family summary. Within it, the bacterial choline sulfatases form a
    functionally distinct clade (NCBIfam TIGR03417 chol_sulfatase) whose
    members hydrolyze choline-O-sulfate; this is the clade used by the
    bacterial choline-O-sulfate uptake and desulfation module. The SF1 name
    should not be read as iduronate 2-sulfatase activity for bacterial members.
  representative_members:
