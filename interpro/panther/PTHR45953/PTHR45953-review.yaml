family_id: PANTHER:PTHR45953
family_name: IDURONATE 2-SULFATASE
preferred_name: Iduronate 2-sulfatase / choline sulfatase class I sulfatase family
summary: >-
  Formylglycine-dependent (class I) sulfatases of the alkaline phosphatase
  superfamily. PANTHER 19 keeps the whole family in one subfamily (SF1, named
  after the animal lysosomal iduronate 2-sulfatase IDS), but the cached member
  set spans very different substrates: animal IDS, which removes 2-O-sulfate from
  iduronate residues of dermatan and heparan sulfate in the lysosome; bacterial
  choline sulfatases (BetC) that hydrolyze choline-O-sulfate in the cytoplasm
  (Sinorhizobium meliloti O69787, Pseudomonas putida Q88RQ2, Pseudomonas
  aeruginosa Q9I799); ulvan-active sulfatases of marine Bacteroidetes;
  Clostridium arylsulfatases; Mycobacterium AtsG; and multifunctional
  phosphonate monoester hydrolase/sulfatases (PehA, pRL90232). The shared
  chemistry is sulfate-ester hydrolysis through an active-site formylglycine
  generated from a Cys (or Ser) in the CXPXR sulfatase motif; substrate
  specificity is clade-specific and is not resolved by PANTHER subfamilies.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Sulfuric ester hydrolase activity is shared by the characterized members
  (IDS, BetC, arylsulfatases, ulvan sulfatases), and the PAINT root assertion
  says only that. Specific substrates are not interchangeable: the choline
  sulfatase clade recognizes the quaternary ammonium of choline-O-sulfate
  through a conserved glutamate, IDS acts on iduronate 2-sulfate in
  glycosaminoglycans, and several bacterial members are promiscuous
  phosphoesterase/sulfatases. Because PANTHER defines only one subfamily, the
  specific activities are clade-level properties recognized by narrower
  signatures (for BetC, NCBIfam TIGR03417 and InterPro IPR017785), not by a
  PANTHER subfamily.
