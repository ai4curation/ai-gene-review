  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    PTN008498319 is the SFR2 clade (61 leaves, SF209 with SF316 and SF271). The node carries a PAINT IBD
    for galactosyltransferase activity. SFR2 was first reported to hydrolyse beta-glucosides in vitro
    (PMID:15258268, the source of the conflicting IDA rows), but it was later shown to be a galactolipid
    galactosyltransferase in the chloroplast outer envelope (PMID:20798281), and a structure-function
    study found no detectable hydrolase activity (PMID:25100720). The loss of beta-glucosidase activity
    is supported.
