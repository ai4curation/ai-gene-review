family_id: PANTHER:PTHR10353
family_name: GLYCOSYL HYDROLASE
preferred_name: Glycosyl hydrolase family 1
summary: >-
  PTHR10353 is glycoside hydrolase family 1, the beta-glucosidases and related beta-glycosidases. The
  clade assessed here holds plant SENSITIVE TO FREEZING 2 (SFR2), which has become a galactolipid galactosyltransferase
  in the chloroplast outer envelope.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Most members hydrolyse beta-glycosides; the SFR2 clade transfers galactosyl residues between galactolipids
  instead.
