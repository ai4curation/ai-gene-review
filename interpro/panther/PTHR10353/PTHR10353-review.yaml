family_name: GLYCOSYL HYDROLASE
preferred_name: Glycosyl Hydrolase
summary: GLYCOSYL HYDROLASE (PANTHER:PTHR10353) is characterized in PANTHER PAINT across 8 ancestral PTN
  node(s) (PANTHER:PTN000039458, PANTHER:PTN000039749, PANTHER:PTN002570643, PANTHER:PTN002570652 (+4
  more)) with 21 IBD node assertion(s) and 1 term(s) carrying negated IRD/IKR branch blocks, covering
  beta-glucosidase activity (GO:0008422, MF), cytosol (GO:0005829, CC), carbohydrate catabolic process
  (GO:0016052, BP), beta-galactosidase activity (GO:0004565, MF) and 13 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR10353 (GLYCOSYL HYDROLASE) span 8 distinct ancestral
  PTN nodes (PANTHER:PTN000039458, PANTHER:PTN000039749, PANTHER:PTN002570643, PANTHER:PTN002570652, PANTHER:PTN002570733
  (+3 more)) with different molecular function assignments across clades (beta-glucosidase activity (GO:0008422),
  beta-galactosidase activity (GO:0004565), glycosylceramidase activity (GO:0017042), lactase activity
  (GO:0000016) and 3 additional molecular function term(s)), indicating clade-level functional specialization
  across the family.
