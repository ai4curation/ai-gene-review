- assessed_term:
    id: GO:0098619
    label: selenocysteine-tRNA ligase activity
  scope: UNRESOLVED
  scope_reason: >-
    Cytoplasmic SerRS serylates tRNA(Sec) in Sec-decoding eukaryotes, as human SARS1
    does, but the activity is physiological only where a tRNA(Sec) exists, which
    excludes, for example, the yeasts and plants in the same cytoplasmic subfamily.
    Mitochondrial SerRS have no tRNA(Sec) substrate. Applicability is decided per
    genome, not by subfamily.
  supported_by:
  - reference_id: file:human/SARS1/SARS1-uniprot.txt
    supporting_text: >-
      Is probably also able to aminoacylate tRNA(Sec) with serine, to form the
      misacylated tRNA L-seryl-tRNA(Sec)
  - reference_id: PMID:15317934
    supporting_text: >-
      the absence of this function in bacteria, plants, and yeast
