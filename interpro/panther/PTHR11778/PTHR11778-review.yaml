family_id: PANTHER:PTHR11778
family_name: SERYL-TRNA SYNTHETASE
preferred_name: Eukaryotic, archaeal and actinobacterial-type seryl-tRNA synthetases
summary: >-
  Class II seryl-tRNA synthetases (SerRS, EC 6.1.1.11) of the type found in the
  eukaryotic cytosol and mitochondria, in most archaea and in actinobacteria and
  spirochetes. The PANTHER tree (261 leaves) splits into a cytoplasmic clade (SF7
  SERINE--TRNA LIGASE, CYTOPLASMIC, with SF18 and SF22) and a mitochondrial clade
  (SF23 SERINE--TRNA LIGASE, MITOCHONDRIAL, with SF17 and SF20 and the insect
  paralog SF2 SLIMP). Human cytoplasmic SARS1 charges tRNA(Ser) for translation and
  also serylates tRNA(Sec), the first step of selenocysteine synthesis; vertebrate
  SARS1 additionally has a nuclear role repressing VEGFA transcription. SLIMP
  (seryl-tRNA synthetase-like insect mitochondrial protein) is a mitochondrial
  paralog that has lost aminoacylation activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member except the SLIMP clade is a serine--tRNA ligase acting in the
  cytosol or in mitochondria. SLIMP arose by duplication of a mitochondrial SerRS
  and performs an essential mitochondrial function unrelated to aminoacylation.
