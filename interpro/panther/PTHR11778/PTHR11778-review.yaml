notes: >-
  Reviewed for the selenocysteine biosynthesis and incorporation module, which uses
  SARS1 for the shared Ser-tRNA(Sec) step in the eukaryotic route. The Swiss-Prot
  members include many archaeal and actinobacterial SerS classified here by HMM; the
  cached entries file carries no subfamily column for this family, so subfamily
  membership is read from the tree check. The PAINT rows of PTN002623036 carry
  taxon:2 in the cached slice although the node is the family root, so node_taxon is
  left unset. The PMID:15317934 quote is about PSTK, whose absence in plants and
  yeast reflects the absence of Sec decoding there.
