  name:
    name: E3 ubiquitin-protein ligase
    short: E3_ubiquitin-ligase
  description:
  - text: This family of proteins includes E3 ubiquitin-protein ligases involved in
      the N-end rule pathway, which recognizes proteins with specific destabilizing
      N-terminal residues, leading to their ubiquitination and degradation. These
      ligases play roles in mRNA maturation and transcriptional regulation by activating
      CDK9, and are implicated in cell cycle control, DNA damage response, and tumor
      suppression. They ubiquitinate acetylated PCK1 and regulate TopBP1. Additionally,
      they suppress RNF168 to prevent excessive ubiquitinated chromatin spread at
      damaged chromosomes. In Drosophila, a member regulates cell proliferation and
      acts as a negative regulator of developmental genes, also catalyzing 'Lys-63'-linked
      polyubiquitination.
