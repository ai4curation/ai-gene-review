family_id: PANTHER:PTHR12311
family_name: ACTIVATOR OF BASAL TRANSCRIPTION 1
summary: ABT1/Esf2 proteins are nuclear interaction factors linked to RNA production and ribosome biogenesis.
  Yeast Esf2 binds pre-rRNA, participates in U3/90S small-subunit biogenesis and stimulates the helicase
  Dbp8. The conserved molecular role is better defined by these RNA-processing interactions than by a
  generic transcription-associated name.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Yeast Esf2 is a nucleolar U3/90S-associated factor required for early pre-rRNA cleavage
  and 18S production (PMID:15964808). It binds pre-rRNA and stimulates the ATPase activity of the interacting
  helicase Dbp8 (PMID:16772403), distinguishing an assembly/RNA cofactor from an intrinsic ATPase or nuclease.
  These experiments support an SSU-biogenesis mechanism for the characterized branch; the ABT1-associated
  transcription narrative and uncharacterized fly CG32706 do not establish an exhaustive family-wide processome-assembly
  grant.
