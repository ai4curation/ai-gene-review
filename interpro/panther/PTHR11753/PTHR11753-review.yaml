family_id: PANTHER:PTHR11753
family_name: ADAPTOR COMPLEXES SMALL SUBUNIT FAMILY
summary: Sigma adaptins are small subunits of heterotetrameric adaptor complexes involved in membrane
  cargo sorting. AP-1, AP-2, AP-3 and AP-4 complexes use related sigma subunits at different membrane
  compartments. Their shared structural role does not identify a single vesicle destination.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory contains sigma subunits of AP-1 through AP-4, which share cargo-adaptor
  architecture but operate in different trafficking pathways. The curated pombe Vas2 assignment supports
  AP-1 participation at the Golgi/endosome interface. Neither plasma-membrane endocytosis nor clathrin
  recruitment can be inherited as a universal sigma-adaptin function, and an isolated sigma chain is not
  the entire cargo-sorting complex.
reference_protein:
  id: UniProtKB:Q9P7N2
  label: AP-1 complex subunit sigma-1
  gene_symbol: vas2
  organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
  gene_review: genes/SCHPO/vas2/vas2-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0030121
    label: AP-1 adaptor complex
  scope: UNRESOLVED
  scope_reason: IPR016635 emphasizes AP-1, but the PANTHER subfamily list also contains AP-2, AP-3 and
    AP-4 sigma chains. Pombe Vas2 should be assigned AP-1-specific Golgi/endosome functions from its complex
    evidence. Plasma-membrane endocytosis, clathrin association and specialized cell-to-cell transport
    are not automatic family functions.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-b.json
    supporting_text: Component of the AP-1 complex which links clathrin to receptors in coated vesicles.
