  name:
    name: Zona Pellucida Sperm-Binding Protein 3
    short: ZP3_Sperm-Binding
  description:
  - text: The Zona Pellucida Sperm-Binding Protein 3 family is involved in the formation
      of the zona pellucida, an extracellular matrix that surrounds oocytes. Members
      of this family play a crucial role in mediating sperm binding, triggering the
      acrosome reaction, and preventing polyspermy after fertilization. The zona pellucida
      is typically composed of three to four glycoproteins, including ZP1, ZP2, ZP3,
      and sometimes ZP4. ZP3 is essential for the formation of the zona matrix and
      is a key component for sperm binding, although some variants may enhance the
      sperm-binding activity of other proteins rather than directly binding sperm
      themselves. The ZP domain within these proteins is responsible for their polymerization,
      which is critical for the structural integrity of the zona pellucida.
