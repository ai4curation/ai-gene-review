family_id: PANTHER:PTHR43029
family_name: AMMONIUM TRANSPORTER MEP2
preferred_name: Amt/Mep ammonium transporter family
summary: Amt/Mep ammonium transporters of bacteria, archaea, fungi, plants and protists. Members are
  trimeric inner- or plasma-membrane proteins with eleven transmembrane helices per protomer that conduct
  ammonium across the membrane. In proteobacteria the amtB gene is usually co-transcribed with glnK, and
  the PII protein GlnK binds and blocks the channel when ammonium is plentiful.
functional_coherence: COHERENT
coherence_reason: Ammonium channel activity, ammonium transmembrane transport and plasma membrane location
  are shared by every characterized member. Regulation differs between lineages, through PII binding in
  bacteria and through transceptor signalling by fungal Mep2, but the transport activity does not.
