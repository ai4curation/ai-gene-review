family_id: PANTHER:PTHR21091
family_name: METHYLTETRAHYDROFOLATE:HOMOCYSTEINE METHYLTRANSFERASE RELATED
preferred_name: Uroporphyrinogen decarboxylase (HemE/HEM12/UROD) family
summary: >-
  Uroporphyrinogen decarboxylases remove the four acetate carboxyls of uroporphyrinogen III to give
  coproporphyrinogen III, the fifth step of heme synthesis (bacterial HemE, S. cerevisiae HEM12,
  S. pombe hem12, human UROD, plant HEME1/2).
functional_coherence: COHERENT
coherence_reason: All characterized members in SF169 and plant SF167 are UROD enzymes.
