family_id: PANTHER:PTHR43612
family_name: TRIFUNCTIONAL ENZYME SUBUNIT ALPHA
preferred_name: Fatty acid oxidation complex alpha subunits (bacterial FadB/FadJ and mitochondrial HADHA)
summary: >-
  Multifunctional alpha subunits of fatty acid beta-oxidation complexes, each with an N-terminal crotonase
  (enoyl-CoA hydratase) domain and a C-terminal NAD-dependent 3-hydroxyacyl-CoA dehydrogenase domain.
  Bacterial members (FadB of the aerobic FadBA complex and FadJ of the anaerobic FadIJ complex) pair with
  a FadA/FadI thiolase; eukaryotic members (HADHA) form the mitochondrial trifunctional protein with HADHB.
  SF3 holds the bacterial FadB and FadJ proteins together with Drosophila and rodent HADHA orthologues;
  human HADHA is placed alone in SF7.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member carries both the hydratase and the dehydrogenase activities and acts in fatty
  acid beta-oxidation; PAINT places both at the family root and reviewed members in SF3 and SF7 accept
  them. Partner subunits and compartments differ (cytoplasmic bacterial complexes, mitochondrial inner-membrane
  trifunctional protein).
