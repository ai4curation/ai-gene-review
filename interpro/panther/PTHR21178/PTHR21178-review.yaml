review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Reviewed for the PAINT "human no-IBA" project, but the premise is stale for this
  family: the cached PTHR21178-paint.tsv carries two IBD rows dated 20250903, and the
  human gene's current GOA contains matching IBA rows (GO:0036126 via PTN001080689 and
  GO:0120316 via PTN001080690, both dated 20250903). CFAP61 therefore now receives IBA
  annotations; the no-IBA listing reflects an earlier snapshot. Both IBDs are recent,
  correctly scoped and well seeded, and both were independently ACCEPTed in the gene
  review against direct human/mouse experimental evidence. The gap is the opposite of
  over-propagation: PAINT asserts only the sperm-specific terms, while the deeper,
  family-wide axonemal role (axoneme localization, cilium movement, radial spoke
  assembly) is experimentally grounded in Tetrahymena and Chlamydomonas members and
  remains unasserted - see term_assessments for what a future IBD could safely add.
  Node ids, seeds, taxa and snapshot dates are verbatim from the cached
  PTHR21178-paint.tsv; the empty taxon field of the PTN001080689 row is omitted rather
  than guessed. No residue_sites: the family is non-enzymatic (its Rossmann-like fold
  is a scaffold) and no catalytic or point-residue claim is at stake.
