node_assessments:
  - node_id: PANTHER:PTN001080689
    asserted_term:
      id: GO:0036126
      label: sperm flagellum
    paint_snapshot: "20250903"
    seeds:
      - id: MGI:MGI:1926024
        label: Cilia- and flagella-associated protein 61
        gene_symbol: Cfap61
        organism: Mus musculus (Mouse)
      - id: UniProtKB:Q8NHU2
        label: Cilia- and flagella-associated protein 61
        gene_symbol: CFAP61
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Both seeds carry direct experimental evidence: mouse Cfap61 is localized to the
      sperm flagellum by IDA (PMID:36659204) and human CFAP61 is detected along patient
      and control sperm tails by immunofluorescence (PMID:35174165). The human gene
      appears in its own WITH/FROM, which is expected - its experimental annotation is
      one of the descendant evidences behind the IBD - and the human gene correctly
      receives the resulting IBA (GOA row dated 20250903). Placement on a node covering
      the mammalian/metazoan members is consistent with the conserved axonemal role;
      the protist members (Tetrahymena, Chlamydomonas), which have cilia/flagella but
      not sperm flagella, are outside this node and correctly do not inherit the term.
  - node_id: PANTHER:PTN001080690
    asserted_term:
      id: GO:0120316
      label: sperm flagellum assembly
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20250903"
    seeds:
      - id: MGI:MGI:1926024
        label: Cilia- and flagella-associated protein 61
        gene_symbol: Cfap61
        organism: Mus musculus (Mouse)
      - id: UniProtKB:Q8NHU2
        label: Cilia- and flagella-associated protein 61
        gene_symbol: CFAP61
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Seeded by strong IMP evidence in both mouse (knockout MMAF with impaired radial
      spoke assembly and axoneme scattering, PMID:34792097) and human (biallelic
      loss-of-function variants causing MMAF with disorganized axonemes, PMID:35174165).
      A Eumetazoa-level placement for sperm flagellum assembly is defensible: motile
      flagellated sperm are ancestral for Eumetazoa, and the CSC role of CFAP61 in
      building the flagellar axoneme long predates metazoans (RS3-base function is
      experimental in Tetrahymena and Chlamydomonas). The human gene receives this IBA
      (GOA row dated 20250903). Lineages with secondarily aflagellate sperm would be
      candidates for pruning if family members persist there, but no such member is
      documented in the cached slice.

term_assessments:
  - assessed_term:
      id: GO:0003341
      label: cilium movement
    scope: FAMILY_WIDE
    scope_reason: >-
      Loss-of-function evidence for ciliary/flagellar motility exists at both
      phylogenetic extremes of the family: Tetrahymena FAP61 knockout reduces swimming
      and alters ciliary waveform, Chlamydomonas CSC perturbation alters flagellar
      beating and microtubule sliding, and mammalian knockouts abolish sperm motility.
      A future PAINT IBD for cilium movement at the family root would be sound and
      would usefully complement the current sperm-restricted assertions; the existing
      human GOA row for this term is only ISS from Tetrahymena.
    supported_by:
      - reference_id: PMID:25694453
        supporting_text: >-
          ...loss of either FAP61 or FAP251 reduces cell swimming and affects the ciliary
          waveform and that RS3 is either missing or incomplete, whereas RS1 and RS2
          are unaffected...
      - reference_id: PMID:21613541
        supporting_text: >-
          ...analysis of both flagellar beating and microtubule sliding in vitro demonstrates
          that the CSC plays a critical role in modulating dynein activity...
  - assessed_term:
      id: GO:0005930
      label: axoneme
    scope: FAMILY_WIDE
    scope_reason: >-
      Axonemal localization is experimental in human airway cilia (proteomics,
      PMID:28282151; cryo-EM of the RS3 base, PMID:37258679), mouse sperm
      (PMID:36659204) and, for the orthologs used in ISS transfers, Tetrahymena and
      Chlamydomonas. Safe for the whole family and a good candidate for a family-root
      IBD, which PAINT does not currently assert.
    supported_by:
      - reference_id: PMID:37258679
        supporting_text: >-
          ...a full-length RS3, which we show is built on a base of CFAP61, CFAP91 and
          CFAP251...
  - assessed_term:
      id: GO:0062177
      label: radial spoke assembly
    scope: FAMILY_WIDE
    scope_reason: >-
      The defining family function. FAP61 loss ablates the RS3 stem in Tetrahymena, the
      CSC is required for spoke assembly in Chlamydomonas, and radial spoke component
      assembly is impaired in early Cfap61-null mouse spermatids. This term is absent
      from GOA for the human gene and from PAINT for the family; it is the single most
      informative process term a future PAINT curation could add at the family root.
    supported_by:
      - reference_id: PMID:25694453
        supporting_text: >-
          ...FAP61-null cilia lack an adjacent portion of the RS3 stem region...
      - reference_id: PMID:34792097
        supporting_text: >-
          ...During early stages of Cfap61-/- spermatid development, the assembly of radial
          spoke components is impaired...

