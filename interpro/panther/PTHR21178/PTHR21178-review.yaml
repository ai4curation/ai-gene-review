family_id: PANTHER:PTHR21178
family_name: CILIA- AND FLAGELLA-ASSOCIATED PROTEIN 61
preferred_name: CFAP61 / FAP61 (CaM-IP3) calmodulin- and spoke-associated complex family
summary: >-
  Single-subfamily family of CFAP61/FAP61 orthologs, conserved components of the
  calmodulin- and spoke-associated complex (CSC) of motile cilia and flagella. The CSC
  (CFAP61 with CFAP91/MAATS1 and CFAP251/WDR66; FAP61/CaM-IP3, FAP91/CaM-IP2 and
  FAP251/CaM-IP4 in Chlamydomonas) sits at the base of the radial spokes, builds the RS3
  stem and connects RS2, RS3 and the nexin-dynein regulatory complex, transducing signals
  that modulate dynein activity and ciliary/flagellar beating. The function is
  experimentally established across a very wide phylogenetic span: Chlamydomonas
  (CSC/radial-spoke assembly and motility), Tetrahymena (RS3 stem assembly, swimming and
  waveform), and mouse and human (sperm flagellum assembly and flagellated sperm
  motility; biallelic human loss-of-function causes MMAF/asthenoteratozoospermia,
  SPGF84). The protein is non-enzymatic; its Rossmann-like FAD/NAD(P)-binding-superfamily
  fold acts as a structural scaffold. The family distributes across ciliated eukaryotes
  (2536 proteins, ~4031 taxa in InterPro), consistent with an ancestral motile-cilium
  axonemal role, and is integrated as InterPro IPR038884.
functional_coherence: COHERENT
coherence_reason: >-
  All experimentally characterized members - Chlamydomonas FAP61/CaM-IP3, Tetrahymena
  FAP61, mouse Cfap61 and human CFAP61 - are axonemal CSC components acting at the radial
  spoke base of motile cilia/flagella, and PANTHER places the whole fetched slice in a
  single subfamily (SF8). No functionally divergent clade is documented.
