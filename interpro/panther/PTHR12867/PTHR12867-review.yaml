family_id: PANTHER:PTHR12867
family_name: GLYCOSYL TRANSFERASE-RELATED
preferred_name: ALG13 UDP-GlcNAc transferase catalytic subunit family
summary: >-
  Alg13 is the cytosolic catalytic GT1 subunit of the Alg13-Alg14 UDP-GlcNAc transferase, which adds
  the second beta-1,4-GlcNAc to GlcNAc-PP-dolichol. Fungal ALG13 (S. pombe alg13) is a single-domain
  enzyme; vertebrate ALG13 (SF7) also carries an OTU deubiquitinase domain.
functional_coherence: COHERENT
coherence_reason: Both subfamilies are Alg13 catalytic subunits; the vertebrate proteins add an OTU
  domain.
