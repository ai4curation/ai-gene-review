family_id: PANTHER:PTHR10343
family_name: 5'-AMP-ACTIVATED PROTEIN KINASE , BETA SUBUNIT
preferred_name: AMPK/SNF1 beta and CRP1/MDG1-like family
summary: >-
  PTHR10343 groups the mammalian AMPK beta scaffolding subunits, fungal SNF1
  kinase beta subunits, and a distinct CRP1/MDG1-like branch. Human PRKAB1
  belongs to PTHR10343:SF84 and human PRKAB2 to PTHR10343:SF92. Both human
  proteins are non-catalytic beta subunits of the AMPK alpha/beta/gamma
  heterotrimer and bind the catalytic alpha protein kinase as a structural
  bridge to the nucleotide-binding gamma subunit.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The AMPK/SNF1 beta scaffold role is coherent for the human beta-1 and beta-2
  subfamilies and fungal SNF1 beta subunits. The PANTHER root also contains
  CRP1/MDG1-related members such as Saccharomyces P38845/CRP1 in SF81, but
  these remain AMPK-beta-related proteins inside the same root rather than a
  wholly unrelated foreign clade; the broad PAINT gains are therefore treated
  as plausible at the root in this review.
notes: >-
  The compact PANTHER 19.0 tree was present in
  .cache/panther_trees/19.0/PTHR10343.json.gz. In that tree PTN000038857 is the
  PAINT root used by all five rows and contains 114 leaves spanning SF84, SF92,
  SF81 and several minor subfamilies; PTN000038860 is the SF92 clade for
  PRKAB2. The SF84 label covers PRKAB1 and several fungal SNF1-beta branches but
  was not represented by a single exact clade node.
