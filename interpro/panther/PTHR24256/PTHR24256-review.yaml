family_id: PANTHER:PTHR24256
family_name: TRYPTASE-RELATED
summary: This insect protease-related family contains proteins with serine-protease-like domains and variable
  additional architecture. Catalytic enzymes and noncatalytic protease homologues can participate in immune
  or developmental systems through different mechanisms.
functional_coherence: HETEROGENEOUS
coherence_reason: The insect SP/SPH classification separates catalytic serine proteases from homologues
  lacking the canonical active-site constellation (PMID:30367934). The CG43124 and CG4793 sequence analyses
  evaluate complete native isoforms rather than treating short proteins as pipeline truncations. The immune
  phenotype of CG4793 (PMID:33644706) establishes biological participation, not a measured peptide-cleavage
  reaction. Intrinsic serine endopeptidase activity remains branch- and architecture-dependent, so a universal
  or exhaustive subfamily grant is not established.
