  - reference_id: file:genes/DROME/CG43124/CG43124-bioinformatics/RESULTS.md
    supporting_text: 'CG43124 lacks two essential residues of the trypsin catalytic triad: the profile-aligned
      histidine is Ser69 and the aspartate is Asn112.'
  - reference_id: file:genes/DROME/CG4793/CG4793-bioinformatics/RESULTS.md
    supporting_text: Global domain alignments to active trypsins P00760 and P00761 map the catalytic His,
      Asp and Ser to Q8IP30 Glu145, Asn191 and Gly290, respectively. In particular, the catalytic serine
      is replaced by glycine in the conserved local segment TCKGDGGAPLA.
