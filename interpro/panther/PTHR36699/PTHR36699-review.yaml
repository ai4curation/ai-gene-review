term_assessments:
- assessed_term:
    id: GO:0061785
    label: peptidoglycan endopeptidase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The core function of the SF1 family is hydrolysis of a peptidoglycan amide
    bond: E. coli DpaA cleaves the meso-diaminopimelate-to-Lpp bond of a
    peptidoglycan stem, a peptidoglycan endopeptidase activity. This refines the
    generic endopeptidase activity (GO:0004175) asserted at the PAINT node to the
    peptidoglycan-specific child, and is the molecular function the member gene
    reviews assign. No GO term names the tether-hydrolysis specificity itself; a
    child term is proposed in the member reviews.
  supported_by:
  - reference_id: file:interpro/panther/PTHR36699/PTHR36699-paint.tsv
    supporting_text: "PTHR36699\tPTN002195972\tGO:0004175\tF\tIBD\tfalse"
  - reference_id: file:genes/ECOLI/P0AA99/P0AA99-ai-review.yaml
    supporting_text: peptidoglycan endopeptidase activity
- assessed_term:
    id: GO:0004175
    label: endopeptidase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The tether-hydrolase endopeptidase activity is the core function of the SF1
    family; the demonstrated E. coli DpaA reaction is a peptidoglycan
    endopeptidase (GO:0061785), of which GO:0004175 is the broader parent asserted
    at the PAINT node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR36699/PTHR36699-paint.tsv
    supporting_text: "PTHR36699\tPTN002195972\tGO:0004175\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0004180
    label: carboxypeptidase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Carboxypeptidase activity is NOT safe family-wide. The only characterised
    member, E. coli DpaA, has a narrow meso-Dpm-Gly carboxypeptidase activity but
    explicitly LACKS the classical ld-carboxypeptidase (terminal-d-Ala) activity,
    and PMID:33947763 states that ld-carboxypeptidase activity in DpaA homologues
    is speculative. The activity is therefore recorded only for the characterised
    SF1 exemplar; uncharacterised members (e.g. PP_1451, PA14 LdtPae3) mark it
    over-annotated rather than inheriting it as a function.
  applicable_subfamilies:
  - id: PANTHER:PTHR36699:SF1
