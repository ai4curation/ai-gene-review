family_id: PANTHER:PTHR36699
family_name: LD-TRANSPEPTIDASE
preferred_name: YafK/LdtF/DpaA-family peptidoglycan-lipoprotein tether hydrolases
summary: >-
  A small bacterial family that carries the YkuD (L,D-transpeptidase) catalytic
  fold but, in its characterized members, acts as a hydrolase rather than an
  acyl-transferase. The experimentally defined exemplar is E. coli DpaA
  (LdtF/YafK), a periplasmic cysteine enzyme that detaches Braun's lipoprotein
  (Lpp) from peptidoglycan by hydrolyzing the covalent amide bond between the Lpp
  C-terminal lysine and the meso-diaminopimelate of a peptidoglycan stem; it also
  has a glycine-specific carboxypeptidase activity. The family is the hydrolytic
  counterpart to the ErfK-family anchoring L,D-transpeptidases (PTHR30582:SF24):
  one writes the outer-membrane-to-peptidoglycan tether, the other erases it.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family carries the single subfamily SF1 (YafK-related) and a conserved
  catalytic cysteine. The characterized members (E. coli DpaA) and the
  tentatively assigned pseudomonad member (P. aeruginosa LdtPae3) are tether
  hydrolases, so the hydrolytic function is inferred family-wide; direct
  enzymology exists only for the E. coli exemplar, and activity on uncharacterized
  members remains an orthology-based inference.
