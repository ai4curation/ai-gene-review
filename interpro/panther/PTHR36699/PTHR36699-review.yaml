notes: >-
  Reviewed for the module gram_negative_lipoprotein_peptidoglycan_tether_remodeling.
  The module grounds its tether-hydrolysis step on SF1, anchored by the
  experimentally characterized E. coli DpaA/LdtF (P0AA99; PMID:33941679,
  PMID:33947763). No GO molecular-function term currently names hydrolysis of the
  peptidoglycan-protein tether specifically; GO:0061785 peptidoglycan endopeptidase
  activity is the closest existing parent, and a child term is proposed in the
  member gene reviews. PTN002195972 (Bacteria) carries the endopeptidase and
  carboxypeptidase activities; PTN002195981 (Enterobacteriaceae) carries the
  peptidoglycan metabolic process; both are seeded by DpaA.
