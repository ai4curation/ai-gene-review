  name:
    name: Zinc-containing alcohol dehydrogenase
    short: Zinc_ADH
  description:
  - text: This family of proteins includes enzymes that are involved in various metabolic
      processes, primarily acting as dehydrogenases with a requirement for zinc. Members
      of this family are characterized by their ability to bind zinc and utilize NAD(+)
      or NADPH as cofactors to catalyze oxidation-reduction reactions. They are involved
      in the metabolism of sugars, alcohols, and acids, including the reduction of
      ribulose 5-phosphate to ribitol 5-phosphate, the oxidation of D-gulosides, and
      the reduction of succinate semialdehyde, among others. Some members also participate
      in autotrophic carbon fixation pathways and the degradation of monoterpenes.
      The enzymes exhibit substrate specificity, with some acting on aromatic alcohols,
      D-gulosides, or succinate semialdehyde, while others are involved in the metabolism
      of mycothiol, acryloyl-CoA, and geraniol.
