family_id: PANTHER:PTHR10003
family_name: SUPEROXIDE DISMUTASE  CU-ZN -RELATED
preferred_name: Copper/zinc superoxide dismutase (SOD1) family
summary: >-
  Cu/Zn superoxide dismutases dismutate superoxide to hydrogen peroxide and oxygen using a copper
  catalytic site and a structural zinc. The family contains the cytosolic SOD1 enzymes of eukaryotes
  (S. cerevisiae SOD1, S. pombe sod1, human SOD1), extracellular and periplasmic Cu/Zn SODs, and
  the copper chaperones for SOD1 (CCS), whose SOD-like domain delivers copper to SOD1 but has no
  dismutase activity. PANTHER does not divide this family into subfamilies.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Superoxide dismutase activity holds for the SOD1-type enzymes but not for the CCS copper chaperones
  (S. cerevisiae CCS1, human CCS, Drosophila Ccs), which sit in the same family without a subfamily
  split. PAINT handles this with an IRD (NOT superoxide dismutase activity) and a copper chaperone
  activity at node PTN008300250.
