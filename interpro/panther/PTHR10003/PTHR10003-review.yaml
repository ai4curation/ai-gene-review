  scope: FAMILY_WIDE
  scope_reason: >-
    The glutathione_thioredoxin_redox_systems module asserts this activity for the family. It holds
    for the SOD1-type enzymes, which make up most of the family, but not for the CCS copper chaperones,
    listed as member exceptions.
  member_exceptions:
  - member:
      id: UniProtKB:P40202
      gene_symbol: CCS1
      organism: Saccharomyces cerevisiae
    exception_reason: >-
      Copper chaperone for SOD1; its SOD-like domain has no dismutase activity, and PAINT negates
      the activity for this clade.
    supported_by:
    - &id001
      reference_id: file:interpro/panther/PTHR10003/PTHR10003-paint.tsv
      supporting_text: "PTHR10003\tPTN008300250\tGO:0004784\tF\tIRD\ttrue"
