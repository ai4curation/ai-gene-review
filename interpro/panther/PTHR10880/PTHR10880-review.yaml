family_id: PANTHER:PTHR10880
family_name: MORTALITY FACTOR 4-LIKE PROTEIN
preferred_name: Eaf3/MRG and MSL3 chromatin subunits
summary: >-
  PTHR10880 contains chromo/Tudor-knot MRG-domain chromatin regulators.
  Fungal Eaf3/Alp13 proteins are noncatalytic subunits shared between NuA4
  histone acetyltransferase complexes and fungal Rpd3S/Clr6S histone
  deacetylase complexes, where they read methylated H3K36-marked transcribed
  chromatin. The family also contains plant MRG1/MRG2 proteins with
  CONSTANS-linked promoter functions and metazoan MSL3-family dosage
  compensation subunits that have diverged away from NuA4 membership.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The broad MRG fold is shared across the family, but NuA4/Rpd3S, plant
  promoter-specific, and metazoan MSL branches carry different chromatin
  complex memberships and molecular roles. PANTHER subfamily SF15 is itself
  mixed, containing fungal Eaf3 proteins, Arabidopsis MRG1, and metazoan MSL3
  proteins, so PAINT node placement is more informative than the subfamily
  boundary for this family.
