- assessed_term:
    id: GO:0032221
    label: Rpd3S complex
  scope: UNRESOLVED
  scope_reason: >-
    Rpd3S complex membership is sound on the fungal PTN000853816 Eaf3 node but
    not across PTHR10880 or across the mixed PTHR10880:SF15 subfamily, which
    also contains plant MRG1 and metazoan MSL3 proteins.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10880/PTHR10880-paint.tsv
    supporting_text: "PTHR10880\tPTN000853816\tGO:0032221\tC\tIBD\tfalse"
- assessed_term:
    id: GO:0035267
    label: NuA4 histone acetyltransferase complex
  scope: UNRESOLVED
  scope_reason: >-
    NuA4 membership is inherited by the reviewed fungal Eaf3 proteins from the
    broad PTN000093963 placement, but the term is explicitly lost on the MSL3
    animal branch, so it should be represented by the PAINT gain plus IRD rather
    than treated as a whole-family or whole-subfamily rule.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10880/PTHR10880-paint.tsv
    supporting_text: "PTHR10880\tPTN000853767\tGO:0035267\tC\tIRD\ttrue"
- assessed_term:
    id: GO:1990841
    label: promoter-specific chromatin binding
  scope: UNRESOLVED
  scope_reason: >-
    The current root placement is too deep for fungal Eaf3/Alp13 proteins, but
    the Arabidopsis seed evidence may still support a plant MRG1/MRG2
    descendant placement. The term should therefore be moved down rather than
    removed outright.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10880/PTHR10880-paint.tsv
    supporting_text: "PTHR10880\tPTN000093963\tGO:1990841\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0140003
    label: histone H3K36me3 reader activity
  scope: UNRESOLVED
  scope_reason: >-
    H3K36me3-reader activity is the supported fungal reader function for Eaf3
    proteins in Rpd3S/Clr6S and NuA4-family complexes, but PAINT does not yet
    place a fungal GO:0140003 IBD at PTN000853816 or below. The fungal branch
    should be reviewed separately for a GO:0140003 gain rather than treating the
    Arabidopsis GO:1990841 promoter-specific chromatin-binding row as the
    ancestor of this reader assertion.
  supported_by:
  - reference_id: PMID:37459529
    supporting_text: >-
      The chromodomain is responsible for recognizing the histone mark H3K36me
      (20), while the function of the PHD domains remains unknown.
  - reference_id: file:genes/yeast/EAF3/EAF3-ai-review.yaml
    supporting_text: >-
      Eaf3 has a direct yeast annotation to the descendant term GO:0140003
      histone H3K36me3 reader activity
