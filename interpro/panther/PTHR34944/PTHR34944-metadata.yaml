  name:
    name: Mitochondrial import receptor subunit TOM7
    short: TOM7_subunit
  description:
  - text: This family of proteins is involved in the mitochondrial import machinery,
      specifically as components of the TOM (translocase of outer membrane) receptor
      complex. They play a role in the recognition and translocation of cytosolically
      synthesized mitochondrial preproteins. Members of this family are implicated
      in the assembly and stability of the TOM complex. Additionally, they appear
      to modulate the dynamics of the mitochondrial protein transport machinery and
      promote the dissociation of subunits of the outer membrane translocase.
