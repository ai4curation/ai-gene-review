  name:
    name: Eukaryotic Initiation Factor 2 Gamma Subunit
    short: eIF2G
  description:
  - text: The eIF2G family plays a crucial role in the initiation phase of eukaryotic
      protein synthesis. Members of the eIF2G family are involved in the early steps
      of translation by forming a ternary complex with GTP and initiator tRNA. This
      complex is essential for the recruitment of the 40S ribosomal subunit and other
      initiation factors to form the 43S pre-initiation complex (43S PIC). The 43S
      PIC then binds to mRNA and scans for the start codon to form a 48S initiation
      complex. Following codon recognition, GTP hydrolysis leads to the release of
      the eIF2-GDP binary complex, allowing the 60S ribosomal subunit to join and
      form an 80S initiation complex capable of elongation. For eIF2G to participate
      in another round of initiation, GDP must be exchanged for GTP, a reaction facilitated
      by eIF-2B. The eIF2G family is part of the TRAFAC class translation factor GTPase
      superfamily and the classic translation factor GTPase family.
