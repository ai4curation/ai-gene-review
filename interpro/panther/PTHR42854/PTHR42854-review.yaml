family_id: PANTHER:PTHR42854
family_name: EUKARYOTIC TRANSLATION INITIATION FACTOR 2 SUBUNIT 3 FAMILY MEMBER
preferred_name: eIF2-gamma / aIF2-gamma translational GTPases and a bacterial SelB clade
summary: >-
  Translational GTPases of the eIF2-gamma type. The PANTHER tree (185 leaves) has two
  clades below the root. The large clade (177 leaves) holds the gamma subunits of
  eukaryotic translation initiation factor 2 (EIF2S3 and its X- and Y-linked and
  plant and protist paralogs) and archaeal aIF2-gamma, which deliver initiator
  Met-tRNAi to the small ribosomal subunit. The small clade (8 leaves) holds
  bacterial SelB, the selenocysteine-specific elongation factor, from proteobacteria,
  Geobacter, Thermodesulfovibrio and Chloroflexus, including E. coli SelB. Both clades
  bind an aminoacyl-tRNA with GTP. Almost every Swiss-Prot member is an initiation
  factor gamma subunit in SF3; E. coli SelB is the one Swiss-Prot SelB, also in SF3.
  Other bacterial SelB proteins, such as that of Pseudomonas putida KT2440, are
  classified in the EF-Tu-related family PTHR43721.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family joins two functionally distinct translational GTPases: initiation factor
  eIF2/aIF2-gamma, which carries Met-tRNAi in initiation, and bacterial SelB, which
  delivers Sec-tRNA(Sec) to recoded UGA codons during elongation and binds the
  bacterial SECIS hairpin. SF3 contains both, so subfamily membership does not
  separate them; only the PAINT clade nodes do.
