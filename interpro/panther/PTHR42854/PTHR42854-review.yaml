notes: >-
  Reviewed for the selenocysteine biosynthesis and incorporation module, which uses
  E. coli SelB as the experimental exemplar of bacterial Sec delivery. The SelB clade
  node PTN000562733 also appears in the cached PTHR43721 PAINT slice, where it has no
  leaves; in the current trees it belongs to this family. Bacterial SelB is therefore
  split by PANTHER between this family (E. coli, Pseudomonas aeruginosa, Salmonella and
  others in the tree) and PTHR43721 (for example P. putida KT2440 SelB, SF9).
