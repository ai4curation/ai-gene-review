  2 ancestral PTN node(s) (PANTHER:PTN000097951, PANTHER:PTN000097952) with 4 IBD node assertion(s) and
  0 term(s) carrying negated IRD/IKR branch blocks, covering electron transfer activity (GO:0009055, MF),
  flavin adenine dinucleotide binding (GO:0050660, MF), fatty acid beta-oxidation using acyl-CoA dehydrogenase
  (GO:0033539, BP), mitochondrion (GO:0005739, CC).
functional_coherence: MOSTLY_COHERENT
