subfamilies:
- subfamily_id: PANTHER:PTHR43153:SF1
  label: ELECTRON TRANSFER FLAVOPROTEIN SUBUNIT ALPHA, MITOCHONDRIAL
  description: >-
    Canonical ETF alpha subunits (mitochondrial ETFA and bacterial orthologs). Bacteria that degrade
    glycine betaine carry a second, distinct paralog group in this subfamily, encoded with dgcA-dgcB
    (Chromohalobacter Csal_0992, Pseudomonas putida PP_0312); these share about 33% identity with human
    ETFA versus about 60% for the canonical bacterial ETFs, and serve the dimethylglycine
    dehydrogenase rather than acyl-CoA dehydrogenases.
  diverged_from_family: false
