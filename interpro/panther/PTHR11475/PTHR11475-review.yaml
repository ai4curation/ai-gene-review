family_id: PANTHER:PTHR11475
family_name: OXIDASE/PEROXIDASE
summary: Animal-type heme-peroxidase relatives use or resemble enzymes that use peroxide in diverse extracellular
  reactions. Thyroid hormone synthesis, antimicrobial oxidant production, chorion modification and extracellular
  matrix cross-linking are distinct physiological contexts. Additional extracellular domains and active-site
  integrity are essential for distinguishing these roles.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory includes thyroid, leukocyte, lacto-, chorion- and peroxidasin proteins
  and peroxidase-like relatives. CG42331/Q9VC41 maps to SF109, officially chorion-peroxidase-like, while
  its automated name suggests peroxidasin. These conflicting names do not resolve substrate choice. An
  extracellular peroxidase-fold comparison is justified; collagen cross-linking, thyroid hormone production
  and proteolysis require separate architecture and biochemical evidence.
subfamilies:
- subfamily_id: PANTHER:PTHR11475:SF109
  label: CHORION PEROXIDASE-LIKE PROTEIN
  description: The classification contains thyroid, myelo-, lacto- and chorion-peroxidase branches. CG42331
    is placed in a chorion-peroxidase-like subfamily despite a predicted Peroxidasin name; the name alone
    does not establish collagen cross-linking. A complete domain architecture and comparison with experimentally
    characterized peroxidasin are required before choosing a matrix-specific activity.
  representative_members:
  - id: UniProtKB:Q9VC41
    label: Uncharacterized protein
    gene_symbol: CG42331
    organism: Drosophila melanogaster
