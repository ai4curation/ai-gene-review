      species, the Msi1 orthologs), which joins the 8-leaf clade PTN002738680
      (UME1, WTM1, WTM2, HAT2) at PTN002337950 (11 leaves, 3 species).
  - reference_id: file:interpro/panther/PTHR22850/PTHR22850-entries.csv
