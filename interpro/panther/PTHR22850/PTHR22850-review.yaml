      The gene encoding the p50 subunit of yeast CAF-I (CAC3) is similar to the
      human p48 CAF-I subunit and was identified previously as MSI1, a member of
      a highly conserved subfamily of WD repeat proteins implicated in histone
      function in several organisms.
