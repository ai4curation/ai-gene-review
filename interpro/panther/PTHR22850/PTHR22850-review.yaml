family_id: PANTHER:PTHR22850
family_name: WD40 REPEAT FAMILY
preferred_name: RbAp46/RbAp48/MSI1 chromatin WD-repeat proteins
summary: >-
  PTHR22850 contains eukaryotic RbAp46/RbAp48-like WD-repeat chromatin proteins
  that partition among paralogous CAF-1, HAT-B, Rpd3/Clr6 and Polycomb/NuRD
  complex lineages. The broad PTN000522733 chromatin assertions describe the
  family-level histone/chromatin role, but the fungal Rpd3L complex assertions
  at PTN001110151 overrun the S. cerevisiae Msi1/Cac3 ortholog branch. Msi1 is
  the p50 subunit of CAF-1, whereas Rpd3L uses the paralogous Ume1/Prw1 branch,
  so the two Rpd3L rows need an IRD at the Msi1 clade PTN001110155.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family contains ancient RbAp-like chromatin subunits whose core WD-repeat
  fold and histone/chromatin context are shared, but fungal paralogs specialize
  into distinct CAF-1, HAT-B and Rpd3/Clr6 deacetylase complex subunits. Complex
  membership is therefore clade-specific even when broad nucleus, histone and
  chromatin terms remain plausible for much of the family.
