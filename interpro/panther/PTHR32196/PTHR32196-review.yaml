family_id: PANTHER:PTHR32196
family_name: ABC TRANSPORTER PERMEASE PROTEIN YPHD-RELATED-RELATED
preferred_name: AraH/RbsC-type carbohydrate ABC importer permeases
summary: Integral inner-membrane permeases of CUT2-type carbohydrate ABC importers (binding-protein-dependent
  transport system permease family, AraH/RbsC subfamily). Members pair with PTHR43790 ATPases and periplasmic
  binding proteins to import ribose (RbsC), allose (AlsC), xylose (XylH), galactose/methyl-galactoside
  (MglC), L-arabinose (AraH), galactofuranose (YtfT), autoinducer-2 (LsrC, LsrD) and other substrates.
  E. coli RbsC has six transmembrane helices with cytoplasmic termini.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Membrane location and the permease role are shared; substrate differs by subfamily.
  The ribose permeases are split between SF21 (E. coli RbsC, with AlsC and YphD) and SF72 (B. subtilis
  and KT2440 RbsC), so neither subfamily is a clean ribose-permease clade.
