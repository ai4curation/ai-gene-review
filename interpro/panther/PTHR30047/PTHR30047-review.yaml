family_id: PANTHER:PTHR30047
family_name: HIGH-AFFINITY CHOLINE TRANSPORT PROTEIN-RELATED
preferred_name: Betaine/choline/carnitine transporter (BCCT) family
summary: >-
  The BCCT family (TC 2.A.15) is a group of secondary transporters, mostly bacterial, with 12
  transmembrane segments that carry trimethylammonium and related compatible solutes across the
  cytoplasmic membrane. Members are sodium- or proton-coupled symporters (C. glutamicum BetP,
  E. coli BetT) or substrate/product antiporters (E. coli CaiT, L-carnitine/gamma-butyrobetaine).
  Many are osmoregulated and also act as osmosensors. Substrates include choline (E. coli BetT,
  Acinetobacter BetT1/BetT2), glycine betaine (BetP, B. subtilis OpuD, Listeria BetL), ectoine
  (EctP, EctT), carnitine (CaiT) and trimethylamine (TmaT). Transmembrane transport at the
  plasma membrane is common to the whole family; the substrate is not.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members are plasma-membrane secondary transporters of quaternary-amine
  compatible solutes, so the generic transporter function is coherent. Substrate specificity,
  coupling ion (Na+ or H+) and mechanism (symport or CaiT-type antiport) vary between members,
  even within the BetT-named subfamily SF7.
reference_protein:
  id: UniProtKB:P0ABC9
  label: High-affinity choline transport protein
  gene_symbol: betT
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/betT/betT-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR30047:SF7
  label: HIGH-AFFINITY CHOLINE TRANSPORT PROTEIN
  description: >-
    Osmoregulated BCCT symporters. Despite the name, the subfamily is not choline-specific: it
    contains E. coli BetT and the Acinetobacter BetT1/BetT2 choline carriers, but also glycine
    betaine (C. glutamicum BetP, B. subtilis OpuD, Listeria BetL), ectoine (EctP, EctT) and
    trimethylamine (TmaT) transporters. P. putida KT2440 BetT-I (Q88CW9) is placed here by its
    UniProt PANTHER cross-reference; its substrate is not established. The
    choline-to-glycine-betaine module therefore selects choline uptake as orthologs of E. coli
    BetT, not as SF7 members.
  representative_members:
  - id: UniProtKB:P0ABC9
    label: High-affinity choline transport protein
    gene_symbol: betT
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/betT/betT-ai-review.yaml
  - id: UniProtKB:P54582
    label: Glycine betaine transporter BetP
    organism: Corynebacterium glutamicum
  - id: UniProtKB:P54417
    label: Glycine betaine transporter OpuD
    organism: Bacillus subtilis
  diverged_from_family: false
