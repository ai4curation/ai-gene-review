- subfamily_id: PANTHER:PTHR30047:SF11
  label: L-CARNITINE_GAMMA-BUTYROBETAINE ANTIPORTER
  description: >-
    CaiT, the enterobacterial L-carnitine/gamma-butyrobetaine antiporter of anaerobic carnitine
    metabolism, which is not involved in osmotic stress responses.
  representative_members:
  - id: UniProtKB:P31553
    label: L-carnitine/gamma-butyrobetaine antiporter
    gene_symbol: caiT
    organism: Escherichia coli K-12
  diverged_from_family: true
  divergence_description: >-
    Substrate/product antiport, not ion-coupled symport, and a catabolic rather than
    osmoprotective role.
  supported_by:
  - reference_id: PMID:20923416
    supporting_text: >-
      The BCCT family also contains CaiT, an L-carnitine/γ-butyrobetaine antiporter that is not
      involved in osmotic stress responses.
