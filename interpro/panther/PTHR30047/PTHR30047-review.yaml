    supporting_text: P0ABC9,High-affinity choline transport protein,protein,83333
  - reference_id: file:interpro/panther/PTHR30047/PTHR30047-entries.csv
    supporting_text: P54582,Glycine betaine transporter BetP,protein,196627
  - reference_id: file:interpro/panther/PTHR30047/PTHR30047-entries.csv
