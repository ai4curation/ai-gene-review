notes: >-
  IBA recipients were listed from the PAINT UniProt GAF (PANTHER 19). No IRD or IKR rows for
  this family's nodes were found in the PAINT IBD GAF, so no PAINT pruning exists for SQS2.
  Module consistency: ergosterol_biosynthesis (ERG9, erg9) and
  sterol_commitment_squalene_to_lanosterol (FDFT1) select the base family PTHR11626 for
  GO:0051996. For the model organisms this is harmless. As a selector it also takes in
  inactive Arabidopsis SQS2 (SF3) and the Botryococcus SSL proteins. SF2 is the tighter
  selector but still includes the SSL proteins. The human module labels the family
  "Squalene/phytoene synthase family". PTHR11626 contains no phytoene synthases, which belong
  to a different PANTHER family, so that preferred_term is inaccurate. The gene reviews (ERG9,
  S. pombe erg9, FDFT1) agree with PAINT on activity, ER membrane and lineage-specific sterol
  processes. They differ only on whether GO:0045338 is core.
