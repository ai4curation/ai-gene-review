family_id: PANTHER:PTHR11626
family_name: FARNESYL-DIPHOSPHATE FARNESYLTRANSFERASE
preferred_name: Squalene synthase (FDFT1/ERG9) family
summary: >-
  Squalene synthases are ER-membrane enzymes that join two molecules of farnesyl diphosphate
  head to head, via presqualene diphosphate, and reduce the product with NAD(P)H to squalene.
  This is the first committed step of sterol synthesis. The family contains the
  single-copy squalene synthases of fungi (S. cerevisiae ERG9, S. pombe erg9), animals
  (FDFT1) and plants (Arabidopsis SQS1), and several divergent paralogs. Arabidopsis SQS2
  has no squalene synthase activity, and Botryococcus braunii has squalene synthase-like
  enzymes that split the two half-reactions or make other triterpenes (botryococcene,
  lycopaoctaene).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Squalene synthase activity is conserved in the single-copy orthologs of fungi, animals and
  plants, which make up most of SF2. Two kinds of exception exist. Arabidopsis SQS2 (SF3,
  officially "INACTIVE SQUALENE SYNTHASE 2") has no squalene synthase activity in vitro or in
  yeast complementation. The Botryococcus braunii squalene synthase-like proteins sit inside
  SF2 itself: SSL-1 makes only presqualene diphosphate, SSL-2 makes squalene or bisfarnesyl
  ether only together with SSL-1, and SSL-3 makes botryococcene from presqualene diphosphate.
  SF2 is therefore not uniformly a two-step squalene synthase.
