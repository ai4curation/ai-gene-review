subfamilies:
- subfamily_id: PANTHER:PTHR22913:SF12
  label: MANNURONAN SYNTHASE
  description: Bacterial and other non-vertebrate processive glycosyltransferases. The subfamily holds
    the alginate (mannuronan) synthases Alg8 of Pseudomonas and Azotobacter, the streptococcal
    hyaluronan synthase HasA, and rhizobial NodC chito-oligosaccharide synthases. The official name
    describes only the Alg8 members.
  representative_members:
  - *alg8_pa
  - id: UniProtKB:Q88NC5
    label: Glycosyltransferase alg8
    gene_symbol: alg8
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/alg8/alg8-ai-review.yaml
  - id: UniProtKB:P94199
    label: Glycosyltransferase alg8
    gene_symbol: alg8
    organism: Azotobacter vinelandii
    gene_review: genes/AZOVI/alg8/alg8-ai-review.yaml
  - id: UniProtKB:P0C0H0
    label: Hyaluronan synthase
    gene_symbol: hasA
    organism: Streptococcus pyogenes
  diverged_from_family: true
  divergence_description: Relative to the hyaluronan-synthase consensus that names the family, the
    Alg8 members of this subfamily polymerize GDP-mannuronate into alginate and are not hyaluronan
    synthases; NodC members make chito-oligosaccharides. HasA in the same subfamily is a genuine
    hyaluronan synthase, so the divergence is per member, not uniform across SF12.
  supported_by:
  - reference_id: PMID:16391057
    supporting_text: An enzymatic in vitro alginate polymerization assay was developed by using
      14C-labeled GDP-mannuronic acid as a substrate and subcellular fractions of alginate
      overproducing Pseudomonas aeruginosa FRD1 as a polymerase source.
  - reference_id: PMID:8276791
    supporting_text: a Tn916 insertion that inactivates hyaluronate synthetic activity was localized
      to a gene designated hasA in the hyaluronic acid synthesis operon.
- subfamily_id: PANTHER:PTHR22913:SF7
  label: HYALURONAN SYNTHASE 2
  description: Vertebrate HAS2 orthologs, hyaluronan synthases that produce high-molecular-mass
    hyaluronan at the plasma membrane. One of the vertebrate HAS paralog groups (with SF4, SF6 and
    SF13) that carry the family's eponymous activity.
  representative_members:
  - id: UniProtKB:G5AY81
    label: Hyaluronan synthase 2
    gene_symbol: Has2
    organism: Heterocephalus glaber
    gene_review: genes/HETGA/Has2/Has2-ai-review.yaml
  diverged_from_family: false
