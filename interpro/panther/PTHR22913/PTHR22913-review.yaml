notes: Reviewed for the alginate polymerization and export module. Tree placements were read from the
  PANTHER 19 treeinfo service for PTHR22913 (root PTN000530809 at LUCA; has-rs leaf PTN009055585).
  Subfamily representatives are checked against the UniProt DR PANTHER lines and the family
  entries file. P. aeruginosa Alg8 is the reference protein because it has a complete gene review and
  the best target-specific catalytic-motif evidence among reviewed members. Vertebrate HAS proteins are
  better characterized biochemically but have no gene review in this repository. The NodC
  chito-oligosaccharide statements rest on UniProt names and PANTHER placement; no NodC publication
  is cached.
