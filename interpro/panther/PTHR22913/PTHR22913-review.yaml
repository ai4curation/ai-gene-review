- assessed_term:
    id: GO:0050501
    label: hyaluronan synthase activity
  scope: SUBFAMILY_ONLY
  scope_reason: Hyaluronan synthase activity is safe for the vertebrate HAS paralog subfamilies (SF4,
    SF6, SF7, SF13) and holds for streptococcal HasA in SF12. It does not hold for the Alg8 alginate
    synthases or NodC chito-oligosaccharide synthases that share SF12, so SF12 is listed as applicable
    only together with member exceptions for the reviewed Alg8 proteins. NodC members are not
    individually reviewed here and should not inherit the term either.
  applicable_subfamilies:
