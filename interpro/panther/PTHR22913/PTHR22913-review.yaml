family_id: PANTHER:PTHR22913
family_name: HYALURONAN SYNTHASE
preferred_name: Processive family-2 glycosyltransferases (hyaluronan synthases, Alg8 mannuronan synthases,
  NodC chito-oligosaccharide synthases and relatives)
summary: PTHR22913 groups membrane-embedded processive family-2 glycosyltransferases that extend a
  polysaccharide or oligosaccharide chain from nucleotide-sugar donors and, for the polymer synthases,
  pass the growing chain across or into the membrane. Vertebrate HAS1, HAS2 and HAS3 and the
  streptococcal HasA enzyme synthesize hyaluronan from alternating UDP-glucuronate and
  UDP-N-acetylglucosamine. Bacterial Alg8 proteins of Pseudomonas and Azotobacter instead polymerize
  GDP-mannuronate into the mannuronan backbone of alginate, working with the c-di-GMP-binding
  copolymerase Alg44, and rhizobial NodC proteins make the short chitin-oligosaccharide backbone of Nod
  factors. Fungal, protist and archaeal members are largely uncharacterized. The shared fold and the
  conserved D, DxD, D and QxxRW-type catalytic motif define the family; donor-sugar and product
  specificity differ between clades and cannot be read from family membership.
functional_coherence: HETEROGENEOUS
coherence_reason: Product specificity is not conserved across the family. Hyaluronan synthase activity
  is characterized for vertebrate HAS1-3 (SF4, SF6, SF7, SF13) and for streptococcal HasA, while Alg8
  makes alginate (mannuronan) from GDP-mannuronate and NodC makes chito-oligosaccharides. Subfamily
  SF12 (official name MANNURONAN SYNTHASE) is itself substrate-mixed, containing Alg8, HasA and NodC
  members, so neither the family nor SF12 can carry a specific polymer-synthase term.
