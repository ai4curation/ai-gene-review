  name:
    name: Tumor necrosis factor receptor superfamily member 10
    short: TNFRSF10
  description:
  - text: This family of proteins includes receptors that interact with the cytotoxic
      ligand TNFSF10/TRAIL. Members of this family can initiate apoptosis through
      the formation of a death-inducing signaling complex (DISC) that activates caspase-8
      and subsequent caspases. Some members contain a truncated death domain and do
      not induce apoptosis but may protect against it by competing for ligand binding.
      There is variability in the ability of these proteins to activate the NF-kappa-B
      pathway, with some members promoting its activation, which can be essential
      for certain stress-induced apoptosis pathways.
