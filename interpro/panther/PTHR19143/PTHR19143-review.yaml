family_id: PANTHER:PTHR19143
family_name: FIBRINOGEN/TENASCIN/ANGIOPOEITIN
preferred_name: Fibrinogen-domain extracellular interaction proteins
summary: This family groups proteins carrying a fibrinogen C-terminal interaction domain, including ficolins,
  fibroleukin, microfibril-associated proteins and angiopoietin-related proteins. Their functions range
  from ligand recognition to extracellular structural and signaling roles. The domain name does not imply
  that every member contributes to fibrin clot formation.
functional_coherence: HETEROGENEOUS
coherence_reason: Fibrinogen-like domains occur in secreted signaling and recognition proteins with different
  receptors and outputs. Fly CG10359 was identified as an angiopoietin-like candidate with radiation-responsive
  expression in a study of systemic radioprotection (PMID:24675716); this does not establish direct Tie
  binding, a GPCR mechanism or a fibrin polymerization reaction. Its signal peptide and fibrinogen domain
  support an extracellular interaction protein, while receptor identity and the conservation of angiopoietin-like
  signaling remain unresolved. Domain homology cannot replace a ligand-receptor experiment.
