family_id: PANTHER:PTHR11124
family_name: VACUOLAR SORTING PROTEIN VPS29
preferred_name: Retromer/retriever subunit VPS29 and prokaryotic YfcE phosphodiesterases
summary: >-
  Calcineurin-like metallophosphoesterase-fold family spanning two deeply
  divergent evolutionary branches: (1) prokaryotic and archaeal catalytically
  active metallophosphodiesterases such as Escherichia coli YfcE, Bacillus
  subtilis YsnB, and Methanocaldococcus jannaschii MJ0623
  (PANTHER:PTHR11124:SF26), which coordinate a binuclear metal center to
  hydrolyze phosphodiester bonds; and (2) eukaryotic Vps29 proteins
  (PANTHER:PTHR11124:SF12), which evolved into catalytically inactive structural
  scaffolds that bind the C-terminal alpha-solenoid of VPS35 (in the retromer
  cargo-selective complex) and VPS35L (in the retriever complex) to mediate
  endosomal cargo retrieval and recruit regulatory factors such as TBC1D5 and
  ANKRD27/VARP.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Although all members share the calcineurin-like metallophosphoesterase fold
  (IPR000979), prokaryotic members (PANTHER:PTHR11124:SF26) are active cytosolic
  phosphoric diester hydrolases (GO:0008081), whereas eukaryotic Vps29 orthologs
  (PANTHER:PTHR11124:SF12) lack physiological catalytic activity, bind metals
  only with very low affinity, and have their metallophosphoesterase cleft
  sterically occluded upon binding VPS35 or VPS35L, functioning instead as
  non-catalytic cargo-adaptor subunits of the retromer and retriever complexes.
