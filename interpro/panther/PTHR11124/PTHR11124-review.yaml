    diverged_from_family: true
    divergence_description: >-
      Eukaryotic Vps29 orthologs are pseudoenzymes that lack physiological
      phosphoric diester hydrolase activity, bind metals only with very low
      affinity, and repurpose the metallophosphoesterase fold as a
      protein-protein interaction scaffold in retromer and retriever.
    supported_by:
