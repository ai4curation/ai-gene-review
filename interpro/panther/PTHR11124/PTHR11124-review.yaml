residue_sites:
  - site_id: vps29_ile91_vps35_interface
    label: VPS29 Ile91 VPS35-binding hydrophobic patch
    description: >-
      Surface-exposed hydrophobic isoleucine (Ile91) on human VPS29 that packs
      into the C-terminal alpha-solenoid arch of VPS35 to assemble the retromer
      cargo-selective complex.
    anchor:
      id: UniProtKB:Q9UBQ0
      label: Vacuolar protein sorting-associated protein 29
      gene_symbol: VPS29
      organism: Homo sapiens
    anchor_sequence_version: 1
    site_source: UNIPROT_FEATURE
    residues:
      - position: 91
        expected:
          - I
        role: >-
          Hydrophobic interface residue required for binding VPS35 and VPS35L;
          I91D mutation impairs interaction with VPS35, VPS35L, and CCC complex
          association
    required_for:
      - term:
          id: GO:0030904
          label: retromer complex
        strength: CONTRIBUTES
        rationale: >-
          Ile91 mediates direct docking of VPS29 into the C-terminal arch of
          VPS35 in retromer (as well as VPS35L in retriever).
        supported_by:
          - reference_id: file:genes/human/VPS29/VPS29-uniprot.txt
            supporting_text: "I->D: Impairs interaction with VPS35. Impairs interaction with VPS35L and CCC complex association."
  - site_id: vps29_leu152_effector_binding_patch
    label: VPS29 Leu152 TBC1D5/VPS35L effector-binding site
    description: >-
      Conserved hydrophobic pocket residue (Leu152) on the opposite face of
      VPS29 from the metallophosphoesterase cleft that binds the Rab7 GAP
      TBC1D5 and retriever subunit VPS35L.
    anchor:
      id: UniProtKB:Q9UBQ0
      label: Vacuolar protein sorting-associated protein 29
      gene_symbol: VPS29
      organism: Homo sapiens
    anchor_sequence_version: 1
    site_source: UNIPROT_FEATURE
    residues:
      - position: 152
        expected:
          - L
        role: >-
          Hydrophobic pocket residue required for binding TBC1D5 and VPS35L;
