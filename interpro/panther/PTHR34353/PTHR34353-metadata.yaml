  name:
    name: CRISPR-associated endonuclease Cas1
    short: Cas1
  description:
  - text: The CRISPR-associated endonuclease Cas1 family proteins are key components
      of the CRISPR adaptive immune system in bacteria and archaea, providing protection
      against mobile genetic elements such as viruses, transposable elements, and
      conjugative plasmids. Members of the Cas1 family are involved in the integration
      of spacer DNA into the CRISPR cassette. They act as dsDNA endonucleases and
      are essential for the transcription and processing of CRISPR clusters into CRISPR
      RNA (crRNA). Some family members also exhibit ssDNA exonuclease activity and
      are capable of binding to both ssDNA and dsDNA.
