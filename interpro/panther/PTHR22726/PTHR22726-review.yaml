family_id: PANTHER:PTHR22726
family_name: METALLOENDOPEPTIDASE OMA1
preferred_name: OMA1 and bacterial membrane-associated metalloproteases
summary: OMA1 is a mitochondrial membrane metalloprotease involved in stress-responsive protein processing.
  Mammalian OMA1 cleaves OPA1 and participates in pathways that couple mitochondrial damage to cellular
  responses. Related bacterial proteins act in outer-membrane protein quality control, providing a distinct
  substrate and compartment context.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory contains OMA1, YggG/LoiP/YcaL and beta-barrel assembly-enhancing proteases.
  Shared metalloprotease ancestry does not transfer OPA1 processing, DELE1 signaling or a mitochondrial
  location to bacterial members. Exact catalytic-residue claims require an anchored sequence analysis
  beyond the family name.
