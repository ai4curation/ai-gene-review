family_id: PANTHER:PTHR11070
family_name: UVRD / RECB / PCRA DNA HELICASE FAMILY MEMBER
preferred_name: UvrD-family superfamily 1A DNA helicases (UvrD, Rep, PcrA, RecB, AddA, HelD, Srs2, FBH1)
summary: >-
  PTHR11070 groups superfamily 1A DNA helicases that translocate 3'-to-5' on single-stranded DNA
  and unwind duplex DNA with ATP hydrolysis. Members are found across bacteria and eukaryotes and
  have diverse roles. The bacterial helicases UvrD, PcrA and Rep work in excision repair, mismatch
  repair, replication and anti-recombination. RecB is the motor-nuclease subunit of RecBCD, and AddA
  is the motor-nuclease subunit of AddAB. HelD and HelR are RNA polymerase recycling motors.
  Eukaryotic Srs2 and FBH1 regulate Rad51 nucleoprotein filaments. The 3'-to-5' helicase motor is
  the common element. Nuclease activity, complex membership and particular repair pathways belong to
  individual subfamilies. RecB (PTHR11070:SF23) carries a C-terminal PD-(D/E)XK nuclease domain and
  is the only nuclease subunit of the RecBCD (exodeoxyribonuclease V) complex.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The ATP-driven 3'-to-5' DNA helicase motor is shared and is soundly placed at the LUCA node
  PTN000116141. Above the motor, members diverge in partners, accessory domains and pathways.
  RecB and AddA add a nuclease domain and act in heteromeric end-resection complexes. UvrD, PcrA
  and Rep act alone or as dimers in repair and replication. HelD and HelR recycle RNA polymerase.
  Eukaryotic Srs2 and FBH1 act on Rad51 filaments. A pathway or complex term should therefore not
  be inferred from family membership alone.
