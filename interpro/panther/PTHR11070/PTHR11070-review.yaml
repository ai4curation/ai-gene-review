    seeds and, for RecB, it is central. But the node sits at LUCA, so the term
    propagates to UvrD, PcrA, the Rep replication helicase (SF64), helicase IV
    (SF63), the HelD/HelR RNA polymerase recycling motors (SF17, SF45) and GajB,
    none of which has demonstrated participation in recombinational repair. UvrD's
    recombination-related activity is the opposite, removing RecA from blocked
    forks, and its RecF-pathway role is undefined. The function arose (or was
    recruited) separately in the RecB/AddA and Srs2/FBH1 lineages and should be
    placed on those clades rather than on PTN000116141. The row remains true for
    every RecBCD and AddAB member used by the RecBCD end-resection module.
