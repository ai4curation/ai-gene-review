- assessed_term:
    id: GO:0000725
    label: recombinational repair
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Holds for the double-strand-break processing helicase-nucleases RecB (SF23) and
    AddA (SF48), for FBH1 (SF30), which controls recombination-mediated repair at
    replication blocks, and for Arabidopsis SRS2-like (SF61), which processes
    recombinogenic intermediates and promotes single-strand annealing. It is not
    safe for SF2: yeast Srs2 regulates recombination, but the bacterial UvrD/PcrA
    majority act as anti-recombinases at blocked forks with no demonstrated role
    executing recombinational repair. PAINT places the term family-wide at
