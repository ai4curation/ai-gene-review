family_id: PANTHER:PTHR11070
family_name: UVRD / RECB / PCRA DNA HELICASE FAMILY MEMBER
preferred_name: UvrD-family superfamily 1A DNA helicases (UvrD, Rep, PcrA, RecB, AddA, HelD, Srs2, FBH1)
summary: >-
  A superfamily 1A (SF1A) family of ATP-dependent DNA helicases that share two
  RecA-like motor domains (the UvrD-like ATP-binding and C-terminal helicase
  domains) and translocate along single-stranded DNA with 3'-to-5' polarity.
  Members are found across bacteria and eukaryotes. They include the bacterial
  repair helicases UvrD (DNA helicase II), PcrA and mycobacterial UvrD1, which
  release excised oligonucleotides in nucleotide excision repair, unwind the
  error-containing strand in methyl-directed mismatch repair and strip RecA from
  blocked replication forks; the Rep replicative helicase; DNA helicase IV; the
  helicase/nuclease subunits of the bacterial double-strand-break processing
  machines RecB (RecBCD) and AddA (AddAB); and eukaryotic Srs2, Arabidopsis
  SRS2-like, F-box helicase FBH1 and mitochondrial Hmi1, which act as
  anti-recombinases or recombination regulators, at stalled forks, or in
  mitochondrial DNA maintenance. RecB (PTHR11070:SF23) carries a C-terminal
  PD-(D/E)XK nuclease domain and is the only nuclease subunit of the RecBCD
  (exodeoxyribonuclease V) complex; AddA (SF48) also carries a nuclease domain
  and acts with AddB. The 3'-to-5' helicase/translocase motor is the common
  element wherever it has been tested. The pathway each lineage uses it for, and
  accessory domains such as the RecB/AddA nuclease, the FBH1 F-box and the Srs2
  Rad51-displacement activity, belong to individual subfamilies. The RNA
  polymerase-recycling HelD/HelR motors and the Gabija anti-phage protein GajB
  are family members whose duplex-unwinding polarity has not been established.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The cached reviewed-member inventory has 209 members in 12 subfamilies: SF48
  AddA (140), SF2 UvrD/PcrA/UvrD1/Srs2 (35), SF23 RecB (12), SF64 Rep (6), SF30
  FBH1 (4), SF69 UvrD2 (4), SF45 HelR (3), and one each in SF3 (Gabija GajB),
  SF17 (B. subtilis HelD), SF46 (Hmi1), SF61 (Arabidopsis SRS2-like) and SF63
  (E. coli helicase IV). The ATP-driven 3'-to-5' DNA helicase motor is shared and
  is soundly placed at the LUCA node PTN000116141: experimentally characterised
  members of SF2, SF23, SF30, SF46, SF48, SF61, SF63 and SF64 are 3'-5' DNA
  helicases. HETEROGENEOUS is chosen over MOSTLY_COHERENT because, above the
  motor, members diverge in partners, accessory domains and pathways, so no
  specific term is safe at family level: (i) RecB and AddA add a nuclease domain
  and act in heteromeric end-resection complexes (RecBCD, AddAB); (ii)
  UvrD/PcrA/Rep act alone or as dimers in excision repair, mismatch repair,
  replication and anti-recombination; (iii) eukaryotic Srs2 and FBH1 act on
  Rad51 filaments and stalled forks, and Hmi1 in mtDNA maintenance; (iv) HelD/HelR
  (SF17, SF45) recycle RNA polymerase, and they, Gabija GajB (SF3) and UvrD2
  (SF69) have no established unwinding polarity in the cited evidence, so even
  3'-5' DNA helicase activity is scoped to the characterised subfamilies. SF2
  itself mixes bacterial UvrD/PcrA repair helicases with eukaryotic Srs2
  anti-recombinases. A pathway or complex term should therefore not be inferred
  from family membership alone, and modules ground UvrD on SF2 and RecB on SF23.
