notes: >-
  Reconciles two independently written reviews of this family: one written while
  promoting modules/bacterial_recbcd_end_resection.yaml, which grounds the RecB
  motor, nuclease and RecA-loading roles on PTHR11070:SF23, and one written for
  modules/bacterial_nucleotide_excision_repair.yaml, which grounds UvrD on
  PTHR11070:SF2. Node depth and descendant counts come from the PANTHER 19
  treeinfo service, summarised reproducibly in the cited RESULTS.md; node-to-
  subfamily coverage was read from the PAINT TreeGrafter annotation file (PANTHER
  19.0), which lists the GO terms inherited by each ancestral node together with
  its subfamily. Where the two reviews disagreed, the verdict backed by the
  evidence the other had named as missing was kept: recombinational repair at
  PTN000116141 is TOO_DEEP (UvrD fork-clearing and RecF-pathway evidence), nucleus
  at PTN000116143 NEEDS_PRUNING for the mitochondrial Hmi1 branch (SF46), the
  FBH1-clade nodes are SOUND on FBH1 primary papers, and the DNA helicase complex
  node is SOUND on the UvrD dimer evidence. 3'-5' DNA helicase activity is scoped
  SUBFAMILY_ONLY to the characterised subfamilies, which includes both module
  groundings (SF2, SF23); a grounding on the bare family id is therefore only
  scope-restricted. SF2, SF23 and SF48 are declared as subfamily entries; the
  other subfamilies are described in coherence_reason and named in term scopes.
  The SF2 label ATP-DEPENDENT DNA HELICASE SRS2 is PANTHER's official name,
  quoted verbatim; its reviewed members are mostly bacterial UvrD/PcrA. Seed
  identities were checked against the reviewed inventory and UniProt
  (SGD:S000005455 is Hmi1, CGD:CAL0000191199 is Candida Hmi1, PomBase:SPBC336.01
  is fbh1 and PomBase:SPAC4H3.05 is srs2).
