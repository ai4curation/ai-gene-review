    Eubacteria node PTN000116249). Each has an N-terminal UvrD-like 3'-to-5' helicase motor and a
    C-terminal nuclease domain, and acts only as a subunit of the RecBCD complex with RecC
    (PTHR30591) and RecD (PTHR43788:SF6). The nuclease domain and the complex membership set this
    subfamily apart from the motor-only UvrD/Rep/PcrA helicases.
