    UvrD (Q02322), M. genitalium PcrA (P47486), M. tuberculosis UvrD1 (P9WMQ1),
    Rep (P09980), helicase IV (P15038), RecB (P08394), AddA (P23478), yeast Srs2
    (SGD:S000003628) and Hmi1 (SGD:S000005455), Candida Hmi1 (CGD:CAL0000191199),
    S. pombe Fbh1 (SPBC336.01), human FBH1 (Q8NFZ0), Arabidopsis SRS2-like
    (AT4G25120) and a Plasmodium homolog (Q8I3W6). Every one is a 3'-5' helicase,
    so the SF1A motor polarity is ancestral and the node placement is right.
    PTN000116141 is the first annotated node below the unannotated root
    (PTN008960327); PANTHER 19 places it at LUCA, above 245 of the 248 leaves, and
    in the PAINT TreeGrafter file it descends to all subfamilies except SF65. For
    E. coli RecB the 3'-5' helicase function is independently curated by UniProt
    from experimental data; that RecB appears among the seeds is expected
    grounding, not circularity. The function is unverified for HelD/HelR (SF17,
    SF45), Gabija GajB (SF3) and UvrD2 (SF69), but no member is known to have lost
    it, so no pruning is proposed.
