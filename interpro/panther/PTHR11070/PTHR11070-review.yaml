term_assessments:
- assessed_term:
    id: GO:0043138
    label: 3'-5' DNA helicase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The UvrD-type 3'-to-5' motor is the shared activity of PTHR11070. It is SOUND at the LUCA node
    PTN000116141 and is independently curated for E. coli RecB. The module's RecB motor role uses
    this term on PTHR11070:SF23. Other subfamilies have the same activity, which is why the module
    selects RecB at the subfamily level and not at the family level.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11070/PTHR11070-paint.tsv
    supporting_text: "PTHR11070\tPTN000116141\tGO:0043138\tF\tIBD\tfalse"
  - reference_id: file:genes/ECOLI/recB/recB-uniprot.txt
    supporting_text: has ATP-dependent 3'-5' helicase function
- assessed_term:
    id: GO:0008854
    label: exodeoxyribonuclease V activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Exodeoxyribonuclease V activity needs the C-terminal PD-(D/E)XK nuclease domain and the RecBCD
    complex. A RecB fragment with only the N-terminal motor gives a holoenzyme with no nuclease
    activity. UvrD/Rep/PcrA lack the nuclease domain. AddA (SF48) has a nuclease domain but works in
    AddAB, a separate complex with a different two-nuclease mechanism. The term therefore applies to
    RecB (SF23) and is not a family-wide property. For SF23, it is a property of the RecB subunit
    acting within RecBCD.
  applicable_subfamilies:
  - id: PANTHER:PTHR11070:SF23
    label: RECBCD ENZYME SUBUNIT RECB
  supported_by:
  - reference_id: file:genes/ECOLI/recB/recB-uniprot.txt
    supporting_text: 'Holoenzyme reconstituted with this RecB N-terminal fragment has no nuclease activity'
  - reference_id: file:genes/ECOLI/recB/recB-uniprot.txt
    supporting_text: '/note="For nuclease activity"'
  - reference_id: PMID:17570399
    supporting_text: We show that this enzyme complex contains two active nuclease domains, each of which is dedicated to cleavage of one specific DNA strand.
- assessed_term:
    id: GO:0009338
    label: exodeoxyribonuclease V complex
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Only RecB proteins (SF23) are RecBCD subunits, and the PAINT node carrying the term
    (PTN000116249) covers exactly the SF23 leaves.
  applicable_subfamilies:
  - id: PANTHER:PTHR11070:SF23
    label: RECBCD ENZYME SUBUNIT RECB
  supported_by:
  - reference_id: file:analysis/module_audits/bacterial_recbcd_end_resection/RESULTS.md
