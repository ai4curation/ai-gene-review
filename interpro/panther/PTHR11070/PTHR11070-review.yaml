  label: ATP-DEPENDENT DNA HELICASE SRS2
  description: >-
    UvrD, PcrA, mycobacterial UvrD1 and eukaryotic Srs2. The bacterial members are
    3'-5' repair helicases acting in nucleotide excision repair, methyl-directed
    mismatch repair and RecA removal at blocked forks; yeast Srs2, despite giving
    the subfamily its name, is a 3'-5' helicase that dismantles Rad51 presynaptic
    filaments. The subfamily also contains uncharacterised members such as Gabija
    GajB of B. cereus VD045 and PcrA-short of Mycoplasma.
