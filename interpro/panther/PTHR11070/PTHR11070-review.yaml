notes: >-
  Written while promoting modules/bacterial_recbcd_end_resection.yaml, which uses PTHR11070:SF23 for
  the RecB motor, nuclease and RecA-loading roles. Node depth and descendant subfamilies come from
  the PANTHER 19 treeinfo service, summarized reproducibly in the cited RESULTS.md. The nodes that
  reach RecB are SOUND for the 3'-5' helicase, cytosol and exodeoxyribonuclease V complex rows.
  Recombinational repair at the LUCA node is true for RecB but stays UNRESOLVED family-wide,
  because evidence for the Rep and HelD clades was not examined. The eukaryote-only nodes (nucleus;
  FBH1 double-strand break repair and fork processing) and the UvrD/AddA helicase-complex node are
  outside the module and are recorded as UNRESOLVED, with the missing evidence named. The SF2 label
  ATP-DEPENDENT DNA HELICASE SRS2 is PANTHER's official name, quoted verbatim. Its reviewed members
  are mostly bacterial UvrD/PcrA.
