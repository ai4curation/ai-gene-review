- subfamily_id: PANTHER:PTHR11070:SF23
  label: RECBCD ENZYME SUBUNIT RECB
  description: >-
    RecB proteins of RecBCD-encoding bacteria (14 leaves in the PANTHER 19 tree,
    all below the Eubacteria node PTN000116249). Each has an N-terminal UvrD-like
    3'-to-5' helicase motor shared with the family and a C-terminal nuclease
    domain, and acts only as a subunit of the RecBCD double-strand-break
    processing complex with RecC (PTHR30591) and RecD (PTHR43788:SF6). The
    nuclease domain, the RecC/RecD interactions and RecA loading set this
    subfamily apart from the motor-only UvrD/Rep/PcrA helicases.
