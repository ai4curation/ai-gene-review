- subfamily_id: PANTHER:PTHR11070:SF2
  label: ATP-DEPENDENT DNA HELICASE SRS2
  description: >-
    Despite PANTHER's name, the reviewed members of this subfamily are mostly
    bacterial UvrD/PcrA helicases, such as E. coli DNA helicase II (UvrD), P.
    putida UvrD and M. tuberculosis UvrD1, along with yeast Srs2. The bacterial
    members are 3'-5' repair helicases acting in nucleotide excision repair,
    methyl-directed mismatch repair and RecA removal at blocked forks; yeast Srs2
    is a 3'-5' helicase that dismantles Rad51 presynaptic filaments. They are
    motor-only helicases with no nuclease domain and no RecBCD-type heteromeric
    resection partner. The subfamily also contains uncharacterised members such
    as Gabija GajB of B. cereus VD045 and PcrA-short of Mycoplasma.
