family_id: PANTHER:PTHR11070
family_name: UVRD / RECB / PCRA DNA HELICASE FAMILY MEMBER
preferred_name: UvrD/Rep/PcrA superfamily 1A DNA helicase family
summary: >-
  A superfamily 1A (SF1A) family of ATP-dependent DNA helicases that share two
  RecA-like motor domains (the UvrD-like ATP-binding and C-terminal helicase
  domains) and translocate along single-stranded DNA with 3'-to-5' polarity.
  Members include the bacterial repair helicases UvrD (DNA helicase II), PcrA
  and mycobacterial UvrD1, which release excised oligonucleotides in nucleotide
  excision repair, unwind the error-containing strand in methyl-directed mismatch
  repair and strip RecA from blocked replication forks; the Rep replicative
  helicase; DNA helicase IV; the helicase subunits of the bacterial
  double-strand-break processing machines RecB (RecBCD) and AddA (AddAB), which
  add a C-terminal nuclease domain to the shared motor; and eukaryotic Srs2,
  Arabidopsis SRS2-like, F-box helicase FBH1 and mitochondrial Hmi1, which act as
  anti-recombinases or recombination regulators, at stalled forks, or in
  mitochondrial DNA maintenance. The 3'-to-5' helicase/translocase motor is
  conserved wherever it has been tested; the biological pathway each lineage
  uses it for, and accessory domains such as the RecB/AddA nuclease, the FBH1
  F-box and the Srs2 Rad51-displacement activity, differ between subfamilies.
  The RNA polymerase-recycling HelD/HelR motors and the Gabija anti-phage protein
  GajB are family members whose duplex-unwinding polarity has not been
  established.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The cached reviewed-member inventory has 209 members in 12 subfamilies: SF48
  AddA (140), SF2 UvrD/PcrA/UvrD1/Srs2 (35), SF23 RecB (12), SF64 Rep (6), SF30
  FBH1 (4), SF69 UvrD2 (4), SF45 HelR (3), and one each in SF3 (Gabija GajB),
  SF17 (B. subtilis HelD), SF46 (Hmi1), SF61 (Arabidopsis SRS2-like) and SF63
  (E. coli helicase IV). The molecular function is coherent: experimentally
  characterised members of SF2, SF23, SF30, SF46, SF48, SF61, SF63 and SF64 are
  3'-5' DNA helicases (PAINT seeds of PTN000116141 plus direct polarity assays).
  Coherence is limited by (i) pathway roles, which diverge between subfamilies
  (excision and mismatch repair for UvrD/PcrA, double-strand-break end resection
  for RecB/AddA, recombination control for Srs2/FBH1, mtDNA maintenance for
  Hmi1), (ii) the RecB/AddA nuclease and complex membership, and (iii) RNA
  polymerase-recycling HelD/HelR (SF17, SF45), Gabija GajB (SF3) and UvrD2
  (SF69), whose unwinding polarity is not established in the cited evidence.
  SF2 itself mixes bacterial UvrD/PcrA repair helicases with eukaryotic Srs2
  anti-recombinases.
