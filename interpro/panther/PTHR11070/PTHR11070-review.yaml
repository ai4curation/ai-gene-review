    label: exodeoxyribonuclease V activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Exodeoxyribonuclease V activity needs the C-terminal PD-(D/E)XK nuclease domain
    and the RecBCD complex. A RecB fragment with only the N-terminal motor gives a
    holoenzyme with no nuclease activity. UvrD/Rep/PcrA lack the nuclease domain.
    AddA (SF48) has a nuclease domain but works in AddAB, a separate complex with a
    different two-nuclease mechanism. The term therefore applies to RecB (SF23) and
    is not a family-wide property. For SF23, it is a property of the RecB subunit
    acting within RecBCD.
