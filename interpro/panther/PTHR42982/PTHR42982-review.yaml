family_id: PANTHER:PTHR42982
family_name: SEC-INDEPENDENT PROTEIN TRANSLOCASE PROTEIN TATA
preferred_name: TatA/E family (translocating subunit of Tat systems)
summary: >-
  TatA/E proteins are small single-spanning inner-membrane proteins with an
  amphipathic helix that form the translocating element of twin-arginine
  translocation (Tat) systems. After a folded precursor binds the TatBC receptor,
  TatA protomers are recruited in a proton-motive-force-dependent manner and
  oligomerize into assemblies of variable size through which the substrate
  crosses the membrane. The family includes proteobacterial TatA, the
  enterobacterial late paralog TatE, actinobacterial TatA, and the TatA
  paralogs of Gram-positive TatAC systems such as Bacillus subtilis.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member is a TatA-type subunit of a Tat translocase. The
  PAINT node PTN002452729, seeded by E. coli TatA, E. coli TatE and P.
  aeruginosa TatA, carries the Tat complex, transporter and process terms with
  no loss rows. TatE has additional TatB-like signal-peptide contacts but can
  replace TatA, so the shared terms hold. The family slice also contains rows of
  the TatB-clade node PTN002109144, which reach the B. subtilis TatA paralogs and
  a Leptospira TatA through leaf IBA rows; their transport terms are also true
  for these single-TatA-type systems.
