term_assessments:
- assessed_term:
    id: GO:0003849
    label: 3-deoxy-7-phosphoheptulonate synthase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The family-defining reaction, catalysed by every characterized member in bacteria and fungi.
    This is the activity the shikimate module asserts for the PTHR21225 implementation of the
    DAHP synthase step. Inhibitor specificity varies between paralogs but is a regulatory
    property, not a different activity.
  supported_by:
  - reference_id: PMID:2880280
    supporting_text: Gene ARO3, coding for the phenylalanine-dependent isozyme of DAHP synthase
  - reference_id: PMID:12540830
    supporting_text: An exchange of glycine to serine and vice versa leads to a complete change in
      the regulation pattern.
- assessed_term:
    id: GO:0009073
    label: aromatic amino acid biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    All characterized members feed the shikimate pathway, whose product chorismate is the
    precursor of the aromatic amino acids.
  supported_by:
  - reference_id: PMID:12540830
    supporting_text: The initial enzyme of shikimate biosynthesis possesses the additional feature
      of feedback regulation.
- assessed_term:
    id: GO:0009423
    label: chorismate biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    The process the module and the member gene reviews (ARO3, ARO4, P. putida aroF-I and aroF-II)
    use as the direct process for this step. DAHP synthesis is the first committed step of the
    pathway to chorismate in all members. PAINT asserts only the broader aromatic amino acid
    process in this family.
  supported_by:
  - reference_id: PMID:12540830
    supporting_text: The initial enzyme of shikimate biosynthesis
- assessed_term:
    id: GO:0005737
    label: cytoplasm
  scope: FAMILY_WIDE
  scope_reason: Soluble cytoplasmic enzymes in all characterized bacterial and fungal members.
