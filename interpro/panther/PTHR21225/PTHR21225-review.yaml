  assessment_reason: >-
    DAHP synthase supplies the shikimate pathway, whose end product chorismate is the precursor
    of all three aromatic amino acids, and every known member works in that pathway. The ARO3 and
    ARO4 reviews accept this IBA. The more specific process the module uses, chorismate
    biosynthetic process (GO:0009423), is not asserted by PAINT in this family.
