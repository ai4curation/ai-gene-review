notes: >-
  Used by modules/bacterial_shikimate_chorismate_biosynthesis.yaml (DAHP synthase step,
  pthr21225_dahp_synthase_variant) with the family-level selector PANTHER:PTHR21225 and
  GO:0003849; that selector is safe. Topology from the PANTHER 19 treeinfo service filtered to
  model organisms: PTN000476971 (LUCA) splits into an Ascomycota node (PTN000476972, with the
  ARO3 and ARO4 paralog clades and the S. pombe duplication PTN009044408) and a bacterial
  duplication node (PTN002327026: aroF, aroH, aroG). PAINT gives the root node no taxon. P.
  putida aroF-I (Q88KG6) is in SF10 and aroF-II (Q88IB9) in SF12 according to their UniProt
  PANTHER cross-references; P. putida is not in the PAINT UniProt GAF, so they receive no IBA.
