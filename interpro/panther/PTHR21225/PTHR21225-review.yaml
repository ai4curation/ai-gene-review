family_id: PANTHER:PTHR21225
family_name: PHOSPHO-2-DEHYDRO-3-DEOXYHEPTONATE ALDOLASE  DAHP SYNTHETASE
preferred_name: Type I (AroF/AroG/AroH, ARO3/ARO4) DAHP synthases
summary: >-
  Type I 3-deoxy-D-arabino-heptulosonate 7-phosphate (DAHP) synthases, (beta/alpha)8-barrel
  enzymes that condense phosphoenolpyruvate and D-erythrose 4-phosphate to DAHP, the first
  committed step of the shikimate pathway to chorismate. Members are the bacterial AroF, AroG and
  AroH isoenzymes (E. coli, Salmonella, Haemophilus, Corynebacterium, Pseudomonas) and the fungal
  ARO3/ARO4 isoenzymes (S. cerevisiae, Candida, S. pombe aro3 and aro4). Organisms commonly carry
  two or three paralogs that differ in which aromatic amino acid feedback-inhibits them; the
  reaction is the same. The type II DAHP synthases of plants and actinobacteria are a separate
  PANTHER family (PTHR21337).
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member catalyses the same reaction, and PAINT places the activity,
  cytoplasm and aromatic amino acid biosynthesis at the family root (PTN000476971), above both the
  ascomycete ARO3/ARO4 clade and the gammaproteobacterial AroF/AroG/AroH clade. The members
  differ in feedback-inhibitor specificity, which is set by small sequence changes (a single
  Gly/Ser exchange switches yeast Aro4p between tyrosine and phenylalanine regulation), not by
  deep divergence. The PANTHER subfamily names track inhibitor specificity only loosely: SF12
  "TYROSINE-INHIBITED" holds yeast ARO4 (tyrosine-inhibited) together with E. coli AroG, which
  UniProt names Phe-sensitive. No GO term about inhibitor specificity is asserted, so this does
  not affect any term scope here.
