  name:
    name: Diphosphoinositol polyphosphate phosphohydrolases
    short: DIPP_phosphohydrolases
  description:
  - text: This family of proteins is involved in the hydrolysis of various phosphate-containing
      substrates, including diphosphoinositol polyphosphates and dinucleoside oligophosphates.
      Members exhibit phosphohydrolase activity, cleaving beta-phosphates from diphosphate
      groups in substrates such as PP-InsP5 and [PP]2-InsP4, which may implicate them
      in signal transduction pathways. Some family members also act as decapping enzymes,
      modulating mRNA stability by removing caps from RNA molecules, and have been
      associated with cellular responses to oxidative stress. The substrate specificity
      and activity of these enzymes can be influenced by the presence of divalent
      cations such as zinc, magnesium, and manganese.
