- site_id: epe1_jmjc_fe_triad
  label: Epe1 JmjC Fe(II)-binding triad
  description: >-
    Three Epe1 JmjC-domain positions in O94603 numbering that mark the
    non-canonical Fe(II)-binding pocket behind the Epe1 demethylase loss call:
    His297 and Glu299 are curated as catalytic Fe-cation binding residues by
    UniProt, while Tyr370 replaces the third histidine used by canonical
    histone demethylases.
