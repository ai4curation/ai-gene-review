    organism: Homo sapiens
  diverged_from_family: true
  divergence_description: >-
    The clade has lost the histone demethylase annotations inherited from
    PTN000564171 and gained ubiquitin-like ligase-substrate adaptor activity.
- clade_node_id: PANTHER:PTN000564301
  description: >-
    Nine-leaf fungal JHD1/Epe1 clade. It holds S. cerevisiae Jhd1, a seed for
    histone demethylase activity, and S. pombe Epe1, which has retained
    anti-silencing JmjC biology but lost detectable demethylase activity.
  representative_members:
  - id: UniProtKB:P40034
    label: JmjC domain-containing histone demethylation protein 1
    gene_symbol: JHD1
    organism: Saccharomyces cerevisiae
  - id: UniProtKB:O94603
    label: Putative JmjC domain-containing histone demethylation protein 1
    gene_symbol: Epe1
    organism: Schizosaccharomyces pombe
    gene_review: genes/SCHPO/Epe1/Epe1-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    This clade spans both active JHD1 enzymes and the Epe1 leaf whose
    GO:0032452 inheritance needs a key-residue loss; the current PANTHER
    subfamilies do not represent that functional split cleanly enough for a
    subfamily-wide pruning call.
- subfamily_id: PANTHER:PTHR23123:SF37
  label: JMJC DOMAIN-CONTAINING PROTEIN-RELATED
  clade_node_id: PANTHER:PTN000564307
  description: >-
    S. pombe Epe1 leaf. Epe1 has an H297-E299-Y370 JmjC Fe(II)-binding triad
    instead of the canonical His/acidic/His triad and no detected H3K9 peptide
    demethylase activity, even in the presence of excess Swi6.
  representative_members:
  - id: UniProtKB:O94603
    label: Putative JmjC domain-containing histone demethylation protein 1
    gene_symbol: Epe1
    organism: Schizosaccharomyces pombe
    gene_review: genes/SCHPO/Epe1/Epe1-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Loss of canonical histone demethylase activity through substitution of the
    third Fe(II) ligand and rewiring of the JmjC domain toward non-catalytic
    Swi6/HP1-dependent heterochromatin regulation.
