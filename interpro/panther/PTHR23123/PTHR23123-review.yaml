    role: catalytic Fe(II)-binding glutamate
  - position: 370
    expected:
    - Y
    role: non-canonical third Fe(II)-ligand position
  required_for:
  - term:
      id: GO:0032452
      label: histone demethylase activity
    strength: ASSOCIATED
    rationale: >-
      The first two positions are retained Fe(II)-binding residues and the third
      is a non-canonical Tyr substitution at the site occupied by His in active
      JmjC demethylases. Together with the undetected Epe1 histone demethylase
      activity and PomBase NOT annotation, this H297-E299-Y370 signature
      supports a leaf-specific key-residue loss, but Tyr370 itself is needed
      for Epe1 anti-silencing in vivo, so the site is recorded as associated
      with the loss rather than as a standalone catalytic knockout.
