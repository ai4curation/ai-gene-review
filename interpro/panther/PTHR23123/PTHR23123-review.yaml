family_id: PANTHER:PTHR23123
family_name: PHD/F-BOX CONTAINING PROTEIN
preferred_name: JHDM1/KDM histone demethylases and JmjC-derived pseudoenzymes
summary: >-
  PTHR23123 groups JmjC-domain chromatin regulators from the KDM2, PHF, KDM7,
  FBXL19, and fungal JHD1/Epe1 lineages. Several branches encode active
  2-oxoglutarate/Fe(II)-dependent histone lysine demethylases, while other
  branches have diverged: vertebrate FBXL19 proteins are SCF substrate
  adaptors, and Schizosaccharomyces pombe Epe1 is a non-canonical JmjC
  anti-silencing factor with no detected histone demethylase activity in
  purified assays. The root PAINT IBD for histone demethylase activity should
  therefore be pruned at the Epe1 leaf.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family is held together by JmjC-domain homology, but its members are not
  uniformly active histone demethylases. PAINT already blocks histone
  demethylase activity from the FBXL19 branch, which has F-box ubiquitin-ligase
  adaptor functions, and the fission-yeast Epe1 branch has a non-canonical
  Fe(II) ligand and lacks detectable H3K9 peptide demethylase activity in
  vitro.
