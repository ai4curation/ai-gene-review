notes: >-
  This review is intentionally narrow: it records the PAINT fix needed for the
  S. pombe Epe1 histone demethylase over-propagation from batch-N05. The other
  PTN000564171 root IBDs, the narrower H3K9/H3K36 demethylase IBDs, and the
  FBXL19 ubiquitin-ligase adaptor gains were not exhaustively reassessed here.
