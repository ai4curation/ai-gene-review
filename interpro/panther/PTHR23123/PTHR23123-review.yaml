  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The root IBD is supported for catalytically active JHDM1/KDM demethylase
    branches, but it still descends to S. pombe Epe1 at PTN000564307. Epe1 is
    in the nine-leaf fungal JHD1 clade PTN000564301 with the S. cerevisiae Jhd1
    seed, but the Epe1 leaf has a non-canonical H297-E299-Y370 Fe(II) triad and
    purified Epe1 failed to demethylate H3K9me2 or H3K9me3 peptides with or
    without Swi6. PAINT already records rapid-divergence losses for
    GO:0032452 and GO:0032454 at the FBXL19 clade PTN008591189; an IKR on the
    S. pombe Epe1 leaf would block the same ancestral demethylase term from a
    distinct non-catalytic branch while leaving S. cerevisiae Jhd1 and the
    other active seed clades intact.
