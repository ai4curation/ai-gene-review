  description:
  - text: The JHDM1 histone demethylase family is involved in the regulation of gene
      expression through the specific demethylation of histone lysine residues, which
      is central to the histone code. Members of this family demethylate various lysine
      positions on histone H3, such as 'Lys-4', 'Lys-9', 'Lys-27', 'Lys-36', and on
      histone H4 'Lys-20', with preferences for certain methylation states. These
      demethylases play key roles in processes such as brain development, cell cycle
      progression, transcriptional regulation, and maintenance of heterochromatin
      stability. Some family members also have non-histone substrates, influencing
      other cellular pathways. The family includes proteins with domains such as JmjC,
      PHD-type zinc fingers, CXXC zinc fingers, and F-box domains, which contribute
      to their demethylase activity, substrate specificity, and additional cellular
      functions.
