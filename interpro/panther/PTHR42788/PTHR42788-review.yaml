family_id: PANTHER:PTHR42788
family_name: TAURINE IMPORT ATP-BINDING PROTEIN-RELATED
preferred_name: Nucleotide-binding subunits of binding-protein-dependent ABC importers (SsuB/TauB/NrtC class)
summary: >-
  Cytoplasmic ATPase (nucleotide-binding domain) subunits that energise
  binding-protein-dependent ABC import systems. Each member provides the Walker A/B
  nucleotide-binding fold, dimerises, and couples ATP hydrolysis to substrate translocation
  by its partner permease. The family is organised by the transported substrate: SsuB for
  aliphatic sulfonates, TauB for taurine, NrtC/NrtD and CmpD for cyanobacterial nitrate and
  bicarbonate uptake, ThiZ for a thiamine degradation product, and several uncharacterized
  groups. In Escherichia coli SsuB and TauB are 40.4% identical, the closest pair among the
  Ssu and Tau components, yet the two systems still cannot be mixed: strains able to form
  only hybrid transporters failed to grow on sulfonates. Many genomes carry more than one
  ssuB-like gene (ssuB1/ssuB2 in Burkholderia and Pseudomonas aeruginosa, split across two
  subfamilies), so paralog identity should be checked before transferring a specific role.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The ATPase activity and the ABC-importer complex role are shared and can be asserted
  family-wide, but the substrate carried by the partner permease differs across subfamilies
  (sulfonates, taurine, nitrate, bicarbonate, vitamins), so substrate-specific transporter
  terms are subfamily claims. PANTHER additionally splits the SsuB-named proteins across
  SF13, SF17 and SF19, and gives SF13 and SF17 the same official name while SF13 also
  contains NrtD and uncharacterized Brucella proteins, so subfamily names alone do not
  establish substrate here.
