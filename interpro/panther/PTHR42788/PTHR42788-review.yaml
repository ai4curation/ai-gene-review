family_id: PANTHER:PTHR42788
family_name: TAURINE IMPORT ATP-BINDING PROTEIN-RELATED
preferred_name: NitT/TauT-type ABC transporter ATP-binding protein family
summary: >-
  ATP-binding (nucleotide-binding domain) subunits of NitT/TauT-type ABC
  importers. They hydrolyse ATP to drive uptake through the partner permease.
  Subfamilies serve different systems: aliphatic sulfonates (SsuB, SF13, SF17 and
  SF19), taurine (TauB, SF18), and nitrate/nitrite or bicarbonate in
  cyanobacteria (NrtC, NrtD, SF7). Synechococcus elongatus PCC 7942 NrtC (P38045)
  and NrtD (P38046) are the two ATP-binding subunits of NrtABCD; NrtC carries an
  extra C-terminal domain that mediates ammonium-promoted inhibition of the
  transporter.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  ATP hydrolysis coupled to ABC import is shared, but the transported substrate
  is a property of the system, so substrate-specific terms are subfamily
  properties. The regulatory C-terminal extension is specific to cyanobacterial
  NrtC.
