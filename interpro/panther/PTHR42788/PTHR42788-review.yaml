notes: >-
  Reviewed while completing the bacterial alkanesulfonate uptake and desulfonation module
  (modules/bacterial_alkanesulfonate_uptake_desulfonation.yaml), which grounds the SsuB role
  to SF17. Both of this family's PAINT rows sit at one broad node and carry only generic ABC
  architecture terms, which is why both are sound despite the node's depth; no
  substrate-specific term is propagated from it. The split of SsuB-named proteins across
  SF13, SF17 and SF19, with SF13 and SF17 sharing an official name, is the main hazard for
  anyone grounding a module to a subfamily of this family.
  Reconciled with the bacterial assimilatory nitrate reduction module (PR #5928) after
  PR #5917 merged. This review is kept as the base; every subfamily, node assessment, term
  scope and reference here comes from it. The nitrate module's additions sit beside them:
  the PCC 7942 NrtC and NrtD representatives in SF7, a family-wide GO:0016887 ATP hydrolysis activity scope and an SF7-scoped GO:0015414 ABC-type nitrate transporter activity term. GO:0042959 is kept as this review scoped it, SF17 only. Both reviews assessed the two PTN001198515 rows as SOUND, so no verdict changed.
  The GO:0015414 SF7 scope excepts the three CmpD bicarbonate ATPases (Q55108, Q55463, Q5MZ53) and the C. difficile tyrosine-uptake ATPase P0DX43 on their curated UniProt FUNCTION lines (PR #5928 review); SF7 composition is from a csv parse of PTHR42788-entries.csv.
  Updated while completing the taurine uptake and desulfonation module (modules/taurine_uptake_and_desulfonation.yaml): E. coli and P. putida KT2440 TauB added to SF18 with their gene reviews, SF18 added to the GO:0042959 scope (GO:0015411 is_a GO:0042959, and TauABC imports other sulfonates), and an SF18-scoped GO:0015411 term added; SF18 composition (46 members, all TauB) is from a csv parse of PTHR42788-entries.csv. No node verdict changed.
