notes: >-
  Reviewed while completing the bacterial alkanesulfonate uptake and desulfonation module
  (modules/bacterial_alkanesulfonate_uptake_desulfonation.yaml), which grounds the SsuB role
  to SF17. Both of this family's PAINT rows sit at one broad node and carry only generic ABC
  architecture terms, which is why both are sound despite the node's depth; no
  substrate-specific term is propagated from it. The split of SsuB-named proteins across
  SF13, SF17 and SF19, with SF13 and SF17 sharing an official name, is the main hazard for
  anyone grounding a module to a subfamily of this family.
