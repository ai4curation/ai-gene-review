- subfamily_id: PANTHER:PTHR42788:SF13
  label: ALIPHATIC SULFONATES IMPORT ATP-BINDING PROTEIN SSUB
  description: >-
    A second SsuB-named group, holding the Firmicutes ssuB proteins (Bacillus subtilis
    P97027 and the Bacillus cereus group) together with Synechocystis NrtD and
    uncharacterized Brucella and Methanocaldococcus ATPases. Its official name is identical
    to SF17's, so the two are distinguished here by membership, and its mixed content means
    membership alone does not imply sulfonate transport.
  representative_members:
  - id: UniProtKB:P97027
    gene_symbol: ssuB
    organism: Bacillus subtilis 168
  diverged_from_family: false
  divergence_description: >-
    Not a divergence in the ATPase role, but the subfamily is not substrate-homogeneous: it
    mixes Firmicutes SsuB with a cyanobacterial nitrate-transport ATPase.
- subfamily_id: PANTHER:PTHR42788:SF18
  label: TAURINE IMPORT ATP-BINDING PROTEIN TAUB
  description: The TauB group, ATPase of the taurine importer, chiefly in Burkholderiales.
  representative_members:
  - id: UniProtKB:A0KAV6
    gene_symbol: tauB
    organism: Burkholderia cenocepacia HI2424
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR42788:SF7
  label: NITRATE ABC TRANSPORTER ATP-BINDING PROTEIN
  description: >-
    Cyanobacterial NrtC/NrtD and CmpD ATPases for nitrate and bicarbonate uptake, plus
    Klebsiella NasD.
  representative_members:
  - id: UniProtKB:Q55108
    gene_symbol: cmpD
    organism: Synechococcus elongatus PCC 7942
  diverged_from_family: true
  divergence_description: >-
    Inorganic nitrogen and carbon acquisition rather than organosulfur scavenging; sulfur
    transport and sulfur-starvation terms must not descend here.
node_assessments:
- node_id: PANTHER:PTN001198515
  asserted_term:
    id: GO:0140359
    label: ABC-type transporter activity
  evidence: IBD
  paint_snapshot: '20260530'
  seeds:
  - id: UniProtKB:P31134
    gene_symbol: potG
    organism: Escherichia coli K-12
  - id: UniProtKB:P69874
    gene_symbol: potA
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    The seeds are the E. coli polyamine-import ATPases PotA and PotG, and the term asserted
    is the generic ABC-type transporter activity, not a substrate-specific one. The node is
    deliberately deep, covering about 77 leaves that include SsuB, TauB, NrtC/NrtD, ModC,
    CysA, GlnQ, ThiQ, MetN, PhnT and archaeal and plant members, which is exactly the set
    for which the claim holds: all are nucleotide-binding subunits of ABC transporters. The
    polyamine seeds do not make it a polyamine claim, so no pruning is needed.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42788/PTHR42788-paint.tsv
    supporting_text: "PTHR42788\tPTN001198515\tGO:0140359\tF\tIBD\tfalse\tUniProtKB:P31134|UniProtKB:P69874"
  - reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC101965_.md
    supporting_text: SsuB and of TauC and SsuC are significantly similar to those of ATP-binding proteins
      and integral membrane components, respectively, of members of the ABC transporter superfamily
- node_id: PANTHER:PTN001198515
  asserted_term:
    id: GO:0005886
    label: plasma membrane
  evidence: IBD
  paint_snapshot: '20241203'
  seeds:
  - id: UniProtKB:P69874
    gene_symbol: potA
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    ABC ATPase subunits are peripherally associated with the cytoplasmic face of the
    membrane through their permease partners rather than being integral to it, and GO's
    plasma membrane term accommodates that association; it is how the subunits of these
    import complexes are consistently annotated. The claim is architectural and therefore
    safe at the same broad node as the activity row. Strictly, the subunit is cytoplasmic
    and membrane-associated, so a curator preferring a complex term (ABC transporter
    complex) over a membrane location would not be contradicting the biology; that is a
    term-choice question rather than a node-placement error.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42788/PTHR42788-paint.tsv
    supporting_text: "PTHR42788\tPTN001198515\tGO:0005886\tC\tIBD\tfalse\tUniProtKB:P69874"
term_assessments:
- assessed_term:
    id: GO:0140359
    label: ABC-type transporter activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member is the nucleotide-binding subunit of an ABC transporter and contributes
    the ATP hydrolysis that drives transport.
  supported_by:
  - reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC101965_.md
    supporting_text: SsuB and of TauC and SsuC are significantly similar to those of ATP-binding proteins
      and integral membrane components, respectively, of members of the ABC transporter superfamily
- assessed_term:
    id: GO:0042959
    label: ABC-type alkanesulfonate transporter transporter activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Restricted to the SsuB groups, and even there it is a claim about the complex the
    subunit joins rather than about the subunit alone. TauB energises taurine uptake and the
    nitrate, bicarbonate and vitamin subfamilies transport unrelated substrates. The
    non-exchangeability of the E. coli Ssu and Tau components, despite 40.4% identity
    between SsuB and TauB, is the direct evidence that the specificity is not transferable
    across the family.
  applicable_subfamilies:
  - id: PANTHER:PTHR42788:SF17
    label: ALIPHATIC SULFONATES IMPORT ATP-BINDING PROTEIN SSUB
  supported_by:
  - reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC101965_.md
    supporting_text: Mutants in which only formation of hybrid transporters was possible were unable
      to grow with sulfonates, indicating that the individual components of the two transport systems
      were not functionally exchangeable.
