    gene_review: genes/SYNE7/nrtD/nrtD-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    The SF7 members energise nitrate/nitrite import for assimilation rather than
    sulfonate or taurine uptake, and NrtC has gained a C-terminal regulatory
    domain.
  supported_by:
