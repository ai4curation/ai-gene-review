family_id: PANTHER:PTHR43181
family_name: 2-C-METHYL-D-ERYTHRITOL 2,4-CYCLODIPHOSPHATE SYNTHASE, CHLOROPLASTIC
preferred_name: IspF ME-CPP synthase family
summary: >-
  IspF enzymes are trimeric, divalent-metal-dependent lyases that cyclize
  4-diphosphocytidyl-2-C-methyl-D-erythritol 2-phosphate (CDP-ME2P) to 2-C-methyl-D-erythritol
  2,4-cyclodiphosphate (ME-CPP) with release of CMP, the fifth reaction of the methylerythritol
  phosphate (MEP) pathway. The family contains bacterial IspF (E. coli, B. subtilis,
  M. tuberculosis, P. putida), the plastid ISPF of plants and the apicoplast IspF of Plasmodium.
functional_coherence: COHERENT
coherence_reason: >-
  The two subfamilies of the PANTHER 19 tree both carry the IspF name (SF1, 79 leaves; SF3, 4 plant
  leaves), and the root node carrying the IspF activity is seeded by bacterial enzymes; no member is
  known to have a different activity.
