- node_id: PANTHER:PTN000781796
  asserted_term:
    id: GO:0016114
    label: terpenoid biosynthetic process
  evidence: IBD
  paint_snapshot: '20260828'
  seeds:
  - id: AGI_LocusCode:AT1G63970
  - id: UniProtKB:P9WKG5
  assessment: UNRESOLVED
  assessment_reason: >-
    IspF makes an intermediate of IPP and DMAPP synthesis, which are the precursors of all terpenoids.
    GO does not place the MEP pathway (GO:0019288) under terpenoid biosynthesis, so this broad term
    says that the enzyme takes part in making the downstream terpenoids, a precursor-supply reading
    that the module curation does not adopt. The specific GO:0019288 describes the step. Whether the
    precursor enzymes should carry the terpenoid term is left to the GO convention.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43181/PTHR43181-paint.tsv
    supporting_text: "PTHR43181\tPTN000781796\tGO:0016114\tP\tIBD\tfalse"
- node_id: PANTHER:PTN001281128
  asserted_term:
    id: GO:0015995
    label: chlorophyll biosynthetic process
  evidence: IBD
  paint_snapshot: '20250919'
  seeds:
  - id: AGI_LocusCode:AT1G63970
  assessment: UNRESOLVED
  assessment_reason: >-
    Viridiplantae node (50 leaves) seeded by Arabidopsis ISPF. Plastid IspF supplies the isoprenoid
    precursors of the chlorophyll phytol chain, so loss of the enzyme blocks chlorophyll accumulation;
    that is precursor necessity rather than a step of chlorophyll synthesis. No reviewed plant member
    in this repository settles whether the term should stand.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43181/PTHR43181-paint.tsv
    supporting_text: "PTHR43181\tPTN001281128\tGO:0015995\tP\tIBD\tfalse"
  - reference_id: file:analysis/module_audits/mep_isoprenoid_precursor_biosynthesis/RESULTS.md
    supporting_text: "| PTN001281128 | yes | INTERNAL | SPECIATION | Viridiplantae | 50 |"
- node_id: PANTHER:PTN001281128
  asserted_term:
    id: GO:0016117
    label: carotenoid biosynthetic process
  evidence: IBD
  paint_snapshot: '20250919'
  seeds:
  - id: AGI_LocusCode:AT1G63970
  assessment: UNRESOLVED
  assessment_reason: >-
    Same reasoning as the chlorophyll row: carotenoids are built from MEP-derived prenyl diphosphates,
    so the plant ISPF is necessary for them, but its own reaction is an MEP-pathway step.
  supported_by:
