  name:
    name: 26S Proteasome Regulatory ATPase
    short: 26S_Proteasome_ATPase
  description:
  - text: This family of proteins is involved in the ATP-dependent degradation of
      ubiquitinated proteins. Members function as regulatory subunits within the 26S
      proteasome complex, which plays a crucial role in maintaining cellular protein
      homeostasis. They participate in unfolding ubiquitinated target proteins that
      are then translocated into a proteolytic chamber for degradation into peptides.
      This process is essential for the removal of misfolded or damaged proteins and
      for regulating the levels of proteins involved in various cellular processes,
      including cell cycle progression, apoptosis, and DNA damage repair. Some family
      members are also implicated in the recognition, binding, and translocation of
      substrate proteins into the archaeal 20S proteasome core particle, essential
      for proteolytic gate opening.
