family_id: PANTHER:PTHR10578
family_name: S -2-HYDROXY-ACID OXIDASE-RELATED
preferred_name: FMN-dependent 2-hydroxy-acid oxidase/dehydrogenase family
summary: >-
  PTHR10578 contains FMN-dependent alpha-hydroxy-acid oxidases and dehydrogenases.
  Human HAO1 and HAO2 are soluble peroxisomal oxidases that use O2 as acceptor
  and produce H2O2, but they differ in substrate preference: HAO1 preferentially
  oxidizes glycolate to glyoxylate and can oxidize glyoxylate, while HAO2 is most
  active on medium- and long-chain 2-hydroxy fatty acids such as 2-hydroxypalmitate.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The broad FMN-dependent (S)-2-hydroxy-acid oxidase/dehydrogenase fold is coherent,
  but PAINT correctly separates human HAO1-specific glycolate catabolism and glyoxylate
  oxidase activity from the human HAO2 branch. The family also contains bacterial
  lactate and other specialized dehydrogenases that were outside this human HAO1/HAO2
  review.
