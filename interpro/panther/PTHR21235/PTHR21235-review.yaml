family_id: PANTHER:PTHR21235
family_name: IMIDAZOLE GLYCEROL PHOSPHATE SYNTHASE SUBUNIT HISF/H  IGP SYNTHASE SUBUNIT HISF/H
preferred_name: HisF imidazole glycerol phosphate synthase cyclase family
summary: >-
  TIM-barrel cyclases of imidazole glycerol phosphate (IGP) synthase. SF2 holds the HisF cyclase
  that converts PRFAR, with ammonia, to IGP and AICAR in the fifth step of histidine biosynthesis:
  standalone bacterial and archaeal HisF subunits (Pseudomonas putida hisF, Escherichia coli hisF),
  which take ammonia from a separate HisH glutaminase subunit, and the fungal and plant HisHF
  fusion proteins (Saccharomyces cerevisiae HIS7, Schizosaccharomyces pombe his4, Emericella
  nidulans hisHF, Arabidopsis chloroplastic hisHF) in which a HisH glutamine amidotransferase
  domain is fused N-terminal to the cyclase. SF22 is a group of geranylgeranylglyceryl phosphate
  synthases (GGGPS, PcrB), TIM-barrel prenyltransferases of ether-lipid synthesis that PANTHER
  places in this family but that do not make IGP.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  623 of the 645 reviewed members in the entries inventory are SF2 HisF or HisHF proteins; the
  other 22 are SF22 GGGPS enzymes with an unrelated prenyltransferase activity. The glutaminase
  activity is present only in the four reviewed HisHF fusions that carry a HisH (GATase, Pfam
  PF00117) domain.
reference_protein:
  id: UniProtKB:P33734
  label: Imidazole glycerol phosphate synthase hisHF
  gene_symbol: HIS7
  organism: Saccharomyces cerevisiae
  gene_review: genes/yeast/HIS7/HIS7-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR21235:SF2
  label: IMIDAZOLE GLYCEROL PHOSPHATE SYNTHASE HISHF
  description: >-
    HisF cyclases. Per the members' UniProt Pfam cross-references, 619 of the 623 reviewed members
    carry only the HisA/HisF domain (PF00977) and are standalone HisF subunits; four (S.
    cerevisiae HIS7 P33734, S. pombe his4 O94303, Emericella nidulans hisHF Q9P4P9, Arabidopsis
    hisHF Q9SZ30) are HisHF fusions that also carry the HisH glutamine amidotransferase domain
    (PF00117). The subfamily does not separate the two architectures.
  representative_members:
  - id: UniProtKB:P33734
    gene_symbol: HIS7
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/HIS7/HIS7-ai-review.yaml
  - id: UniProtKB:O94303
    gene_symbol: his4
    organism: Schizosaccharomyces pombe
    gene_review: genes/SCHPO/his4/his4-ai-review.yaml
  - id: UniProtKB:Q88R41
    gene_symbol: hisF
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/hisF/hisF-ai-review.yaml
  - id: UniProtKB:P60664
    gene_symbol: hisF
    organism: Escherichia coli K-12
  diverged_from_family: false
  supported_by:
  - reference_id: file:genes/PSEPK/hisF/hisF-uniprot.txt
    supporting_text: >-
      The HisF subunit catalyzes the cyclization activity that produces IGP and AICAR from PRFAR
      using the ammonia provided by the HisH subunit.
  - reference_id: PMID:10733892
    supporting_text: >-
      established that this protein is bifunctional, representing a fusion between the N-terminal
      HisH domain and a C-terminal HisF domain.
- subfamily_id: PANTHER:PTHR21235:SF22
  label: GERANYLGERANYLGLYCERYL PHOSPHATE SYNTHASE
  description: >-
    Geranylgeranylglyceryl phosphate synthases (Pfam PF01884, PcrB), archaeal and bacterial group
    II enzymes that transfer the geranylgeranyl group of GGPP to sn-glycerol-1-phosphate, the first
    ether-bond-forming step of archaeal membrane lipid synthesis. All 22 reviewed members are
    GGGPS; none has HisF activity. Flavobacterium johnsoniae Fjoh_1584 (A5FJK8) is an
    experimentally characterized member with a completed gene review.
  representative_members:
  - id: UniProtKB:A5FJK8
    gene_symbol: Fjoh_1584
    organism: Flavobacterium johnsoniae UW101
    gene_review: genes/FLAJ1/Fjoh_1584/Fjoh_1584-ai-review.yaml
  - id: UniProtKB:Q58647
    gene_symbol: MJ1250
    organism: Methanocaldococcus jannaschii
  diverged_from_family: true
  supported_by:
  - reference_id: file:genes/FLAJ1/Fjoh_1584/Fjoh_1584-uniprot.txt
    supporting_text: >-
      Prenyltransferase that catalyzes the transfer of the geranylgeranyl moiety of
      geranylgeranyl diphosphate (GGPP) to the C3 hydroxyl of sn-glycerol-1-phosphate (G1P).
  - reference_id: PMID:24684232
    supporting_text: >-
      Geranylgeranylglyceryl phosphate synthase (GGGPS) family enzymes catalyse the formation of
      an ether bond between glycerol-1-phosphate and polyprenyl diphosphates.
node_assessments:
- node_id: PANTHER:PTN000477998
  asserted_term:
    id: GO:0000107
    label: imidazoleglycerol-phosphate synthase activity
  evidence: IBD
  paint_snapshot: '20250903'
  seeds:
  - id: SGD:S000000452
  - id: UniProtKB:P60664
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node is the family root (PTHR21235:AN0 in PANTHER's TreeGrafter node table), seeded by
    S. cerevisiae HIS7 and E. coli HisF, and the activity is correctly ancestral to SF2: the HisF
    and HisHF recipients (HIS7, S. pombe his4) retain it. But the root also covers SF22, and seven
    archaeal GGGPS enzymes (Q8TJ20, A9A3Z1, Q5JDY1, B1L6Q8, Q980N1, Q58647, Q8ZTX5) inherit the
    IBA in the PAINT leaf file, while all ten SF22 tree nodes carry the term in the TreeGrafter
    table, so grafted GGGPS sequences receive it electronically too. GGGPS is a prenyltransferase
    that shares only the TIM-barrel fold; the completed Fjoh_1584 gene review removes the
    propagated term. An IRD at the SF22 clade is needed.
  affected_subfamilies:
  - id: PANTHER:PTHR21235:SF22
    label: GERANYLGERANYLGLYCERYL PHOSPHATE SYNTHASE
  supported_by:
  - reference_id: file:interpro/panther/PTHR21235/PTHR21235-paint.tsv
    supporting_text: "PTHR21235\tPTN000477998\tGO:0000107\tF\tIBD\tfalse"
  - reference_id: file:genes/FLAJ1/Fjoh_1584/Fjoh_1584-ai-review.yaml
    supporting_text: >-
      The TreeGrafter HisF reaction is inappropriate for this characterized GGGPS.
  - reference_id: file:genes/yeast/HIS7/HIS7-ai-review.yaml
    supporting_text: >-
      PAINT phylogenetic inference of the family-defining catalytic activity; the yeast protein is
      within the clade and retains the catalytic machinery.
term_assessments:
- assessed_term:
    id: GO:0000107
    label: imidazoleglycerol-phosphate synthase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The cyclase activity of SF2, accepted by S. cerevisiae HIS7 (directly assayed), S. pombe his4
    and P. putida hisF, and grounding the IGP synthase step of the histidine_biosynthesis module.
    In standalone HisF it is the activity of the HisF subunit of the HisH-HisF heterodimer; in the
    HisHF fusions the same polypeptide carries both halves. It must not descend to SF22 (GGGPS).
  applicable_subfamilies:
  - id: PANTHER:PTHR21235:SF2
    label: IMIDAZOLE GLYCEROL PHOSPHATE SYNTHASE HISHF
  supported_by:
  - reference_id: file:interpro/panther/PTHR21235/PTHR21235-paint.tsv
    supporting_text: "PTHR21235\tPTN000477998\tGO:0000107\tF\tIBD\tfalse"
  - reference_id: PMID:10733892
    supporting_text: >-
      Catalytically active yeast HIS7 was expressed in a bacterial system under the control of T7
      polymerase promoter.
  - reference_id: file:genes/PSEPK/hisF/hisF-uniprot.txt
    supporting_text: >-
      The HisF subunit catalyzes the cyclization activity that produces IGP and AICAR from PRFAR
      using the ammonia provided by the HisH subunit.
- assessed_term:
    id: GO:0000105
    label: L-histidine biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Histidine biosynthesis follows the SF2 cyclase activity (step 5 of the pathway), accepted by
    HIS7, his4 and P. putida hisF. SF22 GGGPS enzymes act in ether-lipid synthesis, not histidine
    synthesis. PAINT asserts no process term in this family.
  applicable_subfamilies:
  - id: PANTHER:PTHR21235:SF2
    label: IMIDAZOLE GLYCEROL PHOSPHATE SYNTHASE HISHF
  supported_by:
  - reference_id: PMID:10733892
    supporting_text: >-
      This enzyme represents a junction between histidine biosynthesis and de novo purine
      biosynthesis.
  - reference_id: file:genes/yeast/HIS7/HIS7-ai-review.yaml
    supporting_text: >-
      HIS7 catalyses step 5, imidazole glycerol phosphate synthase of the pathway, so this is the
      core biological process.
- assessed_term:
    id: GO:0004359
    label: glutaminase activity
  scope: UNRESOLVED
  scope_reason: >-
    Not a property of this family's HisF cyclase domain. The glutamine-hydrolysing (HisH) half of
    IGP synthase is carried, among the 645 reviewed members, only by the four SF2 HisHF fusions
    with an N-terminal glutamine amidotransferase domain (S. cerevisiae HIS7, where glutaminase
    activity was measured, S. pombe his4, Emericella nidulans hisHF, Arabidopsis hisHF). The other
    619 SF2 members are standalone HisF subunits that receive ammonia from a separate HisH protein
    in another PANTHER family, and SF22 lacks it. Applicability is decided by domain architecture,
    which no subfamily separates, so the term cannot be scoped to a subfamily; PAINT asserts it at
    no node in this family.
  supported_by:
  - reference_id: PMID:10733892
    supporting_text: >-
      HIS7 shows a low basal level glutaminase activity that can be enhanced 1000-fold in the
      presence of a nucleotide substrate or analog.
  - reference_id: file:genes/yeast/HIS7/HIS7-uniprot.txt
    supporting_text: In the C-terminal section; belongs to the HisA/HisF family.
  - reference_id: file:genes/PSEPK/hisF/hisF-uniprot.txt
    supporting_text: Heterodimer of HisH and HisF.
