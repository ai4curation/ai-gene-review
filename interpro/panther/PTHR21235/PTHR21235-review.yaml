notes: >-
  Member counts and domain architectures were derived from the entries inventory (645 reviewed
  members: SF2 623, SF22 22) and the members' UniProt Pfam cross-references queried on 2026-11-10.
  PAINT recipients were read from PANTHER's leaf IBA file: PTN000477998 (family root, AN0) has 114
  recipients, 107 in SF2 and 7 in SF22. PTN000477998 also appears in the cached PTHR43090 (HisA)
  PAINT slice, because that slice is assembled from the nodes its members' IBAs cite, and one
  PTHR43090 inventory member, Clostridium botulinum hisA A5I244 (a ProFAR isomerase), receives this
  IGP synthase IBA in the PAINT leaf file. That leaf appears to sit in this family's tree while
  current HMM scoring places it in PTHR43090; the IBA is wrong for a HisA protein and is a
  propagation defect to report to PANTHER rather than a property of either family.
