  specification (GO:0009948, BP) and 17 additional GO term(s)) are conserved across the primary ancestral clade,
  with lineage-specific variation reflected by IBD assertions distributed across 20 PTN nodes (PANTHER:PTN000218063,
  PANTHER:PTN000218066, PANTHER:PTN000218112, PANTHER:PTN000218722 (+16 more)).
