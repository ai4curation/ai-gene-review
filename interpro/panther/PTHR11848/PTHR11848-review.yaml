family_id: PANTHER:PTHR11848
family_name: TGF-BETA FAMILY
preferred_name: Tgf-Beta Family
summary: TGF-BETA FAMILY (PANTHER:PTHR11848) is characterized in PANTHER PAINT across 20 ancestral PTN node(s) (PANTHER:PTN000218063,
  PANTHER:PTN000218066, PANTHER:PTN000218112, PANTHER:PTN000218722 (+16 more)) with 27 IBD node assertion(s) and
  0 term(s) carrying negated IRD/IKR branch blocks, covering extracellular region (GO:0005576, CC), cytokine activity
  (GO:0005125, MF), cell surface receptor protein serine/threonine kinase signaling pathway (GO:0007178, BP), anterior/posterior
  axis specification (GO:0009948, BP) and 17 additional GO term(s).
functional_coherence: MOSTLY_COHERENT
