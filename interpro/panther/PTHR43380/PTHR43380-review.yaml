review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Written alongside the BCKDHA gene review (genes/human/BCKDHA/BCKDHA-ai-review.yaml).
  All node ids, seed lists and snapshot dates are verbatim from the cached
  PTHR43380-paint.tsv; subfamily accessions and names are verbatim from panther.obo, and
  the SF1 composition comes from the fetched PTHR43380-entries.csv. Residue positions and
  their expected amino acids are read from the UniProt P12694 BINDING feature table
  (sequence version 2, 445 aa) and are machine-checkable.
  Both residue sites use strength CONTRIBUTES rather than REQUIRED. That is deliberate:
  REQUIRED licenses a validator to contradict a gene review, and is only honest with a
  verified negative control - a family member shown to lack the function. No such member
  is known here; every characterised member binds ThDP, so there is nothing genuine to
  put in negative_controls. Rather than fabricate one, the dependency is recorded at the
  weaker level.
  On the premise of the "human no-IBA" project: BCKDHA is no longer IBA-free. The fetched
  GOA carries two IBAs (GO:0009083 dated 20260530 and GO:0160157 dated 20250904), matching
  the two branched-chain PAINT rows, so PAINT curation of this family has caught up since
  the project's gene list was drawn. What remains genuinely missing is a molecular
  function: no MF IBD exists on the branched-chain side, despite GO:0003863 being the
  best-evidenced term the human, bovine and rat proteins have. That, plus the
  family-wide ThDP-binding term, is the actionable recommendation for a PAINT curator.
  The InterPro metadata for this entry carries an LLM-generated name and description
  ("Alpha-ketoacid dehydrogenase complex E1 component", is_llm: true, is_reviewed_llm:
  false); family_name above is PANTHER's own name from panther.obo, not that text.
