family_id: PANTHER:PTHR43380
family_name: 2-OXOISOVALERATE DEHYDROGENASE SUBUNIT ALPHA, MITOCHONDRIAL
preferred_name: >-
  Alpha subunit of the heterotetrameric (alpha2beta2) ThDP-dependent 2-oxo acid
  dehydrogenase E1 components - branched-chain (BCKDH E1-alpha / BCKDHA / bkdA /
  bfmBAA) and pyruvate (PDH E1-alpha / pdhA / PDHA) types
summary: >-
  This family collects the **alpha subunit** of the "type II", heterotetrameric
  (alpha2beta2) thiamine-diphosphate-dependent E1 components of 2-oxo acid dehydrogenase
  multienzyme complexes. Every member is one half of an alpha2-beta2 decarboxylase whose
  two active sites sit at the alpha/beta' interfaces, with the ThDP cofactor shared
  between the subunits: the alpha subunit supplies the diphosphate- and Mg2+-binding
  residues, the beta subunit (a separate PANTHER family, PTHR42980 for the branched-chain
  type) supplies the thiazolium-ring contacts. All members catalyse the same two
  half-reactions - ThDP-dependent decarboxylation of a 2-oxo acid, then reductive
  acylation of the lipoyl-lysine of the E2 core.
  What differs between members is the **substrate** and therefore the complex they belong
  to. The core group acts on the branched-chain 2-oxo acids derived from leucine,
  isoleucine and valine (human/bovine/rat/mouse BCKDHA, C. elegans bckd-1A, Dictyostelium
  bkdA, Arabidopsis At1g21400 and At5g09300, bacterial bkdA1/bfmBAA/bkdA), forming the E1
  component of the branched-chain alpha-ketoacid dehydrogenase complex and running the
  committed, rate-limiting step of BCAA catabolism. A second group acts on pyruvate,
  forming the E1 component of the pyruvate dehydrogenase complex and feeding acetyl-CoA
  into the TCA cycle. The chemistry is shared; the substrate specificity, the complex,
  and the pathway are not.
  Whether that second group really sits inside this family is where the cached sources
  disagree, and the disagreement matters enough to state plainly. The **PAINT book for
  PTHR43380** contains a pyruvate clade: node PTN008519424 carries GO:0004739 and
  GO:0006086, seeded entirely by pyruvate dehydrogenase E1-alpha genes. The fetched
  **InterPro slice** likewise lists fourteen bacterial pdhA proteins under
  PTHR43380:SF1. But PANTHER's own HMM **member index**
  (interpro/panther/panther-members.tsv) places the pdhA/PDHA proteins it has entries for
  in a different family entirely - P21881 (Bacillus subtilis pdhA) in PTHR11516:SF41 and
  P08559 (human PDHA1) in PTHR11516:SF52 - while confirming P12694 and P11178 in
  PTHR43380:SF1 and Q84JL2 in PTHR43380:SF11. The likeliest reading is that the sources
  are pinned to different PANTHER releases. Nothing here resolves it, so this review
  treats the PAINT book as authoritative for IBA questions (it is what actually
  propagates) and flags the classification conflict rather than picking a winner.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The PAINT book for this family spans both branched-chain 2-oxo acid dehydrogenase
  E1-alpha subunits and pyruvate dehydrogenase E1-alpha subunits. These are the same fold
  and the same mechanism acting on different substrates in different complexes: the
  branched-chain members belong to GO:0160157 (branched-chain alpha-ketoacid dehydrogenase
  complex) and act in GO:0009083 (branched-chain amino acid catabolic process), while the
  pyruvate members belong to GO:0045254 (pyruvate dehydrogenase complex) and act in
  GO:0006086 (pyruvate decarboxylation to acetyl-CoA). No substrate-specific molecular
  function is safe across that span, which is what HETEROGENEOUS records here.
  Two cached sources put the pyruvate members inside PTHR43380: the PAINT slice
  (PTN008519424, GO:0004739 and GO:0006086, seeded only by PDH E1-alpha genes) and the
  InterPro entries slice, which lists fourteen bacterial pdhA proteins under
  PTHR43380:SF1 alongside human/bovine/rat/mouse BCKDHA, Pseudomonas bkdA1, Bacillus
  bfmBAA, Mycobacterium bkdA and Thermus TTHA0229. A third source, PANTHER's own member
  index, disagrees and assigns the pdhA/PDHA proteins to PTHR11516 (see summary). Under
  either reading the curation consequence is the same and is the point of this section:
  **the functional boundary is not a subfamily boundary.** If the pdhA members are in
  SF1, a subfamily-level grant or denial of GO:0003863 or GO:0004739 is wrong for a large
  part of SF1; if they are not, SF1 is still the accession that would carry any such
  grant for every branched-chain member including bacteria, while the term BCKDHA
  actually needs is scoped by clade. Either way the assertion has to be made at a PAINT
  node, which is what PAINT has in fact done.
  The InterPro slice also contains one member whose name matches neither group -
  F4KIN4, Arabidopsis "Putative 2-dehydropantoate 2-reductase" (KPR) - which is most
  likely a classification artefact rather than evidence of a third function.
