subfamilies:
  - subfamily_id: PANTHER:PTHR43380:SF1
    label: "2-OXOISOVALERATE DEHYDROGENASE SUBUNIT ALPHA, MITOCHONDRIAL"
    description: >-
      The dominant subfamily and the one holding human BCKDHA (P12694, confirmed by
      PANTHER's member index). Its branched-chain content in the fetched InterPro slice
      is P12694 human, P11178 bovine, P11960 rat, P50136 mouse, O45924 C. elegans,
      Q54M22 Dictyostelium, Q9LPL5 Arabidopsis At1g21400, P09060/Q9I1M2 Pseudomonas
      bkdA1, P37940 Bacillus bfmBAA, P9WIS2/P9WIS3 Mycobacterium bkdA and
      Q5SLR4/Q72GU1 Thermus - i.e. it already mixes eukaryotic and bacterial members, so
      it is not a safe carrier for compartment terms.
      The same slice additionally lists fourteen bacterial pyruvate dehydrogenase
      E1-alpha subunits (pdhA of Firmicutes and Mollicutes: P21873, P21881, P35485,
      P47516, P60089, P60090, P75390, Q4MTG0, Q5HGZ1, Q5HQ76, Q6GAC1, Q6GHZ2, Q820A6,
      Q8CPN3) under this accession, but PANTHER's member index contradicts that for the
      one of them it covers (P21881 is indexed as PTHR11516:SF41). None of the pdhA
      proteins is cited as a representative member below for exactly that reason - only
      accessions the index confirms in this subfamily are.
    representative_members:
      - id: UniProtKB:P12694
        label: 2-oxoisovalerate dehydrogenase subunit alpha, mitochondrial
        gene_symbol: BCKDHA
        organism: Homo sapiens
      - id: UniProtKB:P11178
        label: 2-oxoisovalerate dehydrogenase subunit alpha, mitochondrial
        gene_symbol: BCKDHA
        organism: Bos taurus
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR43380:SF11
    label: "2-OXOISOVALERATE DEHYDROGENASE SUBUNIT ALPHA 2, MITOCHONDRIAL"
    description: >-
      Plant alpha-2 paralogue group; in the fetched slice represented by Arabidopsis
      Q84JL2 (At5g09300), one of the two seeds behind the branched-chain BP node
      PTN000162347. Branched-chain type, not pyruvate type.
    representative_members:
      - id: UniProtKB:Q84JL2
        label: 2-oxoisovalerate dehydrogenase subunit alpha 2, mitochondrial
        gene_symbol: At5g09300
        organism: Arabidopsis thaliana
    diverged_from_family: false

node_assessments:
  - node_id: PANTHER:PTN000162283
    asserted_term:
      id: GO:0160157
      label: branched-chain alpha-ketoacid dehydrogenase complex
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20250904"
    seeds:
      - id: UniProtKB:P11178
        label: 2-oxoisovalerate dehydrogenase subunit alpha, mitochondrial
        gene_symbol: BCKDHA
        organism: Bos taurus
      - id: UniProtKB:P12694
        label: 2-oxoisovalerate dehydrogenase subunit alpha, mitochondrial
        gene_symbol: BCKDHA
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Complex membership placed on a eukaryote-scoped node seeded by two mammalian
      BCKDHA proteins, both with direct structural/biochemical evidence (the human
      alpha2-beta2 E1b crystal structure, PMID:10745006, and the purified human liver
      complex, PMID:3593587). Human BCKDHA does receive this IBA, and its own review
      accepts it alongside four independent experimental annotations of the same term
      (IDA PMID:10745006, PMID:7883996, PMID:9582350; IPI PMID:3593587). P12694 appearing
      in its own WITH/FROM is the expected marker that the IBD was seeded partly on the
      target's own experimental annotation, not circularity.
      The eukaryote taxon scope is conservative but not wrong: bacterial members that are
      genuinely part of a branched-chain complex (Pseudomonas bkdA1, Bacillus bfmBAA)
      simply do not inherit it. The scope also keeps the term well away from the pyruvate
      clade at PTN008519424, which is the important effect.
  - node_id: PANTHER:PTN000162347
    asserted_term:
      id: GO:0009083
      label: branched-chain amino acid catabolic process
    paint_snapshot: "20260530"
    seeds:
      - id: AGI_LocusCode:AT1G21400
      - id: AGI_LocusCode:AT5G09300
      - id: FB:FBgn0037709
      - id: MGI:MGI:107701
      - id: RGD:2196
      - id: UniProtKB:P11178
        label: 2-oxoisovalerate dehydrogenase subunit alpha, mitochondrial
        gene_symbol: BCKDHA
        organism: Bos taurus
      - id: UniProtKB:P12694
        label: 2-oxoisovalerate dehydrogenase subunit alpha, mitochondrial
        gene_symbol: BCKDHA
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      The branched-chain catabolic process is placed on a node seeded across plants
      (two Arabidopsis loci), insects (Drosophila), rodents and two mammalian BCKDHA
      proteins - a broad, well-distributed IBD that matches the deep conservation of
      BCAA catabolism. Human BCKDHA receives the resulting IBA and its review accepts it,
      backed by IDA (PMID:3593587, PMID:7883996) and IMP (PMID:9582350) evidence for the
      same term. Propagation to the human gene is sound.
      One data caveat rather than a curation objection: the cached PAINT row records a
      bare ``taxon:2`` for this node, which is inconsistent with an exclusively
      eukaryotic seed list, so no node_taxon is asserted here. If the recorded scope is
      taken literally it would additionally reach the bacterial bkdA/bfmBAA members,
      which is defensible on the biology (they do catabolise branched-chain 2-oxo acids)
      but would also risk reaching the bacterial pdhA proteins the InterPro slice places
      in this family, which is not. The seed set, not the recorded taxon string, is what
      this assessment rests on.
  - node_id: PANTHER:PTN008519424
    asserted_term:
      id: GO:0004739
      label: pyruvate dehydrogenase (acetyl-transferring) activity
    paint_snapshot: "20260528"
    seeds:
      - id: RGD:620095
      - id: SGD:S000000980
      - id: UniProtKB:P29803
      - id: UniProtKB:P29804
      - id: UniProtKB:Q5B2R8
    assessment: SOUND
    assessment_reason: >-
      This is the pyruvate-specific molecular function, and it is placed on a *separate*
      node from the two branched-chain assertions, seeded entirely by pyruvate
      dehydrogenase E1-alpha proteins (a yeast PDA1 locus, a rat Pdha locus and three
      UniProt PDH E1-alpha entries). Human BCKDHA is not a descendant and correctly
      receives no IBA for it - checked against the fetched BCKDHA GOA, which carries only
      the GO:0009083 and GO:0160157 IBAs. This is the family's heterogeneity being
      handled correctly: PAINT drew the line where PANTHER's subfamilies do not.
      Propagation of this term to BCKDHA would be wrong (different substrate, different
      complex, different pathway) and no such propagation occurs.
  - node_id: PANTHER:PTN008519424
    asserted_term:
      id: GO:0006086
      label: pyruvate decarboxylation to acetyl-CoA
    paint_snapshot: "20250902"
    seeds:
      - id: MGI:MGI:97532
      - id: RGD:3286
      - id: RGD:620095
      - id: SGD:S000000980
      - id: UniProtKB:P08559
      - id: UniProtKB:P29803
    assessment: SOUND
    assessment_reason: >-
      The pyruvate-branch biological process, on the same PDH-specific node and with a
      seed list of pyruvate dehydrogenase E1-alpha genes across mouse, rat, yeast and
      human. As with GO:0004739, human BCKDHA is outside this clade and receives no IBA
      for it, which is correct: BCKDHA's process terms are the branched-chain ones
      (GO:0009083 and GO:0120552).

term_assessments:
  - assessed_term:
      id: GO:0030976
      label: thiamine pyrophosphate binding
    scope: FAMILY_WIDE
    scope_reason: >-
      This is the one specific molecular function that is safe for every member of this
      heterogeneous family, and it is currently asserted by PAINT nowhere in it. All
      members - branched-chain and pyruvate alike - are the alpha subunit of an
      alpha2-beta2 ThDP-dependent E1, and in all of them the alpha subunit supplies the
      diphosphate-binding residues of the shared cofactor. For the reference protein
      these are UniProt BINDING sites 158, 159, 207, 239, 240, 265 and 336 of P12694,
      each flagged "ligand shared with beta subunit", plus the Mg2+ site (238, 267, 269)
      that anchors the diphosphate; the human E1b crystal structure resolves the bound
      cofactor. A PAINT curator wanting to add value to this family should put ThDP
      binding at the family root rather than trying to place a substrate-specific
      activity term.
    supported_by:
      - reference_id: PMID:10745006
        supporting_text: One of these ions assists a loop that is close to the cofactor
          to adopt the proper conformation.
  - assessed_term:
      id: GO:0003863
      label: branched-chain 2-oxo acid dehydrogenase activity
    scope: UNRESOLVED
    scope_reason: >-
      The gap this family review exists to record. Human, bovine and rat BCKDHA all carry
      experimental annotations to GO:0003863 (for human: IDA PMID:10745006 and
      PMID:9582350 with contributes_to, IDA PMID:7883996 with enables), yet PAINT asserts
      no molecular function anywhere on the branched-chain side of this family - only the
      BP (PTN000162347) and CC (PTN000162283) terms. Human BCKDHA therefore receives no
      MF IBA even though the experimental grounding for one is stronger than for either
      term it does inherit.
      It is left UNRESOLVED rather than granted because the scope cannot be safely
      expressed at subfamily level. On the InterPro slice's reading, PTHR43380:SF1
      contains both branched-chain and pyruvate E1-alpha subunits, so a SUBFAMILY_ONLY
      grant naming SF1 would hand the term to the pdhA proteins while denying it at SF1
      would take it from BCKDHA. On PANTHER's member-index reading the pdhA proteins are
      in PTHR11516 and SF1 would be safe - but the two sources are in open conflict (see
      coherence_reason), and a grant that is only correct under one of them is not a
      grant worth making. The correct vehicle
      is the PTN node: an IBD for GO:0003863 placed at PTN000162347 (or at the eukaryotic
      PTN000162283) would land exactly on the clade that has the evidence, and would be
      sound for human BCKDHA. Note the qualifier question travels with the term - the
      activity belongs to the alpha2-beta2 heterotetramer, so contributes_to is the more
      accurate qualifier for a subunit.
    supported_by:
      - reference_id: PMID:9582350
        supporting_text: the E1alpha subunit is affected, resulting in the loss of E1
          and branched-chain ketoacid dehydrogenase catalytic activities
  - assessed_term:
      id: GO:0004739
      label: pyruvate dehydrogenase (acetyl-transferring) activity
    scope: UNRESOLVED
    scope_reason: >-
      Recorded here as the mirror image of GO:0003863 and as a standing warning, not as a
      grant. The term is correct for the pyruvate clade at PTN008519424 (and for the
      pdhA proteins the InterPro slice places in SF1) and wrong for the branched-chain
      clade, and no subfamily boundary reliably separates them. It is currently scoped
      correctly by
      PAINT at the node level; the risk is that any future attempt to express it - or its
      InterPro2GO/EC equivalent - at family or subfamily granularity would silently give
      pyruvate chemistry to BCKDHA and its orthologs.

residue_sites:
  - site_id: thdp_diphosphate_site
    label: Thiamine diphosphate diphosphate-binding site of the E1 alpha subunit
    description: >-
      Residues of the alpha subunit that contact the diphosphate moiety of the shared
      ThDP cofactor at the alpha/beta' interface. Taken verbatim from the UniProt P12694
      BINDING feature table, where each is annotated "ligand shared with beta subunit"
      (ChEBI:CHEBI:58937). The thiazolium-ring contacts are contributed by the beta
      subunit and so belong to PTHR42980, not here.
    anchor:
      id: UniProtKB:P12694
      label: 2-oxoisovalerate dehydrogenase subunit alpha, mitochondrial
      gene_symbol: BCKDHA
      organism: Homo sapiens
    anchor_sequence_version: 2
    residues:
      - position: 158
        expected: [Y]
        role: thiamine diphosphate contact (shared with beta subunit)
      - position: 159
        expected: [R]
        role: thiamine diphosphate contact (shared with beta subunit)
      - position: 207
        expected: [S]
        role: thiamine diphosphate contact (shared with beta subunit)
      - position: 239
        expected: [G]
        role: thiamine diphosphate contact (shared with beta subunit)
      - position: 240
        expected: [A]
        role: thiamine diphosphate contact (shared with beta subunit)
      - position: 265
        expected: [R]
        role: thiamine diphosphate contact (shared with beta subunit)
      - position: 336
        expected: [H]
        role: thiamine diphosphate contact (shared with beta subunit)
    required_for:
      - term:
          id: GO:0030976
          label: thiamine pyrophosphate binding
        strength: CONTRIBUTES
        rationale: >-
          The cofactor is bound, not merely stabilised, by this set: the alpha subunit
          clamps the diphosphate tail while the beta subunit holds the thiazolium ring,
          so the site is the physical basis of the binding claim. Losing it is losing
          the cofactor.
        supported_by:
          - reference_id: PMID:10745006
            supporting_text: One of these ions assists a loop that is close to the
              cofactor to adopt the proper conformation.
      - term:
          id: GO:0003863
          label: branched-chain 2-oxo acid dehydrogenase activity
        strength: CONTRIBUTES
        rationale: >-
          Catalysis proceeds through the ylide of the ThDP thiazolium ring attacking the
          2-oxo acid carbonyl; with no bound cofactor there is no ylide and no
          decarboxylation. Mutations in E1b that disturb the cofactor site are the
          documented mechanism by which MSUD alleles abolish activity.
        supported_by:
          - reference_id: PMID:10745006
            supporting_text: The known MSUD mutations affect the functioning of E1b by
              interfering with the cofactor and K(+) sites, the packing of hydrophobic
              cores, and the precise arrangement of residues at or near several subunit
              interfaces.
    site_source: UNIPROT_FEATURE
    external_ref:
      id: UniProtKB:P12694
      source_db: UNIPROT
      source_url: https://www.uniprot.org/uniprotkb/P12694/entry
  - site_id: mg_site
    label: Catalytic Mg2+ site of the E1 alpha subunit
    description: >-
      The divalent metal site that anchors the ThDP diphosphate. UniProt P12694 BINDING
      features for Mg(2+) (ChEBI:CHEBI:18420), all carrying experimental evidence
      ECO:0000269|PubMed:10745006.
    anchor:
      id: UniProtKB:P12694
      label: 2-oxoisovalerate dehydrogenase subunit alpha, mitochondrial
      gene_symbol: BCKDHA
      organism: Homo sapiens
    anchor_sequence_version: 2
    residues:
      - position: 238
        expected: [E]
        role: Mg2+ ligand
      - position: 267
        expected: [N]
        role: Mg2+ ligand
      - position: 269
        expected: [Y]
        role: Mg2+ ligand
    required_for:
      - term:
          id: GO:0000287
          label: magnesium ion binding
        strength: CONTRIBUTES
        rationale: >-
          These three residues are the protein ligands of the metal; the remaining
          coordination comes from the cofactor's diphosphate. Removing them removes the
          site.
        supported_by:
          - reference_id: PMID:10745006
            supporting_text: The known MSUD mutations affect the functioning of E1b by
              interfering with the cofactor and K(+) sites, the packing of hydrophobic
              cores, and the precise arrangement of residues at or near several subunit
              interfaces.
    site_source: UNIPROT_FEATURE
    external_ref:
      id: UniProtKB:P12694
      source_db: UNIPROT
      source_url: https://www.uniprot.org/uniprotkb/P12694/entry

