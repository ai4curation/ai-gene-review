family_id: PANTHER:PTHR12242
family_name: OS02G0130600 PROTEIN-RELATED
summary: This membrane-protein grouping includes fly Headbutt and Rolling stone in distinct subfamilies,
  alongside plant membrane-protein descriptors. Rolling stone is required for myoblast fusion; no common
  transport reaction or lipid substrate is established across the grouping.
functional_coherence: UNKNOWN
coherence_reason: Fly Rolling stone is a membrane-associated protein whose mesodermal expression is required
  for myoblast fusion (PMID:9230076). This direct genetic result provides a positive biological role for
  the verified SF46 member O44252, while Headbutt Q9VK03 belongs to SF49 and has a multipass membrane
  architecture. Neither membrane topology nor the TLC/MARVEL-related labels establish an intrinsic solute
  transporter or lipid enzyme. A conserved molecular mechanism linking these branches remains unknown;
  the phenotype of Rolling stone is not treated as evidence that Headbutt is itself a fusogen.
