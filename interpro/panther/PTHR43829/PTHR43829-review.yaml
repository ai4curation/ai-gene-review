notes: 'Written for the bacterial glycerol uptake and catabolism module, whose GlpF annoton selects SF9
  and PTN000440994. SF9''s PANTHER name (AQUAPORIN-9) is misleading: human AQP9 is in SF6, and SF9 is
  the bacterial/fungal/protist aquaglyceroporin group. UniProtKB quotes for F9UST3, P23900 and O43315
  were checked against the current UniProt flat files (fetched 2026-11-03); those members have no gene
  review in this repository. PMID:9514918 (an early AQP9 report of no glycerol permeability, later contradicted)
  was deliberately not used.'
