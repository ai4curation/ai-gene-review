term_assessments:
- assessed_term:
    id: GO:0015254
    label: glycerol channel activity
  scope: FAMILY_WIDE
  scope_reason: The PAINT root IBD (PTN000440994) is seeded in bacteria, protists, fungi and mammals,
    and the reference protein E. coli GlpF has direct glycerol-conduction evidence. The term is safe for
    the bacterial GlpF members of SF9 used by glycerol catabolism. The LarD/GlpF1 lactic acid channel
    is excluded as a member exception. The propanediol facilitators (PduF) are described only by curator
    inference and are not excluded.
  member_exceptions:
  - member:
      id: UniProtKB:F9UST3
      gene_symbol: larD
      organism: Lactiplantibacillus plantarum (strain ATCC BAA-793 / NCIMB 8826 / WCFS1)
    exception_reason: LarD (GlpF1) of the lactate-racemization operon conducts D/L-lactic acid, urea and
      H2O2 but UniProt records, from the oocyte assays of PMID:23799297, that it is not permeable to glycerol.
      The loss is specific to LarD/GlpF1. GlpF4, its paralog in the same GlpF1/F4 lactate-racemization
      phylogenetic group, also conducts lactic acid but remains permeable to glycerol (PMID:23799297),
      so the exception must not be extended to the group. PAINT has no IRD for it.
    supported_by:
    - reference_id: UniProtKB:F9UST3
      supporting_text: Also facilitates urea and H(2)O(2) diffusion across membranes, but is not permeable
        to water, glycerol and dihydroxyacetone.
    - reference_id: PMID:23799297
      supporting_text: Both GlpF1 and GlpF4 facilitated the diffusion of D/L-lactic acid.
    - reference_id: PMID:23799297
      supporting_text: Heterologous expression in Xenopus laevis oocytes revealed that GlpF2, GlpF3 and
        GlpF4 each facilitated the transmembrane diffusion of water, dihydroxyacetone and glycerol.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43829/PTHR43829-paint.tsv
    supporting_text: "PTHR43829\tPTN000440994\tGO:0015254\tF\tIBD\tfalse"
  - reference_id: file:genes/ECOLI/glpF/glpF-uniprot.txt
    supporting_text: Mediates glycerol diffusion across the cytoplasmic membrane via a pore-type mechanism
  - reference_id: PMID:23799297
    supporting_text: Heterologous expression in Xenopus laevis oocytes revealed that GlpF2, GlpF3 and
      GlpF4 each facilitated the transmembrane diffusion of water, dihydroxyacetone and glycerol.
  - reference_id: UniProtKB:P23900
    supporting_text: Channel protein for glycerol. Has a role in both glycerol influx and efflux.
