- assessed_term:
    id: GO:0015250
    label: water channel activity
  scope: UNRESOLVED
  scope_reason: 'Water conduction is efficient in the mammalian aquaglyceroporins but weak in E. coli
    GlpF, and LarD is impermeable to water, so the term is not family-wide. A subfamily-level grant would
    need gene-level reviews of the eukaryotic members, which do not exist here. It should not be transferred
    to bacterial GlpF members. The same UniProt sentence ("less well permeated by water") is used in the
    E. coli glpF gene review to remove the NOT water-transport rows: GlpF conducts water weakly but measurably.
    Weak conductance is not by itself a reason to reject positive water-channel activity on that measured
    protein; it also does not establish the activity for all bacterial members. This family-wide boundary
    remains unresolved.'
  supported_by:
  - reference_id: file:genes/ECOLI/glpF/glpF-uniprot.txt
    supporting_text: Is highly permeable to glycerol, but less well permeated by water
  - reference_id: UniProtKB:F9UST3
    supporting_text: but is not permeable to water, glycerol and dihydroxyacetone.
