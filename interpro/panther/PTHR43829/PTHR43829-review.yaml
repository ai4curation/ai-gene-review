family_id: PANTHER:PTHR43829
family_name: AQUAPORIN OR AQUAGLYCEROPORIN RELATED
preferred_name: Aquaglyceroporin (GlpF/AQP3/AQP7/AQP9/AQP10/Fps1) branch of the MIP family
summary: Major intrinsic protein (MIP) channels of the aquaglyceroporin branch. Each monomer has two tandem
  repeats of three membrane-spanning helices and a pore-forming NPA loop, and the channels assemble as
  homotetramers in the plasma membrane. The inventory spans bacterial glycerol uptake facilitators (E.
  coli and Pseudomonas GlpF, Bacillus subtilis GlpF, Lactococcus Gla), protist and fungal aquaglyceroporins
  (Plasmodium AQP, Trypanosoma AQP1-3, yeast Fps1 and Aqy3) and the mammalian aquaglyceroporins AQP3,
  AQP7, AQP9 and AQP10. Glycerol conduction by facilitated diffusion is the ancestral, family-wide activity;
  water conduction is efficient in the eukaryotic clade but weak in E. coli GlpF. One documented member,
  Lactiplantibacillus plantarum LarD (GlpF1), has switched to lactic acid and lost glycerol permeability.
  Its paralog GlpF4 in the same lactate-racemization phylogenetic group conducts lactic acid but keeps
  glycerol permeability, so the loss is specific to LarD/GlpF1 and not to the group.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Glycerol channel activity is assigned by PAINT at the family root, seeded by experimental
  annotations from bacteria (E. coli GlpF), protists (Plasmodium, Trypanosoma, Leishmania), fungi (yeast)
  and mammals (AQP3, AQP7, AQP10, rat Aqp9). The one documented loss is the LarD/GlpF1 lactic acid channel
  of Lactiplantibacillus plantarum, which sits in SF9 with the bacterial glycerol facilitators. Secondary
  permeabilities (water, urea, polyols, metalloids) vary between members and are not family-wide.
