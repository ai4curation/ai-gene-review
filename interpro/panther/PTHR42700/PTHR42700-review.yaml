family_id: PANTHER:PTHR42700
family_name: SULFATE ADENYLYLTRANSFERASE
preferred_name: Homo-oligomeric Sat/Met3-type ATP sulfurylases and related monofunctional APS kinases
summary: >-
  PANTHER family containing the fungal homo-oligomeric ATP sulfurylases (S. cerevisiae MET3,
  S. pombe sua1, Penicillium chrysogenum and Aspergillus met3), which make adenosine
  5'-phosphosulfate (APS) from sulfate and ATP as the first intracellular step of sulfate
  assimilation. The fungal enzymes have an N-terminal domain, a central PUA-like/ATP-sulfurylase
  catalytic domain and a C-terminal APS-kinase-like domain that is needed for oligomerization and
  is not itself an active APS kinase. The family also contains bacterial bifunctional SAT/APS
  kinase fusions (Aquifex aeolicus sat/cysC, Sorangium sat/cysC) and a set of short, monofunctional
  bacterial and archaeal APS kinases (CysC, about 155-250 residues) that have only the APS kinase
  domain and no ATP sulfurylase domain. The family is therefore defined by the APS-kinase-like
  module rather than by the sulfurylase reaction.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Sulfate assimilation is shared by all members, but the two catalytic activities are
  distributed by domain architecture, not by subfamily. SF1 holds both the fungal MET3-type ATP
  sulfurylases (about 490-580 residues, ATP-sulfurylase and PUA_2 Pfam domains, inactive
  APS-kinase-like C-terminus) and short monofunctional APS kinases (Synechocystis, Deinococcus,
  Chloroflexus, Burkholderia and others, about 155-190 residues, APS_kinase Pfam domain only).
  SF3 likewise mixes the bifunctional Aquifex sat/cysC fusion with monofunctional APS kinases
  (Pseudomonas aeruginosa and Rhodopirellula CysC). Neither ATP sulfurylase activity nor APS kinase
  activity can be assigned to a whole subfamily.
