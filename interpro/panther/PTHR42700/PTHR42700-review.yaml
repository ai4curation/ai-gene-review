    label: MET3
    organism: Saccharomyces cerevisiae
  - id: UniProtKB:Q12555
    label: met3
    organism: Penicillium chrysogenum
  assessment: SOUND
  assessment_reason: >-
    Both the ATP sulfurylases and the APS kinases in this family act in sulfate activation for
    assimilation, so every descendant plausibly inherits the process.
term_assessments:
- assessed_term:
    id: GO:0004781
    label: sulfate adenylyltransferase (ATP) activity
  scope: UNRESOLVED
  scope_reason: >-
    Not family-wide and not cleanly subfamily-scoped. It holds for every member that carries the
    ATP-sulfurylase (PF01747) domain: the fungal MET3-type enzymes (MET3, sua1, Penicillium met3)
    and the bifunctional bacterial fusions. It does not hold for the short CysC-only members,
    which sit in the same subfamilies (SF1 and SF3). Applicability is therefore decided by domain
    architecture, which the subfamily axis does not capture and for which no residue rule is
    defined here. The APS-dependent sulfate reduction module correctly uses a GO:0004781
    required_function filter on its PTHR42700 selector; without that filter the selector would
    also pick up monofunctional APS kinases.
  supported_by:
  - reference_id: PMID:10092498
    supporting_text: >-
      ATP sulfurylase cDNA from MET3 on chromosome X of Saccharomyces cerevisiae was amplified
      and cloned, and recombinant ATP sulfurylase was expressed in Escherichia coli.
  - reference_id: PMID:18388974
    supporting_text: The cloned sua1 gene also complemented the met3 (ATP sulphurylase deficient) mutation in Saccharomyces cerevisiae.
  - reference_id: file:genes/yeast/MET3/MET3-uniprot.txt
    supporting_text: 'FT                   /note="Required for oligomerization; adenylyl-sulfate'
- assessed_term:
    id: GO:0000103
    label: sulfate assimilation
  scope: FAMILY_WIDE
  scope_reason: >-
    ATP sulfurylases and APS kinases both act in sulfate activation, the entry steps of
    assimilatory sulfate reduction, so the process holds for all members.
  supported_by:
  - reference_id: PMID:18388974
    supporting_text: The open reading frame encoding the ATP sulphurylase enzyme was found to be responsible for the restoration of sulphate assimilation.
- assessed_term:
    id: GO:0004020
    label: adenylylsulfate kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    Not asserted by PAINT in this family, and correctly so at family level: the monofunctional
    CysC members and the bifunctional fusions are APS kinases, but the C-terminal
    APS-kinase-like domain of the fungal MET3-type sulfurylases is described as an
    oligomerization domain and is not treated as an active APS kinase (yeast uses the separate
    MET14 APS kinase, PTHR11055). Must not be propagated to MET3 or sua1.
  supported_by:
  - reference_id: file:genes/yeast/MET3/MET3-uniprot.txt
    supporting_text: 'FT                   /note="Required for oligomerization; adenylyl-sulfate'
