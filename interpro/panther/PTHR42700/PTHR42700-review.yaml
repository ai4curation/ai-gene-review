notes: >-
  Module: aps_dependent_assimilatory_sulfate_reduction (PTHR42700 family-level selector with a
  GO:0004781 required_function, homo-oligomeric Sat/Met3 variant; members MET3 P08536, sua1
  P78937). The MET3 gene review accepts the GO:0004781 IBA, and both MET3 and sua1 core functions
  are GO:0004781 in GO:0000103; consistent with this review. Domain architectures of P72940,
  P56861, Q7UQW3, P57702 and O67174 were checked against UniProt REST (Pfam cross-references and
  lengths) on 2026-10-06; P57702 (Pseudomonas aeruginosa CysC, SF3) does not appear among the
  reviewed proteins receiving the GO:0004781 IBA. InterPro's LLM-generated family description
  (metadata file) mentions a non-functional APS kinase domain regulated by PAPS; that mechanism
  is not independently verified here and is not relied on.
