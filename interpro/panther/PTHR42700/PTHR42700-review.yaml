node_assessments:
- node_id: PANTHER:PTN000114738
  asserted_term:
    id: GO:0004781
    label: sulfate adenylyltransferase (ATP) activity
  paint_snapshot: '20200809'
  seeds:
  - id: SGD:S000003771
    label: MET3
    organism: Saccharomyces cerevisiae
  - id: UniProtKB:Q12555
    label: met3
    organism: Penicillium chrysogenum
  assessment: TOO_DEEP
  assessment_reason: >-
    Both seeds are fungal MET3-type ATP sulfurylases, but the term sits on a node whose
    descendants include monofunctional APS kinases that have no ATP sulfurylase domain. Checked
    in the PAINT UniProt GAF: Synechocystis CysC (P72940, 177 aa, SF1), P56861 CysC (192 aa,
    SF1) and Rhodopirellula CysC (Q7UQW3, 247 aa, SF3) all receive GO:0004781 by IBA from
    PTN000114738. UniProt lists only the APS_kinase Pfam domain (PF01583) and EC 2.7.1.25 for
    these proteins, and no ATP-sulfurylase (PF01747) domain. The sulfurylase activity entered
    this lineage with the fusion to an ATP-sulfurylase domain, so it should be asserted at the
    node joining the fungal MET3 clade (and, separately, at the bifunctional fusions), not at a
    node that includes CysC-only proteins. MET3, sua1 and the other fungal enzymes are correctly
    annotated; the module's GO:0004781 required_function filter keeps the CysC members out of
    the ATP sulfurylase annoton. The companion IBD at this node, GO:0000103 sulfate
    assimilation, is sound for every descendant.
    The CysC-only proteins sit inside SF1 (with MET3 and sua1) and SF3, so the prune is
    below subfamily level.
