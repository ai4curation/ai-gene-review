    id: NCBITaxon:33317
    label: Protostomia
  assessment: LOSS_CONTRADICTED
  proposed_action:
    paint_action: REMOVE_LOSS
  assessment_reason: >-
    PTN002796263 is a protostome clade (56 leaves) of peptide receptors: the Drosophila allatostatin C
    receptors AstC-R1 and AstC-R2 (SF40) with nematode NPR receptors (npr-16, npr-17, npr-18, npr-24)
    and the insect Rh7 branch. Both AstC receptors were de-orphaned with the allatostatin C neuropeptide
    by reverse pharmacology (PMID:12167655) and by beta-arrestin translocation (PMID:14555656). The neuropeptide-receptor
    branch dominates the clade, so the loss is contradicted rather than too broad.
