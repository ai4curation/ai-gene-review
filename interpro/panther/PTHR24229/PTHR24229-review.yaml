family_id: PANTHER:PTHR24229
family_name: NEUROPEPTIDES RECEPTOR
preferred_name: Neuropeptide receptors (rhodopsin-like GPCRs)
summary: >-
  PTHR24229 groups rhodopsin-like G protein-coupled receptors for neuropeptides, including the opioid/somatostatin-related
  receptors and their invertebrate relatives such as the Drosophila allatostatin C receptors and nematode
  NPR receptors.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Most members are peptide-activated GPCRs; a few lineage-specific branches (such as the insect Rh7 opsin
  branch) have other ligands.
