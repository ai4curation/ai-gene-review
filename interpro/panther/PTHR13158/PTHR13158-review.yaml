family_id: PANTHER:PTHR13158
family_name: FAMILY NOT NAMED
preferred_name: Mitochondrial NAD kinase (NADK2) family
summary: >-
  PTHR13158 is the animal mitochondrial NAD(+) kinase family, distinct from the
  PTHR20275 family that holds cytosolic NADK and the fungal mitochondrial Pos5. Its
  characterised members are vertebrate NADK2: human NADK2 (Q4G0N4) phosphorylates
  NAD(+) with ATP or inorganic polyphosphate to make NADP(+), has only weak NADH kinase
  activity, is imported into mitochondria by an N-terminal transit peptide, and is the
  source of the mitochondrial NADP(H) pool; mouse Nadk2 is required for the same pool in
  vivo. Crystal structures show that NADK2 is a constitutively active dimer, held
  together by an insert (EMKA) found in the mitochondrial NAD kinases of animals that
  blocks the tetramer interface used by other NAD kinases. The PANTHER reference tree has
  40 leaves. Its root (PTN004406956, also the SF5 node) is a horizontal-transfer node
  joining a eukaryotic clade (PTN000994636: bilaterians, a choanoflagellate, Plasmodium
  and Phytophthora) to one bacterial leaf, Leptospira interrogans LB_063. In the reference
  tree SF4 is a nematode-specific duplicate (C. elegans nadk-1) whose sister clade holds the nematode
  NADK2 orthologs (C. elegans nadk-2, SF5). C. elegans has no PTHR20275 member, so both of
  its members of the two NAD kinase families are in this family. About a third of the 3234 UniProtKB members are
  bacterial; only 1% of them match the Pfam NAD_kinase domain (72% of metazoan SF5
  members do), most replace the second glycine of the GGDG block with Gln while keeping
  the catalytic Asp, and none has been characterised.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The eukaryotic clade under PTN000994636 is coherent: every member with a detectable
  motif keeps the GGDGT NAD kinase block, and the only experimental data (human and mouse
  NADK2) come from it. Two groups are exceptions. The bacterial members, which join the
  tree at the horizontal-transfer root, almost all lack the Pfam NAD_kinase domain (8 of
  1112 in SF5 match it), substitute a glycine of the GGDG block (mostly GQDGL; GGDN in the
  Leptospira reference leaf) while keeping the catalytic Asp, and are untested, so their
  NAD kinase activity is not established. The nematode SF4 paralog nadk-1 keeps the
  catalytic block. C. elegans has two NAD kinases, nadk-2 (SF5, the NADK2 ortholog) and
  nadk-1 (SF4), and no member of the cytosolic NADK family PTHR20275, so nadk-1, the
  paralog outside the NADK2 orthogroup, may have taken a non-mitochondrial role. Its
  localisation is untested.
