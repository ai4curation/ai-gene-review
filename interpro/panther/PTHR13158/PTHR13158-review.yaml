review_status: COMPLETE
reviewed_by: claude-code
review_date: '2026-11-02'
notes: >-
  PANTHER gives the family no name (panther.obo: FAMILY NOT NAMED); the InterPro name
  "Mitochondrial NAD(+) kinase" and its LLM-generated description (unchecked) are
  consistent with the vertebrate members but do not mention the bacterial members.
  Recommended PAINT changes: move GO:0003951 from PTN004406956 to PTN000994636, and
  replace GO:0019674 at PTN004406956 with GO:0006741 at PTN000994636. Member gene reviews
  (human, horse and both donkey NADK2 models) were reconciled with this review: each
  accepts NAD+ kinase activity and mitochondrion, modifies NAD+ metabolic process to
  NADP+ biosynthetic process, and keeps homodimerisation as non-core where it is
  annotated. Fungal mitochondrial NAD(H) kinase Pos5 (genes/SCHPO/pos5) belongs to
  PTHR20275, not to this family.
