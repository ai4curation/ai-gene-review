    diverged_from_family: true
    divergence_description: >-
      Nematode-specific paralog in the reference tree (nadk-1), from a duplication within nematodes
      (PTN000463660); the sister clade holds the nematode NADK2 orthologs (C. elegans
      nadk-2) in SF5. nadk-1 keeps the GGDGT catalytic block, so NAD kinase activity is
      expected. C. elegans has no PTHR20275 (cytosolic NADK) member, so its only two members
      of the NAD kinase families (PTHR13158, PTHR20275) are nadk-2 and nadk-1, and nadk-1 is the more likely candidate for a
      cytosolic NAD kinase. Neither its activity nor its localisation has been tested.
      Outside the reference tree, HMM assignment also places 31 bacterial UniProtKB
      entries in SF4, none of which matches the Pfam NAD_kinase domain.
