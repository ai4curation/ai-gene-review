node_assessments:
  - node_id: PANTHER:PTN000994636
    asserted_term:
      id: GO:0005739
      label: mitochondrion
    evidence: IBD
    paint_snapshot: '20250412'
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    seeds:
      - id: MGI:MGI:1915896
      - id: UniProtKB:Q4G0N4
    assessment: SOUND
    assessment_reason: >-
      Human NADK2 is mitochondrial by imaging and fractionation and depends on its
      N-terminal transit peptide; mouse Nadk2 is required for the mitochondrial NADP(H)
      pool. The node is the eukaryotic clade and correctly excludes the bacterial leaf.
      Mitochondrial localisation has been shown only for vertebrates. Two caveats are
      recorded rather than acted on: the nematode SF4 paralog nadk-1 may be the cytosolic
      NAD kinase of nematodes (C. elegans has no PTHR20275 member; its other NAD kinase,
      nadk-2, is the SF5 NADK2 ortholog), and the Plasmodium and
      Phytophthora members are untested (Plasmodium also has an apicoplast). Neither has
      evidence of non-mitochondrial location, so no pruning is proposed.
    supported_by:
      - reference_id: file:interpro/panther/PTHR13158/PTHR13158-paint.tsv
        supporting_text: "PTHR13158\tPTN000994636\tGO:0005739\tC\tIBD\tfalse\tMGI:MGI:1915896|UniProtKB:Q4G0N4\ttaxon:2759"
      - reference_id: PMID:23212377
        supporting_text: >-
          C5orf33 protein was localized in the mitochondrial fraction but not in the
          cytosolic fraction
  - node_id: PANTHER:PTN004406956
    asserted_term:
      id: GO:0003951
      label: NAD+ kinase activity
    evidence: IBD
    paint_snapshot: '20250412'
    seeds:
      - id: MGI:MGI:1915896
      - id: UniProtKB:Q4G0N4
    assessment: TOO_DEEP
    assessment_reason: >-
      The seeds are human and mouse NADK2, but the node is the horizontal-transfer root,
      so the activity also descends to the bacterial Leptospira LB_063 leaf (Q8EXZ4, which
      receives this IBA in GOA) and, by TreeGrafter, to about 1100 bacterial members. The
      primary evidence that this branch differs is domain coverage: only 8 of 1112
      bacterial SF5 members match the Pfam NAD_kinase domain PF01513, against 1350 of 1875
      (72%) metazoan SF5 members. The catalytic block corroborates this: most bacterial
      members read GQDGL, which substitutes the second glycine of GGDG while retaining the
      catalytic Asp (Asp161 in human NADK2), and Q8EXZ4 reads GGDN, substituting the last
      glycine. No bacterial member has been assayed. UniProt names many of these bacterial
      entries "Inorganic polyphosphate/ATP-NAD kinase" (for example A0A086PAA9), and they
      may well be active; the recommendation concerns what PAINT can assert from its
      seeds, not a prediction that they are inactive. The seeded evidence supports the
      eukaryotic node PTN000994636, where every member with a detectable block keeps
      GGDGT. Moving the activity there leaves all the animal NADK2 annotations unchanged
      and stops the unsupported transfer to the bacterial branch.
    supported_by:
      - reference_id: file:interpro/panther/PTHR13158/PTHR13158-paint.tsv
        supporting_text: "PTHR13158\tPTN004406956\tGO:0003951\tF\tIBD\tfalse\tMGI:MGI:1915896|UniProtKB:Q4G0N4"
      - reference_id: file:interpro/panther/PTHR13158/PTHR13158-bioinformatics/RESULTS.md
        supporting_text: >-
          The family root PTN004406956 is a HORIZ_TRANSFER
          node and is also the SF5 subfamily node.
      - reference_id: file:interpro/panther/PTHR13158/PTHR13158-bioinformatics/RESULTS.md
        supporting_text: "| Bacteria | SF5 | 8/1112 (1%) |"
      - reference_id: file:interpro/panther/PTHR13158/PTHR13158-bioinformatics/RESULTS.md
        supporting_text: "| Metazoa | SF5 | 1350/1875 (72%) |"
      - reference_id: file:interpro/panther/PTHR13158/PTHR13158-bioinformatics/RESULTS.md
        supporting_text: >-
          In bacterial
          members the common form is GQDGL: Gln replaces the second glycine, while the catalytic
          Asp is retained.
      - reference_id: PMID:35733246
        supporting_text: >-
          The GGDG sequence motif bearing the catalytic side chain (D161 in human NADK2)
          is found in the expected position
  - node_id: PANTHER:PTN004406956
    asserted_term:
      id: GO:0019674
      label: NAD+ metabolic process
    evidence: IBD
    paint_snapshot: '20200128'
    seeds:
      - id: UniProtKB:Q4G0N4
    assessment: TOO_DEEP
    assessment_reason: >-
      Same placement problem as the NAD+ kinase activity row at this node: the seed is
      human NADK2 and the bacterial branch of the horizontal-transfer root inherits the
      term without any evidence. The term is also more general than the step these
      enzymes perform. NAD kinase phosphorylates NAD+ to NADP+, so NADP+ biosynthetic
      process (GO:0006741, an is_a descendant of GO:0019674) is the precise process. The
      gene reviews in this family modify the inherited GO:0019674 rows to GO:0006741. The
      recommended PAINT change is GO:0006741 placed at PTN000994636.
    supported_by:
      - reference_id: file:interpro/panther/PTHR13158/PTHR13158-paint.tsv
        supporting_text: "PTHR13158\tPTN004406956\tGO:0019674\tP\tIBD\tfalse\tUniProtKB:Q4G0N4"
      - reference_id: PMID:23212377
        supporting_text: NAD kinase is the sole NADP(+) biosynthetic enzyme
residue_sites:
  - site_id: ggdg_catalytic_motif
    label: GGDG NAD kinase catalytic block
    description: >-
      The GGDG block of the NAD kinase fold, residues 159-162 of human NADK2, which
      carries the catalytic Asp161 (Du et al. 2022). It is kept as GGDGT by the eukaryotic
      members, including the nematode SF4 paralog. Most bacterial members read GQDGL
      (second glycine replaced, catalytic Asp retained), and the Leptospira reference leaf
      reads GGDN (last glycine replaced, Asp retained). The negative controls therefore
      lack a conserved glycine of the block, not the catalytic Asp. The effect of these
      substitutions on activity has not been tested, so the site corroborates the
      Pfam-based divergence of the bacterial branch but does not decide the term for any
      member.
    anchor:
      id: UniProtKB:Q4G0N4
      label: NAD kinase 2, mitochondrial
      gene_symbol: NADK2
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: LITERATURE
    residues:
      - position: 159
        expected: [G]
        role: First glycine of the GGDG block
      - position: 160
        expected: [G]
        role: Second glycine of the GGDG block; Gln in most bacterial members
      - position: 161
        expected: [D]
        role: Catalytic aspartate
      - position: 162
        expected: [G]
        role: Last glycine of the GGDG block; Asn in Leptospira LB_063
    motif:
      pattern_regex: GGDG
      start: 159
      end: 162
      role: NAD kinase catalytic block
    required_for:
      - term:
          id: GO:0003951
          label: NAD+ kinase activity
        strength: CONTRIBUTES
        rationale: >-
          The block carries the catalytic Asp of the NAD kinase fold. Substitutions in the
          glycines have not been assayed in this family, so the site is recorded as
          contributing rather than required, and it is not used to deny the activity to any
          member.
        supported_by:
          - reference_id: PMID:35733246
            supporting_text: >-
              The GGDG sequence motif bearing the catalytic side chain (D161 in human
              NADK2) is found in the expected position
    positive_controls:
