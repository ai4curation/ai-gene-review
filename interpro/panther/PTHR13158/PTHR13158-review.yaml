term_assessments:
  - assessed_term:
      id: GO:0003951
      label: NAD+ kinase activity
    scope: UNRESOLVED
    scope_reason: >-
      Safe for the eukaryotic clade under PTN000994636: human NADK2 has direct activity,
      mouse Nadk2 loss lowers mitochondrial NADP(H), and the other eukaryotic members,
      including nematode SF4 nadk-1, keep the GGDGT block. Not established for the
      bacterial members (about a third of UniProtKB members, assigned mostly to SF5 by
      HMM): only 1% match the Pfam NAD_kinase domain, against 72% of metazoan SF5 members,
      and most substitute the second glycine of the GGDG block while keeping the catalytic
      Asp. Many are named "Inorganic polyphosphate/ATP-NAD kinase" by UniProt and may be
      active; none has been assayed. Because the bacterial members sit inside SF5 (and a smaller set, 31 entries, is HMM-assigned to SF4), no
      subfamily-level scope expresses this; the boundary is the eukaryotic node. UNRESOLVED here means decided for the eukaryotic clade but not expressible as a subfamily scope.
    supported_by:
      - reference_id: PMID:23212377
        supporting_text: >-
          showing that C5orf33 protein has NADK activity using ATP and poly(P) as
          phosphoryl donors
      - reference_id: file:interpro/panther/PTHR13158/PTHR13158-bioinformatics/RESULTS.md
        supporting_text: "| Bacteria | SF5 | 8/1112 (1%) |"
  - assessed_term:
      id: GO:0006741
      label: NADP+ biosynthetic process
    scope: UNRESOLVED
    scope_reason: >-
      The precise process for an NAD kinase, and the term the gene reviews of this family
      use in place of the inherited NAD+ metabolic process. Same boundary as the activity:
      safe for the eukaryotic clade, not established for the bacterial members. UNRESOLVED here means decided for the eukaryotic clade but not expressible as a subfamily scope.
    supported_by:
      - reference_id: PMID:23212377
        supporting_text: NAD kinase is the sole NADP(+) biosynthetic enzyme
      - reference_id: PMID:24847004
        supporting_text: >-
          NADK2 encodes the mitochondrial NAD kinase, which is crucial for NADP
          biosynthesis evidenced by decreased mitochondrial NADP(H) levels in patient
          fibroblasts
  - assessed_term:
      id: GO:0019674
      label: NAD+ metabolic process
    scope: UNRESOLVED
    scope_reason: >-
      True wherever the activity is, but less specific than GO:0006741, which the gene
      reviews use instead. Same eukaryotic boundary as the activity.
    supported_by:
      - reference_id: PMID:23212377
        supporting_text: NAD kinase is the sole NADP(+) biosynthetic enzyme
  - assessed_term:
      id: GO:0005739
      label: mitochondrion
    scope: UNRESOLVED
    scope_reason: >-
      Shown for human NADK2 and supported for mouse; inherited by the eukaryotic clade
      at PTN000994636 and not by the bacterial members. Within the eukaryotes it is
      untested for the nematode SF4 paralog nadk-1, a candidate cytosolic NAD kinase in
      a lineage without a PTHR20275 member whose other NAD kinase (nadk-2) is the SF5
      NADK2 ortholog, and for the Plasmodium and Phytophthora members. UNRESOLVED here means decided for the eukaryotic clade but not expressible as a subfamily scope.
    supported_by:
      - reference_id: PMID:23212377
        supporting_text: >-
          confirming that C5orf33 protein is a mitochondrial NADK, and that its
          N-terminal 62 residues contain a functional mitochondrial-targeting sequence
      - reference_id: file:interpro/panther/PTHR13158/PTHR13158-bioinformatics/RESULTS.md
        supporting_text: >-
          C. elegans has two NAD kinase genes, both in PTHR13158 and none in PTHR20275.
  - assessed_term:
      id: GO:0042736
      label: NADH kinase activity
    scope: NOT_APPLICABLE
    scope_reason: >-
      Human NADK2 phosphorylates NADH at only about a tenth of its NAD+ rate, and UniProt
      judges this weak in vitro activity probably irrelevant in vivo. The NADH kinases of
      the NAD kinase superfamily (yeast Pos5, Arabidopsis NADK3) are in other families. The
      "NADH kinase domain" mentioned in some papers is a CDD domain name, not an assayed
      activity. No member should carry this term on present evidence.
    supported_by:
      - reference_id: PMID:23212377
        supporting_text: the NADHK activity of C5orf33 protein was only 10% of its NADK activity
      - reference_id: file:human/NADK2/NADK2-uniprot.txt
        supporting_text: >-
          Also has weak NADH kinase activity in vitro; however NADH kinase activity is
          much weaker than the NAD(+) kinase activity and may not be relevant in vivo.
  - assessed_term:
      id: GO:0042803
      label: protein homodimerization activity
    scope: UNRESOLVED
    scope_reason: >-
      Two crystal structures show that human NADK2 is a dimer, and the dimerisation insert
      (EMKA) is reported as conserved in animal mitochondrial NAD kinases and absent from
      other NAD kinases. That makes the term plausible for the animal members, but PAINT
      has not placed it and conservation of EMKA has not been mapped across this tree
      (nematode SF4, non-animal eukaryotes, bacteria).
    supported_by:
      - reference_id: PMID:35868311
        supporting_text: >-
          We find that NADK2 presents an unexpected dimeric organization instead of the
          typical tetrameric assemblage observed for other NADKs.
      - reference_id: PMID:35733246
        supporting_text: >-
          the absence of cooperativity indicates that NADK2 forms a constitutively active
          homodimer that does not dissociate
