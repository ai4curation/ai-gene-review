- assessed_term:
    id: GO:0090448
    label: glucosinolate:proton symporter activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    H+-coupled glucosinolate import is shown for NPF2.10/GTR1, NPF2.11/GTR2 and NPF2.9/GTR3 (NPF2b),
    and nowhere else in the family. Orthologs outside the Brassicales act on cyanogenic glucosides.
    Glucosinolate specificity evolved before glucosinolate biosynthesis (Jorgensen et al. 2017), so
    in vitro activity in non-Brassicales orthologs is possible, but the physiological term only makes
    sense in glucosinolate-producing taxa.
