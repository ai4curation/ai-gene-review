    label: low-affinity nitrate transmembrane transporter activity
  scope: UNRESOLVED
  scope_reason: >-
    UniProt ARBA rule ARBA00084141 assigns this term to the tonoplast NPF5 group (NPF5.10, 5.12-5.16 in
    Arabidopsis; about 1,570 annotations across species). Five members of the group (NPF5.10, 5.11,
    5.12, 5.14, 5.16) are low-affinity nitrate transporters in oocytes, so the rule is plausible.
    NPF5.13 and NPF5.15 have not been assayed. Given the substrate lability in NPF5, untested members
    should not be treated as established.
