    NPF5.5, 5.8-5.12, 5.14 and 5.16 transport nitrate and/or nicotianamine instead. The
    IPR044739-to-GO:0071916 mapping should be removed. NPF5.2 (in the mixed SF453) keeps its own
    experimental annotation. Safe for the listed peptide-transporter subfamilies (non-exhaustive for
    bacterial, fungal and animal groups).
