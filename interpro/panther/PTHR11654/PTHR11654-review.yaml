  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Nitrate transport occurs in seven of the eight NPF clades, but no clade is uniform. Members with
    no nitrate influx occur in NPF2 (NPF2.8, 2.14), NPF4 (4.3, 4.4, 4.5), NPF5 (5.1, 5.3, 5.4, 5.7) and
    NPF8 (8.1, 8.3; NOT annotation on NPF8.3). Non-plant members are peptide transporters. PANTHER
    subfamilies are near one-to-one ortholog groups, so the term is listed only for subfamilies whose
    Arabidopsis member has direct heterologous nitrate-transport evidence and is the only Arabidopsis
    protein in the subfamily. Extending even these to orthologs in distant angiosperms assumes
    ortholog conservation, which the GSL-transporter work shows can break quickly. Mixed subfamilies
    (SF327 NPF2.1-2.5, SF444 NPF8.4/8.5, SF453 NPF5.2/5.3, SF381 NPF2.6/2.7, SF647 NPF5.13/5.14) are excluded. Elsewhere
    the term needs per-gene experimental evidence.
