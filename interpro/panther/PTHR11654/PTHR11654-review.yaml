    Arabidopsis NPF1.1-NPF7.3 (48 proteins in 41 PANTHER subfamilies). Substrates include nitrate,
    nitrite, chloride, K+, glucosinolates, alkaloids, flavonoids, nicotianamine, sugars, ABA, GA,
