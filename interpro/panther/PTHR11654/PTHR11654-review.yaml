family_id: PANTHER:PTHR11654
family_name: OLIGOPEPTIDE TRANSPORTER-RELATED
preferred_name: Proton-coupled oligopeptide transporter (POT/PTR/SLC15) family, including the plant NRT1/PTR FAMILY (NPF)
summary: >-
  PTHR11654 is the proton-coupled oligopeptide transporter (POT, also PTR or SLC15) family of the
  major facilitator superfamily: 12-transmembrane-helix secondary transporters found in bacteria,
  fungi, animals and plants. Outside plants, characterized members are mostly H+-coupled di- and
  tripeptide transporters (bacterial DtpA-D, yeast PTR2, mammalian SLC15A1/PEPT1 and SLC15A2/PEPT2;
  SLC15A3/A4 are endolysosomal peptide/histidine transporters). In land plants the family expanded
  into the NRT1/PTR FAMILY (NPF; 53 members in Arabidopsis, eight clades NPF1-NPF8). Only the NPF8
  clade has kept di/tripeptide transport as its predominant activity (NPF8.1/PTR1, NPF8.2/PTR5,
  NPF8.3/PTR2; NPF8.4 transports glycerate). The other clades transport, often more than one at a
  time, nitrate, nitrite, chloride, potassium, glucosinolates and cyanogenic glucosides, alkaloids,
  flavonoids, nicotianamine, sugars and the hormones ABA, gibberellins, jasmonoyl-isoleucine, IAA and
  IBA, and some (NPF6.3/NRT1.1, rice NRT1.1B) also act as nitrate sensors. Nitrate and gibberellin
  transport are scattered across clades rather than confined to one, and paralogs within a clade
  frequently differ, so membership in the family or in an NPF clade does not predict substrate. What
  is conserved family-wide is the MFS fold and transmembrane transporter activity; the TM1 ExxE[R/K]
  proton-coupling motif is conserved in most members but absent from the NPF2a subclade and the NPF7
  clade.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrate specificity diverges across and within plant NPF clades. NPF8 (and the non-plant SLC15,
  PTR2 and Dtp groups) transport di/tripeptides; NPF2b members transport glucosinolates and nitrate;
  NPF2a members export nitrate or chloride (NPF2.4, NPF2.5) and lack the ExxE[R/K] motif; NPF4 is
  largely ABA transporters, but NPF4.3/4.4/4.5 show no nitrate influx and NPF4.6 transports both
  nitrate and ABA; NPF5 mixes vacuolar nitrate transporters (NPF5.10/5.11/5.12/5.14/5.16),
  nicotianamine exporters (NPF5.8/5.9), a dipeptide transporter (NPF5.2/PTR3) and hormone
  transporters; NPF6 and NPF7 are mainly nitrate transporters, with NPF7.3 also moving K+ and IBA.
  A yeast screen of 12 NPF5 members found no dipeptide transport outside NPF5.2. The trigger review
  states that phylogenetic classification does not correlate with substrate specificity.
