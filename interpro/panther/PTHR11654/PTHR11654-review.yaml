    Arabidopsis NPF8.1-8.5. NPF8.1/PTR1, NPF8.2/PTR5 and NPF8.3/PTR2 are H+-coupled di/tripeptide
    transporters; NPF8.4/PTR4 transports glycerate; NPF8.5/PTR6 is a vacuolar transporter reported to
