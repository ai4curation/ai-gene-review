notes: >-
  Triggered by Morales de los Rios et al. 2026 (PMID:41276884). Membership and subfamilies: all 53
  reviewed Arabidopsis NPFs map to PTHR11654 (UniProt PANTHER xref; PANTHER 19 geneinfo API for SF
  ids; SF names verbatim from interpro/panther/panther.obo). There is no plant-specific PANTHER
  family. PANTHER SFs are near one-to-one ortholog groups and do not correspond to NPF clades, so the
  clade groupings above are given without SF ids. Main findings: (1) PAINT IBA for this family is
  conservative. Angiosperm NPF1-7 inherit only transmembrane transporter activity / transmembrane
  transport / membrane from the root. Substrate terms are confined to NPF8 (peptides), the NPF6.3
  ortholog group (nitrate) and the NPF5.2 group (tripeptide), so IBA is not the main source of
  over-annotation. (2) The over-annotation comes from InterPro2GO. IPR044739 (an NPF5 CDD model) maps
  dipeptide and tripeptide transmembrane transporter activity and dipeptide transport to every NPF5,
  and IPR018456 (PTR2 PROSITE signature) maps oligopeptide transport to roughly 9,700 plant proteins.
  Both mappings should be dropped or restricted (suggest to InterPro: map IPR044739 to GO:0022857 at
  most; drop GO:0006857 from IPR018456). (3) ARBA00084141 (low-affinity nitrate transporter, NPF5
  tonoplast group) is plausible but reaches untested members. ARBA00026300 (response to stress) on
  NPF6.2/6.3 is uninformative. Contested claims (the NPF4.4 transceptor hypothesis and NPF4.6 Na+/K+ currents)
  were not used for scoping. Arabidopsis GOA snapshot and ExxE[R/K] survey are in
  PTHR11654-bioinformatics/.
