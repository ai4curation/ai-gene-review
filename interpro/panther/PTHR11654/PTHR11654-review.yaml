residue_sites:
- site_id: tm1_exxer_motif
  label: TM1 ExxE[R/K] proton-coupling motif
  description: >-
    Conserved Glu-x-x-Glu-Arg/Lys block at the cytoplasmic end of TM1 (NPF6.3 E41, E44, R45). In POT
    transporters it couples proton binding to substrate transport. A pairwise-alignment survey of all
    53 Arabidopsis NPFs (PTHR11654-bioinformatics/RESULTS.md) finds it intact in NPF1.1/1.2, NPF2b,
    NPF3, most NPF5, NPF6 and NPF8. It is absent from NPF2a (NPF2.3-2.6 carry L-x-x-L/M-S/T) and from
    NPF7 (Q-x-x-A-T), and NPF4 has E-x-x-E-N. Its absence does not abolish transport. NPF2a members
    move nitrate or chloride, and NPF7 members transport nitrate, with some NPF7s showing
    motif-independent proton coupling. So the site informs whether a member is likely an H+-coupled
    symporter, not whether it is a transporter.
  anchor:
    id: UniProtKB:Q05085
    gene_symbol: CHL1
    organism: Arabidopsis thaliana
  anchor_sequence_version: 1
  residues:
  - position: 41
    expected:
    - E
    role: proton-coupling glutamate (motif position 1)
  - position: 44
    expected:
    - E
    role: proton-coupling glutamate (motif position 4)
  - position: 45
    expected:
    - R
    - K
    role: conserved basic residue (motif position 5), candidate nitrate contact in NPF6.3
  required_for:
  - term:
      id: GO:0015295
      label: solute:proton symporter activity
    strength: CONTRIBUTES
    rationale: >-
      In bacterial POTs and in NPF6.3 the TM1 Glu-x-x-Glu-Arg/Lys block is the proton-coupling
      element that links H+ binding to opening of the substrate pathway. Members that lack it can
      still transport, by facilitated efflux or by motif-independent coupling. So the motif
      contributes to proton symport but is not required for transporter activity in general.
    supported_by:
    - reference_id: PMID:24572366
      supporting_text: The previously identified ExxERF motif on TM1, which plays an important role in
        coupling proton binding to peptide transport 22 is present in the same position, as are Lys164
        (TM4) and Glu476 (TM10).
    - reference_id: PMID:28257001
      supporting_text: These constitute the EXXE[R/K] motif that has an indispensable role in proton
        coupling
    - reference_id: PMID:41276884
      supporting_text: Arabidopsis NPF2a transporters and the AtNPF7 clade lack this motif, suggesting
        potential alternative transport mechanisms.
  site_source: LITERATURE
  positive_controls:
  - id: UniProtKB:Q9M390
    gene_symbol: NPF8.1
    organism: Arabidopsis thaliana
    control_position: 38
    control_residue: E
  - id: UniProtKB:Q944G5
    gene_symbol: NPF2.10
    organism: Arabidopsis thaliana
    control_position: 75
    control_residue: E
