  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Di/tripeptide transport is the ancestral and predominant activity outside seed plants and in the
    plant NPF8 clade. It has been lost or replaced in most angiosperm NPF1-7 members. InterPro2GO
    maps this term from IPR044739 (CDD cd17417, "NPF subfamily 5") to every NPF5 member, about 4,180
