  scope: UNRESOLVED
  scope_reason: >-
    Only NRT1.1-type NPF6 members (AtNPF6.3, MtNPF6.8, OsNPF6.5) have shown nitrate-sensing roles,
    and NPF7.2/7.3 have only nitrate-induced expression. The PTN000183463 IBA extends the term to the
