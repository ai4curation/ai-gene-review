family_id: PANTHER:PTHR24198
family_name: ANKYRIN REPEAT AND PROTEIN KINASE DOMAIN-CONTAINING PROTEIN
summary: Ankyrin-repeat proteins form a broad interaction-module grouping spanning cytoskeletal ankyrins,
  kinase-containing signaling proteins, ubiquitin-system adaptors and toxins. The repeats provide protein-contact
  surfaces; the surrounding domains determine the biological mechanism.
functional_coherence: HETEROGENEOUS
coherence_reason: Giant fly Ank2 organizes presynaptic microtubules and stabilizes synapses (PMID:18439405;
  PMID:18439406). The actual member inventory also contains latrotoxins, ASB proteins, RIPK4 and viral
  ankyrin proteins, including disparate architectures within SF165. Consequently neither toxin activity
  nor kinase activity is a family-wide property. The exact 697-residue Ank2 benchmark product requires
  isoform-specific interpretation; its placement does not make every function of a giant ankyrin experimentally
  established on that product.
