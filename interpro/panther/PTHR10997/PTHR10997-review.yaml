family_id: PANTHER:PTHR10997
family_name: IMPORTIN-7, 8, 11
summary: Importin/exportin relatives are soluble transport receptors that carry selected proteins through
  the nuclear pore. Importin-7/Moleskin belongs to an import-receptor branch, while other members of this
  family include importin-8/9/11 and exportin-2. Cargo recognition and transport direction are central
  functional distinctions.
functional_coherence: HETEROGENEOUS
coherence_reason: Importin-beta-like receptors mediate Ran-dependent transport but recognize different
  cargoes. Fly DIM-7/Msk binds phosphorylated ERK and is required for its nuclear accumulation, with rescue
  restoring the phenotype (PMID:11262240). This is direct support for one fly cargo pathway; it does not
  establish that every importin-7/8/11-related member transports activated ERK or Smads. Nuclear import
  is a strong mechanism for characterized receptors, while the exact exhaustive family/subfamily grant
  remains unresolved rather than treating incomplete cargo coverage as a negative result.
