  name:
    name: Plant LRR receptor-like serine/threonine-protein kinases
    short: Plant_LRR-S/T_kinases
  description:
  - text: This family of proteins includes receptor-like serine/threonine-protein
      kinases that are involved in a variety of plant-specific signaling pathways.
      Members of this family are characterized by the presence of leucine-rich repeat
      (LRR) domains, suggesting a role in protein-protein interactions. Some proteins
      within this family are implicated in the regulation of the abscisic acid (ABA)
      signaling pathway, plant immune responses, including pathogen-triggered immunity
      (PTI), and symbiotic interactions with fungi and bacteria. Functions attributed
      to certain family members include negative regulation of ABA-sensitive genes,
      defense response activation, phosphorylation of specific substrates, and involvement
      in endosperm development during seed formation. Additionally, some members have
      dual specificity kinase activity, acting on both serine/threonine- and tyrosine-containing
      substrates, and are involved in processes such as photosynthesis and senescence-induced
      responses.
