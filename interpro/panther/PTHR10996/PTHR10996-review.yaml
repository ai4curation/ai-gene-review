preferred_name: 2-Hydroxyacid Dehydrogenase-Related
summary: 2-HYDROXYACID DEHYDROGENASE-RELATED (PANTHER:PTHR10996) is characterized in PANTHER PAINT across
  4 ancestral PTN node(s) (PANTHER:PTN000107798, PANTHER:PTN000107947, PANTHER:PTN000863938, PANTHER:PTN002251361)
  with 9 IBD node assertion(s) and 0 term(s) carrying negated IRD/IKR branch blocks, covering cytosol
  (GO:0005829, CC), 4-phosphoerythronate dehydrogenase activity (GO:0033711, MF), pyridoxine biosynthetic
  process (GO:0008615, BP), 'de novo' pyridoxal 5'-phosphate biosynthetic process (GO:0036001, BP) and
  3 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR10996 (2-HYDROXYACID DEHYDROGENASE-RELATED) span 4
  distinct ancestral PTN nodes (PANTHER:PTN000107798, PANTHER:PTN000107947, PANTHER:PTN000863938, PANTHER:PTN002251361)
  with different molecular function assignments across clades (4-phosphoerythronate dehydrogenase activity
  (GO:0033711), hydroxypyruvate reductase [NAD(P)H] activity (GO:0016618), glyoxylate reductase (NADPH)
  activity (GO:0030267), hydroxypyruvate reductase (NADH) activity (GO:0008465)), indicating clade-level
  functional specialization across the family.
