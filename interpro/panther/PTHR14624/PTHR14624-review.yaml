    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    Both seeds were assayed directly (Wilson et al. 2024) and are separated by the
    opisthokont-wide split, so a Eukaryota-level placement is reasonable. In the PAINT UniProt
    GAF the node passes the term (and GO:0005783, GO:0006488, GO:0043048) to all 126 family
    members found there; no IRD or IKR is recorded on it. The three gene reviews (SRD5A3, DFG10,
    S. pombe dfg10) accept the activity.
  supported_by:
