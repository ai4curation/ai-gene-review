family_id: PANTHER:PTHR14624
family_name: DFG10 PROTEIN
preferred_name: Polyprenal reductases of dolichol synthesis (SRD5A3/DFG10/PPRD)
summary: >-
  Multi-pass endoplasmic-reticulum membrane enzymes of the steroid 5-alpha-reductase fold that
  carry out the middle step of the three-step route from polyprenol to dolichol: NADPH-dependent
  saturation of the alpha-isoprene unit of polyprenal to give dolichal. Characterized members are
  human SRD5A3 and budding-yeast Dfg10; the family also contains the fission-yeast ortholog
  (SPAC7D4.09c, dfg10), the Arabidopsis PPRD1 and PPRD2, and the fly, worm, mouse and rat
  orthologs. Loss of SRD5A3 causes SRD5A3-CDG; loss of Dfg10 lowers dolichol and causes
  hypoglycosylation in yeast.
functional_coherence: COHERENT
coherence_reason: >-
  The family is a single orthology group: all reviewed members (19) sit in SF0 POLYPRENOL
  REDUCTASE, and the other two subfamilies (SF2, SF5) carry the same name. Human SRD5A3 and
  S. cerevisiae Dfg10 were both shown to reduce polyprenal to dolichal with NADPH and to have no
  detectable activity on polyprenol, so the earlier "polyprenol reductase" assignment was
  replaced for both. The early report of testosterone 5-alpha-reduction by over-expressed SRD5A3
  is not a family function (the SRD5A3 review marks it over-annotated). No paralog group with a
  different function is present.
