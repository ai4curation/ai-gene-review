      but not on polyprenol.
term_assessments:
- assessed_term:
    id: GO:0160198
    label: polyprenal reductase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Shown for human SRD5A3 and S. cerevisiae Dfg10, which span the family; the family has no
    divergent paralog group. This is the activity the modules attach to the family.
  supported_by:
  - reference_id: PMID:38821050
    supporting_text: As for SRD5A3, we observed an NADPH-dependent polyprenal reductase activity
      in membrane preparations, but no detectable conversion of polyprenol to dolichol (Figures
      4E and 4F).
  - reference_id: PMID:38821050
    supporting_text: reassign the function of SRD5A3/Dfg10
- assessed_term:
    id: GO:0043048
    label: dolichyl monophosphate biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    The product dolichal is reduced to dolichol and phosphorylated to Dol-P, so the enzyme
    performs a step of Dol-P synthesis. Loss lowers dolichol in yeast and human cells.
  supported_by:
  - reference_id: PMID:38821050
    supporting_text: We first measured polyisoprenoid levels from Dfg10-deficient yeast, and noted
      a 4-fold decrease in dolichol, accompanied by a 36-fold increase in polyprenol and a 45-fold
      increase in polyprenal
- assessed_term:
    id: GO:0006488
    label: dolichol-linked oligosaccharide biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    True for all members in the sense that the enzyme supplies the Dol-P carrier, but it is an
    upstream, non-core process: the enzyme does no step of oligosaccharide assembly. The SRD5A3
    review accepts the IBA, the DFG10 and S. pombe dfg10 reviews keep it as non-core; both
    retain it.
  supported_by:
  - reference_id: file:genes/yeast/DFG10/DFG10-ai-review.yaml
    supporting_text: Dfg10 makes the dolichol moiety that, after phosphorylation, becomes the carrier
- assessed_term:
    id: GO:0005783
    label: endoplasmic reticulum
  scope: FAMILY_WIDE
  scope_reason: >-
    ER localization is shown for SRD5A3 and Dfg10 and is consistent with the multi-pass topology
    of all members; the gene reviews prefer the more specific ER membrane (GO:0005789).
  supported_by:
  - reference_id: file:genes/SCHPO/dfg10/dfg10-ai-review.yaml
    supporting_text: IBA from PTN000379006 (donors human SRD5A3, rat, Arabidopsis) for endoplasmic
      reticulum.
