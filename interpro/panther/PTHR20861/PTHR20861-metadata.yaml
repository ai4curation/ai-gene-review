  name:
    name: GHMP kinase family homoserine kinase subfamily
    short: GHMP_kinase_homoserine_kinase
  description:
  - text: The GHMP kinase family homoserine kinase subfamily is characterized by its
      enzymatic function where members catalyze the ATP-dependent phosphorylation
      of L-homoserine to L-homoserine phosphate. This reaction is a key step in the
      biosynthesis of threonine, isoleucine, and methionine, which are essential amino
      acids in various organisms. The specificity of the enzyme for L-homoserine as
      a substrate is crucial for the proper functioning of the metabolic pathway.
      Some members of the family have been reported to have substrate specificity,
      unable to utilize other amino acids or analogs such as D-serine, L-serine, D-threonine,
      or L-threonine. The homoserine kinase subfamily plays a significant role in
      amino acid metabolism and is essential for the survival and growth of organisms
      that rely on the biosynthesis of these amino acids.
