family_id: PANTHER:PTHR20861
family_name: HOMOSERINE/4-DIPHOSPHOCYTIDYL-2-C-METHYL-D-ERYTHRITOL KINASE
preferred_name: GHMP-kinase family homoserine kinases and archaeal relatives
summary: >-
  GHMP (galacto-, homoserine, mevalonate, phosphomevalonate) kinase superfamily members. The
  dominant subfamily, SF1, is the ATP-dependent homoserine kinase (EC 2.7.1.39) that
  phosphorylates L-homoserine to O-phospho-L-homoserine, the committed step of threonine
  synthesis (S. cerevisiae THR1, S. pombe thr1, E. coli and B. subtilis ThrB, Arabidopsis
  HSK). Two smaller archaeal subfamilies carry other GHMP activities: SF3, the archaeal-type
  shikimate kinase, and SF6, beta-ribofuranosylphenol 5'-phosphate synthase of
  methanopterin biosynthesis.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family spans at least three distinct substrates within the GHMP fold. Homoserine
  kinase activity is confined to SF1 (343 of 344 reviewed SF1 members are named homoserine
  kinase); SF3 (21 members) are archaeal shikimate kinases of aromatic amino acid
  synthesis, and SF6 (3 members) are methanogen beta-ribofuranosylphenol 5'-phosphate
  synthases. One archaeal shikimate kinase (Aeropyrum pernix aroK) is classified in SF1.
  PAINT has no IBD node for this family, so no IBA is propagated.
subfamilies:
- subfamily_id: PANTHER:PTHR20861:SF1
  label: HOMOSERINE KINASE
  description: >-
    Homoserine kinases of fungi, bacteria and plants; the subfamily the threonine module uses.
  representative_members:
  - id: UniProtKB:P17423
    label: Homoserine kinase
    gene_symbol: THR1
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/THR1/THR1-ai-review.yaml
  - id: UniProtKB:O43056
    label: Homoserine kinase
    gene_symbol: thr1
    organism: Schizosaccharomyces pombe
    gene_review: genes/SCHPO/thr1/thr1-ai-review.yaml
  - id: UniProtKB:P00547
    label: Homoserine kinase
    gene_symbol: thrB
    organism: Escherichia coli K-12
  - id: UniProtKB:Q8L7R2
    label: Homoserine kinase
    gene_symbol: HSK
    organism: Arabidopsis thaliana
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR20861:SF3
  label: SHIKIMATE KINASE
  description: Archaeal GHMP-type shikimate kinases (aroK).
  representative_members:
  - id: UniProtKB:Q58835
    label: Shikimate kinase
    gene_symbol: aroK
    organism: Methanocaldococcus jannaschii
  diverged_from_family: true
  divergence_description: >-
    Phosphorylates shikimate in the archaeal aromatic amino acid pathway instead of
    homoserine.
  supported_by:
  - reference_id: file:interpro/panther/PTHR20861/PTHR20861-entries.csv
    supporting_text: Q58835,Shikimate kinase,protein,243232
- subfamily_id: PANTHER:PTHR20861:SF6
  label: BETA-RIBOFURANOSYLPHENOL 5'-PHOSPHATE SYNTHASE
  description: Methanogen enzymes of methanopterin biosynthesis.
  representative_members:
  - id: UniProtKB:Q58822
    label: Beta-ribofuranosylphenol 5'-phosphate synthase
    gene_symbol: MJ1427
    organism: Methanocaldococcus jannaschii
  diverged_from_family: true
  divergence_description: >-
    Not a homoserine kinase; a GHMP-fold enzyme of the methanopterin cofactor pathway.
  supported_by:
  - reference_id: file:interpro/panther/PTHR20861/PTHR20861-entries.csv
    supporting_text: Q58822,Beta-ribofuranosylphenol 5'-phosphate synthase,protein,243232
term_assessments:
- assessed_term:
    id: GO:0004413
    label: homoserine kinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The module's activity for this family (homoserine_kinase_activity, SF1). Yeast THR1 was
    cloned by complementation, its disruption causes threonine auxotrophy, the purified
    enzyme was followed by homoserine kinase activity, and it is homologous to the bacterial
    ThrB enzymes in the same subfamily. Not safe for SF3 or SF6. The obo also lists
    subfamilies SF8 and SF9 named HOMOSERINE KINASE that have no reviewed members in the
    inventory; they were not examined. Within SF1 the Aeropyrum shikimate kinase is
    excepted.
  applicable_subfamilies:
  - id: PANTHER:PTHR20861:SF1
    label: HOMOSERINE KINASE
  member_exceptions:
  - member:
      id: UniProtKB:Q9YEK6
      label: Shikimate kinase
      gene_symbol: aroK
      organism: Aeropyrum pernix
    exception_reason: >-
      Reviewed UniProt entry names it the Aeropyrum archaeal-type shikimate kinase, although
      PANTHER classifies it in SF1.
    supported_by:
    - reference_id: file:interpro/panther/PTHR20861/PTHR20861-entries.csv
      supporting_text: Q9YEK6,Shikimate kinase,protein,272557
  supported_by:
  - reference_id: PMID:2176637
    supporting_text: Disruption of the THR1 gene
      results in threonine auxotrophy in yeast.
  - reference_id: PMID:2176637
    supporting_text: Comparison of the amino acid sequences
      of yeast and bacterial HKs reveals substantial similarity.
  - reference_id: PMID:2165904
    supporting_text: monitoring homoserine kinase activity
- assessed_term:
    id: GO:0009088
    label: L-threonine biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The module's top-level concept. Homoserine kinase performs the first step of the
    threonine branch, so SF1 members take part in it. In plants O-phospho-L-homoserine also
    feeds methionine synthesis, which does not change the threonine role. Not applicable to
    SF3 or SF6.
  applicable_subfamilies:
  - id: PANTHER:PTHR20861:SF1
    label: HOMOSERINE KINASE
  supported_by:
  - reference_id: PMID:20305003
    supporting_text: Homoserine is converted to threonine by the sequential actions of homoserine kinase
      (Thr1p) and threonine synthase (Thr4p).
