notes: >-
  Used by modules/aspartate_family_threonine_biosynthesis.yaml (homoserine_kinase_activity,
  family_terms PTHR20861:SF1). All four module representatives (THR1, thr1, E. coli ThrB,
  Arabidopsis HSK) are in SF1, verified in UniProt and the PANTHER 19.0 classification
  files. `just fetch-panther-paint PTHR20861` found no PAINT node, so neither yeast THR1 nor
  S. pombe thr1 has a homoserine kinase IBA; THR1 is supported by IDA instead. The family
  name mentions 4-diphosphocytidyl-2-C-methyl-D-erythritol kinase (IspE), but no IspE is
  among the reviewed members of the inventory. The S. pombe thr1 gene review has no PAINT
  rows to adjudicate.
