  description:
  - text: This family of proteins includes members that are involved in the regulation
      of gene expression by modulating the chromatin structure. They are known to
      interact with histone deacetylases (HDACs) and p160 coactivators, which are
      part of the nuclear receptor complexes. Through these interactions, they can
      inhibit the transactivation of genes that are regulated by ligand-dependent
      nuclear receptors. This regulatory mechanism is important for controlling gene
      expression in various cellular processes.
