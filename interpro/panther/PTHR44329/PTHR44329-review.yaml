- assessed_term:
    id: GO:0004713
    label: protein tyrosine kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    Tyrosine kinase activity was previously scoped to SF298 on the strength of three Dictyostelium
    STAT kinases: Pyk2/splB and Pyk3 phosphorylate STATc on Tyr922, and DrkA autophosphorylates on
    tyrosine and phosphorylates STATa on Tyr702. Those three proteins reach SF298 only through their
    UniProt/InterPro cross-references. PANTHER 19's classification and tree, and the PAINT node their
    IBAs come from, place them in PTHR23257, and that placement is adopted (they are pinned there in
    interpro/panther/panther-members-overrides.tsv). Within PANTHER's own SF298 the characterized
    members are the MLKL pseudokinases, which have no kinase activity, and the only Dictyostelium
    member, DDB_G0271682, is uncharacterized. Dictyostelium SHK1/ShkA (SF8) is reported as
    dual-specificity, so tyrosine phosphorylation may occur somewhere in the family, but no subfamily
    has direct evidence that would justify a SUBFAMILY_ONLY scope.
  supported_by:
  - reference_id: PMID:22699506
    supporting_text: Pyk2 phosphorylates STATc on Tyr922 in vitro and complexes with STATc both in vitro
      and in vivo
  - reference_id: PMID:31002205
    supporting_text: recombinant DrkA protein is auto-phosphorylated on tyrosine
  - reference_id: PMID:16596165
    supporting_text: In addition, two kinases (SplA and Shk1) have dual-specificity, and four more (Dpyk2–4
      and ZakA) have tyrosine kinase activity
- assessed_term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    True for most characterized lineages: RAF, MLK/MAP3K, MOS, RIPK1-3 and CTR1. It is not safe
    family-wide, because it fails for the pseudokinase lineages (ILK, MLKL, pTKL). (The Dictyostelium
    STAT kinases Pyk3, for which serine/threonine activity is negligible, and DrkA are PTHR23257
    leaves in PANTHER 19 and do not bear on this family.) Listing every serine/threonine subfamily of a
    136-subfamily family is beyond this review, so the term is left unresolved rather than given a
    partial SUBFAMILY_ONLY list. Gene-level review should decide it per member.
  supported_by:
  - reference_id: PMID:25143406
    supporting_text: Whereas Pyk2 directed efficient 32P incorporation into MBP, the Pyk3 activity was
      in comparison negligible
  - reference_id: PMID:16596165
    supporting_text: The TKL group kinases have sequences reminiscent of both tyrosine and ser/thr kinases,
      though they are known to act biochemically as ser/thr kinases.
