  assessment: SOUND
  assessment_reason: >-
    Generic protein kinase activity is ancestral to the TKL group. The PAINT curator seeded this
    node with experimentally characterized kinases from animals, plants and Dictyostelium,
    including the SF298 tyrosine kinases splB, pyk3 and drkA. The broad term correctly covers both
    serine/threonine- and tyrosine-directed members. The known pseudokinase lineages (ILK, MLKL,
    Plasmodium pTKL) do not currently receive this IBA in GOA, so no pruning is required for this
    term.
  supported_by:
  - reference_id: PMID:25143406
    supporting_text: By analysis of cells expressing myc-tagged Pyk2 and Pyk3 in an in vitro kinase
      assay, we show that both enzymes directly increase tyrosine phosphorylation of STATc in response
      to cGMP.
- node_id: PANTHER:PTN001908418
  asserted_term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  paint_snapshot: '20260828'
  seeds:
  - id: UniProtKB:P15056
    label: BRAF
    organism: Homo sapiens
  - id: UniProtKB:P04049
    label: RAF1
    organism: Homo sapiens
  - id: UniProtKB:Q13546
    label: RIPK1
    organism: Homo sapiens
  - id: dictyBase:DDB_G0283267
    label: shkA
    organism: Dictyostelium discoideum
  assessment: UNRESOLVED
  assessment_reason: >-
    The node is seeded mainly by metazoan and plant serine/threonine kinases (RAF, MLK/MAP3K, RIPK,
    MOS), plus one Dictyostelium kinase, shkA, which is reported as dual-specificity. PAINT has
    already negated the term on the ILK branch (IRD at PTN001510364) and the MLKL branch (IKR at
    PTN008689042), consistent with the pseudokinase evidence. The reviewed SF298 Dictyostelium
    tyrosine kinases (splB, pyk3, drkA) do not receive this IBA, which suggests they fall outside
    the node's descent. That is appropriate given their tyrosine-directed activity. Without the
    tree, we cannot confirm that no other tyrosine-directed Dictyostelium lineage descends from
    this node.
  supported_by:
  - reference_id: PMID:16596165
    supporting_text: The TKL group kinases have sequences reminiscent of both tyrosine and ser/thr kinases,
      though they are known to act biochemically as ser/thr kinases.
