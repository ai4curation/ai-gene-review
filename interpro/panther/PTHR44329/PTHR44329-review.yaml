notes: >-
  Family name verified against panther.obo. The InterPro integrated name (IPR051681, "Serine/Threonine
  Kinases and Pseudokinases") and PANTHER's "TNNI3K-RELATED" both under-describe the membership; no
  TNNI3K appears in the local entries.csv sample (147 reviewed UniProt members; 136 subfamilies
  overall). Subfamily labels are PANTHER names verbatim (underscores as in panther.obo). In-repo gene
  reviews joined by DR PANTHER: splB, pyk3, drkA (SF298), gbpC and MAP3K20 (SF288), BRAF (SF240),
  Araf (SF55), Raf and lin-45 (SF262), CTR1 (SF281), ILK (SF57) and MLKL (SF298). Their positions
  agree with this review: the three SF298 Dictyostelium genes accept GO:0004713, and ILK removes
  GO:0004672. Human MLKL accepts the NOT protein kinase activity and NOT protein serine/threonine
  kinase activity rows (the latter from PAINT node PTN008689042, assessed SOUND here), keeps ATP
  binding as a non-catalytic nucleotide-binding property, and carries no tyrosine kinase term. This
  confirms the MLKL member exceptions; no scope change was needed. Several rows in the
  cached paint.tsv carry seeds from other families: PTN001981567 (protein serine/threonine kinase
  activity seeded by M. tuberculosis Pkn kinases), PTN008268578 (protein serine/threonine phosphatase
  activity seeded by PP2C/PPM phosphatases) and PTN008726241. These look like mis-attributed rows
  from the PAINT dump and were not adjudicated here; check them against the current PANTHER tree. The
  SF140 pTKL subfamily is also unresolved. Plasmodium pTKL has a NOT protein kinase activity IDA, yet
  its Dictyostelium member Q54FR9 inherits the GO:0004672 IBA, and Arabidopsis BHP has an IMP for
  kinase activity. No residue site is encoded: the PROSITE tyrosine-kinase active-site signature
  (IPR008266) does not separate tyrosine- from serine/threonine-directed members here. drkA carries
  the Ser/Thr signature IPR008271 yet phosphorylates STAT tyrosine.
  Membership caveat: the release-pinned PANTHER 19.0 classification files used by the member index
  place splB, pyk3 and drkA in PTHR23257 subfamilies (SF975, SF969, SF921), and MAP3K20 and gbpC in
  PTHR43289 and PTHR23257, whereas their UniProt PANTHER cross-references (and this family's
  entries.csv) place them in PTHR44329:SF298/SF288. The validator accepts both. The SF298
  tyrosine-kinase scoping above follows the UniProt/InterPro classification and should be revisited
  if PANTHER reassigns these Dictyostelium kinases.
