notes: >-
  Family name verified against panther.obo. The InterPro integrated name (IPR051681, "Serine/Threonine
  Kinases and Pseudokinases") and PANTHER's "TNNI3K-RELATED" both under-describe the membership; no
  TNNI3K appears in the local entries.csv sample (147 reviewed UniProt members; 136 subfamilies
  overall). Subfamily labels are PANTHER names verbatim (underscores as in panther.obo). In-repo gene
  reviews joined by DR PANTHER: splB, pyk3, drkA (SF298), gbpC and MAP3K20 (SF288), BRAF (SF240),
  Araf (SF55), Raf and lin-45 (SF262), CTR1 (SF281), ILK (SF57) and MLKL (SF298); of these, splB,
  pyk3, drkA and gbpC are PTHR23257 leaves in PANTHER's tree (see the membership resolution below).
  The three Dictyostelium STAT kinases accept GO:0004713 in their gene reviews, which is unaffected
  by their family placement, and ILK removes GO:0004672. Human MLKL accepts the NOT protein kinase activity and NOT protein serine/threonine
  kinase activity rows (the latter from PAINT node PTN008689042, assessed SOUND here), keeps ATP
  binding as a non-catalytic nucleotide-binding property, and carries no tyrosine kinase term. This
  confirms the MLKL member exceptions; no scope change was needed. Several rows in the
  cached paint.tsv carry seeds from other families: PTN001981567 (protein serine/threonine kinase
  activity seeded by M. tuberculosis Pkn kinases), PTN008268578 (protein serine/threonine phosphatase
  activity seeded by PP2C/PPM phosphatases) and PTN008726241. They are not from this family's tree;
  PTN001981567 is explained in the membership resolution below, and the other two were not adjudicated. The
  SF140 pTKL subfamily is also unresolved. Plasmodium pTKL has a NOT protein kinase activity IDA, yet
  its Dictyostelium member Q54FR9 inherits the GO:0004672 IBA, and Arabidopsis BHP has an IMP for
  kinase activity. No residue site is encoded: the PROSITE tyrosine-kinase active-site signature
  (IPR008266) does not separate tyrosine- from serine/threonine-directed members here. drkA carries
  the Ser/Thr signature IPR008271 yet phosphorylates STAT tyrosine.
  Membership resolution (October 2026). UniProt's PANTHER cross-references come from InterPro 110.0
  HMM best hits, and InterPro 110.0 integrates the same PANTHER release, 19.0, so the disagreement is
  one of method, not of release. For splB/Pyk2 (P18161), pyk3 (Q54I36), drkA (Q54H46) and gbpC
  (Q8MVR1), UniProt gives PTHR44329:SF298/SF288, but PANTHER 19's classification files and the
  PTHR23257 treeinfo place each in PTHR23257 (SF975, SF969, SF921 and SF711), in Dictyostelium clades
  next to D. purpureum orthologs or paralogs, and all four take their IBAs from the PTHR23257 node
  PTN001148170. PANTHER's own classification puts only nine Dictyostelium proteins in this family
  (shkA-E, drkD, arkA, DDB_G0271682, DDB_G0278535). PANTHER's placement is adopted, and the four are
  pinned in interpro/panther/panther-members-overrides.tsv. Human MAP3K20 (Q9NYL2) goes the other
  way. PANTHER's file gives PTHR43289:SF13, but the human leaf sits at the maximal branch length (2.0)
  inside a Homininae NEK6 clade (PTN002878625) of the PTHR43289 tree, and its mouse, rat, cow, Xenopus
  and zebrafish orthologs are all PTHR44329:SF288 in PANTHER's own files. That human placement is
  treated as an artifact, and MAP3K20 is pinned to SF288, matching UniProt. This also explains the
  out-of-family paint.tsv rows noted above: PTN001981567 is the LUCA root of the PTHR43289 tree
  and PTN001148170 the near-root node of the PTHR23257 tree. They appear in this family's slice only
  because the slice is built from UniProt/InterPro membership, and they are the sources of the IBAs
  that reach MAP3K20 and the Dictyostelium kinases respectively. Representative members, the
  tyrosine-kinase scope (now UNRESOLVED) and the PTN001148170 assessment were revised to match.
