- subfamily_id: PANTHER:PTHR44329:SF298
  label: MIXED LINEAGE KINASE DOMAIN-LIKE PROTEIN
  description: >-
    Mixed subfamily. It contains the vertebrate MLKL pseudokinases (human Q8NB16, mouse Q9D2Y4) and
    13 Dictyostelium TKL kinases: splA, splB/Pyk2, pyk3, drkA, drkB, drkC, zakA, zak2, roco7 and four
    uncharacterized DDB_G proteins. It also contains two Acanthamoeba polyphaga mimivirus kinases
    (R826, R831). All Dictyostelium members studied biochemically phosphorylate tyrosine: Pyk2, Pyk3
    and DrkA are STAT tyrosine kinases, and SplA and ZakA are dual-specificity or tyrosine kinases.
  representative_members:
