    gene_symbol: MLKL
    organism: Homo sapiens
    gene_review: genes/human/MLKL/MLKL-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    The Dictyostelium members are tyrosine-directed rather than serine/threonine kinases. Pyk2
    phosphorylates STATc on Tyr922, Pyk3 phosphorylates STATc on Tyr922 but has negligible activity
    on the Ser/Thr substrate myelin basic protein, and DrkA phosphorylates STATa on Tyr702. MLKL in
    the same subfamily is a catalytically inactive pseudokinase. It is phosphorylated by RIPK3 and
    executes necroptosis, so the subfamily is not catalytically uniform.
  supported_by:
