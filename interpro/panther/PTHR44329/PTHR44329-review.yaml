subfamilies:
- subfamily_id: PANTHER:PTHR44329:SF298
  label: MIXED LINEAGE KINASE DOMAIN-LIKE PROTEIN
  description: >-
    In PANTHER 19's own classification the subfamily holds the MLKL pseudokinases of vertebrates
    (human Q8NB16, mouse Q9D2Y4), a C. elegans protein (Q9NAC7) and a single Dictyostelium protein,
    the uncharacterized DDB_G0271682 (Q86HG9). The UniProt/InterPro cross-reference additionally
    assigns about a dozen Dictyostelium TKL kinases (splA, splB/Pyk2, pyk3, drkA-C, zakA, zak2, roco7
    and others) and two mimivirus kinases to SF298. PANTHER's tree places the characterized ones in
    PTHR23257 (splB SF975, pyk3 SF969, drkA SF921), and that placement is adopted here, so they are
    not listed as representatives.
  representative_members:
  - id: UniProtKB:Q8NB16
