- assessed_term:
    id: GO:0004713
    label: protein tyrosine kinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Tyrosine kinase activity is shown directly for three SF298 Dictyostelium kinases. Pyk2/splB and
    Pyk3 autophosphorylate on tyrosine and phosphorylate STATc on Tyr922, and DrkA autophosphorylates
    on tyrosine and phosphorylates STATa on Tyr702. The Dictyostelium kinome analysis also reports
    tyrosine or dual-specificity activity for SplA and ZakA, both in SF298. This is a lineage-specific
    gain in Dictyostelium, which has no TK-group kinases. It must not descend to the family, whose
    other characterized members are serine/threonine kinases or pseudokinases. Within SF298 the term
    does not hold for the MLKL pseudokinases, recorded as exceptions. For the uncharacterized
    Dictyostelium and mimivirus SF298 members it is a reasonable but untested inference. Shk1/shkA
    (SF8) is reported as dual-specificity, so SF298 is the subfamily with direct evidence, not
    necessarily the only Dictyostelium TKL lineage with tyrosine activity.
