family_id: PANTHER:PTHR44329
family_name: SERINE/THREONINE-PROTEIN KINASE TNNI3K-RELATED
preferred_name: TKL-group protein kinases and pseudokinases (RAF, MLK/MAP3K, RIPK, MOS, CTR1, ILK, MLKL
  and Dictyostelium SHK kinases)
summary: >-
  A large PANTHER family of eukaryotic (and giant-virus) protein kinases from the tyrosine kinase-like
  (TKL) group. It groups the RAF kinases (ARAF, BRAF, RAF1, Drosophila Raf, C. elegans LIN-45), the
  mixed-lineage and related MAP3Ks (MAP3K9-13, MAP3K20/ZAK, MAP3K21), MOS, the receptor-interacting
  kinases RIPK1-3, plant CTR1/STY/HT1-type kinases, and a small set of Dictyostelium TKL kinases
  (the SHK kinases, DrkD and ArkA). Most characterized members are serine/threonine kinases acting in
  MAP kinase, ethylene, cell-death or immune signalling. Several lineages are pseudokinases with no
  detectable catalytic activity: ILK, an adhesion scaffold; MLKL, the necroptosis executioner, which
  is activated by RIPK3 phosphorylation; and Plasmodium pTKL. UniProt/InterPro cross-references also
  score many more Dictyostelium TKL kinases into this family, among them the STAT tyrosine kinases
  Pyk2 (splB), Pyk3 and DrkA and the cGMP-binding ROCO kinase GbpC, but PANTHER's own tree places
  those in the Ser/Thr kinase family PTHR23257, and that placement is adopted here (see notes).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members share the TKL kinase fold, and protein kinase activity is ancestral. Beyond that, no
  specific catalytic or process term holds family-wide. (1) Catalytic competence is lost in ILK
  (SF57), in MLKL (SF298) and in Plasmodium pTKL (SF140), while the RAF, MLK/MAP3K, MOS, RIPK and CTR1
  lineages are active serine/threonine kinases. (2) Biological roles range from MAPK cascades (RAF,
  MAP3Ks) and necroptosis (RIPK3, MLKL) to cell adhesion (ILK) and ethylene signalling (CTR1). (3)
  Substrate specificity is not uniform either: Dictyostelium SHK1/ShkA (SF8) is reported as
  dual-specificity. The experimentally tyrosine-directed Dictyostelium STAT kinases (Pyk2/splB, Pyk3,
  DrkA) were previously treated as SF298 members on the strength of their UniProt cross-references;
  PANTHER 19 places them in PTHR23257, so they no longer define this family's boundaries.
