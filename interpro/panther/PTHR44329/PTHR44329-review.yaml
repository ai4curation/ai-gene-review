family_id: PANTHER:PTHR44329
family_name: SERINE/THREONINE-PROTEIN KINASE TNNI3K-RELATED
preferred_name: TKL-group protein kinases and pseudokinases (RAF, MLK/MAP3K, RIPK, MOS, CTR1, ILK, MLKL
  and Dictyostelium TKLs)
summary: >-
  A large PANTHER family of eukaryotic (and giant-virus) protein kinases from the tyrosine kinase-like
  (TKL) group. It groups the RAF kinases (ARAF, BRAF, RAF1, Drosophila Raf, C. elegans LIN-45), the
  mixed-lineage and related MAP3Ks (MAP3K9-13, MAP3K20/ZAK, MAP3K21), MOS, the receptor-interacting
  kinases RIPK1-3, plant CTR1/STY/HT1-type kinases, and a large set of Dictyostelium-specific TKL
  kinases (SHK, ROCO, DRK, ZAK and PYK proteins). Most characterized members are serine/threonine
  kinases acting in MAP kinase, ethylene, cell-death or immune signalling. Two kinds of exception
  define the functional boundaries. Several lineages are pseudokinases with no detectable catalytic
  activity: ILK, an adhesion scaffold; MLKL, the necroptosis executioner, which is activated by RIPK3
  phosphorylation; and Plasmodium pTKL. Conversely, several Dictyostelium TKL kinases phosphorylate
  tyrosine although the group is otherwise serine/threonine-directed. Pyk2 (splB), Pyk3 and DrkA
  phosphorylate the activating tyrosine of STAT transcription factors, acting as functional analogues
  of the metazoan JAKs that Dictyostelium lacks.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members share the TKL kinase fold, and protein kinase activity is ancestral. Beyond that, no
  specific catalytic or process term holds family-wide. (1) Substrate specificity varies. RAF,
  MLK/MAP3K, MOS, RIPK and CTR1 lineages are serine/threonine kinases. Within subfamily SF298, the
  Dictyostelium kinases splB/Pyk2, pyk3 and drkA are experimentally tyrosine-directed STAT kinases,
  and SplA and ZakA (also SF298) are reported as dual-specificity or tyrosine kinases. (2) Catalytic
  competence is lost in ILK (SF57), in MLKL (also SF298), and in Plasmodium pTKL (SF140). (3) Biological
  roles range from MAPK cascades (RAF, MAP3Ks) and necroptosis (RIPK3, MLKL) to cell adhesion (ILK),
  ethylene signalling (CTR1) and Dictyostelium STAT activation. SF298 is itself mixed: the PANTHER
  subfamily named after the human MLKL pseudokinase also contains the Dictyostelium STAT tyrosine
  kinases.
