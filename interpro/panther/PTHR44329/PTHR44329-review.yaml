node_assessments:
- node_id: PANTHER:PTN001148170
  asserted_term:
    id: GO:0004672
    label: protein kinase activity
  paint_snapshot: '20260601'
  seeds:
  - id: UniProtKB:Q9Y572
    label: RIPK3
    organism: Homo sapiens
  - id: dictyBase:DDB_G0285321
    label: splB
    organism: Dictyostelium discoideum
  - id: dictyBase:DDB_G0289001
    label: pyk3
    organism: Dictyostelium discoideum
  - id: dictyBase:DDB_G0289791
    label: drkA
    organism: Dictyostelium discoideum
  - id: AGI_LocusCode:AT1G08720
    label: EDR1
    organism: Arabidopsis thaliana
  assessment: SOUND
  assessment_reason: >-
    PTN001148170 is not a node of the PANTHER 19 PTHR44329 tree. It is the child of the root of the
    PTHR23257 (SERINE-THREONINE PROTEIN KINASE) tree, and every reference-proteome leaf that takes an
    IBA from it is classified in PTHR23257 by PANTHER 19. It appears in this family's PAINT slice only
    because the slice is built from UniProt/InterPro membership (entries.csv), which includes splB,
    pyk3, drkA and gbpC; PANTHER's tree places all four in PTHR23257 (SF975, SF969, SF921, SF711), and
    this node is the source of their IBAs. For those proteins the assertion is sound: they are active
    kinases (Pyk2 and Pyk3 phosphorylate STATc directly), and splB, pyk3 and drkA are among the node's
    seeds through their own experimental evidence, which is expected and not circular. No leaf of the
    PTHR44329 tree inherits from this node, so it says nothing about this family's own members.
  supported_by:
  - reference_id: PMID:25143406
    supporting_text: By analysis of cells expressing myc-tagged Pyk2 and Pyk3 in an in vitro kinase
      assay, we show that both enzymes directly increase tyrosine phosphorylation of STATc in response
      to cGMP.
- node_id: PANTHER:PTN001908418
  asserted_term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  paint_snapshot: '20260828'
  seeds:
  - id: UniProtKB:P15056
    label: BRAF
    organism: Homo sapiens
  - id: UniProtKB:P04049
    label: RAF1
    organism: Homo sapiens
  - id: UniProtKB:Q13546
    label: RIPK1
    organism: Homo sapiens
  - id: dictyBase:DDB_G0283267
    label: shkA
    organism: Dictyostelium discoideum
  assessment: UNRESOLVED
  assessment_reason: >-
    The node is seeded mainly by metazoan and plant serine/threonine kinases (RAF, MLK/MAP3K, RIPK,
    MOS), plus one Dictyostelium kinase, shkA, which is reported as dual-specificity. PAINT has
    already negated the term on the ILK branch (IRD at PTN001510364) and the MLKL branch (IKR at
    PTN008689042), consistent with the pseudokinase evidence. The Dictyostelium tyrosine kinases
    splB, pyk3 and drkA do not receive this IBA because they are PTHR23257 leaves, not members of
    this tree. Whether any tyrosine-directed lineage descends from this node has not been checked
    against the tree.
  supported_by:
  - reference_id: PMID:16596165
    supporting_text: The TKL group kinases have sequences reminiscent of both tyrosine and ser/thr kinases,
      though they are known to act biochemically as ser/thr kinases.
- node_id: PANTHER:PTN008689042
  asserted_term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  node_taxon:
    id: NCBITaxon:6072
    label: Eumetazoa
  paint_snapshot: '20260828'
  assessment: SOUND
  assessment_reason: >-
    This is a negative (IKR, NOT) PAINT assertion on the MLKL clade, blocking inheritance of
    serine/threonine kinase activity from PTN001908418. It is correct: biochemical work shows that
    the activity once attributed to MLKL comes from contaminating kinases, and MLKL acts as a
    nucleotide-binding pseudokinase switch phosphorylated by RIPK3. The human MLKL gene review
    accepts the IBA NOT protein serine/threonine kinase activity propagated from this node, and
    also accepts the NOT protein kinase activity (ISS) row.
  supported_by:
  - reference_id: PMID:24107129
    supporting_text: it is probable that the catalytic activity previously attributed to MLKL is likely
      to arise from the catalytic activity of a contaminating protein
