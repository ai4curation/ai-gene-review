  scope: UNRESOLVED
  scope_reason: >-
    True for most characterized lineages: RAF, MLK/MAP3K, MOS, RIPK1-3 and CTR1. It is not safe
    family-wide, because it fails for the pseudokinase lineages (ILK, MLKL, pTKL). It is also
    unsupported as a core activity for the SF298 STAT kinases: Pyk3 has negligible activity on
    myelin basic protein. DrkA autophosphorylates on threonine as well as tyrosine, so some
    serine/threonine activity is not excluded there. Listing every serine/threonine subfamily of a
    136-subfamily family is beyond this review, so the term is left unresolved rather than given a
    partial SUBFAMILY_ONLY list. Gene-level review should decide it per member.
  supported_by:
