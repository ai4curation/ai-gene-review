family_id: PANTHER:PTHR11540
family_name: MALATE AND LACTATE DEHYDROGENASE
preferred_name: Malate dehydrogenase (MDH) family
summary: >-
  NAD-dependent L-malate dehydrogenases interconvert malate and oxaloacetate. S. cerevisiae has three
  compartment-specific isozymes: mitochondrial MDH1 (TCA cycle), cytosolic MDH2 (gluconeogenesis
  and glyoxylate cycle) and peroxisomal MDH3. The family also contains S. pombe mdh1, human mitochondrial
  MDH2, bacterial Mdh and plant mitochondrial and peroxisomal MDHs.
functional_coherence: COHERENT
coherence_reason: >-
  All members are NAD-malate dehydrogenases. Subfamilies differ in compartment and pathway, not activity.
