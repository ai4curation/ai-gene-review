  name:
    name: Serine/Threonine Protein Kinase
    short: Ser_Thr_protein_kinase
  description:
  - text: The Ser/Thr protein kinase family is involved in a variety of cellular processes
      across different organisms. Members of this family function as key regulators
      of signal transduction pathways, influencing plant growth and development, photoreception,
      and auxin transport. In plants, they are crucial for phototropic responses,
      regulating chloroplast relocations, stomatal opening, and leaf expansion. They
      also play roles in root and shoot organogenesis by modulating polar auxin transport,
      affecting tissue patterning and organ development. Some members activate flippases,
      contributing to phospholipid asymmetry in membranes, while others participate
      in oxidative burst-mediated signaling and resistance to pathogen infection.
      This family includes kinases that are activated by phosphorylation and can be
      regulated by various factors such as PDPK1/PDK1, magnesium, and phosphatidic
      acid.
