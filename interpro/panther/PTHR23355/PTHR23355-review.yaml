family_id: PANTHER:PTHR23355
family_name: RIBONUCLEASE
preferred_name: RNase II/R (RNB) family of processive 3'-to-5' exoribonucleases
summary: 'The RNB family comprises hydrolytic, processive 3''-to-5'' exoribonucleases that release 5''-nucleoside
  monophosphates: bacterial RNase II (rnb) and RNase R (rnr), and eukaryotic DIS3 (catalytic subunit of
  the RNA exosome, with an additional PIN endonuclease domain), DIS3L and DIS3L2 (cytoplasmic, uridylated-RNA
  decay). Members share cold-shock/S1 RNA-binding domains flanking the RNB catalytic domain. Bacterial
  RNase R is distinguished by its ability to degrade through structured RNA and acts in mRNA decay and
  rRNA quality control.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: Hydrolytic 3'-to-5' exoribonuclease activity is shared; complex membership (eukaryotic
  exosome), the PIN endonuclease of DIS3, compartment and substrate classes (structured RNA, uridylated
  RNA, miRNA) are lineage-specific.
