family_id: PANTHER:PTHR11516
family_name: PYRUVATE DEHYDROGENASE E1 COMPONENT, ALPHA SUBUNIT  BACTERIAL AND ORGANELLAR
preferred_name: Pyruvate dehydrogenase E1 alpha subunit family
summary: >-
  The thiamine-diphosphate-binding alpha subunit of the alpha2beta2 E1 component of pyruvate dehydrogenase.
  The family contains S. cerevisiae PDA1, S. pombe pda1, human PDHA1 and testis PDHA2, and plant
  mitochondrial and plastid E1 alpha. Bacterial acetoin dehydrogenase E1 alpha (AcoA) is also placed
  here.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Pyruvate decarboxylation is shared by the PDH E1 alpha subunits. SF60 also contains P. putida AcoA,
  an acetoin-cleaving E1 alpha subunit.
