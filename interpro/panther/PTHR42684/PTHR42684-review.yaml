    supporting_text: >-
      We demonstrate that BIO3 (YNR058w) and BIO4 (YNR057c) encode, respectively, a 7,
      8-diaminopelargonic acid aminotransferase and a dethiobiotin synthase
  - reference_id: PMID:20713166
    supporting_text: >-
      Whereas the 7,8-diaminopelargonic acid synthase and dethiobiotin synthetase are encoded by
      distinct genes in bacteria and the yeast Saccharomyces cerevisiae, both activities are
      performed in A. nidulans by a single enzyme, encoded by the bifunctional gene bioDA.
