  seeds:
  - id: AGI_LocusCode:AT5G57590
    label: BIO3-BIO1
    organism: Arabidopsis thaliana
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The only seed is the Arabidopsis BIO3-BIO1 fusion, whose dethiobiotin synthase activity sits
    in its BioD domain (Pfam AAA_26). The node correctly covers the BioDA fusions of plants and
    filamentous fungi (Arabidopsis B0F481, rice Q6ZKV8, A. nidulans Q5AYI6, each with AAA_26 plus
