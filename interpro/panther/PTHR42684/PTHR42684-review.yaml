notes: >-
  Modules. (1) biotin_biosynthesis uses the family id PTHR42684 for the BioA/BIO3 annoton
  (GO:0004015) and for the BIO6 annoton (GO:0008710). Its statements that the bacterial
  exemplars are SF17, fungal BIO3/BioDA are SF3, and BIO6 is SF17 were checked against the
  entries file and the UniProt cross-references, and are accurate. It does not mention that SF3
  also contains POP2 and other GABA transaminases. (2) gaba_shunt uses the same family id for
  POP2 with GO:0034387. The two modules therefore select the same protein set for two different
  activities. Gene reviews: BIO3 accepts the PTN000241343 IBAs (correct for BIO3), REMOVEs the
  PTN000241344 dethiobiotin synthase IBA and marks its mitochondrion IBA over-annotated; this
  review adjudicates the node to match. BIO6 (E9P8E0) receives no IBA in the cached PAINT UniProt
  GAF. Its review leaves GO:0008710 ISS UNDECIDED and accepts biotin biosynthesis. No POP2 or
  other GABA-T gene review exists in the repo. Domain content of P50277, Q5AYI6 and B0F481
  (Pfam AAA_26, Aminotran_3) was checked in UniProt, and node membership in the PAINT UniProt
  GAF, on 2026-10-06.
