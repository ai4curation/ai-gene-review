term_assessments:
- assessed_term:
    id: GO:0004015
    label: S-adenosyl-L-methionine:8-amino-7-oxononanoate transaminase activity
  scope: UNRESOLVED
  scope_reason: >-
    Holds for bacterial BioA (SF17) and for the eukaryotic and cyanobacterial BioA members of SF3
    (BIO3, the BioDA fusions, Synechococcus BioA). SF3 also contains the pyruvate-dependent GABA
    transaminases. SF17 contains BIO6, whose activity is unknown and which acts before KAPA.
    Neither subfamily is therefore safe as a whole. The biotin_biosynthesis BioA annoton uses
    the family id PTHR42684, which also selects every GABA transaminase, vanillin
    aminotransferase and BauA. A required_function or member-level selector is needed.
  supported_by:
  - reference_id: PMID:1092682
    supporting_text: >-
      The transamination of 7-keto-8-aminopelargonic acid by 7, 8-diaminopelargonic acid
      aminotransferase of Escherichia coli requires S-adenosyl-L-methionine as the amino donor.
  - reference_id: PMID:10333520
    supporting_text: >-
      We demonstrate that BIO3 (YNR058w) and BIO4 (YNR057c) encode, respectively, a 7,
      8-diaminopelargonic acid aminotransferase and a dethiobiotin synthase, involved in the
      biotin biosynthesis pathway.
- assessed_term:
    id: GO:0009102
    label: biotin biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    Holds for BioA and BioDA, and for BIO6, which genetics place in biotin synthesis before KAPA.
    It does not hold for the GABA, vanillin or beta-alanine aminotransferases. These are mixed
    into SF3 and spread over SF1, SF8, SF10, SF19 and SF20.
  supported_by:
  - reference_id: PMID:16269718
    supporting_text: >-
      These results suggest that Bio6p acts in an unknown step of biotin synthesis before KAPA
      synthesis.
- assessed_term:
    id: GO:0004141
    label: dethiobiotin synthase activity
  scope: UNRESOLVED
  scope_reason: >-
    Only the BioDA fusion proteins of filamentous fungi and plants, which carry a BioD (AAA_26)
    domain. This is a member-level domain-architecture property within SF3. It does not hold for
    monofunctional BIO3 or bacterial BioA. In the biotin_biosynthesis module, BioD activity is
    attached to PTHR43210 (BioD/BIO4), with the fusions noted only in prose; that is consistent
    with this review.
  member_exceptions:
  - member:
      id: UniProtKB:P50277
      label: Adenosylmethionine-8-amino-7-oxononanoate aminotransferase
      gene_symbol: BIO3
      organism: Saccharomyces cerevisiae
      gene_review: genes/yeast/BIO3/BIO3-ai-review.yaml
    exception_reason: >-
      Monofunctional DAPA aminotransferase without a BioD domain. Dethiobiotin synthase in
      S. cerevisiae is BIO4.
    pruned_node_id: PANTHER:PTN000241344
    supported_by:
    - reference_id: PMID:10333520
      supporting_text: >-
        We demonstrate that BIO3 (YNR058w) and BIO4 (YNR057c) encode, respectively, a 7,
        8-diaminopelargonic acid aminotransferase and a dethiobiotin synthase
  supported_by:
  - reference_id: PMID:20713166
    supporting_text: >-
      both activities are performed in A. nidulans by a single enzyme, encoded by the bifunctional
      gene bioDA.
- assessed_term:
    id: GO:0034387
    label: 4-aminobutyrate:pyruvate transaminase activity
  scope: UNRESOLVED
  scope_reason: >-
    The plant mitochondrial GABA transaminases only: Arabidopsis POP2 (SF3), tomato GABA-TP1-3
    and rice GABA-T (SF3, SF8, SF10, SF19, SF20). PAINT asserts no GABA-transaminase node in this
    family. The gaba_shunt module's POP2 annoton uses the family id PTHR42684, which also
    selects every BioA and BIO3. As with BioA, a required_function or member-level selector is
    needed.
  supported_by:
  - reference_id: PMID:19264755
    supporting_text: >-
      Activity assays indicated that purified recombinant GABA-T has both pyruvate- and
      glyoxylate-dependent activities, but cannot utilize 2-oxoglutarate as amino acceptor.
- assessed_term:
    id: GO:0008710
    label: 8-amino-7-oxononanoate synthase activity
  scope: UNRESOLVED
  scope_reason: >-
    Asserted by the biotin_biosynthesis module (and by SGD as ISS) for Saccharomyces BIO6 only.
    Genetics place BIO6 before KAPA, but no activity of purified BIO6 has been reported. KAPA
    synthase is otherwise a class II alpha-oxoamine synthase reaction (BioF, PTHR13693), and BIO6
    is a class III aminotransferase-fold BIO3 paralog. The BIO6 review leaves the ISS
    UNDECIDED. The term is not safe for any other member of this family.
  supported_by:
  - reference_id: PMID:16269718
    supporting_text: >-
      The BIO6 disruptant was able to grow in biotin-deficient medium supplemented with
      7-keto-8-amino-pelargonic acid (KAPA), while the bio3 disruptant was not able to grow in
      this medium.
- assessed_term:
    id: GO:0005739
    label: mitochondrion
  scope: UNRESOLVED
  scope_reason: >-
    Correct for the plant BIO3-BIO1 fusions and the plant mitochondrial GABA transaminases. It is
    not established for S. cerevisiae BIO3, and the bacterial members have no mitochondrion.
  supported_by:
  - reference_id: PMID:19264755
    supporting_text: >-
      Full-length AtGABA-T contains an N-terminal 36 amino acid long targeting pre-sequence (36
      amino acids) that is both sufficient and necessary for targeting the enzyme to
      mitochondria.
