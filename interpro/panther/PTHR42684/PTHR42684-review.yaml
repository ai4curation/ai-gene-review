family_id: PANTHER:PTHR42684
family_name: ADENOSYLMETHIONINE-8-AMINO-7-OXONONANOATE AMINOTRANSFERASE
preferred_name: BioA-type class III aminotransferases and plant/bacterial pyruvate-dependent omega-aminotransferases (GABA-T, vanillin aminotransferase, beta-alanine aminotransferase)
summary: >-
  A family of pyridoxal 5'-phosphate (PLP)-dependent fold-type I (class III) aminotransferases.
  The best-known members are the DAPA aminotransferases (BioA, EC 2.6.1.62). BioA transfers the
  alpha-amino group of S-adenosyl-L-methionine to 8-amino-7-oxononanoate (KAPA), forming
  7,8-diaminononanoate (DAPA) in biotin synthesis. Examples are E. coli BioA, S. cerevisiae BIO3,
  and the BioA domains of the bifunctional BioD-BioA (BioDA) proteins of filamentous fungi and
  plants. The family also contains the Saccharomyces BIO6 protein, a BIO3 paralog required for a
  step before KAPA whose activity has not been shown biochemically. It also contains several
  plant and bacterial omega-aminotransferases that use pyruvate (or glyoxylate) as amino
  acceptor: the mitochondrial GABA transaminases (Arabidopsis POP2, tomato GABA-TP1-3, rice
  GABA-T), the capsaicinoid-pathway vanillin aminotransferases of Capsicum, and the bacterial
  beta-alanine/omega-amino acid:pyruvate aminotransferases (P. aeruginosa BauA, Caulobacter
  AptA).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family groups at least three activities with different substrates and pathways:
  SAM:KAPA aminotransferase (biotin synthesis), GABA:pyruvate/glyoxylate transaminase (GABA
  catabolism in plants) and beta-alanine/vanillin:pyruvate aminotransferases. PANTHER subfamilies
  do not separate them cleanly. SF3 holds S. cerevisiae BIO3, the fungal and plant BioDA fusions
  and Synechococcus BioA, but also Arabidopsis POP2, tomato GABA-TP1 and rice GABA-T3. SF17 holds
  bacterial BioA and the Saccharomyces BIO6 paralog. The single family-root PAINT node passes
  SAM:KAPA aminotransferase activity and biotin biosynthesis to all of these groups. In addition,
  the dethiobiotin synthase activity of the BioDA fusions belongs to their BioD domain, which the
  monofunctional members lack.
