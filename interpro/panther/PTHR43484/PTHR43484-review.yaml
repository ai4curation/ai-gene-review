family_id: PANTHER:PTHR43484
family_name: FAMILY NOT NAMED
preferred_name: FliN/FliY flagellar switch protein family
summary: >-
  FliN is the bottom-layer subunit of the flagellar C ring. Tetramers of its SpoA-type
  domain assemble under FliM, and FliN contributes to switching and to docking the flagellar
  export ATPase complex. In Bacillus and related Firmicutes the paralog FliY carries an
  additional N-terminal CheC-like domain and dephosphorylates CheY-P at the motor, so the
  switch itself contributes to signal termination in those lineages. Proteobacterial FliN
  (E. coli, Salmonella, Pseudomonas, including P. putida KT2440) lacks that phosphatase
  domain.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are C-ring switch proteins. The CheY-P phosphatase activity is confined to
  FliY-type members with a CheC-like domain; proteobacterial FliN lacks it. All members
  sit in SF1, so the subfamily does not separate the two.
