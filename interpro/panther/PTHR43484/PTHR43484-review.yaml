- assessed_term:
    id: GO:0009433
    label: bacterial-type flagellum basal body, C ring
  scope: FAMILY_WIDE
  scope_reason: FliN and FliY are C-ring subunits across the family, the location the chemotaxis module's C-ring
    switch complex represents. The plant-genome sequence below PTN005165499 is not a flagellar protein in its
    host.
  supported_by:
  - reference_id: file:PSEPK/fliN/fliN-uniprot.txt
    supporting_text: FliN is one of three proteins (FliG, FliN, FliM) that form the rotor-mounted switch complex
      (C ring), located at the base of the basal body.
- assessed_term:
    id: GO:0004721
    label: phosphoprotein phosphatase activity
  scope: UNRESOLVED
  scope_reason: Bacillus FliY P24073 is a demonstrated CheY-P phosphatase, while structural FliN members lack
    the extra catalytic architecture. Both occur in PTHR43484:SF1. UNRESOLVED is the scope of a family-wide
    or SF1-wide grant, not uncertainty about the measured FliY activity. The review has no sequence-mapped
    residue-site assessment sufficient for RESIDUE_DETERMINED and the schema lacks an architecture-dependent
    scope. Keep the phosphatase role restricted to demonstrated FliY-type CheC-domain plus FliN/M structural-domain
    proteins, with catalytic competence or direct evidence; CheC-like fold similarity alone is insufficient.
    The existing TOO_DEEP PAINT assessment remains. No universal denial, artificial family-wide exception list
    or invented PTN is used.
  supported_by:
