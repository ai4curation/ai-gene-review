family_id: PANTHER:PTHR43484
family_name: FAMILY NOT NAMED
preferred_name: FliN/FliY flagellar switch protein family
summary: FliN is the bottom-layer subunit of the flagellar C ring. Tetramers of its SpoA-type domain assemble
  under FliM, and FliN contributes to switching and to docking the flagellar export ATPase complex. In Bacillus
  and related Firmicutes the paralog FliY carries an additional N-terminal CheC-like domain and dephosphorylates
  CheY-P at the motor, so the switch itself contributes to signal termination in those lineages. Proteobacterial
  FliN (E. coli, Salmonella, Pseudomonas, including P. putida KT2440) lacks that phosphatase domain.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Characterized bacterial members contribute to the C-ring switch. CheY-P phosphatase chemistry
  is demonstrated for FliY-type members carrying the additional catalytic CheC-like region and is not implied
  for shorter structural FliN proteins. Both architectures occur in SF1, so the subfamily cannot delimit phosphatase
  applicability. The separately recorded plant-genome sequence is not evidence for a bacterial flagellar function
  in its host.
