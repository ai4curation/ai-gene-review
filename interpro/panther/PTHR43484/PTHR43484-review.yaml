notes: 'PANTHER has no official name for this family ("FAMILY NOT NAMED"); InterPro calls it the FliN/MopA/SpaO
  family. Node membership was read from the cached PANTHER treeinfo tree: PTN000504261 covers 25 of 26 leaves,
  including the Ricinus leaf B9T9Y2. PTN005165499 is not in the current tree and is assessed from the PAINT
  row alone. The KT2440 FliN FUNCTION statement is backed by a UniRule RuleBase rule. Follow-up 2026-11-06:
  explicit GO:0004721 term assessment records the experimentally supported FliY activity and the mixed SF1
  boundary. The official PANTHER subfamily label FLAGELLAR MOTOR SWITCH PROTEIN FLIN is retained verbatim and
  is not interpreted as excluding FliY. Architecture-sensitive family coverage remains unresolved under the
  current scope enum; no residue positions, new PTNs, classification records or gene annotations were changed.'
