notes: >-
  Clade memberships and subfamily assignments were read from the cached PANTHER tree
  (.cache/panther_trees/PTHR24240.json.gz, leaves below each PTN node), and IBA inheritance by unreviewed
  human members (GPR52, GPR88, OPN3, OPN5, RGR, RRH, OPN4) was checked in QuickGO. The cached tree gives leaf
  sets per node, not branch lengths or the alignment, so the proposed better placements (PTN001202194 for
  photoreceptor activity; at or below PTN000662180 for the outer segment) are inferences from clade content.
  Not assessed: PTN002797189 (regulation of circadian rhythm, melanopsin clade), which lies on no reviewed
  member's lineage, and PTN001203169 and PTN002517669, which carry seeds from bombesin-receptor and other GPCRs
  and have no leaves in the cached PTHR24240 tree. None of the reviewed visual-opsin gene reviews removes or
  marks over-annotated an IBA, so no member exceptions are needed.
