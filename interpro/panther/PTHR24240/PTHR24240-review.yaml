family_id: PANTHER:PTHR24240
family_name: OPSIN
summary: >-
  PTHR24240 groups the animal opsins with several non-opsin class A G protein-coupled receptors. The opsins
  bind a retinal chromophore through a Schiff-base lysine and act as light-activated G protein-coupled
  receptors; they comprise the vertebrate visual pigments of rods (rhodopsin) and cones (long-, medium- and
  short-wave-sensitive opsins and their non-mammalian relatives), non-visual opsins (OPN3 encephalopsin,
  OPN4 melanopsin, OPN5 neuropsin, pineal and vertebrate-ancient opsins), the photoisomerase-like RGR and
  peropsin, and invertebrate ciliary and rhabdomeric opsins. In the cached PANTHER tree the family root also
  holds the orphan receptors GPR52 and GPR88, each in its own clade beside the opsins, and invertebrate
  receptors annotated as neuropeptide receptors. Light absorption and G protein-coupled photoreception are
  therefore properties of the opsin clades, not of the family as a whole, and rod/cone-specific attributes
  (photoreceptor outer segment, transducin coupling, visual perception) belong only to the vertebrate visual
  pigments.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family root (PANTHER:PTN008398221, 749 of the 752 leaves in the cached tree) contains, besides the
  opsin crown clade PTN001202194, separate clades for GPR88 (PTHR24240:SF147, which also holds the
  C. elegans neuropeptide-receptor-like nmur-3), GPR52 (PTHR24240:SF225 and relatives) and RGR. GPR52 is a
  self-activated orphan receptor whose extracellular loop 2 acts as a built-in agonist, and GPR88 is a
  Gi-coupled orphan receptor; neither is a photoreceptor. Within the opsins, the visual rod and cone
  pigments are a vertebrate branch, while OPN3, OPN4 and OPN5 are non-visual opsins expressed outside rods
  and cones.
