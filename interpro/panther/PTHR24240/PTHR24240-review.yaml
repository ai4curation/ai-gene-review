term_assessments:
- assessed_term:
    id: GO:0005886
    label: plasma membrane
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member is a seven-transmembrane class A GPCR, so plasma membrane is safe family-wide as a broad
    location. For the vertebrate visual pigments it is true but not the functional site: rod discs are not
    plasma membrane in GO (the RHO review keeps the IBA as non-core), and for cones the gene reviews refine it
    to cone photoreceptor disc membrane (GO:0120201), an is_a descendant. Neither action disputes the
    family-level term.
  supported_by:
  - reference_id: file:genes/human/OPN1LW/OPN1LW-ai-review.yaml
    supporting_text: Cone discs arise as evaginations of the ciliary plasma membrane and remain contiguous with it
- assessed_term:
    id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  scope: FAMILY_WIDE
  scope_reason: >-
    Opsins signal through heterotrimeric G proteins, and the non-opsin orphans in the family do too: GPR52
    couples to Gs and GPR88 is a Gi-coupled receptor. The open cases are RGR and peropsin, whose G protein
    coupling is not established (the RGR review leaves the row UNDECIDED); they are not refuted, so the term
    is kept family-wide. For the visual pigments the gene reviews refine it to GO:0141190.
  supported_by:
  - reference_id: PMID:32076264
    supporting_text: Pathological malfunction of GPR52 signalling occurs primarily through the heterotrimeric Gs protein
  - reference_id: PMID:29311635
    supporting_text: the cilia specific Gi-protein coupled receptor GPR88
- assessed_term:
    id: GO:0008020
    label: G protein-coupled photoreceptor activity
  scope: UNRESOLVED
  scope_reason: >-
    Not family-wide. The activity belongs to the opsins (crown clade PTN001202194: visual pigments, OPN3,
    OPN4, OPN5 and invertebrate ciliary and rhabdomeric opsins) and not to the GPR52 and GPR88 clades, which
    are orphan receptors activated without light (GPR52 by its own extracellular loop 2). The subfamily
    boundary cannot be listed with confidence: the opsin crown spans 43 PANTHER subfamilies, many of them
    uncharacterized invertebrate sequences under generic names, and G protein coupling by RGR and peropsin is
    not established. The node assessment for PTN008398221 records which subfamilies should not inherit it.
  supported_by:
  - reference_id: PMID:32076264
    supporting_text: extracellular loop 2 occupies the orthosteric binding pocket and operates as a built-in agonist
  - reference_id: PMID:31380578
    supporting_text: are the two main functions of most OPN subfamilies
- assessed_term:
    id: GO:0007602
    label: phototransduction
  scope: UNRESOLVED
  scope_reason: >-
    As for G protein-coupled photoreceptor activity: true of the opsin clades and not of the GPR52 and GPR88
    clades; the exact subfamily boundary within the opsin crown is not established here. For the vertebrate
    visual pigments the gene reviews refine it to transducin-mediated opsin signaling (GO:0141190).
  supported_by:
  - reference_id: PMID:32076264
    supporting_text: extracellular loop 2 occupies the orthosteric binding pocket and operates as a built-in agonist
- assessed_term:
    id: GO:0071482
    label: cellular response to light stimulus
  scope: UNRESOLVED
  scope_reason: >-
    Light responses are a property of the opsins and of RGR (a light-dependent photoisomerase), not of the
    orphan GPR52 and GPR88 clades. Boundary as for G protein-coupled photoreceptor activity. The visual-pigment
    gene reviews refine the row to GO:0141190.
  supported_by:
  - reference_id: PMID:32076264
    supporting_text: A fully active state is achieved when Gs is coupled to GPR52 in the absence of an external agonist
- assessed_term:
    id: GO:0016038
    label: absorption of visible light
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Light absorption needs the retinal chromophore, so it is an opsin property, not a family-wide one. The
    PAINT node (PTN000662180, Chordata) covers the vertebrate visual and pineal/vertebrate-ancient pigments and
    the tunicate and amphioxus C-type opsins; the applicable subfamilies listed are the twelve below that node
    plus melanopsin, whose sensitivity peak lies in the visible range. Other opsins also absorb light (OPN3,
    peropsin, RGR; OPN5 peaks at the UVA boundary, 380 nm) but their wavelength range is not established
    here, so they are left unlisted rather than excluded. GPR52 and GPR88 do not absorb light.
