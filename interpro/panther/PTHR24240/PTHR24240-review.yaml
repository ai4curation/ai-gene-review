  paint_snapshot: '20260828'
  assessment: TOO_DEEP
  assessment_reason: >-
    In the cached tree this node is the ciliary-opsin clade (266 leaves). Besides the vertebrate rod and cone
    pigments it covers OPN5 (SF0), OPN3 (SF197), the insect and Daphnia pteropsins (SF133), and amphioxus and
    sea urchin opsins. All seeds are vertebrate rod or cone pigments. The outer segment is a vertebrate rod and
    cone structure, and OPN3 and OPN5 are non-visual opsins expressed in skin, brain and retinal ganglion
    cells; QuickGO shows human OPN3 and OPN5 receiving this IBA from the node. The term arose with the
    vertebrate visual pigments, at or below PTN000662180 (Chordata), which holds the visual and pineal
    pigments but not OPN3, OPN5 or the arthropod pteropsins. The four reviewed members (SF15, SF16, SF17,
    SF180) are inside the correctly scoped part, so their ACCEPT actions stand.
