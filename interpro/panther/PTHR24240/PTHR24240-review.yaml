- node_id: PANTHER:PTN008398221
  asserted_term:
    id: GO:0008020
    label: G protein-coupled photoreceptor activity
  evidence: IBD
  paint_snapshot: '20260828'
  assessment: TOO_DEEP
  assessment_reason: >-
    The node is the family root. Below it, beside the opsin crown clade PTN001202194, sit a GPR88 clade
    (SF147, 121 leaves, including C. elegans nmur-3) and a GPR52 clade (SF225 and relatives), plus an RGR
    clade. All seeds are opsins. GPR52 is self-activated by its own extracellular loop 2 and GPR88 is an
    orphan Gi-coupled receptor; neither is a photoreceptor, yet QuickGO shows human GPR52 and GPR88 receiving
    this IBA from the node. The opsins are thought to descend from a duplication shared with the melatonin
    receptors, so photoreception arose inside this family rather than at its root. The term belongs at the
    opsin crown (PTN001202194) and possibly separately in the RGR clade, which the cached data cannot settle.
    The reviewed visual opsins are inside the opsin crown and their ACCEPT actions stand.
