  asserted_term:
    id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  evidence: IBD
  paint_snapshot: '20260828'
  assessment: SOUND
  assessment_reason: >-
    G protein signalling is shared by the opsins and by the orphan receptors under the root (GPR52 via Gs,
    GPR88 via Gi). Coupling by RGR and peropsin is not established, but it is not refuted either, so this is
    not a pruning case on present evidence.
  supported_by:
  - reference_id: PMID:32076264
    supporting_text: Pathological malfunction of GPR52 signalling occurs primarily through the heterotrimeric Gs protein
  - reference_id: PMID:29311635
