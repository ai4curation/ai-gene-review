family_id: PANTHER:PTHR19876
family_name: COATOMER
preferred_name: Coatomer, LIS1 and other WD-repeat interaction proteins
summary: This PANTHER group combines coatomer subunits with LIS1/NudF, mitochondrial-division factors
  and Crt10-related proteins. These proteins use related interaction scaffolds in distinct cellular machines.
  Budding-yeast Crt10 recruits a cullin-E3 ligase pathway to nonfunctional large-subunit rRNA decay rather
  than acting as a COPI coat subunit.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory contains coatomer alpha/beta-prime, LIS1/NudF and Mdv1-related scaffolds.
  Direct budding-yeast Crt10 experiments establish a distinct Rtt101-dependent nonfunctional 25S rRNA
  decay role (PMID:25534857). Pombe crt10 is therefore compared to the Crt10 branch, not assigned Golgi
  vesicle coating from the family name or pre-mRNA splicing from its SF20 label. This comparison is ortholog
  inference, not a pombe rRNA-decay assay.
reference_protein:
  id: UniProtKB:O42996
  gene_symbol: crt10
  organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
  label: Uncharacterized WD repeat-containing protein C27B12.05
  gene_review: genes/SCHPO/crt10/crt10-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR19876:SF20
  label: PRE-MRNA-SPLICING FACTOR PRP46-LIKE
  description: The member inventory contains COPI alpha/beta-prime, LIS1 and Mdv1 proteins, and experimental
    Crt10 work supports a separate rRNA-quality-control role. The official coatomer name is not a safe
    family-wide functional label and does not establish Golgi trafficking for pombe Crt10.
