family_id: PANTHER:PTHR12215
family_name: PHOSPHOPANTETHEINE TRANSFERASE
preferred_name: Sfp-type 4'-phosphopantetheinyl transferase family (LYS5/AASDHPPT)
summary: >-
  Sfp-type phosphopantetheinyl transferases attach the 4'-phosphopantetheine arm of CoA to carrier
  domains. In fungi, LYS5 (S. cerevisiae) and lys7 (S. pombe) activate alpha-aminoadipate reductase
  (LYS2) for lysine synthesis. Human AASDHPPT activates the acyl carrier proteins of cytosolic fatty
  acid synthase and of mitochondria.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF10 (LYS5, lys7, AASDHPPT) are broad-specificity PPTases. SF22 (E. coli YieE) and SF15 are uncharacterized
  or AcpS-like.
