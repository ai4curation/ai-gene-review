  name:
    name: Phosphopantetheinyl Transferase Superfamily
    short: P-Pant_transferase_sf
  description:
  - text: The P-Pant transferase superfamily, specifically the AcpS and Gsp/Sfp/HetI/AcpT
      families, consists of enzymes that play a crucial role in the activation of
      carrier proteins involved in various biosynthetic pathways. These enzymes transfer
      the 4'-phosphopantetheine moiety from coenzyme A to a serine residue on acyl-carrier-proteins
      (ACPs) or peptidyl-carrier proteins (PCPs). This post-translational modification
      is essential for converting inactive apo-carrier proteins into their active
      holo-forms, enabling them to carry acyl groups for fatty acid synthesis, as
      well as for the production of polyketides, nonribosomal peptides, and other
      secondary metabolites. The modification is also necessary for the function of
      proteins involved in the synthesis of lysine and other metabolites, playing
      a significant role in growth, development, and the production of antibiotics
      and pigments. The family's enzymes are also implicated in virulence and are
      inhibited by various antifungal compounds.
