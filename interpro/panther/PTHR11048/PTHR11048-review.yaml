family_id: PANTHER:PTHR11048
family_name: PRENYLTRANSFERASES
preferred_name: UbiA/COQ2 4-hydroxybenzoate polyprenyltransferase family
summary: >-
  Intramembrane UbiA-superfamily prenyltransferases. The main subfamily (SF28) attaches the polyprenyl
  tail to 4-hydroxybenzoate, the first committed step of ubiquinone synthesis: bacterial UbiA, S.
  cerevisiae COQ2, S. pombe ppt1 and human COQ2 in the mitochondrial inner membrane. Smaller subfamilies
  prenylate fungal meroterpenoid precursors (AusN/AndD, SF39) or make decaprenyl-phosphoribose (SF5).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The 4-hydroxybenzoate polyprenyltransferase activity is uniform in SF28. SF39 and SF5 use other
  acceptors.
