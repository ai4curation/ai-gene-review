family_id: PANTHER:PTHR13914
family_name: PROLINE OXIDASE
preferred_name: Monofunctional FAD-dependent proline dehydrogenases (PUT1, PRODH, POX) and hydroxyproline dehydrogenase (PRODH2)
summary: >-
  FAD-dependent (beta-alpha)8-barrel flavoenzymes that oxidize L-proline to
  1-pyrroline-5-carboxylate and pass the electrons to the respiratory chain via ubiquinone. In
  eukaryotes they are mitochondrial inner-membrane enzymes that start proline catabolism (S.
  cerevisiae PUT1, the predicted fission yeast SPCC70.03c, human PRODH, Drosophila slgA,
  Arabidopsis POX1/POX2); bacterial monofunctional PRODHs such as Bacillus subtilis FadM and
  PutB and Thermus/Deinococcus enzymes belong to the same subfamily. Vertebrate PRODH2 (SF29) is
  a hydroxyproline dehydrogenase that strongly prefers trans-4-hydroxy-L-proline.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Proline dehydrogenase activity, FAD binding and proline catabolism are shared by the
  characterized SF0 and SF31 members from bacteria, fungi, plants and animals. The one
  characterized exception is the vertebrate SF29 paralog PRODH2/HYPDH, which prefers
  hydroxyproline; PAINT already handles it with an IRD. SF0 also contains Pectobacterium CarD,
  a carbapenem-biosynthesis protein whose substrate was not checked here.
