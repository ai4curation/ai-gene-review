family_id: PANTHER:PTHR43235
family_name: GLUTAMINE AMIDOTRANSFERASE PB2B2.05-RELATED
preferred_name: PuuD-like class I glutamine amidotransferase-fold gamma-glutamyl hydrolases (peptidase C26)
summary: >-
  Family of class I glutamine amidotransferase-like (GATase1 fold, Pfam Peptidase_C26) proteins with a
  Cys-His-Glu catalytic triad, PuuD-like by InterPro (IPR044668). Characterized bacterial members are
  gamma-glutamyl hydrolases rather than glutamine amidotransferases: E. coli PuuD and P. aeruginosa SpuA
  hydrolyse gamma-glutamyl-gamma-aminobutyrate to GABA and glutamate in the gamma-glutamylation route of
  polyamine catabolism, and a Campylobacter jejuni member is named as a gamma-glutamyl-CDP-amidate
  hydrolase. The family also holds poorly characterized Firmicute,
  mycobacterial, rickettsial, fungal (S. pombe PB2B2.05) and plant (Arabidopsis GAT1_2.1) proteins named
  only by fold.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The fold and cysteine-dependent gamma-glutamyl transfer chemistry are shared, but the gamma-glutamyl
  substrate differs among characterized members (gamma-Glu-GABA for PuuD and SpuA, gamma-glutamyl-CDP-amidate
  for the Campylobacter member), and both kinds sit in the large subfamily SF1. A glutamine-using GATase of the same fold class
  was inactive on gamma-Glu-GABA, so neither glutamine hydrolysis nor gamma-Glu-GABA hydrolysis is safe at
  family level.
