    Seeded by E. coli PuuD, whose purified enzyme hydrolyses gamma-Glu-GABA (active-site Cys-114). The
    independently characterized P. aeruginosa SpuA, a descendant, prefers gamma-Glu-GABA, which confirms the
    activity is inherited across the Pseudomonas branch of the clade. The node is the PuuD clade, not the whole
    of SF1, so the Campylobacter gamma-glutamyl-CDP-amidate hydrolase is not implied to inherit it.
