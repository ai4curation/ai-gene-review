term_assessments:
- assessed_term:
    id: GO:0033969
    label: gamma-glutamyl-gamma-aminobutyrate hydrolase activity
  scope: UNRESOLVED
  scope_reason: >-
    No PANTHER subfamily isolates the PuuD clade, so no subfamily-level grant is safe. The term is safe for the PuuD clade under PTN000230196 within SF1, not for SF1 as a whole: SF1 also contains a
    gamma-glutamyl-CDP-amidate hydrolase and fold-named proteins of unknown substrate. Members should receive
    the term by descent from PTN000230196 (or PuuD-like gene context), not by family or subfamily membership.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43235/PTHR43235-paint.tsv
    supporting_text: "PTHR43235\tPTN000230196\tGO:0033969\tF\tIBD\tfalse\tUniProtKB:P76038"
  - reference_id: file:interpro/panther/PTHR43235/PTHR43235-entries.csv
    supporting_text: Q0P8J7,Gamma-glutamyl-CDP-amidate hydrolase
- assessed_term:
    id: GO:0006541
    label: L-glutamine metabolic process
  scope: UNRESOLVED
  scope_reason: >-
    Transferred to members by a fold-level UniRule for class I glutamine amidotransferases. The characterized
    PuuD-clade members hydrolyse gamma-glutamyl amides of GABA and polyamines (P. aeruginosa SpuA prefers
    gamma-Glu-GABA), and no member is shown to act on glutamine, so the fold does not establish glutamine
    metabolism. Because glutamine has not been tested as a substrate for most members, the term is treated as an
    over-annotation on unassayed members and removed only where a member's own assays define its role (SpuA).
  supported_by:
  - reference_id: PMID:34605433
    supporting_text: Activity and substrate-binding assays confirm that SpuA exhibits a preference for γ-Glu-GABA as a substrate.
