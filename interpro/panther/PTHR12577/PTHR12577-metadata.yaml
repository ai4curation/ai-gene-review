  name:
    name: Dachshund domain-containing protein
    short: Dachshund_domain
  description:
  - text: This family of proteins includes transcription factors involved in the regulation
      of organogenesis. Members of this family appear to regulate the SIX1, SIX6,
      and possibly SIX5 genes, influencing myogenesis and the proliferation of precursor
      cells in myoblasts. They are known to act as corepressors or coactivators in
      these processes, depending on their interaction with other proteins such as
      EYA3, CREBBP, NCOR1, TBL1, HDAC1, and HDAC3. These proteins are also implicated
      in the repression of cyclin-dependent kinase inhibitors, including the p27Kip1
      promoter, which is key in cell cycle regulation. Some family members inhibit
      TGF-beta signaling through interactions with SMAD4. They are characterized by
      a conserved DNA-binding domain known as the DACHbox-N or DD1 domain, which is
      structurally similar to the forkhead/winged helix domain and is responsible
      for their DNA-binding activity.
