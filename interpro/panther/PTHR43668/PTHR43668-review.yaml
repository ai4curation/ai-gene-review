  - id: UniProtKB:Q5B4C7
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Over-reaches in two independent directions. Taxonomically, purine nucleobase catabolism fits
    organisms with urate oxidase (plants, Aspergillus), but S. cerevisiae lacks the
    purine-to-allantoin route; the DAL1 review marks the row over-annotated. Separately, it
    descends unpruned to P. aeruginosa pyrQ, an experimentally confirmed dihydroorotase whose
    leaf PTN002462798 lies outside the PTN000182407 sub-clade where this term was pruned
    alongside allantoinase activity. The second is the one with a concrete, targetable fix
    today, so it is what the proposed action names; the taxonomic over-reach needs a decision
    about which clades retain the route and is left for the family's next revision.
  proposed_action:
    paint_action: ADD_IRD
    target_node_id: PANTHER:PTN002462798
