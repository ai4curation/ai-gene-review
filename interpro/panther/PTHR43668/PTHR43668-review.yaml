  member_exceptions:
  - member:
      id: UniProtKB:Q88D29
      gene_symbol: pyrC'
      organism: Pseudomonas putida KT2440
    exception_reason: >-
      Catalytically inactive dihydroorotase-like subunit of the aspartate transcarbamoylase complex.
    supported_by:
    - reference_id: file:genes/PSEPK/pyrC'/pyrC'-ai-review.yaml
      supporting_text: encodes a catalytically inactive dihydroorotase-like subunit
  - member:
      id: UniProtKB:Q9HT33
      gene_symbol: pyrQ
      organism: Pseudomonas aeruginosa PAO1
    pruned_node_id: PANTHER:PTN000909483
    exception_reason: >-
      An active dihydroorotase, not an allantoinase. PA5541 is pyrC2, one of the two loci whose
      products carry dihydroorotase activity in P. aeruginosa: the cloned gene complements an
      Escherichia coli pyrC mutant and the pyrC pyrC2 double mutant is an absolute pyrimidine
      auxotroph while neither single mutant is. It is the complement of the pyrC' exception above
      — both are Pseudomonas pyrC-family proteins that this subfamily has absorbed, one
      catalytically dead and this one catalytically active on the other substrate. The family's
      own PAINT records already draw this distinction, but not over this branch: PTN000909483 is
      the ancestral gain node for allantoinase activity, and below it PAINT pruned allantoinase
      activity, allantoin catabolism and purine nucleobase catabolism at PTN000182407 with three
      negated IRD rows naming PTN000909483 as the ancestor they override, asserting GO:0004151
      there instead. This gene's leaf is PTN002462798, which descends from PTN000909483 but not
      from PTN000182407, so no loss covers it and the ancestral allantoinase assertions reach it
      unpruned — confirmed by gene_paint_losses, which reports no IRD or IKR on its lineage, and
      consistent with its having no GO:0004151 IBA. The upstream ask is therefore an added loss
      on this branch, not a re-rooting of the leaf. The target is the leaf rather than a clade
      above it because PTN002462789, its parent, holds 34 leaves including Escherichia coli AllB
      (P77671) — a genuine allantoinase, and one of this IBD's own seeds — so a loss there would
      remove the term from a member that supports it. No allantoinase assay has been done on the
      protein in either direction, and P. aeruginosa PAO1 has no entry annotated with EC 3.5.2.5
      at all.
    supported_by:
    - reference_id: PMID:15278241
      supporting_text: >-
        Two of these genes, designated pyrC (PA3527) and pyrC2 (PA5541), encode polypeptides
        with dihydroorotase (DHOase) activity
    - reference_id: PMID:15278241
      supporting_text: >-
        A pyrC, pyrC2 double mutant was also constructed, and this strain had an absolute
        requirement for pyrimidines.
    - reference_id: file:interpro/panther/PTHR43668/PTHR43668-paint.tsv
      supporting_text: "PTHR43668\tPTN000182407\tGO:0004038\tF\tIRD\ttrue"
  supported_by:
  - reference_id: file:interpro/panther/PTHR43668/PTHR43668-paint.tsv
    supporting_text: "PTHR43668\tPTN000909483\tGO:0004038\tF\tIBD\tfalse"
  - reference_id: file:genes/yeast/DAL1/DAL1-ai-review.yaml
    supporting_text: >-
