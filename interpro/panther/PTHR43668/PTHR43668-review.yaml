family_id: PANTHER:PTHR43668
family_name: ALLANTOINASE
preferred_name: Allantoinase family (amidohydrolase superfamily)
summary: >-
  Metal-dependent cyclic amidohydrolases. Allantoinases (S. cerevisiae DAL1, E. coli AllB, plant
  ALN) hydrolyse allantoin to allantoate. SF2 also holds the catalytically inactive dihydroorotase-like
  PyrC' subunit of Pseudomonas aspartate transcarbamoylase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Most members are allantoinases; PyrC' (SF2) is an inactive structural subunit.
