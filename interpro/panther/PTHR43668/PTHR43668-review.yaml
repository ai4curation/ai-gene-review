family_id: PANTHER:PTHR43668
family_name: ALLANTOINASE
preferred_name: Allantoinase family (amidohydrolase superfamily)
summary: >-
  Metal-dependent cyclic amidohydrolases. Allantoinases (S. cerevisiae DAL1, E. coli AllB, plant
  ALN) hydrolyse allantoin to allantoate. The family also absorbs dihydroorotases at both ends of
  the activity range: SF2 holds the catalytically inactive dihydroorotase-like PyrC' subunit of
  Pseudomonas aspartate transcarbamoylase, and SF4 holds P. aeruginosa pyrQ, an active
  dihydroorotase. PAINT recognises the chemistry at PTN000182407, a sub-clade of the allantoinase
  node where allantoinase and its downstream processes are pruned and GO:0004151 asserted
  instead; pyrQ's leaf falls outside that sub-clade.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Most members are allantoinases. The exceptions are dihydroorotase-family proteins: PyrC' (SF2),
  an inactive structural subunit of aspartate transcarbamoylase, and pyrQ (SF4), an active
  dihydroorotase.
