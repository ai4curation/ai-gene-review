        label: GLYCINE BETAINE_PROLINE BETAINE TRANSPORT SYSTEM PERMEASE PROTEIN PROW
    supported_by:
      - reference_id: file:interpro/panther/PTHR47737/PTHR47737-paint.tsv
        supporting_text: "PTHR47737\tPTN000766131\tGO:0043190\tC\tIBD\tfalse"
  - node_id: PANTHER:PTN000766131
    asserted_term:
      id: GO:0005275
      label: amine transmembrane transporter activity
    evidence: IBD
    negated: false
    seeds:
      - id: UniProtKB:P14176
      - id: UniProtKB:Q9HTI7
    assessment: WRONG_NODE
    assessment_reason: >-
      Both seeds are quaternary-ammonium importers (E. coli ProW, P. aeruginosa
      CbcW), and an OLS4 hierarchy query
      (genes/PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md, run 2026-11-04) shows
      that none of their substrate terms sits under GO:0005275: they sit under
      GO:0015651 / GO:0015697 instead. GO defines an amine as "weakly basic in
      character" with "an amino (-NH2) or substituted amino group", which the
      permanently charged quaternary ammonium substrates are not, so the seeds
      do not support this term at any node of the family. The KT2440 CbcW review
      accordingly modifies its TreeGrafter copy of this row to GO:0015418
      ABC-type quaternary ammonium compound transporting activity and records
      the subunit's share of the complex activity with contributes_to in its
      core function. Subfamily SF1 does also contain importers of nitrogenous
      solutes that are not quaternary ammonium compounds (S. meliloti HutW for
      histidine, TmoV for trimethylamine N-oxide), so this verdict concerns the
      term's placement for the quaternary-ammonium clade.
    affected_subfamilies:
      - id: PANTHER:PTHR47737:SF1
        label: GLYCINE BETAINE_PROLINE BETAINE TRANSPORT SYSTEM PERMEASE PROTEIN PROW
    supported_by:
      - reference_id: file:interpro/panther/PTHR47737/PTHR47737-paint.tsv
        supporting_text: "PTHR47737\tPTN000766131\tGO:0005275\tF\tIBD\tfalse"
      - reference_id: file:genes/PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md
        supporting_text: "- GO:0005275 amine transmembrane transporter activity: definition: \"Enables the transfer of amines, including polyamines, from one side of a membrane to the other. Amines are organic compounds that are weakly basic in character and contain an amino (-NH2) or substituted amino group.\""
      - reference_id: file:genes/PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md
        supporting_text: "| GO:0015651 | quaternary ammonium group transmembrane transporter activity | no | no | yes |"
  - node_id: PANTHER:PTN000766131
    asserted_term:
      id: GO:0015226
      label: carnitine transmembrane transporter activity
    evidence: IBD
    negated: false
    seeds:
      - id: UniProtKB:Q9HTI7
    assessment: TOO_DEEP
    assessment_reason: >-
      The only seed is P. aeruginosa CbcW, whose carnitine uptake depends on the
      CaiX binding protein, but the node is the family root and also covers ProW,
      OpuAB, TmoV and the histidine permease HutW, whose systems have no
      carnitine-binding protein. Carnitine transport is a property of
      CaiX-containing Cbc complexes, not of the permease lineage.
      No affected subfamily is named: the family has a single subfamily (SF1)
      that contains both the Cbc permeases, which correctly keep the term, and
      the systems the node over-reaches, so the pruning lies below SF1.
    supported_by:
      - reference_id: file:interpro/panther/PTHR47737/PTHR47737-paint.tsv
        supporting_text: "PTHR47737\tPTN000766131\tGO:0015226\tF\tIBD\tfalse"
      - reference_id: PMID:19919675
        supporting_text: 'CaiX, a carnitine-specific binding protein, is required for Cbc-mediated uptake of L-carnitine'
  - node_id: PANTHER:PTN000766131
    asserted_term:
      id: GO:1902603
      label: carnitine transmembrane transport
    evidence: IBD
    negated: false
    seeds:
      - id: UniProtKB:Q9HTI7
    assessment: TOO_DEEP
    assessment_reason: >-
      Same single CbcW seed as the carnitine transporter activity; correct for
      Cbc permeases paired with CaiX (the KT2440 CbcW review accepts its
      TreeGrafter copy), not for ProW, OpuAB, TmoV or HutW.
      No affected subfamily is named: the family has a single subfamily (SF1)
      that contains both the Cbc permeases, which correctly keep the term, and
      the systems the node over-reaches, so the pruning lies below SF1.
    supported_by:
      - reference_id: file:interpro/panther/PTHR47737/PTHR47737-paint.tsv
        supporting_text: "PTHR47737\tPTN000766131\tGO:1902603\tP\tIBD\tfalse"
  - node_id: PANTHER:PTN000766131
    asserted_term:
      id: GO:0015871
      label: choline transport
    evidence: IBD
    negated: false
    seeds:
      - id: UniProtKB:Q9HTI7
    assessment: TOO_DEEP
    assessment_reason: >-
      Single CbcW seed; choline uptake depends on a choline-binding protein
      (CbcX in Pseudomonas) and is not shown for ProW, OpuAB, TmoV or HutW
      systems. Correct for the Cbc permeases.
      No affected subfamily is named: the family has a single subfamily (SF1)
      that contains both the Cbc permeases, which correctly keep the term, and
      the systems the node over-reaches, so the pruning lies below SF1.
    supported_by:
      - reference_id: file:interpro/panther/PTHR47737/PTHR47737-paint.tsv
        supporting_text: "PTHR47737\tPTN000766131\tGO:0015871\tP\tIBD\tfalse"
  - node_id: PANTHER:PTN000766131
    asserted_term:
      id: GO:0031460
      label: glycine betaine transport
    evidence: IBD
    negated: false
    seeds:
      - id: UniProtKB:P14176
      - id: UniProtKB:Q9HTI7
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Glycine betaine import is the shared function of the ProW, OpuAB, GbuB,
      OusW and CbcW systems, so the root placement is broadly right, but the
      family also contains the S. meliloti histidine permease HutW and the TMAO
      permeases TmoV, which should be excluded below the node.
      No affected subfamily is named: the family has a single subfamily (SF1)
      that contains both the Cbc permeases, which correctly keep the term, and
      the systems the node over-reaches, so the pruning lies below SF1.
    supported_by:
      - reference_id: file:interpro/panther/PTHR47737/PTHR47737-paint.tsv
        supporting_text: "PTHR47737\tPTN000766131\tGO:0031460\tP\tIBD\tfalse"
      - reference_id: file:interpro/panther/PTHR47737/PTHR47737-entries.csv
        supporting_text: Q9KKE2,High-affinity histidine transport system permease protein HutW,protein
