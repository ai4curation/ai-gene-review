    assessment: TOO_DEEP
    assessment_reason: >-
      Single CbcW seed; choline uptake depends on a choline-binding protein
      (CbcX in Pseudomonas) and is not shown for ProW, OpuAB, TmoV or HutW
      systems. Correct for the Cbc permeases.
      No affected subfamily is named: the family has a single subfamily (SF1)
      that contains both the Cbc permeases, which correctly keep the term, and
      the systems the node over-reaches, so the pruning lies below SF1.
    supported_by:
      - reference_id: file:interpro/panther/PTHR47737/PTHR47737-paint.tsv
        supporting_text: "PTHR47737\tPTN000766131\tGO:0015871\tP\tIBD\tfalse"
  - node_id: PANTHER:PTN000766131
    asserted_term:
      id: GO:0031460
      label: glycine betaine transport
    evidence: IBD
    negated: false
    seeds:
      - id: UniProtKB:P14176
      - id: UniProtKB:Q9HTI7
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Glycine betaine import is the shared function of the ProW, OpuAB, GbuB,
      OusW and CbcW systems, so the root placement is broadly right, but the
      family also contains the S. meliloti histidine permease HutW and the TMAO
      permeases TmoV, which should be excluded below the node.
      No affected subfamily is named: the family has a single subfamily (SF1)
      that contains both the Cbc permeases, which correctly keep the term, and
      the systems the node over-reaches, so the pruning lies below SF1.
    supported_by:
      - reference_id: file:interpro/panther/PTHR47737/PTHR47737-paint.tsv
