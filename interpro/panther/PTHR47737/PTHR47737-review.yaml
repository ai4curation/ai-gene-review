  - node_id: PANTHER:PTN000766131
    asserted_term:
      id: GO:0005275
      label: amine transmembrane transporter activity
    evidence: IBD
    negated: false
    seeds:
      - id: UniProtKB:P14176
      - id: UniProtKB:Q9HTI7
    assessment: WRONG_NODE
    assessment_reason: >-
      Both seeds are quaternary-ammonium importers (E. coli ProW, P. aeruginosa
      CbcW), and an OLS4 hierarchy query
      (genes/PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md, run 2026-11-04) shows
      that none of their substrate terms sits under GO:0005275: they sit under
      GO:0015651 / GO:0015697 instead. GO defines an amine as "weakly basic in
      character" with "an amino (-NH2) or substituted amino group", which the
      permanently charged quaternary ammonium substrates are not, so the seeds
      do not support this term at any node of the family. The KT2440 CbcW review
      accordingly modifies its TreeGrafter copy of this row to GO:0015418
      ABC-type quaternary ammonium compound transporting activity and records
      the subunit's share of the complex activity with contributes_to in its
      core function. Subfamily SF1 does also contain importers of nitrogenous
      solutes that are not quaternary ammonium compounds (S. meliloti HutW for
      histidine, TmoV for trimethylamine N-oxide), so this verdict concerns the
      term's placement for the quaternary-ammonium clade.
    affected_subfamilies:
      - id: PANTHER:PTHR47737:SF1
        label: GLYCINE BETAINE_PROLINE BETAINE TRANSPORT SYSTEM PERMEASE PROTEIN PROW
    supported_by:
      - reference_id: file:interpro/panther/PTHR47737/PTHR47737-paint.tsv
        supporting_text: "PTHR47737\tPTN000766131\tGO:0005275\tF\tIBD\tfalse"
      - reference_id: file:genes/PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md
        supporting_text: "- GO:0005275 amine transmembrane transporter activity: definition: \"Enables
          the transfer of amines, including polyamines, from one side of a membrane to the other. Amines
          are organic compounds that are weakly basic in character and contain an amino (-NH2) or substituted
          amino group.\""
      - reference_id: file:genes/PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md
        supporting_text: "| GO:0015651 | quaternary ammonium group transmembrane transporter activity
          | no | no | yes |"
