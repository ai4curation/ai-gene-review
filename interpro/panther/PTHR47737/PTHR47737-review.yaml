family_id: PANTHER:PTHR47737
family_name: GLYCINE BETAINE/PROLINE BETAINE TRANSPORT SYSTEM PERMEASE PROTEIN PROW
preferred_name: Osmolyte-uptake ABC transporter permease subunits (ProW, OpuAB, GbuB, CbcW, TmoV)
summary: >-
  Integral membrane permease subunits of binding-protein-dependent ABC importers of quaternary ammonium
  compounds and related solutes: E. coli and Salmonella ProW, Bacillus OpuAB (and the fused permease-binding
  protein OpuAC), Listeria GbuB/GbuC, Dickeya OusW, Roseobacter/Pelagibacter TmoV (TMAO), S. meliloti
  HutW (histidine) and the Pseudomonas CbcW permease of the choline/betaine/carnitine importer. They form
  the translocation pathway with the partner ATPase; compatible binding proteins select the tested cargo;
  intrinsic permease selectivity is not resolved.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are permeases of ABC importers and share complex membership and a transmembrane-transport
  role, but the tested substrate depends on compatible recognition and transport partners and differs
  between systems (glycine betaine, choline, carnitine, TMAO, histidine). Substrate-specific transport
  terms do not transfer family-wide.
