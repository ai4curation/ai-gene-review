family_id: PANTHER:PTHR42738
family_name: HYDROXYMETHYLGLUTARYL-COA LYASE
preferred_name: HMG-CoA lyase family (DRE-TIM metallolyases)
summary: >-
  Divalent-cation-dependent (beta/alpha)8 TIM-barrel lyases that cleave 3-hydroxy-3-methylglutaryl-CoA
  (HMG-CoA) to acetoacetate and acetyl-CoA. Reviewed members are the mitochondrial human HMGCL, which
  catalyses the shared terminal step of ketogenesis and leucine catabolism, and the bacterial HMG-CoA
  lyases of Pseudomonas aeruginosa (LiuE) and Pseudomonas putida (MvaB), which end leucine catabolism.
  LiuE also cleaves the acyclic-terpene intermediate 3-hydroxy-3-isohexenylglutaryl-CoA. The family also
  contains the vertebrate ER/cytosolic paralog HMGCLL1 and, in SF7, the (R)-citramalyl-CoA lyase of
  Chloroflexus aurantiacus.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  HMG-CoA cleavage is measured on members of both major lineages (human HMGCL in SF1, P. aeruginosa
  LiuE in SF7) and on the paralog HMGCLL1 (SF5), so the lyase reaction is broadly ancestral. The pathway
  context is not: mitochondrial HMGCL serves ketogenesis and leucine catabolism, bacterial LiuE serves
  leucine and terpene catabolism, HMGCLL1 is proposed to make ketone bodies in the cytosol, and the SF7
  member Ccl of Chloroflexus is an (R)-citramalyl-CoA lyase. Subfamily SF7 groups bacterial, fungal
  and plant members and does not by itself predict the substrate.
