family_id: PANTHER:PTHR43693
family_name: PROTEIN PHOSPHATASE CHEZ
preferred_name: CheY-P phosphatase family (CheZ and CheC)
summary: >-
  Proteins of this PANTHER family terminate chemotaxis signalling by accelerating the
  dephosphorylation of phospho-CheY. Beta- and gammaproteobacteria use CheZ, a
  homodimeric four-helix-bundle phosphatase that inserts a conserved glutamine into the
  CheY active site and is localized to receptor arrays through the short CheA(S) isoform
  in E. coli. PANTHER places CheC of Bacillus subtilis, Thermotoga maritima and
  Halobacterium in the same subfamily. CheC is a structurally distinct CheY-P phosphatase
  of the CheC/CheX/FliY type that works with CheD in Bacillus-type chemotaxis, so the
  family unites two convergent solutions to the same signal-reset problem rather than one
  fold.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member, CheZ or CheC, is a CheY-P phosphatase acting in a
  chemotaxis pathway. The members differ in fold and partners (CheZ docks on CheA(S);
  CheC acts with CheD) but not in molecular function.
