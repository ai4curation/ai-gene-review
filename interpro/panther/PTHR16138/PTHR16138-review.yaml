residue_sites:
- site_id: catalytic_nucleophile
  label: Alpha/beta-hydrolase nucleophilic elbow serine (Ser152)
  description: >-
    Nucleophilic serine positioned at the GxSxG nucleophilic elbow (GSSLG in
    mammalian ABHD10, GSSMG in zebrafish abhd10a/abhd10b; Ser152 in full-length
    human Q9NUJ1 and Ser100 in transit-peptide-cleaved mature mouse Q6PE15).
    Substitution S152A in human ABHD10 abolishes mitochondrial S-deacylase
    activity in live cells and S-depalmitoylase activity on DPP-5 in vitro
    (PMID:31740833). Recorded at strength CONTRIBUTES because all full-length
    PTHR16138 members retain this serine and no natural pseudoenzyme negative
    control exists in the family.
