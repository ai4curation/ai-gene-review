family_id: PANTHER:PTHR16138
family_name: MYCOPHENOLIC ACID ACYL-GLUCURONIDE ESTERASE, MITOCHONDRIAL
preferred_name: Mitochondrial palmitoyl-protein thioesterase ABHD10 family
summary: >-
  Eukaryotic family of resident mitochondrial matrix serine hydrolases and
  protein S-depalmitoylases (EC 3.1.2.22) built on the canonical
  alpha/beta-hydrolase fold with a hydrophobic alpha-helical cap domain and a
  strictly conserved Ser-Asp-His charge-relay catalytic triad (Ser152, Asp249,
  and His279 in human ABHD10; Ser100, Asp197, and His227 in mature cleaved
  mouse Abhd10). All members belong to a single orthologous PANTHER subfamily
  (PANTHER:PTHR16138:SF7, PALMITOYL-PROTEIN THIOESTERASE ABHD10, MITOCHONDRIAL),
  present as a single-copy gene in tetrapods and as retained teleost
  whole-genome duplication co-orthologs (abhd10a and abhd10b) in ray-finned
  fishes. Synthesized with a cleavable N-terminal mitochondrial matrix-targeting
  presequence, mature ABHD10 hydrolyzes S-palmitoyl thioester linkages on
  mitochondrial protein cysteines—most notably Cys100 of peroxiredoxin-5
  (PRDX5) to sustain mitochondrial hydrogen peroxide buffering, as well as
  male germ-cell mitochondrial sheath proteins (SPATA19, GK2, PDHX) required
  for mammalian spermatogenesis. PANTHER's official family name reflects the
  earlier discovery that human hepatic ABHD10 also cleaves the 1-O-acyl
  carboxylic-ester linkage of xenobiotic drug acyl-glucuronides such as
  mycophenolic acid acyl-glucuronide (AcMPAG; EC 3.1.1.93) and probenecid
  acyl-glucuronide (PRAG); ABHD10 does not cleave O-glycosyl bonds and is
  inactive on phenolic O-glucuronides such as MPAG.
functional_coherence: COHERENT
coherence_reason: >-
  All characterized and model-organism members of PTHR16138 fall within a
  single orthologous subfamily (PTHR16138:SF7) sharing an N-terminal
  mitochondrial targeting sequence, a cap-covered alpha/beta-hydrolase domain,
  and an invariant Ser-Asp-His catalytic triad. Direct biochemical and
  structural studies confirm S-depalmitoylase activity (GO:0008474) for both
  human ABHD10 and mouse Abhd10 (PMID:31740833). Carboxylic-ester hydrolysis of
  xenobiotic drug acyl-glucuronides (GO:0102390) is an auxiliary esterase
  activity of the same active site demonstrated in human liver (PMID:22294686,
  PMID:25217485), whereas O-glycosyl hydrolase activity (GO:0004553) is an
  upstream curation error rather than true functional divergence.
