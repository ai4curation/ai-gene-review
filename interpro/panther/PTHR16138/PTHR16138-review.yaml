term_assessments:
- assessed_term:
    id: GO:0008474
    label: palmitoyl-(protein) hydrolase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Core physiological enzymatic function of PTHR16138:SF7, experimentally
    demonstrated in human ABHD10 and mouse Abhd10 (PMID:31740833) and supported
    across vertebrate orthologs by strict conservation of the Ser-Asp-His
    catalytic triad and hydrophobic lipid-binding cap domain.
  supported_by:
  - reference_id: PMID:31740833
    supporting_text: >-
      Taken together, these in vitro and in cellulo assays indicate that ABHD10
      possesses mitochondrial S-depalmitoylase activity.
- assessed_term:
    id: GO:0005739
    label: mitochondrion
  scope: FAMILY_WIDE
  scope_reason: >-
    Resident mitochondrial localization is experimentally established in human
    and rodent orthologs (PMID:18614015, PMID:31740833, PMID:34800366) and
    conserved across PTHR16138:SF7.
  supported_by:
  - reference_id: PMID:31740833
    supporting_text: >-
      We also performed ABPP in both enriched mitochondrial and cytosolic
      fractions prepared from mitoFP-treated HepG2 cells, which further
      confirmed that ABHD10 is a target of mitoFP and that ABHD10 is highly
      enriched in mitochondria (Supplementary Fig. 17).
- assessed_term:
    id: GO:0005759
    label: mitochondrial matrix
  scope: FAMILY_WIDE
  scope_reason: >-
    Mature ABHD10 is a soluble matrix hydrolase lacking transmembrane segments,
    imported via a cleavable N-terminal matrix-targeting presequence (residues
    1-52 in human Q9NUJ1, 1-43 in mouse Q6PE15 and rat Q5I0K5) and verified in
    mitochondrial matrix assays (PMID:31740833). Teleost TrEMBL entries stay at
    root GO:0005739 in gene-level curation only until presequence cleavage or
    sub-organellar residence is directly mapped in fish.
  supported_by:
  - reference_id: PMID:31740833
    supporting_text: >-
      Overexpression of wild-type human ABHD10 results in increased mitoDPP-2
      signal, signifying higher S-deacylase activity, as compared with both
      overexpression of the catalytically inactive ABHD10 (S152A) mutant
      (Fig. 4a,b
- assessed_term:
    id: GO:0102390
    label: mycophenolic acid acyl-glucuronide esterase activity
  scope: UNRESOLVED
  scope_reason: >-
    Carboxylic-ester hydrolysis of the xenobiotic drug metabolite AcMPAG (EC
    3.1.1.93) is biochemically demonstrated for human hepatic ABHD10
    (PMID:22294686) and plausibly retained as a non-core xenobiotic esterase
    activity in mammalian orthologs, whereas automatic EC2GO projection onto
    non-mammalian teleost ohnologs (abhd10a, abhd10b) is untested and likely
    over-annotated. Because PTHR16138 contains a single metazoan-wide subfamily
    (PTHR16138:SF7) and TermScopeEnum has no mammal-restricted scope, scope is
    recorded as UNRESOLVED to prevent family-wide propagation outside mammals.
  supported_by:
  - reference_id: PMID:22294686
    supporting_text: >-
      Recombinant ABHD10 expressed in Sf9 cells efficiently deglucuronidated
      AcMPAG with a K(m) value of 100.7 ± 10.2 μM, which was similar to those
      in HLM, HLC, and human liver homogenates (HLH).
- assessed_term:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  scope: NOT_APPLICABLE
  scope_reason: >-
    Chemically erroneous annotation seeded from PMID:22294686 by misreading
    carboxylic-ester hydrolysis ("deglucuronidation") of acyl-glucuronide
    AcMPAG as O-glycosyl bond cleavage; human ABHD10 has zero activity toward
    the phenolic O-glucuronide MPAG, and no PTHR16138 member is a glycosidase.
  supported_by:
  - reference_id: PMID:22294686
    supporting_text: >-
      In fact, we found that the recombinant human ABHD10 could catalyze the
      deglucuronidation of AcMPAG, but could not catalyze the deglucuronidation
      of MPAG, a phenolic glucuronide of MPA (data not shown).
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: NOT_APPLICABLE
  scope_reason: >-
    Appearance of mature 28-kDa ABHD10 in post-microsomal "human liver cytosol"
    (HLC) homogenates (PMID:22294686) reflects mitochondrial matrix leakage
    during frozen-tissue homogenization; organelle-resolved ABPP, live-cell
    imaging, and mitochondrial proteomics establish ABHD10 as exclusively
    mitochondrial with negligible cytosolic pool or activity (PMID:31740833).
  supported_by:
  - reference_id: PMID:31740833
    supporting_text: >-
      Additionally, no significant changes in signal from PY1, an indicator of
      cytosolic H2O2 levels38, on H2O2 stimulation confirmed that the
      diminished mitochondrial antioxidant capacity was not due to alterations
      in cytoplasmic redox buffering machinery upon ABHD10 perturbation
      (Supplementary Fig. 22).
