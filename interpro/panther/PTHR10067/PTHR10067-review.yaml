    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    PAINT gives no taxon for this node. In the PAINT UniProt GAF its 134 recipients of
    GO:0004609 and GO:0006646 are the SF6 type I enzymes (bacterial and eukaryotic) and S.
    pombe psd2 (SF19). The node does not reach psiD (SF9), so the neofunctionalized tryptophan
    decarboxylases are correctly outside it. The seeds are bacterial and eukaryotic, consistent
    with the bacterial origin of the type I enzyme. The node also does not reach the SF17
    PSD2-type clade: yeast PSD2 (P53037) and S. pombe psd3 (O14111) receive no PSD IBA, even
    though the yeast PSD2 activity is experimentally established. That missing coverage is a
    gap in PAINT propagation, not an error in this node. The yeast PSD1 review accepts both IBAs.
  supported_by:
  - reference_id: file:genes/yeast/PSD1/PSD1-ai-review.yaml
    supporting_text: IBA from PTN000007430 (type I PSDs incl. Arabidopsis, fly, S. pombe, rat and Psd1). Core
      activity.
