- assessed_term:
    id: GO:0005794
    label: Golgi apparatus
  scope: UNRESOLVED
  scope_reason: >-
    The module asserts the Golgi apparatus for the PSD2-type variant at SF17. The yeast PSD2
    review makes endosome membrane (GO:0010008) the core location and treats Golgi as a
    secondary location based on fractionation. The PomBase GO-CAM puts S. pombe psd3 in the
    endosome. SF17 also contains bacterial (Clostridium, Chlamydia) members that have no Golgi.
    No single endomembrane term is safe across SF17. The eukaryotic C2-domain PSD2 location is
    better given as endosome membrane.
  supported_by:
  - reference_id: file:genes/yeast/PSD2/PSD2-ai-review.yaml
    supporting_text: 'reason: Supported by early fractionation; endosome membrane is the better-established site.'
  - reference_id: PMID:7890739
    supporting_text: Unlike the PSD1 activity, the PSD2 enzyme activity does not localize to the mitochondria
