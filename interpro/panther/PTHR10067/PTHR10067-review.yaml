family_id: PANTHER:PTHR10067
family_name: PHOSPHATIDYLSERINE DECARBOXYLASE
preferred_name: Pyruvoyl-dependent phosphatidylserine decarboxylase family
summary: >-
  Phosphatidylserine decarboxylases (PSDs) are pyruvoyl-dependent enzymes that decarboxylate
  phosphatidylserine (PS) to phosphatidylethanolamine (PE). They are made as proenzymes that
  cleave themselves at a conserved GGST/LGST motif, and the serine at the cleavage site becomes
  the pyruvoyl prosthetic group. The family covers bacterial Psd (E. coli, B. subtilis,
  P. putida), the eukaryotic mitochondrial inner-membrane type I enzymes (yeast PSD1, S. pombe
  psd1, human PISD), and the PSD2-type enzymes. The PSD2 type includes long C2-domain proteins
  in fungi and plants (yeast PSD2, S. pombe psd3, plant PSD2/PSD3) and short Clostridium and
  Chlamydia Psd. S. pombe psd2 sits alone in SF19. The family also contains the
  Psilocybe/Amanita psiD/iboD enzymes (SF9). These have been recruited to decarboxylate
  L-tryptophan for psilocybin biosynthesis.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Phosphatidylserine decarboxylase activity is shared by the characterized bacterial,
  mitochondrial and PSD2-type members across SF6, SF17 and SF19. The exception is SF9:
  Psilocybe psiD is an L-tryptophan decarboxylase in psilocybin biosynthesis, a
  neofunctionalized branch. Compartment is not a subfamily property. SF6, labelled
  "PROENZYME, MITOCHONDRIAL", contains the bacterial plasma-membrane Psd of E. coli, B.
  subtilis and P. putida as well as the eukaryotic mitochondrial enzymes. SF17 ("PROENZYME 2")
  mixes the endomembrane yeast PSD2 and S. pombe psd3 with short Clostridium and Chlamydia
  Psd.
