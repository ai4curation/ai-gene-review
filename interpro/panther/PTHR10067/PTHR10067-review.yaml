- subfamily_id: PANTHER:PTHR10067:SF19
  label: PHOSPHATIDYLSERINE DECARBOXYLASE PROENZYME 2, MITOCHONDRIAL
  description: >-
    S. pombe psd2, a fission-yeast PSD whose name does not match S. cerevisiae PSD2. It is a
    PAINT seed for PS decarboxylase activity. Tagged SpPsd2 localizes to the ER and nuclear
    envelope, mitochondria and lipid droplets.
  representative_members:
  - id: UniProtKB:Q9UTB5
    label: psd2
    gene_symbol: psd2
    organism: Schizosaccharomyces pombe
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:34818062
    supporting_text: Finally, Sp has an additional PSD enzyme, SpPsd2, which despite its name is distinct from
      S. cerevisiae Psd2.
- subfamily_id: PANTHER:PTHR10067:SF9
  label: PHOSPHATIDYLSERINE DECARBOXYLASE FAMILY PROTEIN (AFU_ORTHOLOGUE AFUA_7G01730)
  description: >-
    Basidiomycete psiD/iboD decarboxylases. Psilocybe cubensis psiD (P0DPA6) is the
    L-tryptophan decarboxylase that starts psilocybin biosynthesis.
  representative_members:
  - id: UniProtKB:P0DPA6
    label: psiD
    gene_symbol: psiD
    organism: Psilocybe cubensis
  - id: UniProtKB:A0A0C2SRU0
    label: iboD
    gene_symbol: iboD
    organism: Amanita muscaria
  diverged_from_family: true
  divergence_description: >-
    The substrate has changed from phosphatidylserine to free L-tryptophan, so psiD is a
    natural-product amino-acid decarboxylase, not a phospholipid enzyme. PS decarboxylase and
    PE biosynthesis terms do not apply. PAINT does not propagate GO:0004609 to psiD: it is
    absent from the PTN000007430 recipients in the PAINT GAF.
  supported_by:
  - reference_id: PMID:28763571
    supporting_text: PsiD, which represents a new class of fungal l-tryptophan decarboxylases
