    mitochondrial), SF17 (PSD2-type) and SF19 (S. pombe psd2). Not safe family-wide, because
    SF9 psiD/iboD are tryptophan decarboxylases. Subfamilies without Swiss-Prot evidence (SF7,
    SF11, SF13, SF16, SF18, SF20, SF21) were not examined, although several carry PSD names.
