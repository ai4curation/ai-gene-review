  assessment: SOUND
  assessment_reason: >-
    The node is the eukaryotic type I clade within SF6, plus S. pombe psd2 (SF19). Its
    recipients are the eukaryotic PSD1/PISD orthologs and SpPsd2, not the bacterial SF6
    members. S. pombe psd2 is at least partly mitochondrial, as well as being in the ER,
    nuclear envelope and lipid droplets, so the term is correct but incomplete for it. The
    PomBase GO-CAM's ER placement of psd2 and UniProt's mitochondrial-proenzyme annotation do
    not contradict each other: both compartments are observed. The yeast PSD1 review accepts
    the IBA.
