notes: >-
  IBA recipients were listed from the PAINT UniProt GAF (PANTHER 19). For S. pombe psd2,
  UniProt subcellular-location evidence (PMID:16823372, PMID:34818062) was checked through the
  UniProt REST API. Inconsistencies for the module curators: (1) cdp_dag_phospholipid_synthesis
  calls PTHR10067:SF6 the "mitochondrial PS decarboxylase subfamily", but SF6 also contains
  the bacterial Psd that bacterial_phosphatidylethanolamine_biosynthesis uses (E. coli P0A8K1,
  P. putida Q88DB9). (2) The module calls SF17 the "PSD2-type C2-domain" subfamily, but SF17
  also contains short bacterial Psd without a C2 domain. (3) The module puts the PSD2 annoton
  in the Golgi apparatus, whereas the yeast PSD2 review uses endosome membrane as the core
  location. (4) The module leaves S. pombe psd2 out as an exemplar because its compartment is
  unresolved. PMID:34818062 shows it is multi-compartment (ER/nuclear envelope, mitochondria,
  lipid droplets), so the ER-membrane GO-CAM placement and the UniProt mitochondrial
  annotation are both supported. Curation gap, not a knowledge gap: no PAINT node propagates
  PS decarboxylase activity to the SF17 PSD2-type clade.
