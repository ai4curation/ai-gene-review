- assessed_term:
    id: GO:0005743
    label: mitochondrial inner membrane
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The module asserts this location for the PSD1-type variant at SF6. It holds only for the
    eukaryotic members of SF6, which are the descendants of PTN000007431. The bacterial SF6
    members are plasma-membrane enzymes. A module annoton that selects mitochondrial PSD1 by
    SF6 alone also selects bacterial Psd. Restrict it to eukaryotes or to PTN000007431.
  applicable_subfamilies:
