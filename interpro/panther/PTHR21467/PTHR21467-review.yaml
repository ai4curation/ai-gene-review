family_id: PANTHER:PTHR21467
family_name: PROTEIN PHOSPHATASE 4 REGULATORY SUBUNIT 4 PPP4R4
preferred_name: PPP4R4 phosphatase regulatory subunits
summary: PPP4R4 proteins are noncatalytic partners of protein phosphatase 4. Human PP4R4 forms a stable
  cytosolic complex with PP4c that is distinct from other PP4 assemblies and modulates the catalytic subunit’s
  activity. The regulatory component itself is not a phosphoprotein phosphatase, and its physiological
  substrate-targeting roles remain incompletely defined.
functional_coherence: COHERENT
coherence_reason: Affinity purification and interaction mutagenesis establish PP4R4 as a stable, specific
  PP4c partner in a cytosolic complex (PMID:18715871). It does not bridge PP4c to the previously characterized
  regulatory subunits. The complex has lower phosphatase activity than free PP4c in the reported assays;
  this is regulatory-complex evidence, not intrinsic phosphatase catalysis by PP4R4. A shared PP4 regulatory
  role is supported, while physiological substrate selection remains unresolved.
