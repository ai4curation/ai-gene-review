    representative_members:
      - {id: UniProtKB:Q8IZL2, gene_symbol: MAML2, organism: Homo sapiens}
      - {id: UniProtKB:A0A8M1RIA2, gene_symbol: maml2, organism: Danio rerio}
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR15692:SF8
    label: MASTERMIND-LIKE PROTEIN 3
    representative_members:
      - {id: UniProtKB:Q96JK9, gene_symbol: MAML3, organism: Homo sapiens}
      - {id: UniProtKB:A0A8M2B6W6, gene_symbol: maml3, organism: Danio rerio}
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR15692:SF20
    label: NEUROGENIC MASTERMIND-LIKE N-TERMINAL DOMAIN-CONTAINING PROTEIN
    description: >-
      Invertebrate and cnidarian Mastermind orthologues with the MamL-1 domain. It
      includes hymenopteran and tephritid Mastermind (for example Ceratitis capitata
      W8C7T1) and the Nematostella protein A7SLJ1. Drosophila melanogaster mam is NOT
      here: PANTHER assigns it to PTHR16431:SF1. Ceratitis capitata has MamL-1 gene
      products in both families (W8C7T1 here; W8BZH2 and W8BBU0 in PTHR16431:SF1).
      This shows the split is a classification artefact, not a biological difference.
    representative_members:
      - {id: UniProtKB:A7SLJ1, organism: Nematostella vectensis}
      - {id: UniProtKB:W8C7T1, gene_symbol: MAM, organism: Ceratitis capitata}
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR15692:SF18
    label: PROTEIN CBG23155
    description: >-
      A C. briggsae gene model (CBG23155) that fuses a pectin-lyase-like fold
      (InterPro IPR011050/IPR012332) to a MAML-like C-terminal region. It lacks the
      MamL-1 domain. It is not the Mastermind-role protein of Caenorhabditis, which is
      SEL-8/LAG-3 and is unclassified in PANTHER.
    representative_members:
      - {id: UniProtKB:A8Y4K5, gene_symbol: CBG23155, organism: Caenorhabditis briggsae}
    diverged_from_family: true
    divergence_description: >-
      No MamL-1 domain, so no basis for NICD-CSL binding. Notch-coactivator terms must
      not be inherited here without independent evidence.
