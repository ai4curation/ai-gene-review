family_id: PANTHER:PTHR15692
family_name: MASTERMIND-LIKE
preferred_name: Mastermind / Mastermind-like (MAML) Notch transcriptional coactivators
summary: >-
  Mastermind proteins are transcriptional coactivators of the Notch pathway. The
  conserved N-terminal MamL-1 domain (Pfam PF09596) forms an extended helix. That
  helix binds the groove created when the Notch intracellular domain (NICD) ankyrin
  repeats dock onto the CSL DNA-binding protein, completing the NICD-CSL-MAML ternary
  activation complex. The long, disordered C-terminal regions recruit
  histone-acetyltransferase and Mediator-associated activities. Vertebrates have
  three paralogues, MAML1, MAML2 and MAML3. MAML1 was cloned as the human homologue
  of Drosophila mastermind and shown to bind all four NOTCH ankyrin domains and
  amplify NOTCH-induced transcription. The family also holds invertebrate and
  cnidarian MamL-1-domain proteins (SF20). However, PANTHER classifies Drosophila
  melanogaster Mastermind, and the other cyclorrhaphan fly Mastermind proteins,
  outside this family. It places them in PTHR16431, the Mis18 family. The
  C. elegans Mastermind-role protein SEL-8/LAG-3 has no MamL-1 domain and no PANTHER
  family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The MAML1-3 subfamilies (SF19, SF9, SF8) and the invertebrate/cnidarian SF20 share
  the MamL-1 NICD-CSL-binding domain and the coactivator role. SF18 ("PROTEIN
  CBG23155") is the exception. Its named member is a single Caenorhabditis briggsae
  gene model (A8Y4K5) that pairs a pectin-lyase-like fold with a MAML-like C-terminal
  region. InterPro finds no MamL-1 domain in it, so it has no demonstrated Notch
  binding. Beyond Notch, MAML1 also coactivates other transcription factors, so Notch
  specificity is the dominant but not the exclusive function. The family is also
  incomplete for the Mastermind role: dipteran Mastermind sits in PTHR16431, and
  nematode SEL-8/LAG-3 is unclassified.
