    assessment: SOUND
    assessment_reason: >-
      All three vertebrate paralogues are seeds, and coactivation through the MamL-1
      domain is the defining function. The IBA descendants (QuickGO, with/from
      PTN000403192) are vertebrate MAML1-3 orthologues only. The SF20
      invertebrate/cnidarian members and SF18 do not inherit the term despite the
      Bilateria label, so no MamL-1-less protein receives it.
  - node_id: PANTHER:PTN000403192
    asserted_term:
      id: GO:0007221
      label: positive regulation of transcription of Notch receptor target
    node_taxon: {id: NCBITaxon:33213, label: Bilateria}
    paint_snapshot: "20170228"
    seeds:
      - {id: MGI:MGI:1890504, label: Maml1, organism: Mus musculus}
    assessment: SOUND
    assessment_reason: >-
      MAML proteins do some of the work of activating Notch targets: they are the third
      component of the activating NICD-CSL-MAML complex, not only necessary for it. The
      one mouse seed is sufficient given that mechanism. The same term is correct for
      Drosophila mam and C. elegans SEL-8/LAG-3 on their own experimental evidence, but
      it cannot reach them through this node. Fly mam is in PTHR16431, and SEL-8 has no
      PANTHER family.
