notes: >-
  Domain calls come from the InterPro API. P21519 (fly mam) has PF09596 MamL-1 at
  126-183, and its PTHR16431 match (181-538) lies downstream of that domain. Q09260
  (SEL-8/LAG-3) has PF11498 LAG-3 and no PANTHER match (the PANTHER geneinfo service
  returns it as unmapped). A8Y4K5 has no MamL-1 domain. For the Notch module, the
  Mastermind role spans three classification states: PTHR15692 (vertebrate MAML1-3,
  cnidarian and many insect Mastermind), PTHR16431:SF1 (dipteran Mastermind,
  misassigned) and unclassified (nematode SEL-8/LAG-3). The module should name
  Mastermind by domain or by protein, not by this PANTHER family.
