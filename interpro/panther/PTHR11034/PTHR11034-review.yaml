family_id: PANTHER:PTHR11034
family_name: N-MYC DOWNSTREAM REGULATED
summary: NDRG-family proteins are alpha/beta-hydrolase-fold interaction proteins with diverse regulatory
  roles. Human and mouse NDRG2 structures support a nonenzymatic scaffold rather than a conventional hydrolase;
  the shared fold does not specify a conserved enzymatic substrate or signaling pathway.
functional_coherence: UNKNOWN
coherence_reason: NDRG2 structures lack catalytic signature residues and have an occluded substrate-binding
  site, while structure-guided mutagenesis supports a role in molecular interactions affecting TCF/beta-catenin
  signaling (PMID:21247902). This is a concrete fold-retaining nonenzyme example, not evidence that every
  homolog is an active hydrolase. The family also includes plant NDL/SF21 and other animal NDRG branches
  with different biological contexts. A universal molecular-interaction partner or tumor-suppressor mechanism
  is unresolved, and the exact fly MESK2 product is not assigned human NDRG2 substrates or residue losses
  without its own sequence evidence.
