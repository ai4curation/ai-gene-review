family_id: PANTHER:PTHR11056
family_name: HOMOGENTISATE 1,2-DIOXYGENASE
preferred_name: >-
  Homogentisate 1,2-dioxygenase family (HmgA/HGD/HGO)
summary: >-
  Nonheme Fe(II)-dependent ring-cleaving dioxygenases of the cupin (RmlC-like jelly-roll)
  superfamily that open the aromatic ring of homogentisate to give 4-maleylacetoacetate, the
  third step of the homogentisate central pathway of L-phenylalanine and L-tyrosine
  degradation to fumarate and acetoacetate. Members include human HGD (alkaptonuria gene),
  mouse Hgd, Arabidopsis HGO, Aspergillus HmgA and bacterial HmgA such as Pseudomonas putida
  KT2440 Q88E47, whose crystal structures trapped the substrate, superoxo, alkylperoxo and
  product intermediates. The active site iron is held by two histidines and a glutamate
  (human His335, Glu341, His371; P. putida His331, Glu337, His367), and the enzymes assemble
  as hexamers (dimers of trimers).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members, across bacteria, fungi, plants and animals, are homogentisate
  1,2-dioxygenases, and every reviewed member in the inventory falls in a single subfamily
  (SF0). The reservation is two uncharacterized short members named only "putative
  dioxygenase" (Saccharolobus solfataricus SSO1533, Q97Y16, 384 aa; Vibrio cholerae VC_1345,
  Q9KSB4, 378 aa; versus 425-450 aa for canonical HmgA/HGD) whose substrate has not been
  tested; they inherit the family IBAs.
