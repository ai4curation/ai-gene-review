notes: >-
  The PANTHER inventory lists 87 reviewed members, all in SF0; SF4 and SF5 exist in
  panther.obo with the same official name but contain no reviewed member in the inventory,
  so they are not described here. UniProt places both uncharacterized members (Q97Y16,
  Q9KSB4) in the homogentisate dioxygenase family at protein-existence level 3, and Q9KSB4
  has no Pfam HgmA_C (PF04209) match, the C-terminal domain that carries the iron ligands in
  characterized members. Whether they act on homogentisate is a biological unknown that
  would need enzyme assays; it does not by itself justify pruning the PTN000114776 IBAs.
  Neither PAINT row carries a taxon, so node_taxon is omitted.
