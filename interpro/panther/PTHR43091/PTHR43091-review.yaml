    FabH enzymes. The official label says CHLOROPLASTIC, which reflects the subfamily's naming rather
    than the members' localization: E. coli FabH and B. subtilis FabHA are cytosolic bacterial enzymes.
    The label is kept verbatim and is not read as a localization claim.
