family_id: PANTHER:PTHR43091
family_name: 3-OXOACYL-[ACYL-CARRIER-PROTEIN] SYNTHASE
preferred_name: FabH-type beta-ketoacyl-ACP synthase III (KAS III) family
summary: >-
  Bacterial FabH condensing enzymes, which initiate type II fatty-acid synthesis by condensing an acyl-CoA
  primer with malonyl-ACP to give the first beta-ketoacyl-ACP. All 120 members of the local inventory
  sit in one subfamily and are annotated as beta-ketoacyl-[ACP] synthase III, from E. coli FabH and B.
  subtilis FabHA to actinobacterial and Listeria enzymes. Primer specificity varies within the family
  and is what decides whether an organism makes straight-chain or branched-chain fatty acids, so membership
  supports the KAS III reaction but not a particular primer range. Note that the other FabH family in
  this repository, PTHR34069, holds the P. putida FabH1/FabH2 enzymes and PqsC; the two families are not
  interchangeable.
functional_coherence: COHERENT
coherence_reason: >-
  Every inventory member is a FabH-type KAS III of the single subfamily SF1, and the family's one PAINT
  node asserts exactly that activity.
