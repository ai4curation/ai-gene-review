notes: >-
  Reviewed for modules/type_ii_fatty_acid_synthesis.yaml, which grounds the KAS III chain-initiation variant
  on this family for E. coli and on PTHR34069 for P. putida. The split matters: UniProt places E. coli
  FabH (P0A6R0) in PTHR43091 and the P. putida FabH1/FabH2 enzymes in PTHR34069, so neither family alone
  covers the initiation step across bacteria. Primer specificity is not inherited with membership: E.
  coli FabH rejects branched acyl-CoA primers while B. subtilis FabH homologues accept them, which is
  the published basis of straight-chain versus branched-chain fatty-acid profiles.
