  name:
    name: Beta-ketoacyl-[ACP] synthase III
    short: Beta-ketoacyl-ACP_synthase_III
  description:
  - text: The Beta-ketoacyl-[acyl-carrier-protein] synthase III family catalyzes the
      condensation reaction of fatty acid synthesis, adding two carbons from malonyl-ACP
      to an acyl acceptor. This initial condensation reaction is crucial as it initiates
      fatty acid synthesis, potentially influencing the overall rate of fatty acid
      production. Members of this family exhibit both acetoacetyl-ACP synthase and
      acetyl transacylase activities. The substrate specificity of these enzymes is
      pivotal in determining the production of either branched-chain or straight-chain
      fatty acids. A key feature of these proteins is the ACP-binding site, particularly
      the last Arg residue, which is essential for their weak association with ACP/AcpP.
      This family belongs to the thiolase-like superfamily and shares a commonality
      in function across various species, as evidenced by the conserved nature of
      their activity and structure.
