family_id: PANTHER:PTHR10362
family_name: HISTIDINE AMMONIA-LYASE
preferred_name: MIO-dependent aromatic amino acid ammonia-lyase (PAL/histidase) family
summary: >-
  Family of aromatic amino acid ammonia-lyases that carry the
  4-methylidene-imidazol-5-one (MIO) electrophile, formed autocatalytically
  from an internal Ala-Ser-Gly tripeptide, and use it to eliminate ammonia
  from the alpha-amino acid. The canonical and most widespread activity is
  histidine ammonia-lyase (histidase, EC 4.3.1.3), which converts L-histidine
  to trans-urocanate as the committed first step of histidine catabolism in
  bacteria and animals (Pseudomonas HutH, Bacillus HutH, human HAL). Plant,
  fungal and some bacterial lineages instead carry phenylalanine and
  tyrosine ammonia-lyases (PAL, TAL), which feed phenylpropanoid metabolism,
  and the family also contains MIO-dependent phenylalanine and tyrosine
  aminomutases and ergothionases. Substrate specificity therefore follows
  clade, not family membership.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members share the MIO cofactor chemistry and an aromatic amino acid
  substrate, but substrate and reaction diverge by clade. PAINT confines
  histidine ammonia-lyase activity and histidine catabolism to a bacterial
  node (PTN000796665) and a eumetazoan node (PTN000820875), and phenylalanine
  ammonia-lyase activity to a plant node (PTN001621754); only the generic
  ammonia-lyase activity sits at the family root. Aminomutase members
  rearrange rather than eliminate the amino group, so even the root term has
  exceptions. The committed member table carries no subfamily assignments,
  so clade boundaries are recorded through PAINT nodes rather than PANTHER
  subfamily ids.
