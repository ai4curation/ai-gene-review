  - id: UniProtKB:Q9HU85
    label: Histidine ammonia-lyase
    gene_symbol: hutH
    organism: Pseudomonas aeruginosa PAO1
  assessment: SOUND
  assessment_reason: >-
    Bacterial histidases form the clade that defines the family name. The
    seed, P. aeruginosa HutH, carries mutant-based evidence for histidase in
    the inducible histidine-degrading pathway, and the Pseudomonas putida and
    Bacillus subtilis hutH genes sit in hut operons with the downstream
    urocanase and imidazolonepropionase genes. A single well-characterized
    seed is adequate for a node whose descendants share the histidase-specific
    HAMAP and NCBIfam signatures. Bacterial PAL and TAL enzymes that also
    descend from the bacterial lineage are not expected to inherit this term
    and should sit outside this node.
  supported_by:
