notes: >-
  Used by the histidine catabolism module (histidine_to_urocanate step) for
  HutH and HAL. The committed member inventory has no subfamily assignments,
  so no subfamily blocks are declared; histidase scope is carried by the
  bacterial and eumetazoan PAINT nodes. An earlier prose review
  (PTHR10362-review.md) covers the plant PAL use of this family in the
  phenylpropanoid module.
