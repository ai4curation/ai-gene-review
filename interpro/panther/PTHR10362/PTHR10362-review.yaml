term_assessments:
- assessed_term:
    id: GO:0016841
    label: ammonia-lyase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    MIO-dependent ammonia elimination is shared by the histidases and the
    phenylalanine and tyrosine ammonia-lyases that make up nearly all
    members. The MIO aminomutases convert alpha- to beta-amino acids and are
    recorded as member exceptions; ergothionases are lyases on a
    trimethylated histidine derivative and are not excepted here.
  member_exceptions:
  - member:
      id: UniProtKB:Q68G84
      label: Phenylalanine aminomutase (L-beta-phenylalanine forming)
      gene_symbol: pam
      organism: Taxus chinensis
    exception_reason: >-
      Taxus phenylalanine aminomutase forms beta-phenylalanine for taxol
      side-chain biosynthesis; its named reaction is an intramolecular
      amino-group migration, not net ammonia release.
    supported_by:
    - reference_id: file:interpro/panther/PTHR10362/PTHR10362-entries.csv
      supporting_text: "Q68G84,Phenylalanine aminomutase (L-beta-phenylalanine forming)"
  - member:
      id: UniProtKB:Q8GMG0
      label: MIO-dependent tyrosine 2,3-aminomutase
      organism: Streptomyces globisporus
    exception_reason: >-
      Tyrosine 2,3-aminomutase of enediyne biosynthesis; the named reaction
      is an intramolecular amino-group migration, not net ammonia release.
    supported_by:
    - reference_id: file:interpro/panther/PTHR10362/PTHR10362-entries.csv
      supporting_text: "Q8GMG0,\"MIO-dependent tyrosine 2,3-aminomutase\""
