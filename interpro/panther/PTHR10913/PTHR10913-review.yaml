family_id: PANTHER:PTHR10913
family_name: FOLLISTATIN-RELATED
summary: This domain-rich family contains extracellular proteins with distinct inhibitory and signaling
  roles. Kazal-containing protease inhibitors coexist in the classification with follistatin-related proteins
  and larger extracellular organizers. A shared cysteine-rich domain does not identify either the inhibited
  protease or the growth-factor ligand.
functional_coherence: HETEROGENEOUS
coherence_reason: The actual family inventory spans follistatin growth-factor antagonists and Kazal protease
  inhibitors. Human follistatin binds activin and occludes receptor-binding surfaces (PMID:16482217),
  whereas Phytophthora EPI1 inhibits the tomato P69B subtilisin-like protease (PMID:15096512). These are
  different molecular targets despite related extracellular modules. The seven-Kazal-domain fly CG32354
  product also has a membrane-spanning segment, so it cannot be assigned a freely secreted follistatin
  mechanism or a specific inhibited protease solely from its family. Neither activin antagonism nor serine-protease
  inhibition is a universal family grant.
