family_id: PANTHER:PTHR10256
family_name: SELENIDE, WATER DIKINASE
summary: >-
  Selenophosphate synthetases generate the selenium donor for selenocysteine
  biosynthesis, catalysing selenophosphate formation from hydrogen selenide and ATP
  (EC 2.7.9.3). Catalysis runs through a nucleophile at the tip of a glycine-rich
  loop, and that nucleophile is itself selenocysteine in the human catalytic paralog
  SEPHS2 -- a selenoprotein required to make selenoproteins. Bacterial SelD uses a
  cysteine at the equivalent position instead, so the family tolerates either
  chalcogen nucleophile.

  The human paralog SEPHS1 has substituted that position with threonine. Its
  selenophosphate-synthase role is contested: UniProt records that "several studies
  suggest that it does not act as a selenophosphate synthase in vivo", and its
  current recommended name is Zincore component SEPHS1, reflecting a characterised
  role stabilising zinc-finger transcription factors on DNA rather than in selenium
  metabolism.

functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family contains bona fide selenophosphate synthetases (human SEPHS2, E. coli
  SelD) alongside SEPHS1, which has lost the catalytic nucleophile and whose
  characterised function is unrelated to selenium donation. The ATP/Mg machinery is
  conserved across all of them, so fold- or nucleotide-based reasoning does not
  separate the groups -- only the nucleophile does.

reference_protein:
  id: UniProtKB:Q99611
  label: Selenide, water dikinase 2
  gene_symbol: SEPHS2
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR10256:SF1
    label: SELENIDE, WATER DIKINASE 2
    description: >-
      The catalytic human branch. SEPHS2 carries selenocysteine at the nucleophile
      position and is the enzyme that actually supplies selenophosphate.
    representative_members:
      - id: UniProtKB:Q99611
        label: SEPHS2
        organism: Homo sapiens
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR10256:SF0
    label: INACTIVE SELENIDE, WATER DIKINASE-LIKE PROTEIN-RELATED
    description: >-
      A functionally mixed subfamily, and the reason this term cannot be scoped by
      subfamily alone. It contains E. coli SelD, the canonical *active* bacterial
      selenophosphate synthetase (Cys nucleophile), together with Drosophila Sps1
      (patufet), which carries arginine at that position and is named "Inactive
      selenide, water dikinase-like protein" by UniProt. The PANTHER name is
      recorded verbatim as required and describes only part of its membership.
    representative_members:
      - id: UniProtKB:P16456
        label: SelD
        organism: Escherichia coli
      - id: UniProtKB:O18373
        label: Sps1
        organism: Drosophila melanogaster
    diverged_from_family: true
    divergence_description: >-
      Membership spans both catalytic and non-catalytic proteins, so no
      activity-bearing term is safe at the level of this subfamily. Members must be
      separated by the nucleophile residue, not by subfamily assignment.

  - subfamily_id: PANTHER:PTHR10256:SF2
    label: SELENIDE, WATER DIKINASE 1
    description: >-
      SEPHS1. Retains the ATP and Mg(2+) machinery but has threonine at the
      nucleophile position.
    representative_members:
      - id: UniProtKB:P49903
        label: SEPHS1
        organism: Homo sapiens
        gene_review: genes/human/SEPHS1/SEPHS1-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      The catalytic nucleophile is threonine rather than selenocysteine or cysteine.
      The characterised function of the protein is as a component of the zincore
      complex, stabilising zinc-finger transcription factors on DNA, which is not a
      selenium-metabolism role at all.

residue_sites:
  - site_id: catalytic_nucleophile
    label: Chalcogen nucleophile of the glycine-rich loop
    description: >-
      The attacking nucleophile, at the tip of the conserved KG-x-GCKVPQ loop.
      Selenocysteine in human SEPHS2 and cysteine in bacterial SelD -- the family
      tolerates either, which is why the expected set has two members. This is a
      clean discriminator because the flanking loop is essentially invariant:
      SEPHS2 reads KG**U**GCKVPQ and SEPHS1 reads KG**T**GCKVPQ over the same span.

      Note the trap this site exists to document. SEPHS1 retains a cysteine two
      residues downstream (C31), and UniProt annotates *that* residue as SEPHS1's
      own Active site. It is not the position homologous to SEPHS2's catalytic
      selenocysteine; the conserved Cys is present in both paralogs and does not
      distinguish them. Reasoning from "SEPHS1 still has an active-site Cys" gets
      this family backwards.
    anchor:
      id: UniProtKB:Q99611
      label: SEPHS2
      organism: Homo sapiens
    anchor_sequence_version: 3
    site_source: UNIPROT_FEATURE
    residues:
      - position: 60
        expected: [U, C]
        role: nucleophile
    required_for:
      - term:
          id: GO:0004756
          label: selenide, water dikinase activity
        strength: REQUIRED
        rationale: >-
          The reaction proceeds by nucleophilic attack from this position on the
          gamma-phosphate of ATP; a threonine hydroxyl cannot substitute for the
          selenolate or thiolate that the mechanism requires. Loss of this residue
          therefore abolishes the activity rather than reducing it.
    positive_controls:
      - id: UniProtKB:Q99611
        label: SEPHS2
        organism: Homo sapiens
        control_position: 60
        control_residue: U
      - id: UniProtKB:P16456
        label: SelD
        organism: Escherichia coli
        control_position: 17
        control_residue: C
    negative_controls:
      - id: UniProtKB:P49903
        label: SEPHS1
        organism: Homo sapiens
        control_position: 29
        control_residue: T
      - id: UniProtKB:O18373
        label: Sps1
        organism: Drosophila melanogaster
        control_position: 49
        control_residue: R

  - site_id: nucleotide_site
    label: ATP and Mg(2+) binding residues
    description: >-
      Recorded deliberately as a site that is *retained* in SEPHS1. Every ATP and
      Mg(2+) ligand is conserved across SEPHS2, SelD and SEPHS1, so any argument that
      SEPHS1 is a pseudo-enzyme because its substrate machinery decayed is
      unsupportable. The loss is specific to the nucleophile.
    anchor:
      id: UniProtKB:Q99611
      label: SEPHS2
      organism: Homo sapiens
    anchor_sequence_version: 3
    site_source: UNIPROT_FEATURE
    residues:
      - position: 63
        expected: [K]
        role: ATP binding
      - position: 120
        expected: [D]
        role: Mg(2+) binding
      - position: 138
        expected: [D]
        role: ATP binding
      - position: 316
        expected: [D]
        role: Mg(2+) binding
    required_for:
      - term:
          id: GO:0004756
          label: selenide, water dikinase activity
        strength: CONTRIBUTES
        rationale: >-
          Nucleotide binding is necessary for the reaction but is not what
          distinguishes the catalytic from the non-catalytic members here, so the
          dependency is recorded as CONTRIBUTES rather than REQUIRED.

term_assessments:
  - assessed_term:
      id: GO:0004756
      label: selenide, water dikinase activity
    scope: RESIDUE_DETERMINED
    determined_by_site: catalytic_nucleophile
    scope_reason: >-
      Applicability is decided by the nucleophile residue, not by subfamily. The
      subfamily axis cannot express it here: SF0 contains both the active E. coli
      SelD (Cys) and the arginine-substituted Drosophila Sps1, so granting the term
      to SF0 would license it for an inactive protein while denying it would strip it
      from a canonical active enzyme. Members carrying selenocysteine or cysteine at
      the site are catalytic (SEPHS2, SelD); members carrying threonine or arginine
      are not (human SEPHS1, Drosophila Sps1).

review_status: DRAFT
reviewed_by: AI-assisted residue analysis
review_date: "2026-08-29"
notes: >-
  Residue positions verified against live UniProt feature tables and by alignment
  (projects/IBA_REVIEW/msa/catalytic_residue_check.py, case "sephs"). Family and
  subfamily accessions read from each protein's UniProt PANTHER cross-reference;
  subfamily labels match panther.obo verbatim.

  This family has no cached PAINT slice, so no node_assessments are recorded rather
  than guessing node placement.

  Curating this family surfaced a factual error in the SEPHS1 gene review, which
  stated the substitution is "Arg vs Sec/Cys". There is no arginine at either
  candidate position -- SEPHS1 has T29 at the SEPHS2-homologous nucleophile and C31
  at the conserved downstream cysteine; the nearest arginine is R22, seven residues
  upstream. The arginine is real but belongs to Drosophila Sps1 (R49), recorded here
  as a negative control so the claim is machine-checked rather than asserted in prose.
  The gene review has been corrected in all four places it appeared.
