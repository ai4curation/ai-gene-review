family_id: PANTHER:PTHR11022
family_name: PEPTIDOGLYCAN RECOGNITION PROTEIN
summary: >-
  The peptidoglycan recognition proteins (PGRPs) share the bacteriophage T7 lysozyme
  amidase-2 fold, which binds bacterial peptidoglycan. The fold is catalytic in its
  ancestral form: members that retain a zinc site are N-acetylmuramoyl-L-alanine
  amidases (EC 3.5.1.28) that hydrolyse the lactyl-amide bond linking the glycan
  backbone to the stem peptide, scavenging immunostimulatory peptidoglycan fragments.
  A large part of the family has lost the zinc site and repurposed the same binding
  surface for pattern recognition: these members are receptors that bind peptidoglycan
  and signal, notably the Drosophila and mosquito PGRP-LC and PGRP-LE receptors that
  activate the IMD pathway. Catalytic and non-catalytic members therefore share a fold,
  a ligand, and a name, while differing in whether they turn the ligand over.

functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family contains both true amidases (human PGLYRP2, Drosophila PGRP-LB and
  PGRP-SC1a) and catalytically dead pattern-recognition receptors (Drosophila PGRP-LC
  and PGRP-LE, Anopheles PGRPLC). Both groups bind peptidoglycan, so binding-based
  terms are family-wide while the amidase activity is not.

reference_protein:
  id: UniProtKB:Q96PD5
  label: N-acetylmuramoyl-L-alanine amidase
  gene_symbol: PGLYRP2
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR11022:SF66
    label: N-ACETYLMURAMOYL-L-ALANINE AMIDASE
    description: >-
      The catalytic mammalian branch. PGLYRP2 is the only catalytic human PGRP and is
      the family's best-annotated zinc site, which is why it anchors zn_triad.
    representative_members:
      - {id: UniProtKB:Q96PD5, label: PGLYRP2, organism: Homo sapiens}
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11022:SF77
    label: PEPTIDOGLYCAN-RECOGNITION PROTEIN LB
    description: >-
      Catalytic Drosophila amidase that dampens IMD signalling by degrading its
      peptidoglycan elicitor.
    representative_members:
      - {id: UniProtKB:Q8INK6, label: PGRP-LB, organism: Drosophila melanogaster}
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11022:SF75
    label: PEPTIDOGLYCAN-RECOGNITION PROTEIN SB1-RELATED
    description: Catalytic Drosophila amidase of the PGRP-SC class.
    representative_members:
      - {id: UniProtKB:C0HK98, label: PGRP-SC1a, organism: Drosophila melanogaster}
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11022:SF41
    clade_node_id: PANTHER:PTN002475783
    label: PEPTIDOGLYCAN-RECOGNITION PROTEIN LC-RELATED
    description: >-
      The non-catalytic receptor branch. Members have lost zinc ligands and act as
      peptidoglycan receptors upstream of IMD signalling rather than as hydrolases.
      Note that the Anopheles gene under review and both Drosophila negative controls
      are all in this one subfamily, so the catalytic/non-catalytic split in this family
      falls cleanly along a subfamily boundary.
    representative_members:
      - {id: UniProtKB:Q9GNK5, label: PGRP-LC, organism: Drosophila melanogaster}
      - {id: UniProtKB:Q9VXN9, label: PGRP-LE, organism: Drosophila melanogaster}
      - {id: UniProtKB:A7UTA1, label: PGRPLC, organism: Anopheles gambiae,
         gene_review: genes/ANOGA/PGRPLC/PGRPLC-ai-review.yaml}
    diverged_from_family: true
    divergence_description: >-
      The zinc site is degenerate, so these members cannot hydrolyse peptidoglycan.
      They retain the binding surface and transduce recognition into IMD-pathway
      activation. Amidase activity must not be inherited here.

node_assessments:
  - node_id: PANTHER:PTN002475783
    asserted_term:
      id: GO:0008745
      label: N-acetylmuramoyl-L-alanine amidase activity
    node_taxon: {id: NCBITaxon:33213, label: Bilateria}
    paint_snapshot: "20250731"
    seeds:
      - {id: UniProtKB:Q96PD5, label: PGLYRP2, organism: Homo sapiens}
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      This family has exactly one annotated PAINT node, and it carries the catalytic and
      the receptor functions together: PTN002475783 asserts both GO:0008745 (amidase
      activity) and GO:0016019 (peptidoglycan immune receptor activity) at Bilateria.
      Every descendant therefore inherits both, which is the mechanical origin of the
      amidase IBA on non-catalytic receptors such as Anopheles PGRPLC. Placement of the
      amidase term at Bilateria is defensible -- the ancestral fold was catalytic and
      catalytic members persist in both vertebrates and insects -- so the fix is not to
      move the node but to prune the receptor branch, which has demonstrably lost the
      zinc site (see the zn_triad residue site).
    affected_subfamilies:
      - {id: PANTHER:PTHR11022:SF41, label: PEPTIDOGLYCAN-RECOGNITION PROTEIN LC-RELATED}

  - node_id: PANTHER:PTN002475783
    asserted_term:
      id: GO:0016019
      label: peptidoglycan immune receptor activity
    node_taxon: {id: NCBITaxon:33213, label: Bilateria}
    paint_snapshot: "20250731"
    seeds:
      - {id: UniProtKB:O75594, label: PGLYRP1, organism: Homo sapiens}
      - {id: UniProtKB:Q96LB9, label: PGLYRP3, organism: Homo sapiens}
      - {id: UniProtKB:Q96LB8, label: PGLYRP4, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: >-
      Peptidoglycan recognition is the conserved property of the fold and is retained in
      members that have lost catalysis, so this term descending family-wide is correct.
      Recorded alongside the amidase assessment because the two sharing one node is the
      point: the node is right for this term and over-broad for the other.

residue_sites:
  - site_id: zn_triad
    label: Zn(2+) catalytic triad
    description: >-
      The three ligands that hold the catalytic zinc of the amidase-2 fold. Catalysis
      proceeds through a zinc-activated water, so the metal site is required rather than
      merely helpful: losing a ligand abolishes the site instead of weakening it. In this
      family the loss is the clean discriminator between the amidase and receptor groups.
    anchor:
      id: UniProtKB:Q96PD5
      label: PGLYRP2
      organism: Homo sapiens
    site_source: UNIPROT_FEATURE
    residues:
      - {position: 410, expected: [H], role: metal ligand}
      - {position: 522, expected: [H], role: metal ligand}
      - {position: 530, expected: [C], role: metal ligand}
    required_for:
      - term:
          id: GO:0008745
          label: N-acetylmuramoyl-L-alanine amidase activity
        strength: REQUIRED
        rationale: >-
          The amidase-2 mechanism hydrolyses the lactyl-amide bond via a zinc-activated
          water molecule. With a ligand missing the metal cannot be held, so no
          zinc-activated nucleophile is generated and the hydrolysis cannot occur. This
          is a mechanistic dependency, not a conservation correlation, which is why the
          strength is REQUIRED.
    positive_controls:
      - {id: UniProtKB:Q96PD5, label: PGLYRP2, organism: Homo sapiens}
      - {id: UniProtKB:Q8INK6, label: PGRP-LB, organism: Drosophila melanogaster}
      - {id: UniProtKB:C0HK98, label: PGRP-SC1a, organism: Drosophila melanogaster}
    negative_controls:
      - {id: UniProtKB:Q9GNK5, label: PGRP-LC, organism: Drosophila melanogaster}
      - {id: UniProtKB:Q9VXN9, label: PGRP-LE, organism: Drosophila melanogaster}

term_assessments:
  - assessed_term:
      id: GO:0008745
      label: N-acetylmuramoyl-L-alanine amidase activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Safe only for members retaining the complete zn_triad. Propagating this term
      family-wide is the observed failure: Anopheles PGRPLC carries it by IBA despite
      lacking two of the three zinc ligands. The split follows subfamily boundaries --
      the catalytic subfamilies below retain the triad, while SF41 has lost it.
    applicable_subfamilies:
      - {id: PANTHER:PTHR11022:SF66, label: N-ACETYLMURAMOYL-L-ALANINE AMIDASE}
      - {id: PANTHER:PTHR11022:SF77, label: PEPTIDOGLYCAN-RECOGNITION PROTEIN LB}
      - {id: PANTHER:PTHR11022:SF75, label: PEPTIDOGLYCAN-RECOGNITION PROTEIN SB1-RELATED}

  - assessed_term:
      id: GO:0042834
      label: peptidoglycan binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Both the catalytic and the receptor groups bind peptidoglycan; binding is the
      conserved property of the fold and is retained where catalysis is lost.

review_status: DRAFT
reviewed_by: AI-assisted residue analysis
review_date: "2026-08-27"
notes: >-
  The zn_triad residue positions were verified first-hand by alignment against
  PGLYRP2, PGRP-LB and PGRP-SC1a as catalytic positive controls, with PGRP-LC and
  PGRP-LE as non-catalytic negative controls
  (projects/IBA_REVIEW/msa/catalytic_residue_check.py, case "pgrp"). Anopheles PGRPLC
  carries A310 and S429 where the anchor has H410 and C530.

  Family and subfamily accessions were read from each protein's UniProt PANTHER
  cross-reference rather than inferred, and family_name matches panther.obo verbatim.
