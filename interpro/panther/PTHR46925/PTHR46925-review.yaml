- subfamily_id: PANTHER:PTHR46925:SF2
  label: G-PROTEIN COUPLED RECEPTOR TKR-1-RELATED
  description: >-
    The invertebrate "TKR-1-related" group: tachykinin-related-peptide receptors of
    protostomes and invertebrate deuterostomes. In PANTHER's reference-proteome tree
    for this family the group holds the tunicate Ciona, the cephalochordate amphioxus,
    the nematodes C. elegans TKR-1 and C. briggsae, Pristionchus and two Anopheles
    receptors. C. elegans TKR-1 is a functionally confirmed tachykinin receptor
    ortholog: the NLP-58 preprotein yields peptides that are potent agonists of TKR-1,
    and TKR-1 is the worm homolog of mammalian NK3R. Their ligands carry the
    invertebrate Phe-Xaa-Gly-Xaa-Arg-amide motif rather than the vertebrate
    Phe-Xaa-Gly-Leu-Met-amide, so the vertebrate subtype-specific terms do not apply.
    Note a classification disagreement that bears on two PAINT rows below: InterPro's
    HMM scan (the family's entries.csv) also assigns the Drosophila tachykinin
    receptors TkR86C and TkR99D to this subfamily, but PANTHER's own tree places those
    fly genes in PTHR24238, so they are not listed here as representatives.
  representative_members:
  - id: UniProtKB:Q03566
    label: Probable G protein-coupled receptor tkr-1
    gene_symbol: tkr-1
    organism: Caenorhabditis elegans
  - id: UniProtKB:F6VRB9
    label: Tachykinin-related-peptide receptor
    organism: Ciona intestinalis
  - id: UniProtKB:C3YFS0
    label: Tachykinin-related-peptide receptor
    organism: Branchiostoma floridae
  diverged_from_family: true
  divergence_description: >-
    The SF2 receptors respond to invertebrate tachykinin-related peptides, which carry
    a Phe-Xaa-Gly-Xaa-Arg-amide C-terminus rather than the vertebrate
    Phe-Xaa-Gly-Leu-Met-amide, and are not divided into the NK1/NK2/NK3 subtypes. They
    are tachykinin receptors at the genus level (GO:0004995) but carry none of the
    vertebrate subtype-specific receptor-activity terms.
  supported_by:
  - reference_id: PMID:33945998
    supporting_text: a peptide derived from the NLP-58 preprotein stimulates TKR-1
  - reference_id: PMID:43013511
    supporting_text: the tachykinin receptor TKR-1, the homolog of mammalian tachykinin
      3 receptor (NK3R)
  - reference_id: PMID:10801863
    supporting_text: conserved C-terminal FXGXR-amide motifs common to other insect
      tachykinin-related peptides
