    organism: Homo sapiens
  - id: UniProtKB:P29371
    gene_symbol: TACR3
    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    This node is the ancestor of the three vertebrate receptor subfamilies (SF1, SF3,
    SF4) and the term is seeded by all three human receptors from one study that
    detected NK1, NK2 and NK3 receptor protein on human spermatozoa and localized each
    to a different sperm region. The placement is weak but defensible, and the human
    TACR3 review keeps the corresponding row as non-core on that same study's own
    IDA/IMP, so this review does not overrule it with a node change. The real caveat is
    a species divergence rather than a placement error: the one study of mouse sperm
    found only the NK2 receptor transcript and not NK1R or NK3R, so the mouse NK1R and
    NK3R orthologs do not inherit the sperm location. That is handled as member
    exceptions on the corresponding term assessment rather than by pruning the node,
    because the human evidence that justifies the node is intact. Companion row to the
    GO:1902093 node below.
  supported_by:
  - reference_id: PMID:17437961
    supporting_text: Immunocytochemistry studies showed expression of the NK(1), NK(2)
      and NK(3) tachykinin receptor proteins in spermatozoa with different major sites
      of localization for each receptor.
  - reference_id: PMID:12773411
    supporting_text: A low-abundance transcript corresponding to the NK2 receptor was
      the only target gene detected in mice sperm.
