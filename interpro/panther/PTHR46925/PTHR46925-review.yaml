  label: NEUROMEDIN-K RECEPTOR
  description: >-
    The neuromedin-K (neurokinin-3) receptor, NK3R / TACR3, across vertebrates. Its
    preferred ligand is neurokinin B; UniProt gives its rank order of affinity as
    neuromedin-K > substance K and substance P, and binding triggers Gq and
    phospholipase C signaling. In the hypothalamus NK3R on arcuate kisspeptin (KNDy)
    neurons relays the NKB signal that drives pulsatile gonadotropin release, and
    biallelic loss of function causes congenital hypogonadotropic hypogonadism. The
    subfamily's own exact tree node PTN002930712 carries no PAINT IBD, so the
    NK3R-specific molecular-function term GO:0016498 is not propagated here even though
    the sibling NK1R and NK2R terms are; this gap is assessed below.
