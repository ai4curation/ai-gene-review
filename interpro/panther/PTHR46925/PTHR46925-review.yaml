- node_id: PANTHER:PTN002538240
  asserted_term:
    id: GO:0097225
    label: sperm midpiece
  evidence: IBD
  negated: false
  paint_snapshot: '20180816'
  seeds:
  - id: UniProtKB:P21452
    gene_symbol: TACR2
    organism: Homo sapiens
