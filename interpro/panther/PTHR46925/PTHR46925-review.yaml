family_id: PANTHER:PTHR46925
family_name: G-PROTEIN COUPLED RECEPTOR TKR-1-RELATED
preferred_name: Tachykinin (neurokinin) receptors and invertebrate tachykinin-related
  peptide receptors
summary: >-
  PTHR46925 holds the metazoan tachykinin receptors: class A (rhodopsin-like) G
  protein-coupled receptors whose ligands are the Phe-Xaa-Gly-Leu-Met-amide
  tachykinins of vertebrates and the related Phe-Xaa-Gly-Xaa-Arg-amide
  tachykinin-related peptides of invertebrates. The vertebrate members form three
  paralogous subfamilies, one per neurokinin receptor: PTHR46925:SF1 is the
  neuromedin-K receptor (NK3R, TACR3), SF3 the substance-K receptor (NK2R, TACR2) and
  SF4 the substance-P receptor (NK1R, TACR1); each prefers one of the three
  tachykinins (NKB, NKA/substance K, substance P respectively) but responds to the
  others with lower affinity. PTHR46925:SF2 is the invertebrate "GPCR TKR-1-related"
  group, containing the C. elegans TKR-1 and amphioxus and tunicate orthologs, whose
  ligands are the invertebrate tachykinin-related peptides. All members are multi-pass
  plasma-membrane receptors that couple through G proteins, principally Gq to
  phospholipase C. The receptor the campaign gene reviews centre on, NK3R/TACR3, is
  the hub of the hypothalamic KNDy circuit: loss-of-function TACR3 mutations cause
  congenital hypogonadotropic hypogonadism, the same phenotype as loss of its ligand
  TAC3. PAINT propagates the shared tachykinin-receptor activity and plasma-membrane
  location family-wide and the subtype-preferred ligand activities per subfamily; the
  one weak propagation is a sperm-expression pair seeded only from human receptors,
  which diverges between human and mouse.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The genus function, tachykinin (neuropeptide) receptor activity at the plasma
  membrane, is safe for every member, vertebrate and invertebrate: all are class A
  GPCRs activated by a tachykinin or tachykinin-related peptide. What diverges is the
  subtype specificity, which is exactly what the three vertebrate subfamilies encode:
  SF1/NK3R prefers neuromedin K, SF4/NK1R substance P and SF3/NK2R substance K, so the
  subtype-specific receptor-activity terms are subfamily-scoped rather than family-wide.
  The preference is not exclusive; endogenous NKB activates arcuate kisspeptin neurons
  through all three receptors in mouse, so a subfamily term states a preferred ligand,
  not a sole one. The invertebrate SF2 group is coherent with the family at the genus
  level (its members are tachykinin-related-peptide receptors) but its ligands and the
  receptor subtypes are not the vertebrate ones, so none of the vertebrate
  subtype-specific terms applies to it. Two PAINT nodes in the committed slice are not
  nodes of this family's PANTHER tree at all; they are PTHR24238 nodes that reach the
  family only because InterPro's HMM scan cross-assigns the Drosophila TkR86C/TkR99D
  and two Anopheles receptors to PTHR46925:SF2 while PANTHER's phylogeny places them in
  PTHR24238.
