notes: >-
  Scope and method. The family's PAINT slice has ten IBD rows over six nodes, all
  assessed above; there are no IRD or IKR rows. The node-to-subfamily mapping and the
  taxon spans were read from PANTHER's reference-proteome tree for the family (resolved
  by this repository's ai_gene_review.etl.panther_trees loader; the cache is not
  committed) joined with the committed paint slice and entries inventory. The tree has
  67 leaves: SF1 NK3R/TACR3 (22), SF4 NK1R/TACR1 (22), SF3 NK2R/TACR2 (16) and the
  invertebrate SF2 (7). The root PTN001544873 is the whole family; PTN002930711,
  PTN002930710 and PTN002930712 are the exact clades of SF4, SF3 and SF1; PTN002538240
  is the ancestor of the three vertebrate subfamilies (SF1+SF3+SF4, no SF2).

  Two of the ten rows sit at nodes that are not in this family's PANTHER tree.
  PTN001201778 and PTN008610149 are PTHR24238 nodes; they enter the slice only because
  InterPro's HMM scan (the entries.csv) assigns the Drosophila TkR86C and TkR99D to
  PTHR46925:SF2 while PANTHER's phylogeny places those fly genes in PTHR24238. The
  TreeGrafter annotation table confirms PTN001201778 -> PTHR24238:SF57 and PTN008610149
  -> PTHR24238:SF66. The terms on those rows (neuropeptide receptor activity,
  neuropeptide signaling pathway, plasma membrane, tachykinin receptor activity) are
  biologically correct for insect tachykinin receptors and for this family generally,
  so nothing is proposed against them; they are assessed UNRESOLVED because the rows are
  not PTHR46925's to adjudicate. For the same reason the fly receptors are discussed in
  the SF2 description but not listed as SF2 representatives.

  Cross-check with the campaign gene reviews. The receptor-family side of the
  sperm/flagellum concern raised for this campaign resolves as a member_exception, not
  a node change, as the task anticipated. The node PTN002538240 is seeded by genuine
  human receptor-protein detection on sperm and the human TACR3 review keeps its own
  sperm rows as non-core, so the node placement is left SOUND; the mouse divergence
  (only the NK2 receptor transcript found in mouse sperm) is recorded as exceptions on
  the two sperm term assessments for mouse Tacr3 and mouse Tacr1. That agrees with the
  mouse Tacr3 review, which marks both sperm terms over-annotated. The other direction
  is consistent too: human and mouse TACR3 both ACCEPT tachykinin receptor activity,
  neuromedin K receptor activity and plasma membrane, which this review scopes to cover
  them. The ligand-side item (c) from the campaign, three mouse/rat Tac3 ISO rows whose
  human donor annotations have disappeared, is a PTHR15536 matter and is recorded in
  that family's review; it does not affect the receptor family, whose subtype-ligand
  IBDs are seeded directly from the receptors.

  One PAINT observation for a curator. The NK3R-specific molecular-function term
  GO:0016498 (neuromedin K receptor activity) has no IBD at the SF1 node PTN002930712,
  although the sibling NK1R term GO:0016496 and NK2R term GO:0016497 are placed at their
  subfamily nodes. This is the same shape as the missing TSHB signaling IBD noted in the
  glycoprotein-hormone family review (PTHR11515): a subtype whose specific term the
  curators annotate directly but PAINT has not placed at the clade. Adding an IBD for
  GO:0016498 at PTN002930712 would parallel the two siblings; it is noted rather than
  requested as a formal action because it is an addition to PAINT, not a correction of
  an existing row.
