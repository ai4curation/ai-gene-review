notes: >-
  PAINT has four node-level IBD rows on two nodes and no IRD/IKR losses. Seed MOD
  identifiers were resolved through UniProt cross-references (MGI:98460 Syn1,
  MGI:103020 Syn2, MGI:1351334 Syn3; RGD:3797/3798/3799 rat Syn1/Syn2/Syn3;
  FBgn0004575 Drosophila Syn). Not examined: subfamilies SF27 (SYNAPSIN-3), SF6
  (SYNAPSIN III) and SF26 (SYNAPSIN IIA), and the Drosophila and Helix members
  directly. The C. elegans SNN-1 GOA file carries no IBA rows from these nodes;
  whether the unreviewed G5EGI2 sits in the PAINT tree was not checked. The SYN1
  and SYN2 gene reviews disagree on the action for synapse organization
  (KEEP_AS_NON_CORE vs ACCEPT); neither contradicts the PAINT placement.
  Cytoskeletal adaptor activity was placed in 2026 and does not yet appear in the
  cached GOA files of the reviewed members.
