family_id: PANTHER:PTHR10841
family_name: SYNAPSIN
preferred_name: Synapsins
summary: >-
  Neuronal phosphoproteins that coat synaptic vesicles from the cytoplasmic side
  and link them to one another and to the presynaptic actin cytoskeleton,
  maintaining the reserve pool of vesicles. The family is defined by the
  conserved central domain C (an ATP-grasp fold implicated in actin and vesicle
  binding); vertebrates carry three paralogs (synapsin I, II and III, each in its
  own PANTHER subfamily), while invertebrates such as Drosophila, Helix and
  C. elegans carry a single synapsin.
functional_coherence: COHERENT
coherence_reason: >-
  The examined members, vertebrate SYN1 and SYN2 and the C. elegans single-copy
  ortholog SNN-1, all act in synaptic vesicle clustering at presynaptic
  terminals and share domain C. The vertebrate paralogs differ in their variable
  N- and C-terminal regions and in tetramerisation, not in the core vesicle
  tethering role. SYN3 was not examined.
