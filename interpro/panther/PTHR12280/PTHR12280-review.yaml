family_id: PANTHER:PTHR12280
family_name: PANTOTHENATE KINASE
preferred_name: Type II (eukaryotic-type) pantothenate kinase family, with PANK4 and DUF89 damage-control phosphatases
summary: >-
  Type II pantothenate kinases (PanK, EC 2.7.1.33) catalyze the ATP-dependent phosphorylation of
  (R)-pantothenate to 4'-phosphopantothenate, the first and rate-limiting step of coenzyme A
  synthesis. They have an actin-like ASKHA fold, and CoA and acyl-CoAs feedback-inhibit them. The
  family covers the human PANK1-3 isoforms, S. cerevisiae Cab1, S. pombe ptk1, plant PANKs and
  the staphylococcal type II CoaW enzymes. It also contains two groups that do not phosphorylate
  pantothenate. The first is PANK4, a PanK domain fused to a C-terminal DUF89
  (ARMT1-like) metal-dependent phosphatase domain that dephosphorylates 4'-phosphopantetheine.
  In amniotes, including human, the PanK domain of PANK4 has lost two catalytic residues and is
  inactive. The second is a group of plant proteins made only of the DUF89 domain (for example
  Arabidopsis At2g17340, a damage-control phosphatase).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Pantothenate kinase activity is shared by the characterized members of PANK1/2/3 (SF23, SF25,
  SF21), fungal Cab1/ptk1, plant PANKs and bacterial CoaW. It does not hold for two groups: the
  PANK4 clade (PAINT node PTN000957966), whose amniote members carry Val/Trp at the catalytic
  Glu/Arg positions, and the stand-alone DUF89 phosphatases (PTN004347316; SF35, SF38), which
  have no PanK domain. PAINT already negates pantothenate kinase activity at both nodes with
  IKRs. PANTHER's subfamilies do not follow this split. SF20, named 4'-PHOSPHOPANTETHEINE
  PHOSPHATASE, holds human PANK4 together with the active kinases S. cerevisiae Cab1,
  S. pombe ptk1, Arabidopsis PANK2 and staphylococcal CoaW. Kinase activity in SF20 therefore
  has to be decided by node or by catalytic residue, not by subfamily label.
