notes: >-
  Used by modules/coenzyme_a_biosynthesis.yaml (pank_activity in the type II PanK variant). The
  module's family-level grounding works only because its ancestral node PTN000957942 sits above
  IKRs that already exclude PANK4 and the DUF89-only proteins. Narrowing to a subfamily would be
  wrong here: S. cerevisiae Cab1 and S. pombe ptk1 are in SF20, the subfamily named
  4'-PHOSPHOPANTETHEINE PHOSPHATASE after PANK4. Control residues were mapped from PANK3
  (Q9H999 v1) by local BLOSUM62 pairwise alignment with Biopython, and the PANK4 positions
  match the UniProt Q9NVE7 caution (Val147, Trp211). The PANK4 gene review has no IBA row for
  GO:0015937 (GOA carries only an IEA). The S. pombe ptk1 gene review is still a stub with
  every action PENDING.
