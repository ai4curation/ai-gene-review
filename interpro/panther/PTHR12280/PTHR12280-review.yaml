term_assessments:
- assessed_term:
    id: GO:0004594
    label: pantothenate kinase activity
  scope: RESIDUE_DETERMINED
  scope_reason: >-
    SF20 mixes active kinases (Cab1, ptk1, Arabidopsis PANK2, CoaW) with the PANK4
    pseudo-kinases, so no subfamily-level grant or denial is right. The intact catalytic Glu
    (with Arg207) separates them, and the PAINT IKRs at PTN000957966 and PTN004347316 encode
    the same split by tree position. Members with no PanK domain at all (the DUF89-only SF35
    and SF38 proteins) also fall outside the term. The coenzyme A module asserts this term for
    the whole family (pank_activity, family PANTHER:PTHR12280, anchored at PTN000957942). Its
    representative members are all active kinases, so the annoton is correct as long as PANK4
    is not taken to inherit the activity. Human PANK4 (SF20) is the site's negative control:
    Val147/Trp211 at the catalytic positions, and no measurable kinase activity.
  determined_by_site: pank_catalytic_glu
  supported_by:
  - reference_id: PMID:30927326
    supporting_text: Biochemical analysis corroborates bioinformatic predictions-human PANK4
      lacks pantothenate kinase activity
  - reference_id: PMID:19266201
    supporting_text: Enzymatic studies and heterologous complementation of this mutation by bacterial
      and mammalian genes showed that YDR531W encodes a genuine pantothenate kinase
  - reference_id: PMID:30927326
    supporting_text: human PANK4 is a pseudo-pantothenate kinase-a catalytically deficient variant
      of the catalytically active PANK4 found in plants and fungi
- assessed_term:
    id: GO:0015937
    label: coenzyme A biosynthetic process
  scope: RESIDUE_DETERMINED
  scope_reason: >-
    Pantothenate phosphorylation is step 1 of CoA synthesis, so the process term goes with the
    kinase activity and has the same scope. It should not reach PANK4 by inheritance (see the
    PTN000957942 assessment). PANK4's real role, CoA-pathway metabolite repair by dephosphorylating
    4'-phosphopantetheine, works against net synthesis.
  determined_by_site: pank_catalytic_glu
  supported_by:
  - reference_id: PMID:30927326
    supporting_text: Pantothenate kinase generates 4'-phosphopantothenate in the first and
      rate-determining step of coenzyme A (CoA) biosynthesis.
- assessed_term:
    id: GO:0016791
    label: phosphatase activity
  scope: UNRESOLVED
  scope_reason: >-
    Phosphatase activity belongs to the C-terminal DUF89 domain, not to any PANTHER subfamily.
    The PANK4 clade (PTN000957966, IBD seeded by human PANK4), plant PanK-DUF89 fusions and the
    DUF89-only SF35/SF38 proteins have the domain; Cab1, ptk1 and PANK1-3 do not. The
    PTN000957966 IBD is sound for the PANK4 clade, but no subfamily-level scope can be written
    for this term.
  supported_by:
  - reference_id: PMID:27322068
    supporting_text: phosphopantetheine and its S-sulfonate or sulfonate (subfamily II-PanK fusions)
- assessed_term:
    id: GO:0005634
    label: nucleus
  scope: UNRESOLVED
  scope_reason: >-
    See the PTN001746184 node assessment. Nuclear localization is documented for PanK1alpha,
    while PANK3 is cytosolic. The gene reviews split between KEEP_AS_NON_CORE and
    MARK_AS_OVER_ANNOTATED.
  supported_by:
  - reference_id: PMID:23152917
    supporting_text: Mouse PanK2 and both human and mouse PanK3 were cytosolic with a diffuse pattern
