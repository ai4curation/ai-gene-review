  assessment: SOUND
  assessment_reason: >-
    The seeds are animal, fungal and plant pantothenate kinases, which supports placement at
    the eukaryotic PanK root. The two clades that lack the activity are already excluded by
    IKRs: the PANK4 clade (PTN000957966) and the DUF89-only plant clade (PTN004347316). In the
    PAINT UniProt GAF, PANK4 receives NOT|enables for the kinase while keeping the positive
    terms from the root. The same root also passes coenzyme A biosynthetic process
    (GO:0015937) to PANK4, and that process term has no IKR. PANK4 makes no CoA intermediate;
    its phosphatase degrades 4'-phosphopantetheine. GO:0015937 on PANK4 is therefore
    questionable and should be pruned along with the kinase activity.
- node_id: PANTHER:PTN000957966
  asserted_term:
    id: GO:0004594
    label: pantothenate kinase activity
  paint_snapshot: '20250903'
  assessment: UNRESOLVED
  assessment_reason: >-
    This is an IKR (negated) row placed on the PANK4 clade. The clade's members in the PAINT
    UniProt GAF span vertebrates, including Xenopus and zebrafish, as well as invertebrates and
    Monosiga. The loss of the catalytic Glu/Arg pair has been shown only for amniote PANK4.
    Frog PANK4 keeps both residues and has low but detectable kinase activity, so for that
    member the NOT is slightly too strong. The PANK4 orthologs that the same paper calls
    catalytically active are plant and fungal, and they are outside this node. The negation is
    therefore safe for amniotes, defensible as a statement of weak activity for anamniote
    animals, and correct to exclude the plant and fungal enzymes.
  supported_by:
  - reference_id: PMID:30927326
    supporting_text: The PANK4 from frog, an anamniote living relative encoding the catalytically
      active residues, had only a low level of kinase activity
