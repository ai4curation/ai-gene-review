  7 ancestral PTN node(s) (PANTHER:PTN000072732, PANTHER:PTN000073047, PANTHER:PTN000743491, PANTHER:PTN002472914
  (+3 more)) with 22 IBD node assertion(s) and 2 term(s) carrying negated IRD/IKR branch blocks, covering
  cytoplasmic dynein complex (GO:0005868, CC), cytoplasmic microtubule (GO:0005881, CC), cell cortex (GO:0005938,
  CC), microtubule-based movement (GO:0007018, BP) and 16 additional GO term(s).
functional_coherence: MOSTLY_COHERENT
coherence_reason: Core family functions (cytoplasmic dynein complex (GO:0005868, CC), cytoplasmic microtubule
  (GO:0005881, CC), cell cortex (GO:0005938, CC), microtubule-based movement (GO:0007018, BP) and 16 additional
  GO term(s)) are conserved across the primary ancestral clade, with lineage-specific variation reflected
  by IBD assertions distributed across 7 PTN nodes (PANTHER:PTN000072732, PANTHER:PTN000073047, PANTHER:PTN000743491,
  PANTHER:PTN002472914 (+3 more)); negated IRD/IKR loss assertion(s) on GO:0060294, GO:0097729; member-specific
  pruning exception(s) on GO:0060294, GO:0097729.
