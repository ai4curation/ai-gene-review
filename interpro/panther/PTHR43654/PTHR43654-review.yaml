  label: ISOPENTENYL PHOSPHATE KINASE
  description: >-
    Bacterial ProB glutamate 5-kinases (406 of the 447 reviewed family members in the local inventory,
    all named glutamate 5-kinase). The PANTHER name reflects the plant isopentenyl phosphate kinase clade
