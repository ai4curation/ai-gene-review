subfamilies:
- subfamily_id: PANTHER:PTHR43654:SF1
  label: ISOPENTENYL PHOSPHATE KINASE
  description: >-
    Functionally mixed subfamily. Of its 406 reviewed members in the local inventory (counted with a CSV
    parser), 401 are ProB-type glutamate 5-kinases and 5 are isopentenyl phosphate kinases:
    Arabidopsis IPK Q8H1F7 (AT1G26640, the PAINT seed at PTN001337743) and the archaeal D4GWT7 (Haloferax
    volcanii), O26153 (Methanothermobacter thermautotrophicus), Q60352 (Methanocaldococcus jannaschii)
    and Q9HLX1 (Thermoplasma acidophilum). PANTHER names the subfamily after the IPK minority. Because
    it mixes ProB with IPKs, neither the SF1 id nor its name can stand for glutamate 5-kinase, and
    glutamate 5-kinase terms are scoped family-wide with the IPKs as explicit member exceptions. The
    subfamily is not flagged as diverged because 401 of 406 members keep the family function; the
    divergence is confined to the five IPKs and is recorded as member exceptions and at PAINT node
    PTN001337743.
