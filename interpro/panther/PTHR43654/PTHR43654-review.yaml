  Amino acid kinase-family glutamate 5-kinases (E. coli and P. putida ProB, S. cerevisiae PRO1, S.
  pombe SPAC17H9.13c) catalysing the first step of proline biosynthesis. PANTHER names SF1 "isopentenyl
  phosphate kinase", but its reviewed members are ProB.
