family_id: PANTHER:PTHR43654
family_name: GLUTAMATE 5-KINASE
preferred_name: Glutamate 5-kinase (ProB/PRO1) family
summary: >-
  Amino acid kinase-family glutamate 5-kinases (E. coli, P. putida and B. subtilis ProB, S. cerevisiae
  PRO1, S. pombe SPAC17H9.13c) catalysing the first step of proline biosynthesis from glutamate,
  ATP-dependent phosphorylation of L-glutamate to L-glutamyl 5-phosphate. Bacterial and fungal members
  carry a C-terminal PUA domain that modulates the kinase domain and proline feedback inhibition. PAINT
  records one functional divergence inside the family, a plant clade (node PTN001337743, seeded by
  Arabidopsis AT1G26640) that has lost glutamate 5-kinase activity and gained isopentenyl phosphate
  kinase activity in terpenoid biosynthesis; PANTHER names SF1 after that activity, but all reviewed
  SF1 members in the local inventory are bacterial ProB.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Glutamate 5-kinase activity is ancestral (PTN000115542) and retained by every reviewed bacterial and
  fungal member in both subfamilies. The exception is the isopentenyl phosphate kinase clade below
  PTN001337743, where PAINT records IRD losses of glutamate 5-kinase activity and L-proline biosynthesis.
