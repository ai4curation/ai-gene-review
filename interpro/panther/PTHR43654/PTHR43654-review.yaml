family_id: PANTHER:PTHR43654
family_name: GLUTAMATE 5-KINASE
preferred_name: Glutamate 5-kinase (ProB/PRO1) family
summary: >-
  Amino acid kinase-family glutamate 5-kinases (E. coli, P. putida and B. subtilis ProB, S. cerevisiae
  PRO1, S. pombe SPAC17H9.13c) catalysing the first step of proline biosynthesis from glutamate,
  ATP-dependent phosphorylation of L-glutamate to L-glutamyl 5-phosphate. Bacterial and fungal members
  carry a C-terminal PUA domain that modulates the kinase domain and proline feedback inhibition. The
  family also contains isopentenyl phosphate kinases of the archaeal and plant mevalonate-pathway
  variant (Arabidopsis IPK Q8H1F7/AT1G26640 and four archaeal IPKs, all in SF1). PAINT records the
  divergence at node PTN001337743, seeded by AT1G26640, as loss of glutamate 5-kinase activity and gain
  of isopentenyl phosphate kinase activity; the committed PAINT slice lists no tree topology, so it
  cannot show whether the archaeal IPKs also descend from PTN001337743 or diverged separately.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Glutamate 5-kinase activity is ancestral (PTN000115542) and retained by every reviewed bacterial and
  fungal glutamate 5-kinase in both subfamilies. The exceptions are the five isopentenyl phosphate
  kinases in SF1 (one plant, four archaeal); PAINT removes glutamate 5-kinase activity and proline
  biosynthesis by IRD at PTN001337743, and they are listed as member exceptions below.
