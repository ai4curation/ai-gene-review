notes: >-
  PUA domain and RNA binding (family-wide argument, referenced from member gene reviews). Bacterial and
  fungal glutamate 5-kinases carry a C-terminal PUA domain, and InterPro2GO maps the PUA signatures
  (IPR002478, IPR036974) to GO:0003723 RNA binding. That mapping reflects RNA-modifying PUA proteins
  such as pseudouridine synthases and archaeosine tRNA-guanine transglycosylases. In glutamate
  5-kinase the PUA domain packs against the amino-acid-kinase domain in the oligomer and modulates
  the Mg requirement, proline inhibition and aggregation of the enzyme (E. coli ProB dissection,
  PMID:16337196, and crystal structure, PMID:17321544). No member of the family has been shown to bind
  RNA, so the PUA-derived RNA-binding IEA is removed in the member reviews (E. coli and P. putida proB,
  S. cerevisiae PRO1, S. pombe SPAC17H9.13c) as an over-propagated domain-to-function mapping.
  Counts in this review were derived with a CSV parser from PTHR43654-entries.csv (447 reviewed
  members: 406 SF1, 41 SF3). SF3 also holds the uncharacterized yeast YHR033W (P38690), a PRO1 paralog
  of unknown function.
