notes: >-
  Subfamily placements come from the PANTHER 19.0 per-organism classification files. Inherited
  nodes were read from the PAINT UniProt GAF. Human and mouse PGM5 receive NOT GO:0004614 from
  PTN002731341, but still receive GO:0005829 and GO:0005975 from PTN000501426. Seed identities were
  resolved with UniProt cross-reference queries. S. cerevisiae PGM3/PRM15 (the phosphoribomutase
  that also has some phosphoglucomutase activity) is in a different PANTHER family (PTHR45745), so
  it is outside this review. Module labelling is consistent with PANTHER: modules use the family
  name "PHOSPHOHEXOMUTASE FAMILY MEMBER" for PTHR22573 and "PHOSPHOGLUCOMUTASE" for SF2. The
  modules and the gene review folder call S. pombe O74374 "pgm1", while UniProt gives only the ORF
  name SPBC32F12.10.
