term_assessments:
- assessed_term:
    id: GO:0004614
    label: phosphoglucomutase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the defining activity of the bacterial, fungal, animal and plant PGMs. The five modules
    that use this family assert it with catalytic representatives (yeast PGM1/PGM2, S. pombe
    SPBC32F12.10, human PGM1): dolichol_phosphate_sugar_donor_supply, emp_glycolysis,
    galactose_leloir_pathway, glycogenolysis, and glycogen_metabolism_fungal (as SF2). The
    vertebrate PGM5 clade (SF27) is the exception, and PAINT already excludes it with an IKR.
  member_exceptions:
  - member:
      id: UniProtKB:Q15124
      label: Phosphoglucomutase-like protein 5
      gene_symbol: PGM5
      organism: Homo sapiens
    exception_reason: >-
      An enzymatically inactive PGM paralog with a structural role at adherens-type junctions.
      The same applies to all vertebrate PGM5 orthologs.
    lost_in_clade_node_id: PANTHER:PTN002731341
    supported_by:
    - reference_id: PMID:8175905
      supporting_text: the purified proteins have no detectable phosphoglucomutase activity
  supported_by:
  - reference_id: PMID:8119301
    supporting_text: No residual phosphoglucomutase activity could be measured in crude extracts
  - reference_id: PMID:10759515
    supporting_text: Expression of a recombinant protein in Escherichia coli confirmed its enzyme activity.
- assessed_term:
    id: GO:0005975
    label: carbohydrate metabolic process
  scope: FAMILY_WIDE
  scope_reason: >-
    A broad process, correct for every catalytic member. PGM5 is excluded. See the PTN000501426
    assessment, which recommends a matching IRD. Gene reviews differ on granularity, not on
    biology: the S. cerevisiae PGM1 and PGM2 reviews accept the IBA, while the S. pombe pgm1 review
    marks it as over-annotated because it is true but uninformative (glucose 1-phosphate metabolic
    process is the specific role).
  member_exceptions:
  - member:
      id: UniProtKB:Q15124
      label: Phosphoglucomutase-like protein 5
      gene_symbol: PGM5
      organism: Homo sapiens
    exception_reason: >-
      PGM5 has no mutase activity and a structural role, so it does not take part in carbohydrate
      metabolism. It inherits the term only because the PTN002731341 IKR covers the molecular
      function alone.
    pruned_node_id: PANTHER:PTN000501426
    lost_in_clade_node_id: PANTHER:PTN002731341
    supported_by:
    - reference_id: PMID:8631316
      supporting_text: encodes a protein with a structural rather than an enzymatic role
  supported_by:
  - reference_id: file:interpro/panther/PTHR22573/PTHR22573-paint.tsv
    supporting_text: "PTHR22573\tPTN000501426\tGO:0005975\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0019388
    label: galactose catabolic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Phosphoglucomutase turns the glucose 1-phosphate made by the Leloir pathway into glycolytic
    glucose 6-phosphate. This is the step that lets yeast use galactose, and the
    galactose_leloir_pathway module asserts it for the PGM annoton. It is safe for the cytosolic
    subfamilies SF2 (yeast PGM1/PGM2, S. pombe SPBC32F12.10) and SF37 (vertebrate PGM1). It is not
    asserted for the plastidic (SF59) or bacterial (SF57) subfamilies, whose galactose roles were
    not checked, nor for PGM5 (SF27). In S. pombe the term is conditional: the pgm1 review notes
    that the Leloir route operates only when the normally silenced gal genes are expressed.
  applicable_subfamilies:
  - id: PANTHER:PTHR22573:SF2
    label: PHOSPHOGLUCOMUTASE
  - id: PANTHER:PTHR22573:SF37
    label: PHOSPHOGLUCOMUTASE-1
  supported_by:
  - reference_id: PMID:8119301
    supporting_text: Cells deleted for both, PGM1 and PGM2, could not grow on galactose.
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for the cytosolic phosphoglucomutases, which are the only members the modules use (all
    the modules that give a location say cytosol). Not safe for the plastidic SF59 enzymes. See
    the PTN000501426 cytosol assessment.
  applicable_subfamilies:
  - id: PANTHER:PTHR22573:SF2
    label: PHOSPHOGLUCOMUTASE
  - id: PANTHER:PTHR22573:SF37
    label: PHOSPHOGLUCOMUTASE-1
  - id: PANTHER:PTHR22573:SF57
    label: PHOSPHOGLUCOMUTASE
  supported_by:
  - reference_id: PMID:10759515
    supporting_text: An Arabidopsis cDNA (AtPGMp) encoding the plastidic phosphoglucomutase (PGM)
