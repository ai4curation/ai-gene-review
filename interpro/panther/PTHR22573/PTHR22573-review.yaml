family_id: PANTHER:PTHR22573
family_name: PHOSPHOHEXOMUTASE FAMILY MEMBER
preferred_name: Alpha-D-phosphohexomutase family (phosphoglucomutases and PGM5)
summary: >-
  Phosphoglucomutases of the alpha-D-phosphohexomutase superfamily reversibly interconvert
  alpha-D-glucose 1-phosphate and glucose 6-phosphate. They work by a ping-pong mechanism through a
  phosphoserine enzyme intermediate and glucose 1,6-bisphosphate, with Mg2+ bound. The enzyme links
  glycolysis to glycogen or starch turnover, to UDP-glucose synthesis and to the Leloir pathway of
  galactose use. The family includes S. cerevisiae PGM2 (the major isozyme) and PGM1, S. pombe
  SPBC32F12.10, human PGM1, E. coli Pgm, and the cytosolic and plastidic phosphoglucomutases of
  plants. It also includes vertebrate PGM5 (PGM-related protein, aciculin), which is enzymatically
  inactive and acts as a structural protein of adherens-type junctions and the dystrophin/utrophin
  cytoskeleton in muscle.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Phosphoglucomutase activity is shared by the bacterial, fungal, animal and plant enzymes. The
  exception is vertebrate PGM5 (SF27). It lost the mutase active-site consensus and has no
  phosphoglucomutase activity, and PAINT records this with an IKR (NOT GO:0004614 at PTN002731341,
  Euteleostomi). Location also varies. Most members are cytosolic, but the plant plastidic
  enzymes (SF59, for example Arabidopsis PGMP) are chloroplastic and still inherit the cytosol IBA.
  The physiological role depends on lineage (glycogen versus starch, galactose use), but the
  reaction does not.
