  name:
    name: Prefoldin Subunit Beta
    short: Prefoldin_subunit_beta
  description:
  - text: The Prefoldin Subunit Beta Family comprises molecular chaperones that play
      a crucial role in protein folding and stabilization. Members of this family
      bind specifically to cytosolic chaperonin (c-CPN) and transfer target proteins
      to it, facilitating the correct folding of nascent polypeptide chains in a competitive
      environment. Some members exhibit an ATP-independent, HSP70-like function, particularly
      in archaeal de novo protein folding. Additionally, certain eukaryotic members
      are involved in mitotic spindle positioning and regulation of gene expression
      by modulating spliceosome function and microtubule organization.
