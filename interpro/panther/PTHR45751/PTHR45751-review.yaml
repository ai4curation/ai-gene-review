term_assessments:
- assessed_term:
    id: GO:0070534
    label: protein K63-linked ubiquitination
  scope: UNRESOLVED
  scope_reason: RGLG3 and RGLG4 have demonstrated ubiquitin ligase activity, but the cited activity assay
    does not establish K63 linkage specificity. Linkage choice depends on the E2/E3 combination and chain-extension
    mechanism, not the RING motif alone. K63 transfer to rice or across the family requires an actual
    linkage assay or an experimentally anchored isofunctional branch.
  supported_by:
  - reference_id: PMID:22898498
    supporting_text: "Both RGLG3 and \nRGLG4 possessed ubiquitin ligase activities"
