    supporting_text: FT   DOMAIN          356..389
  - reference_id: file:genes/ORYSJ/Q6YYC5/Q6YYC5-uniprot.txt
    supporting_text: FT                   /note="RING-type"
- assessed_term:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  scope: UNRESOLVED
  scope_reason: Both Arabidopsis RGLG3 and RGLG4 provide direct positive E3 evidence, and the rice RING
    domain is compatible with that reaction. The family also contains proteins with different domain combinations,
    so a copine-like name or shared interaction domain is not sufficient. Retention of the functional
    RING/E2 interface and the complete catalytic branch boundary remain unresolved.
  supported_by:
