family_id: PANTHER:PTHR45751
family_name: COPINE FAMILY PROTEIN 1
preferred_name: Plant RGLG ubiquitin ligases and copine-related proteins
summary: The retrieved group includes RGLG RING-type ubiquitin ligases and proteins carrying copine-related
  names. Ligase activity depends on the RING-containing architecture and its E2 partner; membrane association
  and substrate choice differ among paralogs.
functional_coherence: HETEROGENEOUS
coherence_reason: Rice Q6YYC5 has an annotated RING domain and RGLG4 placement. Experiments establish
  ligase activity for RGLG3/RGLG4, supporting that bounded inference. K63-chain formation is a narrower
  E2/E3-dependent reaction and cannot follow merely from general ubiquitin-ligase activity.
subfamilies:
- subfamily_id: PANTHER:PTHR45751:SF16
  label: E3 UBIQUITIN-PROTEIN LIGASE RGLG4
  description: Recorded placement of Q6YYC5. Rice Q6YYC5 has an annotated RING domain and RGLG4 placement.
    Experiments establish ligase activity for RGLG3/RGLG4, supporting that bounded inference. K63-chain
    formation is a narrower E2/E3-dependent reaction and cannot follow merely from general ubiquitin-ligase
    activity.
