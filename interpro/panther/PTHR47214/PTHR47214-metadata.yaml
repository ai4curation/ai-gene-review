  name:
    name: Leaf Development Regulator
    short: Leaf_Dev_Regulator
  description:
  - text: This family of proteins functions as transcription factors involved in cell
      differentiation. They play a crucial role in leaf development and morphogenesis
      by regulating the expression of knox homeobox genes and other determinants of
      leaf polarity. Members of this family can form dimers through a conserved C-terminal
      domain and may interact with other proteins to exert their regulatory functions.
      Some proteins in this family are also implicated in the regulation of flowering
      by binding to specific promoters and forming functional complexes with other
      factors.
