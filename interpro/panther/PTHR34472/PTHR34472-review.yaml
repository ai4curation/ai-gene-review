  seeds:
  - id: UniProtKB:O32583
  assessment: SOUND
  assessment_reason: >-
    The seed E. coli ThiS is converted to a C-terminal thiocarboxylate that serves as the
    immediate sulfur donor for thiazole formation, matching the GO definition of covalently
    binding sulfur and delivering it to an acceptor. The C-terminal Gly-Gly that carries the
    sulfur is conserved in the bacterial members, including the KT2440 reference protein, whose
    review proposes this term as NEW.
  supported_by:
