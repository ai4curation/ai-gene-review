    supporting_text: "PTHR34472\tPTN002157649\tGO:0097163\tF\tIBD\tfalse\tUniProtKB:O32583"
  - reference_id: PMID:9632726
    supporting_text: ThiS isolated from E. coli thiI+ is post-translationally modified by converting
      the carboxylic acid group of the carboxyl-terminal glycine into a thiocarboxylate.
  - reference_id: file:genes/PSEPK/PP_5105/PP_5105-ai-review.yaml
    supporting_text: ThiS does the work of sulfur delivery
- node_id: PANTHER:PTN002157649
  asserted_term:
    id: GO:0052837
    label: thiazole biosynthetic process
  evidence: IBD
  paint_snapshot: '20241008'
  seeds:
  - id: UniProtKB:O32583
  assessment: SOUND
  assessment_reason: >-
    The ThiS thiocarboxylate sulfur becomes the thiazole ring sulfur, so the carrier takes part
    in thiazole formation, and reconstituted thiazole synthase needs ThiS in its thiocarboxylate
    form. The term is specific to the thiazole branch, as the family's single function requires.
  supported_by:
  - reference_id: file:interpro/panther/PTHR34472/PTHR34472-paint.tsv
    supporting_text: "PTHR34472\tPTN002157649\tGO:0052837\tP\tIBD\tfalse\tUniProtKB:O32583"
  - reference_id: PMID:17403671
    supporting_text: was the use of ThiS in the thiocarboxylate form.
  - reference_id: file:genes/PSEPK/PP_5105/PP_5105-ai-review.yaml
    supporting_text: its thiocarboxylate supplies the sulfur atom that becomes S1 of the thiazole ring
- node_id: PANTHER:PTN002157649
  asserted_term:
    id: GO:1902503
    label: adenylyltransferase complex
  evidence: IBD
  paint_snapshot: '20241008'
  seeds:
  - id: UniProtKB:O32583
  assessment: UNRESOLVED
  assessment_reason: >-
    E. coli ThiS forms a crystallised complex with its E1-like adenylyltransferase ThiF, and
    B. subtilis also encodes ThiF, so the term is sound in ThiF-containing organisms. Placed at
    the family root, it also reaches members whose genomes encode no dedicated ThiF. P. putida
    KT2440 has no protein annotated as ThiF, and the enzyme that activates its ThiS (PP_5105) is
    unknown; MoeB/PP_0735 is the only candidate. Whether ThiS in such organisms forms a stable
    complex with a substitute adenylyltransferase has not been tested. The plastid ycf40
    members are likewise untested. The placement can be neither confirmed nor refuted for these
    branches.
  supported_by:
  - reference_id: file:interpro/panther/PTHR34472/PTHR34472-paint.tsv
    supporting_text: "PTHR34472\tPTN002157649\tGO:1902503\tC\tIBD\tfalse\tUniProtKB:O32583"
  - reference_id: PMID:16388576
    supporting_text: We have determined the crystal structure of the Escherichia coli ThiS-ThiF
      protein complex at 2.0 A resolution.
  - reference_id: file:genes/PSEPK/thiG/thiG-bioinformatics/RESULTS.md
    supporting_text: KT2440 also has no protein annotated as ThiF.
