family_id: PANTHER:PTHR34472
family_name: SULFUR CARRIER PROTEIN THIS
preferred_name: ThiS sulfur carrier protein family
summary: >-
  ThiS proteins are small ubiquitin-like beta-grasp sulfur carriers that end in a conserved Gly-Gly
  motif. An E1-like adenylyltransferase (ThiF in E. coli and B. subtilis) adenylylates the
  C-terminal glycine. Sulfur mobilised from cysteine by IscS and ThiI then turns it into a
  thiocarboxylate, which donates the sulfur to thiazole synthase ThiG for the thiazole moiety of
  thiamine. PANTHER places all members in one subfamily (SF1). It includes the bacterial ThiS
  proteins and the plastid-encoded ycf40 proteins of red algae and diatoms. The related MoaD
  sulfur carrier of molybdopterin synthesis is a separate PANTHER family (PTHR33359) and is not
  included.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Sulfur carrier activity in thiazole biosynthesis rests on direct evidence in E. coli and holds
  for the bacterial ThiS members, whose C-terminal Gly-Gly is invariant (all 355 Pseudomonas
  IPR010035 entries end in GG). The plastid ycf40 proteins are uncharacterised. Membership of an
  adenylyltransferase complex depends on the E1-like partner, which is absent as a dedicated
  ThiF in some members' genomes (P. putida KT2440).
