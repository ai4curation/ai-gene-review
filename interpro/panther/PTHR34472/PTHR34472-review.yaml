  diverged_from_family: false
  divergence_description: >-
    No functional divergence is established. Two member-level differences are recorded. The
    plastid ycf40 proteins are untested, though named ThiS-like by their PANTHER assignment.
    The KT2440 PP_5105 gene model carries an N-terminal extension of about 21-26 residues
    beyond Pseudomonas orthologs, probably a wrong start site that leaves the ThiS core intact.
