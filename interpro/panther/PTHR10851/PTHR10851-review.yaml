family_id: PANTHER:PTHR10851
family_name: PYRIDOXINE-5-PHOSPHATE OXIDASE
preferred_name: Pyridoxine/pyridoxamine 5-phosphate oxidase (PdxH/PNPO) family
summary: >-
  FMN-dependent oxidases that convert pyridoxine 5'-phosphate and pyridoxamine 5'-phosphate to pyridoxal
  5'-phosphate, the last step of de novo PLP synthesis in E. coli-type bacteria and of B6 salvage
  in eukaryotes. The family contains bacterial PdxH, S. cerevisiae PDX3, S. pombe SPAC1093.02 and
  human PNPO; plant PPOX2 forms a separate subfamily.
functional_coherence: COHERENT
coherence_reason: >-
  Parsed from the entries file (362 reviewed members): SF0 holds 361, of which 344 are named
  pyridoxine/pyridoxamine 5'-phosphate oxidase and 5 pyridoxine-5'-phosphate oxidase. SF0 also holds
  three PhzG-type dihydrophenazinedicarboxylate synthases of phenazine biosynthesis, which are
  excepted from the oxidase term below. SF3 holds the single Arabidopsis PPOX2, which was not
  assessed.
