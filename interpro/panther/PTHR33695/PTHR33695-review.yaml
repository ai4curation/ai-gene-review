family_id: PANTHER:PTHR33695
family_name: LIPOPROTEIN SIGNAL PEPTIDASE
preferred_name: LspA signal peptidase II family (peptidase A8)
summary: LspA (signal peptidase II) enzymes are polytopic cytoplasmic-membrane aspartic proteases of peptidase
  family A8. They remove the signal peptide immediately before the lipidated cysteine of diacylglyceryl-prolipoproteins
  after Lgt action. Signal peptidase activity describes the substrate-processing function, whereas aspartic-type
  endopeptidase activity describes its catalytic mechanism. These are complementary descriptions. Viability
  requirements differ among species.
functional_coherence: COHERENT
coherence_reason: The frozen PAINT root PTN002134743 contains all 38 resolved tree leaves, including E.
  coli and Bacillus LspA, and has no loss rows. Structural and mutational evidence supports conserved
  signal-peptide cleavage and the aspartic mechanism. KT2440 membership is independently documented in
  the inventory, although that accession is absent from this limited tree cache.
