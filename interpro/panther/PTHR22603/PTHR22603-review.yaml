family_id: PANTHER:PTHR22603
family_name: CHOLINE/ETHANOALAMINE KINASE
preferred_name: Choline/ethanolamine kinase family
summary: >-
  Cytosolic kinases that phosphorylate choline and ethanolamine, the first steps of the Kennedy pathway.
  S. cerevisiae has a choline-preferring CKI1 and an ethanolamine-preferring EKI1; S. pombe has one
  enzyme with both activities. Human CHKA/CHKB act on both substrates; ETNK1/ETNK2 are ethanolamine-specific.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members phosphorylate choline and/or ethanolamine. Preference differs: CHK subfamilies (SF36,
  SF35, SF25, SF26) take both, ETNK (SF91, SF94, SF66) are ethanolamine-specific, and fungal SF93
  contains both CKI1 and EKI1.
