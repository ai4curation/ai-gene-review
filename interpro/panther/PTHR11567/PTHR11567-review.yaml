family_id: PANTHER:PTHR11567
family_name: ACID PHOSPHATASE-RELATED
preferred_name: Histidine acid phosphatase-related family
summary: >-
  PTHR11567 contains multiple human histidine acid phosphatase branches with
  distinct substrates and locations: ACP2 is a lysosomal acid phosphatase, ACP3
  is secreted and transmembrane prostatic acid phosphatase, ACP4/ACPT is a
  membrane ERBB4 protein tyrosine phosphatase, ACP6 is a mitochondrial
  lysophosphatidic acid phosphatase, PXYLP1 is a Golgi 2-phosphoxylose
  phosphatase in proteoglycan linker maturation, and FRA10AC1 is a
  phosphatase-loss spliceosomal C-complex protein. PAINT already blocks the
  root phosphatase IBD before FRA10AC1, but the ACP2 lysosome/acid-phosphatase
  node still reaches ACP4 and needs ACP4-clade pruning. The ACP6 node correctly
  propagates LPA phosphatase activity and mitochondrion but should not propagate
  lysobisphosphatidic acid metabolism.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family preserves the histidine acid phosphatase fold across ACP2, ACP3,
  ACP4, ACP6, and PXYLP1 but uses it on different substrates in different
  compartments; FRA10AC1 has diverged far enough that PAINT already records
  loss of the broad phosphatase assertion. Generic phosphatase activity is
  appropriate above these branches, but acid phosphatase, LPA phosphatase,
  protein tyrosine phosphatase, 2-phosphoxylose phosphatase, lysosomal
  localization, and Golgi localization are subfamily-specific.
