family_id: PANTHER:PTHR46205
family_name: LOQUACIOUS, ISOFORM B
summary: Double-stranded-RNA-binding cofactors regulate small-RNA processing and loading by cooperating
  with RNA-silencing enzymes. Different proteins and isoforms recruit or tune distinct processing pathways.
functional_coherence: HETEROGENEOUS
coherence_reason: Loquacious isoforms act as double-stranded-RNA pathway cofactors rather than RNases.
  Loqs-PB uses different dsRNA-binding motifs for pre-miRNA and Dicer-1 interactions (PMID:17666393),
  while alternative isoforms partition miRNA and endogenous-siRNA biogenesis (PMID:19644447). Exact-target
  domain analysis supports retention of the three dsRNA-binding motifs in the benchmark product. The family
  also includes related cofactors with different partners, so direct dsRNA binding and pathway membership
  require the appropriate motif/isoform context; an exhaustive positive subfamily set is not inferred
  from these exemplars.
