family_id: PANTHER:PTHR15451
family_name: ERGOSTEROL BIOSYNTHETIC PROTEIN 28-RELATED
preferred_name: ERG28 sterol biosynthesis scaffold family
summary: >-
  Erg28 is a small ER membrane protein with no catalytic activity. It tethers the C-4 sterol demethylation
  enzymes (Erg25, Erg26, Erg27) and Erg6 into a complex for efficient ergosterol synthesis (S. cerevisiae
  ERG28, S. pombe erg28; animal C14orf1/ERG28 homologs).
