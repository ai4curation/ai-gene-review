family_id: PANTHER:PTHR12450
family_name: DENTIN MATRIX PROTEIN 4  PROTEIN FAM20
summary: FAM20 proteins share a secretory-pathway kinase-like architecture but diverge in catalytic output.
  FAM20B phosphorylates xylose in the glycosaminoglycan linkage region; FAM20C phosphorylates secreted
  proteins; FAM20A is a regulatory pseudokinase that supports FAM20C function. Sugar phosphorylation and
  protein phosphorylation are distinct activities.
functional_coherence: HETEROGENEOUS
coherence_reason: Human FAM20B enzymology directly establishes phosphorylation of glycan-linked xylose
  (PMID:19473117), whereas FAM20C acts on proteins and FAM20A is its regulatory pseudokinase partner.
  CG3631/Q95T10 has an SF14 assignment and a curated inference from human FAM20B O75063, not a fly substrate
  assay. The inventory also contains fly CG31145 and worm CeFam20 protein kinases; SF11 is therefore not
  an exhaustive protein-kinase boundary.
reference_protein: &id001
  id: UniProtKB:Q95T10
  label: Glycosaminoglycan xylosylkinase homolog
  gene_symbol: CG3631
  organism: Drosophila melanogaster
subfamilies:
- subfamily_id: PANTHER:PTHR12450:SF14
  label: GLYCOSAMINOGLYCAN XYLOSYLKINASE
  description: IPR024869 and the PANTHER subfamilies distinguish FAM20B, FAM20C and pseudokinase FAM20A.
    Fly CG3631 maps to glycosaminoglycan xylosylkinase, supporting comparison to FAM20B rather than a
    generic protein kinase. Xylosylkinase here acts on a glycan-bound xylose and must not be confused
    with free-xylulose kinase.
  representative_members:
  - *id001
- subfamily_id: PANTHER:PTHR12450:SF11
  label: EXTRACELLULAR SERINE_THREONINE PROTEIN KINASE FAM20C
  description: FAM20C-type protein kinases phosphorylate secretory-pathway protein substrates, unlike
    the glycan substrate of FAM20B.
- subfamily_id: PANTHER:PTHR12450:SF12
  label: PSEUDOKINASE FAM20A
  description: Regulatory FAM20A pseudokinases promote FAM20C activity without themselves supplying the
    protein phosphorylation reaction.
  diverged_from_family: true
  divergence_description: Catalytically inactive regulatory partner of FAM20C; substrate phosphorylation
    is executed by the partner kinase.
