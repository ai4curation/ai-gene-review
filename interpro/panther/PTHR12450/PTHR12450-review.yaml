review_status: COMPLETE
reviewed_by: codex
review_date: '2026-09-10'
notes: Benchmark representatives and subfamily identifiers are verified against the frozen UniProt records
  and PANTHER vocabulary. The summary distinguishes family classification from biological evidence. No
  PAINT ancestral-node placement is asserted without a tree-based assessment, and no catalytic-residue
  loss is inferred from a short or incomplete input sequence.
term_assessments:
- assessed_term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  scope: UNRESOLVED
  scope_reason: FAM20C protein phosphorylation is supported directly by structural and biochemical studies,
    whereas FAM20B phosphorylates glycan-bound xylose and FAM20A regulates FAM20C without supplying that
    catalytic reaction. The classification also includes a separate fly CG31145 protein-kinase branch
    and less characterized FAM20-domain proteins. The human-named FAM20C subfamily is therefore not established
    as an exhaustive allowed set. A complete phylogenetic and substrate-evidence boundary is needed for
    the machine-readable scope; the protein-kinase versus glycan-kinase versus pseudokinase distinction
    remains well supported.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/primary-sources/PMID-29572475.json
    supporting_text: Fam20C phosphorylates hundreds of secreted proteins
  - reference_id: PMID:19473117
    supporting_text: 'we identified FAM20B as a kinase that

      phosphorylates the xylose residue in the linkage region.'
