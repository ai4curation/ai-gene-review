  description: >-
    Vertebrate soluble cytosolic and nuclear CoA-dependent protein-lysine
    deacetylases (ABHD14B; 210 aa in mammals) carrying a Ser111-Asp162-His188
    triad within a conserved SPSLSGMY nucleophilic elbow. Catalyzes acetyl
    transfer from acetylated protein lysine substrates (including histones) onto
    CoA in vitro to generate acetyl-CoA, acting upstream of glycolysis/TCA flux,
    fasting hepatic glucose homeostasis, and context-dependent transcription
    while direct endogenous protein substrates in vivo remain under
    investigation.
