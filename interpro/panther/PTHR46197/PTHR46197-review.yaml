    physiological catalysis transfers an acetyl group from acetylated protein
    lysine residues onto CoA to yield acetyl-CoA via a ping-pong acyl-transfer
    mechanism (RHEA:45950, EC 2.3.1.-; PMID:31478652), so PAINT should retire or
    replace GO:0016787 at PTN002920773 with GO:0016407 (or a dedicated
    CoA-dependent protein-lysine deacetylase term).
