    gene_review: genes/rat/Abhd14a/Abhd14a-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Unlike soluble cytosolic/nuclear SF2 (ABHD14B), SF1 members carry an
    N-terminal type II transmembrane signal-anchor and lumenal N-glycosylation
    sites that place the catalytic domain in the secretory/Golgi lumen rather
    than the cytosol or nucleus, and differ at key substrate-determining
    sequence positions defined in PMID:37974539. Physiological substrates remain
    unidentified; ABHD14B's KDAC, metabolic, and nuclear transcriptional roles
    must not be transferred to SF1.
  supported_by:
  - reference_id: PMID:37974539
    supporting_text: >-
      Given 
      their high sequence similarity, automated databases often wrongly assign ABHD14A 
      and ABHD14B as the same enzyme, and therefore, annotating functions to them in 
      various organisms has been problematic.
  - reference_id: PMID:42469586
    supporting_text: >-
      Here, we found that the ABHD14A-GFP fusion protein is catalytically active and
      localizes specifically to the Golgi apparatus, suggesting a specialized role in
      the secretory pathway biology.
