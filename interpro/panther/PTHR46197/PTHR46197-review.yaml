  assessment_reason: >-
    PTN002920773 spans only the vertebrate SF2 (ABHD14B) clade and does not
    propagate into SF1 or SF3. Human ABHD14B (CIB) interacts with the TFIID
    subunit TAF1 and activates transcription in reporter assays (PMID:14672934),
    and knockdown in mammalian cells downregulates metabolic gene transcription
    (PMID:35700823), making Euteleostomi SF2 inheritance defensible as a
    non-core/context-dependent downstream effect of its KDAC activity.
  supported_by:
