family_id: PANTHER:PTHR46197
family_name: PROTEIN ABHD14B-LIKE
preferred_name: >-
  ABHD14B CoA-dependent protein-lysine deacetylases and membrane-anchored
  ABHD14A paralogs
summary: >-
  Outlying family of the metabolic alpha/beta-hydrolase superfamily comprising
  three PANTHER subfamilies that diverge sharply in membrane topology,
  subcellular compartment, and biochemical characterization despite sharing a
  compact alpha/beta-hydrolase core and conserved Ser-Asp-His charge-relay
  triad. Subfamily SF2 (ABHD14B, formerly CCG1/TAF(II)250-interacting factor B)
  consists of soluble cytosolic and nuclear vertebrate enzymes (~210 aa; human
  crystal structure PDB:1IMJ; clade PTN002920773 at Euteleostomi) that lack the
  canonical alpha/beta-hydrolase lid excursion and act in vitro and in cellular
  perturbation assays as atypical coenzyme A-dependent protein-lysine
  deacetylases (KDACs): Ser111 transfers an acetyl group from
  N6-acetyl-L-lysyl protein substrates onto CoA via a ping-pong mechanism to
  yield acetyl-CoA and regenerate the free lysine amine (RHEA:45950),
  influencing mammalian central carbon and hepatic glucose metabolism as well as
  chromatin- and minichromosome-linked transcription, while direct endogenous
  protein substrates in vivo remain under active investigation. Subfamily SF1
  (ABHD14A, rodent Dorz1) comprises vertebrate single-pass type II membrane
  paralogs with an N-terminal signal-anchor transmembrane helix and lumenal
  N-glycosylation sites that orient the catalytic domain into the Golgi lumen;
  endogenous substrates remain unknown, though an engineered soluble truncated
  human construct turns over surrogate short-chain p-nitrophenyl esters with CoA
  enhancement in vitro. Subfamily SF3 groups uncharacterized non-vertebrate
  eukaryotic and microbial alpha/beta-hydrolases (including Caenorhabditis
  elegans abhd-14) that diverge in the nucleophilic elbow motif.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  High core fold and catalytic-triad similarity causes automated annotation
  pipelines to conflate soluble nucleocytoplasmic CoA-dependent protein-lysine
  deacetylases in SF2 (ABHD14B) with lumenally oriented type II Golgi-membrane
  paralogs in SF1 (ABHD14A), which lack established physiological substrates or
  KDAC activity (PMID:37974539), and with uncharacterized non-vertebrate SF3
  proteins whose nucleophilic elbow sequence differs from vertebrate ABHD14
  enzymes. In addition, upstream RHEA2GO and Reactome pipelines propagate
  inverted lysine-acetyltransferase (GO:0061733) and PAPS sulfonation
  (GO:0050427) annotations onto SF2 members.
