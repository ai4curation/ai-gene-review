residue_sites:
- site_id: catalytic_triad
  label: Ser111-Asp162-His188 alpha/beta-hydrolase charge-relay triad
  description: >-
    Canonical alpha/beta-hydrolase charge-relay triad resolved in the 2.2 A
    human ABHD14B crystal structure (PDB:1IMJ; PMID:14672934): Ser111 in the
    non-canonical SxSxS (SPSLS, 109-113) nucleophilic elbow attacks the
    N6-acetyl-L-lysyl carbonyl to form an acyl-enzyme intermediate, assisted by
    general base His188 and acid Asp162, before transferring the acetyl group to
    CoA. Site-directed mutagenesis S111A abolishes fluorophosphonate-rhodamine
    activity-based probe labeling and acetyl-CoA formation from acetyl-lysine
    peptides and histones (PMID:31478652). Note the family-level specificity
    caveat: SF1 (human ABHD14A Q9BUJ0 Ser171-Asp222-His249) and SF3 (C. elegans
    Q9N366 Ser145-Asp193-His220) also retain the Ser-Asp-His triad, so an intact
    triad is necessary for acyl-enzyme catalysis (strength CONTRIBUTES) but not
    sufficient to confer ABHD14B's CoA-dependent protein-lysine deacetylase
    specificity (PMID:37974539).
