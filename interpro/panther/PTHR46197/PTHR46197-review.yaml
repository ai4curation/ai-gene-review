term_assessments:
- assessed_term:
    id: GO:0016407
    label: acetyltransferase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Physiological CoA-dependent acetyl transfer from N6-acetyl-L-lysyl protein
    residues onto CoA to produce acetyl-CoA (RHEA:45950, EC 2.3.1.-) is
    established in vitro and in cells for vertebrate SF2 (ABHD14B;
    PMID:31478652, PMID:40658808). In SF1 (ABHD14A), CoA-enhanced turnover has
    only been observed in vitro on the artificial ester p-nitrophenyl acetate
    using an engineered N-terminally truncated construct with no known
    physiological substrate (PMID:42469586), and SF3 is uncharacterized.
