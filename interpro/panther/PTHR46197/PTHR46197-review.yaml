- subfamily_id: PANTHER:PTHR46197:SF1
  label: PROTEIN ABHD14A
  description: >-
    Vertebrate single-pass type II membrane paralogs (ABHD14A; rodent Dorz1)
    featuring an N-terminal signal-anchor transmembrane helix and lumenal
