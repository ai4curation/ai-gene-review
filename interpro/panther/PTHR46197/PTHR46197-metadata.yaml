  name:
    name: AB hydrolase domain-containing protein ABHD14
    short: ABHD14_domain-containing
  description:
  - text: This family of proteins is part of the AB hydrolase superfamily and includes
      members with a potential role in granule neuron development. Some members are
      characterized by an atypical protein-lysine deacetylase activity in vitro, catalyzing
      the deacetylation of lysine residues using CoA as a substrate. This reaction
      results in the production of acetyl-CoA and the free amine of protein-lysine
      residues. The in vivo confirmation of this activity remains to be established.
      Additionally, these proteins exhibit hydrolase activity towards various surrogate
      p-nitrophenyl substrates, with a preference for pNp-acetate. This enzymatic
      function may be involved in transcriptional activation.
