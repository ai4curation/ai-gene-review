family_id: PANTHER:PTHR10556
family_name: 3-OXO-5-ALPHA-STEROID 4-DEHYDROGENASE
preferred_name: Steroid 5-alpha reductase / trans-2-enoyl-CoA reductase family (SRD5A, TECR)
summary: >-
  Polytopic ER membrane NADPH-dependent reductases. Two activities sit in separate subfamilies: steroid
  5-alpha-reductases (SRD5A1, SRD5A2, plant DET2), which reduce testosterone and other 3-oxo-delta4
  steroids; and very-long-chain enoyl-CoA reductases (S. cerevisiae TSC13, S. pombe tsc13, human
  TECR, Arabidopsis ECR), the fourth step of each fatty-acid elongation cycle.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Steroid 5-alpha-reductase activity is confined to SF37, SF57, SF43 and SF53; enoyl-CoA reductase
  activity to SF28 and SF31.
