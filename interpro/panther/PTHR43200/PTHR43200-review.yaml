notes: >-
  Reference protein: PP_3157 is the only PTHR43200 member with a gene review in this repository
  (no UniProt file in genes/ other than PP_3157's carries PTHR43200). It is used because the
  histidine_biosynthesis module grounds its IMPase-like HisN variant on it. Its gene review accepts
  histidinol-phosphatase activity on TIGR02067 membership and the HisN motif signatures, although
  the activity has not been assayed. The best-characterized
  HisN members, C. glutamicum HisN (Q8NS80) and Arabidopsis HISN7 (Q6NPM8), and the PAP
  phosphatase MET22 (P32179) have no gene review here. Leaf membership of the PAINT nodes was
  checked with QuickGO IBA rows whose with/from is the node (PTN000465393: 323 gene products;
  PTN000465401: 296; PTN002456026: 103 in the current IBA set). PP_3157 and C. glutamicum HisN are
  not among the PTN000465393 IBA leaves in that set. They receive GO:0000105 by TreeGrafter.
  Bacterial CysQ (E. coli P22255) and SuhB (E. coli P0ADG4) PAP and inositol monophosphatases sit
  in the separate families PTHR43028 and PTHR20854. panther.obo lists 11 further PTHR43200
  subfamilies with no reviewed members; they are not assessed. The module's family anchor for this
  step (NCBIfam TIGR02067) is more specific than any PANTHER id and should stay.
