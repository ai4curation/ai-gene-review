family_id: PANTHER:PTHR43200
family_name: PHOSPHATASE
preferred_name: Inositol-monophosphatase-like PAP phosphatase and HisN histidinol-phosphatase family
summary: >-
  A branch of the Mg2+-dependent, Li+-sensitive inositol monophosphatase (FIG) superfamily that
  holds two functionally distinct groups of phosphomonoesterases. The first is the
  3'(2'),5'-bisphosphate nucleotidases (PAP/PAPS phosphatases): S. cerevisiae MET22/HAL2,
  S. pombe tol1, Arabidopsis SAL1-SAL4 and AHL, rice RHL and Entamoeba EHI_193350. They hydrolyse
  adenosine 3',5'-bisphosphate (PAP) and PAPS, removing the end product of sulfate transfer, and
  several also hydrolyse inositol polyphosphates. The second is the IMPase-like histidinol-phosphate
  phosphatases (HisN). These carry out the eighth step of histidine biosynthesis: hydrolysis of
  L-histidinol phosphate to L-histidinol. Examples are Corynebacterium glutamicum HisN, Arabidopsis
  HISN7/IMPL2 and, by family model and motif analysis (not assayed), Pseudomonas putida PP_3157. PANTHER places both groups in
  SF6. PAINT separates them as sister clades: PTN000465401 for the eukaryotic PAP phosphatases and
  PTN000465393 for HisN. Only generic phosphoric ester hydrolase activity is asserted at the family
  root.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrate specificity diverges between PAP/PAPS nucleotidases and histidinol-phosphate
  phosphatases. The split does not follow PANTHER subfamilies: SF6 contains both MET22-type PAP
  phosphatases and HisN enzymes (C. glutamicum HisN Q8NS80, Arabidopsis HISN7 Q6NPM8,
  P. putida PP_3157). The C. glutamicum genome alone has several IMPase-like paralogs, and only
  some of them have histidinol-phosphatase activity. Specificity has to be judged by PAINT clade,
  by the TIGR02067 HisN model, or by the HisN sequence motifs. Subfamily membership does not decide
  it.
