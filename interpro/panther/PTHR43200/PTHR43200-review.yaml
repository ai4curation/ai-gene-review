- node_id: PANTHER:PTN000465393
  asserted_term:
    id: GO:0000105
    label: L-histidine biosynthetic process
  evidence: IBD
  paint_snapshot: '20190319'
  seeds:
  - id: AGI_LocusCode:AT4G39120
  - id: UniProtKB:Q9K4B1
  assessment: SOUND
  assessment_reason: >-
    The IMPase-like HisN clade. Its seeds are Arabidopsis HISN7/IMPL2, whose null mutant is
    rescued by histidine and which complements a Streptomyces hisN mutant, and S. coelicolor HisN
    (SCO5208). About two thirds of the leaves that inherit the IBA are named hisN, and they include
    plant HISN7 orthologs. P. putida PP_3157 and C. glutamicum HisN receive GO:0000105 through
    TreeGrafter grafting below this clade. Caveats: UniProt now classifies the Q9K4B1 seed in
    PTHR20854 (INOSITOL MONOPHOSPHATASE) rather than this family, though the AT4G39120 seed stands
