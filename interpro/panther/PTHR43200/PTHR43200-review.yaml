    motif analysis, which separates HisN from the CysQ, SuhB and ImpA paralogs.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43200/PTHR43200-paint.tsv
    supporting_text: "PTHR43200\tPTN000465393\tGO:0000105\tP\tIBD\tfalse"
  - reference_id: PMID:20023146
    supporting_text: >-
      Heterologous expression of IMPL2, but not the related IMPL1 protein, was sufficient to
      rescue the His auxotrophy of a Streptomyces coelicolor hisN mutant.
  - reference_id: PMID:17851715
    supporting_text: >-
      All these results show that S. coelicolor SCO5208, recently renamed hisN, is the HolPase
      involved in histidine biosynthesis.
term_assessments:
- assessed_term:
    id: GO:0042578
    label: phosphoric ester hydrolase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Asserted at the family root (PTN002456026), and true of both the PAP phosphatases and the
    HisN enzymes. It is generic, so specific activities must come from the clade-level
    assessments below.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43200/PTHR43200-paint.tsv
    supporting_text: "PTHR43200\tPTN002456026\tGO:0042578\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0004401
    label: histidinol-phosphatase activity
  scope: UNRESOLVED
  scope_reason: >-
    The histidine_biosynthesis module asserts this activity for the IMPase-like HisN variant,
    grounded on NCBIfam TIGR02067 with PP_3157 as representative. The activity is shown for
    C. glutamicum HisN (SF6), Arabidopsis HISN7 (SF6), S. coelicolor HisN (now classified in
    PTHR20854) and further Dietzia and Zymomonas HisN orthologs. It belongs to the PAINT HisN clade
    PTN000465393, not to a PANTHER subfamily. SF6 also holds the eleven reviewed MET22-type PAP
    phosphatases, for which no histidinol-phosphatase activity is reported, and the other
    subfamilies hold only PAP phosphatases. No subfamily scope is therefore correct. Membership
    is best judged by TIGR02067 and the HisN motif 5 (a conserved aspartate with aromatic
    residues), which experimentally separate HisN from IMPase-like paralogs without the activity.
    PP_3157 scores above the TIGR02067 trusted cutoff and carries the motif-5 and motif-6 HisN
    signatures, so its gene review accepts histidinol-phosphatase activity and histidine biosynthesis;
    it has not been assayed.
  supported_by:
  - reference_id: PMID:28720084
    supporting_text: >-
      The six sequence motifs and the HMMs presented in this study can be used to reliably
      differentiate between IMPase-like HolPases and IMPase-like proteins with no such activity
  - reference_id: PMID:28720084
    supporting_text: >-
      Out of four hisN homologs present in the genome of C. glutamicum (impA, suhB, cysQ, and
      cg0911), only cg0911 encodes an enzyme with HolPase activity.
  - reference_id: PMID:20023146
    supporting_text: >-
      a member of the IMP family from Arabidopsis (Arabidopsis thaliana), myoinositol
      monophosphatase-like2 (IMPL2; encoded by At4g39120), has histidinol-phosphate phosphatase
      activity.
  - reference_id: file:genes/PSEPK/PP_3157/PP_3157-uniprot.txt
    supporting_text: NCBIfam; TIGR02067; his_9_HisN; 1.
- assessed_term:
    id: GO:0000105
    label: L-histidine biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    Follows the histidinol-phosphatase activity. The PAINT node PTN000465393 that asserts it is
    sound for the HisN clade, but that clade does not match any PANTHER subfamily: it shares SF6
    with the PAP phosphatases, which work in sulfate assimilation. Applicability is decided by
    clade or TIGR02067 membership, not by subfamily.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43200/PTHR43200-paint.tsv
    supporting_text: "PTHR43200\tPTN000465393\tGO:0000105\tP\tIBD\tfalse"
  - reference_id: PMID:16901339
    supporting_text: >-
      IS6100-based transposon vector identified the last unknown gene in the histidine
      biosynthesis pathway.
- assessed_term:
    id: GO:0008441
    label: 3'(2'),5'-bisphosphate nucleotidase activity
  scope: UNRESOLVED
  scope_reason: >-
    The PAP/PAPS nucleotidase activity is sound for the PAINT clade PTN000465401, and every
    reviewed member of SF4, SF11, SF12 and SF24 is a PAP phosphatase. SF6 mixes PAP phosphatases
    with HisN enzymes, and HISN7, the one HisN with a broad substrate panel, acts on inositol and
    galactose monophosphates and histidinol phosphate, not PAP. The bacterial subfamilies have no
    reviewed members. The activity therefore cannot be scoped by subfamily.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43200/PTHR43200-paint.tsv
    supporting_text: "PTHR43200\tPTN000465401\tGO:0008441\tF\tIBD\tfalse"
  - reference_id: PMID:7809627
    supporting_text: >-
      HAL2 encodes a 3'(2')5'-bisphosphate nucleotidase that serves to remove the end products of
      sulfate transfer during cellular metabolism.
- assessed_term:
    id: GO:0000103
    label: sulfate assimilation
  scope: UNRESOLVED
  scope_reason: >-
    Descends with the PAP phosphatase clade (PTN000465401), which is not coextensive with any
    subfamily. HisN members of SF6 have no role in sulfate assimilation.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43200/PTHR43200-paint.tsv
    supporting_text: "PTHR43200\tPTN000465401\tGO:0000103\tP\tIBD\tfalse"
