  assessment: SOUND
  assessment_reason: >-
    The PAP phosphatase clade. It is seeded by six experimentally characterized PAP/PAPS
    nucleotidases from yeasts, Arabidopsis and Entamoeba. All reviewed SF6, SF11, SF12, SF24 and
    SF4 PAP phosphatases fall in it. The HisN enzymes do not: HISN7 (AT4G39120) and the HisN
