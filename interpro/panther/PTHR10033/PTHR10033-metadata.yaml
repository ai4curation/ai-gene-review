  name:
    name: Calsequestrin
    short: Calsequestrin
  description:
  - text: This family of proteins serves as high-capacity, moderate affinity calcium-binding
      components that act as internal calcium stores in muscle tissue. They play a
      crucial role in the regulation of muscle contraction by binding calcium ions
      at the protein surface, particularly at subunit interfaces. Members of this
      family can bind a significant number of calcium ions, which are essential for
      triggering the release of lumenal calcium through the ryanodine receptor channels
      RYR1 or RYR2. This release is a key step in excitation-contraction coupling,
      a process fundamental to muscle contraction. Additionally, these proteins are
      involved in the regulation of the heart's rhythm by modulating the rate of heartbeats
      and have a role in negatively regulating store-operated calcium entry.
