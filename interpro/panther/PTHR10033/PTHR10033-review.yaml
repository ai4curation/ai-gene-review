family_id: PANTHER:PTHR10033
family_name: CALSEQUESTRIN
preferred_name: Calsequestrin family
summary: >-
  Acidic, calcium-binding luminal proteins that form high-capacity calcium
  reservoirs in sarcoplasmic reticulum. The local reviewed-protein inventory is
  almost entirely vertebrate calsequestrin-1 (skeletal muscle, SF14) and
  calsequestrin-2 (cardiac muscle, SF15), with a short dog CASQ1 fragment as the
  only truncated reviewed outlier.
functional_coherence: COHERENT
coherence_reason: >-
  CASQ1 and CASQ2 share calcium binding, calcium sequestration,
  calcium-dependent polymerization and SR-luminal localization. PAINT separates
  the principal contractile process by paralog: skeletal-muscle release
  regulation for CASQ1 and cardiac release regulation for CASQ2.
