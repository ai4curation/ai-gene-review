family_id: PANTHER:PTHR11098
family_name: NICOTINATE PHOSPHORIBOSYLTRANSFERASE
preferred_name: Nicotinate phosphoribosyltransferase (PncB/NPT1/NAPRT) family
summary: >-
  Nicotinate phosphoribosyltransferases make nicotinate mononucleotide from nicotinate and PRPP,
  coupled to ATP hydrolysis, in the Preiss-Handler NAD salvage route. The family contains bacterial
  PncB, S. cerevisiae NPT1, S. pombe SPAC1486.06 and human NAPRT.
functional_coherence: COHERENT
coherence_reason: All subfamilies are nicotinate phosphoribosyltransferases.
