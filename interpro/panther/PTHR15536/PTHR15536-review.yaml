family_id: PANTHER:PTHR15536
family_name: TACHYKININ-3
preferred_name: Neurokinin B precursors (vertebrate TAC3/tac3)
summary: >-
  PTHR15536 holds the vertebrate tachykinin-3 (TAC3/tac3) gene products, the secreted
  precursors of neurokinin B (NKB, neuromedin K). Every member is a short
  signal-peptide-bearing precursor that is cleaved at flanking dibasic sites and
  C-terminally amidated to release a tachykinin carrying the family's defining
  C-terminal Phe-Xaa-Gly-Leu-Met-amide motif, which is what activates the tachykinin
  (neurokinin) receptors of PTHR46925. The peptide's preferred receptor is the
  neurokinin-3 receptor (NK3R, TACR3), but it is a full agonist of all three
  vertebrate tachykinin receptors with different affinities, so ligand-specificity
  claims at family level should be stated as preference rather than exclusivity. The
  single PANTHER subfamily PTHR15536:SF1 covers the whole family, and the molecular
  function (receptor ligand activity), the secreted location and the tachykinin
  receptor signaling pathway are shared by all members. Organismal roles are not:
  the hypothalamic role in gonadotropin release that dominates the mammalian
  literature (biallelic TAC3 loss causes congenital hypogonadotropic hypogonadism in
  humans) is not reproduced by zebrafish tac3a/tac3b knockouts, and the teleost
  precursor yields a second tachykinin, neurokinin F, that mammals do not have.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The molecular-function, cellular-component and pathway terms are safe family-wide:
  all members are secreted precursors of an amidated Phe-Xaa-Gly-Leu-Met tachykinin
  that activates tachykinin receptors, and the NKB-encoding region is the most
  conserved part of the precursor from mammals to teleosts. The exceptions are
  downstream and organismal. The teleost tac3 precursor encodes two tachykinins (NKB
  plus neurokinin F) where the mammalian precursor encodes one, and zebrafish tac3a
  and tac3b single and double mutants have unimpaired spermatogenesis and
  folliculogenesis, so reproductive-process terms that are well supported in mammals
  must not be propagated across the family. Blood-pressure regulation, the one
  process PAINT does propagate here, rests on a single rat agonist-pharmacology
  annotation and is assessed as unsupported at the node.
