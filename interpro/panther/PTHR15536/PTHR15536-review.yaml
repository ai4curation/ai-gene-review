      pressor responses
  - reference_id: PMID:10866201
    supporting_text: In female rats, concentrations of NKB several-fold above that of
      an animal 20 days into pregnancy caused substantial pressor activity.
  - reference_id: file:human/TAC3/TAC3-ai-review.yaml
    supporting_text: there is no loss-of-function or physiological evidence that endogenous
      human NKB raises blood pressure, and patients lacking NKB have no reported blood-pressure
      phenotype
term_assessments:
- assessed_term:
    id: GO:0048018
    label: receptor ligand activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member is the precursor of an amidated tachykinin whose conserved
    C-terminal Phe-Xaa-Gly-Leu-Met motif is what activates a tachykinin receptor.
    Human NKB activates NK3R in a structure-plus-signalling study, and the synthetic
    zebrafish peptides activate zebrafish Tac3 receptors, so the activity is
    demonstrated at both ends of the family's span rather than inferred from
    mammals alone.
  supported_by:
  - reference_id: PMID:37391393
    supporting_text: NKB, SP, and NKA are 10–11 amino acid linear peptides that share
      a conserved C-terminal motif, -Phe-Xaa-Gly-Leu-Met-NH2, which mediates neurokinin
      receptor activation
  - reference_id: PMID:22689988
    supporting_text: The synthetic zebrafish peptides (NKBa, NKBb, and NKF) activated
      Tac3 receptors via both PKC/Ca(2+) and PKA/cAMP signal-transduction pathways in
      vitro.
  - reference_id: PMID:22689988
    supporting_text: High identity was found among different fish species in the region
      encoding the NKB; all shared the common C-terminal sequence.
- assessed_term:
    id: GO:0005576
    label: extracellular region
  scope: FAMILY_WIDE
  scope_reason: >-
    All members are signal-peptide-bearing secretory precursors whose mature peptide
    acts on cell-surface receptors; UniProt records the human and mouse proteins as
    secreted, and nothing in the family is a membrane or intracellular protein.
  supported_by:
  - reference_id: file:human/TAC3/TAC3-uniprot.txt
    supporting_text: 'SUBCELLULAR LOCATION: Secreted.'
  - reference_id: file:mouse/Tac2/Tac2-uniprot.txt
    supporting_text: 'SUBCELLULAR LOCATION: Secreted.'
- assessed_term:
    id: GO:0007217
    label: tachykinin receptor signaling pathway
  scope: FAMILY_WIDE
  scope_reason: >-
    The family's shared molecular job is to supply the ligand that initiates this
    pathway, and the ligand-encoding region is the most conserved part of the
    precursor across the family's span. The term is the genus of the pathway and
    makes no claim about which receptor subtype or which transducer is engaged.
  supported_by:
  - reference_id: PMID:37391393
    supporting_text: NKB, SP, and NKA are 10–11 amino acid linear peptides that share
      a conserved C-terminal motif, -Phe-Xaa-Gly-Leu-Met-NH2, which mediates neurokinin
      receptor activation
  - reference_id: PMID:22689988
    supporting_text: High identity was found among different fish species in the region
      encoding the NKB; all shared the common C-terminal sequence.
- assessed_term:
    id: GO:0007209
    label: phospholipase C-activating tachykinin receptor signaling pathway
  scope: FAMILY_WIDE
  scope_reason: >-
    The phospholipase C route is the canonical transduction of the receptor the
    family's peptide prefers, and it is demonstrated at both ends of the family:
    human NKB activating NK3R through Gq with an inositol-phosphate readout, and the
    zebrafish peptides activating zebrafish Tac3 receptors through PKC and calcium.
    The same zebrafish experiment also activated the PKA and cAMP route, so this
    term is the main but not the only pathway the peptide initiates, which is why
    the adenylate-cyclase pathway is assessed separately below.
  supported_by:
  - reference_id: file:human/TACR3/TACR3-uniprot.txt
    supporting_text: Neuromedin-K binding to its receptor triggers G protein-coupled
      receptor signaling via activation of G(q) and phosphatidylinositol hydrolysis by
      phospholipase C
  - reference_id: PMID:22689988
    supporting_text: The synthetic zebrafish peptides (NKBa, NKBb, and NKF) activated
      Tac3 receptors via both PKC/Ca(2+) and PKA/cAMP signal-transduction pathways in
      vitro.
- assessed_term:
    id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  scope: UNRESOLVED
  scope_reason: >-
    A real but secondary route. Zebrafish Tac3 receptors are activated by the
    zebrafish peptides through PKA and cAMP as well as through PKC and calcium, so
    the claim is not a modelling artefact; but on the mammalian side UniProt records
    the cyclase route for the receptor only by similarity, and the mammalian gene
    reviews in this repository keep the corresponding rows as non-core. Whether every
    member engages this route, and in which cells, is not established, so the term is
    left unresolved rather than granted family-wide.
  supported_by:
  - reference_id: PMID:22689988
    supporting_text: The synthetic zebrafish peptides (NKBa, NKBb, and NKF) activated
      Tac3 receptors via both PKC/Ca(2+) and PKA/cAMP signal-transduction pathways in
      vitro.
  - reference_id: file:human/TACR3/TACR3-uniprot.txt
    supporting_text: Neuromedin-K binding also triggers signaling via activation of adenylate
      cyclase activity which results in increased intracellular levels of cyclic AMP (cAMP)
      (By similarity).
- assessed_term:
    id: GO:0031836
    label: neuromedin K receptor binding
  scope: FAMILY_WIDE
  scope_reason: >-
    The family's peptide binds the neuromedin K (NK3) receptor, and this is the
    informative receptor-binding statement for it: NK3R is its preferred receptor,
    and the interaction is resolved structurally for the human pair. The term must
    not be read as exclusive. The same peptide is a full agonist of the other two
    vertebrate tachykinin receptors with lower affinity, and in mouse the excitation
    of arcuate kisspeptin neurons by endogenous NKB is blocked completely only by a
    cocktail of antagonists against all three receptors, so a review that states
    NK3R selectivity should state it as preference. One provenance caveat for anyone
    propagating this term: the human TAC3 entry no longer carries it, so the rodent
    orthology-based rows now cite a source annotation that has gone, while the claim
    itself remains supported in mouse.
  supported_by:
  - reference_id: PMID:37391393
    supporting_text: The endogenous peptide agonist neurokinin B (NKB) preferentially
      activates NK3R, while substance P (SP) binds preferentially to NK1R.
  - reference_id: PMID:37391393
    supporting_text: These peptides can function through three different G protein-coupled
      receptors (GPCRs), neurokinin 1 receptor (NK1R), neurokinin 2 receptor (NK2R),
      and NK3R
  - reference_id: PMID:23744641
    supporting_text: the activation of kisspeptin neurons by NKB was only blocked completely
      by a cocktail of antagonists against all 3 tachykinin receptors
- assessed_term:
    id: GO:0033686
    label: positive regulation of luteinizing hormone secretion
  scope: UNRESOLVED
  scope_reason: >-
    This is the family's best-known mammalian role and the one most likely to be
    propagated wrongly. In mammals it is strongly supported, including by human
    loss-of-function genetics, and the human and mouse reviews in this repository
    both carry it. In teleosts the picture divides: injected zebrafish NKBa and
    neurokinin F do raise luteinizing hormone, but zebrafish tac3a and tac3b single
    and double mutants have unimpaired spermatogenesis and folliculogenesis, which
    the authors read as compensation rather than as a role. A family-wide grant would
    assert a requirement the knockout contradicts, and the family's single subfamily
    cannot express a mammal-only scope, so the term is left unresolved at family
    level and should be annotated per member. PAINT does not currently propagate it,
    which is the right state.
  supported_by:
  - reference_id: PMID:22689988
    supporting_text: a single intraperitoneal injection of NKBa and NKF significantly
      increased leuteinizing hormone levels in mature female zebrafish
  - reference_id: PMID:34181932
    supporting_text: spermatogenesis and folliculogenesis were not impaired in tac3a-/-,
      tac3b-/- and tac3a-/-;tac3b-/- mutant lines
  - reference_id: PMID:34181932
    supporting_text: our results indicate that mutation of tac3 genes do not disrupt
      the reproduction in zebrafish unlike in mammals
- assessed_term:
    id: GO:0045777
    label: positive regulation of blood pressure
  scope: UNRESOLVED
  scope_reason: >-
    The only primary data in the family are central agonist pharmacology in rats and
    a supraphysiological infusion in the same species, so the family review disputes
    the ancestral placement rather than the rat annotation itself. Whether any member
    regulates blood pressure as part of its endogenous function is undecided here:
    the human and mouse reviews judge the descended row an over-annotation, and no
    loss-of-function or physiological evidence exists in any member. If the node is
    retired as recommended above, the rat annotation is the only claim left, which is
    the correct scope for the present evidence.
  supported_by:
  - reference_id: PMID:2478257
    supporting_text: blockade of peripheral vascular vasopressin receptors reduced these
      pressor responses
  - reference_id: PMID:10866201
    supporting_text: In female rats, concentrations of NKB several-fold above that of
      an animal 20 days into pregnancy caused substantial pressor activity.
- assessed_term:
    id: GO:0001659
    label: temperature homeostasis
  scope: UNRESOLVED
  scope_reason: >-
    Recorded because both mammalian gene reviews in this repository add it and a
    reader of this family will meet it. The evidence is mammalian, and nothing in
    the family has been tested outside mammals, so it is not a family-level claim.
    It is also not propagated by PAINT. A conserved tachykinin-like thermal role
