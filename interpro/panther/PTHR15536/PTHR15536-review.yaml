node_assessments:
- node_id: PANTHER:PTN002694376
  asserted_term:
    id: GO:0045777
    label: positive regulation of blood pressure
  evidence: IBD
  negated: false
  node_taxon:
    id: NCBITaxon:117571
    label: Euteleostomi
  paint_snapshot: '20190726'
  seeds:
  - id: RGD:3809
    gene_symbol: Tac3
    organism: Rattus norvegicus
  assessment: WRONG_NODE
  assessment_reason: >-
    This is the family's only PAINT row, and it is the root of the whole family, so a
    pressor role descends to every TAC3 gene product from mammals to teleosts. It
    rests on one seed, rat Tac3, whose annotation comes from injecting the synthetic
    NK3 agonists senktide and [Pro7]-neurokinin B into the lateral brain ventricle of
    normotensive rats; the pressor response was reduced by blockade of peripheral
    vascular vasopressin receptors, so what the experiment shows is that activating
    central NK3 receptors can raise blood pressure through vasopressin release, not
    that the endogenous Tac3 gene product participates in blood-pressure regulation.
    The only other pressor observation in the family, in the same species, needed NKB
    concentrations several-fold above late-pregnancy levels. With a single seed of
    that kind and no supporting observation in any other member, there is no
    descendant evidence from which an ancestral gain can be inferred, and no narrower
    node is supported either, because the rat leaf already carries its own
    experimental annotation. The recommendation is therefore to retire the IBD and
    leave the rat IDA standing on its own; this review does not dispute that
    annotation, which it has not re-read in full text. Tachykinins are vasoactive as
    a family and the claim is not asserted to be false; it is the ancestral
    placement that the evidence does not reach. The human TAC3 and mouse Tac2 reviews
    independently mark the descended row an over-annotation, so retiring the node
    agrees with both.
  proposed_action:
    paint_action: REMOVE_IBD
  affected_subfamilies:
  - id: PANTHER:PTHR15536:SF1
    label: TACHYKININ-3
  supported_by:
  - reference_id: file:interpro/panther/PTHR15536/PTHR15536-paint.tsv
