review_status: NEEDS_REVIEW
reviewed_by: claude-code
review_date: '2026-11-14'
notes: >-
  Scope and method. The family has exactly one PAINT row, GO:0045777 at the root node
  PTN002694376, and it is assessed above; there are no IRD or IKR rows. That the row
  is the only one, and that PTN002694376 is the clade of the whole family and of its
  single subfamily, was established from the committed PAINT slice and from PANTHER's
  own reference-proteome tree for the family as resolved by this repository's
  ai_gene_review.etl.panther_trees loader, whose cache is not committed; the tree has
  twenty leaves, all vertebrate TAC3 orthologs spanning human to zebrafish and the
  spotted gar, which is consistent with the Euteleostomi taxon PAINT records on the
  row. No residue site is curated: the family's functional determinant is a short
  amidated C-terminal motif that is intact in every member examined, and no member's
  function is in question on residue grounds.

  One disagreement with the gene reviews, recorded rather than acted on. The human
  TAC3 and mouse Tac2 reviews both mark the descended GO:0045777 row an
  over-annotation, which agrees with the negative verdict here, but each also states
  that the ancestral node placement is reasonable. With the whole tree in view this
  review takes the stronger position that a single seed resting on central agonist
  pharmacology cannot support an ancestral gain at all, and recommends retiring the
  IBD. No gene review was changed; a curator who prefers the milder reading would
  downgrade the verdict here rather than in those files.

  A provenance observation that belongs with the family rather than with any one
  member. The mouse Tac2 review found that three of its orthology-based rows, for
  neuromedin K receptor binding, substance K receptor binding and positive regulation
  of flagellated sperm motility, cite human TAC3 annotations that no longer exist in
  the human entry. The claims are judged on their own merits in that review. For this
  family the consequence is that the ligand-side receptor-binding terms currently have
  no human anchor, while the receptor-side sperm-motility term is still propagated by
  PAINT in PTHR46925, where it is assessed in that family's review.
