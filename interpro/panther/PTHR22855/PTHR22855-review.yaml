    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    In the PANTHER 19 tree this node subtends 131 of the 137 leaves, spanning eukaryotes and bacteria,
    including P. aeruginosa LiuB and M. tuberculosis AccD1, and it contains subfamilies SF13, SF45 and
    SF47 but not SF46. The seeds are animal, but the bacterial LiuB below the node has its own direct
    MCC enzymology (PMID:18469096), so the function is ancestral to the bacterial and eukaryotic MCC
    beta lineages and the placement is supported. Reviewed recipients (MCCC2, LiuB, MccB) all retain
    the activity. GcdA is not a leaf of the reference tree and is placed in SF13 by HMM; it would receive
    the term through TreeGrafter, which is a member-level over-annotation risk rather than a node placement
    error.
