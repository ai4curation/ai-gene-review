family_id: PANTHER:PTHR22855
family_name: ACETYL, PROPIONYL, PYRUVATE, AND GLUTACONYL CARBOXYLASE-RELATED
preferred_name: Biotin-dependent acyl-CoA carboxyltransferase family (MCC beta and relatives)
summary: >-
  Carboxyltransferase (CT) subunits of biotin-dependent acyl-CoA carboxylases and decarboxylases, built
  from two crotonase-fold CT domains whose active site lies at a dimer interface. The reviewed members
  are the beta subunits of 3-methylcrotonyl-CoA carboxylase (MCC) from human (MCCC2), Pseudomonas
  aeruginosa (LiuB) and Pseudomonas putida (MccB), which transfer the carboxyl group from the alpha-subunit
  carboxybiotin to 3-methylcrotonyl-CoA in leucine catabolism. The family also holds the Mycobacterium
  tuberculosis AccD1 and AccD2 beta subunits, the Bacillus subtilis carboxylase YngE, and the glutaconyl-CoA
  decarboxylase alpha subunit GcdA of Acidaminococcus fermentans, which acts in the opposite direction
  as part of a sodium-pumping decarboxylase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The CT fold and biotin-dependent carboxyl transfer are common to the family, and its dominant clade
  (the PAINT node PTN000523406, 131 of 137 tree leaves) is the MCC beta subunit, conserved from bacteria
  to plants and animals. The acyl-CoA substrate and reaction direction are not uniform: GcdA, classified
  in the same SF13 as MCCC2, decarboxylates glutaconyl-CoA rather than carboxylating methylcrotonyl-CoA,
  and the M. tuberculosis AccD paralogs pair with different alpha subunits. Subfamily SF13 therefore does
  not by itself guarantee MCC activity.
