  label: METHYLCROTONOYL-COA CARBOXYLASE BETA CHAIN, MITOCHONDRIAL
  description: >-
    The MCC beta (carboxyltransferase) subfamily of eukaryotes and bacteria, including human MCCC2,
    P. aeruginosa LiuB and P. putida MccB, all three with MCC activity that is either measured (MCCC2,
    LiuB) or inferred from the conserved liu cluster (MccB). It also contains GcdA, the carboxyltransferase
    subunit of glutaconyl-CoA decarboxylase, and the uncharacterized B. subtilis YngE, so the leucine-pathway
    function is a member-level property within SF13 rather than a subfamily-wide one.
