  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for the MCC beta subunits of SF13 that pair with an MCC alpha subunit (MCCC2, LiuB, MccB);
    leucine_catabolism selects SF13 gated by this function. Not family-wide, because SF46 paralogs are
    uncharacterized, and not automatic for every SF13 member, because GcdA in SF13 is a glutaconyl-CoA
    decarboxylase.
