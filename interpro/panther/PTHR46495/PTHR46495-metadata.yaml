  name:
    name: Dual Specificity Phosphatase
    short: DSP
  description:
  - text: This family of proteins includes dual specificity phosphatases that are
      involved in the dephosphorylation of MAPK peptides. Members exhibit a preference
      for phosphotyrosine and diphosphorylated forms over phosphothreonine. These
      enzymes are capable of acting on both single and diphosphorylated substrates,
      indicating a role in the regulation of MAPK signaling pathways. Some family
      members have been shown to dephosphorylate p-nitrophenyl phosphate (pNPP) in
      vitro, suggesting a broader substrate specificity. The activity of these phosphatases
      can be modulated by metal ions such as manganese and may be inhibited by certain
      chemicals like iodoacetic acid.
