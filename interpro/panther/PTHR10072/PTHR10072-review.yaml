family_id: PANTHER:PTHR10072
family_name: IRON-SULFUR CLUSTER ASSEMBLY PROTEIN
preferred_name: A-type iron-sulfur cluster carrier family (IscA/SufA/ISCA1)
summary: >-
  Small A-type carrier proteins (HesB/YadR/YfhF domain) with a C-terminal
  Cys-X-Cys motif plus a third conserved cysteine that bind iron or [2Fe-2S] clusters
  and deliver clusters to acceptor apoproteins, in particular in the late maturation of
  [4Fe-4S] proteins. The family contains proteobacterial IscA and its mitochondrial
  descendants ISCA1/ISA1 (SF41), the Suf-system carrier SufA (SF47), and a small
  plant ISCA-like 3 group (SF60). Whether a given A-type protein acts mainly as an iron
  donor, an alternative scaffold or a downstream cluster carrier is still debated.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Iron/[2Fe-2S] binding and cluster delivery are shared by the characterized IscA,
  SufA and ISCA1 members; the plant ISCA-like 3 subfamily (SF60) is uncharacterized,
  and the precise in vivo step performed by A-type carriers is not settled.
