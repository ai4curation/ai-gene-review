- assessed_term:
    id: GO:0004635
    label: phosphoribosyl-AMP cyclohydrolase activity
  scope: UNRESOLVED
  scope_reason: >-
    Not a property of this family's histidinol dehydrogenase domain. The activity is carried only
    by the six fungal trifunctional HIS4 proteins in SF2, whose N-terminal PRA-CH region (PF01502;
    HIS4 residues 1-229) catalyses it, as shown for S. cerevisiae HIS4. The other 217 reviewed SF2
    members, and SF13 and SF14, lack that domain. Applicability is decided by domain architecture,
    which no PANTHER subfamily separates, so the term cannot be scoped to a subfamily; PAINT
    asserts it at no node in this family. The activity is assessed at family level in PTHR42945,
    the PRA-CH/PRA-PH family, where S. cerevisiae HIS4 itself is not classified.
  supported_by:
  - reference_id: PMID:379004
    supporting_text: >-
      Monospecific antibody prepared against the 95,000 protein removed all three of the
      activities specified by his4 from solution
  - reference_id: file:genes/yeast/HIS4/HIS4-uniprot.txt
    supporting_text: In the C-terminal section; belongs to the histidinol dehydrogenase family.
- assessed_term:
    id: GO:0004636
    label: phosphoribosyl-ATP diphosphatase activity
  scope: UNRESOLVED
  scope_reason: >-
    As for the cyclohydrolase: carried only by the PRA-PH region (PF01503; HIS4 residues 230-312)
    of the six fungal trifunctional HIS4 proteins in SF2, not by the histidinol dehydrogenase
    domain that defines the family, and not by the monofunctional HisD, his2, HisCD, SF13 or SF14
    members. Domain architecture, not subfamily, decides it, and PAINT asserts it at no node here.
  supported_by:
  - reference_id: PMID:379004
    supporting_text: >-
      Monospecific antibody prepared against the 95,000 protein removed all three of the
      activities specified by his4 from solution
  - reference_id: file:genes/SCHPO/his2/his2-uniprot.txt
    supporting_text: >-
      In contrast to other fungi who have a single histidine biosynthesis trifunctional protein, 2
      proteins are present in S.pombe to ensure these functions: his7 (phosphoribosyl-AMP
      cyclohydrolase and phosphoribosyl-ATP pyrophosphatase activities) and his2 (histidinol
      dehydrogenase activity).
