family_id: PANTHER:PTHR21256
family_name: HISTIDINOL DEHYDROGENASE  HDH
preferred_name: Histidinol dehydrogenase (HisD/HIS4 C-terminal domain) family
summary: >-
  Zinc- and NAD-dependent dehydrogenases of the histidinol dehydrogenase fold (Pfam PF00815). The
  large subfamily SF2 holds the histidinol dehydrogenases that catalyse the last step of histidine
  biosynthesis, the two sequential oxidations of L-histidinol through L-histidinaldehyde to
  L-histidine: monofunctional bacterial and plant HisD (Pseudomonas putida hisD, Escherichia coli
  hisD, Arabidopsis HISN8), the monofunctional Schizosaccharomyces pombe his2, the fungal
  trifunctional HIS4 proteins that carry N-terminal phosphoribosyl-AMP cyclohydrolase (HisI) and
  phosphoribosyl-ATP pyrophosphohydrolase (HisE) regions in front of the HisD domain, and a
  Photorhabdus HisCD fusion with a histidinol-phosphate aminotransferase domain. SF13 is a plant
  chloroplastic histidinol dehydrogenase. SF14 is a divergent group of HisD-fold paralogs that
  includes the sulfopropanediol 3-dehydrogenases (HpsN), the oryzine-cluster enzyme oryD and
  uncharacterized homologs; it is not a histidinol dehydrogenase subfamily despite its PANTHER name.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Of the 231 reviewed members in the entries inventory, 223 are in SF2 and 1 in SF13, all named as
  histidinol dehydrogenases or histidine-biosynthesis fusion proteins apart from five SF2 paralogs
  that UniProt names histidinol dehydrogenase homologs because they have lost zinc-ligand or
  active-site residues. The seven SF14 members are HisD-fold paralogs with other substrates (two
  HpsN sulfopropanediol 3-dehydrogenases, oryD) or no known function. The fused HisI and HisE
  activities of the six fungal trifunctional HIS4 proteins are properties of those extra domains,
  not of the family.
reference_protein:
  id: UniProtKB:Q9P777
  label: Histidinol dehydrogenase
  gene_symbol: his2
  organism: Schizosaccharomyces pombe
  gene_review: genes/SCHPO/his2/his2-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR21256:SF2
  label: HISTIDINE BIOSYNTHESIS TRIFUNCTIONAL PROTEIN
  description: >-
    Histidinol dehydrogenases of all architectures. Despite the PANTHER name, 216 of the 223
    reviewed members carry only the histidinol dehydrogenase domain (Pfam PF00815), six are fungal
    trifunctional HIS4 proteins that also carry PRA-CH (PF01502) and PRA-PH (PF01503) domains
    (S. cerevisiae HIS4, Saccharomyces bayanus HIS4, Kluyveromyces lactis HIS4, Candida albicans
    HIS4, Komagataella pastoris HIS4, Neurospora crassa his-3), and one is the Photorhabdus HisCD
    fusion that adds an aminotransferase domain (PF00155), per the members' UniProt Pfam
    cross-references. The subfamily therefore does not separate the monofunctional and
    trifunctional architectures. It also contains five histidinol dehydrogenase homologs that have
    lost zinc-binding or active-site residues (Synechocystis slr0682, Cereibacter sphaeroides
    RHOS4_07400, Colwellia psychrerythraea CPS_2061, Sinorhizobium meliloti RA0212, Mesorhizobium
    japonicum mlr7107), each from an organism that also has a canonical SF2 hisD.
  representative_members:
  - id: UniProtKB:Q9P777
    gene_symbol: his2
    organism: Schizosaccharomyces pombe
    gene_review: genes/SCHPO/his2/his2-ai-review.yaml
  - id: UniProtKB:P00815
    gene_symbol: HIS4
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/HIS4/HIS4-ai-review.yaml
  - id: UniProtKB:P59400
    gene_symbol: hisD
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/hisD/hisD-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: file:genes/SCHPO/his2/his2-uniprot.txt
    supporting_text: >-
      Catalyzes the sequential NAD-dependent oxidations of L-histidinol to L-histidinaldehyde and
      then to L-histidine.
  - reference_id: PMID:379004
    supporting_text: >-
      These three activities co-purify with a single protein which has a subunit molecular weight
      of 95,000 (95,000 protein)
- subfamily_id: PANTHER:PTHR21256:SF13
  label: HISTIDINOL DEHYDROGENASE, CHLOROPLASTIC
  description: >-
    Plant chloroplastic histidinol dehydrogenase; the single reviewed member is Brassica oleracea
    HDH (P24226). Other plant chloroplastic HDHs (Arabidopsis HISN8, rice HDH) are classified in
    SF2.
  representative_members:
  - id: UniProtKB:P24226
    gene_symbol: HDH
    organism: Brassica oleracea var. capitata
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR21256:SF14
  label: HISTIDINOL DEHYDROGENASE
  description: >-
    Divergent HisD-fold paralogs that are not histidinol dehydrogenases, despite the PANTHER
    name. Reviewed members are the sulfopropanediol 3-dehydrogenases HpsN of Cupriavidus
    pinatubonensis (Q46N53, experimentally characterized) and Ruegeria pomeroyi (Q5LVV1), the
    Aspergillus oryzae oryzine biosynthetic-cluster enzyme oryD (P9WEZ5), and four uncharacterized
    histidinol dehydrogenase homologs (Pelagibacter SAR11_0801, Ruegeria SPO0981, Shouchella
    ABC1168, Mesorhizobium mlr6649).
  representative_members:
  - id: UniProtKB:Q46N53
    gene_symbol: hpsN
    organism: Cupriavidus pinatubonensis JMP 134
  - id: UniProtKB:P9WEZ5
    gene_symbol: oryD
    organism: Aspergillus oryzae RIB 40
  diverged_from_family: true
  supported_by:
