notes: >-
  Member counts and domain architectures were derived from the entries inventory (231 reviewed
  members: SF2 223, SF14 7, SF13 1) and the members' UniProt Pfam cross-references queried on
  2026-11-10. PAINT recipients were read from PANTHER's leaf IBA file
  (gene_association.paint_uniprot.gaf) and node-to-subfamily placement from
  PAINT_TreeGrafter_Annotations_TOTAL.txt: PTN000479095 is the family root (AN0) with 109 leaf
  recipients (SF2 104, SF14 3, SF13 2), and PTN000479119 is AN149 with 30 SF2 recipients. The
  histidine_biosynthesis module grounds the monofunctional and trifunctional histidinol
  dehydrogenase variants with InterPro rather than this family, because SF2 holds both
  architectures.
