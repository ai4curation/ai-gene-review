    supporting_text: >-
      Catalyzes the NAD-dependent oxidation of (R)-2,3-dihydroxypropane-1-sulfonate to
      (R)-3-sulfolactate.
  - reference_id: UniProtKB:P9WEZ5
    supporting_text: >-
      Histidinol dehydrogenase homolog; part of the gene cluster that mediates the biosynthesis of
      oryzines, natural products with an unusual maleidride backbone
