  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    PTN001452348 is the amniote AQP6 clade (10 leaves, 10 organisms, no duplication below it), sister of
    amniote AQP5 at duplication PTN008567823. The oocyte assays on AQP6 itself disagree: human AQP6 raised
    osmotic water permeability in a mercurial-sensitive manner (PMID:8812490), rat AQP6 had low basal water
    permeability that Hg2+ raised (PMID:10647010), and a comparison of AQP0 to AQP9 found no channel-specific
    water permeability for AQP6 (PMID:23485707). What decides the row is a clade-wide sequence change with a
    tested effect. All 10 leaves have Asn at the alignment column of rat AQP6 Asn60, where 208 of the other
    221 leaves have Gly, and rat AQP6 N60G loses anion permeability and gains water permeability. So the
    lineage diverged from a water channel towards a gated anion channel at exactly this node, and stopping
    the inherited term here is right. The IRD only blocks inheritance: the direct experimental rows on human
    and rat AQP6, positive and negative, stay as they are. This replaces the earlier UNRESOLVED verdict,
    which weighed the three oocyte studies without the alignment.
