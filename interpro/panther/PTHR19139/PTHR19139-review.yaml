family_id: PANTHER:PTHR19139
family_name: AQUAPORIN TRANSPORTER
preferred_name: Aquaporins (major intrinsic protein family)
summary: >-
  PTHR19139 is the aquaporin family of channels with the NPA-motif hourglass fold. Most members conduct
  water, and some (aquaglyceroporins) also conduct glycerol and other small solutes. AQP6 is unusual:
  it sits in intracellular vesicles of renal intercalated cells, has low basal water permeability, and
  conducts anions when activated by low pH or mercury.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Water or small-solute channel activity is the family function, but AQP6 departs from it: its water permeability
  is low or not detectable, and it behaves as a pH-gated anion channel.
