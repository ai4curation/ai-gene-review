notes: >-
  Re-review of 2026-11-26 against primary data. Tree: PANTHER 19.0 treeinfo for PTHR19139 (231 leaves, 144
  speciation, 44 duplication and 2 horizontal-transfer nodes). Alignment: PANTHER's own family alignment
  (familymsa, 421 rows of 1869 columns: the 231 leaves plus ancestral reconstructions). Residue numbers
  are those of the named UniProt entry; each anchor row of the alignment was checked to equal the UniProt
  sequence (human AQP1 P29972 version 3, bovine AQP1 P47865 version 3, rat AQP6 Q9WTY0 version 1) before
  any column was read, and residues of other proteins are their own numbering at the same alignment column.
  Experimental annotations of the leaves were taken from QuickGO by term id with descendants; every query
  returned its UniProtKB seed leaves. The script tree_msa_check.py regenerates
  PTHR19139-tree-msa-check.txt, which holds the per-node leaf, taxon, subfamily, residue and annotation
  tables behind the statements above.
  All 26 PAINT rows on nodes of this tree are assessed. Seven rows of the cached PAINT slice are not, because
  their nodes are not in the PTHR19139 tree of release 19.0: PTN002318122 is a node of PTHR45665,
  PTN002904267 of PTHR45687 and PTN002906184 of PTHR45724 (the plant TIP, PIP and NIP families and their
  relatives), where they belong to those families' reviews. For the same reason the family's InterPro
  member list (entries.csv), which still includes S. cerevisiae Aqy1 and Aqy2, is wider than the release
  19.0 tree.
  Queries for source databases, not asserted as errors. (1) FlyBase gives Drip, Eglp2 and Eglp4 both apical
  and basolateral plasma membrane from PMID:31907321; the full text, read here without its figures,
  assigns each protein to one membrane. (2) GeneDB gives Leishmania major Q4Q2F7 water channel activity
  by direct assay from PMID:15294911, whose abstract describes Trypanosoma brucei proteins; only the abstract
  was read. UniProt also cross-references Q4Q2F7 to PTHR45724 while the release 19.0 tree has it as a
  PTHR19139 leaf. (3) PANTHER names subfamily SF289, three Xenopus AQP4-like leaves, ARGININE--TRNA LIGASE,
  CYTOPLASMIC.
  Not verified: the human AQP1 paper behind the hyperosmotic response seed (PMID:11922632) and the first
  human AQP6 cloning paper (PMID:8812490) were read as abstracts only; most cited papers other than
  PMID:20149227, 26183829, 30025131 and 31907321 were available as abstracts only; AQP0 localisation in
  lens fibre cells was not examined; no review of the family's deep evolution was located with a verified
  identifier, so the evolutionary statements rest on the tree itself and on PMID:26183829 and PMID:20149227.
