- site_id: aqp6_asn60
  label: AQP6 helix-crossing asparagine
  description: >-
    Asn60 of rat AQP6, at the contact point of transmembrane helices 2 and 5 where other aquaporins have
    Gly (Gly57 of human AQP1 in the source paper). Read from the PANTHER 19.0 family alignment, whose rat
    AQP6 row is identical to UniProt Q9WTY0 sequence version 1: Asn in all 10 leaves of the AQP6 clade
    (human AQP6 N63) and in no other leaf; Gly in 208 of the remaining 221 leaves.
  anchor:
    id: UniProtKB:Q9WTY0
    label: Aquaporin-6
    gene_symbol: Aqp6
    organism: Rattus norvegicus
  anchor_sequence_version: 1
  site_source: LITERATURE
  residues:
  - position: 60
    expected: [N]
    role: Asn at the helix 2 / helix 5 crossing; Gly in water-selective aquaporins
  required_for:
  - term:
      id: GO:0061797
      label: pH-gated chloride channel activity
    strength: REQUIRED
    rationale: >-
      Replacing the asparagine with the glycine of other aquaporins (N60G) abolishes the anion permeability
      of rat AQP6 and raises its water permeability.
    supported_by:
    - reference_id: PMID:15671159
      supporting_text: >-
        Here we show that a single residue substitution (N60G in rat AQP6) totally eliminates the anion
        permeability of AQP6 when expressed in Xenopus oocytes, but the N60G oocytes exhibit significantly
        higher osmotic water permeability under basal conditions.
    - reference_id: PMID:15671159
      supporting_text: >-
        Uniquely, all known mammalian orthologs of AQP6 have an asparagine residue (Asn-60) at the position
        corresponding to Gly-57.
