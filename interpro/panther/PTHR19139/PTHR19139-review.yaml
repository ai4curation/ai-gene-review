family_id: PANTHER:PTHR19139
family_name: AQUAPORIN TRANSPORTER
preferred_name: Orthodox aquaporins (AqpZ, AQP0, AQP1, AQP2, AQP4, AQP5, AQP6, insect Drip/Prip/Eglp and Big brain)
summary: >-
  PTHR19139 in PANTHER 19.0 is the orthodox (water-selective type) branch of the major intrinsic protein
  superfamily: bacterial AqpZ, fungal Aqy1-like channels, a few protist and charophyte/bryophyte members,
  and in animals the AQP0, AQP1, AQP2, AQP4, AQP5 and AQP6 lineages of vertebrates and the Drip, Prip,
  entomoglyceroporin (Eglp) and Big brain lineages of arthropods. The tree has 231 leaves from 56 organisms.
  The aquaglyceroporins, AQP8, the plant PIP, TIP and NIP channels, yeast and nematode aquaporins are in
  other PANTHER families (PTHR43829, PTHR45665, PTHR45687, PTHR45724), so the tree has no Arabidopsis,
  rice, S. cerevisiae, S. pombe or C. elegans leaf. Most members are water channels with two Asn-Pro-Ala
  motifs and a Phe/His/(Cys or Ala)/Arg aromatic/arginine constriction. Three lineages depart from this:
  AQP6 is an intracellular, pH-gated anion channel that carries Asn where every other lineage has Gly;
  insect entomoglyceroporins have replaced the constriction histidine and conduct glycerol and urea; and
  Big brain lacks the constriction Phe and His, conducts cations in oocytes and shows at most limited
  water permeability.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Water channel activity at the plasma membrane is the ancestral family function and is measured in bacteria
  (E. coli AqpZ), fungi (C. albicans Aqy1), insects (Drip, Prip, Eglp2) and every vertebrate lineage. The
  exceptions are three identified clades: AQP6 (amniote clade PTN001452348; anion channel in intracellular
  vesicles), Big brain (PTN009035945; cation conductance, cell adhesion) and the dipteran entomoglyceroporins
  (inside PTN002709559; glycerol and urea channels, of which Drosophila Eglp4 carries no water). PAINT already
  stops the water terms at the first two. Terms beyond water transport (gas, glycerol and ammonia permeation,
  membrane polarity) are lineage-specific and should not be read as family functions.
