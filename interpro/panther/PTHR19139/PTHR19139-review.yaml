  assessment: UNRESOLVED
  assessment_reason: >-
    PTN001452348 is the amniote AQP6 clade (10 leaves, SF113). The assays disagree. Human AQP6 (as hKID)
    raised oocyte osmotic water permeability in a mercurial-sensitive manner (PMID:8812490); rat AQP6
    had low basal water permeability that Hg2+ raised (PMID:10647010); a later comparison of AQP0-9 found
    no measurable channel-specific water permeability for AQP6 (PMID:23485707). PAINT also places IBDs
    for nitrate transport and pH-gated chloride channel activity on this node, consistent with AQP6 being
    mainly an anion channel. Whether its gated water permeability is a function or a side effect is not
    settled.
