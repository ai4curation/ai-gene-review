    label: PTN007668488 (ancestral IBD node; IKR source)
  paint_snapshot: '20250903'
  node_taxon:
    id: NCBITaxon:7955
    label: Danio rerio
  assessment: LOSS_CONTRADICTED
  proposed_action:
    paint_action: REMOVE_LOSS
  assessment_reason: >-
    PTN000440779 is a single leaf, zebrafish Aqp0b (mip2, Q4ZJI3), the teleost-specific duplicate of Aqp0a.
    The loss rests on one study in which full-length Aqp0b did not raise water permeability in oocytes or
    yeast, although an N-terminally tagged form did. A second study measured increased oocyte water
    permeability for every zebrafish aquaporin except Aqp11b and Aqp12, Aqp0b included, and later work
    reports that Aqp0b permeability rises at acidic pH. An IKR claims a loss readable from key residues, and
    the alignment shows none: Aqp0b has both Asn-Pro-Ala motifs and the same four constriction residues as
    zebrafish Aqp0a and human AQP0 (F48, H172, A181, R187). PAINT also gives this leaf water transmembrane
    transporter activity, the parent term, so the leaf is asserted to move water but not as a channel, which
    is not a coherent reading for an aquaporin. The experimental disagreement is real and is recorded on the
    leaf by ZFIN's own NOT row; it does not need a phylogenetic loss on top of it.
