residue_sites:
- site_id: npa_motifs
  label: Asn-Pro-Ala motifs of the pore half-helices
  description: >-
    The two Asn-Pro-Ala motifs of human AQP1 (76-78 and 192-194), read from the PANTHER 19.0 family
    alignment, whose human AQP1 row is identical to UniProt P29972 sequence version 3. Both motifs are intact
    in 183 of 231 leaves, including all AQP6 and Big brain leaves, so the motifs alone do not separate the
    water channels from the diverged lineages. The site is recorded as associated with, not required for,
    water channel activity: several measured water channels of the family have a variant second motif.
  anchor: *aqp1
  anchor_sequence_version: 3
  site_source: UNIPROT_FEATURE
  residues:
  - position: 76
    expected: [N]
    role: Asn of the first Asn-Pro-Ala motif
  - position: 77
    expected: [P]
    role: Pro of the first Asn-Pro-Ala motif
  - position: 78
    expected: [A]
    role: Ala of the first Asn-Pro-Ala motif
  - position: 192
    expected: [N]
    role: Asn of the second Asn-Pro-Ala motif
  - position: 193
    expected: [P]
    role: Pro of the second Asn-Pro-Ala motif
  - position: 194
