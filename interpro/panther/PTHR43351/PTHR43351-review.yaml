family_id: PANTHER:PTHR43351
family_name: L(+)-TARTRATE DEHYDRATASE SUBUNIT BETA
preferred_name: Iron-sulfur hydro-lyase (TtdB / class I fumarase C-terminal-type) family
summary: >-
  [4Fe-4S]-dependent hydro-lyases sharing the TtdB-type catalytic domain. SF3 holds the beta
  subunits of the heterodimeric L(+)-tartrate dehydratase (E. coli TtdB), which act together with
  a separate TtdA alpha subunit. SF2 holds single-chain class I fumarases in which the TtdA- and
  TtdB-type domains are fused (Geobacillus FumA, P. putida PP_0897). These are the oxygen-labile,
  iron-sulfur fumarate hydratases (EC 4.2.1.2) that interconvert fumarate and (S)-malate in the
  TCA cycle. They are unrelated to the iron-independent class II fumarases of PTHR11444.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are Fe-S hydro-lyases on dicarboxylic acids, but the substrate (L-tartrate versus
  fumarate/L-malate) and quaternary arrangement (heterodimer subunit versus fused single chain)
  differ between SF3 and SF2.
