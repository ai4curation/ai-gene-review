family_id: PANTHER:PTHR43250
family_name: EXODEOXYRIBONUCLEASE III
preferred_name: Exonuclease III (XthA/ExoA) AP endonuclease family
summary: Bacterial exonuclease III-type AP endonucleases of the EEP (exonuclease/endonuclease/phosphatase)
  fold. The catalytic members, typified by E. coli XthA, incise DNA 5' to abasic sites, remove 3'-blocking
  groups and have dsDNA 3'-5' exonuclease activity in base-excision repair. The family also contains the
  Pseudomonadaceae catabolite repression control protein Crc, which keeps the fold but has lost the catalytic
  residues and acts as a co-repressor of Hfq.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Catalytic AP endonuclease/exonuclease function holds for XthA-type members, but Crc
  orthologs in the Pseudomonadaceae are inactive pseudoenzymes with a different, post-transcriptional
  regulatory role. Crc and XthA fall in the same PANTHER subfamily (SF2), so the exception cannot be expressed
  as a subfamily and is recorded as a member exception.
