  name:
    name: Type IV secretion system ATPases
    short: TypeIV_secretion_ATPase
  description:
  - text: The GSP E family proteins are involved in various types of bacterial secretion
      systems and pilus functions. They act as ATPases, providing energy through ATP
      hydrolysis for processes such as protein export, DNA transfer to plants, and
      pilus retraction. These proteins are key components of type IV secretion systems,
      which are major virulence determinants in pathogenic bacteria, affecting host
      cell functions and contributing to bacterial survival, colonization, and pathogenesis.
      They also play roles in biofilm maturation and twitching motility, which are
      forms of surface-associated movements facilitated by type IV pili. The family
      includes proteins like VirB11, which are essential for pathogenesis and intracellular
      survival, and PilT, which is involved in pilus retraction and host cell adhesion.
