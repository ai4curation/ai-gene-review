family_id: PANTHER:PTHR42282
family_name: PANTOATE KINASE-RELATED
preferred_name: Archaeal pantoate kinase (PoK)
summary: >-
  PTHR42282 is the archaeal pantoate kinase (PoK) family of GHMP kinases. PoK phosphorylates
  (R)-pantoate to (R)-4-phosphopantoate, the first step of the route most archaea use to make
  4'-phosphopantothenate. Phosphopantothenate synthetase (PTHR40695) then adds beta-alanine, so
  archaea need neither pantothenate synthetase nor pantothenate kinase. The family-defining enzyme is
  Thermococcus kodakarensis TK2141. It prefers pantoate (seven-fold higher Vmax) to pantothenate, uses
  ATP, GTP, UTP or CTP, and depends on Ser104, Glu134 and Asp143 for activity.
functional_coherence: COHERENT
coherence_reason: >-
  The parsed entries file holds three reviewed entries, all in PTHR42282:SF1 (PANTOATE KINASE) and all
  named pantoate kinase, from Thermococcus kodakarensis, Methanocaldococcus jannaschii and
  Methanospirillum hungatei. Only the T. kodakarensis enzyme has been characterized. The others are
  assigned through the shared HAMAP rule and conserved neighbourhood with PPS, and no divergent
  member is known.
reference_protein:
  id: UniProtKB:Q5JHF1
  label: Pantoate kinase
  gene_symbol: TK2141
  organism: Thermococcus kodakarensis
  gene_review: genes/THEKO/TK2141/TK2141-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR42282:SF1
  label: PANTOATE KINASE
  description: >-
    The only subfamily. It holds T. kodakarensis PoK (Q5JHF1) and the M. jannaschii (Q58379) and M.
    hungatei (Q2FUB2) homologues. The coenzyme_a_biosynthesis module uses it as the selector for the
    archaeal pantoate kinase step.
  representative_members:
  - id: UniProtKB:Q5JHF1
    label: Pantoate kinase
    gene_symbol: TK2141
    organism: Thermococcus kodakarensis
  diverged_from_family: false
node_assessments: []
term_assessments:
- assessed_term:
    id: GO:0016301
    label: kinase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    GO has no term for pantoate kinase activity (EC 2.7.1.169, RHEA:28246), so GO:0016301 is the closest
    existing molecular-function term. The T. kodakarensis gene review proposes the missing term. The
    specific activity is shown for TK2141 and assigned to the other members by HAMAP MF_02223.
  supported_by:
  - reference_id: PMID:19666462
    supporting_text: V(max) values were 7-fold higher toward pantoate, indicating that TK2141 encoded a novel enzyme, pantoate kinase (PoK).
- assessed_term:
    id: GO:0015937
    label: coenzyme A biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    PoK and PPS together convert pantoate to 4'-phosphopantothenate in archaea that lack PanK activity.
  supported_by:
  - reference_id: PMID:19666462
    supporting_text: When we examined the cell-free extracts of the hyperthermophilic archaeon Thermococcus kodakaraensis, PanK activity could not be detected.
