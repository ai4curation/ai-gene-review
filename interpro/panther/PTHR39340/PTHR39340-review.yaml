term_assessments:
- assessed_term:
    id: GO:0061595
    label: 6-deoxy-6-sulfofructose-1-phosphate aldolase activity
  scope: UNRESOLVED
  scope_reason: >-
    True for the five YihT members, not established for the 42 LacD members, and PANTHER's only subfamily
    (SF1) contains both groups, so no subfamily scope can be stated. A residue-determined scope based on
    the YihT sulfonate pocket (Arg253 and the phosphate-binding Ser226/Ser227 of Salmonella YihT, PMID:33791429)
    is plausible but has not been curated as a residue site here; until then the term should be carried
    by the YihT clade node or the HAMAP SFP_aldolase rule (MF_01912), not by family or SF1 membership.
  supported_by:
  - reference_id: PMID:33791429
    supporting_text: These residues are conserved across annotated SFP aldolases and are proposed to comprise
      a sulfonate binding pocket that defines this subclass of enzymes (Figure S23).
  - reference_id: PMID:37838169
    supporting_text: YihT is inactive on the structurally related glycolytic intermediate fructose bisphosphate
      (FBP), showing that YihT can discriminate between sulfoglycolytic and glycolytic/gluconeogenic intermediates
      (11).
- assessed_term:
    id: GO:0016829
    label: lyase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterized member, YihT and LacD alike, is a class I aldolase that cleaves a ketose bisphosphate
    or phosphate by retro-aldol (carbon-carbon lyase) chemistry.
  supported_by:
  - reference_id: PMID:37838169
    supporting_text: The SFP aldolase (YihT) encoded by the E. coli sulfo-EMP cluster is a class I aldolase,
      which catalyzes the reaction via a Schiff base intermediate formed with an active site lysine (11).
  - reference_id: PMID:21192932
    supporting_text: Staphylococcus aureus LacD, a Class I tagatose-1,6-bisphosphate (TBP) aldolase
