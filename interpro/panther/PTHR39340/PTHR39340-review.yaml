  assessment_reason: >-
    The single seed, E. coli YihT, is a correct SFP aldolase (PMID:24463506; Salmonella ortholog assayed
    and structurally characterized, PMID:33791429), but the node is placed at Bacteria and covers the Firmicutes
    LacD tagatose-1,6-bisphosphate aldolases. QuickGO (checked 2026-11-10) shows GO:0061595 IBA from PTN002217485
    on Staphylococcus aureus LacD (P0A011) and Streptococcus pneumoniae LacD (Q8DPP2), whose characterized
    function is tagatose-1,6-bisphosphate cleavage in the lactose tagatose 6-phosphate pathway (PMID:1655695,
    PMID:21192932); no SFP activity or sulfoglycolytic gene context is reported for them. The activity
    belongs on the enterobacterial YihT clade, not at this node. SF1 cannot be pruned as a whole, because
    it holds both groups.
