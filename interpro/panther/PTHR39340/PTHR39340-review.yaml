family_id: PANTHER:PTHR39340
family_name: SULFOFRUCTOSEPHOSPHATE ALDOLASE
preferred_name: LacD-type class I aldolases (YihT sulfofructose-1-phosphate aldolase and LacD tagatose-1,6-bisphosphate
  aldolase)
summary: >-
  Bacterial class I (Schiff-base) aldolases of the (alpha/beta)8-barrel DeoC/LacD fold. Two functional
  groups are present among the 47 reviewed members of the local inventory, all of which PANTHER places in
  the single subfamily SF1: five enterobacterial YihT sulfofructose-1-phosphate (SFP) aldolases (E. coli
  K-12 and O157:H7, two Salmonella, Shigella), which split SFP into dihydroxyacetone phosphate and
  sulfolactaldehyde in sulfoglycolysis, and 42 Firmicutes LacD tagatose-1,6-bisphosphate aldolases of the
  lactose/galactose tagatose 6-phosphate pathway (Staphylococcus, Streptococcus, Enterococcus, Listeria,
  Lactococcus). YihT is inactive on fructose 1,6-bisphosphate and carries a sulfonate-binding pocket, whereas
  Staphylococcus aureus LacD cleaves several hexose 1,6-bisphosphates.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The Schiff-base aldol-cleavage chemistry is shared, but the substrates differ: YihT acts on the sulfosugar
  phosphate SFP in sulfoquinovose catabolism, LacD on tagatose 1,6-bisphosphate (and related hexose bisphosphates)
  in lactose and galactose catabolism. PANTHER's only subfamily, SF1, contains both groups despite its name,
  so neither the family nor SF1 implies SFP aldolase activity.
