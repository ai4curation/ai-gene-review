  name:
    name: Eukaryotic initiation factor 2B subunits alpha/beta/delta
    short: eIF2B_alpha/beta/delta
  description:
  - text: This family of proteins includes eukaryotic initiation factor 2B (eIF2B)
      subunits alpha, beta, and delta. These proteins form part of the eIF2B complex,
      which is essential for protein synthesis initiation. The complex catalyzes the
      exchange of GDP for GTP on the eIF2 gamma subunit, a critical step in the formation
      of the pre-initiation complex. The activity of these proteins is regulated by
      the phosphorylation state of the eIF2 alpha subunit; phosphorylation represses
      their guanine nucleotide exchange factor activity, thereby reducing the availability
      of initiator methionyl-tRNA to the ribosome and controlling global protein synthesis.
      Certain conditions, such as the integrated stress response, can modulate the
      activity of these proteins through specific inhibitors like ISRIB, which can
      stimulate their activity irrespective of the phosphorylation state of eIF2.
