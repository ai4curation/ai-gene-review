family_id: PANTHER:PTHR12216
family_name: UROCANATE HYDRATASE
preferred_name: Urocanase (urocanate hydratase) family
summary: >-
  Single-function family of NAD(+)-dependent urocanate hydratases (urocanase,
  EC 4.2.1.49), the second enzyme of histidine catabolism, which hydrates
  trans-urocanate to 4-imidazolone-5-propanoate. Each subunit binds one tightly
  held NAD(+) that acts as an electrophile rather than as a redox coenzyme.
  PANTHER splits the family into a bacterial subfamily (SF4; Pseudomonas and
  Bacillus HutU) and a eukaryotic subfamily (SF3; human, mouse, nematode and
  Dictyostelium UROC1), and both subfamilies carry the same name and
  activity.
functional_coherence: COHERENT
coherence_reason: >-
  Every member of the committed inventory is named urocanate hydratase or
  probable urocanate hydratase, the two subfamilies differ by lineage rather
  than function, and a single PAINT node at the family root carries both the
  activity and the process, seeded from bacteria (B. subtilis, P.
  aeruginosa) and human. Human UROC1 patient alleles that reduce enzyme
  activity cause urocanic aciduria, grounding the activity in the eukaryotic
  subfamily as well.
