notes: >-
  Modules: aps_dependent_assimilatory_sulfate_reduction (SF109 MET10/met10 in the Met10/Met5
  variant; also SF128 CysJ in the CysJ/CysI variant), ergosterol_biosynthesis (SF17, NCP1/ccr1,
  GO:0003958), homocysteine_metabolism (whole family PTHR19384 for MTRR, GO:0030586). The
  homocysteine module's family-level selector is the inconsistency: it should be SF84. The
  aps module's MET10 description (no FMN motifs, FMN domain on MET5) agrees with this review and
  with the MET10/met10 gene reviews. NCP1 gene review IBAs are still PENDING. NOS1-3 are in
  PTHR19384 in the PANTHER tree behind the PAINT data (subfamilies SF56/63/66/76), but their
  current UniProt PANTHER cross-reference is PTHR43410 (NITRIC OXIDE SYNTHASE OXYGENASE), so they
  are absent from the entries file. Inheritance of PTN002322100 terms by animal CPRs was checked
  in the PAINT UniProt GAF. Pfam architectures of P39692, P47169 and P16435 were checked by
  UniProt REST on 2026-10-06.
