family_id: PANTHER:PTHR19384
family_name: NITRIC OXIDE SYNTHASE-RELATED
preferred_name: NADPH-dependent diflavin oxidoreductases (CPR, MTRR, NDOR1, CysJ/MET10 sulfite reductase flavoproteins, NOS reductase domain)
summary: >-
  Diflavin reductases that pass electrons from NADPH through FAD and FMN to a partner
  acceptor. All share a ferredoxin-NADP reductase-type FAD/NAD(P)-binding module; most also have
  an N-terminal flavodoxin-like FMN domain. The partner defines the function of each lineage:
  NADPH-cytochrome P450 reductase (CPR: human POR, yeast NCP1, S. pombe ccr1, plant ATR/CPR)
  reduces microsomal P450s, squalene epoxidase, heme oxygenase and cytochrome b5; methionine
  synthase reductase (MTRR) reactivates cobalamin-dependent methionine synthase; NDOR1/TAH18
  supplies electrons to the cytosolic iron-sulfur assembly machinery; the bacterial CysJ and the
  fungal MET10 flavoproteins feed the siroheme sulfite reductase (CysI, MET5); bacterial and
  fungal P450-reductase fusions (CYP102, CYP505) reduce their own heme domain. In the PANTHER
  tree the family also includes the reductase moiety of the animal nitric oxide synthases (NOS1-3),
  whose oxygenase domain makes nitric oxide.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  NADPH-dependent flavin-mediated electron transfer and FAD binding are family-wide, but every
  specific activity is lineage-restricted: NADPH-hemoprotein reductase to the CPR subfamilies
  (SF17, SF107, SF111, SF126, SF129), [methionine synthase] reductase to SF84, sulfite reductase
  electron supply to CysJ (SF128) and MET10 (SF109), Fe-S assembly electron supply to NDOR1/TAH18
  (SF10), and nitric oxide synthesis to the NOS subfamilies (SF56, SF63, SF66, SF76). FMN binding
  is not even universal: fungal MET10 (SF109) lacks the flavodoxin-like FMN domain, which in yeast
  sulfite reductase is carried by the MET5 hemoprotein (PTHR11493). A family-level selector
  therefore does not define a molecular function.
