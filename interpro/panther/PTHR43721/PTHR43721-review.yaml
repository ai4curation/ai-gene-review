  eukaryotic delivery step is EEFSEC (SF11) and whose KT2440 bacterial exemplar SelB is
  HMM-classified in SF9. The P23845 (CysN) identification is from the UniProt record of
  that accession, checked against the UniProt REST service on 2026-11-12. The family is
  too broad to be a module family term for SelB; the module uses the InterPro
  selenocysteine-specific elongation factor entry instead.
