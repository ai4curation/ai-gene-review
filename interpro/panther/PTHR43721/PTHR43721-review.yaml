family_id: PANTHER:PTHR43721
family_name: ELONGATION FACTOR TU-RELATED
preferred_name: EF-Tu-type translational GTPases (EF-Tu, EEFSEC, GTPBP1/2)
summary: >-
  A large family of EF-Tu-type translational GTPases (421 tree leaves). It holds the
  bacterial elongation factors EF-Tu (SF23, SF24, SF32), the organellar EF-Tus of
  mitochondria (SF2, SF22, SF36) and chloroplasts (SF5, SF34, SF35), the eukaryotic
  selenocysteine-specific elongation factor EEFSEC (SF11), and the unconventional
  eukaryotic GTPases GTPBP1 (SF9) and GTPBP2 (SF3). Bacterial SelB proteins are split
  by PANTHER: some, such as Pseudomonas putida KT2440 SelB, are HMM-classified here in
  the GTPBP1-named SF9 (without being tree leaves), while E. coli SelB and its close
  relatives are in the eIF2-gamma family PTHR42854. EEFSEC delivers Sec-tRNA(Sec) to
  UGA codons recoded by the SECIS-SECISBP2 complex; EF-Tu delivers the canonical
  aminoacyl-tRNAs.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members are aminoacyl-tRNA-delivering GTPases or close relatives, but they
  deliver different tRNAs in different compartments (cytosolic EF-Tu, mitochondrial
  and chloroplast EF-Tu, Sec-specific EEFSEC and SelB) and the GTPBP1/GTPBP2 branches
  have non-canonical roles; PAINT already marks a loss of elongation-factor activity
  for GTPBP2. Specific functions are safe only at the clade or subfamily level.
