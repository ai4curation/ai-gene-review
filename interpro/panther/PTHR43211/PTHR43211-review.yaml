- assessed_term:
    id: GO:0003824
    label: catalytic activity
  scope: FAMILY_WIDE
  scope_reason: >-
    All members carry the FAH catalytic domain, which supports enzymatic
    activity. The term is uninformative but is as specific as the evidence
    allows, and the FdeI gene reviews accept it without refinement.
  supported_by:
  - reference_id: file:genes/HERSS/Hsero_1011/Hsero_1011-uniprot.txt
    supporting_text: InterPro; IPR011234; Fumarylacetoacetase-like_C.
- assessed_term:
    id: GO:0016831
    label: carboxy-lyase activity
  scope: UNRESOLVED
  scope_reason: >-
    Predicted for the FdeI members from the KEGG R13078 assignment only; no
    family member has been assayed, so the term cannot be scoped to SF1 or to
    the family.
  supported_by:
  - reference_id: file:genes/HERSS/Hsero_1007/Hsero_1007-bioinformatics/RESULTS.md
    supporting_text: 'R13078: 5-Hydroxy-5-(4-hydroxyphenyl)-3-oxopentanoate <=> 4-Hydroxy-4-(4-hydroxyphenyl)-butan-2-one + CO2; KEGG comment: decarboxylation unclear reaction; orthology: K26185  naringenin degradation protein FdeI'
- assessed_term:
    id: GO:0004334
    label: fumarylacetoacetase activity
  scope: UNRESOLVED
  scope_reason: >-
    The PANTHER family name implies fumarylacetoacetate hydrolysis, but no
    member has been shown to have it and the FdeI members are assigned other
    reactions. The name is treated as a fold label, not a function.
  supported_by:
  - reference_id: file:genes/HERSS/Hsero_1011/Hsero_1011-uniprot.txt
    supporting_text: InterPro; IPR011234; Fumarylacetoacetase-like_C.
