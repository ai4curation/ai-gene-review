family_id: PANTHER:PTHR43211
family_name: FUMARYLACETOACETATE HYDROLASE
preferred_name: FAH-fold protein family containing the FdeI flavonoid-degradation proteins
summary: >-
  PTHR43211 is a family of fumarylacetoacetate hydrolase (FAH)-fold proteins
  with an N-terminal FAA_hydro_N domain and the C-terminal FAH catalytic
  domain. The FAH fold supports hydrolase, decarboxylase, isomerase and
  hydratase chemistries, so the PANTHER name does not establish fumarylacetoacetate
  hydrolysis for members. The family contains the FdeI proteins of the fde
  naringenin-degradation locus (Hsero_1011, PP_3205; subfamily SF1), which KEGG
  assigns to a decarboxylation and a dehydration late in the pathway.
functional_coherence: UNKNOWN
coherence_reason: >-
  The family has no Swiss-Prot members (the InterPro fetch returned none, so no
  reviewed-member inventory or PAINT slice exists), and no member has been
  characterized biochemically. Only the FAH-fold catalytic architecture is
  shared with certainty; the reaction or reactions catalysed are unresolved.
