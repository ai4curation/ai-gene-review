  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for the catalytic ketosynthase subfamilies: FabB (SF306), the
    FabF/KAS II, KasA/KasB, OXSM/Cem1 and plastid KAS group (SF336), and the
    small plant KAS and NodE subfamilies. Not safe for the SF322 chain-length
    factors, which lack the active-site cysteine. Within SF336, Bacillus PksF
    (named a malonyl-ACP decarboxylase of bacillaene synthesis) is a likely
    exception that was not adjudicated here because no member review exists. Substrate preference
    (cis-3-decenoyl-ACP for FabB, palmitoleoyl-ACP for FabF) is a member-level
    refinement.
