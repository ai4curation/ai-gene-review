family_id: PANTHER:PTHR11712
family_name: POLYKETIDE SYNTHASE-RELATED
preferred_name: Thiolase-fold beta-ketoacyl-ACP synthases (KAS I/II type) and type II polyketide ketosynthases
summary: >-
  Beta-ketoacyl synthases of the thiolase fold that extend acyl chains by Claisen
  condensation with malonyl-ACP through an active-site cysteine. The family
  holds the elongating condensing enzymes of bacterial, plastid and
  mitochondrial type II fatty acid synthesis: bacterial FabB (KAS I, SF306),
  which elongates the FabA product cis-3-decenoyl-ACP and is required for
  unsaturated fatty acid synthesis in proteobacteria, and the broad SF336 group
  of FabF/KAS II, mycobacterial KasA/KasB, plant KAS I, mitochondrial
  OXSM/Cem1 and Pseudomonas FabY. It also holds the ketosynthase alpha subunits
  of aromatic type II polyketide synthases and, in SF322, their noncatalytic
  chain-length-factor (KS beta) partners. Product length and pathway context
  depend on the enzyme and its biosynthetic partners.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The condensing chemistry (acyl-thioester plus malonyl-ACP to 3-oxoacyl-ACP)
  is shared by the fatty-acid and polyketide ketosynthases across SF306, SF336
  and the small plant and NodE subfamilies. Two groups are exceptions. The SF322
  chain-length factors lack the active-site cysteine and do not condense on
  their own (PMID:14558809). Bacillus PksF, placed in SF336, is a malonyl-ACP
  decarboxylase of bacillaene synthesis rather than a fatty-acid condensing
  enzyme. Chain-length and substrate preference (for example FabB versus FabF
  on cis-3-decenoyl-ACP and palmitoleoyl-ACP) differ between subfamilies and
  are member properties.
