family_id: PANTHER:PTHR11712
family_name: POLYKETIDE SYNTHASE-RELATED
summary: Beta-ketoacyl synthases extend acyl chains by condensation with activated malonyl donors. Related
  enzymes serve bacterial and organellar fatty-acid synthesis as well as specialized polyketide pathways.
  Product length and pathway context depend on the enzyme and its surrounding biosynthetic machinery.
  Related noncatalytic chain-length factors partner with the catalytic ketosynthase in aromatic polyketide
  synthesis.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory includes mitochondrial Cem1, bacterial and plastid fatty-acid ketosynthases,
  and aromatic polyketide synthase alpha and beta components. Experimental chain-length-factor work separates
  the noncatalytic beta component from the condensing enzyme (PMID:14558809). Thus even the shared ketosynthase
  architecture does not confer condensation chemistry on every member. Pombe Cem1 is an SF336 mitochondrial
  fatty-acid-synthesis comparison, not a polyketide antibiotic assignment.
