notes: >-
  Extended from the 2026-09-10 benchmark review to add PAINT node assessments,
  the FabB (SF306) and FabF (SF336) subfamilies used by the unsaturated and
  type II fatty acid synthesis modules, and a SUBFAMILY_ONLY scope for
  GO:0004315 that excludes the SF322 chain-length factors. Subfamily membership
  comes from the PANTHER entries inventory; node seeds and dates from the PAINT
  table. No tree topology beyond the PAINT seeds was inspected, so placement of
  the aromatic KS alpha members inside SF336 is recorded as a scope caveat
  rather than a node verdict.
