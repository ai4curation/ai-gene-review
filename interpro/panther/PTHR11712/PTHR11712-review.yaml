- subfamily_id: PANTHER:PTHR11712:SF336
  label: 3-OXOACYL-[ACYL-CARRIER-PROTEIN] SYNTHASE, MITOCHONDRIAL
  description: >-
    The large subfamily of FabF/KAS II-type condensing enzymes: bacterial FabF
    (E. coli, B. subtilis, S. aureus), mycobacterial KasA and KasB, plant
    plastid KAS I, mitochondrial OXSM and yeast Cem1, Pseudomonas FabY, and the
    catalytic KS alpha subunits of aromatic polyketide synthases. The official
    name says mitochondrial but most members are bacterial. E. coli FabF
    elongates palmitoleoyl-ACP to cis-vaccenoyl-ACP and is responsible for
    thermal regulation of membrane fatty acid composition.
  representative_members:
  - *id001
  - id: UniProtKB:P0AAI5
    label: 3-oxoacyl-[acyl-carrier-protein] synthase 2
    gene_symbol: fabF
    organism: Escherichia coli (strain K12)
    gene_review: genes/ECOLI/fabF/fabF-ai-review.yaml
  - id: UniProtKB:Q88LL4
    label: 3-oxoacyl-[acyl-carrier-protein] synthase 2
    gene_symbol: fabF
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/fabF/fabF-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:237914
    supporting_text: >-
      This finding suggests that synthetase II functions specifically in the elongation of
      palmitoleyl-ACP to form cis-vaccenyl-ACP.
  - reference_id: file:interpro/panther/PTHR11712/PTHR11712-entries.csv
    supporting_text: P0AAI5,3-oxoacyl-[acyl-carrier-protein] synthase 2,protein,83333
- subfamily_id: PANTHER:PTHR11712:SF322
  label: POLYKETIDE BETA-KETOACYL SYNTHASE 2-RELATED
  description: >-
    Chain-length factors (KS beta) of aromatic type II polyketide synthases
    (TcmL, actinorhodin and granaticin ORF2 proteins), which pair with a KS
    alpha subunit from SF336.
  diverged_from_family: true
  divergence_description: >-
    The chain-length factor lacks the active-site cysteine and acts as the
    noncatalytic determinant of polyketide chain length in the KS alpha/beta
    heterodimer, so it does not itself catalyse condensation.
  supported_by:
  - reference_id: PMID:14558809
    supporting_text: 'In contrast to

      homodimeric ketosynthases found in fatty acid synthases, the active site

      cysteine is absent from the one subunit of this heterodimer.'
