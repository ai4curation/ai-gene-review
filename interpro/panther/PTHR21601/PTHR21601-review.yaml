term_assessments:
  - assessed_term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The Spa2 orthologs of both yeast lineages are cortical scaffolds that recruit partner
      proteins to growth sites. Budding-yeast Spa2 binds Msb3/4 and MAPKKs through SHD1, and
      fission-yeast Spa2 binds Pos1 through its CC2 region and uses its SHD to bring the Rab
      GAP Gyp3 to cell tips. This partner-neutral adaptor term is the safe family-wide
      molecular function. The budding-yeast paralog Sph1 is excepted below, because no
      partner-recruitment activity has been shown for it.
    member_exceptions:
      - member:
          id: UniProtKB:Q06160
          label: Protein SPH1
          gene_symbol: SPH1
          organism: Saccharomyces cerevisiae (strain ATCC 204508 / S288c)
          gene_review: genes/yeast/SPH1/SPH1-ai-review.yaml
        exception_reason: >-
          No adaptor or partner-recruitment activity has been demonstrated for Sph1. Its
          two-hybrid MAPKK interactions were not borne out as recruitment in vivo: Slt2 and
          Mkk1 localize normally at bud tips in sph1 deletion cells, whereas they depend on
          Spa2 and Pea2. The SPH1 gene review does not assert the term. This records the
          absence of support for the paralog rather than a demonstrated loss, and it should
          be revisited if an Sph1 partner is shown to depend on it for localization.
        supported_by:
          - reference_id: PMID:23924898
            supporting_text: >-
              The deletion of polarisome gene BUD6, BNI1, or SPH1 did not affect Mkk1p-GFP
              localization at bud tips or bud necks
          - reference_id: PMID:23924898
            supporting_text: >-
              Pea2p and Spa2p are needed to recruit Slt2p to bud tips, and Bni1p, Bud6p, and
              Sph1p affect the level of Slt2p activation.
    supported_by:
      - reference_id: PMID:41527849
        supporting_text: >-
          Here, we identify a short linear motif (SLiM) in the disordered regions of Msb3,
          Msb4, and the MAP kinase kinases Ste7 and Mkk1 that binds the SHD1 domain of Spa2.
      - reference_id: PMID:40931936
        supporting_text: These results indicate that Pos1 binds the Spa2 CC2.
      - reference_id: PMID:40931936
        supporting_text: >-
          We also found that the SHD is used to interface with Gyp3, the Rab GAP for the
          Sec4 homolog Ypt2
      - reference_id: PMID:40931936
        supporting_text: Gyp3–mNG localization to cell tips and division sites was lost in spa2Δ cells
  - assessed_term:
      id: GO:0005078
      label: MAP-kinase scaffold activity
    scope: FAMILY_WIDE
    scope_reason: >-
      True for S. cerevisiae Spa2, which recruits Mkk1 and Mpk1/Slt2 to growth sites. Not
      supported for its paralog Sph1, which binds MAPKKs in two-hybrid assays but does not
      recruit the module, and absent in S. pombe. The lineage boundaries fall inside the
      single subfamily SF0, so they cannot be expressed as SUBFAMILY_ONLY; the scope is
      recorded as FAMILY_WIDE with the two characterized members that lack the activity
      carved out as member exceptions. The family-wide grant is the mechanical consequence
      of the root IBD, not a positive claim for uncharacterized fungal members; the
      recommended PAINT fix is to place the IBD on the budding-yeast Spa2 branch.
    member_exceptions:
      - member:
          id: UniProtKB:O42869
          label: Scaffold protein spa2
          gene_symbol: spa2
          organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
          gene_review: genes/SCHPO/spa2/spa2-ai-review.yaml
        exception_reason: >-
          Fission-yeast Spa2 shows no physical or genetic interaction with MAP kinases, the
          Mkk1/2 ortholog Pek1 is neither at cell tips nor dependent on Spa2 for its
          localization, and the conserved SHD instead recruits the Rab GAP Gyp3. The term
          reaches it only through the Eukaryota-root IBD seeded by S. cerevisiae Spa2. The
          S. pombe spa2 review removes it.
        pruned_node_id: PANTHER:PTN004550576
        supported_by:
          - reference_id: PMID:25428987
            supporting_text: >-
              We did not detect physical or genetic interactions between Spa2 and the S. pombe
              homologues of Bni1, Bud6, or MAP kinases
          - reference_id: PMID:40931936
            supporting_text: >-
              Pek1 (also known as Skh1), the ortholog of S. cerevisiae Mkk1 and Mkk2, was not
              observed at tips, as previously reported (Madrid et al., 2006), and its
              localization was unaffected in spa2Δ cells
      - member:
          id: UniProtKB:Q06160
          label: Protein SPH1
          gene_symbol: SPH1
          organism: Saccharomyces cerevisiae (strain ATCC 204508 / S288c)
          gene_review: genes/yeast/SPH1/SPH1-ai-review.yaml
        exception_reason: >-
          Sph1 binds Mkk1, Mkk2 and Ste7 in two-hybrid assays, but the one in vivo test of
          MAPK-module tethering was negative: sph1 deletion does not disrupt bud-tip
          localization of Slt2 or Mkk1, whereas spa2 and pea2 deletions do. Sph1 instead
          supports full Slt2 activation by an unknown mechanism. The scaffold activity is a
          Spa2 property passed to Sph1 by descent; the SPH1 review marks the IBA as
          over-annotated.
        pruned_node_id: PANTHER:PTN004550576
        supported_by:
          - reference_id: PMID:23924898
            supporting_text: >-
              In contrast, the deletion of other polarisome component genes did not
              significantly affect Slt2p-GFP localization at bud tips
          - reference_id: PMID:23924898
            supporting_text: >-
              The deletion of polarisome gene BUD6, BNI1, or SPH1 did not affect Mkk1p-GFP
              localization at bud tips or bud necks
          - reference_id: PMID:23924898
            supporting_text: >-
              In contrast to Spa2p and Pea2p, however, these components are not required for
              the localization of Slt2p to the bud tip.
    supported_by:
      - reference_id: PMID:12361575
        supporting_text: >-
          Spa2p functions as a scaffold-like protein to recruit the Mpk1p MAP kinase module
      - reference_id: PMID:25428987
        supporting_text: >-
          We did not detect physical or genetic interactions between Spa2 and the S. pombe
          homologues of Bni1, Bud6, or MAP kinases
  - assessed_term:
      id: GO:0120105
      label: mitotic actomyosin contractile ring, intermediate layer
    scope: FAMILY_WIDE
    scope_reason: >-
      Shown only for fission-yeast Spa2. The boundary falls inside SF0, so the scope cannot
      be expressed as a subfamily; it is recorded as FAMILY_WIDE with both budding-yeast
      members carved out as member exceptions. The family-wide grant is the mechanical
      consequence of the root IBD, not a positive claim for uncharacterized fungal members;
      the recommended PAINT fix is to place the IBD on the Schizosaccharomyces branch.
    member_exceptions:
      - member:
          id: UniProtKB:P23201
          label: Scaffold protein SPA2
          gene_symbol: SPA2
          organism: Saccharomyces cerevisiae (strain ATCC 204508 / S288c)
          gene_review: genes/yeast/SPA2/SPA2-ai-review.yaml
        exception_reason: >-
          The intermediate layer is a nanoscale zone defined from the fission-yeast ring
