family_id: PANTHER:PTHR21601
family_name: SPA2 PROTEIN
preferred_name: Spa2 family of fungal cortical polarisome scaffolds (Spa2, Sph1, S. pombe Spa2)
summary: >-
  Fungal family of large cortical scaffold proteins defined by N-terminal Spa2 homology
  domains (SHD). In Saccharomyces cerevisiae, Spa2 is a core polarisome component that
  concentrates at the incipient bud site, bud tip, bud neck and mating projection tip. Its
  SHD1 domain binds a short linear motif that is strongest in the Rab GAPs Msb3/Msb4,
  weaker in the MAP kinase kinase Ste7 and weakest in Mkk1, tethering these partners to
  sites of polarized growth. The SHD1-Ste7 interaction holds Ste7 at the shmoo tip but is
  not needed for pheromone arrest, and Mkk1 binding is near the detection limit, so the
  motif work supports SHD1 as a localization dock; Spa2's MAP kinase scaffold role rests on
  its recruitment of Mkk1 and Mpk1/Slt2 to growth sites. The paralog Sph1 has the same
  localizations, interacts with the same MAPKKs in two-hybrid assays, and acts partly
  redundantly with Spa2 in bipolar budding, mating projection morphology and pseudohyphal
  and invasive growth, but it is not needed to localize Slt2 or Mkk1; it is instead needed
  for full Slt2 activation. The single Schizosaccharomyces pombe member, Spa2, sits
  at growing cell tips, where it oligomerizes, binds Pos1 and couples to the exocyst to focus
  polarized growth. It is also an SH3-ligand of Cdc15 and Imp2 in the intermediate layer of
  the contractile ring. Fission-yeast Spa2 has no detectable link to MAP kinase modules.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member is a cortical scaffold that focuses polarized growth, so the
  core role is coherent. Partner sets have diverged. Budding-yeast Spa2 binds MAPKKs and
  recruits the Mkk1-Slt2 module (Mkk1 binding to the SHD1 motif is weak, and the Ste7
  interaction localizes Ste7 without a detected effect on pheromone arrest). Sph1 binds
  MAPKKs in two-hybrid assays but does not recruit the module, and fission-yeast Spa2
  shows no MAPK link at all. Fission-yeast Spa2 is a contractile-ring SH3
  ligand, which is not seen in budding yeast. Those partner-specific activities are safe only
  for the lineage that shows them, and the members that lack them are recorded as
  member_exceptions.
