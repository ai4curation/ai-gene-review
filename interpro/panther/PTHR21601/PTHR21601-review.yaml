  # --- PTN004550576 (Eukaryota root of the family): mixed lineage-specific assertions ---
  - node_id: PANTHER:PTN004550576
    asserted_term:
      id: GO:0005078
      label: MAP-kinase scaffold activity
    evidence: IBD
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260603"
    seeds:
      - id: SGD:S000003944
        label: Scaffold protein SPA2
        organism: Saccharomyces cerevisiae
    assessment: TOO_DEEP
    assessment_reason: >-
      Sound for budding-yeast Spa2, which recruits Mkk1 and the Mpk1/Slt2 module to growth
      sites. Its SHD1 domain binds a short linear motif in Ste7 and, weakly, Mkk1; the same
      study found that the Ste7 interaction localizes Ste7 without being needed for pheromone
      arrest, and that the Mkk1/Mkk2 N-terminal regions did not measurably bind SHD1 in vitro,
      so the motif data support a localization dock more than signalling scaffold activity.
      Sph1 binds the same MAPKKs in two-hybrid assays, but in vivo it is not needed for
      bud-tip Slt2 or Mkk1 localization, which depends on Spa2 and Pea2; Sph1 instead
      supports full Slt2 activation. Fission-yeast Spa2 shows no physical or genetic
      interaction with MAP kinases, and the Mkk1/2 ortholog Pek1 is neither at cell tips nor
      dependent on Spa2 for its localization. Placing the term at the family root therefore
      passes it to fission yeast without support, and to Sph1 without Sph1-specific
      functional support. The fission-yeast review removes it and the SPH1 review marks it
      over-annotated, so the IBD should move down to the budding-yeast Spa2 branch, not the
      whole Spa2/Sph1 clade. The GOA rows still cite the older node id PTN000492368 for this
      term.
    supported_by:
      - reference_id: PMID:12361575
        supporting_text: >-
          Spa2p functions as a scaffold-like protein to recruit the Mpk1p MAP kinase module
      - reference_id: PMID:41527849
        supporting_text: >-
          Here, we identify a short linear motif (SLiM) in the disordered regions of Msb3,
          Msb4, and the MAP kinase kinases Ste7 and Mkk1 that binds the SHD1 domain of Spa2.
      - reference_id: PMID:41527849
        supporting_text: >-
