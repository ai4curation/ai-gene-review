notes: >-
  Written together with full gene reviews of the three model-organism members: S.
  cerevisiae SPA2 and SPH1, and S. pombe spa2. All node/term/seed/date tuples are verbatim
  from the cached PTHR21601-paint.tsv. Current GOA IBA rows still cite older node ids
  (PTN000492368 for MAP-kinase scaffold activity, PTN001091459 for the contractile-ring term).
  The cached slice places both assertions on the root PTN004550576. The main recommendations
  are to move MAP-kinase scaffold activity down to the budding-yeast Spa2/Sph1 clade and the
  contractile-ring intermediate-layer term to the Schizosaccharomyces branch. No
  residue_sites were curated: the SHD1 SLiM-binding interface is mapped only at the domain
  level in this pass.
