  # --- PTN004550576 (Eukaryota root of the family): mixed lineage-specific assertions ---
  - node_id: PANTHER:PTN004550576
    asserted_term:
      id: GO:0005078
      label: MAP-kinase scaffold activity
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260603"
    seeds:
      - id: SGD:S000003944
        label: Scaffold protein SPA2
        organism: Saccharomyces cerevisiae
    assessment: TOO_DEEP
    assessment_reason: >-
      Sound for budding-yeast Spa2. Its SHD1 domain binds a short linear motif in the MAPKKs
      Mkk1 and Ste7 and recruits the Mpk1 module to growth sites. Sph1 binds the same MAPKKs
      in two-hybrid assays. Fission-yeast Spa2 shows no physical or genetic interaction with
      MAP kinases, and the Mkk1/2 ortholog Pek1 is neither at cell tips nor dependent on Spa2
      for its localization. Placing the term at the family root therefore passes it to fission
      yeast without support. The fission-yeast review removes it, so the IBD should move down
      to the Spa2/Sph1 clade. The GOA rows still cite the older node id PTN000492368 for this
      term.
    supported_by:
      - reference_id: PMID:12361575
        supporting_text: >-
          Spa2p functions as a scaffold-like protein to recruit the Mpk1p MAP kinase module
      - reference_id: PMID:41527849
        supporting_text: >-
          Here, we identify a short linear motif (SLiM) in the disordered regions of Msb3,
          Msb4, and the MAP kinase kinases Ste7 and Mkk1 that binds the SHD1 domain of Spa2.
      - reference_id: PMID:25428987
        supporting_text: >-
          We did not detect physical or genetic interactions between Spa2 and the S. pombe
          homologues of Bni1, Bud6, or MAP kinases
  - node_id: PANTHER:PTN004550576
    asserted_term:
      id: GO:0120105
      label: mitotic actomyosin contractile ring, intermediate layer
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260603"
    seeds:
      - id: PomBase:SPAC3G9.05
    assessment: TOO_DEEP
    assessment_reason: >-
      Correct for fission-yeast Spa2, an SH3 ligand of Cdc15 and Imp2 that concentrates in
      the intermediate zone of the ring. Budding-yeast Spa2 and Sph1 are at the bud neck
      before cytokinesis but are not contractile-ring intermediate-layer components, and
      the "intermediate layer" is defined from the fission-yeast ring architecture. With a
      fission-yeast-only seed, the IBD belongs on the Schizosaccharomyces branch. Both
      budding-yeast reviews remove the IBA. The GOA rows still cite the older node id
      PTN001091459.
    supported_by:
      - reference_id: PMID:28914606
        supporting_text: concentrate in this intermediate zone
