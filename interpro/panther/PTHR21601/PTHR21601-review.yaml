term_assessments:
  - assessed_term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member is a cortical scaffold that recruits partner proteins to growth sites.
      Budding-yeast Spa2 binds Msb3/4 and MAPKKs through SHD1, and fission-yeast Spa2 binds
      Pos1 and Gyp3. This partner-neutral adaptor term is the safe family-wide molecular
      function.
    supported_by:
      - reference_id: PMID:41527849
        supporting_text: >-
          Here, we identify a short linear motif (SLiM) in the disordered regions of Msb3,
          Msb4, and the MAP kinase kinases Ste7 and Mkk1 that binds the SHD1 domain of Spa2.
  - assessed_term:
      id: GO:0005078
      label: MAP-kinase scaffold activity
    scope: UNRESOLVED
    scope_reason: >-
      True for S. cerevisiae Spa2, and plausibly Sph1, but absent in S. pombe. The lineage
      boundary falls inside the single subfamily SF0, so it cannot be expressed as
      SUBFAMILY_ONLY. Boundary: the budding-yeast Spa2/Sph1 clade only.
    supported_by:
      - reference_id: PMID:25428987
        supporting_text: >-
          We did not detect physical or genetic interactions between Spa2 and the S. pombe
          homologues of Bni1, Bud6, or MAP kinases
  - assessed_term:
      id: GO:0120105
      label: mitotic actomyosin contractile ring, intermediate layer
    scope: UNRESOLVED
    scope_reason: >-
      Fission-yeast only. The boundary falls inside SF0, so the scope cannot be expressed
      as a subfamily. Boundary: the Schizosaccharomyces branch.
    supported_by:
      - reference_id: PMID:28914606
        supporting_text: concentrate in this intermediate zone
  - assessed_term:
      id: GO:0030010
      label: establishment of cell polarity
    scope: FAMILY_WIDE
    scope_reason: Demonstrated in both yeasts; the defining process of the family.
    supported_by:
      - reference_id: PMID:40931936
        supporting_text: Spa2 is required to focus the zone of polarized vegetative growth

