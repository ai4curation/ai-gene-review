          therefore not shown for it. The term reaches it only through the PomBase-seeded
          Eukaryota-root IBD, and the SPA2 review removes it.
        pruned_node_id: PANTHER:PTN004550576
        supported_by:
          - reference_id: PMID:28914606
            supporting_text: concentrate in this intermediate zone
          - reference_id: PMID:29601579
            supporting_text: >-
              Our data indicate that Spa2 is recruited to the cleavage site to co-operate with
              the secretory vesicle system and particular actomyosin ring components to promote
              the incorporation of Chs2 into the so-called 'ingression progression complexes'
              during cytokinesis in budding yeast.
      - member:
          id: UniProtKB:Q06160
          label: Protein SPH1
          gene_symbol: SPH1
          organism: Saccharomyces cerevisiae (strain ATCC 204508 / S288c)
          gene_review: genes/yeast/SPH1/SPH1-ai-review.yaml
        exception_reason: >-
          Sph1 is at the bud neck only before cytokinesis, and no study places it in the
          actomyosin ring or any sublayer of it. The term reaches it only through the
          PomBase-seeded Eukaryota-root IBD, and the SPH1 review removes it.
        pruned_node_id: PANTHER:PTN004550576
        supported_by:
          - reference_id: PMID:9443897
            supporting_text: >-
              Sph1p concentrates as a cortical patch at the presumptive bud site in unbudded
              cells, at the tip of small, medium and large buds, and at the bud neck prior to
              cytokinesis.
    supported_by:
      - reference_id: PMID:28914606
        supporting_text: concentrate in this intermediate zone
  - assessed_term:
      id: GO:0030010
      label: establishment of cell polarity
    scope: FAMILY_WIDE
    scope_reason: Demonstrated in both yeasts; the defining process of the family.
    supported_by:
