family_id: PANTHER:PTHR13283
family_name: KREV INTERACTION TRAPPED 1-RELATED
preferred_name: KRIT1 and FRMD8 FERM-domain adaptors
summary: KRIT1 and FRMD8 are FERM-domain interaction proteins with distinct partners. KRIT1 participates
  in the cerebral cavernous malformation signaling machinery and stabilizes endothelial junctions. FRMD8
  binds iRhom proteins and protects the iRhom/ADAM17 sheddase complex from endolysosomal degradation,
  sustaining inflammatory and growth-factor ligand release.
functional_coherence: HETEROGENEOUS
coherence_reason: KRIT1 stabilizes endothelial cell junctions through Rap1-associated interactions (PMID:21633110),
  whereas FRMD8 stabilizes cell-surface iRhom/ADAM17 complexes and thereby sustains ligand shedding (PMID:29897336).
  Both are FERM-domain interaction proteins, but neither KRIT1-specific CCM signaling nor FRMD8-dependent
  sheddase stability is a family-wide process.
