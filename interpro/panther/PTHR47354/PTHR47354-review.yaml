term_assessments:
- assessed_term:
    id: GO:0016651
    label: oxidoreductase activity, acting on NAD(P)H
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterized member uses NADH or NADPH as electron donor: PaaE prefers NADPH (SF8),
    KshB reduces its oxygenase from NADH (SF8), Hcr is NADH-dependent (SF6), the SF5/SF1
    oxygenase reductases are NAD(P)H-ferredoxin reductases and the SF7 LuxG/Fre proteins are
    NAD(P)H-flavin reductases. The module grounds the PaaE reductase step (SF8) on this term; it is
    the specific activity the E. coli paaE review adopts in place of the generic IBA.
  supported_by:
  - reference_id: PMID:21247899
    supporting_text: >-
      The PaaE subunit is a reductase with a preference for NADPH and FAD, capable of reducing
      cytochrome c
  - reference_id: PMID:26879449
    supporting_text: >-
      The second gene of the hcp-hcr operon encodes an NADH-dependent reductase, Hcr.
