family_id: PANTHER:PTHR47354
family_name: NADH OXIDOREDUCTASE HCR
preferred_name: FNR-type flavin/[2Fe-2S] reductases of bacterial oxygenases (PaaE, KshB, Hcr, BenC, VanB)
summary: >-
  Bacterial NAD(P)H-dependent flavoprotein reductases of the ferredoxin-NADP+ reductase (FNR)
  structural family. Most members fuse an FNR-like FAD-binding and NAD(P)-binding module to a
  plant-type [2Fe-2S] ferredoxin domain and act as the electron-transfer (reductase) components of
  multicomponent oxygenases: PaaE of phenylacetyl-CoA 1,2-epoxidase (SF8, with the steroid
  9alpha-hydroxylase reductase KshB), the class IB dioxygenase/monooxygenase reductases such as
  BenC, XylZ, NdoR, MmoC and TmoF (SF5, named after RfbI), the Rieske demethylase/monooxygenase
  reductases VanB, YeaX/CntB and phthalate dioxygenase reductase (SF1), and Hcr/GbcB (SF6), the
  NADH-dependent partner of the hybrid-cluster protein Hcp in E. coli and of glycine betaine
  monooxygenase in Pseudomonas. A further branch (SF7, LuxG and Vibrio Fre) are short (~235
  residue) NAD(P)H-flavin reductases without the ferredoxin domain that supply reduced flavin to
  luciferase. Members thus share NAD(P)H-driven reduction chemistry, but their physiological
  partner -- and hence their biological process -- differs from branch to branch.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Generic NAD(P)H-dependent oxidoreductase (electron transfer) activity is shared family-wide.
  What diverges is (1) domain content and cofactors: SF7 (LuxG/Fre flavin reductases, 164-237
  residues) lack the [2Fe-2S] ferredoxin domain that the ~320-360-residue members carry, so iron
  sulfur cluster terms are not family-wide; and (2) partner oxygenase and pathway: PaaE
  (phenylacetate catabolism), KshB (steroid catabolism), Hcr (NO reduction with Hcp), BenC/XylZ
  (aromatic dioxygenases), MmoC (methane monooxygenase), VanB/YeaX (demethylases) -- so no process
  term is safe beyond individual subfamilies, and even SF8 mixes the phenylacetate and steroid
  pathways.
