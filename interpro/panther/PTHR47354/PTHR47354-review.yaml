notes: >-
  PANTHER names the family after E. coli Hcr ("NADH OXIDOREDUCTASE HCR"), which is one subfamily
  (SF6) of a broad group of oxygenase reductases; the name is member-dominated, not descriptive.
  Node-to-family mapping from PANTHER's PAINT_TreeGrafter_Annotations_TOTAL.txt (paint/current,
  2026-10-23): PTN005342051 = PTHR47354:AN0 (root, TreeGrafter SF5), PTN000452442 =
  PTHR47354:AN72 (SF8). Subfamilies SF1, SF2, SF3 and SF5 (Rieske demethylase and class IB
  dioxygenase reductases) are not individually described; they carry no PAINT node row and are
  not used by the phenylacetate_catabolism module. Module use: phenylacetate_catabolism selects SF8
  for the PaaE reductase step. The E. coli paaE gene review was being completed in parallel.
