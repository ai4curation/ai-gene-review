      id: GO:0008860
      label: ferredoxin-NAD+ reductase activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The EC 1.18.1.3 reductase activity applies to the Rieske-system reductases that
      carry a [2Fe-2S] ferredoxin domain and reduce an iron-sulfur acceptor. It does
      not apply to the SF7 flavin reductases, which have no such domain and release
      reduced flavin instead.
