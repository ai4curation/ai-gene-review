        organism: Mycobacterium tuberculosis
      - id: UniProtKB:Q9HTF3
        gene_symbol: gbcB
        organism: Pseudomonas aeruginosa
    assessment: SOUND
    assessment_reason: >-
      PTN005342051 is the root of the PANTHER 19 tree (treeinfo service), and the
      asserted term is the generic parent GO:0016491. Every member is an
      oxidoreductase, so the placement is correct, but the term is uninformative:
      the BenC gene reviews MODIFY it to the specific ferredoxin-NAD+ reductase
      activity GO:0008860, which they already carry from EC mapping. The
      adjudication is about specificity, not about placement.
    supported_by:
      - reference_id: file:interpro/panther/PTHR47354/PTHR47354-paint.tsv
        supporting_text: "PTHR47354\tPTN005342051\tGO:0016491\tF\tIBD\tfalse"
      - reference_id: file:genes/ACIAD/benC/benC-ai-review.yaml
        supporting_text: >-
          Generic oxidoreductase activity is true but uninformative; the specific
          reductase activity GO:0008860 is already annotated and supported.
