reviewed_by: claude-code
review_date: '2026-11-04'
notes: 'PANTHER names the family after E. coli Hcr ("NADH OXIDOREDUCTASE HCR"), which is one subfamily
  (SF6) of a broad group of oxygenase reductases; the name is member-dominated, not descriptive. Node-to-family
  mapping from PANTHER''s PAINT_TreeGrafter_Annotations_TOTAL.txt (paint/current, 2026-10-23): PTN005342051
  = PTHR47354:AN0 (root, TreeGrafter SF5), PTN000452442 = PTHR47354:AN72 (SF8). Subfamilies SF2 and SF3
  carry no PAINT node row and are not individually described. Module use: phenylacetate_catabolism selects
  SF8 for the PaaE reductase step. Module use: benzoate_upper_pathway places BenC (GO:0008860) in SF5
  but selects it with an NCBIfam BenC equivalog rather than this family. This review merges two independently
  written versions: the benzoate review (#5366; BenC reference protein, SF5/SF1/SF7 subfamilies, GO:0008860
  scope) and the phenylacetate review (PaaE SF8, Hcr SF6, GO:0016651 and GO:0010124 scopes). All node
  and term verdicts agreed. Where they differed: functional_coherence is HETEROGENEOUS rather than MOSTLY_COHERENT,
  because both versions agree that partner oxygenase, pathway and [2Fe-2S] domain content vary by subfamily;
  and BenC is kept as the reference protein, with PaaE as the SF8 representative.'
