family_id: PANTHER:PTHR47354
family_name: NADH OXIDOREDUCTASE HCR
preferred_name: Ferredoxin-NAD(P)H reductase family of Rieske oxygenase and multicomponent oxygenase systems
  (BenC, VanB, PaaE, KshB, Hcr, Fre)
summary: Flavin- and iron-sulfur-containing reductases that feed electrons from NAD(P)H into Rieske oxygenase
  and monooxygenase systems. Most members fuse a plant-type [2Fe-2S] ferredoxin domain to an FAD-binding
  and an NAD(P)H-binding domain of the ferredoxin:NADP(H) reductase superfamily, though the domain order
  and the presence of the ferredoxin domain vary by subfamily. SF5 holds the class IB reductases that
  pass electrons directly to their oxygenase, including benzoate dioxygenase BenC, toluate dioxygenase
  XylZ, anthranilate dioxygenase AntC and 2-halobenzoate dioxygenase CbdC, alongside methane and propane
  monooxygenase reductases. SF1 holds vanillate O-demethylase VanB, phthalate dioxygenase reductase and
  carnitine monooxygenase reductase; SF8 the phenylacetyl-CoA epoxidase subunit E and 3-ketosteroid 9-alpha-monooxygenase
  reductases; SF6 the HCR-type NADH oxidoreductases and glycine betaine monooxygenase reductases; SF7
  the NAD(P)H-flavin reductases Fre and LuxG. In SF8, PaaE is the reductase subunit of the multicomponent
  phenylacetyl-CoA 1,2-epoxidase PaaABCE of aerobic phenylacetate catabolism, and the actinobacterial
  KshB proteins are the reductases of 3-ketosteroid 9alpha-hydroxylase in steroid catabolism. SF6 Hcr
  is the NADH-dependent partner of the hybrid-cluster NO reductase Hcp in E. coli. Members share NAD(P)H-driven
  reduction chemistry, but their physiological partner, and hence their biological process, differs from
  branch to branch.
functional_coherence: HETEROGENEOUS
coherence_reason: 'All members are NAD(P)H-dependent flavin oxidoreductases, but the acceptor and the
  pathway differ by subfamily, and the cofactor complement is not uniform: the SF7 flavin reductases have
  no [2Fe-2S] domain, while SF5 and SF8 members do. The oxygenase partner, and therefore the biological
  process, is subfamily- or member-specific. Only generic NAD(P)H-dependent oxidoreductase activity is
  shared family-wide. Even SF8 mixes the phenylacetate (PaaE) and steroid (KshB) pathways, so no process
  term is safe beyond individual members assigned by orthology.'
