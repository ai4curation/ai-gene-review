  name:
    name: rRNA/tRNA 2'-O-methyltransferase
    short: rRNA/tRNA_2-O-MTase
  description:
  - text: This family of proteins includes S-adenosyl-L-methionine-dependent methyltransferases
      involved in the processing of pre-ribosomal RNA and tRNA. They catalyze the
      site-specific 2'-hydroxyl methylation of ribose moieties in these RNAs, with
      site specificity provided by a guide RNA that base pairs with the substrate.
      The methylation occurs at a characteristic distance from the sequence involved
      in base pairing with the guide RNA. Some members also have protein methyltransferase
      activity, mediating methylation of specific histone residues, which can affect
      chromatin structure and gene expression. These proteins are essential for the
      biogenesis of ribosomal subunits and play a role in modulating nucleolus size,
      likely through regulating the rRNA pool.
