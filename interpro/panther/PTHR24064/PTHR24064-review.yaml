family_id: PANTHER:PTHR24064
family_name: SOLUTE CARRIER FAMILY 22 MEMBER
preferred_name: SLC22 / PHO84-type major facilitator superfamily transporters
summary: >-
  A large major facilitator superfamily (MFS) family that PANTHER names after the animal SLC22
  organic cation/anion/zwitterion transporters but that also includes fungal and plant
  phosphate:H+ symporters (S. cerevisiae PHO84, S. pombe SPBC1683.01-type, Arabidopsis
  PHT1-1 to PHT1-9), the yeast glycerophosphoinositol transporter GIT1, plant organic
  cation/carnitine transporter homologs (Arabidopsis OCT1-7), the synaptic-vesicle proteins
  SVOP/SVOPL, and bacterial metabolite transporters (E. coli YdjE/YdjK). Within the animal SLC22
  group, OCT1-3 (SLC22A1-3) move organic cations, OAT1/3 and relatives (SLC22A6/8) move organic
  anions, and the OCTN lineage (SLC22A4/SLC22A5, mouse Slc22a21) includes OCTN2, the
  high-affinity Na+-dependent plasma-membrane carnitine transporter whose loss causes primary
  carnitine deficiency. SLC22A16 is a separate carnitine-transporting member. Neither S.
  cerevisiae member (PHO84, GIT1) transports carnitine; budding yeast takes up carnitine through
  the unrelated amino acid permease AGP2.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family groups transporters with entirely different substrates: inorganic phosphate (PHO84,
  PHT1), glycerophosphoinositol (GIT1), organic cations (OCT1-3), organic anions (OAT1/3),
  carnitine (OCTN2, SLC22A16) and uncharacterized vesicle proteins (SVOP). Only generic
  transmembrane transporter terms are safe at family level. Carnitine transporter activity is a
  property of the OCTN clade (SF283 SLC22A5, SF222 SLC22A4, SF680 Slc22a21; PAINT node
  PTN007768016) and, independently placed, SLC22A16 (SF186; PTN002782663).
