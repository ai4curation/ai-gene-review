notes: >-
  The entries.csv export for this family has no subfamily assignments, so subfamily membership
  was taken from the PANTHER 19.0 model-organism classification files (human SLC22A5 SF283,
  SLC22A4 SF222, SLC22A16 SF186; mouse Slc22a21 SF680; yeast PHO84 SF616, GIT1 SF595; human SVOP
  SF673). Propagation sets come from the cached PAINT UniProt GAF. Module inconsistency: the
  carnitine shuttle module gives PANTHER:PTHR24064 (the whole family) as the participant family
  for carnitine transmembrane transporter activity; the family is heterogeneous and its only
  budding-yeast members are PHO84 and GIT1, so the family id over-generalizes. The SLC22A5 gene
  review lists IBAs for quaternary ammonium transport terms (GO:0015651, GO:0015697) that the
  current PAINT GAF gives only to the OCT1-3 node PTN002782734, not to SLC22A5; the review's
  KEEP_AS_NON_CORE call is unaffected, but those IBA rows may be stale.
