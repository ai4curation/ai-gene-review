    excludes both the Mpl clade and the CapB members; the three seeds (E. coli, M. tuberculosis,
    S. aureus) span Pseudomonadota, Actinomycetota and Bacillota, so the placement at the bacterial
    MurC ancestor matches where the function is demonstrated. The E. coli seed is the enzyme whose
    kinetics and acyl-phosphate mechanism were established, and the reviewed recipients in this
    repository accept the IBA. The only leaf worth a second look is the chlamydial MurC/Ddl fusion,
    which retains the MurC module and is correctly inside the clade.
