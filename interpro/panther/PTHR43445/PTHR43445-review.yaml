notes: >-
  Written for the peptidoglycan_recycling module, whose Mpl step is grounded on
  SF5 with E. coli Mpl (P37773) and P. putida KT2440 Mpl (Q88QE7) as
  representatives; the sibling peptidoglycan_precursor_biosynthesis module uses
  MurC (SF3). The family carries two distinct Mur-ligase activities on well
  separated PAINT nodes (PTN002881276 for Mpl, PTN000566346 for MurC), so each
  ligase term is scoped SUBFAMILY_ONLY. The PTHR43445 genes in this repository
  (E. coli/P. putida Mpl and MurC) carry only their own subfamily's term, so the
  nodes do not cross-propagate.
