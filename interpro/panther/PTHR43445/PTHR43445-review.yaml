term_assessments:
- assessed_term:
    id: GO:0008763
    label: UDP-N-acetylmuramate-L-alanine ligase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for MurC (SF3) only. The Mpl enzymes of SF5 ligate a preformed tripeptide rather than free
    L-alanine, and the CapB members of SF1 are outside the MurC clade with no cached evidence of any
    UDP-MurNAc ligase activity, so neither may carry this term. Within SF3 the term is well founded
    across the bacterial phyla; the plant SF3 leaves sit outside the PAINT clade and are not addressed
    by this grant.
