subfamilies:
- subfamily_id: PANTHER:PTHR43445:SF3
  label: UDP-N-ACETYLMURAMATE--L-ALANINE LIGASE
  description: >-
    MurC proper: 679 of the family's 683 members, spanning the bacterial phyla, plus the plant MurC
    orthologs of mosses, lycophytes and angiosperms and four chlamydial proteins (Chlamydia
    trachomatis O84767 and relatives, ~800 residues) in which the MurC module is fused to a
    D-Ala-D-Ala ligase, named "Bifunctional enzyme MurC/Ddl" in the member inventory. The bacterial
    part of this subfamily is the clade below PAINT node PTN000566346; the plant leaves lie outside it
    and inherit nothing.
  representative_members:
