family_id: PANTHER:PTHR43445
family_name: UDP-N-ACETYLMURAMATE--L-ALANINE LIGASE-RELATED
preferred_name: MurC/Mpl ATP-dependent UDP-MurNAc amino-acid and peptide ligases
summary: >-
  ATP-dependent amide-bond ligases of the Mur-ligase (MurC/MurD/MurE/MurF) superfamily that act on
  UDP-N-acetylmuramate. Two functionally distinct enzyme types dominate the family. MurC adds the
  first residue, L-alanine, to UDP-MurNAc in de novo peptidoglycan synthesis, activating the sugar
  carboxylate as an acyl phosphate with the gamma-phosphate of ATP before the amine attacks; it is
  essential and present in nearly every peptidoglycan-producing bacterium, and the plant orthologs
  classified here belong to the plastid peptidoglycan pathway. Mpl, the murein peptide ligase, instead
  reattaches an intact tripeptide (L-Ala-gamma-D-Glu-meso-DAP, and in vitro also the tetra- and
  pentapeptides) recovered from wall turnover to UDP-MurNAc, feeding recycled peptide back into
  precursor synthesis; it is dispensable for growth. A third, two-member subfamily carries PANTHER's
  PGA synthase CapB name.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The superfamily chemistry (ATP-dependent amide-bond formation on UDP-MurNAc) is shared, but the
  substrate and the pathway role differ by subfamily, which is why the family name ends "-RELATED".
  SF3 adds a single amino acid de novo and is essential; SF5 (Mpl) adds a preformed peptide in a
  recycling route and is not; SF1 holds two capsule/poly-gamma-glutamate CapB proteins that are
  outside the MurC clade of the PANTHER tree altogether. No specific activity term is safe at family
  level, and PAINT accordingly places its MurC and its Mpl assertions at two separate nodes.
