family_id: PANTHER:PTHR43445
family_name: UDP-N-ACETYLMURAMATE--L-ALANINE LIGASE-RELATED
preferred_name: Mur-ligase (ADP-forming) family splitting into MurC (UDP-MurNAc--L-Ala ligase) and Mpl (murein-peptide ligase) subfamilies
summary: >-
  An ATP-dependent Mur-ligase family of peptidoglycan metabolism, holding two
  related but distinct enzymes. SF3 (MurC) is the first cytoplasmic committed
  ligase of de novo peptidoglycan precursor synthesis, adding L-alanine to
  UDP-N-acetylmuramate (EC 6.3.2.8, GO:0008763). SF5 (Mpl) is the murein-peptide
  ligase of recycling, which re-attaches an intact recovered stem tripeptide
  (L-Ala-gamma-D-Glu-meso-DAP) to UDP-MurNAc in one step (EC 6.3.2.45,
  GO:0106418), allowing salvaged peptides to re-enter precursor synthesis without
  resynthesis. Both use the Mur-ligase ADP-forming mechanism and fold, but they
  ligate different substrates and belong to different branches of peptidoglycan
  metabolism (biosynthesis vs recycling).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  SF3 (MurC) ligates L-alanine to UDP-MurNAc in de novo synthesis (GO:0008763),
  whereas SF5 (Mpl) ligates a whole recovered tripeptide to UDP-MurNAc in
  recycling (GO:0106418). The two activities are different reactions on different
  substrates; neither specific ligase term is safe across the whole family.
