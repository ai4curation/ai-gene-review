- subfamily_id: PANTHER:PTHR43445:SF5
  label: UDP-N-ACETYLMURAMATE--L-ALANYL-GAMMA-D-GLUTAMYL-MESO-2,6-DIAMINOHEPTANDIOATE LIGASE
  description: >-
    Mpl, the murein peptide ligase of the Pseudomonadota: the clade below PAINT node PTN002881276
    (E. coli, Salmonella, Yersinia, Vibrio, Shewanella, Haemophilus, Pseudomonas, Xanthomonas,
    Neisseria and Leptospira). Mpl ligates the intact tripeptide released by peptidoglycan turnover
    onto UDP-MurNAc, so it is a recycling enzyme rather than a step of the linear de novo pathway, and
    an mpl null mutant is viable.
  representative_members:
  - id: UniProtKB:P37773
    label: UDP-N-acetylmuramate--L-alanyl-gamma-D-glutamyl-meso-2,6-diaminoheptandioate ligase
    gene_symbol: mpl
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/mpl/mpl-ai-review.yaml
  - id: UniProtKB:P43948
    label: UDP-N-acetylmuramate--L-alanyl-gamma-D-glutamyl-meso-2,6-diaminoheptandioate ligase
    gene_symbol: mpl
    organism: Haemophilus influenzae
  diverged_from_family: true
  divergence_description: >-
    Mpl uses a preformed peptide, not a free amino acid, as the amine donor, and it works in the
    recycling branch: the tripeptide it attaches has been recovered from murein turnover, and
    disrupting mpl removes the activity without stopping growth, whereas MurC is essential. MurC terms
    (GO:0008763) must not propagate here and Mpl's own activity term (GO:0106418) must not propagate
    into SF3; PAINT keeps the two apart at separate nodes.
  supported_by:
  - reference_id: PMID:8808921
    supporting_text: reutilization of the intact tripeptide L-alanyl-gamma-D-glutamyl-meso-diaminopimelate
      occurred and accounted for well over 30% of new cell wall synthesis
  - reference_id: PMID:8808921
    supporting_text: A null mutant totally lacked activity but was viable, showing that the enzyme is
      not essential for growth.
  - reference_id: PMID:17384195
    supporting_text: Mpl adds this peptide to UDP-N-acetylmuramic acid, thereby providing an economical
      additional source of UDP-MurNAc-tripeptide available for de novo peptidoglycan biosynthesis.
- subfamily_id: PANTHER:PTHR43445:SF1
  label: PGA SYNTHASE CAPB
  description: >-
    Two members, Bacillus anthracis CapB (P19580) and Bacillus subtilis CapB/PgsB (P96736), named
    "Capsule biosynthesis protein CapB" and "PGA synthase CapB" in the member inventory, together with
    three further bacterial and archaeal proteins of the same fold (Rhodopirellula Q7UXU7,
    Fusobacterium Q8R662, Leptospira Q8F364, Korarchaeum B1L7M2) that the PANTHER tree places with
    them. No publication on CapB is cached in this repository, so nothing is asserted here about what
    these proteins catalyse.
  representative_members:
  - id: UniProtKB:P96736
    label: PGA synthase CapB
    gene_symbol: capB
    organism: Bacillus subtilis
  - id: UniProtKB:P19580
    label: Capsule biosynthesis protein CapB
    gene_symbol: capB
    organism: Bacillus anthracis
  diverged_from_family: true
  divergence_description: >-
    These members are outside the MurC clade: none of them descends from PTN000566346, and PAINT makes
    no assertion at or above them, so they receive no MurC annotation by inheritance and none should be
    added by family-level reasoning. Their UniProt names point to capsular poly-gamma-glutamate
    synthesis rather than UDP-MurNAc ligation, but that reading rests on the names alone, so the claim
    recorded here is only the negative one about the tree.
