notes: >-
  Subfamily assignments from the PANTHER 19.0 Arabidopsis classification file and entries.csv;
  propagation sets from the cached PAINT UniProt GAF. Branched-chain aminotransferase activity is
  carried by three unrelated PANTHER families in the branched-chain amino acid module
  (PTHR42825:SF2, PTHR42743:SF11, PTHR11825:SF44); the module records this correctly and asserts
  no single family node. Q88H54 has a gene review (PSEPK/ilvE) whose core function is GO:0004084.
