- subfamily_id: PANTHER:PTHR42825:SF8
  label: METHIONINE AMINOTRANSFERASE BCAT4
  description: >-
    Arabidopsis BCAT4, the cytosolic methionine aminotransferase that performs the first
    (deamination) step of methionine chain elongation in aliphatic glucosinolate biosynthesis.
  representative_members:
  - id: UniProtKB:Q9LE06
    label: BCAT4
    gene_symbol: BCAT4
    organism: Arabidopsis thaliana
    gene_review: genes/ARATH/BCAT4/BCAT4-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Substrate specificity shifted from branched-chain amino acids to methionine and its
    homologs; BCAT4 converts leucine at lower affinity and barely acts on isoleucine and valine.
    The family-level branched-chain transaminase activity is retained only as a minor activity
    (the BCAT4 review keeps the IBA as non-core).
  supported_by:
  - reference_id: PMID:17056707
    supporting_text: Recombinant BCAT4 showed high efficiency with Met and its derivatives and the corresponding
      2-oxo acids, suggesting its participation in the chain elongation pathway of Met-derived glucosinolate
      biosynthesis.
node_assessments:
- node_id: PANTHER:PTN002450258
  asserted_term:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  paint_snapshot: '20260530'
  seeds:
  - id: AGI_LocusCode:AT1G10060
    label: BCAT1
    organism: Arabidopsis thaliana
  - id: AGI_LocusCode:AT1G10070
    label: BCAT2
    organism: Arabidopsis thaliana
  - id: AGI_LocusCode:AT1G50110
    label: BCAT6
    organism: Arabidopsis thaliana
  - id: AGI_LocusCode:AT3G49680
    label: BCAT3
    organism: Arabidopsis thaliana
  assessment: SOUND
  assessment_reason: >-
    All seeds are Arabidopsis, but the activity is also experimentally established for
    proteobacterial IlvE in this family, so a root placement is consistent with the biology. The
    node propagates to all seven Arabidopsis BCATs, Haemophilus and Helicobacter IlvE and the
    fungal atnJ in the cached GAF. BCAT4 inherits it; the BCAT4 gene review judged the placement
    sound and kept the IBA as non-core because BCAT4 retains low leucine activity, so no pruning
    is proposed. P. putida Q88H54 is not in the PAINT GAF (non-reference proteome).
- node_id: PANTHER:PTN005130943
  asserted_term:
    id: GO:0019761
    label: glucosinolate biosynthetic process
  paint_snapshot: '20260828'
  seeds:
  - id: AGI_LocusCode:AT3G19710
    label: BCAT4
    organism: Arabidopsis thaliana
  assessment: UNRESOLVED
  assessment_reason: >-
    Seeded by BCAT4 alone, but the node also propagates the term to BCAT6 (SF11) and BCAT7
    (SF28) in the cached GAF. BCAT4's glucosinolate role is well established; no evidence was
    reviewed here for BCAT6 or BCAT7 in glucosinolate biosynthesis, and BCAT6 is a seed of the
    branched-chain transaminase node. Whether the glucosinolate role arose before or after the
    BCAT4/BCAT6/BCAT7 split is not settled by the data in hand.
term_assessments:
- assessed_term:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Shared by proteobacterial IlvE and the Arabidopsis BCATs; BCAT4 retains it as a minor
    activity. The branched-chain amino acid module lists SF2 (P. putida IlvE) among three
    PANTHER families that carry this activity, which is consistent with this assessment.
  supported_by:
  - reference_id: PMID:18162591
    supporting_text: In vitro activity tests with the recombinant protein identified highest activities
      with the 2-oxo acids of leucine, isoleucine, and valine, but also revealed substantial conversion
      of intermediates of the Met chain elongation pathway.
- assessed_term:
    id: GO:0010326
    label: L-methionine:oxo-acid transaminase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    BCAT4 (SF8) for methionine itself, and BCAT3 (SF2) for the chain-elongated methionine
    homologs. Within SF2 this is a property of the Brassicales BCAT3 lineage only, not of the
    bacterial IlvE or fungal members of SF2. Used by the aliphatic glucosinolate module on SF8
    and SF2.
  applicable_subfamilies:
