  scope_reason: >-
    BCAT4 is cytosolic (asserted at PTN005130943 together with BCAT6/BCAT7), whereas BCAT1 is
    mitochondrial and BCAT2, BCAT3 and BCAT5 are plastidic (chloroplast at PTN005130893 and
