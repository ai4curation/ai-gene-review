family_id: PANTHER:PTHR42825
family_name: AMINO ACID AMINOTRANSFERASE
preferred_name: Class IV branched-chain aminotransferase family (IlvE-type BCAT; plant BCAT1-7)
summary: >-
  Pyridoxal 5'-phosphate-dependent class IV aminotransferases related to bacterial IlvE. The
  ancestral and dominant activity is reversible transamination between the branched-chain
  amino acids (leucine, isoleucine, valine) and 2-oxoglutarate, the last step of branched-chain
  amino acid biosynthesis. The family includes proteobacterial IlvE (Haemophilus, Helicobacter,
  Pseudomonas putida PP_3511), the Arabidopsis BCAT1-7 paralog set with mitochondrial,
  plastidic and cytosolic members, and a group of fungal aminotransferases encoded in
  secondary-metabolite gene clusters (AMT5, atnJ, htyB, poxL, lcsP, TOXF). In Brassicales one
  cytosolic paralog, BCAT4, has become a methionine aminotransferase that starts methionine
  chain elongation for aliphatic glucosinolates, and the plastid BCAT3 serves both
  branched-chain amino acid and glucosinolate metabolism. The yeast and human branched-chain
  aminotransferases (BAT1/BAT2, eca39, BCAT1/2) are in a different PANTHER family (PTHR11825),
  as is E. coli IlvE (PTHR42743).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Branched-chain amino acid transamination is the shared activity of the characterized members
  in bacteria and plants, and PAINT places it at the root of the family. The exceptions are
  substrate shifts rather than loss: Arabidopsis BCAT4 (SF8) is specialized for methionine and
  its chain-elongated homologs and acts on leucine only at lower affinity; BCAT3 (SF2) accepts
  both branched-chain 2-oxo acids and methionine chain-elongation intermediates. The fungal
  secondary-metabolite aminotransferases in SF2 are presumed to supply non-proteinogenic amino
  acid building blocks; their substrates are not reviewed here. SF2 is a mixed subfamily
  (proteobacterial IlvE, Arabidopsis BCAT3/BCAT5, hop BCAT2, fungal cluster enzymes), so its
  official "CHLOROPLASTIC-RELATED" name does not describe its bacterial members.
