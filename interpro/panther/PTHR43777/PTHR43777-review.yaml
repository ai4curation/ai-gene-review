family_id: PANTHER:PTHR43777
family_name: MOLYBDENUM COFACTOR CYTIDYLYLTRANSFERASE
preferred_name: MocA molybdenum cofactor cytidylyltransferase family
summary: PTHR43777 contains MocA, the CTP-specific Mo-molybdopterin cytidylyltransferase that makes the
  molybdopterin cytosine dinucleotide (MCD) cofactor. MCD is used by E. coli aldehyde oxidoreductase
  YagTSR and xanthine dehydrogenases. MocA is a paralog of MobA with about 22% sequence identity. The
  family also contains Bacillus subtilis PucB, a purine-catabolism protein, and Paenarthrobacter nicotinovorans
  NboR, named nicotine blue oxidoreductase. Neither has been shown to make MCD.
functional_coherence: UNKNOWN
coherence_reason: The family has one subfamily (SF1). Of its three frozen entries only E. coli MocA
  has direct biochemical evidence. MobA/MocA-type proteins are distinguished by a handful of N-terminal
  nucleotide-specificity residues, so sequence family membership alone does not establish CTP specificity
  or the Mo-MPT acceptor for PucB, NboR or the other leaves.
