  assessment: UNRESOLVED
  assessment_reason: The only seed is E. coli MocA, for which the activity is experimentally established.
    The root also covers PucB and NboR, whose physiological nucleotidyltransferase substrates have not
    been determined. The MobA/MocA swap experiments show that five residues decide GTP versus CTP use,
    so whether the CTP-specific activity is ancestral to the whole family or arose on the MocA branch
    cannot be decided without assays on those members.
