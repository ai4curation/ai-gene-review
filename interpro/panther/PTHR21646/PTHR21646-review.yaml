term_assessments:
- assessed_term:
    id: GO:0004843
    label: cysteine-type deubiquitinase activity
  scope: UNRESOLVED
  scope_reason: USP8/UBPY in SF27 has experimentally demonstrated cysteine-type deubiquitinase activity,
    and independent human USP21 experiments also demonstrate ubiquitin-conjugate cleavage in a different
    branch. Thus the activity is not exclusive to USP8. The complete set of active versus catalytically
    divergent members across this broad family has not been established; substrate specificity and endosomal
    deployment also differ. Family-wide activity coverage remains unresolved without denying the supported
    USP8 or USP21 activities or the curated UBP11 annotation.
  supported_by:
  - reference_id: PMID:16520378
    supporting_text: "UBPY is a ubiquitin-specific protease that can deubiquitinate monoubiquitinated\
      \ \nreceptor tyrosine kinases"
  - reference_id: PMID:10799498
    supporting_text: "We showed that USP21 is capable of removing \nubiquitin from ubiquitinated proteins\
      \ as expected."
node_assessments:
- node_id: PANTHER:PTN001922764
  asserted_term:
    id: GO:0004843
    label: cysteine-type deubiquitinase activity
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN002538135
    label: PTN002538135 (ancestral IBD node; IRD source)
  paint_snapshot: '20260529'
  node_taxon:
    id: NCBITaxon:2759
    label: Eukaryota
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    PTN001922764 is the eukaryote-wide USP39/Sad1 clade (121 members, essentially
    all in SF16 "U4/U6.U5 tri-snRNP-associated protein 2", including human USP39,
    yeast SAD1 and S. pombe ubp10, plus two fungal SF94 sequences). The IRD stops
    the deubiquitinase IBD of the active USP ancestor PTN002538135. The same node
    also carries an IRD for GO:0031647 and keeps the spliceosomal nucleus and
    tri-snRNP-assembly IBDs (GO:0005634, GO:0000245), which matches the clade's known
    role as a tri-snRNP component. The loss is supported mechanistically and
    biochemically. UniProt Q53GS9 records that USP39 lacks the conserved catalytic
    Cys and His of USP-type DUBs. The one direct activity test (PMID:18728397) found
    USP39 "entirely deprived of Dub activity". The two conflicting EXP rows on human
    USP39 (PMID:30771428 for CHK2 and PMID:36651806 for IkBa; both cached abstract-only)
    are cell-based. They show that USP39 knockdown or overexpression changes substrate
    ubiquitination and stability, and their abstracts report no assay with purified
    USP39 and no catalytic-residue mutant. Such data cannot tell intrinsic hydrolase
    activity apart from USP39 recruiting or regulating an active DUB, or acting
    through its splicing role. They do not outweigh a protein that lacks the
    nucleophile, so the IRD stands. The rows could be revisited only if an in vitro
    activity of purified USP39 that depends on a residue were shown. The
    subfamily listed is SF16, which holds every vertebrate USP39 and the yeast
    orthologs. SF94 is omitted because its two members were not examined.
  supported_by:
  - reference_id: PMID:18728397
    supporting_text: although Usp39 clearly contains an ubiquitin-protease domain, we show that Usp39
      is entirely deprived of Dub activity
  - reference_id: PMID:30771428
    supporting_text: Mechanistically, USP39 deubiquitinates and stabilizes CHK2, which in turn enhances
      CHK2 stability.
  - reference_id: PMID:36651806
    supporting_text: USP39 interacted with and stabilized IκBα by reducing K48-linked polyubiquination
      of IκBα
  affected_subfamilies:
  - id: PANTHER:PTHR21646:SF16
    label: U4_U6.U5 TRI-SNRNP-ASSOCIATED PROTEIN 2
