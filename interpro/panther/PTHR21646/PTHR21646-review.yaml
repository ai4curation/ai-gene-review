family_id: PANTHER:PTHR21646
family_name: UBIQUITIN CARBOXYL-TERMINAL HYDROLASE
preferred_name: Diverse ubiquitin-specific proteases
summary: Ubiquitin-specific proteases remove ubiquitin from proteins and ubiquitin chains, with paralog-specific
  substrate selection and regulatory interactions. USP8/UBPY acts on endosomal ubiquitin dynamics and
  receptor trafficking. Its deubiquitination can facilitate receptor down-regulation, so ubiquitin removal
  should not be equated universally with stabilization of the target protein.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory spans USP4, USP5, USP8, USP13, USP20, USP22 and other paralogs. Shared
  ubiquitin-processing chemistry does not justify transferring an EGFR substrate, an endosomal localization
  or a particular linkage preference to every family member.
