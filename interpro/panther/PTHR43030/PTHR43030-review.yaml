family_id: PANTHER:PTHR43030
family_name: PHOSPHOENOLPYRUVATE SYNTHASE
preferred_name: Phosphoenolpyruvate synthase (PpsA) family
summary: >-
  Prokaryotic phosphoenolpyruvate synthases (pyruvate, water dikinases) that convert pyruvate,
  ATP and water to phosphoenolpyruvate, AMP and phosphate through a phosphohistidine on a
  swivelling central domain. They supply PEP for gluconeogenesis from three-carbon substrates
  (Escherichia coli and Pseudomonas putida PpsA, archaeal PpsA).
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF1) of PEP synthases; all 17 Swiss-Prot members are named phosphoenolpyruvate synthase.
