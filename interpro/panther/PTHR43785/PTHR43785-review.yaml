  - id: UniProtKB:P12425
  assessment: UNRESOLVED
  assessment_reason: >-
    The seed is right: B. subtilis GlnA makes glutamine and its review ACCEPTs the IBA. But in PANTHER's
    TreeGrafter table this node (AN227, SF12) passes GO:1901704 down to AN255 (PTN001839150), the PuuA/PauA
    gamma-glutamylpolyamine clade, whose members make gamma-glutamylputrescine rather than glutamine. If
    that clade lacks glutamine-forming activity, the node needs an IRD on AN255 (NEEDS_PRUNING). The missing
    evidence is an assay of PuuA or a PauA enzyme with ammonium as the amine substrate; the cached PuuA
    papers are abstracts that report only putrescine kinetics and sequence similarity to GS. The tree
    topology also had to be inferred from the inherited term list rather than read from the tree.
