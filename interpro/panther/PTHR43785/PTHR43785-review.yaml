    label: Actinomycetales
  paint_snapshot: '20170502'
  seeds:
  - id: UniProtKB:O07752
  assessment: UNRESOLVED
  assessment_reason: >-
    The only seed, O07752, is the unreviewed M. tuberculosis GlnA3 (Rv1878). Its Streptomyces counterpart
    in SF12 is Swiss-Prot curated as a gamma-glutamylpolyamine synthetase (GlnA3, Q9KZC7), so an
    Actinomycetales node asserting glutamine synthetase activity on this lineage may reflect the original GS
    homology call rather than the physiological activity. The missing evidence is the seed's assay: which
    publication supports the experimental GS annotation on O07752, and whether it measured glutamine
    formation from ammonium. Neither is in the cached sources.
