notes: >-
  Node placements (AN227 = PTN000464978, AN236 = PTN001073708, AN255 = PTN001839150, all in SF12) and
  the inherited term lists were read from PANTHER's PAINT_TreeGrafter_Annotations_TOTAL table (release 19
  cache). AN236 and AN255 both list GO:1901704 among their terms, which is the basis for the
  NEEDS_PRUNING concern on PTN000464978. PTN000464978 also appears in the PTHR43407 PAINT slice, through
  leaf IBAs; it is a PTHR43785 node. The two UNRESOLVED nodes and the UNRESOLVED glutamine synthetase scope
  are deliberate: resolving them needs assay evidence, named above, that is not in the cached sources.
