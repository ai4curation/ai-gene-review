family_id: PANTHER:PTHR43785
family_name: GAMMA-GLUTAMYLPUTRESCINE SYNTHETASE
preferred_name: Type I glutamine synthetase and gamma-glutamyl-amine ligase family (GlnA-beta/PuuA lineage)
summary: >-
  Family of type I glutamine synthetase (GS) fold enzymes that ligate L-glutamate to an amine at the
  gamma-carboxyl with ATP. It contains the Firmicutes, archaeal and other GlnA-beta-type glutamine
  synthetases, which use ammonium (B. subtilis GlnA, Staphylococcus, Thermococcus, Methanococcus,
  Haloferax GlnA), and a set of paralogs that use other amines: gamma-glutamylputrescine synthetase PuuA
  (E. coli) and the PuuA-like ligases of Pseudomonas, gamma-glutamylpolyamine synthetases GlnA2/GlnA3
  (Streptomyces, Mycobacterium), gamma-glutamylethanolamide synthetase GlnA4, and glutamate-methylamine and
  glutamate-isopropylamine ligases. B. subtilis GlnA additionally regulates the TnrA and GlnR transcription
  factors in its feedback-inhibited form. The proteobacterial GlnA-alpha enzymes (E. coli, Pseudomonas and
  Azospirillum GlnA) belong to the separate family PTHR43407.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The catalytic chemistry (ATP-dependent gamma-glutamyl amide formation) is shared, but the amine substrate,
  and therefore the activity and pathway, differs: ammonium for the glutamine synthetases (nitrogen
  assimilation) and putrescine, other polyamines, ethanolamine, methylamine or isopropylamine for the
  paralogs (polyamine catabolism, methylamine and isopropylamine utilization). The largest subfamily, SF12
  (TYPE-1 GLUTAMINE SYNTHETASE 2), holds B. subtilis GlnA together with E. coli PuuA, Streptomyces GlnA3
  and GlnA4, Methyloversatilis Gms and Pseudomonas IpuC, so even SF12 membership does not establish
  glutamine synthetase activity.
