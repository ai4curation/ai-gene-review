term_assessments:
- assessed_term:
    id: GO:0004356
    label: glutamine synthetase activity
  scope: UNRESOLVED
  scope_reason: >-
    Glutamine synthetase activity is a member-level property in this family. The ammonium-using GlnA
    enzymes and the gamma-glutamyl-amine ligases (PuuA, GlnA3, GlnA4, Gms, IpuC) are mixed within SF12, and
    no curated residue site separating them has been established here. Family or SF12 membership is
    therefore not evidence of GS activity; B. subtilis GlnA has it from its own biochemistry.
  supported_by:
  - reference_id: file:BACSU/glnA/glnA-uniprot.txt
    supporting_text: It catalyzes the ATP-dependent biosynthesis of glutamine from glutamate and ammonia
  - reference_id: file:interpro/panther/PTHR43785/PTHR43785-entries.csv
    supporting_text: P78061,Gamma-glutamylputrescine synthetase PuuA
  - reference_id: file:interpro/panther/PTHR43785/PTHR43785-entries.csv
    supporting_text: F5RH07,Glutamate--methylamine ligase
- assessed_term:
    id: GO:0006598
    label: polyamine catabolic process
  scope: UNRESOLVED
  scope_reason: >-
    True of the PuuA/PauA clade (PTN001839150) but not of the glutamine synthetases that share SF12 with it;
    no subfamily isolates that clade.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43785/PTHR43785-paint.tsv
    supporting_text: "PTHR43785\tPTN001839150\tGO:0006598\tP\tIBD\tfalse"
