family_id: PANTHER:PTHR43851
family_name: FAMILY NOT NAMED
preferred_name: COQ8/ADCK UbiB-family atypical kinase family
summary: >-
  Mitochondrial UbiB-family atypical kinase-like proteins (S. cerevisiae COQ8, S. pombe coq8, human
  COQ8A/ADCK3 and COQ8B/ADCK4) required for coenzyme Q biosynthesis. Structural and biochemical work
  shows ATPase activity stimulated by lipids and CoQ intermediates; no protein substrate has been
  confirmed, so the kinase activity is unresolved.
functional_coherence: COHERENT
coherence_reason: All three subfamilies are COQ8 orthologs or paralogs acting in CoQ biosynthesis.
