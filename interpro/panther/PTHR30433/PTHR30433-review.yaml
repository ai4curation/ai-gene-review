family_id: PANTHER:PTHR30433
family_name: CHEMOTAXIS PROTEIN MOTA
preferred_name: MotA/PomA flagellar stator ion-channel subunit family
summary: >-
  MotA-family proteins are the four-transmembrane-helix subunits of flagellar stator
  units. Five MotA-type subunits surround a dimer of the peptidoglycan-anchored MotB-type
  subunit, and ion flow through the channel at the conserved MotB aspartate drives
  rotation of the MotA pentamer, whose cytoplasmic loop pushes on FliG to turn the rotor.
  Proton-driven stators (E. coli MotA; B. subtilis MotA; P. putida and P. aeruginosa MotA
  and MotC) and sodium-driven stators (Vibrio PomA, B. subtilis MotP/YtxD) both belong to
  the family. Many bacteria carry two stator systems: P. putida KT2440 uses MotAB and
  MotCD, which contribute differently to swimming in liquid and spreading in semisolid
  agar.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are flagellar stator channel subunits. The coupling ion differs: SF4 (E. coli
  MotA, KT2440 MotA) and SF3 (B. subtilis MotA, H. pylori MotA, P. aeruginosa and KT2440
  MotC) are proton-type, while SF2 mixes sodium-driven PomA and MotP with other stator
  subunits, so an ion-specific transport term is not family-wide.
