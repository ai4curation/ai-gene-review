  name:
    name: Calcium/Cation Antiporter
    short: CaCA
  description:
  - text: The Ca(2+):cation antiporter (CaCA) family is involved in the regulation
      of cytoplasmic Ca(2+) levels and Ca(2+)-dependent cellular processes. Members
      of this family mediate the exchange of Ca(2+) ions against various cations,
      such as Na(+) or protons, across the cell membrane. This exchange contributes
      to processes such as excitation-contraction coupling in muscle, synaptic plasticity,
      learning, memory, and the maintenance of cellular Ca(2+) homeostasis in excitable
      cells. Some subfamily members are involved in vacuolar transport of divalent
      cations like Mg(2+), Zn(2+), and Fe(2+) in plants, which may affect the partitioning
      of these ions between organs. The activity of these exchangers is regulated
      by cytoplasmic Ca(2+) levels and can be modulated by Na(+) ions. The family
      includes subfamilies such as SLC8 and MHX, with members having additional roles
      in embryonic heart development, myelination, mitochondrial Ca(2+) ion homeostasis,
      and protection against light-dependent retinal degeneration.
