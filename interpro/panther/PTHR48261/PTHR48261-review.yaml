family_id: PANTHER:PTHR48261
family_name: ACETYLGLUCOSAMINYLTRANSFERASE
summary: EXT-related glycosyltransferases contribute to extracellular polysaccharide biosynthesis. The
  broader family includes animal heparan-sulfate enzymes and plant glycosyltransferases associated with
  different cell-wall glycans.
functional_coherence: HETEROGENEOUS
coherence_reason: Mammalian EXT1/EXT2 structures and catalytic mutants distinguish active sites within
  a two-protein, four-domain co-polymerase (PMID:36593275). Native fly ttv-PC retains the C-terminal GT-A
  region and its mapped nucleotide-sugar/metal-binding residues, but lacks the N-terminal membrane anchor
  and GT-B region. The retained region has catalytic potential; isolated-domain behavior and missing targeting
  prevent inference of full physiological competence. Plant glycosyltransferases in the broader family
  act on different glycans. Consequently neither heparan-sulfate synthesis nor unconditional intrinsic
  glycosyltransferase activity is established for every classified protein.
