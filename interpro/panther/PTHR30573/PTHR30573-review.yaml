family_id: PANTHER:PTHR30573
family_name: QUINOLINATE SYNTHETASE A
preferred_name: Quinolinate synthase (NadA) family
summary: >-
  [4Fe-4S] cluster quinolinate synthases that condense iminoaspartate with
  dihydroxyacetone phosphate to form quinolinate in the L-aspartate de novo NAD+
  pathway. All reviewed members in the release used here fall in the single
  subfamily SF0, spanning bacteria (E. coli, B. subtilis, M. tuberculosis,
  P. putida NadA) and plant plastid quinolinate synthase; PANTHER labels SF0 by
  its chloroplastic plant member.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily of quinolinate synthases; experimentally characterized
  members from bacteria and plants share the reaction.
reference_protein:
  id: UniProtKB:P11458
  label: Quinolinate synthase
  gene_symbol: nadA
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/nadA/nadA-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR30573:SF0
  label: QUINOLINATE SYNTHASE, CHLOROPLASTIC
  description: >-
    Bacterial and plastid quinolinate synthases; despite the plant-derived
    PANTHER name, it contains the bacterial NadA enzymes.
  representative_members:
  - id: UniProtKB:P11458
    gene_symbol: nadA
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/nadA/nadA-ai-review.yaml
  - id: UniProtKB:Q88NH8
    gene_symbol: nadA
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/nadA/nadA-ai-review.yaml
  diverged_from_family: false
