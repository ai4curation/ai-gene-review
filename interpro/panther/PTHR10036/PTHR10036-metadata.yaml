  name:
    name: nAChRs Modulators and MAC Inhibitors
    short: nAChRs-MAC_Inhibitors
  description:
  - text: The protein family is characterized by its role in modulating the activity
      of nicotinic acetylcholine receptors (nAChRs) and inhibiting the complement
      membrane attack complex (MAC). Members of the family are believed to increase
      receptor desensitization and decrease affinity for acetylcholine in nAChRs,
      potentially affecting intracellular trafficking and cell surface expression
      of these receptors. This may be linked to the control of anxiety. Other members
      are potent inhibitors of MAC, preventing the formation of the osmolytic pore
      by binding to C8 and/or C9 components, which is crucial for protecting cells
      from lysis by the complement system. The family includes proteins with a role
      in signal transduction for T-cell activation and may exhibit species-specific
      inhibition of MAC.
