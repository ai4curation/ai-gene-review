family_id: PANTHER:PTHR10036
family_name: CD59 GLYCOPROTEIN
preferred_name: Ly6/uPAR-domain CD59, LYPD1 and sleepless-like proteins
summary: >-
  PTHR10036 is a small, functionally heterogeneous Ly6/uPAR-domain family. The mammalian CD59 branch
  comprises GPI-anchored terminal-complement regulators that bind nascent C5b-8/C5b-9 membrane-attack
  complexes and block pore formation. The LYPD1 branch encodes GPI-anchored modulators of neuronal
  nicotinic acetylcholine receptors. A separate SLURP1/sleepless-like PAINT branch carries nicotinic
    receptor activator activity seeded from human SLURP1, and the reviewed member inventory also includes
    centipede toxin-like sleepless-related proteins. PAINT already keeps the CD59
  complement terms and LYPD1 nicotinic receptor terms on separate nodes.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared feature is the Ly6/uPAR three-finger fold, not one conserved activity. CD59 subfamily
  members are terminal-complement MAC inhibitors, LYPD1 subfamily members inhibit/modulate nicotinic
  acetylcholine receptors, and the separate SLURP1-seeded branch carries acetylcholine receptor
  activator activity. The PANTHER family therefore needs subfamily-scoped PAINT assertions rather than
  any family-wide GO propagation.
