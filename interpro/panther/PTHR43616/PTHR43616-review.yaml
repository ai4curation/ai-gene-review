family_id: PANTHER:PTHR43616
family_name: GLYCEROL DEHYDROGENASE
preferred_name: Iron-containing glycerol dehydrogenase / glycerol-1-phosphate dehydrogenase family
summary: >-
  Iron-activated (type III) polyol dehydrogenases. Glycerol dehydrogenases (S. pombe gld1, E. coli
  GldA, DhaD) oxidize glycerol to dihydroxyacetone. Most Swiss-Prot members of SF5 are archaeal sn-glycerol-1-phosphate
  dehydrogenases (EgsA) that make the archaeal lipid backbone. SF3 holds E. coli HcxA hydroxycarboxylate
  dehydrogenase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrates differ: glycerol (GldA/gld1/DhaD), glycerol 1-phosphate (EgsA, same subfamily SF5) and
  hydroxycarboxylates (SF3).
