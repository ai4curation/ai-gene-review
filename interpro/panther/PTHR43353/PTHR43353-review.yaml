- assessed_term:
    id: GO:0036243
    label: succinate-semialdehyde dehydrogenase (NADP+) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The NADP-linked child of the family's succinate-semialdehyde dehydrogenase activity. The SSADHs of
    this family are generally dual-cofactor enzymes rather than NADP-specific ones, so this term is a
    cofactor branch of their single reaction and not a separate activity: it is retained by ssd1 and
    UGA2 in SF5 and by ssd2 in SF12, and the Cupriavidus necator GabD clone (Q9RBF6) has measured
    NADP-supported and NAD-supported activity on the same substrate. It is therefore in scope for the
    same two subfamilies as the cofactor-general term, and a member should carry it alongside, not
    instead of, GO:0009013 unless its own assays show NADP specificity. The DavD-type members excepted
    from the cofactor-general term are equally outside this one, since the exception is about substrate,
    not acceptor.
  applicable_subfamilies:
  - id: PANTHER:PTHR43353:SF5
    label: SUCCINATE-SEMIALDEHYDE DEHYDROGENASE, MITOCHONDRIAL
  - id: PANTHER:PTHR43353:SF12
    label: SUCCINATE-SEMIALDEHYDE DEHYDROGENASE C139.05 [NADP(+)]-RELATED
  member_exceptions:
  - member:
      id: UniProtKB:Q88RC0
      gene_symbol: davD
      organism: Pseudomonas putida KT2440
    exception_reason: >-
      DavD oxidises glutarate semialdehyde, so neither cofactor branch of the succinate-semialdehyde
      reaction holds for it.
    supported_by:
    - reference_id: file:genes/PSEPK/davD/davD-ai-review.yaml
      supporting_text: Family membership does not override the exact 5-oxopentanoate reaction assigned
        to DavD
  supported_by:
  - reference_id: file:genes/SCHPO/ssd1/ssd1-ai-review.yaml
    supporting_text: 'Rhea mapping (RHEA:13213, NADP+ reaction); consistent with dual cofactor use inferred
      from Uga2.'
  - reference_id: file:genes/CUPNE/gabD/gabD-ai-review.yaml
    supporting_text: GabD oxidizes succinate semialdehyde with both NADP and NAD under the reported assay
      conditions.
- assessed_term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The KGSADH (EC 1.2.1.26) members of SF3 oxidise 2,5-dioxopentanoate to 2-oxoglutarate. UniProt
    curates this reaction for A. baylyi KgsD from the biochemical characterization of the purified
    enzyme (PMID:18364348), and the KT2440 paralog PP_1256 is assigned the same reaction and carries
    the KGSADH subgroup signature IPR044151. The activity does not extend to the SSADH subfamilies
    SF5 and SF12, which act on succinate semialdehyde. Within SF3 it is not family-wide: the
    subfamily also holds aldehyde dehydrogenases with other substrates, so each member is judged on
    its own signature and gene neighbourhood. A. brasilense has both an NAD+-preferring (KGSADH-II)
    and an NADP+-preferring (KGSADH-III) isozyme for this substrate, so the cofactor branch of the
    term is weaker than the substrate claim and a member may warrant a cofactor-neutral term when GO
    provides one.
  applicable_subfamilies:
  - id: PANTHER:PTHR43353:SF3
    label: ALDEHYDE DEHYDROGENASE-RELATED
  supported_by:
  - reference_id: file:genes/ACIAD/ACIAD0131/ACIAD0131-uniprot.txt
    supporting_text: >-
      Reaction=2,5-dioxopentanoate + NADP(+) + H2O = 2-oxoglutarate + NADPH +
  - reference_id: file:genes/PSEPK/PP_1256/PP_1256-ai-review.yaml
    supporting_text: "DR   InterPro; IPR044151; ALDH_KGSADH."
  - reference_id: PMID:17202142
    supporting_text: "NAD(+)-dependent KGSADH-II and NADP(+)-dependent KGSADH-III"
- assessed_term:
    id: GO:0102810
    label: glutarate-semialdehyde dehydrogenase (NADP+) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Glutarate-semialdehyde dehydrogenase for the DavD clade of SF5, as lysine_dav_catabolism selects.
  applicable_subfamilies:
  - id: PANTHER:PTHR43353:SF5
    label: SUCCINATE-SEMIALDEHYDE DEHYDROGENASE, MITOCHONDRIAL
  supported_by:
  - reference_id: file:genes/PSEPK/davD/davD-ai-review.yaml
    supporting_text: Correct enzyme-specific molecular function.
