- assessed_term:
    id: GO:0036243
    label: succinate-semialdehyde dehydrogenase (NADP+) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The NADP-linked child of the family's succinate-semialdehyde dehydrogenase activity. The SSADHs of
    this family are generally dual-cofactor enzymes rather than NADP-specific ones, so this term is a
    cofactor branch of their single reaction and not a separate activity: it is retained by ssd1 and
    UGA2 in SF5 and by ssd2 in SF12, and the Cupriavidus necator GabD clone (Q9RBF6) has measured
    NADP-supported and NAD-supported activity on the same substrate. It is therefore in scope for the
    same two subfamilies as the cofactor-general term, and a member should carry it alongside, not
    instead of, GO:0009013 unless its own assays show NADP specificity. The DavD-type members excepted
    from the cofactor-general term are equally outside this one, since the exception is about substrate,
    not acceptor.
  applicable_subfamilies:
  - id: PANTHER:PTHR43353:SF5
    label: SUCCINATE-SEMIALDEHYDE DEHYDROGENASE, MITOCHONDRIAL
  - id: PANTHER:PTHR43353:SF12
    label: SUCCINATE-SEMIALDEHYDE DEHYDROGENASE C139.05 [NADP(+)]-RELATED
