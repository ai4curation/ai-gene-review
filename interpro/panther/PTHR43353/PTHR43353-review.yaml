- assessed_term:
    id: GO:0047533
    label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The KGSADH (EC 1.2.1.26) members of SF3 oxidise 2,5-dioxopentanoate to 2-oxoglutarate. UniProt
    curates this reaction for A. baylyi KgsD from the biochemical characterization of the purified
    enzyme (PMID:18364348), and the KT2440 paralog PP_1256 is assigned the same reaction and carries
    the KGSADH subgroup signature IPR044151. The activity does not extend to the SSADH subfamilies
    SF5 and SF12, which act on succinate semialdehyde. Within SF3 the substrate claim does hold
    subfamily-wide: re-deriving the membership from the entries CSV gives five KGSADHs out of six
    Swiss-Prot members, and the one member on another substrate, V. harveyi aldH, is recorded as a
    member exception below rather than left implicit. The cofactor branch of this term is the weaker
    half: A. brasilense has both an NAD+-preferring (KGSADH-II) and an NADP+-preferring (KGSADH-III)
    isozyme for this substrate, so a member with no assay of its own warrants a cofactor-neutral
    term, and the two such members are excepted below.
