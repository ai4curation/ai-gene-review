  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The SSADH recipients that have been reviewed retain this IBA: ALDH5A1 (human), UGA2 (yeast), ssd1
    and ssd2 (SCHPO). The node is deep, however: in the current PANTHER tree it covers 162 of 175
    leaves across seven subfamilies, and within SF5 it holds members whose substrate is not succinate
    semialdehyde. The clade PTN000192659 below it contains, besides E. coli and Salmonella GabD,
    E. coli lactaldehyde dehydrogenase AldA and P. aeruginosa glutarate-semialdehyde dehydrogenase
    DavD, and the P. putida SQ1 SLA dehydrogenase P0DOV9 is grafted into that clade, from which it
    receives GO:0004777 by TreeGrafter. P0DOV9 oxidizes succinate semialdehyde in vitro (kinetic
    constants were measured with it as a surrogate because pure SLA was unavailable), but its
    demonstrated role is SLA oxidation in sulfoquinovose catabolism, and its review marks the row as
    over-annotated. The term is right for the SSADH lineages and needs losses on the DavD, AldA and
    SLA-dehydrogenase lineages rather than a different node. For the sulfo-ED module, this node is
    not a valid grounding of the SLA dehydrogenase annoton. No subfamily is named as affected,
    because SF5 holds both the genuine SSADHs (ALDH5A1, UGA2, ssd1, GabD) and P0DOV9, so the pruning
    falls on lineages inside SF5 rather than on the subfamily as a whole.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43353/PTHR43353-paint.tsv
    supporting_text: "PTHR43353\tPTN008681047\tGO:0004777\tF\tIBD\tfalse"
