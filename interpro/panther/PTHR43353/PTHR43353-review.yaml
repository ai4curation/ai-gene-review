    supported_by:
    - reference_id: file:genes/PSEPK/PP_3602/PP_3602-ai-review.yaml
      supporting_text: >-
        PP_3602 has KGSADH-family aldehyde dehydrogenase chemistry with unresolved NAD+ versus NADP+ usage.
  supported_by:
