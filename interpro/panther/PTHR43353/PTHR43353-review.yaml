  scope: SUBFAMILY_ONLY
  scope_reason: >-
    NAD+-dependent oxidation of an aldehyde to its carboxylate is established for most SF5 members,
    whatever their aldehyde: the SSADHs ALDH5A1, ALDH5F1, UGA2, ssd1, Paenarthrobacter Sad and
    Acinetobacter TgnE, lactaldehyde dehydrogenase AldA, alpha-ketoglutaric semialdehyde dehydrogenase
    AraE, 3,6-anhydro-L-galactose dehydrogenase Vejahgd, the 4-formylbenzenesulfonate dehydrogenases
    TsaD1/TsaD2, the AstD N-succinylglutamate semialdehyde dehydrogenases and the P. putida SQ1
    3-sulfolactaldehyde dehydrogenase P0DOV9 (RHEA:47932), for which this term is the rhea2go mapping
    and the sulfo-ED module's function. Each of the 35 SF5 inventory members was checked against its
    UniProt catalytic-activity annotation; the ten members for which only an NADP+-linked reaction is
    curated are excepted by name, because the cofactor is not predicted by membership. SF3 and SF12
    were not assessed.
