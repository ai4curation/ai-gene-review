review_status: COMPLETE
reviewed_by: Claude (AI-assisted)
review_date: '2026-11-11'
notes: >-
  lysine_dav_catabolism and gaba_shunt both select the whole family, for different activities; SF5
  must be split below subfamily level to separate DavD from the SSADHs. The 2026-11-11
  hydroxyproline-catabolism pass marks SF3 as diverged and records its KGSADH (EC 1.2.1.26) members,
  A. baylyi KgsD and KT2440 PP_1256, with the 2,5-dioxovalerate dehydrogenase activity scoped to that
  subfamily. SF3 remains heterogeneous, so membership alone does not establish the KGSADH substrate
  for a new member.
