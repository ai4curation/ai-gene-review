family_id: PANTHER:PTHR43353
family_name: SUCCINATE-SEMIALDEHYDE DEHYDROGENASE, MITOCHONDRIAL
preferred_name: Succinate-semialdehyde dehydrogenase (ALDH5A1/GabD) family
summary: >-
  NAD(P)-dependent aldehyde dehydrogenases. Succinate-semialdehyde dehydrogenases (human ALDH5A1,
  S. cerevisiae UGA2, S. pombe ssd1/ssd2, bacterial GabD) close the GABA shunt. P. putida paralogs
  in the same subfamily oxidise glutarate semialdehyde (DavD) or other aldehydes, and the
  Pseudomonas putida SQ1 3-sulfolactaldehyde (SLA) dehydrogenase of the sulfoglycolytic
  Entner-Doudoroff pathway (P0DOV9) is also an SF5 member: it oxidizes SLA to 3-sulfolactate with
  NAD+ or NADP+, and oxidizes succinate semialdehyde only as an in vitro surrogate substrate.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF5 and SF12 are mostly succinate-semialdehyde dehydrogenases, but SF5 also holds bacterial paralogs
  with other aldehyde substrates; SF3 holds other aldehyde dehydrogenases.
