notes: >-
  lysine_dav_catabolism and gaba_shunt both select the whole family, for different activities; SF5
  must be split below subfamily level to separate DavD from the SSADHs. The 2026-11-11
  hydroxyproline-catabolism pass marks SF3 as diverged and records its KGSADH (EC 1.2.1.26) members,
  A. baylyi KgsD and KT2440 PP_1256, with the 2,5-dioxovalerate dehydrogenase activity scoped to that
  subfamily. SF3 remains heterogeneous, so membership alone does not establish the KGSADH substrate
  for a new member. The glucarate/galactarate module pass adds KT2440 PP_3602 as an SF3
  representative and the FAMILY_WIDE cofactor-neutral GO:0004030 assessment used by that module.
  The GO:0047533 assessment, its two member exceptions and the GO:0004030 assessment are taken from
  that pass so the two branches agree; only the PP_3602 exception quote differs, because the wording
  quoted there exists on the glucarate branch alone, so an equivalent line from the PP_3602 review as
  it stands here is quoted instead. A Q88NF5 (PP_1256) exception was added for parity with the
  Q88GW5 one, since both are unassayed KGSADHs whose reviews decline the NADP+ branch, and the
  scope_reason was rewritten to match the exceptions: the earlier wording said the subfamily holds
  other-substrate members in the plural, where the re-derivation finds one. The subfamily's routes
  are given as aldarate and hydroxyproline, the two its named members support; the L-arabinose
  enzyme KGSADH-I is reported as poorly related to KGSADH-II and KGSADH-III, so it is not claimed
  here. The hydroxyproline pass adds A. brasilense LhpG (KGSADH-III), the
  one characterized terminal dehydrogenase of the hydroxyproline route, as an SF3 representative, and
  cites its dual-cofactor kinetics: they are why a member with no assay of its own should not take
  either cofactor child.

  From the sulfoquinovose-catabolism pass, merged from main: Updated for
  modules/bacterial_sulfoquinovose_catabolism.yaml, whose sulfo-ED SLA dehydrogenase annoton uses
  P0DOV9 (SF5) with GO:0004029: the PTN008681047 SSADH and GABA-catabolism nodes were re-assessed as
  NEEDS_PRUNING after checking their clades in the PANTHER treeinfo tree, and a GO:0004029 term
  assessment was added for SF5. Both of those are kept here in full. They concern SF5 and the
  NAD+-specific term, where the hydroxyproline work concerns SF3 and the 2,5-dioxopentanoate
  substrate, so the two do not overlap. The GO:0004030 FAMILY_WIDE assessment is consistent with
  those pruning verdicts as well, because it asserts only that every member oxidizes an aldehyde
  with NAD+ or NADP+, not which aldehyde or which cofactor: pruning the SSADH and GABA-catabolism
  assertions from parts of the SF5 clade leaves that parent claim untouched. Two lines from that
  pass are deliberately superseded rather than kept: SF3's one-line description and its
  diverged_from_family: false, because the re-derived membership shows SF3 is a KGSADH subfamily
  that has diverged from the family's SSADH core.
