  diverged_from_family: false
- subfamily_id: PANTHER:PTHR43353:SF3
  label: ALDEHYDE DEHYDROGENASE-RELATED
  description: >-
    Mostly alpha-ketoglutaric semialdehyde dehydrogenases (KGSADH, EC 1.2.1.26)
    that oxidize 2,5-dioxopentanoate to 2-oxoglutarate in the convergent
    oxidative aldarate and hydroxyproline routes. Five of the six
    Swiss-Prot members are KGSADHs (A. baylyi KgsD/ACIAD0131, P. aeruginosa
    PA2217, Cupriavidus KgsD, Azospirillum KGSADH-II and LhpG/KGSADH-III); the
    sixth is the Vibrio harveyi NADP-dependent fatty aldehyde dehydrogenase
    AldH. Also includes the KT2440 paralogs PP_1256, PP_2585 and PP_3602.
  diverged_from_family: true
  divergence_description: >-
    The KGSADH members act on 2,5-dioxopentanoate, not succinate semialdehyde, and serve the
    convergent aldarate and hydroxyproline routes into 2-oxoglutarate rather than the
    GABA shunt. Succinate-semialdehyde dehydrogenase terms must not be transferred to them.
    Characterized isozymes differ in NAD+ versus NADP+ preference.
  supported_by:
