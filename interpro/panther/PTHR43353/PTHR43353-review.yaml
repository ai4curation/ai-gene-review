subfamilies:
- subfamily_id: PANTHER:PTHR43353:SF5
  label: SUCCINATE-SEMIALDEHYDE DEHYDROGENASE, MITOCHONDRIAL
  description: SSADH and bacterial paralogs (ALDH5A1, UGA2, ssd1, GabD, DavD).
  representative_members:
  - id: UniProtKB:P51649
    gene_symbol: ALDH5A1
    organism: Homo sapiens
    gene_review: genes/human/ALDH5A1/ALDH5A1-ai-review.yaml
  diverged_from_family: true
  divergence_description: P. putida DavD (glutarate semialdehyde) and PP_3443 share SF5 with the
    SSADHs.
- subfamily_id: PANTHER:PTHR43353:SF12
  label: SUCCINATE-SEMIALDEHYDE DEHYDROGENASE C139.05 [NADP(+)]-RELATED
  description: S. pombe ssd2.
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR43353:SF3
  label: ALDEHYDE DEHYDROGENASE-RELATED
  description: >-
    Mostly alpha-ketoglutaric semialdehyde dehydrogenases (KGSADH, EC 1.2.1.26)
    of oxidative aldarate, L-arabinose and hydroxyproline catabolism: five of
    the six Swiss-Prot members (A. baylyi ACIAD0131, P. aeruginosa PA2217,
    Cupriavidus KgsD, Azospirillum KGSADH-II and LhpG/KGSADH-III). The sixth is
    the Vibrio harveyi NADP-dependent fatty aldehyde dehydrogenase AldH. Also
    includes the uncharacterized P. putida KT2440 paralogs PP_1256, PP_2585 and
    PP_3602.
  representative_members:
  - id: UniProtKB:Q6FFQ0
    label: Alpha-ketoglutaric semialdehyde dehydrogenase
    gene_symbol: ACIAD0131
    organism: Acinetobacter baylyi ADP1
    gene_review: genes/ACIAD/ACIAD0131/ACIAD0131-ai-review.yaml
  - id: UniProtKB:Q88GW5
    gene_symbol: PP_3602
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/PP_3602/PP_3602-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    The KGSADH members oxidize 2,5-dioxopentanoate (alpha-ketoglutaric
    semialdehyde) to 2-oxoglutarate rather than succinate semialdehyde;
    characterized isozymes differ in NAD+ versus NADP+ preference.
