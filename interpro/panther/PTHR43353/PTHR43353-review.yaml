- subfamily_id: PANTHER:PTHR43353:SF3
  label: ALDEHYDE DEHYDROGENASE-RELATED
  description: >-
    Other aldehyde dehydrogenases, including the alpha-ketoglutaric semialdehyde dehydrogenases
    (KGSADH, EC 1.2.1.26) that oxidise 2,5-dioxopentanoate to 2-oxoglutarate: Acinetobacter baylyi
    KgsD and the KT2440 paralogs PP_1256, PP_2585 and PP_3602.
  diverged_from_family: true
  divergence_description: >-
    The KGSADH members act on 2,5-dioxopentanoate, not succinate semialdehyde, and serve the
    convergent aldarate, L-arabinose and hydroxyproline routes into 2-oxoglutarate rather than the
    GABA shunt. Succinate-semialdehyde dehydrogenase terms must not be transferred to them.
  supported_by:
