node_assessments:
  - node_id: PANTHER:PTN000093787
    asserted_term:
      id: GO:0032420
      label: stereocilium
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20220323"
    seeds:
      - id: MGI:MGI:1914609
        label: Lipoxygenase homology domain-containing protein 1
        gene_symbol: Loxhd1
        organism: Mus musculus (Mouse)
    assessment: SOUND
    assessment_reason: >-
      Seeded by the mouse experimental localization: LOXHD1 is expressed along the
      membrane of mature hair-cell stereocilia (PMID:19732867), later refined to
      enrichment at row 2/3 stereocilium tips (PMID:39256406). The single-seed WITH/FROM
      is not weak support - the node claim is a considered phylogenetic judgment, and
      the human ortholog inside the Amniota clade correctly receives the IBA (GOA row
      dated 20220323), concordant with its similarity-based UniProt localization and
      the human review's ACCEPT. Scoping to Amniota is conservative (stereocilia exist
      in all vertebrate hair cells) but errs safely: it keeps the term off the
      uncharacterized invertebrate members, which lack stereocilia.
  - node_id: PANTHER:PTN000093787
    asserted_term:
      id: GO:0007605
      label: sensory perception of sound
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20220323"
    seeds:
      - id: MGI:MGI:1914609
        label: Lipoxygenase homology domain-containing protein 1
        gene_symbol: Loxhd1
        organism: Mus musculus (Mouse)
      - id: UniProtKB:Q8IVV2
        label: Lipoxygenase homology domain-containing protein 1
        gene_symbol: LOXHD1
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Seeded by direct loss-of-function evidence in both species: the samba mouse
      mutant perturbs hair-cell function, and human LOXHD1 mutation causes DFNB77
      progressive hearing loss (PMID:19732867), reinforced by later mouse
      mechanotransduction physiology (PMID:33707295, PMID:39256406). The human gene
      appearing in its own WITH/FROM is expected - its IMP annotation is one of the
      descendant evidences behind the IBD - and the human gene receives the resulting
      IBA (GOA row dated 20220323). Amniota-level placement keeps this
      hearing-specific term away from the uncharacterized invertebrate subfamilies,
      which is exactly the right scoping for a family whose name-giving members are
      nematode proteins with no auditory system.

term_assessments:
  - assessed_term:
      id: GO:0050910
      label: detection of mechanical stimulus involved in sensory perception of sound
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Mouse Loxhd1 deletion drastically reduces inner-hair-cell mechanotransduction
      currents (PMID:33707295) and displaces TMC1 from the stereociliary
      force-reception site (PMID:39256406), so this sensory-transduction-step term is
      well supported for the amniote LOXHD1 clade and would be a sound, more precise
      addition to a future PAINT curation at or below PTN000093787. It must not be
      placed family-wide: the other subfamilies are uncharacterized and mostly from
      lineages without cochlear hair cells.
    applicable_subfamilies:
      - id: PANTHER:PTHR45901:SF3
        label: LIPOXYGENASE HOMOLOGY DOMAIN-CONTAINING PROTEIN 1
    supported_by:
      - reference_id: PMID:33707295
        supporting_text: >-
          Using two mouse mutants of LOXHD1-PLAT10, we demonstrated here that inner hair cell
          (IHC) mechanotransduction currents were drastically reduced at P11, in contrast to
          the wild-type (WT)-like MET currents observed at P7.
      - reference_id: PMID:39256406
        supporting_text: >-
          Overall, these SUB-immunogold-SEM experiments support that LOXHD1 is required for
          the maintenance of TMC1 in IHC stereocilia. Importantly, LOXHD1 is also critical for
          maintenance of TMC1 within the first 100 nm of the row 2 tips, where the tip links
          insert and where the mechanical stimuli are received.
  - assessed_term:
      id: GO:0032426
      label: stereocilium tip
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Super-resolution and SUB-immunogold-SEM localization places mouse LOXHD1 at row 2
      and row 3 stereocilium tips (PMID:39256406), refining the existing stereocilium
      IBD. Safe only for the LOXHD1 subfamily, for the same taxonomic reasons as the
      parent term.
    applicable_subfamilies:
      - id: PANTHER:PTHR45901:SF3
        label: LIPOXYGENASE HOMOLOGY DOMAIN-CONTAINING PROTEIN 1
    supported_by:
      - reference_id: PMID:39256406
        supporting_text: >-
          LOXHD1-HA can clearly be detected at the tip of row 2 stereocilia (arrowheads in
          insets) of apical P11 and P21 IHCs.
  - assessed_term:
      id: GO:0007605
      label: sensory perception of sound
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Already asserted by PAINT at the Amniota-scoped node PTN000093787 and adjudicated
      SOUND there. Recorded here at family level to make explicit that the term is safe
      only for the LOXHD1 subfamily and must never migrate to the family root, whose
      name-giving nematode members have no auditory system.
    applicable_subfamilies:
      - id: PANTHER:PTHR45901:SF3
        label: LIPOXYGENASE HOMOLOGY DOMAIN-CONTAINING PROTEIN 1
    supported_by:
      - reference_id: PMID:19732867
        supporting_text: >-
          Based on the studies in mice, we screened DNA from human families segregating
          deafness and identified a mutation in LOXHD1, which causes DFNB77, a progressive
          form of autosomal-recessive nonsyndromic hearing loss (ARNSHL).

references:
  - id: PMID:19732867
    title: Mutations in LOXHD1, an evolutionarily conserved stereociliary protein, disrupt hair cell function in mice and cause progressive hearing loss in humans.
  - id: PMID:33707295
    title: Loxhd1 Mutations Cause Mechanotransduction Defects in Cochlear Hair Cells.
  - id: PMID:39256406
    title: LOXHD1 is indispensable for maintaining TMC1 auditory mechanosensitive channels at the site of force transmission.

review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Reviewed for the PAINT "human no-IBA" project, but the premise does not hold for this
  family: the cached PTHR45901-paint.tsv carries two IBD rows at PTN000093787 dated
  20220323, and the human gene's current GOA contains matching IBA rows for
  GO:0032420 and GO:0007605 (both dated 20220323, both ACCEPTed in the gene review).
  LOXHD1 has therefore received IBA annotations since 2022; the no-IBA listing reflects
  an earlier snapshot or different selection criteria. The existing PAINT curation is
  correct but coarse relative to current evidence: the 2021/2024 mouse work
  (PMID:33707295, PMID:39256406) supports the finer terms recorded in term_assessments
  (detection of mechanical stimulus involved in sensory perception of sound;
  stereocilium tip) at the LOXHD1 clade. No enzymatic term should ever be mapped to
  this family despite the lipoxygenase-homology name: PLAT/LH2 is a lipid/membrane-
  associated beta-sandwich, and no catalytic residues, reaction or substrate have been
  demonstrated for any member. Node ids, seeds, taxa and snapshot dates are verbatim
  from the cached PTHR45901-paint.tsv; taxon:32524 is expanded to NCBITaxon:32524
  (Amniota). No residue_sites: no catalytic or point-residue claim is at stake for a
  non-enzymatic repeat protein. The subfamily inventory beyond SF3 is not enumerated in
  the cached entries slice (metadata records 3 subfamilies), so only SF3 is listed.
