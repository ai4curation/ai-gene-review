family_id: PANTHER:PTHR45901
family_name: PROTEIN CBG12474
preferred_name: LOXHD1 / PLAT-repeat (lipoxygenase-homology domain) protein family
summary: >-
  Family of large multi-PLAT-repeat (lipoxygenase homology / LH2 domain) proteins,
  integrated as InterPro IPR052970 ("Inner ear hair cell lipoxygenase homology
  domain-containing protein"). The only experimentally characterized clade is the
  amniote LOXHD1 subfamily (PTHR45901:SF3): mouse and human LOXHD1 are nonenzymatic
  stereociliary proteins of cochlear hair cells, localized along the stereociliary
  membrane and enriched at the tips of the shorter (row 2/3) stereocilia, where LOXHD1
  is required to maintain the TMC1 mechanotransduction channel near the lower tip-link
  insertion and to preserve mature mechanotransduction currents. Biallelic human LOXHD1
  variants cause DFNB77 progressive autosomal-recessive nonsyndromic hearing loss;
  mouse mutants lose inner-hair-cell mechanotransduction currents after the first
  postnatal week. Despite the "lipoxygenase homology" name, no catalytic activity,
  substrate or reaction has been demonstrated for any member. PANTHER's official family
  name derives from an uncharacterized Caenorhabditis briggsae protein (CBG12474),
  reflecting a broad family (4074 proteins, ~3327 taxa, 3 subfamilies in InterPro) in
  which most members - including the nematode-type members - are functionally
  uncharacterized, so hearing- and stereocilium-specific terms cannot be extended
  beyond the vertebrate LOXHD1 clade.
functional_coherence: UNKNOWN
coherence_reason: >-
  Only one clade (the amniote LOXHD1 subfamily, SF3) has any experimental functional
  characterization; the remaining subfamilies, including the nematode CBG12474-type
  members that give the family its PANTHER name, are uncharacterized. The shared
  PLAT-repeat architecture suggests a common membrane-associated role, but there is no
  evidence for or against conservation of the auditory mechanotransduction function
  outside vertebrates, so family-wide coherence cannot be judged.
