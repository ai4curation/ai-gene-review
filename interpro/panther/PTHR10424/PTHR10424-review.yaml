family_id: PANTHER:PTHR10424
family_name: VIRAL ENVELOPE PROTEIN
preferred_name: Retroviral envelope proteins (endogenous retrovirus env and syncytins)
summary: >-
  PTHR10424 groups envelope glycoproteins of endogenous retroviruses. Some were captured by mammalian
  lineages as syncytins, which mediate cell-cell fusion in the placenta and, at least ex vivo, contribute
  to myoblast fusion.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members derive from retroviral env; captured syncytins have host fusion roles, while many other copies
  are not known to function.
node_assessments:
- node_id: PANTHER:PTN007440286
  asserted_term:
    id: GO:0007520
    label: myoblast fusion
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN002572584
    label: PTN002572584 (ancestral IBD node; IRD source)
  paint_snapshot: '20260731'
  node_taxon:
    id: NCBITaxon:9347
    label: Eutheria
  assessment: LOSS_CONTRADICTED
  proposed_action:
    paint_action: REMOVE_LOSS
  assessment_reason: >-
    PTN007440286 is a eutherian endogenous retrovirus env clade (39 leaves, SF8) that includes the ruminant
    syncytin-Rum1 and the carnivore syncytin-Car1. In the study behind the conflicting row (PMID:27589388),
    ex vivo myoblast fusion assays with human, sheep and dog myoblasts showed that syncytins from ruminants,
    carnivores and humans contribute to myoblast fusion. The evidence is ex vivo and the paper names that
    limitation, but it is direct evidence against a loss at this node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10424/PTHR10424-paint.tsv
    supporting_text: "PTHR10424\tPTN007440286\tGO:0007520\tP\tIRD\ttrue"
  - reference_id: PMID:27589388
    supporting_text: >-
      syncytins from ruminants, carnivores and humans contribute to myoblast fusion, at least in ex vivo
      assays.
