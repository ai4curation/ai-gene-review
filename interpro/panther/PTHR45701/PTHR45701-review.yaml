notes: >-
  Reviewed members examined: human VAMP2 and C. elegans snb-1. Both accept every
  IBA they receive from this family. Which PAINT nodes reach them was read from
  the PTN ids in their GOA IBA rows. No subfamilies are listed: the fetched
  entries file carries no subfamily assignments for this family and neither
  UniProt record names a subfamily, so membership could not be checked. Nodes
  PTN002326545 and PTN002501393 (VAMP7-like clade), PTN002721549 (fungal vacuole
  fusion) and PTN002904965 (VAMP8, mucin granule and mucus secretion) were read
  but not adjudicated; VAMP1, VAMP3, VAMP5, VAMP7, VAMP8 and the plant and yeast
  members were not examined. GO:0005484 is labelled "helical-bundle zippering
  fusogenic activity" in current GOA/QuickGO; the local ontology snapshot used by
  the validators still has "SNAP receptor activity", which is used here.
