family_id: PANTHER:PTHR45701
family_name: SYNAPTOBREVIN FAMILY MEMBER
preferred_name: Synaptobrevin/VAMP R-SNAREs
summary: >-
  R-SNAREs of the synaptobrevin/VAMP family: tail-anchored vesicle proteins whose
  single SNARE motif supplies the arginine-containing R-helix of the four-helix
  trans-SNARE bundle that drives membrane fusion. The family includes the
  neuronal synaptobrevins (human VAMP1 and VAMP2, C. elegans SNB-1, Drosophila
  n-Syb), the ubiquitous VAMP3, VAMP8, VAMP5, yeast Snc1/Snc2, and the
  longin-domain VAMP7 clade with its plant and yeast (Nyv1) relatives. The SNARE
  activity is shared; the compartment and trafficking route differ between
  clades, and PAINT records those differences on separate nodes.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The R-SNARE fusogenic activity, SNARE-complex membership and syntaxin pairing
  are shared by the characterized members. The clades diverge in where they act:
  synaptobrevins on synaptic and secretory vesicles fusing with the plasma
  membrane, VAMP8 on endosomes and secretory granules, VAMP7 on late endosomes
  and lysosomes, yeast Nyv1 at the vacuole. PAINT places these compartment and
  process terms on clade-level nodes rather than at the root, which is
  consistent with this divergence.
