family_id: PANTHER:PTHR22988
family_name: MYOTONIC DYSTROPHY S/T KINASE-RELATED
preferred_name: DMPK-related AGC serine/threonine kinases
summary: 'PTHR22988 is a heterogeneous AGC serine/threonine kinase family containing Rho-associated kinases,
  myotonic dystrophy kinase-related CDC42-binding kinases, citron kinase, DMPK and NDR kinases. This review
  covers the human ROCK/MRCK effector slice: ROCK1 and ROCK2 are RHOA/RHOB/RHOC-regulated actomyosin kinases,
  whereas CDC42BPA, CDC42BPB and CDC42BPG are CDC42-related MRCK kinases.'
functional_coherence: HETEROGENEOUS
coherence_reason: Protein serine/threonine kinase activity is broadly conserved, but the upstream
  small GTPase and biological outputs differ between the Rho-dependent ROCK, CDC42-related MRCK,
  citron, DMPK and STK38/NDR branches.
