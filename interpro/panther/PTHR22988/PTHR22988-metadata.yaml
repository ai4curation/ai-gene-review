  name:
    name: Rho-associated Serine/Threonine Kinase
    short: Rho-assoc_Ser/Thr_Kinase
  description:
  - text: This family of proteins includes serine/threonine kinases that are key regulators
      of the actin cytoskeleton and cell polarity. They are involved in various cellular
      processes such as smooth muscle contraction, cytoskeleton organization, stress
      fiber and focal adhesion formation, cell adhesion and motility, cytokinesis,
      and cell migration. Members of this family play roles in the phosphorylation
      of a range of substrates leading to the regulation of actomyosin contractility,
      cell protrusion, and migration. They are also implicated in the regulation of
      centrosome duplication, angiogenesis, and various differentiation processes
      including keratinocyte terminal differentiation and erythroid differentiation.
      Activation of these kinases is typically regulated by RHOA binding and can be
      inhibited by specific compounds. Some members are involved in the regulation
      of synaptic properties and circadian rhythms in vascular contractility.
