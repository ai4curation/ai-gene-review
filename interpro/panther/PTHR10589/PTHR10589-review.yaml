family_id: PANTHER:PTHR10589
family_name: UBIQUITIN CARBOXYL-TERMINAL HYDROLASE
summary: 'UCH-family cysteine proteases hydrolyze bonds at the ubiquitin C terminus. Their conserved catalytic
  framework serves different biological settings: small-conjugate processing, proteasome-associated deubiquitination
  and chromatin-associated deubiquitination. Regulatory extensions and partner complexes help determine
  substrate access.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: The inventory separates small UCH enzymes, UCH37/UCHL5 and BAP1/Calypso chromatin deubiquitinases.
  The pombe Uch2 evidence supports cleavage at the ubiquitin C terminus and its UCHL5 branch assignment.
  Partner-dependent substrate access distinguishes proteasome and chromatin contexts; activity on one
  small ubiquitin conjugate does not establish every linkage specificity or NEDD8 processing.
