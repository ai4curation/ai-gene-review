  label: UBIQUITIN CARBOXYL-TERMINAL HYDROLASE ISOZYME L5
  description: IPR001578 describes the C12 catalytic family; the experimentally supported pombe Uch2 record
    identifies a ubiquitin-protein hydrolase. Uch2/UCH37 proteasome association is a branch property,
    whereas BAP1 and small UCH enzymes have different contexts. NEDD8 processing observed for particular
    UCH enzymes is not sufficient to grant deneddylation family-wide.
