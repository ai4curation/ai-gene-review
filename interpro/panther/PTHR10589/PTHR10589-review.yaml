  assessment_reason: The cached PANTHER tree places PTN000063381 on the branch that contains the
    vertebrate UCHL1/SF19 and UCHL3/SF24 clades but not BAP1/SF28 or UCHL5/SF16; the PAINT row
    records taxon:2759 as a constraint, not the PANTHER node's own clade. Its mouse Uchl3 seed evidence
    reports accumulation of polyubiquitinated proteins after Uchl3 loss, a downstream stress phenotype
    rather than direct participation in protein catabolism by UCHL3. The current RGD GAF maps RGD:3928
    to rat Uchl1 on a descendant PTN000063381 IBA, but it does not resolve the experimental row that
    PAINT used as the IBD seed; the extra UniProtKB:P15374 in that row is a descendant IBA WITH/FROM
    support, not a PAINT IBD seed in the cached PTHR10589 slice. The resolved mouse Uchl3 seed does not
    support placing a direct protein-catabolism assertion at this mixed UCHL1/UCHL3 node, and the rat
    Uchl1 experimental seed remains unresolved here. Because PAINT cannot re-term a single IBD, remove
    this broad GO:0030163 IBD from PTN000063381 and keep the direct cysteine-type deubiquitinase
    activity propagated from PTN000063280.
