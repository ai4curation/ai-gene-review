family_id: PANTHER:PTHR32071
family_name: TRANSCRIPTIONAL REGULATORY PROTEIN
preferred_name: Sigma-54-dependent bacterial enhancer-binding protein (bEBP) family
summary: 'Bacterial enhancer-binding proteins (bEBPs) that activate transcription by sigma-54 (RpoN) RNA
  polymerase. Members share a central AAA+ (sigma-54 interaction) ATPase domain that remodels the closed
  sigma-54 holoenzyme promoter complex, usually a C-terminal helix-turn-helix domain that binds upstream
  enhancer sequences, and a variable N-terminal signal-input domain: a phosphorylatable receiver in two-component
  regulators such as NtrC, CbrB, ZraR and LuxO, or GAF/V4R/PAS-type sensory domains in activators such
  as NifA, NorR and XylR.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'Sigma-54-dependent DNA-binding transcription activation is shared across the family,
  but the signal input diverges: only receiver-domain members are phosphorelay response regulators, so
  receiver-dependent terms (e.g. GO:0000156) are not safe at family or subfamily level. Subfamily SF117
  is itself mixed, containing receiver-type CbrB, ZraR, LuxO and HupR/HoxA alongside GAF-type NifA and
  V4R-type XylR. Physiological outputs (nitrogen fixation, catabolite control via crcZ/crcY, flagella,
  quorum sensing) are member-specific.'
reference_protein:
  id: UniProtKB:P09570
  label: Nif-specific regulatory protein
  gene_symbol: nifA
  organism: Azotobacter vinelandii
  gene_review: genes/AZOVI/nifA/nifA-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR32071:SF117
  label: PTS-DEPENDENT DIHYDROXYACETONE KINASE OPERON REGULATORY PROTEIN-RELATED
  description: Heterogeneous subfamily containing Pseudomonas CbrB, NifA proteins, XylR, LuxO, ZraR, FleQ
    and hydrogenase regulators HupR/HoxA. All are sigma-54 activators; the receiver/phosphorelay input
    and the CbrB-specific control of crcZ/crcY are member-level properties.
  representative_members:
  - id: UniProtKB:Q88DX2
    gene_symbol: cbrB
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/cbrB/cbrB-ai-review.yaml
  - id: UniProtKB:P09570
    gene_symbol: nifA
    organism: Azotobacter vinelandii
    gene_review: genes/AZOVI/nifA/nifA-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR32071:SF95
  label: DNA-BINDING TRANSCRIPTIONAL REGULATOR NTRC
  description: NtrC (NRI/GlnG) orthologs of proteobacteria. They are receiver-domain response regulators
    of NtrB, and phosphorylation of the receiver aspartate licenses the AAA+ domain to activate sigma-54-dependent
    nitrogen-regulated promoters such as glnA and glnK-amtB. Unlike the mixed SF117, the receiver-dependent
    phosphorelay response regulator activity holds across this subfamily.
  representative_members:
  - id: UniProtKB:P0AFB8
    gene_symbol: glnG
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/glnG/glnG-ai-review.yaml
  - id: UniProtKB:Q88CY1
    gene_symbol: ntrC
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/ntrC/ntrC-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: file:ECOLI/glnG/glnG-uniprot.txt
    supporting_text: Phosphorylated NtrC binds directly to DNA and stimulates the formation of open promoter-sigma54-RNA
      polymerase complexes
