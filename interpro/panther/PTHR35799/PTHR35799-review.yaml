family_id: PANTHER:PTHR35799
family_name: S-RIBOSYLHOMOCYSTEINE LYASE
preferred_name: LuxS S-ribosylhomocysteine lyase
summary: LuxS cleaves S-ribosylhomocysteine to homocysteine and 4,5-dihydroxypentane-2,3-dione (DPD).
  Together with Pfs this regenerates homocysteine after SAH nucleosidase cleavage. DPD gives rise to AI-2-related
  molecules, but signal detection and a population-dependent response require additional cellular machinery
  and are not established by LuxS membership alone.
functional_coherence: COHERENT
coherence_reason: The bacterial family conserves LuxS catalytic architecture and the ancestral S-ribosylhomocysteine
  lyase reaction. Quorum sensing is a separate context-dependent process, not a universal consequence
  of DPD production.
