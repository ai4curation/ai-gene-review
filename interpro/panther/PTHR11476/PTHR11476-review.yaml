- subfamily_id: PANTHER:PTHR11476:SF10
  label: NON-SPECIFIC SERINE_THREONINE PROTEIN KINASE
  description: >-
    GCN2-like eIF2-alpha kinases whose HisRS-like region is the part matched by this family, such as
    Arabidopsis GCN2 (Q9LX30), Dictyostelium IfkB (Q550L8) and land-plant orthologs.
  diverged_from_family: true
  divergence_description: >-
    These proteins are protein kinases, not tRNA ligases. In GCN2 the HisRS-like region binds
    uncharged tRNA and regulates the kinase domain, so the protein acts as an amino-acid-starvation
    sensor rather than charging tRNA(His). In the PAINT annotation the reviewed SF10 members
    (Q9LX30, Q550L8) receive kinase and stress-response IBAs from the eIF2-alpha kinase tree and no
    ligase IBA. SF10 leaves of the PTHR11476 tree, however, sit under the root that carries the
    ligase IBD.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11476/PTHR11476-entries.csv
    supporting_text: Q9LX30,eIF-2-alpha kinase GCN2,protein
  - reference_id: file:interpro/panther/PTHR11476/PTHR11476-entries.csv
    supporting_text: Q550L8,Probable serine/threonine-protein kinase ifkB,protein
  - reference_id: file:genes/yeast/GCN2/GCN2-uniprot.txt
    supporting_text: >-
      The C-terminal and histidyl-tRNA synthetase-like regions are required for uncharged tRNAs
      binding in amino acid-starved cells
