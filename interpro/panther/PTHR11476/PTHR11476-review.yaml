notes: >-
  modules/histidine_biosynthesis.yaml uses this family only for the HisZ regulatory subunit of the
  short-form ATP phosphoribosyltransferase (P. putida KT2440 hisZ, Q88DD7, PTHR11476:SF7). Because
  SF7 is mostly genuine HisRS, neither PTHR11476 nor PTHR11476:SF7 selects HisZ, and the module
  should keep a HisZ-specific grounding (InterPro IPR004517, NCBIfam TIGR00443 or HAMAP MF_00125)
  rather than switch to a PANTHER id. P. putida HisZ itself receives no IBA from PTN008322593
  (KT2440 is not a PANTHER tree leaf), but the P. aeruginosa leaf does, and so will any HisZ grafted
  to the tree. The bacterial HisRS of P. putida and many other bacteria are classified in the
  separate family PTHR43707. No histidyl-tRNA synthetase in this family has a gene review in the
  repository yet, so HisZ is the reference protein; human HARS1 (P12081) would be the better anchor
  for residue sites once reviewed. The PTHR11476, PTHR11042 and eIF2-alpha kinase nodes were
  located with interpro/panther/tree_check.py PTHR11476 PTHR11042 against PANTHER 19.
