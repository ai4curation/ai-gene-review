subfamilies:
- subfamily_id: PANTHER:PTHR11476:SF7
  label: HISTIDINE--TRNA LIGASE
  description: >-
    The largest subfamily, holding 148 reviewed members in entries.csv. Of these, 109 are
    histidine--tRNA ligases: bacterial HisS, archaeal HisRS, and eukaryotic HisRS such as
    S. cerevisiae HTS1 (P07263), Arabidopsis, Dictyostelium, C. elegans and zebrafish enzymes. The
    other 39 are HisZ regulatory subunits, among them P. putida KT2440 HisZ (Q88DD7) and
    P. aeruginosa HisZ (Q9HUM5). The subfamily as a whole keeps the family function, so it is not
    flagged as diverged; the HisZ members are handled as member_exceptions to the ligase and
    aminoacylation terms. In the PANTHER tree the HisZ leaves (P. aeruginosa PA4939, Geobacter
    GSU3307, Leptospira LA_1111, Clostridium CBO1565) lie under the bacterial node PTN000159098,
    interleaved with HisRS leaves. PA4939, for example, shares node PTN002263341 with Xanthomonas
    HisRS XCC1806. No single PTN therefore isolates HisZ.
