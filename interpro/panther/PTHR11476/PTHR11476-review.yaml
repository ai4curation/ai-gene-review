family_id: PANTHER:PTHR11476
family_name: HISTIDYL-TRNA SYNTHETASE
preferred_name: Histidyl-tRNA synthetase / HisZ / GCN2 HisRS-like family
summary: >-
  Class II histidyl-tRNA synthetase (HisRS) fold proteins of three functional kinds. Most members
  are histidine--tRNA ligases that charge tRNA(His) with L-histidine through a histidyl-adenylate
  intermediate: cytoplasmic HARS1 (SF8, SF11, SF13), mitochondrial HARS2 (SF6, SF12), and
  bacterial, archaeal and eukaryotic HisRS (SF7, including dual-localised S. cerevisiae HTS1).
  The family also contains two lineages that keep the HisRS-like fold without the ligase function.
  HisZ, found in bacteria whose ATP phosphoribosyltransferase is the short form, is a
  catalytically inactive HisRS paralog. It forms a hetero-octamer with the short-form HisG
  catalytic subunit, activates it allosterically, and makes it sensitive to feedback inhibition
  by L-histidine. In PANTHER, HisZ is not a subfamily of its own: its reviewed members are in SF7
  together with genuine HisRS, and in the PANTHER tree HisZ leaves are interleaved with bacterial
  HisRS leaves. The second lineage is SF10, GCN2-like eIF2-alpha kinases (Arabidopsis GCN2,
  Dictyostelium IfkB), whose HisRS-like region binds uncharged tRNA and regulates the kinase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The ligase and aminoacylation terms are true for the HARS1, HARS2 and HisRS members but false
  for HisZ, which has lost aminoacylation activity and regulates histidine biosynthesis instead, and
  for the SF10 GCN2-like kinases. HisZ cannot be separated by subfamily: all 39 reviewed HisZ
  proteins are in SF7, which also holds 109 HisRS. The kinase lineage is SF10. The family PAINT
  slice also carries rows for nodes of the eIF2-alpha kinase tree (PTHR11042), which reach this
  family only through the SF10 kinases.
