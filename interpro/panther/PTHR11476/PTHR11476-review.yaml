    id: GO:0000105
    label: L-histidine biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    True for the HisZ members only. HisZ is the regulatory subunit required for step 1 of
    L-histidine biosynthesis in bacteria with a short-form HisG (it grounds the hisZ annoton of
    histidine_biosynthesis on P. putida Q88DD7). PANTHER gives HisZ no subfamily of its own: its
    members share SF7 with HisRS, for which the term is false, and no PTN isolates them. The term
    therefore cannot be scoped by subfamily or node, and is a member-level property of HisZ, best
    selected by the HisZ-specific signatures (HAMAP MF_00125, NCBIfam TIGR00443, InterPro
    IPR004517). No PAINT node asserts it.
