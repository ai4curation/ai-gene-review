  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Placing the ligase at the LUCA root (163 leaves) is right for the HARS1, HARS2 and HisRS
    members. Two lineages below it have lost the activity. The first is the HisZ regulatory
    subunits in SF7, which already receive the IBA: P. aeruginosa HisZ (Q9HUM5) carries IBA
    GO:0004821 from this node in the PAINT annotation. The second is the SF10 GCN2-like kinases.
    The HisZ leaves are interleaved with HisRS under PTN000159098, so a single IRD cannot stop the
    term. PAINT would need an IRD on each HisZ branch (for example on the PA4939 leaf rather than
    on PTN002263341, which it shares with Xanthomonas HisRS), plus one for SF10. HisZ members are
    listed as member_exceptions in the term assessment.
