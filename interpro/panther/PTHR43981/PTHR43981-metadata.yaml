  name:
    name: Mitochondrial Enoyl-ACP Reductase
    short: Mito_Enoyl-ACP_Reductase
  description:
  - text: The mitochondrial enoyl-[acyl-carrier-protein] reductase family is involved
      in the NADPH-dependent reduction of trans-2-enoyl thioesters as part of mitochondrial
      fatty acid synthesis type II. Members of this family utilize acyl carrier protein
      (ACP) as an acyl group carrier, although they can also accept CoA thioesters
      as substrates in vitro. The family plays a crucial role in fatty acid chain
      elongation within mitochondria, which is essential for respiration and the maintenance
      of the mitochondrial compartment. Some members display substrate specificity,
      showing a preference for medium-chain substrates and may contribute to lipoic
      acid biosynthesis, which is important for protein lipoylation and mitochondrial
      respiratory activity, particularly in certain cell types like Purkinje cells.
