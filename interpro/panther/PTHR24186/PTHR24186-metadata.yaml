  name:
    name: Ankyrin repeat domain-containing protein
    short: Ankyrin_repeat_domain
  description:
  - text: This family of proteins includes members that are involved in various stress
      response pathways in plants, particularly in defense against pathogens and tolerance
      to salt stress. Some proteins in this family act as activators in defense responses,
      participating in positive feedback loops with defense signaling molecules such
      as salicylic acid. They may regulate cell fate processes, including cell enlargement
      and division, and modulate the accumulation of defense-related proteins at the
      plasma membrane. Other members are implicated in abiotic stress responses, potentially
      through hormone signaling pathways and the promotion of reactive oxygen species
      production. Additionally, a member of this family in bacteria is related to
      the Toxin_15 family, suggesting a possible role in bacterial defense or competition
      mechanisms.
