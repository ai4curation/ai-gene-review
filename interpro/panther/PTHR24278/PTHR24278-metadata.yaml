  name:
    name: Peptidase S1 family, coagulation factors
    short: Peptidase_S1_coag_factors
  description:
  - text: The peptidase S1 family, including vitamin K-dependent and snake venom subfamilies,
      consists of serine proteases involved in blood coagulation. Members of this
      family initiate various pathways of the coagulation cascade, convert prothrombin
      to thrombin, and regulate coagulation by inactivating factors. They participate
      in both intrinsic and extrinsic pathways, with some acting as zymogens in blood.
      Vitamin K-dependent proteins are crucial for the activation of these proteases,
      and calcium binding is a common feature that affects their conformation and
      interactions. The snake venom subfamily members attack prey hemostatic systems
      by mimicking mammalian coagulation factors, inducing blood clotting. This family
      also includes proteins that may control axon guidance in the CNS and influence
      cell surface receptor expression.
