  label: ALLANTOATE AMIDOHYDROLASE
  description: >-
    Bacterial allantoate amidohydrolases and N-carbamoyl-L-amino-acid amidohydrolases, P. putida HyuC
    (substrate unresolved) and the fungal beta-alanine synthase PYD3 of Lachancea kluyveri. The pyrimidine_degradation
    module selects the fungal enzyme by orthology to PYD3 rather than by this subfamily.
  representative_members:
