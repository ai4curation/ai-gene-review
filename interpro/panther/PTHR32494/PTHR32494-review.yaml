family_id: PANTHER:PTHR32494
family_name: ALLANTOATE DEIMINASE-RELATED
preferred_name: M20-like allantoate/ureidoglycolate amidohydrolase family
summary: >-
  M20 peptidase-like dinuclear-metal amidohydrolases of purine and pyrimidine catabolism: plant allantoate
  amidohydrolase (AAH) and ureidoglycolate amidohydrolase (UAH), bacterial allantoate amidohydrolases
  (E. coli AllC, B. subtilis PucF) and HyuC-type N-carbamoyl-L-amino-acid amidohydrolases, and the fungal
  beta-alanine synthase of reductive pyrimidine degradation (Lachancea kluyveri PYD3), a homodimeric di-zinc
  enzyme that hydrolyzes N-carbamoyl-beta-alanine.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrates differ (allantoate, ureidoglycolate, N-carbamoyl-L-amino acids, N-carbamoyl-beta-alanine),
  and SF5 alone mixes bacterial allantoate amidohydrolases, N-carbamoyl-L-amino-acid amidohydrolases,
  the fungal beta-alanine synthase PYD3 and the P. putida HyuC whose substrate is unresolved.
reference_protein:
  id: UniProtKB:Q96W94
  label: Beta-alanine synthase
  gene_symbol: PYD3
  organism: Lachancea kluyveri
  gene_review: genes/LACKL/PYD3/PYD3-ai-review.yaml
