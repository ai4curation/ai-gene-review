family_id: PANTHER:PTHR32494
family_name: ALLANTOATE DEIMINASE-RELATED
preferred_name: M20-like allantoate/ureidoglycolate amidohydrolase family
summary: >-
  M20 peptidase-like dinuclear-metal amidohydrolases of purine and pyrimidine catabolism: plant allantoate
  amidohydrolase (AAH) and ureidoglycolate amidohydrolase (UAH), and bacterial HyuC-type N-carbamoyl
  amidohydrolases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrates differ (allantoate, ureidoglycolate, N-carbamoyl amino acids), and the reviewed P. putida
  HyuC has only a generic amidohydrolase core function.
