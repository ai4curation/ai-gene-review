family_id: PANTHER:PTHR33279
family_name: SULFUR CARRIER PROTEIN YEDF-RELATED
preferred_name: TusA/YedF-related sulfur carriers
summary: Small sulfur-carrier proteins include the TusA relay component that accepts persulfide sulfur
  from IscS and delivers it toward the TusBCD/MnmA pathway. Related YedF and archaeal proteins occur in
  the same family; exact sulfur-trafficking roles require partner and pathway evidence.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Shared sulfur-carrier architecture does not specify a single acceptor pathway. The normal
  PAINT acquisition resolved tree nodes but no node-level assertions, so no ancestral claim is invented.
