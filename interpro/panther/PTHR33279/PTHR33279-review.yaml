family_id: PANTHER:PTHR33279
family_name: SULFUR CARRIER PROTEIN YEDF-RELATED
preferred_name: TusA-like (SirA/YedF) sulfur carrier family
summary: >-
  Small TusA-like (SirA fold) proteins with a CPxP-motif cysteine that carries
  persulfide sulfur. Subfamily SF2 holds TusA, which in Escherichia coli accepts
  sulfur from the cysteine desulfurase IscS and passes it to TusD for 2-thiolation
  of mnm5s2U at tRNA wobble position 34, and also contributes to molybdopterin
  synthesis. SF6 holds YedF-related proteins, including Allochromatium vinosum
  TusA, an experimentally characterized carrier of the dissimilatory sulfur
  oxidation pathway, plus uncharacterized YedF, TsuB, YrkF and YrkI. SF18 and SF19
  are uncharacterized archaeal and bacterial groups. SF2 is not limited to the
  relay TusA: it also holds TusA-like paralogs such as Pseudomonas putida PP_1233
  and P. aeruginosa PA1006 that lack the TusA-specific IPR022931 signature, and
  archaeal and eukaryotic sequences.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Sulfur-carrier activity on the CPxP cysteine is shared by the characterized
  members in two subfamilies (E. coli TusA in SF2, A. vinosum TusA in SF6), but
  the process each carrier serves differs (tRNA thiolation, molybdopterin
  synthesis, dissimilatory sulfur oxidation), and two subfamilies are
  uncharacterized. PAINT has made no node-level annotation for this family.
