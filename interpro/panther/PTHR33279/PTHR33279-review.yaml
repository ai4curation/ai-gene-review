notes: >-
  Written for the Tus-dependent MnmA tRNA thiolation module (TusA annoton,
  grounded at SF2). PAINT has no annotation for this family; the PAINT fetch
  resolved nodes but retained no node-level rows. SF2 is the correct subfamily for
  the relay TusA but is broader than it; the module therefore names the HAMAP and
  InterPro signatures as the discriminator.
