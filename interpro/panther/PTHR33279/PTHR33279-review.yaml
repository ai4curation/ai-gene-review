term_assessments:
- assessed_term:
    id: GO:0097163
    label: sulfur carrier activity
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR33279:SF2
    label: SULFUR CARRIER PROTEIN TUSA
  - id: PANTHER:PTHR33279:SF6
    label: SULFUR CARRIER PROTEIN YEDF-RELATED
  scope_reason: >-
    Experimentally supported in SF2 (E. coli TusA accepts IscS persulfide and
    passes it to TusD) and SF6 (A. vinosum TusA in the Dsr sulfur-oxidation relay).
    SF18 and SF19 have no characterized member and are not granted the term,
    though their conserved CPxP cysteine makes carrier activity plausible.
  supported_by:
  - reference_id: PMID:16387657
    supporting_text: IscS transfers the persulfide sulfur to TusA.
  - reference_id: UniProtKB:D3RPC0
    supporting_text: >-
      Sulfur carrier protein involved in sulfur trafficking for
      oxidative dissimilatory sulfur metabolism.
- assessed_term:
    id: GO:0002143
    label: tRNA wobble position uridine thiolation
  scope: UNRESOLVED
  scope_reason: >-
    Established for the relay TusA proteins carrying IPR022931/HAMAP MF_00413
    (E. coli experimentally; KT2440 PP_2116 by signature). SF2 also contains
    TusA-like paralogs (PP_1233, PA1006) and archaeal and eukaryotic sequences with
    no tRNA-thiolation role, so the term cannot be granted to the whole subfamily,
    and A. vinosum TusA in SF6 is only suggested to act in 2-thiouridine
    formation. Missing evidence: a PANTHER node or subfamily that delimits the
    relay TusA clade, and s2U34 data for the paralogs.
  supported_by:
  - reference_id: file:genes/PSEPK/tusA/tusA-uniprot.txt
    supporting_text: "DR   InterPro; IPR022931; Sulphur_carrier_TusA."
  - reference_id: UniProtKB:Q88NH6
    supporting_text: "DR   InterPro; IPR001455; TusA-like."
  - reference_id: UniProtKB:D3RPC0
    supporting_text: >-
      Might also act as a sulfur mediator required for 2-
      thiouridine formation of tRNA.
