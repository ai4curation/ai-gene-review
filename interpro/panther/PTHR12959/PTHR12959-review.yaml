family_id: PANTHER:PTHR12959
family_name: GPI TRANSAMIDASE COMPONENT PIG-T-RELATED
preferred_name: PIGT/Gpi16 GPI transamidase subunits
summary: PIGT/Gpi16 proteins are components of the endoplasmic-reticulum GPI transamidase complex that
  attaches glycosylphosphatidylinositol anchors to proteins. Complex membership explains participation
  in the attachment reaction, while the catalytic chemistry belongs to the assembled machinery and its
  catalytic subunit. PIGT is not a generic soluble protease simply because the complex processes a protein
  precursor.
functional_coherence: COHERENT
coherence_reason: Budding-yeast Gpi16 co-purifies with Gaa1 and Gpi8, and depletion blocks GPI attachment.
  Mammalian PIGT knockout and complex experiments establish stabilization of GAA1 and GPI8, while the
  human structure identifies PIGK as the catalytic subunit. These independent primary experiments support
  a conserved PIGT/Gpi16 accessory role, not intrinsic protease activity.
