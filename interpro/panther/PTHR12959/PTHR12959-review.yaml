  scope: FAMILY_WIDE
  scope_reason: The conserved role of intact PIGT/Gpi16 proteins is participation in the GPI-anchor attachment
    machinery, grounded by yeast purification/depletion, mammalian knockout and human structural experiments.
    This family-level functional inference does not transfer the intrinsic catalytic chemistry of PIGK/Gpi8
    to PIGT/Gpi16.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-c/PTHR12959.md
    supporting_text: 'Phosphatidylinositol-glycan biosynthesis class T protein (PIG-T, also known as Gpi16
      in budding yeasts) is a component of the glycosylphosphatidylinositol (GPI) trans-amidase complex
      that adds GPIs to newly synthesized proteins [[cite:PUB00009845]]. Mammalian GPI transamidase consists
      of at least five components: Gaa1, Gpi8, PIG-S, PIG-T, and PIG-U, all five of which are required
      for its function. It is possible that Gaa1, Gpi8, PIG-S, and PIG-T form a tightly associated core
      that is only weakly associated with PIG-U. The exact function of PIG-S is unclear [[cite:PUB00044439]].'
