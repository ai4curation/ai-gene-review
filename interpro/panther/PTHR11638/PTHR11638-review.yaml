    asserted_term:
      id: GO:0070370
      label: cellular heat acclimation
    evidence: IBD
    paint_snapshot: "20200626"
    seeds:
      - id: CGD:CAL0000200274
      - id: PomBase:SPBC16D10.08c
      - id: SGD:S000003949
    node_taxon:
      id: NCBITaxon:4751
      label: Fungi
    assessment: SOUND
    assessment_reason: >-
      Cellular heat acclimation is correctly placed on the fungal cytosolic
      Hsp104 branch: S. cerevisiae HSP104 is required for induced
      thermotolerance, and C. albicans HSP104 mutants are hypersensitive to
      lethal heat stress unless HSP104 is restored.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11638/PTHR11638-paint.tsv
        supporting_text: "PTHR11638\tPTN007521008\tGO:0070370\tP\tIBD\tfalse\tCGD:CAL0000200274|PomBase:SPBC16D10.08c|SGD:S000003949\ttaxon:4751\t20200626"
      - reference_id: PMID:2188365
        supporting_text: >-
          when given a mild pre-heat treatment, the mutant cells did not acquire
          tolerance to heat, as did wild-type cells.
      - reference_id: PMID:22635920
        supporting_text: >-
          Mutants lacking HSP104 became hypersusceptible to lethally high
          temperatures, similarly to the corresponding mutants of Saccharomyces
          cerevisiae, whereas normal susceptibility was restored upon
          reintroduction of the gene.
