family_id: PANTHER:PTHR11638
family_name: ATP-DEPENDENT CLP PROTEASE
preferred_name: ClpA/ClpB AAA+ unfoldases and Hsp100 disaggregases
summary: >-
  PTHR11638 contains two-nucleotide-binding-domain AAA+ unfoldases of the
  ClpA/ClpB/Hsp100 family. All reviewed members share ATP-dependent remodeling
  activity, but the tree separates ATPase subunits of Clp proteases from true
  Hsp100 disaggregases, and organelle-specific branches from cytosolic ones. In
  fungi, PAINT places mitochondrial Hsp78 disaggregases and cytosolic Hsp104
  disaggregases on separate fungal nodes, which correctly prevents matrix and
  cytosol localization from being propagated across the paralog split.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family is unified by AAA+ ATP hydrolysis and ATP-driven substrate
  remodeling, but only the Hsp104/ClpB/Hsp78 branches are protein
  disaggregases; ClpA/ClpC/ClpE branches pair with ClpP proteases or specialized
  organelle-import systems, and cytosolic, mitochondrial, and chloroplast nodes
  need distinct localization calls.
