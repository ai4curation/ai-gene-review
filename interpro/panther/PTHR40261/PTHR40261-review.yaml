family_id: PANTHER:PTHR40261
family_name: FAMILY NOT NAMED
preferred_name: Small Rieske [2Fe-2S] domain protein family containing FdeD
summary: >-
  PTHR40261 is an unnamed PANTHER family of small (about 110-residue) Rieske
  [2Fe-2S] domain proteins. Its single subfamily SF1 contains the FdeD proteins
  encoded next to the FdeE monooxygenase in fde naringenin-degradation loci
  (Hsero_1006, PP_3198). The Rieske domain binds a [2Fe-2S] cluster through a
  Cys-X-His ... Cys-X-X-His motif, implying an electron-carrier role, but the
  partners of these proteins are unknown.
functional_coherence: UNKNOWN
coherence_reason: >-
  The family has no Swiss-Prot members (no reviewed-member inventory or PAINT
  slice exists) and none has been characterized. Cluster binding is shared by
  all members through the Rieske domain; the electron-transfer partners, and
  whether members act with a single pathway oxygenase, are unresolved.
