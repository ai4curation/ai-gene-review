family_id: PANTHER:PTHR30071
family_name: HEME EXPORTER PROTEIN C
preferred_name: CcmC/CcsA heme-handling membrane protein family
summary: >-
  PTHR30071 groups polytopic membrane proteins that carry the periplasmic,
  tryptophan-rich "WWD" heme-handling domain. Its large subfamily SF1 contains
  both system I CcmC (E. coli, Pseudomonas, Haemophilus, Rhodobacter HelC,
  Bradyrhizobium CycZ, Arabidopsis mitochondrial CCMC) and system II
  ResC/CcsA (Bacillus subtilis ResC and chloroplast CcsA), while SF15 holds the
  B. subtilis HemX protein. In system I, CcmC binds heme with high affinity in
  its WWD domain and loads it covalently onto the heme chaperone CcmE in a
  CcmCDE complex; CcmAB ATP hydrolysis then releases holo-CcmE. In system II,
  the CcsA/ResC member of the subfamily forms part of the CcsBA heme-handling
  and ligation machinery. Heme binding through the WWD domain is therefore the
  conserved molecular feature of SF1, whereas the downstream role (holo-CcmE
  formation versus system II synthase) differs between the two systems.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The WWD heme-binding feature and the cytochrome c biogenesis process are
  shared across SF1, but SF1 lumps system I CcmC with system II CcsA/ResC,
  whose mechanistic roles differ, and SF15 (HemX) is not established to work in
  cytochrome c biogenesis. A PAINT catalase-activity assertion at the family
  root is not consistent with the known biochemistry and is left unresolved.
