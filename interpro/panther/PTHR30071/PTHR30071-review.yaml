      label: heme binding
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR30071:SF1
        label: CYTOCHROME B_B6 PROTEIN-RELATED
    scope_reason: >-
      Heme binding in the periplasmic WWD domain is demonstrated for E. coli
      CcmC and is the shared feature of the CcmC/CcsA members of SF1; it is not
      established for HemX (SF15).
    supported_by:
      - reference_id: PMID:16824107
        supporting_text: >-
          In the absence of CcmA or CcmB, holo(haem)CcmE binds to CcmC in a
          stable dead-end complex, indicating high affinity binding of haem to
          CcmC.
      - reference_id: PMID:29518410
        supporting_text: >-
          we develop a new cysteine/heme crosslinking approach to trap and map
          endogenous heme in CcmC (WWD domain)
