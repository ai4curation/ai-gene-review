    asserted_term:
      id: GO:0004096
      label: catalase activity
    evidence: IBD
    paint_snapshot: '20260424'
    seeds:
      - id: UniProtKB:Q9I3N5
    assessment: UNRESOLVED
    assessment_reason: >-
      The seed is a Pseudomonas aeruginosa CcmC IMP annotation citing
      PMID:16824107, whose cached abstract describes E. coli CcmABC-dependent
      release of holo-CcmE and does not mention catalase; the full text was not
      available here. CcmC has no catalase fold and its established activity is
      WWD-domain heme binding and transfer to CcmE, so a catalase phenotype
      would most plausibly be an indirect consequence of a cytochrome c defect.
      Propagation of catalase activity to the whole family is not supported by
      the family biochemistry, but the seed evidence could not be inspected.
    supported_by:
      - reference_id: file:interpro/panther/PTHR30071/PTHR30071-paint.tsv
        supporting_text: "PTHR30071\tPTN001247822\tGO:0004096\tF\tIBD\tfalse\tUniProtKB:Q9I3N5"
term_assessments:
