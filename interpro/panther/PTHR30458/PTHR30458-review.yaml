  assessment: SOUND
  assessment_reason: >-
    Both E. coli seeds were shown to form stable PaaABC/PaaAC subcomplexes and to be required for
    the reconstituted epoxidase activity (PMID:21247899); the PaaABCE complex of the pathway
    reconstitution produced ring 1,2-epoxyphenylacetyl-CoA (PMID:20660314). Membership of the
    complex is the right way to annotate both the catalytic (PaaA) and structural (PaaC) subunits.
    The node lies above both Paa subunit paralogs (TreeGrafter maps it to PTHR30458:AN8). If BoxB
    descends from it, a member exception applies (BoxB is a benzoyl-CoA epoxidase), but no BoxB
    gene review exists in this repository and its IBA status was not visible here.
