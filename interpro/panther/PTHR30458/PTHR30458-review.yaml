    organism: Escherichia coli (strain K12)
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Placement at the family root (PTHR30458:AN0) is right for the PaaA and PaaC lineages, both
    seeds of which are E. coli paa cluster proteins required for phenylacetate catabolism
    (PMID:9748275; PMID:21247899). One identified branch has a different pathway role: BoxB of
