- subfamily_id: PANTHER:PTHR30458:SF0
  label: 1,2-PHENYLACETYL-COA EPOXIDASE, SUBUNIT C
  description: >-
    PaaC, the structural beta subunit of the PaaAC core (E. coli P76079, P. putida KT2440
    Q88HS7), plus Aromatoleum evansii BoxB (Q9AIX7), the benzoyl-CoA 2,3-epoxidase of the box
    pathway. PANTHER groups the two; they differ in both subunit role and substrate.
  representative_members:
  - id: UniProtKB:P76079
    gene_symbol: paaC
    organism: Escherichia coli (strain K12)
    gene_review: genes/ECOLI/paaC/paaC-ai-review.yaml
  - id: UniProtKB:Q88HS7
    gene_symbol: paaC
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/paaC/paaC-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    PaaC has diverged from the catalytic alpha role: it is the structural beta subunit of the
    PaaAC heterotetramer, so catalytic diiron monooxygenase terms belong to PaaA (SF2) and to the
    complex, not to PaaC on its own. The subfamily is also substrate-mixed: BoxB in the same SF
    is a benzoyl-CoA epoxidase of benzoate catabolism, not a phenylacetate pathway protein.
  supported_by:
  - reference_id: PMID:21247899
    supporting_text: >-
      PaaAC forms a catalytic core with a monooxygenase fold with PaaA being the catalytic α
      subunit and PaaC, the structural β subunit
  - reference_id: PMID:21632537
    supporting_text: BoxB is a benzoyl-CoA 2,3-epoxidase
