notes: >-
  Node-to-family mapping from PANTHER's PAINT_TreeGrafter_Annotations_TOTAL.txt (paint/current,
  2026-10-23): PTN001252629 = PTHR30458:AN0 (root), PTN000765271 = PTHR30458:AN8. The reference
  protein is E. coli PaaA, the catalytic subunit (Grishin et al. 2011 structure). Note that the
  pathway reconstitution of Teufel et al. 2010 used PaaABC(D)E from Pseudomonas sp. strain Y2, not
  from E. coli; E. coli-specific biochemistry for this family comes from Grishin et al. 2011 and
  Fernandez et al. 2006. The E. coli paaC and paaA gene reviews were being completed in parallel.
  No residue site is curated: PaaA diiron ligands are described structurally but UniProt P76077
  carries no ACT_SITE/BINDING feature table to anchor against.
