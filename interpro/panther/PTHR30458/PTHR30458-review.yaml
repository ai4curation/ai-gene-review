family_id: PANTHER:PTHR30458
family_name: PHENYLACETIC ACID DEGRADATION PROTEIN PAA
preferred_name: PaaA/PaaC diiron aroyl-CoA epoxidase subunits (with BoxB)
summary: >-
  Ferritin-like diiron proteins of the bacterial multicomponent monooxygenase (BMM) superfamily
  that form the catalytic core of CoA-thioester ring epoxidases. In the phenylacetate pathway the
  PaaA (catalytic alpha) and PaaC (structural beta) subunits assemble as a PaaAC heterotetramer
  that, together with the small PaaB subunit and the FAD/[2Fe-2S] reductase PaaE, makes up the
  phenylacetyl-CoA 1,2-epoxidase (PaaABCE). PaaA binds the diiron center and orients the aromatic
  ring of phenylacetyl-CoA for ortho attack; PaaC is a homologous but structural partner. The
  family also contains BoxB of Aromatoleum evansii, the diiron benzoyl-CoA 2,3-epoxidase of the
  aerobic CoA-dependent benzoate (box) pathway, which is a sister epoxidase acting on
  benzoyl-CoA rather than phenylacetyl-CoA.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are diiron aroyl-CoA epoxidase subunits with a shared ferritin-like fold.
  Divergence is of two kinds: (1) subunit role -- SF2 (PaaA) is the catalytic alpha subunit and
  SF0 (PaaC) the non-catalytic structural beta subunit of the same complex; (2) substrate/pathway
  -- BoxB (Q9AIX7, classified in SF0 alongside PaaC) is a self-sufficient benzoyl-CoA
  2,3-epoxidase of benzoate catabolism, so phenylacetate-specific terms do not hold for it even
  though PANTHER does not separate it from PaaC.
