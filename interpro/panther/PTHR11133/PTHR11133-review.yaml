family_id: PANTHER:PTHR11133
family_name: SACCHAROPINE DEHYDROGENASE
preferred_name: Saccharopine dehydrogenase family (LYS1, LYS9, AASS)
summary: >-
  Saccharopine dehydrogenases interconvert saccharopine with lysine or glutamate. In the fungal alpha-aminoadipate
  pathway of lysine synthesis, saccharopine reductase (S. cerevisiae LYS9, S. pombe lys9) makes saccharopine
  from aminoadipate semialdehyde and glutamate, and saccharopine dehydrogenase (LYS1, S. pombe lys3)
  releases lysine. In animal lysine catabolism the bifunctional AASS runs the reverse: its lysine-ketoglutarate
  reductase domain makes saccharopine and its saccharopine dehydrogenase domain releases glutamate.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The saccharopine-forming (NADP, glutamate-forming) and lysine-forming (NAD) activities sit in different
  subfamilies: SF22 holds fungal LYS9-type reductases and animal AASS; SF23 holds the LYS1-type dehydrogenases.
