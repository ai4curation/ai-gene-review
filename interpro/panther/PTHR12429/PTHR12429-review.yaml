      - {id: "UniProtKB:Q7JP67", gene_symbol: F10D7.5, organism: Caenorhabditis elegans}
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR12429:SF13
    label: E3 UBIQUITIN-PROTEIN LIGASE NEURL1
    description: >-
      Vertebrate NEURL1 (Neur1). An N-myristoylated, plasma-membrane NHR-RING E3 that
      monoubiquitinates Jagged1 in vitro. It is also annotated for synaptic
      plasticity.
    representative_members:
      - {id: "UniProtKB:O76050", gene_symbol: NEURL1, organism: Homo sapiens,
         gene_review: genes/human/NEURL1/NEURL1-ai-review.yaml}
      - {id: "UniProtKB:Q923S6", gene_symbol: Neurl1, organism: Mus musculus}
      - {id: "UniProtKB:A0JML9", gene_symbol: neurl1aa, organism: Danio rerio}
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR12429:SF10
    label: E3 UBIQUITIN-PROTEIN LIGASE NEURL1B
    description: >-
      Vertebrate NEURL1B (Neur2). An NHR-RING E3 that interacts with and ubiquitinates
      Delta and acts with Mib1 in Delta endocytic trafficking.
    representative_members:
      - {id: "UniProtKB:A8MQ27", gene_symbol: NEURL1B, organism: Homo sapiens}
      - {id: "UniProtKB:Q0MW30", gene_symbol: Neurl1b, organism: Mus musculus}
      - {id: "UniProtKB:A0A2R8QF54", gene_symbol: neurl1b, organism: Danio rerio}
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR12429:SF9
    label: E3 UBIQUITIN-PROTEIN LIGASE NEURL3
    description: Vertebrate NEURL3 (LINCR), a short NHR-RING E3 with no established Notch role.
    representative_members:
      - {id: "UniProtKB:Q96EH8", gene_symbol: NEURL3, organism: Homo sapiens}
      - {id: "UniProtKB:Q8CJC5", gene_symbol: Neurl3, organism: Mus musculus}
    diverged_from_family: true
    divergence_description: >-
      NEURL3 keeps the RING and E3 activity, but no Notch-ligand function has been
      shown. Notch-regulation terms must not be inherited here (PAINT already has an
      IRD NOT on its clade).
  - subfamily_id: PANTHER:PTHR12429:SF8
    label: NEURALIZED-LIKE PROTEIN 2
    description: >-
      NEURL2/Ozz. One NHR followed by a SOCS box and no RING. A striated-muscle
      substrate adaptor of a Cullin-RING E3 complex.
    representative_members:
      - {id: "UniProtKB:Q9BR09", gene_symbol: NEURL2, organism: Homo sapiens}
      - {id: "UniProtKB:Q9D0S4", gene_symbol: Neurl2, organism: Mus musculus}
      - {id: "UniProtKB:A4IG40", gene_symbol: neurl2, organism: Danio rerio}
    diverged_from_family: true
    divergence_description: >-
      This subfamily has no RING, so it is not a ubiquitin protein ligase in its own
      right. It recognises substrates (membrane beta-catenin) for a SOCS-box
      Cullin-RING ligase and acts in myofibrillogenesis. It has no Notch role.
  - subfamily_id: PANTHER:PTHR12429:SF14
    label: NEURALIZED-LIKE PROTEIN 4
    description: >-
      NEURL4. Six NHRs and no RING. A daughter-centriole protein that promotes CP110
      ubiquitylation and destabilisation, preventing ectopic MTOCs.
    representative_members:
      - {id: "UniProtKB:Q96JN8", gene_symbol: NEURL4, organism: Homo sapiens}
      - {id: "UniProtKB:Q5NCX5", gene_symbol: Neurl4, organism: Mus musculus}
      - {id: "UniProtKB:A1L0Y2", gene_symbol: neurl4, organism: Xenopus tropicalis}
    diverged_from_family: true
    divergence_description: >-
      NEURL4 has no RING domain. It is a centriolar regulator of CP110 and has no Notch
      role. Whether it contributes catalytically to CP110 ubiquitylation, or acts as a
      scaffold for another E3, is not resolved.
node_assessments:
  - node_id: PANTHER:PTN000276953
    asserted_term:
      id: GO:0008593
      label: regulation of Notch signaling pathway
    node_taxon: {id: "NCBITaxon:33213", label: Bilateria}
    paint_snapshot: "20250701"
    seeds:
      - {id: "FB:FBgn0002932", label: neur, organism: Drosophila melanogaster}
      - {id: "UniProtKB:O76050", label: NEURL1, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: >-
      The node covers the NHR-RING clade (invertebrate Neuralized, NEURL1, NEURL1B,
      NEURL3) and excludes the RING-less NEURL2 and NEURL4 lineages. Drosophila neur
      is a Delta E3 that positively regulates Notch, and NEURL1 regulates Jagged1, so
      placement at Bilateria is supported. PAINT itself prunes the NEURL1B/NEURL3 clade
      (see PTN002646360). The C. elegans F10D7.5 descendant inherits the term without
      nematode experimental support. That is an untested prediction, not a
      contradiction.
  - node_id: PANTHER:PTN002646360
    asserted_term:
      id: GO:0008593
      label: regulation of Notch signaling pathway
    node_taxon: {id: "NCBITaxon:117571", label: Euteleostomi}
    paint_snapshot: "20250701"
    seeds:
      - {id: "PANTHER:PTN000276953"}
    evidence: IRD
    negated: true
    assessment: UNRESOLVED
    assessment_reason: >-
      This row is an IRD NOT: it negates the inherited term on the clade that unites
      NEURL1B (SF10) and NEURL3 (SF9). The NOT fits NEURL3, which has no Notch
      evidence, but it is in tension with the NEURL1B biochemistry. Mouse Neur2
      interacts with and ubiquitinates Delta and acts with Mib1 in Delta endocytic
      trafficking. On the other hand, Neur1;Neur2 double mutants are viable and grossly
      normal, so mammalian NEURL1B is at most a redundant or minor Notch regulator. The
      real problem is that one IRD node lumps two functionally different paralogues.
      Gene reviews of NEURL1B should weigh the direct biochemical evidence rather than
      the IRD.
  - node_id: PANTHER:PTN000276953
    asserted_term:
      id: GO:0070086
      label: ubiquitin-dependent endocytosis
    node_taxon: {id: "NCBITaxon:33213", label: Bilateria}
    paint_snapshot: "20250701"
    seeds:
      - {id: "MGI:MGI:3643092", label: Neurl1b, organism: Mus musculus}
    assessment: SOUND
    assessment_reason: >-
      Ubiquitin-dependent internalisation of Delta is the mechanism of Drosophila
      Neuralized and of mouse Neur2. The term fits the NHR-RING clade.
  - node_id: PANTHER:PTN002646352
    asserted_term:
      id: GO:0070086
      label: ubiquitin-dependent endocytosis
    node_taxon: {id: "NCBITaxon:117571", label: Euteleostomi}
    paint_snapshot: "20250701"
    seeds:
      - {id: "PANTHER:PTN000276953"}
    evidence: IRD
    negated: true
    assessment: UNRESOLVED
    assessment_reason: >-
      This row is an IRD NOT on the NEURL1 clade (SF13). Neurl1 monoubiquitinates
      Jagged1 in vitro and lowers Jagged1 levels in cells, which is consistent with, but
      not direct proof of, ubiquitin-dependent ligand endocytosis. The cached abstract
      does not establish endocytosis as the mechanism, so the NOT cannot be confirmed
      or refuted here.
  - node_id: PANTHER:PTN004361013
    asserted_term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    node_taxon: {id: "NCBITaxon:2759", label: Eukaryota}
    paint_snapshot: "20260528"
    seeds:
      - {id: "FB:FBgn0002932", label: neur, organism: Drosophila melanogaster}
      - {id: "MGI:MGI:1334263", label: Neurl1, organism: Mus musculus}
      - {id: "MGI:MGI:2429944", label: Neurl3, organism: Mus musculus}
      - {id: "MGI:MGI:3643092", label: Neurl1b, organism: Mus musculus}
      - {id: "UniProtKB:Q96EH8", label: NEURL3, organism: Homo sapiens}
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      All seeds are NHR-RING proteins, but the node is the family root. Its IBA
      descendants (QuickGO, with/from PTN004361013) include the RING-less NEURL2
      (Q9BR09, Q9D0S4, fly Q9W112) and NEURL4 (Q96JN8, Q5NCX5) lineages. NEURL2
      supplies substrate recognition to a SOCS-box Cullin-RING complex, and NEURL4 has
      only NHR repeats. Neither has the catalytic RING the term implies. Prune SF8 and
      SF14 with IRD/NOT.
    affected_subfamilies:
      - {id: "PANTHER:PTHR12429:SF8", label: NEURALIZED-LIKE PROTEIN 2}
      - {id: "PANTHER:PTHR12429:SF14", label: NEURALIZED-LIKE PROTEIN 4}
  - node_id: PANTHER:PTN000277074
    asserted_term:
      id: GO:0030239
      label: myofibril assembly
    node_taxon: {id: "NCBITaxon:33213", label: Bilateria}
    paint_snapshot: "20250701"
    seeds:
      - {id: "MGI:MGI:3043305", label: Neurl2, organism: Mus musculus}
    assessment: SOUND
    assessment_reason: >-
      Recorded because it documents the non-Notch branch. The NEURL2/Ozz clade
      (vertebrate NEURL2, Drosophila Q9W112) carries a muscle function supported by the
      Ozz knockout. It does not inherit any Notch term, which is correct.
