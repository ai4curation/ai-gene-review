notes: >-
  Seeds were resolved with UniProt (FBgn0002932 = neur P29503; MGI:1334263 = Neurl1
  Q923S6; MGI:3643092 = Neurl1b Q0MW30; MGI:2429944 = Neurl3 Q8CJC5; MGI:3043305 =
  Neurl2 Q9D0S4). Subfamilies come from UniProt DR PANTHER and the PANTHER geneinfo
  service. PTN node membership comes from QuickGO IBA rows with that PTN in
  with/from. PTN002646352 = NEURL1 clade (O76050, Q923S6, ...). PTN002646360 =
  NEURL1B + NEURL3 clade (A8MQ27, Q0MW30, Q96EH8, Q8CJC5, ...). PTN000277074 =
  NEURL2 clade. PAINT's two IRD NOTs are crossed: NEURL1 loses ubiquitin-dependent
  endocytosis but keeps Notch regulation, while NEURL1B/NEURL3 lose Notch regulation
  but keep ubiquitin-dependent endocytosis. Both are marked UNRESOLVED. The NEURL1
  clade's synaptic terms (GO:0048170, GO:0014069, GO:0005886 at PTN002646352) are
  not Notch-relevant and were not assessed. No residue sites are asserted.
