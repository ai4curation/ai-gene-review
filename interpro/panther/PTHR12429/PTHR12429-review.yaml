subfamilies:
  - subfamily_id: PANTHER:PTHR12429:SF6
    label: PROTEIN NEURALIZED
    description: >-
      Invertebrate Neuralized: the Delta E3 ligase and positive Notch regulator in
      Drosophila. It includes the C. elegans NHR-RING protein F10D7.5, for which no
      Notch role was evaluated here.
    representative_members:
      - {id: "UniProtKB:P29503", gene_symbol: neur, organism: Drosophila melanogaster,
