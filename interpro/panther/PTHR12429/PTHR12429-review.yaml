family_id: PANTHER:PTHR12429
family_name: NEURALIZED
preferred_name: Neuralized homology repeat (NHR) proteins, Neuralized and Neuralized-like
summary: >-
  The Neuralized family is defined by the Neuralized homology repeat (NHR; Pfam
  PF07177), a beta-sandwich substrate-binding module. Drosophila Neuralized (neur),
  the founding member, has two NHRs and a C-terminal RING finger. It is a RING E3
  ubiquitin ligase that binds and ubiquitinates Delta and promotes Delta endocytosis
  in the signal-sending cell, positively regulating Notch signalling. Vertebrates
  have several paralogues with different domain plans and functions. NEURL1 and
  NEURL1B (Neur1/Neur2) keep the NHR-RING plan. They can ubiquitinate Notch ligands
  (Neurl1 acts on Jagged1; Neur2 acts on Delta together with Mib1), but mouse Neur1;
  Neur2 double mutants are viable and grossly normal. NEURL3 (LINCR) is a short
  NHR-RING E3 with no established Notch role. NEURL2 (Ozz) has one NHR and a SOCS box
  but no RING. It is the substrate adaptor of a muscle Cullin-RING ligase that
  degrades membrane beta-catenin during myofibrillogenesis. NEURL4 has six NHRs and no
  RING. It is a daughter-centriole protein that restrains CP110 and prevents ectopic
  microtubule-organising centres.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Many family members are not Notch-ligand E3s. Only the invertebrate Neuralized
  subfamily (SF6) has a demonstrated positive role in Notch signalling. The
  vertebrate NEURL1 (SF13) and NEURL1B (SF10) subfamilies have biochemical Notch-ligand
  ubiquitination but are dispensable genetically in mouse. NEURL3 (SF9, plus the
  similarly named SF36/SF37) is an NHR-RING E3 without a Notch role. NEURL2 (SF8,
  Ozz) and NEURL4 (SF14) lack the RING finger altogether. NEURL2 is a SOCS-box
  substrate adaptor in muscle, and NEURL4 is a centriolar CP110 regulator. Neither
  catalytic activity nor Notch involvement is family-wide.
