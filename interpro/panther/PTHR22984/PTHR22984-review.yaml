family_id: PANTHER:PTHR22984
family_name: SERINE/THREONINE-PROTEIN KINASE PIM
preferred_name: PIM serine/threonine kinase family
summary: PTHR22984 contains the PIM serine/threonine kinase family and a divergent viral
  kinase-domain branch. This review covers the three human reviewed PIM paralogs, PIM1, PIM2 and
  PIM3. All three human members retain the PIM-family kinase domain and a shared soluble
  serine/threonine kinase mechanism that phosphorylates survival and proliferation regulators, while
  PIM1 has a direct GBP1/DEPDC5 branch, PIM2 has the strongest p21-stabilization support, and PIM3
  is backed by human BAD phosphorylation evidence.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The human PIM1/PIM2/PIM3 slice is coherent for protein serine/threonine kinase
  activity, cytoplasmic localization, regulation of mitotic cell cycle and negative regulation of
  apoptosis. The broader PANTHER family also contains viral kinase-domain proteins, so process
  annotations from vertebrate PIM kinases should not be generalized indiscriminately to every
  PTHR22984 branch.
