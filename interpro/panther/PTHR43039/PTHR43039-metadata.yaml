  name:
    name: Strigolactone and Karrikin Signaling Hydrolases
    short: SL_KAR_Signaling_Hydrolases
  description:
  - text: This family of proteins is involved in the perception and signaling of plant
      hormones known as strigolactones, which play a crucial role in regulating plant
      architecture, including shoot branching and tillering. Members of this family
      act as receptors for strigolactones and are responsible for the hydrolysis of
      these compounds, leading to the activation of downstream signaling pathways.
      Some proteins within this family also respond to karrikins, which are structurally
      similar to strigolactones and are involved in seed germination and seedling
      development following exposure to smoke. Additionally, this family includes
      enzymes that participate in the biosynthesis of biotin, specifically in the
      hydrolysis step required for the production of pimeloyl-ACP, a precursor in
      the biotin synthesis pathway. The proteins share a common structural framework
      as members of the AB hydrolase superfamily, which is characterized by a diverse
      group of enzymes with a core alpha/beta-fold structure.
