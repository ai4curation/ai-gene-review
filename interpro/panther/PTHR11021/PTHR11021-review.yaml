family_id: PANTHER:PTHR11021
family_name: SMALL NUCLEAR RIBONUCLEOPROTEIN F  SNRNP-F
summary: SmF/Lsm6 proteins are related small subunits of RNA-associated rings. SmF belongs to canonical
  spliceosomal Sm particles; Lsm6 is shared by the nuclear U6-associated Lsm2-8 ring and the cytoplasmic
  Lsm1-7 mRNA-decapping ring. Complex identity therefore changes the biological process assigned to a
  member.
functional_coherence: HETEROGENEOUS
coherence_reason: The actual inventory and curated IPR016487 include both SmF and Lsm6 proteins. Lsm6
  participates in the U6-associated Lsm2-8 ring and the Lsm1-7 mRNA-decapping ring, while canonical SmF
  participates in other spliceosomal snRNPs. Shared RNA-ring architecture supports RNA association, but
  U2/U5 complex membership and cytoplasmic decay are not interchangeable across these branches.
