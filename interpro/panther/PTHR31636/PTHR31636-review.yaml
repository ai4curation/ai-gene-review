term_assessments:
  - assessed_term:
      id: GO:0005634
      label: nucleus
    scope: FAMILY_WIDE
    scope_reason: >-
      Root IBD seeded across many clades. All reviewed members ACCEPT it. Some members
      (e.g. SHR in transit, PAT1-branch proteins) also occur in the cytoplasm, which does
      not contradict the term.
  - assessed_term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    scope: FAMILY_WIDE
    scope_reason: >-
      Every characterized clade regulates transcription, by coactivation or
      sequestration of DNA-binding partners (DELLA, SHR-SCR, SCL3, HAM) or as a
      promoter-associated complex (NSP1-NSP2). The term is general enough to cover all
      of these mechanisms.
  - assessed_term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    scope: UNRESOLVED
    scope_reason: >-
      Not family-wide. It is contradicted for the DELLA, SHR and SCR subfamilies (no
      DNA-binding domain; IDD-dependent promoter recruitment). The node assessment of
      PTN000780710 records this (WRONG_NODE), with those subfamilies as affected. Direct
      DNA binding is reported only for NSP1 (SF40), within an NSP1-NSP2 complex, and that
      evidence is cached here as abstract only. RAM1 (SF3) has genetic but not
      biochemical evidence. We therefore name no subfamily as safe. This deliberately
      does not follow the RAM1 gene review, which ACCEPTs GO:0003700 on IBA and IMP rows;
      the node assessment of PTN000780710 explains the disagreement (genetic control of
      AM gene expression shows transcriptional regulation, not DNA-binding TF activity).
    supported_by:
      - reference_id: PMID:19252081
        supporting_text: >-
          Our work reveals direct binding of a GRAS protein
          complex to DNA
      - reference_id: PMID:24821766
        supporting_text: >-
          However, because DELLA lacks a DNA-binding domain, intermediate protein(s)
          mediating the DELLA/DNA interaction are believed to be necessary for activating
          DELLA target genes.
