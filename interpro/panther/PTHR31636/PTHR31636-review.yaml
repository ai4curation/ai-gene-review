family_id: PANTHER:PTHR31636
family_name: OSJNBA0084A10.13 PROTEIN-RELATED
preferred_name: GRAS family transcriptional regulators (DELLA, SCARECROW, SHORT-ROOT, NSP, SCL and related)
summary: >-
  The PANTHER family named after a rice locus is the entire plant GRAS family. Its
  members are named after GAI, RGA and SCARECROW. PANTHER 19 places 2,365 leaves in 164
  subfamilies, all under one embryophyte duplication node, PTN000780710. GRAS proteins
  share a C-terminal GRAS domain, an alpha/beta core with conserved LHR, VHIID, PFYRE and
  SAW motifs that mediates protein-protein interaction and oligomerization. Their
  variable N-termini specify each clade. Almost all characterized members are nuclear
  transcriptional regulators, but most do not bind DNA themselves. They work as
  coregulators recruited to promoters by DNA-binding partners such as the
  INDETERMINATE-DOMAIN (IDD/BIRD) zinc-finger proteins, or by sequestering transcription
  factors such as the PIFs.
  The main characterized clades are:
  (1) DELLA proteins (GAI, RGA, RGL1-RGL3 in Arabidopsis; SLR1 in rice; RHT-1 in wheat;
  D8 in maize). These are nuclear growth repressors. The N-terminal DELLA/TVHYNP domain
  binds the GA-GID1 receptor complex, which leads to SCF(SLY1/GID2)-mediated degradation,
  so DELLAs are the central negative regulators of gibberellin signaling in vascular
  plants. Bryophyte DELLA-like proteins exist but are not part of a GID1/DELLA GA
  perception system.
  (2) SHORT-ROOT and SCARECROW, which form an SHR-SCR heterodimer that binds BIRD/IDD
  factors to specify root ground-tissue patterning.
  (3) SCL3, a GA-induced antagonist of DELLA that also acts through IDDs.
  (4) The legume symbiosis regulators NSP1, NSP2 and RAM1. The NSP1-NSP2 complex is the
  one GRAS case with reported direct promoter binding.
  (5) Many further clades (PAT1, SCL14, LISCL, HAM/SCL6, LAS/SCL18, SCL4/7, SCL28 and
  others) with roles in light, stress, meristem and cell-division signaling.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  A shared GRAS domain and nuclear location, but clade-specific functions: hormone
  signaling (DELLA; SCL3), radial patterning (SHR, SCR), symbiosis (NSP1, NSP2, RAM1),
  meristem maintenance (HAM, LAS), and phytochrome signaling (PAT1). Only nucleus and the
  general term regulation of DNA-templated transcription are safe family-wide.
  DNA-binding transcription factor activity, which PAINT asserts at the family root, is
  contradicted for the best-studied clades: DELLAs lack a DNA-binding domain, and
  SHR-SCR are cofactors of IDD zinc-finger factors. Gibberellin-signaling terms belong to
  the angiosperm DELLA subfamilies (and SCL3 for GA response). They must not spread to
  the catch-all SF7, which pools bryophyte and lycophyte DELLA-like proteins with the
  DELLA-domain-less rice SLRL1.
