review_status: NEEDS_REVIEW
reviewed_by: claude-code (AI-assisted PANTHER family review)
review_date: "2026-10-14"
notes: >-
  Scope. PTHR31636 is the whole GRAS family. Its official name comes from a rice locus
  and carries no functional meaning. The review is therefore at family level, with
  term-scope calls per subfamily. The focus is on the DELLA clade, the SHR/SCR
  comparators and the symbiosis regulators, which have reviewed members. Most of the 164
  subfamilies (SCL/LISCL/HAM/PAT1 clades) are not individually assessed.

  Node coverage. The cached PAINT slice (PTHR31636-paint.tsv) has 15 nodes; this review
  assesses 6 (PTN000780710, PTN004849723, PTN002056761, PTN002056797, PTN002056743,
  PTN004848506). The other 9 are not adjudicated and their IBDs should not be read as
  endorsed or rejected. PTN000780711 (seed SCR AT3G54220; GO:0008356, GO:0009956,
  GO:0048366, GO:0051457, GO:0009630, GO:0090610) and PTN001587390 (seed SHR
  AT4G37650; GO:0008356, GO:0009956, GO:0045930, GO:0048366) are single-seed
  Magnoliopsida process IBDs on reviewed genes. The SCR and SHR reviews carry
  GO:0008356 and GO:0009956 among their core terms, so nothing there contradicts the
  seeds, but judging how far each term should descend needs the SCR and SHR ortholog
  clades enumerated from the tree, which was not done. The remaining seven are seeded
  only by members without a gene review in this repo, so there is no member evidence to
  check them against: PTN000781228 (SCL28 AT1G63100 and Q9LWU9; GO:0007346,
  GO:1900459), PTN001587337 (SCL18/LAS AT1G55580; GO:0090506), PTN001587343 (Q84MQ9;
  GO:0042446), PTN002057407 (SCL23 AT5G41920; GO:0048366, GO:0090610), PTN004850332
  (PAT1 AT5G48150; GO:0009585, GO:0009640), PTN008421325 (Medicago TF80 G7J1L1;
  GO:0009610) and PTN008421329 (HAM AT2G45160/AT3G60630/AT4G00150; GO:0048768,
  GO:0051301).

  Sources. Tree topology, clades and subfamily membership are from the live PANTHER 19
  treeinfo service (fetched 2026-10-14). The DELLA clade root is PTN007897709
  (Embryophyta, 179 leaves). Below it are Marchantia/Physcomitrella DELLA-like leaves,
  then Selaginella DELLAs (Tracheophyta PTN007897136), then the Magnoliophyta duplication
  PTN008421400. That duplication splits into the SLRL clade PTN002056797 and the
  canonical angiosperm DELLA clade PTN000781237. In Arabidopsis, the eudicot duplication
  PTN004849613 separates GAI/RGA (PTN004849723) from RGL1/2/3 (PTN002056761). Subfamily
  names are verbatim from interpro/panther/panther.obo.

  Seeds were resolved via UniProt: AT1G14920 GAI, AT2G01570 RGA, AT1G66350 RGL1,
  AT3G03450 RGL2, AT5G17490 RGL3, AT3G54220 SCR, AT4G37650 SHR, AT1G50420 SCL3,
  AT1G07530 SCL14, AT5G41920 SCL23, AT1G55580 SCL18 (LAS), AT1G63100 SCL28, AT5G48150
  PAT1, AT2G45160/AT3G60630/AT4G00150 SCL27/SCL22/SCL6 (HAM), G7L166 Medicago RAM1,
  Q5NE24 Medicago NSP2, Q84MQ9 rice NSP1, B7F9I5/Q6F368 rice SLRL1/SLRL2, Q7G7J6 rice SLR1.

  Gene-review gaps (curation, not biology). (1) The GAI and RGA reviews were built from a
  GOA snapshot that predates their IBA rows. Live QuickGO (2026-10-14) shows seven IBAs
  on each: GO:0003700, GO:0006355, GO:0005634 from PTN000780710, and GO:0009739,
  GO:0009938, GO:1900033 and GO:2000033 from PTN004849723. Those reviews should be
  re-fetched and the GO:0003700 IBA handled like their other GO:0003700 rows. (2)
  UniProt gives GAI, RGA, SCR, SHR, RAM1 and RHT1 only the family-level PANTHER
  cross-reference, not a subfamily. The family/gene cross-check therefore cannot place
  them, and the subfamily-scoped calls here are not machine-enforced for them.

  Recommendations to PAINT. (1) Withdraw the 2017 GO:0003700 IBD at the GRAS root
  PTN000780710. If retained anywhere, place it at the NSP1 clade. This conflicts with
  the RAM1 gene review, which ACCEPTs GO:0003700 (IBA and IMP); the family review
  disagrees with that ACCEPT for the reasons given in the PTN000780710 node assessment,
  and would consider the RAM1 node PTN004848506 only if sequence-specific DNA binding by
  RAM1 is shown. (2) Consider
  GO:0003712 transcription coregulator activity at the DELLA and SHR/SCR clade nodes.
  (3) Consider moving GO:0009938 from the eurosid node PTN004849723 up to the angiosperm
  DELLA node PTN000781237, and not to PTN008421400 or PTN007897709.
