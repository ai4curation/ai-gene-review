node_assessments:
  - node_id: PANTHER:PTN000780710
    asserted_term:
      id: GO:0005634
      label: nucleus
    evidence: IBD
    paint_snapshot: "20260828"
    assessment: SOUND
    assessment_reason: >-
      Seeds span DELLA (GAI, RGA, RGL1, Medicago DELLA1, cotton GAI), SCR, SHR, SCL3,
      SCL14, SCL23, NSP2, rice MOC1 and DLT. Every reviewed member (GAI, RGA, SCR, SHR,
      RHT1, NSP1, RAM1) ACCEPTs nucleus.
  - node_id: PANTHER:PTN000780710
    asserted_term:
      id: GO:0003700
      label: DNA-binding transcription factor activity
    evidence: IBD
    paint_snapshot: "20170228"
    seeds:
      - id: AGI_LocusCode:AT2G01570
        label: RGA
        gene_symbol: RGA
        organism: Arabidopsis thaliana
      - id: AGI_LocusCode:AT3G54220
        label: SCR
        gene_symbol: SCR
        organism: Arabidopsis thaliana
      - id: UniProtKB:G7L166
        label: GRAS family protein RAM1
        gene_symbol: RAM1
        organism: Medicago truncatula
    assessment: WRONG_NODE
    assessment_reason: >-
      A 2017 IBD at the root of the whole GRAS family, with three seeds. Two of them do
      not hold up. The RGA and SCR reviews MODIFY their own GO:0003700 rows to
      transcription coregulator activity, because DELLAs lack a DNA-binding domain and the
      SHR-SCR crystal structure shows SHR-SCR acting as cofactors of the IDD factor JKD,
      which does the DNA binding. The third seed, RAM1, rests on genetic evidence that
      RAM1 controls AM gene expression. The only GRAS protein with reported direct binding
      is NSP1 (SF40), and that is in a clade-specific complex with NSP2. The ancestral
      GRAS protein should therefore not be modelled as a DNA-binding transcription factor.
      Recommend withdrawing the IBD at PTN000780710, and if anything placing GO:0003700
      at the NSP1 clade only. A coregulator term (GO:0003712) is the defensible
      family-level MF for the characterized clades (see term assessments). Gene reviews
      of GAI and RGA in this repo currently lack their IBA rows (stale GOA snapshot; live
      QuickGO shows this IBA on both).
      Conflict with the RAM1 gene review, stated explicitly. RAM1 (SF3) is outside the
      NSP1 clade, and genes/MEDTR/RAM1/RAM1-ai-review.yaml ACCEPTs GO:0003700 on both its
      IBA row (inherited from this root node) and its IMP row (PMID:26511916). Enacting
      this recommendation would remove the term from RAM1, and this family review
      disagrees with that ACCEPT. The RAM1 evidence shows that RAM1 is required and
      sufficient for expression of arbuscule genes (loss-of-function transcript analysis,
      ectopic expression). That establishes that RAM1 regulates transcription
      (GO:0006355, assessed SOUND below), not that RAM1 itself binds DNA in a
      sequence-specific manner, which is what GO:0003700 asserts. The same genetic
      signature is produced by DELLA and SHR-SCR, which act through DNA-binding partners.
      Park et al. could not show RAM1 binding to the STR or EXO70I upstream regions, and
      the reported RAM1-RAM2 promoter association involves NSP2. The description of RAM2 as
      a "direct target" (PMID:28596311, abstract only) does not by itself show that RAM1,
      rather than a partner in a GRAS complex, contacts the DNA. RAM1 is not proposed as a
      second placement for GO:0003700. If biochemical evidence of sequence-specific DNA
      binding by RAM1 appears, the RAM1 clade node PTN004848506 (Mesangiospermae) would be
      the candidate placement. Until then the RAM1 gene review's GO:0003700 rows are
      better read as GO:0006355 or, as for DELLA and SHR-SCR, a coregulator activity. The
      RAM1 gene review is not changed here; the disagreement is recorded for its next
      revision.
    affected_subfamilies:
      - id: PANTHER:PTHR31636:SF271
        label: DELLA PROTEIN GAI-RELATED
      - id: PANTHER:PTHR31636:SF47
        label: DELLA PROTEIN RGL1
      - id: PANTHER:PTHR31636:SF246
        label: DELLA PROTEIN RGL2
      - id: PANTHER:PTHR31636:SF168
        label: DELLA PROTEIN RGL3
      - id: PANTHER:PTHR31636:SF245
        label: DELLA PROTEIN RGA2
      - id: PANTHER:PTHR31636:SF298
        label: DELLA PROTEIN RGA2-LIKE
      - id: PANTHER:PTHR31636:SF247
        label: DELLA PROTEIN
      - id: PANTHER:PTHR31636:SF262
        label: DELLA PROTEIN
      - id: PANTHER:PTHR31636:SF9
        label: PROTEIN SHORT-ROOT
      - id: PANTHER:PTHR31636:SF12
        label: PROTEIN SCARECROW
      - id: PANTHER:PTHR31636:SF13
        label: SCARECROW-LIKE PROTEIN 3
    supported_by:
      - reference_id: PMID:24821766
        supporting_text: >-
          However, because DELLA lacks a DNA-binding domain, intermediate protein(s)
          mediating the DELLA/DNA interaction are believed to be necessary for activating
          DELLA target genes.
      - reference_id: PMID:28211915
        supporting_text: >-
          the ZF1-ZF2-ZF3 of JKD in the JKD-SHR-SCR complex is involved in DNA binding
      - reference_id: PMID:26511916
        supporting_text: >-
          Transcript analysis of ram1-3 and ectopic
          expression of RAM1 indicate that RAM1 regulates expression of EXO70I and Stunted
          Arbuscule
      - reference_id: file:genes/MEDTR/RAM1/RAM1-deep-research-falcon.md
        supporting_text: >-
          earlier work associates RAM1 with the RAM2 promoter through NSP2. Crucially, Park
          *et al.* could **not** demonstrate MtRAM1 binding to STR or EXO70I upstream
          sequences
  - node_id: PANTHER:PTN000780710
    asserted_term:
      id: GO:0006355
      label: regulation of DNA-templated transcription
    evidence: IBD
    paint_snapshot: "20260828"
    assessment: SOUND
    assessment_reason: >-
      Correct at the family root when read as transcriptional regulation by any
      mechanism. DELLAs act as coactivators of IDD/GAF1 and as sequesterers of PIFs,
      SHR-SCR as IDD cofactors, and NSP1/RAM1 as symbiotic transcription regulators. The
      RGA (TAS), SCR, SHR and RAM1 reviews ACCEPT it.
    supported_by:
      - reference_id: PMID:25035403
        supporting_text: >-
          In this study, we found that DELLAs promote the transcription of genes encoding
          GA biosynthetic enzymes and GA receptors as coactivators of a DNA binding
          transcription factor, GAF1.
  - node_id: PANTHER:PTN004849723
    asserted_term:
      id: GO:0009938
      label: negative regulation of gibberellic acid mediated signaling pathway
    evidence: IBD
    paint_snapshot: "20260513"
    seeds:
      - id: AGI_LocusCode:AT1G14920
        label: GAI
        gene_symbol: GAI
        organism: Arabidopsis thaliana
      - id: AGI_LocusCode:AT2G01570
        label: RGA
        gene_symbol: RGA
        organism: Arabidopsis thaliana
    assessment: SOUND
    assessment_reason: >-
      The eurosid GAI/RGA clade (29 leaves, SF271/SF245). GAI and RGA reviews ACCEPT the
      term on their experimental rows as core. The placement is conservative: the
      function is shared by all angiosperm DELLAs (RGL1-3, rice SLR1, wheat RHT-1) and by
      Selaginella DELLA1. A deeper placement at the angiosperm DELLA node PTN000781237
