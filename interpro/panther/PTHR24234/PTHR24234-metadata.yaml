  name:
    name: G-protein coupled receptor 1
    short: GPCR1
  description:
  - text: The G-protein coupled receptor 1 family consists of receptors that play
      crucial roles in various cellular processes through their ability to detect
      extracellular signals and activate intracellular signaling pathways. Members
      of this family are involved in sensing environmental changes such as pH fluctuations,
      mediating immune responses, and regulating cellular activities like apoptosis
      and mitosis. Some receptors in this family are proton-sensing, responding to
      acidosis by affecting vascular endothelial cell permeability and potentially
      mediating respiratory sensitivity to CO2/H+ in the brain. Others serve as receptors
      for bioactive lipids like lysophosphatidic acid and glycosphingolipids, influencing
      immune functions and cell death or differentiation. Additionally, some members
      may act as sensors for oxidative states, triggering cellular responses to oxidative
      stress.
