- subfamily_id: PANTHER:PTHR32439:SF9
  label: BLR3264 PROTEIN
  description: >-
    Heterogeneous: reviewed members are CobG precorrin-3B synthase (P21637) and the
    dissimilatory-type sulfite reductase alpha subunit DsrA (O33998); unreviewed members
    include the P. putida KT2440 assimilatory sulfite-reductase hemoprotein CysI (Q88KB9),
    which the module uses in its Pseudomonas Fpr-linked sulfite-reduction annoton.
  representative_members:
  - id: UniProtKB:Q88KB9
    label: Sulfite reductase hemoprotein beta subunit
    gene_symbol: cysI
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/cysI/cysI-ai-review.yaml
  - id: UniProtKB:P21637
    label: Precorrin-3B synthase
    gene_symbol: cobG
    organism: Sinorhizobium sp.
  - id: UniProtKB:O33998
    label: Sulfite reductase, dissimilatory-type subunit alpha
    gene_symbol: dsrA
    organism: Allochromatium vinosum
  diverged_from_family: true
  divergence_description: >-
    Mixes three different functions under one subfamily: oxygen-dependent ring contraction in
    cobalamin biosynthesis (CobG), dissimilatory/reverse sulfite reduction (DsrA), and
    assimilatory sulfite reduction (proteobacterial CysI). The official subfamily name refers to
    an uncharacterized Bradyrhizobium protein, and it is not evidence for any of these
    functions.
