family_id: PANTHER:PTHR32439
family_name: FERREDOXIN--NITRITE REDUCTASE, CHLOROPLASTIC
preferred_name: Monomeric siroheme/[4Fe-4S] sulfite and nitrite reductases and divergent relatives (NIR/SIR/CobG/DsrA)
summary: >-
  Siroheme- and [4Fe-4S]-containing reductases of the sulfite/nitrite reductase fold, built
  from duplicated ferredoxin-like and cofactor-binding domains. Subfamily SF0 holds the
  monomeric ferredoxin-dependent enzymes: plant and cyanobacterial ferredoxin--nitrite
  reductases (Arabidopsis NIR1, spinach, maize and rice NIR, Synechococcus NirA), a haloarchaeal
  assimilatory nitrite reductase (NasD), and the mycobacterial ferredoxin-dependent sulfite
  reductases (M. tuberculosis SirA/NirA, M. paratuberculosis Sir1/Sir2), which reduce sulfite
  but not nitrite. Subfamily SF9 is functionally heterogeneous: its reviewed members are
  precorrin-3B synthase CobG of cobalamin biosynthesis and the alpha subunit of the
  dissimilatory-type (reverse) sulfite reductase DsrA of Allochromatium, and it also contains
  unreviewed proteobacterial assimilatory CysI hemoproteins such as Pseudomonas putida KT2440
  CysI (Q88KB9).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The fold and the siroheme/[4Fe-4S] chemistry are shared, but the substrate (nitrite versus
  sulfite), pathway (nitrogen assimilation, sulfur assimilation, cobalamin biosynthesis,
  dissimilatory sulfur metabolism) and electron donor differ between members. Within SF0,
  nitrite reductases and the mycobacterial sulfite reductase SirA are interleaved, and SF9
  joins an oxygenase-type cobalamin enzyme, a dissimilatory sulfite reductase subunit and
  assimilatory sulfite reductases. No specific activity or process is safe at family level, and
  membership does not identify substrate or physiological electron donor.
