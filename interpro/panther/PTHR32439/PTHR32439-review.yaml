- assessed_term:
    id: GO:0050311
    label: sulfite reductase (ferredoxin) activity
  scope: UNRESOLVED
  scope_reason: >-
    Holds for the mycobacterial SirA enzymes in SF0, which reduce sulfite and not nitrite, but
    not for the plant and cyanobacterial nitrite reductases that share SF0. For the SF9
    assimilatory CysI proteins of pseudomonads the sulfite chemistry is supported but the
    physiological electron donor is unresolved, so the ferredoxin-specific term is not asserted
    (see the P. putida cysI review). Not applicable to CobG or DsrA. Substrate and donor are
    member properties, not subfamily properties.
  supported_by:
  - reference_id: PMID:17644602
    supporting_text: the enzyme exhibits no detectible turnover of nitrite, which need not be the
      case in the sulfite/nitrite reductase family.
  - reference_id: PMID:23794620
    supporting_text: it also remains possible that FprA transfers electrons directly to CysI.
- assessed_term:
    id: GO:0000103
    label: sulfate assimilation
  scope: UNRESOLVED
  scope_reason: >-
    Applies to the sulfite-reducing members (mycobacterial SirA in SF0; proteobacterial CysI
    such as P. putida Q88KB9 in SF9) but not to the nitrite reductases, CobG or DsrA, which
    occupy the same subfamilies.
  supported_by:
