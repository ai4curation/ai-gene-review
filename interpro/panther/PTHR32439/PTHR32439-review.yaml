family_id: PANTHER:PTHR32439
family_name: FERREDOXIN--NITRITE REDUCTASE, CHLOROPLASTIC
preferred_name: Ferredoxin-dependent sirohaem nitrite and sulfite reductase family
summary: >-
  Sirohaem/[4Fe-4S] reductases that reduce nitrite to ammonium or sulfite to
  sulfide by six-electron transfer. The family includes the ferredoxin-dependent
  assimilatory nitrite reductases (NirA) of cyanobacteria such as Synechococcus
  elongatus PCC 7942 (P39661), plant plastid NiR, and haloarchaeal NirA, together
  with the ferredoxin-dependent sulfite reductases (SirA) of mycobacteria and the
  sulfite reductase hemoprotein beta-like proteins of SF9 (for example
  Pseudomonas putida CysI). The substrate, nitrite or sulfite, is set by the
  particular member and does not follow subfamily lines: SF0 contains both
  nitrite reductases and the M. tuberculosis sulfite reductase, which shows no
  detectable nitrite turnover.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members share the sirohaem/[4Fe-4S] reductase chemistry, but SF0 mixes
  ferredoxin-nitrite reductases (cyanobacterial NirA, plant NiR) with
  mycobacterial ferredoxin-sulfite reductase SirA, and SF9 holds sulfite reductase
  hemoprotein-like members. Substrate class therefore has to be judged per member.
