  paint_snapshot: '20260529'
  seeds:
  - id: UniProtKB:P9WJ03
    label: sir
    organism: Mycobacterium tuberculosis H37Rv
  assessment: SOUND
  assessment_reason: >-
    Seeded by the directly characterized M. tuberculosis sulfite reductase. Oxidoreductase
    activity is true of every member of the fold (sulfite and nitrite reductases, DsrA, and
    the oxygenase CobG), so the placement cannot be wrong, but the term is uninformative; the
    M. tuberculosis sir review refines the IBA to GO:0050311. QuickGO (2026-11-03) shows that
    the SF9 proteins Q88KB9, P21637 and O33998 receive GO:0016491 only by InterPro2GO IEA, not
    from this node, so the node lies within SF0.
  supported_by:
  - reference_id: PMID:15917234
    supporting_text: This gene encodes a ferredoxin-dependent sulfite reductase, and the structure
      of the enzyme has been determined using x-ray crystallography.
- node_id: PANTHER:PTN008646893
  asserted_term:
    id: GO:0010167
    label: response to nitrate
  evidence: IBD
  node_taxon:
    id: NCBITaxon:35493
    label: Streptophyta
  paint_snapshot: '20250310'
  seeds:
  - id: AGI_LocusCode:AT2G15620
    label: NIR1
    organism: Arabidopsis thaliana
  assessment: SOUND
  assessment_reason: >-
    The seed is the Arabidopsis NIR1 IEP for nitrate-induced transcription. The same study
    identified the nitrate-responsive promoter element as a motif conserved among nitrite
    reductase promoters of several higher plants, which supports placing the response at a
    plant node limited to Streptophyta; the mycobacterial sulfite reductases and other
    non-plant members are outside it. The term records a transcriptional response of the
    nitrite reductase gene, not a molecular activity.
  supported_by:
  - reference_id: PMID:20444232
    supporting_text: we compared the sequences of several nitrite reductase gene
      promoters from various higher plants and identified a conserved sequence motif
      as the putative NRE.
