notes: >-
  Module: aps_dependent_assimilatory_sulfate_reduction uses the family-level PTHR32439 term in two
  places, with Q88KB9 (SF9) for the Pseudomonas Fpr-linked route and with P9WJ03 (SF0, alongside
  PTHR11493:SF47 for plant SIR) for the ferredoxin-linked route. Neither subfamily is declared
  in the module because each is functionally mixed; the selectors depend on their named
  representatives and required_function, as the module notes say. Counts from a csv parse of
  PTHR32439-entries.csv: 16 reviewed members, 14 SF0 and 2 SF9. Q88KB9 is unreviewed, so its
  SF9 placement is taken from its UniProt PANTHER cross-reference and the release-pinned
  PANTHER member index (both PTHR32439:SF9). QuickGO annotation lists for Q88KB9, P21637 and
  O33998 were checked on 2026-11-03. The family's official name and InterPro description
  emphasise ferredoxin-dependent nitrite reduction, which is only one of its functions.
  Reconciled with the bacterial assimilatory nitrate reduction module (PR #5928) after
  PR #5917 merged. This review is kept as the base; every subfamily, node assessment, term
  scope and reference here comes from it. The nitrate module's additions sit beside them:
  the PCC 7942 NirA representative (P39661) in SF0, and an SF0-scoped GO:0048307 ferredoxin-nitrite reductase activity term with M. tuberculosis SirA as a member exception, which the nitrate module's NirA grounding at PTHR32439:SF0 relies on. One verdict differed. The nitrate review's draft had left PTN008646893 (response to nitrate, Streptophyta) UNRESOLVED because the seed's paper was not available to it; this review's SOUND is kept, since it cites the NIR1 nitrate-responsive promoter study (PMID:20444232). GO:0050311 was UNRESOLVED in both.
  The GO:0048307 SF0 scope excepts all five mycobacterial sulfite reductases (P9WJ03, P9WJ02,
  Q7TYP6, Q73YC1, Q73XV0), counted with a csv parse of PTHR32439-entries.csv (PR #5928 review),
  each supported by its curated UniProt FUNCTION line or PMID:17644602.
