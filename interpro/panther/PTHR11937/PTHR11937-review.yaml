  assessment_reason: >-
    PTN000233596 is the eukaryotic ARP2 clade (119 leaves, ACTR2 subfamilies). ARP2 nucleates
    branched actin filaments as a subunit of the Arp2/3 complex rather than serving as a
    cytoskeletal structural constituent; the node also carries IBDs for the Arp2/3 complex and
    actin filament binding. The conflicting FlyBase IDA cites the reconstitution of human Arp2/3
    complex (PMID:11741539), which treats ARP2 and ARP3 as subunits of a seven-protein
    nucleating assembly, not as constituents of the cytoskeleton. This is a seed-in-clade IRD
    (projects/IRD_EVIDENCE/ird_seed_check.md): human ACTR2, inside the clade, is a seed of the
    ancestral PTN000940351 IBD the IRD blocks. The loss still holds because that seeding
    annotation records a role in a protein complex, not a constituent of the cytoskeleton.
