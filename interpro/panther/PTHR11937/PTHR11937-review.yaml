  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    PTN007551901 is the eukaryotic ARP1 (centractin) clade (96 leaves: ACTR1A, ACTR1B,
    Drosophila and nematode Arp1). ARP1 forms the short filament at the core of dynactin, the
    dynein accessory complex; the node carries an IBD for the dynactin complex term. The
    conflicting SGD IDA (PMID:9658168) studies yeast dynactin in spindle partitioning. The Arp1
    minifilament is the structural backbone of dynactin, but GO classifies the dynactin complex
    as a microtubule-associated protein complex, not as part of the cytoskeleton, so a
    structural role within dynactin does not meet GO:0005200, which is for constituents of
    cytoskeletal structures. This is a seed-in-clade IRD
    (projects/IRD_EVIDENCE/ird_seed_check.md): yeast Arp1, inside the clade, is a seed of the
    ancestral PTN000940351 IBD the IRD blocks. The loss still holds because that seeding
    annotation records a role in a protein complex, not a constituent of the cytoskeleton.
  supported_by:
