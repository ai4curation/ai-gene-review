family_id: PANTHER:PTHR11937
family_name: ACTIN
preferred_name: Actin and actin-related proteins (ARPs)
summary: >-
  PTHR11937 groups the conventional actins with the actin-related proteins. Actins polymerise into filaments
  that form the cytoskeleton. The ARPs share the actin fold but have other roles: ARP2 and ARP3 nucleate
  branched filaments as subunits of the Arp2/3 complex, ARP1 and ARP10/ARP11 build the dynactin filament
  that works with cytoplasmic dynein, and nuclear ARPs such as ARP6 are subunits of chromatin-remodelling
  complexes.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Actin-fold proteins with different functions: structural filament subunits (actins), nucleators (ARP2,
  ARP3), dynactin subunits (ARP1, ARP10) and chromatin-remodeller subunits (ARP6). No single molecular
  function covers the family.
