  diverged_from_family: false
  supported_by:
  - reference_id: PMID:25691535
    supporting_text: >-
      Exome sequencing revealed that both twins carried a novel de novo mutation (p.A39E) in the
      GAL gene. Functional analysis revealed that the p.A39E mutant showed antagonistic activity
      against galanin receptor 1 (GalR1)-mediated response, and decreased binding affinity and
      reduced agonist properties for GalR2.
  - reference_id: PMID:24602615
    supporting_text: >-
      Moreover, the inositol-1,4,5-triphosphate receptor (IP3R) was identified as the mediator
      responsible for increased intracellular Ca(2+) activating BK channels. Taken together,
      activation of GalR2 leads to elevation of intracellular Ca(2+) is due to Ca(2+) efflux from
      ER through IP3R sequentially opening BK channels.
