  seeds:
  - id: UniProtKB:P22466
  assessment: SOUND
  assessment_reason: >-
    Seeded from UniProtKB:P22466 based on direct experimental evidence in dispersed human
    adrenocortical cells (PMID:17982695), where galanin stimulates cyclic-AMP production and
    cortisol secretion via GALR1 in a manner suppressed by the adenylate cyclase inhibitor
    SQ-22536, alongside canonical GALR1/GALR3 Gi/o-mediated adenylate cyclase inhibition and
    GALR2 Gq/11-mediated phospholipase C activation in neuronal and endocrine tissues
    (Reactome:R-HSA-375280, PMID:24602615). PAINT should additionally assert the primary
    receptor-anchored pathway term GO:0090663 (galanin-activated signaling pathway) at
    PTN008359337.
  supported_by:
  - reference_id: PMID:17982695
    supporting_text: >-
      Galanin (10(-8) M) and ACTH (10(-9) M) enhanced cyclic-AMP production from dispersed cells,
      and the response was suppressed by the adenylate cyclase inhibitor SQ-22536 (10(-4) M).
