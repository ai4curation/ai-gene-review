family_id: PANTHER:PTHR16839
family_name: GALANIN
preferred_name: Galanin neuropeptide family
summary: >-
  Secreted vertebrate preprogalanin precursors (PANTHER:PTHR16839:SF1, InterPro:IPR008175) that
  are proteolytically cleaved at dibasic sites into the mature bioactive neuropeptide galanin
  (a C-terminally amidated 29-residue peptide in most vertebrates and a non-amidated 30-residue
  peptide in humans) and the 59- to 60-residue C-terminal galanin message-associated peptide
  (GMAP). Mature galanin possesses a strictly conserved N-terminal 13-residue pharmacophore
  (Gly1-Trp2-Thr3-Leu4-Asn5-Ser6-Ala7-Gly8-Tyr9-Leu10-Leu11-Gly12-Pro13) that binds and
  activates the three seven-transmembrane G protein-coupled galanin receptors GALR1
  (PANTHER:PTHR24230:SF31), GALR2 (PANTHER:PTHR24230:SF13), and GALR3 (PANTHER:PTHR24230:SF17)
  to initiate the galanin-activated signaling pathway (GO:0090663), regulating nociception,
  feeding, sleep, neuroendocrine hormone release, and insulin secretion.
functional_coherence: COHERENT
coherence_reason: >-
  PANTHER:PTHR16839 is a single-subfamily vertebrate neuropeptide family (PANTHER:PTHR16839:SF1
  GALANIN PEPTIDES) whose members all function as secreted neuropeptide hormones enabling
  neuropeptide hormone activity (GO:0005184) in the extracellular region (GO:0005576) and
  secretory granules (GO:0030141) to initiate the galanin-activated signaling pathway
  (GO:0090663, a child of GO:0007218 neuropeptide signaling pathway). PAINT places GO:0005576,
  GO:0030141, GO:0043025, GO:0005184, and GO:0007218 at the Euteleostomi root node
  PTN008359337, along with GO:0007189 (adenylate cyclase-activating G protein-coupled receptor
  signaling pathway, seeded from UniProtKB:P22466 based on the adrenocortical GALR1/adenylate
  cyclase-dependent cAMP response in PMID:17982695), but omits the primary receptor-anchored
  pathway term GO:0090663 (galanin-activated signaling pathway; Category B pathway gap).
