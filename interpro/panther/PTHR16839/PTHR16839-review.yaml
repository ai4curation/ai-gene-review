  label: GALANIN PEPTIDES
  description: >-
    Vertebrate galanin preprohormone orthologs (GAL). Processed into mature galanin (30
    residues in human, 29 residues in other vertebrates) and galanin message-associated peptide
    (GMAP). Mature galanin binds and activates all three galanin GPCRs — Gi/o-coupled GALR1 and
    GALR3 and Gq/11-coupled GALR2 — to drive the galanin-activated signaling pathway
    (GO:0090663).
