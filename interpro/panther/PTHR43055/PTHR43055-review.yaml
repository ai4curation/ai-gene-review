node_assessments:
- node_id: PANTHER:PTN000549240
  asserted_term:
    id: GO:0005829
    label: cytosol
  paint_snapshot: '20260530'
  seeds:
  - id: UniProtKB:P33221
    label: purT
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    This is the only PAINT IBD in the family. Recipients in the PAINT GAF include PurT proteins,
    PylC (Q8TUC0) and Synechocystis P74724. All are soluble prokaryotic enzymes, so cytosol is safe
    for every member. PAINT asserts no molecular function for the family.
term_assessments:
- assessed_term:
    id: GO:0043815
    label: phosphoribosylglycinamide formyltransferase 2 activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the defining activity, shown for E. coli PurT and attached to the family by the
    de_novo_purine_synthesis module for the PurT route. It is the core function in the P. putida purT
    review, which also removes the folate-dependent GO:0004644 on correct grounds. The only
    exceptions are the non-PurT ATP-grasp ligases in SF1. PylC is excepted on experimental evidence.
    The Methanobrevibacter carbamoyl-phosphate synthase is excepted on its UniProt functional
    annotation. Synechocystis P74724 is not excepted, because its PurK assignment comes only from a
    HAMAP rule.
  member_exceptions:
  - member:
      id: UniProtKB:Q8TUC0
      label: 3-methyl-D-ornithine--L-lysine ligase
      gene_symbol: pylC
      organism: Methanosarcina acetivorans
    exception_reason: >-
      PylC is the pyrrolysine-pathway ATP-grasp ligase. It joins the epsilon-amine of lysine to the
      carboxyl of 3-methyl-D-ornithine. It is not a GAR transformylase. The other two reviewed PylC
      proteins in SF1 (Q8PWY3, Q46E79) are excepted for the same reason.
    supported_by:
    - reference_id: PMID:21455182
      supporting_text: >-
        A much more tenable model for lysine conversion to the methylated pyrroline ring of
        pyrrolysine is rearrangement of lysine to (R, R)-3-methylornithine via a lysine mutase
        reaction, thus generating the D-ornithine derivative that is a substrate for ligation to
        lysine by PylC
  - member:
      id: UniProtKB:A5UK38
      label: Carbamoyl-phosphate synthase
      gene_symbol: Msm_0361
      organism: Methanobrevibacter smithii
    exception_reason: >-
      UniProt annotates this archaeal ATP-grasp protein as a carbamoyl-phosphate synthase (UniProtKB,
      checked 2026-10-06), with no GAR transformylase role.
    supported_by:
    - reference_id: file:interpro/panther/PTHR43055/PTHR43055-entries.csv
      supporting_text: A5UK38,Carbamoyl-phosphate synthase
  supported_by:
  - reference_id: PMID:8117714
    supporting_text: >-
      The protein, a product of the purT gene, is a monomer of molecular weight 42 kDa and catalyzes
      the production of beta-formyl GAR from formate, ATP, and beta-GAR.
  - reference_id: PMID:8501063
    supporting_text: >-
      Determination of GAR transformylase T activity in vitro required formate as the C1 donor.
- assessed_term:
    id: GO:0004644
    label: phosphoribosylglycinamide formyltransferase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    GO:0004644 is the folate-dependent PurN reaction (EC 2.1.2.2). PurT uses free formate and ATP and
    has no homology to PurN. The P. putida purT review removes the electronic GO:0004644 for this
    reason.
  supported_by:
  - reference_id: PMID:8117714
    supporting_text: No significant homology exists between the two transformylases.
- assessed_term:
    id: GO:0006189
    label: '''de novo'' IMP biosynthetic process'
  scope: FAMILY_WIDE
  scope_reason: >-
    This holds for the PurT majority (step 3 of de novo IMP synthesis), with the same exceptions as
    the molecular function: PylC works in pyrrolysine biosynthesis.
  member_exceptions:
  - member:
      id: UniProtKB:Q8TUC0
      label: 3-methyl-D-ornithine--L-lysine ligase
      gene_symbol: pylC
      organism: Methanosarcina acetivorans
    exception_reason: PylC acts in pyrrolysine biosynthesis, not purine synthesis.
    supported_by:
    - reference_id: PMID:21455182
      supporting_text: >-
        The pylB, pylC and pylD genes are each required for tRNA-independent pyrrolysine
        synthesis.
  supported_by:
  - reference_id: PMID:8501063
    supporting_text: >-
      We demonstrate here that Escherichia coli synthesizes two different glycinamide ribonucleotide
      (GAR) transformylases, both catalyzing the third step in the purine biosynthetic pathway.
