notes: >-
  The family has no yeast member. Fungi rely only on PurN-type ADE8/ade5 (PTHR43369), as the module
  notes. PANTHER's InterPro short name for this family is "PurK/PurT", which reflects the shared
  ATP-grasp fold. The module correctly uses PTHR11609 (not this family) for PurK. The PAINT GAF
  places Synechocystis P74724 ("purK", HAMAP-assigned) under the PurT family node PTN000549240.
  Whether it is a PurT or a PurK was not resolved here, and the cyanobacterial gene assignment should
  be checked experimentally.
