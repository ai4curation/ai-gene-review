family_id: PANTHER:PTHR43055
family_name: FORMATE-DEPENDENT PHOSPHORIBOSYLGLYCINAMIDE FORMYLTRANSFERASE
preferred_name: PurT formate-dependent GAR transformylase family (ATP-grasp)
summary: >-
  PurT is an ATP-grasp enzyme. It formylates glycinamide ribonucleotide (GAR) using free formate and
  ATP, through a formyl-phosphate intermediate, giving FGAR, ADP and phosphate (EC 6.3.1.21). It is
  an alternative to the folate-dependent PurN at step 3 of de novo purine synthesis. PurT is
  restricted to prokaryotes: E. coli has both, and only a purN purT double mutant needs purines.
  Fungi and animals have no PurT. Almost every reviewed member is PurT. The family's single
  subfamily also holds a few ATP-grasp ligases with other chemistry: the archaeal pyrrolysine
  biosynthesis enzyme PylC (3-methyl-D-ornithine--L-lysine ligase), a Methanobrevibacter
  ATP-grasp carbamoyl-phosphate synthase, and a Synechocystis protein that UniProt annotates as PurK
  (N5-CAIR synthase).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  225 of the 230 reviewed entries are formate-dependent GAR transformylases. The exceptions, all in
  SF1: three PylC proteins (Methanosarcina acetivorans Q8TUC0, M. mazei Q8PWY3, M. barkeri
  Q46E79), which make the lysine-ornithine amide of pyrrolysine; A5UK38 (Msm_0361),
  annotated as an ATP-grasp carbamoyl-phosphate synthase; and Synechocystis P74724, assigned PurK
  (N5-CAIR synthase) by a HAMAP rule rather than by experiment. PurK proper is in PTHR11609, and its
  ATP-grasp fold is shared with PurT.
