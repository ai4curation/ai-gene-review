  name:
    name: Prephenate/Arogenate Dehydrogenase
    short: Preph/Arog_dehydrog
  description:
  - text: The prephenate/arogenate dehydrogenase family consists of enzymes involved
      in the biosynthesis of aromatic amino acids, primarily tyrosine. Members of
      this family catalyze the NAD(+)-dependent oxidative decarboxylation of prephenate
      to form 4-hydroxyphenylpyruvate, a key step in the pathway. Some enzymes within
      this family can also catalyze the conversion of arogenate to tyrosine. These
      enzymes play a regulatory role in controlling the levels of tyrosine within
      the cell. Additionally, certain members are involved in the biosynthesis of
      secondary metabolites, such as antibiotics like novobiocin and chloramphenicol,
      by catalyzing the formation of specific intermediates. The family is characterized
      by a lack of chorismate mutase activity in some bacterial members, distinguishing
      them from bifunctional enzymes that possess both prephenate dehydrogenase and
      chorismate mutase activities.
