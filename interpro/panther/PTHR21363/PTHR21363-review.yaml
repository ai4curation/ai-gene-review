family_name: PREPHENATE DEHYDROGENASE
preferred_name: Prephenate dehydrogenase (TyrA/TYR1) family
summary: >-
  Prephenate dehydrogenases oxidatively decarboxylate prephenate to 4-hydroxyphenylpyruvate, committing
  it to tyrosine (S. cerevisiae TYR1, S. pombe tyr1, bacterial TyrA). Some bacterial members use
  arogenate or NADP+.
