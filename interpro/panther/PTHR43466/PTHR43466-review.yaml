preferred_name: OHCU decarboxylase (URAD) family
summary: >-
  OHCU decarboxylases (URAD; mouse and zebrafish Urad) that convert 2-oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline
  to S-allantoin, the last step of urate oxidation to allantoin. The gene is lost in hominoids, which
  PAINT records as a negated node.
