family_id: PANTHER:PTHR43523
family_name: GLUCOSE-1-PHOSPHATE ADENYLYLTRANSFERASE-RELATED
preferred_name: Bacterial/plant glucose-1-phosphate adenylyltransferase (ADP-glucose pyrophosphorylase) family
summary: >-
  Glucose-1-phosphate adenylyltransferases (ADP-glucose pyrophosphorylases, EC
  2.7.7.27) of the bacterial/plant nucleotidyltransferase fold. Members catalyse
  the first committed, rate-limiting step of glycogen (bacteria) and starch
  (plants) biosynthesis: the synthesis of ADP-alpha-D-glucose and diphosphate
  from alpha-D-glucose 1-phosphate and ATP, providing the activated glucosyl
  donor for the glycogen/starch synthases. The enzymes are allosterically
  regulated oligomers: the enterobacterial enzyme (E. coli GlgC) is a
  homotetramer activated by fructose-1,6-bisphosphate and inhibited by AMP,
  while the plant plastidial enzymes are heterotetramers of large and small
  subunits. The family also includes the ADP-glucose pyrophosphorylase of
  Mycobacterium tuberculosis and the plant starch-pathway subunits.
functional_coherence: COHERENT
coherence_reason: >-
  All members are ADP-glucose pyrophosphorylases catalysing EC 2.7.7.27; the
  downstream storage glucan (bacterial glycogen vs plant starch) and the
  oligomeric/regulatory architecture vary by lineage, but the reaction does not.
