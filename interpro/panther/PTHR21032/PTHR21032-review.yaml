family_id: PANTHER:PTHR21032
family_name: G PATCH DOMAIN-CONTAINING PROTEIN 11
preferred_name: GPATCH11/Sap34 family of spliceosome-associated G-patch proteins
summary: >-
  Family of small (~120-290 aa) G-patch-motif proteins orthologous to human GPATCH11,
  conserved across eukaryotes (InterPro IPR039249; reviewed members span human, mouse,
  bovine, frog, zebrafish, budding yeast YLR271W and fission yeast SPAC6F6.19/Sap34).
  The characterized members converge on a single function: regulation of pre-mRNA
  splicing in or near the early spliceosome. Human GPATCH11 is nucleoplasmic with an
  additional centrosomal pool, and its biallelic loss-of-function variants cause
  mis-splicing with early-onset retinal dystrophy and neurological impairment
  (PMID:39572588); the fission yeast ortholog Sap34 co-purifies with U2 snRNP and
  U4/U6.U5 tri-snRNP components, contacts the DEAH-box helicase Prp43 through its
  G-patch domain, and its deletion causes a global splicing defect with increased
  intron retention (PMID:42260140). The family's historic "CENP-Y" kinetochore
  association derives from a single low-resolution image in a large-scale
  mitotic-chromosome proteomic screen (PMID:20813266) and has been contradicted by
  dedicated localization work; the current PAINT curation has withdrawn it.
functional_coherence: COHERENT
coherence_reason: >-
  Apparently single-copy across the eukaryotes sampled in the reviewed slice, with no
  paralogous expansion; the experimentally characterized members at opposite ends of
  the tree (human GPATCH11 and S. pombe Sap34) share the same spliceosome-regulatory
  role, and no diverged subgroup is known.
