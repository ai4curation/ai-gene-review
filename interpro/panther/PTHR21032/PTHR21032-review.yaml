node_assessments:
  - node_id: PANTHER:PTN000471210
    asserted_term:
      id: GO:0005654
      label: nucleoplasm
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260225"
    seeds:
      - id: UniProtKB:Q8N954
        label: G patch domain-containing protein 11
        gene_symbol: GPATCH11
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Nucleoplasmic localization is safe at the eukaryote root for a spliceosome-
      associated G-patch protein. The seed is the human IDA from dedicated
      high-resolution microscopy (PMID:39572588), and the fission yeast ortholog's
      physical association with U2 snRNP and tri-snRNP components (PMID:42260140)
      independently requires a nuclear/nucleoplasmic pool at the far end of the tree.
      The seed being the (single, human) target of the resulting IBAs is expected,
      not circular. This IBD, together with the RNA-splicing IBD on the same node,
      is the corrected curation requested in geneontology/go-annotation#6450,
      replacing the withdrawn kinetochore assertion.
  - node_id: PANTHER:PTN000471210
    asserted_term:
      id: GO:0005813
      label: centrosome
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260225"
    seeds:
      - id: UniProtKB:Q8N954
        label: G patch domain-containing protein 11
        gene_symbol: GPATCH11
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      The centrosomal pool is directly observed for human GPATCH11 (PMID:39572588).
      Placing the term at the eukaryote root and pruning lineages that lack
      centrosomes is the PAINT convention, and the curator has done exactly that for
      fungi (IRD/NOT at PTN001077735, replaced by the broader MTOC term). Caveat:
      the cached slice cannot establish whether the family extends into other
      acentriolar lineages (e.g. land plants); if it does, those branches need the
      same IRD-plus-GO:0005815 treatment applied to fungi. For centriole-bearing
      animal descendants, including the human gene, inheritance is sound.
  - node_id: PANTHER:PTN000471210
    asserted_term:
      id: GO:0008380
      label: RNA splicing
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260225"
    seeds:
      - id: MGI:MGI:1858435
        label: G patch domain containing 11
        gene_symbol: Gpatch11
        organism: Mus musculus
    assessment: SOUND
    assessment_reason: >-
      Eukaryote-root placement of the splicing role is well supported despite the
      single mouse seed: the fission yeast ortholog Sap34, at the opposite end of the
      tree, gives a global splicing defect with increased intron retention on
      deletion and physically associates with early spliceosomal snRNPs
      (PMID:42260140), so the function is ancestral, not mammal-specific. Human
      patient and mouse retina data (PMID:39572588) corroborate. Propagation of the
      resulting IBA to human GPATCH11 would be sound and would fill a genuine gap -
      the human GOA record currently carries no splicing BP annotation at all.
  - node_id: PANTHER:PTN001077735
    asserted_term:
      id: GO:0005813
      label: centrosome
    node_taxon:
      id: NCBITaxon:4751
      label: Fungi
    paint_snapshot: "20260225"
    seeds:
      - id: PANTHER:PTN000471210
    assessment: SOUND
    assessment_reason: >-
      This is the negative (IRD/NOT) row pruning the centrosome term for the fungal
      clade, whose members (e.g. YLR271W, SPAC6F6.19/Sap34) have spindle pole bodies
      rather than centrosomes. Correct, taxon-aware pruning of the deeper centrosome
      IBD.
  - node_id: PANTHER:PTN001077735
    asserted_term:
      id: GO:0005815
      label: microtubule organizing center
    node_taxon:
      id: NCBITaxon:4751
      label: Fungi
    paint_snapshot: "20260225"
    seeds:
      - id: PANTHER:PTN000471210
    assessment: UNRESOLVED
    assessment_reason: >-
      The broader MTOC term re-asserted for fungi is the standard companion to the
      centrosome IRD and is defensible if the MTOC association is ancestral, but it
      is inference-on-inference: no cached experimental work reports spindle pole
      body localization for a fungal member (the Sap34 interactome study,
      PMID:42260140, reports spliceosomal partners and no SPB signal). Recorded as
      unresolved rather than unsound; direct fungal localization data would settle it.
  - node_id: PANTHER:PTN002720678
    asserted_term:
      id: GO:0007601
      label: visual perception
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20260225"
    seeds:
      - id: MGI:MGI:1858435
        label: G patch domain containing 11
        gene_symbol: Gpatch11
        organism: Mus musculus
    assessment: SOUND
    assessment_reason: >-
      Phenotype-derived placement: Gpatch11 mutant mice show impaired photoreceptor
      light responses and human biallelic variants cause early-onset retinal
      dystrophy (PMID:39572588), so bony-vertebrate orthologs are genuinely involved
      in visual perception, mechanistically via splicing of retinal transcripts.
      Sound as a contextual/phenotype-level annotation; a gene review should treat
      the resulting IBA as non-core relative to the splicing function.

term_assessments:
  - assessed_term:
      id: GO:0000398
      label: mRNA splicing, via spliceosome
    scope: FAMILY_WIDE
    scope_reason: >-
      Both deeply characterized members support spliceosomal splicing specifically:
      Sap34 complexes with U2 snRNP and tri-snRNP components and its loss causes
      intron retention (PMID:42260140); human/mouse loss of function dysregulates
      splicing in patient cells and retina (PMID:39572588). A future PAINT pass
      could safely deepen the current GO:0008380 IBD to this more specific term.
  - assessed_term:
      id: GO:0003723
      label: RNA binding
    scope: FAMILY_WIDE
    scope_reason: >-
      The defining G-patch motif is an RNA-binding/DEAH-helicase-cofactor module
      present in every member (InterPro IPR039249/IPR000467); GPATCH proteins carry
      multiple RNA-binding motifs (PMID:39572588). Safe family-wide at this level;
      no member has evidence for DNA binding, so the broader nucleic acid binding
      mapping is unnecessarily general.
  - assessed_term:
      id: GO:0000776
      label: kinetochore
    scope: NOT_APPLICABLE
    scope_reason: >-
      The historic "CENP-Y" kinetochore call rests on a single low-resolution GFP
      image in a ~4,000-protein mitotic-chromosome proteomic screen (PMID:20813266)
      and is contradicted by dedicated microscopy showing nucleoplasmic plus
      centrosomal localization with no kinetochore signal (PMID:39572588); flagged
      upstream in geneontology/go-annotation#6450. The 2026-02-25 PAINT snapshot no
      longer asserts it at any node; the stale 2017 IBA still visible in human GOA
      should lapse as the re-curation flows through.

references:
  - id: PMID:39572588
    title: GPATCH11 variants cause mis-splicing and early-onset retinal dystrophy with neurological impairment.
  - id: PMID:42260140
    title: GPATCH11 ortholog Sap34 regulates pre-mRNA splicing by interacting with early spliceosomal complexes in Schizosaccharomyces pombe.
  - id: PMID:20813266
    title: The protein composition of mitotic chromosomes determined using multiclassifier combinatorial proteomics.

