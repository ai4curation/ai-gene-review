notes: >-
  Written to back the human GPATCH11 gene review (PAINT human no-IBA project). All
  node ids, terms, seeds, taxa and snapshot dates are verbatim from the cached
  PTHR21032-paint.tsv (snapshot 20260225); member data from PTHR21032-entries.csv
  (reviewed slice: 7 proteins, all subfamily SF0 "G PATCH DOMAIN-CONTAINING PROTEIN
  11"; metadata reports 3870 proteins over 7699 taxa, 2 subfamilies). The negated
  PTN001077735 centrosome row is an IRD in the tsv and is assessed here as the
  pruning it represents. Central finding: the family is NOT uncurated - PAINT
  re-curated it on 2026-02-25, withdrawing the disputed kinetochore IBD and
  asserting nucleoplasm/centrosome/RNA splicing at PTN000471210 and visual
  perception at PTN002720678. The human gene's "no IBA" status (and its stale 2017
  kinetochore IBA) reflects GOA lag behind this re-curation, not missing or unsound
  PAINT work; once refreshed, human GPATCH11 should receive sound IBAs for
  GO:0005654, GO:0005813, GO:0008380 and GO:0007601. MGI:1858435 = Gpatch11
  verified against MGI; go-annotation#6450 verified live on GitHub. No
  residue_sites: the family question is localization/withdrawal, not a
  point-residue question.
