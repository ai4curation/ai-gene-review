notes: >-
  The family contains two human paralogs, so the whole human family was reviewed in one PR.
  PTHR13850 is a ligand family rather than a full signaling module; downstream PTPRZ/ALK,
  integrin and beta-catenin branches should be modeled in a separate pathway/module pass if
  that process is reviewed.
