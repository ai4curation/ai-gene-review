family_id: PANTHER:PTHR13850
family_name: PLEIOTROPHIN FAMILY MEMBER
preferred_name: Midkine/pleiotrophin heparin-binding growth factor family
summary: >-
  Small secreted vertebrate heparin- and chondroitin-sulfate-binding growth factors. Human
  MDK and PTN both signal from the extracellular space through glycosaminoglycan-dependent
  receptor complexes, especially PTPRZ-containing complexes that are clustered and inhibited
  by ligand binding. The human paralogs differ mostly in tissue and receptor-context emphasis:
  the PTN review has direct PTPRZ phosphatase-inhibition and oligodendrocyte-differentiation
  rows, while MDK carries stronger inflammatory-cell recruitment and Notch2/integrin contexts.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed vertebrate members are split into PTN and MDK subfamilies but retain the same
  two-domain pleiotrophin fold, a cleaved signal peptide, a cationic glycosaminoglycan-binding
  mature chain, and growth-factor activity. PAINT's only family-wide molecular-function IBD is
  the generic growth-factor activity; no PAINT node currently asserts the more receptor-specific
  PTPRZ, integrin, ALK, or proteoglycan branches.
