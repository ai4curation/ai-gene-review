    label: growth factor activity
  scope: FAMILY_WIDE
  scope_reason: >-
    MDK and PTN are the two human members and both are secreted vertebrate growth factors
    that use glycosaminoglycan-dependent receptor complexes; the PTN000354681 IBD therefore
    scopes correctly over both SF1 and SF2.
  supported_by:
  - reference_id: file:interpro/panther/PTHR13850/PTHR13850-paint.tsv
    supporting_text: "PTHR13850\tPTN000354681\tGO:0008083\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0005576
    label: extracellular region
  scope: FAMILY_WIDE
  scope_reason: >-
    The PAINT IBD is placed at the PTN branch, where the human, mouse and rat seeds all
    encode secreted pleiotrophin proteins, rather than at the root. That specific PAINT
    node should not be inherited by MDK, but both human paralogs encode cleaved, secreted
    extracellular ligands, so extracellular region is biologically safe across the family.
  supported_by:
  - reference_id: file:interpro/panther/PTHR13850/PTHR13850-paint.tsv
    supporting_text: "PTHR13850\tPTN008552330\tGO:0005576\tC\tIBD\tfalse"
