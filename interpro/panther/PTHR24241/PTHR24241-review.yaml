family_id: PANTHER:PTHR24241
family_name: NEUROPEPTIDE RECEPTOR-RELATED G-PROTEIN COUPLED RECEPTOR
preferred_name: Neuropeptide and peptide-hormone class A GPCR family (GnRH, vasopressin/oxytocin, orexin,
  cholecystokinin, neuropeptide FF receptors)
summary: PTHR24241 is a large family of class A (rhodopsin-like) G protein-coupled receptors for peptide
  ligands. Its reviewed members include the gonadotropin-releasing hormone receptors, the vasopressin
  and oxytocin receptors with their invertebrate counterparts, neuropeptide FF receptors, and orphan receptors
  GPR22 and GPR150; PAINT also places orexin and cholecystokinin receptors among its seeds. All are seven-transmembrane
  plasma membrane receptors that signal through heterotrimeric G proteins, but the ligand and the G protein
  differ by branch. This review was written from the human GnRH receptor and assesses the PAINT nodes
  whose annotations reach it; the other branches are described only as far as needed to judge those nodes.
functional_coherence: HETEROGENEOUS
coherence_reason: The shared function is G protein-coupled receptor activity at the plasma membrane. Ligand
  specificity is a property of the branch, and PAINT annotates it at branch nodes (GnRH, oxytocin, vasopressin,
  orexin, cholecystokinin and neuropeptide FF receptor activities each have their own node), which is
  the correct treatment. No ligand-specific term is safe at the family root.
