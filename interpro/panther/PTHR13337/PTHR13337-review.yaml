family_id: PANTHER:PTHR13337
family_name: SUCCINATE DEHYDROGENASE
preferred_name: Succinate dehydrogenase small cytochrome b subunit (SDHD/CybS) family
summary: >-
  Eukaryotic mitochondrial SDHD/CybS proteins (yeast SDH4, S. pombe sdh4, human SDHD), the small
  integral-membrane subunit of respiratory complex II. With SDHC/CybL it forms the membrane
  anchor that holds the SDHA/SDHB catalytic head on the matrix face of the inner membrane, ligates
  heme b between the two membrane subunits and builds the proximal ubiquinone-reduction site with
  SDHB. A fungal paralog, Tim18p (yeast TIM18), has diverged into a structural subunit of the TIM22
  carrier-insertion complex; PAINT records that branch as having lost the complex II functions.
  Bacterial SdhD anchors belong to a separate PANTHER family (PTHR38689).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The SDHD/CybS clade (PTN001000243) is uniformly a complex II membrane subunit; the TIM18 branch
  (PTN000330887) is a neofunctionalised TIM22 subunit within the same family.
