  name:
    name: Glycosyltransferase domain-containing protein
    short: Glycosyltransferase_domain
  description:
  - text: This family of proteins includes glycosyltransferases involved in various
      cellular processes such as vesicular trafficking, cell wall biogenesis, and
      synthesis of complex lipids. Members of this family are characterized by their
      ability to transfer sugar moieties from activated sugar donors to specific acceptor
      molecules, which can be proteins or lipids. Some proteins within this family
      have additional domains that confer specialized functions, such as binding to
      specific phospholipids or possessing additional enzymatic activities. These
      proteins play crucial roles in the modification of host cell processes during
      pathogen infection, the synthesis of cell wall components in fungi, and the
      regulation of cell morphology and membrane dynamics through the synthesis of
      mannosylated ceramides.
