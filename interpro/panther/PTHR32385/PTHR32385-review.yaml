node_assessments:
- node_id: PANTHER:PTN001285482
  asserted_term:
    id: GO:0000030
    label: mannosyltransferase activity
  evidence: IBD
  paint_snapshot: '20230111'
  seeds:
  - id: CGD:CAL0000176496
  - id: SGD:S000000365
  - id: SGD:S000005978
  - id: UniProtKB:Q4WDG6
  assessment: TOO_DEEP
  assessment_reason: >-
    Generic mannosyltransferase activity was placed on a node whose current PANTHER
    descendants include characterized fungal IPC mannosyltransferases, bacterial and
    diverse non-fungal eukaryotic proteins, and pvg2-like fungal proteins. Reviewed
    fungal IPC recipients should prefer GO:0103064 when the exact IPC-to-MIPC activity
    is supported, and a future PAINT update should re-place the IBD on narrower verified
    IPC mannosyltransferase branches rather than keeping it on PTN001285482.
  proposed_action:
    paint_action: REMOVE_IBD
  supported_by:
  - reference_id: file:interpro/panther/PTHR32385/PTHR32385-paint.tsv
    supporting_text: "PTHR32385\tPTN001285482\tGO:0000030\tF\tIBD\tfalse"
- node_id: PANTHER:PTN001285482
  asserted_term:
    id: GO:0051999
    label: mannosyl-inositol phosphorylceramide biosynthetic process
  evidence: IBD
  paint_snapshot: '20220925'
  seeds:
  - id: PomBase:SPAC17G8.11c
  - id: PomBase:SPAC2F3.01
  - id: PomBase:SPCC4F11.04c
  - id: UniProtKB:Q4WDG6
  assessment: TOO_DEEP
  assessment_reason: >-
    MIPC biosynthesis is correct for every reviewed fungal recipient of this IBA:
    MIT1 (CANAL), Q4WDG6 (ASPFU), CSH1 (yeast), SPAC17G8.11c (SCHPO),
    SPCC4F11.04c (SCHPO), SUR1 (yeast), and imt1 (SCHPO). The current PTN001285482
    descendant set is broader than those IPC mannosyltransferases, including non-fungal
    and pvg2-like fungal proteins whose IPC-to-MIPC role is unverified, so the IBD should
    be re-placed on narrower verified IPC mannosyltransferase branches.
  proposed_action:
    paint_action: REMOVE_IBD
  supported_by:
  - reference_id: file:interpro/panther/PTHR32385/PTHR32385-paint.tsv
    supporting_text: "PTHR32385\tPTN001285482\tGO:0051999\tP\tIBD\tfalse"
term_assessments:
- assessed_term:
    id: GO:0103064
    label: inositol phosphorylceramide mannosyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    Exact IPC mannosyltransferase activity is accepted or proposed across reviewed fungal
    Sur1/Csh1/Imt/Mit members, but PANTHER's SF15/SF20 assignments are mixed and no single
    current subfamily boundary cleanly captures only verified IPC mannosyltransferases.
  supported_by:
  - reference_id: PMID:15347680
    supporting_text: >-
      confirmed that mit1Delta did not synthesize MIPC, demonstrating a role of MIT1
      in the mannosylation of C. albicans IPCs
  - reference_id: PMID:19822220
    supporting_text: >-
      identified MitA as the only MIPC transferase in A. fumigatus. The DeltamitA
      mutant lacks MIPC and MIPC-derived glycosphingolipids and accumulates the
      precursor IPC.
- assessed_term:
    id: GO:0051999
    label: mannosyl-inositol phosphorylceramide biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    MIPC biosynthesis is sound for reviewed fungal IPC mannosyltransferases below
    PTN001285482, but the current PANTHER node also contains broader SF15/SF20/SF22/SF23
    membership, so the tree needs one or more narrower PAINT placements.
  supported_by:
  - reference_id: file:interpro/panther/PTHR32385/PTHR32385-paint.tsv
    supporting_text: "PTHR32385\tPTN001285482\tGO:0051999\tP\tIBD\tfalse"
