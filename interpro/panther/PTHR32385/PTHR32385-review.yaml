family_id: PANTHER:PTHR32385
family_name: MANNOSYL PHOSPHORYLINOSITOL CERAMIDE SYNTHASE
preferred_name: IPC mannosyltransferase (SUR1/CSH1/Imt) family
summary: >-
  Golgi or membrane GT32 mannosyltransferases that mannosylate inositol phosphorylceramide to MIPC
  (S. cerevisiae SUR1/CSG1 and CSH1; C. albicans MIT1; S. pombe imt1, SPCC4F11.04c/imt2 and
  SPAC17G8.11c/imt3; A. fumigatus MitA). S. cerevisiae Sur1/Csh1 function with the regulatory subunit
  Csg2.
functional_coherence: COHERENT
coherence_reason: Both subfamilies are IPC mannosyltransferases.
