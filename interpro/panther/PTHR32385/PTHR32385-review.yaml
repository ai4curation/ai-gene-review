family_id: PANTHER:PTHR32385
family_name: MANNOSYL PHOSPHORYLINOSITOL CERAMIDE SYNTHASE
preferred_name: IPC mannosyltransferase (SUR1/CSH1/Imt) family
summary: >-
  Golgi GT32 mannosyltransferases that mannosylate inositol phosphorylceramide to MIPC (S. cerevisiae
  SUR1/CSG1 and CSH1; S. pombe imt1, SPCC4F11.04c/imt2 and SPAC17G8.11c/imt3). They function with
  the regulatory subunit Csg2.
functional_coherence: COHERENT
coherence_reason: Both subfamilies are IPC mannosyltransferases.
