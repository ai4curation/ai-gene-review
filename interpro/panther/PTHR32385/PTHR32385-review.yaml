    label: inositol phosphorylceramide mannosyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    Exact IPC mannosyltransferase activity is accepted or proposed across reviewed fungal
    Sur1/Csh1/Imt/Mit members, but PANTHER's SF15/SF20 assignments are mixed and no single
    current subfamily boundary cleanly captures only verified IPC mannosyltransferases.
  supported_by:
  - reference_id: PMID:15347680
    supporting_text: >-
      confirmed that mit1Delta did not synthesize MIPC, demonstrating a role of MIT1
      in the mannosylation of C. albicans IPCs
  - reference_id: PMID:19822220
    supporting_text: >-
      identified MitA as the only MIPC transferase in A. fumigatus. The DeltamitA
      mutant lacks MIPC and MIPC-derived glycosphingolipids and accumulates the
      precursor IPC.
