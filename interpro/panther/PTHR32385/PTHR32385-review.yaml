family_id: PANTHER:PTHR32385
family_name: MANNOSYL PHOSPHORYLINOSITOL CERAMIDE SYNTHASE
preferred_name: IPC mannosyltransferase (SUR1/CSH1/Imt) family
summary: >-
  PTHR32385 is a GT32 glycosyltransferase family whose fungal Sur1/Csh1/Imt/MitA
  branches mannosylate inositol phosphorylceramide to MIPC (S. cerevisiae
  SUR1/CSG1 and CSH1; C. albicans MIT1; S. pombe imt1, SPCC4F11.04c/imt2 and
  SPAC17G8.11c/imt3; A. fumigatus MitA). The family is broader than IPC
  mannosyltransferases: the committed SF15/SF20 member inventory also contains
  pvg2-like fungal proteins and bacterial and viral glycosyltransferase/toxin/effectors.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The reviewed fungal Sur1/Csh1/Mit/Imt branches perform IPC mannosylation, but
  PTHR32385:SF15 and PTHR32385:SF20 are mixed in the current PANTHER tree and member
  inventory. The inventory places imt1 in SF15 alongside bacterial and viral
  glycosyltransferase-like proteins, and places the reviewed SF20 IPC
  mannosyltransferases alongside S. pombe pvg2.
