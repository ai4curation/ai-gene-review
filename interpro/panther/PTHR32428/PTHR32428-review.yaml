    id: NCBITaxon:6072
    label: Eumetazoa
  assessment: WRONG_NODE
  assessment_reason: >-
    PTN001286150 is a metazoan PRR5/PRR5L branch, but its Prr5 and Prr5l mouse
    seed accessions have MGI GO:0051897 rows citing PMID:21413931, which tested
    Protor-1/Protor-2 knockout mice and reported no Akt phosphorylation defect.
    The same seed paper instead found reduced SGK1/NDRG1 phosphorylation in
    Protor-1 knockouts. Those data support a metazoan PRR5/PRR5L role in mTORC2
    signaling and SGK1 activation, not the asserted positive regulation of the
    PI3K/AKT pathway.
  proposed_action:
    paint_action: REMOVE_IBD
