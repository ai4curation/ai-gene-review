  assessment_reason: >-
    As Bit61/PRR5 proteins are accessory subunits of Tor2/mTOR kinase
    complexes, PTN001286149 is the right shared node for a kinase-regulatory
    molecular-function assertion. The standalone GOA qualifier is still less
    precise for individual accessory proteins than a contributes_to statement,
    because these non-catalytic subunits contribute to the kinase-regulatory
    activity of TORC2 rather than acting as independent enzymes.
