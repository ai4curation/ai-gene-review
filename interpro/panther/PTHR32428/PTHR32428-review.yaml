    supporting_text: "PTHR32428\tPTN001286150\tGO:0051897\tP\tIBD\tfalse\tMGI:MGI:1919696|MGI:MGI:1924714\ttaxon:6072\t20260522"
  - reference_id: PMID:21413931
    supporting_text: >-
      Protor knockout mice display no defects in the phosphorylation of Akt
  - reference_id: PMID:21413931
    supporting_text: >-
      Protor-1 knockout mice displayed markedly reduced hydrophobic motif
      phosphorylation of SGK1
