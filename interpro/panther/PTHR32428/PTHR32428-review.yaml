- node_id: PANTHER:PTN001286149
  asserted_term:
    id: GO:0019887
    label: protein kinase regulator activity
  evidence: IBD
  paint_snapshot: '20260522'
  seeds:
  - id: PomBase:SPCC777.08c
  node_taxon:
    id: NCBITaxon:33154
    label: Opisthokonta
  assessment: UNRESOLVED
  assessment_reason: >-
    The single seed is PomBase:SPCC777.08c, the S. pombe bit61 experimental
    annotation. PMID:21035342 treats Bit61 as a TORC2-specific subunit whose
    cortical localization depends on Tor1, which makes a contributed
    kinase-regulatory activity plausible for the Bit61/PRR5 family. However,
    the seed paper does not define the Bit61 biochemical contribution to
    TORC2, and a standalone enables protein kinase regulator activity row is
    still less precise for individual non-catalytic TORC2 subunits than a
    contributes_to statement. Record the node as undecided pending
    bit61-specific evidence for the activity, not as a clean sound IBD.
