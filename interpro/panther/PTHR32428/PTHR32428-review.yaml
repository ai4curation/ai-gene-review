- assessed_term:
    id: GO:0051897
    label: positive regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction
  scope: NOT_APPLICABLE
  scope_reason: >-
    The exact human, mouse and rat PRR5/PRR5L representatives in this review
    that currently carry GO:0051897 have only PTN001286150 IBA rows, ISO rows
    copied from the same MGI seeds, or the MGI seed rows themselves. Those mouse
    Prr5/Prr5l seeds all cite PMID:21413931, whose Protor-1/Protor-2 knockout
    data support an SGK1/NDRG1 effect and explicitly do not support reduced Akt
    phosphorylation. Independent PRR5L perturbation data likewise support
    selective PKCdelta, not AKT, regulation. Current evidence therefore argues
    against positive regulation of the PI3K/AKT pathway for both metazoan
    PRR5/PRR5L subfamilies.
  supported_by:
