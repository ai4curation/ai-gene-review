- node_id: PANTHER:PTN001286150
  asserted_term:
    id: GO:0051897
    label: positive regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction
  evidence: IBD
  paint_snapshot: '20260522'
  seeds:
  - id: MGI:MGI:1919696
  - id: MGI:MGI:1924714
  node_taxon:
    id: NCBITaxon:6072
    label: Eumetazoa
  assessment: WRONG_NODE
  assessment_reason: >-
    The row is confined to a metazoan PRR5/PRR5L branch and therefore does not
    descend to fungal Bit61/Bit2 members. Its Prr5 and Prr5l mouse seeds both
    trace to PMID:21413931, which tested Protor-1/Protor-2 knockout mice and
    reported no Akt phosphorylation defect, but did find reduced SGK1/NDRG1
    phosphorylation in Protor-1 knockouts. Those data support a metazoan
    PRR5/PRR5L role in mTORC2 signaling and SGK1 activation, not the asserted
    positive regulation of the PI3K/AKT pathway.
  affected_subfamilies:
  - id: PANTHER:PTHR32428:SF3
    label: PROLINE-RICH PROTEIN 5-LIKE
  - id: PANTHER:PTHR32428:SF4
    label: PROLINE-RICH PROTEIN 5
