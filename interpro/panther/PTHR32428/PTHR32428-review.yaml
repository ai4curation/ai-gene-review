- assessed_term:
    id: GO:0019887
    label: protein kinase regulator activity
  scope: UNRESOLVED
  scope_reason: >-
    Bit61/PRR5 proteins are non-catalytic accessory subunits of TORC2/mTORC2
    kinase complexes, making a contributed kinase-regulatory role plausible
    across the reviewed family. The only PAINT seed for this term is the
    fission-yeast bit61 row, and the underlying paper establishes Bit61 as a
    TORC2-specific subunit without defining its biochemical regulatory
    contribution, so the term should not yet be treated as adjudicated safe for
    every descendant.
  supported_by:
