family_id: PANTHER:PTHR32428
family_name: TARGET OF RAPAMYCIN COMPLEX 2 SUBUNIT BIT61-RELATED
preferred_name: Bit61/PRR5 TORC2 accessory subunits
summary: >-
  PTHR32428 is the Bit61/PRR5 family of TORC2 and mTORC2 accessory subunits.
  PAINT places TORC2 complex membership and TORC2 signaling at the
  opisthokont Bit61/PRR5 node PANTHER:PTN001286149, supported by fungal
  Bit61/Bit2 and metazoan PRR5/PRR5L descendants. The protein kinase regulator
  activity IBD on the same node is biologically plausible but remains
  under-supported by its single bit61 seed, a separate fungal node carries the
  broad cell-polarity output of TORC2 signaling, and a metazoan PRR5/PRR5L
  branch carries a PI3K/AKT assertion that is contradicted by its mouse Protor
  seed paper.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed subfamilies are non-catalytic HbrB/Bit61-PRR5 accessory
  subunits of TORC2 or mTORC2. Their shared biology is complex membership and
  participation in TORC2-family kinase signaling, although downstream processes
  differ between fungal TORC2 and metazoan mTORC2 contexts.
