term_assessments:
- assessed_term:
    id: GO:0004321
    label: fatty-acyl-CoA synthase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    Not safe for any member. The term names the fatty acid synthase reaction (EC
    2.3.1.86), a multi-domain condensation and reduction cycle that no member of
    this AMP-forming ligase family can catalyse. Its presence across the family
    traces to one IBD whose seed confused acyl-CoA synthetase (ligase) with
    fatty-acyl-CoA synthase.
  supported_by:
  - reference_id: PMID:12709059
    supporting_text: Recombinant O-MACS protein tagged with c-Myc and His6
      demonstrated an acyl-CoA synthetase activity for fatty acid activation
- assessed_term:
    id: GO:0015645
    label: fatty acid ligase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The shared ligase chemistry of the family; substrate-specific child terms
    (medium-chain fatty acid, benzoate, 4-hydroxybutyrate CoA ligase) belong at
    subfamily level.
