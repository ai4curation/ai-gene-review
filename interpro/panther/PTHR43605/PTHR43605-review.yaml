family_id: PANTHER:PTHR43605
family_name: ACYL-COENZYME A SYNTHETASE
preferred_name: Medium-chain acyl-CoA synthetase (ACSM) family of AMP-forming ligases
summary: >-
  PTHR43605 is a family of AMP-forming acyl-CoA synthetases (ANL superfamily, EC
  6.2.1) that activate a carboxylic acid with ATP to an acyl-adenylate and then
  transfer the acyl group to coenzyme A. Vertebrate members are the mitochondrial
  medium-chain acyl-CoA synthetases ACSM1 to ACSM6, which activate medium-chain
  fatty acids and, for several of them, benzoate and other xenobiotic carboxylates.
  The family root is placed at LUCA, and most of the roughly 12,800 UniProtKB
  members are bacterial or archaeal. In the prokaryotic subfamily SF10 the one
  characterised member is the Metallosphaera sedula 4-hydroxybutyrate--CoA ligase
  Msed_0406. No member has fatty acid synthase domains.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The ligase chemistry (ATP-dependent activation of a carboxylate to its CoA
  thioester) is shared by every characterised member and is the basis of the
  family-wide GO:0015645 fatty acid ligase activity IBD. Substrate preference
  varies by subfamily (C4-C12 fatty acids, isobutyrate, benzoate and xenobiotic
  acids in mammals, 4-hydroxybutyrate and short-chain acids in Metallosphaera), so
  more specific substrate terms are subfamily-level, not family-wide. Most
  prokaryotic members are uncharacterised.
