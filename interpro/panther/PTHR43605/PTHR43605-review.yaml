node_assessments:
- node_id: PANTHER:PTN001944787
  asserted_term:
    id: GO:0004321
    label: fatty-acyl-CoA synthase activity
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: RGD:727928
    gene_symbol: Acsm4
    organism: Rattus norvegicus
  assessment: WRONG_NODE
  assessment_reason: >-
    The seed does not support this term at any node. GO:0004321 is the fatty acid
    synthase reaction (EC 2.3.1.86: acetyl-CoA + n malonyl-CoA + NAD(P)H to a
    long-chain acyl-CoA), whereas the seed paper reports acyl-CoA synthetase
    (ligase) activity for fatty acid activation. The names differ by one syllable
    (synthase vs synthetase). No family member has the ketoacyl synthase,
    reductase, dehydratase or acyl carrier domains that the reaction needs, and the
    same node already carries the correct ligase term (GO:0015645, eight seeds).
    Placed at the family root, the IBD reaches the whole family: in UniProt
    2026_03, 12,328 of the 12,837 PTHR43605 entries carry GO:0004321, including
    8,209 bacterial entries and all seven human ACSMs (each EC 6.2.1.2). The IBD
    should be retracted, and the RGD seed row checked.
  affected_subfamilies:
  - id: PANTHER:PTHR43605:SF8
    label: ACYL-COENZYME A SYNTHETASE ACSM4, MITOCHONDRIAL
  - id: PANTHER:PTHR43605:SF10
    label: ACYL-COA SYNTHETASE MEDIUM CHAIN FAMILY MEMBER 3
  supported_by:
  - reference_id: file:interpro/panther/PTHR43605/PTHR43605-paint.tsv
    supporting_text: "PTHR43605\tPTN001944787\tGO:0004321\tF\tIBD\tfalse\tRGD:727928\ttaxon:\t20170228"
  - reference_id: PMID:12709059
    supporting_text: Recombinant O-MACS protein tagged with c-Myc and His6
      demonstrated an acyl-CoA synthetase activity for fatty acid activation
- node_id: PANTHER:PTN001944787
  asserted_term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: MGI:MGI:2152200
    gene_symbol: Acsm1
    organism: Mus musculus
  - id: MGI:MGI:99538
    gene_symbol: Acsm3
    organism: Mus musculus
  assessment: UNRESOLVED
  assessment_reason: >-
    Both seeds are MGI IDA rows from PMID:11470804. That paper's abstract reports
    that the acyl-CoAs these enzymes produce are used mainly for oxidation, which
    argues against a role in fatty acid synthesis. The intended term may have been
    a fatty-acyl-CoA biosynthetic process term, a near-homonym of this one. Only the
    abstract was read, so the node is left unresolved. Gene reviews in this family
    mark the inherited row as over-annotated rather than removing it. Even if the
    mammalian seeds hold, a root (LUCA) placement passes the term to thousands of
    prokaryotic members with no fatty acid biosynthesis evidence.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43605/PTHR43605-paint.tsv
    supporting_text: "PTHR43605\tPTN001944787\tGO:0006633\tP\tIBD\tfalse\tMGI:MGI:2152200|MGI:MGI:99538\ttaxon:\t20170228"
  - reference_id: PMID:11470804
    supporting_text: (14)C-Fatty acid incorporation studies indicated that
      acyl-CoAs produced by MACS1 and Sa protein are utilized mainly for oxidation.
