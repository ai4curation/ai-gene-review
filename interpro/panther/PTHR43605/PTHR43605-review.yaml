    ATP-dependent activation of a carboxylic acid to its CoA thioester is the
    defining chemistry of the family and is shown for mammalian ACSMs from several
    subfamilies and for the archaeal SF10 member Msed_0406. Fatty acid ligase
    activity is broad enough to cover the substrate range seen so far, so a root
    placement is reasonable.
  supported_by:
