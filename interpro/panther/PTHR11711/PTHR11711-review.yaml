family_id: PANTHER:PTHR11711
family_name: ADP RIBOSYLATION FACTOR-RELATED
preferred_name: Arf/Arl regulatory GTPases
summary: >-
  PTHR11711 collects the ADP-ribosylation factor (Arf) and Arf-like (Arl) small GTPases,
  a large branch of the Ras superfamily built on a P-loop G domain plus an N-terminal
  amphipathic helix that is myristoylated or acetylated and inserts into membranes when
  the protein is GTP-loaded. Members are not enzymes acting on a diffusible substrate:
  the conserved chemistry is the nucleotide cycle itself, and the biological output is
  the recruitment of effectors to a particular membrane. Intrinsic hydrolysis is slow and
  is completed by ArfGAPs, which supply an arginine finger in trans, so the G domain
  encodes the switch but not a fast turnover rate.

  The family name is historical -- Arf was named as a cofactor for cholera-toxin-catalysed
  ADP-ribosylation, not because its members ADP-ribosylate anything -- which is why a
  preferred_name is recorded alongside it.

  What differs between members is where the switch operates. The classical ARFs (ARF1-5)
  act at the Golgi and drive COPI and clathrin-adaptor recruitment; ARF6 works at the
  plasma membrane and endocytic compartments; ARL1 marks the TGN for golgin tethers; the
  ARL5 clade acts at the TGN, where it is recruited downstream of ARFRP1-SYS1 and in turn
  recruits the GARP tethering complex and the ARMH3-PI4KB module for endosome-to-TGN
  retrograde traffic; and ARL6/BBS3 has moved out of the secretory pathway altogether into
  BBSome-dependent ciliary transport. Nucleotide-binding terms are therefore safe across
  the whole family while compartment terms are not.

functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members share the G-domain switch mechanism but not the membrane they switch on. Within
  this one family sit Golgi ARFs (human ARF1 P84077, ARF5 P84085), the plasma-membrane and
  endocytic ARF6 (P62330), the TGN-acting ARL5 clade (human ARL5A Q9Y689, ARL5B Q96KC2,
  Drosophila Arl5 Q9VSG8) and the ciliary ARL6/BBS3 (human Q9H0F7, PANTHER
  PTHR11711:SF21), whose characterised role is BBSome-mediated transport into the cilium
  rather than membrane traffic through the Golgi. A compartment or pathway term placed at
  the family root would descend across all of these. Note that ARL2 and SAR1A, often
  discussed alongside these proteins, are classified by PANTHER in other families
  (PTHR45697 and PTHR45684 respectively) and are not members here.

reference_protein:
  id: UniProtKB:Q9Y689
  label: ADP-ribosylation factor-like protein 5A
  gene_symbol: ARL5A
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR11711:SF147
    label: ADP-RIBOSYLATION FACTOR-LIKE PROTEIN 5A
    description: >-
      Vertebrate ARL5A. The subfamily the gene under review belongs to: Xenopus tropicalis
      arl5a (F6WPT1) is classified PTHR11711:SF147 by PANTHER 19. Human ARL5A is the
      best-characterised member and anchors the g_domain site.
    representative_members:
      - id: UniProtKB:Q9Y689
        label: ARL5A
        organism: Homo sapiens
      - id: UniProtKB:F6WPT1
        label: arl5a
        organism: Xenopus tropicalis
        gene_review: genes/XENTR/F6WPT1/F6WPT1-ai-review.yaml
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11711:SF146
    label: ADP-RIBOSYLATION FACTOR-LIKE PROTEIN 5B
    description: >-
      Vertebrate ARL5B, the paralog of ARL5A arising from the vertebrate duplication. The
      two are functionally redundant enough that most retrograde-trafficking phenotypes
      require depleting both, and they cluster together in ARF-family interactome data,
      apart from the classical ARFs.
    representative_members:
      - id: UniProtKB:Q96KC2
        label: ARL5B
        organism: Homo sapiens
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11711:SF31
    label: ADP-RIBOSYLATION FACTOR-LIKE 5
    description: >-
      The invertebrate ARL5 subfamily, holding the single pre-duplication ARL5 orthologs:
      Drosophila Arl5 (Q9VSG8, FB:FBgn0035866) and C. elegans arl-5 (P34212). Drosophila
      Arl5 is the seed behind this family's trans-Golgi-network PAINT assertion, so this
      subfamily is inside the ARL5 clade for scoping purposes even though it sits outside
      the vertebrate SF146/SF147 split.
    representative_members:
      - id: UniProtKB:Q9VSG8
        label: Arl5
        organism: Drosophila melanogaster
      - id: UniProtKB:P34212
        label: arl-5
        organism: Caenorhabditis elegans
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11711:SF357
    label: ADP-RIBOSYLATION FACTOR 1
    description: >-
      Canonical ARF1, recorded because it is the family's best-characterised member
      overall, is in this repo as a gene review, and serves as the independent positive
      control for the g_domain site (its G domain is intact but its numbering runs one
      residue ahead of ARL5A). Its compartment is the Golgi and the ER-Golgi interface
      rather than the TGN-GARP axis.
    representative_members:
      - id: UniProtKB:P84077
        label: ARF1
        organism: Homo sapiens
        gene_review: genes/human/ARF1/ARF1-ai-review.yaml
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11711:SF21
    label: ADP-RIBOSYLATION FACTOR-LIKE PROTEIN 6
    description: >-
      ARL6/BBS3. Recorded as the family's clearest functional outlier and because it is in
      this repo as a gene review. PAINT places the ciliary assertions (GO:0005930 axoneme,
      GO:0060271 cilium assembly, GO:0061512 protein localization to cilium) at a separate
      node, PTN000196179, seeded only by Arl6 orthologs -- which is why those terms do not
      descend to ARL5.
    representative_members:
      - id: UniProtKB:Q9H0F7
        label: ARL6
        organism: Homo sapiens
        gene_review: genes/human/ARL6/ARL6-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      ARL6/BBS3 acts in BBSome-dependent transport into and within the cilium rather than
      in Golgi or endosome-to-TGN membrane traffic. It retains the G-domain switch, so
      nucleotide terms are inherited correctly, but its compartment and process terms
      belong to the ciliary node and must not be exchanged with the ARL5 or classical-ARF
      branches in either direction.

node_assessments:
  - node_id: PANTHER:PTN000195484
    asserted_term:
      id: GO:0005802
      label: trans-Golgi network
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20171006"
    seeds:
      - id: FB:FBgn0035866
        label: Arl5
        organism: Drosophila melanogaster
    assessment: SOUND
    assessment_reason: >-
      This is the ARL5-clade node, not the family root, and that is the point. Its sibling
      assertion at the same node (GO:1903292) is seeded by Drosophila Arl5 plus human
      ARL5A and ARL5B, so the three seeds behind PTN000195484 are exactly the ARL5
      orthologs -- PANTHER classifies them PTHR11711:SF31, SF147 and SF146. The family's
      other localisation assertions sit at different nodes (PTN000918064 and PTN002619726
      assert plasma membrane, PTN000195580 Golgi apparatus, PTN000918220 lysosomal
      membrane, PTN000196179 axoneme), so trans-Golgi network does not descend to ARF6 or
      to ARL6/BBS3. The target of this review, Xenopus arl5a (F6WPT1), is PTHR11711:SF147
      and therefore inside the clade the assertion was placed for. That the term rests on
      a single declared seed is not a weakness: TGN localisation of ARL5 is established in
      both the fly seed and the vertebrate paralogs, and the curator's claim is about
      where the property arose, not how many donors were counted.

  - node_id: PANTHER:PTN000195484
    asserted_term:
      id: GO:1903292
      label: protein localization to Golgi membrane
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20171006"
    seeds:
      - id: FB:FBgn0035866
        label: Arl5
        organism: Drosophila melanogaster
      - id: UniProtKB:Q9Y689
        label: ARL5A
        organism: Homo sapiens
      - id: UniProtKB:Q96KC2
        label: ARL5B
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      The seeds are the ARL5 orthologs themselves, and the asserted property is the direct
      consequence of what they do: ARL5-GTP recruits the GARP tethering complex to the TGN,
      GARP promotes SNARE-dependent fusion of endosome-derived carriers, and loss of ARL5
      leaves TGN-resident cargo stranded in endosomes rather than returned to the Golgi
      membrane. Placement at the ARL5 clade rather than at the family root is what keeps
      this off the ciliary and plasma-membrane branches. The term is a downstream-maintenance
      statement rather than a direct molecular activity, but that is a granularity question
      for the gene rows, not a node-placement error.

  - node_id: PANTHER:PTN000917851
    asserted_term:
      id: GO:0005525
      label: GTP binding
    paint_snapshot: "20230110"
    seeds:
      - id: UniProtKB:P62330
        label: ARF6
        organism: Homo sapiens
      - id: UniProtKB:P18085
        label: ARF4
        organism: Homo sapiens
      - id: FB:FBgn0000115
        label: Arl1
        organism: Drosophila melanogaster
    assessment: SOUND
    assessment_reason: >-
      A deep node asserting the property that defines the family. Nucleotide binding is
      carried by the G domain, and the G1/P-loop, G3 and G4 motifs are intact in every
      member inspected here -- the g_domain site records the positions and the target
      retains all of them. There is no subfamily of PTHR11711 for which this term is
      unsafe, so a deep placement is correct rather than over-broad. This is the kind of
      node where challenging the placement would require showing a descendant that has
      lost the nucleotide site, and no such member was found.

  - node_id: PANTHER:PTN000917851
    asserted_term:
      id: GO:0005737
      label: cytoplasm
    paint_snapshot: "20260828"
    seeds:
      - id: UniProtKB:P84077
        label: ARF1
        organism: Homo sapiens
      - id: UniProtKB:P62330
        label: ARF6
        organism: Homo sapiens
      - id: FB:FBgn0035866
        label: Arl5
        organism: Drosophila melanogaster
      - id: SGD:S000000368
        label: ARL1
        organism: Saccharomyces cerevisiae
      - id: WB:WBGene00000182
        label: arf-1
        organism: Caenorhabditis elegans
      - id: MGI:MGI:1927136
        label: Arl6
        organism: Mus musculus
    assessment: SOUND
    assessment_reason: >-
      Placed at the same deep node as GTP binding and seeded across plants, fungi, animals
      and Dictyostelium. Every Arf-family GTPase has a cytosolic GDP-bound pool before its
      N-terminal amphipathic helix engages a membrane, so the assertion is true of all
      descendants including the target. The objection to this row is not that it is
      misplaced but that cytoplasm is uninformative for a protein whose functional address
      is the TGN; that is handled as a granularity call on the gene row
      (KEEP_AS_NON_CORE), and cytoplasm subsumes the Golgi anyway, so it is not
      contradicted by the more specific compartment.

  - node_id: PANTHER:PTN000918181
    asserted_term:
      id: GO:0016192
      label: vesicle-mediated transport
    paint_snapshot: "20260828"
    seeds:
      - id: FB:FBgn0035866
        label: Arl5
        organism: Drosophila melanogaster
      - id: FB:FBgn0010348
        label: Arf1
        organism: Drosophila melanogaster
      - id: UniProtKB:P84077
        label: ARF1
        organism: Homo sapiens
      - id: UniProtKB:P84085
        label: ARF5
        organism: Homo sapiens
      - id: UniProtKB:P62330
        label: ARF6
        organism: Homo sapiens
      - id: SGD:S000000368
        label: ARL1
        organism: Saccharomyces cerevisiae
    assessment: SOUND
    assessment_reason: >-
      An intermediate node above the ARL5 clade, seeded by the classical ARFs, yeast ARL1
      and Drosophila Arl5 together. The breadth of the seed set is consistent with the
      breadth of the term: what these proteins have in common is that they regulate
      vesicular traffic, and that is what is asserted, without committing to a
      compartment or a direction. The target's own biology -- GARP-dependent tethering of
      endosome-derived carriers at the TGN -- is a form of vesicle-mediated transport, so
      the term is true for it, if less specific than what is known.

  - node_id: PANTHER:PTN000918181
    asserted_term:
      id: GO:0006886
      label: intracellular protein transport
    paint_snapshot: "20250902"
    seeds:
      - id: MGI:MGI:1927136
        label: Arl6
        organism: Mus musculus
      - id: SGD:S000000368
        label: ARL1
        organism: Saccharomyces cerevisiae
      - id: SGD:S000005620
        label: ARF3
        organism: Saccharomyces cerevisiae
      - id: WB:WBGene00000182
        label: arf-1
        organism: Caenorhabditis elegans
    assessment: SOUND
    assessment_reason: >-
      The same intermediate node, with a seed set that spans the ciliary branch (mouse
      Arl6) as well as the Golgi and TGN branches (yeast ARF3 and ARL1, C. elegans arf-1).
      That mixture is exactly why the term asserted here is the generic parent rather than
      a compartment-specific child: the curator placed what the seeds actually share.
      Inherited by the target it is true but coarse -- ARL5 moves TGN-resident cargo
      proteins back from endosomes, which is intracellular protein transport. Recorded as
      SOUND with the caveat that any attempt to read a specific route out of this node
      would be reading in more than the seeds support.

residue_sites:
  - site_id: g_domain
    label: G-domain nucleotide-binding motifs (G1/P-loop, G3/DxxG, G4/NKxD)
    description: >-
      The positions that hold GTP and Mg(2+) in the Arf fold, plus the switch II glutamine
      that orients the attacking water. Recorded as a site that is expected to be
      *retained* across this family rather than as a discriminator: unlike the pseudo-enzyme
      cases this schema was built for, no PTHR11711 member inspected here has lost the
      nucleotide machinery, and the site exists so that a claim to the contrary about any
      member is contradicted by data rather than left to prose.

      All positions lie inside curated GTP-binding features on the anchor's own UniProt
      record (BINDING 23..30, 66..70 and 125..128 on Q9Y689), and each was read directly
      from the sequence rather than transferred from an alignment column.
    anchor:
      id: UniProtKB:Q9Y689
      label: ARL5A
      organism: Homo sapiens
    anchor_sequence_version: 1
    site_source: UNIPROT_FEATURE
    residues:
      - {position: 29, expected: [K], role: P-loop lysine; contacts the beta and gamma phosphates}
      - {position: 30, expected: [T], role: P-loop threonine; Mg(2+) coordination}
      - {position: 66, expected: [D], role: G3/DxxG aspartate; Mg(2+) coordination through water}
      - {position: 69, expected: [G], role: G3/DxxG glycine; senses the gamma phosphate and sets switch II}
      - {position: 70, expected: [Q], role: switch II glutamine; orients the nucleophilic water}
      - {position: 126, expected: [K], role: G4/NKxD lysine; stacks against the guanine base}
      - {position: 128, expected: [D], role: G4/NKxD aspartate; hydrogen bonds the guanine base and sets specificity for G over A}
    required_for:
      - term:
          id: GO:0005525
          label: GTP binding
        strength: CONTRIBUTES
        rationale: >-
          The P-loop lysine and threonine grip the phosphates and the Mg(2+), and the G4
          aspartate is what reads the guanine base rather than adenine, so these positions
          are how the fold recognises GTP specifically. Recorded as CONTRIBUTES rather than
          REQUIRED because binding is a distributed property of the whole nucleotide pocket
          and losing one contact reduces affinity rather than provably abolishing binding;
          only REQUIRED licenses a validator to contradict a gene review, and that
          licence is not warranted at single-position granularity here.
      - term:
          id: GO:0003924
          label: GTPase activity
        strength: CONTRIBUTES
        rationale: >-
          Hydrolysis in the Arf family runs through a water molecule positioned by the
          switch II glutamine (position 70 in ARL5A numbering; the residue mutated in the
          classic constitutively active Q70L/Q71L alleles) and by the G3 aspartate-held
          Mg(2+). The dependency is deliberately CONTRIBUTES and not REQUIRED: Arf-family
          intrinsic hydrolysis is slow and is completed by an ArfGAP arginine finger
          supplied in trans, so the G domain alone does not determine whether the protein
          turns over GTP at a physiologically meaningful rate, and a residue argument here
          cannot carry the weight that a catalytic-triad argument carries in an enzyme.
    positive_controls:
      - id: UniProtKB:Q9Y689
        label: ARL5A
        organism: Homo sapiens
        control_position: 29
        control_residue: K
      - id: UniProtKB:Q96KC2
        label: ARL5B
        organism: Homo sapiens
        control_position: 29
        control_residue: K
      - id: UniProtKB:P84077
        label: ARF1
        organism: Homo sapiens
        control_position: 30
        control_residue: K
    negative_controls: []

term_assessments:
  - assessed_term:
      id: GO:0005525
      label: GTP binding
    scope: FAMILY_WIDE
    scope_reason: >-
      The G domain is what makes a protein a member of this family, and the G1, G3 and G4
      motifs are intact in every member checked (human ARL5A, ARL5B and ARF1, Drosophila
      Arl5, C. elegans arl-5, Xenopus arl5a). No subfamily was found in which the
      nucleotide site is degenerate, so the term is safe for all descendants.

  - assessed_term:
      id: GO:0003924
      label: GTPase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Also family-wide, with a caveat that belongs in the record rather than in the scope:
      Arf-family GTPases hydrolyse GTP slowly on their own and depend on ArfGAPs for
      efficient turnover, so the term describes a genuine but GAP-assisted activity. That
      is a property of the whole family rather than a subfamily distinction, so it does not
      narrow the scope. The switch II glutamine is retained across the members inspected.

  - assessed_term:
      id: GO:0005737
      label: cytoplasm
    scope: FAMILY_WIDE
    scope_reason: >-
      True of all members -- each cycles through a soluble GDP-bound pool before membrane
      insertion of the N-terminal amphipathic helix -- and broad enough to subsume the
      organellar compartments the individual branches occupy. Safe but uninformative;
      whether to treat it as core is a per-gene judgement, not a family-scope question.

  - assessed_term:
      id: GO:0005802
      label: trans-Golgi network
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      TGN localisation is a property of the ARL5 clade, not of the family. PAINT records it
      at PTN000195484, whose seeds are the ARL5 orthologs, and the family's other
      compartment assertions sit at separate nodes for the plasma membrane, the Golgi
      apparatus, the lysosomal membrane and the axoneme. ARF6 (plasma membrane and
      endocytic) and ARL6/BBS3 (cilium) must not inherit it. The three subfamilies named
      below are those PANTHER assigns to the ARL5 orthologs themselves: SF147 (ARL5A,
      including the Xenopus target), SF146 (ARL5B) and SF31 (the invertebrate ARL5s,
      including the Drosophila seed). ARL1 also marks the TGN, but by a distinct
      golgin-tethering mechanism, and its own subfamily assignment was not established
      here, so it is deliberately not listed rather than guessed at.
    applicable_subfamilies:
      - {id: PANTHER:PTHR11711:SF147, label: ADP-RIBOSYLATION FACTOR-LIKE PROTEIN 5A}
      - {id: PANTHER:PTHR11711:SF146, label: ADP-RIBOSYLATION FACTOR-LIKE PROTEIN 5B}
      - {id: PANTHER:PTHR11711:SF31, label: ADP-RIBOSYLATION FACTOR-LIKE 5}
    supported_by:
      - reference_id: PMID:38606629
        supporting_text: classical ARFs, except for ARF6, clustered together, as did ARL5A and ARL5B

  - assessed_term:
      id: GO:1903292
      label: protein localization to Golgi membrane
    scope: UNRESOLVED
    scope_reason: >-
      Deliberately left unresolved rather than scoped. The term is well grounded in the
      ARL5 clade through PTN000195484, and it is independently grounded by direct
      experiment on human ARF1 in a different part of the family, so the safe set spans at
      least two distant branches. Enumerating a complete allowed list across 77 subfamilies
      is not something this review can establish, and an incomplete list would read as a
      denial for every subfamily omitted from it. The node assessment is where this term is
      adjudicated for ARL5 members.

  - assessed_term:
      id: GO:0016192
      label: vesicle-mediated transport
    scope: UNRESOLVED
    scope_reason: >-
      Safe for the Golgi, TGN and endocytic branches, and arguably for the ciliary branch
      as well, but the family has 77 subfamilies and many are uncharacterised, so neither
      FAMILY_WIDE nor a closed subfamily list can be asserted honestly. The relevant
      judgement for members of the ARL5 clade is made at PTN000918181, which is assessed
      SOUND above.

  - assessed_term:
      id: GO:0006886
      label: intracellular protein transport
    scope: UNRESOLVED
    scope_reason: >-
      Same position as GO:0016192, and for the same reason: the term is true of every
      branch inspected here, including the ciliary one, but this review inspected a handful
      of subfamilies out of 77 and will not convert that into a family-wide grant. Assessed
      at the node instead.

references:
  - id: PMID:38606629
    title: >-
      Mapping the global interactome of the ARF family reveals spatial organization in
      cellular signaling pathways.
  - id: file:interpro/panther/PTHR11711/PTHR11711-deep-research-falcon.md
    title: Deep research summary for PANTHER family PTHR11711

review_status: DRAFT
reviewed_by: AI-assisted family review (IBA second pass for XENTR/F6WPT1)
review_date: "2026-08-31"
notes: >-
  Scope. This review was written to support the IBA re-review of Xenopus tropicalis arl5a
  (F6WPT1) and is deliberately partial. Only the six PAINT node/term pairs that back that
  gene's IBA rows are assessed; the family's other cached PAINT assertions (plasma
  membrane at PTN000918064 and PTN002619726, Golgi apparatus at PTN000195580, lysosomal
  membrane at PTN000918220, the ciliary set at PTN000196179, and the PTN002619730 and
  PTN002619925 ARF6-lineage rows) are named where they bear on scoping but are not
  themselves adjudicated. Subfamily coverage is likewise partial: five of 77.

  Provenance of identifiers. UniProt's PANTHER cross-reference for these proteins gives
  only the family, with no subfamily line, so subfamily assignments were read from the
  PANTHER 19 geneinfo service directly (Q9Y689 -> SF147, Q96KC2 -> SF146, F6WPT1 -> SF147,
  Q9VSG8 and P34212 -> SF31, P84077 -> SF357, Q9H0F7 -> SF21) and every label was then
  checked verbatim against interpro/panther/panther.obo. Node ids, seeds, taxa and
  snapshot dates were copied from PTHR11711-paint.tsv. Seed identities were resolved
  individually rather than assumed: FB:FBgn0035866 is Drosophila Arl5 (Q9VSG8, confirmed
  at FlyBase and UniProt), SGD:S000000368 is yeast ARL1, SGD:S000005620 is yeast ARF3,
  WB:WBGene00000182 is C. elegans arf-1, FB:FBgn0010348 is Drosophila Arf1, FB:FBgn0000115
  is Drosophila Arl1, and MGI:MGI:1927136 is mouse Arl6. Seeds whose identity could not be
  confirmed (for example UniProtKB:P36406 and several RGD and MGI ids in the deep GTP
  binding row) were left out of the declared subsets rather than labelled speculatively;
  the declared seeds are readable subsets of PAINT's with-lists, not the whole lists.

  Residue positions. All seven g_domain positions were read directly from the anchor
  sequence (Q9Y689, 179 aa, sequence version 1) and cross-checked against the ARL5B, ARF1,
  Drosophila Arl5, C. elegans arl-5 and Xenopus F6WPT1 sequences: the G1 motif is GLDNAGKT
  at 23-30, G3 is WDIGG at 65-69 and G4 is NKQD at 125-128 in all three 179-residue ARL5
  proteins, while ARF1 runs one residue ahead (GLDAAGKT at 24-31, NKQD at 126-129), which
  is why its positive control cites position 30 rather than 29.

  What is deliberately not asserted. No clade_node_id is given for any subfamily.
  PTN000195484 is the ARL5-clade node, but it sits above SF31, SF146 and SF147 together
  rather than at the root of any one of them, and PTN000196179 carries the ciliary
  assertions without it being established that it is the root of SF21; asserting either
  would be a phylogenetic-placement claim this review cannot support. No negative control
  is declared for g_domain because no PTHR11711 member with a degenerate nucleotide site
  was found; this is consistent with the CONTRIBUTES strength, which does not require one.

  Known validation warnings. None of the proteins cited here are yet in
  interpro/panther/panther-members.tsv, so the membership check reports UNRESOLVED for
  each representative member. That is the documented "not indexed yet" state rather than a
  contradiction, and `just refresh-panther-members` was deliberately not run because the
  index is a shared file. Separately, the Xenopus gene's UniProt record carries no PANTHER
  subfamily cross-reference, so the family/gene cross-check cannot place it inside the
  SUBFAMILY_ONLY set for GO:0005802 and reports UNRESOLVED there; the assignment is
  nonetheless established, from the PANTHER service, as SF147.
