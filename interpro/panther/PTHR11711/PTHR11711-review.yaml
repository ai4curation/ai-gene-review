    label: GTPase activity
  scope: UNRESOLVED
  scope_reason: The Xenopus ARL5-related protein has an Arf small-GTPase domain, supporting a guanine-nucleotide
    switch hypothesis. Hydrolysis requires a complete catalytic G-domain and may depend strongly on the
    appropriate GAP; GTP binding alone is insufficient. Divergent Arl proteins and TRIM fusions require
    separate catalytic assessment, and neither ADP-ribosylation nor E3 activity follows from the shared
    family name.
