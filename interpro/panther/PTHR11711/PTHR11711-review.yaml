family_id: PANTHER:PTHR11711
family_name: ADP RIBOSYLATION FACTOR-RELATED
preferred_name: Arf/Arl small GTPases and associated domain fusions
summary: Arf and Arl proteins are nucleotide-regulated molecular switches associated with membrane traffic
  and other spatially organized processes. The wider group includes divergent Arl proteins and multidomain
  fusions such as TRIM23.
functional_coherence: HETEROGENEOUS
coherence_reason: The Xenopus sequence's Arf-family placement supports a small-GTPase comparison. ADP-ribosylation
  is not its enzymatic reaction despite the family name. Vesicle coat recruitment, ciliary traffic and
  E3 activity of a fused TRIM protein are separable branch-specific functions.
