  name:
    name: Type II Cytokine and Tissue Factor Receptors
    short: Type-II_Cytokine-TF_Rcpt
  description:
  - text: This family of proteins includes receptors that are part of the type II
      cytokine receptor family. They are involved in immune system processes, such
      as antiviral, antimicrobial, and antitumor responses, as well as blood coagulation.
      These receptors typically form heterodimeric complexes that bind various cytokines,
      including interferons and interleukins, which then activate signaling pathways
      like the JAK-STAT cascade. This leads to the phosphorylation and activation
      of transcription factors that regulate the expression of genes involved in the
      immune response and hemostasis. Some family members also play roles in anti-inflammatory
      functions, limiting tissue damage during inflammation, and may be involved in
      maintaining successful pregnancy.
