  name:
    name: Major prion
    short: Prion
  description:
  - text: This family of proteins is involved in a variety of physiological processes,
      although their primary function is not fully understood. They may have a role
      in neuronal development, synaptic plasticity, and the maintenance of neuronal
      myelin sheaths. These proteins are also implicated in iron uptake and homeostasis.
      They have cytoprotective activity against stresses, both internal and environmental.
      Soluble oligomers of these proteins can be toxic to neuroblastoma cells, inducing
      apoptosis. They are known to associate with GPC1, which targets them to lipid
      rafts and may influence their pathological conversion. Additionally, they have
      the ability to bind copper and zinc ions, which may stabilize their structure
      and promote oligomerization. Mutations within these proteins can lead to the
      formation of a disease-associated, protease-resistant form that aggregates into
      amyloid fibrils, a hallmark of prion diseases.
