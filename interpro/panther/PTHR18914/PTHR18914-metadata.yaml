  name:
    name: Vinculin/Alpha-Catenin
    short: Vinculin/Alpha-Catenin
  description:
  - text: The vinculin/alpha-catenin family is involved in the formation and regulation
      of cell-cell adhesion complexes, linking cadherin adhesion receptors to the
      cytoskeleton. Members of this family play a crucial role in cell adhesion properties,
      cell migration, neurite growth, synapse morphological plasticity, and cell differentiation.
      They are associated with the cytoplasmic domain of cadherins to form complexes
      that are connected to the actin filament network. These proteins can regulate
      actin filament assembly, inhibit actin branching by competing with the Arp2/3
      complex, and are involved in the regulation of various signaling pathways. They
      are essential for maintaining cell integrity and transmitting mechanical signals
      from the cell surface to the interior.
