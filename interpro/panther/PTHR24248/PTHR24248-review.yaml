family_id: PANTHER:PTHR24248
family_name: ADRENERGIC RECEPTOR-RELATED G-PROTEIN COUPLED RECEPTOR
preferred_name: Adrenergic Receptor-Related G-Protein Coupled Receptor
summary: ADRENERGIC RECEPTOR-RELATED G-PROTEIN COUPLED RECEPTOR (PANTHER:PTHR24248) is characterized in
  PANTHER PAINT across 24 ancestral PTN node(s) (PANTHER:PTN000664111, PANTHER:PTN000664387, PANTHER:PTN000664482,
  PANTHER:PTN000664503 (+20 more)) with 44 IBD node assertion(s) and 3 term(s) carrying negated IRD/IKR
  branch blocks, covering plasma membrane (GO:0005886, CC), dendrite (GO:0030425, CC), G protein-coupled
  serotonin receptor activity (GO:0004993, MF), neurotransmitter receptor activity (GO:0030594, MF) and
  31 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR24248 (ADRENERGIC RECEPTOR-RELATED G-PROTEIN COUPLED
  RECEPTOR) span 24 distinct ancestral PTN nodes (PANTHER:PTN000664111, PANTHER:PTN000664387, PANTHER:PTN000664482,
  PANTHER:PTN000664503, PANTHER:PTN000664816 (+19 more)) with different molecular function assignments
  across clades (G protein-coupled serotonin receptor activity (GO:0004993), neurotransmitter receptor
  activity (GO:0030594), histamine receptor activity (GO:0004969), G protein-coupled amine receptor activity
  (GO:0008227) and 12 additional molecular function term(s)), indicating clade-level functional specialization
  across the family.
