family_id: PANTHER:PTHR11085
family_name: NAD-DEPENDENT PROTEIN DEACYLASE SIRTUIN-5, MITOCHONDRIAL-RELATED
summary: Sirtuins couple NAD consumption to removal of acyl groups from protein lysines, with substantial
  variation in acyl-group preference and cellular substrate selection. SIRT5 is specialized toward negatively
  charged lysine acylations such as succinylation, malonylation and glutarylation. Nuclear histone regulation
  and mitochondrial metabolic control are different branch contexts.
functional_coherence: HETEROGENEOUS
coherence_reason: The experimentally annotated SIRT5 record supports acidic-acyl lysine hydrolysis. Other
  sirtuins differ in deacetylation efficiency, longer-chain deacylation and reported ADP-ribosyl transfer
  reactions. A family label of deacetylase cannot replace substrate-specific evidence, and mitochondrial
  localization does not apply to the entire family.
