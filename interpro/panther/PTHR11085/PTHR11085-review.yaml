notes: Benchmark representatives and subfamily identifiers are verified against the frozen UniProt records
  and PANTHER vocabulary. The summary distinguishes family classification from biological evidence. No
  PAINT ancestral-node placement is asserted without a tree-based assessment, and no catalytic-residue
  loss is inferred from a short or incomplete input sequence. The integrated InterPro description is AI-generated
  and is treated as a literature lead, not independent validation.
term_assessments:
- assessed_term:
    id: GO:0036055
    label: protein-succinyllysine desuccinylase activity
  scope: UNRESOLVED
  scope_reason: 'SIRT5 is experimentally established as a protein desuccinylase, but this reaction is
    not exclusive to SIRT5: primary work reports SIRT7-dependent histone H3K122 desuccinylation (PMID:27436229).
    Substrate preference and assay context differ among sirtuins. The SIRT5 subfamily consequently cannot
    be used as an exhaustive allowed set, and neither its evidence nor the SIRT7 result warrants a universal
    desuccinylase grant to all sirtuins.'
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-b.json
    supporting_text: NAD-dependent lysine demalonylase, desuccinylase and deglutarylase that specifically
      removes malonyl, succinyl and glutaryl groups on target proteins
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/primary-sources/PMID-27436229.json
    supporting_text: Here we report that SIRT7 is an NAD(+)-dependent histone desuccinylase.
