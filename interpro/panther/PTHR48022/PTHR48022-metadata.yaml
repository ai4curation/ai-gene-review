  name:
    name: Major Facilitator Superfamily Sugar Transporters
    short: MFS_Sugar_Transporters
  description:
  - text: The Major Facilitator Superfamily (MFS) Sugar Transporter family encompasses
      a diverse group of integral membrane transport proteins involved in the facilitated
      transport of a wide variety of substrates across cellular membranes. Members
      of this family are primarily involved in the uptake of sugars such as glucose,
      fructose, galactose, and quinic acid, which can be catabolized as carbon sources.
      These transporters operate with varying affinities, enabling organisms to adapt
      to different concentrations of extracellular sugars. Some members also participate
      in symport mechanisms, coupling sugar transport with proton movement. Additionally,
      certain proteins within this family function as sensors in glucose-signaling
      pathways, although they do not transport glucose themselves. The family includes
      proteins that contribute to metabolic processes, adaptation to environmental
      changes, and the biosynthesis of natural products.
