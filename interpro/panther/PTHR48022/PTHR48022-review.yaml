family_id: PANTHER:PTHR48022
family_name: PLASTIDIC GLUCOSE TRANSPORTER 4
summary: This major-facilitator-superfamily group contains membrane proteins associated with sugar and
  related-solute handling. Transported substrates, affinity and coupling mechanisms differ among branches.
functional_coherence: HETEROGENEOUS
coherence_reason: PMID:24581151 directly identifies and tests Neurospora GLT-1/NCU01633 as a glucose transporter
  alongside different pentose transporters. The family inventory also contains quinate, alpha-glucoside
  and other sugar permeases. GLT-1 glucose transport is therefore directly supported, whereas family-wide
  glucose specificity, proton coupling, affinity and plastid localization are not. The low-affinity MstE
  subfamily label cannot supply a measured GLT-1 kinetic constant.
subfamilies:
- subfamily_id: PANTHER:PTHR48022:SF92
  label: LOW AFFINITY GLUCOSE TRANSPORTER MSTE
  description: Verified sequence-classification group containing glt-1. Functional transfer is qualified
    in the family and term assessments.
