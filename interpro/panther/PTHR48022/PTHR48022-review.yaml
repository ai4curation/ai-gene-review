  scope_reason: PMID:24581151 directly identifies and tests Neurospora GLT-1/NCU01633 as a glucose transporter
    alongside different pentose transporters. The family inventory also contains quinate, alpha-glucoside
    and other sugar permeases. GLT-1 glucose transport is therefore directly supported, whereas family-wide
    glucose specificity, proton coupling, affinity and plastid localization are not. The low-affinity
