    The term is safe for the subfamilies listed: each has an experimentally characterised desaturase or
    lies inside the sphingolipid Delta8 clade PTN000451474 or the front-end clade PTN004512927 with intact
    histidine boxes. SF11 (FADS3, a ceramide desaturase) is included. Not granted to SF19, which holds
    the beta-carotene hydroxylase CrtR and the HMM-assigned ketolases and ceramide hydroxylase beside
    genuine desaturases such as DesA3; to SF13 (FADS6), whose histidine boxes are intact but whose reaction
    is unknown; to SF22 (FADS2B), unassayed and with a box-2 histidine lost in the human protein; or to
    the small uncharacterised subfamilies. Members of those need member-level evidence. This is narrower
    than the PAINT root IBD, which the node assessments accept for the tree apart from two leaves: the
    term''s scope here also has to cover proteins that PANTHER assigns by HMM and that are outside the
    tree.'
