  assessment_reason: 'Root placement is right. The root (LUCA, 315 leaves) has two children, the bacterial
    clade PTN008570178 and the clade PTN004512925 of Synechocystis DesD plus all eukaryotes, and the 12
    seeds resolve to leaves on both sides: DesA3 in the bacterial clade, and Arabidopsis SLD1 and SLD2,
    human, mouse and rat FADS1, mouse Fads2, C. elegans fat-3 and fat-4, Thalassiosira desA, Physcomitrium
    DES5 and Dictyostelium fadA in three of the eukaryotic clades. B. subtilis Des, also a demonstrated
    desaturase, sits in the second branch of the bacterial clade. All eight histidines of the three boxes
    are present in 304 of 315 alignment rows. The earlier version of this review asked for pruning of
    the SF19 carotenoid ketolases and the ceramide hydroxylase CerH; those proteins are not leaves of
    the PANTHER tree and receive no IBA, so that request is withdrawn. One leaf does need pruning: Synechocystis
    P73428 (leaf PTN001833191, ORF sll1468, CrtR), which carries the IBA to GO:0016717 but was shown by
    complementation in beta-carotene-producing E. coli to hydroxylate beta-carotene to zeaxanthin, and
    whose disruption abolishes zeaxanthin synthesis. That reaction is a monooxygenation (GO:0010291 beta-carotene
    3-hydroxylase activity, under monooxygenase activity and not under GO:0016717). Its histidine boxes
    are intact (HDASH, HLQHH, HLIHH), so the loss rests on the assayed reaction and an IRD at the leaf
    is requested, not an IKR. The claim rests on the two abstracts, which state the reaction; desaturase
    activity was not separately excluded. Its Synechocystis paralogue sll1611 (P73843) and Gloeobacter
    gll0171 in the same cyanobacterial branch (PTN002713633) are uncharacterised and are left alone. Two
    legacy seed annotations name the wrong position but stay inside the class and do not affect the node:
    fat-3, fat-4 and mouse Fads2 carry GO:0004768 stearoyl-CoA 9-desaturase activity by IDA, and DesA3,
    a Delta9 desaturase, carries GO:0016213 acyl-CoA 6-desaturase activity.'
