notes: >-
  Written for the unsaturated fatty acid biosynthesis module, which uses B.
  subtilis Des (SF73) as the exemplar of oxygen-dependent desaturation.
  Subfamily membership comes from the PANTHER inventory of reviewed entries
  (69 proteins); the full family is far larger. Reaction-level classification
  of the SF19 oxygenases rests on their UniProt names in that inventory; no
  member review exists for them. The SF75 and SF15 members in the inventory
  are named acyl-lipid desaturases. The PAINT tree topology was not
  inspected beyond the seeds and the single root node.
