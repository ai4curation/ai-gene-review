family_id: PANTHER:PTHR19353
family_name: FATTY ACID DESATURASE 2
preferred_name: Membrane-bound front-end fatty acid desaturases and related di-iron oxidoreductases
summary: >-
  Integral-membrane, non-heme di-iron enzymes with three histidine-box motifs
  that use molecular oxygen to introduce double bonds into acyl chains. The
  family includes the animal front-end desaturases FADS1 (Delta5) and FADS2
  (Delta6), FADS3, plant and fungal sphingolipid Delta8 desaturases, algal and
  protist acyl-lipid desaturases, the Mycobacterium tuberculosis stearoyl-CoA
  9-desaturase DesA3, and the Bacillus subtilis phospholipid Delta5 desaturase
  Des, which supplies unsaturated fatty acids after a shift to low
  temperature. Subfamily SF19 also gathers related di-iron oxidoreductases
  that are not desaturases, such as algal beta-carotene ketolases and a
  bacterial ceramide hydroxylase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Most subfamilies are acyl-chain desaturases acting on acyl-CoA, phospholipid
  or sphingolipid substrates, with position specificity (Delta5, Delta6,
  Delta8, omega) varying by member. The mixed subfamily SF19 also contains
  carotenoid ketolases and a ceramide hydroxylase, whose reactions are
  oxygenations rather than desaturations, so the desaturase class does not
  hold for every SF19 member.
