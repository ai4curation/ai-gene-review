review_status: COMPLETE
reviewed_by: Claude (AI-assisted)
review_date: '2026-11-26'
notes: 'Re-reviewed on 2026-11-26 against the PANTHER 19 tree (315 leaves) and PANTHER''s own family alignment,
  both fetched from the PANTHER API by family_analysis.py in this folder; its output, PTHR19353-analysis.txt,
  also lists the experimental GO annotations of every tree leaf from QuickGO (112 rows on 22 leaves) and
  is the source of the leaf counts and motif strings quoted here. Residue numbers refer to human FADS2
  (O95864, sequence version 1) unless another accession is named; motifs of other proteins were read at
  the same alignment columns and, for A8MWK0 and P73428, confirmed on the UniProt sequence. Of the 68
  reviewed entries in the PANTHER inventory, 33 are tree leaves. What changed from the first version:
  the pruning request for carotenoid ketolases and CerH was withdrawn because those entries are not tree
  leaves; two leaf-level losses are requested instead (CrtR, human FADS2B). Not verified: the function
  of FADS6 and of mouse Fads2b (no experimental data found); the two small clades PTN001064320 and PTN009038787,
  which have no experimentally annotated leaf; and whether the Bradyrhizobium rtxC leaf acts on a lipid.
  The full text of the CrtR papers was not available, so that request rests on their abstracts. Curation
  follow-ups, not PAINT changes: B. subtilis Des has no experimental GO annotation despite a demonstrated
  activity, and the GO:0004768 rows on fat-3, fat-4 and mouse Fads2 and the GO:0016213 row on DesA3 name
  a different position from the one their papers report.'
residue_sites:
- site_id: histidine_boxes
  label: Three histidine boxes of the di-iron centre
  description: 'The eight box residues, in the numbering of human FADS2 (O95864 sequence version 1), where
    UniProt annotates them as Histidine box-1 (180-184, HDYGH), box-2 (217-221, HFQHH) and box-3 (382-386,
    QIEHH). The same columns of the PANTHER 19 alignment read H...H, H..HH and [QH]..HH in 304 of 315
    leaf rows. The first residue of box 3 is glutamine in the cytochrome b5 fusion (front-end and sphingolipid)
    desaturases and histidine in B. subtilis Des, FADS6 and most bacterial members. The site is necessary
    for desaturation but does not decide it: the beta-carotene hydroxylase CrtR has all eight residues.'
