  assessment_reason: 'Second change requested on the same root IBD, independent of the CrtR loss. Human
    FADS2B (A8MWK0, leaf PTN002499979) inherits the term but has glutamine at the fourth position of histidine
    box 2: HFEQH at 254-258 of A8MWK0 sequence version 2, where human FADS2 has HFQHH at 217-221, so the
    residue aligned with His220 of FADS2 is Gln257. This was read in the PANTHER alignment and confirmed
    on the UniProt sequence. The eight box histidines are the di-iron ligands of membrane desaturases
    and each was individually essential in the rat stearoyl-CoA desaturase, an enzyme of another family
    that shares the motif; no mutagenesis of this position in a PTHR19353 member was found, and FADS2B
    itself has not been assayed, so the loss is inferred from the key residue. UniProt gives the human
    entry protein existence level 5 with the caution that it could be the product of a pseudogene. The
    loss is specific to the human leaf: mouse Fads2b and 11 of the other 12 SF22 leaves keep HFQHH or
    another H..HH box 2, so the IKR belongs at the leaf and not at the FADS2B node PTN001064243. A horse
    SF22 leaf (F6ZUZ3, HFQCH) shows a similar change but is an unreviewed gene model and is not included
    in the request.'
