family_id: PANTHER:PTHR19353
family_name: FATTY ACID DESATURASE 2
preferred_name: Membrane-bound front-end fatty acid desaturases and related di-iron oxidoreductases
summary: 'Integral-membrane, non-heme di-iron oxidoreductases built around three histidine-box motifs.
  Almost all characterised members are oxygen-dependent desaturases: the animal front-end desaturases
  FADS1 (Delta5) and FADS2 (Delta6), the ceramide Delta14 desaturase FADS3, nematode FAT-3 and FAT-4,
  plant and fungal sphingolipid Delta8 desaturases, protist, moss and slime-mould acyl-lipid desaturases,
  cyanobacterial DesD, the Mycobacterium tuberculosis stearoyl-CoA 9-desaturase DesA3, and the Bacillus
  subtilis phospholipid Delta5 desaturase Des. Most eukaryotic members carry an N-terminal cytochrome
  b5 domain fused to the desaturase domain; the bacterial members and vertebrate FADS6 do not. The family
  also contains di-iron enzymes that oxygenate instead of desaturating: the Synechocystis beta-carotene
  hydroxylase CrtR, which is a leaf of the PANTHER tree, and algal beta-carotene ketolases and a bacterial
  ceramide hydroxylase, which PANTHER assigns to the family by HMM but which are not leaves of the tree.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'In the PANTHER 19 tree (315 leaves, 98 species) the root splits into a bacterial clade
  of 14 leaves (PTN008570178) and a clade of 301 leaves (PTN004512925) holding Synechocystis DesD and
  all eukaryotic members; the eukaryotic part divides at a duplication (PTN008363898) into a sphingolipid
  Delta8 desaturase clade (PTN000451474, 135 leaves), a front-end fatty acid desaturase clade (PTN004512927,
  96 leaves, FADS1, FADS2, FADS3, FAT-3, FAT-4), a clade holding FADS6 and protist, moss and slime-mould
  desaturases (PTN001064329, 51 leaves), and two small uncharacterised clades (PTN001064320, PTN009038787).
  Every experimentally annotated leaf in four of these clades is a desaturase, and the three histidine
  boxes are intact in all but 11 of 315 alignment rows. The identified exceptions are the Synechocystis
  beta-carotene hydroxylase CrtR (a monooxygenase with intact histidine boxes) in the bacterial clade,
  human FADS2B (one box-2 histidine replaced), and the HMM-assigned ketolases and ceramide hydroxylase
  outside the tree. Subfamily SF19 is not a clade: its 42 leaves are spread over four of the top-level
  clades, so it cannot be treated as one functional group.'
