node_assessments:
- node_id: PANTHER:PTN002446181
  asserted_term:
    id: GO:0015627
    label: type II protein secretion system complex
  evidence: IBD
  paint_snapshot: '20170908'
  seeds:
  - id: UniProtKB:Q00516
  node_taxon: &bact
    id: NCBITaxon:2
    label: Bacteria
  assessment: TOO_DEEP
  assessment_reason: >-
    The term is right for the seed and for every T2SS-named member, but the node is the root of
    PTHR38779. A tree inspection of the local PANTHER data (recorded in the XcpV gene review) found
    that the root is a Eubacteria speciation node whose two deepest branches are generic prepilins
    (Aquifex aeolicus ppdD3, Thermodesulfovibrio yellowstonii THEYE_A0597) while its third child
    PTN002215342 (Proteobacteria) contains every T2SS-named leaf, XcpV included. The IBD should sit
    at PTN002215342. PilV- and MshD-named proteins also receive the IBA, but they are non-reference
    members grafted into the family by sequence rather than leaves of the tree, so re-seeding the
    node is the fix, not pruning the tree.
  supported_by:
  - reference_id: file:interpro/panther/PTHR38779/PTHR38779-paint.tsv
    supporting_text: "PTHR38779\tPTN002446181\tGO:0015627\tC\tIBD\tfalse"
  - reference_id: file:genes/PSEAE/xcpV/xcpV-bioinformatics/RESULTS.md
    supporting_text: >-
      The real fault is narrower: the IBD sits one node above PTN002215342
      (Proteobacteria, 10 leaves), which holds every T2SS-named leaf including XcpV,
      while the root also covers two deep generic prepilins.
- node_id: PANTHER:PTN002446181
  asserted_term:
    id: GO:0015628
    label: protein secretion by the type II secretion system
  evidence: IBD
  paint_snapshot: '20170908'
  seeds:
  - id: UniProtKB:Q00516
  node_taxon: *bact
  assessment: TOO_DEEP
  assessment_reason: >-
    Same node and same fault as the complex term. The process claim holds for the GspI clade (the
    xcpV mutant has the lowest residual elastase secretion of the minor-pseudopilin mutants and is
    complemented), but it is asserted at the family root rather than at the Proteobacteria clade
    PTN002215342 that supports it. The seed's own PseudoCAP row is an IDA keyed to a review, a
    defect recorded in the XcpV gene review, so re-seeding with a primary mutant paper should
    accompany the move.
  supported_by:
  - reference_id: file:interpro/panther/PTHR38779/PTHR38779-paint.tsv
    supporting_text: "PTHR38779\tPTN002446181\tGO:0015628\tP\tIBD\tfalse"
  - reference_id: PMID:30346996
    supporting_text: The absence of either XcpV or -W resulted in the non-functional T2SS
