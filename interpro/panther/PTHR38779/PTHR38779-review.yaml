notes: >-
  Used by modules/bacterial_type_ii_secretion.yaml for the GspI minor-pseudopilin annoton, at
  PANTHER:PTHR38779:SF2 with P. aeruginosa XcpV (Q00516), P. putida KT2440 XcpV (Q88P02) and
  Klebsiella PulI (P15748) as exemplars. GspI shares the prepilin fold and PilD dependence with
  type IV pilus minor pilins and with competence pilins, but no such protein is a leaf of this
  family's reference tree; the PilV- and MshD-named proteins that receive its IBAs are grafted
  non-reference members, which is why the node verdicts are TOO_DEEP rather than NEEDS_PRUNING.
  Both IBDs are flagged to GO Central in genes/PSEAE/xcpV/xcpV-ai-review.yaml with the leaf table
  and the tree inspection that support the move to PTN002215342.
