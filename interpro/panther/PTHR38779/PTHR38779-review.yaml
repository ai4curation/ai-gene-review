family_id: PANTHER:PTHR38779
family_name: TYPE II SECRETION SYSTEM PROTEIN I-RELATED
preferred_name: GspI minor pseudopilins of type II secretion systems
summary: >-
  GspI minor pseudopilins, one of the four low-abundance prepilin-type proteins that cap the type
  II secretion pseudopilus. Members are made with a prepilin leader that PilD removes, are
  anchored in the inner membrane by one hydrophobic helix, and assemble a tip complex with GspJ,
  GspK and GspH. In Klebsiella the GspI-GspJ pair nucleates filament assembly in the plasma
  membrane, and in Pseudomonas XcpV (GspI) is the nucleator that binds XcpX (GspK) and XcpW (GspJ)
  at separate sites; the XcpV-XcpW pair is the indispensable core of the tip. The family is small
  and uniform in the reference proteomes, all members being annotated GspI proteins of
  proteobacterial T2SS loci, but its PAINT annotation sits at the family root, which also covers
  deep generic prepilin branches.
functional_coherence: COHERENT
coherence_reason: >-
  Every reviewed member is a T2SS GspI minor pseudopilin, all in subfamily SF2, with the same
  prepilin maturation, inner-membrane anchoring and tip-complex role. Divergence in this family is
  a matter of node placement and of grafted non-reference members rather than of member function.
