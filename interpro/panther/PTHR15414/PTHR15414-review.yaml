family_id: PANTHER:PTHR15414
family_name: OS-9-RELATED
preferred_name: OS-9 / ERLEC1 / Yos9 family of ER-lumenal MRH-domain ERAD lectins
summary: >-
  Family of endoplasmic-reticulum-lumenal lectins built around the mannose 6-phosphate
  receptor homology (MRH) domain: fungal Yos9, plant OS9, and the two vertebrate paralogs
  OS-9 and ERLEC1 (XTP3-B/Erlectin). Members are soluble, signal-peptide-bearing ER lumen
  residents that act as glycan-reading substrate receptors in ER-associated degradation
  (ERAD): the MRH pocket recognizes trimmed high-mannose N-glycans exposing a terminal
  alpha-1,6-linked mannose on misfolded glycoproteins, and the lectin hands the substrate,
  via the SEL1L (yeast Hrd3) adaptor, to the HRD1 ubiquitin ligase complex for
  retrotranslocation and proteasomal degradation. This role is conserved from fungi
  through plants to vertebrates - the fetched 24-member slice spans yeasts (S. cerevisiae
  Yos9, S. pombe yos9), filamentous fungi, Arabidopsis and rice OS9, Xenopus and mammals -
  and the family's PAINT node is accordingly placed at the eukaryote root. Within
  mammals the two paralogs partition the work with regulatory nuance: OS-9 and ERLEC1
  redundantly promote glycoprotein ERAD and stabilize the SEL1L-HRD1 complex, while
  ERLEC1 additionally restrains degradation of non-glycosylated substrates, an activity
  OS-9 antagonizes. Domain composition varies (human OS-9 has one MRH domain, ERLEC1 has
  two, of which only the C-terminal MRH2 is a functional glycan-binding module), but the
  core function - ER-lumenal misfolded-glycoprotein recognition for ERAD - is uniform.
functional_coherence: COHERENT
coherence_reason: >-
  Every member for which there is evidence is an ER-lumenal MRH lectin acting in ERAD
  substrate recognition (yeast Yos9, Arabidopsis OS9, human OS-9 and ERLEC1). The
  divergences within the family are regulatory (ERLEC1's context-dependent inhibition of
  non-glycosylated-substrate ERAD, antagonized by OS-9) or architectural (one vs two MRH
  domains, with degenerate non-binding copies), not different molecular functions, so the
  core ERAD-lectin terms are safe family-wide.
