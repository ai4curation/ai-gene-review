notes: >-
  Written to adjudicate why human ERLEC1 (Q96DZ1) appears on the PAINT human no-IBA
  list. The answer is list/GOA staleness, not node scoping or pruning: ERLEC1 is inside
  the Eukaryota clade of the single PAINT node PTN000395729, is itself an IBD seed for
  two of the node's four assertions (GO:0005788 and GO:0036503), and its cached GOA in
  fact carries two IBAs from this node (GO:0005788 and GO:0030970, both dated 20170228).
  The freshly fetched paint.tsv (2026-02/2026-05 IBD dates) shows the node was
  re-curated - GO:0030970 was replaced by GO:0036503, and GO:0006621 and GO:0030968 were
  added - and the GOA snapshot has not yet caught up. When the 2026 IBD set lands as
  IBAs, GO:0036503 and GO:0006621 would be consistent with the ERLEC1 gene review
  (which ACCEPTs GO:0036503 and documents ER retention of Kremen2), while GO:0030968
  would conflict with that review's MODIFY-to-GO:0036503 judgment, hence the TOO_DEEP
  assessment and the recommendation to confine UPR involvement to the fungal clade.
  All node ids, terms, seeds and snapshot dates are verbatim from the cached
  PTHR15414-paint.tsv; PAINT's bare "taxon:2759" is expanded to NCBITaxon:2759
  (Eukaryota). Subfamily labels are verbatim from panther.obo. GO:0036503's label is
  given as "ERAD pathway" per the repo's GO snapshot; current GO releases have renamed
  it "ERAD quality control pathway". GO:0051082 (unfolded protein binding), removed
  from the ERLEC1 review as obsolete, is deliberately not listed as a term assessment
  because obsolete ids no longer resolve in the ontology branch enum; its replacement
  for seeding purposes is GO:0051787, assessed above. The mrh_glycan_pocket residue
  site is anchored to UniProt Q13438 sequence version 1 BINDING features (PDB 3AIH,
  PMID:21172656 - structure paper not cached, so the site's verbatim quotes come from
  the cached ERLEC1 literature instead). No positive/negative control positions are
  declared: mapping OS-9 pocket positions onto other members' own numbering needs an
  alignment, and a guessed mapping would be worse than none.
