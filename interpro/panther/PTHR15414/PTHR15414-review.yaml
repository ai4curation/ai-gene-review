      The vertebrate OS-9 paralog clade (human OS-9, mouse Os9, rat Os9, bovine OS9):
      single-MRH-domain ERAD lectins whose glycan-binding pocket is structurally defined
      (PDB 3AIH) and carried as UniProt BINDING features on Q13438.
