node_assessments:
  - node_id: PANTHER:PTN000395729
    asserted_term:
      id: GO:0005788
      label: endoplasmic reticulum lumen
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260529"
    seeds:
      - id: RGD:1359574
        organism: Rattus norvegicus
      - id: SGD:S000002464
        organism: Saccharomyces cerevisiae
      - id: UniProtKB:Q13438
        label: Protein OS-9
        gene_symbol: OS9
        organism: Homo sapiens
      - id: UniProtKB:Q96DZ1
        label: Endoplasmic reticulum lectin 1
        gene_symbol: ERLEC1
        organism: Homo sapiens
        gene_review: genes/human/ERLEC1/ERLEC1-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      ER lumen localization is the defining compartment of the whole family: members are
      signal-peptide-bearing, transmembrane-less soluble lumenal proteins, and the seeds
      span fungi and mammals. The human ERLEC1 gene review ACCEPTs this term with
      independent IDA support (PMID:16531414, PMID:18264092). ERLEC1 (Q96DZ1) appearing
      in its own seed list is the expected pattern - its direct experimental ER-lumen
      annotations are among the descendant evidences the IBD placement rests on - and
      the IBA it receives back adds the phylogenetic claim that the localization is
      ancestral, not lineage-specific. Propagation to both human paralogs is sound;
      ERLEC1's cached GOA indeed already carries this IBA (dated 20170228).
  - node_id: PANTHER:PTN000395729
    asserted_term:
      id: GO:0006621
      label: protein retention in ER lumen
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260218"
    seeds:
      - id: UniProtKB:Q13438
        label: Protein OS-9
        gene_symbol: OS9
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Seeded by a single experimental annotation on human OS-9; a short seed list is not
      weak support, and the biology generalizes: holding immature or misfolded clients in
      the ER lumen pending triage is intrinsic to the family's cargo-receptor role. On
      the ERLEC1 side there is direct human corroboration that propagation would be
      sound - overexpressed Erlectin retains the glycoprotein Kremen2 in the ER
      (PMID:16531414: "The overexpression of Erlectin inhibits transport of Krm2 to the
      cell surface"), and yeast Yos9 retains misfolded glycoproteins for HRD1-dependent
      degradation. The term is not yet in ERLEC1's GOA because the GOA snapshot (IBA rows
      dated 20170228) predates this 2026 IBD; when it lands it would be consistent with
      the gene review.
  - node_id: PANTHER:PTN000395729
    asserted_term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260218"
    seeds:
      - id: SGD:S000002464
        organism: Saccharomyces cerevisiae
    assessment: TOO_DEEP
    assessment_reason: >-
      The single seed is the S. cerevisiae Yos9 experimental annotation, which stands in
      its own context - in yeast, ERAD is tightly wired into the UPR regulon and Yos9 is
      a UPR-induced quality-control factor. But placing UPR involvement at the eukaryote
      root makes it descend to the mammalian members, where the evidence supports
      downstream ERAD substrate recognition rather than unfolded-protein-response
      signaling: the ERLEC1 gene review explicitly MODIFYs its InterPro-derived
      GO:0030968 annotation to GO:0036503 on exactly these grounds (ERLEC1 is not an
      IRE1/PERK/ATF6-pathway component), and GO:0036503 is not a descendant of GO:0030968
      in the ontology, so the ERAD assertion at this same node does not already imply
      this one. The more accurate family-wide process, GO:0036503, is separately asserted
      at this node with seeds from three kingdoms. Pruning cannot be expressed at
      subfamily granularity because SF0 contains both the fungal seed lineage and the
      metazoan ERLEC1 clade; the term should be confined to the fungal clade (or
      re-seeded there), and the metazoan branches of both listed subfamilies should not
      inherit it.
    affected_subfamilies:
      - id: PANTHER:PTHR15414:SF0
        label: ENDOPLASMIC RETICULUM LECTIN 1
      - id: PANTHER:PTHR15414:SF5
        label: PROTEIN OS-9
  - node_id: PANTHER:PTN000395729
    asserted_term:
      id: GO:0036503
      label: ERAD pathway
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260218"
    seeds:
      - id: AGI_LocusCode:AT5G35080
        organism: Arabidopsis thaliana
      - id: SGD:S000002464
        organism: Saccharomyces cerevisiae
      - id: UniProtKB:Q13438
        label: Protein OS-9
        gene_symbol: OS9
        organism: Homo sapiens
      - id: UniProtKB:Q96DZ1
        label: Endoplasmic reticulum lectin 1
        gene_symbol: ERLEC1
        organism: Homo sapiens
        gene_review: genes/human/ERLEC1/ERLEC1-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      The strongest-placed assertion in the family: seeds span plants (Arabidopsis OS9),
      fungi (yeast Yos9) and mammals (both human paralogs), matching the family's core
      conserved function of delivering misfolded glycoproteins to the HRD1-SEL1L ligase
      (PMID:18264092, PMID:21062743). The ERLEC1 gene review ACCEPTs GO:0036503 (IEA and
      TAS rows) as the gene's core process, and ERLEC1 is itself a seed here. This IBD
      appears to be the 2026 re-curation of the older, narrower GO:0030970 (retrograde
      protein transport, ER to cytosol) assertion that ERLEC1's cached GOA still shows as
      an IBA dated 20170228 from this same node; the replacement is an improvement, since
      the lectins act in substrate recognition upstream of, rather than as conduits of,
      the dislocation step. Propagation to every extant member, including human ERLEC1
      and OS-9, is sound.
residue_sites:
  - site_id: mrh_glycan_pocket
    label: MRH domain mannose-binding pocket (OS-9 numbering)
    description: >-
      The glycan-binding pocket of the mannose 6-phosphate receptor homology (MRH)
      domain, as defined by UniProt BINDING features on human OS-9 (Q13438) for "a
      mannooligosaccharide derivative", derived from the crystal structure of the OS-9
      MRH domain in complex with alpha-3,alpha-6-mannopentaose (PDB 3AIH; PMID:21172656,
      not cached in this repo). The double-tryptophan platform (W117/W118) and the
      Q130/D182/R188/E212/Y218 constellation read the terminal alpha-1,6-linked mannose
      exposed on ERAD-committed, mannose-trimmed N-glycans. In two-MRH-domain members
      such as ERLEC1 only one copy need be intact: ERLEC1's C-terminal MRH2 is the
      functional glycan-binding module, while its MRH1 is a degenerate non-binding copy.
    anchor:
      id: UniProtKB:Q13438
      label: Protein OS-9
      gene_symbol: OS9
      organism: Homo sapiens
    anchor_sequence_version: 1
    site_source: UNIPROT_FEATURE
    external_ref:
      id: UniProtKB:Q13438
      source_db: UNIPROT
      source_url: https://www.uniprot.org/uniprotkb/Q13438/entry#family_and_domains
    residues:
      - position: 117
        expected: [W]
        role: mannooligosaccharide binding (aromatic platform)
      - position: 118
        expected: [W]
        role: mannooligosaccharide binding (aromatic platform)
      - position: 130
        expected: [Q]
        role: mannooligosaccharide binding
      - position: 182
        expected: [D]
        role: mannooligosaccharide binding
      - position: 188
        expected: [R]
        role: mannooligosaccharide binding
      - position: 212
        expected: [E]
        role: mannooligosaccharide binding
      - position: 218
        expected: [Y]
        role: mannooligosaccharide binding
    required_for:
      - term:
          id: GO:0005537
          label: D-mannose binding
        strength: CONTRIBUTES
        rationale: >-
          Glycan recognition by this family runs through the MRH sugar-binding pocket:
          in ERLEC1, whose MRH1 copy is degenerate, glycan-dependent client binding maps
          to the intact MRH2 and a single point lesion in it (G379S) abolishes binding
          to the glycosylated client Kremen2, while deglycosylating the client likewise
          abolishes the interaction - i.e. the interaction is lectin-mediated, not
          generic protein-protein contact. Strength is CONTRIBUTES rather than REQUIRED
          for two honest reasons: multi-MRH members need only one intact pocket copy, so
          degeneracy at the anchor-aligned copy does not abolish the protein-level
          function; and no family member is verified to lack mannose binding, so no
          genuine negative control exists to make a REQUIRED claim checkable. A member
          in which every MRH copy has lost these pocket residues should nonetheless not
          be annotated with mannose/glycan-binding lectin activity.
        supported_by:
          - reference_id: PMID:16531414
            supporting_text: It contains two MRH domains, of which one is essential for
              Krm2 binding, and this interaction is abolished by Krm2 deglycosylation
          - reference_id: PMID:16531414
            supporting_text: Erlectin functions in N-glycan recognition in the
              endoplasmic reticulum, suggesting that it may regulate glycoprotein traffic
term_assessments:
  - assessed_term:
      id: GO:0036503
      label: ERAD pathway
    scope: FAMILY_WIDE
    scope_reason: >-
      The family's core biological process in every lineage with evidence: yeast Yos9,
      Arabidopsis OS9, and both human paralogs act as ERAD substrate receptors feeding
      the HRD1-SEL1L (Hrd1-Hrd3) ligase. The ERLEC1 gene review holds this term as core
      (ACCEPT). Safe for a PAINT curator to keep seeded at the family root, as the
      current IBD does.
    supported_by:
      - reference_id: PMID:18264092
        supporting_text: OS-9 and XTP3-B/Erlectin are ER-resident glycoproteins that
          bind to ERAD substrates and, through the SEL1L adaptor, to the ER-membrane-embedded
          ubiquitin ligase Hrd1
      - reference_id: PMID:21062743
        supporting_text: Our results suggest that mannose trimming enables delivery of
          a substrate glycoprotein from EDEM1 to late ERAD steps through association with
          XTP3-B
  - assessed_term:
      id: GO:0005788
      label: endoplasmic reticulum lumen
    scope: FAMILY_WIDE
    scope_reason: >-
      All members are soluble ER-lumenal residents (signal peptide, no transmembrane
      domain); directly demonstrated for human ERLEC1 and OS-9 and true of yeast Yos9.
      Safe family-wide, as the current IBD placement asserts.
    supported_by:
      - reference_id: PMID:16531414
        supporting_text: Like other members of the MRH family, Erlectin is a luminal
          resident protein of the endoplasmic reticulum
  - assessed_term:
      id: GO:0051787
      label: misfolded protein binding
    scope: FAMILY_WIDE
    scope_reason: >-
      The molecular function a future PAINT curation should seed for this family in
      place of the formally obsolete GO:0051082 (unfolded protein binding), which the
      ERLEC1 gene review removed as obsolete with its chaperone-oriented replacements
      inapplicable to a lectin. Family members bind misfolded glycoprotein ERAD clients
      as cargo receptors - demonstrated for human ERLEC1/OS-9 and yeast Yos9 - so
      misfolded protein binding is safe family-wide; the ERLEC1 review proposes it as a
      NEW core-function annotation.
    supported_by:
      - reference_id: PMID:18264092
        supporting_text: OS-9 and XTP3-B/Erlectin are ER-resident glycoproteins that
          bind to ERAD substrates and, through the SEL1L adaptor, to the ER-membrane-embedded
          ubiquitin ligase Hrd1
      - reference_id: PMID:18502753
        supporting_text: this large ER quality control scaffold complex, containing ER
          lectins, a chaperone, and a ubiquitin ligase, provides a platform for the
          recognition and sorting of misfolded glycoproteins as well as nonglycosylated
          proteins prior to retrotranslocation into the cytoplasm for degradation
  - assessed_term:
      id: GO:0005537
      label: D-mannose binding
    scope: RESIDUE_DETERMINED
    determined_by_site: mrh_glycan_pocket
    scope_reason: >-
      Mannose-lectin activity is what the MRH domain is for, and it is demonstrated for
      human OS-9 (structure-based UniProt BINDING features) and ERLEC1 (glycan-dependent
      client binding via MRH2). But applicability per member is decided by whether at
      least one MRH copy retains the sugar-binding pocket, not by subfamily: ERLEC1
      carries one degenerate (MRH1) and one intact (MRH2) copy within a single protein,
      and SF0 mixes fungal, plant and metazoan members. A PAINT curator seeding a
      mannose/glycan-binding MF term should verify pocket residues in the clade of
      interest rather than propagate family-wide unconditionally.
  - assessed_term:
      id: GO:0030968
      label: endoplasmic reticulum unfolded protein response
    scope: UNRESOLVED
    scope_reason: >-
      Direct evidence exists only in S. cerevisiae, where Yos9 sits inside the
      UPR-coupled quality-control regulon; that experimental annotation is not disputed
      here. Whether any UPR involvement extends beyond fungi is unresolved, and the
      mammalian evidence argues against propagation: the ERLEC1 gene review MODIFYs its
      GO:0030968 annotation to GO:0036503 because ERLEC1 is an ERAD cargo receptor, not
      a UPR signaling component. Subfamily granularity cannot express the safe scope
      (the fungal seed lineage and metazoan ERLEC1 orthologs share SF0), so this is
      recorded as unresolved at family level with the node-level recommendation
      (TOO_DEEP at PTN000395729) that it not descend to metazoan members.
