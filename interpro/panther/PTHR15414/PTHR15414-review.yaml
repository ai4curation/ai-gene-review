    label: ENDOPLASMIC RETICULUM LECTIN 1
    description: >-
      The broad, deep subfamily: fungal Yos9 proteins (S. cerevisiae YOS9, S. pombe yos9,
      Candida, Aspergillus and other filamentous fungi), plant OS9 (Arabidopsis, rice),
      and the metazoan ERLEC1 orthologs (human ERLEC1, mouse Erlec1, Xenopus erlec1).
