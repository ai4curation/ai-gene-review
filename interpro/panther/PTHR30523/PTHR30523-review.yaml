family_id: PANTHER:PTHR30523
family_name: PHOSPHOENOLPYRUVATE CARBOXYLASE
preferred_name: Phosphoenolpyruvate carboxylase (type-1 PEPC) family
summary: >-
  Type-1 phosphoenolpyruvate carboxylases of bacteria and plants. All characterised members
  carboxylate phosphoenolpyruvate with bicarbonate to form oxaloacetate and phosphate. In
  heterotrophic bacteria (Escherichia coli Ppc, Pseudomonas putida Ppc; SF6) the enzyme is the
  main anaplerotic supplier of oxaloacetate to the TCA cycle and is allosterically activated by
  acetyl-CoA and fructose 1,6-bisphosphate and inhibited by aspartate and malate. Plant isozymes
  (housekeeping, C4 and CAM PEPCs; SF33, SF47, SF5 and others) add photosynthetic carbon
  fixation roles.
functional_coherence: COHERENT
coherence_reason: >-
  PEP carboxylase activity is shared by every subfamily; physiological context (anaplerosis versus
  C4/CAM carbon fixation) varies between bacterial and plant lineages.
