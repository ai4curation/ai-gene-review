  assessment: WRONG_NODE
  assessment_reason: >-
    The only seed is E. coli Ppc, whose gluconeogenesis row rests on an FBP-insensitive Ppc mutant
    that causes futile PEP cycling on gluconeogenic substrates. That shows Ppc must be switched off
    for gluconeogenesis, not that it performs a gluconeogenic step; PEPC consumes PEP. The seed does
    not support the term at any node.
