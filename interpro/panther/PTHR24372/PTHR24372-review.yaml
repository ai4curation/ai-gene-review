  representative_members:
  - id: UniProtKB:Q9BXB1
    label: Leucine-rich repeat-containing G-protein coupled receptor 4
    gene_symbol: LGR4
    organism: Homo sapiens
  - id: UniProtKB:B0BLW3
    label: Leucine-rich repeat-containing G-protein coupled receptor 4
