    Does not couple to heterotrimeric G proteins or recruit beta-arrestin on ligand
    stimulation. Its ligands, the R-spondins, are secreted Wnt agonists rather than
    hormones, and it signals by enhancing Wnt-induced LRP6 phosphorylation. The ancestral
