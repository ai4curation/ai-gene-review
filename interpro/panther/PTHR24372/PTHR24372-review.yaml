  label: LEUCINE-RICH REPEAT-CONTAINING G-PROTEIN COUPLED RECEPTOR 4
  description: >-
    Vertebrate LGR4 (GPR48), an R-spondin receptor that associates with the Frizzled/LRP6
    Wnt receptor complex and potentiates Wnt/beta-catenin signalling. Mouse and rat Lgr4
    (A2ARI4, Q9Z2H4) and bovine and zebrafish LGR4 (F1MLX5, E7FE13) are classified here by
