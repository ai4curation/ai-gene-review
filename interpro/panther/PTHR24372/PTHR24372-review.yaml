- assessed_term:
    id: GO:0008528
    label: G protein-coupled peptide receptor activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Appropriate only for members whose ligands are peptides: the relaxin-family receptors
    RXFP1 (relaxin), RXFP2 (INSL3 and relaxin) and fly Lgr3 (the insulin-like peptide
    Dilp8), and the bursicon receptor rickets, which FlyBase curates as a neuropeptide
    receptor. It is not appropriate for the glycoprotein hormone receptors or their
    invertebrate GPA2/GPB5 receptors, whose specific activities GO files under GO:0016500
    protein-hormone receptor activity, nor for vertebrate LGR4/5/6, which have no G protein
    coupling. Even for the relaxin-family receptors the choice is not settled in GO, which
    files insulin receptor activity under protein-hormone receptor activity and has no
    relaxin receptor term; this scope records which members a peptide-ligand claim could
    fit, not a recommendation to annotate them.
