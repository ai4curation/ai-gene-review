notes: >-
  Recommended PAINT changes, recorded per row in proposed_action: (1) retire the
  GO:0008528 IBD at the root PTN000689980 and assert GO:0004930 G protein-coupled receptor
  activity there instead, so that the receptor claim stays family-wide and the
  ligand-specific activities remain at the clade nodes; (2) add IRDs on the LGR6 clade
  PTN002809239 for GO:0007189 and GO:0009755 (and for GO:0004930 if it is placed at the
  root), or a single set at the vertebrate LGR4/5/6 node PTN002542418, which would make the
  per-clade IRDs at PTN002809225 and PTN002809236 redundant. Two additions that the
  verdict vocabulary cannot carry: a GO:0038194 thyroid-stimulating hormone signaling
  pathway IBD at the TSHR clade PTN002809203, parallel to the LH and FSH pathway IBDs and
  to the PTHR11515 recommendation for TSHB; and moving the two GO:0090263 IBDs (LGR4 and
  LGR5 clades) to PTN002542418 so that LGR6, which has the same activity, inherits it.
  Tree membership (a PANTHER classification issue rather than a PAINT one): InterPro and
  UniProt classify human LGR6, mouse and rat Lgr4, bovine LGR4, zebrafish lgr4 and mouse
  Lgr6 in PTHR24372:SF67 or SF73, but the PANTHER 19 trees put human LGR6 and rodent Lgr4
  in the PTHR45836 (SLIT HOMOLOG) tree as PTHR45836:SF19 and SF10, and the other three in
  no tree containing this family. These receptors therefore receive Slit-family IBAs
  (negative chemotaxis, axon guidance, heparin binding, Roundabout binding) or generic LRR
  IBAs instead of the LGR terms their in-tree orthologs get. The five foreign nodes enter
  this family's PAINT slice through those six entries; they are assessed above from this
  family's side only. Gene-review cross-check: the human FSHR review MODIFYs the root
  GO:0008528 IBA to GO:0004963 and accepts GO:0007189, GO:0009755, GO:0005886 and the
  PTN002809188 rows, all consistent with this review; the human LGR5 review accepts the
  root plasma membrane and the PTN002809236 GO:0090263 IBA and records NOT GO:0004930,
  also consistent. The C. elegans fshr-1 review (SF74) modifies GO:0008528 to GO:0004930,
  in agreement, but removes the root GO:0009755 IBA and the GO:0016500 IEA on the grounds
  that FSHR-1 has no known hormone ligand, which its own later description and
  PMID:39561202 (GPLA-1/GPLB-1, the GPA2/GPB5 glycoprotein hormone orthologs, activate
  FSHR-1) contradict; that disagreement is left for the gene review to revisit.
