- node_id: PANTHER:PTN000689980
  asserted_term:
    id: GO:0008528
    label: G protein-coupled peptide receptor activity
  evidence: IBD
  negated: false
  paint_snapshot: '20170228'
  seeds:
  - {id: "FB:FBgn0003255", label: rk, organism: Drosophila melanogaster}
  - {id: "RGD:3007", label: Lhcgr, organism: Rattus norvegicus}
  assessment: TOO_DEEP
  assessment_reason: >-
    The term makes two claims: G protein-coupled receptor activity, which is ancestral to
    the family, and a peptide ligand, which is not. The ligand class differs by clade. The
    vertebrate glycoprotein hormone receptors and their invertebrate GPA2/GPB5-receptor
    sister group (type A) bind heterodimeric cystine-knot glycoprotein hormones, and GO
    files their specific activities (GO:0004963, GO:0004964, GO:0004996, GO:0035472) under
    GO:0016500 protein-hormone receptor activity, a sibling of GO:0001653 peptide receptor
    activity rather than a descendant of it. Peptide-type ligands are confined to the type C
    relaxin-family receptors (relaxin, INSL3, Dilp8) and, by FlyBase's curation of rickets as
    a neuropeptide receptor, to the bursicon receptor. The two seeds are rickets, whose
    curated annotation supports the term, and rat Lhcgr, a type A receptor whose RGD
    annotation from the 1989 cloning paper conflicts with GO's own placement of luteinizing
    hormone receptor activity. Placed at the root, the IBD therefore gives every
    glycoprotein hormone receptor a peptide-receptor claim that its own specific receptor
    term contradicts, and also reaches zebrafish lgr6 in the LGR6 clade, whose
    characterized member (human LGR6) has no G protein coupling at all. No single node contains the relaxin-family and bursicon receptors without the type
    A clade (the root is a three-way split), and no type C member has an experimental
    annotation to this term, so the IBD cannot be moved to a seeded descendant. Recommended
    instead: retire it and assert GO:0004930 G protein-coupled receptor activity at
    PTN000689980, with IRDs on the vertebrate LGR4/5/6 node; the ligand-specific activities
    are already placed at the type A clade nodes (PTN002809178, PTN002809188,
    PTN002809203). The FSHR gene review reaches the same conclusion for its own IBA row.
  proposed_action:
    paint_action: REMOVE_IBD
  affected_subfamilies:
