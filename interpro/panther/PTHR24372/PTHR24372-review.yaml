  assessment_reason: >-
    The root of the family tree, with no taxon recorded by PAINT. Every member is a
    seven-transmembrane receptor whose ligand-binding ectodomain faces the extracellular
    space, and the seeds come from all three LGR types (glycoprotein hormone receptors, fly
    Lgr1, LGR4 and LGR5, rickets, RXFP2). Plasma-membrane residence holds for the whole
    family, including the vertebrate LGR4/5/6 clade, which has lost G protein coupling but
    not its cell-surface location.
