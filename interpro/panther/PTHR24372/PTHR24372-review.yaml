family_id: PANTHER:PTHR24372
family_name: GLYCOPROTEIN HORMONE RECEPTOR
preferred_name: >-
  Leucine-rich repeat-containing G protein-coupled receptors (LGRs): glycoprotein hormone,
  bursicon, relaxin-family and R-spondin receptors
summary: >-
  PTHR24372 groups the leucine-rich repeat-containing G protein-coupled receptors (LGRs):
  rhodopsin-like seven-transmembrane receptors with a large N-terminal leucine-rich-repeat
  ectodomain that binds a protein or peptide ligand. In the PANTHER 19 tree the family root
  (PTN000689980) splits into the three LGR types. Type A holds the vertebrate glycoprotein
  hormone receptors, the thyrotropin (TSHR, SF0), lutropin-choriogonadotropin (LHCGR, SF1)
  and follitropin (FSHR, SF5) receptors, together with invertebrate receptors for the
  ancestral glycoprotein hormone GPA2/GPB5 (thyrostimulin) such as Drosophila Lgr1 and C.
  elegans FSHR-1 (SF74). These bind heterodimeric cystine-knot glycoprotein hormones and
  couple mainly to Gs and cAMP, with LHCGR also activating phospholipase C. Type B holds
  the arthropod bursicon receptor (Drosophila rickets/DLGR2, SF82), a Gs-coupled receptor
  for the heterodimeric cystine-knot neurohormone bursicon, and the vertebrate LGR4, LGR5
  and LGR6 (SF67, SF71, SF73), which bind R-spondins and potentiate Wnt/beta-catenin
  signalling through the Frizzled/LRP receptor complex but do not couple to heterotrimeric
  G proteins or beta-arrestin. Type C holds the relaxin-family peptide receptors RXFP1
  (relaxin; SF68) and RXFP2 (relaxin and INSL3; SF72), the vertebrate RXFP2-like SF70, the
  arthropod and deuterostome SF80 (including Drosophila Lgr3, the receptor for the
  insulin-like peptide Dilp8), and a large set of invertebrate orphan receptors in SF77
  (Trichoplax, Nematostella, sea urchin, Ciona, amphioxus; the snail GRL101 belongs here).
  Type C receptors characteristically carry an N-terminal LDL-receptor class A module and
  signal through cAMP.
  Plasma-membrane residence and the LRR-7TM architecture are family-wide; G protein-coupled
  receptor activity and Gs/cAMP signalling are shared by every characterized member except
  vertebrate LGR4/5/6; the ligand, and therefore the specific receptor activity, differs by
  clade.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family shares an LRR ectodomain on a rhodopsin-like 7TM domain and residence at the
  plasma membrane, but no ligand-specific receptor activity holds family-wide. Ligands
  differ by clade: glycoprotein hormones (TSH, LH/hCG, FSH, GPA2/GPB5) for type A, bursicon
  for the arthropod type B receptor, relaxin, INSL3 and Dilp8 (relaxin/insulin-family
  peptides) for type C, and R-spondins for vertebrate LGR4/5/6. The vertebrate LGR4/5/6 node
  (PTN002542418) has also lost G protein coupling itself: these receptors act as
  facultative components of the Wnt receptor complex. GPCR activity is therefore shared
  with one exception clade, and the receptor-activity terms that carry a ligand class have
  to be placed at clade nodes.
