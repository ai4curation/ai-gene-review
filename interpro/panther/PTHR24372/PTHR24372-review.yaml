    Vertebrate thyrotropin receptors. TSHR binds TSH (CGA with TSHB) and the ancestral
    glycoprotein hormone thyrostimulin (GPHA2 with GPHB5), signals mainly through Gs and
    cAMP, and drives thyroid follicular cell growth and thyroid hormone synthesis. High
    affinity hormone binding needs a sulfated tyrosine in the hinge region shared by the
    three glycoprotein hormone receptors.
