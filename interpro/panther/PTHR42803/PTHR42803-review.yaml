family_id: PANTHER:PTHR42803
family_name: ACYL-COA DEHYDROGENASE
preferred_name: Acyl-CoA dehydrogenases with different substrate ranges and physiological roles
summary: This family shares CH-CH redox chemistry but includes enzymes with different acyl-CoA substrates
  and pathway contexts. Even SF1 contains the distinct PAO1 FadE1/FadE2 substrate profiles, mycobacterial
  FadE5 and a characterized DmdC involved in DMSP assimilation. Neither the official broad-specificity
  label nor shared FAD binding specifies an identical substrate range, physiological acceptor or complete
  fatty-acid pathway.
functional_coherence: HETEROGENEOUS
coherence_reason: Directly characterized PAO1 proteins within SF1 differ in C16/C18 versus short-chain
  activity. Curated DmdC evidence adds a sulfur-containing acyl-CoA assimilation context within the same
  subfamily. Shared generic chemistry does not support uniform substrate-specific or pathway claims.
reference_protein: &id001
  id: UniProtKB:Q9I612
  label: PA0506 / FadE1
  organism: Pseudomonas aeruginosa PAO1
  gene_symbol: PA0506
  gene_review: genes/PSEAE/PA0506/PA0506-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR42803:SF1
  label: BROAD-SPECIFICITY LINEAR ACYL-COA DEHYDROGENASE FADE5
  description: Official label retained verbatim despite member diversity. Q9I612 and Q9I610 are exact
    PAO1 assay proteins; DmdC and FadE5 are current experimentally attributed curated examples. No SF1-wide
    exact substrate range or ETF partner is assigned. No single clade_node_id is asserted for all subfamily
