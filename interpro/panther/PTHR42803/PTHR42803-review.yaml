notes: No prior canonical family review existed. Normal scoped PAINT retrieval returned zero node-level
  rows across 36 resolved nodes; empty node_assessments is intentional, not a fabricated UNRESOLVED assertion.
  Exact cached leaf mappings support member identity but no ancestral substrate or acceptor placement
  is inferred. No IRD or IKR is invented. SF3 is present in the tree but no characterized SF3 representative
  is evaluated here. Current curated UniProt FUNCTION statements for Q5LLW7 and O53666 are used only within
  their experimentally attributed scope, not as independent full-text reanalysis or evidence for every
  Rhea acceptor detail. Original metadata and member inventory remain byte-identical; generated metadata
  prose is not scientific support. Native PAO1 growth and complete pathway flux remain unmeasured in the
  primary study. The proposed acceptor-unspecified MF is represented on the exact gene reviews; no non-GO
  term is inserted into a GO-bound family assessment.
