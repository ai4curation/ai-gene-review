    organism: Ruegeria pomeroyi DSS-3
    gene_symbol: dmdC
  - id: UniProtKB:O53666
    label: Acyl-CoA dehydrogenase FadE5
    organism: Mycobacterium tuberculosis H37Rv
    gene_symbol: fadE5
node_assessments: []
term_assessments:
- assessed_term:
    id: GO:0016627
    label: oxidoreductase activity, acting on the CH-CH group of donors
  scope: FAMILY_WIDE
  scope_reason: The broad reaction class is consistent with the acyl-CoA dehydrogenase family and the
    characterized ordinary and sulfur-containing acyl-CoA reactions. Retaining shared donor chemistry
    does not specify chain length, native substrate, electron acceptor or pathway.
  supported_by:
  - reference_id: PMID:40057486
    supporting_text: purified FadE1 exhibited dehydrogenase activity against both long-chain (C16, C18)
      and medium-chain (C8, and to a low extent, also C6) substrates with a preference for the longer
      chain acyl-CoAs, whereas FadE2 was active against only the medium-chain substrates
  - reference_id: file:interpro/panther/PTHR42803/PTHR42803-source-analysis/evidence.md
    supporting_text: Involved in the assimilation of dimethylsulphoniopropionate (DMSP), an important
      compound in the fixation of carbon in marine phytoplankton, by mediating the conversion of 3-(methylthio)propanoyl-CoA
      (MMPA-CoA) to 3-(methylthio)acryloyl-CoA (MTA-CoA)
- assessed_term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  scope: FAMILY_WIDE
  scope_reason: FAD-binding architecture is shared by these acyl-CoA dehydrogenases, and one FAD per PAO1
    protomer is directly resolved. This generic cofactor feature does not confer the physiological ETF
    reaction or the role of an electron-transfer flavoprotein.
  supported_by:
  - reference_id: PMID:40057486
    supporting_text: One FAD molecule was bound in each protomer of FadE1 and FadE2.
- assessed_term:
    id: GO:0052890
    label: oxidoreductase activity, acting on the CH-CH group of donors, with a flavin as acceptor
  scope: FAMILY_WIDE
  scope_reason: The shared flavin-dependent CH-CH oxidation chemistry is consistent with bound FAD accepting
    reducing equivalents during acyl-CoA oxidation. This broad term does not explicitly name ETF, so unknown
    physiological electron transfer downstream of FAD is not a reason to reject it. Exact gene reviews
    refine the broad activity to acceptor-unspecified acyl-CoA oxidation; no uniform substrate or terminal
    electron-transfer partner follows.
  supported_by:
  - reference_id: PMID:40057486
    supporting_text: One FAD molecule was bound in each protomer of FadE1 and FadE2.
  - reference_id: PMID:40057486
    supporting_text: the electron transfer flavoproteins (ETFs), which have been predicted (but not experimentally
      proven) to transfer reducing equivalents from the FADH2 moiety in FadE enzymes to the membrane-associated
      electron transport complex(es).
- assessed_term:
    id: GO:0003995
    label: acyl-CoA dehydrogenase activity
  scope: UNRESOLVED
  scope_reason: This GO definition explicitly names electron-transfer flavoprotein. Acyl-CoA oxidation
    is established for the characterized PAO1 members, but their physiological ETF coupling is not. Do
    not confuse shared acyl-CoA-dehydrogenase naming with proof of this acceptor-specific reaction across
    the family.
  supported_by:
  - reference_id: PMID:40057486
    supporting_text: purified FadE1 exhibited dehydrogenase activity against both long-chain (C16, C18)
      and medium-chain (C8, and to a low extent, also C6) substrates with a preference for the longer
      chain acyl-CoAs, whereas FadE2 was active against only the medium-chain substrates
  - reference_id: PMID:40057486
    supporting_text: the electron transfer flavoproteins (ETFs), which have been predicted (but not experimentally
      proven) to transfer reducing equivalents from the FADH2 moiety in FadE enzymes to the membrane-associated
      electron transport complex(es).
- assessed_term:
    id: GO:0004466
    label: long-chain fatty acyl-CoA dehydrogenase activity
  scope: UNRESOLVED
  scope_reason: The exact term also requires ETF. Beyond acceptor uncertainty, wild-type PAO1 FadE2 has
    no detected C16/C18 activity whereas FadE1 does; both are SF1. Positive FadE1 and curated FadE5 findings
    must not become a uniform SF1 substrate grant, and engineered FadE2 activity is not native capability.
  supported_by:
  - reference_id: PMID:40057486
    supporting_text: purified FadE1 exhibited dehydrogenase activity against both long-chain (C16, C18)
      and medium-chain (C8, and to a low extent, also C6) substrates with a preference for the longer
      chain acyl-CoAs, whereas FadE2 was active against only the medium-chain substrates
  - reference_id: PMID:40057486
    supporting_text: As previously noted, wild-type FadE2 was completely inactive against C16-CoA.
- assessed_term:
    id: GO:0070991
    label: medium-chain fatty acyl-CoA dehydrogenase activity
  scope: UNRESOLVED
  scope_reason: Measured C6/C8 turnover supports medium-chain capability in the PAO1 pair but does not
    establish ETF or every medium-chain substrate. DmdC and other untested family members cannot inherit
    this exact substrate class solely from SF1. FadE2 also acts on C4, which is outside this term's C6-C12
    scope.
  supported_by:
