family_id: PANTHER:PTHR45266
family_name: OXALOACETATE DECARBOXYLASE ALPHA CHAIN
preferred_name: Biotin carboxyl carrier proteins (AccB/BCCP and decarboxylase gamma subunits)
summary: >-
  Small biotinyl-carrier proteins, 69 to 167 residues in the local inventory, whose biotinylated lysine
  shuttles a carboxyl group between the two half-reactions of a biotin-dependent enzyme. The members serve
  different enzymes: AccB of bacterial and algal acetyl-CoA carboxylase, the gamma subunits of sodium-pumping
  methylmalonyl-CoA, glutaconyl-CoA and malonate decarboxylases, and biotinyl-attachment proteins of uncertain
  partner. None of them catalyses anything itself.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The biotinyl-carrier role is shared by every member, but the enzyme the carrier serves differs, and
  with it the pathway: carboxylation toward malonyl-CoA for AccB, decarboxylation coupled to sodium pumping
  for the mmdC, gcdC and madF gamma subunits.
