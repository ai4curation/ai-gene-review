  assessment_reason: >-
    The node asserts the complete acetyl-CoA carboxylase reaction for a family whose members are 69-to-167-residue
    biotin carriers with no catalytic site at all. The underlying biology is right - E. coli AccB and
    the Arabidopsis plastid carrier are both parts of a carboxylase that makes malonyl-CoA - but the claim
    belongs to the complex, not to the carrier protein, and the node propagates it to every descendant,
    decarboxylase gamma subunits included. PAINT should restrict or re-type this assertion; in the meantime
    the member gene reviews mark the term over-annotated and record the contribution separately.
