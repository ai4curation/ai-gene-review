- assessed_term:
    id: GO:0003989
    label: acetyl-CoA carboxylase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    No member of this family catalyses anything: they are 69-to-167-residue biotinyl carriers whose lysine-bound
    biotin is carboxylated by a separate biotin carboxylase and read out by a separate carboxyltransferase.
    The complete reaction named by this term needs all four ACC subunits, so the carrier contributes rather
    than enables, as the E. coli, P. putida and Metallosphaera carrier reviews all record. The family's
    PAINT node nevertheless asserts the term, which is why it is flagged for pruning above.
  supported_by:
  - reference_id: file:interpro/panther/PTHR45266/PTHR45266-entries.csv
    supporting_text: P0ABD8,Biotin carboxyl carrier protein of acetyl-CoA carboxylase,protein,8
  - reference_id: PMID:10893421
    supporting_text: >-
      Upon induction of gene expression, the four ACC subunits were overproduced in equimolar amounts.
