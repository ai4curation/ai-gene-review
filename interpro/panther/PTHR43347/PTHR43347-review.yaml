notes: >-
  Reviewed as part of the 2-methylcitrate cycle module (modules/methylcitrate_cycle.yaml), where
  this family grounds the propionate-activation step. PrpE is not the only route to propionyl-CoA:
  in E. coli grown on propionate, acetyl-CoA synthetase can substitute (PMID:12473114), so this
  family does not define the activation step on its own.
