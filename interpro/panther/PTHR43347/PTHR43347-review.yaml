family_id: PANTHER:PTHR43347
family_name: ACYL-COA SYNTHETASE
preferred_name: PrpE/ACSS3 propionyl-CoA synthetases
summary: >-
  AMP-forming short-chain acyl-CoA synthetases of the ATP-dependent AMP-binding (ANL) enzyme
  superfamily that activate propionate to propionyl-CoA. The family joins the PrpE
  propionyl-CoA synthetases encoded in the prpBCDE operons of enteric bacteria (Escherichia coli,
  Salmonella enterica) and Pseudomonas, which supply propionyl-CoA to the 2-methylcitrate cycle,
  with the mitochondrial ACSS3 enzymes of animals and a Dictyostelium paralog. Members prefer
  propionate but also activate acetate at a lower rate. All reviewed members in the PANTHER member
  inventory fall in a single subfamily (SF3).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Propionate-CoA ligase activity is experimentally supported in both the bacterial PrpE and the
  animal ACSS3 lineages and is asserted by PAINT at their common node. Coherence is not complete:
  substrate range is broad (acetate is also used), the bacterial and animal branches serve
  different pathways (the 2-methylcitrate cycle versus mitochondrial propionate activation), and
  some members, such as Pseudomonas aeruginosa PA3568, have no biochemical characterization.
