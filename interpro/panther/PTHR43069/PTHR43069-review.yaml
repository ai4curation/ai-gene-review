notes: >-
  All four PAINT assertions sit on one node, PTN002453799, which PAINT records with taxon:2
  (Bacteria) even though the IBAs reach eukaryotic members (human FAH carries all four), so
  the recorded taxon is narrower than the clade that actually inherits; this does not affect
  the soundness of the terms. P. putida HmgB receives the terms through the TreeGrafter graft
  node PTN002453800, two steps below the IBD node. Subfamilies SF5 and SF6 (also named
  FUMARYLACETOACETASE) have no reviewed members in the entry inventory and are not described.
