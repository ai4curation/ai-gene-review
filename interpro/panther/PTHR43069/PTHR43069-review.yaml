  assessment_reason: >-
    Fumarylacetoacetate hydrolysis is the last step of phenylalanine degradation wherever
    phenylalanine is routed through tyrosine and homogentisate, which is the route in every
    seeded and reviewed lineage (animals, plants, Aspergillus, P. putida). A single fungal
    seed is adequate for a pathway that is this conserved. Accepted by both FAH and HmgB.
    Organisms that carry FAH but feed homogentisate only from other aromatics would still be
    correctly annotated to GO:1902000; no such member has been documented to lack the
    phenylalanine route.
