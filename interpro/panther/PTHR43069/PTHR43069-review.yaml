family_id: PANTHER:PTHR43069
family_name: FUMARYLACETOACETASE
preferred_name: >-
  Fumarylacetoacetase family (FAH, fumarylacetoacetate hydrolase; EC 3.7.1.2)
summary: >-
  Ca2+/Mg2+-dependent carbon-carbon bond hydrolases with an N-terminal FAH domain and a
  C-terminal FAH-fold catalytic domain that hydrolyze 4-fumarylacetoacetate to fumarate and
  acetoacetate, the terminal step of homogentisate catabolism and therefore of L-tyrosine and
  L-phenylalanine degradation. Members include human FAH (deficient in hepatorenal
  tyrosinemia type I), mouse and rat Fah, Arabidopsis FAH, Aspergillus fahA, Dictyostelium
  fah, C. elegans fah-1 and bacterial HmgB of the Pseudomonas putida hmgABC operon. The
  distantly related FAH-fold paralogs (FAHD1/FAHD2-type hydrolases, decarboxylases and
  isomerases) are not in this family.
functional_coherence: COHERENT
coherence_reason: >-
  Every reviewed and named member (all assigned to SF2, FUMARYLACETOACETASE) is a
  fumarylacetoacetase, PANTHER names the family and all three of its subfamilies
  FUMARYLACETOACETASE, and both reviewed members (human FAH, P. putida HmgB) accept the
  family IBA for the activity. No member with a different activity has been identified.
