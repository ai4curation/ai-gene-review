family_id: PANTHER:PTHR47690
family_name: GLUCOKINASE
preferred_name: Bacterial ROK-unrelated glucokinase (Glk) family
summary: >-
  PTHR47690 is the bacterial glucokinase family (InterPro IPR050201, Pfam PF02685 Glucokinase).
  Its members are ATP-dependent glucokinases that phosphorylate D-glucose to D-glucose
  6-phosphate in the cytosol. Characterized members include Escherichia coli Glk, Zymomonas
  mobilis Glk and the Pseudomonas glucokinases. In Entner-Doudoroff-centred bacteria such as
  Zymomonas and Pseudomonas, Glk feeds glucose 6-phosphate into glucose-6-phosphate
  dehydrogenase and the ED pathway; in enteric bacteria it supplements the
  phosphotransferase system for free intracellular glucose.
functional_coherence: COHERENT
coherence_reason: >-
  All 137 reviewed members in the fetched member inventory fall in the single subfamily
  PTHR47690:SF1 (GLUCOKINASE) and are named glucokinase. The one PAINT gain node,
  PTN000775530, asserts glucokinase activity and cytosol location, seeded by E. coli Glk.
