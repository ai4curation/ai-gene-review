family_id: PANTHER:PTHR22914
family_name: CHITIN SYNTHASE
preferred_name: Fungal chitin synthase (GT2; CHS1/CHS2/CHS3) family
summary: >-
  Processive plasma-membrane GT2 glycosyltransferases that polymerize UDP-GlcNAc into chitin and
  extrude it. S. cerevisiae has class I CHS1 (repair at septa), class II CHS2 (primary septum) and
  class IV CHS3 (bulk lateral wall and chitosan precursor). Filamentous fungi have further classes,
  including myosin-motor CHS.
functional_coherence: COHERENT
coherence_reason: All classes are chitin synthases; they differ in timing, location and regulation.
