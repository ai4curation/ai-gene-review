family_id: PANTHER:PTHR11200
family_name: INOSITOL 5-PHOSPHATASE
summary: Inositol 5-phosphatases remove the phosphate at the 5 position of soluble inositol phosphates
  or membrane phosphoinositides. Synaptojanins combine this activity with an additional Sac1-like phosphatase
  region and regulatory domains. Different family architectures target distinct lipid pools and cellular
  trafficking events.
functional_coherence: HETEROGENEOUS
coherence_reason: Synaptojanin/OCRL-related proteins share phosphoinositide 5-phosphatase chemistry but
  differ in auxiliary domains and localization. Fly synaptojanin functions with endophilin in synaptic-vesicle
  recycling (PMID:14622578). Synaptojanin additionally contains a Sac1 phosphatase domain with distinct
  substrate chemistry; selective impairment of Sac1 and combined impairment of both phosphatase domains
  produce different experimental and disease associations (PMID:27435091). Sac1-dependent 4-phosphate
  removal cannot be assigned to relatives that possess only the 5-phosphatase module, and neuronal vesicle
  recycling is not the function of all OCRL/INPP5-like members.
