family_id: PANTHER:PTHR43469
family_name: DISULFIDE FORMATION PROTEIN-RELATED
preferred_name: BdbB/BdbC-related membrane disulfide formation proteins
summary: This family contains Bacillus BdbC and BdbB proteins together with related membrane proteins
  in other bacterial lineages. BdbC supports extracytoplasmic oxidative folding and is inferred to recycle
  BdbD. Specialized substrate pathways and the physiological electron acceptor must be established for
  each system; the shared subfamily name does not make BdbC a prophage-specific protein.
functional_coherence: MOSTLY_COHERENT
coherence_reason: BdbB/BdbC are related membrane disulfide-formation proteins, but the reviewed sequence
  catalog spans Bacillus, Chlamydia, Coxiella and Deinococcus. BdbC genetics and architecture do not determine
  the full reaction and partner scope for all entries.
reference_protein: &id001
  id: UniProtKB:O32217
  gene_symbol: bdbC
  organism: Bacillus subtilis 168
  gene_review: genes/BACSU/bdbC/bdbC-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43469:SF1
  label: SPBETA PROPHAGE-DERIVED DISULFIDE BOND FORMATION PROTEIN B
  description: The single official subfamily contains BdbC as well as BdbB; its SPbeta label is not a
    universal biological description.
  representative_members:
  - *id001
  - id: UniProtKB:P68571
    gene_symbol: bdbB
    organism: Bacillus subtilis
term_assessments:
- assessed_term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  scope: UNRESOLVED
  scope_reason: BdbC partner architecture and native genetic evidence support protein-disulfide relay
    activity for the exemplar. The complete reaction has not been directly reconstituted here, and the
    available evidence does not establish this exact reaction for every member of the one broad subfamily.
    This does not negate the evidence-supported BdbC gene review.
  supported_by:
  - &id002
    reference_id: PMID:11844773
    supporting_text: This gene organization and the fact that BdbD and BdbC are apparent orthologs of
      E. coli DsbA and DsbB, respectively, indicate that BdbC and BdbD function as a pair.
- assessed_term:
    id: GO:0016672
    label: oxidoreductase activity, acting on a sulfur group of donors, quinone or similar compound as
      acceptor
  scope: UNRESOLVED
  scope_reason: BdbC is a plausible DsbB-like quinone relay, but the primary studies used here do not
    measure a coupled purified BdbC/BdbD/quinone reaction or identify its native quinone. Neither the
    membrane topology nor the neighboring bdbD gene supplies that missing acceptor evidence.
  supported_by:
  - *id002
- assessed_term:
    id: GO:0006457
    label: protein folding
  scope: UNRESOLVED
  scope_reason: BdbC contributes to a substrate oxidative-folding system, but a family-wide client-folding
    role is not established for all BdbB-related and other bacterial entries. Gene-level partner and substrate
    evidence remains valid.
  supported_by:
  - *id002
review_status: COMPLETE
reviewed_by: codex
review_date: '2026-11-06'
references:
- id: PMID:11844773
  title: Mutations in the thiol-disulfide oxidoreductases BdbC and BdbD can suppress cytochrome c deficiency
    of CcdA-defective Bacillus subtilis cells.
