family_id: PANTHER:PTHR10609
family_name: BIOTINIDASE-RELATED
preferred_name: BTD/VNN carbon-nitrogen hydrolase family
summary: >-
  PTHR10609 contains secreted or cell-surface nitrilase-like carbon-nitrogen hydrolases
  with two experimentally separated salvage activities. The BTD/biotinidase branch hydrolyses
  biocytin and biotin amides to recycle biotin, while the VNN/vanin branches hydrolyse
  D-pantetheine to pantothenate and cysteamine. Human BTD belongs to PTHR10609:SF14,
  human VNN1 to PTHR10609:SF16 and human VNN2 to PTHR10609:SF15.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family is coherent at the level of nitrilase-like non-peptide C-N hydrolases and
  extracellular or ectoenzyme topology, but the two reviewed human biochemical functions are
  substrate-specialized. PAINT models this with a biotinidase/biotin-metabolism node
  (PTN000834762) separate from the pantetheine-hydrolase/pantothenate-metabolism node
  (PTN007449457). Human VNN1 and VNN2 correctly inherit only the VNN pantetheinase terms,
  while human BTD correctly inherits only the biotinidase terms.
