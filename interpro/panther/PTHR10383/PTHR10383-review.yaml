family_id: PANTHER:PTHR10383
family_name: SERINE INCORPORATOR
summary: SERINC/Tms proteins are multipass membrane proteins associated with membrane-lipid organization.
  Mammalian SERINC3 and SERINC5 have experimentally characterized lipid-scrambling and antiviral functions,
  while other members are less specifically characterized.
functional_coherence: HETEROGENEOUS
coherence_reason: Purified human SERINC proteins flip phospholipids in reconstituted membranes (PMID:37474505).
  Experiments manipulating viral phosphatidylserine exposure separate that activity from the mechanism
  of HIV restriction (PMID:38785977). The fly M9PCT1 record has the SERINC domain and SF9 assignment,
  but neither a direct lipid assay nor a fly antiviral mechanism follows from the mammalian experiments.
  Serine incorporation is not an established intrinsic biosynthetic reaction.
