  name:
    name: Sorting nexin BAR-PX domain-containing protein
    short: SNX_BAR-PX
  description:
  - text: This family of proteins is involved in intracellular trafficking and membrane
      remodeling. Members interact with phosphatidylinositol-containing membranes,
      particularly those enriched in phosphatidylinositol 3,4-bisphosphate and/or
      phosphatidylinositol 4,5-bisphosphate. They are part of the retromer membrane-deforming
      SNX-BAR subcomplex, which mediates retrograde transport of cargo proteins from
      endosomes to the trans-Golgi network and is involved in recycling cargo proteins
      from endosomes to the plasma membrane. These proteins can sense and induce membrane
      curvature, likely through the insertion of an amphipathic helix into the membrane
      upon dimerization. They are implicated in the sorting and degradation of various
      receptors and proteins, such as EGFR and E-cadherin, and may also play roles
      in processes like macropinocytosis and transcription regulation.
