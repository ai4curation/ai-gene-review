family_id: PANTHER:PTHR11680
family_name: SERINE HYDROXYMETHYLTRANSFERASE
preferred_name: Serine hydroxymethyltransferase (SHMT/GlyA) family
summary: >-
  PLP-dependent SHMTs reversibly transfer the hydroxymethyl group of serine to tetrahydrofolate,
  making glycine and 5,10-methylene-THF, the main source of one-carbon units. Eukaryotes have cytosolic
  and mitochondrial isozymes (S. cerevisiae SHM2 and SHM1, human SHMT1 and SHMT2); bacteria have
  GlyA.
functional_coherence: COHERENT
coherence_reason: >-
  All subfamilies are SHMTs. PANTHER subfamily names do not track compartment: cytosolic S. cerevisiae
  SHM2 sits in SF28 with mitochondrial human SHMT2, and mitochondrial SHM1 in SF57.
