family_id: PANTHER:PTHR30371
family_name: SEC-INDEPENDENT PROTEIN TRANSLOCASE PROTEIN TATC
preferred_name: TatC family (twin-arginine translocation receptor subunit)
summary: >-
  TatC proteins are six-transmembrane-helix subunits of twin-arginine
  translocation (Tat) systems in the bacterial cytoplasmic membrane and the
  chloroplast thylakoid membrane. TatC is the primary docking site for Tat
  signal peptides, directly recognizing the twin-arginine consensus motif, and
  with TatB (or a bifunctional TatA in TatAC systems) forms the receptor that
  binds folded precursors before TatA is recruited for proton-motive-force-driven
  translocation. Loss of E. coli TatC blocks export of Tat substrates without
  affecting the Sec pathway; loss of Arabidopsis cpTatC (APG2) blocks thylakoid
  development.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member is the receptor/scaffold subunit of a Tat
  translocase. The root PAINT node PTN000769484 carries the Tat complex,
  transport and process terms seeded by E. coli TatC, P. aeruginosa TatC and
  Arabidopsis cpTatC, with no loss rows. The plant node PTN000769485 adds only
  the chloroplast location and a developmental process, and the TatCD
  subfamily (SF4), represented only by Bacillus subtilis TatCd, is a paralog of
  the SF0 TatCy of the same organism with no documented loss of the receptor
  role.
