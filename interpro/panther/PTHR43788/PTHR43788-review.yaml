family_id: PANTHER:PTHR43788
family_name: DNA2/NAM7 HELICASE FAMILY MEMBER
preferred_name: SF1B 5'-3' helicases (RecD, RecD2, HELB, SMUBP-2/IGHMBP2, HELZ2 and nidovirus replicase helicases)
summary: >-
  PTHR43788 is a large superfamily 1B helicase family whose members translocate 5'-to-3' on
  single-stranded DNA or RNA with ATP hydrolysis. It covers very different biological roles. The
  bacterial RecD (PTHR43788:SF6) is the fast 5'-to-3' motor subunit of the RecBCD end-resection
  complex. Standalone bacterial RecD2 helicases (also SF6) work without RecB or RecC, for example in
  Deinococcus radiodurans, which lacks both genes. Eukaryotic DNA helicase B (HELB, also SF6) limits
  DNA end resection. SMUBP-2/IGHMBP2 and yeast Hcs1 make up SF8, and HELZ2 proteins and the helicase
  domains of nidovirus replicase polyproteins make up SF16. The shared element is the 5'-3' helicase
  motor. Complex membership and the direction in which a member acts on resection are lineage-specific,
  and they can be opposite: bacterial RecD drives resection in RecBCD, while HELB inhibits it.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The 5'-3' helicase/translocase activity is shared and is soundly placed at the family root
  PTN002465241. Above it, SF6 alone contains three different biological roles: the RecBCD subunit
  RecD, standalone RecD2, and the eukaryotic resection antagonist HELB. Other subfamilies act on RNA
  or replicate viral genomes. Process, complex and regulatory terms placed on deep nodes therefore
  cross these role boundaries. The RecBCD module selects RecD with NCBIfam TIGR01447 plus RecB-RecC
  context, not with PTHR43788:SF6.
