- assessed_term:
    id: GO:0009338
    label: exodeoxyribonuclease V complex
  scope: UNRESOLVED
  scope_reason: >-
    The term holds for RecBCD RecD members of SF6 and not for standalone RecD2 or HELB, which share
    the subfamily. No PANTHER subfamily boundary separates these groups, so neither a family-wide nor
    a subfamily-only grant is correct. Membership is decided by the RecD-specific NCBIfam model plus
    a cognate RecB-RecC operon, not by PANTHER classification.
  supported_by:
  - reference_id: PMID:17496087
    supporting_text: The D. radiodurans genome sequence indicates that the organism lacks recB and recC genes
