notes: >-
  Written while promoting modules/bacterial_recbcd_end_resection.yaml, which uses this family only
  through its RecD motor role. That role is selected by NCBIfam TIGR01447, because PTHR43788:SF6 also
  contains standalone RecD2 and eukaryotic HELB. Node placement is from the PANTHER 19 treeinfo
  service, summarized in the cited RESULTS.md. Four nodes in the committed slice (PTN000094675,
  PTN000094957, PTN002248233, PTN008507816) are not in the PANTHER 19 PTHR43788 tree. They reach the
  slice through members that are classified here but placed in other trees, they do not reach RecD,
  and they are not assessed. Four assertions on PTN008452915 and PTN000095219 are over-propagations
  onto bacterial RecD/RecD2: replication, regulation of resection, negative regulation of HR repair,
  and the RecBCD complex reaching RecD2. The E. coli and P. putida RecD gene reviews record matching
  row-level verdicts and source defects.
