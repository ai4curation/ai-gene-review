    id: GO:0043139
    label: 5'-3' DNA helicase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The 5'-3' SF1B motor is the shared activity, SOUND at the root node, and shown directly for E.
    coli RecD. The module's RecD motor annoton uses this term. Because RecD2 and HELB share it, the
    module selects RecBCD RecD with NCBIfam TIGR01447 and RecB-RecC context rather than with this
    family.
  supported_by:
