family_id: PANTHER:PTHR33359
family_name: MOLYBDOPTERIN SYNTHASE SULFUR CARRIER SUBUNIT
preferred_name: MoaD molybdopterin-synthase sulfur carrier family
summary: PTHR33359 contains MoaD, the small ubiquitin-fold subunit of molybdopterin synthase. MoaD ends
  in a conserved C-terminal Gly-Gly motif. MoeB adenylates this C terminus, a sulfurtransferase converts
  the adenylate to a thiocarboxylate, and the thiocarboxylated MoaD then donates sulfur to cyclic pyranopterin
  monophosphate inside the MoaD2-MoaE2 molybdopterin synthase complex. During this cycle MoaD alternates
  between a MoaD2-MoeB2 complex and a MoaD2-MoaE2 complex.
functional_coherence: COHERENT
coherence_reason: All 30 frozen entries, and all 94 leaves of the PANTHER 19 tree, are in the single
  subfamily SF1 named molybdopterin synthase sulfur carrier subunit. The PAINT root PTN008655638 has
  no loss rows, and the E. coli seed is the experimentally characterized MoaD.
