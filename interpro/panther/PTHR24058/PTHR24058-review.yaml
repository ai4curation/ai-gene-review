  assessment_reason: >-
    PTN008603465 is the DYRK localization branch seeded by fungal Pom1/Pom2,
    human DYRK3-family proteins and C. elegans mbk-2, rather than by the
    nuclear PRP4/HIPK branches. Cytoplasm is a broad but biologically true
    location for these DYRK descendants, including Pom1-family cortical kinases
    on the cytoplasmic face of the plasma membrane. For S. pombe pom1 the row
    should remain non-core beside more informative cortical and cell-tip
    locations, but the broad cytoplasm transfer itself does not require a PAINT
    loss.
