family_id: PANTHER:PTHR24058
family_name: DUAL SPECIFICITY PROTEIN KINASE
preferred_name: DYRK, HIPK and PRP4-family dual-specificity kinases
summary: >-
  PTHR24058 contains CMGC-group serine/threonine and dual-specificity protein
  kinases, including DYRK, HIPK, PRP4 and fungal Pom1-family kinases. A broad
  serine/threonine kinase activity transfer is sound for the Pom1-containing
  DYRK catalytic branch, but localization rows need subfamily-aware review:
  nuclear, stress-granule or centrosomal, and cortical or contractile-ring
  sites are member-specific.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The protein kinase mechanism is shared, but the family combines paralog
  groups with distinct compartments and regulatory outputs. Fission-yeast Pom1
  is a peripheral cortical DYRK kinase that controls cell polarity, mitotic
  entry and division-site positioning; DYRK3-family proteins regulate
  cytoskeleton-linked condensates; and PRP4 and HIPK-family branches function
  in nuclear splicing or transcriptional contexts. PAINT transfers for
  molecular catalysis are therefore safer than PAINT transfers for compartment
  and downstream process terms.
