family_id: PANTHER:PTHR42862
family_name: DELTA-1-PYRROLINE-5-CARBOXYLATE DEHYDROGENASE 1, ISOFORM A-RELATED
preferred_name: Fungal/bacterial P5C dehydrogenases (PUT2, RocA, PutC) and PutA proline utilization proteins
summary: >-
  Aldehyde-dehydrogenase-superfamily enzymes that oxidize L-glutamate 5-semialdehyde (in
  equilibrium with 1-pyrroline-5-carboxylate, P5C) to L-glutamate with NAD+, the second step of
  proline catabolism. The family holds the monofunctional mitochondrial P5C dehydrogenases of
  fungi (S. cerevisiae PUT2, fission yeast SPBC24C6.04, Aspergillus PrnC) and Dictyostelium, the
  monofunctional Firmicute RocA and PutC enzymes, and the large bifunctional or trifunctional
  bacterial PutA proteins (E. coli, Salmonella, Klebsiella, Sinorhizobium). PutA proteins also
  carry a proline dehydrogenase domain, and in enterobacteria a DNA-binding domain;
  they switch between membrane-bound enzyme and transcriptional repressor. All of these are in
  one PANTHER subfamily (SF1). Human ALDH4A1 and plant ALDH12A1 P5C dehydrogenases are in
  other PANTHER families.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  P5C dehydrogenase activity and proline catabolism are shared by the characterized monofunctional
  enzymes (PUT2, RocA, PutC, PrnC) and by the PutA P5CDH domain. The family diverges in domain
  architecture and location: only PutA has the PRODH and membrane-association regions (PutA is
  1320 residues versus 515 to 575 for RocA, PutC and PUT2), so membrane-associated terms are
  PutA-specific. The eukaryotic enzymes are mitochondrial. SF1 also includes two Legionella
  proteins named N-succinylglutamate 5-semialdehyde dehydrogenase (AstD), which were not checked.
