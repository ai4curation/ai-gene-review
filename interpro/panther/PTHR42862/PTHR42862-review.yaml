notes: >-
  Node reach was read from the PAINT UniProt GAF. The S. cerevisiae PUT2 review is still a stub
  with its three IBAs (GO:0003842, GO:0005759, GO:0006562) pending; this review supports
  accepting all three. The proline metabolism module deliberately gives its P5C dehydrogenase
  annoton no PANTHER id because human ALDH4A1 (PTHR14516) and Arabidopsis ALDH12A1 are in other
  families. The bacterial fused PutA module avoids SF1 as a selector because SF1 is dominated by
  stand-alone dehydrogenases. Both are consistent with this review. The arginine catabolism
  module uses the family id with yeast representatives only, which is safe for the activity. No
  residue sites asserted.
