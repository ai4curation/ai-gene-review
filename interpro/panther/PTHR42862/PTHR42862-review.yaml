  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Seeded by E. coli PutA alone, whose membrane association depends on PutA-specific regions
    outside the P5CDH domain and is regulated by proline reduction of the PutA FAD. Placed at the
    root, the term descends in the PAINT GAF to the monofunctional soluble P5C dehydrogenases of
    Bacillus (RocA P39634, PutC P94391, B. cereus RocA) and Staphylococcus RocA, which lack those
    regions. PAINT already negates it for eukaryotes at PTN000193024. The monofunctional RocA/PutC
    branches need the same IRD, or the IBD should move to the PutA clade.
  supported_by:
  - reference_id: PMID:29090935
    supporting_text: As proline levels rise, PutA switches from a DNA-bound transcriptional repressor to a membrane-bound
      catabolic enzyme
  - reference_id: PMID:29090935
