review_status: COMPLETE
reviewed_by: claude-code
review_date: '2026-11-07'
notes: >-
  Reviewed alongside gene reviews of human MVP, mouse and rat Mvp, Dictyostelium mvpA and mvpB,
  and T. brucei MVP1 (Tb927.5.4460) and MVP2 (Tb927.10.1990). Subfamilies SF7, SF12 and SF16
  have no reviewed member in this corpus and are not described. Proposals for PAINT: (1) add
  structural molecule activity at the root; (2) move the signal transduction IBD from the
  eukaryote root to a vertebrate node; (3) reconsider nucleus at the root, perhaps replacing it
  with nuclear envelope, given the T. brucei exclusion data. The vertebrate signalling and
  innate-immunity literature, and recent reports of MVP-like proteins in bacteria and phages,
  do not change these conclusions.
