  - id: UniProtKB:Q14764
    label: MVP
    organism: Homo sapiens
  assessment: TOO_DEEP
  assessment_reason: >-
    The only seed is human MVP. Its signalling roles are binding of tyrosine-phosphorylated MVP
    to SRC and PTPN11 SH2 domains, damping of IFN-gamma/STAT1 signalling and restraint of
    TRAF6/NF-kappaB. These are modulatory and depend on vertebrate phosphotyrosine and
    cytokine pathways. Placed at the eukaryote root (taxon:2759), the IBD propagates to
    trypanosomatids, which lack tyrosine kinases, and to Dictyostelium, where no vault
    signalling role is known. The human, mouse and rat reviews keep the term as non-core; the
    Dictyostelium and T. brucei reviews mark it over-annotated. A vertebrate node, or IRDs on
    the amoebozoan and kinetoplastid clades, would match the evidence. Only the wholly
    non-vertebrate subfamilies are listed below. SF3 is mixed: its vertebrate members keep the
    term on their own evidence, while its Dictyostelium (mvpA) and kinetoplastid (MVP1)
    members are affected, so the pruning point lies inside SF3 rather than at its boundary.
  affected_subfamilies:
  - id: PANTHER:PTHR14165:SF11
    label: MAJOR VAULT PROTEIN BETA
  - id: PANTHER:PTHR14165:SF13
    label: VAULT PROTEIN, PUTATIVE-RELATED
