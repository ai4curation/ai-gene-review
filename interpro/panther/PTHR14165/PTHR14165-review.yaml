    label: mvpB
    organism: Dictyostelium discoideum
  assessment: UNRESOLVED
  assessment_reason: >-
    The seeds record a small vault fraction associated with the nucleus. In vertebrates this
    comes from fractionation and nuclear pore association by immunogold EM, but live imaging
    found no GFP-vaults inside the nucleus. In Dictyostelium, in situ tomography finds vaults
    docked on the nuclear envelope and ER, not inside the nucleus. So the shared property may
    be association with the nuclear envelope rather than residence in the nucleus. In
    T. brucei, tagged vault particles are seen in the cytoplasm but not the nucleus, and the
    trypanosome reviews mark the inherited nucleus rows over-annotated. The vertebrate and
    Dictyostelium reviews keep them as non-core. Trypanosomes sit in SF3 with human MVP, so no
    subfamily boundary separates the cases. Whether the node should instead assert nuclear
    envelope, or carry an IRD on the kinetoplastid clade, depends on whether the trypanosome
    nucleus-free result holds with methods more sensitive than light microscopy.
