family_id: PANTHER:PTHR14165
family_name: MAJOR VAULT PROTEIN
preferred_name: Major vault proteins (vault shell proteins of vertebrates, Dictyostelium mvpA/mvpB and kinetoplastid MVP1-3)
summary: >-
  The major vault protein family consists of the structural shell proteins of vaults: hollow,
  barrel-shaped cytoplasmic ribonucleoprotein particles of about 13 MDa. Each vault is a dimer
  of half-vaults built from many copies of the major vault protein (39 per half in rat and
  human). Each chain contributes N-terminal MVP repeat domains to the barrel wall, a
  stomatin-like shoulder domain, a long cap-helix and a cap-ring. Major vault protein alone is
  sufficient to assemble vault particles. The cage holds the minor vault components: vault
  poly(ADP-ribose) polymerase (PARP4 in vertebrates), TEP1 and the small vault RNAs. Vaults
  were probably present in the last eukaryotic common ancestor, but have been lost in fungi,
  insects and probably plants. Some lineages build the shell from several paralogs:
  Dictyostelium co-assembles MvpA and MvpB, and Trypanosoma brucei builds a single shell from
  MVP1, MVP2 and MVP3. Every reviewed member is a vault shell protein, but what vaults do for
  the cell is unknown in every organism studied. Knockout mice are healthy and Dictyostelium
  mutants show only mild growth delays under nutrient stress. Signalling roles have been
  described only for vertebrate MVP.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed members, in vertebrates, Dictyostelium and T. brucei, are structural vault shell
  proteins, supported by structures (rat, human, mouse), self-assembly (rat MVP in insect cells),
  knockout (Dictyostelium mvpA) and co-assembly of paralogs (Dictyostelium MvpA/MvpB; T. brucei
  MVP1-3). What differs between lineages is not the activity but peripheral properties:
  vertebrate MVP modulates SRC/ERK, STAT1 and NF-kappaB signalling. Dictyostelium vaults
  touch the nuclear envelope and ER, while trypanosome vaults are excluded from the nucleus.
