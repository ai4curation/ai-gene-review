  name:
    name: Glycoside-Pentoside-Hexuronide Cation Symporter
    short: GPH_Cation_Symporter
  description:
  - text: The glycoside-pentoside-hexuronide (GPH) cation symporter transporter family
      is involved in the transport of various sugars into cells, typically operating
      as a symport system that couples sugar transport with proton uptake. Members
      of this family are responsible for the cellular uptake of sucrose and can also
      transport other glucosides such as maltose, arbutin, salicin, and phenylglucosides.
      Some members may also transport biotin. The transport process is energy-dependent
      and can be inhibited by protonophores and SH group inhibitors. This family plays
      a crucial role in various biological processes including phloem sucrose loading
      in plants, melanogenesis regulation in mammals, and mycotoxin secretion in fungi.
      The transport activity is essential for normal physiological functions such
      as pollen germination, seed development, and sugar metabolism in different organisms.
