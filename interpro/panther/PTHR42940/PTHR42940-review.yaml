family_id: PANTHER:PTHR42940
family_name: ALCOHOL DEHYDROGENASE 1-RELATED
preferred_name: Zinc-dependent medium-chain alcohol dehydrogenases (fungal ADH1 group and bacterial relatives)
summary: >-
  Medium-chain dehydrogenase/reductase (MDR) enzymes with a catalytic and a structural zinc
  per subunit. The best-characterized members are the fungal ethanol dehydrogenases: in
  S. cerevisiae the cytosolic ADH1 reduces acetaldehyde to ethanol at the end of alcoholic
  fermentation, its glucose-repressed paralog ADH2 oxidises accumulated ethanol, ADH3 is a
  mitochondrial-matrix isozyme in an ethanol-acetaldehyde redox shuttle, and ADH5 is a minor
  isozyme; fission yeast adh1 is the main fermentative ADH. All of these interconvert ethanol
  and acetaldehyde with NAD(H) and also act on other short-chain alcohols and fusel aldehydes.
  The family also contains bacterial and archaeal zinc ADHs (E. coli AdhP, Zymomonas AdhA,
  Staphylococcus Adh, Sulfolobus Adh), fungal secondary-metabolism dehydrogenases (patulin
  pathway PatD, notoamide NotN) and some enzymes that are not alcohol dehydrogenases at all,
  such as Metallosphaera acryloyl-CoA reductase and Thauera 6-hydroxycyclohex-1-ene-1-carbonyl-CoA
  dehydrogenase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  NAD(P)-dependent oxidoreduction with an MDR zinc fold is shared, but the substrates are not.
  The fungal ADH1-related subfamily (SF3) is a coherent group of ethanol/short-chain alcohol
  dehydrogenases. SF7 holds secondary-metabolism dehydrogenases (PatD, NotN). SF8 (PANTHER name
  "VACUOLAR PROTEIN SORTING-ASSOCIATED PROTEIN 11", a misleading label) lumps bacterial and
  archaeal alcohol dehydrogenases with CoA-thioester reductases (acryloyl-CoA reductase,
  6-hydroxycyclohex-1-ene-1-carbonyl-CoA dehydrogenase). Within SF3, ADH3 (and the Kluyveromyces
  ADH3/ADH4) are mitochondrial while the others are cytosolic. Ethanol dehydrogenase activity is
  therefore a subfamily-level, not a family-level, property.
