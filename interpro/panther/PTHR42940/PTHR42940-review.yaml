  diverged_from_family: false
- subfamily_id: PANTHER:PTHR42940:SF7
  label: ALCOHOL DEHYDROGENASE-LIKE N-TERMINAL DOMAIN-CONTAINING PROTEIN
  description: Fungal secondary-metabolism dehydrogenases (patulin PatD, notoamide NotN).
  representative_members:
  - id: UniProtKB:A0A075TMP0
    label: Alcohol dehydrogenase patD
    gene_symbol: patD
    organism: Penicillium expansum
  diverged_from_family: true
  divergence_description: >-
    Pathway-specific dehydrogenases in mycotoxin/alkaloid biosynthesis; no role in ethanol
    metabolism is established, so ethanol dehydrogenase terms should not descend here.
- subfamily_id: PANTHER:PTHR42940:SF8
  label: VACUOLAR PROTEIN SORTING-ASSOCIATED PROTEIN 11
  description: >-
    Bacterial and archaeal zinc ADHs (E. coli AdhP, Zymomonas AdhA, Staphylococcus Adh,
    Geobacillus AdhT, Sulfolobus Adh) together with CoA-thioester reductases (Metallosphaera
    acryloyl-CoA reductase Msed_1426, Thauera Had). The PANTHER label does not describe the
    reviewed members.
  representative_members:
  - id: UniProtKB:P39451
    label: Alcohol dehydrogenase, propanol-preferring
    gene_symbol: adhP
    organism: Escherichia coli K-12
  - id: UniProtKB:A4YGN2
    label: Acryloyl-coenzyme A reductase
    gene_symbol: Msed_1426
    organism: Metallosphaera sedula
  diverged_from_family: true
  divergence_description: >-
    Mixed: part of the subfamily are alcohol dehydrogenases (AdhP clade, PTN001708211), part
    reduce CoA thioesters and are not alcohol dehydrogenases. Subfamily membership alone does not
    license an alcohol dehydrogenase term.
