notes: >-
  Node membership read from the PAINT UniProt GAF. Other PAINT nodes in this family reach no
  gene-reviewed member: PTN001708008 (GO:0016616) and PTN005160051 (GO:0016491) are generic
  oxidoreductase assertions on bacterial/plant clades, and PTN001708211 (GO:0004022, GO:0046187
  acetaldehyde catabolic process; bacterial taxon) is seeded by E. coli AdhP alone and reaches
  8 proteins. The plant fermentative ADH1 (Arabidopsis P06525) is not in this family; the
  alcoholic fermentation module correctly lists PTHR43880 for it as a family_terms entry.
  No residue sites asserted.
