  name:
    name: Phosphatidylinositol-3-phosphate 5-kinase
    short: PI3P_5-kinase
  description:
  - text: This family of proteins includes enzymes that regulate the synthesis and
      turnover of phosphatidylinositol 3,5-bisphosphate (PtdIns(3,5)P2), a phospholipid
      that plays a key role in endomembrane homeostasis. These kinases phosphorylate
      phosphatidylinositol 3-phosphate at the fifth hydroxyl group of the myo-inositol
      ring to produce PtdIns(3,5)P2. This reaction is crucial for various cellular
      processes, including endocytosis, vacuole formation, vacuolar acidification,
      and nuclear migration. The proteins are also involved in the endocytic-vacuolar
      pathway and may influence the recycling of certain transporters. Some members
      of this family are known to interact with scaffold proteins and are regulated
      by other components within the PI(3,5)P2 regulatory complex.
