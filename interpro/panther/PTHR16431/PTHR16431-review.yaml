review_status: COMPLETE
reviewed_by: claude-code
review_date: '2026-09-30'
notes: >-
  How this was established: InterPro domain calls for P21519 show MamL-1 PF09596 at
  126-183 and a PTHR16431:SF1 HMM match at 181-538, with no PF03226/IPR034752 Mis18
  domain. Q9P802 has the Mis18 domain at 20-116 with Zn2+ ligands C25/C28/C79/C82.
  A UniProt query shows that no insect PTHR16431 member carries PF03226. All MamL-1
  members of PTHR16431 are cyclorrhaphan flies (Drosophila spp., Ceratitis,
  Bactrocera). A further group of Anopheles DUF4806 (PF16064) proteins also falls in
  SF1; they were not investigated. Consequence for gene reviews: Drosophila mam
  IBAs GO:0034080, GO:0000775 and GO:0000785 (with/from PTN001046424) are
  misclassification artefacts and should be removed. The nucleus IBA is harmless.
  This review does not claim that Drosophila lacks a Mis18 orthologue; it records
  only that mam is not one.
