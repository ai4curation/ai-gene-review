family_id: PANTHER:PTHR16431
family_name: NEUROGENIC PROTEIN MASTERMIND
preferred_name: Mis18 centromere-licensing proteins (with misassigned dipteran Mastermind)
summary: >-
  Despite its official PANTHER name, this is the Mis18 family (InterPro also names the
  entry "Mis18"). Mis18 proteins contain an N-terminal Yippee-like zinc-binding
  domain (Pfam PF03226) whose two CXXC motifs hold a Zn2+ ion. Through that domain
  Mis18 oligomerises and localises to centromeres. There it licenses deposition of
  the histone H3 variant CENP-A through the Scm3/HJURP chaperone. Fission-yeast Mis18
  and human MIS18A/MIS18B (OIP5) are the characterised members. The name "Neurogenic
  protein Mastermind" comes from Drosophila melanogaster Mastermind (mam) and a few
  other cyclorrhaphan fly Mastermind proteins, which PANTHER classifies into SF1.
  These are Notch transcriptional coactivators with the Mastermind MamL-1 domain
  (Pfam PF09596). They have no Mis18/Yippee domain. Their PTHR16431 HMM match covers
  a region downstream of the MamL-1 domain (residues 181-538 of fly mam). Mastermind
  orthologues from other insects and from cnidarians are classified in the
  MASTERMIND-LIKE family PTHR15692.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Two unrelated functional groups share this family. (1) The Mis18 proteins (S. pombe
  mis18 in SF1, MIS18A in SF2, MIS18B/OIP5 in SF3) are centromere-licensing factors
  with a Yippee-like zinc domain. (2) The dipteran Mastermind proteins (D.
  melanogaster mam, other Drosophila species, Ceratitis, Bactrocera, Musca, Glossina,
  Lucilia) are Notch coactivators. They lack the Mis18 domain and carry the MamL-1
  domain shared with PTHR15692 MAML proteins. Both groups sit in SF1 ("NEUROGENIC
  PROTEIN MASTERMIND") together with fission-yeast mis18, so SF1 is functionally
  mixed. Centromere terms therefore cannot be scoped by subfamily. In UniProt, no
  insect member of PTHR16431 carries the Mis18 Pfam domain (PF03226).
reference_protein:
  id: UniProtKB:Q9NYP9
  label: Protein Mis18-alpha
  gene_symbol: MIS18A
  organism: Homo sapiens
subfamilies:
  - subfamily_id: PANTHER:PTHR16431:SF1
    label: NEUROGENIC PROTEIN MASTERMIND
    description: >-
      A mixed subfamily containing fission-yeast mis18, a genuine Mis18 with the Zn2+
      Yippee-like domain, and the dipteran Mastermind proteins, which have no Mis18
      domain.
    representative_members:
      - {id: UniProtKB:Q9P802, gene_symbol: mis18, organism: Schizosaccharomyces pombe}
      - {id: UniProtKB:P21519, gene_symbol: mam, organism: Drosophila melanogaster,
         gene_review: genes/DROME/mam/mam-ai-review.yaml}
      - {id: UniProtKB:W8BZH2, gene_symbol: MAM, organism: Ceratitis capitata}
    diverged_from_family: true
    divergence_description: >-
      The dipteran Mastermind members are Notch transcriptional coactivators (MamL-1
      domain, which binds NICD-CSL). They do not function in centromere or CENP-A
      chromatin assembly. Their placement here is a classification artefact: other
      insect and cnidarian Mastermind proteins, and Ceratitis MAM gene product W8C7T1,
      are in PTHR15692:SF20. Mis18 terms must not reach these members. S. pombe mis18
      in the same subfamily retains the Mis18 function.
  - subfamily_id: PANTHER:PTHR16431:SF2
    label: PROTEIN MIS18-ALPHA
    representative_members:
      - {id: UniProtKB:Q9NYP9, gene_symbol: MIS18A, organism: Homo sapiens}
      - {id: UniProtKB:Q9CZJ6, gene_symbol: Mis18a, organism: Mus musculus}
      - {id: UniProtKB:A0A8M9PU92, gene_symbol: mis18a, organism: Danio rerio}
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR16431:SF3
    label: PROTEIN MIS18-BETA
    representative_members:
      - {id: UniProtKB:O43482, gene_symbol: OIP5, organism: Homo sapiens}
      - {id: UniProtKB:A2AQ14, gene_symbol: Oip5, organism: Mus musculus}
      - {id: UniProtKB:B8A4N0, gene_symbol: oip5, organism: Danio rerio}
    diverged_from_family: false
node_assessments:
  - node_id: PANTHER:PTN001046424
    asserted_term:
      id: GO:0034080
      label: CENP-A containing chromatin assembly
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20210530"
    seeds:
      - {id: MGI:MGI:1913828, label: Mis18a, organism: Mus musculus}
      - {id: PomBase:SPCC970.12, label: mis18, organism: Schizosaccharomyces pombe}
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Placing Mis18 function at the eukaryotic root is supported by the fission-yeast
      and mammalian seeds. However, the dipteran Mastermind branch inside SF1 inherits
      the term. Drosophila mam (P21519) currently carries IBA "involved_in CENP-A
      containing chromatin assembly" with PTN001046424 in with/from. mam has no Mis18
      domain and no centromere role. It is a Notch coactivator, misplaced in this tree.
      The fix is an IRD/NOT (or reclassification) on the dipteran Mastermind clade.
      affected_subfamilies is deliberately left empty: SF1 also holds S. pombe mis18,
      a seed that must keep the term. Applicability is decided by the mis18_zn site
      instead.
  - node_id: PANTHER:PTN001046424
    asserted_term:
      id: GO:0000775
      label: chromosome, centromeric region
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20210530"
    seeds:
      - {id: MGI:MGI:1913828, label: Mis18a, organism: Mus musculus}
      - {id: PomBase:SPCC970.12, label: mis18, organism: Schizosaccharomyces pombe}
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Same defect as GO:0034080: correct for Mis18 proteins, wrongly inherited by
      Drosophila mam (IBA is_active_in chromosome, centromeric region). Prune the
      dipteran Mastermind clade.
  - node_id: PANTHER:PTN001046424
    asserted_term:
      id: GO:0000785
      label: chromatin
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20201205"
    seeds:
      - {id: PomBase:SPCC970.12, label: mis18, organism: Schizosaccharomyces pombe}
      - {id: UniProtKB:O43482, label: OIP5, organism: Homo sapiens}
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Correct for Mis18 at centromeric chromatin, but it reaches Drosophila mam through
      the misassigned branch. Mastermind is recruited to Notch target enhancers through
      NICD-CSL, so a chromatin localisation is plausible for mam on its own evidence.
      It must not be inherited from Mis18.
  - node_id: PANTHER:PTN001046424
    asserted_term:
      id: GO:0005634
      label: nucleus
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20260529"
    seeds:
      - {id: FB:FBgn0002643, label: mam, organism: Drosophila melanogaster}
      - {id: MGI:MGI:1913828, label: Mis18a, organism: Mus musculus}
      - {id: MGI:MGI:1917895, label: Oip5, organism: Mus musculus}
      - {id: PomBase:SPCC970.12, label: mis18, organism: Schizosaccharomyces pombe}
      - {id: UniProtKB:O43482, label: OIP5, organism: Homo sapiens}
      - {id: UniProtKB:Q9NYP9, label: MIS18A, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: >-
      Both groups are nuclear, so the term is true for every descendant. The curator
      used fly mam as a seed here, which shows that mam was treated as a genuine family
      member. The annotation is harmless, but mam's presence as a seed is part of the
      same misclassification.
residue_sites:
  - site_id: mis18_zn
    label: Mis18 Yippee-like domain Zn2+ ligands (two CXXC motifs)
    description: >-
      The four cysteines of the two CXXC motifs coordinate the Zn2+ ion that holds the
      two beta-sheets of the Mis18 Yippee-like fold together. Their presence marks a
      genuine Mis18 domain. The dipteran Mastermind members of SF1 lack the whole
      domain, not only these residues.
    anchor:
      id: UniProtKB:Q9NYP9
      label: Protein Mis18-alpha
      gene_symbol: MIS18A
      organism: Homo sapiens
    anchor_sequence_version: 1
    site_source: UNIPROT_FEATURE
    residues:
      - {position: 85, expected: [C], role: Zn2+ ligand}
      - {position: 88, expected: [C], role: Zn2+ ligand}
      - {position: 141, expected: [C], role: Zn2+ ligand}
      - {position: 144, expected: [C], role: Zn2+ ligand}
    required_for:
      - term:
          id: GO:0034080
          label: CENP-A containing chromatin assembly
        strength: REQUIRED
        rationale: >-
          The Zn2+ bound by these cysteines is structural: it holds the Yippee-like
          fold together, and that fold mediates the oligomerisation Mis18 needs to
          localise to centromeres. UniProt records that mutating each of C85, C88, C141
          and C144 to alanine abolishes MIS18A centromere localisation
          (PMID:17199038), and centromere recruitment of Mis18 comes before new CENP-A
          deposition. A protein without the domain cannot perform the Mis18 licensing
          step.
        supported_by:
          - reference_id: PMID:26921242
            supporting_text: "Previous analysis showed that mutations within the C‐X‐X‐C motifs of human Mis18α perturb its centromere localization, highlighting the essential role of this domain"
          - reference_id: PMID:26921242
            supporting_text: "The two β‐sheets are held together by a Zn2+ ion coordinated via the C‐X‐X‐C motifs from loops L1 and L5"
          - reference_id: PMID:17199038
            supporting_text: of de novo-synthesized CENP-A. If any of the three is knocked down by RNAi,
    positive_controls:
      - {id: UniProtKB:Q9P802, label: mis18, organism: Schizosaccharomyces pombe,
         control_position: 25, control_residue: C}
      - {id: UniProtKB:O43482, label: OIP5, organism: Homo sapiens,
         control_position: 80, control_residue: C}
    negative_controls:
      - {id: UniProtKB:P21519, label: mam, organism: Drosophila melanogaster}
term_assessments:
  - assessed_term:
      id: GO:0034080
      label: CENP-A containing chromatin assembly
    scope: RESIDUE_DETERMINED
    scope_reason: >-
      SF1 is mixed: it holds S. pombe mis18, which has the function, and the dipteran
      Mastermind proteins, which do not. A subfamily-level grant or denial would be
      wrong for part of SF1. Members that carry the Mis18 Yippee-like Zn2+ domain
      (mis18_zn) may inherit the term. Members that lack it, namely all dipteran
      Mastermind proteins, must not.
    determined_by_site: mis18_zn
  - assessed_term:
      id: GO:0007221
      label: positive regulation of transcription of Notch receptor target
    scope: NOT_APPLICABLE
    scope_reason: >-
      The family name suggests a Notch coactivator function, but it is not a
      family-level property of PTHR16431. It belongs to the MamL-1-domain proteins
      wherever PANTHER happens to classify them (see PTHR15692). Dipteran Mastermind
      should get Notch terms from its own experimental evidence, never through this
      family. No PAINT node here asserts a Notch term, and none should.
