  name:
    name: Protein-primed DNA polymerase
    short: Protein-primed_DNA_pol
  description:
  - text: This family of proteins includes DNA polymerases that are responsible for
      viral DNA replication with high processivity and fidelity. They are characterized
      by a protein-primed replication mechanism, where a terminal protein (TP) serves
      as a primer for DNA synthesis. The polymerases have a dual enzymatic activity,
      with a 3'-5' exonuclease domain at the N-terminus for proofreading and a C-terminus
      responsible for DNA polymerization and pyrophosphorolytic activities. The exonuclease
      activity ensures the removal of incorrectly incorporated nucleotides, enhancing
      the fidelity of DNA replication. These polymerases initiate replication by forming
      a covalent linkage between the hydroxyl group of a serine residue in TP and
      a dAMP, directed by a specific thymine at the 3' end of the template. The polymerases
      are also capable of strand displacement during replication.
