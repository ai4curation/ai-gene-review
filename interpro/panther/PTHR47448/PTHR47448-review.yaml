notes: |-
  HORSE/MAP2K2: A0A9L0SHX8, 390 aa, sequence version 1; cohorts HORSE40. human/MAP2K2: P36507, 400 aa, sequence version 1; cohorts HORSE40_HUMAN_PAIR. NEUCR/mek-1: Q7RYZ6, 518 aa, sequence version 3; cohorts NEUROSPORA20. Source extracts preserve evidence codes, reviewed status and generated-description flags. PANTHER placement is a classification observation. Curated biological prose and member experiments inform the boundary, with unresolved coverage stated explicitly. No ancestral node placement or residue-loss projection is asserted without a checked tree/alignment and sequence anchor. Term assessments include functional-transfer hypotheses and are not a transcription of ProtNLM output; the cohort prediction snapshots remain authoritative about what was emitted.

  Placement evidence (2026-10-02)

  | Protein / source | Frozen UniProt placement (historical observation) | Official PANTHER 19.0 row |
  |---|---|---|
  | P36507 (human / 16642) | PTHR47448:SF3 — MITOGEN-ACTIVATED PROTEIN KINASE KINASE 2 | PTHR48013:SF8 |

  Parent membership is unresolved. This protein is comparative evidence outside structured membership; neither parent is asserted as a replacement.

  All 30 cached reviewed entries describe MAP2K/STE7-like proteins, supporting a coherent MAP-kinase-kinase mechanism in that represented subset. The metadata reports 6,523 proteins, so this is not a complete family sequence inventory. Human MEK2 directly phosphorylates and activates ERK1 (PMID:8388392); Neurospora MEK-1/MAK-1 genetic and localization results support their cascade (PMID:18849472; PMID:41071819). The 390-residue horse A0A9L0SHX8 aligns to 400-residue human P36507 with 90.26% identity across 390 paired residues: 97.5% of human and 100.0% of horse sequence. These findings support the kinase mechanism while leaving specific partners and pathway outputs branch-dependent. Different pathway wiring is not a demonstrated loss of MAPKK activity. The official human P36507 row has a parent conflict. Neurospora Q7RYZ6 is now observed at row 658 as PTHR48013:SF6, whereas the frozen UniProt record assigns PTHR47448:SF5 (MITOGEN-ACTIVATED PROTEIN KINASE KINAE MKK2). Both observations and its MEK-1/MAK-1 biology are retained as comparative evidence outside structured PTHR47448 membership. Human Q02750 and mouse P31938 MAP2K1 occur as PTHR48013:SF5, fission-yeast P10506 byr1 as PTHR48013:SF9 and Q9Y884 pek1 as PTHR48013:SF6. Horse A0A9L0SHX8 has the frozen PTHR47448:SF3 placement (MITOGEN-ACTIVATED PROTEIN KINASE KINASE 2). The complete official PTHR19.0_horse file yielded no exact UniProtKB token for this accession. This does not contradict or supersede the frozen UniProt placement, demonstrate absence from a family, or identify a replacement accession. The release/mapping discrepancy remains unresolved; biological evidence and the earlier placement are preserved here outside current structured membership. The inspected positive MAPKK comparators do not establish an in-family biochemical anchor for PTHR47448 at this boundary. This finite result does not establish that the family lacks MAPKK activity or members elsewhere.

  The table records source observations, not live membership declarations. Complete earlier descriptors and assessments are preserved at https://github.com/ai4curation/ai-gene-review/blob/e82261ba811dadbb944cd3770e7fdd2889ec69a4/interpro/panther/PTHR47448/PTHR47448-review.yaml. Current structured term assessments are authoritative; duplicate historical copies have been removed from these notes.

