family_id: PANTHER:PTHR47448
family_name: DUAL SPECIFICITY MITOGEN-ACTIVATED PROTEIN KINASE KINASE DSOR1-LIKE PROTEIN
summary: >-
  The cached MAP2K/STE7-like proteins support MAP-kinase phosphorylation in conserved signaling
  cascades, with branch-specific partners and cellular responses. Their biochemical evidence remains
  valid, but current PTHR47448 placement and whole-family functional coverage remain unresolved.
functional_coherence: UNKNOWN
coherence_reason: >-
  All 30 cached reviewed entries describe MAP2K/STE7-like proteins, a coherent sampled catalytic
  mechanism. The inspected human, mouse, Neurospora and fission-yeast positive MAPKK comparators
  have official PTHR48013 assignments; horse A0A9L0SHX8 has no exact token in the complete 19.0
  horse file while its frozen UniProt placement remains PTHR47448:SF3. These observations establish
  neither a current in-family biochemical anchor nor absence of MAPKK function throughout PTHR47448.
  The 6,523 metadata proteins have not been covered by a complete sequence/phylogenetic analysis.
  Different pathway wiring is not a catalytic exception; whole-family coherence remains unknown.
subfamilies:
  []
