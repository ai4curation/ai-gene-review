family_id: PANTHER:PTHR47448
family_name: DUAL SPECIFICITY MITOGEN-ACTIVATED PROTEIN KINASE KINASE DSOR1-LIKE PROTEIN
summary: MAP kinase kinases phosphorylate downstream MAP kinases as components of conserved signaling
  cascades. Different branches specify different kinase partners and connect the conserved catalytic step
  to distinct cellular responses.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Dual-specificity MAP-kinase activation should be separated from an unrestricted protein
  kinase annotation. Human/horse MAP2K2 and Neurospora mek-1 cannot automatically share ERK partners or
  physiological outputs; partner specificity and pathway wiring need branch-level evidence.
