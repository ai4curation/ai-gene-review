- assessed_term:
    id: GO:0004708
    label: MAP kinase kinase activity
  scope: FAMILY_WIDE
  scope_reason: The conserved function represented by MAP kinase kinase activity is the family core for
    intact members. Dual-specificity MAP-kinase activation should be separated from an unrestricted protein
