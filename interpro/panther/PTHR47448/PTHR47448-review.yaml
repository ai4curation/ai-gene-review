  HORSE/MAP2K2: A0A9L0SHX8, 390 aa, sequence version 1; cohorts HORSE40. human/MAP2K2: P36507, 400 aa, sequence version 1; cohorts HORSE40_HUMAN_PAIR. NEUCR/mek-1: Q7RYZ6, 518 aa, sequence version 3; cohorts NEUROSPORA20. Source extracts preserve evidence codes, reviewed status and generated-description flags. PANTHER placement is a classification observation. Curated biological prose and member experiments inform the boundary, with unresolved coverage stated explicitly. No ancestral node placement or residue-loss projection is asserted without a checked tree/alignment and sequence anchor. Term assessments include functional-transfer hypotheses and are not a transcription of ProtNLM output; the cohort prediction snapshots remain authoritative about what was emitted.

  PANTHER classification conflict assessment (2026-10-01). Unresolved parent-family classification for UniProtKB:P36507: the frozen UniProt record records PTHR47448:SF3 (MITOGEN-ACTIVATED PROTEIN KINASE KINASE 2), whereas the authenticated official PANTHER 19.0 human sequence-classification row 16642 records PTHR48013:SF8 (DUAL SPECIFICITY MITOGEN-ACTIVATED PROTEIN KINASE KINASE 2). The latter is also the tested upstream membership index assignment. This target is retained below as unresolved comparative evidence, not an asserted member of either parent family. No replacement family or ancestral placement is inferred.

  Move only human P36507 out of asserted membership and preserve its entire original joint descriptor in notes. Horse SF3 and Neurospora SF5 remain unchanged in identity. Change FAMILY_WIDE activity to UNRESOLVED because the supported examples do not settle the complete disputed classification boundary.

