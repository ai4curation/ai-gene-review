family_id: PANTHER:PTHR47448
family_name: DUAL SPECIFICITY MITOGEN-ACTIVATED PROTEIN KINASE KINASE DSOR1-LIKE PROTEIN
summary: MAP kinase kinases phosphorylate downstream MAP kinases as components of conserved signaling
  cascades. Different branches specify different kinase partners and connect the conserved catalytic step
  to distinct cellular responses.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The retained horse MAP2K2 and Neurospora mek-1 groups support a comparison of MAP-kinase
  activation with distinct pathway wiring. Human MAP2K2 remains a directly characterized biochemical comparator
  with unresolved PANTHER parent placement. Its experiment is not used to settle classification boundaries,
  and specific ERK partners or physiological outputs cannot be transferred automatically.
subfamilies:
- subfamily_id: PANTHER:PTHR47448:SF3
  label: MITOGEN-ACTIVATED PROTEIN KINASE KINASE 2
  description: Horse MAP2K2 A0A9L0SHX8 remains assigned to this subfamily in the saved indexes and frozen
    UniProt record. Its alignment to human MAP2K2 provides a biochemical comparison, not proof of identical
    PANTHER parent placement. Partner specificity and pathway wiring require branch-level evidence.
  representative_members:
  - id: UniProtKB:A0A9L0SHX8
    gene_symbol: MAP2K2
    organism: Equus caballus
    gene_review: genes/HORSE/MAP2K2/MAP2K2-ai-review.yaml
- subfamily_id: PANTHER:PTHR47448:SF5
  label: MITOGEN-ACTIVATED PROTEIN KINASE KINAE MKK2
  description: Orthologous sequence group represented by mek-1. Dual-specificity MAP-kinase activation
    should be separated from an unrestricted protein kinase annotation. Human/horse MAP2K2 and Neurospora
    mek-1 cannot automatically share ERK partners or physiological outputs; partner specificity and pathway
    wiring need branch-level evidence.
  representative_members:
  - id: UniProtKB:Q7RYZ6
    gene_symbol: mek-1
    organism: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
    gene_review: genes/NEUCR/mek-1/mek-1-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0004708
    label: MAP kinase kinase activity
  scope: UNRESOLVED
  scope_reason: Human MEK2 directly activates ERK1, and the Neurospora experiments support the MEK-1/MAK-1
    cascade. Horse-human sequence similarity supports the biochemical comparison. The human parent-family
    assignment conflicts between the two sources, so these examples do not establish complete activity
    coverage for PTHR47448. The former FAMILY_WIDE grant is withheld pending boundary reconciliation;
    the individual kinase evidence is retained.
  supported_by:
  - reference_id: PMID:8388392
    supporting_text: "Both MEK1 \nand MEK2 were expressed in Escherichia coli and shown to be able to\
      \ activate \nrecombinant human ERK1 in vitro. The purified MEK2 protein stimulated threonine \n\
      and tyrosine phosphorylation on ERK1 and concomitantly activated ERK1 kinase \nactivity more than\
      \ 100-fold."
  - reference_id: PMID:18849472
    supporting_text: The MAK-1 MAPK was not phosphorylated in Δ mik-1 and Δ mek-1 mutants, consistent
      with the involvement of MIK-1, MEK-1, and MAK-1 in the same signaling cascade.
  - reference_id: PMID:41071819
    supporting_text: In a first step, we confirmed the accumulation of the kinase MAK-1 at the contact
      sites and showed the same localization pattern for both its upstream kinases (Fig 7).
  - reference_id: file:genes/HORSE/MAP2K2/MAP2K2-bioinformatics/RESULTS.md
    supporting_text: The horse sequence A0A9L0SHX8 (390 residues) aligns to human P36507 (400 residues)
      with 90.26% identity across 390 paired residues. Paired coverage is 97.5% of the human sequence
      and 100.0% of the horse sequence.
  - reference_id: file:genes/human/MAP2K2/MAP2K2-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: Catalyzes the concomitant phosphorylation of a threonine and

      CC       a tyrosine residue in a Thr-Glu-Tyr sequence located in MAP kinases.

      CC       Activates the ERK1 and ERK2 MAP kinases (By similarity). Activates BRAF

      CC       in a KSR1 or KSR2-dependent manner; by binding to KSR1 or KSR2 releases

      CC       the inhibitory intramolecular interaction between KSR1 or KSR2 protein

      CC       kinase and N-terminal domains which promotes KSR1 or KSR2-BRAF

      CC       dimerization and BRAF activation (PubMed:29433126).

      CC       {ECO:0000250|UniProtKB:Q63932, ECO:0000269|PubMed:29433126}.'
