  supported_by:
  - reference_id: PMID:8388392
    supporting_text: "Both MEK1 \nand MEK2 were expressed in Escherichia coli and shown to be able to\
      \ activate \nrecombinant human ERK1 in vitro. The purified MEK2 protein stimulated threonine \n\
      and tyrosine phosphorylation on ERK1 and concomitantly activated ERK1 kinase \nactivity more than\
      \ 100-fold."
  - reference_id: PMID:18849472
    supporting_text: The MAK-1 MAPK was not phosphorylated in Δ mik-1 and Δ mek-1 mutants, consistent
      with the involvement of MIK-1, MEK-1, and MAK-1 in the same signaling cascade.
  - reference_id: PMID:41071819
    supporting_text: In a first step, we confirmed the accumulation of the kinase MAK-1 at the contact
      sites and showed the same localization pattern for both its upstream kinases (Fig 7).
  - reference_id: file:genes/HORSE/MAP2K2/MAP2K2-bioinformatics/RESULTS.md
    supporting_text: The horse sequence A0A9L0SHX8 (390 residues) aligns to human P36507 (400 residues)
      with 90.26% identity across 390 paired residues. Paired coverage is 97.5% of the human sequence
      and 100.0% of the horse sequence.
  - reference_id: file:genes/human/MAP2K2/MAP2K2-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: Catalyzes the concomitant phosphorylation of a threonine and

      CC       a tyrosine residue in a Thr-Glu-Tyr sequence located in MAP kinases.

      CC       Activates the ERK1 and ERK2 MAP kinases (By similarity). Activates BRAF

      CC       in a KSR1 or KSR2-dependent manner; by binding to KSR1 or KSR2 releases

      CC       the inhibitory intramolecular interaction between KSR1 or KSR2 protein

      CC       kinase and N-terminal domains which promotes KSR1 or KSR2-BRAF

      CC       dimerization and BRAF activation (PubMed:29433126).

      CC       {ECO:0000250|UniProtKB:Q63932, ECO:0000269|PubMed:29433126}.'
