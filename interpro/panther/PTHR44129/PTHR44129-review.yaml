notes: >-
  Written to back the LIS1 gene reviews (human PAFAH1B1, fly Lis-1, worm lis-1,
  A. nidulans nudF, budding yeast PAC1) and the nucleokinesis module. Naming: PANTHER
  calls the family after S. pombe pop1, an SCF F-box WD40 protein. InterPro's own
  (LLM-generated) entry name, "WD repeat LIS1/nudF dynein regulation", fits the
  best-studied members better but is not PANTHER's name. Classification: two
  classifications disagree for these proteins. (1) The PANTHER 19 tree, which PAINT
  uses and which pantherdb geneinfo reports, places human, mouse and bovine (A5D7P3)
  LIS1 in SF16. It places fly, worm, A. nidulans, yeast and zebrafish LIS1 in SF13,
  and all of them receive IBAs from PTHR44129 nodes. (2) The InterPro/UniProt HMM
  classification (UniProt DR PANTHER lines and PTHR44129-entries.csv) gives human and
  fly LIS1 and nudF the family without a subfamily. It sends worm lis-1 to PTHR19849:SF0
  (PHOSPHOLIPASE A-2-ACTIVATING PROTEIN), yeast PAC1 and several fungal PAC1/nudF
  proteins to PTHR19848:SF8 (family name WD40 REPEAT PROTEIN), zebrafish pafah1b1a to
  PTHR19876 (COATOMER), and Arabidopsis WDR5B into PTHR44129. It also assigns the
  FBXW11 leaves to PTHR14604. So the worm/yeast "split" mentioned in the gene reviews is
  a property of the HMM cross-references, not of the PAINT tree. Tools that group genes
  by UniProt PANTHER xref will miss LIS1 orthologs, including the cross-check validator
  (it will not see worm lis-1 or PAC1 as PTHR44129 members). Two cached PAINT nodes
  (PTN001483578 WDR5/COMPASS, and PTN002337139 TUP1/MET30 nucleus) enter this family's
  slice only through such HMM-versus-tree mismatches (Arabidopsis WDR5B, bovine
  P43033). They say nothing about LIS1. Seed identities were resolved through UniProt
  cross-references and the PANTHER 19 geneinfo service on 2026-09-27; leaf counts come
  from the cached PAINT leaf GAF. Subfamily ids for the LIS1 groups are given in
  descriptions and applicable_subfamilies but not as subfamily_id, because the UniProt
  cross-references needed for membership checks do not carry them. The "dynein complex"
  part_of rows on fly and worm LIS1 are experimental or IEA, not PAINT; they are handled
  by the GO:0030286 term assessment. No residue sites are asserted; the LIS1-dynein
  interface residues were not checked against member sequences here.
