    scope_reason: >-
      The regulatory beta-subunit role in cytosolic PAF-AH (I) is vertebrate-specific.
      Human LIS1 binds the alpha1/alpha2 catalytic dimer, but Drosophila Lis1 binds
      mammalian alpha subunits and not the fly alpha homolog, and fungi have no such
      complex. The term should stay with vertebrate LIS1 (SF16) and never descend to
      invertebrate or fungal orthologs.
