    assessment: SOUND
    assessment_reason: >-
      A narrow node: all 17 leaves in the PAINT leaf GAF are amniote PAFAH1B1. One cat
      leaf (A0A5F5XG80) is named WDR38 but sits among the PAFAH1B1 orthologs, probably a
      gene-model naming artefact. LIS1 belongs to dynein-dynactin-NudE assemblies on
      microtubules; its WD domain binds dynein and dynactin subunits. This general complex
      term is the right way to express that association, and it is used in preference to
      "dynein complex" (see term assessment for GO:0030286). The human, fly and worm
      reviews accept it. Its scope could safely be widened to all LIS1 orthologs (fungal
      NudF co-purifies with dynein-dynactin).
