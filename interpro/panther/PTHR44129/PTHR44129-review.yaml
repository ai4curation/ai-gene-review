term_assessments:
  - assessed_term:
      id: GO:0140659
      label: cytoskeletal motor regulator activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The conserved molecular function of the LIS1 orthologs, proposed as core in every
      member review (human, fly, worm, A. nidulans, yeast). LIS1's WD40 propeller binds
      the dynein motor domain and controls its mechanochemistry and autoinhibition. It is
      not safe for the non-LIS1 subfamilies (SF3, SF4, SF15, SF17). SF13 is also mixed,
      so within SF13 the term should follow LIS1 orthology rather than subfamily
      membership. No PAINT node asserts it today. Because LIS1 orthologs are not a clean
      clade in this tree (see PTN008687761), per-clade IBDs (fungal PTN002891245,
      protostome PTN002891240, amniote PTN000522085) would be safer than one deep node.
    applicable_subfamilies:
