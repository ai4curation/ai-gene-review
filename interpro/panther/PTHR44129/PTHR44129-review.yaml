      complex binding (GO:0070840) already captures that, with microtubule associated
      complex (GO:0005875, the term PAINT uses at PTN000522085) for the assembly. The fly
      and worm reviews MODIFY these rows to GO:0005875, and no PAINT node asserts dynein
