family_id: PANTHER:PTHR44129
family_name: WD REPEAT-CONTAINING PROTEIN POP1
preferred_name: LIS1/NudF/Pac1 dynein regulators and related WD40 beta-propeller proteins
summary: >-
  WD40-repeat family whose best-characterized members are the LIS1 orthologs: human
  PAFAH1B1/LIS1, Drosophila Lis-1, C. elegans LIS-1, Aspergillus nidulans NudF and
  budding yeast Pac1. LIS1 is an N-terminal LisH/coiled-coil dimerization domain followed
  by a seven-bladed WD40 beta-propeller. The propeller binds the AAA+ motor domain of
  cytoplasmic dynein heavy chain, where the ring meets the stalk, and regulates dynein
  mechanochemistry. It holds dynein in a persistent high-force, microtubule-bound state
  and relieves dynein autoinhibition, promoting assembly of activated
  dynein-dynactin-adaptor complexes and targeting dynein to microtubule plus ends. LIS1
  works with the NudE/NudEL coiled-coil proteins (PTHR10921). The conserved biological
  outputs are dynein-driven nuclear migration (fungal hyphal nuclear distribution, yeast
  spindle movement into the bud, C. elegans pronuclear migration, nucleokinesis in
  migrating neurons) and retrograde transport. Metazoan LIS1 also acts at kinetochores,
  centrosomes and the nuclear envelope in mitosis, and human haploinsufficiency causes
  classical lissencephaly. Vertebrate LIS1 has a second, lineage-specific role as the
  non-catalytic regulatory (beta) subunit of cytosolic PAF acetylhydrolase Ib. Fly Lis1
  cannot bind the fly alpha-subunit homolog. In the PANTHER 19 tree the family also
  contains WD40 proteins that are not LIS1 orthologs: the mammalian leaves named FBXW11
  (SF4), nematode wdr-5.2/wdr-5.3 (SF17), and the fungal AFUA_1G12380 group (SF3). SF13
  itself also holds S. pombe pop1 (the family's namesake SCF F-box protein), Candida
  albicans CDC4 and Dictyostelium agtA alongside the invertebrate and fungal LIS1
  orthologs.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  PTHR44129 combines the LIS1 dynein-regulator orthologs with WD40 beta-propeller
  proteins of unrelated function. In the PANTHER 19 tree (pantherdb geneinfo, 2026-09-27)
  these include the leaves named FBXW11 (SF4, e.g. human Q9UKB1); nematode wdr-5.2 and
  wdr-5.3 (SF17); the fungal AFUA_1G12380/ANIA_01056/NCU08485 group (SF3); and a
  PFS/NACHT/WD subfamily (SF15). SF13 is itself mixed: besides the LIS1 orthologs it
  holds S. pombe pop1 (an SCF F-box protein and the family's namesake), C. albicans CDC4
  and Dictyostelium agtA. Within the LIS1 orthologs the core is conserved from fungi to
  mammals (dynein motor-domain binding, cytoskeletal motor regulation, dynein-dependent
  nuclear migration). Two layers are lineage-restricted: the PAF-AH (I) regulatory-subunit
  role is vertebrate-only (SF16), and kinetochore, centrosome and neuronal-migration roles
  are metazoan. No dynein-specific term is safe family-wide.
