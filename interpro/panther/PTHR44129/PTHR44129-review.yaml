subfamilies:
  - label: Vertebrate LIS1 / PAFAH1B1 (PANTHER 19 subfamily SF16)
    representative_members:
      - id: UniProtKB:P43034
        label: Platelet-activating factor acetylhydrolase IB subunit beta
        gene_symbol: PAFAH1B1
        organism: Homo sapiens
        gene_review: genes/human/PAFAH1B1/PAFAH1B1-ai-review.yaml
    diverged_from_family: false
    description: >-
      Vertebrate LIS1 orthologs. The PANTHER 19 tree service places human P43034, mouse
      P63005 and bovine A5D7P3 in PTHR44129:SF16 (PLATELET-ACTIVATING FACTOR
      ACETYLHYDROLASE IB SUBUNIT BETA). No subfamily_id is asserted here because the
      UniProt PANTHER cross-references (InterPro HMM classification) for these entries
      give the family only, with no subfamily. Core dynein regulator. Adds the
      vertebrate-specific role as the regulatory subunit of cytosolic PAF-AH (I),
      binding the PAFAH1B2/PAFAH1B3 catalytic dimer.
  - label: Invertebrate and fungal LIS1 orthologs (PANTHER 19 subfamily SF13)
    representative_members:
      - id: UniProtKB:Q7KNS3
        label: Lissencephaly-1 homolog
        gene_symbol: Lis-1
        organism: Drosophila melanogaster
        gene_review: genes/DROME/Lis-1/Lis-1-ai-review.yaml
      - id: UniProtKB:Q00664
        label: Nuclear distribution protein nudF
        gene_symbol: nudF
        organism: Emericella nidulans (Aspergillus nidulans)
        gene_review: genes/EMENI/nudF/nudF-ai-review.yaml
      - id: UniProtKB:Q9NDC9
        label: Lissencephaly-1 homolog
        gene_symbol: lis-1
        organism: Caenorhabditis elegans
        gene_review: genes/worm/lis-1/lis-1-ai-review.yaml
      - id: UniProtKB:P39946
        label: Nuclear distribution protein PAC1
        gene_symbol: PAC1
        organism: Saccharomyces cerevisiae
        gene_review: genes/yeast/PAC1/PAC1-ai-review.yaml
    diverged_from_family: false
    description: >-
      The PANTHER 19 tree service places fly Lis-1, worm lis-1, A. nidulans nudF, yeast
      PAC1 and both zebrafish pafah1b1a/b in PTHR44129:SF13 (LISSENCEPHALY-1 HOMOLOG
      A-RELATED). These proteins receive their IBAs from PTHR44129 PAINT nodes
      (PTN002336971, PTN002891240, PTN002891245, PTN008687761). The UniProt/InterPro
      HMM classification disagrees for several of them: worm lis-1 is cross-referenced
      to PTHR19849:SF0 (PHOSPHOLIPASE A-2-ACTIVATING PROTEIN), yeast PAC1 and several
      other fungal PAC1/nudF proteins to PTHR19848:SF8, and zebrafish pafah1b1a to
      PTHR19876 (COATOMER). Fly Lis-1 and A. nidulans nudF match PTHR44129 at family
      level only. No subfamily_id is asserted for this group because of that
      disagreement. SF13 as a whole is not a pure LIS1 clade (see coherence_reason).
      All reviewed members share the dynein motor-regulator function. Fly Lis1 has no
      PAF-AH role: it binds mammalian but not Drosophila alpha subunits.
  - subfamily_id: PANTHER:PTHR44129:SF4
    label: F-BOX_WD REPEAT-CONTAINING PROTEIN 11
    diverged_from_family: true
    divergence_description: >-
      Mammalian and chicken leaves annotated as FBXW11 (e.g. human Q9UKB1, mouse Q5SRY7)
      sit in the PANTHER 19 tree as sister to the amniote PAFAH1B1 clade, under nodes
      PTN002336971 and PTN008687769. FBXW11/beta-TrCP2 is an SCF ubiquitin-ligase
      substrate adaptor, not a dynein regulator. The UniProt HMM cross-reference for
      Q9UKB1 and Q5SRY7 is PTHR14604, so the tree and HMM classifications disagree here
      too. These leaves should not inherit LIS1-specific terms such as kinetochore
      localization.
  - subfamily_id: PANTHER:PTHR44129:SF17
    label: WD REPEAT-CONTAINING PROTEIN WDR-5.2-RELATED
    diverged_from_family: true
    divergence_description: >-
      Nematode WDR5-like paralogs (C. elegans wdr-5.2 Q93847 and wdr-5.3 Q23256;
      C. briggsae wdr-5.2) that fall under PTN002336971 in the PANTHER 19 tree. They are
      unrelated to dynein regulation and should not inherit the kinetochore IBD.
  - subfamily_id: PANTHER:PTHR44129:SF3
    label: WD REPEAT PROTEIN (AFU_ORTHOLOGUE AFUA_1G12380)
    diverged_from_family: true
    divergence_description: >-
      Fungal WD40 proteins of unknown function (A. fumigatus AFUA_1G12380, A. nidulans
      ANIA_01056, Neurospora NCU08485) that fall under the fungal LIS1 node PTN002891245
      and so inherit its microtubule cytoskeleton IBD. No dynein-related function is
      documented.

