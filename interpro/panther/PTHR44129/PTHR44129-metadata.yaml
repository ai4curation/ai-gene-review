  name:
    name: WD repeat LIS1/nudF dynein regulation
    short: WD_LIS1/nudF_dynein_reg
  description:
  - text: The WD repeat LIS1/nudF family is involved in the regulation of the minus-end
      directed microtubule motor protein dynein. Family members play a crucial role
      in cellular processes such as mitotic spindle positioning, nuclear migration,
      and microtubule-dependent transport. They may enhance dynein-mediated microtubule
      sliding by targeting dynein to microtubule plus ends and are essential for various
      dynein-dependent processes including Golgi integrity, transport of microtubule
      fragments, and centrosome coupling. Some members also participate in the inactivation
      of platelet-activating factor (PAF) by serving as regulatory subunits of the
      cytosolic type I PAF acetylhydrolase. They are implicated in neuronal development,
      including the proliferation and migration of neuronal precursors, and may influence
      cell locomotion and actin polymerization in response to calcium influx.
