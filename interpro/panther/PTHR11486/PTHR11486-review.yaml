    label: fibroblast growth factor receptor binding
  evidence: IRD
  negated: true
  paint_snapshot: '20260828'
  seeds:
  - id: PANTHER:PTN000160075
  assessment: UNRESOLVED
  assessment_reason: 'FHF clade. This is the one IRD at this node that the evidence does not settle,
    and it is worth separating from the other six. What the literature establishes is that the FHFs
    cannot activate FGF receptors: specific residues in the FGF-like core are responsible, and that
    claim directly supports the signalling, MAPK, proliferation and migration losses. Receptor binding
    is a weaker claim than activation, and the FGF12 review carries an unreconciled IDA row for this
    very term, from the same paper that reports the inability to activate, which it leaves UNDECIDED.
    A protein that binds a receptor without activating it is a coherent phenotype, so the ancestral
    binding term may legitimately survive this node even though every downstream signalling term does
    not. Marked unresolved rather than contradicted: settling it needs the full text of the 2003 paper,
    which is not cached here.'
