family_id: PANTHER:PTHR11486
family_name: FIBROBLAST GROWTH FACTOR
preferred_name: Fibroblast growth factors and FGF homologous factors
summary: >-
  PTHR11486 contains the secreted fibroblast growth factors, which activate FGF receptor tyrosine kinases,
  and the intracellular FGF homologous factors (FGF11-FGF14), which bind voltage-gated sodium channels
  and do not activate FGF receptors.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members share the beta-trefoil FGF fold, but the FHF clade is intracellular and has no receptor-activating
  growth factor activity.
