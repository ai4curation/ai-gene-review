term_assessments:
- assessed_term:
    id: GO:0005576
    label: extracellular region
  scope: FAMILY_WIDE
  scope_reason: 'Safe for every member except the intracellular FHFs, which have no signal sequence
    and are never secreted. PAINT already expresses this with the IRD at PTN000160077, and it works:
    the reviewed FHF member carries no extracellular-region IBA row. Recorded as family-wide with that
    one member excepted rather than scoped to subfamilies: the cross-check places a gene in a subfamily
    from the :SF suffix of its UniProt PANTHER cross-reference, and no member of this family has one.'
  member_exceptions:
  - member:
      id: UniProtKB:P61328
      gene_symbol: FGF12
      organism: Homo sapiens
      gene_review: genes/human/FGF12/FGF12-ai-review.yaml
    exception_reason: FGF12 is an FHF. It has no signal sequence, is not secreted, and acts inside the
      cell on voltage-gated sodium channel C-termini. The exception is anchored in the supported IRD
      at PTN000160077.
    pruned_node_id: PANTHER:PTN000160077
    supported_by:
    - reference_id: PMID:12815063
      supporting_text: are related to FGFs by substantial sequence homology, yet their only documented
        interactions are with an intracellular kinase scaffold protein, islet brain-2 (IB2) and with
        voltage-gated sodium channels
    - reference_id: PMID:22705208
      supporting_text: they cannot activate FGF receptors because of subtle structural differences in
        their FGF-like core
  supported_by:
