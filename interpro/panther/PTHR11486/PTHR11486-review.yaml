- clade_node_id: PANTHER:PTN000896537
  label: FGF1/FGF2 group
  description: 'Exactly FGF1 and FGF2: 45 leaves, 25 and 20 respectively, with nothing else below the
    node. Both lack a conventional signal peptide and reach the extracellular space by non-classical
    export while also maintaining an intracellular and nuclear pool. PAINT gives the group a nucleus
    gain, which is the correct placement for a trait that the root-level cytoplasm gain currently over-propagates.'
