review_date: '2026-11-06'
notes: 'Method. Node membership was established from the PANTHER 19 tree rather than from PAINT''s taxon
  labels, using interpro/panther/tree_check.py; the committed PTHR11486-tree-check.txt lists the reference-proteome
  leaves below each assessed node. Member positions are taken from the 13 gene reviews in this repository
  that carry a PTHR11486 DR line: two zebrafish fgf8 paralogs and human FGF1, FGF2, FGF3, FGF7, FGF8,
  FGF9, FGF10, FGF12, FGF19, FGF21 and FGF23. All 35 rows of the PAINT slice are assessed.


  Why no term here is scoped SUBFAMILY_ONLY. PANTHER does define subfamilies for this family, one per
  FGF, and they are used throughout this review: every SF id in affected_subfamilies was read from the
  tree check and its label from interpro/panther/panther.obo, not written from memory. The obstacle
  is the join, not the ontology. The family/gene cross-check places a gene in a subfamily from the :SF
  suffix of its UniProt PANTHER cross-reference, and none of the 13 reviewed members has one: every
  DR line is a bare ''PTHR11486''. Scoping a term SUBFAMILY_ONLY would therefore make every member unplaceable
  rather than scoped, reporting each as unresolved for want of a cross-reference. This was checked rather
  than assumed: all 13 members join the cross-check index, and all 13 come back with no subfamily, so
  the node-pruning check, which joins a gene to a node verdict through affected_subfamilies, cannot
  fire for this family at all. The affected_subfamilies recorded below are therefore documentation for
  a human reader today, and will start doing machine-readable work as soon as the UniProt cross-references
  carry subfamilies. So the term assessments use FAMILY_WIDE with member exceptions where one member
  and one pruning node carry the case, and UNRESOLVED with the clade named where the real fix is an
  IRD on a branch. The missing UniProt :SF suffixes are themselves worth reporting upstream.


  Headline finding. PAINT models one of this family''s two functional divergences well and the other
  not at all. The FHF divergence is fully expressed: PTN000160077 carries seven IRDs cancelling secretion,
  receptor binding, growth factor activity, FGFR signalling, MAPK activation, proliferation and migration,
  plus two gains that say what the clade does instead. The endocrine divergence has no IRD anywhere,
  which is why FGF19, FGF21 and FGF23 each inherit paracrine mitogenic and migratory terms their own
  reviews then have to remove one at a time. The structural reason is worth recording: the endocrine
  FGFs are not monophyletic in this tree. FGF19 and FGF21 sit under PTN008519127 (27 leaves, exactly
  those two), FGF23 under PTN002608225 (23 leaves, all FGF23), and their lowest common ancestor PTN008519135
  also contains FGF4, FGF5, FGF6, FGF9, FGF16 and FGF20. A single IRD cannot express the endocrine divergence;
  two are needed, one per clade.


  A loss can be correctly placed and still not protect the leaf. The FHF IRDs work in the channel they
  govern: FGF12 has no IBA row for secretion, growth factor activity, FGFR signalling, MAPK activation,
  proliferation or migration, so the propagation really is stopped. FGF12 carries those terms anyway,
  from an automatic family-based mapping and from 1996 and 1999 author statements, and its own review
  marks them over-annotated or undecided one at a time. The family-level judgement is already recorded
  in PAINT; what is missing is any route by which it reaches the other pipelines. For the family-based
  mapping this repository has one: a curated rule under rules/curated/, conditioned on the FHF clade,
  is exactly the instrument for a mapping that is right for most of a family and wrong for one branch.
  That is left as a recommendation rather than written here, because it is a change to a shared rule
  set rather than to this family''s review.


  Known gap: no residue_sites. The natural one for this family is the set of FHF core residues responsible
  for the inability to activate FGF receptors, which would make the whole PTN000160077 divergence machine-checkable
  and would settle the one FHF loss left unresolved here. The cached abstract states that such residues
  exist without naming them, and the full text is not available, so no site is asserted: a guessed position
  is worse than an absent one. Resolving it needs the full text of PMID:12815063 or the FHF1b structure
  it reports.


  Ontology gap. GO has no term for the Klotho co-receptor requirement that distinguishes endocrine from
  paracrine FGF signalling. It is the one fact that explains why GO:0008543 and GO:0043410 are sound
  for FGF19, FGF21 and FGF23 while GO:0008284 and GO:0030334 are not, and it is currently unsayable.
  Raised here rather than as a proposed term because the right form (a co-receptor-dependent child of
  FGFR signalling, versus an annotation extension on the existing term) is a question for an ontology
  editor.


  Six rows left unresolved, for three different reasons. The four IRDs at PTN000160186 act on a single
  terminal leaf, one uncharacterized Ciona intestinalis FGF: they take effect, but nothing here can
  check them. The IRD removing extracellular region from the FGF22 group at PTN002608270 is the row
  that looks wrong on its face, since FGF22 is normally described as a secreted FGF7/FGF10/FGF22 ligand,
  yet no reviewed member sits below that node and the cached literature does not settle its secretion.
  The sixth is the most interesting: the FGFR-binding IRD at the FHF node. The published claim is that
  the FHFs cannot activate FGF receptors, which supports the six signalling-related losses at that node,
  but binding without activation is a coherent phenotype and the FGF12 review holds an unreconciled
  IDA for receptor binding from the same paper. The other six FHF losses are called supported; that
  one is not.'
