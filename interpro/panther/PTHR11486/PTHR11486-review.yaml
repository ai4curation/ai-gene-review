  assessment: NEEDS_PRUNING
  assessment_reason: 'Kept as non-core by most reviewed members, which is the right weight for a developmental
    process downstream of a signalling ligand. Three members push back: FGF21 REMOVEs it, and FGF23
    and FGF7 mark it over-annotated. For the two endocrine members this is the same metabolic-versus-developmental
    split as the proliferation and migration rows. FGF7 is a separate case, a keratinocyte growth factor
    whose epithelial role is captured at PTN002608278, and its review names the neurogenic FGFs as the
    source of the propagation. The affected subfamilies listed below therefore carry two different cases,
    the endocrine three and FGF7, which would be two separate IRDs rather than one. The three endocrine
    ligands are not a clade in this tree: FGF19 and FGF21 sit together under PTN002608284, while FGF23
    descends separately under PTN002608225, and their common ancestor PTN008519135 also contains FGF4,
    FGF5, FGF6, FGF9, FGF16 and FGF20. Expressing their shared divergence therefore takes two IRDs rather
    than one, which is the likely reason PAINT has not recorded it.'
