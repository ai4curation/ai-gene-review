subfamilies:
- clade_node_id: PANTHER:PTN000160077
  label: FGF homologous factors (FHF, FGF11-FGF14)
  description: 'The intracellular class: 91 leaves, 84 of them in the FGF11, FGF12, FGF13 and FGF14
    subfamilies and seven in generically named ones, with no other named FGF below the node. These proteins
    have no signal sequence, are not secreted, and act on the C-terminal tails of voltage-gated sodium
    channels. PAINT models this divergence properly: the node carries seven IRDs cancelling secretion,
    FGFR binding, growth factor activity, FGFR signalling, MAPK activation, proliferation and migration,
    and two gains, nucleus and sodium channel regulator activity.'
  representative_members:
  - id: UniProtKB:P61328
    gene_symbol: FGF12
    organism: Homo sapiens
    gene_review: genes/human/FGF12/FGF12-ai-review.yaml
  diverged_from_family: true
  divergence_description: Not growth factors. They cannot activate FGF receptors because of structural
    differences in the FGF-like core, and their documented interactions are intracellular, with the
    IB2 scaffold and with voltage-gated sodium channel C-termini. Their function is channel modulation,
    not signalling.
