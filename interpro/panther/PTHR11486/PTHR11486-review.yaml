- clade_node_id: PANTHER:PTN008519127
  label: Endocrine FGF19/FGF21 group
  description: 'Exactly FGF19 and FGF21: 27 leaves, 15 in the FGF19 subfamily and 12 in the FGF21 subfamily,
    with nothing else below the node. FGF19''s mouse ortholog is Fgf15. These are circulating metabolic
    hormones requiring betaKlotho as co-receptor, FGF19 repressing bile acid synthesis and FGF21 acting
    on energy and glucose metabolism. The parent node PTN002608284 adds only three leaves in generically
    named subfamilies. PAINT records no divergence at either node, which is the main gap this review
    reports.'
  representative_members:
  - id: UniProtKB:O95750
    gene_symbol: FGF19
    organism: Homo sapiens
    gene_review: genes/human/FGF19/FGF19-ai-review.yaml
  - id: UniProtKB:Q9NSA1
    gene_symbol: FGF21
    organism: Homo sapiens
    gene_review: genes/human/FGF21/FGF21-ai-review.yaml
  diverged_from_family: true
  divergence_description: Endocrine rather than paracrine. They signal through FGFRs and activate MAPK
    like the rest of the family, but they do so systemically and only with a Klotho co-receptor, and
    their outputs are metabolic. The paracrine outcome terms (proliferation, migration, neurogenesis)
    do not apply, and growth factor activity is better expressed as hormone activity.
  supported_by:
  - reference_id: PMID:17623664
    supporting_text: The fibroblast growth factor (FGF) 19 subfamily of ligands, FGF19, FGF21, and FGF23,
      function as hormones that regulate bile acid, fatty acid, glucose, and phosphate metabolism in
      target organs through activating FGF receptors (FGFR1-4).
  - reference_id: PMID:17623664
    supporting_text: We demonstrated that Klotho and betaKlotho, homologous single-pass transmembrane
      proteins that bind to FGFRs, are required for metabolic activity of FGF23 and FGF21, respectively.
  - reference_id: PMID:17623664
    supporting_text: Here we show that, like FGF21, FGF19 also requires betaKlotho.
  - reference_id: PMID:17623664
    supporting_text: Although the affinity of the FGF19 subfamily members to heparin/heparan sulfate
