  seeds:
  - id: PANTHER:PTN000160075
    label: PTN000160075 (ancestral IBD node; IRD source)
  paint_snapshot: '20241120'
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    PTN000160077 is the FGF homologous factor clade (FGF11, FGF12, FGF13, FGF14; 91 leaves). Recombinant
    FHFs bind heparin like classical FGFs but fail to activate any of the seven principal FGF receptors
    (PMID:12815063), and FHFs are not secreted (PMID:8790420). The conflicting row is a rat Fgf14 growth
    factor IDA citing PMID:1824921, whose abstract describes a recombinant hst-1 protein; hst-1 is the
    classical secreted FGF4, not an FHF. The row looks attached to the wrong FGF (candidate Fgf4), which
    would need RGD to check against the full text; the loss itself is supported.
