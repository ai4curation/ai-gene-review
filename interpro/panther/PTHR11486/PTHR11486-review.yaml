- clade_node_id: PANTHER:PTN007510376
  label: FGF8/FGF17/FGF18 group (including nematode EGL-17)
  description: 'Paracrine ligands binding both type 1 and type 2 FGF receptors, central to midbrain-hindbrain
    and limb patterning. 69 leaves: FGF8, FGF17 and FGF18 as expected, but also nine leaves in the EGL-17
    subfamily, the C. elegans FGF. That matters for the two receptor-binding gains at this node, which
    name the vertebrate FGFR1 and FGFR2 isoform classes: a nematode FGF signals through the worm FGF
    receptor EGL-15, so the type 1 and type 2 distinction those terms draw has no referent for it. Note
    also that EGL-17 is not the only C. elegans FGF; the cached worm FGF pathway paper works through
    LET-756, which is not in this clade. No EGL-17 member is reviewed here, so the point is recorded
    rather than acted on. The two zebrafish fgf8 paralogs are the reviewed members; the FGF8-specific
    dorsoventral patterning gain sits one node below, at PTN002608342, whose 27 leaves are FGF8 only.'
