family_id: PANTHER:PTHR11486
family_name: FIBROBLAST GROWTH FACTOR
preferred_name: Fibroblast growth factor ligands (paracrine, endocrine and intracellular FHF classes)
summary: 'The FGF family comprises the 22 human fibroblast growth factors and their orthologs, small
  beta-trefoil proteins built on one conserved core fold. The fold is the only thing all members share:
  functionally the family splits three ways, and the split is the single most important fact for annotating
  it.


  Most members are paracrine ligands. They are secreted, bind heparan sulfate in the extracellular matrix,
  which restricts their diffusion and keeps them acting locally, and activate one of the four FGF receptor
  tyrosine kinases, which signals onward through the MAPK, PI3K and PLCgamma cascades. These are the
  members that drive proliferation, migration, wound repair and the many developmental patterning events
  FGFs are known for, and the subfamilies within this class are largely receptor-isoform specific: FGF7
  and FGF10 select the epithelial FGFR2b isoform, FGF8, FGF17 and FGF18 bind FGFR1 and FGFR2.


  Three members, FGF19 (Fgf15 in mouse), FGF21 and FGF23, are endocrine instead. They have lost most
  of their heparan sulfate affinity, so they leave the tissue of origin and circulate as hormones, and
  they require a Klotho or betaKlotho co-receptor at the target cell to bind FGFR productively. Their
  biology is metabolic rather than mitogenic: bile acid synthesis for FGF19, energy and glucose metabolism
  for FGF21, and phosphate and vitamin D homeostasis for FGF23. They still use FGFRs and still activate
  MAPK, so the signalling terms apply to them while the proliferative and migratory outcomes do not.


  Four members, FGF11 to FGF14, are not growth factors at all. These FGF homologous factors (FHFs) lack
  a signal sequence, are never secreted, and cannot activate FGF receptors because of structural differences
  in their FGF-like core. They act inside the cell, binding the C-terminal tails of voltage-gated sodium
  channels and modulating their gating and availability, which is why FGF14 mutations cause spinocerebellar
  ataxia rather than a skeletal or growth phenotype.'
functional_coherence: HETEROGENEOUS
coherence_reason: One fold, three functional classes. The intracellular FHFs (FGF11-FGF14) are not secreted
  and cannot activate FGFRs; the endocrine ligands (FGF19, FGF21, FGF23) circulate as metabolic hormones
  and need a Klotho co-receptor; the remaining members are local heparin-binding paracrine ligands.
  No specific term is safe across all three, so family-level terms have to be either genuinely general
  (secreted, FGFR binding, FGFR signalling) or scoped.
