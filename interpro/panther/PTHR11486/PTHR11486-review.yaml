  assessment: TOO_DEEP
  assessment_reason: 'Cytoplasmic localization is placed at the family root but holds for a minority
    of members. Of the twelve reviewed members that receive it, seven reject it outright: FGF7, FGF10,
    FGF19, FGF21 and FGF23 REMOVE it and the two zebrafish fgf8 paralogs mark it over-annotated. FGF1,
    FGF3 and FGF9 keep it as non-core, which is agreement that the term is true of them rather than
    a dispute, and only FGF2 and FGF12 accept it as core. Five REMOVEs on a root-level gain are what
    makes this a placement error rather than a weighting disagreement. Three of those reviews independently
    diagnose the same cause, naming this node and attributing the gain to the intracellular and non-classically
    secreted members. That is the signature of a gain placed earlier than the trait arose: an intracellular
    pool is a real property of the FHF clade and of the FGF1/FGF2 group, not of the ancestral secreted
    ligand. Both clades already exist as nodes here, PTN000160077 and PTN000896537, the latter already
    carrying the nucleus gain for FGF1/FGF2, so the fix is to move the gain down to them rather than
    to prune it from everything else.'
