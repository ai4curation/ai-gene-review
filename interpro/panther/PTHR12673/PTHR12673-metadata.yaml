  name:
    name: FYVE, RhoGEF and PH domain-containing
    short: FYVE_RhoGEF_PH
  description:
  - text: The FYVE, RhoGEF and PH domain-containing protein family is involved in
      the regulation of the actin cytoskeleton and cell shape. Members of this family
      activate CDC42, a Ras-like Rho family GTPase, by facilitating the exchange of
      bound GDP for free GTP. This activation process is crucial for various cellular
      functions including the formation of filopodia and lamellipodia, cell polarity,
      cytokinesis, and potentially affects the lifespan of an organism. Some family
      members are also implicated in the activation of MAPK8 and may influence proangiogenic
      actions of VEGF in vascular endothelial cells. The family is characterized by
      the presence of multiple domains, including FYVE-type zinc fingers for endosomal
      localization, DH domains for interaction with GTPases, and PH domains for membrane
      association and lipid binding. These domains contribute to the diverse roles
      of the family in cellular signaling and morphology.
