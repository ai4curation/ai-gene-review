family_id: PANTHER:PTHR30239
family_name: ACETOLACTATE SYNTHASE SMALL SUBUNIT
preferred_name: Bacterial, archaeal and plant acetohydroxyacid synthase regulatory (small) subunit, IlvH/IlvN/AHASS
summary: >-
  ACT-domain regulatory subunits of acetohydroxyacid synthase (AHAS, acetolactate synthase) from
  bacteria, archaea, red algae and plants. The ThDP-dependent catalytic large subunit (IlvB/IlvI/
  IlvG, ILV2, plant ALS) carries out the condensation of two pyruvates, or of pyruvate and
  2-oxobutanoate. The small subunit is needed for full activity of the holoenzyme and for feedback
  inhibition by valine (and, in plants, also by leucine and isoleucine). E. coli IlvH and IlvN pair
  with different catalytic isozymes. Arabidopsis has two small subunits, AHASS1/AIP1 and
  AHASS2/AIP3/VAT1, each with a duplicated ACT region. They are in chloroplasts and were also
  detected in peroxisomes. The fungal ILV6 regulatory subunits are not in this family; PANTHER
  classifies them separately as PTHR31242.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members (SF0 bacterial/archaeal/plastid IlvH and plant AHASS1, SF4 E. coli
  IlvN, SF18 plant AHASS2) are AHAS regulatory subunits. Subfamilies SF17 and SF19 (ACT
  DOMAIN-CONTAINING PROTEIN) and SF27 (OS11G0256050 PROTEIN) have no reviewed members in the
  inventory, and their function is not established. Compartment differs by lineage: bacteria are
  cytosolic, while the plant subunits are plastid-targeted.
