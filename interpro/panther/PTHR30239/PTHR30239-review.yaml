node_assessments:
- node_id: PANTHER:PTN000767018
  asserted_term:
    id: GO:0003984
    label: acetolactate synthase activity
  paint_snapshot: '20221008'
  seeds:
  - id: UniProtKB:P00894
    label: ilvH
    organism: Escherichia coli
  - id: UniProtKB:P0ADF8
    label: ilvN
    organism: Escherichia coli
  assessment: UNRESOLVED
  assessment_reason: >-
    The node placement is not the problem: every descendant is an AHAS small subunit. The problem
    is the qualifier. The node asserts "enables" acetolactate synthase activity for subunits that
    have no catalytic machinery. The catalytic site is in the large subunit, and the small subunit
    stimulates its activity and confers feedback inhibition. This is the complex-activity-transfer
    pattern. A contributes_to qualifier, or the specific term acetolactate synthase regulator
    activity (GO:1990610), would describe these subunits correctly. The seed annotations are
    experimental and their full texts were not reviewed here, so the row is flagged rather than
    rejected. The branched-chain amino acid module already declines to use this assertion and
    uses GO:1990610 for the small-subunit annoton.
  supported_by:
  - reference_id: PMID:10213630
    supporting_text: In bacteria, the enzyme has a large subunit containing the catalytic machinery and
      a small subunit with a regulatory role.
- node_id: PANTHER:PTN000767018
  asserted_term:
    id: GO:0009099
    label: L-valine biosynthetic process
  paint_snapshot: '20221008'
  seeds:
  - id: UniProtKB:P00894
    label: ilvH
    organism: Escherichia coli
  - id: UniProtKB:P0ADF8
    label: ilvN
    organism: Escherichia coli
  - id: AGI_LocusCode:AT2G31810
    label: AHASS1
    organism: Arabidopsis thaliana
  - id: AGI_LocusCode:AT5G16290
    label: AHASS2
    organism: Arabidopsis thaliana
  assessment: SOUND
  assessment_reason: >-
    The seeds span bacteria and plants. The small subunit is a stable component of the AHAS
    holoenzyme that catalyses the first step of valine synthesis, and it is required for full
    activity, so it contributes to the step and does not merely regulate it from outside. The
    same reasoning applies to isoleucine (GO:1901705), which the node does not assert.
  supported_by:
  - reference_id: PMID:11389597
    supporting_text: composed of a catalytic subunit, and a smaller regulatory subunit that is required
      for full activity and for sensitivity to feedback regulation by valine
- node_id: PANTHER:PTN000767018
  asserted_term:
    id: GO:0005829
    label: cytosol
  paint_snapshot: '20210905'
  seeds:
  - id: UniProtKB:P00894
    label: ilvH
    organism: Escherichia coli
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The single seed is E. coli IlvH, and cytosol is correct for the bacterial members. The node
    also covers the plant subunits AHASS1 (SF0, Q93YZ7) and AHASS2 (SF18, Q9FFF4). Both are
    reviewed receivers of this cytosol IBA, yet they are plastid proteins (C-terminal YFP fusions
    localize to chloroplasts; N-terminal fusions were also seen in peroxisomes). An IRD on the
    plant branch is needed. Only SF18 is listed as affected because SF0 also holds the bacterial
    IlvH proteins for which the term is correct.
  affected_subfamilies:
  - id: PANTHER:PTHR30239:SF18
    label: ACETOLACTATE SYNTHASE SMALL SUBUNIT 2, CHLOROPLASTIC
  supported_by:
  - reference_id: PMID:28388946
    supporting_text: Whereas all three C-terminal YFP-fusions to ALS, AIP1, and AIP3 were found to localize
      to chloroplasts
  - reference_id: PMID:28388946
    supporting_text: Two out of the eight classes, AIP1 (AT2G31810) and AIP3/VAT1 (AT5G16290), showed
      high deduced protein similarity to prokaryotic and eukaryotic regulatory ALS subunits
