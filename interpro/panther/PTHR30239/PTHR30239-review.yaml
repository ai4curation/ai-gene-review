notes: >-
  Receivers of PTN000767018 were read from the PAINT UniProt GAF and include E. coli IlvH and
  IlvN, B. subtilis IlvH, Arabidopsis AHASS1 and AHASS2. P. putida KT2440 proteins are not in that
  GAF, so their descent could not be read from it. Subfamily placement of Q88DY9 (SF0) was taken
  from its UniProt PANTHER cross-reference. The yeast/fungal ILV6 regulatory subunits are
  classified in PTHR31242, not here; the module lists both families for the same annoton, which
  is correct.
