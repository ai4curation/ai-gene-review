- assessed_term:
    id: GO:0003984
    label: acetolactate synthase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    No small subunit catalyses the condensation; the catalytic machinery is in the large
    subunit. As an "enables" assertion, which is how PAINT propagates it from PTN000767018, the
    term is not safe for any member. A contributes_to reading for the holoenzyme would be
    defensible but is not what the IBA states. See the node assessment.
  supported_by:
  - reference_id: PMID:10213630
    supporting_text: In bacteria, the enzyme has a large subunit containing the catalytic machinery
