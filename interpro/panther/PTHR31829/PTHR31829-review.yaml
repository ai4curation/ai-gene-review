family_id: PANTHER:PTHR31829
family_name: PYRIDOXAL 5'-PHOSPHATE SYNTHASE SUBUNIT SNZ1-RELATED
preferred_name: PLP synthase subunit PdxS/SNZ/PDX1 family
summary: >-
  The (beta/alpha)8 synthase subunit of DXP-independent PLP synthase condenses ribose 5-phosphate,
  glyceraldehyde 3-phosphate and PdxT-derived ammonia into PLP (bacterial PdxS, S. cerevisiae SNZ1,
  S. pombe snz1, plant PDX1.1/PDX1.3). Plant PDX1.2 is a non-catalytic paralog that regulates the
  active subunits.
functional_coherence: MOSTLY_COHERENT
coherence_reason: PLP synthase activity holds for SF0, SF4 and SF6. Plant PDX1.2 (SF2) is a pseudoenzyme.
