  name:
    name: Major Facilitator Superfamily Transporters
    short: MFS_Transporters
  description:
  - text: The Major Facilitator Superfamily (MFS) protein family includes diverse
      transporters that facilitate the movement of substrates across cellular membranes.
      Members of this family are involved in various biological processes, including
      the efflux of secondary metabolites, such as antibiotics and toxins, providing
      resistance and self-protection for producing organisms. Some family members
      function as proton-coupled symporters for the transport of steroid conjugates,
      bile acids, folates, and heme, playing roles in lysosomal escape, copper homeostasis,
      and iron trafficking. Others are involved in innate immune responses, transporting
      pathogen-associated molecular patterns to cytosolic receptors and contributing
      to the recognition of microbial components and the activation of inflammatory
      pathways. The family also includes uncharacterized proteins, suggesting a potential
      for undiscovered functions. The transport mechanism, electrogenicity, and stoichiometry
      of these transporters are subjects of ongoing research.
