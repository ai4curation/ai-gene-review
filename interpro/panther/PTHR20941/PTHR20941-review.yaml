family_id: PANTHER:PTHR20941
family_name: FOLATE SYNTHESIS PROTEINS
preferred_name: Dihydropteroate synthase (FolP/FOL1) family
summary: >-
  Dihydropteroate synthases condense 6-hydroxymethyldihydropterin diphosphate with p-aminobenzoate
  in folate synthesis; they are the target of sulfonamides. Bacterial FolP (and sulfonamide-resistant
  Sul variants) is monofunctional. Fungal FOL1 (S. cerevisiae FOL1, S. pombe fol1) is trifunctional,
  adding dihydroneopterin aldolase and HPPK domains. Mycobacterial FolP2 (SF8) is inactive.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  DHPS activity holds for SF1, which includes monofunctional FolP and trifunctional FOL1; the aldolase
  and HPPK activities are only in the fused fungal proteins. SF8 FolP2 is catalytically inactive.
