        supporting_text: >-
          Subunit of clathrin-associated adaptor protein complex 1 that plays a
          role in protein sorting in the late-Golgi/trans-Golgi network (TGN)
          and/or endosomes.
  - subfamily_id: PANTHER:PTHR22780:SF5
    label: AP-1 COMPLEX SUBUNIT GAMMA
