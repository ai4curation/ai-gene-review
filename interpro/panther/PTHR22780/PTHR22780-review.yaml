family_id: PANTHER:PTHR22780
family_name: ADAPTIN, ALPHA/GAMMA/EPSILON
preferred_name: Adaptor protein complex large alpha, gamma, and epsilon subunits
summary: >-
  Large non-beta adaptin subunits (alpha, gamma, and epsilon adaptins;
  IPR050840) of eukaryotic heterotetrameric adaptor protein complexes AP-1,
  AP-2, and AP-4. Each member comprises an N-terminal alpha-solenoid (ARM/HEAT
  repeat) trunk domain that pairs with a beta-adaptin trunk and binds membrane
  phosphoinositides (PI4P at the TGN/endosomes for AP-1 gamma; PI(4,5)P2 at the
  plasma membrane for AP-2 alpha) or Arf1 GTPase, connected via a flexible
  hinge to a C-terminal appendage (ear) domain that recruits accessory coat
  and regulatory proteins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All family members share the conserved large-adaptin trunk-hinge-ear
  architecture and function as membrane-docking and accessory-recruiting
  scaffolds of heterotetrameric AP complexes across Eukaryota, but diverge by
  subfamily in organelle specificity and coat partnership: AP-1 gamma adaptins
  (SF26, SF28) and AP-2 alpha adaptins (SF33, SF30) are clathrin-associated
  adaptors at the TGN/endosomes and plasma membrane, respectively, whereas AP-4
  epsilon (SF13) forms a non-clathrin coat at the TGN.
reference_protein:
  id: UniProtKB:O43747
  label: AP-1 complex subunit gamma-1
  gene_symbol: AP1G1
  organism: Homo sapiens
subfamilies:
  - subfamily_id: PANTHER:PTHR22780:SF26
    label: AP-1 COMPLEX SUBUNIT GAMMA-1
    description: >-
      Vertebrate gamma-1 large subunit (human AP1G1) of the heterotetrameric
      AP-1 clathrin adaptor complex that docks onto Arf1-GTP and PI4P at the
      trans-Golgi network and endosomes and recruits GAE-domain accessory
      factors (RABEP1, SYNRG, AFTPH).
    representative_members:
