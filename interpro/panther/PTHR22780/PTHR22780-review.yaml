    label: AP-1 COMPLEX SUBUNIT GAMMA-LIKE 2
    description: >-
      Vertebrate gamma-2 adaptin paralog (AP1G2).
    representative_members:
      - id: UniProtKB:O75843
        label: AP-1 complex subunit gamma-like 2
        gene_symbol: AP1G2
