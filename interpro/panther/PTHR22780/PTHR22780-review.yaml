    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR22780:SF33
    label: AP-2 COMPLEX SUBUNIT ALPHA-1
    description: >-
      Vertebrate alpha-1 large subunit (human AP2A1) of the plasma-membrane AP-2
      clathrin adaptor complex that binds PI(4,5)P2 and recruits endocytic
      accessory proteins via its C-terminal ear domain.
    representative_members:
      - id: UniProtKB:O95782
        label: AP-2 complex subunit alpha-1
        gene_symbol: AP2A1
        organism: Homo sapiens
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR22780:SF4
    label: AP-2 COMPLEX SUBUNIT ALPHA
    description: >-
      Invertebrate AP-2 alpha-adaptin large subunit orthologs (including C.
      elegans APA-2 and Drosophila AP-2alpha).
    representative_members:
      - id: UniProtKB:Q22601
        label: AP-2 complex subunit alpha
        gene_symbol: apa-2
        organism: Caenorhabditis elegans
    diverged_from_family: false
    supported_by:
      - reference_id: file:genes/worm/apa-2/apa-2-uniprot.txt
        supporting_text: >-
          Adaptins are components of the adaptor complexes which link clathrin
          to receptors in coated vesicles.
  - subfamily_id: PANTHER:PTHR22780:SF30
    label: AP-2 COMPLEX SUBUNIT ALPHA-2
    description: >-
      Alpha-2 large subunit paralog (human AP2A2) of the plasma-membrane AP-2
      clathrin adaptor complex.
    representative_members:
      - id: UniProtKB:O94973
        label: AP-2 complex subunit alpha-2
        gene_symbol: AP2A2
        organism: Homo sapiens
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR22780:SF13
    label: AP-4 COMPLEX SUBUNIT EPSILON-1
    description: >-
      Epsilon large subunit (human AP4E1) of the non-clathrin AP-4 adaptor
      complex at the trans-Golgi network that recruits TEPSIN.
    representative_members:
      - id: UniProtKB:Q9UPM8
        label: AP-4 complex subunit epsilon-1
        gene_symbol: AP4E1
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      AP4E1 is the large epsilon subunit of the AP-4 complex, which forms a
      non-clathrin coat (with TEPSIN) at the trans-Golgi network rather than a
      clathrin-associated coat.
    supported_by:
      - reference_id: file:genes/human/AP4E1/AP4E1-uniprot.txt
        supporting_text: >-
          AP-4 forms a non clathrin-associated coat on vesicles departing the
          trans-Golgi network (TGN) and may be involved in the targeting of
          proteins from the trans-Golgi network (TGN) to the endosomal-lysosomal
          system.
