term_assessments:
- assessed_term:
    id: GO:0047580
    label: 4-hydroxyproline epimerase activity
  scope: UNRESOLVED
  scope_reason: >-
    Characterized 4-hydroxyproline epimerases occur in both subfamilies: P. aeruginosa PA1268 and
    P. putida ProR in SF1, Agrobacterium Atu0398 in SF5. Both subfamilies also hold members that
    lack the activity, including the mammalian L3HYPDH dehydratases in SF1 and the proline racemases
    and LhpL in SF5. Similarity-network analysis found that this activity arose more than once in the
    superfamily from divergent ancestors, so no subfamily partition captures it. Within this family
    the activity is established protein by protein: the diagnostic features are the paired catalytic
    cysteines and the Val residue that admits the 4-hydroxyl, which is a residue-level rather than a
    subfamily-level determinant. Resolving the scope needs active-site typing of each member rather
    than further PAINT nodes.
  supported_by:
  - reference_id: PMID:24980702
    supporting_text: We conclude that these two families of 4HypEs evolved from divergent, but homologous, ancestors.
  - reference_id: PMID:17849014
    supporting_text: >-
      The absence of epimerization exhibited by the two mutants revealed that the Val60 aliphatic
      residue indeed accounts for OH-Pro ligand specificity and is consequently essential for HyPRE
      catalysis.
- assessed_term:
    id: GO:0016836
    label: hydro-lyase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The PAINT assertion is restricted to the Opisthokonta L3HYPDH clade inside SF1, seeded by the
    human and mouse enzymes. The bacterial 4-hydroxyproline epimerases of SF1 catalyse an
    epimerization, not a dehydration, and are excepted. Bacterial dehydratases in SF5 (LhpL, LhpH)
    also perform hydro-lyase chemistry, but they lie outside this node and their own activity is
    recorded on the SF5 descriptor instead.
  applicable_subfamilies:
  - id: PANTHER:PTHR33442:SF1
    label: TRANS-3-HYDROXY-L-PROLINE DEHYDRATASE
