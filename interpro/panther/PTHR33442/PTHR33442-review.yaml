notes: >-
  Written for the hydroxyproline-catabolism module; no earlier review existed, and neither open PR
  #5077 nor #5078 adds one for this family. Both PANTHER subfamilies are mixed, so the family asserts
  no subfamily-level 4-hydroxyproline epimerase scope: the module grounds its epimerase step on the
  PA1268 and ProR exemplars and asserts InterPro IPR008794 for the fold rather than a PANTHER term.
  Two items are deliberately UNRESOLVED and named as such: the GO:0047580 IBD node seeded by LhpL,
  whose purified protein lacks that activity in two studies, and the family-wide scope of
  4-hydroxyproline epimerase activity, which the superfamily acquired more than once and which turns
  on active-site residues rather than subfamily membership.
