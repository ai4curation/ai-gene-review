family_id: PANTHER:PTHR33442
family_name: TRANS-3-HYDROXY-L-PROLINE DEHYDRATASE
preferred_name: Proline racemase superfamily (proline racemases, hydroxyproline 2-epimerases, trans-3-hydroxy-L-proline dehydratases)
summary: >-
  PLP-independent members of the proline racemase superfamily (InterPro IPR008794). They abstract the
  alpha-proton of proline or hydroxyproline using active-site cysteine (or serine/threonine) pairs
  contributed across a homodimer interface. Three activities are characterized: proline racemase
  (Clostridioides difficile, Trypanosoma cruzi), 4-hydroxyproline 2-epimerase (the entry enzyme of
  bacterial trans-4-hydroxy-L-proline catabolism, e.g. Pseudomonas aeruginosa PA1268/LhpA and
  P. putida ProR), and trans-3-hydroxy-L-proline dehydratase (mammalian L3HYPDH, bacterial LhpH/LhpL).
  Some members are bifunctional. Similarity-network work shows that the 4HypE function evolved more
  than once in this superfamily, so neither PANTHER subfamily predicts function by membership alone.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Both PANTHER subfamilies mix activities. SF1 holds bacterial 4-hydroxyproline epimerases together
  with the mammalian and Azospirillum trans-3-hydroxy-L-proline dehydratases. SF5 holds proline
  racemases, trans-3-hydroxy-L-proline dehydratases, the bifunctional P. aeruginosa LhpL and some
  4-hydroxyproline epimerases. The characterized activities share the alpha-carbon proton-transfer
  chemistry, but substrate, stereochemistry and reaction outcome (epimerization or dehydration) are
  set by a few active-site residues.
reference_protein:
  id: UniProtKB:Q9I476
  label: 4-hydroxyproline 2-epimerase
  gene_symbol: PA1268
  organism: Pseudomonas aeruginosa PAO1
  gene_review: genes/PSEAE/PA1268/PA1268-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR33442:SF1
  label: TRANS-3-HYDROXY-L-PROLINE DEHYDRATASE
  description: >-
    Mixed subfamily: proteobacterial 4-hydroxyproline 2-epimerases (P. aeruginosa PA1268, P. putida
    ProR, P. fluorescens PFL_1412, Brucella PrpA) and trans-3-hydroxy-L-proline dehydratases
    (human and mouse L3HYPDH, Azospirillum brasilense LhpH). The subfamily label reflects only the
    dehydratases.
  diverged_from_family: true
  divergence_description: >-
    The bacterial epimerases interconvert trans-4-hydroxy-L-proline and cis-4-hydroxy-D-proline and
    have no proline racemase activity. The animal L3HYPDH enzymes dehydrate trans-3-hydroxy-L-proline
    to Delta1-pyrroline-2-carboxylate. Neither activity can be transferred across SF1 on membership
    alone.
  supported_by:
  - reference_id: PMID:17849014
    supporting_text: >-
      B. pseudomallei and P. aeruginosa recombinant proteins presented no measurable PRAC activity but
      demonstrated strong epimerization of OH-L/D-Pro behaving as genuine OH-Pro epimerases.
  - reference_id: PMID:35055190
    supporting_text: >-
      dehydration by trans-3-hydroxy-L-proline dehydratase (L3HYPDH), resulting in the formation of
      Δ1-pyrroline-2-carboxylate
  representative_members:
  - id: UniProtKB:Q9I476
    label: 4-hydroxyproline 2-epimerase
    gene_symbol: PA1268
    organism: Pseudomonas aeruginosa PAO1
    gene_review: genes/PSEAE/PA1268/PA1268-ai-review.yaml
  - id: UniProtKB:Q88NF3
    label: 4-hydroxyproline 2-epimerase
    gene_symbol: proR
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/proR/proR-ai-review.yaml
  - id: UniProtKB:Q96EM0
    label: Trans-3-hydroxy-L-proline dehydratase
    gene_symbol: L3HYPDH
    organism: Homo sapiens
- subfamily_id: PANTHER:PTHR33442:SF5
  label: BIFUNCTIONAL TRANS-3-HYDROXY-L-PROLINE DEHYDRATASE_2-EPIMERASE
  description: >-
    Mixed subfamily: proline racemases (T. cruzi PA45-A/B, C. difficile), trans-3-hydroxy-L-proline
    dehydratases (Agrobacterium Atu4684, Brucella BR0337), the bifunctional P. aeruginosa LhpL (PA1255)
    and some 4-hydroxyproline epimerases (Agrobacterium Atu0398).
  diverged_from_family: true
  divergence_description: >-
    P. aeruginosa LhpL dehydrates and 2-epimerizes trans-3-hydroxy-L-proline. Recombinant LhpL (the
    Ser-Cys variant tested by Goytia et al.) showed neither 4-hydroxyproline epimerase nor proline
    racemase activity, so the hydroxyproline-epimerase role of SF1 epimerases does not extend to it.
  supported_by:
  - reference_id: PMID:27929065
    supporting_text: >-
      encodes a bifunctional dehydratase and 2-epimerase toward trans-3-hydroxy-L-proline
  - reference_id: PMID:17849014
    supporting_text: >-
      control recombinant proteins produced from B. cenocepacia and P. aeruginosa sequences that
      present ‘Cys-Thr’ or ‘Ser-Cys’ couple replacements respectively did not show neither PRAC nor
      HyPRE enzymatic activities.
  representative_members:
  - id: UniProtKB:Q9I489
    label: Bifunctional trans-3-hydroxy-L-proline dehydratase/2-epimerase
    gene_symbol: lhpL
    organism: Pseudomonas aeruginosa PAO1
  - id: UniProtKB:Q868H8
    label: Proline racemase B
    gene_symbol: PA45-B
    organism: Trypanosoma cruzi (strain CL Brener)
  - id: UniProtKB:A9CKB4
    label: 4-hydroxyproline 2-epimerase
    gene_symbol: Atu0398
    organism: Agrobacterium fabrum (strain C58)
