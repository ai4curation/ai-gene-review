- node_id: PANTHER:PTN002433936
  asserted_term:
    id: GO:0047580
    label: 4-hydroxyproline epimerase activity
  evidence: IBD
  paint_snapshot: '20180110'
  seeds:
  - id: UniProtKB:Q9I489
  assessment: UNRESOLVED
  assessment_reason: >-
    The single seed is P. aeruginosa LhpL (PA1255, SF5). Two biochemical studies of the purified
    protein argue against a 4-hydroxyproline epimerase function: Goytia et al. detected neither HyPRE
    nor PRAC activity in the recombinant P. aeruginosa Ser-Cys protein, and Watanabe et al.
    characterized LhpL as a bifunctional trans-3-hydroxy-L-proline dehydratase and 2-epimerase that
    displays no trans-4-hydroxy-L-proline epimerase activity. The GOA row behind the seed is an IMP
    from the lhp regulatory genetics. Whether the node intends the 3-hydroxyproline 2-epimerization
    (for which 4-hydroxyproline epimerase activity would be the wrong term) or a genuine
    4-hydroxyproline epimerization cannot be settled from the cached data, and the node's leaves are
    not listed in the PAINT table. Resolving it needs the tree leaves under PTN002433936 and a
    re-reading of the PseudoCAP IMP.
  supported_by:
  - reference_id: file:interpro/panther/PTHR33442/PTHR33442-paint.tsv
    supporting_text: "PTHR33442\tPTN002433936\tGO:0047580\tF\tIBD\tfalse\tUniProtKB:Q9I489\ttaxon:\t20180110"
  - reference_id: PMID:27929065
