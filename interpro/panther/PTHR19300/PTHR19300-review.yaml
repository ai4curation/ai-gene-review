  ancestral PTN nodes (PANTHER:PTN000446820, PANTHER:PTN001061236, PANTHER:PTN001061327, PANTHER:PTN002499591,
  PANTHER:PTN002712018 (+3 more)) with different molecular function assignments across clades (UDP-galactose:glucosylceramide
  beta-1,4-galactosyltransferase activity (GO:0008489), galactosyltransferase activity (GO:0008378), xylosylprotein
  4-beta-galactosyltransferase activity (GO:0046525), beta-N-acetylglucosaminylglycopeptide beta-1,4-galactosyltransferase
