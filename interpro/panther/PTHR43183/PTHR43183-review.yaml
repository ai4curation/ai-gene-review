family_id: PANTHER:PTHR43183
family_name: HYPOTHETICAL DIHYDROXYACID DEHYDRATASE (EUROFUNG)-RELATED
preferred_name: IlvD/Edd-type sugar-acid dehydratases (pentonate and sulfogluconate dehydratases)
summary: >-
  Iron-sulfur sugar-acid dehydratases of the IlvD/Edd superfamily that are distinct from the
  branched-chain dihydroxy-acid dehydratase IlvD and the 6-phosphogluconate dehydratase Edd. The five
  SwissProt inventory members are the pentonate dehydratases of oxidative pentose catabolism
  (Azospirillum AraC and Rhizobium AraD L-arabinonate dehydratases, Caulobacter XylD D-xylonate
  dehydratase, and the putative Sinorhizobium IlvD1), all in SF1, and the Pseudomonas putida SQ1
  6-deoxy-6-sulfo-D-gluconate dehydratase of the sulfo-ED pathway, the sole SwissProt member of SF2.
  Each converts a sugar acid to its 2-keto-3-deoxy derivative.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members catalyze the same chemistry, a C2-C3 dehydration of an aldonic or
  sulfo-aldonic acid to the 2-keto-3-deoxy acid, but the substrate differs between the pentonate
  dehydratases of SF1 and the sulfogluconate dehydratase of SF2, so the specific EC activity must be
  assigned per subfamily or member.
reference_protein:
  id: UniProtKB:P0DOV7
  label: 6-deoxy-6-sulfo-D-gluconate dehydratase
  gene_symbol: PpSQ1_00400
  organism: Pseudomonas putida SQ1
  gene_review: genes/PSEPU/PpSQ1_00400/PpSQ1_00400-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43183:SF2
  label: DIHYDROXY-ACID DEHYDRATASE
  description: >-
    Holds the P. putida SQ1 sulfogluconate dehydratase, the only SF2 member in the SwissProt
    inventory. Its substrate, 6-deoxy-6-sulfo-D-gluconate, separates it from the pentonate
    dehydratases of SF1; whether every SF2 member is a sulfogluconate dehydratase is not established
    by the inventory.
  representative_members:
  - id: UniProtKB:P0DOV7
    gene_symbol: PpSQ1_00400
    organism: Pseudomonas putida SQ1
    gene_review: genes/PSEPU/PpSQ1_00400/PpSQ1_00400-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Substrate divergence from the pentonate dehydratases of SF1: a C6 sulfonated aldonate instead of
    a C5 aldonate.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43183/PTHR43183-entries.csv
    supporting_text: P0DOV7,6-deoxy-6-sulfo-D-gluconate dehydratase,protein,303,Pseudomonas putida,Pseudomonas putida,PpSQ1_00400,579,PTHR43183:SF2
- subfamily_id: PANTHER:PTHR43183:SF1
  label: HYPOTHETICAL DIHYDROXY-ACID DEHYDRATASE (EUROFUNG)-RELATED
  description: >-
    Pentonate dehydratases of oxidative L-arabinose and D-xylose catabolism (4 inventory members).
  representative_members:
  - id: UniProtKB:Q1JUQ1
    gene_symbol: araC
    organism: Azospirillum brasilense
  - id: UniProtKB:Q9A9Z2
    gene_symbol: xylD
    organism: Caulobacter vibrioides
  diverged_from_family: false
  supported_by:
  - reference_id: file:interpro/panther/PTHR43183/PTHR43183-entries.csv
    supporting_text: Q1JUQ1,L-arabonate dehydratase
  - reference_id: file:interpro/panther/PTHR43183/PTHR43183-entries.csv
    supporting_text: Q9A9Z2,D-xylonate dehydratase
term_assessments:
- assessed_term:
    id: GO:0016836
    label: hydro-lyase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterized member is a sugar-acid dehydratase (L-arabinonate, D-xylonate or
    6-deoxy-6-sulfo-D-gluconate), so the generic hydro-lyase parent holds family-wide. GO has no term
    for the sulfogluconate reaction (EC 4.2.1.162), so this is also the term used for the sulfo-ED
    annoton; the substrate-specific pentonate dehydratase terms must not be transferred to SF2.
  supported_by:
  - reference_id: file:genes/PSEPU/PpSQ1_00400/PpSQ1_00400-uniprot.txt
    supporting_text: Catalyzes the dehydration of 6-deoxy-6-sulfo-D-gluconate to 2-dehydro-3,6-dideoxy-6-sulfo-D-gluconate.
  - reference_id: file:interpro/panther/PTHR43183/PTHR43183-entries.csv
    supporting_text: B5ZZ34,L-arabinonate dehydratase
