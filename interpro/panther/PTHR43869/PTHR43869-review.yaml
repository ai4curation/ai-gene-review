family_id: PANTHER:PTHR43869
family_name: GLYCINE BETAINE/PROLINE BETAINE TRANSPORT SYSTEM ATP-BINDING PROTEIN PROV
preferred_name: Osmolyte-uptake ABC transporter ATP-binding subunits (ProV, OpuAA, GbuA, CbcV, TmoW)
summary: >-
  Nucleotide-binding (ATPase) subunits of binding-protein-dependent ABC
  importers of quaternary ammonium compounds and related solutes: E. coli and
  Salmonella ProV (glycine betaine/proline betaine), Bacillus and Lactococcus
  OpuAA (glycine betaine), Listeria GbuA (glycine betaine/carnitine), Dickeya
  OusV, Roseobacter/Pelagibacter TmoW (trimethylamine N-oxide), S. meliloti HutV
  (histidine) and the Pseudomonas CbcV ATPase of the choline/betaine/carnitine
  importer. Members hydrolyze ATP to drive import; the substrate is selected by
  the partner binding protein.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member is the ATPase of an ABC importer (ATP hydrolysis and complex
  membership hold family-wide), but the transported substrate is set by the
  binding protein and differs between systems (glycine betaine, choline,
  carnitine, TMAO, histidine), and in Pseudomonas one CbcWV core serves several
  binding proteins. Substrate-specific transport terms therefore do not
  transfer from family membership.
