    assessment: SOUND
    assessment_reason: >-
      Seeded by E. coli ProV and P. aeruginosa CbcV; every member is the ATPase
      of an ABC importer. The member reviews refine it to the
      substrate-binding subunit-containing child where the binding protein is
      known.
    affected_subfamilies:
      - id: PANTHER:PTHR43869:SF1
        label: GLYCINE BETAINE_PROLINE BETAINE TRANSPORT SYSTEM ATP-BINDING PROTEIN PROV
    supported_by:
      - reference_id: file:interpro/panther/PTHR43869/PTHR43869-paint.tsv
        supporting_text: "PTHR43869\tPTN002466744\tGO:0043190\tC\tIBD\tfalse"
  - node_id: PANTHER:PTN002466744
    asserted_term:
      id: GO:0005275
      label: amine transmembrane transporter activity
    evidence: IBD
    negated: false
    seeds:
      - id: UniProtKB:P14175
      - id: UniProtKB:Q9HTI8
    assessment: WRONG_NODE
    assessment_reason: >-
      Both seeds are quaternary-ammonium importers (E. coli ProV, glycine
      betaine and proline betaine; P. aeruginosa CbcV, choline, betaine and
      carnitine), and an OLS4 hierarchy query
      (genes/PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md, run 2026-11-04) shows
      that none of their substrate terms sits under GO:0005275: carnitine,
      betaine and the ABC quaternary-ammonium activity sit under GO:0015651 /
      GO:0015697 instead. GO defines an amine as "weakly basic in character"
      with "an amino (-NH2) or substituted amino group", which the permanently
      charged quaternary ammonium substrates are not. The seeds therefore do
      not support this term at any node of the family, which is why the member
      reviews modify rather than merely generalize it. Subfamily SF1 does also
      contain genuine amine-related importers (S. meliloti HutV for histidine,
      TmoW for trimethylamine N-oxide), so the verdict is about this term's
      placement for the quaternary-ammonium clade, not a claim that no member
      transports a nitrogenous compound.
    affected_subfamilies:
      - id: PANTHER:PTHR43869:SF1
        label: GLYCINE BETAINE_PROLINE BETAINE TRANSPORT SYSTEM ATP-BINDING PROTEIN PROV
    supported_by:
      - reference_id: file:interpro/panther/PTHR43869/PTHR43869-paint.tsv
        supporting_text: "PTHR43869\tPTN002466744\tGO:0005275\tF\tIBD\tfalse"
      - reference_id: file:genes/PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md
        supporting_text: "- GO:0005275 amine transmembrane transporter activity: definition: \"Enables the transfer of amines, including polyamines, from one side of a membrane to the other. Amines are organic compounds that are weakly basic in character and contain an amino (-NH2) or substituted amino group.\""
      - reference_id: file:genes/PSEPK/cbcW/cbcW-bioinformatics/RESULTS.md
        supporting_text: "| GO:0015418 | ABC-type quaternary ammonium compound transporting activity | no | no | yes |"
