    assessment: UNRESOLVED
    assessment_reason: >-
      The seed systems import glycine betaine, proline betaine, choline and
      carnitine, all quaternary ammonium compounds, which GO classifies under
      quaternary ammonium group transmembrane transporter activity rather than
      under this term, and the family also contains histidine (HutV) and TMAO
      (TmoW) importers. The node placement is plausible for an
      import-function term, but whether GO:0005275 ("amines ... contain an
      amino (-NH2) or substituted amino group") is meant to cover quaternary
      ammonium compounds needs a GO editorial ruling; the enables qualifier on
      an ATPase subunit is also questionable. Not propagated to KT2440 CbcV in
      the cached GOA.
