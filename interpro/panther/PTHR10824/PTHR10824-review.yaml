summary: ACYL-COENZYME A THIOESTERASE-RELATED (PANTHER:PTHR10824) is characterized in PANTHER PAINT across
  7 ancestral PTN node(s) (PANTHER:PTN000793330, PANTHER:PTN000793338, PANTHER:PTN000793354, PANTHER:PTN001286267
  (+3 more)) with 12 IBD node assertion(s) and 1 term(s) carrying negated IRD/IKR branch blocks, covering
  very long-chain fatty acid metabolic process (GO:0000038, BP), long-chain fatty acid metabolic process
  (GO:0001676, BP), mitochondrion (GO:0005739, CC), succinyl-CoA metabolic process (GO:0006104, BP) and
  7 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR10824 (ACYL-COENZYME A THIOESTERASE-RELATED) span
  7 distinct ancestral PTN nodes (PANTHER:PTN000793330, PANTHER:PTN000793338, PANTHER:PTN000793354, PANTHER:PTN001286267,
  PANTHER:PTN001327401 (+2 more)) with different molecular function assignments across clades (fatty acyl-CoA
  hydrolase activity (GO:0047617), acyltransferase activity, transferring groups other than amino-acyl
  groups (GO:0016747)), indicating clade-level functional specialization across the family.
