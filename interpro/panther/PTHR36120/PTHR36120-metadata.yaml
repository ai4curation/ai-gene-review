  name:
    name: Sulfoquinovose Isomerase
    short: SqvD_Isomerase
  description:
  - text: This family of proteins includes enzymes that catalyze the isomerization
      of sulfoquinovose (SQ) to 6-deoxy-6-sulfo-D-fructose (SF). These enzymes are
      involved in various D-sulfoquinovose degradation pathways, which differ in the
      end products they generate, such as sulfolactate (SL) and 2-hydroxyethane-1-sulfonate
      (isethionate). These pathways are referred to as sulfo-TAL (or sulfo-SFT), sulfo-TK,
      and sulfo-EMP2, highlighting the diversity of metabolic routes in which these
      proteins function.
