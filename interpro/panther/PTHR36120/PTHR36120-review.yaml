family_id: PANTHER:PTHR36120
family_name: FUCOSE ISOMERASE
preferred_name: SqvD-type sulfoquinovose isomerases (L-fucose isomerase fold)
summary: >-
  Bacterial sulfoquinovose (SQ) isomerases with the L-fucose isomerase-like fold (Pfam Fuc_iso_N and
  Fucose_iso_C), which convert 6-sulfo-beta-D-quinovose to 6-deoxy-6-sulfo-D-fructose (RHEA:40439, EC
  5.3.1.31). Characterized members are SqvD of Bacillus (Priestia) megaterium and SftI of Bacillus
  aryabhattai, the entry enzymes of the transaldolase-dependent (sulfo-TAL or sulfo-SFT)
  sulfoglycolytic pathway; SqvD orthologs also serve the transketolase-dependent sulfo-TK route of
  anaerobic Clostridia and the sulfo-EMP2 route. Despite the PANTHER family name, no member has been
  shown to isomerize L-fucose. The family is unrelated in sequence to the E. coli sulfo-EMP SQ
  isomerase YihS, which belongs to the N-acylglucosamine 2-epimerase fold (PTHR15108).
functional_coherence: COHERENT
coherence_reason: >-
  All four SwissProt members in the local inventory are named sulfoquinovose isomerase and sit in
  subfamily SF1: SqvD (B. megaterium) and SftI (B. aryabhattai) are experimentally characterized,
  and the Clostridium sp. MSTE9 and Alkalicoccus urumqiensis proteins are the SqvD isomerases of the
  sulfo-TK and sulfo-EMP2 gene clusters. Subfamily SF2 has no SwissProt member here and its function
  is not established, so coherence is stated for the characterized part of the family.
