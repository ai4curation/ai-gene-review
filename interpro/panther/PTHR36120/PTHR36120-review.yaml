notes: >-
  Reviewed for the bacterial sulfoquinovose catabolism module, whose sulfo-SFT isomerase annoton
  selects PTHR36120 with SqvD and SftI as representatives; both are in SF1, which the module could
  name instead of the whole family. PAINT has no node-level annotation for this family
  (fetch-panther-paint, 2026-11-10: 20 nodes, none annotated), so there are no node assessments.
  Subfamily names were checked in panther.obo (SF1 L-FUCOSE ISOMERASE C-TERMINAL DOMAIN-CONTAINING
  PROTEIN; SF2 FUCOSE ISOMERASE).
