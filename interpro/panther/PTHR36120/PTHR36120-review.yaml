term_assessments:
- assessed_term:
    id: GO:0061593
    label: sulfoquinovose isomerase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Directly assayed for SftI (13C6-SQ converted to 13C6-SF by the purified enzyme) and recorded with
    experimental evidence for SqvD; the remaining SF1 members are the SqvD isomerases of sulfo-TK and
    sulfo-EMP2 gene clusters. Restricted to SF1 because SF2 has no characterized member.
  applicable_subfamilies:
  - id: PANTHER:PTHR36120:SF1
    label: L-FUCOSE ISOMERASE C-TERMINAL DOMAIN-CONTAINING PROTEIN
  supported_by:
  - reference_id: PMID:32919372
    supporting_text: Thus, protein SftI is an SQ isomerase.
  - reference_id: PMID:41676062
    supporting_text: SQ is also initially converted to SF via SqvD
  - reference_id: file:genes/PRIM1/sqvD/sqvD-uniprot.txt
    supporting_text: Catalyzes the isomerization of sulfoquinovose (SQ) to 6-deoxy-6-sulfo-D-fructose
- assessed_term:
    id: GO:0008736
    label: L-fucose isomerase activity
  scope: UNRESOLVED
  scope_reason: >-
    InterPro2GO assigns L-fucose isomerase activity to SqvD and SftI through the fucose isomerase
    C-terminal domain (IPR015888), i.e. from the shared fold. No family member has been assayed with
    L-fucose; the characterized substrates are SQ and, for SftI, fructose 6-phosphate. The gene
    reviews mark the row as over-annotated. Resolving it needs an L-fucose to L-fuculose assay with
    a purified SF1 member (and characterization of an SF2 member).
  supported_by:
  - reference_id: PMID:32919372
    supporting_text: Furthermore, the reaction mixture converted the [1,2,3-13C3]-F6P to [1,2,3-13C3]-G6P,
      owing to an activity of the SQ-isomerase also with F6P.
  - reference_id: file:genes/PRIM1/sqvD/sqvD-uniprot.txt
    supporting_text: InterPro; IPR015888; Fuc_isomerase_C.
