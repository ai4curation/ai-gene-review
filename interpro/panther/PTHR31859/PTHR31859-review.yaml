family_id: PANTHER:PTHR31859
family_name: TETRATRICOPEPTIDE REPEAT PROTEIN 39 FAMILY MEMBER
preferred_name: TTC39/IML2 scaffold proteins
summary: TTC39/IML2-related proteins include metazoan TTC39 paralogs and fungal proteins associated with
  inclusion-body handling. Repeat-mediated interactions support distinct cellular functions in different
  branches.
functional_coherence: HETEROGENEOUS
coherence_reason: The macaque target is assigned TTC39C. The primary screen explicitly includes zebrafish
  ttc39c, so the gene-level comparison is supported; the remaining question is whether the exact heart-asymmetry
  phenotype and ciliary mechanism transfer to this product. Fungal IML2 and other TTC39 paralogs do not
  inherit vertebrate laterality roles.
subfamilies:
- subfamily_id: PANTHER:PTHR31859:SF1
  label: TETRATRICOPEPTIDE REPEAT PROTEIN 39C
  description: Recorded placement of A0A2K5UJ34. The macaque target is assigned to TTC39C. The cited vertebrate
    laterality phenotype cannot be applied to fungal IML2 or to all TTC39 paralogs. A vertebrate ortholog
    comparison must connect the tested gene to TTC39C before heart laterality becomes a transferable property.
  representative_members:
  - id: UniProtKB:A0A2K5UJ34
    gene_symbol: A0A2K5UJ34
    organism: Macaca fascicularis
    gene_review: genes/MACFA/A0A2K5UJ34/A0A2K5UJ34-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0061371
    label: determination of heart left/right asymmetry
  scope: UNRESOLVED
  scope_reason: The cited zebrafish screen explicitly tests ttc39c along with ttc4, ttc9c and ttc36, and
    reports cilia-related left-right-patterning defects. Thus the TTC39C comparison is supported at the
    gene level, but a pooled ciliopathy/laterality statement must be separated from a gene-specific heart-asymmetry
    measurement. This organismal process cannot be extended to fungal IML2 or all TTC39 paralogs, and
    the exact heart-specific positive branch boundary remains unresolved.
  supported_by:
  - reference_id: PMID:25860617
    supporting_text: defective left-right patterning
  - reference_id: file:genes/MACFA/A0A2K5UJ34/A0A2K5UJ34-uniprot.txt
    supporting_text: DR   InterPro; IPR019412; IML2/TPR_39.
  - reference_id: PMID:25860617
    supporting_text: 'Our systematic

      screen in zebrafish identified four novel TTC genes, ttc4, -9c, -36, and -39c,

      that are critical for cilia formation and motility.'
