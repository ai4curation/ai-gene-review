family_id: PANTHER:PTHR12449
family_name: DEATH DOMAIN-CONTAINING PROTEIN
summary: NOL4-family proteins are nuclear interaction proteins with isoform-dependent regulatory activities
  demonstrated in mammals. Mouse NOL4 splice variants bind the Mlr1/Mlr2 transcription factors and alter
  their transcriptional output; the conserved molecular role of the divergent fly CG46301 product remains
  unresolved.
functional_coherence: UNKNOWN
coherence_reason: Mouse NOL4 variants interact differently with Mlr1 and Mlr2, and deletion of an NLS-containing
  region changes both binding and the direction of transcriptional regulation (PMID:25366156). The reporter
  host was Drosophila S2 cells, but the assayed regulatory proteins were mouse proteins; this is not a
  direct fly CG46301 functional experiment. The long fly protein shares family classification, without
  evidence that it uses the same partners or is a death receptor despite the domain-dominated family label.
  Coherence remains unknown at the level of a conserved molecular mechanism, rather than implying that
  no member has been studied.
