- assessed_term:
    id: GO:0070203
    label: regulation of establishment of protein localization to telomere
  scope: NOT_APPLICABLE
  scope_reason: >-
    Originates from an unsupported IDA on PMID:25172512 (which tested whether ubiquitination of
    TPP1 affects TPP1's own telomere localization and found no effect) that was subsequently
    propagated to mouse and rat Acd via ISO/IEA; ACD/TPP1 directly executes establishment of
    protein localization to telomeres (GO:0070200) for POT1 and telomerase rather than regulating
    an external localization machinery.
  supported_by:
  - reference_id: PMID:25172512
    supporting_text: ubiquitination of human TPP1 is not required for its localization to telomeres.
