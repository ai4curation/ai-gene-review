notes: >-
  Note nomenclature hazard: mammalian ACD proteins are almost universally called TPP1 in telomere
  literature, whereas the official HGNC/ZFIN gene symbol TPP1/tpp1 (UniProtKB:O14773 in human,
  UniProtKB:F8W2M8 in zebrafish) belongs to PANTHER:PTHR10574 (lysosomal sedolisin serine protease
  tripeptidyl-peptidase 1 / CLN2). Similarly, S. pombe tpp1 (UniProtKB:P78875) is trehalose-6-phosphate
  phosphatase, whereas the S. pombe PTHR14487 shelterin subunit is tpz1 (UniProtKB:O14246).
