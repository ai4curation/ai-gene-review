- site_id: tel_patch_acidic_loop
  label: OB-fold TEL patch EEKE loop
  description: >-
    Surface-exposed acidic loop on the TPP1 OB-fold domain (Glu82-Glu83-Lys84-Glu85 within the
    Asp80-Trp81-Glu82-Glu83-Lys84-Glu85 motif of canonical 458-aa human Q96AP0 SV 4; reported as
    Glu168-Glu169-Lys170-Glu171 in 544-aa TPP1-L numbering) that directly engages the TERT TEN-IFD
    TRAP surface. In-frame deletion of Lys84 (historical delta-K170) distorts this acidic knuckle,
    abolishing telomerase recruitment and causing dyskeratosis congenita / Hoyeraal-Hreidarsson
    syndrome while leaving shelterin assembly and telomere capping intact.
