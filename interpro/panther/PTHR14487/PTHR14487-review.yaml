  label: N-terminal of OB-fold (NOB) hydrophobic PWI motif
  description: >-
    Conserved N-terminal hydrophobic PWI tripeptide immediately preceding the TPP1 OB-fold domain
    (Pro11-Trp12-Ile13 in canonical 458-aa human Q96AP0 SV 4; Pro97-Trp98-Ile99 in the 544-aa
    TPP1-L isoform) that docks into a hydrophobic pocket formed by the TERT TEN and TRAP domains
    to stabilize telomerase recruitment and stimulate repeat-addition processivity in vertebrates.
