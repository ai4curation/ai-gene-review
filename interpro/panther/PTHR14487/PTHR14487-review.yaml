    label: telomerase inhibitor activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    Originates from a mis-curated IDA annotation on human ACD citing PMID:25172512 (a USP7
    deubiquitination study containing no telomerase enzymatic assays) and is contradicted by direct
    biochemical demonstrations that canonical POT1-TPP1 and Pot1-Tpz1 stimulate, rather than
    catalytically inhibit, telomerase activity; cis-restraint of telomere elongation occurs via
    shelterin/POT1 overhang sequestration and CST recruitment (GO:0032211).
  supported_by:
  - reference_id: PMID:20231318
    supporting_text: POT1-TPP1 binding to telomeric DNA activates telomerase repeat addition processivity.
  - reference_id: PMID:25172512
