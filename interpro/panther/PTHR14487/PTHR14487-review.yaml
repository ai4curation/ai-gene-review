family_id: PANTHER:PTHR14487
family_name: ADRENOCORTICAL DYSPLASIA PROTEIN ACD
preferred_name: Shelterin complex subunit ACD/TPP1/Tpz1 family
summary: >-
  Eukaryotic shelterin adaptor and telomerase recruitment proteins typified by vertebrate ACD
  (commonly known as TPP1) and Schizosaccharomyces pombe Tpz1. Family members contain an N-terminal
  oligonucleotide/oligosaccharide-binding (OB) fold structurally homologous to ciliate telomere
  end-binding protein beta (TEBP-beta), followed by a central POT1/Pot1-binding domain and a
  C-terminal shelterin-bridging motif (binding TIN2 in vertebrates or Poz1 and Ccq1 in fission
  yeast). Unlike POT1/Pot1, TRF1/TRF2, or Taz1, members of this family do not directly bind
  telomeric repeat DNA; instead, they act as core molecular adaptors within the shelterin complex
  that tether single-stranded G-overhang-binding POT1/Pot1 to the duplex-telomere scaffold to cap
  chromosome ends and suppress DNA damage signaling and non-homologous end joining. Through
  surface loops on their N-terminal OB fold (the acidic TEL patch DWEEKE loop and N-terminal PWI
  NOB motif in vertebrates, and a co-evolved basic/polar TEL-patch loop in fission yeast Tpz1),
  they directly bind the telomerase catalytic subunit TERT/Trt1 to recruit telomerase to telomeres
  and stimulate telomere repeat addition, while also promoting telomere length homeostasis in cis
  via POT1/Pot1 shelterin linkage and recruitment of the CST (CTC1/STN1/TEN1 or Stn1/Ten1)
  terminator complex.
functional_coherence: COHERENT
coherence_reason: >-
  All experimentally characterized members across vertebrates (human ACD, mouse Acd, rat Acd) and
  fission yeast (S. pombe tpz1) belong to PANTHER:PTHR14487:SF3 and share the same non-catalytic,
  non-DNA-binding shelterin adaptor architecture, chromosome end-capping function, and dual
  positive and negative regulation of telomerase-mediated telomere maintenance. Although the
  charge of the telomerase-contacting OB-fold loop co-evolved with TERT/Trt1 between vertebrates
  and fission yeast, the underlying TERT/Trt1 polymerase-binding and telomerase-activating roles
  are conserved across the family.
