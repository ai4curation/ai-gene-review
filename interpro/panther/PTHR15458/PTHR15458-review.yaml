notes: >-
  IBA recipients were listed from the PAINT UniProt GAF. The two module uses (the OPI3 annoton
  and the PEMT annoton in cdp_dag_phospholipid_synthesis at SF5, and the PEMT annoton in
  kennedy_pathway_phospholipid_synthesis at the base family) agree with this review. Using
  GO:0000773 for OPI3 and GO:0004608 for PEMT matches each enzyme's physiological step. In the
  human PEMT review, the IBA GO:0000773 is KEEP_AS_NON_CORE and GO:0004608 is core, which is
  consistent with that. S. pombe cho1 (O74827), the OPI3 ortholog, has no gene review. Note
  that this name is easily confused with S. cerevisiae CHO1, the PS synthase in PTHR14269.
