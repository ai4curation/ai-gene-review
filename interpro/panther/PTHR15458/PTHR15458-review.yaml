family_id: PANTHER:PTHR15458
family_name: PHOSPHATIDYLETHANOLAMINE N-METHYLTRANSFERASE
preferred_name: OPI3/PEMT/PLMT phospholipid N-methyltransferase family
summary: >-
  Small, multi-pass ER-membrane phospholipid N-methyltransferases that use
  S-adenosyl-L-methionine to methylate the ethanolamine head group of phosphatidylethanolamine
  (PE) and its partly methylated derivatives, producing phosphatidylcholine (PC). In fungi
  the member OPI3/PEM2 (S. pombe cho1, Neurospora chol-2, Aspergillus choC) mainly makes the
  second and third methylations, PMME to PDME to PC, after the unrelated CHO2 (PTHR32138)
  has made the first. Animal PEMT makes all three methylations by itself. Plant PLMT
  methylates the partly methylated intermediates. The family is unrelated to the fungal CHO2
  family.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member is a SAM-dependent PE/PMME/PDME N-methyltransferase in the ER that
  makes PC. The animal and fungal members differ in which of the three methylations they do
  physiologically, not in the type of reaction. Yeast Opi3 can make the first methylation at a
  low rate, and animal PEMT makes all three. The one PAINT node, PTN000397368 (Eukaryota),
  covers both subfamilies. Among Swiss-Prot entries SF11 holds only Dictyostelium pemtB, which has no characterization
  and inherits the family terms. Nothing suggests it has diverged, but nothing confirms the
  function either.
