  assessment: SOUND
  assessment_reason: >-
    The seeds span fungi and plants. Animal PEMT also performs the PMME and PDME methylations,
    as part of its full three-step reaction. The term therefore holds for every characterized
    descendant: fungal OPI3, plant PLMT and animal PEMT, whose review keeps it as a correct
    sub-activity. The co-asserted GO:0006656 phosphatidylcholine biosynthetic process and
    GO:0005783 endoplasmic reticulum are equally sound. The yeast OPI3 review accepts all three
    IBAs.
  supported_by:
  - reference_id: file:genes/yeast/OPI3/OPI3-ai-review.yaml
    supporting_text: IBA from PTN000397368 (fungal and plant PLMTs incl. S. pombe and Arabidopsis members, and
      Opi3 itself).
term_assessments:
- assessed_term:
    id: GO:0000773
    label: phosphatidyl-N-methylethanolamine N-methyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The PMME-to-PDME-to-PC methylations are shared by every characterized member. This is the
    module's MF for the fungal OPI3 step.
  supported_by:
  - reference_id: PMID:2445736
    supporting_text: PMME and phosphatidyl-N,N-dimethylethanolamine were found to be utilized more preferentially
      than PE.
  - reference_id: PMID:22345606
    supporting_text: the final two methylations are catalyzed by the OPI3-encoded phospholipid methyltransferase
- assessed_term:
    id: GO:0004608
    label: phosphatidylethanolamine N-methyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The module uses this MF for the animal PEMT variant. The first methylation, PE to PMME, is
    the main physiological role of PEMT. In fungi CHO2 (PTHR32138) does it, and OPI3 keeps only
    a low-rate first-step activity. The capacity is therefore shared by the family, but its
    weight differs between lineages. Do not read this term on a fungal member as meaning that
    OPI3 replaces CHO2. No PAINT node asserts it.
  supported_by:
  - reference_id: file:genes/human/PEMT/PEMT-uniprot.txt
    supporting_text: 'FUNCTION: Catalyzes the three sequential steps of the methylation'
  - reference_id: file:genes/yeast/OPI3/OPI3-ai-review.yaml
    supporting_text: Opi3 can catalyse the first methylation (PE -> PMME) at a low rate; residual first-step
      activity in
- assessed_term:
    id: GO:0006656
    label: phosphatidylcholine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member makes PC directly by methylating it into existence. Both the module and the
    PAINT node assert this term.
  supported_by:
  - reference_id: file:genes/yeast/OPI3/OPI3-ai-review.yaml
    supporting_text: IBA from PTN000397368. Opi3 performs the final methylations that yield PC.
- assessed_term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  scope: FAMILY_WIDE
  scope_reason: >-
    The module asserts the ER membrane, and the PAINT node asserts the broader ER (GO:0005783).
    Yeast Opi3 and human PEMT are both integral ER-membrane enzymes.
  supported_by:
  - reference_id: PMID:22345606
    supporting_text: PE then undergoes three sequential methylation reactions in the ER
  - reference_id: file:genes/yeast/OPI3/OPI3-ai-review.yaml
    supporting_text: IBA is_active_in ER from PTN000397368 (incl. human PEMT). Consistent with yeast data.
