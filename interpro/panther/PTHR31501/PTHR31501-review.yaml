family_id: PANTHER:PTHR31501
family_name: CALCIUM RELEASE-ACTIVATED CALCIUM CHANNEL PROTEIN 1
preferred_name: ORAI calcium release-activated calcium channel family
summary: >-
  Four-pass metazoan ORAI proteins form the pore of calcium release-activated calcium
  channels. Vertebrates have ORAI1, ORAI2 and ORAI3 paralogs that form STIM-gated
  store-operated CRAC channels in the plasma membrane; the PANTHER IBD node for
  membrane localization, store-operated calcium channel activity and store-operated
  calcium entry descends to all three human paralogs, and no PAINT losses apply on
  those lineages.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed family members are plasma-membrane ORAI/CRAC calcium-channel pore
  subunits. ORAI1, ORAI2 and ORAI3 differ in channel kinetics and in their use in
  store-independent ARC/LRC channels, but all three retain STIM-gated store-operated
  calcium channel activity.
