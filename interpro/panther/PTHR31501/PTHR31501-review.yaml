  - node_id: PANTHER:PTN001267146
    asserted_term:
      id: GO:0002115
      label: store-operated calcium entry
    evidence: IBD
    paint_snapshot: '20240731'
    seeds:
      - id: FB:FBgn0041585
      - id: MGI:MGI:1925542
      - id: MGI:MGI:3039586
