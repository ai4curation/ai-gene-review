      - id: UniProtKB:Q96D31
      - id: UniProtKB:Q96SN7
      - id: UniProtKB:Q9BRQ5
      - id: WB:WBGene00015648
    assessment: SOUND
    assessment_reason: >-
      Store-operated calcium entry is the shared process mediated by STIM-gated ORAI
      channels. Human ORAI1 has extensive direct SOCE evidence, and ORAI2/ORAI3
      retain SOCE activity both when overexpressed with STIM1 and in native channel
      heteromers.
    supported_by:
