        supporting_text: "PTHR31501\tPTN001267146\tGO:0002115\tP\tIBD\tfalse"
      - reference_id: PMID:32415068
        supporting_text: >-
          ORAI2 and ORAI3 channels multimerize with ORAI1 to expand the range of
          sensitivity of receptor-activated Ca2+ signals
