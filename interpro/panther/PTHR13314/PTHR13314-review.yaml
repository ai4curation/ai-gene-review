  assessment: TOO_DEEP
  assessment_reason: >-
    The GO:0005262 row is seeded only by Drosophila fwe but is placed at the
    Opisthokonta node, causing fungal TVP18 proteins with no demonstrated
    calcium-channel activity to inherit it. The Eumetazoa node PTN000999743
    already carries independently seeded endosome and plasma-membrane component
    IBDs plus the related GO:0070588 calcium ion transmembrane transport row, so
    it is a better target than Opisthokonta for any inherited Flower/CACFD1
    channel placement.
  proposed_action:
