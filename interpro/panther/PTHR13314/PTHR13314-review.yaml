family_id: PANTHER:PTHR13314
family_name: CALCIUM CHANNEL FLOWER HOMOLOG
preferred_name: TVP18/calcium-channel Flower family
summary: >-
  Small four-pass membrane proteins in the TVP18/calcium-channel Flower family.
  Ascomycete TVP18 proteins are Golgi membrane proteins inferred to participate
  broadly in vesicle-mediated transport, while metazoan Flower/CACFD1 proteins
  carry plasma membrane, endosomal, and calcium-transport annotations on
  descendant eumetazoan PAINT nodes.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The PTHR13314:SF2 subfamily contains both fungal Golgi TVP18 proteins with no
  demonstrated channel activity and metazoan Flower/CACFD1 proteins annotated
  to calcium channel activity, calcium ion transport, plasma membrane, and
  synaptic-vesicle/endocytic functions.
