family_id: PANTHER:PTHR38011
family_name: DIHYDROFOLATE REDUCTASE FAMILY PROTEIN (AFU_ORTHOLOGUE AFUA_8G06820)
preferred_name: RibD-type pyrimidine reductase (RIB7/PYRR) family
summary: >-
  NADPH-dependent reductases of the DHFR-like fold that reduce the ribosyl side chain of the riboflavin
  pyrimidine intermediate. Fungi have stand-alone reductases (S. cerevisiae RIB7, S. pombe SPBC21C3.10c),
  as do plants (PYRR). In bacterial RibD the reductase domain is fused to a CDA-fold deaminase.
functional_coherence: COHERENT
coherence_reason: >-
  All members carry the reductase activity; the deaminase activity belongs to a fused domain in bacterial
  RibD, not to this family.
