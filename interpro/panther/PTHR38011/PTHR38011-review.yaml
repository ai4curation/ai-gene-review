    gene_review: genes/PSEPK/ribD/ribD-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR38011:SF11
  label: 2,5-DIAMINO-6-RIBOSYLAMINO-4(3H)-PYRIMIDINONE 5'-PHOSPHATE REDUCTASE
  description: Bacillus YyaP-type reductases.
  representative_members:
