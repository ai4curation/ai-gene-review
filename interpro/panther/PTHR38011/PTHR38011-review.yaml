family_id: PANTHER:PTHR38011
family_name: DIHYDROFOLATE REDUCTASE FAMILY PROTEIN (AFU_ORTHOLOGUE AFUA_8G06820)
preferred_name: RibD-type pyrimidine reductase (RIB7/PYRR) family
summary: NADPH-dependent reductases of the DHFR-like fold that reduce the ribosyl side chain of the riboflavin
  pyrimidine intermediate. Fungi have stand-alone reductases (S. cerevisiae RIB7, S. pombe SPBC21C3.10c),
  as do plants (PYRR). In bacterial RibD the reductase domain is fused to a CDA-fold deaminase.
functional_coherence: COHERENT
coherence_reason: All members carry the reductase activity; the deaminase activity belongs to a fused
  domain in bacterial RibD, not to this family.
reference_protein:
  id: UniProtKB:P33312
  label: 2,5-diamino-6-ribosylamino-4(3H)-pyrimidinone 5'-phosphate reductase
  gene_symbol: RIB7
  organism: Saccharomyces cerevisiae
  gene_review: genes/yeast/RIB7/RIB7-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR38011:SF7
  label: 2,5-DIAMINO-6-RIBOSYLAMINO-4(3H)-PYRIMIDINONE 5'-PHOSPHATE REDUCTASE
  description: 'Mixed subfamily of 30 reviewed members: bifunctional bacterial RibD deaminase/reductases
    (14, including E. coli RibD and P. putida KT2440 RibD, whose N-terminal deaminase domain is fused
    to the reductase) and stand-alone fungal and plant pyrimidine reductases (RIB7, SPBC21C3.10c, PYRR)
    that lack the deaminase.'
  representative_members:
  - id: UniProtKB:P33312
    gene_symbol: RIB7
