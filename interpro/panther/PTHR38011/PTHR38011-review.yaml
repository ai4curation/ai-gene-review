  scope: FAMILY_WIDE
  scope_reason: Asserted by riboflavin_biosynthesis (SF7 for fungi); accepted by RIB7 and SPBC21C3.10c.
  supported_by:
  - reference_id: file:genes/yeast/RIB7/RIB7-ai-review.yaml
    supporting_text: Lv et al. 2013 purified recombinant Rib7, solved its structure with NADPH and assayed
- assessed_term:
    id: GO:0008835
    label: diaminohydroxyphosphoribosylaminopyrimidine deaminase activity
  scope: UNRESOLVED
  scope_reason: The deaminase activity belongs to the N-terminal cytidine deaminase-fold domain that bacterial
    RibD proteins fuse to the reductase domain this family describes. PANTHER classifies these whole bifunctional
    proteins in SF7 together with the stand-alone fungal and plant reductases, which lack the deaminase,
    so subfamily membership does not decide the activity. The PAINT node PTN002254009 (seeded by E. coli
    RibD) is sound for the bacterial RibD clade, but a member-level survey of SF7 to delimit that clade
    was not done; riboflavin_biosynthesis grounds the bacterial deaminase on the gene-reviewed P. putida
    RibD.
  supported_by:
  - reference_id: file:interpro/panther/PTHR38011/PTHR38011-paint.tsv
    supporting_text: "PTHR38011\tPTN002254009\tGO:0008835\tF\tIBD\tfalse"
  - reference_id: file:interpro/panther/PTHR38011/PTHR38011-entries.csv
    supporting_text: P37508,
  - reference_id: PMID:9068650
    supporting_text: code for bifunctional proteins catalyzing the second and third steps in the biosynthesis
      of riboflavin, i.e., the deamination of 2,5-diamino-6-ribosylamino-4(3H)-pyrimidinone 5'-phosphate
      (deaminase) and the subsequent reduction of the ribosyl side chain (reductase)
