notes: PMID17170116 assays KT2442 PhaZ; PMID41055782 also uses KT2442-derived constructs expressed in
  E. coli, with GPo1 supplying polymer. Q88D24 is the KT2440 reference and is supported by homolog/pathway/domain
  evidence, not relabeled as a directly assayed native KT2440 enzyme. Intracellular granule mobilization
  differs from secreted attack on extracellular polymer. All seven original raw PAINT assertions are represented
  without changing identifiers, seeds, dates or polarity. Some cached PAINT nodes are absent from the
  current family tree; missing topology is disclosed, not invented. No residue or subfamily discriminator
  is asserted.
