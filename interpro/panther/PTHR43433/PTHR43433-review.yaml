family_id: PANTHER:PTHR43433
family_name: HYDROLASE, ALPHA/BETA FOLD FAMILY PROTEIN
preferred_name: Diverse alpha/beta hydrolases including intracellular PhaZ
summary: A diverse alpha/beta-hydrolase family includes esterases, LipJ proteins bearing a separate cyclase
  domain, and intracellular PHA depolymerase relatives. KT2440 Q88D24 has the intracellular PHA-depolymerase
  signature and is assigned to SF5, which also contains unrelated substrate-specific hydrolases. Neither
  the family nor SF5 defines triacylglycerol, PHA, membrane, or secreted-polymer specificity.
functional_coherence: HETEROGENEOUS
coherence_reason: The shared hydrolase fold supports related catalytic architecture but substrate, pathway,
  additional domains and compartment differ. PhaZ chemistry is qualified by exact target/homolog evidence;
  LipJ cyclase activity belongs to an additional domain and is not a general hydrolase-family function.
