term_assessments:
- assessed_term:
    id: GO:0050527
    label: poly(3-hydroxyoctanoate) depolymerase activity
  scope: UNRESOLVED
  scope_reason: Intracellular mcl-PHA depolymerization is supported for the PhaZ lineage, including C8-rich
    polymer. Neither SF5 nor the whole family has this substrate specificity. PMID17170116 assays KT2442
    PhaZ; PMID41055782 also uses KT2442-derived constructs expressed in E. coli, with GPo1 supplying polymer.
    Q88D24 is the KT2440 reference and is supported by homolog/pathway/domain evidence, not relabeled
    as a directly assayed native KT2440 enzyme. Intracellular granule mobilization differs from secreted
    attack on extracellular polymer.
  supported_by:
  - *id001
  - *id002
- assessed_term:
    id: GO:0042620
    label: poly(3-hydroxyalkanoate) metabolic process
  scope: UNRESOLVED
  scope_reason: PhaZ performs polyester mobilization; LipG/LipJ and other hydrolase roles do not establish
    universal PHA metabolism. PMID17170116 assays KT2442 PhaZ; PMID41055782 also uses KT2442-derived constructs
    expressed in E. coli, with GPo1 supplying polymer. Q88D24 is the KT2440 reference and is supported
    by homolog/pathway/domain evidence, not relabeled as a directly assayed native KT2440 enzyme. Intracellular
    granule mobilization differs from secreted attack on extracellular polymer.
  supported_by:
  - *id001
- assessed_term:
    id: GO:0016787
    label: hydrolase activity
  scope: UNRESOLVED
  scope_reason: Positive hydrolysis is established in characterized branches, but this targeted review
    does not certify all family members. This is uncertainty about universal scope, not absence of hydrolase
    activity in the positive PhaZ/LipJ members.
  supported_by:
  - *id001
  - *id004
- assessed_term:
    id: GO:0004806
    label: triacylglycerol lipase activity
  scope: UNRESOLVED
  scope_reason: Triacylglycerol hydrolysis and hydroxyalkanoate-polyester hydrolysis use different substrates.
    The original LipG seed is retained; no negative PhaZ TAG assay or universal TAG grant follows from
    classification.
  supported_by:
  - *id001
- assessed_term:
    id: GO:0046503
    label: glycerolipid catabolic process
  scope: UNRESOLVED
  scope_reason: Glycerolipid catabolism is not synonymous with PHA turnover because PHA has no glycerol
    backbone. Actual secondary glycerolipid participation of every PhaZ relative remains unresolved.
  supported_by:
  - *id001
- assessed_term:
    id: GO:0016020
    label: membrane
  scope: UNRESOLVED
  scope_reason: Intracellular storage-granule association does not by itself establish lipid-bilayer membrane
    localization, and secreted polymer degradation is a different role.
  supported_by:
  - *id001
