family_id: PANTHER:PTHR36918
family_name: FAMILY NOT NAMED
functional_coherence: COHERENT
preferred_name: SecB protein-export chaperone family
summary: >-
  PTHR36918 contains SecB, a homotetrameric cytosolic chaperone of
  Proteobacteria. SecB binds a subset of newly made secretory precursors, keeps
  them unfolded and translocation-competent without using ATP, and delivers them
  to the SecA ATPase of the Sec translocase by binding SecA directly. All cached
  reviewed members fall in the single subfamily SF1. SecB occurs mainly in
  Proteobacteria and only sporadically in other lineages, so the
  SecB-dependent export route is lineage-restricted, unlike SecA and SecYEG.
  Some SecB-like proteins outside this core role act as chaperones of
  toxin-antitoxin systems; none is in the cached reviewed membership.
coherence_reason: >-
  The family has one subfamily (SF1, PROTEIN-EXPORT PROTEIN SECB) holding all
  368 cached reviewed members, and the reviewed members characterized
  experimentally (E. coli SecB) share the holdase and SecA-delivery role. The
  family name is unassigned in PANTHER ("FAMILY NOT NAMED"), so preferred_name
  gives the descriptive name.
