term_assessments:
  - assessed_term:
      id: GO:0140309
      label: unfolded protein holdase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      SecB holds precursors in an unfolded state without ATP and releases them
      to SecA. The activity is shown for E. coli SecB and the single subfamily
      has no known divergent branch in the cached membership. SecB-like
      toxin-antitoxin chaperones outside the cached set have not been assessed.
    supported_by:
      - reference_id: PMID:2848249
        supporting_text: The purified protein also quantitatively retarded folding of precursor MBP into a stable, protease-resistant conformation in the absence of membranes.
      - reference_id: PMID:27501151
        supporting_text: SecB is responsible for maintaining secretory proteins in an unfolded, secretion-competent state
  - assessed_term:
      id: GO:0043952
      label: protein transport by the Sec complex
    scope: FAMILY_WIDE
    scope_reason: The SecA-delivery role is the purpose of the holdase activity throughout the family.
    supported_by:
      - reference_id: PMID:25538690
        supporting_text: As stated above, SecB is usually found in proteobacteria.
notes: >-
  SecB is the only lineage-restricted carrier in the post-translational Sec
  export module: bacteria without SecB, such as Bacillus subtilis, deliver
  precursors to SecA without it. The family review records no member
  exceptions; SecB-like toxin-antitoxin chaperones (for example the
  Mycobacterium tuberculosis Rv1957 protein) are not in the cached reviewed
  membership and were not assessed.
