family_id: PANTHER:PTHR15039
family_name: DOLICHOL PHOSPHATE-MANNOSE BIOSYNTHESIS REGULATORY PROTEIN
preferred_name: DPM2, regulatory subunit of the three-subunit Dol-P-Man synthase
summary: >-
  Small (about 70-85 residues) two-pass endoplasmic-reticulum membrane proteins that form the
  regulatory subunit of the heterotrimeric dolichol-phosphate-mannose (Dol-P-Man) synthase,
  DPM1-DPM2-DPM3. DPM2 is non-catalytic: it stabilizes DPM3, which in turn tethers and
  stabilizes the soluble catalytic subunit DPM1, and it raises the activity of the enzyme. The
  family is present in animals, plants, Dictyostelium, Candida and fission yeast. It is absent
  from S. cerevisiae, whose Dol-P-Man synthase is a single membrane-anchored DPM1 polypeptide.
functional_coherence: COHERENT
coherence_reason: >-
  One orthology group: every reviewed member (8) is in SF11, and the only other subfamily (SF12)
  has the same name. All members are the DPM2 subunit of the same complex. Mammalian DPM2 also
  co-purifies with the GPI-GlcNAc transferase complex, a secondary association that the human
  review keeps as non-core and that is not asserted at family level.
