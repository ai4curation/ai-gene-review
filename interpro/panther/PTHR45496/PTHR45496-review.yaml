family_id: PANTHER:PTHR45496
family_name: CHAPERONE DNAJ-DOMAIN SUPERFAMILY PROTEIN
preferred_name: ADMETOS-related J-domain proteins
summary: The family includes plant ADMETOS-related proteins with a J domain. A J domain provides a potential
  chaperone-interaction module, but full-protein targeting and specialized biological functions require
  additional evidence.
functional_coherence: UNKNOWN
coherence_reason: The Abrus target has a J domain but this does not specify endoplasmic-reticulum residence.
