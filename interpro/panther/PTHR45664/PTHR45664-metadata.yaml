  name:
    name: Anterior-posterior axis specification homeobox
    short: Antp_homeobox
  description:
  - text: The Antp homeobox family is a group of sequence-specific transcription factors
      that play a crucial role in the developmental regulatory system, providing cells
      with specific positional identities along the anterior-posterior axis. Members
      of this family are involved in various developmental processes, including the
      differentiation of the dorsal-ventral pattern, pancreas development, and the
      patterning of hindbrain and pharyngeal arches. They are characterized by the
      presence of a homeodomain that mediates DNA-binding and protein-protein interactions,
      and some subfamilies also contain an Antp-type hexapeptide that facilitates
      heterodimerization with other proteins. The family includes proteins that are
      key regulators of hormone expression in the pancreas and are involved in the
      transcriptional activation of genes essential for pancreatic function.
