family_id: PANTHER:PTHR10907
family_name: REGUCALCIN
preferred_name: SMP-30/regucalcin family of six-bladed beta-propeller sugar-lactone lactonases
summary: >-
  Six-bladed beta-propeller, metal-dependent hydrolases of the SMP-30/gluconolactonase/LRE family.
  Vertebrate regucalcin (SMP-30) is the gluconolactonase of L-ascorbate biosynthesis in mammals that
  make vitamin C and has additional proposed roles in calcium signalling. Characterized bacterial and
  archaeal members are sugar-acid lactonases of pentose and sulfosugar catabolism: Caulobacter XylC
  (D-xylonolactone), Azospirillum AraB (L-arabinolactone), Haloferax XacC (pentonolactones) and the
  Pseudomonas putida SQ1 6-deoxy-6-sulfogluconolactonase of the sulfo-ED pathway. Yeast, Candida,
  archaeal and Bacillus members in the inventory are uncharacterized or only putative lactonases.
  The 21 SwissProt inventory members fall into SF47 (12: microbial lactonases plus fish and frog
  regucalcins) and SF54 (9: mammalian and avian regucalcins).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member hydrolyzes a sugar-acid 1,5- or 1,4-lactone, so carboxylic ester
  (lactone) hydrolase chemistry is shared, but the lactone substrate differs by lineage (gluconolactone
  for regucalcin, xylono-, arabino- and pentonolactones, and the sulfonated 6-deoxy-6-sulfogluconolactone
  for the sulfo-ED enzyme), and the vertebrate roles in ascorbate synthesis and calcium signalling do not
  apply to the microbial members.
