term_assessments:
- assessed_term:
    id: GO:0052689
    label: carboxylic ester hydrolase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Lactone hydrolysis is the activity shared by every characterized member: regucalcin
    (gluconolactone), XylC (D-xylonolactone), AraB (L-arabinolactone), XacC (pentonolactones) and the
    P. putida SQ1 enzyme (6-deoxy-6-sulfogluconolactone). The parent ester-hydrolase term is therefore
    the family-level function; the substrate-specific child must be set per member, which is why the
    sulfo-ED annoton uses this term and the gluconolactonase term is not transferred to P0DOV6.
  supported_by:
  - reference_id: file:genes/PSEPU/PpSQ1_00410/PpSQ1_00410-uniprot.txt
    supporting_text: Catalyzes the hydrolysis of 6-deoxy-6-sulfo-D-glucono-1,5-lactone to form 6-deoxy-6-sulfo-D-gluconate.
  - reference_id: file:interpro/panther/PTHR10907/PTHR10907-entries.csv
    supporting_text: Q1JUP5,L-arabinolactonase
  - reference_id: file:interpro/panther/PTHR10907/PTHR10907-entries.csv
    supporting_text: D4GP31,Pentonolactonase XacC
