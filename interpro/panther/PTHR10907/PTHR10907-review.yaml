    In the current PTHR10907 tree this node covers 72 of 96 leaves, all eukaryotic (vertebrates,
    insects, ticks, amphioxus, sea urchin, cnidarians, Dictyostelium and fungi including
    S. cerevisiae); no bacterial or archaeal leaf lies below it. The seeds are the three mammalian
