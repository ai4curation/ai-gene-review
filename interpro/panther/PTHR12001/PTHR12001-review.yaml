family_id: PANTHER:PTHR12001
family_name: GERANYLGERANYL PYROPHOSPHATE SYNTHASE
preferred_name: Trans-prenyltransferase family (GGPS, polyprenyl diphosphate synthases)
summary: >-
  Isoprenyl diphosphate synthases that extend allylic diphosphates with IPP to a set chain length.
  The family contains GGPP synthases (S. cerevisiae BTS1, human GGPS1), the long-chain polyprenyl
  diphosphate synthases that make the ubiquinone tail (S. cerevisiae COQ1, hexaprenyl; S. pombe dps1/dlp1
  and human PDSS1/PDSS2 heterodimers, decaprenyl; bacterial IspB, octaprenyl), and fungal secondary-metabolite
  prenyltransferases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Product chain length is set by subfamily: C20 (GGPS, SF44), C30-C50 (PDSS1-type SF69/SF78 and PDSS2-type
  SF55/SF84), and specialized secondary-metabolism enzymes (SF72, SF70).
