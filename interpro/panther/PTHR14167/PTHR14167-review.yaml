family_id: PANTHER:PTHR14167
family_name: SH3 DOMAIN-CONTAINING
preferred_name: Sh3 Domain-Containing
summary: SH3 DOMAIN-CONTAINING (PANTHER:PTHR14167) is characterized in PANTHER PAINT across 15 ancestral
  PTN node(s) (PANTHER:PTN000070016, PANTHER:PTN000070021, PANTHER:PTN000070286, PANTHER:PTN000070292
  (+11 more)) with 38 IBD node assertion(s) and 1 term(s) carrying negated IRD/IKR branch blocks, covering
  presynapse (GO:0098793, CC), glutamatergic synapse (GO:0098978, CC), dendrite (GO:0030425, CC), neuronal
  cell body (GO:0043025, CC) and 26 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR14167 (SH3 DOMAIN-CONTAINING) span 15 distinct ancestral
  PTN nodes (PANTHER:PTN000070016, PANTHER:PTN000070021, PANTHER:PTN000070286, PANTHER:PTN000070292, PANTHER:PTN000070315
  (+10 more)) with different molecular function assignments across clades (ubiquitin protein ligase activity
  (GO:0061630), signaling receptor complex adaptor activity (GO:0030159), protein-macromolecule adaptor
  activity (GO:0030674), protein phosphatase 1 binding (GO:0008157)), indicating clade-level functional
  specialization across the family.
