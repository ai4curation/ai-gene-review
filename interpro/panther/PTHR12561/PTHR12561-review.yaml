notes: The module annoton for the human LIPT1 step does not use this family or SF3 as its family term,
  because SF3 also contains ATP-dependent salvage ligases; LIPT1 is grounded as a representative member
  only. GO:7770091 lipoyl-GcvH:protein N-lipoyltransferase activity (current GO, not yet in the configured
  release) is the specific term for the LIPT1 reaction. Reference gene review human/LIPT1 is COMPLETE;
  E. coli lplA and B. subtilis lplJ are not reviewed here.
