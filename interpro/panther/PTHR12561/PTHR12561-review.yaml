family_id: PANTHER:PTHR12561
family_name: LIPOATE-PROTEIN LIGASE
preferred_name: LplA-type lipoate-protein ligases and LIPT1 lipoyl amidotransferases
summary: The family contains ATP-dependent lipoate-protein ligases of lipoate salvage (E. coli LplA, B.
  subtilis LplJ), which activate free lipoate as lipoyl-AMP and transfer it to lipoyl domains, and the
  mammalian mitochondrial LIPT1, which lacks the activating half-reaction and physiologically transfers
  mature lipoyl from lipoyl-GCSH to E2 subunits. Yeast Lip3 is a further member in the relay role. Shared
  fold, different physiological reactions.
functional_coherence: HETEROGENEOUS
coherence_reason: Within the single annotated subfamily SF3, E. coli LplA and B. subtilis LplJ are lipoate
  ligases (GO:0016979), while human LIPT1 is a lipoyl-GCSH amidotransferase that cannot activate lipoate
  and whose physiological donor is GCSH. Lipoyl-AMP transfer (GO:0017118) is the shared half-reaction,
  but for LIPT1 it is an in vitro activity of uncertain relevance.
