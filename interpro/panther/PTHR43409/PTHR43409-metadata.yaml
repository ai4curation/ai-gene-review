  name:
    name: Tetrapyrrole and Bacteriochlorophyll Biosynthesis Methyltransferases
    short: Tetrapyrrole_Bchl_Biosynth_MTs
  description:
  - text: The BchE and radical SAM superfamily proteins are involved in diverse biosynthetic
      pathways, including the formation of tetrapyrroles and bacteriochlorophylls,
      essential components for photosynthesis and light-harvesting in certain bacteria.
      The BchE family members catalyze the formation of the isocyclic E-ring in Mg-protoporphyrin
      monomethyl ester, leading to protochlorophyllide a, a precursor to chlorophyll.
      The radical SAM superfamily proteins perform methylation reactions, such as
      the methylation of hopanoids and the biosynthesis of bacteriochlorophyll c,
      which is crucial for green sulfur bacteria in low-light conditions. Other members
      are involved in antibiotic biosynthesis, fosfomycin production, and modification
      of other organic compounds, indicating a broad functional spectrum related to
      methylation processes.
