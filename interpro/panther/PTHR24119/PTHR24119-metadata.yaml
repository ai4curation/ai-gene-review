  name:
    name: Acyl-CoA-binding domain-containing protein
    short: ACBD
  description:
  - text: This family of proteins is involved in the intracellular binding and transport
      of acyl-CoA esters. Members exhibit a strong preference for binding unsaturated
      long-chain acyl-CoA molecules, particularly those with an 18:1 carbon chain.
      Some family members also show affinity, albeit lower, for 20:4 carbon chain
      unsaturated acyl-CoA and very weak affinity for saturated 16:0 acyl-CoA. These
      proteins do not interact with free fatty acids. Their binding properties suggest
      a role in lipid metabolism, such as modulation of sterol synthesis and phospholipid
      biosynthesis. They may also contribute to cellular responses to heavy metal
      stress by binding to lead ions. The family includes proteins that can interact
      with phospholipids like phosphatidic acid and phosphatidylcholine, indicating
      a potential role in membrane lipid composition and signaling.
