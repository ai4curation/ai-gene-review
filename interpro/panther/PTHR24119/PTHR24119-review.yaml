family_id: PANTHER:PTHR24119
family_name: ACYL-COA-BINDING DOMAIN-CONTAINING PROTEIN 6
preferred_name: Ankyrin-repeat acyl-CoA-binding proteins (ACBD6 and plant Class-II ACBP1/ACBP2)
summary: >-
  PANTHER family PTHR24119 unites eukaryotic acyl-CoA-binding proteins that pair an
  alpha-helical acyl-CoA-binding (ACB) domain (IPR000582) with C-terminal ankyrin (ANK)
  repeats (IPR002110), alongside several non-ACB ankyrin/repeat proteins recruited by
  C-terminal repeat similarity. Across Metazoa and Amoebozoa (within PTHR24119:SF0),
  orthologs such as human ACBD6, Drosophila Acbp-Ank (anox), and Caenorhabditis elegans
  ACBP-5 are soluble monomeric intracellular proteins lacking transmembrane segments that
  reside in the cytosol and nucleus. Their N-terminal ACB domain binds medium- and
  long-chain fatty-acyl-CoA thioesters (preferring unsaturated C18:1-CoA and C20:4-CoA
  over palmitoyl-CoA, without binding free fatty acids) and supplies acyl-CoA donors to
  lysophospholipid acyltransferases for membrane glycerophospholipid remodeling, while
  their C-terminal ANK-repeat module directly binds N-myristoyltransferases (NMT1 and
  NMT2) to stimulate protein N-myristoylation and shield the catalytic site from
  competitive palmitoyl-CoA inhibition—a dual carrier/activator mechanism conserved even
  in apicomplexan ACBD6 homologs. By contrast, land-plant Class-II ACBPs (Arabidopsis
  ACBP2 in PTHR24119:SF4, together with Arabidopsis ACBP1, Oryza ACBP4, and Populus
  homologs placed inside PTHR24119:SF0) acquired an N-terminal hydrophobic transmembrane
  domain that anchors them to the endoplasmic reticulum and plasma membrane, where they
  bind acyl-CoA esters and phospholipids and sequester membrane-associated protein
  partners via their C-terminal ANK repeats. Three small Dictyostelium subfamilies
  (PTHR24119:SF1, SF7, SF10) and isolated repeat-only entries in SF0 lack the ACB domain
  entirely and do not bind fatty-acyl-CoAs.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  PTHR24119 combines three architecturally and functionally distinct groups: (1) soluble
  cytosolic/nuclear eukaryotic ACBD6 orthologs (within PTHR24119:SF0, including metazoan
  ACBD6/anox/acbp-5 and Dictyostelium acbd6) that lack transmembrane helices and act as
  soluble fatty-acyl-CoA carriers and N-myristoyltransferase (NMT) allosteric activators;
  (2) land-plant Class-II membrane ACBPs (Arabidopsis ACBP2 in PTHR24119:SF4 plus
  Arabidopsis ACBP1, rice ACBP4, and Populus homologs inside PTHR24119:SF0) that carry an
  N-terminal signal-anchor transmembrane helix targeting them to the endoplasmic
  reticulum and plasma membrane; and (3) non-ACB repeat-containing outliers in
  Dictyostelium (PTHR24119:SF1, SF7, SF10, plus Q54ZJ0 and Q86H58 in SF0), Borreliella
  burgdorferi plasmid protein BB_B28 (O50999 in SF0), and an N-terminally truncated
  Xenopus laevis isoform (A0A1L8GMQ7 in SF0) that lack the IPR000582 ACB domain. Because
  PTHR24119:SF0 itself mixes soluble metazoan ACBD6 with transmembrane plant ACBP1 and
  ACB-less outliers, PAINT assertions at ancestral node PTN001191022 over-propagate plant
  ER and plasma-membrane localization onto soluble animal ACBD6 and over-propagate
  fatty-acyl-CoA binding and NMT activator activity onto ACB-less and plant membrane
  lineages.
