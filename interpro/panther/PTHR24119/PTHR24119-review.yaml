notes: >-
  PANTHER 19.0 PTHR24119:SF0 conflates soluble cytosolic/nuclear animal and amoebozoan
  ACBD6 orthologs with land-plant Class-II transmembrane ACBP1/OsACBP4 proteins (which
  belong functionally alongside Arabidopsis ACBP2 in PTHR24119:SF4) and four ACB-less
  domain-creep/truncated entries (O50999, A0A1L8GMQ7, Q54ZJ0, Q86H58). Note that human
  ACBD6 associates with host lipid droplets only upon Chlamydia trachomatis infection,
  when it is depleted from the nucleus and recruited into the bacterial inclusion lumen
  (PMID:25604091), and does not localize to peroxisomes (PMID:36551154, PMID:37951597).
