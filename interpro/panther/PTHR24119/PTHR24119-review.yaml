  assessment: TOO_DEEP
  assessment_reason: >-
    Endoplasmic reticulum localization at Eukaryota (PTN001191022) is seeded exclusively
    by the two Arabidopsis Class-II ACBPs, ACBP1 (AT5G53470, PTHR24119:SF0) and ACBP2
    (AT4G27780, PTHR24119:SF4), whose ER targeting strictly depends on a lineage-specific
    N-terminal transmembrane helix acquired in land plants; deleting that transmembrane
    segment abolishes membrane targeting (PMID:12650615). Soluble metazoan and amoebozoan
    ACBD6 orthologs in PTHR24119:SF0 (including human ACBD6, mouse/rat Acbd6, zebrafish
    acbd6, Drosophila anox, C. elegans acbp-5, and Dictyostelium acbd6) lack any
    transmembrane helix and localize to the cytosol and nucleus, while Dictyostelium
    subfamilies SF1, SF7, and SF10 are non-ACB domain-creep proteins with no ER evidence.
