- subfamily_id: PANTHER:PTHR24119:SF4
  label: ACYL-COA-BINDING DOMAIN-CONTAINING PROTEIN 2
  description: >-
    Land-plant Class-II membrane-anchored acyl-CoA-binding protein 2 clade typified by
    Arabidopsis thaliana ACBP2 (UniProtKB:Q9STP8), featuring an N-terminal transmembrane
    helix (residues 11-31) that targets the protein to the endoplasmic reticulum and
    plasma membrane, a conserved central ACB domain (residues 104-194) that binds
    long-chain unsaturated acyl-CoA esters and phosphatidylcholine/lysophosphatidylcholine,
    and C-terminal ankyrin repeats (residues 265-327) that bind membrane-associated
    stress-response partners such as LYSOPL2 and FP6.
  representative_members:
  - id: UniProtKB:Q9STP8
    label: Acyl-CoA-binding domain-containing protein 2
    gene_symbol: ACBP2
    organism: Arabidopsis thaliana
  diverged_from_family: true
  divergence_description: >-
    Unlike soluble cytosolic/nuclear metazoan ACBD6, SF4 members possess an N-terminal
    transmembrane domain required for endoplasmic reticulum and plasma-membrane targeting
    and mediate plant membrane lipid transfer and stress-partner tethering rather than
    soluble N-myristoyltransferase activation.
  supported_by:
  - reference_id: PMID:12650615
    supporting_text: By means of particle gene bombardment, ACBP2-GFP and ACBP1-GFP fusion proteins were observed transiently expressed at the plasma membrane and at the endoplasmic reticulum in onion epidermal cells. GFP fusions with deletion derivatives of ACBPI or ACBP2 lacking the transmembrane domain were impaired in membrane targeting.
  - reference_id: PMID:32265974
    supporting_text: Recombinant AtACBP2 has been observed to bind 18:1 phosphatidylcholine (PC) and 18:2 PC, lyso PC and several acyl-CoA esters (18:2 > 18:3 > 20:4∼16:0 > 18:1) in vitro (Chye et al., 2000; Chen et al., 2010; Gao et al., 2010).
