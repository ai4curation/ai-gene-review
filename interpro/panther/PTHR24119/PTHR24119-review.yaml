    supported_by:
    - reference_id: PMID:30642881
      supporting_text: Site-directed mutagenesis of conserved residues in the four α helices of ACBD6 identified two aromatic residues, Phe46 of αH1 and Tyr114 of αH4, whose substitution to alanine had the most influence in acyl-CoA binding ( 27 ).
  - term:
      id: GO:0008047
      label: enzyme activator activity
    strength: CONTRIBUTES
    rationale: >-
      Acyl-CoA occupancy of the ACB pocket via Tyr114 acts as a positive allosteric
      effector of the C-terminal ANK module; the Y114A mutant fails to stimulate NMT2
      catalysis in the presence of myristoyl-CoA.
    supported_by:
    - reference_id: PMID:26621918
      supporting_text: Compared with ACBD6, two ACBD6 mutant forms, Y 114 A and FKKY-AAAA (dubbed FKKY mut ), with defects in acyl-CoA binding ( 19 ) failed to stimulate the reaction in the presence of C 14 -CoA, thus acyl-CoA binding of ACBD6 is required for the stimulatory effect on NMT2.
