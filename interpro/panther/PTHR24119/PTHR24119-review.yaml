residue_sites:
- site_id: acb_tyr114_pocket
  label: ACB-domain helix-alpha4 acyl-CoA pocket Tyr114
  description: >-
    Invariant helix-alpha4 tyrosine of the acyl-CoA-binding (ACB) domain (Tyr114 in human
    ACBD6 Q9BR61, PDB:2COP; UniProt FT BINDING 114) whose aromatic side chain protrudes
    into the hydrophobic acyl-CoA binding cavity. Alanine substitution (Y114A) abolishes
    fatty-acyl-CoA binding and eliminates ligand-dependent allosteric stimulation of NMT2
    (PMID:26621918, PMID:30642881). Conserved across all ACB-bearing members of PTHR24119,
    both soluble metazoan/amoebozoan ACBD6 and transmembrane plant Class-II ACBP1/ACBP2.
