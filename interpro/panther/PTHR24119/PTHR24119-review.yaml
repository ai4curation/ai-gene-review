  description: >-
    Core subfamily containing soluble eukaryotic ACBD6 orthologs (metazoan ACBD6,
    Drosophila anox/Acbp-Ank, C. elegans acbp-5, and Dictyostelium acbd6 Q54GC8) that
    pair an N-terminal ACB domain with two C-terminal ankyrin repeats and function in the
    cytosol and nucleus as fatty-acyl-CoA carriers and NMT activators. However, PANTHER
    19.0 also groups land-plant Class-II transmembrane ACBP1 orthologs (Arabidopsis
    Q9SM23, Populus B9IDN1 and A0A2K1Y7F9, and InterPro-matched rice ACBP4 A3AYR1)—which
    possess an N-terminal ER/plasma-membrane transmembrane anchor—and several ACB-less
    repeat outliers (Dictyostelium Q54ZJ0 and Q86H58, truncated X. laevis isoform
    A0A1L8GMQ7, and InterPro-matched Borreliella burgdorferi BB_B28 O50999) inside SF0.
