family_id: PANTHER:PTHR43720
family_name: 2-AMINOMUCONIC SEMIALDEHYDE DEHYDROGENASE
preferred_name: ALDH8-like aldehyde dehydrogenases (2-aminomuconate/2-hydroxymuconate semialdehyde dehydrogenases and fungal Ald2/Ald3)
summary: >-
  PTHR43720 is a branch of the aldehyde dehydrogenase superfamily. Its NAD(P)+-dependent members oxidize
  different aldehydes in unrelated pathways. They include the vertebrate ALDH8A1 (2-aminomuconic
  semialdehyde dehydrogenase of tryptophan catabolism, which also acts as a retinal dehydrogenase) and
  bacterial meta-cleavage pathway semialdehyde dehydrogenases (2-hydroxymuconic semialdehyde
  dehydrogenase DmpC/XylG, 5-carboxymethyl-2-hydroxymuconate semialdehyde dehydrogenase HpcC,
  2-aminomuconic 6-semialdehyde dehydrogenase AmnC). They also include the tandem cytosolic aldehyde
  dehydrogenases Ald2 and Ald3 of Saccharomyces cerevisiae. Ald2 and Ald3 oxidize 3-aminopropanal,
  produced by Fms1 oxidation of spermine, to beta-alanine for pantothenate and CoA synthesis. The
  family name reflects only the ALDH8A1 and AmnC members. Function is set by lineage, not by the family.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The parsed entries file holds 11 reviewed entries, all in PTHR43720:SF2; SF3 has no reviewed member.
  Among them are four vertebrate ALDH8A1 orthologues, two 2-hydroxymuconic semialdehyde dehydrogenases,
  one 5-carboxymethyl-2-hydroxymuconate semialdehyde dehydrogenase, one 2-aminomuconic 6-semialdehyde
  dehydrogenase, yeast ALD2 and ALD3, and an S. pombe putative aldehyde dehydrogenase-like protein. The
  shared activity is generic NAD(P)+-dependent aldehyde oxidation. The substrates and pathways differ
  between the vertebrate, bacterial and fungal branches.
