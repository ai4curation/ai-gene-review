  name:
    name: Aldehyde dehydrogenase
    short: ALDH
  description:
  - text: This family of proteins includes enzymes that catalyze the NAD-dependent
      oxidation of various aldehyde substrates. Members are involved in distinct metabolic
      pathways, such as the kynurenine pathway of L-tryptophan degradation, the modified
      meta-cleavage pathway for 2-aminophenol catabolism, and the catabolism of 4-hydroxyphenylacetate.
      These enzymes also contribute to the biosynthesis of pantothenic acid (vitamin
      B5) and coenzyme A (CoA) by converting 3-aminopropanal to beta-alanine. Some
      family members can oxidize a range of aldehydes including acetaldehyde, propionaldehyde,
      and butyraldehyde. The activity of these enzymes is subject to inhibition by
      various agents, indicating a regulatory aspect in their function.
