    gene_symbol: glgA
    organism: Pseudomonas aeruginosa PAO1
    gene_review: genes/PSEAE/glgA/glgA-ai-review.yaml
  - id: UniProtKB:Q88FN9
    gene_symbol: glgA
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/glgA/glgA-ai-review.yaml
  diverged_from_family: false
