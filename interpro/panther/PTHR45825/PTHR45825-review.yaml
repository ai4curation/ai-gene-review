family_id: PANTHER:PTHR45825
family_name: GRANULE-BOUND STARCH SYNTHASE 1, CHLOROPLASTIC/AMYLOPLASTIC
preferred_name: Glycogen/starch synthase (GT-B, glycosyltransferase family 1/5) family
summary: >-
  Retaining GT-B glycosyltransferases that elongate alpha-1,4-glucan chains by
  transferring a glucosyl unit from a nucleotide-sugar donor to the non-reducing
  end of a growing glucan. The family contains the bacterial glycogen synthases
  (GlgA) and the plant plastidial starch synthases (soluble and granule-bound).
  Most members, including the canonical enterobacterial E. coli GlgA and the
  plant enzymes, use ADP-glucose as donor (EC 2.4.1.21). The Pseudomonas GlgA
  subfamily has diverged: because Pseudomonas spp. lack the glgC ADP-glucose
  pyrophosphorylase, purified P. aeruginosa GlgA preferentially uses UDP-glucose
  (EC 2.4.1.-) to make linear alpha-glucan. The plant members are plastidial and
  build amylose/amylopectin, whereas the bacterial members are cytosolic and
  build glycogen.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are alpha-1,4-glucan synthases of the GT-B fold, but the
  nucleotide-sugar donor and the product/compartment vary: enterobacterial GlgA
  and plant starch synthases use ADP-glucose, while the Pseudomonas GlgA
  subfamily (PTHR45825:SF8) diverged to a UDP-glucose donor. The ADP-glucose
  donor term must therefore not descend family-wide to the Pseudomonas clade.
