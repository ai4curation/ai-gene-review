term_assessments:
- assessed_term:
    id: GO:0009011
    label: alpha-1,4-glucan glucosyltransferase (ADP-glucose donor) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    ADP-glucose donor activity is the module's canonical route and is grounded on
    the enterobacterial ADP-glucose glycogen synthases (SF11, e.g. E. coli GlgA).
    It is scoped to SF11 here to keep it clear of the SF8 clade, whose assayed
    Pseudomonas members (Q9I1V0, Q88FN9) diverged to UDP-glucose and remove this
    term at the member level; the ADP-glucose node itself remains sound
    family-wide (see the PTN000282962 node assessment).
  applicable_subfamilies:
  - id: PANTHER:PTHR45825:SF11
    label: ALPHA AMYLASE DOMAIN-CONTAINING PROTEIN
  supported_by:
  - reference_id: file:interpro/panther/PTHR45825/PTHR45825-paint.tsv
    supporting_text: "PTHR45825\tPTN000282962\tGO:0009011\tF\tIBD\tfalse"
  - reference_id: file:genes/ECOLI/glgA/glgA-ai-review.yaml
    supporting_text: "Synthesizes alpha-1,4-glucan chains using ADP-glucose."
- assessed_term:
    id: GO:0004373
    label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
  scope: UNRESOLVED
  scope_reason: >-
    UDP-glucose donor activity is directly established only for the assayed
    Pseudomonas members of SF8 (Q9I1V0, Q88FN9; purified PAO1 GlgA prefers
    UDP-glucose and those Pseudomonas spp. lack glgC). It is not PAINT-propagated,
    and SF8 is taxonomically heterogeneous (Xanthomonas, Paracidovorax,
    Bradyrhizobium) with glgC present in at least Paracidovorax and
    Bradyrhizobium, so the term cannot be certified subfamily-wide and must not
    descend to the ADP-glucose (SF11/plant) members. The module grounds the
    UDP route on the two Pseudomonas gene reviews at the member level rather than
    on a subfamily-wide family claim.
  supported_by:
  - reference_id: file:genes/PSEAE/glgA/glgA-ai-review.yaml
    supporting_text: "The highest polymerase activity was with UDP-glucose, as expected given the lack of the glgC gene coding for the enzyme responsible for the production of ADP-glucose in Pseudomonas spp."
