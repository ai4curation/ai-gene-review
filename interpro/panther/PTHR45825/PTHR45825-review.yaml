  - id: AGI_LocusCode:AT3G01180
  - id: AGI_LocusCode:AT5G24300
  assessment: SOUND
  assessment_reason: >-
    The ADP-glucose donor activity is the ancestral, correctly placed function of
    this node: it holds for the enterobacterial members (E. coli GlgA, P0A6U8
    ACCEPT), the plant starch synthases, and the non-Pseudomonas SF8 members,
    which are not glgC-negative (Bradyrhizobium Q89RJ4 and Paracidovorax A1TRG5
    carry glgC; see PTHR43523 Q89G87, A1TRG1). The assayed Pseudomonas SF8
    members (Q9I1V0, Q88FN9) diverged to a UDP-glucose donor and carry
    member-level REMOVE on this term; that divergence is finer than any PANTHER
    subfamily, so it is handled per member rather than by pruning the SF8 branch
    (which would wrongly strip ADP-glucose from the glgC-positive members).
