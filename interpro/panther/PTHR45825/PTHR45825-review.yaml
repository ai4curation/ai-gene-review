family_id: PANTHER:PTHR45825
family_name: GRANULE-BOUND STARCH SYNTHASE 1, CHLOROPLASTIC/AMYLOPLASTIC
preferred_name: Glycogen/starch synthase (GT-B, glycosyltransferase family 1/5) family
summary: >-
  Retaining GT-B glycosyltransferases that elongate alpha-1,4-glucan chains by
  transferring a glucosyl unit from a nucleotide-sugar donor to the non-reducing
  end of a growing glucan. The family contains the bacterial glycogen synthases
  (GlgA) and the plant plastidial starch synthases (soluble and granule-bound).
  Most members, including the canonical enterobacterial E. coli GlgA and the
  plant enzymes, use ADP-glucose as donor (EC 2.4.1.21). The experimentally
  characterized Pseudomonas members have diverged: because those Pseudomonas spp.
  lack a glgC ADP-glucose pyrophosphorylase, purified P. aeruginosa GlgA
  preferentially uses UDP-glucose (EC 2.4.1.-) to make linear alpha-glucan. This
  UDP-glucose divergence is established only for the assayed Pseudomonas enzymes,
  not for the SF8 subfamily as a whole, which also contains Xanthomonas,
  Paracidovorax and Bradyrhizobium members (at least Paracidovorax and
  Bradyrhizobium carry glgC). The plant members are plastidial and build
  amylose/amylopectin, whereas the bacterial members are cytosolic and build
  glycogen.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are alpha-1,4-glucan synthases of the GT-B fold, but the
  nucleotide-sugar donor and the product/compartment vary. Enterobacterial GlgA
  (SF11) and the plant starch synthases use ADP-glucose; the experimentally
  characterized Pseudomonas members of SF8 (Q9I1V0, Q88FN9) diverged to a
  UDP-glucose donor. SF8 is taxonomically heterogeneous (Pseudomonas,
  Xanthomonas, Paracidovorax, Bradyrhizobium) and not uniformly glgC-negative, so
  the donor divergence is a member-level finding rather than a subfamily-wide
  property.
