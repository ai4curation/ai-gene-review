  diverged_from_family: false
- subfamily_id: PANTHER:PTHR45825:SF8
  label: GLYCOGEN SYNTHASE
  description: >-
    Taxonomically mixed clade of bacterial glycogen/alpha-glucan synthases
    (Pseudomonas, Xanthomonas, Paracidovorax, Bradyrhizobium). The assayed
    Pseudomonas members (Q9I1V0, Q88FN9), which lack glgC, diverged to a
    UDP-glucose donor; the donor of the non-Pseudomonas members is not
    established and at least Paracidovorax (A1TRG5) and Bradyrhizobium (Q89RJ4)
    have a glgC ADP-glucose source (PTHR43523 A1TRG1, Q89G87).
  representative_members:
