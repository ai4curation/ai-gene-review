family_id: PANTHER:PTHR14440
family_name: DNA-DIRECTED RNA POLYMERASE I SUBUNIT RPA49
preferred_name: Rpa49 RNA polymerase I accessory subunits
summary: Rpa49 is an accessory subunit of RNA polymerase I that supports efficient ribosomal DNA transcription.
  The polymerase can retain activity when Rpa49 is deleted, indicating a stimulatory and organizational
  role rather than independent RNA polymerase catalysis. Its conserved function is linked to the specialized
  rRNA transcription machinery.
functional_coherence: COHERENT
coherence_reason: All six inspected inventory entries identify RPA49. Curated IPR009668 reports retained
  Pol I activity after A49 deletion but reduced transcriptional efficiency, supporting an accessory transcription
  role. This is compatible with participation in the Pol I complex and rRNA synthesis; it does not establish
  an independent RNA polymerase catalytic center in Rpa49.
