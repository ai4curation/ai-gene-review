  assessment_reason: >-
    The galactokinases of every lineage take part in galactose metabolism, and the reviewed
    recipients retain the IBA. But the process at the root also descends to the two plant
    branches that phosphorylate other sugars: the arabinokinase clade (PTN000048532) and the
    galacturonokinase clade, where the IRD at PTN004160598 removes only the molecular function and
    leaves this process. Neither branch is known to act on galactose, so both need a process loss
    row.
