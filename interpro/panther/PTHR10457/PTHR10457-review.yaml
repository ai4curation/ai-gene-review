  assessment_reason: >-
    Root placement (LUCA, 297 leaves) is defensible: the seeds are galactokinases from bacteria
    (E. coli GalK), fungi, animals (GALK1) and plants (At3g06580), and the reviewed GalK, GAL1,
    gal1 and GALK1 recipients retain the IBA. The land-plant galacturonokinase clade is already
    pruned by the IRD at PTN004160598. The flowering-plant arabinokinase clade (PTN000048532: SF35,
    SF12, SF24, SF34; 60 leaves) is not: it carries its own L-arabinokinase IBD, plants phosphorylate
    arabinose and galactose with separate substrate-specific kinases, and no galactokinase activity
    is recorded for ARA1, yet with no loss row it inherits galactokinase activity. A NOT row at
    PTN000048532 is needed. S. cerevisiae GAL3, the non-catalytic sensor in SF7, is handled as a
    member exception below.
