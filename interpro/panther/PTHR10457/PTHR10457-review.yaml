family_id: PANTHER:PTHR10457
family_name: MEVALONATE KINASE/GALACTOKINASE
preferred_name: GHMP galactokinase family (GalK/GALK1/GAL1)
summary: >-
  GHMP-kinase family enzymes that phosphorylate sugars. Most members are galactokinases (SF7), which
  make galactose 1-phosphate in the Leloir pathway: bacterial GalK, S. cerevisiae GAL1, S. pombe
  gal1 and human GALK1. SF7 also contains S. cerevisiae GAL3, a catalytically inactive paralog that
  acts as the galactose sensor of the GAL switch. Smaller subfamilies are a heptose 7-phosphate kinase
  (SF9) and plant galacturonokinase (SF6).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Galactokinase activity holds across SF7 except for the non-catalytic GAL3 sensor. SF9 and SF6 phosphorylate
  other sugars.
