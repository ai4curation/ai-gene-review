    Flowering-plant L-arabinokinases (Arabidopsis ARA1 At4g16130 and ARA2 At3g42850), which
    phosphorylate free L-arabinose for UDP-arabinose salvage. With the small SF12, SF24 and SF34
    subfamilies they form the clade below PTN000048532.
  representative_members:
