family_id: PANTHER:PTHR10534
family_name: PYRIDOXAL KINASE
preferred_name: Pyridoxal kinase (PdxK/PdxY/PDXK) family
summary: >-
  Ribokinase-fold kinases that phosphorylate pyridoxal, pyridoxine and pyridoxamine to their 5'-phosphates
  in the vitamin B6 salvage pathway. The family contains bacterial PdxK (SF15) and PdxY (SF2), human
  PDXK, S. cerevisiae BUD16, the S. pombe paralogs SPCC18.10 and SPAC6F6.11c, and S. cerevisiae BUD17.
functional_coherence: COHERENT
coherence_reason: >-
  Pyridoxal kinase activity is shared; PdxK (SF15) also phosphorylates pyridoxine and pyridoxamine
  efficiently.
