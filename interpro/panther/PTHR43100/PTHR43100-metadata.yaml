  name:
    name: Glutamate Synthase
    short: Glutamate_Synthase
  description:
  - text: The glutamate synthase family is involved in the biosynthesis of glutamate,
      a critical amino acid for protein synthesis and a key metabolite in nitrogen
      metabolism. Members of this family are responsible for the conversion of L-glutamine
      and 2-oxoglutarate to L-glutamate, which is an alternative pathway to the one
      catalyzed by L-glutamate dehydrogenase. In plants, these enzymes play a significant
      role in the assimilation of ammonium, particularly in non-photorespiratory conditions
      and in the assimilation of symbiotically fixed nitrogen into amino acids in
      root nodules. Some family members are specific for NADH, while others utilize
      NADPH as an electron donor. The activity of these enzymes can be regulated by
      various metabolites and conditions, indicating their importance in the cellular
      nitrogen and carbon balance.
