  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Rule shared with PTHR42783: the scope covers only subfamilies with a characterized NAD(P)H-oxidising
    member. The FAD/NAD(P)-binding module that oxidises NADPH (bacterial small chains) or NADH (eukaryotic
    single-chain GOGATs) defines SF1, the subfamily holding every characterized member. SF2 and SF3 keep the
    domain but have no characterized member, so they are left out. This is the partial activity the module assigns to B. subtilis GltB.
