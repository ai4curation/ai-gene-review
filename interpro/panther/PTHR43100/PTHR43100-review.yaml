family_id: PANTHER:PTHR43100
family_name: GLUTAMATE SYNTHASE [NADPH] SMALL CHAIN
preferred_name: Gram-positive/actinobacterial GOGAT small chain and eukaryotic NADH-GOGAT
summary: >-
  Family defined by the GOGAT small-chain module (Fe-S binding domain plus FAD/NAD(P)-binding domain)
  of the Firmicutes and Actinobacteria type. Bacterial members are stand-alone small chains, such as
  Bacillus subtilis GltB (O34399) and Mycobacterium tuberculosis GltD, which pair with a PTHR11938
  large chain (B. subtilis GltA) to form NADPH-dependent glutamate synthase; the small chain supplies the
  NADPH-oxidising electron input. UniProt's PANTHER assignment also places the full-length single-chain
  eukaryotic NADH-GOGATs here (yeast GLT1, fission yeast glt1, plant NADH-GOGATs), in which the same
  module is fused C-terminal to the large-chain region. PANTHER's own classification files put those
  eukaryotic enzymes in PTHR11938:SF133, which is why only PTHR11938 tree nodes appear in this family's
  PAINT slice.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  No assessed term is safe family-wide. Every characterized member is the NAD(P)H-oxidising electron-input
  part of a glutamate synthase, but the members differ in form and donor: bacterial stand-alone NADPH-linked small chains that act only in a
  two-chain enzyme, and eukaryotic single-polypeptide NADH-specific enzymes that perform the full reaction.
  Subfamilies SF2 (BNAA03G19380D PROTEIN) and SF3 (FAD_NAD(P)-BINDING DOMAIN-CONTAINING PROTEIN) have no
  characterized member in the cached sources.
