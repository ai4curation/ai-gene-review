notes: >-
  No PAINT node of the PTHR43100 tree itself carries an annotation. All four rows in the PAINT slice come
  from PTHR11938 nodes, reached through yeast GLT1, fission yeast glt1 and rice Q0JKD0, for which the
  PANTHER classification files and UniProt disagree (PTHR11938:SF133 against PTHR43100:SF1; the member
  index keeps both). The B. subtilis and M. tuberculosis small chains therefore receive no IBA from these
  nodes. The PAINT slice was fetched with just fetch-panther-paint PTHR43100 for this review.
