  name:
    name: Glycosyltransferase Group 1
    short: Glycosyltransferase_Grp1
  description:
  - text: The glycosyltransferase group 1 family is involved in various biosynthetic
      processes, including the synthesis of mannosylglucosylglycerate, the biosynthesis
      of lipopolysaccharide (LPS) O-antigen regions, and the formation of N-glycans
      under specific conditions. Members of this family function as mannosyltransferases,
      hexosyltransferases, and other types of glycosyltransferases, catalyzing the
      transfer of sugar moieties from activated donor molecules to specific acceptor
      molecules, forming glycosidic bonds. They play roles in the polymerization of
      sugar repeat units, contributing to the structural diversity and function of
      polysaccharides in bacterial cell surfaces. Some proteins within the family
      possess multiple domains with distinct glycosyltransferase activities, which
      are regulated to achieve precise control over polysaccharide chain length and
      composition.
