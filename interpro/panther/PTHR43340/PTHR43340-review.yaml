family_id: PANTHER:PTHR43340
family_name: HYPOXANTHINE-GUANINE PHOSPHORIBOSYLTRANSFERASE
preferred_name: Hypoxanthine-guanine phosphoribosyltransferase (HPRT1) family
summary: >-
  Type I PRTases of the animal HGPRT (HPRT1) and bacterial Hpt lineages that salvage hypoxanthine
  and guanine to IMP and GMP. SF5 holds PRTFDC1, a weakly active HPRT paralog.
functional_coherence: MOSTLY_COHERENT
coherence_reason: SF6/SF11 are HGPRT and SF1 is bacterial Hpt; SF5 (PRTFDC1) has much lower activity.
