family_id: PANTHER:PTHR30023
family_name: D-ALANYL-D-ALANINE CARBOXYPEPTIDASE
preferred_name: Peptidase S13 penicillin-binding protein 4 (DacB/PBP4) family
summary: >-
  Peptidase S13 low-molecular-mass penicillin-binding proteins of the PBP4 type.
  Members carry the SXXK, SXN and KTG active-site motifs of penicillin-recognizing
  serine D,D-peptidases, with an extra domain inserted between the SXXK and SXN
  elements. Characterized bacterial members are penicillin-sensitive
  D,D-carboxypeptidases that remove the terminal D-alanine of peptidoglycan
  pentapeptide stems; E. coli and P. aeruginosa PBP4 are in addition D,D- (4,3-)
  endopeptidases that cleave D-Ala-mDAP crosslinks. The family also contains a
  eukaryotic member, Dictyostelium PscA, which is a penicillin-sensitive
  carboxypeptidase of unknown substrate in an organism without a peptidoglycan
  wall. PANTHER defines a
  single subfamily (SF0).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member is a penicillin-sensitive serine carboxypeptidase,
  so serine-type carboxypeptidase activity is family-wide. The more specific
  peptidoglycan activities are bacterial: D-Ala-D-Ala carboxypeptidase and
  D,D-endopeptidase activity on peptidoglycan are shown for the Gram-negative PBP4
  enzymes (E. coli, P. aeruginosa), whereas the substrate of the eukaryotic
  member PscA is unknown and its organism has no peptidoglycan. PANTHER does not
  separate these clades into subfamilies, so neither peptidoglycan activity nor
  the peptidoglycan process can be extended to the whole family.
