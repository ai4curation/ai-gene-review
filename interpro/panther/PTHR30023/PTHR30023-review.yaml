node_assessments:
- node_id: PANTHER:PTN000768632
  asserted_term:
    id: GO:0004185
    label: serine-type carboxypeptidase activity
  evidence: IBD
  paint_snapshot: '20190822'
  seeds:
  - id: UniProtKB:P24228
  - id: UniProtKB:Q9HZG1
  - id: dictyBase:DDB_G0271902
  assessment: SOUND
  assessment_reason: >-
    The three seeds (E. coli PBP4, P. aeruginosa PBP4 and Dictyostelium PscA) are
    all experimentally penicillin-sensitive carboxypeptidases, so placing the
    activity at a node above both bacterial and eukaryotic members is sound. The
    asserted term is the general parent; the reviewed recipients refine it to
    GO:0009002 serine-type D-Ala-D-Ala carboxypeptidase activity, which is a
    granularity change, not a node-placement problem.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30023/PTHR30023-paint.tsv
    supporting_text: "PTHR30023\tPTN000768632\tGO:0004185\tF\tIBD\tfalse"
  - reference_id: PMID:2046551
    supporting_text: >-
      PBP4 is not involved in transpeptidation but exclusively catalyses a
      DD-carboxypeptidase and DD-endopeptidase reaction.
  - reference_id: PMID:12843630
    supporting_text: >-
      The gene product prepared in the cell-free translation system showed
      carboxypeptidase activity but the activity was not detected in the presence
      of penicillin G.
- node_id: PANTHER:PTN000768632
  asserted_term:
    id: GO:0000270
    label: peptidoglycan metabolic process
  evidence: IBD
  paint_snapshot: '20211112'
  seeds:
  - id: UniProtKB:P24228
  - id: UniProtKB:Q9HZG1
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Sound for the bacterial recipients (both seeds hydrolyse peptidoglycan stem
    peptides, and the KT2440 ortholog accepts the term), but the node also covers
    Dictyostelium PscA, and D. discoideum has no peptidoglycan wall, so the
    process cannot hold for that branch. PscA should be excluded (an IRD at the
    eukaryotic branch); because PANTHER has a single subfamily, no subfamily is
    listed as affected.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30023/PTHR30023-paint.tsv
    supporting_text: "PTHR30023\tPTN000768632\tGO:0000270\tP\tIBD\tfalse"
  - reference_id: PMID:25495032
    supporting_text: >-
      These data demonstrate that PBP4 has dual dd-carboxypeptidase and
      4,3-endopeptidase activities with respect to the stem peptide of the
      sacculus.
  - reference_id: PMID:12843630
    supporting_text: >-
      These results demonstrate that the D. discoideum gene encodes a eukaryotic
      form of penicillin-sensitive carboxypeptidase.
term_assessments:
- assessed_term:
    id: GO:0004185
    label: serine-type carboxypeptidase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Penicillin-sensitive serine carboxypeptidase activity is shown on both
    branches of the family: for the bacterial PBP4 enzymes of E. coli and
    P. aeruginosa and for Dictyostelium PscA, and the SXXK, SXN and KTG
    active-site motifs are conserved. This is the term the PAINT node asserts
    and the one that spans the whole family.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30023/PTHR30023-paint.tsv
    supporting_text: "PTHR30023\tPTN000768632\tGO:0004185\tF\tIBD\tfalse"
  - reference_id: PMID:331322
    supporting_text: >-
      The dacB mutation results in the simultaneous loss of D-alanine
      carboxypeptidase and penicillin-binding protein 4.
  - reference_id: PMID:12843630
    supporting_text: >-
      The gene product prepared in the cell-free translation system showed
      carboxypeptidase activity but the activity was not detected in the presence
      of penicillin G.
- assessed_term:
    id: GO:0009002
    label: serine-type D-Ala-D-Ala carboxypeptidase activity
  scope: UNRESOLVED
  scope_reason: >-
    D-Ala-D-Ala carboxypeptidase activity on peptidoglycan stems is a bacterial
    claim. It is shown experimentally for E. coli PBP4 and P. aeruginosa PBP4,
    and the catalytic SXXK, SXN and KTG motifs are conserved in the bacterial
    members, but the substrate of Dictyostelium PscA is unknown (its organism has
    no peptidoglycan, and the carboxypeptidase activity reported for it names no
    substrate). PANTHER has a single subfamily (SF0) that contains PscA, so no
    subfamily isolates the bacterial clade and the term cannot be scoped
    FAMILY_WIDE or SUBFAMILY_ONLY. Resolving it needs the substrate specificity of
    PscA, or a clade split that separates the eukaryotic branch.
  supported_by:
  - reference_id: PMID:331322
    supporting_text: >-
      The dacB mutation results in the simultaneous loss of D-alanine
      carboxypeptidase and penicillin-binding protein 4.
  - reference_id: PMID:25495032
    supporting_text: >-
      The dd-carboxypeptidase activity of PBP4 turns over the pentapeptide stem
      to give the tetrapeptide derivative.
  - reference_id: PMID:12843630
    supporting_text: >-
      The D. discoideum protein conserves three consensus sequences (SXXK, SXN and
      KTG) that are responsible for the catalytic activities of PBPs.
- assessed_term:
    id: GO:0061785
    label: peptidoglycan endopeptidase activity
  scope: UNRESOLVED
  scope_reason: >-
    D,D-endopeptidase (4,3-crosslink) activity is experimentally established for
    the Gram-negative PBP4 enzymes of E. coli and P. aeruginosa, and the KT2440
    ortholog inherits it by close orthology. It cannot be family-wide because
    Dictyostelium PscA has no peptidoglycan substrate, and endopeptidase assays
    are missing for the Bacillus and actinobacterial members; PANTHER has no
    subfamily that isolates the Gram-negative PBP4 clade. Resolving the scope
    needs endopeptidase assays on B. subtilis DacC and mycobacterial DacB, or a
    finer clade split (NCBIfam TIGR00666 covers PscA as well and does not
    separate it).
  supported_by:
  - reference_id: PMID:2046551
    supporting_text: >-
      PBP4 is not involved in transpeptidation but exclusively catalyses a
      DD-carboxypeptidase and DD-endopeptidase reaction.
  - reference_id: PMID:25495032
    supporting_text: >-
      The endopeptidase activity is specific to hydrolysis of 4,3-cross-linked
      peptidoglycan.
