- assessed_term:
    id: GO:0001580
    label: detection of chemical stimulus involved in sensory perception of bitter taste
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Bitter taste transduction is the function of gustducin (GNAT3, SF66): mice lacking
    alpha-gustducin have reduced behavioural and electrophysiological responses to bitter
    compounds. The evidence offered for cone transducin is a heterologous-cell experiment
    with Galpha16 chimeras carrying the GNAT2 C-terminus, which the authors interpret only
    as a possibility; the GNAT1 and GNAT2 reviews mark their taste rows over-annotated. A
    1995 in vitro study found rod transducin in taste tissue activated by denatonium-treated
    taste membranes, but no in vivo study shows either photoreceptor transducin is needed
    for bitter taste, so neither transducin subfamily is listed.
