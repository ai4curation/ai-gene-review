notes: >-
  Node assessments cover the PAINT rows on the lineage of the two transducins (the root
  node, PTN002566486 and PTN002566474) and the two IRD rows. PAINT rows on the lineages of
  the other reviewed members (PTN000026396, PTN000026844, PTN002566494, PTN002566506,
  PTN008303190, PTN008496048) and PTN000026546, PTN000026689, PTN000026754, PTN000026798,
  PTN000812000, PTN000812099, PTN002566438 were not assessed. The genes/human/GNAS review
  is of NESP55 (O95467), not of Gs alpha, so the Gs branch has no gene review here. The
  PANTHER tree and alignment could not be inspected, so no loss node is named for the
  transducin clade.
