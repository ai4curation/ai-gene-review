- assessed_term:
    id: GO:0007188
    label: adenylate cyclase-modulating G protein-coupled receptor signaling pathway
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Adenylyl cyclase is a direct effector of the Gs branch (stimulation at site 1, which
    Golf shares in olfactory cilia) and of the Gi/o branch (inhibition of types I, V and
    VI at site 2). Gq-coupled receptors augment Gs-stimulated type II adenylyl cyclase
    through protein kinase C, so the Gq/11 subfamilies take part in the pathway
    indirectly, which is the basis on which the GNA11 and GNA14 reviews keep the IBA as
    non-core. The transducins do not act through adenylyl cyclase: their effector is the
    rod or cone cGMP phosphodiesterase PDE6, and no study shows transducin modulating a
    cyclase physiologically (its only appearance in cyclase experiments is as an
    exogenous beta-gamma sink). The term must therefore not descend into the transducin
    subfamilies SF67 and SF68, which is why both transducin reviews REMOVE the root IBA;
    gustducin (SF66) also couples to a phosphodiesterase and is likely excluded, but has no
    review here. Dictyostelium Galpha2 (gpaB, SF351), which couples the cAMP
    chemoattractant receptor during aggregation, is a seed of the root IBD and its review
    accepts the term, so SF351 is listed. The other listed subfamilies are the vertebrate
    ones the evidence supports;
    G12/13 (SF130, SF85), Gz (SF65), Galpha15 (SF217) and the invertebrate, fungal,
    amoebozoan and plant subfamilies are not listed because they were not assessed,
    except that PAINT itself has stopped the term on two Dikarya nodes. Because the
    transducins lie outside the scope, they need no member_exceptions entry: their REMOVE
    agrees with the scope.
