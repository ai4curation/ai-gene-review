family_id: PANTHER:PTHR10218
family_name: GTP-BINDING PROTEIN ALPHA SUBUNIT
preferred_name: Heterotrimeric G protein alpha subunits
summary: >-
  Alpha subunits of heterotrimeric G proteins. Every characterized member binds guanine
  nucleotide, associates with a beta-gamma dimer in the GDP-bound state, is activated by a
  G protein-coupled receptor that catalyses GDP-GTP exchange, and terminates its own signal
  by hydrolysing GTP. What differs between branches is the effector. In vertebrates the Gs
  and Golf subfamilies stimulate adenylyl cyclase, the Gi/o subfamilies inhibit several
  adenylyl cyclase isoforms, the Gq/11 subfamilies activate phospholipase C-beta (and can
  influence some cyclases indirectly through protein kinase C), and the sensory Gt
  subfamilies (rod transducin GNAT1, cone transducin GNAT2 and gustducin GNAT3) couple
  opsins or taste receptors to cyclic-nucleotide phosphodiesterases. The family also
  includes fungal, amoebozoan and plant alpha subunits, among them the plant extra-large
  G proteins, which this review does not assess.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The core molecular function (G protein activity: receptor-catalysed GDP-GTP exchange,
  beta-gamma association and intrinsic GTP hydrolysis) and membership of the heterotrimer
  are shared across the family and are safe at the root. Downstream signalling is not:
  adenylate cyclase modulation belongs to the Gs/Golf, Gi/o and (indirectly) Gq branches
  but not to the transducins, whose effector is the cGMP phosphodiesterase PDE6, and the
  sensory processes (phototransduction, photoreceptor compartments, bitter taste) are
  confined to individual subfamilies. Process terms must therefore be scoped to
  subfamilies; only the molecular function and complex terms are family-wide.
