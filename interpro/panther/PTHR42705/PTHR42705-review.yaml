family_id: PANTHER:PTHR42705
family_name: BIFUNCTIONAL NON-HOMOLOGOUS END JOINING PROTEIN LIGD
preferred_name: LigD-related ATP-dependent ligases with variable processing domains
summary: 'This family contains ATP-dependent DNA ligases, including fused LigD proteins that combine end
  sealing with polymerase activity and, in some lineages, a phosphoesterase module. Domain content and
  order vary: Bacillus subtilis LigD lacks the phosphoesterase domain found in the characterized Pseudomonas
  and mycobacterial proteins. Abasic-site processing and nucleotide-addition reactions depend on the protein
  and substrate context.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: ATP-dependent ligation is the common activity. The actual tree contains fused-LigD SF2
  and ATP-dependent-ligase SF3 members; even SF2 is heterogeneous for phosphoesterase architecture. Family
  or SF2 membership alone cannot establish every processing activity.
