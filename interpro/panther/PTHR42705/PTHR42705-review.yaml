term_assessments:
- assessed_term:
    id: GO:0003910
    label: DNA ligase (ATP) activity
  scope: FAMILY_WIDE
  scope_reason: ATP-dependent DNA sealing is the common ligase activity and the inspected IBD assertion;
    variable processing domains do not negate ligation.
  supported_by:
  - *id004
- assessed_term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  scope: UNRESOLVED
  scope_reason: DNA polymerization is positively supported in the named bacterial SF2 POL/LIG proteins
    across three phyla. The sampled SF2 also contains nonbacterial members whose domain architecture was
    not assessed, so the evidence does not yet justify a machine-level grant to every SF2 member. This
    is incomplete scope justification, not a demonstrated counterexample or loss. The module uses independently
    supported, POL-qualified exemplars; its qualifier does not retroactively narrow a family-wide or subfamily-wide
    grant.
  supported_by:
  - *id003
  - *id005
- assessed_term:
    id: GO:0046403
    label: polynucleotide 3'-phosphatase activity
  scope: UNRESOLVED
  scope_reason: This activity is established for the Pseudomonas PE domain, including an all-DNA substrate,
    but SF2 includes Bacillus LigD without PE. A function- and domain-qualified subset is required; no
    SF2-wide grant, arbitrary residue rule or invented ancestral loss is asserted.
  supported_by:
  - reference_id: PMID:16046407
    supporting_text: the PE domain has a 3'-phosphatase activity on an all-DNA primer-template
  - *id005
- assessed_term:
    id: GO:0140078
    label: class I DNA-(apurinic or apyrimidinic site) endonuclease activity
  scope: UNRESOLVED
  scope_reason: Bacillus LigD POL catalyzes substrate-dependent AP beta-elimination. Its gain or conservation
    across all LigD homologs has not been established, so preserve the measured exemplar without a family-wide
    grant.
  supported_by:
  - reference_id: PMID:30976810
    supporting_text: a robust AP lyase activity in the polymerization domain of Bacillus subtilis LigD
