notes: 'The current tree is preserved under analysis/module_audits/bacterial_nonhomologous_end_joining/tree-evidence-20261107/PTHR42705-compact.json
  with its raw export and receipt; PTHR42705-paint.tsv supplies the four actual assertions. Do not equate
  PTN001627042 with SF2: its descendants also include SF3 and nonbacterial leaves. Q88HU3 is not an exact
  leaf in this sample. No PE or AP-lyase IBD occurs in the export. SF3 is observed but not independently
  reviewed here; the associated broad-node questions remain unresolved rather than fabricated losses.
  The 2026 mycobacterial LigD construct P9WNV2 differs from the H37Rv representative P9WNV3 and is not
  substituted for it. These reconstructed scope distinctions are based on the retained tree exports and
  primary evidence. No universal processing grant follows from the positive exemplar panel.'
