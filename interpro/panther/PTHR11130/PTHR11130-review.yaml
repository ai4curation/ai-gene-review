  ATP-grasp glutathione synthetases ligate glycine to gamma-glutamylcysteine, the second step of
  glutathione synthesis (S. cerevisiae GSH2, S. pombe gsa1, human GSS, plant GSH2). Bacterial GshB
  is unrelated.
