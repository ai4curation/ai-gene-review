family_id: PANTHER:PTHR42832
family_name: AMINO ACID AMINOTRANSFERASE
preferred_name: Fold-type I (class I) PLP aminotransferase family including DapL and DapC
summary: A small PANTHER family of fold-type I pyridoxal 5-prime-phosphate aminotransferases. Reviewed
  members (27) are mostly LL-diaminopimelate aminotransferases (DapL, EC 2.6.1.83) of the aminotransferase
  variant of the DAP pathway, which converts tetrahydrodipicolinate directly to LL-DAP without acylation,
  together with antibiotic-biosynthesis transaminases (B. subtilis BacF, OxyQ) and, in SF1, the E. coli
  glutamate-pyruvate aminotransferase AlaC. UniProt also classifies the TrEMBL P. putida KT2440 DapC candidate
  Q88MI3 in SF3; that protein carries the beta/gamma-proteobacterial DapC signatures (NCBIfam TIGR03538,
  InterPro IPR019878) and is assigned the succinyl-DAP aminotransferase reaction of the succinylase route,
  not the DapL reaction.
functional_coherence: HETEROGENEOUS
coherence_reason: All members share the PLP transaminase mechanism, but amino donors, acceptors and pathways
  differ (LL-DAP formation in two different DAP-pathway variants, alanine synthesis, antibiotic biosynthesis).
  Only the broad transaminase activity is family-wide.
