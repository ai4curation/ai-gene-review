notes: Reviewed for the lysine_biosynthesis module. The module grounds its DapC step with NCBIfam TIGR03538
  and InterPro IPR019878 and asserts no PANTHER family, because PTHR42832 SF3 mixes DapL, DapC-signature
  and antibiotic transaminases. E. coli lacks a dedicated DapC; ArgD (PTHR11986) supplies the activity
  there.
