term_assessments:
- assessed_term:
    id: GO:0008760
    label: UDP-N-acetylglucosamine 1-carboxyvinyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    Neither the family nor a subfamily is the right scope, so no grant is recorded at either level.
    The activity is established for the bacterial and plant plastid members, which is precisely the
    PAINT clade PTN000472564; but the ten fungal, diatom and early-metazoan leaves that would be
    swept in by a family-wide grant sit in SF1 alongside canonical MurA, so the subfamily axis cannot
    separate them, and nothing in this repository tests whether they catalyse the reaction. Readers
    propagating this term should use the node, not the family.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43783/PTHR43783-paint.tsv
    supporting_text: "PTHR43783\tPTN000472564\tGO:0008760\tF\tIBD\tfalse"
