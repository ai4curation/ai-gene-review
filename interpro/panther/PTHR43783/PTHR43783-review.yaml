  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  assessment: SOUND
  assessment_reason: >-
    The node covers 59 of the family's 69 tree leaves: both MurA subfamilies across the bacterial
    phyla and the plastid MurA proteins of mosses, lycophytes and angiosperms, and it excludes the ten
    fungal, diatom and early-metazoan leaves. That is exactly the clade in which the reaction is
    established. The single E. coli seed is the enzyme on which the chemistry was defined (purification
    with the expected activity, the covalent phospholactoyl intermediate, essentiality as the sole
    enolpyruvyl transferase of E. coli), so a one-donor seed list is not weak support here; the
    reviewed recipient accepts the IBA. PAINT records the node taxon as Bacteria while the clade also
    contains streptophyte leaves; the plant orthologs are part of the cyanobacteria-derived plastid
    peptidoglycan gene set, in which a complete MurA-MurF series is retained and enzymatically active,
    so the activity claim holds for them and the taxon field understates the node rather than
    contradicting it.
