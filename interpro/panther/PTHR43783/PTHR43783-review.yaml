family_id: PANTHER:PTHR43783
family_name: UDP-N-ACETYLGLUCOSAMINE 1-CARBOXYVINYLTRANSFERASE
preferred_name: MurA (UDP-GlcNAc enolpyruvyl transferase) family
summary: >-
  Enolpyruvyl transferases of the MurA/MurZ type, which catalyse the first committed step of
  peptidoglycan synthesis: transfer of the enolpyruvyl group of phosphoenolpyruvate to the 3-OH of
  UDP-N-acetylglucosamine, via a covalent phospholactoyl-enzyme intermediate on the active-site
  cysteine, and the target of the antibiotic fosfomycin. The family spans bacterial MurA (single-copy
  in most lineages; the Bacillota carry a MurAA/MurAB pair), the plastid-targeted MurA orthologs of
  streptophyte plants, which belong to the cyanobacteria-derived plastid peptidoglycan pathway, and a
  small set of fungal, stramenopile and early-metazoan sequences of the same fold whose activity has
  never been tested.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Enolpyruvyl transfer onto UDP-GlcNAc is shared by every characterised member, bacterial and plant
  alike, and the two subfamilies are paralog clades of the same enzyme rather than functionally
  distinct groups. The exception is a group of ten eukaryotic leaves assigned to SF1 (Aspergillus
  nidulans C8V938, Aspergillus fumigatus Q4WNP3, Neurospora crassa Q1K775, Sclerotinia sclerotiorum
  A7EHQ1, Ustilago maydis A0A0D1DR58, Phaeosphaeria nodorum Q0US39, Thalassiosira pseudonana B8BW72,
  Daphnia pulex E9G9C4, Trichoplax adhaerens B3S8H9, Nematostella vectensis A7RUC5) that lie outside
  the MurA PAINT clade, come from lineages with no peptidoglycan, and have no measured activity. PAINT
  places its assertions below them, so they inherit nothing; no family-wide term should be asserted
  over them either.
