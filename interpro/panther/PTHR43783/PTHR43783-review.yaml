  assessment: SOUND
  assessment_reason: >-
    The node holds thirteen leaves, all of them proteobacterial murA genes (E. coli, Salmonella,
    Yersinia, Vibrio, Shewanella, Haemophilus, Pseudomonas, Xanthomonas, Neisseria, Helicobacter,
    Coxiella, Bradyrhizobium, Geobacter). MurA is a soluble enzyme acting on a nucleotide sugar before
    the membrane steps of the pathway, and in E. coli it is recovered in the cytosolic fraction by two
    independent proteomic studies; restricting the location row to this clade keeps it well inside the
    organisms where the fractionation was done. The reviewed recipient accepts the IBA.
