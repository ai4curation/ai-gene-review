notes: >-
  Reviewed for the bacterial undecaprenyl-phosphate carrier supply module, which
  grounds its UppS step in PTHR10291:SF0 with E. coli and P. putida exemplars. The
  family as a whole is too broad for that step: it includes eukaryotic dolichol-pathway
  enzymes and archaeal, mycobacterial and plant cis-prenyltransferases with different
  primers and chain lengths. Plant, fungal and mycobacterial membrane-location nodes are
  left UNRESOLVED because their seed evidence is not cached.
