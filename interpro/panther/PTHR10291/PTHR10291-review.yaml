  assessment: SOUND
  assessment_reason: >-
    The family-wide reaction class: chain elongation of (2E,6E)-FPP with n IPP in the cis
    configuration. It holds for bacterial UppS (n=8), eukaryotic DHDDS/RER2 (long chains)
    and most plant paralogs. The archaeal GGPP-primed and mycobacterial Z-primed enzymes
    are primer exceptions, but they are cis-prenyltransferases of the same chemistry.
    The eukaryotic seeds act in heteromeric complexes, which explains the contributes_to
    qualifier PAINT propagates; bacterial homodimers enable the activity on their own.
  supported_by:
