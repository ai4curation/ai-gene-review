  node_taxon:
    id: NCBITaxon:1783272
    label: Bacillati
  seeds:
  - id: UniProtKB:P9WFF7
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node (Bacillati, formerly Terrabacteria) covers the Firmicutes UppS
    enzymes (B. subtilis, S. aureus), for which C55 synthesis from (2E,6E)-FPP is
    correct. But its only seed is M. tuberculosis Rv2361c, whose product is C50
    decaprenyl diphosphate and whose preferred primer is omega,E,Z-FPP. The C55,
    E,E-FPP-specific term should be pruned from the mycobacterial decaprenyl diphosphate
    synthase clade (Rv2361c, M. smegmatis A0R0S4), keeping GO:0045547-level activity
    there.
  supported_by:
