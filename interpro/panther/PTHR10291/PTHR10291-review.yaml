family_id: PANTHER:PTHR10291
family_name: DEHYDRODOLICHYL DIPHOSPHATE SYNTHASE FAMILY MEMBER
preferred_name: Dehydrodolichyl Diphosphate Synthase Family Member
summary: DEHYDRODOLICHYL DIPHOSPHATE SYNTHASE FAMILY MEMBER (PANTHER:PTHR10291) is characterized in PANTHER
  PAINT across 9 ancestral PTN node(s) (PANTHER:PTN000033324, PANTHER:PTN000033327, PANTHER:PTN000033434,
  PANTHER:PTN000815958 (+5 more)) with 22 IBD node assertion(s) and 0 term(s) carrying negated IRD/IKR
  branch blocks, covering ditrans,polycis-polyprenyl diphosphate synthase [(2E,6E)-farnesyl diphosphate
  specific] activity (GO:0045547, MF), polyprenol biosynthetic process (GO:0016094, BP), endoplasmic reticulum
  (GO:0005783, CC), cytosol (GO:0005829, CC) and 12 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR10291 (DEHYDRODOLICHYL DIPHOSPHATE SYNTHASE FAMILY
  MEMBER) span 9 distinct ancestral PTN nodes (PANTHER:PTN000033324, PANTHER:PTN000033327, PANTHER:PTN000033434,
  PANTHER:PTN000815958, PANTHER:PTN000815984 (+4 more)) with different molecular function assignments
  across clades (ditrans,polycis-polyprenyl diphosphate synthase [(2E,6E)-farnesyl diphosphate specific]
  activity (GO:0045547), ditrans,polycis-undecaprenyl-diphosphate synthase [(2E,6E)-farnesyl-diphosphate
  specific] activity (GO:0008834), Z-farnesyl diphosphate synthase activity (GO:0033850), magnesium ion
  binding (GO:0000287) and 1 additional molecular function term(s)), indicating clade-level functional
  specialization across the family.
