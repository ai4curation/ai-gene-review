- subfamily_id: PANTHER:PTHR10291:SF43
  label: DEHYDRODOLICHYL DIPHOSPHATE SYNTHASE COMPLEX SUBUNIT DHDDS
  description: >-
    The eukaryotic dehydrodolichyl diphosphate synthase catalytic subunits (human DHDDS,
    yeast RER2, S. pombe SPAC4D7.04c), together with archaeal geranylgeranyl-diphosphate-
    specific C55 synthases, M. tuberculosis Rv1086 ((2Z,6E)-farnesyl diphosphate
    synthase) and Streptomyces UppS. Primer and product specificity vary within the
    subfamily, so it is not a single-activity clade. Its eukaryotic members act at the
    ER in dolichol synthesis rather than bacterial glycan-carrier supply.
  representative_members:
  - id: UniProtKB:Q86SQ9
    label: Dehydrodolichyl diphosphate synthase complex subunit DHDDS
    gene_symbol: DHDDS
    organism: Homo sapiens
  - id: UniProtKB:P9WFF5
    label: (2Z,6E)-farnesyl diphosphate synthase
    gene_symbol: Rv1086
    organism: Mycobacterium tuberculosis H37Rv
  diverged_from_family: true
  supported_by:
