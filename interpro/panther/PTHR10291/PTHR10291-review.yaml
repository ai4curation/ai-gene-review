subfamilies:
- subfamily_id: PANTHER:PTHR10291:SF0
  label: DEHYDRODOLICHYL DIPHOSPHATE SYNTHASE 2
  description: >-
    The largest subfamily (163 of 222 cached reviewed members). It holds the bacterial
    UppS enzymes of Proteobacteria and Firmicutes (E. coli IspU, P. putida UppS,
    B. subtilis, S. aureus, H. pylori), the mycobacterial decaprenyl diphosphate
    synthases (M. tuberculosis Rv2361c, M. smegmatis A0R0S4), and plant
    plastid-targeted cis-prenyltransferases such as Arabidopsis At5g58770. The official
    name comes from the Arabidopsis member, but most members are bacterial UppS. The
    module grounds its UppS step here, and notes that the subfamily also includes the
    divergent mycobacterial C50 enzymes.
