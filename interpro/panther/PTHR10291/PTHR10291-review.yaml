family_id: PANTHER:PTHR10291
family_name: DEHYDRODOLICHYL DIPHOSPHATE SYNTHASE FAMILY MEMBER
preferred_name: cis-Prenyltransferase (UPP synthase / dehydrodolichyl diphosphate synthase) family
summary: >-
  PTHR10291 is the cis-prenyltransferase (Z-prenyltransferase) family, the UPP
  synthase-like fold (InterPro IPR001441). Every characterized member adds isopentenyl
  diphosphate units in the cis configuration onto an allylic diphosphate primer to make
  a cis-polyprenyl diphosphate. Chain length, primer stereochemistry and oligomeric
  state vary by lineage. Bacterial UppS (E. coli IspU, Micrococcus luteus, Bacillus
  subtilis, Staphylococcus aureus) is a soluble Mg2+-dependent homodimer that makes
  C55 undecaprenyl diphosphate from (2E,6E)-farnesyl diphosphate, the precursor of the
  undecaprenyl-phosphate glycan carrier. Mycobacteria have a two-enzyme route: Rv1086
  makes (2Z,6E)-farnesyl diphosphate and Rv2361c extends it to C50 decaprenyl
  diphosphate. Archaeal members make C55 from geranylgeranyl diphosphate. In
  eukaryotes, the catalytic subunit (human DHDDS, yeast RER2/SRT1) makes long-chain
  dehydrodolichyl diphosphate at the ER for dolichyl-phosphate synthesis, usually
  with a NUS1/NgBR partner subunit from a different family. Plant plastid paralogs
  make short or medium cis-prenyl diphosphates.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reaction class (cis-prenyl chain elongation from IPP, GO:0045547 at the root) is
  shared by every characterized member. Substrate specificity and product length are
  lineage-specific, so the C55, (2E,6E)-FPP-specific UppS activity (GO:0008834)
  belongs only to the bacterial UppS clades, not to the family as a whole. Even inside
  PTHR10291:SF0, the mycobacterial decaprenyl diphosphate synthases prefer a Z,E primer
  and make C50.
