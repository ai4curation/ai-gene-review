    supporting_text: "PTHR10291\tPTN000033324\tGO:0045547\tF\tIBD\tfalse"
  - reference_id: PMID:10217761
    supporting_text: >-
      the RER2 gene family encodes cis-prenyltransferase, which plays an essential role in
      cell wall biosynthesis in bacteria and in dolichol synthesis in eukaryotic cells
