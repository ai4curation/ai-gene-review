family_id: PANTHER:PTHR11835
family_name: DECARBOXYLATING DEHYDROGENASES-ISOCITRATE, ISOPROPYLMALATE, TARTRATE
preferred_name: >-
  Beta-decarboxylating dehydrogenase family (NAD-IDH, homoisocitrate and isopropylmalate dehydrogenases)
summary: >-
  Beta-decarboxylating dehydrogenases oxidize a 2-hydroxy acid and decarboxylate it. The family contains
  the subunits of mitochondrial NAD-dependent isocitrate dehydrogenase (S. cerevisiae catalytic IDH2
  and regulatory IDH1, S. pombe idh2/idh1, human IDH3A/B/G), homoisocitrate dehydrogenase of fungal
  lysine synthesis (LYS12, lys12), and archaeal and bacterial IPMDH-like or IDH enzymes.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrate and role differ by subfamily: isocitrate for NAD-IDH (catalytic SF34; regulatory SF42,
  SF78), homoisocitrate for HICDH (SF48), and isopropylmalate or isocitrate for the IPMDH-like SF43.
