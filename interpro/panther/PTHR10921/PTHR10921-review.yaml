      - id: UniProtKB:O45717
        label: Protein nud-2
        gene_symbol: nud-2
        organism: Caenorhabditis elegans
        gene_review: genes/worm/nud-2/nud-2-ai-review.yaml
      - id: UniProtKB:O74689
        label: Nuclear distribution protein nudE
        gene_symbol: nudE
        organism: Emericella nidulans (Aspergillus nidulans)
        gene_review: genes/EMENI/nudE/nudE-ai-review.yaml
