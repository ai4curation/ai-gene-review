      nucleation factors to the centrosome. Both human reviews keep the term only as
      non-core. It is unsupported in worm (spindle assembly normal in nud-2 null) and in
      A. nidulans (the nudE null phenotype is fully suppressed by NudF overproduction).
      Both reviews mark it over-annotated. The fly review keeps it as non-core, noting
      the effects are probably indirect consequences of dynein regulation. Recommend
      removing the term from the eukaryote node. If it is kept at all, restrict it to
      the vertebrate NDE1/NDEL1 clade, whose centrosomal role it depends on.
