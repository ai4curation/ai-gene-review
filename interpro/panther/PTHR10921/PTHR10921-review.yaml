notes: >-
  Written to back the NudE-family gene reviews (human NDE1, NDEL1; fly nudE; worm nud-2;
  A. nidulans nudE; budding yeast NDL1) and the nucleokinesis module. All node ids, terms,
  seeds and snapshot dates are verbatim from the cached PTHR10921-paint.tsv. Leaf membership
  of PTN000100519 (82 leaves, including A. nidulans, Neurospora, Candida, Cryptococcus,
  Ustilago, Puccinia, Yarrowia, Sclerotinia, Phaeosphaeria, Dictyostelium and Paramecium
  NudE), PTN000100522 (64 bilaterian leaves) and PTN002589147 (27 NDEL1 leaves) was read
  from the cached PAINT leaf GAF (.cache/panther/gene_association.paint_uniprot.gaf.gz).
  Seed identities were resolved through UniProt cross-references: MGI:1914453 = Nde1,
  MGI:1932915 = Ndel1, RGD:621235 = rat Ndel1, FBgn0036059 = fly nudE. Subfamily
  placement of the reviewed genes was confirmed with the PANTHER 19 geneinfo service
  (NDE1 SF2, NDEL1 SF0, fly nudE, worm nud-2 and A. nidulans nudE SF1). Budding yeast
  NDL1 (Q06568) is a membership discrepancy. The InterPro HMM match lists it in SF1, but
  it is not mapped in the PANTHER 19 tree and its UniProt entry has no PANTHER
  cross-reference. It therefore receives no IBA, although it has the family's core
  function experimentally (IMP nuclear migration, Pac1-dependent plus-end targeting of
  dynein). The central recommendation is to split PTN000100519: keep the dynein-regulatory
  core (vesicle transport, spindle orientation, and a new cytoskeletal motor regulator
  activity MF) at the eukaryote root; move the kinetochore, chromosome segregation,
  chromosome localization and centrosome localization rows to PTN000100522 (Bilateria);
  restrict centrosome, microtubule nucleation and mitotic centrosome separation to the
  vertebrate NDE1/NDEL1 clade; and drop kinesin complex entirely. No residue sites are
  asserted. The family has no catalytic residues, and the LIS1-binding coiled coil is
  defined by structure (PMID:17997972 for Ndel1) rather than by single residues checked
  across members here.
