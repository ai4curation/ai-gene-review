    assessment: TOO_DEEP
    assessment_reason: >-
      All seeds are mammalian NDE1/NDEL1, which are genuinely centrosomal. Target-specific
      evidence argues against centrosomal residence outside vertebrates. The direct
      immunolocalization of Drosophila NudE found no centrosomal accumulation in
      neuroblasts or spermatocytes (PMID:19417004). Worm NUD-2 has not been reported at
