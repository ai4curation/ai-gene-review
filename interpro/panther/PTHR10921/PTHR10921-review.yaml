term_assessments:
  - assessed_term:
      id: GO:0140659
      label: cytoskeletal motor regulator activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The one molecular function every reviewed member shares, and each member review
      proposes it as core. NudE proteins bind LIS1 through their N-terminal coiled coil
      and promote LIS1-dynein engagement and dynein activation. This holds from
      A. nidulans (the coiled coil alone complements the null and suppresses nudF7)
      through budding yeast Ndl1 (targets dynein to plus ends through Pac1) to vertebrate
      NDEL1. No PAINT node currently asserts a molecular-function term of this kind: the
      family's only MF IBD is microtubule binding. A regulator-activity IBD at
      PTN000100519, seeded by NDEL1 and A. nidulans nudE, would describe the family
      better.
    supported_by:
      - reference_id: PMID:10931877
        supporting_text: Surprisingly, the NUDE construct containing the coiled-coil region alone complemented the nudE deletion and suppressed the nudF7 mutation
      - reference_id: PMID:15473966
        supporting_text: positively regulates dynein activity by facilitating the interaction between LIS1 and dynein
      - reference_id: PMID:20403325
        supporting_text: LIS1 alone or with NudE induces a persistent-force dynein state
      - reference_id: PMID:15965467
        supporting_text: These results indicate that Ylr254c is probably a homologue of NudEL despite low sequence similarity.
  - assessed_term:
      id: GO:0005871
      label: kinesin complex
    scope: NOT_APPLICABLE
    scope_reason: >-
      No member is a kinesin subunit. The sole seed describes rat NUDEL as kinesin-1 cargo
      delivered by the DISC1 cargo receptor. All member reviews remove the IBA.
    supported_by:
      - reference_id: PMID:17202468
        supporting_text: Our results show that DISC1 links Kinesin-1 to the NUDEL/LIS1/14-3-3ε complex, serves as the cargo receptor, and regulates the transport of the complex to axons, leading to axon elongation.
      - reference_id: PMID:20005871
        supporting_text: KLC-2 bound to residues 137–362 of UNC-83c
  - assessed_term:
      id: GO:0005813
      label: centrosome
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Centrosomal residence is documented for the vertebrate paralogs only (NDEL1 binds
      centrosomes strongly in interphase). The one direct test in an invertebrate member
      (fly NudE) found no centrosomal accumulation. Fungi have spindle pole bodies.
    applicable_subfamilies:
      - id: PANTHER:PTHR10921:SF0
        label: NUCLEAR DISTRIBUTION PROTEIN NUDE-LIKE 1
      - id: PANTHER:PTHR10921:SF2
        label: NUCLEAR DISTRIBUTION PROTEIN NUDE HOMOLOG 1
    supported_by:
      - reference_id: PMID:12556484
        supporting_text: A fraction of Nudel bound to centrosomes strongly in interphase
      - reference_id: PMID:19417004
        supporting_text: we do not see an accumulation of NudE near centrosomes in either neuroblasts or spermatocytes
  - assessed_term:
      id: GO:0000776
      label: kinetochore
    scope: UNRESOLVED
    scope_reason: >-
      Safe for metazoan members only: vertebrate NDE1/NDEL1 via CENP-F, fly NudE, and worm
      NUD-2 via HCP-1/2. It is not documented for fungal members, whose function needs
      only the LIS1-binding coiled coil. The boundary (Metazoa or Bilateria versus Fungi)
      cuts through subfamily SF1, which holds both fly/worm and fungal NudE. A
      SUBFAMILY_ONLY scope therefore cannot express it. The fix belongs at the PAINT node
      (see PTN000100519 kinetochore assessment), not at subfamily level.
    supported_by:
      - reference_id: PMID:17600710
        supporting_text: We show that Ndel1, Nde1, and Lis1 localize to kinetochores in a Cenp-F-dependent manner
      - reference_id: PMID:29192061
