      The single seed is rat Ndel1. The underlying study (Taya et al. 2007) shows that
      DISC1 acts as a cargo receptor linking kinesin-1 to the NUDEL/LIS1/14-3-3epsilon
      complex. Ndel1 is transported cargo, not a kinesin-complex subunit. The term is
      wrong for rat Ndel1 itself and has no support in any other member. In C. elegans
      the kinesin-1 light chain and NUD-2 bind separate regions of the KASH protein
      UNC-83 (PMID:20005871). All five member gene reviews that inherit the IBA (NDE1,
      NDEL1, fly nudE, worm nud-2, A. nidulans nudE) REMOVE it. Recommend removing the
      IBD from PTN000100519 outright (or asserting an IRD at the root) rather than moving it.
