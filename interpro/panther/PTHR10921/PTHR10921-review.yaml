    assessment_reason: >-
      Kinetochore localization is well supported in every metazoan member tested: human
      NDE1/NDEL1 via CENP-F, fly NudE (Lis1-dependent), and worm NUD-2 via the CENP-F-like
      HCP-1/2. All seeds are metazoan, and the recruiting partner (CENP-F/HCP-1/2) is a
