        label: Nuclear distribution protein nudE homolog 1
        gene_symbol: NDL1
        organism: Saccharomyces cerevisiae
        gene_review: genes/yeast/NDL1/NDL1-ai-review.yaml
    diverged_from_family: false
    description: >-
      All non-vertebrate members: invertebrate NudE (fly nudE, worm nud-2) and the fungal
      NudE/RO11/Ndl1 proteins. This is a taxonomic grade rather than a functional clade.
      Its metazoan members share the kinetochore role (fly NudE is Lis1-dependent at
      kinetochores; worm NUD-2 is recruited by HCP-1/2). Its fungal members are
      documented only for LIS1/NudF-dependent dynein function in nuclear migration and
      endosome transport. Budding yeast NDL1 is listed in SF1 by the InterPro PANTHER HMM
      match (PTHR10921-entries.csv). It has no PANTHER cross-reference in its UniProt entry
      and is not mapped in the PANTHER 19 tree (pantherdb geneinfo, 2026-09-27), so it
      inherits no IBA from this family. Its homology to NudEL rests on coiled-coil
      structure and LIS1 binding rather than sequence similarity (PMID:15965467).

