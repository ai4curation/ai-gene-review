family_id: PANTHER:PTHR10921
family_name: NUCLEAR DISTRIBUTION PROTEIN NUDE HOMOLOG 1
preferred_name: NudE / NudEL family of LIS1-binding cytoplasmic dynein regulators
summary: >-
  Eukaryote-wide family of small coiled-coil proteins (about 190-350 residues) typified by
  Aspergillus nidulans NudE, the first member found, as a multicopy suppressor of the
  LIS1-homolog mutant nudF. Every characterized member binds LIS1 (NudF/Pac1/LIS-1) through
  an N-terminal coiled coil and works with it to regulate cytoplasmic dynein. In vitro and
  in cells, NudE proteins tether LIS1 to dynein, help dynein reach microtubule plus ends,
  and promote the LIS1-dependent high-force, activated dynein state. The conserved biological
  output is dynein-driven nuclear migration along microtubules (hyphal nuclear distribution
  in filamentous fungi, spindle/nuclear positioning in budding yeast, nuclear migration in
  C. elegans hypodermal and P-cell precursors, nucleokinesis in migrating mammalian neurons)
  and dynein-driven retrograde organelle and endosome transport. Vertebrates carry two
  paralogs, NDE1 (SF2) and NDEL1 (SF0), which have gained a C-terminal region that binds
  CENP-F and other partners. That region targets them to kinetochores, the nuclear envelope
  and centrosomes in mitosis and neurodevelopment. Kinetochore targeting via CENP-F-like
  proteins is shared with fly NudE and worm NUD-2, but has not been shown for any fungal
  member. Centrosome residence and effects on centrosomal microtubule nucleation are
  documented only for the vertebrate paralogs. The family therefore has one conserved
  molecular role (the LIS1-dynein regulatory coiled coil) with metazoan and vertebrate
  additions that the deep PAINT node does not distinguish.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The core function (LIS1 binding and positive regulation of cytoplasmic dynein, giving
  dynein-driven nuclear migration and retrograde transport) holds in every member reviewed:
  human NDE1 and NDEL1, fly nudE, worm nud-2, A. nidulans nudE and budding yeast NDL1.
  The exceptions are lineage-restricted additions, not changes of function. The mitotic
  kinetochore role (CENP-F/HCP-1/2 recruitment, chromosome congression and segregation) is
  documented only in metazoa. Centrosome residence and effects on centrosomal microtubule
  nucleation and centrosome separation are documented only for vertebrate NDE1/NDEL1. Fly
  NudE is not centrosomal, and worm NUD-2 is dispensable for centrosome separation and
  positioning. A. nidulans NudE works through the N-terminal coiled coil alone. The deep
  eukaryote-level PAINT node carries all of these as if they were ancestral.
