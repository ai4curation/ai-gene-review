    diverged_from_family: false
    description: >-
      Vertebrate NDEL1 orthologs (human, mouse, rat, chicken, Xenopus, zebrafish ndel1a/b).
      Retains the family LIS1-dynein regulatory role. NDEL1 predominates in postmitotic
      migrating neurons. It also has vertebrate-specific partners and roles (CENP-F at
      kinetochores, centrosomal microtubule anchoring, DISC1, katanin), with mitotic roles
      partly redundant with NDE1.
  - subfamily_id: PANTHER:PTHR10921:SF2
    label: NUCLEAR DISTRIBUTION PROTEIN NUDE HOMOLOG 1
    representative_members:
      - id: UniProtKB:Q9NXR1
