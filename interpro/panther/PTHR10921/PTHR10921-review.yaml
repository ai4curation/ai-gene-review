      A. nidulans NudE has been imaged only at microtubule plus-end comets and cytoplasmic
      specks, and its N-terminal coiled coil alone is sufficient for function. The
      A. nidulans nudE review marks the inherited row over-annotated. Recommend moving the
      IBD to the bilaterian node PTN000100522 (already present in this family's PAINT
      slice, and ancestral to fly, worm and vertebrate members), or adding an IRD at the
      fungal clade. The fungal clade shares SF1 with fly and worm, so no subfamily-level
      exclusion expresses this; no fungal-clade PTN appears in the cached slice.
