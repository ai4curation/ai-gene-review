    scope: UNRESOLVED
    scope_reason: >-
      Even in vertebrates the effect is indirect: NDEL1 helps recruit gamma-tubulin and
      pericentrin to the centrosome. No member nucleates microtubules. Worm and fungal
      data argue against it. The term is at best a vertebrate-specific, indirect process
      annotation and should not descend from the eukaryote node.
