        gene_symbol: NDE1
        organism: Homo sapiens
        gene_review: genes/human/NDE1/NDE1-ai-review.yaml
    diverged_from_family: false
    description: >-
      Vertebrate NDE1 orthologs. Same core LIS1-dynein regulatory role. NDE1 predominates
      in neural progenitors (interkinetic nuclear migration, mitotic spindle orientation,
      kinetochore dynein), and loss causes microlissencephaly/microhydranencephaly.
