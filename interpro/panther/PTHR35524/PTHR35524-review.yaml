family_id: PANTHER:PTHR35524
family_name: ALPHA-ACETOLACTATE DECARBOXYLASE
preferred_name: Alpha-acetolactate decarboxylase (ALDC; AlsD/BudA/AldB)
summary: >-
  Alpha-acetolactate decarboxylases are metal-dependent, cofactor-free (non-ThDP) bacterial
  enzymes that decarboxylate (S)-2-acetolactate to (R)-acetoin, the second step of the
  acetoin/2,3-butanediol fermentation branch that follows catabolic acetolactate synthase. The
  enzyme also converts the (R)-enantiomer of acetolactate to (R)-acetoin after rearranging it to
  the (S)-form. Characterized members include B. subtilis AlsD (encoded with AlsS in the alsSD
  operon), Klebsiella BudA, and lactic-acid-bacterial and Brevibacillus AldB. The family is
  bacterial and archaeal; it has no fungal members, so yeasts form acetoin by the pyruvate
  decarboxylase side reaction instead.
functional_coherence: COHERENT
coherence_reason: >-
  PANTHER defines a single subfamily (SF1) and all reviewed members carry the alpha-acetolactate
  decarboxylase name; no characterized member with a different activity is known. Members from
  Methanosarcina, Vibrio and Methylococcus are named by similarity and have not been assayed, so
  coherence is inferred from conservation rather than tested across the whole family.
