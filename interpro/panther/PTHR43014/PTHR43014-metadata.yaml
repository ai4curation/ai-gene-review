  name:
    name: Class-I pyridine nucleotide-disulfide oxidoreductase
    short: Class-I_PNDO
  description:
  - text: This family of proteins includes enzymes that are primarily involved in
      redox reactions, particularly those related to resistance against toxic compounds.
      Members of this family are known to catalyze the reduction of mercuric ions
      to elemental mercury, which is less toxic and can be volatilized out of the
      cell. This function is crucial for bacterial resistance to mercury poisoning.
      Some family members are also involved in the reductive cleavage of thioether
      bonds in specific substrates, followed by carboxylation of the cleavage product.
      Additionally, certain proteins in this family may contribute to virulence by
      increasing resistance to reactive oxygen intermediates through the reduction
      of various quinones. The family is characterized by the presence of domains
      for binding FAD and NADPH, indicating a role in electron transfer processes.
      Regulatory mechanisms include inhibition by heavy metal ions and enhancement
      by thiol-containing compounds and salts at specific concentrations.
