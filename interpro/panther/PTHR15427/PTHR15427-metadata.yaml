  name:
    name: Collagen/C1q domain-containing
    short: Collagen/C1q_domain
  description:
  - text: The collagen/C1q domain-containing protein family includes a variety of
      proteins with roles in structural support, immune response, and regulation of
      various biological processes. Members of the family are characterized by the
      presence of a C1q domain, which often mediates calcium-binding and is involved
      in the formation of organic scaffolds, such as in the inner ear for otoliths
      or in cartilage for mineralization zones. Some family members are involved in
      the serum complement system, associating with proenzymes to form the C1 complex,
      which is activated upon interaction with immune complexes. Others are adipokines,
      influencing fat metabolism and insulin sensitivity, or serve as carrier proteins
      for factors involved in coagulation. The family also includes proteins that
      may regulate vessel assembly, angiogenesis, and tissue remodeling, highlighting
      a diverse range of functions from structural support to metabolic regulation
      and immune defense.
