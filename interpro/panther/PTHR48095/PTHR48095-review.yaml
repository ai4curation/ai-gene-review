family_id: PANTHER:PTHR48095
family_name: PYRUVATE CARBOXYLASE SUBUNIT A
preferred_name: Biotin carboxylase subunits of biotin-dependent carboxylases (AccC-like)
summary: >-
  Standalone biotin carboxylase subunits, 447 to 537 residues, that use ATP and bicarbonate to carboxylate
  the biotin cofactor of a separate carrier protein. The inventory holds the AccC subunit of bacterial
  acetyl-CoA carboxylase and the chloroplastic biotin carboxylases of plants, together with the biotin
  carboxylase subunits of other biotin-dependent enzymes: archaeal pyruvate carboxylase subunit A and
  the 2-oxoglutarate carboxylase small subunit of the reductive TCA cycle. Membership therefore supports
  the biotin-carboxylation half-reaction, not the identity of the downstream carboxyltransferase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members perform the same ATP-dependent biotin carboxylation, but they serve different carboxylases
  - acetyl-CoA carboxylase, pyruvate carboxylase, 2-oxoglutarate carboxylase - so the pathway each belongs
  to is not inherited with membership.
reference_protein:
  id: UniProtKB:P24182
  label: Biotin carboxylase
  gene_symbol: accC
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/accC/accC-ai-review.yaml
subfamilies:
