notes: >-
  The family name ("PYRUVATE CARBOXYLASE SUBUNIT A") and InterPro's LLM description ("Acetyl-CoA
  Carboxylase Biotin Carboxylase Component") each describe only part of the family. Leaf IBA
  coverage of PTN002449506 was read from the cached PAINT leaf GAF
  (.cache/panther/gene_association.paint_uniprot.gaf.gz): it includes Q58626 but not Q88C36 or
  D3DJ42. A templated review of this family exists on maintainer PR #5078 with the Populus BC as
  reference protein; this review keeps the same family id and node and differs on the node
  assessment (TOO_DEEP rather than SOUND) for the reason given.
