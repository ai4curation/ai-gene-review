    supporting_text: P24182,Biotin carboxylase,protein,83333,Escherichia coli
  - reference_id: file:interpro/panther/PTHR48095/PTHR48095-entries.csv
    supporting_text: O04983,"Biotin carboxylase, chloroplastic",protein,3702,
- subfamily_id: PANTHER:PTHR48095:SF1
  label: BIOTIN CARBOXYLASE
  description: >-
    A single inventory member, the Hydrogenobacter 2-oxoglutarate carboxylase small subunit cfiB, which
    carboxylates biotin for a carboxylase of the reductive tricarboxylic-acid cycle rather than for fatty-acid
    synthesis.
  representative_members:
  - id: UniProtKB:D3DJ42
    gene_symbol: cfiB
    organism: Hydrogenobacter thermophilus
  diverged_from_family: true
  divergence_description: >-
    Same biotin-carboxylation chemistry, different downstream enzyme and pathway: carbon fixation rather
    than malonyl-CoA synthesis.
  supported_by:
  - reference_id: file:interpro/panther/PTHR48095/PTHR48095-entries.csv
    supporting_text: D3DJ42,2-oxoglutarate carboxylase small subunit,protein,
node_assessments:
- node_id: PANTHER:PTN002449506
  asserted_term:
    id: GO:0003989
    label: acetyl-CoA carboxylase activity
  evidence: IBD
  paint_snapshot: '20241210'
  seeds:
  - id: UniProtKB:P96890
  - id: AGI_LocusCode:AT5G35360
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node asserts the complete acetyl-CoA carboxylase reaction across a family of standalone biotin
    carboxylase subunits. Each member performs only the ATP-dependent biotin carboxylation half-reaction
    (EC 6.3.4.14); malonyl-CoA formation additionally needs the biotin carrier and the carboxyltransferase.
    Worse, the family also contains biotin carboxylases of pyruvate and 2-oxoglutarate carboxylases, for
    which the acetyl-CoA term is simply wrong. The members' own activity term GO:0004075 is the one that
    should propagate; the reviewed E. coli and P. putida accC reviews accept that and mark this term over-annotated.
  affected_subfamilies:
  - id: PANTHER:PTHR48095:SF2
    label: BIOTIN CARBOXYLASE, CHLOROPLASTIC
  - id: PANTHER:PTHR48095:SF1
    label: BIOTIN CARBOXYLASE
  supported_by:
  - reference_id: file:interpro/panther/PTHR48095/PTHR48095-paint.tsv
    supporting_text: "PTHR48095\tPTN002449506\tGO:0003989\tF\tIBD\tfalse"
- node_id: PANTHER:PTN002449506
  asserted_term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence: IBD
  paint_snapshot: '20241210'
  seeds:
  - id: UniProtKB:P24182
    gene_symbol: accC
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/accC/accC-ai-review.yaml
  - id: AGI_LocusCode:AT5G35360
  assessment: SOUND
  assessment_reason: >-
    Sound for the acetyl-CoA carboxylase members that seed it, E. coli AccC among them: the biotin carboxylation
    they perform is the first half of the committed step of fatty-acid synthesis, so these subunits do
    participate in the pathway. The node is unrestricted, so the pyruvate- and 2-oxoglutarate- carboxylase
    members inherit it too; they are excepted by name in the term assessment.
  supported_by:
  - reference_id: file:interpro/panther/PTHR48095/PTHR48095-paint.tsv
    supporting_text: "PTHR48095\tPTN002449506\tGO:0006633\tP\tIBD\tfalse"
term_assessments:
- assessed_term:
    id: GO:0004075
    label: biotin carboxylase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member of this family performs the ATP-dependent carboxylation of a protein-bound biotin (EC
    6.3.4.14): that is what a standalone biotin carboxylase subunit is for, whichever carboxyltransferase
    it serves. It is the members' own activity, as distinct from the complete carboxylase reaction, and
    it is the term the module's AccC active unit asserts; the reviewed E. coli and P. putida accC reviews
    both carry it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR48095/PTHR48095-entries.csv
    supporting_text: P24182,Biotin carboxylase
  - reference_id: PMID:16460018
    supporting_text: >-
      Acetyl-coA carboxylase (ACC) is a central metabolic enzyme that catalyzes the committed step in
      fatty acid biosynthesis: biotin-dependent conversion of acetyl-coA to malonyl-coA.
- assessed_term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Holds for the biotin carboxylase subunits of acetyl-CoA carboxylase, which the node's seeds are and
    which the module's AccABCD variant models. Members serving other carboxylases are excepted by name,
    since the family's two subfamilies do not separate them cleanly.
  member_exceptions:
  - member:
      id: UniProtKB:Q58626
      label: Pyruvate carboxylase subunit A
      gene_symbol: pycA
      organism: Methanocaldococcus jannaschii
    exception_reason: >-
      Biotin carboxylase subunit of pyruvate carboxylase, an anaplerotic enzyme that carboxylates pyruvate
      to oxaloacetate; it makes no malonyl-CoA and is not part of fatty-acid synthesis.
    supported_by:
    - reference_id: file:interpro/panther/PTHR48095/PTHR48095-entries.csv
      supporting_text: Q58626,Pyruvate carboxylase subunit A,protein,243232,Met
  - member:
      id: UniProtKB:D3DJ42
      label: 2-oxoglutarate carboxylase small subunit
      gene_symbol: cfiB
      organism: Hydrogenobacter thermophilus
    exception_reason: >-
      Biotin carboxylase of 2-oxoglutarate carboxylase, which carboxylates 2-oxoglutarate in the reductive
      tricarboxylic-acid cycle of carbon fixation.
    supported_by:
    - reference_id: file:interpro/panther/PTHR48095/PTHR48095-entries.csv
      supporting_text: D3DJ42,2-oxoglutarate carboxylase small subunit,protein,
  supported_by:
  - reference_id: file:interpro/panther/PTHR48095/PTHR48095-paint.tsv
    supporting_text: "PTHR48095\tPTN002449506\tGO:0006633\tP\tIBD\tfalse"
  - reference_id: PMID:10893421
    supporting_text: >-
      Acetyl-CoA carboxylase (ACC) catalyzes the first committed step of the fatty acid synthetic pathway.
- assessed_term:
    id: GO:0003989
    label: acetyl-CoA carboxylase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    The term names the complete reaction, which needs the biotin carrier and the carboxyltransferase as
    well; each member of this family performs only the ATP-dependent biotin carboxylation, and several
    serve carboxylases that have nothing to do with acetyl-CoA. No member may carry it as an enabling
    annotation: GO:0004075 biotin carboxylase activity is the members' own function, and the contribution
    to the holoenzyme belongs in contributes_to_molecular_function.
  supported_by:
  - reference_id: file:interpro/panther/PTHR48095/PTHR48095-entries.csv
    supporting_text: Q58626,Pyruvate carboxylase subunit A,protein,243232,Met
  - reference_id: PMID:10893421
    supporting_text: >-
      Upon induction of gene expression, the four ACC subunits were overproduced in equimolar amounts.
