family_id: PANTHER:PTHR48095
family_name: PYRUVATE CARBOXYLASE SUBUNIT A
preferred_name: Biotin carboxylase subunits of multisubunit biotin-dependent carboxylases
summary: >-
  Stand-alone biotin carboxylase (BC) subunits of multisubunit biotin-dependent carboxylases.
  Each uses ATP and bicarbonate to carboxylate the biotin of a partner carrier protein. In the
  large subfamily SF2 the partner is the acetyl-CoA carboxylase (bacterial AccC, plant
  chloroplastic BC), but SF2 also holds archaeal pyruvate carboxylase subunit A proteins. The
  small subfamily SF1 holds BC subunits of two-subunit 2-oxoacid carboxylases, including
  Pseudomonas putida KT2440 PycA (alpha subunit of two-subunit pyruvate carboxylase) and the
  2-oxoglutarate carboxylase small subunit CfiB of Hydrogenobacter thermophilus.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The biotin carboxylase half-reaction is shared by all members; the carboxyltransferase
  partner, and hence the overall carboxylase (acetyl-CoA, pyruvate or 2-oxoglutarate), differs
  between and within subfamilies.
reference_protein:
  id: UniProtKB:Q88C36
  label: Biotin carboxylase
  gene_symbol: pycA
  organism: Pseudomonas putida KT2440
  gene_review: genes/PSEPK/pycA/pycA-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR48095:SF1
  label: BIOTIN CARBOXYLASE
  description: >-
    BC subunits of two-subunit 2-oxoacid carboxylases: KT2440 PycA (pyruvate carboxylase alpha,
    adjacent to the carboxyltransferase/BCCP subunit PycB) and, in the Swiss-Prot inventory, the
    Hydrogenobacter 2-oxoglutarate carboxylase small subunit CfiB.
  representative_members:
  - id: UniProtKB:Q88C36
    gene_symbol: pycA
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/pycA/pycA-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Partners a 2-oxoacid carboxyltransferase (PycB-type) instead of the acetyl-CoA carboxylase
    carboxyltransferase, so the overall reaction is pyruvate or 2-oxoglutarate carboxylation.
  supported_by:
  - reference_id: file:interpro/panther/PTHR48095/PTHR48095-entries.csv
    supporting_text: D3DJ42,2-oxoglutarate carboxylase small subunit,protein,608538
- subfamily_id: PANTHER:PTHR48095:SF2
  label: BIOTIN CARBOXYLASE, CHLOROPLASTIC
  description: >-
    Acetyl-CoA carboxylase BC subunits (E. coli, P. aeruginosa, Haemophilus, B. subtilis AccC;
    Nostoc; plant chloroplastic BC) together with archaeal pyruvate carboxylase subunit A
    proteins (Methanothermobacter, Methanocaldococcus, Archaeoglobus).
  representative_members:
  - id: UniProtKB:P24182
    gene_symbol: accC
    organism: Escherichia coli (strain K12)
  diverged_from_family: false
  supported_by:
  - reference_id: file:interpro/panther/PTHR48095/PTHR48095-entries.csv
    supporting_text: P24182,Biotin carboxylase,protein,83333
