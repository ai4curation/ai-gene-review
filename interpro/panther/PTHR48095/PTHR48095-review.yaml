  label: BIOTIN CARBOXYLASE, CHLOROPLASTIC
  description: >-
    The main subfamily (13 of 15 inventory members): bacterial AccC, cyanobacterial and plant plastid
    biotin carboxylases, and the archaeal pyruvate carboxylase subunit A. The official label names the
    chloroplastic members and is kept verbatim; it is not a localization claim for the bacterial majority.
  representative_members:
