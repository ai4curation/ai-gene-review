family_id: PANTHER:PTHR37531
family_name: HEME EXPORTER PROTEIN D
preferred_name: CcmD cytochrome c maturation accessory family
summary: >-
  PTHR37531 is the CcmD/CycX/HelD family of small integral inner-membrane
  proteins of cytochrome c maturation system I (E. coli CcmD is 69 residues).
  CcmD physically interacts with CcmC and the heme chaperone CcmE to form the
  ternary CcmCDE heme-loading complex and is needed for heme delivery to CcmE,
  but it does not detectably bind heme itself. No catalytic activity is known
  for CcmD, and the PANTHER name
  "heme exporter protein D" reflects the historical heme-export model rather
  than a demonstrated transport activity. PANTHER defines a single subfamily.
functional_coherence: COHERENT
coherence_reason: >-
  All Swiss-Prot members are proteobacterial CcmD orthologs in one subfamily,
  and the only PAINT assertion (cytochrome c biosynthetic process) is made at
  a gammaproteobacterial node covering them.
