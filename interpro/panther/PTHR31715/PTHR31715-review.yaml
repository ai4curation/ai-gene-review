    label: ureG
    organism: Klebsiella aerogenes
    control_position: 72
    control_residue: C
  - id: UniProtKB:Q88J00
    label: ureG
    organism: Pseudomonas putida KT2440
    control_position: 72
    control_residue: C
  - id: UniProtKB:O64700
    label: UREG
    organism: Arabidopsis thaliana
    control_position: 138
    control_residue: C
