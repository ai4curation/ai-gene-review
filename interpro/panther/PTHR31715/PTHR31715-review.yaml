    SIMIBI-class P-loop GTPase fold with a conserved GxxGxGK(S/T) Walker A motif
    (at 8-15 in H. pylori UreG). K. aerogenes activation needs nucleotide hydrolysis
    localized to UreG, and in H. pylori GTP hydrolysis releases nickel to urease.
    PAINT has not placed this term on a node; it is a family-level judgment for
    this review.
  supported_by:
