residue_sites:
- site_id: cph_nickel_motif
  label: Invariant Cys-Pro-His nickel-binding motif
  description: >-
    Cys66-Pro67-His68 (H. pylori numbering). In the UreG dimer, Cys66 and His68 from
    each protomer form the interfacial nickel site; the alanine substitutions
    abolish formation of the nickel-charged dimer. The motif is at 72-74 in K.
    aerogenes and P. putida UreG and at 138-140 in Arabidopsis UREG.
  anchor:
    id: UniProtKB:Q09066
    label: ureG
    organism: Helicobacter pylori 26695
  anchor_sequence_version: 2
  site_source: LITERATURE
  residues:
  - position: 66
    expected: [C]
    role: interfacial Ni(2+) ligand
  - position: 67
    expected: [P]
    role: motif proline
  - position: 68
    expected: [H]
    role: interfacial Ni(2+) ligand
  required_for:
  - term:
      id: GO:0018237
      label: urease activator activity
    strength: CONTRIBUTES
    rationale: >-
      Nickel delivery to urease goes through the nickel-charged UreG dimer, which
      cannot form when Cys66 and His68 are replaced by alanine. It is recorded as
      CONTRIBUTES, not REQUIRED, because the only natural family members lacking a
      CPH tripeptide are unreviewed fragments or fusions with no functional data,
      so there is no valid natural negative control.
    supported_by:
    - reference_id: PMID:24115911
      supporting_text: >-
        Substitution of Cys66 and His68 with alanine abolishes the formation of the
        nickel-charged UreG dimer.
  positive_controls:
