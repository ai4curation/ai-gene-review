family_id: PANTHER:PTHR31715
family_name: UREASE ACCESSORY PROTEIN G
preferred_name: Urease accessory protein UreG (SIMIBI GTPase metallochaperone) family
summary: >-
  UreG is the SIMIBI-class (G3E P-loop) GTPase of urease maturation. Recruited by
  UreD(UreH)-UreF to the urease apoprotein, it supplies the GTP-hydrolysis step
  that K. aerogenes urease activation needs at physiological bicarbonate. In
  Helicobacter it forms a nickel-loaded dimer whose metal site is built from the
  invariant Cys-Pro-His motif of two protomers; GTP hydrolysis returns UreG to the
  monomer and releases nickel to urease. Plant UreG (Arabidopsis, rice) carries an
  N-terminal His-rich extension and is the component that delivers nickel in the
  plant urease-UreD-UreF-UreG complex. The family also includes fungal UreG
  orthologues.
functional_coherence: COHERENT
coherence_reason: >-
  All 258 cached members fall in one subfamily (PTHR31715:SF0) and are urease
  accessory protein G or UreG-like proteins. The P-loop GTPase motif and the CPH
  nickel motif are conserved in bacterial, Helicobacter and plant representatives.
