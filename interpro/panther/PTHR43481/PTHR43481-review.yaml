family_id: PANTHER:PTHR43481
family_name: FRUCTOSE-1-PHOSPHATE PHOSPHATASE
preferred_name: Fungal HAD sugar-phosphate phosphatase family (GPP1/GPP2, DOG1/DOG2)
summary: >-
  HAD-superfamily phosphatases of fungi. SF4 holds the glycerol-3-phosphate phosphatases (S. cerevisiae
  GPP1/RHR2 and GPP2/HOR2) that make glycerol for osmoadaptation; SF9 holds the 2-deoxyglucose-6-phosphate
  phosphatases DOG1/DOG2.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Sugar-phosphate substrates differ: glycerol 3-phosphate (SF4) and 2-deoxyglucose 6-phosphate (SF9).
