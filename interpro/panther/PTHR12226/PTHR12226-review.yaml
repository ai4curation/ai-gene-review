family_id: PANTHER:PTHR12226
family_name: MANNOSE-P-DOLICHOL UTILIZATION DEFECT 1  LEC35 -RELATED
preferred_name: MPDU1/Lec35 and related PQ-loop membrane proteins (MPDU1, SLC66A3)
summary: >-
  Polytopic membrane proteins of the PQ-loop type. The characterized member, mammalian
  MPDU1 (Lec35, SL15), is an endoplasmic-reticulum membrane protein required for use of the
  lipid-linked donors mannose-P-dolichol and glucose-P-dolichol by the lumenal
  glycosyltransferases of LLO, GPI and C-mannose synthesis. It is not itself a glycosyltransferase
  and is thought to control the presentation or orientation of the donor in the membrane;
  MPDU1 mutations cause MPDU1-CDG (CDG-If). The family also contains a vertebrate/insect paralog
  group, SLC66A3 (PQLC3), whose function is not established, and plant MPDU1 homologs.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The MPDU1 orthologs (SF2: human, mouse, fly, worm, Arabidopsis At4g07390, Dictyostelium,
  Candida) are one functional group. SF3 (SOLUTE CARRIER FAMILY 66 MEMBER 3; human, mouse, rat,
  frog, zebrafish, chicken, fly CG1265) is a separate paralog group with no demonstrated role in
  dolichol-donor use, and SF4 holds Arabidopsis At5g59470 (MPDU1 homolog 1), also uncharacterized.
  Neither S. cerevisiae nor S. pombe has a member in the PANTHER 19 species files.
