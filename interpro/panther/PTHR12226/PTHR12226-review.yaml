notes: >-
  Module dolichol_phosphate_sugar_donor_supply (mpdu1_activity) selects the whole family
  PTHR12226, which also picks up SLC66A3 (SF3) and the SF4 plant protein; SF2 would be the
  accurate selector. The module's statement that neither S. cerevisiae nor S. pombe has a
  PTHR12226 member agrees with the PANTHER 19 species files, but Candida albicans
  (A0A1D8PGX4) and Dictyostelium (B0G0Z6, mpdu1) do have SF2 members, so the factor is not
  animal-restricted even though budding and fission yeast lack it. The official family name
  contains a double space ("DEFECT 1  LEC35") and is copied verbatim.
