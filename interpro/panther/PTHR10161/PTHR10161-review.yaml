      role in normal cartilage mineralization during skeletal development and
      in maintaining and remodeling bone integrity in adults
  - reference_id: PMID:2775236
    supporting_text: >-
      Tartrate-resistant acid phosphatase is one of the major enzymes produced
      and secreted by osteoclasts.
  - reference_id: file:interpro/panther/PTHR10161/PTHR10161-notes.md
    supporting_text: >-
      Its descendant `PTN002563058` is the 22-leaf vertebrate ACP5 node:
      human, other eutherian and metatherian/monotreme mammals, sauropsids,
      amphibians, gar, zebrafish, and medaka.
