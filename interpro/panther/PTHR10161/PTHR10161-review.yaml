- node_id: PANTHER:PTN000017834
  asserted_term:
    id: GO:0045453
    label: bone resorption
  evidence: IBD
  paint_snapshot: '20171103'
  seeds:
  - id: MGI:MGI:87883
  - id: RGD:2022
  assessment: TOO_DEEP
  assessment_reason: >-
    Mouse and rat ACP5 support bone resorption in the vertebrate ACP5 branch,
    but PTN000017834 also reaches tunicate, amphioxus, and sea-urchin purple
    acid phosphatases. Those invertebrate deuterostomes do not have a
    vertebrate-like mineralized bone matrix to resorb, so this IBD should move
    to PTN002563058, the vertebrate ACP5 node that contains the human ACP5 leaf
    and excludes the non-vertebrate deuterostome leaves.
  proposed_action:
    paint_action: MOVE_IBD
    target_node_id: PANTHER:PTN002563058
    target_node_taxon:
      id: NCBITaxon:7742
      label: Vertebrata
