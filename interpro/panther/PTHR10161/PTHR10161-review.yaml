family_id: PANTHER:PTHR10161
family_name: TARTRATE-RESISTANT ACID PHOSPHATASE TYPE 5
preferred_name: Purple acid phosphatase family
summary: >-
  PTHR10161 contains binuclear-metal purple acid phosphatases from animals,
  plants, protists, fungi, and bacteria. Human ACP5 and its vertebrate
  orthologs are Fe(III)-Fe(II) tartrate-resistant acid phosphatases that act as
  secreted osteoclast/macrophage enzymes and lysosomal acid phosphatases. PAINT
  places the catalytic acid phosphatase and iron-binding functions at the
  PTN004128707 node; this human-focused review supports retention on ACP5 but
  leaves the wider acid-phosphatase scope unresolved because the same SF14 slice
  also contains Plasmodium GAP50 and UIS2. The vertebrate bone-resorption
  process is narrower than the deuterostome PTN000017834 node and should be
  moved to the vertebrate ACP5 clade.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Acid phosphatase activity and dinuclear iron binding are coherent across
  reviewed vertebrate ACP5 and plant purple-acid-phosphatase representatives,
  but not yet verified across every SF14 member. Downstream biological processes
  are lineage-specific: vertebrate ACP5 participates in bone resorption, plant
  PAPs are diversified phosphate-metabolism enzymes, and Plasmodium GAP50 is a
  membrane-associated glideosome protein.
