  name:
    name: Metallophosphoesterase Purple Acid Phosphatase
    short: Metallophosphoesterase_PAP
  description:
  - text: This family of proteins includes metallophosphoesterases known as purple
      acid phosphatases (PAPs). Members of this family are involved in various biological
      processes, including phosphate metabolism and bone resorption. They exhibit
      phosphatase activity towards a range of substrates, such as nucleotide tri-
      and diphosphates, and are implicated in the dephosphorylation of osteopontin
      and bone sialoprotein. Some members are known to be involved in transplacental
      iron transport and may have a role in protecting against host immune responses
      during parasite infection. The activity of these enzymes can be regulated by
      metal ions, phosphate, and molybdate. They are characterized by their resistance
      to inhibition by tartrate and their ability to function in acidic environments.
