  name:
    name: Eukaryotic initiation factor 2B subunit beta
    short: eIF2B_beta_subunit
  description:
  - text: This family of proteins functions as components of the translation initiation
      factor 2B (eIF2B) complex, which is responsible for the exchange of GDP for
      GTP on the eIF2 gamma subunit. This activity is crucial for the initiation of
      protein synthesis as it allows the formation of the eIF2-GTP-methionyl-initiator
      methionine tRNA complex necessary for the start of translation. The activity
      of these proteins is regulated by the phosphorylation status of the eIF2 alpha
      subunit; when eIF2 is phosphorylated, the exchange factor activity of the eIF2B
      complex is repressed, leading to a reduction in global protein synthesis. This
      serves as a regulatory mechanism during cellular stress responses. Some members
      of this family are also known to be activated by specific chemicals that can
      stimulate their activity regardless of the phosphorylation state of eIF2, thus
      influencing the integrated stress response.
