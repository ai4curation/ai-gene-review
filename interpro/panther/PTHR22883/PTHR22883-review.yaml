family_id: PANTHER:PTHR22883
family_name: ZINC FINGER DHHC DOMAIN CONTAINING PROTEIN
preferred_name: DHHC protein S-acyltransferases
summary: DHHC-family proteins catalyze protein S-acylation at membranes. Distinct paralogs act on different
  protein substrates and membrane compartments. Human ZDHHC23 has evidence for palmitoylation-dependent
  regulation of KCNMA1 localization, which is a specific substrate relationship rather than a universal
  property of DHHC enzymes.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Structural and biochemical work on DHHC enzymes establishes membrane-interface thioester-exchange
  chemistry and acyl-chain selectivity (PMID:29326245). The family contains multiple palmitoyltransferase
  branches with different protein substrates, acyl-chain preferences and partner requirements. ZDHHC23
  placement supports this enzyme-family comparison, but a substrate reported for ZDHHC20, ZDHHC16 or fungal
  Erf2 cannot be assigned to ZDHHC23 from shared DHHC architecture.
