  name:
    name: Methyl-accepting chemotaxis
    short: MCP_chemotaxis
  description:
  - text: The Methyl-accepting chemotaxis (MCP) protein family consists of chemotactic
      signal transducers that mediate bacterial taxis in response to environmental
      stimuli. Members of the MCP family detect the presence of attractants and repellents,
      initiating a signal transduction process that alters the swimming behavior of
      the cell. Attractants cause an increase in the level of methylation of these
      proteins, while repellents result in decreased methylation. The reversible methylation,
      which is regulated by the methyltransferase CheR and the methylesterase CheB,
      facilitates sensory adaptation, allowing the bacteria to respond to changes
      in the concentration of environmental cues. The MCP proteins interact with various
      periplasmic binding proteins to mediate taxis towards or away from specific
      compounds, such as sugars, amino acids, dipeptides, and gases. Some members
      are also involved in virulence and pathogenesis, and may contain additional
      domains for sensing specific stimuli, like oxygen or redox state.
