family_id: PANTHER:PTHR43531
family_name: PROTEIN ICFG
preferred_name: Enterobacterial-type methyl-accepting chemoreceptor family (Tar/Tsr/Tap/Trg/Aer)
summary: >-
  This PANTHER family groups the canonical methyl-accepting chemotaxis proteins (MCPs) of
  enteric bacteria and related chemoreceptors of other lineages. The E. coli members are
  the transmembrane receptors Tsr (serine), Tar (aspartate and maltose), Tap (dipeptides)
  and Trg (ribose, galactose), which bind ligands with a periplasmic domain, pass the
  signal through two transmembrane helices and a HAMP domain, and control the CheA kinase
  through a cytoplasmic methyl-accepting signalling domain whose glutamates are
  methylated by CheR and demethylated by CheB. The family also contains the E. coli
  aerotaxis receptor Aer, a membrane-anchored flavoprotein that senses the cell's redox
  state through a cytoplasmic PAS-FAD domain, and the cytoplasmic Myxococcus xanthus
  FrzCD of the Frz gliding-control pathway. PANTHER's official name refers to an unrelated
  designation; the members are chemoreceptors.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members are chemosensory-array receptors with a methyl-accepting
  signalling domain. They differ in how the signal is received: Tsr, Tar, Tap and Trg
  (SF14, SF16, SF5) are true transmembrane receptors for periplasmic ligands, whereas Aer
  (SF7) senses an intracellular redox signal and FrzCD (SF11) is a soluble cytoplasmic
  receptor. Transmembrane signalling receptor activity and plasma-membrane location
  therefore do not hold for every member.
