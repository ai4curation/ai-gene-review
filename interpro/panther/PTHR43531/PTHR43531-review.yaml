term_assessments:
- assessed_term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The GO definition is "Combining with an extracellular or intracellular signal and
    transmitting the signal from one side of the membrane to the other to initiate a
    change in cell activity or state as part of signal transduction." Tar, Tsr, Tap and
    Trg bind periplasmic ligands and transduce the signal across the membrane, which is
    the receptor role the chemotaxis module asserts for its MCP annoton. Aer and the
    soluble FrzCD do not transmit a signal across the membrane and are exceptions.
  supported_by:
  - reference_id: file:ECOLI/tar/tar-uniprot.txt
    supporting_text: Chemotactic-signal transducers respond to changes in the concentration of attractants
      and repellents in the environment, transduce a signal from the outside to the inside of the cell
  member_exceptions:
  - member:
      id: UniProtKB:P50466
      label: Aerotaxis receptor
      gene_symbol: aer
      organism: Escherichia coli (strain K12)
    exception_reason: >-
      Aer senses the intracellular redox state with a cytoplasmic PAS-FAD domain and has
      no periplasmic ligand-binding domain, so its signal does not cross the membrane.
    pruned_node_id: PANTHER:PTN002079588
    supported_by:
    - reference_id: PMID:9190831
      supporting_text: Aer may use its FAD prosthetic group as a cellular redox sensor to monitor environmental
        oxygen levels.
  - member:
      id: UniProtKB:P43500
      label: Frizzy aggregation protein FrzCD
      gene_symbol: frzCD
      organism: Myxococcus xanthus
    exception_reason: >-
      FrzCD is a soluble cytoplasmic receptor of the Frz gliding-control pathway; it
      cannot transmit a signal across the membrane.
    supported_by:
    - reference_id: PMID:1624419
      supporting_text: FrzCD, unlike the other methyl-accepting chemotaxis proteins, was found to be localized
        primarily in the cytoplasmic fraction of cells.
