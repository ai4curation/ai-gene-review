notes: >-
  Reviewed for modules/bacterial_sulfoquinovose_catabolism.yaml, which grounds the KDSG aldolase
  annoton to this family with P0DOV8 as representative and GO:0016832 as its function. The root node
  PTN000766732 is a sound grounding for that generic function. The PAINT slice was generated on
  2026-11-10 (159 PANTHER nodes resolved, one annotated). The module could ground more narrowly to SF0,
  where UniProt places P0DOV8. Also selected by modules/glucarate_galactarate_catabolism.yaml for
  the GarL step of the enterobacterial route (SF4, GO:0008672); that pass added the GarL scope with
  three SF4 member exceptions, the E. coli K-12 GarL and RhmA representatives, and PANTHER 19 tree
  placements. The inventory counts above come from the complete 2026-11-11 fetch, which supersedes
  a truncated earlier fetch.
