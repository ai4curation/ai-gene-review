node_assessments:
- node_id: PANTHER:PTN000766732
  asserted_term:
    id: GO:0016832
    label: aldehyde-lyase activity
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: UniProtKB:P23522
    gene_symbol: garL
    organism: Escherichia coli K-12
  - id: UniProtKB:P76469
    gene_symbol: rhmA
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    PTN000766732 is the root of the current PTHR30502 tree (85 leaves). The two seeds, GarL and RhmA,
    are directly characterized pyruvate aldolases, and the generic aldehyde-lyase term also holds for
    HpcH, the hydroxypyruvate/pyruvate aldolases and the P. putida KDSG aldolase, whose cleavage of
    KDSG into pyruvate and 3-sulfolactaldehyde is curated from direct assay. The one characterized
    member for which the term is not exact is fungal TasA, an EC 4.1.3.17 oxo-acid-lyase; it is
    recorded as a member exception in the term assessment rather than as grounds to move a node whose
    term is otherwise correct for the family. The fungal SF8 leaves named macrophomate synthase are
    uncharacterized here.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30502/PTHR30502-paint.tsv
    supporting_text: "PTHR30502\tPTN000766732\tGO:0016832\tF\tIBD\tfalse\tUniProtKB:P23522|UniProtKB:P76469"
  - reference_id: file:interpro/panther/PTHR30502/PTHR30502-tree-check.txt
