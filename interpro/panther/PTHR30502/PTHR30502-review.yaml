family_id: PANTHER:PTHR30502
family_name: 2-KETO-3-DEOXY-L-RHAMNONATE ALDOLASE
preferred_name: HpcH/HpaI class II (metal-dependent) pyruvate aldolases
summary: >-
  Divalent-metal-dependent (class II) aldolases of the HpcH/HpaI fold. They
  catalyse reversible retro-aldol cleavage of 2-oxo-3-deoxy (or
  4-hydroxy-2-oxo) acids to pyruvate (or hydroxypyruvate) and an aldehyde. The
  characterized clades differ by substrate. SF4 holds the enterobacterial
  5-keto-4-deoxy-D-glucarate aldolase GarL of aldarate catabolism. SF5 holds
  RhmA (YfaU), the 2-keto-3-deoxy-L-rhamnonate aldolase. SF0 holds HpcH/HpaI
  aldolases of aromatic-compound (4-hydroxyphenylacetate, biphenyl)
  degradation, sulfoquinovose-pathway aldolases and many uncharacterized
  bacterial, fungal and plant proteins. Several clades also condense pyruvate
  or hydroxypyruvate with D-glyceraldehyde in vitro.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The aldehyde-lyase chemistry is shared by every characterized member, but
  the physiological substrate is clade-specific: KDG in SF4 (GarL), KDR in SF5
  (RhmA), aromatic-pathway hydroxy-oxo acids and others in SF0. SF4 also
  contains three alphaproteobacterial and Chromohalobacter proteins that were
  characterized only as in vitro hydroxypyruvate/pyruvate aldolases.
