    gene_symbol: garL
    organism: Escherichia coli K-12
  - id: UniProtKB:P76469
    gene_symbol: rhmA
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    PTN000766732 is the root of the current PTHR30502 tree (85 leaves). The two seeds, GarL and RhmA,
    are directly characterized pyruvate aldolases, and the generic aldehyde-lyase term also holds for
    HpcH, the hydroxypyruvate/pyruvate aldolases and the P. putida KDSG aldolase, whose cleavage of
    KDSG into pyruvate and 3-sulfolactaldehyde is curated from direct assay. The one characterized
    member for which the term is not exact is fungal TasA, an EC 4.1.3.17 oxo-acid-lyase; it is
    recorded as a member exception in the term assessment rather than as grounds to move a node whose
    term is otherwise correct for the family.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30502/PTHR30502-paint.tsv
    supporting_text: "PTHR30502\tPTN000766732\tGO:0016832\tF\tIBD\tfalse\tUniProtKB:P23522|UniProtKB:P76469"
  - reference_id: file:genes/PSEPU/PpSQ1_00455/PpSQ1_00455-uniprot.txt
    supporting_text: Catalyzes the retro-aldol cleavage of 2-dehydro-3,6-dideoxy-6-sulfo-D-gluconate
      to (2S)-3-sulfolactaldehyde and pyruvate.
term_assessments:
- assessed_term:
    id: GO:0016832
    label: aldehyde-lyase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The family's characterized members are retro-aldol pyruvate aldolases that release an aldehyde
    (EC 4.1.2 class), as the root IBD asserts; this is also the term the sulfo-ED KDSG aldolase annoton
    uses, because GO has no KDSG aldolase term. TasA, whose product is an oxo acid, is excepted.
  member_exceptions:
  - member:
      id: UniProtKB:A0A0F7GG11
      label: 4-hydroxy-4-methyl-2-oxoglutarate aldolase tasA
      gene_symbol: tasA
      organism: Hapsidospora irregularis
    exception_reason: >-
      TasA condenses two pyruvates to 4-hydroxy-4-methyl-2-oxoglutarate (EC 4.1.3.17), an oxo-acid-lyase
      reaction in which no aldehyde is formed, so the aldehyde-lyase term is not exact for it.
    supported_by:
    - reference_id: file:interpro/panther/PTHR30502/PTHR30502-entries.csv
      supporting_text: A0A0F7GG11,4-hydroxy-4-methyl-2-oxoglutarate aldolase tasA
  supported_by:
  - reference_id: file:interpro/panther/PTHR30502/PTHR30502-paint.tsv
    supporting_text: "PTHR30502\tPTN000766732\tGO:0016832\tF\tIBD\tfalse"
  - reference_id: file:genes/PSEPU/PpSQ1_00455/PpSQ1_00455-uniprot.txt
    supporting_text: Catalyzes the retro-aldol cleavage of 2-dehydro-3,6-dideoxy-6-sulfo-D-gluconate
      to (2S)-3-sulfolactaldehyde and pyruvate.
