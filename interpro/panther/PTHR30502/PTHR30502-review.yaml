family_id: PANTHER:PTHR30502
family_name: 2-KETO-3-DEOXY-L-RHAMNONATE ALDOLASE
preferred_name: HpcH/HpaI-type class II pyruvate aldolases
summary: >-
  Metal-dependent (class II) pyruvate aldolases of the HpcH/HpaI family with a TIM-barrel fold, which
  cleave 2-keto-3-deoxy or 4-hydroxy-2-oxo acids into pyruvate and an aldehyde. Characterized members
  include the enterobacterial 5-keto-4-deoxy-D-glucarate aldolase GarL (SF4), 2-keto-3-deoxy-L-rhamnonate
  aldolase RhmA (SF5), 4-hydroxy-2-oxo-heptane-1,7-dioate aldolase HpcH and the hydroxypyruvate/pyruvate
  aldolases (SF0), and the Pseudomonas putida SQ1 2-dehydro-3,6-dideoxy-6-sulfogluconate (KDSG) aldolase
  of the sulfo-ED pathway (SF0 by its UniProt cross-reference). The fungal TasA, also in SF0, runs the
  same pyruvate aldol chemistry in the biosynthetic direction to form 4-hydroxy-4-methyl-2-oxoglutarate.
  The local SwissProt inventory lists 20 members (SF0 10, SF4 7, SF5 3) and omits several members
  named here, including E. coli K-12 GarL and RhmA and P. putida KDSG aldolase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Retro-aldol cleavage releasing pyruvate is common to the characterized members, but the aldehyde
  partner differs (tartronate semialdehyde, L-lactaldehyde, succinate semialdehyde, hydroxypyruvate,
  3-sulfolactaldehyde), and TasA condenses two pyruvates to an oxo acid (EC 4.1.3.17), so substrate-
  specific activities must be assigned per subfamily or member.
