  - reference_id: file:genes/PSEPU/PpSQ1_00455/PpSQ1_00455-uniprot.txt
    supporting_text: Catalyzes the retro-aldol cleavage of 2-dehydro-3,6-dideoxy-6-sulfo-D-gluconate
      to (2S)-3-sulfolactaldehyde and pyruvate.
term_assessments:
- assessed_term:
    id: GO:0016832
    label: aldehyde-lyase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The family's characterized members are retro-aldol pyruvate aldolases that release an aldehyde
    (EC 4.1.2 class), as the root IBD asserts; this is also the term the sulfo-ED KDSG aldolase annoton
    uses, because GO has no KDSG aldolase term. TasA, whose product is an oxo acid, is excepted.
  member_exceptions:
  - member:
      id: UniProtKB:A0A0F7GG11
      label: 4-hydroxy-4-methyl-2-oxoglutarate aldolase tasA
      gene_symbol: tasA
      organism: Hapsidospora irregularis
    exception_reason: >-
      TasA condenses two pyruvates to 4-hydroxy-4-methyl-2-oxoglutarate (EC 4.1.3.17), an oxo-acid-lyase
      reaction in which no aldehyde is formed, so the aldehyde-lyase term is not exact for it.
    supported_by:
    - reference_id: file:interpro/panther/PTHR30502/PTHR30502-entries.csv
      supporting_text: A0A0F7GG11,4-hydroxy-4-methyl-2-oxoglutarate aldolase tasA
  supported_by:
  - reference_id: file:interpro/panther/PTHR30502/PTHR30502-paint.tsv
    supporting_text: "PTHR30502\tPTN000766732\tGO:0016832\tF\tIBD\tfalse"
  - reference_id: file:genes/PSEPU/PpSQ1_00455/PpSQ1_00455-uniprot.txt
    supporting_text: Catalyzes the retro-aldol cleavage of 2-dehydro-3,6-dideoxy-6-sulfo-D-gluconate
      to (2S)-3-sulfolactaldehyde and pyruvate.
- assessed_term:
    id: GO:0008672
    label: 2-dehydro-3-deoxyglucarate aldolase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    KDG aldolase activity is the SF4 GarL activity, assayed for E. coli GarL. In the reference tree,
    the SF4 leaves (E. coli and Salmonella GarL) are sister to the SF5 RhmA leaves, which act on
    2-keto-3-deoxy-L-rhamnonate, so the activity does not extend to SF5 or SF0. Three SF4 members
    are excepted because they were characterized only as hydroxypyruvate/pyruvate aldolases.
  applicable_subfamilies:
  - id: PANTHER:PTHR30502:SF4
    label: 5-KETO-4-DEOXY-D-GLUCARATE ALDOLASE
  member_exceptions:
  - member:
      id: UniProtKB:A3SLS0
      label: Hydroxypyruvate/pyruvate aldolase
      organism: Roseovarius nubinhibens
    exception_reason: >-
      Classified in SF4 but named and characterized as an in vitro hydroxypyruvate/pyruvate aldolase
      (condensation with D-glyceraldehyde); no garL gene assignment and no KDG assay, so KDG aldolase
      activity is not established.
    supported_by:
    - reference_id: file:interpro/panther/PTHR30502/PTHR30502-entries.csv
      supporting_text: A3SLS0,Hydroxypyruvate/pyruvate aldolase
  - member:
      id: UniProtKB:Q16DB5
      label: Hydroxypyruvate/pyruvate aldolase
      organism: Roseobacter denitrificans
    exception_reason: >-
      As for A3SLS0: an SF4 member characterized only as a hydroxypyruvate/pyruvate aldolase, without
      a KDG assay.
    supported_by:
    - reference_id: file:interpro/panther/PTHR30502/PTHR30502-entries.csv
      supporting_text: Q16DB5,Hydroxypyruvate/pyruvate aldolase
  - member:
      id: UniProtKB:Q1QUJ4
      label: Hydroxypyruvate/pyruvate aldolase
      organism: Chromohalobacter israelensis
    exception_reason: >-
      As for A3SLS0: an SF4 member characterized only as a hydroxypyruvate/pyruvate aldolase, without
      a KDG assay.
    supported_by:
    - reference_id: file:interpro/panther/PTHR30502/PTHR30502-entries.csv
      supporting_text: Q1QUJ4,Hydroxypyruvate/pyruvate aldolase
  supported_by:
  - reference_id: file:genes/ECOLI/garL/garL-ai-review.yaml
    supporting_text: >-
      Purified GarL cleaves KDG and 2-dehydro-3-deoxy-D-glucarate to pyruvate and
      tartronate semialdehyde.
  - reference_id: file:interpro/panther/PTHR30502/PTHR30502-tree-check.txt
    supporting_text: >-
      leaf of PTN000766732: PTN001253650 EnsemblGenome:BAE77173 Escherichia coli
      PTHR30502:SF4 | 5-keto-4-deoxy-D-glucarate aldolase
