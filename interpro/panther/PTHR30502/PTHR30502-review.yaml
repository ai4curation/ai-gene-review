    The family root covers all 85 reference-tree leaves. Every characterized
    clade (GarL, RhmA, HpcH, BphF and the hydroxypyruvate/pyruvate aldolases)
    catalyses aldol cleavage to pyruvate or hydroxypyruvate plus an aldehyde,
    so the general aldehyde-lyase term is appropriate at the root. The fungal
    SF8 leaves named macrophomate synthase are uncharacterized here; they keep
    the aldolase fold, and nothing in this corpus contradicts the term for
    them.
