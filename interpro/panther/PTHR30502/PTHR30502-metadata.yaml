  name:
    name: HpcH/HpaI Aldolase
    short: HpcH-HpaI_aldolase
  description:
  - text: The HpcH/HpaI aldolase family encompasses enzymes that catalyze the reversible
      retro-aldol cleavage of various substrates to produce pyruvate and a corresponding
      aldehyde. Members of this family are involved in diverse metabolic pathways,
      including the degradation of sugars and the biosynthesis of natural products.
      Some enzymes within this family exhibit broad substrate specificity and are
      capable of processing multiple aldol substrates, while others are more specialized.
      The family includes enzymes such as 5-keto-4-deoxy-D-glucarate aldolase and
      2-keto-3-deoxy-L-rhamnonate aldolase, which participate in carbohydrate metabolism,
      as well as enzymes like 4-hydroxy-4-methyl-2-oxoglutarate aldolase, which are
      involved in the biosynthesis of complex molecules like anti-HIV fungal natural
      products. The family is characterized by a common mechanism of retro-aldol cleavage,
      although some members also possess additional activities such as oxaloacetate
      decarboxylase activity or the ability to catalyze aldol addition reactions.
