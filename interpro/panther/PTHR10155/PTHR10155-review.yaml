family_id: PANTHER:PTHR10155
family_name: PHOSPHATIDYLINOSITOL 3-KINASE REGULATORY SUBUNIT
preferred_name: PI3K regulatory and SOCS SH2 adaptor proteins
summary: >-
  PTHR10155 groups two ancient SH2-containing adaptor families: class IA phosphoinositide 3-kinase regulatory
  subunits, which couple phosphorylated receptors to PI3K catalytic subunits, and SOCS-box proteins, which
  bind phosphotyrosine-containing signaling proteins and recruit Elongin BC-Cullin ubiquitin-ligase machinery.
  The family is heterogeneous at the root; PI3K-complex and PI3K-regulator activities belong on the PIK3R
  branch, while cytokine-receptor/JAK-STAT feedback and CRL5/SOCS substrate-adaptor activities belong
  on SOCS subbranches.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The PIK3R1/PIK3R2/PIK3R3 branches are PI3K p85/p55 regulatory subunits, whereas CISH/SOCS1-7 are SOCS-box
  adaptors for cytokine and tyrosine-kinase signaling. PIK3R-specific PI3K complex terms must not be propagated
  to SOCS proteins, and SOCS cytokine/CRL5 terms must not be propagated to the PIK3R subfamilies.
