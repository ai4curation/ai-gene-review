family_id: PANTHER:PTHR45832
family_name: SERINE/THREONINE-PROTEIN KINASE SAMKA-RELATED-RELATED
preferred_name: PAK/STE20 serine/threonine kinase family
review_status: COMPLETE
summary: PTHR45832 contains PAK/STE20-related serine/threonine kinases. The human PAK1, PAK2 and
  PAK3 proteins form the group I p21-activated kinase branch, share CDC42/RAC-regulated
  serine/threonine kinase activity, and signal through cytoskeletal, MAPK and adhesion pathways. The
  larger family also contains fungal STE20/CLA4-like kinases and the human group II PAK4, PAK5 and
  PAK6 branches, so fungal stress-response and narrow neuronal terms require branch-level checks.
functional_coherence: HETEROGENEOUS
coherence_reason: 'The family is coherent for active serine/threonine phosphorylation across active branches
  but is heterogeneous for biological-process annotations: starvation responses are fungal/amoebozoan,
  axonogenesis is a neuronal metazoan context, and group II PAKs diverge from the PAK1/2/3 group I branch.'
reference_protein:
