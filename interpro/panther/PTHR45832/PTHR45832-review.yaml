    gene_symbol: PAK2
    organism: Homo sapiens
    gene_review: genes/human/PAK2/PAK2-ai-review.yaml
  diverged_from_family: true
  divergence_description: PAK2 is a ubiquitous group I PAK that has caspase-cleaved
    apoptotic-fragment biology and lacks the strong neuron-specific axonogenesis profile of
    PAK1/PAK3.
- subfamily_id: PANTHER:PTHR45832:SF11
  label: SERINE_THREONINE-PROTEIN KINASE PAK 3
  description: PAK3 branch, represented in human by the neuronal group I kinase PAK3.
  representative_members:
  - id: UniProtKB:O75914
    label: PAK3
    gene_symbol: PAK3
    organism: Homo sapiens
    gene_review: genes/human/PAK3/PAK3-ai-review.yaml
  diverged_from_family: true
  divergence_description: PAK3 is enriched in neurons and carries dendrite, spine and synaptic
    functions that should not be propagated blindly to all PAK/STE20 members.
