family_id: PANTHER:PTHR45678
family_name: MITOCHONDRIAL 2-OXODICARBOXYLATE CARRIER 1-RELATED
preferred_name: Mitochondrial SLC25 aspartate/glutamate, glutamate and 2-oxodicarboxylate carriers
summary: >-
  PTHR45678 is a eukaryotic mitochondrial-carrier family that contains animal
  and fungal aspartate/glutamate carriers, animal glutamate carriers, and the
  fungal 2-oxodicarboxylate carriers Odc1 and Odc2. The broad eukaryotic
  mitochondrial-inner-membrane and substrate-transporter PAINT assertions are
  sound for the yeast ODC branch, but the narrower aspartate/glutamate and
  malate-aspartate-shuttle assertions should stay on the AGC/glutamate-carrier
  child PTN000640307 and not propagate to the fungal ODC clade.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family root groups mitochondrial substrate carriers, but substrate
  specificity differs by branch: PTHR45678:SF1 ODC proteins exchange
  2-oxoadipate and 2-oxoglutarate, PTHR45678:SF9/SF7/SF12 AGC proteins
  exchange aspartate and glutamate, and PTHR45678:SF3/SF11 glutamate carriers
  transport glutamate.
