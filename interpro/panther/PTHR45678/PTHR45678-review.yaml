  - id: UniProtKB:O75746
  - id: UniProtKB:Q9UJS0
  assessment: UNRESOLVED
  assessment_reason: >-
    The malate-aspartate shuttle process depends on AGC-type
    aspartate/glutamate exchange, and reconstituted S. cerevisiae Odc1/Odc2
    primarily exchange 2-oxoadipate and 2-oxoglutarate, with malate supporting
    2-oxoglutarate uptake only less strongly. However, the PomBase GO-CAM
    explicitly models the S. pombe ODC ortholog odc1 in the shuttle with
    aspartate:glutamate, proton antiporter and oxoglutarate:malate antiporter
    activities. Both modelled shuttle edges are the same PTN000640306 IBA that
    this row assesses, while the ISS evidence from S. cerevisiae Odc2 supports
    only mitochondrial inner membrane localization. Keep the row flagged, but
    do not emit a MOVE_IBD request until that counter-model is adjudicated.
  supported_by:
