family_id: PANTHER:PTHR45678
family_name: MITOCHONDRIAL 2-OXODICARBOXYLATE CARRIER 1-RELATED
preferred_name: Mitochondrial SLC25 aspartate/glutamate, glutamate and 2-oxodicarboxylate carriers
summary: >-
  PTHR45678 is a eukaryotic mitochondrial-carrier family that contains fungal
  and animal aspartate/glutamate carriers and animal glutamate carriers. The
  broad eukaryotic mitochondrial-inner-membrane and substrate-transporter PAINT
  assertions are sound, but the narrower aspartate/glutamate transport
  assertions at PTN000640306 should stay on the AGC/glutamate-carrier child
  PTN000640307 and not propagate to the separate fungal ODC clade that PAINT
  also places below PTN000640306.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family root groups mitochondrial substrate carriers, but substrate
  specificity differs by branch: PTHR45678:SF9/SF7/SF12 AGC proteins exchange
  aspartate and glutamate, PTHR45678:SF3/SF11 glutamate carriers transport
  glutamate, and the PAINT fungal ODC clade PTN002903833 exchanges
  2-oxoadipate and 2-oxoglutarate even though current member inventories put
  yeast ODC1 and ODC2 in PTHR46356.
