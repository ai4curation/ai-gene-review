family_id: PANTHER:PTHR43874
family_name: TWO-COMPONENT RESPONSE REGULATOR
preferred_name: Plant receiver-domain response regulators (type-A ARRs, type-B ARRs and pseudo-response regulators)
summary: >-
  Land-plant (Viridiplantae) family of nuclear proteins that carry an N-terminal
  receiver (CheY-like) domain. In PANTHER 19 the tree has 1,247 leaves; all but two
  bacterial leaves descend from one green-plant duplication node (PTN008123536). That node
  splits into three functionally distinct clades.
  (1) Type-B ARRs (clade PTN000724199; Arabidopsis ARR1, ARR2, ARR10, ARR11, ARR12,
  ARR14, ARR18-ARR21, ARR13 and the poorly characterized APRR4/APRR8). These are the
  transcription factors of cytokinin two-component signaling. The phospho-accepting
  aspartate of the receiver is phosphorylated by AHP phosphotransfer proteins, which
  relieves autoinhibition of a C-terminal Myb-related GARP (B-motif) domain that binds
  DNA and activates primary cytokinin-response genes.
  (2) Type-A ARRs (clade PTN008685986; Arabidopsis ARR3-ARR9 and ARR15-ARR17). These
  are small proteins of a receiver domain with short extensions and no DNA-binding domain.
  They are cytokinin-induced primary targets of type-B ARRs and act as partially redundant
  negative-feedback regulators of the phosphorelay. ARR3/ARR4 also modulate circadian
  period and phytochrome B signaling.
  (3) Pseudo-response regulators. PRR3/5/7/9 form clade PTN008686031 and TOC1/PRR1
  forms clade PTN008685974. Their pseudo-receiver lacks the phosphorylatable aspartate.
  A C-terminal CCT motif binds DNA, and these proteins are core transcriptional repressors
  of the circadian clock.
  DNA binding is therefore present in two of the three clades but through unrelated
  domains (GARP in type-B ARRs, CCT in PRRs), and it is absent from type-A ARRs. The
  cytokinin-pathway role is shared by type-A and type-B ARRs but not by PRRs. The clock
  role is a PRR/TOC1 property, with a minor ARR3/ARR4 contribution.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The three clades share a receiver-type domain and nuclear localization, but differ in
  molecular function. Type-B ARRs are phospho-activated GARP DNA-binding transcription
  activators. Type-A ARRs are receiver-only negative-feedback regulators with no
  DNA-binding domain. PRR/TOC1 proteins are phospho-independent CCT DNA-binding clock
  repressors. Only nucleus is safe family-wide. DNA-binding and transcription terms are
  safe for the type-B and PRR/TOC1 clades but not for type-A. Cytokinin signaling is safe
  for type-A and type-B but not for PRRs. Circadian rhythm is safe for PRR/TOC1 and for
  ARR3/ARR4 (SF50) only. The PANTHER subfamily (SF) axis maps cleanly onto these
  clades: every SF except SF7 and SF125 lies wholly inside one of the four clades, and
  those two each have only one or two leaves outside it.
