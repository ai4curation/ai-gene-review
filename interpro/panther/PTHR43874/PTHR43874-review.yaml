  id: UniProtKB:Q940D0
  label: Two-component response regulator ARR1
  gene_symbol: ARR1
  organism: Arabidopsis thaliana
  gene_review: genes/ARATH/ARR1/ARR1-ai-review.yaml

subfamilies:
  - subfamily_id: PANTHER:PTHR43874:SF119
    label: TWO-COMPONENT RESPONSE REGULATOR ARR1
    description: >-
      Arabidopsis ARR1, the founding type-B ARR. It is a cytokinin-activated GARP-domain
      transcription activator of primary response genes, inside the type-B clade
      PTN000724199 (46 SFs, 580 leaves). It is the principal type-B ARR, with ARR10 and
      ARR12, in root and shoot cytokinin responses.
    representative_members:
      - id: UniProtKB:Q940D0
        label: Two-component response regulator ARR1
        gene_symbol: ARR1
        organism: Arabidopsis thaliana
        gene_review: genes/ARATH/ARR1/ARR1-ai-review.yaml
    supported_by:
      - reference_id: PMID:18065689
        supporting_text: >-
          The 11 type-B ARRs contain C-terminal output domains that have DNA binding and
          transactivating activity
  - subfamily_id: PANTHER:PTHR43874:SF209
    label: TWO-COMPONENT RESPONSE REGULATOR ARR12
    description: >-
      Arabidopsis ARR12, a type-B ARR that acts redundantly with ARR1 and ARR10. It sits
      in the eudicot ARR10/ARR12/ARR18 clade PTN008123190, which carries a root-meristem
      IBD.
    representative_members:
      - id: UniProtKB:P62598
        label: Two-component response regulator ARR12
        gene_symbol: ARR12
        organism: Arabidopsis thaliana
        gene_review: genes/ARATH/ARR12/ARR12-ai-review.yaml
  - subfamily_id: PANTHER:PTHR43874:SF7
    label: TWO-COMPONENT RESPONSE REGULATOR ARR10
    description: >-
      Type-B ARR10 and its orthologs (rice RR24/RR25). The GARP domain of ARR10 was the
      first shown to bind DNA directly. The subfamily also labels two bacterial leaves
      (Rhodopirellula) that sit outside the plant node PTN008123536 at a
      horizontal-transfer root, so they inherit none of the plant IBDs.
    representative_members:
      - id: UniProtKB:O49397
        label: Two-component response regulator ARR10
        gene_symbol: ARR10
        organism: Arabidopsis thaliana
    supported_by:
      - reference_id: PMID:15173562
        supporting_text: >-
          First, all type-B ARRs contain a GARP domain shown capable of directly binding
          DNA in studies of ARR10
  - subfamily_id: PANTHER:PTHR43874:SF94
    label: TWO-COMPONENT RESPONSE REGULATOR ARR5
    clade_node_id: PANTHER:PTN008685986
    description: >-
      Arabidopsis ARR5, a type-A ARR. The type-A clade PTN008685986 (Streptophyta, 403
      leaves, 35 SFs) contains every Arabidopsis type-A ARR (ARR3-ARR9, ARR15-ARR17)
      and the rice type-A ORRs.
    representative_members:
      - id: UniProtKB:Q9SB04
        label: Two-component response regulator ARR5
        gene_symbol: ARR5
        organism: Arabidopsis thaliana
        gene_review: genes/ARATH/ARR5/ARR5-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      Type-A ARRs are receiver domains with short extensions and no GARP or CCT
      DNA-binding output domain. They are cytokinin-induced, partially redundant negative
      regulators of the phosphorelay whose stability depends on receiver phosphorylation.
      The DNA-binding transcription factor terms asserted at the family root node
      PTN008123536 must not descend into this clade.
    supported_by:
      - reference_id: PMID:15173562
        supporting_text: >-
          The type-A response regulators are relatively small, containing the receiver
          domain common to response regulators along with short N- and C-terminal
          extensions.
      - reference_id: PMID:18065689
        supporting_text: >-
          At least 8 of the 10 type-A ARR s act as partially redundant negative regulators
          of cytokinin signaling
  - subfamily_id: PANTHER:PTHR43874:SF50
    label: TWO-COMPONENT RESPONSE REGULATOR ARR3-RELATED
    description: >-
      Type-A ARR3 and ARR4. Within the type-A clade these are the paralogs with a
      cytokinin-independent role in circadian period (arr3,4 long period) and, for ARR4,
      phytochrome B signaling.
    representative_members:
      - id: UniProtKB:O82798
        label: Two-component response regulator ARR4
        gene_symbol: ARR4
        organism: Arabidopsis thaliana
      - id: UniProtKB:Q9ZWS9
        label: Two-component response regulator ARR3
        gene_symbol: ARR3
        organism: Arabidopsis thaliana
    diverged_from_family: true
    divergence_description: >-
      Type-A (no DNA-binding domain), as for SF94. The circadian role is specific to this
      pair among the type-A ARRs.
    supported_by:
      - reference_id: PMID:16326927
        supporting_text: >-
          Among double mutant combinations between gene pairs with the highest similarity
          ( ARR3 and ARR4 , ARR5 and ARR6 , ARR8 and ARR9 ), only the arr3,4 double mutant
          showed a striking long period
  - subfamily_id: PANTHER:PTHR43874:SF95
    label: TWO-COMPONENT RESPONSE REGULATOR-LIKE APRR5
    clade_node_id: PANTHER:PTN008686031
    description: >-
      PRR5, in the PRR3/5/7/9 clade PTN008686031 (Streptophyta, 195 leaves, 9 SFs). PRR9,
      PRR7 and PRR5 are sequential day-phase transcriptional repressors of CCA1/LHY that
      bind target promoters through the CCT motif and recruit TOPLESS.
    representative_members:
      - id: UniProtKB:Q6LA42
        label: Two-component response regulator-like APRR5
        gene_symbol: PRR5
        organism: Arabidopsis thaliana
        gene_review: genes/ARATH/PRR5/PRR5-ai-review.yaml
    supported_by:
      - reference_id: PMID:23027938
        supporting_text: >-
          A transient expression assay and ChIP-quantitative PCR assay using mutated PRR5
          indicated that PRR5 associates with target DNA through binding at the CCT motif
          in vivo.
  - subfamily_id: PANTHER:PTHR43874:SF125
    label: TWO-COMPONENT RESPONSE REGULATOR-LIKE APRR7
    description: PRR7 and its orthologs (rice PRR73), PRR3/5/7/9 clade.
    representative_members:
      - id: UniProtKB:Q93WK5
        label: Two-component response regulator-like APRR7
        gene_symbol: PRR7
        organism: Arabidopsis thaliana
        gene_review: genes/ARATH/PRR7/PRR7-ai-review.yaml
  - subfamily_id: PANTHER:PTHR43874:SF146
    label: TWO-COMPONENT RESPONSE REGULATOR-LIKE APRR9
    description: PRR9 and its orthologs (rice PRR95), PRR3/5/7/9 clade.
    representative_members:
      - id: UniProtKB:Q8L500
        label: Two-component response regulator-like APRR9
        gene_symbol: PRR9
        organism: Arabidopsis thaliana
        gene_review: genes/ARATH/PRR9/PRR9-ai-review.yaml
  - subfamily_id: PANTHER:PTHR43874:SF1
    label: TWO-COMPONENT RESPONSE REGULATOR-LIKE APRR1
    clade_node_id: PANTHER:PTN008685974
    description: >-
      TOC1/PRR1 and its orthologs. This is the earliest-diverging clade under
      PTN008123536 (Viridiplantae, 66 leaves, 5 SFs). TOC1 is an evening-phase clock
      repressor that binds DNA through its CCT domain.
    representative_members:
      - id: UniProtKB:Q9LKL2
        label: Two-component response regulator-like APRR1
        gene_symbol: TOC1
        organism: Arabidopsis thaliana
        gene_review: genes/ARATH/TOC1/TOC1-ai-review.yaml
    supported_by:
      - reference_id: PMID:22315425
        supporting_text: >-
          Purified TOC1 binds directly to DNA through its CCT domain, which is similar to
          known DNA-binding domains.

