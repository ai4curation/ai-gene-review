  name:
    name: CUT Homeobox Domain-Containing Protein
    short: CUT_Homeobox
  description:
  - text: This family of proteins includes transcriptional activators that bind to
      specific DNA consensus sequences to regulate gene expression. Members of this
      family are involved in various biological processes, including liver gene transcription,
      sex determination, X chromosome dosage compensation, and cell-fate specification.
      They recognize and bind to distinct DNA motifs, which can vary slightly among
      different family members, to modulate the transcription of target genes such
      as HNF3B and TTR. Some proteins within this family are also implicated in the
      development of the endoderm and may have differential DNA-binding affinities
      based on target sequences and protein isoforms.
