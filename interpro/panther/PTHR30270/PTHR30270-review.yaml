    label: Bacteria
  evidence: IBD
  paint_snapshot: '20240912'
  seeds:
  - id: UniProtKB:P0AGG0
  assessment: SOUND
  assessment_reason: >-
    A single seed is enough here: E. coli thiL mutants lack TMP kinase activity, and the
    activity and mechanism are confirmed by ortholog structures (A. aeolicus, A. baumannii).
    The node is restricted to Bacteria, which carry the canonical SF0 ThiL; KT2440 ThiL
    (SF0) accepts the activity in its review. The archaeal SF3 reference protein has no IBA
    from this node, consistent with the bacterial scope.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30270/PTHR30270-paint.tsv
    supporting_text: "PTHR30270\tPTN000767575\tGO:0009030\tF\tIBD\tfalse"
  - reference_id: PMID:6284709
    supporting_text: >-
      the former lacks thiamine kinase activity, and the latter
      lacks thiamine monophosphate kinase activity
  - reference_id: PMID:18311927
    supporting_text: >-
      Thiamin monophosphate kinase (ThiL) catalyzes the ATP-dependent phosphorylation
      of thiamin monophosphate (TMP) to form thiamin pyrophosphate (TPP), the active
      form of vitamin B 1.
- node_id: PANTHER:PTN000767575
  asserted_term:
    id: GO:0009228
    label: thiamine biosynthetic process
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  evidence: IBD
  paint_snapshot: '20240912'
  seeds:
  - id: UniProtKB:P0AGG0
  assessment: SOUND
  assessment_reason: >-
    ThiL performs the final step of the bacterial de novo thiamine cofactor pathway, so the
    broad process is true for the clade. The gene reviews keep it as non-core because
    GO:0009229 (thiamine diphosphate biosynthetic process), asserted at the same node,
    describes the ThiL step precisely; GO:0009229 is not a descendant of GO:0009228, so
    both node terms stand.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30270/PTHR30270-paint.tsv
    supporting_text: "PTHR30270\tPTN000767575\tGO:0009228\tP\tIBD\tfalse"
  - reference_id: PMID:8432721
    supporting_text: >-
      Two precursors [4-methyl-5-(beta-hydroxyethyl)thiazole monophosphate and
      4-amino-5-hydroxymethyl-2-methylpyrimidine pyrophosphate] are coupled to form
      thiamine monophosphate, which is then phosphorylated to make thiamine
      pyrophosphate.
- node_id: PANTHER:PTN000767575
  asserted_term:
    id: GO:0009229
    label: thiamine diphosphate biosynthetic process
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  evidence: IBD
