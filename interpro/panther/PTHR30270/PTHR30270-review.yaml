family_id: PANTHER:PTHR30270
family_name: THIAMINE-MONOPHOSPHATE KINASE
preferred_name: Thiamine-monophosphate kinase (ThiL) family
summary: >-
  PurM-like ATP-binding-superfamily kinases that phosphorylate thiamine monophosphate (TMP)
  to thiamine diphosphate (TPP), the last step of de novo TPP synthesis in bacteria and
  archaea. Members are homodimers with N- and C-terminal PurM-like domains that bind ATP,
  TMP and several Mg2+ ions in the interdomain cleft; structures of the Aquifex aeolicus and
  Acinetobacter baumannii enzymes support direct in-line transfer of the ATP
  gamma-phosphate. SF0 holds bacterial ThiL (E. coli, P. putida) and some archaeal
  proteins, SF3 is an archaeal ThiL group, and SF2 is a small group that PANTHER names as
  hydrogenase expression/formation proteins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  TMP kinase activity is established genetically for E. coli ThiL (SF0) and structurally for
  bacterial SF0 orthologs, and is inferred for the archaeal SF3 group. SF2 has no
  characterised member and is named by PANTHER for a different function. Some archaea
  carry several ThiL-like paralogs (M. jannaschii has members in SF0, SF2 and SF3), so not
  every archaeal member need be a TMP kinase.
