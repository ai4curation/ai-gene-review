  seeds:
  - id: UniProtKB:P0AGG0
  assessment: SOUND
  assessment_reason: >-
    TMP to TPP is the ThiL reaction, so thiamine diphosphate biosynthesis is the exact
    process for every bacterial ThiL below the node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30270/PTHR30270-paint.tsv
    supporting_text: "PTHR30270\tPTN000767575\tGO:0009229\tP\tIBD\tfalse"
  - reference_id: PMID:30867460
    supporting_text: >-
      Thiamine monophosphate kinase (ThiL) catalyzes the last step of thiamine
      pyrophosphate (TPP) synthesis, the ATP-dependent phosphorylation of
      thiamine monophosphate (TMP) to thiamine pyrophosphate.
