    label: single fertilization
  scope: UNRESOLVED
  scope_reason: CUB domains occur in reproductive recognition proteins but also in complement, matrix
    processing and other extracellular systems. The short sponge CUB-domain target does not establish
    a fertilization role, and the original CUB comparison explicitly describes functionally diverse proteins.
    The full set of reproductive branches is unresolved; sperm-associated examples cannot define the whole
    family.
