family_id: PANTHER:PTHR24251
family_name: OVOCHYMASE-RELATED
preferred_name: CUB-domain extracellular and membrane proteins
summary: CUB domains occur in extracellular recognition proteins, cubilin, procollagen-processing factors,
  metalloproteases and membrane receptors. A common extracellular interaction module is distinct from
  the activity of additional catalytic domains or a reproductive role.
functional_coherence: HETEROGENEOUS
coherence_reason: The sponge target is a short CUB-domain protein. The domain is compatible with an extracellular
  interaction, but single fertilization is not a family-wide process. Ovomucin/ovochymase-style names
  must not imply protease activity or fertilization for cubilin, procollagen enhancers and unrelated CUB
  architectures.
