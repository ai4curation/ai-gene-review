family_id: PANTHER:PTHR11632
family_name: SUCCINATE DEHYDROGENASE 2 FLAVOPROTEIN SUBUNIT
preferred_name: Succinate dehydrogenase / fumarate reductase flavoprotein family
summary: >-
  Covalent-FAD flavoproteins that oxidize succinate to fumarate (complex II SDHA: S. cerevisiae SDH1
  and its paralog YJL045W, S. pombe sdh1, human SDHA, bacterial SdhA) or reduce fumarate (bacterial
  FrdA). PANTHER also places the alpha subunit of adenylylsulfate reductase (AprA) of sulfate-reducing
  bacteria in this family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Succinate dehydrogenase activity holds for SF51, SF53 and SF72. Fumarate reductases (SF82, SF71)
  run the reverse reaction, and SF51 also includes Desulfovibrio AprA, which reduces adenylylsulfate.
