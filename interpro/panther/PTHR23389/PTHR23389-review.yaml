family_id: PANTHER:PTHR23389
family_name: CHROMOSOME TRANSMISSION FIDELITY FACTOR 18
preferred_name: NAD-dependent DNA ligase (LigA) and eukaryotic RFC large-subunit family
summary: >-
  A PANTHER family that joins two unrelated functional groups. Subfamily SF9 (DNA LIGASE) holds the
  bacterial and archaeal NAD+-dependent DNA ligases (LigA; E. coli ligA, P. putida ligA, M. tuberculosis
  ligA, Haloferax volcanii ligN), which seal nicks between 5'-phosphoryl and 3'-hydroxyl DNA ends
  during replication and repair, including the final step of nucleotide-excision repair. The other
  populated subfamilies hold the large subunits of eukaryotic clamp loaders and unloaders: replication
  factor C subunit 1 (SF6, RFC1), CTF18 (SF3), and ATAD5/Elg1 (SF21, SF11). These are AAA+ ATPase
  subunits of PCNA-loading or PCNA-unloading complexes and have no ligase activity. NAD+-dependent
  ligase activity is therefore a property of SF9 only.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Of the 833 reviewed members in the cached inventory, 762 are in SF9 and all of them are named DNA
  ligase (747 "DNA ligase", 6 "DNA ligase 1", 6 "DNA ligase 2", 3 "DNA ligase A"; genes ligA, ligA1,
  ligA2 or ligN). The remaining 71 are eukaryotic clamp-loader/unloader large subunits: 64 in SF6
  (replication factor C large subunit / subunit 1), 2 in SF3 (CTF18), 4 in SF21 (ATAD5 and Elg1)
  and 1 in SF11 (Elg1). PAINT keeps the two groups apart: the ligase activity is placed on a bacterial
  node (PTN000121726) and the clamp-loader/unloader terms on eukaryotic nodes (PTN000406286 and
  its descendants). E. coli LigB, a second NAD+-dependent ligase, is not in this family (UniProt
  places it in PTHR47810).
