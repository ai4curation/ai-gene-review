    id: GO:0003911
    label: DNA ligase (NAD+) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The bacterial nucleotide-excision repair module asserts this activity for its LigA step,
    grounded to PTHR23389:SF9. Every one of the 762 reviewed SF9 members is a DNA ligase (LigA,
    LigA1/LigA2 paralogs, or archaeal LigN), and PAINT places the activity on the bacterial LigA
    node. The activity is false for the eukaryotic clamp-loader/unloader subfamilies (SF6, SF3,
    SF21, SF11), which are AAA+ PCNA-loading or unloading subunits.
  applicable_subfamilies:
  - id: PANTHER:PTHR23389:SF9
    label: DNA LIGASE
  supported_by:
