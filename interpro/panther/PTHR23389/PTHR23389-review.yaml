notes: >-
  Both NER-module LigA representatives (E. coli P15042 and P. putida Q88F25) are SF9 members in the
  PANTHER 19.0 member index and accept GO:0003911 as a core function in their gene reviews. A module
  that grounds a ligase step should use PTHR23389:SF9, never the family id alone, because the family
  id also takes in the eukaryotic RFC1, CTF18 and ATAD5/Elg1 clamp-loader subunits. The two
  UNRESOLVED nodes concern only the eukaryotic clade and do not affect the LigA claim.
