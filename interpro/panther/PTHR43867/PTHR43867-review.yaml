notes: 'All five frozen PAINT assertions are assessed. COMPLETE describes the bounded audit, not resolution
  of every location or substrate-specific branch. Official labels are copied from panther.obo; the fetched
  metadata contains an unreviewed generated description and is not evidence for a uniform lipid-carrier
  mechanism. No IRD or IKR occurs in the frozen five-row snapshot. P62517 appearing as its own OPG seed
  is normal PAINT descendant evidence, not circularity. PMID12027885 is abstract-only: native cyclic versus
  heterologous linear observations are retained at that resolution, without invented constructs or individual
  cyclization chemistry. PMID39145657 is full text and explicitly uses NA1000; morphology is not a product-resolved
  enzymatic assay. No raw, provider or gene-review files were changed.'
