family_id: PANTHER:PTHR43867
family_name: CELLULOSE SYNTHASE CATALYTIC SUBUNIT A [UDP-FORMING]
preferred_name: Membrane-associated GT2 enzymes including OpgH, cellulose synthases and lipid glucosyltransferases
summary: PTHR43867 contains membrane-associated glycosyltransferases with different acceptors and products.
  OpgH proteins contribute to osmoregulated periplasmic glucan synthesis, cellulose synthases polymerize
  beta-1,4 glucan, and the same nominal cellulose subfamily includes a characterized diacylglycerol glucosyltransferase.
  Shared hexosyl transfer does not confer a shared polymer or physiological process.
functional_coherence: HETEROGENEOUS
coherence_reason: Actual tree and current experimentally annotated members demonstrate OPG, cellulose
  and glucosyl-diacylglycerol pathways. Even SF2 is heterogeneous in product specificity; official labels
  cannot replace member evidence.
