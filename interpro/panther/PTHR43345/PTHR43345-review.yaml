  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe, as a contribution to the heteromeric enzyme, for bacterial LeuD (SF5), archaeal LeuD
    (SF9), plant SSU1 (SF2) and the Met-chain-elongation paralogs SSU2/SSU3 (SF7, SF8), which keep
