notes: >-
  PTN002879868 receivers were read from the PAINT UniProt GAF. They include E. coli, Salmonella,
  B. subtilis and M. tuberculosis LeuD, archaeal LeuD (Q58673, Q8TU71, Q5JFV7), Arabidopsis
  SSU1/SSU2/SSU3, and the methanogen HacB proteins Q58667 (M. jannaschii), Q8TJM9 and Q8TRF7
  (M. acetivorans). Thermus HacB (Q9ZND9) is not among the receivers. Only Q58667 is excepted,
  because it is the HacB with direct biochemistry. The M. acetivorans HacB1/HacB2 assignments in
  UniProt rest on similarity. UniProt's function text for Q58667 also states that the enzyme
  cannot dehydrate 2-isopropylmalate or 3-isopropylmalate (citing PMID:18765671 and
  PMID:20170198). The flexible substrate-recognition loop is not recorded as a residue site,
  because the loop positions were not checked against the anchor sequence. He et al. (PMID:20663849)
  number the Arabidopsis small subunits differently (AtLeuD1-3) from the SSU1-3 names used here.
