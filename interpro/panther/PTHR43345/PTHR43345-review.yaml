  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node is seeded across bacteria, archaea and plants, and the placement is right for LeuD
    subunits. The SSU3 gene review accepts this IBA because SSU2/SSU3 keep IPM activity. But the
    methanogen homoaconitase small subunits under this node also inherit it: M. jannaschii HacB
    (MJ1271, Q58667) is a reviewed receiver, as are M. acetivorans HacB1/HacB2. The MJ1003/MJ1271
    homoaconitase does not use IPMI-type substrates, and only loop mutations in MJ1271 turned it
    into an efficient IPMI. An IRD on the methanogen HacB branch is needed. No subfamily is listed
    as affected because HacB shares SF2 with plant SSU1.
