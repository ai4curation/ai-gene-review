family_id: PANTHER:PTHR43345
family_name: 3-ISOPROPYLMALATE DEHYDRATASE SMALL SUBUNIT 2-RELATED-RELATED
preferred_name: LeuD/HacB small subunits of heteromeric aconitase-family hydro-lyases (isopropylmalate isomerase and homoaconitase)
summary: >-
  Small subunits (LeuD-type, aconitase domain-4 homologs) of heteromeric [4Fe-4S] hydro-lyases in
  bacteria, archaea and plants. Paired with a LeuC-type large subunit (PTHR43822), the small
  subunit forms part of the active site, and its flexible substrate-recognition loop determines
  which 2-alkylmalate the enzyme isomerizes. Most members are LeuD subunits of
  3-isopropylmalate isomerase (IPMI) in leucine biosynthesis, and archaeal IPMI also acts on
  citramalate in isoleucine biosynthesis. Some paralogs have changed substrate. Methanogen HacB
  forms homoaconitase for coenzyme B biosynthesis and does not dehydrate isopropylmalate.
  Arabidopsis has three small subunits. SSU1 is needed for leucine synthesis, while the
  Brassicaceae duplicates SSU2 and SSU3 work in methionine chain elongation for aliphatic
  glucosinolates. Fungal isopropylmalate isomerase has no separate small subunit, because its
  LeuD region is fused into the LEU1/leu2 chain (PTHR43822).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Isopropylmalate isomerase small-subunit function holds for the bulk of the family (SF5
  bacterial LeuD, SF9 archaeal LeuD, plant SSU1 in SF2). The exceptions are the methanogen
  homoaconitase small subunits (M. jannaschii HacB/MJ1271 in SF2, Thermus HacB in SF10), which
  have homoaconitase rather than IPMI specificity. The plant SSU2 (SF7) and SSU3 (SF8) keep IPMI
  activity in vitro but have been recruited to Met chain elongation and are dispensable for
  leucine synthesis. SF2 mixes plant SSU1 with methanogen HacB, so these exceptions cannot be
  drawn along subfamily lines.
