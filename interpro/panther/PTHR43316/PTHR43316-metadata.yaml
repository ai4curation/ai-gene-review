  name:
    name: S-2-haloalkanoic acid dehalogenase
    short: S-2-haloacid_dehalogenase
  description:
  - text: This family of proteins includes enzymes that catalyze the hydrolytic dehalogenation
      of small (S)-2-haloalkanoic acids, producing the corresponding (R)-2-hydroxyalkanoic
      acids. These enzymes are active on short-chain acids, ranging from C(2) to C(4),
      and they operate with inversion of configuration at the second carbon atom.
      They are specific for the S-isomer of 2-halogenated carboxylic acids, such as
      2-chloropropionic acid, converting it to the R-lactate form. Members of this
      family are part of the HAD-like hydrolase superfamily and are characterized
      by their ability to perform these dehalogenation reactions, which are important
      in the metabolism of halogenated compounds.
