term_assessments:
- assessed_term:
    id: GO:0004169
    label: dolichyl-phosphate-mannose-protein mannosyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    GO:0004169 is safe for the PTN001295889 eukaryotic node but not family-wide: the
    PTHR10050 root also covers bacterial Pmt enzymes that use polyprenol-phosphate-mannose
    rather than Dol-P-Man. Because SF46 mixes human POMT2, fungal PMT2-like enzymes and
    bacterial Pmt enzymes, the safe eukaryotic scope is node-based rather than expressible
    as a whole PANTHER subfamily.
- assessed_term:
    id: GO:0035269
    label: protein O-linked glycosylation via mannose
  scope: FAMILY_WIDE
  scope_reason: >-
    The conserved PTHR10050 chemistry initiates O-linked mannosylation of protein
    substrates in eukaryotic and bacterial members.
- assessed_term:
    id: GO:0005783
    label: endoplasmic reticulum
  scope: UNRESOLVED
  scope_reason: >-
    Endoplasmic-reticulum localization is sound for the PTN001295889 eukaryotic node
    but should not be asserted across the whole family because PTHR10050 also contains
    bacterial Pmt leaves. The safe scope is node-based rather than expressible as a
    PANTHER subfamily: SF46 mixes human POMT2/fungal PMT2-like members with bacterial
    Pmt enzymes.
