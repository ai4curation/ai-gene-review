family_id: PANTHER:PTHR10050
family_name: DOLICHYL-PHOSPHATE-MANNOSE--PROTEIN MANNOSYLTRANSFERASE
preferred_name: PMT/POMT protein O-mannosyltransferase family
summary: >-
  PTHR10050 contains integral membrane protein O-mannosyltransferases that transfer mannose
  from a polyprenol- or dolichyl-phosphate mannose donor to serine or threonine residues on
  secretory-pathway protein substrates. Metazoan POMT1 and POMT2 belong to paralogous PTHR
  subfamilies and form an obligate ER complex that initiates O-mannosylation of
  alpha-dystroglycan and a narrow set of mucin-like clients, while fungal members expanded
  into PMT1/PMT2/PMT4/PMT6-like paralog groups and bacterial Pmt proteins sit as deep
  outgroups in the POMT2/PMT2-like side of the tree.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Protein O-mannosyltransferase activity and protein O-linked glycosylation via mannose are
  safe at the PTHR10050 root. Endoplasmic-reticulum localization is restricted to the
  eukaryotic PMT/POMT clade under PTN001295889 and must not be propagated to the bacterial
  Pmt leaves.
