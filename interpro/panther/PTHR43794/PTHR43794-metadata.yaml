  name:
    name: 5-Methylthioadenosine/S-adenosylhomocysteine deaminase
    short: MTA/SAH_deaminase
  description:
  - text: The MTA/SAH deaminase family consists of enzymes that catalyze the deamination
      of 5-methylthioadenosine (MTA), S-adenosyl-L-homocysteine (SAH), and adenosine,
      producing their respective inosine analogs. These reactions are crucial for
      the recycling of S-adenosyl-L-methionine (SAM), a vital methyl group donor in
      numerous methylation reactions. The deamination process facilitates the conversion
      of SAH, a byproduct of SAM-dependent methylation, back into methionine, which
      can then be used to regenerate SAM, thereby maintaining the cellular methyl
      cycle. Some members of the family also deaminate 5'-deoxyadenosine, playing
      a role in the recycling of 5'-deoxyadenosine for the biosynthesis of aromatic
      amino acids in certain organisms. The family belongs to the metallo-dependent
      hydrolases superfamily, indicating a dependence on metal ions for catalytic
      activity.
