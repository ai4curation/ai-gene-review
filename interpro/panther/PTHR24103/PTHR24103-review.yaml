notes: 'Prompted by the Dudley-Fraser and Rittinger review (PMID:42746740) and the family-wide pseudoligase
  screen behind it (PMID:40216791). Membership comes from PANTHER 19.0 human sequence classifications.
  UniProt cross-references omit subfamilies for this family and disagree for TRIM14 (PTHR25465:SF11),
  TRIM55 and TRIM63 (PTHR24099). The PAINT tree follows PANTHER''s placement, which is why TRIM14, TRIM55
  and TRIM63 receive GO:0061630 IBA from PTN007774218. The QuickGO snapshot of 2026-10-06 shows that
  IBA on 53 human TRIM proteins (counting MEFV), including RING-less TRIM14, TRIM44, MEFV and TRIML2. BSPRY and RFPL1-4 receive
  it through the same node. Recommendations for gene level: MEFV already removes the IBA, which is consistent
  with this review. TRIM44, TRIM14, TRIML2 and BSPRY have no gene reviews; if they are reviewed, the
  IBA should be marked REMOVE (RING-less). The TRIML2 EC 2.3.2.27 in UniProt (ECO:0000305) also looks
  unsupported and could be reported to UniProt. For TRIM6, TRIM15 and TRIM22, gene reviewers should
  weigh the in vitro pseudoligase evidence and the TRIM21-confound finding against the older cell-based
  experimental annotations. PMID:40216791 does not rule out activity under specific conditions, so UNDECIDED
  or MARK_AS_OVER_ANNOTATED is more appropriate than REMOVE. The in-cell screen lists many members with
  no detectable autoubiquitination in cells (TRIMs 2-4, 7-10, 12, 15, 17, 18, 28, 33, 34, 38-40, 43,
  47, 50, 51, 54, 67-69, 72 and 77). Most of these are active in vitro, so absence of in-cell autoubiquitination
  is not evidence against activity.'
