term_assessments:
- assessed_term:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  scope: RESIDUE_DETERMINED
  scope_reason: 'Not safe family-wide. Membership in PTHR24103 does not establish E3 activity; a member
    first needs a C3HC4 RING (site ring_c3hc4). For RING-containing members the term is the default,
    and in vitro autoubiquitination has been shown directly for most of them. Five members lack the RING
    entirely and should not carry the term from PTN007774218: TRIM14, TRIM44, MEFV, TRIML2 and BSPRY.
    Four members with an intact motif are characterised pseudoligases: TRIM6, TRIM15, TRIM22 and TRIM51.
    TRIM51 has no experimental claim and should not inherit the term. TRIM6, TRIM15 and TRIM22 have
    conflicting experimental annotations and are UNRESOLVED at gene level. For untested paralogue copies
    (TRIM43B, TRIM49B/C/D1, TRIM51G, TRIM64B/C, RFPL1-4) the evidence is inheritance only. TRIM51G is
    a separate subfamily from TRIM51, and its RING status has not been determined.'
  determined_by_site: ring_c3hc4
  supported_by:
  - reference_id: PMID:40216791
    supporting_text: Here we demonstrate that the RING domains of TRIMs 6, 15, 22 and, most likely, 51
      do not catalyse canonical ubiquitination and, given their structural properties, are unlikely to
      do so under differing experimental conditions.
  - reference_id: PMID:40216791
    supporting_text: Taken together, our analyses suggest that TRIM6 and TRIM22 have structural and sequence
      features that are not compatible with canonical TRIM RING ubiquitin ligase catalytic requirements,
      although the possibility that these proteins may function under specific reaction conditions cannot
      be ruled out.
  - reference_id: PMID:40216791
    supporting_text: Indeed, all IFN-β-responsive activity of TRIMs 6 and 22 was lost when GFP-tagged
      TRIMs were purified using antibody-free ‘GFP clamp’ DARPin pull down instead of immunoprecipitation
  - reference_id: PMID:40216791
    supporting_text: However, TRIM51 did not demonstrate E3 ligase activity in vitro, whereas TRIM49 did
  - reference_id: PMID:40216791
    supporting_text: Consistent with this model, swapping the β3-β4 region from TRIM51 into TRIM49 rendered
      it inactive
  - reference_id: PMID:40216791
    supporting_text: On the other hand, auto-ubiquitination activity of TRIMs 37, 38 and 40 was detected
      by western blotting but not by ELISA
  - reference_id: PMID:42746740
    supporting_text: The presence of a conserved RING domain has led to the assumption that all TRIM proteins
      function as ubiquitin E3 ligases.
  - reference_id: PMID:19358823
    supporting_text: We also found that TRIM44 inhibited ubiquitination of terf, and thus stabilized the
      protein.
- assessed_term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  scope: RESIDUE_DETERMINED
  scope_reason: 'This is the parent of GO:0061630, and the same boundary applies. For RING-containing
    members GO:0061630 is the more informative term, since TRIM RINGs act as E3s and do not form a
    thioester intermediate. The parent adds nothing for them. For RING-less members it is as unsupported
    as the child.'
  determined_by_site: ring_c3hc4
  supported_by:
  - reference_id: PMID:42746740
    supporting_text: The existence of ligase-dead RING-containing TRIMs is mirrored by the ‘unclassified’
      TRIM class that lacks the RING domain
- assessed_term:
    id: GO:0016567
    label: protein ubiquitination
  scope: RESIDUE_DETERMINED
  scope_reason: 'The process annotation follows the activity. A RING-containing active member takes part
    in protein ubiquitination by catalysing the transfer. The RING-less and pseudoligase members that
    affect ubiquitination do it from outside the catalytic step. TRIM44 inhibits TRIM17 autoubiquitination,
    and TRIM51 represses TRIM49. That is regulation of protein ubiquitination at most, not participation.
    The electronic GO:0016567 annotation on RING-less TRIML2 (GO_REF:0000041) is therefore unsupported.'
  determined_by_site: ring_c3hc4
  supported_by:
  - reference_id: PMID:40216791
    supporting_text: Moreover, we find that TRIM51 co-overexpression represses TRIM49 ubiquitin ligase
      activity, suggesting a regulatory function for TRIM51
  - reference_id: PMID:19358823
    supporting_text: We also found that TRIM44 inhibited ubiquitination of terf, and thus stabilized the
      protein.
- assessed_term:
    id: GO:0019789
    label: SUMO transferase activity
  scope: UNRESOLVED
  scope_reason: 'SUMO E3 activity has been reported for individual TRIMs, including TRIM27/RFP in this
    family, using assays in which the TRIM motif enhances transfer from UBC9. No PAINT node asserts it
    here and no structural basis distinguishes SUMO-competent members. It is a member-level property
    and must not be propagated family-wide.'
  supported_by:
  - reference_id: PMID:20972456
    supporting_text: These TRIM proteins bind both the SUMO-conjugating enzyme Ubc9 and substrates and
      strongly enhance transfer of SUMOs from Ubc9 to these substrates.
  - reference_id: PMID:42746740
    supporting_text: These TRIMs may also carry out modification of substrates with ubiquitin-like proteins
      (UBLs), as has already been reported for several, including SUMOylation (e.g. TRIMs 11, 19, 28,
      and 32 [20–23]) and ISGylation (e.g. TRIM25 [24]).
  - reference_id: PMID:20972456
    supporting_text: To confirm that TRIM27 functions as a SUMO E3 ligase toward Mdm2, we performed in
      vitro SUMOylation assays.
