  required_for:
  - term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    strength: CONTRIBUTES
    rationale: RING E3s have no catalytic residue of their own. The zinc-stabilised RING fold, dimerised
      through flanking helices, binds the E2 and holds the E2~ubiquitin thioester closed so that it
      discharges. Without a RING there is nothing to engage the E2. Within this family no RING-less
      member has experimental ligase evidence, so the site looks necessary here. It is nevertheless
      recorded as CONTRIBUTES rather than REQUIRED because B-box-mediated ubiquitin ligase activity has
      been reported for a RING-less TRIM in a neighbouring family (TRIM16, PTHR25465), so this review
      does not assert that TRIM ligase activity is impossible without a RING.
    supported_by:
    - reference_id: PMID:42746740
      supporting_text: RING deletion or mutation at key residues (e.g. linchpin or zinc co-ordinating
        residues) can not only affect the ability of a TRIM to ubiquitinate substrates, but can also increase
        its own stability
    - reference_id: PMID:42746740
      supporting_text: The existence of ligase-dead RING-containing TRIMs is mirrored by the ‘unclassified’
        TRIM class that lacks the RING domain
    - reference_id: PMID:16297862
      supporting_text: Our results indicated that Ro52 ubiquitinates itself in cooperation with E2 ubiquitin-conjugating
        enzyme UbcH5B, thereby validating that Ro52 is a RING-finger-type E3 ubiquitin ligase.
