  assessment: NEEDS_PRUNING
  assessment_reason: 'Placing RING E3 activity at the root of the TRIM tree is defensible. The 32 seeds
    (12 mouse, 20 human) include many members with independent in vitro evidence (TRIM21, TRIM27, TRIM11, TRIM26, TRIM62),
    and the family-wide screen detected activity for most RING-containing members. The node is too
    inclusive, however, and GOA shows the IBA reaching proteins with no RING domain at all: TRIM14, TRIM44,
    pyrin/MEFV, TRIML2 and BSPRY. None of these has experimental ligase evidence, and none matches the
    C3HC4 RING consensus (site ring_c3hc4). Each needs an IRD/NOT at its own clade. TRIM51 also inherits
    the term despite direct evidence that it is a pseudoligase, and it has no experimental ligase annotation
    of its own. Three seeds, TRIM6, TRIM15 and TRIM22, were later characterised as pseudoligases (PMID:40216791).
    Their experimental annotations come from earlier cell-based studies, so the conflict between those
    annotations and the in vitro result should be resolved by gene-level curators. They are not listed
    for pruning here. The root assertion does not depend on these three seeds.'
