residue_sites:
- site_id: ring_c3hc4
  label: RING-type (C3HC4) zinc finger
  description: 'The cross-brace C3HC4 RING that binds two zinc ions and forms the E2~ubiquitin-binding
    module, anchored to TRIM21 residues 16-54 (the motif block; UniProt ZN_FING RING-type spans 16..55). C16 is the first zinc
    ligand; UniProt records C16A as abolishing TRIM21 E3 activity (MUTAGEN, several PubMed sources),
    and H33 sits in the CGH triplet whose AGA replacement also abolishes activity. The motif regex is
    the generic RING consensus C-x2-C-x(9-39)-C-x(1-3)-H-x(2-3)-C-x2-C-x(4-48)-C-x2-C. Within this family
    it matches every RING-containing member checked (TRIM5, TRIM6, TRIM11, TRIM15, TRIM22, TRIM27, TRIM49,
    TRIM51, TRIM51G) and none of the RING-less members (TRIM14, TRIM44, MEFV, TRIML2, BSPRY). The site
    is necessary but not sufficient. The pseudoligases TRIM6, TRIM15, TRIM22 and TRIM51 keep an intact
    motif, but their RINGs fail to dimerise or fail to engage E2~ubiquitin. The linchpin arginine
    (TRIM6/TRIM22 position 60) is a further determinant that is not curated here, because its position
    has not been checked across the family.'
