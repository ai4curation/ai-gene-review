family_id: PANTHER:PTHR24103
family_name: E3 UBIQUITIN-PROTEIN LIGASE TRIM
preferred_name: TRIM/RBCC family, PRY-SPRY (class IV) core with RING-less and pseudoligase members
summary: 'PTHR24103 holds most of the vertebrate tripartite motif (TRIM) proteins: an N-terminal RING
  domain, one or two B-boxes and a coiled coil, usually followed by a C-terminal PRY/SPRY (B30.2)
  domain. In PANTHER 19.0 the family has 61 human members, among them TRIM5, TRIM21, TRIM27, TRIM11,
  TRIM13, TRIM17, TRIM62, TRIM14, TRIM44, pyrin/MEFV, TRIML2, BSPRY and the RFPL proteins. Most members
  whose RING is intact are RING-type E3 ubiquitin ligases. They dimerise the RING to hold an E2~ubiquitin
  thioester in the closed, discharge-competent conformation, and they autoubiquitinate in vitro and
  in cells. TRIM21 and TRIM5alpha are the most thoroughly characterised. The activity is not universal.
  TRIM14, TRIM44, pyrin, TRIML2 and BSPRY have no RING domain and contribute B-box, coiled-coil and
  PRY/SPRY scaffolds instead. Among RING-containing members, a family-wide biochemical screen with structural
  follow-up identified pseudoligases. TRIM15 has a monomeric RING. The TRIM6 RING dimerises and the
  TRIM22 RING is in a monomer-dimer equilibrium, but both carry substitutions at the E2~ubiquitin interface, and back-mutating those positions restores
  activity. TRIM51 has a misfolded beta3-beta4 region and represses its active paralogue TRIM49. The
  TRIM44 and TRIM51 examples show that inactive members can act by regulating active paralogues.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'RING-type E3 ubiquitin ligase activity is shared by most characterised members.
  There are two kinds of exception, and both are identifiable. The first is RING-less members (TRIM14,
  TRIM44, pyrin/MEFV, TRIML2, BSPRY), which do not match the C3HC4 RING consensus at all (site ring_c3hc4
  below). The second is RING-containing pseudoligases (TRIM6, TRIM15, TRIM22, TRIM51), which keep the
  zinc ligands but have lost RING self-association or E2~ubiquitin engagement. An intact RING motif
  is therefore necessary but not sufficient. PANTHER classification and the PAINT tree also disagree
  with the UniProt/InterPro family cross-references for a few members. PANTHER 19.0 places TRIM14 here
  (PTHR24103:SF595), whereas UniProt and InterPro place it in PTHR25465, and it places TRIM55 and TRIM63
  here although UniProt places them in PTHR24099. These members inherit this family''s PAINT assertions.'
