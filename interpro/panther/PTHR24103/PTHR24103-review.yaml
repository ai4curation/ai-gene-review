- subfamily_id: PANTHER:PTHR24103:SF259
  label: E3 UBIQUITIN-PROTEIN LIGASE TRIM15
  description: TRIM15, whose RING is predicted to lack the dimerising alpha1 and alpha3 helices.
  representative_members:
  - id: UniProtKB:Q9C019
    gene_symbol: TRIM15
    organism: Homo sapiens
  diverged_from_family: true
  divergence_description: The TRIM15 RING is monomeric even at high concentration. It shows no chain
    formation or E2~ubiquitin discharge with a broad E2 panel, including UBE2N/V2, and a forced tandem-RING
    dimer stays inactive. These results contradict an earlier cell-based report of activity, which is
    the basis of an existing EXP annotation.
- subfamily_id: PANTHER:PTHR24103:SF51
  label: TRIPARTITE MOTIF-CONTAINING PROTEIN 6
  description: TRIM6, a close TRIM5/TRIM22/TRIM34 paralogue.
  representative_members:
  - id: UniProtKB:Q9C030
    gene_symbol: TRIM6
    organism: Homo sapiens
  diverged_from_family: true
  divergence_description: The TRIM6 RING dimerises but lacks the alpha2 helix and carries Q60 at the
    linchpin position. Recombinant RING and RBCC constructs are inactive with UBE2D1 and UBE2N/V2, and
    a five-residue back-mutation (including Q60R) restores activity. Earlier cell-based reports of activity
    (unanchored K48 chains activating IKKepsilon) underlie experimental annotations. The interferon-induced
    activity was traced to co-purifying TRIM21 in antibody pull-downs.
- subfamily_id: PANTHER:PTHR24103:SF650
  label: E3 UBIQUITIN-PROTEIN LIGASE TRIM22
  description: TRIM22, the interferon-induced paralogue of TRIM5 and TRIM6.
  representative_members:
  - id: UniProtKB:Q8IYM9
    gene_symbol: TRIM22
    organism: Homo sapiens
  diverged_from_family: true
  divergence_description: The TRIM22 RING is in a monomer-dimer equilibrium and carries substitutions
    at the E2~ubiquitin interface (K6, K42, Q60, K85). No autoubiquitination is detected with UBE2D1 or
    the UBE2W/UBE2N/UBE2V2 mixture, and a four-residue back-mutation restores activity. Experimental
    annotations from earlier cell-based work exist.
- subfamily_id: PANTHER:PTHR24103:SF578
  label: TRIPARTITE MOTIF-CONTAINING PROTEIN 51
  description: TRIM51, a paralogue of TRIM49 with 75% overall sequence identity.
  representative_members:
  - id: UniProtKB:Q9BSJ1
    gene_symbol: TRIM51
    organism: Homo sapiens
  diverged_from_family: true
  divergence_description: TRIM51 shows no in vitro ligase activity. Transplanting its beta3-beta4 RING
    region into TRIM49 inactivates TRIM49. TRIM51 binds TRIM49 through the coiled coil and represses
    TRIM49 activity and TRIM49-driven autophagic flux, so it acts as a regulatory pseudoligase.
