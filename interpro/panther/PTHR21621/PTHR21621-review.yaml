family_id: PANTHER:PTHR21621
family_name: RIBOSOMAL PROTEIN S6 MODIFICATION PROTEIN
preferred_name: RimK-like ATP-grasp glutamate ligase family (GshB, RimK, RIMKL)
summary: >-
  ATP-grasp ligases that attach glutamate or glycine to diverse acceptors: bacterial glutathione
  synthetase GshB (SF4), ribosomal protein bS6 glutamate ligase RimK (SF7), animal RIMKLA/RIMKLB
  (N-acetylaspartylglutamate and beta-citrylglutamate synthases), and archaeal coenzyme F420 glutamate
  ligases. Eukaryotic glutathione synthetase belongs to a different family (PTHR11130).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrates and products differ by subfamily (glutathione, bS6 polyglutamylation, NAAG or citrylglutamate,
  F420 glutamylation).
