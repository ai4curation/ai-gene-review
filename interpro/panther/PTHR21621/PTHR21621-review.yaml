family_id: PANTHER:PTHR21621
family_name: RIBOSOMAL PROTEIN S6 MODIFICATION PROTEIN
preferred_name: RimK-like ATP-grasp glutamate ligase family (GshB, RimK, RIMKL, CofF)
summary: >-
  ATP-grasp carboxylate--amine ligases that join glutamate or glycine to diverse acceptors.
  Subfamilies include bacterial glutathione synthetase GshB (SF4; E. coli GshB is the
  characterized seed), ribosomal protein bS6--L-glutamate ligase RimK (SF7; E. coli RimK),
  animal N-acetylaspartylglutamate synthase RIMKLA (SF1) and beta-citrylglutamate synthase
  RIMKLB (SF5), archaeal coenzyme F420 gamma-glutamyl ligase CofF and the LysW-dependent
  ligases LysX/ArgX (SF2), and a mixed SF0. The shared chemistry is ATP-dependent C-N bond
  formation; the substrates, and therefore the specific molecular functions, differ by
  subfamily. Eukaryotic glutathione synthetase (GSS/GSH2) is in the unrelated family
  PTHR11130.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members are ATP-grasp C-N ligases, but substrates and products differ by subfamily
  (glutathione, bS6 C-terminal glutamylation, NAAG, beta-citrylglutamate, F420 glutamylation,
  LysW-carrier ligation), so only the generic ligase chemistry is family-wide.
