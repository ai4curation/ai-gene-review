term_assessments:
- assessed_term:
    id: GO:0016791
    label: phosphatase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Generic phosphatase activity is safe for the catalytically intact branches of this family
    but not for active-site-degenerate OCA branches. The SF14 OCA6 clade needs a PAINT IKR
    because retaining a PTP-like fold is not enough to assert hydrolysis when the catalytic loop
    is degenerate and no OCA6 phosphatase assay has shown residual or repurposed activity.
  applicable_subfamilies:
