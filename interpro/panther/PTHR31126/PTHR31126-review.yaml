  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The family-root phosphatase IBD is defensible for active bacterial, plant, protist and
    fungal PFA-DSP branches, including the Siw14/Oca3 seed. It should not descend to the OCA6
    branch. S. cerevisiae Oca6 keeps the PTP/PFA-DSP fold but has a degenerate HCTNGELI
    catalytic segment instead of an intact HCxxGxHR/CX5R loop, and two 2026 papers independently
    classify Oca6 or the Saccharomyces OCA clade as predicted pseudophosphatases. The 2026
    fungal pseudophosphatome survey also warns that catalytic-motif substitutions do not prove
    loss of every possible enzymatic activity, so the recommended PAINT change is a key-residue
    loss at the SF14 clade rather than deletion of the root IBD.
