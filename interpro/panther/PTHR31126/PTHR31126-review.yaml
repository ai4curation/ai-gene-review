family_id: PANTHER:PTHR31126
family_name: TYROSINE-PROTEIN PHOSPHATASE
preferred_name: PTP/PFA-DSP phosphatases and OCA pseudophosphatases
summary: >-
  A broad PTP-like fold family that spans bacterial dual-specificity and protein-tyrosine
  phosphatases, plant and fungal PFA-DSP inositol-pyrophosphate phosphatases, and OCA-related
  pseudophosphatase branches. The family root can carry a generic phosphatase term for
  catalytically intact clades, but the Saccharomycetales OCA proteins have diverged active-site
  motifs; the OCA6-related SF14 branch should be pruned from the root phosphatase-activity IBD.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The PTP-like fold is shared, but the family combines active phosphatases with
  pseudophosphatase branches whose catalytic motifs have substitutions or deletions. The
  characterized active fungal prototype, Siw14/Oca3, is an inositol-pyrophosphate phosphatase,
  whereas the OCA clade has the same CC1 fold but is predicted to act as pseudophosphatases.
reference_protein:
  id: UniProtKB:Q12454
  label: Putative tyrosine-protein phosphatase OCA6
  gene_symbol: OCA6
  organism: Saccharomyces cerevisiae
  gene_review: genes/yeast/OCA6/OCA6-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR31126:SF14
  clade_node_id: PANTHER:PTN001258937
  label: TYROSINE-PROTEIN PHOSPHATASE OCA6-RELATED
  description: >-
    OCA6-related PTP/PFA-DSP-fold proteins. The PAINT tree places S. cerevisiae OCA6 at
    PTN001258943 within this 14-leaf clade; motif evidence indicates that the branch has lost
    the canonical CX5R catalytic loop, so phosphatase activity should not be propagated here.
  representative_members:
  - id: UniProtKB:Q12454
    label: OCA6
    gene_symbol: OCA6
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/OCA6/OCA6-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Oca6 retains the PTP/PFA-DSP fold but not an intact catalytic loop. The conserved
    phosphate-binding arginine of the CX5R motif is absent, and independent 2026 analyses
    classify Oca1/Oca2/Oca6 or the Saccharomyces OCA clade as predicted pseudophosphatases
    because of substitutions in critical active-site residues.
  supported_by:
  - reference_id: PMID:42222812
    supporting_text: Oca1, Oca2 and Oca6 contain residue substitution at the core
      catalytic motif
  - reference_id: PMID:42347707
    supporting_text: These proteins are predicted to be pseudophosphatases because they carry
      substitutions in the active site
- subfamily_id: PANTHER:PTHR31126:SF48
  label: INOSITOL PHOSPHATASE SIW14
  description: >-
    PFA-DSP inositol-pyrophosphate phosphatases, including S. cerevisiae Siw14/Oca3 and
    S. pombe siw14. The fungal GO:0052840 PAINT assertion is seeded by S. cerevisiae SIW14 and
    is a paralog-specific inositol-pyrophosphate phosphatase branch, not evidence for the OCA6
    pseudophosphatase clade.
  representative_members:
  - id: UniProtKB:P53965
    label: SIW14
    gene_symbol: SIW14
    organism: Saccharomyces cerevisiae
  - id: UniProtKB:Q9UUF3
    label: siw14
    gene_symbol: siw14
    organism: Schizosaccharomyces pombe
  diverged_from_family: false
