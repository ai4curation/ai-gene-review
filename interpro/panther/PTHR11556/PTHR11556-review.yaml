family_id: PANTHER:PTHR11556
family_name: FRUCTOSE-1,6-BISPHOSPHATASE-RELATED
preferred_name: Fructose-1,6-bisphosphatase / sedoheptulose-1,7-bisphosphatase family
summary: >-
  Class I fructose-1,6-bisphosphatases hydrolyse fructose 1,6-bisphosphate to fructose 6-phosphate,
  the committed step of gluconeogenesis that bypasses phosphofructokinase. The family contains S.
  cerevisiae FBP1, animal FBP1/FBP2, plant cytosolic and plastid FBPases, bacterial Fbp, and plastid
  sedoheptulose-1,7-bisphosphatase (Calvin cycle).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  FBPase activity is general. SF35 is named for chloroplast SBPase but is dominated by bacterial
  FBPases, so the FBPase/SBPase split is not cleanly reflected by subfamily.
