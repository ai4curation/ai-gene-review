  assessment_reason: >-
    The broad vacuolar-membrane placement is sound for the eukaryotic
    V-ATPase-D node. S. cerevisiae VMA8 accepts its two broad GO:0005774 rows
    as true; S. pombe and C. albicans flag two rows each as too general; and
    N. crassa modifies two rows to GO:0000329. That fungal preference for the
    descendant term is a granularity refinement, not a lineage-specific loss of
    vacuolar-membrane localization.
