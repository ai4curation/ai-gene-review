- node_id: PANTHER:PTN000912638
  asserted_term:
    id: GO:0005774
    label: vacuolar membrane
  evidence: IRD
  negated: true
  paint_snapshot: '20260528'
  seeds:
  - id: PANTHER:PTN000186829
    label: PTN000186829 (ancestral IBD node; IRD source)
  assessment: LOSS_CONTRADICTED
  assessment_reason: >-
    This IRD prunes the GO:0005774 IBD on PTN000186829 from a 45-leaf animal
    ATP6V1D clade, even though the mammalian V-ATPase holoenzyme has
    experimental lysosome-localization support and ATP6V1D membership in the D
    subunit family is the premise of PTHR11671. The loss therefore reflects a
    granularity preference for the lysosomal membrane descendant in animals, not
    a clade-wide loss of vacuolar-membrane localization.
  proposed_action:
    paint_action: REMOVE_LOSS
  supported_by:
  - reference_id: file:interpro/panther/PTHR11671/PTHR11671-paint.tsv
    supporting_text: "PTHR11671\tPTN000912638\tGO:0005774\tC\tIRD\ttrue\tPANTHER:PTN000186829\ttaxon:\t20260528"
