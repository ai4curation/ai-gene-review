family_id: PANTHER:PTHR11671
family_name: V-TYPE ATP SYNTHASE SUBUNIT D
preferred_name: V/A-type ATPase subunit D family
summary: >-
  PTHR11671 contains D subunits of rotary V/A-type ATPases. In fungi,
  Saccharomyces cerevisiae Vma8, Schizosaccharomyces pombe vma8,
  Candida albicans VMA8 and Neurospora crassa vma-8 sit in the conserved
  eukaryotic V1-sector D-subunit clade: they contribute to rotary ATPase
  activity from the cytosolic V1 sector and act as parts of the vacuolar
  proton-transporting V-type ATPase complex at the fungal vacuole membrane.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Members share the central-stalk D-subunit role in rotary V/A-type ATPases,
  but PAINT's vacuolar-membrane and vacuolar-acidification assertions are
  intentionally restricted to the eukaryotic or fungal V-ATPase nodes and
  should not be read as family-wide across bacterial or archaeal relatives.
