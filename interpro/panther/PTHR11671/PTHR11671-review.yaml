family_id: PANTHER:PTHR11671
family_name: V-TYPE ATP SYNTHASE SUBUNIT D
preferred_name: V-type ATPase subunit D
summary: >-
  PTHR11671 is the subunit D family of the V1 (and archaeal A1) sector of rotary ATPases. In eukaryotes
  subunit D is part of the central stalk of the vacuolar-type proton ATPase, which acidifies vacuoles,
  lysosomes and other organelles.
functional_coherence: COHERENT
coherence_reason: All members are central-stalk subunits of V-type or A-type ATPases.
