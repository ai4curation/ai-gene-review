family_id: PANTHER:PTHR30151
family_name: ALKANE SULFONATE ABC TRANSPORTER-RELATED, MEMBRANE SUBUNIT
preferred_name: Binding-protein-dependent ABC importer permeases (SsuC/TauC/NrtB/CmpB class)
summary: >-
  Polytopic inner-membrane permeases that form the translocation pathway of
  binding-protein-dependent ABC importers. Each works with a cognate extracytoplasmic
  solute-binding protein and a cytoplasmic ATPase: SsuC with SsuA and SsuB for aliphatic
  sulfonates, TauC with TauA and TauB for taurine, NrtB and CmpB with their cyanobacterial
  partners for nitrate/nitrite and bicarbonate, and further subfamilies for
  osmoprotectants (OpuCD), thiamine degradation products (ThiX) and riboflavin (RibX). The
  permease is where substrate crosses the membrane, and in E. coli the sulfonate and
  taurine systems are not interchangeable: mutants able to form only hybrid transporters
  could not grow on sulfonates, which shows the permease and its partners are matched.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared properties are architectural, a multi-pass plasma-membrane permease acting in
  an ABC import complex, and these are safe family-wide. The transported substrate differs
  between subfamilies (sulfonates, taurine, nitrate, bicarbonate, quaternary amines,
  vitamins), so substrate-specific transport terms are subfamily-level claims.
