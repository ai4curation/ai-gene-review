notes: >-
  Reviewed while completing the bacterial alkanesulfonate uptake and desulfonation module
  (modules/bacterial_alkanesulfonate_uptake_desulfonation.yaml), which grounds the SsuC role
  to SF38. PANTHER's family name is taken from the SsuC subfamily; the InterPro-side
  description of the same family (binding-protein-dependent ABC transporter permease) is the
  broader and more accurate reading used here. The two PAINT nodes illustrate the family's
  split cleanly: the narrow proteobacterial node carries the sulfur-starvation process and
  the family-wide node carries only the membrane location.
  Reconciled with the bacterial assimilatory nitrate reduction module (PR #5928) after
  PR #5917 merged. This review is kept as the base; every subfamily, node assessment, term
  scope and reference here comes from it. The nitrate module's additions sit beside them:
  the NrtB gene-review link in SF7 and an SF7-scoped GO:0015414 ABC-type nitrate transporter activity term. The nitrate review's own draft also scoped GO:0042959 to SF38; that is dropped here, because this review's GO:0042918 transport scope already covers the SsuC role. Both reviews assessed PTN000765473 and PTN001248830 as SOUND, so no verdict changed.
  The GO:0015414 SF7 scope excepts the three CmpB bicarbonate permeases (Q55106, Q55461, Q5MZ55) on their curated UniProt FUNCTION lines (PR #5928 review); SF7 composition is from a csv parse of PTHR30151-entries.csv.
