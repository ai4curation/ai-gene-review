  assessment_reason: >-
    The seed is E. coli TauC, whose operon is expressed only on sulfate or cysteine
    starvation, and this node is narrow: only six leaves receive the IBA, all
    proteobacterial (E. coli TauC, a Salmonella TauC, three P. aeruginosa permeases and one
