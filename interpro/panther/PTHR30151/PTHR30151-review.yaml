  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Only the SsuC subfamily transports alkanesulfonates. TauC transports taurine with a
    partially overlapping but distinct range, and the remaining subfamilies transport
    nitrate, bicarbonate, osmoprotectants or vitamins. The non-exchangeability of the Ssu
    and Tau components in E. coli is the direct evidence that this is not a family-wide
