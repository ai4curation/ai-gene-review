family_id: PANTHER:PTHR30151
family_name: ALKANE SULFONATE ABC TRANSPORTER-RELATED, MEMBRANE SUBUNIT
preferred_name: NitT/TauT-type ABC transporter permease family
summary: >-
  Integral-membrane permease subunits of NitT/TauT-type ABC importers. They
  translocate the substrate delivered by the partner binding protein, and the
  substrate differs by system: aliphatic sulfonates (SsuC, SF38), taurine (TauC,
  SF25), riboflavin and formylaminopyrimidine (RibX, ThiX), bicarbonate (CmpB) and
  nitrate/nitrite (cyanobacterial NrtB, SF7). Synechococcus elongatus PCC 7942
  NrtB (P38044) is the hydrophobic membrane component of the NrtABCD
  nitrate/nitrite importer.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members are ABC permeases in the plasma membrane, but the transported
  substrate is set by the system, so substrate-specific activities and
  sulfur-starvation responses are subfamily properties.
reference_protein:
  id: UniProtKB:P38044
  label: Nitrate import permease protein NrtB
  gene_symbol: nrtB
  organism: Synechococcus elongatus (strain ATCC 33912 / PCC 7942 / FACHB-805)
  gene_review: genes/SYNE7/nrtB/nrtB-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR30151:SF7
  label: NITRATE IMPORT PERMEASE PROTEIN NRTB
  description: Cyanobacterial NrtB permeases of the NrtABCD nitrate/nitrite importer.
  representative_members:
  - id: UniProtKB:P38044
    label: Nitrate import permease protein NrtB
    gene_symbol: nrtB
    organism: Synechococcus elongatus (strain ATCC 33912 / PCC 7942 / FACHB-805)
    gene_review: genes/SYNE7/nrtB/nrtB-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    NrtB serves nitrate/nitrite uptake for nitrate assimilation rather than
    sulfonate or taurine scavenging under sulfur limitation.
  supported_by:
  - reference_id: PMID:8437564
    supporting_text: NrtB is a hydrophobic protein having structural similarity to the integral membrane
      components of bacterial transport systems that are dependent on periplasmic substrate-binding proteins.
- subfamily_id: PANTHER:PTHR30151:SF38
  label: ALIPHATIC SULFONATES TRANSPORT PERMEASE PROTEIN SSUC-RELATED
  description: SsuC permeases of aliphatic sulfonate uptake systems.
  representative_members:
