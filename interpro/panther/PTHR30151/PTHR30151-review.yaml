- node_id: PANTHER:PTN001248830
  asserted_term:
    id: GO:0005886
    label: plasma membrane
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: UniProtKB:Q47539
    gene_symbol: tauC
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    This node spans the whole family (about 74 leaves, including SsuC, TauC, NrtB, CmpB,
    OpuCD, RibX and many uncharacterized bacterial and archaeal permeases), but the claim
    it carries is the architectural one: every member is a multi-pass permease of an ABC
    import complex and therefore resides in the plasma membrane. E. coli SsuC is recorded
    as a cell inner membrane, multi-pass protein, and the ssuC gene reviews accept the
    inherited term on that basis. Breadth is appropriate here because the property, unlike
    substrate specificity, is shared by the fold.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30151/PTHR30151-paint.tsv
    supporting_text: "PTHR30151\tPTN001248830\tGO:0005886\tC\tIBD\tfalse\tUniProtKB:Q47539"
