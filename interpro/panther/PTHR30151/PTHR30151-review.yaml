    label: Putative aliphatic sulfonates transport permease protein SsuC
    gene_symbol: ssuC
    organism: Escherichia coli (strain K12)
    gene_review: genes/ECOLI/ssuC/ssuC-ai-review.yaml
  - id: UniProtKB:Q88R94
    label: Aliphatic sulfonate ABC transporter-permease subunit
    gene_symbol: ssuC
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/ssuC/ssuC-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:10480865
    supporting_text: The Escherichia coli ssuEADCB gene cluster is required for the utilization of
      alkanesulfonates as sulfur sources, and is expressed under conditions of sulfate or cysteine
      starvation.
