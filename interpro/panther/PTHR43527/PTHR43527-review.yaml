  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Root (LUCA) node seeded by the characterized E. coli IspE. The term is right for SF2, and the IRD
    at PTN002882405 removes it from the PduX clade, but the SF1 leaf Streptomyces SCO0991 is outside
    that IRD and still inherits a CDP-ME kinase activity that its L-threonine-kinase classification
    does not support.
  affected_subfamilies:
