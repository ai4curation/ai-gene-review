- node_id: PANTHER:PTN002882405
  asserted_term:
    id: GO:0050515
    label: 4-(cytidine 5'-diphospho)-2-C-methyl-D-erythritol kinase activity
  evidence: IRD
  negated: true
  paint_snapshot: '20170228'
  seeds:
  - id: PANTHER:PTN000466527
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    The IRD sits on the three-leaf SF1 clade (Clostridium and Salmonella PduX, Listeria lmo1170),
    which PANTHER classifies as L-threonine kinase. Stopping the ancestral IspE activity there is
    consistent with that classification. PAINT records the node at taxon Firmicutes although it also
    contains Salmonella PduX, a mislabel of scope that does not affect the verdict.
  affected_subfamilies:
