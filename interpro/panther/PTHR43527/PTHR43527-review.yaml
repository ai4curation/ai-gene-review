  - id: UniProtKB:Q88PX5
    gene_symbol: ispE
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/ispE/ispE-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR43527:SF1
  label: L-THREONINE KINASE
  description: PduX-like kinases classified as L-threonine kinases.
  diverged_from_family: true
  divergence_description: >-
    Classified as L-threonine kinase rather than CDP-ME kinase. PAINT records an IRD loss of the IspE
    activity on the three-leaf clade containing Salmonella and Clostridium PduX and Listeria lmo1170;
    the fourth SF1 leaf (Streptomyces SCO0991) sits outside that clade and still inherits the root
    IspE assertion.
