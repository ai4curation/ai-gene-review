family_id: PANTHER:PTHR43527
family_name: 4-DIPHOSPHOCYTIDYL-2-C-METHYL-D-ERYTHRITOL KINASE, CHLOROPLASTIC
preferred_name: IspE CDP-ME kinase family (with the PduX L-threonine kinase branch)
summary: >-
  GHMP-superfamily kinases. The dominant subfamily (SF2) is IspE, which phosphorylates the 2-hydroxyl
  of 4-diphosphocytidyl-2-C-methyl-D-erythritol (CDP-ME) with ATP in the fourth reaction of the
  methylerythritol phosphate (MEP) pathway; it includes bacterial IspE and the plastid ISPE of plants.
  A small subfamily (SF1, PduX-like) is classified as L-threonine kinase, associated with
  propanediol-utilization gene clusters, and is not an MEP-pathway enzyme.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF2 (84 of 88 leaves in the PANTHER 19 tree) is IspE. SF1 (4 leaves: Streptomyces SCO0991,
  Clostridium and Salmonella PduX, Listeria lmo1170) is the L-threonine kinase branch, and PAINT
  already records a loss of the IspE activity on part of it.
reference_protein:
  id: UniProtKB:P62615
  label: 4-diphosphocytidyl-2-C-methyl-D-erythritol kinase
  gene_symbol: ispE
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/ispE/ispE-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43527:SF2
  label: 4-DIPHOSPHOCYTIDYL-2-C-METHYL-D-ERYTHRITOL KINASE, CHLOROPLASTIC
  description: >-
    IspE/ISPE CDP-ME kinases of bacteria and plastids, including the bacterial module exemplars
    despite the chloroplast-biased official name.
  representative_members:
