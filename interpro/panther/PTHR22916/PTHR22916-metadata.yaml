  name:
    name: Glycosyltransferase 2 family enzymes
    short: Glycosyltransferase_2
  description:
  - text: The glycosyltransferase 2 family is involved in diverse glycosylation processes,
      including the biosynthesis of lipids, polysaccharides, and glycoproteins. Members
      of this family catalyze the transfer of sugar moieties from activated donor
      molecules, such as UDP-sugars, to specific acceptor molecules, forming glycosidic
      bonds. This includes the synthesis of membrane lipids that regulate membrane
      properties and stability, the assembly of O-antigen repeating units, the production
      of exopolysaccharides for biofilm formation, and the polymerization of hyaluronan.
      Some members are involved in the biosynthesis of cell wall polymers like teichoic
      acids and minor teichoic acid in bacteria. Others participate in the biosynthesis
      of complex molecules like p-hydroxybenzoic acid derivatives and glycosylated
      phenolphthiocerol dimycocerosates. The family also contains enzymes that modify
      proteins, such as the serine-rich repeat protein PsrP, and contribute to antibiotic
      resistance in certain bacteria.
