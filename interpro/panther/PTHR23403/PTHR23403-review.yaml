family_id: PANTHER:PTHR23403
family_name: TREHALASE
preferred_name: Glycoside hydrolase family 37 trehalase family
summary: >-
  GH37 trehalases hydrolyse trehalose to two glucose molecules. The family contains bacterial periplasmic
  TreA and cytoplasmic TreF, and the fungal neutral trehalases (S. cerevisiae NTH1, NTH2, S. pombe
  ntp1), which are activated by PKA and mobilize stored trehalose. Fungal acid trehalase ATH1 is
  GH65.
functional_coherence: COHERENT
coherence_reason: All subfamilies are trehalases; they differ in compartment and regulation.
