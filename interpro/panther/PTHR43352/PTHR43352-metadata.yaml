  name:
    name: ATP-dependent AMP-binding enzyme
    short: ATP-dep_AMP-bind_enzyme
  description:
  - text: The ATP-dependent AMP-binding enzyme family is involved in the activation
      of aromatic acids through the formation of acyl-CoA thioesters, which are key
      intermediates in various biosynthetic pathways. Members of this family catalyze
      the ligation of aromatic substrates such as benzoate, hydroxybenzoates, and
      anthranilate with CoA, using ATP. This reaction is crucial for the degradation
      of aromatic compounds and the biosynthesis of complex lipids and signaling molecules.
      Some members also function in a CoA-independent manner, forming thioester intermediates
      with specific proteins, which are then used as starter units for the biosynthesis
      of important metabolites like phenolic glycolipids.
