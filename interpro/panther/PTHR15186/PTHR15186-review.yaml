        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3-like
        gene_symbol: Bnip3l
        organism: Mus musculus (Mouse)
        gene_review: genes/mouse/Bnip3l/Bnip3l-ai-review.yaml
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR15186:SF5
    label: BNIP3, ISOFORM A
    description: >-
      The single-copy invertebrate orthologs (C. elegans and C. briggsae DCT-1,
      Drosophila BNIP3/CG5059). Same three-element architecture as the vertebrate
      paralogs, with the N-terminal LIR intact (DCT-1 W71, fly BNIP3 W16). DCT-1 is the
