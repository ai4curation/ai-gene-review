family_id: PANTHER:PTHR15186
family_name: RE48077P
preferred_name: BNIP3 family (BNIP3, BNIP3L/NIX, C. elegans DCT-1, Drosophila BNIP3) mitochondrial autophagy receptors
summary: >-
  Animal-restricted family (all 3,326 InterPro-classified members are Eumetazoa) of small
  tail-anchored outer mitochondrial membrane proteins built from three conserved
  elements: an N-terminal LC3-interacting region (LIR, core S-W-[VI]-E-L), a weak
  BH3-like segment, and a C-terminal transmembrane helix that both anchors the protein
  in the outer mitochondrial membrane and drives homodimerization. The vertebrate
  paralogs BNIP3 (subfamily SF4) and BNIP3L/NIX (SF3) are the best-studied receptor-
  mediated mitophagy proteins in metazoa: their LIR binds Atg8-family proteins
  (LC3/GABARAP) to tether mitochondria to forming autophagosomes, NIX is required for
  programmed mitochondrial clearance during reticulocyte maturation, and BNIP3 is a
  HIF-1 target that drives hypoxia-induced mitophagy and, from its ER-resident pool,
  reticulophagy. The single invertebrate orthologs (subfamily SF5; C. elegans DCT-1,
  Drosophila BNIP3) retain the same LIR, BH3-like and TM architecture, and DCT-1 is the
  principal stress-induced mitophagy receptor of C. elegans. Overexpression of every
  well-studied member kills cultured cells, but the death is BH3- and caspase-
  independent for DCT-1 and largely context-dependent (hypoxia, necrosis-like) for the
  vertebrate proteins; the conserved, physiologically demonstrated activity of the
  family is mitophagy-receptor function.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The LIR-plus-tail-anchor architecture and mitochondrial outer membrane localization
  are conserved in every subfamily, and mitophagy-receptor function has direct
  experimental support in human BNIP3 and BNIP3L, mouse NIX and C. elegans DCT-1, so the
  core molecular function is coherent. The vertebrate paralogs have sub-specialized
  (NIX for developmental mitochondrial clearance in erythroid cells and GABARAP
  preference; BNIP3 for hypoxia-induced mitophagy, LC3B binding and an ER-resident pool
  that drives reticulophagy), and the cell-death, nuclear and mitochondrial-dynamics
  activities attached to the family are vertebrate-only, context-dependent observations
  rather than family-wide properties - hence MOSTLY_COHERENT rather than COHERENT.
