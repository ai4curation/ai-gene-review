notes: >-
  Written together with full gene reviews of every model-organism member: human BNIP3
  and BNIP3L, mouse Bnip3 and Bnip3l, C. elegans dct-1 and Drosophila BNIP3. All
  node/term/seed/date tuples are verbatim from the cached PTHR15186-paint.tsv; which
  members inherit which node was read from the refreshed GOA files of the six reviewed
  genes. Two features of the PAINT curation stand out: (1) the family's core molecular
  function, mitochondrion autophagosome adaptor activity, is asserted only at
  PTN002689498, which in practice reaches BNIP3 orthologs alone, so NIX - the archetypal
  metazoan mitophagy receptor - and the invertebrate receptors DCT-1 and fly BNIP3
  receive no MF IBA; (2) the Eumetazoa node PTN001032684 carries three vertebrate-seeded
  terms (nucleus, positive regulation of apoptotic process, mitochondrial fragmentation
  involved in apoptotic process) that reach worm and fly without invertebrate support.
  LIR positions were read directly from the cached UniProt sequences (human BNIP3
  sequence version 4). The published "W35" for Nix is the mouse numbering; human BNIP3L
  has the tryptophan at 36.
