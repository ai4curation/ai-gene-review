subfamilies:
  - subfamily_id: PANTHER:PTHR15186:SF4
    label: BCL2_ADENOVIRUS E1B 19 KDA PROTEIN-INTERACTING PROTEIN 3
    description: >-
      Vertebrate BNIP3 orthologs (human, mouse, rat, bovine, Xenopus, zebrafish bnip3)
      plus the fish-specific bnip4 paralog. Hypoxia/HIF-1-induced mitophagy receptor whose
      LIR (W18 in human) binds LC3B; a fraction resides in the ER membrane and drives
      LIR-dependent reticulophagy. The only subfamily that inherits the PAINT
      PTN002689498 node (ER membrane, mitochondrion autophagosome adaptor activity,
      reticulophagy).
    representative_members:
      - id: UniProtKB:Q12983
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        gene_symbol: BNIP3
        organism: Homo sapiens (Human)
        gene_review: genes/human/BNIP3/BNIP3-ai-review.yaml
      - id: UniProtKB:O55003
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        gene_symbol: Bnip3
        organism: Mus musculus (Mouse)
        gene_review: genes/mouse/Bnip3/Bnip3-ai-review.yaml
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR15186:SF3
    label: BCL2_ADENOVIRUS E1B 19 KDA PROTEIN-INTERACTING PROTEIN 3-LIKE
    description: >-
      Vertebrate BNIP3L/NIX orthologs (human, mouse, bovine, Xenopus, zebrafish
      bnip3la). Mitophagy receptor with a GABARAP-preferring LIR (W36 in human, W35 in
      mouse) that is required for programmed mitochondrial clearance during reticulocyte
      maturation. Not covered by the PTN002689498 node, so it receives no molecular
      function IBA despite being the best-characterized metazoan mitophagy receptor.
    representative_members:
      - id: UniProtKB:O60238
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3-like
        gene_symbol: BNIP3L
        organism: Homo sapiens (Human)
