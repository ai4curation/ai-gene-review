node_assessments:
  # --- PTN000795991: no taxon recorded in the cached PAINT slice; in current GOA its IBAs
  # reach the vertebrate BNIP3 and BNIP3L members only (not worm or fly). ---
  - node_id: PANTHER:PTN000795991
    asserted_term:
      id: GO:0005635
      label: nuclear envelope
    paint_snapshot: "20170228"
    seeds:
      - id: UniProtKB:O60238
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3-like
        organism: Homo sapiens (Human)
      - id: UniProtKB:Q12983
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Both seeds have direct experimental nuclear-envelope localization (BNIP3 in the
      original E1B-19K interactor study, BNIP3L/B5 in the lamin-binding study), and the
      node's descendants are restricted to the two vertebrate paralogs, so placement is
      not too deep. The localization is a minor pool seen largely with overexpressed
      protein, and the gene reviews keep it as non-core; the node is defensible but
      should not be moved deeper to cover the invertebrate orthologs, for which no
      nuclear-envelope evidence exists.
    supported_by:
      - reference_id: PMID:10381623
        supporting_text: >-
          localizes in nuclear envelope,
          endoplasmic reticulum and mitochondria
  - node_id: PANTHER:PTN000795991
    asserted_term:
      id: GO:0005783
      label: endoplasmic reticulum
    paint_snapshot: "20241120"
    seeds:
      - id: UniProtKB:O60238
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3-like
        organism: Homo sapiens (Human)
      - id: UniProtKB:Q12983
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Endogenous BNIP3 is localized to both mitochondria and the ER, where it induces
      LIR-dependent reticulophagy, and BNIP3L has an experimentally observed ER pool;
      the node covers only these two vertebrate paralogs. Note the internal
      inconsistency with PTN002689498, which places the more specific child term
      endoplasmic reticulum membrane at a node that reaches only the BNIP3 (SF4) clade.
    supported_by:
      - reference_id: PMID:22505714
        supporting_text: >-
          We report that endogenous Bnip3 is localized to both mitochondria and ER in
          cells and that Bnip3 induces autophagy from both locations.

  # --- PTN001032684 (taxon 6072 Eumetazoa): the family-level node, inherited by all
  # vertebrate and invertebrate members (human, mouse, worm, fly). ---
  - node_id: PANTHER:PTN001032684
    asserted_term:
      id: GO:0005741
      label: mitochondrial outer membrane
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20260529"
    seeds:
      - id: FB:FBgn0037007
      - id: UniProtKB:O60238
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3-like
        organism: Homo sapiens (Human)
      - id: UniProtKB:Q12983
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        organism: Homo sapiens (Human)
      - id: WB:WBGene00015776
    assessment: SOUND
    assessment_reason: >-
      The C-terminal tail anchor is conserved in every member, and outer mitochondrial
      membrane localization is experimentally supported in human, worm and fly seeds.
      The defining, family-wide localization; correctly placed at the family node.
    supported_by:
      - reference_id: PMID:11114722
        supporting_text: >-
          Like BNIP3, the TM domain of
          ceBNIP3 mediates the localization of the protein to mitochondria
  - node_id: PANTHER:PTN001032684
    asserted_term:
      id: GO:0000423
      label: mitophagy
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20251128"
    seeds:
      - id: FB:FBgn0037007
      - id: UniProtKB:Q12983
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        organism: Homo sapiens (Human)
      - id: WB:WBGene00015776
    assessment: SOUND
    assessment_reason: >-
      Mitophagy is the conserved physiological role, with seed evidence spanning
      vertebrates (BNIP3) and both invertebrate model orthologs (DCT-1, fly BNIP3).
      Correctly placed at the family node. In the current GOA the vertebrate BNIP3L/NIX
      members do not carry this IBA although they descend from the node and NIX is the
      archetypal mitophagy receptor; their mitophagy annotations come from direct
      experimental evidence instead.
    supported_by:
      - reference_id: PMID:25896323
        supporting_text: >-
          We find that DCT-1 is a key mediator of mitophagy and
          longevity assurance under conditions of stress in C. elegans.
      - reference_id: PMID:20010802
        supporting_text: >-
          Nix is a selective autophagy receptor for mitochondrial clearance.
  - node_id: PANTHER:PTN001032684
    asserted_term:
      id: GO:0005634
      label: nucleus
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20200320"
    seeds:
      - id: RGD:620800
      - id: UniProtKB:O60238
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3-like
        organism: Homo sapiens (Human)
      - id: UniProtKB:Q12983
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        organism: Homo sapiens (Human)
    assessment: TOO_DEEP
    assessment_reason: >-
      All seeds are vertebrate (rat Bnip3, human BNIP3L and BNIP3), and the nuclear pool
      is a context-specific observation (e.g. nuclear BNIP3 in glioma and some
      cardiomyocyte settings) rather than a conserved site of action. Placing it at the
      Eumetazoa node propagates a nucleus localization to C. elegans DCT-1 and
      Drosophila BNIP3, for which there is no nuclear evidence; the tail-anchored
      architecture shared by all members points to membrane insertion in mitochondria
      and ER. If retained at all, the assertion belongs no deeper than the vertebrate
      node PTN000795991, where the related nuclear envelope term already sits.
  - node_id: PANTHER:PTN001032684
    asserted_term:
      id: GO:0043065
      label: positive regulation of apoptotic process
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20251128"
    seeds:
      - id: MGI:MGI:1332659
      - id: RGD:620800
      - id: RGD:621354
      - id: UniProtKB:O60238
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3-like
        organism: Homo sapiens (Human)
      - id: UniProtKB:Q12983
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        organism: Homo sapiens (Human)
      - id: ZFIN:ZDB-GENE-040325-1
    assessment: TOO_DEEP
    assessment_reason: >-
      Every seed is a vertebrate gene, mostly supported by overexpression killing assays.
      The invertebrate evidence argues against a conserved apoptotic role: C. elegans
      DCT-1 kills transfected mammalian cells only through a BH3- and caspase-independent
      mechanism and does not enhance CED-3/CED-4-driven death, and in the worm it acts
      as a mitophagy mediator rather than in the core apoptotic pathway. The
      "BH3-only" label is itself weak for this family (the BH3-like segment is
      dispensable for killing). The term is defensible only as a non-core vertebrate
      property and should not propagate to worm and fly.
    supported_by:
      - reference_id: PMID:11114722
        supporting_text: >-
          ceBNIP3 kills mammalian cells by a caspase-independent mechanism
      - reference_id: PMID:10381623
        supporting_text: >-
          B5 does not induce
          apoptosis, but inhibits apoptosis induced by Nip3
  - node_id: PANTHER:PTN001032684
    asserted_term:
      id: GO:0043653
      label: mitochondrial fragmentation involved in apoptotic process
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20251128"
    seeds:
      - id: UniProtKB:Q12983
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        organism: Homo sapiens (Human)
    assessment: TOO_DEEP
    assessment_reason: >-
      The single seed is human BNIP3's IDA from the Opa1-binding study in cultured
      mammalian cells; there is no evidence for apoptotic mitochondrial fragmentation
      driven by BNIP3L, DCT-1 or fly BNIP3, yet the Eumetazoa placement propagates it to
      all of them. At most a vertebrate BNIP3 (SF4) property.
    supported_by:
      - reference_id: PMID:20436456
        supporting_text: >-
          The BH3-only Bnip3 binds to the dynamin Opa1 to promote mitochondrial
          fragmentation and apoptosis by distinct mechanisms.

  # --- PTN002689498 (taxon 117571 Euteleostomi): in current GOA it reaches the BNIP3 (SF4)
  # members only - not BNIP3L/NIX (SF3) - so it behaves as the BNIP3 clade node. ---
  - node_id: PANTHER:PTN002689498
    asserted_term:
      id: GO:0140580
      label: mitochondrion autophagosome adaptor activity
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20251128"
    seeds:
      - id: UniProtKB:Q12983
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Correct for its descendants (BNIP3 orthologs: LIR W18 binds LC3 and is required
      for efficient mitophagy), but placed far too shallow. The LIR is conserved in every
      subfamily, NIX's LIR is required for LC3/GABARAP binding and for mitochondrial
      clearance in Nix-deficient reticulocytes, and DCT-1 is the C. elegans mitophagy
      receptor. The activity should be asserted at the family node PTN001032684 so that
      BNIP3L/NIX, DCT-1 and fly BNIP3 inherit it; this is the main gap in the PAINT
      curation of the family (BNIP3L currently carries no molecular function IBA).
    supported_by:
      - reference_id: PMID:22505714
        supporting_text: >-
          Mutation of the conserved tryptophan at position 18 in Bnip3 to an alanine
          completely abrogated the interaction with LC3
      - reference_id: PMID:20010802
        supporting_text: >-
          Of the two LIRs characterized in this study, LIR-W35 is particularly important
          as its mutation or deletion abolishes Nix:LC3/GABARAP binding in vitro and in
          vivo .
  - node_id: PANTHER:PTN002689498
    asserted_term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20251128"
    seeds:
      - id: UniProtKB:Q12983
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Endogenous BNIP3 has an ER-membrane pool; the node reaches only BNIP3 orthologs.
      The tail anchor makes ER-membrane insertion plausible for other members, but
      without member-specific evidence the conservative placement is appropriate.
    supported_by:
      - reference_id: PMID:22505714
        supporting_text: >-
          endogenous Bnip3 localizes to the ER where it induces autophagy of the ER
  - node_id: PANTHER:PTN002689498
    asserted_term:
      id: GO:0061709
      label: reticulophagy
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20251128"
    seeds:
      - id: UniProtKB:Q12983
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      LIR-dependent reticulophagy is demonstrated for the ER-targeted BNIP3 pool only;
      restricting the term to the BNIP3 clade is appropriate.
    supported_by:
      - reference_id: PMID:22505714
        supporting_text: >-
          Bnip3cb5W18A induced significantly less ERphagy compared with Bnip3cb5

residue_sites:
  - site_id: lir_core
    label: N-terminal LC3-interacting region (LIR) core tryptophan and leucine
    description: >-
      The canonical W-x-x-L Atg8-family interaction motif at the N terminus, conserved as
      S-W-[VI]-E-L in every subfamily: human BNIP3 W18/L21, human BNIP3L W36/L39 (W35 in
      the published mouse Nix numbering), C. elegans DCT-1 W71/L74, Drosophila BNIP3
      W16/L19. W18A abolishes BNIP3:LC3 binding and reduces mitophagy and reticulophagy;
      the corresponding NIX W35A mutation abolishes LC3/GABARAP binding and impairs
      mitochondrial clearance in Nix-deficient reticulocytes. Loss of the site reduces
      but does not abolish mitophagy in either paralog.
    anchor:
      id: UniProtKB:Q12983
      label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3
      gene_symbol: BNIP3
      organism: Homo sapiens
    anchor_sequence_version: 4
    residues:
      - position: 18
        expected: [W]
        role: LIR aromatic anchor (inserts into the Atg8 W-site hydrophobic pocket)
      - position: 21
        expected: [L]
        role: LIR hydrophobic position (inserts into the Atg8 L-site hydrophobic pocket)
    required_for:
      - term:
          id: GO:0140580
          label: mitochondrion autophagosome adaptor activity
        strength: CONTRIBUTES
        rationale: >-
          The LIR tryptophan is required for Atg8-family binding in both vertebrate
          paralogs, but mitophagy is reduced rather than abolished by its mutation (other
          properties of the proteins, and other receptors, contribute), so the site
          contributes to rather than licenses the adaptor activity.
    site_source: LITERATURE
    positive_controls:
      - id: UniProtKB:Q9Z2F7
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3-like
        gene_symbol: Bnip3l
        organism: Mus musculus
        control_position: 35
        control_residue: W
      - id: UniProtKB:O60238
        label: BCL2/adenovirus E1B 19 kDa protein-interacting protein 3-like
        gene_symbol: BNIP3L
        organism: Homo sapiens
        control_position: 36
        control_residue: W

term_assessments:
  - assessed_term:
      id: GO:0140580
      label: mitochondrion autophagosome adaptor activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The LIR is intact in every member examined across all three characterized
      subfamilies, and the activity is experimentally demonstrated in BNIP3 (SF4), NIX
      (SF3) and, as a mitophagy receptor, DCT-1 (SF5). It is currently propagated only
      within SF4; a family-node IBD (PTN001032684) would correct the omission for NIX,
      DCT-1 and fly BNIP3.
    supported_by:
      - reference_id: PMID:20010802
        supporting_text: >-
          Nix is a selective autophagy receptor for mitochondrial clearance.
      - reference_id: PMID:22505714
        supporting_text: >-
          the LIR is completely conserved among Bnip3 and Nix
  - assessed_term:
      id: GO:0000423
      label: mitophagy
    scope: FAMILY_WIDE
    scope_reason: >-
      Demonstrated in vertebrate BNIP3 and NIX and in C. elegans DCT-1; already a sound
      family-node IBD.
    supported_by:
      - reference_id: PMID:25896323
        supporting_text: >-
          We find that DCT-1 is a key mediator of mitophagy and
          longevity assurance under conditions of stress in C. elegans.
      - reference_id: PMID:18454133
        supporting_text: >-
          Essential role for Nix in autophagic maturation of erythroid cells.
  - assessed_term:
      id: GO:0005741
      label: mitochondrial outer membrane
    scope: FAMILY_WIDE
    scope_reason: >-
      Tail-anchored outer mitochondrial membrane localization via the conserved C-terminal
      TM helix, demonstrated from human to worm.
    supported_by:
      - reference_id: PMID:11114722
        supporting_text: >-
          Like BNIP3, the TM domain of
          ceBNIP3 mediates the localization of the protein to mitochondria
  - assessed_term:
      id: GO:0042803
      label: protein homodimerization activity
    scope: FAMILY_WIDE
    scope_reason: >-
      TM-helix-mediated homodimerization is shown for human BNIP3 (SDS-resistant dimer
      that promotes LC3 binding) and for C. elegans DCT-1, so the property is ancestral.
    supported_by:
      - reference_id: PMID:11114722
        supporting_text: >-
          ceBNIP3 is expressed primarily as a 25 kDa monomer and a 50
          kDa homodimer.
      - reference_id: PMID:22505714
        supporting_text: >-
          homodimerization of Bnip3 via the TMD facilitates the interaction between Bnip3
          and LC3
  - assessed_term:
      id: GO:0061709
      label: reticulophagy
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      LIR-dependent ER-phagy is shown only for the ER-resident pool of BNIP3; no member
      outside SF4 has been tested.
    applicable_subfamilies:
      - id: PANTHER:PTHR15186:SF4
        label: BCL2_ADENOVIRUS E1B 19 KDA PROTEIN-INTERACTING PROTEIN 3
    supported_by:
      - reference_id: PMID:22505714
        supporting_text: >-
          This suggests that Bnip3 promotes removal of ER via its interaction with LC3 on
          the autophagosomes.
  - assessed_term:
      id: GO:0043065
      label: positive regulation of apoptotic process
    scope: UNRESOLVED
    scope_reason: >-
      Pro-death activity is reported for vertebrate members under overexpression or
      hypoxia, but it is context-dependent, often non-apoptotic, and separable from the
      LIR-mediated mitophagy function; the invertebrate ortholog kills only by a BH3- and
      caspase-independent route in heterologous cells. The enum has no clade-level scope;
      the boundary is: vertebrate members only, and non-core even there. It should not be
      propagated from the Eumetazoa node.
    supported_by:
      - reference_id: PMID:11114722
        supporting_text: >-
          although ceBNIP3 interacts with CED-9 and CED-3 it
          kills by a BH3- and caspase-independent mechanism
      - reference_id: PMID:22505714
        supporting_text: >-
          the function of the LIR in Bnip3 is separate from its prodeath activity
  - assessed_term:
      id: GO:0005634
      label: nucleus
    scope: UNRESOLVED
    scope_reason: >-
      Vertebrate-only, context-specific nuclear pool; no invertebrate evidence. Should not
      be propagated from the Eumetazoa node.

