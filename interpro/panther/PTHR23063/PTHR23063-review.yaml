family_id: PANTHER:PTHR23063
family_name: PHOSPHOLIPID ACYLTRANSFERASE
preferred_name: GPAT3/4, LPCAT1/2/4 and LOA1 acyltransferase family
summary: >-
  ER and lipid droplet acyl-CoA-dependent glycerolipid acyltransferases. Subfamilies acylate different
  lysolipids: glycerol 3-phosphate (GPAT3/4), lysophosphatidylcholine and lyso-PAF (LPCAT1/2), lysophosphatidic
  acid (fungal LOA1; S. pombe vps66), and other lysophospholipids (LPCAT4).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The acyl acceptor differs by subfamily: glycerol 3-phosphate (SF10, SF37), lysophosphatidylcholine/PAF
  (SF21, SF57), lysophosphatidic acid (SF60) and other lysophospholipids (SF7).
