family_id: PANTHER:PTHR24221
family_name: ATP-BINDING CASSETTE SUB-FAMILY B
summary: ABCB-related transporters combine ATP-binding domains with membrane-spanning regions to move
  chemically diverse substrates. Members occur in different membranes and include bacterial exporters
  and eukaryotic organellar and cellular transport systems.
functional_coherence: HETEROGENEOUS
coherence_reason: Intact ABCB-type transporters couple an ATP-binding cassette to membrane transport,
  but their substrates and compartments vary. Drosophila HMT1 rescues cadmium sensitivity and localizes
  to the vacuolar membrane in the tested yeast system, yet it does not transport cadmium-phytochelatin
  complexes (PMID:19001374). Human ABCB6 structures instead establish porphyrin/hemin recognition (PMID:35950458).
  These results support the broad ABC-type transporter mechanism while excluding a family-wide phytochelatin,
  cadmium or heme substrate assignment; complete transporter architecture remains necessary.
