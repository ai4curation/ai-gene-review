family_id: PANTHER:PTHR23152
family_name: 2-OXOGLUTARATE DEHYDROGENASE
preferred_name: 2-Oxoglutarate dehydrogenase E1 (SucA/KGD1/OGDH/DHTKD1) family
summary: >-
  Thiamine-diphosphate E1 components of 2-oxoacid dehydrogenase complexes. OGDH E1 (bacterial SucA,
  S. cerevisiae KGD1, S. pombe kgd1, human OGDH/OGDHL) decarboxylates 2-oxoglutarate in the TCA cycle.
  DHTKD1 decarboxylates 2-oxoadipate in lysine and tryptophan catabolism. PANTHER puts the bacterial
  and fungal OGDH E1 in SF4 with DHTKD1.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are 2-oxoacid dehydrogenase E1 components. The preferred substrate (2-oxoglutarate
  or 2-oxoadipate) differs, and SF4 mixes both.
