  name:
    name: Mitochondrial Persulfide Dioxygenase
    short: Mito_Persulfide_Diox
  description:
  - text: This family of proteins includes enzymes that are involved in hydrogen sulfide
      catabolism within the mitochondrial matrix. Members of this family function
      as sulfur dioxygenases, catalyzing the oxidation of cysteine persulfide residues
      that are generated from hydrogen sulfide by other enzymes. This oxidation process
      typically involves the transfer of the persulfide to a thiophilic acceptor such
      as glutathione. The activity of these proteins is crucial for preventing the
      accumulation of toxic levels of hydrogen sulfide, which can inhibit cytochrome
      c oxidase and disrupt metabolic homeostasis. Some members of this family have
      been implicated in additional cellular processes, including the regulation of
      apoptosis and cell adherence or biofilm development. The family belongs to the
      metallo-beta-lactamase superfamily and shares similarities with the Glyoxalase
      II family.
