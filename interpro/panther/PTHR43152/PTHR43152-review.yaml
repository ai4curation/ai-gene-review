term_assessments:
- assessed_term:
    id: GO:0003684
    label: damaged DNA binding
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR43152:SF3
    label: UVRABC SYSTEM PROTEIN A
  scope_reason: >-
    Damage-specific DNA binding by UvrA alone is shown for E. coli UvrA (SF3), and every
    reviewed SF3 member is a canonical UvrABC system protein A. SF1 and SF2 have no
    characterized members (the only reviewed SF1 entry is a UvrA fragment annotated by
    similarity), so the term is not extended to them.
  supported_by:
  - reference_id: PMID:19208636
    supporting_text: >-
      AFM analysis of UvrA bound to a DNA substrate containing a defined lesion revealed that
      ATP is not required for damage detection.
  - *dnabinding
- assessed_term:
    id: GO:0016887
    label: ATP hydrolysis activity
  scope: FAMILY_WIDE
  scope_reason: >-
    UvrA ATPase activity is measured for E. coli UvrA (SF3). The activity comes from the
    tandem ABC-type ATP-binding cassettes, which the SF1 paralog P. putida PP_3087 also
    carries (two ABC_TRANSPORTER_1 signature matches), so ATP hydrolysis is treated as a
    property of the whole family. The NER-specific damage-recognition and damaged-DNA-binding
    roles stay restricted to SF3.
  supported_by:
  - reference_id: file:genes/PSEPK/PP_3087/PP_3087-uniprot.txt
    supporting_text: PROSITE; PS00211; ABC_TRANSPORTER_1; 2.
  - reference_id: PMID:19208636
    supporting_text: >-
      This strongly suggests that it is not the binding of ATP that stimulates formation of
      UvrA dimers, but the hydrolysis of ATP to ADP.
- assessed_term:
    id: GO:0000715
    label: nucleotide-excision repair, DNA damage recognition
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR43152:SF3
    label: UVRABC SYSTEM PROTEIN A
  scope_reason: >-
    UvrA acts catalytically to load UvrB at lesions, the NER damage-recognition step,
    established for E. coli UvrA (SF3). It is not extended to the uncharacterized SF1 and SF2
    paralog subfamilies.
  supported_by:
  - reference_id: PMID:2546148
    supporting_text: >-
      Under conditions of saturating UvrB protein approximately one UvrB molecule binds to
      DNA per damaged site in a reaction that requires catalytic amounts of UvrA subunit.
