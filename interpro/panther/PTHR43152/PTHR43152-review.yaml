node_assessments:
- node_id: PANTHER:PTN000655914
  asserted_term:
    id: GO:0003677
    label: DNA binding
  evidence: IBD
  negated: false
  paint_snapshot: '20241203'
  seeds:
  - id: UniProtKB:P0A698
  assessment: SOUND
  assessment_reason: >-
    PTN000655914 is the family root (PTHR43152:AN0 in the PAINT/TreeGrafter tables), so the
    term reaches all three subfamilies. Its seed is E. coli UvrA, which binds DNA in
    experiments, and generic DNA binding is a safe ancestral claim for a family defined by
    the UvrA DNA-binding architecture. It is sound as stated, but it is less specific than
    the canonical UvrA activity. The node asserts DNA binding only, not damaged DNA binding,
    and because it sits at the root above the uncharacterized SF1/SF2 paralog subfamilies it
    should not be used to ground the SF3-specific damage-recognition role.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43152/PTHR43152-paint.tsv
    supporting_text: "PTHR43152\tPTN000655914\tGO:0003677\tF\tIBD\tfalse\tUniProtKB:P0A698"
  - &dnabinding
    reference_id: PMID:19208636
    supporting_text: >-
      UvrA (in absence of UvrB) binds DNA with a preference for single-stranded or damaged
      DNA (13,14).
- node_id: PANTHER:PTN000655914
  asserted_term:
    id: GO:0005829
    label: cytosol
  evidence: IBD
  negated: false
  paint_snapshot: '20260530'
  seeds:
  - id: UniProtKB:P0A698
  assessment: SOUND
  assessment_reason: >-
    UvrA-type proteins are soluble, with no transmembrane segments; E. coli UvrA is found in
    the cytosolic proteome. The root placement is acceptable for a soluble ATPase family.
    Whether any SF2 member (named "drug resistance ABC transporter") associates with a
    membrane is not known from the cached evidence.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43152/PTHR43152-paint.tsv
    supporting_text: "PTHR43152\tPTN000655914\tGO:0005829\tC\tIBD\tfalse\tUniProtKB:P0A698"
  - reference_id: PMID:18304323
    supporting_text: >-
      Here, we describe an approach to maximize MS based proteome identification coverage
      in an application to the E. coli cytosol, in combination with a reliable and quick
      concentration estimation of the identified proteins.
- node_id: PANTHER:PTN000655914
  asserted_term:
    id: GO:0006974
    label: DNA damage response
  evidence: IBD
  negated: false
  paint_snapshot: '20241203'
  seeds:
  - id: UniProtKB:P0A698
  - id: UniProtKB:P9WQK7
  assessment: SOUND
  assessment_reason: >-
    The root node is seeded by two distantly related canonical UvrAs (E. coli and M.
    tuberculosis, both SF3). DNA damage response is a broad term that is true of canonical
    UvrA, whose specific process is nucleotide-excision repair. The generic term is a
    reasonable ancestral placement; the specific NER damage-recognition process is not
    asserted at this node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43152/PTHR43152-paint.tsv
    supporting_text: "PTHR43152\tPTN000655914\tGO:0006974\tP\tIBD\tfalse\tUniProtKB:P0A698|UniProtKB:P9WQK7"
  - reference_id: PMID:2546148
    supporting_text: >-
      Cells with mutations in any of these three genes cannot repair DNA by nucleotide
