family_id: PANTHER:PTHR43152
family_name: UVRABC SYSTEM PROTEIN A
preferred_name: UvrA damage-recognition ABC ATPase family
summary: >-
  Family of UvrA-type ABC ATPases. Its characterized members are the canonical bacterial
  UvrA proteins, the damage-sensing subunit of nucleotide excision repair: a UvrA dimer,
  with two tandem ABC-type ATPase cassettes per monomer and C4 zinc fingers, binds
  helix-distorting DNA lesions, forms the UvrA2B2 scanning complex with UvrB, loads UvrB onto
  the lesion and then dissociates before UvrC-mediated incision. PANTHER divides the family
  into three subfamilies: SF3 (UVRABC SYSTEM PROTEIN A), which holds the canonical UvrA
  proteins; SF1 (UVRA PROTEIN); and SF2 (DRUG RESISTANCE ABC TRANSPORTER). The names of SF1
  and SF2 point to UvrA-paralog lineages, but no characterized member of either is in the
  reviewed inventory.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Of the 97 reviewed members in the cached inventory (PTHR43152-entries.csv), 96 are in SF3
  (UVRABC SYSTEM PROTEIN A), and all 97 are named UvrABC system protein A. The single
  reviewed SF1 member, P52087 from Paucimonas lemoignei, is a 689-residue UniProt fragment of
  a canonical UvrA whose annotation is by similarity, so it does not show SF1 to be
  functionally distinct. SF2 (DRUG RESISTANCE ABC TRANSPORTER) has no reviewed member, and
  nothing in the cached evidence shows what its members do. The damage-recognition role is
  therefore established for SF3 only. The family is coherent where it is characterized, and
  the SF1/SF2 paralog subfamilies are unassessed.
