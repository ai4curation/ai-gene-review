notes: >-
  PTN000655914 is the family root (PTHR43152:AN0), annotated in the TreeGrafter table with
  GO:0003677, GO:0005829 and GO:0006974. Leaves in all three subfamilies (SF1, SF2 and SF3)
  inherit these terms. Its assertions are sound but generic, and it does not assert
  GO:0003684 or any NER term. A module that grounds the UvrA damage-recognition annoton
  should therefore cite PTHR43152:SF3 (with the term_assessments above), not
  PTN000655914, as the ancestral node for damaged DNA binding. InterPro metadata reports 3
  subfamilies and 48,142 proteins; only the 97 reviewed members were inspected. The SF1 and
  SF2 subfamilies were not characterized because no reviewed or experimentally studied
  member exists in the cached inventory.
