  name:
    name: ABC transporter G
    short: ABCG
  description:
  - text: The ABC transporter G family is involved in a variety of cellular processes
      related to defense and transport. Members of this family function as transporters
      for a wide range of substrates, including secondary metabolites, abscisic acid,
      strigolactones, and xenobiotics. They play roles in plant defense by exporting
      toxic compounds and contributing to resistance against pathogens and heavy metals.
      Additionally, they are involved in the regulation of plant development by mediating
      the transport of plant hormones and signaling molecules. This family is also
      implicated in modulating plant architecture and interactions with symbiotic
      fungi, as well as in the detoxification and excretion of herbicides and other
      chemicals.
