  supported_by:
  - reference_id: PMID:16280320
    supporting_text: Dolichol-phosphate mannose (DPM) synthase is required for synthesis of the
      glycosylphosphatidylinositol (GPI) anchor, N-glycan precursor, protein O-mannose, and
      C-mannose.
