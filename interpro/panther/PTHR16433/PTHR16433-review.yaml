    label: protein-membrane adaptor activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The module's activity for this family and the core function in both gene reviews. The
    tethering of DPM1 by the DPM3 coiled coil was shown in mammalian cells; the activity is
    assigned to the rest of the family by orthology, supported by the S. pombe complementation.
    No PAINT node asserts it yet.
  supported_by:
  - reference_id: PMID:16280320
    supporting_text: A coiled-coil domain near the C terminus of DPM3 was important for tethering
      DPM1, the catalytic subunit of the enzyme, to the endoplasmic reticulum membrane and,
      therefore, was critical for enzyme activity.
- assessed_term:
    id: GO:0033185
    label: dolichol-phosphate-mannose synthase complex
  scope: FAMILY_WIDE
