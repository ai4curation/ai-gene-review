family_id: PANTHER:PTHR16433
family_name: DOLICHOL-PHOSPHATE MANNOSYLTRANSFERASE SUBUNIT 3
preferred_name: DPM3, membrane-anchoring subunit of the three-subunit Dol-P-Man synthase
summary: >-
  Small (about 90 residues) endoplasmic-reticulum membrane proteins that anchor the soluble
  catalytic subunit DPM1 of the heterotrimeric dolichol-phosphate-mannose synthase
  (DPM1-DPM2-DPM3). The N-terminal part spans the membrane and a C-terminal coiled coil binds
  and tethers DPM1, stabilizing it; without DPM3 the synthase has no detectable activity. The
  family is present in animals, plants, Dictyostelium, Candida and fission yeast, and absent from
  S. cerevisiae, whose DPM1 carries its own C-terminal membrane anchor.
functional_coherence: COHERENT
coherence_reason: >-
  The family has a single subfamily (SF0) and all reviewed members are DPM3 orthologs of the
  same complex. S. pombe dpm3 restores Dol-P-Man synthesis in DPM2-null hamster cells, showing
  functional equivalence across the fungal-animal split.
