  label: DNA-DIRECTED RNA POLYMERASE, MITOCHONDRIAL
  description: Verified sequence-classification group containing rpo41. Functional transfer is qualified
    in the family and term assessments.
  representative_members:
  - id: UniProtKB:O13993
    gene_symbol: rpo41
    organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
    gene_review: genes/SCHPO/rpo41/rpo41-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  scope: FAMILY_WIDE
  scope_reason: The conserved function represented by DNA-directed RNA polymerase activity is the family
    core for intact members. DNA-dependent RNA synthesis is the conserved biochemical role; mitochondrial
    residence and dependence on a particular initiation factor are not properties of every phage-type
    polymerase. For Rpo41, distinguish the polymerase reaction from mitochondrial promoter recognition
    by the holoenzyme.
  supported_by:
  - reference_id: PMID:21357609
    supporting_text: We show biochemically, that purified Mtf1 and Rpo41 together can bind to the S. pombe
      mitochondrial promoters and can support transcription from the S. pombe mitochondrial promoters
      in vitro.
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR10102-evidence.md
    supporting_text: DNA-dependent RNA polymerase catalyzes the transcription of DNA into RNA using the
      four ribonucleoside triphosphates as substrates. Combines in the mitochondrion with mitochondrial
      transcription factor mtf1 as a holoenzyme to recognize and initiate transcription at the core mitochondrial
      promoters
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR10102-evidence.md
    supporting_text: The phage-type enzymes are a family of single chain polymerases found in bacteriophages
      and mitochondria [[cite:PUB00003849], [cite:PUB00101425]].
references:
