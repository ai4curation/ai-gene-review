family_id: PANTHER:PTHR10102
family_name: DNA-DIRECTED RNA POLYMERASE, MITOCHONDRIAL
summary: Phage-type RNA polymerases are single-chain enzymes that synthesize RNA from DNA templates. Mitochondrial
  members combine the conserved polymerase core with lineage-specific targeting and transcription-factor
  interactions.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Purified pombe Rpo41 and Mtf1 transcribe mitochondrial promoters in vitro (PMID:21357609).
  The family inventory also includes phage enzymes and plant chloroplastic or dual-targeted polymerases.
  DNA-directed RNA synthesis is the conserved reaction, while mitochondrial localization and dependence
  on a particular initiation factor are lineage-specific properties of the transcription system.
subfamilies:
