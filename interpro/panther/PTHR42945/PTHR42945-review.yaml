family_id: PANTHER:PTHR42945
family_name: HISTIDINE BIOSYNTHESIS BIFUNCTIONAL PROTEIN
preferred_name: HisI/HisE (PRA-CH/PRA-PH) histidine biosynthesis family
summary: >-
  Enzymes of the second and third steps of histidine biosynthesis, built from two unrelated
  domains: the phosphoribosyl-AMP cyclohydrolase domain (PRA-CH, HisI, Pfam PF01502), which opens
  the adenine ring of phosphoribosyl-AMP, and the phosphoribosyl-ATP pyrophosphohydrolase domain
  (PRA-PH, HisE, Pfam PF01503), which hydrolyses phosphoribosyl-ATP to phosphoribosyl-AMP and
  diphosphate. PANTHER groups three architectures in one family: standalone HisI (Pseudomonas
  putida hisI, Mycobacterium tuberculosis hisI), standalone HisE (P. putida hisE, M. tuberculosis
  hisE), and bifunctional HisIE fusions carrying both domains (Escherichia coli HisIE,
  Schizosaccharomyces pombe his7, Arabidopsis HISN2). All three participate in histidine
  biosynthesis; which of the two catalytic activities a member has depends on which domains it
  carries, and the subfamilies do not follow that division.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every reviewed member is a histidine-biosynthesis HisI, HisE or HisIE protein, so the process is
  coherent. The two molecular functions are not: per the members' UniProt Pfam cross-references,
  SF1 holds 241 PRA-CH-only, 113 PRA-PH-only and 20 bifunctional members, SF9 holds 6 PRA-CH-only,
  169 PRA-PH-only and 39 bifunctional members, and SF11 holds 47 PRA-CH-only members (635 reviewed
  members in all). No subfamily is uniform for both activities.
