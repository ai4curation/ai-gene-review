    supporting_text: "PTHR42945\tPTN000479135\tGO:0000105\tP\tIBD\tfalse"
  - reference_id: PMID:8299169
    supporting_text: >-
      We have cloned the his7+ gene of the fission yeast Schizosaccharomyces pombe by
      complementation of the recessive mutant allele his7-366.
term_assessments:
- assessed_term:
    id: GO:0000105
    label: L-histidine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Every reviewed member is a HisI, HisE or HisIE histidine-biosynthesis enzyme; accepted by S.
    pombe his7 and P. putida hisE and hisI. SF7 has no reviewed member; its plant PRA-CH-domain
    proteins are included on the domain evidence.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42945/PTHR42945-paint.tsv
    supporting_text: "PTHR42945\tPTN000479135\tGO:0000105\tP\tIBD\tfalse"
  - reference_id: file:genes/SCHPO/his7/his7-ai-review.yaml
    supporting_text: PAINT inference; steps 2 and 3 of histidine biosynthesis.
- assessed_term:
    id: GO:0004635
    label: phosphoribosyl-AMP cyclohydrolase activity
  scope: UNRESOLVED
  scope_reason: >-
    Decided by the presence of the PRA-CH domain (PF01502), not by subfamily. It holds for the
    standalone HisI proteins (SF11, most of SF1 including P. putida hisI, six SF9 members) and for
    the bifunctional HisIE proteins (S. pombe his7, E. coli HisIE, in SF1 and SF9). It does not
    hold for the 282 reviewed standalone HisE proteins (113 in SF1, 169 in SF9, including P.
    putida hisE), which have only the PRA-PH domain. Both large subfamilies mix the two, so a
    SUBFAMILY_ONLY scope would be wrong for a third or more of each, and listing every HisE as a
    member exception is impractical. The root IBA wrongly reaches standalone HisE proteins (see
    the node assessment).
  supported_by:
  - reference_id: file:genes/PSEPK/hisI/hisI-uniprot.txt
    supporting_text: Catalyzes the hydrolysis of the adenine ring of phosphoribosyl-AMP.
  - reference_id: file:genes/PSEPK/hisE/hisE-uniprot.txt
    supporting_text: Belongs to the PRA-PH family.
  - reference_id: PMID:8299169
    supporting_text: >-
      The his7+ gene is able to complement a mutation of the Escherichia coli hisI gene,
      suggesting that his7+ encodes a phosphoribosyl-AMP cyclohydrase.
- assessed_term:
    id: GO:0004636
    label: phosphoribosyl-ATP diphosphatase activity
  scope: UNRESOLVED
  scope_reason: >-
    Decided by the presence of the PRA-PH domain (PF01503), not by subfamily. It holds for the
    standalone HisE proteins (P. putida hisE) and the bifunctional HisIE proteins (S. pombe his7,
    E. coli HisIE), but not for the 294 reviewed standalone HisI proteins (241 in SF1, 47 in SF11,
    6 in SF9), which have only the PRA-CH domain. PAINT asserts it at no node. P. putida hisI
    (SF1, PRA-CH only) carries an electronic diphosphatase row that its gene review removes,
    consistent with this domain-based reading; a subfamily-level grant for SF1 would repeat that
    error across its 241 standalone HisI members.
  supported_by:
  - reference_id: file:genes/SCHPO/his7/his7-uniprot.txt
    supporting_text: >-
      his7 (phosphoribosyl-AMP cyclohydrolase and phosphoribosyl-ATP pyrophosphatase activities)
  - reference_id: file:genes/PSEPK/hisI/hisI-uniprot.txt
    supporting_text: Belongs to the PRA-CH family.
