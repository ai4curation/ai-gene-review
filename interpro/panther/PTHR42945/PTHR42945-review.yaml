notes: >-
  Member counts and domain architectures were derived from the entries inventory (635 reviewed
  members: SF1 374, SF9 214, SF11 47; SF7 has none) and the members' UniProt Pfam
  cross-references queried on 2026-11-10. PAINT recipients were read from PANTHER's leaf IBA
  file: PTN000479135 (family root, AN0) has 92 recipients (SF1 70, SF9 17, SF7 3, SF11 2). The
  fungal trifunctional HIS4 proteins, which also carry PRA-CH and PRA-PH regions, are classified
  in PTHR21256 rather than here. The histidine_biosynthesis module asserts no PANTHER family for
  the HisE/HisI steps because the subfamilies do not separate the architectures; this review
  agrees.
