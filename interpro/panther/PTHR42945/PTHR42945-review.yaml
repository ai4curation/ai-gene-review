node_assessments:
- node_id: PANTHER:PTN000479135
  asserted_term:
    id: GO:0004635
    label: phosphoribosyl-AMP cyclohydrolase activity
  evidence: IBD
  paint_snapshot: '20250919'
  seeds:
  - id: AGI_LocusCode:AT1G31860
  - id: PomBase:SPBC29A3.02c
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node is the family root (PTHR42945:AN0 in PANTHER's TreeGrafter node table), seeded by two
    bifunctional HisIE proteins (Arabidopsis HISN2 and S. pombe his7). The cyclohydrolase is
    correct for every member with a PRA-CH domain, and PRA-CH-containing recipients (his7, HISN2,
    E. coli HisIE, M. tuberculosis hisI) retain it. But the root also covers the standalone HisE
    proteins, which have only the PRA-PH domain and cannot catalyse this reaction. Of the 92 leaf
    recipients in the PAINT leaf file, ten reviewed standalone HisE proteins (Listeria
    monocytogenes Q8Y9G7, Leptospira Q8EXX8, Pyrobaculum Q8ZY18, P. aeruginosa Q9HUB6, Bacillus cereus
    Q81G00, Clostridium botulinum A5I248, Geobacter P60536, Neisseria Q9K0J4, M.
    tuberculosis P9WMM9, Streptomyces Q9EWK0) inherit the IBA. These leaves are spread across SF1
    and SF9, so no single subfamily can be named for pruning: IRDs are needed at the standalone
    HisE clades within those subfamilies. P. putida hisE is not a PAINT recipient and carries no
    cyclohydrolase row.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42945/PTHR42945-paint.tsv
    supporting_text: "PTHR42945\tPTN000479135\tGO:0004635\tF\tIBD\tfalse"
  - reference_id: UniProtKB:P9WMM9
    supporting_text: Belongs to the PRA-PH family.
  - reference_id: UniProtKB:Q9HUB6
    supporting_text: Belongs to the PRA-PH family.
  - reference_id: PMID:8299169
    supporting_text: >-
      The his7+ gene is able to complement a mutation of the Escherichia coli hisI gene,
      suggesting that his7+ encodes a phosphoribosyl-AMP cyclohydrase.
- node_id: PANTHER:PTN000479135
  asserted_term:
    id: GO:0000105
    label: L-histidine biosynthetic process
  evidence: IBD
  paint_snapshot: '20250919'
  seeds:
