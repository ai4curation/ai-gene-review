  - id: UniProtKB:P06989
  assessment: SOUND
  assessment_reason: >-
    Every architecture in the family (HisI, HisE, HisIE) catalyses step 2 or step 3, or both, of
    histidine biosynthesis, so the process is correctly placed at the root. The reviewed recipient
    his7 retains it, and the non-recipient P. putida hisE and hisI carry it by other routes.
  supported_by:
