family_id: PANTHER:PTHR12737
family_name: DIMETHYLARGININE DIMETHYLAMINOHYDROLASE
preferred_name: Dimethylarginine dimethylaminohydrolases
summary: >-
  PTHR12737 contains DDAH1, which hydrolyses the nitric oxide synthase inhibitor asymmetric dimethylarginine,
  and its paralog DDAH2, whose own hydrolase activity is doubtful but which influences endothelial nitric
  oxide production.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  DDAH1 has the enzymatic function; DDAH2 keeps the fold and affects NO production by a mechanism that
  does not require ADMA hydrolysis.
node_assessments:
- node_id: PANTHER:PTN002653588
  asserted_term:
    id: GO:0045429
    label: positive regulation of nitric oxide biosynthetic process
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN000978164
    label: PTN000978164 (ancestral IBD node; IRD source)
  paint_snapshot: '20230718'
  node_taxon:
    id: NCBITaxon:117571
    label: Euteleostomi
  assessment: LOSS_CONTRADICTED
  proposed_action:
    paint_action: REMOVE_LOSS
  assessment_reason: >-
    PTN002653588 is the euteleostome DDAH2 clade (18 leaves, SF16). The node also carries IRDs for dimethylargininase
    activity and arginine catabolism, which reflect doubts about DDAH2's own hydrolase activity. Positive
    regulation of NO production is a different claim: in bovine endothelial cells, DDAH2 overexpression
    raised NO by 18% and siRNA knockdown reduced NO bioavailability by 57% without changing l-Arg/ADMA,
    so DDAH2 promotes NO by a mechanism other than ADMA hydrolysis (PMID:19820234). The process loss is
    contradicted even if the enzyme losses stand.
  supported_by:
  - reference_id: file:interpro/panther/PTHR12737/PTHR12737-paint.tsv
    supporting_text: "PTHR12737\tPTN002653588\tGO:0045429\tP\tIRD\ttrue"
  - reference_id: PMID:19820234
    supporting_text: down-regulation of DDAH-1 and DDAH-2 reduced NO bioavailability by 27 and 57%,
