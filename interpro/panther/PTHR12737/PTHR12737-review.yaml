family_id: PANTHER:PTHR12737
family_name: DIMETHYLARGININE DIMETHYLAMINOHYDROLASE
preferred_name: DDAH1/DDAH2 and bacterial dimethylargininases
summary: >-
  PTHR12737 groups active bacterial and DDAH1-like dimethylargininases with the
  vertebrate DDAH2 paralog. Human DDAH1 hydrolyzes the endogenous nitric oxide synthase
  inhibitors ADMA and L-NMMA to L-citrulline, thereby promoting nitric oxide production.
  Human DDAH2 is homologous but has no detectable ADMA/L-NMMA dimethylargininase activity;
  it instead has a catalytically unresolved role in mitochondrial fission and MAVS-linked
  innate antiviral signaling.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The fold is coherent, but the DDAH2 subfamily has lost the canonical
  dimethylargininase activity propagated through the DDAH1/bacterial part of the family.
  PANTHER 19.0 already records IRD losses at the DDAH2 node for the DDAH1 catalytic and
  DDAH1-dependent nitric-oxide process terms.
notes: >-
  The review used the PANTHER 19.0 PAINT file in this directory. The compact tree was not
  cached, so PTN000978164 is treated as PAINT's active ancestral IBD node for
  DDAH1/bacterial dimethylargininase rows, and PTN002653588 is treated as PAINT's
  DDAH2 loss node because the three IRD rows in PTHR12737-paint.tsv name it as the
  negated node.
