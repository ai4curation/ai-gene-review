family_id: PANTHER:PTHR11055
family_name: BIFUNCTIONAL 3'-PHOSPHOADENOSINE 5'-PHOSPHOSULFATE SYNTHASE
preferred_name: APS kinases, animal bifunctional PAPS synthases and plant plastid ATP sulfurylases
summary: >-
  Family built around adenylylsulfate (APS) kinase, which phosphorylates adenosine
  5'-phosphosulfate to 3'-phosphoadenosine 5'-phosphosulfate (PAPS). It contains three
  architectures. (1) Monofunctional APS kinases of about 200-300 residues: bacterial CysC
  (E. coli, Bacillus), fungal MET14 (S. cerevisiae, S. pombe) and the plant APK1-4 isoforms.
  (2) Animal bifunctional PAPS synthases (human PAPSS1 and PAPSS2, worm pps-1) with an N-terminal
  APS kinase domain fused to a C-terminal ATP sulfurylase domain, which make PAPS from sulfate
  in two steps. (3) The Arabidopsis plastid ATP sulfurylases APS1-4 (about 465 residues), which
  carry only the ATP sulfurylase and PUA-like domains and no APS kinase domain; PANTHER places them
  here through their similarity to the sulfurylase half of PAPSS. Members act in sulfate
  activation, either for reductive assimilation (fungi, bacteria, plants) or for sulfonation
  (animal PAPS).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Sulfate assimilation/activation is common to all members, but the two catalytic activities are
  split by domain architecture. APS kinase activity holds for the monofunctional APS kinases
  (SF1, SF63, SF53, SF44) and for the bifunctional PAPS synthases (SF16, SF17, and worm pps-1 in
  SF1), but not for the Arabidopsis plastid ATP sulfurylases APS1-4 (SF46, SF37, SF77, SF39),
  which lack the APS kinase domain. ATP sulfurylase activity holds for PAPSS1/2 and APS1-4 but
  not for MET14, met14, CysC or the APK isoforms. SF1 ("PAPS SYNTHETASE, ISOFORM D") mixes
  monofunctional APS kinases (MET14, met14, B. subtilis CysC, Arabidopsis APK3) with the
  bifunctional C. elegans pps-1.
