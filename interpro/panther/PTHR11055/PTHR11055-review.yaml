notes: >-
  Modules: aps_dependent_assimilatory_sulfate_reduction (PTHR11055 family-level, GO:0004020
  required_function, MET14/met14/CysC) and paps_sulfate_activation (PTHR11055 family-level for
  both the ATP sulfurylase GO:0004781 and the APS kinase GO:0004020 annotons on PAPSS1/2, without
  a required_function). The aps module note says the family contains monofunctional APS kinases
  but does not mention the Arabidopsis plastid ATP sulfurylases APS1-4, which are also members.
  Gene reviews MET14, met14, PAPSS1 and PAPSS2 accept all IBAs from this family; consistent here.
  Domain architecture of Q9LIK9 was checked against UniProt REST (Pfam PF01747, PF14306;
  EC 2.7.7.4; 463 aa) on 2026-10-06. Seed P9WNM5 (M. tuberculosis CysC) is a seed per the paint
  file; its own architecture was not checked.
