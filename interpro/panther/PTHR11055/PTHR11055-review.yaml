    PUA_2 Pfam domains for APS1) and are ATP sulfurylases (EC 2.7.7.4). An IRD for GO:0004020 is
    needed on the plant ATP sulfurylase clade. The PAINT taxon recorded for the node (Bacteria,
    taxon:2) is inconsistent with its descendants, which include fungi, animals and plants.
    MET14, met14, PAPSS1 and PAPSS2 are correctly annotated, as their gene reviews conclude.
