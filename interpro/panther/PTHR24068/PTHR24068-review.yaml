family_id: PANTHER:PTHR24068
family_name: UBIQUITIN-CONJUGATING ENZYME E2
preferred_name: E2 ubiquitin/ubiquitin-like conjugating enzymes (UBC-fold superfamily slice)
summary: >-
  This family collects UBC-fold E2 enzymes. Most members are genuine ubiquitin-conjugating
  enzymes: they accept ubiquitin from E1 onto an invariant catalytic cysteine, forming an
  E2~ubiquitin thioester, and hand it to substrates in cooperation with E3 ligases, which
  supply most of the substrate and linkage specificity. The family is broader than that
  core in two directions that matter for annotation. First, it contains catalytically dead
  UEV proteins (UBE2V1/UBE2V2, yeast Mms2, worm uev-1) that keep the UBC fold but have no
  catalytic cysteine; they act as obligate partners of UBE2N/Ubc13 in K63 chain synthesis
  rather than as conjugating enzymes themselves. Second, in the tree version behind the
  cached PAINT slice it contains the NEDD8-conjugating branch (UBC12/UBE2M and UBE2F),
  which retains the catalytic cysteine but charges NEDD8, not ubiquitin. Linkage
  specificity is unevenly distributed across the active members: UBE2K, UBE2N-UBE2V and
  UBE2S build defined K48, K63 and K11 chains respectively, while the UBE2D (UbcH5) and
  UBE2E groups are promiscuous E2s whose linkage output in vitro spans many ubiquitin
  lysines and in vivo is set by the partner E3. That unevenness is the root of the
  family's over-annotation pattern: linkage-specific process terms seeded from promiscuous
  members.

functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Three functionally distinct groups are lumped: active ubiquitin E2s (UBE2D/E/K/N/S and
  many others), catalytically inactive UEV pseudo-E2s (UBE2V1/UBE2V2/Mms2) that cannot
  form the E2~ubiquitin thioester, and the NEDD8-charging clade (UBC12/UBE2F) whose
  cargo is a different ubiquitin-like protein. In addition, the active ubiquitin E2s
  split into linkage-dedicated members (UBE2S for K11, UBE2N-UBE2V for K63) and
  promiscuous members (UBE2D, UBE2E), so no linkage-specific term is safe at family
  level either.

reference_protein:
  id: UniProtKB:P62837
  label: Ubiquitin-conjugating enzyme E2 D2
  gene_symbol: UBE2D2
  organism: Homo sapiens

subfamilies:
  - label: UBE2D (UbcH5) clade
    description: >-
      The promiscuous UbcH5 group (UBE2D1-4 and the rat-specific paralog Ube2d2b). These
      are broad-spectrum E2 donors for very many RING E3s; in E3-free in vitro reactions
      they polymerize ubiquitin through multiple lysines, and their physiological linkage
      output is determined by the partner E3. The disputed K11 IBD at PTN002374325 sits
      over this clade. The clade spans several PANTHER subfamilies (per PANTHER's
      per-organism classifications via the member index: P62837 in SF330, P61077 in
      SF415, P51668 in SF36, Q9Y2X8 in SF24, P70711 in SF44), so no single subfamily_id
      is asserted on this grouped entry; the rat gene's own subfamily has its own entry
      below.
    representative_members:
      - {id: UniProtKB:P62837, label: UBE2D2, gene_symbol: UBE2D2, organism: Homo sapiens}
      - {id: UniProtKB:P61077, label: UBE2D3, gene_symbol: UBE2D3, organism: Homo sapiens}
      - {id: UniProtKB:P51668, label: UBE2D1, gene_symbol: UBE2D1, organism: Homo sapiens}
      - {id: UniProtKB:Q9Y2X8, label: UBE2D4, gene_symbol: UBE2D4, organism: Homo sapiens}
      - {id: UniProtKB:P70711, label: Ube2d2b, gene_symbol: Ube2d2b,
         organism: Rattus norvegicus,
         gene_review: genes/rat/Ube2d2b/Ube2d2b-ai-review.yaml}
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR24068:SF44
    label: UBIQUITIN-CONJUGATING ENZYME E2 D2B
    description: >-
      The subfamily of the rat gene whose review raised this family's dispute. A
      rodent-restricted UBE2D paralog; its member Ube2d2b retains the catalytic Cys85
      and inherits the sound GO:0061631 IBA from PTN002514495 and the disputed K11 IBA
      from PTN002374325.
    representative_members:
      - {id: UniProtKB:P70711, label: Ube2d2b, gene_symbol: Ube2d2b,
         organism: Rattus norvegicus,
         gene_review: genes/rat/Ube2d2b/Ube2d2b-ai-review.yaml}
    diverged_from_family: false

  - label: UEV clade (catalytically inactive)
    clade_node_id: PANTHER:PTN000629507
    description: >-
      Ubiquitin E2 variant proteins (UBE2V1, UBE2V2, yeast Mms2, worm uev-1). They keep
      the UBC fold but lack the catalytic cysteine entirely, so they cannot be charged
      with ubiquitin; they function as the non-catalytic half of the UBE2N(Ubc13)-UEV
      heterodimer that directs K63 chain synthesis. PAINT itself recognizes this: the
      cached slice carries an IRD pruning of GO:0061631 at this node (source
      PTN002514495, 20260529). The catalytic_cys residue site below makes the loss
      checkable (UBE2V1 has V at the aligned position, UBE2V2 has V).
    representative_members:
      - {id: UniProtKB:Q13404, label: UBE2V1, gene_symbol: UBE2V1, organism: Homo sapiens}
      - {id: UniProtKB:Q15819, label: UBE2V2, gene_symbol: UBE2V2, organism: Homo sapiens}
    diverged_from_family: true
    divergence_description: >-
      No catalytic cysteine anywhere at the active-site position, so no E2~ubiquitin
      thioester and no conjugating activity. UEVs contribute to ubiquitination only as
      obligate structural partners of UBE2N; ubiquitin conjugating enzyme activity
      (GO:0061631) must not be inherited here, and the PAINT IRD at PTN000629507
      correctly stops it.

  - label: NEDD8-conjugating clade (UBC12/UBE2F)
    clade_node_id: PANTHER:PTN000630367
    description: >-
      The NEDD8-charging branch, carrying the GO:0019788 (NEDD8 transferase activity)
      IBD in the cached slice, seeded by human UBE2M and UBE2F, yeast UBC12, mouse
      Ube2f and a fly member. These enzymes retain the catalytic cysteine (human UBE2M
      Cys111, UBE2F Cys116, both UniProt ACT_SITE and both verified against the
      sequences) but their cargo is NEDD8, so ubiquitin-specific terms are pruned here
      (IRDs on GO:0061631 and GO:0000209 at this node, source PTN002514495).
      Representative members are deliberately not listed with accessions: current
      UniProt PANTHER cross-references classify UBE2M and UBE2F into PTHR24067, i.e.
      this branch sits in PTHR24068 in the tree version behind the cached PAINT slice
      but has moved family in a newer PANTHER release (see notes).
    diverged_from_family: true
    divergence_description: >-
      Conjugates the ubiquitin-like protein NEDD8 onto cullins rather than ubiquitin
      onto substrates. The catalytic machinery is intact, so this divergence is
      cargo-identity, not catalytic loss - which is exactly why a residue site alone
      cannot decide GO:0061631 applicability and the PAINT prunings are still needed.

  - subfamily_id: PANTHER:PTHR24068:SF126
    label: UBIQUITIN-CONJUGATING ENZYME E2 S
    description: >-
      The UBE2S subfamily: the dedicated K11 chain elongator of the APC/C pathway, and
      the branch for which protein K11-linked ubiquitination is genuinely a defining,
      heritable function. Human UBE2S (Q16763) appears among the experimental seeds of
      the family's GO:0061631 IBD in the cached PAINT slice; it is not listed as a
      representative member here because its current UniProt PANTHER cross-reference
      classifies it into PTHR24067 (release skew, see notes).
    diverged_from_family: false

node_assessments:
  - node_id: PANTHER:PTN002374325
    asserted_term:
      id: GO:0070979
      label: protein K11-linked ubiquitination
    node_taxon: {id: NCBITaxon:40674, label: Mammalia}
    paint_snapshot: "20171201"
    seeds:
      - id: UniProtKB:P61077
        label: UBE2D3
        gene_symbol: UBE2D3
        organism: Homo sapiens
    assessment: WRONG_NODE
    assessment_reason: >-
      A single-seed IBD asserting a linkage-specific process at the mammalian UBE2D
      ancestor, and the seed's evidence does not establish that process as a heritable
      clade property. The only experimental GO:0070979 annotation on the seed, human
      UBE2D3, is an IDA from PMID:20061386 (verified via QuickGO) - a systematic in
      vitro survey run deliberately in the absence of any E3, whose finding is that E2s
      direct polyubiquitination to "distinct subsets of ubiquitin lysines"; for the
      promiscuous UbcH5/UBE2D group that subset is broad, which is evidence of linkage
      promiscuity, not of dedicated K11 chain assembly. Physiological K11 chain
      formation is credited to the APC/C working with UBE2C and the K11-specific
      elongator UBE2S (the same paper's introduction: "Lys 11 conjugates were shown to
      be catalyzed by the APC E3 complex and E2C"; Jin et al. 2008, PMID:18485873, for
      the APC/C K11 topology), with UBE2D contributing at most priming
      mono/oligo-ubiquitination in that context. Converting one E3-free promiscuity
      observation into a K11-specific IBD makes every mammalian UBE2D inherit a chain
      specificity the clade does not have; the rat Ube2d2b review correctly marks the
      resulting IBA as over-annotation. No alternative node placement would fix this -
      the term should be withdrawn at this node and the general chain-building biology
      left to the well-seeded GO:0000209/GO:0061631 assertions at PTN002514495. The
      same slice repeats the pattern as single-seed K11 IBDs at PTN000756344 (UBE2D4),
      PTN008604341 (UBE2E2) and PTN008604347 (UBE2E3); all three seeds' K11 IDAs trace
      to the same PMID:20061386 survey (verified via QuickGO), so the same judgment
      applies there. Note this is a term-evidence failure, not a clade-placement error:
      PTN002374325 is a reasonable UBE2D-clade node for genuinely clade-wide functions
      (see the K48 assessment below). The affected subfamilies listed are the two whose
      descent from this node is directly evidenced (the seed's own subfamily, and rat
      Ube2d2b's, which demonstrably receives the IBA); other UBE2D subfamilies may also
      be affected but their descent from this particular node was not established.
    affected_subfamilies:
      - {id: PANTHER:PTHR24068:SF415, label: UBIQUITIN-CONJUGATING ENZYME E2 D3}
      - {id: PANTHER:PTHR24068:SF44, label: UBIQUITIN-CONJUGATING ENZYME E2 D2B}

  - node_id: PANTHER:PTN002374325
    asserted_term:
      id: GO:0070936
      label: protein K48-linked ubiquitination
    node_taxon: {id: NCBITaxon:40674, label: Mammalia}
    paint_snapshot: "20171201"
    seeds:
      - id: UniProtKB:P61077
        label: UBE2D3
        gene_symbol: UBE2D3
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Recorded as the contrast to the K11 assessment at the same node, because the two
      IBDs share the same single seed and even the same underlying paper (UBE2D3 K48
      IDA, PMID:20061386) yet deserve different verdicts. K48 chain formation is not an
      artifact of the E3-free assay: it is the canonical degradative linkage
      ("...most ubiquitin-dependent proteasomal degradations were found to be mediated
      by Lys 48 polyubiquitin chains", PMID:20061386), UBE2D enzymes build K48 chains
      with their many RING E3 partners in vivo, and the claim coheres with the
      independent, ten-seed GO:0006511 (ubiquitin-dependent protein catabolic process)
      IBD at PTN000631055 that also covers the UBE2D genes, and with UniProt's function
      line for the clade (selective degradation of short-lived and abnormal proteins).
      The rat gene review accepts the corresponding IBA. The single-seed WITH list is
      thin on its face but the placement is corroborated; per IBA doctrine, donor count
      is not evidential strength.

  - node_id: PANTHER:PTN002514495
    asserted_term:
      id: GO:0061631
      label: ubiquitin conjugating enzyme activity
    paint_snapshot: "20260529"
    seeds:
      - {id: UniProtKB:P62837, label: UBE2D2, gene_symbol: UBE2D2, organism: Homo sapiens}
      - {id: UniProtKB:P61077, label: UBE2D3, gene_symbol: UBE2D3, organism: Homo sapiens}
      - {id: UniProtKB:P51668, label: UBE2D1, gene_symbol: UBE2D1, organism: Homo sapiens}
      - {id: UniProtKB:Q9Y2X8, label: UBE2D4, gene_symbol: UBE2D4, organism: Homo sapiens}
      - {id: UniProtKB:P61088, label: UBE2N, gene_symbol: UBE2N, organism: Homo sapiens}
      - {id: UniProtKB:O00762, label: UBE2C, gene_symbol: UBE2C, organism: Homo sapiens}
      - {id: UniProtKB:Q16763, label: UBE2S, gene_symbol: UBE2S, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: >-
      The healthy counterpart to the K11 node, and the model of what a well-supported
      IBD looks like in this family: the ubiquitin conjugating enzyme activity
      assertion is seeded by more than forty experimentally annotated members spanning
      animals, fungi and plants (the seed list above is a readable subset of PAINT's
      WITH list), and the curator actively maintains the boundary with IRD prunings
      where the function is genuinely absent - at PTN000629507 for the UEV clade,
      which has no catalytic cysteine, and at PTN000630367 for the NEDD8 clade, whose
      cargo is NEDD8 (that node also prunes GO:0000209). Neither pruned clade contains
      the UBE2D genes, so the IBA descending to rat Ube2d2b is sound, and the target
      demonstrably retains the machinery: P70711 carries the catalytic Cys85 (UniProt
      ACT_SITE, verified against the sequence; see catalytic_cys).

residue_sites:
  - site_id: catalytic_cys
    label: E2 catalytic cysteine (thioester acceptor)
    description: >-
      The invariant active-site cysteine of the UBC fold that receives ubiquitin from
      E1 as a thioester (UniProt annotates it as "Glycyl thioester intermediate").
      Without it no E2~ubiquitin conjugate can form, so its absence cleanly separates
      the UEV pseudo-E2s from every active member. Positions were verified against the
      actual UniProt sequences and cross-mapped with a FAMSA multiple alignment of
      eight family members; the mapping is corroborated by three independent UniProt
      ACT_SITE anchors (UBE2N Cys87, UBE2M Cys111, UBE2F Cys116) landing on the same
      alignment column as UBE2D2 Cys85. Note the site is necessary, not sufficient,
      for GO:0061631: the NEDD8 clade retains the cysteine but charges NEDD8, which is
      why PAINT's IRD at PTN000630367 is still required.
    anchor:
      id: UniProtKB:P62837
      label: UBE2D2
      gene_symbol: UBE2D2
      organism: Homo sapiens
    anchor_sequence_version: 1
    site_source: UNIPROT_FEATURE
    residues:
      - position: 85
        expected: [C]
        role: nucleophile; accepts ubiquitin from E1 as a glycyl thioester (E2~Ub)
    required_for:
      - term:
          id: GO:0061631
          label: ubiquitin conjugating enzyme activity
        strength: REQUIRED
        rationale: >-
          E2 catalysis proceeds through a covalent E2~ubiquitin thioester on this
          cysteine; transfer to substrate lysines happens from this thioester. A member
          with no cysteine at the aligned position cannot be charged by E1 at all, so
          the activity is mechanistically impossible, not merely reduced. This is the
          basis on which the UEV clade's GO:0061631 pruning is verified.
        supported_by:
          - reference_id: PMID:20061386
            supporting_text: >-
              Finally, a RING ubiquitin-protein ligase (E3) recruits the substrate and
              guides the transfer of the ubiquitin from the E2 active site cysteine to
              the substrate.
    positive_controls:
      - id: UniProtKB:P61077
        label: UBE2D3
        gene_symbol: UBE2D3
        organism: Homo sapiens
        control_position: 85
        control_residue: C
      - id: UniProtKB:P61088
        label: UBE2N
        gene_symbol: UBE2N
        organism: Homo sapiens
        control_position: 87
        control_residue: C
    negative_controls:
      - id: UniProtKB:Q13404
        label: UBE2V1
        gene_symbol: UBE2V1
        organism: Homo sapiens
        control_position: 100
        control_residue: V
      - id: UniProtKB:Q15819
        label: UBE2V2
        gene_symbol: UBE2V2
        organism: Homo sapiens
        control_position: 98
        control_residue: V

term_assessments:
  - assessed_term:
      id: GO:0070979
      label: protein K11-linked ubiquitination
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      K11-linkage-specific chain assembly is the defining function of the dedicated
      elongator UBE2S, and of no other branch of this family. Every K11 IBD the cached
      slice places on the promiscuous UBE2D/UBE2E branches (PTN002374325, PTN000756344,
      PTN008604341, PTN008604347) is a single-seed assertion whose experimental
      grounding is one E3-free in vitro linkage survey (PMID:20061386) demonstrating
      promiscuity rather than K11 dedication; physiological K11 chains are made by the
      APC/C with UBE2C and UBE2S. UBE2C also carries direct K11 evidence
      (PMID:18485873), but its subfamily accession could not be established from member
      data, so per the omit-rather-than-guess rule it is discussed here and not listed;
      the applicable set below is therefore deliberately conservative.
    applicable_subfamilies:
      - {id: PANTHER:PTHR24068:SF126, label: UBIQUITIN-CONJUGATING ENZYME E2 S}
    supported_by:
      - reference_id: PMID:20061386
        supporting_text: >-
          Lys 11 conjugates were shown to be catalyzed by the APC E3 complex and E2C
      - reference_id: PMID:20061386
        supporting_text: >-
          Because this study was performed in the absence of an E3 enzyme, our data
          indicate that the E2 enzymes are capable of directing the ubiquitination
          process to distinct subsets of ubiquitin lysines, depending on the specific
          E2 utilized
      - reference_id: PMID:18485873
        supporting_text: >-
          substrate degradation by assembling K11-linked ubiquitin chains

  - assessed_term:
      id: GO:0061631
      label: ubiquitin conjugating enzyme activity
    scope: RESIDUE_DETERMINED
    determined_by_site: catalytic_cys
    scope_reason: >-
      Applicability tracks the catalytic cysteine, not a subfamily boundary: any member
      lacking a cysteine at the position aligned to UBE2D2 Cys85 (the UEV clade) cannot
      have the activity, which is the family-level rule behind the PAINT IRD at
      PTN000629507 and behind gene reviews accepting the term for cysteine-retaining
      members such as rat Ube2d2b (Cys85). One asymmetry must be kept in mind when
      using the site: it licenses denial (no cysteine, no activity) but not automatic
      grant - the NEDD8 clade retains the cysteine yet conjugates NEDD8 rather than
      ubiquitin, and its exclusion is carried by the separate IRD at PTN000630367, not
      by this site.

references:
  - id: PMID:20061386
    title: The E2 ubiquitin-conjugating enzymes direct polyubiquitination to preferred lysines.
  - id: PMID:18485873
    title: Mechanism of ubiquitin-chain formation by the human anaphase-promoting complex.

review_status: NEEDS_REVIEW
reviewed_by: AI-assisted family curation (dispute-driven, rat Ube2d2b)
review_date: "2026-08-31"
notes: >-
  Verification notes. (1) Residues were read from the actual UniProt sequences
  (REST): UBE2D2 P62837 Cys85 (SV1), UBE2D3 P61077 Cys85 (SV1), rat Ube2d2b P70711
  Cys85 (SV1), UBE2N P61088 Cys87 (SV1), UBE2M P61081 Cys111, UBE2F Q969M7 Cys116 -
  each matching its UniProt ACT_SITE "Glycyl thioester intermediate" feature. The UEV
  negative-control positions come from a FAMSA MSA of these eight sequences: the
  column carrying all four ACT_SITE cysteines maps to UBE2V1 Q13404 position 100 (V,
  SV2) and UBE2V2 Q15819 position 98 (V, SV4); UBE2V1's only cysteines sit at 71 and
  144, UBE2V2's at 69, so the absence of an active-site cysteine does not hinge on
  the exact column. (2) The K11 provenance was verified via QuickGO: the sole
  experimental GO:0070979 annotations on all four K11 IBD seeds in this family
  (UBE2D3, UBE2D4, UBE2E2, UBE2E3) are IDAs from the single E3-free survey
  PMID:20061386. The gene-side review's narrative attributed UBE2D3's K11 evidence to
  APC/C priming assays; the actual cited evidence is this E3-free linkage survey,
  which if anything argues the over-annotation case more directly (promiscuity
  observed in vitro converted into a linkage-specific heritable claim). The
  conclusion of the gene review stands; its stated evidence trail is corrected here.
  (3) Release skew: current UniProt PANTHER cross-references classify UBE2M, UBE2F
  and UBE2S into PTHR24067, while this repo's panther.obo, entries.csv and the cached
  paint.tsv (which seeds PTN002514495 with Q16763 and PTN000630367 with
  P61081/Q969M7) keep them under PTHR24068. Assessments here are made against the
  cached PAINT slice; accessions whose current classification has moved are cited as
  seeds (checked against PAINT's own WITH lists) but deliberately not asserted as
  subfamily representative members. (4) UniProt PANTHER cross-references for these
  members carry only family-level ids (no :SF), so subfamily placements were taken
  from PANTHER's per-organism classifications via the repo member index
  (refresh-panther-members): P62837 SF330, P61077 SF415, P51668 SF36, Q9Y2X8 SF24,
  P70711 SF44, Q13404 SF323, Q15819 SF177, P61088 SF152. Grouped clade entries
  (UBE2D, UEV, NEDD8) intentionally carry no single subfamily_id because each clade
  spans several SFs; clade PTN nodes from paint.tsv are used where available.
