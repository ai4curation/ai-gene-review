family_id: PANTHER:PTHR11237
family_name: COENZYME Q10 BIOSYNTHESIS PROTEIN 7
preferred_name: COQ7/CLK-1 di-iron demethoxyubiquinone hydroxylase family
summary: >-
  Carboxylate-bridged di-iron hydroxylases that hydroxylate C5 (C6 in some numbering) of demethoxyubiquinone,
  the penultimate step of ubiquinone synthesis, on the matrix face of the mitochondrial inner membrane.
  The family contains bacterial Coq7, S. cerevisiae CAT5/COQ7, S. pombe coq7, C. elegans CLK-1 and
  human COQ7.
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF4) of functionally conserved hydroxylases.
