notes: >-
  Tree topology from the PANTHER 19 treeinfo service (family PTHR45624, fetched 2026-10-06);
  subfamily assignments from entries.csv and the PANTHER 19.0 model-organism classification
  files; propagation sets from the cached PAINT UniProt GAF. Tooling gap: the IRD row
  (PTN001183566, NOT GO:0000064, 20250904) is in .cache/panther/IBD.gaf but absent from the
  fetched PTHR45624-paint.tsv, apparently because a NOT node produces no propagated UniProt GAF
  rows for the fetcher to discover. Two IBD rows in the paint file (PTN000639825, PTN000756668
  thiamine pyrophosphate transport) propagate mostly to proteins that PANTHER 19 classifies
  outside PTHR45624; inside this family only the fungal tpc1 entries in SF10 and SF53 receive
  them. Module inconsistency: urea_cycle uses the whole family id for the substrate-specific
  ornithine carrier activity (GO:0000064); carnitine_shuttle now omits a machine-readable family
  id from the combined SLC25A20/CRC1 annoton because the two representatives sit in distinct
  carnitine/acylcarnitine carrier subfamilies.
