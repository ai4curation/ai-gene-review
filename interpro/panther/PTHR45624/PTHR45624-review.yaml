  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Ornithine carriers: SF22 (SLC25A15), SF20 (SLC25A2) and SF31 (ORT1, arg-13). PTN000641358
    also propagates it to Arabidopsis BOU and Dictyostelium mcfS/mcfY (SF12), plant BAC1 (SF15)
