term_assessments:
- assessed_term:
    id: GO:0015227
    label: O-acyl-L-carnitine transmembrane transporter activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Carnitine/acylcarnitine carriers only (PTN002898998: SF56 SLC25A20, SF4 CRC1/colt/dif-1).
    Not the ornithine, basic amino acid, arginine or YMC carriers. The combined SLC25A20/CRC1
    annoton in the carnitine shuttle module omits a single machine-readable family id because its
    representatives sit in distinct carnitine/acylcarnitine carrier subfamilies. Both member gene
    reviews take the child term GO:0005476 (carnitine:O-acyl-L-carnitine antiporter activity) as
    the core function, which the module could use instead.
