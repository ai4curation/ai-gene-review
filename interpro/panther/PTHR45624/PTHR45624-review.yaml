family_id: PANTHER:PTHR45624
family_name: MITOCHONDRIAL BASIC AMINO ACIDS TRANSPORTER-RELATED
preferred_name: Mitochondrial carrier (SLC25) subgroup of carnitine/acylcarnitine, ornithine and basic amino acid carriers
summary: >-
  A subgroup of the mitochondrial carrier family (SLC25): six-transmembrane inner-membrane
  antiporters with three tandem carrier repeats. PANTHER groups here several carriers with
  different substrates. The carnitine/acylcarnitine carriers (human SLC25A20/CACT, S.
  cerevisiae CRC1, fly colt, worm dif-1) exchange acylcarnitine for carnitine and complete the
  carnitine shuttle; SLC25A20 handles long-chain acylcarnitines and CRC1 mainly carnitine and
  short-chain (acetyl-, propionyl-) carnitines. The ornithine carriers (human SLC25A15/ORNT1 and
  SLC25A2/ORNT2, S. cerevisiae ORT1/ARG11, Neurospora arg-13) exchange ornithine and citrulline
  for the urea cycle or move matrix-made ornithine to the cytosol for arginine synthesis in
  fungi. Other members are the basic amino acid carrier SLC25A29, plant BAC1/BAC2 arginine
  carriers, yeast YMC1/YMC2, and the less characterized SLC25A45, SLC25A47 and SLC25A48.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrate specificity is not shared. The family contains carnitine/acylcarnitine
  antiporters (SF56 SLC25A20, SF4 CRC1 and its fly/worm orthologs), ornithine carriers (SF22
  SLC25A15, SF20 SLC25A2, SF31 ORT1/arg-13, SF12 S. pombe/Arabidopsis/Dictyostelium), the
  basic amino acid carrier SLC25A29 (SF61), plant arginine carriers (SF15, SF10), YMC1/YMC2
  (SF51) and SLC25A45/47/48 (SF6, SF3, SF7). In the PANTHER 19 tree the carnitine
  carriers (below PTN002898998) and the ornithine carriers (below PTN000641358) are separate
  branches under the root duplication PTN002515318. Only generic carrier terms
  (transmembrane transporter activity, mitochondrion) are safe at family level; the two
  module-relevant activities must follow those nodes.
