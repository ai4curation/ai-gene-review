notes: >-
  Reviewed for the selenocysteine biosynthesis and incorporation module, where SelA
  is the bacterial direct-conversion step. Only 11 of the 135 Swiss-Prot members are
  tree leaves. The SelA-like paralogs inside the bacterial clade (STM3768, STM4446,
  BC_4845, RB1352) are unreviewed TrEMBL leaves without characterized activity; they
  are flagged in the node assessment rather than listed as member exceptions, since
  no evidence establishes that they lack SelA activity.
