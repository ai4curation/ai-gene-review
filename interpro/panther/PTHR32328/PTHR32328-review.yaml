  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: UniProtKB:P0A821
  assessment: TOO_DEEP
  assessment_reason: >-
    Seeded only by E. coli SelA, but placed at the tree root, which joins the
    archaeal UPF0425 protein MJ0158 (Methanocaldococcus jannaschii) to the bacterial
    clade. Archaea make Sec-tRNA(Sec) by the PSTK-SepSecS route, and M. jannaschii's
    SepSecS (Q58027) sits in PTHR12944, so MJ0158 should not inherit SelA activity.
    The bacterial child node PTN000795145 would be the defensible placement. Even
    there, the clade includes SelA-like paralogs (Salmonella STM3768 and STM4446
    beside the canonical Salmonella selA leaf Q8ZL69, Bacillus cereus BC_4845 and
    Rhodopirellula RB1352) whose activity is unknown, so those leaves need
    individual review rather than inheritance.
  supported_by:
  - reference_id: file:interpro/panther/PTHR32328/PTHR32328-paint.tsv
    supporting_text: "PTHR32328\tPTN001284456\tGO:0004125\tF\tIBD\tfalse\tUniProtKB:P0A821"
  - reference_id: file:interpro/panther/PTHR32328/PTHR32328-tree-check.txt
    supporting_text: 'leaf of PTN001284456: PTN001284457 UniProtKB:Q57622 MJ0158 Methanocaldococcus jannaschii PTHR32328:SF0'
  - reference_id: file:interpro/panther/PTHR32328/PTHR32328-entries.csv
    supporting_text: Q57622,UPF0425 pyridoxal phosphate-dependent protein MJ0158
  - reference_id: PMID:17142313
    supporting_text: >-
      we provide evidence for a different route present in these domains of life that
      requires the tRNA(Sec)-dependent conversion of O-phosphoserine (Sep) to Sec
