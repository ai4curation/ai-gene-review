family_id: PANTHER:PTHR32328
family_name: L-SERYL-TRNA(SEC) SELENIUM TRANSFERASE
preferred_name: SelA selenocysteine synthases and SelA-like PLP enzymes
summary: >-
  Pyridoxal-phosphate-dependent enzymes of the SelA fold. Most members are bacterial
  L-seryl-tRNA(Sec) selenium transferases (SelA, selenocysteine synthase, EC
  2.9.1.1), which convert Ser-tRNA(Sec) and selenophosphate directly into
  Sec-tRNA(Sec): 127 of 135 Swiss-Prot members carry that name. The family also
  holds SelA-like proteins with other or unknown activities: the archaeal UPF0425
  PLP proteins of methanogens (MJ0158, MTH_1914, MMP0002, MK0620, Msp_0916),
  Salmonella D-glucosaminate-6-phosphate ammonia lyase DgaE, the Streptomyces
  capuramycin-pathway enzyme Cap15 (5'-C-glycyluridine monooxygenase-decarboxylase)
  and uncharacterized Mesorhizobium mlr3804. PANTHER places every member in the
  single subfamily SF0, and the 17-leaf tree includes archaeal MJ0158 and several
  bacterial SelA paralogs beside the canonical SelA orthologs.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The bulk of the family is SelA, with E. coli SelA as the biochemically
  characterized selenocysteine synthase. The exceptions are identified paralogs that
  PANTHER does not separate into subfamilies: archaeal UPF0425 proteins from a domain
  that makes Sec-tRNA(Sec) through PSTK and SepSecS instead, and bacterial and
  streptomycete enzymes named for unrelated PLP reactions.
