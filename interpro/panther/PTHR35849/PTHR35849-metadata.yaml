  name:
    name: MlaB ABC Transporter Complex Protein
    short: MlaB_ABC_Transporter
  description:
  - text: This family of proteins is involved in an ABC transporter complex known
      as MlaFEDB, which plays a crucial role in maintaining lipid asymmetry in the
      outer membrane of certain bacteria. These proteins are responsible for the retrograde
      trafficking of phospholipids from the outer membrane back to the inner membrane,
      a process essential for the proper function and integrity of the bacterial cell
      envelope. Members of this family, specifically the MlaB proteins, are key to
      both the assembly and the operational activity of the MlaFEDB complex. They
      may influence the structure and stability of MlaF, thereby modulating the transporter's
      function.
