family_id: PANTHER:PTHR35849
family_name: BLR2341 PROTEIN
preferred_name: MlaB STAS-domain accessory subunit of the MlaFEDB transporter, plus
  uncharacterized MlaB-like STAS proteins
summary: >-
  Small (about 100-residue) cytoplasmic STAS-domain proteins (Pfam STAS_2, PF13466). The
  characterized subfamily, SF1, is MlaB: the cytoplasmic accessory subunit of the MlaFEDB
  ABC transporter of the Mla intermembrane phospholipid transport system. In E. coli MlaB
  (P64602) binds the nucleotide-binding domain MlaF, is needed for MlaF stability and for
  assembly of the MlaFEDB complex, and is required for transporter ATPase activity (the
  T52A substitution leaves the MlaFEB assembly intact but abolishes ATPase activity); its
  loss gives the same outer-leaflet phospholipid accumulation and SDS-EDTA sensitivity as
  other mla mutants. MlaB does not itself bind or move phospholipid; the lipid pathway runs
  through MlaE and the MlaD hexamer. SF1 is almost entirely gammaproteobacterial
  (Enterobacterales, Pasteurellales, Vibrio, Xanthomonas) with some Betaproteobacteria.
  SF2 ("BLR2341 PROTEIN", after Bradyrhizobium diazoefficiens blr2341) is the larger and
  far more diverse subfamily: STAS proteins across Gamma-, Beta- and Alphaproteobacteria,
  Leptospira, Thermodesulfobacteriota, and also monoderm Actinomycetota and Bacillota,
  mostly named "STAS domain-containing protein" or "anti-sigma factor antagonist" by
  automatic pipelines; a few are named as Mla MlaB components, but none has been studied.
  InterPro counts 6988 proteins (integrated entry IPR052746); UniProt maps about 3400 of
  them to a subfamily. The fetched entries.csv holds the 3 reviewed members, all SF1.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family joins a characterized Mla accessory subunit (SF1) with a larger set of
  uncharacterized STAS proteins (SF2) that includes members in monoderm phyla
  (Actinomycetota, Bacillota) that have no outer membrane and therefore cannot take part
  in intermembrane phospholipid transfer. Whether any SF2 proteins act in Mla-like
  systems, in anti-sigma-factor-antagonist partner-switching, or in something else is
  unknown. Because STAS domains are a generic small-protein interaction fold, sequence
  membership alone does not carry the MlaB function across the family. All four PAINT
  terms sit on one gammaproteobacterial node inside SF1, so no term currently reaches SF2.
