- subfamily_id: PANTHER:PTHR35849:SF2
  label: BLR2341 PROTEIN
  description: Diverse, uncharacterized STAS-domain proteins (about 1950 UniProt members; median length
    about 105 residues) spread across Proteobacteria, Leptospira, Thermodesulfobacteriota, Actinomycetota,
    Bacillota and other phyla. Automatic names range from "STAS domain-containing protein" and "anti-sigma
    factor antagonist" to "ABC-type transporter Mla MlaB component"; none is backed by experiment.
  representative_members:
  - id: UniProtKB:Q89SQ9
    label: Blr2341 protein
    gene_symbol: blr2341
    organism: Bradyrhizobium diazoefficiens (strain JCM 10833 / BCRC 13528 / IAM 13628 / NBRC 14792 /
      USDA 110)
  diverged_from_family: true
  divergence_description: Not shown to be MlaB. The subfamily includes members from monoderm bacteria
    (Actinomycetota, Bacillota) that lack an outer membrane and the Mla system, so the MlaB process and
    complex terms cannot be assumed for it as a whole. Some proteobacterial SF2 members may be MlaB-like
    accessory subunits of Mla or other ABC systems, but that has to be shown by genomic context or experiment
    per lineage, not inherited from SF1.
