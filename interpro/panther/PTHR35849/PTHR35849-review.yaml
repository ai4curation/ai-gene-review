  - id: UniProtKB:P64602
    label: Intermembrane phospholipid transport system binding protein MlaB
    organism: Escherichia coli (strain K12)
  assessment: UNRESOLVED
  assessment_reason: 'The node placement is sound: MlaB is a stoichiometric subunit of MlaFEDB (two copies
    per complex in E. coli, IPI in GOA), and the node is a gammaproteobacterial clade inside SF1 (TreeGrafter
    AN8) whose members are encoded in the mla operon. The term choice is the problem. GO defines GO:1990531
    as "a protein complex that functions as a phospholipid-translocating P-Type ATPase" (a P4-ATPase flippase
    complex), whereas MlaFEDB is an ATP-binding cassette transporter; the E. coli MlaB, MlaD, MlaE and
    MlaF gene reviews all replace this term with GO:0043190 ATP-binding cassette (ABC) transporter complex.
    The membership claim should be kept at this node with the corrected term rather than pruned.'
  supported_by:
  - reference_id: PMID:27529189
    supporting_text: We establish that the transporter comprises canonical components, MlaF and MlaE,
      and auxiliary proteins, MlaD and MlaB, of previously unknown functions.
