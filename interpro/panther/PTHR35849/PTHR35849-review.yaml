family_id: PANTHER:PTHR35849
family_name: BLR2341 PROTEIN
preferred_name: MlaB STAS-domain accessory subunit of the MlaFEDB transporter, plus uncharacterized MlaB-like
  STAS proteins
summary: Small STAS-domain proteins include MlaB, an assembly and regulatory component of characterized
  bacterial Mla transporters, and a broader unresolved group. E. coli MlaB binds and stabilizes MlaF and
  supports transporter assembly and ATPase behavior; this provides a positive contribution to the lipid-transfer
  system without making MlaB a lipid-binding carrier. Overexpressed MlaF can compensate MlaB deletion
  under tested E. coli conditions. Bordetella has a characterized five-gene Mla locus without an identifiable
  MlaB, so neither universal B dependence nor universal dispensability follows. Pseudomonas Ttg2E now
  has an official SF1 classification, while its function is still a target-scoped ortholog inference.
functional_coherence: HETEROGENEOUS
coherence_reason: The reference tree separates seven SF1 MlaB leaves from nine SF2 leaves of unresolved
  physiology. Current UniProt now classifies Q88P90 in SF1, unlike the immutable older target flatfile.
  STAS architecture does not by itself establish Mla participation for every member or exclude it outside
  the characterized branch.
