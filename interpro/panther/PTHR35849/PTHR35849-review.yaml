term_assessments:
- assessed_term:
    id: GO:0120010
    label: intermembrane phospholipid transfer
  scope: UNRESOLVED
  scope_reason: E. coli MlaB supplies real assembly/ATPase support to the Mla process; the contribution
    is not inferred merely from being necessary or from complex membership alone. Canonical SF1 positives
    and current Q88P90 classification support target-scoped inference. Uncharacterized SF2 physiology
    and cross-lineage B-independent architectures prevent a universal or exclusionary subfamily grant;
    neither proves absence of Mla-related function in every SF2 member.
  supported_by:
  - reference_id: PMID:36518166
    supporting_text: we were not able to identify an MlaB homologue in B. pertussis
  - reference_id: PMID:32602838
    supporting_text: can be rescued by overexpression of either WT MlaB or MlaF
- assessed_term:
    id: GO:1990531
    label: phospholipid-translocating ATPase complex
  scope: NOT_APPLICABLE
  scope_reason: GO:1990531 names a P-type ATPase flippase complex, which MlaFEDB is not. MlaB (SF1) is
    a subunit of the MlaFEDB ABC transporter, for which GO:0043190 ATP-binding cassette (ABC) transporter
    complex is the accurate term; complex membership is not established for SF2.
  supported_by:
  - reference_id: PMID:27529189
    supporting_text: We establish that the transporter comprises canonical components, MlaF and MlaE,
      and auxiliary proteins, MlaD and MlaB, of previously unknown functions.
- assessed_term:
    id: GO:0006974
    label: DNA damage response
  scope: UNRESOLVED
  scope_reason: The full E. coli PMID20128927 study measures genotoxic survival with wild-type bacteriostatic
    susceptibility controls and complementation. This is real evidence, but whether MlaB executes a damage-response
    step or supplies constitutive envelope protection is unresolved. The broad GO definition is not limited
    to direct DNA repair, and neither protein localization nor lack of a DNA-binding domain disproves
    it. Do not propagate a universal positive or negative across the STAS family.
  supported_by:
  - reference_id: PMID:20128927
    supporting_text: These data indicate that the yrbB mutation does not change the permeablility to most
      compounds, which is consistent with our finding that the yrbB mutation did not change the bacteriostatic
      effects of nalidixic acid.
- assessed_term:
    id: GO:0120014
    label: phospholipid transfer activity
  scope: UNRESOLVED
  scope_reason: MlaB binds/stabilizes MlaF and supports assembly and ATPase behavior, providing a positive
    complex-level contribution. It is not known to execute the complete GO0120014 sequence of lipid removal,
    aqueous shielding and delivery as a carrier. This distinction rests on measured physical roles and
    the term definition, not the inert enables qualifier or a requirement for an isolated-subunit assay.
    Universal full transfer activity across the mixed STAS family is unresolved.
