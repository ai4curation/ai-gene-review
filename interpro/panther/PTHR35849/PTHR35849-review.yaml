    label: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM BINDING PROTEIN MLAB
    description: >-
      MlaB proper, encoded in the mlaFEDCB operon of Gammaproteobacteria (and some
      Betaproteobacteria). Cytoplasmic STAS subunit that binds MlaF and is required for
      assembly and ATPase activity of MlaFEDB.
    representative_members:
      - id: UniProtKB:P64602
        label: Intermembrane phospholipid transport system binding protein MlaB
        gene_symbol: mlaB
        organism: Escherichia coli (strain K12)
        gene_review: genes/ECOLI/mlaB/mlaB-ai-review.yaml
      - id: UniProtKB:P64603
        label: Intermembrane phospholipid transport system binding protein MlaB
        gene_symbol: mlaB
        organism: Shigella flexneri
      - id: UniProtKB:Q57407
        label: Intermembrane phospholipid transport system binding protein MlaB
        gene_symbol: mlaB
        organism: Haemophilus influenzae (strain ATCC 51907 / DSM 11121 / KW20 / Rd)
    supported_by:
      - reference_id: PMID:27529189
        supporting_text: "In addition, MlaB plays critical roles in both the assembly and activity of the transporter."
      - reference_id: PMID:32602838
        supporting_text: "MlaB, a STAS domain protein, binds the ABC nucleotide binding domain, MlaF, and is required for its stability."
  - subfamily_id: PANTHER:PTHR35849:SF2
    label: BLR2341 PROTEIN
    description: >-
      Diverse, uncharacterized STAS-domain proteins (about 1950 UniProt members; median
      length about 105 residues) spread across Proteobacteria, Leptospira,
      Thermodesulfobacteriota, Actinomycetota, Bacillota and other phyla. Automatic names
      range from "STAS domain-containing protein" and "anti-sigma factor antagonist" to
      "ABC-type transporter Mla MlaB component"; none is backed by experiment.
    representative_members:
      - id: UniProtKB:Q89SQ9
        label: Blr2341 protein
        gene_symbol: blr2341
        organism: Bradyrhizobium diazoefficiens (strain JCM 10833 / BCRC 13528 / IAM 13628 / NBRC 14792 / USDA 110)
    diverged_from_family: true
    divergence_description: >-
      Not shown to be MlaB. The subfamily includes members from monoderm bacteria
      (Actinomycetota, Bacillota) that lack an outer membrane and the Mla system, so the
      MlaB process and complex terms cannot be assumed for it as a whole. Some
      proteobacterial SF2 members may be MlaB-like accessory subunits of Mla or other
      ABC systems, but that has to be shown by genomic context or experiment per lineage,
      not inherited from SF1.

node_assessments:
  - node_id: PANTHER:PTN002185077
    asserted_term:
      id: GO:1990531
      label: phospholipid-translocating ATPase complex
    evidence: IBD
    node_taxon:
      id: NCBITaxon:1236
      label: Gammaproteobacteria
    paint_snapshot: "20241031"
    seeds:
      - id: UniProtKB:P64602
        label: Intermembrane phospholipid transport system binding protein MlaB
        organism: Escherichia coli (strain K12)
    assessment: UNRESOLVED
    assessment_reason: >-
      The node placement is sound: MlaB is a stoichiometric subunit of MlaFEDB (two copies
      per complex in E. coli, IPI in GOA), and the node is a gammaproteobacterial clade
      inside SF1 (TreeGrafter AN8) whose members are encoded in the mla operon. The term
      choice is the problem. GO defines GO:1990531 as "a protein complex that functions as
      a phospholipid-translocating P-Type ATPase" (a P4-ATPase flippase complex), whereas
      MlaFEDB is an ATP-binding cassette transporter; the E. coli MlaB, MlaD, MlaE and MlaF
      gene reviews all replace this term with GO:0043190 ATP-binding cassette (ABC)
      transporter complex. The membership claim should be kept at this node with the
      corrected term rather than pruned.
    supported_by:
      - reference_id: PMID:27529189
        supporting_text: "We establish that the transporter comprises canonical components, MlaF and MlaE, and auxiliary proteins, MlaD and MlaB, of previously unknown functions."
  - node_id: PANTHER:PTN002185077
    asserted_term:
      id: GO:0120014
      label: phospholipid transfer activity
    evidence: IBD
    node_taxon:
      id: NCBITaxon:1236
      label: Gammaproteobacteria
    paint_snapshot: "20241031"
    seeds:
      - id: UniProtKB:P64602
        label: Intermembrane phospholipid transport system binding protein MlaB
        organism: Escherichia coli (strain K12)
    assessment: UNRESOLVED
    assessment_reason: >-
      The node placement is fine for anything true of MlaB, but the claim itself is a
      complex activity attributed to a non-catalytic accessory subunit. The seed is an IDA
      from a proteoliposome transport assay of the whole MlaFEDB complex (PMID:33199922);
      MlaB is a cytoplasmic STAS protein that binds MlaF and has no lipid-binding site,
      while the phospholipid path runs through MlaE and the MlaD channel. At most MlaB
      contributes_to this activity, and an enables-qualified IBA overstates its role. Not
      called WRONG_NODE because the problem is the qualifier, which node assessment cannot
      express, rather than where in the tree the term sits; MlaB's complex membership is
      the accurate claim, expressed with GO:0043190 rather than GO:1990531 (see above).
    supported_by:
      - reference_id: PMID:32602838
        supporting_text: "MlaB, a STAS domain protein, binds the ABC nucleotide binding domain, MlaF, and is required for its stability."
      - reference_id: PMID:33236984
        supporting_text: "A continuous transport pathway extends from the MlaE substrate-binding site, through the channel of MlaD, and into the periplasm."
  - node_id: PANTHER:PTN002185077
    asserted_term:
      id: GO:0006974
      label: DNA damage response
    evidence: IBD
    node_taxon:
      id: NCBITaxon:1236
      label: Gammaproteobacteria
    paint_snapshot: "20241031"
    seeds:
      - id: UniProtKB:P64602
        label: Intermembrane phospholipid transport system binding protein MlaB
        organism: Escherichia coli (strain K12)
    assessment: WRONG_NODE
    assessment_reason: >-
      The seed does not support an inherited function at this or any node. The only
      experimental basis is an acts_upstream_of_or_within IMP from a transposon screen in
      which a yrbB (mlaB) insertion made E. coli more readily killed by the quinolone
      nalidixic acid (PMID:20128927). Increased lethality of a DNA-gyrase poison in an
      envelope-defective mutant is an indirect, pleiotropic phenotype of outer-membrane
      lipid asymmetry loss, not evidence that MlaB participates in sensing or repairing
      DNA damage; the authors themselves group yrbB with outer-membrane-related genes. No
      other member has any DNA-damage data. Every SF1 member below the node currently
      inherits the term and should not.
    affected_subfamilies:
      - id: PANTHER:PTHR35849:SF1
        label: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM BINDING PROTEIN MLAB
    supported_by:
      - reference_id: PMID:20128927
        supporting_text: "Mutants of E. coli, obtained by Tn5-mediated insertional mutagenesis, were screened for those that had the same bacteriostatic susceptibility to nalidixic acid as the wild-type strain while exhibiting greater sensitivity to the lethal action of the drug."
      - reference_id: PMID:20128927
        supporting_text: "These data indicate that the yrbB mutation does not change the permeablility to most compounds, which is consistent with our finding that the yrbB mutation did not change the bacteriostatic effects of nalidixic acid."
  - node_id: PANTHER:PTN002185077
    asserted_term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    evidence: IBD
    node_taxon:
      id: NCBITaxon:1236
      label: Gammaproteobacteria
    paint_snapshot: "20241031"
    seeds:
      - id: UniProtKB:P64602
        label: Intermembrane phospholipid transport system binding protein MlaB
        organism: Escherichia coli (strain K12)
    assessment: SOUND
    assessment_reason: >-
      MlaB is required for assembly and ATPase activity of the transporter that drives
      the Mla route, and mlaB mutants share the outer-leaflet phospholipid accumulation
      phenotype of the other mla genes, so it does part of the work of the process as a
      structural/regulatory subunit. The gammaproteobacterial SF1 node is appropriate;
      the term must not be extended into SF2 (see subfamily divergence).
    supported_by:
      - reference_id: PMID:27529189
        supporting_text: "In addition, MlaB plays critical roles in both the assembly and activity of the transporter."
      - reference_id: PMID:19383799
        supporting_text: "We propose that the Mla pathway constitutes a bacterial intermembrane PL trafficking system."

term_assessments:
  - assessed_term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      True of MlaB (SF1). Not safe for SF2, which includes monoderm members without an
      outer membrane and has no experimental data.
    applicable_subfamilies:
      - id: PANTHER:PTHR35849:SF1
        label: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM BINDING PROTEIN MLAB
  - assessed_term:
      id: GO:1990531
      label: phospholipid-translocating ATPase complex
    scope: NOT_APPLICABLE
    scope_reason: >-
      GO:1990531 names a P-type ATPase flippase complex, which MlaFEDB is not. MlaB (SF1) is
      a subunit of the MlaFEDB ABC transporter, for which GO:0043190 ATP-binding cassette
      (ABC) transporter complex is the accurate term; complex membership is not established
      for SF2.
    supported_by:
      - reference_id: PMID:27529189
        supporting_text: "We establish that the transporter comprises canonical components, MlaF and MlaE, and auxiliary proteins, MlaD and MlaB, of previously unknown functions."
  - assessed_term:
      id: GO:0006974
      label: DNA damage response
    scope: NOT_APPLICABLE
    scope_reason: >-
      Rests on a single quinolone-lethality phenotype that follows indirectly from the
      envelope defect; no member participates in a DNA damage response.
    supported_by:
      - reference_id: PMID:20128927
        supporting_text: "These data indicate that the yrbB mutation does not change the permeablility to most compounds, which is consistent with our finding that the yrbB mutation did not change the bacteriostatic effects of nalidixic acid."
  - assessed_term:
      id: GO:0120014
      label: phospholipid transfer activity
    scope: UNRESOLVED
    scope_reason: >-
      A property of the MlaFEDB complex that MlaB can only contribute to, not enable.
      Acceptable for SF1 as contributes_to; an enables-qualified transfer overstates the
      role of a cytoplasmic STAS subunit that has no lipid-binding site.

