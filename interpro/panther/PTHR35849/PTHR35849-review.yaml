notes: 2026-11-07 current official Q88P90 record assigns PTHR35849:SF1; the older immutable target flatfile
  has no PANTHER DR line. Both are recorded in the consultation with dates/hashes, without refreshing
  source caches. ECOLI and PSEPK representatives therefore have current SF1 support, but STAS membership
  is not an activity license. The original DNA-damage negative node/term judgments are archived exactly
  and explicitly superseded by uncertainty after full-source reassessment; the P-type-complex exclusion
  is preserved. No claim is made that Bordetella lacks every possible functional substitute for MlaB.
