notes: >-
  Written to support modules/bacterial_mla_intermembrane_phospholipid_transport.yaml.
  Node id, terms, seed, taxon and date are verbatim from PTHR35849-paint.tsv. Node
  position was read from the cached PAINT_TreeGrafter_Annotations_TOTAL file (9 SF1 nodes
  all carrying the four terms, PTN002185077 = AN8; 15 SF2 nodes with no annotation), and
  IBA recipients (E. coli, Yersinia, Salmonella, Haemophilus, Vibrio, Shewanella,
  Xanthomonas MlaB) from the cached PAINT UniProt GAF. Subfamily sizes, phyla and lengths
  come from a UniProt REST query of xref:panther-PTHR35849 run on 2026-10-23 (3397
  entries). Important for the module: the P. putida KT2440 exemplar Ttg2E (Q88P90,
  PP_0962) carries no PANTHER cross-reference in its UniProt record (checked in the cached
  genes/PSEPK/ttg2E/ttg2E-uniprot.txt and live UniProt on 2026-10-23); it has only the
  STAS InterPro/Pfam signatures, and Pseudomonas MlaB orthologs are largely unclassified or
  scattered between SF1 and SF2. Q88P90 is therefore not listed as a representative here,
  and a module family selector of PTHR35849:SF1 with Q88P90 as representative member
  would not pass the representative-member check; the module's current MlaB selector
  without a PANTHER id is the safer choice. GO:0006974 is the one row to retract: the
  E. coli mlaB gene review should not accept the DNA damage response IBA.
