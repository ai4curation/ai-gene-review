residue_sites:
  - site_id: ser_lys_catalytic_dyad
    label: Serine nucleophile and lysine general base
    description: >-
      Type I signal peptidases use a Ser-Lys dyad: the serine attacks the
      scissile bond and the lysine acts as the general base. Positions are E.
      coli LepB numbering (UniProt active-site features); the equivalent
      residues of B. subtilis SipS are Ser43 and Lys83. Staphylococcus aureus
      SpsA, a family member annotated by UniProt as catalytically inactive,
      has Asp35 at the nucleophile position (aligned through the conserved
      D-S-M-x-P-T-L / N-D-M-S-P-T-L motif) and Ser75 at the lysine position.
    anchor:
      id: UniProtKB:P00803
      label: lepB
      organism: Escherichia coli K-12
    anchor_sequence_version: 2
    site_source: UNIPROT_FEATURE
    residues:
      - position: 91
        expected: [S]
        role: nucleophile
      - position: 146
        expected: [K]
        role: general base
    required_for:
      - term:
          id: GO:0009003
          label: signal peptidase activity
        strength: REQUIRED
        rationale: >-
          Cleavage requires the serine nucleophile and the lysine that
          activates it; a member lacking either is not expected to cleave
          signal peptides.
    positive_controls:
      - id: UniProtKB:P00803
        label: lepB
        organism: Escherichia coli K-12
        control_position: 91
        control_residue: S
      - id: UniProtKB:P28628
        label: sipS
        organism: Bacillus subtilis 168
        control_position: 43
        control_residue: S
    negative_controls:
      - id: UniProtKB:P0A066
        label: spsA
        organism: Staphylococcus aureus
        control_position: 35
        control_residue: D
