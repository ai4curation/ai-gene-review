family_id: PANTHER:PTHR43390
family_name: SIGNAL PEPTIDASE I
functional_coherence: MOSTLY_COHERENT
preferred_name: Bacterial and organellar type I signal peptidase (peptidase S26A) family
summary: >-
  PTHR43390 contains type I signal peptidases of the S26A serine-peptidase
  family: bacterial LepB-type enzymes and the plastid thylakoidal and envelope
  processing peptidases derived from them. These membrane-anchored enzymes
  cleave the N-terminal signal peptide from translocated precursors on the
  trans side of the membrane, using a serine-lysine catalytic dyad instead of
  the usual serine-histidine-aspartate triad, and prefer small uncharged
  residues at positions -1 and -3 of the cleavage site. E. coli has one
  essential enzyme, LepB; Bacillus subtilis has several paralogs of which SipS
  and SipT are the major ones, and cells lacking both are not viable. The
  ER-type SipW of B. subtilis is not in this family. The family also contains
  catalytically inactive homologs such as Staphylococcus aureus SpsA, which
  lack the catalytic serine and lysine, so signal peptidase activity is
  residue-determined rather than family-wide.
coherence_reason: >-
  The signal-peptidase activity and Ser-Lys dyad are conserved among the
  bacterial members. Plastid paralogs act at thylakoid or envelope membranes,
  so location terms are clade-specific, and some PANTHER-named "peptidase S26
  domain-containing" subfamilies have no cached reviewed members and were not
  assessed. Bacterial members, including E. coli LepB and the B. subtilis
  Sip enzymes, sit in SF1 although its PANTHER name is CHLOROPLAST PROCESSING
  PEPTIDASE; the label is not evidence of plastid location.
