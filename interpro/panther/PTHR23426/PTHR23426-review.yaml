family_id: PANTHER:PTHR23426
family_name: FERREDOXIN/ADRENODOXIN
preferred_name: Adrenodoxin-type [2Fe-2S] ferredoxin family
summary: >-
  Small [2Fe-2S] ferredoxins that relay electrons from NADPH via ferredoxin reductase. Mitochondrial
  FDX2-type ferredoxins (S. cerevisiae YAH1, bacterial Fdx) serve Fe-S cluster and heme a synthesis
  and COQ6 in ubiquinone synthesis. Adrenodoxin (FDX1) supports steroidogenic P450s.
functional_coherence: COHERENT
coherence_reason: All members are [2Fe-2S] electron carriers; their partner enzymes differ by subfamily.
