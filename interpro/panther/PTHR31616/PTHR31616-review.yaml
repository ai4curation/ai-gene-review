family_id: PANTHER:PTHR31616
family_name: TREHALASE
preferred_name: GH15 glucoamylase / trehalase family
summary: >-
  Glycoside hydrolase family 15 (alpha/alpha)6-barrel enzymes. Glucoamylases release glucose from
  the non-reducing ends of alpha-1,4-glucans, among them the intracellular sporulation-specific glucoamylase
  S. cerevisiae SGA1, which degrades glycogen in the vacuole during sporulation, and secreted fungal
  glucoamylases. The family also contains bacterial GH15 trehalases.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Glucoamylase activity holds for SF9, SF12 and SF0; the GH15 trehalases (SF10) hydrolyse trehalose.
