    name: Cell Adhesion and Cytoskeletal Organization
    short: Cell_Adh-Cytoskel_Orgn
  description:
  - text: The protein family is involved in various cellular processes including cell
      adhesion, migration, cytoskeletal organization, and neural development. Members
      function in actin dynamics, serving as scaffolding molecules that influence
      actin polymerization and the assembly of actin filaments. They play roles in
      establishing cell morphology, motility, and interactions with the extracellular
      matrix. Some members are integral components of basement membranes, contributing
      to barrier selectivity and vascularization. Others mediate cellular responses
      to guidance cues in neuronal development and are involved in the Wnt signaling
      pathway. The family includes proteins that regulate synapse formation and maintenance,
      as well as those that participate in the architecture of epithelial cell junctions
      and myocardial remodeling.
