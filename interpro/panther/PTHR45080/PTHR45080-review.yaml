family_id: PANTHER:PTHR45080
family_name: CONTACTIN 5
summary: The cached sequence-classification family contains proteins with distinct cell-surface, extracellular
  and signaling roles. Human PTK7 preserves an intracellular kinase fold with an occluded ATP pocket and
  organizes partner-mediated signaling at cell contacts; these functions are not a universal property
  of the group.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The frozen inventory places PTK7 alongside hemicentins, MDGA proteins and other branches,
  supporting a heterogeneous represented cohort. The official human Q13308 row independently
  corroborates PTHR45080:SF21 and supplies an in-family anchor for the experimentally supported
  noncatalytic signaling mechanism. This does not verify every cached comparator’s current
  placement. Rat parent placement remains unresolved; its seven-Ig receptor architecture and
  conserved pseudokinase pocket make an active MATK-like functional interpretation implausible
  without establishing a replacement family.
