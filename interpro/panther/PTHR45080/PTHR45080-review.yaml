family_id: PANTHER:PTHR45080
family_name: CONTACTIN 5
summary: The cached sequence-classification family contains proteins with distinct cell-surface, extracellular
  and signaling roles. Human PTK7 preserves an intracellular kinase fold with an occluded ATP pocket and
  organizes partner-mediated signaling at cell contacts; these functions are not a universal property
  of the group.
functional_coherence: HETEROGENEOUS
coherence_reason: The cached family inventory includes human PTK7 Q13308 alongside hemicentins, MDGA proteins
  and other branches. Human PTK7 supplies independent noncatalytic signaling evidence, but the disputed
  parent-family placement of the rat target is not used to delimit this family. A shared classification
  label does not establish calcium dependence, a specific ligand, or conservation of fly photoreceptor
  targeting.
subfamilies: []
