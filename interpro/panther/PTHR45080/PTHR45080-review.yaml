    label: protein kinase activity
  scope: UNRESOLVED
  scope_reason: Human PTK7 Q13308, present in the cached family inventory, has an occluded ATP site and
    noncanonical ALG motif. The rat sequence retains these structural landmarks, so its pseudokinase evidence
    is preserved despite unresolved parent classification. The rat target is not treated as a verified
    family member or as an active kinase because of the alternate classification label. Complete family
    catalytic coverage remains unresolved.
