notes: |-
  Exact rat target A0A8I6ALM9 is mapped to human PTK7 Q13308 with reproducible sequence alignment. The ProtNLM function donor Q6AWJ9 is fly Off-track, a homolog; the fly R1–R6/lamina assertion is a lineage-specific overtransfer, not evidence of an unrelated donor. Positive kinase transfers must be distinguished from the correct GOA NOT kinase and NOT ATP-binding annotations. No unverified PAINT node placement or family-wide residue requirement is asserted.

  PANTHER classification conflict assessment (2026-10-01). Unresolved parent-family classification for UniProtKB:A0A8I6ALM9: the frozen UniProt record records PTHR45080:SF21 (INACTIVE TYROSINE-PROTEIN KINASE 7), whereas the authenticated official PANTHER 19.0 rat sequence-classification row 10310 records PTHR24418:SF399 (MEGAKARYOCYTE-ASSOCIATED TYROSINE-PROTEIN KINASE). The latter is also the tested upstream membership index assignment. This target is retained below as unresolved comparative evidence, not an asserted member of either parent family. No replacement family or ancestral placement is inferred.

  Withdraw rat A0A8I6ALM9 membership while retaining all sequence-residue and pseudokinase evidence. Independent human PTK7 and other cached members support HETEROGENEOUS; both activity scopes stay UNRESOLVED. No active kinase or MATK function is inferred from the alternate label.

  Provenance: diagnostic run 36943928592, attempt 1, source head 86ffe004ffe04b167981c081a14c1c526fb24da2; compact artifact 11201891369 (SHA256 9861e63fc8279e570e57ad56d639c36edafeac62809ee9867681a27175707136). The official inputs declare PTHR19.0 and HTTP Last-Modified 2024-06-20; panther.obo and the parser also declare 19.0. The UniProt and PAINT snapshots are later observations but do not establish a different PANTHER release. Full raw-source digests are runner-recorded, not independently recomputed from this compact artifact. No PAINT node or alternate functional assignment is inferred. This review is IN_PROGRESS until the conflicting placement is resolved.

  Preserved previous placement and biological interpretation (historical evidence; membership assertions below are not current claims):
  summary: This sequence-classification family includes the PTK7 receptor pseudokinase branch. PTK7 preserves
    an intracellular kinase fold but has a structurally occluded ATP pocket; it organizes partner-mediated
    signaling at cell contacts. Related fly Off-track developmental functions cannot be projected wholesale
    into vertebrate anatomy.
  coherence_reason: The official CONTACTIN 5 family label is broader than the PTK7 branch and does not imply
    a shared kinase or adhesion mechanism. PTK7 is experimentally distinguished from active kinases by ATP-site
    occlusion and from generic cell-adhesion proteins by its noncatalytic intracellular signaling role.
    Family membership does not establish calcium dependence, a specific ligand, or conservation of fly photoreceptor
    targeting.
  original_subfamily:
    subfamily_id: PANTHER:PTHR45080:SF21
    label: INACTIVE TYROSINE-PROTEIN KINASE 7
    description: The rat benchmark product retains the seven-Ig-domain receptor architecture and the PTK7
      pseudokinase pocket. Human structural landmarks L828, Y877 and ALG948–950 map to identical rat L837,
      Y886 and ALG957–959. The differing N-terminus is a trafficking caveat, not restoration of a kinase
      mechanism.
    representative_members:
    - id: UniProtKB:A0A8I6ALM9
      gene_symbol: Ptk7
      organism: Rattus norvegicus
      gene_review: genes/rat/Ptk7/Ptk7-ai-review.yaml
  term_assessment_reasons:
  - term:
      id: GO:0004672
      label: protein kinase activity
    scope: UNRESOLVED
    scope_reason: 'Protein kinase activity is refuted for the PTK7 representative: the orthologous human
      structure has an occluded ATP site and noncanonical ALG motif, all retained in rat. This rules out
      a family-wide catalytic grant. It does not establish that every other branch of this broad classification
      family is catalytically inactive, so a family-wide NOT_APPLICABLE claim is not made.'
  - term:
      id: GO:0060090
      label: molecular adaptor activity
    scope: UNRESOLVED
    scope_reason: Mammalian PTK7 organizes Src signaling at cell contacts and provides a supported noncatalytic
      signaling example. These experiments do not enumerate all adaptor-capable members of this heterogeneous
      family or justify assigning the same partners to contactins and other branches.


