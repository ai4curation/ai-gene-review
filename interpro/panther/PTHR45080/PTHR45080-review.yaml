notes: Exact rat target A0A8I6ALM9 is mapped to human PTK7 Q13308 with reproducible sequence alignment.
  The ProtNLM function donor Q6AWJ9 is fly Off-track, a homolog; the fly R1–R6/lamina assertion is a lineage-specific
  overtransfer, not evidence of an unrelated donor. Positive kinase transfers must be distinguished from
  the correct GOA NOT kinase and NOT ATP-binding annotations. No unverified PAINT node placement or family-wide
  residue requirement is asserted.
