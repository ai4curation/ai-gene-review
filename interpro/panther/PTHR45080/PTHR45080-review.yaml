family_id: PANTHER:PTHR45080
family_name: CONTACTIN 5
summary: This sequence-classification family includes the PTK7 receptor pseudokinase branch. PTK7 preserves
  an intracellular kinase fold but has a structurally occluded ATP pocket; it organizes partner-mediated
  signaling at cell contacts. Related fly Off-track developmental functions cannot be projected wholesale
  into vertebrate anatomy.
functional_coherence: HETEROGENEOUS
coherence_reason: The official CONTACTIN 5 family label is broader than the PTK7 branch and does not imply
  a shared kinase or adhesion mechanism. PTK7 is experimentally distinguished from active kinases by ATP-site
  occlusion and from generic cell-adhesion proteins by its noncatalytic intracellular signaling role.
  Family membership does not establish calcium dependence, a specific ligand, or conservation of fly photoreceptor
  targeting.
subfamilies:
- subfamily_id: PANTHER:PTHR45080:SF21
  label: INACTIVE TYROSINE-PROTEIN KINASE 7
  description: The rat benchmark product retains the seven-Ig-domain receptor architecture and the PTK7
    pseudokinase pocket. Human structural landmarks L828, Y877 and ALG948–950 map to identical rat L837,
    Y886 and ALG957–959. The differing N-terminus is a trafficking caveat, not restoration of a kinase
    mechanism.
  representative_members:
  - id: UniProtKB:A0A8I6ALM9
    gene_symbol: Ptk7
    organism: Rattus norvegicus
    gene_review: genes/rat/Ptk7/Ptk7-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0004672
    label: protein kinase activity
  scope: UNRESOLVED
  scope_reason: 'Protein kinase activity is refuted for the PTK7 representative: the orthologous human
    structure has an occluded ATP site and noncanonical ALG motif, all retained in rat. This rules out
    a family-wide catalytic grant. It does not establish that every other branch of this broad classification
    family is catalytically inactive, so a family-wide NOT_APPLICABLE claim is not made.'
  supported_by:
  - reference_id: PMID:32619402
    supporting_text: ATP binding to PTK7 and ROR2 is prevented by projection of a tyrosine side-chain
      from the β5/αD hinge region
  - reference_id: file:genes/rat/Ptk7/Ptk7-bioinformatics/RESULTS.md
    supporting_text: '| 948 | A | 957 | A |'
- assessed_term:
    id: GO:0060090
    label: molecular adaptor activity
  scope: UNRESOLVED
  scope_reason: Mammalian PTK7 organizes Src signaling at cell contacts and provides a supported noncatalytic
    signaling example. These experiments do not enumerate all adaptor-capable members of this heterogeneous
    family or justify assigning the same partners to contactins and other branches.
  supported_by:
  - reference_id: PMID:24703874
    supporting_text: 'PTK7 interacts with the

      tyrosine kinase Src and stimulates Src signaling along cell-cell contacts.'
