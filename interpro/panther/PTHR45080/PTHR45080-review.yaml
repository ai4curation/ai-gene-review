review_status: IN_PROGRESS
reviewed_by: codex
review_date: '2026-10-02'
notes: |-
  Exact rat target A0A8I6ALM9 is mapped to human PTK7 Q13308 with reproducible sequence alignment. The ProtNLM function donor Q6AWJ9 is fly Off-track, a homolog; the fly R1–R6/lamina assertion is a lineage-specific overtransfer, not evidence of an unrelated donor. Positive kinase transfers must be distinguished from the correct GOA NOT kinase and NOT ATP-binding annotations. No unverified PAINT node placement or family-wide residue requirement is asserted.

  Placement evidence (2026-10-02)

  | Protein / source | Frozen UniProt placement (historical observation) | Official PANTHER 19.0 row |
  |---|---|---|
  | A0A8I6ALM9 (rat / 10310) | PTHR45080:SF21 — INACTIVE TYROSINE-PROTEIN KINASE 7 | PTHR24418:SF399 |

  Parent membership is unresolved. This protein is comparative evidence outside structured membership; neither parent is asserted as a replacement.

  The rat target A0A8I6ALM9 is a 1,079-residue seven-Ig-domain transmembrane receptor with a kinase-like intracellular region. Alignment to the 1,070-residue human PTK7 Q13308 preserves the human structural landmarks L828, Y877 and ALG948–950 at rat L837, Y886 and ALG957–959 (PMID:32619402; genes/rat/Ptk7/Ptk7-bioinformatics/RESULTS.md). This comparison supports the pseudokinase interpretation; it does not directly measure rat ATP binding or its structure. The differing N-terminus is a trafficking caveat, not evidence that kinase catalysis is restored. The receptor architecture and conserved occluded-pocket landmarks make an active MATK-like kinase interpretation biologically implausible for this sequence. This is an asymmetric functional conclusion, not proof of the correct evolutionary parent or authority to replace the official identifier. Mammalian PTK7 organizes Src signaling at cell contacts; no universal adaptor mechanism, calcium dependence or specific ligand follows for contactins and other branches. The homologous fly Off-track donor Q6AWJ9 does not justify transfer of R1–R6/lamina targeting into vertebrate anatomy. Human Q13308 is independently recorded in official human row 1097 as PTHR45080:SF21 (INACTIVE TYROSINE-PROTEIN KINASE 7; family name CONTACTIN 5), corroborating the cached parent placement. This supplies an in-family PTK7 anchor without resolving the rat assignment or transferring every family member’s function. The official rat row 10310 itself records PTHR24418:SF399, the family label TYROSINE-PROTEIN KINASE, the subfamily label MEGAKARYOCYTE-ASSOCIATED TYROSINE-PROTEIN KINASE and the protein-class field non-receptor tyrosine protein kinase. The MATK-like functional discrepancy therefore cannot be explained solely by pairing the identifier with the cached OBO label. Its classification cause remains unresolved.

  The table records source observations, not live membership declarations. Complete earlier descriptors and assessments are preserved at https://github.com/ai4curation/ai-gene-review/blob/e82261ba811dadbb944cd3770e7fdd2889ec69a4/interpro/panther/PTHR45080/PTHR45080-review.yaml. Current structured term assessments are authoritative; duplicate historical copies have been removed from these notes.

