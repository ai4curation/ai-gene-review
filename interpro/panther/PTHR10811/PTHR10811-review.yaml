notes: >-
  Tree structure (PANTHER treeinfo API, version 19): root PTN008506679 (Eukaryota
  duplication) > PTN000087478 (Eukaryota) > PTN000087479 (Opisthokonta) >
  PTN008506682 (Eumetazoa duplication) > PTN000743915 (Bilateria duplication), which
  splits into PTN000087481 (B3GLCT clade, SF110) and PTN000087518 (Fringe clade).
  The plant clades hang from PTN007465845 (Bikonts). The Fringe clade has no C.
  elegans member, consistent with the absence of Fringe from nematodes. UniProt DR
  PANTHER gives only the family (PTHR10811, no subfamily) for LFNG, MFNG, RFNG,
  B3GLCT and Drosophila fng; subfamily membership here is from PANTHER's 19.0
  classification files. The family's InterPro entry is not integrated into an
  InterPro family, and the InterPro-generated description ("Notch-modifying
  glycosyltransferase") overstates the Notch role for the family as a whole.
