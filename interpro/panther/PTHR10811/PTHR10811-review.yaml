family_id: PANTHER:PTHR10811
family_name: FRINGE-RELATED
preferred_name: Fringe beta1,3-GlcNAc-transferases, B3GLCT and plant DUF604 glycosyltransferases
summary: >-
  A eukaryote-wide family of Golgi/ER beta1,3-glycosyltransferases with a GT31-type
  fold. The animal part has two clades. The Fringe clade (Drosophila Fringe;
  vertebrate Lunatic, Manic and Radical fringe) comprises
  O-fucosylpeptide beta1,3-N-acetylglucosaminyltransferases that add GlcNAc to
  O-fucose on Notch EGF repeats; this elongation changes Notch sensitivity to
  different ligands, typically enhancing Delta responsiveness and reducing
  Serrate/Jagged responsiveness, and underlies boundary formation and somite
  segmentation. The sister B3GLCT clade (human B3GLCT, C. elegans ZC250.2,
  Drosophila CG9109, zebrafish b3galtla) comprises ER beta1,3-glucosyltransferases
  that add glucose, not GlcNAc, to O-fucose on thrombospondin type 1 repeats; human
  B3GLCT deficiency causes Peters-plus syndrome. A large plant clade (DUF604
  proteins) makes up most of the family and is functionally uncharacterised. C.
  elegans has no Fringe ortholog.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Fringe (SF1, SF6, SF7 and the animal members of SF5) transfer GlcNAc from
  UDP-GlcNAc to O-fucose on EGF repeats. B3GLCT (SF110) transfers glucose from
  UDP-glucose to O-fucose on thrombospondin type 1 repeats and does not act on EGF
  repeats. The plant DUF604 subfamilies (most of the ~630 leaves, e.g. SF13, SF56,
  and the plant members of SF5) have no established donor or acceptor. The
  subfamily labelled FRINGE GLYCOSYLTRANSFERASE (SF5) is itself mixed: in the tree it
  holds Drosophila Fringe and other invertebrate fringes (15 leaves under
  PTN000087518) together with about 90 plant and protist proteins.
