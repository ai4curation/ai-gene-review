      - {id: "UniProtKB:Q8NES3", label: LFNG, organism: Homo sapiens}
      - {id: "UniProtKB:O00587", label: MFNG, organism: Homo sapiens}
    assessment: TOO_DEEP
    assessment_reason: >-
      All seeds are Fringe proteins, but the term sits at a Eukaryota speciation node
      (632 of the 634 leaves) that covers the B3GLCT clade and the plant DUF604
      clades as well. B3GLCT is a UDP-glucose-dependent beta1,3-glucosyltransferase
      and receives this GlcNAc-transferase term by IBA (human B3GLCT does, according
      to the leaf PAINT GAF), which contradicts its biochemistry; the plant proteins
      have no established GlcNAc-transferase activity. The same Fringe seeds already
      support GO:0033829 at the Fringe clade node PTN000087518, which is where a
      GlcNAc-transferase term belongs.
