  name:
    name: Notch-modifying glycosyltransferase
    short: Notch_mod-glycosyltransferase
  description:
  - text: This family of proteins includes glycosyltransferases involved in the post-translational
      modification of Notch receptor molecules. They add N-acetylglucosamine to O-linked
      fucose residues on EGF-like repeats within the extracellular domain of Notch,
      influencing its interaction with ligands. This modification can either enhance
      or inhibit Notch signaling, impacting processes such as somite segmentation,
      patterning, neurogenesis, and limb development. Some members also contribute
      to the elongation of O-fucosylglycan, affecting the function of proteins with
      thrombospondin type-1 repeats.
