  name:
    name: Serine/threonine-protein kinase LMTK
    short: STPK_LMTK
  description:
  - text: This family of proteins includes serine/threonine kinases that are involved
      in various cellular processes. Members of this family are known to phosphorylate
      a range of substrates, including the estrogen receptor ESR1, which they protect
      from proteasomal degradation. They may also influence ESR1 transcription through
      a signaling pathway involving PKC, AKT, and FOXO3. Some family members are implicated
      in neuronal differentiation and the endocytic trafficking of NMDA receptors
      in neurons. Additionally, they have been reported to phosphorylate proteins
      such as PPP1C, phosphorylase b, and CFTR, indicating a role in metabolic regulation
      and ion channel function.
