    id: GO:0007420
    label: brain development
  evidence: IBD
  paint_snapshot: '20200207'
  seeds:
  - id: MGI:MGI:1197518
  assessment: SOUND
  assessment_reason: >-
    The IBD is restricted to the LMTK1 branch. Human AATK directly promotes
    neuronal differentiation in SH-SY5Y cells, while mouse LMTK1/AATYK1 genetic
    and replacement experiments place the ortholog upstream of Rab11-dependent
    axonal outgrowth, consistent with a conserved neuronal developmental role.
  supported_by:
  - reference_id: file:interpro/panther/PTHR24417/PTHR24417-paint.tsv
    supporting_text: "PTHR24417\tPTN002815112\tGO:0007420\tP\tIBD\tfalse"
  - reference_id: PMID:10837911
    supporting_text: >-
      overexpression for longer periods (7-8 days) per se, significantly
      (P<0.05-0.001) increased the percent of differentiated cells as well as
      the neurite length
  - reference_id: PMID:22573681
    supporting_text: >-
      LMTK1 can negatively control axonal outgrowth by regulating Rab11A
      activity in a Cdk5-dependent manner
