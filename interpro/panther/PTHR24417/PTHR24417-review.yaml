    label: Euteleostomi
  evidence: IBD
  paint_snapshot: '20200207'
  seeds:
  - id: MGI:MGI:1197518
  assessment: UNRESOLVED
  assessment_reason: >-
    PTN002815112 is the Euteleostomi LMTK1/AATK node and its human recipient is
    Q6ZMQ8/AATK. Mouse Aatk supports the historical tyrosine-kinase call, but
    current human AATK is reviewed as EC 2.7.11.1 and the other characterized
    human LMTK paralogs are serine/threonine kinases. This node needs a deeper
    residue-specificity review before either accepting the tyrosine term or
    asking PAINT to remove it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR24417/PTHR24417-paint.tsv
    supporting_text: "PTHR24417\tPTN002815112\tGO:0004713\tF\tIBD\tfalse\tMGI:MGI:1197518\ttaxon:117571\t20200207"
  - reference_id: PMID:11314040
    supporting_text: >-
      AATYK possessed tyrosine kinase activity and was autophosphorylated when
      expressed in 293 cells.
- node_id: PANTHER:PTN002815112
  asserted_term:
    id: GO:0007420
    label: brain development
  node_taxon:
    id: NCBITaxon:117571
    label: Euteleostomi
  evidence: IBD
  paint_snapshot: '20200207'
  seeds:
  - id: MGI:MGI:1197518
  assessment: SOUND
  assessment_reason: >-
    The IBD is restricted to the LMTK1 branch. AATYK overexpression in human
    SH-SY5Y cells promotes neuronal differentiation in that cellular context,
    while mouse LMTK1/AATYK1 genetic and replacement experiments place the ortholog
    upstream of Rab11-dependent axonal outgrowth, consistent with a conserved
    neuronal developmental role.
  supported_by:
  - reference_id: file:interpro/panther/PTHR24417/PTHR24417-paint.tsv
    supporting_text: "PTHR24417\tPTN002815112\tGO:0007420\tP\tIBD\tfalse\tMGI:MGI:1197518\ttaxon:117571\t20200207"
  - reference_id: PMID:10837911
    supporting_text: >-
      overexpression for longer periods (7-8 days) per se, significantly
      (P<0.05-0.001) increased the percent of differentiated cells as well as
      the neurite length
  - reference_id: PMID:22573681
    supporting_text: >-
      LMTK1 can negatively control axonal outgrowth by regulating Rab11A
      activity in a Cdk5-dependent manner
- node_id: PANTHER:PTN002815112
  asserted_term:
    id: GO:0051402
    label: neuron apoptotic process
  node_taxon:
    id: NCBITaxon:117571
    label: Euteleostomi
  evidence: IBD
  paint_snapshot: '20240321'
  seeds:
  - id: MGI:MGI:1197518
  assessment: SOUND
  assessment_reason: >-
    The neuronal-apoptosis row is also restricted to the Euteleostomi LMTK1/AATK
    node and rests on direct mouse Aatk evidence. Human AATK has not been shown
    directly to drive neuron apoptosis in the cached human literature, so the
    human row is kept as non-core, but no current evidence contradicts the
    LMTK1-branch propagation.
  supported_by:
  - reference_id: file:interpro/panther/PTHR24417/PTHR24417-paint.tsv
    supporting_text: "PTHR24417\tPTN002815112\tGO:0051402\tP\tIBD\tfalse\tMGI:MGI:1197518\ttaxon:117571\t20240321"
  - reference_id: PMID:11314040
    supporting_text: >-
      through its tyrosine kinase activity, AATYK is involved in the apoptosis
      of mature neurons
