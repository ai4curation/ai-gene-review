family_id: PANTHER:PTHR24417
family_name: SERINE/THREONINE-PROTEIN KINASE LMTK1
preferred_name: Lemur-tail kinase family
summary: >-
  This scoped review covers the reviewed human LMTK members of PTHR24417:
  AATK/LMTK1, LMTK2 and LMTK3. All three conserve a protein kinase catalytic
  domain and are curated or experimentally resolved as serine/threonine
  kinases, despite historical tyrosine-kinase names and motifs. PTHR24417 also
  contains non-LMTK eukaryotic subfamilies, so the Eukaryota-level protein
  kinase IBD needs broader review before it can be declared family-wide.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Protein kinase activity is shared by the reviewed animal LMTK kinases, but
  this review does not resolve the non-LMTK branches under the Eukaryota-level
  PTN004704357 node. The current PAINT process rows are subfamily-specific:
  PTN002815112 marks the LMTK1 branch and PTN002814775 marks the LMTK2 branch.
  Human LMTK2 and LMTK3 have direct paralog-specific substrate and trafficking
  mechanisms that should not be propagated across the whole LMTK family.
reference_protein:
  id: UniProtKB:Q6ZMQ8
  label: Serine/threonine-protein kinase LMTK1
  gene_symbol: AATK
  organism: Homo sapiens
  gene_review: genes/human/AATK/AATK-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR24417:SF0
  label: SERINE_THREONINE-PROTEIN KINASE LMTK1
  description: LMTK1/AATK branch, represented in human by AATK.
  representative_members:
  - id: UniProtKB:Q6ZMQ8
    gene_symbol: AATK
    organism: Homo sapiens
    gene_review: genes/human/AATK/AATK-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR24417:SF8
  label: SERINE_THREONINE-PROTEIN KINASE LMTK2
  description: >-
    LMTK2 branch, represented in human by the endosomal PP1- and MYO6-binding
    kinase LMTK2.
  representative_members:
  - id: UniProtKB:Q8IWU2
    gene_symbol: LMTK2
    organism: Homo sapiens
    gene_review: genes/human/LMTK2/LMTK2-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Human LMTK2 has direct PP1C, PPP1R2, CFTR and MYO6 evidence and a PAINTed
    endocytic-recycling role that should stay on the LMTK2 branch.
- subfamily_id: PANTHER:PTHR24417:SF2
  label: SERINE_THREONINE-PROTEIN KINASE LMTK3
  description: >-
    LMTK3 branch, represented in human by a kinase with late-endosomal,
    RCP/RAB14/EPHA2 and nuclear PP1 scaffold contexts.
  representative_members:
  - id: UniProtKB:Q96Q04
    gene_symbol: LMTK3
    organism: Homo sapiens
    gene_review: genes/human/LMTK3/LMTK3-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Human LMTK3 shares the serine/threonine kinase activity but has distinct
    substrates and processes from AATK and LMTK2, including RAB7A,
    RAB11FIP1/RCP, HSPB1, CDC37, ESR1 and nuclear PP1/TRIM28 mechanisms.
node_assessments:
- node_id: PANTHER:PTN004704357
  asserted_term:
