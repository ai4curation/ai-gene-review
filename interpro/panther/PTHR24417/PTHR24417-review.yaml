family_id: PANTHER:PTHR24417
family_name: SERINE/THREONINE-PROTEIN KINASE LMTK1
preferred_name: Lemur-tail kinase family
summary: >-
  PTHR24417 contains the animal LMTK1/AATK, LMTK2 and LMTK3 serine/threonine
  protein kinases. All three reviewed human members conserve a protein kinase
  catalytic domain and are curated or experimentally resolved as
  serine/threonine kinases, despite historical tyrosine-kinase names and
  motifs. The paralogs have diverged substantially in their cellular substrates
  and processes: AATK/LMTK1 has sparse human evidence for neuronal
  differentiation and CDK5 interaction, LMTK2 binds PP1 and MYO6 and supports
  endocytic recycling, and LMTK3 phosphorylates multiple cancer-cell substrates
  and regulates RAB7A, RAB11FIP1/RAB14/EPHA2 and nuclear PP1-TRIM28 biology.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Protein kinase activity is family-wide, but the current PAINT process rows are
  subfamily-specific: PTN002815112 marks the LMTK1 branch and PTN002814775
  marks the LMTK2 branch. Human LMTK2 and LMTK3 have direct paralog-specific
  substrate and trafficking mechanisms that should not be propagated across the
  whole LMTK family.
