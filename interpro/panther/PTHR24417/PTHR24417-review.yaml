  seeds:
  - id: MGI:MGI:1197518
  - id: UniProtKB:Q8IWU2
  - id: UniProtKB:Q96Q04
  assessment: UNRESOLVED
  assessment_reason: >-
    PTN004704357 is seeded by mouse Aatk plus human LMTK2 and LMTK3, and the
    broad protein-kinase parent is sound for the reviewed animal LMTK
    recipients. The row itself is placed at Eukaryota, however, and
    PTHR24417-entries.csv shows a fungal EAF1 representative in SF7 while the
    metadata report five subfamilies and 3434 proteins. This scoped human pass
    did not establish whether every non-LMTK branch below the Eukaryota node is
    a protein kinase.
