    supporting_text: "PTHR24417\tPTN004704357\tGO:0004672\tF\tIBD\tfalse\tMGI:MGI:1197518|UniProtKB:Q8IWU2|UniProtKB:Q96Q04\ttaxon:2759\t20260529"
  - reference_id: file:interpro/panther/PTHR24417/PTHR24417-entries.csv
    supporting_text: "Q4P209,Chromatin modification-related protein EAF1,protein,5270,Mycosarcoma maydis,Mycosarcoma maydis (Corn smut fungus),EAF1,1654,PTHR24417:SF7,CHROMATIN MODIFICATION-RELATED PROTEIN EAF1,True"
