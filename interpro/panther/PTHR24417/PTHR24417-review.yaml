  diverged_from_family: false
- subfamily_id: PANTHER:PTHR24417:SF8
  label: SERINE_THREONINE-PROTEIN KINASE LMTK2
  description: >-
    Mammalian LMTK2 branch, represented in human by the endosomal PP1- and
    MYO6-binding kinase LMTK2.
  representative_members:
  - id: UniProtKB:Q8IWU2
    gene_symbol: LMTK2
    organism: Homo sapiens
    gene_review: genes/human/LMTK2/LMTK2-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Human LMTK2 has direct PP1C, PPP1R2, CFTR and MYO6 evidence and a PAINTed
    endocytic-recycling role that should stay on the LMTK2 branch.
- subfamily_id: PANTHER:PTHR24417:SF2
  label: SERINE_THREONINE-PROTEIN KINASE LMTK3
  description: >-
    Mammalian LMTK3 branch, represented in human by a kinase with late-endosomal,
    RCP/RAB14/EPHA2 and nuclear PP1 scaffold contexts.
  representative_members:
  - id: UniProtKB:Q96Q04
    gene_symbol: LMTK3
    organism: Homo sapiens
    gene_review: genes/human/LMTK3/LMTK3-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Human LMTK3 shares the serine/threonine kinase activity but has distinct
    substrates and processes from AATK and LMTK2, including RAB7A,
    RAB11FIP1/RCP, HSPB1, CDC37, ESR1 and nuclear PP1/TRIM28 mechanisms.
