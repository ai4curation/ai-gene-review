- assessed_term:
    id: GO:0004709
    label: MAP kinase kinase kinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    MAP3K activity defines the bilaterian TAK1 clade. TAK1 phosphorylates MKK3, MKK6 and MKK4, and
    fly Tak1 is the MAPKKK of the JNK pathway. SF1 is the family's only subfamily, so the scope is
    stated as SF1. The human MAP3K7 gene review confirms this scoping: it accepts MAP3K activity (IDA
    on MKK3/MKK6 and MKK4/MKK7) as its core MF and accepts the Bilateria-node IBA. Comparative evidence
    from outside the PANTHER family agrees: C. elegans MOM-4 (a PTHR23257 leaf in PANTHER 19) phosphorylates
    the LIT-1 activation-loop Thr220 directly, and the kinase-dead D176N mutant does not. Dictyostelium
    Phg2, which UniProt/InterPro also cross-reference to SF1 but PANTHER places in PTHR23257:SF776,
    has no known MAP2K substrate and is outside this scope.
