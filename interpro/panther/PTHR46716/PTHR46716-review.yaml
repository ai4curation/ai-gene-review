    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    The fly and mammalian seeds both show TAK1 acting as the MAPKKK upstream of MKK4/7 and JNK. In mammals
    this is through ceramide, IL-1 and TRAF6 signaling. In Drosophila it is in development (dorsal closure,
    apoptosis) and in Imd-pathway immune signaling. The Bilateria placement is the lowest node that
    covers both seeds. The only nematode leaf in the tree (Pristionchus) is untested, and C. elegans
    MOM-4 is documented in a LIT-1/NLK pathway rather than a JNK pathway. This is a gap in evidence,
    not evidence of loss, so no pruning is proposed.
