family_id: PANTHER:PTHR46716
family_name: MITOGEN-ACTIVATED PROTEIN KINASE KINASE KINASE 7
preferred_name: TAK1 (MAP3K7) orthologs, plus Dictyostelium TKL kinases assigned via InterPro (Phg2 and DDB_G0282963)
summary: >-
  The core of this family is TAK1 (transforming growth factor beta-activated kinase 1; MAP3K7), a
  Ser/Thr protein kinase of the TKL group that acts as a MAP kinase kinase kinase. Vertebrate TAK1 has
  an N-terminal kinase domain and a C-terminal region that binds the adaptor proteins TAB2 and TAB3;
  the activator TAB1 binds near the kinase domain. With these partners it forms the TAK1-TAB complex,
  which is activated by K63-linked and unanchored polyubiquitin downstream of TRAF6 and other E3 ligases.
  The active kinase phosphorylates MKK3/6 and MKK4/7 (p38 and JNK branches) and IKK-beta (canonical
  NF-kappaB), so TAK1 is a hub for IL-1, Toll-like receptor, TNF, TGF-beta and antigen-receptor signaling.
  Drosophila Tak1 performs the same job in the Imd immune pathway, activating both the IKK complex that
  processes Relish and the JNK pathway, and it acts in JNK signaling in development. Nematode MOM-4 is
  a TAK1 ortholog that, with its TAB1-like activator TAP-1, activates the Nemo-like kinase LIT-1 in Wnt-dependent
  endoderm specification. Nematodes lack NF-kappaB, so MOM-4 does not take part in NF-kappaB signaling.
  UniProt/InterPro also assign two large Dictyostelium discoideum TKL kinases to the family's only subfamily,
  SF1, although PANTHER's own tree places them in the Ser/Thr kinase family PTHR23257. Only their kinase domains resemble TAK1; the rest of each protein is unrelated. Phg2
  (1387 aa) has an N-terminal PI(4,5)P2-binding membrane-targeting domain, a Ras-association domain that
  binds Rap1-GTP, and a C-terminal kinase domain. It is a Rap1 effector that controls cell-substrate adhesion,
  phagocytic particle binding, cortical myosin II and motility. It also inhibits the phosphatase PTP3 to
  promote STATc activation under hyperosmotic stress, and negatively regulates nutrient-controlled initiation
  of development. DDB_G0282963 (1761 aa) is uncharacterized. Neither Dictyostelium protein carries the
  TAK1-specific InterPro signatures (IPR049637 MAP3K7, IPR060742 C-terminal TAB-binding region). No evidence
  links either one to a MAP kinase cascade, the TAB proteins or NF-kappaB. What the whole family shares
  is Ser/Thr protein kinase activity with an intact catalytic lysine and HRD aspartate.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The PANTHER 19 reference tree for PTHR46716 is rooted at the Bilateria node PTN000723805 and contains
  only bilaterian TAK1 orthologs (vertebrates, amphioxus, sea urchin, insects, a tick and the nematode
  Pristionchus). Judged by PANTHER's own tree, the family is coherent. For those members MAP3K activity, assembly with TAB adaptors and signaling to JNK/p38
  and IKK are conserved, with the nematode exception that NF-kappaB is absent. The family's single subfamily,
  SF1, nevertheless also collects members through the UniProt/InterPro cross-reference that are not
  in its reference tree: C. elegans MOM-4 (a true TAK1 ortholog) and two Dictyostelium TKL kinases,
  Phg2 and DDB_G0282963. PANTHER 19's own classification files and tree place all three in the large
  Ser/Thr kinase family PTHR23257 instead (Phg2 in PTHR23257:SF776, DDB_G0282963 in SF758, MOM-4 in
  SF958), so their membership here is a source disagreement.
  The Dictyostelium proteins are not TAK1 orthologs in function or architecture. They are long multidomain
  proteins whose C-terminal kinase domain is scored into this family by InterPro. Phg2 is an experimentally characterized
  Rap1 effector in adhesion and phagocytosis. Because they share SF1 with TAK1, no subfamily boundary
  separates them, so the TAK1-clade terms (MAP3K activity, TAK1 complex, JNK cascade, NF-kappaB activation,
  immune response) are scoped to SF1 with Phg2 as a recorded member exception. Ser/Thr protein kinase
  activity is family-wide.
