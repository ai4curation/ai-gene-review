      gene_symbol: phg2
      organism: Dictyostelium discoideum
      gene_review: genes/DICDI/phg2/phg2-ai-review.yaml
    exception_reason: >-
      Phg2 is a Rap1 effector that regulates cortical myosin II and adhesion. Nothing places it in a
      JNK-type MAPK cascade, and it is outside the Bilateria node that carries the term.
    supported_by:
