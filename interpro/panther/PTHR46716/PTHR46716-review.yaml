    supporting_text: >-
      Expression of a constitutively active form of TAK1 resulted in activation of SAPK/JNK and SEK1/MKK4,
      a direct activator of SAPK/JNK.
  - reference_id: PMID:10757786
    supporting_text: >-
      Genetic and biochemical analyses also indicate that the c-Jun amino-terminal kinase (JNK) signaling
      pathway is specifically activated by TAK1 signaling.
