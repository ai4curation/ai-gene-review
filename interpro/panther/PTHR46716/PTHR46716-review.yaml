- assessed_term:
    id: GO:0097076
    label: transforming growth factor beta activated kinase 1 complex
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Assembly with the TAB adaptors is a TAK1-clade property. TAB1 activates TAK1, TAB2 links it to
    TRAF6, and TAK1, TAB1 and TAB2 together make up the TRIKA2 IKK-activating complex. C. elegans MOM-4
    is activated by the TAB1 homolog TAP-1. The C-terminal TAB2/TAB3-binding region (InterPro IPR060742)
    is present in TAK1 and absent from the Dictyostelium members, which are excepted. GO:0097076 is
    defined as the TAK1-TAB complex that activates IKK and MAP kinases in response to TRAF6 signaling.
    It currently has no GOA annotations. ComplexPortal annotates the TAK1-TAB complex to the generic
    GO:1902554 serine/threonine protein kinase complex, which is not an ancestor of GO:0097076. The
    scope therefore rests on the vertebrate biochemistry rather than on existing annotations. The human
    MAP3K7 gene review proposes GO:0097076 as a NEW part_of annotation (IDA, TRIKA2 purification). The
    term is not extended to C. elegans MOM-4, which is recorded as a member exception.
  applicable_subfamilies:
  - id: PANTHER:PTHR46716:SF1
    label: MITOGEN-ACTIVATED PROTEIN KINASE KINASE KINASE 7
  member_exceptions:
  - member:
      id: UniProtKB:Q54QQ1
      label: Serine/threonine-protein kinase phg2
      gene_symbol: phg2
      organism: Dictyostelium discoideum
      gene_review: genes/DICDI/phg2/phg2-ai-review.yaml
    exception_reason: >-
      Phg2 lacks the TAK1 C-terminal TAB-binding region (no IPR060742 or IPR049637 match in UniProt),
      and its known partners are Rap1, the Adrm1 homolog and PTP3, not TAB proteins. No TAK1-complex
      membership has been reported.
    supported_by:
    - reference_id: PMID:16987957
      supporting_text: the Phg2 core region interacted with the Dictyostelium adhesion-regulating molecule (Adrm1) protein
    - reference_id: PMID:16769729
      supporting_text: >-
        Phg2, a serine/threonine-specific kinase, directly interacts with Rap1 via its Ras association
        domain
  - member:
      id: UniProtKB:Q9XTC6
      label: Mitogen-activated protein kinase kinase kinase mom-4
      gene_symbol: mom-4
      organism: Caenorhabditis elegans
      gene_review: genes/worm/mom-4/mom-4-ai-review.yaml
    exception_reason: >-
      MOM-4 binds and is activated by the TAB1-like protein TAP-1, but the GO:0097076 definition
      requires IKK and MAP kinase activation in response to TRAF6 signaling. Nematodes lack NF-kappaB,
      and the MOM-4/TAP-1 assembly signals directly to LIT-1. MOM-4 also lacks the TAK1 C-terminal
      TAB2/TAB3-binding signatures. The mom-4 gene review does not annotate the complex and asks
      whether the term should be generalized to cover a TAK1-TAB1 activator assembly. MOM-4 is not a
      leaf of the PANTHER 19 tree, so no pruned node is named.
    supported_by:
    - reference_id: PMID:11323434
      supporting_text: >-
        The C. elegans homolog of TAB1, TAP-1, was able to interact with and activate the C. elegans
        homolog of TAK1, MOM-4.
    - reference_id: PMID:31384522
      supporting_text: elegans lacks NF-κB-like transcription factors
  supported_by:
  - reference_id: PMID:11460167
    supporting_text: >-
      Here we report the purification and identification of TRIKA2, which is composed of TAK1, TAB1 and
      TAB2, a protein kinase complex previously implicated in IKK activation through an unknown mechanism.
  - reference_id: PMID:8638164
    supporting_text: TAB1 and TAK1 were co-immunoprecipitated from mammalian cells.
  - reference_id: PMID:14960582
    supporting_text: >-
      We find that Wnt1 stimulation results in autophosphorylation and activation of MOM-4/Tak1 in a
      TAP-1/Tab1-dependent fashion.
- assessed_term:
    id: GO:0007254
    label: JNK cascade
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    TAK1 acts upstream of MKK4/7 and JNK in mammals and in Drosophila, which is consistent with the
    sound Bilateria-node IBA. The Dictyostelium members are excepted. Dictyostelium Phg2 has no JNK-pathway
    link, and its signaling outputs are cytoskeletal (myosin II, adhesion) and the PTP3/STATc axis.
    The human MAP3K7 gene review accepts the JNK cascade (IDA and IBA). For C. elegans MOM-4 neither
    JNK nor p38 signaling has been tested; its documented output is direct LIT-1 activation. This is a
    gap in evidence, not evidence of loss, so MOM-4 is not excepted.
  applicable_subfamilies:
  - id: PANTHER:PTHR46716:SF1
    label: MITOGEN-ACTIVATED PROTEIN KINASE KINASE KINASE 7
