term_assessments:
- assessed_term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the one specific activity every member shares. It is shown experimentally for TAK1, for
    C. elegans MOM-4 and for Dictyostelium Phg2, and the catalytic lysine and HRD aspartate are intact
    in every member checked, including the uncharacterized DDB_G0282963. It is a core term for all
    members, the Dictyostelium kinases included.
  supported_by:
  - reference_id: PMID:9079627
    supporting_text: Ceramide itself stimulated the kinase activity of TAK1.
  - reference_id: PMID:10391246
    supporting_text: MOM-4 and TAK1 bind related proteins that promote their kinase activities
  - reference_id: PMID:15194808
    supporting_text: PHG2 encodes a novel serine/threonine kinase with a ras-binding domain
- assessed_term:
    id: GO:0004709
    label: MAP kinase kinase kinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    MAP3K activity defines the bilaterian TAK1 clade. TAK1 phosphorylates MKK3, MKK6 and MKK4, fly
    Tak1 is the MAPKKK of the JNK pathway, and MOM-4/Tak1 activates the MAPK-like LIT-1/NLK. SF1 is
    the family's only subfamily, so the scope is stated as SF1 with the Dictyostelium kinase Phg2 excepted.
    The human MAP3K7 gene review confirms this scoping: it accepts MAP3K activity (IDA on MKK3/MKK6
    and MKK4/MKK7) as its core MF and accepts the Bilateria-node IBA. The C. elegans mom-4 gene review
    also accepts MAP3K activity on direct evidence. Wild-type but not kinase-dead (D176N) MOM-4
    phosphorylates the LIT-1 activation-loop Thr220 (TXE motif) in vitro, with no MAP2K in between.
    The term therefore holds for MOM-4 even though MOM-4 is not a leaf of the PANTHER 19 tree.
  applicable_subfamilies:
  - id: PANTHER:PTHR46716:SF1
    label: MITOGEN-ACTIVATED PROTEIN KINASE KINASE KINASE 7
  member_exceptions:
