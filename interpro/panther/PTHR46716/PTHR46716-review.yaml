    exception_reason: >-
      Phg2 is placed in SF1 only by the UniProt/InterPro cross-reference. PANTHER 19 itself classifies
      it in PTHR23257:SF776, and it is not in the PTHR46716 reference tree and does not descend from the Bilateria node that carries the MAP3K assertion.
      Its architecture (PI(4,5)P2-binding domain, Ras-association domain, C-terminal kinase) and its
      biology (Rap1 effector in adhesion, phagocytosis and myosin II regulation, and PTP3 inhibition)
