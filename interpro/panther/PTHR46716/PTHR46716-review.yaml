notes: >-
  Tree topology comes from the PANTHER 19 treeinfo service (family=PTHR46716), and node terms come from
  PTHR46716-paint.tsv. The reference tree is rooted at PTN000723805 (Bilateria, SF1) with Deuterostomia
  and Ecdysozoa children. The only nematode leaf is Pristionchus (PTN008470966), and Drosophila Tak1
  and Takl1 come from a dipteran duplication (PTN009202086). C. elegans MOM-4, Phg2 and DDB_G0282963
  carry PTHR46716:SF1 in their UniProt cross-references, but they are not leaves of this tree. PANTHER
  19's classification files and the PTHR23257 treeinfo place them in PTHR23257 (SF958, SF776 'SERINE_THREONINE-PROTEIN
  KINASE PHG2', and SF758 respectively). The repo's PANTHER member index accepts both sources, with
  a warning. Which assignment is correct (the PANTHER tree placement looks right for the Dictyostelium
  kinases) could be recorded in interpro/panther/panther-members-overrides.tsv. That was not done here. Their IBAs (protein kinase activity, cytoplasm,
  signal transduction) come from the deep kinase node PTN001148170, not from the TAK1 node (QuickGO,
  October 2026). PANTHER's single-subfamily structure means the TAK1-clade terms cannot be fenced off
  by subfamily, so the Dictyostelium kinases are handled as member exceptions. Phg2 is the only
  characterized one. Q54RR9 (DDB_G0282963) is uncharacterized; per the reasoning above it should also
  not receive TAK1-clade terms, but no literature exists to support a formal exception. Takl1 (P83104)
  is a dipteran paralog with an intact catalytic loop (HRDIKPQN) and no characterized function. Phg2's
  own specific functions (small GTPase/Rap1 binding, PI(4,5)P2 binding) are member-specific and are
  not assessed at family level. Gene reviews now exist for human MAP3K7 (reference protein), C.
  elegans mom-4 and Dictyostelium phg2. MAP3K7 agrees with every SF1 scope here: MAP3K activity, JNK
  cascade and NF-kappaB regulation are accepted, immune response is kept as non-core, and the
  TAK1 complex (GO:0097076) is proposed NEW because GOA has no annotations to it. mom-4 accepts
  MAP3K activity on direct evidence (LIT-1 Thr220), carries no NF-kappaB or TAK1-complex term, and
  leaves its family membership as an open question. The membership conflict is unchanged: MOM-4 has
  no TAK1-specific InterPro signatures (IPR049637, IPR060742) and PANTHER 19's tree places it in
  PTHR23257:SF958. No module in this repo currently cites PTHR46716 as a family descriptor.
  modules/dicty_jak_independent_stat_signaling.yaml only mentions Phg2's subfamily in prose.
