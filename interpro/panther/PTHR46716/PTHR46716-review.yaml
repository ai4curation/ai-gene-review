  assessment: SOUND
  assessment_reason: >-
    PTN000723805 is the root of the PANTHER 19 tree for this family, a Bilateria speciation node. Seeds
    from fly and from rat and human bracket it. TAK1 phosphorylates and activates the MAP2Ks MKK3, MKK6
    and MKK4 directly, and fly Tak1 acts as the MAPKKK for the JNK pathway. C. elegans MOM-4 also
    activates the MAPK-like kinase LIT-1/NLK, which fits the protostome placement. The Dictyostelium
    members of SF1 are not leaves of this tree, so they do not inherit the term from this node, and
    QuickGO shows no GO:0004709 IBA on Phg2 or DDB_G0282963.
