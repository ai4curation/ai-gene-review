    The invariant lysine of kinase subdomain II (beta3 strand) that coordinates the alpha and beta phosphates
    of ATP. In TAK1 it is K63, and the K63W substitution is the standard dominant-negative, kinase-inactive
    allele. Drosophila Tak1 carries it at K46, and the K46R mutant is likewise dominant negative.
