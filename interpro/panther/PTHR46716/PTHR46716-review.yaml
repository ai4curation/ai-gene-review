- assessed_term:
    id: GO:0097076
    label: transforming growth factor beta activated kinase 1 complex
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Assembly with the TAB adaptors is a TAK1-clade property. TAB1 activates TAK1, TAB2 links it to
    TRAF6, and TAK1, TAB1 and TAB2 together make up the TRIKA2 IKK-activating complex. GO:0097076 is
    defined as the TAK1-TAB complex that activates IKK and MAP kinases in response to TRAF6 signaling.
    It currently has no GOA annotations. ComplexPortal annotates the TAK1-TAB complex to the generic
    GO:1902554 serine/threonine protein kinase complex, which is not an ancestor of GO:0097076. The
    scope therefore rests on the vertebrate biochemistry rather than on existing annotations. The human
    MAP3K7 gene review proposes GO:0097076 as a NEW part_of annotation (IDA, TRIKA2 purification).
    Comparative note from outside the PANTHER family: C. elegans MOM-4 binds and is activated by the
    TAB1-like TAP-1, but nematodes lack NF-kappaB and MOM-4 lacks the TAK1 C-terminal TAB2/TAB3-binding
    signatures, so the term should not be extended to it; the mom-4 gene review does not annotate it.
