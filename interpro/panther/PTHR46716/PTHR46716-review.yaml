family_id: PANTHER:PTHR46716
family_name: MITOGEN-ACTIVATED PROTEIN KINASE KINASE KINASE 7
preferred_name: TAK1 (MAP3K7) orthologs of Bilateria
summary: >-
  The core of this family is TAK1 (transforming growth factor beta-activated kinase 1; MAP3K7), a
  Ser/Thr protein kinase of the TKL group that acts as a MAP kinase kinase kinase. Vertebrate TAK1 has
  an N-terminal kinase domain and a C-terminal region that binds the adaptor proteins TAB2 and TAB3;
  the activator TAB1 binds near the kinase domain. With these partners it forms the TAK1-TAB complex,
  which is activated by K63-linked and unanchored polyubiquitin downstream of TRAF6 and other E3 ligases.
  The active kinase phosphorylates MKK3/6 and MKK4/7 (p38 and JNK branches) and IKK-beta (canonical
  NF-kappaB), so TAK1 is a hub for IL-1, Toll-like receptor, TNF, TGF-beta and antigen-receptor signaling.
  Drosophila Tak1 performs the same job in the Imd immune pathway, activating both the IKK complex that
  processes Relish and the JNK pathway, and it acts in JNK signaling in development. Nematode MOM-4 is
  a TAK1 ortholog that, with its TAB1-like activator TAP-1, activates the Nemo-like kinase LIT-1 in Wnt-dependent
  endoderm specification. Nematodes lack NF-kappaB, so MOM-4 does not take part in NF-kappaB signaling.
  What the whole family shares is Ser/Thr protein kinase activity with an intact catalytic lysine and
  HRD aspartate. UniProt/InterPro cross-references also score C. elegans MOM-4 and two Dictyostelium
  TKL kinases (Phg2 and DDB_G0282963) into this family, but PANTHER's own tree and the PAINT nodes
  their IBAs come from place all three in the large Ser/Thr kinase family PTHR23257, and they are
  not treated as members here (see notes).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The PANTHER 19 reference tree for PTHR46716 is rooted at the Bilateria node PTN000723805 and contains
  only bilaterian TAK1 orthologs (vertebrates, amphioxus, sea urchin, insects, a tick and the nematode
  Pristionchus). Judged by PANTHER's own tree, the family is coherent. For those members MAP3K activity,
  assembly with TAB adaptors and signaling to JNK/p38 and IKK are conserved, with the nematode exception
  that NF-kappaB is absent. Ser/Thr protein kinase activity is family-wide. The TAK1-clade terms (MAP3K
  activity, TAK1 complex, JNK cascade, NF-kappaB activation, immune response) are scoped to SF1, the
  family's only subfamily. Three proteins that UniProt/InterPro cross-reference to SF1 (C. elegans MOM-4
  and Dictyostelium Phg2 and DDB_G0282963) are PTHR23257 leaves in PANTHER 19 and are pinned there in
  interpro/panther/panther-members-overrides.tsv. The Dictyostelium pair are not TAK1 homologs in
  architecture or function, so the earlier member exceptions for Phg2 are no longer needed. MOM-4 is
  a functional TAK1 homolog outside PANTHER's family; its biology is kept as comparative evidence.
