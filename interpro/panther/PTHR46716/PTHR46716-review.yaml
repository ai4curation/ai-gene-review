  description: >-
    The only subfamily, so it is the same as the family. Its PANTHER 19 tree root is the Bilateria
    node PTN000723805. The tree holds the bilaterian TAK1 orthologs: human, mouse, rat and other vertebrate
    MAP3K7, amphioxus, sea urchin, Drosophila Tak1 and its paralog Takl1 (from a dipteran duplication),
    mosquito, Tribolium, Ixodes and Pristionchus. Members are also assigned to SF1 by the UniProt/InterPro
    cross-reference without being leaves of the reference tree (PANTHER's tree puts them in PTHR23257). These include C. elegans MOM-4, a genuine TAK1 ortholog,
    and the Dictyostelium TKL kinases Phg2 (Q54QQ1) and DDB_G0282963 (Q54RR9), which are not. The
    subfamily is therefore functionally mixed. Its bilaterian core is coherent, but the TAK1-specific
    terms must not be extended to the Dictyostelium members (see the member exceptions on the term assessments).
