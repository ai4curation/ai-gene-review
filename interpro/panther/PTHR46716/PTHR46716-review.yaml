notes: >-
  Tree topology comes from the PANTHER 19 treeinfo service (family=PTHR46716), and node terms come from
  PTHR46716-paint.tsv. The reference tree is rooted at PTN000723805 (Bilateria, SF1) with Deuterostomia
  and Ecdysozoa children. The only nematode leaf is Pristionchus (PTN008470966), and Drosophila Tak1
  and Takl1 come from a dipteran duplication (PTN009202086). Takl1 (P83104) is a dipteran paralog
  with an intact catalytic loop (HRDIKPQN) and no characterized function.
  Membership resolution (October 2026). C. elegans MOM-4 (Q9XTC6), Dictyostelium Phg2 (Q54QQ1) and
  DDB_G0282963 (Q54RR9) carry PTHR46716:SF1 in their UniProt cross-references, which come from
  InterPro 110.0 HMM best hits. InterPro 110.0 integrates the same PANTHER release, 19.0, so this is
  a method disagreement rather than a release lag. PANTHER 19's own classification files and the
  PTHR23257 treeinfo place all three in PTHR23257: Phg2 in SF776 and DDB_G0282963 in SF758, as
  siblings with D. purpureum orthologs in a Dictyostelium clade (PTN002758685); MOM-4 in SF958, in an
  Ecdysozoa speciation clade (PTN007744917) with its C. briggsae ortholog, Drosophila Takl2 and a
  Daphnia MAP3K, at ordinary branch lengths. All three take their IBAs (protein kinase activity,
  cytoplasm, signal transduction) from the PTHR23257 node PTN001148170, not from the TAK1 node
  PTN000723805. PANTHER's placement is therefore adopted for family membership, and Q54QQ1 and Q9XTC6
  are pinned to PTHR23257 in interpro/panther/panther-members-overrides.tsv. Q54RR9 is not cited
  anywhere the member index covers, so it has no override row. Phg2 and MOM-4 have been removed as
  representatives of SF1, the Phg2 member exceptions (no longer needed for a non-member) have been
  dropped, and the MOM-4 exceptions have been folded into the scope reasons as comparative evidence.
  MOM-4 remains a residue-site positive control, because it is a functional TAK1 homolog whose
  kinase-dead D176N allele tests the HRD aspartate directly. Pinning concerns PANTHER family membership
  only: MOM-4 is still described as a TAK1 homolog in its gene review. Whether PANTHER's split of
  nematode MOM-4 from the bilaterian TAK1 tree reflects real orthology (MOM-4 grouping with insect
  Takl2 rather than Tak1) or a tree-building artifact is a question for PANTHER, not a decision made
  here. Gene reviews exist for human MAP3K7 (reference protein), C. elegans mom-4 and Dictyostelium
  phg2. MAP3K7 agrees with every SF1 scope here: MAP3K activity, JNK cascade and NF-kappaB regulation
  are accepted, immune response is kept as non-core, and the TAK1 complex (GO:0097076) is proposed
  NEW because GOA has no annotations to it. No module in this repo cites PTHR46716 for MOM-4 or Phg2;
  modules/dicty_jak_independent_stat_signaling.yaml records the Phg2 resolution in prose.
