    All three seeds are mammalian. Extending the term to insects is well founded, because Drosophila
    Tak1 is the IKK-activating kinase of the Imd/Relish pathway. The node also covers the nematode
    branch of the tree (the Pristionchus leaf PTN008470966), and nematodes have no NF-kappaB transcription
