- site_id: catalytic_asp
  label: HRD catalytic-loop aspartate (proton acceptor)
  description: >-
    The catalytic-loop aspartate of the HRD motif, which acts as the catalytic base (UniProt ACT_SITE,
    proton acceptor). In TAK1 it is D156, in the loop HRDLKPPN. The Ser/Thr-type catalytic loop (HRDxKxxN)
    is conserved in every member checked. C. elegans MOM-4, a TAK1 homolog that PANTHER 19 places in
    PTHR23257 rather than this family, is kept as an external positive control because its kinase-dead
    D176N mutant tests this residue directly.
