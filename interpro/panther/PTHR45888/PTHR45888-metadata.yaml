  name:
    name: Chromatin Remodeling and Transcription Regulation
    short: Chromatin_Rmdl+Transcr_Reg
  description:
  - text: This family of proteins is involved in chromatin remodeling and transcription
      regulation. Members participate in the formation and function of the neural
      progenitors-specific chromatin remodeling complex (npBAF complex) and the neuron-specific
      chromatin remodeling complex (nBAF complex). These complexes are crucial for
      the development and differentiation of neural progenitors into neurons, playing
      a key role in the self-renewal and proliferative capacity of neural stem cells.
      Some family members also have histone methyltransferase activity, specifically
      methylating 'Lys-4' of histone H3, which is associated with transcriptional
      activation. Additionally, certain proteins within this family may act as transcription
      factors, potentially influencing cell survival and neural development.
