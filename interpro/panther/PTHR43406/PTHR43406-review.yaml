notes: >-
  Member counts come from the parsed entries.csv (546 reviewed proteins: 544
  in SF1, one each in SF6 and SF7). E. coli TrpA (P0A877), the classic alpha
  subunit and a PAINT seed, has no gene review in this repository, so P.
  putida TrpA is the reference protein. Fungal tryptophan synthase is a single
  TrpA-TrpB chain classified in PTHR48077 by its beta part, so the
  tryptophan_biosynthesis module grounds the fused fungal annoton there.
