family_id: PANTHER:PTHR43406
family_name: TRYPTOPHAN SYNTHASE, ALPHA CHAIN
preferred_name: Tryptophan synthase alpha chain (TrpA) family
summary: >-
  Tryptophan synthase alpha chains (TrpA, EC 4.2.1.20 alpha reaction /
  indole-3-glycerol-phosphate lyase EC 4.1.2.8). These TIM-barrel enzymes
  cleave indole-3-glycerol phosphate to indole and glyceraldehyde 3-phosphate
  and pass the indole to the PLP-dependent beta chain (TrpB, PTHR48077) in the
  alpha2-beta2 tryptophan synthase. Almost every reviewed member is a
  bacterial, archaeal or plastid TrpA in subfamily SF1 (544 of 546). Two plant
  subfamilies hold single reviewed members with indole-releasing roles outside
  tryptophan synthesis: Arabidopsis TRPA1/INS (SF6) and maize BX1 (SF7), an
  indole-3-glycerol-phosphate lyase of benzoxazinoid defence-compound
  biosynthesis. Fungal tryptophan synthase is a single TrpA-TrpB chain, which
  PANTHER classifies with the beta chains in PTHR48077, not here.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF1 (544 reviewed members) is uniformly the tryptophan synthase alpha chain.
  SF7 (maize BX1) has neofunctionalized into a free-indole-producing lyase for
  benzoxazinoid biosynthesis, and SF6 (Arabidopsis TRPA1) is described by
  UniProt as contributing to tryptophan-independent indole synthesis. The
  shared chemistry, IGP cleavage to indole plus G3P, is conserved, but whether
  the indole feeds tryptophan synthase differs.
reference_protein:
  id: UniProtKB:Q88RP7
  label: Tryptophan synthase alpha chain
  gene_symbol: trpA
  organism: Pseudomonas putida KT2440
  gene_review: genes/PSEPK/trpA/trpA-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43406:SF1
  label: TRYPTOPHAN SYNTHASE ALPHA CHAIN, CHLOROPLASTIC
  description: >-
    Canonical TrpA of bacteria, archaea and plant plastids (E. coli TrpA, P.
    aeruginosa TrpA, P. putida TrpA, Arabidopsis TSA1). Despite the PANTHER
    name, it contains the bacterial alpha chains as well as the plastid ones.
  representative_members:
  - id: UniProtKB:Q88RP7
    gene_symbol: trpA
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/trpA/trpA-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: file:interpro/panther/PTHR43406/PTHR43406-entries.csv
    supporting_text: >-
      Q88RP7,Tryptophan synthase alpha chain,protein,160488
  - reference_id: file:interpro/panther/PTHR43406/PTHR43406-entries.csv
    supporting_text: >-
      P0A877,Tryptophan synthase alpha chain,protein,83333,Escherichia coli (strain K12)
- subfamily_id: PANTHER:PTHR43406:SF6
  label: TRYPTOPHAN SYNTHASE ALPHA CHAIN
  description: >-
    Arabidopsis TRPA1 (At4g02610, also called INS or TSA). UniProt describes it
    as contributing to tryptophan-independent indole biosynthesis. No member
    is reviewed in this repository.
  diverged_from_family: true
  divergence_description: >-
    Single reviewed member with a reported role in tryptophan-independent indole
    production. The IGP-lyase chemistry is retained, but participation in
    tryptophan synthase is not established for this subfamily.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43406/PTHR43406-entries.csv
    supporting_text: >-
      O22765,Tryptophan synthase alpha chain,protein,3702,Arabidopsis thaliana
- subfamily_id: PANTHER:PTHR43406:SF7
  label: INDOLE-3-GLYCEROL PHOSPHATE LYASE, CHLOROPLASTIC
  description: >-
    Maize BX1, the indole-3-glycerol-phosphate lyase that releases free indole
    as the first committed step of benzoxazinoid (DIBOA/DIMBOA) defence
    metabolism.
  diverged_from_family: true
  divergence_description: >-
    Neofunctionalized from TrpA. It produces free indole for secondary
    metabolism instead of channelling indole to TrpB for tryptophan, so
    tryptophan synthase activity and tryptophan biosynthesis are not expected
    to hold for this subfamily.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43406/PTHR43406-entries.csv
    supporting_text: >-
      P42390,"Indole-3-glycerol phosphate lyase, chloroplastic",protein,4577,Zea mays
