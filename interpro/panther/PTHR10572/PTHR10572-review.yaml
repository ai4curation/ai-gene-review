family_id: PANTHER:PTHR10572
family_name: 3-HYDROXY-3-METHYLGLUTARYL-COENZYME A REDUCTASE
preferred_name: Class I HMG-CoA reductase family (HMGCR, HMG1/HMG2)
summary: >-
  Class I 3-hydroxy-3-methylglutaryl-CoA reductases reduce HMG-CoA to mevalonate with two NADPH,
  the rate-limiting step of the mevalonate pathway. They are ER membrane enzymes with a sterol-sensing
  membrane domain and a cytosolic catalytic domain. The family contains S. cerevisiae HMG1/HMG2,
  S. pombe hmg1, human HMGCR and plant HMGRs.
functional_coherence: COHERENT
coherence_reason: >-
  All subfamilies are class I HMG-CoA reductases; plant paralogs fall in several subfamilies.
