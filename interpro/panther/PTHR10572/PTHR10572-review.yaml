- node_id: PANTHER:PTN000060347
  asserted_term:
    id: GO:0005778
    label: peroxisomal membrane
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: UniProtKB:P04035
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Peroxisomal membrane at a deep node. The fungal reviews (S. cerevisiae HMG1, HMG2 and S. pombe
    hmg1) remove it, as their HMG-CoA reductases are ER enzymes. Human HMGCR keeps it only as non-core,
    since a peroxisomal pool in mammals is contested. The fungal branch needs an IRD; the term should
    not sit at a node above the fungi.
    In the PANTHER 19.0 tree the node is a Eukaryota speciation node with 232 leaves in 93 species,
    and the single seed, human HMGCR, is 19 steps below it. The term was placed far above its only
    evidence, which agrees with the view that it should not sit above the fungi.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10572/PTHR10572-paint.tsv
    supporting_text: "PTHR10572\tPTN000060347\tGO:0005778\tC\tIBD\tfalse"
  - reference_id: file:genes/yeast/HMG1/HMG1-ai-review.yaml
    supporting_text: >-
      IBA (is_active_in peroxisomal membrane) from node PTN000060347 supported only by human
      HMGCR (P04035), whose peroxisomal localisation is itself debated.
  - reference_id: file:interpro/panther/PTHR10572/PTHR10572-tree-nodes.yaml
    supporting_text: "PTN000060347 GO:0005778 IBD: PAINT node PTN000060347 is a speciation node at Eukaryota, with 232 leaves in 93 species and 13 subfamilies. Seeds: 1 of 1 resolved to leaves of this tree. The single seed leaf PTN002471655 is 19 steps below the PAINT node."
- node_id: PANTHER:PTN000060347
  asserted_term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence: IBD
  paint_snapshot: '20260528'
  seeds:
  - id: AGI_LocusCode:AT1G76490
  - id: MGI:MGI:96159
  - id: PomBase:SPCC162.09c
  - id: SGD:S000004442
  - id: SGD:S000004540
  - id: UniProtKB:P04035
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Long canonical HMGR recipients retain this IBA, but AN1593 is a 416-aa
    secondary-metabolite-cluster HMGR that lacks the N-terminal sterol-sensing membrane
    region and is probably soluble. PTN000060347 therefore needs pruning before the
    AN1593 branch.
    In the PANTHER 19.0 tree the node is a Eukaryota speciation node with 232 leaves, and the 6
    seeds sit in both of its branches, so the node is their common ancestor. Whether the short
    AN1593 paralog lacks the membrane region is a sequence question the tree cannot settle.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10572/PTHR10572-paint.tsv
    supporting_text: "PTHR10572\tPTN000060347\tGO:0005789\tC\tIBD\tfalse"
  - reference_id: file:genes/yeast/HMG1/HMG1-ai-review.yaml
    supporting_text: >-
      IBA ER membrane from PTN000060347 (Arabidopsis HMG1, mouse, S. pombe, human, both yeast isozymes).
  - reference_id: file:interpro/panther/PTHR10572/PTHR10572-tree-nodes.yaml
    supporting_text: "PTN000060347 GO:0005789 IBD: PAINT node PTN000060347 is a speciation node at Eukaryota, with 232 leaves in 93 species and 13 subfamilies. Seeds: 6 of 6 resolved to leaves of this tree. They sit in 2 of the 2 branches below the node, so the node is their common ancestor."
