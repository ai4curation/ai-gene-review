- node_id: PANTHER:PTN000060347
  asserted_term:
    id: GO:0005778
    label: peroxisomal membrane
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: UniProtKB:P04035
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Peroxisomal membrane at a deep node. The fungal reviews (S. cerevisiae HMG1, HMG2 and S. pombe
    hmg1) remove it, as their HMG-CoA reductases are ER enzymes. Human HMGCR keeps it only as non-core,
    since a peroxisomal pool in mammals is contested. The fungal branch needs an IRD; the term should
    not sit at a node above the fungi.
  supported_by:
