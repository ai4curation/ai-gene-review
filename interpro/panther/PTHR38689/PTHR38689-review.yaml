family_id: PANTHER:PTHR38689
family_name: SUCCINATE DEHYDROGENASE HYDROPHOBIC MEMBRANE ANCHOR SUBUNIT
preferred_name: Bacterial succinate dehydrogenase membrane anchor (SdhD) family
summary: >-
  Proteobacterial SdhD subunits (E. coli, Coxiella, Rickettsia, Pseudomonas) of the
  succinate:quinone oxidoreductase (complex II). The three-helix SdhD pairs with SdhC in the
  cytoplasmic membrane to anchor the SdhA/SdhB catalytic head, ligate heme b and form the quinone
  reduction site through which succinate-derived electrons enter the respiratory quinone pool.
  Mitochondrial SDHD/CybS subunits are in PTHR13337.
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF1) of bacterial complex II anchor subunits.
