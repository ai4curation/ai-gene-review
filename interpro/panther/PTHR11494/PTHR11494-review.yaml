family_id: PANTHER:PTHR11494
family_name: CYTOTOXIC T-LYMPHOCYTE PROTEIN
preferred_name: CD28/CTLA-4 costimulatory receptor family (B7-ligand-binding T cell co-receptors)
summary: >-
  Small family of type I transmembrane immunoglobulin-superfamily co-receptors of T
  lymphocytes, comprising the activating costimulatory receptor CD28 (subfamily SF7) and
  the inhibitory checkpoint receptor CTLA-4 (subfamily SF8). Members share the same
  architecture (a single extracellular IgV domain carrying the MYPPPY ligand-binding
  motif, a transmembrane segment, and a short cytoplasmic tail), form disulfide-linked
  homodimers, sit on the external side of the plasma membrane, and bind the same two B7
  ligands, CD80 (B7-1) and CD86 (B7-2), on antigen-presenting cells. What they do with
  that shared ligand engagement is opposite. CD28 delivers "signal 2": its cytoplasmic
  YMNM and PYAP motifs recruit PI3K and GRB2/Lck, amplifying TCR signaling and driving
  IL-2 production, T cell proliferation and activation (coreceptor activity,
  GO:0015026). CTLA-4 binds the same ligands with higher avidity and shuts
  costimulation down: it acts as a ligand-sequestering decoy (receptor decoy activity,
  GO:0140319), removes CD80/CD86 from APCs by transendocytosis, and its YVKM motif
  recruits phosphatases that attenuate TCR-proximal signaling
  (PMID:11279501, PMID:11279502). The family is therefore an object lesson for
  phylogenetic propagation: ligand, topology, localization and direction-neutral
  pathway-participation terms are conserved family-wide, while every
  signaling-direction term (costimulation, positive/negative regulation of T cell
  activation or proliferation, and the two opposite molecular-function terms) is safe
  only within one subfamily. InterPro (IPR040216) counts 1947 proteins in 3 subfamilies
  across 2257 taxa; the reviewed slice contains only mammalian/avian CD28 (SF7) and
  mammalian CTLA4 (SF8) orthologs, so the third subfamily (the broader family is
  usually described as also containing the ICOS-like activating receptors) is not
  represented among reviewed members and is not adjudicated here.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family splits into two clades with opposite signaling signs acting on the same
  ligands: SF7 (CD28) is the activating costimulatory co-receptor that promotes T cell
  activation, proliferation and IL-2 production, while SF8 (CTLA-4) is the inhibitory
  checkpoint that outcompetes CD28 for CD80/CD86, sequesters and transendocytoses the
  ligands, and suppresses T cell responses. Shared, family-safe properties are
  sign-neutral: external side of plasma membrane, B7-ligand binding, participation in
  (and regulation of) TCR-proximal signaling and T cell proliferation. No
  direction-specific activity or regulation term is safe family-wide, and PAINT
  correctly placed all such terms at subfamily-level nodes rather than the family root.
reference_protein:
  id: UniProtKB:P10747
  label: T-cell-specific surface glycoprotein CD28
  gene_symbol: CD28
  organism: Homo sapiens
  gene_review: genes/human/CD28/CD28-ai-review.yaml

subfamilies:
  - subfamily_id: PANTHER:PTHR11494:SF7
    label: T-CELL-SPECIFIC SURFACE GLYCOPROTEIN CD28
    description: >-
      Activating costimulatory receptor clade (amniote CD28 orthologs in the reviewed
      slice: human, mouse, rat, rabbit, cat, bovine, chicken). Constitutively expressed
      on T cells; delivers signal 2 via PI3K/GRB2 recruitment on TCR engagement.
    representative_members:
      - id: UniProtKB:P10747
        label: T-cell-specific surface glycoprotein CD28
        gene_symbol: CD28
        organism: Homo sapiens
        gene_review: genes/human/CD28/CD28-ai-review.yaml
  - subfamily_id: PANTHER:PTHR11494:SF8
    label: CYTOTOXIC T-LYMPHOCYTE PROTEIN 4
    description: >-
      Inhibitory checkpoint clade (mammalian CTLA-4 orthologs in the reviewed slice:
      human, mouse, rabbit, pig, dog). Induced on activated T cells and constitutive on
      Tregs; higher-avidity CD80/CD86 binding, ligand sequestration and
      transendocytosis, SHP-2/PP2A recruitment.
    representative_members:
      - id: UniProtKB:P16410
        label: Cytotoxic T-lymphocyte protein 4
        gene_symbol: CTLA4
        organism: Homo sapiens
        gene_review: genes/human/CTLA4/CTLA4-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      Signaling sign is inverted relative to the CD28 clade despite identical ligands
      and domain architecture: CTLA-4 members antagonize the costimulation that CD28
      members deliver, acting as decoy/inhibitory receptors (GO:0140319) that
      negatively regulate T cell activation and proliferation. Activating terms
      (T cell costimulation, coreceptor activity, positive regulation of T cell
      proliferation/activation) must not descend into this clade.

node_assessments:
  # --- PTN000160996: CTLA-4 (SF8) clade node, Amniota ---
  - node_id: PANTHER:PTN000160996
    asserted_term:
      id: GO:0045590
      label: negative regulation of regulatory T cell differentiation
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20190116"
    seeds:
      - id: UniProtKB:P16410
        label: Cytotoxic T-lymphocyte protein 4
        gene_symbol: CTLA4
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Placed on the CTLA-4 clade node, so the IBA descends only to SF8 members (human
      CD28 receives no GO:0045590 IBA), which is the correct scoping. The single seed
      is human CTLA4's own IDA (PMID:18641304, CTLA-4 expression rather than FoxP3
      tracks acquisition of suppressive function by activated CD4+CD25- T cells) — the
      target appearing among its own IBA sources is the expected marker that direct
      experimental grounding exists, not circularity. The human CTLA4 gene review
      retains both the IDA and the resulting IBA (ACCEPT). Single-paper seeding from
      one human study makes this the thinnest of the sound placements, but the claim is
      consistent with CTLA-4's established role in tuning Treg biology.
  - node_id: PANTHER:PTN000160996
    asserted_term:
      id: GO:0050853
      label: B cell receptor signaling pathway
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20190116"
    seeds:
      - id: UniProtKB:P16410
        label: Cytotoxic T-lymphocyte protein 4
        gene_symbol: CTLA4
        organism: Homo sapiens
    assessment: WRONG_NODE
    assessment_reason: >-
      The only seed is human CTLA4's IMP from PMID:17875758, a correlative
      gene-expression study of CTLA4 in B-cell chronic lymphocytic leukemia (high vs
      low CD38 CLL) that does not demonstrate a mechanistic role for CTLA-4 in BCR
      signaling. The human CTLA4 gene review marks both the seed IMP and the reflected
      IBA MARK_AS_OVER_ANNOTATED: CTLA-4 is a T cell co-inhibitory receptor, and no
      member of the clade has an established function in the B cell receptor signaling
      pathway. Asserting an ancestral amniote BCR-signaling function for the CTLA-4
      clade from this evidence is unsupported at any node; the IBD should be withdrawn
      rather than re-placed. This is the genuine failure mode the seed-in-own-WITH
      pattern can hide: the sole experimental grounding is itself an over-annotation,
      so the IBA launders a weak IMP into a phylogenetic claim.
    affected_subfamilies:
      - id: PANTHER:PTHR11494:SF8
        label: CYTOTOXIC T-LYMPHOCYTE PROTEIN 4

  # --- PTN000161013: CD28 (SF7) clade node, Amniota ---
  - node_id: PANTHER:PTN000161013
    asserted_term:
      id: GO:0031295
      label: T cell costimulation
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20190116"
    seeds:
      - id: MGI:MGI:88327
        gene_symbol: Cd28
        organism: Mus musculus
      - id: RGD:2299
        gene_symbol: Cd28
        organism: Rattus norvegicus
    assessment: SOUND
    assessment_reason: >-
      T cell costimulation is the defining function of the CD28 clade, and the IBD is
      correctly placed on the SF7 node rather than the family root: the resulting IBA
      reaches human CD28 (which ACCEPTs it as its core biological process) and does NOT
      descend to CTLA-4, whose function is to antagonize costimulation. Seeded from
      mouse and rat Cd28 experimental annotations. This node placement is the family's
      key correct sign-scoping decision.
  - node_id: PANTHER:PTN000161013
    asserted_term:
      id: GO:0042102
      label: positive regulation of T cell proliferation
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20250902"
    seeds:
      - id: MGI:MGI:88327
        gene_symbol: Cd28
        organism: Mus musculus
      - id: UniProtKB:P10747
        label: T-cell-specific surface glycoprotein CD28
        gene_symbol: CD28
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Direction-specific positive-regulation term correctly confined to the activating
      CD28 clade; CTLA-4 members, which negatively regulate T cell proliferation
      (human CTLA4 carries GO:0042130), do not inherit it. Seeded by mouse Cd28 and
      human CD28's own experimental annotations (human CD28 has multiple IDA/TAS rows
      for this term, all retained ACCEPT in the gene review). Refreshed 2025-09-02, so
      the placement reflects current PAINT curation.
  - node_id: PANTHER:PTN000161013
    asserted_term:
      id: GO:0042110
      label: T cell activation
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20250902"
    seeds:
      - id: MGI:MGI:88327
        gene_symbol: Cd28
        organism: Mus musculus
      - id: UniProtKB:P10747
        label: T-cell-specific surface glycoprotein CD28
        gene_symbol: CD28
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Sound on the CD28 clade node: CD28 engagement is a proximate driver of T cell
      activation (human CD28 has IDA and IGI experimental support, retained ACCEPT).
      Keeping even this nominally direction-neutral process term off the family root is
      defensible caution, since CTLA-4 members act to terminate rather than effect
      T cell activation (human CTLA4 instead carries GO:0050868, negative regulation of
      T cell activation).

  # --- PTN002608477: family root node, Euteleostomi ---
  - node_id: PANTHER:PTN002608477
    asserted_term:
      id: GO:0009897
      label: external side of plasma membrane
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20190116"
    seeds:
      - id: MGI:MGI:88327
        gene_symbol: Cd28
        organism: Mus musculus
      - id: MGI:MGI:88556
        gene_symbol: Ctla4
        organism: Mus musculus
      - id: UniProtKB:P10747
        label: T-cell-specific surface glycoprotein CD28
        gene_symbol: CD28
        organism: Homo sapiens
      - id: UniProtKB:P16410
        label: Cytotoxic T-lymphocyte protein 4
        gene_symbol: CTLA4
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      The one property that is genuinely sign-neutral and family-wide: all members are
      type I transmembrane receptors whose IgV ligand-binding domain faces the
      extracellular space. Seeded from both clades (mouse and human CD28 and CTLA-4),
      asserted at the family root, and inherited by both human genes, whose reviews
      ACCEPT the IBAs alongside direct IDA evidence. Model PAINT placement.
  - node_id: PANTHER:PTN002608477
    asserted_term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20190116"
    seeds:
      - id: MGI:MGI:88327
        gene_symbol: Cd28
        organism: Mus musculus
    assessment: SOUND
    assessment_reason: >-
      "Involved in TCR signaling pathway" is direction-neutral participation, and both
      clades genuinely participate: CD28 amplifies TCR-proximal signaling (Lck
      recruitment, lowered activation threshold), while CTLA-4 modulates the same
      pathway negatively via ligand competition and phosphatase recruitment — human
      CTLA4's own IDA record for GO:0050860 (negative regulation of TCR signaling)
      independently confirms pathway involvement on the inhibitory side. Both human
      gene reviews ACCEPT the resulting IBAs. The seed list (mouse Cd28 alone) is thin
      and one-clade-sided, but the placement survives because the term asserts
      participation, not sign; any child term with a direction (GO:0050862 positive /
      GO:0050860 negative regulation) would have to be placed per-subfamily instead.

term_assessments:
  - assessed_term:
      id: GO:0009897
      label: external side of plasma membrane
    scope: FAMILY_WIDE
    scope_reason: >-
      Shared topology of every member: single-pass type I receptors displaying an IgV
      domain extracellularly. Both human gene reviews retain the term on IBA, IDA and
      IEA evidence.
  - assessed_term:
      id: GO:0050852
      label: T cell receptor signaling pathway
    scope: FAMILY_WIDE
    scope_reason: >-
      Direction-neutral pathway participation holds for both clades: CD28 as a positive
      amplifier of TCR-proximal signaling, CTLA-4 as its negative modulator. Both human
      gene reviews ACCEPT the term. Direction-specific children (GO:0050862, GO:0050860)
      are strictly per-subfamily.
  - assessed_term:
      id: GO:0042129
      label: regulation of T cell proliferation
    scope: FAMILY_WIDE
    scope_reason: >-
      The sign-neutral parent is the deepest safe proliferation term: CD28 positively
      and CTLA-4 negatively regulate T cell proliferation, and both human reviews
      ACCEPT this term. Its signed children are subfamily-only (see GO:0042102).
  - assessed_term:
      id: GO:0031295
      label: T cell costimulation
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Costimulation is the defining function of the activating CD28 clade only.
      Propagating it family-wide would invert CTLA-4 biology — CTLA-4 exists to
      terminate costimulation by outcompeting CD28 for CD80/CD86 and removing the
      ligands by transendocytosis. PAINT correctly asserts this at the SF7 node
      (PTN000161013), not the family root.
    applicable_subfamilies:
      - id: PANTHER:PTHR11494:SF7
        label: T-CELL-SPECIFIC SURFACE GLYCOPROTEIN CD28
  - assessed_term:
      id: GO:0042102
      label: positive regulation of T cell proliferation
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Signed regulation term safe only in the CD28 clade; CTLA-4 members carry the
      opposite sign (human CTLA4 retains GO:0042130, negative regulation of T cell
      proliferation).
    applicable_subfamilies:
      - id: PANTHER:PTHR11494:SF7
        label: T-CELL-SPECIFIC SURFACE GLYCOPROTEIN CD28
  - assessed_term:
      id: GO:0042110
      label: T cell activation
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Kept to the CD28 clade, matching the PAINT node placement: CD28 effects T cell
      activation, whereas CTLA-4 members negatively regulate it (human CTLA4 retains
      GO:0050868 instead and has no GO:0042110 annotation).
    applicable_subfamilies:
      - id: PANTHER:PTHR11494:SF7
        label: T-CELL-SPECIFIC SURFACE GLYCOPROTEIN CD28
  - assessed_term:
      id: GO:0015026
      label: coreceptor activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The activating molecular function — acting with the TCR to potentiate signaling
      via PI3K/GRB2 recruitment — belongs to the CD28 clade (core function of the human
      CD28 review). CTLA-4 engages the same ligands but does not co-transduce an
      activating signal with the TCR; its MF is decoy/inhibitory (GO:0140319,
      GO:0030547). If PAINT ever adds a molecular-function IBD to this family (none
      exists as of the cached 2025-09-02 slice), this term belongs at the SF7 node
      only.
    applicable_subfamilies:
      - id: PANTHER:PTHR11494:SF7
        label: T-CELL-SPECIFIC SURFACE GLYCOPROTEIN CD28
  - assessed_term:
      id: GO:0140319
      label: receptor decoy activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The inhibitory molecular function — higher-avidity binding and sequestration of
      CD80/CD86 away from CD28, extended by transendocytosis — is the core function of
      the CTLA-4 clade (human CTLA4 IDA from the CTLA-4/B7 crystal-structure papers,
      PMID:11279501 and PMID:11279502) and is false for CD28, the very receptor the
      decoy deprives of ligand. A future MF IBD for this term belongs at the SF8 node
      only.
    applicable_subfamilies:
      - id: PANTHER:PTHR11494:SF8
        label: CYTOTOXIC T-LYMPHOCYTE PROTEIN 4
  - assessed_term:
      id: GO:0050853
      label: B cell receptor signaling pathway
    scope: NOT_APPLICABLE
    scope_reason: >-
      No member has an established function in BCR signaling. The sole experimental
      basis anywhere in the family is human CTLA4's IMP from a correlative B-CLL
      expression study (PMID:17875758), which the CTLA4 gene review marks
      MARK_AS_OVER_ANNOTATED; the PTN000160996 IBD built on it is assessed WRONG_NODE
      above and should be withdrawn rather than rescoped.

references:
  - id: PMID:11279501
    title: Structural basis for co-stimulation by the human CTLA-4/B7-2 complex.
  - id: PMID:11279502
    title: Crystal structure of the B7-1/CTLA-4 complex that inhibits human immune responses.
  - id: PMID:17875758
    title: ATM, CTLA4, MNDA, and HEM1 in high versus low CD38 expressing B-cell chronic lymphocytic leukemia.
  - id: PMID:18641304
    title: Acquisition of suppressive function by activated human CD4+ CD25- T cells is associated with the expression of CTLA-4 not FoxP3.

review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Written for the PAINT human no-IBA project (deferred from the 2026-09-04 batch by the
  InterPro API outage; cached data refetched 2026-09-04). All node ids, seeds, taxa and
  snapshot dates are verbatim from PTHR11494-paint.tsv; subfamily membership and member
  spread from PTHR11494-entries.csv; counts from PTHR11494-metadata.yaml. On the
  project's central question: the "no-IBA" classification of human CD28 and CTLA4 is
  STALE SOURCE-LIST DATA, not node scoping or pruning — the cached goa.tsv files show
  both genes currently receiving IBAs from all three PAINT nodes (CD28: GO:0031295,
  GO:0042102, GO:0042110, GO:0009897, GO:0050852; CTLA4: GO:0045590, GO:0050853,
  GO:0009897, GO:0050852), two of them refreshed 2025-09-02. The real, narrower gap
  matches the pattern seen across this batch: the family has NO molecular-function IBD
  at any node, so neither human gene gets an MF IBA — the sign-split MF terms
  (GO:0015026 for SF7, GO:0140319 for SF8) recorded in term_assessments are the
  propagation-safe candidates for a PAINT curator to add at the subfamily nodes. Aside
  from the GO:0050853 mis-seeded IBD (WRONG_NODE; recommend withdrawal), PAINT's
  handling of this family is exemplary: every direction-specific term sits on a
  subfamily node and only sign-neutral terms sit at the Euteleostomi root. MGI/RGD seed
  identities (MGI:88327 = mouse Cd28, MGI:88556 = mouse Ctla4, RGD:2299 = rat Cd28)
  were inferred from which clade node each seed supports in the cached goa.tsv WITH
  fields, consistent with the MODs' own symbol assignments. No residue_sites: the
  functional split is a cytoplasmic-motif and avidity difference between intact
  receptors, not a point-residue gain/loss adjudicable by a site rule.
