  name:
    name: Cell Cycle and Developmental Transcription Regulators
    short: CC-Dev_Transcription_Reg
  description:
  - text: This family of proteins includes transcription factors that are involved
      in essential regulatory roles within the cell. Members of this family are necessary
      for the progression of the cell cycle from G1 to S phase, indicating a role
      in cell division and proliferation. Additionally, some members function as transcriptional
      repressors and are crucial for the development of the central nervous system,
      as well as for the specification of various cell types during embryonic development.
      They are known to interact with other proteins, such as ATXN1 and ATXN1L, to
      mediate developmental processes and contribute to patterning in organisms. These
      proteins also have roles in dorsoventral patterning and the specification of
      intervein areas during wing development.
