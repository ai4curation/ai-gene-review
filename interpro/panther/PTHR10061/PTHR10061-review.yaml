family_id: PANTHER:PTHR10061
family_name: S-FORMYLGLUTATHIONE HYDROLASE
preferred_name: S-formylglutathione hydrolase (FrmB/YeiG/ESD) family
summary: >-
  S-formylglutathione hydrolases release formate and glutathione from S-formylglutathione, the last
  step of glutathione-dependent formaldehyde detoxification. The family contains bacterial FrmB/FghA
  and the YeiG paralog (two PANTHER subfamilies), S. cerevisiae YJL068C, and human esterase D (ESD).
functional_coherence: COHERENT
coherence_reason: >-
  Both subfamilies (SF0, FrmB/ESD-type; SF1, YeiG-type) contain characterized S-formylglutathione
  hydrolases: E. coli FrmB (SF0) and YeiG (SF1) were purified and both prefer S-formylglutathione,
  with a Ser-His-Asp triad required for YeiG activity; human ESD (SF0) is the red-cell
  S-formylglutathione hydrolase, and yeast YJL068C (SF0) was purified as one. The esterase activity
  toward short-chain p-nitrophenyl esters, alpha-naphthyl acetate and 4-methylumbelliferyl acetate
  is a shared secondary property of the active site, not a divergent function.
