  name:
    name: Major Facilitator Superfamily Trehalose Transporter
    short: MFS_Trehalose_Transporter
  description:
  - text: The Major Facilitator Superfamily (MFS) Trehalose Transporter subfamily
      consists of proteins that function primarily as facilitative transporters for
      trehalose, a disaccharide sugar. Members of the family mediate the bidirectional
      transfer of trehalose across cell membranes, without transporting other sugars
      such as maltose, sucrose, or lactose. These transporters are responsible for
      the distribution of trehalose synthesized in the fat body to other tissues,
      which is crucial for regulating trehalose levels in the hemolymph and providing
      a carbon source for cellular metabolism. Some members within the family have
      been identified as high-capacity transporters, while others have low-capacity
      transport capabilities. Additionally, there are homologs that fail to transport
      trehalose, suggesting a potential divergence in function or regulation within
      the family.
