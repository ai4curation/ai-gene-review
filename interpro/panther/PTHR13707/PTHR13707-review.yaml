family_id: PANTHER:PTHR13707
family_name: KETOACID-COENZYME A TRANSFERASE
preferred_name: Family I CoA-transferases (SCOT/OXCT, AtoDA, ScoAB, CtfAB, PcaIJ) and the IpdAB hydrolases
summary: >-
  Family I CoA-transferases move coenzyme A from a donor acyl-CoA (usually
  succinyl-CoA or acetyl-CoA) to a carboxylic acid acceptor through a covalent
  glutamyl-CoA thioester intermediate. In bacteria the enzyme is a heteromer of
  separately encoded alpha (A) and beta (B) subunits: AtoD/AtoA acetoacetyl-CoA
  transferase of Escherichia coli, ScoA/ScoB succinyl-CoA:3-oxoacid
  CoA-transferases of Bacillus, Helicobacter and Mycobacterium, CtfA/CtfB of
  solventogenic Clostridium, and the PcaI/PcaJ 3-oxoadipate:succinyl-CoA
  transferase of the beta-ketoadipate pathway in Pseudomonas and Acinetobacter.
  In eukaryotes the two halves are fused into one polypeptide, the
  mitochondrial succinyl-CoA:3-ketoacid CoA-transferase (SCOT; human OXCT1 and
  the testis-specific OXCT2) that activates acetoacetate in extrahepatic
  ketone-body utilization. The family shares the CoA-transfer chemistry but
  differs in donor and acceptor specificity by clade, and one clade (IpdAB of
  steroid-degrading Actinobacteria) has lost CoA transfer altogether and acts as
  a CoA-thioester ring-cleaving hydrolase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Generic CoA-transferase chemistry is shared by almost all members, but the
  specific activities are clade-restricted: succinyl-CoA:3-oxoacid transfer to
  acetoacetate in eukaryotic SCOT (SF23, SF28, SF30) and bacterial ScoAB;
  acetoacetyl-CoA:acetate/butyrate transfer in AtoDA and CtfAB; and
  3-oxoadipate:succinyl-CoA transfer in PcaIJ. The bacterial A- and B-type
  subunits fall into SF60 and SF57, but these subfamilies lump all of these
  substrate specificities together and do not even separate subunit types
  cleanly (Acinetobacter PcaJ, a B subunit, is placed in SF60 with the A
  subunits). IpdAB (Rhodococcus IpdA is in SF57) has diverged into a
  hydrolase.
