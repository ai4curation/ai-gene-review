  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node carries no taxon restriction and is seeded by both eukaryotic SCOTs
    and bacterial AtoD, so it is placed at or near the family root. Generic
    CoA-transferase activity is the right claim for almost every descendant:
    SCOT, AtoDA, ScoAB, CtfAB and PcaIJ all transfer CoA, and the reviewed
    PcaI/PcaJ recipients keep the term (as a true but uninformative parent of
    3-oxoadipate CoA-transferase activity). The IpdAB clade of steroid-degrading
    Actinobacteria is the exception: IpdAB has no CoA-transferase activity,
    lacks the beta-subunit catalytic glutamate, and acts as a hydrolase. It
    needs an IRD below this node. A further caveat is that for the two-subunit
    bacterial enzymes the activity belongs to the heteromer, so each subunit
    contributes to rather than independently enables it.
