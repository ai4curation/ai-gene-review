notes: >-
  Module consistency: beta_ketoadipate_lower_pathway grounds PcaI and PcaJ with
  NCBIfam TIGR02429/TIGR02428 rather than this family, because SF60/SF57 do not
  separate the PcaIJ 3-oxoadipate CoA-transferase from other bacterial family I
  CoA-transferases. The OXCT1 E344 / PcaJ E50 positions follow the UniProt
  PROSITE-ProRule active-site features. The IpdB negative-control position
  (Asp58 of M. tuberculosis Rv3552) is from a BLOSUM62 global pairwise
  alignment to P. putida PcaJ, in which PcaJ Glu50 of the S-E-N-G motif aligns
  to IpdB Asp58 (A-D-T-P); it agrees with the published statement that IpdAB
  lacks the beta-subunit catalytic glutamate.
