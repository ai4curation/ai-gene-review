residue_sites:
- site_id: catalytic_glutamate
  label: Glutamate forming the enzyme-CoA thioester intermediate
  description: >-
    The active-site glutamate whose side chain is acylated by CoA during
    ping-pong CoA transfer, in the conserved S-E-N-G motif of the beta-type
    (B subunit, or C-terminal SCOT) domain. It is Glu344 in human OXCT1 and
    Glu50 in the PcaJ B subunits of P. putida and A. baylyi. The IpdAB
    hydrolases lack it, which is the residue-level mark of their loss of
    CoA-transferase activity.
  anchor:
    id: UniProtKB:P55809
    label: OXCT1
    organism: Homo sapiens
  anchor_sequence_version: 1
  site_source: UNIPROT_FEATURE
  residues:
  - position: 344
    expected: [E]
    role: nucleophile forming the glutamyl-CoA thioester intermediate
  required_for:
  - term:
      id: GO:0008410
      label: CoA-transferase activity
    strength: REQUIRED
    rationale: >-
      Family I CoA transfer proceeds through a covalent glutamyl-CoA thioester
      on this residue; a member lacking it (IpdAB) has no CoA-transferase
      activity and no trapped glutamyl-CoA intermediate.
    supported_by:
    - reference_id: PMID:29581275
      supporting_text: >-
        IpdAB lacks the catalytic glutamate residue that
        is conserved in the β-subunit of characterized CoTs and a glutamyl-CoA
        intermediate was not trapped during turnover.
