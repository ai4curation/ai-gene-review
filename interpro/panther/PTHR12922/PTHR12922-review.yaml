  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Placement at the eukaryotic node is right; one leaf needs pruning. PTN000308947 is the speciation node
    labelled Eukaryota, with 126 leaves in 95 species, whose two children are Unikonts (PTN000308948, 52
    leaves) and Bikonts (PTN007596842, 74 leaves); its only sister is the Gloeobacter leaf, which the IBD
    correctly leaves out. The single seed, human COQ4, has direct evidence from two independent studies:
    it complements the decarboxylation defect of E. coli lacking UbiD, and the purified protein
    decarboxylates the substrate in a zinc-dependent reaction. A single seed is enough here because the
    family has no ancient duplication (all 19 duplication nodes are lineage-specific) and the residues the
    activity depends on are inherited throughout: the zinc ligands of human COQ4 (H163, D164, H167, E179;
    UniProt Q9Y3A0 sequence version 3) are matched at the same PANTHER alignment columns in 118 of 126
    leaves under the node, including S. cerevisiae (H210 D211 H214 E226), S. pombe (H174 D175 H178 E190),
    C. elegans (H133 D134 H137 E149), Drosophila (H171 D172 H175 E187), Dictyostelium, Arabidopsis
    (H127 D128 H131 E143), Chlamydomonas, Plasmodium falciparum and Trypanosoma brucei, and in the
    reconstructed ancestral sequence of the node. Function on the bikont side is supported by Arabidopsis
    COQ4 restoring coenzyme Q synthesis in S. pombe lacking coq4. The leaf to prune is C. briggsae
    coq-4.2 (C0HL94, leaf PTN007596841), one of two C. briggsae in-paralogs under duplication node
    PTN007596840. Its PANTHER row is identical to the current UniProt sequence (155 residues, against 227
    for coq-4.1 and 231 for C. elegans coq-4), it has H133, D134 and H137 but glycine (G149) at the
    glutamate column, and its branch length is 2 against 0.061 for coq-4.1. The glutamate is needed: yeast
    E226K (coq4-1) abolishes coenzyme Q synthesis, and human D164A, tested alone and with E179A, abolishes
    zinc binding. UniProt already cautions that coq-4.2 may be non-functional, yet GOA carries the IBA for
    it. Seven other leaves deviate at these columns but need no PAINT action: bovine Q05B52 is an artefact
    of the sequence PANTHER aligned (the current UniProt sequence has HDMLHALLGMPTNILGE at 163), and the
    rest are unreviewed plant or tick gene models that are short (90 to 209 residues) or deleted from
    UniProt, each with at least one intact paralog in the same species; they are probable fragments or
    pseudogenes and no claim is made about them.
