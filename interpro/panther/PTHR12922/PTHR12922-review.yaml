  assessment: SOUND
  assessment_reason: >-
    Sound for the clade it covers. PTN000308948 is the speciation node labelled Unikonts (52 leaves in 49
    species: 50 opisthokont and 2 Dictyostelium), the common ancestor of the three seeds, each of which
    has direct evidence (S. pombe Coq4-GFP in mitochondria; S. cerevisiae Coq4 on the matrix face of the
    inner membrane; human COQ4 by IDA), and mouse Coq4 has independent mitochondrial proteomics evidence.
    The node is, however, lower than the evidence now allows: this row stops one node below the
    molecular-function and process rows, so the 74 bikont leaves get the activity and the process but no
    location. Trypanosoma brucei COQ4 (Q382H9), a bikont leaf outside this node, carries experimental
    mitochondrion annotations (IDA and HTP, from the genome-wide tagging map), and Arabidopsis COQ4
    complements S. pombe without an added targeting signal, unlike Arabidopsis COQ6 in the same study. Moving this IBD up to PTN000308947
    (Eukaryota) would be justified; the schema has no verdict for a placement that is too shallow, so the
    row is recorded as SOUND and the suggestion is made in the notes. The shortened C. briggsae coq-4.2
    also inherits this row; its location is unknown and no residue evidence bears on it.
