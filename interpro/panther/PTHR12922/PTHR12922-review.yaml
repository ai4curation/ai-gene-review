  required_for:
  - term:
      id: GO:0120539
      label: 4-hydroxy-3-methoxy-5-polyprenylbenzoate decarboxylase activity
    strength: CONTRIBUTES
    rationale: >-
      Recorded as CONTRIBUTES, not REQUIRED, only because no natural family member lacking the motif has
      been assayed, so the site has no verified negative control; the mutagenesis itself points to a hard
      requirement. The decarboxylation is zinc-dependent and the motif is the zinc site: purified human COQ4 is
      activated specifically by zinc salts, the D164A substitution leaves a folded protein that cannot
      bind zinc, cannot complement yeast lacking COQ4 and only marginally restores CoQ10 in COQ4-deleted human
      cells, and the yeast substitution of the motif glutamate (E226K) abolishes coenzyme Q synthesis
      without destabilising the COQ complex.
    supported_by:
    - reference_id: PMID:38295803
      supporting_text: The D164A mutant was unable to complement respiratory growth in ΔCOQ4 yeast (Fig
        S2E) and the protein was virtually unable to bind zinc (Fig 2A).
    - reference_id: PMID:38425362
      supporting_text: Out of the currently known COQ proteins, COQ4 is the only system that possesses a
        canonical Zn-binding motif
    - reference_id: file:yeast/COQ4/COQ4-uniprot.txt
      supporting_text: "E->K: In COQ4-1; abolishes coenzyme Q biosynthesis, but does not affect stability of other COQ polypeptides."
