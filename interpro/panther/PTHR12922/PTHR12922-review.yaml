  assessment_reason: >-
    Placement is right; the same single leaf needs pruning. The four seeds are loss-of-function or direct
    evidence for coenzyme Q synthesis in S. pombe (IMP, deletion makes no CoQ), S. cerevisiae (IMP),
    C. elegans (IMP, RNAi lowers Q9) and human (IDA and IMP), all in the opisthokont half of the tree. The
    curator placed the term one node above their common ancestor, at Eukaryota (PTN000308947), which
    extends it to the 74 bikont leaves. That extension is supported: Arabidopsis COQ4 restores CoQ10
    production in S. pombe lacking coq4, the zinc-binding motif is intact across plants, alveolates,
    stramenopiles and trypanosomatids, and COQ4 homologues are reported in virtually all eukaryotes. The
    Gloeobacter outgroup is correctly excluded: it has no experimental data. C. briggsae coq-4.2 (C0HL94,
    leaf PTN007596841) receives this IBA but lacks the motif glutamate and about a third of the protein;
    yeast COQ4 with the equivalent glutamate substituted (E226K) makes no coenzyme Q although the other
    COQ polypeptides remain stable, so a COQ4 without this residue is not expected to support the pathway.
    PAINT prunes per term, so the loss is requested here separately from the decarboxylase row.
