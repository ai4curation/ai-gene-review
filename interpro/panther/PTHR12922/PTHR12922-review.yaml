family_id: PANTHER:PTHR12922
family_name: UBIQUINONE BIOSYNTHESIS PROTEIN
preferred_name: COQ4 family
summary: >-
  COQ4 is a zinc-binding protein of the mitochondrial CoQ synthome. It decarboxylates the 4-hydroxy-3-methoxy-5-polyprenylbenzoate
  intermediate of eukaryotic ubiquinone synthesis and organizes the COQ complex (S. cerevisiae COQ4,
  S. pombe coq4, human COQ4).
