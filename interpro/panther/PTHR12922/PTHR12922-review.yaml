residue_sites:
- site_id: zn_motif
  label: Zinc-binding HDxxH(x)11E motif
  description: >-
    The four zinc ligands UniProt records for human COQ4, read against Q9Y3A0 sequence version 3, where
    they form HDMLHTLLGMPTNILGE (163-179). In the PANTHER family alignment they sit at columns 391, 392,
    395 and 467. H163, D164 and H167 are each the majority residue in 121 of 127 leaves. Positions in other
    proteins are each protein's own numbering, read from its row of the PANTHER alignment.
