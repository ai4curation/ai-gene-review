family_id: PANTHER:PTHR12922
family_name: UBIQUINONE BIOSYNTHESIS PROTEIN
preferred_name: COQ4 family
summary: >-
  COQ4 proteins are zinc-dependent enzymes of eukaryotic ubiquinone (coenzyme Q) biosynthesis. Human
  COQ4 decarboxylates the C1 carbon of the 4-hydroxy-3-methoxy-5-polyprenylbenzoate intermediate, the
  step done in Escherichia coli by the unrelated UbiD, and is a subunit of the COQ complex on the matrix
  face of the mitochondrial inner membrane; whether COQ4 or COQ6 performs the following C1 hydroxylation
  is disputed. The family is a single-copy orthologous group across eukaryotes (animals, fungi,
  Dictyostelium, plants, alveolates, stramenopiles, trypanosomatids), with one cyanobacterial homolog as
  outgroup. All members with a complete sequence share the zinc-binding motif HDxxH(x)11E.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  One orthologous group with no ancient duplication: in the PANTHER 19 tree (127 leaves) the eukaryotic
  node PTN000308947 holds 126 leaves and all 19 duplication nodes are lineage-specific (one or a few
  species each). Function is established by experiment in human, S. cerevisiae, S. pombe and
  C. elegans, and human and Arabidopsis COQ4 both restore coenzyme Q synthesis in an S. pombe coq4
  deletion. The zinc-binding motif residues of human COQ4 (H163, D164, H167, E179) are present at the
  aligned columns in 118 of the 126 eukaryotic leaves of the PANTHER alignment and in the
  cyanobacterial outgroup. The exceptions are not a diverged subfamily: C. briggsae coq-4.2 (C0HL94) is a
  shortened in-paralog with glycine at the glutamate column, one Musa gene model (A0A804ILA9) lacks the
  motif, five are short gene-model fragments or entries since deleted from UniProt, and bovine Q05B52
  deviates only because PANTHER aligned a 151-residue sequence that is not the current UniProt sequence,
  which has the motif. PANTHER's two subfamilies carry the same name; SF9 is three Brassica in-paralogs
  with an intact motif. The single bacterial leaf (Gloeobacter violaceus Q7NKR1) keeps the motif but has
  no experimental data and lies outside every PAINT assertion.
