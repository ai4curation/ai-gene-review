term_assessments:
- assessed_term:
    id: GO:0004601
    label: peroxidase activity
  scope: UNRESOLVED
  scope_reason: 'The human DUOX1 record explicitly records conflicting studies: an isolated peroxidase-like
    domain showed activity in one study (PMID:11514595), whereas a later study found no heme binding or
    intrinsic peroxidase activity (PMID:19460756). Thus the inference is contested by experimental evidence,
    not merely unsupported by the domain label. The broad NOX/ferric-reductase family cannot carry this
    activity universally; species, construct and heme incorporation must be resolved.'
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-b.json
    supporting_text: However, another study showed that the isolated peroxidase-like domain does not bind
      heme and has no intrinsic peroxidase activity
node_assessments:
- node_id: PANTHER:PTN001379754
  asserted_term:
    id: GO:0000293
    label: ferric-chelate reductase activity
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN000944413
    label: PTN000944413 (ancestral IBD node; IRD source)
  paint_snapshot: '20181121'
  node_taxon:
    id: NCBITaxon:3702
    label: Arabidopsis thaliana
  assessment: LOSS_CONTRADICTED
  assessment_reason: >-
    The IRD node is a single leaf, Arabidopsis FRO6 (Q8RWS6, At5g49730, subfamily SF69), and it blocks
    the ferric-chelate reductase IBD placed at the embryophyte node PTN000944413, whose seeds include
    the tandem paralog FRO7 (At5g49740). FRO6 and FRO7 are 87% identical and differ only in their N
    termini (FRO7 carries the stronger plastid transit peptide), so a sequence-level loss of catalysis
    in FRO6 alone is not expected. The full-text study behind the TAIR IDA expressed FRO6 in yeast and
    measured up to 5-fold more plasma-membrane Fe(III) chelate reductase activity than vector controls,
    concluding that FRO6 encodes a functional Fe(III) chelate reductase; FRO6-GFP sits on the plasma
    membrane, so it differs from FRO7 in location rather than activity. The IRD (2018 snapshot, older
    than the 2021 IBD refresh) should be retracted so that FRO6 inherits GO:0000293. No affected
    subfamily is listed because the error is the negation itself.
  supported_by:
  - reference_id: PMID:18647837
    supporting_text: FRO6 -expressing cells showed up to 5-fold more Fe(III) chelate reductase activity
      than cells transformed with an empty vector
  - reference_id: PMID:18647837
    supporting_text: our result demonstrates that FRO6 encodes a functional Fe(III) chelate reductase
  - reference_id: PMID:18647837
    supporting_text: The proteins show 87% identity and 91% similarity, with the only variable region
      limited to their N termini
- node_id: PANTHER:PTN002279285
  asserted_term:
    id: GO:0016175
    label: superoxide-generating NAD(P)H oxidase activity
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN000239644
    label: PTN000239644 (ancestral IBD node; IRD source)
  paint_snapshot: '20230405'
  node_taxon:
    id: NCBITaxon:451864
    label: Dikarya
  assessment: LOSS_TOO_BROAD
  assessment_reason: >-
    In the upstream PANTHER IBD.gaf, the ancestral GO:0016175 IBD at PTN000239644 (dated 20230405)
    has a single seed, SGD:S000003128, which is S. cerevisiae AIM14/YNO1 (P53109). The IRD at
    PTN002279285 has the same date and covers a 42-leaf Dikarya clade of FRE-like proteins that
    contains AIM14 itself (leaf PTN000944297). The leaf IBA GAF confirms that P53109 receives no
    GO:0016175 IBA. Fungal NoxA/NoxB-type proteins (e.g. Neurospora NCU02020, Ustilago UMAG_11604)
    sit outside the clade and still inherit the term. As drawn, the loss removes the activity from
    the only protein whose experimental evidence placed it, so the PAINT pair is internally
    inconsistent. Most leaves of the clade are in ferric/cupric reductase subfamilies (SF178 FRE8-related,
    SF192 FRE1-related including S. pombe frp1/frp2, and the uncharacterised FR-type SF142, SF169
    and SF200). None of them has experimental evidence for NADPH-dependent superoxide generation, so a
    loss is plausible for them. The SF198 METALLOREDUCTASE AIM14-RELATED branch (S. cerevisiae
    AIM14/YNO1, Eremothecium AIM14 Q754F4 and Candida C2_03530W) is the exception. The SGD IMP for
    Yno1 rests on a study reporting an ER-localized genuine NADPH oxidase that produces superoxide in
    an NADPH-dependent manner. Only the abstract is cached, so the assay details cannot be checked here,
    and per curation policy the experimental annotation is not overruled. The loss is therefore too
    broad. It should be moved below this node onto the FRE ferric-reductase branches, leaving the
    Yno1/Aim14 (SF198) branch free to inherit, or the activity should be recorded as a gain on the
    SF198 branch and the deep IBD reconsidered. Yarrowia "AIM14" (Q6C188), which PANTHER places in SF178,
    has no data either way. affected_subfamilies is omitted because the exact tree boundary of the
    loss has not been verified.
  supported_by:
  - reference_id: PMID:22586098
    supporting_text: encodes a genuine NADPH oxidase, which is located in the endoplasmic reticulum (ER)
      and produces superoxide in a NADPH-dependent fashion
