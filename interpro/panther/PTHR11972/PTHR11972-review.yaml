subfamilies:
- subfamily_id: PANTHER:PTHR11972:SF75
  label: DUAL OXIDASE 1
  description: Calcium-regulated, DUOXA1-dependent transmembrane NADPH:O2 oxidoreductases that catalyze
    direct extracellular hydrogen peroxide (H2O2) generation at the apical plasma membrane of mucosal
    and thyroid epithelia. Although vertebrate DUOX1 proteins retain an N-terminal extracellular peroxidase
    homology domain (PHD), biochemical studies of human DUOX1 and cryo-EM structures of the mouse DUOX1-DUOXA1
    complex demonstrate that the vertebrate PHD lacks heme-coordinating histidine residues, binds no heme,
    and has no intrinsic peroxidase activity.
  supported_by:
  - reference_id: PMID:32929281
    supporting_text: the facts that no heme density is observed in the cryo-EM map and histidines needed
      for heme coordination are missing in the putative binding pocket strongly suggest that the PHD domain
      of DUOX1 lacks heme-dependent peroxidase activity
  representative_members:
