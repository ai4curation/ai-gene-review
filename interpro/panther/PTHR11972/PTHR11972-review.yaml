    label: NAD(P)H oxidase H2O2-forming activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Direct Ca2+-regulated (or constitutive in NOX4) NADPH-dependent reduction of O2 to hydrogen peroxide
    (GO:0016174) is specific to the DUOX1 (SF75), DUOX2, and NOX4 branches and does not apply across the
    ferric-reductase or superoxide-forming NOX branches of PTHR11972.
  applicable_subfamilies:
  - id: PANTHER:PTHR11972:SF75
    label: DUAL OXIDASE 1
  supported_by:
  - reference_id: PMID:32929281
    supporting_text: As a member of the NADPH oxidase family, DUOX1 catalyzes the production of hydrogen
      peroxide (H2O2) and plays a crucial role in innate host defense and thyroid hormone biosynthesis
