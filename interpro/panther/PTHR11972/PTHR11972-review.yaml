family_id: PANTHER:PTHR11972
family_name: NADPH OXIDASE
summary: NADPH oxidase and ferric-reductase relatives transfer electrons across membranes through flavin
  and heme cofactors. NOX/DUOX branches generate reactive oxygen species, whereas ferric reductases reduce
  extracellular or organellar metal substrates. DUOX proteins additionally carry extracellular peroxidase-like
  regions and calcium-responsive regulatory elements.
functional_coherence: HETEROGENEOUS
coherence_reason: The reviewed DUOX1 record supports peroxide production, but a peroxidase-like region
  is not proof of intrinsic heme-peroxidase activity. Ferric reduction, superoxide production and hydrogen-peroxide
  production must be assigned to the appropriate branch. Oxidant generation should not be reinterpreted
  as oxidant detoxification solely because both involve reactive oxygen species.
