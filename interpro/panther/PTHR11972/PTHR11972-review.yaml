term_assessments:
- assessed_term:
    id: GO:0004601
    label: peroxidase activity
  scope: UNRESOLVED
  scope_reason: 'The human DUOX1 record explicitly records conflicting studies: an isolated peroxidase-like
    domain showed activity in one study (PMID:11514595), whereas a later study found no heme binding or
    intrinsic peroxidase activity (PMID:19460756), and the cryo-EM structure of the mouse DUOX1-DUOXA1
    complex confirmed that the PHD domain lacks heme-coordinating histidines and bound heme (PMID:32929281).
    Thus the inference is contested by experimental and structural evidence in mammalian DUOX1 while C.
    elegans BLI-3 retains weak covalent heme binding. The broad NOX/ferric-reductase family cannot carry
    this activity universally; species, construct and heme incorporation must be resolved.'
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-b.json
    supporting_text: However, another study showed that the isolated peroxidase-like domain does not bind
      heme and has no intrinsic peroxidase activity
  - reference_id: PMID:32929281
    supporting_text: the facts that no heme density is observed in the cryo-EM map and histidines needed
      for heme coordination are missing in the putative binding pocket strongly suggest that the PHD domain
      of DUOX1 lacks heme-dependent peroxidase activity
- assessed_term:
