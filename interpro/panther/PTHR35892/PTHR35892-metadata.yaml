  name:
    name: Bacterial Outer Membrane Invasion-Related Protein
    short: Bact_OM_Invasion-Related
  description:
  - text: This family of proteins is involved in host-pathogen interactions, particularly
      during bacterial infection processes. Members are incorporated into the bacterial
      outer membrane and play roles in adhesion to and invasion of eukaryotic cells.
      Some proteins facilitate the invasion of epithelial mammalian cells by interacting
      with host cell receptors such as heparinated proteoglycan. Others are essential
      for bacterial virulence and survival within host cells, although the exact mechanisms
      of action remain to be fully elucidated. The family is part of the outer membrane
      OOP (TC 1.B.6) superfamily and includes proteins with functions during lysogeny
      in E.coli, promoting bacterial invasion, and contributing to full virulence.
