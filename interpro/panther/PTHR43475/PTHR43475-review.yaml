family_id: PANTHER:PTHR43475
family_name: METHYLTHIORIBOSE-1-PHOSPHATE ISOMERASE
preferred_name: Methylthioribose-1-phosphate isomerase (MtnA/MRI1) family
summary: >-
  eIF2B alpha/beta/delta-related isomerases. MtnA/MRI1 (S. cerevisiae MRI1, S. pombe mri1, human
  MRI1, P. putida mtnA, poplar MRI1) isomerizes MTR-1-P in the methionine salvage cycle. SF2 holds
  archaeal ribose 1,5-bisphosphate isomerases.
functional_coherence: MOSTLY_COHERENT
coherence_reason: SF1 and SF4 are MTR-1-P isomerases; SF2 is ribose 1,5-bisphosphate isomerase.
