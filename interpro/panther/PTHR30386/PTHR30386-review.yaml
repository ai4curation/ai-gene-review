notes: Reviewed for the alginate polymerization and export module. Tree placements were read from the
  PANTHER 19 treeinfo service for PTHR30386 (SF19 root PTN000769583, with Alg44 leaf PTN002411423
  nested in the gammaproteobacterial EmrA clade; SF18 root PTN002825283). P. aeruginosa Alg44 is the
  reference protein because it has a complete gene review with direct structural (PilZ-c-di-GMP) and
  topology evidence. E. coli EmrA, the PAINT seed, has no gene review in this repository. Because the
  family is too broad and cargo-heterogeneous to define Alg44, the module grounds Alg44 with the
  InterPro ALG44 beta-barrel domain and member proteins rather than with a PANTHER term.
