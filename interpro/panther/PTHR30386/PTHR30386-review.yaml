subfamilies:
- subfamily_id: PANTHER:PTHR30386:SF19
  label: MULTIDRUG EXPORT PROTEIN EMRA-RELATED
  description: EmrA/EmrK-type periplasmic adaptors of MFS multidrug efflux pumps together with the
    Alg44 alginate copolymerases and other relatives, such as Neisseria FarA. PANTHER places
    P. aeruginosa Alg44 inside the gammaproteobacterial EmrA-related clade, next to the paralog PA5159.
  representative_members:
  - *alg44_pa
  - id: UniProtKB:Q88NC6
    label: Alginate biosynthesis protein Alg44
    gene_symbol: alg44
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/alg44/alg44-ai-review.yaml
  - id: UniProtKB:P94200
    label: Alginate biosynthesis protein Alg44
    gene_symbol: alg44
    organism: Azotobacter vinelandii
    gene_review: genes/AZOVI/alg44/alg44-ai-review.yaml
  - id: UniProtKB:P27303
    label: Multidrug export protein EmrA
    gene_symbol: emrA
    organism: Escherichia coli K-12
  diverged_from_family: true
  divergence_description: The Alg44 members are not multidrug or bile-salt efflux adaptors. They add a
    cytoplasmic PilZ domain that binds c-di-GMP, and their periplasmic MFP-like region is required
    for alginate polymerization with Alg8. EmrA and EmrK in the same subfamily keep the efflux-adaptor
    role, so the divergence applies to the Alg44 branch, not to all of SF19.
  supported_by:
  - reference_id: PMID:18524915
    supporting_text: The long periplasmic C terminus of Alg44 contains a region similar to membrane
      fusion proteins (MFPs) of multi-drug efflux systems, which predicts the possibility of its
      interaction with another protein in this compartment.
  - reference_id: PMID:18524915
    supporting_text: These studies suggest that Alg44 may act as a co-polymerase in concert with Alg8,
      the major GT, and that both inner-membrane proteins are required in vivo for the polymerization
      reaction leading to alginate production.
