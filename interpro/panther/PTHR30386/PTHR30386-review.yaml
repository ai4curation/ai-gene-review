family_id: PANTHER:PTHR30386
family_name: MEMBRANE FUSION SUBUNIT OF EMRAB-TOLC MULTIDRUG EFFLUX PUMP
preferred_name: Membrane fusion (periplasmic adaptor) proteins of bacterial tripartite export systems,
  including the Alg44 alginate copolymerases
summary: PTHR30386 groups bacterial membrane fusion proteins (periplasmic adaptor proteins). These are
  inner-membrane-anchored proteins with a long periplasmic region that bridge an inner-membrane
  transporter to an outer-membrane channel in tripartite export systems. Different subfamilies serve
  different transporters and cargoes. EmrA and EmrK partner MFS multidrug pumps (SF19), HlyD-, LktD-
  and CyaD-type proteins serve type I secretion of RTX toxins (SF27), AprE and PrtE serve protease
  secretion (SF17), and ComB, LcnD and MesE serve bacteriocin and competence-peptide export (SF26).
  Alg44 sits inside the EmrA-related subfamily but has been repurposed. It is an alginate copolymerase
  with a cytoplasmic PilZ c-di-GMP-binding domain, a transmembrane segment and a periplasmic MFP-like
  region, and it works with the Alg8 glycosyltransferase rather than with a drug pump. The shared
  architectural role is periplasmic bridging between envelope components; the transported substrate,
  and whether the protein transports anything at all, is subfamily- and member-specific.
functional_coherence: HETEROGENEOUS
coherence_reason: Cargo specificity differs between subfamilies (drugs and bile salts for EmrA/EmrK,
  RTX toxins for HlyD-like SF27, proteases for SF17, peptides for SF26, fatty acids for FarA). Within
  SF19 the Alg44 proteins are alginate-synthesis copolymerases regulated by c-di-GMP rather than
  efflux-pump adaptors. No cargo-specific transport term is safe family-wide or even subfamily-wide
  for SF19.
