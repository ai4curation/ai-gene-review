  name:
    name: Diadenosine polyphosphate hydrolase
    short: Ap4A_hydrolase
  description:
  - text: This family of proteins is involved in the hydrolysis of diadenosine polyphosphates,
      specifically diadenosine 5',5'''-P1,P4-tetraphosphate (Ap4A), into adenosine
      diphosphate (ADP) or a combination of adenosine monophosphate (AMP) and adenosine
      triphosphate (ATP), depending on the enzyme's symmetry. Members of this family
      exhibit either symmetrical or asymmetrical hydrolysis activity. The symmetrical
      hydrolysis results in two ADP molecules, while the asymmetrical hydrolysis produces
      one AMP and one ATP molecule. These enzymes play a role in nucleotide metabolism
      and may be involved in the regulation of cellular processes that are sensitive
      to the levels of specific nucleotides.
