    name: Keratin-associated matrix protein
    short: KRTAP_matrix
  description:
  - text: This family of proteins is involved in the structural integrity of hair.
      They are part of the interfilamentous matrix in the hair cortex, where they
      interact with hair keratin intermediate filaments. These proteins are crucial
      for hair shaft formation, providing rigidity and resistance by forming extensive
      disulfide bond cross-linking with keratin's cysteine residues. They are characterized
      by high levels of sulfur and the amino acids glycine and tyrosine.
