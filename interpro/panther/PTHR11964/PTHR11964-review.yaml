family_id: PANTHER:PTHR11964
family_name: S-ADENOSYLMETHIONINE SYNTHETASE
preferred_name: S-adenosylmethionine synthetase (MetK/SAM/MAT) family
summary: >-
  Methionine adenosyltransferases make S-adenosylmethionine from methionine and ATP. The family contains
  bacterial MetK, S. cerevisiae SAM1/SAM2, S. pombe sam1, human MAT1A (liver) and MAT2A, and plant
  SAMS isozymes.
functional_coherence: COHERENT
coherence_reason: All subfamilies are SAM synthetases.
