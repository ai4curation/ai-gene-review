        label: (R)-2-hydroxyglutaryl-CoA dehydratase activating ATPase
        gene_symbol: hgdC
        organism: Acidaminococcus fermentans
      - id: UniProtKB:Q5U925
        label: 2-hydroxyisocaproyl-CoA dehydratase activator
        gene_symbol: hadI
        organism: Clostridioides difficile
      - id: UniProtKB:Q93AM0
        label: (R)-phenyllactate dehydratase activator
        gene_symbol: fldI
        organism: Clostridium sporogenes
      - id: UniProtKB:O87876
        label: Benzoyl-CoA reductase subunit A
        gene_symbol: bcrA
        organism: Thauera aromatica
    supported_by:
      - reference_id: file:interpro/panther/PTHR32329/PTHR32329-bioinformatics/RESULTS.md
        supporting_text: >-
          Every characterized
          dehydratase activator and benzoyl-CoA reductase ATPase subunit is in SF2.
  - subfamily_id: PANTHER:PTHR32329:SF4
    label: ACTIVATOR OF 2-HYDROXYACYL-COA DEHYDRATASE
    description: >-
      Anaerobic plasmalogen synthases (2061 UniProtKB members, median 1415
      residues, almost all bacterial). The single-chain enzymes fuse Act1,
      Act2 (PF01869), Red1 (PF09989) and a Red2 domain. The two-protein
      Clostridium perfringens enzyme splits these between PlsA and PlsR, and
      both subunits are placed here. Its 16 eukaryotic members are
      uncharacterized.
    diverged_from_family: true
    divergence_description: >-
      The activation domains do not activate a separate dehydratase. They
      drive the reduction of the sn-1 acyl ester of a diacyl phospholipid to
      the 1-(1Z-alkenyl) ether of a plasmalogen within the same protein or
      PlsA/PlsR complex. Expressing a single-chain member alone is enough for
      plasmalogen synthesis in heterologous hosts. Despite the subfamily
      name, no member is a dehydratase activator.
    representative_members:
      - id: UniProtKB:Q8DVN8
        label: (R)-2-hydroxyglutaryl-CoA dehydratase activator-related protein
        gene_symbol: SMU_438c
        organism: Streptococcus mutans serotype c (strain ATCC 700610 / UA159)
      - id: UniProtKB:Q835P9
        label: BadF/BadG/BcrA/BcrD ATPase family protein
        gene_symbol: EF_1327
        organism: Enterococcus faecalis (strain ATCC 700802 / V583)
      - id: UniProtKB:G0VRE7
        label: Putative CoA-substrate-specific enzyme activase
        organism: Megasphaera elsdenii DSM 20460
      - id: UniProtKB:Q9CDI2
        label: 2-hydroxyglutaryl-CoA dehydratase
        gene_symbol: yxcA
        organism: Lactococcus lactis subsp. lactis (strain IL1403)
        gene_review: genes/LACLA/yxcA/yxcA-ai-review.yaml
    supported_by:
      - reference_id: file:interpro/panther/PTHR32329/PTHR32329-bioinformatics/RESULTS.md
        supporting_text: >-
          Every characterized plasmalogen synthase in UniProtKB is in SF4, including
          both subunits of the two-protein C. perfringens enzyme.
      - reference_id: PMID:38456674
        supporting_text: >-
          The heterologous expression of SMU_438c in a plasmalogen-negative strain,
