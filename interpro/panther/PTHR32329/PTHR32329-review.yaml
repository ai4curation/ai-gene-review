  - subfamily_id: PANTHER:PTHR32329:SF5
    label: ACTIVATOR OF 2-HYDROXYACYL-COA DEHYDRATASE
    description: >-
      237 bacterial members, mostly single-domain (PF01869) proteins of about
      255 residues, resembling the SF2 activators. No member has been studied
      experimentally.
  - subfamily_id: PANTHER:PTHR32329:SF7
    label: ACTIVATOR OF 2-HYDROXYACYL-COA-HYDRATASE
    description: >-
      779 members, mixed: most are single-domain (PF01869) proteins of about
      330 residues, but 214 have the PF01869 + PF09989 architecture of the
      plasmalogen synthases. No member has been studied experimentally.
  - subfamily_id: PANTHER:PTHR32329:SF8
    label: ACTIVATOR OF (R)-2-HYDROXYGLUTARYL-COA DEHYDRATASE
    description: >-
      159 bacterial members, mostly single-domain (PF01869) proteins of about
      250 residues. No member has been studied experimentally.
term_assessments:
  - assessed_term:
      id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Both characterized lineages bind a [4Fe-4S] cluster through the PF01869
      ATPase domain. In the SF2 activators the cluster bridges the two
      subunits of the dimer, as shown by the HgdC and HadI crystal
      structures. In the SF4 plasmalogen synthases, mutating the predicted
      cluster-ligand cysteines of MeHAD abolishes activity, and cysteine is
      implicated in the Selenomonas enzyme. The grant covers SF2 and SF4,
      where there is evidence; SF5, SF7 and SF8 are untested. Within SF2 the
      grant rests on the ATPase domain, so the 1097 members with no PF01869
      cross-reference have no direct support. Their status is not settled
      here, because UniProt Pfam cross-references miss divergent domains.
    applicable_subfamilies:
      - id: PANTHER:PTHR32329:SF2
        label: BIFUNCTIONAL PROTEIN [INCLUDES 2-HYDROXYACYL-COA DEHYDRATASE (N-TER) AND ITS ACTIVATOR DOMAIN (C_TERM)
      - id: PANTHER:PTHR32329:SF4
        label: ACTIVATOR OF 2-HYDROXYACYL-COA DEHYDRATASE
    supported_by:
      - reference_id: PMID:11243821
        supporting_text: >-
          Component A (CompA), a homodimeric protein of 2x27 kDa, contains a single,
          bridging [4Fe-4S] cluster and uses the hydrolysis of ATP to deliver an
          electron to the dehydratase component (CompD), where the electron is used
          catalytically.
      - reference_id: PMID:22827463
        supporting_text: >-
          The activator is a homodimeric protein structurally related to acetate and
          sugar kinases, Hsc70 and actin, and has a [4Fe-4S] cluster bound in the
          dimer interface.
      - reference_id: PMID:37348645
        supporting_text: >-
          The four-cysteine (Cys125, Cys164, Cys445 and Cys484) site-mutant of MeHAD,
          which were predicted binding to the [4Fe-4S] cluster, was unable to
          synthesize plasmalogens
      - reference_id: PMID:39725447
        supporting_text: >-
          Plasmalogen synthesis is affected by mutations in ATP-binding sites and Cys
          is expected to be involved in the formation of the [4Fe-4S] cluster.
  - assessed_term:
      id: GO:0016887
      label: ATP hydrolysis activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      ATP hydrolysis coupled to electron transfer has been measured for the
      SF2 activators (HgdC, HadI), and benzoyl-CoA reductase activity
      strictly depends on MgATP. For the SF4 plasmalogen synthases, ATP
      dependence is only inferred: mutating the ATP-binding sites of the
      Selenomonas ruminantium enzyme lowers plasmalogen synthesis
      (PMID:39725447), but no PlsA has been purified or assayed for ATP
      hydrolysis. The grant is therefore limited to SF2, and within SF2 it
      rests on the PF01869 ATPase domain. Extending it to SF4 needs an in
      vitro assay.
    applicable_subfamilies:
      - id: PANTHER:PTHR32329:SF2
        label: BIFUNCTIONAL PROTEIN [INCLUDES 2-HYDROXYACYL-COA DEHYDRATASE (N-TER) AND ITS ACTIVATOR DOMAIN (C_TERM)
    supported_by:
      - reference_id: PMID:15654892
        supporting_text: >-
          The reduced activator transfers one electron to the dehydratase concomitant
          with hydrolysis of ATP
      - reference_id: PMID:11243821
        supporting_text: >-
          uses the hydrolysis of ATP to deliver an electron to the dehydratase
          component (CompD)
      - reference_id: PMID:8575453
        supporting_text: >-
          A spectrophotometric assay was developed which was strictly dependent on
          MgATP
      - reference_id: PMID:39725447
        supporting_text: >-
          Plasmalogen synthesis is affected by mutations in ATP-binding sites and Cys
          is expected to be involved in the formation of the [4Fe-4S] cluster.
  - assessed_term:
      id: GO:0008047
      label: enzyme activator activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Activating a separate 2-hydroxyacyl-CoA dehydratase is the defining
      activity of HgdC, HadI, FldI and LcdC, all short single-domain PF01869
      proteins in SF2 (1609 members, median 261 residues). The grant rests on
      that architecture. It must not descend to SF4, where the same domains
      are part of the catalytic plasmalogen synthase and no separate enzyme is
      activated. For the same reason it does not reach the two SF2 groups that
      are themselves plasmalogen-synthase components rather than activators:
      the 210 PF09989 + PF06050 PlsR-like Red1 + Red2 subunits and the 47
      PF01869 + PF09989 PlsA-like proteins. Within the activator architecture,
      BcrA and BcrD are subunits of the benzoyl-CoA reductase complex itself
      rather than activators of another enzyme, so they are excepted. The
      remaining uncharacterized SF2 proteins are covered only by the subfamily
      grant and have no direct support.
    applicable_subfamilies:
      - id: PANTHER:PTHR32329:SF2
        label: BIFUNCTIONAL PROTEIN [INCLUDES 2-HYDROXYACYL-COA DEHYDRATASE (N-TER) AND ITS ACTIVATOR DOMAIN (C_TERM)
    member_exceptions:
      - member:
          id: UniProtKB:O87876
          label: Benzoyl-CoA reductase subunit A
          gene_symbol: bcrA
          organism: Thauera aromatica
        exception_reason: >-
          A subunit of the abcd benzoyl-CoA reductase complex, which consumes
          ATP stoichiometrically in its own reaction. It is part of the
          reductase, not an activator of a separate enzyme.
        supported_by:
          - reference_id: PMID:8575453
            supporting_text: >-
              It had a native molecular mass of approximately 170 kDa and consisted of
              four subunits a,b,c,d of 48, 45, 38 and 32 kDa.
      - member:
          id: UniProtKB:O87877
          label: Benzoyl-CoA reductase subunit D
          gene_symbol: bcrD
          organism: Thauera aromatica
        exception_reason: >-
          As for BcrA: a subunit of the benzoyl-CoA reductase complex, not an
          activator of a separate enzyme.
        supported_by:
          - reference_id: PMID:8575453
            supporting_text: >-
              It had a native molecular mass of approximately 170 kDa and consisted of
              four subunits a,b,c,d of 48, 45, 38 and 32 kDa.
    supported_by:
      - reference_id: PMID:7607244
        supporting_text: >-
          The enzyme has to be activated by ATP, MgCl2, and Ti(III)citrate by an
          activator protein (HgdC) that is present in the organism at very low
          concentrations.
      - reference_id: PMID:15654892
        supporting_text: >-
          shown to encode the novel 2-hydroxyisocaproyl-CoA dehydratase HadBC and its
          activator HadI
      - reference_id: PMID:11967068
        supporting_text: >-
          Phenyllactate dehydratase requires initiation by ATP, MgCl2 and a reducing
          agent such as dithionite mediated by an extremely oxygen-sensitive
          initiator protein (FldI)
  - assessed_term:
      id: GO:0043717
      label: 2-hydroxyglutaryl-CoA dehydratase activity
    scope: UNRESOLVED
    scope_reason: >-
      No characterized member catalyses a dehydration. In every studied
      2-hydroxyacyl-CoA dehydratase system the dehydratase is a separate
      component-D protein (HgdAB, HadBC, FldBC, LcdAB) that this family's
      activators switch on. The term is therefore wrong for the SF2
      activators and BcrA/BcrD. It is also wrong for the SF4 plasmalogen
      synthases, which UniProt nonetheless names "2-hydroxyglutaryl-CoA
      dehydratase" for Q9CDI2 and A0A0H2YN56 (ProtNLM names). It is not marked
      NOT_APPLICABLE because of one uncharacterized SF2 architecture: 185
      proteins fuse the PF01869 activator domain with an HGD-D (PF06050)
      dehydratase domain in one chain, which is the bifunctional
      activator-plus-dehydratase protein PANTHER's family name describes. Any
      dehydratase activity would come from that HGD-D domain, and it has not
      been tested. (The other HGD-D-bearing SF2 group, the 210 PF09989 +
      PF06050 proteins, is the Red1 + Red2 partner subunit of two-gene
      plasmalogen synthase systems, PMID:33350306 architecture 3, so it is not
      a dehydratase candidate.) The lactoyl-CoA dehydratase claim on LcdC is
      split into its own GO:0018819 assessment below.
    supported_by:
      - reference_id: PMID:7607244
        supporting_text: >-
          (R)-2-Hydroxyglutaryl-CoA dehydratase (HgdAB) from Acidaminococcus
          fermentans catalyses the reversible dehydration of its substrate to
          glutaconyl-CoA.
      - reference_id: PMID:22827463
        supporting_text: >-
          The highly energetic electron needed on the dehydratase is donated by a
          [4Fe-4S] cluster containing ATPase, termed activator.
      - reference_id: PMID:33350306
        supporting_text: >-
          PF09989 (CoA enzyme activase uncharacterized domain, which corresponds to
          Red1 of PlsA), and PF06050 (HGD-D, 2-hydroxyglutaryl-CoA dehydratase, which
          corresponds to Red2 of PlsR)
  - assessed_term:
      id: GO:0018819
      label: lactoyl-CoA dehydratase activity
    scope: UNRESOLVED
    scope_reason: >-
      GOA carries an IDA for this term on LcdC (G3KIM5), which this review
      places among the SF2 activators (an ATP-dependent activator, not a
      dehydratase). The cited paper (PMID:1597194) purified component E II,
      the lactyl-CoA dehydratase itself, so the row may belong to the
      dehydratase component rather than to its activator. The full text is not
      available to confirm which protein was assayed, so the annotation is not
      overruled; it is recorded as UNRESOLVED pending the full text. If the
      activity belongs to the dehydratase, the term does not describe LcdC or
      any other SF2 member.
    supported_by:
      - reference_id: PMID:1597194
        supporting_text: >-
          A new two-step method for purifying component E II of lactyl-CoA dehydratase
          was developed.
  - assessed_term:
      id: GO:0008611
      label: ether lipid biosynthetic process
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The placed SF4 members that make plasmalogens are the single-chain
      enzymes from S. mutans, E. faecalis and M. elsdenii and the
      C. perfringens PlsA/PlsR pair. Two further characterized enzymes support
      the biology without being placed in SF4 themselves: the L. cremoris PlsA
      (LACR_2543, the ortholog behind the Q9CDI2 ISS inference) and the
      S. ruminantium SrPlsAR have no UniProtKB entry to carry a PANTHER
      cross-reference. Most SF4 members (1580 of 2061) are long proteins with
      the PlsA architecture. The term is safe for SF4 only. It
      must not descend to the SF2 activators. The 214 SF7 proteins with the
      PlsA-like architecture are a candidate extension, but none is
      characterized and the term is not granted to SF7. The 16 eukaryotic SF4
      members are untested.
    applicable_subfamilies:
      - id: PANTHER:PTHR32329:SF4
        label: ACTIVATOR OF 2-HYDROXYACYL-COA DEHYDRATASE
    supported_by:
      - reference_id: PMID:33350306
        supporting_text: >-
          anaerobic plasmalogen biosynthesis uses the reductive conversion of an
          ester to an aldehyde equivalent
      - reference_id: PMID:37348645
        supporting_text: the HAD homolog (MeHAD) encoded by a single gene MELS_0169
      - reference_id: PMID:41427725
        supporting_text: >-
          Both PlsLc and PlsBs produced plasmalogens, as evidenced by the detection
          of aldehydes in the lipid extracts after acid hydrolysis
      - reference_id: PMID:39725447
        supporting_text: >-
          Escherichia coli expressing SrPlsAR from Selenomonas ruminantium produces
          plasmalogen
      - reference_id: file:interpro/panther/PTHR32329/PTHR32329-bioinformatics/RESULTS.md
        supporting_text: >-
          SF4 is dominated by long proteins with the PlsA architecture (1580 of 2061
          are 1000 aa or longer; 1760 have PF01869 + PF09989).
