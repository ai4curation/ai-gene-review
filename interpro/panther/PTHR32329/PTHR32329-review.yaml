review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PANTHER family review
review_date: "2026-10-31"
notes: >-
  No PAINT node-level annotations exist for PTHR32329 (fetch-panther-paint
  produced no slice), so no node assessments are made. Subfamily membership
  and architecture come from the committed subfamily_profile.py (UniProt
  PANTHER cross-references, retrieved 2026-10-31). The plasmalogen-forming
  molecular function of SF4 has no GO term. A new-term request ("plasmalogen-
  forming diacylglycerophospholipid reductase activity") has been drafted,
  together with a request to relabel GO:0047159, which is currently labelled
  "plasmalogen synthase activity" but is an EC 2.3.1.25 acyltransferase. Once
  the new term exists, it should be added here as SUBFAMILY_ONLY [SF4]. The
  root oxidoreductase term GO:0016491 is deliberately not asserted: the yxcA
  gene review uses it only as the proposed parent of that drafted term, and
  GOA has no molecular-function annotation to scope. Most family literature is
  abstract-only in the cache (PMIDs 7607244, 11243821, 8575453, 22827463,
  11967068, 15654892, 1597194, 37348645, 38456674, 39725447). The
  characterized S. ruminantium (PMID:39725447) and B. suis (PMID:41427725,
  "PlsBs") plasmalogen synthases are not in the studied-proteins table because
  their papers give no UniProtKB accession to place.
