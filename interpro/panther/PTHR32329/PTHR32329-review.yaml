family_id: PANTHER:PTHR32329
family_name: BIFUNCTIONAL PROTEIN [INCLUDES 2-HYDROXYACYL-COA DEHYDRATASE (N-TER) AND ITS ACTIVATOR DOMAIN (C_TERM)-RELATED
preferred_name: >-
  BadF/BadG/BcrA/BcrD-type [4Fe-4S] ATPases: 2-hydroxyacyl-CoA dehydratase
  activators, benzoyl-CoA reductase ATPase subunits and anaerobic plasmalogen
  synthases
summary: >-
  Members share an actin-fold ATPase domain (Pfam PF01869, BadF/BadG/BcrA/BcrD)
  that couples ATP hydrolysis to the transfer of a low-potential electron
  through a [4Fe-4S] cluster. They power some of the most difficult reductions
  in anaerobic metabolism, and the family divides by what that electron is
  used for. The best-characterized members are small homodimeric activators of
  about 260 residues: HgdC of Acidaminococcus fermentans, HadI of Clostridioides
  difficile, FldI of Clostridium sporogenes and LcdC of Anaerotignum
  propionicum. Each binds one [4Fe-4S] cluster across its dimer interface and
  hydrolyses ATP to inject an electron into a separate 2-hydroxyacyl-CoA
  dehydratase (component D). That electron generates a ketyl radical, and only
  catalytic amounts of activator and ATP are needed. BcrA and BcrD, the
  ATP-dependent subunits of benzoyl-CoA reductase in Thauera aromatica, use
  the same chemistry to drive dearomatization of benzoyl-CoA, but they need
  stoichiometric ATP. A third group, in subfamily SF4, consists of long
  (about 1400 residue) proteins in obligate and facultative anaerobes. These
  fuse two such ATPase domains (Act1, Act2) with reduction/dehydration domains,
  or split them between PlsA and PlsR. They are plasmalogen synthases that
  convert the sn-1 ester of diacyl phospholipids into the vinyl ether of
  plasmalogens. No member of the family has been shown to catalyse a
  dehydration itself; in the characterized systems the dehydratase is a
  separate component-D protein.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The ATP-driven [4Fe-4S] electron-transfer mechanism is shared, but the
  biological function diverges by subfamily. SF2 holds the dehydratase
  activators and the benzoyl-CoA reductase ATPase subunits. SF4 holds the
  plasmalogen synthases, whose activation domains drive phospholipid
  reduction rather than activating a separate dehydratase. SF5, SF7 and SF8
  contain no experimentally studied protein. SF2 is itself mixed (it also has
  hundreds of DUF2229-only proteins and HGD-D fusions), so even
  subfamily-level grants must be read with that in mind. PANTHER's family and
  subfamily names ("2-hydroxyacyl-CoA dehydratase", "activator of
  2-hydroxyacyl-CoA dehydratase") describe the SF2 activators. Applied to SF4
  they are wrong: the L. lactis plasmalogen synthase Q9CDI2 is named
  "2-hydroxyglutaryl-CoA dehydratase" in UniProt (a ProtNLM name).
