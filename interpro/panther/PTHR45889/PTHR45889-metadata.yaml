  name:
    name: Nectin-like cell adhesion protein
    short: Nectin-like_adhesion
  description:
  - text: This family of proteins is involved in cell-cell adhesion mechanisms. They
      mediate both homophilic and heterophilic interactions, which are generally independent
      of calcium ions. These proteins play a role in various biological processes
      including the formation of synapses, neuronal migration, axon growth, and the
      development of dendritic spines. They are also implicated in immune responses,
      facilitating interactions between different types of cells such as natural killer
      cells, T-cells, and dendritic cells. Some family members are associated with
      tumor suppression activity, particularly in non-small-cell lung cancer. Additionally,
      they may contribute to spermatogenesis and the adhesion of spermatocytes and
      spermatids to Sertoli cells.
