  label: LARGE RIBOSOMAL SUBUNIT PROTEIN UL4M
  description: IPR013005 describes the conserved uL4 structural role. The verified uL4m assignment explains
    mitochondrial translation in Yml6; it does not make mitochondrial localization a family-wide property.
