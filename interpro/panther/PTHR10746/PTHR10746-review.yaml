family_id: PANTHER:PTHR10746
family_name: 50S RIBOSOMAL PROTEIN L4
summary: uL4-family proteins are structural components of the large ribosomal subunit. Bacterial and organellar
  homologues share the ribosome-associated role, but the cellular location and translation system depend
  on lineage and targeting. Pombe Yml6 belongs to the mitochondrial uL4 group.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The inventory overwhelmingly identifies uL4 proteins but also assigns the Xenopus magainin
  precursor P11006 to SF6. Its reviewed sequence and processing record describe repeated secreted antimicrobial
  peptides, not a ribosomal uL4 protein. This is an apparent classification outlier, not evidence that
  ribosomal uL4 evolved an antimicrobial precursor function. Yml6 remains a supported uL4m member, but
  an unconditional grant to every catalogued sequence is unsafe.
