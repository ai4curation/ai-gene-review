family_id: PANTHER:PTHR10739
family_name: CYTIDYLYLTRANSFERASE
preferred_name: Choline-phosphate cytidylyltransferase family (CCT/PCYT1)
summary: >-
  CTP:phosphocholine cytidylyltransferases make CDP-choline, the rate-limiting step of phosphatidylcholine
  synthesis by the Kennedy pathway. They are amphitropic enzymes activated by binding to lipid-packing
  defects in the nuclear envelope and ER through an amphipathic helix. The family contains S. cerevisiae
  PCT1, the S. pombe CCT (SPCC1827.02c), human PCYT1A/PCYT1B, and plant CCT1/CCT2.
functional_coherence: COHERENT
coherence_reason: All subfamilies are CTP:phosphocholine cytidylyltransferases.
