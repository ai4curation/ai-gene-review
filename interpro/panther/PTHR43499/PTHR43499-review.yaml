- assessed_term:
    id: GO:0015439
    label: ABC-type heme transporter activity
  scope: UNRESOLVED
  scope_reason: CcmAB ATP hydrolysis is required for holo-CcmE processing and release. PMID:40026579 supports
    a CcmB heme-translocase model using overproduction, complementation, heme measurements and modeling;
    PMID:40167305 explicitly disputes that conduit using engineered-cysteine heme contacts in CcmCD and
    holoCcmE formation without CcmAB. These assays do not settle a family-wide ATP-coupled heme transmembrane
    reaction. Preserve the release ATPase role without treating either disputed conduit model as definitive.
  supported_by:
  - reference_id: file:ECOLI/ccmA/ccmA-uniprot.txt
    supporting_text: once thought to export heme, this does not seem to be the case, but its exact role
      is uncertain.
  - reference_id: PMID:16824107
    supporting_text: The mechanism involves an ATP-binding cassette (ABC) transporter that is required
      for release of the periplasmic haem chaperone CcmE to the last step of cytochrome c assembly.
  - reference_id: PMID:40026579
    supporting_text: Here, we identify and substantiate CcmB as heme translocase in bacteria.
