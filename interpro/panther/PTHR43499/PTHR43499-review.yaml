family_id: PANTHER:PTHR43499
family_name: ABC TRANSPORTER I FAMILY MEMBER 1
preferred_name: CcmA cytochrome c maturation ABC ATPase family
summary: >-
  PTHR43499 is the CcmA family of nucleotide-binding (ABC ATPase) subunits of
  cytochrome c maturation system I. Members include E. coli K-12 CcmA, the
  CcmA orthologs of Pseudomonas, Haemophilus, Shewanella, Rhodobacter,
  Paracoccus and Bradyrhizobium, and the plant mitochondrial homolog
  Arabidopsis ABCI1, consistent with the presence of system I in proteobacteria
  and plant mitochondria. CcmA associates with the integral membrane subunit
  CcmB; purified CcmAB hydrolyses ATP, and Walker A mutation abolishes both the
  ATPase activity and cytochrome c biogenesis. The ATPase supports release of
  holo-CcmE from CcmC rather than a demonstrated heme-export reaction, so the
  family is reviewed here as an energy-coupling ATPase, not as a heme
  transporter. PANTHER defines a single subfamily (SF1) for all members.
functional_coherence: COHERENT
coherence_reason: >-
  All Swiss-Prot members are CcmA orthologs or the plant mitochondrial ABCI1
  homolog in the single subfamily SF1, and the only PAINT assertion (cytochrome
  c biosynthetic process at PTN001952384) applies to the whole family. ATP
  hydrolysis is the shared catalytic activity of the ABC nucleotide-binding
  fold; no member is known to have lost the Walker motifs.
