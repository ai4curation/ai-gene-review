notes: 'Reviewed as part of the bacterial cytochrome c maturation system I module. PANTHER''s family name
  (ABC transporter I family member 1) follows the Arabidopsis ABCI1 nomenclature; the bacterial members
  are CcmA. Follow-up: Transport scope remains UNRESOLVED because the primary conduit models disagree,
  rather than because no positive transport study exists. OLEA2 G20 CcmA is in a different PANTHER family
  (PTHR42939); this family is not a universal selector for every CcmA.'
