node_assessments:
  - node_id: PANTHER:PTN001952384
    asserted_term:
      id: GO:1903607
      label: cytochrome c biosynthetic process
    evidence: IBD
    paint_snapshot: '20250313'
    seeds:
      - id: UniProtKB:P33931
    assessment: SOUND
    assessment_reason: >-
      The family consists of system I CcmA ATPases (and the plant mitochondrial
      ABCI1 homolog); E. coli CcmA ATPase activity is required for cytochrome c
      biogenesis in vivo, so placing the process at the family root is sound.
    supported_by:
      - reference_id: file:interpro/panther/PTHR43499/PTHR43499-paint.tsv
        supporting_text: "PTHR43499\tPTN001952384\tGO:1903607\tP\tIBD\tfalse\tUniProtKB:P33931"
      - reference_id: PMID:17419738
        supporting_text: >-
          Mutation of the Walker A motif in CcmA(K40D) results in loss of the
          in vitro ATPase activity and in loss of cytochrome c biogenesis in
          vivo.
term_assessments:
  - assessed_term:
      id: GO:1903607
      label: cytochrome c biosynthetic process
    scope: FAMILY_WIDE
    scope_reason: >-
      Asserted at the family root node PTN001952384; every Swiss-Prot member is
      a system I CcmA ortholog or the mitochondrial homolog.
    supported_by:
      - reference_id: file:interpro/panther/PTHR43499/PTHR43499-paint.tsv
        supporting_text: "PTHR43499\tPTN001952384\tGO:1903607\tP\tIBD\tfalse\tUniProtKB:P33931"
  - assessed_term:
      id: GO:0016887
      label: ATP hydrolysis activity
    scope: FAMILY_WIDE
    scope_reason: >-
      ATP hydrolysis is the catalytic activity of the ABC nucleotide-binding
      fold shared by all members; it is directly demonstrated for purified E.
      coli CcmAB and is lost on Walker A mutation.
    supported_by:
      - reference_id: PMID:17419738
        supporting_text: >-
          We have purified a complex of these proteins, and found it to have
          ATP hydrolysis activity.
      - reference_id: file:ECOLI/ccmA/ccmA-uniprot.txt
        supporting_text: Responsible for energy coupling to the transport system.
  - assessed_term:
      id: GO:0015439
      label: ABC-type heme transporter activity
    scope: UNRESOLVED
    scope_reason: >-
      The historical heme-exporter interpretation of CcmAB is not supported by
      direct evidence; CcmAB ATP hydrolysis is instead required for release of
      holo-CcmE from CcmC. Whether any transported substrate exists is
      unresolved, so substrate-specific transporter activity is not asserted
      for the family.
    supported_by:
      - reference_id: file:ECOLI/ccmA/ccmA-uniprot.txt
        supporting_text: >-
          once thought to export heme, this does not seem to be the case, but
          its exact role is uncertain.
      - reference_id: PMID:16824107
        supporting_text: >-
          The mechanism involves an ATP-binding cassette (ABC) transporter that
          is required for release of the periplasmic haem chaperone CcmE to the
          last step of cytochrome c assembly.
