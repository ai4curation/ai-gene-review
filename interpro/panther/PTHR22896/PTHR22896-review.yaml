family_id: PANTHER:PTHR22896
family_name: CDK5 AND ABL1 ENZYME SUBSTRATE 1
preferred_name: CABLES cyclin-dependent kinase-associated regulators
summary: CABLES proteins contain a cyclin-like interaction fold and have context-dependent regulatory
  functions. Fly Cables1 is a basal-body-associated protein required for neuronal and sperm ciliary architecture.
  Mammalian CDK-associated, cell-cycle and cell-death observations do not establish the same pathways
  in every CABLES member or imply intrinsic kinase activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Direct Drosophila experiments establish Cables1 basal-body recruitment and ciliary ultrastructural
  phenotypes. The shared cyclin fold supports an interaction-protein relationship with mammalian CABLES,
  but it does not establish a conserved cell-cycle mechanism or identical localization. Basal-body biology
  is primary evidence on the fly representative, not an inference from the mammalian gene name.
subfamilies:
- subfamily_id: PANTHER:PTHR22896:SF0
  label: CYCLIN N-TERMINAL DOMAIN-CONTAINING PROTEIN
  description: The fly Cables1 representative has direct basal-body localization and ciliogenesis phenotypes.
    Its molecular interaction mechanism remains unresolved, and neither a conventional cyclin/CDK-activator
    function nor a specific nuclear role is established.
  representative_members:
  - id: UniProtKB:A0A0B4KF19
    gene_symbol: Cables1
    organism: Drosophila melanogaster
    label: Cyclin N-terminal domain-containing protein
    gene_review: genes/DROME/Cables1/Cables1-ai-review.yaml
references:
- id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-c/PTHR22896.md
  title: PANTHER/InterPro and UniProt source extracts for PTHR22896
- id: PMID:37317646
  title: A phylogenetic profiling approach identifies novel ciliogenesis genes in Drosophila and C. elegans.
review_status: COMPLETE
reviewed_by: codex
review_date: '2026-09-10'
notes: The 2023 primary paper studies Cables1/CG6191 directly, including the relatively faint basal-body
  GFP signal and neuronal/sperm ultrastructure. Generic cell-cycle regulation remains a separate unresolved
  hypothesis in fly. The presence of a cyclin fold is not evidence that Cables1 is a kinase.
term_assessments:
- assessed_term:
    id: GO:0036064
    label: ciliary basal body
  scope: UNRESOLVED
  scope_reason: Fly Cables1 is directly recruited to maturing sperm basal bodies. This does not define
    the location of all CABLES1/2 products or exclude additional nuclear or cytoplasmic pools in other
    contexts.
  supported_by:
  - reference_id: PMID:37317646
    supporting_text: TEX9, CCDC6, and CABLES1 are recruited to maturing basal bodies during Drosophila
      spermatogenesis.
- assessed_term:
    id: GO:0044458
    label: motile cilium assembly
  scope: UNRESOLVED
  scope_reason: Fly Cables1 depletion/deletion disrupts sperm axonemal architecture, supporting motile
    ciliogenesis for that member. The complete evolutionary distribution of this role across CABLES1/2
    branches has not been established.
  supported_by:
  - reference_id: PMID:37317646
    supporting_text: RNAi‐mediated depletion/deletion of CABLES1, CCDC6, CEP104, and TEX9 in Drosophila
      chordotonal neurons (A) and sperm (B) results in defects in ciliary ultrastructure similar to CEP135.
