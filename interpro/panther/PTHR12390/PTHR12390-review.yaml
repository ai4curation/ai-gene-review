family_id: PANTHER:PTHR12390
family_name: UROPORPHYRINOGEN III SYNTHASE
preferred_name: Eukaryotic (opisthokont) uroporphyrinogen-III synthase family
summary: >-
  Uroporphyrinogen-III synthases (EC 4.2.1.75) cyclize the linear tetrapyrrole
  hydroxymethylbilane, inverting ring D, to give uroporphyrinogen III, the first
  macrocyclic intermediate and the branch point of heme, siroheme and corrinoid synthesis.
  This PANTHER family holds the eukaryotic enzymes of the PANTHER reference genomes,
  including human UROS, S. cerevisiae HEM4 and S. pombe ups1/hem4; bacterial HemD and plant
  plastid enzymes fall in the separate PTHR38042 family. Members are soluble cytosolic
  enzymes, and human UROS deficiency causes congenital erythropoietic porphyria.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF0); every characterized member is a uroporphyrinogen-III synthase.
