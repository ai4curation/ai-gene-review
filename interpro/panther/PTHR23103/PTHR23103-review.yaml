residue_sites:
- site_id: cubd_copper_site
  label: E1 copper-binding subdomain Cu(2+) ligands
  description: >-
    The three protein ligands of the type 2 copper site in the copper-binding subdomain (CuBD)
    of the E1 region, from the UniProt binding-site features of human APP and the Cu(2+)-bound
    CuBD crystal structure (Kong et al. 2007). Met170 is not a ligand but is required for
    reduction of Cu(2+) to Cu(+). By global pairwise alignment to APP (BLOSUM62, current UniProt
    sequences): APLP2 keeps all three (His163, His167, Tyr184), as does mouse App; human APLP1
    has Ser170, His174, Ser191, so only the second histidine is retained; Drosophila APPL has
    Phe157, Asn161, Phe178 and C. elegans APL-1 has Tyr149, Lys153, Phe176, so neither has the
    site. No member has been shown experimentally to lack copper binding, so no negative
    controls are declared. APP also binds copper through His677, His681, His684 and His685
    within the amyloid-beta region, which is a separate, APP-only site.
  anchor:
    id: UniProtKB:P05067
    label: APP
    organism: Homo sapiens
  anchor_sequence_version: 3
  site_source: UNIPROT_FEATURE
  residues:
  - position: 147
    expected:
    - H
    role: Cu(2+) ligand
  - position: 151
    expected:
    - H
    role: Cu(2+) ligand
  - position: 168
    expected:
    - Y
    role: Cu(2+) ligand
  required_for:
  - term:
      id: GO:0005507
      label: copper ion binding
    strength: CONTRIBUTES
    rationale: >-
      These side chains coordinate the metal at the CuBD site, so a member without them cannot
      bind copper at this site. The strength is CONTRIBUTES rather than REQUIRED because copper
      ion binding as a GO function can be met by other sites (the amyloid-beta histidines in
      APP), and because a single conserved histidine, as in APLP1, may still support weaker
      binding that has not been tested.
    supported_by:
    - reference_id: PMID:17239395
      supporting_text: The structure of Cu(2+)-bound CuBD reveals that the metal ligands are
        His147, His151, Tyr168 and two water molecules
    - reference_id: PMID:7913895
      supporting_text: The two essential histidines in the type II copper binding site of APP
        are conserved in the related protein APLP2.
  positive_controls:
  - id: UniProtKB:Q06481
    label: APLP2
    gene_symbol: APLP2
    organism: Homo sapiens
    control_position: 163
    control_residue: H
  - id: UniProtKB:P12023
    label: App
    gene_symbol: App
    organism: Mus musculus
    control_position: 147
    control_residue: H
- site_id: kpi_reactive_site
  label: Kunitz (KPI) domain reactive-site P1 arginine
  description: >-
    The P1 residue of the reactive bond (Arg301-Ala302) of the BPTI/Kunitz inhibitor domain of
    APP (residues 291-341, encoded by alternatively spliced exons and absent from APP695). The
    domain is present, with the same P1 arginine, in human APLP2 (Arg320) and mouse App
    (Arg301). APLP1, Drosophila APPL and C. elegans APL-1 have no KPI domain at all: the
    pairwise alignment to APP residues 291-341 is gapped or unrelated sequence in each. The
    canonical mouse Aplp2 sequence (Q06335) also lacks it, because its KPI exon is spliced out
    in that isoform.
  anchor:
    id: UniProtKB:P05067
    label: APP
    organism: Homo sapiens
  anchor_sequence_version: 3
  site_source: UNIPROT_FEATURE
  residues:
  - position: 301
    expected:
    - R
    role: reactive-site P1 residue
  required_for:
  - term:
      id: GO:0004867
      label: serine-type endopeptidase inhibitor activity
    strength: CONTRIBUTES
    rationale: >-
      Kunitz inhibitors block trypsin-like proteases by inserting the reactive-site loop into
      the active site, with the P1 residue occupying the S1 specificity pocket. The P1 arginine
      sets specificity for trypsin-like serine proteases. A substitution at P1 changes potency
      and specificity rather than necessarily abolishing inhibition, so the strength is
      CONTRIBUTES; the absence of the whole domain, as in APLP1, APPL and APL-1, is what rules
      the activity out.
    supported_by:
    - reference_id: PMID:2893291
      supporting_text: The sequence of the 56 amino acids at the N-terminal of the protein
        deduced from this insert is highly homologous to the basic trypsin inhibitor family,
        and the lysate from COS-1 cells transfected with the longer APP cDNA showed an increased
        inhibition of trypsin activity.
  positive_controls:
  - id: UniProtKB:Q06481
    label: APLP2
    gene_symbol: APLP2
    organism: Homo sapiens
    control_position: 320
    control_residue: R
  - id: UniProtKB:P12023
    label: App
    gene_symbol: App
    organism: Mus musculus
    control_position: 301
    control_residue: R
- site_id: abeta_region
  label: Amyloid-beta peptide region (Abeta 1-42)
  description: >-
    The 42-residue amyloid-beta sequence of APP770 (Asp672-Ala713), released by beta-secretase
    cleavage after Met671 and gamma-secretase cleavage within the transmembrane segment. The
    pattern allows the three rodent substitutions (Arg5Gly, Tyr10Phe, His13Arg in Abeta
    numbering) that mouse and rat App carry; the hydrophobic core and C-terminal segment
    (KLVFFAEDVGSNKGAIIGLMVGGVVIA) are identical in human and mouse. Global alignment to APP shows
    no amyloid-beta sequence in APLP1, APLP2, Drosophila APPL or C. elegans APL-1: the aligned
    stretches differ at most positions, including the KLVFF core.
  anchor:
    id: UniProtKB:P05067
    label: APP
    organism: Homo sapiens
  anchor_sequence_version: 3
  site_source: UNIPROT_FEATURE
  motif:
    pattern_regex: DAEF[RG]HDSG[YF]EV[HR]HQKLVFFAEDVGSNKGAIIGLMVGGVVIA
    start: 672
    end: 713
    role: amyloid-beta peptide sequence
  required_for:
  - term:
      id: GO:1990000
      label: amyloid fibril formation
    strength: CONTRIBUTES
    rationale: >-
      Amyloid fibrils in this family are formed by the amyloid-beta peptide, so a member
      without this sequence has no fibril-forming product. Strength is CONTRIBUTES because the
      process term describes the self-assembly of a cleavage product, which also depends on
      secretase processing; the site is necessary for it but does not by itself establish it.
    supported_by:
    - reference_id: PMID:8265668
      supporting_text: Similar to the Drosophila, human, and mouse APP-related proteins, APL-1
        does not appear to contain the beta-amyloid peptide.
term_assessments:
- assessed_term:
    id: GO:1990000
    label: amyloid fibril formation
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    A property of the amyloid-beta cleavage products of APP, so it can only apply where the
    amyloid-beta region exists: the APP subfamily (SF7) and the Homininae APP copies in SF16.
    APLP1 (SF13), APLP2 (SF14) and the invertebrate members (SF15) lack the region and must not
    receive the term. No PAINT node in this family asserts it, so there is currently no IBA
    over-propagation to correct; this assessment records the boundary should one be added.
    Within SF7, rodent amyloid-beta differs at three positions from the human peptide; the
    ISO transfer to mouse App is a separate question about rodent peptide behavior and not a
    family-scope problem.
  determined_by_site: abeta_region
  applicable_subfamilies:
  - id: PANTHER:PTHR23103:SF7
    label: AMYLOID-BETA PRECURSOR PROTEIN
  - id: PANTHER:PTHR23103:SF16
    label: AMYLOID-BETA PRECURSOR PROTEIN
  supported_by:
  - reference_id: PMID:8265668
    supporting_text: Similar to the Drosophila, human, and mouse APP-related proteins, APL-1
      does not appear to contain the beta-amyloid peptide.
- assessed_term:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Conferred by the Kunitz (KPI) domain, which only APP (SF7, SF16) and APLP2 (SF14) encode.
    APLP1 and the invertebrate members have no KPI domain. Within APP and APLP2 the domain is
    present only in some splice isoforms (APP751 and APP770 but not the neuronal APP695), so
    even within the applicable subfamilies the term is isoform-specific. No PAINT node asserts
    it; existing annotations come from InterPro2GO and direct assays, which are correctly
    limited to KPI-containing members.
  determined_by_site: kpi_reactive_site
  applicable_subfamilies:
  - id: PANTHER:PTHR23103:SF7
    label: AMYLOID-BETA PRECURSOR PROTEIN
  - id: PANTHER:PTHR23103:SF16
    label: AMYLOID-BETA PRECURSOR PROTEIN
  - id: PANTHER:PTHR23103:SF14
    label: AMYLOID BETA PRECURSOR LIKE PROTEIN 2
  supported_by:
  - reference_id: PMID:2893291
    supporting_text: Partial sequencing of the genomic DNA encoding APP showed that the 225
      nucleotides are located in two exons.
- assessed_term:
    id: GO:0005507
    label: copper ion binding
  scope: RESIDUE_DETERMINED
  determined_by_site: cubd_copper_site
  scope_reason: >-
    The CuBD copper site is intact in APP and APLP2, partly retained in APLP1 (one of three
    ligands) and absent from Drosophila APPL and C. elegans APL-1, so the term is not safe at
    the Bilateria node. A subfamily list would be wrong for SF15, which mixes members with and
    without any characterized copper site. APP additionally binds copper through amyloid-beta
    histidines. APLP1 copper binding has not been settled experimentally, so the APLP1 gene
    review's retention of the broader transition metal ion binding term is not contradicted
    here. No PAINT node asserts copper ion binding.
  supported_by:
  - reference_id: PMID:7913895
    supporting_text: The two essential histidines in the type II copper binding site of APP
      are conserved in the related protein APLP2.
  - reference_id: PMID:12611883
    supporting_text: we solved the structure of the APP copper binding domain (CuBD) and found
      that it contains a novel copper binding site that favors Cu(I) coordination
- assessed_term:
    id: GO:0008201
    label: heparin binding
  scope: FAMILY_WIDE
  scope_reason: >-
    Heparin binding by the E2 domain has been shown structurally for both APLP1 and the
    C. elegans ortholog APL-1, and APP binds heparan sulfate proteoglycans; the family thus
    has heparin binding on both sides of the Bilateria node. A PAINT assertion at PTN000559854
    would be justified. No node currently asserts it.
  supported_by:
  - reference_id: PMID:21930949
    supporting_text: Here we report the crystal structure of a complex between heparin and the
      E2 domain of APLP1, which harbors the conserved high affinity heparin binding site of the
      full-length molecule.
  - reference_id: PMID:19906646
    supporting_text: Based on the crystal structure, we are able to map, using site-directed
      mutagenesis, a surface groove on E2 to which heparin may bind.
  - reference_id: PMID:7913895
    supporting_text: Previously it has been shown that the extracellular domain of
      transmembrane beta A4 amyloid precursor protein (APP) includes binding sites for zinc(II)
      and for molecules of the extracellular matrix such as collagen, laminin and the heparin
      sulfate chains of proteoglycans (HSPGs).
- assessed_term:
    id: GO:0007409
    label: axonogenesis
  scope: FAMILY_WIDE
  scope_reason: >-
    Asserted at Bilateria and supported in an invertebrate member as well as in vertebrate APP.
    Paralog redundancy means the contribution of APLP1 and APLP2 is hard to separate, but there
    is no evidence of loss in any lineage.
  supported_by:
  - reference_id: PMID:16052209
    supporting_text: We show here that human APP and Drosophila APP-Like (APPL) can induce
      postdevelopmental axonal arborization, which depends critically on a conserved motif in
      the C-terminus and requires interaction with the Abelson (Abl) tyrosine kinase.
  - reference_id: PMID:11050115
    supporting_text: These data indicate redundancy between APLP2 and both other family members
      and corroborate a key physiological role for APLP2.
