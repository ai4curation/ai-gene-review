family_id: PANTHER:PTHR23103
family_name: ALZHEIMER'S DISEASE BETA-AMYLOID RELATED
preferred_name: Amyloid-beta precursor protein (APP/APLP) family
summary: >-
  The APP family are single-pass type I membrane glycoproteins with a large ectodomain made of
  an E1 region (a growth-factor-like heparin-binding subdomain and a copper-binding subdomain),
  an acidic region, an E2 (CAPPD) domain that binds heparan sulfate and mediates dimerization,
  and a short cytoplasmic tail with a YENPxY/NPxY endocytosis and adaptor-binding motif.
  Members act at the cell surface as adhesion molecules and receptor-like proteins in neurons
  and other tissues, and are processed by alpha-, beta- and gamma-secretases into soluble
  ectodomains, C-terminal fragments and intracellular domains. The family is found throughout
  Bilateria, with single members in invertebrates (Drosophila APPL, C. elegans APL-1) and three
  paralogs in vertebrates (APP, APLP1, APLP2) that arose by duplication in the Euteleostomi
  lineage. The paralogs are partly redundant: mice lacking APLP2 together with APP or APLP1 die
  early after birth. Two features are not family-wide. The amyloid-beta region, the source of
  the fibril-forming Abeta peptides of Alzheimer disease, exists only in APP; APLP1, APLP2,
  APPL and APL-1 lack it. The Kunitz protease inhibitor (KPI) domain is present only in APP and
  APLP2, and in both only in alternatively spliced isoforms (APP751/770, not neuronal APP695).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The shared ectodomain architecture (E1 growth-factor-like and E2 heparin-binding domains), the
  transmembrane segment and the cytoplasmic NPxY motif are conserved from nematodes and flies to
  vertebrates, and cell-surface adhesion, heparin binding and neuronal process outgrowth are
  supported in both invertebrate and vertebrate members. The exceptions are specific
  sequence modules rather than whole clades losing function. The amyloid-beta region is
  restricted to APP (SF7, plus the duplicate Homininae APP gene models in SF16). The KPI domain is restricted to APP
  and APLP2 (SF7, SF16, SF14) and is isoform-dependent within both. The canonical copper site of
  the E1 copper-binding subdomain (APP His147, His151, Tyr168) is intact in APP and APLP2,
  partly replaced in APLP1 (Ser, His, Ser at the equivalent positions), and absent from fly APPL
  and worm APL-1. SF15 is PANTHER's default subfamily and is not a clade: it holds the
  invertebrate members together with cnidarian and placozoan sequences outside the Bilateria
  node.
