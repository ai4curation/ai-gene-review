notes: >-
  Tree topology, subfamily assignments and PTN positions come from the PANTHER 19 treeinfo
  service (pantherdb.org/services/oai/pantherdb/treeinfo), unfiltered. Seed ids were resolved
  with UniProt REST queries (ZDB-GENE-000616-13 is zebrafish appa, ZDB-GENE-020220-1 is appb;
  MGI:88059, 88046 and 88047 are App, Aplp1 and Aplp2). Residue correspondences were obtained by
  global pairwise alignment (Biopython PairwiseAligner, BLOSUM62, gap open -10, extend -0.5) of
  current UniProt sequences of P05067 (v3), P12023, Q06481, Q06335, P51693, Q03157, P14599 and
  Q10651 to human APP. The central finding is that this family's PAINT annotation is
  conservative: no amyloid-beta, amyloid fibril, KPI or copper term is asserted at any node,
  so the APP-specific properties are not propagated to APLP1, APLP2 or the invertebrate
  members. The PAINT terms that do reach those members (central nervous system development,
  axonogenesis, neuron projection, neuronal cell body) are general neural terms with seeds on
  both sides of the deep nodes. The one structural gap is coverage rather than error: plasma
  membrane and Golgi apparatus are asserted twice, at the APP and APLP1 nodes, and APLP2
  receives neither; heparin binding, which is shown for APLP1 and APL-1, is not asserted at
  all.
