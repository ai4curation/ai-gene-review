family_id: PANTHER:PTHR14514
family_name: PKA ANCHORING PROTEIN
preferred_name: Giant nesprins (nesprin-1/SYNE1, nesprin-2/SYNE2) and the KASH-less paralog mAKAP/AKAP6
summary: >-
  Deuterostome family of giant spectrin-repeat proteins. It covers two chordate
  lineages that arose by a duplication (PANTHER node PTN000376568), plus a single-copy
  sea-urchin KASH protein.
  (1) The nesprin lineage has the vertebrate paralogs nesprin-1 (SYNE1, SF3) and
  nesprin-2 (SYNE2, SF4). These are the giant KASH proteins of the outer nuclear
  membrane. Their C-terminal KASH peptide binds SUN1/SUN2 trimers in the perinuclear
  space to form LINC complexes. Their N-terminal calponin-homology domains bind F-actin,
  and their spectrin-repeat rods recruit dynein-dynactin (via BICD2) and kinesin-1. In
  this way they anchor the cytoskeleton to the nuclear envelope and transmit the forces
  for nuclear migration, nuclear anchorage and centrosome-nucleus coupling.
  (2) The AKAP6 lineage (SF2, muscle A-kinase anchoring protein, mAKAP) is a
  PKA-anchoring signalling scaffold of the cardiac-myocyte nuclear envelope and
  sarcoplasmic reticulum. It organizes PKA, RyR2, PDE4D3 and PP2A. No vertebrate AKAP6
  examined has a KASH domain, and it reaches the nuclear envelope indirectly by binding
  nesprin-1alpha. The single amphioxus member of the AKAP6 clade and the sea-urchin
  member (SF7) both keep a KASH domain.
  PANTHER's family name reflects the AKAP6 lineage only. The core molecular function of
  the family's best-studied members (nesprin-1/2) is nuclear-envelope cytoskeletal
  anchoring, not PKA anchoring. Invertebrate nesprin orthologs are classified in other
  PANTHER families (see notes).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family combines the KASH-bearing nesprin-1/2 LINC anchors (SF3, SF4) with the
  vertebrate AKAP6 lineage (SF2). AKAP6 lacks the KASH domain and functions as a
  PKA/RyR2 signalling scaffold that is itself tethered to the nuclear envelope by
  nesprin-1alpha. Location terms (nuclear membrane, sarcoplasmic reticulum) are shared.
  The defining molecular function of nesprins (cytoskeleton-nuclear membrane anchor
  activity, via KASH-SUN pairing) does not hold for vertebrate AKAP6. The cardiac
  signalling processes of AKAP6 do not hold for nesprins. Within the nesprin lineage,
  nesprin-1 and nesprin-2 are coherent (redundant in neuronal migration, both LINC KASH
  partners).
