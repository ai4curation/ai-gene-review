review_status: NEEDS_REVIEW
reviewed_by: claude-code (AI-assisted PANTHER family review)
review_date: "2026-09-27"
notes: >-
  All PTN ids, GO ids, seeds and snapshot dates are verbatim from the cached
  PTHR14514-paint.tsv. Seed ids were resolved via UniProt/MGI: MGI:2449316 = Syne2,
  MGI:1927152 = Syne1, MGI:3050566 = Akap6 (mouse), RGD:69412 = Akap6 (rat, Q9WVC7).
  Tree topology is from the live PANTHER 19 treeinfo service (2026-09-27). The root is
  PTN008556068 (Deuterostomia, 45 leaves), a speciation node over the sea-urchin SF7
  leaf and the chordate duplication PTN000376568. That duplication splits into the
  AKAP6 clade PTN009019570 (Chordata: 20 vertebrate AKAP6 leaves under PTN002684320 plus
  one amphioxus leaf) and the nesprin duplication PTN009019575 (SYNE2 node PTN008556069,
  SYNE1 node PTN008556071). The KASH-domain survey queried the InterPro API for IPR012315
  on each tree leaf's UniProt accession (2026-09-27). Four leaf accessions are deleted
  from UniProt (cat AKAP6 A0A5K1VU54, cat SYNE2 A0A337STE8, cat SYNE1 A0A5F5XHF0,
  zebrafish syne2b A0A8M9QAE9) and could not be checked. All 19 remaining vertebrate
  AKAP6 leaves lack IPR012315. The amphioxus AKAP6-clade leaf, the sea-urchin leaf and
  all 20 resolvable nesprin-1/2 leaves have it.

  Naming and grouping oddities, stated as observations. (a) "PKA ANCHORING PROTEIN" is
  named after the AKAP6 lineage. The PANTHER GO-slim MF shown on nesprin leaves (protein
  kinase A binding, transmembrane transporter binding) is family-level and AKAP6-driven.
  It is not evidence about nesprins. (b) Nesprin orthologs are fragmented across at
  least three PANTHER families in the PANTHER 19 trees. PTHR14514 holds human/mouse
  SYNE1/SYNE2 and zebrafish syne1a/syne2b. PTHR21524 ("SPECTRIN REPEAT CONTAINING
  NUCLEAR ENVELOPE PROTEIN 2") holds C. elegans ANC-1 and Drosophila Klarsicht (both
  SF5), and also rat Syne1/Syne2, chicken SYNE2 and Xenopus syne1/syne2. PTHR47535
  ("MUSCLE-SPECIFIC PROTEIN 300 KDA, ISOFORM G") holds Drosophila Msp300 (SF10),
  nesprin-3/SYNE3, calmin, and zebrafish syne1b/syne2a plus a gorilla SYNE1 model. Giant,
  repeat-rich gene models match these HMMs partially, so ortholog placement across
  families is unreliable. Invertebrate KASH proteins (ANC-1, Klar, Msp300) and nesprin-4
  (PTHR21640) and KASH5 (PTHR47300) therefore inherit nothing from this family's PAINT
  curation, and the reverse is also true. The nesprins are described as orthologous to
  Msp300 (PMID:12408964), yet Msp300 is in a different family. No ancestral placement
  across these families is asserted here. (c) CEP68 appears in the InterPro inventory
  under SF2 but is not a tree leaf (see SF2 description).

  Module recommendations: linc_complex.yaml and nucleokinesis.yaml give the nesprin
  family descriptor as PANTHER:PTHR14514 / "PKA ANCHORING PROTEIN". The id and label are
  correct, but the descriptor also covers KASH-less AKAP6. A more precise grounding is
  the subfamilies PTHR14514:SF3 "NESPRIN-1" and PTHR14514:SF4 "NESPRIN-2", or the PAINT
  node PANTHER:PTN009019575 (nesprin-1/2 duplication node), which carries the
  nuclear-migration and centrosome-localization IBDs. The GO:0140444 IBD these modules
  rely on is at the root PTN008556068 and needs an IRD at PTN002684320 to stop it
  reaching AKAP6. The linc_complex module statement that nesprin-3 is in PTHR47535 is
  confirmed (UniProt Q6ZMZ3: PTHR47535:SF2), as are nesprin-4 in PTHR21640 and KASH5 in
  PTHR47300.
