subfamilies:
  - subfamily_id: PANTHER:PTHR14514:SF3
    label: NESPRIN-1
    description: >-
      Vertebrate nesprin-1 (SYNE1). With SF4 it forms the nesprin duplication node
      PTN009019575 (23 leaves in the PANTHER 19 tree), which carries the nesprin-specific
      IBDs (sarcomere, nuclear migration, centrosome localization, regulation of cilium
      assembly).
    representative_members:
      - id: UniProtKB:Q8NF91
        label: Nesprin-1
        gene_symbol: SYNE1
        organism: Homo sapiens
        gene_review: genes/human/SYNE1/SYNE1-ai-review.yaml
      - id: UniProtKB:Q6ZWR6
        label: Nesprin-1
        gene_symbol: Syne1
        organism: Mus musculus
  - subfamily_id: PANTHER:PTHR14514:SF4
    label: NESPRIN-2
    description: >-
      Vertebrate nesprin-2 (SYNE2). Giant nesprin-2G binds F-actin (TAN lines), and its
      spectrin-repeat region recruits BICD2-dynein-dynactin and kinesin-1 (LEWD motif)
      for neuronal nucleokinesis.
    representative_members:
      - id: UniProtKB:Q8WXH0
        label: Nesprin-2
        gene_symbol: SYNE2
        organism: Homo sapiens
        gene_review: genes/human/SYNE2/SYNE2-ai-review.yaml
      - id: UniProtKB:Q6ZWQ0
        label: Nesprin-2
        gene_symbol: Syne2
        organism: Mus musculus
  - subfamily_id: PANTHER:PTHR14514:SF2
    label: A-KINASE ANCHOR PROTEIN 6
    clade_node_id: PANTHER:PTN009019570
    representative_members:
      - id: UniProtKB:Q13023
        label: A-kinase anchor protein 6
        gene_symbol: AKAP6
        organism: Homo sapiens
      - id: UniProtKB:Q9WVC7
        label: A-kinase anchor protein 6
        gene_symbol: Akap6
        organism: Rattus norvegicus
    diverged_from_family: true
    divergence_description: >-
      Vertebrate AKAP6 (mAKAP) is a KASH-less paralog of the nesprins. All 19 resolvable vertebrate
      AKAP6 leaves in the PANTHER 19 tree lack InterPro IPR012315 (KASH domain), while
      the amphioxus SF2 leaf (A0A9J7LS23) and the sea-urchin SF7 leaf (A0A7M7PT04) have
      it. AKAP6 acts as a PKA-anchoring scaffold for RyR2, PDE4D3 and PP2A at the
      cardiac-myocyte nuclear envelope and sarcoplasmic reticulum. It does not bind SUN
      proteins itself: its third spectrin repeat binds nesprin-1alpha, which serves as
      its nuclear-envelope receptor. The nesprin molecular function (KASH-mediated
      cytoskeleton-nuclear membrane anchoring) should therefore not descend to
      vertebrate AKAP6. Two further entries are classified into SF2 in the InterPro
      member inventory: CEP68 (human Q76N32, mouse Q8C0D9, orangutan Q5RCQ2). UniProt
      lists no PANTHER or Pfam spectrin cross-reference for human CEP68, and it is not
      a leaf of the PANTHER 19 tree. Its presence is probably a partial-match artefact
      of the inventory and says nothing about AKAP6 or nesprin function.
  - subfamily_id: PANTHER:PTHR14514:SF7
    label: KASH DOMAIN-CONTAINING PROTEIN
    description: >-
      Single sea-urchin (Strongylocentrotus purpuratus) KASH protein (A0A7M7PT04, KASH
      domain at residues 2538-2597), outside the chordate AKAP6/nesprin duplication.
      Uncharacterized. It shows that the KASH domain predates the chordate duplication.
    representative_members:
      - id: UniProtKB:A0A7M7PT04
        label: KASH domain-containing protein
        organism: Strongylocentrotus purpuratus

node_assessments:
  # --- PTN008556068: family root, Deuterostomia ---
  - node_id: PANTHER:PTN008556068
    asserted_term:
      id: GO:0140444
      label: cytoskeleton-nuclear membrane anchor activity
    node_taxon:
      id: NCBITaxon:33511
      label: Deuterostomia
    paint_snapshot: "20250821"
    seeds:
      - id: UniProtKB:Q8NF91
        label: Nesprin-1
        gene_symbol: SYNE1
        organism: Homo sapiens
      - id: UniProtKB:Q8WXH0
        label: Nesprin-2
        gene_symbol: SYNE2
        organism: Homo sapiens
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Both human nesprin reviews ACCEPT this as the core function (KASH peptide binds SUN
      in the perinuclear space; CH domains and motor adaptors engage the cytoskeleton).
      Root placement is defensible: the sea-urchin member and the amphioxus member of the
      AKAP6 clade both have a KASH domain, so KASH-based nuclear-envelope anchoring was
      probably present before the chordate duplication. But the IBD also descends into
      vertebrate AKAP6 (SF2). None of its 19 resolvable vertebrate leaves has a KASH domain, and it
      reaches the nuclear envelope only by binding nesprin-1alpha. It is anchored by a
      nesprin, not an anchor itself. Recommend an IRD/NOT for GO:0140444 at the
      vertebrate AKAP6 node PTN002684320 (Euteleostomi; excludes the KASH-bearing
      amphioxus leaf). The alternative is to move the IBD down to the nesprin node
      PTN009019575, which would also withdraw it from the uncharacterized sea-urchin and
      amphioxus proteins.
    affected_subfamilies:
      - id: PANTHER:PTHR14514:SF2
        label: A-KINASE ANCHOR PROTEIN 6
  - node_id: PANTHER:PTN008556068
    asserted_term:
      id: GO:0031965
      label: nuclear membrane
    node_taxon:
      id: NCBITaxon:33511
      label: Deuterostomia
    paint_snapshot: "20251219"
    seeds:
      - id: MGI:MGI:2449316
        label: Syne2
        gene_symbol: Syne2
        organism: Mus musculus
      - id: MGI:MGI:3050566
        label: Akap6
        gene_symbol: Akap6
        organism: Mus musculus
      - id: RGD:69412
        label: Akap6
        gene_symbol: Akap6
        organism: Rattus norvegicus
      - id: UniProtKB:Q8NF91
        label: Nesprin-1
        gene_symbol: SYNE1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Holds in both lineages, for different reasons. Nesprins are tail-anchored in the
      outer nuclear membrane by KASH (SYNE1 and SYNE2 reviews ACCEPT the IBA). AKAP6 is
      held at the cytoplasmic face of the nuclear envelope by nesprin-1alpha (UniProt:
      "Nucleus membrane"). Seeds span both lineages. Sound.
  - node_id: PANTHER:PTN008556068
    asserted_term:
      id: GO:0016529
      label: sarcoplasmic reticulum
    node_taxon:
      id: NCBITaxon:33511
      label: Deuterostomia
    paint_snapshot: "20250821"
    seeds:
      - id: RGD:69412
        label: Akap6
        gene_symbol: Akap6
        organism: Rattus norvegicus
      - id: UniProtKB:Q13023
        label: A-kinase anchor protein 6
        gene_symbol: AKAP6
        organism: Homo sapiens
      - id: UniProtKB:Q8WXH0
        label: Nesprin-2
        gene_symbol: SYNE2
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      A core location for AKAP6 (RyR2 signalosome), and a real but non-core location for
      muscle nesprin isoforms (the outer nuclear membrane is continuous with the SR;
      nesprin-2 epitopes associate with the SR). The SYNE1 and SYNE2 reviews keep the
      IBA as KEEP_AS_NON_CORE. Acceptable at the root as a muscle-cell location.
      It should not be read as a primary nesprin location.

  # --- PTN009019575: nesprin-1/2 duplication node (no taxon recorded) ---
  - node_id: PANTHER:PTN009019575
    asserted_term:
      id: GO:0007097
      label: nuclear migration
    paint_snapshot: "20250821"
    seeds:
      - id: MGI:MGI:1927152
        label: Syne1
        gene_symbol: Syne1
        organism: Mus musculus
      - id: MGI:MGI:2449316
        label: Syne2
        gene_symbol: Syne2
        organism: Mus musculus
      - id: UniProtKB:Q8WXH0
        label: Nesprin-2
        gene_symbol: SYNE2
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Correctly placed on the nesprin-1/2 node, so it does not reach AKAP6. Both
      nesprins do part of the work of nuclear migration: they provide the KASH-anchored
      link through which actin flow and motor force move the nucleus. Nesprin-1 and
      nesprin-2 act redundantly in neuronal migration, and nesprin-2G drives actin-
      dependent nuclear movement in fibroblasts. Both reviews ACCEPT.
  - node_id: PANTHER:PTN009019575
    asserted_term:
      id: GO:0051642
      label: centrosome localization
    paint_snapshot: "20250821"
    seeds:
      - id: MGI:MGI:1927152
        label: Syne1
        gene_symbol: Syne1
        organism: Mus musculus
      - id: MGI:MGI:2449316
        label: Syne2
        gene_symbol: Syne2
        organism: Mus musculus
      - id: UniProtKB:Q8WXH0
        label: Nesprin-2
        gene_symbol: SYNE2
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Nesprin-1/2 LINC complexes couple the centrosome to the nucleus in neural
      progenitors and neurons, and nesprin-2G-dependent nuclear movement reorients the
      centrosome in fibroblasts. Both reviews ACCEPT. Correct scope.
  - node_id: PANTHER:PTN009019575
    asserted_term:
      id: GO:0030017
      label: sarcomere
    paint_snapshot: "20250821"
    seeds:
      - id: MGI:MGI:2449316
        label: Syne2
        gene_symbol: Syne2
        organism: Mus musculus
      - id: UniProtKB:Q8NF91
        label: Nesprin-1
        gene_symbol: SYNE1
        organism: Homo sapiens
      - id: UniProtKB:Q8WXH0
        label: Nesprin-2
        gene_symbol: SYNE2
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Large nesprin-1 and nesprin-2 isoforms localize to sarcomeric Z-lines in striated
      muscle. Real, but isoform- and tissue-specific. Both reviews keep it as
      KEEP_AS_NON_CORE.
  - node_id: PANTHER:PTN009019575
    asserted_term:
      id: GO:1902017
      label: regulation of cilium assembly
    paint_snapshot: "20250821"
    seeds:
      - id: MGI:MGI:1927152
        label: Syne1
        gene_symbol: Syne1
        organism: Mus musculus
      - id: MGI:MGI:2449316
        label: Syne2
        gene_symbol: Syne2
        organism: Mus musculus
    assessment: SOUND
    assessment_reason: >-
      Nesprin-1/2 are required for centrosome migration to the apical surface during
      early ciliogenesis. Both reviews retain the IBA as KEEP_AS_NON_CORE because the
      ciliary effect is an indirect consequence of centrosome-nucleus positioning. The
      placement is sound (nesprin clade only). The term is peripheral.

  # --- PTN009019570: AKAP6 clade, Chordata ---
  - node_id: PANTHER:PTN009019570
    asserted_term:
      id: GO:0010880
      label: regulation of release of sequestered calcium ion into cytosol by sarcoplasmic reticulum
    node_taxon:
      id: NCBITaxon:7711
      label: Chordata
    paint_snapshot: "20250821"
    seeds:
      - id: RGD:69412
        label: Akap6
        gene_symbol: Akap6
        organism: Rattus norvegicus
    assessment: TOO_DEEP
    assessment_reason: >-
      The seed is rodent mAKAP, which anchors PKA to RyR2 in cardiomyocytes. Placement on
      the AKAP6 clade correctly keeps the term away from the nesprins. However,
      PTN009019570 is the Chordata node, and its only non-vertebrate descendant is the
      amphioxus protein A0A9J7LS23. Unlike the vertebrate AKAP6 proteins, that protein has a
      KASH domain, so it is structurally nesprin-like rather than mAKAP-like. The
      vertebrate node PTN002684320 (Euteleostomi) would match the evidence. No AKAP6
      gene review exists in this repository, so the vertebrate function is taken from
      the PAINT seed and the literature, not adjudicated here.
  - node_id: PANTHER:PTN009019570
    asserted_term:
      id: GO:0060306
      label: regulation of membrane repolarization
    node_taxon:
      id: NCBITaxon:7711
      label: Chordata
    paint_snapshot: "20250821"
    seeds:
      - id: UniProtKB:Q13023
        label: A-kinase anchor protein 6
        gene_symbol: AKAP6
        organism: Homo sapiens
    assessment: TOO_DEEP
    assessment_reason: >-
      Cardiac electrophysiology term seeded by a single human AKAP6 annotation. Same
      scoping problem as GO:0010880: at the Chordata node it reaches the KASH-bearing
      amphioxus protein. It should sit at the vertebrate AKAP6 node PTN002684320, if it
      is kept at all. Not adjudicated against an AKAP6 gene review. It is probably an
      indirect physiological readout of the mAKAP signalling scaffold, not a process
      the scaffold performs.
  - node_id: PANTHER:PTN009019570
    asserted_term:
      id: GO:1901897
      label: regulation of relaxation of cardiac muscle
    node_taxon:
      id: NCBITaxon:7711
      label: Chordata
    paint_snapshot: "20250821"
    seeds:
      - id: RGD:69412
        label: Akap6
        gene_symbol: Akap6
        organism: Rattus norvegicus
    assessment: TOO_DEEP
    assessment_reason: >-
      Vertebrate-cardiac physiology term seeded by rat Akap6. It should be restricted to
      vertebrate AKAP6 (PTN002684320) for the same reason as the other two AKAP6-clade
      IBDs. It does not leak into the nesprins.

term_assessments:
  - assessed_term:
      id: GO:0140444
      label: cytoskeleton-nuclear membrane anchor activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The defining function of the KASH-bearing nesprins (SF3, SF4), accepted as core in
      both human nesprin reviews and used for them in the linc_complex and nucleokinesis
      modules. It must not descend to vertebrate AKAP6 (SF2). AKAP6 lacks the KASH
      domain and is itself anchored to the nuclear envelope by nesprin-1alpha. The
      uncharacterized KASH-bearing sea-urchin (SF7) and amphioxus (SF2) proteins are
      plausible but untested carriers.
    applicable_subfamilies:
      - id: PANTHER:PTHR14514:SF3
        label: NESPRIN-1
      - id: PANTHER:PTHR14514:SF4
        label: NESPRIN-2
    supported_by:
      - reference_id: PMID:18396275
        supporting_text: >-
          the KASH domains of Nesprins 1, 2 and 3 interact promiscuously with luminal
          domains of Sun1 and Sun2.
      - reference_id: PMID:15652351
        supporting_text: >-
          We now demonstrate that the integral membrane protein
          nesprin-1alpha serves as a receptor for mAKAP on the nuclear envelope in cardiac
          myocytes.
  - assessed_term:
      id: GO:0007097
      label: nuclear migration
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Nesprin-1 and nesprin-2 are the KASH halves of the LINC bridges that move nuclei,
      and they act redundantly in neuronal migration. No such role is known for AKAP6,
      and PAINT already scopes the term correctly to the nesprin node PTN009019575.
    applicable_subfamilies:
      - id: PANTHER:PTHR14514:SF3
        label: NESPRIN-1
      - id: PANTHER:PTHR14514:SF4
        label: NESPRIN-2
    supported_by:
      - reference_id: PMID:19874786
        supporting_text: >-
          Syne-1 and Syne-2 act redundantly in the midbrain, the cerebellum and the
          hindbrain
      - reference_id: PMID:20724637
        supporting_text: >-
          Inhibition of nesprin2G, SUN2, or actin prevented nuclear movement and
          centrosome reorientation.
  - assessed_term:
      id: GO:0031965
      label: nuclear membrane
    scope: FAMILY_WIDE
    scope_reason: >-
      Every characterized member is at the nuclear envelope: nesprins through their KASH
      transmembrane anchor, AKAP6 through binding nesprin-1alpha. The mechanisms differ
      but the location is shared. The existing root IBD is appropriate.
    supported_by:
      - reference_id: PMID:15652351
        supporting_text: >-
          Muscle A-kinase anchoring protein (mAKAP) is a scaffold protein found
          principally at the nuclear envelope of striated myocytes.
  - assessed_term:
      id: GO:0106094
      label: nuclear membrane microtubule tethering complex
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Nesprin-1 and nesprin-2 are KASH subunits of somatic LINC complexes. Both member
      reviews MODIFY GOA's meiotic GO:0034993 rows to this non-meiotic parent, and the
      linc_complex module uses it for the somatic complex. AKAP6 is not a LINC subunit.
      No PAINT node currently asserts either complex term in this family.
    applicable_subfamilies:
      - id: PANTHER:PTHR14514:SF3
        label: NESPRIN-1
      - id: PANTHER:PTHR14514:SF4
        label: NESPRIN-2
    supported_by:
      - reference_id: PMID:18396275
        supporting_text: >-
          the KASH domains of Nesprins 1, 2 and 3 interact promiscuously with luminal
          domains of Sun1 and Sun2.

