  scope: FAMILY_WIDE
  scope_reason: The member inventory contains RlmF, METTL16 and small-molecule methyltransferases, whereas
    the integrated InterPro prose emphasizes the first two groups. Substrate class and RNA target therefore
    require subfamily-level evidence. Fungal NCU11362 should be compared with the METTL16 branch, not
    bacterial RlmF or specialized-metabolite enzymes. SF0 itself contains RlmF, METTL16 and PsiM entries,
    so this boundary cannot be represented by granting a substrate-specific term to SF0.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-c/PTHR13393.md
    supporting_text: 'This family includes ribosomal RNA large subunit methyltransferase F (RlmF), and
      related proteins, including methyltransferase-like protein 16 (METTL16). METTL16 is a conserved
      RNA methyltransferase which interacts specifically with the MALAT1 triple helix. METTL16 shows nuclear
      localisation [[cite:PUB00085149]]. Another functional study indicates that METTL16 regulates expression
      of human MAT2A, which encodes the SAM synthetase expressed in most cells. Furthermore, results indicate
      that METTL16 is the long-unknown methyltransferase for the U6 spliceosomal small nuclear RNA (snRNA)
      and it has evolved an additional function in vertebrates to control SAM homeostasis by post-transcriptionally
      regulating SAM synthetase gene expression [[cite:PUB00086421]].


      RlmF methylates the adenine in position 1618 of 23S rRNA [[cite:PUB00052324]]. This family also
      includes psilocybin synthase (PsiM), which is a methyltransferase involved in the biosynthesis of
      the psychotropic agent psilocybin from the mushroom Psilocybe cubensis [[cite:PUB00086873]].'
