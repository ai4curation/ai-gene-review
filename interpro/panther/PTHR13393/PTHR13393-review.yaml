family_id: PANTHER:PTHR13393
family_name: SAM-DEPENDENT METHYLTRANSFERASE
preferred_name: RlmF/METTL16 and related SAM-dependent methyltransferases
summary: Members include bacterial rRNA methyltransferase RlmF, eukaryotic METTL16/U6 RNA methyltransferases
  and psilocybin synthase PsiM proteins. METTL16-dependent U6 modification connects RNA methylation to
  splicing; vertebrate MAT2A regulation is an additional regulatory deployment. Neither a U6 substrate
  nor RNA methylation itself follows automatically from this broad PANTHER assignment.
functional_coherence: HETEROGENEOUS
coherence_reason: Both curated IPR010286 and the member inventory explicitly include RlmF, METTL16 and
  psilocybin synthase PsiM. Thus substrate divergence is documented in the curated source itself, not
  inferred from names alone. SF0 contains multiple substrate classes, so its METTL16 label is not a safe
  grant of U6 methylation. NCU11362 requires a METTL16-specific comparison, and vertebrate MAT2A regulation
  is an additional restricted function.
subfamilies:
- subfamily_id: PANTHER:PTHR13393:SF0
  label: RNA N6-ADENOSINE-METHYLTRANSFERASE METTL16
  description: The member inventory contains RlmF, METTL16 and small-molecule methyltransferases, whereas
    the integrated InterPro prose emphasizes the first two groups. Substrate class and RNA target therefore
    require subfamily-level evidence. Fungal NCU11362 should be compared with the METTL16 branch, not
    bacterial RlmF or specialized-metabolite enzymes. SF0 itself contains RlmF, METTL16 and PsiM entries,
    so this boundary cannot be represented by granting a substrate-specific term to SF0.
  representative_members:
  - id: UniProtKB:A7UX10
    gene_symbol: NCU11362
    organism: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
    label: DUF890 domain-containing protein
    gene_review: genes/NEUCR/NCU11362/NCU11362-ai-review.yaml
- label: Psilocybin synthase
  description: Characterized small-molecule N-methyltransferase PsiM; its substrate specificity differs
    from RlmF and METTL16 despite shared SF0 membership.
  representative_members:
  - id: UniProtKB:P0DPA9
    label: Psilocybin synthase
    organism: Psilocybe cubensis
    gene_symbol: psiM
