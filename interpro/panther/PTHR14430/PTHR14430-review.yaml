  scope: FAMILY_WIDE
  scope_reason: >-
    All local PTHR14430 representatives are Rab guanine-nucleotide exchange
    factors or sit in Rab GEF subfamilies, and the Opisthokonta PAINT node
    spans both fungal Sec2 and animal Rab3IP/Rab3IL1 branches.
  supported_by:
  - reference_id: file:interpro/panther/PTHR14430/PTHR14430-paint.tsv
    supporting_text: "PTHR14430\tPTN000374167\tGO:0005085\tF\tIBD\tfalse\tPomBase:SPAC23C4.10|RGD:619764|RGD:620650|SGD:S000005216|UniProtKB:Q8TBN0|UniProtKB:Q96QF0\ttaxon:33154\t20240813"
- assessed_term:
    id: GO:0051286
    label: cell tip
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Cell-tip active localization is a property of tip-growing long fungal Sec2
    proteins in PTHR14430:SF0, not of the animal Rab3IP/Rab3IL1 branches or the
    S. pombe Spo13 branch. S. cerevisiae Sec2 is a reviewed member-level
    exception inside SF0 because budding yeast uses cellular bud tips and bud
    necks for its mitotic Sec2/Sec4 exocytic sites.
  applicable_subfamilies:
  - id: PANTHER:PTHR14430:SF0
    label: SEC2P DOMAIN-CONTAINING PROTEIN
