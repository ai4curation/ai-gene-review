family_id: PANTHER:PTHR14430
family_name: RABIN3-RELATED
preferred_name: Sec2/Rabin3 Rab guanine-nucleotide exchange factor family
summary: >-
  PTHR14430 groups Sec2/Rabin3-family Rab guanine-nucleotide exchange factors.
  The reviewed fungal long-Sec2 proteins in S. cerevisiae SEC2, S. pombe sec2,
  C. albicans SEC2 and A. fumigatus sec2 sit in PTHR14430:SF0 and activate
  Sec4/Rab8-family exocytic Rabs, while S. pombe Spo13 is a short meiotic
  Sec2-family paralog in PTHR14430:SF4 and the animal Rab3IP and Rab3IL1
  branches form separate PTHR14430:SF2 and PTHR14430:SF5 subfamilies. PAINT's
  Opisthokonta GEF activity node is sound for both fungal and animal branches;
  its fungal cell-tip row is sound for true tip-growing long Sec2 proteins, but
  needs pruning below the fungal node to avoid over-propagating the cell-tip
  compartment to budding yeast.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family shares a Sec2/Rabin3 GEF domain and conserved Rab guanine
  nucleotide exchange activity, but the branches differ in substrate context
  and active localization: animal Rab3IP/RAB3IL1 proteins act with metazoan Rab
  trafficking systems, long fungal Sec2 proteins drive post-Golgi exocytosis,
  and the short fission-yeast Spo13 paralog is a meiosis-specific Ypt2 GEF at
  spindle-pole bodies rather than a vegetative cell-tip factor.
