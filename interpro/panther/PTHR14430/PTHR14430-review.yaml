  assessment: SOUND
  assessment_reason: >-
    The GO:0051286 IBD is sound at the fungal long-Sec2 node seeded by C.
    albicans SEC2 and S. pombe sec2. It also reaches S. cerevisiae SEC2, where
    the GO:0043332 mating projection tip HDA shows that a true cell-tip
    descendant still applies. GO:0051286 remains true but generic for budding
    yeast because the exact vegetative Sec2/Sec4 sites are cellular bud tip and
    bud neck rather than cell tip; the S. cerevisiae member review's
    MARK_AS_OVER_ANNOTATED action is therefore a member-level granularity call,
    not a request for loss from PTN001024876.
