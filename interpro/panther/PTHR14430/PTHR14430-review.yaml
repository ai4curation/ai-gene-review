    id: NCBITaxon:4751
    label: Fungi
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    PTN001024876 is mostly a sound fungal long-Sec2 placement: C. albicans and
    S. pombe sec2 are themselves the two cell-tip IBD seeds, and the same
    assertion is appropriate for the reviewed A. fumigatus sec2 long-Sec2
    member. The node also reaches S. cerevisiae SEC2, where the equivalent
    mitotic exocytic locations are cellular bud tip and cellular bud neck
    rather than GO:0051286 cell tip; the budding-yeast descendant should
    therefore be pruned without moving the whole IBD below the Candida/pombe
    sources.
  supported_by:
