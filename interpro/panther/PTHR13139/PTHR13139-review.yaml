family_id: PANTHER:PTHR13139
family_name: RING FINGER AND CCCH-TYPE ZINC FINGER DOMAIN-CONTAINING PROTEIN
preferred_name: Roquin/RLE-1 RING-ROQ RNA-binding E3 ligases
summary: >-
  PTHR13139 is the metazoan Roquin-domain family, combining an N-terminal RING
  E3 ubiquitin ligase module with an HEPN/ROQ/CCCH zinc-finger RNA-binding
  region. Human RC3H1/Roquin-1 in subfamily PTHR13139:SF6 and RC3H2/Roquin-2
  in PTHR13139:SF2 are vertebrate paralogs that bind stem-loop constitutive
  decay elements in target mRNA 3-prime UTRs, recruit CCR4-NOT deadenylase
  machinery through their C-terminal regions, and assemble polyubiquitin chains
  with E2 enzymes. The single-Roquin SF54 branch contains Drosophila Roquin and
  C. elegans RLE-1, preserving the RING/ROQ architecture while coupling it to
  invertebrate targets and, for RLE-1, direct ubiquitin-dependent degradation
  of NSY-1 and DAF-16.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The PAINT gains at PTN002295097 are coherent across the Metazoa Roquin node:
  stem-loop RNA recognition, mRNA binding, CCR4-NOT-mediated target decay,
  stress-granule recruitment and RING-dependent polyubiquitination are all
  documented for vertebrate and/or invertebrate Roquin proteins. Vertebrates
  duplicated the single ancestral Roquin into RC3H1 and RC3H2, and C. elegans
  RLE-1 has especially clear protein-substrate degradation targets, so the
  downstream immune, stress-response and longevity phenotypes are paralog- and
  lineage-specific even though the molecular architecture remains conserved.
notes: >-
  The compact PANTHER 19.0 tree was present in
  .cache/panther_trees/19.0/PTHR13139.json.gz. In that tree PTN002295097 is the
  Metazoa node used by all eight rows and contains 48 leaves spanning the
  vertebrate RC3H2 SF2 clade, the vertebrate RC3H1 SF6 clade and the SF54
  single-Roquin members. PTN002662193 is the SF2 clade for RC3H2 and
  PTN002662202 is the SF6 clade for RC3H1. PTHR13139:SF54 is not a single
  compact clade in the 19.0 compact tree, so no single SF54 clade node is
  assigned here.
