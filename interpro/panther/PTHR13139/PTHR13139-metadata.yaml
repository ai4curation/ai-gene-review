    name: Roquin domain-containing protein
    short: Roquin_domain
  description:
  - text: This family of proteins functions as post-transcriptional repressors, regulating
      mRNA stability by recognizing and binding to conserved stem loop motifs in the
      3'-UTR of target mRNAs, leading to mRNA deadenylation and degradation. Members
      of this family are involved in controlling inflammatory responses and the differentiation
      of T cells by modulating the expression of specific genes. They also interact
      with miRNAs, influencing microRNA homeostasis and processing. Additionally,
      these proteins possess ubiquitin E3 ligase activity, pairing with various E2
      enzymes to produce polyubiquitin chains, which can target proteins for degradation.
      They can bind to double-stranded RNA, which may regulate their E3 ligase activity.
