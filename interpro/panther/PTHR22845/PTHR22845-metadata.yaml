  name:
    name: Apoptotic protease-activating factor 1
    short: Apaf-1
  description:
  - text: This family of proteins regulates programmed cell death and is essential
      for normal brain development. Members of this family mediate the cytochrome
      c-dependent autocatalytic activation of pro-caspase-9, leading to the subsequent
      activation of caspase-3 and the execution of apoptosis. This process is ATP-dependent.
      The proteins are autoinhibited in their monomeric form by a bound ADP at the
      nucleotide binding site. Upon exchange of ADP for ATP and binding of cytochrome
      c, a significant conformational change occurs, allowing oligomerization and
      the activation of the apoptotic cascade. Additionally, these proteins contain
      a CARD domain that is responsible for mediating interactions with other proteins
      such as APIP.
