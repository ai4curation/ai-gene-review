term_assessments:
- assessed_term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Periplasmic-ligand transmembrane chemoreceptors make up SF120, SF114, SF119 and SF39,
    and the GO definition (transmitting a signal from one side of the membrane to the
    other) fits them. KT2440 McpS and PcaY, the exemplars of the chemotaxis module's
    receptor annoton, are SF120 members with two transmembrane helices flanking a
    ligand-binding domain. SF112 and SF118 hold soluble or rhodopsin-coupled transducers
    and lysozyme-like proteins and are excluded.
  applicable_subfamilies:
  - id: PANTHER:PTHR32089:SF120
    label: METHYL-ACCEPTING CHEMOTAXIS PROTEIN TLPQ
  - id: PANTHER:PTHR32089:SF114
    label: METHYL-ACCEPTING CHEMOTAXIS PROTEIN MCPB
  - id: PANTHER:PTHR32089:SF119
    label: METHYL-ACCEPTING CHEMOTAXIS PROTEIN CTPL
