family_id: PANTHER:PTHR32089
family_name: METHYL-ACCEPTING CHEMOTAXIS PROTEIN MCPB
preferred_name: Methyl-accepting chemotaxis receptor family (non-enterobacterial lineages)
summary: >-
  A large PANTHER family of methyl-accepting chemotaxis protein (MCP) signalling-domain
  proteins from Pseudomonas, Bacillus, Vibrio, halophilic archaea and other prokaryotes.
  Most members are transmembrane chemoreceptors: a periplasmic ligand-binding domain
  (for example the dCache or HBM domains of P. putida KT2440 McpS and PcaY), two
  transmembrane helices, a HAMP domain and a cytoplasmic signalling domain that binds
  CheW and CheA and is reversibly methylated during adaptation. KT2440 McpS senses
  tricarboxylic-acid-cycle intermediates and PcaY senses aromatic carboxylates. The family
  also includes cytoplasmic transducers (the haem-based aerotaxis transducer HemAT of
  B. subtilis and Halobacterium), archaeal transducers that receive signals from sensory
  rhodopsins within the membrane, the Vibrio TcpI pilus regulator, and a pair of
  Dictyostelium lysozyme-like proteins.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared methyl-accepting signalling domain supports chemotaxis-type signalling, but
  the input side differs between groups: periplasmic-ligand transmembrane receptors
  (SF120 with KT2440 McpS and PcaY, SF114 with B. subtilis McpA/McpB/TlpA-C, SF119,
  SF39), soluble haem-based aerotaxis transducers (HemAT, SF118 and part of SF112),
  rhodopsin-coupled archaeal transducers (SF112), and two Dictyostelium lysozyme-like
  proteins (SF112) that are not chemoreceptors. No receptor activity term is safe for
  the whole family.
