  name:
    name: Starch-binding domain-containing protein
    short: Starch-binding_domain_protein
  description:
  - text: This family of proteins functions as cargo receptors for glycogen, facilitating
      its delivery to lysosomes via a specialized autophagic process known as glycophagy.
      Members of this family contain a C-terminal carbohydrate-binding module 20 (CBM20)
      domain essential for binding glycogen and possibly other glycogen-associated
      proteins. Additionally, these proteins possess a LC3-interacting region (LIR
      motif) which is crucial for the interaction with ATG8 family proteins, such
      as GABARAPL1, linking them to the autophagic machinery.
