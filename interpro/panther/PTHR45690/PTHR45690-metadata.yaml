  name:
    name: NLRP family, innate immunity and inflammation regulators
    short: NLRP_innate_immun_reg
  description:
  - text: The NLRP family proteins are involved in innate immunity and inflammation.
      They act as sensors for pathogen-associated molecular patterns (PAMPs) and damage-associated
      molecular patterns (DAMPs), initiating the assembly of inflammasome complexes.
      These complexes activate pro-inflammatory caspases, leading to the maturation
      and secretion of cytokines IL1B and IL18, and inducing pyroptosis, an inflammatory
      form of cell death. Some family members regulate NF-kappaB signaling pathways,
      modulate actin dynamics in oocytes, and contribute to zygote division. Others
      have roles in redox homeostasis, Th2 cell differentiation, and tumor growth.
      The family includes proteins with diverse regulatory mechanisms, such as autoinhibition
      by ADP-binding, activation by various stimuli like ATP or pathogens, and interaction
      with other proteins through domains like LRR, PYD, and NACHT.
