  name:
    name: Anthracycline and Secondary Metabolite Biosynthesis Protein
    short: Anthracycline_SecMetBiosynth
  description:
  - text: This family of proteins includes enzymes involved in various biosynthetic
      pathways, including the production of anthracyclines, which are aromatic polyketide
      antibiotics with significant cytotoxicity used in cancer chemotherapy. Members
      of this family participate in key steps of the anthracycline biosynthesis, such
      as hydroxylation and conversion of precursor compounds into active antibiotics
      like carminomycin and daunorubicin. Some proteins within this family are also
      implicated in the detoxification of methylglyoxal, suggesting a role in cellular
      defense mechanisms. Additionally, certain members are involved in immune modulation,
      specifically in the maturation of dendritic cells and the induction of Th1-polarized
      immune responses through TLR2-dependent pathways. The family also includes proteins
      with a glyoxylase-like domain that are part of gene clusters mediating the biosynthesis
      of secondary metabolites with potential roles in microbial competition and pathogenicity.
