family_id: PANTHER:PTHR38780
family_name: PROTEIN TUSC
preferred_name: TusC sulfur-relay complex subunits
summary: TusC contributes to the TusBCD complex that transfers sulfur toward MnmA. Its structural contribution
  is distinct from the experimentally assigned sulfur-bearing TusD cysteine.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The reviewed PAINT clade and extant functional evidence support the stated relay or
  complex role. Family-wide scope, where retained, concerns that role; it does not assert the same upstream
  donor, complete pathway, autonomous catalysis or obligate essentiality in every bacterium. The family
  also holds Thermotoga and Dictyoglomus homologs of unknown role, so the tRNA-thiolation process is
  established only for the gammaproteobacterial TusC clade.
