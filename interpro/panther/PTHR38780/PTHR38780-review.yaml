  assessment_reason: Sound for the gammaproteobacterial TusC orthologs of the Tus relay, but the
    Bacteria-level node also covers the DsrEFH-like Thermotoga maritima and Dictyoglomus turgidum homologs,
    for which no tRNA-thiolation role is established. In the reference tree the descendant node
    PTN002215355 holds exactly the 7 gammaproteobacterial TusC leaves and excludes those two. No PAINT
    change is requested, because an unknown role is not evidence against the inherited process; if those
    homologs are shown not to thiolate tRNA, the IBD should move to PTN002215355. The missing evidence is s2U34 data
    for mutants of the Thermotoga or Dictyoglomus genes. The full member inventory also contains Allochromatium vinosum DsrF (O87897), a Dsr-system homolog
    of unknown function.
