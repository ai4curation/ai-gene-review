family_id: PANTHER:PTHR38780
family_name: PROTEIN TUSC
preferred_name: TusC (DsrF-like) subunit of the TusBCD sulfur-relay complex
summary: >-
  Small DsrEFH-like proteins of the TusC/DsrF family. In Escherichia coli TusC is
  one of the three subunits of the heterohexameric TusBCD complex, which relays
  persulfide sulfur from TusA to TusE in the pathway that forms the 2-thio group
  of mnm5s2U at tRNA wobble position 34. TusC Cys76 and Cys79 are dispensable; the
  sulfur-carrying residue of the complex is on TusD. PANTHER defines a single
  subfamily. Most members are gammaproteobacterial Tus orthologs, but the
  reference tree also places DsrEFH-like homologs of Thermotoga maritima and
  Dictyoglomus turgidum under the same PAINT node.
  The full member inventory also contains Allochromatium vinosum DsrF (O87897),
  a Dsr-system homolog that UniProt describes only as possibly involved in
  intracellular sulfur oxidation.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family has one subfamily (SF1, PROTEIN TUSC) and the single PAINT node
  (PTN002446188, Bacteria) assigns the TusBCD complex and wobble-uridine
  thiolation, seeded by E. coli TusC. The characterized members are TusC orthologs
  encoded with TusB and TusD homologs; no member with a divergent function is
  documented, but the roles of the Thermotoga and Dictyoglomus homologs
  under the same node are not established (tree check).
