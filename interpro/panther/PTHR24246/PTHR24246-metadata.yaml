  name:
    name: G-protein Coupled Receptor 1
    short: GPCR1
  description:
  - text: The G-protein coupled receptor 1 family consists of receptors that are activated
      by various ligands, including adenosine and bile acids. Upon ligand binding,
      these receptors typically interact with G proteins to modulate intracellular
      signaling pathways. Adenosine receptors within this family can either activate
      adenylyl cyclase to increase intracellular cAMP levels or inhibit adenylyl cyclase,
      depending on the specific subtype (A1, A2a, A2b, A3). The bile acid receptors
      also bind their ligands, leading to internalization and activation of extracellular
      signal-regulated kinase, as well as cAMP production. These processes can influence
      various physiological functions, such as macrophage activity and GLP1R secretion.
      The family plays a crucial role in mediating cellular responses to external
      stimuli, thereby affecting a wide range of biological processes.
