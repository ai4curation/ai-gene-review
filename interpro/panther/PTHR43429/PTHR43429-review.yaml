family_id: PANTHER:PTHR43429
family_name: PYRIDINE NUCLEOTIDE-DISULFIDE OXIDOREDUCTASE DOMAIN-CONTAINING
preferred_name: FAD-dependent pyridine nucleotide-disulfide oxidoreductase family (NorW/AlkT/NasB/CoADR clade)
summary: >-
  FAD-dependent NAD(P)H oxidoreductases of the pyridine nucleotide-disulfide
  oxidoreductase fold, which pass electrons from NAD(P)H to a protein or small
  molecule acceptor. SF3 contains the flavorubredoxin reductase NorW, the
  rubredoxin reductases AlkT/RubB and related NADH oxidases, and the Bacillus
  subtilis assimilatory nitrate reductase electron-transfer subunit NasB
  (P42433), the NADH/FAD diaphorase partner of the molybdenum catalytic subunit
  NasC. NasB also has nitrite-reductase-like and BFD-like [2Fe-2S] regions but
  lacks the conserved sirohaem-associated cysteine motif of the true nitrite
  reductase large subunit NasD. SF1 holds CoA-disulfide reductases, NADH oxidases
  and NADH peroxidase; SF2 holds PYROXD1-like proteins.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members are FAD/NAD(P)H oxidoreductases, but they deliver electrons to
  different partners or substrates: rubredoxin or flavorubredoxin (NorW, AlkT),
  the NasC molybdenum subunit (NasB), oxygen or peroxide (NADH oxidase and
  peroxidase), and CoA disulfide or polysulfide (SF1). Only the
  oxidoreductase-level activity is shared.
reference_protein:
  id: UniProtKB:P42433
  label: Assimilatory nitrate reductase electron transfer subunit
  gene_symbol: nasB
  organism: Bacillus subtilis (strain 168)
