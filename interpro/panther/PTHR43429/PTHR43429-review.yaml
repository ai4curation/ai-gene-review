notes: >-
  PANTHER 19.0's per-organism classification also places B. subtilis NasD (P42435)
  in SF3, whereas UniProt and the InterPro-derived inventory place it in
  PTHR43809:SF1 with the NirB large subunits. NasD keeps the sirohaem motif that
  NasB lacks, so it is reviewed under PTHR43809; see that review and the member
  index override.
