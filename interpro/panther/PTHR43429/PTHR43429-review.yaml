subfamilies:
- subfamily_id: PANTHER:PTHR43429:SF3
  label: NITRITE REDUCTASE [NAD(P)H]
  description: >-
    NorW-type flavorubredoxin reductases, rubredoxin reductases and related NADH
    oxidoreductases, together with the B. subtilis NasB nitrate reductase
    diaphorase subunit.
  representative_members:
  - id: UniProtKB:P42433
    label: Assimilatory nitrate reductase electron transfer subunit
    gene_symbol: nasB
    organism: Bacillus subtilis (strain 168)
    gene_review: genes/BACSU/nasB/nasB-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    The subfamily name implies nitrite reductase activity, but its characterized
    members are rubredoxin/flavorubredoxin reductases and the NasB diaphorase,
    which transfers NADH electrons to the nitrate-reducing NasC. NasB lacks the
    sirohaem-associated cysteine motif needed for nitrite reduction.
  supported_by:
  - reference_id: file:genes/BACSU/nasB/nasB-source-analysis/native-nas-system.md
    supporting_text: NasB resembles nitrite reductases but lacks the conserved siroheme-associated cysteine
      motif present in NasD.
  - reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC94119/
    supporting_text: 'In B. subtilis, the nasBC genes code for the NADH-nitrate reductase: NasB is a
      diaphorase with NADH- and FAD-binding domains, and NasC is the catalytic subunit.'
