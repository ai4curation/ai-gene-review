  scope: FAMILY_WIDE
  scope_reason: >-
    Every member is an FAD-dependent NAD(P)H oxidoreductase; more specific
    activities depend on the acceptor and must be judged per member.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43429/PTHR43429-paint.tsv
    supporting_text: "PTHR43429\tPTN009166436\tGO:0016491\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0098809
    label: nitrite reductase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    The InterPro NirB-family signatures that some members carry propagate
    nitrite reductase activity, but no characterized member reduces nitrite: the
    rubredoxin reductases and NADH oxidases act on other acceptors, and NasB lacks
    the sirohaem-associated cysteine motif and serves as the nitrate reductase
    diaphorase.
  supported_by:
  - reference_id: file:genes/BACSU/nasB/nasB-source-analysis/native-nas-system.md
    supporting_text: NasB resembles nitrite reductases but lacks the conserved siroheme-associated cysteine
      motif present in NasD.
- assessed_term:
    id: GO:0050661
    label: NADP binding
  scope: UNRESOLVED
  scope_reason: >-
    Members bind NAD(P)H, but which nucleotide differs: NasB is described as an
    NADH diaphorase and its NADP-binding row is corrected to NAD binding. The
    nucleotide has to be judged per member.
  supported_by:
  - reference_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC94119/
    supporting_text: NasB is a diaphorase with NADH- and FAD-binding domains
