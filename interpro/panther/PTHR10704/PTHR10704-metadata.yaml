  name:
    name: Gal/GlcNAc/GalNAc Sulfotransferase
    short: Gal/GlcNAc/GalNAc_ST
  description:
  - text: The Gal/GlcNAc/GalNAc sulfotransferase family is involved in the post-translational
      modification of glycosaminoglycans and glycoproteins. Members of this family
      utilize 3'-phospho-5'-adenylyl sulfate (PAPS) as a sulfonate donor to catalyze
      the transfer of sulfate groups to various carbohydrate residues. This sulfation
      process is critical for the biosynthesis of chondroitin sulfate, a major component
      of cartilage, and keratan sulfate, which is essential for corneal transparency.
      Additionally, the family participates in the creation of SELL ligands, which
      are crucial for lymphocyte homing and immune surveillance. The enzymes exhibit
      substrate specificity, sulfating non-reducing ends of oligosaccharides and contributing
      to the generation of sialylated and sulfated motifs involved in cell signaling
      and adhesion.
