        gene_symbol: Mrc1
        organism: Mus musculus
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR22803:SF69
    label: C-TYPE MANNOSE RECEPTOR 2
    description: >-
      Endocytic collagen- and mannose-binding receptor (MRC2/uPARAP/Endo180)
      involved in extracellular matrix turnover.
    representative_members:
      - id: UniProtKB:Q9UBG0
        label: C-type mannose receptor 2
        gene_symbol: MRC2
        organism: Homo sapiens
      - id: UniProtKB:Q64449
        label: C-type mannose receptor 2
        gene_symbol: Mrc2
        organism: Mus musculus
    diverged_from_family: false
    supported_by:
      - reference_id: PMID:12399458
        supporting_text: >-
          Endo180 is shown to bind in a Ca(2+)-dependent manner to mannose,
          fucose, and N-acetylglucosamine but not to galactose. This activity is
          mediated by one of the eight CTLDs, CTLD2.
  - subfamily_id: PANTHER:PTHR22803:SF74
    label: SECRETORY PHOSPHOLIPASE A2 RECEPTOR
    description: >-
      Transmembrane receptor (PLA2R1) that binds and internalizes secretory
      phospholipases A2.
    representative_members:
      - id: UniProtKB:Q13018
        label: Secretory phospholipase A2 receptor
        gene_symbol: PLA2R1
        organism: Homo sapiens
      - id: UniProtKB:Q62028
        label: Secretory phospholipase A2 receptor
        gene_symbol: Pla2r1
        organism: Mus musculus
    diverged_from_family: true
    divergence_description: >-
      PLA2R1 binds secretory phospholipase A2 enzymes via protein-protein
      interactions rather than acting as a mannose-specific pathogen receptor.
