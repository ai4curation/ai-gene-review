family_id: PANTHER:PTHR22803
family_name: MANNOSE, PHOSPHOLIPASE, LECTIN RECEPTOR RELATED
preferred_name: Multi-CRD mannose/phospholipase receptors, C-type lectins, PRG2/3, and snaclecs
summary: >-
  Large metazoan C-type lectin and snaclec domain-containing family (IPR050111)
  that includes multi-CRD endocytic receptors (MRC1, MRC2, PLA2R1, LY75),
  single-pass type II hepatic and myeloid C-type lectin receptors (ASGR1, ASGR2,
  CLEC4/CD209/CLEC10A, FCER2, CD302), secreted antimicrobial REG proteins
  (REG1A/B, REG3A/G, REG4), eosinophil granule cytotoxins (PRG2, PRG3), and
  snake venom C-type lectin-like proteins (snaclecs). Because UniProt
  cross-references human ASGR1 (P07306) and ASGR2 (P07307) to PANTHER:PTHR22803
  while PANTHER's own HMM classification places them in
  PANTHER:PTHR22802:SF470 and PANTHER:PTHR22802:SF433, both families must be
  considered when scoping asialoglycoprotein receptor orthologs and filtering
  over-propagated PAINT annotations.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members share only the C-type lectin-like domain fold (IPR016187 / IPR001304)
  and diverge radically in carbohydrate specificity, oligomeric state, and
  biological function: hepatic ASGR1/ASGR2 carry QPD-motif CRDs selective for
  terminal Gal/GalNAc on desialylated plasma glycoproteins; MRC1/CD209/CLEC4M
  carry EPN-motif CRDs selective for D-mannose/L-fucose on pathogens; PLA2R1
  binds secretory phospholipases A2; PRG2/PRG3 are secreted cationic eosinophil
  granule cytotoxins; and snake venom snaclecs have lost Ca2+-dependent sugar
  binding to target coagulation factors and platelet receptors.
reference_protein:
  id: UniProtKB:P22897
  label: Macrophage mannose receptor 1
  gene_symbol: MRC1
  organism: Homo sapiens
subfamilies:
  - subfamily_id: PANTHER:PTHR22803:SF159
    label: ASIALOGLYCOPROTEIN RECEPTOR 1
    description: >-
      Hepatic Ashwell-Morell receptor lectins (ASGR1 and ASGR2, mapped to bare
      PANTHER:PTHR22803 in UniProt cross-references and classified in
      PANTHER:PTHR22802:SF470/SF433 in PANTHER 19.0 HMMs) that bind terminal
      galactose and N-acetylgalactosamine (GalNAc) via a QPD-type Ca2+-binding
      site and mediate clathrin-dependent endocytosis of desialylated plasma
      glycoproteins.
    diverged_from_family: true
    divergence_description: >-
      ASGR1 and ASGR2 carry a QPD (Gln-Pro-Asp) Ca2+-coordinating triad
      selective for equatorial C3/C4 hydroxyls of D-galactose and GalNAc rather
      than D-mannose, and function as hepatocyte glycoprotein-homeostasis
      receptors rather than myeloid innate immune pattern-recognition receptors.
    supported_by:
      - reference_id: file:genes/human/ASGR1/ASGR1-uniprot.txt
        supporting_text: >-
          Specifically recognizes terminal galactose and N-acetylgalactosamine
          residues, facilitating the clearance of desialylated glycoproteins
          from circulation.
  - subfamily_id: PANTHER:PTHR22803:SF104
    label: MACROPHAGE MANNOSE RECEPTOR 1
    description: >-
      Multi-CRD macrophage pattern-recognition receptor (MRC1/CD206) that binds
      high-mannose and fucosylated glycans on pathogens and endogenous
      glycoproteins.
    representative_members:
      - id: UniProtKB:P22897
        label: Macrophage mannose receptor 1
        gene_symbol: MRC1
        organism: Homo sapiens
      - id: UniProtKB:Q61830
