residue_sites:
  - site_id: asgr2_qpd_gal_galnac_specificity_triad
    label: ASGR2 QPD (Gln263-Pro264-Asp265) and Trp267 Gal/GalNAc specificity motif
    description: >-
      Primary Ca2+-coordinating QPD triad (Gln263-Pro264-Asp265) and stacking
      tryptophan (Trp267) in the carbohydrate-recognition domain of human ASGR2
      (H2 subunit), inferred by alignment with the structurally resolved ASGR1
      H1 CRD (PDB:1DV8, Gln240-Pro241-Asp242 and Trp244), that selectively bind
      terminal galactose and GalNAc.
    anchor:
      id: UniProtKB:P07307
      label: Asialoglycoprotein receptor 2
      gene_symbol: ASGR2
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: ALIGNMENT_INFERENCE
    residues:
      - position: 263
        expected:
          - Q
        role: >-
          Glutamine of the QPD triad that coordinates Ca2+ and hydrogen-bonds
          to the equatorial C3/C4 hydroxyls of galactose/GalNAc
      - position: 264
        expected:
          - P
        role: >-
          Cis-proline of the QPD motif in the ASGR2 carbohydrate-recognition
          domain
      - position: 265
        expected:
          - D
        role: >-
          Aspartate of the QPD triad that coordinates the primary Ca2+ ion and
          recognizes galactose/GalNAc
      - position: 267
        expected:
          - W
        role: >-
          Tryptophan indole ring that stacks against the apolar face of the
          bound galactose/GalNAc pyranose ring
    motif:
      pattern_regex: "QPD.W"
      start: 263
      end: 267
      role: Gal/GalNAc-selective Ca2+-coordinating C-type lectin motif
