  name:
    name: Eukaryotic translation initiation factor 4E-binding
    short: EIF4E-binding
  description:
  - text: This family of proteins regulates the initiation of protein translation
      by interacting with eukaryotic translation initiation factor 4E (EIF4E). Members
      of this family act as repressors by binding to EIF4E and preventing its assembly
      into the eIF4F complex, thereby inhibiting translation. The hypophosphorylated
      form of these proteins competes with EIF4G1/EIF4G3 for EIF4E binding, leading
      to translation repression. Conversely, the hyperphosphorylated form dissociates
      from EIF4E, facilitating the interaction between EIF4G1/EIF4G3 and EIF4E, and
      promoting translation initiation. These proteins are subject to regulation by
      hormones, growth factors, and various signaling pathways, including the MAP
      kinase and mTORC1 pathways. Some family members are also involved in processes
      such as synaptic plasticity, learning, memory formation, and mRNA nuclear export.
