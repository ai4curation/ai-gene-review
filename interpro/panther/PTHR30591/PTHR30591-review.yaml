family_id: PANTHER:PTHR30591
family_name: RECBCD ENZYME SUBUNIT RECC
preferred_name: RecC and AddB end-resection scaffold subunits
summary: >-
  PTHR30591 contains the RecC subunit of the bacterial RecBCD end-resection complex together with
  the AddB (RexB) subunit of the analogous AddAB complex. The family has a single subfamily,
  PTHR30591:SF1, which PANTHER names after RecC. Its reviewed members are mostly AddB/RexB proteins
  (136 of 144), and only 8 are RecC. In RecBCD, RecC splits the incoming duplex end so that the
  separated strands go to the RecB and RecD motors, and in E. coli it recognizes the Chi
  recombination hotspot from within its DNA tunnel. AddB pairs with AddA, carries its own nuclease
  domain and also responds to a recombination hotspot. Both subfamily lineages are DNA-binding
  scaffold subunits of helicase-nuclease end-resection complexes. They differ in partner, in
  whether they carry a nuclease, and in which hotspot sequence they recognize.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  RecC and AddB share DNA binding, a role in organizing a two-subunit or three-subunit
  helicase-nuclease, and participation in DNA recombination. That is the root PAINT assertion and
  it is SOUND. They differ in partner proteins (RecB plus RecD, versus AddA), in nuclease content
  (RecC has no nuclease active site, while AddAB has one in each subunit) and in hotspot sequence.
  Chi recognition is also lineage-specific inside the RecC clade: Pseudomonas RecBCD-like enzymes
  do not respond to the E. coli Chi sequence. The single PANTHER subfamily cannot separate RecC
  from AddB, so the RecBCD module selects RecC with NCBIfam TIGR01450 instead of PTHR30591:SF1.
