notes: >-
  Written while promoting modules/bacterial_recbcd_end_resection.yaml. The module selects RecC with
  NCBIfam TIGR01450 (exodeoxyribonuclease V subunit gamma), not PTHR30591:SF1, because the only
  PANTHER subfamily mixes RecC with AddB/RexB. Four of the five rows in the committed PAINT slice
  come from PTHR11070 nodes. They are picked up because two AddB accessions are PTHR11070:SF49
  leaves in the PANTHER 19 tree but are classified in PTHR30591 today. They are marked WRONG_NODE
  for this family only; the nodes themselves are assessed in the PTHR11070 review. The fetched
  slice is left unedited. Member counts (8 RecC and 136 AddB/RexB reviewed entries) were re-derived
  with a CSV parser from the committed entries.csv. Pseudomonas RecBCD-like enzymes are recombination
  proficient but do not respond to the E. coli Chi sequence (PMID:2559208), so hotspot identity is
  not a family-wide or even RecC-wide property.
