term_assessments:
- assessed_term:
    id: GO:0003677
    label: DNA binding
  scope: FAMILY_WIDE
  scope_reason: >-
    RecC binds the duplex end and the 3'-ended strand in its tunnel, and all three RecBCD subunits
    contribute to DNA binding. AddAB forms stable complexes with its hotspot sequence. DNA binding is
    the activity shared by the scaffold subunits of both lineages. The module's RecC end-engagement
    annoton uses the more specific child term GO:0045027 DNA end binding (assessed below).
  supported_by:
  - reference_id: file:genes/ECOLI/recC/recC-uniprot.txt
    supporting_text: All subunits contribute
  - reference_id: PMID:15538360
    supporting_text: Passage of the 3' tail through one of these tunnels provides a mechanism for the recognition of a Chi sequence by RecC within the context of double-stranded DNA.
  - reference_id: PMID:17570399
    supporting_text: retain the ability to form stable complexes with the hotspot sequence
- assessed_term:
    id: GO:0045027
    label: DNA end binding
  scope: UNRESOLVED
  scope_reason: >-
    RecC engages the double-strand DNA end. The duplex is split across RecC, and the 3'-ended strand
    passes through a RecC tunnel, where Chi is recognized. The module's RecC end-engagement annoton
    uses this term. AddAB is also an end-processing enzyme, but the evidence examined here does not
    show AddB's own end-binding contacts. The term is therefore supported for the RecC members of
    the single subfamily SF1 and unresolved for its AddB/RexB members. No PANTHER subfamily boundary
    separates the two groups. Missing evidence: AddB DNA-end contacts.
  supported_by:
  - reference_id: PMID:15538360
    supporting_text: the DNA duplex has been split across the RecC subunit to create a fork with the separated strands each heading towards different helicase motor subunits
  - reference_id: PMID:15538360
    supporting_text: Passage of the 3' tail through one of these tunnels provides a mechanism for the recognition of a Chi sequence by RecC within the context of double-stranded DNA.
- assessed_term:
    id: GO:0043138
    label: 3'-5' DNA helicase activity
  scope: UNRESOLVED
  scope_reason: >-
    No node of the PTHR30591 tree carries a helicase assertion. For RecC, structural evidence places
    the helicase motors on RecB and RecD, with RecC splitting the duplex between them, so RecC is
    not a motor. Whether AddB proteins have any motor activity was not established by the evidence
    examined here. Missing evidence: AddB motor-domain biochemistry. The term should not be
    propagated to PTHR30591 members from the cross-family PTN000116141 row.
  supported_by:
  - reference_id: PMID:15538360
    supporting_text: the DNA duplex has been split across the RecC subunit to create a fork with the separated strands each heading towards different helicase motor subunits
