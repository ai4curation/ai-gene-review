  description:
  - text: This family of proteins catalyzes the formation of NAD(+) from nicotinamide
      mononucleotide (NMN) and ATP, playing a crucial role in the salvage pathway
      of NAD(+) biosynthesis. Members of this family are also involved in additional
      cellular processes, such as the filamentation pathway in yeast, where they can
      compensate for the loss of certain kinase activities.
