family_id: PANTHER:PTHR31285
family_name: NICOTINAMIDE MONONUCLEOTIDE ADENYLYLTRANSFERASE
preferred_name: POF1 NMN adenylyltransferase family
summary: >-
  Fungal POF1-type nicotinamide mononucleotide adenylyltransferases make NAD from NMN in the nicotinamide
  riboside salvage route (S. cerevisiae POF1, S. pombe SPAC694.03). They are unrelated to the NMNAT
  family.
functional_coherence: COHERENT
coherence_reason: A single fungal subfamily (SF0).
