  name:
    name: JAMM/MPN+ metalloenzymes, peptidase M67A
    short: JAMM_MPN+_peptidase_M67A
  description:
  - text: The peptidase M67A family, also known as the JAMM/MPN+ metalloenzymes, encompasses
      proteins with diverse functions related to ubiquitin signaling and protein homeostasis.
      Members of this family are involved in the cleavage of 'Lys-63'-linked polyubiquitin
      chains, regulating processes such as DNA damage response, cell cycle progression,
      and immune signaling. They are components of various multiprotein complexes,
      including the BRCA1-A complex, which targets DNA damage sites, and the BRISC
      complex, which is essential for mitotic spindle assembly. The family also includes
      subunits of the COP9 signalosome, which regulates ubiquitin conjugation pathways,
      and the 26S proteasome, which degrades ubiquitinated proteins. Additionally,
      they play roles in translation initiation as part of the eIF-3 complex, targeting
      specific mRNAs for protein synthesis. This family is characterized by the presence
      of a JAMM motif, which is crucial for their protease activity, and some members
      also contain SANT and SWIRM domains for DNA binding and chromatin association.
