family_id: PANTHER:PTHR10410
family_name: EUKARYOTIC TRANSLATION INITIATION FACTOR 3 -RELATED
summary: JAMM/MPN-family proteins occur in protein-modification and proteostasis complexes. Catalytic
  members use metal-dependent hydrolysis, but modifier specificity and activity depend on the protein
  and its complex context.
functional_coherence: HETEROGENEOUS
coherence_reason: The exact fly CSN5 PB isoform retains the complete MPN domain and JAMM catalytic region
  despite two deletions outside that domain. This supports a COP9 component with NEDD8-deconjugation architecture,
  not synaptic-vesicle residence. A developmental or synaptic phenotype is not a localization assay. The
  broader grouping contains proteasomal, COP9 and translation-associated MPN proteins with different complexes,
  so synaptic vesicle is not a shared compartment and no exhaustive positive subfamily set is established.
