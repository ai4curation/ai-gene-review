family_id: PANTHER:PTHR22808
family_name: NCL1 YEAST -RELATED NOL1/NOP2/FMU SUN  DOMAIN-CONTAINING
preferred_name: Ncl1/Trm4-related RNA cytosine methyltransferases
summary: SAM-dependent RNA cytosine-C5 methyltransferases with branch-specific RNA substrates and nucleotide
  positions. In fission yeast, Trm4b/Trm402 modifies tRNA C49/C50 in vivo, whereas Trm4a supplies C48
  and physiological C34 modification. Trm4b has additional C34 activity on precursor tRNA in vitro; that
  capability does not establish a physiological C34 role.
functional_coherence: HETEROGENEOUS
coherence_reason: The conserved RNA-C5 methylation chemistry does not define a universal RNA target or
  nucleotide position. Direct paralog-resolved knockout methylomes and recombinant-enzyme assays distinguish
  Trm4a and Trm4b specificity, so a C34 or rRNA assignment cannot be inherited solely from the broad NOP/NOL/Trm4
  family label.
