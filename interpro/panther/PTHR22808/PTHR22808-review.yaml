notes: Family and subfamily names are read from panther.obo; representative assignments are checked against
  the frozen UniProt PANTHER cross-references and available member inventory. Source provenance and sequence
  lengths are recorded in projects/PROTNLM_EVALUATION/family-curation/evidence-c/PTHR22808.md. Functional
  statements derived from ARBA and LLM-generated descriptions are not independent validation. No PAINT
  ancestral-node placement or residue-loss assertion is made without the corresponding phylogenetic or
  sequence analysis. The 2019 primary study reports that the purported trm4b deletion strain in the earlier
  work lacked the deletion. Accordingly, extra tRNA-Asp site assignments from that experiment are not
  treated as established Trm4b specificity. Residue C323 is a sequence-verified predicted nucleophile;
  it is not a target-specific mutational validation.
