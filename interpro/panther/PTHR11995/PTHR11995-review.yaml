    label: NADH-quinone oxidoreductase subunit B
    gene_symbol: nuoB
    organism: Escherichia coli (strain K12)
    gene_review: genes/ECOLI/nuoB/nuoB-ai-review.yaml
  - id: UniProtKB:Q88FH6
    label: NADH-quinone oxidoreductase subunit B
    gene_symbol: nuoB
    organism: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
    gene_review: genes/PSEPK/nuoB/nuoB-ai-review.yaml
  supported_by:
  - reference_id: PMID:12975362
    supporting_text: From this we conclude that the Fe/S cluster N2 is located on
      subunit NuoB.
