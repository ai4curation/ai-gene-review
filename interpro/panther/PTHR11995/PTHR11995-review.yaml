subfamilies:
- subfamily_id: PANTHER:PTHR11995:SF14
  label: NADH DEHYDROGENASE [UBIQUINONE] IRON-SULFUR PROTEIN 7, MITOCHONDRIAL
  description: >-
    The dominant subfamily (654 of 680 members in the entries file). Despite the
    mitochondrial name it is mostly bacterial NDH-1 NuoB (411 entries named
    NADH-quinone oxidoreductase subunit B) and also holds the chloroplast NDH
    subunit NdhK (99 entries). The bacterial members, including Escherichia coli
    and Pseudomonas putida KT2440 NuoB, are the plasma-membrane NDH-1 subunit that
    binds the terminal [4Fe-4S] cluster N2 next to the quinone site; in E. coli
    the cluster was assigned to NuoB by mutating its four conserved cysteines.
  diverged_from_family: true
  divergence_description: >-
    The subfamily mixes respiratory NADH-oxidising complex I subunits (bacterial
    NuoB, mitochondrial NDUFS7) with chloroplast NdhK, whose complex lacks the
    NADH-oxidising module and receives electrons from ferredoxin. The cluster N2
    electron-transfer role and coupled proton translocation are shared; the
    NADH-donor activity (GO:0008137) and the respiratory chain complex I
    component are not safe for the NdhK members (see node assessments).
  representative_members:
