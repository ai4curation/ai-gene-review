family_id: PANTHER:PTHR11995
family_name: NADH DEHYDROGENASE
preferred_name: Complex I / NDH-1 subunit B family (NuoB / NDUFS7 / plastid NdhK)
summary: >-
  This family holds the B-type catalytic-core subunit of proton-pumping
  NADH:quinone oxidoreductases: bacterial NuoB, the mitochondrial complex I
  iron-sulfur subunit NDUFS7, and the plastid-encoded NdhK of the chloroplast NDH
  complex. The bacterial and mitochondrial members work in respiratory chains,
  oxidizing NADH and reducing ubiquinone. The plastid NdhK clade was co-opted into
  the thylakoid NDH complex (GO:0010598), which runs photosynthetic cyclic electron
  flow around photosystem I and chlororespiration, accepts electrons from
  ferredoxin/NAD(P)H, and reduces plastoquinone rather than ubiquinone. Respiratory
  and ubiquinone-specific terms therefore stop being safe at the plastid boundary,
  while compartment-neutral chemistry (electron transport coupled proton transport)
  remains true family-wide.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The respiratory members (NuoB, NDUFS7) belong to bacterial NDH-1 or mitochondrial
  respiratory complex I and act in aerobic respiration on ubiquinone; the plastid
  NdhK clade belongs to the thylakoid NDH complex and acts in photosynthetic cyclic
  electron flow on plastoquinone. The subfamily axis cannot express the split: the
  main subfamily (SF14, named for NDUFS7) contains both the respiratory members and
  the chloroplastic NdhK proteins in the fetched slice, so the boundary is a clade
  within a subfamily, not a subfamily.
reference_protein:
  id: UniProtKB:O75251
  label: NADH dehydrogenase [ubiquinone] iron-sulfur protein 7, mitochondrial
  gene_symbol: NDUFS7
  organism: Homo sapiens

