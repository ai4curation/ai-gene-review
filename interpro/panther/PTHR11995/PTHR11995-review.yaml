term_assessments:
- assessed_term:
    id: GO:0009055
    label: electron transfer activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterised member is the terminal iron-sulfur subunit of a complex
    I-type enzyme (bacterial NDH-1 NuoB, mitochondrial NDUFS7, chloroplast NDH
    NdhK) and carries the conserved four-cysteine motif (Pfam Oxidored_q6,
    PROSITE COMPLEX1_20K) that ligates the [4Fe-4S] cluster N2, which passes
    electrons from the iron-sulfur chain to the bound quinone. The electron
    donor upstream differs (NADH versus ferredoxin) but the subunit's own
    electron-transfer role does not, so the term is safe family-wide, unlike the
    NADH-specific GO:0008137. The minor subfamilies SF33 (second NuoB copies) and
    SF22 (mitochondrial NDUFS7) retain the same motif family assignment; no member
    is known to have lost the cluster.
  supported_by:
  - reference_id: PMID:12975362
    supporting_text: Individual mutation of all four conserved cysteine residues
      in NuoB resulted in a loss of complex I activity and of the EPR signal of N2
      in the cytoplasmic membrane as well as in the isolated complex.
  - reference_id: PMID:18316732
    supporting_text: Center N2 is widely thought to donate electrons directly to
      ubiquinone.
  - reference_id: file:PSEPK/nuoB/nuoB-uniprot.txt
    supporting_text: Binds 1 [4Fe-4S] cluster.
