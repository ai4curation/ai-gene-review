family_id: PANTHER:PTHR11995
family_name: NADH DEHYDROGENASE
preferred_name: Complex I / NDH-1 subunit B family (NuoB / NDUFS7 / plastid NdhK)
summary: 'Homologous subunits of respiratory complex I and chloroplast NDH: NuoB / mitochondrial NDUFS7 / plastid
  NdhK. Respiratory complexes receive electrons from NADH, whereas the chloroplast NDH complex lacks the NADH-oxidizing
  module and uses reduced ferredoxin to reduce plastoquinone. Coupled proton translocation is conserved. The
  chloroplast complex contributes to cyclic photosynthetic ATP production and has evidence for chlororespiratory
  participation; chloroplast localization does not by itself negate respiratory process terms.'
functional_coherence: HETEROGENEOUS
coherence_reason: Complex architecture, immediate electron donor and quinone pool distinguish chloroplast NDH
  from NADH-oxidizing respiratory complex I. GO:0016655 still requires NAD(P)H and is not an adequate replacement
  for the chloroplast activity; contribution to GO:0016730 captures the ferredoxin donor class. The separate
  respiratory-process question remains unresolved pending chlororespiratory adjudication, rather than being
  treated as an automatic consequence of the donor mismatch.
