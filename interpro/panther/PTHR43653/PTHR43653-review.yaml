notes: >-
  Reviewed as part of the bacterial cytochrome c maturation system I module,
  which grounds the CcmF catalytic subunit at PTHR43653:SF1 and assigns
  holocytochrome-c synthase activity only to the CcmF/CcmH complex. The
  reference protein is E. coli CcmF (SF1) rather than the NrfE paralog.
