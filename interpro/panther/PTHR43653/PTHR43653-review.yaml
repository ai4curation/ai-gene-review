node_assessments:
  - node_id: PANTHER:PTN009171456
    asserted_term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence: IBD
    paint_snapshot: '20250313'
    seeds:
      - id: UniProtKB:P33927
      - id: UniProtKB:Q9I3N2
    assessment: SOUND
    assessment_reason: >-
      E. coli CcmF is a cytochrome b whose membrane heme is reduced by quinols,
      and in vitro CcmF acts as a quinol:heme oxidoreductase, consistent with
      reduction of the heme iron delivered by holo-CcmE before ligation;
      the broad oxidoreductase term is an acceptable high-level description,
      though the specific reaction has no GO term.
    supported_by:
      - reference_id: file:interpro/panther/PTHR43653/PTHR43653-paint.tsv
        supporting_text: "PTHR43653\tPTN009171456\tGO:0016491\tF\tIBD\tfalse\tUniProtKB:P33927|UniProtKB:Q9I3N2"
      - reference_id: PMID:19629033
        supporting_text: >-
          Surprisingly, CcmF is a cytochrome b with a haem never before
          realized, and in vitro, CcmF functions as a quinol:haem
          oxidoreductase.
  - node_id: PANTHER:PTN000768541
    asserted_term:
      id: GO:0005886
      label: plasma membrane
    evidence: IBD
    node_taxon:
      id: NCBITaxon:1224
      label: Pseudomonadota
    paint_snapshot: '20250313'
    seeds:
      - id: UniProtKB:P32710
      - id: UniProtKB:P33927
    assessment: SOUND
    assessment_reason: >-
      Restricted to the proteobacterial clade, whose CcmF and NrfE are
      polytopic inner-membrane proteins; the plant mitochondrial homologs are
      outside the node.
    supported_by:
      - reference_id: file:interpro/panther/PTHR43653/PTHR43653-paint.tsv
        supporting_text: "PTHR43653\tPTN000768541\tGO:0005886\tC\tIBD\tfalse\tUniProtKB:P32710|UniProtKB:P33927\ttaxon:1224"
term_assessments:
  - assessed_term:
      id: GO:0016491
      label: oxidoreductase activity
    scope: FAMILY_WIDE
    scope_reason: Asserted at the family root PTN009171456.
    supported_by:
      - reference_id: file:interpro/panther/PTHR43653/PTHR43653-paint.tsv
        supporting_text: "PTHR43653\tPTN009171456\tGO:0016491\tF\tIBD\tfalse\tUniProtKB:P33927|UniProtKB:Q9I3N2"
  - assessed_term:
      id: GO:0004408
      label: holocytochrome-c synthase activity
    scope: UNRESOLVED
    scope_reason: >-
      Heme ligation is performed by a CcmF/CcmH complex (CcmF/CcmH/CcmI in
      some lineages), not by CcmF alone, so the complex-level synthase
      activity is not asserted for family members individually.
    supported_by:
      - reference_id: PMID:11744735
        supporting_text: >-
          We propose that CcmFH forms a bacterial heme lyase complex for the
          transfer of heme from CcmE to apocytochrome c.
      - reference_id: PMID:18753134
        supporting_text: >-
          CcmF, CcmH, and CcmI associate stably with each other, indicating
          that these Ccm components form a membrane-integral complex.
  - assessed_term:
      id: GO:0005886
      label: plasma membrane
    scope: UNRESOLVED
    scope_reason: >-
      Applies to the proteobacterial clade (PTN000768541) spanning SF1 and SF3,
      but SF1 also contains plant mitochondrial members, so no subfamily-level
      scope captures it.
    supported_by:
      - reference_id: file:interpro/panther/PTHR43653/PTHR43653-paint.tsv
        supporting_text: "PTHR43653\tPTN000768541\tGO:0005886\tC\tIBD\tfalse\tUniProtKB:P32710|UniProtKB:P33927\ttaxon:1224"
