family_id: PANTHER:PTHR43653
family_name: CYTOCHROME C ASSEMBLY PROTEIN-RELATED
preferred_name: CcmF/NrfE heme-ligation membrane protein family
summary: >-
  PTHR43653 is the CcmF/CycK/Ccl1/NrfE family of large polytopic membrane
  proteins that form the catalytic core of the system I heme-ligation
  (holocytochrome c synthase) machinery. CcmF carries a tryptophan-rich WWD
  signature and conserved histidines that are functionally required; it binds
  a heme in its membrane domain and, together with CcmH, receives heme from
  holo-CcmE and attaches it to the CXXCH motif of apocytochrome c. SF1 contains
  the CcmF orthologs of proteobacteria (E. coli, Pseudomonas, Haemophilus,
  Rhodobacter Ccl1, Bradyrhizobium CycK) and the Arabidopsis mitochondrial
  CCMFN1/CCMFN2 split homologs; SF3 contains NrfE, the specialised paralog
  required for maturation of the CWXXCK-motif heme of the formate-dependent
  nitrite reductase NrfA in enterobacteria.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are heme-handling membrane components of system I ligation, but
  SF3 NrfE is a substrate-specialised paralog (NrfA CWXXCK heme) and plant
  mitochondrial members are split into separate N- and C-terminal proteins.
  PAINT asserts a general oxidoreductase activity at the root and plasma
  membrane at the proteobacterial node.
