family_id: PANTHER:PTHR11811
family_name: 6-PHOSPHOGLUCONATE DEHYDROGENASE
preferred_name: 6-Phosphogluconate dehydrogenase, decarboxylating (GND/PGD) family
summary: >-
  NADP-dependent 6-phosphogluconate dehydrogenases oxidatively decarboxylate 6-phosphogluconate to
  ribulose 5-phosphate, the third step of the oxidative pentose phosphate pathway. The family contains
  bacterial Gnd, S. cerevisiae GND1/GND2, S. pombe SPBC660.16, Candida GND1 and human PGD.
functional_coherence: COHERENT
coherence_reason: All reviewed members are 6PGDs.
