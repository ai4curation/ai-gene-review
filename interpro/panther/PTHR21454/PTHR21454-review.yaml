  assessment_reason: >-
    The family root. Recipients in the PAINT UniProt GAF include KTI11, S. pombe dph3, human DPH3,
    human DPH3P1, S. pombe dph4, the Dictyostelium SF12 protein Q557G4 and Arabidopsis
    At2g15910, At3g11800, At3g44150 and O82623. Iron binding is well supported for Dph3 and the
