notes: >-
  Modules using this family: diphthamide_biosynthesis (dph3_electron_donor, base family
  PTHR21454, GO:0009055 electron transfer activity, process GO:0017183). Inconsistencies for the
  module curators:
  (1) The base-family selector also covers the Dph4 orthologs and uncharacterized paralogs, so
  PTHR21454:SF31 (with SF24 for human DPH3), or a required_function, would be needed to restrict
  it to Dph3.
  (2) The module's dph4_j_protein annoton says PANTHER does not place yeast JJJ3 and human
  DNAJC24 in the same family and asserts no family id. That is right for human DNAJC24
  (PTHR45255) but incomplete. S. pombe dph4 is in PTHR21454:SF49, and S. cerevisiae JJJ3 is in
  PTHR21454:SF46 by its UniProt/InterPro assignment but in PTHR24074:SF65 in the PANTHER 19.0
  yeast file.
  (3) The JJJ3 gene review asserts no molecular function, in line with the unresolved status of
  Dph4. The S. pombe dph4 IBA for iron ion binding should be treated as unresolved.
  KTI11 also acts as the electron donor for Elongator (tRNA wobble-uridine modification). That
  role is in the KTI11 gene review but is not asserted by PAINT or by the module. The family was
  fetched for PAINT on 2026-10-06. Its single PAINT node PTN000485452 has no IRD or IKR rows in
  the PANTHER IBD file. The human DPH3 subfamily disagreement (SF31 in entries.csv versus SF24 in
  the PANTHER 19.0 human file) is recorded by listing both subfamilies.
