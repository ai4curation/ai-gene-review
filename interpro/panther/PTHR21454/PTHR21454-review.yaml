family_id: PANTHER:PTHR21454
family_name: DPH3 HOMOLOG-RELATED
preferred_name: CSL-type zinc-finger family (Dph3/KTI11 and Dph4 CSL domain)
summary: >-
  Small proteins built around the CSL-type zinc finger, a rubredoxin-like site of four cysteines
  that can hold iron or zinc. The founding member, Dph3 (S. cerevisiae KTI11, 82 residues), is
  little more than this domain. Reduced by Cbr1/NADH, iron-bound Dph3 donates electrons to the
  [4Fe-4S] clusters of the Dph1-Dph2 enzyme in the first step of diphthamide synthesis on eEF2.
  In yeast it does the same for the Elongator complex in tRNA wobble-uridine modification. Some
  type III J-proteins, the Dph4 proteins (fungal JJJ3/dph4), carry the same domain after an
  N-terminal J-domain. Dph4 is also required for the first diphthamide step, but its molecular
  role is unresolved. The family also contains Arabidopsis EXPP1-type and DnaJ-domain CSL
  proteins, a Dictyostelium protein of 332 residues and a human DPH3 homolog B pseudogene
  product, none of which has been characterized.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Diphthamide biosynthesis is shared by the characterized Dph3 (SF31, and SF24 for human DPH3 in
  the PANTHER 19.0 files) and Dph4 (SF46, SF49) members. Electron donation to Dph1-Dph2 has been
  shown for Dph3 only; for Dph4 it was tested and judged unlikely. Iron binding is established
  for Dph3, while the Dph4 reports conflict. The plant EXPP1 (SF41, SF44, SF48), plant DnaJ-CSL
  (SF47), Dictyostelium (SF12) and DPH3P1 (SF23) members are uncharacterized and inherit the
  family-root PAINT terms without direct evidence. Dph4 orthologs are also split across
  families: S. pombe dph4 is in this family (SF49) in every source, S. cerevisiae JJJ3 is in
  SF46 by its UniProt/InterPro assignment but in PTHR24074:SF65 in the PANTHER 19.0 yeast
  classification, and human DNAJC24 is in PTHR45255:SF1.
