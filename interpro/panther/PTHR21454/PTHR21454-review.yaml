  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Dph3 orthologs only. This is the function of the module's dph3_electron_donor annoton, which
    selects the base family PTHR21454. Because the family also contains Dph4 (SF46, SF49), plant
    EXPP1 and DnaJ-CSL proteins, the base-family selector over-includes. Dph4 was tested and
    judged unlikely to be the Dph1-Dph2 electron donor. One study did report electron carrier
    activity for human iron-bound Dph4 (PMID:22367199), so the Dph4 exclusion reflects the direct
    reconstitution result rather than a settled negative.
