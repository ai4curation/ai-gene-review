family_id: PANTHER:PTHR10465
family_name: TRANSMEMBRANE GTPASE FZO1
preferred_name: Mitofusin/Fzo mitochondrial outer membrane GTPase family
summary: >-
  Mitofusins and Fzo proteins are dynamin-family GTPases that remodel the mitochondrial outer
  membrane. In opisthokonts, the mammalian MFN1/MFN2 proteins and the fungal and invertebrate Fzo
  proteins tether apposed mitochondria and use GTP hydrolysis to drive outer-membrane fusion.
  PTHR10465 also contains bacterial dynamin-like proteins in the broad, default SF0 subfamily, so
  the mitochondrion-specific PAINT assertions are placed on the eukaryotic mitofusin node rather
  than on the whole PANTHER family root.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The eukaryotic MFN/Fzo descendants of PTN002573358 share GTPase-dependent mitochondrial
  outer-membrane fusion. Bacterial dynamin-like proteins in SF0 are related GTPases but do not
  act at mitochondria.
