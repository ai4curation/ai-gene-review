family_id: PANTHER:PTHR31528
family_name: 4-AMINO-5-HYDROXYMETHYL-2-METHYLPYRIMIDINE PHOSPHATE SYNTHASE THI11-RELATED
preferred_name: THI5/NMT1 HMP-P synthase family
summary: >-
  Single-turnover enzymes that build the HMP-P pyrimidine of thiamine from histidine and PLP: S.
  cerevisiae THI5, THI11, THI12, THI13 and S. pombe nmt1. Bacterial ThiY-like (HI_0357) and RibY
  riboflavin-binding proteins form other subfamilies.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  HMP-P synthase activity holds for SF1. SF3 (HI_0357) and SF15 (RibY) are periplasmic binding protein-like
  members.
