family_id: PANTHER:PTHR12750
family_name: DIPHOSPHOINOSITOL PENTAKISPHOSPHATE KINASE
preferred_name: Diphosphoinositol pentakisphosphate kinase (PPIP5K/VIP1/Asp1) family
summary: >-
  Bifunctional PPIP5K/Vip1 enzymes have an ATP-grasp kinase domain that pyrophosphorylates the 1-position
  of IP6 and 5-IP7 (making 1-IP7 and 1,5-IP8) and a C-terminal histidine-acid phosphatase-like domain
  that dephosphorylates them. The family contains S. cerevisiae VIP1, S. pombe asp1 and human PPIP5K1/2.
functional_coherence: COHERENT
coherence_reason: All subfamilies are PPIP5K-type inositol pyrophosphate 1-kinases.
