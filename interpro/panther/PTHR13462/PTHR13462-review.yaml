family_id: PANTHER:PTHR13462
family_name: CALCIUM UNIPORTER PROTEIN, MITOCHONDRIAL
preferred_name: mitochondrial calcium uniporter pore and inhibitory MCUb subunits
summary: >-
  PTHR13462 contains mitochondrial calcium uniporter pore proteins and a vertebrate
  MCUb inhibitory branch. MCU-type proteins are inner-membrane calcium channels that
  import Ca2+ into the mitochondrial matrix as the pore-forming subunits of the
  uniplex complex. MCUB proteins remain uniplex components but act as dominant-negative
  channel inhibitors rather than as calcium-conducting pores.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Uniplex membership and mitochondrial calcium homeostasis are coherent across the human
  MCU and MCUB branches, but channel molecular functions and positive calcium-import
  process terms must be pruned from the inhibitory MCUB clade. PAINT already prunes the
  ancestral channel molecular-function assertions at PTN002668518 and should add the
  same loss for the ancestral GO:0036444 calcium-import process.
