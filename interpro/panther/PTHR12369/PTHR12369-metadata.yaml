  name:
    name: Chondroitin sulfate glycosyltransferase
    short: CS_glycosyltransferase
  description:
  - text: This family of proteins is involved in the biosynthesis of chondroitin sulfate,
      a key component of the extracellular matrix in cartilage. Members of this family
      exhibit glycosyltransferase activity, transferring glucuronic acid and N-acetylgalactosamine
      from their respective UDP-sugar donors to the growing chondroitin polymer. These
      enzymes play crucial roles in cartilage formation and endochondral ossification,
      a process where bone tissue is created. Some family members are also implicated
      in the metabolism of aggrecan, a major proteoglycan in cartilage, and in various
      developmental processes including cell division, cytokinesis, and neural development.
      Additionally, certain enzymes within this family are involved in the synthesis
      of N,N'-diacetyllactosediamine structures on glycoproteins, which are important
      for cell-cell interactions and signaling.
