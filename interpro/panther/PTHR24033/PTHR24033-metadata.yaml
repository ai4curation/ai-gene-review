  name:
    name: Neurogenic locus notch homolog
    short: NOTCH_homolog
  description:
  - text: The NOTCH family proteins are involved in cell-fate decisions and developmental
      processes. They function as receptors for membrane-bound ligands, such as Jagged
      and Delta proteins, to regulate differentiation, proliferation, and apoptosis.
      NOTCH proteins are essential in various biological contexts including hematopoiesis,
      cardiovascular development, thymic maturation, angiogenesis, and neurogenesis.
      They also play roles in left/right symmetry determination and tissue remodeling.
      Upon ligand binding, the NOTCH intracellular domain (NICD) translocates to the
      nucleus to form a transcriptional activator complex, influencing gene expression.
      The family's activity is crucial for various stages of development and can be
      involved in tumorigenesis when dysregulated.
