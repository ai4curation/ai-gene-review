family_id: PANTHER:PTHR11679
family_name: VESICLE PROTEIN SORTING-ASSOCIATED
preferred_name: Sec1/Munc18 (SM) proteins
summary: >-
  The Sec1/Munc18 (SM) family of cytosolic arch-shaped proteins that bind
  syntaxin-type Qa-SNAREs and template SNARE complex assembly at every
  constitutive and regulated fusion step of the secretory and endocytic
  pathways. The family contains four ancient eukaryotic clades: the exocytic
  Sec1/Munc18 clade (yeast Sec1, plant KEULE/SEC1A/SEC1B, Drosophila Rop, C.
  elegans UNC-18 and the vertebrate paralogs STXBP1/Munc18-1, STXBP2/Munc18-2
  and STXBP3/Munc18-3), the Sly1/SCFD1 clade (ER-Golgi traffic), the Vps45
  clade (Golgi/endosome traffic) and the Vps33 clade (HOPS/CORVET tethering
  complexes at vacuoles and lysosomes), plus the vertebrate SCFD2 subfamily.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The shared activity, Qa-SNARE (syntaxin) binding in support of
  vesicle-mediated membrane fusion, holds across all four clades. What
  diverges is the fusion step and therefore the compartment and process: plasma
  membrane exocytosis for the Sec1/Munc18 clade, ER-Golgi traffic for Sly1,
  Golgi/endosome traffic for Vps45 and vacuole/lysosome fusion for Vps33
  within HOPS and CORVET. Location and process terms are therefore safe only for
  the clade that carries them, and within the Sec1/Munc18 clade the neuronal
  Munc18-1 orthologs differ from the non-neuronal STXBP2 and STXBP3 paralogs.
