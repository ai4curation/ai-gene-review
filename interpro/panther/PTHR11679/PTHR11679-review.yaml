notes: >-
  Subfamily-to-term mapping was read from the PAINT TreeGrafter annotation file
  (which subfamilies inherit each annotated node); the per-protein subfamily
  column of PTHR11679-entries.csv is empty, so the placement of individual
  reviewed members in SF35 versus SF89 or SF28 was not confirmed. Only the
  nodes and terms touching the Munc18-1 orthologs were examined against
  literature; the Sly1, Vps45, Vps33 and SCFD2 clade terms are recorded from
  the PAINT rows without adjudication. Not examined: STXBP2, STXBP3, SCFD1,
  SCFD2, VPS33A/B and VPS45 in metazoa, plant KEULE/SEC1A/SEC1B, Drosophila Rop
  and Slh, and subfamilies SF28, SF62 and SF72. Seed identities given only by
  database id were not resolved to gene symbols except yeast VPS45
  (SGD:S000003063). The rat Stxbp1 review describes MGI:107370 as Stxbp3; its
  appearance as a seed of the STXBP2-only syntaxin-3 binding node suggests
  instead that it is Stxbp2, and this was not checked against MGI.
