  assessment: UNRESOLVED
  assessment_reason: >-
    Retain UNRESOLVED universal node scope, but withdraw the eukaryotic-only rationale. PMID38452854 establishes
    an E. coli IscU-dependent Fur cofactor-maturation pathway: native iscU deletion impairs Fur cluster
    loading and repression, and reconstitution with IscU restores cluster-associated spectral and Fur-box-binding
    signals. This supports bacterial participation through client maturation rather than assigning IscU
    transcription-factor activity. The in vitro interpretation includes subtraction of the IscU spectrum
    and unsuccessful separation of assembled Fur from the mixture; it does not establish a universal direct
    handoff route. Positive bacterial and eukaryotic examples support the process in characterized members,
    but do not settle the full ancestral node extent or all SufU/NifU-type realizations. Seed origin is
    not a reason to prune the assertion.
