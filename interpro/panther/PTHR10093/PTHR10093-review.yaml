family_id: PANTHER:PTHR10093
family_name: IRON-SULFUR CLUSTER ASSEMBLY ENZYME  NIFU HOMOLOG
preferred_name: IscU/NifU-like scaffold and SufU sulfur-transfer family
summary: >-
  The family contains U-type proteins involved in iron-sulfur protein maturation. Bacterial IscU, the
  N-terminal scaffold domain of NifU and eukaryotic ISU/ISCU assemble and deliver transient clusters.
  The Bacillus subtilis SufU member O32163 instead has strong biochemical and genetic support for zinc-dependent
  sulfur transfer from SufS toward the SufBCD assembly machinery, alongside earlier reports of in vitro
  cluster reconstitution and delivery. Similar folds therefore do not establish the same molecular activity
  in every member. PANTHER subfamily coverage remains incompletely resolved: E. coli IscU P0ACD4 is classified
  in SF8 in the PANTHER19 sequence file rather than the IscU-named SF26, and the committed inventory lacks
  subfamily assignments. No functionally precise subfamily boundary is inferred from names alone.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Participation in Fe-S protein assembly is broadly coherent, but the molecular roles are not uniform.
  IscU/NifU/ISU scaffolds and zinc-dependent SufU sulfur-transfer proteins must be distinguished. E. coli
  IscU can bind Fe(II) in reconstituted systems, so the former bacterial-versus-eukaryotic split in free-iron
  binding is unsupported; differences among preparations and assembly conditions affect observed intermediates
  and loading order. For B. subtilis SufU, earlier positive cluster-transfer reports remain part of the
  evidence, while later biochemical and complementation results favor a physiological sulfur-transfer
  role. Neither whole-subfamily loss nor a universal cluster-delivery activity is established.
