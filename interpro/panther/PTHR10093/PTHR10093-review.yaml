notes: >-
  Reviewed while grounding the bacterial Isc iron-sulfur cluster assembly module (modules/bacterial_isc_iron_sulfur_cluster_assembly.yaml),
  which grounds the IscU role to this family. The PANTHER family name contains a double space, reproduced
  verbatim. Full-length NifU proteins also carry a C-terminal Nfu-like domain that is not part of this
  family's signature. Follow-up (2026-11-07): reconciled SufU versus IscU roles and new bacterial iron-binding/iron-homeostasis
  evidence. The existing cluster-binding and localization PAINT verdicts are retained; this bounded audit
  does not establish the SufU leaf placement or a new gain/loss history. Broad assembly-process scope
  remains unchanged because sulfur transfer itself performs work in cluster biogenesis. Primary source
  limits and exact preservation checks are recorded in analysis/module_audits/bacterial_isc_iron_sulfur_cluster_assembly/family-consultation/.
  The earlier SufU positive reconstitution report and old IscU negative iron-binding report remain cited.
