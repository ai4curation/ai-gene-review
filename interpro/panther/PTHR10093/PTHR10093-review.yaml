term_assessments:
- assessed_term:
    id: GO:0140132
    label: iron-sulfur cluster chaperone activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Assembly of a transient cluster and its delivery to acceptor apoproteins is the
    shared scaffold function of IscU, NifU and ISU/ISCU; E. coli IscU transfers its
    [2Fe-2S] cluster to apoferredoxin in multiple turnovers. SufU is the one member
    whose cluster-delivery role is disputed (see coherence_reason), but no reviewed
    member contradicts the term.
  supported_by:
  - reference_id: PMID:15964837
    supporting_text: >-
      Kinetic studies further showed that cluster transfer exhibits
      Michaelis-Menten behavior indicative of complex formation of holo-IscU and
      holo-IscA with apoferredoxin
- assessed_term:
    id: GO:0016226
    label: iron-sulfur cluster assembly
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member is a component of an Fe-S cluster assembly system (Isc, Nif, Suf or
    mitochondrial ISC).
  supported_by:
  - reference_id: PMID:11432781
    supporting_text: >-
      The results presented here indicate crucial roles for IscU, HscB, HscA, and
      Fdx as central components of the assembler machinery
