  evidence: IBD
  paint_snapshot: '20250411'
  seeds:
  - id: FB:FBgn0037637
  - id: SGD:S000006056
  - id: UniProtKB:Q9H1K1
  assessment: TOO_DEEP
  assessment_reason: >-
    All three seeds are eukaryotic (fly, yeast and human ISCU/Isu1 orthologs), but the
    node also contains the bacterial scaffolds. For E. coli IscU, purified protein shows
    no stable interaction with free Fe(II) or Fe(III) and iron is supplied by donor
    proteins, so the E. coli iscU review marks the inherited IBA as over-annotated.
    The assertion fits the eukaryotic node (PTN000009663) better than the root. The
    bacterial branch is not listed as an affected subfamily because the member data do
    not settle its subfamily (entries.csv has no subfamily column data, UniProt
    cross-references are family-level, and PANTHER's classification puts E. coli IscU in
    SF8 rather than the IscU-named SF26).
  supported_by:
  - reference_id: file:interpro/panther/PTHR10093/PTHR10093-paint.tsv
    supporting_text: "PTHR10093\tPTN000009661\tGO:0008198\tF\tIBD\tfalse"
  - reference_id: PMID:15153099
    supporting_text: >-
      has no direct interaction with either Fe(II) or Fe(III) ions, suggesting the
      need of further partners to achieve a stable interaction.
- node_id: PANTHER:PTN000009661
  asserted_term:
    id: GO:0006879
    label: intracellular iron ion homeostasis
  evidence: IBD
  paint_snapshot: '20230109'
  seeds:
  - id: SGD:S000005752
  - id: SGD:S000006056
  - id: UniProtKB:Q9H1K1
  assessment: UNRESOLVED
  assessment_reason: >-
    All three seeds are eukaryotic (yeast ISU1/ISU2, human ISCU), where loss of
    scaffold function deregulates the Fe-S-sensing iron regulon (Aft1/2, IRP1/2). That
    is an indirect consequence of the scaffold's Fe-S assembly role, and placing it at a
    node that also contains bacterial IscU propagates a eukaryote-derived regulatory
    phenotype to bacteria. Human ISCU accepts the IBA, so the verdict is left
    unresolved rather than pruned pending a bacterial-member assessment.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10093/PTHR10093-paint.tsv
    supporting_text: "PTHR10093\tPTN000009661\tGO:0006879\tP\tIBD\tfalse"
