family_id: PANTHER:PTHR10093
family_name: IRON-SULFUR CLUSTER ASSEMBLY ENZYME  NIFU HOMOLOG
preferred_name: IscU/NifU-type iron-sulfur cluster scaffold family
summary: >-
  Small U-type scaffold proteins with three conserved cysteines and a conserved
  histidine on which a transient [2Fe-2S] (and, reductively coupled, [4Fe-4S]) cluster
  is built from cysteine desulfurase-derived sulfur and iron, and then transferred to
  apoprotein acceptors with the help of the HscB/HscA (Jac1/Ssq1, HSCB/HSPA9)
  chaperones. Members are bacterial IscU, the N-terminal scaffold domain of the
  nitrogenase-specific NifU proteins, mitochondrial ISU1/ISU2/ISCU of eukaryotes, and
  the Firmicutes SufU proteins. panther.obo defines nine subfamilies (SF8, SF12, SF15,
  SF20, SF24, SF26, SF29, SF30, SF31), but PTHR10093-entries.csv carries no subfamily
  data and the UniProt DR PANTHER lines of E. coli IscU (P0ACD4) and P. putida IscU
  (Q88PK7) are family-level only. SF26 (IRON-SULFUR CLUSTER ASSEMBLY ENZYME ISCU) is
  the subfamily named for IscU, but PANTHER 19.0's sequence classification file for E. coli places
  P0ACD4 in SF8 (IRON-SULFUR CLUSTER ASSEMBLY ENZYME), so subfamily scope is not used
  in this review until the member data resolve which subfamily holds bacterial IscU.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  IscU, NifU and eukaryotic ISCU/ISU are interchangeable-in-kind cluster scaffolds that
  differ only in system (housekeeping, nitrogenase or mitochondrial) and partner set.
  Iron handling also differs: eukaryotic ISCU/ISU bind Fe(II), whereas E. coli IscU
  does not stably bind free iron and receives it from donors. Firmicutes SufU is the divergent member: it binds zinc, accepts persulfide sulfur
  from SufS and has been characterized both as a scaffold and as a sulfur-transfer
  intermediate, so cluster-delivery claims for SufU should be checked member by member.
