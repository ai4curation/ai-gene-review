  assessment: UNRESOLVED
  assessment_reason: >-
    Withdraw the previous TOO_DEEP verdict based on an asserted absence of bacterial Fe(II) binding. Direct
    E. coli IscU native-MS experiments in PMID32131593 and PMID36605734 support iron interaction under
    tested conditions; they differ about assembly order and detectable intermediates. The negative isolated-protein
    result in PMID15153099 is retained as condition-specific evidence, not a domain-of-life boundary.
    The eukaryotic experimental seeds are legitimate evidence for the ancestral judgment, and their taxonomic
    origin or number alone does not make the node too deep. Complete node membership and the range of
    divergent U-type proteins are not resolved here, so neither a universal grant nor relocation to the
    eukaryotic node is justified. Existing node identity, seed list and raw PAINT assertion are unchanged.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10093/PTHR10093-paint.tsv
