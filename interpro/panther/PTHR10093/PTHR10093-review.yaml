term_assessments:
- assessed_term:
    id: GO:0140132
    label: iron-sulfur cluster chaperone activity
  scope: UNRESOLVED
  scope_reason: >-
    Cluster binding and delivery are established for characterized IscU/NifU/ISU scaffolds; the E. coli
    multiple-turnover evidence remains positive. A universal family grant is unjustified because the verified
    member B. subtilis SufU O32163 is a zinc-dependent sulfur-transfer protein in PMID24321018, and PMID29292548
    genetically places cluster assembly on SufBCD rather than SufU. Earlier PMID20097860 reported reconstitution
    and transfer from SufU to Leu1, which is retained as conflicting biochemical evidence rather than
    erased. The present evidence favors distinct physiological SufU and IscU roles without establishing
    a clean PANTHER subfamily boundary or a universal negative for every SufU-like member. No negative
    member exception or phylogenetic loss event is manufactured.
  supported_by:
  - reference_id: PMID:15964837
    supporting_text: >-
      Kinetic studies further showed that cluster transfer exhibits
      Michaelis-Menten behavior indicative of complex formation of holo-IscU and
      holo-IscA with apoferredoxin
  - reference_id: PMID:20097860
    supporting_text: The assembled Fe/S cluster could be transferred from SufU to the apo form of
      isopropylmalate isomerase Leu1
  - reference_id: PMID:24321018
    supporting_text: the B. subtilis SufU does not act as a standard Fe-S cluster scaffold protein.
  - reference_id: PMID:29292548
    supporting_text: B. subtilis SufSU is interchangeable with E. coli SufSE but not with IscSU.
