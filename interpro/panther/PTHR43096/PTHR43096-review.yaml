family_id: PANTHER:PTHR43096
family_name: DNAJ HOMOLOG 1, MITOCHONDRIAL-RELATED
preferred_name: DnaJ-like client-handling Hsp70 co-chaperones
summary: DnaJ-like proteins combine Hsp70-partner engagement with client recognition and control
  of protein folding. Type I and type II architectures and lineage-specific regulation alter client
  handling, partner dependence and measured ATPase stimulation. E. coli DnaJ and the two mycobacterial
  J proteins activate DnaK, whereas Thermus measurements and structures show that activity must be
  interpreted in its client and assembly context. Binding an unfolded client is distinct from binding
  a protein-folding chaperone, and neither observation alone establishes autonomous ATP-driven remodeling.
functional_coherence: HETEROGENEOUS
coherence_reason: The family includes type I bacterial DnaJ proteins, type II Thermus DnaJ2/CbpA-like
  members and eukaryotic co-chaperones. Shared J-domain architecture does not establish the same
  kinetic activation, client spectrum or localization. The Thermus record prevents an unconditional
  family-wide ATPase-activator grant, without proving that stimulation is impossible in every assembly
  or assay.
