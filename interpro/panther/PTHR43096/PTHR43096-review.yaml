term_assessments:
- assessed_term:
    id: GO:0001671
    label: ATPase activator activity
  scope: UNRESOLVED
  scope_reason: Direct E. coli and Mtb DnaK stimulation supports their positive member assignments,
    but an unconditional whole-family or whole-SF grant is unresolved. Mtb J1/J2 differ in concentration
    and cofactor dependence; the historical Thermus result is negative under its assay conditions.
    Modern Thermus autoinhibition/client-handoff structures do not by themselves supply a direct
    positive ATPase-rate assay. No negative member exception or loss node is asserted.
  supported_by:
  - reference_id: PMID:1826368
    supporting_text: the presence of DnaJ alone leads to an acceleration in the rate of hydrolysis
      of the DnaK-bound ATP.
  - reference_id: PMID:27872278
    supporting_text: We found that DnaJ1 and DnaJ2 activate the ATPase activity of DnaK differently.
  - reference_id: PMID:11162122
    supporting_text: Here, DnaJ does not stimulate the DnaK-mediated ATP hydrolysis
  - reference_id: PMID:41092901
    supporting_text: This region also maintains Hsp40 in an autoinhibited state; upon binding to
      Hsp70, the inhibition is disrupted, exposing a cryptic client-binding site that enables client
      engagement and refolding.
