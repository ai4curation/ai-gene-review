family_id: PANTHER:PTHR10806
family_name: SIGNAL PEPTIDASE COMPLEX CATALYTIC SUBUNIT SEC11
preferred_name: Type-I signal peptidase and eukaryotic Sec11 catalytic subunits
summary: >-
  PTHR10806 groups type-I signal peptidase-like enzymes, including fungal Sec11
  and vertebrate SEC11A/SEC11C catalytic subunits of the endoplasmic-reticulum
  signal peptidase complex. PAINT correctly keeps the signal peptidase complex
  and protein maturation IBDs on the Eukaryota PTN000086750 node, while placing
  only the generic peptidase-activity parent at the wider PTHR10806 root.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reviewed members share membrane signal peptidase catalysis, but cellular
  context diverges between bacterial or archaeal signal peptidase-like proteins
  and eukaryotic Sec11 enzymes, which act as catalytic subunits of the ER signal
  peptidase complex.
