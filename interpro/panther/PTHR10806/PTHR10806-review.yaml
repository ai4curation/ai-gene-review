  - id: UniProtKB:P67812
  - id: UniProtKB:Q9BY50
  node_taxon:
    id: NCBITaxon:2759
    label: Eukaryota
  assessment: SOUND
  assessment_reason: >-
    The process IBD is correctly on the same eukaryotic node as the ER signal
    peptidase complex placement: Sec11 catalytic subunits cleave signal peptides
    from nascent proteins as a protein-maturation step. GO:0051604 is a broad
    parent, so the reviewed fungal gene rows refine it to the live proteolytic
    term GO:0016485 protein processing.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10806/PTHR10806-paint.tsv
    supporting_text: "PTHR10806\tPTN000086750\tGO:0051604\tP\tIBD\tfalse\tSGD:S000001461|UniProtKB:P67812|UniProtKB:Q9BY50\ttaxon:2759\t20260528"
  - reference_id: PMID:42586426
    supporting_text: >-
      Following targeting, these sequences are cleaved by the heterotetrameric
      signal peptidase complex (SPC).
