  - reference_id: PMID:1846444
    supporting_text: >-
      Partially purified yeast microsomal signal peptidase appears to be a
      complex of four polypeptides of 13, 18, 20, and 25 kDa. The 18-kDa chain
      is the product of the Sec11 gene, which is necessary for signal peptidase
      activity.
- node_id: PANTHER:PTN000086750
  asserted_term:
    id: GO:0051604
    label: protein maturation
  evidence: IBD
  paint_snapshot: '20260528'
  seeds:
