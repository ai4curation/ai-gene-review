node_assessments:
- node_id: PANTHER:PTN001336067
  asserted_term:
    id: GO:0006508
    label: proteolysis
  evidence: IBD
  paint_snapshot: '20260529'
  seeds:
  - id: MGI:MGI:1913304
    organism: Mus musculus
  - id: MGI:MGI:2451097
    organism: Mus musculus
  - id: UniProtKB:Q96KN2
    label: CNDP1
    organism: Homo sapiens
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The PTN001336067 proteolysis IBD is seeded by animal active M20 dipeptidases and
    should not descend into the fungal Dug2 clade. S. cerevisiae Dug2 has no peptidase
    activity as a purified protein, and the activity it keeps in vivo is as the
    non-catalytic partner of Dug3 in a glutathione hydrolase complex that cleaves the
    gamma-glutamyl bond of small-molecule glutathione and gamma-Glu-Cys rather than
    proteolysing proteins. PAINT already marks PTN005154692 as the fungal
    glutathione-catabolism branch seeded by DUG2 itself, so the requested IRD is placed
    at that same clade.
  affected_subfamilies:
  - id: PANTHER:PTHR43270:SF8
    label: DI- AND TRIPEPTIDASE DUG2-RELATED
  proposed_action:
    paint_action: ADD_IRD
    target_node_id: PANTHER:PTN005154692
  supported_by:
  - reference_id: PMID:22277648
    supporting_text: Dug2p, which has an N-terminal WD40 and a C-terminal M20A peptidase
      domain, has no peptidase activity.
  - reference_id: PMID:22277648
    supporting_text: purified Dug2p showed negligible cleavage of Cys-Gly peptide (only 4%)
  - reference_id: PMID:22277648
    supporting_text: In vitro reconstitution assays revealed that Dug2p and Dug3p were
      required together for the cleavage of glutathione into glutamate and Cys-Gly.
term_assessments:
