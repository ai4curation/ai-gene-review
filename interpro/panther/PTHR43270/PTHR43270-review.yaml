- id: PMID:22277648
  title: >-
    Glutathione degradation by the alternative pathway (DUG pathway) in Saccharomyces
    cerevisiae is initiated by (Dug2p-Dug3p)2 complex, a novel glutamine
    amidotransferase (GATase) enzyme acting on glutathione.
