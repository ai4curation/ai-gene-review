  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The PTN001336067 proteolysis IBD is seeded by animal active M20 dipeptidases and
    should not descend to the Dug2-related WD40-M20A scaffold branch. S. cerevisiae Dug2
    has no peptidase activity as a purified protein, and the activity it keeps in vivo
    is as the non-catalytic partner of Dug3 in a glutathione hydrolase complex that
    cleaves the gamma-glutamyl bond of small-molecule glutathione and gamma-Glu-Cys
    rather than proteolysing proteins. PAINT already places the DUG2-seeded
    glutathione-catabolism IBD at PTN005154692, with taxon Eukaryota in the local PAINT
    slice, and the local GOA snapshot confirms that the active S. cerevisiae Dug1
    Cys-Gly dipeptidase does not receive the PTN005154692 IBA.
