  description: >-
    Fungal Dug2-related WD40-M20A proteins. PAINT already treats PTN005154692 as the
    fungal Dug2 glutathione-catabolism branch seeded by S. cerevisiae DUG2; this clade
    should lose the broader proteolysis IBD from PTN001336067.
  representative_members:
  - id: UniProtKB:P38149
    label: DUG2
    gene_symbol: DUG2
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/DUG2/DUG2-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Dug2 keeps an M20A-like C-terminal domain but it has no measurable Cys-Gly
    dipeptidase activity by itself; the domain instead mediates Dug2 homodimerization in
    the functional (Dug2p-Dug3p)2 glutathione hydrolase complex.
  supported_by:
  - reference_id: PMID:22277648
    supporting_text: Dug2p, which has an N-terminal WD40 and a C-terminal M20A peptidase
      domain, has no peptidase activity.
  - reference_id: PMID:22277648
    supporting_text: Dug2p was also shown to be able to homodimerize, and this was
      mediated by its M20A peptidase domain.
- subfamily_id: PANTHER:PTHR43270:SF4
  label: CARNOSINE DIPEPTIDASE 2, ISOFORM A
  description: >-
