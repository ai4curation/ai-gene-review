  assessment: SOUND
  assessment_reason: >-
    The PTN001336067 GO:0008233 IBD is sound as the broad M20 peptidase term for the
    mixed DUG1/CNDP/DUG2 branch. DUG2 is a PAINT seed for this row through its own SGD
    GO:0008233 IGI annotation from PMID:17179087, so DUG2 appearing in WITH/FROM is the
    legitimate target-as-descendant-evidence case rather than circular propagation. The
    S. cerevisiae evidence should still be read with qualifier precision: Dug2 lacks
    intrinsic M20 dipeptidase activity and contributes to GO:0036374 glutathione
    gamma-glutamate hydrolase in the Dug2/Dug3 complex, which is why the DUG2 gene
    review changes the individual GO:0008233 and GO:0008242 rows to that descendant
    activity with contributes_to.
