family_id: PANTHER:PTHR43270
family_name: BETA-ALA-HIS DIPEPTIDASE
preferred_name: M20 metallo-dipeptidases and Dug2 scaffolds
summary: >-
  A heterogeneous M20 metallopeptidase family that includes catalytically active
  bacterial diaminopimelate desuccinylases, animal CNDP1/CNDP2 dipeptidases and fungal
  Dug1 Cys-Gly metallodipeptidases, plus Dug2-related WD40-M20A scaffolds. The
  S. cerevisiae Dug2 M20A domain homodimerizes and scaffolds Dug3 in the cytosolic
  Dug2/Dug3 glutathione hydrolase, but purified Dug2 has no intrinsic Cys-Gly peptidase
  activity.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared M20 fold is associated with dipeptidase or amidohydrolase chemistry in the
  active CNDP, Dug1 and bacterial branches, but DUG2 has acquired an N-terminal WD40
  region and uses its C-terminal M20A-like domain as a non-catalytic homodimerization
  module in a GATase complex with Dug3.
