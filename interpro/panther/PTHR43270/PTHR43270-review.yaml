    label: proteolysis
  scope: UNRESOLVED
  scope_reason: >-
    This review establishes that proteolysis is unsafe for the Dug2-related SF8 branch,
    but it does not re-review whether GO:0006508 is the right process term for the
    animal CNDP dipeptidase seed clades. The requested PAINT change is therefore only an
    IRD at PTN005154692.
references:
