term_assessments:
- assessed_term:
    id: GO:0001217
    label: DNA-binding transcription repressor activity
  scope: FAMILY_WIDE
  scope_reason: Repression through a winged-helix DNA-binding domain is the defining activity of the family,
    holds for principal repressors and narrow-regulon paralogs alike, and is experimentally established
    for the module's exemplar. The bacterial_imuabc_damage_induced_mutagenesis module asserts this activity
    for its LexA gate annoton on that basis.
  supported_by:
  - reference_id: file:genes/PSEPK/lexA2/lexA2-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: Represses a number of genes involved in the response to DNA'
- assessed_term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  scope: FAMILY_WIDE
  scope_reason: The peptidase S24 autoprotease domain and the Ala-Gly cleavage site it acts on are present
    across the family and are what makes the repressor a damage-responsive switch; UniProt records the
    reaction under the curated LexA rule MF_00015. The activity is a family-wide property of the architecture
    rather than a subfamily specialization, although it has been assayed directly in only a few members.
  supported_by:
  - reference_id: file:genes/PSEPK/lexA2/lexA2-uniprot.txt
    supporting_text: CC       Reaction=Hydrolysis of Ala-|-Gly bond in repressor LexA.; EC=3.4.21.88;
- assessed_term:
    id: GO:0009432
    label: SOS response
  scope: UNRESOLVED
  scope_reason: SOS participation depends on the regulated damage-response function. P. putida LexA2 regulates
    a damage-inducible ImuABC cassette; a smaller regulon does not exclude it from the SOS response. This
    target-specific support does not establish that every divergent S24-family repressor regulates a damage-response
    program. Retain UNRESOLVED for unrestricted family transfer while assessing each characterized regulon
    on its biology, rather than treating non-principal paralogs as automatic exceptions.
  supported_by:
  - reference_id: PMID:17933893
    supporting_text: LexA1) seems to be in control of the conventional Escherichia coli-like SOS response
