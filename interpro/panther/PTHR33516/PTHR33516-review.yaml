      The family's only subfamily in the reviewed member set: every one of the
      478 reviewed entries sits here, from the principal SOS repressors of
      E. coli, Mycobacterium and Vibrio through lineage-specific paralogs such as
      P. putida LexA2 to phage repressors of the same architecture, including
      bacteriophage lambda cI. The subfamily therefore cannot be used to
      distinguish a principal SOS repressor from a narrow-regulon paralog or from
      a prophage maintenance repressor.
