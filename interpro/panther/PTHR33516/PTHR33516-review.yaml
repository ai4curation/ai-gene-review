family_id: PANTHER:PTHR33516
family_name: LEXA REPRESSOR
preferred_name: LexA-family SOS repressors and related S24 peptidase autoprotease repressors
summary: >-
  The LexA repressors and their structural relatives: winged-helix DNA-binding
  proteins fused to a peptidase S24 autoprotease domain. A member binds a
  palindromic operator and represses transcription; when RecA is activated on
  damage-generated single-stranded DNA it stimulates the repressor's
  autocatalytic cleavage at an Ala-Gly bond, which separates the DNA-binding
  domain from the dimerization domain and derepresses the regulon. The family
  contains both the principal SOS repressors and lineage-specific paralogs with
  narrow regulons, as well as phage repressors of the same architecture, which
  PANTHER keeps in the single subfamily SF2 alongside the bacterial proteins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Operator binding, transcriptional repression and RecA-stimulated autocleavage
  are shared across the family and are what the PAINT node asserts. What differs
  is which genes a member represses: the principal LexA of a genome controls the
  SOS regulon, whereas paralogs can control as little as their own operon, and
  the phage repressors in the same subfamily maintain lysogeny rather than
  participating in the host SOS response. Regulon-specific process claims
  therefore do not transfer between members, even though the molecular functions
  do.
