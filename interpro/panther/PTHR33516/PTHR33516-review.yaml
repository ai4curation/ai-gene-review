notes: 'Written while promoting modules/bacterial_imuabc_damage_induced_mutagenesis.yaml to COMPLETE,
  whose optional regulatory gate is grounded in this family through P. putida LexA2. Two of the family''s
  five PAINT assertions are the interesting ones. The four that concern binding and repression are sound
  at the bacterial LexA node because they say nothing about the regulon. The SOS response assertion is
  left UNRESOLVED: the available evidence does not establish which divergent S24 repressor members regulate
  a DNA-damage response. P. putida LexA2 does regulate a damage-inducible cassette, and its narrower
  regulon is not a counterexample to SOS-response participation. That is also why
  the module keeps its LexA part optional and species-neutral: which paralog gates the imuA-imuB-dnaE2
  cassette varies between genomes. The same subfamily SF2 holds the phage repressors used by modules/phage_temperate_lysogeny_switch.yaml,
  so SF2 is not a usable selector for "SOS repressor". Node depth for PTN002127974 was read from the PANTHER
  19 treeinfo service (pantherdb.org/services/oai/pantherdb/treeinfo?family=PTHR33516).'
