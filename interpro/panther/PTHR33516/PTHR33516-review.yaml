    assessment: SOUND
    assessment_reason: >-
      The seeds are the experimentally characterized principal LexA repressors of
      E. coli and Vibrio cholerae. The PANTHER 19 treeinfo service places
      PTN002127974 two levels below the tree root, as an internal speciation node
      with taxonomic range Eubacteria covering 39 of the 40 leaves in the
      reference tree, i.e. the bacterial LexA clade rather than the whole tree.
      That is the right depth for this term: repressor activity is the defining
      property of every bacterial member, including the narrow-regulon paralogs,
      whose repressor function is itself experimentally established. The phage
      repressors that share the subfamily are also repressors, so the term would
      not be wrong for them either, and in practice they do not receive it:
      lambda cI (P03034) carries no IBA from this node.
