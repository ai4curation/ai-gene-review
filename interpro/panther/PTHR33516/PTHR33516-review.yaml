notes: >-
  Written while promoting modules/bacterial_imuabc_damage_induced_mutagenesis.yaml
  to COMPLETE, whose optional regulatory gate is grounded in this family through
  P. putida LexA2. Two of the family's five PAINT assertions are the interesting
  ones. The four that concern binding and repression are sound at the bacterial
  LexA node because they say nothing about the regulon. The SOS response
  assertion is left UNRESOLVED: it is right for a genome's principal LexA and
  wrong for a narrow-regulon paralog such as LexA2, and nothing available here
  says how many clade members are of each kind. That is also why the module keeps
  its LexA part optional and species-neutral: which paralog gates the
  imuA-imuB-dnaE2 cassette varies between genomes. The same subfamily SF2 holds
  the phage repressors used by modules/phage_temperate_lysogeny_switch.yaml, so
  SF2 is not a usable selector for "SOS repressor". Node depth for PTN002127974
  was read from the PANTHER 19 treeinfo service
  (pantherdb.org/services/oai/pantherdb/treeinfo?family=PTHR33516).
