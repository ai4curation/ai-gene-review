term_assessments:
  - assessed_term:
      id: GO:0001217
      label: DNA-binding transcription repressor activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Repression through a winged-helix DNA-binding domain is the defining
      activity of the family, holds for principal repressors and narrow-regulon
      paralogs alike, and is experimentally established for the module's
      exemplar. The bacterial_imuabc_damage_induced_mutagenesis module asserts
      this activity for its LexA gate annoton on that basis.
    supported_by:
      - reference_id: file:genes/PSEPK/lexA2/lexA2-uniprot.txt
        supporting_text: 'CC   -!- FUNCTION: Represses a number of genes involved in the response to DNA'
  - assessed_term:
      id: GO:0004252
      label: serine-type endopeptidase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The peptidase S24 autoprotease domain and the Ala-Gly cleavage site it acts
      on are present across the family and are what makes the repressor a
      damage-responsive switch; UniProt records the reaction under the curated
      LexA rule MF_00015. The activity is a family-wide property of the
      architecture rather than a subfamily specialization, although it has been
      assayed directly in only a few members.
    supported_by:
      - reference_id: file:genes/PSEPK/lexA2/lexA2-uniprot.txt
        supporting_text: 'CC       Reaction=Hydrolysis of Ala-|-Gly bond in repressor LexA.; EC=3.4.21.88;'
  - assessed_term:
      id: GO:0009432
      label: SOS response
    scope: UNRESOLVED
    scope_reason: >-
      Whether a given family member belongs to the SOS response depends on what
      it represses, not on what it is. A genome's principal LexA controls the SOS
      regulon; a paralog may control only its own operon, as P. putida LexA2
      does, and that member's review treats the SOS response term as an
      over-annotation. The family cannot settle the question for an arbitrary
      member, so the scope is left unresolved and the decision is made per gene.
      Missing evidence: a per-genome census distinguishing principal LexA
      proteins from narrow-regulon paralogs across the clade.
    supported_by:
      - reference_id: PMID:17933893
        supporting_text: LexA1) seems to be in control of the conventional Escherichia coli-like SOS response
