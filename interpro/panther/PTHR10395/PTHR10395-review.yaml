family_id: PANTHER:PTHR10395
family_name: URICASE AND TRANSTHYRETIN-RELATED
preferred_name: Transthyretin-related family (5-hydroxyisourate hydrolase and transthyretin)
summary: >-
  The family contains 5-hydroxyisourate (HIU) hydrolases, which hydrolyse the urate oxidase product
  in purine/urate catabolism (bacterial PucM, S. pombe SPCC285.04, vertebrate URAH), and vertebrate
  transthyretin (TTR), a plasma thyroxine- and retinol-binding transport protein that evolved from
  an HIU hydrolase and has no hydrolase activity.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  HIU hydrolase activity is confined to SF7 and SF11. Transthyretin (SF12) is a non-enzymatic hormone
  carrier.
