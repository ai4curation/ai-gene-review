  assessment: TOO_DEEP
  proposed_action:
    paint_action: REMOVE_IBD
  assessment_reason: >-
    The Eumetazoa node reaches all three reviewed human NOS paralogs, but NOS1, NOS2
    and NOS3 all reject a stable nucleus assignment. PAINT should remove this broad
    IBD and, if the rodent seed evidence warrants it, re-add nucleus only at supported
    narrower mammalian or isoform-specific placements.
