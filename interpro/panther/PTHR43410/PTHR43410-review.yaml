  - id: UniProtKB:P29475
  node_taxon:
    id: NCBITaxon:6072
    label: Eumetazoa
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Plasma-membrane localization is sound for reviewed human NOS1 and NOS3, but the
    same Eumetazoa IBD reaches inducible NOS2, whose reviewed human record is
    cytosolic. PAINT should add an IRD at the NOS2 clade to prune this otherwise
    sound placement from inducible NOS proteins; the cached PANTHER 19 tree does
    not expose a stable mammalian NOS2 descendant PTN to name as the target here.
  supported_by:
