family_id: PANTHER:PTHR43410
family_name: NITRIC OXIDE SYNTHASE OXYGENASE
preferred_name: Nitric oxide synthase oxygenase family
summary: >-
  PTHR43410 contains nitric-oxide synthases that oxidize L-arginine to L-citrulline
  and nitric oxide. The reviewed human members NOS1, NOS2 and NOS3 retain the
  catalytic oxygenase/reductase chemistry, while neuronal, inducible and endothelial
  paralogs deploy that chemistry in different cellular locations and physiological
  contexts.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Nitric-oxide synthase activity and NO biosynthesis are shared across the human NOS
  paralogs, but PAINT placements at the broad Eumetazoa and animal NOS nodes also
  propagate paralog-specific nuclear, plasma-membrane, immune, vascular and
  hormone-response contexts to human isoforms that do not use those terms as durable
  direct functions.
