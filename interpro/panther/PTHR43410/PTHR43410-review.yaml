  node_taxon:
    id: NCBITaxon:6072
    label: Eumetazoa
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Lipopolysaccharide response is an inducible immune context for NOS2-like
    biology, not a process shared by every mammalian NOS paralog. Reviewed human
    NOS1 and NOS3 both mark the current Eumetazoa propagation as over-annotated;
    PAINT should keep the NOS2 inheritance and add losses on the NOS1 and NOS3
    branches; the cached PANTHER 19 tree does not expose stable mammalian NOS1
    or NOS3 descendant PTNs to name as targets here.
  supported_by:
