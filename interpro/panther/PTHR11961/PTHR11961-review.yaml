family_id: PANTHER:PTHR11961
family_name: CYTOCHROME C
preferred_name: Cytochrome C
summary: CYTOCHROME C (PANTHER:PTHR11961) is characterized in PANTHER PAINT across 1 ancestral PTN node(s) (PANTHER:PTN000238899)
  with 4 IBD node assertion(s) and 0 term(s) carrying negated IRD/IKR branch blocks, covering mitochondrial intermembrane
  space (GO:0005758, CC), electron transfer activity (GO:0009055, MF), mitochondrial electron transport, ubiquinol
  to cytochrome c (GO:0006122, BP), mitochondrial electron transport, cytochrome c to oxygen (GO:0006123, BP).
functional_coherence: MOSTLY_COHERENT
coherence_reason: Core family functions (mitochondrial intermembrane space (GO:0005758, CC), electron transfer activity
  (GO:0009055, MF), mitochondrial electron transport, ubiquinol to cytochrome c (GO:0006122, BP), mitochondrial
  electron transport, cytochrome c to oxygen (GO:0006123, BP)) are shared across the annotated subfamilies (scoped
  as SUBFAMILY_ONLY/UNRESOLVED rather than FAMILY_WIDE due to out-of-clade members in interpro/panther/PTHR11961/PTHR11961-entries.csv
  or member-level pruning), with lineage-specific variation reflected by PAINT IBD node PANTHER:PTN000238899 (Eukaryota
  (NCBITaxon:2759)) whereas interpro/panther/PTHR11961/PTHR11961-entries.csv contains family members outside that
  taxonomic clade.
