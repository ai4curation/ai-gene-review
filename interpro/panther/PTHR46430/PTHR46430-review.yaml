family_id: PANTHER:PTHR46430
family_name: PROTEIN SKT5-RELATED
preferred_name: Chs4/Skt5-type chitin synthase regulator family
summary: >-
  Fungal Sel1-repeat proteins. S. cerevisiae SKT5/CHS4 and its sporulation paralog SHC1 recruit and
  activate chitin synthase III (CHS3) at the bud neck and spore wall. S. pombe chr4 (SF2) and cfh2
  (SF3) are related chitin synthase regulatory factors.
functional_coherence: MOSTLY_COHERENT
coherence_reason: All subfamilies regulate chitin synthases; only SF1 is shown to activate CHS3.
