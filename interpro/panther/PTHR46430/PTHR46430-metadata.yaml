  name:
    name: Chitin Synthase Regulator
    short: Chitin_Synth_Reg
  description:
  - text: This family of proteins includes regulators of chitin synthase, an enzyme
      responsible for the biosynthesis of chitin. Chitin is a key structural polymer
      in fungal cell walls. Members of this family are involved in the activation
      and regulation of chitin synthase activity, which is crucial for cell wall integrity,
      septum formation, and sporulation in fungi. Some proteins in this family are
      specifically required for the activation of chitin synthase III (CHS3), which
      polymerizes chitin into its polymeric form. Additionally, the chitin produced
      by CHS3 can be modified to chitosan, contributing to cell wall robustness, anchoring
      melanin, and evading host immune detection during infection.
