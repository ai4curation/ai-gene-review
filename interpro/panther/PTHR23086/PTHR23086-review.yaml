family_id: PANTHER:PTHR23086
family_name: PHOSPHATIDYLINOSITOL-4-PHOSPHATE 5-KINASE
preferred_name: Phosphatidylinositol phosphate kinase family (type I PIP5K and type II PIP4K)
summary: >-
  PIPKs phosphorylate phosphatidylinositol monophosphates to PI(4,5)P2. Type I PI4P 5-kinases (S.
  cerevisiae MSS4, S. pombe its3, human PIP5K1A/B/C) make the plasma-membrane PI(4,5)P2 pool. Type
  II PIP4Ks (PIP4K2A/B/C) phosphorylate PI5P at the 4-position instead. PIP5KL1 is a weakly active
  related protein.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Type I (5-kinase) and type II (4-kinase) PIPKs act on different substrates. PANTHER places fungal
  MSS4/its3 in SF8, which is named for a PI5P 4-kinase although these proteins are type I PI4P 5-kinases.
