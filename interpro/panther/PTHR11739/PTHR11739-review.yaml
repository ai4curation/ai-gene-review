family_id: PANTHER:PTHR11739
family_name: CITRATE SYNTHASE
preferred_name: Citrate synthase family (type I CS and 2-methylcitrate synthase)
summary: >-
  Citrate synthases condense acetyl-CoA and oxaloacetate to citrate. S. cerevisiae has mitochondrial
  CIT1 (TCA cycle), peroxisomal CIT2 (glyoxylate cycle) and mitochondrial CIT3, which also makes
  2-methylcitrate. S. pombe has cit1. The family also contains the bacterial PrpC 2-methylcitrate
  synthases of propionate catabolism.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Citrate synthase activity holds for SF8, SF4 and SF15. PrpC (SF25) is a 2-methylcitrate synthase;
  CIT3 (SF15) is dual-specificity.
