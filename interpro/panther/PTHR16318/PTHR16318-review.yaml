    organism: Mus musculus
  - id: UniProtKB:Q9NZ42
    label: PSENEN
    organism: Homo sapiens
  assessment: UNRESOLVED
  assessment_reason: >-
    All seeds are bilaterian, yet the term is placed at Eukaryota. For Dictyostelium this is
    reasonable, because its presenilin, nicastrin and Aph1 form an active gamma-secretase.
    PEN-2 itself was not knocked out in that study, and PANTHER keeps Dictyostelium psenen in
    this family. For the plant ortholog there is no evidence for a gamma-secretase complex.
    This is not a Notch term. It is recorded to show that complex membership is placed deeper
    than the Notch role.
