  assessment: SOUND
  assessment_reason: >-
    PTN000418973 is the Bilateria SPECIATION node that joins the Euteleostomi (PTN002702266) and
    Ecdysozoa (PTN000418997) clades. It excludes Dictyostelium (PTN001046330) and Arabidopsis
    (PTN000419008), which is exactly the Notch boundary. The seeds come from both sides: fly
    pen-2 and mouse Psenen. PEN-2 does part of the S3 cleavage work, as the subunit that
    activates presenilin inside the complex, so this is participation.
