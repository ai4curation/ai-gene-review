family_id: PANTHER:PTHR16318
family_name: GAMMA-SECRETASE SUBUNIT PEN-2
summary: >-
  PEN-2 is the smallest gamma-secretase subunit, a roughly 100-residue hairpin membrane protein
  with two transmembrane segments. It joins the nicastrin/APH-1/presenilin intermediate last
  and triggers presenilin endoproteolysis into its active N- and C-terminal fragments, which
  makes it needed for gamma-secretase activity. PEN-2 was identified with APH-1 in a C. elegans
  screen for genes interacting with presenilin and nicastrin in Notch signaling. RNAi against
  Drosophila pen-2 reduces gamma-secretase cleavage of Notch and APP. The family is single-copy
  in each model organism and is found across eukaryotes, including Dictyostelium and plants,
  neither of which has Notch.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  PANTHER defines one subfamily (SF0), and all characterized members are gamma-secretase
  subunits. Notch-pathway participation is metazoan only. Dictyostelium psenen (Q54BR1) and
  Arabidopsis At5g09310 (Q9FY84) are in the same subfamily but outside the Bilateria node
  PTN000418973, in organisms with no Notch pathway.
