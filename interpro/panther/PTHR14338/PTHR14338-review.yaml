family_id: PANTHER:PTHR14338
family_name: ACTIN FILAMENT-ASSOCIATED PROTEIN 1 FAMILY MEMBER
preferred_name: AFAP actin-associated signaling adaptors
summary: AFAP1, AFAP1L1 and AFAP1L2/XB130 are PH-domain-containing adaptor proteins associated with actin
  and membrane signaling. Their interaction regions recruit different signaling partners rather than catalyzing
  a shared chemical reaction. AFAP1L2 evidence for signal transduction should be interpreted in the context
  of that paralog's architecture and partners.
functional_coherence: HETEROGENEOUS
coherence_reason: Human XB130/AFAP1L2 interacts with SRC, and deletion or depletion experiments affect
  SRC signaling (PMID:17412687), providing direct adaptor evidence. AFAP1, AFAP1L1 and AFAP1L2 share PH-domain-associated
  scaffolding architecture but differ in actin and signaling partners. SRC activation and a particular
  phosphoinositide preference are not universal family properties.
