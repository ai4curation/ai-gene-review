- node_id: PANTHER:PTN002886021
  asserted_term:
    id: GO:0003978
    label: UDP-glucose 4-epimerase activity
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN000041817
  paint_snapshot: '20260530'
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    IRD on a plant duplication node (277 leaves) whose two daughter lineages are the Streptophyta
    UGE clade and the chloroplast stem-loop binding proteins CSP41A and CSP41B (SF6, SF8). PAINT
    re-asserts the activity on the UGE clade with the IBD at PTN008684631, so the net effect of the
    pair is to withdraw epimerase activity only from the CSP41 lineage. CSP41A and CSP41B are
    chloroplast RNA-binding proteins, and no UDP-sugar epimerase activity has been reported for them,
    so the combination is appropriate.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43725/PTHR43725-paint.tsv
    supporting_text: "PTHR43725\tPTN002886021\tGO:0003978\tF\tIRD\ttrue"
