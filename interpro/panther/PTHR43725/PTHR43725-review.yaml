family_id: PANTHER:PTHR43725
family_name: UDP-GLUCOSE 4-EPIMERASE
preferred_name: UDP-glucose 4-epimerase (GALE/GAL10) family
summary: >-
  NAD-dependent SDR-family UDP-hexose 4-epimerases. UDP-glucose 4-epimerases (human GALE, S. cerevisiae
  GAL10, S. pombe gal10, bacterial GalE, plant UGE) interconvert UDP-galactose and UDP-glucose in
  the Leloir pathway; human GALE also epimerises UDP-GlcNAc. Plant UXE/UEL subfamilies epimerise
  UDP-xylose and UDP-arabinose.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Most subfamilies are UDP-glucose 4-epimerases; the plant UDP-arabinose 4-epimerase subfamilies
  (SF33, SF38) act on pentose nucleotide sugars.
