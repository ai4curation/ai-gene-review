family_id: PANTHER:PTHR11227
family_name: WD-REPEAT PROTEIN INTERACTING WITH PHOSPHOINOSIDES  WIPI -RELATED
preferred_name: WIPI/PROPPIN phosphoinositide-binding autophagy adaptors
summary: PTHR11227 contains eukaryotic beta-propeller WIPI/PROPPIN phosphoinositide effectors,
  including fungal Atg18, Atg21 and Hsv2 paralogs and metazoan WIPI proteins. PI3P and PI(3,5)P2
  binding are deep conserved, but selective-autophagy process terms should be handled below
  the root because the root node spans paralogs with different Cvt, pexophagy, mitophagy and
  nucleophagy specializations.
functional_coherence: HETEROGENEOUS
coherence_reason: The family is coherent for PROPPIN phosphoinositide binding and membrane-adaptor
  activity, but budding-yeast Atg18, Atg21/Hsv2 and metazoan WIPI paralogs have diverged selective-autophagy
  cargos and protein partners.
