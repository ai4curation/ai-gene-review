family_id: PANTHER:PTHR22976
family_name: BIOTIN SYNTHASE
preferred_name: Biotin synthase (BioB/BIO2) radical-SAM family
summary: >-
  Biotin synthase (BioB, EC 2.8.1.6) is a radical S-adenosyl-L-methionine (SAM) enzyme. It
  catalyses the last step of biotin synthesis, inserting a sulfur atom between C6 and C9 of
  dethiobiotin to close the thiophane ring. It carries a [4Fe-4S] cluster that cleaves SAM, and a
  [2Fe-2S] cluster that serves as the sulfur source. The family is found in bacteria, archaea,
  fungi and plants. Eukaryotic members (S. cerevisiae BIO2, S. pombe bio2, Arabidopsis BIO2) are
  mitochondrial. PANTHER defines a single subfamily (SF2). The radical-SAM fold is shared with
  other enzymes, and the family also takes in a few archaeal radical-SAM proteins that are not
  biotin synthases. One of these is Methanocaldococcus HcgA, which makes a precursor of the
  [Fe]-hydrogenase FeGP cofactor.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Biotin synthase activity is conserved in the bacterial, fungal and plant members. The
  exceptions are archaeal radical-SAM paralogs filed in the same subfamily (SF2). One is
  M. jannaschii HcgA (Q58195), an FeGP-cofactor biosynthesis enzyme whose ortholog makes
  6-carboxymethyl-5-methyl-4-hydroxy-2-pyridinol. Another is the uncharacterized M. jannaschii
  MJ0597 (Q58014). Both inherit biotin synthase activity from the family-root PAINT node, and
  M. jannaschii also has its own BioB (Q58692).
