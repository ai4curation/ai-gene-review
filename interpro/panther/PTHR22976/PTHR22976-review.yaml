notes: >-
  The module biotin_biosynthesis (bioB_activity) uses the family id PTHR22976 with GO:0004076,
  which is consistent with FAMILY_WIDE scope. Its statement that BIO2 is mitochondrial is
  consistent with the BIO2 review. The BIO2 review accepts the GO:0004076, GO:0009102 and
  GO:0051537 IBAs. The S. pombe bio2 review is still a stub (PENDING), and the P. putida bioB
  review has no IBA rows. HcgA (Q58195) and MJ0597 (Q58014) are SF2 members per the PANTHER
  entries file. Their inheritance of GO:0004076, GO:0009102 and GO:0051537 from PTN000540961, and
  Synechocystis P73538's GO:0016740 from PTN001884789, were checked in the PAINT UniProt GAF on
  2026-10-06. HcgA function is from its M. maripaludis ortholog (PMID:36264001), as recorded in
  UniProt (by similarity to Q6M0Z2).
