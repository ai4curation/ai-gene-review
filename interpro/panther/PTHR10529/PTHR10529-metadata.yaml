  name:
    name: Adaptor complexes medium subunit
    short: Adaptor_comp_med_subunit
  description:
  - text: The adaptor complexes medium subunit family is involved in the selection
      and concentration of membrane proteins into vesicles for intracellular trafficking.
      Members of this family are components of various adaptor protein (AP) complexes,
      such as AP-1, AP-2, AP-3, and AP-4, which are not always clathrin-associated.
      These complexes play roles in sorting proteins at the trans-Golgi network, endosomes,
      and plasma membrane, contributing to processes like endocytosis, vesicle formation,
      and cargo selection. Some family members are directly involved in recognizing
      tyrosine-based sorting signals on cargo proteins. The family also includes proteins
      like Stonin-1 and Stonin-2, which are implicated in the endocytic recycling
      of synaptic vesicles and may facilitate clathrin-coated vesicle uncoating.
