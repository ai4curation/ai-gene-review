family_id: PANTHER:PTHR10529
family_name: AP COMPLEX SUBUNIT MU
preferred_name: Adaptor protein complex mu subunits and stonins
summary: >-
  Medium (mu) subunits of eukaryotic heterotetrameric adaptor protein (AP)
  complexes (AP-1 through AP-4) and monomeric stonin endocytic adaptors (STON1,
  STON2, Drosophila stoned-B, C. elegans UNC-41). Family members share an
  N-terminal longin-like domain (which incorporates into the AP heterotetramer
  core in AP1M-AP4M or is replaced by a proline-rich/SHD region in stonins) and
  a C-terminal beta-sandwich mu-homology domain (MHD, IPR028565) that binds
  tyrosine-based (YxxPhi) or cargo-specific sorting motifs in the cytosolic
  tails of transmembrane cargo proteins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized subfamilies act as cargo-sorting adaptors via their C-terminal
  mu-homology domain (IPR028565), but individual subfamilies assemble into
  distinct adaptor complexes at different organelles and with different coat
  partners: AP-2 mu (SF236) and stonins (SF345) mediate clathrin-dependent
  endocytosis at the plasma membrane; AP-1 mu (SF257, SF234) mediates
  clathrin-coated sorting at the trans-Golgi network (TGN) and endosomes;
  AP-3 mu (SF342, SF341) mediates sorting to lysosomes, melanosomes, and
  synaptic vesicles; and AP-4 mu (SF270) forms a non-clathrin coat at the TGN.
