      - id: PANTHER:PTHR10529:SF345
        label: STONIN-2
      - id: PANTHER:PTHR10529:SF344
        label: PROTEIN STONED-B
    scope_reason: >-
      AP-1 mu (SF257, SF262, SF234), AP-2 mu (SF236), and stonin/stoned-B
