residue_sites:
  - site_id: ap2m1_thr156_activation_switch
    label: AP2M1 Thr156 regulatory phosphorylation site
    description: >-
      Threonine-156 in the linker between the N-terminal longin domain and the
      C-terminal mu-homology domain of AP2M1; phosphorylation by AAK1 stabilizes
      the open conformation that exposes the YxxPhi cargo-binding pocket.
    anchor:
      id: UniProtKB:Q96CW1
      label: AP-2 complex subunit mu
      gene_symbol: AP2M1
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: UNIPROT_FEATURE
    residues:
      - position: 156
        expected:
          - T
        role: >-
          Phosphothreonine phosphorylated by AAK1 to unlock YxxPhi cargo binding
          in membrane-associated AP-2
    required_for:
      - term:
          id: GO:0035615
          label: clathrin-cargo adaptor activity
        strength: CONTRIBUTES
        rationale: >-
          Phosphorylation of Thr156 promotes the conformational switch from the
          locked cytosolic AP-2 core to the open membrane-bound state that binds
          YxxPhi endocytosis motifs.
        supported_by:
          - reference_id: file:genes/human/AP2M1/AP2M1-uniprot.txt
            supporting_text: >-
              The surface region interacting with to the Y-X-X-Phi motif is
              inaccessible in cytosolic AP-2, but becomes accessible through a
              conformational change following phosphorylation of AP-2 mu subunit
              at Thr-156 in membrane-associated AP-2 (PubMed:11877457).
term_assessments:
  - assessed_term:
      id: GO:0140312
      label: cargo adaptor activity
    scope: FAMILY_WIDE
    scope_reason: >-
      All subfamilies of PTHR10529 function as cargo adaptors that recognize
      cytosolic sorting signals on transmembrane proteins via their conserved
      C-terminal mu-homology domain (MHD) to package cargos into transport
      vesicles.
    supported_by:
      - reference_id: file:interpro/panther/PTHR10529/PTHR10529-metadata.yaml
        supporting_text: >-
          The adaptor complexes medium subunit family is involved in the
          selection and concentration of membrane proteins into vesicles for
          intracellular trafficking.
      - reference_id: file:genes/human/AP2M1/AP2M1-uniprot.txt
        supporting_text: >-
          AP-2 also serves as a cargo receptor to selectively sort the membrane
          proteins involved in receptor-mediated endocytosis (PubMed:16581796).
      - reference_id: file:genes/human/AP4M1/AP4M1-uniprot.txt
        supporting_text: >-
          Within AP-4, the mu-type subunit AP4M1 is directly involved in the
          recognition and binding of tyrosine-based sorting signals found in the
          cytoplasmic part of cargos (PubMed:10436028, PubMed:11139587,
          PubMed:20230749, PubMed:26544806).
  - assessed_term:
      id: GO:0005048
      label: signal sequence binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Mu subunits across AP-1, AP-2, AP-3, and AP-4 directly bind peptide
      sorting signals (such as YxxPhi motifs) in the cytosolic tails of
      transmembrane cargos via a conserved hydrophobic pocket on the C-terminal
      MHD beta-sandwich.
    supported_by:
      - reference_id: file:genes/human/AP2M1/AP2M1-uniprot.txt
        supporting_text: >-
          The surface region interacting with to the Y-X-X-Phi motif is
          inaccessible in cytosolic AP-2, but becomes accessible through a
          conformational change following phosphorylation of AP-2 mu subunit at
          Thr-156 in membrane-associated AP-2 (PubMed:11877457).
      - reference_id: file:genes/human/AP4M1/AP4M1-uniprot.txt
        supporting_text: >-
          Within AP-4, the mu-type subunit AP4M1 is directly involved in the
          recognition and binding of tyrosine-based sorting signals found in the
          cytoplasmic part of cargos (PubMed:10436028, PubMed:11139587,
          PubMed:20230749, PubMed:26544806).
  - assessed_term:
      id: GO:0035615
      label: clathrin-cargo adaptor activity
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
