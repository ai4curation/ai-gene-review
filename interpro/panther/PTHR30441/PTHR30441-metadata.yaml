  description:
  - text: This family of proteins is implicated in the process of outer membrane protein
      assembly. One member is specifically involved in preventing the assembly of
      defective versions of the OmpF protein, suggesting a quality control role in
      the biogenesis of membrane components. The broader function of the family appears
      to be associated with the assembly or maintenance of outer membrane structures
      in bacteria.
