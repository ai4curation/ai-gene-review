family_id: PANTHER:PTHR43797
family_name: HOMOCYSTEINE/CYSTEINE SYNTHASE
preferred_name: O-acetylhomoserine sulfhydrylase (MetY/MET17) family
summary: >-
  Fold-type I PLP enzymes that make L-homocysteine in one step by direct sulfhydrylation of
  O-acetyl-L-homoserine with sulfide: S. cerevisiae MET17 (MET25/MET15), S. pombe met17, Aspergillus
  CysD, Corynebacterium glutamicum and Leptospira MetY, Thermus and Thermotoga O-acetylhomoserine
  sulfhydrylases. Several members also accept O-acetyl-L-serine (yeast MET17 makes cysteine in vitro)
  or methanethiol (C. glutamicum MetY can form methionine directly). The family also contains
  sulfhydrylase-like enzymes of fungal secondary metabolism (Fusarium FUB7 in fusaric acid synthesis,
  Epichloe LolC in loline alkaloid synthesis) and the uncharacterized E. coli YhfS.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The primary-metabolism members share O-acetylhomoserine sulfhydrylase activity, and PAINT places
  that activity at a single root node. The secondary-metabolism sulfhydrylases (FUB7, LolC) act on
  other gamma-substituted homoserine-derived substrates, and E. coli YhfS has no assigned function, so
  the family is not uniformly an O-acetylhomoserine sulfhydrylase.
