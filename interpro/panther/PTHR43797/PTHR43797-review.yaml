  assessment: SOUND
  assessment_reason: >-
    O-acetylhomoserine sulfhydrylase is the characterized activity of the yeast, fission-yeast,
    Candida, Thermotoga and Corynebacterium members, and the node placement at the family root matches
    its distribution across bacteria and fungi. The 2026-06 snapshot replaced the older GO:0004124
    cysteine synthase assertion that GOA still propagates from this node (QuickGO, November 2026);
    cysteine synthase is a secondary in vitro activity of some members, not the family function. The
    secondary-metabolism sulfhydrylases (FUB7, LolC) and YhfS descend from the same node and are not
    shown to have the activity; they are left as potential exceptions rather than pruned, because no
    experiment shows the activity to be absent.
