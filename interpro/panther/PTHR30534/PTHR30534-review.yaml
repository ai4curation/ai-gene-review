family_id: PANTHER:PTHR30534
family_name: FLAGELLAR MOTOR SWITCH PROTEIN FLIG
preferred_name: FliG flagellar rotor/switch protein family
summary: >-
  FliG is the C-ring protein that couples the flagellar rotor to the stators. Its
  N-terminal domain binds the MS-ring protein FliF, its middle domain binds FliM, and its
  C-terminal domain carries the charged residues that interact with the cytoplasmic loop
  of the MotA (or PomA) stator subunit to generate torque. CheY-P binding to FliM and FliN
  reorients the FliG C-terminal domain relative to the stators, which reverses the
  direction of rotation. The family is a single flagellar subfamily across bacteria,
  including E. coli, Salmonella, Helicobacter and P. putida KT2440.
functional_coherence: COHERENT
coherence_reason: >-
  All members are flagellar rotor/switch FliG proteins in a single subfamily (SF0).
