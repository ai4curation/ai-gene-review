- assessed_term:
    id: GO:0000287
    label: magnesium ion binding
  scope: FAMILY_WIDE
  scope_reason: >-
    PanB is a magnesium-dependent enzyme across the family (PAINT PTN000466854, seeded by
    E. coli and M. tuberculosis PanB). This is a cofactor term, not a core function, and the
    S. cerevisiae review keeps it as non-core.
  supported_by:
  - reference_id: file:genes/yeast/ECM31/ECM31-ai-review.yaml
    supporting_text: Plausible inherited cofactor binding, not core.
- assessed_term:
    id: GO:0005739
    label: mitochondrion
  scope: UNRESOLVED
  scope_reason: >-
    True for the plant KPHMTs and S. cerevisiae Ecm31, not for the bacterial members, which are
    cytoplasmic. PANTHER has no subfamily that separates the eukaryotic enzymes (all members
    are in SF0), so the term cannot be scoped by subfamily. Apply it per lineage, following the
    eukaryotic node PTN000466856.
  supported_by:
  - reference_id: file:genes/yeast/ECM31/ECM31-ai-review.yaml
    supporting_text: ketopantoate hydroxymethyltransferases are mitochondrial; consistent with yeast proteomics.
