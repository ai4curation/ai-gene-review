    organism: Arabidopsis thaliana
  - id: SGD:S000000380
    label: ECM31
    organism: Saccharomyces cerevisiae
  assessment: SOUND
  assessment_reason: >-
    Plant and budding-yeast seeds support a mitochondrial eukaryotic enzyme. One gap: in the
    PAINT UniProt GAF, S. pombe ecm31 (Q09672) does not descend from this node. It descends
    from the Bacteria-labelled node PTN000466876 instead, and so receives cytoplasm
    (GO:0005737) rather than mitochondrion by IBA. Its own GOA record carries mitochondrion by
    HDA, and the PomBase GO-CAM cited in the coenzyme A module places it in the mitochondrion.
    The S. pombe enzyme's tree position therefore looks like a placement artefact or a
    horizontal transfer. Neither the mitochondrion nor the cytoplasm term is false for it,
    since GO counts mitochondria as part of the cytoplasm.
