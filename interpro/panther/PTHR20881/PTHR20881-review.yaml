family_id: PANTHER:PTHR20881
family_name: 3-METHYL-2-OXOBUTANOATE HYDROXYMETHYLTRANSFERASE
preferred_name: PanB ketopantoate hydroxymethyltransferase family
summary: >-
  Ketopantoate hydroxymethyltransferases (PanB, EC 2.1.2.11) transfer a hydroxymethyl group from
  5,10-methylenetetrahydrofolate to 3-methyl-2-oxobutanoate (alpha-ketoisovalerate), forming
  2-dehydropantoate (ketopantoate). This is the first committed step of pantoate and therefore of
  pantothenate (vitamin B5) synthesis. The family is found in bacteria, archaea, fungi and plants;
  animals, which take up pantothenate from the diet, have no member. PANTHER has a single
  subfamily (SF0) for the whole family, and the characterized members, from E. coli PanB to
  S. cerevisiae Ecm31 and the Arabidopsis KPHMT1/KPHMT2 pair, all do the same reaction. The
  bacterial enzymes are soluble and cytoplasmic; the plant and budding-yeast enzymes act in
  mitochondria.
functional_coherence: COHERENT
coherence_reason: >-
  One subfamily, one reaction. Every characterized member is a ketopantoate
  hydroxymethyltransferase, and the yeast and plant members required for de novo pantothenate
  synthesis are orthologs of bacterial PanB. The only lineage-dependent property is the
  compartment: cytoplasmic in bacteria, mitochondrial in plants and S. cerevisiae.
