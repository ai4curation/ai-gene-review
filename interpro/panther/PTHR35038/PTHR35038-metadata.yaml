  name:
    name: Multiheme Cytochrome Electron Transporters
    short: Multiheme_Cytochr_ET
  description:
  - text: The protein family encompasses a group of multiheme cytochromes involved
      in various anaerobic respiratory processes. Members of the family are known
      to mediate electron transport in the reduction of Fe(3+) and sulfite to sulfide,
      acting as crucial components in the electron transfer chain under anaerobic
      conditions. While some members, such as OmcB, are specifically involved in Fe(3+)
      reduction, others like MccA and SirA catalyze the reduction of sulfite to sulfide.
      Notably, OmcC is not involved in Fe(3+) reduction, indicating a diversity of
      functions within the family. The family's role in these processes is essential
      for the survival of microorganisms in environments where oxygen is scarce or
      absent.
