notes: >-
  The family PAINT slice was fetched with just fetch-panther-paint PTHR11093.
  just paint-losses human RUVBL1 and just paint-losses human RUVBL2 reported no
  IRD/IKR losses on either lineage. The production GO-CAM index had no RUVBL1
  or RUVBL2 hits, so no GO-CAM review is linked. INO80, SRCAP and TIP60/p400
  already model their RUVBL1-RUVBL2 subassemblies; the R2TP/PAQosome role is
  not yet modelled as a module in this PR.
