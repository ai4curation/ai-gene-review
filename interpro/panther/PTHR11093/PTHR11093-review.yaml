family_id: PANTHER:PTHR11093
family_name: RUVB-RELATED REPTIN AND PONTIN
preferred_name: RUVBL/Pontin/Reptin AAA+ ATPase family
summary: >-
  Eukaryotic RUVBL1/Pontin and RUVBL2/Reptin AAA+ ATPases that form
  alternating RUVBL1-RUVBL2 rings. The ring is a reusable ATP-hydrolysing
  module in chromatin-remodeling and chaperone systems: INO80, SRCAP,
  NuA4/TIP60-p400, and R2TP/PAQosome. Both human paralogs are conserved
  subunits of these assemblies, contribute to chromatin remodeling and box C/D
  snoRNP assembly, and are annotated by PAINT from the same ancestral nodes.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed human, yeast, fly and plant seeds are RUVBL1/Rvb1/Pontin or
  RUVBL2/Rvb2/Reptin orthologs that act as matched AAA+ ATPase partners in the
  same complexes. PANTHER 19.0 reports no subfamily assignments for the local
  human inventory, and no human member requires a family-level exception.
