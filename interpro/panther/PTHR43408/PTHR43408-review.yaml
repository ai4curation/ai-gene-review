    SsuE is not a monomer: it is a homodimer whose active site is built from residues of
    both subunits, and analytical ultracentrifugation shows a dimer-tetramer equilibrium
    that FMN binding pushes toward the dimer. An obligate homo-oligomer is the reductase
    complex this term describes. The same architecture holds for the other characterized
    members: SsuE and P. putida SfnF have determined structures, while P. aeruginosa MsuE was
    assessed by homology modelling from them rather than crystallographically. The claim
    therefore transfers to the node's descendants.
