notes: >-
  Reviewed while completing the bacterial alkanesulfonate uptake and desulfonation module
  (modules/bacterial_alkanesulfonate_uptake_desulfonation.yaml), which grounds the flavin
  reductase role to SF1 of this family. PANTHER gives the family and both populated
  subfamilies the same official name, FMN REDUCTASE (NADPH); the labels here reproduce that
  verbatim and the subfamilies are told apart by member content instead. The wider
  NAD(P)H:FMN reductase group also contains alpha-helical, FMN-retaining enzymes such as
  YdhA and ArsH that act without a monooxygenase partner; those are not in this family.
