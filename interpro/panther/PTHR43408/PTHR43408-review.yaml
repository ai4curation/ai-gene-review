- subfamily_id: PANTHER:PTHR43408:SF2
  label: FMN REDUCTASE (NADPH)
  description: >-
    The MsuE/SfnF group: reductase partners of the methanesulfonate, methanesulfinate and
    dimethylsulfone monooxygenases, carrying a histidine rather than a tyrosine as the
    pi-helix insertional residue. Same reductase activity, different downstream
    monooxygenase and sulfur source; PANTHER gives this subfamily the same official name
    as SF1, which is why the two are distinguished here by member content.
  representative_members:
  - id: UniProtKB:Q88J85
    gene_symbol: msuE
    organism: Pseudomonas putida KT2440
  - id: UniProtKB:Q65YX0
    gene_symbol: sfnF
    organism: Pseudomonas putida
  diverged_from_family: false
  divergence_description: >-
    Not a functional divergence in activity: the reaction catalysed is the same FMN
    reduction. The difference is partner specificity, and the kinetic non-equivalence of
    the two groups' pi-helix residues shows the adaptation is to a different monooxygenase
    rather than to a different reaction.
