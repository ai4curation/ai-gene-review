family_id: PANTHER:PTHR43408
family_name: FMN REDUCTASE (NADPH)
preferred_name: Two-component-system NAD(P)H:FMN reductases (SsuE/MsuE type)
summary: >-
  Small flavodoxin-fold NAD(P)H:flavin reductases that supply reduced FMN to a partner
  monooxygenase rather than oxidising a substrate themselves. The reference member,
  Escherichia coli SsuE, reduces FMN with either NADH or NADPH at comparable rates and
  hands FMNH2 to the alkanesulfonate monooxygenase SsuD; it also reduces FAD and riboflavin
  in vitro. SsuE is a homodimer whose active site spans the subunit interface, and it sits
  in a solution dimer-tetramer equilibrium that shifts toward the dimer on FMN binding. The
  family's second group holds the reductase partners of other organosulfur two-component
  systems: MsuE of the methanesulfonate and methanesulfinate monooxygenases and SfnE/SfnF
  of the dimethylsulfone system. All of these share a pi-helix at helix 4, created by an
  inserted aromatic or histidine residue (Tyr118 in SsuE, His in MsuE and SfnF), which
  distinguishes the two-component reductases from the alpha-helical, FMN-retaining members
  of the wider NAD(P)H:FMN reductase group such as YdhA and ArsH.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member catalyses the same reaction, NAD(P)H-dependent reduction of
  FMN, and does so as the flavin-supplying half of a two-component monooxygenase system.
  The groups differ in which monooxygenase they serve, and therefore in which sulfur source
  the organism can use, rather than in the reductase chemistry itself. Two differences sit
  below that shared activity and keep some terms narrower than the family: the pyridine
  nucleotide preference splits the two subfamilies (E. coli SsuE uses NADH and NADPH at
  comparable efficiency and P. putida SsuE is NADPH-specific, whereas P. aeruginosa MsuE
  prefers NADH about seventeen-fold and the SfnE/SfnF proteins are named as NADH-dependent),
  and swapping the pi-helix insertional residue between SsuE and MsuE does not transfer
  kinetic behaviour.
