family_id: PANTHER:PTHR12514
family_name: ENHANCER OF YELLOW 2 TRANSCRIPTION FACTOR
preferred_name: ENY2/Sus1 transcription and mRNA export adaptors
summary: ENY2/Sus1 proteins couple transcription and nuclear mRNA export through membership in SAGA and
  TREX-2. Within SAGA they support the histone H2B deubiquitination module; within TREX-2 they help connect
  export machinery to the nuclear pore. These are small noncatalytic complex subunits, so SAGA membership
  does not confer intrinsic histone acetyltransferase or deubiquitinase activity.
functional_coherence: COHERENT
coherence_reason: The ENY2/Sus1 inventory and curated IPR018783 support shared roles in SAGA and TREX-2.
  Sus1 is a noncatalytic component of the H2B deubiquitination module and an export-associated interaction
  scaffold. Calling it a transcription factor does not establish sequence-specific DNA binding; SAGA membership
  does not establish intrinsic acetyltransferase or deubiquitinase activity.
