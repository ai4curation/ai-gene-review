  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-c/PTHR12514.md
    supporting_text: Enhancer of yellow 2 (EnY2) is a small transcription factor which is conserved from
      protozoa to humans [[cite:PUB00044249]]. In insects it is known as enhancer of yellow 2 transcription
      factor, but in other organisms is known as transcription and mRNA export factor SUS1 or ENY2. It
      is involved in mRNA export coupled transcription activation by association with both the TREX-2
      complex and the transcription regulatory histone acetylation complex SAGA  [[cite:PUB00069580],
      [cite:PUB00069581], [cite:PUB00069583], [cite:PUB00069586]].  Within the SAGA complex, participates
      in a subcomplex that specifically deubiquitinates histone H2B [[cite:PUB00069582], [cite:PUB00069579]].
      The TREX-2 complex participates in mRNA export and accurate chromatin positioning in the nucleus
      by tethering genes to the nuclear periphery [[cite:PUB00069584]].
