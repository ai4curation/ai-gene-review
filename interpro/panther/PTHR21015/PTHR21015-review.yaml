- subfamily_id: PANTHER:PTHR21015:SF22
  label: GLYCOSYLTRANSFERASE
  description: >-
    The family's large subfamily, 604 of 706 members, and the one whose name says nothing: PANTHER
    calls it GLYCOSYLTRANSFERASE and it holds three functionally distinct groups. The bulk, 580 members,
    are bacterial MurG enzymes carrying the full MurG protein name, among them the reference protein
    (E. coli P17443), Pseudomonas putida Q88N76 and orthologs across the Gram-negative bacteria, the
    cyanobacteria, the spirochaetes and the rickettsias. Nine members are mycobacterial
    glycosyltransferases of phenolic glycolipid and p-HBAD biosynthesis (Rv2958c P9WFR1, Rv2962c
    P9WN09, MT3034 P9WFR0, MT3038 P9WN08, MRA_2985 A5U6W6, MRA_2989 A5U6X0, BCG_2983c A1KMV6,
    BQ2027_MB2986C Q7TXJ4), which transfer glucose or rhamnose onto a lipid aglycone rather than GlcNAc
    onto lipid I. Three are fungal UDP-glucosyltransferases of sophorolipid biosynthesis (Starmerella
    bombicola UgtA1 E7CQW6 and UgtB1 E9L011, Beauveria bassiana BBA_08686 J4VV61). Because the
    subfamily mixes all three, a specific activity term must never be granted at subfamily level here;
    the two divergent groups are described separately below.
