family_id: PANTHER:PTHR21015
family_name: UDP-N-ACETYLGLUCOSAMINE--N-ACETYLMURAMYL-(PENTAPEPTIDE) PYROPHOSPHORYL-UNDECAPRENOL N-ACETYLGLUCOSAMINE
  TRANSFERASE 1
preferred_name: MurG lipid II synthases, with mycobacterial glycolipid and fungal UDP-glucosyltransferase
  branches
summary: >-
  GT-B fold glycosyltransferases of CAZy family GT28, built around MurG, the enzyme that completes the
  membrane-bound peptidoglycan precursor. MurG transfers N-acetylglucosamine from UDP-GlcNAc to lipid I
  (undecaprenyl-pyrophosphoryl-MurNAc-pentapeptide) to give lipid II, the substrate that MurJ flips and
  the periplasmic polymerases consume; the enzyme is a soluble protein peripherally attached to the
  cytoplasmic face of the inner membrane, with a C-terminal domain that binds the UDP-sugar donor and an
  N-terminal domain that binds the lipid acceptor. Its loss stops peptidoglycan synthesis within minutes
  and is lethal. Two further groups share the fold and the UDP-sugar chemistry without doing MurG's
  reaction: the mycobacterial glycosyltransferases that build the phenolic glycolipid and
  p-hydroxybenzoic acid derivatives of the Mycobacterium tuberculosis envelope, and a set of fungal
  UDP-glucosyltransferases that glucosylate hydroxy fatty acids in sophorolipid biosynthesis. The family
  also sits at the boundary of the much larger eukaryotic UDP-glycosyltransferase families, which is
  where its one clearly broken propagation comes from.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Three different donor-acceptor pairs occur in the family and the subfamily axis does not separate
  them. PANTHER:PTHR21015:SF22, which holds 604 of the 706 members of the cached inventory and is named
  only GLYCOSYLTRANSFERASE, contains the bacterial MurG enzymes (including the reference protein), the
  mycobacterial phenolic-glycolipid glycosyltransferases (Rv2958c, Rv2962c and their orthologs) and the
  fungal UDP-glucosyltransferases (Starmerella bombicola UgtA1 and UgtB1, Beauveria bassiana
  BBA_08686) together; PANTHER:PTHR21015:SF27 is MurG again, for the Bacillota, under the family's own
  full name. So neither the family name nor either subfamily name predicts the donor sugar or the
  acceptor. On top of that, the MurG members themselves split on stem-peptide chemistry, since
  GO:0050511 is defined on the L-lysine pentapeptide and GO:0051991 on the meso-diaminopimelate one and
  the two are siblings under GO:0008375 rather than nested. Only the generic glycosyltransferase term is
  safe family-wide.
