term_assessments:
- assessed_term:
    id: GO:0016757
    label: glycosyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The only activity term safe for every member, and the one PAINT asserts at the untaxoned node
    PTN000470555. All three groups transfer a glycosyl group from a UDP-sugar: GlcNAc to lipid I for
    MurG, glucose or rhamnose to a lipid aglycone for the mycobacterial enzymes, glucose to a hydroxy
    fatty acid for the fungal ones. Nothing narrower can be scoped family-wide, because the specific
    terms for those three reactions are siblings under it rather than nested, and because the family's
    only large subfamily holds all three groups together. The reviewed P. putida member keeps the term as
    non-core, which is the right reading: true, broad, and entailed by the specific reaction it also
    carries.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21015/PTHR21015-paint.tsv
    supporting_text: "PTHR21015\tPTN000470555\tGO:0016757\tF\tIBD\tfalse"
  - reference_id: file:ECOLI/murG/murG-uniprot.txt
    supporting_text: 'CAZy; GT28; Glycosyltransferase Family 28.'
- assessed_term:
    id: GO:0008375
    label: acetylglucosaminyltransferase activity
  scope: RESIDUE_DETERMINED
  determined_by_site: udp_glcnac_donor_site
  scope_reason: >-
    This is the term that says what MurG does without committing to a stem peptide, and it cannot be
    granted at family or subfamily level: PTHR21015:SF22 holds the GlcNAc-transferring MurG enzymes
    together with the glucose- and rhamnose-transferring mycobacterial and fungal members, so any
    subfamily-level grant or denial would be wrong for part of its membership. What separates them is
    the donor site curated here. A member retaining the five UDP-GlcNAc-contacting residues of E. coli
    MurG transfers GlcNAc; the fungal UDP-glucosyltransferases, which retain only the histidine, do not,
    and have direct evidence for a glucosyl transfer instead. The site is a necessary condition rather
    than a sufficient one, and the limit is recorded explicitly: the mycobacterial glycolipid
    transferases keep four of the five positions while using a different sugar, so for a member outside
    the MurG groups the site must be read together with the organism's pathway and the protein's own
    evidence. Use the site, not the classification.
  supported_by:
  - reference_id: file:ECOLI/murG/murG-uniprot.txt
    supporting_text: 'H->A: Almost loss of activity.'
  - reference_id: PMID:12538870
    supporting_text: MurG is an essential glycosyltransferase that forms the glycosidic linkage between
      N-acetyl muramyl pentapeptide and N-acetyl glucosamine in the biosynthesis of the bacterial cell
      wall.
- assessed_term:
    id: GO:0050511
    label: undecaprenyldiphospho-muramoylpentapeptide beta-N-acetylglucosaminyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    No scope the schema offers is accurate. The term is certainly not family-wide, since neither
    divergent group makes lipid II; it is not subfamily-only, since the MurG members are spread across
    both subfamilies and SF22 also holds the non-MurG groups; and it is not residue-determined, because
    the donor site decides whether a member transfers GlcNAc and says nothing about the third residue of
    the acceptor's stem peptide, which is what distinguishes this term from its sibling GO:0051991. That
    distinction is made by the organism's MurE, two steps upstream and outside this family. Nor is the
    term false for a meso-DAP-type member: E. coli MurG carries curated experimental annotations to it.
    The usable statements are the clade-level one at PTN000470572 and the per-gene one, where both
    reviewed members prefer GO:0051991 - the E. coli review by MODIFY and the P. putida review by
    marking this term over-annotated. A stem-agnostic parent would make the question disappear;
    GO:0008375, assessed above, is the nearest existing approximation but is broader than MurG.
  supported_by:
  - reference_id: file:ECOLI/murG/murG-notes.md
    supporting_text: 'GO:0050511 "undecaprenyldiphospho-muramoylpentapeptide
      beta-N-acetylglucosaminyltransferase activity": definition specifies the'
  - reference_id: file:genes/ECOLI/murG/murG-ai-review.yaml
    supporting_text: GO:0050511 is defined on the L-lysine stem peptide
- assessed_term:
    id: GO:0051991
    label: UDP-N-acetyl-D-glucosamine:N-acetylmuramoyl-L-alanyl-D-glutamyl-meso-2,6-diaminopimelyl-D-alanyl-D-alanine-diphosphoundecaprenol
      4-beta-N-acetylglucosaminlytransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    The mirror of GO:0050511 and undecidable for the mirror reason: it is the physiological reaction of
    the meso-DAP-type MurG members, which includes the reference protein and most of SF22, and not of the
    L-lysine-type members that make up most of SF27, and the division is organism-level rather than
    subfamily- or residue-level. It is assessed here because the asymmetry between the sibling pair is
    the actionable part. Of the two, PAINT asserts only the L-lysine term, and asserts it on a clade
    (Pseudomonadota) that is uniformly meso-DAP-type, while the DAP term - which both reviewed members
    accept and which Rhea maps onto the E. coli enzyme - is asserted at no node in this family at all.
    The recommendation that follows is to add it beside GO:0050511 at PTN000470572 rather than to
    dispute the existing row.
  supported_by:
  - reference_id: file:ECOLI/murG/murG-uniprot.txt
    supporting_text: 'Xref=Rhea:RHEA:31227'
  - reference_id: file:ECOLI/murG/murG-notes.md
    supporting_text: So the E. coli-appropriate term is GO:0051991.
- assessed_term:
    id: GO:0008194
    label: UDP-glycosyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    The term is a poor fit for this family and the reason is its definition, which is the transfer of a
    glycosyl group from a UDP-sugar to a small hydrophobic molecule. That describes the fungal
    UDP-glucosyltransferases, whose acceptor is a hydroxy fatty acid, and arguably the mycobacterial
    enzymes, whose acceptor is a lipid aglycone. It does not describe MurG, whose acceptor is an
    undecaprenyl-pyrophosphoryl-MurNAc-pentapeptide - large, amphipathic and membrane-anchored - and no
    MurG member of this family was found carrying the term. Those groups all sit in PTHR21015:SF22, so no
    subfamily separates them, and the curated donor site does not decide the question either, since it
    is about the donor rather than the acceptor. The term is therefore left unresolved at family level
    and must be decided per member from its acceptor. The related propagation problem is assessed at
    PTN005360456: that node's eukaryote-restricted row reaches a bacterial member of this family, which
    is a defect in the propagation path rather than in the term's fit to the recipient.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21015/PTHR21015-paint.tsv
    supporting_text: "PTHR21015\tPTN005360456\tGO:0008194\tF\tIBD\tfalse"
  - reference_id: file:ECOLI/murG/murG-uniprot.txt
    supporting_text: Catalyzes the transfer of a GlcNAc subunit on
      undecaprenyl-pyrophosphoryl-MurNAc-pentapeptide (lipid intermediate I) to form
      undecaprenyl-pyrophosphoryl-MurNAc-pentapeptide-GlcNAc (lipid intermediate II)
- assessed_term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    Worth assessing even though PAINT asserts no process term anywhere in this family, which is itself
    notable: MurF, MraY and MurJ all carry a peptidoglycan biosynthesis row at a PAINT node and MurG
    does not. The term is true of every MurG member, which is all of PTHR21015:SF27 and the great
    majority of PTHR21015:SF22, and both reviewed members accept it; MurG performs the last cytoplasmic
    step of precursor synthesis and its depletion stops peptidoglycan synthesis within minutes. It is
    false for the fungal UDP-glucosyltransferases, whose organisms have no peptidoglycan, and for the
    mycobacterial glycolipid transferases, whose product belongs to a different envelope pathway. Because
    those groups share SF22 with the MurG enzymes, no subfamily scope is correct, and the exceptions are
    a clade inside a subfamily rather than named individuals - nine mycobacterial and three fungal
    members in the cached inventory alone. Adding an IBD for this term at PTN000470572, beside the
    activity row, would give the bacterial members a properly grounded process annotation.
  supported_by:
  - reference_id: PMID:1649817
    supporting_text: The inactivation of the murG gene rapidly inhibits peptidoglycan synthesis in
      exponentially growing cells.
  - reference_id: file:ECOLI/murG/murG-uniprot.txt
    supporting_text: 'PATHWAY: Cell wall biogenesis; peptidoglycan biosynthesis.'
