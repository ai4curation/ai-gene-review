- subfamily_id: PANTHER:PTHR21015:SF27
  label: UDP-N-ACETYLGLUCOSAMINE--N-ACETYLMURAMYL-(PENTAPEPTIDE) PYROPHOSPHORYL-UNDECAPRENOL N-ACETYLGLUCOSAMINE
    TRANSFERASE
  description: >-
    The Bacillota MurG subfamily, 102 members, dominated by Streptococcus (38), Staphylococcus (19),
    Clostridium (17) and Bacillus (8), with Legionella, Borrelia and Treponema members as well. Every
    member carries the full MurG protein name, so unlike SF22 this subfamily is functionally uniform:
    they all make lipid II. What it does not resolve is the stem peptide, since most of its members are
    L-lysine-type organisms while the family's reference protein and most of SF22 are
    meso-diaminopimelate-type - which is why the two GO terms for the MurG reaction cannot be assigned
    by subfamily. The split between SF22 and SF27 appears to be taxonomic rather than functional, and
    both carry the same activity.
  representative_members:
  - id: UniProtKB:A0AKD5
    label: UDP-N-acetylglucosamine--N-acetylmuramyl-(pentapeptide) pyrophosphoryl-undecaprenol
      N-acetylglucosamine transferase
    gene_symbol: murG
    organism: Listeria welshimeri serovar 6b
  diverged_from_family: false
- clade_node_id: PANTHER:PTN005360456
  description: >-
    Not a PANTHER subfamily but a group that has to be assessed separately, because it is where this
    family's broken propagation enters. PANTHER:PTN005360456 is an ancestral node of the eukaryotic
    UDP-glycosyltransferase families: its PAINT row is restricted to Eukaryota and its 31 seeds are
    metazoan UDP-glucuronosyltransferases - human UGT2B4 (P06133), UGT2B7 (P16662), UGT1A (P0DTE4,
    P0DTE5), UGT2A and UGT3A members, with Drosophila, mouse, rat and zebrafish orthologs. In PANTHER
    release 19.0 those seed proteins are classified in PTHR48043, not in PTHR21015, and the node's PAINT
    row appears in the cached slices of PTHR21015, PTHR48043 and PTHR48047 alike, so the node straddles
    family boundaries. The eukaryotic members that PTHR21015 itself contains are the three fungal
    UDP-glucosyltransferases of SF22 (E7CQW6, E9L011, J4VV61), which glucosylate hydroxy fatty acids and
    carry their own direct experimental annotations to UDP-glucosyltransferase activity rather than to
    anything MurG does. They do not in fact receive this node's annotation; the member that does is
    bacterial, which is assessed as an anomaly at the node below.
  representative_members:
  - id: UniProtKB:E7CQW6
    label: UDP-glucosyltransferase A1
    gene_symbol: ugtA1
    organism: Starmerella bombicola
  - id: UniProtKB:E9L011
    label: UDP-glucosyltransferase B1
    gene_symbol: ugtB1
    organism: Starmerella bombicola
  - id: UniProtKB:J4VV61
    label: UDP-glucosyltransferase 1
    gene_symbol: BBA_08686
    organism: Beauveria bassiana ARSEF 2860
  diverged_from_family: true
  divergence_description: >-
    These are not MurG enzymes and must not inherit any MurG term. Their donor is UDP-glucose rather
    than UDP-GlcNAc, their acceptor is a free hydroxy fatty acid rather than an undecaprenyl-linked
    MurNAc-pentapeptide, and their organisms have no peptidoglycan to make, so neither the activity
    terms nor the peptidoglycan process term can hold for them. The divergence is visible in the donor
    site curated below: of the five UDP-GlcNAc-contacting residues that mutagenesis identified in
    E. coli MurG, UgtA1 retains only the histidine, substituting the threonine, asparagine, serine and
    glutamine. Only the generic glycosyltransferase term from PTN000470555 applies to them.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21015/PTHR21015-paint.tsv
    supporting_text: "PTHR21015\tPTN005360456\tGO:0008194\tF\tIBD\tfalse"
- description: >-
    The mycobacterial glycolipid glycosyltransferases, also inside PANTHER:PTHR21015:SF22 and also
    requiring separate treatment. Nine members of the cached inventory are Mycobacterium tuberculosis,
    M. bovis and M. smegmatis enzymes of phenolic glycolipid and p-hydroxybenzoic acid derivative
    biosynthesis, named by UniProt as PGL/p-HBAD biosynthesis rhamnosyltransferase or
    glycosyltransferase. They are 428 to 449 residues, against 355 for E. coli MurG, and their reaction
    glycosylates a lipid aglycone of the mycobacterial envelope rather than lipid I. Rv2958c (P9WFR1)
    carries direct experimental evidence of its own, as a hexosyltransferase involved in glycolipid
    biosynthesis, so these are characterised enzymes with a known and different job, not uncharacterised
    MurG paralogs.
  representative_members:
  - id: UniProtKB:P9WFR1
    label: PGL/p-HBAD biosynthesis glycosyltransferase Rv2958c
    gene_symbol: Rv2958c
    organism: Mycobacterium tuberculosis H37Rv
  - id: UniProtKB:P9WN09
    label: PGL/p-HBAD biosynthesis rhamnosyltransferase
    gene_symbol: Rv2962c
    organism: Mycobacterium tuberculosis H37Rv
  diverged_from_family: true
  divergence_description: >-
    They do not make lipid II and no MurG term should descend to them, but they are not as far from the
    family core as the fungal group: four of the five curated donor-site positions are retained, and the
    one that changes is the asparagine that contacts the UDP-GlcNAc sugar (Asn127 in E. coli MurG,
    histidine at the corresponding position 204 of Rv2958c), which is at least consistent with a change
    of donor sugar from GlcNAc to glucose or rhamnose. That observation is a correlation across two
    sequences and is recorded in the residue site as such, not as a tested mechanism. The generic
    glycosyltransferase term applies to them; the peptidoglycan process term and both MurG activity
    terms do not.
node_assessments:
- node_id: PANTHER:PTN000470555
  asserted_term:
    id: GO:0016757
    label: glycosyltransferase activity
  evidence: IBD
  negated: false
  paint_snapshot: '20260529'
  seeds:
  - id: UniProtKB:P17443
    label: UDP-N-acetylglucosamine--N-acetylmuramyl-(pentapeptide) pyrophosphoryl-undecaprenol
      N-acetylglucosamine transferase
    gene_symbol: murG
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/murG/murG-ai-review.yaml
  assessment: SOUND
  assessment_reason: >-
    The right term at the right level, and the only activity statement that survives the family's three
    donor-acceptor pairs. Transferring a glycosyl group from a UDP-sugar to an acceptor is what the
    bacterial MurG enzymes, the mycobacterial glycolipid transferases and the fungal
    UDP-glucosyltransferases all do; what differs is which sugar and which acceptor, and GO's terms for
    those are siblings rather than a chain, so there is nothing intermediate to move down to. The row
    carries no taxon restriction, which is correct for a claim that holds from the proteobacteria to the
    fungi. The single seed is not a weakness: E. coli MurG is the best-characterised member by a wide
    margin - purified, assayed with kinetic constants, crystallised with and without its UDP-GlcNAc
    donor - and its experimental grounding for this aspect is its EXP annotations to the specific
    reaction GO:0051991, a descendant of the term asserted here, which is exactly the evidence an IBD is
    built from.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21015/PTHR21015-paint.tsv
    supporting_text: "PTHR21015\tPTN000470555\tGO:0016757\tF\tIBD\tfalse"
  - reference_id: PMID:12538870
    supporting_text: MurG is an essential glycosyltransferase that forms the glycosidic linkage between
      N-acetyl muramyl pentapeptide and N-acetyl glucosamine in the biosynthesis of the bacterial cell
      wall.
  - reference_id: file:ECOLI/murG/murG-uniprot.txt
    supporting_text: Belongs to the glycosyltransferase 28 family. MurG subfamily.
- node_id: PANTHER:PTN000470572
  asserted_term:
    id: GO:0050511
    label: undecaprenyldiphospho-muramoylpentapeptide beta-N-acetylglucosaminyltransferase activity
  evidence: IBD
  negated: false
  paint_snapshot: '20210305'
  seeds:
  - id: UniProtKB:P17443
    label: UDP-N-acetylglucosamine--N-acetylmuramyl-(pentapeptide) pyrophosphoryl-undecaprenol
      N-acetylglucosamine transferase
    gene_symbol: murG
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/murG/murG-ai-review.yaml
  node_taxon:
    id: NCBITaxon:1224
    label: Pseudomonadota
  assessment: SOUND
  assessment_reason: >-
    Sound as an assertion and incomplete as a description, in exactly the way the corresponding MraY row
    is. GO:0050511 is defined on the L-lysine pentapeptide; its meso-diaminopimelate counterpart
    GO:0051991 is a sibling under GO:0008375, not a child, so the two do not entail each other. The node
    is restricted to Pseudomonadota, which build a meso-DAP stem peptide throughout, so on its face the
    row gives the whole clade the wrong stem form - and both reviewed members push back on exactly that
    ground, the E. coli review by MODIFY to GO:0051991 and the P. putida review by marking the inherited
    row over-annotated. What keeps the row standing is the seed: E. coli MurG carries an IDA from
    EcoliWiki and an IMP from EcoCyc to GO:0050511 itself, both citing the paper that identified the
    gene product and assayed the transferase, and that paper's full text is not in this repository's
    cache. The L-lysine reaction is therefore a curated experimental claim about the E. coli enzyme, not
    an electronic mapping to argue away. The useful recommendation is additive rather than corrective:
    no PAINT row in this family asserts GO:0051991 anywhere, although it is the physiological reaction of
    every member below this node and is what both reviewed genes accept, so an IBD for it belongs beside
    the existing row - the pairing PAINT adopted for MurF at PTN000566380 in 2026. The durable fix is a
    stem-agnostic parent term in GO. (This worktree's schema predates the proposed_action slot, so the
    recommendation is recorded here in prose.)
  supported_by:
  - reference_id: file:interpro/panther/PTHR21015/PTHR21015-paint.tsv
    supporting_text: "PTHR21015\tPTN000470572\tGO:0050511\tF\tIBD\tfalse"
  - reference_id: PMID:1649817
    supporting_text: In vitro assays for phospho-MurNAc-pentapeptide translocase and
      N-acetylglucosaminyl transferase activities finally confirm the identification of the murG gene
      product as the transferase that catalyzes the conversion of lipid intermediate I to lipid
      intermediate II in the peptidoglycan synthesis pathway.
  - reference_id: file:ECOLI/murG/murG-notes.md
    supporting_text: The PAINT node PTN000470572 spans DAP- and Lys-type bacteria; there is no single GO
      term covering MurG activity irrespective of the stem-peptide residue, which is a GO structure
      issue
- node_id: PANTHER:PTN005360456
  asserted_term:
    id: GO:0008194
    label: UDP-glycosyltransferase activity
  evidence: IBD
  negated: false
  paint_snapshot: '20260828'
  seeds:
  - id: UniProtKB:P06133
    label: UDP-glucuronosyltransferase 2B4
    gene_symbol: UGT2B4
    organism: Homo sapiens
  - id: UniProtKB:P16662
    label: UDP-glucuronosyltransferase 2B7
    gene_symbol: UGT2B7
    organism: Homo sapiens
  - id: UniProtKB:Q9BY64
    label: UDP-glucuronosyltransferase
    gene_symbol: UGT2B17
    organism: Homo sapiens
  - id: FB:FBgn0026314
    label: Ugt
    organism: Drosophila melanogaster
  - id: MGI:MGI:1919023
    label: Ugt
    organism: Mus musculus
  node_taxon:
    id: NCBITaxon:2759
    label: Eukaryota
  assessment: UNRESOLVED
  assessment_reason: >-
    Investigated and left undecided, because what is wrong here cannot be fixed by moving or pruning the
    node, and saying which of two possibilities holds would need the PANTHER tree that the cached slice
    does not contain. The row itself is well made for what it claims: 31 seeds, all metazoan
    UDP-glucuronosyltransferases with their own experimental annotations, a term that fits them exactly,
    and a taxon restriction to Eukaryota. The problem is that the annotation does not stay inside that
    restriction. The only member of PTHR21015 verified to receive this node's IBA is Mycobacterium
    tuberculosis Rv2958c (P9WFR1, taxon 83332) - a bacterium - and its with-list names
    PANTHER:PTN005360456 together with the full set of metazoan seeds. Meanwhile the family's actual
    eukaryotic members, the three fungal UDP-glucosyltransferases, do not receive it; their generic
    glycosyltransferase annotation comes from a different node. So either the node's declared taxon is
    wrong, because its clade really does reach into the bacteria, or the leaf projection has placed a
    eukaryote-restricted assertion on a bacterial leaf. Two further observations point the same way: in
    PANTHER release 19.0 the seed proteins are classified in PTHR48043 rather than PTHR21015, and this
    node's row appears in the cached PAINT slices of PTHR21015, PTHR48043 and PTHR48047 alike, so the
    node straddles family boundaries. The term happens not to be false for the recipient - Rv2958c does
    transfer a sugar from a UDP-donor to a lipid aglycone, and has its own hexosyltransferase evidence -
    which is why this is a propagation-path defect to report to PANTHER rather than a wrong annotation to
    remove. It would be false if the same path reached a MurG enzyme, whose acceptor is a large
    undecaprenyl-linked disaccharide-peptide rather than the small hydrophobic molecule GO:0008194 is
    defined on; no MurG member was found carrying it, and that is worth re-checking after any
    re-release.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21015/PTHR21015-paint.tsv
    supporting_text: "PTHR21015\tPTN005360456\tGO:0008194\tF\tIBD\tfalse"
  - reference_id: file:ECOLI/murG/murG-uniprot.txt
    supporting_text: Catalyzes the transfer of a GlcNAc subunit on
      undecaprenyl-pyrophosphoryl-MurNAc-pentapeptide (lipid intermediate I) to form
      undecaprenyl-pyrophosphoryl-MurNAc-pentapeptide-GlcNAc (lipid intermediate II)
residue_sites:
- site_id: udp_glcnac_donor_site
  label: UDP-GlcNAc donor-binding residues of the MurG C-terminal domain
  description: >-
    The donor site of E. coli MurG, defined by the crystal structure of the MurG:UDP-GlcNAc complex and
    tested by alanine substitution of each position: Thr15 (387-fold decrease in kcat), His18 (almost
    complete loss of activity), Asn127 (64-fold), Ser191 (40-fold) and Gln288 (114-fold). Glu268,
    mutated in the same study, is deliberately excluded, because substituting it costs less than
    two-fold and including it would dilute the site. The site is strongly conserved across the MurG
    members of both subfamilies: Pseudomonas putida MurG retains all five (15, 18, 127, 191, 290) and
    Listeria welshimeri MurG, in the other subfamily, retains all five as well (10, 13, 124, 195, 295),
    which is one reason the SF22/SF27 split reads as taxonomic rather than functional. The two divergent
    groups behave differently from each other. The fungal UDP-glucosyltransferase UgtA1 keeps only the
    histidine (at its position 20) and substitutes the other four, including a leucine where the
    threonine sits; it is the negative control below, since it has direct experimental evidence for a
    different activity, transferring glucose to a hydroxy fatty acid. The mycobacterial glycolipid
    transferase Rv2958c keeps four of the five and changes only Asn127, to histidine at its position
    204 - a single-sequence correlation with its change of donor sugar, interesting enough to record and
    far too thin to assert as a specificity determinant. Positions in proteins other than the anchor
    were obtained by global pairwise alignment (BLOSUM62) to P17443 and are stated in each protein's own
    numbering; the controls make them re-checkable. Note that the positive controls are MurG enzymes
    whose activity rests on orthology plus the HAMAP and NCBIfam MurG signatures rather than on their
    own assays, as is normal for this family; the requirement itself rests on the E. coli mutagenesis.
  anchor:
    id: UniProtKB:P17443
    label: UDP-N-acetylglucosamine--N-acetylmuramyl-(pentapeptide) pyrophosphoryl-undecaprenol
      N-acetylglucosamine transferase
    gene_symbol: murG
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/murG/murG-ai-review.yaml
  anchor_sequence_version: 3
  site_source: UNIPROT_FEATURE
  residues:
  - position: 15
    expected:
    - T
    role: UDP-N-acetylglucosamine contact; T15A costs 387-fold in kcat
  - position: 18
    expected:
    - H
    role: proposed catalytic residue; H18A almost abolishes activity
  - position: 127
    expected:
    - N
    role: UDP-N-acetylglucosamine contact; N127A costs 64-fold in kcat
  - position: 191
    expected:
    - S
    role: UDP-N-acetylglucosamine contact; S191A costs 40-fold in kcat
  - position: 288
    expected:
    - Q
    role: UDP-N-acetylglucosamine contact; Q288A costs 114-fold in kcat
  required_for:
  - term:
      id: GO:0008375
      label: acetylglucosaminyltransferase activity
    strength: REQUIRED
    rationale: >-
      Catalysis runs through the UDP-GlcNAc donor held in the C-terminal domain, and every residue in
      this set was individually substituted in the enzyme whose structure defines the site: four of the
      five cost between 40- and 387-fold in turnover and the histidine, the proposed catalytic residue,
      almost abolishes activity altogether. Losing the set therefore removes the ability to transfer
      GlcNAc, not merely some of the efficiency, which is what REQUIRED asserts. The term chosen is the
      stem-agnostic parent GO:0008375 rather than either of the two MurG terms, because the site is
      about the donor and not about the stem peptide of the acceptor, and because the parent is what the
      positive controls can be held to: a Pseudomonas and a Listeria MurG transfer GlcNAc whichever
      third residue their organism's acceptor carries. The claim is bounded in two ways that the
      description spells out: it was measured on the MurG reaction, and the mycobacterial members of the
      family retain four of the five positions while transferring a different sugar, so an intact site
      is not by itself sufficient to show GlcNAc specificity.
    supported_by:
    - reference_id: file:ECOLI/murG/murG-uniprot.txt
      supporting_text: 'H->A: Almost loss of activity.'
    - reference_id: file:ECOLI/murG/murG-uniprot.txt
      supporting_text: 'T->A: 387-fold decrease in kcat.'
    - reference_id: file:ECOLI/murG/murG-uniprot.txt
      supporting_text: 'Q->A: 114-fold decrease in kcat.'
    - reference_id: PMID:10892798
      supporting_text: Structural analysis suggests that the C-terminal domain contains the UDP-GlcNAc
        binding site while the N-terminal domain contains the acceptor binding site and likely membrane
        association site.
  positive_controls:
