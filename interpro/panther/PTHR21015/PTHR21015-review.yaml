notes: >-
  Member counts and subfamily assignments are from PTHR21015-entries.csv (604 in SF22, 102 in SF27, of
  706 members; the inventory contains no member of the third subfamily, PTHR21015:SF28 SLL1722 PROTEIN,
  which is therefore not assessed). Family and subfamily names are interpro/panther/panther.obo
  verbatim. Residue positions in members other than P17443 were obtained by global pairwise alignment
  (BLOSUM62) to P17443 and the declared controls make them re-checkable against the current UniProt
  sequences; the anchor is pinned to sequence version 3, since P17443 has been revised. Leaf-level
  annotation facts used in the reasoning but not quoted - which members receive which IBA from which
  node, and which seeds carry their own experimental annotations - were read from QuickGO on 2026-11-15,
  and the seed classifications from PANTHER's release-19.0 classification file for human; the underlying
  papers behind the GO:0050511 IDA and IMP rows on E. coli MurG are not in this repository's cache
  beyond the abstract of PMID:1649817, so they are described rather than quoted and nothing here
  overrules them. Items for upstream attention. (1) The eukaryote-restricted GO:0008194 row at
  PTN005360456 reaches Mycobacterium tuberculosis Rv2958c, a bacterium, while the family's own
  eukaryotic members do not receive it; the node also appears in the PAINT slices of PTHR48043 and
  PTHR48047 and its seeds are classified in PTHR48043, so PANTHER should reconcile the node's taxon with
  its leaf set. (2) The stem-peptide gap again: GO:0050511 (L-lysine) and GO:0051991 (meso-DAP) are
  siblings under GO:0008375 with no stem-agnostic child between them, and PAINT asserts only the
  L-lysine form, on a clade that is uniformly meso-DAP-type. Adding a GO:0051991 IBD beside it at
  PTN000470572 would mirror what PAINT already did for MurF, and a new parent term for each of the three
  sibling pairs - MurF, MraY and MurG - would fix all three families. (3) PAINT asserts no biological
  process term anywhere in this family, so MurG alone among the lipid-cycle enzymes reviewed here has no
  propagated peptidoglycan-biosynthesis row; PTN000470572 is the place for one. (4) PANTHER's name for
  SF22, GLYCOSYLTRANSFERASE, carries no information and conceals that the subfamily holds three distinct
  donor-acceptor pairs; the mycobacterial PGL and fungal sophorolipid enzymes would be better placed in
  subfamilies of their own.
