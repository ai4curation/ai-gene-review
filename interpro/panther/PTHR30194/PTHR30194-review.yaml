term_assessments:
- assessed_term:
    id: GO:0008821
    label: crossover junction DNA endonuclease activity
  scope: FAMILY_WIDE
  scope_reason: The defining activity of RuvC, assayed for E. coli RuvC and other bacterial RuvCs; the
    acidic catalytic residues are conserved across the family (they are annotated in KT2440 RuvC).
  supported_by:
  - reference_id: file:genes/ECOLI/ruvC/ruvC-uniprot.txt
    supporting_text: Cleaves cruciform DNA by making single-stranded nicks across the junction at symmetrical
      positions within the homologous arms, leaving a 5'-phosphate and a 3'-hydroxyl group
  - reference_id: PMID:7923356
    supporting_text: the catalytic center, comprising four acidic residues, lies at the bottom of a cleft
      that nicely fits a DNA duplex
  - reference_id: PMID:36000732
    supporting_text: RuvCs function as homodimers, display HJ-specific endonuclease activity, and show
      sequence preference
- assessed_term:
    id: GO:0000400
    label: four-way junction DNA binding
  scope: FAMILY_WIDE
  scope_reason: Structure-specific junction binding precedes cleavage and is metal independent; it is
    part of the RuvC mechanism.
  supported_by:
  - reference_id: PMID:8195150
    supporting_text: RuvC efficiently forms specific complexes with four-way junctions in the absence
      of the cations
- assessed_term:
    id: GO:0000725
    label: recombinational repair
  scope: FAMILY_WIDE
  scope_reason: Junction resolution is the late step of recombinational repair.
  supported_by:
  - reference_id: PMID:8001122
    supporting_text: The E. coli RuvC protein resolves Holliday junctions during genetic recombination
      and postreplication repair
