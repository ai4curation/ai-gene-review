family_id: PANTHER:PTHR30194
family_name: CROSSOVER JUNCTION ENDODEOXYRIBONUCLEASE RUVC
preferred_name: Bacterial RuvC Holliday-junction resolvase family
summary: RuvC, the magnesium-dependent Holliday-junction resolvase of bacteria. RuvC is a homodimeric
  RNase H-like endonuclease with an acidic catalytic center that binds four-way junctions independently
  of sequence and nicks two strands of like polarity at symmetrical consensus sites, producing ligatable
  duplexes. It acts with RuvAB branch migration in a RuvABC assembly in recombination, recombinational
  repair and the processing of reversed replication forks.
functional_coherence: COHERENT
coherence_reason: One subfamily, PTHR30194:SF3, holds every member; all 546 reviewed entries in the cached
  inventory are named Crossover junction endodeoxyribonuclease RuvC. PANTHER/PAINT currently places no
  node-level annotation in this family, so the functional assessment rests on the experimentally characterized
  E. coli member and the conserved catalytic residues.
