summary: ALANYL-TRNA SYNTHETASE (PANTHER:PTHR11777) is characterized in PANTHER PAINT across 5 ancestral
  PTN node(s) (PANTHER:PTN000206950, PANTHER:PTN000207029, PANTHER:PTN000207063, PANTHER:PTN002622939
  (+1 more)) with 8 IBD node assertion(s) and 0 term(s) carrying negated IRD/IKR branch blocks, covering
