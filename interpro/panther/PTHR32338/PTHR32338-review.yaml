family_id: PANTHER:PTHR32338
family_name: N-ACETYL-GAMMA-GLUTAMYL-PHOSPHATE REDUCTASE, CHLOROPLASTIC-RELATED-RELATED
preferred_name: N-acetyl-gamma-glutamyl-phosphate reductase (ArgC) and LysY phosphate reductases
summary: >-
  NADPH-dependent semialdehyde dehydrogenase-fold reductases that reduce an acyl-phosphate intermediate
  in amino acid biosynthesis. SF10 is ArgC, N-acetyl-gamma-glutamyl-phosphate reductase of the acetylated
  ornithine route to arginine in bacteria, archaea and plant plastids. SF10 contains both the type 1
  (TIGR01850, IPR000706; e.g. E. coli argC and P. putida argC1) and the structurally distinct type 2
  (TIGR01851, IPR010136; e.g. Nostoc and P. putida argC2) ArgC forms, which catalyse the same reaction.
  SF11 is LysY, which reduces carrier-protein (LysW)-bound 2-aminoadipate phosphate, and in some archaea
  LysW-bound glutamyl phosphate, in the LysW-mediated lysine and arginine routes.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members reduce an acyl phosphate to a semialdehyde with NADPH, but the substrate differs between
  subfamilies: free N-acetyl-L-glutamyl 5-phosphate for SF10 (ArgC) and LysW-bound phosphates for SF11
  (LysY). The specific ArgC activity and arginine biosynthesis therefore apply to SF10, while the generic
  oxidoreductase activity applies family-wide.
