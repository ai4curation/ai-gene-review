- subfamily_id: PANTHER:PTHR32338:SF11
  label: '[LYSW]-L-2-AMINOADIPATE_[LYSW]-L-GLUTAMATE PHOSPHATE REDUCTASE-RELATED'
  description: >-
    LysY, which reduces LysW-bound 2-aminoadipate 6-phosphate (and, in some archaea, LysW-bound glutamyl
    phosphate) in the LysW carrier-protein routes. These members receive only the generic oxidoreductase
    IBA from PTN002845007, not the ArgC IBA.
  diverged_from_family: true
  divergence_description: >-
