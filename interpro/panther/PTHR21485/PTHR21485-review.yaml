  scope: FAMILY_WIDE
  scope_reason: >-
    The family has two subfamilies and both hold genuine CMP-Neu5Ac synthetases (CMAS in SF3; NeuA, including E.
    coli K1 NeuA, in SF6), so the term is scoped to the whole family, but both subfamilies are mixed and the members
    it is false for are listed as exceptions. Every reviewed member was checked: the KdsC-type and KDN-9-P phosphatases
    lack the transferase, and the PseF/LegF-type enzymes use other nonulosonic acids. All of these are listed as
    member exceptions.
