family_id: PANTHER:PTHR21485
family_name: HAD SUPERFAMILY MEMBERS CMAS AND KDSC
preferred_name: CMP-nonulosonate synthetases and KdsC-type HAD phosphatases
summary: >-
  A mixed family. It joins CMP-sialic acid synthetases (vertebrate CMAS, which has an N-terminal cytidylyltransferase
  domain and a C-terminal HAD-like domain, and bacterial NeuA), the related bacterial cytidylyltransferases for
  pseudaminic and legionaminic acids, and standalone HAD-superfamily sugar-phosphate phosphatases: KdsC, the KDO
  8-phosphate phosphatase of KDO synthesis, and the Bacteroides KDN-9-phosphate phosphatase. Of the 32 reviewed
  (Swiss-Prot) members, 10 are phosphatases that lack a cytidylyltransferase domain; the member exceptions also
  cover an 11th, the unreviewed (TrEMBL) KT2440 KdsC Q88P96. None of these phosphatases is a leaf of the PANTHER
  tree, which contains only cytidylyltransferases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family spans two catalytic activities on different domains, a CTP-dependent nucleotidyltransferase and a Mg2+-dependent
  phosphomonoesterase, as well as cytidylyltransferases with different sugar substrates. Subfamily membership does
  not separate them: SF6 holds KdsC proteins together with NeuA and PseF/LegF transferases, and SF3 holds vertebrate
  CMAS together with the KDN-9-P phosphatase and, in UniProt, KT2440 KdsC.
