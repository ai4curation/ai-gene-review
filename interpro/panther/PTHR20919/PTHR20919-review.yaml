notes: >-
  The single PAINT node is assessed as NEEDS_PRUNING rather than WRONG_NODE because the assertion is
  correct for its seed and its close relatives; the error is that no IRD blocks it in the acetyl-specific
  clades. The methionine_biosynthesis module lists this family only for orientation on its
  succinyltransferase step and selects members by function.
