family_id: PANTHER:PTHR20919
family_name: HOMOSERINE O-SUCCINYLTRANSFERASE
preferred_name: MetA-fold homoserine O-acyltransferase family
summary: >-
  Bacterial homoserine O-acyltransferases of the MetA fold, which transfer an acyl group from
  acyl-CoA to L-homoserine in the first committed step of methionine biosynthesis by a ping-pong
  mechanism through an acyl-enzyme intermediate. The best-characterized member, E. coli MetA, is
  strictly succinyl-CoA-specific and cannot use acetyl-CoA. The family is unrelated in fold to the
  alpha/beta-hydrolase MetX acyltransferases (PTHR32268), which catalyse the same reactions. About half
  of the reviewed members are acetyltransferases (for example Bacillus subtilis MetA), so the acyl
  donor is not a family-wide property; a few members are annotated as serine O-acetyltransferases of
  cysteine biosynthesis.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member acylates L-homoserine (or, rarely, L-serine) from an acyl-CoA, but the
  acyl donor switches between acetyl-CoA and succinyl-CoA within the single subfamily SF0. Large-scale
  enzymology of MetA and MetX enzymes found that donor specificity is widely misannotated from family
  membership (PMID:28581482).
