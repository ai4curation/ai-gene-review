    label: homoserine O-succinyltransferase activity
  evidence: IBD
  paint_snapshot: '20170228'
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  seeds:
  - id: UniProtKB:P07623
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node is seeded only by E. coli MetA, which is succinyl-specific, but it sits at the bacterial
    root of the family and so propagates succinyltransferase activity to the acetyl-specific members as
    well. QuickGO shows B. subtilis MetA (P54167) and Thermotoga maritima MetA (Q9WZY3), both reviewed
    as homoserine O-acetyltransferases, receiving this IBA with PTN000467771 in WITH/FROM. The activity
    is sound for the succinyl-specific clades (Enterobacterales and relatives) and should be pruned at
    the acetyl-specific clades; the large-scale enzymology of the family shows that the donor switch
    happened more than once, so no single deeper node is right for either donor.
  supported_by:
  - reference_id: file:interpro/panther/PTHR20919/PTHR20919-paint.tsv
    supporting_text: "PTHR20919\tPTN000467771\tGO:0008899\tF\tIBD\tfalse\tUniProtKB:P07623\ttaxon:2\t20170228"
  - reference_id: file:interpro/panther/PTHR20919/PTHR20919-entries.csv
    supporting_text: P54167,Homoserine O-acetyltransferase
  - reference_id: PMID:28581482
    supporting_text: >-
      Members of these families are prone to incorrect annotation because MetX and MetA enzymes are
      assumed to always use acetyl-CoA and succinyl-CoA, respectively.
term_assessments:
- assessed_term:
    id: GO:0008899
    label: homoserine O-succinyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    Succinyl-CoA use is established for E. coli MetA and its close relatives but not for the family:
    acetyl-specific members sit in the same subfamily, and PANTHER provides no subfamily that separates
    the two donors. Assign the term from enzymology or from a donor-specific signature, not from family
    membership.
    B. subtilis MetA (P54167), which forms O-acetylhomoserine, receives this IBA from PTN000467771 as an over-propagation.
  supported_by:
  - reference_id: PMID:5001847
    supporting_text: The enzymic formation of O-acetylhomoserine in Bacillus subtilis
  - reference_id: file:genes/ECOLI/metA/metA-uniprot.txt
    supporting_text: Cannot use acetyl-CoA (PubMed:10572016).
  - reference_id: PMID:28581482
    supporting_text: >-
      Members of these families are prone to incorrect annotation because MetX and MetA enzymes are
      assumed to always use acetyl-CoA and succinyl-CoA, respectively.
- assessed_term:
    id: GO:0004414
    label: homoserine O-acetyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    Acetyl-CoA use holds for many members (B. subtilis and other Bacillota, Thermotoga) but not for
    E. coli MetA, which cannot use acetyl-CoA. PAINT asserts no acetyltransferase node in this family.
  supported_by:
  - reference_id: PMID:5001847
    supporting_text: The enzymic formation of O-acetylhomoserine in Bacillus subtilis
  - reference_id: file:genes/ECOLI/metA/metA-uniprot.txt
    supporting_text: Cannot use acetyl-CoA (PubMed:10572016).
- assessed_term:
    id: GO:0071265
    label: L-methionine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Whatever the acyl donor, the homoserine acyltransferases make the activated homoserine of the
    methionine pathway; the rare serine O-acetyltransferase members are the only exception noted in
    the reviewed set.
  supported_by:
  - reference_id: file:genes/ECOLI/metA/metA-uniprot.txt
    supporting_text: L-methionine biosynthesis via de novo
