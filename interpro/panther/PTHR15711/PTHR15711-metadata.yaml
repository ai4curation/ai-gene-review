  name:
    name: Rap1/Ran GTPase-activating
    short: Rap1_Ran_GAP
  description:
  - text: The protein family is involved in the regulation of GTPase activity for
      nuclear Ras-related regulatory proteins such as Rap1, Rap2, and Ran, typically
      converting them to an inactive GDP-bound state. Members of the family play key
      roles in various cellular processes including cell cycle progression, epithelial
      cell morphogenesis, polarity, adhesion, cytoskeletal organization, and dendritic
      spine morphogenesis. They are also implicated in the regulation of cell adhesion
      and chemotaxis by controlling myosin II assembly and disassembly. The family
      contributes to the spatial and temporal regulation of these processes, which
      are crucial for proper cell function and development.
