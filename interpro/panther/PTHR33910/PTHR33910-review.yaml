family_id: PANTHER:PTHR33910
family_name: PROTEIN TRANSLOCASE SUBUNIT SECE
functional_coherence: COHERENT
preferred_name: Bacterial SecE channel subunit family
summary: >-
  PTHR33910 contains bacterial SecE, the small integral membrane subunit of the
  SecYEG protein-conducting channel. SecE wraps around SecY, clamping its two
  halves together at the back of the channel, and is required for a stable,
  active SecY channel; it has no pore or motor activity of its own. Proteobacterial
  SecE such as E. coli SecE has three transmembrane segments, whereas many other
  bacteria, including Bacillus subtilis, have a single-segment SecE that
  corresponds to the essential C-terminal part.
coherence_reason: >-
  All 50 cached reviewed members are in the single subfamily SF1 and play the
  same channel-subunit role. The three-segment versus one-segment difference
  changes topology, not function.
