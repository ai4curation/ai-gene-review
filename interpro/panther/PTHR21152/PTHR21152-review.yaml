family_id: PANTHER:PTHR21152
family_name: AMINOTRANSFERASE CLASS V
preferred_name: Class V alanine-glyoxylate aminotransferase (AGXT/AGX1) family
summary: >-
  PLP-dependent class V aminotransferases that transaminate glyoxylate to glycine with alanine (or
  serine) as donor. Peroxisomal AGXT in human liver detoxifies glyoxylate (deficiency causes primary
  hyperoxaluria type 1). S. cerevisiae AGX1 makes glycine from glyoxylate. Bacterial members serve
  glycine/serine and glycolate metabolism.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Alanine:glyoxylate transamination holds for the characterized members. Serine:pyruvate activity
  is a vertebrate AGXT property not shared by S. cerevisiae AGX1.
