  name:
    name: Annexin calcium/phospholipid-binding
    short: Annexin_Ca-PL-bd
  description:
  - text: The Annexin family is characterized by calcium/phospholipid-binding proteins
      that have a role in a variety of cellular processes including membrane fusion,
      exocytosis, and coagulation. Members of this family are involved in the regulation
      of inflammatory responses, immune system processes, and cell division. They
      have a high affinity for calcium ions and bind to membranes enriched in acidic
      phospholipids in a calcium-dependent manner. Some annexins are implicated in
      the structural integrity of the cytoskeleton and in the attachment of parasites
      to intestinal mucosa. The annexin repeats, which are common structural domains
      within this family, may form binding sites for calcium and phospholipid, facilitating
      their diverse functions.
