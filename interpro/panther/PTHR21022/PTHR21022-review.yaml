family_id: PANTHER:PTHR21022
family_name: PREPHENATE DEHYDRATASE  P PROTEIN
preferred_name: Prephenate/arogenate dehydratase family
summary: >-
  ACT-domain dehydratases that convert prephenate to phenylpyruvate (bacterial PheA, often fused
  to chorismate mutase; S. cerevisiae PHA2; S. pombe pha2) or, in plants, arogenate to phenylalanine
  (ADT1-6). Several plant ADTs also accept prephenate.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are cyclohexadienyl dehydratases; the substrate (prephenate or arogenate) differs between
  microbial and plant subfamilies.
