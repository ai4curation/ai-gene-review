family_id: PANTHER:PTHR38683
family_name: CHORISMATE PYRUVATE-LYASE
preferred_name: UbiC chorismate pyruvate-lyase family
summary: >-
  UbiC chorismate pyruvate-lyases of Proteobacteria. Escherichia coli UbiC
  removes the enolpyruvyl group from chorismate with aromatization of the ring,
  producing 4-hydroxybenzoate, the aromatic head group of ubiquinone. The
  purified enzyme is soluble and is strongly product-inhibited by
  4-hydroxybenzoate. Members are found in Gamma-, Beta- and some
  Alphaproteobacteria; Pseudomonas putida KT2440 and P. aeruginosa UbiC are
  assigned to the same single subfamily. Eukaryotes make 4-hydroxybenzoate by
  unrelated routes and have no member of this family.
functional_coherence: COHERENT
coherence_reason: >-
  One subfamily (SF1); all members are named chorismate pyruvate-lyases and the
  characterized E. coli enzyme defines the activity.
