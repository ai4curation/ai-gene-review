family_id: PANTHER:PTHR42783
family_name: GLUTAMATE SYNTHASE [NADPH] SMALL CHAIN
preferred_name: GltD-type FAD/NAD(P)H-dependent oxidoreductase subunits
summary: >-
  Family of FAD- and [4Fe-4S]-containing NAD(P)H-oxidising subunits (dihydropyrimidine dehydrogenase
  domain II-like Fe-S module plus a FAD/NAD(P)-binding domain). Its best-characterized members are the
  gamma-proteobacterial and alpha-proteobacterial NADPH-GOGAT small chains GltD (E. coli, P. putida
  KT2440, Azospirillum brasilense), which take electrons from NADPH and pass them to the FMN/Fe-S synthase
  site of the GltB large chain. The same module is used as the electron-input subunit of several unrelated
  enzymes: NADPH-Fe(3+) oxidoreductase SfrB (Geobacter), NADP(+)-dependent formate dehydrogenase subunit
  beta FdhB (Moorella), sulfide dehydrogenase subunit SudA (Pyrococcus) and the enterobacterial AegA,
  which is required for formate-dependent uric acid degradation in E. coli.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  An NAD(P)H-oxidising, flavin/Fe-S electron-input activity is shared, but the enzyme that the subunit
  feeds differs: glutamate synthase for GltD, ferric reductase for SfrB, formate dehydrogenase for FdhB,
  sulfide dehydrogenase for SudA, and a urate-degrading activity for AegA (SF1). Subfamily SF3, named
  GLUTAMATE SYNTHASE [NADPH] SMALL CHAIN-RELATED, itself contains GltD, SfrB, FdhB, SudA and the uncharacterized
  YgfK and UacF, so glutamate synthase activity cannot be inferred from SF3 membership.
