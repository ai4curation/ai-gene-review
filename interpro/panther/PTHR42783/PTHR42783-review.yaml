term_assessments:
- assessed_term:
    id: GO:0016651
    label: oxidoreductase activity, acting on NAD(P)H
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Rule shared with PTHR43100: the scope covers only subfamilies with a characterized NAD(P)H-oxidising
    member. SF3 qualifies, because GltD, SfrB (NADPH-Fe(3+) oxidoreductase) and FdhB (NADP(+)-dependent
    formate dehydrogenase) are recorded as NADPH-linked. SF1 (AegA) keeps the FAD/NAD(P)-binding domain
    but has no donor assay in the cached sources, so it is left out. The scope rests on the domain and the
    characterized members, not on the root IBD, which is taxon-restricted to Bacteria and does not reach
    archaeal SudA. This is the activity the module assigns to the GltD small chains.
  applicable_subfamilies:
  - id: PANTHER:PTHR42783:SF3
    label: GLUTAMATE SYNTHASE [NADPH] SMALL CHAIN-RELATED
  supported_by:
