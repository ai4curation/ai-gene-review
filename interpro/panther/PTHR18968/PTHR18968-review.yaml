notes: >-
  Node membership read from the PAINT UniProt GAF: PTN000438682 (GO:0003984, 240 proteins;
  GO:0050660, 246) and PTN000438758 (GO:0005948, 237; GO:0009099, 204) both reach B. subtilis
  AlsS, Gcl, IolD and HACL2/ILVBL orthologs. The only S. cerevisiae member with a gene review is
  ILV2, whose IBAs are all sound; the over-propagation concerns bacterial and vertebrate members
  without reviews here, so the pruning calls rest on PANTHER/Swiss-Prot names plus the cited
  catabolic-ALS literature. The alcoholic fermentation module uses this family only for the
  bacterial catabolic ALS variant (alsS); it does not claim the yeast ILV2 for acetoin
  formation, which is consistent. No residue sites asserted.
