family_id: PANTHER:PTHR18968
family_name: THIAMINE PYROPHOSPHATE ENZYMES
preferred_name: ThDP-dependent acetohydroxyacid synthase-like enzymes (anabolic and catabolic ALS, glyoxylate carboligase, HACL2, IolD, benzoylformate decarboxylase)
summary: >-
  A large, functionally diverse family of thiamine diphosphate (ThDP)-dependent enzymes built on
  the pyruvate-oxidase/acetohydroxyacid-synthase fold. Its best-known members are the catalytic
  (large) subunits of anabolic acetohydroxyacid synthase (AHAS; yeast ILV2, E. coli IlvB/IlvG/IlvI,
  fission yeast ilv1, plant ALS), which bind FAD, associate with a regulatory small subunit, and
  make 2-acetolactate and 2-aceto-2-hydroxybutanoate for branched-chain amino acid synthesis.
  The family also contains the FAD-independent catabolic acetolactate synthases of bacterial
  acetoin/butanediol fermentation (B. subtilis AlsS, Klebsiella BudB), glyoxylate carboligase
  (E. coli Gcl), benzoylformate decarboxylase (Pseudomonas MdlC), 2-ketoarginine decarboxylase
  (AruI), the inositol-catabolic hydrolase IolD, and the eukaryotic 2-hydroxyacyl-CoA lyase 2
  (HACL2/ILVBL).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  ThDP-dependent carbanion chemistry is shared, but reactions, cofactor requirements and pathway
  roles diverge between subfamilies. Anabolic AHAS large subunits (SF13, SF170, SF142) are
  FAD-dependent, form a complex with a small regulatory subunit and act in valine/isoleucine
  biosynthesis. Catabolic ALS (SF129: AlsS, BudB) makes the same product but is FAD-independent,
  valine-resistant and acts in acetoin formation. SF14 glyoxylate carboligase, SF133
  benzoylformate decarboxylase, SF9 IolD hydrolase and SF166 HACL2 carry out different
  reactions. Several subfamily names (SF13 "mitochondrial") reflect one dominant member.
