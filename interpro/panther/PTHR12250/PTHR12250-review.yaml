family_id: PANTHER:PTHR12250
family_name: PHOSPHATIDYLINOSITOL GLYCAN, CLASS N
preferred_name: GPI ethanolamine phosphate transferase 1/MCD4 family
summary: >-
  PTHR12250 is a coherent eukaryotic GPI ethanolamine phosphate transferase
  family. Its fungal SF0 members, including S. cerevisiae Mcd4, S. pombe Its8,
  C. albicans MCD4, and Aspergillus/Neurospora orthologs, are ER multipass
  enzymes that add phosphoethanolamine to the first alpha-1,4-linked mannose of
  nascent GPI anchors during ER GPI-anchor biosynthesis.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed fungal members all sit in PTHR12250:SF0, the single GPI
  ethanolamine phosphate transferase 1 subfamily, and inherit the same PAINT
  node for mannose-ethanolamine phosphotransferase activity, ER membrane
  localization, and GPI-anchor biosynthesis.
