family_id: PANTHER:PTHR44252
family_name: D-ERYTHRULOSE REDUCTASE
summary: DCXR-related short-chain dehydrogenases/reductases reduce small carbonyl substrates, including
  L-xylulose and alpha-dicarbonyls in characterized mammalian members. The common SDR catalytic framework
  does not establish the ACP-bound fatty-acid substrate of FabG.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Mammalian recombinant enzymology establishes the DCXR carbonyl/sugar chemistry. Zebrafish
  Q567K5 aligns without gaps to human DCXR (169/244 identities), retaining the catalytic residues and
  most NADP contacts, despite a different PANTHER subfamily label. Quantitative sugar/dicarbonyl specificity
  may vary; the substrate domain of an unrelated FabG branch is not transferred from the generic SDR fold.
subfamilies:
- subfamily_id: PANTHER:PTHR44252:SF3
  label: D-ERYTHRULOSE REDUCTASE-RELATED
  description: Verified sequence-classification group containing dcxr. Functional transfer is qualified
    in the family and term assessments.
  representative_members:
  - id: UniProtKB:Q567K5
    gene_symbol: dcxr
    organism: Danio rerio
    gene_review: genes/DANRE/dcxr/dcxr-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0004316
    label: 3-oxoacyl-[acyl-carrier-protein] reductase (NADPH) activity
  scope: UNRESOLVED
  scope_reason: No inspected DCXR evidence supports an ACP-dependent beta-ketoacyl reductase role for
    the zebrafish representative. Its full-length DCXR-like sequence and ortholog enzymology support a
    different substrate context. This rejects the benchmark transfer without asserting that every unexamined
    family member is incapable of ACP-substrate chemistry.
  supported_by: &id001
  - reference_id: PMID:11882650
    supporting_text: 'homotetramers with NADPH-linked reductase activity for alpha-dicarbonyl

      compounds, catalyzed the oxidoreduction between xylitol and l-xylulose'
- assessed_term:
    id: GO:0050038
    label: L-xylulose reductase (NADPH) activity
  scope: UNRESOLVED
  scope_reason: L-xylulose reduction is directly established for mammalian DCXR and supported for the
    zebrafish sequence by conserved architecture. This does not delimit every substrate-specific branch
    in the family or establish identical activities for all proteins carrying a D-erythrulose-related
    label.
  supported_by: *id001
