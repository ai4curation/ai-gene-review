  name:
    name: L-xylulose reductase/Carbonyl reductase
    short: L-xylulose/Carbonyl_redctase
  description:
  - text: The L-xylulose reductase family comprises enzymes that catalyze the NADPH-dependent
      reduction of various sugars and alpha-dicarbonyl compounds. Members of this
      family participate in the uronate cycle of glucose metabolism and may contribute
      to cellular osmoregulation in renal tubules by producing xylitol, an osmolyte.
      Some family members also metabolize endogenous carbonyl compounds, such as those
      derived from lipid peroxidation, and may play a role in xenobiotic metabolism.
      The family belongs to the broader short-chain dehydrogenases/reductases (SDR)
      superfamily, known for their involvement in the metabolism of steroids, prostaglandins,
      and xenobiotics.
