family_id: PANTHER:PTHR30035
family_name: LIPOPROTEIN VACJ-RELATED
preferred_name: MlaA/VacJ outer-membrane phospholipid transport lipoproteins, plus a divergent
  alpha/beta-hydrolase-fold subfamily of unknown function
summary: >-
  Bacterial family defined by the MlaA (VacJ) domain (InterPro IPR007428). Its dominant
  subfamily, SF3, is MlaA itself: the outer-membrane lipoprotein of the Mla
  intermembrane phospholipid transport system of diderm bacteria. In Escherichia coli MlaA
  (P76506) is lipid-anchored in the inner leaflet of the outer membrane, forms a complex
  with the osmoporins OmpC/OmpF, and is a monomeric alpha-helical protein with a central
  amphipathic channel through which phospholipids from the outer leaflet are moved
  towards the periplasm and handed to the soluble carrier MlaC; loss of MlaA leads to
  phospholipid accumulation in the outer leaflet and envelope permeability defects.
  Shigella VacJ (P43262), Haemophilus MlaA (P44042) and the Pseudomonas VacJ proteins are
  orthologs. Many Pseudomonas genomes encode two or three SF3 paralogs (Pseudomonas putida
  KT2440 has PP_2163/VacJ Q88KX6, the Mla-operon-unlinked exemplar, and PP_1737 Q88M38),
  whose individual roles have not been resolved. The second subfamily, SF1 ("AB
  HYDROLASE-1 DOMAIN-CONTAINING PROTEIN"), is a distinct group of roughly 430-residue,
  signal-peptide-bearing proteins that carry an alpha/beta-hydrolase fold signature and
  the InterPro MlaA entry but no Pfam MlaA (PF04333) match; they occur mainly in
  Pseudomonadota, Thermodesulfobacteriota and Fusobacteriota, are widely mis-named
  "serine/threonine protein kinase" or "PrkA" by automatic naming, and have no
  experimental characterization. In P. putida KT2440 the SF1 member PP_1738 (Q88M37) is
  encoded next to the SF3 paralog PP_1737. InterPro counts 7482 proteins in 8045 taxa
  (integrated entry IPR007428); the fetched entries.csv holds only the 8 reviewed
  members, all SF3.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF3 (MlaA/VacJ) is functionally coherent and accounts for the large majority of the
  family (about 6900 of 7479 UniProt members carry the SF3 assignment). SF1 is the
  exception: a longer protein with an alpha/beta-hydrolase-fold region, no Pfam MlaA
  domain hit, and no experimental data, so the MlaA transport function cannot be assumed
  for it. The single PAINT gain (GO:0120010 at PTN001247191) sits on the SF3 root and
  PAINT TreeGrafter records no annotation on any of the five SF1 nodes, so SF1 inherits
  nothing today.
reference_protein:
  id: UniProtKB:P76506
  label: Intermembrane phospholipid transport system lipoprotein MlaA
  gene_symbol: mlaA
  organism: Escherichia coli (strain K12)
  gene_review: genes/ECOLI/mlaA/mlaA-ai-review.yaml

subfamilies:
  - subfamily_id: PANTHER:PTHR30035:SF3
    label: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM LIPOPROTEIN MLAA
    description: >-
      MlaA/VacJ outer-membrane lipoproteins (about 250 residues, N-terminal lipobox,
      Pfam PF04333). The OM-resident component of the Mla system: an alpha-helical
      channel embedded in the inner leaflet of the outer membrane that, with OmpC/OmpF,
      removes phospholipids from the outer leaflet and transfers them to MlaC. Includes
      the Pseudomonas paralogs (e.g. P. putida PP_2163 and PP_1737) and the
      uncharacterized Rickettsia members listed in the reviewed slice.
    representative_members:
      - id: UniProtKB:P76506
        label: Intermembrane phospholipid transport system lipoprotein MlaA
        gene_symbol: mlaA
        organism: Escherichia coli (strain K12)
        gene_review: genes/ECOLI/mlaA/mlaA-ai-review.yaml
      - id: UniProtKB:P43262
        label: Intermembrane phospholipid transport system lipoprotein MlaA
        gene_symbol: mlaA
        organism: Shigella flexneri
      - id: UniProtKB:P44042
        label: Intermembrane phospholipid transport system lipoprotein MlaA
        gene_symbol: mlaA
        organism: Haemophilus influenzae (strain ATCC 51907 / DSM 11121 / KW20 / Rd)
      - id: UniProtKB:Q88KX6
        label: VacJ lipoprotein
        gene_symbol: vacJ
        organism: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
        gene_review: genes/PSEPK/vacJ/vacJ-ai-review.yaml
    supported_by:
      - reference_id: PMID:29038444
        supporting_text: "MlaA is a monomeric α-helical OM protein that functions as a phospholipid translocation channel"
      - reference_id: PMID:26314242
        supporting_text: "We show that the OM lipoprotein MlaA interacts specifically with OmpC and OmpF."
  - subfamily_id: PANTHER:PTHR30035:SF1
    label: AB HYDROLASE-1 DOMAIN-CONTAINING PROTEIN
    description: >-
      About 573 UniProt members (median length about 430 residues), mainly in
      Pseudomonadota (Gammaproteobacteria, especially Pseudomonas), Thermodesulfobacteriota
      (Geobacter, Geoalkalibacter) and Fusobacteriota. Members have a predicted signal
      peptide, an alpha/beta-hydrolase fold signature (Gene3D 3.40.50.1820, SUPFAM
      SSF53474) and the InterPro MlaA entry, but no Pfam MlaA (PF04333) hit. Names such
      as "serine/threonine protein kinase" and "serine protein kinase PrkA" are
      machine-generated (ProtNLM) and are not supported by any kinase domain signature.
      Function unknown; no member has experimental annotation.
    representative_members:
      - id: UniProtKB:Q88M37
        label: Serine/threonine protein kinase
        organism: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
    diverged_from_family: true
    divergence_description: >-
      Diverged in domain architecture rather than shown to have lost a function: SF1
      proteins are about twice the length of MlaA, add an alpha/beta-hydrolase-fold
      region, and lack the full Pfam MlaA domain match that every SF3 member carries.
      There is no evidence that they are lipid-anchored outer-membrane proteins or that
      they participate in the Mla system, so neither intermembrane phospholipid transfer
      nor cell outer membrane localization should be propagated to them. In P. putida
      KT2440 the SF1 gene PP_1738 is adjacent to the SF3 paralog PP_1737, which hints at a
      shared but uncharacterized function for that MlaA paralog pair; it is not evidence
      of Mla function.

node_assessments:
  - node_id: PANTHER:PTN001247191
    asserted_term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    evidence: IBD
    node_taxon:
      id: NCBITaxon:2
      label: Bacteria
    paint_snapshot: "20190822"
    seeds:
      - id: UniProtKB:P76506
        label: Intermembrane phospholipid transport system lipoprotein MlaA
        organism: Escherichia coli (strain K12)
    assessment: SOUND
    assessment_reason: >-
      The node is the root of SF3 (TreeGrafter AN6, PTHR30035:SF3); the family root
      (PTN000769014) and the five SF1 nodes carry no annotation, so the term is confined to
      MlaA/VacJ proteins. The single seed is sufficient: E. coli MlaA is the experimentally
      best-characterized member (IDA in GOA, deletion phenotype, crystal structure and
      in vitro transfer data), and its OM phospholipid-channel role is conserved across
      the diderm lineages that receive the IBA (Enterobacterales, Pasteurellales,
      Vibrio, Pseudomonas, Xanthomonas, Neisseria, Geobacter, Fusobacterium). The
      "taxon:2" label reflects the depth of the MlaA clade, not propagation into
      monoderms, which lack SF3 members. Residual caveat: several Pseudomonas genomes carry
      two or three SF3 paralogs (P. aeruginosa PA2800 and PA3239 both inherit the term),
      and whether every paralog works in the Mla route is untested; the process term is
      broad enough that this does not justify pruning.
    supported_by:
      - reference_id: PMID:19383799
        supporting_text: "We propose that the Mla pathway constitutes a bacterial intermembrane PL trafficking system."
      - reference_id: PMID:29038444
        supporting_text: "MlaA represents a lipid transport protein that selectively removes outer leaflet phospholipids to help maintain the essential barrier function of the bacterial OM."

term_assessments:
  - assessed_term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      True of MlaA/VacJ (SF3), the outer-membrane interface of the Mla system. Not
      established for the alpha/beta-hydrolase-fold SF1 proteins, which lack the full MlaA
      domain and have no functional data.
    applicable_subfamilies:
      - id: PANTHER:PTHR30035:SF3
        label: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM LIPOPROTEIN MLAA
    supported_by:
      - reference_id: PMID:38092770
        supporting_text: "in the first step, the OmpC-MlaA complex transfers PLs to the periplasmic chaperone MlaC"
  - assessed_term:
      id: GO:0009279
      label: cell outer membrane
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      MlaA is an outer-membrane lipoprotein that sits within the inner leaflet of the OM
      and associates with OmpC/OmpF. Not currently asserted by PAINT, but safe for SF3 as a
      family-level location; SF1 has a signal peptide but no evidence of a lipobox or OM
      residence.
    applicable_subfamilies:
      - id: PANTHER:PTHR30035:SF3
        label: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM LIPOPROTEIN MLAA
    supported_by:
      - reference_id: PMID:29848551
        supporting_text: "MlaA interacts extensively with OmpC and is located entirely within the lipid bilayer"

