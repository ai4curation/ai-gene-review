- subfamily_id: PANTHER:PTHR30035:SF1
  label: AB HYDROLASE-1 DOMAIN-CONTAINING PROTEIN
  description: About 573 UniProt members (median length about 430 residues), mainly in Pseudomonadota
    (Gammaproteobacteria, especially Pseudomonas), Thermodesulfobacteriota (Geobacter, Geoalkalibacter)
    and Fusobacteriota. Members have a predicted signal peptide, an alpha/beta-hydrolase fold signature
    (Gene3D 3.40.50.1820, SUPFAM SSF53474) and the InterPro MlaA entry, but no Pfam MlaA (PF04333) hit.
    Names such as "serine/threonine protein kinase" and "serine protein kinase PrkA" are machine-generated
    (ProtNLM) and are not supported by any kinase domain signature. Function unknown; no member has experimental
    annotation.
  representative_members:
  - id: UniProtKB:Q88M37
    label: Serine/threonine protein kinase
    organism: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
  diverged_from_family: true
  divergence_description: SF1 differs in architecture (longer proteins with an alpha/beta-hydrolase-fold
    region and without the canonical PF04333 match). Its physiological function, localization and possible
    relationship to adjacent SF3 paralogs remain unresolved. This is not a negative assay or a phylogenetic
    loss assertion.
node_assessments:
- node_id: PANTHER:PTN001247191
  asserted_term:
