subfamilies:
- subfamily_id: PANTHER:PTHR30035:SF3
  label: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM LIPOPROTEIN MLAA
  description: 'MlaA/VacJ outer-membrane lipoproteins (about 250 residues, N-terminal lipobox, Pfam PF04333).
    The OM-resident component of the Mla system: an alpha-helical channel embedded in the inner leaflet
    of the outer membrane that, with OmpC/OmpF, removes phospholipids from the outer leaflet and transfers
    them to MlaC. Includes the Pseudomonas paralogs (e.g. P. putida PP_2163 and PP_1737) and the uncharacterized
    Rickettsia members listed in the reviewed slice.'
