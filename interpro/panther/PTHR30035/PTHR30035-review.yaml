  paint_snapshot: '20190822'
  seeds:
  - id: UniProtKB:P76506
    label: Intermembrane phospholipid transport system lipoprotein MlaA
    organism: Escherichia coli (strain K12)
  assessment: SOUND
  assessment_reason: 'The node is the root of SF3 (TreeGrafter AN6, PTHR30035:SF3); the family root (PTN000769014)
    and the five SF1 nodes carry no annotation, so the term is confined to MlaA/VacJ proteins. The single
    seed is sufficient: E. coli MlaA is the experimentally best-characterized member (IDA in GOA, deletion
    phenotype, crystal structure and in vitro transfer data), and its OM phospholipid-channel role is
    conserved across the diderm lineages that receive the IBA (Enterobacterales, Pasteurellales, Vibrio,
    Pseudomonas, Xanthomonas, Neisseria, Geobacter, Fusobacterium). The "taxon:2" label reflects the depth
    of the MlaA clade, not propagation into monoderms, which lack SF3 members. Residual caveat: several
    Pseudomonas genomes carry two or three SF3 paralogs (P. aeruginosa PA2800 and PA3239 both inherit
    the term), and whether every paralog works in the Mla route is untested; the process term is broad
    enough that this does not justify pruning.'
  supported_by:
  - reference_id: PMID:19383799
    supporting_text: We propose that the Mla pathway constitutes a bacterial intermembrane PL trafficking
      system.
  - reference_id: PMID:29038444
    supporting_text: MlaA represents a lipid transport protein that selectively removes outer leaflet
      phospholipids to help maintain the essential barrier function of the bacterial OM.
term_assessments:
- assessed_term:
    id: GO:0120010
    label: intermembrane phospholipid transfer
  scope: UNRESOLVED
  scope_reason: Canonical SF3 MlaA has positive structural, localization and lipid-handling evidence,
    including the E. coli source and reviewed Pseudomonas/Bordetella homologs. SF1 has different architecture
    and an unresolved function. Because SUBFAMILY_ONLY would also exclude any true assertion outside SF3,
    universal scope is left unresolved rather than converting lack of characterization into a loss. Use
    exact positive MlaA members, domain architecture and compatible envelope context; the existing SF3
    PAINT gain remains SOUND.
  supported_by:
  - reference_id: PMID:38092770
    supporting_text: To maintain this barrier, the OmpC-Mla system removes mislocalized PLs from the OM
      outer leaflet, and transports them to the inner membrane (IM); in the first step, the OmpC-MlaA
      complex transfers PLs to the periplasmic chaperone MlaC, but mechanistic details are lacking.
