family_id: PANTHER:PTHR30035
family_name: LIPOPROTEIN VACJ-RELATED
preferred_name: MlaA/VacJ outer-membrane phospholipid transport lipoproteins, plus a divergent alpha/beta-hydrolase-fold
  subfamily of unknown function
summary: MlaA/VacJ-related proteins include canonical outer-membrane MlaA lipoproteins in SF3 and a divergent,
  longer SF1 group with an alpha/beta-hydrolase-fold region. E. coli MlaA forms a phospholipid-handling
  channel with OmpC/OmpF and loads the soluble carrier MlaC. Pseudomonas and Bordetella exemplars have
  compatible MlaA domain assignments, but their exact porin partner and native transfer kinetics are not
  established by the E. coli assays. SF1 function remains unresolved; its different architecture is not
  a demonstrated loss of every Mla-associated function.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The official reference tree places the existing intermembrane-transfer IBD at PTN001247191
  on the 12 SF3 leaves, outside the three SF1 leaves. This supports the positive MlaA clade without making
  an unsupported negative assertion about SF1. Broader classification counts are not experimental evidence.
