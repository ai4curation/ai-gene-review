notes: >-
  Written to support modules/bacterial_mla_intermembrane_phospholipid_transport.yaml,
  whose MlaA part selects PANTHER:PTHR30035:SF3 with P. putida VacJ (Q88KX6) as
  exemplar. Node id, term, seed, taxon and date are verbatim from PTHR30035-paint.tsv.
  Subfamily structure was read from the cached PAINT_TreeGrafter_Annotations_TOTAL file
  (AN0 family root unannotated; AN1-AN5 = SF1, unannotated; AN6-AN22 = SF3, all carrying
  GO:0120010, AN6 = PTN001247191). The IBA recipients (12 proteins) were read from the
  cached PAINT UniProt GAF. Subfamily sizes, taxon spread, lengths and domain signatures
  for SF1 and the P. putida members (Q88KX6 PP_2163, Q88M38 PP_1737 in SF3; Q88M37
  PP_1738 in SF1) come from a UniProt REST query of xref:panther-PTHR30035 run on
  2026-10-23 (7479 entries; 573 SF1). The SF1 kinase names are ProtNLM-generated
  (ECO:0008006) and are not evidence of kinase activity. Q88KX6 does not receive the IBA
  in the current PAINT GAF (P. putida KT2440 is not among the tree's sequences); its GOA
  carries GO:0120010 by IEA only. The E. coli mlaA gene review was being written
  concurrently; no gene-level conflict is expected because the only propagated term is
  the accepted core process.
