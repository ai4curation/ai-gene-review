family_id: PANTHER:PTHR11558
family_name: SPERMIDINE/SPERMINE SYNTHASE
preferred_name: Polyamine aminopropyltransferase family (spermidine/spermine synthase, PMT)
summary: >-
  Aminopropyltransferases transfer the aminopropyl group of decarboxylated S-adenosylmethionine to
  an amine. Spermidine synthase uses putrescine (bacterial SpeE, S. cerevisiae SPE3, S. pombe SPBC12C2.07c,
  human SRM). Spermine synthase uses spermidine (S. cerevisiae SPE4, plant SPMS). Plant putrescine
  N-methyltransferases (PMT) evolved from spermidine synthase and transfer a methyl group from SAM
  instead.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Acceptor and transferred group vary. Spermidine synthase (SF11, SF43), spermine synthase (SF25,
  and S. cerevisiae SPE4 inside SF11) and putrescine N-methyltransferase (SF53) are distinct activities.
