family_id: PANTHER:PTHR30602
family_name: AMINO-ACID ACETYLTRANSFERASE
preferred_name: Classical N-acetylglutamate synthase (ArgA/NAGS)
summary: >-
  Classical bacterial and plant N-acetylglutamate synthases (ArgA, EC 2.3.1.1): an N-terminal amino-acid
  kinase-like domain fused to a C-terminal GNAT acetyltransferase domain. They acetylate L-glutamate with
  acetyl-CoA, the first committed step of the linear and initiating step of the cyclic acetylated-ornithine
  route to arginine. Characterized members include Escherichia coli and Pseudomonas aeruginosa ArgA. In
  PANTHER 19 all 65 reviewed members fall in SF12, including the Arabidopsis chloroplastic NAGS1 and NAGS2
  and one uncharacterized Chlorobium protein.
functional_coherence: COHERENT
coherence_reason: >-
  Reviewed members are named and characterized as amino-acid (glutamate) acetyltransferases that use
  acetyl-CoA, and the PAINT process assertion is arginine biosynthesis. The one PAINT function row uses the
  acetylornithine-donor term, which is a term-selection error rather than a sign of divergent function.
reference_protein:
  id: UniProtKB:P0A6C5
  label: Amino-acid acetyltransferase
  gene_symbol: argA
  organism: Escherichia coli (strain K12)
  gene_review: genes/ECOLI/argA/argA-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR30602:SF12
  label: AMINO-ACID ACETYLTRANSFERASE NAGS1, CHLOROPLASTIC-RELATED
  description: >-
    Holds all reviewed members: bacterial ArgA and the plant chloroplastic NAGS proteins.
  representative_members:
  - id: UniProtKB:P0A6C5
    gene_symbol: argA
    organism: Escherichia coli (strain K12)
    gene_review: genes/ECOLI/argA/argA-ai-review.yaml
  - id: UniProtKB:P0A0Z9
    gene_symbol: argA
