  diverged_from_family: false
node_assessments:
- node_id: PANTHER:PTN004744913
  asserted_term:
    id: GO:0004358
    label: L-glutamate N-acetyltransferase activity, acting on acetyl-L-ornithine as donor
  evidence: IBD
  paint_snapshot: '20250225'
  seeds:
  - id: UniProtKB:P0A6C5
  - id: UniProtKB:P22567
  assessment: WRONG_NODE
  assessment_reason: >-
    The seeds do not support this term at all. GO:0004358 is defined as "Catalysis of the reaction:
    N2-acetyl-L-ornithine + L-glutamate = N-acetyl-L-glutamate + L-ornithine", the ArgJ recycling
    reaction, whereas both seeds (E. coli and P. aeruginosa ArgA) are acetyl-CoA-dependent synthases. The
    E. coli argA review modifies this IBA and the matching IDA rows to GO:0004042. The node placement
    would be sound for GO:0004042; the error is the choice of term.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30602/PTHR30602-paint.tsv
    supporting_text: "PTHR30602\tPTN004744913\tGO:0004358\tF\tIBD\tfalse\tUniProtKB:P0A6C5|UniProtKB:P22567"
  - reference_id: file:genes/ECOLI/argA/argA-ai-review.yaml
    supporting_text: The underlying glutamate acetylation activity is correct, but the current GO:0004358
      definition requires acetyl-L-ornithine as donor. E. coli ArgA instead uses acetyl-CoA (RHEA:24292;
      curated PMID:16890).
- node_id: PANTHER:PTN004744913
  asserted_term:
    id: GO:0006526
    label: L-arginine biosynthetic process
  evidence: IBD
  paint_snapshot: '20250225'
  seeds:
  - id: UniProtKB:P0A6C5
  - id: UniProtKB:P22567
  assessment: SOUND
  assessment_reason: >-
    ArgA catalyses the first acetylation of the arginine pathway; the E. coli argA review accepts this IBA
    alongside IDA and IMP rows.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30602/PTHR30602-paint.tsv
    supporting_text: "PTHR30602\tPTN004744913\tGO:0006526\tP\tIBD\tfalse\tUniProtKB:P0A6C5|UniProtKB:P22567"
  - reference_id: file:genes/ECOLI/argA/argA-ai-review.yaml
    supporting_text: It transfers the acetyl group of acetyl-CoA to L-glutamate, producing N-acetylglutamate
      and CoA.
term_assessments:
- assessed_term:
    id: GO:0004042
    label: L-glutamate N-acetyltransferase activity, acting on acetyl-CoA as donor
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    All reviewed members are in SF12, where 64 of 65 are named amino-acid acetyltransferases or plant NAGS
    and the characterized members (E. coli ArgA, P. aeruginosa ArgA) use acetyl-CoA. The one
    uncharacterized SF12 member (Chlorobium CT2212) has no evidence against the activity. The other
    PANTHER subfamilies (SF9, SF13, SF14) have no reviewed members, so the term is not extended to them.
  applicable_subfamilies:
  - id: PANTHER:PTHR30602:SF12
    label: AMINO-ACID ACETYLTRANSFERASE NAGS1, CHLOROPLASTIC-RELATED
  supported_by:
  - reference_id: file:genes/ECOLI/argA/argA-ai-review.yaml
    supporting_text: ArgA transfers acetyl from acetyl-CoA to glutamate, the initiation reaction of the
      linear pathway.
- assessed_term:
    id: GO:0004358
    label: L-glutamate N-acetyltransferase activity, acting on acetyl-L-ornithine as donor
  scope: NOT_APPLICABLE
  scope_reason: >-
    No member is known to use acetylornithine as donor; the PAINT row asserting this term is a
    term-selection error for GO:0004042.
  supported_by:
  - reference_id: file:genes/ECOLI/argA/argA-ai-review.yaml
    supporting_text: Correct the donor-specific term to GO:0004042, already present
- assessed_term:
    id: GO:0006526
    label: L-arginine biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Follows the activity: SF12 ArgA/NAGS enzymes initiate arginine biosynthesis; unreviewed subfamilies are
    not assessed.
  applicable_subfamilies:
  - id: PANTHER:PTHR30602:SF12
    label: AMINO-ACID ACETYLTRANSFERASE NAGS1, CHLOROPLASTIC-RELATED
  supported_by:
  - reference_id: file:interpro/panther/PTHR30602/PTHR30602-paint.tsv
    supporting_text: "PTHR30602\tPTN004744913\tGO:0006526\tP\tIBD\tfalse"
