- subfamily_id: PANTHER:PTHR11358:SF32
  label: ARGINASE 2, CHLOROPLASTIC_MITOCHONDRIAL
  description: Plant ARGAH2-related enzymes. Arabidopsis ARGAH2 has direct arginase and agmatinase activity;
    the agmatinase scope is a clade inference anchored by this target and conserved plant ARGAH substrate-binding
    architecture, not a claim that every member has been assayed or that either substrate dominates native
    flux.
  representative_members:
