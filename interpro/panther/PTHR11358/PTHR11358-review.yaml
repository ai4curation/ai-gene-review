term_assessments:
- assessed_term:
    id: GO:0008783
    label: agmatinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: Agmatinase activity is supported in SF26 and SF30, with the existing APAUH exception,
    and in the plant ARGAH2 subfamily SF32. PMID:28716421 directly demonstrates purified Arabidopsis ARGAH2
    agmatine turnover in a coupled assay, so its arginase activity does not exclude agmatinase activity.
    SF32 extension beyond this assayed representative is a clade-level inference supported by the conserved
    plant ARGAH substrate-binding architecture in PMID:32754173. No family-wide grant, extension to SF41/SF35,
    or claim about dominant physiological substrate is made.
