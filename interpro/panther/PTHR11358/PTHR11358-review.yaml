- node_id: PANTHER:PTN000144486
  asserted_term:
    id: GO:0009446
    label: putrescine biosynthetic process
  evidence: IBD
  paint_snapshot: '20260528'
  seeds:
  - id: AGI_LocusCode:AT4G08870
  - id: AGI_LocusCode:AT4G08900
  assessment: NEEDS_PRUNING
  assessment_reason: 'The S. pombe agmatinase recipients (SPAC11D3.09, SPAPB24D3.03) receive this IBA, but
    both reviews mark it over-annotated: S. pombe lacks arginine decarboxylase and makes putrescine from
    ornithine, so endogenous putrescine biosynthesis via agmatine is not their role. The APAUH branch (Synechocystis
    SpeB1, P72703) makes spermidine directly from N1-aminopropylagmatine, produces no putrescine from agmatine,
    and belongs to a pathway that bypasses putrescine, so that branch should not inherit putrescine biosynthesis.
    The Arabidopsis experimental seeds remain valid: PMID:28716421 directly assays purified ARGAH2 and reports
    both-paralog complementation for putrescine production. Pruning is restricted to the demonstrated APAUH
    loss branch, not the dual-function plant branch; whether the fungal branch should also lose the term
    is left open.'
  supported_by:
  - reference_id: file:interpro/panther/PTHR11358/PTHR11358-paint.tsv
    supporting_text: "PTHR11358\tPTN000144486\tGO:0009446\tP\tIBD\tfalse"
  - reference_id: PMID:37878710
    supporting_text: Putrescine was not detectable in the assay mixture containing the APAUH and agmatine
  - reference_id: file:genes/SCHPO/SPAC11D3.09/SPAC11D3.09-ai-review.yaml
    supporting_text: S. pombe has no biosynthetic arginine decarboxylase and synthesizes putrescine de novo
