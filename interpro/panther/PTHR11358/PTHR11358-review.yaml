- subfamily_id: PANTHER:PTHR11358:SF26
  label: GUANIDINO ACID HYDROLASE, MITOCHONDRIAL
  description: Bacterial SpeB agmatinases and guanidino acid hydrolases, including S. pombe SPBC8E4.03.
    Also contains the N1-aminopropylagmatine ureohydrolases (APAUH; Synechocystis SpeB1, Thermus SpeB
    homologue), which hydrolyse APA to spermidine and do not act on agmatine. Arabidopsis ARGAH1 is also
    placed here and supports both arginine hydrolysis and ADC-dependent putrescine production; the subfamily
    name is not a single-substrate definition.
