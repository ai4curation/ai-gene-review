family_id: PANTHER:PTHR11358
family_name: ARGINASE/AGMATINASE
preferred_name: Ureohydrolase (arginase/agmatinase/formiminoglutamase) family
summary: >-
  Binuclear manganese ureohydrolases that hydrolyse guanidino or formimino groups. Subfamilies specialize:
  arginase (urea cycle and arginine catabolism), agmatinase (putrescine synthesis; bacterial SpeB,
  S. pombe agm1, agm2, agm3), guanidino acid hydrolases (guanidinobutyrase), and formiminoglutamase
  HutG (histidine utilization).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The substrate is set by subfamily: agmatine (SF26, SF30), formiminoglutamate (SF35) and arginine
  (SF32, SF41). SF26 also includes guanidino acid hydrolases and the N1-aminopropylagmatine
  ureohydrolases (APAUH), which do not hydrolyse agmatine.
