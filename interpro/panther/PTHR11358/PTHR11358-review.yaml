family_id: PANTHER:PTHR11358
family_name: ARGINASE/AGMATINASE
preferred_name: Ureohydrolase (arginase/agmatinase/formiminoglutamase) family
summary: 'Binuclear manganese ureohydrolases that hydrolyse guanidino or formimino groups. Substrates
  overlap across some subfamilies: the plant ARGAH enzymes include dual arginase/agmatinase activities,
  whereas other branches specialize in agmatine, guanidino acids, N1-aminopropylagmatine or formiminoglutamate
  hydrolysis. Consequently, neither an arginase name nor membership in the base family alone determines
  substrate specificity.'
functional_coherence: HETEROGENEOUS
coherence_reason: Agmatinase activity is supported in SF26 (SpeB agmatinases, with member exceptions) and SF30 and in the plant ARGAH2 subfamily
  SF32, whose representative Arabidopsis ARGAH2 has direct recombinant-enzyme evidence for both agmatine
  and arginine hydrolysis. ARGAH1 in SF26 also has dual-function evidence. This does not extend agmatinase
  activity to SF41 arginases or SF35 formiminoglutamases. SF26 additionally contains guanidino acid hydrolases
  and the N1-aminopropylagmatine ureohydrolase (APAUH) branch, for which agmatine activity is absent.
