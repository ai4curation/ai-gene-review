    label: agmatinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Agmatinase activity is supported in SF30 (S. pombe agmatinases), in the plant
    ARGAH2 subfamily SF32 (purified Arabidopsis ARGAH2 turns over agmatine, PMID:28716421;
    clade-level extension rests on the conserved plant ARGAH substrate-binding
    architecture, PMID:32754173), and in SF26 for the SpeB agmatinases (E. coli SpeB,
    purified enzyme). SF26 is functionally mixed, so its grant carries member exceptions
    for every Swiss-Prot member with evidence against agmatinase activity: formimidoylglutamases
    (HutG), proclavaminate amidinohydrolase (Pah), guanidine hydrolase (GdmH),
    guanidinobutyrases (GbuA, GBU1, Gbh), guanidinopropionase (GpuA), the APAUHs of
    Synechocystis and Thermus, and the vertebrate AGMAT guanidino acid hydrolases. Not
    excepted: Thermococcus TK0882, an APAUH that also converts agmatine to putrescine; the
    plant arginases placed in SF26 (Arabidopsis ARGAH1 has dual arginase/agmatinase
    evidence); and the uncharacterized Methanothermus P19268. No family-wide grant and no
    extension to the SF41 arginases or SF35 formiminoglutamases is made.
  applicable_subfamilies:
  - id: PANTHER:PTHR11358:SF26
    label: GUANIDINO ACID HYDROLASE, MITOCHONDRIAL
  - id: PANTHER:PTHR11358:SF30
