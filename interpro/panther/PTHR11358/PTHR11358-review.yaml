    supporting_text: "PTHR11358\tPTN000144486\tGO:0008783\tF\tIBD\tfalse"
  - reference_id: PMID:37878710
    supporting_text: The APAUH is highly specific to APA and incapable of releasing measurable urea from
      CAPA, agmatine, arginine, guanidine, guanidinobutyrate, and guanidinopropionate
  - reference_id: PMID:37878710
    supporting_text: Phylogenetic analysis revealed that APAUH and its orthologs are clustered as a separate
      group from arginase and agmatine ureohydrolase and form a distinct clade within the ureohydrolase
      superfamily
  - reference_id: file:genes/SCHPO/SPAC11D3.09/SPAC11D3.09-ai-review.yaml
    supporting_text: Agmatinase (agmatine ureohydrolase) activity assigned by arginase-family subfamily
      membership; the substrate in vivo has not been tested.
  - reference_id: PMID:28716421
    supporting_text: 'In

      vitro assays using purified recombinant enzymes of AtADC1 and AtARGAH2 were used

      to show that these enzymes can function in concert to convert arginine to

      agmatine and putrescine.'
