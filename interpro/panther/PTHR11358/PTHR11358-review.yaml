  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Placement is defensible for the agmatinase members (SPAC11D3.09 and SPAPB24D3.03 in S. pombe
    retain the IBA), but the N1-aminopropylagmatine ureohydrolase (APAUH) branch below this node
    has lost agmatinase activity. Purified Synechocystis SpeB1 (P72703, SF26) releases no urea
    from agmatine, the Thermus SpeB homologue does not act on agmatine, and APAUH orthologues form
    a clade separate from agmatinases. That branch needs an IRD/NOT to stop GO:0008783.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11358/PTHR11358-paint.tsv
    supporting_text: "PTHR11358\tPTN000144486\tGO:0008783\tF\tIBD\tfalse"
  - reference_id: PMID:37878710
    supporting_text: >-
      The APAUH is highly specific to APA and incapable of releasing measurable urea from CAPA,
      agmatine, arginine, guanidine, guanidinobutyrate, and guanidinopropionate
  - reference_id: PMID:37878710
    supporting_text: >-
      Phylogenetic analysis revealed that APAUH and its orthologs are clustered as a separate
      group from arginase and agmatine ureohydrolase and form a distinct clade within the
      ureohydrolase superfamily
  - reference_id: file:genes/SCHPO/SPAC11D3.09/SPAC11D3.09-ai-review.yaml
    supporting_text: >-
      Agmatinase (agmatine ureohydrolase) activity assigned by arginase-family subfamily
      membership; the substrate in vivo has not been tested.
