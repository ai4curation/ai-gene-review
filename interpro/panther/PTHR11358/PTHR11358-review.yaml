  assessment: NEEDS_PRUNING
  assessment_reason: 'Placement is defensible for the agmatinase members (SPAC11D3.09 and SPAPB24D3.03
    in S. pombe retain the IBA), but the N1-aminopropylagmatine ureohydrolase (APAUH) branch below this
    node has lost agmatinase activity. Purified Synechocystis SpeB1 (P72703, SF26) releases no urea from
    agmatine, the Thermus SpeB homologue does not act on agmatine, and APAUH orthologues form a clade
    separate from agmatinases. That branch needs an IRD/NOT to stop GO:0008783. The Arabidopsis experimental
    seeds remain valid: PMID:28716421 directly assays purified ARGAH2 and reports both-paralog complementation
    for putrescine production. Pruning is restricted to the demonstrated APAUH loss branch, not the dual-function
    plant branch.'
