  name:
    name: Deoxyhypusine hydroxylase
    short: Deoxyhypusine_hydroxylase
  description:
  - text: The deoxyhypusine hydroxylase family is responsible for the post-translational
      modification of eukaryotic translation initiation factor 5A (eIF-5A) through
      the hydroxylation of the N(6)-(4-aminobutyl)-L-lysine intermediate to form hypusine.
      This unique amino acid residue, hypusine, is essential for the function of mature
      eIF-5A. The modification is a two-step process where deoxyhypusine synthase
      (DHPS) first synthesizes the intermediate, which is then hydroxylated by deoxyhypusine
      hydroxylase. Hypusination is critical for various cellular processes including
      cell growth, proliferation, autophagy, and protein synthesis. The family's activity
      is also known to be inhibited by certain metal chelators, which can affect organismal
      growth.
