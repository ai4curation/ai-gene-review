family_id: PANTHER:PTHR11715
family_name: GLYCINE CLEAVAGE SYSTEM H PROTEIN
preferred_name: Glycine cleavage system H protein (GcvH/GCSH/GCV3) family
summary: >-
  The H protein of the glycine cleavage system carries a lipoyl arm that shuttles the aminomethyl
  intermediate and reducing equivalents between the P, T and L proteins. Eukaryotic H proteins also
  act as lipoyl donors for protein lipoylation. The family contains bacterial GcvH, S. cerevisiae
  GCV3, S. pombe gcv3 and human GCSH.
functional_coherence: COHERENT
coherence_reason: All subfamilies are lipoyl-carrying H proteins.
