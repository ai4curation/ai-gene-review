term_assessments:
- assessed_term:
    id: GO:0031405
    label: lipoic acid binding
  scope: FAMILY_WIDE
  scope_reason: >-
    Every reviewed member carries a covalently attached lipoyl arm on its conserved lysine
    (yeast GCV3 by IDA). Because the lipoyl group is covalently attached, the member reviews keep
    lipoic acid binding as a cofactor attribute (GCV3 KEEP_AS_NON_CORE) and record the carrier role
    as GO:0140104 molecular carrier activity, which the glycine_cleavage_system module uses.
  supported_by:
  - reference_id: file:genes/yeast/GCV3/GCV3-ai-review.yaml
    supporting_text: >-
      Chen et al. confirmed protein-bound lipoate in yeast by LC-MS/MS; Gcv3 is the lipoyl-bearing
- assessed_term:
    id: GO:0140104
    label: molecular carrier activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterized H protein (bacterial GcvH, yeast GCV3, S. pombe gcv3, human GCSH) carries the
    glycine-derived aminomethyl intermediate on its lipoyl arm from the P protein to the T protein, which
    meets the GO:0140104 definition. The term is asserted for the H-protein role of the
    glycine_cleavage_system module and accepted or proposed (NEW) on every member review.
  supported_by:
  - reference_id: file:genes/human/GCSH/GCSH-uniprot.txt
    supporting_text: The H protein (GCSH) shuttles the methylamine group of glycine from the P protein (GLDC) to the T protein (GCST).
  - reference_id: file:genes/PSEPK/gcvH1/gcvH1-ai-review.yaml
    supporting_text: The H protein carries the glycine-derived aminomethyl intermediate on its covalently attached lipoyl arm from the P protein to the T protein and presents the reduced arm to the L protein, which is carrier activity.
