residue_sites:
  - site_id: fe4s_n3_ligands
    label: Four cysteine ligands of the [4Fe-4S] cluster N3
    description: >-
      The complete thiolate cage of cluster N3, the first iron-sulfur centre of the
      electron wire and the acceptor of electrons from the reduced FMN. Unlike the
      by-similarity cysteines annotated on the 49 kDa subunit family, these are directly
      observed: UniProt cites PubMed:28844695 and PDB entries 5XTB, 5XTD, 5XTH and 5XTI
      for all four positions. They are invariant across the family - Cys379/382/385/425 in
      human and bovine NDUFV1, Cys351/354/357/398 in Escherichia coli NuoF,
      Cys402/405/408/448 in Arabidopsis, Cys377/380/383/424 in Schizosaccharomyces pombe
      and Cys396/399/402/442 in Dictyostelium - so no member of the fetched slice has lost
      the cluster.
    anchor:
      id: UniProtKB:P49821
      label: NADH dehydrogenase [ubiquinone] flavoprotein 1, mitochondrial
      gene_symbol: NDUFV1
      organism: Homo sapiens
    residues:
      - position: 379
        expected:
          - C
        role: N3 [4Fe-4S] cluster ligand
      - position: 382
        expected:
          - C
        role: N3 [4Fe-4S] cluster ligand
      - position: 385
        expected:
          - C
        role: N3 [4Fe-4S] cluster ligand
      - position: 425
        expected:
          - C
        role: N3 [4Fe-4S] cluster ligand
    site_source: UNIPROT_FEATURE
    required_for:
      - term:
          id: GO:0051539
          label: 4 iron, 4 sulfur cluster binding
        strength: CONTRIBUTES
        rationale: >-
          A [4Fe-4S] cluster is held by exactly four thiolates, one per iron; all four are
          annotated here from the structure, so mechanistically the dependency is absolute
          and REQUIRED would be the natural strength. It is recorded at CONTRIBUTES
          instead for an evidential reason: no member of this family has been found that
          has lost one of these cysteines, so there is no negative control demonstrating
          what loss looks like here, and a claim with no possible counterexample must not
          be allowed to contradict a gene review. If a cluster-less member is ever
          identified, this should be promoted to REQUIRED with that member as the negative
          control.
      - term:
          id: GO:0009055
          label: electron transfer activity
        strength: CONTRIBUTES
        rationale: >-
          N3 is the relay point between the two-electron chemistry of the flavin and the
          one-electron chemistry of the iron-sulfur wire, so the cluster is how this
          subunit passes electrons onward rather than merely accepting them. CONTRIBUTES
          rather than REQUIRED because a cluster-less flavoprotein would still reduce its
          FMN from NADH, and the loss would be of onward transfer, not of the whole
          molecular function.
        supported_by:
          - reference_id: PMID:8288251
            supporting_text: >-
              is believed to be the principal site of entry for electrons donated by NADH
              into the respiratory chain
          - reference_id: PMID:28844695
            supporting_text: >-
              The structure not only reveals the precise assignment of individual subunits
              of human CI and CIII, but also enables future in-depth analysis of the
              electron transport chain as a whole
    positive_controls:
      - id: UniProtKB:P25708
        label: NADH dehydrogenase [ubiquinone] flavoprotein 1, mitochondrial
        gene_symbol: NDUFV1
        organism: Bos taurus
        control_position: 379
        control_residue: C
      - id: UniProtKB:P31979
        label: NADH-quinone oxidoreductase subunit F
        gene_symbol: nuoF
        organism: Escherichia coli (strain K12)
        control_position: 351
        control_residue: C
      - id: UniProtKB:Q9FNN5
        label: NADH dehydrogenase [ubiquinone] flavoprotein 1, mitochondrial
        gene_symbol: At5g08530
        organism: Arabidopsis thaliana
        control_position: 402
        control_residue: C

term_assessments:
  - assessed_term:
      id: GO:0003954
      label: NADH dehydrogenase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The subunit's own chemistry, with the acceptor left unspecified: NADH docks on the
      glycine-rich loop (UniProt binding site 87-96 of P49821, GRGGAGFPTG, conserved in
      bacteria, plants, fungi and animals) and transfers a hydride to the bound FMN. This
      is true of every member, respiratory compartment and quinone identity aside, and it
      is the term a PAINT curator should place at the family root. PAINT currently asserts
      it only at the bacterial node PTN000207323, which is why human NDUFV1 - and every
      other eukaryotic member - receives no molecular-function IBA at all despite this
      being the single best-characterised function in the family.
    supported_by:
      - reference_id: PMID:8288251
        supporting_text: >-
          plays an important role in the formation of the NADH-binding site and
          is believed to be the principal site of entry for electrons donated by NADH
          into
          the respiratory chain
  - assessed_term:
      id: GO:0010181
      label: FMN binding
    scope: FAMILY_WIDE
    scope_reason: >-
      One FMN per subunit, resolved in the human complex I cryo-EM structure and annotated
      by UniProt over residues 199-247 of P49821. The flavin is what makes this subunit a
      flavoprotein and what allows a two-electron donor to feed a one-electron wire; no
      member of the family is known to have lost it. Currently reaching human NDUFV1 only
      as an InterPro2GO electronic annotation, with no phylogenetic assertion behind it.
  - assessed_term:
      id: GO:0051287
      label: NAD binding
    scope: FAMILY_WIDE
    scope_reason: >-
      The nucleotide site of the whole enzyme lives on this subunit and nowhere else. The
      contrast with the partner family is worth stating explicitly, because the same
      electronic annotation appears in both: in PTHR11993 (the 49 kDa quinone-chamber
      subunit) GO:0051287 is an InterPro2GO artefact and is not applicable to any member,
      whereas here it names a real, structurally annotated site roughly 90 A away along
      the peripheral arm. A curator moving NAD-binding annotations around complex I should
      be putting them here and removing them there.
  - assessed_term:
      id: GO:0009055
      label: electron transfer activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Reduced FMN to N3 to the downstream cluster chain is electron transfer in the plain
      sense of the term, and the machinery for it - the flavin site and the four N3
      cysteines - is intact in every member of the fetched slice. Safe at family level,
      and absent from both the current PAINT curation and the human NDUFV1 GOA record;
      the NDUFV1 review proposes it as a new annotation.
  - assessed_term:
      id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
    scope: FAMILY_WIDE
    scope_reason: >-
      All four ligands of cluster N3 are structurally observed in the human protein and
      invariant across the bacterial, fungal, plant, amoebozoan and animal members
      checked (see the fe4s_n3_ligands site). This is the one iron-sulfur assertion in the
      complex I core that rests on direct structural evidence rather than on fold
      similarity, and it should not be confused with the by-similarity cysteines annotated
      on PTHR11993.
  - assessed_term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    scope: UNRESOLVED
    scope_reason: >-
      Correct for the eukaryotic members and for the ubiquinone-using bacteria, wrong for
      the actinobacterial members of the same single subfamily: Mycobacterium tuberculosis
      NuoF (P9WIV6, P9WIV7), M. bovis NuoF (P65568) and Streptomyces coelicolor NuoF
      (Q9XAQ9) belong to organisms whose respiratory chain uses menaquinone rather than
      ubiquinone. Recorded as UNRESOLVED rather than SUBFAMILY_ONLY because PTHR11780 has
      only one populated subfamily, so the subfamily axis cannot express the boundary and
      scoping must be done by clade or by taxon. The existing PAINT curation already avoids
      the trap by asserting the acceptor-neutral GO:0003954 on the bacterial node instead;
      that choice should be preserved if the molecular-function assertion is ever raised
      to the family root.
  - assessed_term:
      id: GO:0045271
      label: respiratory chain complex I
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member of the fetched slice is a subunit of a complex I / NDH-1 holoenzyme,
      and PAINT already asserts the term separately on the eukaryotic and bacterial nodes.
      The reason this family is coherent where its Q-module partner is not is structural:
      the plastid NAD(P)H dehydrogenase complex has no counterpart of this subunit, so
      there is no photosynthetic clade here to keep the term away from. PTHR11993 contains
      134 chloroplastic NdhH proteins in its equivalent subfamily; the corresponding
      slice of PTHR11780 contains none.

