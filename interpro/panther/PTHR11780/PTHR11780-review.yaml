      The only subfamily populated in the fetched slice, and it holds every member of it -
      bacterial NuoF and Nqo1 as well as the mitochondrial NDUFV1 orthologues the name
      refers to. As with PTHR11993:SF10, the official name is the name of one group inside
      the subfamily rather than a description of its contents, and most members are in
      fact bacterial; it should not be read as evidence that a member is mitochondrial.
