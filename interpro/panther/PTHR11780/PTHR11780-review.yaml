family_id: PANTHER:PTHR11780
family_name: NADH-UBIQUINONE OXIDOREDUCTASE FLAVOPROTEIN 1  NDUFV1
preferred_name: >-
  Complex I / NDH-1 51 kDa flavoprotein subunit family (bacterial NuoF / Nqo1,
  mitochondrial NDUFV1)
summary: >-
  The NADH-oxidising flavoprotein of the proton-pumping NADH:quinone oxidoreductases:
  bacterial NuoF (Nqo1 in Paracoccus) and mitochondrial NDUFV1. It sits at the
  matrix-facing tip of the peripheral arm, binds one non-covalently bound FMN and one
  [4Fe-4S] cluster (N3), and is where the whole enzyme begins: NADH docks on a
  glycine-rich loop, transfers a hydride to FMN, and the reduced flavin passes electrons
  one at a time to N3 and onward down the iron-sulfur wire to the quinone chamber built
  by the 49 kDa subunit family (PANTHER:PTHR11993). The reduced flavin is also the
  principal site at which complex I leaks electrons to oxygen, so this subunit carries
  the enzyme's superoxide chemistry as well as its productive chemistry. The family is
  strikingly uniform: in the fetched slice, alphaproteobacterial, actinobacterial,
  fungal, plant, amoebozoan and animal members all carry the same four N3 cysteine
  ligands and the same NADH-binding glycine loop, and there is no organellar or
  photosynthetic branch - the plastid NDH complex has no counterpart of this subunit at
  all, which is precisely why that complex is reduced by ferredoxin rather than by NADH.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member of the fetched slice is the NADH-oxidising flavoprotein module of an
  NDH-1 or mitochondrial complex I, in a single subfamily (PTHR11780:SF10), and the
  functionally decisive residues are invariant across the whole span from Escherichia
  coli to human. The identified exception concerns acceptor specificity rather than the
  subunit's own chemistry: the actinobacterial members in the slice (Mycobacterium
  tuberculosis and M. bovis NuoF, Streptomyces coelicolor NuoF) belong to organisms
  whose respiratory chain uses menaquinone rather than ubiquinone, so the acceptor-named
  complex-level term GO:0008137 is not safe family-wide even though the NADH-dehydrogenase
  chemistry is. A second, weaker caveat: the fetched entries file is a 29-protein
  reviewed slice of roughly 14,700 members, and the same NADH-oxidising module occurs
  outside complex I in some bacterial NAD(P)-reducing enzymes, so uniformity is asserted
  for the characterised core rather than verified across every member.
