review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Written alongside the human NDUFV1 gene review, and deliberately as a companion to
  PTHR11993 (the 49 kDa quinone-chamber subunit): the two families are the opposite ends
  of the same peripheral arm, and reading them together is what makes several of the
  judgements here checkable. All node ids, GO ids, seeds, taxa and snapshot dates are
  verbatim from the cached PTHR11780-paint.tsv; subfamily id and name are verbatim from
  panther.obo; member composition is from the fetched PTHR11780-entries.csv (29 reviewed
  proteins, all PTHR11780:SF10, no chloroplastic members).

  On the project's central question, this family gives a sharper answer than PTHR11993
  does. Human NDUFV1 does receive IBAs - GO:0045271 and GO:0006120, matching the two IBDs
  at the eukaryotic node PTN000207233 - but it receives no molecular-function IBA of any
  kind, because the eukaryotic node carries no F-aspect IBD. The family's only F-aspect
  IBD, GO:0003954, sits on the bacterial node PTN000207323 seeded by E. coli NuoF, and
  human NDUFV1 is not a descendant of it. The result is that the defining functions of the
  51 kDa flavoprotein - NADH dehydrogenase activity, FMN binding, NAD binding, electron
  transfer activity - reach the human protein only as InterPro2GO and keyword-derived IEAs,
  with no phylogenetic assertion behind any of them, even though they are conserved from
  E. coli to human and are what the family is named for. Raising GO:0003954 (and, on the
  strength of the invariant sites, GO:0010181, GO:0051287 and GO:0009055) to a node above
  the bacteria/eukaryote split would be sound; raising GO:0008137 would not, because of the
  menaquinone-using actinobacterial members.

  Residue positions come from the P49821 UniProt feature table. The cross-species positions
  quoted in the site description and controls were obtained by global BLOSUM62 alignment of
  P49821 against the fetched UniProt sequences of P25708, P31979, Q9FNN5, O94500 and
  Q54I90, and each control position was confirmed by direct indexing of the fetched
  sequence. The glycine-rich NADH loop is deliberately described in prose rather than
  declared as a motif site: it is GRGGAG in every member checked except S. pombe O94500,
  which carries GRGRYG, so a family-wide motif assertion would over-claim.
