family_id: PANTHER:PTHR30031
family_name: PHOSPHOENOLPYRUVATE CARBOXYKINASE  ATP
preferred_name: ATP-dependent phosphoenolpyruvate carboxykinase (PckA/PCK1) family
summary: >-
  ATP-dependent PEP carboxykinases decarboxylate and phosphorylate oxaloacetate to PEP, the committed
  gluconeogenic step in bacteria, fungi (S. cerevisiae PCK1) and plants. Animal GTP-dependent PEPCK
  is unrelated.
functional_coherence: COHERENT
coherence_reason: All subfamilies are ATP-PEPCKs.
