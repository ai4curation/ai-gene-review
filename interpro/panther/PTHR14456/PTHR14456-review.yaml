family_id: PANTHER:PTHR14456
family_name: INOSITOL POLYPHOSPHATE KINASE 1
preferred_name: Inositol-pentakisphosphate 2-kinase (IPK1/IPPK) family
summary: >-
  IPK1 phosphorylates the 2-position of inositol 1,3,4,5,6-pentakisphosphate to make phytic acid
  (IP6), the precursor of inositol pyrophosphates (S. cerevisiae IPK1, S. pombe ipk1, plant IPK1,
  human IPPK).
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF2) of IP5 2-kinases.
