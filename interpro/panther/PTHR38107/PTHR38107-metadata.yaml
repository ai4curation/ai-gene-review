  name:
    name: Bacteriophage Glycosyl Hydrolase 24
    short: Bacteriophage_GH24
  description:
  - text: The glycosyl hydrolase 24 family proteins are endolysins with lysozyme activity
      that degrade bacterial cell walls by hydrolyzing peptidoglycans. They play a
      crucial role in bacteriophage-mediated lysis of host cells. These proteins,
      along with holin, spanin, and sometimes pinholin proteins, participate in a
      sequential process leading to programmed host cell lysis, which facilitates
      the release of mature viral particles. Some members of this family are SAR-endolysins,
      which are tethered to the membrane by a signal-anchor sequence and released
      into the periplasm by the action of holin or pinholin, where they execute their
      lytic function.
