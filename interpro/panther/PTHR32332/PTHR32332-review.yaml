family_id: PANTHER:PTHR32332
family_name: 2-NITROPROPANE DIOXYGENASE
preferred_name: >-
  FMN-dependent TIM-barrel oxidoreductases (nitronate monooxygenase fold), including the FabK enoyl-ACP
  reductases
summary: >-
  A fold-level family of FMN-binding TIM-barrel oxidoreductases. The small SwissProt inventory spans a
  polyunsaturated-fatty-acid synthase subunit, fungal nitronate monooxygenases, a mycobacterial monooxygenase
  and the P. aeruginosa NADH:quinone reductase PA1024, and the family also receives the streptococcal
  FabK enoyl-ACP reductases through UniProt's PANTHER cross-reference. Membership therefore supports FMN-dependent
  oxidoreductase chemistry and nothing more specific: FabK's structure is explicitly similar to 2-nitropropane
  dioxygenase, and FabK-related flavoproteins of S. aureus and B. subtilis were shown not to be enoyl-ACP
  reductases at all.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared feature is an FMN-containing TIM barrel that performs hydride or oxygen chemistry; the reactions
  differ completely - enoyl-ACP reduction (FabK), alkyl nitronate oxidation (nitronate monooxygenases),
  quinone reduction (PA1024) and a polyketide/PUFA synthase enoyl-reductase domain. One subfamily even
  carries a transcription-factor node restricted to fungi.
reference_protein:
  id: UniProtKB:Q8DR17
  label: Probable nitronate monooxygenase
  gene_symbol: fabK
  organism: Streptococcus pneumoniae R6
  gene_review: genes/STRR6/fabK/fabK-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR32332:SF20
  label: 2-NITROPROPANE DIOXYGENASE-LIKE PROTEIN
  description: >-
    The largest subfamily of the local inventory (4 of 7 members) and the one that UniProt's cross-reference
    assigns the streptococcal FabK enoyl-ACP reductases to. It also holds the P. aeruginosa NADH:quinone
    reductase PA1024, which seeds the family's generic oxidoreductase node, and a Thraustochytrium PUFA
    synthase subunit. Enoyl-ACP reductase activity rests on the characterized exemplars, not on membership
    of this subfamily.
  representative_members:
  - id: UniProtKB:Q9I4V0
    gene_symbol: PA1024
    organism: Pseudomonas aeruginosa PAO1
    gene_review: genes/PSEAE/PA1024/PA1024-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: file:interpro/panther/PTHR32332/PTHR32332-entries.csv
    supporting_text: Q9I4V0,NADH:quinone reductase,protein,208964,Pseudomonas aer
- subfamily_id: PANTHER:PTHR32332:SF34
  label: 2-NITROPROPANE DIOXYGENASE FAMILY, PUTATIVE-RELATED
  description: >-
    Fungal nitronate monooxygenases, including Metarhizium npaC, which act on alkyl nitronates such as
    propionate 3-nitronate. This is the activity that the InterPro-based GO mapping transfers to every
    member of the fold, including FabK.
  representative_members:
  - id: UniProtKB:E9F689
    gene_symbol: npaC
    organism: Metarhizium robertsii
  diverged_from_family: true
  divergence_description: >-
    Genuine nitronate monooxygenases: oxygen-dependent oxidative denitrification of alkyl nitronates,
    unrelated to the enoyl reduction of fatty-acid synthesis.
  supported_by:
  - reference_id: file:interpro/panther/PTHR32332/PTHR32332-entries.csv
    supporting_text: E9F689,Nitronate monooxygenase npaC,protein,655844,Metarhizi
node_assessments:
- node_id: PANTHER:PTN002844975
  asserted_term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence: IBD
  paint_snapshot: '20260529'
  seeds:
  - id: UniProtKB:Q9I4V0
    gene_symbol: PA1024
    organism: Pseudomonas aeruginosa PAO1
    gene_review: genes/PSEAE/PA1024/PA1024-ai-review.yaml
  assessment: SOUND
  assessment_reason: >-
    Generic oxidoreductase activity is true of every member of this FMN-binding fold, and the node is
    seeded by the P. aeruginosa NADH:quinone reductase PA1024. It is correct but uninformative: it cannot
    distinguish an enoyl-ACP reductase from a nitronate monooxygenase or a quinone reductase, which is
    exactly why the FabK gene review refines it to the specific reductase term rather than treating it
    as wrong.
  supported_by:
  - reference_id: file:interpro/panther/PTHR32332/PTHR32332-paint.tsv
    supporting_text: "PTHR32332\tPTN002844975\tGO:0016491\tF\tIBD\tfalse"
- node_id: PANTHER:PTN002066809
  asserted_term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence: IBD
  paint_snapshot: '20170228'
  node_taxon:
    id: NCBITaxon:451864
    label: Dikarya
  seeds:
  - id: SGD:S000005907
  assessment: UNRESOLVED
  assessment_reason: >-
    A taxon-restricted node whose single seed is an SGD gene and whose asserted terms (transcription-factor
    activity and response to a xenobiotic stimulus) belong to neither the oxidoreductase chemistry of
    the fold nor any member of the local SwissProt inventory, which contains no protein of that clade.
    Without the members the node covers, its placement cannot be judged here; it has no bearing on the
    FAS-II members, which are in SF20.
  supported_by:
  - reference_id: file:interpro/panther/PTHR32332/PTHR32332-paint.tsv
    supporting_text: "PTHR32332\tPTN002066809\tGO:0003700\tF\tIBD\tfalse"
term_assessments:
- assessed_term:
    id: GO:0016491
    label: oxidoreductase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Shared FMN-dependent hydride and oxygen chemistry across the whole fold, as the root node asserts.
    It is the only molecular-function claim membership supports.
  supported_by:
  - reference_id: file:interpro/panther/PTHR32332/PTHR32332-paint.tsv
    supporting_text: "PTHR32332\tPTN002844975\tGO:0016491\tF\tIBD\tfalse"
  - reference_id: PMID:18305197
    supporting_text: >-
      Each subunit formed a triose phosphate isomerase (TIM) barrel structure, and flavin mononucleotide
      (FMN) was bound as a cofactor in the active site.
- assessed_term:
    id: GO:0004318
    label: enoyl-[acyl-carrier-protein] reductase (NADH) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Established for the streptococcal FabK enzymes that UniProt places in SF20, where the purified protein
    specifically requires NADH, carries one FMN per subunit and is the organism's only enoyl-ACP reductase.
    It must not be read as an SF20-wide claim: the same study showed that FabK-related flavoproteins of
    S. aureus and B. subtilis do not reduce enoyl-ACP, and SF20 also holds a quinone reductase and a PUFA
    synthase subunit. No member of the family is annotated to this term in GOA; it is the module's reading
    of the reviewed FabK exemplar.
  applicable_subfamilies:
  - id: PANTHER:PTHR32332:SF20
    label: 2-NITROPROPANE DIOXYGENASE-LIKE PROTEIN
  supported_by:
  - reference_id: PMID:12487627
    supporting_text: >-
      FabK specifically required NADH and the protein activity was stimulated by ammonium ions.
  - reference_id: PMID:12487627
    supporting_text: >-
      However, the genes did not complement a fabI (Ts) mutant and the purified flavoproteins were unable
      to reduce enoyl-ACP in vitro and did not exhibit NAD(P)H oxidase activity, indicating they were
      not enoyl-ACP reductases.
- assessed_term:
    id: GO:0018580
    label: nitronate monooxygenase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Holds for the fungal nitronate monooxygenases of SF34, which act on alkyl nitronates. It is wrong
    for the FAS-II members: the FabK exemplar has no assayed nitronate activity and its InterPro-derived
    row is removed in the gene review, and the reviewed P. aeruginosa PA1024 (a quinone reductase) removes
    it too.
  applicable_subfamilies:
  - id: PANTHER:PTHR32332:SF34
    label: 2-NITROPROPANE DIOXYGENASE FAMILY, PUTATIVE-RELATED
  supported_by:
  - reference_id: file:interpro/panther/PTHR32332/PTHR32332-entries.csv
    supporting_text: E9F689,Nitronate monooxygenase npaC,protein,655844,Metarhizi
  - reference_id: PMID:18305197
    supporting_text: >-
      The overall structure was similar to the enoyl-ACP reductase (ER) of fungal fatty acid synthase
      and to 2-nitropropane dioxygenase (2-ND) from Pseudomonas aeruginosa
