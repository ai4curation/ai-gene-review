notes: >-
  Reviewed for modules/type_ii_fatty_acid_synthesis.yaml, whose FabK enoyl-reduction variant is grounded
  here. The family term is retained as a fold-level descriptor only: the module's functional claim rests
  on the characterized S. pneumoniae exemplar, not on membership, because the same paper that characterized
  FabK showed its relatives in S. aureus and B. subtilis are not enoyl-ACP reductases. The reference protein
  Q8DR17 is a TrEMBL entry and so is absent from the SwissProt-derived inventory file; its family and
  subfamily come from its own UniProt PANTHER cross-reference (PTHR32332; PTHR32332:SF20). A durable fix
  for the InterPro-derived nitronate monooxygenase annotation on FabK would be a curated rule conditioning
  the IPR004136 mapping on absence of an IPR017569/TIGR03151 match; it is recorded in the gene review
  rather than written here.
