family_id: PANTHER:PTHR19303
family_name: TRANSPOSON
preferred_name: CENP-B and transposon-derived DNA-binding proteins
summary: CENP-B-related proteins illustrate evolutionary recruitment of transposon-derived DNA-binding
  machinery into host chromatin regulation. Pombe Cbh1 binds centromeric repeat DNA, and related pombe
  proteins participate in retrotransposon silencing and genome organization. The broader group also includes
  other domesticated transposon-derived regulators, so centromere binding and active transposition are
  separate hypotheses.
functional_coherence: HETEROGENEOUS
coherence_reason: Direct pombe Cbh1 purification and footprinting establish binding to centromeric K-type
  repeat DNA (PMID:9237993), and CENP-B homolog experiments establish retrotransposon silencing (PMID:18094683).
  The inventory also includes PDC2, Jerky and other transposon-derived host regulators. Shared transposon
  ancestry does not establish active transposition or uniform centromeric DNA specificity; the Cbh1 SF73
  label PDC2 does not override its direct assay.
reference_protein:
  id: UniProtKB:O14423
  gene_symbol: cbh1
  organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
  label: CENP-B homolog protein 1
  gene_review: genes/SCHPO/cbh1/cbh1-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR19303:SF73
  label: PROTEIN PDC2
  description: Direct Cbh1 binding experiments and pombe retrotransposon-surveillance studies support
    host DNA-binding functions, while the inventory includes multiple Tigger-derived and PDC2 proteins.
    Shared ancestry does not establish retained transposase activity. The generated InterPro passage about
    chaetoglobosin synthesis is not used as biological evidence for this family.
