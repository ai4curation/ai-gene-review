  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node covers the ornithine carbamoyltransferase subfamilies (SF1 to SF4) but not the
    SF6 aspartate carbamoyltransferases, and the activity is correct for the anabolic and
    catabolic OTCs alike (the reaction is reversible). Two non-OTC members of SF3 also inherit
    it. E. coli YgeW receives GO:0004585, GO:0006526 and GO:0019240, but the recombinant protein
    shows no transcarbamylase activity with L-ornithine or any other substrate tested.
    Bacteroides thetaiotaomicron ArgF' (Q8A1E9, an N-succinylornithine carbamoyltransferase by
    UniProt name) receives the same three terms. IRDs at the YgeW leaf and the ArgF' branch are
    needed.
  supported_by:
