family_id: PANTHER:PTHR45753
family_name: ORNITHINE CARBAMOYLTRANSFERASE, MITOCHONDRIAL
preferred_name: Ornithine and aspartate carbamoyltransferases (OTC/ArgF/ArgI/ArcB and PyrB)
summary: >-
  Carbamoyltransferases that transfer the carbamoyl group of carbamoyl phosphate to an amino
  group. In PANTHER 19 the family joins two enzyme classes: ornithine carbamoyltransferases
  (OTC, EC 2.1.3.3), which make L-citrulline from L-ornithine in arginine biosynthesis and the
  urea cycle (yeast ARG3, fission yeast arg3, human OTC, bacterial ArgF/ArgI) or run in the
  phosphorolytic direction in the bacterial arginine deiminase pathway (catabolic ArcB); and the
  aspartate carbamoyltransferase catalytic subunits (PyrB, SF6) of de novo pyrimidine synthesis.
  SF3 also contains carbamoyltransferases with other substrates (putrescine
  carbamoyltransferases, N-succinylornithine carbamoyltransferase) and the E. coli YgeW protein,
  which has no detectable transcarbamylase activity.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The carbamoyltransferase fold and carbamoyl-phosphate binding are shared, but the acceptor
  substrate differs. The largest subfamily (SF6, 647 reviewed members) consists of aspartate
  carbamoyltransferases, so ornithine carbamoyltransferase activity is not safe family-wide.
  Among the ornithine subfamilies, biosynthetic (ArgF/ArgI/ARG3/OTC) and catabolic (ArcB)
  enzymes catalyse the same reversible reaction in opposite physiological directions, so process
  terms differ even where the activity is shared. SF3, the subfamily used by the arginine
  biosynthesis module, also holds YgeW, putrescine carbamoyltransferases and an
  N-succinylornithine carbamoyltransferase. Location is lineage-specific: animal OTC and fission
  yeast arg3 are mitochondrial, S. cerevisiae ARG3 is cytosolic.
