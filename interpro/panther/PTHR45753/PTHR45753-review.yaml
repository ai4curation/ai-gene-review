notes: >-
  Node reach was read from the PAINT UniProt GAF. PTN000150222 (cytoplasm) and PTN000150223
  (CPS terms) reach carbamoyl-phosphate synthases classified in PTHR11405 in PANTHER 19 as well
  as PyrB members of this family, so the PAINT tree for those rows spans both PANTHER families.
  PTN000150426 (GO:0043231, Eukaryota) reaches eukaryotic OTCs only. Subfamily assignments come
  from the InterPro member list (entries.csv). The fission yeast arg3 and human OTC reviews
  accept the mitochondrion IBA, and the ARG3 review removes it, consistent with this review.
  Putrescine carbamoyltransferases in SF3 (Enterococcus, Lactobacillus, Listeria PtcA) are not
  reference-proteome proteins and do not appear in the PAINT GAF, but they would inherit the OTC
  terms by classification. No residue sites asserted.
