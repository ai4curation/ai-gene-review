  assessment_reason: >-
    All seeds are anabolic OTCs, but the node also covers the catabolic OTCs of the arginine
    deiminase pathway. In the PAINT GAF, P. aeruginosa ArcB (P08308, SF2), Bacillus cereus ArcB
    (Q81II0, SF1), Streptococcus pneumoniae ArcB (P65608, SF1) and other catabolic ArcB proteins
