family_id: PANTHER:PTHR33529
family_name: SLR0882 PROTEIN-RELATED
preferred_name: LptF/LptG permease family (LptFG, YjgP/YjgQ)
summary: LptF and LptG are paralogous membrane subunits of characterized LptB2FG lipid-extraction assemblies.
  In LPS-producing diderms, their transmembrane cavity and periplasmic beta-jellyroll domains couple an
  LptB motor to LPS extraction and bridge delivery. F and G supply distinct contributions and are not
  interchangeable merely because they share a family. The family also includes homologs from non-LPS-producing
  organisms, so native cargo must be established separately.
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'SF7 and SF2 distinguish the named LptF and LptG groups in the reviewed E. coli and
  KT2440 proteins, but are not restricted to Gammaproteobacteria: both include Neisseria, and SF2 also
  includes Deinococcus DR_1075/Q9RVF4. SF6/SF8 contain additional mixed lineages. Conserved architecture
  supports lipid-extraction machinery, not universal LPS cargo or interchangeability of F and G.'
