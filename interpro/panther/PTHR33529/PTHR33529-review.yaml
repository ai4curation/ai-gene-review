term_assessments:
- assessed_term:
    id: GO:0140332
    label: lipopolysaccharide transfer activity
  scope: UNRESOLVED
  scope_reason: E. coli structural/functional work and PAO1-LAC comparative structures support LptF/LptG
    contributions to LPS extraction/transfer; KT2440 members have role-specific family/domain evidence.
    Universal cargo is unresolved because the family includes non-LPS-context homologs, including Deinococcus
    Q9RVF4 in SF2 as well as SF6 proteins. No existing F/G subfamily safely removes all uncertainty. Require
    distinct positive F and G roles, LPS/LOS availability and compatible LptB/C partners; absence of an
    IRD is not a universal substrate assay. This is not evidence that all lipid transport or the ancestral
    LPS role has been lost.
  supported_by:
  - reference_id: PMID:30894744
    supporting_text: LptB2FGC captures LPS from the membrane outer leaflet, using a large outward-open
      cavity.
