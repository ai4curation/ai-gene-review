  assessment_reason: >-
    The node is the duplication that produced the LptF and LptG paralogues, so placing the
    term here gives it to both, which matches the E. coli seeds. Most descendants are from
    LPS-bearing diderms. The Deinococcus radiodurans and Klebsormidium nitens members lack a
    classical LPS pathway and are untested; there is no evidence of loss to justify an IRD.
