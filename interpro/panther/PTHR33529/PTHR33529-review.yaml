family_id: PANTHER:PTHR33529
family_name: SLR0882 PROTEIN-RELATED
preferred_name: LptF/LptG permease family (LptFG, YjgP/YjgQ)
summary: >-
  This family contains LptF and LptG, the two paralogous transmembrane subunits of the
  LptB2FG ATP-binding cassette transporter that extracts lipopolysaccharide (LPS) from the
  outer leaflet of the inner membrane of diderm bacteria. LptF and LptG each have six
  transmembrane helices and a periplasmic beta-jellyroll domain; together they form a
  V-shaped cavity that LPS enters laterally from the membrane, and ATP hydrolysis by the
  cytoplasmic LptB dimer drives LPS out of the cavity into the LptC/LptA/LptD bridge. Both
  proteins are essential in Escherichia coli, where they were identified as the missing
  transmembrane components of the Lpt transporter (formerly YjgP and YjgQ). PANTHER
  separates the gammaproteobacterial LptF (SF7) and LptG (SF2) subfamilies from SF6 and
  SF8, which hold both paralogues from other phyla. The family name is taken from the
  Synechocystis member Slr0882.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member is an LptF- or LptG-type permease. SF7 and SF2 split by paralogue; SF6 and
  SF8 mix both paralogues from non-gammaproteobacterial lineages (Geobacter LptF and LptG,
  Bradyrhizobium LptF, Chlamydia, cyanobacteria, Bacteroides) and also include homologues
  from diderms without canonical LPS (Deinococcus radiodurans) and from Klebsormidium
  nitens, whose substrate is unknown.
