family_id: PANTHER:PTHR46106
family_name: IA-2 PROTEIN TYROSINE PHOSPHATASE, ISOFORM C
summary: IA-2/PTPRN-related proteins are secretory-vesicle membrane proteins with phosphatase-like intracellular
  domains. Their conserved roles concern vesicle abundance and secretion, with catalytic claims requiring
  attention to substrate and assay conditions.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Primary experiments distinguish phosphoprotein substrates from phosphoinositides. Rat
  phogrin/PTPRN2 has low lipid activity as an isolated catalytic-domain fusion but substantially greater
  activity in the purified transmembrane form, with catalytic-cysteine and antibody controls. Human breast-cancer
  experiments connect PTPRN2 to membrane PI(4,5)P2 and actin regulation. These data do not restore conventional
  protein-tyrosine phosphatase activity or establish the same substrate activity in the horse product
  with an altered distal domain.
subfamilies:
