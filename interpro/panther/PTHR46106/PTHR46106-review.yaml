term_assessments:
- assessed_term:
    id: GO:0006470
    label: protein dephosphorylation
  scope: UNRESOLVED
  scope_reason: A phosphatase-like fold does not establish protein dephosphorylation. The primary phogrin
    lipid-substrate assays and human membrane-PI(4,5)P2 experiments address a distinct substrate class,
    so they cannot validate a protein-phosphatase annotation. Conversely, protein-phosphatase impairment
    cannot be used to deny all enzymatic activity. The altered horse C-terminal domain creates a further
    exact-product transfer limit.
  supported_by:
  - reference_id: PMID:26620550
    supporting_text: PTPRN2 belongs to the protein tyrosine phosphatase family, but does not exhibit activity
      against phosphoprotein substrates due to several critical amino acid variations in the PTP domain
      (Magistrelli et al, 1996).
  - reference_id: PMID:26620550
    supporting_text: As a transmembrane protein, PTPRN2 shuttles between secretory vesicles and the plasma
      membrane.
  - reference_id: file:genes/HORSE/PTPRN2/PTPRN2-bioinformatics/RESULTS.md
    supporting_text: The selected horse sequence has a divergent C-terminal region, including deletion
      of human residues 989–1003 within the annotated phosphatase domain. The N-terminal signal sequence
      and transmembrane segment are retained. Substrate-specific enzymatic activity requires more than
      the global homology assignment.
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR46106-evidence.md
    supporting_text: Plays a role in vesicle-mediated secretory processes. Required for normal accumulation
      of secretory vesicles in hippocampus, pituitary and pancreatic islets. Required for the accumulation
      of normal levels of insulin-containing vesicles and preventing their degradation. Plays a role in
      insulin secretion in response to glucose stimuli. Required for normal accumulation of the neurotransmitters
      norepinephrine, dopamine and serotonin in the brain. In females, but not in males, required for
      normal accumulation and secretion of pituitary hormones, such as luteinizing hormone (LH) and follicle-stimulating
      hormone (FSH) (By similarity). Required to maintain normal levels of renin expression and renin
      release (By similarity). May regulate catalytic active protein-tyrosine phosphatases such as PTPRA
      through dimerization (By similarity). Has phosphatidylinositol phosphatase activity; the PIPase
      activity is involved in its ability to regulate insulin secretion. Can dephosphorylate phosphatidylinositol
      4,5-biphosphate (PI(4,5)P2), phosphatidylinositol 5-phosphate and phosphatidylinositol 3-phosphate
      (By similarity). Regulates PI(4,5)P2 level in the plasma membrane and localization of cofilin at
      the plasma membrane and thus is indirectly involved in regulation of actin dynamics related to cell
      migration and metastasis; upon hydrolysis of PI(4,5)P2 cofilin is released from the plasma membrane
      and acts in the cytoplasm in severing F-actin filaments (PubMed:26620550)
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR46106-evidence.md
    supporting_text: Has no tyrosine-protein phosphatase activity at mild acidic conditions (pH 5.5).
      The in vivo relevance of the low PPase activity at acidic conditions (pH 4.5) is questioned. This
      catalytic activity seems to be affected by the replacement of a highly conserved residue in the
      tyrosine-protein phosphatase domain
  - reference_id: PMID:20097759
    supporting_text: 'The PIPase activity of phogrin

      depended on the catalytic site cysteine and correlated with effects on

      glucose-stimulated insulin secretion.'
