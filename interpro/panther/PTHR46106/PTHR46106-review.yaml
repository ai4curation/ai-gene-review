review_status: COMPLETE
reviewed_by: codex
review_date: '2026-09-10'
notes: The 2010 biochemical constructs are rat phogrin, explicitly identified in the methods. Purified
  transmembrane protein was assayed at pH 7.0, so those lipid-substrate data are distinct from reports
  of weak protein-phosphatase activity under acidic conditions. The study controls for contamination through
  the C934S mutant and anti-phogrin antibody inhibition. Human PTPRN2 cellular evidence complements this
  ortholog biochemistry; neither is a direct assay of horse A0A9L0T4W6. The selected horse sequence lacks
  the region corresponding to human 989–1003 within the phosphatase-like domain.
