  description:
  - text: The PiggyBac transposable element-derived protein family is involved in
      DNA damage repair and gene expression regulation. Members of the family can
      bind to PGBD3-related transposable elements known as MER85s, which are non-autonomous
      140 bp elements with PGBD3 terminal inverted repeats and no internal transposase
      ORF. One family member, the chimeric ERCC6-PGBD3 protein, is implicated in DNA
      repair post-UV irradiation and can function independently or synergistically
      with ERCC6. It also regulates gene expression, inducing interferon-like antiviral
      responses in the absence of ERCC6, and controls metabolism-related genes in
      its presence. The family plays a role in the cellular response to DNA damage
      and the fine-tuning of gene expression under different conditions.
