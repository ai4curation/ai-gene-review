  name:
    name: Arabidopsis Inactive Receptor-like Kinases
    short: At_inactive_RLKs
  description:
  - text: The protein family is characterized by members that are receptor-like kinases,
      predominantly predicted to be catalytically inactive. They are involved in various
      plant processes, including early zygote development, effector-triggered immunity,
      recognition of growth-promoting fungi, and secondary cell wall formation in
      vascular tissues. Some members are essential for resistance against pathogens
      like Pseudomonas syringae. The family includes proteins with domains for calmodulin
      binding, G protein signaling, and leucine-rich repeats, indicating a role in
      signal transduction and cellular communication.
