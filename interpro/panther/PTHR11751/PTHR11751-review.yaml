family_id: PANTHER:PTHR11751
family_name: ALANINE AMINOTRANSFERASE
preferred_name: Alanine aminotransferases (class I PLP-dependent alanine/glutamate-glyoxylate transaminases)
summary: >-
  PLP-dependent fold-type I aminotransferases that interconvert L-alanine plus 2-oxoglutarate
  with pyruvate plus L-glutamate (EC 2.6.1.2). The family holds the fungal mitochondrial
  enzymes (S. cerevisiae ALT1 and its paralogue ALT2, S. pombe alt1) together with plant
  mitochondrial AlaATs in SF29, the vertebrate cytosolic GPT (SF308) and mitochondrial GPT2
  (SF311), and the plant peroxisomal glutamate:glyoxylate aminotransferases GGAT1/GGAT2
  (SF472/SF373), which carry additional glyoxylate-transaminase activities.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Alanine transaminase activity is the shared reaction and is experimentally established
  for S. cerevisiae Alt1 and for plant members that seed the PAINT node. Two kinds of
  divergence exist. (1) The S. cerevisiae paralogue Alt2 (SF29, same subfamily as Alt1) is
  catalytically inert despite 65% identity, so loss of function is not marked by subfamily.
  (2) The plant GGATs (SF373, SF472) use glyoxylate as amino acceptor in photorespiration;
  their glyoxylate-transaminase terms are subfamily-restricted. Subcellular location also
  differs across members (fungal and plant SF29 and human GPT2 mitochondrial, human GPT
  cytosolic, plant GGATs peroxisomal), so no location is family-wide.
subfamilies:
- subfamily_id: PANTHER:PTHR11751:SF29
  label: ALANINE TRANSAMINASE
  description: >-
    Fungal and plant mitochondrial alanine aminotransferases: S. cerevisiae ALT1 (active,
    mitochondrial) and ALT2 (inactive paralogue), S. pombe alt1, Arabidopsis ALAAT1 and
    ALAAT2. This is the subfamily the aspartate_asparagine_metabolism module draws its
    fungal representatives from.
  representative_members:
  - id: UniProtKB:P52893
    label: Alanine aminotransferase, mitochondrial
    gene_symbol: ALT1
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/ALT1/ALT1-ai-review.yaml
  - id: UniProtKB:Q10334
    label: Putative alanine aminotransferase
    gene_symbol: alt1
    organism: Schizosaccharomyces pombe
    gene_review: genes/SCHPO/alt1/alt1-ai-review.yaml
  - id: UniProtKB:P52892
    label: Inactive alanine aminotransferase
    gene_symbol: ALT2
    organism: Saccharomyces cerevisiae
  diverged_from_family: false
  supported_by:
  - reference_id: file:interpro/panther/PTHR11751/PTHR11751-entries.csv
    supporting_text: P52892,Inactive alanine aminotransferase,protein,559292
- subfamily_id: PANTHER:PTHR11751:SF308
  label: ALANINE AMINOTRANSFERASE 1
  description: Vertebrate cytosolic alanine aminotransferase 1 (GPT).
  representative_members:
  - id: UniProtKB:P24298
    label: Alanine aminotransferase 1
    gene_symbol: GPT
    organism: Homo sapiens
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR11751:SF311
  label: ALANINE AMINOTRANSFERASE 2
  description: Vertebrate mitochondrial alanine aminotransferase 2 (GPT2).
  representative_members:
  - id: UniProtKB:Q8TD30
    label: Alanine aminotransferase 2
    gene_symbol: GPT2
    organism: Homo sapiens
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR11751:SF472
  label: GLUTAMATE--GLYOXYLATE AMINOTRANSFERASE 1
  description: >-
    Plant peroxisomal glutamate:glyoxylate aminotransferase 1 (GGAT1/AOAT1), a PAINT seed for
    both the alanine-transaminase and the glyoxylate-transaminase nodes.
  representative_members:
  - id: UniProtKB:Q9LR30
    label: Glutamate--glyoxylate aminotransferase 1
    gene_symbol: GGAT1
    organism: Arabidopsis thaliana
  diverged_from_family: true
  divergence_description: >-
    Uses glyoxylate as amino acceptor (glutamate:glyoxylate and alanine:glyoxylate
    transamination) in photorespiration, in addition to the alanine:2-oxoglutarate reaction.
- subfamily_id: PANTHER:PTHR11751:SF373
  label: GLUTAMATE--GLYOXYLATE AMINOTRANSFERASE 2
  description: Plant glutamate:glyoxylate aminotransferase 2 (GGAT2).
  representative_members:
  - id: UniProtKB:Q9S7E9
    label: Glutamate--glyoxylate aminotransferase 2
    gene_symbol: GGAT2
    organism: Arabidopsis thaliana
  diverged_from_family: true
  divergence_description: >-
    Glyoxylate-accepting paralogue of GGAT1 in plants; same added activities.
term_assessments:
- assessed_term:
    id: GO:0004021
    label: L-alanine:2-oxoglutarate transaminase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The module's core activity for this family. Experimentally shown for S. cerevisiae Alt1
    (sole alanine-synthesising and alanine-catabolising transaminase under respiration) and
    asserted by PAINT at PTN002272157 from Arabidopsis ALAAT1/ALAAT2/GGAT1 and kinetoplastid
    seeds. PTN002272157 does not reach the fungal (ALT1, ALT2, alt1) or human (GPT, GPT2)
    members in the current PAINT GAF, so the yeast enzymes have no IBA for this term; that is
    a coverage gap, not evidence against the function. Alt2 is the one documented exception.
  member_exceptions:
  - member:
      id: UniProtKB:P52892
      label: Inactive alanine aminotransferase
      gene_symbol: ALT2
      organism: Saccharomyces cerevisiae
    exception_reason: >-
      Whole-genome-duplication paralogue of ALT1 in the same subfamily (SF29). Purified Alt2
      binds PLP but has no alanine transaminase activity and does not bind alanine.
    supported_by:
    - reference_id: PMID:23049841
      supporting_text: contrast ALT2 encodes a catalytically inert protein.
    - reference_id: PMID:29867852
      supporting_text: Conversely, ScAlt2 protein has completely lost its role in alanine metabolism
  supported_by:
  - reference_id: PMID:19396236
    supporting_text: under respiratory conditions, Alt1p constitutes the sole pathway for alanine
      biosynthesis and catabolism
  - reference_id: PMID:29867852
    supporting_text: ScAlt1 Displays a Kinetic Ping-Pong Mechanism Typical of Transaminases
  - reference_id: file:yeast/ALT1/ALT1-uniprot.txt
    supporting_text: Reaction=L-alanine + 2-oxoglutarate = pyruvate + L-glutamate;
- assessed_term:
    id: GO:0008453
    label: L-alanine:glyoxylate transaminase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Asserted by PAINT at PTN000746640 (Viridiplantae) from the two Arabidopsis GGATs only. The
    glyoxylate-accepting activity is a plant photorespiratory specialisation and must not be
    extended to the fungal or vertebrate alanine aminotransferases.
  applicable_subfamilies:
  - id: PANTHER:PTHR11751:SF472
    label: GLUTAMATE--GLYOXYLATE AMINOTRANSFERASE 1
  - id: PANTHER:PTHR11751:SF373
    label: GLUTAMATE--GLYOXYLATE AMINOTRANSFERASE 2
  supported_by:
  - reference_id: file:interpro/panther/PTHR11751/PTHR11751-entries.csv
    supporting_text: Q9LR30,Glutamate--glyoxylate aminotransferase 1,protein,3702
- assessed_term:
    id: GO:0047958
    label: glycine:2-oxoglutarate transaminase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Same plant-only PAINT node (PTN000746640) and same reasoning as alanine-glyoxylate
    transaminase: a GGAT activity, not a property of alanine aminotransferases generally.
  applicable_subfamilies:
  - id: PANTHER:PTHR11751:SF472
    label: GLUTAMATE--GLYOXYLATE AMINOTRANSFERASE 1
  - id: PANTHER:PTHR11751:SF373
    label: GLUTAMATE--GLYOXYLATE AMINOTRANSFERASE 2
  supported_by:
  - reference_id: file:interpro/panther/PTHR11751/PTHR11751-entries.csv
    supporting_text: Q9S7E9,Glutamate--glyoxylate aminotransferase 2,protein,3702
