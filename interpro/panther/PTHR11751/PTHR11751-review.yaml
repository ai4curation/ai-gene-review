  assessment: SOUND
  assessment_reason: >-
    The function is correct for the descendants that receive it (185 IBA rows, mostly plants;
    reviewed recipients are Arabidopsis ALAAT1, ALAAT2, GGAT1 and GGAT2). The node does not
    cover the fungal SF29 members or human GPT/GPT2, which receive no IBA for this term, so
    the inactive yeast Alt2 is not affected by this node. No pruning is needed; the only
    observation is that coverage is narrower than the family.
