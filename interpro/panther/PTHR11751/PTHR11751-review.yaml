notes: >-
  Used by modules/aspartate_asparagine_metabolism.yaml (alanine_aminotransferase_activity
  annoton, family-level id). The module's representatives (ALT1, alt1, GPT, GPT2) and its
  statement that ALT2 is in the same subfamily but inactive are consistent with the entries
  inventory and with PMID:23049841. The S. pombe alt1 gene review is still a stub. PANTHER
