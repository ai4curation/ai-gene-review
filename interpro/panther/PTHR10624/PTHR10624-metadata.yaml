  name:
    name: Ly6/PLAUR domain-containing receptor
    short: Ly6/PLAUR_receptor
  description:
  - text: The Ly6/PLAUR domain-containing protein family is involved in various cellular
      processes, including cell migration and matrix interactions. Members of this
      family act as receptors for urokinase plasminogen activator (U-PA), playing
      a crucial role in localizing and promoting plasmin formation, which is essential
      for proteolytic activities in tissue remodeling and cell migration. The family
      mediates proteolysis-independent signal transduction activation effects of U-PA.
      Some members are implicated in tumor progression and may participate in urothelial
      cell-matrix interactions. Additionally, certain proteins within this family
      are subject to negative-feedback regulation by U-PA, which can cleave the receptor
      into an inactive form, thereby modulating its activity.
