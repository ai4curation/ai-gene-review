  description:
  - text: This family of proteins includes adapters for the cul3 E3 ubiquitin-protein
      ligase complex, playing a role in ubiquitination and degradation of specific
      targets. Members are involved in various cellular processes such as neurogenesis,
      neuronal development, muscle formation, and mesenchymal differentiation. They
      can regulate dendritic field orientation in the sensory cortex and may influence
      the expression levels and subnuclear distribution of other proteins. Some act
      to promote myogenic differentiation while suppressing adipogenesis, and others
      are involved in the nuclear export and degradation of specific transcription
      factors.
