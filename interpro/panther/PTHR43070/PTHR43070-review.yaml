notes: >-
  Used by modules/bacterial_aspartate_to_threonine_biosynthesis.yaml for the E. coli
  aspartokinase and homoserine dehydrogenase steps, grounded at PANTHER:PTHR43070:SF3 for
  both ThrA (P00561) and MetL (P00562). The two PANTHER sources disagree for MetL: UniProt's
  cross-reference gives PTHR43070:SF3, PANTHER 19.0's per-organism classification gives
  PTHR21499:SF29 (BIFUNCTIONAL ASPARTOKINASE_HOMOSERINE DEHYDROGENASE 2), the aspartokinase
  tree from which MetL takes its PTN000487132 IBAs. The module follows the full-length AK+HDH
  architecture, which MetL shares with ThrA (SF3 in both sources); this is recorded as a
  curated row in interpro/panther/panther-members-overrides.tsv. MetL is not listed as an SF3
  representative above because PANTHER's own classification does not place it there. The
  official family name is "FAMILY NOT NAMED". The carrot and maize AK-HSDHs (and Arabidopsis
  AKHSDH1, which PANTHER's per-organism file puts in SF6) carry no subfamily in the reviewed
  inventory CSV; plant subfamilies SF7-SF9 are not assessed separately. The S. pombe hom6 gene
  review is still DRAFT.
