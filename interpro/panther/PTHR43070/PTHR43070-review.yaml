    id: GO:0009090
    label: L-homoserine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member catalyses the homoserine-forming reduction; asserted at both the eukaryotic
    and the ThrA node and accepted by all reviewed member genes.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43070/PTHR43070-paint.tsv
    supporting_text: "PTHR43070\tPTN000487079\tGO:0009090\tP\tIBD\tfalse\tCGD:CAL0000188452|SGD:S000003900"
- assessed_term:
    id: GO:0009067
    label: aspartate family amino acid biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    True for every member, but its informativeness depends on architecture. The GO
    definition covers formation of L-aspartate or any amino acid synthesised from it
    (asparagine, lysine, methionine, threonine, isoleucine). A bifunctional AK-HSDH acts on
    both sides of the lysine/homoserine branch point, so the term matches its scope and the
    Arabidopsis reviews accept it; a monofunctional fungal HDH acts only on the homoserine
    side, so the yeast and S. pombe reviews refine it to homoserine, threonine and methionine
    biosynthesis.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43070/PTHR43070-paint.tsv
    supporting_text: "PTHR43070\tPTN000487079\tGO:0009067\tP\tIBD\tfalse\tAGI_LocusCode:AT1G31230|CGD:CAL0000188452|SGD:S000003900"
