family_id: PANTHER:PTHR43070
family_name: FAMILY NOT NAMED
preferred_name: Bifunctional aspartokinase-homoserine dehydrogenases and fungal-type homoserine dehydrogenases
summary: >-
  Homoserine dehydrogenase (HDH) family that combines two architectures. Gamma-proteobacterial
  (SF3: E. coli ThrA, Haemophilus, Serratia, Buchnera ThrA) and plant (SF5-SF9, e.g.
  Arabidopsis AKHSDH1/2, maize and carrot AK-HSDH) members are bifunctional
  aspartokinase-homoserine dehydrogenases with an N-terminal aspartokinase domain,
  regulatory ACT domains and a C-terminal HDH domain; they catalyse the first and third steps
  of homoserine synthesis. Fungal members of SF5 (S. cerevisiae HOM6, S. pombe hom6,
  Aspergillus and Paracoccidioides HDH) are monofunctional HDHs that lack the kinase domain.
  The shared, family-defining activity is homoserine dehydrogenase. The monofunctional
  bacterial and archaeal Hom enzymes are in the separate family PTHR43331, and monofunctional
  aspartokinases are in PTHR21499.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every reviewed member (16 of 16) is a homoserine dehydrogenase, either monofunctional or
  fused to an aspartokinase. Aspartokinase activity is architecture-dependent: present in
  the bifunctional bacterial and plant members, absent from the fungal HDHs. PAINT reflects
  this split, placing HDH, homoserine biosynthesis and the general aspartate-family process
  at a eukaryotic node and the kinase plus HDH pair at a gamma-proteobacterial ThrA node.
  E. coli MetL, the second bifunctional E. coli isozyme, is classified here by UniProt
  (SF3) but placed by PANTHER's own tree in the aspartokinase family (PTHR21499:SF29).
