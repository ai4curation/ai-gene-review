family_id: PANTHER:PTHR23117
family_name: GUANYLATE KINASE-RELATED
preferred_name: Guanylate kinase family (GUK1, PhnN, GK-domain proteins)
summary: >-
  NMP-kinase-fold proteins related to guanylate kinase. GUK1/Gmk (S. cerevisiae GUK1, bacterial Gmk)
  phosphorylates GMP to GDP. PhnN (SF8) is a ribose 1,5-bisphosphate phosphokinase of phosphonate
  metabolism. Leucine-rich repeat GK-domain proteins such as LRGUK (SF18) use the GK domain for protein
  binding, not catalysis.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  GMP kinase activity is confined to SF13. PhnN phosphorylates a different substrate, and LRGUK has
  a non-catalytic GK domain.
