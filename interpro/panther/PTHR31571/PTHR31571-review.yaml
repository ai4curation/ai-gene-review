family_id: PANTHER:PTHR31571
family_name: ALTERED INHERITANCE OF MITOCHONDRIA PROTEIN 6
preferred_name: Fungal Rtt109/Aim6 family
summary: >-
  PTHR31571 separates the active fungal RTT109/KAT11 histone acetyltransferases
  from divergent AIM6-like branches. The reviewed SF2 RTT109 proteins in S.
  cerevisiae, S. pombe, C. albicans and N. crassa are nuclear H3K56
  acetyltransferases that support replication- and repair-linked chromatin
  responses. The SF1 budding-yeast and C. glabrata AIM6 proteins sit outside
  that active RTT109 node; they are uncharacterized PLC-like
  phosphodiesterase-fold proteins with no demonstrated H3K56 acetyltransferase
  activity, DNA-damage role or nuclear activity. PAINT's three IBD assertions
  at the fungal RTT109 node PANTHER:PTN001586545 are therefore sound for the
  RTT109 branch but are not family-wide PTHR31571 properties.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family contains the active PTHR31571:SF2 RTT109/KAT11 histone
  acetyltransferase branch and separate AIM6-like PTHR31571:SF1 and
  PTHR31571:SF5 branches whose molecular functions are unresolved and which do
  not carry the Rtt109 HAT domain biology. H3K56 acetyltransferase activity,
  DNA-damage involvement and nuclear chromatin action are safe for the
  PTN001586545/SF2 RTT109 node, not for AIM6-like members.
