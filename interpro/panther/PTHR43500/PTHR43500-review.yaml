  PLP-dependent C-S lyases of the MetC type: E. coli and Salmonella cystathionine beta-lyase (MetC),
  S. cerevisiae IRC7 and P. putida PP_4348. One member (Wolbachia Aar) is an alanine/glutamate racemase.
