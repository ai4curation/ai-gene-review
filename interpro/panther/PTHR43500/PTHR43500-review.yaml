  - id: UniProtKB:Q4Q511
  assessment: TOO_DEEP
  assessment_reason: >-
    Cysteine degradation is the physiological role of yeast IRC7, a seed, but for the bacterial MetC
    enzymes cysteine desulfhydrase is a side activity of a methionine-biosynthetic enzyme. Placing the
    process at the family root propagates it to every MetC; it belongs on the IRC7 lineage.
  supported_by:
