family_id: PANTHER:PTHR43500
family_name: CYSTATHIONINE BETA-LYASE-RELATED
preferred_name: MetC-type cystathionine beta-lyase family
summary: >-
  Fold-type I PLP-dependent C-S lyases of the bacterial MetC type. E. coli MetC, the characterized
  founder, cleaves L-cystathionine to L-homocysteine, pyruvate and ammonia in the second step of
  trans-sulfuration; it also releases sulfide from L-cysteine and, under some conditions, shows alanine
  racemase co-activity. The family includes the Salmonella, Haemophilus and Bordetella MetC enzymes,
  S. cerevisiae IRC7 (a beta-lyase acting on cysteine and cysteine S-conjugates) and P. putida
  PP_4348. One member, Wolbachia Aar, is an alanine/glutamate racemase. The family is separate from
  the PTHR11808 trans-sulfuration family, whose SF50 subfamily holds the eukaryotic cystathionine
  beta-lyases (S. cerevisiae STR3, S. pombe cbl1, Arabidopsis CBL).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  One subfamily; nearly all reviewed members are cystathionine or cysteine-S-conjugate beta-lyases.
  The Wolbachia racemase is the exception, and E. coli MetC shows that racemase chemistry is within
  reach of the MetC active site.
