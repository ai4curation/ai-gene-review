  name:
    name: Thiamine thiazole synthase
    short: THI4
  description:
  - text: The THI4 family proteins are involved in the biosynthesis of the thiazole
      moiety of thiamine (vitamin B1). They catalyze the conversion of NAD and glycine
      to an adenylated thiazole intermediate, adenosine diphosphate 5-(2-hydroxyethyl)-4-methylthiazole-2-carboxylate
      (ADT), using free sulfide as a sulfur source. This reaction includes an iron-dependent
      sulfide transfer from a conserved cysteine residue to the thiazole intermediate.
      Members of the THI4 family are typically suicide enzymes, undergoing only a
      single turnover. Beyond their central role in thiamine biosynthesis, they may
      also contribute to adaptation to stress conditions and DNA damage tolerance.
