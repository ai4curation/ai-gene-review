family_id: PANTHER:PTHR43422
family_name: THIAMINE THIAZOLE SYNTHASE
preferred_name: THI4/THI1 thiamine thiazole synthase family
summary: >-
  Thiazole synthases that build ADP-thiazole, the thiazole precursor of thiamine. Fungal THI4 (S.
  cerevisiae THI4, S. pombe thi2/nmt2) and plant THI1 are single-turnover enzymes that donate the
  sulfur of an active-site cysteine. Archaeal Thi4 orthologs in SF3 are multiple-turnover enzymes
  that use sulfide and Fe(II).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members make ADP-thiazole, but the sulfur source differs: an active-site cysteine in fungi
  and plants, sulfide in many archaea.
