family_id: PANTHER:PTHR23211
family_name: TRANS-GOLGI NETWORK INTEGRAL MEMBRANE PROTEIN TGN38
preferred_name: TGN38-related membrane trafficking proteins
summary: The TGN38-related grouping includes the divergent fly regeneration protein Regeneration (Rgn).
  Fly rgn genetics supports a role in the formation of a proliferative regeneration blastema, while the
  relationship between that function and the intracellular trafficking mechanism associated with TGN38
  remains unresolved.
functional_coherence: UNKNOWN
coherence_reason: Fly rgn regulates the timing of blastema formation and regenerative cellular plasticity
  in imaginal discs (PMID:18485344). This is direct positive genetic evidence for the fly branch, not
  merely an uncharacterized sequence. However, the signal peptide and C-type-lectin-like architecture
  of the exact long rgn product do not by themselves establish trans-Golgi residence or a conserved TGN38
  trafficking cycle. Neither the family name nor a regeneration phenotype specifies the molecular ligand,
  compartment or vesicular mechanism.
