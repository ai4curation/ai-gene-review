family_id: PANTHER:PTHR30525
family_name: 1-DEOXY-D-XYLULOSE 5-PHOSPHATE REDUCTOISOMERASE
preferred_name: Canonical DXP reductoisomerase (Dxr / DXR-I) family
summary: >-
  DXP reductoisomerases catalyse the first committed step of the methylerythritol phosphate (MEP)
  pathway, the NADPH-dependent rearrangement and reduction of 1-deoxy-D-xylulose 5-phosphate (DXP) to
  2-C-methyl-D-erythritol 4-phosphate (MEP). They are divalent-metal-dependent homodimers and are the
  target of the antibiotic fosmidomycin. The family holds the canonical bacterial Dxr (E. coli,
  B. subtilis, M. tuberculosis, P. putida), the plastid DXR of plants and the apicoplast DXR of
  Plasmodium. An unrelated class of enzymes (DRL, PANTHER PTHR37850) performs the same reaction in some
  bacteria that lack this family.
functional_coherence: COHERENT
coherence_reason: >-
  The characterized bacterial, plant and apicomplexan members all catalyse the DXR reaction, and the
  root PAINT node carrying GO:0030604 is seeded across all three lineages. The two small extra
  subfamilies of the PANTHER 19 tree (SF6, SF7) carry the same official DXR name.
