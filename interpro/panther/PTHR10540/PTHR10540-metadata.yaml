  name:
    name: Eukaryotic translation initiation factor 3 subunit F
    short: eIF-3_subunit_F
  description:
  - text: The eIF-3 subunit F family is involved in the initiation of protein synthesis
      by forming part of the eukaryotic translation initiation factor 3 (eIF-3) complex.
      This complex plays a crucial role in the binding of mRNA and methionyl-tRNAi
      to the 40S ribosome, facilitating the recruitment of other initiation factors
      necessary for the formation of the pre-initiation complex. The eIF-3 complex
      is known to selectively target and initiate translation of mRNAs that are essential
      for cell proliferation, including those involved in cell cycling, differentiation,
      and apoptosis. Additionally, some family members possess a deubiquitinating
      activity, particularly towards activated NOTCH1, which promotes its nuclear
      import and positively regulates Notch signaling.
