family_id: PANTHER:PTHR43884
family_name: ACYL-COA DEHYDROGENASE
summary: Acyl-CoA-dehydrogenase-fold relatives perform diverse reactions, including fatty-acyl dehydrogenation
  and specialized oxidative or desulfinating chemistry. ACAD9 is additionally recruited to mitochondrial
  complex-I assembly; ECSIT binding releases its FAD and suppresses dehydrogenase activity in the assembly
  state. This state-dependent switch differs from constitutive catalytic inactivity.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory extends beyond acyl-CoA dehydrogenases to nitroalkane oxidases, monooxygenases
  and desulfinases; even SF12 mixes different reactions. Within the ACAD9 branch, direct protein-interaction
  studies show ECSIT-induced deflavination and loss of dehydrogenase activity during complex-I assembly
  (PMID:34646991). Catalytic potential and assembly function are alternative biochemical states, not evidence
  of constitutive pseudoenzyme inactivity. Neither substrate specificity nor complex-I assembly transfers
  to the entire family.
