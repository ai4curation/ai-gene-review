term_assessments:
- assessed_term:
    id: GO:0003995
    label: acyl-CoA dehydrogenase activity
  scope: UNRESOLVED
  scope_reason: The inventory extends beyond acyl-CoA dehydrogenases to nitroalkane oxidases, monooxygenases
    and desulfinases; even SF12 mixes different reactions. Within the ACAD9 branch, direct protein-interaction
    studies show ECSIT-induced deflavination and loss of dehydrogenase activity during complex-I assembly
    (PMID:34646991). Catalytic potential and assembly function are alternative biochemical states, not
    evidence of constitutive pseudoenzyme inactivity. Neither substrate specificity nor complex-I assembly
    transfers to the entire family. A complete set of function-bearing branches is not delimited, so no
    exhaustive family or subfamily grant is asserted. For BACSU FadE O32176 in SF12, native etfA/B and
    yusJ disruption phenotypes provide positive genetic evidence for an ETF-linked pathway. They do not
    alone resolve the exact ETF-specific GO reaction; its gene review retains that assertion as UNDECIDED
    and uses an acceptor-unspecified acyl-CoA oxidation core. This is not a claim that ETF is excluded.
  supported_by:
  - reference_id: PMID:34646991
    supporting_text: Our studies provide physical evidence for binary and ternary interactions between
      the full-length proteins and confirm their finding of deflavination of ACAD9 upon binding of the
      C-terminal domain of ECSIT.
  - reference_id: PMID:34646991
    supporting_text: ACAD9 was first identified as a member of the acyl-CoA dehydrogenase family catalyzing
      the α, β-dehydrogenation of fatty acyl-CoA thioesters, the first step of the fatty acid β-oxidation
      cycle (Zhang et al., 2002).
