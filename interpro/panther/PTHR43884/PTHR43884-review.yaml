term_assessments:
- assessed_term:
    id: GO:0003995
    label: acyl-CoA dehydrogenase activity
  scope: UNRESOLVED
  scope_reason: The inventory extends beyond acyl-CoA dehydrogenases to nitroalkane oxidases, monooxygenases
    and desulfinases; even SF12 mixes different reactions. Within the ACAD9 branch, direct protein-interaction
    studies show ECSIT-induced deflavination and loss of dehydrogenase activity during complex-I assembly
    (PMID:34646991). Catalytic potential and assembly function are alternative biochemical states, not
    evidence of constitutive pseudoenzyme inactivity. Neither substrate specificity nor complex-I assembly
    transfers to the entire family. A complete set of function-bearing branches is not delimited, so no
    exhaustive family or subfamily grant is asserted. For BACSU FadE O32176 in SF12, convergent yusJ and
    etfAB regulatory/growth phenotypes plus enzyme/ETF identities support a target-specific inferred ETF-linked
    activity, now accepted in the gene review. Direct transfer between isolated proteins remains unmeasured.
    That target inference does not delimit every function-bearing branch of this mixed family.
  supported_by:
  - reference_id: PMID:34646991
    supporting_text: Our studies provide physical evidence for binary and ternary interactions between
      the full-length proteins and confirm their finding of deflavination of ACAD9 upon binding of the
      C-terminal domain of ECSIT.
  - reference_id: PMID:34646991
    supporting_text: ACAD9 was first identified as a member of the acyl-CoA dehydrogenase family catalyzing
      the α, β-dehydrogenation of fatty acyl-CoA thioesters, the first step of the fatty acid β-oxidation
      cycle (Zhang et al., 2002).
- assessed_term:
    id: GO:0008470
    label: 3-methylbutanoyl-CoA dehydrogenase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Isovaleryl-CoA dehydrogenation is directly measured for human IVD and for P. aeruginosa LiuA, both in
    SF12, and leucine_catabolism selects SF12 gated by this function. SF12 is mixed (it also holds
    Bacillus FadE and CaiA/DszC-type relatives), so the term is safe only for the IVD orthologs of SF12,
    not for every member; FadE is recorded as an exception.
  applicable_subfamilies:
  - id: PANTHER:PTHR43884:SF12
    label: ISOVALERYL-COA DEHYDROGENASE, MITOCHONDRIAL-RELATED
  member_exceptions:
  - member:
      id: UniProtKB:O32176
      gene_symbol: fadE
      organism: Bacillus subtilis (strain 168)
    exception_reason: >-
      SF12 member whose supported role is a fatty acyl-CoA dehydrogenase step of native beta-oxidation,
      not isovaleryl-CoA dehydrogenation.
    supported_by:
    - reference_id: file:genes/BACSU/fadE/fadE-uniprot.txt
      supporting_text: Reaction=a 2,3-saturated acyl-CoA + A = a 2,3-dehydroacyl-CoA + AH2;
  supported_by:
  - reference_id: PMID:7640268
    supporting_text: Isovaleryl-CoA dehydrogenase (IVD) is a homotetrameric flavoenzyme which catalyzes
      the conversion of isovaleryl-CoA to 3-methylcrotonyl-CoA.
  - reference_id: PMID:18625020
    supporting_text: LiuA purified from recombinant E. coli revealed acyl-CoA dehydrogenase activity with
      isovaleryl-CoA (KM 2.3 microM)
