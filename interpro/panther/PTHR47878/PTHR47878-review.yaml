family_id: PANTHER:PTHR47878
family_name: OXIDOREDUCTASE FAD/NAD(P)-BINDING DOMAIN PROTEIN
preferred_name: Bacterial plant-type (FNR-family) flavodoxin/ferredoxin--NADP+ reductases (Fpr)
summary: >-
  Soluble FAD-containing NADPH-dependent reductases of the plant-type ferredoxin--NADP+
  reductase (FNR) structural family, found in proteobacteria and other bacteria. They transfer
  electrons from NADPH to one-electron carriers, ferredoxins and flavodoxins, and in some
  organisms directly to partner enzymes. Characterized members are Escherichia coli Fpr, the
  flavodoxin reductase that supports the response to superoxide and iron-sulfur cluster
  assembly; Azotobacter vinelandii and Rhodobacter capsulatus Fpr (ferredoxin reductases);
  Pseudomonas aeruginosa FPR, which directly supports heme oxygenase catalysis; and
  Pseudomonas putida FprA (Fpr-I), which prefers flavodoxin among tested partners and is
  genetically required for efficient assimilatory sulfite reduction. All reviewed members fall
  in the single subfamily SF1.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The molecular activity, NADPH-dependent reduction of ferredoxin or flavodoxin carriers, is
  shared by every characterized member. The physiological processes these electrons feed
  (superoxide response, Fe-S cluster assembly, heme degradation, sulfite reduction) depend on
  which partner enzymes the organism has, and are not family-wide.
