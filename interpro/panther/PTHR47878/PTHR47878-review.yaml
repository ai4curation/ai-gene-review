node_assessments:
- node_id: PANTHER:PTN002500048
  asserted_term:
    id: GO:0042167
    label: heme catabolic process
  evidence: IBD
  paint_snapshot: '20180419'
  seeds:
  - id: UniProtKB:Q9HYK7
    label: fpr
    organism: Pseudomonas aeruginosa PAO1
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The seed is well grounded: purified P. aeruginosa FPR supports the catalytic cycle of
    P. aeruginosa heme oxygenase without a ferredoxin. The function is partner-dependent,
    though. Among reviewed members QuickGO (2026-11-03) shows the IBA on E. coli K-12 Fpr
    (P28861) but not on Azotobacter, Rhodobacter, Sorangium or Buchnera Fpr, so the node is a
    proteobacterial sub-clade that includes the enterobacteria. E. coli K-12 encodes no heme
    oxygenase (UniProt REST query of taxon 83333, 2026-11-03, returned none), and its Fpr is
    characterized as the flavodoxin reductase of the superoxide response, so the enterobacterial
    branch inherits a process its genome cannot perform; it needs an IRD. Pseudomonads keep it:
    P. putida KT2440, whose Fpr-I receives the term by TreeGrafter IEA, encodes HemO (PP_1005)
    and two other heme oxygenases, and the fpr-I review keeps the row as non-core.
  supported_by:
  - reference_id: PMID:17915950
    supporting_text: In vitro reconstitution of pa-HO catalytic activity with the newly characterized
      proteins led to the surprising observation that pa-FPR efficiently supports the catalytic
      cycle of pa-HO, without the need of a ferredoxin.
  - reference_id: PMID:17915950
    supporting_text: most similar to the structure of Azotobacter vinelandii FPR and Escherichia coli
      flavodoxin reductase. The latter two enzymes interact with distinct redox
      partners, a ferredoxin and a flavodoxin, respectively.
term_assessments:
- assessed_term:
    id: GO:0004324
    label: ferredoxin-NADP+ reductase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    NADPH-dependent reduction of ferredoxin is measured for E. coli, Azotobacter, Rhodobacter
    and P. aeruginosa Fpr and for P. putida Fpr-I (which reduces both Fd and Fld, more
    efficiently Fld). Several members prefer flavodoxin, but the ferredoxin activity is not
    absent, so the term is safe family-wide.
  supported_by:
  - reference_id: PMID:19122206
    supporting_text: 'Fprs in P. putida function as diaphorase,

      Fd/Fld reductases'
  - reference_id: PMID:17915950
    supporting_text: the fpr gene encodes a 258-residue NADPH-dependent
      ferredoxin reductase (pa-FPR) that utilizes FAD as a cofactor.
- assessed_term:
    id: GO:0042167
    label: heme catabolic process
  scope: UNRESOLVED
  scope_reason: >-
    Holds only where a heme oxygenase partner exists (P. aeruginosa, P. putida). Not supported
    for E. coli K-12 or other members without one. Partner repertoire, not subfamily
    membership, decides it.
  supported_by:
  - reference_id: PMID:23794620
    supporting_text: It has been shown that P. aeruginosa FprA efficiently transfers electrons
      from NADPH to heme oxygenase
- assessed_term:
    id: GO:0000103
    label: sulfate assimilation
  scope: UNRESOLVED
  scope_reason: >-
    Genetically supported for pseudomonad FprA, whose loss impairs sulfite reduction and is
    bypassed by E. coli CysJI, but enterobacteria use the CysJ flavoprotein for that step; the
    role depends on the organism's sulfite-reductase architecture. The immediate carrier from
    FprA to CysI is unresolved.
  supported_by:
  - reference_id: PMID:23794620
    supporting_text: These data indicate that fprA is necessary for effective sulfate assimilation
      by P. putida
