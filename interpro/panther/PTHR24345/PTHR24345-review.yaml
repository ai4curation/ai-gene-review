  diverged_from_family: true
  divergence_description: >-
    Human PLK5 lacks the active N-terminal kinase domain and should not inherit
    active-kinase, kinetochore, spindle-pole, centrosome or generic cell-cycle
    assertions from active PLK paralogs.
