  kinase activity (GO:0004672), GTPase activator activity (GO:0005096), protein serine/threonine kinase
  activity (GO:0004674), eukaryotic translation initiation factor 2alpha kinase activity (GO:0004694)),
  indicating clade-level functional specialization across the family.
