family_id: PANTHER:PTHR24345
family_name: SERINE/THREONINE-PROTEIN KINASE PLK
preferred_name: Polo-like kinase family
review_status: COMPLETE
summary: >-
  PTHR24345 contains the polo-like kinases, a family of protein
  serine/threonine kinases that use polo-box modules and related scaffolds to
  target phosphorylation to centrosomal, Golgi, checkpoint and spindle
  structures. The ancestral active-kinase activity is conserved across PLK1,
  PLK2, PLK3 and PLK4, while human PLK5 is an inactive, kinase-domain-lost
  branch. Several cellular functions are branch-specific: PLK1-like kinases are
  the kinetochore and mitotic-spindle PLKs, PLK2 regulates centriole duplication
  and neuronal plasticity, PLK3 regulates stress checkpoints and Golgi
  disassembly, and PLK4 specializes in procentriole assembly.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family is coherent for ATP-dependent protein phosphorylation in active PLK
  branches, but PLK5 lost the human kinase domain and the main process and
  localization terms split sharply by paralog. PLK1-like kinetochore and
  spindle functions should not be inherited by PLK2, PLK3 or PLK5, PLK4 is
  the separate centriole-biogenesis kinase, and PLK3's stress/Golgi branch is
  narrower than the root active-PLK node.
