family_id: PANTHER:PTHR20863
family_name: ACYL CARRIER PROTEIN
preferred_name: Acyl carrier protein (AcpP/ACP1/NDUFAB1) family
summary: >-
  Small acidic acyl carrier proteins that carry the growing acyl chain on a phosphopantetheine arm
  during type II fatty acid synthesis: bacterial AcpP, and the mitochondrial ACPs (S. cerevisiae
  ACP1, S. pombe SPAC4H3.09, human NDUFAB1), which supply octanoyl groups for lipoic acid and also
  serve complex I and Fe-S cluster assembly.
functional_coherence: COHERENT
coherence_reason: All subfamilies are type II ACPs.
