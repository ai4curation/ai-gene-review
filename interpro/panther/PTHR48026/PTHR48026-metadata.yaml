  name:
    name: Heterogeneous nuclear ribonucleoprotein A/B
    short: hnRNP_A/B
  description:
  - text: This family of proteins is involved in various aspects of RNA biology, including
      the packaging of pre-mRNA into particles, mRNA transport from the nucleus to
      the cytoplasm, and the modulation of splice site selection. Members of this
      family play roles in the formation of ribonucleoprotein complexes with heterogeneous
      nuclear RNA. They are implicated in the regulation of mRNA splicing, including
      alternative splicing of certain genes such as pyruvate kinase. Some family members
      are involved in the cellular response to viral infection and in the transport
      of viral RNAs. They also bind to telomeric DNA and are involved in the processing
      of primary microRNAs and their sorting into exosomes. Additionally, these proteins
      can form labile amyloid-like fibers and are associated with RNA granules and
      hydrogels.
