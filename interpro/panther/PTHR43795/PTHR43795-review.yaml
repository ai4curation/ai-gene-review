      - id: PANTHER:PTHR43795:SF64
        label: GLUTAMATE-OXALOACETATE TRANSAMINASE5
      - id: PANTHER:PTHR43795:SF100
        label: ASPARTATE AMINOTRANSFERASE
    scope_reason: >-
      Restricted to the plastidial/SAR/bacterial class-Ib aspartate/prephenate
      aminotransferase clades (PTN008453015; PMID:21102469, PMID:25070637); note that
      even within bacterial SF2, Mycobacterium tuberculosis Rv3565/AspB functions as an
      alanine/valine transaminase rather than an AspAT (PMID:32327655).
    supported_by:
      - reference_id: PMID:21102469
        supporting_text: >-
          Here we identified Petunia hybrida and Arabidopsis thaliana genes encoding
          prephenate aminotransferases (PPA-ATs), thus completing the identification of
          the genes involved in phenylalanine and tyrosine biosyntheses.
      - reference_id: PMID:25070637
        supporting_text: >-
          A subset of AspAT Ib enzymes exhibiting PPA-AT activity was further identified
          from both Plantae and prokaryotes and, together with site-directed
          mutagenesis, showed that Thr-84 and Lys-169 play key roles in specific
          recognition of dicarboxylic keto (prephenate) and amino (aspartate) acid
          substrates.
      - reference_id: PMID:32327655
        supporting_text: >-
          These results indicate that Rv0337c/AspC functions as an alanine
          aminotransferase AlaT, while Rv3565/AspB functions as an alanine/valine
          aminotransferase AvtA with additional activity toward methionine.
