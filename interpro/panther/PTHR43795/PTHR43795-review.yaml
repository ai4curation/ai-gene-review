          acceptor to produce L-tryptophan and 2-oxo-4-methylthiobutyric acid.
      - reference_id: PMID:12968022
        supporting_text: >-
          Complementation analysis with the Escherichia coli aminotransferase mutant
          DL39 shows that ACS10 and 12 encode aminotransferases.
      - reference_id: PMID:39876065
        supporting_text: >-
          Although understanding the biological function of hACCS still awaits in vivo
          study, our discovery of hACCS’s cysteine-conjugate sulfoxide Cβ-S lyase
          activity in vitro suggests hACCS is the potential missing link in the
          glutathione-based xenobiotic metabolic pathways.
