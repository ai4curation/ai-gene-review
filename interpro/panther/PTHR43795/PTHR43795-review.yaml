  - subfamily_id: PANTHER:PTHR43795:SF1
    clade_node_id: PANTHER:PTN000202914
    label: INACTIVE 1-AMINOCYCLOPROPANE-1-CARBOXYLATE SYNTHASE-LIKE PROTEIN 2-RELATED
    description: >-
      Eutherian tandem duplicate of ACCS located immediately adjacent to ACCS on human
      chromosome 11p11.2, mouse chromosome 2, and rat chromosome 3. Although ACCSL
      proteins retain the canonical Schiff-base lysine (K395 in human Q4AC99, K417 in
      mouse Q3UX83, K419 in rat D3ZUW2) and pyridine-ring aspartate (D358/D380/D382), no
      ACCSL protein has been purified or shown to bind PLP or catalyze any reaction.
    diverged_from_family: true
    divergence_description: >-
      Putative pseudoenzyme or functionally diverged mammalian paralog: all eutherian
      ACCSL orthologs substitute the catalytic B-chain arginine R351 to tyrosine
      (Y423/Y445/Y447, corresponding to a ~40-fold activity loss when engineered into
      hACCS), and human Q4AC99 additionally substitutes the substrate
      alpha-carboxylate-anchoring R457 to cysteine (C529, corresponding to a 100-fold
      activity loss in hACCS R457C; common human polymorphism rs2074051 encodes
      p.Cys529Arg).
