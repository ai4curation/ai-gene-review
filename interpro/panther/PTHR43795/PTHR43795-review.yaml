subfamilies:
  - subfamily_id: PANTHER:PTHR43795:SF17
    clade_node_id: PANTHER:PTN000202908
    label: 1-AMINOCYCLOPROPANE-1-CARBOXYLATE SYNTHASE-LIKE PROTEIN 1
    description: >-
      Vertebrate PLP-dependent C-beta-S lyase clade syntenic with EXT2 and the RAG1/RAG2
      region. Human ACCS (Q96QU6) is an obligate homodimer that binds stoichiometric PLP
      covalently at K323, lacks 1-aminocyclopropane-1-carboxylate synthase activity, and
      catalyzes beta-elimination of cysteine S-conjugates and cysteine S-conjugate
      sulfoxides in vitro, although its endogenous mammalian physiological substrate
      awaits in vivo identification.
    diverged_from_family: true
    divergence_description: >-
      Neofunctionalized from ancestral fold-type I aminotransferases into a homodimeric
      PLP-dependent cysteine S-conjugate / cysteine S-conjugate sulfoxide C-beta-S lyase
      (human Q96QU6) lacking both ACC synthase and transaminase activities; teleost
      orthologs (Danio rerio A0A8M1N4R4, Takifugu rubripes Q9W698) conserve the K274/D237/R408
      catalytic core and W86/Y83 aromatic pocket residues while substituting Cys at
      mammalian R351.
