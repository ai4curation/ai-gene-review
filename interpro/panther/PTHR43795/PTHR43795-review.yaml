    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR43795:SF17
        label: 1-AMINOCYCLOPROPANE-1-CARBOXYLATE SYNTHASE-LIKE PROTEIN 1
    scope_reason: >-
      Directly demonstrated for human ACCS (Q96QU6, SF17) by Gao et al. (PMID:39876065),
      who measured full Michaelis-Menten saturation kinetics on the non-sulfoxide
      conjugate S-phenyl-L-cysteine (substrate 4: Km = 0.5 mM, kcat = 0.4 s^-1, kcat/Km ~
      700 M^-1 s^-1 -> thiol + NH3 + pyruvate, EC 4.4.1.13) alongside cysteine
      S-sulfoxides such as S-phenyl-L-cysteine sulfoxide (substrate 10: kcat = 14 s^-1,
      kcat/Km ~ 700 M^-1 s^-1) and alliin (substrate 9), and transferable within SF17 to
      mammalian 1:1 orthologs (mouse A2AIG8, rat A0A8J8YIP6) that strictly conserve
      K323, D286, R457, W135(B), Y132(B), and R351(B) (whereas teleost accs substitutes
      Cys at R351 and remains unassayed). Excluded from eutherian ACCSL (SF1, gated by
      PAINT IKR at PTN000202914 and active-site C529/Y423 substitutions) and uncharacterized
      SF39 homologs (such as C. elegans T04F3.1).
    supported_by:
      - reference_id: PMID:39876065
        supporting_text: >-
          The catalytic efficiency (kcat/Km) for 4 and 10 are approximately the same
          (~700 M−1s−1), and both exceed that of the vinylglycine deamination reaction by
          two orders of magnitude (Figure 5). However, reaction with substrate 4 shows
          saturation kinetics with an apparent Km of 0.5 mM, whereas substrate 10 does not
          reach saturation up to 16 mM. The turnover number (kcat) for 10 (14 s−1) is
          38-fold higher than 4 (0.4 s−1), consistent with the results shown above that
          sulfoxide substrates are more reactive than non-sulfoxide cysteine conjugate.
      - reference_id: PMID:39876065
        supporting_text: >-
          Notably, both W135 and R351 are highly conserved in mammalian ACCS orthologues
          (Figure 7).
