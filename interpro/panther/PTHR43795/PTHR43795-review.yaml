family_id: PANTHER:PTHR43795
family_name: BIFUNCTIONAL ASPARTATE AMINOTRANSFERASE AND GLUTAMATE/ASPARTATE-PREPHENATE AMINOTRANSFERASE-RELATED
preferred_name: Fold-type I PLP-dependent prephenate/aromatic aminotransferases, plant ACC synthases, and C-S lyases
summary: >-
  PANTHER family PTHR43795 encompasses a functionally diverse fold-type I (alpha-family)
  pyridoxal 5'-phosphate (PLP)-dependent enzyme radiation spanning bacteria, archaea,
  fungi, plants, and metazoans. Despite sharing a conserved homodimeric alpha/beta
  aminotransferase class I/II core (InterPro:IPR004839, Pfam:PF00155) in which a catalytic
  lysine forms an internal Schiff-base aldimine with PLP and an invariant aspartate
  engages the pyridinium nitrogen, distinct clades catalyze fundamentally different
  reactions: (1) prokaryotic and plastidial class-Ib aspartate/prephenate and
  alanine/valine aminotransferases (SF2, SF64, SF100); (2) eukaryotic methionine:indole-3-pyruvate
  and aromatic aminotransferases (ISS1/VAS1, SF12); (3) land-plant tryptophan:pyruvate
  aminotransferases of the auxin pathway (TAA1/TAR, SF15, SF22, SF111, SF115, SF117)
  together with Allium and cereal alliin C-S lyases (SF20, SF49); (4) land-plant
  authentic 1-aminocyclopropane-1-carboxylate (ACC) synthases that cyclize
  S-adenosyl-L-methionine to ACC in ethylene biosynthesis (SF6, SF10, SF42, SF45, SF54,
  SF67, SF74 outside Brassicaceae, SF81, SF112, SF114, SF118), alongside nested plant
  ACS10/ACS12 clades that function as aminotransferases (SF85, SF46) and Brassicaceae
  ACS1 proteins inactivated by deletion of a conserved Thr-Asn-Pro tripeptide
  (PTN005183104 within SF74); (5) fungal epidithiodiketopiperazine pathway C-S lyases
  such as Aspergillus fumigatus GliI (SF32); and (6) metazoan homologs comprising
  vertebrate ACCS (SF17), eutherian ACCSL (SF1), and uncharacterized
  invertebrate/protist/fungal sequences grouped in paraphyletic SF39. Human ACCS
  (UniProtKB:Q96QU6, SF17) binds stoichiometric PLP via K323, experimentally lacks ACC
  synthase activity (with AlphaFold2 homology modeling and AutoDock Vina docking
  hypothesizing that partner-subunit Y132 sterically impedes productive SAM binding), and
  functions in vitro as a homodimeric cysteine-S-conjugate beta-lyase (GO:0047804, EC
  4.4.1.13) and cysteine S-conjugate sulfoxide beta-lyase whose inter-subunit substrate
  pocket relies on Y132, W135, and R351 from the partner monomer alongside substrate
  carboxylate-anchoring R457, although its endogenous mammalian physiological substrate
  awaits in vivo identification. By contrast, eutherian ACCSL (SF1) arose by tandem duplication of ACCS
  adjacent to EXT2 and substitutes key pocket residues—most notably R351->Y across
  mammalian ACCSL (Y423 in human Q4AC99, Y445 in mouse Q3UX83, Y447 in rat D3ZUW2) and
  R457->C in human Q4AC99 (C529)—making SF1 an uncharacterized putative pseudoenzyme or
  divergent paralog.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  PTHR43795 unites aminotransferases (aspartate, prephenate, valine/alanine, tryptophan,
  and methionine:indole-3-pyruvate transaminases), intramolecular C-gamma-S lyases
  (land-plant ACC synthases), C-beta-S lyases (plant alliinases, fungal GliI, and
  human ACCS), Brassicaceae TNP-deleted inactive ACS1 proteins, and uncharacterized
  mammalian ACCSL (SF1) and nematode T04F3.1 (SF39) homologs. Even cofactor binding
  (GO:0030170) cannot be asserted family-wide because eutherian ACCSL (SF1) and diverged
  SF39 proteins such as Caenorhabditis elegans T04F3.1 have never been shown to bind PLP
  or catalyze a reaction, while stale retired PAINT node PTN002887088 still
  over-propagates transaminase activity (GO:0008483) and amino acid metabolic process
  (GO:0006520) across metazoan C-beta-S lyase and putative pseudoenzyme clades.
