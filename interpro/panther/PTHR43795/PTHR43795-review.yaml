residue_sites:
  - site_id: plp_schiff_base_lysine
    label: Catalytic PLP Schiff-base lysine (K323 in human ACCS)
    description: >-
      Active-site lysine that forms the covalent internal Schiff-base aldimine with
      pyridoxal 5'-phosphate (UniProt MOD_RES 323 on Q96QU6) and serves as general base
      during alpha,beta-elimination; necessary for PLP covalent attachment and catalysis
      (K323A abolishes bound PLP and enzyme activity in hACCS), though retained in
      uncharacterized eutherian ACCSL (SF1) and C. elegans T04F3.1 (SF39).
    anchor:
      id: UniProtKB:Q96QU6
      label: 1-aminocyclopropane-1-carboxylate synthase-like protein 1
      gene_symbol: ACCS
      organism: Homo sapiens
    anchor_sequence_version: 1
    site_source: UNIPROT_FEATURE
    residues:
      - position: 323
        expected:
          - K
        role: Forms the covalent internal aldimine Schiff base with PLP and acts as the general base in alpha,beta-elimination
    required_for:
      - term:
          id: GO:0030170
          label: pyridoxal phosphate binding
        strength: CONTRIBUTES
        rationale: >-
          K323 forms the internal Schiff base with PLP and hACCS-K323A lacks protein-bound
          PLP, making K323 necessary for canonical covalent cofactor binding, although
          retention of the homologous lysine in unassayed ACCSL (Q4AC99 K395) and
          T04F3.1 (G5EE32 K3294) is not by itself sufficient to prove cofactor binding.
        supported_by:
          - reference_id: PMID:39876065
            supporting_text: >-
              The PLP content was determined to be stoichiometric for wild-type hACCS.
              For some mutants, such as hACCS-K323A, there is no evidence of
              protein-bound PLP-cofactor.
          - reference_id: file:genes/human/ACCS/ACCS-uniprot.txt
            supporting_text: "FT   MOD_RES         323"
      - term:
          id: GO:0047804
          label: cysteine-S-conjugate beta-lyase activity
        strength: CONTRIBUTES
        rationale: >-
          K323 forms the internal Schiff base and acts as the general base initiating
          alpha,beta-elimination of S-phenyl-L-cysteine (EC 4.4.1.13) and cysteine
          S-sulfoxides in mammalian ACCS (K323A completely abolishes activity), alongside
          substrate-anchoring R457 and partner-subunit pocket determinants R351 and W135.
        supported_by:
          - reference_id: PMID:39876065
            supporting_text: >-
              We first mutated the highly conserved PLP-binding lysine residue K323. As
              expected, the K323A mutant completely abolished enzyme activity, confirming
              the importance of K323 in catalysis and also demonstrating the observed
              cysteine S-conjugate sulfoxide β-lyase activity is specific to hACCS.
      - term:
          id: GO:0016846
          label: carbon-sulfur lyase activity
        strength: CONTRIBUTES
        rationale: >-
          K323 acts as the catalytic general base initiating alpha,beta-elimination of
          cysteine S-conjugate sulfoxides, and K323A completely abolishes hACCS C-beta-S
          lyase activity, while distal substrate-binding residues (R457, R351, W135) are
          also required.
        supported_by:
          - reference_id: PMID:39876065
            supporting_text: >-
              We first mutated the highly conserved PLP-binding lysine residue K323. As
              expected, the K323A mutant completely abolished enzyme activity, confirming
              the importance of K323 in catalysis and also demonstrating the observed
              cysteine S-conjugate sulfoxide β-lyase activity is specific to hACCS.
      - term:
          id: GO:0003824
          label: catalytic activity
        strength: CONTRIBUTES
        rationale: >-
          All PLP-dependent transaminase, ACC synthase, and C-S lyase reactions in
          PTHR43795 proceed through covalent aldimine intermediates at this active-site
          lysine (K323 in hACCS, K273 in apple ACS-1), though Brassicaceae ACS1 and
          eutherian ACCSL retain the lysine despite losing catalytic determinants
          elsewhere.
        supported_by:
          - reference_id: PMID:15848188
            supporting_text: >-
              The active site contains an external aldimine of the adduct of L-VG with
              the pyridoxal 5'-phosphate cofactor. The side chain gamma-carbon of L-VG is
              covalently bound to the epsilon-amino group of Lys273.
