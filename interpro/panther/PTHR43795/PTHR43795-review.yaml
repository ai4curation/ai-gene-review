      convert L-tryptophan into indole-3-pyruvic acid; over-propagated at Eukaryota node
      PTN000923688 onto non-plant SF12 homologs.
    supported_by:
      - reference_id: PMID:18394997
        supporting_text: >-
          Biochemical studies revealed that WEI8 encodes a long-anticipated tryptophan
          aminotransferase, TAA1, in the essential, yet genetically uncharacterized,
          indole-3-pyruvic acid (IPA) branch of the auxin biosynthetic pathway.
      - reference_id: PMID:23377040
        supporting_text: >-
          TAA1/SAV3, also known as WEI86 or TIR27, is the most active of a family of 5
          tryptophan aminotransferases (TAA1 and TAA1-related 1–4, known as TARs) that
          convert L-Trp to a redox sensitive metabolite, 3-IPA.
