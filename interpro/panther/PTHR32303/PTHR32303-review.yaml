term_assessments:
  - assessed_term:
      id: GO:0052934
      label: alcohol dehydrogenase (cytochrome c) activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Cytochrome c-linked oxidation of primary and secondary alcohols is the
      function of the characterized SF20 type I alcohol dehydrogenases,
      whether calcium-dependent (PedE, ExaA) or lanthanide-dependent (PedH,
      ExaF). It is not safe for SF4, whose glucose, quinate and glycerol
      dehydrogenases reduce ubiquinone and whose methanol dehydrogenases are
      the distinct cytochrome cL-linked enzymes, nor for SF10 (BamB). The
      catalytic metal is not determined by subfamily, so this assessment does
      not license calcium- or lanthanide-specific claims.
    applicable_subfamilies:
      - id: PANTHER:PTHR32303:SF20
        label: QUINOPROTEIN ETHANOL DEHYDROGENASE
    member_exceptions:
      - member:
          id: UniProtKB:Q9AGW3
          label: 1-butanol dehydrogenase (quinone)
          gene_symbol: boh
          organism: Thauera butanivorans
        exception_reason: >-
          Placed in SF20 by PANTHER, but UniProt names it a quinone-linked
          1-butanol dehydrogenase, so the cytochrome c acceptor of the
          characterized SF20 members should not be assumed for it.
        supported_by:
          - reference_id: file:interpro/panther/PTHR32303/PTHR32303-entries.csv
            supporting_text: Q9AGW3,1-butanol dehydrogenase (quinone)
    supported_by:
      - reference_id: file:PSEPK/pedH/pedH-uniprot.txt
        supporting_text: >-
          Uses a specific inducible cytochrome c550, encoded by the adjacent gene
          in the locus, as electron acceptor
      - reference_id: PMID:28655819
        supporting_text: >-
          We demonstrate that PedH exhibits enzymatic activity only in the
          presence of lanthanides
