      label: Pseudomonadota
    assessment: TOO_DEEP
    assessment_reason: >-
      PTN002529367 is the family root in the PANTHER 19 tree, a duplication
      node over all 110 leaves, so membrane descends to every member. Both
      seeds are membrane proteins for different reasons (Gcd is an
      inner-membrane-anchored dehydrogenase; BamB is an outer-membrane
      lipoprotein), but the SF20 clade (PTN008429657) consists of soluble
      periplasmic alcohol dehydrogenases such as P. aeruginosa ExaA and P.
      putida PedE and PedH, which are not membrane proteins. The term should be
      placed on the Gcd and BamB clades rather than at the root.
