family_id: PANTHER:PTHR32303
family_name: QUINOPROTEIN ALCOHOL DEHYDROGENASE (CYTOCHROME C)
preferred_name: PQQ beta-propeller quinoprotein dehydrogenases and BamB
summary: >-
  Eight-bladed beta-propeller (PQQ repeat) proteins. Most are periplasmic or membrane-anchored
  pyrroloquinoline quinone (PQQ) dehydrogenases that oxidize alcohols, sugars or polyols and pass
  electrons to cytochromes or quinones. Characterized members include the calcium methanol
  dehydrogenase MxaF and lanthanide XoxF (SF4), membrane glucose, glycerol and quinate
  dehydrogenases (SF4), the Pseudomonas ethanol dehydrogenases PedE (Ca2+) and PedH (Ln3+) (SF20),
  and polyvinylalcohol dehydrogenases. The family also contains BamB (SF10), a non-catalytic
  outer-membrane lipoprotein of the beta-barrel assembly machinery that shares the propeller
  fold.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The PQQ-dependent oxidation of CH-OH donors is shared by every characterized catalytic
  subfamily. The specific substrate, metal (Ca2+ or lanthanide) and electron acceptor vary by
  clade. BamB is a clear structural exception that has lost the dehydrogenase function. Location
  also varies: MxaF and PedE/PedH are soluble periplasmic enzymes, glucose dehydrogenase is
  inner-membrane-anchored and BamB is an outer-membrane lipoprotein. A family-wide membrane
  location is therefore not justified.
