notes: >-
  Reviewed as the family grounding for the PedE and PedH alcohol
  dehydrogenases in MODULE:pseudomonad_lanthanide_switch_pqq_alcohol_oxidation.
  Because PedE and PedH are both SF20, the family and subfamily ids ground the
  shared cytochrome c-linked alcohol dehydrogenase activity only; which branch
  of the lanthanide switch a member belongs to (calcium or lanthanide) must come
  from member-level evidence. Node coverage was read from the PANTHER 19 tree
  (pantherdb.org treeinfo service, fetched 2026-10-23). The cached InterPro
  metadata describes the family as "Bacterial PQQ-dependent dehydrogenase"; the
  official PANTHER name is kept verbatim in family_name.
