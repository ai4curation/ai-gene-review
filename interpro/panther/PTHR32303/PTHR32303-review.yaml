family_id: PANTHER:PTHR32303
family_name: QUINOPROTEIN ALCOHOL DEHYDROGENASE (CYTOCHROME C)
preferred_name: PQQ beta-propeller dehydrogenases and BamB-like proteins
summary: >-
  Proteobacterial proteins built around an eight-bladed PQQ-repeat
  beta-propeller. Most members are pyrroloquinoline quinone (PQQ)-dependent
  dehydrogenases that oxidize substrates outside the cytoplasm and pass
  electrons to a cytochrome c or to ubiquinone: soluble periplasmic type I
  alcohol dehydrogenases (Pseudomonas ExaA, PedE and PedH; Methylorubrum
  extorquens ExaF), methanol dehydrogenases of methylotrophs (the calcium
  enzyme MxaF and the lanthanide enzymes XoxF), membrane-anchored
  quinone-linked glucose, quinate/shikimate and glycerol dehydrogenases (E.
  coli Gcd, Acinetobacter QuiA, Gluconobacter SldA), and polyvinyl alcohol
  dehydrogenases. The PQQ-binding active site holds a catalytic divalent or
  trivalent metal: calcium in PedE, ExaA and MxaF, and a light lanthanide in
  PedH, ExaF and XoxF. The family also contains the outer-membrane assembly
  lipoprotein BamB, which shares the beta-propeller fold but is not a
  quinoprotein. Electron acceptor, substrate class, membrane anchoring and
  catalytic metal therefore all vary between subfamilies, and metal
  specificity varies even within a single subfamily.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Only the beta-propeller fold is shared by all members. PQQ-dependent
  dehydrogenase activity is absent from BamB (SF10). Among the
  dehydrogenases, SF20 (quinoprotein ethanol dehydrogenases) contains soluble
  periplasmic alcohol dehydrogenases that reduce cytochrome c, while SF4
  (labelled quinoprotein glucose dehydrogenase) mixes membrane-bound
  quinone-reducing glucose and quinate dehydrogenases with soluble cytochrome
  c-linked methanol dehydrogenases (MxaF, XoxF). Calcium versus lanthanide
  dependence is not separated by subfamily: the calcium-dependent PedE and the
  lanthanide-dependent PedH of Pseudomonas putida are both SF20, as are the
  calcium enzyme ExaA and the lanthanide enzyme ExaF. Membrane location is
  likewise subfamily-specific rather than family-wide.
reference_protein:
  id: UniProtKB:Q88JH0
  label: Quinoprotein alcohol dehydrogenase PedH
  gene_symbol: pedH
  organism: Pseudomonas putida KT2440
  gene_review: genes/PSEPK/pedH/pedH-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR32303:SF20
    label: QUINOPROTEIN ETHANOL DEHYDROGENASE
    clade_node_id: PANTHER:PTN008429657
    description: >-
      Soluble periplasmic type I PQQ alcohol dehydrogenases that oxidize
      primary and secondary alcohols and aldehydes and pass electrons to a
      dedicated cytochrome c550. The subfamily includes calcium-dependent
      members (P. aeruginosa ExaA, P. putida PedE) and lanthanide-dependent
      members (P. putida PedH, M. extorquens ExaF); in P. putida KT2440 the
      calcium/lanthanide pair is reciprocally regulated by the PedS2/PedR2
      two-component system. The PANTHER 19 tree places only five SF20 leaves
      (Bradyrhizobium and P. aeruginosa) under its clade node, because the P.
      putida and M. extorquens proteomes are not PANTHER reference proteomes.
    representative_members:
      - id: UniProtKB:Q88JH0
        label: Quinoprotein alcohol dehydrogenase PedH
        gene_symbol: pedH
        organism: Pseudomonas putida KT2440
        gene_review: genes/PSEPK/pedH/pedH-ai-review.yaml
      - id: UniProtKB:Q88JH5
        label: Quinoprotein alcohol dehydrogenase PedE
        gene_symbol: pedE
        organism: Pseudomonas putida KT2440
        gene_review: genes/PSEPK/pede/pede-ai-review.yaml
      - id: UniProtKB:Q9Z4J7
        label: Quinoprotein ethanol dehydrogenase
        gene_symbol: exaA
        organism: Pseudomonas aeruginosa PAO1
    diverged_from_family: false
    supported_by:
      - reference_id: PMID:28655819
        supporting_text: >-
          We demonstrate that PedH exhibits enzymatic activity only in the
          presence of lanthanides, including, but not limited to, lanthanum,
          praseodymium, and cerium, and show that this enzyme has a substrate
          range similar to that of PedE, the recently characterized
          Ca2+-dependent PQQ-ADH from KT2440
      - reference_id: file:interpro/panther/PTHR32303/PTHR32303-entries.csv
        supporting_text: C5AXV8,Lanthanide-dependent ethanol dehydrogenase
  - subfamily_id: PANTHER:PTHR32303:SF4
    label: QUINOPROTEIN GLUCOSE DEHYDROGENASE
    clade_node_id: PANTHER:PTN002088150
    description: >-
      Despite its label, a mixed subfamily: membrane-anchored quinone-linked
      glucose dehydrogenases (E. coli Gcd, P. putida Gcd), quinate/shikimate and
      glycerol dehydrogenases, and the soluble cytochrome c-linked methanol
      dehydrogenases of methylotrophs, both calcium-dependent (MxaF) and
      lanthanide-dependent (XoxF).
    representative_members:
      - id: UniProtKB:P15877
        label: Quinoprotein glucose dehydrogenase
        gene_symbol: gcd
        organism: Escherichia coli K-12
      - id: UniProtKB:P16027
        gene_symbol: mxaF
        organism: Methylorubrum extorquens AM1
        gene_review: genes/METEA/mxaF/mxaF-ai-review.yaml
      - id: UniProtKB:C5B120
        label: Lanthanide-dependent methanol dehydrogenase
        gene_symbol: xoxF1
        organism: Methylorubrum extorquens AM1
        gene_review: genes/METEA/xoxF1/xoxF1-ai-review.yaml
    diverged_from_family: false
    supported_by:
      - reference_id: file:interpro/panther/PTHR32303/PTHR32303-entries.csv
        supporting_text: P15877,Quinoprotein glucose dehydrogenase
      - reference_id: file:interpro/panther/PTHR32303/PTHR32303-entries.csv
        supporting_text: C5B120,Lanthanide-dependent methanol dehydrogenase
  - subfamily_id: PANTHER:PTHR32303:SF10
    label: OUTER MEMBRANE PROTEIN ASSEMBLY FACTOR BAMB
    description: >-
      BamB, the outer-membrane lipoprotein of the beta-barrel assembly
      machinery, together with polyvinyl alcohol dehydrogenases. BamB keeps the
      beta-propeller fold but is not a PQQ dehydrogenase, so dehydrogenase,
      PQQ-binding and electron-transfer terms must not descend to it.
    representative_members:
      - id: UniProtKB:P77774
        gene_symbol: bamB
        organism: Escherichia coli K-12
    diverged_from_family: true
    divergence_description: >-
      BamB functions in outer-membrane protein assembly rather than substrate
      oxidation; it has no quinoprotein dehydrogenase activity.
    supported_by:
      - reference_id: file:interpro/panther/PTHR32303/PTHR32303-paint.tsv
        supporting_text: "PTHR32303\tPTN002088145\tGO:0051205\tP\tIBD\tfalse\tUniProtKB:P77774"
