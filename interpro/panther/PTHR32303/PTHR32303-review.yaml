    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/pedE/pedE-ai-review.yaml
  - id: UniProtKB:Q88JH0
    gene_symbol: pedH
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/pedH/pedH-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR32303:SF4
  label: QUINOPROTEIN GLUCOSE DEHYDROGENASE
  description: >-
    Methanol dehydrogenases (MxaF, XoxF), membrane glucose dehydrogenase (E. coli Gcd, P15877),
    glycerol and quinate dehydrogenases.
  representative_members:
  - id: UniProtKB:P16027
    gene_symbol: mxaF
    organism: Methylorubrum extorquens AM1
    gene_review: genes/METEA/mxaF/mxaF-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR32303:SF10
  label: OUTER MEMBRANE PROTEIN ASSEMBLY FACTOR BAMB
  description: >-
    BamB, the outer-membrane lipoprotein of the beta-barrel assembly machinery; PANTHER also
    places some polyvinylalcohol dehydrogenases here.
  diverged_from_family: true
  divergence_description: >-
    BamB keeps the PQQ-repeat propeller but has no PQQ-binding dehydrogenase function; it acts as a
    scaffold in outer-membrane protein assembly.
