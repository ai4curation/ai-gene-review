      id: UniProtKB:P14727
      label: Avirulence protein AvrBs3
      gene_symbol: avrBs3
      organism: Xanthomonas euvesicatoria
    exception_reason: >-
      AvrBs3 is the founding TAL effector, a type III-secreted transcription activator
      that binds plant promoter DNA through its central repeat domain. It has no CheB
      methylesterase domain or chemosensory role.
    supported_by:
    - reference_id: PMID:19933107
      supporting_text: TAL (transcription activator-like) effectors from plant pathogenic Xanthomonas are
        important virulence factors that act as transcriptional activators in the plant cell nucleus,
        where they directly bind to DNA via a central domain of tandem repeats.
  - member:
      id: UniProtKB:Q56830
      label: Avirulence protein AvrXa10
      gene_symbol: avrXa10
      organism: Xanthomonas oryzae pv. oryzae
    exception_reason: >-
      AvrXa10 is a TAL effector of the AvrBs3 family; like AvrBs3 it is a plant-nucleus
      transcription activator, not a receptor methylesterase.
    supported_by:
    - reference_id: PMID:19933107
      supporting_text: TAL (transcription activator-like) effectors from plant pathogenic Xanthomonas are
