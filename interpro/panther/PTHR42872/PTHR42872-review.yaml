  scope: FAMILY_WIDE
  scope_reason: >-
    Receptor demethylation is the defining activity of the CheB methylesterase domain in
    both subfamilies, and it is the activity the chemotaxis module asserts for its CheB
    annoton (grounded by E. coli CheB and KT2440 CheB1). The three TAL effector entries
    placed in SF6 are exceptions.
  supported_by:
