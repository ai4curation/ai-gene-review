family_id: PANTHER:PTHR42872
family_name: PROTEIN-GLUTAMATE METHYLESTERASE/PROTEIN-GLUTAMINE GLUTAMINASE
preferred_name: CheB chemoreceptor methylesterase/deamidase family
summary: >-
  CheB proteins are two-domain response regulators: an N-terminal receiver domain is
  phosphorylated by the CheA kinase, and this relieves inhibition of a C-terminal
  serine-hydrolase-type methylesterase domain with a Ser-His-Asp catalytic triad. The
  activated enzyme removes the methyl groups that CheR places on chemoreceptor
  glutamates, and it also deamidates specific receptor glutamines to glutamates. Because
  CheA phosphorylates CheB, receptor activity feeds back on receptor demethylation,
  closing the adaptation loop of chemosensory arrays. The family includes enteric CheB,
  the CheB paralogs of multi-system bacteria (P. putida KT2440 CheB1, P. aeruginosa
  CheB1-CheB3) and M. xanthus FrzG of the Frz gliding pathway. PANTHER also places three
  Xanthomonas TAL effector proteins in SF6.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized CheB-domain member in SF6 and SF3 is a receptor methylesterase.
  The exceptions are the Xanthomonas TAL effectors AvrBs3, AvrXa10 and PthXo1 (SF6),
  type III-secreted transcription activators of plant genes with no CheB domain. The
  cached PAINT slice also carries two nodes (PTN000724188, PTN002403766) seeded by
  OmpR/ArcA-type and fungal response regulators that are not part of the current
  PTHR42872 tree; they do not propagate to CheB.
