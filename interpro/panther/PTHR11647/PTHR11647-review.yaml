summary: HYDRANTOINASE/DIHYDROPYRIMIDINASE FAMILY MEMBER (PANTHER:PTHR11647) is characterized in PANTHER
  PAINT across 3 ancestral PTN node(s) (PANTHER:PTN000182450, PANTHER:PTN000182670, PANTHER:PTN002616333)
  with 5 IBD node assertion(s) and 2 term(s) carrying negated IRD/IKR branch blocks, covering dihydropyrimidinase
  activity (GO:0004157, MF), pyrimidine nucleobase catabolic process (GO:0006208, BP), cytosol (GO:0005829,
  CC), hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in cyclic amides (GO:0016812,
  MF) and 1 additional GO term(s).
