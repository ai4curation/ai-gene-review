  catabolic process (GO:0006208, BP), cytosol (GO:0005829, CC), hydrolase activity, acting on carbon-nitrogen
  (but not peptide) bonds, in cyclic amides (GO:0016812, MF) and 1 additional GO term(s)) are conserved
  across the primary ancestral clade, with lineage-specific variation reflected by IBD assertions distributed
  across 3 PTN nodes (PANTHER:PTN000182450, PANTHER:PTN000182670, PANTHER:PTN002616333); negated IRD/IKR
  loss assertion(s) on GO:0004157, GO:0006208; member-specific pruning exception(s) on GO:0004157, GO:0016812.
