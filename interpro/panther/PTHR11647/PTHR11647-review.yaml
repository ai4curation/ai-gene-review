family_id: PANTHER:PTHR11647
family_name: HYDRANTOINASE/DIHYDROPYRIMIDINASE FAMILY MEMBER
preferred_name: Hydantoinase/dihydropyrimidinase and CRMP family
summary: >-
  Metal-dependent cyclic amidohydrolases of the amidohydrolase superfamily and their inactive paralogs.
  Active members include the eukaryotic dihydropyrimidinases (human DPYS, plant, yeast, Dictyostelium
  and nematode enzymes) and bacterial dihydropyrimidinases and D-hydantoinases such as Pseudomonas putida
  KT2440 PydB, which open the 5,6-dihydropyrimidine ring in the second step of reductive pyrimidine degradation.
  The family also contains the vertebrate collapsin response mediator proteins (CRMP1 and DPYSL2-5) and
  C. elegans UNC-33, which keep the fold but lost catalysis and act in axon guidance and cytoskeletal
  regulation, plus bacterial isoaspartyl dipeptidase, D-phenylhydantoinase, acyl-D-amino-acid deacylases,
  enamidase and archaeal formylmethanofuran dehydrogenase subunit FwdA.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Dihydropyrimidinase activity arose at eukaryotic node PTN000182450 and is retained by DPYS but lost
  (IKR) in each vertebrate CRMP/DPYSL clade. SF1, named for CRMPs, is a catch-all holding active bacterial
  PydB-type dihydropyrimidinases, eukaryotic DHPs from plants, yeast and Dictyostelium, E. coli HyuA (a
  D-phenylhydantoinase with no activity on dihydropyrimidines), isoaspartyl dipeptidase and N-acyl-D-amino-acid
  deacylases, so no subfamily boundary separates active dihydropyrimidinases from their relatives.
