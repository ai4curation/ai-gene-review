family_id: PANTHER:PTHR42848
family_name: FAMILY NOT NAMED
preferred_name: Bacterial RuvB Holliday-junction branch-migration motor family
summary: 'RuvB, the AAA+ ATPase motor subunit of the bacterial RuvAB Holliday-junction branch-migration
  complex. Two RuvB hexameric rings bind opposite duplex arms of a junction held open by RuvA and use
  ATP hydrolysis to pump DNA through the complex, migrating the crossover so that the RuvC resolvase can
  cleave it. The family is bacterial and functionally uniform: PANTHER''s own family name is unassigned,
  but its single subfamily is named for RuvB and every reviewed member is a RuvB.'
functional_coherence: COHERENT
coherence_reason: The family has one subfamily, PTHR42848:SF1 (HOLLIDAY JUNCTION BRANCH MIGRATION COMPLEX
  SUBUNIT RUVB). All 709 reviewed members in the cached inventory are in SF1, and 707 are named Holliday
  junction branch migration complex subunit RuvB (the other two are numbered RuvB paralogs 1 and 2). All
  PAINT assertions sit on one bacterial node, PTN000349951, seeded by E. coli RuvB.
