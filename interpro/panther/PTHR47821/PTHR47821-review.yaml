family_id: PANTHER:PTHR47821
family_name: PHOSPHOGLYCERATE MUTASE FAMILY PROTEIN
summary: The Arabidopsis member AT4G38370 is associated with a phosphoglycerate-mutase-related enzyme
  fold. Its physiological substrate and the functional uniformity of its PANTHER family are unresolved
  from the available target evidence.
functional_coherence: UNKNOWN
coherence_reason: The selected plant protein retains the RHG catalytic-histidine motif of the histidine-phosphatase
  fold. Exploratory alignment to experimentally characterized zebrafish TIGAR preserves two catalytic
  positions but is too divergent to establish a complete pocket or substrate specificity. Primary TIGAR
  enzymology illustrates substrate discrimination within the structural superfamily; no target-specific
  reaction is established.
subfamilies:
