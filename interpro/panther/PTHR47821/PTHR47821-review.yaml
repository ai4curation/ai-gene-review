  scope: UNRESOLVED
  scope_reason: The target phosphoglycerate-mutase-like name denotes a fold relationship and does not
    demonstrate phosphoglycerate turnover. Its catalytic motif supports plausible enzymatic activity,
    but neither a target assay nor a resolved substrate-specific evolutionary inference establishes this
    reaction for the plant branch.
