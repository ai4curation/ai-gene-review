  name:
    name: Maintenance of mitochondrial morphology protein 1
    short: MMM1
  description:
  - text: The MMM1 family proteins are components of the ERMES/MDM complex, which
      functions as a molecular tether connecting the endoplasmic reticulum (ER) to
      mitochondria. The family plays a crucial role in the control of mitochondrial
      morphology, protein biogenesis, and nonvesicular lipid trafficking between the
      ER and mitochondria. The MMM1 family is involved in the major beta-barrel assembly
      pathway for the biogenesis of all outer membrane beta-barrel proteins, operating
      in a late step subsequent to the SAM complex. Additionally, the MMM1 family
      contributes to the TOM40-specific pathway, following the MDM12-MMM1 complex's
      action. These proteins are essential for the establishment and maintenance of
      mitochondrial structure and the preservation of mtDNA nucleoids.
