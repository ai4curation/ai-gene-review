review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Written alongside the human PEX16 gene review (genes/human/PEX16/PEX16-ai-review.yaml).
  All node ids, seed lists, taxa and snapshot dates are verbatim from the cached
  PTHR13299-paint.tsv; member composition and the single represented subfamily come from the
  fetched PTHR13299-entries.csv, and family and subfamily names from panther.obo. The Pex36
  observation comes from the cached deep-research report's citation of Farre et al. (2017)
  and is treated as background, not as an assertion about any particular member of this
  family.

  The project premise needs correcting for this family too, and more sharply than for
  PTHR19332. PEX16 is on the human "no-IBA" list, and the source spreadsheet row reads
  "uncharacterized pthr13299 / No data found". Neither is true now: PTN000329346 carries two
  IBDs, human PEX16 receives both as IBAs, and the peroxisome-organization row was refreshed
  on 2025-09-03, after the list was compiled. The family is PAINT-curated and the curation is
  current.

  The real gap is narrower and is invisible to a has-IBA test: PTHR13299 has no
  molecular-function IBD at any node, so human PEX16's only MF annotations are three
  uninformative protein-binding IPIs, and the two IBDs that do exist are pitched at the
  generic GO:0007031 level rather than at the specific membrane-biogenesis terms the human
  gene holds experimentally. That pitch is a defensible conservative call, not an error -
  the mammalian mechanism has not been shown for the plant and fungal members - but it does
  mean the phylogenetic record says considerably less about Pex16 than the experimental
  record does. The four UNRESOLVED term assessments above are what a curator with the
  alignment and the non-mammalian literature in view could plausibly resolve.

  No residue_sites. The functionally interesting element - the cytosolic loop of PEX16
  (roughly residues 132-214) that binds a pocket on PEX3 - is known from an AlphaFold
  interface prediction with BRET validation of deletions and point mutants, not from a
  characterised residue set, and no UniProt binding-site feature covers it. Recording an
  approximate predicted interface as positions in a machine-checked ResidueSite would assert
  more precision than the evidence carries.
