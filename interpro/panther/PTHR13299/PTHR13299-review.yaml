family_id: PANTHER:PTHR13299
family_name: PEROXISOMAL MEMBRANE PROTEIN PEX16
preferred_name: Peroxin-16 (Pex16) peroxisomal membrane biogenesis factor family
summary: >-
  Family of Pex16/peroxin-16, one of the three "early" peroxins - with Pex3 and Pex19 -
  that build the peroxisomal membrane rather than filling it. Pex16 is an integral membrane
  protein with two transmembrane segments and both termini facing the cytosol. In mammals it
  is inserted cotranslationally into the ER, exported through Sec16B-dependent ER exit sites,
  and acts at the peroxisomal membrane as the anchoring receptor for Pex3, holding the
  Pex3-Pex19 carrier where newly synthesised peroxisomal membrane proteins can be delivered.
  Its loss is unusually severe among the peroxins: PEX16-deficient patient cells have no
  detectable peroxisomal membranes at all - not even the "ghosts" seen in matrix-import
  mutants - and re-expressing PEX16 rebuilds peroxisomes de novo, with membrane protein
  import preceding matrix protein import. Matrix import failure in PEX16-null cells is
  therefore a downstream consequence of having no organelle, not a function of Pex16.
  The family spans eukaryotes - the fetched slice runs from Yarrowia and S. pombe through
  Dictyostelium and Arabidopsis to fish, frog and mammals - and all reviewed members sit in
  a single subfamily. Taxonomic coverage in fungi is patchy, and at least one yeast lineage
  performs the equivalent ER-to-peroxisome PMP trafficking step with a non-orthologous
  protein (Pex36), so the family does not coincide with the function.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All sampled members are Pex16 orthologues acting in peroxisome membrane biogenesis, so the
  generic compartment and organelle-organization assertions are safe family-wide. Two things
  keep it from being called coherent outright. First, the mechanistic detail on which the
  mammalian picture rests - cotranslational ER insertion, Sec16B-dependent ER export, and
  receptor activity toward Pex3 - is documented in mammalian cells and has not been shown for
  the plant, amoebozoan or fungal members, so mechanism-level terms should not be assumed to
  travel with the family. Second, the family's coverage is uneven: Saccharomyces cerevisiae
  has no member in the fetched slice, and a functional homolog of mammalian PEX16 in another
  yeast is reported to be Pex36, a protein outside this family. Function and family
  membership are therefore not in one-to-one correspondence here.
