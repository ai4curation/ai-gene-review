node_assessments:
  - node_id: PANTHER:PTN000329346
    asserted_term:
      id: GO:0007031
      label: peroxisome organization
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20250903"
    seeds:
      - id: AGI_LocusCode:AT2G45690
      - id: FB:FBgn0037019
      - id: UniProtKB:Q9Y5Y5
        label: Peroxisomal membrane protein PEX16
        gene_symbol: PEX16
        organism: Homo sapiens
        gene_review: genes/human/PEX16/PEX16-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      Well placed, and notable for what the curator chose not to assert. The seeds span
      plant (AT2G45690), insect (FBgn0037019) and human, three lineages separated by the
      whole eukaryotic crown, which is the right evidential shape for an assertion at
      Eukaryota. Just as important, the term used is the generic parent GO:0007031 rather
      than any of the specific terms the human gene carries experimentally
      (GO:0016557 peroxisome membrane biogenesis, GO:0032581 ER-dependent peroxisome
      organization, GO:0045046 protein import into peroxisome membrane). Those specifics
      rest on mammalian cell biology; propagating them family-wide would have been the
      classic over-propagation error, and the conservative choice made here avoids it.
      Human PEX16 receives this IBA and it is consistent with its own IMP record
      (PMID:9837814, PMID:19479899, PMID:15813749). Q9Y5Y5 appearing among its own seeds is
      expected - the human experimental annotation is one of the descendant evidences behind
      the IBD - and is not circular.
  - node_id: PANTHER:PTN000329346
    asserted_term:
      id: GO:0005778
      label: peroxisomal membrane
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20230110"
    seeds:
      - id: MGI:MGI:1338829
      - id: RGD:1311372
      - id: UniProtKB:Q9Y5Y5
        label: Peroxisomal membrane protein PEX16
        gene_symbol: PEX16
        organism: Homo sapiens
        gene_review: genes/human/PEX16/PEX16-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      Sound, though this is the weaker of the two rows and worth stating why it still holds.
      All three seeds are mammalian (mouse, rat, human), so on seeds alone the assertion is
      placed considerably deeper than its direct evidence. It is nonetheless right, for two
      reasons. The compartment claim is not separable from the function claim already placed
      at the same node on plant/fly/human seeds - a Pex16 that organizes the peroxisome
      does so from the peroxisomal membrane - and peroxisomal membrane residence is the
      property by which every member of this family is identified, with no member lineage
      showing evidence of relocation. Human PEX16's own topology and localization evidence is
      direct and independent (PMID:12223482, PMID:16717127). Not marked TOO_DEEP: a narrower
      placement would leave the plant and fungal members with a function but no compartment.

term_assessments:
  - assessed_term:
      id: GO:0016557
      label: peroxisome membrane biogenesis
    scope: UNRESOLVED
    scope_reason: >-
      The single most valuable candidate for this family and the reason it is worth
      revisiting. It is the term that actually names what Pex16 does, is held by human PEX16
      as IMP from two independent studies, and is more informative than the generic
      GO:0007031 currently at the node. Left unresolved rather than granted because the
      supporting phenotype - complete absence of peroxisomal membranes on loss, rebuilt on
      complementation - has been demonstrated in mammalian cells, and this review has no
      evidence in hand for the plant, amoebozoan or fungal members. A PAINT curator with the
      family alignment and the non-mammalian experimental record in view is in a position to
      decide this; asserting a scope from the mammalian data alone would be guessing at the
      node placement.
    supported_by:
      - reference_id: PMID:9922452
        supporting_text: we report here a Zellweger syndrome patient (PBD061) with an unusual
          cellular phenotype, an inability to import peroxisomal membrane proteins
  - assessed_term:
      id: GO:0045046
      label: protein import into peroxisome membrane
    scope: UNRESOLVED
    scope_reason: >-
      The other strong candidate, and the one that would give this family a directional
      process term rather than a bare organelle-organization term. Human PEX16 holds it as
      IMP: dysfunctional PEX16 variants block localization of PEX14, PEX13 and PMP70 to
      peroxisomes. Reported as broadly conserved - the equivalent ER-to-peroxisome PMP
      trafficking step is described in yeast - but with the caveat that in at least one yeast
      it is performed by Pex36, a protein outside PTHR13299, which means the process is not
      a safe proxy for family membership and the converse propagation is not automatic
      either. Needs a curator judgement on the node.
  - assessed_term:
      id: GO:0032581
      label: ER-dependent peroxisome organization
    scope: UNRESOLVED
    scope_reason: >-
      Human PEX16 holds this as IDA and it is mechanistically the most specific thing known
      about the protein: cotranslational insertion into the ER, recruitment of PEX3 and PMP34
      to ER membranes, and Sec16B-dependent export. The ER route is precisely the part of the
      mechanism whose generality across eukaryotes is still debated in the literature, so this
      is the term least safe to place deep and the one most likely to over-propagate if
      granted family-wide. Recorded here so a future PAINT curator sees that it was
      considered and deliberately not granted.
    supported_by:
      - reference_id: PMID:16717127
        supporting_text: We provide direct evidence that peroxisomes can arise de novo from
          the ER in both normal and peroxisome-less mutant cells. We further show that PEX16
          regulates this process by being cotranslationally inserted into the ER and serving
          to recruit other peroxisomal membrane proteins to membranes.
  - assessed_term:
      id: GO:0060090
      label: molecular adaptor activity
    scope: UNRESOLVED
    scope_reason: >-
      PTHR13299 has no molecular-function IBD at any node, so human PEX16 receives no MF IBA
      at all - its only MF annotations in GOA are three uninformative protein-binding IPIs.
      The human gene review proposes molecular adaptor activity as the core MF, on the basis
      that membrane-anchored PEX16 binds PEX3 through a cytosolic loop while PEX19 binds PEX3
      on the opposite face, so PEX16 holds the carrier at the membrane. That reading rests on
      mammalian co-immunoprecipitation and semi-intact-cell import assays plus a
      structure-prediction/BRET interface study, none of it extended to non-mammalian members,
      so the scope cannot be set here. Flagged as the family's clearest annotation gap.
    supported_by:
      - reference_id: PMID:19114594
        supporting_text: we demonstrate that Pex16p functions as the Pex3p-docking site and
          serves as the peroxisomal membrane receptor that is specific to the Pex3p-Pex19p
          complexes
  - assessed_term:
      id: GO:0016558
      label: protein import into peroxisome matrix
    scope: UNRESOLVED
    scope_reason: >-
      Scoped UNRESOLVED only because the enum cannot express "safe solely under an
      acts_upstream_of_or_within qualifier"; the judgement itself is settled. Must not be
      propagated as an involved_in claim: matrix import fails in PEX16-null cells because
      there is no membrane to import into, and it recovers only after membrane assembly
      and PMP import have happened — the matrix import machinery is the PEX5/PEX13/PEX14
      docking-translocation module, not Pex16. Human PEX16 legitimately retains its
      PMID:9922452 annotation (KEEP_AS_NON_CORE) precisely because the GOA qualifier
      acts_upstream_of_or_within already encodes the indirect relation. An IBD here would
      silently convert that upstream-of relation into an involved_in claim family-wide,
      and PAINT cannot carry the qualifier.
    supported_by:
      - reference_id: PMID:9922452
        supporting_text: Peroxisome synthesis and peroxisomal membrane protein import could
          be detected within 2-3 h of PEX16 injection and was followed by matrix protein
          import
  - assessed_term:
      id: GO:0005829
      label: cytosol
    scope: NOT_APPLICABLE
    scope_reason: >-
      Reaches human PEX16 only through Reactome reactions that model it as a class I PMP with
      a cytosolic PEX19-bound intermediate. Pex16 does not take that route: it is inserted
      cotranslationally into the ER and fractionates entirely into the non-soluble fraction.
      Cytosolic exposure of its N- and C-terminal domains is a topology fact, not a
      localization. Removed in the human gene review and not safe anywhere in this family.

