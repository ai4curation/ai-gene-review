family_id: PANTHER:PTHR12862
family_name: BADF TYPE ATPASE DOMAIN-CONTAINING PROTEIN
preferred_name: N-acetylglucosamine kinase (NAGK) family
summary: >-
  BadF/BadG/BcrA-type ATPase-fold kinases that phosphorylate N-acetylglucosamine to GlcNAc 6-phosphate,
  salvaging GlcNAc into the hexosamine pathway. Human NAGK also phosphorylates N-acetylmannosamine
  and muramyl dipeptide.
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF0) of animal NAGKs.
