    gene_review: genes/human/PKDREJ/PKDREJ-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    PKDREJ is a sperm-associated REJ-like membrane protein; calcium-channel activity and
    mechanosensation are not directly established.
