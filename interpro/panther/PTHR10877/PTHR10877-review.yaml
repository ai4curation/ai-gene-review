family_id: PANTHER:PTHR10877
family_name: POLYCYSTIN FAMILY MEMBER
summary: >-
  PTHR10877 contains PKD2/TRPP cation channels and larger PKD1-like receptor-channel
  partners. Human PKD2 and PKD2L1 are directly characterized nonselective cation
  channels, and human PKD1L3 coassembles with PKD2L1 as a pore-forming subunit in an
  acid-activated heteromeric channel. PKD1L2, PKD2L2, and PKDREJ retain polycystin
  membrane architecture but are much less characterized: current evidence supports them
  as membrane proteins but not as standalone calcium channels or mechanical-stimulus
  detectors.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Membrane localization is family-wide, but channel activity and sensory processes split
  by branch. PKD2-family TRPP proteins have directly assayed cation-channel activity,
  PKD1L3 contributes to an acid-gated PKD2L1 channel, and the receptor-like PKD1L2 and
  PKDREJ branches lack direct ion-channel evidence. PKD2L2 is also not established as an
  active calcium channel, so neither calcium-channel activity nor mechanosensation is
  safe at the family root.
