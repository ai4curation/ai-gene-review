  diverged_from_family: true
  divergence_description: >-
    PKD1L3 has a direct cation-channel role only as a PKD2L1 partner; sour-taste
    receptor claims remain physiologically disputed, and no reviewed evidence supports
    a mechanical-stimulus role.
- subfamily_id: PANTHER:PTHR10877:SF185
