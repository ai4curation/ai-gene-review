  diverged_from_family: true
  divergence_description: >-
    PKD2L2 has TRPP-family membrane topology, but direct human evidence indicates no
    spontaneous channel activity and does not establish the root calcium-channel or
    mechanosensory assertions.
- subfamily_id: PANTHER:PTHR10877:SF134
  label: POLYCYSTIN-1-LIKE PROTEIN 2
  description: PKD1L2 branch, represented in human by receptor-like PKD1L2.
  representative_members:
  - id: UniProtKB:Q7Z442
    label: Polycystin-1-like protein 2
    gene_symbol: PKD1L2
    organism: Homo sapiens
    gene_review: genes/human/PKD1L2/PKD1L2-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    PKD1L2 is a large receptor-like polycystin with no direct evidence for
    calcium-channel activity or mechanical-stimulus detection.
- subfamily_id: PANTHER:PTHR10877:SF136
  label: POLYCYSTIN-1-LIKE PROTEIN 3
  description: PKD1L3 branch that forms an acid-activated heteromeric channel with PKD2L1.
  representative_members:
  - id: UniProtKB:Q7Z443
    label: Polycystin-1-like protein 3
    gene_symbol: PKD1L3
    organism: Homo sapiens
    gene_review: genes/human/PKD1L3/PKD1L3-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    PKD1L3 has a direct cation-channel role only as a PKD2L1 partner; sour-taste
    receptor claims remain physiologically disputed, and no reviewed evidence supports
    a mechanical-stimulus role.
- subfamily_id: PANTHER:PTHR10877:SF185
  label: POLYCYSTIN FAMILY RECEPTOR FOR EGG JELLY
  description: PKDREJ branch, represented in human by testis-enriched PKDREJ.
  representative_members:
