residue_sites:
- site_id: tmd2_his
  label: HRG1 TMD2 histidine
  description: >-
    Yuan et al. 2012 report that a histidine in the predicted second transmembrane domain (TMD2) is needed
    for heme transport by worm HRG-1 and human HRG1. In human HRG1 (Q6P1K1), UniProt's second helical
    segment is residues 40-60, and its only histidine is His56, which is therefore the residue meant. The
    control positions were read from pairwise alignments. Mouse Slc48a1 has His56. Zebrafish slc48a1b has
    His54. Worm HRG-1 has His90, inside its own UniProt TMD2 (71-91). Alignment of the divergent nematode
    paralogs is unreliable in this region: HRG-4 aligns Asn and HRG-6 aligns Phe. This fits the report that
    HRG-4 depends on a different histidine, so the site is not required family-wide.
  anchor:
    id: UniProtKB:Q6P1K1
    label: Heme transporter HRG1
    gene_symbol: SLC48A1
    organism: Homo sapiens
  anchor_sequence_version: 1
  residues:
  - position: 56
    expected:
    - H
    role: putative heme-coordinating histidine in TMD2
  required_for:
  - term:
      id: GO:0015232
      label: heme transmembrane transporter activity
    strength: CONTRIBUTES
    rationale: >-
      Mutating the TMD2 histidine abolishes transport by human HRG1 and by worm HRG-1, consistent with it
      coordinating heme as the heme crosses the membrane. HRG-4 transports heme through an E2-loop histidine
      instead, so loss of this site in another subfamily does not by itself mean loss of transport. Its
      strength is therefore set below REQUIRED.
    supported_by:
    - reference_id: PMID:22174408
      supporting_text: mutation of the synonymous histidine in TMD2 of hHRG-1 eliminates heme transport activity
    - reference_id: PMID:22174408
      supporting_text: the plasma membrane CeHRG-4 transports heme by utilizing a histidine in the exoplasmic
        (E2) loop
  site_source: LITERATURE
  positive_controls:
  - id: UniProtKB:Q21642
    gene_symbol: hrg-1
    organism: Caenorhabditis elegans
    control_position: 90
    control_residue: H
  - id: UniProtKB:Q7T3B2
    gene_symbol: slc48a1b
    organism: Danio rerio
    control_position: 54
    control_residue: H
