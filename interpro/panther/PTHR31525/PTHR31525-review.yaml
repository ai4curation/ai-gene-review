family_id: PANTHER:PTHR31525
family_name: HEME TRANSPORTER HRG1
preferred_name: HRG1-related heme permease family (SLC48A1 / HRG-1, HRG-4, HRG-5, HRG-6)
summary: >-
  The HRG1-related proteins are small membrane proteins with four transmembrane helices. They bind heme
  and move it across membranes. The family was discovered in the heme auxotroph Caenorhabditis elegans.
  HRG-1 sits on endosomal and lysosomal membranes, and its paralog HRG-4 sits on the plasma membrane;
  both import heme. Vertebrates have a single ortholog, HRG1/SLC48A1 (two in zebrafish and Xenopus). It
  resides in endolysosomal membranes, and in macrophages it moves heme released from digested hemoglobin
  out of the phagolysosome into the cytosol during erythrophagocytosis. Heme transport has been shown in
  heme-deficient yeast for worm HRG-1 and HRG-4, human HRG1 and both zebrafish paralogs. The family is
  almost entirely metazoan: besides animals it has two choanoflagellate members and one Acanthamoeba
  member, and there are none in Dictyostelium, fungi or plants. PANTHER defines four subfamilies. SF1 is
  the HRG1 orthologs from nematodes to vertebrates. SF2, SF3 and SF4 are the nematode paralogs HRG-6,
  HRG-4 and HRG-5.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The molecular function is coherent. Heme transport has been shown in both experimentally studied
  subfamilies (SF1 HRG1 orthologs and SF3 HRG-4), and the two use partly different conserved residues
  to do it. Subcellular location is not coherent. HRG-1/HRG1 (SF1) is endosomal and lysosomal, with at
  most a minor surface pool, while HRG-4 (SF3) is a plasma-membrane importer. HRG-5 (SF4) and HRG-6
  (SF2) have no experimental characterization in the literature cached here.
