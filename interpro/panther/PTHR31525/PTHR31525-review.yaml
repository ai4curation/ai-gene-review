notes: >-
  The PAINT slice (PTHR31525-paint.tsv) was already present and holds one node, PTN002418776, with five
  IBDs and no taxon. PAINT_TreeGrafter_Annotations_TOTAL (PANTHER 19.0) identifies the node as AN0, the
  family root. The leaf GAF confirms that its IBAs reach all four subfamilies, including hrg-4, hrg-5 and
  hrg-6, as well as the choanoflagellate Monosiga brevicollis A9V514. Seeds were mapped with UniProt.
  WBGene00019830 is hrg-1 (R02E12.6), WBGene00009493 is hrg-4 (F36H1.5), MGI:1914989 is mouse Slc48a1,
  and ZDB-GENE-030131-8226 and ZDB-GENE-040718-121 are zebrafish slc48a1b and slc48a1a. The OpenScientist
  distribution analysis (file listed in references) found 1,311 metazoan, 2 choanoflagellate and 1 Acanthamoeba
  member among 1,314 PANTHER members, and none in Dictyostelium. The family's role in phagolysosomal heme
  export is therefore documented only in animals and should not be extended to protists. The suggested fix
  for the lysosomal-membrane row is to move the IBD to the SF1 clade node or to add an IRD on the HRG-4 branch.
