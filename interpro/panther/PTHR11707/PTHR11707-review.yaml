- assessed_term:
    id: GO:0030287
    label: cell wall-bounded periplasmic space
  scope: UNRESOLVED
  scope_reason: >-
    Correct for the S. cerevisiae ASP3 copies (secreted, cell-wall associated asparaginase
    II; the module's cell_wall_asparaginase location) but wrong for their cytoplasmic
    paralogue ASP1, which is in the same subfamily. The ASP3 locus is a recent horizontal
    acquisition absent from 128 other fungal genomes, so the location cannot be read from
    fungal ancestry. Applicability is member-specific and no PANTHER subfamily separates it;
    see the TOO_DEEP assessment of PTN000194670. The localisation of the four S. pombe
    paralogues that also inherit it is unverified.
