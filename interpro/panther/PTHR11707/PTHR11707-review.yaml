node_assessments:
- node_id: PANTHER:PTN000194670
  asserted_term:
    id: GO:0030287
    label: cell wall-bounded periplasmic space
  paint_snapshot: '20260224'
  node_taxon:
    id: NCBITaxon:4890
    label: Ascomycota
  seeds:
  - id: SGD:S000004145
    label: ASP3-1
    organism: Saccharomyces cerevisiae
  - id: SGD:S000004147
    label: ASP3-2
    organism: Saccharomyces cerevisiae
  - id: SGD:S000004148
    label: ASP3-3
    organism: Saccharomyces cerevisiae
  - id: SGD:S000004150
    label: ASP3-4
    organism: Saccharomyces cerevisiae
  assessment: TOO_DEEP
  assessment_reason: >-
    All four seeds are identical copies of one horizontally acquired S. cerevisiae locus, so
    they support the location only for the ASP3 lineage. Placing it at an Ascomycota node
    makes the cytoplasmic paralogue ASP1 (SF28) and the four S. pombe asparaginases
    (SPAC186.03, SPAC977.12, SPBPB21E7.09, SPBPB8B6.05c) inherit cell wall-bounded periplasmic
    space. ASP1 is cytoplasmic and its gene review removes this IBA
    (propagation_review WRONG_ORTHOLOG_OR_PARALOG / COMPARTMENT_OR_COMPLEX_MISMATCH).
    Recommended fix: move the IBD to the ASP3 leaf clade, or add an IRD on the ASP1 branch.
    No subfamily is listed as affected because ASP1 and ASP3 share SF28.
  supported_by:
  - reference_id: PMID:22776361
    supporting_text: ASP1 is located on chromosome IV and encodes for cytosolic l-asparaginase I,
  - reference_id: PMID:8026756
    supporting_text: confirms that ASP1 is the structural gene encoding cytoplasmic ASP I in
      S. cerevisiae.
- node_id: PANTHER:PTN008524626
  asserted_term:
    id: GO:0004067
    label: asparaginase activity
  paint_snapshot: '20260528'
  seeds:
  - id: RGD:708388
    organism: Rattus norvegicus
  - id: UniProtKB:P0A962
    label: ansA
    organism: Escherichia coli K-12
  - id: UniProtKB:P9WPX5
    label: ansA
    organism: Mycobacterium tuberculosis H37Rv
  - id: UniProtKB:Q5JIW4
    label: TK1656
    organism: Thermococcus kodakarensis
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Placement is defensible for the type I asparaginases (seeds from bacteria, an archaeal
    L-asparaginase and rat), but the node also covers the archaeal GatD subunits, six of
    which inherit asparaginase activity (M. jannaschii, M. acetivorans, S. solfataricus, T.
    kodakarensis, H. salinarum, P. aerophilum GatD). GatD is a GatDE-dependent glutaminase
    that supplies ammonia for Glu-tRNA(Gln) transamidation, not a free asparaginase.
    Recommended fix: an IRD on the GatD clade. Human ASPG also inherits this term
    correctly. No subfamily is listed as affected because GatD shares SF28 with true
    asparaginases.
  supported_by:
  - reference_id: PMID:15611111
    supporting_text: The fact that only Glu-tRNA(Gln) but
      not tRNA(Gln) could activate the glutaminase activity of GatD suggests that
      glutamine hydrolysis is coupled tightly to transamidation.
