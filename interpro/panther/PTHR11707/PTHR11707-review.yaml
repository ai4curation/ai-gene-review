  - id: SGD:S000004145
    label: ASP3-1
    organism: Saccharomyces cerevisiae
  - id: UniProtKB:P00805
    label: ansB
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    Recipients are the fungal enzymes and bacterial type II asparaginases (26 IBA rows, no
    GatD). The ASP1, ASP3-1 and ASP3-2 gene reviews accept both this term and
    L-asparagine catabolic process from the same node.
