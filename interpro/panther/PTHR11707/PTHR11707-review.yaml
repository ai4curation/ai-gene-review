family_id: PANTHER:PTHR11707
family_name: L-ASPARAGINASE
preferred_name: Type I/II L-asparaginases and asparaginase-like GatD
summary: >-
  Asparaginase/glutaminase-fold amidohydrolases that hydrolyse L-asparagine to L-aspartate
  and ammonium (EC 3.5.1.1). In the UniProt/InterPro member inventory all reviewed members
  fall in a single subfamily, SF28 (official name "60 KDA LYSOPHOSPHOLIPASE"), which mixes
  bacterial cytoplasmic type I enzymes (E. coli ansA), periplasmic type II enzymes (E. coli
  ansB, Pseudomonas glutaminase-asparaginases), the fungal enzymes (S. cerevisiae cytoplasmic
  ASP1 and cell-wall ASP3-1..4, four S. pombe paralogues), vertebrate ASPG (60 kDa
  lysophospholipase) and the archaeal GatD subunit of the Glu-tRNA(Gln) amidotransferase
  GatDE.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Asparagine hydrolysis is the shared function of the bacterial, fungal and animal members,
  but the single PANTHER subfamily hides two kinds of divergence. (1) Archaeal GatD (38 of
  74 reviewed members) is a subunit of the tRNA-dependent amidotransferase GatDE whose
  glutaminase activity is only expressed with GatE and Glu-tRNA(Gln); it is not a free
  asparaginase. (2) Compartment differs between paralogues: S. cerevisiae ASP1 and E. coli
  ansA are cytoplasmic, while ASP3 and E. coli ansB are secreted/periplasmic, a split that
  arose independently in prokaryotes and eukaryotes. Neither divergence is marked by a
  subfamily boundary, so location terms and GatD exclusions must be handled per node or per
  member. Vertebrate ASPG adds a lysophospholipase activity to the asparaginase.
subfamilies:
- subfamily_id: PANTHER:PTHR11707:SF28
  label: 60 KDA LYSOPHOSPHOLIPASE
  description: >-
    The only subfamily in the reviewed inventory. Holds every module representative (ASP1,
    ASP3-1..4, E. coli ansA and ansB) together with archaeal GatD and vertebrate ASPG, so it
    is not a functional unit by itself.
