notes: >-
  Used by modules/aspartate_asparagine_metabolism.yaml for both asparaginase variants
  (intracellular_asparaginase_activity, cell_wall_asparaginase_activity). Classification
  discrepancy: UniProt DR PANTHER lines and the InterPro member inventory place ASP1,
  ASP3-1..4, E. coli ansB, B. subtilis ansZ and the four S. pombe asparaginases in
  PTHR11707:SF28, but the PANTHER 19.0 HMM classification files place exactly these
  (type II-like and fungal) members in PTHR43828:SF13 (L-ASPARAGINASE 1-RELATED), a family
  that otherwise holds fungal APSES/MBF transcription-factor subfamilies; E. coli ansA, B.
  subtilis ansA and human ASPG stay in PTHR11707:SF28 in both sources. The PTHR11707 PAINT
  tree still contains the fungal and type II members (they receive its IBAs). The module's
  use of PTHR11707 is therefore right by UniProt and PAINT but not by the PANTHER 19.0 HMM
  scores. The module's GO-CAM note that YeastPathways puts the ASP3 enzymes in cytosol is a
  separate (GO-CAM) error. S. cerevisiae ASP1 gene review REMOVEs the PTN000194670 IBA; this
  review agrees.
