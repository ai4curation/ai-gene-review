- node_id: PANTHER:PTN008446553
  asserted_term:
    id: GO:0009507
    label: chloroplast
  evidence: IBD
  paint_snapshot: '20250313'
  seeds:
  - id: AGI_LocusCode:AT2G26540
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node (SAR/HA supergroup in the PANTHER tree) is right for the land-plant and green
    algal enzymes, which are chloroplast-imported, but it also covers a Plasmodium
    falciparum leaf, whose plastid is a non-photosynthetic apicoplast rather than a
    chloroplast, and a diatom leaf with a secondary plastid. The chloroplast assertion
    should stop at the Viridiplantae part of the clade. The affected leaves are in SF1
    together with the bacterial members, so no subfamily can be named, and no reviewed
    gene in this repository lies under the node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR38042/PTHR38042-paint.tsv
    supporting_text: "PTHR38042\tPTN008446553\tGO:0009507\tC\tIBD\tfalse\tAGI_LocusCode:AT2G26540"
- node_id: PANTHER:PTN008446553
  asserted_term:
    id: GO:0006780
    label: uroporphyrinogen III biosynthetic process
  evidence: IBD
  paint_snapshot: '20250313'
  seeds:
  - id: AGI_LocusCode:AT2G26540
  assessment: SOUND
  assessment_reason: >-
    The process is the direct product of the conserved reaction. Placing it only at the
    eukaryotic plastid node under-propagates it (bacterial members do the same reaction),
    but the placement is not wrong for any descendant.
  supported_by:
