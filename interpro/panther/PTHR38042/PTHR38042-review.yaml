family_id: PANTHER:PTHR38042
family_name: UROPORPHYRINOGEN-III SYNTHASE, CHLOROPLASTIC
preferred_name: Prokaryotic and plastid uroporphyrinogen-III synthase (HemD) family
summary: >-
  Uroporphyrinogen-III synthases (HemD, EC 4.2.1.75) of bacteria, archaea and plastids.
  They cyclize the linear tetrapyrrole hydroxymethylbilane, with inversion of ring D, to the
  macrocycle uroporphyrinogen III, the common precursor of heme, siroheme, chlorophyll and
  cobalamin. Bacterial members (E. coli, Salmonella, Pseudomonas, Bacillus subtilis HemD)
  are cytoplasmic; the plant and algal enzymes (Arabidopsis, rice) are nuclear-encoded and
  imported into the chloroplast. The eukaryotic cytosolic UROS enzymes of animals and fungi
  are classified in the separate PANTHER family PTHR12390.
functional_coherence: COHERENT
coherence_reason: >-
  Both subfamilies (SF1 and the Asteraceae-specific SF5) are uroporphyrinogen-III
  synthases; no characterized member performs another reaction.
