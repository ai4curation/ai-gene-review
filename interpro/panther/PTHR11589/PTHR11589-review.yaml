    label: extracellular region
  evidence: IBD
  assessment: SOUND
  assessment_reason: >-
    Extracellular region is the shared cellular-component term for this clade:
    NGF, BDNF, NTF3 and NTF4 are all signal-peptide neurotrophins that function
    as secreted ligands.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11589/PTHR11589-paint.tsv
    supporting_text: "PTHR11589\tPTN001697725\tGO:0005576\tC\tIBD\tfalse"
