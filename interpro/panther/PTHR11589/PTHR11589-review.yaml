family_id: PANTHER:PTHR11589
family_name: NERVE GROWTH FACTOR  NGF -RELATED
preferred_name: Neurotrophins
summary: >-
  PTHR11589 contains cystine-knot neurotrophin precursors that are processed to
  secreted ligands for Trk-family and p75/NGFR receptors. The reviewed human
  members split into four paralogous ligand branches: NGF, BDNF, NTF3 and NTF4.
  All four are secreted growth factors with conserved receptor tyrosine kinase
  signaling, neuronal survival and neurite-modulatory roles, but NGF-specific,
  BDNF-specific and NTRK3-biased pathway terms should remain scoped to their
  cognate ligand branches.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Human NGF, BDNF, NTF3 and NTF4 share a secreted neurotrophin growth-factor
  architecture and all activate Trk-family signaling. The family is not
  completely coherent for ligand-specific pathway terms: GO:0038180 names NGF
  signaling rather than all neurotrophin signaling, and BDNF-specific or
  NTF3/NTRK3-specific pathways likewise should not be projected across the whole
  family.
