  evidence: IBD
  assessment: SOUND
  assessment_reason: >-
    This older node is a broad but appropriate gain for neurotrophins that
    regulate synaptic transmission and plasticity. The reviewed human members
    keep the row as a non-core, downstream neuronal signaling output.
