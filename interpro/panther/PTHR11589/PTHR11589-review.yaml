  evidence: IBD
  assessment: WRONG_NODE
  assessment_reason: >-
    The reviewed human neurotrophins are secreted growth-factor cargoes rather
    than classical small synaptic vesicle proteins. This single RGD-seeded IBD
    should not propagate GO:0008021 to the whole mammalian neurotrophin node.
