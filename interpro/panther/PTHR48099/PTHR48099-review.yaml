family_id: PANTHER:PTHR48099
family_name: C-1-TETRAHYDROFOLATE SYNTHASE, CYTOPLASMIC-RELATED
preferred_name: C1-tetrahydrofolate synthase / FolD family
summary: >-
  Folate-dependent one-carbon enzymes. Trifunctional C1-THF synthases (human MTHFD1, S. cerevisiae
  ADE3 cytosolic and MIS1 mitochondrial) carry dehydrogenase, cyclohydrolase and formyl-THF synthetase
  activities. Bacterial FolD (SF5) is the bifunctional dehydrogenase/cyclohydrolase. Mitochondrial
  MTHFD2/MTHFD2L (SF15, SF7) are NAD-dependent bifunctional enzymes, MTHFD1L (SF12) is a monofunctional
  synthetase, and yeast MTD1 (SF3) is an NAD-dependent dehydrogenase only.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members combine one, two or three of the dehydrogenase, cyclohydrolase and synthetase activities,
  with NADP or NAD, in cytosol or mitochondria.
