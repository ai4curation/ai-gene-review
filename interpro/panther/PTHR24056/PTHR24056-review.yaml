family_id: PANTHER:PTHR24056
family_name: CELL DIVISION PROTEIN KINASE
preferred_name: CDK and CDK-like protein kinases
summary: CDKs and CDK-like kinases regulate cell-cycle events, transcription and other processes through
  protein phosphorylation. Cyclin or other activator requirements and substrate repertoires differ among
  paralogs.
functional_coherence: HETEROGENEOUS
coherence_reason: Human CDK7 has direct biochemical support for cyclin-H/MAT1-dependent activity; the
  horse sequence aligns over the complete human CDK7 sequence with an additional region. This supports
  a bounded CDK7 comparison, not extension of TFIIH or CDK-activating-kinase functions to all CDKs. Cyclin
  dependence itself requires distinguishing classical CDKs from divergent CDK-like proteins.
