term_assessments:
- assessed_term:
    id: GO:0004693
    label: cyclin-dependent protein serine/threonine kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    CDK7 assays and cyclin-H/MAT1 regulation support cyclin-dependent kinase activity; CDK1 and CDK2 supply
    other positive branches. The inventory also explicitly includes CDKL1, CDKL2, CDKL3, CDKL4 and CDKL5.
    The present sources do not establish that their kinase reactions require cyclin association, so the
    cyclin-dependent qualifier is not inferred from the kinase fold or CDK-like name alone. This is a
    specific unresolved regulatory boundary, not a claim that these proteins lack kinase activity. CDK5
    p35/p39 regulation is not used as a negative GO:0004693 counterexample.
  supported_by:
  - reference_id: PMID:15530371
    supporting_text: "CDK7, a member of the cyclin-dependent protein kinase family, regulates the \nactivities\
      \ of other CDKs through phosphorylation on their activation segment and \nhence contributes to control\
      \ of the eukaryotic cell cycle. CDK7 also assists in \nthe regulation of transcription as part of\
      \ the transcription factor TFIIH \ncomplex. For maximum activity and stability, CDK7 requires phosphorylation,\
      \ \nassociation with cyclin H, and association with a third protein, MAT1."
