notes: |-
  BALMU/A0A8B8WEG2: requested accession A0A8B8WEG2; current record A0A8B8WEG2; sequence length 421; source cohort ARGO50. HORSE/CDK7: requested accession A0A9L0R074; current record A0A9L0R074; sequence length 415; source cohort HORSE40. human/CDK7: requested accession P50613; current record P50613; sequence length 346; source cohort HORSE40_HUMAN_PAIR. Family boundaries were assessed using the fetched member set and the cited domain, literature and analytical evidence. Gene-review verdicts and ARBA assertions are not independent validation. PANTHER subfamily labels and membership are recorded from the frozen UniProt records and panther.obo; they do not by themselves prove functional uniformity within a subfamily. PAINT rows were inspected as ancestral assertions, but node placement is not adjudicated without the relevant descendant tree/alignment. No residue requirement is encoded without a verified sequence-version anchor. A target-level refutation is not a family-wide NOT_APPLICABLE judgment. Exact protein-name-only predictions are treated as family-identification hypotheses rather than invented GO predictions.

  Placement evidence (2026-10-02)

  | Protein / source | Frozen UniProt placement (historical observation) | Official PANTHER 19.0 row |
  |---|---|---|
  | P50613 (human / 4071) | PTHR24056:SF0 — CYCLIN-DEPENDENT KINASE 7 | PTHR24056:SF375 |

  Both observations support this parent; only numbered subfamily placement is unresolved.

  Human CDK7 has biochemical support for cyclin-H/MAT1-dependent activity, CDK activation and its transcriptional role in TFIIH. These particular roles cannot be transferred to every CDK-like kinase. CDK1 and CDK2 establish other positive kinase branches. The cached human CDK5 Q00535 record describes p35/CDK5R1 and p39/CDK5R2 activation (file:genes/human/CDK5/CDK5-uniprot.txt, CC ACTIVITY REGULATION); this regulatory difference does not establish loss of cyclin-dependent kinase activity. The cached entry inventory and UniProt record place CDK5 in PTHR24056:SF46, but no exact official CDK5 row has been inspected in these audits. Different substrates or tissue contexts do not constitute catalytic exceptions. The 415-residue horse A0A9L0R074 aligns with 95.38% identity across all 346 residues of human P50613, covering 100.0% of the human and 83.37% of the horse sequence. This supports a functional comparison, not a shared numbered subfamily. Both observed sources place P50613 in PTHR24056. Horse A0A9L0R074 has the frozen PTHR24056:SF0 placement (CYCLIN-DEPENDENT KINASE 7). The complete official PTHR19.0_horse file yielded no exact UniProtKB token for this accession. This does not contradict or supersede the frozen UniProt placement, demonstrate absence from a family, or identify a replacement accession. The release/mapping discrepancy remains unresolved; biological evidence and the earlier placement are preserved here and in an explicitly source-bounded SF0 descriptor. P50613 is a PAINT IBD seed at PTN000624096, but no checked SF0/SF375-to-node bridge resolves the subfamily split. The numbered blue-whale A0A8B8WEG2/SF174 entry retains frozen UniProt classification provenance. The inspected official directory has no whale-named sequence-classification file; no exact whale row was retrieved. This is an input-availability limit, not evidence of absence from every organism file.

  The table records source observations, not live membership declarations. Complete earlier descriptors and assessments are preserved at https://github.com/ai4curation/ai-gene-review/blob/e82261ba811dadbb944cd3770e7fdd2889ec69a4/interpro/panther/PTHR24056/PTHR24056-review.yaml. Current structured term assessments are authoritative; duplicate historical copies have been removed from these notes.

  Persistent provenance: file:projects/PROTNLM_EVALUATION/family-curation/PANTHER-classification-conflicts-2026-10-02.md. Diagnostic run 36943928592, compact artifact 11201891369, SHA256 9861e63fc8279e570e57ad56d639c36edafeac62809ee9867681a27175707136. Official sequence-file dates, exact row labels, URLs and verification limits are retained in that report. Full raw-body hashes remain runner-recorded rather than locally recomputed. No PAINT-node placement or replacement family is inferred. Review remains IN_PROGRESS.

  Bounded comparator audit (2026-10-02): source run 36956025748, compact artifact 11205408249, SHA256 7df7b0367d5d10dc5be4c919adc9af3a89ea3e057ba788fc4b067eaa0d926931. All 17 outcomes were authenticated; the 15 matching rows were replayed locally against the unchanged parser. The two whole-file NO_MATCH results are runner observations. The persistent report records all 17 targets, original labels and source dates. Complete source-body hashes are runner-recorded, not independently recomputed locally. Classification observations do not establish evolutionary cause or complete family coverage.

  The current broad functional grant is an inference from the family mechanism and positive biological anchors, not from metadata counts or exhaustive sequence enumeration. It does not resolve the explicitly retained accession-placement conflicts or transfer member-specific substrates, partners or developmental programs.
