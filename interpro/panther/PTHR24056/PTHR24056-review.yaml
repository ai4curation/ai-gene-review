family_id: PANTHER:PTHR24056
family_name: CELL DIVISION PROTEIN KINASE
preferred_name: CDK and CDK-like protein kinases
summary: CDKs and CDK-like kinases regulate cell-cycle events, transcription and other processes through
  protein phosphorylation. Cyclin or other activator requirements and substrate repertoires differ among
  paralogs.
functional_coherence: COHERENT
coherence_reason: >-
  CDKs and CDK-like proteins share the protein-kinase mechanism represented by CDK7, CDK1 and CDK2, with
  the broader CDK/CDKL inventory supporting inference of protein phosphorylation. Human CDK7 is placed
  in this parent by both observed classification sources. Different substrates, developmental roles and
  activator requirements do not show loss of the shared phosphorylation reaction. CDK5 p35/p39 activation
  is positive regulatory evidence, not a negative cyclin-dependent kinase annotation. Coherence is assessed
  at the broad kinase-reaction level; the more specific cyclin requirement across the CDKL branches remains
  a separate unresolved question.
subfamilies:
- label: Human CDK7 functional group
  description: >-
    Human P50613 is retained as an unnumbered functional group because both classification observations
    support PTHR24056 but SF0 versus SF375 remains unresolved. Horse CDK7 retains its own explicitly sourced
    frozen SF0 placement below; the sequence comparison does not resolve the human numbered assignment
    or transfer CDK7-specific roles to every CDK-like kinase.
  representative_members:
  - id: UniProtKB:P50613
    gene_symbol: CDK7
    organism: Homo sapiens
    gene_review: genes/human/CDK7/CDK7-ai-review.yaml
