- assessed_term:
    id: GO:0006468
    label: protein phosphorylation
  scope: FAMILY_WIDE
  scope_reason: >-
    Protein phosphorylation is the shared broad reaction supported by CDK7 and other characterized CDK
    branches and by the CDK/CDKL protein-kinase family context. Infer this reaction across the family
    without requiring a common cyclin partner, substrate or cellular role. CDK7 TFIIH and CDK-activating-kinase
    functions remain member-specific; the human-horse alignment supports the horse comparison rather than
    transferring those roles to every kinase. The grant is a family-level mechanistic inference, not an
    experimental assay of every sequence or incomplete product.
