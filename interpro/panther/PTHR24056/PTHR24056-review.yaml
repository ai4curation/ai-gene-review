node_assessments:
- node_id: PANTHER:PTN000756102
  asserted_term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN000623091
    label: PTN000623091 (ancestral IBD node; IRD source)
  paint_snapshot: '20260828'
  node_taxon:
    id: NCBITaxon:2759
    label: Eukaryota
  assessment: LOSS_CONTRADICTED
  assessment_reason: >-
    PTN000756102 is the CDKL5 clade (40 leaves, almost all PTHR24056:SF111, plus the zebrafish/medaka
    SF547 copies): vertebrate CDKL5, amphioxus, sea urchin, Monosiga, budding yeast YGK3, Giardia,
    Paramecium, Phytophthora, Chlamydomonas and Klebsormidium sequences. The IRD blocks the deep
    GO:0004674 IBD at PTN000623091 from descending, while the same node keeps an IBA for the parent
    GO:0004672 protein kinase activity from PTN000623091. The curator therefore did not judge the clade
    catalytically dead; the most plausible reading is that the Ser/Thr qualifier was withdrawn,
    for instance because CDKL5 carries a MAPK-like TEY T-loop and autophosphorylates on tyrosine
    (Tyr171). That rationale does not hold for substrate specificity. Human CDKL5 phosphorylates MAP1S
    Ser900, CEP131 Ser35 and DLG5 in cells in a kinase-dead-sensitive manner. Mouse CDKL5 phosphorylates
    ARHGEF2 Ser122, EB2 Ser222 and MAP1S Ser786/Ser812, and Ser-to-Ala mutation abolishes these sites
    in vitro. Its consensus R-P-X-[S/T]-[A/G/P] accepts Thr. The same study that mapped Tyr171
    autophosphorylation showed that CDKL5 cannot phosphorylate exogenous substrates on tyrosine, so the
    tyrosine event is intramolecular T-loop autophosphorylation of the GSK3/DYRK type and does not
    replace Ser/Thr activity. Three full-text substrate studies (human and mouse; cited below), together
    with a further curator IDA for mouse Cdkl5 (PMID:22922712), therefore contradict the loss for the
    vertebrate SF111 branch. The yeast YGK3 IMP (PMID:10958669, abstract only) and the
    zebrafish IDA (PMID:26927518, abstract only) were not relied on. No evidence of loss was found for
    the protist and algal members. The appropriate correction is to remove the IRD so that GO:0004674
    descends from PTN000623091 to the clade.
  supported_by:
  - reference_id: PMID:30266825
    supporting_text: "Taken together, these data indicate that although CDKL5 can catalyse intramolecular autophosphorylation on Tyr171, it cannot phosphorylate exogenous substrates on tyrosine."
  - reference_id: PMID:30266825
    supporting_text: "expression of wild‐type CDKL5 but not a K42R kinase‐dead CDKL5 mutant markedly increased the phosphorylation of MAP1S."
  - reference_id: PMID:30266824
    supporting_text: "confirming the mutated Serines as the sole phosphorylation sites on these substrates."
  - reference_id: PMID:34605059
    supporting_text: "These data suggested that the motif R‐P‐X‐[S/T]‐[A/G/P] represents a putative CDKL5 consensus motif."
- node_id: PANTHER:PTN000623095
  asserted_term:
    id: GO:0016592
    label: mediator complex
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN000623092
    label: PTN000623092 (ancestral IBD node; IRD source)
  paint_snapshot: '20230512'
  node_taxon:
    id: NCBITaxon:33213
    label: Bilateria
  assessment: LOSS_CONTRADICTED
  assessment_reason: >-
    PTN000623095 is the bilaterian CDK8/CDK19 clade (60 leaves): vertebrate CDK8 (SF243) and CDK19
    (SF570), plus invertebrate Cdk8 (SF495, e.g. Drosophila Cdk8 and C. elegans cdk-8) and nematode
    dyf-18 (SF469). The IRD blocks the eukaryote-level IBD for GO:0016592 mediator complex at
    PTN000623092, which is seeded by S. cerevisiae Ssn3/Srb10 and S. pombe Srb10 as well as by
    human CDK8 and fly Cdk8. The same node carries an IBD for GO:1990508 CKM complex (2025). This
    suggests that the IRD records a scope decision (CDK8 belongs to the dissociable kinase module
    rather than to core Mediator) rather than a biological divergence. Neither reading supports a
    clade-specific loss. Metazoan CDK8 and CDK19 form the same four-subunit CDK8 module as yeast
    Ssn3/Srb10, and that module reversibly binds Mediator in flies and humans just as in yeast. The GO
    definition of GO:0016592 explicitly includes the yeast regulatory subcomplex (Ssn2, Ssn3, Ssn8,
    Srb8) in the mediator complex. Curators made experimental part_of annotations for human CDK8
    (IDA, IMP), mouse Cdk8 (IDA) and fly Cdk8 (IDA, IPI). The full-text fly study (PMID:17290221)
    describes Cdk8 as a subunit of a structurally conserved Mediator Cdk8 module. If GO decides that CKM subunits
    should not carry GO:0016592, the fix belongs at PTN000623092, including the fungal seeds. An IRD
    on the bilaterian clade alone is not the right fix, because it leaves yeast Ssn3 annotated to
    mediator complex for the same association. The loss as placed is therefore contradicted. The CKM
    complex IBD on this node is sound and should stay. The inclusion of dyf-18 (a CCRK-like kinase)
    under this node is a separate tree-placement question and is not adjudicated here.
  supported_by:
  - reference_id: PMID:17290221
    supporting_text: "MED is organized in three core modules and a separable ‘Cdk8 module' consisting of the cyclin-dependent kinase Cdk8, its partner CycC, Med12 and Med13."
  - reference_id: PMID:17290221
    supporting_text: "Physical interactions detected among the four fly subunits provide support for a structurally conserved Cdk8 module."
  - reference_id: PMID:30905399
    supporting_text: "The CDK8 or CDK19 kinase Module (orange) reversibly binds the Mediator complex to regulate its activity."
