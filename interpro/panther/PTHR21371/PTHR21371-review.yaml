family_id: PANTHER:PTHR21371
family_name: KETOL-ACID REDUCTOISOMERASE, MITOCHONDRIAL
preferred_name: Ketol-acid reductoisomerase (IlvC/ILV5)
summary: >-
  Ketol-acid reductoisomerase (KARI, EC 1.1.1.86) is the second enzyme of the shared trunk of
  branched-chain amino acid biosynthesis. It is a Mg2+- and NAD(P)H-dependent enzyme that
  isomerizes and reduces 2-acetolactate (valine branch) or 2-aceto-2-hydroxybutanoate (isoleucine
  branch) to the corresponding 2,3-dihydroxy acids. KARIs come in a short form, found in fungi and
  most bacteria (e.g. Pseudomonas IlvC, yeast ILV5), and a long form typical of plants and of some
  bacteria such as E. coli. The long form has a duplicated C-terminal knotted domain. Fungal KARIs
  are mitochondrial, bacterial ones cytosolic and plant ones plastidic. S. cerevisiae ILV5 has a
  second, species-documented role: it binds double-stranded DNA in mitochondrial nucleoids and
  helps keep rho+ mtDNA stable.
functional_coherence: COHERENT
coherence_reason: >-
  Almost every member of the inventory (649 of 650) is in SF1, which spans short-form bacterial
  and fungal enzymes (P. putida IlvC 338 aa, yeast ILV5 395 aa) and long-form enzymes (E. coli
  IlvC 491 aa, Arabidopsis 591 aa). Both forms are active KARIs with conserved active-site
  residues, so the catalytic and pathway terms are safe family-wide. What varies is compartment,
  which follows lineage, and the S. cerevisiae ILV5 mtDNA-maintenance role, which is a
  species-level moonlighting function not shown for other members.
