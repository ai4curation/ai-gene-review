  name:
    name: Platelet-derived/Vascular endothelial growth factor
    short: PDGF/VEGF_growth_factor
  description:
  - text: The PDGF/VEGF growth factor family is involved in various processes such
      as angiogenesis, vasculogenesis, and endothelial cell growth. Members of the
      family function as growth factors that stimulate endothelial cell proliferation,
      migration, and survival while inhibiting apoptosis. They are key regulators
      of blood vessel permeabilization and play roles in axon guidance and cell body
      migration during embryonic development. Some family members are also implicated
      in increasing vascular permeability during specific physiological processes
      like lactation. Additionally, certain snake venom VEGF subfamily proteins contribute
      to venom dispersion and prey subjugation by inducing vascular permeability and
      hypotension, mediated by nitric oxide production from VEGF-activated endothelium
      NO synthase. These proteins also promote angiogenesis and interact with specific
      VEGF receptors, with varying affinities for VEGFR1 and VEGFR2.
