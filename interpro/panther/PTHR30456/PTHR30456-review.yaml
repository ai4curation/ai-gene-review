family_id: PANTHER:PTHR30456
family_name: PYRIDOXINE 5'-PHOSPHATE SYNTHASE
preferred_name: PdxJ family
summary: >-
  Bacterial PdxJ pyridoxine 5'-phosphate synthases. PdxJ condenses
  3-amino-2-oxopropyl phosphate, the product of PdxA, with
  1-deoxy-D-xylulose 5-phosphate (DXP) and closes the pyridine ring, forming
  pyridoxine 5'-phosphate (PNP). This is the fifth step of the DXP-dependent
  de novo pyridoxal 5'-phosphate pathway. E. coli PdxJ is the biochemically
  and structurally characterized reference.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF0). All 259 reviewed members in the entries file are
  named pyridoxine 5'-phosphate synthase, and the only PAINT node is placed at
  Bacteria with the E. coli enzyme as its seed.
