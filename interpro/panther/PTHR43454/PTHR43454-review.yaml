family_id: PANTHER:PTHR43454
family_name: GLYCERALDEHYDE-3-PHOSPHATE DEHYDROGENASE
preferred_name: Long-form bacterial GAPDH-like proteins (GapB/Gap2 type)
summary: >-
  PTHR43454 is a small PANTHER family of long (about 460-490 residue) bacterial proteins that
  carry the complete glyceraldehyde-3-phosphate dehydrogenase fold: the NAD(P)-binding
  Gp_dh_N domain, the catalytic Gp_dh_C domain and the GAPDH active-site signature. It is
  distinct from the canonical type I GAPDH family (PTHR43148, about 330 residues), which
  contains the characterized glycolytic/gluconeogenic GapA enzymes. No member of PTHR43454 has
  been characterized biochemically. The only reviewed member is Pseudomonas aeruginosa
  PA14 Gap2, named a GAPDH-like protein; the P. putida KT2440 member is GapB (PP_2149).
  Retention of the catalytic signature and the type I GAPDH NCBIfam model makes
  phosphorylating GAPDH activity a reasonable prediction, but cofactor preference and
  physiological role are unknown.
functional_coherence: UNKNOWN
coherence_reason: >-
  The member inventory holds a single reviewed entry (P. aeruginosa Gap2, SF1) and there are
  no PAINT nodes, so coherence cannot be judged from experimental data.
