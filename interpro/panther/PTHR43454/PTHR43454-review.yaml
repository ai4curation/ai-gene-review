  scope: UNRESOLVED
  scope_reason: >-
    Predicted for members that retain the type I GAPDH model and the GAPDH active-site
    PROSITE pattern, as the KT2440 member does, but no member has been assayed and the NAD+
    versus NADP+ preference of this long-form family is untested. The module therefore
    grounds its GAPDH step on the characterized PTHR43148 type I GAPDH (KT2440 GapA)
    rather than on this family.
