  name:
    name: Type VI secretion system TssE1-like
    short: T6SS_TssE1-like
  description:
  - text: This family of proteins includes core components of the type VI secretion
      system (T6SS), specifically the H1-T6SS variant. Members are involved in the
      secretion of toxins that can target a range of organisms. They play a crucial
      role in the assembly and stability of the TssB1-sheath structure, which is essential
      for the function of the T6SS. These proteins operate downstream of TssK1 and
      are key in preventing the premature disassembly or detachment of the TssB1-sheath.
      They facilitate the binding of the sheath to TssB1 and serve as a docking point
      for the recruitment of ClpV1, which is necessary for the disassembly of the
      sheath during the T6SS cycle.
