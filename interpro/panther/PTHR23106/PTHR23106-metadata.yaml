  name:
    name: Angiogenic factor with G patch and FHA domains 1
    short: AGGF1
  description:
  - text: The AGGF1 family is characterized by its role in promoting angiogenesis
      and endothelial cell proliferation. Members of the family have the ability to
      bind to endothelial cells, which may suggest an autocrine mechanism of action.
      The angiogenic factor with G patch and FHA domains, which defines this family,
      is involved in the physiological process of new blood vessel formation, a critical
      aspect of various developmental and repair processes in the body. The family's
      function in angiogenesis highlights its potential significance in both normal
      vascular development and pathological conditions where angiogenesis is a factor.
