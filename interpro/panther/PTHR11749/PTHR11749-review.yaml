family_id: PANTHER:PTHR11749
family_name: RIBULOSE-5-PHOSPHATE-3-EPIMERASE
preferred_name: Ribulose-phosphate 3-epimerase (RPE) family
summary: >-
  Metal-dependent epimerases interconverting ribulose 5-phosphate and xylulose 5-phosphate in the
  non-oxidative pentose phosphate pathway and the Calvin cycle (S. cerevisiae RPE1, S. pombe SPAC31G5.05c,
  human RPE, bacterial Rpe). Salmonella LsrE is an RPE-related paralog in an autoinducer-2 operon.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Epimerase activity is shared by the RPE subfamilies; LsrE-type paralogs are uncharacterized.
