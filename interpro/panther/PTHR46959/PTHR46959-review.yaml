  assessment: SOUND
  assessment_reason: >-
    The single seed, E. coli YihQ, is a directly assayed SQase, and the second characterized
    member, A. fabrum SmoI, independently confirms the activity in a different pathway
    (SmoI is not in the PANTHER tree, so it receives no IBA, but it carries the same
    sulfonate-binding triad and the same activity). Placing the activity on the SQase clade
    rather than on GH31 as a whole is appropriate, because the sulfonate-binding residues
    separate SQases from alpha-glucosidases. The node's leaf propagation also reaches a few
    eukaryotes (a plant, a choanoflagellate and several invertebrates); predicted plant SQases
    with a QWY motif are supported by mutagenesis of YihQ to that motif, whereas the animal
    leaves are unassayed and should be checked for the sulfonate-binding motif before being
    treated as SQases.
