family_id: PANTHER:PTHR46959
family_name: SULFOQUINOVOSIDASE
preferred_name: GH31 sulfoquinovosidases (YihQ/SmoI)
summary: >-
  Glycoside hydrolase family 31 enzymes that hydrolyze the alpha-glycosidic bond of
  sulfoquinovosides (sulfoquinovosyl diacylglycerol, its delipidated form sulfoquinovosyl
  glycerol, and methyl or aryl sulfoquinovosides) to release free sulfoquinovose (SQ), the
  entry substrate of bacterial SQ catabolic pathways. The two characterized members, both
  in subfamily SF2, are Escherichia coli YihQ, the gateway enzyme of the sulfo-EMP pathway,
  and Agrobacterium fabrum SmoI (AtSQase), the first enzyme of the oxidative sulfo-SMO
  pathway. Both are retaining (alpha/beta)8-barrel glycosidases whose active site carries a
  sulfonate-binding Arg/Trp/Tyr triad that distinguishes them from the alpha-glucosidases of
  other GH31 families; neither hydrolyzes the corresponding alpha-glucoside. The family also
  contains uncharacterized eukaryotic homologs, including predicted plant SQases with a QWY
  sulfonate-binding variant.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member is a sulfoquinovosidase with the same catalytic mechanism and
  sulfonate-recognition motif: YihQ (sulfo-EMP, SQDG and SQGro) and SmoI (sulfo-SMO, SQGro
  and PNPSQ, no activity on PNPGlc). They sit in different SQ degradation pathways but
  perform the same reaction, so pathway context does not divide the family. Only two members
  are characterized, and the eukaryotic members are unassayed, which limits but does not
  contradict the coherence call.
