  scope: FAMILY_WIDE
  scope_reason: >-
    Both characterized members, the only SwissProt members of the family, are
    sulfoquinovosidases, and the activity is tied to the sulfonate-binding triad that the
    family shares. The GO definition names SQDG as substrate, whereas SmoI was assayed on
    SQGro and PNPSQ; both glycosides are cleaved at the same bond, and a question to broaden
    the definition is raised in the SmoI gene review.
