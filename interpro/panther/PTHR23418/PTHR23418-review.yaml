family_id: PANTHER:PTHR23418
family_name: ACIREDUCTONE DIOXYGENASE
preferred_name: Acireductone dioxygenase (MtnD/ADI1) family
summary: >-
  Cupin acireductone dioxygenases cleave the acireductone of the methionine salvage pathway. With
  Fe(II) they make the methionine precursor 4-methylthio-2-oxobutanoate; with Ni(II), an off-pathway
  product (bacterial MtnD, S. cerevisiae ADI1, S. pombe adi1, human ADI1/MTCBP-1, plant ARD isozymes).
  Nematodes have inactive ARD-related proteins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  ARD activity holds for SF0 and the plant ARD subfamilies; PANTHER names the nematode SF10 and SF1
  inactive.
