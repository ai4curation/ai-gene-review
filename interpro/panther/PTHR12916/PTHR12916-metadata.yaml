  name:
    name: Notch Signaling and Photoreceptor Maintenance
    short: Notch_Photorecpt_Maint
  description:
  - text: The protein family is involved in a range of biological processes including
      cell-fate determination, differentiation, proliferation, and apoptosis. Members
      function as receptors for specific membrane-bound ligands, such as Jagged and
      Delta proteins, activating Notch signaling pathways. This leads to transcriptional
      activation of target genes that influence developmental outcomes in various
      tissues, including the nervous system, immune system, and vasculature. Some
      family members are essential for angiogenesis, acting as negative regulators
      of endothelial cell proliferation and migration. Others are crucial for maintaining
      photoreceptor cell integrity and facilitating protein trafficking in the eye.
      Additionally, the family plays roles in CNS development, limb and craniofacial
      formation, myogenesis, and trachea development in larvae.
