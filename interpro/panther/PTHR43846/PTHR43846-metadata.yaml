  name:
    name: tRNA Uridine(34) Hydroxylase
    short: TrhO
  description:
  - text: The TrhO family proteins are responsible for the post-transcriptional modification
      of tRNA by catalyzing the oxygen-dependent hydroxylation of uridine at position
      34, resulting in the formation of 5-hydroxyuridine (ho5U). This modification
      is a key step in the biosynthesis of 5-carboxymethoxyuridine (cmo5U), which
      is essential for the proper decoding function of tRNAs during protein synthesis.
      Some members of the TrhO family may also participate in an alternate pathway
      that can bypass cmo5U biogenesis in certain tRNAs under aerobic conditions,
      highlighting a potential regulatory mechanism for tRNA function in response
      to oxygen availability.
