family_id: PANTHER:PTHR47495
family_name: ALDEHYDE DEHYDROGENASE
preferred_name: Molybdopterin-binding large subunits of bacterial N-heterocycle and aldehyde hydroxylases
  (NicB, IorB, Mo-containing membrane aldehyde dehydrogenase)
summary: >-
  Bacterial large catalytic subunits of the xanthine oxidase superfamily of molybdenum hydroxylases.
  Members carry the aldehyde oxidase/xanthine dehydrogenase a/b domain and the two
  molybdopterin-cofactor-binding domains (MoCoBD1/2) that hold the molybdenum cofactor at which the
  substrate is hydroxylated. They act with separate small [2Fe-2S] subunits (PTHR44379). The three
  Swiss-Prot members are Pseudomonas putida NicB, the catalytic subunit of the two-component
  nicotinate dehydrogenase NicAB; Brevundimonas diminuta IorB, the large subunit of isoquinoline
  1-oxidoreductase; and the membrane-bound aldehyde dehydrogenase large subunit of Gluconacetobacter
  polyoxogenes. Despite its Swiss-Prot name ("pyrroloquinoline-quinone"), the Gluconacetobacter
  subunit belongs here by its molybdopterin domains. The PANTHER family name "aldehyde dehydrogenase"
  reflects that member only. Substrates differ (nicotinate, isoquinoline, aldehydes); the shared
  chemistry is molybdenum-cofactor-dependent hydroxylation of a carbon next to a heteroatom or of an
  aldehyde.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Molybdopterin-cofactor binding and the Mo-hydroxylase catalytic role are family-wide. Substrate
  specificity and electron-acceptor coupling differ between members and are not predicted by the
  family. Within SF1, KT2440 NicB fuses a C-terminal cytochrome c domain that delivers electrons to
  cytochrome. The Bordetella BB1783 protein in the same subfamily lacks that cytochrome region, so
  even the subfamily does not fix the holoenzyme architecture.
