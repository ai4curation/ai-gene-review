  label: BLL3820 PROTEIN
  description: >-
    NicB-like nicotinate dehydrogenase large subunits. KT2440 NicB is experimentally linked to
    nicotinate hydroxylation (disruption, complementation and heterologous expression), and its
    cytochrome c region is required for activity with cytochrome as acceptor. Bordetella
    bronchiseptica BB1783 is also classified here but lacks the cytochrome c domain; its proposed
    NicB2 role in a split entry enzyme is a comparative prediction. The subfamily name is a
    Bradyrhizobium locus tag, not a functional claim.
