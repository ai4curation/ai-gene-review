  name:
    name: Reticulophagy receptor domain-containing protein
    short: Reticulophagy_rcpt_domain
  description:
  - text: This family of proteins functions as major reticulophagy receptors, independently
      remodeling subdomains of the endoplasmic reticulum into autophagosomes under
      nutrient stress, which subsequently fuse with lysosomes for turnover. They facilitate
      the formation of a synapse between two membranes through interactions with ATG8
      proteins, potentially extending ER capture through a 'zipper-like' mechanism
      until membrane fission and autophagosomal closure occur. Additionally, these
      proteins are involved in the repair of covalent DNA-protein cross-links during
      DNA synthesis by recruiting VCP/p97 and initiating resolution through SPRTN.
