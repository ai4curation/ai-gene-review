- node_id: PANTHER:PTN002217393
  asserted_term:
    id: GO:0005829
    label: cytosol
  evidence: IBD
  paint_snapshot: '20170228'
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  seeds:
  - id: UniProtKB:P0AEJ6
  assessment: SOUND
  assessment_reason: >-
    EAL is a soluble cytoplasmic enzyme. The seed is E. coli EutB, found in the
    cytosol proteome. Cytosol holds for the family as a whole: members from
    shell-less loci such as P. putida KT2440, whose proteome encodes no
    microcompartment shell protein, can only act in the cytoplasm, and in
    shell-encoding enterobacteria the location of EutBC relative to the
    microcompartment is itself contested, with one genetic model placing it
    outside the shell.
  supported_by:
  - reference_id: file:interpro/panther/PTHR39329/PTHR39329-paint.tsv
    supporting_text: "PTHR39329\tPTN002217393\tGO:0005829\tC\tIBD\tfalse\tUniProtKB:P0AEJ6"
  - reference_id: file:genes/PSEPK/eutC/eutC-bioinformatics/RESULTS.md
    supporting_text: >-
      KT2440 encodes no BMC-domain or EutN/CcmL-domain protein anywhere in its reference
      proteome, while the same queries recover the complete E. coli Eut shell set.
  - reference_id: PMID:23585538
    supporting_text: >-
      The model predicts that EutBC (ethanolamine-ammonia lyase) lies outside
      the compartment, using external coenzyme B12 and injecting its product,
      acetaldehyde, into the lumen
