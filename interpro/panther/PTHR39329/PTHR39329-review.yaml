    Root node of the family, seeded by E. coli and Salmonella EutB, whose enzyme
    activity is established by purification, kinetics and crystal structures. The
    active site and substrate-binding residues are in the EutB barrel, so
    `enables` is the correct relation for this family (in contrast to the EutC
    family PTHR39330, where PAINT places no activity and the small subunit only
    contributes). Every member is a EutB large subunit paired with EutC.
