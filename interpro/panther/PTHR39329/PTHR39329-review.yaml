- assessed_term:
    id: GO:0031471
    label: ethanolamine degradation polyhedral organelle
  scope: UNRESOLVED
  scope_reason: >-
    The microcompartment location (transferred by HAMAP/UniRule, not PAINT)
    depends on whether the genome encodes Eut shell proteins, not on the EutB
    sequence, so it is not a family property. It is impossible for members from
    shell-less genomes such as P. putida KT2440 (removed in that review) and is
    plausible but unproven for enterobacterial members (kept as non-core in the
    E. coli review).
  supported_by:
