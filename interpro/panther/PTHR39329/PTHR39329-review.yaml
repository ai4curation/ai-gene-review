family_id: PANTHER:PTHR39329
family_name: ETHANOLAMINE AMMONIA-LYASE HEAVY CHAIN
preferred_name: Ethanolamine ammonia-lyase large (alpha) subunit EutB family
summary: >-
  Large (alpha) subunit, EutB, of adenosylcobalamin (coenzyme B12)-dependent
  ethanolamine ammonia-lyase (EAL, EC 4.3.1.7), which deaminates ethanolamine to
  acetaldehyde and ammonium in the first step of bacterial ethanolamine
  utilization. EutB pairs with the small subunit EutC (PANTHER PTHR39330), and
  six EutB/EutC heterodimers form the alpha6-beta6 holoenzyme. The active site,
  with the substrate-binding residues, lies in the EutB (beta/alpha)8 barrel, and
  the cobalamin cofactor is bound at the EutB/EutC interface with direct contacts
  from both subunits. EutB is encoded in tandem with eutC in the eut operons of
  enterobacteria, where the operon also encodes microcompartment shell proteins,
  and in compact shell-less eut loci such as that of Pseudomonas putida KT2440.
functional_coherence: COHERENT
coherence_reason: >-
  The family has a single subfamily, PTHR39329:SF1, and the cached reviewed-member
  inventory (three Swiss-Prot entries: E. coli K-12 and O157:H7 EutB and Salmonella
  Typhimurium EutB, all 453 residues) is uniformly named ethanolamine ammonia-lyase
  large subunit. The PANTHER metadata counts about 4,100 proteins in total; the
  unreviewed member reviewed here, P. putida KT2440 EutB (Q88QF1), carries the same
  family signatures (PANTHER PTHR39329:SF1, Pfam PF06751) and the same eutBC
  operon arrangement. All four PAINT assertions sit on one root node.
