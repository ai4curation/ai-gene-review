  name:
    name: Plant MAP kinase kinase kinase
    short: Plant_MAPKKK
  description:
  - text: This family of proteins includes mitogen-activated protein kinase kinase
      kinases (MAPKKKs) that are integral components of the abscisic acid (ABA) signaling
      pathway, particularly in response to abiotic stresses. They are involved in
      the activation of downstream MAP kinases, such as MPK1, MPK2, MPK6, MPK7, and
      MPK14, through phosphorylation. These proteins play a role in various plant
      physiological processes including stomatal development and movement, root growth,
      leaf senescence, and the regulation of gene expression related to stress responses.
      Their kinase activity is modulated by ABA, phosphorylation, and interactions
      with other proteins such as ABI1 and SRK2E.
