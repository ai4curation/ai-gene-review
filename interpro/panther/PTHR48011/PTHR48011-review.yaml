family_id: PANTHER:PTHR48011
family_name: CCR4-NOT TRANSCRIPTIONAL COMPLEX SUBUNIT CAF120-RELATED
preferred_name: CAF120/SKG3 PH-domain and plant MAPKKK-like family
summary: >-
  PTHR48011 groups multiple MAPKKK branches with the small Saccharomyces
  CAF120/SKG3 PH-domain branch. PAINT places protein kinase activity and signal
  transduction on the family-root PTN001969686 node from Arabidopsis MAPKKK
  seeds; both IBDs should be pruned at the Saccharomyces CAF120/SKG3 node
  because the checked S. cerevisiae leaves have Skg3/CAF120-like PH architecture
  and lack the protein kinase domain needed for catalytic kinase activity.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The Arabidopsis seed proteins are MAP kinase kinase kinases, whereas the
  yeast CAF120/SKG3 branch consists of PH-only CCR4-associated proteins with no
  protein kinase domain. The reviewed InterPro member snapshot also puts viral
  ORF74 in SF4 with Arabidopsis MAPKKK18, so PTHR48011 is not a clean plant-only
  family. Protein kinase activity and MAPK-related signal transduction are
  therefore not safe in the checked CAF120/SKG3 branch.
reference_protein:
  id: UniProtKB:P53836
  label: CCR4-NOT transcriptional complex subunit CAF120
  gene_symbol: CAF120
  organism: Saccharomyces cerevisiae
  gene_review: genes/yeast/CAF120/CAF120-ai-review.yaml
