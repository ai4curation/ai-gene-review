family_id: PANTHER:PTHR30008
family_name: EXODEOXYRIBONUCLEASE 7 LARGE SUBUNIT
preferred_name: Exonuclease VII large subunit (XseA)
summary: >-
  Bacterial Exonuclease VII large subunits (XseA). XseA is the catalytic subunit
  of Exonuclease VII: an N-terminal OB-fold domain, a central catalytic domain
  whose D155, R205, H238 and D241 residues (E. coli numbering) are essential for
  nuclease activity, and a coiled-coil helical region that binds the small
  XseB subunits (PTHR34137). The XseA-XseB holoenzyme degrades single-stranded
  DNA in either direction without a metal cofactor and takes part, redundantly
  with RecJ, Exonuclease I and Exonuclease X, in mismatch-repair excision.
functional_coherence: COHERENT
coherence_reason: >-
  The family has a single subfamily (SF0), and all 420 reviewed members in the
  cached inventory are named Exodeoxyribonuclease 7 large subunit. PANTHER
  lists 42 tree nodes for the family but no PAINT node-level annotations, so
  no node assessments are recorded.
