    supporting_text: >-
      We demonstrated that residues D155, R205, H238 and D241 are essential for
      the nuclease activity of E.
- assessed_term:
    id: GO:0006298
    label: mismatch repair
  scope: FAMILY_WIDE
  scope_reason: >-
    Exonuclease VII is one of the redundant excision exonucleases of
    methyl-directed mismatch repair in E. coli. Its participation in
    MutH-independent systems is inferred from the conserved excision chemistry
    rather than tested directly, and because the exonucleases are redundant,
    loss of ExoVII alone has little effect on repair.
  supported_by:
  - reference_id: PMID:11418610
    supporting_text: >-
      Whereas extracts of all possible single, double, and triple exonuclease
      mutants displayed significant residual mismatch repair, extracts deficient
      in RecJ, ExoI, ExoVII, and ExoX exonucleases were devoid of normal repair
      activity.
