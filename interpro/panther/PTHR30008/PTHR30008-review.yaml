    label: exodeoxyribonuclease VII activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member is an XseA large subunit, the catalytic partner of XseB in
    Exonuclease VII. The catalytic residues mapped in E. coli XseA define the
    family's activity; the holoenzyme also requires XseB.
  supported_by:
