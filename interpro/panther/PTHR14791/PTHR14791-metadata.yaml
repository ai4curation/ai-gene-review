  name:
    name: WWC/KIBRA Hippo Pathway Regulators
    short: WWC/KIBRA_Hippo_Reg
  description:
  - text: The WWC/KIBRA protein family consists of negative regulators of the Hippo
      signaling pathway, also known as the Salvador-Warts-Hippo (SWH) pathway. This
      pathway is crucial for organ size control and tumor suppression, as it restricts
      cell proliferation and promotes apoptosis through a kinase cascade. Family members,
      such as KIBRA, act synergistically with other proteins to regulate the pathway,
      leading to the phosphorylation and inactivation of the Yorkie (Yki) oncoprotein.
      Additionally, some members interact with transcription factors, like HD-ZIP
      IV, to influence cuticle development. The family also plays roles in cellular
      processes such as actin cytoskeleton organization, cytokinesis, and transcriptional
      coactivation. They are involved in cognitive functions, memory performance,
      and synaptic plasticity by regulating AMPA receptor trafficking.
