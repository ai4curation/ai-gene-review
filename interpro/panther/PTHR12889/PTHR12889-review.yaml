  assessment: UNRESOLVED
  assessment_reason: >-
    Not a Notch term. The fly seed probably reflects gamma-secretase cleavage of human APP in
    Drosophila cells. Ecdysozoan APP homologs (fly APPL, worm APL-1) lack the Abeta region, so
    at Bilateria the term describes capacity rather than in vivo biology in invertebrates. This
    is the same open policy question as for the presenilin amyloid-beta node.
