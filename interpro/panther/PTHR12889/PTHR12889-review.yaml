family_id: PANTHER:PTHR12889
family_name: GAMMA-SECRETASE SUBUNIT APH-1
summary: >-
  APH-1 is the seven-transmembrane scaffold subunit of gamma-secretase. It assembles with
  nicastrin into an early subcomplex that then recruits presenilin and PEN-2, and it is needed
  for presenilin to accumulate and for the complex to be active. APH-1 was identified in a
  C. elegans screen for genes interacting with sel-12/presenilin and aph-2/nicastrin in Notch
  (GLP-1/LIN-12) signaling. RNAi against Drosophila aph-1 reduces gamma-secretase cleavage of
  Notch and APP. The family is found across eukaryotes. Vertebrates have duplicated it into
  APH1A and APH1B, and rodents have a further APH1B/APH1C duplication. Different APH-1 paralogs
  give gamma-secretase complexes with somewhat different substrate preferences and cleavage
  outcomes. Dictyostelium Aph1 is needed for gamma-secretase activity in an organism with no
  Notch.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members are gamma-secretase scaffold subunits. Notch-pathway roles are
  restricted to the metazoan branch: Dictyostelium Aph1 (a gamma-secretase subunit in an
  organism without Notch) and Arabidopsis At2g31440 (no demonstrated activity) sit outside the
  Bilateria node PTN000306733. The subfamilies SF3, SF7, SF1 and SF0 follow paralogy (APH1A,
  APH1B and pre-duplication), not function. SF0 holds the invertebrate, Dictyostelium and plant
  members together, so it cannot mark the Notch boundary.
