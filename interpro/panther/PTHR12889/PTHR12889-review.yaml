  - id: FB:FBgn0031458
    label: aph-1
    organism: Drosophila melanogaster
  - id: WB:WBGene00000147
    label: aph-1
    organism: Caenorhabditis elegans
  assessment: SOUND
  assessment_reason: >-
    PTN000306733 is the Bilateria SPECIATION node. It covers the vertebrate APH1A/APH1B
    duplication (PTN000306736) and the Ecdysozoa clade, and excludes Dictyostelium
    (PTN000984551) and Arabidopsis (PTN000306801). It therefore stops at the lineages that have
    Notch. Both seeds are ecdysozoan, but vertebrate APH1A/APH1B are established gamma-secretase
    subunits needed for Notch cleavage, so inheritance at Bilateria is well founded. APH-1 does
    part of the S3 cleavage work as the complex's scaffold subunit, so this is participation.
    GO:0007220 is asserted at the same node, and GO:0007219 is its broader parent. Gene reviews
    may reasonably prefer GO:0007220 and treat GO:0007219 as redundant.
