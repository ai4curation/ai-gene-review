notes: >-
  UniProt's PANTHER cross-references for this family give only the family id, with no
  subfamily. The subfamily assignments here come from the PANTHER 19 treeinfo service
  (sf_id per leaf), filtered to model organisms. The Eukaryota-node IBDs (GO:0070765
  gamma-secretase complex, GO:0030674 protein-macromolecule adaptor activity, GO:0016485 protein
  processing at PTN000306732) were not assessed individually. They carry the same plant caveat
  as the nicastrin and presenilin families. No lineage is known to replace APH-1 with a
  non-homologous protein.
