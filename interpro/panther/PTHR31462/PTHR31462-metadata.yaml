  name:
    name: TMEM175 potassium/proton channel
    short: TMEM175_K/H+_channel
  description:
  - text: The TMEM175 family includes potassium and proton channels that are crucial
      for maintaining pH homeostasis in endosomes and lysosomes. These channels are
      activated by low pH and facilitate proton efflux, balancing V-ATPase activity
      for pH regulation. They also regulate potassium conductance at higher pH levels.
      TMEM175 channels are characterized by a unique structure with two modules of
      six tightly packed transmembranes, forming homodimers with a tetrameric architecture.
      They lack the typical potassium channel selectivity filter motif, instead featuring
      conserved isoleucine residues that act as gates for ion selectivity. The family
      plays a role in autophagosome-lysosome fusion and is involved in protecting
      neurons against stress-induced damage.
