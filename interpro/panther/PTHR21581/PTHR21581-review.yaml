term_assessments:
- assessed_term:
    id: GO:0061785
    label: peptidoglycan endopeptidase activity
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR21581:SF26
    label: D-ALANYL-D-ALANINE ENDOPEPTIDASE
  scope_reason: >-
    D,D-endopeptidase cleavage of 4-3 crosslinks is demonstrated for E. coli
    PBP7, the type member of SF26; the other subfamilies are carboxypeptidases or,
    for TRAPPC12, not peptidases.
  supported_by:
  - reference_id: PMID:7925376
    supporting_text: >-
      Murein meso-diaminopimelate-D-alanine DD-endopeptidase activity was
      demonstrated for both PBP7 and PBP8, which specifically hydrolyse the
      DD-diaminopimelate-alanine bonds in high-molecular-mass murein sacculi
- assessed_term:
    id: GO:0009002
    label: serine-type D-Ala-D-Ala carboxypeptidase activity
  scope: UNRESOLVED
  scope_reason: >-
    The carboxypeptidase activity is expected for the DacA/DacC/DacD/DacB
    subfamilies (SF27, SF11, SF5, SF33 and the bacterial part of SF6), but none of
    those members has a gene review or cached enzymology in this repository yet,
    the SF26 endopeptidases have no demonstrated carboxypeptidase activity, and
    TRAPPC12 in SF6 is not a peptidase. Scoping it needs reviews of E. coli DacA
    (P0AEB2) and B. subtilis DacA (P08750) with their primary enzymology.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21581/PTHR21581-entries.csv
    supporting_text: dacA,403,PTHR21581:SF27,D-ALANYL-D-ALANINE CARBOXYPEPTIDASE DACA
