family_id: PANTHER:PTHR21581
family_name: D-ALANYL-D-ALANINE CARBOXYPEPTIDASE
preferred_name: Peptidase S11 low-molecular-mass penicillin-binding protein family
summary: >-
  Peptidase S11 low-molecular-mass penicillin-binding proteins (PBP5/PBP6-type
  D,D-carboxypeptidases and PBP7-type D,D-endopeptidases) of bacteria. Most named
  members are D-alanyl-D-alanine carboxypeptidases that trim peptidoglycan
  pentapeptide stems: E. coli DacA (PBP5, SF27), DacC and DacD, B. subtilis DacA
  (SF11) and the sporulation-specific DacB and DacF, and mycobacterial DacB1/DacB2
  (SF33). Subfamily SF26 holds the PbpG/PBP7 enzymes of enterobacteria and
  pseudomonads, which are D,D-endopeptidases that cleave D-Ala-mDAP crosslinks in
  intact sacculi. The PANTHER model also captures the eukaryotic TRAPP complex
  subunit TRAPPC12 (in SF6, together with several bacterial carboxypeptidases),
  which is a membrane-trafficking protein with no peptidase role. The reference
  protein, E. coli PBP7, is deliberately atypical of the family (its subfamily
  has diverged to endopeptidase activity); it was chosen because it is the
  member with a completed review, and the canonical carboxypeptidase DacA/PBP5
  should replace it once reviewed.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The bacterial members share the S11 serine D,D-peptidase fold, but the reaction
  differs between subfamilies (stem-terminal D-Ala removal for the DacA/DacC/DacD
  carboxypeptidases, 4-3 crosslink hydrolysis for PbpG/PBP7), and SF6 additionally
  contains the eukaryotic TRAPP subunit TRAPPC12. No single molecular function
  holds across the family.
reference_protein:
  id: UniProtKB:P0AFI5
  label: D-alanyl-D-alanine endopeptidase
  gene_symbol: pbpG
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/pbpG/pbpG-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR21581:SF26
  label: D-ALANYL-D-ALANINE ENDOPEPTIDASE
  description: >-
    PbpG/PBP7 D,D-endopeptidases of gamma-proteobacteria (E. coli, Shigella,
    P. aeruginosa, P. putida). Periplasmic enzymes that hydrolyse D-Ala-mDAP
    crosslinks in high-molecular-mass sacculi.
  representative_members:
  - id: UniProtKB:P0AFI5
    label: D-alanyl-D-alanine endopeptidase
    gene_symbol: pbpG
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/pbpG/pbpG-ai-review.yaml
  - id: UniProtKB:Q88GD0
    label: Periplasmic murein D-alanyl-D-alanine endopeptidase
    gene_symbol: pbpG
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/pbpG/pbpG-ai-review.yaml
  - id: UniProtKB:P72161
    label: D-alanyl-D-alanine endopeptidase
    gene_symbol: pbpG
    organism: Pseudomonas aeruginosa PAO1
  diverged_from_family: true
  divergence_description: >-
    The established reaction is D,D-endopeptidase cleavage of 4-3 crosslinks in
    intact sacculi rather than the D-Ala-D-Ala carboxypeptidase reaction of the
    DacA/DacC/DacD subfamilies; E. coli PBP7 does not cleave isolated dimeric
    muropeptides.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21581/PTHR21581-entries.csv
    supporting_text: pbpG,310,PTHR21581:SF26,D-ALANYL-D-ALANINE ENDOPEPTIDASE
  - reference_id: file:genes/PSEPK/pbpG/pbpG-uniprot.txt
    supporting_text: PANTHER; PTHR21581:SF26; D-ALANYL-D-ALANINE ENDOPEPTIDASE; 1.
  - reference_id: PMID:7925376
    supporting_text: >-
      which specifically hydrolyse the DD-diaminopimelate-alanine bonds in
      high-molecular-mass murein sacculi but fail to cleave these bonds in
      isolated dimeric muropeptides.
- subfamily_id: PANTHER:PTHR21581:SF27
  label: D-ALANYL-D-ALANINE CARBOXYPEPTIDASE DACA
  description: Enterobacterial DacA/PBP5, the major D,D-carboxypeptidase of E. coli.
  representative_members:
  - id: UniProtKB:P0AEB2
    label: D-alanyl-D-alanine carboxypeptidase DacA
    gene_symbol: dacA
    organism: Escherichia coli K-12
  diverged_from_family: false
  supported_by:
  - reference_id: file:interpro/panther/PTHR21581/PTHR21581-entries.csv
    supporting_text: dacA,403,PTHR21581:SF27,D-ALANYL-D-ALANINE CARBOXYPEPTIDASE DACA
- subfamily_id: PANTHER:PTHR21581:SF6
  label: TRAFFICKING PROTEIN PARTICLE COMPLEX SUBUNIT 12
  description: >-
    Mixed subfamily: bacterial carboxypeptidases (E. coli DacC, B. subtilis DacF,
    H. influenzae DacA) together with eukaryotic TRAPPC12, the TRAPP complex
    subunit that names the subfamily.
  representative_members:
  - id: UniProtKB:Q8WVT3
    label: Trafficking protein particle complex subunit 12
    gene_symbol: TRAPPC12
    organism: Homo sapiens
    gene_review: genes/human/TRAPPC12/TRAPPC12-ai-review.yaml
  - id: UniProtKB:P08506
    label: D-alanyl-D-alanine carboxypeptidase DacC
    gene_symbol: dacC
    organism: Escherichia coli K-12
  diverged_from_family: true
  divergence_description: >-
    TRAPPC12 is a eukaryotic membrane-trafficking (TRAPP complex) protein; its
    grouping with S11 carboxypeptidases in one subfamily is a PANTHER modelling
    artefact rather than shared function.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21581/PTHR21581-entries.csv
    supporting_text: TRAPPC12,735,PTHR21581:SF6,TRAFFICKING PROTEIN PARTICLE COMPLEX SUBUNIT 12
  - reference_id: file:interpro/panther/PTHR21581/PTHR21581-entries.csv
    supporting_text: dacC,400,PTHR21581:SF6,TRAFFICKING PROTEIN PARTICLE COMPLEX SUBUNIT 12
