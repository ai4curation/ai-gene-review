notes: The full nucleophosmin paper centers on Fkbp39 but includes pre-60S structures containing Nip7;
  the PDB entity record verifies the exact accession. This is direct structural evidence on Nip7 despite
  the title foregrounding another gene. No common phylogenetic origin of the NIP7 and CKS architectures
  is asserted from their PANTHER grouping alone.
