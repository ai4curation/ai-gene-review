family_id: PANTHER:PTHR23415
family_name: CYCLIN-DEPENDENT KINASES REGULATORY SUBUNIT/60S RIBOSOME SUBUNIT BIOGENESIS PROTEIN NIP7
preferred_name: NIP7 and CKS proteins grouped by PANTHER
summary: This PANTHER group combines NIP7 ribosome-biogenesis proteins with cyclin-dependent kinase regulatory
  subunits. NIP7 supports large-subunit pre-rRNA processing, whereas CKS proteins regulate kinase-associated
  cell-cycle machinery. These roles are biologically distinct despite their grouping under one family
  identifier.
functional_coherence: HETEROGENEOUS
coherence_reason: PANTHER groups NIP7 and CKS entries together, but their functions differ. The exact
  pombe Nip7 accession Q1MTQ9 is identified as entity 43/chain l in the experimentally determined early
  pre-60S structure 8ESQ. This directly supports its preribosome association and separates it from mature-ribosome
  structural proteins and CKS cell-cycle regulators.
