family_id: PANTHER:PTHR43002
family_name: GLYCOGEN DEBRANCHING ENZYME
preferred_name: GH13 glycogen-debranching / limit-dextrin, isoamylase and pullulan hydrolase family
summary: >-
  Glycoside hydrolase family 13 (GH13) enzymes that hydrolyse alpha-1,6
  glycosidic linkages in branched alpha-glucans. The bacterial members are the
  glycogen-debranching enzymes GlgX (E. coli, P. putida and other
  Enterobacteria/Pseudomonadota): limit-dextrinases that remove the short
  (maltotriose/maltotetraose, DP3-DP4) alpha-1,6 branches left on glycogen after
  glycogen phosphorylase (GlgP) has shortened the outer chains, acting in
  glycogen catabolism (EC 3.2.1.196). The plant members are the plastidial
  isoamylases and pullulanases/limit-dextrinases that trim branches during
  starch synthesis and degradation. The PANTHER family carries a generic legacy
  amylo-alpha-1,6-glucosidase mapping (GO:0004135, EC 3.2.1.33) that names a
  different, glucose-releasing reaction; member gene reviews refine it to the
  specific debranching reactions.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are GH13 alpha-1,6-debranching hydrolases, but the substrate and
  exact reaction vary by clade: bacterial GlgX are glycogen limit-dextrinases
  (EC 3.2.1.196), while the plant members are isoamylases (EC 3.2.1.68) and
  pullulanases/limit-dextrinases (EC 3.2.1.41) acting on starch. The generic
  GO:0004135 amylo-alpha-1,6-glucosidase term (EC 3.2.1.33) is not the reaction
  of any member.
reference_protein:
  id: UniProtKB:P15067
  label: Glycogen debranching enzyme
  gene_symbol: glgX
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/glgX/glgX-ai-review.yaml
