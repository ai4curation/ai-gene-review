  name:
    name: 15-cis-zeta-carotene isomerase
    short: 15-cis-zeta-carot_isomerase
  description:
  - text: The 15-cis-zeta-carotene isomerase family is composed of chloroplastic enzymes
      that play a crucial role in the biosynthesis of carotenoids. Members of this
      family are responsible for the isomerization process, specifically catalyzing
      the conversion of the 15-cis-bond in 9,15,9'-tri-cis-zeta-carotene to its trans
      configuration. This reaction is a key step in the carotenoid biosynthetic pathway,
      which is essential for the production of compounds that contribute to the pigmentation,
      photosynthesis, and photoprotection in plants. The activity of the 15-cis-zeta-carotene
      isomerase family ensures the proper synthesis of carotenoids, which are vital
      for plant health and development.
