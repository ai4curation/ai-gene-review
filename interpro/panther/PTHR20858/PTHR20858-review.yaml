family_id: PANTHER:PTHR20858
family_name: PHOSPHOMETHYLPYRIMIDINE KINASE
preferred_name: HMP/HMP-P kinase (ThiD/THI20) family
summary: >-
  Ribokinase-fold kinases that phosphorylate 4-amino-5-hydroxymethyl-2-methylpyrimidine (HMP) and
  HMP-P to HMP-PP for thiamine synthesis (bacterial ThiD). S. cerevisiae THI20, THI21 and THI22 add
  a C-terminal TenA-like thiaminase II domain. S. pombe has thi20, thi201 and SPCC18B5.05c. A Treponema
  pyridoxine kinase subfamily (SF19) is related.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  HMP/HMP-P kinase activity holds for the ThiD/THI20 subfamilies (SF17, SF20, SF22). S. cerevisiae
  THI22 sits in SF17 but is dispensable and has no demonstrated activity. Treponema PdxK (SF19) is
  a pyridoxine kinase.
