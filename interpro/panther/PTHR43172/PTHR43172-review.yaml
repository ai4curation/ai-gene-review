family_id: PANTHER:PTHR43172
family_name: ADENYLOSUCCINATE LYASE
preferred_name: Eukaryotic/Bacillus-type adenylosuccinate lyases (ADSL/PurB) and related fumarate-eliminating
  lyases
summary: >-
  This family of the fumarase C/argininosuccinate lyase superfamily centres on adenylosuccinate lyase
  (ADSL/PurB; EC 4.3.2.2). ADSL is the homotetrameric enzyme that eliminates fumarate from SAICAR
  (giving AICAR, step 8 of de novo IMP synthesis) and from adenylosuccinate (giving AMP, the second
  step of the IMP-to-AMP branch). The ADSL subfamily (SF1) holds B. subtilis PurB and the eukaryotic
  enzymes: human and mouse ADSL, S. cerevisiae Ade13, S. pombe ade8, worm and fly ADSL. The same
  subfamily also holds bacterial paralogs that eliminate or add fumarate on other substrates. These
  are the fluopsin C biosynthetic lyases FlcB and FlcC of Pseudomonas aeruginosa (PA3516, PA3517)
  and the N-acetyl-S-(2-succino)cysteine lyases of Dickeya and Enterococcus. SF2 is a second group
  of superfamily members with different substrates: 3-carboxy-cis,cis-muconate cycloisomerase
  (PcaB), nitrosuccinate lyase (CreD), Ustilago trans-aconitate decarboxylase Tad1, and the
  uncharacterized S. pombe SPBC8E4.05c. Gammaproteobacterial-type PurB, including E. coli PurB, is in
  the separate family PTHR43411.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Adenylosuccinate lyase activity is the majority function but not a family-wide one. SF2 (ADENYLOSUCCINATE
  LYASE C-TERMINAL DOMAIN-CONTAINING PROTEIN) is functionally distinct: it contains PcaB,
  nitrosuccinate lyase and trans-aconitate decarboxylase. SF1, the ADSL subfamily the modules use,
  is not uniform either. It contains P. aeruginosa FlcB (an S-succinyl-L-cysteine-forming lyase) and
  FlcC (a lyase that releases thiohydroxamate and fumarate), both dedicated to fluopsin C
  biosynthesis, and the N-acetyl-S-(2-succino)cysteine lyases. FlcB and FlcC inherit the ADSL
  IBAs from PTN000154581; the 2SL enzymes do not.
