  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The placement is right for the ADSL clade. The seeds span B. subtilis and fungal and mammalian
    ADSL, and the human ADSL, yeast Ade13 and pombe ade8 gene reviews all accept the inherited
    activity. The PAINT GAF shows that the node's 78 recipients also include P. aeruginosa FlcB
    (PA3516, Q9HY93) and FlcC (PA3517, Q9HY92). Patteson et al. showed that these enzymes catalyse
    the first and fourth steps of fluopsin C biosynthesis: FlcB adds L-cysteine to fumarate, and FlcC
    cleaves a C-S bond to release thiohydroxamate and fumarate. Neither has been shown to cleave
    adenylosuccinate or SAICAR, and P. aeruginosa has a canonical PurB (PA2629) in PTHR43411. The
    FlcB/FlcC branch needs an IRD for the ADSL activity terms and for 'de novo' AMP biosynthesis.
    SF1 cannot be listed as affected because it also holds the true ADSLs. The
    N-acetyl-S-(2-succino)cysteine lyases in SF1 do not inherit, and neither does any SF2 member.
