notes: >-
  PAINT recipients were enumerated from the cached PAINT UniProt GAF. Q9HY93 (FlcB) and Q9HY92 (FlcC)
  receive GO:0004018, GO:0070626, GO:0044208 and GO:0005829 from PTN000154581, and M. tuberculosis
  PurB (I6XWA1) and fly AdSL (Q9VEP6) inherit as expected. The 2SL lyases (E0SKP1, E6LDH5) and the
  SF2 members (pcaB, CreD, Tad1, SPBC8E4.05c) receive nothing from that node. FlcB/FlcC are placed
  in SF1 by the PANTHER 19.0 P. aeruginosa classification file. The PTHR43172 PAINT slice also
  contains PTN009169798 (GO:0004018, GO:0006163). That node mainly reaches PTHR43411 members and is
  assessed in the PTHR43411 review; the only PTHR43172 member among its reviewed recipients is
  Synechocystis purB (P74384), a genuine PurB. The cytosol IBD at PTN000154581 (seed human ADSL) is
  sound for the ADSL clade.
