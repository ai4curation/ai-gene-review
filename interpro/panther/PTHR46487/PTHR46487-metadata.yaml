  name:
    name: Homologous Recombination Repair RAD51 Paralog
    short: HRR_RAD51_Paralog
  description:
  - text: This family of proteins is involved in the homologous recombination repair
      (HRR) pathway, which is crucial for the repair of double-stranded DNA breaks.
      Members of this family participate in the repair of chromosomal fragmentation,
      translocations, and deletions. They are components of the RAD51 paralog protein
      complex CX3, which functions in the BRCA1-BRCA2-dependent HR pathway. Following
      DNA damage, these proteins work downstream of RAD51 to bind and resolve Holliday
      junctions and replication fork junctions, processing HR intermediates late in
      the DNA repair process. They are also part of a PALB2-scaffolded HR complex
      with BRCA2 and RAD51C, contributing to DNA repair by HR. Additionally, they
      are implicated in the regulation of mitochondrial DNA copy number in response
      to oxidative stress.
