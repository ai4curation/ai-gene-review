    label: cysteine desulfurase activity
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR11601:SF34
    label: CYSTEINE DESULFURASE
  - id: PANTHER:PTHR11601:SF36
    label: CYSTEINE DESULFURASE NIFS-RELATED
  - id: PANTHER:PTHR11601:SF50
    label: CYSTEINE DESULFURASE ISCS 2-RELATED
  scope_reason: >-
    Cysteine desulfurase activity is experimentally established for SF34 members in
    bacteria (E. coli IscS) and eukaryotes (NFS1) and is the shared chemistry of the
    small bacterial SF36 and SF50 groups. It is excluded from the selenocysteine lyase
    subfamily SF62, which is specific for L-selenocysteine.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11601/PTHR11601-paint.tsv
    supporting_text: "PTHR11601\tPTN000175851\tGO:0031071\tF\tIBD\tfalse"
  - reference_id: PMID:11577100
    supporting_text: >-
      A deletion mutant of IscS lacking C-terminal residues 376-413
      (IscSDelta376-413) displayed cysteine desulfurase activity similar to the
      full-length protein
- assessed_term:
    id: GO:0016226
    label: iron-sulfur cluster assembly
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR11601:SF34
    label: CYSTEINE DESULFURASE
  scope_reason: >-
    IscS, NifS and NFS1 (SF34) are the sulfur donors of the Isc, Nif and mitochondrial
    ISC Fe-S assembly systems. Roles of the small SF36 and SF50 groups in Fe-S assembly
    are not established, and SF62 selenocysteine lyases have no Fe-S assembly role.
  supported_by:
  - reference_id: PMID:11432781
    supporting_text: >-
      Our findings support the conclusion that IscS, via cysteine desulfurase
      activity, provides the sulfur that is subsequently incorporated into Fe-S
      clusters
