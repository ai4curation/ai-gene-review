- subfamily_id: PANTHER:PTHR30333:SF1
  label: CYTOCHROME C-TYPE PROTEIN NAPC
  description: >-
    The largest subfamily, and an internally mixed one. It holds the canonical quinol
    dehydrogenases NapC, NirT and NrfH, the Geobacter inner-membrane cytochrome ImcH, and
    also OmcS, which shares none of their architecture. Membership of this subfamily is
    therefore not evidence that a protein oxidises quinol; see the residue site
    napc_nirt_tetraheme.
