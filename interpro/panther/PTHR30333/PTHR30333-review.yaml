term_assessments:
- assessed_term:
    id: GO:0009055
    label: electron transfer activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterised member transfers electrons through covalently bound c-type hemes,
    on both sides of the architectural split. This is the term the PAINT node already
    carries, and it is safe precisely because it says nothing about where the electrons
    come from or go to.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30333/PTHR30333-paint.tsv
    supporting_text: "PTHR30333\tPTN001251186\tGO:0009055\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0019645
    label: anaerobic electron transport chain
  scope: FAMILY_WIDE
  scope_reason: >-
    All characterised members act in anaerobic respiratory chains, whether at the inner
    membrane or at the extracellular end of the chain.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30333/PTHR30333-paint.tsv
    supporting_text: "PTHR30333\tPTN001251186\tGO:0019645\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0008121
    label: quinol-cytochrome-c reductase activity
  scope: RESIDUE_DETERMINED
  scope_reason: >-
    This is the activity that actually unites the family's core, and it is the one that
    cannot be granted by membership. A subfamily-level rule would get it wrong in both
    directions: SF1 contains NapC, NrfH and ImcH, which have the activity, and OmcS, which
    does not, so granting it to SF1 over-annotates OmcS and OmcT while denying it to SF1
    would strip it from NapC itself. Applicability has to be decided per protein by the
    presence of the NapC/NirT quinol-oxidising domain. Recorded here as the family-level
    rule rather than as a proposal to annotate: a separate question, raised in the ImcH
    review, is whether GO:0008121 is the right term at all, since its proton-transporter
    parents come from the cytochrome bc1 complex and do not hold for this family.
    OmcS is the member this bites on. It lacks the quinol-oxidising domain outright: no
    match to PF03264 or IPR005126, no transmembrane anchor, six heme motifs beginning
    straight after the signal peptide rather than four behind a membrane helix. UniProt
    curates it as a cell-surface protein and the cryo-EM structure shows it polymerised
    into extracellular filaments, so it never meets menaquinol and the activity is not
    merely unproven for it but unavailable to it. That exclusion is left to the site
    rather than written as a member exception, since under this scope the site is what
    decides each member.
