    gene_symbol: torY
    organism: Escherichia coli
  assessment: SOUND
  assessment_reason: >-
    Every member of this family that has been characterised, on either side of the
    architectural split, operates in an anaerobic respiratory chain. The quinol
    dehydrogenases sit in its middle, at the inner membrane; OmcS sits at its extracellular
    end, carrying electrons the last stretch to an insoluble oxide. The term is placed
    loosely enough to cover both, so the heterogeneity recorded at family level does not
    make this row unsafe. Seeded by TorC and TorY alone, which is a thin basis for a
    bacteria-wide placement, but the conclusion is independently supported by the
    characterised members throughout the family, so the thin seeding is not grounds to
    dispute the node.
