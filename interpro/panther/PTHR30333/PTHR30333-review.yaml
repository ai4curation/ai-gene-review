  assessment: SOUND
  assessment_reason: >-
    The term is generic enough to survive the family's heterogeneity, and that looks
    deliberate rather than lucky. The seeds are three inner-membrane quinol dehydrogenases,
    so a curator working from them could have placed a menaquinol:cytochrome c
    oxidoreductase term at this node; had they done so, OmcS and OmcT would have inherited
    an activity they do not have. What was placed instead is the bare carrier term, which
    is true of every member including the extracellular ones: OmcS filaments demonstrably
    transfer electrons, they simply do it somewhere else and to different acceptors. The
    placement at the bacterial root is also defensible, since NapC/NirT-domain proteins are
    distributed across proteobacteria, Desulfobacterota and epsilonproteobacteria. No
    pruning is needed for this term.
