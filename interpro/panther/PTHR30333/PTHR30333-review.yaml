residue_sites:
- site_id: napc_nirt_tetraheme
  label: Tetraheme CXXCH set of the NapC/NirT quinol-oxidising domain
  description: >-
    The four c-type heme attachment motifs of the periplasmic domain that defines this
    family, numbered on CymA. Together with the single N-terminal transmembrane helix
    (residues 13-33 of CymA) they constitute the NapC/NirT fold recognised as Pfam PF03264
    and InterPro IPR005126. Three of CymA's hemes are low-spin His/His coordinated and one
    is high-spin, lying next to the quinol-binding site, which is the arrangement that lets
    the protein take two electrons from menaquinol and pass them on singly.

    This site is recorded because it is what distinguishes the two groups this family
    lumps together, and because subfamily membership does not. OmcS is assigned to SF1
    alongside NapC and ImcH, yet it matches neither PF03264 nor IPR005126 and has no
    position homologous to the residues below; its six CXXCH motifs begin immediately
    after its signal peptide with no transmembrane anchor before them. Absence of this
    site is therefore not a degraded version of it but the absence of the whole domain,
    OmcS is listed as the negative control with no position or residue for exactly
    that reason: there is no homologous position to name, and inventing one would assert a
    correspondence that does not exist, so the validator reports that control as unchecked.
    A protein carrying this site may be annotated with quinol dehydrogenase activity on
    family grounds; one lacking it may not, whatever its subfamily says.
