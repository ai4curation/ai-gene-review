notes: >-
  Four things a later reviewer should know.

  First, the InterPro description carried in PTHR30333-metadata.yaml is machine-generated
  and unchecked (is_llm true, is_reviewed_llm false, checked false). It already hedges
  towards this review's conclusion, saying that "Some members are also implicated in
  extracellular electron transfer", but it is not an independent source and was not used
  as evidence here. The architectural claims above rest on Pfam and InterPro domain
  matches and on UniProt's curated records.

  Second, OmcS now has a gene review in this repository
  (genes/GEOSL/omcS/omcS-ai-review.yaml), written after this family review and consistent
  with it: the two IBA rows descending from PTN001251186 are accepted there on OmcS's own
  evidence, which is what the SOUND verdicts above predict, and no quinol dehydrogenase
  term is claimed.

  Third, OmcT (UniProtKB:Q74A87) is absent from PTHR30333-entries.csv, which lists only
  reviewed entries, but UniProt assigns it PTHR30333:SF1. It is OmcS's tandem paralog and
  shares its architecture, so the OmcS caveat should be read as covering it. It is named
  in prose rather than as a representative member because the cached PANTHER inventory
  does not carry it.

  Fourth, this family does not contain OmcZ, the other Geobacter nanowire cytochrome.
  OmcZ (UniProtKB:Q74BG5) has no PANTHER family at all and no InterPro family-level
  signature covering its mature filament-forming part, only the generic multiheme
  cytochrome superfamily and domains on the C-terminal region that is cleaved off during
  maturation. So the two polymerising cytochromes of the same organism are classified
  inconsistently: one is absorbed into a quinol dehydrogenase family, the other is
  unclassified. Both are worth raising with PANTHER.
