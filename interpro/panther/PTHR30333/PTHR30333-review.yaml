  - id: UniProtKB:Q74A86
    label: C-type cytochrome OmcS
    gene_symbol: omcS
    organism: Geobacter sulfurreducens
    gene_review: genes/GEOSL/omcS/omcS-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Not the subfamily as a whole, but one group inside it. OmcS carries no transmembrane
    anchor and no NapC/NirT N-terminal domain, is hexaheme rather than tetraheme, and is
    secreted and loosely held at the cell surface. Rather than oxidising menaquinol at the
    inner membrane it polymerises into micrometre-long extracellular filaments whose
    stacked hemes carry electrons to insoluble Fe(III) and Mn(IV) oxides and to syntrophic
    partners. Its paralog OmcT carries the same subfamily assignment in UniProt and is
    hexaheme with 62.6% identity to OmcS, so the same caveat applies to it.

    Two other resources already treat OmcS as its own thing rather than as a NapC relative:
    CDD gives it a dedicated conserved domain, cd21555, named "OmcS-like", and TCDB places
    it in family 5.B.3.1.1, "the geobacter nanowire electron transfer (g-net) family". Both
    are recorded on the UniProt entry alongside the PANTHER cross-reference, so the
    disagreement between classifications is visible in a single record.
