family_id: PANTHER:PTHR30333
family_name: CYTOCHROME C-TYPE PROTEIN
preferred_name: NapC/NirT/NrfH quinol dehydrogenases, plus unrelated extracellular multiheme
  cytochromes
summary: >-
  The core of this family is the NapC/NirT/NrfH group of bacterial quinol dehydrogenases:
  small monotopic inner-membrane proteins with a single N-terminal transmembrane helix
  anchoring a periplasmic tetraheme domain. They oxidise menaquinol at the periplasmic
  face of the inner membrane and pass the electrons to a dedicated terminal reductase or
  to a periplasmic carrier, which is how an anaerobic respiratory chain reaches an
  acceptor the cell cannot bring inside. NapC serves periplasmic nitrate reductase, NirT
  nitrite reduction, NrfH cytochrome c nitrite reductase, TorC and TorY the TMAO
  reductases, and CymA a whole set of acceptors in Shewanella including fumarate and
  insoluble Fe(III). The shared architecture is recognised independently of PANTHER as
  the NapC/NirT N-terminal domain (Pfam PF03264, InterPro IPR005126).

  Two members stretch that description. ImcH of Geobacter sulfurreducens keeps the
  NapC/NirT domain but is much larger, with three transmembrane helices and seven heme
  motifs rather than four (six CXXCH plus one CXXXCH), and it is the high-potential route out of the menaquinol pool
  rather than a dedicated partner of one reductase. OmcS of the same organism is not a
  quinol dehydrogenase at all: it has no transmembrane anchor, no NapC/NirT domain, and
  it polymerises outside the cell into conductive filaments. Its only shared signature
  with the rest of the family is the generic multiheme cytochrome fold.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family lumps inner-membrane quinol dehydrogenases (NapC, NirT, NrfH, TorC, TorY,
  CymA, ImcH) with at least one extracellular, polymerising cytochrome that does not
  oxidise quinol (OmcS, and by the same subfamily assignment its paralog OmcT). The split
  does not follow subfamily boundaries: OmcS sits in SF1 alongside NapC itself, so SF1 is
  internally mixed and no quinol-dehydrogenase term is safe even at subfamily level.
