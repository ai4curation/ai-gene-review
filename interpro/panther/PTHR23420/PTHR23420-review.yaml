family_id: PANTHER:PTHR23420
family_name: ADENOSYLHOMOCYSTEINASE
preferred_name: Adenosylhomocysteinase (SahH/SAH1/AHCY) family
summary: NAD-dependent S-adenosylhomocysteine hydrolases cleave the product of SAM-dependent methylation to adenosine and homocysteine, relieving product inhibition of methyltransferases (bacterial AhcY, S. cerevisiae SAH1, S. pombe sah1/pi047, human AHCY, plant SAHH). Vertebrate AHCYL1 (IRBIT) and AHCYL2 are non-catalytic paralogs that regulate the IP3 receptor and ion transporters.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Canonical AhcY/SAH1/AHCY enzymes hydrolyze SAH, whereas AHCYL regulators have a directly supported activity loss. The IKR subtree includes SF0 as well as SF2/SF3, so SF0 alone cannot encode the catalytic boundary.
