term_assessments:
- assessed_term:
    id: GO:0004131
    label: cytosine deaminase activity
  scope: UNRESOLVED
  scope_reason: >-
    The pyrimidine_salvage module selects the base family for the fungal cytosine deaminases. These
    do not form one subfamily: S. cerevisiae FCY1 is in SF190, but S. pombe SPCC965.14c is in SF149
    with the TAD2/ADAT2 tRNA deaminases, including S. pombe tad2 itself. No subfamily scope is therefore
    safe; the term holds for FCY1 and SPCC965.14c by their reviews.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11079/PTHR11079-paint.tsv
    supporting_text: "PTHR11079\tPTN000871231\tGO:0004131\tF\tIBD\tfalse"
  - reference_id: file:genes/yeast/FCY1/FCY1-ai-review.yaml
    supporting_text: IBA from PTN000871231 (C. albicans FCA1 and yeast FCY1 donors). Correct.
