family_id: PANTHER:PTHR11079
family_name: CYTOSINE DEAMINASE FAMILY MEMBER
preferred_name: >-
  Cytidine/deoxycytidylate deaminase-fold family (cytosine deaminase, tRNA adenosine deaminase, RibD)
summary: >-
  Zinc-dependent deaminases of the CDA fold. The family contains fungal cytosine deaminases (S. cerevisiae
  FCY1, Candida FCA1), bacterial TadA and eukaryotic TAD2/ADAT2 tRNA adenosine-34 deaminases, the
  inactive TAD3/ADAT3 partner subunits, guanine deaminase GuaD, and the deaminase domain of riboflavin
  biosynthesis RibD/PyrD.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrates differ widely by subfamily: cytosine (SF190), tRNA adenosine-34 (SF202, SF149, SF179),
  guanine (SF161) and a pyrimidine intermediate of riboflavin synthesis (SF162). TAD3/ADAT3 (SF156)
  is catalytically inactive.
