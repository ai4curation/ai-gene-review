  scope: UNRESOLVED
  scope_reason: >-
    The pyrimidine_salvage module selects the base family for the fungal cytosine deaminases. These
    do not form one subfamily: S. cerevisiae FCY1 is in SF190, but S. pombe SPCC965.14c is in SF149
    with the TAD2/ADAT2 tRNA deaminases, including S. pombe tad2 itself. No subfamily scope is therefore
    safe; the term holds for FCY1 and SPCC965.14c by their reviews.
  supported_by:
