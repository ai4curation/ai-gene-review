reviewed_by: claude-code
review_date: '2026-10-10'
notes: >-
  PANTHER placement of S. pombe SPCC965.14c in the ADAT2 subfamily SF149 looks inconsistent with
  its cytosine deaminase function, so GO:0052717 cannot be declared safe for all SF149 members.
  Human ADAT2 and ADAT3 confirm the expected metazoan split: PTN000118390 covers the catalytic
  ADAT2/TAD2 node, while SF156 carries the inactive tRNA-binding regulatory subunit and should not
  receive GO:0052717 except as a contributes_to complex subunit.
