notes: >-
  Tree topology, subfamily-to-node mapping and leaf membership come from the PANTHER 19
  treeinfo service (family=PTHR43489, fetched 2026-10-24). The root PTN000251284 is a
  duplication with six subfamily clades. PTN001740130 is the SF6 root (Eubacteria); within
  it a duplication PTN008682184 separates the OtnI clade PTN001740134 (H. influenzae,
  Salmonella, Yersinia and E. coli OtnI) from the SF13 clade PTN000251334 (P. aeruginosa
  PA0550/PA1501, Salmonella Gip, E. coli Hyi), and a horizontal-transfer node PTN008451312
  holds the metazoan HYI clade PTN000950119. PTN000251359 is the SF1 root and contains the
  SF8 UlaE clade PTN001740113. The glycolate/glyoxylate assimilation module should ground
  Hyi on SF13 (or the TIGR03234 equivalog), not on PTHR43489 or SF6. Swiss-Prot also places
  a Cupriavidus necator protein named 2-oxo-tetronate isomerase (Q0KBD1) in SF13, so the
  hydroxypyruvate versus 2-oxo-tetronate split does not exactly follow the subfamily
  boundary; whether SF13 enzymes are bifunctional is an open question.
