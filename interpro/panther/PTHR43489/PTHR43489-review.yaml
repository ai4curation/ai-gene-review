family_id: PANTHER:PTHR43489
family_name: ISOMERASE
preferred_name: Xylose isomerase-like TIM-barrel sugar epimerases/isomerases (hydroxypyruvate isomerase Hyi, 2-oxo-tetronate isomerase OtnI, L-ribulose-5-phosphate 3-epimerases UlaE/SgbU, ketose 3-epimerases)
summary: >-
  A bacterial family of cofactor-light isomerases and epimerases with the xylose
  isomerase-like TIM-barrel fold (Pfam AP_endonuc_2). Members interconvert small
  keto/hydroxy acids and ketose sugars. The best-characterized member is E. coli
  hydroxypyruvate isomerase Hyi (SF13), which interconverts hydroxypyruvate and tartronate
  semialdehyde next to glyoxylate carboligase and tartronate semialdehyde reductase in the
  bacterial glycerate pathway. Other subfamilies hold the 2-oxo-tetronate isomerases OtnI
  of four-carbon acid sugar catabolism and a horizontally acquired metazoan clade of
  "putative hydroxypyruvate isomerases" (SF6), the L-ribulose-5-phosphate 3-epimerases
  of the L-ascorbate utilization operons (UlaE, SF8; SgbU, SF1), and ketose/acid-sugar
  epimerases such as 3-dehydro-D-guloside 4-epimerase YcjR and Thermotoga 5-keto-L-gluconate
  epimerase (SF7).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The fold and the general chemistry (isomerization or epimerization next to a carbonyl)
  are shared, but substrates and pathways differ by subfamily: hydroxypyruvate (C3) for Hyi
  in SF13, 2-oxo-tetronate (C4) for OtnI in SF6, L-ribulose 5-phosphate for UlaE/SgbU in
  SF8/SF1, and acid sugars or ketoses in SF7. Substrate specificity is not cleanly aligned
  with subfamily labels: SF13 also contains a protein named 2-oxo-tetronate isomerase
  (Cupriavidus necator OtnI), and E. coli Hyi itself matches both the hydroxypyruvate
  isomerase and the 2-oxo-tetronate isomerase NCBIfam models. The PAINT hydroxypyruvate
  isomerase terms are therefore subfamily-level, not family-wide.
