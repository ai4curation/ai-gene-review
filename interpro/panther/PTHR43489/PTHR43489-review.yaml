  assessment_reason: >-
    Sound for the SF13 Hyi clade (PTN000251334): E. coli Hyi is the sole seed and was
    purified and shown to interconvert hydroxypyruvate and tartronate semialdehyde, and both
    the E. coli and P. putida hyi reviews accept the term (P. putida via a TreeGrafter IEA
    grafted on P. aeruginosa PA1501, PTN002460276, inside SF13). But the node is the root of
    SF6, so the term also descends to the sister enterobacterial/Haemophilus OtnI clade
    (PTN001740134), whose characterized members are 2-oxo-tetronate isomerases and for which
    hydroxypyruvate isomerase is a documented over-propagation, and to the horizontally
    acquired metazoan HYI clade (PTN000950119), which has no experimental activity. Some SF6
    bacterial members may still be genuine Hyi enzymes (Bradyrhizobium Hyi, Q89QG1, sits
    next to a GlxR ortholog), so pruning the OtnI branch with an IRD, or moving the IBD down
    to PTN000251334, is preferable to discarding the node.
