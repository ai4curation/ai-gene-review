family_id: PANTHER:PTHR43178
family_name: DIHYDROLIPOAMIDE ACETYLTRANSFERASE COMPONENT OF PYRUVATE DEHYDROGENASE COMPLEX
preferred_name: Lipoyl E2 acyltransferases of pyruvate and branched-chain 2-oxoacid dehydrogenases
summary: >-
  Lipoyl-domain E2 acyltransferases with a C-terminal 2-oxoacid dehydrogenase acyltransferase
  (chloramphenicol acetyltransferase-like) catalytic domain. They accept an acyl group from E1 on
  a lipoyl-lysine arm and transfer it to coenzyme A. The family combines two eukaryotic
  mitochondrial lineages: the branched-chain 2-oxoacid dehydrogenase E2 (human and bovine DBT,
  Arabidopsis BCE2; SF5 and SF14) and a plant mitochondrial pyruvate dehydrogenase E2 lineage
  (SF13, SF10). It also holds the gammaproteobacterial PDH E2 AceF (E. coli; SF2), other
  bacterial and archaeal E2s, and, by UniProt's assignment, B. subtilis acetoin-system AcoC
  (O31550).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Lipoyl-dependent acyl transfer to CoA is shared by every characterized member. The acyl group
  and the parent complex differ by subfamily: acetyl for PDH E2 (SF2, SF10, SF13), branched-chain
  acyl for BCKDH E2 (SF5 eukaryotes, SF14 plants), and acetyl from acetoin for B. subtilis AcoC.
  SF5 is internally mixed. Besides mitochondrial DBT it holds bacterial E2s of PDH and BCKDH type
  (Listeria, Mycobacterium) and, per UniProt, AcoC. PANTHER 19.0's per-organism file instead
  places AcoC in PTHR23151:SF90.
