summary: DIHYDROLIPOAMIDE ACETYLTRANSFERASE COMPONENT OF PYRUVATE DEHYDROGENASE COMPLEX (PANTHER:PTHR43178)
  is characterized in PANTHER PAINT across 5 ancestral PTN node(s) (PANTHER:PTN000567862, PANTHER:PTN000567956,
