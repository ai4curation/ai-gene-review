notes: >-
  Node extents come from the PANTHER 19.0 treeinfo API (2026-11-02) and were cross-checked against
  QuickGO IBA recipients: human DBT receives GO:0005739/GO:0160157 from PTN000567862 and GO:0043754
  from PTN001139778; E. coli AceF receives the three PTN000754013 terms. The acetoin module does
  not ground B. subtilis AcoC to this family, because PANTHER's per-organism classification
  (PTHR23151:SF90) and UniProt (PTHR43178:SF5) disagree. It uses InterPro IPR050743 instead.
  PR #5078 carries a machine-generated draft of this file; this curated version supersedes it.
