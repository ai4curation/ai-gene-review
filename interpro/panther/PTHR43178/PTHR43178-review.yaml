  OF PYRUVATE DEHYDROGENASE COMPLEX) span 5 distinct ancestral PTN nodes (PANTHER:PTN000567862, PANTHER:PTN000567956,
  PANTHER:PTN000754013, PANTHER:PTN001139778, PANTHER:PTN002459361) with different molecular function
  assignments across clades (dihydrolipoyllysine-residue succinyltransferase activity (GO:0004149), dihydrolipoyllysine-residue
  acetyltransferase activity (GO:0004742), dihydrolipoamide branched chain acyltransferase activity (GO:0043754)),
