node_assessments:
  - node_id: PANTHER:PTN001086401
    asserted_term:
      id: GO:0046922
      label: peptide-O-fucosyltransferase activity
    node_taxon: {id: "NCBITaxon:6072", label: Eumetazoa}
    paint_snapshot: "20210325"
    seeds:
      - {id: "UniProtKB:Q9H488", label: POFUT1, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: >-
      Every descendant of PTN001086401 (deuterostome POFUT1 plus some SF9 members)
      is a POFUT1 ortholog, and the activity is conserved, so nothing wrongly
      inherits it. The placement is shallower than the evidence supports, though:
      the node does not cover the sister ecdysozoan clade PTN008369569, so
      Drosophila OFUT1 and C. elegans PFUT-1 get no IBA even though OFUT1 activity is
      shown experimentally. PTN002328375 (the Eumetazoa node above both) or the
      root PTN001086381 would be the right placement. PANTHER labels PTN002328375 a
      duplication, but POFUT1 is single-copy in these genomes, so the label probably
      reflects a gene-tree/species-tree mismatch rather than a real paralog split.
  - node_id: PANTHER:PTN001086401
    asserted_term:
      id: GO:0036066
      label: protein O-linked glycosylation via fucose
    node_taxon: {id: "NCBITaxon:6072", label: Eumetazoa}
    paint_snapshot: "20210325"
    seeds:
      - {id: "UniProtKB:Q9H488", label: POFUT1, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: The process that the enzyme's own activity carries out; same coverage caveat as for GO:0046922.
  - node_id: PANTHER:PTN001086401
    asserted_term:
      id: GO:0008593
      label: regulation of Notch signaling pathway
    node_taxon: {id: "NCBITaxon:6072", label: Eumetazoa}
    paint_snapshot: "20210325"
    seeds:
      - {id: "UniProtKB:Q9H488", label: POFUT1, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: >-
      O-fucosylation of Notch EGF repeats is required for Notch signalling in mouse
      and Drosophila, and regulation (rather than direct participation) is the
      appropriate level for an enzyme that modifies the receptor and ligands.
  - node_id: PANTHER:PTN001086401
    asserted_term:
      id: GO:0005783
      label: endoplasmic reticulum
    node_taxon: {id: "NCBITaxon:6072", label: Eumetazoa}
    paint_snapshot: "20260529"
