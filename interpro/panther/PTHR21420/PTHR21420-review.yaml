notes: >-
  Tree structure (PANTHER treeinfo API, version 19): root PTN001086381
  (Metazoa-Choanoflagellida) > PTN002328375 (Eumetazoa, labelled duplication), which
  splits into PTN001086401 (Eumetazoa; deuterostome SF3 and part of SF9) and
  PTN008369569 (Eumetazoa; ecdysozoan SF10). All four PAINT terms sit on
  PTN001086401, so C. elegans pfut-1 and Drosophila O-fut1 have no IBA from this
  family (confirmed in the leaf PAINT GAF). PANTHER classification files and UniProt
  DR PANTHER agree on subfamily membership for POFUT1 (SF3), Pofut1 (SF3), O-fut1
  (SF10) and pfut-1 (SF10). The gene O-fut1 is the current FlyBase symbol; UniProt
  lists Ofut1 as the primary name.
