family_id: PANTHER:PTHR21420
family_name: GDP-FUCOSE PROTEIN O-FUCOSYLTRANSFERASE 1
summary: >-
  Protein O-fucosyltransferase 1 (POFUT1; Drosophila OFUT1, C. elegans PFUT-1) is an
  ER-resident GT65 enzyme that transfers fucose from GDP-fucose to a serine or
  threonine within correctly folded EGF repeats that carry the O-fucose consensus.
  Notch receptors and their DSL ligands are its principal substrates. O-fucose is
  the acceptor that Fringe glycosyltransferases elongate, and loss of POFUT1 removes
  both Fringe-dependent and Fringe-independent Notch signalling: Pofut1-null mouse
  embryos phenocopy loss of core Notch pathway components, and Ofut1 is required
  cell-autonomously in the Drosophila signal-receiving cell. The family is a
  single-copy orthology group present from choanoflagellates through vertebrates.
functional_coherence: COHERENT
coherence_reason: >-
  One ortholog per genome across Metazoa and choanoflagellates (40 leaves, 34
  species in the PANTHER 19.0 tree); vertebrate, insect and nematode members have
  the same activity. The three subfamilies share one name and one function: SF3 is
  the deuterostome clade, SF10 the ecdysozoan clade (Drosophila OFUT1, C. elegans
  PFUT-1), and SF9 holds basal metazoan and choanoflagellate members.
