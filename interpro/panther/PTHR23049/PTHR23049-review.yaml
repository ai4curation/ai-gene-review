family_id: PANTHER:PTHR23049
family_name: MYOSIN REGULATORY LIGHT CHAIN 2
preferred_name: Myosin regulatory light chains
summary: Myosin regulatory light chains modulate actomyosin assemblies through association with myosin
  heavy chains and regulatory phosphorylation. The group contains muscle-specific and nonmuscle paralogs
  with different expression and contractile contexts. The light chain is not the ATPase motor, and an
  EF-hand-like fold does not establish equivalent calcium sensing by every paralog.
functional_coherence: HETEROGENEOUS
coherence_reason: Regulatory-light-chain phosphorylation controls nonmuscle myosin filament organization
  in HeLa experiments (PMID:11942626). Muscle and nonmuscle paralogs differ in myosin partner, expression
  and contractile context. MYL10 has no comparable direct partner or phosphorylation assay in the retrieved
  sources, so the family supports a regulatory-light-chain comparison without establishing cardiac contraction,
  a specific heavy chain or identical calcium sensing for MYL10.
