family_id: PANTHER:PTHR43418
family_name: MULTIFUNCTIONAL TRYPTOPHAN BIOSYNTHESIS PROTEIN-RELATED
preferred_name: 'Class I glutamine amidotransferase family: TrpG/PabA and CarA'
summary: >-
  Class I (triad) glutamine amidotransferases that hydrolyse L-glutamine and
  pass ammonia to a partner synthase. SF7 (185 reviewed members) is the small
  chain of carbamoyl-phosphate synthase (CarA; S. cerevisiae CPA1, S. pombe
  arg5, P. putida CarA). SF4, SF2, SF8 and SF16 are TrpG/PabA-type
  amidotransferases. Most are anthranilate synthase component II (TrpG),
  standalone or fused: to TrpD in the enteric TrpGD (SF2), to
  indole-3-glycerol-phosphate synthase in budding-yeast TRP3, or in the fungal
  trifunctional TrpG-TrpC-TrpF proteins (Neurospora trp-1, Aspergillus trpC;
  PANTHER also assigns S. pombe trp1 here). SF4 also includes the dedicated
  p-aminobenzoate-pathway PabA proteins of enteric bacteria (E. coli PabA),
  the amphibolic B. subtilis PabA, and Pseudomonas TrpG. SF2 also includes P.
  aeruginosa PhnB, the pyocyanin-specific anthranilate synthase component II.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The partner synthase differs: carbamoyl-phosphate synthase for SF7;
  anthranilate synthase (TrpE) for most of SF4/SF2/SF8/SF16;
  aminodeoxychorismate synthase (PabB) for the PabA members of SF4. Fused
  catalytic domains (IGPS, PRAI, TrpD) are present only in some SF4 and SF2
  members, so the fused activities depend on architecture, not subfamily.
reference_protein:
  id: UniProtKB:P00937
  label: Multifunctional tryptophan biosynthesis protein
  gene_symbol: TRP3
  organism: Saccharomyces cerevisiae
  gene_review: genes/yeast/TRP3/TRP3-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43418:SF7
  label: CARBAMOYL-PHOSPHATE SYNTHASE SMALL CHAIN
  description: >-
    Carbamoyl-phosphate synthase small chain (CarA; P. putida CarA). The PANTHER
    19 HMM file classifies the fungal arginine-specific small chains S.
    cerevisiae CPA1 and S. pombe arg5 in PTHR11405:SF4, although UniProt
    cross-references arg5 here. Both receive this family's CarA-node IBAs.
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR43418:SF4
  label: MULTIFUNCTIONAL TRYPTOPHAN BIOSYNTHESIS PROTEIN
  description: >-
    43 reviewed members. 35 are standalone TrpG/PabA glutaminases (178-276
    residues), for example P. putida, P. aeruginosa and archaeal TrpG, plant
    ASB, E. coli and other enteric PabA, and B. subtilis PabA. 8 are fungal
    fusions of more than 360 residues (budding-yeast TRP3; Neurospora,
    Aspergillus and Phycomyces trifunctional proteins). P. putida PP_0420 is
    assigned here by PANTHER and UniProt. S. pombe trp1 is assigned here by
    the PANTHER HMM file, while UniProt cross-references it to PTHR22854:SF2.
  representative_members:
  - id: UniProtKB:P00937
    gene_symbol: TRP3
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/TRP3/TRP3-ai-review.yaml
  - id: UniProtKB:Q88QR8
    gene_symbol: pabA
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/pabA/pabA-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    The subfamily mixes partner specificities (TrpE versus PabB) and
    architectures (standalone versus IGPS- and PRAI-fused), which PANTHER does
    not separate at subfamily level.
- subfamily_id: PANTHER:PTHR43418:SF2
  label: BIFUNCTIONAL PROTEIN TRPGD
  description: >-
    Enteric and related TrpG and TrpGD proteins and P. aeruginosa PhnB. The
    PANTHER HMM file assigns E. coli TrpGD (P00904) here, whereas UniProt
    cross-references it to PTHR43285:SF2.
  diverged_from_family: false
  supported_by:
  - reference_id: file:interpro/panther/PTHR43418/PTHR43418-entries.csv
    supporting_text: "P09786,\"Anthranilate synthase component 2, pyocyanine specific\""
