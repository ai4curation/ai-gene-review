family_id: PANTHER:PTHR43418
family_name: MULTIFUNCTIONAL TRYPTOPHAN BIOSYNTHESIS PROTEIN-RELATED
preferred_name: 'Class I glutamine amidotransferase family: TrpG and CarA'
summary: >-
  Class I (triad) glutamine amidotransferase domains that supply ammonia to a partner synthase. SF7
  is the small chain of carbamoyl-phosphate synthase (CarA; S. pombe arg5, S. cerevisiae CPA1). SF4,
  SF2, SF8 and SF16 are anthranilate synthase component II (TrpG), sometimes fused to indole-3-glycerol-phosphate
  synthase (S. cerevisiae TRP3) or to TrpD.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The amidotransferase partner differs: carbamoyl-phosphate synthase (SF7) or anthranilate synthase
  (SF4, SF2, SF8, SF16). Fusion partners differ within SF4.
