notes: >-
  Counts come from the parsed entries.csv (241 reviewed proteins: SF7 185, SF4
  43, SF2 11, SF8 1, SF16 1). TrpG-clade node descendants were checked against
  the PANTHER 19.0 tree (treeinfo service): PTN000230074 is the TrpG/PabA
  clade, PTN000230115 the TrpGD/PhnB clade and PTN000747575 the PabA/Pseudomonas
  TrpG clade. The CarA nodes are not in the tree served for this family, so
  they are assessed from their seeds and the reviewed recipients. The
  tryptophan_biosynthesis module grounds the fungal TrpG-domain annoton on
  PTHR43418 (TRP3, trp1) and the TRP3-type IGPS annoton on SF4.
  The SUBFAMILY_ONLY exceptions for standalone glutaminases are generated from
  the entries.csv length field: 35 SF4 members below 300 residues, plus PP_0420,
  for GO:0004425. Five dedicated PabA proteins are exceptions for GO:0004049.
