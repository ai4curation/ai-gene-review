family_id: PANTHER:PTHR13131
family_name: CYSTINOSIN
preferred_name: Cystinosin cystine transporters
summary: Cystinosins are membrane proteins that export cystine from the lysosomal or vacuolar lumen. The
  experimentally annotated Drosophila Ctns record supports a cystine/proton transport function and a role
  in maintaining cysteine availability during fasting. Effects on mTORC1, autophagy and metabolism follow
  from this transport role and are not independent transport substrates.
functional_coherence: COHERENT
coherence_reason: The cystinosin inventory, curated IPR005282 description and experimentally supported
  fly lysosomal transport record agree on cystine export. Cysteine availability and TORC1 responses during
  fasting are consequences of mobilizing lysosomal cystine; they do not establish transport of unrelated
  amino acids. The ERS1 comparison supports the transporter family but does not make mammalian cystinosis
  phenotypes universal. PMID:35175796 directly tests the fly response to cystine mobilization; proton
  coupling in the reaction record is separately inferred from human CTNS.
