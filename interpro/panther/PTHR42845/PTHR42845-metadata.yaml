  name:
    name: Hydrogenase complex-associated protein
    short: Hydrogenase_assoc-protein
  description:
  - text: This family of proteins is involved in the biological process of hydrogen
      metabolism. Members of this family are typically part of enzyme complexes that
      play a role in the reduction of various electron acceptors. Some proteins in
      this family are known to reduce coenzyme F420, a low-potential two-electron
      acceptor, as well as artificial one-electron acceptors such as methylviologen.
      Others are part of bifunctional enzyme complexes with hydrogen-evolving hydrogenase
      activity, which can reduce protons to evolve hydrogen and may also have sulfur-reducing
      activity. These proteins are important for hydrogen cycling during fermentative
      growth and may interact with different cofactors such as NADPH or NAD.
