notes: >-
  Historical retrieval provenance (2026-11-02, commit 796de36063): the recorded
  `just fetch-panther-paint PTHR43796` run resolved 133 PTN nodes and retained no
  IBD/IRD rows. The member electronic annotations inspected then came from
  EC/Rhea (GO_REF:0000120) and InterPro (GO_REF:0000002). This records the scope
  and result of that retrieval, not a new fetch or proof that no ancestral
  function exists in the biology.
  No suitable PAINT functional node is established for this family, so no ancestral
  assertion is invented. SF4 is not experimentally grounded here and no functional
  scope is extended to it. SF2 membership must be combined with target-specific chemistry
  and substrate evidence. The current module audits retain BT_4612 and Cj0172c as
  unresolved candidates and HP_1507 as a sequence-start/construct concern. A wrong
  saccharopine name does not by itself prove an alternative substrate. Norspermidine
  production requires the appropriate substrate context and remains a gene-level judgement;
  the inferred Pseudomonas putida pathway does not establish native norspermidine
  synthesis. The module uses GO:0102143 for its actual putrescine reaction, while
  related agmatine and onward tetraamine chemistry remains outside that two-reaction
  boundary.
