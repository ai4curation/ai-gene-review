family_id: PANTHER:PTHR43796
family_name: CARBOXYNORSPERMIDINE SYNTHASE
preferred_name: Carboxy(nor)spermidine / carboxyaminopropylagmatine
  dehydrogenase family
summary: >-
  NADPH-dependent amine-condensing enzymes with a saccharopine-dehydrogenase-like
  fold. Characterized SF2 members condense aspartate semialdehyde with putrescine,
  diaminopropane, agmatine or longer polyamines in different experimental contexts.
  Vibrio genetics and biochemistry, Bacteroides fragilis purified-enzyme kinetics,
  and alphaproteobacterial pathway reconstruction support carboxyspermidine chemistry,
  while Synechocystis specialization and Clostridium CAPA reconstruction show that
  the same subfamily does not define one physiological substrate. PANTHER membership
  supplies evolutionary grouping, not a universal native pathway assignment. SF4 remains
  uncharacterized in this review.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reductive condensation chemistry is conserved among characterized members, but
  acceptor specificity and native metabolic role vary within SF2. Synechocystis strongly
  favors agmatine; Clostridium supports CAPA reconstruction as well as measurable
  diamine turnover, and some alphaproteobacterial pairs accept larger polyamines.
  Native substrate preference must be distinguished from measured promiscuity.
reference_protein:
  id: UniProtKB:Q9KRL3
  label: Carboxynorspermidine synthase
  gene_symbol: VC_1624
  organism: Vibrio cholerae serotype O1 (strain ATCC 39315 / El Tor Inaba
    N16961)
  gene_review: genes/VIBCH/VC_1624/VC_1624-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR43796:SF2
    label: CARBOXYNORSPERMIDINE SYNTHASE
    description: >-
      The characterized SF2 grouping includes diamine-active Vibrio and Bacteroides
      enzymes, alphaproteobacterial enzymes with broader reconstructed polyamine capability,
      and agmatine-series enzymes. The shared subfamily does not resolve these substrate
      preferences.
    representative_members:
      - id: UniProtKB:Q9KRL3
        label: Carboxynorspermidine synthase
        gene_symbol: VC_1624
        organism: Vibrio cholerae serotype O1 (strain ATCC 39315 / El Tor Inaba
          N16961)
        gene_review: genes/VIBCH/VC_1624/VC_1624-ai-review.yaml
      - id: UniProtKB:P0DPE4
        label: Carboxynorspermidine synthase
        gene_symbol: N646_1023
        organism: Vibrio alginolyticus (strain ATCC 17749 / NBRC 15630 / XII-53)
      - id: UniProtKB:Q55131
        label: Carboxyaminopropylagmatine dehydrogenase
        gene_symbol: slr0049
        organism: Synechocystis sp. (strain ATCC 27184 / PCC 6803 / Kazusa)
    diverged_from_family: false
    supported_by:
      - reference_id: PMID:19196710
        supporting_text: confirming VC1624 as the functional CANSDH
      - reference_id: PMID:1955861
        supporting_text: >-
          Carboxynorspermidine synthase, mediates the
          nicotinamide-nucleotide-linked reduction of the Schiff base
term_assessments:
  - assessed_term:
      id: GO:0102143
      label: carboxynorspermidine dehydrogenase activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      GO:0102143 explicitly includes carboxyspermidine oxidation to putrescine, so
      read reductively it covers the putrescine-to-carboxyspermidine reaction. This
      activity is grounded in characterized SF2 members, including direct Bacteroides
      fragilis kinetics; no evidence establishes it for SF4, so it must not be declared
      family-wide. The agmatine-specialized Synechocystis exception remains below.
      Clostridium measurable putrescine/DAP turnover supports biochemical capability
      but does not establish that either is its native primary reaction; its gene
      core instead records CAPA capability with native flux unresolved.
    supported_by:
      - reference_id: PMID:19196710
        supporting_text: confirming VC1624 as the functional CANSDH
      - reference_id: PMID:36283333
        supporting_text: CASDH condenses putrescine and aspartate β-semialdehyde
          into carboxyspermidine in an NADPH-dependent manner.
      - reference_id: PMID:37437886
        supporting_text: These data suggest that both enzymes can use putrescine
          or DAP and thus produce carboxyspermidine or carboxynorspermidine.
    member_exceptions:
      - member:
          id: UniProtKB:Q55131
          label: Carboxyaminopropylagmatine dehydrogenase
          gene_symbol: slr0049
          organism: Synechocystis sp. (strain ATCC 27184 / PCC 6803 / Kazusa)
        exception_reason: >-
          Q55131 is an agmatine-specific enzyme (EC 1.5.1.55, RHEA:78811) whose
          physiological product is carboxyaminopropylagmatine. Activity on
          putrescine and 1,3-diaminopropane is detectable but three to four
          orders of magnitude less efficient, with Km values in the millimolar
          range, so the carboxynorspermidine/carboxyspermidine reaction is not
          a function of this protein. PANTHER places it in SF2 with the Vibrio
          enzymes, so the exception cannot be expressed as a subfamily scope.
        supported_by:
          - reference_id: PMID:37878710
            supporting_text: the kcat/Km values are three to four orders of
              magnitude lower than that for agmatine, and the high Km values
              rule them out as feasible physiological substrates
          - reference_id: PMID:37878710
            supporting_text: The CAPA pathway starts with reductive condensation
              of agmatine and l-aspartate-β-semialdehyde into CAPA by a
              previously unknown CAPA dehydrogenase
    applicable_subfamilies:
      - id: PANTHER:PTHR43796:SF2
        label: CARBOXYNORSPERMIDINE SYNTHASE
  - assessed_term:
      id: GO:0008295
      label: spermidine biosynthetic process
    scope: UNRESOLVED
    scope_reason: >-
      Spermidine biosynthesis is established for several characterized members, but
      it is not safely assigned to every member from the family grouping alone. SF4
      is uncharacterized, candidate CASDH genes can have unresolved physiological
      roles, and same-subfamily CAPA/tetraamine capability requires partner and substrate
      context. Positive gene-level process evidence is retained; this unresolved family-level
      scope is not a denial of those supported cases.
    supported_by:
      - reference_id: PMID:19196710
        supporting_text: it increasingly uses putrescine as a substrate and
          forms carboxyspermidine, which is then converted to spermidine by
          CANSDC
      - reference_id: PMID:37878710
        supporting_text: and ends with conversion of aminopropylagmatine to
          spermidine by an aminopropylagmatine ureohydrolase
