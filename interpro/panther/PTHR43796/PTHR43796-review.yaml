family_id: PANTHER:PTHR43796
family_name: CARBOXYNORSPERMIDINE SYNTHASE
preferred_name: Carboxy(nor)spermidine / carboxyaminopropylagmatine dehydrogenase family
summary: >-
  Bacterial (with scattered archaeal) family of NADPH-dependent dehydrogenases
  with a saccharopine dehydrogenase-like three-domain fold, named CANSDH in
  InterPro (IPR050050) and carboxynorspermidine synthase by PANTHER. Members
  catalyse one chemistry: reductive condensation of L-aspartate 4-semialdehyde
  with the primary amine of a small amine acceptor, forming a Schiff base that
  is reduced using NADPH to give a carboxylated polyamine. The acceptor is what
  differs between members. The characterized Vibrio and Helicobacter enzymes
  accept 1,3-diaminopropane (giving carboxynorspermidine) and putrescine
  (giving carboxyspermidine), and together with the NspC decarboxylase of
  PTHR43727:SF1 they constitute the alternative, S-adenosylmethionine-independent
  route to sym-norspermidine and spermidine that is the dominant spermidine
  pathway of the human gut, stomach and oral microbiomes. The Synechocystis
  member is instead specific for agmatine, making carboxyaminopropylagmatine in
  a related pathway that does not pass through putrescine. All members assigned
  to the family's reviewed entries fall in subfamily SF2, so the diamine-versus-
  agmatine divergence is not resolved by PANTHER's subfamily classification and
  is recorded here as a member exception.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reaction type (NADPH-dependent reductive condensation of L-aspartate
  4-semialdehyde with an amine) is conserved, but amine specificity diverges:
  Synechocystis Q55131 is agmatine-specific, with kcat/Km for putrescine and
  1,3-diaminopropane three to four orders of magnitude lower, so terms naming
  the carboxynorspermidine or carboxyspermidine reaction do not hold for it.
reference_protein:
  id: UniProtKB:Q9KRL3
  label: Carboxynorspermidine synthase
  gene_symbol: VC_1624
  organism: Vibrio cholerae serotype O1 (strain ATCC 39315 / El Tor Inaba N16961)
  gene_review: genes/VIBCH/VC_1624/VC_1624-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR43796:SF2
    label: CARBOXYNORSPERMIDINE SYNTHASE
    description: >-
      The only subfamily holding reviewed entries. It contains the
      experimentally characterized carboxynorspermidine/carboxyspermidine
      dehydrogenases of Vibrio cholerae and Vibrio alginolyticus and, despite
      the subfamily name, also the agmatine-specific carboxyaminopropylagmatine
      dehydrogenase of Synechocystis sp. PCC 6803.
    representative_members:
      - id: UniProtKB:Q9KRL3
        label: Carboxynorspermidine synthase
        gene_symbol: VC_1624
        organism: Vibrio cholerae serotype O1 (strain ATCC 39315 / El Tor Inaba N16961)
        gene_review: genes/VIBCH/VC_1624/VC_1624-ai-review.yaml
      - id: UniProtKB:P0DPE4
        label: Carboxynorspermidine synthase
        gene_symbol: N646_1023
        organism: Vibrio alginolyticus (strain ATCC 17749 / NBRC 15630 / XII-53)
      - id: UniProtKB:Q55131
        label: Carboxyaminopropylagmatine dehydrogenase
        gene_symbol: slr0049
        organism: Synechocystis sp. (strain ATCC 27184 / PCC 6803 / Kazusa)
    diverged_from_family: false
    supported_by:
      - reference_id: PMID:19196710
        supporting_text: confirming VC1624 as the functional CANSDH
      - reference_id: PMID:1955861
        supporting_text: >-
          Carboxynorspermidine synthase, mediates the
          nicotinamide-nucleotide-linked reduction of the Schiff base
term_assessments:
  - assessed_term:
      id: GO:0102143
      label: carboxynorspermidine dehydrogenase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The GO term is the EC 1.5.1.43 reaction, and its definition covers both
      directions explicitly: after stating the carboxynorspermidine reaction it
      adds "Also converts carboxyspermidine to putrescine." (verified against the
      GO release used for validation and against QuickGO on 2026-11-02; the
      definition writes the reaction in the NADP+ direction, so read reductively
      this is the putrescine-to-carboxyspermidine step). The definition is not the
      only grounding: the term is the EC 1.5.1.43 class and carries both of its
      Rhea reactions, RHEA:34111 (carboxyspermidine) and RHEA:34115
      (carboxynorspermidine), and Swiss-Prot curates both on the characterized
      members, so the two-direction reading holds on the EC/Rhea mapping alone. That is the
      reaction established for the characterized Vibrio and Helicobacter members
      and the activity the family HMM and InterPro IPR050050 are built around, so
      it is the default reading for an uncharacterized member, with the
      agmatine-specialized exception recorded below. The scope rests on the
      characterized members, all of which are in SF2; see the note on SF4 for how
      far it reaches.
    supported_by:
      - reference_id: PMID:19196710
        supporting_text: confirming VC1624 as the functional CANSDH
      - reference_id: PMID:36283333
        supporting_text: CASDH condenses putrescine and aspartate β-semialdehyde into carboxyspermidine in an NADPH-dependent manner.
    member_exceptions:
      - member:
          id: UniProtKB:Q55131
          label: Carboxyaminopropylagmatine dehydrogenase
          gene_symbol: slr0049
          organism: Synechocystis sp. (strain ATCC 27184 / PCC 6803 / Kazusa)
        exception_reason: >-
          Q55131 is an agmatine-specific enzyme (EC 1.5.1.55, RHEA:78811) whose
          physiological product is carboxyaminopropylagmatine. Activity on
          putrescine and 1,3-diaminopropane is detectable but three to four
          orders of magnitude less efficient, with Km values in the millimolar
          range, so the carboxynorspermidine/carboxyspermidine reaction is not
          a function of this protein. PANTHER places it in SF2 with the Vibrio
          enzymes, so the exception cannot be expressed as a subfamily scope.
        supported_by:
          - reference_id: PMID:37878710
            supporting_text: the kcat/Km values are three to four orders of magnitude lower than that for agmatine, and the high Km values rule them out as feasible physiological substrates
          - reference_id: PMID:37878710
            supporting_text: The CAPA pathway starts with reductive condensation of agmatine and l-aspartate-β-semialdehyde into CAPA by a previously unknown CAPA dehydrogenase
  - assessed_term:
      id: GO:0008295
      label: spermidine biosynthetic process
    scope: FAMILY_WIDE
    scope_reason: >-
      Every characterized member supplies the carboxylated intermediate of a
      spermidine route: carboxyspermidine in the Vibrio/Helicobacter enzymes and
      carboxyaminopropylagmatine in Synechocystis, whose pathway also ends in
      spermidine. The process term therefore survives the substrate divergence
      that the molecular-function term does not.
    supported_by:
      - reference_id: PMID:19196710
        supporting_text: it increasingly uses putrescine as a substrate and forms carboxyspermidine, which is then converted to spermidine by CANSDC
      - reference_id: PMID:37878710
        supporting_text: and ends with conversion of aminopropylagmatine to spermidine by an aminopropylagmatine ureohydrolase
references:
  - id: PMID:19196710
    title: An alternative polyamine biosynthetic pathway is widespread in bacteria and essential for biofilm formation in Vibrio cholerae.
  - id: PMID:1955861
