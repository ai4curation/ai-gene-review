  - id: PMID:36283333
    title: Structural analysis of carboxyspermidine dehydrogenase from Helicobacter pylori.
  - id: PMID:37878710
    title: A bacterial spermidine biosynthetic pathway via carboxyaminopropylagmatine.
  - id: PMID:22025614
    title: Alternative spermidine biosynthetic route is critical for growth of Campylobacter jejuni and is the dominant polyamine pathway in human gut microbiota.
review_status: COMPLETE
reviewed_by: claude-code
review_date: "2026-11-02"
notes: >-
  PAINT has no node-level annotations for this family: `just fetch-panther-paint
  PTHR43796` resolves 133 PTN nodes but retains no IBD/IRD rows, so no
  node_assessments can be written and none are invented here. The family is
  consequently not a source of IBA propagation, and the IEA annotations its
  members carry come from EC/Rhea (GO_REF:0000120) and InterPro
  (GO_REF:0000002) instead.
  Subfamilies: panther.obo gives this family exactly two, SF2
  (CARBOXYNORSPERMIDINE SYNTHASE), which holds every reviewed entry and all the
  characterized members, and SF4 (SACCHAROPINE DEHYDROGENASE NADP BINDING
  DOMAIN-CONTAINING PROTEIN), which holds no reviewed entry at all. SF4's
  membership is therefore unverified here: its name says only that its members
  carry the shared NADP-binding domain, which is the fold the whole family has,
  and nothing in the local data says whether those proteins condense a diamine or
  do something else with it. The FAMILY_WIDE scopes above rest on the
  characterized SF2 members and are the default reading for an uncharacterized
  member; they are not a verified claim about SF4, and an SF4 member whose own
  evidence points elsewhere should be recorded as a member exception rather than
  forced to inherit.
  GO:0045312 (nor-spermidine biosynthetic process) is deliberately left without a
  term assessment. The characterized Vibrio members do make carboxynorspermidine,
  the norspermidine precursor, but whether any given member feeds norspermidine or
  spermidine turns on which diamine its organism supplies, 1,3-diaminopropane or
  putrescine, and not on a property of the family. That makes it a per-gene
  judgement, ACCEPT in the Vibrio cholerae nspC review and KEEP_AS_NON_CORE in the
  Pseudomonas putida one, so asserting a family scope for it would overstate what
  the family determines. This family review
  is what the module bacterial_carboxyspermidine_biosynthesis grounds its
  dehydrogenase step on, together with NCBIfam NF043000 (carsnrspmd_synth) and
  InterPro IPR050050, which are narrower than the PANTHER subfamily because they
  are built on the carboxynorspermidine synthase chemistry specifically.
