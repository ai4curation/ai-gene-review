  name:
    name: Carboxynorspermidine Synthase
    short: CANSD_Synthase
  description:
  - text: This family of proteins is involved in the biosynthesis of norspermidine,
      a polyamine compound that plays a role in cellular growth and proliferation.
      Members of this family catalyze the formation of carboxynorspermidine from L-aspartate
      4-semialdehyde and 1,3-diaminopropane, with some also showing activity using
      putrescine as a substrate. Additionally, these enzymes are known to be regulated
      by redox conditions, being activated by reducing agents like dithiothreitol
      and inhibited by compounds that react with sulfhydryl groups. One of the proteins
      in this family is also implicated in the essential process of biofilm formation
      in bacteria.
