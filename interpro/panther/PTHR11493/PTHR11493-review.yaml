notes: >-
  Module: aps_dependent_assimilatory_sulfate_reduction uses SF47 twice, for CysI (CysJ/CysI
  complex variant) and for MET5/sir1 (Met10/Met5 variant), each inside a GO:0009337 protein
  complex with GO:0004783. The MET5 and sir1 gene reviews accept GO:0000103, GO:0004783 and
  GO:0009337 IBAs; consistent here. The module's description that the FMN flavodoxin domain of
  the yeast enzyme is on MET5 matches UniProt (MET5 Pfam PF00258 Flavodoxin_1, domain 682-831)
  and the MET10 review. P. putida KT2440 CysI (Q88KB9, genes/PSEPK/cysI) is in PTHR32439, not
  this family, as the module notes. Donor identities of O23813, Q9AWB2, Q9LZ66 (EC 1.8.7.1) and
  P17846 (EC 1.8.1.2) were checked by UniProt REST on 2026-10-06.
