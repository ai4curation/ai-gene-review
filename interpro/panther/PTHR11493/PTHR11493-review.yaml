family_id: PANTHER:PTHR11493
family_name: SULFITE REDUCTASE [NADPH] SUBUNIT BETA-RELATED
preferred_name: Siroheme sulfite reductase hemoproteins (assimilatory NADPH- and ferredoxin-dependent) and anaerobic sulfite reductases
summary: >-
  Siroheme/[4Fe-4S] hemoproteins that carry out the six-electron reduction of sulfite to sulfide.
  The main subfamily (SF47) contains the assimilatory sulfite reductase catalytic subunits of
  three electron-supply architectures: the enterobacterial NADPH enzyme CysI (paired with the
  CysJ flavoprotein), the fungal NADPH enzyme beta subunit MET5/ECM17 of S. cerevisiae and sir1 of
  S. pombe (paired with MET10, and itself carrying an extra flavodoxin-like FMN domain), and the
  plastid ferredoxin-dependent sulfite reductases of plants (Arabidopsis SIR, maize, soybean),
  which take electrons directly from ferredoxin. A small second subfamily (SF54) holds anaerobic
  sulfite reductase subunit C (Salmonella AsrC) and dissimilatory-type sulfite reductase alpha
  subunits (Desulfovibrio DsvA, Archaeoglobus DsrA).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Sulfite reduction to sulfide at a siroheme/[4Fe-4S] centre is common to all characterized
  members. What diverges is the electron donor and the physiological role. Within SF47, CysI,
  MET5 and sir1 work with NADPH via a diflavin partner (GO:0004783, contributes_to), whereas the
  plant enzymes are ferredoxin-dependent (GO:0050311); the subfamily boundary does not separate
  them, so PAINT nodes and not SF47 must scope the donor-specific terms. SF54 is anaerobic or
  dissimilatory sulfite reduction rather than sulfate assimilation.
