term_assessments:
- assessed_term:
    id: GO:0004783
    label: sulfite reductase (NADPH) activity
  scope: UNRESOLVED
  scope_reason: >-
    Holds (as contributes_to, in the complex) for the fungal MET5/sir1 and enterobacterial CysI
    hemoproteins, but not for the plant ferredoxin-dependent enzymes, which share SF47. The donor
    is decided by the partner architecture, not by the subfamily, so the term must be scoped by
    PAINT node (PTN001285008 for fungi) or by member. The aps module correctly attaches
    GO:0004783 to the MET10/MET5 and CysJ/CysI complexes rather than to SF47 alone; an SF47
    selector without a complex or required_function constraint would also pick up plant
    ferredoxin-sulfite reductases.
  supported_by:
  - reference_id: PMID:19236486
    supporting_text: >-
      Specific mutations in the MET10 and MET5 genes, which encode the catalytic alpha- and
      beta-subunits of the sulfite reductase enzyme, respectively, were identified in six of the
      isolated strains.
  - reference_id: PMID:6751400
    supporting_text: >-
      Yeast NADPH-sulfite reductase (hydrogen sulfide:NADP+ oxidoreductase, EC 1.8.1.2) is a
      complex hemoflavoprotein.
- assessed_term:
    id: GO:0009337
    label: sulfite reductase complex (NADPH)
  scope: UNRESOLVED
  scope_reason: >-
    Correct for the NADPH enzymes (MET5, sir1, CysI; PAINT nodes PTN001285008 and PTN002608471)
    but not for the plant ferredoxin enzymes in the same subfamily, which do not form the
    NADPH diflavin complex.
  supported_by:
  - reference_id: PMID:6751400
    supporting_text: >-
      The enzyme consists of two types of subunit, alpha and beta, having molecular weights of
      116,000 and 167,000, respectively.
- assessed_term:
    id: GO:0000103
    label: sulfate assimilation
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for SF47 (all assimilatory sulfite reductases, NADPH- or ferredoxin-dependent). Not
    established for SF54 anaerobic/dissimilatory sulfite reductases.
  applicable_subfamilies:
  - id: PANTHER:PTHR11493:SF47
    label: SULFITE REDUCTASE [NADPH] SUBUNIT BETA
  supported_by:
