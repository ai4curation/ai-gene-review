  name:
    name: Ciliary function-associated GTPase
    short: Ciliary_GTPase
  description:
  - text: This family of proteins includes small GTPases involved in ciliary function
      and development. Members are cilium-specific and play a crucial role in controlling
      the microtubule-based axoneme structure of cilia. They are implicated in maintaining
      the association between intraflagellar transport (IFT) subcomplexes A and B,
      which is essential for ciliary signaling and function. These proteins are also
      involved in the development of the cerebral cortex by regulating the formation
      of a polarized radial glial scaffold and the migration and placement of interneurons.
      Although they bind GTP, their ability to hydrolyze it is unclear, with some
      members having an incomplete active site that likely contributes to the lack
      of GTPase activity.
