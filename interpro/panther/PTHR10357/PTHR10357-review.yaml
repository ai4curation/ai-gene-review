    gene_symbol: treY
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/treY/treY-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    An intramolecular transglycosylase (isomerase, EC 5.4.99.15) rather than a
    hydrolase: it rearranges the reducing-end linkage of an alpha-glucan and
    releases no glucose.
  supported_by:
