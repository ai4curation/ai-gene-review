family_id: PANTHER:PTHR10357
family_name: ALPHA-AMYLASE FAMILY MEMBER
preferred_name: GH13 alpha-amylase superfamily (glucosidases, amylases, TreY, TreS and the rBAT heavy chain)
summary: >-
  A large glycoside hydrolase family 13 (GH13) family whose members share the
  (beta/alpha)8 alpha-amylase catalytic barrel but act on different bonds and
  substrates. It includes endo-acting alpha-amylases (E. coli MalS, Bacteroides
  SusG), exo-acting alpha-1,4-glucosidases and maltases (E. coli MalZ, yeast
  MAL12/MAL32), alpha-1,6-specific isomaltases (yeast IMA1-IMA5), trehalose
  6-phosphate hydrolases (E. coli TreC), neopullulanases and
  cyclomaltodextrinases, and two isomerase-type transglycosylases of trehalose
  synthesis: TreY maltooligosyl trehalose synthase (SF216) and TreS maltose
  alpha-D-glucosyltransferase (SF219). The vertebrate rBAT/SLC3A1 heavy chain of
  heteromeric amino-acid transporters keeps the GH13 fold but has no detected
  glucosidase activity. Activity therefore has to be read per clade, not
  inherited from the family.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members differ in reaction class (hydrolase vs intramolecular
  transglycosylase/isomerase), bond specificity (alpha-1,4 vs alpha-1,6),
  mode (endo vs exo) and, in the vertebrate rBAT clade, have lost catalysis and
  serve as a transporter heavy chain. Only the GH13 fold and carbohydrate
  binding are family-wide.
