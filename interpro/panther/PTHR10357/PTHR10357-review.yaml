- subfamily_id: PANTHER:PTHR10357:SF216
  label: MALTOOLIGOSYL TREHALOSE SYNTHASE-RELATED
  clade_node_id: PANTHER:PTN008498486
  description: >-
    TreY maltooligosyl trehalose synthases, the first enzyme of the TreY/TreZ
    trehalose route. They convert the reducing-end alpha-1,4 glucosidic bond of
    an alpha-glucan into an alpha,alpha-1,1 bond by intramolecular
    transglycosylation, forming maltooligosyltrehalose for TreZ. The PANTHER
    clade holds bacterial and archaeal members only.
  representative_members:
