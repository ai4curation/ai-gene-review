  assessment_reason: Retained ATP hydrolysis is supported for F1-beta complexes as well as the primary V1-A
    hydrolysis role. Primary spinach experiments show hydrolytically active detached F1 and redox-dependent
    inhibition (PMID:29748256; PMID:32879423). The synthesis reaction does not replace or refine the reverse
    reaction; Populus atpB retains the latter as non-core. SOUND here evaluates the capability of the cached
    assertion, not a reconstructed current PTN000389800 target lineage, which is unavailable.
