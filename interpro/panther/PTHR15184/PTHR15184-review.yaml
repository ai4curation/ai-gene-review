family_id: PANTHER:PTHR15184
family_name: ATP SYNTHASE
preferred_name: F1-beta / V1-A catalytic nucleotide-binding subunit family
summary: >-
  This family unites the catalytic nucleotide-binding subunits of the rotary ATPases:
  the beta subunit of F-type ATP synthases (bacterial F1-beta, mitochondrial ATP5F1B,
  chloroplast atpB) and the A subunit of V-type proton ATPases, together with related
  T3SS/flagellar ATPases. The F- and V-branches run the same rotary chemistry in
  opposite physiological directions: F-ATP synthases use the proton-motive force to make
  ATP at the inner mitochondrial or thylakoid membrane, while V-ATPases hydrolyse ATP to
  acidify vacuoles, lysosomes and endosomes. Localization and direction-of-reaction
  terms therefore split cleanly along the F/V paralog boundary, and any deep-node
  assertion that crosses it mis-annotates one side.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The F-synthase branch (chloroplast/mitochondrial/bacterial beta subunits) synthesizes
  ATP at energy-transducing membranes; the V-ATPase branch (subunit A) hydrolyses ATP at
  the tonoplast/lysosome. Both are catalytic Walker-motif subunits of rotary complexes,
  so fold-level reasoning cannot separate them; the split is a paralog boundary, and
  vacuolar localization or ATPase-direction terms are wrong for the F-branch just as
  synthase-direction terms are wrong for the V-branch.
reference_protein:
  id: UniProtKB:P06576
  label: ATP synthase F(1) complex subunit beta, mitochondrial
  gene_symbol: ATP5F1B
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR15184:SF71
    label: ATP SYNTHASE SUBUNIT BETA, MITOCHONDRIAL
    description: >-
      The main F-synthase beta subfamily. Despite the mitochondrial name it spans
      bacterial, mitochondrial and chloroplast beta subunits: in the fetched slice it
      holds 959 members of which 169 are named chloroplastic (including plastid-encoded
      plant atpB) and 12 mitochondrial, the rest generic bacterial-style beta subunits.
      It is flagged diverged_from_family false because it is the family-consensus
      F-synthase branch; the heterogeneity this review records lies across the F/V
      paralog boundary with the V-ATPase subfamilies, not inside SF71.
    representative_members:
      - id: UniProtKB:P06576
        label: ATP synthase F(1) complex subunit beta, mitochondrial
        organism: Homo sapiens
    diverged_from_family: false

