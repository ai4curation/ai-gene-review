      label: Viridiplantae
    paint_snapshot: "20260828"
    seeds:
      - id: UniProtKB:P31405
        label: V-type proton ATPase catalytic subunit A
        organism: Gossypium hirsutum
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      The single seed is the cotton V-type proton ATPase catalytic subunit A, for which
      plant-type vacuole is correct. The node is placed so that plastid-encoded
      F-synthase beta subunits also descend from it: poplar atpB (an SF71 chloroplast
      thylakoid F1-beta) receives this term as an IBA with exactly this WITH/FROM. A
      vacuolar component term must not cross the V1-A/F1-beta paralog boundary; the
      F-branch needs an IRD/NOT.
    affected_subfamilies:
      - id: PANTHER:PTHR15184:SF71
        label: ATP SYNTHASE SUBUNIT BETA, MITOCHONDRIAL
  - node_id: PANTHER:PTN000389800
    asserted_term:
      id: GO:0046961
      label: proton-transporting ATPase activity, rotational mechanism
    paint_snapshot: "20260115"
    seeds:
      - id: MGI:MGI:1201780
    assessment: SOUND
    assessment_reason: >-
      Unlike the vacuolar localization assessed above, the hydrolysis-direction rotary activity
      is a capability all descendants plausibly share: V1-A subunits hydrolyse ATP as
      their physiological reaction, and F1-beta subunits demonstrably run the same
      chemistry in reverse -- the human SF71 member ATP5F1B carries a direct IMP
      annotation for this very term from cell-surface ecto-ATP synthase hydrolysis
      (its gene review keeps it as non-core), and chloroplast CF1 has a latent,
      redox-regulated ATPase activity. For F-synthase subunits the synthesis-direction
      term GO:0046933 is the better primary annotation, and gene reviews (poplar atpB)
      narrow the inherited term accordingly, but that is a granularity preference,
      not a placement error.
