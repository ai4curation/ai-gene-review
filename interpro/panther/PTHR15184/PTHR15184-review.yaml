      - id: UniProtKB:P06576
        label: ATP synthase F(1) complex subunit beta, mitochondrial
        organism: Homo sapiens
      - id: UniProtKB:P0ABB4
    assessment: SOUND
    assessment_reason: >-
      Synthase-direction rotary activity seeded by fungal, human and E. coli F1-beta
      subunits, placed on the F-synthase branch where every descendant is a catalytic
      beta subunit of an F-type synthase. This is the placement the vacuole assessment
      above should be contrasted with: the curators already keep the synthase-direction
