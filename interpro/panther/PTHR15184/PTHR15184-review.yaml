family_id: PANTHER:PTHR15184
family_name: ATP SYNTHASE
preferred_name: F1-beta / V1-A catalytic nucleotide-binding subunit family
summary: The cached family records group catalytic nucleotide-binding subunits of rotary ATPases, including
  F-type ATP synthase beta and V-type ATPase A proteins. F-type complexes predominantly synthesize ATP using
  a proton gradient but retain regulated reverse ATP hydrolysis. Physiological reaction preference therefore
  cannot be used to reject hydrolysis capacity. Vacuolar localization and functional complex membership require
  separate phylogenetic and localization evidence. The family also contains the bacterial type III export
  ATPases (flagellar FliI and injectisome SctN), paralogs of F1-beta that assemble into FliH/FliI/FliJ-type
  cytoplasmic rings and hydrolyse ATP to release export chaperones and unfold substrates; they have no Fo
  sector and do not synthesize ATP.
functional_coherence: HETEROGENEOUS
coherence_reason: The cached F/V groupings differ in complex membership and typical physiological direction.
  A second paralog boundary separates the F1-beta clade (PTN008558588) from the eubacterial type III export
  ATPase clade (PTN000390097; SF9 SPI-1 T3SS ATPase, SF62 SPI-2 T3SS ATPase, SF81 flagellum-specific ATPase),
  which are protein-exporting ATPases rather than ATP synthases (PMID:8943245; PMID:21934659).
  Primary chloroplast studies establish ATP hydrolysis as a retained, redox-regulated F-type capacity (PMID:29748256;
  PMID:32879423). The current tree contains the F1-beta node PTN008558586 but lacks exact Populus A4GYR7 and
  the old PTN000389800/801/877 ids. The old target-specific vacuolar placement allegation therefore cannot
  be reconstructed from this tree.
