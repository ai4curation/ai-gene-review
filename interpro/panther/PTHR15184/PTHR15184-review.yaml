  description: 'The main F-synthase beta subfamily. Despite the mitochondrial name it spans bacterial, mitochondrial
    and chloroplast beta subunits: in the fetched slice it holds 959 members of which 169 are named chloroplastic
    (including plastid-encoded plant atpB) and 12 mitochondrial, the rest generic bacterial-style beta subunits.
    It is flagged diverged_from_family false because it is the family-consensus F-synthase branch; the heterogeneity
    this review records lies across the F/V paralog boundary with the V-ATPase subfamilies, not inside SF71.'
