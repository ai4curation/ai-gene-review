notes: >-
  Written during the POPTR IBA re-review pass to back the poplar atpB gene review, which
  removes the vacuolar-membrane and plant-type-vacuole IBAs and narrows the
  hydrolysis-direction rotary activity to GO:0046933. Node/term pairs, seeds and
  snapshot dates are verbatim from the cached PTHR15184-paint.tsv; subfamily accession
  and label are verbatim from panther.obo; the SF71 composition figures come from the
  fetched PTHR15184-entries.csv (slice capped at 1000 members). UniProt labels for
  P31405 and P06576 were verified against UniProt. The poplar atpB GOA also carries a
  GO:0005774 vacuolar-membrane IBA citing node PTN000389801; that node does not appear
  in the current cached PAINT slice (the vacuolar component assertions appear since
  re-curated onto PTN000389802 GO:0000221 and PTN000389877 GO:0000325), so no assessment
  is recorded for it rather than guessing at a row that no longer exists.

  No residue_sites: the F/V split is a paralog-boundary and reaction-direction question,
  not a point-residue one -- both branches conserve the Walker nucleotide-binding
  machinery, which is exactly why fold-level transfer mis-fires here.
