family_id: PANTHER:PTHR34182
family_name: PROTEIN-EXPORT MEMBRANE PROTEIN SECG
functional_coherence: COHERENT
preferred_name: Bacterial SecG translocon accessory subunit family
summary: >-
  PTHR34182 contains SecG, a small, non-essential integral membrane subunit of
  the bacterial SecYEG channel. SecG stimulates SecA-driven preprotein
  translocation, most strongly at low temperature or reduced proton motive
  force, but is not required for channel formation and has no motor activity.
  The Bacillus subtilis homologue (YvaL, now SecG) stimulates translocation by
  the B. subtilis translocase in the same way as E. coli SecG.
coherence_reason: All 32 cached reviewed members are in subfamily SF1 and share the accessory-subunit role.
