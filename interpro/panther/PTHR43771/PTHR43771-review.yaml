family_id: PANTHER:PTHR43771
family_name: PHOSPHOMANNOMUTASE
preferred_name: Bacterial and archaeal phosphomannomutase family (ManB/AlgC/XanA)
summary: >-
  Alpha-D-phosphohexomutase superfamily enzymes that interconvert mannose 1-phosphate and mannose
  6-phosphate and, in many members, glucose 1-phosphate and glucose 6-phosphate through a
  phosphoserine enzyme intermediate and a bisphosphorylated sugar intermediate, with Mg2+ bound.
  Mannose 1-phosphate feeds GDP-mannose synthesis for O-antigen, capsule, alginate and other
  mannose-containing glycans; glucose 1-phosphate feeds UDP-glucose synthesis. The family contains
  enterobacterial and Vibrio ManB (RfbK/CpsG-type) O-antigen and colanic acid enzymes, Xanthomonas
  XanA and many archaeal members (SF1), and the Pseudomonas, Neisseria and Azospirillum
  bifunctional phosphomannomutase/phosphoglucomutases (SF2), whose archetype is P. aeruginosa AlgC.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Phosphomannomutase activity is the shared family activity. Phosphoglucomutase activity has
  been shown biochemically for the SF2 archetype P. aeruginosa AlgC, where glucose 1-phosphate is
  turned over with about twofold higher catalytic efficiency than mannose 1-phosphate, but it is
  not established across SF1, whose members are annotated primarily as phosphomannomutases.
  Phosphoglucomutase activity is therefore treated as SF2-restricted here, without asserting that
  SF1 members lack it.
