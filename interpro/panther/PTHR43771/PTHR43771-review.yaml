notes: >-
  Node coverage was read from the PAINT UniProt GAF: PTN002464904 reaches 24 leaves (including E.
  coli ManB P24175, Neisseria meningitidis Pgm P40391 and P. aeruginosa AlgC), while
  PTN001096974 reaches about 136 leaves across several families. Seed O86374 was not resolved to a
  gene name here. The entries file lists only reviewed UniProt members; P. putida CpsG/PP_1777
  (SF1) and AlgC/PP_5288 (SF2) are placed from their UniProt PANTHER cross-references. The CpsG
  gene review finds phosphomannomutase but no direct evidence of physiologically relevant
  phosphoglucomutase activity, consistent with treating GO:0004614 as SF2-restricted.
