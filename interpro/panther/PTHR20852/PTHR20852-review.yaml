family_id: PANTHER:PTHR20852
family_name: GLUTAMINE SYNTHETASE
preferred_name: Eukaryotic-type glutamine synthetase (GS II; GLN1/GLUL) family
summary: >-
  Decameric type II glutamine synthetases ATP-dependently condense glutamate and ammonia to glutamine,
  the main route of ammonia assimilation in fungi (S. cerevisiae GLN1, S. pombe gln1), plants (cytosolic
  and plastid GS) and animals (GLUL).
functional_coherence: COHERENT
coherence_reason: >-
  All subfamilies are type II glutamine synthetases; plant paralogs differ in compartment and tissue.
