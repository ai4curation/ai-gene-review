family_id: PANTHER:PTHR10649
family_name: ARYL HYDROCARBON RECEPTOR
preferred_name: AHR and AHRR bHLH-PAS transcription factor family
summary: >-
  PTHR10649 contains metazoan bHLH-PAS transcription factors related to the aryl
  hydrocarbon receptor. Human AHR is a ligand-activated intracellular receptor
  that binds ARNT after PAS-B ligand binding, whereas human AHRR is a divergent
  feedback repressor that heterodimerizes with ARNT and binds XRE DNA but lacks
  the PAS-B ligand-binding domain. PAINT's root transcriptional regulator terms
  are sound for both subfamilies, but the AHRR branch should not inherit the
  AHR-specific aryl hydrocarbon receptor complex and nuclear receptor activity
  terms.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family is unified by N-terminal bHLH/PAS-A DNA-binding and ARNT-dimerizing
  architecture. The AHR subfamily retains a PAS-B ligand-binding receptor
  domain; AHRR proteins are feedback repressors that bind ARNT and XREs but lack
  AHR's PAS-B domain and are not ligand-regulated receptor subunits.
