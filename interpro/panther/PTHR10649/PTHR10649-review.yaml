    AHR-containing receptor complexes, but human AHRR forms a distinct
    AHRR:ARNT repressor complex. PAINT already prunes at least one fish branch
    inside SF9, so this review does not claim a complete SF9-wide safe scope.
  supported_by:
  - reference_id: PMID:28904176
    supporting_text: >-
      One of the genes induced by AhR encodes AhR repressor (AhRR), which also
      forms a heterodimer with ARNT and represses the activation of
      AhR-dependent transcription.
