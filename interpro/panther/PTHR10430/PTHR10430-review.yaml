family_id: PANTHER:PTHR10430
family_name: PEROXIREDOXIN
preferred_name: PRX5-type (atypical 2-Cys) peroxiredoxin family
summary: >-
  Thioredoxin-dependent peroxiredoxins of the PRX5 (type II) class reduce hydrogen peroxide and alkyl
  hydroperoxides through a peroxidatic cysteine and an intramolecular resolving cysteine. The family
  contains S. cerevisiae AHP1, human PRDX5, bacterial and plant type II Prx, and S. pombe pmp20 (SF39),
  which has lost the resolving cysteine and shows no detectable peroxidase activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Peroxiredoxin activity is conserved in SF16 (AHP1, PRDX5), SF8, SF30, SF33 and SF34. S. pombe pmp20
  (SF39) has no detectable thioredoxin- or glutathione-dependent peroxidase activity and is instead
  a weak holdase.
