term_assessments:
  - assessed_term:
      id: GO:0008564
      label: protein-exporting ATPase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Coupling of ATP hydrolysis to preprotein translocation is shown for E.
      coli SecA and is the conserved function of the family's motor domains.
      B. subtilis SecA performs it with its own SecYEG and needs no SecB.
    supported_by:
      - reference_id: PMID:2542029
        supporting_text: These data show that the SecA protein has a central role in coupling the hydrolysis of ATP to the transfer of pre-secretory proteins across the membrane.
      - reference_id: PMID:10559168
        supporting_text: Translocation of B. subtilis prePhoB, on the other hand, showed a strict dependence on the translocase subunit composition and occurred efficiently only with the homologous translocase.
  - assessed_term:
      id: GO:0070678
      label: preprotein binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Binding of the preprotein is part of how every SecA works: the motor must
      receive the precursor's signal sequence and mature region before it can
      push them through SecYEG, whether the precursor arrives free or on SecB.
      The signal-peptide groove is characterized structurally in E. coli SecA;
      SecA2 paralogs bind a narrower substrate set but still bind their
      preproteins. The term carries no claim that direct binding has been
      assayed for each member.
    supported_by:
      - reference_id: PMID:18022369
        supporting_text: The same groove is used by SecA to recognize a diverse set of signal sequences.
notes: >-
  SecA is the motor for both precursor-delivery routes of the post-translational
  Sec module: it receives SecB-bound precursors in Proteobacteria and
  recognizes precursors directly where SecB is absent (B. subtilis) or not
  used. B. subtilis CsaA binds SecA but affects only a few substrates.
