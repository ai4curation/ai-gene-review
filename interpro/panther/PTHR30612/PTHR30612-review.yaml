family_id: PANTHER:PTHR30612
family_name: SECA INNER MEMBRANE COMPONENT OF SEC PROTEIN SECRETION SYSTEM
functional_coherence: MOSTLY_COHERENT
preferred_name: SecA protein-export ATPase family
summary: >-
  PTHR30612 contains SecA, the peripheral membrane ATPase of the Sec
  translocase. SecA recognizes the signal sequence and mature region of
  secretory precursors, either directly or after receiving them from SecB where
  SecB exists, docks onto the SecYEG channel, and couples cycles of ATP binding
  and hydrolysis to stepwise movement of the polypeptide through the channel.
  SecA is found throughout bacteria and in plastids. Two variant groups sit
  inside the family: the accessory SecA2 paralogs of some Gram-positive
  bacteria and mycobacteria, which export a restricted substrate set, and the
  chloroplast SecA proteins of plants, which work with the thylakoid SecY
  channel.
coherence_reason: >-
  The ATP-driven preprotein-translocation activity is shared by canonical
  bacterial SecA (E. coli, B. subtilis), the mycobacterial SecA1 and SecA2
  paralogs and chloroplast SecA. Substrate range differs between SecA1 and
  SecA2, and plastid members act at the thylakoid rather than the bacterial
  cytoplasmic membrane, so location terms do not transfer across the whole
  family. Nearly all cached reviewed members, bacterial and plastid, fall in
  subfamily SF0 although its PANTHER name is CHLOROPLAST PROTEIN-TRANSPORTING
  ATPASE; that label is not evidence that a member is plastid-localized.
