      - id: UniProtKB:P9WGP5
        label: secA1
        organism: Mycobacterium tuberculosis H37Rv
    assessment: SOUND
    assessment_reason: >-
      ATP hydrolysis is the energy source of every SecA examined, including the
      SecA2 paralogs, and the DEAD-motor nucleotide-binding domains are
      conserved across the family, so a root-level placement is right. The
      more informative activity is protein-exporting ATPase activity
      (GO:0008564), assessed below.
    supported_by:
      - reference_id: PMID:2542029
        supporting_text: These data show that the SecA protein has a central role in coupling the hydrolysis of ATP to the transfer of pre-secretory proteins across the membrane.
