  - node_id: PANTHER:PTN000770133
    asserted_term:
      id: GO:0043952
      label: protein transport by the Sec complex
    evidence: IBD
    node_taxon:
      id: NCBITaxon:2
      label: Bacteria
    paint_snapshot: "20170228"
    seeds:
      - id: UniProtKB:P10408
        label: secA
        organism: Escherichia coli K-12
