  name:
    name: Basic leucine zipper (bZIP) transcription factors
    short: bZIP_transcription_factors
  description:
  - text: The bZIP transcription factor family is characterized by its role in stress
      responses, particularly in the endoplasmic reticulum (ER) stress response. Members
      of the family function as transcriptional regulators, with some acting as stress
      sensors and transducers in the ER stress signaling pathway. They are involved
      in the activation of ER chaperones and the unfolded protein response (UPR),
      which are essential for maintaining cellular homeostasis under stress conditions.
      The family also plays a role in plant immunity and abiotic stress responses.
      Activation of family members can be regulated by proteolysis and mRNA splicing,
      leading to the translocation of the transcriptionally active component to the
      nucleus.
