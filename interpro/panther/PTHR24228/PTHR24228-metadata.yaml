  name:
    name: Melatonin Receptor GPCR
    short: Melatonin_Receptor_GPCR
  description:
  - text: The Melatonin Receptor Family comprises G-protein coupled receptors with
      high affinity for melatonin, mediating various physiological processes such
      as reproductive and circadian rhythms, energy metabolism, neurite outgrowth,
      cell migration, and pigment aggregation in melanophores. Activation of these
      receptors typically inhibits adenylate cyclase activity via pertussis toxin-sensitive
      G proteins. Some family members also play roles in neuronal differentiation,
      glucocorticoid receptor signaling, and TGF-beta signaling pathways, affecting
      proliferation and migration. Additionally, they are involved in the regulation
      of the blood-brain barrier, response to drugs, and germ cell migration.
