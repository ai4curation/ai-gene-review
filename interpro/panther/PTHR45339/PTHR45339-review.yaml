family_id: PANTHER:PTHR45339
family_name: HYBRID SIGNAL TRANSDUCTION HISTIDINE KINASE J
preferred_name: Hybrid (receiver-containing) histidine kinases and associated phosphorelay proteins
summary: >-
  A large, functionally mixed PANTHER family (InterPro reports about 61,000
  members in about 13,000 proteomes) of multidomain two-component phosphorelay
  proteins. Most members are hybrid sensor histidine kinases that combine a
  HisKA/HATPase transmitter with one or more receiver domains, often with a C-terminal
  HPt domain: bacterial BarA (E. coli), its pseudomonad orthologs GacS, RcsC,
  TorS, Xanthomonas RpfC, Salmonella SsrA and Pseudomonas AruS, the fungal
  group-III HAMP-repeat kinases (Candida NIK1, Aspergillus TcsA) and many
  Dictyostelium Dhk kinases. The family also contains proteins that are not
  kinases but share the receiver and phosphorelay machinery: the RcsD
  phosphotransferase, the fungal response regulators SKN7, SSK1 and Mcs4, and
  the kinase-dead GacS antagonist RetS. The shared function is participation
  in multistep His-Asp phosphorelays; what is sensed, which steps a protein
  catalyses, and the downstream output differ between members.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Phosphorelay signalling is shared, but molecular function is not. One
  subfamily label (SF1) covers active hybrid kinases (BarA, GacS, RcsC),
  a kinase-dead antagonist (RetS, which lacks the HATPase G-boxes), an HPt
  phosphotransferase (RcsD) and stand-alone response regulators (SKN7, SSK1),
  so kinase activity cannot be inferred from membership. The PANTHER 19 tree
  is small (76 leaves, dominated by plants, cyanobacteria and fungi) and holds
  none of the characterized E. coli or Pseudomonas members; they are assigned
  by HMM, and most PAINT nodes recorded for the family are absent from the
  current tree. GacS (the module's sensor) and RetS (its antagonist) are both
  SF1 members with opposite activities on the same relay, which is why the
  Gac phosphorelay module does not rely on this family to type the RetS
  activity.
reference_protein:
  id: UniProtKB:Q88MC3
  label: histidine kinase
  gene_symbol: gacS
  organism: Pseudomonas putida KT2440
  gene_review: genes/PSEPK/gacS/gacS-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR45339:SF1
  label: HYBRID SIGNAL TRANSDUCTION HISTIDINE KINASE J
  description: >-
    Holds nearly all characterized members: bacterial hybrid kinases (BarA,
    GacS, RcsC, TorS, RpfC, SsrA, AruS), RcsD, RetS, the fungal group-III
    kinases, Dictyostelium DhkE/F/J/M and the fungal response regulators SKN7
    and SSK1. Its two Pseudomonas putida members, GacS and RetS, act on the
    same Gac relay with opposite signs: GacS is an active autokinase, while
    RetS has lost the HATPase G1 and G2 boxes and opposes GacS by transmitter
    phosphatase activity.
  representative_members:
  - id: UniProtKB:Q88MC3
    label: histidine kinase
    gene_symbol: gacS
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/gacS/gacS-ai-review.yaml
  - id: UniProtKB:Q88DK1
    label: histidine kinase
    gene_symbol: retS
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/retS/retS-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Within SF1, RetS has lost autokinase activity (degenerate HATPase without
    G-boxes) and acts as a phosphatase and inhibitor of GacS; SKN7 and SSK1
    lack the transmitter entirely and act as response regulators. SF1
    membership therefore does not imply kinase activity.
  supported_by:
  - reference_id: PMID:29880803
    supporting_text: >-
      RetS has a degenerate HATPase domain lacking the conserved G-boxes and
      consequently is unable to autophosphorylate.
  - reference_id: file:interpro/panther/PTHR45339/PTHR45339-entries.csv
    supporting_text: P38889,Transcription factor SKN7
