notes: >-
  Reviewed as the family of the GacS and RetS members of
  MODULE:pseudomonad_gac_lifestyle_phosphorelay. The family is too broad and
  too mixed to type the module's sensor roles; the module grounds them by
  family plus representative member, and records RetS's kinase-dead
  divergence here and in its gene review. The review is scoped honestly to
  what can be checked: PAINT coverage was read against the PANTHER 19 tree
  (pantherdb.org treeinfo service, fetched 2026-11-11; re-checkable extract in
  genes/PSEPK/retS/retS-bioinformatics/panther_tree_check.yaml), in which only one of
  the eight PAINT nodes (PTN000703787) is present; the other seven are
  recorded as UNRESOLVED. SF6 (SENSORY HISTIDINE PROTEIN KINASE) has no
  reviewed UniProt member in the local inventory and is not described. SF3 and
  SF5 are not described either: their only reviewed members (Dictyostelium
  DhkK Q86CZ2 and DokA Q869S5) are placed in PTHR43719 by PANTHER's own
  classification files and in PTHR45339 only by the UniProt cross-reference,
  as is E. coli BarA (P0AEC5); none of them is used as a representative here
  for that reason.
  Characterized members other than GacS and RetS (BarA, RcsC, RcsD, TorS,
  SKN7, SSK1) have no gene review in this repository and are not assessed
  individually.
