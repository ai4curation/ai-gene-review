residue_sites:
- site_id: hatpase_g1_box
  label: HATPase G1 box, third glycine (DxGxG)
  description: >-
    The G1 box (DxGxG) of the HATPase ATP-binding domain lines the ATP site
    of active histidine kinases. In KT2440 GacS it reads DTGIG at 444-448;
    the discriminating residue is the final glycine (Gly448). The kinase-dead
    RetS proteins align a proline to this glycine (Pro559 in KT2440 RetS,
    Pro576 in PAO1 RetS), so the box reads DxGxP and is not a G1 box.
    Positions in RetS were mapped by BLOSUM62 global alignment to GacS
    (genes/PSEPK/retS/retS-bioinformatics/gbox_alignment.py).
  anchor:
    id: UniProtKB:Q88MC3
    label: histidine kinase
    gene_symbol: gacS
    organism: Pseudomonas putida KT2440
  anchor_sequence_version: 1
  site_source: ALIGNMENT_INFERENCE
  residues:
  - position: 448
    expected: [G]
    role: ATP-binding G1 box glycine
  required_for:
  - term:
      id: GO:0000155
      label: phosphorelay sensor kinase activity
    strength: REQUIRED
    rationale: >-
      Autophosphorylation needs ATP bound in the HATPase domain. The
      P. aeruginosa RetS, whose G-boxes are degenerate, cannot
      autophosphorylate, while GacS proteins with intact G-boxes are active
      kinases.
    supported_by:
    - reference_id: PMID:29880803
      supporting_text: >-
        RetS has a degenerate HATPase domain lacking the conserved G-boxes and
        consequently is unable to autophosphorylate.
  positive_controls:
  - id: UniProtKB:Q88MC3
    label: histidine kinase
    gene_symbol: gacS
    organism: Pseudomonas putida KT2440
    control_position: 448
    control_residue: G
  - id: UniProtKB:G3XD98
    label: histidine kinase
    gene_symbol: gacS
    organism: Pseudomonas aeruginosa PAO1
    control_position: 446
    control_residue: G
  negative_controls:
  - id: UniProtKB:Q88DK1
    label: histidine kinase
    gene_symbol: retS
    organism: Pseudomonas putida KT2440
    control_position: 559
    control_residue: P
  - id: UniProtKB:Q9HUV7
    label: histidine kinase
    gene_symbol: retS
    organism: Pseudomonas aeruginosa PAO1
    control_position: 576
    control_residue: P
- site_id: hatpase_g2_box
  label: HATPase G2 box, central glycine (GxGxG)
  description: >-
    The G2 box (GxGxG) forms the ATP lid of the HATPase domain; in KT2440
    GacS it reads GTGLG at 474-478, and the discriminating residue is the
    central glycine (Gly476). The RetS proteins align a histidine here (His587
    in KT2440 RetS, His604 in PAO1 RetS). Mapped by the same alignment as the
    G1 site.
  anchor:
    id: UniProtKB:Q88MC3
    label: histidine kinase
    gene_symbol: gacS
    organism: Pseudomonas putida KT2440
  anchor_sequence_version: 1
  site_source: ALIGNMENT_INFERENCE
  residues:
  - position: 476
    expected: [G]
    role: ATP-lid G2 box glycine
  required_for:
  - term:
      id: GO:0000155
      label: phosphorelay sensor kinase activity
    strength: REQUIRED
    rationale: >-
      The G2 box glycines give the ATP lid the flexibility to close over bound
      ATP; RetS proteins, which lack them, are kinase-dead.
    supported_by:
    - reference_id: PMID:29880803
      supporting_text: >-
        RetS has a degenerate HATPase domain lacking the conserved G-boxes and
        consequently is unable to autophosphorylate.
  positive_controls:
  - id: UniProtKB:Q88MC3
    label: histidine kinase
    gene_symbol: gacS
    organism: Pseudomonas putida KT2440
    control_position: 476
    control_residue: G
  - id: UniProtKB:G3XD98
    label: histidine kinase
    gene_symbol: gacS
    organism: Pseudomonas aeruginosa PAO1
    control_position: 474
    control_residue: G
  negative_controls:
