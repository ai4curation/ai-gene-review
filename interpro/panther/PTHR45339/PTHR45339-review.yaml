term_assessments:
- assessed_term:
    id: GO:0000160
    label: phosphorelay signal transduction system
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterized member, whether active kinase, phosphotransferase,
    kinase-dead antagonist or response regulator, takes part in a His-Asp
    phosphorelay through its receiver and/or transmitter domains.
  supported_by:
  - reference_id: PMID:11022030
    supporting_text: >-
      BarA is a membrane-associated protein that belongs to a subclass of
      tripartite sensors of the two-component signal transduction system
      family.
  - reference_id: PMID:29880803
    supporting_text: >-
      RetS takes phosphoryl groups from GacS-P
- assessed_term:
    id: GO:0000155
    label: phosphorelay sensor kinase activity
  scope: RESIDUE_DETERMINED
  determined_by_site: hatpase_g1_box
  scope_reason: >-
    Applicability is decided by the HATPase ATP-binding boxes, not by
    subfamily. SF1 holds active hybrid kinases (GacS, BarA, RcsC) next to
    members that are not kinases: the kinase-dead RetS, whose G1 and G2 boxes
    are substituted (Pro at the G1 glycine, His at the central G2 glycine), the
    RcsD phosphotransferase, which PANTHER itself seeds for histidine
    phosphotransfer activity (GO:0009927), and the fungal response regulators
    SKN7, SSK1 and Mcs4, which have a receiver but no transmitter. Granting the
    term to SF1 would license it for those proteins, while denying it would
    strip it from canonical kinases. Members with intact G1 (hatpase_g1_box)
    and G2 (hatpase_g2_box) glycines are kinases; members without them are not.
  supported_by:
  - reference_id: PMID:11022030
    supporting_text: >-
      We show that the purified BarA protein is able to autophosphorylate when
      incubated with [gamma-(32)P]ATP but not with [alpha-(32)P]ATP or
      [gamma-(32)P]GTP.
  - reference_id: PMID:29880803
    supporting_text: >-
      RetS has a degenerate HATPase domain lacking the conserved G-boxes and
      consequently is unable to autophosphorylate.
  - reference_id: file:interpro/panther/PTHR45339/PTHR45339-paint.tsv
    supporting_text: "PTHR45339\tPTN001976860\tGO:0009927\tF\tIBD\tfalse"
  - reference_id: file:interpro/panther/PTHR45339/PTHR45339-entries.csv
    supporting_text: P87323,Response regulator mcs4
