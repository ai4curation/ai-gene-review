    label: acid-amino acid ligase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    GO has no term for 4-phosphopantoate--beta-alanine ligase activity (EC 6.3.2.36, RHEA:27930).
    GO:0004592, the PanC reaction, uses unphosphorylated pantoate, which PPS cannot. GO:0016881 is
    therefore the closest existing term. The T. kodakarensis gene review proposes the missing term.
  supported_by:
  - reference_id: PMID:19666462
    supporting_text: The protein product catalyzed the ATP-dependent conversion of phosphopantoate and beta-alanine to produce 4'-phosphopantothenate and did not exhibit PS activity
- assessed_term:
    id: GO:0004592
    label: pantoate-beta-alanine ligase activity
  scope: NOT_APPLICABLE
  scope_reason: PPS does not condense free pantoate with beta-alanine.
  supported_by:
  - reference_id: PMID:19666462
    supporting_text: did not exhibit PS activity
- assessed_term:
    id: GO:0015937
    label: coenzyme A biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: PPS forms 4'-phosphopantothenate, the intermediate that enters the shared CoA pathway.
  supported_by:
  - reference_id: PMID:22940806
    supporting_text: two novel enzymes specific to the archaea, pantoate kinase and phosphopantothenate synthetase, are responsible for this conversion
