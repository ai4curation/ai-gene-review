family_id: PANTHER:PTHR40695
family_name: 4-PHOSPHOPANTOATE--BETA-ALANINE LIGASE
preferred_name: Archaeal phosphopantothenate synthetase (PPS)
summary: >-
  PTHR40695 is the archaeal phosphopantothenate synthetase (PPS) family. PPS condenses
  (R)-4-phosphopantoate with beta-alanine and ATP to form (R)-4'-phosphopantothenate, the second step of
  the archaeal pantoate kinase/PPS route to CoA. It is unrelated in sequence to bacterial and eukaryotic
  pantothenate synthetase (PanC, PTHR21299) and cannot use unphosphorylated pantoate. The characterized
  member is Thermococcus kodakarensis TK1686. It is strictly specific for ATP and beta-alanine, is not
  inhibited by CoA or its product, and crystallizes as an asymmetric homodimer.
functional_coherence: COHERENT
coherence_reason: >-
  The parsed entries file holds five reviewed entries, all in PTHR40695:SF1 and all named
  4-phosphopantoate--beta-alanine ligase. They come from Thermococcus kodakarensis, Thermococcus
  onnurineus, Methanocaldococcus jannaschii, Methanosarcina mazei and Methanospirillum hungatei.
  No divergent member is known.
