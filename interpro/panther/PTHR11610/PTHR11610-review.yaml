family_id: PANTHER:PTHR11610
family_name: LIPASE
preferred_name: >-
  Pancreatic-lipase-fold neutral lipases: the secreted digestive lipases (PNLIP,
  PNLIPRP1/2), the vascular/plasma lipases (LPL, LIPC, LIPG) and the phosphatidic-acid /
  phosphatidylserine phospholipases A1 (LIPH, LIPI, PLA1A)
summary: >-
  PTHR11610 collects the animal lipases built on the pancreatic-lipase fold: an
  N-terminal alpha/beta-hydrolase catalytic domain carrying a Ser-Asp-His triad under a
  mobile surface "lid", plus a C-terminal PLAT/beta-sandwich domain that mediates
  interfacial and cofactor interactions. All members are secreted and all are ester
  hydrolases acting at a lipid-water interface, which is what the deep PAINT node
  PTN008325466 records (lipase activity, lipid catabolic process, extracellular region)
  and what is genuinely shared.

  Above that shared floor the family splits into groups whose substrates, cofactors and
  anatomical compartments are different. The exocrine pancreatic branch (PNLIP,
  PNLIPRP1, PNLIPRP2) is secreted into the gut lumen, hydrolyses emulsified dietary
  triacylglycerol, and depends on colipase to work in the presence of bile salts. The
  vascular branch (lipoprotein lipase, hepatic lipase, endothelial lipase) is
  heparan-sulfate-anchored at the endothelial surface, acts on triacylglycerol and
  phospholipid carried in circulating lipoprotein particles, uses apolipoprotein
  cofactors such as apoC-II, and is the branch that remodels VLDL, chylomicrons and HDL.
  A third branch (LIPH, LIPI, PLA1A) has specialised as phospholipases A1 that generate
  lysophospholipid signalling molecules. Chimera experiments locate much of the
  triacylglycerol-versus-phospholipid preference in the lid rather than in the triad, so
  substrate specificity in this family is a surface property of an otherwise conserved
  catalytic machine.

  A consequence that matters for annotation: catalytic-residue loss is not the
  discriminator anywhere in this family. Every member checked here retains an intact
  Ser-Asp-His triad, including human PNLIPRP1, which is named "inactive" and has no
  demonstrated lipase activity. Differences between the branches therefore have to be
  argued from substrate, cofactor and compartment, not from a degraded active site.

functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family lumps three functionally distinct groups that share only the fold and the
  generic "hydrolyses a lipid ester at an interface" activity: the secreted digestive
  pancreatic lipases (SF147, SF165, SF108), the plasma/vascular lipoprotein-acting
  lipases (SF3, SF2, SF13) and the lysophospholipid-generating phospholipases A1 (SF12,
  SF103, SF111). Only generic terms - lipase activity, lipid catabolic process,
  extracellular region - are safe at family level. Substrate-and-context-specific terms
  (lipoprotein lipase activity, HDL particle remodeling, glycerophospholipid
  phospholipase A1 activity) belong to one group and must not descend across the others.

reference_protein:
  id: UniProtKB:P16233
  label: Pancreatic triacylglycerol lipase
  gene_symbol: PNLIP
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR11610:SF147
    label: PANCREATIC TRIACYLGLYCEROL LIPASE
    description: >-
      The classical colipase-dependent exocrine digestive lipase (EC 3.1.1.3), secreted
      by pancreatic acinar cells into the intestinal lumen, where it hydrolyses
      emulsified dietary triacylglycerol at positions sn-1 and sn-3 to give
      2-monoacylglycerol and free fatty acids. It also hydrolyses retinyl esters. This is
      the subfamily that the four disputed PTN000906454 assertions reach by inheritance
      and to which none of them applies.
    representative_members:
      - {id: UniProtKB:P16233, label: PNLIP, organism: Homo sapiens}
      - {id: UniProtKB:P27657, label: Pnlip, organism: Rattus norvegicus,
         gene_review: genes/rat/Pnlip/Pnlip-ai-review.yaml}
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11610:SF165
    label: PANCREATIC LIPASE-RELATED PROTEIN 2
    description: >-
      Pancreatic lipase-related protein 2. Secreted with PNLIP but with a markedly
      broader substrate range: it is an active galactolipase and phospholipase A1 as well
      as a triacylglycerol lipase, and it is largely colipase-independent. This is the
      digestive-branch member that legitimately carries phospholipid-directed activity,
      recorded in PAINT at PTN000176925 (galactolipase activity, phospholipid catabolic
      process) rather than at the vascular node.
    representative_members:
      - {id: UniProtKB:P54317, label: PNLIPRP2, organism: Homo sapiens}
      - {id: UniProtKB:D7EZN2, label: PNLIPRP2, organism: Sus scrofa}
    diverged_from_family: true
    divergence_description: >-
      Broadened substrate specificity relative to PNLIP - galactolipids and
      glycerophospholipids in addition to triacylglycerol - and loss of the strict
      colipase requirement. Its phospholipase-directed terms are its own, seeded at
      PTN000176925, and are not evidence for the same activity in its PNLIP sister.

  - subfamily_id: PANTHER:PTHR11610:SF108
    label: INACTIVE PANCREATIC LIPASE-RELATED PROTEIN 1
    description: >-
      Pancreatic lipase-related protein 1, co-secreted with PNLIP but without
      demonstrated lipolytic activity against any tested substrate. Recorded here because
      of what it is NOT: its Ser-Asp-His triad is fully intact (S171/D194/H281, verified
      against P54315 sequence version 1), so its inactivity cannot be attributed to
      catalytic-residue loss and no residue rule in this family can predict it.
    representative_members:
      - {id: UniProtKB:P54315, label: PNLIPRP1, organism: Homo sapiens}
    diverged_from_family: true
    divergence_description: >-
      No demonstrated lipase activity despite an intact catalytic triad and a normal
      fold; the loss is not residue-encoded. Enzymatic terms should not be inherited
      here, but the reason is absence of demonstrated activity, not a degraded site.

  - subfamily_id: PANTHER:PTHR11610:SF3
    label: LIPOPROTEIN LIPASE
    description: >-
      Lipoprotein lipase (EC 3.1.1.34), the rate-limiting enzyme of plasma triglyceride
      clearance. It is anchored to heparan sulfate proteoglycans and GPIHBP1 at the
      capillary endothelial surface, requires apoC-II as an activator, and hydrolyses
      triacylglycerol carried in chylomicrons and VLDL. It also has a low, experimentally
      documented phospholipase A1 activity.
    representative_members:
      - {id: UniProtKB:P06858, label: LPL, organism: Homo sapiens,
         gene_review: genes/human/LPL/LPL-ai-review.yaml}
      - {id: UniProtKB:P11151, label: LPL, organism: Bos taurus}
    diverged_from_family: true
    divergence_description: >-
      Acts on lipid packaged in circulating lipoprotein particles rather than on a bulk
      dietary emulsion, and depends on endothelial anchoring plus an apolipoprotein
      cofactor. Its particle-directed terms (lipoprotein lipase activity, chylomicron and
      VLDL remodeling, apolipoprotein binding) describe that compartment and must not be
      projected onto the secreted digestive branch.

  - subfamily_id: PANTHER:PTHR11610:SF2
    label: HEPATIC TRIACYLGLYCEROL LIPASE
    description: >-
      Hepatic lipase, bound to hepatic sinusoidal endothelium, acting on intermediate
      density lipoproteins and HDL. Relative to LPL it has a high phospholipase A1
      activity, and it is one of the two enzymes that genuinely remodel HDL particles.
    representative_members:
      - {id: UniProtKB:P11150, label: LIPC, organism: Homo sapiens}
    diverged_from_family: true
    divergence_description: >-
      Plasma-lipoprotein-directed, with phospholipase A1 activity high enough to be a
      defining property rather than a side reaction. HDL remodeling and phospholipase A1
      activity are properties of this vascular branch.

  - subfamily_id: PANTHER:PTHR11610:SF13
    label: ENDOTHELIAL LIPASE
    description: >-
      Endothelial lipase, the most phospholipase-biased of the three vascular lipases and
      the principal determinant of HDL phospholipid turnover and HDL cholesterol
      concentration.
    representative_members:
      - {id: UniProtKB:Q9Y5X9, label: LIPG, organism: Homo sapiens}
    diverged_from_family: true
    divergence_description: >-
      Predominantly a phospholipase acting on HDL rather than a triacylglycerol lipase.
      Together with hepatic lipase it is the source of the HDL-remodeling assertion that
      PTN000906454 propagates family-wide.

  - subfamily_id: PANTHER:PTHR11610:SF111
    label: PHOSPHOLIPASE A1 MEMBER A
    description: >-
      Phosphatidylserine-specific phospholipase A1, a secreted enzyme that generates
      lysophosphatidylserine as a signalling lipid. Mouse Pla1a (MGI:1934677) is the sole
      seed of the second, Euteleostomi-scoped GO:0008970 assertion at PTN002614137.
    representative_members:
      - {id: UniProtKB:Q53H76, label: PLA1A, organism: Homo sapiens}
    diverged_from_family: true
    divergence_description: >-
      A dedicated phospholipase A1 producing a lysophospholipid mediator, with no
      digestive or lipoprotein-clearance role. Its phospholipase terms belong to this
      lineage, not to the family.

node_assessments:
  - node_id: PANTHER:PTN000906454
    asserted_term:
      id: GO:0004465
      label: lipoprotein lipase activity
    paint_snapshot: "20190213"
    seeds:
      - {id: MGI:MGI:96820, label: Lpl, organism: Mus musculus}
      - {id: RGD:3017, label: Lpl, organism: Rattus norvegicus}
      - {id: UniProtKB:P06858, label: LPL, organism: Homo sapiens}
      - {id: UniProtKB:P11151, label: LPL, organism: Bos taurus}
    assessment: TOO_DEEP
    assessment_reason: >-
      Every one of the four seeds is a lipoprotein lipase ortholog (mouse, rat, human and
      bovine LPL), i.e. the entire evidential basis sits inside SF3. GO:0004465 is
      substrate-and-context-specific: it names hydrolysis of triacylglycerol carried in
      circulating lipoprotein particles, an activity that requires endothelial anchoring
      and apoC-II activation. Placing it at PTN000906454, a node with no recorded taxon
      scope that also carries the vascular-branch process terms, sweeps in the secreted
      pancreatic digestive branch, which never encounters a lipoprotein particle: PNLIP
      works on an emulsified dietary triacylglycerol droplet in the gut lumen with
      colipase as its cofactor. Neither pancreatic member seeds this assertion - rat
      Pnlip (RGD:3360) and human PNLIP (P16233) enter PAINT only at the deeper
      PTN008325466, where they seed the generic GO:0016298 lipase activity assertion,
      which is the correct granularity for them. The vascular sister subfamilies SF2 and
      SF13 were not adjudicated here; the assessment concerns the digestive branch.
    affected_subfamilies:
      - {id: PANTHER:PTHR11610:SF147, label: PANCREATIC TRIACYLGLYCEROL LIPASE}
      - {id: PANTHER:PTHR11610:SF165, label: PANCREATIC LIPASE-RELATED PROTEIN 2}
      - {id: PANTHER:PTHR11610:SF108, label: INACTIVE PANCREATIC LIPASE-RELATED PROTEIN 1}

  - node_id: PANTHER:PTN000906454
    asserted_term:
      id: GO:0008970
      label: glycerophospholipid phospholipase A1 activity
    paint_snapshot: "20231012"
    seeds:
      - {id: RGD:3009, label: Lipc, organism: Rattus norvegicus}
      - {id: UniProtKB:P06858, label: LPL, organism: Homo sapiens}
      - {id: UniProtKB:P11150, label: LIPC, organism: Homo sapiens}
      - {id: UniProtKB:Q9Y5X9, label: LIPG, organism: Homo sapiens}
    assessment: TOO_DEEP
    assessment_reason: >-
      All four seeds are vascular/plasma lipases - rat and human hepatic lipase, human
      endothelial lipase and human LPL - and phospholipase A1 activity is a genuine,
      graded property of that branch: hepatic lipase and endothelial lipase are strongly
      phospholipase-biased and LPL has a low but experimentally documented activity. The
      digestive branch does not inherit it. Where phospholipid-directed activity does
      occur in the pancreatic branch it is PNLIPRP2's, and PAINT records that separately
      at PTN000176925 (galactolipase activity, phospholipid catabolic process) seeded by
      PNLIPRP2 itself - so SF165 is left out of the affected set here. Colipase-dependent
      PNLIP is a triacylglycerol and retinyl-ester hydrolase with no phospholipase A1
      role, and its catalytic triad is intact (see catalytic_triad), so this is a
      substrate-specificity boundary between paralogs, not a loss of catalysis.
    affected_subfamilies:
      - {id: PANTHER:PTHR11610:SF147, label: PANCREATIC TRIACYLGLYCEROL LIPASE}
      - {id: PANTHER:PTHR11610:SF108, label: INACTIVE PANCREATIC LIPASE-RELATED PROTEIN 1}

  - node_id: PANTHER:PTN000906454
    asserted_term:
      id: GO:0034375
      label: high-density lipoprotein particle remodeling
    paint_snapshot: "20231012"
    seeds:
      - {id: RGD:3009, label: Lipc, organism: Rattus norvegicus}
      - {id: UniProtKB:P11150, label: LIPC, organism: Homo sapiens}
      - {id: UniProtKB:Q9Y5X9, label: LIPG, organism: Homo sapiens}
    assessment: TOO_DEEP
    assessment_reason: >-
      The three seeds are exactly the two enzymes that remodel HDL - hepatic lipase (rat
      and human) and endothelial lipase. HDL remodeling is a plasma-compartment process:
      it requires the enzyme to be anchored on vascular endothelium and to act on a
      circulating apolipoprotein-coated particle. The secreted digestive lipases act in
      the intestinal lumen and never encounter an HDL particle, so the process is not
      merely unproven for them but anatomically unavailable. LPL itself (SF3) is also
      included in the affected set: it is not a seed of this assertion, and its own gene
      review marks the inherited term as an over-annotation on the grounds that its low
      phospholipase activity does not establish an in vivo HDL-remodeling role.
    affected_subfamilies:
      - {id: PANTHER:PTHR11610:SF147, label: PANCREATIC TRIACYLGLYCEROL LIPASE}
      - {id: PANTHER:PTHR11610:SF165, label: PANCREATIC LIPASE-RELATED PROTEIN 2}
      - {id: PANTHER:PTHR11610:SF108, label: INACTIVE PANCREATIC LIPASE-RELATED PROTEIN 1}
      - {id: PANTHER:PTHR11610:SF3, label: LIPOPROTEIN LIPASE}

  - node_id: PANTHER:PTN000906454
    asserted_term:
      id: GO:0006633
      label: fatty acid biosynthetic process
    paint_snapshot: "20231012"
    seeds:
      - {id: UniProtKB:P06858, label: LPL, organism: Homo sapiens}
      - {id: UniProtKB:P11150, label: LIPC, organism: Homo sapiens}
      - {id: UniProtKB:P11151, label: LPL, organism: Bos taurus}
    assessment: WRONG_NODE
    assessment_reason: >-
      This is the one disputed assertion where the problem is not the depth of the node
      but the term itself. Every member of PTHR11610 is a hydrolase: it liberates
      pre-existing acyl chains from an ester, it does not build them. GO:0006633 denotes
      the pathway that forms a fatty acid de novo. Reading "release of free fatty acid by
      hydrolysis" as "fatty acid biosynthesis" conflates delivering a substrate with
      running the biosynthetic pathway, and the two gene reviews in this repository that
      inherit the term reach that conclusion independently: human LPL, which is a seed,
      marks its own IDA/IC/ISS rows as over-annotated, and rat Pnlip removes the IBA. The
      seeds therefore do not support the assertion at this node or at any node in the
      family, which is why the verdict is WRONG_NODE rather than TOO_DEEP. Note that this
      pushes back on the placement, not on the underlying experiments: the cited work
      demonstrates fatty acid release, which is correctly captured by lipid catabolic
      process and triglyceride catabolic process.
    affected_subfamilies:
      - {id: PANTHER:PTHR11610:SF147, label: PANCREATIC TRIACYLGLYCEROL LIPASE}
      - {id: PANTHER:PTHR11610:SF165, label: PANCREATIC LIPASE-RELATED PROTEIN 2}
      - {id: PANTHER:PTHR11610:SF108, label: INACTIVE PANCREATIC LIPASE-RELATED PROTEIN 1}
      - {id: PANTHER:PTHR11610:SF3, label: LIPOPROTEIN LIPASE}
      - {id: PANTHER:PTHR11610:SF2, label: HEPATIC TRIACYLGLYCEROL LIPASE}

  - node_id: PANTHER:PTN000906454
    asserted_term:
      id: GO:0019433
      label: triglyceride catabolic process
    paint_snapshot: "20240918"
    seeds:
      - {id: MGI:MGI:96820, label: Lpl, organism: Mus musculus}
      - {id: UniProtKB:P06858, label: LPL, organism: Homo sapiens}
      - {id: UniProtKB:P11150, label: LIPC, organism: Homo sapiens}
      - {id: UniProtKB:P11151, label: LPL, organism: Bos taurus}
      - {id: UniProtKB:P54317, label: PNLIPRP2, organism: Homo sapiens}
      - {id: UniProtKB:D7EZN2, label: PNLIPRP2, organism: Sus scrofa}
    assessment: SOUND
    assessment_reason: >-
      Recorded deliberately alongside the four disputes, because it is the control that
      shows the node is not simply "the vascular node". Triglyceride catabolism is the
      shared ancestral activity of the whole clade, and unlike the other five assertions
      this one is seeded from both sides of the split: LPL and hepatic lipase on the
      vascular side, PNLIPRP2 (human and pig) on the secreted digestive side. Every
      descendant plausibly inherits it, and rat Pnlip's own review accepts it. The
      contrast is the diagnostic: what fails at PTN000906454 is not inheritance in
      general but the propagation of terms whose evidential base lies entirely within one
      branch.

  - node_id: PANTHER:PTN002614137
    asserted_term:
      id: GO:0008970
      label: glycerophospholipid phospholipase A1 activity
    node_taxon: {id: NCBITaxon:117571, label: Euteleostomi}
    paint_snapshot: "20231012"
    seeds:
      - {id: MGI:MGI:1934677, label: Pla1a, organism: Mus musculus}
    assessment: SOUND
    assessment_reason: >-
      A second, much more narrowly scoped phospholipase A1 assertion. Its single seed,
      MGI:1934677, is mouse Pla1a - phospholipase A1 member A, the secreted
      phosphatidylserine-specific phospholipase A1 (human ortholog Q53H76, SF111) - not a
      pancreatic-lipase-related protein; the rat Pnlip gene review attributes this node
      to the PNLIPRP2 branch, and that attribution is corrected here. A single seed is
      not a weakness: PAINT curators place an IBD from the tree and the alignment, and a
      node seeded by one well-characterised member can be entirely sound. Placing
      phospholipase A1 activity on the PLA1A lineage is exactly right, and being
      Euteleostomi-scoped and lineage-specific it is not the route by which the term
      reached rat Pnlip.

  - node_id: PANTHER:PTN008325466
    asserted_term:
      id: GO:0016298
      label: lipase activity
    paint_snapshot: "20260528"
    seeds:
      - {id: RGD:3360, label: Pnlip, organism: Rattus norvegicus}
      - {id: UniProtKB:P16233, label: PNLIP, organism: Homo sapiens}
      - {id: UniProtKB:P54317, label: PNLIPRP2, organism: Homo sapiens}
      - {id: UniProtKB:P06858, label: LPL, organism: Homo sapiens}
      - {id: UniProtKB:P11150, label: LIPC, organism: Homo sapiens}
      - {id: UniProtKB:Q9Y5X9, label: LIPG, organism: Homo sapiens}
      - {id: UniProtKB:Q8WWY8, label: LIPH, organism: Homo sapiens}
      - {id: MGI:MGI:1934677, label: Pla1a, organism: Mus musculus}
    assessment: SOUND
    assessment_reason: >-
      This is the level at which the pancreatic branch actually enters PAINT, and it is
      the correct one. The seed list spans all three groups - digestive, vascular and
      phospholipase - and both rat Pnlip (RGD:3360) and human PNLIP (P16233) are among
      them, alongside the extracellular region and lipid catabolic process assertions at
      the same node. Generic interfacial ester hydrolysis in a secreted compartment is
      what the family shares; anything more specific is branch property. The seed list
      shown is a readable subset of PAINT's own with-list for this node and term.

residue_sites:
  - site_id: catalytic_triad
    label: Ser-Asp-His catalytic triad
    description: >-
      The alpha/beta-hydrolase charge-relay triad of the pancreatic-lipase fold: a
      nucleophilic serine in the G-X-S-X-G elbow activated by a histidine that is in turn
      oriented by an aspartate. Recorded here not to discriminate between the family's
      branches but to close off the residue explanation for them. Every member checked
      retains a complete triad, including human PNLIPRP1 (S171/D194/H281 in P54315), a
      protein named "inactive" and with no demonstrated lipolytic activity - so an
      intact triad in this family does not entail activity, and the absence of activity
      in a member is not evidence of a lost residue. Substrate preference within the
      family tracks the mobile lid over the site rather than the triad.
    anchor:
      id: UniProtKB:P16233
      label: PNLIP
      organism: Homo sapiens
    anchor_sequence_version: 1
    site_source: UNIPROT_FEATURE
    residues:
      - {position: 169, expected: [S], role: nucleophile}
      - {position: 193, expected: [D], role: charge relay acid}
      - {position: 280, expected: [H], role: charge relay base}
    required_for:
      - term:
          id: GO:0016298
          label: lipase activity
        strength: CONTRIBUTES
        rationale: >-
          Catalysis proceeds through nucleophilic attack of the serine hydroxyl on the
          ester carbonyl to form an acyl-enzyme intermediate, with the histidine acting
          as general base and the aspartate orienting and polarising it; substituting any
          of the three abolishes hydrolysis without affecting lipid or heparin binding
          (demonstrated directly for LPL). Mechanistically the dependency is absolute,
          but it is recorded at CONTRIBUTES rather than REQUIRED deliberately: no member
          of PTHR11610 has been verified here to have lost a triad residue, so the family
          supplies no negative control, and a site with no verified negative control must
          not be given the strength that licenses contradicting a gene review. Human
          PNLIPRP1 shows why - it has the intact site and still no demonstrated activity,
          so this site cannot be used to predict which members are active.
        supported_by:
          - reference_id: PMID:1371284
            supporting_text: >-
              Ser-132, Asp-156, and His-241 specifically abolishes total hydrolytic
              activity
    positive_controls:
      - id: UniProtKB:P27657
        label: Pnlip
        organism: Rattus norvegicus
        gene_review: genes/rat/Pnlip/Pnlip-ai-review.yaml
        control_position: 169
        control_residue: S
      - id: UniProtKB:P06858
        label: LPL
        organism: Homo sapiens
        gene_review: genes/human/LPL/LPL-ai-review.yaml
        control_position: 159
        control_residue: S

term_assessments:
  - assessed_term:
      id: GO:0016298
      label: lipase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Interfacial hydrolysis of a lipid ester in a secreted compartment is the property
      the whole family inherits, and PAINT records it at the appropriate depth
      (PTN008325466) from seeds spanning all three branches. It is the right granularity
      for members whose specific substrate profile is not separately established. One
      documented exception exists - human PNLIPRP1 (SF108) has no demonstrated lipase
      activity - but that is a member-specific absence of evidence recorded in its
      subfamily entry rather than a subfamily-scoped functional divergence, and it is not
      predictable from sequence, so it is not grounds for narrowing this scope.

  - assessed_term:
      id: GO:0004465
      label: lipoprotein lipase activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The term names hydrolysis of triacylglycerol packaged in a circulating lipoprotein
      particle - a substrate-in-context activity requiring endothelial anchoring and
      apoC-II activation. Every seed of the PTN000906454 IBD is an LPL ortholog, and the
      activity is the defining function of that subfamily. Members outside SF3 that
      hydrolyse triacylglycerol should carry GO:0004806 triacylglycerol lipase activity
      instead: that is the correct term for colipase-dependent PNLIP acting on a dietary
      emulsion, and it is what the rat Pnlip review proposes as the replacement.
    applicable_subfamilies:
      - {id: PANTHER:PTHR11610:SF3, label: LIPOPROTEIN LIPASE}

  - assessed_term:
      id: GO:0008970
      label: glycerophospholipid phospholipase A1 activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Phospholipase A1 activity is real in three places in this family and absent in a
      fourth. It is a defining property of the vascular lipases (strongly so for
      endothelial and hepatic lipase, weakly but experimentally for LPL), of the
      dedicated PLA1A lineage, and of PNLIPRP2 among the digestive lipases. It is not a
      property of colipase-dependent PNLIP, which acts on triacylglycerol and retinyl
      esters. Chimera experiments place the triacylglycerol-versus-phospholipid
      preference in the lid covering the catalytic site, so this is a surface-loop
      specificity boundary between paralogs with identical triads, not a catalytic loss.
      SF12 (LIPASE MEMBER H) and SF103 (LIPASE MEMBER I) are phosphatidic-acid
      phospholipases too, but their activity is adjudicated at a different node
      (PTN002614042, GO:0004620 glycerophospholipase activity) and was not assessed here;
      their omission from this list is "not assessed", not "denied".
    applicable_subfamilies:
      - {id: PANTHER:PTHR11610:SF3, label: LIPOPROTEIN LIPASE}
      - {id: PANTHER:PTHR11610:SF2, label: HEPATIC TRIACYLGLYCEROL LIPASE}
      - {id: PANTHER:PTHR11610:SF13, label: ENDOTHELIAL LIPASE}
      - {id: PANTHER:PTHR11610:SF165, label: PANCREATIC LIPASE-RELATED PROTEIN 2}
      - {id: PANTHER:PTHR11610:SF111, label: PHOSPHOLIPASE A1 MEMBER A}
    supported_by:
      - reference_id: PMID:7592706
        supporting_text: displays higher phospholipase activity than LPL.

  - assessed_term:
      id: GO:0034375
      label: high-density lipoprotein particle remodeling
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      HDL remodeling requires the enzyme to be positioned on vascular endothelium and to
      act on a circulating apolipoprotein-coated particle. Hepatic lipase and endothelial
      lipase do exactly this and are the seeds of the assertion; endothelial lipase in
      particular is the principal determinant of HDL phospholipid turnover. No member
      outside the vascular branch is in a compartment where HDL exists, so for the
      secreted digestive lipases the term is not weakly supported but inapplicable. LPL
      is excluded as well: it is not a seed, and its own gene review judges that its low
      phospholipase activity does not establish an in vivo HDL-remodeling role.
    applicable_subfamilies:
      - {id: PANTHER:PTHR11610:SF2, label: HEPATIC TRIACYLGLYCEROL LIPASE}
      - {id: PANTHER:PTHR11610:SF13, label: ENDOTHELIAL LIPASE}

  - assessed_term:
      id: GO:0006633
      label: fatty acid biosynthetic process
    scope: NOT_APPLICABLE
    scope_reason: >-
      No member of PTHR11610 synthesises a fatty acid. The family hydrolyses esters and
      thereby releases acyl chains that already exist; the products may subsequently be
      re-esterified or used biosynthetically by other enzymes, but that is downstream of
      the lipase, not catalysed by it. The correct terms for what these enzymes do are
      lipid catabolic process and triglyceride catabolic process, both of which the
      family already carries. Both gene reviews in this repository that inherit
      GO:0006633 reject it independently - human LPL, a seed of the IBD, as an
      over-annotation of its own experimental rows, and rat Pnlip by removal.

