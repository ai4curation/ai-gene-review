review_status: NEEDS_REVIEW
reviewed_by: AI-assisted family review (PAINT slice + UniProt sequence verification)
review_date: "2026-08-31"
notes: >-
  Scope. This review adjudicates the six PAINT node/term pairs that bear on the rat Pnlip
  dispute, plus the deep node the pancreatic branch actually seeds. It is not an
  exhaustive treatment of PTHR11610: the remaining Euteleostomi-scoped nodes
  (PTN002614042 glycerophospholipase activity, PTN002614064 and PTN002614072
  apolipoprotein binding, PTN002614072 VLDL particle remodeling) and the PNLIPRP2 node
  PTN000176925 (galactolipase activity, phospholipid catabolic process) were read for
  context but not assessed.

  Verification performed. All PANTHER family and subfamily accessions and labels were
  read from panther.obo and cross-checked against each protein's own UniProt "DR PANTHER"
  line rather than inferred from the protein's name; family_name is verbatim. All node,
  term, seed, taxon and date values were copied from
  interpro/panther/PTHR11610/PTHR11610-paint.tsv. The catalytic-triad positions were
  resolved against the actual sequences via the UniProt REST API, not assumed from
  homology: P16233 S169/D193/H280, P27657 S169/D193/H280, P06858 S159/D183/H268, P54315
  S171/D194/H281, each matching that record's own ACT_SITE features, each on sequence
  version 1.

  Counter-lesson recorded. The obvious residue story for this family - "the inactive
  pancreatic lipase-related protein lost its catalytic residue" - is false. P54315 has a
  complete triad. Nothing in this review rests on residue loss, and the rat Pnlip gene
  review correctly used residue_claims_not_applicable: the four disputed terms fail for
  reasons of substrate, cofactor and anatomical compartment, applied to a fully intact
  hydrolase.

  Correction to the gene-side record. The rat Pnlip review attributes the second
  GO:0008970 IBD at PTN002614137 to the PNLIPRP2 branch. Its single seed MGI:1934677 is
  mouse Pla1a (phospholipase A1 member A, SF111), not a pancreatic-lipase-related
  protein. The conclusion for rat Pnlip is unaffected - the node is a lineage-specific
  phospholipase assertion either way - but the branch identity is different.

  Not established. Whether the vascular sister subfamilies SF2 and SF13 should inherit
  GO:0004465 was not determined; the assessment of that node names only the digestive
  branch. Membership of the cited accessions could not be confirmed against
  interpro/panther/panther-members.tsv, which does not yet index them and for which this
  checkout has no refresh recipe; subfamily assignments were instead taken from each
  protein's UniProt PANTHER cross-reference, which is the same source the index is built
  from.
