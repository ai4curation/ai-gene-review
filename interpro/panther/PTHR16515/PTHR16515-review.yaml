family_id: PANTHER:PTHR16515
family_name: PR DOMAIN ZINC FINGER PROTEIN
preferred_name: Diverse C2H2 zinc-finger regulatory proteins
summary: This broad group contains multiple zinc-finger transcription regulators, including Krueppel-like
  proteins, PLAG proteins and PRDM proteins. Some branches carry additional chromatin-regulatory domains,
  whereas others primarily recognize DNA through zinc-finger arrays. Drosophila Dati has a demonstrated
  role in specific neuronal circuits, but this behavior is not a family-wide property.
functional_coherence: HETEROGENEOUS
coherence_reason: Shared C2H2 zinc fingers span PRDM, KLF-like and other transcriptional regulators with
  different auxiliary domains and DNA targets. Fly dati genetics localizes female receptivity and locomotion
  phenotypes to distinguishable neuronal circuits, including a cholinergic requirement for receptivity
  (PMID:25291190). This supports a neuronal transcription-regulatory context for DATI, not a family-wide
  behavioral function. PR-domain-dependent histone methylation cannot be assigned to all zinc-finger members
  or to DATI merely from the broad family name.
