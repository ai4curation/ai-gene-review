- node_id: PANTHER:PTN001262736
  asserted_term:
    id: GO:0032265
    label: XMP salvage
  evidence: IBD
  paint_snapshot: '20170602'
  seeds:
  - id: SGD:S000003894
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The fungal PTN001262736 XMP-salvage IBD is seeded only by S. cerevisiae XPT1
    (SGD:S000003894), whose leaf PTN000769766 is the sister paralog of the
    S. cerevisiae HPT1 leaf PTN000769765 inside the three-leaf PTN008681096
    duplication clade. XMP salvage belongs to the XPT1 lineage after that
    duplication: purified S. cerevisiae HPT1 uses hypoxanthine and guanine but
    not xanthine, while XPT1 disruption impairs xanthine use and strongly reduces
    XPRT activity without affecting HPRT. S. pombe hpt1 is a single-copy SF1
    enzyme that still salvages xanthine, so the required loss is the S. cerevisiae
    HPT1 leaf rather than all of SF1.
  proposed_action:
    paint_action: ADD_IRD
    target_node_id: PANTHER:PTN000769765
  supported_by:
  - reference_id: file:interpro/panther/PTHR43363/PTHR43363-paint.tsv
    supporting_text: "PTHR43363\tPTN001262736\tGO:0032265\tP\tIBD\tfalse"
  - reference_id: file:genes/yeast/HPT1/HPT1-ai-review.yaml
    supporting_text: >-
      IBA (PTN001262736) for XMP salvage; the only experimental donor is the paralog Xpt1 (SGD:S000003894).
  - &id001
    reference_id: PMID:6170313
    supporting_text: The enzyme recognized hypoxanthine and guanine, but not adenine
      or xanthine, as substrates.
  - reference_id: PMID:10217799
    supporting_text: Disruption of XPT1 affects xanthine utilization in vivo and
      results in a severe reduction of xanthine phosphoribosyl transferase (XPRT)
      activity while HPRT is unaffected.
  - reference_id: file:genes/SCHPO/hpt1/hpt1-ai-review.yaml
    supporting_text: >-
      An 8-azathioxanthine-resistant mutant lacked hypoxanthine phosphoribosyltransferase,
      xanthine phosphoribosyltransferase and guanine phosphoribosyltransferase activities
      (EC 2.4.2.8) and appeared to carry a single mutation.
