family_id: PANTHER:PTHR43363
family_name: HYPOXANTHINE PHOSPHORIBOSYLTRANSFERASE
preferred_name: Fungal hypoxanthine-guanine / xanthine phosphoribosyltransferase family
summary: >-
  Fungal purine phosphoribosyltransferases: HGPRT (S. cerevisiae HPT1, S. pombe hpt1) in SF1 and
  the xanthine phosphoribosyltransferase XPT1 in SF4.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  SF1 contains hypoxanthine-guanine phosphoribosyltransferases; S. pombe hpt1
  also salvages xanthine, but S. cerevisiae HPT1 lost xanthine use after
  duplication with the xanthine-specialized XPT1/SF4 paralog.
