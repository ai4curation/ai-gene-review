  name:
    name: Purine/Pyrimidine Phosphoribosyltransferase
    short: PRTase
  description:
  - text: This family of proteins includes enzymes involved in the salvage pathways
      of purine and pyrimidine nucleotides. Members of this family catalyze the transfer
      of the 5-phosphoribosyl group from 5-phosphoribosylpyrophosphate onto various
      purine and pyrimidine bases, facilitating the conversion of these bases into
      their respective monophosphate nucleotides. The enzymes play essential roles
      in recycling purines and pyrimidines, which is crucial for the maintenance of
      the nucleotide pool within the cell. Some family members are subject to feedback
      regulation by nucleotide products, while others are allosterically regulated
      by nucleotides, reflecting the tight control of nucleotide synthesis and salvage.
