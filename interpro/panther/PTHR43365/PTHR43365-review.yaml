family_id: PANTHER:PTHR43365
family_name: BLR7806 PROTEIN
preferred_name: Thiolase family containing mycobacterial FadA, FadA5 and FadA6
summary: This family includes the Mycobacterium tuberculosis FadBA thiolase beta subunit and distinct
  steroid-associated thiolases. FadA catalyses CoA-dependent cleavage of medium- and long-chain 3-ketoacyl-CoAs
  in a heterotetramer with FadB. Substrate preference and partner dependence cannot be assigned uniformly
  from the shared family or subfamily label.
functional_coherence: UNKNOWN
coherence_reason: The examined members share a thiolase classification, but experimental evidence for
  O53871 does not define substrate range or pathway scope across the family. Current tree and PAINT snapshots
  do not resolve its placement; no claim of uniform or universally divergent catalysis is warranted.
