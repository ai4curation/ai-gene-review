- subfamily_id: PANTHER:PTHR46036:SF12
  clade_node_id: PANTHER:PTN005273413
  label: VOC DOMAIN-CONTAINING PROTEIN
  description: >-
    Eurosid paralog clade of 8 leaves (Eucalyptus, Theobroma, Cucumis, Juglans, Prunus) that arose at the rosid
    duplication PTN005273412 and is sister to the eurosid GLX1 clade PTN005273416. No member has been assayed.
  diverged_from_family: true
  divergence_description: >-
    Seven of the eight leaves lack His at the column of E. coli GloA His5 in the first VOC domain (Asn in four,
    Arg in three), and the two Cucumis leaves also have Lys at the Glu122 column. Asn or Gln at the first ligand
    position is not by itself evidence of inactivity, because the Zn2+-class enzymes of PTHR10374 use Gln there,
    so the clade is recorded as diverged and untested rather than as inactive. Glyoxalase I activity is not
    granted to it.
  supported_by:
