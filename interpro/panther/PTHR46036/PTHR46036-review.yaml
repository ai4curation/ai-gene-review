- node_id: PANTHER:PTN005273416
  asserted_term:
    id: GO:0005777
    label: peroxisome
  evidence: IBD
  negated: false
  assessment: UNRESOLVED
  assessment_reason: >-
    The node is the eurosid GLX1 clade (27 leaves, 15 organisms; subfamilies SF2 and SF8), sister to the SF12
    clade after the rosid duplication PTN005273412. Its only seed is Arabidopsis GLX1 (At1g11840, O65398),
    annotated by TAIR from a fluorescent-fusion targeting study that confirmed its peroxisomal localization.
    Two things keep the row from being called sound. The leaves show no conserved peroxisomal targeting
    signal that would carry the location to the orthologs: the C-terminal tripeptides are mostly ELE, ELQ and
    ELK, and the median N-terminal extension is 17 residues. And a later study of the Arabidopsis glyoxalase
