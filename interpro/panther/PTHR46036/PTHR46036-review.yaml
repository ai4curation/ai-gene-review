family_id: PANTHER:PTHR46036
family_name: LACTOYLGLUTATHIONE LYASE
preferred_name: Ni2+-activated glyoxalase I (lactoylglutathione lyase) family
summary: >-
  Vicinal oxygen chelate (VOC) fold glyoxalase I enzymes of the non-zinc (Ni2+/Co2+-activated) class, mostly
  bacterial short homodimers of about 135 residues with the metal sites between the subunits, plus plant
  two-domain GLX1-type enzymes. They isomerise the methylglyoxal-glutathione hemithioacetal to
  (R)-S-lactoylglutathione, the first step of glutathione-dependent methylglyoxal detoxification. E. coli GloA,
  inactive with Zn2+ and maximally active with Ni2+, is the characterised type member. The Zn2+-activated
  glyoxalase I enzymes of animals, fungi and some bacteria form the separate family PTHR10374. The family also
  contains subfamilies of uncharacterised VOC-domain proteins whose activity has not been tested.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All 15 Swiss-Prot members sit in SF5 (bacterial and plant-chloroplast GloA) or SF2 (plant GLX1) and are named
  lactoylglutathione lyases, with E. coli GloA characterised directly. Other subfamilies, notably SF12
  (VOC DOMAIN-CONTAINING PROTEIN) and SF16 (LYASE, PUTATIVE-RELATED), have no characterised member, and a VOC
  fold alone does not establish glyoxalase I specificity (the fold also carries bleomycin-resistance proteins and
  extradiol dioxygenases), so the activity is not granted to them.
