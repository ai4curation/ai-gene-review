- node_id: PANTHER:PTN000043163
  asserted_term:
    id: GO:0004462
    label: lactoylglutathione lyase activity
  evidence: IBD
  negated: false
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node is the family root (LUCA, 177 leaves). The placement is right: the activity is measured on both root
    branches, in E. coli GloA on the bacterial branch PTN000043150 and in Arabidopsis At1g11840 and At1g67280
    and rice GLYI-11 on both sides of the tracheophyte duplication PTN005273371 of the other branch, and 153
    of 177 leaves keep the reference ligand set His5, Glu56, His74, Glu122 at the aligned first-domain columns.
    Outside PAINT's seeds, the Y. pestis, P. aeruginosa GloA1/GloA2 and N. meningitidis leaves of the bacterial
    branch are characterised Ni2+/Co2+-activated enzymes. One seed does not support the term. C6KSP5 is the
    Plasmodium falciparum glyoxalase I-like protein GILP; GeneDB annotates it to GO:0004462 by IDA from
    PMID:15843146, but that paper's abstract says the fourth, GloI-like protein has undefined substrate
    specificity, and in the alignment GILP has Gly55, Lys98 and Gly116 at the His5, Glu56 and His74 columns
    and Thr, Gln, Asn, Tyr at the equivalent second-domain positions. I read the abstract only, so the GeneDB
    row is a query for GeneDB, not a confirmed error. GILP is the only SAR leaf and sits alone on its
    branch, so the request is an IKR at its leaf PTN001310399; C6KSP5 should also be dropped as a seed.
  proposed_action:
