- subfamily_id: PANTHER:PTHR46036:SF2
  clade_node_id: PANTHER:PTN001623792
  label: LACTOYLGLUTATHIONE LYASE GLX1
  description: >-
    Angiosperm two-domain GLX1-type enzymes without a long N-terminal extension (median 19 residues before the
    first VOC domain): Arabidopsis GLX1 (At1g11840, AtGLYI3), rice GLYI-11 (the allergen Glb33) and maize GLX1
    (C0PK05). The subfamily node PTN001623792 (Magnoliophyta, 64 leaves) also contains the nested subfamilies
    SF7, SF8 and SF12. The rice and Arabidopsis enzymes are Ni2+-dependent, and the rice and maize enzymes are
    monomers with one functional Ni2+ site although they have two VOC domains. In the alignment the first
    domain carries His, Glu, His, Glu at the reference ligand columns (47 of 51 SF2 leaves) and the second
    domain carries Gln, Glu, Gln, Val at the equivalent positions.
