family_id: PANTHER:PTHR46036
family_name: LACTOYLGLUTATHIONE LYASE
preferred_name: Ni2+-activated glyoxalase I (lactoylglutathione lyase) family
summary: >-
  Vicinal oxygen chelate (VOC) fold glyoxalase I enzymes of the non-zinc (Ni2+/Co2+-activated) class. They
  isomerise the methylglyoxal-glutathione hemithioacetal to (R)-S-lactoylglutathione, the first step of
  glutathione-dependent methylglyoxal detoxification. The PANTHER 19.0 tree has 177 leaves rooted at LUCA. One
  root branch holds 13 single-domain enzymes of about 135 residues: proteobacterial and cyanobacterial GloA (E.
  coli GloA is the type member; the Yersinia pestis, Pseudomonas aeruginosa GloA1/GloA2 and Neisseria
  meningitidis enzymes are also Ni2+/Co2+-activated) and two Dictyostelium proteins that PANTHER places there by
  horizontal transfer. The other branch holds one Halobacterium protein, the Plasmodium falciparum glyoxalase
  I-like protein GILP and 162 streptophyte proteins. The plant proteins are monomeric two-domain enzymes that
  split at a tracheophyte duplication into a cytosolic-type GLX1 clade (Arabidopsis At1g11840, rice GLYI-11,
  maize GLX1) and a clade with long N-terminal extensions (Arabidopsis chloroplast At1g67280). In the alignment
  only the first VOC domain of the plant enzymes keeps the four metal ligands, in line with the single
  functional Ni2+ site found in the rice and maize enzymes. The Zn2+-activated glyoxalase I enzymes of animals,
  fungi and some bacteria form the separate family PTHR10374.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Glyoxalase I activity is demonstrated on both root branches (E. coli GloA; Arabidopsis At1g11840 and At1g67280
  and rice GLYI-11), and 153 of the 177 tree leaves carry the reference metal-ligand set His5, Glu56, His74 and
  Glu122 (E. coli GloA numbering) at the aligned first-domain columns. The exceptions are identified branches.
  Plasmodium GILP has Gly, Lys and Gly at three of the four positions and no ligand set in its second domain,
  and the paper that characterised the parasite glyoxalases describes it as having undefined substrate
  specificity. Two small plant paralog clades, SF7 (Panicoideae) and SF8 (Papilionoideae), replace the
  Glu122-equivalent with Ala or Gly in every member. The eurosid paralog clade SF12 (VOC DOMAIN-CONTAINING
  PROTEIN) replaces the His5-equivalent with Asn or Arg in seven of eight members and has not been assayed.
  The remaining deviating leaves are scattered single sequences, several of them short gene models. The earlier
  statement that SF16 is an uncharacterised VOC subfamily is withdrawn: SF16, SF9, SF10, SF15 and SF19 are small
  PANTHER partitions nested inside the plant chloroplast-type clade, and all but one of their leaves keep the
  first-domain ligand set.
