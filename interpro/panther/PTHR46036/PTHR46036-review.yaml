subfamilies:
- subfamily_id: PANTHER:PTHR46036:SF5
  label: LACTOYLGLUTATHIONE LYASE
  description: >-
    The default PANTHER subfamily, whose subfamily node is the family root, so it is not a clade. Its 78 tree
    leaves are the 13 leaves of the bacterial branch (PTN000043150: single-domain GloA of E. coli, Salmonella,
    Yersinia, Haemophilus, Vibrio, Shewanella, Pseudomonas, Neisseria, Synechocystis and Gloeobacter, plus two
    Dictyostelium proteins), Halobacterium glo1, Plasmodium GILP, the bryophyte, lycophyte and charophyte
    proteins, and 55 leaves of the angiosperm clade PTN000043143 that contains the chloroplast enzyme
    At1g67280 and rice Os05g0230900. That clade has a median N-terminal extension of 91 residues before the
    first VOC domain. The subfamily is functionally mixed only through GILP and a few scattered deviating
    leaves; 71 of its 78 leaves keep the first-domain ligand set.
