  positions come from a pairwise alignment of P0AC81 to the leaf sequence after the first domain, not from the
  PANTHER MSA. Not verified: the full text of PMID:15843146 (the GILP assay result), of PMID:29150548 (which
  locus its GLXI;3 isoform is) and of PMID:20009535; the activity of any SF7, SF8, SF12, Halobacterium or
  Dictyostelium member, none of which has experimental annotation. The rosids taxon on the peroxisome node is
  the nearest NCBI taxon for PANTHER's eurosids label. First written for the methylglyoxal detoxification
  module, which uses subfamily SF5 for the Ni2+-class glyoxalase I variant (E. coli GloA).
