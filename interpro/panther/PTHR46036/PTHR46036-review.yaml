    supporting_text: 'SF12: NEHE|HEHV=1, NEHE|QEHV=1, NEHE|QEQ-=1, NQHE|QEQV=1, HEHE|QEED=1, REYK|QKMI=1, REHK|QQMI=1, RGHE|QEQV=1'
- subfamily_id: PANTHER:PTHR46036:SF7
  clade_node_id: PANTHER:PTN005273383
