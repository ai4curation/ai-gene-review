  name:
    name: Peptidase S1 family serine proteases
    short: Peptidase_S1
  description:
  - text: The peptidase S1 family is characterized by serine protease enzymes that
      exhibit diverse biological functions, including roles in digestion, immune response,
      blood coagulation, cell growth, and reproductive processes. Members of this
      family are involved in the activation of various proenzymes and hormones, regulation
      of blood pressure, facilitation of sperm-egg interaction, and modulation of
      cell morphology. Some are implicated in host defense mechanisms, such as the
      initiation of clotting pathways in response to pathogens, and the activation
      of complement pathways. Certain members also contribute to cellular processes
      like senescence, fertilization, and hearing. The family includes enzymes that
      cleave specific peptide bonds, typically with a preference for Arg or Lys at
      the P1 position, and are regulated by various inhibitors.
