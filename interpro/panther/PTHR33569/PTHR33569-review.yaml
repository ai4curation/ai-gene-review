node_assessments:
- node_id: PANTHER:PTN002129956
  asserted_term:
    id: GO:0009039
    label: urease activity
  evidence: IBD
  paint_snapshot: '20251220'
  seeds:
  - id: PomBase:SPAC1952.11c
  - id: UniProtKB:P9WFE9
  assessment: TOO_DEEP
  assessment_reason: >-
    PTN002129956 is the family root, so the enables-type urease activity IBA passes
    to every member. Most members, however, are separate gamma or beta structural
    subunits that do not carry the dinickel site. The catalytic centre is in the
    alpha subunit (PTHR43440), as the K. aerogenes structure shows. The seeds
    include S. pombe ure1, a genuinely catalytic single-chain enzyme, and
    M. tuberculosis UreB (P9WFE9), a beta subunit. Enabling activity belongs only
    to the fungal single-chain clade; for gamma and beta subunits the right
    relation is contributes_to. Reviewed gamma and beta subunits accordingly mark
    the IBA-type enables annotation as over-annotated.
  supported_by:
  - reference_id: file:interpro/panther/PTHR33569/PTHR33569-paint.tsv
    supporting_text: "PTHR33569\tPTN002129956\tGO:0009039\tF\tIBD\tfalse"
  - reference_id: PMID:8718850
    supporting_text: >-
      is an (alpha beta gamma)3 trimer with each alpha-subunit having an (alpha
      beta)8-barrel domain containing a binickel active center
- node_id: PANTHER:PTN002129956
  asserted_term:
    id: GO:0043419
    label: urea catabolic process
  evidence: IBD
  paint_snapshot: '20241010'
  seeds:
  - id: PomBase:SPAC1952.11c
  - id: UniProtKB:P14916
  assessment: SOUND
  assessment_reason: >-
    Every member is a structural or catalytic part of the enzyme that hydrolyses
    urea, so taking part in urea catabolism is safe family-wide. The process term
    does not depend on whether the chain carries the catalytic site. Reviewed
    gamma and beta subunits from K. aerogenes and P. putida accept it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR33569/PTHR33569-paint.tsv
    supporting_text: "PTHR33569\tPTN002129956\tGO:0043419\tP\tIBD\tfalse"
term_assessments:
- assessed_term:
    id: GO:0009039
    label: urease activity
  scope: UNRESOLVED
  scope_reason: >-
    The family's link to this term depends on the qualifier, which the scope values
    cannot express. Contributes_to urease activity is safe family-wide, because every
    member is part of a urease. Enables is safe only for the fungal single-chain
    ureases (for example S. pombe ure1), which also carry the alpha region. Gamma,
    beta and fused gamma-beta chains should not receive an enables-type annotation.
    PANTHER has no subfamily boundary between these groups.
  supported_by:
  - reference_id: file:interpro/panther/PTHR33569/PTHR33569-paint.tsv
    supporting_text: "PTHR33569\tPTN002129956\tGO:0009039\tF\tIBD\tfalse"
  - reference_id: PMID:8718850
    supporting_text: >-
      is an (alpha beta gamma)3 trimer with each alpha-subunit having an (alpha
      beta)8-barrel domain containing a binickel active center
- assessed_term:
    id: GO:0043419
    label: urea catabolic process
  scope: FAMILY_WIDE
  scope_reason: All members are structural or catalytic urease chains.
  supported_by:
  - reference_id: file:interpro/panther/PTHR33569/PTHR33569-paint.tsv
    supporting_text: "PTHR33569\tPTN002129956\tGO:0043419\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0035550
    label: urease complex
  scope: FAMILY_WIDE
  scope_reason: >-
    Gamma, beta and fused gamma-beta chains are subunits of the urease complex, and
    single-chain ureases are homo-oligomeric ureases. PAINT does not assert this
    term; it is a family-level judgment for this review.
  supported_by:
  - reference_id: PMID:8718850
    supporting_text: >-
      is an (alpha beta gamma)3 trimer
