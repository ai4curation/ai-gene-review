family_id: PANTHER:PTHR33569
family_name: UREASE
preferred_name: Urease family (UreA/UreB/UreC and fungal single-chain urease)
summary: >-
  Nickel-dependent ureases hydrolyse urea to ammonia and carbamate. Bacterial urease is a (UreA-UreB-UreC)3
  complex; fungi and plants (S. pombe ure1, plant urease) have single-chain enzymes fused from these
  subunits. S. cerevisiae lacks urease and uses urea amidolyase.
functional_coherence: COHERENT
coherence_reason: All members are urease subunits or single-chain ureases.
