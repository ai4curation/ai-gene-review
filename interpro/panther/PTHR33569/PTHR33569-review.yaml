family_id: PANTHER:PTHR33569
family_name: UREASE
preferred_name: Urease gamma/beta structural chain family (UreA/UreB and fungal single-chain urease)
summary: >-
  Nickel-dependent ureases hydrolyse urea to ammonia and carbamate. This PANTHER family
  is defined over the urease gamma and beta structural regions. Most of its 552 cached
  members are separate subunits of multi-chain bacterial ureases: UreA gamma subunits
  (for example Klebsiella aerogenes and Pseudomonas putida UreA) and UreB beta
  subunits. It also holds the fused gamma-beta chains of two-chain Helicobacter-type
  ureases (H. pylori UreA) and fungal single-chain ureases (S. pombe ure1), which add
  the catalytic alpha region to the same polypeptide. The catalytic alpha subunits,
  and the plant single-chain ureases, are classified separately in PTHR43440.
  S. cerevisiae lacks urease and uses urea amidolyase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member takes part in urease-dependent urea hydrolysis, but members differ in
  how they relate to the catalytic activity. Gamma, beta and fused gamma-beta chains
  are non-catalytic structural parts of the urease complex that contribute to urease
  activity. Only the fungal single-chain ureases, which also carry the alpha region,
  enable it on their own, and that catalytic region lies outside what defines this
  family.
