family_name: URICASE
preferred_name: Urate oxidase (uricase) family
summary: >-
  Cofactor-independent urate oxidases oxidize urate to 5-hydroxyisourate, the first step of purine
  degradation beyond urate (S. pombe uro1/SPCC1223.09, mouse and zebrafish Uox, bacterial Uox). Hominoids
  have an inactivated pseudogene.
