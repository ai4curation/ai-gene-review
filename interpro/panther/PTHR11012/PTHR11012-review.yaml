family_id: PANTHER:PTHR11012
family_name: PROTEIN KINASE-LIKE DOMAIN-CONTAINING
summary: This family groups insect CHK/ecdysteroid-kinase-like proteins. The kinase-like architecture
  raises a specific hypothesis of small-molecule phosphorylation, including ecdysteroid phosphorylation,
  rather than automatically implying phosphorylation of proteins. Individual members remain unevenly characterized.
functional_coherence: UNKNOWN
coherence_reason: The insect EcKL phylogeny identifies at least 13 subfamilies and places the two experimentally
  characterized ecdysteroid kinases in different subfamilies (PMID:38291829). Most members lack a known
  substrate; expression and comparative-genomic associations with xenobiotic metabolism are hypotheses
  rather than phosphorylation assays (PMID:32540344). CG31099 and CG6830 share SF6, but this does not
  establish conservation of an ecdysteroid substrate or its 22-hydroxyl acceptor. Small-molecule kinase
  chemistry is the supported family-level hypothesis, while the distribution of steroid specificity remains
  unresolved.
