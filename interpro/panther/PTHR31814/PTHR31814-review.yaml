family_id: PANTHER:PTHR31814
family_name: FAMILY NOT NAMED
preferred_name: GHMP-type (ERG8-type) phosphomevalonate kinase family
summary: >-
  GHMP-kinase phosphomevalonate kinases that phosphorylate (R)-mevalonate 5-phosphate to
  (R)-mevalonate 5-diphosphate in the classical mevalonate pathway. Members span fungi (S. cerevisiae
  ERG8, S. pombe, C. albicans and A. fumigatus erg8), plants (Arabidopsis PMK), other protists,
  Sulfolobales (S. solfataricus SSO2988), Gram-positive bacteria (Streptococcus pneumoniae mvaK2) and
  Streptomyces (strain CL190 orfC). Animal PMVK is an unrelated nucleoside-monophosphate-kinase-fold
  enzyme in PTHR13101.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterised member is a phosphomevalonate kinase, in all three domains: yeast ERG8, the
  Arabidopsis and S. solfataricus enzymes by recombinant assay, S. pneumoniae by kinetic mechanism, and
  Streptomyces CL190 orfC by pathway reconstitution. All members share subfamily SF2. Subcellular location
  is not coherent: plant PMK is peroxisomal while the fungal enzymes are cytosolic.
