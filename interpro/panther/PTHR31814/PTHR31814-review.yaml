node_assessments:
- node_id: PANTHER:PTN000781523
  asserted_term:
    id: GO:0005777
    label: peroxisome
  evidence: IBD
  paint_snapshot: '20180216'
  seeds:
  - id: AGI_LocusCode:AT1G31910
  assessment: TOO_DEEP
  assessment_reason: >-
    The IBD sits at a Eukaryota node (76 leaves: plants, fungi, Dictyostelium, trypanosomatids, Giardia,
    oomycetes, diatoms) but is seeded only by Arabidopsis PMK. Peroxisomal PMK is supported for plants:
    YFP fusions of the periwinkle and Arabidopsis enzymes are peroxisomal, and the periwinkle result holds
    with cycloheximide blocking new synthesis. It is contradicted for fungi: S. cerevisiae Erg8 is
    cytoplasmic in GFP surveys and S. pombe erg8 is cytosolic in the ORFeome YFP screen, and the S.
    cerevisiae, S. pombe, C. albicans and A. fumigatus reviews all remove the inherited row. The IBD should
    move to the largest plant-only clade, PTN008640230 (51 leaves, Klebsormidium to angiosperms; the next
    node up adds Paramecium, Phytophthora and Thalassiosira). This replaces the earlier NEEDS_PRUNING
    verdict, whose pruning target, subfamily SF2, also contains the plant enzyme the term is right for.
    Other peroxisomal lineages may exist (an unpublished thesis places Dictyostelium PMK in peroxisomes by
    a PTS1), but no peer-reviewed evidence supports a separate IBD for them yet.
  proposed_action:
    paint_action: MOVE_IBD
    target_node_id: PANTHER:PTN008640230
  supported_by:
  - reference_id: file:interpro/panther/PTHR31814/PTHR31814-paint.tsv
    supporting_text: "PTHR31814\tPTN000781523\tGO:0005777\tC\tIBD\tfalse"
  - reference_id: PMID:21655959
    supporting_text: PMK and MVD are localised to the peroxisomes, while MVK was cytosolic
  - reference_id: file:genes/ARATH/PMK/PMK-ai-review.yaml
    supporting_text: The protein has no PTS1, and the PTS2-like motif proposed as
  - reference_id: file:genes/yeast/ERG8/ERG8-ai-review.yaml
    supporting_text: no PTS1 and is cytoplasmic in GFP surveys
  - reference_id: file:genes/SCHPO/erg8/erg8-ai-review.yaml
    supporting_text: PomBase curates cytosolic localization from the ORFeome YFP screen
- node_id: PANTHER:PTN001274235
  asserted_term:
    id: GO:0004631
    label: phosphomevalonate kinase activity
  evidence: IBD
  paint_snapshot: '20250904'
  seeds:
  - id: AGI_LocusCode:AT1G31910
  - id: SGD:S000004833
  assessment: SOUND
  assessment_reason: >-
    Every reviewed recipient accepts this IBA: ERG8 (yeast), erg8 (SCHPO), ERG8 (C. albicans), erg8 (A.
    fumigatus), PMK (Arabidopsis) and SSO2988 (S. solfataricus), whose recombinant enzyme is active in two
    independent studies. Coverage gap, not an error: the three Gram-positive leaves (Streptococcus
    pneumoniae mvaK2, Staphylococcus aureus SAOUHSC_00579, Listeria lmo0012) sit outside the node, directly
    under the family root PTN004886305, and inherit nothing, although the S. pneumoniae enzyme is a
    kinetically characterised phosphomevalonate kinase. The same IBD at the root would cover them. None of
    the three carries an experimental GO annotation that PAINT could have used. The schema has no verdict
    for an IBD that is correct but too shallow, so this is recorded here rather than as a proposed action.
  supported_by:
  - reference_id: file:interpro/panther/PTHR31814/PTHR31814-paint.tsv
    supporting_text: "PTHR31814\tPTN001274235\tGO:0004631\tF\tIBD\tfalse"
  - reference_id: file:genes/SACS2/SSO2988/SSO2988-ai-review.yaml
    supporting_text: its recombinant protein has PMK activity in two independent studies
  - reference_id: PMID:12424232
    supporting_text: >-
      In this study, the kinetic mechanism of the S. pneumoniae enzyme is characterized in the forward and
      reverse directions
