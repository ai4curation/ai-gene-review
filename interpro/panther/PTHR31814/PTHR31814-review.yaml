family_id: PANTHER:PTHR31814
family_name: FAMILY NOT NAMED
preferred_name: GHMP phosphomevalonate kinase (ERG8-type) family
summary: >-
  GHMP-kinase phosphomevalonate kinases phosphorylate mevalonate 5-phosphate to mevalonate 5-diphosphate
  in the mevalonate pathway. The family contains the fungal ERG8/erg8 enzymes
  from S. cerevisiae, S. pombe, C. albicans, and A. fumigatus as well as plant,
  archaeal, and bacterial GHMP phosphomevalonate kinases; animal PMVK is an
  unrelated NMP-kinase-fold enzyme outside this PANTHER family.
functional_coherence: COHERENT
coherence_reason: >-
  PTHR31814 is broad, but coherent at the molecular-function level: PANTHER
  names both official subfamilies, PTHR31814:SF2 and PTHR31814:SF6,
  PHOSPHOMEVALONATE KINASE. All cached reviewed members sit in SF2; SF6 was not
  assessed for process or localization propagation.
