  GHMP-kinase phosphomevalonate kinases phosphorylate mevalonate 5-phosphate to mevalonate 5-diphosphate
  in the fungal mevalonate pathway (S. cerevisiae ERG8, S. pombe erg8). Animal PMVK is an unrelated
  NMP-kinase-fold enzyme.
