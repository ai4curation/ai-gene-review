- assessed_term:
    id: GO:0019287
    label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
  scope: FAMILY_WIDE
  scope_reason: >-
    IPP biosynthesis via the classical mevalonate pathway is retained by the
    reviewed fungal and plant SF2 members, while bacterial Streptomyces PMK also
    catalyzes this lower mevalonate-pathway reaction. The reviewed archaeal SF2
    member Q97UL6 is treated as an exception because archaeal variants of the
    lower mevalonate pathway are outside the classical route.
  member_exceptions:
  - member:
      id: UniProtKB:Q97UL6
      label: Phosphomevalonate kinase
      gene_symbol: SSO2988
      organism: Saccharolobus solfataricus
    exception_reason: >-
      Saccharolobus solfataricus Q97UL6 is the reviewed archaeal SF2 member in
      this inventory; archaeal variants of the lower mevalonate pathway are not
      part of the eukaryotic/bacterial-type pathway scoped by this process
      assessment.
