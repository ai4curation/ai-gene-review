notes: >-
  Revised 2026-11-18 after gene reviews of Arabidopsis PMK, S. solfataricus SSO2988 and Streptomyces
  CL190 PMK. The previous preferred name ("Fungal ...") and SF2 description were too narrow, and the
  peroxisome node was re-assessed from NEEDS_PRUNING to TOO_DEEP. Earlier text in this review and in the
  yeast ERG8 review called Arabidopsis PMK PTS1-bearing; it has no PTS1, and its UniProt PTS2 feature
  does not match the PTS2 consensus (genes/ARATH/PMK/PMK-bioinformatics). Tree placements are from the
  PANTHER 19.0 tree: the family root PTN004886305 (80 leaves) holds PTN001274235 (77 leaves) plus the three
  Gram-positive bacterial PMKs. Streptomyces CL190 is not in the reference tree.
