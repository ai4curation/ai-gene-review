notes: >-
  Written alongside the E. coli and P. putida NuoE gene reviews for the bacterial
  respiratory complex I module, whose NuoE part grounds to this family with
  GO:0009055 electron transfer activity (assessed FAMILY_WIDE here). All node ids,
  GO ids, seeds, taxa and snapshot dates are verbatim from PTHR10371-paint.tsv (eight
  rows; all eight assessed); the contributes_to qualifier on the PTN000042735
  GO:0003954 IBD and the leaf IBAs reaching plant and animal members were read from
  the cached PAINT IBD.gaf and leaf GAF. Subfamily id and name are verbatim from
  panther.obo; members from PTHR10371-entries.csv (34 reviewed proteins, all SF3).
  PANTHER 19.0's own E. coli classification agrees with UniProt here (nuoE in
  PTHR10371:SF3), unlike the partner subunit NuoF (see PTHR43578). The fungal IRD
  node assessments are left UNRESOLVED because the PAINT tree was not inspected to
  confirm whether Neurospora nuo-24 lies under the negation. Inspecting the PANTHER
  tree placement of P40915 relative to PTN000822143 would resolve them.
