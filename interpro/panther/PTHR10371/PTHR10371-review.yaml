term_assessments:
  - assessed_term:
      id: GO:0009055
      label: electron transfer activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The subunit's own molecular function: redox exchange through its [2Fe-2S]
      cluster N1a with the reduced FMN of the 51 kDa subunit. The four cysteine
      ligands and the cluster domain (NCBIfam TIGR01958, PIRSF000216, PROSITE
      PS01099) are conserved across the reviewed members, and rapid NADH-driven
      reduction of N1a is measured in E. coli complex I. The cluster is on a side path
      rather than the main wire, so the term asserts electron exchange, not a position
      on the FMN-to-quinone pathway. Applies equally to the S. pombe homologue, which
      keeps the cluster domain even without a complex I.
    supported_by:
      - reference_id: PMID:18316732
        supporting_text: The major part of N1a undergoes very fast reduction with a
          time constant
      - reference_id: PMID:28509551
        supporting_text: Binuclear Fe-S cluster N1a is not part of this long chain but
          is located within electron transfer distance on the opposite site of FMN.
  - assessed_term:
      id: GO:0051537
      label: 2 iron, 2 sulfur cluster binding
    scope: FAMILY_WIDE
    scope_reason: >-
      One [2Fe-2S] cluster (N1a) per subunit, demonstrated by EPR and ligand
      mutagenesis in E. coli NuoE and assigned to the 24 kDa subunit across species;
      the cluster domain is the defining feature of the family.
    supported_by:
      - reference_id: PMID:15922336
        supporting_text: These clusters were assigned to clusters N3 and N1a,
          respectively.
  - assessed_term:
      id: GO:0045271
      label: respiratory chain complex I
    scope: FAMILY_WIDE
    scope_reason: >-
      Every reviewed member except complex I-deficient fungi is a complex I subunit;
      PAINT asserts the term only at the eukaryotic node, although bacterial NuoE is
      experimentally a subunit of NDH-1. The fungal losses are handled by the IRD at
      PTN000822143.
  - assessed_term:
      id: GO:0010181
      label: FMN binding
    scope: NOT_APPLICABLE
    scope_reason: >-
      The FMN of the N module is bound by the 51 kDa subunit (NuoF/NDUFV1), not by
      this family; the E. coli NuoE review marks its contributes_to FMN binding row as
      over-annotated.
    supported_by:
      - reference_id: PMID:19061856
        supporting_text: Replacement of glutamate 95 for glutamine in the NADH- and
          FMN-binding NuoF subunit of E. coli Complex I
