family_id: PANTHER:PTHR10371
family_name: NADH DEHYDROGENASE  UBIQUINONE  FLAVOPROTEIN 2, MITOCHONDRIAL
preferred_name: >-
  Complex I / NDH-1 24 kDa [2Fe-2S] subunit family (bacterial NuoE / Nqo2,
  mitochondrial NDUFV2)
summary: >-
  The small thioredoxin-fold [2Fe-2S] subunit of the NADH-oxidising (N) module of
  proton-pumping NADH:quinone oxidoreductases: bacterial NuoE (Nqo2 in Thermus and
  Paracoccus) and mitochondrial NDUFV2. It binds one binuclear cluster, N1a, through
  four conserved cysteines and packs against the 51 kDa flavoprotein (NuoF/NDUFV1,
  PANTHER PTHR43578 or PTHR11780 depending on the classification source). N1a lies
  within electron-transfer distance of the FMN but on the side opposite the main
  iron-sulfur wire; it is reduced rapidly by NADH via the flavin in E. coli complex I
  and has been proposed to act as an antioxidant electron sink. Loss of the N1a
  ligands in E. coli also depletes cluster N1b on NuoG and destabilises the complex,
  so the subunit is structurally as well as redox-functionally important. Every
  reviewed member in the fetched slice, from Aquifex, Thermus, proteobacteria,
  Mycobacterium and Rickettsia to plants, fungi, amoebae and animals, is a complex I
  subunit in a single subfamily.
functional_coherence: COHERENT
coherence_reason: >-
  All 34 reviewed proteins in the fetched entries file are complex I / NDH-1 24 kDa
  subunits in one subfamily (PTHR10371:SF3), and none is a hydrogenase or
  formate-dehydrogenase subunit. The one structured exception in the PAINT data is a
  loss, not a divergence: an IRD at a fungal node (taxon 4751) negates complex I
  membership, consistent with fungi such as Saccharomyces cerevisiae that lack
  complex I; S. pombe retains a 24 kDa-subunit homologue (O13691) without a complex I.
  Members with longer N-terminal extensions (mitochondrial presequences;
  Rhizobium NuoE1, Mycobacterium NuoE) keep the conserved cluster domain. The
  fetched slice is a reviewed subset of about 14,900 members, so coherence is
  asserted for the characterised core.
