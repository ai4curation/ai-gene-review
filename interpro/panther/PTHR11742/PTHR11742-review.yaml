family_id: PANTHER:PTHR11742
family_name: MANNOSYL-OLIGOSACCHARIDE ALPHA-1,2-MANNOSIDASE-RELATED
summary: Class I alpha-mannosidases trim alpha-1,2-linked mannose residues from N-linked glycans. Related
  enzymes act at different stages of secretory-pathway glycan maturation and quality control. Their location
  and preferred glycan branch determine whether a particular trimming event supports productive maturation
  or disposal of a substrate.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Class I/GH47 alpha-mannosidases differ in secretory-pathway location and glycan-trimming
  specificity. Recombinant fly mas-1 was active on oligomannosidic glycans in a study that explicitly
  distinguished GH47 class I enzymes from GH38 class II enzymes (PMID:23979800). This establishes a characterized
  fly class I branch without transferring the properties of ManIIb or acidic class II enzymes to alpha-Man-Ia.
  The target's reviewed IA-related classification is consistent with secretory-pathway glycan processing,
  while ER versus Golgi residence, individual linkage preferences and completion of a whole trimming pathway
  are not universal family properties.
