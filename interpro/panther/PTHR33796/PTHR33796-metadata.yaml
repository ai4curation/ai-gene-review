  name:
    name: Holliday junction branch migration complex protein
    short: HJ_branch_migration_complex
  description:
  - text: This family of proteins is involved in the processing of Holliday junction
      (HJ) DNA structures, which are intermediates in genetic recombination and DNA
      repair processes. Members of this family play a crucial role in the rescue of
      blocked DNA replication forks through replication fork reversal (RFR). They
      specifically bind to HJ cruciform DNA to confer an open structure, facilitating
      the branch migration of HJs. The complex formed by these proteins, along with
      RuvB and RuvC, acts as an ATP-dependent pump that pulls double-stranded DNA
      into and through the complex, allowing the RuvC protein to cleave and resolve
      the HJ DNA at consensus sequences.
