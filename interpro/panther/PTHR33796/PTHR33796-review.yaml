family_id: PANTHER:PTHR33796
family_name: HOLLIDAY JUNCTION ATP-DEPENDENT DNA HELICASE RUVA
preferred_name: Bacterial RuvA Holliday-junction recognition subunit family
summary: RuvA, the Holliday-junction recognition subunit of the bacterial RuvAB branch-migration complex.
  A RuvA tetramer binds the four-way junction through helix-hairpin-helix motifs, holds it open and loads
  RuvB motor rings; RuvA has no ATPase activity, so it contributes specificity to, rather than powering,
  the RuvAB junction helicase. PANTHER's family name ('ATP-dependent DNA helicase') describes the RuvAB
  complex rather than RuvA alone.
functional_coherence: COHERENT
coherence_reason: 'One subfamily, PTHR33796:SF1, and all 40 reviewed members in the cached inventory are
  named Holliday junction branch migration complex subunit RuvA. The family is small relative to RuvA
  diversity (about 1,400 proteins): many RuvA proteins, including Pseudomonas putida KT2440 RuvA (Q88NJ1),
  carry the RuvA signatures (TIGR00084, IPR000085) but no PANTHER assignment. Coherence is about the proteins
  PANTHER does classify, not about RuvA as a whole.'
