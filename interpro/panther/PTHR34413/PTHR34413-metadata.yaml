  name:
    name: Tail Fiber Assembly Chaperone
    short: TFA_Chaperone
  description:
  - text: This family of proteins includes chaperones that are involved in the assembly
      of tail fibers in bacteriophages. These proteins act catalytically to form tail
      protein dimers and remain associated with the tail fiber, participating in host
      receptor binding. The assembly of tail fibers is crucial for the bacteriophages
      to attach to and infect bacterial cells. Some family members are expressed alternatively,
      extending the host range of the virus by allowing it to bind to different receptors.
      The proteins are characterized by their role in the post-translational modification
      and assembly of bacteriophage structural components.
