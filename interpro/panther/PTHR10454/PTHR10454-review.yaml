family_id: PANTHER:PTHR10454
family_name: CASPASE
preferred_name: Caspases and caspase-like CFLAR
summary: >-
  PTHR10454 contains the caspases, cysteine endopeptidases that initiate and execute apoptosis and inflammatory
  signalling. CFLAR (cFLIP) is a catalytically inactive paralog of caspase-8 that joins the death-inducing
  signalling complex and regulates caspase-8 activation.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Caspase protease activity is shared except in the CFLAR clade, which keeps DISC membership and regulatory
  function without catalytic activity.
