  proposed_action:
    paint_action: REMOVE_LOSS
  assessment_reason: >-
    PTN000047958 is the euarchontoglire CFLAR clade (6 leaves, SF239). cFLIP is recruited with procaspase-8
    to FADD in the CD95/TRAIL-receptor death-inducing signalling complex, where it regulates caspase-8
    activation (PMID:38710704); the CFLAR gene review accepts the DISC term and records this loss as CONTRADICTED.
    The other CFLAR IRDs on this node (endopeptidase activity, macrophage differentiation, neuron apoptosis)
    agree with the gene review.
