family_id: PANTHER:PTHR30504
family_name: GLUCANS BIOSYNTHESIS PROTEIN
preferred_name: OpgG/OpgD proteins with divergent beta-1,2-glucan processing chemistry
summary: Exported OpgG/OpgD-family proteins participate in formation and processing of osmoregulated periplasmic
  glucans. Characterized members include beta-1,2-glucan hydrolases and an anomer-inverting enzyme that
  closes a beta-1,2 chain with an alpha-1,6 bond. Native biosynthetic requirement, hydrolytic activity
  and control of chain length are separable properties. The family and its OpgD-labelled subfamily both
  contain distinct chemical mechanisms.
functional_coherence: HETEROGENEOUS
coherence_reason: E. coli P40120 and Xanthomonas Q8P3C6 are both SF3 but catalyze hydrolysis and cyclizing
  transglycosylation respectively. Rhodobacter Q9FA54 is also SF3 despite being genetically designated
  OpgG. SF4 OpgG has measured weak hydrolysis without an established obligatory native cleavage reaction.
  Broad participation and localization remain compatible with this catalytic heterogeneity.
