term_assessments:
- assessed_term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  scope: FAMILY_WIDE
  scope_reason: The exported OpgG/OpgD family shares the periplasmic destination; Sec and Tat routes differ.
    This is the broad PAINT localization assertion, not a uniform signal-sequence or export-mechanism
    claim.
  supported_by:
  - *id001
- assessed_term:
    id: GO:0051274
    label: beta-glucan biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: Formation and processing of the beta-linked glucan backbone encompasses both required
    OpgG participation and OpgD chain control/cyclization. This broad process does not identify the reaction
    performed by an uncharacterized member.
  supported_by:
  - *id002
  - &id003
    reference_id: PMID:38957137
    supporting_text: anomer-inverting transglycosylation mechanism
- assessed_term:
    id: GO:0033913
    label: glucan endo-1,2-beta-glucosidase activity
  scope: UNRESOLVED
  scope_reason: 'Member-level hydrolysis is established for E. coli P40120 and P33136, and inferred for
    KT2440 Q88D03 with a documented sequence bridge. Neither the whole family nor all SF3 can receive
    this activity: Q8P3C6 has characterized cyclizing transfer chemistry. SF4-wide activity is not established
    merely by the E. coli assay. UNRESOLVED describes the family-wide grant, not doubt that the measured
    E. coli activity exists. No unvalidated single-residue classifier is asserted.'
  supported_by:
  - reference_id: PMID:37735577
    supporting_text: EcOpgG was found to hydrolyze β-1,2-glucans; however, the catalytic velocity was
      very low
  - *id003
