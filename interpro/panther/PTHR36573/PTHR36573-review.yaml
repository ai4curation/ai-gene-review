family_id: PANTHER:PTHR36573
family_name: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM BINDING PROTEIN MLAC
preferred_name: MlaC/Ttg2D periplasmic phospholipid carrier of the Mla system
summary: MlaC-family proteins include the soluble periplasmic phospholipid carriers of characterized bacterial
  Mla systems. Their hydrophobic cavity shields lipid acyl chains, and contacts with outer-membrane lipid-loading
  complexes and the MlaD-containing inner-membrane complex support transfer. E. coli, P. putida KT2440
  and P. aeruginosa PAO1 structures or ligand measurements support carrier function; PAO1 Ttg2D can carry
  two diacyl phospholipids or one cardiolipin. Cargo occupancy, individual handoff and ATP-biased transfer
  are distinct measurements. The reference family also contains non-bacterial-labelled leaves, so neither
  a bacterial periplasm nor the complete Mla route is automatically licensed across the entire family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The 13-leaf official reference tree includes Nematostella A8DVR8 and the inactive Ricinus
  accession B9TGW9, both in SF1. Current UniProt confirms the A8DVR8 classification but does not establish
  a bacterial periplasm or Mla pathway for it. These may involve annotation or assembly issues; they are
  unresolved, not experimentally established alternative activities. Bacterial carrier positives remain
  intact.
