notes: >-
  Written to support modules/bacterial_mla_intermembrane_phospholipid_transport.yaml,
  whose MlaC part selects PANTHER:PTHR36573:SF1 with P. putida KT2440 Ttg2D (Q88P91) as
  exemplar. Node id, terms, seed, taxon and date are verbatim from PTHR36573-paint.tsv.
  Node position was read from the cached PAINT_TreeGrafter_Annotations_TOTAL file (18 SF1
  nodes; 4 carry GO:0030288 and GO:0120010, PTN002195249 = AN14), and IBA recipients
  (P0ADV7, Salmonella Q7CPP3, Yersinia A0A5P8YJX1) from the cached PAINT UniProt GAF.
  Phylum spread is from a UniProt REST query of xref:panther-PTHR36573 run on 2026-10-23
  (6694 entries). Q9HVW4 (P. aeruginosa PAO1 Ttg2D) is in SF1 per that query but is not
  listed as a representative because it is not in the reviewed entries.csv slice. Both
  PAINT rows are sound; the only recommendation is to raise them towards the family root
  so that the Pseudomonas Ttg2D proteins inherit them.
