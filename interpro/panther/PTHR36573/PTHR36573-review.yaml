node_assessments:
  - node_id: PANTHER:PTN002195249
    asserted_term:
      id: GO:0030288
      label: outer membrane-bounded periplasmic space
    evidence: IBD
    node_taxon:
      id: NCBITaxon:543
      label: Enterobacteriaceae
    paint_snapshot: "20241031"
    seeds:
      - id: UniProtKB:P0ADV7
        label: Intermembrane phospholipid transport system binding protein MlaC
        organism: Escherichia coli (strain K12)
    assessment: SOUND
    assessment_reason: >-
      Correct for every descendant: MlaC is a signal-peptide-bearing soluble periplasmic
      protein (IDA for E. coli). The placement is, if anything, conservative. The node
      is an Enterobacteriaceae clade (TreeGrafter AN14) and only 4 of the 18 SF1 nodes
      carry the term, so the IBA reaches E. coli, Salmonella and Yersinia MlaC but not
      Haemophilus MlaC or the Pseudomonas Ttg2D proteins, although P. aeruginosa Ttg2D
      has been isolated from the periplasm and all members share the same signal peptide
      plus soluble lipid-binding fold. Raising the term to the family root would be safe;
      no subfamily needs to be excluded.
    supported_by:
      - reference_id: PMID:33837253
        supporting_text: "can carry two diacyl glycerophospholipids as well as one cardiolipin"
  - node_id: PANTHER:PTN002195249
    asserted_term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    evidence: IBD
    node_taxon:
      id: NCBITaxon:543
      label: Enterobacteriaceae
    paint_snapshot: "20241031"
    seeds:
      - id: UniProtKB:P0ADV7
        label: Intermembrane phospholipid transport system binding protein MlaC
        organism: Escherichia coli (strain K12)
    assessment: SOUND
    assessment_reason: >-
      MlaC is the periplasmic shuttle of the Mla route, and the term is direction-neutral,
      which matters here because reconstitution supports ATP-driven retrograde transfer
      while also detecting spontaneous anterograde exchange. Placement is correct but
      shallower than the evidence allows: P. aeruginosa Ttg2D is a demonstrated periplasmic
      glycerophospholipid carrier of the orthologous Ttg2 system, so the term would be safe
      at the family root and would then reach the Pseudomonas Ttg2D proteins (including
      the module exemplar Q88P91, which currently has no GO annotation at all). E. coli
      P0ADV7 appearing as the seed of the IBA it receives is expected, not circular.
    supported_by:
      - reference_id: PMID:34873038
        supporting_text: "We reveal that MlaC spontaneously transfers PLs to the IM transporter in an MlaD-dependent manner that can be further enhanced by coupled ATP hydrolysis."
      - reference_id: PMID:39080293
        supporting_text: "the periplasmic phospholipid shuttle protein, MlaC"

term_assessments:
  - assessed_term:
      id: GO:0120010
      label: intermembrane phospholipid transfer
    scope: FAMILY_WIDE
    scope_reason: >-
      The defining process of every member; experimental support spans E. coli MlaC and
      P. aeruginosa Ttg2D. Recommended for extension from the Enterobacteriaceae node to
      the family root.
    supported_by:
      - reference_id: PMID:28388411
        supporting_text: "A soluble lipid-binding protein, MlaC, ferries lipids between MlaD and an outer membrane protein complex."
  - assessed_term:
      id: GO:0030288
      label: outer membrane-bounded periplasmic space
    scope: FAMILY_WIDE
    scope_reason: >-
      All members are soluble periplasmic proteins of diderm bacteria.
    supported_by:
      - reference_id: PMID:33837253
        supporting_text: "Ttg2D, produced both heterologously and homologously and isolated from the periplasm"
  - assessed_term:
      id: GO:0005543
      label: phospholipid binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Not asserted by PAINT, but the shared molecular function of the family and the
      function the Mla module records for this part. Shown for E. coli MlaC and for
      P. aeruginosa Ttg2D (diacyl glycerophospholipids and cardiolipin) and consistent
      with the conserved hydrophobic pocket in the Ralstonia and P. putida structures.
    supported_by:
      - reference_id: PMID:33837253
        supporting_text: "can carry two diacyl glycerophospholipids as well as one cardiolipin"
      - reference_id: PMID:31235958
        supporting_text: "revealing a pivoting β-sheet mechanism that functions to open and close the phospholipid-binding pocket"

