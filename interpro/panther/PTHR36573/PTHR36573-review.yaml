family_id: PANTHER:PTHR36573
family_name: INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM BINDING PROTEIN MLAC
preferred_name: MlaC/Ttg2D periplasmic phospholipid carrier of the Mla system
summary: >-
  Soluble periplasmic phospholipid-binding proteins of the Mla intermembrane
  phospholipid transport system of diderm bacteria (InterPro IPR008869, MlaC/ttg2D;
  Pfam PF05494). MlaC carries glycerophospholipid in a hydrophobic pocket and shuttles it
  across the periplasm between the outer-membrane OmpC/F-MlaA complex and the MlaD
  hexamer of the inner-membrane MlaFEDB ABC transporter. E. coli MlaC (P0ADV7) is the
  reference: its loss causes outer-leaflet phospholipid accumulation, it binds MlaA and
  MlaD directly, and reconstituted assays show phospholipid transfer between MlaC and
  MlaFEDB that ATP hydrolysis biases in the retrograde (outer-to-inner membrane)
  direction, although spontaneous anterograde transfer has also been reported. The
  Pseudomonas orthologs are named Ttg2D (P. aeruginosa Q9HVW4; P. putida KT2440 Q88P91,
  crystal structures 4FCZ and 5UWB); P. aeruginosa Ttg2D binds two diacyl
  glycerophospholipids or one cardiolipin. The family is a single PANTHER subfamily
  (SF1) and spans Pseudomonadota (Gamma-, Beta- and Alphaproteobacteria), Campylobacterota,
  Myxococcota, Thermodesulfobacteriota and other diderm phyla. InterPro counts 6699
  proteins in 8048 taxa; the fetched entries.csv holds the 4 reviewed members.
functional_coherence: COHERENT
coherence_reason: >-
  One subfamily, one fold and one role. Experimental data from two distant
  gammaproteobacterial lineages (E. coli MlaC and P. aeruginosa Ttg2D) agree on
  periplasmic phospholipid binding and carriage, and the structure from Ralstonia (PDB
  2qgu, the InterPro representative) and Pseudomonas putida show the same lipid-binding
  fold. No member is known to have a different function.
