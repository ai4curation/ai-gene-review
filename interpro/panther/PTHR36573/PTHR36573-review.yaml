notes: '2026-11-07 audit distinguishes measured binding from transfer: PMID28388411 uses biolayer interferometry
  for MlaC interaction with MlaFEDB and MlaA-OmpF; its handoff sentence is a model. PMID34873038 directly
  tests lipid exchange and ATP-dependent retrograde bias. PMID33837253 distinguishes native PAO1 periplasmic
  cargo from heterologous structural material. Pseudomonas and Bordetella target classifications are independently
  recorded; lack of a curated reference-tree leaf is not lack of family membership.'
