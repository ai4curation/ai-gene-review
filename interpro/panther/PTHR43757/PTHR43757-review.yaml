family_id: PANTHER:PTHR43757
family_name: AMINOMETHYLTRANSFERASE
preferred_name: Aminomethyltransferase (GcvT/AMT) and sarcosine oxidase family
summary: 'Folate-binding GcvT-related proteins include glycine-cleavage T proteins, SoxA subunits of heterotetrameric
  sarcosine oxidase and fused amine-oxidizing enzymes. SF2 contains both GcvT and SoxA. SF11 includes
  sarcosine dehydrogenase and experimentally characterized Arthrobacter dimethylglycine oxidase Q9AGP8.
  The official SF11 label does not establish sarcosine turnover: Q9AGP8 oxidizes DMG and couples the intermediate
  to THF, but does not oxidize sarcosine. Shared folate-binding architecture does not establish the lipoyl-H-protein
  reaction of aminomethyltransferase.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: Related THF-binding architecture is retained across different substrate-delivery and
  catalytic arrangements; subfamily labels do not by themselves specify the physiological substrate or
  electron acceptor.
