  diverged_from_family: true
  divergence_description: SoxA, the alpha subunit of heterotetrameric sarcosine oxidase, sits in SF2.
    It retains the GcvT-like folate-binding domain, which in the SoxABDG complex accepts the methylene
    group from sarcosine oxidation to form 5,10-methylenetetrahydrofolate, but it is fused to an NAD-binding
    domain and acts within the sarcosine oxidase complex rather than the glycine cleavage system.
