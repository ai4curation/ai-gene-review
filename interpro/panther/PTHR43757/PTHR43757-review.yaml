family_id: PANTHER:PTHR43757
family_name: AMINOMETHYLTRANSFERASE
preferred_name: Aminomethyltransferase (GcvT/AMT) and sarcosine oxidase family
summary: >-
  Folate-dependent enzymes of the GcvT fold. Aminomethyltransferase (T-protein of the glycine cleavage
  system: human AMT, S. cerevisiae GCV1, S. pombe gcv1, bacterial GcvT) transfers the methylene unit
  of glycine to tetrahydrofolate. Related members include sarcosine dehydrogenase (SARDH, SF11),
  the SoxA subunit of heterotetrameric sarcosine oxidase (in SF2), and other folate-binding demethylases.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF2 and SF16 are mostly T-proteins; SF2 also includes SoxA, and SF11 is sarcosine dehydrogenase.
reference_protein:
  id: UniProtKB:P48015
  label: Aminomethyltransferase, mitochondrial
  gene_symbol: GCV1
  organism: Saccharomyces cerevisiae
  gene_review: genes/yeast/GCV1/GCV1-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43757:SF2
  label: AMINOMETHYLTRANSFERASE, MITOCHONDRIAL
  description: GcvT/GCV1 and bacterial paralogs including SoxA.
  representative_members:
  - id: UniProtKB:P48015
    gene_symbol: GCV1
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/GCV1/GCV1-ai-review.yaml
  - id: UniProtKB:Q50LF0
    label: Sarcosine oxidase subunit alpha
    gene_symbol: soxA
    organism: Corynebacterium sp. (strain U-96)
    gene_review: genes/CORS9/soxA/soxA-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    SoxA, the alpha subunit of heterotetrameric sarcosine oxidase, sits in SF2. It retains the
    GcvT-like folate-binding domain, which in the SoxABDG complex accepts the methylene group from
    sarcosine oxidation to form 5,10-methylenetetrahydrofolate, but it is fused to an NAD-binding
    domain and acts within the sarcosine oxidase complex rather than the glycine cleavage system.
  supported_by:
  - reference_id: file:CORS9/soxA/soxA-uniprot.txt
    supporting_text: >-
      Heterotetramer composed of subunits alpha (SoxA), beta (SoxB), gamma (SoxG) and delta
      (SoxD).
