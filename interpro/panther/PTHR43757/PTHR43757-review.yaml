review_status: COMPLETE
reviewed_by: Codex, following existing family and individual gene reviews
review_date: '2026-11-06'
notes: 'Updated for the bacterial dimethylglycine and sarcosine catabolism module: Corynebacterium SoxA
  (Q50LF0) added as an SF2 representative and as a member exception to the glycine cleavage assertions,
  and the PAINT nodes not previously assessed were added. Because the family is the aminomethyltransferase
  family, the module grounds its SoxA role on NCBIfam TIGR01372 instead. The 2026-11-06 DMGO audit establishes
  Q9AGP8 in SF11 without reassigning any PAINT node. Existing duplicated-PTN placement questions remain
  unresolved. No subfamily-wide DMG or sarcosine turnover claim is added. DMGO has distinct oxidation
  and folate-capture regions; the fold relation to GcvT does not imply an identical physiological reaction.
  The CHRI1 SoxA representative is an explicit SF2 member exception to glycine-cleavage claims, on specific
  domain and locus evidence; no target-specific assay is invented.'
