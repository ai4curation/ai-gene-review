family_id: PANTHER:PTHR43651
family_name: 1,4-ALPHA-GLUCAN-BRANCHING ENZYME
preferred_name: GH13 1,4-alpha-glucan branching enzyme family (GlgB/GBE1/GLC3 and TreZ)
summary: >-
  Glycoside hydrolase family 13 (GH13) enzymes with an N-terminal E-set
  (CBM48-like) domain. The PANTHER tree splits at its root into two clades. The
  larger (PTN000040010) holds the 1,4-alpha-glucan branching enzymes:
  bacterial GlgB, human GBE1, S. cerevisiae GLC3 and the plant starch
  branching enzymes, which introduce alpha-1,6 branch points into glycogen and
  amylopectin. The smaller (PTN002450373, subfamily SF11) holds the TreZ
  malto-oligosyltrehalose trehalohydrolases of the TreY/TreZ trehalose
  pathway, which hydrolyse the alpha-1,4 bond next to the trehalose unit of
  maltooligosyltrehalose. A small eukaryotic sub-clade of SF11 (Monosiga,
  Chlamydomonas, Klebsormidium) is uncharacterized.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The branching-enzyme clade is functionally uniform; the TreZ clade (SF11) is
  a sister clade with a different reaction, hydrolysis rather than
  transglycosylation, and no branching activity. No PAINT IBD node spans both
  clades, so the branching-enzyme terms do not reach TreZ.
