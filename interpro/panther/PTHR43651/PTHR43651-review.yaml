    gene_review: genes/PSEPK/treZ/treZ-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Hydrolyses the alpha-1,4 bond joining the maltooligosyl and trehalose
    moieties of maltooligosyltrehalose, releasing trehalose; it has no
    branching activity.
