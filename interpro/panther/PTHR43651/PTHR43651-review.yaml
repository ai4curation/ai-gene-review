family_id: PANTHER:PTHR43651
family_name: 1,4-ALPHA-GLUCAN-BRANCHING ENZYME
preferred_name: GH13 1,4-alpha-glucan branching enzyme family (GlgB/GBE1/GLC3 and TreZ)
summary: >-
  GH13 glycoside hydrolase-family enzymes. Branching enzymes (bacterial GlgB, human GBE1, S. cerevisiae
  GLC3, plant SBE) introduce alpha-1,6 branches into glycogen and starch. SF11 holds TreZ malto-oligosyltrehalose
  trehalohydrolases of the TreY/TreZ trehalose pathway.
functional_coherence: MOSTLY_COHERENT
coherence_reason: All subfamilies are branching enzymes except SF11 (TreZ).
