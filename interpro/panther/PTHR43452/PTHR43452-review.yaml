family_id: PANTHER:PTHR43452
family_name: PYRUVATE DECARBOXYLASE
preferred_name: Thiamine-diphosphate-dependent pyruvate / 2-oxo-acid decarboxylases (PDC, ARO10, THI3)
summary: >-
  Thiamine diphosphate (ThDP)- and Mg2+-dependent non-oxidative 2-oxo-acid decarboxylases.
  The archetypal members are the fungal and plant pyruvate decarboxylases and Zymomonas Pdc,
  which decarboxylate pyruvate to acetaldehyde and CO2 in the cytosol, the committed step of
  alcoholic fermentation and the source of acetaldehyde for the yeast PDH bypass. The yeast
  pyruvate decarboxylases (Pdc1, Pdc5, Pdc6) also decarboxylate branched-chain and
  sulfur-containing 2-oxo acids and so contribute to the Ehrlich pathway. Inside the family,
  S. cerevisiae ARO10 has diverged into a broad-specificity aromatic/branched-chain 2-oxo-acid
  decarboxylase that does not decarboxylate pyruvate, and S. cerevisiae THI3 is a catalytically
  inactive ThDP-sensing regulator of the THI regulon. Bacterial indolepyruvate decarboxylases
  (IpdC) and mycobacterial alpha-keto-acid decarboxylases (Kdc) are also classified here.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  ThDP-dependent 2-oxo-acid decarboxylation is the shared chemistry, but substrate specificity
  and even catalysis diverge. Pyruvate decarboxylase activity is experimentally established for
  the yeast PDC clade (SF30 PDC1/PDC5/PDC6), and PANTHER/UniProt place the Zymomonas, Neurospora
  and fission yeast pdc101/pdc102 enzymes in SF1 and the plant PDCs in several plant
  subfamilies. Two characterized S. cerevisiae members break the pattern: ARO10 (SF3) cannot
  decarboxylate pyruvate and prefers aromatic and branched-chain 2-oxo acids, and THI3 (inside
  SF30, the same subfamily as PDC1/5/6) has no detectable decarboxylase activity and acts as a
  transcriptional co-regulator. SF30 also mixes the yeast PDCs with bacterial IpdC and Kdc
  substrate specialists, so SF30 membership alone does not guarantee pyruvate decarboxylase
  activity.
