term_assessments:
- assessed_term:
    id: GO:0004737
    label: pyruvate decarboxylase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for the canonical PDC subfamilies, which include the yeast PDC1/PDC5/PDC6 (SF30), the
    Zymomonas/Neurospora/fission-yeast pdc101/pdc102 group (SF1), fission yeast pdc201 (SF36)
    and the plant PDC subfamilies. Not safe for SF3 (ARO10, experimentally lacking pyruvate
    activity). Within SF30, THI3 is an exception, and the bacterial IpdC/Kdc members of SF30
    were not assessed here and should not be assumed to be pyruvate decarboxylases on
    subfamily grounds. This is the term the alcoholic fermentation and PDH bypass modules
    require of the family.
