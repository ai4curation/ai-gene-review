  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node sits deep enough that the IBA reaches the fungal, plant (SF5/6/7/18/20/38/39) and
    Zymomonas-type (SF1) pyruvate decarboxylases, which is sound for them. ARO10 (SF3) also
    descends from it and receives GO:0004737, but Aro10 has been shown not to decarboxylate
    pyruvate; the ARO10 gene review removes the IBA as functional divergence. An IRD/NOT on the
    ARO10 branch is needed. THI3, which is catalytically inactive, does not receive this IBA in
    the current PAINT GAF (it only receives cytosol from this node), so it needs no further
    pruning for the activity term.
