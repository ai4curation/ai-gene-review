notes: >-
  PANTHER has no PAINT node annotations for PTHR43656 (85 tree nodes, none annotated), so there
  are no node assessments. Because the family and its SF2 subfamily mix unrelated flavin
  oxidoreductases with the dimethylglycine dehydrogenases, the bacterial dimethylglycine and
  sarcosine catabolism module does not use PTHR43656 as the grounding id of its DgcA role.
