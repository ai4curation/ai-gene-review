family_id: PANTHER:PTHR43656
family_name: BINDING OXIDOREDUCTASE, PUTATIVE (AFU_ORTHOLOGUE AFUA_2G08260)-RELATED
preferred_name: NADH-dependent flavin oxidoreductase (Old Yellow Enzyme-like) family
summary: >-
  Flavin oxidoreductases built on an Old Yellow Enzyme (OYE)-type TIM-barrel FMN-binding domain
  (Pfam Oxidored_FMN). Most Swiss-Prot members are ~370-450-residue single-domain enzymes of
  secondary metabolism or redox chemistry (fungal ilicicolin H biosynthesis enzymes IccE/IccG/IliE,
  Aspergillus aflatoxin pathway NadA, Rhodococcus 4,4'-dithiodibutanoate disulfide reductase Nox,
  B. subtilis YqiG). The bacterial dimethylglycine dehydrogenases (Chromohalobacter DdhC,
  Pseudomonas DgcA) are ~690-residue two-domain members that fuse the OYE-like barrel to a
  C-terminal FAD/NAD(P)-binding pyridine nucleotide-disulfide oxidoreductase domain (Pyr_redox_2),
  the architecture of 2,4-dienoyl-CoA reductase/trimethylamine dehydrogenase-like flavoenzymes.
  DdhC is the only member with direct biochemical characterisation of an amino-acid demethylase
  activity.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members share only generic flavin-dependent oxidoreductase chemistry. Substrates and pathways
  differ between members (polyketide/tetramic acid tailoring, mycotoxin biosynthesis, disulfide
  reduction, N,N-dimethylglycine and sarcosine demethylation), and the DdhC/DgcA clade has a
  distinct two-domain architecture. PANTHER has no PAINT annotations for this family.
reference_protein:
  id: UniProtKB:Q1QYW1
  label: N,N-dimethylglycine/sarcosine dehydrogenase
  gene_symbol: ddhC
  organism: Chromohalobacter salexigens DSM 3043
  gene_review: genes/CHRI1/ddhC/ddhC-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR43656:SF2
    label: BINDING OXIDOREDUCTASE, PUTATIVE (AFU_ORTHOLOGUE AFUA_2G08260)-RELATED
    description: >-
      Holds both the single-domain OYE-like enzymes (Nox, YqiG, IliE, IccE/IccG) and the two-domain
      bacterial dimethylglycine dehydrogenases (DdhC; KT2440 DgcA is classified here by UniProt's
      PANTHER cross-reference). The subfamily is therefore not specific to dimethylglycine
      catabolism; the DgcA/DdhC role is recognised by the two-domain architecture together with a
      conserved dgcA-dgcB-etfA-etfB gene neighbourhood.
    representative_members:
      - id: UniProtKB:Q1QYW1
        label: N,N-dimethylglycine/sarcosine dehydrogenase
        gene_symbol: ddhC
        organism: Chromohalobacter salexigens DSM 3043
        gene_review: genes/CHRI1/ddhC/ddhC-ai-review.yaml
      - id: UniProtKB:P54524
        label: Probable NADH-dependent flavin oxidoreductase YqiG
        gene_symbol: yqiG
        organism: Bacillus subtilis (strain 168)
      - id: UniProtKB:A0A0N9HP11
        label: 4,4'-dithiodibutanoate disulfide reductase
        gene_symbol: nox
        organism: Rhodococcus erythropolis
    diverged_from_family: true
    divergence_description: >-
      The dimethylglycine dehydrogenase clade (DdhC, DgcA) carries an additional C-terminal
      FAD/NAD(P)-binding domain and has evolved N-demethylase activity on N,N-dimethylglycine and
      sarcosine, coupled through an iron-sulfur ferredoxin partner; this activity is not shared
      by the single-domain members.
    supported_by:
      - reference_id: file:interpro/panther/PTHR43656/PTHR43656-entries.csv
        supporting_text: Q1QYW1,"N,N-dimethylglycine/sarcosine dehydrogenase",protein,290398
      - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
        supporting_text: >-
          Catalyzes the demethylation of both N,N-dimethylglycine (DMG) and sarcosine, releasing
          formaldehyde and forming glycine as the final product (PubMed:32631860).
      - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
        supporting_text: "DR   Pfam; PF07992; Pyr_redox_2; 1."
  - subfamily_id: PANTHER:PTHR43656:SF5
    label: NADH:FLAVIN OXIDOREDUCTASE_NADH OXIDASE N-TERMINAL DOMAIN-CONTAINING PROTEIN
    description: Fungal NadA-like flavin oxidoreductases of aflatoxin biosynthesis.
    representative_members:
      - id: UniProtKB:Q6UEF0
        label: NADH-dependent flavin oxidoreductase nadA
        gene_symbol: nadA
        organism: Aspergillus parasiticus
    diverged_from_family: false
    supported_by:
      - reference_id: file:interpro/panther/PTHR43656/PTHR43656-entries.csv
        supporting_text: Q6UEF0,NADH-dependent flavin oxidoreductase nadA,protein,1403190
term_assessments:
  - assessed_term:
      id: GO:0016491
      label: oxidoreductase activity
    scope: FAMILY_WIDE
    scope_reason: Every characterized member is a flavin-dependent oxidoreductase; the term is true but uninformative.
    supported_by:
      - reference_id: file:interpro/panther/PTHR43656/PTHR43656-metadata.yaml
        supporting_text: The NADH-dependent flavin oxidoreductase family is involved in various biosynthetic
  - assessed_term:
      id: GO:0047865
      label: dimethylglycine dehydrogenase activity
    scope: NOT_APPLICABLE
    scope_reason: >-
      Dimethylglycine demethylation is confined to the two-domain DdhC/DgcA clade within SF2 and is
      not inherited by the single-domain members. Moreover GO:0047865 is defined with
      electron-transfer flavoprotein as the direct acceptor, whereas DdhC transfers electrons to
      the [4Fe-4S] ferredoxin Csal_0991 (EC 1.5.7.3); the family-level claim is therefore not made.
    supported_by:
      - reference_id: file:CHRI1/ddhC/ddhC-uniprot.txt
        supporting_text: >-
          Regeneration of NAD(P)(+) is achieved by electron transfer to the [4Fe-4S] cluster in the
          probable membrane-anchored ferredoxin csal_0991 (PubMed:32631860).
