notes: >-
  Bacterial Tgt and archaeal ArcTGT share SF1, so SF1 membership alone does not
  establish wobble-position preQ1 insertion. HAMAP MF_00168 and NCBIfam
  TIGR00430 are the discriminating signatures for bacterial Tgt.
