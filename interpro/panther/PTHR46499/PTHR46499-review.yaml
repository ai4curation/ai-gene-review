family_id: PANTHER:PTHR46499
family_name: QUEUINE TRNA-RIBOSYLTRANSFERASE
preferred_name: Tgt / archaeal ArcTGT tRNA-guanine transglycosylase family
summary: >-
  The tRNA-guanine transglycosylase family. Most reviewed members are bacterial
  Tgt enzymes, which exchange guanine 34 of GUN-anticodon tRNAs for preQ1
  (E. coli Tgt is the reference). Subfamily SF1 also contains archaeal
  tRNA-guanine(15) transglycosylases (ArcTGT/TgtA), which insert preQ0 at
  position 15 for archaeosine synthesis. SF2 holds archaeosine synthase
  (ArcS) proteins.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  In the parsed entries file, SF1 holds 424 queuine tRNA-ribosyltransferases,
  1 putative one, 35 archaeal tRNA-guanine(15) transglycosylases and 1
  archaeosine synthase alpha subunit. SF2 holds 3 archaeosine synthase
  proteins. Wobble-position preQ1 insertion therefore does not cover the whole
  family, or even the whole of SF1.
reference_protein:
  id: UniProtKB:P0A847
  label: Queuine tRNA-ribosyltransferase
  gene_symbol: tgt
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/tgt/tgt-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR46499:SF1
  label: QUEUINE TRNA-RIBOSYLTRANSFERASE
  description: >-
    Bacterial Tgt (preQ1 insertion at G34), together with archaeal
    tRNA-guanine(15) transglycosylases (preQ0 insertion at G15). HAMAP
    MF_00168 and NCBIfam TIGR00430 mark the bacterial Tgt members.
  representative_members:
  - id: UniProtKB:P0A847
    gene_symbol: tgt
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/tgt/tgt-ai-review.yaml
  - id: UniProtKB:Q88PL7
    gene_symbol: tgt
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/tgt/tgt-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR46499:SF2
  label: ARCHAEOSINE SYNTHASE
  description: >-
    Archaeal archaeosine synthase (ArcS) proteins, which act after preQ0
    insertion and do not perform wobble-position base exchange. Not reviewed
    at gene level here.
  diverged_from_family: true
