term_assessments:
- assessed_term:
    id: GO:0008479
    label: tRNA-guanosine(34) queuine transglycosylase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    GOC applies this term to bacterial Tgt (preQ1 insertion; InterPro2GO
    IPR004803). It holds for the Tgt members of SF1, including the E. coli and
    P. putida references, where it is accepted as core. It does not hold for
    the archaeal tRNA-guanine(15) transglycosylases in the same subfamily or
    for SF2 archaeosine synthases. A preQ1-specific bacterial term has been
    proposed in the gene reviews.
