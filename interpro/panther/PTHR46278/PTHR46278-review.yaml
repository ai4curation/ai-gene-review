notes: >-
  Used by modules/aspartate_family_threonine_biosynthesis.yaml
  (aspartate_semialdehyde_dehydrogenase_activity, family_terms PTHR46718:SF1 plus
  PTHR46278:SF4). E. coli asd is in SF4 (verified in UniProt and PANTHER 19.0), so the
  module's id is right for its representative. But SF4 is only the proteobacterial clade:
  B. subtilis, M. tuberculosis, cyanobacterial and plant ASADHs are in SF2, so a
  family-level id would match the module's "aspartate-semialdehyde dehydrogenases" intent
  better, at the cost of including the USG-1 paralogues. The module labels GO:0004073
  "aspartate-semialdehyde dehydrogenase (NADP+) activity"; the current GO label is
  "aspartate-semialdehyde dehydrogenase activity". No member of this family has an in-repo
  gene review. The paint slice includes the ArgC node PTN000795273 only because of the
  Q55512 leaf.
