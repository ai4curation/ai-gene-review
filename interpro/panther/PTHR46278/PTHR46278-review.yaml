    USG-1 paralogues.
  representative_members:
  - id: UniProtKB:Q04797
    label: Aspartate-semialdehyde dehydrogenase
    gene_symbol: asd
    organism: Bacillus subtilis 168
  - id: UniProtKB:P9WNX5
    label: Aspartate-semialdehyde dehydrogenase
    gene_symbol: asd
    organism: Mycobacterium tuberculosis H37Rv
  - id: UniProtKB:P08390
    label: USG-1 protein
    gene_symbol: usg
    organism: Escherichia coli K-12
  diverged_from_family: false
term_assessments:
- assessed_term:
    id: GO:0004073
    label: aspartate-semialdehyde dehydrogenase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The module's activity (it uses SF4 for the enterobacterial enzyme) and a PAINT IBD at
    PTN000019341 with experimental seeds in both subfamilies, so the activity is ancestral to
    the family. The USG-1 paralogues are the one unverified group: they inherit the term but
    their activity has not been checked here; they are flagged in the node assessment rather
    than excepted, because no evidence of loss was found.
  supported_by:
  - reference_id: file:interpro/panther/PTHR46278/PTHR46278-entries.csv
    supporting_text: P0A9Q9,Aspartate-semialdehyde dehydrogenase,protein,83333
  - reference_id: file:interpro/panther/PTHR46278/PTHR46278-entries.csv
    supporting_text: P9WNX5,Aspartate-semialdehyde dehydrogenase,protein,83332
- assessed_term:
    id: GO:0009090
    label: L-homoserine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Asserted at PTN000019341 (seed E. coli asd) and the module's trunk concept; ASADH
    performs the second step of homoserine synthesis in every lineage that has it. Same
    USG-1 caveat as for the activity.
  supported_by:
  - reference_id: file:interpro/panther/PTHR46278/PTHR46278-entries.csv
    supporting_text: P0A9Q9,Aspartate-semialdehyde dehydrogenase,protein,83333
- assessed_term:
    id: GO:0009085
    label: L-lysine biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    Asserted at PTN000019341 from E. coli and M. tuberculosis asd, and correct wherever
    aspartate semialdehyde feeds the diaminopimelate pathway (enterobacteria, Firmicutes,
    actinobacteria, plants). Whether it holds depends on the organism's lysine route, not on
    subfamily, so it is not scoped here. It is not asserted for the fungal family PTHR46718,
    which is correct.
  supported_by:
  - reference_id: file:interpro/panther/PTHR46278/PTHR46278-paint.tsv
    supporting_text: UniProtKB:P0A9Q9|UniProtKB:P9WNX5
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: UNRESOLVED
  scope_reason: >-
    Asserted at PTN000019341 from E. coli asd and usg and received by 37 bacterial members;
    the plant ASADH (At1g14810, SF2) does not receive it in the current GAF. Correct for
    bacteria, not for plastid-localised plant enzymes, which share SF2.
  supported_by:
  - reference_id: file:interpro/panther/PTHR46278/PTHR46278-paint.tsv
    supporting_text: UniProtKB:P08390|UniProtKB:P0A9Q9
- assessed_term:
    id: GO:0003942
    label: N-acetyl-gamma-glutamyl-phosphate reductase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    ArgC activity, asserted at PTN000795273 from E. coli, B. subtilis and Arabidopsis ArgC
    seeds that the PANTHER classification places in PTHR32338, not here. The only
    PTHR46278 member that receives it is Synechocystis Q55512, which UniProt names an
    aspartate-semialdehyde dehydrogenase (SF2). No member of this family should carry it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR46278/PTHR46278-entries.csv
    supporting_text: Q55512,Aspartate-semialdehyde dehydrogenase,protein,1111708
- assessed_term:
    id: GO:0006526
    label: L-arginine biosynthetic process
  scope: NOT_APPLICABLE
  scope_reason: Same node (PTN000795273) and same reasoning as N-acetyl-gamma-glutamyl-phosphate reductase activity.
  supported_by:
  - reference_id: file:interpro/panther/PTHR46278/PTHR46278-entries.csv
    supporting_text: Q55512,Aspartate-semialdehyde dehydrogenase,protein,1111708
node_assessments:
- node_id: PANTHER:PTN000019341
  asserted_term:
    id: GO:0004073
    label: aspartate-semialdehyde dehydrogenase activity
  paint_snapshot: '20260828'
  seeds:
  - id: AGI_LocusCode:AT1G14810
    organism: Arabidopsis thaliana
  - id: UniProtKB:P0A9Q9
    label: asd
    organism: Escherichia coli K-12
  - id: UniProtKB:P23247
    label: asd2
    organism: Vibrio cholerae
  - id: UniProtKB:P44801
    label: asd
    organism: Haemophilus influenzae
  - id: UniProtKB:P9WNX5
    label: asd
    organism: Mycobacterium tuberculosis H37Rv
  - id: UniProtKB:Q9KQG2
    label: asd1
    organism: Vibrio cholerae
  assessment: UNRESOLVED
  assessment_reason: >-
    Placement for the ASADHs is sound (seeds in both SF2 and SF4, bacteria and plants). The
    open question is the USG-1 clade: E. coli usg (P08390), H. influenzae P45201 and P.
    aeruginosa O87014 receive ASADH activity, L-homoserine and L-lysine biosynthesis from
    this node although none is a seed for the activity (E. coli usg is a seed only for
    cytosol). If USG-1 proteins lack ASADH activity, an IRD on the USG-1 clade is needed. No
    experimental evidence either way was found for this review.
  supported_by:
  - reference_id: file:interpro/panther/PTHR46278/PTHR46278-entries.csv
    supporting_text: P08390,USG-1 protein,protein,83333
- node_id: PANTHER:PTN000795273
  asserted_term:
    id: GO:0003942
    label: N-acetyl-gamma-glutamyl-phosphate reductase activity
  paint_snapshot: '20250310'
  seeds:
  - id: UniProtKB:P11446
    label: argC
    organism: Escherichia coli K-12
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The IBD is correct for the ArgC clade it is placed on (85 recipients, nearly all named
    argC or plant ArgC orthologues from bacteria, archaea and plants). One leaf under it, Synechocystis
    Q55512, is named and classified (PTHR46278:SF2) as an aspartate-semialdehyde
    dehydrogenase and so wrongly inherits ArgC activity and arginine biosynthesis; the same
    organism's ArgC (P54899) also sits under the node. Either Q55512's tree placement or
    the leaf needs an IRD. No subfamily is listed because SF2 as a whole does not inherit it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR46278/PTHR46278-entries.csv
    supporting_text: Q55512,Aspartate-semialdehyde dehydrogenase,protein,1111708
