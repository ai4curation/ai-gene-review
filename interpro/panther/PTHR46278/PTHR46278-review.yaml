family_id: PANTHER:PTHR46278
family_name: DEHYDROGENASE, PUTATIVE-RELATED
preferred_name: Bacterial- and plant-type aspartate-semialdehyde dehydrogenases
summary: >-
  NAD(P)-binding Rossmann-fold dehydrogenases of the bacterial/plant type that reduce
  4-phospho-L-aspartate to L-aspartate 4-semialdehyde (EC 1.2.1.11). SF4 holds the
  proteobacterial enzymes (E. coli, Salmonella, Haemophilus, Vibrio asd1, Neisseria,
  Pseudomonas, Buchnera); SF2 holds the Firmicute, actinobacterial, cyanobacterial,
  epsilon-proteobacterial, Rickettsia and plant ASADHs together with the USG-1 paralogues of
  unknown function. The fungal ASADHs are in the separate family PTHR46718.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family name is uninformative, but both inventory subfamilies are named
  ASPARTATE-SEMIALDEHYDE DEHYDROGENASE and 43 of 47 reviewed members are ASADHs; PAINT puts
  the activity at PTN000019341 with seeds in both subfamilies (E. coli asd and Vibrio asd1
  in SF4; M. tuberculosis asd, Vibrio asd2 and Arabidopsis At1g14810 in SF2). The
  divergent members are the USG-1 proteins (E. coli usg and homologues in Haemophilus,
  Pseudomonas, Azotobacter; SF2), ASADH paralogues of unknown function that nevertheless
  inherit ASADH activity and both amino acid biosynthetic processes from PTN000019341.
  Pathway context also varies: the lysine-biosynthesis role depends on the organism having
  the diaminopimelate pathway.
subfamilies:
