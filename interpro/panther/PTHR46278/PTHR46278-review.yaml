- subfamily_id: PANTHER:PTHR46278:SF2
  label: ASPARTATE-SEMIALDEHYDE DEHYDROGENASE
  description: >-
    Other bacterial and plant ASADHs (B. subtilis, M. tuberculosis, Corynebacterium,
