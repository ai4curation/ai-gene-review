family_id: PANTHER:PTHR24243
family_name: G-PROTEIN COUPLED RECEPTOR
summary: This rhodopsin-like receptor family contains membrane receptors that couple ligand recognition
  to cellular signaling. The GHSR branch recognizes ghrelin and growth-hormone secretagogues and regulates
  endocrine and feeding responses.
functional_coherence: HETEROGENEOUS
coherence_reason: GHSR recognition of ghrelin is supported by ligand isolation (PMID:10604470) and a ghrelin-bound
  receptor–G-protein structure (PMID:35027551). The experimentally anchored SF7 branch supports this activity,
  but other GHSR-like and broader receptor branches have not been resolved into an exhaustive ligand-specific
  set. Seven-transmembrane architecture alone does not specify growth-hormone-secretagogue recognition,
  G-protein preference or an endocrine phenotype.
