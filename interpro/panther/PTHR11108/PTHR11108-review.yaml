family_id: PANTHER:PTHR11108
family_name: FERROCHELATASE
preferred_name: Ferrochelatase (HemH/HEM15/FECH) family
summary: >-
  Ferrochelatases insert Fe2+ into protoporphyrin IX to make protoheme, the last step of heme synthesis.
  The eukaryotic enzymes sit on the matrix side of the mitochondrial inner membrane, and the animal
  ones carry a [2Fe-2S] cluster. The family contains bacterial HemH, S. cerevisiae HEM15, S. pombe
  hem15, human FECH and plant FC1/FC2.
functional_coherence: COHERENT
coherence_reason: All subfamilies are protoporphyrin ferrochelatases.
