- subfamily_id: PANTHER:PTHR43194:SF2
  label: PEROXISOMAL MEMBRANE PROTEIN LPX1
  description: >-
    Yeast Lpx1 (Q12405), fission yeast C57A10.08c, M. tuberculosis Rv0045c, RutD-like carbamate
    hydrolases and other bacterial hydrolases. P. putida KT2440 AcoC (Q88QE1) is also placed here.
  representative_members:
