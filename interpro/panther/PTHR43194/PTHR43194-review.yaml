notes: 'Node extents come from the PANTHER 19.0 treeinfo API (2026-11-02). PTN002455972 spans SF5 (15
  leaves, including P. aeruginosa PhaG and RhlA) and SF3 (RsbQ). PTN002455963 spans SF2 (74) and SF4 (8)
  under a Eukaryota constraint. PR #5078 carries a machine-generated draft of this file; this curated
  version supersedes it. SF2 contains the P. putida KT2440 acetoin-system E2 AcoC (Q88QE1), placed there
  by its C-terminal AB hydrolase-1 domain while its N-terminal lipoyl domain carries the E2 role. No GO:0004742
  assessment is made: acetyl transfer is a property of that one member, not of SF2''s Lpx1-type and RutD-type
  hydrolases, and a SUBFAMILY_ONLY scope would assert it for all of them. The acetoin module therefore
  grounds the E2 on NCBIfam NF011457, which groups the lipoyl/alpha-beta-hydrolase acetoin E2s, and records
  that no PANTHER family describes the E2 role. This follow-up retains AcoC Q88QE1 as a lipoyl-dependent
  acetyltransferase and preserves its prior quoted evidence in the archived original term assessment;
  it does not recurate that protein. Original member-exception objects are archived exactly in family-consultation/prior-term-assessments.json.
  PhaG hydrolysis and BioH-secondary-activity exclusions were withdrawn as unproven; original PAINT payloads
  remain unchanged, including historical seed lists. Tree-scope evidence is refreshed independently from
  the official API. 2026-11-08 successor: original live member exceptions and term scopes are restored
  with explicit functional-relevance limits; the separate analysis ledger is historical. The biological-process
  RsbQ boundary is machine-readable in affected_subfamilies. Remaining unresolved ancestral placements
  keep the family at NEEDS_REVIEW.'
