family_id: PANTHER:PTHR43194
family_name: HYDROLASE ALPHA/BETA FOLD FAMILY
preferred_name: BioH/PhaG/Lpx1-type alpha/beta-hydrolase-fold esterases and acyltransferases
summary: >-
  Alpha/beta-hydrolase-fold (AB hydrolase-1) proteins. SF5 holds the gammaproteobacterial biotin
  pathway esterase BioH (pimeloyl-ACP methyl ester esterase, E. coli P13001) and the Pseudomonas
  3-hydroxyacyl transacylases PhaG and RhlA. SF3 holds the B. subtilis stress-signalling protein
  RsbQ. SF2 holds yeast Lpx1 and diverse bacterial and eukaryotic hydrolases (RutD-like carbamate
  hydrolases, Rv0045c, RufB). The P. putida KT2440 acetoin-system E2 AcoC (Q88QE1) is classified in
  SF2 through its C-terminal AB hydrolase-1 domain; it adds an N-terminal lipoyl domain.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members share the fold and serine-hydrolase chemistry, but the characterized activities differ
  by subfamily: BioH ester hydrolysis in biotin synthesis, PhaG/RhlA acyl transfer in PHA and
  rhamnolipid synthesis, RsbQ signalling, and Lpx1 lipase activity. Only the broad hydrolase
  activity is family-wide. The lipoyl-domain acetoin E2s are grouped by NCBIfam NF011457, not by
  this family.
reference_protein:
  id: UniProtKB:O85207
  label: (R)-3-hydroxydecanoyl-ACP:CoA transacylase
  gene_symbol: phaG
  organism: Pseudomonas putida KT2440
  gene_review: genes/PSEPK/phaG/phaG-ai-review.yaml
