term_assessments:
- assessed_term:
    id: GO:0016787
    label: hydrolase activity
  scope: UNRESOLVED
  scope_reason: Broad hydrolase activity is established in several branches, but the family also includes
    acyltransferases. PhaG hydroxyacid/ligase phenotypes do not uniquely establish intrinsic thioesterase
    activity; 2022 product-sink controls favor ACP-to-CoA transfer. Neither secondary hydrolysis nor its
    universal absence is established. The pre-existing AcoC E2 acetyltransferase judgment is retained
    in notes and the archived original term assessment; its schema representation changes only because
    UNRESOLVED cannot carry member_exceptions. AcoC Q88QE1 remains judged not to perform hydrolase activity
    in this family review, on its E2 acetyltransferase assignment. The current schema/semantic combination
    cannot preserve that independently negative member as a live member_exceptions object under UNRESOLVED;
    current-member-judgments.yaml retains it explicitly, with the enforcement limitation documented.
  supported_by:
  - *id001
  - *id003
  - *id004
  - reference_id: file:genes/PSEPK/acoC/acoC-ai-review.yaml
    supporting_text: AcoC is the lipoyl-bearing E2 acetyltransferase assigned to the acetoin-cleaving
      system of Pseudomonas putida KT2440
- assessed_term:
    id: GO:0090499
    label: pimelyl-[acyl-carrier protein] methyl ester esterase activity
  scope: UNRESOLVED
  scope_reason: BioH is a positive pimeloyl-ACP methyl esterase, but SF5 also contains PhaG and RhlA with
    established different pathway roles. Those positive functions do not prove absence of secondary BioH-like
    chemistry. No whole-SF5 grant, categorical negative PhaG exception, or precise historical pruning
    point is justified here.
  supported_by:
  - *id002
  - *id001
