  name:
    name: G-protein coupled receptor 1
    short: GPCR1
  description:
  - text: The G-protein coupled receptor 1 family is characterized by its involvement
      in diverse physiological processes through the activation of G-protein signaling
      pathways. Members of this family function as receptors for various ligands,
      including hormones, lipids, and cannabinoids, mediating effects such as melanogenesis,
      energy homeostasis, cell migration, and inflammatory responses. They regulate
      adenylate cyclase activity, affecting cyclic AMP levels, and are implicated
      in processes like food intake, memory, pain perception, and cellular respiration.
      The receptors are also involved in developmental roles, such as embryonic heart
      development and bone homeostasis, and contribute to the body's response to tissue
      damage and infectious agents.
