  scope: UNRESOLVED
  scope_reason: Purified E. coli MarR binds its operator preferentially and represses the mar operon,
    directly validating the DNA-binding transcription-factor mechanism in a characterized branch. The
    Chromobacterium protein has the corresponding MarR-type winged-helix domain. Operator specificity,
    ligand response and complete functional competence of all branches are unresolved; antibiotic resistance
    is not implied by the generic TF function.
