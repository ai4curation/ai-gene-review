family_id: PANTHER:PTHR33164
family_name: TRANSCRIPTIONAL REGULATOR, MARR FAMILY
preferred_name: MarR-family DNA regulators
summary: MarR-related helix-turn-helix regulators recognize distinct promoters and respond to different
  ligands or redox states. The group includes antibiotic-response regulators and many regulators of other
  physiological systems.
functional_coherence: HETEROGENEOUS
coherence_reason: The Chromobacterium target's MarR-family placement supports a DNA-regulatory comparison.
  It does not establish antibiotic resistance, a particular ligand or the sign of regulation. Genomic
  context and direct operator/ligand evidence are needed for these narrower functions.
