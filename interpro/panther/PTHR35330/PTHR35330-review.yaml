family_id: PANTHER:PTHR35330
family_name: SIROHEME BIOSYNTHESIS PROTEIN MET8
preferred_name: Met8/SirC siroheme synthase family
summary: >-
  Met8 (S. cerevisiae MET8, S. pombe met8) is a bifunctional NAD-dependent precorrin-2 dehydrogenase
  and sirohydrochlorin ferrochelatase that makes siroheme, the cofactor of sulfite and nitrite reductases.
  Bacterial SirC catalyses only the dehydrogenase step.
functional_coherence: COHERENT
coherence_reason: >-
  All members are precorrin-2 dehydrogenases; the chelatase activity is specific to the bifunctional
  fungal Met8 enzymes.
