family_id: PANTHER:PTHR40042
family_name: HYPOTHETICAL MEMBRANE SPANNING PROTEIN
preferred_name: DUF1405 membrane proteins including LhaT
summary: DUF1405 membrane proteins include Bacillus subtilis LhaT, which transfers an acetyl group from
  an acetylated isoprenylglyceryl lipid carrier to the N-terminal amino group of diacylglyceryl lipoproteins.
  Specific LhaT activity is established for the B.subtilis168 member, while a tested B.anthracis homolog
  is inactive. Sequence-family membership alone does not establish this substrate-specific activity, carrier
  preference or extracellular carrier transport.
functional_coherence: UNKNOWN
coherence_reason: The exact P54392 member is experimentally characterized, but the available membership
  and biochemical evidence do not establish the activity of all family or SF1 members. A primary comparative
  homolog is inactive; its precise current accession and PAINT placement are not resolved here, so no
  universal grant with an invented member exception or loss node is made.
