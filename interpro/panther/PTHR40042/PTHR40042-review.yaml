  scope: UNRESOLVED
  scope_reason: 'P54392/ypjA in B.subtilis168 has directly demonstrated donor-agnostic N-acetyltransferase
    activity, retained in its gene review. Family-wide or SF1-wide transfer is not established: the primary
    reports an inactive B.anthracis homolog and sequence context alone is not a sufficient function test.
    The schema has no positive single-member scope, so this broader scope remains unresolved rather than
    converting a known member activity into a universal assertion. The assay used recombinant target in
    membrane preparations, a C20 carrier analogue and mixed acetyl donors; it does not establish purified-LhaT
    kinetics or native C35 preference.'
