notes: New manual family review for the lipoprotein audit. No family review existed in either the approved
  or published Ac-HepG commit, so this is not represented as approved reuse. Official UniProt and release19
  classification agree on P54392 membership. No ancestral PTN or lineage-wide loss is inferred; no raw
  PAINT assertion is altered. Detailed source and fetch provenance is recorded in analysis/module_audits/bacterial_lipoprotein_maturation/lhat-family-consultation/.
  The P54392 C-terminal YFL block maps to171–173 in sequence version1. Comparative evidence implicates
  this region, but an independently identified positive control with a mapped site is unavailable. It
  is therefore documented as sequence context rather than encoded as a sufficient or necessary residue-site
  rule.
