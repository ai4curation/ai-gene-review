  description:
  - text: This family of proteins includes members that are involved in various cellular
      processes such as the negative regulation of Toll-like receptor-mediated NF-kappa-B
      signaling, maintenance and self-renewal of pluripotent embryonic stem cells,
      DNA methylation regulation, spermatogenesis, oogenesis, and ubiquitination of
      target proteins leading to their degradation. Some family members function as
      substrate-recognition components of E3 ubiquitin-protein ligase complexes, while
      others may play roles in chromatin regulation and transcriptional repression,
      particularly in the context of retinoic acid signaling. The diverse functions
      suggest that this family has roles in cell differentiation, proliferation, and
      immune response regulation.
