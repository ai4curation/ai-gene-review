  name:
    name: Cation transport ATPase (P-type)
    short: Cation_transp_ATPase_P-type
  description:
  - text: The cation transport ATPase (P-type) family is responsible for the active
      transport of cations across cellular membranes, utilizing ATP hydrolysis to
      drive the exchange of ions such as sodium, potassium, and hydrogen. Members
      of the family create electrochemical gradients essential for nutrient transport,
      cellular homeostasis, and various physiological processes including gastric
      acidification and sperm motility. Some subunits are regulated by cardiac glycosides
      like ouabain and are involved in maintaining electrolyte balance in epithelial
      cells of the kidney, colon, and airway epithelium.
