preferred_name: Cytochrome P450 Family 4
summary: CYTOCHROME P450 FAMILY 4 (PANTHER:PTHR24291) is characterized in PANTHER PAINT across 9 ancestral
  PTN node(s) (PANTHER:PTN000669718, PANTHER:PTN000669780, PANTHER:PTN000757327, PANTHER:PTN001547811
  (+5 more)) with 26 IBD node assertion(s) and 0 term(s) carrying negated IRD/IKR branch blocks, covering
  endoplasmic reticulum membrane (GO:0005789, CC), ceramide biosynthetic process (GO:0046513, BP), intracellular
  membrane-bounded organelle (GO:0043231, CC), arachidonate monooxygenase activity (GO:0008391, MF) and
  19 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR24291 (CYTOCHROME P450 FAMILY 4) span 9 distinct ancestral
  PTN nodes (PANTHER:PTN000669718, PANTHER:PTN000669780, PANTHER:PTN000757327, PANTHER:PTN001547811, PANTHER:PTN001547817
  (+4 more)) with different molecular function assignments across clades (arachidonate monooxygenase activity
  (GO:0008391), alkane 1-monooxygenase activity (GO:0018685), beta-carotene 3-hydroxylase activity (GO:0010291),
  monooxygenase activity (GO:0004497) and 3 additional molecular function term(s)), indicating clade-level
  functional specialization across the family.
