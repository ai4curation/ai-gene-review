family_id: PANTHER:PTHR43876
family_name: UBIQUINONE BIOSYNTHESIS MONOOXYGENASE COQ6, MITOCHONDRIAL
preferred_name: Ubiquinone biosynthesis flavin monooxygenase family (COQ6/UbiH/UbiI/UbiF) and plant
  LCYB
summary: >-
  FAD-dependent class A monooxygenases. In ubiquinone biosynthesis, eukaryotic COQ6 hydroxylates
  C5 (and in some species C1) of the ring; bacterial UbiI/VisC (C5), UbiH (C1) and UbiF (C6) split
  these steps. SF15 holds plant lycopene beta-cyclase (LCYB), a carotenoid cyclase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Ring position and substrate differ by subfamily (C5 vs C1 vs C6 hydroxylation), and SF15 is a lycopene
  cyclase.
