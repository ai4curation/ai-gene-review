  name:
    name: Trans-sulfuration Enzymes
    short: Trans-sulfuration_enzymes
  description:
  - text: The trans-sulfuration enzymes family encompasses a group of enzymes involved
      in various biosynthetic pathways, including the production of amino acids and
      cyclic peptides. Members of this family catalyze gamma-replacement reactions
      to form L-cystathionine from O-succinyl-L-homoserine and L-cysteine, or gamma-elimination
      reactions to produce 2-oxobutanoate, succinate, and ammonia. Some enzymes within
      this family participate in the biosynthesis of antibiotics and psychoactive
      metabolites, such as terminal alkyne-containing amino acids and the psychoactive
      compounds ibotenic acid and muscimol. Others are involved in the biosynthesis
      of unguisins, which are gamma-aminobutyric acid-containing fungal cyclic heptapeptides.
      The family also includes alanine racemases that contribute to the production
      of D-alanine, a component of nonribosomal peptide synthetase pathways.
