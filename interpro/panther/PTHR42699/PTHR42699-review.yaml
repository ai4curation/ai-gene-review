family_id: PANTHER:PTHR42699
family_name: FAMILY NOT NAMED
preferred_name: Fungal cystathionine gamma-synthase (STR2/met3) family
summary: >-
  Fungal PLP-dependent cystathionine gamma-synthases condense O-acetylhomoserine with cysteine in
  forward transsulfuration (S. cerevisiae STR2, S. pombe met3). The subfamily also includes Amanita
  IboG2, a related enzyme of ibotenic acid biosynthesis.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  CGS activity holds for the fungal primary-metabolism members; the Amanita secondary-metabolism
  homolog has a different role.
