family_id: PANTHER:PTHR43272
family_name: LONG-CHAIN-FATTY-ACID--COA LIGASE
preferred_name: Long-chain acyl-CoA synthetase (ACSL) family
summary: >-
  AMP-forming acyl-CoA synthetases that activate long-chain fatty acids: animal ACSL1/3/4 and the
  bubblegum ACSBG enzymes, S. cerevisiae FAA1, FAA3 and FAA4 (SF83) and the peroxisomal FAA2 (SF33),
  plus mycobacterial FadD15. SF33 also contains carboxylic acid reductases (Car) and fungal acyl-CoA
  ligases from secondary metabolism.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Most subfamilies are long-chain acyl-CoA synthetases; SF33 mixes FAA2-type ligases with carboxylic
  acid reductases.
