  diverged_from_family: false
- subfamily_id: PANTHER:PTHR43272:SF33
  label: AMP-BINDING DOMAIN-CONTAINING PROTEIN-RELATED
  description: >-
    Mixed: FAA2, Arabidopsis LACS6, Dictyostelium FcsA, and bacterial carboxylic acid reductases
    (Car).
  diverged_from_family: true
  divergence_description: >-
    Carboxylic acid reductases in SF33 reduce acids to aldehydes and are not acyl-CoA synthetases.
