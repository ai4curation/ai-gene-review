family_id: PANTHER:PTHR48178
family_name: PEROXISOME BIOGENESIS FACTOR 2
preferred_name: PEX2 (RING-finger peroxin, peroxisomal ubiquitin ligase complex subunit)
summary: >-
  Family of PEX2 orthologs: integral peroxisomal membrane proteins with an N-terminal
  membrane region (five transmembrane segments in the structurally characterized fungal
  complex) and a C-terminal cytosolically exposed RING-HC zinc finger. Across
  eukaryotes, PEX2 assembles with the other two RING peroxins, PEX10 and PEX12, into a
  heterotrimeric E3 ubiquitin ligase complex in the peroxisomal membrane that doubles as
  a retrotranslocation channel for the PTS1 import receptor PEX5: the PEX2 RING (RF2)
  sits above the channel pore and monoubiquitinates the receptor's N-terminal cysteine
  to license ATP-dependent extraction by PEX1-PEX6, sustaining peroxisomal matrix
  protein import. The fetched member slice is uniformly PEX2 orthologs (subfamily SF1)
  from animals, fungi, amoebozoa, and plants, and loss of function in any of them
  disrupts peroxisome biogenesis (human PEX2 mutations cause Zellweger spectrum
  disorders, complementation group 10). Mammalian PEX2 has additional lineage-restricted
  roles as the E3 driving starvation-induced pexophagy and as a ROS-stabilized ligase
  that polyubiquitinates the lipase ATGL to downregulate lipolysis; these are not
  demonstrated outside mammals. Note the family boundary quirk: some fungal PEX2
  orthologs (e.g. Komagataella PEX2, Thermothelomyces PEX2) are classified not here but
  as subfamily SF4 of the PEX10 family PTHR23350, so PTHR48178 does not contain all
  PEX2 orthologs.
functional_coherence: COHERENT
coherence_reason: >-
  Every fetched member is a PEX2 ortholog with the same domain architecture and the same
  core role: RING E3 subunit of the peroxisomal PEX2-PEX10-PEX12 ubiquitin ligase/
  retrotranslocation complex acting in matrix protein import. The mammal-specific
  regulatory outputs (pexophagy induction, ATGL/lipolysis control) are clade-restricted
  extensions of the same molecular activity, not a divergence of the activity itself.
