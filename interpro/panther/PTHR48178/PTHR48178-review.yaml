node_assessments:
  # --- PTN008299004 is the single PAINT-curated node in the cached slice (taxon:32524, Amniota) ---
  - node_id: PANTHER:PTN008299004
    asserted_term:
      id: GO:0005778
      label: peroxisomal membrane
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20240213"
    seeds:
      - id: RGD:61814
      - id: UniProtKB:P28328
        label: Peroxisome biogenesis factor 2
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Correct and conservative. PEX2 is an integral peroxisomal membrane protein by
      direct experiment in human (PMID:12751901) and by structure in fungi
      (PMID:35768507), so every amniote descendant plausibly inherits the localization.
      If anything the node is placed shallower than the evidence allows: yeast, plant
      and fungal PEX2 orthologs are also peroxisomal membrane proteins, so a
      Eukaryota-level placement (as PAINT has done for the sibling PEX10 family
      PTHR23350) would be equally defensible and would serve the non-amniote members.
  - node_id: PANTHER:PTN008299004
    asserted_term:
      id: GO:0016593
      label: Cdc73/Paf1 complex
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20200618"
    seeds:
      - id: UniProtKB:P28328
        label: Peroxisome biogenesis factor 2
        organism: Homo sapiens (Human)
    assessment: WRONG_NODE
    assessment_reason: >-
      The sole seed is human PEX2's own IDA to GO:0016593 from PMID:18987311 - a paper
      about the parafibromin/PAF1 (RNA polymerase II-associated factor 1) transcriptional
      regulatory complex, not PEX2. The seed annotation is a homonym confusion between
      PEX2's historical synonym PAF1 (Peroxisome Assembly Factor 1, PMID:1546315) and
      the unrelated PAF1 transcription elongation factor. No member of this family has
      credible evidence for Cdc73/Paf1 complex membership; a peroxisomal membrane
      protein in a nuclear transcription elongation complex is also biologically
      incongruent. The seed IDA and this IBD (and hence the human IBA, reviewed as
      REMOVE with propagation_review root_cause SOURCE_BAD in the PEX2 gene review)
      should all be retracted. This is a seed-quality failure, not a placement-depth
      question, so no clade inherits it legitimately.
  - node_id: PANTHER:PTN008299004
    asserted_term:
      id: GO:0000038
      label: very long-chain fatty acid metabolic process
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20200618"
    seeds:
      - id: UniProtKB:P28328
        label: Peroxisome biogenesis factor 2
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Defensible placement with a term-indirectness caveat rather than a phylogenetic
      one. The seed is human mutant-phenotype evidence (PMID:9765053): loss of PEX2
      impairs VLCFA beta-oxidation because the beta-oxidation enzymes are no longer
      imported into peroxisomes. Amniote descendants do inherit this dependency, so the
      node is not misplaced; however the term reflects a downstream consequence of the
      import function, not an activity of PEX2 itself, and the human gene review keeps
      it as NON_CORE on those grounds. A future PAINT pass could reasonably drop it in
      favor of the direct process terms (GO:0016562/GO:0016558).
  - node_id: PANTHER:PTN008299004
    asserted_term:
      id: GO:0006635
      label: fatty acid beta-oxidation
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20200618"
    seeds:
      - id: UniProtKB:P28328
        label: Peroxisome biogenesis factor 2
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Same situation as GO:0000038 at this node: the seed evidence is real
      (beta-oxidation of VLCFA is lost in PEX2-mutant cells and restored with the gene,
      PMID:9765053) and the dependency holds across amniotes, but PEX2 does not
      catalyze beta-oxidation - the term is an indirect, phenotype-level consequence of
      defective matrix protein import and is reviewed as non-core on the human gene.
  - node_id: PANTHER:PTN008299004
    asserted_term:
      id: GO:0007031
      label: peroxisome organization
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20230112"
    seeds:
      - id: MGI:MGI:107486
      - id: UniProtKB:P28328
        label: Peroxisome biogenesis factor 2
        organism: Homo sapiens (Human)
    assessment: SOUND
    assessment_reason: >-
      Well supported: human PEX2 was cloned by complementation of defective peroxisome
      assembly in Zellweger fibroblasts (PMID:1546315) and mouse knockout evidence
      seeds the same node. As with GO:0005778, the function is demonstrably older than
      Amniota (yeast and plant pex2 mutants also fail to assemble functional
      peroxisomes), so the placement is conservative rather than wrong.

term_assessments:
  # What the human experimental record supports for future PAINT propagation.
  - assessed_term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The RING-HC domain and its position in the trimeric ligase complex are conserved
      family-wide; human PEX2 has direct IDA evidence (ubiquitination of PEX5/PMP70,
      PMID:27597759; of ATGL, PMID:34903883), and the fungal complex structure shows
      RF2 catalyzing receptor monoubiquitination (PMID:35768507). This is the family's
      core molecular function, yet no MF IBA currently exists - the clearest gap in the
      PAINT curation of this family. Safe to assert at least as deep as the
      animal-fungal ancestor, and plausibly for the whole family.
    supported_by:
      - reference_id: PMID:27597759
        supporting_text: >-
          the peroxisomal E3 ubiquitin ligase peroxin 2 (PEX2) is the causative agent
          for mammalian pexophagy.
      - reference_id: PMID:35768507
        supporting_text: >-
          We propose that the N terminus of a recycling receptor is inserted from the
          peroxisomal lumen into the pore and monoubiquitylated by RF2 to enable
          extraction into the cytosol
  - assessed_term:
      id: GO:0016562
      label: protein import into peroxisome matrix, receptor recycling
    scope: FAMILY_WIDE
    scope_reason: >-
      Receptor recycling is the conserved raison d'etre of the complex: human IDA
      (PMID:24662292), fungal structure and biochemistry (PMID:35768507), and classic
      yeast genetics all converge. Would be a sound family-wide IBD; currently the
      human gene carries it only as IDA.
    supported_by:
      - reference_id: PMID:35768507
        supporting_text: >-
          Recycling requires receptor modification by a membrane-embedded ubiquitin
          ligase complex comprising three RING finger domain-containing proteins
          (Pex2, Pex10 and Pex12)
  - assessed_term:
      id: GO:0000151
      label: ubiquitin ligase complex
    scope: FAMILY_WIDE
    scope_reason: >-
      Complex membership (PEX2-PEX10-PEX12) is structurally demonstrated in fungi
      (PMID:35768507) and biochemically supported in human and yeast; it is proposed as
      a NEW annotation in the human PEX2 gene review. Safe family-wide.
    supported_by:
      - reference_id: PMID:35768507
        supporting_text: >-
          thermophilic fungus Thermothelomyces thermophilus, which are highly
          homologous to the corresponding proteins in Saccharomyces cerevisiae and
          higher organisms
  - assessed_term:
      id: GO:0000425
      label: pexophagy
    scope: UNRESOLVED
    scope_reason: >-
      PEX2's rate-limiting E3 role in pexophagy is demonstrated only in mammalian cells
      (PMID:27597759: PEX2, but not PEX10 or PEX12, triggers NBR1-dependent pexophagy
      during amino acid starvation). Fungal pexophagy is mechanistically different
      (receptor-based, e.g. Atg30/Atg36) and there is no evidence that non-mammalian
      PEX2 orthologs serve this role, so the term must not be propagated family-wide;
      the enum offers no clade-level scope, hence UNRESOLVED with this explicit
      boundary: mammalian clade only.
    supported_by:
      - reference_id: PMID:27597759
        supporting_text: >-
          PEX2, but not PEX10 or PEX12, acts as the E3 ubiquitin ligase to selectively
          ubiquitinate peroxisomal membrane proteins to designate peroxisomes for
          autophagy-mediated degradation during amino acid starvation conditions.
  - assessed_term:
      id: GO:0050995
      label: negative regulation of lipid catabolic process
    scope: UNRESOLVED
    scope_reason: >-
      The ROS-sensing PEX2-ATGL-lipolysis axis (PMID:34903883) is demonstrated in
      mammalian cells and mice only; ATGL itself is animal-restricted. Not safe to
      propagate beyond mammals; recorded here so a future curator does not lift the
      human IDA to a deep node.
    supported_by:
      - reference_id: PMID:34903883
        supporting_text: >-
          PEX2 specifically poly-ubiquitinates lipolytic protein ATGL at the K92 site
          when ATGL distributes on the LD surface for proteasome-targeted degradation
          in different cell types.

