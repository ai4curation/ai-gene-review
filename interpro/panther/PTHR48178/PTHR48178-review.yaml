review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Written alongside the finishing pass on genes/human/PEX2/PEX2-ai-review.yaml. All
  node/term/seed/date tuples are verbatim from the cached PTHR48178-paint.tsv; member
  composition from the fetched PTHR48178-entries.csv slice (10 proteins of 3067; the
  family-wide claims about coherence rest on this slice plus the literature, and the
  second subfamily recorded in InterPro metadata is unassessed). The human gene is not
  strictly IBA-free - it receives the five Amniota-node IBAs assessed above - but the
  PAINT curation is inverted relative to the biology: the family's core molecular
  function (RING E3 ligase activity, receptor recycling, ligase complex membership) has
  no IBD anywhere despite deep conservation and structural demonstration, while the one
  complex-membership IBD that does exist (Cdc73/Paf1) is a homonym-confusion artifact
  seeded by the target's own miscited IDA and should be retracted. The 2020-vintage rows
  predate both the pexophagy/lipolysis literature and the 2022 cryo-EM structure; the
  family would benefit from a fresh PAINT pass. No residue_sites: the RING zinc ligands
  would be the natural site to curate, but positions were not verified against the
  sequences in this pass, and the schema's guidance is to omit rather than guess.
