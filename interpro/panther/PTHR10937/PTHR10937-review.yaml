family_id: PANTHER:PTHR10937
family_name: GLUCOSAMINE--FRUCTOSE-6-PHOSPHATE AMINOTRANSFERASE, ISOMERIZING
summary: GFAT enzymes couple glutamine hydrolysis to conversion of fructose-6-phosphate into glucosamine-6-phosphate,
  supplying the hexosamine biosynthetic pathway. Related sugar-isomerase domains also occur in glucosamine
  deamination and other reactions, so a broad structural grouping extends beyond the complete two-domain
  GFAT reaction.
functional_coherence: HETEROGENEOUS
coherence_reason: Full-length GFAT1/GFAT2-type proteins conserve the coupled glutaminase and sugar-isomerase
  reaction, whereas related deaminase branches perform different chemistry. The native Gfat1-PF isoform
  A8Y5A1 retains the isomerase region but only a small part of the glutaminase module, so catalytic capability
  is not uniform even among gene products assigned to a single subfamily.
subfamilies:
- subfamily_id: PANTHER:PTHR10937:SF0
  label: GLUTAMINE--FRUCTOSE-6-PHOSPHATE TRANSAMINASE (ISOMERIZING)
  description: Contains fly Gfat1-related proteins; full-length Gfat1 has a complete glutaminase/isomerase
    architecture, whereas the mapped A8Y5A1 Gfat1-PF isoform retains the C-terminal region and lacks most
    of the glutaminase module. Membership does not by itself establish the complete reaction for every
    isoform.
  representative_members:
  - id: UniProtKB:A8Y5A1
    label: glutamine--fructose-6-phosphate transaminase (isomerizing)
    gene_symbol: Gfat1
    organism: Drosophila melanogaster
    gene_review: genes/DROME/Gfat1/Gfat1-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0004360
    label: L-glutamine:D-fructose-6-phosphate transaminase (isomerizing) activity
  scope: UNRESOLVED
  scope_reason: 'The complete glutamine-dependent reaction is established for human GFPT1 and GFPT2 by
    structural and enzyme-kinetic studies (PMID:32019926; PMID:35229715), and thus is not exclusive to
    the fly-associated SF0. Within that SF0, however, benchmark A8Y5A1 is the native 434-residue Gfat1-PF
    isoform: the reproducible comparison retains only 40 of 299 glutamine-amidotransferase-domain residues
    while preserving the sugar-isomerase domains. This contradicts intrinsic execution of the complete
    two-module reaction by that exact protein, without contradicting the activity of full-length Gfat1.
    A safe scope therefore depends on both reaction branch and isoform/domain completeness; an unconditional
    subfamily grant cannot express it.'
  supported_by:
  - reference_id: PMID:32019926
    supporting_text: GFAT synthesizes d-glucosamine-6-phosphate (GlcN6P) from l-glutamine (l-Gln) and
      Frc6P, releasing l-glutamate (l-Glu)
  - reference_id: PMID:35229715
    supporting_text: Kinetic measurements confirmed that both proteins were fully functional and revealed
      different substrate affinities of GFPT2 compared to GFPT1
  - reference_id: file:genes/DROME/Gfat1/Gfat1-bioinformatics/RESULTS.md
    supporting_text: Only 40 of 299 residues of the annotated glutamine-amidotransferase domain remain
