family_id: PANTHER:PTHR10763
family_name: CELL DIVISION CONTROL PROTEIN 6-RELATED
preferred_name: Orc1/Cdc6 initiators and Sir3 silent-chromatin proteins
summary: >-
  PTHR10763 spans archaeal Orc1/Cdc6 proteins and eukaryotic Cdc6 and Orc1
  paralogs, whose shared AAA+ ATPase ancestry supports broad PAINT placements
  for nuclear origin-recognition and pre-replicative-complex biology. The S.
  cerevisiae Sir3 leaf descends from the ORC1 subfamily but has diverged into a
  silent-chromatin and nucleosome-binding protein; PAINT already blocks the
  origin recognition complex assertion on Sir3, and the DNA-replication-initiation
  IBD should be pruned at the same clade.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Most PTHR10763 members are Orc1/Cdc6 replication initiators, but the S.
  cerevisiae SIR3 branch is a neofunctionalized ORC1 derivative that acts in
  silent chromatin and in negative regulation of origin firing rather than as an
  ORC1/Cdc6 DNA-replication initiator.
reference_protein:
  id: UniProtKB:P54784
  label: Origin recognition complex subunit 1
  gene_symbol: ORC1
  organism: Saccharomyces cerevisiae
