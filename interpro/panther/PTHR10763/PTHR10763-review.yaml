        supporting_text: "PTHR10763\tPTN000080056\tGO:0003688\tF\tIBD\tfalse\tSGD:S000003730|SGD:S000004434|SGD:S000004530|UniProtKB:Q8I615\ttaxon:\t20240304"
      - reference_id: PMID:29795547
        supporting_text: >-
          both Sir2 and Sir3 bound to nucleosomes adjacent to euchromatic
          origins
