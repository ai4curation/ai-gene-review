    seeds:
      - id: SGD:S000003730
      - id: SGD:S000004434
      - id: SGD:S000004530
      - id: UniProtKB:Q8I615
    assessment: UNRESOLVED
    assessment_reason: >-
      This deep node is biologically sound for origin-recognition and Cdc6
      branches, but not every seed demonstrates binding to the origin DNA
      itself. The SIR3 seed reflects binding to nucleosomes adjacent to
      euchromatic origins rather than the ORC-type DNA-origin recognition named
      by GO:0003688, so this row needs a PAINT curator decision on term scope
      before this review can request a clean node move or loss.
    supported_by:
