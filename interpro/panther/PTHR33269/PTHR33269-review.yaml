    label: NADH-UBIQUINONE OXIDOREDUCTASE CHAIN 6
    description: >-
      The only subfamily populated in the fetched slice; it holds every fetched member,
      bacterial NuoJ (E. coli P0AFE0; P. putida KT2440 Q88FG9 by its UniProt PANTHER
      cross-reference), mitochondrial ND6, plastid NdhG and archaeal FpoJ. The official
      name refers to mitochondrial ND6 and should not be read as evidence that a member
      is mitochondrial. For the respiratory NDH-1 members the subfamily does not diverge
      from the family's core role (complex I membrane subunit contributing to coupled
      NADH:quinone oxidoreduction); the photosynthetic-type clades diverge in complex
      type and electron donor at the clade level within the subfamily, not as a
      separate subfamily.
