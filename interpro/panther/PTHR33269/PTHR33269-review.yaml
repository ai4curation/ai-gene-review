family_id: PANTHER:PTHR33269
family_name: NADH-UBIQUINONE OXIDOREDUCTASE CHAIN 6
preferred_name: Complex I / NDH-1 subunit J family (NuoJ / Nqo10 / mitochondrial ND6 / plastid NdhG)
summary: >-
  Small five-helix membrane subunit family of the proton-pumping NADH:quinone
  oxidoreductase superfamily: bacterial NuoJ/Nqo10, mitochondrial ND6, the plastid
  NdhG subunit of the chloroplast NDH complex and the FpoJ subunit of archaeal
  F(420)H(2) dehydrogenase. In bacterial NDH-1 (E. coli NuoJ) and mitochondrial
  complex I the subunit lies in the proximal membrane arm, forms with NuoK/ND4L the
  second half-channel of the E-channel proton pathway and borders the N/K/J/A proton
  channel; conserved residues are required for energy-coupled NADH:quinone
  oxidoreduction and proton translocation but not for assembly. Members have no
  redox cofactor and contribute to the activity of the complex they belong to.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members are structural/proton-pathway membrane subunits of complex I-type
  oxidoreductases, but the complexes differ: bacterial NDH-1 and mitochondrial
  complex I oxidise NADH and reduce ubiquinone/menaquinone, whereas the plastid NDH
  (NdhG) and cyanobacterial NDH-1 types accept electrons from ferredoxin and reduce
  plastoquinone, and FpoJ belongs to an F(420)H(2) dehydrogenase. The member inventory
  places all 53 fetched entries (bacterial NuoJ, mitochondrial ND6, plastid NdhG and
  archaeal FpoJ) in the single subfamily SF17, so the split is not expressed on the
  subfamily axis; PAINT handles it with a Cyanobacteriota IRD.
