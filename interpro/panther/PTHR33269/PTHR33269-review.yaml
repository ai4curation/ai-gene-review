    asserted_term:
      id: GO:0045271
      label: respiratory chain complex I
    evidence: IRD
    negated: true
    node_taxon:
      id: NCBITaxon:1117
      label: Cyanobacteriota
    paint_snapshot: "20240801"
    seeds:
      - id: PANTHER:PTN004990314
    assessment: LOSS_SUPPORTED
    assessment_reason: >-
      Stops the bacterial complex I term descending into cyanobacteria. GO:0045271 is
      defined as the complex at which the electrons of NADH enter the chain;
      cyanobacterial NDH-1 complexes (the ancestors of plastid NDH) lack the NuoE/F/G
      NADH-oxidising module and are fed from ferredoxin, reducing plastoquinone, so
      the loss is biologically appropriate. This reasoning rests on the term
      definition and general knowledge of cyanobacterial NDH-1; no cyanobacterial
      paper is cached here; a cached primary source on cyanobacterial NDH-1 subunit
      composition would make this verdict directly sourced.
    supported_by:
