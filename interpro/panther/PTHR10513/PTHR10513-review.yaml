family_id: PANTHER:PTHR10513
family_name: DEOXYNUCLEOSIDE KINASE
preferred_name: DCK/DGUOK/TK2 deoxyribonucleoside kinase family
summary: >-
  PTHR10513 contains ATP-dependent DCK/DGK-fold deoxyribonucleoside kinases and one
  derived respiratory-complex-I accessory branch. Human DCK (SF19) is a soluble
  cytosolic/nuclear enzyme that phosphorylates deoxycytidine, deoxyadenosine and
  deoxyguanosine. Human TK2 (SF24) and DGUOK (SF8) are mitochondrial-matrix salvage
  kinases with distinct substrate spectra, phosphorylating thymidine/deoxycytidine/
  deoxyuridine and deoxyguanosine/deoxyadenosine, respectively. The human NDUFA10 branch
  (SF15) has diverged from nucleoside kinase catalysis and instead contributes to
  respiratory complex I.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The DCK, TK2 and DGUOK branches retain deoxyribonucleoside kinase activity, although
  DCK is cytosolic/nuclear whereas TK2 and DGUOK act in the mitochondrial matrix and the
  PANTHER root is too coarse for the three paralogs' substrate preferences. The NDUFA10
  branch has lost the kinase activity; PAINT already records an IRD for GO:0019136 at
  PTN000828201 and adds respiratory-complex-I terms there. The TK2-node
  deoxyadenosine kinase IBD captures broad insect dNK activity but needs pruning from
  vertebrate TK2, and the mitochondrion IBD at PTN002236975 is correct for TK2 and
  DGUOK but needs pruning from the DCK SF19 branch.
