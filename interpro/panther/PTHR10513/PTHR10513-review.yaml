family_id: PANTHER:PTHR10513
family_name: DEOXYNUCLEOSIDE KINASE
preferred_name: Deoxynucleoside kinases and NDUFA10
summary: >-
  PTHR10513 contains the deoxyribonucleoside kinases of the dCK/dGK/TK2 type and NDUFA10, an accessory
  subunit of mitochondrial complex I that retains the kinase fold.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The kinases phosphorylate deoxyribonucleosides; NDUFA10 is a complex I subunit with no demonstrated
  kinase function.
node_assessments:
- node_id: PANTHER:PTN000828201
  asserted_term:
    id: GO:0019136
    label: deoxynucleoside kinase activity
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN000053758
    label: PTN000053758 (ancestral IBD node; IRD source)
  paint_snapshot: '20260828'
  node_taxon:
    id: NCBITaxon:2759
    label: Eukaryota
  assessment: LOSS_TOO_BROAD
  proposed_action:
    paint_action: MOVE_LOSS
    target_node_id: PANTHER:PTN000828202
  assessment_reason: >-
    PTN000828201 (42 leaves, all SF15) holds NDUFA10, the complex I accessory subunit, together with two
    Dictyostelium proteins (dgk and DICPUDRAFT_41960) and a Giardia protein. Dictyostelium dgk is a purine-specific
    deoxyguanosine kinase with measured kinetics (PMID:17448496), so the loss cannot sit at a node that
    includes it. NDUFA10 itself has no shown kinase function and the loss is right for it. The child node
    PTN000828202 (39 leaves) excludes both Dictyostelium proteins and the Giardia protein and holds the
    NDUFA10 orthologs; the loss belongs there.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10513/PTHR10513-paint.tsv
    supporting_text: "PTHR10513\tPTN000828201\tGO:0019136\tF\tIRD\ttrue"
  - reference_id: PMID:17448496
    supporting_text: deoxyguanosine kinase was also a purine-specific kinase and phosphorylated
