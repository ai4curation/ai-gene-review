  name:
    name: Leucine-rich repeat and fibronectin type-III domain-containing
    short: LRFN
  description:
  - text: The LRFN family proteins are involved in various cellular processes, primarily
      related to neural development and function. They act as cell adhesion molecules,
      mediating homophilic cell-cell adhesion in a calcium-independent manner, and
      are crucial for neurite outgrowth in hippocampal neurons. Members of this family
      are also implicated in the regulation and maintenance of excitatory synapses,
      often inducing the clustering of postsynaptic proteins. Some LRFN proteins enhance
      the cell surface expression of NMDA receptor subunits and may influence the
      redistribution of synaptic proteins to the cell periphery. The presence of a
      PDZ-binding motif in some family members suggests a role in protein-protein
      interactions at synapses. Additionally, certain LRFN proteins may have roles
      in axon guidance, phototransduction, and craniofacial and inner ear morphogenesis.
      The family includes proteins with leucine-rich repeat and fibronectin type III
      domains, which are characteristic structural features contributing to their
      functions.
