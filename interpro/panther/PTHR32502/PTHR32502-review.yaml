family_id: PANTHER:PTHR32502
family_name: N-ACETYLGALACTOSAMINE PERMEASE II COMPONENT-RELATED
preferred_name: PTS IIC/IID and downstream carbohydrate-enzyme superfamily
summary: This heterogeneous family combines membrane IIC/IID components of sugar phosphotransfer systems
  with downstream carbohydrate-metabolic proteins, including GatZ/KbaZ aldolase-support subunits and AgaS-related
  enzymes. IIC and IID are distinct partnered membrane roles, and their subfamilies include transporters
  with different sugar specificities. Escherichia coli ManY/ManZ and lactococcal PtnC/PtnD occupy different
  subfamily pairs. Soluble downstream-enzyme branches do not acquire PTS uptake roles merely because they
  share this broad evolutionary classification.
functional_coherence: HETEROGENEOUS
coherence_reason: Membrane sugar-uptake components and downstream aldolase-support/deaminase-related proteins
  occupy distinct branches; neither substrate-specific transport nor membrane location is universal.
