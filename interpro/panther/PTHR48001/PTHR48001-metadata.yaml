  name:
    name: Olfactory Receptor
    short: Olfactory_Receptor
  description:
  - text: The Olfactory Receptor Family is a group of proteins that function primarily
      as odorant receptors, detecting and transducing signals from various odorant
      molecules. These receptors belong to the G-protein coupled receptor 1 family,
      which is characterized by their seven transmembrane domains and their ability
      to activate G-proteins in response to ligand binding. Members of this family
      are involved in the sense of smell and can also play roles in other physiological
      processes such as sperm chemotaxis. Some members are described as putative taste
      receptors, suggesting a potential role in taste perception. The diversity of
      ligands recognized by these receptors underlies the complexity of olfactory
      perception in mammals.
