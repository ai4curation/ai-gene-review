subfamilies:
- subfamily_id: PANTHER:PTHR42885:SF2
  label: HISTIDINOL-PHOSPHATE AMINOTRANSFERASE
  description: >-
    Histidinol-phosphate aminotransferases (HisC, HAMAP MF_01023), the histidine pathway
    enzymes of bacteria, fungi and plants, including S. cerevisiae HIS5, S. pombe his3 and
    E. coli HisC. Of the 268 reviewed members, 233 are named histidinol-phosphate
    aminotransferase and 34 more are numbered or chloroplastic histidinol-phosphate
    aminotransferases. The one characterized divergent member is C. jejuni Cj1437c, a
    capsule-pathway dihydroxyacetone-phosphate transaminase (see the member exception below).
  representative_members:
  - id: UniProtKB:P07172
    gene_symbol: HIS5
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/HIS5/HIS5-ai-review.yaml
  - id: UniProtKB:P36605
    gene_symbol: his3
    organism: Schizosaccharomyces pombe
    gene_review: genes/SCHPO/his3/his3-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: file:genes/yeast/HIS5/HIS5-uniprot.txt
    supporting_text: PANTHER; PTHR42885:SF2; HISTIDINOL-PHOSPHATE AMINOTRANSFERASE; 1.
  - reference_id: file:genes/SCHPO/his3/his3-uniprot.txt
    supporting_text: PANTHER; PTHR42885:SF2; HISTIDINOL-PHOSPHATE AMINOTRANSFERASE; 1.
- subfamily_id: PANTHER:PTHR42885:SF1
  label: THREONINE-PHOSPHATE DECARBOXYLASE
  description: >-
    Eleven reviewed members: CobD/CobC L-threonine-O-3-phosphate decarboxylases (S. enterica
    CobD, Sinorhizobium and Pseudomonas aeruginosa CobC), the C. jejuni L-serine-phosphate
    decarboxylase Cj1436c, the Streptomyces rubellomurinus FrbH cytidylyltransferase /
    decarboxylase, and three M. tuberculosis-complex orthologs of Rv2231c (Rv2231c, MT2290,
    BQ2027_MB2256C), which have histidinol-phosphate aminotransferase activity.
  representative_members:
  - id: UniProtKB:P97084
    gene_symbol: cobD
    organism: Salmonella typhimurium LT2
  diverged_from_family: true
  divergence_description: >-
    Members decarboxylate phosphorylated amino acids instead of transaminating histidinol
    phosphate. CobD makes (R)-1-amino-2-propanol O-2-phosphate, the linker between the nucleotide
    loop and the corrin ring of cobalamin. Cj1436c makes ethanolamine phosphate for capsule
    modification, and FrbH decarboxylates a CMP-phosphonate intermediate. Rv2231c is the
    exception that retains histidinol-phosphate transaminase activity.
  supported_by:
  - reference_id: PMID:9446573
    supporting_text: >-
      CobD was shown to decarboxylate L-threonine O-3-phosphate to yield (R)-1-amino-2-propanol
      O-2-phosphate.
  - reference_id: PMID:34505775
    supporting_text: >-
      Cj1436 is found to catalyze the decarboxylation of l-serine phosphate to generate
      ethanolamine phosphate and CO2
  - reference_id: PMID:38698289
    supporting_text: We showed that M. tuberculosis Rv2231c is a conserved enzyme with HspAT activity.
  - reference_id: file:interpro/panther/PTHR42885/PTHR42885-entries.csv
    supporting_text: P97084,Threonine-phosphate decarboxylase
term_assessments:
- assessed_term:
    id: GO:0004400
    label: L-histidinol-phosphate:2-oxoglutarate transaminase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The histidine_biosynthesis module asserts this activity for fungal HisC (HIS5, his3), both in
    SF2. It is the defining activity of SF2 (HAMAP MF_01023 HisC members). It is not family-wide:
    SF1 and the unassigned members are mostly phospho-amino-acid decarboxylases, and the
    unassigned S. multivorans SMUL_1544 was shown to have no histidinol-phosphate
    aminotransferase activity. One SF1 lineage, M. tuberculosis Rv2231c and its two
    M. tuberculosis-complex orthologs, does have the activity. It is not added to the scope,
    because SF1 as a whole does not have it, and M. tuberculosis also has an SF2 HisC (P9WML7).
    Within SF2, C. jejuni Cj1437c is excepted.
  applicable_subfamilies:
  - id: PANTHER:PTHR42885:SF2
    label: HISTIDINOL-PHOSPHATE AMINOTRANSFERASE
  member_exceptions:
  - member:
      id: UniProtKB:Q0P8H7
      gene_symbol: Cj1437c
      organism: Campylobacter jejuni NCTC 11168
    exception_reason: >-
      Characterized as a PLP-dependent dihydroxyacetone-phosphate:L-glutamate transaminase that
      makes (S)-serinol phosphate for amidation of the capsular polysaccharide. Its authors
      predicted the transaminase chemistry from its closest characterized relative, HisC.
      The same genome encodes a separate HisC (Cj0317, Q9PII2, in PTHR43643:SF3), so
      Cj1437c is a capsule-pathway paralog and the histidine-pathway activity is not inferred
      for it.
    supported_by:
    - reference_id: PMID:34505775
      supporting_text: >-
        Cj1437 catalyzes the transamination of dihydroxyacetone phosphate to (S)-serinol
        phosphate in the presence of l-glutamate.
    - reference_id: file:interpro/panther/PTHR43643/PTHR43643-entries.csv
      supporting_text: Q9PII2,Histidinol-phosphate aminotransferase,protein,192222
  supported_by:
  - reference_id: PMID:8159167
    supporting_text: >-
      The his3 gene encodes the imidazole acetol phosphate transaminase enzyme (E.C.2.6.1.9),
      which is responsible for converting imidazole acetol-P to histidinol-P
  - reference_id: file:genes/yeast/HIS5/HIS5-uniprot.txt
    supporting_text: HAMAP; MF_01023; HisC_aminotrans_2; 1.
  - reference_id: PMID:31325159
    supporting_text: >-
      the CobD homolog SMUL_1544 of the organohalide-respiring epsilonproteobacterium
      Sulfurospirillum multivorans was characterized as a decarboxylase that produces
      ethanolamine O-phosphate (EA-P) from l-serine O-phosphate (l-Ser-P).
- assessed_term:
    id: GO:0000105
    label: L-histidine biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Follows the transaminase activity. SF2 HisC enzymes carry out the seventh step of
    histidine synthesis; fungal HisC mutants are histidine auxotrophs. SF1 and the unassigned
    decarboxylases work in cobalamin, norcobamide, capsule and antibiotic pathways. Cj1437c is
    excepted, as for the activity.
  applicable_subfamilies:
  - id: PANTHER:PTHR42885:SF2
    label: HISTIDINOL-PHOSPHATE AMINOTRANSFERASE
  member_exceptions:
  - member:
      id: UniProtKB:Q0P8H7
      gene_symbol: Cj1437c
      organism: Campylobacter jejuni NCTC 11168
    exception_reason: >-
      A capsular polysaccharide biosynthesis transaminase. Histidine synthesis in this genome
      uses the separate HisC Cj0317 (Q9PII2).
    supported_by:
    - reference_id: PMID:34505775
      supporting_text: >-
        Cj1437 catalyzes the transamination of dihydroxyacetone phosphate to (S)-serinol
        phosphate in the presence of l-glutamate.
    - reference_id: file:interpro/panther/PTHR43643/PTHR43643-entries.csv
      supporting_text: Q9PII2,Histidinol-phosphate aminotransferase,protein,192222
  supported_by:
  - reference_id: PMID:14190241
    supporting_text: >-
      Each of the histidine mutants of Saccharomyces cerevisiae has been correlated with a
      particular step in histidine biosynthesis.
  - reference_id: file:genes/SCHPO/his3/his3-uniprot.txt
    supporting_text: HAMAP; MF_01023; HisC_aminotrans_2; 1.
- assessed_term:
    id: GO:0048472
    label: threonine-phosphate decarboxylase activity
  scope: UNRESOLVED
  scope_reason: >-
    Shown for S. enterica CobD (SF1). It is not safe for SF1 as a whole: SF1 also holds the
    M. tuberculosis Rv2231c histidinol-phosphate aminotransferases, the FrbH
    cytidylyltransferase / decarboxylase, and the L-serine-phosphate decarboxylase Cj1436c,
    which is only weakly active on threonine phosphate. The unassigned SMUL_1544 is a
    serine-phosphate decarboxylase with secondary threonine-phosphate activity. Which branches of
    SF1 carry the activity cannot be settled from subfamily membership.
  supported_by:
  - reference_id: PMID:9446573
    supporting_text: >-
      CobD was shown to decarboxylate L-threonine O-3-phosphate to yield (R)-1-amino-2-propanol
      O-2-phosphate.
  - reference_id: PMID:38698289
    supporting_text: We showed that M. tuberculosis Rv2231c is a conserved enzyme with HspAT activity.
- assessed_term:
    id: GO:0030170
    label: pyridoxal phosphate binding
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterized member, whether transaminase or decarboxylase, is a fold-type I
    PLP-dependent enzyme with the class-II aminotransferase PLP-binding lysine. HisC members
    carry the PROSITE AA_TRANSFER_CLASS_2 PLP signature.
  supported_by:
  - reference_id: file:genes/yeast/HIS5/HIS5-uniprot.txt
    supporting_text: PROSITE; PS00599; AA_TRANSFER_CLASS_2; 1.
  - reference_id: PMID:9446573
    supporting_text: >-
      Computer analysis of the deduced amino acid sequence of CobD identified a consensus
      pyridoxal phosphate-binding motif.
  - reference_id: PMID:34505775
    supporting_text: >-
      Cj1436 and Cj1437 are anticipated to be pyridoxal phosphate (PLP) dependent enzymes.
