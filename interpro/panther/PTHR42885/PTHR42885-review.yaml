notes: >-
  PAINT: `just fetch-panther-paint PTHR42885` resolved 208 PTN nodes and found no node-level
  annotations, so there is no paint.tsv and no node_assessments. The HisC GO annotations on HIS5
  and his3 come from experimental, TAS and combined InterPro/UniRule routes, not from IBA. Counts
  (268 SF2, 11 SF1, 2 unassigned) are from the reviewed members in entries.csv. Bacterial HisC is
  split across PANTHER families: E. coli HisC (P06986) and most actinobacterial HisC sit in
  PTHR42885:SF2, while many other bacterial HisC, including P. putida hisC (Q88P86) and
  C. jejuni Cj0317, sit in PTHR43643:SF3. That is why the histidine_biosynthesis module anchors
  the HisC step on InterPro IPR005861 rather than on a PANTHER id.
