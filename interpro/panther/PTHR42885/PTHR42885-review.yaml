family_id: PANTHER:PTHR42885
family_name: HISTIDINOL-PHOSPHATE AMINOTRANSFERASE-RELATED
preferred_name: Histidinol-phosphate aminotransferase (HisC, class-II PLP aminotransferase) family
summary: >-
  Fold-type I (class-II aminotransferase) pyridoxal 5'-phosphate enzymes. SF2 is the
  histidinol-phosphate aminotransferase (HisC) subfamily that carries out the seventh step of
  histidine biosynthesis, transferring the amino group of L-glutamate to imidazole-acetol
  phosphate to give L-histidinol phosphate. It holds E. coli HisC, the fungal enzymes S.
  cerevisiae HIS5 and S. pombe his3, plant HISN6 proteins and most actinobacterial HisC. SF1 is a
  functionally mixed group of phospho-amino-acid decarboxylases and relatives: the CobD/CobC
  L-threonine-O-3-phosphate decarboxylases of cobalamin synthesis, the Campylobacter jejuni
  capsule L-serine-phosphate decarboxylase Cj1436c, the bifunctional cytidylyltransferase /
  decarboxylase FrbH of phosphonate antibiotic synthesis, and the Mycobacterium tuberculosis
  Rv2231c protein, which has histidinol-phosphate aminotransferase activity. Two reviewed members
  have no subfamily, including the Sulfurospirillum multivorans L-serine-phosphate decarboxylase
  SMUL_1544, which was shown to lack histidinol-phosphate aminotransferase activity. PAINT has
  placed no node-level annotation anywhere in this family, so no member receives an IBA from it.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family joins histidinol-phosphate transaminases (SF2) with PLP-dependent
  phospho-amino-acid decarboxylases (SF1 and unassigned members) that work in cobalamin,
  norcobamide, capsule and phosphonate antibiotic synthesis. Only PLP binding is shared by every
  characterized member. Histidinol-phosphate transaminase activity is the function of SF2, with
  one characterized SF2 paralog (Cj1437c, a dihydroxyacetone-phosphate transaminase) as an
  exception, and it also occurs in one SF1 lineage (mycobacterial Rv2231c).
