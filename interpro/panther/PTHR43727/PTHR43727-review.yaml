family_id: PANTHER:PTHR43727
family_name: DIAMINOPIMELATE DECARBOXYLASE
preferred_name: Group IV (fold-type III) PLP-dependent basic amine decarboxylase family
summary: >-
  Large bacterial, archaeal and plant family of pyridoxal 5'-phosphate-dependent
  decarboxylases of the beta/alpha-barrel (group IV, fold-type III) class. All
  members share the fold and the PLP chemistry, acting as obligate dimers whose
  two active sites are formed between the barrel domain of one subunit and the
  beta-barrel of the other, and all remove a carboxyl group alpha to an amine.
  The substrate is what differs, and it differs sharply. Most members, grouped
  in subfamily SF2, are meso-diaminopimelate decarboxylases (LysA, EC 4.1.1.20)
  that catalyse the last step of lysine biosynthesis; a smaller subfamily SF1
  holds the carboxynorspermidine/carboxyspermidine decarboxylases (NspC/CANSDC,
  EC 4.1.1.96) that complete the alternative polyamine pathway, plus the
  agmatine-series carboxyaminopropylagmatine decarboxylase of Synechocystis.
  Structural work on the SF1 enzymes traced the switch to a "specificity helix"
  in the beta-barrel domain, where the acidic residue that other members use to
  hold the distal amino group of their substrate is replaced by a leucine that
  packs against the aliphatic chain of norspermidine. The practical consequence
  for annotation is that the family's name and its PAINT node both describe SF2,
  while SF1 members decarboxylate polyamine precursors and are experimentally
  inactive on meso-diaminopimelate, lysine, arginine and ornithine.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Subfamily SF2 (LysA) decarboxylates meso-diaminopimelate in lysine
  biosynthesis; subfamily SF1 (NspC/CANSDC, and the Synechocystis CAPA
  decarboxylase) decarboxylates carboxylated polyamine precursors and has no
  detectable activity on meso-diaminopimelate, lysine or arginine. Only the fold
  and the PLP dependence are shared, so no substrate-specific term is safe at
  family level.
