      - id: UniProtKB:Q58497
        label: Diaminopimelate decarboxylase
        gene_symbol: lysA
        organism: Methanocaldococcus jannaschii (strain ATCC 43067 / DSM 2661)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      The placement is defensible for the bulk of the family: the four seeds are
      bacterial and archaeal LysA enzymes spanning Proteobacteria, Actinobacteria
      and Euryarchaeota, so diaminopimelate decarboxylase activity is reasonably
      inferred for their common ancestor and for subfamily SF2. The node is at or
      near the family root, however, so the term also descends to subfamily SF1,
      whose members are carboxy(nor)spermidine decarboxylases. The assayed Vibrio
      SF1 enzyme has no activity with meso-diaminopimelate, and the Synechocystis
      SF1 member likewise rejects it, so the SF1 branch needs an IRD to stop the
      term. The IBA row this node actually produces is removed in one SF1 gene
      review, Vibrio cholerae Q9KRL4. Pseudomonas putida KT2440 Q88IS0 carries
      the same GO term by a different route: a TreeGrafter IEA (GO_REF:0000118)
      grafted from PANTHER:PTN001691018, a node that does not appear in this
      family's paint.tsv, so PAINT does not expose it and this review does not
      assess it. That row is removed in the Q88IS0 review on its own grounds.
    affected_subfamilies:
      - id: PANTHER:PTHR43727:SF1
        label: CARBOXYNORSPERMIDINE_CARBOXYSPERMIDINE DECARBOXYLASE
    supported_by:
