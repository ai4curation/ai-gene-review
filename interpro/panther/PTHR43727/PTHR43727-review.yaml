notes: >-
  PAINT holds two IBD rows for this family, both at PTN000159906 and both
  describing the LysA subfamily; `just fetch-panther-paint PTHR43727` resolves
  203 nodes but only these two carry node-level annotations, and neither has a
  taxon recorded, so node_taxon is left unset rather than guessed. PANTHER also
  declares a subfamily SF3 with the same official name as SF2; no reviewed entry
  is classified there, so its membership could not be verified and it is not
  described or named as applicable to any term.
  The reference protein is Q9KRL4, an SF1 member rather than one of the LysA
  enzymes that give the family its name, because this review exists to serve the
  carboxyspermidine module and SF1 is the divergent group whose scope that module
  depends on: the LysA consensus is already well covered by the PAINT seeds, while
  SF1 is where the family-level judgement actually has to be made.
  The family is not bacterial and archaeal only: three reviewed entries are
  chloroplastic diaminopimelate decarboxylases, Oryza sativa Q6ZG77 and
  Arabidopsis thaliana Q949X7 (LYSA1) and Q94A94 (LYSA2), and all three are
  classified in SF2. Parsed with Python's csv module, the fetched entries CSV has
  54 rows splitting 7 SF1 / 47 SF2, so these plants are already inside the 47 SF2
  entries counted above, which is consistent with the summary calling this a
  bacterial, archaeal and plant family and with scoping diaminopimelate
  decarboxylase activity and lysine biosynthesis SUBFAMILY_ONLY to SF2: the plant
  enzymes do that same LysA chemistry. (Their protein names contain commas and are
  properly CSV-quoted; a naive comma split misreads those rows, which is what an
  earlier revision of this note wrongly described as a malformed file with plant
  members excluded. No count in this review depended on that split - the 7 and 47
  figures are the csv-parsed ones.) The
  module bacterial_carboxyspermidine_biosynthesis does not ground its
  decarboxylase step on this PANTHER family, whose name and PAINT node both
  describe LysA; it uses NCBIfam TIGR01047 (nspC) and InterPro IPR005730, which
  are specific to the carboxy(nor)spermidine decarboxylases, and cites subfamily
  SF1 only as the PANTHER-level marker of that group.
