term_assessments:
  - assessed_term:
      id: GO:0008836
      label: diaminopimelate decarboxylase activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Safe for the LysA subfamily SF2 only. SF1 members are experimentally
      inactive on meso-diaminopimelate, so the term must not be inherited there,
      whether by IBA from PTN000159906 or by any other transfer.
    applicable_subfamilies:
      - id: PANTHER:PTHR43727:SF2
        label: GROUP IV DECARBOXYLASE
    supported_by:
      - reference_id: PMID:19196710
        supporting_text: no activity with l -arginine, l -lysine, and meso -diaminopimelate
  - assessed_term:
      id: GO:0009085
      label: L-lysine biosynthetic process
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Follows the molecular function: lysine biosynthesis is the role of the SF2
      LysA enzymes. SF1 members work in polyamine biosynthesis and take no part
      in lysine synthesis; their organisms encode separate LysA proteins.
    applicable_subfamilies:
      - id: PANTHER:PTHR43727:SF2
        label: GROUP IV DECARBOXYLASE
    supported_by:
      - reference_id: PMID:20534592
        supporting_text: >-
          catalyze the
          decarboxylation of diverse substrates, essential for polyamine and lysine
          biosynthesis
  - assessed_term:
      id: GO:0016831
      label: carboxy-lyase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member of the family removes a carboxyl group from its substrate, so
      the carboxy-lyase parent holds throughout despite the substrate divergence.
      This is the term the SF1 gene reviews retain as their molecular function,
      there being no GO term yet for EC 4.1.1.96.
    supported_by:
      - reference_id: PMID:20534592
        supporting_text: >-
          catalyze the
          decarboxylation of diverse substrates, essential for polyamine and lysine
          biosynthesis
  - assessed_term:
      id: GO:0030170
      label: pyridoxal phosphate binding
    scope: FAMILY_WIDE
    scope_reason: >-
      The whole family is PLP-dependent, with the cofactor bound through a Schiff
      base to a conserved lysine in the beta/alpha-barrel domain. Confirmed
      biochemically for both subfamilies, including the Synechocystis SF1 member.
    supported_by:
      - reference_id: PMID:20534592
        supporting_text: >-
          Pyridoxal 5'-phosphate (PLP)-dependent basic amino acid decarboxylases from the
          beta/alpha-barrel-fold class (group IV) exist in most organisms
  - assessed_term:
      id: GO:0042803
      label: protein homodimerization activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The dimer is structural rather than regulatory in this fold: each active
      site is built from both subunits, so dimerization is a property of every
      member. Gene reviews keep it as non-core, since it is the architecture the
      catalytic activity depends on rather than a separate function.
    supported_by:
      - reference_id: PMID:20534592
        supporting_text: >-
          with the active sites formed between the beta/alpha-barrel domain of one subunit
          and the beta-barrel of the other
