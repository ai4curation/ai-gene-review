  gene_review: genes/VIBCH/nspC/nspC-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR43727:SF1
    label: CARBOXYNORSPERMIDINE_CARBOXYSPERMIDINE DECARBOXYLASE
    description: >-
      Carboxynorspermidine/carboxyspermidine decarboxylases (NspC, CANSDC,
      CASDC; EC 4.1.1.96), the terminal enzymes of the alternative polyamine
      pathway, together with the related Synechocystis carboxyaminopropylagmatine
      decarboxylase (EC 4.1.1.127). Seven of the family's reviewed entries are
      classified here; all are bacterial.
    representative_members:
      - id: UniProtKB:Q9KRL4
        label: Carboxynorspermidine/carboxyspermidine decarboxylase
        gene_symbol: nspC
        organism: Vibrio cholerae serotype O1 (strain ATCC 39315 / El Tor Inaba N16961)
        gene_review: genes/VIBCH/nspC/nspC-ai-review.yaml
      - id: UniProtKB:Q56575
        label: Carboxynorspermidine/carboxyspermidine decarboxylase
        gene_symbol: nspC
        organism: Vibrio alginolyticus
      - id: UniProtKB:A8FNH9
        label: Carboxynorspermidine/carboxyspermidine decarboxylase
        organism: Campylobacter jejuni subsp. jejuni (strain 81116 / NCTC 11828)
      - id: UniProtKB:P73562
        label: Carboxyaminopropylagmatine decarboxylase
        gene_symbol: sll0873
        organism: Synechocystis sp. (strain ATCC 27184 / PCC 6803 / Kazusa)
    diverged_from_family: true
    divergence_description: >-
      These enzymes act on carboxylated polyamines, not on basic amino acids.
      The purified Vibrio enzyme decarboxylates carboxynorspermidine (preferred
      about 20-fold) and carboxyspermidine but has no activity with arginine,
      lysine or meso-diaminopimelate, and the Synechocystis member prefers
      carboxyaminopropylagmatine while also accepting the two carboxypolyamines
      and likewise rejecting the amino acids. Structurally the divergence maps to
      the specificity helix, where an acidic substrate-binding residue is
      replaced by Leu314. Members of this subfamily must therefore not inherit
      the family's diaminopimelate decarboxylase or lysine biosynthesis terms.
    supported_by:
      - reference_id: PMID:19196710
        supporting_text: no activity with l -arginine, l -lysine, and meso -diaminopimelate
      - reference_id: PMID:20534592
        supporting_text: >-
          Specificity for
          different basic amino acids appears to arise primarily from changes in the
          position of, and amino acid replacements in, a helix in the beta-barrel domain
          we refer to as the "specificity helix."
      - reference_id: PMID:37878710
        supporting_text: decarboxylation of CAPA to form aminopropylagmatine
  - subfamily_id: PANTHER:PTHR43727:SF2
    label: GROUP IV DECARBOXYLASE
    description: >-
      The family consensus: meso-diaminopimelate decarboxylases (LysA,
      EC 4.1.1.20) catalysing the final step of lysine biosynthesis, together
      with a few further basic amino acid decarboxylases of the same fold. This
      subfamily holds the PAINT seeds for the family's diaminopimelate
      decarboxylase and lysine biosynthesis assertions, and 47 of the family's
      reviewed entries.
    representative_members:
      - id: UniProtKB:P00861
        label: Diaminopimelate decarboxylase
        gene_symbol: lysA
        organism: Escherichia coli (strain K12)
      - id: UniProtKB:P19572
        label: Diaminopimelate decarboxylase
        gene_symbol: lysA
        organism: Pseudomonas aeruginosa (strain ATCC 15692 / PAO1)
      - id: UniProtKB:P9WIU7
        label: Diaminopimelate decarboxylase
        gene_symbol: lysA
        organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
    diverged_from_family: false
    supported_by:
      - reference_id: PMID:20534592
        supporting_text: >-
          catalyze the
          decarboxylation of diverse substrates, essential for polyamine and lysine
          biosynthesis
