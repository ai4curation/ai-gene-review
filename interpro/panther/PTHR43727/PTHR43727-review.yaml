        supporting_text: no activity with l -arginine, l -lysine, and meso -diaminopimelate
      - reference_id: PMID:37878710
        supporting_text: decarboxylation of CAPA to form aminopropylagmatine
  - node_id: PANTHER:PTN000159906
    asserted_term:
      id: GO:0009085
      label: L-lysine biosynthetic process
    evidence: IBD
    negated: false
    paint_snapshot: "20260530"
    seeds:
      - id: UniProtKB:P9WIU7
        label: Diaminopimelate decarboxylase
        gene_symbol: lysA
        organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      The process assertion follows the molecular function at the same node and
      inherits the same problem: it is right for the LysA members of SF2, which
      catalyse the last step of lysine biosynthesis, and wrong for SF1, whose
      members act in polyamine biosynthesis instead. The single seed is a
      well-characterized M. tuberculosis LysA, which is adequate support for the
      SF2 clade; a short with/from list is not itself a weakness. SF1 needs the
      same IRD as the molecular-function row.
