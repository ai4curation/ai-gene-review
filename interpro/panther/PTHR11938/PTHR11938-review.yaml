- assessed_term:
    id: GO:0004359
    label: glutaminase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The N-terminal Ntn-type amidotransferase domain that hydrolyses glutamine to release ammonia into the
    tunnel is a feature of every GOGAT catalytic chain and is missing from the SF91 adrenodoxin reductases.
    This is the partial activity the module assigns to the large chain. The applicable subfamilies are
    the same GOGAT-named set as for glutamate synthase activity, with the uncharacterized SF134 and SF145
    left out for the same reason. GOGAT gates this site so that glutamine is not hydrolysed without an
    acceptor, and GOA carries the term on no GOGAT large chain; the scope records the domain's partial
    reaction, not an uncoupled glutaminase.
