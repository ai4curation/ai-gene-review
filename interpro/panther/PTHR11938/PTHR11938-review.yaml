- subfamily_id: PANTHER:PTHR11938:SF91
  clade_node_id: PANTHER:PTN000234268
  label: NADPH:ADRENODOXIN OXIDOREDUCTASE, MITOCHONDRIAL
  description: >-
    Mitochondrial adrenodoxin/ferredoxin-NADP+ reductase clade (FDXR, yeast Arh1). The PAINT nodes
    PTN000234268 and PTN000941138 are assigned to this subfamily in PANTHER's TreeGrafter table. UniProt's
    own PANTHER cross-references for human FDXR, yeast ARH1 and fission yeast arh1 point to PTHR48467,
    so no representative member is declared here.
  diverged_from_family: true
  divergence_description: >-
    Lacks the glutamine amidotransferase and synthase domains; acts as an NADPH-dependent reductase
    of adrenodoxin/ferredoxin feeding mitochondrial P450 enzymes and coenzyme Q biosynthesis.
