family_id: PANTHER:PTHR11938
family_name: FAD NADPH DEHYDROGENASE/OXIDOREDUCTASE
preferred_name: Glutamate synthase large chain and adrenodoxin reductase superfamily
summary: >-
  PANTHER tree that joins two functionally distinct groups of flavoproteins. The larger group is the
  glutamate synthase (GOGAT) catalytic chain: the bacterial NADPH-GOGAT large chain GltB (E. coli,
  P. putida KT2440), the Gram-positive and alpha-proteobacterial large chains (B. subtilis GltA,
  Azospirillum GltB) and the plant ferredoxin-dependent GOGATs. These proteins carry an N-terminal
  Ntn-type glutamine amidotransferase linked by an ammonia tunnel to an FMN/[3Fe-4S] synthase domain
  that reductively aminates 2-oxoglutarate. In the PANTHER classification files the full-length
  eukaryotic NADH-GOGATs (yeast GLT1, fission yeast glt1) also sit in this tree, although UniProt's
  HMM assignment places them in PTHR43100. The second group is the mitochondrial NADPH:adrenodoxin
  oxidoreductase clade (subfamily SF91, FDXR / Arh1), which reduces adrenodoxin/ferredoxin for
  mitochondrial P450 and coenzyme Q chemistry and has no amidotransferase activity.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Only a generic oxidoreductase activity is shared. Glutamate synthase and glutaminase (amidotransferase)
  activities belong to the GOGAT-named subfamilies (SF133, SF138, SF146, SF147, SF148, SF149),
  whereas the SF91 adrenodoxin reductase clade is a ferredoxin-NADP+ reductase involved in mitochondrial
  P450 electron supply. The donor of the GOGAT reaction also differs between subfamilies (NADPH for
  bacterial GltB/GltA-GltB pairs, NADH for the eukaryotic single-chain enzymes, ferredoxin for plant
  and cyanobacterial Fd-GOGAT), and the NAD(P)H donor is supplied by a separate small chain in the
  bacterial two-chain enzymes. Subfamily SF133 is named GLUTAMATE SYNTHASE (NADH) but holds NADPH-linked
  bacterial large chains and ferredoxin-dependent plant enzymes as well, so its name does not identify
  the electron donor.
