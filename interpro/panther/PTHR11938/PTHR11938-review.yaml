notes: >-
  Node-to-subfamily placements (AN0 = PTN000234102, AN1 = PTN000234342, AN131 = PTN000234343 in SF133;
  AN335 = PTN000234268 and AN337 = PTN000941138 in SF91) were read from PANTHER's
  PAINT_TreeGrafter_Annotations_TOTAL table (release 19 cache). The PANTHER classification files place
  yeast GLT1 and fission yeast glt1 in PTHR11938:SF133, while their UniProt cross-references say
  PTHR43100:SF1; the member index keeps both. Open maintainer PR #5077 carries an earlier templated version
  of this review that treats the family as coherent; this version replaces that judgement.
