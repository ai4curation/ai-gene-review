family_id: PANTHER:PTHR12400
family_name: INOSITOL POLYPHOSPHATE KINASE
preferred_name: 'Inositol polyphosphate kinase (IPK: IPMK, IP6K, ITPK) family'
summary: >-
  Soluble inositol polyphosphate kinases with a PxxxDxKxG catalytic motif. Inositol polyphosphate
  multikinase (S. cerevisiae ARG82, S. pombe arg82, human IPMK) makes IP4 and IP5 from IP3. IP6 kinases
  (S. cerevisiae KCS1, S. pombe SPCC970.08, human IP6K1-3) make the 5-diphosphoinositol pyrophosphate
  5-IP7. Animal ITPKA-C phosphorylate IP3 at the 3-position.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrate and product position differ by subfamily: IPMK (SF103, SF51), IP6K (SF21, SF47, SF73,
  SF40) and ITPK (SF55, SF106, SF4).
