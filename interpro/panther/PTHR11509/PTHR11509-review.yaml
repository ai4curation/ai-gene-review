family_id: PANTHER:PTHR11509
family_name: GLYCOPROTEIN HORMONE ALPHA CHAIN
preferred_name: Glycoprotein hormone alpha subunit family
summary: >-
  Secreted cystine-knot glycoprotein hormone alpha subunits (InterPro:IPR001545) comprising the
  common vertebrate pituitary/placental glycoprotein hormone alpha chain (CGA,
  PANTHER:PTHR11509:SF0) and the ancestral bilaterian glycoprotein hormone alpha-2 subunit
  (GPHA2/GPA2). In jawed vertebrates, CGA non-covalently heterodimerizes with four hormone-
  specific beta subunits (PANTHER:PTHR11515)—TSHB, FSHB, LHB, and primate CGB—to assemble
  thyroid-stimulating hormone (TSH), follicle-stimulating hormone (FSH), luteinizing hormone
  (LH), and chorionic gonadotropin (hCG), respectively, whereas GPHA2 heterodimerizes with
  GPHB5 to form thyrostimulin. Within each heterodimer, the alpha subunit makes direct contact
  with both the extracellular leucine-rich repeat domain and the hinge/transmembrane domain of
  the cognate GPCR (TSHR, FSHR, or LHCGR; PANTHER:PTHR24372) and is essential for receptor
  activation and signal transduction (GO:0038194, GO:0042699, and GO:0042700).
functional_coherence: COHERENT
coherence_reason: >-
  All members of PANTHER:PTHR11509 are secreted extracellular cystine-knot alpha subunits of
  heterodimeric glycoprotein hormones that enable hormone activity (GO:0005179) and initiate
  leucine-rich-repeat G protein-coupled receptor signaling pathways (GO:0007186). Within the
  jawed-vertebrate CGA clade (PTN002608947, PANTHER:PTHR11509:SF0), the single alpha chain is
  a shared obligate subunit of TSH, FSH, and LH (and hCG in primates), participating in the
  thyroid-stimulating hormone signaling pathway (GO:0038194), follicle-stimulating hormone
  signaling pathway (GO:0042699), and luteinizing hormone signaling pathway (GO:0042700).
