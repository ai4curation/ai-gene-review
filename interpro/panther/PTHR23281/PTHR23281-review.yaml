family_id: PANTHER:PTHR23281
family_name: MERLIN/MOESIN/EZRIN/RADIXIN
preferred_name: Merlin and ERM FERM-domain membrane-cytoskeleton adaptors
summary: PTHR23281 contains Merlin/NF2 tumor suppressors and canonical ERM proteins. Ezrin, radixin, and moesin
  are membrane-to-actin linkers with microvillar, apical, and endosomal roles, whereas Merlin lacks the canonical
  ERM C-terminal actin-binding site but retains N-terminal F-actin association and is specialized for growth-suppressive
  signaling through Hippo/YAP, Rac/PAK, and nuclear CRL4(DCAF1). PAINT correctly separates the metazoan ERM microvillus
  node and the Merlin node for Hippo/proliferation terms, while several ERM endosome-process terms remain placed
  at the shared Merlin/ERM ancestor and need IRD pruning on the Merlin branch.
functional_coherence: HETEROGENEOUS
coherence_reason: The family splits into canonical ERM linkers, whose C-terminal ERM tail binds actin and drives
  apical microvillus/endosomal processes, and Merlin/NF2 proteins, which lack that C-terminal site but preserve
  distinct N-terminal actin association and act primarily as tumor-suppressor signaling adaptors.
