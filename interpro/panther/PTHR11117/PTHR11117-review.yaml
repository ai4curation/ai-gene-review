- node_id: PANTHER:PTN000122012
  asserted_term:
    id: GO:0004776
    label: succinate-CoA ligase (GDP-forming) activity
  evidence: IBD
  paint_snapshot: '20260528'
  seeds:
  - id: RGD:619821
  - id: UniProtKB:O19069
  - id: UniProtKB:P0AGE9
  - id: UniProtKB:P53597
  - id: UniProtKB:Q51567
  - id: dictyBase:DDB_G0289325
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Changed from UNRESOLVED. The placement at the LUCA root is defensible: the seeds are animal and
    Dictyostelium alpha subunits, whose genomes encode a G-type beta subunit, and E. coli and P. aeruginosa
    SucD, whose single beta subunit accepts both nucleotides. But an alpha subunit contributes to GDP-forming
    activity only where its genome supplies a GDP-accepting beta subunit, and the beta-subunit tree
    (PTHR11815) shows that fungi lost the G-type paralog: 14 of the 15 fungal genomes there have only the
    A-type beta subunit. The fungal clade PTN000874203 therefore needs a loss annotation. The reviewed
    recipients divide as this predicts. Human SUCLG1, which pairs with SUCLG2, accepts the term as a core
    activity. E. coli SucD and P. putida SucD keep it (E. coli as a non-core secondary activity: the enzyme
    uses GTP with about a tenth of the efficiency it has with ATP). S. cerevisiae LSC1 removes the term (the
    yeast enzyme was assayed and does not use GTP) and S. pombe SPAC16E8.17c marks it over-annotated. PANTHER subfamilies do not separate the fungal branch (fungal and animal alpha subunits
    are both in SF2), so the pruning is recorded as member exceptions on the term assessment. Plant,
    stramenopile and excavate alpha subunits also inherit the term; their beta subunits lack the Gln marker of
    GDP specificity, but no assay was reviewed here, so they are left open.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11117/PTHR11117-paint.tsv
    supporting_text: "PTHR11117\tPTN000122012\tGO:0004776\tF\tIBD\tfalse"
  - reference_id: file:genes/yeast/LSC2/LSC2-bioinformatics/RESULTS.md
