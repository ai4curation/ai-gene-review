family_id: PANTHER:PTHR11117
family_name: SUCCINYL-COA LIGASE SUBUNIT ALPHA
preferred_name: Succinyl-CoA synthetase alpha subunit (SucD/LSC1/SUCLG1) family
summary: >-
  The alpha subunit of succinyl-CoA synthetase binds CoA and phosphate and carries the phosphohistidine
  intermediate of the TCA-cycle substrate-level phosphorylation step. It is nucleotide-agnostic: the beta
  subunit (PTHR11815) binds the nucleotide and sets ADP or GDP specificity. In the PANTHER tree the LUCA node
  (PTN000122012) holds archaeal and bacterial SucD and a single eukaryotic clade (PTN000122014), which
  branches from within the bacterial sequences, below a horizontal-transfer node, as sister to a
  proteobacterial clade. The PANTHER tree of the beta subunit instead groups the eukaryotic sequences with
  Archaea, so the two trees do not settle the origin of the eukaryotic enzyme. Most eukaryotes in the tree
  have one alpha gene (S. cerevisiae LSC1, S. pombe SPAC16E8.17c, human SUCLG1); half of the plant genomes
  in the tree have two or more. Because one alpha subunit serves whichever beta subunits a genome encodes,
  every nucleotide-specific term on this family depends on the beta-subunit repertoire of the lineage, which
  the alpha tree itself cannot show. The Trichomonas vaginalis alpha subunits are located in the
  hydrogenosome, not in a mitochondrion. The family also contains proteins that are not succinyl-CoA
  synthetase subunits: E. coli YahF and AllF (formerly FdrA; AllF is a subunit of oxamate
  carbamoyltransferase), an Aquifex aeolicus ortholog of the small subunit of citryl-CoA synthetase, and the
  alpha subunits of malate-CoA ligase and sulfoacetate-CoA ligase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF2, SF19 and SF23 are succinyl-CoA synthetase alpha subunits. SF24 (E. coli YahF and AllF, formerly FdrA,
  and Salmonella FdrA) is a divergent enterobacterial paralog group inside the PAINT tree. The Aquifex
  aeolicus leaf O67729, in SF2, is an ortholog of the citryl-CoA synthetase small subunit. The InterPro
  member list also places malate-CoA ligase and sulfoacetate-CoA ligase alpha subunits in SF2; these are not
  leaves of the PAINT tree.
