family_id: PANTHER:PTHR11117
family_name: SUCCINYL-COA LIGASE SUBUNIT ALPHA
preferred_name: Succinyl-CoA synthetase alpha subunit (SucD/LSC1/SUCLG1) family
summary: >-
  The alpha subunit of succinyl-CoA synthetase binds CoA and phosphate and carries the phosphohistidine
  intermediate of the TCA-cycle substrate-level phosphorylation step. It is nucleotide-agnostic: the beta
  subunit (PTHR11815) binds the nucleotide and sets ADP or GDP specificity. PANTHER roots the family at LUCA
  (PTN000122012), with archaeal and bacterial SucD and a single eukaryotic clade (PTN000122014) that branches
  from within the bacterial sequences as sister to the proteobacterial clade, consistent with a mitochondrial
  origin. Most eukaryotes have one alpha gene (S. cerevisiae LSC1, S. pombe SPAC16E8.17c, human SUCLG1);
  plants have two. Because one alpha subunit serves whichever beta subunits a genome encodes, every
  nucleotide-specific term on this family depends on the beta-subunit repertoire of the lineage, which the
  alpha tree itself cannot show. The family also contains E. coli FdrA/YahF and AllF, and the alpha subunits
  of malate-CoA ligase and sulfoacetate-CoA ligase, which are not succinyl-CoA synthetase subunits.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF2, SF19 and SF23 are succinyl-CoA synthetase alpha subunits. SF24 (FdrA, YahF, AllF) is a divergent
  enterobacterial paralog group, and the InterPro member list places malate-CoA ligase and sulfoacetate-CoA
  ligase alpha subunits in SF2.
