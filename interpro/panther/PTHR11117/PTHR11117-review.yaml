- node_id: PANTHER:PTN000122012
  asserted_term:
    id: GO:0004776
    label: succinate-CoA ligase (GDP-forming) activity
  evidence: IBD
  paint_snapshot: '20260528'
  seeds:
  - id: RGD:619821
  - id: UniProtKB:O19069
  - id: UniProtKB:P0AGE9
  - id: UniProtKB:P53597
  - id: UniProtKB:Q51567
  - id: dictyBase:DDB_G0289325
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    GDP-forming activity placed at the LUCA alpha-subunit node. Nucleotide specificity is not a
    property of the alpha subunit: the nucleotide-binding site is in the N-terminal ATP-grasp
    domain of the beta subunit (PMID:10353839), and animal ATP- and GTP-specific enzymes share one
    alpha subunit and differ in their beta subunits (PMID:9765291). Whether an alpha subunit
    contributes to GDP-forming activity therefore depends on which beta partners exist in the
    organism. The term holds for animals (GTP-specific beta clade PTN000929335 in PTHR11815) and for
    bacteria with dual-specificity enzymes (E. coli and P. aeruginosa seeds), and dictyBase has an
    IDA for the Dictyostelium alpha. It fails in Fungi (node PTN000874203, 19 IBA recipients in
    QuickGO, 2026-11-10): S. cerevisiae succinyl-CoA ligase uses ATP but not GTP (PMID:9874242), and
    the only fungal beta subunits (LSC2, SPCC1620.08) inherit only ADP-forming activity. LSC1 and
    S. pombe SPAC16E8.17c both remove the term, and both are member exceptions to the GDP-forming
    term assessment below. Minimum fix: an IKR NOT for
    GO:0004776 at PTN000874203. Viridiplantae (PTN000122078, 66 recipients) is a likely second loss,
    since plant SCS is described as ATP-forming, but no plant nucleotide-specificity assay was
    checked here. A more principled fix would keep nucleotide specificity on the beta family, where
    PAINT already models it, rather than at the alpha-family root.
  supported_by:
  - reference_id: PMID:10353839
    supporting_text: It was concluded that the nucleotide-binding site is located in the N-terminal domain of the beta-subunit.
  - reference_id: PMID:9765291
    supporting_text: Highly ATP- and GTP-specific isoforms of succinyl-CoA synthetase in pigeon incorporate the same alpha-subunit, but different beta-subunits
  - reference_id: PMID:9874242
    supporting_text: The yeast succinyl-CoA ligase was shown to utilize ATP but not GTP for succinyl-CoA synthesis
