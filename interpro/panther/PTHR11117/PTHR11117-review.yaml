- node_id: PANTHER:PTN000122012
  asserted_term:
    id: GO:0004776
    label: succinate-CoA ligase (GDP-forming) activity
  evidence: IBD
  paint_snapshot: '20260528'
  seeds:
  - id: RGD:619821
  - id: UniProtKB:O19069
  - id: UniProtKB:P0AGE9
  - id: UniProtKB:P53597
  - id: UniProtKB:Q51567
  - id: dictyBase:DDB_G0289325
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Placement at the LUCA node is defensible: the seeds are animal and Dictyostelium alpha subunits, whose
    genomes encode a G-type beta subunit (the Dictyostelium seed scsA, P36967, has an IDA for this term from
    PMID:8448193; the Dictyostelium G-type beta gene scsB, Q869S7, has no experimental annotation for the activity: a HAMAP-derived name, an IEA and the PAINT IBA only), and
    E. coli and P. aeruginosa SucD, whose single beta subunit accepts both nucleotides. But an alpha subunit
    contributes to GDP-forming activity only where its genome supplies a GDP-accepting beta subunit, and
    three branches below the node do not meet that condition.
    First, the fungal clade PTN000874203. The 15 fungal genomes in the PANTHER tree (14 Dikarya and the
    chytrid Batrachochytrium dendrobatidis) have an A-type beta gene and no G-type beta gene, and the
    S. cerevisiae enzyme uses ATP but not GTP. The clade-level loss rests on one assayed species plus this
    gene census, so it is a proposal for PAINT to test and not an established loss for every fungus. The
    loss is not a property of fungi as a whole: Mortierellomycota, Basidiobolus and Rozella keep a
    SUCLG2-type beta gene with Gln at position 20, so a loss at PTN000874203 must not be read as applying to
    sequences from those lineages. Within Dikarya one Taphrinomycotina species, Saitoella complicata, also
    has a Gln20 SUCLG2-type entry (A0A0E9NQG5); it groups with the Mortierellomycota genes only weakly, so
    vertical retention, transfer and contamination are not distinguished and its origin is unresolved.
    Saitoella is not in the PANTHER tree; its alpha subunit would be expected to fall inside PTN000874203, in the same
    subphylum as S. pombe, so the proposed loss needs that case settled before it is applied to
    Taphrinomycotina as a whole.
    Second, the enterobacterial clade PTN001671414 (SF24), whose members are not succinyl-CoA synthetase
    subunits (E. coli AllF is an oxamate carbamoyltransferase subunit by assay).
    Third, the Aquifex aeolicus leaf O67729, inferred from sequence identity to be the small subunit of
    citryl-CoA synthetase.
    The reviewed recipients divide as this predicts. Human SUCLG1, which pairs with SUCLG2, accepts the term
    as a core activity. E. coli SucD and P. putida SucD keep it (E. coli as a non-core secondary activity:
    the enzyme uses GTP with about a tenth of the efficiency it has with ATP). S. cerevisiae LSC1 removes
    the term (the yeast enzyme was assayed and does not use GTP), and S. pombe SPAC16E8.17c marks it
    over-annotated, because the S. pombe enzyme has not been assayed. PANTHER subfamilies do not separate
    the fungal branch (fungal and animal alpha subunits are both in SF2), so the pruning is recorded as
    member exceptions on the term assessment.
    Other lineages inherit the term with uneven support. The plant clade PTN000122078 (72 leaves) has Pro
    at position 20 of its beta subunits, and the one plant enzyme assay found, a partially purified tobacco
    preparation, reports a specific requirement for ATP (PMID:20925657); the term is not supported for
    plants and a second loss should be considered. The Blastocystis enzyme (alpha subunit B3FHT4, which is
    not a leaf of the tree) shows no detectable activity with GTP (PMID:18452512), although its beta subunit
    has Gln at position 20. The term is supported for Dictyostelium, whose purified enzyme uses GTP
    (PMID:7771809) and forms GTP from GDP (PMID:8240297); the assays are on the enzyme and are not
    assigned to one of the two Dictyostelium beta genes. It is plausible for the Trichomonas vaginalis alpha subunits, because T. vaginalis
    hydrogenosomes have GDP-dependent as well as ADP-dependent activity (PMID:1898409), though which of the
    three paralog pairs is responsible is unknown. Trypanosomatid, stramenopile and archaeal alpha subunits
    remain open.
    PAINT seeds this term with bacterial SucD (P0AGE9, Q51567) at the alpha LUCA node, but the beta tree has
    no matching seed from E. coli SucC, which has experimental evidence for the same activity
    (PMID:10353839). Bacterial SucD therefore receives a GDP-forming IBA and bacterial SucC does not.
