family_id: PANTHER:PTHR11117
family_name: SUCCINYL-COA LIGASE SUBUNIT ALPHA
preferred_name: Succinyl-CoA synthetase alpha subunit (SucD/LSC1) family
summary: >-
  The alpha subunit of succinyl-CoA synthetase carries the phosphohistidine intermediate of the TCA-cycle
  substrate-level phosphorylation step. The beta subunit sets the nucleotide (ADP or GDP) specificity.
  The family contains bacterial SucD, S. cerevisiae LSC1 and S. pombe SPAC16E8.17c, and also E. coli
  FdrA (YahF), which is not a succinyl-CoA synthetase subunit.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF2, SF19 and SF23 are succinyl-CoA synthetase alpha subunits. FdrA (SF24) is a divergent paralog
  of unknown function.
