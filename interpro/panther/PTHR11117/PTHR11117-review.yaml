notes: >-
  Re-reviewed on 2026-11-11 from an evolutionary perspective, together with PTHR11815. The PANTHER tree
  (release 19) was read node by node; every node id cited here that is not in the PAINT slice (PTN000874203,
  PTN004231559, PTN008961326) is emitted by the analysis script into
  genes/yeast/LSC2/LSC2-bioinformatics/results.yaml under panther_tree_nodes. The eukaryotic clade sits below a horizontal-transfer node
  (PTN004231559) as sister to Proteobacteria. Two leaves look like artefacts and were ignored: a Nematostella
  vectensis sequence grouped with Pseudomonas aeruginosa inside Gammaproteobacteria, and two Helianthus
  annuus sequences outside the root node. Human SUCLG1 (P53597) and E. coli SucD (P0AGE9), the main seeds
  for the nucleotide-specific terms, were reviewed afterwards and their actions agree with the node verdicts.
  The E. coli review also marks GO:0046777 protein autophosphorylation as over-annotated: the phosphohistidine
  is a catalytic intermediate, common to every alpha subunit of the family, and should not be read as an
  autophosphorylation process if it is ever proposed for propagation.
