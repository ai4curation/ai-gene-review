review_status: COMPLETE
reviewed_by: claude-code
review_date: '2026-11-12'
notes: |-
  Re-reviewed on 2026-11-11 from an evolutionary perspective, together with PTHR11815. The PANTHER tree (release 19) was read node by node; the node ids PTN000874203, PTN004231559, PTN008961326, PTN008512606, PTN008961318 and PTN008982090, which are not in the PAINT slice, are emitted by the analysis script into genes/yeast/LSC2/LSC2-bioinformatics/results.yaml under panther_tree_nodes. Node ids PTN000122097, PTN000122078, PTN004231608, PTN008512620, PTN002254979, PTN008961328 and PTN008961335 were read from the PANTHER release 19 treeinfo service on 2026-11-12 and are not in results.yaml. The eukaryotic clade sits below a horizontal-transfer node (PTN004231559) as sister to Proteobacteria. Three leaves look like artefacts and were ignored: a Nematostella vectensis sequence grouped with Pseudomonas aeruginosa inside Gammaproteobacteria, and two Helianthus annuus sequences (SF25, PTN008961335) outside the LUCA node. Human SUCLG1 (P53597) and E. coli SucD (P0AGE9), the main seeds for the nucleotide-specific terms, were reviewed afterwards and their actions agree with the node verdicts. The E. coli review also marks GO:0046777 protein autophosphorylation as over-annotated: the phosphohistidine is a catalytic intermediate, common to every alpha subunit of the family, and should not be read as an autophosphorylation process if it is ever proposed for propagation.

  Retrospective audit corrections (2026-11-12).
  Node verdicts changed. At PTN000122012, GO:0009361, GO:0004775 and GO:0006099 went from SOUND to NEEDS_PRUNING, because the SF24 clade PTN001671414 and the Aquifex aeolicus leaf O67729 are leaves of the PAINT tree, carry these IBAs and are not succinyl-CoA synthetase subunits; GO:0006099 also reaches the hydrogenosomal Trichomonas vaginalis clade. At PTN000122014, GO:0005739 went from SOUND to NEEDS_PRUNING for the Trichomonas vaginalis clade PTN008961326, which the earlier text noted and left unreviewed; the beta-subunit family already had NEEDS_PRUNING for the same organism. GO:0004776 at PTN000122012 stays NEEDS_PRUNING, now with the SF24 clade and the Aquifex leaf as further branches.
  Statements corrected. The earlier text said that fungi lost the G-type beta paralog. That holds for the 15 fungal genomes in the PANTHER tree and not for the kingdom: Mortierellomycota, Basidiobolus and Rozella keep a SUCLG2-type gene, and the ascomycete Saitoella complicata has a Gln20 SUCLG2-type entry of unresolved origin. The earlier text left plant, stramenopile and excavate alpha subunits open because no assay had been reviewed; the tobacco (PMID:20925657), Blastocystis (PMID:18452512), Trichomonas vaginalis (PMID:1898409) and Dictyostelium (PMID:7771809) assays are now cited, and Blastocystis B3FHT4 is a member exception for GO:0004776. E. coli FdrA and AllF were counted as two proteins and are one (Q47208). SF19 and SF23 were described as pan-plant classes and are Brassicaceae and Solanaceae clades. The summary said plants have two alpha genes; 20 of the 40 plant genomes in the tree have one. The earlier notes called PTN000122012 the root; it is the LUCA node, and the tree root is PTN008961318. The statement that the tree topology is consistent with a mitochondrial origin was dropped from the summary, because the PANTHER tree of the beta subunit groups eukaryotes with Archaea.
  Sequence identities quoted for the Aquifex leaf (O67729 against Q75VW6 and P0AGE9; O67547 against P0AGE9) and for the Trichomonas leaves (A2DUL5 against P53401, A0A8U0WP19 against P53400, A0A8U0WPT0 against P53399: 309 of 309, 309 of 309 and 308 of 309 residues) are local BLOSUM62 alignments of the UniProt sequences made on 2026-11-12; they are not stored in a committed analysis. The Aquifex identities are given as rounded ranges because the value depends on the alignment settings and on whether gap columns are counted: an independent global alignment (identical residues over aligned columns) gave 84.6% and 38.1% for O67729 and 63.0% for O67547.
  For report to PAINT. An IRD is needed at PTN001671414 for GO:0004775, GO:0004776, GO:0006099 and GO:0009361: E. coli AllF (Q47208) and YahF (P77187) and Salmonella Q8ZR75 carry these succinyl-CoA synthetase IBAs. The Aquifex leaf PTN000122097 (O67729) carries the same four IBAs. The Trichomonas vaginalis clade PTN008961326 needs an IRD for GO:0005739. The malate-CoA ligase alpha subunit P53595 and the sulfoacetate-CoA ligase alpha subunit E5Y8P7 are not tree leaves and receive the LUCA-node terms as TreeGrafter IEAs through PTN008512606, which a PAINT loss annotation cannot stop.
