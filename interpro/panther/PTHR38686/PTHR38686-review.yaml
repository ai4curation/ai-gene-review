notes: The module bacterial_lipoprotein_maturation grounds its (optional, lineage-restricted) Lnt step
  on this family with E. coli and P. putida representatives. The cached member inventory contains no B. subtilis or other Firmicutes member, consistent with the absence of the diderm N-acylation step there. The Ppm1 domain terms (GO:0009247, GO:0004582)
  are left unscoped here because no PANTHER subfamily separates the fusions, so a selector on this family
  must not claim them. PANTHER's own HMM classification files place O53493 in PTHR43398:SF1 (the Ppm1/DPM1
  family), whereas UniProt's PANTHER cross-reference and the member inventory place it in PTHR38686:SF1;
  both placements are defensible for a two-domain fusion, which is why the cross-family PAINT rows surface
  in this family's file.
