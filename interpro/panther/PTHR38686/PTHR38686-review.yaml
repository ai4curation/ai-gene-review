review_status: COMPLETE
reviewed_by: codex
review_date: '2026-11-07'
notes: >-
  The prior 2026-11-02 review made a substantive chemistry and seed-provenance objection to the
  GO:0050126 mapping, and correctly distinguished Ppm1 fusion-domain activities from standalone
  Lnt. The earlier 2026-11-07 characterization of that reasoning as an unsupported inference from
  GOA absence was inaccurate and is superseded by this round1 clarification. The remaining
  uncertainty concerns exact PAINT descendant/domain scope, not whether missing GOA alone
  establishes a lineage or whether all conceivable secondary activities have been excluded.
  The glycolipid and dolichyl-phosphate terms remain UNRESOLVED: their O53493 fusion seed has
  relevant glycosyltransferase evidence, which cannot be assigned to standalone Lnt domains.
  Thus those terms differ from the NLP1/AguB amidase row, whose named seeds are different proteins
  in a neighboring family. No ancestral assertion payload, node placement or loss is changed.
  Official release-19 PANTHER places O53493 in PTHR43398:SF1, while UniProt places it in
  PTHR38686:SF1; both source-specific domain assignments are retained without inventing a
  descendant path. Absence of canonical Lnt does not exclude alternative N-acylation in Bacillota.
  See round1/family-consultation for the original-versus-published judgment comparison,
  current ontology and independently retrieved seed identity records.
