  assessment: UNRESOLVED
  assessment_reason: The original chemistry and seed-provenance objection remains valid. The same
    PTN000557706 assertion occurs in PTHR43674 and names Arabidopsis NLP1/CPA (AT2G27450,
    Q8VYF5) and P. aeruginosa AguB (Q9I6J8), whose official records place them in PTHR43674:SF2.
