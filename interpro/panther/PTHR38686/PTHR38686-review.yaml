    The positive mapping onto Lnt is therefore unsupported. However, PTN000557706 is absent
    from the limited PTHR38686 tree cache, so the cross-family row alone does not establish
    its descendant set or demonstrate a wrong ancestral placement. Keep the node UNRESOLVED
