    instead specifies acyl-CoA transfer to lysyl N6 and does not describe this chemistry; the precise
    Lnt substrate reaction remains a separate proposed term. Fusion proteins retain this Lnt-domain role
    without making their Ppm1 activity family-wide.
  supported_by:
