    transfer from the N-carbamoylputrescine hydrolysis supported for NLP1/AguB seeds in
    PTHR43674. This is a substantive chemistry and source-identity objection, not an argument
    from missing GOA rows. Retain UNRESOLVED because the scope of PTN000557706 cannot be
    recovered from the limited Lnt tree, rather than because every hypothetical secondary
    activity must be excluded. NOT_APPLICABLE means the mapping is unsafe for any member;
    the available domain and seed evidence does not establish that categorical family-wide
    exclusion. Neither this unresolved scope nor the frozen PAINT row grants amidase activity
    to standalone Lnt proteins. Resolve the original node's descendant/domain context before
    making a definite family mapping or pruning decision.
