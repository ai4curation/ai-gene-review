notes: 'Prior review notes recorded cross-family Ppm1 assignments. The 2026-11-07 audit supersedes their
  unsupported inference that absence from GOA establishes node placement, and their implication that absence
  of Lnt excludes N-acylation in Bacillota.


  2026-11-07: Inspected frozen entries, PAINT rows and cached tree descendants; see family-consultation
  evidence and tree-inspection.json. Official labels and every ancestral node/term/evidence/date/seed
  payload are retained. Family-level scope describes conserved chemistry, not guaranteed cross-species
  rescue or identical native pathways. No new PAINT assertion or evolutionary loss is inferred. Official
  release-19 PANTHER classification assigns O53493 to PTHR43398:SF1, while its acquired UniProt record
  assigns PTHR38686:SF1. Both domain assignments are retained as source-specific evidence for the fusion;
  neither establishes the unresolved PAINT descendant paths.'
