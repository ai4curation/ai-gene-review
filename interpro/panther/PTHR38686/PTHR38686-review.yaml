family_id: PANTHER:PTHR38686
family_name: APOLIPOPROTEIN N-ACYLTRANSFERASE
preferred_name: Lnt apolipoprotein N-acyltransferase family
summary: Lnt enzymes transfer a phospholipid acyl chain to the free N-terminal amino group of diacylglyceryl-modified
  apolipoproteins. Characterized enzymes contain a membrane domain and an extracytoplasmic nitrilase-like
  catalytic domain. Some actinobacterial proteins, including M. tuberculosis Ppm1, combine an Lnt domain
  with a distinct polyprenol-phosphate mannose-synthase domain; other actinobacterial members are standalone
  Lnt proteins. The additional fusion-domain activity is not a general Lnt function. Other bacterial N-acylation
  systems are not defined by this family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The conserved Lnt domain supports membrane N-acyltransferase chemistry, but some proteins
  add a distinct Ppm1 glycosyltransferase domain. The resolved Lnt root PTN002214718 contains all 25 cached
  leaves, including E. coli P23930. Three additional PAINT nodes are not resolved in this cached tree
  and also occur in other family slices; their exact propagation paths remain unresolved rather than disproven
  from absent GOA annotations.
