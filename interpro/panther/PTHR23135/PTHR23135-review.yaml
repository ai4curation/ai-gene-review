  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node itself is well placed: 32 leaves, essentially the bacterial MurE clade, seeded by the
    purified and crystallised E. coli enzyme and by the M. tuberculosis ortholog, and the DAP-specific
    term is right for most of it. What the placement cannot see is that third-residue specificity is
    decided by a C-terminal recognition motif, not by position in the tree, so the clade also contains
    L-lysine-adding enzymes that should not receive a meso-DAP term. Streptococcus pneumoniae R6 MurE
    (Q8CWQ5, leaf PTN001898754) is the clear case: at the position corresponding to Arg417 of the
    E. coli recognition motif, where every DAP-adding member checked in this review carries arginine, it
    carries asparagine (motif DDPN against E. coli DNPR), and its organism builds an L-lysine stem
    peptide. Thermotoga maritima Q9WY79 (leaf PTN000566409) is a second candidate, named an
    LD-lysine-adding enzyme, but it retains the arginine, so the motif does not settle it and this review
    does not propose an action there. An IKR at PTN001898754, keyed on the residue site recorded here, is
    the minimal fix; the DAP term stays at the node for the rest of the clade. The Ricinus communis leaf
    inside this clade is already handled by the IRD assessed below.
