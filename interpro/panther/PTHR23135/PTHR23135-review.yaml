notes: >-
  Member counts and subfamily assignments are from PTHR23135-entries.csv (212 SF4, 5 SF18, 3 SF7); clade
  membership, the 101-leaf tree and the identities of the single-leaf nodes are from the PANTHER tree for
  this family, where PTN004610266 is the Ricinus communis B9T905 leaf, PTN001898754 the Streptococcus
  pneumoniae R6 Q8CWQ5 leaf and PTN000566409 the Thermotoga maritima Q9WY79 leaf. The motif positions in
  the residue site were obtained by global pairwise alignment (BLOSUM62) of each member to P22188, and
  the controls make them re-checkable. Items for upstream attention: the PANTHER name of SF4 describes a
  chloroplastic minority of its members and invites exactly the specificity and compartment errors this
  review documents; B9T905, the target of the PTN004610266 IRD, is no longer an active UniProtKB entry;
  and the stereospecificity of Thermotoga maritima Q9WY79 deserves a direct test, since it would show
  whether the recognition motif has exceptions. No MurT or cyanophycin-synthetase publication is cached
  in this repository, so SF7 and SF18 are described from PANTHER's own names, the member inventory and
  the tree, with no functional claim of this review's own.
