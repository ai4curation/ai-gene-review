  description: >-
    The MurE subfamily, 212 of the family's 220 members, and functionally mixed in three ways at once.
    It contains the meso-DAP-adding enzymes (E. coli P22188, M. tuberculosis P9WJL3, Pseudomonas putida
    Q88N81, Bacillus subtilis Q03523, Listeria Q8Y5L9), the L-lysine-adding enzymes of the Bacillota
