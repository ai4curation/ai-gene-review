family_id: PANTHER:PTHR23135
family_name: MUR LIGASE FAMILY MEMBER
preferred_name: MurE third-residue ligases with the MurT and cyanophycin-synthetase branches
summary: >-
  ATP-dependent Mur-ligase-superfamily enzymes grouped around MurE, which adds the third residue of the
  peptidoglycan stem peptide to UDP-N-acetylmuramoyl-L-alanyl-D-glutamate. Which residue that is depends
  on the organism, not on the family: enzymes of Escherichia coli, Mycobacterium tuberculosis, Bacillus
  subtilis and the pseudomonads add meso-diaminopimelate, while those of Staphylococcus aureus,
  Streptococcus, Enterococcus and other Bacillota add L-lysine, and the selection is made by a
  C-terminal recognition motif rather than by overall similarity. Alongside MurE the family holds two
  further branches of the same fold: MurT, the subunit that with GatD amidates the D-glutamate of lipid
  II to iso-glutamine, and cyanophycin synthetase CphA of cyanobacteria. Streptophyte plants contribute
  a large clade of plastid-targeted MurE homologs, which in mosses belong to a functioning plastid
  peptidoglycan pathway and in angiosperms have been repurposed toward chloroplast development.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Three distinct reactions sit in this family and a fourth role is derived: MurE stem-peptide ligation,
  MurT lipid II amidation (PANTHER:PTHR23135:SF7), cyanophycin synthesis (PANTHER:PTHR23135:SF18), and
  the chloroplast-development function of angiosperm MurE homologs. Worse for propagation, the
  heterogeneity is not resolved by the subfamily axis: PANTHER:PTHR23135:SF4 contains the meso-DAP-adding
  E. coli MurE (P22188) and the L-lysine-adding Staphylococcus aureus MurE (Q2FZP6) together, and its
  official name refers to a chloroplastic homolog, so neither the family nor that subfamily predicts
  third-residue specificity, compartment or pathway. Only the generic ligase term is safe family-wide;
  the specific activities have to be decided per member, by the residue site recorded in this review,
  and the plant-specific terms by the PAINT clade that holds the streptophyte leaves.
