  assessment: SOUND
  assessment_reason: >-
    This is the right assertion at the right node, and the generality is deliberate rather than lazy.
    PTN000566337 is the root of the family's 101-leaf tree, spanning MurE of both third-residue
    specificities, MurT, cyanophycin synthetase and the plant homologs, and the four seeds were chosen
    across that span: a meso-DAP-adding MurE, a second DAP-adding MurE, an L-lysine-adding MurE and a
    MurT. All of them form amide bonds at the expense of ATP, so the shared claim is ATP-dependent
    ligase activity and nothing narrower; any more specific term placed here would be wrong for part of
    the clade. Recipients that have their own experimental evidence refine it downward, which is the
    expected division of labour between a root node and a leaf annotation.
