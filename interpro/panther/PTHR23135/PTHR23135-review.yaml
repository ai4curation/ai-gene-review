term_assessments:
- assessed_term:
    id: GO:0016874
    label: ligase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The only activity statement that is safe for every member. MurE, MurT and cyanophycin synthetase all
    form amide bonds using ATP, and PAINT asserts exactly this at the family root with seeds drawn from
    both MurE specificities and from MurT. Anything more specific has to be scoped to a clade or decided
    per member, because the subfamily axis does not separate the three reactions and, within SF4, does
    not separate the two MurE specificities either.
  supported_by:
  - reference_id: file:interpro/panther/PTHR23135/PTHR23135-paint.tsv
    supporting_text: "PTHR23135\tPTN000566337\tGO:0016874\tF\tIBD\tfalse"
  - reference_id: PMID:11124264
    supporting_text: 'UDP-N-acetylmuramoyl-l-alanyl-d-glutamate:meso-diaminopimelate ligase is a
      cytoplasmic enzyme that catalyzes the addition of meso-diaminopimelic acid to nucleotide precursor
      UDP-N-acetylmuramoyl-l-alanyl-d-glutamate in the biosynthesis of bacterial cell-wall peptidoglycan.'
- assessed_term:
    id: GO:0008765
    label: UDP-N-acetylmuramoylalanyl-D-glutamate-2,6-diaminopimelate ligase activity
  scope: RESIDUE_DETERMINED
  determined_by_site: dap_recognition_arg
  scope_reason: >-
    Third-residue specificity is not predicted by family or subfamily membership here, so it cannot be
    granted at either level: PTHR23135:SF4 holds the meso-DAP-adding E. coli MurE and the L-lysine-adding
    S. aureus MurE together, and the subfamily's official name refers to a chloroplastic homolog that
    does neither in the bacterial sense. What decides it is the recognition motif: members carrying the
    arginine of the E. coli DNPR motif are the meso-DAP-adding enzymes, and members substituting it are
    not. Use the site, not the classification, and treat the stem-peptide composition of the organism as
    the independent check. The corresponding PAINT row at PTN000566406 is assessed NEEDS_PRUNING for the
    same reason.
  supported_by:
  - reference_id: PMID:11124264
    supporting_text: the structural determinant responsible for the selection of the amino acid to be
      added to the nucleotide precursor was identified
  - reference_id: file:ECOLI/murE/murE-uniprot.txt
    supporting_text: Is also able to use many meso-diaminopimelate analogs as substrates, although much
      less efficiently, but not L-lysine.
- assessed_term:
    id: GO:0047482
    label: UDP-N-acetylmuramoyl-L-alanyl-D-glutamate-L-lysine ligase activity
  scope: RESIDUE_DETERMINED
  determined_by_site: dap_recognition_arg
  scope_reason: >-
    The mirror image of the meso-DAP term, and decided by the same site read in the inverse sense: the
    L-lysine-adding members are those that substitute the arginine of the recognition motif (S. aureus
    DNPA, E. faecalis DDPA, S. pneumoniae DDPN) and whose organisms carry L-lysine at the third position
    of the stem peptide. No subfamily can carry this term, since the L-lysine enzymes share SF4 with the
    meso-DAP ones, and the family-level term must stay the generic ligase activity. One caveat is
    recorded in the site description: Thermotoga maritima Q9WY79 is named a lysine-adding enzyme while
    retaining the arginine, so for members like it the motif is not sufficient and organism-level
    evidence is needed.
  supported_by:
  - reference_id: PMID:11124264
    supporting_text: the structural determinant responsible for the selection of the amino acid to be
      added to the nucleotide precursor was identified
- assessed_term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    No scope the schema offers is accurate, and saying so is more useful than forcing one. The process
    is right for the bacterial MurE members whatever their third-residue specificity, and for MurT, which
    acts on lipid II; it is wrong for cyanophycin synthetase, and it is wrong for the angiosperm MurE
    homologs, whose mutant phenotype is a chloroplast-development defect and whose genomes lack much of
    the Mur set. Those groups cut across the subfamilies: the angiosperm homologs sit in SF4 with the
    bacterial enzymes. The clade-level statements are the usable ones: PTN000566406 for the bacterial
    enzymes, PTN008591326 for the plant clade, and the IRD at PTN004610266 for the one plant leaf
    misplaced inside the bacterial clade.
  supported_by:
  - reference_id: PMID:18036201
    supporting_text: These results suggest that AtMurE is functionally divergent from the bacterial and
      moss MurE proteins.
  - reference_id: PMID:41351887
    supporting_text: many angiosperm genomes, including Arabidopsis, have only MurE, Ddl, MraY, and MurG
      genes, which may have been repurposed by exaptation
