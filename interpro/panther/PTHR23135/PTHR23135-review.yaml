residue_sites:
- site_id: dap_recognition_arg
  label: Arginine of the meso-diaminopimelate recognition motif
  description: >-
    E. coli MurE carries a four-residue meso-diaminopimelate recognition motif at 414-417 (DNPR), which
    UniProt annotates both as a motif and as part of the meso-DAP binding site, and which the product
    complex identified as the determinant that selects the third residue. Its last position, Arg417, is
    the one that tracks specificity in the alignment: every meso-DAP-adding member checked here keeps
    the arginine (M. tuberculosis 451, P. putida KT2440 414, B. subtilis 411, Listeria 410, and the
    plastid enzymes of Physcomitrium 509 and Arabidopsis 655), whereas the L-lysine-adding enzymes
    substitute it (Staphylococcus aureus 409 Ala, giving DNPA; Enterococcus faecalis 428 Ala, DDPA;
    Streptococcus pneumoniae 407 Asn, DDPN). The correlation is informative but not absolute, which is
    why the requirement below is recorded as CONTRIBUTES rather than REQUIRED: Thermotoga maritima
    Q9WY79, which UniProt names an LD-lysine-adding enzyme, retains the arginine at its position 404
    (DDPR), and no mutagenesis of Arg417 is available in the cached literature. Positions in other
    proteins were obtained by global pairwise alignment to P22188 and are stated in each protein's own
    numbering; the controls below make every one of them checkable against the current UniProt sequence.
