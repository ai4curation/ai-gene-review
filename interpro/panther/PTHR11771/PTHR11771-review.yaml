family_id: PANTHER:PTHR11771
family_name: LIPOXYGENASE
preferred_name: Lipoxygenases
summary: >-
  PTHR11771 contains the non-heme iron lipoxygenases that dioxygenate polyunsaturated fatty acids. Epidermal
  lipoxygenase-3 (ALOXE3) acts mainly as a hydroperoxide isomerase in epidermal barrier formation, yet
  keeps a dioxygenase activity that needs strong activation.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Dioxygenase chemistry is shared; ALOXE3 has shifted to hydroperoxide isomerase activity.
node_assessments:
- node_id: PANTHER:PTN000206222
  asserted_term:
    id: GO:0016702
    label: >-
      oxidoreductase activity, acting on single donors with incorporation of molecular oxygen, incorporation
      of two atoms of oxygen
  evidence: IRD
  negated: true
  seeds:
  - id: PANTHER:PTN000206105
    label: PTN000206105 (ancestral IBD node; IRD source)
  paint_snapshot: '20260528'
  node_taxon:
    id: NCBITaxon:32525
    label: Theria
  assessment: LOSS_CONTRADICTED
  proposed_action:
    paint_action: REMOVE_LOSS
  assessment_reason: >-
    PTN000206222 is the therian ALOXE3 clade (12 leaves, SF184), which carries a PAINT IBD for hydroperoxy
    icosatetraenoate isomerase activity. ALOXE3 acts mainly as a hydroperoxide isomerase, but with enough
    hydroperoxide activator it has a genuine dioxygenase activity, oxygenating arachidonic acid and a
    synthetic fatty acid (PMID:20921226; PMID:20923767). The activity is secondary and needs strong activation,
    but it is measured directly and is mechanistically part of the lipoxygenase cycle, so a loss annotation
    is contradicted; the isomerase IBD already records the main function.
