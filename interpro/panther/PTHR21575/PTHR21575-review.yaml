family_id: PANTHER:PTHR21575
family_name: PROTEIN HID1
preferred_name: HID1-family Golgi and secretory-pathway proteins
summary: HID1-family proteins organize Golgi-associated membrane traffic. Mammalian HID1 is a peripheral
  Golgi protein with N-terminal myristoylation, and a fission-yeast homolog contributes to Golgi organization;
  specialized dense-core-vesicle functions occur in metazoan cells.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Direct mammalian localization and biochemical experiments identify HID1 as a peripheral
  membrane protein associated with medial/trans-Golgi and cytosol, rather than the multipass topology
  suggested by hydrophobicity prediction (PMID:21337012). Comparative phylogeny and fission-yeast genetics
  support a conserved relationship to Golgi organization, including disruption of Golgi stacks in the
  tested mutant (PMID:40899782). Dense-core-vesicle neurosecretion is a metazoan specialization, not a
  universal fungal function.
