family_id: PANTHER:PTHR31193
family_name: TRANSMEMBRANE PROTEIN C9ORF91
summary: TMEM268-family proteins contain a conserved DUF4481-associated membrane-protein architecture.
  In human gastric cancer cells, TMEM268 binds integrin beta4 and helps maintain integrin-associated adhesion
  machinery; its conserved biochemical activity and the corresponding role of fly CG18507 are unresolved.
functional_coherence: UNKNOWN
coherence_reason: Human TMEM268 interacts through its C terminus with ITGB4; knockout increases ITGB4
  ubiquitin-mediated degradation and destabilizes ITGB4 and filamin A (PMID:30361615). This supports a
  protein-stability/adhesion mechanism in the tested cells, not an intrinsic ubiquitin-ligase or transport
  activity. Fly CG18507 shares the family/domain grouping but differs in length and membrane architecture,
  and no evidence identifies ITGB4 as its conserved partner. Functional coherence is unknown beyond the
  membrane-protein scaffold because the demonstrated mammalian mechanism is not yet established across
  the family.
