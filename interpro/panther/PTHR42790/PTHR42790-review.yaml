family_id: PANTHER:PTHR42790
family_name: AMINOTRANSFERASE
preferred_name: Fold-type I (subgroup I) aromatic/aminoadipate aminotransferases and MocR-type GntR regulators
summary: >-
  A PLP-dependent fold-type I family that, in PANTHER 19, combines two kinds of protein. The
  enzymes include the fungal aromatic aminotransferases I and II (S. cerevisiae ARO8 and ARO9 and
  their orthologs, including three S. pombe paralogs), the metazoan mitochondrial
  kynurenine/2-aminoadipate aminotransferase KAT II/AADAT, bacterial valine-pyruvate
  aminotransferase AvtA, the Thermus 2-aminoadipate transaminase LysN and fungal and archaeal
  aromatic aminotransferases. The rest are bacterial MocR-type GntR transcription regulators:
  an N-terminal winged-helix DNA-binding domain fused to a C-terminal aminotransferase-like
  PLP-binding domain. Examples are E. coli YdcR and YjiR, B. subtilis YcxD, YisV and YdfD,
  Salmonella PtsJ, S. aureus NorG and many Pseudomonas, Clostridium and Bacillus paralogs.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Two divergences. (1) The enzymes do not share one specific activity. ARO8 (SF21) is the
  biosynthetic 2-oxoglutarate-dependent aromatic and 2-aminoadipate aminotransferase. ARO9 (SF2)
  is the inducible catabolic enzyme that uses pyruvate or phenylpyruvate as acceptor and carries
  all of the yeast kynurenine aminotransferase activity. AADAT/KAT II (SF19) is a broad-specificity
  mitochondrial kynurenine/aminoadipate aminotransferase. AvtA (SF4) is a valine-pyruvate
  aminotransferase. Only the generic transaminase activity (GO:0008483) is common to them. (2) The
  MocR-type regulators (SF6, SF7, SF9, SF17, SF20, and PtsJ and NorG inside SF19) are DNA-binding
  transcription factors that use PLP as an effector; no transaminase activity has been shown for
  them, and the related B. subtilis GabR (a different PANTHER family) showed none. SF19, named for
  AADAT, mixes the metazoan AADATs with bacterial and archaeal enzymes and with the PtsJ and NorG
  regulators, so it is not a functional unit.
