notes: >-
  Module use. The ehrlich_pathway module selects SF2 (ARO9; GO:0047312, GO:0080098, GO:0047299)
  and SF21 (ARO8; GO:0008793), which matches this review. The phenylalanine_tyrosine_biosynthesis
  module selects the whole family PTHR42790 for GO:0008793 with no required_function, which would
  also pick up ARO9, AADAT, AvtA and the MocR regulators; SF21 is the correct selector. The
  lysine_catabolism_saccharopine module selects the whole family for AADAT GO:0047536; SF19 is
  also mixed, so the AADAT node PTN000922977 or a required_function GO:0047536 filter would be
  needed. PANTHER version: the PANTHER 19 species files and the PAINT GAF place the E. coli,
  B. subtilis and Pseudomonas regulators in PTHR42790 (SF6/SF7/SF9/SF17/SF20), but current
  UniProt cross-references put E. coli YdcR/YjiR, B. subtilis YcxD/YisV/YdfD and Salmonella PtsJ
  in PTHR46577 (HTH-TYPE TRANSCRIPTIONAL REGULATORY PROTEIN GABR), the family of B. subtilis
  GabR. S. aureus NorG remains PTHR42790:SF19 in UniProt. No IRD/IKR rows for this family's
  nodes in .cache/panther/IBD.gaf. Of the S. pombe members, only SPAC56E4.03 is used by a module
  (via a PomBase GO-CAM). None of the three S. pombe paralogs has a gene review yet.
  Cross-check: the AADAT review marks its InterPro2GO GO:0008483 row over-annotated because the
  generic parent is uninformative beside the specific aminoadipate and kynurenine transaminase
  activities, not because it is wrong; this is compatible with the SF19 scope here.
