family_id: PANTHER:PTHR42716
family_name: L-ASPARTATE OXIDASE
preferred_name: L-aspartate oxidase (NadB) family
summary: >-
  FAD-dependent L-aspartate oxidases that oxidize L-aspartate to iminoaspartate,
  using O2 or fumarate as electron acceptor, as the first reaction of de novo NAD+
  biosynthesis from L-aspartate. The family is related to the flavoprotein
  subunits of fumarate reductase and succinate dehydrogenase. Reviewed members in
  the release used here all fall in subfamily SF2 and span bacteria (E. coli NadB,
  B. subtilis NadB, P. putida NadB), archaea and plant chloroplast enzymes;
  PANTHER labels SF2 by its chloroplastic plant member.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed members are assigned to SF2 and are annotated as L-aspartate
  oxidases; the experimentally characterized members (E. coli and B. subtilis
  NadB, Arabidopsis AO) share the reaction.
