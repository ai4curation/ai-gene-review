family_id: PANTHER:PTHR24355
family_name: G PROTEIN-COUPLED RECEPTOR KINASE/RIBOSOMAL PROTEIN S6 KINASE
preferred_name: G protein-coupled receptor kinases (GRK1-7) and RSKR
summary: >-
  PTHR24355 holds the G protein-coupled receptor kinases (GRKs), soluble serine/threonine kinases that
  phosphorylate agonist- or light-activated GPCRs and so start their desensitization, together with the
  uncharacterized ribosomal protein S6 kinase-related protein (RSKR). Vertebrate GRKs fall into three groups:
  GRK1 (rhodopsin kinase) and GRK7 (cone opsin kinase), GRK2 and GRK3, and GRK4, GRK5 and GRK6. Phosphorylation
  of activated receptors is shared by all GRKs, whereas phosphorylation of light-activated opsins as the
  physiological function, with the resulting shut-off of phototransduction, is specific to the
  vertebrate GRK1/GRK7 branch.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All GRKs are receptor kinases. The exceptions are RSKR (PTHR24355:SF1), a predicted kinase with no
  characterized substrate, and four small subfamilies named after STK32 kinases (SF30-SF33), which in the
  cached tree are non-mammalian sequences nested inside the GRK2/GRK3 clade and whose function is not
  established. Substrate specificity divides the GRKs: rhodopsin kinase activity belongs to the
  vertebrate-specific GRK1/GRK7 clade.
