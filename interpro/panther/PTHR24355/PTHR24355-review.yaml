notes: >-
  Clade memberships and subfamily assignments were read from the cached PANTHER tree
  (.cache/panther_trees/PTHR24355.json.gz). Nodes not on GRK1's lineage and not bearing on the rhodopsin
  kinase scope were not assessed: PTN001219817 (GRK2/3 clade: receptor binding, GRK activity, GPCR
  signalling, regulation of signal transduction), PTN001553739 and PTN008614780 (GRK2 and GRK2/3 cardiac
  terms), PTN002806930 (GRK6 receptor kinase activity), PTN001219783 (protein kinase activity at the family
  root) and PTN000683254, which has no leaves in the cached tree. The STK32-named subfamilies SF30-SF33 sit
  inside the GRK2/3 clade in the cached tree and so inherit GRK2/3 node terms; whether these sequences are
  STK32 kinases or GRK2/3 sequences under a misleading name was not resolved here. GRK1 is the only reviewed
  member, and its review removes no IBA, so no member exceptions are needed.
