family_id: PANTHER:PTHR47320
family_name: BIFUNCTIONAL URIDYLYLTRANSFERASE/URIDYLYL-REMOVING ENZYME
preferred_name: GlnD PII uridylyltransferase/uridylyl-removing enzyme family
summary: Bifunctional GlnD enzymes of proteobacteria that uridylylate the T-loop tyrosine of PII proteins
  (GlnB, GlnK) with UTP when glutamine is low, and remove the UMP when glutamine is high. A nucleotidyltransferase
  domain carries the UTase activity, an HD domain the uridylyl-removing activity, and C-terminal ACT domains
  sense glutamine. GlnD is thus the primary nitrogen sensor of the Ntr system.
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF1) of GlnD orthologs sharing the NT, HD and ACT domain architecture
  and the PII-modifying activity.
