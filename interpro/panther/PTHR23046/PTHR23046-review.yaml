family_id: PANTHER:PTHR23046
family_name: PHOSPHORIBOSYLAMINOIMIDAZOLE CARBOXYLASE CATALYTIC SUBUNIT
preferred_name: Standalone PurE (AIR carboxylase family) proteins
summary: >-
  Standalone PurE proteins catalyse the C4 carboxylation step of de novo purine synthesis. Most
  bacterial and archaeal members are class I PurEs, N5-CAIR mutases that move the carboxylate made
  by PurK from the AIR exocyclic amine (N5-CAIR) onto C4 of the imidazole ring to give CAIR. A
  minority are class II PurEs, which bind AIR and CO2 and carboxylate C4 directly without PurK. The
  first prokaryotic example is Treponema denticola PurE. Class I and class II PurEs are homologous
  and mechanistically related, but they bind different substrates. The class II domain of animal
  PAICS and the class I domain of fungal ADE2 are related to this family, but PANTHER classifies
  those multidomain proteins into PTHR43599 and PTHR11609.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Class I N5-CAIR mutases make up most of the family, including every reviewed member that inherits
  the PAINT mutase IBD. The single PANTHER subfamily (SF2) also contains class II AIR carboxylases:
  T. denticola PurE (Q73PV9, characterized) and Archaeoglobus fulgidus PurE (O28997, HAMAP class II).
  These bind AIR and CO2, not N5-CAIR. The class difference is not reflected in the PANTHER
  subfamily split.
