- node_id: PANTHER:PTN000549177
  asserted_term:
    id: GO:0034023
    label: 5-(carboxyamino)imidazole ribonucleotide mutase activity
  paint_snapshot: '20250225'
  seeds:
  - id: UniProtKB:P0AG18
    label: purE
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    The node is seeded by E. coli PurE, whose N5-CAIR mutase activity was established by NMR and
    kinetics. Its 45 recipients in the PAINT GAF include the reviewed class I PurEs of E. coli,
    B. subtilis, P. aeruginosa, M. tuberculosis, Vibrio, Aquifex, Thermotoga, Synechocystis,
    Methanocaldococcus and Saccharolobus, and Arabidopsis At2g05140. They do not include the class II
    PurEs (T. denticola Q73PV9, A. fulgidus O28997), so the node already excludes the divergent
    class. A single seed is not weak support here (see the repository IBA guidance); the reaction is
    the defining class I chemistry. The companion cytosol IBD at the same node is unremarkable. One
    open point: At2g05140 is a 162-residue protein made only of a PurE domain, in a plant that also
    encodes the PURKE fusion (At2g37690). Whether it acts as a mutase in planta has not been shown.
  supported_by:
  - reference_id: PMID:8117684
    supporting_text: PurE has been shown by NMR spectroscopy and kinetic analysis, to catalyze the reversible
      conversion of N5-CAIR and CAIR.
  - reference_id: file:interpro/panther/PTHR23046/PTHR23046-paint.tsv
    supporting_text: "PTHR23046\tPTN000549177\tGO:0034023\tF\tIBD\tfalse\tUniProtKB:P0AG18"
term_assessments:
- assessed_term:
    id: GO:0034023
    label: 5-(carboxyamino)imidazole ribonucleotide mutase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The module uses PTHR23046 for the bacterial N5-CAIR mutase annoton (purE_activity). The mutase
    holds for the class I majority, which is all the module representatives (E. coli and P. putida
    PurE) and all PAINT recipients. The class II members in the same subfamily are listed as
    exceptions. They bind AIR and CO2 rather than N5-CAIR, and their organisms lack PurK.
  member_exceptions:
  - member:
      id: UniProtKB:Q73PV9
      label: Phosphoribosylaminoimidazole carboxylase
      gene_symbol: purE
      organism: Treponema denticola ATCC 35405
    exception_reason: >-
      Characterized class II PurE. It is an AIR carboxylase that binds AIR and CO2 but not N5-CAIR,
      in an organism with no purK gene.
    supported_by:
    - reference_id: PMID:21548610
      supporting_text: Steady-state and pre-steady-state experiments show that TdPurE binds AIR and CO(2)
        but not N(5)-CAIR.
  - member:
      id: UniProtKB:O28997
      label: Phosphoribosylaminoimidazole carboxylase
      gene_symbol: purE
      organism: Archaeoglobus fulgidus DSM 4304
    exception_reason: >-
      Assigned to the class II PurE subfamily by UniProt (HAMAP MF_02045) and named AIR carboxylase.
      This rests on sequence rules only, not experiment. It does not receive the mutase IBA.
    supported_by:
    - reference_id: file:interpro/panther/PTHR23046/PTHR23046-entries.csv
      supporting_text: O28997,Phosphoribosylaminoimidazole carboxylase,protein,224325
  supported_by:
  - reference_id: PMID:10574791
    supporting_text: PurE has recently been shown to be a mutase that catalyzes the unusual rearrangement
      of N(5)-carboxyaminoimidazole ribonucleotide (N(5)-CAIR), the PurK reaction product, to CAIR.
  - reference_id: file:genes/PSEPK/purE/purE-ai-review.yaml
    supporting_text: Converts N5-CAIR to CAIR in the bacterial two-enzyme carboxylation stage.
- assessed_term:
    id: GO:0004638
    label: phosphoribosylaminoimidazole carboxylase activity
  scope: UNRESOLVED
  scope_reason: >-
    The direct (class II) AIR carboxylase reaction belongs to the class II minority of this family
    (T. denticola PurE, demonstrated; A. fulgidus PurE, predicted), not the class I majority.
    Members of both classes share SF2, and no residue site was curated here to separate them.
    Tranchimand et al. point to a differentially conserved lysine (TdPurE Lys41) that contacts the
    AIR phosphate. A residue-determined scope would need that position anchored on checked
    sequences, which was not done. The term must not be applied family-wide.
  supported_by:
  - reference_id: PMID:21548610
    supporting_text: We demonstrate that T. denticola PurE (TdPurE) is AIR carboxylase, the first example
      of a prokaryotic class II PurE.
  - reference_id: PMID:21548610
    supporting_text: A contact between the AIR phosphate and a differentially conserved residue (TdPurE
      Lys41) enforces different AIR conformations in each PurE class.
