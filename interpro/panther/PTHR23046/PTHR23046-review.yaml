notes: >-
  The PTN000549177 recipient list was taken from the cached PAINT UniProt GAF. Q73PV9 and O28997 are
  absent from it. The class II status of O28997 rests on the UniProt similarity statement (HAMAP
  MF_02045), not on experiment. No S. cerevisiae or S. pombe protein is in this family; their PurE
  domains sit inside ADE2/ade6, which PANTHER assigns to PTHR11609.
