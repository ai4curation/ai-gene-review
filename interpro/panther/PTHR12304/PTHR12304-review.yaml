  assessment_reason: >-
    Purine nucleosidase activity is asserted at the PTHR12304 root. Fungal SF4 recipients do not all
    support this substrate specificity: URH1 removes the propagated purine term, and the S. pombe
    paralogs mark the same assertion as over-annotated rather than experimentally established. The
    plant clade PTN000959462 already has a uridine-specific IRD plus an inosine-specific IBD, so PAINT
    already prunes specificity by clade here. Add a conservative IRD at the S. cerevisiae URH1 leaf,
    where PMID:11872485 directly assayed the enzyme and found no inosine, adenosine or guanosine
    activity.
