family_id: PANTHER:PTHR12304
family_name: INOSINE-URIDINE PREFERRING NUCLEOSIDE HYDROLASE
preferred_name: Inosine-uridine preferring nucleoside hydrolase (URH1/RihA) family
summary: >-
  Calcium-dependent nucleoside hydrolases cleave the N-glycosidic bond of ribonucleosides. Fungal
  URH1 (S. cerevisiae URH1, S. pombe SPAC17G8.02 and SPBC1683.06c) prefers uridine and also hydrolyses
  nicotinamide riboside for NAD salvage. Bacterial RihA/RihC and plant URH1/2 vary in purine or pyrimidine
  preference.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are nucleoside hydrolases; substrate preference (uridine, inosine, nicotinamide riboside)
  varies by subfamily.
