family_id: PANTHER:PTHR43512
family_name: TRANSLATION FACTOR GUF1-RELATED
preferred_name: LepA/GUF1 translation-factor GTPases
summary: LepA/GUF1 proteins act with bacterial or organellar ribosomes in translation. Mitochondrial,
  chloroplast and bacterial forms share translation-factor architecture but differ in targeting and translation
  system.
functional_coherence: HETEROGENEOUS
coherence_reason: The Artemisia protein has chloroplastic GUF1 placement and is relevant to the characterized
  chloroplast translation factor. Chloroplast residence is plausible for that branch but is false as a
  universal location across bacterial and mitochondrial homologs. Transit-peptide evidence and gene-model
  completeness qualify the plant transfer.
