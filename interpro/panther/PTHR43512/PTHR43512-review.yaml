term_assessments:
- assessed_term:
    id: GO:0009507
    label: chloroplast
  scope: UNRESOLVED
  scope_reason: Arabidopsis cpLEPA loss impairs chloroplast protein synthesis and photosynthetic performance,
    supporting the plastid branch of LepA/GUF1. Bacterial LepA and mitochondrial GUF1 have different translation
    systems and are not chloroplast-localized. Correct plant orthology and retention of targeting sequences
    bound the Artemisia transfer; the complete set of plastid-targeted branches is not defined by one
    exemplar.
