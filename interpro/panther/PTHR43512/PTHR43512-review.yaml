  label: TRANSLATION FACTOR GUF1 HOMOLOG, CHLOROPLASTIC
  description: Recorded placement of A0A2U1PS28. The Artemisia protein has chloroplastic GUF1 placement
    and is relevant to the characterized chloroplast translation factor. Chloroplast residence is plausible
    for that branch but is false as a universal location across bacterial and mitochondrial homologs.
    Transit-peptide evidence and gene-model completeness qualify the plant transfer.
