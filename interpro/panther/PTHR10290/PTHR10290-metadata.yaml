  name:
    name: DNA topoisomerase IB
    short: Topoisomerase_IB
  description:
  - text: The DNA topoisomerase IB family consists of enzymes that modulate the topological
      states of DNA by transiently breaking and rejoining one strand of the DNA duplex.
      They play a crucial role in releasing the supercoiling and torsional tension
      of DNA that arises during replication and transcription. These enzymes introduce
      a single-strand break via transesterification at specific target sites in duplex
      DNA. The catalytic tyrosine of the enzyme attacks the scissile phosphodiester,
      forming a DNA-(3'-phosphotyrosyl)-enzyme intermediate and releasing a 5'-OH
      DNA strand. The free DNA strand can then rotate around the unbroken strand,
      removing supercoils. Religation occurs when the DNA 5'-OH attacks the covalent
      intermediate, expelling the active-site tyrosine and restoring the DNA backbone.
      Some family members are involved in the regulation of alternative splicing,
      circadian transcription, and are essential for plant survival. They are also
      targets for specific inhibitors like camptothecin, which has antitumor properties.
