notes: >-
  None of the PAINT rows in this slice sits on a node of the PANTHER 19 PTHR45444 tree,
  which is a small horizontally transferred clade (P. aeruginosa XdhA plus eukaryotic
  XDH-like sequences) rooted at PTN009177501 (PANTHER treeinfo service, queried
  2026-11-09). They are nodes of the PTHR11908 tree reached because UniProt's PANTHER
  cross-references put fused eukaryotic XDH and AOX proteins (P47989, Q06278 and others in
  the entries file) in PTHR45444:SF3, while PANTHER's own classification puts them in
  PTHR11908 subfamilies (SF80 for XDH, SF86 for AOX). The same rows are assessed with
  the same verdicts in the PTHR11908 review. No PAINT node asserts a function for the
  bacterial XdhA subunits, which receive no IBA rows. For the bacterial members the
  substrate activities GO:0070674 and GO:0004854 are complex-level contributions
  (contributes_to), not activities of the subunit alone, so no family-level scope is
  asserted for them here.
