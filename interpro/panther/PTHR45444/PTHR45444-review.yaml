family_id: PANTHER:PTHR45444
family_name: XANTHINE DEHYDROGENASE
preferred_name: Xanthine dehydrogenase FAD/[2Fe-2S] small-subunit family (bacterial XdhA)
summary: >-
  Proteins carrying the xanthine-dehydrogenase flavo-iron-sulfur module: two N-terminal
  [2Fe-2S] ferredoxin-type domains and a PCMH-type FAD-binding domain. The family has a
  single subfamily (SF3). Its characterized bacterial members are the small XdhA
  subunits of two-subunit XdhAB xanthine dehydrogenases (Rhodobacter capsulatus XdhA,
  Pseudomonas XdhA), which pass electrons from the molybdenum center on the partner
  XdhB subunit to FAD and NAD+. Through UniProt's PANTHER cross-references the family
  also takes in fused eukaryotic xanthine dehydrogenases and aldehyde oxidases (e.g.
  human XDH P47989, AOX1 Q06278), whose single chains contain the same flavo-iron-sulfur
  module followed by the molybdopterin domains; PANTHER's own classification places
  those fused proteins in PTHR11908 subfamilies instead.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member carries the FAD/[2Fe-2S] electron-transfer module of molybdo-flavo
  hydroxylases, so redox-cofactor binding and an electron-transfer role are shared.
  The substrate reaction is not a property of this module: in split bacterial enzymes it
  is a contribution of the small subunit to the XdhAB complex, and among the fused
  eukaryotic members the reaction differs between xanthine dehydrogenases and aldehyde
  oxidases.
