notes: >-
  Written during the POPTR IBA re-review pass to give the EIN2.1/EIN2.2 (and ARATH EIN2)
  gene-review judgments a single family-level home. All node/term pairs, seed lists and
  snapshot dates are copied verbatim from the cached PTHR11706-paint.tsv; subfamily
  accessions and labels are verbatim from panther.obo; member lengths and subfamily
  assignments cited in the divergence argument come from the fetched
  PTHR11706-entries.csv (EIN2 members 1281-1294 aa; the reviewed transporter subfamilies
  500-581 aa and all non-EIN2 members 397-696 aa in the slice). UniProt labels for P49281, P49279 and the poplar members were verified
  against UniProt.

  No residue_sites are recorded, deliberately: SLC11A2 carries no curated active-site or
  binding-site features in UniProt, and the EIN2 divergence is architectural (an appended
  C-terminal signaling domain plus loss of the transport role), not a point-residue
  question. Asserting metal-coordination positions from memory is exactly what this
  framework exists to prevent.

  The poplar transporter paralogs are handled at gene level, not family level: NRAMP1 and
  NRAMP3.1 mark the iron-homeostasis IBA as over-annotated on target-specific grounds
  (no substrate characterization; failed nramp3nramp4 complementation, respectively)
  while NRAMP3.2 and the NRAMP6/7 clade retain the terms. That within-clade variation is
  a coreness judgment about individual paralogs, so no SUBFAMILY_ONLY term scoping is
  asserted here; the family-level failure is confined to SF75 and is recorded in the
  node assessments above.
