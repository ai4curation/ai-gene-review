family_id: PANTHER:PTHR11706
family_name: SOLUTE CARRIER PROTEIN FAMILY 11 MEMBER
preferred_name: NRAMP/SLC11 divalent metal transporter family (including the diverged EIN2 clade)
summary: >-
  NRAMP/SLC11 proteins are proton-coupled divalent metal transporters found across
  bacteria, fungi, plants and animals. Characterized members move Fe(2+), Mn(2+) and
  other divalent cations across plasma, endosomal or vacuolar membranes: human SLC11A2
  (DMT1) mediates dietary iron uptake and endosomal iron export, human SLC11A1 acts in
  phagosomal metal handling, yeast SMF1/SMF2 transport manganese, and plant NRAMPs
  (Arabidopsis NRAMP1-6, poplar NRAMP1-7) mobilize iron and manganese between the
  vacuole, plastids and the cytosol.

  One clade is not a transporter at all. The land-plant EIN2 proteins (subfamily SF75)
  carry an NRAMP-like N-terminal integral-membrane domain but have appended a large
  C-terminal cytoplasmic extension, roughly doubling the protein length (the reviewed
  transporter subfamilies run 500-581 aa in the fetched slice, all non-EIN2 members
  397-696 aa; EIN2 members run 1281-1294 aa). EIN2 is the central transducer of ethylene signaling at the endoplasmic
  reticulum membrane: ethylene perception triggers cleavage and nuclear/cytoplasmic
  translocation of its C-terminal fragment. No metal transport activity has been
  demonstrated for any EIN2, so transport and metal-homeostasis terms placed on deep
  family nodes must not descend into SF75.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The transporter subfamilies (mammalian SLC11A1/SLC11A2, fungal SMF paralogs, plant
  NRAMP1-7) share proton-coupled divalent metal transport and differ mainly in substrate
  emphasis and membrane context. The EIN2 subfamily (SF75) diverged into ethylene signal
  transduction: it retains only the NRAMP-like membrane domain as a fold, gained a large
  C-terminal signaling extension, localizes to the ER membrane, and has no demonstrated
  transport or metal-homeostasis function. Fold- or family-level reasoning therefore
  over-annotates EIN2; the divergence is architectural (a whole appended signaling
  domain and loss of the transport role), not a point-residue substitution.
reference_protein:
  id: UniProtKB:P49281
  label: Natural resistance-associated macrophage protein 2
  gene_symbol: SLC11A2
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR11706:SF75
    label: ETHYLENE-INSENSITIVE PROTEIN 2
    description: >-
      Land-plant EIN2 orthologs. NRAMP-like N-terminal membrane domain plus a large
      C-terminal cytoplasmic signaling extension (members 1281-1294 aa versus 500-581 aa for the
      reviewed transporter subfamilies and 397-696 aa across all non-EIN2 members in
      the fetched slice). Central transducers of
      ethylene signaling at the ER membrane.
    representative_members:
      - id: UniProtKB:Q9S814
        label: Ethylene-insensitive protein 2
        organism: Arabidopsis thaliana
        gene_review: genes/ARATH/EIN2/EIN2-ai-review.yaml
      - id: UniProtKB:A0A3N7G677
        label: Ethylene-insensitive protein 2.1
        organism: Populus trichocarpa
        gene_review: genes/POPTR/EIN2.1/EIN2.1-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      Diverged from the family's transport function into ethylene signal transduction.
      EIN2 acts downstream of the ethylene receptors and CTR1 and upstream of the
      EIN3/EIL transcription factors; ethylene triggers cleavage of its C-terminal
      fragment, which moves to the nucleus and to cytoplasmic P-bodies. No metal
      transport or metal-homeostasis activity has been demonstrated for any member, so
      transport, transporter-activity, metal-homeostasis and plasma-membrane terms
      inherited from family-level nodes are over-annotations here. The divergence is a
      whole appended domain plus functional loss, not a point-residue substitution.
