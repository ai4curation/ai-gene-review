  assessment: SOUND
  assessment_reason: >-
    The node has no PAINT taxon and its seeds span bacteria, fungi, plants, insects,
    apicomplexans and mammals. Its 732 activity recipients in the PAINT UniProt GAF include
    every model-organism PK: yeast CDC19 and PYK2, S. pombe pyk1, E. coli pykF and pykA, B.
    subtilis pyk, human PKM and PKLR, and the Arabidopsis cytosolic and plastidial PKs. The
    curator has already pruned the branches that lost the function: IKR NOT rows on five
    Drosophila nodes (PTN000212768 to PTN000212772) keep the activity and glycolysis from
    the five Drosophila SF3 paralogs, and only Drosophila PyK receives them. The same node
    asserts GO:0006096 glycolytic process and GO:0005737 cytoplasm. Both are sound for the
    same recipients, because chloroplast stroma lies within the GO cytoplasm. The yeast
    CDC19, PYK2 and pyk1 reviews and the human PKM and PKLR reviews all accept the activity
    and glycolysis IBAs.
