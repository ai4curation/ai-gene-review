family_id: PANTHER:PTHR11817
family_name: PYRUVATE KINASE
preferred_name: Pyruvate kinase
summary: >-
  Pyruvate kinases transfer the phosphoryl group of phosphoenolpyruvate to ADP, giving
  pyruvate and ATP in the final, essentially irreversible step of glycolysis. The family
  covers the bacterial PykF- and PykA-type enzymes, the fungal enzymes (S. cerevisiae CDC19
  and PYK2, S. pombe pyk1), the vertebrate PKM and PKLR isozymes, and the cytosolic and
  plastidial pyruvate kinases of plants. Allosteric control differs between isozymes: for
  example, yeast CDC19 is activated by fructose 1,6-bisphosphate and PYK2 is not. The
  catalytic reaction is shared.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Pyruvate kinase activity is placed by PAINT at a family-wide node (PTN000212670) seeded by
  bacterial, fungal, plant, insect, apicomplexan and mammalian members. The recorded
  exceptions are lineage-specific Drosophila paralogs. PAINT carries IKR NOT annotations for
  GO:0004743 and GO:0006096 on five Drosophila nodes (PTN000212768 to PTN000212772). In the
  PANTHER 19 classification, the five Drosophila SF3 paralogs other than PyK (CG7069,
  CG7362, CG11249, CG2964, CG12229) receive no PK IBA. They share SF3 with yeast CDC19, PYK2,
  pyk1 and E. coli pykF, so SF3 is not functionally uniform. Compartment also varies:
  plastidial plant PKs (SF2, SF14, SF63, SF76) are in the chloroplast stroma.
