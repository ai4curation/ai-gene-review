notes: >-
  The fetched PTHR11817-entries.csv has an empty subfamily column. Subfamily assignments here
  were read from the PANTHER 19 organism classification files (S. cerevisiae, S. pombe,
  human, E. coli, B. subtilis, P. aeruginosa, Arabidopsis, Drosophila, C. elegans, C.
  albicans, mouse, rat). IBA recipients were listed from the PAINT UniProt GAF, and the IKR
  NOT rows from the PAINT IBD GAF. The Drosophila IKR rows are PAINT's assertion of
  key-residue change; the residues were not re-checked here. Rat Pkm (P11980) sits in SF101
  ("PYRUVATE KINASE PKM"), whereas human PKM is in SF15 under the same name, so PKM
  orthologs span two subfamilies. Module consistency: emp_glycolysis (CDC19, PYK2, pyk1),
  glycolysis_payoff_phase (PKM, PKLR) and bacterial_pyruvate_metabolism (P. putida pykA
  Q88N54 and pyk Q88EZ9) all use the base family for GO:0004743, which this review supports.
  The cytosol location on a whole-family selector over-reaches only for plant plastidial
  PKs. The P. putida PKs are not in the fetched member inventory and their subfamilies were
  not determined. Gene-review inconsistency, outside this family's term scope: the PKM review
  lists protein tyrosine and serine/threonine kinase activities as core functions. These are
  PKM2-specific moonlighting claims and are not family properties.
