    label: cellular response to insulin stimulus
  paint_snapshot: '20170228'
  seeds:
  - id: RGD:3336
    label: Pklr
    organism: Rattus norvegicus
  assessment: UNRESOLVED
  assessment_reason: >-
    The node is the vertebrate PKM plus PKLR clade (51 recipients, including human PKM and
    PKLR, mouse Pkm and Pklr, and rat Pkm and Pklr). Its only seed is rat Pklr (RGD:3336,
    SF31). An insulin response recorded for the hepatic L-type enzyme describes hormonal
    regulation of that isozyme's expression and phosphorylation. A single PKLR seed does not
    show that the PKM branch shares the response, so the node may be too deep. Nor is it
    clear that an expression-level response should be inherited at all. The two human gene
    reviews disagree: PKLR marks the IBA as over-annotated, and PKM keeps it as non-core.
    It is left unresolved here rather than overriding either review without the rat source
    paper.
