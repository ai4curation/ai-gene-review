notes: >-
  Written together with full gene reviews of all three model-organism members: S.
  cerevisiae ZDS1 and ZDS2, and S. pombe zds1. All node/term/seed/date tuples are verbatim
  from the cached PTHR28089-paint.tsv. The single PAINT node is the family root (Fungi). Its
  inhibitor-activity IBD is seeded by ZDS1 alone (SGD:S000004886); ZDS2 is S000004577. The
  main recommendation is to replace GO:0004864 with GO:0019888 at that node. No
  residue_sites were curated: the Zds_C/ZH4 Cdc55-binding region is mapped only as a
  block, and individual positions were not verified against the sequences in this pass.
