family_id: PANTHER:PTHR28089
family_name: PROTEIN ZDS1-RELATED
preferred_name: Zds1/Zds2 family of fungal PP2A-B55 (Cdc55) regulatory partners
summary: >-
  Fungal-specific family of large, non-catalytic proteins defined by a conserved C-terminal
  Zds_C motif, represented in model organisms by the budding-yeast paralogs Zds1 and Zds2
  and the single fission-yeast ortholog Zds1. In Saccharomyces cerevisiae, Zds1 and Zds2
  bind the B55-family regulatory subunit Cdc55 of protein phosphatase 2A through the
  C-terminal region and control where and when PP2A-Cdc55 acts: they keep it in the
  cytoplasm and at the cell cortex, which promotes Mih1 dephosphorylation and entry into
  mitosis, and at anaphase they help downregulate PP2A-Cdc55 activity toward Net1, which
  allows early release of Cdc14 and exit from mitosis. Loss of both paralogs also perturbs
  polarized growth and other processes downstream of PP2A-Cdc55. The fission-yeast Zds1 is
  cytosolic, cortical and septal, and is needed for normal cell shape, cell-wall integrity
  and sexual differentiation. Its link to PP2A rests only on co-purification with the PP2A
  scaffold, and its role at the G2/M transition is untested.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members are cytoplasmic, non-catalytic PP2A-B55 partners with the
  conserved Zds_C motif, and the budding-yeast paralogs are genetically redundant, so the
  core molecular role (PP2A-B55 regulatory partner) is coherent. Downstream outputs are
  less uniform: the cell-cycle roles (mitotic entry and early mitotic exit) are
  demonstrated only in S. cerevisiae, whereas the fission-yeast ortholog is known through
  morphology, cell-wall and mating phenotypes.
