node_assessments:
  - node_id: PANTHER:PTN001999034
    asserted_term:
      id: GO:0005737
      label: cytoplasm
    node_taxon:
      id: NCBITaxon:4751
      label: Fungi
    paint_snapshot: "20231109"
    seeds:
      - id: SGD:S000004577
        label: Protein ZDS2
        organism: Saccharomyces cerevisiae
      - id: SGD:S000004886
        label: Protein ZDS1
        organism: Saccharomyces cerevisiae
    assessment: SOUND
    assessment_reason: >-
      Both budding-yeast paralogs act in the cytoplasm, where they hold PP2A-Cdc55 out of
      the nucleus, and the fission-yeast ortholog is cytosolic, cortical and septal by
      GFP tagging. Correct for the whole family.
    supported_by:
      - reference_id: PMID:16322512
        supporting_text: cytosol, the septum, and the cell cortex.
  - node_id: PANTHER:PTN001999034
    asserted_term:
      id: GO:0004864
      label: protein phosphatase inhibitor activity
    node_taxon:
      id: NCBITaxon:4751
      label: Fungi
    paint_snapshot: "20260320"
    seeds:
      - id: SGD:S000004886
        label: Protein ZDS1
        organism: Saccharomyces cerevisiae
    assessment: UNRESOLVED
    assessment_reason: >-
      The node is the right place for the family's molecular function, but the term is
      wrong. The only seed is ZDS1, whose inhibitor annotations rest on overexpression
      lowering PP2A-Cdc55 activity during mitotic exit. The Zds proteins activate and
      target PP2A-Cdc55 toward Mih1 for mitotic entry, and the lab that reported the
      inhibition later concluded that Zds1/Zds2 are unlikely to be direct inhibitory
      components of the complex. Nothing in fission yeast shows PP2A inhibition. The
      same node should instead carry the neutral parent GO:0019888 protein phosphatase
      regulator activity; all three member reviews MODIFY the IBA to that term.
    supported_by:
      - reference_id: PMID:22427694
        supporting_text: >-
          Therefore, it seems unlikely that Zds1p and Zds2p act as direct inhibitory
          components of the PP2ACdc55 complex.
      - reference_id: PMID:21119008
        supporting_text: Thus, Zds1/2 activate PP2ACdc55-dependent dephosphorylation of Mih1.
      - reference_id: PMID:21536748
        supporting_text: Zds1/Zds2 promote Cdc55-PP2A function for mitotic entry
  - node_id: PANTHER:PTN001999034
    asserted_term:
      id: GO:0010971
      label: positive regulation of G2/M transition of mitotic cell cycle
    node_taxon:
      id: NCBITaxon:4751
      label: Fungi
    paint_snapshot: "20170228"
    seeds:
      - id: SGD:S000004577
        label: Protein ZDS2
        organism: Saccharomyces cerevisiae
      - id: SGD:S000004886
        label: Protein ZDS1
        organism: Saccharomyces cerevisiae
    assessment: UNRESOLVED
    assessment_reason: >-
      Well supported in budding yeast, where Zds1/2 direct PP2A-Cdc55 to dephosphorylate
      Mih1 and so promote mitotic entry. Whether the role reaches the whole fungal node is
      unknown. No fission-yeast experiment tests zds1 at G2/M. The genome-wide deletion
      screen scores zds1-deleted cells as abnormally shaped but normal in size, and size
      at division is a sensitive readout of G2/M timing in S. pombe. Fission yeast also
      controls PP2A-B55 through Greatwall and endosulfine, a mechanism shared with budding
      yeast. The fission-yeast review therefore marks this IBA over-annotated rather than
      wrong. A test of mitotic entry in zds1-deleted fission yeast would settle the depth.
    supported_by:
      - reference_id: PMID:21119008
        supporting_text: Thus, Zds1/2 activate PP2ACdc55-dependent dephosphorylation of Mih1.
  - node_id: PANTHER:PTN001999034
    asserted_term:
      id: GO:0030010
      label: establishment of cell polarity
    node_taxon:
      id: NCBITaxon:4751
      label: Fungi
    paint_snapshot: "20170228"
    seeds:
      - id: SGD:S000004577
        label: Protein ZDS2
        organism: Saccharomyces cerevisiae
      - id: SGD:S000004886
        label: Protein ZDS1
        organism: Saccharomyces cerevisiae
    assessment: SOUND
    assessment_reason: >-
      Polarized-growth defects are reported for the budding-yeast paralogs (ZDS2 through
      Swe1 and Cdc55), and fission-yeast zds1-deleted cells are round with a defective cell
      wall, so the phenotype is shared across the node. In budding yeast the term reflects
      a downstream output of PP2A-Cdc55 regulation, and those reviews keep it as non-core.
    supported_by:
      - reference_id: PMID:16322512
        supporting_text: >-
          Moreover, the zds1 Δ strain is round in shape and very sensitive to zymolyase,
          and its cell wall becomes thicker than that of wild type.

term_assessments:
  - assessed_term:
      id: GO:0019888
      label: protein phosphatase regulator activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The Cdc55-binding Zds_C region is the family's defining conserved motif. Both
      budding-yeast paralogs bind Cdc55 directly and modulate PP2A-Cdc55 in both
      directions, and the fission-yeast ortholog co-purifies with the PP2A scaffold. This
      neutral term is the right family-wide molecular function, and it should replace
      GO:0004864 at PTN001999034.
    supported_by:
      - reference_id: PMID:20980617
        supporting_text: >-
          we showed that ZH4 is necessary and sufficient for the interaction of Zds2p with
          Cdc55p in vivo.
      - reference_id: PMID:22427694
        supporting_text: >-
          Therefore, it seems unlikely that Zds1p and Zds2p act as direct inhibitory
          components of the PP2ACdc55 complex.
  - assessed_term:
      id: GO:0004864
      label: protein phosphatase inhibitor activity
    scope: UNRESOLVED
    scope_reason: >-
      Inhibition is one context-dependent output, seen at mitotic exit in budding yeast.
      It is not a family property and should not be propagated.
    supported_by:
      - reference_id: PMID:18762578
        supporting_text: suggest that these proteins may act as separase-regulated PP2A(Cdc55)
  - assessed_term:
      id: GO:0005737
      label: cytoplasm
    scope: FAMILY_WIDE
    scope_reason: Cytoplasmic in both budding-yeast paralogs and in the fission-yeast ortholog.
    supported_by:
      - reference_id: PMID:16322512
        supporting_text: cytosol, the septum, and the cell cortex.
  - assessed_term:
      id: GO:0010971
      label: positive regulation of G2/M transition of mitotic cell cycle
    scope: UNRESOLVED
    scope_reason: >-
      Demonstrated in S. cerevisiae only. The fission-yeast ortholog's role at G2/M has
      not been tested, and the deletion's normal cell size argues against a major role
      there. Boundary: budding yeast, until a fission-yeast experiment exists.
  - assessed_term:
      id: GO:0031536
      label: positive regulation of exit from mitosis
    scope: UNRESOLVED
    scope_reason: >-
      Zds1 and Zds2 work with separase to release Cdc14 early in budding-yeast anaphase,
      and both budding-yeast reviews propose it as NEW. The FEAR network it acts in is
      characterized mainly in S. cerevisiae, so it is not asserted family-wide.
    supported_by:
      - reference_id: PMID:18762578
        supporting_text: suggest that these proteins may act as separase-regulated PP2A(Cdc55)

