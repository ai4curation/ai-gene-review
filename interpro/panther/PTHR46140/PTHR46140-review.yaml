family_id: PANTHER:PTHR46140
family_name: VACUOLAR TRANSPORTER CHAPERONE 1-RELATED
summary: VTC-related proteins participate in fungal vacuolar polyphosphate systems. The complex combines
  polyphosphate synthesis, membrane translocation and regulatory inputs through distinct subunit roles.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory contains Vtc1, Vtc2/3, Vtc4 and Vtc5; notably SF1 mixes catalytic Vtc4
  with short Vtc1 and regulatory Vtc5 entries. Primary Vtc4 structural enzymology supports polyphosphate
  synthesis (PMID:19390046), and Neurospora microscopy places VTC-4 in prevacuolar compartments and the
  tubular vacuolar network (PMID:26453652). Neither SF1 nor VTC complex membership is a sufficient boundary
  for polyphosphate kinase activity in every subunit.
