  name:
    name: Vacuolar Transporter Chaperone Complex Subunit
    short: VTC_Complex_Subunit
  description:
  - text: This family of proteins functions as subunits of the vacuolar transporter
      chaperone (VTC) complex, which is involved in the synthesis and translocation
      of inorganic polyphosphate (polyP). The complex catalyzes the transfer of phosphate
      from ATP to a growing polyP chain, releasing ADP, and integrates cytoplasmic
      polymer synthesis with polyP membrane translocation. The complex contains multiple
      vacuolar transmembrane domains that likely form a channel for polyP transport
      into the vacuole lumen. This process is dependent on the proton gradient across
      the membrane. Additionally, these proteins play a role in vacuolar membrane
      fusion and are involved in various cellular processes such as microautophagy,
      SNARE priming, and the regulation of cytosolic phosphate concentrations through
      binding to inositol polyphosphates. The SPX domain present in some subunits
      has a high affinity for inositol polyphosphates and may integrate signaling
      to adapt phosphate concentrations.
