notes: >-
  Written for the bacterial fructose PTS uptake and catabolism modules. Subfamily
  membership was read from the PANTHER entries inventory (28 reviewed members: SF0 23,
  SF28 3, SF32 1, SF34 1) and from the DR PANTHER line of the unreviewed P. putida
  KT2440 FruA (Q88PQ3, SF0). The two fructose FruA exemplars of the modules sit in
  different subfamilies (SF32 and SF0), so the modules ground the transport step on
  the whole family; the fructose-specific scope is left UNRESOLVED and the module
  validator reports that as FAMILY_FUNCTION_UNREVIEWED. The PAINT root node correctly
  carries only substrate-generic terms.
