family_id: PANTHER:PTHR30505
family_name: FRUCTOSE-LIKE PERMEASE
functional_coherence: HETEROGENEOUS
preferred_name: Fructose-like PTS components with variable substrate and domain composition
summary: This family contains fructose PTS membrane transporters, related PTS proteins of other sugar
  specificity, and separate phosphotransfer or translocation components. Fructose transport can involve
  a fused EIIB-type/EIIC protein or separate EIIB and EIIC proteins. Mannosyl-glycerate transport by E.
  coli MngA demonstrates that the family name alone does not define substrate specificity.
coherence_reason: Substrate and architecture differ within the family and within its subfamilies. SF0
  includes separate archaeal EIIB/EIIC proteins as well as bacterial fused FruA. SF28 includes MngA and
  proteins annotated for fructose; therefore subfamily names cannot replace chemistry and architecture
  evidence.
reference_protein:
  id: UniProtKB:P20966
  label: PTS system fructose-specific EIIB'BC component
  organism: Escherichia coli K-12
  gene_symbol: fruA
  gene_review: genes/ECOLI/fruA/fruA-ai-review.yaml
subfamilies:
