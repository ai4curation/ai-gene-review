term_assessments:
- assessed_term:
    id: GO:0090563
    label: protein-phosphocysteine-sugar phosphotransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Phosphocysteine-dependent phosphorylation of the translocated sugar is the
    defining mechanism of the type-2 EIIB-EIIC enzyme II, shared by fructose, mannose
    and mannosyl-glycerate members.
  supported_by:
  - reference_id: PMID:8626640
    supporting_text: A mutant FruBC
      derivative with cysteine 112 replaced by serine (C112S FruBC) was inactive as a
      phosphoryl carrier and a sugar transport protein.
- assessed_term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  scope: FAMILY_WIDE
  scope_reason: Every member is an enzyme II component of a PEP-dependent sugar PTS.
  supported_by:
  - reference_id: file:ECOLI/fruA/fruA-uniprot.txt
