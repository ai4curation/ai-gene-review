family_id: PANTHER:PTHR30505
family_name: FRUCTOSE-LIKE PERMEASE
preferred_name: Fructose-family PTS enzyme II EIIB-EIIC transporters (FruA, ManP, MngA and fructose-like Frv/Frw/Fry permeases)
summary: >-
  Bacterial (and haloarchaeal) membrane enzyme II components of the
  phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS) of the
  fructose-mannitol superfamily. Members carry a type-2 EIIC translocation domain and
  one or two type-2 EIIB domains (sometimes also an EIIA domain); the EIIB domain is
  phosphorylated on a cysteine by a phospho-histidine EIIA donor and transfers the
  phosphoryl group to the sugar as EIIC moves it across the cytoplasmic membrane.
  The founding members are fructose-specific EIIB'BC permeases (FruA of E. coli,
  P. putida, Xanthomonas and Rhodobacter), which form fructose 1-phosphate, but the
  family also contains the B. subtilis mannose permease ManP, the E. coli
  2-O-alpha-mannosyl-D-glycerate permease MngA, and the E. coli fructose-like
  permeases FrvB, FrwBCD and FryBC whose substrates are not established.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The transport mechanism, phosphocysteine-dependent sugar phosphorylation coupled to
  translocation, is shared by every characterized member, as are the membrane
  location and the PTS process. The transported sugar is not: fructose, mannose and
  mannosyl-glycerate permeases are interleaved in the same subfamilies, so
  substrate-specific transporter terms cannot be read from the family or subfamily id.
