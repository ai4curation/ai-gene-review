- assessed_term:
    id: GO:0090582
    label: protein-phosphocysteine-D-fructose-phosphotransferase system transporter activity
  scope: UNRESOLVED
  scope_reason: >-
    Fructose specificity is established for E. coli FruA (SF32) and the fructose PTS of
    P. putida KT2440 (FruA in SF0), but fructose permeases share SF0 with the mannose
    permease ManP and uncharacterized fructose-like permeases, and SF28 with the
    mannosyl-glycerate permease MngA. Sugar specificity is set by the EIIC binding site,
    for which no curated residue rule exists, so the fructose-specific activity must be
    judged per member. Missing evidence: a specificity-determining EIIC site, or
    substrate assays for the Frv, Frw and Fry permeases.
  supported_by:
  - reference_id: PMID:8626640
    supporting_text: The fructose permease of Escherichia coli, the fructose-specific Enzyme II of
      the phosphoenolpyruvate-dependent phosphotransferase system (PTS), contains a
      duplicated IIB domain.
  - reference_id: PMID:18296519
    supporting_text: Two of these PTS constituents (FruA and FruB) form a complete
      system for fructose intake.
  - reference_id: file:interpro/panther/PTHR30505/PTHR30505-entries.csv
    supporting_text: O31645,PTS system mannose-specific EIIBCA component,protein
- assessed_term:
    id: GO:0022877
    label: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
  scope: UNRESOLVED
  scope_reason: >-
    This is the enzyme II-level fructose term mapped from the overall reaction
    (RHEA:49252, phospho-histidine donor). It is substrate-specific in the same way as
    GO:0090582 and cannot be granted by subfamily for the same reason: fructose,
    mannose and mannosyl-glycerate permeases are interleaved in SF0 and SF28. Missing
    evidence: a specificity-determining EIIC site.
  supported_by:
  - reference_id: file:ECOLI/fruA/fruA-uniprot.txt
    supporting_text: Reaction=D-fructose(out) + N(pros)-phospho-L-histidyl-[protein] = D-
