notes: Module selector requires fructose specificity and the fused EIIB-type/EIIC architecture. Two EIIB-like
  regions do not establish two catalytic transfers, and a missing catalytic cysteine in one lineage cannot
  be assumed in all others. Net histidyl-donor and terminal phosphocysteine-donor activities refer to
  different reaction boundaries. PAINT placements were not reassigned from this membership comparison.
  This is a completed review of applicability to the fused-fructose module; the explicit unresolved family-wide
  partitions and PAINT-node placement are not asserted as settled.
