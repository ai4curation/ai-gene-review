term_assessments:
- assessed_term:
    id: GO:0022877
    label: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
  scope: UNRESOLVED
  scope_reason: 'Supported for the reviewed fructose transport systems, with subunit versus complete-protein
    semantics kept explicit. It is not a family-wide substrate claim: MngA transports mannosyl-glycerate,
    and SF0 includes separate archaeal components. Neither the subfamily boundary nor the family name
    alone specifies the fused transporter required by this module.'
  supported_by:
