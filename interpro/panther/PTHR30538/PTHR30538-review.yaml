family_id: PANTHER:PTHR30538
family_name: LYSINE 2,3-AMINOMUTASE-RELATED
preferred_name: KamA-family radical SAM amino-acid 2,3-aminomutases
summary: >-
  Radical SAM, pyridoxal 5'-phosphate-dependent aminomutases of the KamA family
  that migrate the alpha-amino group of a free amino acid to C3. Members include
  the clostridial lysine 2,3-aminomutase KamA that makes (3S)-beta-lysine for
  lysine fermentation, the archaeal AblA that makes beta-lysine for
  N-epsilon-acetyl-beta-lysine osmolyte synthesis, a Clostridioides glutamate
  2,3-aminomutase, and the gammaproteobacterial EpmB (YjeK), which produces the
  (R)-beta-lysine that EpmA then ligates onto Lys34 of elongation factor P. All
  members bind a [4Fe-4S] cluster and S-adenosyl-L-methionine as the source of
  the 5'-deoxyadenosyl radical.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The chemistry (radical SAM/PLP 2,3-aminomutase) is shared family-wide, but the
  substrate and the product stereochemistry differ between members: EpmB yields
  (R)-beta-lysine, the clostridial KamA yields the (3S) enantiomer, and
  C. difficile Eam acts on glutamate rather than lysine. Downstream biology
  differs accordingly (EF-P activation, lysine fermentation, osmolyte synthesis).
reference_protein:
  id: UniProtKB:P39280
  label: L-lysine 2,3-aminomutase
  gene_symbol: epmB
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/epmB/epmB-ai-review.yaml
