node_assessments:
  - node_id: PANTHER:PTN000776770
    asserted_term:
      id: GO:0016869
      label: intramolecular aminotransferase activity
    node_taxon:
      id: NCBITaxon:2
      label: Bacteria
    evidence: IBD
    negated: false
    paint_snapshot: "20240912"
    seeds:
      - id: UniProtKB:P39280
        label: L-lysine 2,3-aminomutase
        gene_symbol: epmB
        organism: Escherichia coli K-12
        gene_review: genes/ECOLI/epmB/epmB-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      The 2,3-aminomutase chemistry is the defining activity of the KamA family,
      so placing the general intramolecular aminotransferase parent at a
      bacteria-scoped node is correct. The node is seeded by EpmB itself, which
      is the expected marker that experimental grounding exists on the seed. Note
      that the parent term is deliberately general: the specific child
      GO:0050066 (L-lysine 2,3-aminomutase activity) is defined by the (3S)
      product of the clostridial enzyme and does not describe EpmB, whose product
      is (R)-beta-lysine, so the node should not be refined to GO:0050066
      family-wide.
    supported_by:
      - reference_id: PMID:17042480
        supporting_text: >-
          The product of the E. coli enzyme is (R)-beta-lysine, the enantiomer of the
          clostridial product.
  - node_id: PANTHER:PTN000776770
    asserted_term:
      id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
    node_taxon:
      id: NCBITaxon:2
      label: Bacteria
    evidence: IBD
    negated: false
    paint_snapshot: "20240912"
    seeds:
      - id: UniProtKB:P39280
        label: L-lysine 2,3-aminomutase
        gene_symbol: epmB
        organism: Escherichia coli K-12
        gene_review: genes/ECOLI/epmB/epmB-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      Every KamA-family member carries the radical SAM CxxxCxxC motif and binds a
      [4Fe-4S] cluster, which is mechanistically required to generate the
      5'-deoxyadenosyl radical. The E. coli epmB gene review accepts GO:0051539
      on direct evidence.
term_assessments:
  - assessed_term:
      id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
    scope: FAMILY_WIDE
    scope_reason: >-
      The radical SAM [4Fe-4S] cluster is required by the shared aminomutase
      mechanism and the binding motif is conserved across the family.
    supported_by:
      - reference_id: file:ECOLI/epmB/epmB-uniprot.txt
        supporting_text: "/ligand=\"[4Fe-4S] cluster\""
  - assessed_term:
      id: GO:0050066
      label: L-lysine 2,3-aminomutase activity
    scope: UNRESOLVED
    scope_reason: >-
      GO:0050066 is defined by the (3S)-beta-lysine-forming reaction of the
      clostridial enzyme. It fits KamA, but not EpmB, whose product is
      (R)-beta-lysine (the enantiomer), and not the glutamate 2,3-aminomutase
      Eam. No GO term currently exists for the (R)-forming reaction (RHEA:44148),
      so the epmB gene review proposes one rather than using GO:0050066. Which
      uncharacterized members form which enantiomer is not established.
    supported_by:
      - reference_id: PMID:17042480
        supporting_text: >-
          The product of the E. coli enzyme is (R)-beta-lysine, the enantiomer of the
          clostridial product.
