notes: >-
  Reviewed because E. coli EpmB, the (R)-beta-lysine supplier for EF-P
  beta-lysylation in the efp_translation_stall_rescue module, belongs to this
  family. PTHR30538 is too broad and too stereochemically mixed to ground the
  EF-P activation step: the same subfamily (SF1) holds both the EF-P-dedicated
  EpmB orthologs and the metabolic (3S)-forming KamA enzymes. The module
  therefore names EpmB as a concrete UniProt gene product (UniProtKB:P39280) and
  grounds that step on no family or signature. The signatures that do pick out the
  EF-P-dedicated EpmB orthologs, should signature-level grounding ever be wanted,
  are NCBIfam TIGR03821 (EFP_modif_epmB) and InterPro IPR022462 (EpmB), both from
  this entry's own DR lines; the module does not currently use them.
