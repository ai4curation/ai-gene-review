- assessed_term:
    id: GO:0004595
    label: pantetheine-phosphate adenylyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    The term applies to members with the PPAT (cytidylyltransferase-like) domain: COASY and the
    PPAT-only proteins of the eukaryotic clade under PTN000708653 (CAB4, S. pombe SPAC1F12.08, plant
    COAD/PPAT), and the archaeal CoaD Q5JHE8. It does not apply to the kinase-only majority, which
    includes bacterial CoaE, CAB5, S. pombe SPCC14G10.01 and DCAKD. Both groups sit in SF46, so no
    SUBFAMILY_ONLY grant fits. The correct scope is the clade marked by the PTN000708653 IBD, which
    is sound. The module's use of the whole family PTHR10695 as the selector for the fused-COASY PPAT
    is too broad as a family assertion. It is valid only together with the COASY exemplar and node
    PTN000708653.
  supported_by:
  - reference_id: PMID:11994049
    supporting_text: >-
      The final two enzymes in the CoA biosynthetic pathway, phosphopantetheine adenylyltransferase
      (PPAT; EC 2.7.7.3) and dephospho-CoA kinase (DPCK; EC 2.7.1.24), are separate proteins in
      prokaryotes
  - reference_id: PMID:19266201
    supporting_text: Null mutants could be complemented by their bacterial counterparts coaBC, coaD and coaE, respectively.
  - reference_id: file:interpro/panther/PTHR10695/PTHR10695-paint.tsv
    supporting_text: "PTN000708653\tGO:0004595"
- assessed_term:
    id: GO:0015937
    label: coenzyme A biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member catalyses one of the last two steps of CoA synthesis. The kinase-domain members
    phosphorylate dephospho-CoA, and the PPAT-only members make dephospho-CoA. The process IBA from
    PTN000075336 is therefore correct even for CAB4-type proteins, whose kinase IBA from the same node
    is wrong. The CAB4 and CAB5 gene reviews both accept it.
  supported_by:
  - reference_id: PMID:23789928
    supporting_text: >-
      In the yeast Saccharomyces cerevisiae, products of five essential genes CAB1-CAB5 (coenzyme A
      biosynthesis) are required to catalyze CoA biosynthesis.
- assessed_term:
    id: GO:0005759
    label: mitochondrial matrix
  scope: UNRESOLVED
  scope_reason: >-
    PAINT places this cellular component at PTN000075343 (Deuterostomia), with human COASY as the only
    seed. The term reaches COASY orthologs only. Where COASY sits inside or on mitochondria is
    disputed (outer membrane in Reactome, matrix/inner membrane in UniProt), and the human COASY review
    keeps the mitochondrial matrix as a real but non-core location, with most CoA synthesis being
    cytosolic. Fungal CAB5 is on the cytosolic face of the outer membrane, and fungi are outside the
    node. No family-level localization claim is made.
