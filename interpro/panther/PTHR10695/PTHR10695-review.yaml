family_id: PANTHER:PTHR10695
family_name: DEPHOSPHO-COA KINASE-RELATED
preferred_name: Dephospho-CoA kinase (CoaE) family, including bifunctional CoA synthase and PPAT-only relatives
summary: >-
  The family is built around the dephospho-CoA kinase (DPCK, CoaE) domain, which phosphorylates the
  3'-hydroxyl of dephospho-CoA in the last step of coenzyme A synthesis. Bacteria, plants and fungi
  mostly have a standalone CoaE (E. coli CoaE, S. cerevisiae CAB5, S. pombe SPCC14G10.01). Animals
  fuse a phosphopantetheine adenylyltransferase (PPAT) domain to the kinase in the bifunctional CoA
  synthase COASY, which catalyses the last two steps. PANTHER classifies whole proteins, so the
  PPAT-only relatives of the COASY PPAT region are placed in this family as well: budding-yeast CAB4,
  fission-yeast SPAC1F12.08, plant COAD/PPAT proteins and an archaeal CoaD (Thermococcus TK2128).
  These carry only the cytidylyltransferase-like PPAT domain and no kinase domain. Vertebrates also
  have DCAKD, a kinase-domain protein of uncertain function.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Dephospho-CoA kinase activity and CoA biosynthesis are shared by every member that has the CoaE
  domain. The exception is a set of PPAT-only proteins that PANTHER places in the same subfamily:
  CAB4 (P53332), S. pombe SPAC1F12.08 (Q10350), Arabidopsis COAD (Q9ZPV8), rice PPAT2 (B9F2L1), the
  rice SF56 member PPAT1 (Q6ZLC4) and Thermococcus CoaD (Q5JHE8). Their UniProt Pfam content is
  CTP_transf_like (PF01467) only, with no CoaE (PF01121) domain. They catalyse the preceding step
  (PPAT), not the kinase step. The PPAT activity, in turn, is not a family property: bacterial CoaE,
  CAB5 and DCAKD have no PPAT domain. Almost the whole family is one PANTHER subfamily (SF46), so
  neither activity can be scoped by subfamily label.
