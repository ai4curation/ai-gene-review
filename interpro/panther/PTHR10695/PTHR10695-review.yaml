term_assessments:
- assessed_term:
    id: GO:0004140
    label: dephospho-CoA kinase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the activity that defines the family, carried by the CoaE domain. It is established
    experimentally for E. coli CoaE and for the kinase domain of COASY, and it is the core function of
    S. cerevisiae CAB5 and P. putida CoaE. The family includes PPAT-only proteins that have no kinase
    domain. They are listed as member exceptions, anchored to the NEEDS_PRUNING assessment of
    PTN000075336. DCAKD is a seed of the node and keeps the term here. Whether it is a physiological
    CoA-pathway kinase in vivo is not settled by this review.
  member_exceptions:
  - member:
      id: UniProtKB:P53332
      label: Phosphopantetheine adenylyltransferase
      gene_symbol: CAB4
      organism: Saccharomyces cerevisiae
      gene_review: genes/yeast/CAB4/CAB4-ai-review.yaml
    exception_reason: >-
      CAB4 is a PPAT-only protein (Pfam CTP_transf_like, no CoaE domain). Yeast's dephospho-CoA
      kinase is the separate protein CAB5. Bacterial coaD, not coaE, complements the cab4 null.
