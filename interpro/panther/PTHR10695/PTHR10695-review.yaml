    label: DCAKD
    organism: Homo sapiens
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    All seeds have the CoaE kinase domain, and the node is right for the kinase-domain proteins: E.
    coli CoaE, CAB5, S. pombe SPCC14G10.01, COASY and the plant DPCK. In the PAINT GAF, the IBA from
    this node also reaches PPAT-only members that have no kinase domain: S. cerevisiae CAB4 (P53332),
    S. pombe SPAC1F12.08 (Q10350), Arabidopsis COAD (Q9ZPV8), rice PPAT1 (Q6ZLC4, SF56) and PPAT2
    (B9F2L1), and Thermococcus kodakarensis CoaD (Q5JHE8). Their UniProt Pfam content is
    CTP_transf_like (PF01467) only. The eukaryotic PPAT-only proteins sit under PTN000708653 together
    with COASY, so they lost or never acquired the kinase region after splitting from a COASY-type
    ancestor. An IRD/NOT for GO:0004140 is needed on the PPAT-only branches. The CAB4 gene review
    already removes this IBA. The process term GO:0015937 from the same node remains correct for these
    proteins, because PPAT is also a CoA biosynthesis step.
