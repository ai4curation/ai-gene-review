notes: >-
  Descendant lists come from the PAINT UniProt GAF (.cache/panther/gene_association.paint_uniprot.gaf.gz).
  Domain content of members without in-repo files (Q9ZPV8, Q5JHE8, Q6ZLC4, B9F2L1, Q8WVC6) was
  checked against UniProtKB on 2026-10-06. Thermococcus CoaD Q5JHE8 receives the GO:0004140 IBA from
  PTN000075336 but not the PPAT IBA from PTN000708653, because it is outside the eukaryotic clade.
  Module observations (coenzyme_a_biosynthesis): (1) the fused-COASY PPAT annoton uses the whole
  family PTHR10695 as its selector, but most members have no PPAT domain; PTN000708653 is the
  correct scope. (2) The Cab4-type annoton uses SF46, which is effectively the whole family and is
  mostly kinases, so it is not more specific than the family. (3) The module's statement that
  GO:0004140 is not adopted for Cab4-type proteins agrees with this review. The S. pombe GO-CAM
  activity that gives GO:0004140 to cab4 should be corrected. The S. pombe cab4 review (COMPLETE) removes the
  GO:0004140 IBA and accepts GO:0015937. The S. pombe cab5 review (COMPLETE) accepts both, which
  agrees with this review.
