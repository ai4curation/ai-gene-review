family_id: PANTHER:PTHR33542
family_name: SIROHYDROCHLORIN FERROCHELATASE, CHLOROPLASTIC
preferred_name: SirB/CbiX class II chelatase family
summary: >-
  Class II chelatases that insert a metal into sirohydrochlorin. Plant and some bacterial SirB enzymes
  insert Fe2+ to make siroheme. Archaeal and bacterial CbiX enzymes insert Co2+ for cobalamin synthesis,
  and some act on both metals.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are sirohydrochlorin chelatases; metal preference (iron or cobalt) is not resolved
  by subfamily (all Swiss-Prot entries are in SF3).
subfamilies:
