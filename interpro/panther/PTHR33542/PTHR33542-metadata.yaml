  name:
    name: Sirohydrochlorin Cobaltochelatase/CbiX
    short: Sirohydro_Cobaltochel/CbiX
  description:
  - text: The CbiX family proteins are involved in the anaerobic biosynthesis of cobalamin
      (vitamin B12) and the unique nickel-containing tetrapyrrole coenzyme F430. Members
      of the family catalyze the insertion of Co(2+) or Ni(2+) into sirohydrochlorin
      to yield cobalt-sirohydrochlorin or Ni-sirohydrochlorin, respectively. These
      steps are crucial for the production of cobalamin and coenzyme F430, the latter
      being the prosthetic group of methyl-coenzyme M reductase (MCR), essential for
      methanogenesis and anaerobic methane oxidation. Some subfamilies, such as the
      SirB subfamily, are involved in siroheme biosynthesis, catalyzing the chelation
      of iron into the siroheme precursor. The CbiX family displays a diversity of
      domain arrangements and may contain additional features such as an [Fe-S] cluster,
      which plays a regulatory role in iron, sulfur, and tetrapyrrole metabolism.
