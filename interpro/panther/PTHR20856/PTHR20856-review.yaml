family_id: PANTHER:PTHR20856
family_name: DNA-DIRECTED RNA POLYMERASE I SUBUNIT 2
preferred_name: Multisubunit RNA polymerase second-largest subunit family (bacterial beta, archaeal Rpo2,
  eukaryotic RPA2/RPB2/RPC2)
summary: Pan-domain family of the second-largest subunit of multisubunit DNA-directed RNA polymerases.
  It contains bacterial beta (rpoB), plastid PEP beta, archaeal Rpo2 (split into Rpo2N/Rpo2C in some lineages),
  the eukaryotic Pol I, II and III subunits RPA2, RPB2 and RPC2, plant Pol IV/V paralogs, and poxvirus
  and other large DNA virus homologs. The PANTHER family name is taken from one eukaryotic paralog, but
  the family is dominated by bacterial rpoB. Every member forms half of the active-centre cleft with the
  largest subunit (PTHR19376), contributing the RNA-DNA hybrid binding surface, NTP contacts and the RNA
  exit-channel flap; in bacteria it carries the rifampicin-binding pocket. E. coli K-12 RpoB (P0A8V2)
  is the experimentally best-characterised bacterial member.
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'The molecular function (contribution to DNA-directed RNA polymerase activity as an
  active-centre subunit) and the process (DNA-templated transcription and elongation) are conserved across
  all domains. What diverges is the polymerase each member belongs to: the bacterial single RNAP (GO:0000345),
  plastid PEP, archaeal RNAP, and the eukaryotic Pol I, II and III (and plant IV/V) complexes with their
  distinct transcript classes. PAINT places each of these at lineage-restricted nodes. UniProt assigns
  no PANTHER subfamily to the bacterial, archaeal, human or yeast members checked (P0A8V2, Q88QP2, P37870,
  Q980R1, P30876, Q9H9Y6, Q9NW08, P08518), although PANTHER''s own 19.0 classification files place E.
  coli and B. subtilis rpoB in subfamily SF20. Bacterial and plastid rpoB is spread over several subfamilies
  that PANTHER names ''DNA-DIRECTED RNA POLYMERASE SUBUNIT BETA'' (SF20, SF22, SF23, SF26, SF29, SF31,
  SF32), and P. putida rpoB resolves only to the family, so the pan-bacterial beta role is grounded at
  the family level and the divergence is recorded through the PAINT nodes.'
