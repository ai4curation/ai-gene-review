notes: 'Curated with the bacterial_rna_polymerase_core module. Member gene reviews: E. coli K-12 rpoB
  (P0A8V2), P. putida KT2440 rpoB (Q88QP2), B. subtilis 168 rpoB (P37870) and Populus trichocarpa plastid
  rpoB (A4GYQ0). The module grounds beta at the family level: UniProt assigns no subfamily, and PANTHER''s
  SF20 placement covers E. coli and B. subtilis but not P. putida rpoB. Eukaryotic and archaeal members
  were not individually reviewed; their node verdicts rest on the PAINT seeds and on the fact that the
  lineage nodes do not propagate to bacteria.'
