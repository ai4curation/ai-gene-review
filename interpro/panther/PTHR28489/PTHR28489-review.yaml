notes: >-
  The PAINT slice was fetched with just fetch-panther-paint on 2026-11-27 and holds one node row: an IBD
  of retina development in camera-type eye at PTN008623184 (Tetrapoda, dated 2017-12-22), seeded by mouse
  Rd3. PAINT propagates nothing for the cyclase inhibitor activity or the cyclase-trafficking role, which
  are the real RD3 functions; they are assessed here as safe for SF1 only. RD3L and the other RD3-like
  subfamilies have no gene review and no experimental data, which is why coherence is UNKNOWN. The
  PANTHER tree was not inspected; the node's clade was read from the PAINT GAF propagation set.
