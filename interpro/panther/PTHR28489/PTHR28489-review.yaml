family_id: PANTHER:PTHR28489
family_name: RENTINAL DEGENERATION 3-LIKE
summary: >-
  Small helical proteins related to RD3 (retinal degeneration protein 3). The characterized member, RD3
  (subfamily SF1), is a non-enzymatic four-helix-bundle protein of photoreceptors that binds the retinal
  membrane guanylyl cyclases RetGC1 and RetGC2, inhibits their basal and GCAP-stimulated activity, and is
  needed for the cyclases to leave the endoplasmic reticulum and reach the outer segment. Loss of RD3
  causes photoreceptor degeneration after normal retinal development. The RD3-like subfamilies, which
  include human RD3L (SF3), are uncharacterized.
functional_coherence: UNKNOWN
coherence_reason: >-
  Only one subfamily, SF1 (RD3), has experimental characterization; its function as a guanylyl cyclase
  inhibitor and trafficking partner is established in human recombinant proteins and in the rd3 mouse.
  No function is known for the RD3-like members (RD3L in SF3, and SF2 and SF4), so whether they share the
  cyclase-directed function cannot be judged. The official PANTHER family name carries the misspelling
  "RENTINAL".
reference_protein:
  id: UniProtKB:Q7Z3Z2
  label: Protein RD3
  gene_symbol: RD3
  organism: Homo sapiens
