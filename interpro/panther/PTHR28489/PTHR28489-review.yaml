term_assessments:
- assessed_term:
    id: GO:0060041
    label: retina development in camera-type eye
  scope: NOT_APPLICABLE
  scope_reason: >-
    The single PAINT IBD in the family asserts this term at a tetrapod RD3 node, seeded by the mouse Rd3
    annotation that rests on the rd3 degeneration phenotype. The rd3 retina develops normally and then
    loses its photoreceptors, so the phenotype is a failure of photoreceptor maintenance rather than of
    development. The RD3 gene review MODIFIES the IBA to retina homeostasis (GO:0001895). No evidence
    places any RD3-like member in retinal development either.
  supported_by:
  - reference_id: PMID:21078983
    supporting_text: The retina of homozygous rd3 mice develop normally through postnatal day 14
  - reference_id: file:genes/human/RD3/RD3-ai-review.yaml
    supporting_text: The claim is better expressed as retina homeostasis
- assessed_term:
    id: GO:0001895
    label: retina homeostasis
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The replacement the RD3 gene review proposes for the developmental IBA. RD3 keeps photoreceptors alive
    by preventing GCAP-driven activation of the retinal guanylyl cyclase while the cyclase is in the inner
    segment; the evidence is from the rd3 mouse and the rcd2 dog and LCA12 patients, all in SF1. It would
    be sound at the tetrapod RD3 node that now carries the developmental term, but not family-wide, since
    the RD3-like subfamilies are uncharacterized.
  applicable_subfamilies:
  - id: PANTHER:PTHR28489:SF1
    label: PROTEIN RD3
  supported_by:
  - reference_id: PMID:33539922
    supporting_text: the cyclase remaining in the inner segment becomes unprotected against activation by
      GCAPs, and this triggers the apoptotic process
- assessed_term:
    id: GO:0030251
    label: guanylate cyclase inhibitor activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The core molecular function of RD3 (SF1), shown with human recombinant RD3 and RetGC1 and supported by
    the rd3 mouse. PAINT does not propagate it. No RD3-like member has been tested for cyclase binding or
    inhibition, so the term is safe only for SF1.
  applicable_subfamilies:
  - id: PANTHER:PTHR28489:SF1
    label: PROTEIN RD3
  supported_by:
  - reference_id: PMID:21928830
    supporting_text: We find that RD3 acts as a high-affinity allosteric inhibitor of RetGC, capable of both
      effectively competing with GCAPs and suppressing the catalytic activity of the cyclase.
- assessed_term:
    id: GO:1903546
    label: protein localization to photoreceptor outer segment
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    RD3 is needed for the retinal guanylyl cyclases to exit the endoplasmic reticulum and reach rod and
    cone outer segments, and RD3 gene delivery restores cyclase localization in the rd3 mouse. Shown only
    for RD3 (SF1); PAINT does not propagate it.
  applicable_subfamilies:
  - id: PANTHER:PTHR28489:SF1
    label: PROTEIN RD3
  supported_by:
  - reference_id: PMID:21078983
    supporting_text: Cell expression studies show that RD3 mediates the export of GC1 from the endoplasmic
      reticulum to endosomal vesicles, and that the C terminus of GC1 is required for RD3 binding.
  - reference_id: PMID:23740938
    supporting_text: RD3 plays an essential role in the exit of guanylate cyclase from the ER
node_assessments:
- node_id: PANTHER:PTN008623184
  asserted_term:
    id: GO:0060041
    label: retina development in camera-type eye
  evidence: IBD
  assessment: WRONG_NODE
  assessment_reason: >-
    The node is a tetrapod RD3 node: in the PAINT GAF its propagation set is RD3 orthologues only, from
    mammals, birds, reptiles and frogs, with no RD3L. The lineage is right for an RD3 function, but the
    seed (mouse Rd3, MGI:1921273) does not support the asserted term at this or any node: the rd3 mouse
    retina develops normally and then degenerates, so the seed phenotype is loss of photoreceptor
    maintenance, not a developmental defect. Retina homeostasis would be sound at this node for the RD3
    clade. The human RD3 gene review MODIFIES the inherited row accordingly.
