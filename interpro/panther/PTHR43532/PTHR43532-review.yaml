family_id: PANTHER:PTHR43532
family_name: GLUCOSE-1-PHOSPHATE THYMIDYLYLTRANSFERASE
preferred_name: RmlA/RffH glucose-1-phosphate thymidylyltransferase family
summary: >-
  PTHR43532 is the bacterial family of glucose-1-phosphate thymidylyltransferases (RmlA, EC 2.7.7.24).
  These Mg(2+)-dependent homotetrameric nucleotidyltransferases condense dTTP with alpha-D-glucose 1-phosphate
  to form dTDP-alpha-D-glucose and diphosphate, the first committed step of dTDP-L-rhamnose biosynthesis
  and the entry point for many other dTDP-linked deoxysugars. The best characterised member is E. coli
  K-12 RfbA (RmlA1), whose kinetics and crystal structures establish a sequential ordered bi-bi mechanism.
  PANTHER splits the family into two subfamilies: SF1, the O-antigen/rhamnose-cluster RmlA enzymes found
  across bacteria (Enterobacteria, Pseudomonas, Mycobacterium, Bacillus, Streptococcus), and SF4, the
  RffH (RmlA2) paralogs of Enterobacteria and Neisseria, which supply dTDP-glucose for enterobacterial
  common antigen and other glycans. Reviewed members from antibiotic and acarbose clusters (Streptomyces
  NovV, Actinoplanes AcbA) carry the same activity and channel the product into secondary metabolism.
functional_coherence: COHERENT
coherence_reason: >-
  Every reviewed member is named and, where assayed, characterised as a glucose-1-phosphate thymidylyltransferase;
  the two subfamilies differ in which downstream glycan their gene cluster feeds, not in catalytic activity.
