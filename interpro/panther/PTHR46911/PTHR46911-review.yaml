family_id: PANTHER:PTHR46911
family_name: FAMILY NOT NAMED
preferred_name: 2-isopropylmalate synthase, LeuA dimeric/long-form family (Dikarya LEU4/LEU9/leu3 and actinobacterial/proteobacterial LeuA)
summary: >-
  2-Isopropylmalate synthases (alpha-IPMS, EC 2.3.3.13) condense acetyl-CoA with
  3-methyl-2-oxobutanoate (2-oxoisovalerate) to give (2S)-2-isopropylmalate. This is the first
  committed step of the leucine branch, and leucine feedback-inhibits it. This PANTHER family
  holds the long-form LeuA enzymes of Actinobacteria and several Proteobacteria (Corynebacterium,
  Mycobacterium, Pseudomonas) and the alpha-IPMS of ascomycete and basidiomycete fungi. The
  E. coli-type LeuA and the plant IPMS/MAM enzymes are in a different family (PTHR10277). In
  budding yeast the paralogs LEU4 and LEU9 form leucine-sensitive (Leu4) and leucine-resistant
  (Leu9) homodimers and also Leu4-Leu9 heterodimers. LEU4 makes a long mitochondrial form and a
  short cytosolic form from alternative translation starts. S. pombe leu3 is the only known
  fission-yeast IPMS. The Dikarya gene appears to have been acquired separately from the gene
  of zygomycetes and chytrids, which groups with plant and photosynthetic-bacterial homologs.
  The family also contains IPMS-like paralogs from secondary-metabolite gene clusters of
  filamentous fungi: htyA (L-homotyrosine for echinocandin B) and AMT7 (AM-toxin).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  2-Isopropylmalate synthase activity is the shared function. The exceptions are the
  secondary-metabolism paralogs in SF1. Aspergillus htyA is predicted to condense acetyl-CoA
  with 4-hydroxyphenylpyruvate for L-homotyrosine (echinocandin B), and its deletion abolishes
  echinocandin production. Alternaria AMT7 is a probable IPMS assigned to the AM-toxin cluster.
  Neither is part of primary leucine biosynthesis. PANTHER's two subfamilies do not follow
  evolutionary origin: SF1 holds bacteria together with S. pombe leu3 and the
  secondary-metabolism paralogs, while SF2 holds only S. cerevisiae LEU4/LEU9. The PAINT Dikarya
  node PTN000814652 spans both subfamilies.
