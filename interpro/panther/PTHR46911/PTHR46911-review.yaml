notes: >-
  PANTHER's official family name is literally "FAMILY NOT NAMED". The E. coli-type LeuA (P09151)
  and Arabidopsis MAM1/MAM3 are in PTHR10277, not here, according to the PANTHER inventories.
  K0E4E5 is in the reviewed inventory under the organism name Aspergillus pachycristata (the
  echinocandin producer, also called Emericella rugulosa). The S. pombe leu3 gene review still
  has its IBAs at PENDING.
