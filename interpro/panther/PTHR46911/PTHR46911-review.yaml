term_assessments:
- assessed_term:
    id: GO:0003852
    label: 2-isopropylmalate synthase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterized primary-metabolism member is an IPMS. The secondary-metabolism SF1
    paralogs are named isopropyl malate synthases in UniProt. For htyA the predicted
    physiological substrate is 4-hydroxyphenylpyruvate rather than 2-oxoisovalerate, which is
    not enough to declare the IPMS activity absent, so no exception is recorded for the
    activity. The module selects both SF1 and SF2 for this annoton, which is correct, because
    S. pombe leu3 and S. cerevisiae LEU4/LEU9 are in different subfamilies.
  supported_by:
