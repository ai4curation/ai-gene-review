family_id: PANTHER:PTHR43000
family_name: DTDP-D-GLUCOSE 4,6-DEHYDRATASE-RELATED
preferred_name: NAD(P)-dependent nucleotide-sugar epimerase/dehydratase superfamily (RmlB-related)
summary: >-
  PTHR43000 is a large extended-SDR family of NAD(P)-dependent enzymes that modify nucleotide-linked sugars,
  named after dTDP-glucose 4,6-dehydratase (RmlB, EC 4.2.1.46). Its members use a tightly bound NAD(+)
  and a Tyr/Lys/Thr(Ser) triad to oxidise, dehydrate, epimerise or reduce sugar nucleotides. The bacterial
  RmlB/RffG dehydratases (E. coli RfbB and RffG, Salmonella and B. subtilis RmlB, M. tuberculosis RmlB)
  convert dTDP-glucose to dTDP-4-dehydro-6-deoxyglucose, the branch point of dTDP-L-rhamnose and many
  other dTDP-deoxysugars. The same family contains eukaryotic TGDS proteins (reviewed members named UDP-D-glucose
  4,6-dehydratase), the plant trifunctional RHM enzymes that make UDP-L-rhamnose, UDP-sulfoquinovose synthases
  (plant SQD1, cyanobacterial SqdB, archaeal Agl3), CDP-sugar enzymes of enterobacterial O-antigen clusters
  (CDP-glucose 4,6-dehydratase RfbG, CDP-abequose synthase, CDP-paratose 2-epimerase), GDP-6-deoxy-D-mannose
  reductase and GDP-6-deoxy-D-talose 4-dehydrogenase, dTDP-6-deoxy-L-talose 4-dehydrogenase, UDP-GlcNAcA
  4-epimerase WbpP, GalE-like 4-epimerases and fungal ERG26-type sterol 4-alpha-carboxylate 3-dehydrogenases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family spans dehydratases, epimerases, reductases and a sterol decarboxylating dehydrogenase acting
  on dTDP-, UDP-, CDP- and GDP-sugars. dTDP-glucose 4,6-dehydratase activity is established for the bacterial
  RmlB/RffG clade (node PTN000042046, subfamilies SF7 and SF47) but not for eukaryotic TGDS, plant RHM
  or SQD1 lineages, and the default subfamily SF7 itself contains bacterial RmlB, eukaryotic TGDS and
  many plant RHM-like leaves.
