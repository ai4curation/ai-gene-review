    The activity is established for the bacterial RmlB/RffG clade (node PTN000042046; subfamilies SF7
    and SF47) but not family-wide: the family also holds UDP-sugar dehydratases, sulfoquinovose synthases,
    CDP- and GDP-sugar enzymes and sterol dehydrogenases. A SUBFAMILY_ONLY scope cannot be given safely
    because SF7 also contains eukaryotic TGDS and plant RHM leaves, and the fetched member list carries
    no subfamily assignments to check each reviewed member against. Members of the bacterial RmlB/RffG
    clade, including E. coli RfbB and P. putida RffG, carry the term on their own evidence.
