  label: Nicotinate dehydrogenase subunit A
  gene_symbol: nicA
  organism: Pseudomonas putida KT2440
  gene_review: genes/PSEPK/nicA/nicA-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR44379:SF6
  label: BLR6046 PROTEIN
  description: >-
    Small subunits of the two-component nicotinate dehydrogenase NicAB of Pseudomonas, the entry
    enzyme of aerobic nicotinate degradation. NicA is the only Swiss-Prot member. Its partner, NicB
    (PTHR47495:SF1), fuses the molybdenum-cofactor domain and a cytochrome c domain, so electrons
    pass to cytochrome rather than to NAD+ or a quinone. The PANTHER subfamily name is a
    Bradyrhizobium locus tag and is not a functional claim.
  representative_members:
  - id: UniProtKB:Q88FX9
    label: Nicotinate dehydrogenase subunit A
    gene_symbol: nicA
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/nicA/nicA-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: file:PSEPK/nicA/nicA-uniprot.txt
    supporting_text: Note=Binds 2 [2Fe-2S] clusters per subunit.
  - reference_id: PMID:19118407
    supporting_text: The small subunit contains [2Fe2S] iron sulfur domain, while the large subunit contains
      domains of molybdenum cofactor and cytochrome c.
- subfamily_id: PANTHER:PTHR44379:SF5
  label: OXIDOREDUCTASE WITH IRON-SULFUR SUBUNIT
  description: >-
    Small chains of aerobic carbon monoxide dehydrogenase (CoxS/CutS), caffeine dehydrogenase (CdhC),
    6-hydroxypseudooxynicotine dehydrogenase (KdhB) and an archaeal glyceraldehyde dehydrogenase
    (CutC). These have different substrates but the same Fe-S relay role.
  representative_members:
  - id: UniProtKB:P19921
    label: Carbon monoxide dehydrogenase small chain
    gene_symbol: coxS
    organism: Afipia carboxidovorans OM5
  - id: UniProtKB:D7REY5
    label: Caffeine dehydrogenase subunit gamma
    gene_symbol: cdhC
    organism: Pseudomonas sp. CBB1
  diverged_from_family: false
  supported_by:
  - reference_id: file:interpro/panther/PTHR44379/PTHR44379-entries.csv
    supporting_text: P19921,Carbon monoxide dehydrogenase small chain,protein,504832
  - reference_id: file:interpro/panther/PTHR44379/PTHR44379-entries.csv
    supporting_text: D7REY5,Caffeine dehydrogenase subunit gamma,protein,765715
- subfamily_id: PANTHER:PTHR44379:SF8
  label: XANTHINE DEHYDROGENASE IRON-SULFUR-BINDING SUBUNIT XDHC-RELATED
  description: >-
    Mixed subfamily: small Fe-S subunits of xanthine dehydrogenase (E. coli XdhC), nicotinate
    dehydrogenase from Eubacterium barkeri (NdhS), nicotine 6-hydroxylase (NdhS of Paenarthrobacter)
    and 4-hydroxybenzoyl-CoA reductase (HcrC). Its nicotinate dehydrogenase member shows that
    nicotinate hydroxylation recruited small subunits from more than one subfamily, so SF6 is not
    the only small-subunit lineage serving this reaction.
  representative_members:
