family_id: PANTHER:PTHR44379
family_name: OXIDOREDUCTASE WITH IRON-SULFUR SUBUNIT
preferred_name: Small [2Fe-2S] subunits of molybdenum hydroxylases (CoxS, XdhC, NdhS, NicA-like)
summary: >-
  Small iron-sulfur subunits of bacterial and archaeal molybdenum-containing hydroxylases of the
  xanthine oxidase superfamily. Each member carries the two [2Fe-2S] clusters (one plant
  ferredoxin-type, one in the 2Fe-2S-binding domain typical of these enzymes) that relay electrons
  between the molybdopterin site of a partner large subunit and a terminal acceptor. Swiss-Prot
  members are the small chains of carbon monoxide dehydrogenase (CoxS/CutS), xanthine dehydrogenase
  (XdhC, PucE), caffeine dehydrogenase (CdhC), 4-hydroxybenzoyl-CoA reductase (HcrC), isoquinoline
  1-oxidoreductase (IorA), nicotine 6-hydroxylase and 6-hydroxypseudooxynicotine dehydrogenase from
  Paenarthrobacter, the Eubacterium barkeri nicotinate dehydrogenase small subunit, an archaeal
  glyceraldehyde dehydrogenase small chain, and Pseudomonas putida NicA. The substrate is set by the
  partner molybdenum subunit, not by this subunit, so the family is coherent as an electron-transfer
  module and heterogeneous in the overall reaction of the complex it joins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The [2Fe-2S] electron-relay role is shared by every characterized member. The substrates of the
  holoenzymes differ (carbon monoxide, xanthine, caffeine, nicotinate, nicotine, isoquinoline,
  4-hydroxybenzoyl-CoA, glyceraldehyde). Those substrates are properties of the partner large
  subunit, and PANTHER subfamilies are not a reliable proxy for them: SF8 combines xanthine
  dehydrogenase, nicotinate dehydrogenase, nicotine hydroxylase and 4-hydroxybenzoyl-CoA reductase
  small subunits. Only iron-sulfur cluster binding and an electron-transfer role in a molybdenum
  hydroxylase are family-wide.
reference_protein:
