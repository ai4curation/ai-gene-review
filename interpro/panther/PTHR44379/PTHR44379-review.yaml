notes: >-
  No PAINT IBD/IRD annotations exist for this family (`just fetch-panther-paint PTHR44379` retained no
  slice), so there are no node assessments. NicA is the reference protein because it is the
  family member with the most direct experimental evidence available in this corpus and its own gene
  review; CoxS is the best-characterized member overall but has no gene review here.
