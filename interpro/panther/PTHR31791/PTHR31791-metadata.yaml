  name:
    name: FRIGIDA regulatory complex component
    short: FRIGIDA_complex_component
  description:
  - text: This family of proteins is involved in the regulation of flowering time
      in plants. Members of this family are known to affect the expression of the
      'FLOWERING LOCUS C' gene, which is crucial for the timing of the transition
      from vegetative to reproductive development. Some proteins in this family can
      up-regulate FLC transcripts, contributing to a late-flowering phenotype, while
      others are inactive variants. The active members are involved in the formation
      and stabilization of protein complexes that modify chromatin structure, thereby
      influencing gene expression. The family includes both full-length and truncated
      proteins, with the latter typically being non-functional.
