family_id: PANTHER:PTHR30002
family_name: EPOXYQUEUOSINE REDUCTASE
preferred_name: QueG cobalamin-dependent epoxyqueuosine reductase family
summary: >-
  Bacterial QueG enzymes, related to the B12-dependent reductive dehalogenases
  of halorespiring bacteria. They reduce epoxyqueuosine at tRNA position 34 to
  queuosine using cob(II)alamin and two [4Fe-4S] clusters. E. coli QueG is the
  reference; the B. subtilis enzyme was assayed in vitro.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF4). Of the 32 reviewed members in the entries file, 31
  are named epoxyqueuosine reductase; the remaining one is an uncharacterized
  Geobacillus protein (P32815).
