review_date: '2026-11-12'
notes: 'DROME/Dic4: Q9VVS1, 302 aa, sequence version 1; cohorts FLY41. Source extracts preserve evidence
  codes, reviewed status and generated-description flags. PANTHER placement is a classification observation.
  Curated biological prose and member experiments inform the boundary, with unresolved coverage stated
  explicitly. No ancestral node placement or residue-loss projection is asserted without a checked tree/alignment
  and sequence anchor. Term assessments include functional-transfer hypotheses and are not a transcription
  of ProtNLM output; the cohort prediction snapshots remain authoritative about what was emitted.

  Update 2026-11-12 (BCAA module): added OAC1 (P32332) as reference protein, the SF18 Oac1 subfamily,
  the SF18-scoped GO:0034658 assessment, and assessments of the two PTN002515516 root rows. Placement
  of OAC1, oac1 and ucpA in PTHR45618:SF18 is from PANTHER 19.0''s own classification files (budding
  yeast, fission yeast, Dictyostelium) and agrees with the PAINT tree, whose PTHR45618 root node
  supplies their IBAs. UniProt DR PANTHER lines and the InterPro member inventory instead give
  PTHR45928:SF1, which is why these proteins are absent from PTHR45618-entries.csv; the
  disagreement is recorded in the PTHR45928 family review. Only the GO:0005743 and GO:0022857 rows
  of PTN002515516 are newly assessed here; apart from the PTN000642212 IRD, the other PAINT nodes
  of this family remain unassessed.'
