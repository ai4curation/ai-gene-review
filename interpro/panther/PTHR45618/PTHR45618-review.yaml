- assessed_term:
    id: GO:0034658
    label: isopropylmalate transmembrane transporter activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Oac1 subfamily only. Recombinant reconstituted S. cerevisiae Oac1 transports alpha-IPM with a
    Km of 75 uM, and loss of OAC1 causes a leucine requirement that becomes absolute together with
    loss of LEU4; the S. cerevisiae OAC1 gene review accepts the IDA annotation as core. The S.
    pombe oac1 gene review accepts the activity by orthology (ISO) with the leucine-pathway
    context of fission yeast; it has not been assayed for the pombe protein. SF18 also holds
    Dictyostelium ucpA, for which no transport data were reviewed. No other subfamily of this
    heterogeneous family has shown isopropylmalate transport, and the term must not be extended
    to PTHR45618 as a whole.
  applicable_subfamilies:
