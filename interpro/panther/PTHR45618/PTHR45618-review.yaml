    id: NCBITaxon:40674
    label: Mammalia
  assessment: LOSS_CONTRADICTED
  assessment_reason: >-
    This IRD NOT covers the mammalian UCP3 clade (15 leaves, all in PTHR45618:SF2 MITOCHONDRIAL
    TRANSPORTER UCP3-RELATED, including human, mouse and rat UCP3) and blocks the GO:0017077 IBD
    at PTN000642156 that PAINT seeded from MGI:98894, RGD:3931 and Arabidopsis AT3G54110. GO:0017077 is defined as proton
    transfer into the matrix that dissipates the gradient (proton leak); it does not require
    thermogenesis. The strongest data are loss-of-function: two independent Ucp3 knockout lines
    showed greatly reduced muscle mitochondrial proton leak and more tightly coupled muscle
    mitochondria, muscle overexpression lowers the ATP-synthesis/oxidation ratio in vivo, and UCP3
    depletion in HeLa cells raises mitochondrial ATP output. The literature is genuinely contested:
    the basal proton conductance of UCP3-null mitochondria was unchanged in other studies,
    overexpression can cause artefactual leak, and the knockouts show no thermogenic or obesity
    phenotype. The current consensus is that UCP3 mediates activator-dependent (fatty acid, lipid
    peroxidation product) rather than constitutive proton leak. That is still the activity the GO term
    describes, so the evidence argues against a clade-wide loss of the molecular function. What UCP3
    lacks relative to UCP1 is a major role in adaptive thermogenesis, which is a biological-process
    distinction and should not be expressed as a NOT on the uncoupler MF. PAINT also keeps UCP3 as a
    seed of the proton transmembrane transporter IBD (GO:0015078) at the same ancestral node. Verdict
    LOSS_CONTRADICTED, with moderate confidence because of the basal-versus-activated leak dispute.
    Note that the cached PTHR45618-paint.tsv slice predates this IRD row and does not yet list
    PTN000642212; the row is present in the IRD_EVIDENCE extraction of PAINT IBD.gaf.
