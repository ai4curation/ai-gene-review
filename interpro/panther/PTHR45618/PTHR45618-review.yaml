family_id: PANTHER:PTHR45618
family_name: MITOCHONDRIAL DICARBOXYLATE CARRIER-RELATED
summary: Mitochondrial carrier-related proteins use a repeated membrane-transport architecture to exchange
  diverse metabolites. Substrate specificity and physiological coupling differ among carrier branches.
functional_coherence: HETEROGENEOUS
coherence_reason: The mitochondrial-carrier fold accommodates different anions, metabolites and uncoupling
  mechanisms. Direct reconstitution of fly Dic paralogs found typical dicarboxylate transport by DmDic1,
  narrower phosphate/sulfur-substrate transport by DmDic3, and no detectable transport by DmDic4 in the
  tested substrate panel (PMID:21130726). The Dic4 negative result is bounded by that panel and assay
  system; it neither establishes universal inactivity nor provides positive evidence for thiamine-pyrophosphate
  transport. Shared carrier architecture cannot select the substrate for the benchmark Dic4 protein.
