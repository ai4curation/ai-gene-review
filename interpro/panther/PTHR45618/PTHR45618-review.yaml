  - reference_id: PMID:18682385
    supporting_text: Transport was saturable with a half-saturation constant of 75 +/- 4
      microm for alpha-IPM
  - reference_id: PMID:18682385
    supporting_text: Consistent with the
      function of Oac1p as an alpha-IPM transporter, cells lacking the gene for this
      carrier required leucine for optimal growth on fermentable carbon sources.
