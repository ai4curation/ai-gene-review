- subfamily_id: PANTHER:PTHR45618:SF18
  label: MITOCHONDRIAL OXALOACETATE TRANSPORT PROTEIN
  description: >-
    The fungal Oac1 carriers: S. cerevisiae OAC1 (P32332) and S. pombe oac1 (Q9UTN1), placed here
    by PANTHER 19.0's own classification files together with Dictyostelium ucpA (Q55BF4).
    Reconstituted S. cerevisiae Oac1 transports oxaloacetate, sulfate, malonate and alpha- and
    beta-isopropylmalate. In leucine biosynthesis it exports alpha-isopropylmalate, made by the
    mitochondrial Leu4 isopropylmalate synthase, to the cytosol, where the isopropylmalate
    isomerase and dehydrogenase steps take place. This is the subfamily the BCAA module uses for
    its Oac1 alpha-isopropylmalate transport annoton. UniProt's DR PANTHER lines and the InterPro
    member inventory place the same proteins in PTHR45928:SF1 instead, and P32332 and Q9UTN1 are
    therefore absent from PTHR45618-entries.csv; see notes.
  representative_members:
  - id: UniProtKB:P32332
    label: OAC1
    gene_symbol: OAC1
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/OAC1/OAC1-ai-review.yaml
  - id: UniProtKB:Q9UTN1
    label: oac1
    gene_symbol: oac1
    organism: Schizosaccharomyces pombe
    gene_review: genes/SCHPO/oac1/oac1-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Substrate specialization within a heterogeneous carrier family. Oac1 carries oxaloacetate,
    sulfate, malonate and alpha-isopropylmalate, and has been recruited into leucine biosynthesis
    as the mitochondrial alpha-isopropylmalate exporter. Its substrate set differs from the
    dicarboxylate carriers, the uncoupling proteins and the other branches of PTHR45618, so
    neither Oac1's isopropylmalate transport nor the other branches' substrates should be
    transferred across subfamilies.
  supported_by:
  - reference_id: PMID:18682385
    supporting_text: In Saccharomyces cerevisiae, alpha-isopropylmalate (alpha-IPM), which is
      produced in mitochondria, must be exported to the cytosol where it is required
      for leucine biosynthesis.
  - reference_id: PMID:18682385
    supporting_text: Recombinant and reconstituted mitochondrial
      oxalacetate carrier (Oac1p) efficiently transported alpha-IPM in addition to its
      known substrates oxalacetate, sulfate, and malonate
