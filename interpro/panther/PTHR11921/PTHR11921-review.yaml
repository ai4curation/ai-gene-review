family_id: PANTHER:PTHR11921
family_name: SUCCINATE DEHYDROGENASE IRON-SULFUR PROTEIN
preferred_name: Succinate dehydrogenase / fumarate reductase iron-sulphur subunit family
summary: >-
  The iron-sulphur subunit of complex II (SdhB/SDH2/SDHB) carries [2Fe-2S], [4Fe-4S] and [3Fe-4S]
  clusters that pass electrons from the flavoprotein to the membrane-bound ubiquinone site. The family
  contains bacterial SdhB and FrdB, S. cerevisiae SDH2, S. pombe sdh2 and human SDHB.
functional_coherence: COHERENT
coherence_reason: >-
  All members are iron-sulphur electron-transfer subunits of complex II or fumarate reductase.
