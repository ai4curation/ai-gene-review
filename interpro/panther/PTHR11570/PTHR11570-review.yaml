family_id: PANTHER:PTHR11570
family_name: S-ADENOSYLMETHIONINE DECARBOXYLASE
preferred_name: S-adenosylmethionine decarboxylase (SPE2/AMD1) family
summary: >-
  Pyruvoyl-dependent S-adenosylmethionine decarboxylases make decarboxylated SAM, the aminopropyl
  donor for spermidine and spermine synthesis. The proenzyme self-cleaves to form the pyruvoyl group.
  The family contains S. cerevisiae SPE2, S. pombe spe2, human AMD1 and plant SAMDCs, and the inactive
  trypanosome prozyme, which activates the catalytic subunit.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All subfamilies are AdoMetDCs except the trypanosome prozyme (SF2), which is catalytically inactive.
