  Porphobilinogen deaminases polymerize four porphobilinogen units on a dipyrromethane cofactor to
  make hydroxymethylbilane, the linear tetrapyrrole precursor of uroporphyrinogen III (bacterial
  HemC, S. cerevisiae HEM3, S. pombe hem3, human HMBS).
