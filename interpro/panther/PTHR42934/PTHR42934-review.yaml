subfamilies:
- subfamily_id: PANTHER:PTHR42934:SF1
  label: GLYCOLATE OXIDASE SUBUNIT GLCD
  description: >-
    Canonical GlcD subunits of the GlcDEF glycolate oxidase/dehydrogenase (E. coli K-12 GlcD,
    Pseudomonas aeruginosa and P. putida KT2440 GlcD, cyanobacterial GlcD), plus archaeal GlcD
    homologues. E. coli GlcD is the family's only PAINT seed; insertions in glcD, glcE or glcF
    each abolish glycolate oxidase activity and growth on glycolate. Used by the
    glycolate/glyoxylate assimilation module.
  representative_members:
  - id: UniProtKB:P0AEP9
    label: Glycolate oxidase subunit GlcD
    gene_symbol: glcD
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/glcD/glcD-ai-review.yaml
  - id: UniProtKB:Q88GH8
    label: Glycolate oxidase, putative FAD-linked subunit
    gene_symbol: glcD
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/glcD/glcD-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:8606183
    supporting_text: The insertional mutation by a chloramphenicol acetyltransferase cassette in either
      glcD, glcE, or glcF abolished glycolate oxidase activity, indicating that presumably these proteins
      are subunits of this enzyme.
  - reference_id: file:genes/ECOLI/glcD/glcD-uniprot.txt
    supporting_text: 'DISRUPTION PHENOTYPE: Abolishes glycolate oxidase activity. Is unable'
- subfamily_id: PANTHER:PTHR42934:SF2
  label: GLYCOLATE OXIDASE SUBUNIT GLCD
  description: >-
    A functionally mixed subfamily. It contains GlcD orthologs of Gram-positive bacteria (Bacillus
    subtilis GlcD, annotated by similarity to E. coli GlcD) alongside experimentally
    characterized D-lactate dehydrogenases: the Anaerostipes hadrus enzyme (active with DCPIP but
    not NAD, NADP or cytochrome c), the membrane-bound Archaeoglobus fulgidus Dld, and the
    Acetobacterium woodii LctD subunit of the lactate dehydrogenase-Etf complex. The
    Mycobacterium tuberculosis members (Rv2280, Rv1257c) are uncharacterized.
  representative_members:
  - id: UniProtKB:P94535
    label: Glycolate oxidase subunit GlcD
    gene_symbol: glcD
    organism: Bacillus subtilis 168
  - id: UniProtKB:D4MUV9
    label: D-lactate dehydrogenase
    organism: Anaerostipes hadrus
  - id: UniProtKB:O29853
    label: D-lactate dehydrogenase
    gene_symbol: dld
    organism: Archaeoglobus fulgidus DSM 4304
  - id: UniProtKB:H6LBS1
    label: Lactate dehydrogenase (NAD(+),ferredoxin) subunit LctD
    gene_symbol: lctD
    organism: Acetobacterium woodii DSM 1030
  diverged_from_family: true
  divergence_description: >-
    Partly diverged. The characterized D-lactate dehydrogenases in this subfamily act without
    GlcE/GlcF partners (alone, or with the Etf flavoprotein in the case of LctD) and have
    D-lactate rather than glycolate as their established substrate; glycolate oxidation has not
    been reported for them. Bacillus-type GlcD members are unaffected. Because the subfamily is
    mixed, the glycolate terms are excepted per member rather than denied for the whole
    subfamily (see term_assessments).
  supported_by:
  - reference_id: PMID:34555022
    supporting_text: one with D-lactate (D4MUV9 from Anaerostipes hadrus)
  - reference_id: PMID:34555022
    supporting_text: The misannotation of D-lactate dehydrogenase, D-2-hydroxyglutarate dehydrogenase
      and as a result other proteins containing FAD_binding_4 and FAD-oxidase_C might stem from the
      fact that the E. coli homolog, encoded by genes in the glcDEFGB operon, was initially believed
      to be a glycolate oxidase
  - reference_id: UniProtKB:O29853
    supporting_text: 'FUNCTION: Catalyzes the dehydrogenation of (R)-lactate (D-lactate) to'
- subfamily_id: PANTHER:PTHR42934:SF3
  label: D-LACTATE DEHYDROGENASE
  description: >-
    Small bacterial subfamily (e.g. Geobacter sulfurreducens GlcD-1 and a Thermodesulfovibrio
    yellowstonii paralog) with no experimentally characterized member. PANTHER names it
    D-lactate dehydrogenase; its substrate and partner subunits are unknown. Not used by any
    module.
  representative_members:
  - id: UniProtKB:Q747H0
    label: D-lactate/glycolate dehydrogenase, FAD-binding protein, putative
    organism: Geobacter sulfurreducens PCA
  - id: UniProtKB:B5YIF0
    label: D-lactate dehydrogenase
    organism: Thermodesulfovibrio yellowstonii DSM 11347
node_assessments:
- node_id: PANTHER:PTN001714823
  asserted_term:
    id: GO:0019154
    label: glycolate dehydrogenase activity
  evidence: IBD
  paint_snapshot: '20241203'
  seeds:
  - id: UniProtKB:P0AEP9
    label: glcD
    organism: Escherichia coli K-12
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    PTN001714823 is the family root (PANTHER 19 tree, LUCA speciation node), so the term descends
    to SF1, SF2 and SF3. Placement is defensible: E. coli GlcD (SF1) has direct experimental
    evidence, and GlcD orthologs occur in both the SF1 (proteobacterial, cyanobacterial and
    archaeal GlcD) and SF2 (Bacillus GlcD) lineages, so a single well-characterized seed is
    adequate. The E. coli glcD review accepts the IBA. However, SF2 also contains branches of
    characterized standalone D-lactate dehydrogenases (Anaerostipes, Archaeoglobus Dld, the
    Acetobacterium LctD) for which glycolate oxidation has not been shown and which do not act
    in a GlcDEF complex; these should not inherit the term. Because SF2 is mixed, the pruning
    is recorded as member exceptions rather than a whole-subfamily denial. SF3 is
    uncharacterized and left in scope pending data.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42934/PTHR42934-paint.tsv
    supporting_text: "PTHR42934\tPTN001714823\tGO:0019154\tF\tIBD\tfalse\tUniProtKB:P0AEP9"
  - reference_id: file:genes/ECOLI/glcD/glcD-uniprot.txt
    supporting_text: Reaction=glycolate + A = glyoxylate + AH2; Xref=Rhea:RHEA:21264,
  - reference_id: PMID:34555022
    supporting_text: one with D-lactate (D4MUV9 from Anaerostipes hadrus)
- node_id: PANTHER:PTN001714823
  asserted_term:
    id: GO:0046296
    label: glycolate catabolic process
  evidence: IBD
  paint_snapshot: '20241203'
  seeds:
  - id: UniProtKB:P0AEP9
    label: glcD
    organism: Escherichia coli K-12
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    GlcD performs the first committed step of glycolate utilization (glycolate to glyoxylate),
    so involved_in is correct for the GlcD lineages; E. coli glcD mutants cannot grow on
    glycolate, and the E. coli glcD review accepts the IBA. As for the activity term, the
    root placement also reaches the SF2 D-lactate dehydrogenases, whose characterized roles are
    D-lactate utilization (Archaeoglobus Dld, as carbon and electron source for sulfate
    reduction) and electron-confurcating lactate oxidation (LctD), not glycolate catabolism.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42934/PTHR42934-paint.tsv
    supporting_text: "PTHR42934\tPTN001714823\tGO:0046296\tP\tIBD\tfalse\tUniProtKB:P0AEP9"
  - reference_id: PMID:8606183
    supporting_text: associated with the glycolate utilization trait in Escherichia coli
  - reference_id: UniProtKB:O29853
    supporting_text: pyruvate. Is likely involved in the utilization of D-lactate as a sole
