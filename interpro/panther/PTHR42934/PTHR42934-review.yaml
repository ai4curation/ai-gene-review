family_id: PANTHER:PTHR42934
family_name: GLYCOLATE OXIDASE SUBUNIT GLCD
preferred_name: GlcD-type FAD-linked 2-hydroxyacid dehydrogenases (glycolate oxidase/dehydrogenase subunit GlcD and GlcD-like D-lactate dehydrogenases)
summary: >-
  A prokaryotic family (bacteria and archaea, with a single chytrid fungal leaf in the PANTHER
  tree) of FAD-containing oxidoreductases carrying the PCMH-type FAD-binding domain
  (FAD_binding_4) and the FAD-linked oxidase C-terminal domain (FAD-oxidase_C). The family name
  comes from GlcD, the FAD subunit of the heterotrimeric glycolate oxidase/dehydrogenase GlcDEF
  (E. coli and Pseudomonas GlcD; SF1), which oxidizes glycolate to glyoxylate (and D-lactate to
  pyruvate) with a non-oxygen, membrane-associated electron acceptor, in the first committed step
  of glycolate utilization. SF2 mixes Gram-positive GlcD orthologs (Bacillus subtilis GlcD) with
  experimentally characterized D-lactate dehydrogenases that act without GlcE/GlcF: the
  Anaerostipes hadrus and Archaeoglobus fulgidus FAD D-lactate dehydrogenases and the
  Acetobacterium woodii LctD subunit of an electron-confurcating lactate dehydrogenase-Etf
  complex. SF3 is a small, uncharacterized bacterial subfamily that PANTHER names D-lactate
  dehydrogenase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members share the FAD-linked oxidase architecture and oxidize (R)-2-hydroxyacids with a
  non-NAD, non-oxygen acceptor; the chemistry (glycolate and/or D-lactate to the 2-oxoacid) is
  shared. What varies is substrate preference and partners: SF1 GlcD works as one subunit of
  GlcDEF and prefers glycolate, whereas characterized SF2 D-lactate dehydrogenases act alone or
  with an electron-transferring flavoprotein and have not been shown to oxidize glycolate. The
  single PAINT node places the GlcD glycolate terms at the family root, so the D-lactate
  dehydrogenase branches inherit them.
