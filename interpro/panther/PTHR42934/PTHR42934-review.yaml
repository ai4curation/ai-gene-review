notes: >-
  The glycolate/glyoxylate assimilation module grounds its GlcD role on SF1 (E. coli and P. putida
  GlcD). PAINT has a single node for this family, the root PTN001714823, seeded only by E. coli
  GlcD; its glycolate dehydrogenase activity and glycolate catabolic process IBDs are right for
  GlcD lineages and accepted in the E. coli glcD review, but they also reach SF2 D-lactate
  dehydrogenases that work without GlcE/GlcF. P. putida GlcD receives no IBA rows because KT2440
  is not a PANTHER tree genome, not because of any loss. Tree topology was read from the PANTHER
  19 treeinfo service. The InterPro LLM description of this family (IPR051914) is unreviewed and was
  not used as evidence.
