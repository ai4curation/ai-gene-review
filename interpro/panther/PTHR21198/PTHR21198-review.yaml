  D-glutamate step at SF2. The family term alone would include aspartate and broad-specificity racemases,
  so the module uses the SF2 subfamily. The GO:0009252 IBD at the SF2/SF3 duplication node is left
  UNRESOLVED pending genetic evidence on an SF3 paralog.
