family_id: PANTHER:PTHR21198
family_name: GLUTAMATE RACEMASE
preferred_name: Asp/Glu racemase family (MurI glutamate racemases and aspartate/broad-specificity racemases)
summary: >-
  PTHR21198 is the cofactor-independent aspartate/glutamate racemase family. Its dominant subfamily, SF2,
  holds the bacterial glutamate racemases (MurI, EC 5.1.1.3) that convert L-glutamate to D-glutamate, the
  D-amino acid added by MurD at the second position of the peptidoglycan stem peptide. E. coli K-12 MurI is
  essential, needs D-glutamate supplementation when disrupted, and is allosterically activated by the MurD
  substrate UDP-MurNAc-L-Ala; the H. pylori, M. tuberculosis and other pathogen enzymes share the chemistry
  but differ in regulation, and some (E. coli, mycobacteria) also inhibit DNA gyrase. SF3 holds a second set
  of glutamate racemases, including B. subtilis glutamate racemase 2 (YrpC), that sit beside an SF2 MurI in
  the same genomes. SF7 (plus small SF9/SF10 subfamilies) holds aspartate racemases and the broad-specificity
  amino-acid racemases YgeA (E. coli) and RacX (B. subtilis). The whole family shares the two-Cys acid/base
  racemization mechanism signalled by the Asp/Glu racemase PROSITE motifs.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterised member is an amino-acid racemase of the same mechanistic type, but substrate
  specificity splits by subfamily: SF2 and SF3 racemize glutamate, whereas SF7 members racemize aspartate
  or have broad specificity. Only the SF2 MurI clade is established as the cell-wall D-glutamate supplier.
