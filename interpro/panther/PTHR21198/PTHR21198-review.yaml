- node_id: PANTHER:PTN001465973
  asserted_term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: UniProtKB:P22634
  - id: UniProtKB:P9WPW9
  assessment: UNRESOLVED
  assessment_reason: >-
    The process term is placed one node above the MF node, at the duplication PTN001465973 that joins the
    SF2 MurI clade (29 leaves) to three SF3 paralogs, including B. subtilis glutamate racemase 2 (YrpC).
    For SF2 the term is well supported: E. coli MurI is required for D-glutamate and peptidoglycan
    synthesis, and its activity is regulated by the MurD substrate. Both seeds are SF2. Whether the SF3
    paralogs, which coexist with an SF2 MurI in the same genome, contribute to peptidoglycan D-glutamate
    supply was not established from evidence available here, so it cannot be judged whether the node is
    placed too deep. Resolving it needs genetic data on an SF3 member (for example a yrpC single mutant
    or a racE yrpC double mutant in B. subtilis).
  supported_by:
  - reference_id: file:interpro/panther/PTHR21198/PTHR21198-paint.tsv
