family_id: PANTHER:PTHR11465
family_name: CATALASE
preferred_name: Monofunctional heme catalase family (CTA1/CTT1/KatA)
summary: >-
  Monofunctional heme catalases disproportionate hydrogen peroxide to water and oxygen. S. cerevisiae
  has a peroxisomal (and mitochondrial) catalase A (CTA1) and a cytosolic catalase T (CTT1). The
  family also contains S. pombe cta1, bacterial KatA/KatE, animal CAT and plant isozymes.
functional_coherence: COHERENT
coherence_reason: All subfamilies are catalases; they differ in compartment.
