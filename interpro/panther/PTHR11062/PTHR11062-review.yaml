family_id: PANTHER:PTHR11062
family_name: EXOSTOSIN  HEPARAN SULFATE GLYCOSYLTRANSFERASE -RELATED
preferred_name: GT47 glycosyltransferases (exostosin-related; plant cell-wall GT47s)
summary: >-
  CAZy family GT47 glycosyltransferases. In the PAINT snapshot used here the family
  includes the animal exostosins (EXT1, EXT2, EXTL3 and fly/worm orthologs), which
  polymerise heparan sulfate on proteoglycan core proteins, but current UniProt
  records place human EXT1 in PTHR48261, so the reviewed member inventory is plant
  proteins only. The plant members act on different wall polysaccharides: the
  IRX10/XYS1 clade (beta-1,4-xylan synthases), IRX7/FRA8 (xylan reducing-end
  sequence), MUR3 and related GT11-GT20 proteins (xyloglucan galactosyltransferases),
  ARAD1/ARAD2 (pectic arabinan arabinosyltransferases) and XGD1 (xylogalacturonan
  xylosyltransferase). This review covers the IRX10/XYS1 clade and the PAINT nodes
  that place xylan terms; the other nodes are not assessed.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members share the GT47 fold and inverting glycosyltransferase chemistry but transfer
  different sugars to different acceptors: xylose to xylan (IRX10 clade), galactose to
  xyloglucan (MUR3 and relatives), arabinose to arabinan (ARAD1/2), xylose to
  xylogalacturonan (XGD1), and GlcA/GlcNAc to heparan sulfate (animal EXTs, in the
  PAINT tree). Only glycosyltransferase activity and, for most characterised members,
  the Golgi location are family-wide. Many plant entries still carry legacy
  "glucuronosyltransferase" names from the tobacco NpGUT1 hypothesis, which do not
  describe the IRX10 clade.
