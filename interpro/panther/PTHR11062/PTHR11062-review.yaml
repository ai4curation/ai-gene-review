notes: >-
  Scope: the IRX10/XYS1 clade and the xylan-related PAINT nodes. Not assessed:
  PTN000115158, PTN000868988 and PTN000869020 (animal exostosin nodes, seeded by human,
  mouse, fly and worm EXTs), PTN000115401 (galactosyltransferase activity and xyloglucan
  biosynthesis, seeded by AT5G62220) and PTN007483657 (glucuronoxylan biosynthesis,
  seeded by IRX7/FRA8). The PAINT snapshot still places the animal EXTs in PTHR11062,
  while UniProt cross-references human EXT1 to PTHR48261; the family's membership has
  changed between PANTHER versions. Propagation reach of each node was read from QuickGO
  IBA rows (withFrom PANTHER:PTN...), 2026-10-30. Recommendations for PAINT: move
  GO:0047517 to PTN000869123 or deeper; remove GO:0080116 from PTN001667002; check
  whether GO:0009834 should stop at a tracheophyte node.
