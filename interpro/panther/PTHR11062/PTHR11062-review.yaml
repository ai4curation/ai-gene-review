node_assessments:
- node_id: PANTHER:PTN000869123
  asserted_term:
    id: GO:0010417
    label: glucuronoxylan biosynthetic process
  evidence: IBD
  paint_snapshot: '20190524'
  seeds:
  - id: AGI_LocusCode:AT1G27440
  - id: AGI_LocusCode:AT5G61840
  assessment: SOUND
  assessment_reason: >-
    The node is the land-plant IRX10 clade (its IBAs reach rice, poplar, Physcomitrium
    and other land plants). Every reviewed recipient keeps the IBA (Arabidopsis IRX10
    and IRX10L, rice IRX10, poplar POPTR_001G068100). Grass glucuronoarabinoxylan
    carries GlcA, so the term fits grasses as well as eudicots. The process could sit
    deeper, since the charophyte KfXYS1 also makes xylan, but the alga's xylan is not
    shown to carry GlcA.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11062/PTHR11062-paint.tsv
    supporting_text: "PTHR11062\tPTN000869123\tGO:0010417\tP\tIBD\tfalse"
  - reference_id: PMID:18980649
    supporting_text: These findings demonstrate that IRX10 and IRX10-L perform a critical
      function in the synthesis of glucuronoxylan during secondary cell-wall formation
- node_id: PANTHER:PTN000869123
  asserted_term:
    id: GO:0009834
    label: plant-type secondary cell wall biogenesis
  evidence: IBD
  paint_snapshot: '20190524'
  seeds:
  - id: AGI_LocusCode:AT1G27440
  - id: AGI_LocusCode:AT5G61840
  assessment: UNRESOLVED
  assessment_reason: >-
    Right for vascular plants: IRX10 is the main secondary-wall xylan synthase in
    Arabidopsis and rice. The node's IBAs also reach bryophytes (Physcomitrium, taxon
    3218; Marchantia, taxon 3197), whose walls lack the lignified secondary walls the
    seeds were characterised in. Whether bryophyte wall thickenings count as plant-type
    secondary walls, and whether the moss IRX10 ortholog acts in them, is not settled
    here; if not, the term is placed too deep and belongs on a tracheophyte node.
    Note also that Arabidopsis IRX10L acts mainly in primary walls.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11062/PTHR11062-paint.tsv
    supporting_text: "PTHR11062\tPTN000869123\tGO:0009834\tP\tIBD\tfalse"
  - reference_id: PMID:26043357
    supporting_text: IRX9L, IRX10L and IRX14 are required for xylan backbone synthesis
      in primary cell wall synthesising tissues
- node_id: PANTHER:PTN001667002
  asserted_term:
    id: GO:0047517
    label: 1,4-beta-D-xylan synthase activity
  evidence: IBD
  paint_snapshot: '20200807'
  seeds:
  - id: AGI_LocusCode:AT5G61840
  assessment: SOUND
  assessment_reason: >-
    Correct activity, placed too shallow rather than too deep. The node is a eudicot
    IRX10L subclade: its IBAs reach Arabidopsis IRX10L, poplar, tomato, cacao and other
    eudicots, but not Arabidopsis IRX10, rice IRX10, Physcomitrium or Klebsormidium, all
    of which are xylan synthases by direct assay. The activity should be asserted at
    PTN000869123 or deeper, seeded by IRX10L (IDA PMID:25141999), IRX10 (IDA
    PMID:25139408) and, if the tree includes it, KfXYS1 (PMID:29460505).
  supported_by:
  - reference_id: file:interpro/panther/PTHR11062/PTHR11062-paint.tsv
    supporting_text: "PTHR11062\tPTN001667002\tGO:0047517\tF\tIBD\tfalse"
  - reference_id: PMID:25139408
    supporting_text: showing that xylan xylosyltransferase activity is conserved over
      large evolutionary distance for these proteins
  - reference_id: PMID:39663842
    supporting_text: Therefore, XOAT6 facilitates chain polymerization mediated by IRX10
- node_id: PANTHER:PTN001667002
  asserted_term:
    id: GO:0080116
    label: glucuronoxylan glucuronosyltransferase activity
  evidence: IBD
  paint_snapshot: '20200807'
  seeds:
  - id: AGI_LocusCode:AT5G61840
  assessment: WRONG_NODE
  assessment_reason: >-
    The only seed is the IRX10L IMP row from PMID:18980662, which is itself wrong: that
    paper reports a loss of beta-1,4-xylosyltransferase activity in irx10 irx10-L, and
    glucuronosyl transfer to xylan is done by the GT8 GUX enzymes. Purified IRX10L does
    not use UDP-GlcA. No member of the IRX10 clade has glucuronosyltransferase activity,
    so the term should be removed from this node (and the seed corrected at TAIR).
  supported_by:
  - reference_id: file:interpro/panther/PTHR11062/PTHR11062-paint.tsv
    supporting_text: "PTHR11062\tPTN001667002\tGO:0080116\tF\tIBD\tfalse"
  - reference_id: PMID:18980662
    supporting_text: shows a severe reduction in beta(1,4) xylosyltransferase activity
  - reference_id: PMID:25141999
    supporting_text: We tested whether IRX10-L can utilize other UDP-sugars, including
      UDP-arabinopyranose, UDP-galactose, UDP-galacturonic acid, UDP-glucose and UDP-glucuronic
      acid, as sugar donors
  - reference_id: PMID:26043357
    supporting_text: GUX3 is the only glucuronyltransferase required for the addition
      of the GlcA decorations on the xylan
term_assessments:
- assessed_term:
    id: GO:0047517
    label: 1,4-beta-D-xylan synthase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Holds for the IRX10/XYS1 clade (Arabidopsis, rice, poplar, moss, psyllium and the
    charophyte Klebsormidium) and for no other characterised group in the family. Of
    the subfamilies that split the clade, SF370 and SF200 hold characterised members;
    SF339, SF399 and SF125 hold close paralogs (74-89% identical) that are very likely
    xylan synthases but are not assayed.
  applicable_subfamilies:
  - id: PANTHER:PTHR11062:SF370
    label: BETA-1,4-XYLOSYLTRANSFERASE IRX10-RELATED
  - id: PANTHER:PTHR11062:SF200
    label: BETA-1,4-XYLOSYLTRANSFERASE IRX10L-RELATED
  supported_by:
  - reference_id: PMID:25141999
    supporting_text: 'In summary, we have demonstrated that IRX10-L has UDP-Xyl: β-(1→4)
      xylosyl transferase activity'
  - reference_id: PMID:25139408
    supporting_text: We also find lower but reproducible xylan xylosyltransferase activity
      with A. thaliana IRX10
- assessed_term:
    id: GO:0080116
    label: glucuronoxylan glucuronosyltransferase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    No member of PTHR11062 is shown to transfer GlcA onto xylan; that reaction belongs to
    GT8 (GUX). IRX7/FRA8 (SF229, "GLUCURONOXYLAN GLUCURONOSYLTRANSFERASE IRX7-RELATED")
    is needed for the xylan reducing-end sequence, and the IRX10 clade for backbone
    elongation. The term reaches IRX10-clade members through PTN001667002 and
    experimental rows that rest on the legacy GUT names.
  supported_by:
  - reference_id: PMID:26043357
    supporting_text: GUX3 is the only glucuronyltransferase required for the addition
      of the GlcA decorations on the xylan
  - reference_id: PMID:18980662
    supporting_text: suggests that IRX10 and IRX10-L also play a role in elongation of
      the xylan backbone
- assessed_term:
    id: GO:0009101
    label: glycoprotein biosynthetic process
  scope: NOT_APPLICABLE
  scope_reason: >-
    Reaches plant members through InterPro2GO on IPR004263 (Exostosin), reflecting the
    animal exostosins that extend heparan sulfate chains on proteoglycans. The plant GT47
    enzymes reviewed here make free wall polysaccharides; IRX10L extends
    xylooligosaccharides without any protein acceptor. Removed in all five IRX10-clade
    gene reviews; the InterPro mapping should be restricted or dropped.
  supported_by:
  - reference_id: PMID:25141999
    supporting_text: our data indicates that IRX10-L, unaided by other enzymes, uses a
      distributive mechanism to catalyze xylan synthesis in vitro
