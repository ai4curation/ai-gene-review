- node_id: PANTHER:PTN000471580
  asserted_term:
    id: GO:0000271
    label: polysaccharide biosynthetic process
  evidence: IBD
  paint_snapshot: '20250903'
  seeds:
  - id: UniProtKB:P26394
  - id: UniProtKB:P9WH11
  - id: UniProtKB:Q9HU21
  assessment: WRONG_NODE
  assessment_reason: >-
    GO:0000271 is the formation of a polysaccharide polymer. The members below this node make a soluble
    nucleotide-sugar donor and form no glycosidic bond; the polymer is assembled by glycosyltransferases
    such as the E. coli WbbL rhamnosyltransferase. The seed evidence records necessity (loss of O antigen
    or capsule in mutants), not participation in polymer formation, so it supports this term at no node.
    The same donor also feeds non-polymeric products (deoxysugar antibiotics and other secondary metabolites
    in actinomycetes). Gene reviews of the E. coli K-12 and P. putida KT2440 members mark the propagated
    row MARK_AS_OVER_ANNOTATED, as does the TreeGrafter re-review of the KT2440 RmlC paralogs. Recommended
    fix: withdraw the IBD; the accurate process, GO:0019305 dTDP-rhamnose biosynthetic process, is asserted
    separately where the clade makes dTDP-L-rhamnose.
