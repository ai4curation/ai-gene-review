family_id: PANTHER:PTHR21047
family_name: DTDP-6-DEOXY-D-GLUCOSE-3,5 EPIMERASE
preferred_name: RmlC cupin-fold dTDP-sugar epimerase family
summary: >-
  PTHR21047 is the RmlC family of small cupin-fold, cofactor-independent epimerases that act on dTDP-4-keto-6-deoxyhexoses.
  The ancestral and most widespread activity is dTDP-4-dehydrorhamnose 3,5-epimerase (EC 5.1.3.13), the
  third step of dTDP-L-rhamnose biosynthesis: an active-site His/Tyr pair inverts both C3 and C5 of dTDP-4-dehydro-6-deoxy-D-glucose.
  Characterised members include Salmonella, E. coli, M. tuberculosis and P. aeruginosa RmlC; archaeal
  members (Methanothermobacter RmlC, Haloferax Agl13) belong to the same family, consistent with a LUCA-rooted
  tree. Actinomycete antibiotic clusters contain derived members that epimerise only C3 (GerF, ChmJ, NovW)
  or act on 2,6-dideoxy substrates (OleL). PANTHER has a single subfamily, SF2, so this divergence is
  not separated by subfamily.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are RmlC-fold dTDP-keto-sugar epimerases. The 3,5-epimerase that makes the L-rhamnose intermediate
  is the family function; the actinomycete monoepimerases and the 2-deoxy-sugar epimerase of antibiotic
  clusters are the identified exceptions.
