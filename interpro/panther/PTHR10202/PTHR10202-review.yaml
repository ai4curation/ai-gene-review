  scope_reason: >-
    Safe for the bilaterian Notch-pathway presenilins: vertebrate PSEN1 and PSEN2, fly Psn, and
    worm SEL-12 and HOP-1. These perform the S3 cleavage step of the pathway, which is
    participation. Not safe for Dictyostelium (no Notch), plants (no Notch) or C. elegans SPE-4
    (no evidence). SF13 is listed because fly Psn and worm SEL-12 are its bilaterian members,
    but its Dictyostelium (psenB) and Arabidopsis (At2g29900) members must not inherit the term.
    Scope by the Bilateria node PTN000024431 when applying this.
