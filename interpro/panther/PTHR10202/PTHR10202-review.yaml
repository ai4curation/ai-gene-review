    label: psen2
    organism: Danio rerio
  - id: ZFIN:ZDB-GENE-991119-4
    label: psen1
    organism: Danio rerio
  assessment: TOO_DEEP
  assessment_reason: >-
    In the PANTHER 19 tree, PTN000024430 is the SPECIATION node PANTHER calls "Unikonts". It
    joins the Bilateria clade (PTN000024431) with the Dictyostelium presenilin duplication
    (PTN000024497: psenA and psenB). PAINT gives no taxon for it. All seven seeds are
    bilaterian (fly, mouse, human, worm, zebrafish), so they support the Bilateria node
    PTN000024431 and not this one. Placing the term here makes Dictyostelium psenA and psenB
    inherit Notch signaling. Dictyostelium has no Notch, and McMains et al. describe its
    gamma-secretase signaling as having arisen perhaps independently of Notch. Recommended fix:
    move the IBD to PTN000024431 (Bilateria), or add an IRD at PTN000024497. C. elegans SPE-4
    (SF25) also inherits the term, through the Bilateria node, with no supporting evidence. That
    needs a separate pruning decision at the SPE-4 leaf. Only SF21 is listed as affected: the
    other Dictyostelium member, psenB, is in the mixed subfamily SF13 with fly Psn and worm
    SEL-12, so SF13 cannot be marked as affected.
