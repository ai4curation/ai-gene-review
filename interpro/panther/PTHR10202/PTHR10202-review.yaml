  - id: ZFIN:ZDB-GENE-000330-9
    label: psen2
    organism: Danio rerio
  - id: ZFIN:ZDB-GENE-991119-4
    label: psen1
    organism: Danio rerio
  assessment: UNRESOLVED
  assessment_reason: >-
    Unlike Notch signaling, the catalytic ability to make amyloid-beta from APP extends down to
    Dictyostelium, whose gamma-secretase produces Abeta40/42 from ectopically expressed human APP.
    The node is therefore consistent with the capacity. Amyloid-beta is only made in vivo in
    organisms whose APP ortholog contains the Abeta region, which fly APPL, worm APL-1 and
    Dictyostelium do not. Whether GO intends this process term for an enzyme with the capacity
    but no endogenous substrate is a policy question and is not decided here. It is not a Notch
    term.
