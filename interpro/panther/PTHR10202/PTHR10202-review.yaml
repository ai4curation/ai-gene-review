notes: >-
  Topology, subfamily assignments and PTN positions come from the PANTHER 19 treeinfo service,
  filtered to model organisms. Seed ids were resolved with UniProt REST xref queries.
  GxGD aspartate positions were read from current UniProt FASTA sequences: PSEN1 D385, PSEN2
  D366, Psn D461, SEL-12 D364, HOP-1 D278, SPE-4 D394, psenA D543, psenB D394. Formal
  residue_sites were not added because no catalytically dead presenilin is known to serve as a
  negative control. Non-homologous substitution: no bilaterian lineage is known to perform Notch
  S3 cleavage with anything other than presenilin/gamma-secretase. The reverse case, a
  presenilin family with no Notch (Dictyostelium, plants), is the key point for the Notch
  module.
