- node_id: PANTHER:PTN000024429
  asserted_term:
    id: GO:0006509
    label: membrane protein ectodomain proteolysis
  node_taxon:
    id: NCBITaxon:2759
    label: Eukaryota
  paint_snapshot: '20231031'
  seeds:
  - id: FB:FBgn0284421
    label: Psn
    organism: Drosophila melanogaster
  - id: RGD:3425
    label: Psen1
    organism: Rattus norvegicus
  - id: UniProtKB:P49768
    label: PSEN1
    organism: Homo sapiens
  - id: UniProtKB:P49810
    label: PSEN2
    organism: Homo sapiens
  assessment: UNRESOLVED
  assessment_reason: >-
    Ectodomain shedding is the step that comes before gamma-secretase: ADAM10 for Notch S2,
    alpha- or beta-secretase for APP. The presenilin S3/epsilon cleavage releases an
    intracellular domain from a stub that has already been shed. The term may describe the
    upstream sheddase step rather than presenilin's own activity. The seed annotations are
    experimental and their full texts were not reviewed here, so this is flagged rather than
    rejected. For Notch, the specific process that fits presenilin is Notch receptor processing
    (GO:0007220).
- node_id: PANTHER:PTN000024432
  asserted_term:
    id: GO:0042500
    label: aspartic endopeptidase activity, intramembrane cleaving
  node_taxon:
    id: NCBITaxon:33511
    label: Deuterostomia
  paint_snapshot: '20251218'
  seeds:
