    organism: Homo sapiens
  - id: UniProtKB:P49810
    label: PSEN2
    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    Correct for all descendants, but placed more shallowly than the biology supports. Fly Psn,
    worm SEL-12 and Dictyostelium presenilins are also catalytically active: each keeps the TM7
    GxGD aspartate (Psn D461, SEL-12 D364, psenA D543, psenB D394 in the UniProt sequences), and
    Dictyostelium gamma-secretase cleaves APP. Moving the node deeper, to Bilateria or the
    Unikonts node, would be justified. The more general endopeptidase activity term (GO:0004175)
    is already asserted at the Eukaryota node PTN000024429. The node is not shown in the
    PANTHER 19 model-organism tree view.
