family_id: PANTHER:PTHR10202
family_name: PRESENILIN
summary: >-
  Presenilins are the catalytic subunits of gamma-secretase, the intramembrane-cleaving aspartyl
  protease complex that also contains nicastrin, APH-1 and PEN-2. Two aspartates, in
  transmembrane segments 6 and 7 (the TM7 one in a GxGD motif), form the active site. The complex
  cleaves the membrane stubs left after ectodomain shedding of many type I transmembrane
  proteins. In Notch signaling this is the S3 cleavage that releases the Notch intracellular
  domain; in APP processing it produces amyloid-beta. Presenilins are found throughout
  eukaryotes. Animals have presenilin/gamma-secretase and Notch, but the social amoeba
  Dictyostelium has a highly diverged, catalytically active gamma-secretase and no Notch or APP.
  Plants have presenilin homologs whose gamma-secretase activity has not been shown. Vertebrates
  have two paralogs (PSEN1, PSEN2). C. elegans has three: SEL-12 and HOP-1, which act redundantly
  in LIN-12/GLP-1 Notch signaling, and the sperm-specific SPE-4.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Intramembrane aspartyl protease activity and gamma-secretase complex membership are shared by
  the characterized animal and Dictyostelium members. Notch signaling is not: it is a metazoan
  function, and Dictyostelium presenilins (psenA in SF21, psenB in SF13) work without any Notch
  substrate. The plant presenilins (SF26 and part of SF13) have no demonstrated gamma-secretase
  activity. Within animals, C. elegans SPE-4 (SF25) is a sperm-specific paralog with no known
  role in LIN-12/Notch signaling. PANTHER's catch-all subfamily SF13 (PRESENILIN HOMOLOG) mixes
  bilaterian members (fly Psn, worm SEL-12) with Dictyostelium psenB and Arabidopsis At2g29900.
  Notch-related scoping in this family therefore has to follow tree nodes, not subfamily labels.
