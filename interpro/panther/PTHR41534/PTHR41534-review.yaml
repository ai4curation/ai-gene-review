family_id: PANTHER:PTHR41534
family_name: BLR3401 PROTEIN
preferred_name: Aromatic ring-hydroxylating dioxygenase beta (small) subunit family
summary: >-
  Beta (small) subunits of class IB and related aromatic ring-hydroxylating
  dioxygenases. Members have an NTF2-like fold, carry no redox centre, and pair with
  the catalytic alpha subunit of the oxygenase. SF1 contains the beta subunits of
  dioxygenases acting on benzoates and anthranilate: BenB (benzoate), XylY (toluate),
  AntB (anthranilate) and CbdB (2-halobenzoate). SF2 contains the beta subunits of
  3-phenylpropionate/cinnamate (HcaF), benzene, chlorobenzene, naphthalene, biphenyl,
  2,4-dinitrotoluene and p-cumate dioxygenases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Every member is a non-catalytic structural subunit of a ring-hydroxylating
  dioxygenase, but the oxygenase it belongs to, and so the substrate and pathway,
  differs between SF1 (benzoate, toluate, anthranilate, 2-halobenzoate) and SF2
  (3-phenylpropionate, arenes, naphthalene, biphenyl). Process terms do not transfer
  across the subfamily boundary.
