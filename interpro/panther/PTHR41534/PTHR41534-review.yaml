        supporting_text: "PTHR41534\tPTN002222817\tGO:0019380\tP\tIBD\tfalse"
      - reference_id: file:genes/ACIAD/benB/benB-ai-review.yaml
        supporting_text: No evidence links ADP1 BenB to 3-phenylpropionate or cinnamate
