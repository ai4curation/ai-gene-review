node_assessments:
  - node_id: PANTHER:PTN002222817
    asserted_term:
      id: GO:0019380
      label: 3-phenylpropionate catabolic process
    evidence: IBD
    negated: false
    paint_snapshot: '20170228'
    node_taxon:
      id: NCBITaxon:1224
      label: Pseudomonadota
    seeds:
      - id: UniProtKB:Q47140
    assessment: TOO_DEEP
    assessment_reason: >-
      The only seed is E. coli HcaF (SF2). In the PANTHER 19 tree (pantherdb.org
      treeinfo service) PTN002222817 is the family root, which contains both SF1 and
      SF2. The SF1 branch (PTN002447680, holding P. aeruginosa antB and xylY) is a
      separate clade from the HcaF clade PTN002222814 (SF2). BenB proteins are grafted
      into the SF1 branch, so TreeGrafter gives them 3-phenylpropionate catabolism
      although their oxygenases act on benzoates. The term belongs at the SF2 node
      PTN002222814 or lower, not at the root. All three BenB gene reviews remove it.
    affected_subfamilies:
      - id: PANTHER:PTHR41534:SF1
        label: BLR3401 PROTEIN
    supported_by:
