family_id: PANTHER:PTHR12192
family_name: CATION TRANSPORT PROTEIN CHAC-RELATED
preferred_name: ChaC glutathione-specific gamma-glutamylcyclotransferase family
summary: >-
  ChaC-family enzymes cleave glutathione into 5-oxoproline and cysteinylglycine, a cytosolic route
  of glutathione degradation. The family contains S. cerevisiae GCG1, S. pombe ggg1, human CHAC1
  (ER-stress induced) and CHAC2, and plant GGCT2.
functional_coherence: COHERENT
coherence_reason: All reviewed subfamilies are glutathione-specific gamma-glutamylcyclotransferases.
