- assessed_term:
    id: GO:0010922
    label: positive regulation of phosphatase activity
  scope: UNRESOLVED
  scope_reason: MTMR9 experiments establish increased catalytic output of active myotubularin partners,
    and this is a regulatory action rather than intrinsic phosphatase activity. The family contains several
    other inactive myotubularins and diverse active/inactive partner combinations. The inspected MTMR9
    experiments do not establish that positive regulation is absent from every other branch or enumerate
    all positive regulators. Applicability therefore remains unresolved at the complete family-boundary
    level, with the horse MTMR9 deletion an additional target-specific qualification.
  supported_by:
  - reference_id: PMID:22647598
    supporting_text: 'Complex formation between the

      active myotubularins and MTMR9 increases their catalytic activity and alters

      their substrate specificity'
  - reference_id: file:genes/HORSE/MTMR9/MTMR9-bioinformatics/RESULTS.md
    supporting_text: The selected horse sequence lacks human residues 98–139, crossing the GRAM-domain/myotubularin-domain
      junction; the C-terminal region implicated in partner association is retained. Complex formation
      and downstream regulation remain inferences with a gene-model caveat.
