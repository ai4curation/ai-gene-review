family_id: PANTHER:PTHR10807
family_name: MYOTUBULARIN-RELATED
preferred_name: Active and inactive myotubularins
summary: Myotubularins include phosphoinositide phosphatases and inactive partners such as MTMR9 and MTMR12.
  Inactive homologs can stabilize and regulate active partners while lacking the intrinsic catalytic reaction.
functional_coherence: HETEROGENEOUS
coherence_reason: Experiments on MTMR6-MTMR9 distinguish partner stabilization and increased phosphatase
  output from MTMR9 catalysis. The mussel target's catalytic-site status and the horse MTMR9 internal
  deletion require sequence-level scrutiny. Catalytic activity, phosphatase regulation, binding and autophagy
  phenotypes must not be transferred as one package.
subfamilies:
- subfamily_id: PANTHER:PTHR10807:SF37
  label: MYOTUBULARIN-RELATED PROTEIN 12
  description: MTMR12 is a catalytically inactive MTM1 partner that primarily maintains MTM1 protein levels.
    The rat selected product preserves the complete reference phosphatase-like domain, but its alternative
    N-terminus and computational signal-peptide call make exact-product cytoplasmic targeting uncertain.
