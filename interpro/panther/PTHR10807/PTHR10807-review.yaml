- assessed_term:
    id: GO:0030234
    label: enzyme regulator activity
  scope: UNRESOLVED
  scope_reason: MTMR9 is a positive experimentally supported example of an enzyme regulator in this family.
    Inactive homologs can regulate active partners without executing their reaction, but activity status
    alone does not establish each homolog's regulatory effect. Other myotubularin partner combinations
    have not been comprehensively adjudicated here. The MTMR9 example cannot be used as an exhaustive
    set of enzyme-regulatory subfamilies.
  supported_by:
