notes: 'MYTGA/A0A8B6GS20: requested accession A0A8B6GS20; current record A0A8B6GS20; sequence length 607;
  source cohort ARGO50. HORSE/MTMR9: requested accession A0A9L0T3C1; current record A0A9L0T3C1; sequence
  length 507; source cohort HORSE40. human/MTMR9: requested accession Q96QG7; current record Q96QG7; sequence
  length 549; source cohort HORSE40_HUMAN_PAIR. rat/Mtmr12: requested accession A0A8I5ZMD5; current record
  A0A8I5ZMD5; sequence length 732; source cohort MOD_EVOLUTION20. Family boundaries were assessed using
  the fetched member set and the cited domain, literature and analytical evidence. Gene-review verdicts
  and ARBA assertions are not independent validation. PANTHER subfamily labels and membership are recorded
  from the frozen UniProt records and panther.obo; they do not by themselves prove functional uniformity
  within a subfamily. PAINT rows were inspected as ancestral assertions, but node placement is not adjudicated
  without the relevant descendant tree/alignment. No residue requirement is encoded without a verified
  sequence-version anchor. A target-level refutation is not a family-wide NOT_APPLICABLE judgment. Exact
  protein-name-only predictions are treated as family-identification hypotheses rather than invented GO
  predictions. The selected MTMR12 name predicts a phosphatase domain, not intrinsic phosphatase activity;
  it is a correct family-description claim. The exact rat domain maps at 439/439 identical residues to
  Q5FVM6. A predicted alternative signal peptide is not treated as demonstrated secretion.'
