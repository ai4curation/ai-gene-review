family_id: PANTHER:PTHR10603
family_name: FRAGILE X MENTAL RETARDATION SYNDROME-RELATED PROTEIN
preferred_name: Fragile X-related RNA-binding protein family
summary: >-
  Small FMR/FXR RNA-binding family with a single Drosophila member and three
  reviewed human vertebrate paralogs: FMR1 in PTHR10603:SF4, FXR2 in
  PTHR10603:SF3 and FXR1 in PTHR10603:SF6. The family shares KH/RGG-region
  RNA-binding and FMR/FXR self-assembly biology. Human FMR1 and FXR1 both have
  deep direct evidence for context-specific translational regulation, mRNA
  stability control and cytoplasmic RNP assemblies; FXR2 is more sparsely
  characterized and most FXR2 process annotations are inherited.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  FMR/FXR proteins are coherent mRNA-binding regulators that assemble
  ribonucleoprotein particles, but vertebrate duplication produced paralog
  asymmetry. FMR1 is most strongly neuronal, FXR1 has well-supported muscle,
  germ-cell, nuclear-pore and actomyosin-network roles, and FXR2 has conserved
  RNA-binding and heteromerization with much thinner direct human functional
  support. PAINT's family-root RNA and translation rows are mostly sound, while
  the Bilateria presynaptic/LTP rows rest on FMR1 evidence and need more
  source-level resolution before they are transferred to FXR1 and FXR2.
