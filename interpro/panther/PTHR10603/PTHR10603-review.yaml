term_assessments:
- assessed_term:
    id: GO:0003723
    label: RNA binding
  scope: FAMILY_WIDE
  scope_reason: >-
    RNA binding through KH and RGG-containing regions is the FMR/FXR-family
    core molecular function, and both human FXR1 and FXR2 have direct founding
    biochemical or cloning support for RNA binding.
  supported_by:
  - reference_id: PMID:7781595
    supporting_text: >-
      The KH domains of FXR1 and FMR1 are almost identical, and the two proteins have
      similar RNA binding properties in vitro.
  - reference_id: PMID:7489725
    supporting_text: >-
      FXR2 encodes a 74
      kDa protein which, like FMR1, contains two KH domains, has the capacity to bind
      RNA and is localized to the cytoplasm.
- assessed_term:
    id: GO:0045182
    label: translation regulator activity
  scope: FAMILY_WIDE
  scope_reason: >-
    FMR/FXR proteins regulate translation of selected mRNAs. FMR1 and FXR1 both
    have direct target-specific activation and repression evidence; FXR2 should
    be kept at the broad activity level until its targets are directly mapped.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10603/PTHR10603-paint.tsv
    supporting_text: "PTHR10603\tPTN001318100\tGO:0045182\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Human FXR1 has direct evidence for an mRNA-dependent condensate network that
    scaffolds actomyosin signaling proteins, and human FMRP has independent
    evidence for low-complexity-region condensates. Equivalent FXR2 condensate
    scaffold activity has not been established.
  applicable_subfamilies:
  - id: PANTHER:PTHR10603:SF6
    label: RNA-BINDING PROTEIN FXR1
  - id: PANTHER:PTHR10603:SF4
    label: FRAGILE X MESSENGER RIBONUCLEOPROTEIN 1
  supported_by:
  - reference_id: PMID:39106863
    supporting_text: >-
      These mRNAs serve as an underlying condensate scaffold and concentrate FXR1 molecules.
- assessed_term:
    id: GO:0051664
    label: nuclear pore localization
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The 2020 human-cell study directly implicated FXR1 and FMRP in spatial
    regulation of cytoplasmic nucleoporins. FXR2 can localize to the nuclear
    envelope in the same study, but its weaker depletion phenotype was not
    curated as sufficient evidence for a nuclear-pore-localization process
    annotation.
  applicable_subfamilies:
  - id: PANTHER:PTHR10603:SF6
    label: RNA-BINDING PROTEIN FXR1
  - id: PANTHER:PTHR10603:SF4
    label: FRAGILE X MESSENGER RIBONUCLEOPROTEIN 1
  supported_by:
  - reference_id: PMID:32706158
    supporting_text: >-
      Downregulation of FXR1 led to the cytoplasmic retention and co‐localization
      in granules of at least 10 Nups
  - reference_id: PMID:32706158
    supporting_text: >-
      models of fragile X syndrome (FXS), characterized by a loss of FMRP, accumulate Nup
      granules
