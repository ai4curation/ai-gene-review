notes: >-
  PTHR10603 has three reviewed human Swiss-Prot members. FMR1 was already
  reviewed; this pass filled the missing FXR1 and FXR2 reviews and cross-checked
  the shared PAINT family-root annotations. No new module review was added:
  FXR1's cMYC translation, late spermatid translation and nuclear-pore
  localization are represented by production GO-CAMs or by single-family
  mechanisms, and the reusable translation-initiation module already references
  the FXR1 GO-CAM activities.
