family_id: PANTHER:PTHR10849
family_name: NADH DEHYDROGENASE  UBIQUINONE  IRON-SULFUR PROTEIN 8, MITOCHONDRIAL
preferred_name: >-
  Complex I TYKY / 23-kDa subunit family (bacterial NuoI, Thermus Nqo9,
  mitochondrial NDUFS8) and related hydrogenase 2[4Fe-4S] subunits
summary: >-
  Small iron-sulfur proteins with two tandem 4Fe-4S ferredoxin-type domains
  (Pfam Fer4_7), each binding one [4Fe-4S] cluster. The dominant members are the
  TYKY / 23-kDa subunit of respiratory complex I: bacterial NuoI, Thermus Nqo9
  and mitochondrial NDUFS8. In these the two clusters (N6a and N6b) form the
  segment of the intramolecular electron wire that bridges cluster N5 and the
  terminal cluster N2, which reduces quinone. A minority of members are the
  homologous subunits of complex-I-related hydrogenase and dehydrogenase
  complexes, such as E. coli formate hydrogenlyase subunit 6 (HycF), hydrogenase-4
  component H (HyfH) and F420H2 dehydrogenase subunit I. They are also
  two-cluster electron-relay proteins, but their complexes oxidise formate or
  F420H2 rather than NADH. Electron transfer through bound [4Fe-4S] clusters is
  therefore the family-wide function, while NADH:ubiquinone oxidoreduction and
  complex I membership belong to the complex I clade only.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member is a two-[4Fe-4S] electron-relay subunit of a complex-I-like
  enzyme, so electron transfer activity and 4Fe-4S cluster binding hold across
  the family. The members differ in the complex they serve. PTHR10849:SF20 (327
  of 352 fetched members) holds the complex I subunits (NuoI, Nqo9, NDUFS8), and
  PTHR10849:SF24 holds second-copy NuoI paralogues from lineages with variant
  nuo operons (for example Aquifex nuoI2). PTHR10849:SF35 holds subunits of
  formate hydrogenlyase, hydrogenase-4 and F420H2 dehydrogenase, which are not
  NADH:quinone oxidoreductases. Terms describing the NADH:quinone reaction, complex
  I or aerobic respiration are therefore subfamily-scoped.
