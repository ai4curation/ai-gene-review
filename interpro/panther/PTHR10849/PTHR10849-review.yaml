notes: >-
  New review written with the E. coli and P. putida KT2440 NuoI gene reviews.
  The family name is verbatim from panther.obo. Subfamily counts are from the
  fetched PTHR10849-entries.csv (352 members: 327 SF20, 17 SF24, 5 SF35, 3
  unassigned). All five PTHR10849-paint.tsv rows are assessed above, with node
  ids, seeds and snapshot dates copied from the file. The leak of the
  PTN000091255 assertions (GO:0003954, GO:0009060) into SF35 was confirmed with
  a QuickGO ECO:0000318 query for E. coli HycF (P16432) and HyfH (P77423) on
  2026-11-02. The query result is not cached as a file. The module
  bacterial_respiratory_complex_i can ground the NuoI annoton at the family
  level, PANTHER:PTHR10849, because its asserted GO:0009055 electron transfer
  activity is FAMILY_WIDE. Open item: SF24 (second-copy NuoI paralogues) has not been
  examined member by member, so the complex-level terms GO:0008137 and GO:0045271 are
  scoped to SF20 only and are not asserted for SF24; a reviewed SF24 member with
  biochemical evidence of its complex's electron donor would settle SF24. No PAINT node
  asserts GO:0009055 or GO:0051539.
