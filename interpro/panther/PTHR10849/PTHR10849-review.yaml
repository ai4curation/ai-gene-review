- subfamily_id: PANTHER:PTHR10849:SF20
  label: NADH DEHYDROGENASE [UBIQUINONE] IRON-SULFUR PROTEIN 8, MITOCHONDRIAL
  description: >-
    The complex I TYKY subunits: bacterial NuoI from Proteobacteria and other
    phyla, and mitochondrial NDUFS8. These bind clusters N6a and N6b and relay
    electrons from N5 to N2 within the peripheral arm. The official name is
    mitochondrial but the subfamily is mostly bacterial (E. coli and P. putida
    NuoI are both here). This is the clade the complex I PAINT assertions
    describe, and it does not diverge from the family's core electron-relay
    function.
  diverged_from_family: false
