- subfamily_id: PANTHER:PTHR10849:SF24
  label: NADH-QUINONE OXIDOREDUCTASE SUBUNIT I 2
  description: >-
    Second-copy NuoI paralogues (17 fetched members), mostly from lineages that
    carry a second or variant nuo operon, such as Aquifex aeolicus nuoI2 and
    Campylobacter. They are presumed complex-I-type electron-relay subunits, but
    some of these complexes are thought to take electrons from donors other than
    NADH. No member has been gene-reviewed, so complex-level activity terms are
    not extended to this subfamily.
  diverged_from_family: false
  representative_members:
  - id: UniProtKB:O67386
    label: NADH-quinone oxidoreductase subunit I 2
    gene_symbol: nuoI2
    organism: Aquifex aeolicus (strain VF5)
- subfamily_id: PANTHER:PTHR10849:SF35
  label: FORMATE HYDROGENLYASE SUBUNIT 6-RELATED
  description: >-
    Two-[4Fe-4S] subunits of complex-I-related hydrogenases and dehydrogenases:
    E. coli formate hydrogenlyase subunit 6 (HycF), hydrogenase-4 component H
    (HyfH) and archaeal F420H2 dehydrogenase subunit I. The electron-relay fold is
    retained, but the parent complexes oxidise formate or F420H2 and, for FHL,
    reduce protons to H2 during fermentation rather than reducing quinone with
    NADH. This is the subfamily where the NADH and respiration terms on the deep
    PTN000091255 node are wrong.
  diverged_from_family: true
  representative_members:
