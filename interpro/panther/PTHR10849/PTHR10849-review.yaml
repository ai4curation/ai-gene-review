term_assessments:
- assessed_term:
    id: GO:0009055
    label: electron transfer activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member has two cysteine-ligated 4Fe-4S ferredoxin-type domains and is
    the two-cluster relay segment of a complex-I-like electron path. In complex I
    the clusters bridge N5 and N2, and the homologous FHL, hydrogenase-4 and
    F420H2 dehydrogenase subunits occupy the equivalent relay position. Electron
    transfer through the subunit's own clusters is the shared activity, whatever
    the donor and acceptor of the parent complex.
  supported_by:
  - reference_id: PMID:22474289
    supporting_text: >-
      Subunit NuoI in the peripheral domain contains two [4Fe-4S] clusters (N6a and
      N6b) and plays a role in bridging the electron transfer from cluster N5 to the
      terminal cluster N2.
  - reference_id: PMID:22474289
    supporting_text: >-
      biochemical data, including the activity and assembly of NDH-1 together with
      EPR data of the mutants, unequivocally affirmed that clusters N6a and N6b are
      essential for electron transfer of NDH-1.
- assessed_term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  scope: FAMILY_WIDE
  scope_reason: >-
    The two tandem 4Fe-4S ferredoxin-type domains (PROSITE PS51379 twice, Pfam
    Fer4_7) and their CxxCxxC...CP cluster-ligand motifs define the family.
  supported_by:
  - reference_id: PMID:22474289
    supporting_text: >-
      Subunit NuoI in the peripheral domain contains two [4Fe-4S] clusters (N6a and
      N6b)
- assessed_term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR10849:SF20
    label: NADH DEHYDROGENASE [UBIQUINONE] IRON-SULFUR PROTEIN 8, MITOCHONDRIAL
  scope_reason: >-
    The term applies, as contributes_to, only to subunits of NADH-oxidising
    complex I, which is the SF20 clade. SF35 subunits belong to formate- or
    F420H2-oxidising complexes. SF24 is left out until a member is reviewed,
    because some variant nuo operons are thought to use non-NADH donors.
- assessed_term:
    id: GO:0045271
    label: respiratory chain complex I
  scope: SUBFAMILY_ONLY
  applicable_subfamilies:
  - id: PANTHER:PTHR10849:SF20
    label: NADH DEHYDROGENASE [UBIQUINONE] IRON-SULFUR PROTEIN 8, MITOCHONDRIAL
  scope_reason: >-
    Complex I membership is established for SF20 members (E. coli NuoI, human and
    bovine NDUFS8) and is what the two shallow PAINT nodes assert. SF35 members
    belong to hydrogenase complexes.
- assessed_term:
    id: GO:0050136
    label: NADH dehydrogenase (quinone) (non-electrogenic) activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    The non-electrogenic NADH:quinone activity is that of NDH-2-type enzymes.
    Complex I, the context of the SF20 members, is the electrogenic
    proton-translocating enzyme, and SF35 complexes do not use NADH. Automated
    mappings of this term to NuoI (UniRule) are removed in the gene reviews.
  supported_by:
  - reference_id: PMID:3122832
    supporting_text: >-
      an enzyme (NADH dh II) that reacts with NADH exclusively whose turnover does
      not lead to generation of a H+ electrochemical gradient
