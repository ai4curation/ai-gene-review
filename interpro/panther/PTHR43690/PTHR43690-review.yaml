family_id: PANTHER:PTHR43690
family_name: NARDILYSIN
preferred_name: M16A inverzincin (pitrilysin/insulin-degrading enzyme) family
summary: >-
  PTHR43690 is the M16A family of inverzincin zinc metallopeptidases, clamshell
  enzymes whose N- and C-terminal halves enclose a chamber that admits only short
  peptides. Characterized members include human insulin-degrading enzyme (IDE) and
  nardilysin, E. coli protease III (PtrA), yeast Ste23 and chloroplast stromal
  processing peptidase. Subfamily SF18 (INSULIN-DEGRADING ENZYME-RELATED) also
  holds the single-chain PqqF proteases of PQQ gene clusters in Enterobacteria and
  Pseudomonas, such as Serratia sp. FS14 PqqF (crystal structure with an HxxEH zinc
  site and a chamber much smaller than that of IDE) and KT2440 PqqF; SF17 holds
  PqqL/YhjJ-type proteins. PqqF has the family's metalloendopeptidase chemistry but
  a pathway-specific substrate, the PqqA precursor peptide. The two-component
  PqqF/PqqG protease of M. extorquens belongs to the separate M16B family
  PTHR11851.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Members share zinc metalloendopeptidase activity on small peptides; substrates
  and pathways differ (insulin and amyloid peptides for IDE, PqqA for PqqF, transit
  peptides for stromal processing peptidase), and the PqqF substrate preference
  is not separated by a PANTHER subfamily.
