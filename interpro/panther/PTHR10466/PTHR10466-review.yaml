family_id: PANTHER:PTHR10466
family_name: PHOSPHOMANNOMUTASE
preferred_name: Eukaryotic HAD-type phosphomannomutase (PMM) family
summary: >-
  Eukaryotic phosphomannomutases belong to the haloacid dehalogenase (HAD) superfamily, subfamily
  IIB. They are Mg2+-dependent enzymes with an aspartate nucleophile, and they interconvert
  mannose 6-phosphate and alpha-D-mannose 1-phosphate using glucose 1,6-bisphosphate as activator.
  In the biosynthetic direction they make the mannose 1-phosphate that GDP-mannose
  pyrophosphorylase converts to GDP-mannose, the precursor of dolichyl-phosphate mannose and of
  all mannosylation in the secretory pathway. Members include S. cerevisiae SEC53, S. pombe pmm1,
  Candida PMM1, plant and protist PMMs, and the vertebrate paralogs PMM2 (the PMM2-CDG gene) and
  PMM1. These are unrelated to the bacterial alpha-D-phosphohexomutase-type phosphomannomutases.
functional_coherence: COHERENT
coherence_reason: >-
  Phosphomannomutase activity is shared by all characterized members, from yeast SEC53 and S.
  pombe pmm1 to plant, protist and vertebrate PMMs. The one nuance is the vertebrate duplication
  into PMM2 (SF2) and PMM1 (SF1). The two isozymes share an active-site structure and kinetic
  properties in vitro, but PMM1 has also been proposed to act physiologically as a glucose
  1,6-bisphosphate phosphatase, and PMM2 alone accounts for the glycosylation disease. That is a
  difference in physiological emphasis, not loss of the family activity, so PMM1 is not flagged
  as diverged.
