notes: >-
  PMM1's proposed physiological role as a glucose 1,6-bisphosphatase is mentioned in PMID:36214454,
  which cites Veiga-da-Cunha et al. 2008 ("similar to human PMM1"). The primary paper was not
  fetched, so no residue or functional-loss claim is made for SF1. Seed identities were resolved
  with UniProt cross-reference queries. The modules, PAINT and the gene reviews (SEC53, pmm1,
  PMM2) agree on activity, location and the GDP-mannose process. The only open point is the
  N-glycosylation IBD.
