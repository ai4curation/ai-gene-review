  assessment: SOUND
  assessment_reason: >-
    The seeds span fungi, animals, plants and Plasmodium, and every model-organism member
    inherits the activity. The SEC53, pmm1 and PMM2 gene reviews accept it. No IRD or IKR rows
    exist for the family in IBD.gaf.
  supported_by:
  - reference_id: PMID:3288631
    supporting_text: Several lines of evidence demonstrate that SEC53 encodes the yeast phosphomannomutase.
- node_id: PANTHER:PTN000049281
  asserted_term:
    id: GO:0006487
    label: protein N-linked glycosylation
  node_taxon:
    id: NCBITaxon:2759
    label: Eukaryota
  paint_snapshot: '20211110'
  seeds:
  - id: FB:FBgn0036300
    label: Pmm2
    organism: Drosophila melanogaster
  - id: ZFIN:ZDB-GENE-030722-6
    label: pmm2
    organism: Danio rerio
  assessment: UNRESOLVED
  assessment_reason: >-
    Placement is not the problem. Every PMM supplies mannose 1-phosphate equally, so if the term
    applies to one member it applies to all. The issue is the term. The seeds are fly and
    zebrafish Pmm2 mutant phenotypes, which show that PMM is necessary for N-glycosylation. But
    PMM acts two steps upstream of GDP-mannose and does none of the glycan transfer to protein.
    The SEC53, pmm1 and PMM2 reviews all keep the IBA as non-core. GDP-mannose biosynthetic
    process (GO:0009298) is the process PMM actually performs a step of.
  supported_by:
  - reference_id: PMID:3288631
    supporting_text: The secretory defect in sec53 cells may now be explained by a deficit in GDP-mannose
      production.
term_assessments:
- assessed_term:
    id: GO:0004615
    label: phosphomannomutase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the defining activity. The dolichol_phosphate_sugar_donor_supply module asserts it with
    representatives SEC53, S. pombe pmm1 and human PMM2, all within scope. PMM1 is in scope too:
    it is an active phosphomannomutase in vitro whatever its main role in vivo.
  supported_by:
  - reference_id: PMID:3288631
    supporting_text: Several lines of evidence demonstrate that SEC53 encodes the yeast phosphomannomutase.
  - reference_id: PMID:16540464
    supporting_text: The two isozymes, alpha-PMM1 and alpha-PMM2, are shown to have a conserved active-site
      structure and to display similar kinetic properties.
- assessed_term:
    id: GO:0009298
    label: GDP-mannose biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    PMM catalyses the second of the three steps from fructose 6-phosphate to GDP-mannose. This is
    the process the dolichol_phosphate_sugar_donor_supply module asserts for the PMM annoton, and
    the core process in the SEC53, pmm1 and PMM2 reviews. PAINT has no node for this term in the
    family. A GDP-mannose biosynthesis IBD at PTN000049281 would be better supported than the
    current N-glycosylation one.
  supported_by:
  - reference_id: PMID:3288631
    supporting_text: The secretory defect in sec53 cells may now be explained by a deficit in GDP-mannose
      production.
- assessed_term:
    id: GO:0006013
    label: mannose metabolic process
  scope: FAMILY_WIDE
  scope_reason: >-
    A correct but general parent: PMM interconverts mannose phosphates. The gene reviews keep it
    (non-core for SEC53 and pmm1, accepted for PMM2). GDP-mannose biosynthesis is the more
    informative term.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10466/PTHR10466-paint.tsv
    supporting_text: "PTHR10466\tPTN000049281\tGO:0006013\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0006487
    label: protein N-linked glycosylation
  scope: UNRESOLVED
  scope_reason: >-
    The same for every member. The open question is whether an enzyme that supplies a donor
    precursor upstream should carry this process term at all. See the PTN000049281 assessment.
    The gene reviews keep it as non-core. The module does not assert it.
  supported_by:
  - reference_id: file:genes/yeast/SEC53/SEC53-ai-review.yaml
    supporting_text: IBA involved_in protein N-linked glycosylation (donors from fly and zebrafish
      PMM2 mutant phenotypes).
