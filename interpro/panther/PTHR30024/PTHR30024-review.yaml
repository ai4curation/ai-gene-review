notes: >-
  Reviewed while completing the bacterial alkanesulfonate uptake and desulfonation module
  (modules/bacterial_alkanesulfonate_uptake_desulfonation.yaml), which grounds the SsuA role
  to SF42. PANTHER's family name is taken from the SsuA subfamily and is narrower than the
  family's content; the family is really the SBP component of a set of
  binding-protein-dependent importers. The subfamily label for SF7 contains an underscore
  where PANTHER substitutes one for a slash, reproduced verbatim.
  Reconciled with the bacterial assimilatory nitrate reduction module (PR #5928) after
  PR #5917 merged. This review is kept as the base; every subfamily, node assessment, term
  scope and reference here comes from it. The nitrate module's additions sit beside them:
  the PCC 7942 NrtA representative (P38043) with its binding evidence in SF7, and an SF7-scoped GO:0015414 ABC-type nitrate transporter activity term. The nitrate review's own draft also scoped GO:0042959 to SF42; that is dropped here, because this review already covers the SsuA role through the module that grounds it. The two reviews agreed on the one PAINT node (PTN001246788 TOO_DEEP, affecting SF7 and SF44), so no verdict changed.
  The GO:0015414 SF7 scope excepts the three CmpA bicarbonate-binding members (P39660, Q55460, Q5MZ56) on their curated UniProt FUNCTION lines (PR #5928 review); SF7 composition is from a csv parse of PTHR30024-entries.csv.
