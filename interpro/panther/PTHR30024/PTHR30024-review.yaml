- subfamily_id: PANTHER:PTHR30024:SF47
  label: TAURINE-BINDING PERIPLASMIC PROTEIN
  description: >-
    The TauA group, binding protein of the taurine (tau) importer, together with several
    uncharacterized rhizobial and Bacillus binding proteins. Despite the 22.7% identity
    between E. coli TauA and SsuA and the partial overlap in sulfonate substrate ranges,
    the two systems' components are not functionally exchangeable, so this subfamily is a
    real specificity split rather than a naming artefact.
  representative_members:
  - id: UniProtKB:Q47537
    gene_symbol: tauA
    organism: Escherichia coli K-12
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR30024:SF7
  label: NITRATE_NITRITE BINDING PROTEIN NRTA
  description: >-
    Cyanobacterial NrtA (nitrate/nitrite) and CmpA (bicarbonate) binding proteins. Same
    fold and mechanism, inorganic nitrogen or carbon ligands instead of sulfur compounds.
  representative_members:
  - id: UniProtKB:P38043
    label: Nitrate/nitrite binding protein NrtA
    gene_symbol: nrtA
    organism: Synechococcus elongatus (strain ATCC 33912 / PCC 7942 / FACHB-805)
    gene_review: genes/SYNE7/nrtA/nrtA-ai-review.yaml
  - id: UniProtKB:P73452
    gene_symbol: nrtA
    organism: Synechocystis sp. PCC 6803
  - id: UniProtKB:P39660
    gene_symbol: cmpA
    organism: Synechococcus elongatus PCC 7942
  diverged_from_family: true
  divergence_description: >-
    Ligand and physiology differ from the family's sulfonate-binding core: these proteins
    serve inorganic nitrogen and carbon acquisition and have no role in organosulfur
    scavenging, so sulfur-related terms must not descend here.
  supported_by:
  - reference_id: PMID:9006953
    supporting_text: These findings indicated that the nrtA gene product is a nitrate- and nitrite-binding
      lipoprotein.
- subfamily_id: PANTHER:PTHR30024:SF44
  label: CHOLINE-BINDING PROTEIN
  description: >-
    The OpuBC/OpuCC group of Bacillus and Listeria: binding proteins of the
    glycine betaine, carnitine and choline osmoprotectant importers.
  representative_members:
  - id: UniProtKB:Q45462
    gene_symbol: opuBC
    organism: Bacillus subtilis 168
  - id: UniProtKB:O32243
    gene_symbol: opuCC
    organism: Bacillus subtilis 168
  diverged_from_family: true
  divergence_description: >-
    Quaternary-amine osmoprotectant uptake, not sulfur scavenging; these members belong to
    an osmotic-stress response rather than to sulfate-starvation physiology.
node_assessments:
- node_id: PANTHER:PTN001246788
  asserted_term:
    id: GO:0009970
    label: cellular response to sulfate starvation
  evidence: IBD
  paint_snapshot: '20240425'
  seeds:
  - id: UniProtKB:Q47537
    gene_symbol: tauA
    organism: Escherichia coli K-12
  assessment: TOO_DEEP
  assessment_reason: >-
    The seed is E. coli TauA, and the claim is sound for it: the tau and ssu operons are
    expressed only under sulfate or cysteine starvation, so their binding proteins are part
    of that response. But the node carries the term to around 67 leaves spanning the whole
    family, including cyanobacterial NrtA and CmpA (nitrate and bicarbonate uptake),
    Bacillus and Listeria OpuBC/OpuCC (osmoprotectant uptake) and numerous fungal and
    archaeal members with no connection to sulfur scavenging. Sulfate-starvation physiology
    belongs to the sulfonate/taurine branches (SF42 and SF47), not to the ancestor of all
    SBPs of this fold. The reviewed ssuA genes are inside the branch where the term is
    right, so this assessment does not weaken their annotations.
  affected_subfamilies:
  - id: PANTHER:PTHR30024:SF7
    label: NITRATE_NITRITE BINDING PROTEIN NRTA
  - id: PANTHER:PTHR30024:SF44
    label: CHOLINE-BINDING PROTEIN
  supported_by:
  - reference_id: file:interpro/panther/PTHR30024/PTHR30024-paint.tsv
    supporting_text: "PTHR30024\tPTN001246788\tGO:0009970\tP\tIBD\tfalse\tUniProtKB:Q47537"
  - reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC101965_.md
    supporting_text: are required for the utilization of taurine and alkanesulfonates as sulfur sources
      and are expressed only under conditions of sulfate or cysteine starvation
