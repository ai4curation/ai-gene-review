    gene_review: genes/SYNE7/nrtA/nrtA-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    NrtA binds nitrate and nitrite instead of the sulfonate, taurine or osmolyte
    substrates of other subfamilies, and serves the cyanobacterial nitrate
    assimilation transporter NrtABCD.
  supported_by:
