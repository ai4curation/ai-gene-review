family_id: PANTHER:PTHR30024
family_name: ALIPHATIC SULFONATES-BINDING PROTEIN-RELATED
preferred_name: NitT/TauT-type ABC transporter substrate-binding protein family
summary: >-
  Solute-binding proteins of NitT/TauT-type ABC importers. The bound substrate
  differs by subfamily: aliphatic sulfonates (SsuA, SF42), taurine (TauA, SF47),
  choline and glycine betaine/carnitine (OpuCC-like, SF44), bicarbonate (CmpA) and
  nitrate/nitrite (cyanobacterial NrtA, SF7). Synechococcus elongatus PCC 7942
  NrtA (P38043) is a membrane-anchored lipoprotein that binds nitrate and nitrite
  with high affinity and is essential for the NrtABCD transporter.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members share the binding-protein role in an ABC importer but bind chemically
  unrelated substrates (sulfonates, taurine, choline/betaine, bicarbonate,
  nitrate), so substrate-specific transport terms are subfamily properties.
reference_protein:
  id: UniProtKB:P38043
  label: Nitrate/nitrite binding protein NrtA
  gene_symbol: nrtA
  organism: Synechococcus elongatus (strain ATCC 33912 / PCC 7942 / FACHB-805)
  gene_review: genes/SYNE7/nrtA/nrtA-ai-review.yaml
