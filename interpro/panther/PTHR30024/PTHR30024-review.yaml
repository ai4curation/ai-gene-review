family_id: PANTHER:PTHR30024
family_name: ALIPHATIC SULFONATES-BINDING PROTEIN-RELATED
preferred_name: Periplasmic/extracytoplasmic solute-binding proteins of binding-protein-dependent ABC importers (SsuA/TauA/NrtA/OpuC class)
summary: >-
  Secreted solute-binding proteins (SBPs) that serve as the high-affinity capture component
  of binding-protein-dependent ABC import systems. Each has a cleavable signal peptide (or,
  in Gram-positives, a lipoprotein anchor) and a bilobed SBP fold that closes around its
  ligand and then docks onto the cognate permease so that the ATPase can drive
  translocation. The family is organised by ligand rather than by chemistry: SsuA binds
  aliphatic sulfonates for sulfur scavenging, TauA binds taurine, NrtA and CmpA bind
  nitrate/nitrite and bicarbonate in cyanobacteria, and OpuBC/OpuCC bind choline, carnitine
  and glycine betaine as osmoprotectants. Members supply the specificity of their
  transporters: in Escherichia coli the SsuABC and TauABC systems have overlapping but
  distinct substrate ranges and their components are not functionally interchangeable, so
  the SBP cannot be treated as a generic accessory subunit.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members share the SBP fold and the same mechanistic role, extracytoplasmic ligand
  capture for an ABC importer, but the ligands span sulfonates, taurine, nitrate,
  bicarbonate and quaternary amines, and therefore so do the transport and
  response-to-starvation processes. A ligand-specific term, including the sulfate-starvation
  response that the family's one PAINT node asserts, cannot be inherited family-wide; only
  the generic SBP role can.
