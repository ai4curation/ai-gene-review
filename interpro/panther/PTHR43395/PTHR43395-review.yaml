notes: 'Node membership was read from the PANTHER treeinfo tree cached by ai_gene_review.etl.panther_trees:
  PTN000504218 covers all 56 leaves (SF10 28, SF1 26, SF8 2); PTN008681482 covers 15 SF10 leaves, all
  eukaryotic. P. putida KT2440 is not a PANTHER reference proteome, so its CheA receives TreeGrafter/InterPro
  IEA rows rather than PAINT IBA rows. Follow-up 2026-11-06: GO:0000155 has a confirmed molecular-sensor
  is_a parent; its application to receptor-coupled prokaryotic CheA is a suspected term-scope problem.
  GO:0004673 is retained for demonstrated kinase chemistry. Whole-family term scope remains unresolved
  because the pre-existing eukaryotic branch cannot be excluded by the available scope enum. The common-domain
  description no longer makes the recognizable P2 profile universal: RHIME Q52880 lacks the frozen P2
  profile call while its response-regulator-binding region is experimentally known in the RU lineage.
  Five sequence conflicts separate the current1021 record from the deposited RU protein, so quantitative
  RU measurements are not silently assigned to1021. No PTN, PAINT row or classification cache was changed.'
