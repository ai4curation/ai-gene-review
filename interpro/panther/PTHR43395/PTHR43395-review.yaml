family_id: PANTHER:PTHR43395
family_name: SENSOR HISTIDINE KINASE CHEA
preferred_name: Chemotaxis histidine kinase CheA family
summary: CheA proteins are cytoplasmic histidine kinases of bacterial and archaeal chemosensory arrays.
  They respond to ligand detection by chemoreceptors through receptor/adaptor complexes, catalyze histidine
  autophosphorylation and transfer phosphate to response regulators. Histidine kinase activity is established;
  the sensor-kinase term additionally inherits molecular sensor activity, whose application to receptor-coupled
  CheA requires ontology clarification. The common architecture includes HPt/P1, dimerization/P3, HATPase/P4
  and CheW-like/P5 domains, with a variable response-regulator interaction region. Output mechanisms include
  flagellar motor control and other chemosensory outputs; fused variants include Helicobacter CheAY and
  Myxococcus FrzE. Uncharacterized eukaryotic sequences occur in the classified family and retain their
  existing unresolved PAINT-loss assessments.
functional_coherence: COHERENT
coherence_reason: 'The characterized members in both main subfamilies (SF10: E. coli, Salmonella, Borrelia,
  Treponema, Halobacterium; SF1: B. subtilis, Thermotoga, Listeria, H. pylori, M. xanthus FrzE, P. putida)
  share histidine autokinase and phosphotransfer activity. The output differs by lineage (flagellar switching
  in most members, gliding-motility control for FrzE), which affects process terms but not the kinase
  activity. A small eukaryote-only clade below PTN008681482 (Daphnia, Chlamydomonas leaves) is uncharacterized
  and PAINT stops the family terms there.'
