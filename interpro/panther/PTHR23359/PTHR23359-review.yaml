  assessment: UNRESOLVED
  assessment_reason: >-
    A single-seed IBD (rat Ak3) on the AK3-type GTP:AMP clade. The forward reaction (GTP + AMP to
    GDP + ADP) consumes a nucleoside triphosphate and does not make one. The S. cerevisiae ADK2
    gene review marks the inherited IBA as over-annotated. The reaction is reversible, and the
    seed's full text was not reviewed, so this is flagged rather than rejected. The node's other
