  assessment: UNRESOLVED
  assessment_reason: >-
    This is a negated row (IRD, NOT GO:0004017) on the eukaryotic UMP/CMP kinase clade.
    Recipients include URA6, S. pombe ura6, CMPK1, AK9 and Arabidopsis UMK1-3. It agrees with the
    physiological role of the clade, but S. cerevisiae URA6 has measurable AMP kinase activity
    (IDA and IGI, kept as non-core in the URA6 gene review) and URA6 is itself a seed of the
    AMP-kinase IBD at PTN000599576. A strict NOT therefore conflicts with direct experimental
    evidence for at least one member. It may be better to leave the clade without the term than
    to assert NOT. The module does not depend on this.
  supported_by:
