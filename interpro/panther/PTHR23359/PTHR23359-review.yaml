- assessed_term:
    id: GO:0033862
    label: UMP kinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Eukaryotic UMP/CMP kinases only. PAINT places the term at PTN000599579 (Eukaryota), whose
    recipients include URA6, S. pombe ura6, CMPK1 and Arabidopsis UMK1, UMK2 and UMK3. This is the
    module's function for eukaryotic_ump_kinase_activity, which selects the base family with
    representatives URA6, ura6 and CMPK1. The annoton has no required_function, so the base-family
    selector on its own would take in every adenylate kinase. SF206 also holds the bacterial
    adenylate kinases, which do not inherit the term (see the member exception); bacteria make
    UDP with PyrH (PTHR42833). Human AK9 (SF148) also inherits from PTN000599579 but was not
    assessed here.
