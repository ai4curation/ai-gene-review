  assessment: NEEDS_PRUNING
  assessment_reason: >-
    ATP:AMP kinase activity is ancestral and correctly placed at the root for the canonical
    adenylate kinases. The AK3-type GTP:AMP clade (PTN008598552: yeast ADK2, human AK3 and the
    AK4 group) is the branch that needs pruning. PAINT has already added IRDs against GO:0004017
    for the AK4 node PTN002764060 and the UMP/CMP-kinase node PTN000599579, but not for AK3 or
    ADK2. As a result S. cerevisiae ADK2 (P26364) receives the AMP kinase IBA in the PAINT UniProt
    GAF, although the active ADK2 protein does not accept ATP as donor, and the ADK2 gene review
    removes it. The recommended fix is an IRD for GO:0004017 at PTN008598552, which would cover
    AK3, ADK2 and AK4. One seed of the IBD is rat Ak3 (RGD:619885). The evidence behind that seed
    was not reviewed here; it is the main thing to check before adding the IRD. Two other seeds
    sit under nodes that PAINT itself negates for this term. Human AK9 (Q5TCS8) descends from
    PTN000599579, and human AK5 (Q9Y6K8) from PTN002764136, which carries an IRD against
    GO:0004017. That is an internal inconsistency in the PAINT tree, recorded here but not
    adjudicated.
