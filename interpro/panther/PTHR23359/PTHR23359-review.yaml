  scope: SUBFAMILY_ONLY
  scope_reason: >-
    This is the module's function for the adenylate_kinase_activity annoton (ADK1, AK1), which
    selects the base family. That is safe only because the annoton's function restricts it. The
    listed subfamilies hold the canonical ATP:AMP kinases with checked experimental seeds: ADK1
    and adk1 (SF234), AK2 (SF227), AK1 (SF59), AK7 (SF105), AK8 (SF167), and the bacterial Adk in
    the mixed SF206. Excluded are the GTP:AMP AK3-type groups (SF242, SF68), inactive AK4 (SF58),
    and AK5 (SF79) and AK9 (SF148), which PAINT negates. In SF206 the eukaryotic UMP/CMP kinases
    are not primarily AMP kinases (IRD at PTN000599579), but URA6 has a measured secondary AMP
    kinase activity. Plant isoform subfamilies were not individually checked.
