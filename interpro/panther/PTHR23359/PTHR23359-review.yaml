family_id: PANTHER:PTHR23359
family_name: NUCLEOTIDE KINASE
preferred_name: Adenylate kinase / UMP-CMP kinase family (short NMP kinases)
summary: >-
  Nucleoside monophosphate (NMP) kinases of the adenylate kinase fold. They transfer the
  terminal phosphate of an NTP to an NMP. The family holds several functionally distinct
  paralog groups. ATP:AMP adenylate kinases (bacterial Adk, yeast ADK1/AKY2, S. pombe adk1, human
  AK1, AK2, AK5, AK7, AK8) keep the adenylate pool in equilibrium. UMP/CMP kinases (S.
  cerevisiae URA6, S. pombe ura6, human CMPK1, Arabidopsis UMK1-3) are eukaryotic and supply
  UDP and CDP for pyrimidine nucleotide synthesis and salvage. Mitochondrial-matrix GTP:AMP
  phosphotransferases (yeast ADK2, human AK3) use GTP or ITP and not ATP as donor. AK4 is
  catalytically inactive in vitro. Substrate specificity overlaps: yeast URA6 has measurable AMP
  kinase activity, enough to rescue an AKY2 (ADK1) defect when overexpressed. Eukaryotes use
  this family for UMP phosphorylation, but bacteria use the unrelated PyrH (PTHR42833).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The phosphotransfer chemistry and the NMP-kinase fold are shared, but the NMP acceptor (AMP
  versus UMP/CMP) and the phosphate donor (ATP versus GTP/ITP) differ between paralog groups.
  One group (AK4) has lost activity. No specific kinase activity term is safe for the whole
  family. PANTHER subfamily labels are also unreliable guides to function here. In the PANTHER
  19.0 classification files SF206 ("UMP-CMP KINASE") holds both the eukaryotic UMP/CMP kinases
  (URA6, S. pombe ura6, CMPK1, Arabidopsis UMK3) and the bacterial ATP:AMP adenylate kinases (E.
  coli, B. subtilis and P. aeruginosa Adk). Yeast ADK1 and S. pombe adk1 are in SF234, labelled
  "ADENYLATE KINASE 2, MITOCHONDRIAL". The family's entries.csv carries no subfamily
  assignments, so the subfamily calls here come from the PANTHER 19.0 organism classification
  files.
