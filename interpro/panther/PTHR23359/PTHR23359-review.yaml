notes: >-
  Modules using this family through the base id PTHR23359: de_novo_pyrimidine_synthesis
  (eukaryotic_ump_kinase_activity, GO:0033862), purine_nucleotide_interconversion
  (adenylate_kinase_activity, GO:0004017) and pyrimidine_salvage (cmp_kinase_activity,
  GO:0036430). None of the three annotons has a required_function, so each relies on its
  representative members to narrow a heterogeneous family. A required_function (or a PTN-based
  selector) on each would make the selector safe. The module's own descriptions already say the
  "leaf function restricts" the family.

  Inconsistencies found:
  (1) PAINT gives yeast ADK2 the ATP:AMP kinase IBA from the root, and the ADK2 gene review
  removes it. An IRD at PTN008598552 is recommended (see node assessment).
  (2) The human AK2 and yeast ADK2 gene reviews disagree about whether GO:0005737 cytoplasm fits
  a mitochondrial protein.
  (3) The pyrimidine_salvage module asserts CMP kinase activity for URA6 as the step's function,
  while the URA6 gene review treats CMP phosphorylation as disputed and non-core.
  (4) In PAINT, AK9 and AK5 are seeds of the root AMP-kinase IBD yet sit under nodes negated for
  it (PTN000599579 and PTN002764136).
  (5) An IRD (NOT GO:0005739 at PTN002764153) is in .cache/panther/IBD.gaf but not in
  PTHR23359-paint.tsv.
  (6) The AK4 node PTN002764060 carries an NDP kinase IBD (GO:0004550) seeded by AK4 itself,
  next to IRDs reflecting AK4's lack of activity. Not adjudicated here.

  Subfamily assignments come from the PANTHER 19.0 organism classification files, because the
  family's entries.csv has an empty subfamily column. Recipient lists were taken from the PAINT
  UniProt GAF.
