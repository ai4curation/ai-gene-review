  name:
    name: Tyrosine-phosphorylated adapter molecule
    short: Tyrosine-phos_adapter
  description:
  - text: This family of proteins includes adapter molecules that play a crucial role
      in signal transduction pathways. They are involved in various cellular processes
      such as cell adhesion, migration, branching, and apoptosis. These proteins typically
      associate with tyrosine-phosphorylated receptors or substrates, mediating downstream
      signaling events. They contribute to the regulation of gene transcription in
      response to extracellular signals and are implicated in the DNA damage response.
      Additionally, they participate in the regulation of cytoskeletal dynamics, influencing
      cell motility and morphology. Some family members are also involved in the engulfment
      of apoptotic cells and may have roles in the immune response.
