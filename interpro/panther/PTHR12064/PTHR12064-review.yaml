family_id: PANTHER:PTHR12064
family_name: METAL TRANSPORTER CNNM
preferred_name: CNNM/ACDP membrane proteins
summary: CNNM/ACDP proteins contain a membrane region and cytosolic regulatory architecture associated
  with metal-ion homeostasis. Mammalian CNNMs and fungal or plant homologs differ in membrane destination
  and physiological context.
functional_coherence: HETEROGENEOUS
coherence_reason: CNNM4 basolateral localization supports a mammalian CNNM4 comparison for the dog target.
  A family signature alone cannot distinguish direct ion translocation from regulation of a transport
  system or establish the transported ion and coupling mechanism. Plasma membrane localization is not
  a universal conclusion for the fungal and plant homologs.
