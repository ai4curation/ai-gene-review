    id: GO:0022857
    label: transmembrane transporter activity
  scope: UNRESOLVED
  scope_reason: The CNNM4 study reports Mg2+ extrusion and exchange with extracellular Na+, providing
    functional transport evidence. Direct permeation versus regulation of another transporter must be
    distinguished when transferring mechanism to other CNNMs. The presence of membrane-spanning regions
    and CBS-associated architecture does not settle that mechanistic boundary across the family.
