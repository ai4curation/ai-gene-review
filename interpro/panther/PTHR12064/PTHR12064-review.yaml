- assessed_term:
    id: GO:0006811
    label: monoatomic ion transport
  scope: UNRESOLVED
  scope_reason: The CNNM4 knockout and imaging experiments support a role in Mg2+ transport and organismal
    magnesium homeostasis. That process can remain valid whether a homolog directly conducts ions or regulates
    the conducting machinery. Conservation of a specific ion and physiological transport role across all
    CNNM branches is not established.
