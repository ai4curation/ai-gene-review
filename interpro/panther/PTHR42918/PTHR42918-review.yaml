family_id: PANTHER:PTHR42918
family_name: LYSYL-TRNA SYNTHETASE
preferred_name: Class II lysyl-tRNA synthetases and the EpmA/PoxA EF-P beta-lysine ligase paralog
summary: >-
  Class II lysyl-tRNA synthetases (LysRS; bacterial LysS/LysU, eukaryotic
  cytoplasmic KARS1, mitochondrial and organellar LysRS) that activate lysine
  with ATP and charge tRNA(Lys) for translation, together with the truncated
  gammaproteobacterial paralog EpmA (PoxA/GenX/YjeA, subfamily SF6). EpmA lacks
  the N-terminal anticodon-binding domain, does not aminoacylate tRNA, and instead
  ligates (R)-beta-lysine onto Lys34 of elongation factor P, the activating
  modification of EF-P in E. coli, Salmonella and related bacteria. Vertebrate
  KARS1 additionally synthesizes diadenosine tetraphosphate and joins the
  multi-aminoacyl-tRNA synthetase complex.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family shares the class II aminoacyl-adenylate-forming catalytic core, but
  the acceptor differs: tRNA(Lys) for the LysRS subfamilies versus the EF-P
  protein for EpmA (SF6). tRNA aminoacylation and tRNA binding are therefore not
  family-wide, and the EpmA protein-lysylation activity is restricted to SF6.
reference_protein:
  id: UniProtKB:P0A8N7
  label: Elongation factor P--(R)-beta-lysine ligase
  gene_symbol: epmA
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/epmA/epmA-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR42918:SF6
    label: ELONGATION FACTOR P--(R)-BETA-LYSINE LIGASE
    description: >-
      EpmA/PoxA/GenX orthologs (87 reviewed members), confined to
      gammaproteobacteria that also encode EpmB and an EF-P with Lys34
      (Enterobacterales, Pasteurellales, Vibrionales) plus an Aquifex homolog.
      These enzymes ligate (R)-beta-lysine to EF-P rather than charging tRNA.
    representative_members:
      - id: UniProtKB:P0A8N7
        label: Elongation factor P--(R)-beta-lysine ligase
        gene_symbol: epmA
        organism: Escherichia coli K-12
        gene_review: genes/ECOLI/epmA/epmA-ai-review.yaml
      - id: UniProtKB:Q9ZJ12
        label: Elongation factor P--(R)-beta-lysine ligase
        gene_symbol: epmA
        organism: Salmonella typhimurium LT2
    diverged_from_family: true
    divergence_description: >-
      Lost the anticodon-binding domain and tRNA recognition; evolved (R)-beta-
      lysine specificity and the tRNA-mimic EF-P as the acceptor substrate.
    supported_by:
      - reference_id: PMID:21841797
        supporting_text: >-
          One notable exception is PoxA, a paralog of lysyl-tRNA synthetase (LysRS),
          which does not recognize tRNA but instead post-translationally modifies
          elongation factor P (EF-P), a protein that mimics tRNA in both shape and size
      - reference_id: PMID:20729861
        supporting_text: >-
          Further in vitro studies reveal that it specifically aminoacylates EF-P with
          lysine.
  - subfamily_id: PANTHER:PTHR42918:SF15
    label: LYSINE--TRNA LIGASE, CHLOROPLASTIC_MITOCHONDRIAL
    description: >-
      The largest subfamily (447 reviewed members), dominated by bacterial class II
      LysRS (including E. coli LysS and the heat-inducible LysU) and plant
      organellar LysRS.
    representative_members:
      - id: UniProtKB:P0A8N3
        label: Lysine--tRNA ligase
        gene_symbol: lysS
        organism: Escherichia coli K-12
      - id: UniProtKB:P0A8N5
        label: Lysine--tRNA ligase, heat inducible
        gene_symbol: lysU
        organism: Escherichia coli K-12
    diverged_from_family: false
    supported_by:
      - reference_id: PMID:21841797
        supporting_text: >-
          The biological role of LysRS, providing Lys-tRNALys for protein synthesis,
          requires a high rate of product synthesis
  - subfamily_id: PANTHER:PTHR42918:SF9
    label: LYSINE--TRNA LIGASE
    description: >-
      Eukaryotic cytoplasmic lysyl-tRNA synthetases (human, mouse and rat KARS1,
      yeast KRS1, fission yeast krs1, plant and microsporidian orthologs).
    representative_members:
      - id: UniProtKB:Q15046
        label: Lysine--tRNA ligase
        gene_symbol: KARS1
        organism: Homo sapiens
      - id: UniProtKB:P15180
        label: Lysine--tRNA ligase, cytoplasmic
        gene_symbol: KRS1
        organism: Saccharomyces cerevisiae
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR42918:SF5
    label: LYSINE--TRNA LIGASE, MITOCHONDRIAL
    description: Fungal mitochondrial lysyl-tRNA synthetases such as yeast MSK1.
    representative_members:
      - id: UniProtKB:P32048
        label: Lysine--tRNA ligase, mitochondrial
        gene_symbol: MSK1
        organism: Saccharomyces cerevisiae
    diverged_from_family: false
node_assessments:
  - node_id: PANTHER:PTN000502669
    asserted_term:
      id: GO:0004824
      label: lysine-tRNA ligase activity
    evidence: IBD
    negated: false
    paint_snapshot: "20181011"
    seeds:
      - id: UniProtKB:P0A8N3
        gene_symbol: lysS
        organism: Escherichia coli K-12
      - id: UniProtKB:P0A8N5
        gene_symbol: lysU
        organism: Escherichia coli K-12
      - id: UniProtKB:Q15046
        gene_symbol: KARS1
        organism: Homo sapiens
      - id: UniProtKB:Q9ZPI1
        gene_symbol: At3g11710
        organism: Arabidopsis thaliana
    assessment: SOUND
    assessment_reason: >-
      The node is seeded by bacterial and eukaryotic canonical LysRS enzymes and
      sits above the LysRS subfamilies. EpmA (SF6) descends from a separate node
      and does not inherit this activity in the local PAINT slice, which matches
      the experimental finding that PoxA/EpmA cannot aminoacylate tRNA(Lys).
    supported_by:
      - reference_id: PMID:21841797
        supporting_text: >-
          PoxA cannot aminoacylate tRNALys, indicating that while it is structurally
          similar to LysRS its activity is different from that of a canonical aaRS
  - node_id: PANTHER:PTN000502669
    asserted_term:
      id: GO:0005737
      label: cytoplasm
    evidence: IBD
    negated: false
    paint_snapshot: "20260530"
    seeds:
      - id: UniProtKB:P0A8N3
        gene_symbol: lysS
        organism: Escherichia coli K-12
      - id: UniProtKB:P0A8N5
        gene_symbol: lysU
        organism: Escherichia coli K-12
      - id: UniProtKB:P0A8N7
        gene_symbol: epmA
        organism: Escherichia coli K-12
      - id: UniProtKB:Q15046
        gene_symbol: KARS1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Both the LysRS enzymes and EpmA are soluble cytoplasmic proteins, and EpmA
      itself is one of the seeds, so the cytoplasm placement covers the whole
      family including the divergent SF6 branch. Neither the E. coli LysRS
      enzymes nor EpmA carries a signal peptide or transmembrane segment, and
      EpmA acts on cytoplasmic EF-P; the organellar LysRS members (SF5,
      mitochondrial) carry their own more specific locations from deeper nodes.
    supported_by:
      - reference_id: file:ECOLI/epmA/epmA-uniprot.txt
        record_section:
          - CC:FUNCTION
        supporting_text: >-
          Catalyzes the ATP-dependent activation of (R)-beta-
          lysine produced by EpmB, forming a lysyl-adenylate, from which the
          beta-lysyl moiety is then transferred to the epsilon-amino group of EF-
          P 'Lys-34'.
