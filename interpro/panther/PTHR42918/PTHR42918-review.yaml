      from a separate node, was wrong. The MF and BP rows here need pruning back
      to the LysRS clade; the CC row is fine, since EpmA really is cytoplasmic.
    supported_by:
      - reference_id: PMID:21841797
        supporting_text: >-
          PoxA cannot aminoacylate tRNALys, indicating that while it is structurally
          similar to LysRS its activity is different from that of a canonical aaRS
