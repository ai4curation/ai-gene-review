notes: >-
  Reviewed because E. coli EpmA (the EF-P beta-lysylation enzyme used by the
  efp_translation_stall_rescue module) belongs to this family. PTHR42918 is too
  broad to ground the EF-P activation step: it is dominated by canonical
  lysyl-tRNA synthetases, and only SF6 performs EF-P modification. The module
  therefore names EpmA as a concrete UniProt gene product (UniProtKB:P0A8N7)
  rather than grounding that step on any family or signature. The signatures that
  do pick out EpmA alone, should signature-level grounding ever be wanted, are
  NCBIfam TIGR00462 (genX) and InterPro IPR004525 (EpmA), both from this entry's
  own DR lines; the module does not currently use them.

  The exclusion of SF6 from the tRNA-related terms is recorded as subfamily scope
  plus affected_subfamilies on the two NEEDS_PRUNING node assessments, not as a
  member_exceptions entry for P0A8N7. A member exception on a term whose
  applicable_subfamilies already exclude that member's subfamily is vacuous, and
  family_gene_crosscheck reports it as EXCEPTION_OUTSIDE_SCOPE; the YmfI exception
  in PTHR42879 is anchored differently because YmfI sits inside the subfamily that
  term applies to. PAINT nodes
  PTN000502597/PTN000502719/PTN001097557/PTN001475963/PTN002873036/PTN008676938
  concern aspartate-tRNA ligase, mitochondrial and vertebrate KARS1-specific
  claims outside the EF-P scope and are not assessed here.
