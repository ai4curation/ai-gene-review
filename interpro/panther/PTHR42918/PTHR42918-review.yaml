        gene_symbol: lysU
        organism: Escherichia coli K-12
    diverged_from_family: false
    supported_by:
      - reference_id: PMID:21841797
        supporting_text: >-
          The biological role of LysRS, providing Lys-tRNALys for protein synthesis,
          requires a high rate of product synthesis
  - subfamily_id: PANTHER:PTHR42918:SF9
    label: LYSINE--TRNA LIGASE
    description: >-
      Eukaryotic cytoplasmic lysyl-tRNA synthetases (human, mouse and rat KARS1,
