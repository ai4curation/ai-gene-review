    member_exceptions:
      - member:
          id: UniProtKB:P0A8N7
          label: Elongation factor P--(R)-beta-lysine ligase
          gene_symbol: epmA
          organism: Escherichia coli K-12
          gene_review: genes/ECOLI/epmA/epmA-ai-review.yaml
        exception_reason: >-
          EpmA does not charge tRNA(Lys); it ligates (R)-beta-lysine onto EF-P
          Lys34. Any lysine-tRNA ligase annotation on an SF6 member is an
          over-propagation from the LysRS ancestry.
        supported_by:
          - reference_id: PMID:21841797
            supporting_text: >-
              PoxA cannot aminoacylate tRNALys, indicating that while it is structurally
              similar to LysRS its activity is different from that of a canonical aaRS
  - assessed_term:
      id: GO:0052868
      label: protein-lysine lysyltransferase activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      EF-P beta-lysylation is specific to the EpmA/PoxA subfamily SF6; the
      canonical LysRS subfamilies do not modify proteins.
    applicable_subfamilies:
      - id: PANTHER:PTHR42918:SF6
        label: ELONGATION FACTOR P--(R)-BETA-LYSINE LIGASE
    supported_by:
      - reference_id: PMID:21841797
        supporting_text: >-
          EF-P was efficiently functionally modified with (R)-β-lysine but not
          (S)-β-lysine or genetically encoded α-amino acids
