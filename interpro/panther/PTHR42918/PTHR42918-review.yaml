    description: >-
      EpmA/PoxA/GenX orthologs (87 reviewed members), confined to
      gammaproteobacteria that also encode EpmB and an EF-P with Lys34
      (Enterobacterales, Pasteurellales, Vibrionales) plus an Aquifex homolog.
      These enzymes ligate (R)-beta-lysine to EF-P rather than charging tRNA.
    representative_members:
      - id: UniProtKB:P0A8N7
        label: Elongation factor P--(R)-beta-lysine ligase
        gene_symbol: epmA
        organism: Escherichia coli K-12
        gene_review: genes/ECOLI/epmA/epmA-ai-review.yaml
      - id: UniProtKB:Q9ZJ12
        label: Elongation factor P--(R)-beta-lysine ligase
        gene_symbol: epmA
        organism: Salmonella typhimurium LT2
    diverged_from_family: true
    divergence_description: >-
      Lost the anticodon-binding domain and tRNA recognition; evolved (R)-beta-
      lysine specificity and the tRNA-mimic EF-P as the acceptor substrate.
    supported_by:
      - reference_id: PMID:21841797
        supporting_text: >-
          One notable exception is PoxA, a paralog of lysyl-tRNA synthetase (LysRS),
          which does not recognize tRNA but instead post-translationally modifies
          elongation factor P (EF-P), a protein that mimics tRNA in both shape and size
      - reference_id: PMID:20729861
        supporting_text: >-
          Further in vitro studies reveal that it specifically aminoacylates EF-P with
          lysine.
  - subfamily_id: PANTHER:PTHR42918:SF15
    label: LYSINE--TRNA LIGASE, CHLOROPLASTIC_MITOCHONDRIAL
    description: >-
      The largest subfamily (447 reviewed members), dominated by bacterial class II
      LysRS (including E. coli LysS and the heat-inducible LysU) and plant
      organellar LysRS.
    representative_members:
      - id: UniProtKB:P0A8N3
        label: Lysine--tRNA ligase
