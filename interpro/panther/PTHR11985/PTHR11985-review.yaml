term_assessments:
- assessed_term:
    id: GO:0004368
    label: glycerol-3-phosphate dehydrogenase (quinone) activity
  scope: UNRESOLVED
  scope_reason: Quinone-linked activity is supported for the reviewed SF15/SF31 enzymes and curated Bacillus
    GlpD in SF35, but SF35 also contains experimentally characterized O2-dependent oxidase O86963 and
    complex-dependent GlpA. Restricting the term to SF15/SF31 excludes a supported Bacillus enzyme; granting
    all of SF35 would include oxidases. No residue-defined discriminator or exhaustive member-level scope
    is established here. This unresolved family-wide boundary does not overturn supported gene-level quinone
    activity.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11985/PTHR11985-paint.tsv
    supporting_text: "PTHR11985\tPTN000240932\tGO:0004368\tF\tIBD\tfalse"
  - reference_id: file:genes/yeast/GUT2/GUT2-ai-review.yaml
    supporting_text: IBA from PTN000240932 (FAD-dependent mitochondrial GPDH clade; human GPD2, Arabidopsis
      SDP6, yeast Gut2). Correct
- assessed_term:
    id: GO:0006127
    label: glycerol-3-phosphate shuttle
  scope: UNRESOLVED
  scope_reason: The mitochondrial glycerol-phosphate shuttle is supported in the reviewed eukaryotic descendants
    of PAINT node PTN000240934. SF15 also contains bacterial GlpD, so a subfamily-wide grant would exceed
    that evolutionary and cellular scope. The mitochondrial node remains SOUND; subfamily membership alone
    is insufficient.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11985/PTHR11985-paint.tsv
    supporting_text: "PTHR11985\tPTN000240934\tGO:0006127\tP\tIBD\tfalse"
  - reference_id: file:genes/yeast/GUT2/GUT2-ai-review.yaml
    supporting_text: IBA from PTN000240934. Gut2p is the mitochondrial, quinone-reducing half of the glycerol-3-phosphate
      shuttle with cytosolic Gpd1p/Gpd2p, transferring cytosolic NADH-derived electrons to the respiratory
      chain;
