family_id: PANTHER:PTHR11985
family_name: GLYCEROL-3-PHOSPHATE DEHYDROGENASE
preferred_name: FAD-dependent glycerol-3-phosphate dehydrogenase (GlpD/GUT2/GPD2) family
summary: >-
  FAD-dependent glycerol-3-phosphate dehydrogenases oxidize glycerol 3-phosphate to dihydroxyacetone
  phosphate and pass electrons to quinone. Aerobic bacterial GlpD, S. cerevisiae GUT2, S. pombe gut2
  and human GPD2 act on the outer face of the respiratory membrane (the glycerol phosphate shuttle
  in eukaryotes). The family also contains anaerobic GlpA and the H2O2-producing glycerol-3-phosphate
  oxidases (GlpO).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Quinone-linked G3P dehydrogenase holds for SF15 and SF31. SF35 mixes anaerobic GlpA dehydrogenases
  with GlpO oxidases.
