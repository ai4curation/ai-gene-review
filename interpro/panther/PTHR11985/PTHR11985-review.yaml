family_id: PANTHER:PTHR11985
family_name: GLYCEROL-3-PHOSPHATE DEHYDROGENASE
preferred_name: FAD-dependent glycerol-3-phosphate dehydrogenase (GlpD/GUT2/GPD2) family
summary: FAD-dependent glycerol-3-phosphate oxidoreductases convert glycerol 3-phosphate to dihydroxyacetone
  phosphate using different electron-acceptor systems. Quinone-linked GlpD enzymes and mitochondrial GUT2/GPD2
  coexist with anaerobic GlpA complex subunits and oxygen-dependent, peroxide-producing GlpO oxidases.
  E. coli active GlpD associates with the cytoplasmic face of the plasma membrane; mitochondrial enzymes
  act on the intermembrane-space face of the inner membrane. Neither topology nor acceptor can be generalized
  from the family name.
functional_coherence: HETEROGENEOUS
coherence_reason: SF35 mixes quinone-linked Bacillus GlpD, anaerobic GlpA complex subunits and O2-dependent
  GlpO oxidases. An electron-acceptor assignment therefore cannot be made from that subfamily label alone.
