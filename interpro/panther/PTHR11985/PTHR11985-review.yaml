- subfamily_id: PANTHER:PTHR11985:SF15
  label: GLYCEROL-3-PHOSPHATE DEHYDROGENASE, MITOCHONDRIAL
  description: >-
    Aerobic G3P dehydrogenases (GlpD, GUT2, gut2, GPD2). Despite the PANTHER name
    (MITOCHONDRIAL), SF15 also holds the bacterial aerobic GlpD enzymes of E. coli and
    P. putida KT2440, which act on the cytoplasmic face of the bacterial plasma membrane.
  representative_members:
