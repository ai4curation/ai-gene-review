  name:
    name: G-protein Coupled Receptor 1
    short: GPCR1
  description:
  - text: The G-protein coupled receptor 1 family is characterized by its role in
      mediating cellular responses to a variety of stimuli, including neurotransmitters,
      hormones, and biogenic amines. Members of this family are involved in key physiological
      processes such as neurotransmission, smooth muscle contraction, gastric acid
      secretion, heart development, and regulation of circadian rhythms. They function
      through the activation of G proteins, which in turn modulate downstream effectors
      like adenylate cyclase, phospholipase C, and ion channels. This leads to the
      generation of second messengers and the release of intracellular calcium stores.
      The family includes receptors for 5-hydroxytryptamine (serotonin), histamine,
      and acetylcholine, which are implicated in mood regulation, perception, cognition,
      appetite, feeding behavior, stress responses, and various other central and
      peripheral functions.
