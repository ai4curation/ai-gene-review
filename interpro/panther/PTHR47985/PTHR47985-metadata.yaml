  name:
    name: Plant serine/threonine-protein kinase
    short: Plant_Ser/Thr_kinase
  description:
  - text: This family of proteins includes serine/threonine-protein kinases that play
      a crucial role in plant signaling pathways. Members of this family are involved
      in various aspects of plant defense mechanisms, including innate immunity responses
      to microbial pathogens and the regulation of brassinosteroid signaling, which
      is important for plant growth and development. Some proteins in this family
      function as receptor-like cytoplasmic kinases that mediate signal transduction
      from cell surface receptors to intracellular pathways, activating defense genes
      and contributing to pollen tube guidance. Others are involved in phosphorylation
      events that regulate key components of these signaling pathways.
