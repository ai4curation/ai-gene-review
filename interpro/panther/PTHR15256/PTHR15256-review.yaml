family_id: PANTHER:PTHR15256
family_name: INTEGRAL MEMBRANE PROTEIN DGCR2/IDD
preferred_name: DGCR2-related membrane adhesion proteins
summary: DGCR2-related proteins are membrane-associated interaction proteins with extracellular-domain
  architecture. Mouse DGCR2 participates in cortical-neuron migration and associates with the Reelin signaling
  complex; the conserved ligand and signaling role of divergent fly CG42404 remain unresolved.
functional_coherence: UNKNOWN
coherence_reason: In utero mouse Dgcr2 depletion disrupts radial locomotion and terminal translocation,
  and biochemical observations connect DGCR2 to the Reelin complex and downstream phosphorylation (PMID:29305086).
  This is mechanistic evidence beyond a disease-locus association, but it does not establish a direct
  enzymatic activity or a universal Reelin receptor function. The long fly product shares a family assignment
  and membrane-associated domains without a demonstrated conserved signaling partner. Functional coherence
  is unknown at that more specific molecular level.
