notes: >-
  Node placements were checked against the PANTHER 19.0 tree (treeinfo
  service). The tryptophan IBD at the root reaches bacterial PabB and
  isochorismate synthase leaves and is recorded as TOO_DEEP. P. putida TrpE is
  placed in SF48 (ISOCHORISMATE SYNTHASE MENF) by both PANTHER and UniProt,
  although it is a genetically confirmed anthranilate synthase. That is why
  SF48 is included in the anthranilate synthase scopes, while the
  tryptophan_biosynthesis module grounds its fungal TrpE annoton on SF9 and its
  bacterial TrpE annoton on NCBIfam TIGR00565.
