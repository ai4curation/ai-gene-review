  assessment: TOO_DEEP
  assessment_reason: >-
    The seeds are all anthranilate synthase component I proteins (TRP2, trp3,
    E. coli TrpE, M. tuberculosis TrpE, plant ASA), and the reviewed TrpE
    recipients (TRP2, trp3, P. putida TrpE, S. meliloti TrpE(G)) keep the term.
    However, the PANTHER 19 tree places PTN002599563 at the LUCA root, above
    every subfamily: all 248 leaves descend from it, including the 22 SF50
    bacterial PabB leaves under PTN002599780 and the 27 SF48 MenF/TrpE leaves.
    Only the eukaryotic ADC synthase clade (PTN002599721) carries a NOT
    (IRD). Bacterial PabB and isochorismate synthases therefore inherit
    tryptophan biosynthesis, which is false for them. The IBD belongs on the
    anthranilate synthase clades, or the root needs further IRD losses (for
    example at PTN002599780). Tree topology checked with the PANTHER treeinfo
    service for PTHR11236 (PANTHER 19.0).
