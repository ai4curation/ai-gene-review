family_id: PANTHER:PTHR11236
family_name: AMINOBENZOATE/ANTHRANILATE SYNTHASE
preferred_name: >-
  Chorismate-utilizing enzyme family (anthranilate, aminodeoxychorismate and isochorismate synthases)
summary: >-
  Mg2+-dependent chorismate-utilizing enzymes that aminate or isomerize chorismate. Subfamilies specialize:
  anthranilate synthase component I (TrpE; S. cerevisiae TRP2, S. pombe trp3) for tryptophan; aminodeoxychorismate
  synthase (PabB; the fused fungal ABZ1, S. pombe abz1) for folate; and isochorismate synthase (MenF/EntC)
  for menaquinone and siderophores.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The product is set by subfamily: anthranilate (SF9, SF49, SF46, SF33), 4-amino-4-deoxychorismate
  (SF18, SF50, SF41) and isochorismate (MenF, SF48). SF48 also contains bacterial TrpE proteins such
  as Aquifex and P. putida TrpE, so it is not uniformly isochorismate synthase.
