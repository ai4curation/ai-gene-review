  paint_snapshot: '20200205'
  seeds:
  - id: RGD:708522
  assessment: SOUND
  assessment_reason: >-
    Seeded by rat Aacs alone, but placed at the family root, where it is
    supported by independent characterization of bacterial members: the
    purified Zoogloea enzyme requires ATP and CoA to activate acetoacetate,
    and S. meliloti genetics show that acetoacetyl-CoA synthetase rather than
    a CoA transferase activates acetoacetate. The KT2440 Aacs and human AACS
    reviews both accept the activity. The one known divergent member, the
    fungal malonamoyl-CoA synthetase VrtB, would need an IRD; it is a
    secondary-metabolism recruitment and does not change the call for the
    rest of the family.
  supported_by:
