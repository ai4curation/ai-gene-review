notes: >-
  Written for the ketone_body_oxidation module, whose ATP-dependent
  acetoacetate-activation variant is grounded on PTHR42921:SF1. Both module
  exemplars, P. putida Aacs (Q88IC8) and human AACS (Q86V21), are classified at
  exactly SF1. Human AACS is included as the experimentally characterized
  eukaryotic member; its cytosolic, mainly lipogenic role is recorded in the
  module rather than presented as mitochondrial ketolysis.
