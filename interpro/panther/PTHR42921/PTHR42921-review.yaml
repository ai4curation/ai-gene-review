  - reference_id: PMID:10735852
    supporting_text: >-
      These findings suggest that acetoacetyl-CoA synthetase, rather than CoA
      transferase, activates acetoacetate to acetoacetyl-CoA in the S. meliloti
      poly-3-hydroxybutyrate cycle.
