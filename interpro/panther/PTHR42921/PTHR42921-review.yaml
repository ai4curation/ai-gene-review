family_id: PANTHER:PTHR42921
family_name: ACETOACETYL-COA SYNTHETASE
preferred_name: Acetoacetyl-CoA synthetase (AACS / AcsA2 / Aacs) family of ANL ligases
summary: >-
  Acetoacetyl-CoA synthetases are ANL-superfamily adenylate-forming ligases
  that activate acetoacetate with ATP and coenzyme A to acetoacetyl-CoA, AMP
  and diphosphate. In animals (human, rodent, chicken, frog, fish and the
  nematode SUR-5) the enzyme is cytosolic and channels ketone-body carbon into
  cholesterol and fatty-acid synthesis. In bacteria it is an alternative to
  CoA-transferase activation of acetoacetate during ketone-body and
  poly-3-hydroxybutyrate-cycle catabolism: Sinorhizobium meliloti AcsA2 is
  required for growth on PHB-cycle intermediates, a Zoogloea ramigera enzyme
  has been purified and characterized, and Pseudomonas putida KT2440 Aacs is
  encoded beside the D-3-hydroxybutyrate dehydrogenase hbdH. The fungal
  malonamoyl-CoA synthetase VrtB of viridicatumtoxin biosynthesis is a member
  that has been recruited to a different acyl acid.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Almost every characterized member activates acetoacetate, which PAINT
  asserts at the family root. The physiological direction differs by lineage
  (lipogenic use of ketone bodies in animals, ketone-body or PHB-cycle
  catabolism in bacteria), and at least one fungal member (VrtB, also in SF1)
  activates a different substrate, malonamate.
