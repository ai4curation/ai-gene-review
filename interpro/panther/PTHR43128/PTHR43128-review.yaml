family_id: PANTHER:PTHR43128
family_name: L-2-HYDROXYCARBOXYLATE DEHYDROGENASE (NAD(P)(+))
preferred_name: Lactate/malate dehydrogenase (LDH/MDH) superfamily
summary: >-
  NAD-dependent L-2-hydroxyacid dehydrogenases of the Rossmann-fold LDH/MDH superfamily. The
  members classified here are mostly L-lactate dehydrogenases (animal LDHA, LDHB, LDHC; bacterial
  LDH) and the LDH-like "type 3" malate dehydrogenases of many bacteria and archaea, such as
  P. putida KT2440 Mdh, which oxidises (S)-malate to oxaloacetate with NAD+ at the last step of the
  TCA cycle. A small subfamily (SF33) holds UEVLD proteins, which join a UEV domain to an LDH-like
  domain. The cofactor binding fold is shared, but substrate specificity (lactate versus malate)
  differs by lineage and is set by a few active-site residues, so activity cannot be transferred
  at family level. Canonical MDH1/MDH2-type malate dehydrogenases are in PTHR11540.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  L-lactate and L-malate dehydrogenases are both present, and PANTHER labels even the subfamily
  containing P. putida Mdh (SF16) as L-lactate dehydrogenase; the PAINT tree separates the
  activities at distinct clade nodes.
