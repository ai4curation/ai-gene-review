    The MDH clade includes mitochondrial-matrix (yeast MDH1, human MDH2, S. pombe mdh1) and
    peroxisomal (yeast MDH3) isozymes alongside cytosolic and bacterial cytoplasmic ones, so
    cytoplasm is not a clade-wide property. The recipient reviews agree, keeping it only for the
    cytosolic yeast MDH2 and treating it as over-annotated or too general for the organellar
