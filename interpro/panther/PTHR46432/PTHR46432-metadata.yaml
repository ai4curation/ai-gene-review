  name:
    name: F-box only substrate-recognition component
    short: F-box_only_SRC
  description:
  - text: This family of proteins serves as substrate-recognition components within
      SCF-type E3 ubiquitin ligase complexes. They are involved in the targeted ubiquitination
      and subsequent proteasomal degradation of specific proteins, notably the tumor
      suppressor p53. By recognizing and binding to p53, they facilitate its ubiquitination,
      which is a post-translational modification leading to the protein's degradation.
      This regulatory mechanism is crucial for controlling the cell cycle and preventing
      the accumulation of damaged DNA, thereby playing a significant role in maintaining
      cellular homeostasis and preventing tumorigenesis.
