family_id: PANTHER:PTHR46432
family_name: F-BOX ONLY PROTEIN 42
summary: FBXO42 proteins are F-box substrate-recognition components of SCF ubiquitin-ligase complexes.
  In fly oocytes, Fbxo42 controls PP2A-B56 abundance and supports synaptonemal-complex maintenance; substrate
  choice varies among organismal contexts.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Direct fly experiments connect Fbxo42 to the SCF complex, PP2A-B56 regulation and maintenance
  of the synaptonemal complex (PMID:33382409). This provides evidence for the fly ubiquitin-system mechanism
  independently of a human p53 narrative. Fbxo42 recognizes substrates rather than catalyzing ubiquitin
  transfer itself. Broad substrate-adaptor architecture is coherent, while the distribution of specific
  substrates and an exhaustive protein-ubiquitination grant across all classified sequences remain unresolved;
  the positive fly evidence is retained without asserting unsupported exclusions of other branches.
