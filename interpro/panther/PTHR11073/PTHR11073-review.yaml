family_id: PANTHER:PTHR11073
family_name: CALRETICULIN AND CALNEXIN
preferred_name: Calreticulin/calnexin ER lectin chaperones
summary: >-
  PTHR11073 contains ER lectin chaperones of the calreticulin/calnexin family.
  The family shares an ER protein-folding and glycoprotein quality-control role,
  but its members split between soluble calreticulins, membrane calnexins, and
  lineage-specific relatives whose calcium-binding capacity is not uniformly conserved.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family is unified by a calreticulin/calnexin lectin-chaperone core, but
  the soluble/membrane topology and calcium-binding capacity differ in
  descendant branches and in specific members such as S. cerevisiae Cne1.
