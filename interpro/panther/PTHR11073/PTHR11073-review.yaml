node_assessments:
  - node_id: PANTHER:PTN000117401
    asserted_term:
      id: GO:0005789
      label: endoplasmic reticulum membrane
    evidence: IBD
    paint_snapshot: "20260528"
    seeds:
      - id: AGI_LocusCode:AT1G08450
      - id: FB:FBgn0015622
      - id: MGI:MGI:88252
      - id: SGD:S000000054
      - id: UniProtKB:A0A0D1C6P2
      - id: UniProtKB:P24643
      - id: UniProtKB:P27797
      - id: UniProtKB:P27824
    assessment: UNRESOLVED
    assessment_reason: >-
      ER localization is conserved across calreticulins and calnexins, and the
      direct S. cerevisiae seed supports ER membrane localization for Cne1, but
      this root membrane placement spans soluble calreticulins as well as
      single-pass membrane calnexins and should be checked separately for term
      specificity.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11073/PTHR11073-paint.tsv
        supporting_text: "PTHR11073\tPTN000117401\tGO:0005789\tC\tIBD\tfalse\tAGI_LocusCode:AT1G08450|FB:FBgn0015622|MGI:MGI:88252|SGD:S000000054|UniProtKB:A0A0D1C6P2|UniProtKB:P24643|UniProtKB:P27797|UniProtKB:P27824\ttaxon:\t20260528"
      - reference_id: PMID:7814381
        supporting_text: >-
          On the basis of its solubility in detergents and its lack of extraction
          from membranes by 2.5 M urea, high salt, and sodium carbonate at pH 11.5,
          we have established that Cne1p is an integral membrane protein.
  - node_id: PANTHER:PTN000117401
    asserted_term:
      id: GO:0005509
      label: calcium ion binding
    evidence: IBD
    paint_snapshot: "20230405"
    seeds:
      - id: MGI:MGI:107472
      - id: MGI:MGI:88252
      - id: PomBase:SPAC3C7.11c
      - id: RGD:620288
      - id: UniProtKB:P27797
      - id: WB:WBGene00000567
      - id: WB:WBGene00000802
    assessment: NEEDS_PRUNING
    proposed_action:
      paint_action: ADD_IRD
      target_node_id: PANTHER:PTN000117580
      target_node_taxon:
        id: NCBITaxon:559292
        label: Saccharomyces cerevisiae S288C
    assessment_reason: >-
      Calcium binding is well-supported for the calreticulin/calnexin root by
      animal, S. pombe and nematode seeds, but the S. cerevisiae CNE1 leaf has
      direct negative evidence: CNE1 is not a calcium-binding seed, and the
      Parlati study detected calcium-binding proteins in ER fractions but not
      calcium binding by Cne1p itself.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11073/PTHR11073-paint.tsv
        supporting_text: "PTHR11073\tPTN000117401\tGO:0005509\tF\tIBD\tfalse\tMGI:MGI:107472|MGI:MGI:88252|PomBase:SPAC3C7.11c|RGD:620288|UniProtKB:P27797|WB:WBGene00000567|WB:WBGene00000802\ttaxon:\t20230405"
      - reference_id: file:interpro/panther/PTHR11073/PTHR11073-entries.csv
        supporting_text: "P27825,Calnexin homolog,protein,559292,Saccharomyces cerevisiae (strain ATCC 204508 / S288c),Saccharomyces cerevisiae (strain ATCC 204508 / S288c) (Baker's yeast),CNE1,502,PTHR11073:SF1,CALNEXIN 14D-RELATED,True"
      - reference_id: PMID:7814381
        supporting_text: Ca2+ binding activity has not been detected for Cne1p.
      - reference_id: file:genes/yeast/CNE1/CNE1-uniprot.txt
        supporting_text: >-
          CC   -!- MISCELLANEOUS: In contrast with other calnexin, yeast CNE1 does not
          CC       seem to bind calcium.
  - node_id: PANTHER:PTN000117401
    asserted_term:
      id: GO:0006457
      label: protein folding
    evidence: IBD
    paint_snapshot: "20250902"
    seeds:
      - id: SGD:S000000054
      - id: UniProtKB:P27797
      - id: UniProtKB:Q6Q487
    assessment: SOUND
    assessment_reason: >-
      Protein folding captures the shared lectin-chaperone biology of the
      calreticulin/calnexin family, and S. cerevisiae Cne1 directly suppresses
      denaturation and enhances refolding of citrate synthase in assays that are
      sensitive to monoglucosylated oligosaccharides bound by its lectin site.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11073/PTHR11073-paint.tsv
        supporting_text: "PTHR11073\tPTN000117401\tGO:0006457\tP\tIBD\tfalse\tSGD:S000000054|UniProtKB:P27797|UniProtKB:Q6Q487\ttaxon:\t20250902"
      - reference_id: PMID:15173200
        supporting_text: >-
          Cne1p effectively suppressed the thermal denaturation of CS and
          enhanced the refolding of thermally or chemically denatured CS in a
          concentration-dependent manner.
  - node_id: PANTHER:PTN000117401
    asserted_term:
      id: GO:0036503
      label: ERAD pathway
    evidence: IBD
    paint_snapshot: "20240205"
    seeds:
      - id: SGD:S000000054
    assessment: SOUND
    assessment_reason: >-
      ER-associated degradation is supported for the S. cerevisiae seed and
      remains compatible with the broader calnexin/calreticulin quality-control
      cycle: Cne1p binds misfolded glycoprotein clients, retaining them in the ER
      and routing them for elimination via ERAD.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11073/PTHR11073-paint.tsv
        supporting_text: "PTHR11073\tPTN000117401\tGO:0036503\tP\tIBD\tfalse\tSGD:S000000054\ttaxon:\t20240205"
      - reference_id: PMID:25229868
        supporting_text: >-
          These results suggest that in yeasts, Cne1p interacts with misfolded
          lysozyme proteins possibly causing their retention in the ER and
          subsequent elimination via ER-associated degradation.
  - node_id: PANTHER:PTN002594615
    asserted_term:
      id: GO:0005509
      label: calcium ion binding
    evidence: IRD
    negated: true
    paint_snapshot: "20240918"
    seeds:
      - id: PANTHER:PTN000117401
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    assessment: LOSS_SUPPORTED
    assessment_reason: >-
      The CALR3-side IRD is independently supported by human CRT-2/CALR3
      localization and Stains-all assays: the protein localizes to the ER lumen
      but failed to show the Ca2+ binding detected for human CRT-1/CALR.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11073/PTHR11073-paint.tsv
        supporting_text: "PTHR11073\tPTN002594615\tGO:0005509\tF\tIRD\ttrue\tPANTHER:PTN000117401\ttaxon:32524\t20240918"
      - reference_id: PMID:21590275
        supporting_text: >-
          Stains-all staining, a method to detect Ca(2+)-binding proteins, could
          not stain the immunoprecipitate of HA-CRT-2, although HA-CRT-1
          immunoprecipitate was stained blue.
