      - id: RGD:620288
      - id: UniProtKB:P27797
      - id: WB:WBGene00000567
      - id: WB:WBGene00000802
    assessment: NEEDS_PRUNING
    proposed_action:
      paint_action: ADD_IRD
      target_node_id: PANTHER:PTN000117580
      target_node_taxon:
        id: NCBITaxon:559292
        label: Saccharomyces cerevisiae S288C
    assessment_reason: >-
      Calcium binding is well-supported for the calreticulin/calnexin root by
      animal, S. pombe and nematode seeds, but the S. cerevisiae CNE1 leaf has
      direct negative evidence: CNE1 is not a calcium-binding seed, and the
      Parlati study detected calcium-binding proteins in ER fractions but not
      calcium binding by Cne1p itself.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11073/PTHR11073-paint.tsv
        supporting_text: "PTHR11073\tPTN000117401\tGO:0005509\tF\tIBD\tfalse\tMGI:MGI:107472|MGI:MGI:88252|PomBase:SPAC3C7.11c|RGD:620288|UniProtKB:P27797|WB:WBGene00000567|WB:WBGene00000802\ttaxon:\t20230405"
      - reference_id: file:interpro/panther/PTHR11073/PTHR11073-entries.csv
        supporting_text: "P27825,Calnexin homolog,protein,559292,Saccharomyces cerevisiae (strain ATCC 204508 / S288c),Saccharomyces cerevisiae (strain ATCC 204508 / S288c) (Baker's yeast),CNE1,502,PTHR11073:SF1,CALNEXIN 14D-RELATED,True"
      - reference_id: PMID:7814381
        supporting_text: Ca2+ binding activity has not been detected for Cne1p.
  - node_id: PANTHER:PTN000117401
    asserted_term:
      id: GO:0006457
      label: protein folding
    evidence: IBD
    paint_snapshot: "20250902"
    seeds:
      - id: SGD:S000000054
      - id: UniProtKB:P27797
      - id: UniProtKB:Q6Q487
    assessment: SOUND
    assessment_reason: >-
      Protein folding captures the shared lectin-chaperone biology of the
      calreticulin/calnexin family, and S. cerevisiae Cne1 directly suppresses
      denaturation and enhances refolding of citrate synthase in assays that are
      sensitive to monoglucosylated oligosaccharides bound by its lectin site.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11073/PTHR11073-paint.tsv
        supporting_text: "PTHR11073\tPTN000117401\tGO:0006457\tP\tIBD\tfalse\tSGD:S000000054|UniProtKB:P27797|UniProtKB:Q6Q487\ttaxon:\t20250902"
      - reference_id: PMID:15173200
        supporting_text: >-
          Cne1p effectively suppressed the thermal denaturation of CS and
          enhanced the refolding of thermally or chemically denatured CS in a
          concentration-dependent manner.
  - node_id: PANTHER:PTN000117401
    asserted_term:
      id: GO:0036503
      label: ERAD pathway
    evidence: IBD
    paint_snapshot: "20240205"
    seeds:
      - id: SGD:S000000054
    assessment: SOUND
    assessment_reason: >-
      ER-associated degradation is supported for the S. cerevisiae seed and
      remains compatible with the broader calnexin/calreticulin quality-control
      cycle: Cne1p binds misfolded glycoprotein clients, retaining them in the ER
      and routing them for elimination via ERAD.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11073/PTHR11073-paint.tsv
        supporting_text: "PTHR11073\tPTN000117401\tGO:0036503\tP\tIBD\tfalse\tSGD:S000000054\ttaxon:\t20240205"
      - reference_id: PMID:25229868
        supporting_text: >-
          These results suggest that in yeasts, Cne1p interacts with misfolded
          lysozyme proteins possibly causing their retention in the ER and
          subsequent elimination via ER-associated degradation.
