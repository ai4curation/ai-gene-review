    assessment: UNRESOLVED
    assessment_reason: >-
      ER localization is conserved across calreticulins and calnexins, and the
      direct S. cerevisiae seed supports ER membrane localization for Cne1, but
      this root membrane placement spans soluble calreticulins as well as
      single-pass membrane calnexins and should be checked separately for term
      specificity.
