        supporting_text: "PTHR11073\tPTN000117401\tGO:0005789\tC\tIBD\tfalse\tAGI_LocusCode:AT1G08450|FB:FBgn0015622|MGI:MGI:88252|SGD:S000000054|UniProtKB:A0A0D1C6P2|UniProtKB:P24643|UniProtKB:P27797|UniProtKB:P27824\ttaxon:\t20260528"
      - reference_id: PMID:7814381
        supporting_text: >-
          Localization of the Cne1p protein by differential and analytical
          subcellular fractionation as well as by confocal immunofluorescence
          microscopy showed that it was exclusively located in the endoplasmic
          reticulum (ER)
  - node_id: PANTHER:PTN000117401
    asserted_term:
