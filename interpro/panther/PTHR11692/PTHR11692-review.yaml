family_id: PANTHER:PTHR11692
family_name: BIFUNCTIONAL PURINE BIOSYNTHESIS PROTEIN PURH
preferred_name: PurH/ATIC bifunctional AICAR transformylase / IMP cyclohydrolase family
summary: >-
  PurH (bacteria) and ATIC/ADE16/ADE17/ade10 (eukaryotes) catalyse the last two steps of de novo
  IMP synthesis. An N-terminal domain closes the purine ring (IMP cyclohydrolase, FAICAR to IMP)
  and a C-terminal domain transfers a formyl group from 10-formyltetrahydrofolate to AICAR
  (AICAR transformylase). The enzyme is a cytosolic homodimer in the characterized species.
  Every reviewed PANTHER member (472 entries, bacteria, fungi, plants and animals, 452 to 605
  residues) sits in the single subfamily SF0. S. cerevisiae has two isozymes, ADE16 and ADE17,
  either of which suffices for growth without adenine; ADE17 is repressed by adenine. Loss of
  both also causes histidine auxotrophy, because AICAR is a by-product of histidine
  biosynthesis.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed membership is one subfamily of full-length bifunctional proteins, and both
  activities have been measured on purified proteins from yeast, bacteria and animals. No
  reviewed member is truncated to a single domain. PANTHER also defines SF1 (AICARFT_IMPCHASE
  BIENZYME FAMILY PROTEIN) and SF2 (MGS-LIKE DOMAIN-CONTAINING PROTEIN). Neither has a reviewed
  member or a PAINT annotation, so neither was assessed here.
