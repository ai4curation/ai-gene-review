  assessment: SOUND
  assessment_reason: >-
    The node is the family root and is the only PAINT node in the family. It also carries IMP
    cyclohydrolase activity (GO:0003937), de novo IMP biosynthesis (GO:0006189) and cytosol
    (GO:0005829), each seeded from bacteria, fungi and animals. In the PAINT UniProt GAF its
    recipients include E. coli and B. subtilis PurH, S. cerevisiae ADE16 and ADE17, S. pombe
    ade10, human ATIC and Arabidopsis At2g35040. No IRD or IKR row on this node or below it was
    found in the PAINT tsv or in the PANTHER IBD file. All reviewed gene reviews (ADE16, ADE17,
    ATIC) accept the four IBAs.
term_assessments:
- assessed_term:
    id: GO:0004643
    label: phosphoribosylaminoimidazolecarboxamide formyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The C-terminal transformylase domain is present in every reviewed member. Activity has been
    measured on the purified yeast isozymes, and either yeast gene alone supports growth without
    adenine. This is the module's function for the purH_transformylase_activity annoton.
  supported_by:
  - reference_id: PMID:9143321
    supporting_text: Disruption of the two chromosomal yeast genes resulted in adenine auxotrophy,
      while the expression of either gene alone was sufficient to support growth without adenine.
  - reference_id: PMID:10877846
    supporting_text: Like their counterparts in other organisms, the yeast isozymes are bifunctional,
      containing both 5-aminoimidazole-4-carboxamide ribonucleotide transformylase and inosine
      monophosphate cyclohydrolase activities
- assessed_term:
    id: GO:0003937
    label: IMP cyclohydrolase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The N-terminal cyclohydrolase domain is present in every reviewed member, and both purified
    yeast isozymes carry the activity. This is the module's function for the
    purH_cyclohydrolase_activity annoton. Archaea that use the unrelated PurO cyclohydrolase are
    outside this family and are not affected.
  supported_by:
  - reference_id: PMID:10877846
    supporting_text: Like their counterparts in other organisms, the yeast isozymes are bifunctional,
      containing both 5-aminoimidazole-4-carboxamide ribonucleotide transformylase and inosine
      monophosphate cyclohydrolase activities
- assessed_term:
    id: GO:0006189
    label: '''de novo'' IMP biosynthetic process'
  scope: FAMILY_WIDE
  scope_reason: >-
    The two activities are the final two steps of de novo IMP synthesis. The enzyme performs
    them, so this is participation and not only requirement.
  supported_by:
  - reference_id: PMID:9143321
    supporting_text: transformylase, the ninth step of the de novo purine biosynthesis pathway
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: FAMILY_WIDE
  scope_reason: >-
    Both yeast isozymes are cytosolic by fractionation and immunofluorescence. Bacterial members
    are soluble cytoplasmic enzymes. No compartmentalized member is known.
  supported_by:
  - reference_id: PMID:10877846
    supporting_text: Both isozymes are localized to the cytosol
