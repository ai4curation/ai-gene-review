    label: Fungi
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    PTN001072874 is the fungal Pos5 clade (16 leaves, SF26). Pos5 is a mitochondrial NADH kinase that
    supplies mitochondrial NADPH (PMID:12727869); this node carries an IBD for NADH kinase activity and
    an IRD for NAD+ kinase activity. NADH kinase makes NADPH rather than NADP+, so removing NADP+ biosynthesis
    is consistent with PAINT's own NADH-kinase IBD on the node. The conflicting SGD IDA rests on the same
    paper.
