  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    PTN008367271 (56 leaves; plant NADK3 subfamilies SF28, SF41, SF37 with stramenopile relatives) is
    the NADH kinase clade of plants. Recombinant Arabidopsis NADK3 can phosphorylate NAD+ but its specificity
    constant for NADH is 100-fold higher (PMID:15347288); the node carries an NADH kinase IBD. The NAD+
    activity is a weak secondary activity, and Arabidopsis has dedicated NAD+ kinases (NADK1, NADK2),
    so the loss of NAD+ kinase activity as a function is supported.
  supported_by:
