family_id: PANTHER:PTHR20275
family_name: NAD KINASE
preferred_name: NAD(H) kinases
summary: >-
  PTHR20275 contains the NAD kinases, which phosphorylate NAD(H) at the adenosine 2'-hydroxyl to make
  NADP(H). Most members prefer NAD+ and make NADP+. Some lineages prefer NADH and make NADPH directly,
  among them the mitochondrial Pos5 of yeast and other fungi, and the plant cytoplasmic NADK3.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The kinase chemistry is shared; substrate preference (NAD+ versus NADH) differs between lineages, which
  PAINT records with NADH kinase IBDs and NAD+ kinase IRDs.
