    id: GO:0010099
    label: regulation of photomorphogenesis
  scope: UNRESOLVED
  scope_reason: Arabidopsis JMJ20/JMJ22 act downstream of light-activated PHYB in the cited germination
    experiments. The wheat F-box/JmjC architecture makes this plant branch a relevant comparison, while
    JMJD4/6/8 and other JmjC proteins are not thereby assigned a photomorphogenesis role. Conservation
    of the PHYB-regulated circuit and the complete positive plant branch boundary remain unresolved.
  supported_by:
