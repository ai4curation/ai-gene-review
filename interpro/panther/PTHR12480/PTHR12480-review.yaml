family_id: PANTHER:PTHR12480
family_name: ARGININE DEMETHYLASE AND LYSYL-HYDROXYLASE JMJD
preferred_name: JMJD4/JMJD6/JMJD8-related JmjC proteins
summary: This family includes JMJD4, JMJD6, JMJD8 and plant JMJ20/JMJ22-like proteins. JmjC architecture
  unites the group but does not establish a common substrate, chromatin role or developmental pathway.
functional_coherence: HETEROGENEOUS
coherence_reason: The wheat target and Arabidopsis JMJ22 share an F-box/JmjC architecture and an assigned
  subfamily, supporting a focused comparison. Plant light and gibberellin phenotypes require orthology
  and regulatory-context evidence; they do not apply to animal JMJD4/JMJD6/JMJD8. Histone arginine demethylation
  must be distinguished from other oxygenase activities.
