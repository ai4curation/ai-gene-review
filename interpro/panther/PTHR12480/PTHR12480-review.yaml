    id: GO:0010030
    label: positive regulation of seed germination
  scope: UNRESOLVED
  scope_reason: The Arabidopsis paper directly identifies redundant positive effects of JMJ20 and JMJ22
    on seed germination. That is stronger than a generic JmjC analogy but remains a plant regulatory-branch
    result. The wheat comparison requires orthology and preservation of seed expression and the GA3ox/PHYB
    context; no exhaustive germination-positive subfamily set is established.
