    label: gibberellin mediated signaling pathway
  scope: UNRESOLVED
  scope_reason: The JMJ20/JMJ22 study links these proteins to increased gibberellic acid through GA3ox1/GA3ox2
    regulation. That establishes a hormone-metabolism connection; it does not automatically identify every
    homolog as a component of the gibberellin signal-transduction pathway. Resolve biosynthesis versus
    signal reception/transduction and conserved plant regulatory context before transfer.
