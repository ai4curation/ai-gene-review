- assessed_term:
    id: GO:0040029
    label: epigenetic regulation of gene expression
  scope: UNRESOLVED
  scope_reason: The cited plant study reports removal of repressive histone arginine methylation at GA3ox
    loci, providing a specific chromatin-regulatory example. JmjC fold conservation alone does not establish
    histone substrate choice or an epigenetic mechanism in the wheat target or the animal JMJD branches.
    The biochemical substrate and locus-specific regulation delimit this hypothesis.
