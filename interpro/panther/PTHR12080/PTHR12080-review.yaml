node_assessments:
- node_id: PANTHER:PTN008989595
  asserted_term:
    id: GO:0048018
    label: receptor ligand activity
  evidence: IBD
  seeds:
  - id: UniProtKB:P09326
    label: CD48
    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    The CD48 clade (human, mouse and rat CD48) inherits receptor ligand activity, and the same
    node carries NOT signaling receptor activity. This correctly describes a GPI-anchored ligand
    of 2B4. Human CD48's own IDA (PMID:27249817) is the seed, and mouse CD48 binding of 2B4 is
    shown directly (PMID:9841922).
  node_taxon:
    id: NCBITaxon:32524
    label: Amniota
  paint_snapshot: '20260501'
- node_id: PANTHER:PTN008532944
  asserted_term:
    id: GO:0030101
    label: natural killer cell activation
  evidence: IBD
  seeds:
  - id: UniProtKB:P06729
    label: CD2
    organism: Homo sapiens
  - id: UniProtKB:P09326
    label: CD48
    organism: Homo sapiens
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node's descendants include CD2, CD48 and CD48-like proteins, among them human, mouse and rat
    CD2 and CD48. The term is right for human CD48, the ligand that triggers activating 2B4
    signalling on human NK cells, and for CD2 as an NK-cell receptor. It is wrong for mouse Cd48. In
    mouse, 2B4 ligation by CD48 inhibits NK lysis (PMID:15123744), and deleting the Slam locus,
    including Cd48, enhances NK activation, with the inhibition mapping to 2B4 (PMID:27573813). The
    positive term should therefore not descend to rodent Cd48. Mouse Cd48 is re-annotated to
    regulation of natural killer cell activation, plus negative regulation of NK cell mediated
    cytotoxicity. Rat is left unresolved because no rat data exist. The divergence lies in rodent
    2B4 signalling rather than in CD48 itself, so this is a lineage-specific sign inversion and not
    a loss of binding. No affected_subfamilies entry is given, because the pruning is
    rodent-specific within SF134 and human CD48 correctly keeps the term. In the PANTHER 19.0 tree
    the node is a Euteleostomi speciation node with 42 leaves in 19 species and 3 subfamilies.
  node_taxon:
    id: NCBITaxon:117571
    label: Euteleostomi
  paint_snapshot: '20260501'
  supported_by:
  - reference_id: file:interpro/panther/PTHR12080/PTHR12080-tree-nodes.yaml
    supporting_text: "PTN008532944 GO:0030101 IBD: PAINT node PTN008532944 is a speciation node at Euteleostomi, with 42 leaves in 19 species and 3 subfamilies."
- node_id: PANTHER:PTN008532944
  asserted_term:
    id: GO:0034113
    label: heterotypic cell-cell adhesion
  evidence: IBD
  seeds:
  - id: UniProtKB:P06729
    label: CD2
    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    CD2 mediates heterotypic adhesion with CD58 or CD48. CD48 inherits the term, which is
    appropriate because CD48 is the adhesive counter-receptor of CD2 in rodents
    (PMID:12356317). The adhesion is low affinity, so it is not the core function of CD48.
  node_taxon:
    id: NCBITaxon:117571
    label: Euteleostomi
  paint_snapshot: '20260501'
- node_id: PANTHER:PTN000249437
  asserted_term:
    id: GO:0038023
    label: signaling receptor activity
  evidence: IBD
  seeds:
  - id: MGI:MGI:1351314
    organism: Mus musculus
  - id: MGI:MGI:1921998
    organism: Mus musculus
  - id: UniProtKB:Q9BZW8
    label: CD244
    organism: Homo sapiens
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Signaling receptor activity is correct for the SLAM-related receptors and CD2. PAINT already
    prunes it from the CD48 and VSTM5 clades with NOT annotations. However, in GOA this node, a
    duplication node after Deuterostomia before Euteleostomi, also delivers this IBA to 27 rodent
    PSG/CEACAM proteins and human CEACAM21, which UniProt now classifies in PTHR44427 (see
    PTHR12080-iba-descendants.tsv). Pregnancy-specific glycoproteins are secreted, so a signaling
    receptor annotation is not appropriate for them. Those proteins should be re-rooted in their own
    family tree rather than inherit SLAM-family terms. CD58 does not receive this IBA in GOA, which
    is consistent with its ligand role. In the PANTHER 19.0 tree the node has 353 leaves in 20
    species and the 3 seeds sit in 2 of its 6 branches, so the node is their common ancestor.
  node_taxon:
    id: NCBITaxon:117571
    label: Euteleostomi
  paint_snapshot: '20260501'
  supported_by:
  - reference_id: file:interpro/panther/PTHR12080/PTHR12080-tree-nodes.yaml
    supporting_text: "PTN000249437 GO:0038023 IBD: PAINT node PTN000249437 is a duplication node after Deuterostomia before Euteleostomi, with 353 leaves in 20 species and 39 subfamilies."
  - reference_id: file:interpro/panther/PTHR12080/PTHR12080-tree-nodes.yaml
    supporting_text: "They sit in 2 of the 6 branches below the node, so the node is their common ancestor."
