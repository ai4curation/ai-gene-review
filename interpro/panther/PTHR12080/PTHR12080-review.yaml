notes: >-
  Written alongside the human, mouse and rat CD48 gene reviews. Family deep research was not run
  because the falcon, openai and perplexity providers were all unavailable in this environment.
  Main finding: in GOA, IBAs from the PTHR12080 root (PTN000249437), the T cell activation node
  (PTN008532932) and the outer-leaflet node (PTN008989435) reach 27 rodent Psg/Ceacam proteins
  and human CEACAM21, whose current UniProt PANTHER cross-reference is PTHR44427
  (CARCINOEMBRYONIC ANTIGEN-RELATED CELL ADHESION MOLECULE 19). This can be reproduced with
  iba_descendants.py. The most likely explanation is that the PAINT tree predates a PANTHER
  reclassification, but that has not been verified. Either way, these proteins inherit
  SLAM-receptor terms (signaling receptor activity, T cell activation) that their biology does
  not support. Tree topology was inferred from which proteins receive each node's IBA, not from
  the PANTHER tree file. No residue sites are curated, because the family's function rests on
  extracellular binding surfaces rather than catalytic residues.
