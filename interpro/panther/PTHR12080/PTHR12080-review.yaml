  seeds:
  - id: UniProtKB:P06729
    label: CD2
    organism: Homo sapiens
  - id: UniProtKB:Q9BZW8
    label: CD244
    organism: Homo sapiens
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Correct for every PTHR12080 member: transmembrane receptors and GPI-anchored ligands
    alike, including CD48. Descendants in GOA also include HEPACAM (PTHR44888) and the
    PTHR44427 PSG/CEACAM set. Secreted pregnancy-specific glycoproteins should not inherit a
