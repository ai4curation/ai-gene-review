family_id: PANTHER:PTHR12080
family_name: SIGNALING LYMPHOCYTIC ACTIVATION MOLECULE
preferred_name: CD2/SLAM subset of the immunoglobulin superfamily
summary: >-
  The CD2/SLAM family comprises hematopoietic cell-surface glycoproteins with a membrane-distal
  IgSF V-set domain and a membrane-proximal C2-set domain. It splits into two functional
  classes. The SLAM-related receptors (SLAMF1, LY9, CD84, SLAMF6, SLAMF7 and 2B4/CD244) are
  type I transmembrane receptors whose cytoplasmic immunoreceptor tyrosine-based switch motifs
  recruit SAP/EAT-2 adaptors; most are homophilic, while 2B4 binds CD48. CD2 is a transmembrane
  adhesion and costimulatory receptor. The ligand class has no signaling tail: CD48 is
  GPI-anchored and serves as the ligand of 2B4 (and of CD2 in rodents), and CD58/LFA-3 is the
  human CD2 ligand. SLAMF8, SLAMF9 and the neuronal VSTM5 are more distant members with less
  defined functions.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family groups signaling receptors (SLAM-related receptors, CD2) with ligands that lack a
  cytoplasmic domain (CD48, CD58), and with the neuronal VSTM5. PAINT already marks this split
  with NOT signaling receptor activity at the CD48 node (PTN008989595) and at the VSTM5 node
  (PTN007558151). Receptor-specific terms are therefore unsafe at the family root. In addition,
  27 rodent PSG/CEACAM proteins (and human CEACAM21), which UniProt now classifies in PTHR44427,
  still receive IBAs from PTHR12080 nodes in GOA (see notes).
