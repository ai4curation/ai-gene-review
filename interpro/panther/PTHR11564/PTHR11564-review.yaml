  description: >-
    The dominant subfamily, spanning bacterial Ffh (E. coli, B. subtilis,
    Thermus aquaticus, Mycoplasma, P. putida KT2440), archaeal SRP54 and
    eukaryotic SRP54 (human, mouse, yeast), and also Arabidopsis chloroplast
    SRP54. Subfamily membership therefore does not discriminate the bacterial
    plasma-membrane-targeting SRP from the eukaryotic ER-targeting SRP; the
    lineage of the member does.
