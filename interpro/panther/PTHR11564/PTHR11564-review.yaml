notes: >-
  PAINT places all IBD assertions for this family at a single eukaryotic node
  (PTN000169814), so bacterial Ffh receives no IBA annotations from it; the
  conserved GTPase, SRP RNA binding and signal-sequence receptor activities of
  Ffh rest on its own experimental annotations. A bacterial or root-level IBD
  for the non-ER-specific parents (GO:0003924, GO:0005048, GO:0008312) would
  be justified by the E. coli evidence. Bacterial Ffh belongs in the
  plasma-membrane-targeting SRP (GO:0048501), not the ER-targeting SRP
  (GO:0005786).
