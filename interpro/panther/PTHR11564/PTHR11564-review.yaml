family_id: PANTHER:PTHR11564
family_name: SIGNAL RECOGNITION PARTICLE 54K PROTEIN SRP54
preferred_name: SRP54/Ffh signal recognition particle GTPase family
summary: >-
  PTHR11564 contains the signal-sequence-binding GTPase subunit of the signal
  recognition particle (SRP) in all three domains of life: eukaryotic and
  archaeal SRP54 and bacterial Ffh. Members share an N-terminal N domain that
  contacts the ribosome, a central Ras-like G domain that binds and hydrolyses
  GTP, and a C-terminal methionine-rich M domain that binds both the SRP RNA
  (7SL/7S RNA in eukaryotes, 4.5S RNA in most bacteria) and the hydrophobic
  signal or signal-anchor sequence of a nascent chain emerging from the
  ribosome. The NG module heterodimerizes with the homologous NG module of the
  SRP receptor (SR alpha or bacterial FtsY, PTHR43134) in a GTP-dependent
  manner, forming a shared active site in which both GTPases are reciprocally
  activated; this drives handoff of the ribosome-nascent chain to the
  Sec61/SecYEG translocon and recycling of the targeting factors.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The signal-sequence receptor, GTPase and SRP-receptor-binding chemistry of
  the NGM architecture is shared by eukaryotic SRP54 and bacterial Ffh, which
  are experimentally characterized (E. coli Ffh and human SRP54 among the PAINT
  seeds and reviewed members). Coherence is not complete: PANTHER's only PAINT
  node is eukaryotic and carries ER-specific terms, and the family also
  includes plant chloroplast SRP54 (Arabidopsis FFC, P37107), whose particle
  composition and targeting route differ from the cytosolic SRPs.
