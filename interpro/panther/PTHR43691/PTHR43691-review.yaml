family_id: PANTHER:PTHR43691
family_name: URIDINE PHOSPHORYLASE
preferred_name: >-
  NP-I nucleoside phosphorylase family: uridine phosphorylase, DeoD-type PNP and AMP nucleosidase
summary: >-
  Nucleoside phosphorylase-I fold enzymes. Uridine phosphorylases (human UPP1 and UPP2, E. coli Udp)
  cleave uridine to uracil and ribose 1-phosphate in pyrimidine salvage and catabolism. SF2 and SF11
  hold bacterial DeoD-type purine nucleoside phosphorylases, and SF6 holds AMP nucleosidase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrates differ by subfamily: uridine (SF10, SF8, SF13), purine nucleosides (SF2, SF11) and AMP
  (SF6).
