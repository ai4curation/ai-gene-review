  assessment: SOUND
  assessment_reason: >-
    Correctly placed. Every member is the agonist of KISS1R, a G protein-coupled receptor,
    and initiates its signaling by binding it. The term is less specific than the evidence.
    Receptor activation by human, mouse and zebrafish peptides runs through phospholipase C
    and calcium, and the human and mouse gene reviews modify this IBA to GO:0007200
    phospholipase C-activating G protein-coupled receptor signaling pathway and GO:0007218
    neuropeptide signaling pathway for that reason. Both narrower terms hold family-wide
    (see term_assessments). The placement is not in dispute, so no PAINT change is requested
    for this row. Adding the narrower terms at the same node is recorded in notes.
