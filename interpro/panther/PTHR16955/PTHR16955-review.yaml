  assessment: SOUND
  assessment_reason: >-
    Every member is a secreted precursor with an N-terminal signal peptide, and the
    kisspeptins act on a receptor of another cell, so the extracellular region is where
    the activity is exerted. Both seeds have direct evidence. Human kisspeptin-10 was
    recovered from trophoblast conditioned medium, and rat hypothalamic explants release
    metastin into the medium. The node is the family root and no member lacks the
    property. The human and mouse gene reviews accept this IBA.
  supported_by:
