    The defining interaction of the family, and the seeds span both ends of the tree. Human
    kisspeptins bind rat and human GPR54 with low nanomolar affinity. Zebrafish Kiss1
    peptide activates the cloned sturgeon kisspeptin receptor KissR1, so binding to the
    receptor is retained in the one non-mammalian member. The term is a binding term. The
    agonist activity itself (GO:0048018 receptor ligand activity), which the human and mouse
    gene reviews use as the core molecular function, has no IBD in this family (see notes).
