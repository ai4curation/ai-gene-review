- assessed_term:
    id: GO:0007200
    label: phospholipase C-activating G protein-coupled receptor signaling pathway
  scope: FAMILY_WIDE
  scope_reason: >-
    The receptor pathway the kisspeptins initiate runs through Gq/11 and phospholipase C
    for human and mouse peptides, and zebrafish Kiss1 activates a fish receptor through
    PKC/Ca2+ as well as cAMP. Rat Kiss1 already carries this term by IDA, and the human and
    mouse gene reviews use it in place of the general GO:0007186 IBA. The ligand's part in
    the pathway is the initiating receptor-binding step.
  supported_by:
  - reference_id: PMID:12359743
    supporting_text: >-
      Activation of the receptor by KiSS1 peptide leads to the activation of
      G-protein-activated phospholipase C (PLC-beta), which suggests direct coupling of the
      KiSS1 peptide to the Galphaq-mediate PLC-Ca2+ signaling pathway.
  - reference_id: PMID:33301759
    supporting_text: >-
      Both sturgeon and zebrafish Kiss1 and Kiss2 activated rsKissR1 via both PKC/Ca2+ and
      PKA/cAMP signal-transduction pathways
- assessed_term:
    id: GO:0007218
    label: neuropeptide signaling pathway
  scope: FAMILY_WIDE
  scope_reason: >-
    In every species studied the kisspeptins are made by neurons and act on a neuronal
    receptor: hypothalamic kisspeptin neurons in mammals, and habenular and hypothalamic
    Kiss1 neurons in zebrafish. The human placental source does not make the pathway a
    different one, since the receptor and its coupling are the same.
  supported_by:
  - reference_id: PMID:25468546
    supporting_text: >-
      Kisspeptins, encoded by the Kiss1 gene, are a set of related neuropeptides that are
      required for activation of the mammalian reproductive axis at puberty and to maintain
      fertility.
  - reference_id: PMID:22454151
    supporting_text: >-
      Kiss2-expressing neurons in the hypothalamic nuclei are considered potent regulators
      of reproduction, whereas the role of Kiss1-expressing neurons in the habenula remains
      unknown.
- assessed_term:
    id: GO:0033686
    label: positive regulation of luteinizing hormone secretion
  scope: FAMILY_WIDE
  scope_reason: >-
    Directly shown for rat and human and genetically supported in mouse, and plausibly
    ancestral to bony vertebrates, since teleost KiSS-1 peptide induces LH secretion in sea
    bass. Zebrafish kiss1 is the weak point, because Kiss2 dominates gonadotropin control in
    that species, but no zebrafish result shows that Kiss1 lacks the activity (see the node
    assessment).
  supported_by:
  - reference_id: PMID:15219839
    supporting_text: >-
      This action was abolished by pretreatment with a GnRH antagonist, and was accompanied
      by induction of c-Fos immunoreactivity in GnRH neurons.
  - reference_id: PMID:19084576
    supporting_text: >-
      KiSS-2 decapeptide was significantly more potent than KiSS-1 peptide in inducing LH and
      FSH secretion in sea bass
