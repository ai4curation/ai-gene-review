family_id: PANTHER:PTHR16955
family_name: METASTASIS-SUPPRESSOR KISS-1
preferred_name: Kisspeptin precursor (KISS1) family
summary: >-
  Secreted precursors of the kisspeptins, the C-terminally amidated RF-amide peptides that
  are the endogenous agonists of the G protein-coupled receptor KISS1R (GPR54). The
  precursor carries an N-terminal signal peptide and is cleaved at paired basic residues
  into kisspeptin-54 (metastin), kisspeptin-14, kisspeptin-13 and kisspeptin-10, whose
  amidated C-terminal decapeptide binds and activates the receptor. The receptor couples to
  Gq/11 and phospholipase C. The PANTHER family is a single orthogroup of bony vertebrates:
  one subfamily (SF6) whose tree holds the KISS1 orthologs of 14 mammals and zebrafish
  kiss1. The non-mammalian paralog Kiss2, lost in placental mammals, is not part of it. In
  mammals the dominant role is neuroendocrine. Kisspeptin neurons of the arcuate
  (infundibular) and anteroventral periventricular or preoptic regions release the peptide
  onto GnRH neurons and drive GnRH and hence luteinizing hormone and follicle-stimulating
  hormone secretion, puberty and fertility. Loss of the gene causes hypogonadotropic
  hypogonadism in human and mouse. The placental role differs between species. Human
  syncytiotrophoblast expresses KISS1 at very high levels, secretes kisspeptin into the
  maternal circulation and restrains trophoblast migration, whereas mouse placental Kiss1
  expression is negligible and the mouse placenta develops normally without kisspeptin
  signaling. In teleosts the gonadotropic role is shared with Kiss2, which is the more
  potent of the two in sea bass and zebrafish, and zebrafish Kiss1 neurons sit in the
  habenula, where they modulate the serotonergic system.
functional_coherence: COHERENT
coherence_reason: >-
  Every member is the same kind of molecule: a signal-peptide-bearing precursor of an
  amidated RF-amide agonist of KISS1R. Receptor binding, receptor ligand activity,
  extracellular action and the phospholipase C-coupled receptor pathway hold family-wide,
  and the four PAINT rows at the family root are all sound. What varies between members is
  where the peptide is made and which physiology it drives, not its molecular activity. The
  placental arm is a human (primate) feature that mouse lacks. In zebrafish, Kiss1 is mainly
  habenular and Kiss2 dominates gonadotropin control. Context-specific process terms, such
  as a placental or trophoblast process, should therefore be curated on the gene and not
  placed at a family node.
