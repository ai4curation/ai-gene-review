notes: >-
  PAINT has four IBD rows for this family, all at the root PTN002704209 (Euteleostomi), and
  no IRD or IKR rows. All four are judged SOUND, so no proposed_action is recorded.
  Additions the verdict vocabulary cannot carry: an IBD for GO:0048018 receptor ligand
  activity at PTN002704209, since the node now asserts only the binding term, and IBDs for
  GO:0007200 and GO:0007218 at the same node to sit under the general GO:0007186 row. Rat
  Kiss1 already carries GO:0007200 by IDA. Context terms such as a placental or
  trophoblast process should stay on the individual genes, because the human placental role
  is absent in mouse. Gene-review cross-check: the human KISS1 and mouse Kiss1 reviews
  accept the GO:0005576, GO:0031773 and GO:0033686 IBAs and modify GO:0007186 to GO:0007200
  and GO:0007218, consistent with this review.
