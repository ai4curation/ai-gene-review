  seeds:
  - {id: "RGD:727850", label: Kiss1, organism: Rattus norvegicus}
  assessment: SOUND
  assessment_reason: >-
    Seeded by rat Kiss1 only, and sound for the mammalian members. In rat, peripheral
    metastin raises gonadotropins through GnRH neurons, and blocking endogenous kisspeptin
    in the preoptic area abolishes the estrogen-induced LH surge. Human kisspeptin-54
    infusion raises plasma LH, and mouse Kiss1 nulls fail sexual maturation. The one place
    to look harder is zebrafish kiss1, the only non-mammalian leaf. In zebrafish, Kiss2 rather
    than Kiss1 raised pituitary gonadotropin beta-subunit mRNA, and kiss1, kiss2 and double
    mutants reproduce normally. Neither result refutes the term. The first measures subunit
    transcription rather than LH secretion, and the second shows that the system is not
    required in zebrafish, not that Kiss1 has no stimulatory effect. In sea bass, the
    teleost KiSS-1 peptide does induce LH and FSH secretion, although less potently than
    KiSS-2, so the activity is plausibly ancestral to bony vertebrates. No loss in zebrafish
    is established, so no IRD is requested. The zebrafish kiss1 IBA rests on ancestry rather
    than on zebrafish data. The proximal step is GnRH release, which GO has no term for, so
    this is the most proximal term available.
  supported_by:
  - reference_id: PMID:15219839
    supporting_text: >-
      This action was abolished by pretreatment with a GnRH antagonist, and was accompanied
      by induction of c-Fos immunoreactivity in GnRH neurons.
  - reference_id: PMID:17213691
    supporting_text: >-
      We demonstrated that preoptic area (POA) infusion of the anti-rat metastin/kisspeptin
      monoclonal antibody blocked the estrogen-induced LH surge
  - reference_id: PMID:16174713
    supporting_text: >-
      Kisspeptin-54 infusion significantly increased plasma LH, FSH, and testosterone
      concentrations compared with saline infusion
  - reference_id: PMID:19084576
    supporting_text: >-
      KiSS-2 decapeptide was significantly more potent than KiSS-1 peptide in inducing LH and
      FSH secretion in sea bass
  - reference_id: PMID:18927220
    supporting_text: >-
      In sexually mature female zebrafish, Kiss2 but not Kiss1 administration significantly
      increased FSH-beta (2.7-fold, P < 0.05) and LH-beta (8-fold, P < 0.01) mRNA levels in
      the pituitary
  - reference_id: PMID:25406015
    supporting_text: >-
      We have demonstrated that spermatogenesis and folliculogenesis as well as reproductive
      capability are not impaired in all of these 6 mutant lines.
term_assessments:
- assessed_term:
    id: GO:0048018
    label: receptor ligand activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The kisspeptins are agonists of KISS1R in every member tested, from human to zebrafish,
    and the peptide's activity is exerted on the receptor of another cell. This is the core
    molecular function used by the human and mouse gene reviews and by the human GO-CAM
    models of the pathway. It has no IBD in this family.
  supported_by:
  - reference_id: PMID:11385580
    supporting_text: >-
      encodes a carboxy-terminally amidated peptide with 54 amino-acid residues, which we
      have isolated from human placenta as the endogenous ligand of an orphan
      G-protein-coupled receptor (hOT7T175) and have named 'metastin'
  - reference_id: PMID:33301759
    supporting_text: >-
      Both sturgeon and zebrafish Kiss1 and Kiss2 activated rsKissR1 via both PKC/Ca2+ and
      PKA/cAMP signal-transduction pathways
- assessed_term:
