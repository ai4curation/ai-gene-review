    label: ECHS1
    organism: Homo sapiens
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    PTN000941828 is not a node of this family's own tree: PANTHER's TreeGrafter table maps it to
    PTHR11941:AN0, the root of the large crotonase family, and it enters this slice because E. coli
    PaaG inherits from it (PANTHER 19.0 classifies PaaG in PTHR11941:SF133). Its seeds are
    mammalian mitochondrial beta-oxidation enzymes (ECHS1, Eci1). For the PaaG branch the term is
    wrong: PaaG is the ring 1,2-epoxyphenylacetyl-CoA/oxepin-CoA isomerase of phenylacetate
    catabolism (PMID:20660314), and the PaaF-PaaG structure showed its active site is adapted to
    the Paa pathway intermediates rather than to fatty acid beta-oxidation substrates
    (PMID:22961985); E. coli fatty acid beta-oxidation uses FadB/FadJ, not PaaG. The PaaG-containing
    subfamily should be pruned from this IBD. See the PTHR11941 review for the assessment of the
    same node across the crotonase family (TOO_DEEP there).
