family_id: PANTHER:PTHR43459
family_name: ENOYL-COA HYDRATASE
preferred_name: Crotonase-fold PaaG-like isomerases and hydratase homologs
summary: >-
  A small crotonase-superfamily (enoyl-CoA hydratase/isomerase fold, Pfam PF00378) family
  carved out by PANTHER. Its best-characterized member is E. coli PaaG, the ring
  1,2-epoxyphenylacetyl-CoA isomerase of aerobic phenylacetate catabolism, which reversibly
  converts the epoxide made by the PaaABCE epoxidase into the seven-membered oxepin-CoA. PaaG
  forms a stable hydratase-isomerase complex with the enoyl-CoA hydratase PaaF and is related to
  Delta3,Delta2-enoyl-CoA isomerases, with a single conserved active-site aspartate proposed as
  proton relay. The other reviewed members (Amycolatopsis DpgB of 3,5-dihydroxyphenylglycine
  biosynthesis, B. subtilis YhaR, Rhodobacter FadB1, M. tuberculosis EchA10/EchA11, P. aeruginosa
  PA1021) are annotated enoyl-CoA hydratase-like proteins whose physiological substrates are
  largely unestablished. PANTHER 19.0's own classification files place E. coli PaaG in the large
  crotonase family PTHR11941 (subfamily SF133) instead, so membership of this family is unstable.
functional_coherence: UNKNOWN
coherence_reason: >-
  Only PaaG is biochemically characterized; the remaining members are assigned enoyl-CoA
  hydratase-like names by homology, and the one other member with a known pathway (DpgB) acts in
  antibiotic precursor biosynthesis rather than in beta-oxidation or phenylacetate catabolism.
  The crotonase fold supports very different reactions (hydration, isomerization,
  decarboxylation), so family-level function cannot be inferred from the fold. PaaG's
  epoxide-oxepin isomerase activity is specific to the phenylacetate pathway.
