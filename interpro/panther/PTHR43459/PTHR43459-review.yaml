notes: >-
  Classification conflict: E. coli PaaG (P77467) carries the UniProt cross-reference PTHR43459:SF1
  (EG:BACN32G11.4 PROTEIN), and InterPro's member list for PTHR43459 includes it, but PANTHER
  19.0's own E. coli classification file (.cache/panther/PTHR19.0_e_coli) assigns it to
  PTHR11941:SF133 (1,2-EPOXYPHENYLACETYL-COA ISOMERASE), and its IBA comes from the PTHR11941 root
  node PTN000941828. P. putida KT2440 PaaG (Q88HS0) has only the PTHR43459:SF1 cross-reference.
  Curator decision: P77467 is recorded in PTHR43459:SF1, the subfamily holding both PaaG
  exemplars, by a row in interpro/panther/panther-members-overrides.tsv. Because SF1 also holds
  uncharacterized hydratase-like proteins, the phenylacetate_catabolism module now selects the
  PaaG step with the paa-specific NCBIfam model NCBIfam:TIGR02280 rather than this subfamily. The E. coli paaG gene
  review must not retain GO:0006635 (fatty acid beta-oxidation) for consistency with this review.
  The PTHR43459 PAINT slice contains no node of PTHR43459's own tree.
