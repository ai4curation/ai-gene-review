family_id: PANTHER:PTHR12632
family_name: TRANSCRIPTION FACTOR NF-Y ALPHA-RELATED
preferred_name: NF-YA/Hap2 CCAAT-binding complex subunits
summary: NF-YA/Hap2 proteins form the sequence-recognition component of the heteromeric CCAAT-binding
  transcription factor. DNA binding and transcriptional regulation depend on assembly with the other NF-Y
  subunits. Fungal iron and oxidative-stress responses and plant developmental functions represent deployment
  of this conserved transcriptional machinery in different regulatory networks.
functional_coherence: COHERENT
coherence_reason: The inventory consistently identifies NF-YA/Hap2, the CCAAT-recognition subunit of a
  heteromeric transcription factor. Curated IPR001289 separates its subunit-association and DNA-recognition
  regions. DNA recognition and transcriptional regulation require the assembled NF-Y/Hap complex; mitochondrial
  respiratory targets in yeast or iron-responsive circuits in particular fungi are not universal target
  regulons.
