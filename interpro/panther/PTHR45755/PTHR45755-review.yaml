family_id: PANTHER:PTHR45755
family_name: FAMILY NOT NAMED
summary: This zinc-transporter group includes fungal Cis4/Msc2, animal ZNT5/ZNT7 and related plant proteins.
  Members connect secretory-pathway metal supply with zinc homeostasis and the maturation of zinc-dependent
  cellular functions.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Direct pombe experiments establish a Cis4/Zrg17 heteromer that supplies zinc to the
  cis-Golgi, especially under zinc deficiency. This contrasts with Zhf1-dependent ER zinc handling in
  the same organism. Zinc transport is conserved across characterized related proteins, but partner dependence,
  exact organelle and physiological conditions are branch-specific.
subfamilies:
- subfamily_id: PANTHER:PTHR45755:SF4
  label: ZINC TRANSPORTER 7
  description: Verified sequence-classification group containing cis4. Functional transfer is qualified
    in the family and term assessments.
  representative_members:
  - id: UniProtKB:Q9HGQ3
    gene_symbol: cis4
    organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
    gene_review: genes/SCHPO/cis4/cis4-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0005385
    label: zinc ion transmembrane transporter activity
  scope: UNRESOLVED
  scope_reason: Cis4/Zrg17-dependent cis-Golgi zinc transport is supported directly, with cytosolic zinc
    accumulation in deletion mutants under low-zinc conditions. This establishes target zinc transport
    but not identical membrane location, transport partners or specificity of every unexamined family
    member.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR45755-evidence.md
    supporting_text: Probable zinc transporter involved in Golgi membrane trafficking through the regulation
      of zinc homeostasis
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR45755-evidence.md
    supporting_text: This entry represents a group of metal transporters, including Msc2 from budding
      yeasts, Cis4 from fission yeasts, SLC30A5/7 (also known as ZNT7/5) from humans and MTPC2/MTP12 from
      Arabidopsis. They are zinc transporters involved in zinc ion homeostasis [[cite:PUB00098538], [cite:PUB00098539],
      [cite:PUB00098540], [cite:PUB00098541]]. ZNT5/7 in the early secretory pathway, regulate the activation
      and folding of enzymes like alkaline phosphatases and enzymes involved in phosphatidylinositol glycan
      anchor biosynthesis [[cite:PUB00101859]].
  - reference_id: PMID:29529046
    supporting_text: 'Cis4 and Zrg17 form a heterodimeric complex that

      transports zinc into the cis-Golgi.'
references:
- id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR45755-evidence.md
- id: PMID:18199682
  title: Cation diffusion facilitator Cis4 is implicated in Golgi membrane trafficking via regulating
    zinc homeostasis in fission yeast.
- id: PMID:29529046
  title: Zinc transporters belonging to the Cation Diffusion Facilitator (CDF) family have complementary
    roles in transporting zinc out of the cytosol.
review_status: COMPLETE
reviewed_by: codex
review_date: '2026-09-10'
notes: The name of the official SF4 subfamily is preserved even though the pombe protein is Cis4. The
  low-zinc Golgi import function must not be generalized into all ER zinc handling or to the catalytic
  activities of zinc-dependent clients.
