family_id: PANTHER:PTHR20837
family_name: CENTROSOMAL PROTEIN-RELATED
preferred_name: CC2D2A/CC2D2B ciliary-associated proteins
summary: CC2D2A participates in the transition-zone machinery that maintains the ciliary membrane as a
  distinct signaling compartment. Disruption of the complex alters cilia formation and receptor retention.
  The family also contains CC2D2B-related proteins, whose presence does not by itself establish the same
  transition-zone role.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Direct mammalian complex studies support CC2D2A-dependent organization of the ciliary
  diffusion barrier. The member inventory includes the CC2D2B paralog, so a blanket grant of every CC2D2A
  function is premature without comparative localization and domain evidence for that branch.
