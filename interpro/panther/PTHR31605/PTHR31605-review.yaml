family_id: PANTHER:PTHR31605
family_name: GLYCEROL-3-PHOSPHATE O-ACYLTRANSFERASE 1
preferred_name: Fungal glycerol-3-phosphate/DHAP acyltransferase (GPT2/SCT1) family
summary: >-
  ER-localized acyl-CoA:glycerol-3-phosphate acyltransferases of yeasts and protists that make lysophosphatidic
  acid, the first step of glycerolipid synthesis. They also acylate dihydroxyacetone phosphate (S.
  cerevisiae GPT2/GAT1 and SCT1/GAT2, S. pombe SPBC1718.04).
functional_coherence: COHERENT
coherence_reason: Both subfamilies are dual-specificity G3P/DHAP acyltransferases.
