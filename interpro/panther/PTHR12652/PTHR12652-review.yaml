notes: >-
  Written for the PAINT "human no-IBA" project, but the no-IBA status of human
  PEX11B is stale: the 2025-09-03 PAINT update at PTN000291586 (both rows in the
  cached PTHR12652-paint.tsv) now propagates GO:0005778 and GO:0016559 IBAs to
  O96011, and both appear in the current GOA slice and are reviewed ACCEPT in
  genes/human/PEX11B/PEX11B-ai-review.yaml. Node ids, seeds, taxon and dates are
  verbatim from the cached paint.tsv; taxon:2759 expanded to NCBITaxon:2759
  Eukaryota. Subfamily labels are verbatim from PTHR12652-entries.csv. Human
  membership fact-check: panther-members.tsv places PEX11G (Q96HA9) in
  PTHR20990, so it is not a member of this family despite the common
  three-paralog framing of the "PEX11 family" in the literature. Seed ids
  without labels (AGI/RGD/SGD/Q383C6) are copied verbatim and left unlabeled
  rather than guessed. No residue_sites: the family's function is
  membrane-deformation by an N-terminal amphipathic region and oligomerization,
  not a point-catalytic-residue question, and no UniProt active/binding-site
  features anchor one.
