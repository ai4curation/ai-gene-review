    assessment: SOUND
    assessment_reason: >-
      Peroxisome fission is the ancestral, defining process of this family:
      seeds cover plant, fungal and human members (plus one further UniProt
      seed, Q383C6, left unlabeled), and
      membrane-elongation-then-division activity is the conserved mechanism
      described for yeast, plant and human PEX11 proteins (PMID:20826455).
      Human PEX11B has direct IDA support (PMID:9792670, PMID:17408615,
      PMID:20826455), so the descending IBA (GOA date 2025-09-03) is sound and
      is reviewed ACCEPT in the gene review.

term_assessments:
  - assessed_term:
      id: GO:0007165
      label: signal transduction
    scope: NOT_APPLICABLE
    scope_reason: >-
      An old ISS transfer (from PEX11A, GO_REF:0000024) annotates human PEX11B
      to signal transduction. No member of this family is a signal transducer:
      PEX11 proteins are membrane-remodeling effectors of peroxisome division,
      and human PEX11B is constitutively expressed and unresponsive to
      peroxisome proliferators. The gene review recommends REMOVE; a PAINT
      curator should not propagate any signaling term in this family.
    supported_by:
      - reference_id: PMID:9792670
        supporting_text: "Levels of PEX11beta mRNA were similar in all tissues examined and were unaffected by peroxisome-proliferating agents"

