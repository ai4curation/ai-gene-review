    assessment: SOUND
    assessment_reason: >-
      Peroxisomal membrane localization is experimentally demonstrated across
      plants (five Arabidopsis loci), fungi, rat and both human paralogs, so
      placing the assertion at the eukaryotic root node is well supported and
      every descendant plausibly inherits it. Human PEX11B carries direct IDA
      evidence for this term (PMID:9792670, PMID:14709540) and correctly appears
      among the seeds of its own IBA; the resulting IBA row (GOA date
      2025-09-03) is reviewed ACCEPT in the PEX11B gene review.
