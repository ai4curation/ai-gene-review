family_id: PANTHER:PTHR12652
family_name: PEROXISOMAL BIOGENESIS FACTOR 11
preferred_name: PEX11 peroxisome proliferation/fission family (fungal PEX11/PEX25, plant PEX11A-E, animal PEX11A/PEX11B)
summary: >-
  Pan-eukaryotic family of integral peroxisomal membrane proteins that drive
  peroxisome proliferation by the growth-and-division pathway: they deform and
  elongate the peroxisomal membrane and coordinate recruitment of the shared
  fission machinery (FIS1/MFF and the dynamin-related GTPase DRP1/DNM1L/Dnm1) to
  complete organelle division. The fetched reviewed slice spans fungi
  (S. cerevisiae PEX11/PMP27 and the divergent paralog PEX25, Candida boidinii
  PMP30A/B, S. pombe pex11), plants (Arabidopsis PEX11A-E, rice PEX11-1..5),
  amoebozoa (Dictyostelium pex11) and animals (mammalian PEX11A and PEX11B).
  Human PEX11B (the family's best-characterized mammalian member) is the
  constitutive driver of peroxisome fission: its overexpression alone induces
  peroxisome proliferation, its N-terminal domain mediates the
  homo-oligomerization required for membrane elongation, and it forms ternary
  complexes with FIS1 and DLP1. Note that human PEX11G is NOT in this family —
  the PANTHER member index places Q96HA9 in PTHR20990 — so the family's human
  members are PEX11A (SF22) and PEX11B (SF7) only.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member is a peroxisomal membrane protein acting in
  peroxisome proliferation/maintenance, so the two PAINT-asserted terms
  (peroxisomal membrane; peroxisome fission) are safe family-wide. Divergence
  within the family is regulatory and quantitative rather than a change of
  molecular job: mammalian PEX11A is peroxisome-proliferator-inducible whereas
  PEX11B is constitutively expressed, and the yeast PEX25 branch within the
  PEROXIN 11 subfamily acts in peroxisome membrane dynamics with a
  paralog-specific emphasis distinct from Pex11p itself.
