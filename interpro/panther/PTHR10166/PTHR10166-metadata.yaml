  name:
    name: Voltage-dependent calcium channel subunit alpha-2/delta
    short: Ca_channel_alpha-2/delta
  description:
  - text: The calcium channel subunit alpha-2/delta family comprises proteins that
      act as regulatory subunits for voltage-dependent calcium channels, influencing
      calcium current density and activation/inactivation kinetics. These subunits
      are involved in various calcium-dependent processes, including excitation-contraction
      coupling and neural depolarization-induced calcium influx. They contain a MIDAS-like
      motif within the VWFA domain that binds divalent metal cations, essential for
      trafficking the alpha-1 subunit to the plasma membrane. Some family members
      may also regulate calcium-activated signaling pathways affecting motor activity
      and neurotransmitter responses.
