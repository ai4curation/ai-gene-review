family_id: PANTHER:PTHR10166
family_name: VOLTAGE-DEPENDENT CALCIUM CHANNEL SUBUNIT ALPHA-2/DELTA-RELATED
preferred_name: Calcium channel alpha-2/delta subunits and VWA/Cache-domain relatives
summary: >-
  Extracellular VWA- and Cache-domain proteins. The best characterised members are the alpha-2/delta auxiliary
  subunits of high-voltage-activated calcium channels (vertebrate alpha-2/delta-1 to -4, C. elegans UNC-36,
  Drosophila straightjacket and stolid), disulfide-linked alpha-2 and delta chains anchored to the outer
  face of the plasma membrane that increase channel trafficking and current density and modify gating.
  The family also contains VWA/Cache proteins such as human CACHD1.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The two reviewed members, CACNA2D1 and CACNA2D4, and the PAINT seeds are all calcium-channel auxiliary
  subunits that regulate current density and kinetics. The VWA/Cache subfamilies (SF68 CACHD1, SF66 CG16868,
  SF43, SF65, SF67) were not examined and may differ.
