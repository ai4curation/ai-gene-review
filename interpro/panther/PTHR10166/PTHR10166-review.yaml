notes: >-
  PAINT has three node-level IBD rows and no losses. Seed identifiers resolved through UniProt (MGI:88295
  Cacna2d1, MGI:1929813 Cacna2d2, RGD:2247/631360/631361 rat Cacna2d1/2/3, WBGene00006772 unc-36). Not
  examined: subfamilies SF7 (alpha-2/delta-2), SF25 (alpha-2/delta-3), SF37 (UNC-36/stolid), SF31, SF63
  (straightjacket), the VWA/Cache subfamilies (SF43, SF65, SF66, SF67, SF68) and the node tree, so whether
  CACHD1-type members inherit the root IBAs is open. The PAINT file carries no qualifier; the reviewed
  gene files show the voltage-gated calcium channel activity IBA delivered with enables, which both gene
  reviews note should be contributes_to for an auxiliary subunit.
