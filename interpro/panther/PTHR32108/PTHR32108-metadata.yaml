  name:
    name: DNA-directed RNA polymerase alpha subunit
    short: RNA_pol_alpha_subunit
  description:
  - text: The RNA polymerase alpha chain family is characterized by its role in the
      assembly and function of DNA-dependent RNA polymerase (RNAP), an enzyme crucial
      for the transcription of DNA into RNA. The N-terminal domain of the family members
      is essential for the assembly of RNAP and basal transcription activity. In contrast,
      the C-terminal domain is involved in interactions with transcriptional regulators
      and upstream promoter elements. This dual-domain structure facilitates the catalysis
      of transcription using the four ribonucleoside triphosphates as substrates,
      making it a key player in gene expression regulation.
