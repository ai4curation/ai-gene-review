notes: 'Written with the bacterial_rna_polymerase_core module. The module grounds the alpha role on InterPro
  IPR011773 rather than on PTHR32108:SF0, because the PANTHER match is absent from InterPro and UniProt
  and the P. putida and B. subtilis exemplars cannot be resolved in the PANTHER member index. Member gene
  reviews: E. coli K-12 rpoA (P0A7Z4), B. subtilis 168 rpoA (P20429), P. putida KT2440 rpoA (Q88QL1) and
  Populus trichocarpa plastid rpoA (A4GYU3).'
