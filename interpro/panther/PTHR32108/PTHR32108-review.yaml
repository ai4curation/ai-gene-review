family_id: PANTHER:PTHR32108
family_name: DNA-DIRECTED RNA POLYMERASE SUBUNIT ALPHA
preferred_name: Bacterial and plastid RNA polymerase alpha subunit (RpoA) family, with unrelated eukaryotic
  subfamilies
summary: PANTHER family whose subfamily SF0 holds the alpha subunit (RpoA) of bacterial and plastid-encoded
  multisubunit RNA polymerases. Alpha has an N-terminal dimerization and assembly domain (homologous in
  fold to archaeal Rpo3/Rpo11 and eukaryotic RPB3/RPB11, which PANTHER classifies elsewhere) and a flexibly
  tethered C-terminal domain that binds UP promoter elements and transcription activators. PANTHER 19.0
  classification files place E. coli K-12 RpoA (P0A7Z4) and B. subtilis RpoA (P20429) in SF0; InterPro
  does not integrate the PANTHER match, so UniProt records carry no PANTHER cross-reference for RpoA.
  The other subfamilies are named for unrelated eukaryotic proteins (dynactin subunit 1-like, Gag-pro,
  reverse transcriptase RNase H-like domain, G-patch domain), plus a second alpha-named subfamily (SF7).
functional_coherence: HETEROGENEOUS
coherence_reason: 'SF0 is functionally coherent: every member is an RNAP alpha subunit that dimerizes
  to nucleate core assembly. The family as a whole is not, because subfamilies SF5, SF6, SF8, SF9 and
  SF10 are named for proteins with no relation to RNA polymerase. RNAP-alpha claims should therefore be
  scoped to SF0 and never made at the family level.'
