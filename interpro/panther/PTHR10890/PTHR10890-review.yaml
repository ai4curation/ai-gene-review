term_assessments:
- assessed_term:
    id: GO:0004817
    label: cysteine-tRNA ligase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The activity is ancestral at the PTN000095308 CysRS node and reaches both
    reviewed human paralogs. The sibling PTN000235847 MetRS branch carries
    methionine-tRNA ligase and methionyl-tRNA aminoacylation IBDs rather than this
    cysteine-specific function, and PAINT already prunes the small actinobacterial
    SepCysS branch that gained O-phosphoseryl-tRNA:Cys-tRNA synthase activity.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10890/PTHR10890-paint.tsv
    supporting_text: "PTHR10890\tPTN002248462\tGO:0004817\tF\tIRD\ttrue\tPANTHER:PTN000095308\ttaxon:2037"
- assessed_term:
    id: GO:0005737
    label: cytoplasm
  scope: FAMILY_WIDE
  scope_reason: >-
    Bacterial members, cytosolic eukaryotic CysRS members, mitochondrial CARS2,
    and plastidial/mitochondrial plant members all satisfy cytoplasm at GO's
    broad granularity. Human target reviews should still prefer cytosol for CARS1
    and mitochondrion for CARS2.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10890/PTHR10890-paint.tsv
    supporting_text: "PTHR10890\tPTN000095308\tGO:0005737\tC\tIBD\tfalse\tAGI_LocusCode:AT2G31170|MGI:MGI:1919191|SGD:S000005191|UniProtKB:A0A1D6LAG9|UniProtKB:P21888|UniProtKB:P49589|UniProtKB:Q585F2|UniProtKB:Q8IJP3|UniProtKB:Q9HA77"
