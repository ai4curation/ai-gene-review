family_id: PANTHER:PTHR10890
family_name: CYSTEINYL-TRNA SYNTHETASE
preferred_name: Cysteinyl-tRNA synthetase family
summary: >-
  Cysteinyl-tRNA synthetases are class I aminoacyl-tRNA synthetases that activate
  cysteine with ATP and transfer it to tRNA(Cys). In human the family is split into
  a cytosolic paralog, CARS1, and a nuclear-encoded mitochondrial paralog, CARS2.
  The PANTHER family also contains bacterial CysRS branches, plant/plastidial
  CysRS-related enzymes, a mitochondrial methionyl-tRNA synthetase branch, and a
  small actinobacterial branch that is pruned from the ancestral cysteine-tRNA
  ligase activity and instead carries O-phosphoseryl-tRNA:Cys-tRNA synthase activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The ATP-dependent cysteine-tRNA ligase reaction is ancestral to the PTN000095308
  CysRS clade that covers the human CARS1 and CARS2 branches, but PTHR10890 also
  includes a separate PTN000235847 MetRS branch with methionine-tRNA ligase and
  methionyl-tRNA aminoacylation IBDs. PAINT already records loss of the CysRS
  activity on the actinobacterial branch that gained O-phosphoseryl-tRNA:Cys-tRNA
  synthase activity. Localization diverges at narrower nodes: animal CARS1 is
  cytosolic, animal CARS2 is mitochondrial, and a plant branch carries mitochondrial
  and chloroplast locations.
