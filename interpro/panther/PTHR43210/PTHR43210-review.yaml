- assessed_term:
    id: GO:0004141
    label: dethiobiotin synthase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The single activity of the family, across SF5, SF2 and SF4. The biotin_biosynthesis module
    selects only SF5. That covers its exemplars (E. coli BioD1, P. putida BioD, BIO4) but leaves
    out the BioD of SF2 (for example B. subtilis) and SF4 (enterobacterial BioD2). The family-level
    id PTHR43210 would be the complete selector.
  supported_by:
  - reference_id: PMID:10333520
    supporting_text: >-
      We demonstrate that BIO3 (YNR058w) and BIO4 (YNR057c) encode, respectively, a 7,
      8-diaminopelargonic acid aminotransferase and a dethiobiotin synthase
