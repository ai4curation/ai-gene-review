family_id: PANTHER:PTHR43210
family_name: DETHIOBIOTIN SYNTHETASE
preferred_name: Monofunctional dethiobiotin synthetase (BioD/BIO4)
summary: >-
  BioD-type dethiobiotin synthetases are P-loop NTPase-fold ligases. They use ATP and CO2 to
  carboxylate 7,8-diaminononanoate (DAPA) and close its ureido ring, giving dethiobiotin, the
  penultimate intermediate of biotin synthesis. The family contains the monofunctional BioD of
  bacteria and archaea (E. coli BioD1 and BioD2, B. subtilis BioD, M. tuberculosis BioD) and
  S. cerevisiae BIO4. The BioD domains of the bifunctional BioDA proteins of filamentous fungi and
  plants are not classified here; PANTHER places those proteins in the BioA family PTHR42684. One
  reviewed member, Bordetella BioCD (Q2KXN6), is a BioC-BioD fusion.
functional_coherence: COHERENT
coherence_reason: >-
  All characterized members are dethiobiotin synthetases, and the three subfamilies (SF5, SF2 and
  SF4) are all BioD. SF2 and SF4 are both named "ATP-DEPENDENT DETHIOBIOTIN SYNTHETASE BIOD 2",
  and they hold the second E. coli/Salmonella/Yersinia paralog and many other bacterial BioD.
  The subfamily split is phylogenetic, not functional. Synechocystis slr0039 (Q55458) is an
  uncharacterized second copy in SF5.
