notes: >-
  The module biotin_biosynthesis (bioD_activity) uses PTHR43210:SF5 with GO:0004141 and
  correctly notes that the BioDA fusions are classified in the BioA family (PTHR42684) and are
  listed at the BioA step. The SF5-only selector is narrower than the function (see the
  GO:0004141 scope_reason). The BIO4 review accepts the GO:0004141 and GO:0009102 IBAs, and the
  P. putida bioD review has no IBA rows; both are consistent here. Node membership was checked in
  the PAINT UniProt GAF on 2026-10-06.
