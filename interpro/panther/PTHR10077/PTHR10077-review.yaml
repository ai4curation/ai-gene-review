family_id: PANTHER:PTHR10077
family_name: CALPASTATIN
preferred_name: Calpastatin family
summary: >-
  Single-subfamily calpastatin family represented in the local reviewed
  InterPro inventory by mammalian CAST orthologs, including human CAST. Human
  CAST is the only reviewed Swiss-Prot human member.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed proteins are vertebrate calpastatins with repeated inhibitory
  domains that block calcium-dependent calpain cysteine proteases. PAINT places
  cytoplasm and calcium-dependent cysteine-type endopeptidase inhibitor
  activity on the same Euteleostomi CAST node, and the local human member has
  direct deletion-mapping evidence for the inhibitory activity.
