notes: >-
  modules/histidine_biosynthesis.yaml grounds the hisG step with two architecture variants: short
  form (P. putida HisG, with HisZ from PTHR11476) and long form (S. cerevisiae HIS1, S. pombe his1,
  M. tuberculosis HisG). All four representatives are PTHR21403:SF8, so a PANTHER family id can
  ground the catalytic annoton of either variant but cannot by itself select one architecture; the
  module's InterPro form-specific entries (IPR024893 short, IPR020621 long) remain the
  discriminating grounding. The tree-check file was generated with interpro/panther/tree_check.py
  against PANTHER 19. The M. tuberculosis hisG gene review is being written separately, so no
  gene_review path is given for P9WMN1 here.
