family_id: PANTHER:PTHR21403
family_name: ATP PHOSPHORIBOSYLTRANSFERASE  ATP-PRTASE
preferred_name: ATP phosphoribosyltransferase (HisG) family
summary: >-
  ATP phosphoribosyltransferases (HisG; EC 2.4.2.17) condense ATP and 5-phospho-alpha-D-ribose
  1-diphosphate (PRPP) to N1-(5-phospho-beta-D-ribosyl)-ATP, the first committed and main
  feedback-controlled step of L-histidine biosynthesis. The family spans bacteria, archaea, fungi
  and plants. Two architectures exist: long-form HisG (HAMAP HisG_Long; e.g. S. cerevisiae HIS1,
  S. pombe his1, E. coli and M. tuberculosis HisG) carries a C-terminal regulatory domain that binds
  L-histidine, whereas short-form HisG (HAMAP HisG_Short; e.g. P. putida HisG) lacks that domain
  and acts with a separate HisZ regulatory subunit, a catalytically inactive histidyl-tRNA
  synthetase paralog classified in PTHR11476. Both forms carry the catalytic core and catalyse the
  same reaction. PANTHER does not separate the two forms: SF8 holds both short- and long-form
  bacterial and fungal enzymes, SF10 holds mainly archaeal and anaerobic-bacterial HisG, and SF7
  and SF9 hold plant (chloroplastic) enzymes.
functional_coherence: COHERENT
coherence_reason: >-
  Every subfamily is an ATP phosphoribosyltransferase. The short-form/long-form difference concerns
  how the enzyme is regulated (an intrinsic C-terminal domain versus a separate HisZ subunit), not
  which reaction it catalyses, so the catalytic and pathway terms are safe family-wide.
