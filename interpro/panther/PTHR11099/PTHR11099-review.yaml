residue_sites:
  - site_id: vps35_n_terminal_vps26_interface
    label: VPS35 Leu108 VPS26-binding interface residue
    description: >-
      Conserved leucine (Leu108) in the N-terminal PRLYL motif of human VPS35
      that docks onto the C-terminal arrestin subdomain of VPS26A/VPS26B to
      assemble the retromer cargo-selective complex.
    anchor:
      id: UniProtKB:Q96QK1
      label: Vacuolar protein sorting-associated protein 35
      gene_symbol: VPS35
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: UNIPROT_FEATURE
    residues:
      - position: 108
        expected:
          - L
        role: >-
          Hydrophobic anchor in the N-terminal VPS26-binding interface; L108P
          mutation abolishes VPS26A binding
    required_for:
      - term:
          id: GO:0030904
          label: retromer complex
        strength: CONTRIBUTES
        rationale: >-
          Leu108 is essential for VPS35-VPS26 heterotrimer assembly at the
          N-terminal end of the VPS35 alpha-solenoid.
        supported_by:
          - reference_id: file:genes/human/VPS35/VPS35-uniprot.txt
            supporting_text: "L->P: Disrupts interaction with VPS26; no effect on interaction with VPS29."
  - site_id: vps35_c_terminal_vps29_interface
    label: VPS35 His675 VPS29-binding interface residue
    description: >-
      Histidine-675 in the C-terminal horseshoe-shaped alpha-solenoid arch of
      VPS35 that cradles the metallophosphoesterase-fold subunit VPS29.
    anchor:
      id: UniProtKB:Q96QK1
      label: Vacuolar protein sorting-associated protein 35
      gene_symbol: VPS35
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: UNIPROT_FEATURE
    residues:
      - position: 675
        expected:
          - H
        role: >-
          C-terminal alpha-solenoid interface residue required for VPS29 binding
          without affecting VPS26 interaction
    required_for:
      - term:
          id: GO:0030904
          label: retromer complex
        strength: CONTRIBUTES
        rationale: >-
          Mutation of His675 to Arg in the C-terminal alpha-solenoid arch of
          VPS35 disrupts interaction with VPS29 while leaving VPS26 binding
          intact.
        supported_by:
          - reference_id: file:genes/human/VPS35/VPS35-uniprot.txt
            supporting_text: "H->R: Disrupts interaction with VPS29. Does not effect interaction with VPS26."
term_assessments:
  - assessed_term:
      id: GO:0140312
      label: cargo adaptor activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Vps35 is the conserved central platform of the retromer cargo-selective
      complex across Eukaryota (PTN000120819), directly associating with
      cytoplasmic tails of transmembrane cargos and with Vps26 and Vps29 to
      prevent lysosomal missorting.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11099/PTHR11099-paint.tsv
        supporting_text: "PTHR11099\tPTN000120819\tGO:0140312\tF\tIBD\tfalse\tSGD:S000003690\ttaxon:2759\t20251127"
      - reference_id: file:genes/human/VPS35/VPS35-uniprot.txt
        supporting_text: >-
          Acts as a component of the retromer cargo-selective complex (CSC). The
          CSC is believed to be the core functional component of retromer or
          respective retromer complex variants acting to prevent missorting of
          selected transmembrane cargo proteins into the lysosomal degradation
          pathway.
  - assessed_term:
      id: GO:0030904
      label: retromer complex
    scope: FAMILY_WIDE
    scope_reason: >-
      All members of PTHR11099 assemble with Vps26 and Vps29 at opposite ends of
      the Vps35 alpha-solenoid to form the retromer cargo-selective complex
      across Eukaryota.
    supported_by:
