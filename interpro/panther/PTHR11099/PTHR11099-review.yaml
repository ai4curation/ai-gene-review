family_id: PANTHER:PTHR11099
family_name: VACUOLAR SORTING PROTEIN 35
preferred_name: Retromer cargo-selective complex subunit VPS35
summary: >-
  Vps35 proteins form the elongated alpha-solenoid central scaffold of the
  heterotrimeric retromer cargo-selective complex (Vps35-Vps26-Vps29) across
  eukaryotes. Vps35 binds Vps26 at its N-terminal arrestin-interacting end and
  Vps29 at its C-terminal horseshoe-shaped arch, recognizes cytoplasmic sorting
  motifs on endosomal transmembrane cargo proteins, and recruits accessory
  trafficking machinery such as the WASH complex and TBC1D5 to mediate
  endosome-to-trans-Golgi network retrograde retrieval and endosome-to-plasma
  membrane recycling.
functional_coherence: COHERENT
coherence_reason: >-
  All characterized family members across fungi, amoebozoa, plants, and
  metazoans are Vps35 orthologs or lineage-specific paralogs (such as
  Arabidopsis VPS35A, VPS35B, and VPS35C) that serve as the core cargo-binding
  platform of the retromer cargo-selective subcomplex, supported by
  pan-eukaryotic PAINT IBD placement at PTN000120819.
