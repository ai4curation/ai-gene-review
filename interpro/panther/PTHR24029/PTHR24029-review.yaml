      id: PANTHER:PTHR24029:SF1
      name: TRANSCRIPTION-REPAIR-COUPLING FACTOR
  - reference_id: file:genes/ECOLI/mfd/mfd-uniprot.txt
    supporting_text: In the N-terminal section; belongs to the UvrB family.
  - reference_id: file:genes/ECOLI/mfd/mfd-uniprot.txt
    supporting_text: Couples transcription and DNA repair by recognizing RNA polymerase (RNAP) stalled at DNA lesions.
