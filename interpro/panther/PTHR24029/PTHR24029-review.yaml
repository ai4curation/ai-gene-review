- subfamily_id: PANTHER:PTHR24029:SF1
  label: TRANSCRIPTION-REPAIR-COUPLING FACTOR
  description: >-
    No reviewed members, so no representative is declared. A UniProt query for
    PTHR24029:SF1 (2026-11-10) returned 189 unreviewed entries, mostly transcription-repair
    coupling factors (Mfd) and Mfd fragments from Neisseriales and Caryophanales.
  diverged_from_family: true
  divergence_description: >-
    Mfd-type proteins grouped here through their N-terminal UvrB-like module. Mfd is a
    DNA translocase that removes stalled RNA polymerase and recruits UvrA; it does not
    verify lesions or join the UvrBC incision complex, so UvrB-specific terms
    (excinuclease repair complex, damaged DNA binding, the UvrB ATPase) should not
    descend to this subfamily.
  supported_by:
  - reference_id: file:interpro/panther/panther.obo
