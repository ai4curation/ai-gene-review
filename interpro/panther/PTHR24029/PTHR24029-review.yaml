term_assessments:
- assessed_term:
    id: GO:0016887
    label: ATP hydrolysis activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    UvrB's DNA-dependent ATPase is shown for E. coli UvrB: cryptic in the free protein,
    activated in the UvrAB complex, and required to form an incision-competent complex;
    helicase motif V/VI mutants lose damage-induced ATP hydrolysis. The Walker A and
    helicase motifs are conserved across SF0 (P. putida Q88LF9 included). SF1 Mfd-type
    proteins hydrolyse ATP through a different, C-terminal translocase module, and many
    SF1 entries are fragments, so the UvrB ATPase claim is scoped to SF0.
  applicable_subfamilies:
  - id: PANTHER:PTHR24029:SF0
    label: UVRABC SYSTEM PROTEIN B
  supported_by:
  - reference_id: PMID:2974538
    supporting_text: the stimulation in DNA dependent ATPase activity following formation of the UvrAB complex results from the activation of the normally sequestered UvrB associated ATPase
  - reference_id: PMID:10713125
    supporting_text: To initiate the formation of an active UvrBC-DNA incision complex, however, UvrB first needs to hydrolyze ATP, and subsequently a new ATP molecule must be bound.
  - reference_id: PMID:8035457
    supporting_text: the helicase motifs V and VI are involved in the induction of ATP hydrolysis in the presence of (damaged) DNA and in the strand-displacement activity of the UvrA2B complex
  - reference_id: file:genes/PSEPK/uvrB/uvrB-bioinformatics/RESULTS.md
    supporting_text: The Walker A segment (GVTGSGKT) and all six beta-hairpin residues characterised by mutagenesis in E. coli UvrB (Y92, Y93, Y95, Y96, Y101, F108) are conserved in P. putida UvrB
- assessed_term:
    id: GO:0003684
    label: damaged DNA binding
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Lesion-specific binding by the beta-hairpin and nucleotide-flipping pocket is the
    UvrB damage-verification activity, conserved across SF0 orthologs; SF1 Mfd-type
    proteins recognise stalled RNA polymerase rather than the lesion itself.
  applicable_subfamilies:
  - id: PANTHER:PTHR24029:SF0
    label: UVRABC SYSTEM PROTEIN B
  supported_by:
  - reference_id: PMID:11689453
    supporting_text: The mutant protein forms pre- incision complexes on non-damaged DNA, indicating that Y92 and Y93 function in damage recognition by preventing UvrB binding to non-damaged sites.
  - reference_id: PMID:16532007
    supporting_text: The nucleotide directly behind the beta-hairpin is flipped out and inserted into a small, highly conserved pocket in UvrB.
- assessed_term:
    id: GO:0009380
    label: excinuclease repair complex
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Every UvrB is an excinuclease subunit; SF1 Mfd-type proteins only contact UvrA. See
    the NEEDS_PRUNING assessment of PTN001168039.
  applicable_subfamilies:
  - id: PANTHER:PTHR24029:SF0
    label: UVRABC SYSTEM PROTEIN B
  supported_by:
  - reference_id: PMID:12145219
    supporting_text: After association with the UvrC protein, one of the UvrB monomers is released.
- assessed_term:
    id: GO:0009381
    label: excinuclease ABC activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    The GO term is catalysis of hydrolysis of DNA ester linkages flanking the lesion. Both
    incision catalytic sites are in UvrC, so no UvrB enables this activity; UvrB at most
    contributes to it as part of the complex. The UniRule IEA that gives UvrB this term
    with 'enables' is marked over-annotated in both member gene reviews.
  supported_by:
  - reference_id: PMID:10671556
    supporting_text: Here we show that the catalytic site for incision on the 3' side is in this protein as well
