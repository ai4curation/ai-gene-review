  seeds:
  - id: UniProtKB:P0A8F8
  assessment: SOUND
  assessment_reason: >-
    The node is the family root (TreeGrafter maps PTHR24029:AN0 to PTN001168039) and is
    seeded by E. coli UvrB, whose role in lesion recognition is established
    experimentally. All SF0 members are UvrB orthologs. The SF1 Mfd-type proteins also
    inherit the term; for Mfd this is still defensible, since transcription-coupled damage
    recognition (GO:0000716) is an is_a child of this term. The node placement is right.
  supported_by:
  - reference_id: file:interpro/panther/PTHR24029/PTHR24029-paint.tsv
    supporting_text: "PTHR24029\tPTN001168039\tGO:0000715\tP\tIBD\tfalse\tUniProtKB:P0A8F8"
  - reference_id: PMID:12145219
    supporting_text: Upon binding of the UvrA(2)B(2) complex to a putative damaged site, the DNA wraps around one of the UvrB monomers, which will subsequently probe one of the DNA strands for the presence of a lesion.
  - reference_id: PMID:11689453
    supporting_text: Residues Y95 and Y96 at the base of the hairpin have a direct role in damage recognition and are positioned close to the damage in the UvrB-DNA complex.
- node_id: PANTHER:PTN001168039
