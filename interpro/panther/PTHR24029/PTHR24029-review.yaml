family_id: PANTHER:PTHR24029
family_name: UVRABC SYSTEM PROTEIN B
preferred_name: UvrB damage-verification ATPase family
summary: >-
  The bacterial UvrB family. UvrB is the damage-verification subunit of the UvrABC
  nucleotide excision repair system: a superfamily 2 helicase-like ATPase with two
  RecA-like domains, a damage-sensing beta-hairpin and a C-terminal UVR domain that
  contacts UvrC. Two UvrB subunits join a UvrA dimer to scan DNA; UvrB's DNA-dependent
  ATPase, cryptic in the free protein and activated in the UvrAB complex, drives strand
  opening and formation of the UvrB-DNA preincision complex, which then recruits the
  UvrC endonuclease. Subfamily SF0 holds every reviewed member (all UvrB). Subfamily SF1,
  named TRANSCRIPTION-REPAIR-COUPLING FACTOR, holds only unreviewed proteins, most of them
  transcription-repair coupling factors (Mfd) or Mfd fragments, which carry an N-terminal
  UvrB-like module but are not UvrB.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The cached reviewed inventory has 377 members, all named UvrABC system protein B, gene
  uvrB, and all assigned to PTHR24029:SF0 (lengths 645 to 870 residues, median 670; the
  only one above 750 is Q98I01, 870 residues). These are a single orthologous group with
  one function. The exception is SF1 (TRANSCRIPTION-REPAIR-COUPLING FACTOR), which has no
  reviewed members. A UniProt query for PTHR24029:SF1 run for this review (2026-11-10)
  returned 189 unreviewed entries: 140 named transcription-repair coupling factor and most
  of the rest UvrB-interaction-domain or CarD-like/TRCF fragments, chiefly from
  Neisseriales (62) and Caryophanales (35); Neisseria UvrB itself stays in SF0. These are
  Mfd-type proteins, whose N-terminal section belongs to the UvrB family. Mfd recruits
  UvrA and moves RNA polymerase, but it is not an excinuclease subunit or a
  lesion-verification ATPase, so UvrB-specific terms are scoped to SF0.
