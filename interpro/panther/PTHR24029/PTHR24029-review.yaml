  - reference_id: PMID:12145219
    supporting_text: Using scanning force microscopy, we show here that the damage recognition complex consists of two UvrA and two UvrB subunits, with the DNA wrapped around one of the UvrB monomers.
  - reference_id: PMID:2546148
    supporting_text: Addition of UvrC protein to purified UvrB-DNA complexes results in rapid incision of the DNA, presumably catalyzed by an excision nuclease containing only UvrB and UvrC subunits.
  - reference_id: file:genes/ECOLI/mfd/mfd-uniprot.txt
