  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Correct for every UvrB (SF0): UvrB is a subunit of the UvrA2B2 scanning complex and
    of the UvrBC incision complex, as seeded by E. coli UvrB. Because the node is the
    family root, the term also descends (via TreeGrafter) to SF1, whose Mfd-type
