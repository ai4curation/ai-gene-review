notes: >-
  PAINT has a single ancestral node in this family, PTN001168039 at the family root,
  seeded only by E. coli UvrB; the short seed list is not weak support. P. putida KT2440
  UvrB (Q88LF9) receives no IBA rows because KT2440 is not a PANTHER reference proteome
  (the PANTHER Pseudomonas genome is P. aeruginosa, whose UvrB P72174 does inherit both
  terms). The SF1 composition was derived from a UniProt query for PTHR24029:SF1 run on
  2026-11-10 (189 unreviewed entries); it was not saved as a file, so re-run it before
  relying on the counts. E. coli Mfd itself (P30958) is classified in PTHR47964, not here.
