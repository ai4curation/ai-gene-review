family_id: PANTHER:PTHR46683
family_name: OROTATE PHOSPHORIBOSYLTRANSFERASE 1-RELATED
preferred_name: PyrE-type monofunctional orotate phosphoribosyltransferase family
summary: >-
  Monofunctional, Mg2+-dependent orotate phosphoribosyltransferases (OPRTases) of the type I
  phosphoribosyltransferase fold, about 200 to 240 residues long. They transfer the
  5-phosphoribosyl group of PRPP to orotate, forming orotidine 5'-phosphate (OMP), the fifth
  step of de novo UMP synthesis. The family covers bacterial PyrE (E. coli, Pseudomonas and
  many others), archaea and fungi, where budding yeast has two paralogues (URA5, the major
  enzyme, and URA10) and fission yeast one (ura5). Animals and plants instead fuse OPRTase
  with OMP decarboxylase in UMP synthase, which PANTHER places in PTHR19278. PANTHER defines a
  single subfamily (SF1) holding all 196 reviewed members. One archaeal member,
  Methanobrevibacter smithii A5ULL0, is named transcriptional regulator GfcR, a PRTase-fold
  protein that is not established as an OPRTase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  195 of the 196 reviewed members are named orotate phosphoribosyltransferase, and the
  experimentally studied members (S. cerevisiae URA5 and URA10, S. pombe ura5) carry the
  activity, with loss of uracil prototrophy or OPRTase activity on mutation. The one
  divergent member is archaeal GfcR (A5ULL0), named as a transcriptional regulator; its
  catalytic status is not established here, so it is excepted from the activity grant.
