notes: >-
  Modules using this family: de_novo_pyrimidine_synthesis lists P. putida pyrE (Q88C92),
  S. cerevisiae URA5 (P13298) and URA10 (P30402) and S. pombe ura5 (O94331) as OPRTase
  representatives under an InterPro family selector, alongside human UMPS, whose OPRTase
  domain belongs to PTHR19278. All five representative gene reviews are COMPLETE. The PAINT
  slice has one node (PTN002928258) carrying all five rows; its taxon column (Eukaryota) does
  not match its bacterial seeds and was not used for the assessment.
