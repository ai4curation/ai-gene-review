  assessment_reason: >-
    Placed at the family root and seeded by fungal (both yeast paralogues, Aspergillus) and
    bacterial (E. coli, P. aeruginosa) enzymes, so the activity is ancestral to the family.
    Every characterized member has it. The paint row's taxon column reads Eukaryota although
    the seeds include bacteria; the seeds, not the taxon label, show that the node is the
    family root. The archaeal GfcR member is the only candidate exception and is recorded
    as such in the term assessment.
