- node_id: PANTHER:PTN002928258
  asserted_term:
    id: GO:0046132
    label: pyrimidine ribonucleoside biosynthetic process
  evidence: IBD
  paint_snapshot: '20180413'
  seeds:
  - id: SGD:S000004574
    organism: Saccharomyces cerevisiae
  - id: SGD:S000004884
    organism: Saccharomyces cerevisiae
  assessment: WRONG_NODE
  proposed_action:
    paint_action: REMOVE_IBD
  assessment_reason: >-
    No member makes a pyrimidine ribonucleoside. OPRTase forms OMP, a ribonucleotide, and the
    pathway it serves ends in UMP. The seeds are the two yeast OPRTases, whose own rows on
    this term are reviewed in their gene reviews as a mis-chosen term to be replaced by
    'de novo' UMP biosynthetic process. The seeds do not have the asserted function, so they
    do not support the term at this node. No other node is a better home, because no member
    makes a ribonucleoside; the fix is to retire the IBD (REMOVE_IBD) rather than move it.
  supported_by:
