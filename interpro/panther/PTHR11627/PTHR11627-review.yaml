- assessed_term:
    id: GO:0061609
    label: fructose-1-phosphate aldolase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Module fructolysis (aldob_activity) assigns fructose-1-phosphate aldolase activity to PTHR11627 with
    ALDOB as the representative. All class I aldolases can cleave fructose 1-phosphate to some degree,
    but the physiologically significant activity is the aldolase B property that PAINT places at the
    vertebrate ALDOB node (PTN002614886). Granting the term family-wide would assign the fructolysis
    step to aldolase A and C and to the invertebrate and plant enzymes, which is not supported. Safe
    for SF2 only.
  applicable_subfamilies:
