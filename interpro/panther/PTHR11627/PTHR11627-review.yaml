residue_sites:
- site_id: class_i_aldolase_catalytic_pair
  description: >-
    The Schiff-base lysine and the proton-acceptor glutamate of class I aldolase, read from the UniProt
    ACT_SITE features of human ALDOA. K230 is Lys229 in the mature-protein numbering of the crystal
    structure papers.
  anchor:
    id: UniProtKB:P04075
    label: Fructose-bisphosphate aldolase A
    gene_symbol: ALDOA
    organism: Homo sapiens
  anchor_sequence_version: 2
  residues:
  - position: 188
    expected:
    - E
    role: proton acceptor
  - position: 230
    expected:
    - K
    role: Schiff-base nucleophile (forms the covalent intermediate with dihydroxyacetone phosphate)
  site_source: UNIPROT_FEATURE
  required_for:
  - term:
      id: GO:0004332
      label: fructose-bisphosphate aldolase activity
    strength: REQUIRED
    rationale: >-
      Class I aldolase catalysis runs through a covalent Schiff-base intermediate on the active-site
      lysine; there is no metal cofactor that could substitute for it, so a member without that lysine
      cannot perform the class I reaction.
    supported_by:
    - reference_id: PMID:10048322
      supporting_text: Catalysis involves the formation of a Schiff's base intermediate formed at the
        epsilon-amino group of Lys229.
