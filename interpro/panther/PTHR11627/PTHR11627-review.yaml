  scope: FAMILY_WIDE
  scope_reason: >-
    The modules use PTHR11627 for the aldolase step (emp_glycolysis and gluconeogenesis, paired with the
    class II family PTHR30559; glycolysis_investment_phase with human ALDOA). The activity is ancestral
    to the family and depends on the Schiff-base lysine; every checked member except Drosophila Ald2
    keeps it. Ald2 is listed as an exception, consistent with PAINT's IKR. The ALDOA, ALDOB and C.
    elegans aldo-1 gene reviews accept the inherited activity.
