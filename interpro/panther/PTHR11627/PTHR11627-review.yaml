      display distinct activity profiles with fructose 1,6-bisphosphate and with fructose 1-phosphate.
  - reference_id: file:genes/human/ALDOB/ALDOB-ai-review.yaml
    supporting_text: '- description: ALDOB cleaves fructose 1-phosphate into dihydroxyacetone phosphate and glyceraldehyde'
  - reference_id: file:modules/fructolysis.yaml
    supporting_text: ALDOB tetramer cleaves Fru-1-P to GA and DHAP (human Reactome reaction)
