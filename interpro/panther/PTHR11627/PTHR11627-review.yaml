    exception_reason: >-
      Glutamine replaces the Schiff-base lysine (K230 in ALDOA numbering) and serine replaces the
      proton-acceptor glutamate (E188). PAINT records IKR NOT fructose-bisphosphate aldolase activity at
      PTN000179461, the Ald2 leaf, so the protein receives no IBA.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11627/PTHR11627-catalytic-residue-check.md
      supporting_text: '- Q9VBF5 Ald2 (PTHR11627:SF80): E188->S188, K230->Q230; LACKS_CATALYTIC_RESIDUES;
        GO:0004332 IBA from PTN004279385: no'
  supported_by:
  - reference_id: PMID:10048322
    supporting_text: Fructose 1,6-bisphosphate aldolase catalyzes the reversible cleavage of fructose
      1,6-bisphosphate and fructose 1-phosphate to dihydroxyacetone phosphate and either glyceraldehyde
      3-phosphate or glyceraldehyde, respectively.
  - reference_id: file:modules/emp_glycolysis.yaml
    supporting_text: animals and plants use the unrelated Schiff-base class I enzyme (PTHR11627).
