family_id: PANTHER:PTHR11627
family_name: FRUCTOSE-BISPHOSPHATE ALDOLASE
preferred_name: Class I (Schiff-base) fructose-bisphosphate aldolases
summary: >-
  Class I fructose-bisphosphate aldolases cleave D-fructose 1,6-bisphosphate to dihydroxyacetone
  phosphate and D-glyceraldehyde 3-phosphate through a Schiff-base intermediate on an active-site
  lysine, with no metal cofactor. The family holds the animal, plant and some bacterial aldolases: the
  vertebrate isozymes A, B and C, invertebrate aldolases (Drosophila Ald1, C. elegans aldo-1 and
  aldo-2), and the Arabidopsis cytosolic (FBA4 to FBA8) and chloroplastic (FBA1 to FBA3) isoforms. The
  same reaction is catalysed by the unrelated metal-dependent class II aldolases of fungi and most
  bacteria (PTHR30559). Vertebrate aldolase B also cleaves fructose 1-phosphate efficiently, the step
  that makes it the aldolase of dietary fructose catabolism in liver, kidney and intestine.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Fructose-bisphosphate aldolase activity holds across the family wherever the Schiff-base lysine
  (K230 in human ALDOA, Lys229 in mature-protein numbering) and the proton-acceptor glutamate (E188) are
  intact, which is true of every checked member except Drosophila Ald2 (Q9VBF5). Ald2 carries Q and S at
  those positions and PAINT already excludes it with an IKR. Two properties are not family-wide. The
  fructose-1-phosphate aldolase activity of physiological significance belongs to the vertebrate
  aldolase B lineage (SF2). Location splits between cytosolic isoforms and the chloroplast-stroma
  isoforms of plants (Arabidopsis FBA1, FBA2, FBA3), which act in the Calvin cycle and plastid
  glycolysis.
