notes: >-
  Modules using the family: emp_glycolysis and gluconeogenesis (aldolase step, with PTHR30559),
  glycolysis_investment_phase (aldolase_activity, ALDOA) and fructolysis (aldob_activity, GO:0061609).
  PTHR11627-catalytic-residue-check.md was produced by a helper script (BLOSUM62 global alignment of
  each member to human ALDOA P04075, sequence version 2, at its UniProt ACT_SITE positions 188 and 230;
  subfamilies from .cache/panther/PTHR19.0_<organism> classification files). UniProt DR PANTHER lines
  for the human, mouse and worm members name only the family, not the subfamily, so the family/gene
  cross-check cannot place them in SF2; ALDOB's GO:0061609 is consistent with the SF2 scope. The
  IKR rows for Ald2 (PTN000179461) are in .cache/panther/IBD.gaf but not in PTHR11627-paint.tsv. The
  gene reviews for ALDOA, ALDOB and aldo-1 still cite the earlier PAINT node PTN000179343 from their GOA
  files; the current PAINT release carries the same terms at PTN004279385. Arabidopsis has a fourth
  chloroplast-type subfamily name (SF16, FRUCTOSE-BISPHOSPHATE ALDOLASE, CHLOROPLASTIC) whose members
  were not checked; the cytosol pruning above names only the verified Arabidopsis isoforms.
