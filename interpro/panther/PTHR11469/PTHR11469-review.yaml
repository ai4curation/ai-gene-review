family_id: PANTHER:PTHR11469
family_name: GLUCOSE-6-PHOSPHATE ISOMERASE
preferred_name: Phosphoglucose isomerase (PGI/GPI) family
summary: >-
  The conventional (SIS-domain) glucose-6-phosphate isomerases of bacteria and eukaryotes, which
  reversibly interconvert D-glucose 6-phosphate and D-fructose 6-phosphate: the second step of
  glycolysis and, run in reverse, a step of gluconeogenesis. Characterized members include
  E. coli Pgi, S. cerevisiae PGI1, S. pombe pgi1, human GPI and the cytosolic and plastid
  isozymes of plants. Vertebrate GPI is also secreted and acts extracellularly as neuroleukin /
  autocrine motility factor, a lineage-specific moonlighting role.
functional_coherence: COHERENT
coherence_reason: >-
  Every reviewed member (623 in the entries file) is in SF1, and the four subfamilies all carry
  the name GLUCOSE-6-PHOSPHATE ISOMERASE. Isomerase activity is shared by all characterized
  members across bacteria, fungi, plants and animals. What varies is compartment (plant plastid
  versus cytosolic isozymes) and the vertebrate extracellular cytokine role, neither of which is a
  family-level property.
