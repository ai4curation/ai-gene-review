  scope_reason: >-
    The isomerization is a glycolytic step wherever the EMP route runs, and the human, S. cerevisiae
    and S. pombe reviews accept the IBA. Two kinds of member inherit it without clearly doing
    glycolysis. Bacteria that catabolize glucose by the Entner-Doudoroff route use PGI mainly in
    the gluconeogenic direction: the P. putida KT2440 pgi1 review marks glycolysis
    over-annotated, while its pgi2 review accepts it. Plant plastid isozymes mainly supply
    glucose 6-phosphate for starch synthesis (not examined here). Whether the term means capacity
    or physiological pathway membership decides the scope, so it is left unresolved rather than
    family-wide.
