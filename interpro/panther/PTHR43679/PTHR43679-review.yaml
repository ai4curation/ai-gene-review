  - &id002
    reference_id: file:genes/BACSU/lipM/lipM-uniprot.txt
    supporting_text: Catalyzes the transfer of endogenously produced octanoic acid from octanoyl-acyl-carrier-protein
      onto the lipoyl domain of GcvH, an intermediate carrier during protein lipoylation.
  - &id001
    reference_id: file:genes/BACSU/lipL/lipL-uniprot.txt
    supporting_text: Catalyzes the amidotransfer (transamidation) of the octanoyl moiety from octanoyl-GcvH
      to the lipoyl domain of the E2 subunit of lipoate-dependent enzymes.
