family_id: PANTHER:PTHR43679
family_name: OCTANOYLTRANSFERASE LIPM-RELATED
preferred_name: Firmicute LipM octanoyltransferases and LipL amidotransferases
summary: 'A lipoate-protein-ligase-fold family that contains two sequential enzymes of the firmicute GcvH-relay
  lipoylation route: LipM, which transfers octanoyl from octanoyl-ACP to GcvH, and LipL, which relays
  the acyl group from GcvH to client E2 lipoyl domains. Both act through an active-site cysteine thioester.
  The family also contains split archaeal lipoate-protein ligase subunits (Thermoplasma LplA subunits)
  and an uncharacterized Cupriavidus protein.'
functional_coherence: HETEROGENEOUS
coherence_reason: 'LipM and LipL are in the same subfamily (SF2) yet catalyse different reactions: octanoyl-ACP:GcvH
  transfer (RHEA:17665) versus octanoyl-GcvH:E2 amidotransfer (RHEA:20213). LipL has no detectable octanoyl-ACP
  transferase activity. Archaeal ligase subunits add a third activity.'
