  description: Contains both LipM and LipL orthologs across firmicutes (paired in each genome), Listeria
    LipL, and Thermoplasma split ligase subunits. Membership does not distinguish the two relay steps;
    the InterPro LipM (IPR024898) and LipL (IPR024897) families do.
  representative_members:
