notes: >-
  The glycolate/glyoxylate assimilation module grounds its GlcF role on SF17 (E. coli and P. putida
  GlcF). The PAINT glycolate terms sit on the bacterial GlcF clade PTN000795892 and are sound;
  they reach neither the archaeal SF17 branch (TfrB-like), SF20 nor GlpC (SF19). The root plasma
  membrane IBD is fine for the bacterial membrane-associated subunits but also reaches cytoplasmic
  archaeal members. P. putida GlcF receives no IBA rows because KT2440 is not a PANTHER tree
  genome. Tree topology was read from the PANTHER 19 treeinfo service. The InterPro LLM
  description of this family is unreviewed and was not used as evidence.
