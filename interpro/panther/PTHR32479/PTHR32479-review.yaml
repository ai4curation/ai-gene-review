- subfamily_id: PANTHER:PTHR32479:SF19
  label: ANAEROBIC GLYCEROL-3-PHOSPHATE DEHYDROGENASE SUBUNIT C
  clade_node_id: PANTHER:PTN004949415
  description: >-
    GlpC, the electron-transfer and membrane-anchor subunit of the anaerobic sn-glycerol-3-phosphate
    dehydrogenase GlpABC of enterobacteria and Haemophilus, plus archaeal GlpC homologues. The
