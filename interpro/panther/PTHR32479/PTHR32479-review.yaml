family_id: PANTHER:PTHR32479
family_name: GLYCOLATE OXIDASE IRON-SULFUR SUBUNIT
preferred_name: CCG-domain iron-sulfur electron-transfer subunits (glycolate oxidase GlcF, anaerobic glycerol-3-phosphate dehydrogenase GlpC, archaeal thiol:fumarate reductase TfrB-like)
summary: >-
  A prokaryotic family (bacteria and archaea, with one horizontally transferred chytrid leaf and
  one cnidarian fragment in the PANTHER tree) of iron-sulfur proteins that combine a bacterial
  ferredoxin-type Fe-S domain with two cysteine-rich CCG domains. Members are not enzymes on
  their own but electron-transfer subunits of multisubunit oxidoreductases, often associated with
  the membrane. SF17 contains GlcF, the iron-sulfur subunit of the bacterial GlcDEF glycolate
  oxidase/dehydrogenase (E. coli, Pseudomonas, Bacillus GlcF), together with an archaeal branch
  that includes the B subunit of the methanogen thiol:fumarate reductase (TfrB). SF19 contains
  GlpC, the membrane-anchoring electron-transfer subunit of the anaerobic glycerol-3-phosphate
  dehydrogenase GlpABC, and archaeal GlpC homologues. SF20 is a second bacterial group named
  GlcF by PANTHER, with no characterized member.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared function is electron transfer through Fe-S clusters within a larger complex, but the
  partner catalytic subunits, and therefore the overall reaction, differ by subfamily: GlcF works
  with the FAD subunits GlcD and GlcE in glycolate oxidation (SF17, bacteria), TfrB with TfrA in
  CoM-S-H/CoB-S-H-dependent fumarate reduction (archaeal part of SF17), and GlpC with GlpA/GlpB in
  anaerobic glycerol-3-phosphate oxidation (SF19). The PAINT activity and process terms are
  therefore placed on subfamily-level clades, and only the generic electron-transfer and
  localization terms sit at the root.
