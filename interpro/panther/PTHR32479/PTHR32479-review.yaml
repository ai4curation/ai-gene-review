  assessment: NEEDS_PRUNING
  assessment_reason: >-
    PTN004949414 is the family root (a duplication joining the SF17/SF20 and SF19 lineages), so
    the term reaches every member. It is well founded for the bacterial seeds: E. coli GlcF is
    found only in the membrane fraction (the E. coli glcF review accepts the IBA) and GlpC is a
    peripheral inner-membrane protein. But the archaeal branch of SF17 includes the methanogen
    thiol:fumarate reductase subunit TfrB, reported as cytoplasmic, and the SF19 clade also
    holds subunits of the soluble methanogen heterodisulfide reductase. Those archaeal branches
    lie inside subfamilies whose bacterial members are membrane-associated, so pruning has to be
    done at the clade level (for example at the archaeal SF17 node PTN001287035), not by
    subfamily.
