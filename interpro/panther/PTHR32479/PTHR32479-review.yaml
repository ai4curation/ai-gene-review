- subfamily_id: PANTHER:PTHR32479:SF20
  label: GLYCOLATE OXIDASE IRON-SULFUR SUBUNIT
  clade_node_id: PANTHER:PTN008647388
  description: >-
    A second bacterial group named GlcF by PANTHER (Aquifex, Thermodesulfovibrio, Helicobacter,
    Geobacter GlcF-1), nested beside the bacterial GlcF clade inside the SF17 root. No member is
    characterized. Some are encoded next to GlcD-like FAD subunits of SF2 or SF3 of PTHR42934
    (Thermodesulfovibrio THEYE_A0667/THEYE_A0668), so their partner FAD enzyme, and therefore
    their substrate, may be a D-lactate rather than a glycolate dehydrogenase. Not used by any
    module and outside the PAINT glycolate node.
