review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Written alongside the human PEX13 gene review (genes/human/PEX13/PEX13-ai-review.yaml).
  All node ids, seed lists, taxa and snapshot dates are verbatim from the cached
  PTHR19332-paint.tsv; the member composition and the single represented subfamily come from
  the fetched PTHR19332-entries.csv, and family and subfamily names from panther.obo.

  The premise this family was pulled in under needs correcting. PEX13 appears on the
  project's human "no-IBA" list, but it is not an IBA-free gene: it receives all three of the
  IBDs placed at PTN001063987 (GO:0005778, GO:1990429, GO:0016560), two of them refreshed in
  2026. The list is stale. The real gap, and the one worth acting on, is narrower and
  invisible to a simple has-IBA test: PTHR19332 has no molecular-function IBD at any node, so
  human PEX13's only MF annotations are the three uninformative protein-binding IPIs and one
  IDA. A PAINT curator revisiting this family should consider (i) adding GO:0016558 and
  GO:0016561 at PTN001063987, both of which follow from work published after the 2017
  docking assertion, and (ii) deciding whether the DTM-level transporter activity can be
  asserted phylogenetically at all, given that it is a property of an assembly rather than of
  one subunit.

  No residue_sites. The domain-architecture question that matters here - which members retain
  the C-terminal SH3 domain - is a presence/absence question about a whole domain across a
  multiple sequence alignment, not a claim about specific catalytic or binding positions, and
  the UniProt SH3 feature on Q92968 (272..336) is a PROSITE-ProRule match rather than a
  functionally characterised residue set. Recording it as a ResidueSite would dress an
  unresolved alignment question up as a checkable one.
