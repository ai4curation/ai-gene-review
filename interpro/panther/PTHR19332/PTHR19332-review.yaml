family_id: PANTHER:PTHR19332
family_name: PEROXISOMAL MEMBRANE PROTEIN PEX13
preferred_name: Peroxin-13 (Pex13) docking-complex peroxin family
summary: >-
  Single-orthologue-group family of Pex13/peroxin-13, the polytopic peroxisomal membrane
  protein that forms, with Pex14, the docking half of the peroxisomal matrix-protein
  docking/translocation module (DTM, the "importomer"). Members are present across
  eukaryotes wherever peroxisomes are - the fetched slice spans yeasts, Dictyostelium,
  Arabidopsis, nematode, and vertebrates - and the reviewed set falls entirely in one
  subfamily. The conserved core is the same in all of them: Pex13 sits in the peroxisomal
  membrane, is part of the importomer, and is required for the docking step at which the
  cargo-loaded PTS1 receptor Pex5 engages the membrane. Loss of Pex13 abolishes import of
  both PTS1 and PTS2 matrix cargo while leaving membrane-protein insertion untouched, which
  is what identifies the defect as receptor engagement rather than membrane assembly.
  What is not uniform across the family is the domain architecture used to achieve that
  engagement: a C-terminal SH3 domain that reads the diaromatic WxxxF/Y motifs of Pex5 is
  described as an opisthokont feature, while the N-terminal YG-rich intrinsically disordered
  region - now proposed to be the actual translocation conduit, a nucleoporin-FG-like
  selective phase that Pex5-cargo partitions into - is the more broadly shared element.
  Family-level compartment and process terms are therefore safe; motif-level molecular
  function terms are not obviously safe outside the opisthokonts.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every sampled member is a Pex13 orthologue with the same cellular role, so the
  compartment (peroxisomal membrane, importomer complex) and process (matrix protein
  docking) assertions hold family-wide. The exception is mechanistic rather than
  functional: the C-terminal SH3 domain through which human and yeast Pex13 read Pex5's
  WxxxF/Y motifs is reported as an opisthokont feature, so any molecular-function term
  phrased in terms of that SH3-mediated adaptor activity should not be assumed for the
  plant, amoebozoan and other non-opisthokont members. This boundary is a clade inside
  PTHR19332:SF1, not a subfamily boundary, so it cannot be expressed by naming a subfamily.
