node_assessments:
  - node_id: PANTHER:PTN001063987
    asserted_term:
      id: GO:0005778
      label: peroxisomal membrane
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260529"
    seeds:
      - id: AGI_LocusCode:AT3G07560
      - id: MGI:MGI:1919379
      - id: RGD:1310682
      - id: SGD:S000004181
      - id: UniProtKB:Q7SG02
      - id: UniProtKB:Q92968
        label: Peroxisomal membrane protein PEX13
        gene_symbol: PEX13
        organism: Homo sapiens
        gene_review: genes/human/PEX13/PEX13-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      Peroxisomal membrane residence is the defining property of every member of this family
      and the seeds span the eukaryotic root the node is placed at - plant (AT3G07560),
      fungal (SGD S000004181, and Q7SG02), and three vertebrates. Placement at Eukaryota is
      appropriate because peroxisomes and the docking complex are ancestral to the clade, not
      a late innovation, and there is no member lineage with evidence of relocation. Human
      PEX13 receives this IBA and it is fully consistent with its own IDA record
      (PMID:8858165, PMID:28765278, PMID:11402059 and others). Note that Q92968 appearing
      among its own seeds is expected and correct - the human experimental annotation is one
      of the descendant evidences the PAINT curator used to place the IBD - and is not
      circular.
  - node_id: PANTHER:PTN001063987
    asserted_term:
      id: GO:1990429
      label: peroxisomal importomer complex
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20260529"
    seeds:
      - id: SGD:S000004181
      - id: UniProtKB:Q7SG02
      - id: UniProtKB:Q92968
        label: Peroxisomal membrane protein PEX13
        gene_symbol: PEX13
        organism: Homo sapiens
        gene_review: genes/human/PEX13/PEX13-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      A three-seed IBD, but donor count is not the measure here: the claim is that importomer
      membership arose at or before the eukaryotic ancestor, and the seeds bracket the
      relevant span (budding yeast and human) for a complex whose composition - Pex13, Pex14
      and the RING peroxins - is conserved between them. Human PEX13 is independently
      demonstrated in that assembly by DTM cell-free import assays (PMID:28765278) and by
      mass spectrometry of native PEX14 complexes (PMID:21525035). No member lineage is known
      to have lost the complex while retaining Pex13.
  - node_id: PANTHER:PTN001063987
    asserted_term:
      id: GO:0016560
      label: protein import into peroxisome matrix, docking
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: "20170413"
    seeds:
      - id: MGI:MGI:1919379
      - id: SGD:S000004181
      - id: UniProtKB:Q92968
        label: Peroxisomal membrane protein PEX13
        gene_symbol: PEX13
        organism: Homo sapiens
        gene_review: genes/human/PEX13/PEX13-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      The docking step is the function Pex13 was originally defined by, in yeast and human
      simultaneously, and the loss-of-function phenotype is the same on both sides: matrix
      cargo import fails while membrane protein insertion is unaffected. Placement at the
      eukaryotic node is therefore right. The one caveat is the snapshot date - 2017, nine
      years older than the two CC rows on the same node - so this assertion predates the
      selective-phase/conduit work (2022-2023) that would now motivate adding translocation
      and molecular-function terms at the same node. The placement is sound; it is the
      coverage that is stale.

term_assessments:
  - assessed_term:
      id: GO:0016558
      label: protein import into peroxisome matrix
    scope: FAMILY_WIDE
    scope_reason: >-
      The parent of the docking term already asserted at PTN001063987. Safe family-wide on
      the same grounds and arguably the better level for the family, because the
      loss-of-function phenotype in both yeast and mammals is failure of matrix import per
      se - both PTS1 and PTS2 cargo - rather than failure of an isolable docking sub-step.
      Recommended for PAINT as an addition alongside, or in place of, GO:0016560.
    supported_by:
      - reference_id: PMID:8858165
        supporting_text: loss of Pex13p eliminates import of peroxisomal matrix proteins that
          contain either the type-1 or type-2 peroxisomal targeting signal but does not affect
          targeting and insertion of integral peroxisomal membrane proteins
  - assessed_term:
      id: GO:0016561
      label: protein import into peroxisome matrix, translocation
    scope: FAMILY_WIDE
    scope_reason: >-
      Not currently asserted by PAINT anywhere in this family, but it should be. Pex13 is no
      longer understood as a docking-only factor: its YG-rich IDR forms the selective phase
      through which cargo crosses, shown in Saccharomyces (PMID:37165185), and the DTM cavity
      into which PEX5 enters was shown in mammalian peroxisomes (PMID:28765278). Having
      independent support at both ends of the opisthokont range, and no mechanism specific
      to either, makes this safe at the same node as the docking term.
    supported_by:
      - reference_id: PMID:37165185
        supporting_text: In the budding yeast Saccharomyces cerevisiae, the minimum transport
          machinery includes the membrane proteins Pex13 and Pex14 and the cargo-protein-binding
          transport receptor, Pex5.
  - assessed_term:
      id: GO:0008320
      label: protein transmembrane transporter activity
    scope: UNRESOLVED
    scope_reason: >-
      This family has no molecular-function IBD at any node, and this is the term most worth
      resolving, since it is the one the human gene carries experimentally (IDA,
      PMID:28765278) and the one the conduit model implies. It is left unresolved rather than
      granted because the two experimental anchors (S. cerevisiae Pex13 and human PEX13) are
      both opisthokont, no non-opisthokont member has been assayed for transport activity,
      and the activity is in any case exercised only within the multi-subunit DTM - a PAINT
      grant would need to decide whether that is expressed as an enables or a contributes_to
      claim. The human gene review records it as contributes_to_molecular_function.
  - assessed_term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    scope: UNRESOLVED
    scope_reason: >-
      The molecular function recorded for human PEX13 in its gene review: the SH3 domain
      simultaneously engages PEX5 WxxxF/Y motifs and PEX14, coupling the loaded receptor to
      the translocon. It cannot be granted family-wide because the C-terminal SH3 domain is
      reported as an opisthokont feature, and it cannot be scoped by subfamily because the
      opisthokont/non-opisthokont split falls inside PTHR19332:SF1. Resolving it needs an
      alignment-level determination of which members retain an SH3 domain, which this review
      does not attempt - asserting a scope on the strength of a review statement alone would
      be guessing.
  - assessed_term:
      id: GO:0034614
      label: cellular response to reactive oxygen species
    scope: NOT_APPLICABLE
    scope_reason: >-
      Human PEX13 carries this as an IDA from PMID:26344566, but the cached full text of that
      paper contains no occurrence of PEX13 at all - the ROS-responsive participants
      characterised are ATM, PEX5, the PEX2/PEX10/PEX12 E3 ligase and p62. The human gene
      review marks it as an over-annotation. It must not be used as an IBD seed for this
      family.
  - assessed_term:
      id: GO:0060152
      label: microtubule-based peroxisome localization
    scope: NOT_APPLICABLE
    scope_reason: >-
      Reaches human PEX13 only as an ISS from the mouse knockout, where loss of peroxisome
      alignment along microtubules is secondary to reduced peroxisome abundance. The protein
      that directly anchors microtubules at the peroxisome is PEX14, not PEX13
      (PMID:21525035). Not a Pex13 function and not safe to propagate.
    supported_by:
      - reference_id: PMID:21525035
        supporting_text: human PEX14 is a multi-tasking protein that not only facilitates
          peroxisomal protein import but is also required for peroxisome motility by serving
          as membrane anchor for microtubules

