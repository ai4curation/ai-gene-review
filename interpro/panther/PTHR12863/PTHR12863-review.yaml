family_id: PANTHER:PTHR12863
family_name: FATTY ACID HYDROXYLASE
preferred_name: Fatty acid 2-hydroxylase (SCS7/FA2H/FAH) family
summary: >-
  ER membrane di-iron fatty acid 2-hydroxylases with a cytochrome b5 domain hydroxylate the C2 of
  the ceramide N-acyl chain (fungi, S. cerevisiae SCS7 and S. pombe scs7; plants, FAH1/FAH2) or of
  free fatty acids (animal FA2H), producing 2-hydroxylated sphingolipids.
functional_coherence: COHERENT
coherence_reason: >-
  All members are fatty acid 2-hydroxylases; the substrate form (ceramide-bound or free) differs
  between lineages.
