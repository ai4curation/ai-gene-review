family_id: PANTHER:PTHR36169
family_name: ETHANOLAMINE UTILIZATION PROTEIN EUTQ
preferred_name: EutQ-related cupin proteins with lineage-dependent kinase and assembly roles
summary: Salmonella EutQ is a cupin-family acetate kinase whose N-terminal region also bridges ethanolamine-compartment
  cargo and shell proteins. Its reversible kinase chemistry supplies ATP from acetyl-phosphate during
  ethanolamine metabolism. The broader family includes shorter bacterial architectures and fungal proteins;
  the demonstrated Salmonella assembly mechanism is not a universal property of the family.
functional_coherence: HETEROGENEOUS
coherence_reason: The single official SF1 contains all 16 tree leaves, including 11 fungal proteins and
  five bacterial members. The bacterial PAINT subtree is narrower than SF1, and Gram-positive EutQ lacks
  N-terminal helices implicated in LT2 assembly.
reference_protein:
  id: UniProtKB:Q9ZFV5
  gene_symbol: eutQ
  organism: Salmonella typhimurium LT2
  gene_review: genes/SALTY/eutQ/eutQ-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR36169:SF1
  label: ACETATE KINASE EUTQ
  description: A single subfamily spanning bacterial EutQ and fungal homologues. LT2 Q9ZFV5 is directly
    assayed, whereas the short Clostridioides member illustrates architecture variation. The name alone
    does not establish kinase kinetics or the LT2 scaffold mechanism for every member.
  representative_members:
