    label: generation of precursor metabolites and energy
  evidence: IBD
  paint_snapshot: '20241031'
  seeds:
  - id: UniProtKB:Q9ZFV5
  assessment: UNRESOLVED
  assessment_reason: The node correctly excludes fungi and contains bacterial eut-associated homologues.
    LT2 reversible acetate kinase provides substrate-level phosphorylation, but that enzymatic role has
    not been established across all five descendants or distinguished from assembly-only contributions
    in shorter architectures. This is unresolved functional scope, not evidence for a specific loss or
    a pruning instruction.
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
term_assessments:
- assessed_term:
    id: GO:0008776
    label: acetate kinase activity
  scope: UNRESOLVED
  scope_reason: Directly demonstrated on LT2 Q9ZFV5, including both reaction directions; neither the family
    nor SF1 isolates the experimentally grounded bacterial group from fungal members. No family-wide or
    whole-SF1 grant is justified solely by the label. Lack of broader assays does not imply a negative
    activity claim.
  supported_by:
  - reference_id: PMID:26448059
    supporting_text: EutQ and EutP also synthesized acetyl-phosphate from ATP and acetate.
- assessed_term:
    id: GO:0140378
    label: protein complex scaffold activity
  scope: UNRESOLVED
  scope_reason: Supported for LT2 Q9ZFV5 by physical shell/cargo interactions, N-terminal perturbations
    and assembly phenotypes. Gram-positive homologues lack the first three implicated helices, and fungi
    occupy the same SF1. The family schema cannot express the experimentally bounded LT2 architectural
    subset as a whole-subfamily grant; no new PTN or conserved residue rule is invented.
  supported_by:
  - &id001
    reference_id: PMID:41032589
    supporting_text: EutQ is essential for cargo encapsulation and Eut BMC formation through specific
      association with the shell and cargo enzymes.
  - reference_id: PMID:41032589
    supporting_text: the EutQ proteins of Gram-positive species like Enterococcus faecalis and Listeria
      monocytogenes lack the first three α helices
- assessed_term:
    id: GO:0031471
    label: ethanolamine degradation polyhedral organelle
  scope: UNRESOLVED
  scope_reason: The observed bacterial PAINT subtree supports this location, but the only subfamily also
    includes fungi. Preserve the SOUND bacterial node judgment without granting the location family-wide
    or across all SF1.
  supported_by:
  - *id001
