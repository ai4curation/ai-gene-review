family_id: PANTHER:PTHR43137
family_name: DIHYDROOROTASE
preferred_name: Type II (homodimeric, enterobacterial-type) monofunctional dihydroorotase family
summary: >-
  Monofunctional zinc-dependent dihydroorotases of the amidohydrolase (TIM-barrel) superfamily.
  They catalyse the reversible cyclisation of N-carbamoyl-L-aspartate to (S)-dihydroorotate,
  the third step of de novo UMP synthesis. Members are about 340 to 400 residues and form
  homodimers. E. coli PyrC, the structural paradigm, has a binuclear zinc centre bridged by a
  carboxylated lysine in each subunit. The family covers the type II enzymes of
  Gram-negative bacteria (E. coli, Salmonella, Pseudomonas, Shewanella and others),
  cyanobacteria, fungi and plants. In budding and fission yeast this is the only dihydroorotase
  of the cell (S. cerevisiae URA4, S. pombe ura2), because the DHOase-like domain of the fungal
  CPSase-ATCase protein is inactive. The plant member (Arabidopsis PYR4) acts in the cytosol.
  The fused DHOase domain of animal CAD and the type I enzymes belong to other PANTHER families.
  PANTHER defines one subfamily (SF1), which holds all 197 reviewed members.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed members are named and classified as dihydroorotase (194 "Dihydroorotase", two
  plant "Dihydroorotase, mitochondrial" entries and S. pombe "Probable dihydroorotase"). The
  members characterized by experiment (E. coli PyrC, P. putida PyrC, S. cerevisiae URA4)
  share the activity, and S. cerevisiae and S. pombe depend on these enzymes for uracil
  prototrophy. No reviewed member is annotated with a different activity. The plant entry
  names say "mitochondrial", but the Arabidopsis enzyme was shown in the cytosol, so the
  location differs only in name. Serratia marcescens Q9S3S1 (204 residues) is a fragment.
