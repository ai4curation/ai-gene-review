  cerevisiae URA4 (P20051) and S. pombe ura2 (Q9UTI0) as dihydroorotase representatives under
  an InterPro family selector, alongside human CAD (whose DHOase domain is outside this PANTHER
  family). The family is consistent with PAINT. The URA4, ura2 and pyrC
  gene reviews are COMPLETE. Inputs (metadata, entries) were already present; paint.tsv was fetched
  for this review on 2026-11-13. QuickGO IBA recipients were checked on 2026-11-13: the root
  node also propagates cytoplasm (GO:0005737), which is not in the paint slice. Q88NW7 had no
  IBA rows in QuickGO at that date.
