term_assessments:
- assessed_term:
    id: GO:0004764
    label: shikimate 3-dehydrogenase (NADP+) activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Safe as a catalytic capacity for the characterized classes (AroE, YdiB, plant DHQ-SDH,
    quinate dehydrogenases as PAINT seeds, HI0607 at low rate). It does not identify which
    paralog does the biosynthetic step in a given organism. The shikimate module asserts it with
    the family-level selector PANTHER:PTHR21089, which therefore also captures YdiB-type
    quinate/shikimate dehydrogenases, SDH-L proteins and RifI2. The module already excludes RifI2
    (PP_2608) in prose, and lists PP_3768, an SF9 (SDH-L class) member, as a representative,
    which this review does not support as a biosynthetic AroE.
  member_exceptions:
  - member:
      id: UniProtKB:Q88JP1
      label: RifI2
      gene_symbol: PP_2608
      organism: Pseudomonas putida KT2440
      gene_review: genes/PSEPK/PP_2608/PP_2608-ai-review.yaml
    exception_reason: >-
      RifI2 has much lower activity on shikimate than AroE and strongly prefers NAD+ over NADP+;
      its gene review replaces the NADP+ term with shikimate 3-dehydrogenase (NAD+) activity.
    supported_by:
    - reference_id: PMID:23142411
      supporting_text: RifI2 exhibits much lower activity using shikimate as a substrate than AroE,
        and a strong preference for NAD(+) instead of NADP(+) as a cofactor.
  supported_by:
  - reference_id: PMID:12837789
    supporting_text: Shikimate dehydrogenase catalyzes the NADPH-dependent reversible reduction of
      3-dehydroshikimate to shikimate.
  - reference_id: PMID:25524738
    supporting_text: The different members of the SDH family share a highly similar three-dimensional
      structure and utilize a conserved catalytic mechanism, but exhibit distinct substrate preferences
- assessed_term:
    id: GO:0009423
    label: chorismate biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    True for AroE and the plant DHQ-SDH, not for YdiB or the fungal quinate dehydrogenases,
    unknown for SDH-L and RifI. Because SF1 contains biosynthetic and catabolic members together,
    no subfamily scope is safe; assignment has to be per gene or per PTN node (see the
    PTN000472519 assessment). The P. putida gene reviews for PP_2406 (Q88K85), PP_3002 (Q88IJ7)
    and PP_3768 (Q88GF6) take this process as core, although the module treats PP_2406 and
    PP_3002 as candidates with a catabolic gene arrangement and PP_3768 as inferred.
  supported_by:
  - reference_id: PMID:23142411
    supporting_text: The two most widespread members of the family, AroE and YdiB, function in amino
      acid biosynthesis and quinate catabolism, respectively.
- assessed_term:
    id: GO:0019632
    label: shikimate metabolic process
  scope: FAMILY_WIDE
  scope_reason: >-
    General enough to cover biosynthetic and catabolic members, all of which act on shikimate or
    the closely related quinate. RifI2 is excepted: it acts on shikimate only weakly, and its
    proposed role is in antibiotic biosynthesis rather than shikimate metabolism.
  member_exceptions:
  - member:
      id: UniProtKB:Q88JP1
      label: RifI2
      gene_symbol: PP_2608
      organism: Pseudomonas putida KT2440
      gene_review: genes/PSEPK/PP_2608/PP_2608-ai-review.yaml
    exception_reason: >-
      RifI-class protein with much lower shikimate activity than AroE and only trace quinate
      activity; no physiological role in shikimate metabolism is established, and its gene review
      marks the process as over-annotated.
    supported_by:
    - reference_id: PMID:23142411
      supporting_text: Here, we have determined the crystal structure of an SDH homolog belonging to
        the RifI class, a group of enzymes with proposed roles in antibiotic biosynthesis.
  supported_by:
  - reference_id: PMID:12637497
    supporting_text: Here we characterize YdiB as a dual specificity quinate/shikimate dehydrogenase
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: UNRESOLVED
  scope_reason: >-
    Safe for the bacterial members (the AroE clade and HI0607) but not for SF1 as a whole, which
    also holds the chloroplastic plant DHQ-SDH; no subfamily separates the two. PAINT correctly
    confines the term to the bacterial node PTN001464795, which is the selector to use.
  supported_by:
