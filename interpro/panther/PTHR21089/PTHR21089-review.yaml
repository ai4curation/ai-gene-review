notes: >-
  Used by modules/bacterial_shikimate_chorismate_biosynthesis.yaml (discrete-enzyme architecture,
  aroe_shikimate_dehydrogenase) with the family-level selector PANTHER:PTHR21089 and GO:0004764.
  Topology from the PANTHER 19 treeinfo service filtered to model organisms: root PTN000472519
  (LUCA) splits into a horizontal-transfer node PTN008574447 (E. coli YdiB plus a Eukaryota node
  PTN000472521 holding the Pezizomycotina QutB/qa-3 node PTN002326158 and Arabidopsis DHQ-SDH)
  and the duplication node PTN001464795 (HI0607 and the Eubacteria AroE node PTN000472536). The
  P. putida paralogs are not in the PAINT UniProt GAF. Two gene-review folders exist for the same
  accession Q88IJ7 (genes/PSEPK/aroE/ and genes/PSEPK/aroE__Q88IJ7/); this review cites the
  accession-suffixed one, which matches the convention used for the other two aroE paralogs.
