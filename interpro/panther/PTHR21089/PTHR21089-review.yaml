family_id: PANTHER:PTHR21089
family_name: SHIKIMATE DEHYDROGENASE
preferred_name: Shikimate dehydrogenase family (AroE, YdiB/quinate dehydrogenases, SDH-like, RifI, plant DHQ-SDH)
summary: >-
  NAD(P)-dependent oxidoreductases built from a substrate-binding domain and a Rossmann-fold
  dinucleotide-binding domain, sharing one catalytic mechanism but differing in substrate and
  cofactor preference. The archetype is AroE, the NADPH-dependent shikimate dehydrogenase that
  reduces 3-dehydroshikimate to shikimate in the shikimate pathway. The family also contains YdiB
  (a dual quinate/shikimate dehydrogenase using NAD or NADP), the fungal quinate dehydrogenases of
  the quinic acid utilization pathway (A. nidulans QutB, N. crassa qa-3), the shikimate
  dehydrogenase-like (SDH-L) class typified by Haemophilus HI0607 with very low shikimate
  turnover, the RifI class (P. putida RifI2, NAD-preferring), and the C-terminal shikimate
  dehydrogenase domain of the plant bifunctional dehydroquinase-shikimate dehydrogenase (DHQ-SDH).
  The fungal AROM shikimate dehydrogenase domain is classified in PTHR21090.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family has at least five functional classes with the same fold and mechanism but distinct
  substrates and pathway roles: biosynthetic AroE and plant DHQ-SDH (chorismate synthesis);
  YdiB and the fungal quinate dehydrogenases (quinate/shikimate catabolism); SDH-L (HI0607,
  activity about 1000-fold below AroE, role unknown); and RifI (NAD-preferring, proposed roles in
  antibiotic biosynthesis). PANTHER separates almost none of this: SF1 holds AroE, YdiB, QutB,
  qa-3, the plant DHQ-SDH and RifI2 together, and only HI0607 (SF9) has its own subfamily. Pathway
  terms therefore cannot be scoped by subfamily.
