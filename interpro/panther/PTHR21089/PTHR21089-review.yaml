  assessment: SOUND
  assessment_reason: >-
    Family root (LUCA in the PANTHER 19 tree), seeded from every characterized class except RifI.
    As a catalytic capacity, NADP-linked shikimate oxidoreduction is shared by AroE, YdiB (which
    uses NAD or NADP), the plant DHQ-SDH and, at low rate, HI0607. The exceptions are
    member-level (RifI2, strongly NAD-preferring) and are recorded under the term assessment
    rather than as a node fault. Capacity is not pathway role; see the chorismate node below.
  supported_by:
  - reference_id: PMID:12637497
    supporting_text: Here we characterize YdiB as a dual specificity quinate/shikimate dehydrogenase
      that utilizes either NAD or NADP as a cofactor.
  - reference_id: PMID:15735308
    supporting_text: HI0607 catalyzes the oxidation of shikimate but not quinate
- node_id: PANTHER:PTN000472519
  asserted_term:
    id: GO:0009423
    label: chorismate biosynthetic process
  paint_snapshot: '20211111'
  seeds:
  - id: UniProtKB:O67049
    label: aroE
    organism: Aquifex aeolicus VF5
  - id: UniProtKB:P15770
    label: aroE
    organism: Escherichia coli K-12
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Both seeds are biosynthetic AroE enzymes, but the node is the family root, so the process
    reaches every class. In the PAINT UniProt GAF it is received by E. coli YdiB (P0A6D5), A.
    nidulans QutB (P25415) and H. influenzae HI0607 (P44774). YdiB functions in quinate
    catabolism, QutB is the quinate dehydrogenase of the quinic acid utilization cluster in a
    fungus whose shikimate pathway runs through AROM, and HI0607 has about 1000-fold lower activity
    than AroE in an organism that has its own AroE. The plant DHQ-SDH, which also inherits the
    term, is genuinely biosynthetic and sits in the same Eukaryota node (PTN000472521) as QutB and
    qa-3, so the term cannot simply be moved to the AroE clade (PTN000472536). Recommended fix:
    IRDs on the Pezizomycotina quinate dehydrogenase node (PTN002326158), on the YdiB branch, and
    on the SDH-L branch. Only SF9 is listed as affected, because the other wrongly inheriting
    members share SF1 with the biosynthetic AroE.
    SF9 is no longer listed as a whole: besides YdiB it holds uncharacterized AroE-like
    paralogs such as P. putida PP_3768, whose review keeps the shikimate-pathway row; the
    prune belongs on the YdiB branch.
  supported_by:
  - reference_id: PMID:23142411
    supporting_text: The two most widespread members of the family, AroE and YdiB, function in amino
