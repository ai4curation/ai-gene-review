family_id: PANTHER:PTHR15162
family_name: ASPARTOACYLASE
preferred_name: >-
  AspA/AstE family of zinc N-acyl-L-amino acid amidohydrolases (aspartoacylase, ACY3, succinylglutamate
  desuccinylase)
summary: >-
  Zinc-dependent amidohydrolases of the AspA/AstE fold that remove an N-acyl group from an L-amino acid.
  Three subfamilies carry different substrate specificities: animal aspartoacylase ASPA (SF9), which deacetylates
  N-acetyl-L-aspartate; animal ACY3 (SF5), an N-acyl-aromatic-L-amino acid amidohydrolase; and bacterial
  succinylglutamate desuccinylase AstE (SF7), which hydrolyzes N-succinyl-L-glutamate to glutamate and
  succinate as the last step of the arginine succinyltransferase (AST) pathway. SF7 also contains a cyanobacterial
  group named probable aspartoacylases. The shared chemistry is hydrolysis of a linear amide C-N bond;
  the acyl group and amino acid are set by subfamily.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Only the generic linear-amide hydrolase activity (GO:0016811) is safe family-wide. Aspartoacylase (SF9),
  aromatic N-acyl amino acid amidohydrolase (SF5) and succinylglutamate desuccinylase (SF7) are distinct
  substrate specificities, and the pathways differ (N-acetylaspartate catabolism in animal brain, aromatic
  N-acylamino acid turnover, bacterial arginine catabolism).
