  SDR-family 3-ketodihydrosphingosine reductases (human KDSR, S. cerevisiae TSC10, S. pombe SPCC1450.15,
  Arabidopsis TSC10A) that reduce 3-ketosphinganine to sphinganine on the cytosolic face of the ER,
  the second step of sphingolipid synthesis.
