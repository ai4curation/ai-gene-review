family_id: PANTHER:PTHR43808
family_name: ACETYLORNITHINE DEACETYLASE
preferred_name: M20A metallohydrolases (ArgE, DapE and related deacylases and dipeptidases)
summary: >-
  Dinuclear-metal M20A peptidase-family hydrolases that remove an N-acyl group from an amino acid or
  cleave a dipeptide. SF1 (bacterial) and SF3 (eukaryotic, including Arabidopsis and Dictyostelium) are
  acetylornithine deacetylases (ArgE) of the linear acetylated route to ornithine. SF31 is large and
  mixed: it is dominated by succinyl-diaminopimelate desuccinylases (DapE) of lysine biosynthesis but also
  holds the Xanthomonas N-acetyl-L-citrulline deacetylase, Mn(2+)-dependent dipeptidases and uncharacterized
  YgeY/YtjP proteins. Other subfamilies include LysW-lysine/ornithine hydrolases (SF28), a thiamine-salvage
  deformylase (SF24), RocB (SF27) and uncharacterized archaeal deacylases (SF32).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The fold and metal centre are shared, but the acyl substrate differs between subfamilies (acetylornithine,
  succinyl-diaminopimelate, acetylcitrulline, LysW-bound amino acids, dipeptides), and SF31 itself mixes
  several of these activities.
