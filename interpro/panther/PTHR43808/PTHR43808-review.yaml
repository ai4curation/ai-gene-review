notes: Reviewed for the lysine_biosynthesis module, which grounds the DapE step with NCBIfam TIGR01246
  and the PAINT node PTN000110566 rather than the heterogeneous family or its mixed SF31 subfamily. The
  PAINT row for PTN002465922 (plant acetylornithine deacetylase, seeded by AT4G17830) is outside the lysine
  scope and is not assessed here. PANTHER 19.0 classification files place E. coli DapE P0AED7 in PTHR43270
  (BETA-ALA-HIS DIPEPTIDASE) SF8, whereas its UniProt cross-reference gives PTHR43808 SF31; this review
  follows the UniProt placement, and the disagreement is a reason the module grounds DapE by NCBIfam.
