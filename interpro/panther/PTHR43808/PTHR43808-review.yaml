family_id: PANTHER:PTHR43808
family_name: ACETYLORNITHINE DEACETYLASE
preferred_name: M20A ArgE/DapE-family metallo-deacylase family
summary: 'Family of dinuclear zinc/cobalt M20A metallohydrolases with a catalytic domain and an inserted
  dimerisation domain that remove N-acyl groups from amino-acid pathway intermediates. The two best-characterised
  activities belong to different pathways: succinyl-diaminopimelate desuccinylases (DapE, EC 3.5.1.18)
  of the succinylase branch of lysine biosynthesis and acetylornithine deacetylases (ArgE, EC 3.5.1.16)
  of arginine biosynthesis. Further members act on N-acetylcitrulline, LysW-conjugated lysine/ornithine
  and other acylated substrates. Subfamily SF31 is mostly DapE (380 of 408 reviewed entries are named
  succinyl-diaminopimelate desuccinylase) despite its N-acetyl-L-citrulline deacetylase name, and also
  contains the Xanthomonas N-acetylcitrulline deacetylase.'
functional_coherence: HETEROGENEOUS
coherence_reason: Members share M20A chemistry and metal dependence, but substrate (N-succinyl-LL-DAP,
  N-acetylornithine, N-acetylcitrulline, LysW conjugates) and pathway differ between clades; even SF31
  mixes DapE with an N-acetylcitrulline deacetylase. Activity terms therefore need clade-level or target
  evidence.
