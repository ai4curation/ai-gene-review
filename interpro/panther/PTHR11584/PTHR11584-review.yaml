  assessment_reason: >-
    PTN007515471 is the fungal Ste11/Byr2 clade (6 leaves, SF369). Budding yeast Ste11 is the MAPKKK of
    the Sho1 branch of the osmotic-stress HOG pathway, activating the MAPKK Pbs2 and the p38-family MAPK
    Hog1 (PMID:9180081), which is why SGD annotates Ste11 to p38MAPK cascade by IMP and IGI. The node's
    own IBD for pheromone response MAPK cascade covers the other Ste11 role; the HOG role is retained
    at least in the Saccharomyces lineage.
