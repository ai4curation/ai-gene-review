family_id: PANTHER:PTHR11584
family_name: SERINE/THREONINE PROTEIN KINASE
preferred_name: STE11-like MAP kinase kinase kinases (MEKK family)
summary: >-
  PTHR11584 contains MAP kinase kinase kinases of the MEKK/STE11 group. The fungal clade assessed here
  holds budding yeast Ste11 and fission yeast Byr2, which activate MAP kinase cascades for pheromone response
  and, in budding yeast, the Sho1 branch of the osmotic-stress HOG pathway.
functional_coherence: MOSTLY_COHERENT
coherence_reason: All are MAPKKKs; they feed different MAPK cascades.
