    label: dephosphorylation
  scope: UNRESOLVED
  scope_reason: Bovine auxilin has a PTEN-like fold but a P-loop geometry incompatible with phosphatase
    catalysis, providing a direct noncatalytic-domain counterexample. The zebrafish protein has the corresponding
    phosphatase/C2/J-domain architecture. This rejects a catalytic inference from the fold, while the
    broader biological process dephosphorylation could still involve an unestablished partner-mediated
    role; family-wide process membership is unresolved.
