family_id: PANTHER:PTHR23172
family_name: AUXILIN/CYCLIN G-ASSOCIATED KINASE-RELATED
preferred_name: Auxilin and GAK-related J-domain proteins
summary: Auxilin-related proteins couple recognition of membrane-associated assemblies to Hsp70 chaperone
  recruitment. GAK adds a kinase domain, while auxilin contains a phosphatase-like region with a noncatalytic
  binding role.
functional_coherence: HETEROGENEOUS
coherence_reason: The zebrafish sequence has tensin-like phosphatase/C2 regions and a terminal J domain.
  The experimentally characterized auxilin P-loop geometry explains lack of phosphatase activity, so a
  phosphatase-like domain does not license intrinsic dephosphorylation. Participation in a dephosphorylation
  process remains distinct from catalysis and requires partner evidence.
