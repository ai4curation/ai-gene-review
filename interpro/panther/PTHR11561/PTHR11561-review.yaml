family_id: PANTHER:PTHR11561
family_name: PHOSPHOENOLPYRUVATE CARBOXYKINASE
preferred_name: GTP-dependent phosphoenolpyruvate carboxykinases
summary: >-
  PTHR11561 contains the GTP-dependent phosphoenolpyruvate carboxykinases that interconvert
  oxaloacetate and phosphoenolpyruvate with GTP/GDP and a Mn2+ cofactor. Vertebrates carry two
  paralogs: the cytosolic PCK1/PEPCK-C branch and the mitochondrial PCK2/PEPCK-M branch. The
  catalytic reaction is conserved, but PAINT locations and hormone-response processes must be
  separated by branch.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The GTP-dependent PEPCK activity and Mn2+ requirement are family-wide. Vertebrate PCK1 and PCK2
  differ mainly by compartment and regulation: PCK1 is cytosolic and hormonally regulated, whereas
  PCK2 is mitochondrial and has a distinct matrix branch.
