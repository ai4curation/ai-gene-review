family_id: PANTHER:PTHR46115
family_name: THIOREDOXIN-LIKE PROTEIN 1
preferred_name: Cytosolic thioredoxin family
summary: >-
  Small cytosolic thioredoxins with a WCGPC active site (S. cerevisiae TRX1 and TRX2, S. pombe trx1,
  human TXN, mouse Txn1) that reduce protein disulfides, using electrons from NADPH via thioredoxin
  reductase.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed members are canonical cytosolic thioredoxins; PANTHER assigns them no subfamily.
