  name:
    name: Nucleoside diphosphate kinase
    short: NDK
  description:
  - text: The Nucleoside diphosphate kinase (NDK) family plays a pivotal role in cellular
      nucleotide homeostasis by catalyzing the transfer of gamma-phosphate between
      di- and triphosphonucleosides, a process crucial for the synthesis of nucleoside
      triphosphates other than ATP. NDKs are involved in various cellular functions
      including cell proliferation, differentiation, development, signal transduction,
      G protein-coupled receptor endocytosis, and gene expression. Some members possess
      additional activities such as serine/threonine-specific protein kinase, geranyl
      and farnesyl pyrophosphate kinase, histidine protein kinase, and 3'-5' exonuclease
      activities. They are implicated in neural development, including neural patterning
      and cell fate determination, and may also participate in DNA repair processes.
      NDKs are known to interact with other proteins and lipids, influencing their
      activities, such as autophosphorylation leading to increased kinase activity
      or binding to cardiolipin affecting phosphotransfer activity.
