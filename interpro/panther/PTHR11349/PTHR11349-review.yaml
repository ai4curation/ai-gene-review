  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The eukaryotic NDK node (taxon Eukaryota) gives mitochondrion to every eukaryotic member,
    including human NME1 and NME2. The placement is defensible for an ancestral NDK partitioned
    between cytosol and the mitochondrial intermembrane space (yeast Ynk1) and is matched by
    dedicated organellar paralogs (NME4, Dictyostelium ndkM, Arabidopsis NDPK3). The vertebrate
    cytosolic NDPK-A/NDPK-B branch (SF69, SF57) does not retain it: NM23-H4 is the
    mitochondria-specific NDPK, silencing NM23-H1/H2 does not affect mitochondria, and the
    curated human NME1 location is cytoplasm and nucleus. An IRD on the NME1/NME2 clade would
    stop the term descending there. The existing IRD at PTN002260148 is unrelated (Gloeobacter).
    The human NME1 review marks its inherited IBA as over-annotated.
  supported_by:
