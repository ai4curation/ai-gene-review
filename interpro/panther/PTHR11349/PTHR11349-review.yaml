family_id: PANTHER:PTHR11349
family_name: NUCLEOSIDE DIPHOSPHATE KINASE
preferred_name: Classical (group I) nucleoside diphosphate kinases (NDK/NME/Awd/Ynk1)
summary: >-
  Nucleoside diphosphate kinases redistribute terminal phosphate among nucleotide pools through
  a phosphohistidine intermediate: the gamma-phosphate of ATP is transferred to an active-site
  histidine and then to any ribo- or deoxyribonucleoside diphosphate (ping-pong mechanism). In
  PANTHER 19.0 the family holds the classical single-domain NDKs of bacteria (E. coli, B.
  subtilis, P. aeruginosa ndk), fungi (yeast YNK1, S. pombe ndk1), invertebrates (Drosophila
  awd, C. elegans ndk-1), Dictyostelium, plants (NDK1-4, including chloroplastic and
  mitochondrial isoforms) and the four vertebrate group I NMEs (NME1/NDPK-A, NME2/NDPK-B, NME3,
  and mitochondrial NME4). The divergent human group II NME proteins (NME5-NME9, with NDK-like
  domains and little or no NDPK activity) are not classified in this family. The Awd/NM23-type
  catalytic role contributes to nucleotide homeostasis, while individual proteins also take part
  in trafficking (local GTP supply to dynamins), developmental regulation and, for NME1,
  metastasis suppression and nuclease activities; those cellular roles need not imply a
  different phosphotransfer reaction.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The characterized members across bacteria, fungi, animals and plants are active NDP kinases
  sharing the catalytic histidine (His118 in NME1), and PAINT places nucleoside diphosphate
  kinase activity at the family root. Awd and classical NDKs catalyze nucleoside-diphosphate
  phosphorylation; the Awd killer-of-prune mutation changes protein stability without abolishing
  catalytic efficiency (PMID:1320004). The low-activity group II NME proteins fall outside this
  family. Remaining heterogeneity is in localization (cytosolic versus mitochondrial or plastid
  isoforms) and in lineage-specific secondary roles (histidine protein phosphotransfer, DNA
  cleavage, Notch regulation by Awd), which are not universal NDK functions. One small, poorly
  characterized C. elegans protein (Y48G8AL.15, Q7KX00, SF97) has a divergent motif around the
  catalytic histidine and has not been assayed.
