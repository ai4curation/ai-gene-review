    label: mitochondrion
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Mitochondrial (intermembrane space, matrix or outer membrane) pools are documented for NME4
    (SF49), NME3 (SF54), Dictyostelium ndkM (SF110), Arabidopsis NDPK3 (SF101) and the
    eukaryotic members of SF91 (yeast Ynk1). Not the vertebrate cytosolic NDPK-A/NDPK-B
    subfamilies (SF69, SF57), and not the bacterial members of SF91, which lie outside the
    eukaryotic node.
