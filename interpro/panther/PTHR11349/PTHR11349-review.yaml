term_assessments:
- assessed_term:
    id: GO:0004550
    label: nucleoside diphosphate kinase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the module's function for the UDP-to-UTP step (de_novo_pyrimidine_synthesis,
    udp_ndp_kinase_activity). PAINT asserts it at the family root, seeded from all major
    lineages, and the characterized members of every listed subfamily are active NDP kinases.
    The group II NME proteins with little or no NDPK activity are not in this family. Awd and
    classical NDKs catalyze nucleoside-diphosphate phosphorylation; the Awd killer-of-prune
    mutation changes protein stability without abolishing catalytic efficiency (PMID:1320004).
    The only caveat is the single unassayed C. elegans SF97 protein with a divergent motif
    around the catalytic histidine; it is not used by the module and no data contradict the
    grant. Notch regulation and other Awd-specific pathways are not universal NDK functions.
  supported_by:
  - reference_id: PMID:33903070
    supporting_text: The members of group I (NME1-4) share 40–88% sequence homology and possess NDPK activity.
  - reference_id: PMID:1320004
    supporting_text: The mutant protein, which carries a serine instead of proline at position 97, has structural properties and catalytic efficiency that are very similar to the wild-type protein.
