family_id: PANTHER:PTHR11349
family_name: NUCLEOSIDE DIPHOSPHATE KINASE
summary: Nucleoside diphosphate kinases redistribute terminal phosphate among nucleotide pools through
  a phosphohistidine intermediate. The Awd/NM23-type catalytic role contributes to nucleotide homeostasis,
  while individual proteins can also participate in trafficking and developmental regulation. Those cellular
  roles need not imply a different phosphotransfer reaction.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Awd and classical NDKs catalyze nucleoside-diphosphate phosphorylation; the Awd killer-of-prune
  mutation changes protein stability without abolishing catalytic efficiency (PMID:1320004). The classification
  also includes NDK-like/domain-containing branches for which this source does not resolve a complete
  active-site and biochemical boundary. Awd activity is supported, but an unconditional grant to all classified
  NDK-like proteins remains unresolved. Notch regulation and other Awd-specific pathways are not universal
  NDK functions.
