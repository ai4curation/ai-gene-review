notes: >-
  Upgraded on 2026-11-13 from a thin benchmark review (codex, 2026-09-10): PAINT, metadata and
  entries were re-fetched; reference protein (human NME1, COMPLETE review), subfamilies, node
  assessments for all five PAINT rows and an evidence-based scope for GO:0004550 were added.
  Subfamily membership is from the PANTHER 19.0 reference-proteome classification files; IBA
  recipients of PTN000887110 and PTN000142925 were listed with QuickGO. Human NME5-NME9 are not
  members (PANTHER 19.0 human classification). Modules using this family:
  de_novo_pyrimidine_synthesis (udp_ndp_kinase_activity; representatives YNK1, S. pombe ndk1,
  NME1). Gene reviews: human NME1 and NME2, yeast YNK1, S. pombe ndk1. Suggested PAINT change:
  an IRD for mitochondrion on the vertebrate NDPK-A/NDPK-B clade below PTN000142925.
