family_id: PANTHER:PTHR13027
family_name: SAND PROTEIN-RELATED
preferred_name: Mon1/SAND subunits of the Mon1-Ccz1 Rab7-family GEF complex
summary: >-
  PTHR13027 contains Mon1/SAND-family longin-domain subunits of the Mon1-Ccz1
  Rab7-family guanine-nucleotide exchange factor. This fungal-scope review
  assesses the inherited core Mon1-Ccz1 complex and Rab7/Ypt7 GEF activity and
  the fungal Mon1 branch's PAINT-supported fungal-type vacuole membrane and
  protein-targeting-to-vacuole roles from the experimentally characterized
  S. cerevisiae MON1 seed.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed PTHR13027 members are Mon1/SAND-family subunits that contribute
  to Rab7/Ypt7 activation by a Mon1-Ccz1 complex; vertebrate MON1A/MON1B
  paralogs retain the same complex class, while the fungal members form the
  Mon1-Ccz1 dimer used during fusion with the fungal vacuole.
