family_id: PANTHER:PTHR19375
family_name: HEAT SHOCK PROTEIN 70KDA
preferred_name: Hsp70/DnaK chaperone family
summary: >-
  The Hsp70-related family shares a nucleotide-binding domain coupled to a protein-interaction region,
  but includes different molecular roles. Canonical DnaK/Hsp70 proteins use nucleotide-driven client cycles
  for folding and related proteostasis functions. HscA is a specialized IscU-associated ATPase supporting
  iron-sulfur cluster transfer; direct E. coli studies show holdase and scaffold-state-selection behavior
  without establishing every generic folding endpoint. Hsp110 proteins provide nucleotide exchange and
  holdase functions for canonical Hsp70s, and other divergent members need individual assessment. Functional
  divergence therefore extends beyond localization. Cytosolic/nuclear, ER-lumenal and mitochondrial paralogs
  retain their established compartment-specific targeting and PAINT assessments; no localization conclusion
  is changed by this activity reconciliation. Dedicated paralogs include cytosolic/nuclear HSPA8,
  HSPA1A/B and yeast SSA/SSB; ER-lumenal HSPA5 and yeast KAR2; and mitochondrial HSPA9 and yeast
  SSC1/SSQ1. N-terminal targeting signals route the organellar branches, KDEL/HDEL retrieval retains
  the ER branch, and the GPTIEEVD motif of canonical cytosolic members docks TPR co-chaperones.
  The cached PAINT cellular-component assertions remain on specific clade nodes rather than the
  family-root PTN000452648: for example, cytosol/nucleus at PTN002500132, ER-lumen and membrane
  at PTN001834223, and mitochondrion at PTN000452554. These localization facts coexist with the
  activity differences discussed above.

functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Canonical Hsp70/DnaK folding mechanisms remain strongly supported, but universal folding activity cannot
  be inferred from the shared fold or ATP-dependent client capture alone. HscA has directly measured ATPase,
  holdase and IscU-transfer functions; whether these supply the folding endpoint required by GO0140662
  is unresolved for the reviewed targets. Existing Hsp110 nucleotide-exchange specialization and HSPA13
  substrate-region divergence further limit a single family-wide activity description. Compartmental divergence
  is important but is not the only functional difference. No replacement family-wide ATPase grant is made.

reference_protein:
  id: UniProtKB:P11142
  label: Heat shock cognate 71 kDa protein
  gene_symbol: HSPA8
  organism: Homo sapiens

subfamilies:
  - clade_node_id: PANTHER:PTN002500132
    label: Cytosolic/nuclear HSC70-HSP70 branch
    description: >-
      The constitutive (HSC70/HSPA8) and stress-inducible (HSP70/HSPA1A-B, yeast
      SSA1-4) cytosolic chaperones. Core compartment is the cytosol, with
      stress-induced nuclear/nucleolar accumulation; members end in the GPTIEEVD
      motif that docks HOP/CHIP-type TPR co-chaperones. Cell-surface and exosomal
      pools are documented for several members but are context-specific moonlighting
      locations, not the evolved compartment -- and the current PAINT slice carries
      no plasma-membrane IBD anywhere in this family (see term_assessments).
    representative_members:
      - id: UniProtKB:P11142
        label: Heat shock cognate 71 kDa protein
        gene_symbol: HSPA8
        organism: Homo sapiens
        gene_review: genes/human/HSPA8/HSPA8-ai-review.yaml
      - id: UniProtKB:P63018
        label: Heat shock cognate 71 kDa protein
        gene_symbol: Hspa8
        organism: Rattus norvegicus
        gene_review: genes/rat/Hspa8/Hspa8-ai-review.yaml
      - id: UniProtKB:P0DMV8
        label: Heat shock 70 kDa protein 1A
        gene_symbol: HSPA1A
        organism: Homo sapiens
      - id: UniProtKB:P10591
        label: Heat shock protein SSA1
        gene_symbol: SSA1
        organism: Saccharomyces cerevisiae
    diverged_from_family: false

  - clade_node_id: PANTHER:PTN001834223
    label: ER-lumenal BiP/GRP78 branch
    description: >-
      The endoplasmic reticulum HSP70 (BiP/GRP78/Kar2). A cleaved N-terminal signal
      peptide directs ER entry and a C-terminal KDEL (fungal HDEL) retrieval signal
      maintains steady-state lumenal residency (see the kdel_retention site). BiP is
      a soluble lumenal protein with no membrane-spanning segment; its membrane
      contact is peripheral (translocon-associated during co- and post-translational
      import, plus UPR-sensor complexes), which is why generic "membrane" reads as a
      granularity mismatch at gene level even though the branch node carrying it is
      correctly placed.
    representative_members:
      - id: UniProtKB:P11021
        label: Endoplasmic reticulum chaperone BiP
        gene_symbol: HSPA5
        organism: Homo sapiens
      - id: UniProtKB:P06761
        label: Endoplasmic reticulum chaperone BiP
        gene_symbol: Hspa5
        organism: Rattus norvegicus
        gene_review: genes/rat/Hspa5/Hspa5-ai-review.yaml
      - id: UniProtKB:P20029
        label: Endoplasmic reticulum chaperone BiP
        gene_symbol: Hspa5
        organism: Mus musculus
      - id: UniProtKB:P16474
        label: Endoplasmic reticulum chaperone BiP
        gene_symbol: KAR2
        organism: Saccharomyces cerevisiae
        gene_review: genes/yeast/KAR2/KAR2-ai-review.yaml
    diverged_from_family: false

  - clade_node_id: PANTHER:PTN000452554
    label: Mitochondrial mortalin/Ssc1 branch
    description: >-
      Mitochondrial matrix HSP70s (HSPA9/mortalin, yeast SSC1/SSQ1) acting in import
      motor and iron-sulfur cluster assembly contexts. Included to complete the
      compartment picture: PAINT places GO:0005739 at this branch node, again
      branch-scoped rather than family-wide.
    representative_members:
      - id: UniProtKB:P38646
        label: Stress-70 protein, mitochondrial
        gene_symbol: HSPA9
        organism: Homo sapiens
        gene_review: genes/human/HSPA9/HSPA9-ai-review.yaml
    diverged_from_family: false

  - label: Bacterial DnaK branch
    description: >-
      The general-purpose bacterial Hsp70, working with DnaJ and GrpE in de novo
      folding, refolding of stress-denatured proteins and disaggregation, and the
      principal heat-shock Hsp70 of proteobacteria (PTN000452642).
    representative_members:
      - id: UniProtKB:P0A6Y8
        label: Chaperone protein DnaK
        gene_symbol: dnaK
        organism: Escherichia coli K-12
        gene_review: genes/ECOLI/DnaK/DnaK-ai-review.yaml
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR19375:SF176
    label: CHAPERONE PROTEIN HSCA
    description: >-
      HscA (Hsc66) is the specialized Isc-system Hsp70-related ATPase partnered with HscB. E. coli HscA
      recognizes IscU and couples its nucleotide cycle to cluster transfer. IscU is its characterized
      physiological client, while in vitro antiaggregation assays also use model proteins. E. coli HscA
      P0A6Z1 is classified in SF176 by PANTHER 19.0's official PTHR19.0_e_coli sequence-classification
      file, whereas its curated UniProt DR PANTHER line and the cached PTHR19375-entries.csv give
      PTHR19375 without a subfamily. This is a difference in classification granularity, not a
      conflicting placement in another subfamily; the official sequence classification supports
      the explicit SF176 assignment here. PSEPK Q88PK4 is kept in the separate family-level entry
      because no corresponding subfamily placement has been established. No HscA-specific PAINT node is
      assigned here.
    representative_members:
      - id: UniProtKB:P0A6Z1
        label: Chaperone protein HscA
        gene_symbol: hscA
        organism: Escherichia coli K-12
        gene_review: genes/ECOLI/hscA/hscA-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      The supported specialization is ATP-dependent IscU cluster transfer and conformational-state selection.
      PMID22782893 shows stabilization of disordered IscU, and PMID9852006 demonstrates antiaggregation
      activity on model substrates. ATP hydrolysis, holdase behavior and client capture do not by themselves
      establish ATP-driven folding to a native state. This leaves the generic folding assignment unresolved
      rather than proving its loss or justifying a negative HscA exception. It also avoids transferring
      general heat-response or broad-client refolding claims solely from Hsp70 membership.
    supported_by:
      - reference_id: PMID:15485839
        supporting_text: >-
          IscU behaves as a substrate for HscA, and HscB enhances the binding of IscU
          to HscA.

      - reference_id: PMID:22782893
        supporting_text: HscA decreases the D → S rate and binds to and stabilizes the disordered
          state of IscU
      - reference_id: PMID:9852006
        supporting_text: Hsc66 suppressed aggregation of rhodanese and citrate synthase
      - reference_id: PMID:18986169
        supporting_text: A mutant form of HscA lacking ATPase activity, HscA(T212V), was unable to
          accelerate cluster transfer
  - label: HscA orthologs classified only at family level
    description: >-
      HscA orthologs that PANTHER classifies only at the PTHR19375 family level, with no
      subfamily assignment in UniProt's DR PANTHER line and no entry in PANTHER's
      per-organism sequence classification files (the Pseudomonas file covers
      P. aeruginosa only). P. putida KT2440 HscA (Q88PK4, PP_0846) is encoded in the
      iscSUA-hscBA-fdx locus beside HscB and is functionally the SF176 role; it is kept
      out of SF176 here because its subfamily placement is not established.
    representative_members:
      - id: UniProtKB:Q88PK4
        label: Chaperone protein HscA homolog
        gene_symbol: hscA
        organism: Pseudomonas putida KT2440
        gene_review: genes/PSEPK/hscA/hscA-ai-review.yaml
    diverged_from_family: false

node_assessments:
  # --- Cytosolic HSC70 branch node (the node named in rat Hspa8's plasma-membrane IBA WITH/FROM) ---
  - node_id: PANTHER:PTN002500132
    asserted_term:
      id: GO:0005829
      label: cytosol
    evidence: IBD
    node_taxon: {id: "NCBITaxon:33154", label: Opisthokonta}
    paint_snapshot: "20241120"
    seeds:
      - id: UniProtKB:P11142
        label: HSPA8
        organism: Homo sapiens
      - id: UniProtKB:P0DMV8
        label: HSPA1A
        organism: Homo sapiens
      - id: WB:WBGene00002005
        label: hsp-1
        organism: Caenorhabditis elegans
    assessment: SOUND
    assessment_reason: >-
      Cytosol is the core compartment of this branch and the seeds span fungi and
      metazoa (human HSPA8/HSPA1A, worm hsp-1, yeast and fission-yeast cytosolic
      SSA-type members), so an opisthokont-level placement is exactly where the
      evidence sits. This is the correct residual content of this node: notably,
      the same node's earlier plasma-membrane assertion (GO:0005886) -- the one rat
      Hspa8's IBA WITH/FROM points at -- is no longer recorded anywhere in the
      current slice; only cytosol and nucleus remain. See the GO:0005886 term
      assessment for the withdrawal record.

  - node_id: PANTHER:PTN002500132
    asserted_term:
      id: GO:0005634
      label: nucleus
    evidence: IBD
    node_taxon: {id: "NCBITaxon:33154", label: Opisthokonta}
    paint_snapshot: "20250903"
    seeds:
      - id: UniProtKB:P11142
        label: HSPA8
        organism: Homo sapiens
      - id: UniProtKB:P0DMV8
        label: HSPA1A
        organism: Homo sapiens
      - id: WB:WBGene00002005
        label: hsp-1
        organism: Caenorhabditis elegans
    assessment: SOUND
    assessment_reason: >-
      Stress-induced nuclear and nucleolar accumulation of cytosolic HSC70/HSP70 is a
      conserved, repeatedly observed behavior of this branch, with experimental seeds
      in both fungi and metazoa. Nucleus is a genuine secondary compartment for these
      chaperones (they shuttle, concentrating in nuclei during and after stress), so
      inheritance across the opisthokont clade is defensible.

  # --- ER BiP branch node (the node behind rat Hspa5's disputed membrane IBA) ---
  - node_id: PANTHER:PTN001834223
    asserted_term:
      id: GO:0016020
      label: membrane
    evidence: IBD
    node_taxon: {id: "NCBITaxon:2759", label: Eukaryota}
    paint_snapshot: "20230111"
    seeds:
      - id: MGI:MGI:95835
        label: Hspa5
        organism: Mus musculus
      - id: UniProtKB:P11021
        label: HSPA5
        organism: Homo sapiens
      - id: RGD:2843
        label: Hspa5 (the rat gene under review; own curated IDA to membrane, PMID:23444373)
        organism: Rattus norvegicus
      - id: PomBase:SPAC22A12.15c
        label: bip1
        organism: Schizosaccharomyces pombe
      - id: UniProtKB:Q6Z7B0
        label: BiP ortholog
        organism: Oryza sativa
    assessment: SOUND
    assessment_reason: >-
      The node placement is correct and the gene-side complaint against the resulting
      IBA is purely one of term granularity, not of phylogeny. Every seed is a BiP
      ortholog -- mouse and human HSPA5, S. pombe bip1, rice BiP, and rat Hspa5
      itself -- so this is a BiP-specific assertion, not a generic HSP70 leak, and
      the same node carries the ER-lumen, ER chaperone complex (GO:0034663), UPR
      (GO:0030968) and ERAD (GO:0036503) assertions that gene reviews accept. Rat
      Hspa5 appearing in its own with-list is the expected marker that experimental
      grounding exists on the target itself, not circularity. The residual issue is
      that bare "membrane" is uninformative for a soluble ER-lumenal KDEL protein
      (see kdel_retention) whose membrane contact is peripheral and
      translocon-associated; the informative descendants (GO:0005789 ER membrane,
      GO:0005788 ER lumen) already exist on the affected genes. That supports a
      gene-level MARK_AS_OVER_ANNOTATED on granularity grounds while the node itself
      stands.

  - node_id: PANTHER:PTN001834223
    asserted_term:
      id: GO:0005788
      label: endoplasmic reticulum lumen
    evidence: IBD
    node_taxon: {id: "NCBITaxon:2759", label: Eukaryota}
    paint_snapshot: "20260529"
    seeds:
      - id: MGI:MGI:95835
        label: Hspa5
        organism: Mus musculus
      - id: UniProtKB:P11021
        label: HSPA5
        organism: Homo sapiens
      - id: SGD:S000003571
        label: KAR2
        organism: Saccharomyces cerevisiae
      - id: PomBase:SPAC22A12.15c
        label: bip1
        organism: Schizosaccharomyces pombe
    assessment: SOUND
    assessment_reason: >-
      This is the informative localization for the BiP branch and the one the
      kdel_retention site mechanistically underwrites: signal-peptide-directed ER
      entry plus KDEL/HDEL receptor retrieval keeps these chaperones lumenal at
      steady state. Seeds span metazoa, budding and fission yeast, and the placement
      at the eukaryote-level BiP clade node matches the paralog's origin. Recorded
      alongside the GO:0016020 assessment because the contrast is the point: the
      same correctly placed node carries both the precise term and the uninformative
      parent.

  # --- Fungal cytosolic Hsp70 node: IRD pruning of protein refolding ---
  - node_id: PANTHER:PTN001065099
    asserted_term:
      id: GO:0042026
      label: protein refolding
    evidence: IRD
    negated: true
    seeds:
      - id: PANTHER:PTN000452648
        label: PTN000452648 (ancestral IBD node; IRD source)
    paint_snapshot: "20260616"
    node_taxon: {id: "NCBITaxon:4751", label: Fungi}
    assessment: LOSS_TOO_BROAD
    assessment_reason: >-
      PTN001065099 is not the ribosome-associated branch alone. Its 57 members span
      all of the fungal cytosolic Hsp70 subfamilies: the SSA chaperones (SF395 with
      S. cerevisiae SSA1/SSA2, S. pombe ssa1/ssa2, Neurospora hsps-1; SF385 with
      SSA3/SSA4), the ribosome-associated SSB group (SF467: SSB1/SSB2, S. pombe sks2),
      the RAC subunit SSZ1 (SF539) and a small LHS1-like group (SF522). On the same
      date the node was given an IBA for the broader GO:0006457 protein folding. For
      the SSB and SSZ1 branches the pruning is defensible. Their established role
      is folding nascent chains on the translating ribosome (Ssb at the
      ribosome-nascent chain complex, Ssz1 with zuotin in RAC), and none of them
      carries experimental evidence for refolding denatured or aggregated proteins.
      Our SSB1/SSB2/SSZ1 gene reviews already MODIFY the IBA to protein folding. For
      the SSA branch the loss is contradicted. S. cerevisiae SSA1 is itself one of the
      experimental seeds of the ancestral refolding IBD at PTN000452648
      (SGD:S000000004), and it has two SGD IDA annotations for protein refolding:
      reactivation of chemically denatured luciferase by purified Ssa1 and its
      mutants (PMID:18706386), and reactivation of aggregated proteins together with
      Hsp104 and Hsp40 (PMID:9674429). Both are abstract-only in our cache, so we
      defer to the SGD curators who read the full text. Refolding by the
      Hsp70-Hsp40(-Hsp104) system is the core biochemistry of the cytosolic SSA
      paralogs and is shared with the metazoan HSC70/HSP70 seeds, so no divergence
      places the SSA clade outside the function. The IRD should therefore move from
      PTN001065099 to the node(s) above SSB (SF467) and SSZ1 (SF539), or be removed,
      and the SSA subfamilies (SF395, SF385) should again inherit GO:0042026. SF522
      (LHS1-like) was not assessed. The affected subfamilies listed below are the
      ones for which the loss looks correct.
    supported_by:
      - reference_id: PMID:18706386
        supporting_text: >-
          reactivation of denatured luciferase were enhanced in Ssa1(A17V) and
          Ssa1(R34K) but compromised in Ssa1(L483W)
      - reference_id: PMID:9674429
        supporting_text: >-
          in concert with Hsp40 and Hsp70, Hsp104 can reactivate proteins that have
          been denatured and allowed to aggregate
      - reference_id: PMID:9670014
        supporting_text: >-
          These interactions allow Ssb to function as a chaperone on the ribosome,
          preventing the misfolding of newly synthesized proteins.
      - reference_id: PMID:11274393
        supporting_text: >-
          Zuotin and Ssz1p form a ribosome-associated complex (RAC) that is bound to
          the ribosome via the zuotin subunit.
    affected_subfamilies:
      - {id: "PANTHER:PTHR19375:SF467", label: RIBOSOME-ASSOCIATED MOLECULAR CHAPERONE SSB1-RELATED}
      - {id: "PANTHER:PTHR19375:SF539", label: RIBOSOME-ASSOCIATED COMPLEX SUBUNIT SSZ1}

