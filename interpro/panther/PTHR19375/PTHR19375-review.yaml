family_id: PANTHER:PTHR19375
family_name: HEAT SHOCK PROTEIN 70KDA
preferred_name: Hsp70/DnaK chaperone family
summary: >-
  The Hsp70/DnaK family comprises ATP-dependent molecular chaperones built from a
  conserved nucleotide-binding domain allosterically coupled to a substrate-binding
  domain. All canonical members run the same cycle: ATP-bound low client affinity,
  J-domain co-chaperone-stimulated hydrolysis, ADP-bound high-affinity client capture,
  and nucleotide-exchange-factor-driven release. The molecular function is therefore
  highly conserved from bacterial DnaK to human paralogs. What is NOT shared is the
  compartment: eukaryotes maintain dedicated paralogs per compartment -- cytosolic and
  nuclear HSC70/HSP70 (HSPA8, HSPA1A/B, yeast SSA/SSB), the ER-lumenal BiP/GRP78 branch
  (HSPA5, yeast KAR2), and mitochondrial mortalin (HSPA9, yeast SSC1/SSQ1) -- each
  routed by N-terminal targeting signals and, for the ER branch, retained by a
  C-terminal KDEL/HDEL retrieval signal, while cytosolic members instead end in the
  GPTIEEVD co-chaperone-binding motif. Localization terms are consequently
  branch-level facts, and the current PAINT slice reflects this: every
  cellular-component IBD sits on a compartment-specific clade node (cytosol/nucleus on
  the opisthokont HSC70 node, ER compartments on the BiP node, mitochondrion on the
  mortalin node), not on the family root.

functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The ATP-dependent chaperone cycle (ATP binding and hydrolysis, unfolded protein
  binding, co-chaperone regulation) is family-wide, including bacterial DnaK. The
  divergence is compartmental, not catalytic: cytosolic/nuclear, ER-lumenal,
  mitochondrial, and plastid branches are fixed paralog groups, so no
  cellular-component term is safe at family level even though the core molecular
  function is. A minor functional exception is HSPA13/Stch, whose nucleotide site is
  intact but whose substrate-binding region is divergent, so full chaperone-cycle
  terms deserve member-level caution there.

reference_protein:
  id: UniProtKB:P11142
  label: Heat shock cognate 71 kDa protein
  gene_symbol: HSPA8
  organism: Homo sapiens

subfamilies:
  - clade_node_id: PANTHER:PTN002500132
    label: Cytosolic/nuclear HSC70-HSP70 branch
    description: >-
      The constitutive (HSC70/HSPA8) and stress-inducible (HSP70/HSPA1A-B, yeast
      SSA1-4) cytosolic chaperones. Core compartment is the cytosol, with
      stress-induced nuclear/nucleolar accumulation; members end in the GPTIEEVD
      motif that docks HOP/CHIP-type TPR co-chaperones. Cell-surface and exosomal
      pools are documented for several members but are context-specific moonlighting
      locations, not the evolved compartment -- and the current PAINT slice carries
      no plasma-membrane IBD anywhere in this family (see term_assessments).
    representative_members:
      - id: UniProtKB:P11142
        label: Heat shock cognate 71 kDa protein
        gene_symbol: HSPA8
        organism: Homo sapiens
        gene_review: genes/human/HSPA8/HSPA8-ai-review.yaml
      - id: UniProtKB:P63018
        label: Heat shock cognate 71 kDa protein
        gene_symbol: Hspa8
        organism: Rattus norvegicus
        gene_review: genes/rat/Hspa8/Hspa8-ai-review.yaml
      - id: UniProtKB:P0DMV8
        label: Heat shock 70 kDa protein 1A
        gene_symbol: HSPA1A
        organism: Homo sapiens
      - id: UniProtKB:P10591
        label: Heat shock protein SSA1
        gene_symbol: SSA1
        organism: Saccharomyces cerevisiae
    diverged_from_family: false

  - clade_node_id: PANTHER:PTN001834223
    label: ER-lumenal BiP/GRP78 branch
    description: >-
      The endoplasmic reticulum HSP70 (BiP/GRP78/Kar2). A cleaved N-terminal signal
      peptide directs ER entry and a C-terminal KDEL (fungal HDEL) retrieval signal
      maintains steady-state lumenal residency (see the kdel_retention site). BiP is
      a soluble lumenal protein with no membrane-spanning segment; its membrane
      contact is peripheral (translocon-associated during co- and post-translational
      import, plus UPR-sensor complexes), which is why generic "membrane" reads as a
      granularity mismatch at gene level even though the branch node carrying it is
      correctly placed.
    representative_members:
      - id: UniProtKB:P11021
        label: Endoplasmic reticulum chaperone BiP
        gene_symbol: HSPA5
        organism: Homo sapiens
      - id: UniProtKB:P06761
        label: Endoplasmic reticulum chaperone BiP
        gene_symbol: Hspa5
        organism: Rattus norvegicus
        gene_review: genes/rat/Hspa5/Hspa5-ai-review.yaml
      - id: UniProtKB:P20029
        label: Endoplasmic reticulum chaperone BiP
        gene_symbol: Hspa5
        organism: Mus musculus
      - id: UniProtKB:P16474
        label: Endoplasmic reticulum chaperone BiP
        gene_symbol: KAR2
        organism: Saccharomyces cerevisiae
        gene_review: genes/yeast/KAR2/KAR2-ai-review.yaml
    diverged_from_family: false

  - clade_node_id: PANTHER:PTN000452554
    label: Mitochondrial mortalin/Ssc1 branch
    description: >-
      Mitochondrial matrix HSP70s (HSPA9/mortalin, yeast SSC1/SSQ1) acting in import
      motor and iron-sulfur cluster assembly contexts. Included to complete the
      compartment picture: PAINT places GO:0005739 at this branch node, again
      branch-scoped rather than family-wide.
    representative_members:
      - id: UniProtKB:P38646
        label: Stress-70 protein, mitochondrial
        gene_symbol: HSPA9
        organism: Homo sapiens
        gene_review: genes/human/HSPA9/HSPA9-ai-review.yaml
    diverged_from_family: false

node_assessments:
  # --- Cytosolic HSC70 branch node (the node named in rat Hspa8's plasma-membrane IBA WITH/FROM) ---
  - node_id: PANTHER:PTN002500132
    asserted_term:
      id: GO:0005829
      label: cytosol
    node_taxon: {id: NCBITaxon:33154, label: Opisthokonta}
    paint_snapshot: "20241120"
    seeds:
      - id: UniProtKB:P11142
        label: HSPA8
        organism: Homo sapiens
      - id: UniProtKB:P0DMV8
        label: HSPA1A
        organism: Homo sapiens
      - id: WB:WBGene00002005
        label: hsp-1
        organism: Caenorhabditis elegans
    assessment: SOUND
    assessment_reason: >-
      Cytosol is the core compartment of this branch and the seeds span fungi and
      metazoa (human HSPA8/HSPA1A, worm hsp-1, yeast and fission-yeast cytosolic
      SSA-type members), so an opisthokont-level placement is exactly where the
      evidence sits. This is the correct residual content of this node: notably,
      the same node's earlier plasma-membrane assertion (GO:0005886) -- the one rat
      Hspa8's IBA WITH/FROM points at -- is no longer recorded anywhere in the
      current slice; only cytosol and nucleus remain. See the GO:0005886 term
      assessment for the withdrawal record.

  - node_id: PANTHER:PTN002500132
    asserted_term:
      id: GO:0005634
      label: nucleus
    node_taxon: {id: NCBITaxon:33154, label: Opisthokonta}
    paint_snapshot: "20250903"
    seeds:
      - id: UniProtKB:P11142
        label: HSPA8
        organism: Homo sapiens
      - id: UniProtKB:P0DMV8
        label: HSPA1A
        organism: Homo sapiens
      - id: WB:WBGene00002005
        label: hsp-1
        organism: Caenorhabditis elegans
    assessment: SOUND
    assessment_reason: >-
      Stress-induced nuclear and nucleolar accumulation of cytosolic HSC70/HSP70 is a
      conserved, repeatedly observed behavior of this branch, with experimental seeds
      in both fungi and metazoa. Nucleus is a genuine secondary compartment for these
      chaperones (they shuttle, concentrating in nuclei during and after stress), so
      inheritance across the opisthokont clade is defensible.

  # --- ER BiP branch node (the node behind rat Hspa5's disputed membrane IBA) ---
  - node_id: PANTHER:PTN001834223
    asserted_term:
      id: GO:0016020
      label: membrane
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20230111"
    seeds:
      - id: MGI:MGI:95835
        label: Hspa5
        organism: Mus musculus
      - id: UniProtKB:P11021
        label: HSPA5
        organism: Homo sapiens
      - id: RGD:2843
        label: Hspa5 (the rat gene under review; own curated IDA to membrane, PMID:23444373)
        organism: Rattus norvegicus
      - id: PomBase:SPAC22A12.15c
        label: bip1
        organism: Schizosaccharomyces pombe
      - id: UniProtKB:Q6Z7B0
        label: BiP ortholog
        organism: Oryza sativa
    assessment: SOUND
    assessment_reason: >-
      The node placement is correct and the gene-side complaint against the resulting
      IBA is purely one of term granularity, not of phylogeny. Every seed is a BiP
      ortholog -- mouse and human HSPA5, S. pombe bip1, rice BiP, and rat Hspa5
      itself -- so this is a BiP-specific assertion, not a generic HSP70 leak, and
      the same node carries the ER-lumen, ER chaperone complex (GO:0034663), UPR
      (GO:0030968) and ERAD (GO:0036503) assertions that gene reviews accept. Rat
      Hspa5 appearing in its own with-list is the expected marker that experimental
      grounding exists on the target itself, not circularity. The residual issue is
      that bare "membrane" is uninformative for a soluble ER-lumenal KDEL protein
      (see kdel_retention) whose membrane contact is peripheral and
      translocon-associated; the informative descendants (GO:0005789 ER membrane,
      GO:0005788 ER lumen) already exist on the affected genes. That supports a
      gene-level MARK_AS_OVER_ANNOTATED on granularity grounds while the node itself
      stands.

  - node_id: PANTHER:PTN001834223
    asserted_term:
      id: GO:0005788
      label: endoplasmic reticulum lumen
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20260529"
    seeds:
      - id: MGI:MGI:95835
        label: Hspa5
        organism: Mus musculus
      - id: UniProtKB:P11021
        label: HSPA5
        organism: Homo sapiens
      - id: SGD:S000003571
        label: KAR2
        organism: Saccharomyces cerevisiae
      - id: PomBase:SPAC22A12.15c
        label: bip1
        organism: Schizosaccharomyces pombe
    assessment: SOUND
    assessment_reason: >-
      This is the informative localization for the BiP branch and the one the
      kdel_retention site mechanistically underwrites: signal-peptide-directed ER
      entry plus KDEL/HDEL receptor retrieval keeps these chaperones lumenal at
      steady state. Seeds span metazoa, budding and fission yeast, and the placement
      at the eukaryote-level BiP clade node matches the paralog's origin. Recorded
      alongside the GO:0016020 assessment because the contrast is the point: the
      same correctly placed node carries both the precise term and the uninformative
      parent.

residue_sites:
  - site_id: kdel_retention
    label: C-terminal KDEL/HDEL ER-retrieval signal
    description: >-
      The C-terminal tetrapeptide of the BiP branch, bound in the Golgi by KDEL
      receptors that retrieve escaped lumenal proteins back to the ER. It is the
      sequence-level discriminator between the ER branch and the cytosolic branch in
      this family: BiP orthologs end in KDEL (fungal Kar2-type members in HDEL),
      while cytosolic HSC70/HSP70 members instead end in GPTIEEVD (verified for
      P63018 and P11142, both 646 aa ending ...GASSGPTIEEVD), the docking motif for
      TPR co-chaperones. A machine-checkable negative control is deliberately not
      encoded: the cytosolic EEVD terminus shares D and E with KDEL, so no single
      C-terminal position discriminates the two motifs at one-residue granularity.
    anchor:
      id: UniProtKB:P06761
      label: Endoplasmic reticulum chaperone BiP
      gene_symbol: Hspa5
      organism: Rattus norvegicus
    anchor_sequence_version: 1
    site_source: UNIPROT_FEATURE
    residues:
      - position: 651
        expected: [K, H]
        role: retrieval-signal position 1 (K in metazoan/plant BiP; H in the fungal HDEL variant)
      - position: 652
        expected: [D]
        role: retrieval-signal position 2
      - position: 653
        expected: [E]
        role: retrieval-signal position 3
      - position: 654
        expected: [L]
        role: retrieval-signal position 4 (C-terminal residue)
    required_for:
      - term:
          id: GO:0005788
          label: endoplasmic reticulum lumen
        strength: CONTRIBUTES
        rationale: >-
          KDEL-receptor retrieval maintains steady-state ER-lumenal residency of
          soluble chaperones that would otherwise leak into the secretory pathway.
          CONTRIBUTES rather than REQUIRED: ER entry and initial lumenal
          localization are directed by the cleaved N-terminal signal peptide and do
          not depend on the retrieval signal, whose loss causes slow secretion
          rather than absence from the lumen.
    positive_controls:
      - id: UniProtKB:P11021
        label: Endoplasmic reticulum chaperone BiP
        gene_symbol: HSPA5
        organism: Homo sapiens
        control_position: 651
        control_residue: K
      - id: UniProtKB:P16474
        label: Endoplasmic reticulum chaperone BiP
        gene_symbol: KAR2
        organism: Saccharomyces cerevisiae
        control_position: 679
        control_residue: H

term_assessments:
  - assessed_term:
      id: GO:0005886
      label: plasma membrane
    scope: UNRESOLVED
    scope_reason: >-
      Recorded here because the disputed assertion no longer exists as a PAINT
      node/term pair to assess: no IBD for GO:0005886 survives anywhere in the
      current PTHR19375 slice (rows dated through 2026-08-28). The GOA WITH/FROM of
      rat Hspa8's plasma-membrane IBA names PTN002500132, which now carries only
      cytosol (GO:0005829) and nucleus (GO:0005634) -- PAINT has withdrawn or
      re-scoped the ancestral plasma-membrane claim, confirming the gene-side
      over-annotation calls (rat Hspa8 MARK_AS_OVER_ANNOTATED; yeast SSA1-4/SSB2
      REMOVE of the corresponding IBA). No phylogenetic propagation of this term is
      licensed in this family. The scope is UNRESOLVED rather than NOT_APPLICABLE
      deliberately: several members carry direct experimental evidence (HDA/TAS/IDA)
      of context-specific cell-surface and exosomal HSP70 pools -- human HSPA8 for
      one -- so a family-wide denial would be false. Surface localization is a
      member-by-member, condition-specific moonlighting observation that gene
      reviews may retain on direct evidence; it is not an inherited compartment.

  - assessed_term:
      id: GO:0016020
      label: membrane
    scope: UNRESOLVED
    scope_reason: >-
      The IBD behind the disputed rat Hspa5 IBA sits at the BiP-specific node
      PTN001834223 and is assessed SOUND above -- placement is not the problem. The
      gene-side objection is granularity: for a soluble ER-lumenal KDEL protein the
      bare "membrane" term adds nothing over ER membrane (GO:0005789) and the
      accepted ER-lumen annotations, which is a defect of the chosen term, not of
      the phylogeny. The scope axis here cannot express "correctly placed but
      uninformative", so this is deliberately UNRESOLVED rather than a grant or
      denial: peripheral membrane association is real across the BiP branch (and
      membrane-fraction HDA data exist for cytosolic members too), so no branch can
      be excluded as factually wrong, while endorsing the term family-wide would
      repeat the granularity mistake. The actionable family-level recommendation is
      that PAINT replace GO:0016020 at PTN001834223 with GO:0005789 (endoplasmic
      reticulum membrane) or drop it in favor of the co-located GO:0005788 IBD.

review_status: NEEDS_REVIEW
reviewed_by: AI-assisted family review (rat KB gene-review follow-up)
review_date: "2026-08-31"
notes: >-
  Scope: this review adjudicates the two localization assertions disputed by the rat
  gene reviews -- Hspa8 GO:0005886 (plasma membrane, IBA from PTN002500132) and Hspa5
  GO:0016020 (membrane, IBA from PTN001834223) -- in the context of the family's
  branch-wise localization structure.

  Why the plasma-membrane adjudication is a term_assessment and not a node_assessment:
  the family validator checks every node_assessment against the cached
  PTHR19375-paint.tsv and fails any node/term pair PAINT does not currently record.
  GO:0005886 appears at no node in the current slice, so the withdrawn assertion is
  recorded as a term assessment, with the surviving content of PTN002500132 (cytosol,
  nucleus) assessed as node assessments instead.

  Subfamily SF accessions are deliberately omitted: PANTHER classifies the cited
  members at family level only (their UniProt DR PANTHER cross-references carry no SF,
  and the subfamily column of PTHR19375-entries.csv is empty), so no SF id could be
  established for the branches. The branches are anchored to the PAINT clade nodes the
  IBDs actually sit on (PTN002500132, PTN001834223, PTN000452554), which is the axis
  the disputes are about.

  Residue verification provenance: C-termini were read from UniProt REST on 2026-08-31
  -- P06761 (654 aa, sv1) ends ...KDEL (651-654); P11021 (654 aa, sv2) ends ...KDEL
  (K651); P16474 (682 aa, sv1) ends ...HDEL (H679); P63018 and P11142 (both 646 aa)
  end ...GASSGPTIEEVD (no retrieval signal). family_name matches panther.obo verbatim;
  all representative members were confirmed present in PTHR19375-entries.csv.
