term_assessments:
  - assessed_term:
      id: GO:0005886
      label: plasma membrane
    scope: UNRESOLVED
    scope_reason: >-
      Recorded here because the disputed assertion no longer exists as a PAINT
      node/term pair to assess: no IBD for GO:0005886 survives anywhere in the
      current PTHR19375 slice (rows dated through 2026-08-28). The GOA WITH/FROM of
      rat Hspa8's plasma-membrane IBA names PTN002500132, which now carries only
      cytosol (GO:0005829) and nucleus (GO:0005634) -- PAINT has withdrawn or
      re-scoped the ancestral plasma-membrane claim, confirming the gene-side
      over-annotation calls (rat Hspa8 MARK_AS_OVER_ANNOTATED; yeast SSA1-4/SSB2
      REMOVE of the corresponding IBA). No phylogenetic propagation of this term is
      licensed in this family. The scope is UNRESOLVED rather than NOT_APPLICABLE
      deliberately: several members carry direct experimental evidence (HDA/TAS/IDA)
      of context-specific cell-surface and exosomal HSP70 pools -- human HSPA8 for
      one -- so a family-wide denial would be false. Surface localization is a
      member-by-member, condition-specific moonlighting observation that gene
      reviews may retain on direct evidence; it is not an inherited compartment.

  - assessed_term:
      id: GO:0016020
      label: membrane
    scope: UNRESOLVED
    scope_reason: >-
      The IBD behind the disputed rat Hspa5 IBA sits at the BiP-specific node
      PTN001834223 and is assessed SOUND above -- placement is not the problem. The
      gene-side objection is granularity: for a soluble ER-lumenal KDEL protein the
      bare "membrane" term adds nothing over ER membrane (GO:0005789) and the
      accepted ER-lumen annotations, which is a defect of the chosen term, not of
      the phylogeny. The scope axis here cannot express "correctly placed but
      uninformative", so this is deliberately UNRESOLVED rather than a grant or
      denial: peripheral membrane association is real across the BiP branch (and
      membrane-fraction HDA data exist for cytosolic members too), so no branch can
      be excluded as factually wrong, while endorsing the term family-wide would
      repeat the granularity mistake. The actionable family-level recommendation is
      that PAINT replace GO:0016020 at PTN001834223 with GO:0005789 (endoplasmic
      reticulum membrane) or drop it in favor of the co-located GO:0005788 IBD.

  - assessed_term:
      id: GO:0140662
      label: ATP-dependent protein folding chaperone
    scope: UNRESOLVED
    scope_reason: >-
      Canonical Hsp70/DnaK folding activity remains positive, including direct denatured-luciferase reactivation
      evidence for yeast Ssa1. A universal grant across this heterogeneous family is not justified. The
      current term requires ATP-driven assistance to protein folding; HscA ATPase stimulation, client
      capture and cluster transfer do not alone establish that endpoint. E. coli HscA stabilizes disordered
      IscU and has model-client antiaggregation activity. The full PMID9852006 study separately reports
      failure to restore denatured-luciferase activity in the tested Hsc66 partner combinations, with a
      positive DnaK control. Together these observations make generic folding assignments over-annotated
      for the E. coli target without proving impossibility for every substrate or transferring a negative
      experiment to the Pseudomonas and Azotobacter homologs. Their folding endpoints remain unresolved.
      The negative Hsp110 judgment for HSPH1/Q92598 remains: it acts as a nucleotide-exchange
      factor and holdase rather than an independent ATP-driven folding chaperone. The exact former exception
      object is archived because live member exceptions cannot qualify an UNRESOLVED universal scope;
      no negative HscA exception, loss event or new broad ATPase grant is added. HSPA13 and other divergent
      proteins remain member-level questions.
    supported_by:
      - reference_id: file:interpro/panther/PTHR19375/PTHR19375-paint.tsv
        supporting_text: "PTHR19375\tPTN000452648\tGO:0044183\tF\tIBD\tfalse"
      - reference_id: PMID:15485839
        supporting_text: >-
          When present together, IscU and HscB synergistically stimulate both k(hyd)
          (approximately = 500-fold) and k(T-->R) (approximately = 60-fold), leading to
          enhanced formation of the HscA.ADP-IscU complex (substrate capture).
      - reference_id: PMID:18706386
        supporting_text: Peptide binding and reactivation of denatured luciferase were enhanced in
          Ssa1(A17V) and Ssa1(R34K) but compromised in Ssa1(L483W).
      - reference_id: PMID:22782893
        supporting_text: HscA decreases the D → S rate and binds to and stabilizes the disordered
          state of IscU
      - reference_id: PMID:9852006
        supporting_text: Hsc66 suppressed aggregation of rhodanese and citrate synthase
      - reference_id: file:analysis/module_audits/bacterial_isc_iron_sulfur_cluster_assembly/round1/ecoli-psepk-consultation/evidence.md
        supporting_text: Hsc66 was also unable to assist refolding of denatured luciferase
      - reference_id: file:interpro/panther/PTHR19375/PTHR19375-paint.tsv
        supporting_text: "PTHR19375\tPTN002900795\tGO:0000774\tF\tIBD\tfalse"

