residue_sites:
  - site_id: kdel_retention
    label: C-terminal KDEL/HDEL ER-retrieval signal
    description: >-
      The C-terminal tetrapeptide of the BiP branch, bound in the Golgi by KDEL
      receptors that retrieve escaped lumenal proteins back to the ER. It is the
      sequence-level discriminator between the ER branch and the cytosolic branch in
      this family: BiP orthologs end in KDEL (fungal Kar2-type members in HDEL),
      while cytosolic HSC70/HSP70 members instead end in GPTIEEVD (verified for
      P63018 and P11142, both 646 aa ending ...GASSGPTIEEVD), the docking motif for
      TPR co-chaperones. A machine-checkable negative control is deliberately not
      encoded: the cytosolic EEVD terminus shares D and E with KDEL, so no single
      C-terminal position discriminates the two motifs at one-residue granularity.
    anchor:
      id: UniProtKB:P06761
      label: Endoplasmic reticulum chaperone BiP
      gene_symbol: Hspa5
      organism: Rattus norvegicus
    anchor_sequence_version: 1
    site_source: UNIPROT_FEATURE
    residues:
      - position: 651
        expected: [K, H]
        role: retrieval-signal position 1 (K in metazoan/plant BiP; H in the fungal HDEL variant)
      - position: 652
        expected: [D]
        role: retrieval-signal position 2
      - position: 653
