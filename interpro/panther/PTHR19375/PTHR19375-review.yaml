notes: >-
  Follow-up (2026-11-07): GO0140662 universal scope is now UNRESOLVED while canonical Hsp70 positives
  and the existing negative Hsp110 biological judgment are retained. This supersedes the family-wide activity
  interpretation in the historical completion note below. HscA uncertainty is not a demonstrated loss
  and does not alter any existing PAINT verdict, localization judgment, residue site, member identity
  or seed. No family-wide ATPase assessment was added. Completion (2026-10-24): every node/term pair in
  the current PTHR19375-paint.tsv slice now has a node assessment; bacterial DnaK and HscA branches were
  added so the family review covers the HscA representatives of the bacterial Isc iron-sulfur cluster
  assembly module, and GO:0140662 is assessed family-wide with an Hsp110 exception. The module grounds
  its HscA role to subfamily SF176 (CHAPERONE PROTEIN HSCA), where PANTHER 19.0 classifies E. coli HscA,
  rather than to the whole family, which also contains DnaK and the eukaryotic Hsp70s. Unlike the branches
  described in the original notes below, the HscA branch therefore carries an SF id, even though the UniProt
  cross-references and entries.csv still give only the family.

  Original scope: this review adjudicates the two localization assertions disputed by the rat gene reviews
  -- Hspa8 GO:0005886 (plasma membrane, IBA from PTN002500132) and Hspa5 GO:0016020 (membrane, IBA from
  PTN001834223) -- in the context of the family's branch-wise localization structure.

  Why the plasma-membrane adjudication is a term_assessment and not a node_assessment: the family validator
  checks every node_assessment against the cached PTHR19375-paint.tsv and fails any node/term pair PAINT
  does not currently record. GO:0005886 appears at no node in the current slice, so the withdrawn assertion
  is recorded as a term assessment, with the surviving content of PTN002500132 (cytosol, nucleus) assessed
  as node assessments instead.

  Subfamily SF accessions are deliberately omitted: PANTHER classifies the cited members at family level
  only (their UniProt DR PANTHER cross-references carry no SF, and the subfamily column of PTHR19375-entries.csv
  is empty), so no SF id could be established for the branches. The branches are anchored to the PAINT
  clade nodes the IBDs actually sit on (PTN002500132, PTN001834223, PTN000452554), which is the axis the
  disputes are about.

  Residue verification provenance: C-termini were read from UniProt REST on 2026-08-31 -- P06761 (654
  aa, sv1) ends ...KDEL (651-654); P11021 (654 aa, sv2) ends ...KDEL (K651); P16474 (682 aa, sv1) ends
  ...HDEL (H679); P63018 and P11142 (both 646 aa) end ...GASSGPTIEEVD (no retrieval signal). family_name
  matches panther.obo verbatim; all representative members were confirmed present in PTHR19375-entries.csv.
  Representation reconciliation: the former Q92598 member_exceptions object is preserved exactly in analysis/module_audits/bacterial_isc_iron_sulfur_cluster_assembly/family-consultation/hsp110-exception-baseline.json.
  The live field was removed only because exceptions are legal on FAMILY_WIDE or SUBFAMILY_ONLY grants,
  not on UNRESOLVED scope. Its unchanged rationale is: Hsp110 proteins act as nucleotide exchange factors
  and holdases for canonical Hsp70s rather than as ATP-driven folding chaperones in their own right; PAINT
  places adenyl-nucleotide exchange factor activity on the Hsp110 branch. Its quoted PAINT support is
  retained in the GO0140662 term assessment: PTHR19375	PTN002900795	GO:0000774	F	IBD	false. This changes
  representation, not the negative Hsp110 judgment.
