  name:
    name: Hemoglobin and related oxygen transporters
    short: Hemoglobin_oxygen_transport
  description:
  - text: This family of proteins is involved in the transport of oxygen from respiratory
      organs to the rest of the body. They contain heme groups that reversibly bind
      oxygen molecules, facilitating their delivery to tissues that require oxygen
      for metabolism. Some members of this family also have roles in embryonic development,
      acting as embryonic hemoglobins. Additionally, certain variants within this
      family can bind to receptors such as the cannabinoid receptor CNR1, acting as
      antagonists and influencing signaling pathways related to pain and inflammation.
