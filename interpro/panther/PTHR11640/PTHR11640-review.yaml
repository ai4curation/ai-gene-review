family_id: PANTHER:PTHR11640
family_name: NEPHRIN
summary: Immunoglobulin-domain extracellular and cell-surface proteins in this grouping mediate adhesion,
  recognition or tissue organization. The nephrin/Sns branch contributes to specialized cell junctions
  and, in flies, myoblast recognition and fusion. Other branches include different adhesion receptors
  and larger extracellular matrix proteins.
functional_coherence: HETEROGENEOUS
coherence_reason: The classification extends beyond nephrin to kin-of-irre proteins, adhesion molecules
  and multidomain extracellular proteins. Thus nephrocyte diaphragm, muscle fusion, homophilic binding
  and kidney filtration cannot be universal family functions. Sns experimental findings should be interpreted
  with its nephrin-like architecture and relevant heterophilic partner, rather than generic adhesion prose.
