  name:
    name: Cellular adhesion and signaling domain-containing protein
    short: Cell_adhesion_signaling
  description:
  - text: This family of proteins is involved in various cellular adhesion processes,
      including synaptic adhesion and the formation of specialized cell-cell junctions.
      Members of this family play crucial roles in the development and function of
      the kidney glomerular filtration barrier, as well as in the maintenance of podocyte
      architecture. They are also implicated in the regulation of vascular permeability
      and the anchoring of the podocyte slit diaphragm to the cytoskeleton. Some family
      members are necessary for synapse formation in the nervous system, acting as
      homophilic adhesion molecules that promote trans-cellular interactions and stabilize
      synaptic structures. Additionally, certain proteins within this family may have
      a role in supporting hematopoietic stem cells and regulating insulin secretion.
