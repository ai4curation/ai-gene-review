- assessed_term:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  scope: UNRESOLVED
  scope_reason: Activation is a direction-specific transcriptional claim. An intact zinc-finger array,
    absence of a KRAB motif, or a generic transcription-factor inference does not demonstrate recruitment
    of coactivators rather than repression. A direct reporter, transcriptional perturbation or established
    activating branch is required for this narrower term.
