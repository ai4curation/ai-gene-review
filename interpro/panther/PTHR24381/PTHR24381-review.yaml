      - {id: UniProtKB:P52738, label: ZNF140, organism: Homo sapiens}
      - {id: UniProtKB:Q86Y25, label: ZNF354C, organism: Homo sapiens}
      - {id: UniProtKB:Q96RE9, label: ZNF300, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: >-
      The seeds are experimentally characterized transcription factors, and they include
      both regulatory directions: ZNF300 has IDA for the activator child GO:0001228
      (PMID:20585888) while ZNF140 has IDA for the repressor child GO:0001227
      (PMID:11470777), both verified in QuickGO. Placing the direction-agnostic parent
      GO:0000981 at the node is therefore exactly the right generalization - asserting
      either directional child here would have been a regulatory-sign-inversion error,
      and the cached PAINT slice shows the curators did reserve GO:0001227/GO:0001228
      for narrower nodes elsewhere in the family (PTN000695196, PTN009065786,
      PTN002811836, PTN009098138). Descent of the parent term to effector-less members
      such as the SF440 target, whose direction is unknown, asserts only what the
      architecture supports.
