- assessed_term:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  scope: UNRESOLVED
  scope_reason: An array of C2H2 fingers is compatible with sequence-specific DNA recognition, but it
    does not identify a RNA-polymerase-II cis-regulatory site, and some related fingers participate in
    RNA or protein interactions. The Xenopus array supports a targeted DNA-binding hypothesis without
    specifying the bound motif or a universal family-wide regulatory sequence.
