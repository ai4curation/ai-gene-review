    assessment: SOUND
    assessment_reason: >-
      Nuclear localization is the compartment entailed by the family's conserved function
      (sequence-specific binding of genomic DNA), and this IBD is seeded by 39
      experimentally annotated eumetazoan members spanning mouse, rat, and human. Spot
      check of a seed: mouse Zfp932 (MGI:1916754, UniProtKB:E9QAG8) carries IDA
