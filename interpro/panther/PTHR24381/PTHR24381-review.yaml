- assessed_term:
    id: GO:0005634
    label: nucleus
  scope: UNRESOLVED
  scope_reason: Many characterized zinc-finger transcription factors act in nuclei, but the C2H2 fold
    is not a localization signal in itself. The Xenopus sequence has a plausible nuclear DNA-regulatory
    architecture; the complete distribution of nuclear localization across the large heterogeneous family
    remains unresolved.
