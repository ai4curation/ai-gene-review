      and with the molecular-function assertion assessed above.

term_assessments:
  - assessed_term:
      id: GO:0005634
      label: nucleus
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member is a tandem C2H2 zinc-finger protein whose shared function is binding
      genomic DNA; nuclear localization follows from the architecture and no diverged,
      non-nuclear branch is documented in the cached family data. PAINT asserts the term
      at many separate nodes across the family with no negating IRD anywhere in the
      cached slice.
  - assessed_term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    scope: FAMILY_WIDE
    scope_reason: >-
      The direction-agnostic TF activity term is the family's generic tier of molecular
      function and holds even for the documented diverged branch (the ZNF445 clade still
      acts as a DNA-binding transcription regulator; what changed there is the DNA
      target class, not the possession of TF activity). The directional children
      GO:0001227/GO:0001228 are NOT family-wide - the family holds verified activators
      and repressors side by side - and PAINT correctly confines them to narrower nodes.
  - assessed_term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    scope: FAMILY_WIDE
    scope_reason: >-
      Process counterpart of GO:0000981; safe at the direction-neutral parent level for
      the same reasons, with experimentally verified positive and negative regulators
      both present among the PAINT seeds. Positive/negative child terms must stay on
      narrower clades.
  - assessed_term:
      id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Widespread but demonstrably not family-wide: the cached PAINT slice itself negates
      the ancestor binding term GO:0000976 for the ZNF445 clade (IRD at PTN008615686,
      Theria), whose members bind methylated imprinting-control regions (IBD GO:0010385
      at the same node) rather than ordinary cis-regulatory elements. This scoped review
      adjudicated only the target-relevant subfamily, so the applicable_subfamilies list
      is deliberately NON-EXHAUSTIVE: SF440 is listed because its members are intact
      effector-less tandem-C2H2 arrays inside the clade of the sound PTN001225435
      assertion; many other subfamilies are very likely also safe (PAINT asserts
      GO:0000978 at eight separate nodes in this family) but were not individually
      assessed here. A retained GO:0000978 flagged elsewhere in this family should
      prompt extending this list, not removing the annotation.
    applicable_subfamilies:
      - {id: PANTHER:PTHR24381:SF440, label: OOCYTE ZINC FINGER PROTEIN XLCOF7.1-LIKE}

review_status: DRAFT
reviewed_by: AI-assisted family/PTN curation pass (claude)
review_date: "2026-08-31"
notes: >-
  Scoped review: this family has 149 subfamilies and 16 PAINT-annotated nodes in the
  cached slice; only node PTN001225435 - the node backing all four IBA rows on the X.
  tropicalis gene A0A8J0SCI2 (genes/XENTR/A0A8J0SCI2/) - is assessed, and only the
  target's subfamily SF440 is described. No residue_sites are defined deliberately: the
  family's functions rest on a repeated modular architecture (tandem C2H2 fingers with
  per-finger Zn-coordinating and base-contacting residues), not on any single anchorable
  catalytic or specificity position, so a point-residue site would fabricate precision
  the biology does not have.

  Provenance of identifiers and labels: family_name and the SF440 label were read
  verbatim from interpro/panther/panther.obo; the target's SF440 assignment from the
  PANTHER cross-reference in its cached UniProt record; node ids, seed lists, taxa, and
  snapshot dates were copied from PTHR24381-paint.tsv (taxon:6072 expanded to
  NCBITaxon:6072 "Eumetazoa" via the Ensembl taxonomy REST service). Seed identities
  were verified against live UniProt REST (P35789=ZNF93, P52738=ZNF140, Q86Y25=ZNF354C,
  Q96RE9=ZNF300, P52737=ZNF136, Q96CS4=ZNF689, Q9HCX3=ZNF304, P18752=XlCOF7.2,
  P59923=ZNF445 with cross-reference PTHR24381:SF435) and mygene.info/Alliance
  (MGI:108094=Zfp92, MGI:1916754=Zfp932, MGI:2143340=Zfp445); seed experimental
  annotations quoted in assessment reasons were checked against QuickGO. Seeds not
  individually verified are listed with bare ids and no label. representative_members
  A0A8J0SCI2 and P18752 are not yet in interpro/panther/panther-members.tsv (index
  refresh deferred to the orchestrator), so their membership check will warn rather
  than pass.

  Two observations recorded but deliberately not acted on: (1) the PANTHER label of
  SF435 is "ZINC FINGER PROTEIN 59" although its verified member here is ZNF445 - a
  name dominated by another member, per the known PANTHER naming caveat; SF435 is not
  given a subfamilies entry because its full membership was not enumerated and the
  divergence evidence inspected is node-level (PTN008615686), not subfamily-level.
  (2) seed UniProtKB:P49711 (CTCF) appears at node PTN002812688 in the cached PAINT
  slice, but CTCF's current UniProt PANTHER cross-reference is PTHR16515, suggesting
  the cached slice and the current PANTHER release disagree about that branch; not
  assessed since that node does not back the target's IBAs.
