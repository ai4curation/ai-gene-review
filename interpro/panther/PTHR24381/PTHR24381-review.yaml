    label: regulation of transcription by RNA polymerase II
  scope: UNRESOLVED
  scope_reason: The family includes zinc-finger activators, repressors and proteins with other interaction
    roles. RNA-polymerase-II regulation requires an experimentally anchored regulatory branch and appropriate
    effector interactions, not simply metal-coordinating fingers. The available target architecture does
    not establish an exhaustive Pol-II-regulatory set.
