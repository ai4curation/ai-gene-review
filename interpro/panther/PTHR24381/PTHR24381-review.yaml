      diverged branch of this family is documented anywhere in the cached family data, so
      there is no candidate clade for pruning.
  - node_id: PANTHER:PTN001225435
    asserted_term:
      id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    node_taxon: {id: NCBITaxon:6072, label: Eumetazoa}
    paint_snapshot: "20200709"
    seeds:
      - {id: MGI:MGI:1916754, label: Zfp932, organism: Mus musculus}
    assessment: SOUND
    assessment_reason: >-
      A single-seed IBD, which is not weak support: the seed, mouse Zfp932
      (MGI:1916754, UniProtKB:E9QAG8), is experimentally solid, with IDA GO:0000978
      from two independent papers (PMID:21177534, PMID:22391310) in QuickGO, and the
      PAINT judgment is about where in the tree the property arose, made with the whole
      alignment in view. Binding Pol II cis-regulatory regions through a tandem C2H2
      array is the family's defining architecture, and every descendant of this node for
      which the repo holds data (the X. tropicalis SF440 target has 8 tandem C2H2
      fingers covering residues 37-260 of its 265 residues) retains that architecture
      intact. The one documented loss of cis-regulatory-region binding in this family
      (the ZNF445 branch, IRD at PTN008615686 negating GO:0000976) was pruned by PAINT
      at its own node, from a different ancestor (PTN009094639), and does not implicate
      this node's placement.
  - node_id: PANTHER:PTN001225435
    asserted_term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    node_taxon: {id: NCBITaxon:6072, label: Eumetazoa}
