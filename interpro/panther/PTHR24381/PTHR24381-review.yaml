family_id: PANTHER:PTHR24381
family_name: ZINC FINGER PROTEIN
preferred_name: C2H2 zinc-finger regulatory proteins
summary: This large family collects C2H2 zinc-finger proteins with diverse DNA-recognition sequences,
  transcriptional effects and accessory domains. Activators, repressors and proteins with specialized
  architectural roles cannot be summarized by a common transcriptional direction.
functional_coherence: HETEROGENEOUS
coherence_reason: The Xenopus target has repeated C2H2 fingers and a curated transcription-factor inference.
  This supports a focused nuclear DNA-regulatory hypothesis but cannot establish activation rather than
  repression. Nuclear localization and RNA-polymerase-II regulation remain branch-level claims, not consequences
  of any isolated zinc finger.
