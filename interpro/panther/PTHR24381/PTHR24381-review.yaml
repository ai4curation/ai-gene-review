review_status: COMPLETE
reviewed_by: AI-assisted family adjudication (merged from the XENTR/A0A8J0SCI2 IBA pass and the #2990 codex batch pass)
review_date: "2026-09-15"
notes: >-
  Scoped review: this family has 149 subfamilies and 16 PAINT-annotated nodes in the
  cached slice; only node PTN001225435 - the node backing all four IBA rows on the X.
  tropicalis gene A0A8J0SCI2 (genes/XENTR/A0A8J0SCI2/) - is assessed. No subfamilies
  entry is asserted (see the reclassification note below). No residue_sites are
  defined deliberately: the
  family's functions rest on a repeated modular architecture (tandem C2H2 fingers with
  per-finger Zn-coordinating and base-contacting residues), not on any single anchorable
  catalytic or specificity position, so a point-residue site would fabricate precision
  the biology does not have.

  Provenance of identifiers and labels: family_name was read verbatim from
  interpro/panther/panther.obo; node ids, seed lists, taxa, and snapshot dates were
  copied from PTHR24381-paint.tsv (taxon:6072 expanded to NCBITaxon:6072 "Eumetazoa"
  via the Ensembl taxonomy REST service). Seed identities were verified against live
  UniProt REST (P35789=ZNF93, P52738=ZNF140, Q86Y25=ZNF354C, Q96RE9=ZNF300,
  P52737=ZNF136, Q96CS4=ZNF689, Q9HCX3=ZNF304, P18752=XlCOF7.2, P59923=ZNF445 with
  cross-reference PTHR24381:SF435) and mygene.info/Alliance (MGI:108094=Zfp92,
  MGI:1916754=Zfp932, MGI:2143340=Zfp445); seed experimental annotations quoted in
  assessment reasons were checked against QuickGO. Seeds not individually verified are
  listed with bare ids and no label.

  Reclassification / release drift: the cached UniProt record of the X. tropicalis
  target carries the cross-reference PTHR24381:SF440 ("OOCYTE ZINC FINGER PROTEIN
  XLCOF7.1-LIKE"), and an earlier draft of this review described SF440 with
  A0A8J0SCI2 and X. laevis XlCOF7.2 (P18752, listed under SF440 in the cached
  PTHR24381-entries.csv) as representative members. Live resolution against the
  current PANTHER release (the same UniProt/PANTHER lookup the member-index refresh
  performs; neither accession is cited in modules/ nor asserted as a family-review
  representative member or residue-site control -- only prose mentions, which the index
  does not scan -- so neither carries a row in interpro/panther/panther-members.tsv)
  refutes both memberships: A0A8J0SCI2 is now
  classified PTHR24377:SF929 and P18752 is PTHR23226:SF391. Per the "assert no id you cannot be sure of" rule the
  SF440 subfamily entry was removed rather than re-pointed - re-assigning the proteins
  to those other families is an evolutionary-placement judgment this review has not
  made. The node assessments stand regardless: the target's four IBA rows cite
  PTN001225435, a node of THIS family's cached PAINT slice, so the annotations under
  review descend from PTHR24381's tree as of the annotation release; the
  reclassification is drift between that release and the current one, of the same kind
  as the PAINT renumbering documented for PTHR11699.

  Two observations recorded but deliberately not acted on: (1) the PANTHER label of
  SF435 is "ZINC FINGER PROTEIN 59" although its verified member here is ZNF445 - a
  name dominated by another member, per the known PANTHER naming caveat; SF435 is not
  given a subfamilies entry because its full membership was not enumerated and the
  divergence evidence inspected is node-level (PTN008615686), not subfamily-level.
  (2) seed UniProtKB:P49711 (CTCF) appears at node PTN002812688 in the cached PAINT
  slice, but CTCF's current UniProt PANTHER cross-reference is PTHR16515, suggesting
  the cached slice and the current PANTHER release disagree about that branch; not
  assessed since that node does not back the target's IBAs.
  Merge adjudication (2026-09-15, PR #2958): main independently gained a
  batch-authored family review for this family in PR #2990 (reviewed_by codex,
  review_date 2026-09-10; functional_coherence HETEROGENEOUS, no
  node_assessments, term scopes UNRESOLVED). This merge overrides two of its
  term-scope verdicts in the permissive direction and says so explicitly:
  GO:0005634 and GO:0006357 stay FAMILY_WIDE here over the codex UNRESOLVED
  (GO:0000978 agrees at UNRESOLVED on both sides; GO:0000981 the codex entry
  did not assess; GO:0001228 is imported below). The codex reason for
  GO:0005634 -- "the C2H2 fold is not a localization signal in itself; the
  complete distribution of nuclear localization across the large heterogeneous
  family remains unresolved" -- is a term-scope argument and deserves a direct
  answer: the grant here does not treat the fold as an NLS. It rests on the
  compartment being entailed by the family's conserved function (sequence-
  specific binding of genomic DNA), on 39 experimentally annotated eumetazoan
  seeds at the family-backbone node, and on an active counterexample search of
  the cached family data that found no non-nuclear branch -- a search with
  demonstrated power to find divergence, since it did find the ZNF445 IRD for
  the binding term. GO:0006357 is granted on the same architecture-entailed
  generic tier, with seeds spanning both regulatory directions. The four SOUND
  node assessments are kept as independent findings, as is MOSTLY_COHERENT
  (both coherence reasons agree on the shared architecture-determined tier
  with heterogeneity above it). The codex
  entry's SF440 subfamily entry asserting A0A8J0SCI2 as a representative member
  is deliberately NOT imported: that exact membership was withdrawn earlier in
  this PR after PANTHER 19 reclassified the protein to PTHR24377:SF929 (see the
  reclassification note above), and re-importing it would re-break the
  representative-member check. Imported from the codex entry: its GO:0001228
  term assessment (recorded here as UNRESOLVED with this review's
  seed-direction evidence, plus a mirror GO:0001227 assessment) and its
  references list. Status handling: review_status is set to COMPLETE (main
  tracked this family as COMPLETE, and this file supersedes that version,
  with the deliberate omissions recorded above), review_date to the merge
  date, and reviewed_by names both passes.
