family_id: PANTHER:PTHR24381
family_name: ZINC FINGER PROTEIN
preferred_name: Krueppel C2H2-type zinc-finger family
summary: >-
  A very large family (14,981 proteins, 149 subfamilies, 4,302 taxa in the cached
  InterPro/PANTHER metadata) of Krueppel-type tandem C2H2 zinc-finger proteins. Members
  are built from arrays of C2H2 fingers, each coordinating one zinc ion through two
  cysteines and two histidines and contributing base-specific major-groove contacts, so
  the shared, architecture-determined function of the family is nuclear sequence-specific
  DNA binding in the service of RNA polymerase II transcription regulation. What varies
  between members is everything above that generic level: the DNA target sequence
  (dictated by the specificity residues of each finger array, which diverge rapidly under
  lineage-specific duplication), the regulatory direction (the family holds
  experimentally verified activators such as human ZNF300 and repressors such as human
  ZNF140 side by side, sometimes as seeds of the same PAINT node), the effector modules
  present (KRAB and SCAN domains in many members, none at all in others, including the
  Xenopus oocyte/gastrula XlCOF-type members), and in at least one branch the DNA target
  class itself (the ZNF445 clade binds methylated imprinting-control regions rather than
  ordinary cis-regulatory elements). PAINT annotates this family at many separate
  internal nodes with deliberately generic terms (nucleus; DNA-binding transcription
  factor activity, RNA polymerase II-specific; RNA polymerase II cis-regulatory region
  sequence-specific DNA binding; regulation of transcription by RNA polymerase II),
  reserving directional child terms (GO:0001227/GO:0001228) for narrower clades, and in
  one place uses an IRD to negate an inherited binding term - evidence of active,
  branch-aware curation rather than blanket propagation.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members share the generic tier of function that follows from the tandem C2H2
  architecture: nuclear localization, sequence-specific double-stranded DNA binding, and
  regulation of Pol II transcription. Below that tier the family is heterogeneous in
  target sequence, regulatory direction (verified activators and repressors coexist even
  among the seeds of a single PAINT node: ZNF300 has IDA for GO:0001228 while ZNF140 has
  IDA for GO:0001227), and effector-domain content. One clearly diverged group is
  documented in the cached PAINT slice itself: node PTN008615686 (taxon 32525, Theria),
  seeded by human ZNF445 (UniProtKB:P59923, subfamily PTHR24381:SF435 per its UniProt
  cross-reference) and mouse Zfp445 (MGI:2143340), carries IBDs for double-stranded
  methylated DNA binding (GO:0010385) and imprinting-related processes, together with an
  IRD row negating GO:0000976 (transcription cis-regulatory region binding) inherited
  from ancestor node PTN009094639. So cis-regulatory-region binding terms are widespread
  but demonstrably not family-wide, while nucleus and the direction-agnostic TF terms
  have no documented counterexample.
reference_protein:
  id: UniProtKB:Q96RE9
  label: Zinc finger protein 300
  gene_symbol: ZNF300
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR24381:SF440
    label: OOCYTE ZINC FINGER PROTEIN XLCOF7.1-LIKE
    description: >-
      A Xenopus expansion of oocyte/gastrula-type zinc finger proteins (the XlCOF/XlCGF
      class first described in Xenopus laevis oocytes and gastrulae). Members are compact
      proteins consisting almost entirely of a tandem C2H2 array with no KRAB, SCAN, or
      BTB effector domain, so regulatory direction cannot be inferred from sequence. The
      Xenopus tropicalis protein A0A8J0SCI2 (LOC101732730, "gastrula zinc finger protein
      XlCGF17.1-like", 8 tandem C2H2 fingers spanning residues 37-260 of 265) belongs
      here by its UniProt PANTHER cross-reference, alongside the X. laevis oocyte zinc
      finger protein XlCOF7.2 (UniProtKB:P18752, the SF440 member present in the cached
      entries slice).
    representative_members:
      - id: UniProtKB:A0A8J0SCI2
        label: Gastrula zinc finger protein XlCGF17.1-like
        organism: Xenopus tropicalis
        gene_review: genes/XENTR/A0A8J0SCI2/A0A8J0SCI2-ai-review.yaml
      - id: UniProtKB:P18752
        label: Oocyte zinc finger protein XlCOF7.2
        organism: Xenopus laevis
    diverged_from_family: false

