      - {id: UniProtKB:Q9HCX3, label: ZNF304, organism: Homo sapiens}
    assessment: SOUND
    assessment_reason: >-
      The process counterpart of the GO:0000981 assertion at the same node, seeded by 13
      experimentally annotated members. Spot checks in QuickGO: ZNF300 has IDA
      GO:0045944 (positive regulation, PMID:20585888), ZNF140 has IDA GO:0000122
      (negative regulation, PMID:11470777 and PMID:7649249), and Zfp932 has IDA
      GO:0000122 (PMID:21177534, PMID:22391310) - all descendants of GO:0006357, again
      spanning both regulatory directions, so the direction-neutral parent is the
      correct level for the node. Consistent with the family's conserved architecture
      and with the molecular-function assertion assessed above.

term_assessments:
  - assessed_term:
      id: GO:0005634
      label: nucleus
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member is a tandem C2H2 zinc-finger protein whose shared function is binding
      genomic DNA; nuclear localization follows from the architecture and no diverged,
      non-nuclear branch is documented in the cached family data. PAINT asserts the term
      at many separate nodes across the family with no negating IRD anywhere in the
      cached slice.
    supported_by:
      - reference_id: file:genes/XENTR/A0A8J0SCI2/A0A8J0SCI2-uniprot.txt
        supporting_text: DR   InterPro; IPR013087; Znf_C2H2_type.
  - assessed_term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    scope: FAMILY_WIDE
    scope_reason: >-
      The direction-agnostic TF activity term is the family's generic tier of molecular
      function and holds even for the documented diverged branch (the ZNF445 clade still
      acts as a DNA-binding transcription regulator; what changed there is the DNA
      target class, not the possession of TF activity). The directional children
      GO:0001227/GO:0001228 are NOT family-wide - the family holds verified activators
      and repressors side by side - and PAINT correctly confines them to narrower nodes.
  - assessed_term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    scope: FAMILY_WIDE
    scope_reason: >-
      Process counterpart of GO:0000981; safe at the direction-neutral parent level for
      the same reasons, with experimentally verified positive and negative regulators
      both present among the PAINT seeds. Positive/negative child terms must stay on
      narrower clades.
    supported_by:
      - reference_id: file:genes/XENTR/A0A8J0SCI2/A0A8J0SCI2-uniprot.txt
        supporting_text: DR   InterPro; IPR013087; Znf_C2H2_type.
  - assessed_term:
      id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    scope: UNRESOLVED
    scope_reason: >-
      Two things are established, but they do not add up to a family-level scope. First,
      the term is demonstrably NOT family-wide: the cached PAINT slice itself negates
      the ancestor binding term GO:0000976 for the ZNF445 clade (IRD at PTN008615686,
      Theria), whose members bind methylated imprinting-control regions (IBD GO:0010385
      at the same node) rather than ordinary cis-regulatory elements. Second, the term
      is safe where PAINT asserted it and the descendant retains the intact tandem-C2H2
      architecture - PAINT asserts GO:0000978 at eight separate nodes in this family,
      and the PTN001225435 assertion backing the X. tropicalis target is assessed SOUND
      above. A SUBFAMILY_ONLY scope was originally recorded here naming the target's
      cached subfamily PTHR24381:SF440, but the refreshed member index (current PANTHER
      release) reclassifies both intended SF440 representatives out of this family
      entirely (A0A8J0SCI2 to PTHR24377:SF929, P18752 to PTHR23226:SF391) - release
      drift against the cached UniProt cross-reference - so no subfamily list can be
      honestly asserted and the family-level scope is left UNRESOLVED. Per-member
      safety judgments should rest on the node assessments, not on a subfamily
      enumeration this review could not establish.

  - assessed_term:
      id: GO:0001228
      label: DNA-binding transcription activator activity, RNA polymerase II-specific
    scope: UNRESOLVED
    scope_reason: >-
      Imported from the parallel #2990 review in the 2026-09-15 merge and recorded
      machine-readably; this review's own evidence sharpens the reason. The directional
      activator child is demonstrably not family-wide: among the seeds of the single
      family-backbone node PTN001225435, ZNF300 carries IDA for this term while ZNF140
      carries IDA for the repressor sibling GO:0001227, which is exactly why PAINT
      asserts the direction-agnostic parent GO:0000981 at that node and confines the
      directional children to narrower clades. The set of subfamilies where the
      activator term is safe cannot be enumerated from the data this review inspected,
      so the family-level scope stays UNRESOLVED; per-member direction must come from
      member-specific evidence.

  - assessed_term:
      id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
    scope: UNRESOLVED
    scope_reason: >-
      Mirror of the GO:0001228 assessment: the repressor child is likewise demonstrably
      not family-wide (ZNF300 is an IDA-verified activator among the PTN001225435
      seeds), PAINT confines it to narrower clades, and no safe subfamily set can be
      enumerated from the inspected data, so the family-level scope is UNRESOLVED and
      direction is a per-member question.

