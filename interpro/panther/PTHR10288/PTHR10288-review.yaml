family_id: PANTHER:PTHR10288
family_name: KH DOMAIN CONTAINING RNA BINDING PROTEIN
preferred_name: KH domain-containing RNA-binding proteins
summary: >-
  PTHR10288 groups proteins with K-homology RNA-binding domains. The plant clade assessed here includes
  Arabidopsis KHZ1, a CCCH zinc-finger and KH-domain protein that binds RNA, localises to the nucleus
  and regulates flowering and senescence.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The KH domain binds nucleic acid in all members, but members act in different RNA processing pathways.
