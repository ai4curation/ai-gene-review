    label: Embryophyta
  assessment: LOSS_CONTRADICTED
  proposed_action:
    paint_action: REMOVE_LOSS
  assessment_reason: >-
    PTN002568487 is a land-plant KH-domain clade (225 leaves) that includes Arabidopsis KHZ1 (At3g12130,
    SF273), At2g25970, At4g10070 and At1g33680. KHZ1 and KHZ2 localise to the nucleus, have transactivation
    activity and bind RNA (PMID:29076025), and they regulate FLC splicing in the autonomous flowering
    pathway. A loss of nucleus at the root of this clade is contradicted.
