family_id: PANTHER:PTHR48162
family_name: YALI0A06930P
summary: This sparse grouping contains the divergent fly uL1-like protein CG13096 and varicella-zoster-virus
  UL47/ORF11 tegument proteins. The shared L1-like domain suggests an RNA-contact architecture, but does
  not establish a common ribosomal, viral or transport mechanism across these proteins.
functional_coherence: UNKNOWN
coherence_reason: The actual SF1 member inventory places fly CG13096 alongside VZV ORF11 proteins P09263
  and Q4JQW4. Direct ORF11 characterization establishes a viral tegument context (PMID:21276599), which
  cannot be transferred to a fly cellular protein. Conversely an L1-like domain does not demonstrate incorporation
  of CG13096 into the large ribosomal subunit. The exact benchmark accession H0RNN8 and the separately
  listed Q9VLK2 are not interchangeable sequence identifiers. A conserved molecular role remains unresolved
  because the available experiments and domain classification do not bridge these very different protein
  contexts.
