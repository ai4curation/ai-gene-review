  name:
    name: Fungal secreted metalloproteinases M35
    short: Fungal_M35_metalloproteases
  description:
  - text: The peptidase M35 family comprises secreted metalloproteinases that are
      involved in the assimilation of proteinaceous substrates. They exhibit high
      activity on basic nuclear substrates, such as histones and protamines, which
      suggests a role in processing nuclear proteins. Members of the family are implicated
      in virulence, indicating a potential contribution to the pathogenicity of the
      organisms that produce them. The proteolytic activity of these enzymes is typically
      regulated by metal ions and can be inhibited by chelating agents, highlighting
      their dependence on metal cofactors for function.
