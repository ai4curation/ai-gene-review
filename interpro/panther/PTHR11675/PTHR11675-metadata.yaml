  name:
    name: Polypeptide N-acetylgalactosaminyltransferase
    short: GalNAc-T
  description:
  - text: The GalNAc-T family of enzymes are responsible for the initiation of mucin-type
      O-linked glycosylation, a post-translational modification process where N-acetyl-D-galactosamine
      (GalNAc) is transferred to serine or threonine residues on proteins. This modification
      is crucial for the function and stability of many glycoproteins, influencing
      cell adhesion, signal transduction, and immune response. Family members exhibit
      a broad substrate specificity, acting on various peptides including mucins,
      fibronectin, and growth factors like FGF23. Some enzymes in this family also
      require a pre-existing GalNAc residue on peptides to add additional GalNAc moieties,
      while others can glycosylate unmodified peptides. The family's activity is essential
      for proper development and function of multiple tissues and organs, including
      the digestive system, nervous system, and immune cells.
