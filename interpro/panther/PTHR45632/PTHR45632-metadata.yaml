  name:
    name: Kelch-like and N-acetylneuraminate epimerase
    short: Kelch-like/NanM
  description:
  - text: The Kelch-like protein family includes substrate-specific adapters for E3
      ubiquitin ligase complexes, which mediate ubiquitination and proteasomal degradation
      of target proteins, regulating various cellular processes such as mitotic progression,
      cytokinesis, and cell growth. Some family members are involved in the oxidative
      stress response by targeting NFE2L2/NRF2 for ubiquitination. Others play roles
      in skeletal muscle development, actin cytoskeleton organization, and amino acid-sensing
      pathways. Additionally, the NanM subfamily members are involved in the epimerization
      of N-acetylneuraminic acid, which may help certain bacteria compete for limited
      resources and modulate host responses.
