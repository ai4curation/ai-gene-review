  assessment_reason: >-
    PTN008492157 is the bilaterian class IIb HDAC clade (42 leaves: HDAC6 SF21, HDAC10 SF43, invertebrate
    HDAC6 SF38). The conflicting IDA rows show deacetylation of histones in vitro (human, mouse and Drosophila
    HDAC6, human HDAC10), but the clade's evolved substrates are non-histone: HDAC6 deacetylates alpha-tubulin
    and other cytoplasmic proteins, and HDAC10 is a polyamine deacetylase. The HDAC6 gene review marks
    histone deacetylase activity as over-annotated for this reason. Histone deacetylation by this clade
    is real in vitro activity of unclear physiological relevance, so the loss of histone deacetylase activity
    as a function is supported.
