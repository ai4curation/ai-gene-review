family_id: PANTHER:PTHR10625
family_name: HISTONE DEACETYLASE HDAC1-RELATED
preferred_name: Zinc-dependent histone deacetylase family (class I and class II HDACs)
summary: >-
  PTHR10625 contains the zinc-dependent lysine deacetylases, from class I nuclear histone deacetylases
  (HDAC1-like) to the class IIb enzymes HDAC6 and HDAC10. Class I enzymes deacetylate histones within
  corepressor complexes. HDAC6 is mainly cytoplasmic and deacetylates non-histone substrates such as alpha-tubulin,
  and HDAC10 is a polyamine deacetylase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Deacetylase chemistry is conserved, but substrate and compartment differ: class I enzymes are nuclear
  histone deacetylases in corepressor complexes, while the class IIb HDAC6/HDAC10 clade works mainly on
  non-histone substrates in the cytoplasm.
