  assessment_reason: >-
    The root IBD (PTN008143312, LUCA) is defensible for class I, class IIb and invertebrate class
    IIa enzymes, but it also descends to the vertebrate class IIa clade. In the PANTHER 19.0 tree
    the most recent common ancestor of human HDAC4 (PTN002472085), HDAC5 (PTN002472087), HDAC7
    (PTN002472083) and HDAC9 (PTN002472086) is PTN000743504, a duplication node with taxonomic
    range Euteleostomi whose 66 leaves are exactly the four vertebrate subfamilies SF33, SF28, SF42
    and SF41. Its parent, PTN008492151 (Craniata-Tunicata), adds only a Ciona protein. Vertebrate
    class IIa enzymes carry His where every other HDAC has the catalytic Tyr (His976 in HDAC4). A
    bacterially expressed HDAC4 catalytic domain is about 1000-fold less active than class I HDACs,
    and the His976Tyr mutation restores activity about 1000-fold, with the same gain of function in
    HDAC5 and HDAC7. Activity measured in class IIa immunoprecipitates, which is what the HDAC4,
    HDAC5 and HDAC9 seed rows assay, comes from co-purified HDAC3 in the SMRT/N-CoR complex, to which
    class IIa HDACs contribute no activity. A local BLOSUM62 alignment to HDAC4 (UniProt canonical
    sequences, retrieved 2026-11-23; not committed) places His at the HDAC4 976 position in human
    HDAC5 (H1006, Q9UQL6 v2), HDAC7 (H843, Q8WUI4 v2) and HDAC9 (H956, Q9UKV0 v2), while the
    controls HDAC1 (Y303) and HDAC3 (Y298) align a Tyr there. Across the clade, 59 of the 60
    retrievable leaves other than HDAC4 have His. The exception is zebrafish hdac7b (A0A8M6Z193,
    unreviewed, PE 4), which has Tyr; five Felis catus leaves are no longer active UniProt entries.
    The invertebrate class IIa leaves under the bilaterian class II node PTN000065907 that lie
    outside PTN000743504 all keep the Tyr, including Drosophila HDAC4, C. elegans hda-4,
    Branchiostoma and sea urchin; the Ciona protein has Phe. The loss is therefore confined to
    PTN000743504. The HDAC4 and HDAC5 gene reviews mark the IBA row MARK_AS_OVER_ANNOTATED with
    root cause PROPAGATION_BAD at this node. Add an IRD for GO:0004407 at PTN000743504. ADD_IKR would
    also fit, because the loss rests on a named residue; IRD is requested because the
    reduced-activity and HDAC3 co-purification evidence goes beyond the residue.
