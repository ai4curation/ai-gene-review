      from those of the native enzyme purified from human erythrocytes.
  - &id003
    reference_id: PMID:15117945
    supporting_text: Confocal fluorescence microscopy indicates that the mitochondrially targeted form of glyoxalase
      II is directed to the mitochondrial matrix.
  - &id004
