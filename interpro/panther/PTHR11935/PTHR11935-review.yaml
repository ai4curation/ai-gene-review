notes: Benchmark representatives and subfamily identifiers are verified against the frozen UniProt records
  and PANTHER vocabulary. The summary distinguishes family classification from biological evidence. No
  PAINT ancestral-node placement is asserted without a tree-based assessment, and no catalytic-residue
  loss is inferred from a short or incomplete input sequence.
term_assessments:
- assessed_term:
    id: GO:0004416
    label: hydroxyacylglutathione hydrolase activity
  scope: UNRESOLVED
  scope_reason: HAGH is a genuine positive enzyme example, whereas PNKD-L has very low residual activity
    and fails physiological complementation of HAGH. A family-wide substrate grant is therefore unsafe.
    The complete set of substrate-competent branches is not established; low residual in-vitro turnover
    is not equivalent to absolute catalytic loss.
  supported_by:
  - reference_id: PMID:21487022
    supporting_text: PNKD-L has extremely low but consistent SLG hydrolysis activity
  - reference_id: PMID:21487022
    supporting_text: introduction of a human PNKD-L transgene into the same null background shows no rescue
      of SLG metabolism
