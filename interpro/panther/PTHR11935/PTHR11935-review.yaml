family_id: PANTHER:PTHR11935
family_name: BETA LACTAMASE DOMAIN
preferred_name: Eukaryotic glyoxalase II (HAGH/GLO2) and PNKD-related metallo-beta-lactamase family
summary: Metallo-beta-lactamase-fold thiolesterases of eukaryotes. The hydroxyacylglutathione hydrolase branches
  (vertebrate HAGH in SF80; fungal GLO2/GLO4, plant cytoplasmic GLX2-2, Dictyostelium and other eukaryotic glyoxalase
  II in SF94) hydrolyse (R)-S-lactoylglutathione to D-lactate and glutathione, the second step of methylglyoxal
  detoxification, in the cytosol and, through separate genes (yeast GLO4) or alternative translation initiation
  (vertebrate HAGH), in the mitochondrial matrix. The family also holds divergent PNKD proteins, whose long isoform
  shows only very low S-lactoylglutathione turnover and fails to restore its metabolism in a fly HAGH-null background,
  and uncharacterised HAGHL proteins. Bacterial GloB is a separate family (PTHR43705).
functional_coherence: HETEROGENEOUS
coherence_reason: The PNKD study (PMID:21487022) directly compares purified HAGH and PNKD-L and tests transgenic
  complementation. Low residual in vitro activity does not establish physiological S-lactoylglutathione metabolism.
  Rat Pnkd belongs to the PNKD-related subfamily, making this a specific ortholog-supported warning against glyoxalase-II
  substrate transfer, rather than a claim that all catalytic activity has been lost. Within the family, the glyoxalase
  II activity is directly demonstrated for human HAGH (SF80) and yeast Glo2p/Glo4p (SF94), while SF116 (PNKD) has
  diverged and SF77 (HAGHL) is uncharacterised, so the activity is a subfamily property, not a family-wide one.
