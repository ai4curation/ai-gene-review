family_id: PANTHER:PTHR11935
family_name: BETA LACTAMASE DOMAIN
summary: Glyoxalase-II-related metallohydrolases include hydroxyacylglutathione hydrolases and divergent
  PNKD proteins. Classical glyoxalase II hydrolyzes S-lactoylglutathione in methylglyoxal detoxification.
  Human PNKD-L shows very low turnover of this substrate and fails to restore its metabolism in a fly
  HAGH-null background, establishing a functional boundary despite the related fold.
functional_coherence: HETEROGENEOUS
coherence_reason: The PNKD study (PMID:21487022) directly compares purified HAGH and PNKD-L and tests
  transgenic complementation. Low residual in vitro activity does not establish physiological S-lactoylglutathione
  metabolism. Rat Pnkd belongs to the PNKD-related subfamily, making this a specific ortholog-supported
  warning against glyoxalase-II substrate transfer, rather than a claim that all catalytic activity has
  been lost.
subfamilies:
- subfamily_id: PANTHER:PTHR11935:SF116
  label: HYDROLASE PNKD-RELATED
  description: PANTHER separates PNKD-related proteins from hydroxyacylglutathione-hydrolase branches.
    Rat Pnkd is an appropriate substrate-divergence comparison, but neither the family name nor conservation
    of a metal-binding fold proves S-lactoylglutathione hydrolysis. Absence of an established substrate
    must remain distinct from experimentally demonstrated catalytic inactivity. The selected B4F7D2 product
    retains the entire 163-residue annotated domain relative to the longer same-gene rat product, but
    has internal and terminal differences. Long-isoform localization and synaptic effects cannot be assumed
    for it.
  representative_members:
  - id: UniProtKB:B4F7D2
    label: Pnkd protein
    gene_symbol: Pnkd
    organism: Rattus norvegicus
    gene_review: genes/rat/Pnkd/Pnkd-ai-review.yaml
