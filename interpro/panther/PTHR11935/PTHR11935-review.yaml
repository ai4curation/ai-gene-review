notes: 'Benchmark representatives and subfamily identifiers are verified against the frozen UniProt records and
  PANTHER vocabulary. The summary distinguishes family classification from biological evidence. No PAINT ancestral-node
  placement is asserted without a tree-based assessment, and no catalytic-residue loss is inferred from a short
  or incomplete input sequence. The PNKD analysis (SF116, coherence reason and the GO:0004416 PNKD evidence) is from the earlier review by codex (2026-09-10) and is kept unchanged. Updated 2026-11-11 by claude-code for the methylglyoxal detoxification module: added the glyoxalase
  II subfamilies (SF80, SF94), HAGHL (SF77), the reference protein (human HAGH) and assessments of every PAINT IBD
  row. Subfamilies SF7, SF139, SF141, SF142, SF144, SF145 and SF146 have no Swiss-Prot member in the inventory and
  were not assessed.'
