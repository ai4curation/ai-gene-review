- subfamily_id: PANTHER:PTHR11935:SF77
  label: HYDROXYACYLGLUTATHIONE HYDROLASE-LIKE PROTEIN
  description: Vertebrate HAGHL proteins (human, mouse, bovine, chicken). No activity has been measured; glyoxalase
    II activity is not granted to this subfamily.
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR11935:SF116
  label: HYDROLASE PNKD-RELATED
  description: PANTHER separates PNKD-related proteins from hydroxyacylglutathione-hydrolase branches. Rat Pnkd
    is an appropriate substrate-divergence comparison, but neither the family name nor conservation of a metal-binding
    fold proves S-lactoylglutathione hydrolysis. Absence of an established substrate must remain distinct from experimentally
    demonstrated catalytic inactivity. The selected B4F7D2 product retains the entire 163-residue annotated domain
    relative to the longer same-gene rat product, but has internal and terminal differences. Long-isoform localization
    and synaptic effects cannot be assumed for it.
  representative_members:
