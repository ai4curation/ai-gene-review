    label: hydroxyacylglutathione hydrolase activity
  scope: SUBFAMILY_ONLY
  scope_reason: Directly demonstrated for human HAGH (SF80) and yeast Glo2p and Glo4p (SF94); the S. pombe SF94
    enzymes are complete orthologs. PNKD (SF116) has very low residual activity and fails physiological complementation,
    and HAGHL (SF77) is untested, so a family-wide grant is unsafe. Low residual in-vitro turnover is not equivalent
    to absolute catalytic loss.
