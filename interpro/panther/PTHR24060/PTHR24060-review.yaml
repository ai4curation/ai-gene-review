notes: >-
  The PAINT slice was fetched with just fetch-panther-paint on 2026-11-16. Reviewed members are human GRM6 and
  GRM4; the member inventory carries no subfamily assignments, so subfamilies were taken from the PANTHER
  vocabulary by name. Which members lie below each node was read from the PTN ids on their IBA rows in QuickGO
  (2026-11-27), not from the tree. Group II members (mGluR2/3, fly mGluR, worm mgl-1) receive the more specific
  group II term from PTN002373515 and mGluR7/8 the group III term from PTN002780701/PTN002780729; mGluR4 and
  mGluR6 receive only the less specific adenylate cyclase-inhibiting term. Those nodes and the group I
  postsynaptic nodes at PTN002514246 are not on a reviewed lineage and are not assessed. BOSS's function as the
  Sevenless ligand rests on its UniProt record (P22815), which cites PMID:1857416.
