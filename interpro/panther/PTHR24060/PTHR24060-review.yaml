- assessed_term:
    id: GO:0001640
    label: adenylate cyclase inhibiting G protein-coupled glutamate receptor activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Group II and group III mGluRs inhibit adenylyl cyclase via Gi/o; group I receptors (mGluR1, SF29; mGluR5,
    SF30) couple to Gq/11 and activate phospholipase C, and Drosophila BOSS (SF175) is not a glutamate receptor.
    The term is safe for the group II and III subfamilies only. It holds for mGluR6 as a receptor activity:
    transfected mGluR6 inhibits forskolin-stimulated cAMP accumulation in CHO cells. In ON-bipolar cells mGluR6
    signals through Go to TRPM1 rather than through cyclase, which is why the GRM6 review MODIFYs the IBA to
    the parent G protein-coupled glutamate receptor activity; that is a refinement for the native context, not
    a loss, so GRM6 is not recorded as an exception. GRM4 accepts the IBA.
