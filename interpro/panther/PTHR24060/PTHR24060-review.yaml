    The seeds are group II/III receptors (human mGluR7, the rodent mGluR2/3/4/7/8 orthologs) and the Gi-coupled
    Drosophila mGluR, for which the term is right. But the node is placed at Eukaryota and its descendants
    include group I mGluR1 and mGluR5 and Drosophila BOSS, all of which receive this IBA in QuickGO. Group I
    receptors couple to Gq/11 and activate PLC, not to Gi; BOSS is a glucose-responsive Sevenless ligand, not a
    glutamate receptor. The term belongs on the group II/III clade. That clade's node cannot be named from the
    PAINT slice, so none is proposed. GRM4 accepts the IBA and GRM6 refines it to the parent receptor term; both
    are inside the correct clade.
