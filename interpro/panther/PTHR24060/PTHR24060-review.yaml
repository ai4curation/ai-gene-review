family_id: PANTHER:PTHR24060
family_name: METABOTROPIC GLUTAMATE RECEPTOR
preferred_name: Metabotropic glutamate receptor (class C GPCR) family
summary: >-
  Class C G protein-coupled receptors with a large extracellular Venus flytrap domain. The core of the family is
  the eight vertebrate metabotropic glutamate receptors in three groups: group I (mGluR1, mGluR5) couple to
  Gq/11 and activate phospholipase C; group II (mGluR2, mGluR3) and group III (mGluR4, mGluR6, mGluR7,
  mGluR8) couple to Gi/o and inhibit adenylyl cyclase. Group III mGluR6 is the postsynaptic receptor of retinal
  ON-bipolar cells, where it signals through Go to close the TRPM1 channel. Invertebrate mGluRs (Drosophila
  mGluR, C. elegans mgl-1) sit in the family, as does Drosophila Bride of sevenless (BOSS), a seven-transmembrane
  protein that acts as the ligand for the Sevenless receptor tyrosine kinase and responds to glucose.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Glutamate-activated G protein-coupled receptor signalling at the plasma membrane is shared by all the
  mGluRs. G protein coupling diverges between groups: adenylyl cyclase inhibition via Gi/o is a group II/III
  property, while group I couples to Gq/11. PAINT nevertheless places the adenylate cyclase-inhibiting term at a
  Eukaryota node from which group I mGluR1 and mGluR5 and Drosophila BOSS inherit it. BOSS is not a glutamate
  receptor; PAINT stops the glutamate signalling pathway for some non-glutamate branches with IRDs.
