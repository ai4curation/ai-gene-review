  name:
    name: Metabotropic Glutamate Receptor
    short: mGluR
  description:
  - text: The G-protein coupled receptor 3 family is characterized by its members'
      ability to act as receptors for glutamate, which upon ligand binding, undergo
      conformational changes that trigger signaling via guanine nucleotide-binding
      proteins (G proteins). The signaling pathways modulate the activity of downstream
      effectors, such as adenylate cyclase, which is commonly inhibited by these receptors.
      The family plays a crucial role in various neural processes, including synaptic
      plasticity, neural network activity modulation, and visual signal transduction.
      Some members are involved in developmental processes like axon outgrowth regulation
      and eye development. The receptors may also participate in the CNS's central
      action of glutamate, influencing long-term potentiation and depression.
