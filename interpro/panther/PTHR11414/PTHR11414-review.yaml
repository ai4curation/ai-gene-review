family_id: PANTHER:PTHR11414
family_name: CYSTATIN FAMILY MEMBER
preferred_name: Type 1 cystatin/stefin family
summary: >-
  PTHR11414 covers type-1 cystatins, also called stefins. The two reviewed human
  members, cystatin A/CSTA and cystatin B/CSTB, are small 98-residue
  intracellular inhibitors of papain-like cysteine proteases. Their conserved
  cystatin wedge binds the active-site cleft of target proteases such as papain
  and cathepsin B. CSTA has an epidermal specialization as a minor cornified
  envelope protein that protects basal and suprabasal keratinocyte adhesion,
  whereas CSTB has additional nuclear and extracellular-fluid contexts.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed human and Dictyostelium members at the PAINTed PTN000151700
  node are all type-1 cysteine-protease inhibitors; no current PAINT row
  propagates a CSTB- or CSTA-specific tissue context.
