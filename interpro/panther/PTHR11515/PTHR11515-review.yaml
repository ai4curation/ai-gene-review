notes: >-
  Curated as part of the Ligands in Signaling Pathways initiative (Tranche 4B: TSHB /
  thyroid-stimulating hormone signaling pathway GO:0038194). PAINT currently places
  GO:0042699 (follicle-stimulating hormone signaling pathway) on the FSHB clade (PTN008519417)
  and GO:0042700 (luteinizing hormone signaling pathway) on the LHB clade (PTN008972000), but
  lacks a corresponding IBD for GO:0038194 (thyroid-stimulating hormone signaling pathway) on
  the TSHB clade (PANTHER:PTHR11515:SF5).
