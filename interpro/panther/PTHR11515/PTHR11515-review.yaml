    label: thyroid-stimulating hormone signaling pathway
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Within PANTHER:PTHR11515, initiation of the thyroid-stimulating hormone signaling pathway
    (GO:0038194) via TSHR is restricted to thyrotropin subunit beta (TSHB,
    PANTHER:PTHR11515:SF5) and the ancestral thyrostimulin beta subunit GPHB5
