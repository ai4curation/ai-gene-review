family_id: PANTHER:PTHR11515
family_name: GLYCOPROTEIN HORMONE BETA CHAIN
preferred_name: Glycoprotein hormone beta subunit family
summary: >-
  Secreted cystine-knot glycoprotein hormone beta subunits (InterPro:IPR001545) that
  non-covalently heterodimerize with a shared glycoprotein hormone alpha subunit (CGA in
  jawed vertebrates, PANTHER:PTHR11509; GPA2/GPHA2 in the ancestral thyrostimulin system)
  to form active endocrine heterodimers. Whereas the common alpha subunit provides conserved
  scaffolding and receptor-activation determinants, the paralogous beta subunits confer
  strict receptor specificity across leucine-rich-repeat G protein-coupled receptors
  (PANTHER:PTHR24372): thyrotropin subunit beta (TSHB, PANTHER:PTHR11515:SF5) directs binding
  to the thyroid-stimulating hormone receptor (TSHR) to initiate the thyroid-stimulating
  hormone signaling pathway (GO:0038194); follitropin subunit beta (FSHB,
  PANTHER:PTHR11515:SF17) directs binding to FSHR in the follicle-stimulating hormone
  signaling pathway (GO:0042699); lutropin/choriogonadotropin beta subunits (LHB and primate
  CGB paralogs, PANTHER:PTHR11515:SF11 and SF25) direct binding to LHCGR in the luteinizing
  hormone signaling pathway (GO:0042700); and glycoprotein hormone beta-5 (GPHB5,
  PANTHER:PTHR11515:SF14) pairs with GPHA2 to form thyrostimulin, an ancestral agonist of TSHR.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members of PANTHER:PTHR11515 share the core molecular function GO:0005179 (hormone
  activity), extracellular localization GO:0005576 (extracellular region), and participation
  in GO:0007186 (G protein-coupled receptor signaling pathway) as receptor-specificity-
  determining beta subunits of heterodimeric glycoprotein hormones (appropriately propagated
  from the Bilateria root node PTN000162063). However, individual beta-subunit clades trigger
  distinct downstream receptor signaling pathways and endocrine processes: TSHB (SF5) drives
  thyroid-stimulating hormone signaling (GO:0038194), FSHB (SF17) drives follicle-stimulating
  hormone signaling (GO:0042699, placed at PTN008519417), and LHB/CGB (SF11/SF25) drive
  luteinizing hormone signaling (GO:0042700, placed at PTN008972000). Notably, PAINT places
  clade-specific signaling pathways on FSHB (PTN008519417) and LHB (PTN008972000) but omits
  GO:0038194 (thyroid-stimulating hormone signaling pathway) on the TSHB clade (SF5).
