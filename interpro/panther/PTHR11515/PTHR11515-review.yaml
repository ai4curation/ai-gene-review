subfamilies:
- subfamily_id: PANTHER:PTHR11515:SF5
  label: THYROTROPIN SUBUNIT BETA
  description: >-
    Vertebrate thyrotropin (thyroid-stimulating hormone, TSH) beta subunit orthologs (TSHB).
    Synthesized in anterior pituitary thyrotrophs and non-covalently assembled with glycoprotein
    hormone alpha chain (CGA) to form biologically active heterodimeric TSH, which binds and
    activates the thyroid-stimulating hormone receptor (TSHR) on thyroid follicular cells to
    stimulate Gs/cAMP and Gq/11/phospholipase C signaling (GO:0038194) and thyroid hormone
    synthesis and secretion.
