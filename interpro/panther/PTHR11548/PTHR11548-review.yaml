notes: >-
  Subfamily placements of model-organism members come from the PANTHER 19.0 per-organism
  classification files. Which PTN nodes each member inherits from was read from the PAINT UniProt
  GAF (with/from column). No IRD or IKR rows exist in IBD.gaf for this family's nodes. Topology
  beyond what the GAF shows was not checked, because the PANTHER treeinfo service was unreachable.
  The methanogen "putative thymidylate synthase" proteins in SF1 are uncharacterized. They inherit
  TS activity, and that was neither confirmed nor refuted here. Cross-module inconsistency:
  modules/coenzyme_a_biosynthesis.yaml lists S. pombe hal3 (UniProtKB:Q9UTI7) as a representative
  member of the PPCDC family PANTHER:PTHR14359, but PANTHER 19 classifies the whole hal3 protein in
  PTHR11548:SF2, so the representative-member check will flag it there. hal3's
  phosphopantothenoylcysteine decarboxylase activity (GO:0004633) comes from its N-terminal
  Hal3-like domain and rests on its own experimental evidence (PMID:23962284). It is not a property
  of the TS family, and no PTHR11548 node should carry it. It is deliberately left out of
  term_assessments, so that hal3's gene-level annotation is not read as a family-scope violation.
