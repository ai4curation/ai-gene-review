family_id: PANTHER:PTHR11548
family_name: THYMIDYLATE SYNTHASE 1
preferred_name: ThyA-type thymidylate synthase family
summary: >-
  ThyA-type thymidylate synthases catalyse the reductive methylation of dUMP to dTMP, using
  5,10-methylenetetrahydrofolate as both the one-carbon donor and the reductant and releasing
  7,8-dihydrofolate. This is the only de novo route to thymidylate. The family spans bacteria
  (E. coli and M. tuberculosis ThyA, the two B. subtilis paralogs), fungi (S. cerevisiae CDC21),
  animals (TYMS) and the bifunctional dihydrofolate reductase-thymidylate synthase (DHFR-TS)
  proteins of plants and protists, in which a DHFR domain is fused N-terminal to the TS domain.
  Fission yeast has an unusual fusion: hal3 (SPAC15E1.04) joins a Hal3-like
  phosphopantothenoylcysteine decarboxylase (PPCDC) domain to a C-terminal TS domain, and PANTHER
  classifies the whole protein in this family (SF2). The family also holds a small number of
  phage enzymes, the dUMP hydroxymethylases of Bacillus phage SPO1 and Pseudomonas phage M6, which
  use the same chemistry to make 5-hydroxymethyl-dUMP instead of dTMP.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Thymidylate synthase activity and dTMP biosynthesis are shared by the bacterial, fungal, animal
  and plant/protist members. The exceptions are the phage dUMP hydroxymethylases (P31654 SPO1 gp29
  and P0DTK3 phage M6, both in SF1), which hydroxymethylate dUMP rather than methylating and
  reducing it. Fused domains add functions that are not family properties: DHFR activity in the
  bifunctional DHFR-TS proteins (plant SF10, SF11, SF15; Arabidopsis THY-1 and the protist DHFR-TS
  proteins sit in SF2 together with TYMS and CDC21), and PPCDC activity in S. pombe hal3 (SF2).
  Subcellular location is lineage-specific. Human TYMS and plant DHFR-TS have mitochondrial pools,
  while yeast TS has been seen at the nuclear periphery. PANTHER subfamily SF2 is mixed: it holds
  monofunctional TS (human, fly, worm, budding yeast), the S. pombe PPCDC-TS fusion, and
  bifunctional DHFR-TS of plants and protists.
