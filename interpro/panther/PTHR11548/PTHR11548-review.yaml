    id: GO:0005829
    label: cytosol
  paint_snapshot: '20210904'
  seeds:
  - id: UniProtKB:P0A884
    label: thyA
    organism: Escherichia coli
  assessment: UNRESOLVED
  assessment_reason: >-
    The only seed is E. coli ThyA. In bacteria, cytosol is simply the cell interior. The term is
    then inherited by every eukaryotic member. That fits human TYMS (the TYMS review accepts it)
    and S. pombe hal3, which has an independent HDA cytosol annotation. The S. cerevisiae CDC21
    review rejects it, because immunofluorescence places yeast TS at the nuclear periphery. A
    soluble enzyme at the cytoplasmic face of the nuclear envelope is not obviously excluded from
    the cytosol, so this is left unresolved rather than called wrong.
  supported_by:
  - reference_id: PMID:8132557
    supporting_text: immunofluorescence analysis suggests that thymidylate synthase is situated at
      the nuclear periphery
  - reference_id: file:genes/yeast/CDC21/CDC21-ai-review.yaml
    supporting_text: In yeast, TS fractionates with nuclei and is seen at the nuclear periphery, so
      a generic cytosol location is not supported for Cdc21p.
