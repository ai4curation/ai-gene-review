  assessment_reason: >-
    The node is the eukaryotic TS clade, so every eukaryotic member inherits a mitochondrial
    location: TYMS, fly Ts, worm tyms-1, CDC21, Candida TMP1, S. pombe hal3, and the plant
    DHFR-TS proteins. The seeds come from three distant lineages (mammals, plants,
    kinetoplastids), which formally supports a deep node. But how a mitochondrial pool arises
    differs between them, and there is no fungal evidence. The CDC21 and hal3 gene reviews both
    mark the IBA as over-annotated, noting that needing TS for mtDNA synthesis does not require TS
    to be in the mitochondrion. No experiment shows that fungal TS is absent from mitochondria
    either, so an IRD at the fungal clade cannot be justified yet. Left unresolved, and the fungal
    reviews' MARK_AS_OVER_ANNOTATED calls stand.
