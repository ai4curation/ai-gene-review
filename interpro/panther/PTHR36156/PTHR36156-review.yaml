family_id: PANTHER:PTHR36156
family_name: SLR2101 PROTEIN
preferred_name: OryJ/VirC-like cupin protein family
summary: >-
  PTHR36156 groups small cupin type-2 (RmlC-like jelly-roll) proteins of the
  OryJ/VirC-like group. Its reviewed members are fungal proteins encoded in
  secondary-metabolite gene clusters (VirC, FogC, SrdB, SrdD, RusC, PhomC,
  OryJ), several named cupin-domain-containing oxidoreductases. Bacterial
  members include the FdeH proteins of fde naringenin-degradation loci
  (Hsero_1010, PP_3204), which KEGG co-assigns with the FdeC dioxygenase to
  A-ring cleavage. No catalytic activity has been established for any member.
functional_coherence: UNKNOWN
coherence_reason: >-
  All members share the cupin type-2 fold, but the nine reviewed members are
  named from cluster context ("biosynthesis cluster protein",
  "cupin-domain-containing oxidoreductase") rather than from assays, and the
  bacterial FdeH proteins are uncharacterized. Whether members are catalysts,
  metal-binding accessory proteins or structural partners is unresolved.
