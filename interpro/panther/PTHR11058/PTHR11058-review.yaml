family_id: PANTHER:PTHR11058
family_name: NADH-UBIQUINONE OXIDOREDUCTASE CHAIN 3
preferred_name: Complex I / NDH-1 subunit A family (NuoA / mitochondrial ND3 / plastid NdhC)
summary: >-
  Small membrane subunit family of the proton-pumping NADH:quinone oxidoreductases:
  bacterial NuoA, mitochondrial ND3, and the plastid-encoded NdhC of the chloroplast NDH
  complex. Bacterial and mitochondrial members are respiratory, reducing ubiquinone in
  NDH-1 or respiratory complex I. The plastid NdhC clade belongs to the thylakoid
  NAD(P)H dehydrogenase complex (GO:0010598), which runs photosynthetic cyclic electron
  flow around photosystem I and chlororespiration and reduces plastoquinone. The
  compartment-neutral complex term (NADH dehydrogenase complex) is true family-wide; the
  ubiquinone-specific activity term is not.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Respiratory members (NuoA, ND3) act in bacterial NDH-1 or mitochondrial respiratory
  complex I on ubiquinone; the plastid NdhC clade acts in the thylakoid NDH complex on
  plastoquinone in photosynthetic cyclic electron flow. The main subfamily SF9 in the
  fetched slice contains both mitochondrial ND3-type and chloroplastic NdhC members, so
  the boundary is a clade within a subfamily, not a subfamily.
reference_protein:
  id: UniProtKB:P0AFC3
  label: NADH-quinone oxidoreductase subunit A
  gene_symbol: nuoA
  organism: Escherichia coli (strain K12)
  gene_review: genes/ECOLI/nuoA/nuoA-ai-review.yaml

subfamilies:
  - subfamily_id: PANTHER:PTHR11058:SF21
    label: NADH-QUINONE OXIDOREDUCTASE SUBUNIT A
    description: >-
      Bacterial NuoA subfamily (103 fetched entries, predominantly proteobacterial:
      Pseudomonas, Salmonella, Escherichia, Yersinia, Shigella, Rhodopseudomonas,
      Acinetobacter), containing E. coli NuoA (P0AFC3) and P. putida KT2440 NuoA
      (Q88FH7). Members are the small three-helix membrane subunit of respiratory
      NDH-1 that stabilises the peripheral-arm/membrane-arm interface and lines the
      N/K/J/A proton channel. SF21 does not diverge from the family's respiratory core:
      it contains no plastid NdhC members (those sit in SF9 with mitochondrial ND3), so
      the ubiquinone-specific activity and complex I membership inherited by SF21
      members are correct for them.
    diverged_from_family: false
    representative_members:
      - id: UniProtKB:P0AFC3
        label: NADH-quinone oxidoreductase subunit A
        gene_symbol: nuoA
        organism: Escherichia coli (strain K12)
        gene_review: genes/ECOLI/nuoA/nuoA-ai-review.yaml
      - id: UniProtKB:Q88FH7
        label: NADH-quinone oxidoreductase subunit A
        gene_symbol: nuoA
        organism: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
        gene_review: genes/PSEPK/nuoA/nuoA-ai-review.yaml

