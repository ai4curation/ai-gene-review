    assessment: SOUND
    assessment_reason: >-
      The compartment-neutral complex term is true for every descendant: bacterial
      NDH-1, mitochondrial complex I and the plastid NDH complex are all NADH
      dehydrogenase complexes. The poplar ndhC review narrows its inherited IBA to the
      plastoquinone-specific child GO:0010598 as a granularity improvement, which is
      consistent with this placement being correct.
  - node_id: PANTHER:PTN000114844
    asserted_term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    evidence: IBD
    paint_snapshot: "20230602"
    seeds:
      - id: UniProtKB:P03897
        label: NADH-ubiquinone oxidoreductase chain 3
        organism: Homo sapiens
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Ubiquinone is the acceptor only in the respiratory clades; the plastid NDH complex
      reduces plastoquinone, so the ubiquinone-specific activity term must not descend
      into the plastid NdhC clade (poplar ndhC receives this IBA-derived term and its
      review keeps the chemistry via the broader quinone-acceptor term GO:0016655). No
      affected subfamily is named because SF9 contains both the respiratory and plastid
      members; pruning must happen at the plastid clade.
