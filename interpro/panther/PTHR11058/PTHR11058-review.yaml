        label: NADH-ubiquinone oxidoreductase chain 3
        organism: Homo sapiens
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Ubiquinone is the acceptor only in the respiratory clades; the plastid NDH complex
      reduces plastoquinone, so the ubiquinone-specific activity term must not descend
      into the plastid NdhC clade (poplar ndhC receives this IBA-derived term and its
      review keeps the chemistry via the broader quinone-acceptor term GO:0016655). No
      affected subfamily is named because SF9 contains both the respiratory and plastid
      members; pruning must happen at the plastid clade.
