family_id: PANTHER:PTHR12951
family_name: RETINAL PROTEIN 4
preferred_name: PDE6D/UNC119 myristoyl-binding carrier family
summary: >-
  PTHR12951 contains UNC119 myristoyl-binding cargo carriers. Vertebrate
  UNC119A and UNC119B share a C-terminal immunoglobulin-like beta-sandwich that
  binds N-terminally acylated or myristoylated cargo proteins, but their
  divergent N termini and localizations separate their cellular roles: UNC119A
  is a centrosomal, mitotic and Src-family kinase adaptor in addition to
  carrying retinal G-protein cargo, while UNC119B is the transition-zone/ciliary
  ARL3 effector that carries myristoylated cargo such as NPHP3 and CYS1 to the
  primary cilium.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family-wide lipid-binding pocket and lipidated-cargo transport function
  are coherent across the reviewed UNC119 branches. Vertebrate subfunctionalization
  separates ciliary targeting, which is retained by UNC119B/SF3 and excluded
  from UNC119A/SF5 by existing PAINT IRDs, from the UNC119A/SF5 cytokinesis and
  Src-family kinase signaling branch.
