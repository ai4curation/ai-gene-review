  name:
    name: PDE6D/unc-119 myristoyl-binding
    short: PDE6D_unc-119_myristoyl-bd
  description:
  - text: The PDE6D/unc-119 family consists of myristoyl-binding proteins that function
      as cargo adapters, specifically interacting with the myristoyl moiety of a subset
      of N-terminally myristoylated proteins to facilitate their correct localization.
      Members of the family adopt an immunoglobulin-like beta-sandwich fold with a
      hydrophobic cavity essential for myristate binding. The family plays a crucial
      role in various cellular processes, including synaptic functions in photoreceptor
      cells, signal transduction in immune cells, endosome recycling, bacterial uptake,
      endocytosis, protein trafficking in sensory neurons, and lipid-binding chaperone
      activity. They are also involved in G-protein localization and trafficking in
      sensory neurons, mediating Src family kinase signals for cytokinesis, and the
      localization of proteins to the primary cilium membrane.
