family_id: PANTHER:PTHR38710
family_name: WITH PUTATIVE URIDYL PYROPHOSPHORYLASE-RELATED
preferred_name: Plant glucuronokinases
summary: Glucuronokinases use ATP to phosphorylate glucuronic acid in a route for recycling uronic acids
  into nucleotide-sugar metabolism. They have GHMP-kinase architecture rather than the reaction implied
  by a uridyl-pyrophosphorylase name.
functional_coherence: COHERENT
coherence_reason: The wheat target has both GHMP-kinase regions and glucuronokinase-family placement.
  Biochemical ATP-dependent phosphate donation supports phosphorylation as a conserved reaction class;
  a complete substrate-specific assignment should retain the glucuronic-acid context.
