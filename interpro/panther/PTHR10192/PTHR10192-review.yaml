family_id: PANTHER:PTHR10192
family_name: MOLYBDOPTERIN BIOSYNTHESIS PROTEIN
preferred_name: MoeA/gephyrin molybdopterin molybdotransferase family
summary: PTHR10192 contains MoeA-type molybdopterin molybdotransferases, which insert molybdate into
  adenylyl-molybdopterin and release AMP to form the Mo-molybdopterin cofactor. Bacterial MoeA proteins
  act alone. Eukaryotic members (plant CNX1, insect cinnamon, metazoan gephyrin) fuse the MoeA region
  to a MogA-type adenylyltransferase region and catalyse both final steps. Metazoan gephyrin has also
  acquired a scaffolding role, clustering glycine and GABA-A receptors at inhibitory synapses.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Every frozen entry is a MoeA, gephyrin, CNX1, cinnamon or archaeal MoeA-like protein.
  The PAINT root PTN000022760 asserts the molybdotransferase activity with no loss rows. The archaeal
  SF19 member MJ0666 is only putatively assigned to molybdopterin biosynthesis. The synaptic functions
  are a metazoan gain at PTN000022764, not a family-wide property.
