notes: >-
  PAINT: `just fetch-panther-paint PTHR43643` resolved 61 PTN nodes and found no node-level
  annotations, so there is no paint.tsv and no node_assessments. P. putida hisC receives no IBA.
  panther.obo also defines PTHR43643:SF2 (INDUCIBLE LYSINE DECARBOXYLASE) and SF5 (CONSTITUTIVE
  LYSINE DECARBOXYLASE), but entries.csv lists no reviewed member in either. Their names are not
  backed by any reviewed sequence here, and they are not assessed. Counts (237 SF3, of which 31
  are Pat; 31 SF6) are from the reviewed members in entries.csv. Bacterial HisC is split across
  PANTHER families: E. coli HisC and most actinobacterial HisC sit in PTHR42885:SF2. The
  histidine_biosynthesis module therefore anchors the HisC step on InterPro IPR005861.
