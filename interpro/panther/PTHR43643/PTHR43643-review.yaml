  - reference_id: file:genes/PSEPK/hisC/hisC-uniprot.txt
    supporting_text: >-
      Belongs to the class-II pyridoxal-phosphate-dependent aminotransferase family.
      Histidinol-phosphate aminotransferase subfamily.
  - reference_id: PMID:26738801
