    id: GO:0000105
    label: L-histidine biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Follows the transaminase activity: SF3 and SF6 HisC enzymes carry out the seventh step of
    histidine synthesis. The Pat aromatic amino acid aminotransferases are excepted for the same
    reasons as for the activity.
  applicable_subfamilies:
  - id: PANTHER:PTHR43643:SF3
    label: HISTIDINOL-PHOSPHATE AMINOTRANSFERASE
  - id: PANTHER:PTHR43643:SF6
    label: HISTIDINOL-PHOSPHATE AMINOTRANSFERASE
  supported_by:
  - reference_id: file:genes/PSEPK/hisC/hisC-uniprot.txt
    supporting_text: HAMAP; MF_01023; HisC_aminotrans_2; 1.
  - reference_id: PMID:38698289
    supporting_text: >-
      HspAT, an essential enzyme for biosynthesis of histidine, catalyzes the transfer of an amino
      group from L-histidinol phosphate (Hsp) to 2-oxoglutarate
  member_exceptions: *patexc
- assessed_term:
    id: GO:0008793
    label: aromatic-amino-acid:2-oxoglutarate transaminase activity
  scope: UNRESOLVED
  scope_reason: >-
    Shown for M. tuberculosis Pat (SF3), which prefers phenylalanine, and assigned to the
    actinobacterial Pat (HAMAP MF_01513) members. Those members share SF3 with HisC enzymes, so
    the activity cannot be scoped to a subfamily. HisC enzymes can also transaminate aromatic
    amino acids as a side activity, but that is not their function. The term is a member-level
    property of the Pat group.
  supported_by:
  - reference_id: PMID:26738801
    supporting_text: >-
      the hydrophobic nature of both the substrate binding pocket and the N-terminal lid of mArAT
      is responsible for the discrimination of a polar substrate such as Hsp, while facilitating
      the binding of Phe and other aromatic residues such as Tyr and Trp.
- assessed_term:
    id: GO:0030170
    label: pyridoxal phosphate binding
  scope: FAMILY_WIDE
  scope_reason: >-
    HisC and Pat members are all fold-type I PLP-dependent class-II aminotransferases with the
    PROSITE AA_TRANSFER_CLASS_2 PLP signature.
  supported_by:
  - reference_id: file:genes/PSEPK/hisC/hisC-uniprot.txt
    supporting_text: PROSITE; PS00599; AA_TRANSFER_CLASS_2; 1.
  - reference_id: PMID:26738801
    supporting_text: >-
      Aminotransferases of subfamily Iβ, which include histidinol phosphate aminotransferases
      (HspATs) and aromatic amino acid aminotransferases (ArATs), are structurally similar but
      possess distinct substrate specificities.
