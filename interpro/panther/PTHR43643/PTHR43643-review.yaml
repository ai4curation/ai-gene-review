  description: >-
    237 reviewed members. 206 are HisC histidinol-phosphate aminotransferases from Firmicutes,
    Proteobacteria (including P. putida hisC and C. jejuni Cj0317), Thermotogae and others. 31 are
    actinobacterial Pat aromatic amino acid aminotransferases (Mycobacterium, Corynebacterium,
    Rhodococcus, Streptomyces and others).
