family_id: PANTHER:PTHR43643
family_name: HISTIDINOL-PHOSPHATE AMINOTRANSFERASE 2
preferred_name: Histidinol-phosphate aminotransferase 2 (bacterial/archaeal HisC and actinobacterial Pat) family
summary: >-
  Fold-type I (class-II aminotransferase) pyridoxal 5'-phosphate enzymes. Most reviewed members are
  bacterial and archaeal histidinol-phosphate aminotransferases (HisC, HAMAP MF_01023), which
  transfer the amino group of L-glutamate to imidazole-acetol phosphate to give L-histidinol
  phosphate in the seventh step of histidine synthesis. Examples are Pseudomonas putida hisC,
  Bacillus subtilis HisC and Campylobacter jejuni Cj0317. SF3 also contains the actinobacterial Pat
  enzymes (HAMAP MF_01513), aromatic amino acid aminotransferases that have taken over the
  phenylalanine/tyrosine transamination step. The characterized M. tuberculosis Pat has no
  significant histidinol-phosphate activity, and nearly every Pat-containing genome among the
  reviewed members has its own HisC in the separate family PTHR42885:SF2. SF6 holds HisC from
  archaea, cyanobacteria, green sulfur bacteria and some proteobacteria. PAINT has placed no
  node-level annotation in this family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Of the 268 reviewed members, 237 (all of SF6 and most of SF3) are HisC histidinol-phosphate
  aminotransferases. The exceptions are the 31 actinobacterial Pat aromatic amino acid
  aminotransferases in SF3, which have a different substrate specificity. PANTHER does not
  separate them from HisC at the subfamily level, so they are listed as member exceptions. All
  members share PLP-dependent aminotransferase chemistry.
