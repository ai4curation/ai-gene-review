term_assessments:
- assessed_term:
    id: GO:0004400
    label: L-histidinol-phosphate:2-oxoglutarate transaminase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The histidine_biosynthesis module asserts this activity for P. putida hisC (SF3). It is the
    defining activity of both reviewed-member subfamilies, and the P. putida hisC review accepts
    it. The actinobacterial Pat members of SF3 are excepted. Their characterized representative
    discriminates against histidinol phosphate, and 27 of the 31 come from strains whose reviewed
    HisC is classified in PTHR42885:SF2.
