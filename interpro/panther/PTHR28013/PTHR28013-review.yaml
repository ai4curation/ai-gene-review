family_id: PANTHER:PTHR28013
family_name: PROTEIN DCV1-RELATED
preferred_name: Fungal PalI/Rim9 ambient-pH membrane proteins
summary: >-
  PTHR28013 contains fungal PalI/Rim9-family SUR7-domain multipass membrane
  proteins. The best-characterized SF3 members are S. cerevisiae Rim9,
  C. albicans RIM9, and Aspergillus PalI, which act upstream in fungal
  Rim101/Pal-PacC ambient-pH signaling from the plasma membrane. The family's
  plasma-membrane PAINT placement is sound across the reviewed fungal
  descendants. PAINT also places two polarized-site component terms on the same
  broad Dikarya node; those narrow sites are too broad for the short
  budding-yeast SF3 proteins and the unrelated SF6 Mug33 seed should not drive
  SF3 inheritance, while fission-yeast and filamentous-fungal PalI/Rim9
  homologs retain real polarized localizations.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  PTHR28013:SF3 contains the conserved PalI/Rim9 ambient-pH signaling branch,
  but Yan et al.'s short/long split cuts through SF3 itself: the short
  S. cerevisiae, Candida, and Eremothecium proteins sit in the same subfamily
  as long fission-yeast, Aspergillus, Neurospora, Yarrowia, and Pyricularia
  proteins. The family also contains other SUR7-domain branches, including
  S. pombe Mug33 in PTHR28013:SF6 and S. cerevisiae Tos7 in PTHR28013:SF8,
  whose functions should not be collapsed onto every Rim9 descendant.
