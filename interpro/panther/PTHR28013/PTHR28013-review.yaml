- node_id: PANTHER:PTN001997363
  asserted_term:
    id: GO:0032153
    label: cell division site
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: PomBase:SPCC1739.10
  node_taxon:
    id: NCBITaxon:451864
    label: Dikarya
  assessment: UNRESOLVED
  assessment_reason: >-
    The local PAINT row is placed at the same broad Dikarya node as the
    plasma-membrane term but is seeded only by the fission-yeast Mug33 SF6
    branch. Septal localization is independently true for S. pombe Mac1 and
    Aspergillus PalI, yet no Saccharomycotina Rim9 experiment has established
    or excluded a division-site pool. The row is therefore too narrow for
    blanket acceptance in budding yeast and Candida, but the exact loss or
    refinement point is unresolved.
  supported_by:
  - reference_id: file:interpro/panther/PTHR28013/PTHR28013-paint.tsv
    supporting_text: "PTHR28013\tPTN001997363\tGO:0032153\tC\tIBD\tfalse\tPomBase:SPCC1739.10\ttaxon:451864\t20170228"
  - reference_id: PMID:12206652
    supporting_text: >-
      We report here the identification of Mac1, a novel fission yeast protein
      that localized predominantly to the cell tips and septum.
