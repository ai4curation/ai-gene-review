  node_taxon:
    id: NCBITaxon:451864
    label: Dikarya
  assessment: UNRESOLVED
  assessment_reason: >-
    The local PAINT row is placed at the same broad Dikarya node as the
    plasma-membrane term but is seeded only by the fission-yeast Mug33 SF6
    branch. Septal localization is independently true for S. pombe Mac1 and
    Aspergillus PalI, but the Mug33-only seed set still overshoots the evidence
    for Candida and budding-yeast SF3 Rim9 descendants. The row is too narrow
    for blanket acceptance, while the exact PAINT move or pruning set remains
    unresolved.
