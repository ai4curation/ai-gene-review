    label: Dikarya
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The growing-cell-tip placement has same-subfamily support from fission
    yeast and independent filamentous-fungal corroboration from Aspergillus
    PalI, so it is not simply a Mug33 cross-subfamily artifact. However,
    S. cerevisiae Dcv1 has now been imaged away from the pheromone growth
    front, supporting a loss of the fission-yeast growing-tip localization in
    at least the short budding-yeast DCV1 branch; the C. glabrata TreeGrafter
    rows also graft to the short S. cerevisiae RIM9 leaf in the pinned tree.
  proposed_action:
