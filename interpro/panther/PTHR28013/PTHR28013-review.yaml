    label: cell division site
  scope: UNRESOLVED
  scope_reason: >-
    Septal localization is sound for S. pombe Mac1 and Aspergillus PalI, but
    the PAINT row is seeded only by SF6 Mug33 and is over-specific for
    budding-yeast and Candida SF3 Rim9 proteins.
  supported_by:
  - reference_id: file:interpro/panther/PTHR28013/PTHR28013-paint.tsv
    supporting_text: "PTHR28013\tPTN001997363\tGO:0032153\tC\tIBD\tfalse\tPomBase:SPCC1739.10\ttaxon:451864\t20170228"
- assessed_term:
    id: GO:0035838
    label: growing cell tip
  scope: UNRESOLVED
  scope_reason: >-
    S. pombe Mac1 is curated to the child GO:0035840 old growing cell tip,
    which entails GO:0035838, and Aspergillus PalI has independent hyphal-tip
    localization. However, PMID:12206652 itself reports that Mac1 does not
    specifically localize to growth sites, and S. cerevisiae Dcv1 is displaced
    from the pheromone-response growth front, so the term should be pruned from
    at least the short budding-yeast branch.
  supported_by:
  - reference_id: file:interpro/panther/PTHR28013/PTHR28013-paint.tsv
    supporting_text: "PTHR28013\tPTN001997363\tGO:0035838\tC\tIBD\tfalse\tPomBase:SPAC13G7.04c|PomBase:SPCC1739.10\ttaxon:451864\t20170228"
  - reference_id: PMID:12206652
    supporting_text: >-
      Mac1 was, nevertheless, found at both poles, thus suggesting that Mac1
      does not specifically localize to the sites of growth.
