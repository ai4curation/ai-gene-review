    Aspergillus localization experiments.
  supported_by:
  - reference_id: file:interpro/panther/PTHR28013/PTHR28013-paint.tsv
    supporting_text: "PTHR28013\tPTN001997363\tGO:0005886\tC\tIBD\tfalse\tPomBase:SPAC13G7.04c|PomBase:SPCC1739.10|SGD:S000004667|SGD:S000005379|UniProtKB:O93956\ttaxon:451864\t20230111"
- assessed_term:
