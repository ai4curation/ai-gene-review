family_id: PANTHER:PTHR28013
family_name: PROTEIN DCV1-RELATED
preferred_name: Fungal PalI/Rim9 ambient-pH membrane proteins
summary: >-
  PTHR28013 contains fungal PalI/Rim9-family SUR7-domain multipass membrane
  proteins. The best-characterized SF3 members are S. cerevisiae Rim9,
  C. albicans RIM9, and Aspergillus PalI, which act upstream in fungal
  Rim101/Pal-PacC ambient-pH signaling from the plasma membrane. The family's
  plasma-membrane PAINT placement is sound across the reviewed fungal
  descendants. PAINT also places two polarized-site component terms on the same
  broad Dikarya node; these are supported for S. pombe Mac1 and by Aspergillus
  PalI hyphal-tip and septal localization, but should remain unresolved for
  budding-yeast and Candida RIM9 proteins until their own subcellular
  distribution is tested.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  PTHR28013:SF3 contains the short PalI/Rim9 proteins that share a conserved
  plasma-membrane role in fungal ambient-pH signaling, but the family also
  contains other SUR7-domain branches, including S. pombe Mug33 in
  PTHR28013:SF6 and S. cerevisiae Tos7 in PTHR28013:SF8, whose functions
  should not be collapsed onto every Rim9 descendant.
