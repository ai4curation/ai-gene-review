family_id: PANTHER:PTHR30034
family_name: FLAGELLAR MOTOR SWITCH PROTEIN FLIM
preferred_name: FliM flagellar switch and type III secretion SpaO/YscQ family
summary: >-
  FliM is the C-ring switch protein of the bacterial flagellar motor: about 34 copies
  form the middle layer of the C ring between FliG and FliN, and its N-terminal segment
  binds phospho-CheY, which biases the motor toward clockwise rotation. The PANTHER family
  also contains the homologous sorting-platform proteins of virulence type III secretion
  injectisomes (Salmonella SpaO and SsaQ, Yersinia YscQ, Pseudomonas PscQ, rhizobial
  RhcQ), which share the C-terminal SpoA domain with FliM but have no role in flagellar
  switching or chemotaxis.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  SF3 (proteobacterial FliM, including E. coli, Salmonella, P. aeruginosa and
  P. putida KT2440) and the Firmicutes and other FliM in SF6 are flagellar switch
  proteins. SF5 (SpaO, SsaQ) and the YscQ/PscQ/RhcQ members of SF6 are injectisome
  components. SF6 is therefore itself mixed.
