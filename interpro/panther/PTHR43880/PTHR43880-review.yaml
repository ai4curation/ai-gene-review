    label: Alcohol dehydrogenase 1A
    gene_symbol: ADH1A
    organism: Homo sapiens
  diverged_from_family: true
  divergence_description: >-
    Vertebrate ethanol-active class derived from class III; no glutathione-dependent formaldehyde
