  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The root placement is defensible: every seed is a class III enzyme, class III occurs in
    bacteria, fungi, plants and animals, and it is the ancestral class from which the
    ethanol-active ADHs were derived. But the derived classes lost the glutathione-dependent
    formaldehyde chemistry, and only one of them is pruned: PAINT's IRD at the Tetrapoda node
    PTN000191662 (NOT GO:0051903) covers vertebrate class I and class V (human ADH1B and ADH6
    receive no GO:0051903 IBA). The other derived branches still inherit it. Checked in the
    PAINT UniProt GAF: plant class P ADH1 (Arabidopsis P06525, SF26), maize ADH1 (P00333, SF9),
    potato ADH1 (P14673, SF40), Arabidopsis ADH-like 6 (Q8LEB2, SF5) and human class II ADH4
    (P08319, SF14) all receive GO:0051903 and GO:0046294 from PTN000191653. IRDs are needed on
    the plant class P clade and on the vertebrate class II branch. SFA1 and the other SF12
    members are correctly covered.
  affected_subfamilies:
