    SF14 (class II ADH4), SF2 (class IV ADH7) and SF20 (class V ADH6).
  supported_by:
  - reference_id: PMID:8944774
    supporting_text: >-
      The class III structural variability is different from that of the ethanol-active enzyme
      types in both vertebrates (class I) and plants (class P), although class P conserves more
      of the class III properties than class I does.
