family_id: PANTHER:PTHR43880
family_name: ALCOHOL DEHYDROGENASE
preferred_name: Zinc medium-chain alcohol dehydrogenases, class III (glutathione-dependent formaldehyde dehydrogenase) lineage and its ethanol-active derivatives
summary: >-
  Zinc-dependent medium-chain dehydrogenase/reductase (MDR) alcohol dehydrogenases. The family is
  built around class III ADH, the glutathione-dependent formaldehyde dehydrogenase (FrmA, SFA1,
  ADH5, plant HOT5/ADH2) that oxidises S-(hydroxymethyl)glutathione and also reduces
  S-nitrosoglutathione. Class III is found in bacteria, fungi, plants and animals and is the
  ancestral form. The ethanol-active ADHs arose from it by gene duplication, independently in
  plants (class P: the hypoxia-induced fermentative ADH1/ADH2 of Arabidopsis, maize, rice, potato)
  and in vertebrates (class I liver ADH1A/1B/1C, class II ADH4, class IV ADH7, class V ADH6),
  and acquired new substrate specificities (ethanol, retinol, other primary alcohols). The
  fungal fermentative ADH1-type enzymes (S. cerevisiae ADH1, S. pombe adh1) are not in this
  family; PANTHER places them in PTHR42940.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are NAD-dependent zinc alcohol dehydrogenases, so generic alcohol dehydrogenase
  activity, zinc binding and cytosolic location are safe. The defining class III chemistry,
  glutathione-dependent formaldehyde (S-(hydroxymethyl)glutathione) oxidation, is not: it is
  retained by the class III subfamilies (SF12 bacteria and fungi, SF4 mammals, SF21 fish, SF58
  plants) but not by the duplicated ethanol-active derivatives. Those are the vertebrate class I,
  II, IV and V enzymes (SF1, SF11, SF57, SF14, SF2, SF20 and others) and the plant class P
  fermentative ADHs (SF26, SF9, SF40, SF59). Conversely, ethanol dehydrogenation is a property of
  those derived classes and is poor in class III. Subfamily boundaries follow these classes well,
  except that "ALCOHOL DEHYDROGENASE CLASS-3" is used as the name of three separate subfamilies
  (SF4, SF12, SF58).
