      alcohols and participation in metabolic conversions, for class I.
  - reference_id: PMID:9215914
    supporting_text: >-
      Plant class P ADH enzymes have gained substrate specificities and evolved promoters with
      different expression properties, in keeping with their metabolic function as part of the
      alcohol fermentation pathway.
