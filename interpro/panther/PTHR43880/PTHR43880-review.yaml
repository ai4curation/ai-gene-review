notes: >-
  Modules: glutathione_dependent_formaldehyde_detoxification (SF12, GO:0051903, GO:0046294;
  ancestral node PTN000191653) and alcoholic_fermentation (PTHR43880 as a family_term beside
  PTHR42940 for the plant zinc ADH, GO:0120542 with a required_function filter). Both uses are
  consistent with this review. Node inheritance was checked against the cached PAINT UniProt GAF
  (.cache/panther/gene_association.paint_uniprot.gaf.gz): the vertebrate class I/V clade
  receives GO:0004745 and no GO:0051903, while plant class P, Arabidopsis ADH-like proteins and
  human ADH4 still receive GO:0051903 and GO:0046294. The SFA1 gene review accepts all five IBAs
  from PTN000191653 (GO:0004022, GO:0005829, GO:0008270, GO:0046294, GO:0051903), consistent
  with SF12 being inside the class III scope. The GO:0005829 and GO:0008270 IBAs at the root are
  family-wide and not assessed further. Fungal fermentative ADH1-type enzymes are in PTHR42940,
  not here.
