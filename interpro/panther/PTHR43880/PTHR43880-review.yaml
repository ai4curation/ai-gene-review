- assessed_term:
    id: GO:0120542
    label: ethanol dehydrogenase (NAD+) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The alcoholic fermentation module lists PTHR43880 as a family_term for the plant zinc
    fermentative ADH (Arabidopsis ADH1) with a GO:0120542 required_function filter. Ethanol
    dehydrogenation belongs to the derived classes: plant class P (SF26, SF9, SF40, SF59) and the
    vertebrate class I subfamilies. Class III enzymes (SF12, SF4, SF58), including SFA1, are not
    fermentative ethanol dehydrogenases, so the family-level term must be filtered as the module
    does. The vertebrate class I subfamilies are listed for completeness; they oxidise ethanol in
    liver but are not part of fermentation.
