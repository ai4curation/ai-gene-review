family_id: PANTHER:PTHR24177
family_name: CASKIN
preferred_name: Caskin-associated family with unresolved plant placement
summary: The PANTHER family carries a Caskin name, but the benchmark member is a maize sequence. A cross-kingdom
  match needs architectural verification before the functions of animal neuronal scaffolds can be assigned
  to the plant protein.
functional_coherence: UNKNOWN
coherence_reason: The maize sequence has PGG domains rather than an experimentally established Caskin
  scaffold architecture. The PANTHER match is retained as a database relationship without assigning neuronal
  signaling, enzyme activity or a channel function. The broad molecular-function root does not resolve
  its biological activity.
