- clade_node_id: PANTHER:PTN000520794
  label: S. cerevisiae Cdc4 misplaced PAINT leaf
  description: >-
    Cdc4 is a substrate-recognition F-box protein in SCF(Cdc4), not a
    Utp13/TBL3-like SSU processome component; the leaf-level IRD should block
    the PTN000457905 Utp13/TBL3 PAINT assertions from descending to P07834.
