family_id: PANTHER:PTHR19854
family_name: TRANSDUCIN BETA-LIKE 3
preferred_name: ASTRA/GNB1L and Utp13/TBL3 WD-repeat proteins
summary: >-
  PTHR19854 contains eukaryotic WD-repeat proteins in the conserved ASTRA/GNB1L
  and Utp13/TBL3 branches. PAINT places five ribosome-biogenesis and nucleolar
  assertions on the broad Utp13/TBL3 node PTN000457905, which is supported for
  the Utp13/TBL3 descendants but also reaches a misplaced S. cerevisiae Cdc4
  leaf. Because Cdc4 is an F-box/WD40 SCF substrate receptor with no SSU
  processome or U3 snoRNA role, those assertions need an IRD at the Cdc4 leaf
  PTN000520794.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The current InterPro member snapshot cleanly separates the ASTRA/GNB1L-like
  proteins in PTHR19854:SF1 from the longer Utp13/TBL3 proteins in
  PTHR19854:SF15. The PAINT tree additionally places S. cerevisiae Cdc4 as a
  stray leaf under the fungal Utp13/TBL3 clade even though UniProt classifies
  Cdc4 in the separate F-box/WD-repeat PTHR19849:SF1 family.
