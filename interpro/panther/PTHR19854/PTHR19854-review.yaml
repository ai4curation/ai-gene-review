  assessment: NEEDS_PRUNING
  assessment_reason: &cdc4_ird_reason >-
    The PAINT assertion is placed on the Utp13/TBL3 node and is supported for
    its seed-bearing descendants, but the node also descends into the
    misclassified S. cerevisiae Cdc4 leaf PTN000520794. UniProt records Cdc4 as
    an F-box/WD-repeat PTHR19849:SF1 protein, and primary reconstitution shows
    Cdc4 acts with Skp1 as the phospho-Sic1 receptor of SCF(Cdc4), so the
    ribosome-biogenesis and nucleolar properties of Utp13/TBL3 should be
    blocked at the Cdc4 leaf rather than inherited by P07834.
