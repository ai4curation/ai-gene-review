  divergence_description: >-
    Cdc4 is misgrafted beneath the Utp13/TBL3 clade in the PAINT tree; its
    current UniProt PANTHER cross-reference is to the separate F-box/WD-repeat
    family PTHR19849:SF1.
  supported_by:
