family_id: PANTHER:PTHR43570
family_name: ALDEHYDE DEHYDROGENASE
preferred_name: ALDH3-type aldehyde dehydrogenase family
summary: >-
  Class 3 aldehyde dehydrogenases: S. cerevisiae HFD1 (fatty aldehyde and 4-hydroxybenzaldehyde oxidation
  for coenzyme Q headgroup synthesis), human ALDH3A1, ALDH3A2 (FALDH), ALDH3B1-3, bacterial CalB
  and carotenoid-aldehyde dehydrogenases.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are NAD(P)-dependent aldehyde dehydrogenases; preferred aldehydes differ by subfamily.
