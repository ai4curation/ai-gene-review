family_id: PANTHER:PTHR11136
family_name: FOLYLPOLYGLUTAMATE SYNTHASE-RELATED
preferred_name: Folylpolyglutamate synthase / dihydrofolate synthase (FolC/FOL3/MET7) family
summary: >-
  Mur-ligase-fold enzymes that add glutamate to pteroates. Dihydrofolate synthase adds the first
  glutamate to dihydropteroate (S. cerevisiae FOL3, S. pombe fol3; SF0). Folylpolyglutamate synthase
  extends the polyglutamate tail of folates (S. cerevisiae MET7, S. pombe met7, animal FPGS; SF5).
  Bacterial FolC carries out both reactions.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  In fungi the two activities are split between paralogs: monofunctional DHFS (SF0) and FPGS (SF5).
  Bacterial FolC is bifunctional and sits in SF0.
