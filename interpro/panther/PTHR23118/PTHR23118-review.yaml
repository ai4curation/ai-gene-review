family_id: PANTHER:PTHR23118
family_name: ATP-CITRATE SYNTHASE
preferred_name: ATP-citrate lyase (ACLY/ACL) family
summary: >-
  ATP-citrate lyase cleaves citrate with CoA and ATP to cytosolic acetyl-CoA and oxaloacetate, supplying
  acetyl-CoA for lipogenesis and histone acetylation in oleaginous fungi, plants and animals (S.
  pombe acl1, human ACLY). S. cerevisiae has no ACL and makes cytosolic acetyl-CoA with acetyl-CoA
  synthetase.
functional_coherence: COHERENT
coherence_reason: All members are ATP-citrate lyases (single-chain or split ACL1/ACL2).
