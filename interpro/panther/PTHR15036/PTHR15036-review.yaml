preferred_name: Pikachurin-Like Protein
summary: PIKACHURIN-LIKE PROTEIN (PANTHER:PTHR15036) is characterized in PANTHER PAINT across 8 ancestral
  PTN node(s) (PANTHER:PTN000013648, PANTHER:PTN000804946, PANTHER:PTN002227321, PANTHER:PTN002309037
  (+4 more)) with 22 IBD node assertion(s) and 0 term(s) carrying negated IRD/IKR branch blocks, covering
  synapse (GO:0045202, CC), nervous system development (GO:0007399, BP), presynaptic active zone membrane
  (GO:0048787, CC), trans-synaptic protein complex (GO:0098820, CC) and 15 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR15036 (PIKACHURIN-LIKE PROTEIN) span 8 distinct ancestral
  PTN nodes (PANTHER:PTN000013648, PANTHER:PTN000804946, PANTHER:PTN002227321, PANTHER:PTN002309037, PANTHER:PTN002687832
  (+3 more)) with different molecular function assignments across clades (transmembrane signaling receptor
  activity (GO:0004888), transmembrane receptor protein tyrosine kinase activator activity (GO:0030297),
  acetylcholine receptor regulator activity (GO:0030548), neuroligin family protein binding (GO:0097109)),
  indicating clade-level functional specialization across the family.
