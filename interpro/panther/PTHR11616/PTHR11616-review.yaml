family_id: PANTHER:PTHR11616
family_name: SODIUM/CHLORIDE DEPENDENT TRANSPORTER
preferred_name: Sodium/Chloride Dependent Transporter
summary: SODIUM/CHLORIDE DEPENDENT TRANSPORTER (PANTHER:PTHR11616) is characterized in PANTHER PAINT across
  19 ancestral PTN node(s) (PANTHER:PTN000177662, PANTHER:PTN000178374, PANTHER:PTN000746001, PANTHER:PTN000907004
  (+15 more)) with 53 IBD node assertion(s) and 1 term(s) carrying negated IRD/IKR branch blocks, covering
  plasma membrane (GO:0005886, CC), sodium ion transmembrane transport (GO:0035725, BP), norepinephrine:sodium
  symporter activity (GO:0005334, MF), axon (GO:0030424, CC) and 40 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR11616 (SODIUM/CHLORIDE DEPENDENT TRANSPORTER) span
  19 distinct ancestral PTN nodes (PANTHER:PTN000177662, PANTHER:PTN000178374, PANTHER:PTN000746001, PANTHER:PTN000907004,
  PANTHER:PTN000907238 (+14 more)) with different molecular function assignments across clades (norepinephrine:sodium
  symporter activity (GO:0005334), dopamine:sodium symporter activity (GO:0005330), amino acid:sodium
  symporter activity (GO:0005283), L-amino acid transmembrane transporter activity (GO:0015179) and 13
  additional molecular function term(s)), indicating clade-level functional specialization across the
  family.
