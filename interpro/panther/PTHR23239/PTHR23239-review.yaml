notes: 'Written alongside the human KRT9 gene review. The node assessments cover all 13 PAINT rows in
  the family snapshot (interpro/panther/PTHR23239/PTHR23239-paint.tsv). Six reach KRT9: cytoskeleton (PTN001905729),
  keratin filament, structural constituent of skin epidermis and morphogenesis of an epithelium (PTN002757528),
  and epithelial cell differentiation and intermediate filament organization (PTN008383948). There is
  no IRD or IKR on the KRT9 lineage. Seed annotations were read from QuickGO by gene product and term
  id on 2026-11-26; most seed papers were available as abstracts only, and PMID:8950218 (rat Krt14) could
  not be fetched. No family deep-research report is filed; see PTHR23239-notes.md.'
