family_id: PANTHER:PTHR23239
family_name: INTERMEDIATE FILAMENT
preferred_name: Type I (acidic) keratin and phakinin intermediate filament family
summary: 'Despite its broad PANTHER name, PTHR23239 is not the whole intermediate filament superfamily.
  Its members are the type I (acidic) keratins and one non-keratin group, phakinin (BFSP2). The PANTHER
  tree has 545 leaves, all chordate, with two amphioxus sequences outside the vertebrate node PTN001905729.
  Below that node sit the main type I keratin clade PTN002757528 (human KRT9, KRT10, KRT12 to KRT17, KRT19,
  KRT20, KRT23 to KRT28 and the hair keratins KRT31 to KRT40), a separate KRT18 clade, the phakinin clade
  and a few small fish and amphibian groups. Type II keratins, vimentin and lamins are classified in other
  PANTHER families. Type I keratins pair with type II keratins to build the keratin filaments of epithelial
  cells, and each is expressed in particular epithelia: keratin 9 in palmoplantar epidermis, keratin 10
  in suprabasal epidermis, keratin 12 in cornea, keratins 18, 19 and 20 in simple epithelia, and the hair
  keratins in hair and nail. Phakinin assembles with filensin into the beaded filament of the lens. PAINT
  asserts thirteen gains (IBD) in the family and no losses. The location and filament-organization rows
  are sound. The one molecular-function row, structural constituent of skin epidermis, is placed at the
  base of the type I keratins and so reaches the corneal keratin 12, where it needs pruning. The two broad
  process rows, morphogenesis of an epithelium and epithelial cell differentiation, rest on phenotype
  and expression annotations and are left unresolved.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: All members are intermediate filament subunits with a structural role. The exceptions
  are of two kinds. Phakinin is not a keratin and forms lens beaded filaments with filensin. Among the
  keratins the molecular role is shared but the tissue is not, so tissue-qualified terms such as structural
  constituent of skin epidermis hold only for the members expressed in epidermis and its appendages.
