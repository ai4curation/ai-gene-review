term_assessments:
- assessed_term:
    id: GO:0005856
    label: cytoskeleton
  scope: FAMILY_WIDE
  scope_reason: Every member, keratin or phakinin, is an intermediate filament subunit, so the general
    location holds family-wide. It is the least informative location; members also carry keratin filament
    or intermediate filament.
  supported_by:
  - reference_id: file:interpro/panther/PTHR23239/PTHR23239-paint.tsv
    supporting_text: "PTHR23239\tPTN001905729\tGO:0005856\tC\tIBD\tfalse"
  - reference_id: PMID:29610398
    supporting_text: Keratins-types I and II-are the intermediate-filament-forming proteins expressed
      in epithelial cells.
- assessed_term:
    id: GO:0005882
    label: intermediate filament
  scope: FAMILY_WIDE
  scope_reason: Keratin filament is a kind of intermediate filament, and phakinin forms the lens beaded
    filament, which PAINT also annotates as intermediate filament. The parent term is therefore safe for
    all members; keratin filament is the preferred term for the keratins and does not apply to phakinin.
  supported_by:
  - reference_id: file:interpro/panther/PTHR23239/PTHR23239-paint.tsv
    supporting_text: "PTHR23239\tPTN002757456\tGO:0005882\tC\tIBD\tfalse"
  - reference_id: file:interpro/panther/PTHR23239/PTHR23239-paint.tsv
    supporting_text: "PTHR23239\tPTN002757528\tGO:0045095\tC\tIBD\tfalse"
- assessed_term:
    id: GO:0045109
    label: intermediate filament organization
  scope: FAMILY_WIDE
  scope_reason: Members are the subunits from which the filaments are built, and mutations in keratin
    9, keratin 20 and keratin 25 disturb filament networks. PAINT asserts the term at the tetrapod type
    I keratin node and separately on phakinin; the KRT18 clade carries the parent term GO:0045104 and
    mouse Krt18 has its own direct annotation to this term.
  supported_by:
  - reference_id: file:interpro/panther/PTHR23239/PTHR23239-paint.tsv
    supporting_text: "PTHR23239\tPTN008383948\tGO:0045109\tP\tIBD\tfalse"
  - reference_id: file:interpro/panther/PTHR23239/PTHR23239-paint.tsv
    supporting_text: "PTHR23239\tPTN002757456\tGO:0045109\tP\tIBD\tfalse"
  - reference_id: PMID:10218578
    supporting_text: "the keratin 9\nmutation disrupts the keratin network formation in the suprabasal\
      \ cells in vivo"
- assessed_term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  scope: FAMILY_WIDE
  scope_reason: Being a structural subunit of the intermediate filament cytoskeleton is the one molecular
    function all members share, whatever tissue they are expressed in. PAINT has no IBD for this term
    in the family (the only molecular-function IBD is the tissue-qualified GO:0030280), so members receive
    it, if at all, from direct or author-statement annotations. This is recorded so that gene reviews
    do not read the missing IBA as evidence against the term.
  supported_by:
  - reference_id: PMID:11724817
    supporting_text: Keratin filaments are built from lateral and longitudinal interactions involving
      heterodimers, and most keratin genes are regulated in a pairwise and differentiation-related fashion
      within epithelia.
  - reference_id: PMID:29610398
    supporting_text: including maintenance of cellular integrity
- assessed_term:
    id: GO:0030280
    label: structural constituent of skin epidermis
  scope: UNRESOLVED
  scope_reason: The term is tissue-qualified. It holds for keratins of the epidermis and its appendages,
    including keratin 9 (palmoplantar epidermis), keratin 10 and the hair-related keratin 36, and it does
    not hold for keratin 12 of the corneal epithelium, for the KRT18 clade or for phakinin (PAINT already
    keeps it off the last two). The remaining subfamilies have not been sorted one by one into cutaneous
    and non-cutaneous here, so no subfamily list is asserted; a gene review should decide from the member's
    own tissue distribution.
  supported_by:
  - reference_id: file:interpro/panther/PTHR23239/PTHR23239-paint.tsv
    supporting_text: "PTHR23239\tPTN002757528\tGO:0030280\tF\tIBD\tfalse"
  - reference_id: PMID:26758872
    supporting_text: K12 is a type I (acidic) keratin produced by differentiated corneal epithelial cells
      that heterodimerises in a parallel, in-register fashion with K3, a type II (basic keratin).
