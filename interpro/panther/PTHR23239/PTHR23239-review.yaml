  assessment_reason: 'Reaches KRT9, for which the term is right: keratin 9 is a keratin of palmoplantar
    epidermis. GO defines the term as contributing to the structural integrity of an epidermal cutaneous
    structure, so the two seeds are apt: human KRT10 (IDA from PMID:7543090, keratin 10 cross-linked into
    the epidermal cornified envelope) and mouse Krt36 (MGI:109364, IDA from PMID:1385239, a hair-related
    keratin of tail scale epidermis and hair follicles). They sit in two different branches, so a deep
    placement is defensible. But the node also holds type I keratins whose tissue is not a cutaneous structure.
    The clearest is the mammalian KRT12 clade PTN000580219 (13 leaves, all PTHR23239:SF369): keratin 12
    is the type I keratin of the corneal epithelium and pairs with keratin 3, and human KRT12 (Q99456)
    currently receives this IBA. An IRD for GO:0030280 at PTN000580219 would stop it there; PAINT prunes
    per annotation, so this leaves the node''s keratin filament and other rows untouched. Other non-cutaneous
    branches below the node (the simple-epithelial KRT19 and KRT20, mucosal KRT13) look like the same
    problem and receive the same IBA, and the human KRT19 review already marks its row as over-annotated,
    but each would be a separate request and is not asserted here. The term is tissue-qualified; the tissue-independent
    activity of the clade is GO:0005200 structural constituent of cytoskeleton, for which this family
    has no IBD.'
