  assessment_reason: 'Reaches KRT9. All six seeds are mutant-phenotype annotations: mouse Krt12 and human
    KRT12 (IMP, PMID:26758872, a Meesmann corneal dystrophy knock-in), mouse Krt16 (IMP, PMID:24218583,
    null mice with palmoplantar calluses), mouse Krt17 (IGI, PMID:15601842, nail bed lysis in compound
    nulls) and mouse Krt25 and Krt27 (IMP to the child term hair follicle morphogenesis, PMID:17920809).
    MGI recorded three of them with the qualifier acts_upstream_of_or_within, and the IBA strengthens
    that to involved_in. The seeds lie in two branches, so placement near the base of the type I keratins
    follows from them, although every seed is a mammal inside PTN008383948 and the IBD sits one node deeper,
    where it also reaches 24 ray-finned fish keratins that have no seed. What cannot be settled from these
    papers is whether the phenotypes show a part in generating epithelial structure or the fragility of
    an epithelium that formed normally and then failed under stress; the cited abstracts describe cell
    lysis, calluses and altered filament assembly. No change to PAINT is requested. Gene reviews should
    judge the row on the member''s own evidence and not treat it as a core function.'
