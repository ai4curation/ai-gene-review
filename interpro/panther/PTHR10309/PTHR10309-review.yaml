- assessed_term:
    id: GO:0004476
    label: mannose-6-phosphate isomerase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the defining activity of every characterized member. Both modules that use the family
    assert it: dolichol_phosphate_sugar_donor_supply (PMI40, S. pombe SPBC2G2.16, human MPI) and
    emp_glycolysis (PMI40, S. pombe SPBC2G2.16).
  supported_by:
  - reference_id: PMID:1377774
    supporting_text: defective in glycosylation and secretion because of a thermolabile phosphomannose
      isomerase (PMI) activity
  - reference_id: file:interpro/panther/PTHR10309/PTHR10309-paint.tsv
    supporting_text: "PTHR10309\tPTN000034017\tGO:0004476\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0009298
    label: GDP-mannose biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    The step PMI performs is the entry point from fructose 6-phosphate into GDP-mannose synthesis
    in bacteria, fungi and animals. This is the process the dolichol_phosphate_sugar_donor_supply
    module asserts for the PMI annoton, and the PMI40 gene review accepts the IBA. Where an
    organism mainly uses PMI catabolically, the process term still holds, because the enzyme
    remains the only route from the hexose-phosphate pool to mannose 6-phosphate.
  supported_by:
  - reference_id: PMID:24035193
    supporting_text: which is synthesized from fructose-6-phosphate via mannose-6-phosphate and mannose-1-phosphate
      in a three-step enzymatic reaction
  - reference_id: file:interpro/panther/PTHR10309/PTHR10309-paint.tsv
    supporting_text: "PTHR10309\tPTN000034017\tGO:0009298\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: FAMILY_WIDE
  scope_reason: >-
    PMIs are soluble enzymes with no targeting signals among the reviewed members, and the PMI40
    review accepts the IBA. Both modules place the activity in the cytosol.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10309/PTHR10309-paint.tsv
    supporting_text: "PTHR10309\tPTN000034017\tGO:0005829\tC\tIBD\tfalse\tMGI:MGI:97075|UniProtKB:P00946"
