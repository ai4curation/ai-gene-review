notes: >-
  The paint tsv was fetched for this review with just fetch-panther-paint. It has one node,
  PTN000034017, carrying three IBD terms, and IBD.gaf has no IRD or IKR rows for the family.
  Subfamily placements come from the PANTHER 19.0 per-organism classification files. Naming
  inconsistency to note but not fix: the modules call S. pombe O43014 "pmi40", following UniProt
  (GN Name=pmi40), while the PANTHER 19 fission-yeast file lists it as mpi1. Both name the same
  protein (SPBC2G2.16). There is no S. pombe gene review for it yet.
