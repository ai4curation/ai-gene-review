family_id: PANTHER:PTHR10309
family_name: MANNOSE-6-PHOSPHATE ISOMERASE
preferred_name: Type I phosphomannose isomerase (ManA/PMI) family
summary: >-
  Type I phosphomannose isomerases are zinc-dependent cupin-fold enzymes. They interconvert
  D-fructose 6-phosphate and D-mannose 6-phosphate. In the biosynthetic direction they take
  fructose 6-phosphate from glycolysis and make mannose 6-phosphate, the committed precursor of
  GDP-mannose and dolichyl-phosphate mannose. In the catabolic direction they let exogenous
  mannose enter glycolysis. The family covers bacterial ManA (E. coli, M. tuberculosis) and the
  eukaryotic enzymes: S. cerevisiae PMI40, S. pombe SPBC2G2.16 (pmi40/mpi1), Candida PMI1, human
  MPI, and the Arabidopsis PMI1 and PMI2 paralogs.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member is a mannose-6-phosphate isomerase, and no catalytically divergent
  subfamily was identified among the reviewed or model-organism members. PANTHER splits a few
  paralogs into their own subfamilies (Arabidopsis PMI1 in SF9, C. elegans C05C8.7 in SF2), but
  these are named and annotated as mannose-6-phosphate isomerases like the rest. Which direction
  of the reaction matters physiologically (GDP-mannose supply or mannose catabolism) varies with
  organism and growth condition. It is not a difference in function between members.
