family_id: PANTHER:PTHR11440
family_name: LECITHIN-CHOLESTEROL ACYLTRANSFERASE-RELATED
preferred_name: LCAT-related acyltransferase family (LCAT, PDAT, LPLA2)
summary: >-
  Alpha/beta-hydrolase-fold acyltransferases related to lecithin-cholesterol acyltransferase. Subfamilies
  transfer an acyl chain from phospholipid to different acceptors: diacylglycerol for phospholipid:diacylglycerol
  acyltransferase (S. cerevisiae LRO1, S. pombe plh1; SF105), cholesterol for LCAT, and 1-O-acylceramide
  for lysosomal phospholipase A2 (PLA2G15). Other members include S. cerevisiae TGL2 and YJR098C.
functional_coherence: HETEROGENEOUS
coherence_reason: The acyl acceptor (diacylglycerol, cholesterol, ceramide or water) differs by subfamily.
