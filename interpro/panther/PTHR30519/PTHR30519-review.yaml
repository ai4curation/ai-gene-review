family_id: PANTHER:PTHR30519
family_name: 5-METHYLTETRAHYDROPTEROYLTRIGLUTAMATE--HOMOCYSTEINE METHYLTRANSFERASE
preferred_name: Cobalamin-independent methionine synthase (MetE/MET6) family
summary: >-
  Zinc-dependent MetE enzymes transfer the methyl group of 5-methyltetrahydropteroyl-triglutamate
  to homocysteine without cobalamin, making methionine (bacterial MetE, S. cerevisiae MET6, S. pombe
  met26, plant MetE). The family also contains truncated MetE-like proteins such as P. putida PP_4637,
  which lacks the catalytic C-terminal barrel.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Full-length members are MetE methionine synthases. Truncated half-barrel paralogs (P. putida PP_4637)
  lack the catalytic zinc site.
