  assessment: UNRESOLVED
  assessment_reason: The prior reason incorrectly treated this GO definition as requiring cobalamin. It
    specifies the monoglutamate folate reaction, not a cofactor. The Introduction of PMID16618097 explicitly
    reports that monoglutamate is neither substrate nor inhibitor for canonical E. coli MetE, citing earlier
    biochemistry; its own assays use triglutamate. This supports a member-specific substrate correction
    without settling every plant seed or placing a loss node. Folate-independent core synthases cannot
    receive this reaction from family identity. The former categorical pruning recommendation is withdrawn;
    precise ancestral substrate scope remains unresolved.
