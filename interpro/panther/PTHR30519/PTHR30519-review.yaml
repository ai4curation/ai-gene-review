family_id: PANTHER:PTHR30519
family_name: 5-METHYLTETRAHYDROPTEROYLTRIGLUTAMATE--HOMOCYSTEINE METHYLTRANSFERASE
preferred_name: MetE-related methionine synthase domains and core synthases
summary: Canonical two-barrel MetE proteins transfer a methyl group from polyglutamylated methyl-tetrahydrofolate
  to zinc-activated homocysteine. Related single catalytic barrels include folate-independent core methionine
  synthases, including MesD, whose activity requires MesX and oxygen in characterized bacterial systems.
  Isolated N-terminal MetE-like barrels also occur. Domain composition and partner context distinguish
  these functions; a family label does not identify the methyl donor.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The family includes full-length MetE, C-terminal-only core synthases such as the MesD
  exemplar Q6F6Z8 and inferred KT2440 Q88JF1, and N-terminal-only Q88E31. These are different architectures,
  not interchangeable full MetE enzymes. No split partnership between the two KT2440 proteins is established.
