  name:
    name: WD repeat BUB3/RAE1
    short: WD_BUB3/RAE1
  description:
  - text: The WD repeat BUB3/RAE1 family is involved in crucial cellular processes
      such as spindle-assembly checkpoint signaling, mitotic bipolar spindle formation,
      and nucleocytoplasmic transport. Members of the family play a role in enforcing
      cell cycle checkpoints, ensuring correct kinetochore-microtubule attachments,
      and regulating chromosome segregation during meiosis and mitosis. They are necessary
      for the localization of certain checkpoint proteins at the kinetochores and
      inhibit the anaphase-promoting complex/cyclosome (APC/C) when the spindle-assembly
      checkpoint is activated. Additionally, some family members are implicated in
      mRNA export, binding mRNA, and potentially attaching cytoplasmic mRNA-protein
      complexes to the cytoskeleton. The family includes factors that are key for
      the stability of axonemal dynein heavy chains in the cytoplasm, which are essential
      for the assembly and function of cilia and flagella.
