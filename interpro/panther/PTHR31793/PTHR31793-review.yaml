    assessment_reason: >-
      Actual PTN001273712 covers all 212 cached leaves, including CdhB. The FadM experimental seed provides
      positive fatty-acyl-CoA chemistry; CdhB has independently supported betainyl-CoA hydrolysis. A different
      physiological substrate does not demonstrate absence of secondary fatty-acyl-CoA activity or identify
      where an evolutionary loss occurred. The broad ancestral assertion therefore remains unresolved
      rather than being categorically pruned from SF2.
