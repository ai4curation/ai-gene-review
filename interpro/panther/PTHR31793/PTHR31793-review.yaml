node_assessments:
  - node_id: PANTHER:PTN001273712
    asserted_term:
      id: GO:0047617
      label: fatty acyl-CoA hydrolase activity
    evidence: IBD
    negated: false
    seeds:
      - id: UniProtKB:P77712
      - id: UniProtKB:Q55777
    assessment: TOO_DEEP
    assessment_reason: >-
      Seeded by FadM (SF24) and a Synechocystis 1,4-dihydroxy-2-naphthoyl-CoA
      hydrolase (SF37), but the node also reaches the betainyl-CoA thioesterase
      subfamily SF2: P. aeruginosa CdhB receives the term by IBA. GO defines the
      term by a fatty acid product, and CdhB releases glycine betaine. The
      thioesterase chemistry is inherited, so the CdhB and PP_0301 reviews
      generalize the row to acyl-CoA hydrolase activity; the fatty-acyl term
      belongs on the FadM branch.
    affected_subfamilies:
      - id: PANTHER:PTHR31793:SF2
        label: BLR1345 PROTEIN
    supported_by:
      - reference_id: file:interpro/panther/PTHR31793/PTHR31793-paint.tsv
        supporting_text: "PTHR31793\tPTN001273712\tGO:0047617\tF\tIBD\tfalse"
      - reference_id: file:genes/PSEAE/cdhB/cdhB-uniprot.txt
        supporting_text: >-
          Reaction=N,N,N-trimethylglycyl-CoA + H2O = glycine betaine + CoA +
          H(+);
