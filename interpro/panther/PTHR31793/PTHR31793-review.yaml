term_assessments:
  - assessed_term:
      id: GO:0016289
      label: acyl-CoA hydrolase activity
    scope: UNRESOLVED
    scope_reason: >-
      Acyl-CoA hydrolysis is positively supported for named CdhB, FadM and YbgC/DHNA-CoA members; the
      exact extent across mixed subfamilies is unresolved. Acyl-ACP activity alone is not evidence of
      absence of acyl-CoA hydrolysis. Carnitine-specific capacity additionally requires betainyl-CoA chemistry,
      not merely this broad genus.
    supported_by:
      - reference_id: file:genes/PSEAE/cdhB/cdhB-uniprot.txt
        supporting_text: "Reaction=N,N,N-trimethylglycyl-CoA + H2O = glycine betaine + CoA + H(+);"
  - assessed_term:
      id: GO:0047617
      label: fatty acyl-CoA hydrolase activity
    scope: UNRESOLVED
    scope_reason: Retain the positive FadM experimental seed, but do not equate alternate native
      substrates with loss of fatty-acyl-CoA hydrolysis. Exact substrate range across the family and
      within SF2 is unresolved. No whole-family denial or exact betainyl-specificity grant follows
      from the family name.
    supported_by:
      - reference_id: file:interpro/panther/PTHR31793/PTHR31793-paint.tsv
        supporting_text: "PTHR31793\tPTN001273712\tGO:0047617\tF\tIBD\tfalse"
