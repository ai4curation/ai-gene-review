      - id: UniProtKB:F4HX80
    assessment: SOUND
    assessment_reason: >-
      Seeded by the Arabidopsis chloroplastic ATL acyl-ACP thioesterases (SF27);
      the node is confined to the plant clade and does not reach the bacterial
      acyl-CoA thioesterases.
    affected_subfamilies:
      - id: PANTHER:PTHR31793:SF27
        label: NOVEL THIOESTERASE SUPERFAMILY DOMAIN AND SAPOSIN A-TYPE DOMAIN CONTAINING PROTEIN (0610012H03RIK)
