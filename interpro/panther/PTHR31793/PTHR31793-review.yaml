        label: Betainyl-CoA thiolase
        gene_symbol: PP_0301
        organism: Pseudomonas putida KT2440
        gene_review: genes/PSEPK/PP_0301/PP_0301-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      CdhB hydrolyzes betainyl-CoA to glycine betaine and CoA. This differs from the characterized native
      substrates of FadM and aroyl-CoA hydrolases; it does not demonstrate absence of all secondary fatty-acyl-CoA
      activity.
    supported_by:
      - reference_id: file:interpro/panther/PTHR31793/PTHR31793-entries.csv
        supporting_text: Q9HTH9,Betainyl-CoA thioesterase,protein
      - reference_id: file:genes/PSEAE/cdhB/cdhB-uniprot.txt
        supporting_text: >-
          Reaction=N,N,N-trimethylglycyl-CoA + H2O = glycine betaine + CoA +
          H(+);
  - subfamily_id: PANTHER:PTHR31793:SF24
    label: LONG-CHAIN ACYL-COA THIOESTERASE FADM
    description: Long-chain fatty acyl-CoA thioesterases (FadM).
    representative_members:
      - id: UniProtKB:P77712
        label: Long-chain acyl-CoA thioesterase FadM
        gene_symbol: fadM
        organism: Escherichia coli K-12
    diverged_from_family: false
    supported_by:
      - reference_id: file:interpro/panther/PTHR31793/PTHR31793-entries.csv
        supporting_text: P77712,Long-chain acyl-CoA thioesterase FadM,protein
  - subfamily_id: PANTHER:PTHR31793:SF37
    label: ACYL-COA THIOESTER HYDROLASE YBGC
    description: YbgC acyl-CoA thioesterases and cyanobacterial 1,4-dihydroxy-2-naphthoyl-CoA
      hydrolases.
    representative_members:
      - id: UniProtKB:P0A8Z3
        label: Acyl-CoA thioester hydrolase YbgC
        gene_symbol: ybgC
        organism: Escherichia coli K-12
    diverged_from_family: false
    supported_by:
      - reference_id: file:interpro/panther/PTHR31793/PTHR31793-entries.csv
        supporting_text: P0A8Z3,Acyl-CoA thioester hydrolase YbgC,protein
  - subfamily_id: PANTHER:PTHR31793:SF27
    label: NOVEL THIOESTERASE SUPERFAMILY DOMAIN AND SAPOSIN A-TYPE DOMAIN CONTAINING PROTEIN
      (0610012H03RIK)
    description: Plant chloroplastic acyl-ACP thioesterases (ATL1-4) and related proteins.
    representative_members:
      - id: UniProtKB:Q9C7I5
        label: Acyl-acyl carrier protein thioesterase ATL1, chloroplastic
        gene_symbol: ALT1
        organism: Arabidopsis thaliana
    diverged_from_family: true
    divergence_description: >-
      The characterized plant members hydrolyze acyl-ACP. PAINT records a fatty-acyl-CoA loss at PTN001273713,
      but the alternative positive activity alone does not establish that loss. The actual plant/algal
      node spans several subfamilies; SF27 is not itself a synonym for that node.
    supported_by:
