family_id: PANTHER:PTHR31793
family_name: 4-HYDROXYBENZOYL-COA THIOESTERASE FAMILY MEMBER
preferred_name: Hotdog-fold 4HBT-type thioesterases (YbgC, FadM, DHNA-CoA hydrolase, CdhB, plant
  ATL)
summary: >-
  Single hotdog-domain thioesterases (Pfam PF13279, 4HBT_2). Reviewed members
  include E. coli YbgC and cyanobacterial 1,4-dihydroxy-2-naphthoyl-CoA
  hydrolases (SF37), the long-chain acyl-CoA thioesterase FadM (SF24), the
  betainyl-CoA thioesterase CdhB of aerobic L-carnitine catabolism (SF2), and
  plant chloroplastic acyl-acyl carrier protein thioesterases ATL1-4 (SF27).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Characterized members hydrolyze thioesters with diverse acyl groups and carriers, including fatty acyl-CoA,
  aroyl-CoA, betainyl-CoA and acyl-ACP. Those positive activities support substrate diversity but do not
  alone exclude secondary substrates or prove evolutionary losses. Exact substrate scope requires member-level
  chemistry.
reference_protein:
  id: UniProtKB:Q9HTH9
  label: Betainyl-CoA thioesterase
  gene_symbol: cdhB
  organism: Pseudomonas aeruginosa PAO1
  gene_review: genes/PSEAE/cdhB/cdhB-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR31793:SF2
    label: BLR1345 PROTEIN
    description: Contains the characterized PAO1 betainyl-CoA thioesterase CdhB and the inferred
      KT2440 counterpart; betainyl specificity is not established for every SF2 member.
    representative_members:
      - id: UniProtKB:Q9HTH9
        label: Betainyl-CoA thioesterase
        gene_symbol: cdhB
        organism: Pseudomonas aeruginosa PAO1
        gene_review: genes/PSEAE/cdhB/cdhB-ai-review.yaml
