  assessment_reason: >-
    PTN002773962 is the DDX5/DDX17/Dbp2 clade (208 leaves). Purified budding yeast Dbp2 is an efficient
    RNA helicase whose duplex unwinding is inhibited by Yra1 (PMID:23721653), and human DDX5 regulates
    tau exon 10 splicing in a helicase-dependent manner (PMID:21343338). RNA helicase activity is the
    core function of the clade.
