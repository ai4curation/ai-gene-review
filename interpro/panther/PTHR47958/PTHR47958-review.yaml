family_id: PANTHER:PTHR47958
family_name: ATP-DEPENDENT RNA HELICASE DBP3
preferred_name: DEAD-box RNA helicases (DDX5/DDX17/Dbp2 group and relatives)
summary: >-
  PTHR47958 groups DEAD-box ATP-dependent RNA helicases. The clade assessed here holds the DDX5/DDX17
  helicases of animals and budding yeast Dbp2, which act in mRNP assembly, splicing and transcription.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  ATP-dependent RNA unwinding is shared; members act on different RNAs and in different processes.
