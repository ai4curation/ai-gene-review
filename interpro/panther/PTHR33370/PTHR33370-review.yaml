family_id: PANTHER:PTHR33370
family_name: TRANSLATION INITIATION FACTOR IF-1, CHLOROPLASTIC
preferred_name: Bacterial and plastid translation initiation factor IF1
summary: >-
  PTHR33370 is the bacterial-type translation initiation factor IF1 family. IF1 is a small OB-fold
  protein that binds the A site of the 30S ribosomal subunit, where it protects the same 16S rRNA bases
  that A-site tRNA protects, blocks premature A-site occupation and stabilizes IF2 and IF3 on the 30S
  preinitiation complex. The family holds the bacterial IF1 proteins and the IF1 encoded by, or targeted
  to, plastids of plants and algae, which descend from the cyanobacterial endosymbiont. The PANTHER name
  "CHLOROPLASTIC" reflects the plant members only; the reference member is Escherichia coli IF1 (infA,
  P69222). IF1 is related in sequence to archaeal and eukaryotic aIF1A/eIF1A, but those proteins are
  classified in a separate PANTHER family (PTHR21668, EIF-1A) and have acquired lineage-specific roles
  in scanning-based initiation, so this family review does not extend to them.
functional_coherence: COHERENT
coherence_reason: >-
  All 634 Swiss-Prot entries in the parsed entries file are in a single subfamily, PTHR33370:SF1, and
  all are named translation initiation factor IF-1, from bacteria and from plant and algal plastid
  genomes. Bacterial IF1 and plastid IF1 perform the same 30S A-site role in bacterial-type 70S
  initiation; only the compartment differs. No divergent or catalytically distinct member is known.
  The archaeal/eukaryotic eIF1A homologues that diverged in function lie outside this family.
reference_protein:
  id: UniProtKB:P69222
  label: Translation initiation factor IF-1
  gene_symbol: infA
  organism: Escherichia coli (strain K12)
  gene_review: genes/ECOLI/infA/infA-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR33370:SF1
  label: TRANSLATION INITIATION FACTOR IF-1, CHLOROPLASTIC
  description: >-
    The only subfamily with reviewed members. It contains bacterial IF1 (E. coli P69222, Pseudomonas
    putida KT2440 P65117) together with plastid-genome infA proteins of land plants and algae (for
    example Hordeum vulgare A1E9M5 and Coffea arabica A0A370). Despite its organelle-oriented PANTHER
    label it is the bacterial IF1 subfamily used by the bacterial_translation_initiation module.
  representative_members:
  - id: UniProtKB:P69222
    label: Translation initiation factor IF-1
    gene_symbol: infA
    organism: Escherichia coli (strain K12)
  - id: UniProtKB:P65117
    label: Translation initiation factor IF-1
    gene_symbol: infA
    organism: Pseudomonas putida (strain ATCC 47054 / DSM 6125 / CFBP 8728 / NCIMB 11950 / KT2440)
  diverged_from_family: false
node_assessments:
- node_id: PANTHER:PTN002120760
  asserted_term:
    id: GO:0140517
    label: protein-RNA adaptor activity
  evidence: IBD
  paint_snapshot: '20260527'
  seeds:
  - id: UniProtKB:P69222
  assessment: UNRESOLVED
  assessment_reason: >-
    The root-node placement is phylogenetically reasonable, since bacterial and plastid IF1 share the
    A-site-binding OB fold, but the term choice is doubtful. GO:0140517 protein-RNA adaptor activity
    describes bridging a protein to an RNA; IF1's demonstrated activity is occupation of the 30S A site
    (footprinting on 16S rRNA) and cooperative stabilization of IF2/IF3 binding, which GO captures as
    translation initiation factor activity (GO:0003743). Whether the single seed (E. coli IF1)
    experimentally supports adaptor activity is assessed in the E. coli infA gene review; this family
    review does not confirm it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR33370/PTHR33370-paint.tsv
    supporting_text: "PTHR33370\tPTN002120760\tGO:0140517\tF\tIBD\tfalse\tUniProtKB:P69222\ttaxon:\t20260527"
  - reference_id: PMID:7739034
    supporting_text: This suggests that IF-1 mimics A-site-bound tRNA, and could serve to prevent premature
      binding of aminoacyl tRNA by blocking the 30 S A site.
- node_id: PANTHER:PTN002120760
  asserted_term:
    id: GO:0006413
    label: translational initiation
  evidence: IBD
  paint_snapshot: '20260527'
  seeds:
  - id: UniProtKB:P69222
  assessment: SOUND
  assessment_reason: >-
    Translational initiation is the role of every characterized member, bacterial and plastid; IF1 acts
    only on the 30S initiation complex. Placement at the family root is appropriate.
  supported_by:
  - reference_id: file:interpro/panther/PTHR33370/PTHR33370-paint.tsv
    supporting_text: "PTHR33370\tPTN002120760\tGO:0006413\tP\tIBD\tfalse\tUniProtKB:P69222\ttaxon:\t20260527"
  - reference_id: PMID:22562136
    supporting_text: Subsequently, IF1 joins and locks the factors in a kinetically stable 30S PIC
- node_id: PANTHER:PTN002120795
  asserted_term:
    id: GO:0005829
    label: cytosol
  evidence: IBD
  paint_snapshot: '20260527'
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  assessment: SOUND
  assessment_reason: >-
    The cytosol term is placed on a Bacteria-scoped node rather than the root, so plastid members that
    act in the chloroplast stroma are not meant to inherit it. A spot check of a plastid member (barley
    A1E9M5) in QuickGO found no IBA cytosol row from this node.
  supported_by:
