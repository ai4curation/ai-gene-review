- assessed_term:
    id: GO:0003743
    label: translation initiation factor activity
  scope: FAMILY_WIDE
  scope_reason: >-
    IF1 blocks the 30S A site and stabilizes the IF2/IF3-containing preinitiation complex in bacteria,
    and plastid IF1 performs the same role on plastid 70S ribosomes. PAINT does not currently assert
    this MF at the family root (it uses GO:0140517), but it is the better-supported activity term.
  supported_by:
  - reference_id: PMID:7739034
    supporting_text: IF-1 protects G530, A1492 and A1493 and causes enhanced reactivity of A1408.
- assessed_term:
