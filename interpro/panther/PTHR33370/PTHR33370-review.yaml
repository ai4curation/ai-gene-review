notes: >-
  Divergence outside the family: bacterial IF1 and archaeal/eukaryotic a/eIF1A are related in sequence
  (PMID:9419357, "the \"analogous\" translation initiation factors IF-1 and eIF-1A are actually related
  in sequence"), but PANTHER places eIF1A in PTHR21668 (EIF-1A). eIF1A carries extra N- and C-terminal
  tails and functions in scanning and start-codon selection on the 40S subunit (PMID:10678173), so
  bacterial IF1 annotations should not be propagated to it through this family.
