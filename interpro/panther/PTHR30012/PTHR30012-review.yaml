- subfamily_id: PANTHER:PTHR30012:SF7
  label: PROTEIN TRANSPORT PROTEIN HOFC HOMOLOG
  description: >-
    Platform proteins of type IV pilus, competence and toxin-coregulated pilus systems:
    P. aeruginosa and P. putida PilC, E. coli and Haemophilus HofC, Aeromonas TapC, Vibrio
    cholerae TcpE, and Xanthomonas XpsF.
  representative_members:
