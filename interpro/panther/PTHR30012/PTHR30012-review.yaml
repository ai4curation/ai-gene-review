    label: Type IV pilus assembly protein PilC
  - id: UniProtKB:P36646
    label: Protein transport protein HofC homolog
  diverged_from_family: true
  divergence_description: >-
    These proteins serve pilus and competence machines rather than a type II secretion system.
    PilC is required for polar localisation of the type IV pilus assembly ATPase PilB, a
    pilus-specific function with no T2SS counterpart, so the T2SS complex and process terms must
    not propagate to this subfamily.
  supported_by:
  - reference_id: PMID:15659660
    supporting_text: YFP-PilB exhibited diffuse cytoplasmic localization in a pilC mutant,
      suggesting that PilC is required for polar localization of PilB
