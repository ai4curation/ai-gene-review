notes: >-
  Used by modules/bacterial_type_ii_secretion.yaml for the GspF platform-core annoton. The module
  grounds that annoton on InterPro IPR011850 (NCBIfam TIGR02120, GspF-specific) rather than on this
  PANTHER family, because PTHR30012 mixes T2SS GspF with the type IV pilus and competence platform
  proteins of SF7 and the family-level id would not separate them; the exemplars are
  P. aeruginosa XcpS (Q00513), P. putida KT2440 GspF (Q88P05) and Klebsiella PulF (P15745). This is
  one of the three families (with PTHR30258 GspE and PTHR30332 GspD) in which the T2SS shares its
  machinery components with type IV pilus and competence systems; the divergence is recorded in each
  family's subfamilies. The PTN000768597 secretion IBD is seeded by the PseudoCAP XcpS row whose
  evidence-code defect is recorded in genes/PSEAE/xcpS/xcpS-ai-review.yaml.
