family_id: PANTHER:PTHR30012
family_name: GENERAL SECRETION PATHWAY PROTEIN
preferred_name: GspF/PilC polytopic inner-membrane platform proteins
summary: >-
  Polytopic inner-membrane proteins that form the central subunit of the assembly platform of type
  II secretion systems (GspF) and of type IV pilus and competence machines (PilC, HofC, ComGB,
  TcpE, MshG). All members share a large cytoplasmic N-terminal domain followed by several
  transmembrane segments, and all sit at the centre of a machine that polymerises a prepilin-type
  filament. The T2SS members (SF0: P. aeruginosa XcpS, Klebsiella PulF, Vibrio EpsF, Dickeya OutF,
  E. coli GspF, Aeromonas ExeF) are stabilised by, and bind, the secretion ATPase GspE and the
  platform protein GspL; the pilus and competence members (SF7) perform the equivalent role for a
  surface pilus, with the Pseudomonas PilC paralog also required for polar localisation of the
  pilus ATPase PilB.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The fold and the mechanical role are conserved, but the machines are not: SF0 members are
  components of type II secretion systems that export folded periplasmic proteins, while SF7
  members (PilC, HofC, TapC, XpsF, TcpE, ComGB) belong to type IV pilus, competence and
  toxin-coregulated pilus systems. T2SS-specific terms therefore belong to SF0, and pilus-specific
  terms to SF7, even though plasma membrane and the general platform role are family-wide.
