  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The claim is right for the seed XcpS and for GspF proteins generally, but it is asserted at the
    same node as the family-wide plasma-membrane term, so it descends to the pilus and competence
    subfamily as well. The QuickGO leaf table for this node shows the leakage is real but small: of
    911 proteins receiving the IBA, 846 carry T2SS names and 7 are named PilC, HofC or MshG, that
    is pilus or MSHA platform proteins that have no type II secretion system. The remedy is to
    restrict this IBD to the GspF clade (SF0) and leave the location IBD where it is, rather than
    to drop the assertion.
