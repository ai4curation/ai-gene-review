family_id: PANTHER:PTHR43104
family_name: L-2-HYDROXYGLUTARATE DEHYDROGENASE, MITOCHONDRIAL
preferred_name: Malate:quinone oxidoreductase (MQO) and L-2-hydroxyglutarate dehydrogenase family
summary: >-
  FAD-dependent, membrane-associated dehydrogenases that pass electrons from a hydroxyacid to the
  respiratory quinone pool. Most members are bacterial malate:quinone oxidoreductases (MQO,
  EC 1.1.5.4; E. coli Mqo, P. putida Mqo1-3), which oxidise L-malate to oxaloacetate at the final
  TCA-cycle step as an alternative to NAD-dependent malate dehydrogenase. A smaller clade is the
  L-2-hydroxyglutarate dehydrogenases (E. coli LhgD/YgaF, plant and animal L2HGDH), metabolite-repair
  enzymes that are mitochondrial in animals. PANTHER names the family after the L2HGDH clade, but
  the two activities are distinct and its subfamilies do not separate them.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Two substrate specificities (L-malate and L-2-hydroxyglutarate) share SF2; PAINT places the
  L2HGDH activity at clade node PTN002454638, outside the MQOs.
