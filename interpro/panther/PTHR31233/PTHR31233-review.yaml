family_id: PANTHER:PTHR31233
family_name: BICAUDAL D FAMILY MEMBER
preferred_name: Bicaudal-D (BICD) coiled-coil activating adaptors of cytoplasmic dynein-1
summary: >-
  Metazoan family of long, dimeric coiled-coil proteins that act as cargo adaptors and
  activators of cytoplasmic dynein-1. Members share a three-segment coiled-coil
  architecture. The N-terminal coiled coil (CC1, with the CC1 box) binds the dynein
  light intermediate chain and the dynein tail. It also runs along the dynactin Arp1
  filament, so dynein, dynactin and BICD form a stable, highly processive
  minus-end-directed motor complex. The C-terminal coiled coil (CC3) selects cargo and,
  in the cargo-free state, folds back to autoinhibit motor binding. Vertebrates have two
  paralogs, BICD1 (SF3) and BICD2 (SF7); invertebrates have a single BicD (SF6,
  Drosophila BicD and C. elegans BICD-1). Cargoes are lineage- and context-specific.
  Vertebrate BICD2 binds RAB6-GTP on Golgi-derived vesicles (Golgi-to-ER retrograde and
  secretory transport). It also binds RANBP2 at nuclear pores in G2 and nesprin-2 at
  the nuclear envelope of migrating neurons, and these nuclear-envelope cargoes drive
  nuclear migration. Drosophila BicD transports Egalitarian-bound mRNAs into and within
  the oocyte, and Rab6-positive membranes and clathrin. It is also needed for nuclear
  migration in photoreceptor precursors and neurons. The adaptor and motor-activator
  function (dynein and dynactin binding, cargo-licensed dynein activation) is conserved
  across the family. Cargo-specific processes are not. The BICD-related
  proteins BICDR1/BICDL1, BICDL2 and Drosophila BicDR are in a separate PANTHER family
  (PTHR32123), not this one.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed members (human BICD2, Drosophila BicD) are dynein-dynactin activating
  cargo adaptors with the same N-terminal motor-binding and C-terminal cargo-binding
  organization, and PAINT places the motor-binding terms (dynactin binding, dynein
  complex binding) at the eumetazoan root, which member reviews accept. What differs
  between clades is cargo repertoire (RAB6/Golgi and RANBP2/nesprin-2 in vertebrate
  BICD2; Egalitarian-mRNA in Drosophila BicD), so cargo-specific process terms should
  be scoped to the lineage where the cargo interaction is shown, but no member is known
  to have lost the core adaptor function.
