node_assessments:
  # --- PTN001261414: family root, Eumetazoa ---
  - node_id: PANTHER:PTN001261414
    asserted_term:
      id: GO:0034452
      label: dynactin binding
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20200401"
    seeds:
