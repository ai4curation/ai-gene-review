      - id: UniProtKB:Q96G01
        label: Protein bicaudal D homolog 1
        gene_symbol: BICD1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Dynactin binding by the N-terminal coiled coil is the defining activity of the
      family and is shown for both vertebrate paralogs and for Drosophila BicD (in vitro
      binding and reconstitution). Both member reviews ACCEPT the IBA. Correct root
      placement.
  - node_id: PANTHER:PTN001261414
    asserted_term:
      id: GO:0070840
      label: dynein complex binding
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20200401"
    seeds:
      - id: MGI:MGI:1924145
        label: Bicd2
        gene_symbol: Bicd2
        organism: Mus musculus
      - id: UniProtKB:Q96G01
        label: Protein bicaudal D homolog 1
        gene_symbol: BICD1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Dynein binding (light intermediate chain and heavy-chain tail) is conserved across
      the family; Drosophila BicD binds dynein and, once cargo-bound, recruits
      dynein-dynactin. Accepted in both member reviews. Sound.
  - node_id: PANTHER:PTN001261414
    asserted_term:
      id: GO:0005794
      label: Golgi apparatus
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20201001"
    seeds:
      - id: MGI:MGI:1924145
        label: Bicd2
        gene_symbol: Bicd2
        organism: Mus musculus
      - id: UniProtKB:Q8TD16
        label: Protein bicaudal D homolog 2
        gene_symbol: BICD2
        organism: Homo sapiens
      - id: UniProtKB:Q96G01
        label: Protein bicaudal D homolog 1
        gene_symbol: BICD1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Golgi association follows from binding of Golgi Rab GTPases, which is conserved:
      vertebrate BICD1/2 bind RAB6-GTP, and Drosophila BicD is a GTP-dependent effector
      of Rab6, Rab2, Rab30 and Rab39 and was identified as a Golgi-localized coiled-coil
      protein. Both member reviews ACCEPT. Sound.
  - node_id: PANTHER:PTN001261414
    asserted_term:
      id: GO:0005829
      label: cytosol
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20251220"
    seeds:
      - id: UniProtKB:Q96G01
        label: Protein bicaudal D homolog 1
        gene_symbol: BICD1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      The soluble autoinhibited adaptor pool is cytosolic in every member studied. One
      seed is adequate for a generic location; accepted in both member reviews.
  - node_id: PANTHER:PTN001261414
    asserted_term:
      id: GO:0070507
      label: regulation of microtubule cytoskeleton organization
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20200401"
    seeds:
      - id: UniProtKB:Q8TD16
        label: Protein bicaudal D homolog 2
        gene_symbol: BICD2
        organism: Homo sapiens
      - id: UniProtKB:Q96G01
        label: Protein bicaudal D homolog 1
        gene_symbol: BICD1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Defensible as a family-wide regulation term: BICD knockdown disrupts
      centrosome-focused microtubule arrays in mammalian cells, and Drosophila BicD is
      required to establish and maintain the polarized oocyte microtubule network. Both
      member reviews keep the IBA but as KEEP_AS_NON_CORE, because the effect is an
      indirect consequence of dynein-dependent transport (for example of centrosomal
      proteins) rather than an activity on microtubules. The placement is sound. The
      term should not be read as a core function.
  - node_id: PANTHER:PTN001261414
    asserted_term:
      id: GO:0072393
      label: microtubule anchoring at microtubule organizing center
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20200401"
    seeds:
      - id: MGI:MGI:1101760
        label: Bicd1
        gene_symbol: Bicd1
        organism: Mus musculus
      - id: MGI:MGI:1924145
        label: Bicd2
        gene_symbol: Bicd2
        organism: Mus musculus
    assessment: UNRESOLVED
    assessment_reason: >-
      The evidence is a single microtubule-regrowth study showing that GSK-3beta and
      "BICD" (knockdown emphasis on BICD1) are needed to anchor microtubules at the
      centrosome. That is most plausibly indirect, through dynein delivery of centrosomal
      anchoring proteins, and paralog attribution cannot be checked from the cached
      abstract. There is no invertebrate evidence for or against. The human BICD2 and
      Drosophila BicD reviews both retain the IBA as KEEP_AS_NON_CORE. The node
      placement is not contradicted, but a process term that describes anchoring by
      the MTOC is a weak fit for a transport adaptor. Revisit this if a direct role is
      shown.
  - node_id: PANTHER:PTN001261414
    asserted_term:
      id: GO:0033365
      label: protein localization to organelle
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20250904"
    seeds:
      - id: MGI:MGI:1924145
        label: Bicd2
        gene_symbol: Bicd2
        organism: Mus musculus
      - id: UniProtKB:Q8TD16
        label: Protein bicaudal D homolog 2
        gene_symbol: BICD2
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      A recent (2025) and very general process term. It is consistent with the conserved
      role of BICD proteins in positioning protein cargo (RAB6 on the Golgi, dynein at
      the nuclear envelope; Rab6 and clathrin in Drosophila). It is not yet in either
      member's GOA slice, so neither review adjudicated it. Harmless at the root,
      but it adds little beyond the more specific transport terms.

  # --- PTN002830232: BICD1 clade, Euteleostomi ---
  - node_id: PANTHER:PTN002830232
    asserted_term:
      id: GO:0008093
      label: cytoskeletal anchor activity
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20190410"
    seeds:
      - id: UniProtKB:Q96G01
        label: Protein bicaudal D homolog 1
        gene_symbol: BICD1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Correct for the BICD1 clade, but placed too shallowly. Cytoskeletal adaptor
      activity (linking cargo to dynein-dynactin) is the core molecular function in both
      member reviews: human BICD2 (SF7) and Drosophila BicD (SF6) both take GO:0008093 as
      their primary core function, from IEA/experimental evidence rather than IBA,
      because this IBD does not reach them. Recommend moving (or duplicating) the IBD to
      the family root PTN001261414, where the dynein- and dynactin-binding IBDs already
      sit.
  - node_id: PANTHER:PTN002830232
    asserted_term:
      id: GO:0045505
      label: dynein intermediate chain binding
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20190410"
    seeds:
      - id: UniProtKB:Q96G01
        label: Protein bicaudal D homolog 1
        gene_symbol: BICD1
        organism: Homo sapiens
    assessment: UNRESOLVED
    assessment_reason: >-
      Seeded only by human BICD1, which has no review here. The structurally defined
      BICD-dynein interface is with the light intermediate chain (placed separately on
      the BICD2 node). A clade-restricted intermediate-chain interaction is plausible
      (BICD2's contact with the dynein tail is extensive), but it cannot be checked
      against a member review. Scoping is harmless because it does not leave the BICD1
      clade.
  - node_id: PANTHER:PTN002830232
    asserted_term:
      id: GO:0048260
      label: positive regulation of receptor-mediated endocytosis
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20190410"
    seeds:
      - id: UniProtKB:Q96G01
        label: Protein bicaudal D homolog 1
        gene_symbol: BICD1
        organism: Homo sapiens
    assessment: UNRESOLVED
    assessment_reason: >-
      A BICD1-specific trafficking claim seeded by one human BICD1 annotation, and
      correctly confined to the BICD1 clade. No reviewed member bears on it. Drosophila
      BicD's endocytosis-related phenotypes (reduced clathrin-dependent membrane uptake
      at synapses, oocyte endocytosis) are judged indirect in the BicD review. So even
      if the BICD1 role holds, it is an effect of cargo transport rather than
      participation in endocytosis. Treat as a candidate over-annotation until a BICD1
      review adjudicates it.

  # --- PTN008630033: BICD2 clade, Tetrapoda ---
  - node_id: PANTHER:PTN008630033
    asserted_term:
      id: GO:0051959
      label: dynein light intermediate chain binding
    node_taxon:
