    assessment: SOUND
    assessment_reason: >-
      Correct for BICD2 (accepted: BICD2 converts dynein into a processive motor and
      tethers it to cargo). Reconstitution shows the same for Drosophila BicD with
      Egalitarian-mRNA cargo, so the term is really family-wide. It could be moved to
      the root PTN001261414.
  - node_id: PANTHER:PTN008630033
    asserted_term:
      id: GO:0034067
      label: protein localization to Golgi apparatus
    node_taxon:
      id: NCBITaxon:32523
      label: Tetrapoda
    paint_snapshot: "20190410"
    seeds:
      - id: MGI:MGI:1924145
        label: Bicd2
        gene_symbol: Bicd2
        organism: Mus musculus
      - id: UniProtKB:Q8TD16
        label: Protein bicaudal D homolog 2
        gene_symbol: BICD2
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      BICD2 promotes RAB6A retention on the Golgi by stabilizing its GTP-bound form;
