term_assessments:
  - assessed_term:
      id: GO:0008093
      label: cytoskeletal anchor activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Every characterized member links cargo to dynein-dynactin. It is the first core
      function in both member reviews (human BICD2, Drosophila BicD). PAINT currently
      asserts it only on the BICD1 node (PTN002830232); it belongs at the root.
    supported_by:
      - reference_id: PMID:22956769
        supporting_text: >-
          BICD2 N-terminus (BICD2-N) strongly promotes stable interaction between dynein
          and dynactin both in vitro and in vivo
      - reference_id: PMID:29944118
        supporting_text: >-
          A Bicaudal-D (BicD) adaptor protein and the RNA-binding protein Egalitarian
          (Egl) are sufficient for long-distance mRNA transport by the dynein motor and
          its accessory complex dynactin
  - assessed_term:
      id: GO:0140660
      label: cytoskeletal motor activator activity
    scope: FAMILY_WIDE
    scope_reason: >-
      BICD proteins do more than bridge cargo to dynein: their N-terminal coiled coil
      converts dynein-dynactin into a processive motor, and in Drosophila BicD this
      activation is licensed by cargo binding. Both member reviews propose this term as
      NEW. No PAINT node currently asserts it. It would be a natural root-level IBD
      alongside dynactin binding.
    supported_by:
      - reference_id: PMID:24986880
        supporting_text: >-
          addition of dynactin together with the N-terminal region of the cargo adaptor
          BICD2 (BICD2N) gives rise to unidirectional dynein movement over remarkably
          long distances
      - reference_id: PMID:32378283
        supporting_text: >-
          The dynein adaptor Drosophila Bicaudal D (BicD) is auto-inhibited and
          activates dynein motility only after cargo is bound
  - assessed_term:
      id: GO:0007097
      label: nuclear migration
    scope: FAMILY_WIDE
    scope_reason: >-
      Nuclear-envelope cargo coupling to dynein is shown in both vertebrates and flies.
      Vertebrate BICD2 is recruited by RANBP2 (G2 progenitors, apical interkinetic
      nuclear migration) and by nesprin-2 (neuronal nucleokinesis). Drosophila BicD is
      required for apical nuclear migration of photoreceptor precursors and for nuclear
      positioning in the developing nervous system. Both member reviews propose nuclear
      migration as NEW. Here BICD does part of the work (it recruits and activates the
      motor that moves the nucleus), so this is participation rather than a
      requirement. No nematode data; BICD1 untested in this context.
    supported_by:
      - reference_id: PMID:32619477
        supporting_text: >-
          We report here that Nesprin-2 contributes to nuclear displacement during
          neuronal migration by recruiting microtubule motors to the NE, through the
          well-known adaptor BicD2.
      - reference_id: PMID:15582780
        supporting_text: >-
          Bicaudal-D (Bic-D), an evolutionarily conserved dynein-interacting protein, is
          required for developmental control of nuclear migration in Drosophila
  - assessed_term:
      id: GO:0006890
      label: retrograde vesicle-mediated transport, Golgi to endoplasmic reticulum
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Shown for vertebrate BICD2 through RAB6. Invertebrate BicD binds Rab6, but its
      documented Rab6 roles are in oocyte membrane/mRNA transport and bristle growth,
      not Golgi-to-ER retrograde traffic. The existing BICD2-clade placement
      (PTN008630033) is the right scope. BICD1 is untested.
    applicable_subfamilies:
      - id: PANTHER:PTHR31233:SF7
        label: PROTEIN BICAUDAL D HOMOLOG 2
    supported_by:
      - reference_id: PMID:25962623
        supporting_text: >-
          BICD2 is involved in coat protein I (COPI)-independent Golgi-to-ER retrograde
          vesicular transport
  - assessed_term:
      id: GO:0051028
      label: mRNA transport
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Dynein-mediated mRNA transport by BicD depends on the RNA-binding co-adaptor
      Egalitarian and is characterized in Drosophila. The reviewed vertebrate member
      (BICD2) has no comparable experimentally established mRNA-transport role, so the
      term must not descend family-wide. It is safe only for the invertebrate BicD subfamily, and
      even there nematode BICD-1 has not been tested.
    applicable_subfamilies:
      - id: PANTHER:PTHR31233:SF6
        label: PROTEIN BICAUDAL D
    supported_by:
      - reference_id: PMID:29944118
        supporting_text: >-
          A Bicaudal-D (BicD) adaptor protein and the RNA-binding protein Egalitarian
          (Egl) are sufficient for long-distance mRNA transport by the dynein motor and
          its accessory complex dynactin

