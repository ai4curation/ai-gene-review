review_status: NEEDS_REVIEW
reviewed_by: claude-code (AI-assisted PANTHER family review)
review_date: "2026-09-27"
notes: >-
  GO:0008093 is labelled "cytoskeletal anchor activity" here to match the GO
  snapshot used by the repository term validator; current GO names it
  "cytoskeletal adaptor activity", which is what the BICD2 and BicD gene reviews
  use. All PTN ids, GO ids, seeds and snapshot dates are verbatim from the cached
  PTHR31233-paint.tsv. Tree topology was read from the live PANTHER 19 treeinfo service
  on 2026-09-27. The root PTN001261414 (Eumetazoa, 69 leaves) sits over PTN000775322
  (Bilateria). The vertebrate duplication splits into the BICD1 clade PTN002830232
  (Euteleostomi, 21 leaves, all SF3) and the BICD2 lineage, which contains the tetrapod
  node PTN008630033 (19 leaves, all SF7). Drosophila BicD and C. elegans bicd-1 (both
  SF6) sit under the ecdysozoan node PTN000775338. Seed MGI ids were resolved via
  UniProt: MGI:1924145 = Bicd2 (Q921C5), MGI:1101760 = Bicd1 (Q8BR07). Main finding: the
  family is coherent, and PAINT's root-level terms (dynactin binding, dynein complex
  binding, Golgi, cytosol) hold for both reviewed members. The main defect is placement
  that is too shallow, not over-reach. Cytoskeletal adaptor activity (BICD1 node) and
  microtubule-based movement and dynein LIC binding (BICD2 node) are family-wide
  functions asserted only on single vertebrate clades. The recommendation is to raise
  GO:0008093 and GO:0007018 to PTN001261414 and to add GO:0140660 cytoskeletal motor
  activator activity there. The two weakest IBDs are the root-level GO:0072393
  (indirect, one study) and the BICD1-only GO:0048260, which should be checked when a
  BICD1 review is written. Naming: PANTHER's "BICAUDAL D FAMILY MEMBER" is accurate. The
  BICD-related adaptors (BICDL1/BICDR1, BICDL2, Drosophila BicDR) are classified
  separately in PTHR32123, so this family does not cover every BicD-like dynein adaptor.
  Modules: nucleokinesis.yaml models BICD2 as a GENE_PRODUCT (UniProtKB:Q8TD16), which
  is appropriate. If a family descriptor is ever wanted, PANTHER:PTHR31233 / "BICAUDAL D
  FAMILY MEMBER" with SF7 "PROTEIN BICAUDAL D HOMOLOG 2" is correct. PTN001261414 is the
  PAINT node to cite for the conserved dynein/dynactin-binding adaptor, and PTN008630033
  for BICD2-specific IBAs.
