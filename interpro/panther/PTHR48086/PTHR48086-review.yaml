family_id: PANTHER:PTHR48086
family_name: SODIUM/PROLINE SYMPORTER-RELATED
preferred_name: Sodium:solute symporter (SSS, TC 2.A.21) family of PutP, PanF, ActP and DUR31-type transporters
summary: 'Polytopic secondary transporters of the sodium:solute symporter (SSS, TC 2.A.21) family that
  couple uptake of a small organic solute to a cation gradient across the plasma (cytoplasmic) membrane.
  The family is dominated by bacteria and splits into substrate-specific subfamilies: the PutP sodium/proline
  symporters (SF3; E. coli, Salmonella, Klebsiella, Haemophilus, Staphylococcus, Bacillus and Pseudomonas
  PutP), the osmoregulated proline transporter OpuE (SF1), the sodium/pantothenate symporter PanF (SF4),
  the cation/acetate symporter ActP (SF6), monocarboxylate permeases (SF8), and a eukaryotic branch that
  includes the Candida albicans spermidine transporter DUR31 (SF10). E. coli PutP, the best-characterized
  member, accumulates L-proline with an approximately 1:1 Na+ stoichiometry and can also use Li+.'
functional_coherence: HETEROGENEOUS
coherence_reason: 'All characterized members are cation-coupled plasma-membrane solute transporters, so
  transmembrane transporter activity, transmembrane transport and plasma-membrane location are family-wide.
  The transported solute is not: proline (PutP, OpuE), pantothenate (PanF), acetate/glycolate (ActP) and
  spermidine (DUR31) are carried by different subfamilies, and PAINT accordingly places the substrate-specific
  terms on separate clade nodes. Substrate specificity must therefore be read at the subfamily or clade
  level, never from the family id.'
