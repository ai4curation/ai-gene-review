- subfamily_id: PANTHER:PTHR48086:SF3
  label: SODIUM_PROLINE SYMPORTER
  description: Bacterial PutP sodium/proline symporters. Reviewed members are E. coli PutP (P07117), Salmonella
    PutP (P10502), Klebsiella oxytoca PutP, Haemophilus influenzae PutP, the Staphylococcus PutP proteins
    and B. subtilis high-affinity PutP (P94392); Pseudomonas putida KT2440 PutP (Q88D81) and P. aeruginosa
