    of the bacterial fused-PutA proline catabolism module. The G27 B5Z6C0 record also assigns SF3 and
    IPR011851. Direct Helicobacter transport evidence is from strain P12 HPP12_0049, not G27; the G27
    gene review treats activity as comparative inference.
