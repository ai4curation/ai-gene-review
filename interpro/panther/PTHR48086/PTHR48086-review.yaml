- subfamily_id: PANTHER:PTHR48086:SF1
  label: OSMOREGULATED PROLINE TRANSPORTER OPUE
  description: B. subtilis OpuE, an osmotically inducible proline transporter. It receives the PutP-clade
    proline transport IBAs from PTN001371338 with SF3, so proline transport spans SF1 and SF3.
  diverged_from_family: false
