notes: 'Node reach was read from the PAINT UniProt GAF (.cache/panther/gene_association.paint_uniprot.gaf.gz)
  and subfamily membership from the PANTHER 19.0 organism classifications. The family id alone must not
  be used to select proline transport: the bacterial fused-PutA proline catabolism module therefore grounds
  its PutP step on SF3 with E. coli PutP (P07117) and P. putida KT2440 PutP (Q88D81) as representatives,
  both classified at SF3. OpuE (SF1) also inherits the proline-clade IBAs but is an osmoprotective uptake
  system rather than a catabolic one, so it is not a module representative. SF5 and SF7 have no reviewed
  members with checked substrates and are not described. No residue sites asserted; the Cys-344 proline/Na+
  binding observation is recorded only as support. The 2026-11-06 module audit adds a G27 family-based
  exemplar while retaining P12 experimental-strain provenance. Sodium-coupled does not mean sodium-exclusive:
  P12 reconstitution also allows Li+. No G27-specific Li+ annotation or universal same-strain PutA pairing
  is inferred.'
