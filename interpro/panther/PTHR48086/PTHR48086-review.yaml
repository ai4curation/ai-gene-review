      transporter
- subfamily_id: PANTHER:PTHR48086:SF4
  label: SODIUM_PANTOTHENATE SYMPORTER
  description: E. coli PanF (P16256) and its enterobacterial orthologs, sodium-dependent pantothenate
    uptake.
  diverged_from_family: true
  divergence_description: Substrate specificity diverged from proline to pantothenate; the transport mechanism
    and plasma-membrane location are retained.
  supported_by:
  - reference_id: PMID:2193919
    supporting_text: Pantothenate permease, the product of the panF gene, catalyzes the sodium-dependent
      uptake of extracellular pantothenate.
- subfamily_id: PANTHER:PTHR48086:SF6
  label: CATION_ACETATE SYMPORTER ACTP
  description: E. coli ActP (P32705, formerly YjcG) and orthologs, acetate and glycolate uptake.
  diverged_from_family: true
  divergence_description: Substrate specificity diverged to acetate/glycolate; the transport mechanism
    and membrane location are retained.
  supported_by:
  - reference_id: PMID:14563880
    supporting_text: suggested that the primary function of the yjcG gene product (proposed gene name,
      actP) could be acetate transport
- subfamily_id: PANTHER:PTHR48086:SF8
  label: MONOCARBOXYLIC ACID PERMEASE
  description: B. subtilis YodF and YhjB and related proteins named monocarboxylic acid permeases. No
    experimental substrate data were checked for this review; they receive only the root-level transporter
    terms.
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR48086:SF10
  label: AGR155CP
  description: Eukaryotic branch that includes Candida albicans DUR31 (A0A1D8PNR5), a spermidine transporter
    that also takes up the antifungal peptide histatin 5.
  diverged_from_family: true
  divergence_description: Eukaryotic polyamine (spermidine) transporters; the substrate differs from the
    bacterial clades.
  supported_by:
  - reference_id: PMID:22033918
    supporting_text: We found spermidine uptake and Hst 5 mediated killing were decreased significantly
      in Δdur3, Δdur31, and Δdur3/Δdur31 strains
