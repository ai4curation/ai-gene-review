  name:
    name: Inositol Phosphorylceramide Synthase-Related
    short: IPC_Synthase-Related
  description:
  - text: This family of proteins includes enzymes that are involved in the biosynthesis
      of sphingolipids, a class of lipids that play a crucial role in cell membrane
      structure and function. Members of this family are responsible for catalyzing
      the addition of a phosphorylinositol group to ceramide or dihydroceramide, forming
      inositol phosphorylceramide or phosphoinositol dihydroceramide, respectively.
      These reactions are essential steps in the production of complex sphingolipids.
      The activity of these enzymes is known to be inhibited by specific compounds,
      indicating a level of regulatory control over sphingolipid synthesis.
