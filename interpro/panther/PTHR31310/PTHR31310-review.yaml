family_id: PANTHER:PTHR31310
family_name: FAMILY NOT NAMED
preferred_name: Aur1/Ipt1 inositolphosphotransferase family
summary: >-
  Fungal PAP2-like inositolphosphotransferases of complex sphingolipid synthesis. Aur1 (S. cerevisiae
  AUR1, S. pombe aur1; SF11) transfers phosphoinositol from PI to ceramide, making IPC; it is the
  target of aureobasidin A. Ipt1 (SF8) adds a second phosphoinositol to MIPC, making M(IP)2C. Dictyostelium
  relatives form a separate subfamily.
functional_coherence: HETEROGENEOUS
coherence_reason: IPC synthase (SF11) and M(IP)2C synthase (SF8) use different acceptors.
