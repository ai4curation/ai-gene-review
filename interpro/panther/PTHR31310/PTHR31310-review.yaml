node_assessments:
- node_id: PANTHER:PTN001263009
  asserted_term:
    id: GO:0070916
    label: inositol phosphoceramide synthase complex
  evidence: IBD
  paint_snapshot: '20240305'
  seeds:
  - id: SGD:S000001487
  assessment: NEEDS_PRUNING
  proposed_action:
    paint_action: ADD_IRD
    target_node_id: PANTHER:PTN002416579
  assessment_reason: >-
    The IPC synthase complex is correct for Aur1 members but reaches the paralogous Ipt1 (SF8),
    whose review removes it. The GO:0070916 seed is S. cerevisiae AUR1 in the Aur1 clade, while
    S. cerevisiae IPT1 sits in the sibling three-leaf IPT1 clade, PTN002416579. Ipt1 makes
    M(IP)2C and no study places it in the Aur1-Kei1 complex. Add an IRD at PTN002416579 to prune
    the IPT1 clade without stripping S. pombe aur1 or the basidiomycete IPC-synthase leaves that
    are outside the seeded AUR1 clade.
    In the PANTHER 19.0 tree this Dikarya node holds 17 leaves in 2 subfamilies, and its single
    seed, AUR1 in SF11, sits 7 steps below. SF8 contributes 3 of the node's leaves and none of its
    seeds, consistent with pruning it.
  affected_subfamilies:
  - id: PANTHER:PTHR31310:SF8
    label: INOSITOLPHOSPHOTRANSFERASE 1
