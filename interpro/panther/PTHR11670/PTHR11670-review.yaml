family_id: PANTHER:PTHR11670
family_name: ACONITASE/IRON-RESPONSIVE ELEMENT FAMILY MEMBER
preferred_name: AcnA-type aconitases, iron-regulatory proteins and AcnD 2-methylcitrate dehydratases
summary: >-
  [4Fe-4S] hydro-lyases of the aconitase/IPM isomerase superfamily. The family comprises the
  AcnA-type aconitases of bacteria (Escherichia coli and Salmonella AcnA, Bacillus subtilis CitB,
  Mycobacterium Acn, Corynebacterium Acn), the cytosolic aconitases and iron-regulatory proteins of
  eukaryotes (human ACO1/IRP1 and IREB2/IRP2), plant aconitases, and the AcnD 2-methylcitrate
  dehydratases of the AcnD/PrpF branch of the bacterial 2-methylcitrate cycle (Shewanella oneidensis,
  Vibrio cholerae, Pseudomonas putida). Canonical members interconvert citrate and isocitrate. As
  apo-proteins, several bind RNA: the vertebrate IRPs bind iron-responsive elements, and bacterial
  AcnA binds the 3' untranslated regions of acnA and acnB mRNA. Salmonella AcnA also hydrates
  2-methyl-cis-aconitate to 2-methylisocitrate. AcnD has diverged: it dehydrates 2-methylcitrate and
  citrate but does not use isocitrate or 2-methylisocitrate, and it cannot replace aconitase in the
  TCA cycle.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Most members are TCA- or glyoxylate-cycle aconitases, but the family also contains the AcnD
  2-methylcitrate dehydratases, which catalyse only the first half-reaction of aconitase and are
  restricted to propionate catabolism, and iron-regulatory proteins whose principal role is RNA
  binding. IRE binding is a vertebrate IRP property, not a bacterial one. The PANTHER member
  inventory assigns no subfamilies, so these groups cannot be separated by subfamily accession.
