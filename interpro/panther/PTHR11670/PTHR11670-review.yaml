  assessment_reason: >-
    Iron-responsive elements are a eukaryotic mRNA motif bound by the vertebrate iron-regulatory
    proteins. Placing the term at the family root sends it to bacterial AcnA and AcnD. The proven
    bacterial RNA targets are the acnA and acnB 3' untranslated regions, which the E. coli and
    Salmonella AcnA reviews capture as mRNA 3'-UTR binding, and the S. oneidensis AcnD review
    removes the term. The gain belongs at the eukaryotic IRP clade.
