notes: >-
  Reviewed for the 2-methylcitrate cycle module (modules/methylcitrate_cycle.yaml), where this family
  grounds two steps: the AcnD dehydration in the AcnD/PrpF route, and the AcnA-family hydration of
  2-methyl-cis-aconitate. Eukaryote-specific nodes were recorded but left UNRESOLVED where they fall
  outside that scope. The PANTHER member inventory used here carries no subfamily assignments, so
  the AcnD and IRP clades cannot be named as affected subfamilies. A PTN-level clade_node_id for AcnD
  would be the right anchor once the tree is inspected.
