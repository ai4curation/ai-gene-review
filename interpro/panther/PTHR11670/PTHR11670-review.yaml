term_assessments:
- assessed_term:
    id: GO:0047456
    label: 2-methylisocitrate dehydratase activity
  scope: UNRESOLVED
  scope_reason: >-
    Demonstrated for Salmonella AcnA, which hydrates 2-methyl-cis-aconitate to 2-methylisocitrate,
    and expected for the canonical aconitases generally, but not shown for E. coli AcnA, and absent
    from AcnD, which does not use 2-methylisocitrate. With no subfamilies assigned, the term cannot
    be scoped by accession and should be transferred only with organism-specific evidence.
  supported_by:
  - reference_id: PMID:11294638
    supporting_text: Homogeneous AcnA protein of S. enterica had strong aconitase activity and
      catalyzed the hydration of the 2-methyl-cis-aconitate to yield 2-methylisocitrate.
  - reference_id: PMID:14702315
    supporting_text: AcnA used as positive control readily dehydrated 2-MIC, isocitrate, and citrate
      and hydrated cis -aconitate.
