  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    The node is S. cerevisiae SKI7 (Q08491), the whole-genome-duplication paralog of HBS1.
    Ski7 binds the exosome and the SKI complex through its N-terminal region and acts in
    3'-to-5' mRNA decay, whereas Hbs1 performs the translation-dependent functions; no
    translation-factor activity of Ski7 is known. Stopping the inherited translation term is
    right.
  supported_by:
