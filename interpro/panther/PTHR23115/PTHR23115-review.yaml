family_id: PANTHER:PTHR23115
family_name: TRANSLATION FACTOR
preferred_name: EF-Tu/eEF1A-type translational GTPases, eRF3/HBS1/SKI7 and the CysN ATP-sulfurylase GTPase subunits
summary: >-
  A large superfamily of TRAFAC-class GTPases with the EF-Tu-like G domain and two beta-barrel
  domains. Its eukaryotic members are translation factors: eEF1A, which delivers
  aminoacyl-tRNA to the ribosomal A site; eRF3 (S. cerevisiae SUP35, S. pombe sup35, human
  GSPT1/GSPT2), the GTPase partner of eRF1 in translation termination; and HBS1 (human HBS1L),
  which with Dom34/Pelota rescues stalled ribosomes. The budding-yeast HBS1 paralog SKI7, and
  a fission-yeast counterpart, have lost the translation roles and instead link the SKI complex
  to the cytoplasmic exosome in 3'-to-5' mRNA decay. The family also contains a bacterial
  branch that has been recruited to sulfur metabolism: CysN, the regulatory GTPase subunit of
  the heterodimeric CysD-CysN ATP sulfurylase, and the CysNC and NodQ fusions, which carry a
  C-terminal APS-kinase domain.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  GTP hydrolysis by the conserved G domain is common to all characterized members, but the
  processes it drives differ completely: translation elongation, termination, ribosome rescue,
  mRNA decay, and energy coupling of sulfate activation. The PANTHER subfamily axis does not
  separate them cleanly: SF170 (official name ELONGATION FACTOR 1-ALPHA 2) holds both fungal
  eEF1A (S. cerevisiae TEF2, S. pombe tef101-103) and the bacterial CysN/CysNC proteins (E. coli
  CysN, P. aeruginosa CysNC), and SF188 holds both HBS1 and SKI7. Only the GTPase activity is
  safe at family level.
