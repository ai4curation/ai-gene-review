term_assessments:
- assessed_term:
    id: GO:0003924
    label: GTPase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The conserved G domain hydrolyses GTP in eEF1A, eRF3, HBS1 and CysN (E. coli ATP sulfurylase
    GTPase activity is directly measured); SKI7 retains the domain. Safe family-wide.
  supported_by:
  - reference_id: PMID:1730615
    supporting_text: The enzyme exhibits a GTPase activity that is stimulated by ATP and further
      enhanced by SO4
- assessed_term:
    id: GO:0006412
    label: translation
  scope: UNRESOLVED
  scope_reason: >-
    Holds for the eukaryotic eEF1A, eRF3 and HBS1 clades, not for SKI7 or for the bacterial
    CysN/CysNC proteins. Because SF170 mixes eEF1A with CysN and SF188 mixes HBS1 with SKI7,
    applicability cannot be expressed by subfamily; it follows the PAINT nodes.
  supported_by:
  - reference_id: PMID:20947765
    supporting_text: these recycling activities are shared by the homologous translation termination
      factor complex eRF1:eRF3
- assessed_term:
    id: GO:0000103
    label: sulfate assimilation
  scope: UNRESOLVED
  scope_reason: >-
    Applies only to the bacterial CysN/CysNC/NodQ branch (NodQ supplies activated sulfate for
    Nod-factor sulfation rather than assimilation). It must not be applied to eukaryotic
    members, and the branch is not a PANTHER subfamily of its own.
  supported_by:
  - reference_id: PMID:2828368
    supporting_text: Insertion of a kanamycin resistance gene into plasmid or chromosomal cysN
      prevents sulfate activation
