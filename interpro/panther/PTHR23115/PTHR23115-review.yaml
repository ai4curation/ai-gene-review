notes: >-
  Module: aps_dependent_assimilatory_sulfate_reduction. The CysN regulatory GTPase unit (E. coli
  P23845, P. putida KT2440 CysNC Q88NA8) is grounded with NCBIfam TIGR02034 (sulfate
  adenylyltransferase, large subunit; integrated into InterPro IPR011779), not with a PTHR23115 id, because this family and its
  SF170 subfamily also contain translation factors; this review records the family the members
  belong to. The cached entries.csv lists 301 reviewed members without subfamily assignments.
  Subfamily placements quoted here are from PANTHER 19.0 organism classification files (E. coli,
  P. aeruginosa, S. cerevisiae, S. pombe, human, Arabidopsis) used to build the member index;
  Q88NA8 is classified at family level only. IRD node identities (SKI7 Q08491, SPAP8A3.05
  Q9UT10) were inferred from those files and the IRD taxa. IBA inheritance was checked in
  QuickGO for P23845, O50274, Q88NA8, P9WNM5, P68104, Q08491, Q9UT10, P32769 and O74774 on
  2026-11-03.
