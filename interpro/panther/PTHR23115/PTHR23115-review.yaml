- subfamily_id: PANTHER:PTHR23115:SF170
  label: ELONGATION FACTOR 1-ALPHA 2
  description: >-
    Functionally mixed in PANTHER 19.0. It contains fungal eEF1A proteins (S. cerevisiae TEF2
    P02994; S. pombe tef101, tef102, tef103) together with the bacterial sulfate-activation
    GTPases E. coli CysN (P23845) and P. aeruginosa CysNC (O50274). The P. putida KT2440 CysNC
    used by the module (Q88NA8) is classified only at family level. Translation terms must not
    be scoped to this subfamily, and the module's CysN annoton is selected by NCBIfam
    TIGR02034 (CysN; integrated into InterPro IPR011779) rather than by any PTHR23115 subfamily.
  representative_members:
