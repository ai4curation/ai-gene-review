  diverged_from_family: true
  divergence_description: >-
    The CysN/CysNC members are not translation factors: CysN couples GTP hydrolysis to APS
    formation by CysD, and CysNC adds an APS-kinase domain. They share the subfamily with
    eEF1A, so this subfamily is defined by sequence similarity, not function.
- subfamily_id: PANTHER:PTHR23115:SF188
  label: HBS1-LIKE PROTEIN
  description: >-
    HBS1 (S. cerevisiae P32769, S. pombe hbs1 O74774, human HBS1L) together with S. cerevisiae
    SKI7 (Q08491) and the S. pombe Ski7-like protein SPAP8A3.05 (Q9UT10). HBS1 rescues stalled
    ribosomes; SKI7 has subfunctionalized to exosome-SKI bridging in mRNA decay.
  representative_members:
  - id: UniProtKB:P32769
    label: Elongation factor 1 alpha-like protein
    gene_symbol: HBS1
    organism: Saccharomyces cerevisiae
  - id: UniProtKB:Q08491
    label: Superkiller protein 7
    gene_symbol: SKI7
    organism: Saccharomyces cerevisiae
  diverged_from_family: true
  divergence_description: >-
    The SKI7 lineages lost the ribosome-rescue and translation roles of HBS1 (PAINT IRDs at
    PTN000562662 and PTN000562674) and act as cofactors of the cytoplasmic exosome.
