  6,7-Dimethyl-8-ribityllumazine synthases condense 5-amino-6-ribitylamino-uracil with 3,4-dihydroxy-2-butanone
  4-phosphate, the penultimate step of riboflavin synthesis (bacterial RibH, S. cerevisiae RIB4,
  S. pombe rib4).
