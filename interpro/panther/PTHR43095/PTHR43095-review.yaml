family_id: PANTHER:PTHR43095
family_name: SUGAR KINASE
preferred_name: FGGY sugar kinase family (bacterial xylulokinase, fuculokinase, AI-2 kinase)
summary: >-
  FGGY carbohydrate kinases: D-xylulokinases (E. coli XylB), L-fuculokinase (FucK), rhamnulokinase,
  erythritol kinase, L-xylulose kinase (Lyx) and autoinducer-2 kinase (LsrK). Eukaryotic xylulokinases
  such as S. cerevisiae XKS1 belong to PTHR10196.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Sugar substrates differ by subfamily, and SF5 itself mixes xylulokinases, fuculokinases, rhamnulokinase
  and erythritol kinase.
subfamilies:
- subfamily_id: PANTHER:PTHR43095:SF6
  label: XYLULOSE KINASE
  description: D-xylulokinases (E. coli XylB).
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR43095:SF5
  label: XYLULOSE KINASE
  description: 'Mixed FGGY kinases: XylB, FucK, RhaB, EryA.'
  diverged_from_family: true
  divergence_description: Xylulokinases share SF5 with fuculokinases, rhamnulokinase and erythritol
    kinase.
- subfamily_id: PANTHER:PTHR43095:SF1
  label: AUTOINDUCER-2 KINASE
  description: Autoinducer-2 kinase LsrK.
  diverged_from_family: false
