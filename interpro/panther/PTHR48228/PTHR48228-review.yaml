preferred_name: Succinyl-Coa--D-Citramalate Coa-Transferase
summary: SUCCINYL-COA--D-CITRAMALATE COA-TRANSFERASE (PANTHER:PTHR48228) is characterized in PANTHER PAINT
  across 1 ancestral PTN node(s) (PANTHER:PTN007717897) with 3 IBD node assertion(s) and 0 term(s) carrying
  negated IRD/IKR branch blocks, covering mitochondrion (GO:0005739, CC), alpha-methylacyl-CoA racemase
  activity (GO:0008111, MF), bile acid metabolic process (GO:0008206, BP).
functional_coherence: HETEROGENEOUS
coherence_reason: Although PAINT records IBD assertion(s) for PANTHER:PTHR48228 (SUCCINYL-COA--D-CITRAMALATE
  COA-TRANSFERASE) only at PANTHER:PTN007717897 (Bilateria (NCBITaxon:33213)), interpro/panther/PTHR48228/PTHR48228-entries.csv
  spans multiple kingdoms and distinct catalytic activities (L-carnitine CoA-transferase (caiB, A1A788),
  CoA-transferase/lyase DddD (dddD, A6W2K8), 2-methylfumaryl-CoA isomerase (mct, A9WC36), Succinyl-CoA--L-malate
  CoA-transferase beta subunit (smtB, A9WC39)), indicating functional heterogeneity across the family.
