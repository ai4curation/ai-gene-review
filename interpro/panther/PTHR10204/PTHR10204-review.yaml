family_id: PANTHER:PTHR10204
family_name: NAD P H OXIDOREDUCTASE-RELATED
preferred_name: NQO1/NQO2 quinone reductase family
summary: >-
  FAD-dependent soluble flavoprotein quinone reductases. Mammalian NQO1 enzymes use NADH or NADPH
  to catalyze obligate two-electron quinone reduction. Mammalian NQO2 enzymes are paralogous
  homodimeric quinone reductases that diverged in cofactor preference: their efficient donor is
  reduced nicotinamide riboside or related N-ribosyl/N-alkyl dihydronicotinamides, although weak
  NADH-dependent turnover is still measurable. The small reviewed PANTHER member inventory also
  contains bacterial and fungal oxidoreductase-like SF34 members whose substrate/cofactor biology is
  less resolved.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The root two-electron quinone reductase chemistry and soluble cytosolic localization hold for
  human NQO1 and NQO2. NQO2 has shifted its efficient donor from NAD(P)H to NRH, so the inherited
  GO:0003955 term is secondary for NQO2 rather than its defining core activity.
