  - assessed_term:
      id: GO:0061514
      label: interleukin-34-mediated signaling pathway
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member of PTHR28606 is an IL34 ortholog that initiates the
      interleukin-34-mediated signaling pathway by binding and dimerizing CSF1R
      (whereas the sibling term GO:0038145 is defined by M-CSF/CSF1 binding to
      CSF1R). PAINT currently omits GO:0061514 at PTN002823014 despite IDA
      support on human IL34 (Q6ZMJ4, PMID:26754294).
    supported_by:
      - reference_id: PMID:26754294
        supporting_text: >-
          Through gene expression profiles and bioinformatics analysis, we
          identified interleukin-34 (IL-34) as a direct target of miR-28-5p, and
          the effects of miR-28-5p deficiency on HCC growth and metastasis was
          dependent on IL-34-mediated tumor-associated macrophage (TAM)
          infiltration.
      - reference_id: PMID:18467591
        supporting_text: >-
          One of the highly selective proteins was a previously undescribed
          ligand, designated interleukin-34 (IL-34), which stimulates monocyte
          viability but does not affect responses in a wide spectrum of other
          assays. In a separate functional screen, we used a collection of
          extracellular domains of transmembrane proteins to discover the
          receptor for IL-34, which was a known cytokine receptor,
          colony-stimulating factor 1 (also called macrophage colony-stimulating
          factor) receptor.
      - reference_id: PMID:30066957
        supporting_text: >-
          IL-34 is synthesized as a secreted homodimeric glycoprotein that binds
          to the extracellular domains of CSF-1R and receptor-type
          protein-tyrosine phosphatase-zeta (PTP-ζ) in addition to the
          chondroitin sulfate chains of syndecan-1. These interactions result in
          activating several signaling pathways that regulate major cellular
          functions, including proliferation, differentiation, survival,
          metabolism, and cytokine/chemokine expression in addition to cellular
          adhesion and migration.
