notes: >-
  PTHR28606 is a functionally homogeneous jawed-vertebrate cytokine family with
  a single subfamily (PTHR28606:SF1) rooted at Euteleostomi node PTN002823014.
  PAINT currently asserts GO:0005157 (macrophage colony-stimulating factor
  receptor binding) at PTN002823014 without GO:0005125 (cytokine activity) or
  GO:0061514 (interleukin-34-mediated signaling pathway); adding GO:0005125
  and GO:0061514 at PTN002823014 resolves the Category C receptor-ligand gap
  across vertebrate IL34 orthologs.
