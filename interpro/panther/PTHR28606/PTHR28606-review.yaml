        organism: Homo sapiens
        gene_review: genes/human/IL34/IL34-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      CSF1R binding is conserved across PTHR28606; however, GO:0005157
      (macrophage colony-stimulating factor receptor binding) sits under
      GO:0005102 (signaling receptor binding) rather than GO:0048018 (receptor
      ligand activity). Because human IL34 (Q6ZMJ4) was annotated only to
      GO:0005157 and lacked GO:0005125 (cytokine activity), PAINT propagated
      receptor binding without receptor ligand activity across vertebrate IL34
      orthologs, causing GO:0061514 (interleukin-34-mediated signaling pathway)
      to fail ligand-receptor signaling validation as a Category C gap. Node
      PTN002823014 should also assert GO:0005125 (cytokine activity).
