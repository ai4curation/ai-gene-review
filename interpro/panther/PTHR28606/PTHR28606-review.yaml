term_assessments:
  - assessed_term:
      id: GO:0005125
      label: cytokine activity
    scope: FAMILY_WIDE
    scope_reason: >-
      All members of PTHR28606 are secreted four-helix-bundle cytokines that
      act as extracellular receptor ligands to activate CSF1R. Adding GO:0005125
      at PTN002823014 resolves the Category C receptor-ligand gap for IL34
      across vertebrates.
    supported_by:
      - reference_id: PMID:18467591
        supporting_text: >-
          One of the highly selective proteins was a previously undescribed
          ligand, designated interleukin-34 (IL-34), which stimulates monocyte
          viability but does not affect responses in a wide spectrum of other
          assays. In a separate functional screen, we used a collection of
          extracellular domains of transmembrane proteins to discover the
          receptor for IL-34, which was a known cytokine receptor,
          colony-stimulating factor 1 (also called macrophage colony-stimulating
          factor) receptor.
      - reference_id: PMID:22483114
        supporting_text: >-
          Here, the crystal structure of dimeric IL-34 reveals a helical
          cytokine fold homologous to CSF-1, and we further show that the
          complex architecture of IL-34 bound to the N-terminal immunoglobulin
