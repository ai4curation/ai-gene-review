        supporting_text: >-
          One of the highly selective proteins was a previously undescribed
          ligand, designated interleukin-34 (IL-34), which stimulates monocyte
          viability but does not affect responses in a wide spectrum of other
          assays. In a separate functional screen, we used a collection of
          extracellular domains of transmembrane proteins to discover the
          receptor for IL-34, which was a known cytokine receptor,
          colony-stimulating factor 1 (also called macrophage colony-stimulating
          factor) receptor.
