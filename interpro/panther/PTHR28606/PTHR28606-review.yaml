family_id: PANTHER:PTHR28606
family_name: INTERLEUKIN-34
preferred_name: Interleukin-34
summary: >-
  Jawed-vertebrate (Euteleostomi) family of secreted homodimeric four-helix-bundle
  cytokines orthologous to human Interleukin-34 (IL34). Despite minimal primary
  sequence identity with macrophage colony-stimulating factor 1 (CSF1), IL34
  adopts a structurally homologous antiparallel four-helix bundle fold and binds
  the extracellular D2-D3 immunoglobulin-like junction of the macrophage
  colony-stimulating factor 1 receptor (CSF1R), driving receptor homodimerization,
  tyrosine autophosphorylation, and downstream MAPK/ERK, PI3K-AKT, FAK, and STAT3
  signaling. Expressed predominantly by epidermal keratinocytes and central
  nervous system neurons, IL34 is non-redundantly required for the development,
  homeostasis, and proliferation of Langerhans cells and microglia, and promotes
  monocyte survival and macrophage differentiation.
functional_coherence: COHERENT
