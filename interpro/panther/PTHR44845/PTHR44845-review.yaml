family_id: PANTHER:PTHR44845
family_name: CARRIER DOMAIN-CONTAINING PROTEIN
preferred_name: 'Fungal adenylation-PCP-reductase family: L-2-aminoadipate reductase (LYS2)'
summary: >-
  Fungal NRPS-like multidomain enzymes. SF1 holds the L-2-aminoadipate reductases (S. cerevisiae
  LYS2, S. pombe lys1) of the fungal alpha-aminoadipate lysine pathway. SF6 holds beta-alanine-activating
  enzymes and SF4 nonribosomal peptide synthetases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Only SF1 reduces aminoadipate; other subfamilies adenylate other substrates for secondary metabolites.
