  name:
    name: ATP-dependent AMP-binding Enzyme
    short: ATP-dep_AMP-bind_enz
  description:
  - text: The ATP-dependent AMP-binding enzyme family is involved in various biosynthetic
      processes, including the activation and adenylation of specific molecules like
      alpha-aminoadipate and amino acids, which are then reduced or incorporated into
      larger compounds such as peptides or polyketides. Members of this family play
      key roles in the synthesis of nonribosomal peptides, polyketides, and other
      secondary metabolites with diverse biological activities, including antibiotics
      like penicillin, pigments, toxins, and signaling molecules. They exhibit a modular
      architecture with domains responsible for substrate adenylation, thiolation,
      and reduction, although some lack the condensation domain typically required
      for peptide bond formation.
