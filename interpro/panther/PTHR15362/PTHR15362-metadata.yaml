  name:
    name: Phospholipid Synthase and Regulatory
    short: Phospholipid_Synth/Regulatory
  description:
  - text: The protein family is involved in the biosynthesis and regulation of key
      phospholipids in cellular membranes. Members of the family catalyze base-exchange
      reactions, where the polar head group of phosphatidylethanolamine (PE) or phosphatidylcholine
      (PC) is replaced by L-serine, leading to the production of phosphatidylserine
      (PS). This reaction is crucial for membrane biogenesis and function. Additionally,
      some members catalyze the synthesis of phosphatidylinositol (PtdIns) from CDP-diacylglycerol
      and inositol, a precursor for various phosphoinositides that play a pivotal
      role in cell signaling. The family includes enzymes that can also catalyze the
      reverse reaction of PtdIns synthase, acting as a regulatory mechanism to maintain
      cellular PtdIns content. Activity of these enzymes is regulated by various factors,
      including the presence of their lipid products, calcium ions, and other small
      molecules, highlighting their importance in maintaining lipid homeostasis within
      the cell.
