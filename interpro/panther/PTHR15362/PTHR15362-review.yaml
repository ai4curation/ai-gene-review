- assessed_term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  scope: UNRESOLVED
  scope_reason: >-
    The module asserts the ER membrane for PIS1, and the yeast review lists it as a site of the
    core activity. The base-exchange members are also generally described as ER enzymes, but
    that was not checked here against cached evidence. Family-wide scope is plausible but not
    established by this review.
  supported_by:
