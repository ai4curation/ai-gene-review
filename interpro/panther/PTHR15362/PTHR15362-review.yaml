family_id: PANTHER:PTHR15362
family_name: PHOSPHATIDYLINOSITOL SYNTHASE
preferred_name: Phosphatidylinositol synthase and base-exchange phosphatidylserine synthase family
summary: >-
  A eukaryotic family of multi-pass ER-membrane enzymes that work on phospholipid head groups.
  It contains two functionally distinct groups. The first is the CDP-diacylglycerol--inositol
  3-phosphatidyltransferases (PI synthases): yeast PIS1, S. pombe pis1, human CDIPT,
  Drosophila Pis and Arabidopsis PIS1/PIS2. These transfer the phosphatidyl group of CDP-DAG
  to myo-inositol, which is the only de novo route to phosphatidylinositol. The second is the
  animal and plant base-exchange phosphatidylserine synthases (PTDSS1, PTDSS2, plant PSS).
  These swap the head group of phosphatidylcholine or phosphatidylethanolamine for L-serine
  and do not use CDP-DAG. S. cerevisiae and S. pombe have only the PI synthase branch. Their
  CDP-DAG-dependent PS synthase (CHO1, pps1) is in the unrelated family PTHR14269.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family joins two different reactions: CDP-DAG-dependent PI synthesis in SF4 and SF25 and
  CDP-DAG-independent serine base exchange in SF7 and SF15. SF20 and SF32 are PS-synthase
  subfamilies by name and member annotation, but were not checked here. No specific MF term is
  safe for the family as a whole. The PAINT PI-synthase node, PTN000394714, is labelled
  Eukaryota but is placed on the PI-synthase clade. In the PAINT UniProt GAF only SF4/SF25 PI
  synthases receive GO:0003881. The PTDSS1/PTDSS2 base-exchange enzymes do not. The subfamily
  names also mix the two groups: SF7 (PHOSPHATIDYLSERINE SYNTHASE 2) contains Arabidopsis and
  rice PSS1 as well as vertebrate PTDSS2.
