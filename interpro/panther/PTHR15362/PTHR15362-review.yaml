notes: >-
  The PAINT file was fetched with just fetch-panther-paint. It has one node, PTN000394714, with
  three terms. IBA recipients were listed from the PAINT UniProt GAF (PANTHER 19). Several seed
  identifiers were not resolved to gene symbols here and are given without labels: the
  Arabidopsis, Candida and Drosophila seeds, C0H5B7 and Q38FY6. The family name in the
  InterPro metadata ("Phospholipid Synthase and Regulatory") differs from the panther.obo name
  used here. Module consistency: the module scopes the PIS1 annoton to SF4, which is correct.
  The module's note that mammals make PS by base exchange matches PANTHER, which puts those
  enzymes (PTDSS1/2) in this family, while the fungal CDP-DAG PS synthase CHO1 is in PTHR14269.
  No PI synthase other than yeast PIS1 has a gene review (S. pombe pis1 Q10153, human CDIPT
  O14735).
