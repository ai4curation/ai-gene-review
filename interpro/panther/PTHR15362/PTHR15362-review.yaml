term_assessments:
- assessed_term:
    id: GO:0003881
    label: CDP-diacylglycerol-inositol 3-phosphatidyltransferase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    This is the activity of the PI-synthase clade only, which is how PAINT applies it from
    PTN000394714. It must not descend to the base-exchange PS synthases (SF7, SF15, and by name SF20 and
    SF32).
    The yeast PIS1 review accepts the IBA as the core activity.
  applicable_subfamilies:
  - id: PANTHER:PTHR15362:SF4
    label: CDP-DIACYLGLYCEROL--INOSITOL 3-PHOSPHATIDYLTRANSFERASE
  - id: PANTHER:PTHR15362:SF25
    label: CDP-DIACYLGLYCEROL--INOSITOL 3-PHOSPHATIDYLTRANSFERASE 1
  supported_by:
  - reference_id: PMID:3031032
    supporting_text: The wild-type yeast nuclear gene, PIS, encodes phosphatidylinositol synthase (CDPdiacylglycerol-inositol
      3-phosphatidyltransferase, EC 2.7.8.11)
  - reference_id: PMID:19014349
    supporting_text: PS (phosphatidylserine) in mammalian cells is synthesized by two distinct base-exchange
      enzymes
  - reference_id: file:genes/yeast/PIS1/PIS1-ai-review.yaml
    supporting_text: IBA from PTN000394714 (eukaryotic PIS incl. S. pombe, Candida, fly, plant members and Pis1).
