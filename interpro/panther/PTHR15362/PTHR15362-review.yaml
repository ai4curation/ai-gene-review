  scope: SUBFAMILY_ONLY
  scope_reason: >-
    PAINT co-asserts this location at the PI-synthase node, so in practice it reaches only PI
    synthases. The yeast review accepts it, with ER and mitochondrial outer membrane as the
    other sites. The base-exchange PS synthases are ER/MAM enzymes and were not assessed for
