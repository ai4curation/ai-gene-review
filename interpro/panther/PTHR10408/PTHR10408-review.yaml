family_id: PANTHER:PTHR10408
family_name: STEROL O-ACYLTRANSFERASE
preferred_name: MBOAT sterol/diacylglycerol O-acyltransferase family (SOAT/ARE and DGAT1)
summary: >-
  ER membrane-bound O-acyltransferases (MBOAT) that esterify neutral lipids with acyl-CoA. The family
  contains the sterol O-acyltransferases (animal SOAT1/2, fungal ARE1/ARE2 and S. pombe are1/are2),
  which make sterol esters, and DGAT1 of animals and plants, which makes triacylglycerol from diacylglycerol.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Acyl acceptor specificity is set by subfamily: sterols for SOAT/ARE (SF6, SF9, SF10, SF23), diacylglycerol
  for DGAT1 (SF7, SF12, SF22).
