family_id: PANTHER:PTHR10520
family_name: TRIFUNCTIONAL PURINE BIOSYNTHETIC PROTEIN ADENOSINE-3-RELATED
preferred_name: PurM AIR synthetase family, including the fungal PurD-PurM and animal GART fusions
summary: >-
  The family is defined by the PurM fold (Pfam AIRS and AIRS_C). PurM, AIR synthetase or
  phosphoribosylformylglycinamidine cyclo-ligase (EC 6.3.3.1), uses ATP to close the imidazole ring
  of FGAM and give 5-aminoimidazole ribonucleotide, step 5 of de novo purine synthesis. Most members
  are standalone bacterial and archaeal PurM enzymes and plant plastid PUR5. PANTHER classifies whole
  proteins, so two multifunctional eukaryotic fusions are also in this family. In fungi, ADE5,7 (S.
  cerevisiae) and ade1 (S. pombe) join an N-terminal PurD-type GAR synthetase to the AIR synthetase.
  In animals, GART (human, mouse, chicken, Drosophila ade3) adds a C-terminal PurN-type GAR
  transformylase as well. Those extra domains are not homologous to PurM. Their standalone
  counterparts are classified in PTHR43472 (PurD) and PTHR43369 (PurN).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  AIR synthetase activity is shared by every member. The fusion partners are not. GAR synthetase
  (PurD) activity exists only in the fungal ADE5,7-type and animal GART-type fusions (Pfam GARS_A,
  GARS_N, GARS_C), and GAR transformylase (PurN) activity only in animal GART (Pfam Formyl_trans_N).
  All reviewed entries are in the single subfamily SF12. Its 473 standalone PurM proteins and its
  handful of fusions therefore carry the same subfamily label, and the fusion-domain activities cannot
  be scoped by subfamily.
