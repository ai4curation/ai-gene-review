notes: >-
  Recipient lists come from the PAINT UniProt GAF. Inconsistencies with gene reviews: the ADE57 review
  says the PTN000055158 node is "correctly placed" for GO:0004637. That is true for ADE5,7 itself,
  but the node is too deep for the family as a whole. The P. putida purM review attributes its
  removed GO:0004637 annotation to "PTN002237315". That annotation is an IEA (GO_REF:0000118,
  TreeGrafter), not a PAINT IBA, and PTN002237315 does not occur in this family's PAINT file. Its
  reasoning matches the TOO_DEEP verdict here. The S. pombe ade1 review (COMPLETE) accepts GO:0004637,
  GO:0004641, cytosol and GO:0006164 and changes GO:0046084 to GO:0006189. That is consistent here,
  because ade1 is a fusion member. The PANTHER obo lists SF15, SF16, SF17
  (PHOSPHORIBOSYLFORMYLGLYCINAMIDINE CYCLO-LIGASE) and SF18, none of which has reviewed entries in
  this export.
