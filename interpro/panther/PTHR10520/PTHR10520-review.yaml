- node_id: PANTHER:PTN000055158
  asserted_term:
    id: GO:0004637
    label: phosphoribosylamine-glycine ligase activity
  paint_snapshot: '20210903'
  seeds:
  - id: FB:FBgn0000053
    label: ade3
    organism: Drosophila melanogaster
  - id: MGI:MGI:95654
    label: Gart
    organism: Mus musculus
  - id: PomBase:SPBC405.01
    label: ade1
    organism: Schizosaccharomyces pombe
  - id: RGD:1308717
    label: Gart
    organism: Rattus norvegicus
  assessment: TOO_DEEP
  assessment_reason: >-
    All four seeds are eukaryotic fusion proteins whose GAR synthetase activity sits in an N-terminal
    GARS (ATP-grasp) domain. That domain is not homologous to the AIRS domain that defines this
    family. The IBD sits on the same node as the PurM activity, the common ancestor of standalone
    PurM and the fusions, so in the PAINT GAF every standalone PurM inherits GO:0004637. Recipients
    include E. coli PurM (P08178, itself a seed for the AIR synthetase term), B. subtilis PurM
    (P12043), dozens of other bacterial and archaeal PurM proteins, and Arabidopsis plastid PUR5
    (Q05728). None of these has a GARS domain. The P. putida purM review removes the corresponding
    electronic GO:0004637 annotation on the same grounds. The function belongs to the
    eukaryotic fusion lineage(s) only. The PTN for that clade has not been identified from the
    available PAINT data, so no replacement node is named. ADE5,7, ade1 and GART legitimately keep the
    term. No affected subfamily is listed: SF12 holds both the fusions, which keep the term, and the
    standalone PurM proteins, which should not have it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10520/PTHR10520-paint.tsv
    supporting_text: "PTHR10520\tPTN000055158\tGO:0004637\tF\tIBD\tfalse\tFB:FBgn0000053|MGI:MGI:95654|PomBase:SPBC405.01|RGD:1308717"
  - reference_id: file:genes/PSEPK/purM/purM-ai-review.yaml
    supporting_text: Q88MA9 contains AIRS and AIRS_C domains (Pfam PF00586/PF02769) with PurM-specific IPR004733.
  - reference_id: PMID:3502942
    supporting_text: >-
      The ade1 gene of the fission yeast Schizosaccharomyces pombe encodes a bifunctional polypeptide
      with glycinamide ribotide synthetase (GARSase) and aminoimidazole ribotide synthetase (AIRSase)
      enzyme activities.
- node_id: PANTHER:PTN000055158
  asserted_term:
    id: GO:0046084
    label: adenine biosynthetic process
  paint_snapshot: '20180316'
  seeds:
  - id: CGD:CAL0000199243
    organism: Candida albicans
  assessment: UNRESOLVED
  assessment_reason: >-
    The only seed is a Candida ADE5,7 (ADE1) experimental annotation. Placed at PTN000055158, it
    reaches every member, including bacterial PurM. The de novo pathway makes IMP and from it AMP,
    never free adenine, and GO defines the term as synthesis of the nucleobase 6-aminopurine.
    Fungal curators nevertheless use GO:0046084 for de novo purine enzymes whose mutants are adenine
    auxotrophs. Gene reviews disagree: ADE57, S. pombe ade1 and ade5 replace it with GO:0006189,
    GART marks it over-annotated, and the P. putida purM review accepts it as established GO usage.
    This is a GO-usage question, not a phylogenetic one, and it is not decided here.
term_assessments:
- assessed_term:
    id: GO:0004641
    label: phosphoribosylformylglycinamidine cyclo-ligase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member carries the AIRS/AIRS_C domains that define the family, and the IBA comes from a sound
    node. This is the term the module attaches to PTHR10520:SF12 for the PurM leaf.
  supported_by:
  - reference_id: PMID:10508786
    supporting_text: >-
      AIR synthetase uses the product of PurL, formylglycinamidine ribonucleotide (FGAM) and ATP to
      make AIR, ADP and P(i).
  - reference_id: PMID:3502942
    supporting_text: >-
      The ade1 gene of the fission yeast Schizosaccharomyces pombe encodes a bifunctional polypeptide
      with glycinamide ribotide synthetase (GARSase) and aminoimidazole ribotide synthetase (AIRSase)
      enzyme activities.
- assessed_term:
    id: GO:0004637
    label: phosphoribosylamine-glycine ligase activity
  scope: UNRESOLVED
  scope_reason: >-
    The term is safe only for the fusion members that carry a GARS domain: fungal ADE5,7/ade1-type
    proteins, Dictyostelium bifunctional purD, and animal GART. It is not safe for the standalone
    bacterial, archaeal and plant PurM proteins that make up most of SF12. All of these share the
    single subfamily SF12, so neither FAMILY_WIDE nor SUBFAMILY_ONLY fits. The clade-level fix is the
    TOO_DEEP correction at PTN000055158. In the module, the purD_activity leaf's use of
    PTHR10520:SF12 as a family_term is valid only together with its fusion exemplars (ADE57, ade1,
    GART). Standalone PurD is covered by PTHR43472.
  supported_by:
  - reference_id: file:genes/yeast/ADE57/ADE57-uniprot.txt
    supporting_text: Pfam; PF01071; GARS_A; 1.
  - reference_id: file:genes/PSEPK/purM/purM-uniprot.txt
    supporting_text: Pfam; PF02769; AIRS_C; 1.
  - reference_id: PMID:3097325
    supporting_text: >-
      In Saccharomyces cerevisiae, glycinamide ribotide synthetase and aminoimidazole ribotide
      synthetase are encoded at the ADE5,7 locus.
- assessed_term:
    id: GO:0004644
    label: phosphoribosylglycinamide formyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    PAINT asserts no GAR transformylase term in this family. The module lists PTHR10520:SF12 as a
    family_term for the folate-dependent PurN leaf, but within SF12 only animal trifunctional GART
    (Pfam Formyl_trans_N) has the transformylase domain. Fungal ADE5,7/ade1 lack it, because fungi use
    the standalone ADE8/ade5 (PTHR43369). Standalone PurM lacks it as well. The term is safe for the
    GART clade only, which no subfamily delimits. As a family_term this is a module over-reach that
    the GART exemplar does not fix.
  supported_by:
  - reference_id: file:genes/human/GART/GART-uniprot.txt
    supporting_text: Pfam; PF00551; Formyl_trans_N; 1.
  - reference_id: PMID:3097325
    supporting_text: >-
      These results, together with the sequence of the S. cerevisiae ADE8 gene encoding glycinamide
      ribotide transformylase, show that the entire Drosophila large polypeptide can be accounted for
      by the three enzymatic activities.
- assessed_term:
    id: GO:0006189
    label: '''de novo'' IMP biosynthetic process'
  scope: FAMILY_WIDE
  scope_reason: >-
    AIR synthesis (and, in the fusions, GAR synthesis and formylation) are steps of de novo IMP
    synthesis. This is the core process in the ADE57, GART and P. putida purM reviews and the module's
    pathway concept. The PAINT process IBA GO:0006164 purine nucleotide biosynthetic process is a
    correct but general parent.
- assessed_term:
    id: GO:0006164
    label: purine nucleotide biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    This is a correct general parent of the de novo pathway, inherited from PTN000055158. The ADE57
    review accepts it, and the GART review keeps it as non-core.
- assessed_term:
    id: GO:0046084
    label: adenine biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    If GO:0046084 is accepted as covering de novo purine-ring assembly, as the Candida seed and the
    P. putida purM review take it, it would apply family-wide. If it is read literally as synthesis of
    free adenine, it applies to no member, and GO:0006189 is the correct process (the ADE57, ade1,
    ade5 and GART reviews). The repository's gene reviews currently disagree. See the UNRESOLVED
    PTN000055158 node assessment.
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: UNRESOLVED
  scope_reason: >-
    This is correct for the bacterial enzymes and the fungal and animal fusions (seeds E. coli PurM,
    mouse and human GART). The IBA from PTN000055158 also reaches the plant PUR5 enzymes, which are
    plastid/mitochondrion-targeted (Arabidopsis Q05728 is named chloroplastic/mitochondrial), so the
    term is not safe for the plant branch.
