  assessment: SOUND
  assessment_reason: >-
    The seeds include both standalone bacterial PurM (E. coli) and fusions (GART, ade1, fly ade3). All
    members carry the AIRS domain, so the shared AIR synthetase activity is correctly placed on the
    common ancestor. The ADE57 and GART reviews accept it, and it is the core function in the P.
    putida purM review.
  supported_by:
