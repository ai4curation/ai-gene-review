    label: ligase activity
  scope: UNRESOLVED
  scope_reason: HERC members possess a catalytic HECT domain in addition to RCC1-like repeats, whereas
    the 169-residue Drosophila target contains only RCC1-repeat material. This architecture does not support
    intrinsic ligase catalysis in that selected product. Because full HERC proteins genuinely are ligases,
    the member-level refutation cannot become a family-wide negative; the complete HECT-competent branch
    boundary remains unresolved.
