family_id: PANTHER:PTHR22872
family_name: BTK-BINDING PROTEIN-RELATED
preferred_name: RCC1-repeat multidomain proteins
summary: RCC1-like repeats occur in HERC ubiquitin ligases, RCC1/BTB proteins, RPGR and secretion-associated
  exchange-factor architectures. Their common repeat fold does not supply the catalytic domains of these
  distinct full-length proteins.
functional_coherence: HETEROGENEOUS
coherence_reason: The Drosophila pseudoobscura target is a short RCC1-repeat protein without evidence
  for a HECT catalytic module. Ligase activity is therefore not justified for that sequence, although
  it occurs in HERC members of the wider family. A target-level negative must not become a denial of ligase
  function throughout the family.
