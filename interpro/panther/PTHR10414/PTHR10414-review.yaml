family_id: PANTHER:PTHR10414
family_name: ETHANOLAMINEPHOSPHOTRANSFERASE
summary: Choline/ethanolamine phosphotransferases use activated CDP-aminoalcohol donors to synthesize
  membrane phospholipids. The family contains choline-selective enzymes, ethanolamine-selective enzymes
  and dual-specificity CEPT enzymes. Donor specificity and the lipid acceptor define the reaction more
  precisely than the shared membrane phosphotransferase fold.
functional_coherence: HETEROGENEOUS
coherence_reason: The family spans phosphobase-transfer enzymes with different donor specificity, including
  CHPT1, SELENOI/EPT1 and dual-specificity CEPT1 branches. Human CEPT1 catalyzes phosphatidylcholine and
  phosphatidylethanolamine synthesis using CDP-choline or CDP-ethanolamine and diacylglycerol; mixed-micelle
  assays also resolve acceptor-lipid preferences (PMID:12216837). Thus phosphatidylethanolamine synthesis
  is supported for characterized ethanolamine-accepting branches, but not for every choline-preferring
  relative. The fly CG33116 assignment alone does not establish donor specificity or a ceramide rather
  than diacylglycerol acceptor.
