    gene_symbol: aceE
    organism: Escherichia coli (strain K12)
    gene_review: genes/ECOLI/aceE/aceE-ai-review.yaml
  - id: UniProtKB:Q88QZ5
    gene_symbol: aceE
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/aceE/aceE-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: file:interpro/panther/PTHR43825/PTHR43825-entries.csv
    supporting_text: P0AFG8,Pyruvate dehydrogenase E1 component,protein,83333
- subfamily_id: PANTHER:PTHR43825:SF1
  label: TRANSKETOLASE-LIKE PYRIMIDINE-BINDING DOMAIN-CONTAINING PROTEIN
  description: >-
    Transketolase-like ThDP subunits of sugar and sulfosugar catabolism (AptB, SqwH) and
    uncharacterised transketolase C-terminal sections. They are not pyruvate dehydrogenases.
  diverged_from_family: true
  divergence_description: >-
    Named members act as transketolase subunits on sugar phosphates (apulose-4-phosphate,
    6-deoxy-6-sulfo-D-fructose) rather than as pyruvate dehydrogenase E1.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43825/PTHR43825-entries.csv
    supporting_text: J1H0Z7,6-deoxy-6-sulfo-D-fructose transketolase subunit SqwH,protein,1105031
  - reference_id: file:interpro/panther/PTHR43825/PTHR43825-entries.csv
    supporting_text: A6KXB3,Apulose-4-phosphate transketolase subunit B,protein,435590
term_assessments:
- assessed_term:
    id: GO:0004739
    label: pyruvate dehydrogenase (acetyl-transferring) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Experimentally established for E. coli AceE (structure, kinetics and reductive acetylation of
    E2p) and carried by every named SF3 member. SF1 members are transketolase-like subunits of
    sugar catabolism, so the PDH E1 activity does not extend to the whole family. PAINT has no
    node-level annotations for PTHR43825 (68 nodes, none annotated).
  applicable_subfamilies:
  - id: PANTHER:PTHR43825:SF3
    label: PYRUVATE DEHYDROGENASE E1 COMPONENT
  supported_by:
  - reference_id: file:genes/ECOLI/aceE/aceE-ai-review.yaml
    supporting_text: AceE is the experimentally characterised ThDP-dependent E1 of the E. coli PDH complex
  - reference_id: PMID:17635929
    supporting_text: We showed that residue His-407 on the inner loop has a key role in the mechanism,
      especially in the reductive acetylation of the E. coli dihydrolipoamide transacetylase component
- assessed_term:
    id: GO:0030976
    label: thiamine pyrophosphate binding
  scope: FAMILY_WIDE
  scope_reason: >-
    ThDP is the cofactor of PDH E1 (shown structurally for E. coli AceE) and of transketolase-like
    enzymes; SF1 is defined by the transketolase-like pyrimidine-binding (ThDP) domain.
  supported_by:
  - reference_id: PMID:11955070
    supporting_text: The ThDP cofactors are bound in the "V" conformation in clefts between the two subunits
  - reference_id: file:interpro/panther/PTHR43825/PTHR43825-entries.csv
