family_id: PANTHER:PTHR43825
family_name: PYRUVATE DEHYDROGENASE E1 COMPONENT
preferred_name: Homodimeric pyruvate dehydrogenase E1 and transketolase-like ThDP enzymes
summary: >-
  Thiamine diphosphate-dependent enzymes of the transketolase superfamily. The main subfamily
  (SF3) is the homodimeric (alpha2) bacterial pyruvate dehydrogenase E1 component (AceE), which
  decarboxylates pyruvate and reductively acetylates the lipoyl domains of the E2 core, as in
  Escherichia coli, Pseudomonas, Corynebacterium glutamicum and Mycobacterium tuberculosis. A
  second, smaller subfamily (SF1) holds two-part transketolase-like enzymes of sugar
  catabolism, such as the apulose-4-phosphate transketolase subunit AptB and the
  6-deoxy-6-sulfo-D-fructose transketolase subunit SqwH, which do not act on pyruvate.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  ThDP-dependent catalysis is shared, but the reaction differs by subfamily: SF3 members are PDH
  E1 enzymes, whereas SF1 members are named transketolase-like subunits of carbohydrate and
  sulfosugar degradation pathways.
reference_protein:
  id: UniProtKB:P0AFG8
  label: Pyruvate dehydrogenase E1 component
  gene_symbol: aceE
  organism: Escherichia coli (strain K12)
  gene_review: genes/ECOLI/aceE/aceE-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43825:SF3
  label: PYRUVATE DEHYDROGENASE E1 COMPONENT
  description: >-
    Homodimeric bacterial PDH E1 (AceE). All 12 Swiss-Prot members in the family inventory are
    named pyruvate dehydrogenase E1 components (E. coli, Haemophilus, Buchnera, Pseudomonas
    aeruginosa, Cupriavidus, Corynebacterium glutamicum, Mycobacterium tuberculosis and M.
    smegmatis); P. putida KT2440 AceE is also classified here.
  representative_members:
