  name:
    name: Tumor Necrosis Factor Receptor Superfamily Member 6
    short: TNFRSF6
  description:
  - text: The TNF receptor superfamily member 6 (TNFRSF6) family includes receptors
      that play a crucial role in the regulation of apoptosis. Members of this family
      typically contain a death domain that is essential for the binding of FADD and
      possibly other cytosolic adapter proteins. Upon binding with their ligand TNFSF6/FASLG,
      these receptors recruit FADD, which in turn recruits caspase-8 to the activated
      receptor complex known as the death-inducing signaling complex (DISC). DISC
      facilitates the proteolytic activation of caspase-8, initiating a cascade of
      caspases that lead to apoptosis. This process is important for peripheral tolerance
      and the antigen-stimulated suicide of mature T-cells. Some family members, however,
      lack a death domain and protect against apoptosis by competing for ligands,
      without inducing the NF-kappa-B pathway.
