    id: GO:0016298
    label: lipase activity
  scope: UNRESOLVED
  scope_reason: Pat17 mutagenesis establishes a Ser-Asp-dependent lipid acyl hydrolase, and the wheat
    alignment shows deletion of the serine-containing half of that catalytic domain. This is positive
    family evidence with a specific incomplete-product exception. Lipase activity cannot be granted from
    a surviving patatin fragment, and the available member set does not delimit all catalytically competent
    branches.
