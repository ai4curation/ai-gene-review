notes: 'WHEAT/A0A3B6GK97: requested accession A0A3B6GK97; current record A0A3B6GK97; sequence length 302;
  source cohort ARGO50. Family boundaries were assessed using the fetched member set and the cited domain,
  literature and analytical evidence. Gene-review verdicts and ARBA assertions are not independent validation.
  PANTHER subfamily labels and membership are recorded from the frozen UniProt records and panther.obo;
  they do not by themselves prove functional uniformity within a subfamily. PAINT rows were inspected
  as ancestral assertions, but node placement is not adjudicated without the relevant descendant tree/alignment.
  No residue requirement is encoded without a verified sequence-version anchor. A target-level refutation
  is not a family-wide NOT_APPLICABLE judgment. Exact protein-name-only predictions are treated as family-identification
  hypotheses rather than invented GO predictions. Fresh UniProt records for P07745 (patatin), O48723 (PLP2),
  P0DTE9 (CapV), and A0A3B6GK97 independently retain PTHR32176 assignments. Q8LPW4 Patatin-17 is present
  in the family member table. The official XYLOSE ISOMERASE label is therefore preserved verbatim while
  the biological description follows the verified patatin members and experimental lipase evidence. InterPro''s
  patatin narrative is marked LLM-generated and is not used as independent validation.'
