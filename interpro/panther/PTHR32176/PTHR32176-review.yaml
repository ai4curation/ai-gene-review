    id: GO:0016042
    label: lipid catabolic process
  scope: UNRESOLVED
  scope_reason: Lipid hydrolysis by intact patatins can contribute to lipid catabolism. Loss of the catalytic
    region in the wheat product argues against intrinsic hydrolysis but does not exclude every indirect
    lipid-metabolic interaction. A physiological lipid-catabolic role, its substrate and the complete
    distribution of active versus noncatalytic family members remain unestablished.
