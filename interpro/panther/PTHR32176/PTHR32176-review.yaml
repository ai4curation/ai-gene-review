family_id: PANTHER:PTHR32176
family_name: XYLOSE ISOMERASE
preferred_name: Patatin-like lipolytic acyl hydrolases
summary: Patatin-like proteins include plant lipid hydrolases and bacterial phospholipase effectors. Intact
  catalytic domains support lipid ester hydrolysis, whereas truncated or inactive members retain family
  resemblance without the reaction. The current PANTHER vocabulary label 'xylose isomerase' does not describe
  the retrieved members.
functional_coherence: HETEROGENEOUS
coherence_reason: A0A3B6GK97 lacks the N-terminal serine-containing catalytic region in the reproducible
  alignment. This blocks intrinsic lipase transfer to that deposited sequence, not lipid metabolism in
  every patatin homolog. Distinguish gene-model truncation from evolutionary catalytic loss.
