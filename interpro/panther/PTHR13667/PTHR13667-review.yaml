family_id: PANTHER:PTHR13667
family_name: HOMOLOC-13
preferred_name: Fritz/WDPCP polarity and ciliogenesis effectors
summary: Fritz/WDPCP proteins organize cytoskeletal and membrane-associated machinery involved in cell
  polarity and ciliogenesis. Mammalian WDPCP participates in the CPLANE machinery that recruits intraflagellar
  transport components, while fly Fritz is associated with patterned wing-cell protrusions. These are
  related cellular organization functions, not evidence for a catalytic activity encoded by the WD-repeat
  fold.
functional_coherence: COHERENT
coherence_reason: Human and mouse WDPCP form the structurally resolved CPLANE complex with Inturned and
  Fuzzy (PMID:35427153). Fly Fritz functions downstream of core planar-polarity proteins to position and
  limit wing prehairs (PMID:15654087). These observations support a conserved cytoskeletal-organization
  effector family, while cilium assembly and wing-hair morphogenesis are distinct cellular implementations;
  a WD-repeat fold is not evidence of catalytic activity.
