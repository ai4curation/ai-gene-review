family_id: PANTHER:PTHR11686
family_name: GAMMA GLUTAMYL TRANSPEPTIDASE
preferred_name: Gamma-glutamyltransferase (GGT) family
summary: >-
  Ntn-hydrolase gamma-glutamyltransferases cleave the gamma-glutamyl bond of glutathione and its
  conjugates, either hydrolysing it or transferring the gamma-glutamyl group to an acceptor. Animal
  GGT1 is a plasma-membrane ectoenzyme. S. cerevisiae ECM38/CIS2 and S. pombe ggt1/ggt2 are vacuolar
  and degrade glutathione.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed members are glutathione hydrolases; they differ in compartment (cell surface in animals,
  vacuole in fungi).
