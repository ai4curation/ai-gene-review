family_name: SOLUTE CARRIER FAMILY 52
preferred_name: Solute Carrier Family 52
summary: SOLUTE CARRIER FAMILY 52 (PANTHER:PTHR12929) is characterized in PANTHER PAINT across 2 ancestral PTN node(s)
  (PANTHER:PTN000309189, PANTHER:PTN000986065) with 5 IBD node assertion(s) and 2 term(s) carrying negated IRD/IKR
  branch blocks, covering urate transmembrane transporter activity (GO:0015143, MF), urate transport (GO:0015747,
  BP), plasma membrane (GO:0005886, CC), riboflavin transmembrane transporter activity (GO:0032217, MF) and 1 additional
  GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR12929 (SOLUTE CARRIER FAMILY 52) span 2 distinct ancestral PTN
  nodes (PANTHER:PTN000309189, PANTHER:PTN000986065), reflecting a clade-specific gain of urate transmembrane
  transporter activity (GO:0015143) and urate transport (GO:0015747) at PANTHER:PTN000309189 (Catarrhini,
  PANTHER:PTHR12929:SF20) alongside ancestral riboflavin transmembrane transporter activity (GO:0032217) and
  riboflavin transport (GO:0032218) across the family rather than a substitution.
