family_id: PANTHER:PTHR12929
family_name: SOLUTE CARRIER FAMILY 52
preferred_name: Riboflavin transporters (SLC52)
summary: >-
  PTHR12929 is the SLC52 family of riboflavin transporters (RFVT1-3 in human: SLC52A1, SLC52A2, SLC52A3),
  plasma-membrane carriers that take up riboflavin in intestine, kidney, brain and other tissues.
functional_coherence: COHERENT
coherence_reason: All characterised members transport riboflavin, including SLC52A1 by direct assay.
