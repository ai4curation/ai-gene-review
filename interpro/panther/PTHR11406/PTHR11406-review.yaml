family_id: PANTHER:PTHR11406
family_name: PHOSPHOGLYCERATE KINASE
preferred_name: Phosphoglycerate kinase (PGK) family
summary: >-
  Phosphoglycerate kinases transfer phosphate from 1,3-bisphosphoglycerate to ADP, the first ATP-generating
  step of glycolysis, and run in reverse in gluconeogenesis. The family contains bacterial Pgk, S.
  cerevisiae PGK1, S. pombe pgk1, human PGK1 and testis PGK2, and plant cytosolic and plastid PGKs.
functional_coherence: COHERENT
coherence_reason: All subfamilies are phosphoglycerate kinases.
