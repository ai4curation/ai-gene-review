  name:
    name: Cueball/EGF/LRP/Nidogen
    short: Cueball_EGF_LRP_Nidogen
  description:
  - text: The cueball family proteins are involved in reproductive processes, specifically
      in spermatogenesis and oogenesis across various species of Drosophila. They
      may also play a role in lipid metabolism and neuronal function. The epidermal
      growth factor (EGF) proteins within the family stimulate the growth of epidermal
      and epithelial tissues, and have a magnesiotropic hormone function that regulates
      magnesium reabsorption in the renal distal convoluted tubule. The low-density
      lipoprotein receptor-related proteins (LRPs) act as coreceptors in the Wnt signaling
      pathway, crucial for bone formation, cell fate determination, and embryonic
      development. Nidogens are cell adhesion glycoproteins that contribute to the
      structure and function of basement membranes, mediating interactions between
      cells and the extracellular matrix, and are involved in processes such as osteoblast
      differentiation and neural plasticity.
