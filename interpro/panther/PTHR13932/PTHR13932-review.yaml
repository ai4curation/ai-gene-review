- subfamily_id: PANTHER:PTHR13932:SF5
  label: RADICAL S-ADENOSYL METHIONINE DOMAIN-CONTAINING PROTEIN 1, MITOCHONDRIAL
  description: >-
    HemW-like heme-binding radical SAM proteins (bacterial HemW, eukaryotic mitochondrial
    RSAD1). PANTHER places this subfamily label on the family root node, so it also names
    the paraphyletic remainder of the tree outside SF6, SF1 and SF9.
  representative_members:
  - id: UniProtKB:P52062
    label: Heme chaperone HemW
    gene_symbol: hemW
    organism: Escherichia coli (strain K12)
    gene_review: genes/ECOLI/hemW/hemW-ai-review.yaml
  - id: UniProtKB:Q9HA92
    label: Radical S-adenosyl methionine domain-containing protein 1, mitochondrial
    gene_symbol: RSAD1
    organism: Homo sapiens
    gene_review: genes/human/RSAD1/RSAD1-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Lost (or never had) coproporphyrinogen III dehydrogenase activity; E. coli HemW binds
    heme and transfers it to the NarI subunit of nitrate reductase rather than taking part
    in porphyrin biosynthesis.
  supported_by:
  - reference_id: file:genes/ECOLI/hemW/hemW-uniprot.txt
    supporting_text: >-
      Probably acts as a heme chaperone, transferring heme to the NarI subunit of the
      respiratory enzyme nitrate reductase
  - reference_id: file:genes/ECOLI/hemW/hemW-uniprot.txt
    supporting_text: >-
      Does not have coproporphyrinogen III dehydrogenase activity in vitro
      (PubMed:29282292).
- subfamily_id: PANTHER:PTHR13932:SF9
  clade_node_id: PANTHER:PTN001794827
  label: COPROPORPHYRINOGEN III OXIDASE
  description: >-
    Gammaproteobacterial ChuW-type anaerobilin synthases (radical SAM heme degradation);
    the only Swiss-Prot member is E. coli O157:H7 ChuW (A0A384LP51). The PANTHER name
    does not reflect the characterized activity.
  diverged_from_family: true
  divergence_description: >-
    Uses radical SAM chemistry to open the heme ring (anaerobilin synthase) instead of
    decarboxylating coproporphyrinogen III; no member is assessed in this repository.
- subfamily_id: PANTHER:PTHR13932:SF1
  clade_node_id: PANTHER:PTN001017109
  label: OXYGEN-INDEPENDENT COPROPORPHYRINOGEN-III OXIDASE-LIKE PROTEIN HEMZ
  description: >-
    Firmicute HemZ-like proteins (Swiss-Prot member: Bacillus subtilis HemZ, Q796V8).
    B. subtilis makes heme by the coproporphyrin-dependent route, which does not form
    protoporphyrinogen IX, and no coproporphyrinogen dehydrogenase activity has been
    shown for this subfamily; its function is left unassessed here.
  diverged_from_family: false
