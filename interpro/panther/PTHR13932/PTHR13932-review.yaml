family_id: PANTHER:PTHR13932
family_name: COPROPORPHYRINIGEN III OXIDASE
preferred_name: Radical SAM HemN/HemW family (oxygen-independent coproporphyrinogen III dehydrogenases and HemW-like heme chaperones)
summary: >-
  A bacterial-rooted family of radical S-adenosylmethionine (SAM) enzymes that all bind a
  [4Fe-4S] cluster coordinated by the CxxxCxxC motif and an exchangeable SAM. The family
  splits into two functionally distinct clades. The HemN clade (subfamily SF6) contains the
  oxygen-independent coproporphyrinogen III dehydrogenases (EC 1.3.98.3) of Escherichia
  coli, Salmonella, Pseudomonas, Rhodobacter and cyanobacteria, which use two SAM-derived
  5'-deoxyadenosyl radicals to oxidatively decarboxylate the ring A and B propionates of
  coproporphyrinogen III to the vinyl groups of protoporphyrinogen IX, the anaerobic
  counterpart of the HemF (PTHR10755) step of protoporphyrin-dependent heme synthesis. The
  larger HemW-like clade (subfamily SF5), which includes bacterial HemW and the eukaryotic
  mitochondrial RSAD1 proteins, was long annotated as a second coproporphyrinogen oxidase
  but E. coli HemW lacks that activity and instead binds heme and acts as a heme chaperone
  for respiratory nitrate reductase. The small SF9 clade contains the E. coli O157 ChuW
  anaerobilin synthase, a radical SAM heme-degrading enzyme, and SF1 contains Bacillus
  subtilis HemZ, whose activity is not established.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The radical SAM [4Fe-4S] chemistry is shared family-wide, but the coproporphyrinogen
  dehydrogenase activity and participation in porphyrin biosynthesis are restricted to the
  HemN clade (SF6). The HemW/RSAD1 clade (SF5) is a non-catalytic heme-binding chaperone
  lineage that lacks coproporphyrinogen dehydrogenase activity, and SF9 (ChuW) degrades heme
  rather than making it.
