family_id: PANTHER:PTHR21064
family_name: AMINOGLYCOSIDE PHOSPHOTRANSFERASE DOMAIN-CONTAINING PROTEIN-RELATED
preferred_name: Pseudomonas-type (type II) homoserine kinases and hydroxylysine kinases
summary: >-
  Aminoglycoside-phosphotransferase (APH)-fold small-molecule kinases. SF6 holds the
  Pseudomonas-type, or type II, homoserine kinases (ThrB) of alpha-, beta- and
  gamma-proteobacteria (P. aeruginosa, P. putida KT2440 PP_0121, Burkholderia, Brucella,
  Rhizobium, Neisseria) that phosphorylate L-homoserine in threonine biosynthesis and are
  unrelated in fold to the GHMP-kinase ThrB of E. coli and Corynebacterium (PTHR20861). SF6
  also contains a few divergent members, notably the Bacillus amicoumacin kinase AmiN, and
  uncharacterized proteins from Synechocystis, Deinococcus and Halalkalibacterium. SF1 holds
  the animal hydroxylysine kinases (HYKK); SF5 holds a bacterial N-acetylhexosamine 1-kinase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family shares the APH kinase fold and ATP-dependent phosphorylation of a small
  hydroxylated substrate, but the substrate differs by subfamily: L-homoserine (SF6 ThrB),
  5-hydroxy-L-lysine (SF1 HYKK) and N-acetylhexosamines (SF5). Within SF6, B. subtilis AmiN
  (O34640) phosphorylates and inactivates the antibiotic amicoumacin A instead of
  homoserine, so even the homoserine-kinase subfamily is not uniform.
