term_assessments:
- assessed_term:
    id: GO:0004413
    label: homoserine kinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Asserted at the bacterial node PTN001464661 from P. aeruginosa ThrB and correct for
    the SF6 type II homoserine kinases, including the module's P. putida KT2440 ThrB. Not
    applicable to SF1 (hydroxylysine kinase) or SF5 (N-acetylhexosamine kinase). AmiN is a
    documented exception within SF6.
  applicable_subfamilies:
  - id: PANTHER:PTHR21064:SF6
    label: AMINOGLYCOSIDE PHOSPHOTRANSFERASE DOMAIN-CONTAINING PROTEIN
  member_exceptions:
  - member:
      id: UniProtKB:O34640
      label: Amicoumacin kinase
      gene_symbol: amiN
      organism: Bacillus subtilis 168
    exception_reason: >-
      B. subtilis yerI/AmiN phosphorylates the antibiotic amicoumacin A and mediates
      natural resistance; knockout makes cells drug-susceptible. B. subtilis threonine
      biosynthesis uses its GHMP-family ThrB (PTHR20861), so the homoserine kinase IBA it
      receives from PTN001464661 is a paralog over-propagation.
    pruned_node_id: PANTHER:PTN001464661
    supported_by:
    - reference_id: PMID:30181282
      supporting_text: B. subtilis 168 has an amiN homolog (yerI) that also phosphorylates
        Ami, mediating natural B. subtilis resistance to the drug.
  supported_by:
