notes: >-
  Used by modules/bacterial_aspartate_to_threonine_biosynthesis.yaml for the P. putida
  KT2440 homoserine kinase step (PANTHER:PTHR21064:SF6, representative Q88RK8). The E. coli
  and C. glutamicum ThrB steps of the same module use the unrelated GHMP-kinase family
  PTHR20861, so homoserine kinase activity arose independently in two folds; the module
  models them as alternative species-native enzymes, not orthologues. The KT2440 protein is
  unreviewed in UniProt and not in the PAINT reference proteomes, so it carries no IBA from
  PTN001464661; its IEA homoserine kinase row is accepted in its gene review. The SF6 name
  ("AMINOGLYCOSIDE PHOSPHOTRANSFERASE DOMAIN-CONTAINING PROTEIN") is PANTHER's official
  label and is not a substrate claim.
