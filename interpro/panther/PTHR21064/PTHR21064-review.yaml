    Single reviewed member, Bifidobacterium longum N-acetylhexosamine 1-kinase.
  diverged_from_family: true
  divergence_description: >-
    Sugar (N-acetylhexosamine) kinase, not an amino acid kinase; receives no PAINT IBA
