  name:
    name: Methylthioribulose-1-phosphate dehydratase
    short: MtnB_dehydratase
  description:
  - text: The MtnB family proteins are involved in the methionine salvage pathway,
      which is crucial for various cellular processes including cancer, apoptosis,
      microbial proliferation, and inflammation. Members of this family function as
      methylthioribulose-1-phosphate dehydratases, catalyzing the dehydration of methylthioribulose-1-phosphate
      into 2,3-diketo-5-methylthiopentyl-1-phosphate. This reaction is a key step
      in the recycling of methionine from methylthioadenosine. The family includes
      both probable and confirmed enzymes, with some members also implicated in inhibiting
      inflammatory and apoptotic pathways. The MtnB family is a subfamily of the aldolase
      class II family and is characterized by a conserved enzymatic role across a
      diverse range of organisms.
