family_id: PANTHER:PTHR10640
family_name: METHYLTHIORIBULOSE-1-PHOSPHATE DEHYDRATASE
preferred_name: Methylthioribulose-1-phosphate dehydratase (MtnB/MDE1/APIP) family
summary: >-
  Class II aldolase-fold dehydratases that convert 5-methylthioribulose 1-phosphate to 2,3-diketo-5-methylthiopentyl
  1-phosphate in the methionine salvage (MTA) cycle. The family contains bacterial MtnB, S. cerevisiae
  MDE1, S. pombe mde1, and human APIP (which also inhibits apoptosis), plus the uncharacterized S.
  pombe paralog SPAC9.06c (SF10).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The dehydratase activity is conserved in SF7. The S. pombe paralog in SF10 is uncharacterized.
