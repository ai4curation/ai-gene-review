family_id: PANTHER:PTHR43111
family_name: ALDEHYDE DEHYDROGENASE B-RELATED
preferred_name: Bacterial AldB-like NAD(P)-dependent aldehyde dehydrogenases
summary: 'Bacterial members of the aldehyde dehydrogenase (ALDH) superfamily grouped around Escherichia
  coli aldehyde dehydrogenase B (AldB), built on the two-domain ALDH fold (Pfam PF00171 Aldedh; InterPro
  IPR015590 with the Rossmann-like NAD(P)-binding subdomain IPR016162 and the catalytic subdomain IPR016163)
  and carrying the two canonical ALDH active-site signatures, the nucleophilic cysteine (PROSITE PS00070,
  IPR016160) and the general-base glutamate (PS00687, IPR029510). Members oxidize an aldehyde to the corresponding
  carboxylic acid with reduction of NAD(P)(+), but the physiological substrate differs from member to
  member: acetaldehyde for Pseudomonas aeruginosa ExaC and Cupriavidus necator AcoD, fluoroacetaldehyde
  in the Streptantibioticus fluorometabolite pathway, long-chain alkanals for Acinetobacter Ald1, ring-cleavage
  CoA-semialdehydes for Aromatoleum BoxD and for the phenylacetate-pathway enzyme of E. coli PaaZ, and
  thiocarbamate-herbicide-induced substrates for Rhodococcus ThcA. Typical members are about 495-515 residues;
  PaaZ (681 residues) is a fusion carrying an extra domain beyond the ALDH unit, and Klebsiella MaoC (335
  residues) is a short uncharacterized relative. PANTHER places every member in the single subfamily PTHR43111:SF1,
  so the family''s substrate diversity is not resolved by its subfamily structure.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'All 27 cached members share the ALDH fold and sit in one subfamily (PTHR43111:SF1),
  and essentially all are named aldehyde dehydrogenases, so NAD(P)-dependent aldehyde oxidation is safe
  as the family-level chemistry. What is not shared is the substrate: within the same subfamily sit acetaldehyde-specific
  enzymes (ExaC, AcoD), a fluoroacetaldehyde dehydrogenase (F8JX40), a long-chain alkanal dehydrogenase
  (Q9FDS1), two CoA-semialdehyde dehydrogenases of aromatic ring-cleavage pathways (BoxD, PaaZ) and nine
  essentially identical Staphylococcus aureus AldA proteins of unassigned substrate. The identified structural
  exceptions are the PaaZ fusion (681 aa) and the 335-residue Klebsiella MaoC, which is too short to be
  a complete ALDH unit on its own.'
