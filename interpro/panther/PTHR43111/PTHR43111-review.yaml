  - reference_id: PMID:21296885
    supporting_text: an N-terminal NADP(+)-dependent aldehyde dehydrogenase domain that oxidizes the aldehyde
      to 3-oxo-5,6-dehydrosuberyl-CoA
term_assessments:
- assessed_term:
    id: GO:0016491
    label: oxidoreductase activity
  scope: FAMILY_WIDE
  scope_reason: 'Asserted by PAINT at PTN000916590 and true of every member: the ALDH fold with an intact
    catalytic cysteine and glutamate is present throughout, and no member is known to have lost it. Uninformative
    on its own, which is why individual gene reviews should also carry the specific activity they can
    support (the exaC review marks this term TOO_GENERAL beside its accepted GO:0140087), but it is not
    wrong at family level. The Pseudomonas putida KT2440 member reviews aldB-I, aldB-II and pedI mark
    the InterPro2GO row MARK_AS_OVER_ANNOTATED, but their stated reasons are that the term is uninformative
    beside a specific aldehyde dehydrogenase term, not that the chemistry is missing. That agrees with
    this assessment, and on re-review those rows would be better recorded as TOO_GENERAL. They are not
    member exceptions, because the term does hold for those proteins.'
  supported_by:
  - reference_id: file:interpro/panther/PTHR43111/PTHR43111-paint.tsv
    supporting_text: "PTHR43111\tPTN000916590\tGO:0016491\tF\tIBD\tfalse"
  - reference_id: file:PSEAE/exaC/exaC-uniprot.txt
    supporting_text: PROSITE; PS00070; ALDEHYDE_DEHYDR_CYS; 1.
- assessed_term:
    id: GO:0004029
    label: aldehyde dehydrogenase (NAD+) activity
  scope: FAMILY_WIDE
  scope_reason: 'One level more specific than the PAINT node and still family-safe: the members are ALDH-fold
    enzymes that oxidize an aldehyde to a carboxylate with NAD(+) (the reference protein''s reaction is
    curated with experimental evidence), and the family name itself is AldB-related. The term is left
    at the NAD(+) parent rather than at any substrate-specific child because cofactor preference is reported
    as NAD(+) for the characterized members while the substrate is not shared. This is a family-level
    judgement about what may be inherited; a gene review with a specific child term supported for its
    own protein should prefer that child and treat this parent as too general.'
  supported_by:
  - reference_id: file:PSEAE/exaC/exaC-uniprot.txt
    supporting_text: Reaction=acetaldehyde + NAD(+) + H2O = acetate + NADH + 2 H(+)
  - reference_id: file:interpro/panther/PTHR43111/PTHR43111-entries.csv
    supporting_text: P37685,Aldehyde dehydrogenase B
- assessed_term:
    id: GO:0140087
    label: acetaldehyde dehydrogenase (NAD+) activity
  scope: UNRESOLVED
  scope_reason: Cannot be scoped at family level, and must not be inherited. Acetaldehyde is the established
    substrate for P. aeruginosa ExaC and for Cupriavidus AcoD, but other members of the same single subfamily
    act on fluoroacetaldehyde, long-chain alkanals or CoA-semialdehydes, so the term is a per-member claim
    that needs that member's own evidence. PANTHER offers no subfamily that separates the acetaldehyde-specific
    members, and no residue site is known that would predict substrate preference, so neither SUBFAMILY_ONLY
    nor RESIDUE_DETERMINED can be used honestly here; this is recorded as undecided at family level rather
    than resolved the wrong way. The P. aeruginosa PAO1 member PA4022 (Q9HX05) has directly assayed NAD-dependent
    acetaldehyde oxidation in PMID:22267508; the former ISS-only account overlooked that primary study.
    This strengthens the individual-member claim without resolving substrate specificity across the whole
    family.
  supported_by:
  - reference_id: file:PSEAE/exaC/exaC-uniprot.txt
    supporting_text: Catalyzes the NAD(+)-dependent oxidation of acetaldehyde to acetate.
  - reference_id: file:interpro/panther/PTHR43111/PTHR43111-entries.csv
    supporting_text: Q9FDS1,Long-chain-aldehyde dehydrogenase
  - reference_id: file:interpro/panther/PTHR43111/PTHR43111-entries.csv
    supporting_text: F8JX40,Fluoroacetaldehyde dehydrogenase
  - reference_id: PMID:22267508
    supporting_text: We found here that purified rHdhA and rExaC both oxidize acetaldehyde.
- assessed_term:
    id: GO:0006068
    label: ethanol catabolic process
  scope: UNRESOLVED
  scope_reason: 'Right for the reference protein, where the acetaldehyde dehydrogenase step completes
    ethanol oxidation to acetate, but pathway membership is exactly what varies across this family: the
    phenylacetate (PaaZ), benzoate ring-cleavage (BoxD) and organofluorine (F8JX40) members serve unrelated
    pathways. The process term therefore belongs to individual members with pathway evidence, not to the
    family.'
  supported_by:
  - reference_id: file:PSEAE/exaC/exaC-uniprot.txt
    supporting_text: 'Alcohol metabolism; ethanol degradation; acetate from ethanol: step 2/2.'
  - reference_id: file:interpro/panther/PTHR43111/PTHR43111-entries.csv
    supporting_text: Q84HH8,"3,4-dehydroadipyl-CoA semialdehyde dehydrogenase"
- assessed_term:
    id: GO:0033721
    label: aldehyde dehydrogenase (NADP+) activity
  scope: SUBFAMILY_ONLY
  scope_reason: Directly shown for the PaaZ ALDH domain (NADP+, Km 56 uM). The subfamily is the whole
    family, so this scope does not discriminate; NAD+ versus NADP+ preference varies among the stand-alone
    ALDHs (e.g. BoxD-type semialdehyde dehydrogenases of the box pathway), and the cofactor-specific term
    should be assigned per member from its own data. No member exceptions are asserted for this cofactor-level
    aldehyde dehydrogenase term. Unlike the MaoC-domain ether hydrolase and the phenylacetate process,
    it is not specific to PaaZ, and the NAD+/NADP+ preference of the stand-alone members has not been
    checked member by member.
