    id: GO:0016803
    label: ether hydrolase activity
  scope: SUBFAMILY_ONLY
  scope_reason: Oxepin-CoA ring hydrolysis is carried out by the C-terminal MaoC-like (R)-hydratase domain,
    which only the PaaZ/MaoC fusion members possess. PANTHER does not separate these from the stand-alone
    ALDHs, so stand-alone members are recorded as exceptions. SF1 is the family's only subfamily, so the
    scope is made member by member, in line with the SF1 rule that substrate-level claims are not inherited.
    Every reviewed SF1 member other than the PaaZ fusions (E. coli P77455, P. putida KT2440 Q88HT3) is
    listed as a member exception. The scope therefore applies only to PaaZ-type MaoC-ALDH fusions, identified
