node_assessments:
- node_id: PANTHER:PTN000916590
  asserted_term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence: IBD
  negated: false
  paint_snapshot: '20260530'
  seeds:
  - id: UniProtKB:P37685
    label: Aldehyde dehydrogenase B
    gene_symbol: aldB
    organism: Escherichia coli (strain K12)
  - id: UniProtKB:P77455
    label: Bifunctional protein PaaZ
    gene_symbol: paaZ
    organism: Escherichia coli (strain K12)
  assessment: SOUND
  assessment_reason: 'The term is as conservative as a PAINT assertion gets, and it is right. Both seeds
    are experimentally characterized E. coli NAD(P)-dependent aldehyde dehydrogenases (AldB and the ALDH
    module of the bifunctional PaaZ), and every member of the family carries the ALDH fold together with
    both catalytic-site signatures, so redox catalysis is ancestral to the whole family. The PAINT row
    deliberately stops at the root-level oxidoreductase term rather than at aldehyde dehydrogenase activity
    or at a substrate-specific child, which matches the family''s substrate heterogeneity: the one thing
    all members do is oxidize something. Two seeds for a node this broad is not thin support - both are
    well-characterized, and the claim being inherited is the family''s defining chemistry. Granularity
    is the only criticism available, and that is an argument for adding specific terms per member, not
    for disputing the node. Family root (PTHR43111:AN0 in PANTHER''s TreeGrafter table). Every member
    has an ALDH domain and the characterized ones are NAD(P)+-dependent aldehyde dehydrogenases; PaaZ''s
    ALDH domain oxidizes 3-oxo-5,6-dehydrosuberyl-CoA semialdehyde with NADP+ (PMID:21296885). The term
    is true family-wide but uninformative; gene reviews should refine it (the E. coli paaZ review MODIFYs
    it to aldehyde dehydrogenase (NADP+) activity), which is a refinement, not a dispute of the node.'
  supported_by:
  - reference_id: file:interpro/panther/PTHR43111/PTHR43111-paint.tsv
    supporting_text: "PTHR43111\tPTN000916590\tGO:0016491\tF\tIBD\tfalse\tUniProtKB:P37685|UniProtKB:P77455"
  - reference_id: file:PSEAE/exaC/exaC-uniprot.txt
