family_id: PANTHER:PTHR43111
family_name: ALDEHYDE DEHYDROGENASE B-RELATED
preferred_name: Bacterial AldB-type aldehyde dehydrogenases, including the PaaZ ALDH-hydratase fusion
summary: >-
  A bacterial branch of the aldehyde dehydrogenase (ALDH) superfamily, defined by PANTHER as a
  single subfamily (SF1). Most members are stand-alone ~500-residue NAD(P)+-dependent aldehyde
  dehydrogenases: E. coli AldB (an RpoS-dependent, ethanol-induced aldehyde dehydrogenase),
  Vibrio and Staphylococcus AldA, Cupriavidus AcoD (acetaldehyde dehydrogenase of acetoin
  catabolism), Pseudomonas ExaC, Streptomyces fluoroacetaldehyde dehydrogenase and Aromatoleum
  BoxD (3,4-dehydroadipyl-CoA semialdehyde dehydrogenase of the benzoate box pathway). The family
  also contains the ~680-residue PaaZ proteins (E. coli PaaZ, Klebsiella MaoC), in which an
  N-terminal NADP+-dependent ALDH domain is fused to a C-terminal MaoC-like (R)-specific
  enoyl-CoA hydratase domain. PaaZ performs the hydrolytic ring opening of oxepin-CoA in aerobic
  phenylacetate catabolism and immediately oxidizes the resulting reactive semialdehyde to
  3-oxo-5,6-dehydrosuberyl-CoA, channeling the intermediate between its two active sites.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The ALDH domain and generic aldehyde oxidation are shared by all members. The PaaZ/MaoC
  fusion proteins are the exception in domain content: only they carry the MaoC-like hydratase
  domain responsible for oxepin-CoA ring hydrolysis (ether hydrolase activity), so that activity
  and phenylacetate catabolism are not family-wide even though PANTHER keeps PaaZ in the same
  subfamily as the stand-alone ALDHs. Substrate and nicotinamide cofactor preference also vary
  (PaaZ is NADP+-dependent; acetaldehyde and semialdehyde dehydrogenases of other pathways
  differ), so specific aldehyde dehydrogenase terms must be assigned per member.
