notes: >-
  Counts re-derived from the cached entries.csv with a CSV parser: 27 reviewed member
  entries, all assigned to PTHR43111:SF1 (ALDEHYDE DEHYDROGENASE B-RELATED); nine of
  them are near-identical Staphylococcus aureus AldA proteins from different strains,
  so the effective diversity is smaller than the row count. InterPro metadata reports
  17554 matched proteins over 14320 taxa, and its family description is LLM-generated
  (is_llm true, is_reviewed_llm false), so it is not cited as evidence here; the
  family_name used is PANTHER's own, from panther.obo. The family's paint.tsv holds a
  single node row (PTN000916590, GO:0016491, IBD, 20260530), assessed above; there are
  no IRD or IKR losses. Note that the reference protein Q9ZAA1 is assigned to this
  family by PANTHER's HMM (UniProt DR PANTHER; PTHR43111 and PTHR43111:SF1) but is not
  a leaf of the committed PANTHER tree, so it receives no IBA row from PTN000916590
  even though sibling members such as E. coli aldB, S. aureus aldA and Streptococcus
  exaC Q8E915 do; `just paint-losses PSEAE exaC` reports this as "not a leaf of this
  tree". No residue site is curated: the ALDH catalytic cysteine and glutamate are
  annotated as active sites in the reference protein (positions 262 and 301) from
  PROSITE rules rather than from structure or mutagenesis in this family, and no
  member is known to have lost them, so there is no verified negative control to
  anchor a site that could contradict a gene review. PA4022 (Q9HX05) is placed in PTHR43111:SF1 both by
  its UniProt PANTHER cross-reference and by PANTHER 19.0's own P. aeruginosa
  classification; it is a near-identical PAO1 paralog of exaC (PA1984) and is the
  member the bacterial ethanolamine module uses for the pseudomonad
  acetaldehyde-oxidation step.
