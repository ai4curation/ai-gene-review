notes: >-
  PANTHER keeps PaaZ (ALDH-MaoC fusion) and stand-alone AldB-type ALDHs in one subfamily, so the
  PaaZ-specific hydratase/ether hydrolase activity cannot be scoped by subfamily; AldB is recorded
  as an explicit exception and other stand-alone members should be treated the same way. The
  E. coli paaZ review keeps GO:0004300 enoyl-CoA hydratase activity (IDA, crotonyl-CoA) as
  non-core. Node mapping from PANTHER's PAINT_TreeGrafter_Annotations_TOTAL.txt (paint/current,
  2026-10-23): PTN000916590 = PTHR43111:AN0. No residue site is curated (the ALDH catalytic
  Cys/Glu dyad is curated at superfamily level in the PTHR11699 review).
