  name:
    name: Tropomyosin
    short: Tropomyosin
  description:
  - text: The tropomyosin family is characterized by its role in muscle contraction
      and cytoskeletal stability. Members of this family bind to actin filaments in
      both muscle and non-muscle cells. In striated muscle cells, they play a central
      role in calcium-dependent regulation of contraction through association with
      the troponin complex. In smooth muscle cells, contraction is modulated by interaction
      with caldesmon. Tropomyosins are also implicated in stabilizing cytoskeleton
      actin filaments in non-muscle cells. The proteins are structured as coiled coils
      formed by two polypeptide chains and exhibit a seven-residue periodicity, indicative
      of their role in filament binding and stabilization.
