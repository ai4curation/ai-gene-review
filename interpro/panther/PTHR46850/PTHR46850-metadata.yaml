  name:
    name: Chromodomain-helicase-DNA-binding
    short: CHD
  description:
  - text: The CHD family proteins are ATP-dependent chromatin remodelers that regulate
      transcription by altering chromatin structure. They are involved in various
      cellular processes including transcriptional repression and activation, chromatin
      boundary establishment, and co-transcriptional RNA processing. Members of the
      family act as transcriptional repressors by recruiting histone H1 to target
      genes and suppressing apoptosis mediated by p53. They also serve as negative
      regulators of the Wnt signaling pathway by modulating beta-catenin activity.
      Some members function as transcriptional coactivators for nuclear receptors
      and are implicated in osteogenesis. The family plays a role in the cellular
      response to oxidative stress and may regulate rRNA production. Additionally,
      they are involved in neuronal differentiation, cell cycle regulation, DNA repair,
      and viral infection response.
