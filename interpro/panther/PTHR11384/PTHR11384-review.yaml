family_id: PANTHER:PTHR11384
family_name: ATP-BINDING CASSETTE, SUB-FAMILY D MEMBER
preferred_name: ABC transporter subfamily D (ABCD, PXA1/PXA2)
summary: >-
  ABCD half-transporters. ABCD1-3 and the S. cerevisiae PXA1/PXA2 heterodimer move fatty acyl-CoAs
  (very-long-chain, branched-chain and bile-acid intermediates) into peroxisomes for beta-oxidation.
  ABCD4 is a lysosomal cobalamin exporter that works with LMBD1.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Peroxisomal acyl-CoA transport (SF21, SF24, SF62, SF67, SF69, SF71, SF56) and lysosomal cobalamin
  export (ABCD4, SF59) are distinct functions.
