family_id: PANTHER:PTHR11409
family_name: ADENOSINE DEAMINASE
preferred_name: Adenosine deaminase family (ADA, ADA2, ADAL/MAPDA)
summary: >-
  Zinc amidohydrolases of the adenosine deaminase family. Cytosolic ADA deaminates adenosine and
  2'-deoxyadenosine to inosine; its loss causes severe combined immunodeficiency. ADA2 (CECR1) is
  a secreted, growth-factor-like adenosine deaminase. ADAL/MAPDA deaminates N6-methyl-AMP rather
  than adenosine.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  ADA (SF43, SF49) and ADA2 (SF39, SF45) are adenosine deaminases. ADAL/MAPDA (SF42) prefers N6-methyl-AMP.
