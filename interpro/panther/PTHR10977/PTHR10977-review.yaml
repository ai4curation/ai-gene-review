notes: >-
  Revised 2026-11-18 from a fungal-and-human-only review after gene reviews of mouse, Arabidopsis,
  C. albicans, A. fumigatus, Dictyostelium and four archaeal members. Tree placements are from the PANTHER
  19.0 tree (pantherdb treeinfo): root PTN008313801 splits into PTN004212759 (Halobacterium salinarum dmd
  Q9HRQ4, Chloroflexus aurantiacus Caur_0617 A9WEU8) and PTN007474433, which holds PTN000104601 (all
  eukaryotes plus SSO2989), Coxiella mvaD and the Firmicutes node PTN008509382.
  Leads, not asserted: (1) Halobacterium Q9HRQ4 is named diphosphomevalonate decarboxylase and carries
  GO:0004163 by IEA, but it shares a UniRef50 cluster with the H. volcanii phosphomevalonate decarboxylase
  and sits in the non-DMD clade, so it is probably a phosphomevalonate decarboxylase (a CHECK query, not a
  defect claim). (2) Coxiella Q83DT5 (tree symbol mvaD) is named IPP isomerase in UniProt. (3) The
  T. acidophilum mevalonate 3-kinase Ta1305 (Q9HIN1) has no PANTHER assignment although its P. torridus
  ortholog PTO1356 is in SF3, and T. acidophilum Ta0461 (Q9HKY2) is an uncharacterised SF3 member; the
  P. torridus bisphosphate decarboxylase is PTO0478 (Q6L1T9). (4) Unlike PTHR43290 and PTHR31814, this
  family has no fungal ergosterol-biosynthesis IBD; a fungal node such as PTN000104638 (S. cerevisiae,
  C. albicans and A. fumigatus decarboxylases) would carry it. The InterPro2GO mapping of IPR005935
  (diphosphomevalonate/phosphomevalonate decarboxylase) to GO:0016831 is deliberately general because the
  signature spans DMD, PMD and MBD; recent reviews mark those rows TOO_GENERAL under the 2026-11-14 ruling.
  genes/yeast/ERG19 duplicates genes/yeast/MVD1 (both P32377); MVD1 is the SGD standard name and is used
  here.
