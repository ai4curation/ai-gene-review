node_assessments:
- node_id: PANTHER:PTN000104601
  asserted_term:
    id: GO:0005829
    label: cytosol
  evidence: IBD
  paint_snapshot: '20230602'
  seeds:
  - id: MGI:MGI:2179327
  - id: UniProtKB:P53602
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node spans every eukaryotic member plus S. solfataricus SSO2989, and the term was seeded only by
    mouse and human MVD. Cytosol holds for mammals (mouse MPD fractionates with the cytosol of B16F10
    cells), fungi (yeast MVD1 GFP; Candida and Aspergillus by orthology), Dictyostelium (N- and
    C-terminal GFP fusions are cytosolic) and the soluble archaeal enzyme. It does not hold for land
    plants: YFP fusions of the periwinkle and Arabidopsis MVDs, like plant PMK, are peroxisomal, and the
    only plant cytosol evidence is a crude soluble-fraction proteome that also contains the major leaf
    peroxisomal matrix enzymes. Both Arabidopsis reviews mark the inherited cytosol row
    MARK_AS_OVER_ANNOTATED. An IRD at the Viridiplantae clade PTN008509376 (71 leaves, Klebsormidium to
    angiosperms; the next node up adds Paramecium, Phytophthora and diatoms) would stop the term there.
    The localization evidence is from eudicots, so a narrower angiosperm node is the conservative
    alternative if PAINT prefers it.
