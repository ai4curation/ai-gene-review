    decarboxylases that make up nearly all of the family, but not for the archaeal members of the
    modified pathways listed as member exceptions. Because those members share subfamily SF3 with the
    classical enzymes, the safe selector is the PAINT clade PTN000104601 (or PTN007474433 once bacteria
    are added), not the family or subfamily.
