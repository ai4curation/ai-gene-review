family_id: PANTHER:PTHR10977
family_name: DIPHOSPHOMEVALONATE DECARBOXYLASE
preferred_name: Diphosphomevalonate decarboxylase (MVD/ERG19) family
summary: >-
  GHMP-superfamily enzymes that ATP-dependently decarboxylate mevalonate 5-diphosphate to isopentenyl
  diphosphate, the last step of the mevalonate pathway. The reviewed fungal
  SF3 members include S. cerevisiae MVD1/ERG19, S. pombe mvd1,
  C. albicans MVD and A. fumigatus mvd1.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed fungal proteins all sit in PTHR10977:SF3 and retain the
  conserved ATP-dependent diphosphomevalonate decarboxylase reaction.
