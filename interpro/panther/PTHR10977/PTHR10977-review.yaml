family_id: PANTHER:PTHR10977
family_name: DIPHOSPHOMEVALONATE DECARBOXYLASE
preferred_name: Diphosphomevalonate decarboxylase (MVD/MDD) family, with divergent archaeal members
summary: >-
  GHMP-superfamily enzymes of the mevalonate pathway. Most members, in eukaryotes, Sulfolobales and
  Gram-positive bacteria, are diphosphomevalonate decarboxylases (DMD/MDD/MVD) that ATP-dependently
  decarboxylate (R)-mevalonate 5-diphosphate to isopentenyl diphosphate, the last step of the classical
  pathway (human MVD, S. cerevisiae MVD1, Arabidopsis MVD1 and MVD2, S. solfataricus SSO2989). The family
  also holds archaeal enzymes of the modified mevalonate pathways that catalyse other reactions with the
  same fold: phosphomevalonate decarboxylase of haloarchaea (H. volcanii mvaD/HVO_1412, which
  decarboxylates mevalonate 5-phosphate), and, in the Thermoplasmatales, mevalonate 3-kinase (P. torridus
  PTO1356, a kinase that does not decarboxylate) and the ATP-independent mevalonate 3,5-bisphosphate
  decarboxylase (T. acidophilum Ta0893). Every characterised member acts in isopentenyl diphosphate
  synthesis from mevalonate.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Diphosphomevalonate decarboxylase activity holds for 136 of the 138 leaves of the PANTHER 19.0 tree
  (every eukaryote, Sulfolobus and the Firmicutes/Coxiella members) and for every reviewed eukaryotic
  member. The exceptions are identified archaeal (and Chloroflexi) lineages of the modified mevalonate
  pathways, all assigned to the single subfamily SF3 by HMM: the two-leaf clade PTN004212759 (Halobacterium
  dmd, Chloroflexus Caur_0617), whose H. volcanii cluster-mate mvaD is a phosphomevalonate decarboxylase,
  and the Thermoplasmatales mevalonate 3-kinase and mevalonate 3,5-bisphosphate decarboxylase, which are
  not leaves of the reference tree. SF3 therefore cannot be used as a selector for GO:0004163.
