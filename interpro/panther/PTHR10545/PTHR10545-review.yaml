family_id: PANTHER:PTHR10545
family_name: DIAMINE N-ACETYLTRANSFERASE
preferred_name: Spermidine/spermine N1-acetyltransferase (SAT1)-related GNAT family
summary: >-
  GNAT acetyl- and acyltransferases. SAT1 (SSAT) acetylates spermidine and spermine at N1, the rate-limiting
  step of polyamine catabolism and export. The family also contains SAT2 (thialysine N-epsilon-acetyltransferase),
  SATL1, invertebrate GNATs of unknown substrate, and plant tyramine N-feruloyltransferases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Acyl donor and acceptor differ between subfamilies: polyamines for SAT1 (SF36), thialysine for
  SAT2 (SF51), and feruloyl-CoA with tyramine for the plant THT enzymes (SF54).
