residue_sites:
- site_id: na_coordination
  label: Sodium-coordinating side chains
  description: 'The side chains that coordinate the two sodium ions in human NTCP. Positions were read
    from deposited coordinates rather than from sequence features: every NTCP residue with a heavy atom
    within 4.5 A of a bound Na+ in PDB 9QZQ (3.11 A) and 7ZYI (2.88 A), restricted to those contacting
    through a side-chain atom. That restriction matters. Positions 97, 98, 99, 101, 120, 258, 259 and
    260 also contact sodium, but only through main-chain atoms, so a substitution there does not change
    the contact chemistry and must not be read as loss of the site -- SLC10A4''s C260-to-S338 is exactly
    such a case, and reporting it as a substitution overstates the divergence.

    UniProt curates no BINDING features for Q14973, so there is no feature-based alternative to this
    definition.

    Each position now carries the atom that makes the closest approach, how it makes it, the distance
    and the entry measured. Two of them need their entry attached to be read correctly: E257 coordinates
    sodium through its carboxylate (OE2, 2.76 A) in 7ZYI, while in 9QZQ the nearest atom of the same
    residue is the backbone O at 2.94 A; Q261 likewise shows its amide (OE1, 3.33 A) only in 7ZYI. Entries
    of the same protein can disagree about which atom is closest, so a distance without its source is
    not interpretable.'
