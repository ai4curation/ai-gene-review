family_id: PANTHER:PTHR10361
family_name: SODIUM-BILE ACID COTRANSPORTER
preferred_name: SLC10 / bile acid:sodium symporter (BASS) family
summary: 'The SLC10 family comprises the sodium-coupled bile salt and sulfoconjugate carriers of the
  bile acid:sodium symporter (BASS) fold, plus several members whose cargo is unknown. The two best-characterised
  human members work at opposite poles of polarised epithelia: SLC10A1/NTCP takes conjugated bile salts
  up across the hepatocyte basolateral membrane, and SLC10A2/ASBT reclaims them across the ileal apical
  brush border. SLC10A6/SOAT transports 3''- and 17''-monosulfated steroids rather than ordinary bile
  acids, though it does carry taurolithocholate. SLC10A4 and SLC10A5 are orphan carriers with no identified
  substrate, and SLC10A7 is the most divergent member: it sits in the Golgi, no transport activity has
  been demonstrated for it, and its reported biology is calcium homeostasis and glycosylation. The plant
  and bacterial members (BASS1-6, Acr3-related arsenite permeases) carry different cargo again, so the
  family as a whole is held together by fold rather than by substrate.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'Sodium-coupled symport across a membrane is shared by most characterised members,
  and PAINT places that activity at PTN000040761 with the plasma-membrane localisation above it. Substrate
  identity, however, is not conserved: it splits between bile salts (NTCP, ASBT), sulfated steroids
  (SOAT), arsenite (Acr3-related members) and unknown (SLC10A4, SLC10A5, SLC10A7). Epithelial polarity
  also splits within the vertebrate clade, apical for the ASBT branch (PTN002570923) and basolateral
  for the NTCP branch (PTN002570905). Deepening a member''s annotation from the family-level activity
  to a substrate-specific child therefore needs member-level evidence, which is the practical point
  of the residue sites below.'
