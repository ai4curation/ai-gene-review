- site_id: bile_salt_polar_anchors
  label: Polar anchors of the bile-salt pocket
  description: 'The three polar side chains contacting bound glycochenodeoxycholate in PDB 7ZYI, within
    the 21-residue pocket defined by the same 4.5 A criterion. Deliberately recorded as CONTRIBUTES
    and not REQUIRED: ASBT transports bile salts while carrying threonine at the position homologous
    to NTCP N103, which is direct evidence within this family that the triad is not strictly required.
    SLC10A4 retains all three and still has no identified substrate; SLC10A7 has lost all three. The
    rest of the pocket is hydrophobic lining and diverges freely even between the two functional bile
    salt carriers, which is why only the polar positions are curated here.

    The atom-level provenance also demotes one of the three. N262 (OD1, 3.15 A) and Q264 (OE1, 3.04
    A) are polar contacts proper; N103 approaches through CB at 3.69 A with its amide ND2 at 3.98 A,
    which is a peripheral contact rather than an anchor, and is consistent with ASBT substituting that
    position while still transporting bile salts. Treat N262 and Q264 as the diagnostic pair. The wider
    21-residue shell around the bile salt is not curated here: it is largely an amphipathic hydrophobic
    wall where leucine-to-valine interchanges carry little meaning, and the ligand is itself a model
    fitted into sterol-shaped density.'
