term_assessments:
- assessed_term:
    id: GO:0008508
    label: bile acid:sodium symporter activity
  scope: RESIDUE_DETERMINED
  scope_reason: 'PAINT places this activity at PTN000040761, seeded by the experimentally characterised
    rat Ntcp and Asbt, and it is correct for the NTCP and ASBT branches. It is not safe family-wide:
    SLC10A4 carries an explicit NOT for this term in GOA despite retaining the sodium site, and SLC10A7
    has lost the sodium-coordinating side chains altogether. Whether a member can be given this term
    therefore depends on the na_coordination site plus member-level transport evidence, not on family
    membership. Note the asymmetry: a degenerate site argues against the term, but an intact site does
    not establish it, as SLC10A4 shows.'
  determined_by_site: na_coordination
  supported_by:
  - reference_id: PMID:35545671
    supporting_text: 'Human

      Na+-taurocholate co-transporting polypeptide (NTCP) is the main bile salt uptake

      system in liver.'
- assessed_term:
    id: GO:0001618
    label: virus receptor activity
  scope: UNRESOLVED
  scope_reason: 'HBV/HDV receptor function is specific to primate NTCP and must not propagate to the
    rodent orthologues. Recorded as UNRESOLVED because no available scope value states that truth. SUBFAMILY_ONLY
    with PTHR10361:SF40 was tried and is wrong: SF40 contains mouse O08705 and rat P26435, which bind
    preS1 and transport taurocholate as efficiently as the human protein yet support no infection, the
    restriction mapping to residues 84-87 of the first extracellular loop. Granting the term to SF40
    would license exactly the transfer the mouse review asks to block. RESIDUE_DETERMINED is also ruled
    out: rodent Ntcp retains all six residues of the preS1 myristoyl pocket, so no site discriminates.
    What this assessment needs and the schema cannot express is a taxon restriction on an otherwise
    subfamily-scoped term; until there is one, the honest machine-readable statement is that the scope
    is unresolved and the reason carries the restriction.'
  supported_by:
  - reference_id: PMID:23150796
    supporting_text: 'Silencing NTCP inhibited HBV and HDV infection, while exogenous

      NTCP expression rendered nonsusceptible hepatocarcinoma cells susceptible to

      these viral infections.'
review_status: DRAFT
reviewed_by: claude-code
review_date: '2026-10-04'
notes: 'Residue sites were derived in the reproducible analysis under genes/human/SLC10A4/SLC10A4-bioinformatics/
  (fetch_structures.py, pocket_conservation.py, RESULTS.md), which defines each site from ligand contacts
  in the experimental NTCP structures, records whether each contact is side-chain or main-chain, and
  maps positions onto the paralogues by global alignment of UniProt sequences after a method control
  on the SLC10A1 model itself. Every control position stated above was verified against the live UniProt
  sequence for that accession before being written. Two OpenScientist hypothesis jobs, run blind to
  that analysis, independently agreed on its two verdicts; the reports are under the respective GENE-hypotheses/
  directories. Not curated here: SLC10A3 and SLC10A5, the plant BASS members and the Acr3-related arsenite
  permeases. The arsenite branch in particular carries different cargo and should not inherit the bile-salt
  sites.

  One candidate site was considered and deliberately not curated: the myristoyl pocket of the HBV preS1
  anchor (NTCP F128, L131, G132, D152, V154, Y156, from the ligand contacts in PDB 8RQF). The residue-site
  validator rejected it for two reasons that are both substantive rather than formal, and both are reasons
  the site should not exist: the only protein with both the pocket and the receptor function is the
  anchor itself, so no independent positive control is available among the proteins curated here; and
  the pocket is composed of generic hydrophobic residues, so a paralogue that has demonstrably lost
  the function still carries residues from the expected set at most positions. Rodent Ntcp makes the
  point directly by retaining all six positions while restricting infection. The observation is kept
  in the GO:0001618 term assessment instead, where it belongs as a scoping statement.

  Scope note, after external review: these sites record which residues are present, not whether a paralogue
  is active. Retention of the sodium ligand set argues against one explanation of SLC10A4''s orphan
  status; it is not evidence that SLC10A4 binds sodium or transports a substrate, and the paralogue
  models are apo, so any geometry quoted for them is a superposition onto NTCP''s ions rather than a
  predicted interaction.'
