family_id: PANTHER:PTHR11046
family_name: OLIGORIBONUCLEASE, MITOCHONDRIAL
preferred_name: DEDD 3'-to-5' exonucleases - oligoribonuclease (Orn/REXO2) and Exonuclease I (SbcB)
summary: >-
  A DEDD-superfamily 3'-to-5' exonuclease family with two functionally distinct
  subfamilies. SF0 holds oligoribonuclease (bacterial Orn and the
  mitochondrial REXO2/REX2 proteins of eukaryotes), which degrades short
  oligoribonucleotides. SF11 holds bacterial Exonuclease I (SbcB), a processive
  single-stranded DNA 3'-to-5' exonuclease that is one of the redundant
  excision enzymes of mismatch repair and also acts in recombination and
  mutation avoidance. Single-stranded DNA exonuclease activity is a property
  of SF11 only.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Of the 175 reviewed members in the cached inventory, 171 are in SF0, named
  oligoribonuclease or oligoribonuclease, mitochondrial (bacteria and
  eukaryotes, including human, mouse, rat, bovine and yeast REXO2/REX2). Only
  four are in SF11, all named Exodeoxyribonuclease I (E. coli, Haemophilus and
  two Buchnera sbcB). PAINT annotates only a eukaryotic REXO2 node, with
  mitochondrion and 3'-5'-RNA exonuclease activity; no node carries the
  Exonuclease I activity.
reference_protein: &ref
  id: UniProtKB:P04995
  label: Exodeoxyribonuclease I
  gene_symbol: sbcB
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/sbcB/sbcB-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR11046:SF11
  label: EXODEOXYRIBONUCLEASE I
  description: >-
