    label: Exodeoxyribonuclease I
    gene_symbol: sbcB
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/sbcB/sbcB-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Exonuclease I acts on single-stranded DNA, processively, whereas the
    family's majority subfamily (SF0, oligoribonuclease) degrades short RNA
    oligonucleotides. The oligoribonuclease activity mapped by InterPro2GO to
    the shared DEDD signature is not established for SbcB.
  supported_by:
  - reference_id: file:interpro/panther/panther.obo
