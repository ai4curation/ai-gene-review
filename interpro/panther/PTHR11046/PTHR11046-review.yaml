      name: EXODEOXYRIBONUCLEASE I
  - reference_id: PMID:23609540
    supporting_text: >-
      Escherichia coli Exonuclease I (ExoI) digests single-stranded DNA (ssDNA)
      in the 3'-5' direction in a highly processive manner.
- subfamily_id: PANTHER:PTHR11046:SF0
  label: OLIGORIBONUCLEASE, MITOCHONDRIAL
  description: >-
    Bacterial oligoribonuclease (Orn) and eukaryotic mitochondrial REXO2/REX2.
  diverged_from_family: false
  supported_by:
