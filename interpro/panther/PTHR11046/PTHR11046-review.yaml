- assessed_term:
    id: GO:0008310
    label: single-stranded DNA 3'-5' DNA exonuclease activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The mismatch-repair module asserts this activity for its Exonuclease I
    route, grounded to PTHR11046:SF11. All four reviewed SF11 members are
    Exodeoxyribonuclease I, and E. coli ExoI is a processive single-stranded
    DNA 3'-to-5' exonuclease that digests the mismatch-containing 3'-ended
    strand in methyl-directed repair. The activity is not established for the
    SF0 oligoribonucleases.
