notes: >-
  The PANTHER family name is that of the majority oligoribonuclease subfamily.
  A module grounding the Exonuclease I step must use PTHR11046:SF11, never the
  family id alone. Both module representatives (E. coli P04995 and P. putida
  Q88N51) are SF11 members in the PANTHER 19.0 member index.
