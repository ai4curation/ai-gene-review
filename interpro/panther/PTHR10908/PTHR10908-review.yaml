family_id: PANTHER:PTHR10908
family_name: SEROTONIN N-ACETYLTRANSFERASE
preferred_name: Arylalkylamine N-acetyltransferase (AANAT/PAA1) GNAT family
summary: >-
  GNAT acetyltransferases related to serotonin N-acetyltransferase. Vertebrate AANAT acetylates serotonin
  in the rate-limiting, circadian step of melatonin synthesis. S. cerevisiae PAA1 acetylates polyamines
  (putrescine, spermidine) and aralkylamines.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  One subfamily (SF0) with a shared aralkylamine N-acetyltransferase activity; acceptor preference
  differs between AANAT (serotonin) and PAA1 (polyamines).
