family_id: PANTHER:PTHR19861
family_name: WD40 REPEAT PROTEIN SWD2
preferred_name: Swd2/WDR82 RNA and chromatin complex adaptors
summary: Swd2/WDR82 proteins are WD-repeat components of Set1/COMPASS-associated transcription and chromatin
  machinery. Fungal proteins can also participate in RNA 3-prime processing complexes. Their presence
  in a histone methyltransferase complex does not confer methyltransferase catalysis on the WD-repeat
  protein itself.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Swd2/WDR82 proteins are regulatory WD-repeat subunits rather than methyltransferases.
  Human WDR82 associates with SET1A/B complexes but not the other tested MLL complexes and influences
  H3K4 trimethylation (PMID:18838538). Yeast Swd2 participates in both Set1 and CPF-related functions;
  depletion affects transcription termination without abolishing cleavage/polyadenylation activity in
  the tested extract (PMID:15024081). Histone methylation and RNA-end-processing roles therefore have
  distinct complex and organism boundaries, and catalytic activities of partner enzymes cannot be attributed
  to Swd2/WDR82 itself.
