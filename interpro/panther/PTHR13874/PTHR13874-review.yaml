    gene_symbol: Edn2
    organism: Mus musculus (Mouse)
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:1917960
    supporting_text: >-
      Upon incubation with cultured cells, the mass contents of inositol 1,4,5-trisphosphate and
      intracellular calcium level were substantially increased by 10 nM ET-1, ET-2, and ET-3, but
      not by big-ET with maximal response at 80-130-s postincubation.
- subfamily_id: PANTHER:PTHR13874:SF11
  label: ENDOTHELIN-3
  description: >-
    Vertebrate Endothelin-3 (EDN3) orthologs. Processed via big ET-3(1-41) into mature
    21-residue ET-3, the physiological high-affinity ligand for EDNRB (ETB) required for
    phospholipase C-activating endothelin receptor signaling (GO:0086100, GO:0160135), enteric
    nervous system gangliogenesis, and melanocyte development from neural crest precursors.
