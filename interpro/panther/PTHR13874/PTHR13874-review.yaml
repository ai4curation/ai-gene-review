subfamilies:
- subfamily_id: PANTHER:PTHR13874:SF10
  clade_node_id: PANTHER:PTN002676936
  label: ENDOTHELIN-1
  description: >-
    Vertebrate Endothelin-1 (EDN1) orthologs. Synthesized primarily by vascular endothelial
    cells as a 212-residue preproendothelin-1 and processed via big ET-1(1-38) into mature
    21-residue ET-1, the predominant cardiovascular endothelin agonist that activates both
    EDNRA and EDNRB with subnanomolar affinity to drive Gq/11-phospholipase C signaling
    (GO:0086100, GO:0160135), vascular smooth-muscle contraction, systemic arterial blood
    pressure maintenance, and pharyngeal arch neural crest development.
