  diverged_from_family: false
  supported_by:
  - reference_id: PMID:2649896
    supporting_text: >-
      Moreover, each of the human genes predicted a putative 21-residue peptide, similar to but
      distinct from each other: (i) the "classical" endothelin (ET-1), (ii) [Trp6,Leu7]endothelin
      (ET-2), and (iii) [Thr2,Phe4,Thr5,Tyr6, Lys7,Tyr14]endothelin (ET-3).
- subfamily_id: PANTHER:PTHR13874:SF9
  label: ENDOTHELIN-2
  description: >-
    Vertebrate Endothelin-2 (EDN2) orthologs (together with Atractaspis venom sarafotoxins).
    Processed via big ET-2 into mature 21-residue [Trp6,Leu7]endothelin (ET-2), which binds
    and activates both EDNRA and EDNRB with high affinity comparable to EDN1 to drive
    phospholipase C-activating endothelin receptor signaling (GO:0086100, GO:0160135),
    vasoconstriction, ovarian follicular rupture/ovulation, and intestinal mucosal homeostasis.
  representative_members:
