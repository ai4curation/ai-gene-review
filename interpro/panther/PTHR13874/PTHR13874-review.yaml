family_id: PANTHER:PTHR13874
family_name: ENDOTHELIN
preferred_name: Endothelin / sarafotoxin peptide hormone family
summary: >-
  Secreted prepro-peptide precursors of the vertebrate endothelin family (InterPro:IPR020475),
  comprising the three paralogous vertebrate isopeptide subfamilies Endothelin-1 (EDN1,
  PANTHER:PTHR13874:SF10), Endothelin-2 (EDN2, PANTHER:PTHR13874:SF9; which also contains the
  burrowing-asp venom sarafotoxins evolved in Atractaspis), and Endothelin-3 (EDN3,
  PANTHER:PTHR13874:SF11). Each preproendothelin is cleaved at dibasic sites by furin-like
  proprotein convertases to an inactive ~38-41-residue intermediate ("big endothelin") and
  subsequently cleaved at the Trp21-Val22/Ile22 bond by endothelin-converting enzymes (ECE1,
  ECE2) to yield the mature bioactive 21-residue bicyclic peptide stabilized by Cys1-Cys15 and
  Cys3-Cys11 disulfide bridges. Mature EDN1, EDN2, and EDN3 act as potent paracrine/autocrine
  peptide hormones (GO:0005179) that bind and activate the seven-transmembrane G
  protein-coupled receptors EDNRA (ETA, PANTHER:PTHR46099:SF2; selective for EDN1 and EDN2 over
  EDN3) and EDNRB (ETB, PANTHER:PTHR46099:SF3; equipotent for EDN1, EDN2, and EDN3), initiating
  the endothelin receptor signaling pathway (GO:0086100) and its canonical Gq/11-coupled
  phospholipase C-activating endothelin receptor signaling pathway (GO:0160135).
functional_coherence: COHERENT
coherence_reason: >-
  All vertebrate members of PANTHER:PTHR13874 (EDN1 in SF10, EDN2 in SF9, and EDN3 in SF11) are
  secreted 21-residue bicyclic peptide hormones that share extracellular localization
  (GO:0005576), hormone activity (GO:0005179), endothelin receptor binding (GO:0031708 at the
  root node PTN000356323; GO:0031707 at the EDN1 clade PTN002676936), and direct participation
  in the endothelin receptor signaling pathway (GO:0086100) and its phospholipase C-activating
  branch (GO:0160135). PAINT places GO:0005576, GO:0005179, GO:0031708, GO:0003100, GO:0006874,
  GO:0014826, and GO:0045987 at the Euteleostomi root node PTN000356323, but omits the core
  receptor signaling pathway terms GO:0086100 (endothelin receptor signaling pathway) and
  GO:0160135 (phospholipase C-activating endothelin receptor signaling pathway) across the
  family, leaving EDN3 without GO:0086100 in human/mouse/rat and all three endothelins without
  GO:0160135 (Category A/B pathway gap).
