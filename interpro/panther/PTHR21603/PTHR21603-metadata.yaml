  name:
    name: Chromosome Segregation and Condensation Regulator
    short: Chromo_Seg-Cond_Reg
  description:
  - text: This family of proteins includes regulators of chromosome structure and
      organization during cell division. Members are involved in maintaining the integrity
      and distribution of chromosomes during mitosis. They function by interacting
      with chromatin and other cellular components to ensure proper chromosome condensation
      and segregation. Some family members act as surfactants, preventing chromosomes
      from aggregating, and are associated with the perichromosomal layer. They have
      a preference for binding to supercoiled and AT-rich DNA regions. Others in the
      family recruit specific phosphatases to chromatin, which play a crucial role
      in dephosphorylating substrates during anaphase, contributing to the retention
      of compact chromosome architecture. Collectively, these proteins are essential
      for the correct progression of the cell cycle and genomic stability.
