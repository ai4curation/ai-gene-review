notes: 'Reviewed because UniProt assigns two members grounded in the ADP-heptose precursor biosynthesis
  module (Q63XZ4, A0A2L1CD41) to PANTHER:PTHR43793:SF2. This family is deliberately NOT used as the module''s
  family term for the adenylylation step: its official name is FAD SYNTHASE, its PAINT nodes assert only
  FAD-synthase, dephospho-CoA-kinase and bare transferase functions, and none of them assert a heptose
  activity. The module instead grounds that step on PTHR46969 together with direct evidence, and cites
  SF2 only as a subfamily-level pointer. The PAINT slice was fetched for this review with `just fetch-panther-paint`.'
