review_status: COMPLETE
reviewed_by: claude-code
review_date: '2026-11-26'
notes: |-
  First written on 2026-11-02 because UniProt assigns two members grounded in the ADP-heptose precursor biosynthesis module (Q63XZ4, A0A2L1CD41) to PANTHER:PTHR43793:SF2. The family is deliberately not used as the module's family term for the adenylylation step: its official name is FAD SYNTHASE and no PAINT node in it asserts a heptose activity. That conclusion stands.

  Re-reviewed on 2026-11-26 against the PANTHER 19 tree and family alignment, UniProt and QuickGO. The method and every number quoted here are in tree_msa_check.py and its output PTHR43793-tree-msa-check.txt in this folder. Residue statements refer to PANTHER's own family alignment (872 columns, 26 leaf rows identical to the current UniProt sequences) and are numbered on B. subtilis TagD P27623 (sequence version 1) unless another protein is named; the cysteine statements use global pairwise alignments to M. jannaschii RibL Q58579 (sequence version 1).

  Corrections to the first version.
  1. The family does not contain dephospho-CoA kinases, and coaD is not a dephospho-CoA kinase. The two PTN000075336 rows were called SOUND as "a separate branch of the family". The node is the root of the PTHR10695 tree and is absent from this one; it reaches the slice through two archaeal CoaD (phosphopantetheine adenylyltransferase) members. Both rows are now UNRESOLVED here and referred to the PTHR10695 review, and dephospho-CoA kinase activity is NOT_APPLICABLE to this family.
  2. PTN000843327 was described as a deep node spanning PTHR43793 and PTHR46969. It is the root of this tree only. The PTHR46969 review repeats the earlier wording and was not edited in this change.
  3. "69 of 71 classified members are FAD synthases" was wrong: 59 of the 71 reviewed members are ribL, and SF1 also holds CoaD, TagD/TarD and Fom1.
  4. PTN000077680 (both terms) went from SOUND to NEEDS_PRUNING for one leaf, the Nitrosopumilus CoaD-type protein A9A4T6.
  5. The reference protein was changed from Q63XZ4, an unreviewed protein that is not a tree leaf and has no UniProt site features, to B. subtilis TagD P27623, the member with structures, mutagenesis and curated binding-site features. An HXGH residue site was added.

  Checked and found unremarkable. The HXGH histidines and glycine are conserved across all four clades (the single substitution is Leu for the second histidine in Q8A705), as are Asp11 (24 Asp, 2 Glu), Arg55 (all 26) and the serine and threonine of the C-terminal S-T-T segment (Ser118 in 23, Thr or Ser at 119 in all 26). No clade shows loss of the catalytic motif, so the alignment gives no support for a pseudoenzyme anywhere in the tree. The TagD substrate-binding residues are not family-wide: Lys46 is Lys or Arg in 18 leaves, Trp74 is kept only in the bacterial SF1 clade, and the R-T-E-G-I start of the RTXGISTT signature is specific to the TagD proteins.

  Not verified. (a) No full text was available for the RibL paper (PMID:20822113), the P. abyssi PPAT paper (PMID:12756245) or the Fom1 paper (PMID:28727444); statements about them rest on their abstracts and on the UniProt records that cite them. They are not in the publications cache, so they are listed as references and not quoted. (b) Neither Nitrosopumilus protein has been assayed, so the requested IRD is a classification-based proposal for PAINT to test. (c) The three longer archaeal leaves (A9A1L5, Q97ZG4, Q8ZYP3) have no experimental characterisation that was found; whether they are FAD synthases is unknown. (d) The three eukaryotic leaves are uncharacterised. (e) The pairwise identities are from global BLOSUM62 alignments of short, distantly related proteins and are useful only as a ranking.

  For PAINT. An IRD at leaf PTN002887060 for GO:0003919 and for GO:0006747. Not expressible as a change to an existing row, so recorded here only: the root term transferase activity could be replaced by nucleotidyltransferase activity (GO:0016779), and the HldC clade PTN000077683 has no heptose-1-phosphate adenylyltransferase IBD because none of its leaves has an experimental GO annotation; the fused HldE proteins of H. pylori and S. coelicolor are leaves of this tree and so receive neither of the heptose activities asserted in PTHR46969.
