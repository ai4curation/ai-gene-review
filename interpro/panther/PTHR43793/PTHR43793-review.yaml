residue_sites:
- site_id: hxgh_motif
  label: HXGH nucleotide-binding motif
  description: >-
    The N-terminal HXGH motif that binds the nucleoside triphosphate, shared with class I aminoacyl-tRNA
    synthetases. In B. subtilis TagD it is His14-Trp15-Gly16-His17. Read in PANTHER's own family alignment
    (release 19), the first histidine and the glycine are present in all 26 tree leaves and the second
    histidine in 25. The exception is the Bacteroides thetaiotaomicron phosphoenolpyruvate mutase fusion
    Q8A705, which has Leu18 at the position of TagD His17; that protein is uncharacterised and no
    conclusion about its activity is drawn here.
  anchor:
    id: UniProtKB:P27623
    label: Glycerol-3-phosphate cytidylyltransferase
    gene_symbol: tagD
    organism: Bacillus subtilis (strain 168)
  anchor_sequence_version: 1
  site_source: UNIPROT_FEATURE
  residues:
  - position: 14
    expected:
    - H
    role: first HXGH histidine; binds CTP, H14A abolishes activity
  - position: 17
    expected:
    - H
    role: second HXGH histidine; binds CTP, H17A abolishes activity
  motif:
    pattern_regex: H.GH
    start: 14
    end: 17
  required_for:
  - term:
      id: GO:0047348
      label: glycerol-3-phosphate cytidylyltransferase activity
    strength: CONTRIBUTES
    rationale: >-
      The two histidines contact the CTP phosphates and are proposed to stabilise the pentacoordinate
      transition state at the alpha-phosphate. Alanine substitution of either removes activity without
      changing Km or the overall fold (PMID:9182537), and both contact CTP in the crystal structure
      (PMID:10508782). The dependency is recorded as CONTRIBUTES and not REQUIRED because no natural
      member lacking a histidine has been assayed, so the family offers no negative control: the one
      leaf with a substitution, Q8A705, is uncharacterised.
    supported_by:
    - reference_id: file:interpro/panther/PTHR43793/PTHR43793-tree-msa-check.txt
      supporting_text: 'P27623 H14: Binding site: CTP; Mutagenesis: H->A: Complete loss of activity.'
    - reference_id: file:interpro/panther/PTHR43793/PTHR43793-tree-msa-check.txt
      supporting_text: 'P27623 H17: Binding site: CTP; Mutagenesis: H->A: Complete loss of activity.'
  - term:
      id: GO:0016779
      label: nucleotidyltransferase activity
    strength: CONTRIBUTES
    rationale: >-
      The motif binds the nucleotide in every structurally characterised member of the fold, and the
      mutagenesis is on TagD only. The requirement is therefore direct for TagD and inferred by
      conservation for the adenylyltransferases of the family, which is why it is not recorded as REQUIRED
      family-wide.
    supported_by:
    - reference_id: file:interpro/panther/PTHR43793/PTHR43793-tree-msa-check.txt
      supporting_text: 'P27623 H17: H=25, L=1'
  positive_controls:
