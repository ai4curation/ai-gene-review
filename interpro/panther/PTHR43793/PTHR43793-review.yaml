family_id: PANTHER:PTHR43793
family_name: FAD SYNTHASE
preferred_name: Cytidylyltransferase-fold nucleotidyltransferase family (FAD synthase, dephospho-CoA kinase,
  HldE adenylyltransferase domain)
summary: A nucleotidyltransferase family built on the cytidylyltransferase (HIGH-motif) fold. Its large
  subfamily comprises FAD synthases (RibF/RibL), which adenylylate FMN, and the family also captures dephospho-CoA
  kinase and, in a small distinct subfamily, the adenylyltransferase domain of the heptose pathway enzyme
  HldE. The shared chemistry is transfer of a nucleotide moiety onto a phosphorylated acceptor; the acceptors
  themselves differ completely between subfamilies.
functional_coherence: HETEROGENEOUS
coherence_reason: 69 of 71 classified members are FAD synthases (SF1), while SF2 holds HldE-type D-beta-D-heptose
  1-phosphate adenylyltransferases. PAINT asserts dephospho-CoA kinase, FAD synthase and a bare transferase
  term on this family's nodes and asserts no heptose function anywhere, so family membership alone says
  only that a member is a nucleotidyltransferase.
