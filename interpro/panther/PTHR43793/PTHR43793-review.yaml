  seeds:
  - id: UniProtKB:Q58579
    label: FAD synthase
    gene_symbol: ribL
    organism: Methanocaldococcus jannaschii
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node is the archaeal speciation node of the tree, with nine leaves, and its single seed is sound:
    M. jannaschii RibL (Q58579) has an IDA for this activity from PMID:20822113 and is a leaf below the
    node. Placement at the archaeal node is defensible. Five of the nine leaves, from Korarchaeum and
    four euryarchaea, are matched by the HAMAP RibL rule MF_02115, and the three eukaryotic sister
    leaves and both bacterial clades are correctly outside the node. One leaf should not inherit the term.
    PTN002887060 (Nitrosopumilus maritimus A9A4T6, Nmar_1494, 158 aa) is matched by the archaeal
    phosphopantetheine adenylyltransferase rule HAMAP MF_00647 and by NCBIfam NF001985, is named
    accordingly by UniProt, and is not matched by the RibL rule. In global alignments it is the least
    RibL-like of the nine leaves (28.8% identity to Q58579, where the other seven non-seed leaves range from
    38.9% to 53.6%) and is closer to the assayed archaeal PPATs of Pyrococcus abyssi (Q9UYT0, 38.6%) and
    Thermococcus kodakarensis (Q5JHE8, 35.5%). PANTHER places the CoaD proteins of five other archaeal
    genomes of this tree in the tree of PTHR10695 and has no Nitrosopumilus leaf there, so A9A4T6 is that
    genome's CoaD placed in this tree, where PANTHER joins it to the second Nitrosopumilus leaf A9A1L5
    by a duplication node. The requested IRD rests on signature matches and sequence comparison: neither
    Nitrosopumilus protein has been assayed.
    Three further leaves are inherited on weaker ground and are left in place: A9A1L5 (206 aa), Sulfolobus
    Q97ZG4 (226 aa) and Pyrobaculum Q8ZYP3 (228 aa) are longer than RibL, two carry a C-terminal DUF357
    domain (Pfam PF04010), none is matched by MF_02115 and none is characterised. They keep both HXGH
    histidines and are 38.9% to 45.9% identical to Q58579, so nothing argues that they lost the activity.
    The two C-terminal cysteines mutated in RibL (Cys126, Cys143) are not both present in every RibL: the
    Halobacterium leaf Q9HRB2 has neither in the alignment. This is not evidence of loss, because the
    mutants lose activity with Co(2+) and keep it with Mg(2+).
