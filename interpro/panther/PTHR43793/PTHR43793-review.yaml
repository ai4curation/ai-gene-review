family_id: PANTHER:PTHR43793
family_name: FAD SYNTHASE
preferred_name: HXGH nucleotidyltransferases (archaeal FAD synthase RibL, glycerol-3-phosphate cytidylyltransferase
  TagD, heptose 1-phosphate adenylyltransferase HldC)
summary: >-
  A family of small nucleotidyltransferases with the Rossmann-like fold and N-terminal HXGH motif first
  described for Bacillus subtilis glycerol-3-phosphate cytidylyltransferase (TagD). Every member transfers
  a nucleoside monophosphate from a nucleoside triphosphate onto a phosphate or phosphonate acceptor,
  releasing diphosphate, but the nucleotide and the acceptor differ between clades. The PANTHER 19 tree has
  26 leaves in four groups. (1) An archaeal clade of nine leaves holds the FAD synthase RibL, which
  adenylylates FMN; Methanocaldococcus jannaschii RibL is the only member of the tree with an experimental
  GO annotation. (2) Three eukaryotic leaves (amphioxus, a choanoflagellate, Entamoeba) of unknown function
  are sister to the archaeal clade. (3) A bacterial clade of five leaves holds TagD/TarD, which makes
  CDP-glycerol for teichoic acid, and a phosphoenolpyruvate mutase fusion of the kind characterised as
  Fom1, whose cytidylyltransferase domain cytidylylates 2-hydroxyethylphosphonate. (4) A bacterial clade of
  nine leaves holds the D-glycero-beta-D-manno-heptose 1-phosphate adenylyltransferase HldC, standalone or
  as the C-terminal domain of bifunctional HldE. InterPro's wider membership also includes archaeal
  phosphopantetheine adenylyltransferases (CoaD), most of which PANTHER places in the tree of PTHR10695.
  No member is a dephospho-CoA kinase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The four clades of the tree use different substrates: FMN and ATP (archaeal RibL), glycerol 3-phosphate
  and CTP (TagD/TarD), 2-hydroxyethylphosphonate and CTP (Fom1-type fusions), heptose 1-phosphate and ATP
  (HldC). The difference is experimental and not only nominal: M. jannaschii RibL was assayed for
  glycerol-3-phosphate cytidylyltransferase activity and has none (a NOT annotation). Subfamily SF1 is not
  a functional unit. PANTHER labels the tree root SF1, so it is the remainder left after SF2 (the HldC
  clade below PTN000077683) is taken out, and it holds RibL, TagD, the Fom1-type fusion, the eukaryotic
  leaves and a CoaD-type protein. Of the 71 reviewed (Swiss-Prot) members in the InterPro inventory, 59
  are named ribL, 6 coaD, 3 tagD or tarD, 1 fom1 and 2 are SF2 HldC/HldE proteins. The only activity
  shared by all is nucleotidyltransferase activity, with the HXGH histidines conserved in 25 of the 26
  leaves.
