family_id: PANTHER:PTHR34265
family_name: TYPE III PANTOTHENATE KINASE
preferred_name: Type III pantothenate kinase (CoaX, Baf)
summary: >-
  Type III pantothenate kinases (CoaX) are bacterial ASKHA-fold (acetate and sugar kinase/Hsc70/actin)
  enzymes, unrelated to the P-loop type I PanK (CoaA) and to the type II PanK of eukaryotes and
  staphylococci. They phosphorylate (R)-pantothenate with ATP in the first step of CoA synthesis from
  pantothenate. The type III isoform was defined by the Bacillus subtilis and Helicobacter pylori
  enzymes: it needs a monovalent cation (NH4+ or K+), is not feedback-inhibited by CoA or acetyl-CoA,
  and does not accept N-pentylpantothenamide. In bacteria lacking CoaA, such as Pseudomonas, CoaX is
  the only pantothenate kinase. PANTHER places all 367 entries in one subfamily (SF1), but the family
  is not uniformly catalytic. Mycobacterium tuberculosis CoaX is a pseudokinase with no ATPase
  activity. It regulates Dop-mediated depupylation of PanB, while CoaA is the essential M.
  tuberculosis PanK. CoaX proteins of other proteasome-bearing actinobacteria are reported to lack
  residues needed for ATPase activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The parsed entries file holds 367 entries, all in PTHR34265:SF1 (357 named type III pantothenate
  kinase, five each named type III pantothenate kinase 1 and 2 for paralog pairs). Pantothenate kinase
  activity is shown for B. subtilis and H. pylori CoaX and inferred genetically for P. aeruginosa CoaX.
  The M. tuberculosis complex protein is a demonstrated exception (pseudokinase). The paper describing
  it reports that CoaX in proteasome-bearing species lacks ATPase residues; 39 entries come from
  actinobacterial genera, which may share the loss. PANTHER does not separate them as a subfamily.
