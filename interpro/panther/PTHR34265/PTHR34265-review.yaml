- subfamily_id: PANTHER:PTHR34265:SF1
  label: TYPE III PANTOTHENATE KINASE
  description: >-
    The only subfamily. It contains the catalytic type III kinases of B. subtilis (P37564),
    H. pylori (O25533), P. aeruginosa (Q9HWC1), Thermotoga maritima (Q9WZY5) and P. putida KT2440
    (Q88QQ0), and the M. tuberculosis CoaX pseudokinase (P9WPA1). The coenzyme_a_biosynthesis module
    uses the family as the selector for the type III pantothenate kinase variant, with B. subtilis
    and P. putida CoaX as representatives.
