term_assessments:
- assessed_term:
    id: GO:0004594
    label: pantothenate kinase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the defining activity of the family, shown biochemically for B. subtilis and H. pylori CoaX.
    In P. aeruginosa CoaX is the only pantothenate kinase. No PAINT IBD has been placed in this family,
    so members receive the term only through InterPro2GO and HAMAP. M. tuberculosis complex CoaX is a
    pseudokinase, recorded as member exceptions; the six MTBC entries in the family have the same
    sequence as H37Rv P9WPA1. Whether other actinobacterial CoaX proteins are also inactive is not
    established, because residue loss was reported only at the level of an alignment.
  member_exceptions:
  - member:
      id: UniProtKB:P9WPA1
      gene_symbol: coaX
      organism: Mycobacterium tuberculosis H37Rv
    exception_reason: >-
      Pseudopantothenate kinase. Purified CoaX does not hydrolyse ATP with pantothenate. coaX is
      dispensable and does not complement an E. coli coaA(Ts) mutant. CoaA is the essential PanK.
    supported_by:
    - reference_id: PMID:39585979
      supporting_text: CoaX is a pseudopantothenate kinase that showed evidence of binding to pantothenate, an essential nutrient Mtb synthesizes, but not its phosphorylation.
    - reference_id: PMID:20576686
      supporting_text: proving that CoaA is the essential pantothenate kinase in M. tuberculosis
