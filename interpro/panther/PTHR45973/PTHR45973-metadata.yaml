  name:
    name: Ciliary and flagellar integrity-associated protein
    short: Cilia_flagella_integrity
  description:
  - text: This family of proteins is involved in the structural and functional integrity
      of cilia and flagella, which are essential for cell motility and sensory functions.
      Members of this family participate in the assembly and regulation of dynein
      arms, which are motor protein complexes that drive the beating of cilia and
      flagella. They also contribute to the maintenance of the axoneme, the ciliary
      and flagellar skeleton, ensuring proper alignment and microtubule sliding. Additionally,
      some proteins in this family are implicated in the organization of the mitotic
      spindle and centrosome integrity during cell division, as well as in ciliogenesis
      regulation by preventing the formation of cilia through centriole capping.
