  scope: UNRESOLVED
  scope_reason: >-
    Safe for every descendant of the Bilateria node PTN000473192 (vertebrate NCSTN, fly Nct,
    worm APH-2). Not applicable to Dictyostelium or plant nicastrin. The family has a single
    subfamily, so SUBFAMILY_ONLY cannot express this node-bounded scope. The value UNRESOLVED
    reflects that schema limitation and is not biological uncertainty.
