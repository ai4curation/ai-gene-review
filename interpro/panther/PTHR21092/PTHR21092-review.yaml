    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    In the PANTHER 19 tree, PTN000473192 is the Bilateria SPECIATION node that joins the
    Euteleostomi (PTN002721232) and Ecdysozoa (PTN000473221) clades. It excludes Dictyostelium
    (PTN000473230) and Arabidopsis (PTN001844114), so the placement stops exactly at the
    lineages that have Notch. Drosophila Nicastrin is required at the S3 cleavage step, and
    human NCSTN is an experimentally defined gamma-secretase subunit. Nicastrin does part of the
    work of this cleavage, as the substrate-recognizing subunit of the enzyme complex, so this is
    participation and not just necessity. The two seeds come from both sides of the node, which
    is enough.
