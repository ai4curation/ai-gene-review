notes: >-
  Topology comes from the PANTHER 19 treeinfo service, filtered to model organisms. Seed ids
  were resolved with UniProt REST xref queries. The PAINT IBD for GO:0005886 plasma membrane at
  PTN000473190 was not assessed. No lineage is known to replace nicastrin with a non-homologous
  protein. Nicastrin is conserved as a single-copy gene, and Notch S3 cleavage needs it in every
  bilaterian model tested.
