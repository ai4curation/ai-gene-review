family_id: PANTHER:PTHR21092
family_name: NICASTRIN
summary: >-
  Nicastrin is the large single-pass type I transmembrane glycoprotein subunit of
  gamma-secretase. Its ectodomain is folded like an aminopeptidase but has no catalytic
  activity. It stabilizes the complex and helps recognize substrates: it engages the short
  ectodomain stubs left by ectodomain shedding, such as the Notch extracellular truncation
  produced by ADAM S2 cleavage and the APP C-terminal fragments. Nicastrin is required for
  presenilin maturation and for gamma-secretase activity. In animals it is needed for Notch
  S3 cleavage: Drosophila Nicastrin mutants block the S3 step, and C. elegans APH-2/nicastrin
  depletion phenocopies loss of GLP-1/Notch. Nicastrin orthologs are present across
  eukaryotes, including Dictyostelium, where it is needed for gamma-secretase activity in an
  organism without Notch, and plants.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  PANTHER defines a single subfamily (SF0, NICASTRIN), and all characterized members act as
  gamma-secretase subunits. Notch-pathway roles are restricted to the metazoan part of the tree.
  Dictyostelium nicastrin (Q54JT7) is required for gamma-secretase processing of APP but works
  in an organism without Notch. Arabidopsis nicastrin (Q8GUM5) has no demonstrated
  gamma-secretase function. Because the subfamily axis cannot separate these groups, Notch
  scoping has to use the Bilateria node PTN000473192.
