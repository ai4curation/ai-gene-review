  assessment: UNRESOLVED
  assessment_reason: >-
    Seeds from mammals and Dictyostelium support this general term at least at the Unikonts
    node (PTN000473191). Placing it at Eukaryota also passes it to plant nicastrin, for which
    gamma-secretase activity has not been demonstrated. This is not a Notch term. It is recorded
    because it shows that the non-Notch complex function is correctly placed deeper than the
    Notch term.
