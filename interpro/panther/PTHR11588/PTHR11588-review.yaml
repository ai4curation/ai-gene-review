  assessment: LOSS_CONTRADICTED
  assessment_reason: >-
    This IRD stops the tubulin-root IBD for microtubule (PTN000172598, seeded by alpha and
    beta tubulins) from descending into the gamma-tubulin clade (134 leaves; subfamilies
    SF7, SF62, SF79, SF381). The curator's intent is clear and biologically right in one
    sense: gamma-tubulin is not a lattice-forming tubulin, and the node instead carries IBDs
    for gamma-tubulin complex, spindle pole and microtubule nucleator activity. But
    GO:0005874 is a cellular component, and the location is retained. The gamma-tubulin
    ring complex caps microtubule minus ends, and GO:0036449 microtubule minus-end is
    part_of GO:0005874. Gamma-tubulin is also recruited along the length of existing
    microtubules for branching nucleation: by augmin on human spindle microtubules, and
    along cortical microtubules in plants. Independent IDA annotations from four groups
    (TAIR, FlyBase, UniProt, MGI) in human, mouse, Arabidopsis and fly record exactly this
    association. The loss of a lattice role belongs in the MF row (structural constituent
    of cytoskeleton, assessed below), not as a NOT on the microtubule location. The mouse
    IDAs (PMID:14667810, PMID:18347012) are abstract-only and were not checked, but the
    case does not rest on them.
  supported_by:
  - reference_id: PMID:16603653
    supporting_text: In Arabidopsis uninduced control cells, γ-tubulin is distributed on the
      cortex and along cortical MTs in a patchy pattern.
  - reference_id: PMID:22144887
    supporting_text: In plant cells, γ-tubulin is spatially not restricted to MT ends but also
      colocalizes along MTs
  - reference_id: PMID:30723163
    supporting_text: The Augmin protein complex recruits γ-tubulin ring complex (γ-TuRC) to
