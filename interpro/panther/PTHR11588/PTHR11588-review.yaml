    label: Eukaryota
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    This IRD stops the tubulin-root IBD for structural constituent of cytoskeleton
    (PTN000172598), which is seeded by alpha and beta tubulins whose heterodimers build the
    microtubule lattice, from descending into the gamma-tubulin clade. Gamma-tubulin does not
    polymerise into the lattice. It acts as a minus-end nucleation template within the
    gamma-tubulin ring complex, and PAINT records that activity at the same node as an IBD
    for GO:0140490 microtubule nucleator activity. The two conflicting annotations, IMPs on
    Aspergillus mipA and yeast TUB4, rest on phenotypes: the mutants are lethal, lose the
    mitotic apparatus, and have disorganised cytoplasmic and nuclear microtubule arrays.
    The protein localises to the spindle pole body. These results show that gamma-tubulin is
    necessary for microtubule organisation and is an SPB component. They do not show that
    it is a structural constituent of the cytoskeleton in the lattice sense of the ancestral
    IBD. The authors themselves interpret the role as nucleation and attachment at the SPB.
    The IMPs are better captured by nucleator activity and spindle pole body location, so
    the loss is right for the whole clade. This assessment does not ask for the
    species-level IMPs to be removed. The yeast abstract was read but not the full text.
  supported_by:
  - reference_id: PMID:2194669
    supporting_text: We propose that gamma-tubulin attaches microtubules to the spindle pole
      body, nucleates microtubule assembly, and establishes microtubule polarity in vivo.
  - reference_id: PMID:8557744
    supporting_text: These data indicate that the S. cerevisiae gamma-tubulin protein is an
      important SPB component that organizes both cytoplasmic and nuclear microtubule arrays.
