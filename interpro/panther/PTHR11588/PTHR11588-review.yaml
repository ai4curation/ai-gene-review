family_id: PANTHER:PTHR11588
family_name: TUBULIN
summary: Tubulin-family GTP-binding proteins form or organize microtubule structures. Alpha/beta heterodimers
  make the microtubule lattice, whereas gamma-tubulin supports nucleation and other tubulin classes have
  specialized centriole or basal-body roles. Isotype-specific expression and lattice properties add a
  further level of divergence.
functional_coherence: HETEROGENEOUS
coherence_reason: Tubulins diversify into alpha, beta, gamma, delta, epsilon and zeta subfamilies with
  distinct polymer, nucleation and basal-body roles; a phylogenomic analysis of 3524 tubulins documents
  their duplication and loss (PMID:25169981). GTP binding is not equivalent to GTP hydrolysis, especially
  for alpha versus beta tubulin in the heterodimer. Fly betaTub97EF increases microtubule stability under
  low-temperature conditions (PMID:29084803); that isoform-specific property is not a property of all
  tubulins. A universal GTPase grant is therefore unresolved without distinguishing nucleotide-site chemistry
  and branch architecture.
