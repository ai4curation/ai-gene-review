  name:
    name: GDSL esterase/lipase enzyme
    short: GDSL_lipolytic_enzyme
  description:
  - text: The GDSL lipolytic enzyme family encompasses a group of proteins with esterase
      and lipase activities, which are involved in a variety of biological processes
      including plant defense and root nodule physiology. Members of this family are
      characterized by their ability to hydrolyze ester bonds in substrates such as
      lipids, acetylated alkaloids, and fucosylated xyloglucan oligosaccharides. Some
      proteins within the family exhibit specificity towards certain substrates, such
      as p-nitrophenyl palmitate, acetylthiocholine, and sinapine. The activity of
      some family members is known to be inhibited by phenylmethylsulfonyl fluoride
      (PMSF). The broad substrate specificity and regulatory mechanisms suggest diverse
      roles in plant metabolism and development.
