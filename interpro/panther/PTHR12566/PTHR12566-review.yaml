family_id: PANTHER:PTHR12566
family_name: CYTOPLASMIC POLYADENYLATION ELEMENT BINDING PROTEIN  CPEB
preferred_name: CPEB translational regulators
summary: CPEB proteins bind regulatory elements in mRNA 3-prime untranslated regions and control translation
  through cytoplasmic polyadenylation and repression mechanisms. Their conserved RNA-binding region combines
  RNA recognition motifs with a zinc-binding domain. Orb and the CPEB paralogs have different mRNA targets
  and developmental deployments, while the shared activity is post-transcriptional regulation rather than
  transcription factor activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'CPEB proteins regulate translation through sequence-selective RNA recognition and assembly
  of regulatory complexes. Human CPEB structures establish the tandem-RRM/ZZ RNA-recognition architecture
  (PMID:24990967), and fly Orb/Orb2 CLIP establishes CPE-like RNA targets (PMID:27791065). Mechanisms
  differ even between Orb2 isoforms: Orb2A can supply a glutamine-rich assembly function without requiring
  its RNA-binding domain, whereas Orb2B requires RNA binding for memory (PMID:23083740). Broad translation
  regulation is conserved; direct RNA engagement by every isoform, particular target transcripts and neuronal
  or germline phenotypes are not interchangeable family properties.'
