  assessment_reason: >-
    Same RNase III node. The nucleases of SF0 regulate gene expression: Drosha processes primary
    microRNAs, Candida Dcr1 processes siRNAs and is needed for RNA silencing (PMID:22173636),
    and S. pombe Pac1 is needed for mRNA turnover (PMID:34352089). The mitoribosomal MRPL44 and
    MRPL3 branches are ribosome subunits, for which the loss is right. They sit under two nodes,
    PTN001025433 (MRPL44, 33 leaves) and PTN001025446 (MRPL3, 14 leaves); the IRD belongs on
    both. Drosha, Dcr1 and Pac1, all inside this clade, are among the seeds of the ancestral
    PTN000129453 IBD that the IRD blocks (projects/IRD_EVIDENCE/ird_seed_check.md).
