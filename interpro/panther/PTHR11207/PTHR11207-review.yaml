  PTN nodes (PANTHER:PTN000129453, PANTHER:PTN000129454, PANTHER:PTN000129531, PANTHER:PTN000879608, PANTHER:PTN000879634
  (+2 more)) with different molecular function assignments across clades (ribonuclease III activity (GO:0004525),
  structural constituent of ribosome (GO:0003735), double-stranded RNA binding (GO:0003725)), indicating
  clade-level functional specialization across the family.
