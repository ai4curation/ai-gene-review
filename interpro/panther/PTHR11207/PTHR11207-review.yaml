  more)) with 17 IBD node assertion(s) and 3 term(s) carrying negated IRD/IKR branch blocks, covering
  double-stranded RNA binding (GO:0003725, MF), ribonuclease III activity (GO:0004525, MF), RNA processing
  (GO:0006396, BP), regulation of gene expression (GO:0010468, BP) and 13 additional GO term(s).
