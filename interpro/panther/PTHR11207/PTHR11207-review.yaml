family_id: PANTHER:PTHR11207
family_name: RIBONUCLEASE III
preferred_name: Ribonuclease III family, including Drosha, fungal Rnt1/Pac1 and mitoribosomal MRPL44/MRPL3
summary: >-
  PTHR11207 contains RNase III-domain proteins. Drosha and the fungal enzymes Rnt1, Pac1 and Candida Dcr1
  are double-strand-specific endoribonucleases that process rRNA, snRNA and microRNA or siRNA precursors.
  The mitochondrial ribosomal proteins MRPL44 and MRPL3 carry an RNase III-like domain as ribosome subunits.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The nucleases (SF0) process double-stranded RNA and regulate gene expression; the mitoribosomal branches
  (MRPL44, SF5; MRPL3, SF32) are ribosome structural subunits.
