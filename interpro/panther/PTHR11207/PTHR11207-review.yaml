  assessment_reason: >-
    PTN000129456 (Opisthokonta, 96 leaves) contains the RNase III nucleases of SF0 (Drosha; S.
    cerevisiae Rnt1; S. pombe Pac1; Candida Dcr1) together with the mitoribosomal MRPL44 (SF5)
    and MRPL3 (SF32) branches. Purified Pac1 is a highly active double-strand-specific
    endoribonuclease (PMID:8710510), and Drosha and Rnt1 process double-stranded RNA precursors,
    so the clade binds double-stranded RNA. This is one of the IRDs whose clade contains a seed
    of the IBD it blocks (projects/IRD_EVIDENCE/ird_seed_check.md): Pac1 seeds the ancestral
    PTN000129453 IBD for double-stranded RNA binding. No branch below the node is shown here to
    have lost the function, so the request is to retract the IRD rather than move it.
