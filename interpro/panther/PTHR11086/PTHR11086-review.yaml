    label: SPBC2G2.13c
    organism: Schizosaccharomyces pombe
  - id: UniProtKB:Q9BWV3
    label: CDADC1
    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    Seeded from both subfamilies, including CDADC1 itself, and consistent with a soluble
    nucleotide-pool enzyme. The DCD1 review accepts the IBA.
