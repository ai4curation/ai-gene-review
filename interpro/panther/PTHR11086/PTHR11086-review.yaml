family_id: PANTHER:PTHR11086
family_name: DEOXYCYTIDYLATE DEAMINASE-RELATED
preferred_name: Zinc-dependent dCMP deaminase (DCTD) and CDADC1 dCTP deaminase family
summary: >-
  Zinc-dependent deoxycytidylate (dCMP) deaminases (DCTD, EC 3.5.4.12) hydrolytically deaminate
  dCMP to dUMP and ammonia, supplying the thymidylate synthase substrate in Gram-positive
  bacteria, eukaryotes and T-even phages. They are homohexamers. Each protomer has one
  cytidine/dCMP deaminase-like domain with a catalytic site and an allosteric site, at which
  dCTP activates and dTTP inhibits. Budding-yeast DCD1 is the dCMP deaminase of
  S. cerevisiae, which has no dCTP deaminase. Vertebrates also have a paralog, CDADC1
  (NYD-SP15). It carries two DCTD-like domains, of which only the C-terminal one is active,
  and it is a dCTP deaminase that converts dCTP directly to dUTP. CDADC1 has little or no
  dCMP deaminase activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The main subfamily, SF18 (DEOXYCYTIDYLATE DEAMINASE), holds the dCMP deaminases: yeast DCD1,
  fission yeast SPBC2G2.13c, human DCTD, fly, worm, Arabidopsis and the T2/T4 phage enzymes.
  SF14 (CYTIDINE AND DCMP DEAMINASE DOMAIN-CONTAINING PROTEIN 1) holds vertebrate CDADC1, which
  has diverged to a dCTP deaminase. SF18 also contains B. subtilis ComEB, an uncharacterized
  competence-operon protein dispensable for transformation, and an uncharacterized Aliivibrio fischeri
  deaminase. PANTHER also defines SF22 (TRNA-SPECIFIC ADENOSINE DEAMINASE), which has no
  reviewed or model-organism member and was not examined.
