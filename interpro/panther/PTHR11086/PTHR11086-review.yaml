notes: >-
  Module: modules/dntp_de_novo_synthesis.yaml selects PANTHER:PTHR11086:SF18 with
  GO:0004132. The subfamily scoping correctly excludes CDADC1. The module's role description
  (dCTP activation, dTTP inhibition) fits SF18. There is no gene review for human CDADC1,
  DCTD or fission yeast SPBC2G2.13c in the repo. The PAINT inheritance of PTN008316029 by the
  CDADC1 orthologs (SF14), and by B. subtilis ComEB (P32393), was read from the PAINT UniProt
  GAF and the PANTHER 19 model-organism classification files. Taxa were mapped to superkingdom
  with UniProt taxonomy. .cache/panther/IBD.gaf has no IRD/IKR rows for these nodes. The two
  CDADC1 papers disagree about residual dCMP activity, which is recorded rather than resolved.
