- subfamily_id: PANTHER:PTHR11086:SF14
  label: CYTIDINE AND DCMP DEAMINASE DOMAIN-CONTAINING PROTEIN 1
  description: Vertebrate CDADC1, a two-domain DCTD-related protein.
  representative_members:
  - id: UniProtKB:Q9BWV3
    label: dCTP deaminase
    gene_symbol: CDADC1
    organism: Homo sapiens
  - id: UniProtKB:Q8BMD5
    label: dCTP deaminase
    gene_symbol: Cdadc1
    organism: Mus musculus
  diverged_from_family: true
  divergence_description: >-
    CDADC1 is a dCTP deaminase (dCTP to dUTP; GO:0008829), not a dCMP deaminase. Two 2025
    studies differ only in degree. One found no detectable dCMP activity. The other found
    weak dCMP deamination with a very high Km, and a strong preference for dCTP. Its
    N-terminal DCTD-like domain is inactive. Mouse genetics show that Cdadc1 loss is tolerated
    even without Dctd.
  supported_by:
  - reference_id: PMID:40504152
    supporting_text: as a vertebrate-specific dCTP deaminase, that catalyzes the direct conversion
      of dCTP into dUTP
  - reference_id: PMID:40504152
    supporting_text: CDADC1 showed no activity on dCMP, cytidine, or dC
  - reference_id: PMID:40324085
    supporting_text: contains an inactive N-terminal and active C-terminal DCTD-like domain
node_assessments:
- node_id: PANTHER:PTN008316029
  asserted_term:
    id: GO:0004132
    label: dCMP deaminase activity
  paint_snapshot: '20231128'
  seeds:
  - id: SGD:S000001187
    label: DCD1
    organism: Saccharomyces cerevisiae
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    PAINT records no taxon for this node. Its inheritors in the PAINT UniProt GAF are 89
    eukaryotic, 14 bacterial and 3 archaeal taxa. The single seed is yeast DCD1. Placement deep
    in the family is defensible, because dCMP deaminases of the same fold occur in Gram-positive
    bacteria, phages and eukaryotes, and the DCD1 review accepts the IBA. But the node also
    passes the activity to the vertebrate CDADC1 branch (SF14: human, mouse, rat, cow, chicken,
    frog and zebrafish CDADC1). That branch is a dCTP deaminase with no or only weak dCMP
    activity. An IRD on the CDADC1 clade, plus a dCTP deaminase activity assertion there, would
    correct this. A second, minor caveat is that B. subtilis ComEB (SF18) also inherits the
    activity without any functional evidence.
  affected_subfamilies:
  - id: PANTHER:PTHR11086:SF14
    label: CYTIDINE AND DCMP DEAMINASE DOMAIN-CONTAINING PROTEIN 1
  supported_by:
  - reference_id: PMID:40504152
    supporting_text: CDADC1 showed no activity on dCMP, cytidine, or dC
  - reference_id: PMID:40324085
    supporting_text: explaining the CDADC1 preference for dCTP.
