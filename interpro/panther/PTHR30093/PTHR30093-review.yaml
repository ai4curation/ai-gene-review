- assessed_term:
    id: GO:0015627
    label: type II protein secretion system complex
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The T2SS complex term applies to the pseudopilin clade only. A monoderm competence pilin has
    no T2SS to be part of, and a type IV pilin is part of the pilus (GO:0044096) instead.
  applicable_subfamilies:
  - id: PANTHER:PTHR30093:SF44
    label: TYPE II SECRETION SYSTEM CORE PROTEIN G
  supported_by:
  - reference_id: PMID:19828448
    supporting_text: This observation suggested the existence of a quaternary, rather than
      ternary, complex (XcpU(H)-V(I)-W(J)-X(K)) at the tip of the pseudopilus
- assessed_term:
    id: GO:0005198
    label: structural molecule activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member of the family is a subunit of a helical filament, whether pseudopilus, type IV
    pilus or competence pilus, so the structural role is the one thing the whole family shares.
    Only the identity of the filament differs.
  supported_by:
  - reference_id: PMID:12700254
    supporting_text: We show that, upon overexpression, the XcpT pseudopilin can be assembled in a
      pilus, which we call a type II pseudopilus
notes: >-
  Used by modules/bacterial_type_ii_secretion.yaml at PANTHER:PTHR30093:SF44 for the GspG major
  pseudopilin, with P. aeruginosa XcpT (Q00514), P. putida KT2440 GspG (Q88P04), Klebsiella PulG
  (P15746) and Vibrio EpsG (P45773) as exemplars. The module's GspH annoton is grounded on
  InterPro IPR049875 rather than on this family, because UniProt assigns the GspH minor
  pseudopilins to the same SF44 subfamily as GspG and the subfamily therefore does not separate
  them. The type IV pilus nodes (PTN002013003, PTN008624060) and their Ricinus losses are assessed
  here for completeness but are outside the module's scope. The IBD seeds XcpT and XcpU are the
  same PseudoCAP rows whose reference and evidence-code defects are recorded in
  genes/PSEAE/xcpT/xcpT-ai-review.yaml and genes/PSEAE/xcpU/xcpU-ai-review.yaml; re-seeding should
  be coordinated with those corrections.
