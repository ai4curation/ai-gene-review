- subfamily_id: PANTHER:PTHR30093:SF34
  label: PREPILIN PEPTIDASE-DEPENDENT PROTEIN D
  description: >-
    Major pilins of type IVa and IVb pili (P. aeruginosa PilA, Neisseria PilE, Dichelobacter
    FimA, Acinetobacter ComP). These build a retractile surface pilus, not a periplasmic
    pseudopilus.
  representative_members:
  - id: UniProtKB:P04739
    label: Type IV major pilin protein PilA
  - id: UniProtKB:P02974
    label: Type IV major pilin protein PilE1
  diverged_from_family: true
  divergence_description: >-
    Type IV pilins assemble into a cell-surface filament that extends and retracts and mediates
    adhesion, twitching motility and DNA uptake; they are not components of a type II secretion
    system. PilA can nevertheless be cross-linked to the T2SS pseudopilin XcpT and contributes to
    exoprotein secretion efficiency in P. aeruginosa, so the two systems interact without sharing
    terms.
  supported_by:
  - reference_id: PMID:9282737
    supporting_text: an oligohistidine-tagged XcpT was shown to form stoichiometric complexes with
      PilA, and with XcpT, U, V and W
- subfamily_id: PANTHER:PTHR30093:SF47
  label: TYPE IV PILUS NON-CORE MINOR PILIN PILE
  description: >-
    Minor pilins of the type IVa pilus, which prime pilus assembly at the tip.
  representative_members:
  - id: UniProtKB:G3XD43
    label: Type IV pilus non-core minor pilin PilE
  diverged_from_family: true
  divergence_description: >-
    A type IV pilus component, functionally parallel to the T2SS minor pseudopilins but acting in
    the pilus machine; P. aeruginosa minor pilins including PilE prime type IVa pilus assembly.
  supported_by:
  - reference_id: PMID:25389296
    supporting_text: Pseudomonas aeruginosa minor pilins prime type IVa pilus assembly and promote
      surface display of the PilY1 adhesin
- subfamily_id: PANTHER:PTHR30093:SF2
  label: TYPE II SECRETION SYSTEM PROTEIN H
  description: >-
    ComGC-type competence pilins of monoderm bacteria, despite the subfamily name. The
    representative is Halalkalibacterium halodurans ComGC.
  representative_members:
  - id: UniProtKB:Q9K923
    label: Competence protein ComGC
  diverged_from_family: true
  divergence_description: >-
    Competence pseudopili of monoderm (Gram-positive) bacteria take up DNA; there is no outer
    membrane and no secretin, so neither the T2SS complex term nor the T2SS process term applies,
    and the subfamily label is misleading.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30093/PTHR30093-entries.csv
    supporting_text: Q9K923,Competence protein ComGC
