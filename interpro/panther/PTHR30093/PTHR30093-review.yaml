family_id: PANTHER:PTHR30093
family_name: GENERAL SECRETION PATHWAY PROTEIN G
preferred_name: Type IV pilins and type II secretion pseudopilins
summary: >-
  Small prepilin-type proteins that are made with a short positively charged leader peptide
  followed by a hydrophobic helix, matured by the prepilin peptidase/N-methyltransferase PilD
  (PTHR30487), and polymerised into helical surface or periplasmic filaments. The family holds
  three functionally distinct kinds of filament subunit: the GspG major pseudopilins of type II
  secretion systems (SF44, including P. aeruginosa XcpT, Klebsiella PulG, Vibrio EpsG, Dickeya
  OutG), the major and minor pilins of type IV pili (SF34 PilA, SF47 PilE), and the ComGC-type
  competence pilins of monoderm bacteria (SF2). PAINT accordingly carries two separate IBD nodes,
  one for the T2SS clade and one for the T4P clade, plus plant-leaf losses.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members are PilD-processed filament subunits with the same fold and assembly chemistry, but
  the filaments do different jobs in different machines: pseudopilus-driven exoprotein secretion
  (T2SS), extension and retraction for adhesion, motility and DNA uptake (T4P), and DNA uptake in
  competence systems. The cellular-component and biological-process terms of one kind must not be
  propagated to another, which is what the family's two IBD nodes keep apart.
