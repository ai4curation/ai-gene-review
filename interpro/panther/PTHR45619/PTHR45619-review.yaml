  negated: true
  seeds:
  - id: PANTHER:PTN001705142
    label: PTN001705142 (ancestral IBD node; IRD source)
  paint_snapshot: '20260530'
  node_taxon:
    id: NCBITaxon:1437201
    label: Pentapetalae
  assessment: LOSS_CONTRADICTED
  proposed_action:
    paint_action: REMOVE_LOSS
  assessment_reason: >-
    PTN001705193 is a eudicot (Pentapetalae) clade of PP2A catalytic subunits (49 leaves), including Arabidopsis
    PP2A1 and PP2A2 (SF16). TAIR annotates both to cytosol by IDA from PMID:22404109. The cached abstract
    names the PP2A A (scaffold) subunits as residing in nucleus and cytosol; the curator read the full
    text, and the A subunit forms the core dimer with the catalytic subunit, so a cytosolic C subunit
    is expected. The same node carries a positive IBA for cytoplasm, which a loss of cytosol sits awkwardly
    against.
  supported_by:
