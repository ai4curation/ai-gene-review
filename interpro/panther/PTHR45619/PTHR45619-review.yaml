family_id: PANTHER:PTHR45619
family_name: SERINE/THREONINE-PROTEIN PHOSPHATASE PP2A-RELATED
preferred_name: PP2A catalytic subunit and related phosphatases
summary: >-
  PTHR45619 contains the catalytic subunits of protein phosphatase 2A and related PPP-family serine/threonine
  phosphatases. PP2A acts as a heterotrimer with scaffold (A) and regulatory (B) subunits in the cytosol
  and nucleus.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Members share PPP phosphatase activity; they differ in the holoenzymes they join and in their substrates.
