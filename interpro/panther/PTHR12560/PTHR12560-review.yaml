family_id: PANTHER:PTHR12560
family_name: LONGEVITY ASSURANCE FACTOR 1  LAG1
preferred_name: Ceramide synthase (LAG1/LAC1/CERS) family
summary: >-
  TLC-domain multi-pass ER membrane ceramide synthases that N-acylate a sphingoid base
  (sphinganine, sphingosine, phytosphingosine or the nematode C17 iso-branched base) with a
  fatty acyl-CoA. The PANTHER 19 tree is exclusively eukaryotic (434 leaves, 101 species) and
  its root is a speciation node labelled Eukaryota. Paralogs arose independently in animals
  (CERS1 against the CERS2-6 lineage before Eumetazoa; CERS2/3, CERS4, CERS5 and CERS6 in
  vertebrates; hyl-1 and hyl-2 in nematodes), in fungi (two Dikarya clades) and in land plants
  (the LOH1/LOH3 and LOH2 clades), and differ in acyl-chain and sphingoid-base preference, not
  in the reaction catalysed. The catalytic His-His pair of the Lag1p motif is conserved in
  every clade of the alignment. Many animal members also carry a homeobox-like region, which in
  Drosophila schlank has a separate transcriptional role.
functional_coherence: COHERENT
coherence_reason: >-
  Every experimentally characterised member in the tree is a ceramide synthase: the six
  mammalian CERS, Drosophila schlank, C. elegans hyl-1, hyl-2 and lagr-1, S. cerevisiae LAG1
  and LAC1, S. pombe lag1 and lac1, Candida albicans LAG1 and LAC1, both Aspergillus nidulans
  paralogs and Arabidopsis LOH1, LOH2 and LOH3. Experimental sphingosine N-acyltransferase
  annotations (QuickGO, queried by GO:0050291 and descendants, 22 family leaves returned) lie
  on both sides of the root. In the PANTHER family alignment the catalytic His-His pair
  (human CERS6 H211/H212, S. cerevisiae LAC1 H255/H256) is H in 425 and 427 of 434 leaves; the
  exceptions are alignment gaps in short or fragmentary sequences and three unreviewed
  single leaves with a substitution, none of them a characterised protein and none forming
  a clade. No pseudoenzyme subfamily was found. Paralog divergence is in acyl-chain
  and sphingoid-base preference and in physiological role. The one PAINT loss in the family,
  the IKR on the Caenorhabditis hyl-2 node, is contradicted by the record (see the node
  assessment), so it is not counted as an exception to coherence.
