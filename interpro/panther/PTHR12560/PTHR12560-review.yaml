  assessment: SOUND
  assessment_reason: >-
    PTN000285423 is the root of the tree, a speciation node labelled Eukaryota with 434 leaves
    in 101 species and no bacterial or archaeal leaf. Its two children are the Unikonts node
    PTN004369228 (animals, fungi, Amoebozoa; 209 leaves) and the node PTN000970771 holding the
    plant, alveolate, stramenopile and excavate leaves (225 leaves). The seeds lie on both
    sides: mouse, human, fly, budding and fission yeast under the first, Arabidopsis LOH1,
    LOH2 and LOH3 under the second, so the root is the most recent common ancestor of the
    seeds and the placement is neither too deep nor too shallow. Direct ER evidence was
    confirmed in QuickGO (queried by GO:0005783 and descendants, experimental codes; 18 family
    leaves returned) for mammalian CERS1-6, schlank, S. cerevisiae LAG1 and LAC1, S. pombe lag1
    and lac1 and the three Arabidopsis enzymes. The reaction uses acyl-CoA and sphingoid base
    at the ER membrane in every characterised member and no clade is known to have relocated.
    Drosophila schlank is additionally found at the inner nuclear membrane and in the nucleus
    (PMID:26950647), which adds a location and does not contradict this one.
  supported_by:
  - reference_id: file:interpro/panther/PTHR12560/PTHR12560-paint.tsv
    supporting_text: "PTHR12560\tPTN000285423\tGO:0005783\tC\tIBD\tfalse"
