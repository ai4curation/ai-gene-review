    through key residues, and the residues are present: in the PANTHER alignment both hyl-2
    leaves carry R87, H168 and H169 at the columns of human CERS6 R131, H211 (the active-site
    nucleophile) and H212, and of S. cerevisiae LAC1 R172, H255 and H256. The experimental
    record says the opposite of a loss. UniProt gives hyl-2 EC 2.3.1.297 with experimental
    evidence from PMID:19372430 and PMID:38677510, and the hyl-2(gnv1) allele, which changes
    exactly this His-His pair to Gln-Tyr, abrogates ceramide synthase activity; loss of HYL-2
    removes ceramides with acyl chains of C22 and shorter (PMID:23894595). The nematode
    sphingoid base is a C17 iso-branched base, not sphingosine itself, but that cannot
    justify the loss: hyl-1 and lagr-1 act on the same bases and receive the positive IBA,
    and the family's seeds include enzymes annotated to this term for sphinganine and
    phytosphingosine. QuickGO holds no experimental NOT for this term on any leaf of the
    family, and no experimental molecular-function annotation at all for hyl-1, hyl-2 or
    lagr-1 (an annotation gap for WormBase, not evidence of absence). PAINT's rationale for
    the IKR is not recorded in the data available here and could not be established. The
    loss should be retired so that the root IBD descends to both hyl-2 leaves.
  proposed_action:
    paint_action: REMOVE_LOSS
