family_id: PANTHER:PTHR12560
family_name: LONGEVITY ASSURANCE FACTOR 1  LAG1
preferred_name: Ceramide synthase (LAG1/LAC1/CERS) family
summary: >-
  TLC-domain ER membrane ceramide synthases N-acylate sphinganine and sphingosine with acyl-CoA.
  Fungal LAG1/LAC1 (S. cerevisiae), lag1/lac1 (S. pombe) and the six mammalian CERS paralogs differ
  in acyl-chain preference (CERS1 C18, CERS2 C22-C24, CERS3 very-long-chain).
functional_coherence: COHERENT
coherence_reason: All subfamilies are ceramide synthases; acyl-chain specificity is paralog-specific.
