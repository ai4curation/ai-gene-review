term_assessments:
- assessed_term:
    id: GO:0050291
    label: sphingosine N-acyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterised member N-acylates a sphingoid base with acyl-CoA, the root IBD is
    seeded from both sides of the tree, and the catalytic His-His pair is conserved in every
    clade of the alignment. Paralogs differ in acyl-chain length and sphingoid-base
    preference, which the term does not constrain. No member exception is recorded: the one
    PAINT loss, on Caenorhabditis hyl-2, is contradicted by direct evidence, so hyl-2 is in
    scope. The term names sphingosine, but GO and the seeds use it for the enzyme class
    whatever the sphingoid base (sphinganine, phytosphingosine, the nematode C17 base).
  supported_by:
  - reference_id: file:interpro/panther/PTHR12560/PTHR12560-paint.tsv
    supporting_text: "PTHR12560\tPTN000285423\tGO:0050291\tF\tIBD\tfalse"
