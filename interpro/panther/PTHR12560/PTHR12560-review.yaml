  assessment: SOUND
  assessment_reason: >-
    The 22 seeds are experimentally characterised ceramide synthases on both sides of the root
    (mammalian CERS1-6, schlank, S. cerevisiae LAG1 and LAC1, both C. albicans and both A.
    nidulans paralogs under the Unikonts child; Arabidopsis LOH1-3 under the other), so the
    root is their most recent common ancestor. The same proteins were recovered from QuickGO
    queried by term id with experimental evidence codes. The alignment supports inheritance by
    the unseeded clades too: the catalytic His-His pair is conserved in the Amoebozoa,
    excavate, alveolate-stramenopile and green-algal clades as well as in animals, fungi and
    land plants. Of 434 leaves, 25 differ from the reference at the conserved Arg/Lys column or the His
    pair, and most of these are gaps in short or incomplete sequences; the leaves with an actual
    substitution at a His column are unreviewed single sequences (one P. falciparum paralog,
    one banana and one tobacco sequence), not a clade, and no pruning is requested on
    alignment evidence alone. The paralog-rich animal, fungal and plant clades differ in
    acyl-chain preference, which this term does not specify, so nothing narrower than the
    root is needed. The IBD itself is sound; the only problem with this term in the family
    is the IKR that PAINT places below it on the hyl-2 node, assessed separately.
