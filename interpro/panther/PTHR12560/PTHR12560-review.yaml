notes: >-
  Re-review of 2026-11-26. Tree: PANTHER release 19 treeinfo (434 leaves, 371 internal nodes),
  read with event types and species labels. Alignment: PANTHER familymsa for PTHR12560, leaf
  rows only; it is an HMM-style alignment and only match-state columns were used for residue
  statements. Residue numbers are given in each protein's own UniProt canonical numbering,
  with human CERS6 (Q6ZMG9) and S. cerevisiae LAC1 (P28496) as the reference rows; both rows
  were checked to equal the UniProt canonical sequence. Everything is regenerated by
  tree_msa_check.py into PTHR12560-tree-msa-check.txt; the raw tree, alignment and UniProt
  payloads stay in the git-ignored .cache. Five reviewed members in the entries table are not
  tree leaves (the S. cerevisiae YJM789 strain copies of LAG1 and LAC1, Alternaria ALT7, and
  the Fusarium fumonisin-cluster proteins FUM17 and FUM18), so nothing is asserted about their
  tree position. FUM18 complements the yeast lag1 lac1 null and FUM17 does so only partially
  with a second synthase (PMID:32546615). Two things in animals go beyond what the PAINT terms
  say and are not disputed here: the homeobox-like region present in most animal members other
  than CERS1, and the transcriptional role of the Drosophila schlank homeodomain
  (PMID:26950647, PMID:29386138). PAINT carries no term for either. Not verified: the reason
  PAINT placed the hyl-2 IKR; the function of the three unreviewed leaves with a substituted
  catalytic histidine; acyl-chain preferences of members outside the cited papers. Publications
  cited without a quotation were verified against PubMed by identifier and title in this
  session but are not in the local publications cache, so no quote from them is asserted.
