    id: UniProtKB:Q6ZMG9
    label: CERS6
    organism: Homo sapiens
  anchor_sequence_version: 1
  site_source: UNIPROT_FEATURE
  residues:
  - position: 211
    expected: [H]
    role: nucleophile; forms the covalent acyl-enzyme intermediate
  - position: 212
    expected: [H]
    role: second histidine of the pair; mutation abolishes activity
  required_for:
  - term:
      id: GO:0050291
      label: sphingosine N-acyltransferase activity
    strength: CONTRIBUTES
    rationale: >-
      Mutating either histidine abolishes activity in human CERS6 and in yeast LAC1, mutating
      H183 abolishes it in human CERS1, and changing the pair to Gln-Tyr abolishes it in C.
      elegans hyl-2. Mechanistically the dependency is absolute, but the strength is held at
      CONTRIBUTES because the family supplies no verified natural negative control: no member
      that lacks the pair has been assayed, so the site must not be used on its own to
      contradict a gene review.
