residue_sites:
- site_id: lag1p_his_pair
  label: Catalytic His-His pair of the Lag1p motif
  description: >-
    Two consecutive histidines in the Lag1p motif inside the TLC domain. In human CERS6 the
    first (H211) is the nucleophile that carries the acyl chain in the covalent acyl-enzyme
    intermediate, and H211A/N and H212A each abolish activity; the equivalent H255A and H256A
    abolish activity of S. cerevisiae LAC1. Both positions are match columns of the PANTHER
    family alignment (columns 1418 and 1419) and are H in 425 and 427 of 434 leaves. Positions
    are human CERS6 (Q6ZMG9, sequence version 1) numbering; the alignment row for Q6ZMG9
    equals the UniProt canonical sequence.
