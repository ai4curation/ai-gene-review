  name:
    name: Fungal fatty acid synthase
    short: Fungal_FAS
  description:
  - text: The fungal fatty acid synthase (FAS) family is responsible for the biosynthesis
      of long-chain fatty acids, which are essential components of cell membranes
      and precursors for various bioactive compounds. These enzymes catalyze the formation
      of fatty acids from acetyl-CoA, malonyl-CoA, and NADPH. The FAS complex is typically
      composed of two subunits, alpha and beta, each containing multiple catalytic
      domains that work in concert to extend the fatty acid chain. In fungi, these
      enzymes are also involved in the production of secondary metabolites, such as
      mycotoxins and bioactive lipopeptides, by providing starter units or precursors
      for non-ribosomal peptide synthetases and polyketide synthases. The FAS family
      plays a crucial role in fungal metabolism and pathogenicity, as some of the
      secondary metabolites synthesized are virulence factors or have pharmacological
      significance.
