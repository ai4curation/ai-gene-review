  name:
    name: 'TonB-dependent Outer Membrane Receptor

      '
    short: 'TonB_OMR

      '
  description:
  - text: This protein family comprises TonB‐dependent receptors embedded in the bacterial
      outer membrane that mediate energy‐driven uptake of nutrients and various extracellular
      molecules, [cite:PUB00166092]. This family is involved in environmental adaptation,
      with members contributing to substrate import under conditions such as nutrient
      limitation and in planta infection, . The receptors exhibit regulatory diversity,
      with some being constitutively expressed and others controlled at both transcriptional
      and post‐transcriptional levels, thereby affecting bacterial sensitivity to
      antibiotics and envelope stress .
