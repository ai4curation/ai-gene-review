family_id: PANTHER:PTHR11309
family_name: FRIZZLED
preferred_name: Frizzled/Smoothened class-F receptor family, including the secreted Frizzled-related proteins
summary: >-
  PTHR11309 groups the class-F (Frizzled) seven-transmembrane receptors together with two
  sets of relatives that no longer do what the family name implies. The core of the family
  is the Frizzled Wnt receptors, which bind lipidated Wnt ligands through an extracellular
  cysteine-rich domain and signal through Dishevelled into the canonical beta-catenin
  branch and the beta-catenin-independent branches. Smoothened sits inside the same family
  by sequence and fold but is not a Wnt receptor at all: it is the obligate transducer of
  Hedgehog signaling, activated by sterols occupying its cysteine-rich domain and an
  intramolecular channel through its transmembrane core, and it engages Patched rather than
  Wnt. The secreted Frizzled-related proteins retain only the cysteine-rich domain, have no
  transmembrane segment, and act extracellularly as ligand-binding modulators rather than
  as receptors. The family is therefore a textbook case of one ancestral receptor role kept
  by one branch and abandoned by two others, and PANTHER's own PAINT annotations record the
  abandonment explicitly as inferred losses rather than leaving it to be discovered
  downstream.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Three functionally distinct groups. (1) The Frizzled receptors (PTHR11309:SF81,
  PTHR11309:SF34, PTHR11309:SF22, PTHR11309:SF23, PTHR11309:SF136, PTHR11309:SF75,
  PTHR11309:SF31, PTHR11309:SF90, PTHR11309:SF79, PTHR11309:SF86 and the Drosophila
  subfamilies PTHR11309:SF47 and PTHR11309:SF126) are Wnt receptors at the plasma membrane.
  (2) Smoothened (PTHR11309:SF35) transduces Hedgehog signaling and carries PAINT-recorded
  losses (IRD) of Wnt receptor activity, Wnt-protein binding, canonical Wnt signaling and
  non-canonical Wnt signaling at node PTN000885245 -- it is inside the family but outside
  the family function. (3) The secreted Frizzled-related proteins (PTHR11309:SF87,
  PTHR11309:SF45, PTHR11309:SF7) are extracellular, lack the transmembrane core, and carry
  PAINT-recorded losses of plasma membrane and Wnt receptor activity at nodes PTN002259328
  and PTN000139511, while retaining Wnt binding. No specific molecular-function term is
  safe across all three groups.
