        gene_symbol: FZD5
        organism: Homo sapiens
      - id: UniProtKB:Q9H461
        gene_symbol: FZD8
        organism: Homo sapiens
      - id: FB:FBgn0016797
        organism: Drosophila melanogaster
    assessment: SOUND
    assessment_reason: >-
      Broad seeding across vertebrate Frizzleds and Drosophila fz2 supports an ancestral
      canonical-branch role. As with the other root assertions, the descent is corrected at
      the Smoothened node, where canonical Wnt signaling is recorded as lost.
    paint_snapshot: '20260828'
  - node_id: PANTHER:PTN000139394
    asserted_term:
      id: GO:0035567
      label: non-canonical Wnt signaling pathway
    seeds:
      - id: UniProtKB:O60353
        gene_symbol: FZD6
        organism: Homo sapiens
      - id: UniProtKB:Q9NPG1
        gene_symbol: FZD3
        organism: Homo sapiens
      - id: FB:FBgn0016797
        organism: Drosophila melanogaster
    assessment: SOUND
    assessment_reason: >-
      The beta-catenin-independent branches are seeded by the Frizzleds most associated with
      planar cell polarity, and the term is struck out at the Smoothened node. Note that
      this is a pathway term rather than an activity term, so it descends to Frizzleds whose
      individual branch preference differs; that is a property of the term, not a fault in
      the node placement.
    paint_snapshot: '20260828'
  - node_id: PANTHER:PTN000139394
    asserted_term:
      id: GO:0005886
      label: plasma membrane
    seeds:
      - id: UniProtKB:Q99835
        gene_symbol: SMO
        organism: Homo sapiens
        gene_review: genes/human/SMO/SMO-ai-review.yaml
      - id: UniProtKB:Q9UP38
        gene_symbol: FZD1
        organism: Homo sapiens
      - id: FB:FBgn0003444
        gene_symbol: smo
        organism: Drosophila melanogaster
    assessment: SOUND
    assessment_reason: >-
      The seven-transmembrane members, Smoothened included, are plasma-membrane proteins,
      and Smoothened itself is among the seeds. The location is struck out at both secreted
