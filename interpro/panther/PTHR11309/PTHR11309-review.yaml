  - subfamily_id: PANTHER:PTHR11309:SF7
    clade_node_id: PANTHER:PTN000139511
    label: SECRETED FRIZZLED-RELATED PROTEIN 4
    description: >-
      A separate secreted Frizzled-related clade with its own PAINT node, placed at
      Deuterostomia rather than at the node carrying sFRP1 and sFRP2.
    representative_members:
      - id: UniProtKB:Q6FHJ7
        gene_symbol: SFRP4
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      Secreted, with plasma membrane and Wnt receptor activity recorded as lost at
      PTN000139511. Wnt-protein binding is retained: this subfamily's human member is one of
      the IBD seeds for Wnt-protein binding at the family root node, so losing the receptor
      role did not cost it the ligand-binding role.
  - subfamily_id: PANTHER:PTHR11309:SF81
