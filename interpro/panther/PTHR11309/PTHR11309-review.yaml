        organism: Mus musculus
      - id: ZFIN:ZDB-GENE-980526-89
        gene_symbol: smo
        organism: Danio rerio
    assessment: SOUND
    assessment_reason: >-
      Positional patterning is the shared developmental output of Hedgehog signaling in both
      flies and vertebrates, and the term is broad enough that the Eumetazoa placement does
      not over-commit.
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: '20231108'
  - node_id: PANTHER:PTN000885245
    asserted_term:
      id: GO:0005929
      label: cilium
    seeds:
      - id: UniProtKB:Q99835
        gene_symbol: SMO
        organism: Homo sapiens
        gene_review: genes/human/SMO/SMO-ai-review.yaml
      - id: FB:FBgn0003444
        gene_symbol: smo
        organism: Drosophila melanogaster
      - id: MGI:MGI:108075
        gene_symbol: Smo
        organism: Mus musculus
      - id: ZFIN:ZDB-GENE-980526-89
        gene_symbol: smo
        organism: Danio rerio
    assessment: UNRESOLVED
    assessment_reason: >-
      Ciliary localization of Smoothened is firmly established in vertebrates, but Hedgehog
      signal transduction in Drosophila runs on a cytoplasmic complex nucleated by Costal-2
      and does not require a cilium, so an assertion descending from Eumetazoa is at least
      worth questioning. The Drosophila gene is nonetheless one of the seeds for this row,
      which means a curator saw an experimental ciliary annotation for fly smo that cannot
      be inspected from the cached slice. The disagreement is between what the pathway
      literature says about compartment and what the seed list implies, and it needs the
      underlying fly annotation to settle. Flagged rather than pruned.
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: '20260528'
  - node_id: PANTHER:PTN000885245
    asserted_term:
      id: GO:0071679
      label: commissural neuron axon guidance
    seeds:
      - id: RGD:3726
        gene_symbol: Smo
        organism: Rattus norvegicus
      - id: ZFIN:ZDB-GENE-980526-89
        gene_symbol: smo
        organism: Danio rerio
    assessment: TOO_DEEP
    assessment_reason: >-
      Both seeds are vertebrates, and the process itself presupposes a centralized nervous
      system with a midline that axons cross. Placing it at Eumetazoa propagates a
      vertebrate neuroanatomical process to cnidarian and protostome descendants of this
      node, including Drosophila Smoothened, where no commissural guidance role of this kind
      is described. A vertebrate-scoped node would carry the same evidence without the
      over-reach; the sibling node PTN002601731 shows that such a node already exists for
      this clade. No subfamilies are named as affected because the Smoothened subfamily
      PTHR11309:SF35 itself spans both vertebrates and invertebrates, so the over-propagation
      is within a subfamily rather than across subfamilies.
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: '20200807'
  - node_id: PANTHER:PTN000885245
    asserted_term:
      id: GO:0030425
      label: dendrite
    seeds:
      - id: FB:FBgn0003444
        gene_symbol: smo
        organism: Drosophila melanogaster
      - id: RGD:3726
        gene_symbol: Smo
        organism: Rattus norvegicus
    assessment: UNRESOLVED
    assessment_reason: >-
      A neuron-compartment location asserted for every eumetazoan descendant of the node.
      The seeds do span a protostome and a deuterostome, which is better support than the
      commissural-guidance row has, but dendrites as a defined compartment are a property of
      differentiated neurons and the assertion descends to lineages where that
      correspondence is not established. Recorded as a question rather than a pruning, since
      neither seed annotation can be inspected offline.
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: '20200807'
  - node_id: PANTHER:PTN002601731
    asserted_term:
