node_assessments:
  - node_id: PANTHER:PTN000139394
    asserted_term:
      id: GO:0042813
      label: Wnt receptor activity
    seeds:
      - id: UniProtKB:Q9UP38
        gene_symbol: FZD1
        organism: Homo sapiens
      - id: UniProtKB:Q14332
        gene_symbol: FZD2
        organism: Homo sapiens
      - id: UniProtKB:O75084
        gene_symbol: FZD7
        organism: Homo sapiens
      - id: FB:FBgn0001085
        organism: Drosophila melanogaster
      - id: FB:FBgn0016797
        organism: Drosophila melanogaster
    assessment: SOUND
    assessment_reason: >-
      The seed set spans protostome and deuterostome Frizzleds, so placing Wnt receptor
      activity at the family root is well supported. The term would over-propagate to
      Smoothened and to the secreted Frizzled-related clades, but PAINT already prevents
      that: the same slice records explicit IRD losses of this term at PTN000885245
      (Smoothened), PTN002259328 (sFRP1/sFRP2) and PTN000139511 (sFRP4). The root placement
      is therefore sound as long as those losses travel with it, which is why this family
      must never be read from the root node alone.
    paint_snapshot: '20241120'
  - node_id: PANTHER:PTN000139394
    asserted_term:
      id: GO:0017147
      label: Wnt-protein binding
    seeds:
      - id: UniProtKB:Q9UP38
        gene_symbol: FZD1
        organism: Homo sapiens
      - id: UniProtKB:Q6FHJ7
        gene_symbol: SFRP4
        organism: Homo sapiens
      - id: UniProtKB:Q8N474
        gene_symbol: SFRP1
        organism: Homo sapiens
      - id: FB:FBgn0027342
        organism: Drosophila melanogaster
    assessment: SOUND
    assessment_reason: >-
      Ligand binding is the more broadly retained property. Its seeds include both
      membrane-bound Frizzleds and secreted Frizzled-related proteins, which is consistent
      with the cysteine-rich domain being the shared Wnt-binding module of the family.
      PAINT strikes this term out only at the Smoothened node, matching the structural
      evidence that Smoothened binds sterols rather than Wnt.
    paint_snapshot: '20260828'
  - node_id: PANTHER:PTN000139394
    asserted_term:
