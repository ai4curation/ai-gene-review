      - id: ZFIN:ZDB-GENE-980526-89
        gene_symbol: smo
        organism: Danio rerio
    assessment: SOUND
    assessment_reason: >-
      A vertebrate-scoped node for a vertebrate-scoped claim, seeded by three vertebrate
      Smoothened genes. This is the placement that the commissural-guidance row at the
      deeper Eumetazoa node should have used.
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: '20260210'
  - node_id: PANTHER:PTN002601720
    asserted_term:
      id: GO:0061299
      label: retina vasculature morphogenesis in camera-type eye
    seeds:
      - id: UniProtKB:Q9ULV1
        gene_symbol: FZD4
        organism: Homo sapiens
      - id: MGI:MGI:108520
        gene_symbol: Fzd4
        organism: Mus musculus
    assessment: SOUND
    assessment_reason: >-
      Frizzled-4 is the high-affinity receptor for Norrin, and loss of either partner causes
      the same failure of retinal vascularization in humans and mice. The term names a
      camera-type eye and the node is placed at Euteleostomi, so scope and biology agree.
      This is also the family's clearest case of a Frizzled acquiring a ligand unrelated to
      Wnt.
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: '20180323'
  - node_id: PANTHER:PTN000139511
    asserted_term:
      id: GO:0005576
      label: extracellular region
    seeds:
      - id: UniProtKB:Q6FHJ7
        gene_symbol: SFRP4
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      The sFRP4 clade has no transmembrane core, so an extracellular location is the
      expected assertion, and it is recorded together with the losses of plasma membrane and
      Wnt receptor activity at the same node.
    node_taxon:
      id: NCBITaxon:33511
      label: Deuterostomia
    paint_snapshot: '20260828'
  - node_id: PANTHER:PTN000139511
    asserted_term:
      id: GO:0005737
      label: cytoplasm
    seeds:
      - id: UniProtKB:Q6FHJ7
        gene_symbol: SFRP4
        organism: Homo sapiens
    assessment: UNRESOLVED
    assessment_reason: >-
      A cytoplasmic location for a secreted protein, asserted at the same node that records
      the extracellular location and the loss of the plasma membrane. The combination is not
      impossible, since a secreted protein transits the cytoplasm and sFRPs have reported
      intracellular pools, but it is the shape of annotation that is usually an artifact of
      overexpression. One seed, and the underlying experimental annotation cannot be read
      from the cached slice, so it is flagged rather than pruned.
    node_taxon:
      id: NCBITaxon:33511
      label: Deuterostomia
    paint_snapshot: '20230602'
  - node_id: PANTHER:PTN002259328
    asserted_term:
      id: GO:0005576
      label: extracellular region
    seeds:
      - id: UniProtKB:Q8N474
        gene_symbol: SFRP1
        organism: Homo sapiens
      - id: UniProtKB:Q96HF1
        gene_symbol: SFRP2
        organism: Homo sapiens
      - id: MGI:MGI:108078
        organism: Mus musculus
    assessment: UNRESOLVED
    assessment_reason: >-
      The assertion itself is uncontroversial for secreted Frizzled-related proteins, and
      the accompanying losses of plasma membrane and Wnt receptor activity are the right
      calls for a clade without a transmembrane core. What is unresolved is the depth: every
      seed is a mammal, yet the node is placed at Eumetazoa, so the assertion and its two
      losses descend to any non-mammalian sequence assigned below that node. Whether those
      sequences are genuine secreted relatives or membrane-bound receptors wrongly placed
      cannot be checked from the cached slice, which lists seeds but not node membership.
      Resolving it needs the family tree, not more literature.
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: '20260528'
