        gene_symbol: Smo
        organism: Mus musculus
      - id: ZFIN:ZDB-GENE-980526-89
        gene_symbol: smo
        organism: Danio rerio
    assessment: SOUND
    assessment_reason: >-
      The defining assertion of the Smoothened branch, seeded by experimentally
      characterized fly, mouse, zebrafish and human genes. A protostome and several
      deuterostome seeds support placement at least at Bilateria, and the recorded
      Eumetazoa placement is consistent with Hedgehog pathway components being present in
      cnidarians. This is the node the pan-metazoan Hedgehog module
      (modules/hedgehog_signaling.yaml) relies on for its Smoothened tier.
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: '20260528'
  - node_id: PANTHER:PTN000885245
    asserted_term:
      id: GO:0005113
      label: patched binding
    seeds:
      - id: UniProtKB:Q99835
        gene_symbol: SMO
        organism: Homo sapiens
        gene_review: genes/human/SMO/SMO-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      A single seed, which is not a weakness: the human protein is the best-characterized
      member of the subfamily, and the interaction it records is the one that defines the
      branch. The companion loss rows at this node make the same point from the other
      direction, since Wnt-protein binding is struck out where patched binding is asserted.
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: '20170228'
  - node_id: PANTHER:PTN000885245
