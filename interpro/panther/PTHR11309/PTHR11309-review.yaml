review_status: NEEDS_REVIEW
reviewed_by: claude-code
review_date: '2026-09-23'
notes: >-
  Reference protein. Human Smoothened is used as the family anchor rather than a Frizzled,
  because it is the structurally best-characterized member and the only member with a
  curated gene review in this repository. That choice is about anchoring residue numbering,
  not about which branch represents the family; the family's namesake function belongs to
  the Frizzled receptors, and the preferred_name records that.

  What this review does not assert. No residue_sites are recorded. Residue claims are
  validated against UniProt sequences, the local sequence cache is empty, and UniProt is
  unreachable from this environment, so any residue-level claim here would be unverifiable
  at the moment it was written. The obvious candidate sites, the cysteine-rich-domain
  cysteine pattern and the sterol-contacting positions of Smoothened, should be added by a
  session that can fetch sequences.

  Node coverage. The cached slice holds 24 PAINT rows across 6 nodes. Sixteen assertions are
  assessed here; the eight not given their own entry are the IRD loss rows, which are not
  IBD assertions and are instead discussed in the assessments of the root-node terms they
  prune.

  Taxon labels. The PTN node taxa are expanded from the bare taxon ids in the PAINT
  slice so that they can be checked, as the schema intends. NCBITaxon validation routes
  through OLS, which is unreachable from this environment, so the expansions were not
  machine-verified here. NCBITaxon:117571 (Euteleostomi) and NCBITaxon:6072 (Eumetazoa)
  are corroborated by other curated files in this repository; NCBITaxon:33511
  (Deuterostomia) is not, and should be confirmed by the first reviewer with ontology
  access.

  Seed identities. PAINT seeds given as model-organism identifiers carry a gene symbol
  only where the node context fixes which gene it must be, such as the Smoothened node,
  whose seeds can only be the smo orthologues. The family-root seeds are left as bare
  identifiers with an organism, because that family contains several Drosophila Frizzled
  paralogues and the cached artifacts do not say which accession is which.

  Naming hazard. PANTHER gives PTHR11309:SF34 and PTHR11309:SF126 the same official name,
  FRIZZLED-2. They are different clades, vertebrate FZD2 and Drosophila fz2 respectively.
  Both names are copied verbatim as PANTHER publishes them; do not "fix" either one.

  Two open questions are recorded as UNRESOLVED node assessments rather than settled:
  whether ciliary localization of Smoothened is properly asserted at Eumetazoa given that
  Drosophila Hedgehog signaling is cilium-independent, and whether the sFRP1/sFRP2 node is
  correctly placed at Eumetazoa when all its seeds are mammals. Both need data that is not
  in the cached slice: the fly ciliary annotation in the first case, node membership in the
  second.
