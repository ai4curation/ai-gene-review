subfamilies:
  - subfamily_id: PANTHER:PTHR11309:SF35
    clade_node_id: PANTHER:PTN000885245
    label: PROTEIN SMOOTHENED
    description: >-
      Smoothened, the Hedgehog pathway transducer. Retains the class-F seven-transmembrane
      fold and the cysteine-rich domain, but binds sterols rather than Wnt and signals
      through Patched relief rather than through a Wnt co-receptor. One gene in Drosophila
      and one in most vertebrates; the subfamily spans both.
    representative_members:
      - id: UniProtKB:Q99835
        gene_symbol: SMO
        organism: Homo sapiens
        gene_review: genes/human/SMO/SMO-ai-review.yaml
      - id: UniProtKB:P91682
        gene_symbol: smo
        organism: Drosophila melanogaster
      - id: UniProtKB:P56726
        gene_symbol: Smo
        organism: Mus musculus
      - id: UniProtKB:Q5RH73
        gene_symbol: smo
        organism: Danio rerio
    diverged_from_family: true
    divergence_description: >-
      Smoothened does not bind Wnt and is not a Wnt receptor. PAINT records the loss of
      Wnt receptor activity, Wnt-protein binding, canonical Wnt signaling and non-canonical
      Wnt signaling at the Smoothened node, and asserts instead patched binding, smoothened
      signaling pathway, cilium and pattern specification. Its activating ligand is a
      sterol occupying a channel through the receptor core, not a lipidated Wnt engaging
      the cysteine-rich domain.
  - subfamily_id: PANTHER:PTHR11309:SF87
    clade_node_id: PANTHER:PTN002259328
    label: SECRETED FRIZZLED-RELATED PROTEIN 1
    description: >-
      Secreted protein retaining the Frizzled cysteine-rich domain without the
      transmembrane core. Binds Wnt extracellularly and modulates signaling rather than
      transducing it.
    representative_members:
      - id: UniProtKB:Q8N474
        gene_symbol: SFRP1
        organism: Homo sapiens
      - id: UniProtKB:O19116
        gene_symbol: SFRP1
        organism: Bos taurus
    diverged_from_family: true
    divergence_description: >-
      No transmembrane domain and no receptor activity: PAINT records the loss of plasma
      membrane and Wnt receptor activity at PTN002259328 while asserting extracellular
      region. sFRP1 and sFRP2 are documented as negative regulators of Wnt signaling and
      also antagonize BMP signaling in the caudal neural tube.
  - subfamily_id: PANTHER:PTHR11309:SF45
    clade_node_id: PANTHER:PTN002259328
    label: SECRETED FRIZZLED-RELATED PROTEIN 2
    description: Secreted cysteine-rich-domain protein, paralogous to sFRP1 and sharing its node.
    representative_members:
