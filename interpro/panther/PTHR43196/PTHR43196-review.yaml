family_id: PANTHER:PTHR43196
family_name: SULFATE ADENYLYLTRANSFERASE SUBUNIT 2
preferred_name: CysD-type ATP sulfurylase small (adenylyltransferase) subunits and archaeal/phage PAPS-reductase-fold
  relatives
summary: >-
  CysD is the small, catalytic subunit of the GTP-coupled heterodimeric ATP sulfurylase of
  proteobacteria and actinobacteria. It belongs to the adenine-nucleotide alpha-hydrolase
  (PAPS-reductase-like) fold and adenylates sulfate to adenosine 5'-phosphosulfate (APS)
  together with the CysN translational-GTPase-like regulatory subunit, which couples GTP
  hydrolysis to APS formation. Subfamily SF1 (221 of the 224 reviewed members) is the CysD
  clade proper, including E. coli and Salmonella CysD, Pseudomonas, Mycobacterium,
  Xanthomonas, Vibrio and many other CysD proteins, and the rhizobial NodP proteins that
  provide activated sulfate for Nod-factor sulfation. Subfamily SF2 holds three uncharacterized
  proteins with a C-terminal PAPS-reductase domain: two from the methanogenic archaeon
  Methanocaldococcus jannaschii (MJ0973, MJ0066) and one from Escherichia phage 186 (CP84).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members are CysD/NodP sulfate-adenylyltransferase subunits of the
  CysD-CysN complex, and SF1 is coherent for that function. SF2 is a small, uncharacterized
  group whose members are not ATP sulfurylase subunits on any direct evidence: UniProt names
  them only as uncharacterized proteins with a PAPS-reductase-family C-terminal section, the
  archaeal genome has no CysN partner, and its sulfite-reduction step uses a coenzyme
  F420-dependent enzyme rather than an assimilatory APS pathway. The family is therefore
  coherent except for this divergent subfamily.
