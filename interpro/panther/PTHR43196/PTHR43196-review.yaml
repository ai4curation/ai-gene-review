- assessed_term:
    id: GO:0000103
    label: sulfate assimilation
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    SF1 CysD proteins catalyse the activation step of assimilatory sulfate reduction. NodP
    paralogs in rhizobia supply APS/PAPS for Nod-factor sulfation rather than assimilation;
    because they share SF1 with CysD, the term is safe at the subfamily level only for CysD
    orthologues. Not supported for SF2.
  applicable_subfamilies:
  - id: PANTHER:PTHR43196:SF1
    label: SULFATE ADENYLYLTRANSFERASE SUBUNIT 2
  supported_by:
  - reference_id: PMID:16387658
    supporting_text: Proteobacterial ATPS overcomes this energetically unfavorable reaction
      by associating with a regulatory G protein, coupling the energy of GTP hydrolysis to APS
      formation.
