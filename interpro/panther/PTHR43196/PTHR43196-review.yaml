- subfamily_id: PANTHER:PTHR43196:SF2
  label: PHOSPHOADENOSINE PHOSPHOSULFATE REDUCTASE
  description: >-
    Three uncharacterized proteins whose C-terminal section belongs to the PAPS reductase
    family: M. jannaschii MJ0973 (Q58383) and MJ0066 (Q60377, which also has a PUA domain)
    and phage 186 CP84 (P41062). No activity has been measured for any of them.
  representative_members:
  - id: UniProtKB:Q58383
    label: Uncharacterized protein MJ0973
    organism: Methanocaldococcus jannaschii
  - id: UniProtKB:Q60377
    label: Uncharacterized protein MJ0066
    organism: Methanocaldococcus jannaschii
  - id: UniProtKB:P41062
    label: Uncharacterized 37.8 kDa protein in gpa 5'region
    organism: Escherichia phage 186
  diverged_from_family: true
  divergence_description: >-
    Not CysD ATP sulfurylase subunits on current evidence. The archaeal host lacks a CysN
    GTPase partner and reduces sulfite with an F420-dependent enzyme (UniProt Q58280, Fsr,
    MJ0870; UniProt REST query of taxon 243232, 2026-11-03); the subfamily's official PANTHER
    name points to the PAPS-reductase fold rather than to sulfate adenylation. Their actual
    activity is unknown.
node_assessments:
- node_id: PANTHER:PTN001249481
  asserted_term:
    id: GO:0004781
    label: sulfate adenylyltransferase (ATP) activity
  evidence: IBD
  paint_snapshot: '20241203'
  seeds:
  - id: UniProtKB:P21156
    label: cysD
    organism: Escherichia coli K-12
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Sound for SF1, whose characterized members are the CysD subunits of the CysD-CysN ATP
    sulfurylase; the E. coli seed is supported by purification of the two-subunit enzyme and
    by GTP-coupled APS synthesis. But the node also passes the term to SF2: QuickGO (checked
    2026-11-03) shows GO:0004781 IBA on M. jannaschii MJ0973 (Q58383) and MJ0066 (Q60377).
    These are uncharacterized PAPS-reductase-fold proteins of an archaeon with no CysN partner
    and an F420-dependent sulfite reductase, so sulfate adenylation is not supported for them.
    An IRD at the SF2 clade (or a GO:0004781 IBD placed below the SF1/SF2 split) would stop
    the transfer. The P. putida KT2440 representative Q88NA9 is in SF1 and correctly inherits
    the term.
