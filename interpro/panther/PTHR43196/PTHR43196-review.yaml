notes: >-
  Module: aps_dependent_assimilatory_sulfate_reduction (CysD catalytic subunit grounded at
  PTHR43196:SF1 with P21156 and Q88NA9, and PTN001249481 as the ancestral node). Counts are
  from a csv parse of PTHR43196-entries.csv (224 reviewed members: 221 SF1, 3 SF2). The SF2
  IBA inheritance of GO:0004781, GO:0009336, GO:0000103 and GO:0034599 by Q58383 and Q60377
  was checked in QuickGO on 2026-11-03; P41062 carried no IBA at that date. UniProt records
  for the SF2 proteins (PE 3, 'In the C-terminal section; belongs to the PAPS reductase
  family') and the M. jannaschii F420-dependent sulfite reductase Q58280 were checked by
  UniProt REST on 2026-11-03. NodP is retained in SF1 but its physiological role (Nod-factor
  sulfation) differs from assimilation.
