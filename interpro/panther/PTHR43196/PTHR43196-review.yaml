- node_id: PANTHER:PTN001249481
  asserted_term:
    id: GO:0034599
    label: cellular response to oxidative stress
  evidence: IBD
  paint_snapshot: '20241203'
  seeds:
  - id: UniProtKB:P9WIK1
    label: cysD
    organism: Mycobacterium tuberculosis H37Rv
  assessment: UNRESOLVED
  assessment_reason: >-
    Seeded only by M. tuberculosis CysD. Independent E. coli data are consistent with a
    physiological role: a cysD deletion is among the few single mutants with raised
    intracellular ROS (PMID:24580753), and the E. coli cysD review keeps the IBA as non-core.
    This is an indirect consequence of supplying reduced sulfur for cysteine and glutathione,
    not a CysD activity, and whether placement at the family root is appropriate for every
    SF1 lineage is not established. It is also inherited by the SF2 archaeal proteins
    (QuickGO, 2026-11-03), for which nothing supports it. Resolving the placement needs the
    M. tuberculosis seed experiment and data from additional SF1 lineages.
  affected_subfamilies:
