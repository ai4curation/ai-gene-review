  Atypical 2-Cys peroxiredoxins of the BCP/PrxQ class reduce hydroperoxides with an intramolecular
  disulfide recycled by thioredoxin (E. coli Bcp, S. cerevisiae nuclear DOT5, S. pombe bcp1).
