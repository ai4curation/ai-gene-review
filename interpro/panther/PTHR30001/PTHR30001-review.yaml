family_id: PANTHER:PTHR30001
family_name: RIBONUCLEASE
preferred_name: RNase E/G endoribonuclease family
summary: The RNase E/G family comprises the 5'-end-dependent, single-strand-specific endoribonucleases
  RNase E and RNase G of bacteria and their plastid homologues. All members share the conserved N-terminal
  catalytic region (RNase H-like, S1, 5'-sensor and DNase I subdomains, plus the Zn-link) that cleaves
  A/U-rich single-stranded RNA and processes rRNA precursors. Proteobacterial RNase E additionally carries
  a long, natively disordered C-terminal scaffold that binds the inner membrane, RNA and degradosome partners
  (RhlB, PNPase, enolase); RNase G lacks it.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The catalytic activity and rRNA-processing role are shared family-wide; the degradosome-scaffold
  function is restricted to RNase E proteins with the C-terminal scaffold, which PANTHER does not separate
  cleanly (SF1 holds gammaproteobacterial RNase E and a plastid homologue; SF0 holds RNase G together
  with actinobacterial and cyanobacterial RNase E).
