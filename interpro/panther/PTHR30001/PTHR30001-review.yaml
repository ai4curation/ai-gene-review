notes: 'Module bacterial_rna_degradation grounds its RNase E step to InterPro IPR028878 (Ribonuclease
  E) rather than to this family or a subfamily, because PANTHER does not isolate scaffold-bearing RNase
  E: SF1 mixes gammaproteobacterial RNase E with a plastid homologue, and SF0 mixes RNase G with actinobacterial
  and cyanobacterial RNase E. The scaffold-dependent molecular adaptor activity is therefore not assessed
  as a family or subfamily term.'
