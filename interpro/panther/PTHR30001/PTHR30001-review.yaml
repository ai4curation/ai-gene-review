- subfamily_id: PANTHER:PTHR30001:SF0
  label: RIBONUCLEASE G
  description: RNase G of enterobacteria and Haemophilus, plus RNase E/G of actinobacteria, cyanobacteria
    and red-algal plastids. E. coli RNase G is a catalytic-domain-only paralogue without the degradosome
    scaffold.
  representative_members:
