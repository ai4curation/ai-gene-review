notes: 'Scoped for the ADP-heptose precursor biosynthesis module, which grounds its isomerization step
  to PANTHER:PTHR30390:SF6 because that is the subfamily UniProt assigns to the module''s GmhA members.
  The SF6 label is PANTHER''s DiaA name and is not a function claim; SF7 is PANTHER''s own phosphoheptose
  isomerase subfamily and holds the canonical E. coli GmhA. No residue_sites are asserted: the GmhA active
  site is a SIS-domain pocket, and no per-residue claim is needed to support or refute any annotation
  in this module.'
