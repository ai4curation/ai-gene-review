    id: GO:0033785
    label: heptose 7-phosphate kinase activity
  scope: SUBFAMILY_ONLY
  scope_reason: Family membership here reflects the SIS isomerase domain, which is all that most members
    have. A subset of SF6, the actinobacterial tridomain NDP-heptose synthetases such as Streptomyces
    fimbriatus SepB (707 residues, against 184-197 for the single-domain isomerases), additionally carries
    HldE-like kinase and nucleotidyltransferase domains and performs this step as well; that is why the
    module lists SF6 under this reaction. The activity is therefore scoped to SF6's tridomain members,
    never to its single-domain GmhA isomerases, and it must be confirmed per member, because tridomain
    proteins with a deficient kinase domain are reported in this group.
  applicable_subfamilies:
  - id: PANTHER:PTHR30390:SF6
    label: DNAA INITIATOR-ASSOCIATING PROTEIN DIAA
