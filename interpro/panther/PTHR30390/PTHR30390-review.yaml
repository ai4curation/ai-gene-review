family_id: PANTHER:PTHR30390
family_name: SEDOHEPTULOSE 7-PHOSPHATE ISOMERASE / DNAA INITIATOR-ASSOCIATING FACTOR FOR REPLICATION INITIATION
preferred_name: SIS-domain GmhA phosphoheptose isomerase / DiaA replication-initiation factor family
summary: 'A bacterial SIS (sugar isomerase) domain family whose members form homotetramers but split between
  two unrelated jobs. GmhA members catalyse the first committed step of ADP-heptose synthesis, the isomerization
  of D-sedoheptulose 7-phosphate to D-glycero-beta-D-manno-heptose 7-phosphate. DiaA members have no established
  isomerase role and instead bind DnaA to stimulate replication initiation. The two activities sit on
  separate PAINT nodes, but PANTHER''s subfamily labels do not separate them cleanly: the subfamily whose
  official name is DiaA also carries genuine GmhA isomerases.'
functional_coherence: HETEROGENEOUS
coherence_reason: The family name itself declares two activities. PANTHER's own member inventory places
  the canonical Escherichia coli GmhA (P63224) in the PHOSPHOHEPTOSE ISOMERASE subfamily SF7 and E. coli
  DiaA (P66817) in SF6, but UniProt's PANTHER cross-reference assigns the Pseudomonas, Streptomyces and
  Methanococcus GmhA isomerases reviewed here to SF6, the DiaA-named subfamily. A subfamily label in this
  family is therefore not a function claim.
