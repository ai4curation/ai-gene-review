      mouse) inherit it by IBA, which the leaf PAINT GAF confirms. Notch receptors
      have axon-related phenotypes but are not guidance-cue components in the way
      the seeds are. The term belongs at PTN002911632 (Slit/LRR clade, Eumetazoa) or
      at the Slit-only clades; it should not descend into PTN001933897.
