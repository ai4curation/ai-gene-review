family_id: PANTHER:PTHR45836
family_name: SLIT HOMOLOG
preferred_name: Slit guidance ligands and Notch1-3 receptors (with other LRR proteins)
summary: >-
  In the PANTHER 19.0 tree this family is rooted at a Eumetazoa duplication
  (PTN002911625) that separates two unrelated functional groups sharing
  EGF-repeat-rich extracellular domains. One clade (PTN002911632) holds the Slit
  axon-guidance ligands -- vertebrate SLIT1, SLIT2 and SLIT3, Drosophila Slit and C.
  elegans SLT-1 -- secreted leucine-rich-repeat plus EGF-repeat proteins that bind
  Roundabout (Robo) receptors and act as repulsive midline cues, together with a
  few other LRR proteins captured by the model (Nogo receptors RTN4R/RTN4RL1, LGR4,
  LGR6/IGFALS and Drosophila Toll-6). The other clade (PTN001933897) holds Notch
  receptors: human and mouse NOTCH1, NOTCH2 and NOTCH3 and invertebrate Notch
  orthologs from sea urchin, amphioxus, tick, mosquito, Nematostella and
  Trichoplax. Notch receptors are single-pass transmembrane proteins whose
  EGF-repeat ectodomain binds DSL ligands; ligand-induced proteolysis releases the
  intracellular domain, which enters the nucleus and activates transcription with
  CSL and Mastermind. The family therefore joins a guidance-ligand clade and a
  signalling-receptor clade, and several major Notch receptors (Drosophila Notch,
  C. elegans LIN-12 and GLP-1, vertebrate NOTCH4, zebrafish notch1a) are
  classified in other PANTHER families.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The Slit clade (SF2 SLIT2, SF3 SLIT1, SF9 SLIT3, SF4 invertebrate Slit) consists
  of secreted Robo ligands for axon guidance and cell migration. The Notch clade
  (SF12, SF15, SF17, SF23 and SF13) consists of transmembrane Notch receptors. The
  Slit clade also contains LRR proteins with other functions: SF6/SF11 Nogo
  receptors (myelin-inhibitor receptors), SF10/SF19 LGR4/LGR6/IGFALS (R-spondin
  receptors and the IGF-binding acid-labile subunit) and SF8 Drosophila Toll-6 (a
  neurotrophin receptor). No specific molecular function or process is shared by
  all members; the family-root node carries only axon guidance, which the Notch
  receptors inherit wrongly.
