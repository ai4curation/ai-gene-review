    assessment: TOO_DEEP
    assessment_reason: >-
      PTN002911625 is the family root, a Eumetazoa duplication joining the Slit/LRR
      clade and the Notch receptor clade (PAINT row has no taxon). All seeds are Slit
      proteins or a Nogo receptor, i.e. members of the Slit/LRR clade PTN002911632.
