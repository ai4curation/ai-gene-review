notes: >-
  Where the key Notch receptors are classified in PANTHER 19.0 (sequence
  classification files, which follow the tree that PAINT annotates): human NOTCH1
  PTHR45836:SF12, NOTCH2 SF15, NOTCH3 SF17 (this family); human/mouse NOTCH4
  PTHR24044:SF489; C. elegans LIN-12 PTHR24044:SF505; Drosophila Notch (P07207)
  PTHR22804:SF57 (family AGGRECAN/VERSICAN PROTEOGLYCAN); C. elegans GLP-1 (P13508)
  PTHR24033:SF232 (family EGF-LIKE DOMAIN-CONTAINING PROTEIN); zebrafish notch1a
  (P46530) PTHR12916:SF9. InterPro/UniProt HMM-based DR PANTHER cross-references
  differ again (Drosophila N and LIN-12 in PTHR24049:SF22; NOTCH4, GLP-1 and
  notch1a in PTHR45836:SF23). Drosophila Notch and C. elegans GLP-1 receive no
  Notch-pathway IBA from any node. Because Notch receptors are fragmented across
  families, no PANTHER family or PTN node spans the bilaterian Notch receptors, and
  a module needing a cross-species receptor anchor should use PTN001933897 only
  for the NOTCH1-3/invertebrate clade it actually covers. Of the PAINT rows in
  this family's slice, PTN002371879 (PTHR24044) and PTN004393524 (PTHR12916) do not
  belong to the PTHR45836 tree; they are assessed here only to record that. The
  modules/notch_signaling.yaml description of PTN002371879 as a "PANTHER PAINT node
  in PTHR45836" is therefore inaccurate. Slit and other LRR members are included
  only to document the family's heterogeneity. Seed identifiers were resolved
  through UniProt cross-references and PANTHER classification files; subfamily
  membership of representative proteins was read from the PANTHER 19.0 human,
  mouse, fly, worm and zebrafish classification files.
