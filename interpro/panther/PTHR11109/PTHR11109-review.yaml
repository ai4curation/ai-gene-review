family_id: PANTHER:PTHR11109
family_name: GTP CYCLOHYDROLASE I
preferred_name: GTP cyclohydrolase I (FolE/FOL2/GCH1) family
summary: >-
  GTP cyclohydrolase I opens the imidazole ring of GTP to make 7,8-dihydroneopterin triphosphate,
  the first committed step of both folate synthesis (bacteria, fungi, plants) and tetrahydrobiopterin
  synthesis (animals). The family contains bacterial FolE, S. cerevisiae FOL2, S. pombe SPAC17A5.13
  (SF7) and animal GCH1 (SF11).
functional_coherence: COHERENT
coherence_reason: >-
  All members catalyse the same reaction. The downstream pathway (folate versus tetrahydrobiopterin)
  depends on lineage.
