    label: chemokine activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    No member of PANTHER:PTHR11412 is a chemokine or binds a chemokine receptor. Complement
    anaphylatoxins C3a and C5a are structurally and evolutionarily unrelated to chemokines
    and signal through anaphylatoxin receptors (C3aR1, C5aR1, C5aR2) rather than chemokine
    receptors.
  supported_by:
