subfamilies:
- subfamily_id: PANTHER:PTHR11412:SF83
  clade_node_id: PANTHER:PTN002605305
  label: COMPLEMENT C5
  description: >-
    Vertebrate complement component C5 orthologs. Cleaved by C5 convertases (or granzyme K)
    at Arg751-Leu752 into the 74-residue C5a anaphylatoxin—which binds and activates the
    seven-transmembrane receptors C5aR1 (CD88) and C5aR2 (C5L2) to initiate the complement
    component C5a signaling pathway (GO:0038178) and myeloid leukocyte chemotaxis—and the
    large C5b fragment, which binds C6, C7, C8, and C9 to assemble the cytolytic membrane
    attack complex (MAC). Unlike C3, C4, and A2M, C5 lacks the internal reactive thioester
    bond and does not inhibit endopeptidases.
  representative_members:
  - id: UniProtKB:P01031
    label: Complement C5
    gene_symbol: C5
    organism: Homo sapiens (Human)
    gene_review: human/C5
  - id: UniProtKB:P06684
    label: Complement C5
    gene_symbol: Hc
    organism: Mus musculus (Mouse)
  - id: UniProtKB:P08650
    label: Complement C5
    gene_symbol: C5
    organism: Rattus norvegicus (Rat)
  diverged_from_family: true
  divergence_description: >-
    Lost the ancestral internal beta-cysteinyl-gamma-glutamyl thioester motif and lacks
    the bait-region protease-trapping activity of alpha-2-macroglobulins; specialized as
    the precursor of the C5a anaphylatoxin (signaling via C5aR1/C5aR2, GO:0038178) and the
    C5b scaffold that nucleates the membrane attack complex (C5b-9).
  supported_by:
  - reference_id: PMID:22832194
    supporting_text: >-
      C5 lacks the prototypical thioester present in this domain in other members of the
      C3/α2-macroglobulin protein family.
  - reference_id: PMID:36806352
    supporting_text: >-
      The complement fragment C5a is one of its important effector components and exerts
      diverse physiological functions through activation of the C5a receptor 1 (C5aR1) and
      associated downstream G protein and β-arrestin signaling pathways.
  - reference_id: PMID:39914456
    supporting_text: >-
      The nascent C4b and C2b fragments form a C3 convertase that cleaves C3, enabling the
      assembly of a C5 convertase that cleaves C5. The resulting convertases generate all
      the effector molecules of the complement cascade: the anaphylatoxins C3a and C5a, the
      opsonins C4b and C3b, and the membrane attack complex.
- subfamily_id: PANTHER:PTHR11412:SF81
  clade_node_id: PANTHER:PTN002605320
  label: COMPLEMENT C3
  description: >-
    Vertebrate complement component C3 orthologs. Cleaved by C3 convertases into the C3a
    anaphylatoxin (agonist of C3aR1) and C3b, which exposes an internal reactive thioester
    to covalently opsonize target surfaces and assemble C3/C5 convertases. Does not
    possess endopeptidase inhibitor activity.
