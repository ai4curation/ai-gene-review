- subfamily_id: PANTHER:PTHR11412:SF165
  label: ALPHA-2-MACROGLOBULIN
  description: >-
    Tetrameric plasma alpha-2-macroglobulin (A2M) orthologs. Broad-spectrum endopeptidase
    inhibitors whose permissive bait region is cleaved by diverse proteases, triggering
    conformational collapse around an interior protease-trapping cavity and exposure of the
    LRP1 receptor-recognition site for clearance.
