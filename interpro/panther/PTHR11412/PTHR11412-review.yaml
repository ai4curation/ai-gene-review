family_id: PANTHER:PTHR11412
family_name: MACROGLOBULIN / COMPLEMENT
preferred_name: Alpha-2-macroglobulin and complement C3/C4/C5 superfamily
summary: >-
  Large secreted plasma and cell-surface glycoproteins sharing the conserved
  macroglobulin (MG1-MG8), CUB, and alpha-helical thioester-containing domain (TED)
  architecture (InterPro:IPR001599). Despite a common ancestral fold, the superfamily
  diverged into two functionally distinct major branches in metazoans: (1) broad-spectrum
  protease-trapping endopeptidase inhibitors—represented by alpha-2-macroglobulin (A2M),
  pregnancy zone protein (PZP), alpha-2-macroglobulin-like protein 1 (A2ML1),
  murinoglobulins, and ovostatins—in which protease cleavage of a permissive bait region
  triggers conformational collapse around the attacking peptidase; and (2) central
  complement cascade pro-proteins—complement C3, C4 (C4A/C4B), and C5—which lack
  protease-trapping activity and are instead cleaved at a specific convertase site to
  release a small N-terminal four-helix-bundle anaphylatoxin (C3a, C4a, or C5a;
  InterPro:IPR000020) and a large C-terminal fragment (C3b, C4b, or C5b) that drives
  opsonization, convertase assembly, or membrane attack complex (MAC, C5b-9) pore
  formation. Notably, C5 (PANTHER:PTHR11412:SF83) has lost the internal beta-cysteinyl-
  gamma-glutamyl thioester sequence retained by C3, C4, A2M, and GPI-anchored CD109,
  specializing instead for C5a anaphylatoxin GPCR signaling (via C5aR1 and C5aR2;
  GO:0038178) and C5b-nucleated MAC assembly.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  PANTHER:PTHR11412 combines functionally divergent paralogous lineages: protease-trapping
  inhibitors (A2M, PZP, A2ML1, ovostatin; GO:0004866 endopeptidase inhibitor activity),
  thioester-bearing complement opsonins/convertase subunits (C3, C4A/C4B), the thioester-
  lacking terminal complement component and C5a anaphylatoxin precursor C5 (GO:0038178
  complement component C5a signaling pathway and GO:0006957 complement activation,
  alternative/terminal pathway), and the GPI-anchored TGF-beta coreceptor CD109. PAINT node
  PTN000892454 over-propagates GO:0004866 (endopeptidase inhibitor activity) across Eumetazoa
  into the complement C3/C4/C5 clade, and PAINT node PTN008967461 mis-propagates GO:0008009
  (chemokine activity) onto C3 and C5 due to conflation of complement anaphylatoxins
  (InterPro:IPR000020) with cysteine-motif chemokines (InterPro:IPR001811).
