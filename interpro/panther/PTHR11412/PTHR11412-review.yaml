    PMID:37852260, updated 2025-04-22, including cryo-EM studies of C3aR and C5aR1 that
    explicitly describe C3a and C5a as complement anaphylatoxins) and a PINC TAS GO:0008009
    annotation on human C5 (P01031; PMID:10820279); both the PTN008967461 IBD and the
    underlying human C3 and C5 GO:0008009 rows should be removed or repointed to GO:0001664
