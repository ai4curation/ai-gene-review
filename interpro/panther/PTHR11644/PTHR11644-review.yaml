family_id: PANTHER:PTHR11644
family_name: CYTIDINE DEAMINASE
summary: Cytidine-deaminase-related proteins use a zinc-dependent deamination scaffold with divergent
  substrates. The grouping includes conventional nucleoside deaminases and blasticidin-S deaminases, as
  well as plant relatives whose catalytic competence is uncertain.
functional_coherence: HETEROGENEOUS
coherence_reason: The actual SF2 inventory contains Aspergillus blasticidin-S deaminase P0C2P0 alongside
  cytidine deaminases. Substrate/intermediate/product structures establish deamination of the antibiotic's
  cytosine moiety (PMID:17959604), demonstrating that the same broad family and SF2 label do not uniquely
  identify free-cytidine salvage. Plant CDA4/CDA9 inactive labels remain hypotheses unless their catalytic
  architecture is independently verified; they are not used as proof of exact-target loss. CG8353's cytidine-deaminase
  assignment supports a deamination hypothesis but does not license RNA editing, dCMP deamination or every
  antibiotic substrate.
