  - id: AGI_LocusCode:AT1G62180
    label: APR2
    organism: Arabidopsis thaliana
  - id: AGI_LocusCode:AT4G21990
    label: APR3
    organism: Arabidopsis thaliana
  assessment: SOUND
  assessment_reason: >-
    The seeds are the three Arabidopsis APRs, and the bacterial descendants (P. aeruginosa CysH
    and its relatives) are APS reductases too. The current GO:0009973 definition is
    acceptor-generic (QuickGO, 2026-11-03: 'Catalysis of the reaction: A + AMP + 2 H+ + sulfite
    = adenosine 5'-phosphosulfate + AH2'), so it holds for both glutathione-using plant enzymes
    and thioredoxin-using bacterial enzymes. The donor-specific children GO:0033741
    (glutathione) and GO:0043866 (thioredoxin) are the better per-member annotations, and the
    APR1 and P. aeruginosa cysH gene reviews refine the IBA to them.
  supported_by:
  - reference_id: PMID:9653199
    supporting_text: The purified recombinant enzyme (APR1p) can use GSH efficiently as a hydrogen
      donor in vitro
  - reference_id: PMID:10613872
    supporting_text: Purified P. aeruginosa CysH expressed as a His-tagged recombinant protein
      is able to reduce APS, but not PAPS.
