family_id: PANTHER:PTHR46482
family_name: 5'-ADENYLYLSULFATE REDUCTASE 3, CHLOROPLASTIC
preferred_name: Assimilatory APS reductases (plant APR and bacterial Fe-S CysH)
summary: >-
  Assimilatory adenosine 5'-phosphosulfate (APS) reductases, which reduce APS directly to
  sulfite and AMP, bypassing PAPS. The family joins two architectures. Plant APRs (Arabidopsis
  APR1-3, rice APR1) are plastid enzymes with an N-terminal transit peptide, a reductase domain
  and a C-terminal glutaredoxin-like (thioredoxin-fold) domain, and use glutathione as the
  electron donor. Bacterial APS reductases (Pseudomonas aeruginosa and P. putida CysH,
  rhizobial, Burkholderia, Neisseria and Allochromatium CysH) consist of the reductase domain
  only, carry the [4Fe-4S]-binding -CC-X~80-CXXC- cysteine motif, and use an external
  thioredoxin. Arabidopsis APR2 and APR3 have their own subfamilies (SF3, SF14); APR1, rice
  APR1 and all bacterial members share SF9.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member reduces APS to sulfite in sulfate assimilation, so the
  acceptor-generic activity and the pathway are coherent. The electron donor diverges with
  domain architecture: plant APRs use glutathione through their fused glutaredoxin-like domain,
  bacterial APRs use thioredoxin. Because plant APR1 and the bacterial enzymes share SF9, the
  donor-specific activities cannot be scoped by subfamily.
