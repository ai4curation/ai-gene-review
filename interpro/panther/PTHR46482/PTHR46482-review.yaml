  - id: AGI_LocusCode:AT4G21990
    label: APR3
    organism: Arabidopsis thaliana
  - id: UniProtKB:O05927
    label: cysH
    organism: Pseudomonas aeruginosa PAO1
  assessment: SOUND
  assessment_reason: >-
    Seeded by plant and bacterial members; APS reduction is the first reductive step of sulfate
    assimilation in both lineages, and the P. aeruginosa cysH knockout is a cysteine auxotroph.
    Sound for all descendants; the APR1 and P. aeruginosa cysH reviews accept the IBA.
  supported_by:
  - reference_id: PMID:10613872
    supporting_text: Insertional knockout mutation of P. aeruginosa cysH produced cysteine auxotrophy,
      indicating its role in sulfate assimilation.
