term_assessments:
- assessed_term:
    id: GO:0009973
    label: adenylyl-sulfate reductase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    All characterized members reduce APS to sulfite, and the definition does not specify the
    electron donor.
  supported_by:
  - reference_id: PMID:16008502
    supporting_text: APS reductases from higher plants (group a) possess a reductase domain and
      a unique C-terminal domain with high homology to thioredoxin.
- assessed_term:
    id: GO:0033741
    label: adenylyl-sulfate reductase (glutathione) activity
  scope: UNRESOLVED
  scope_reason: >-
    Holds for the plant APRs, which have the C-terminal glutaredoxin-like domain (APR1 in SF9,
    APR2 in SF3, APR3 in SF14), but not for the bacterial CysH members that share SF9 with
    APR1 and lack that domain. Applicability follows domain architecture, not subfamily; no
    residue site is formalised.
  supported_by:
  - reference_id: PMID:9653199
    supporting_text: The purified recombinant enzyme (APR1p) can use GSH efficiently as a hydrogen
      donor in vitro
  - reference_id: PMID:16008502
    supporting_text: Bacterial APS reductases (group b) lack this specialized domain, but share
      the cysteine motif -CC-X∼80-CXXC- present in the reductase domain.
- assessed_term:
    id: GO:0043866
    label: adenylyl-sulfate reductase (thioredoxin) activity
  scope: UNRESOLVED
  scope_reason: >-
    Holds for the single-domain bacterial CysH APS reductases (P. aeruginosa CysH uses
    thioredoxin; P. putida KT2440 CysH by orthology), which share SF9 with plant APR1. Not for
    the plant APRs, whose purified domains do not use thioredoxin. Domain architecture decides
    applicability.
  supported_by:
  - reference_id: PMID:10613872
    supporting_text: thioredoxin supplied as an electron donor.
  - reference_id: PMID:9653199
    supporting_text: DTT alone or in combination with thioredoxin or glutaredoxin did not promote
      APS reductase activity for either domain.
- assessed_term:
    id: GO:0000103
    label: sulfate assimilation
  scope: FAMILY_WIDE
  scope_reason: Both architectures catalyse the APS-to-sulfite step of assimilatory sulfate reduction.
  supported_by:
  - reference_id: PMID:10613872
    supporting_text: Insertional knockout mutation of P. aeruginosa cysH produced cysteine auxotrophy,
      indicating its role in sulfate assimilation.
