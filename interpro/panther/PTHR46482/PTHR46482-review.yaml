notes: >-
  Module: aps_dependent_assimilatory_sulfate_reduction (plant APR1 annoton grounded at SF9 with
  P92979; bacterial CysH annoton uses NCBIfam TIGR02055 with O05927 and Q88KG2, which are also
  SF9 members). Counts from a csv parse of PTHR46482-entries.csv: 16 reviewed members, 14 SF9,
  one each in SF3 (APR2) and SF14 (APR3). The family's official PANTHER name refers to APR3
  although APR3 sits in SF14. The PTHR46509 review records that the PAINT tree used for that
  family's paint file also placed Arabidopsis APR1-3 there, whereas their UniProt PANTHER
  cross-reference is PTHR46482; the PTN008207357 node appears in both paint files. GO
  definitions of GO:0009973, GO:0033741 and GO:0043866 were checked in QuickGO on 2026-11-03.
