node_assessments:
- node_id: PANTHER:PTN008207357
  asserted_term:
    id: GO:0009973
    label: adenylyl-sulfate reductase activity
  evidence: IBD
  paint_snapshot: '20250911'
  seeds:
  - id: AGI_LocusCode:AT4G04610
