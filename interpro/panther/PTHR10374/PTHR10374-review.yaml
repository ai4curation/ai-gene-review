family_id: PANTHER:PTHR10374
family_name: LACTOYLGLUTATHIONE LYASE  GLYOXALASE I
preferred_name: Glyoxalase I (lactoylglutathione lyase) family
summary: >-
  Glyoxalase I isomerizes the hemithioacetal of methylglyoxal and glutathione to S-D-lactoylglutathione,
  the first step of glyoxalase-dependent methylglyoxal detoxification. The family contains the metal-dependent
  glyoxalase I enzymes of bacteria, fungi (S. cerevisiae GLO1, S. pombe glo1), plants and animals
  (GLO1).
functional_coherence: COHERENT
coherence_reason: All reviewed members, which fall in the single subfamily SF30, are glyoxalase I
  enzymes.
