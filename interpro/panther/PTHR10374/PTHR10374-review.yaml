family_id: PANTHER:PTHR10374
family_name: LACTOYLGLUTATHIONE LYASE  GLYOXALASE I
preferred_name: Zn2+-activated glyoxalase I (lactoylglutathione lyase) family
summary: >-
  Glyoxalase I (lactoylglutathione lyase, EC 4.4.1.5) enzymes of the vicinal oxygen chelate (VOC) fold that
  isomerise the hemithioacetal formed spontaneously from methylglyoxal and glutathione to (R)-S-lactoylglutathione,
  the first step of glutathione-dependent methylglyoxal detoxification. Characterised members are the
  Zn2+-activated glyoxalase I enzymes: human GLO1 (a domain-swapped homodimer with the zinc sites at the dimer
  interface), S. cerevisiae GLO1 (a single chain carrying two active sites), the monomeric S. pombe glo1, and the
  Zn2+-dependent bacterial outlier P. aeruginosa GloA3. P. putida GloA belongs here as well. The Ni2+/Co2+-activated
  glyoxalase I enzymes typical of bacteria (E. coli GloA) and of some plants are a separate PANTHER family,
  PTHR46036.
functional_coherence: COHERENT
coherence_reason: >-
  Every reviewed member falls in subfamily SF30 and is a glyoxalase I with direct (human, budding yeast, fission
  yeast, P. aeruginosa GloA3) or strong inferred evidence. The only other subfamily, SF19 (fungal
  "LYASE (GLO1), PUTATIVE"-related proteins), has no reviewed or characterised member, so no exception is known.
  Metal preference is not uniform across glyoxalase I enzymes in general, but the characterised members of this
  family are Zn2+-activated.
