term_assessments:
- assessed_term:
    id: GO:0004462
    label: lactoylglutathione lyase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Directly demonstrated for budding-yeast, fission-yeast, human and P. aeruginosa members of SF30, which holds
    every reviewed member; the gene reviews of all six representatives accept it as core. SF19 has no
    characterised member and no evidence against the activity.
  supported_by:
  - reference_id: PMID:11050082
    supporting_text: Steady-state kinetics and metal analyses of the recombinant enzymes corroborate that yeast
      glyoxalase I has two functional active sites
  - reference_id: PMID:15042280
    supporting_text: The glyoxalase I of S. pombe was a monomeric enzyme with a molecular weight of 34000
  - reference_id: PMID:17513180
    supporting_text: We have identified two genes in Pseudomonas aeruginosa PAO1 encoding glyoxalase I enzymes in
      addition to the gloA1 sequence recently reported and characterized.
- assessed_term:
    id: GO:0051596
    label: methylglyoxal catabolic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Glyoxalase I itself performs the first step of this process; loss of the S. pombe enzyme sensitises cells to
    methylglyoxal, and the S. pombe gene restores methylglyoxal tolerance to a budding-yeast glo1 mutant.
  supported_by:
  - reference_id: PMID:15042280
    supporting_text: Disruption of glo1(+) enhanced susceptibility to methylglyoxal, while expression of glo1(+) in
      a Delta glo1 mutant of Saccharomyces cerevisiae restored tolerance to this aldehyde.
