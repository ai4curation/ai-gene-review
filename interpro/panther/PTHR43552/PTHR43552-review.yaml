notes: >-
  The family is a clean case for family-level grounding: one reaction, two
  subfamilies that differ only in the downstream pathway. Modules needing
  L-2,4-diaminobutyrate supply can therefore use PANTHER:PTHR43552 with the
  specific GO:0045303 activity. Note that membership does not say which pathway
  consumes the product, so a pyoverdine-specific claim still needs the locus
  context or a member-level review.
