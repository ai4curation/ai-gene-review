family_id: PANTHER:PTHR43552
family_name: DIAMINOBUTYRATE--2-OXOGLUTARATE AMINOTRANSFERASE
preferred_name: >-
  L-2,4-diaminobutyrate:2-oxoglutarate transaminases (EctB/Dat/PvdH class-III
  PLP aminotransferases)
summary: >-
  Class-III pyridoxal 5'-phosphate-dependent aminotransferases (Pfam
  Aminotran_3, PROSITE AA_TRANSFER_CLASS_3, NCBIfam TIGR00709 dat) that
  interconvert L-aspartate 4-semialdehyde and L-2,4-diaminobutyrate using
  2-oxoglutarate/L-glutamate as the amino-group partner (EC 2.6.1.76). The
  reaction is the entry point to L-2,4-diaminobutyrate, a non-proteinogenic
  amino acid used by several pathways: ectoine biosynthesis (EctB of halophilic
  and halotolerant bacteria, the bulk of subfamily SF2), pyoverdine chromophore
  biosynthesis in fluorescent pseudomonads (PvdH), the Dat enzymes of
  Acinetobacter and Bordetella, and rhizobactin biosynthesis (RhbA). Members are
  homo-oligomeric PLP enzymes that use a Schiff base to a conserved catalytic
  lysine and follow a ping-pong kinetic mechanism.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member of both subfamilies catalyses the same
  diaminobutyrate--2-oxoglutarate transamination; what differs is the pathway
  that consumes the product (ectoine, pyoverdine, rhizobactin). The one
  reviewed member without a characterized activity is P55628 (y4qG,
  Sinorhizobium fredii NGR234), annotated only as an uncharacterized
  aminotransferase, so the family-level activity claim rests on characterized
  members rather than on every entry.
reference_protein:
  id: UniProtKB:Q9I168
  label: L-2,4-diaminobutyrate:2-ketoglutarate 4-aminotransferase, PvdH
  gene_symbol: pvdH
  organism: Pseudomonas aeruginosa PAO1
  gene_review: genes/PSEAE/pvdH/pvdH-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43552:SF1
  label: DIAMINOBUTYRATE--2-OXOGLUTARATE AMINOTRANSFERASE
  description: >-
    The Dat/PvdH/RhbA branch: the pyoverdine enzyme PvdH of Pseudomonas
    aeruginosa, the Dat enzymes of Acinetobacter baumannii (P44951) and
    Bordetella pertussis (P56744), and the rhizobactin enzyme RhbA (Q9Z3R2).
    Same reaction as SF2, feeding siderophore and other L-2,4-diaminobutyrate-
    dependent pathways instead of ectoine.
  representative_members:
  - id: UniProtKB:Q9I168
    gene_symbol: pvdH
    organism: Pseudomonas aeruginosa PAO1
    gene_review: genes/PSEAE/pvdH/pvdH-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR43552:SF2
  label: DIAMINOBUTYRATE--2-OXOGLUTARATE TRANSAMINASE
  description: >-
    The EctB branch: the first enzyme of ectoine biosynthesis in halophilic and
    halotolerant bacteria (Halomonas elongata O52250, Marinococcus halophilus
    O06060, Vibrio and Chromohalobacter EctB proteins). Also holds the
    uncharacterized Sinorhizobium protein y4qG (P55628).
  representative_members:
  - id: UniProtKB:O52250
    gene_symbol: ectB
    organism: Halomonas elongata
  diverged_from_family: false
node_assessments:
- node_id: PANTHER:PTN002461253
  asserted_term:
    id: GO:0008483
    label: transaminase activity
  evidence: IBD
  negated: false
  paint_snapshot: '20241031'
  seeds:
  - id: UniProtKB:Q9I168
  assessment: SOUND
  assessment_reason: >-
    The node is seeded by Q9I168 (PvdH) itself, whose transaminase activity was
    directly assayed on protein purified from P. aeruginosa PAO1, so the
    assertion has experimental grounding on an extant member and the recipients
    legitimately include that member. The placement is sound for the whole
    family: both subfamilies consist of class-III PLP aminotransferases, and the
    term asserted is the broad parent, which cannot overreach on substrate. Its
    weakness is granularity rather than placement -- recipients with
    characterized chemistry are better served by GO:0045303, which is why the
    PAO1 PvdH review records MODIFY while accepting the clade-level claim.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43552/PTHR43552-paint.tsv
    supporting_text: "PTHR43552\tPTN002461253\tGO:0008483\tF\tIBD\tfalse"
  - reference_id: PMID:15317763
    supporting_text: >-
      PvdH was found to catalyze an aminotransferase reaction, interconverting
      aspartate beta-semialdehyde and l-2,4-diaminobutyrate.
term_assessments:
- assessed_term:
    id: GO:0045303
    label: L-2,4-diaminobutyrate:2-oxoglutarate transaminase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the family's defining reaction (EC 2.6.1.76) and it holds across
    both subfamilies: the SF2 EctB proteins perform it as the first step of
    ectoine biosynthesis and the SF1 Dat/PvdH/RhbA proteins perform it to supply
    L-2,4-diaminobutyrate to siderophore pathways. PANTHER, InterPro
    (IPR004637 Dat) and NCBIfam (TIGR00709 dat) all name the family for this
    activity, and the reaction is directly assayed for members of both branches.
    The uncharacterized member P55628 (y4qG) is covered by inference from
    membership only.
  member_exceptions: []
  supported_by:
  - reference_id: PMID:15317763
    supporting_text: >-
      PvdH was found to catalyze an aminotransferase reaction, interconverting
      aspartate beta-semialdehyde and l-2,4-diaminobutyrate.
  - reference_id: file:interpro/panther/PTHR43552/PTHR43552-entries.csv
    supporting_text: "O52250,Diaminobutyrate--2-oxoglutarate transaminase"
  - reference_id: file:genes/PSEAE/pvdH/pvdH-uniprot.txt
    supporting_text: 'DR   NCBIfam; TIGR00709; dat; 1.'
- assessed_term:
    id: GO:0030170
    label: pyridoxal phosphate binding
  scope: FAMILY_WIDE
  scope_reason: >-
    All members are class-III pyridoxal-phosphate-dependent aminotransferases
    carrying the PROSITE AA_TRANSFER_CLASS_3 site and the Aminotrans_3 fold, so
    PLP binding is a family-wide property. It is a cofactor annotation and
    secondary to the catalytic term.
  supported_by:
  - reference_id: file:genes/PSEAE/pvdH/pvdH-uniprot.txt
    supporting_text: 'DR   PROSITE; PS00600; AA_TRANSFER_CLASS_3; 1.'
  - reference_id: file:genes/PSEAE/pvdH/pvdH-uniprot.txt
    supporting_text: >-
      SIMILARITY: Belongs to the class-III pyridoxal-phosphate-dependent
      aminotransferase family.
