  name:
    name: WD repeat-containing protein 48
    short: WDR48
  description:
  - text: The WDR48 family proteins are regulators of deubiquitinating complexes,
      enhancing the activity of USP1, USP12, and USP46 by increasing catalytic turnover
      without affecting substrate affinity. They play a crucial role in DNA repair
      processes, particularly by stimulating RAD51-mediated homologous recombination
      and participating in PCNA-mediated translesion synthesis. These proteins are
      also involved in the recruitment of RAD51 to replication forks under stress
      and bind both single-stranded and double-stranded DNA. In addition, they are
      implicated in cellular responses to viral infections, potentially affecting
      vesicular transport and membrane fusion events, as well as maintaining viral
      genomes. Some family members interact with ubiquitin and are involved in resistance
      to various compounds.
