term_assessments:
- assessed_term:
    id: GO:0008080
    label: N-acetyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Shared GNAT acetyltransferase activity of all characterized members; consistent with the SOUND
    root-node IBD.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43626/PTHR43626-paint.tsv
    supporting_text: "PTHR43626\tPTN001895129\tGO:0008080\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0004042
    label: L-glutamate N-acetyltransferase activity, acting on acetyl-CoA as donor
  scope: UNRESOLVED
  scope_reason: >-
    Shown only for M. tuberculosis Rv2747, which acetylates L-glutamate weakly (no saturation at 600 mM)
    and L-glutamine more efficiently. Its subfamily SF4 also holds protein, histone and serotonin
    acetyltransferases and uncharacterized ycf52 proteins, so neither the family nor SF4 can carry the
    term; whether other actinobacterial short NAGS orthologs share it has not been assessed with direct
    assays. Grant per member.
  supported_by:
  - reference_id: PMID:15838030
    supporting_text: The Mycobacterium tuberculosis gene Rv2747 encodes a novel 19-kDa ArgA that catalyzes
      the initial step in L-arginine biosynthesis, namely the conversion of L-glutamate to alpha-N-acetyl-L-glutamate.
  - reference_id: PMID:15838030
    supporting_text: Initial velocity studies with L-glutamate showed that even at concentrations of 600
      mM, saturation was not observed.
- assessed_term:
    id: GO:0006526
    label: L-arginine biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    Applies to M. tuberculosis Rv2747 (accepted by its review on IDA evidence) but not to the plant
    protein and serotonin acetyltransferases; no subfamily isolates the arginine-pathway members.
  supported_by:
  - reference_id: file:genes/MYCTU/argA/argA-ai-review.yaml
    supporting_text: The enzyme itself performs the initiating acetylation, rather than merely affecting
      arginine abundance.
