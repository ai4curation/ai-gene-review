notes: >-
  Subfamily assignments were read from entries.csv (13 reviewed members: 11 in SF4, 2 in SF1). The PAINT
  seeds span both subfamilies, so PTN001895129 sits at or near the family root. The arginine biosynthesis
  module uses this family for its short-GNAT NAGS annoton with a GO:0004042 required_function; because the
  activity is UNRESOLVED here, that annoton relies on its characterized exemplar (O33289), and the module
  validator reports the unresolved family function as a warning.
