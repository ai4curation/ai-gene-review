family_id: PANTHER:PTHR43626
family_name: ACYL-COA N-ACYLTRANSFERASE
preferred_name: Short GNAT N-acetyltransferases (plant chloroplastic GNAT/SNAT, ycf52, mycobacterial short ArgA)
summary: >-
  Single-domain GCN5-related N-acetyltransferases (GNAT) that use acetyl-CoA to acetylate different
  acceptors. The 13 reviewed members comprise plant chloroplastic GNATs with protein and histone
  acetyltransferase activity (Arabidopsis GNAT1/SNAT2 and GNAT2/NSI, soybean TAP1 and TAP2), rice serotonin
  N-acetyltransferases SNAT1 and SNAT2, uncharacterized red-algal and cyanobacterial ycf52 proteins, and
  Mycobacterium tuberculosis Rv2747, a 19-kDa short N-acetylglutamate synthase (ArgA) of arginine
  biosynthesis. SF4 holds 11 members and SF1 two.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  N-acetyltransferase activity is shared, but the acceptor differs between characterized members (proteins
  and histones, serotonin, L-glutamate/L-glutamine), and both subfamilies mix acceptor specificities. The
  glutamate acetyltransferase activity is established only for M. tuberculosis Rv2747 within the reviewed
  set.
