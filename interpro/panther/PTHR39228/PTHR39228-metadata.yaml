  name:
    name: Epidermal cell envelope structural protein
    short: Epidermal_envelope_structural
  description:
  - text: This family of proteins includes structural components of the epidermal
      cell envelope. They are predominantly expressed in terminally differentiated
      keratinocytes and play a crucial role in the formation of the cornified cell
      envelope, which is essential for the barrier function of the skin. Members of
      this family are characterized by their involvement in the cross-linking process
      that provides mechanical strength and water impermeability to the epidermis.
