  - id: UniProtKB:P00562
    label: metL
    organism: Escherichia coli K-12
  - id: UniProtKB:P08660
    label: lysC
    organism: Escherichia coli K-12
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Both seeds are E. coli proteins. Placed at the family-level node, cytosol descends to the
    plant aspartate kinases, including Arabidopsis AK1 (SF58), AK2 (SF54) and AK3 (SF59),
    whose reviewed UniProt names mark them as chloroplastic, and to many other plant
    members. Placement is defensible for bacteria and fungi (yeast HOM3 is cytosolic), but
    the Viridiplantae branch needs an IRD for cytosol (and, if desired, a plastid term).
    SF54 and SF58 are listed as affected; SF59 is not, because it also holds the cytosolic
    fungal and E. coli enzymes.
  affected_subfamilies:
