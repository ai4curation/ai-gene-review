term_assessments:
- assessed_term:
    id: GO:0004072
    label: aspartate kinase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The module's core activity for this family (monofunctional_aspartate_kinase_activity).
    PAINT IBD at PTN000487132 from yeast HOM3, E. coli LysC and MetL, B. subtilis YclM and M.
    tuberculosis Ask; reviewed recipients span every subfamily in the inventory. Yeast HOM3
    mutants lack detectable aspartokinase activity and the purified enzyme has been
    characterised kinetically. The HOM3 gene review accepts the IBA; S. pombe hom3 is a stub.
    The one member annotated as inactive (H. influenzae HI_1632) is excepted.
  member_exceptions:
  - member:
      id: UniProtKB:Q57525
      label: Putative inactive aspartokinase 3 HI_1632
      gene_symbol: HI_1632
      organism: Haemophilus influenzae
    exception_reason: >-
      UniProt describes it as a putative inactive aspartokinase; it does not receive the
      PAINT IBA. Treated as excepted until activity is shown.
    supported_by:
    - reference_id: file:interpro/panther/PTHR21499/PTHR21499-entries.csv
      supporting_text: Q57525,Putative inactive aspartokinase 3 HI_1632,protein,71421
  supported_by:
  - reference_id: PMID:2892836
    supporting_text: shows homology to the three Escherichia coli
      aspartokinases, indicating that it is the structural gene for yeast
      aspartokinase.
  - reference_id: PMID:14623312
    supporting_text: Steady state kinetic analysis of the purified AK(Sc) variants reveals that several
      of the targeted amino acids, particularly K18 and H292, have important roles in the enzymatic
      reaction.
- assessed_term:
    id: GO:0009090
    label: L-homoserine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Asserted at PTN000487132 and the module's trunk concept. 4-Phospho-L-aspartate is the
    obligate precursor of aspartate semialdehyde and hence homoserine in every lineage, so
    each active aspartate kinase performs the first step of homoserine synthesis, including
    the lysine-sensitive isozymes (E. coli LysC is itself a seed).
  supported_by:
  - reference_id: PMID:10509015
    supporting_text: catalyses the first step in the branched pathway leading to the synthesis of
      threonine and methionine from aspartate.
- assessed_term:
    id: GO:0009085
    label: L-lysine biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    Asserted at the bacterial node PTN000487158 (seed M. tuberculosis Ask) and correct for
    bacteria and plants, which make lysine from aspartate semialdehyde via diaminopimelate.
    It must not reach the fungal members: in fungi aspartate kinase serves threonine and
    methionine synthesis only. Because SF59 mixes fungal HOM3 with E. coli LysC and plant
    AK3, the term cannot be scoped by subfamily. The current node does not reach the fungal
    members.
  supported_by:
  - reference_id: PMID:10509015
    supporting_text: catalyses the first step in the branched pathway leading to the synthesis of
      threonine and methionine from aspartate.
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: UNRESOLVED
  scope_reason: >-
    Correct for fungal and bacterial members (the HOM3 gene review accepts the IBA), wrong
    for the plant enzymes, which are plastid-targeted. Plant members occur in SF54, SF58 and
    also in SF59 with HOM3, so the term is lineage-determined rather than subfamily-determined.
    See the NEEDS_PRUNING assessment of PTN000487132.
  supported_by:
  - reference_id: file:interpro/panther/PTHR21499/PTHR21499-entries.csv
    supporting_text: Q9S702,"Aspartokinase 3, chloroplastic",protein,3702
