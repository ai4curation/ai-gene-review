family_id: PANTHER:PTHR21499
family_name: ASPARTATE KINASE
preferred_name: Monofunctional aspartate kinases (aspartokinases)
summary: >-
  Amino acid kinase-family enzymes (ACT-domain regulated) that phosphorylate L-aspartate to
  4-phospho-L-aspartate (EC 2.7.2.4), the committed step of the aspartate family of amino
  acids. Members include the single threonine-inhibited fungal enzyme (S. cerevisiae HOM3,
  S. pombe hom3; SF59), the lysine-sensitive E. coli LysC (SF59), bacterial isozymes of the
  diaminopimelate/lysine branch (B. subtilis dapG, lysC, yclM; M. tuberculosis Ask) and the
  plant chloroplastic monofunctional aspartate kinases (Arabidopsis AK1 SF58, AK2 SF54, AK3
  SF59).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Aspartate kinase activity is shared by all characterised members and PAINT places it at the
  family-level node PTN000487132 with fungal, E. coli, B. subtilis and M. tuberculosis seeds.
  Divergence concerns regulation and pathway context rather than chemistry: isozymes differ in
  feedback inhibitor (threonine for yeast HOM3, lysine for E. coli LysC), fungi have no
  diaminopimelate lysine pathway, and plant members are chloroplastic. SF59 is not a clean
  "fungal" group: it mixes fungal HOM3, E. coli LysC, plant AK3, secondary-metabolite
  aspartate kinase-like proteins (Fusarium FUB3, Epichloe LolA1/LolA2) and a putative
  inactive Haemophilus protein (HI_1632).
