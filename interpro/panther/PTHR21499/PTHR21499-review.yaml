notes: >-
  Used by modules/aspartate_family_threonine_biosynthesis.yaml
  (monofunctional_aspartate_kinase_activity, family_terms PTHR21499:SF59). The three module
  representatives (HOM3, hom3, E. coli LysC) are all in SF59, verified against UniProt and
  the PANTHER 19.0 classification files. But SF59 is narrower than the module's
  "monofunctional aspartate kinases": B. subtilis, M. tuberculosis and plant AK1/AK2 enzymes
  are monofunctional but sit in SF3, SF54, SF58, SF67 and SF68, so a family-level id
  (PTHR21499) would match the module's intent better. Second point: the module says the
  bifunctional AK-HSDH fusions fall in PTHR43070. This holds for E. coli ThrA and Arabidopsis
  AKHSDH1 in every source and for MetL in UniProt, but the PANTHER 19.0 HMM classification
  places E. coli and Salmonella MetL in PTHR21499:SF29 (BIFUNCTIONAL
  ASPARTOKINASE_HOMOSERINE DEHYDROGENASE 2), and MetL is a PAINT seed at PTN000487132.
  HOM3 gene review accepts all three IBAs from PTN000487132; this review agrees for yeast.
