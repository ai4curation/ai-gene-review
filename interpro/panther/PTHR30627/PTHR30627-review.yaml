  seeds:
  - id: UniProtKB:P0AD65
  assessment: UNRESOLVED
  assessment_reason: The exact PAINT seed is E. coli MrdA/PBP2 P0AD65. Its experimental GO:0071972 annotation
    is IDA from EcoliWiki citing PMID6297485. Normal source refresh remains citation-only; the accessible publisher
    abstract describes mecillinam-sensitive membrane-preparation crosslinking attributed to PBP2 but does not
    resolve linkage positions. The L,D-specific term must not be treated as a generic synonym for D,D transpeptidation,
    yet a title, inhibitor response or family assignment does not establish that the original experimental
    curator was wrong. The existing mrdA review is not independent experimental evidence. Retain unresolved
    node placement pending full methods/product inspection. P42971 inherits this exact assertion; its independent
    PBP3 rescue supports target-specific cross-linking inference without settling this donor experiment.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30627/PTHR30627-paint.tsv
    supporting_text: "PTHR30627\tPTN000771407\tGO:0071972\tF\tIBD\tfalse\tUniProtKB:P0AD65"
  - reference_id: PMID:28792086
    supporting_text: 'its biochemical activity in septum formation

      can be provided by PBP 3'
term_assessments:
- assessed_term:
    id: GO:0071972
    label: peptidoglycan L,D-transpeptidase activity
  scope: UNRESOLVED
  scope_reason: The term explicitly specifies L,D cross-links. The traced PTN000771407 seed experiment remains
    insufficiently accessible to adjudicate its exact chemistry; do not grant this activity to all class B
    PBPs or remove it solely because a donor list has one seed.
  supported_by:
  - reference_id: PMID:28792086
    supporting_text: 'its biochemical activity in septum formation

      can be provided by PBP 3'
- assessed_term:
    id: GO:0009002
    label: serine-type D-Ala-D-Ala carboxypeptidase activity
  scope: UNRESOLVED
  scope_reason: The active GO definition is hydrolysis with water, despite its related DD-transpeptidase synonym.
    Hydrolytic and aminolytic reactions share acyl-enzyme chemistry but are distinct claims. Assay-specific
    carboxypeptidase activity can be retained for a demonstrated member; crosslinking alone is not evidence
    of that reaction and the heterogeneous family cannot receive a blanket assignment.
  supported_by:
  - reference_id: PMID:28792086
    supporting_text: 'its biochemical activity in septum formation

      can be provided by PBP 3'
- assessed_term:
    id: GO:0016746
    label: acyltransferase activity
  scope: UNRESOLVED
  scope_reason: Transfer of the donor stem peptidyl acyl group to an acceptor amino group is a chemically appropriate
    generic description of demonstrated PBP transpeptidation. This does not define peptidoglycan substrates
    or D,D linkage, and beta-lactamase membership does not establish net acyl transfer rather than hydrolysis.
    No full-family catalytic scope is granted.
  supported_by:
  - reference_id: PMID:28792086
    supporting_text: 'its biochemical activity in septum formation

      can be provided by PBP 3'
- assessed_term:
    id: GO:0016755
    label: aminoacyltransferase activity
  scope: UNRESOLVED
  scope_reason: A candidate generic parent for a proposed peptidoglycan D,D-transpeptidase concept, consistent
    with transfer of a peptide acyl group; its definition alone does not establish a PBP-specific reaction
    or full-family applicability. No claim is made that GO already places D,D transpeptidation under this term.
    Prefer the explicitly defined proposed molecular function when representing the exact reaction.
  supported_by:
  - reference_id: PMID:28792086
    supporting_text: 'its biochemical activity in septum formation

      can be provided by PBP 3'
