notes: Bounded review, not a claim that all PAINT assertions were adjudicated. PTN000771406 location, penicillin-binding
  and cell-wall-organization assertions are retained in the raw snapshot and are not assigned new verdicts
  here. No clade-to-PTN mapping is invented. The fetched metadata contains unreviewed LLM description text
  and a different integrated InterPro family name; official PANTHER labels here come from panther.obo. Current
  GO:0000048 peptidyltransferase activity is specifically ribosomal peptidyl-tRNA transfer and is not a substitute
  for PBP crosslinking. An exact serine-type peptidoglycan D,D-transpeptidase proposed molecular function is
  preferable for supported gene cores; a generic acyltransferase requirement alone cannot establish the substrate,
  linkage or septal role.
