family_id: PANTHER:PTHR30627
family_name: PEPTIDOGLYCAN D,D-TRANSPEPTIDASE
preferred_name: Class B penicillin-binding proteins and related beta-lactamases
summary: This family contains class B penicillin-binding proteins used in division, elongation, sporulation
  or antibiotic resistance, together with class D beta-lactamases. Penicillin-binding domains and serine-acyl
  enzyme chemistry do not by themselves specify peptidoglycan cross-link formation, linkage stereochemistry
  or participation in the vegetative divisome.
functional_coherence: HETEROGENEOUS
coherence_reason: SF1 includes both FtsI and Bacillus SpoVD; SF2 includes MrdA/PBP2 elongation proteins; SF6
  contains beta-lactamases. The Bacillus PBP2B/PBP3 and sampled coccal division partners occupy SF26/SF25 rather
  than E. coli FtsI SF1.
