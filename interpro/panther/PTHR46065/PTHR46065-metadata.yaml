  name:
    name: E3 ubiquitin-protein ligase
    short: E3_ubiquitin-ligase
  description:
  - text: The E3 ubiquitin-protein ligase family is characterized by its role in the
      ubiquitination process, where it accepts ubiquitin from an E2 ubiquitin-conjugating
      enzyme and transfers it to target substrates. This modification often leads
      to the degradation of the substrates via the proteasome or lysosome. Members
      of the family are involved in various cellular processes, including endosomal
      trafficking, immune response regulation by targeting MHC-I and other immune-related
      proteins, and intracellular trafficking and secretion of specific proteins.
      They contain a RING-CH-type zinc finger domain essential for ligase activity.
      Some members also manipulate host immune detection during viral infection by
      promoting the degradation of host proteins.
