family_id: PANTHER:PTHR14356
family_name: INTERLEUKIN-15-RELATED
preferred_name: Interleukin-15 and Interleukin-21 cytokine family
summary: >-
  Jawed-vertebrate (Euteleostomi) family of short-chain four-helix-bundle
  class I cytokines comprising two paralogous subfamilies: Interleukin-21
  (PTHR14356:SF2, IL21) and Interleukin-15 (PTHR14356:SF3, IL15). Both
  cytokines signal through heteromeric class I cytokine receptor complexes that
  share the common cytokine receptor gamma chain (IL2RG/gamma-c) paired with
  a cytokine-specific receptor subunit (IL21R for IL21; IL2RB and
  trans-presenting IL15RA for IL15) to activate JAK1/JAK3 and downstream
  STAT transcription factors (predominantly STAT3/STAT1/STAT5 for IL21 and
  STAT5/STAT3 for IL15), coordinating NK cell, T cell, and B cell immunity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are secreted four-helix-bundle cytokines (GO:0005125 cytokine
  activity) localized to the extracellular region/space (GO:0005576,
  GO:0005615) that signal via IL2RG-containing receptor complexes and JAK1/JAK3
  to positively regulate cytokine production (GO:0001819) and immune responses
  (GO:0050778). However, the two subfamilies engage distinct private receptor
  chains and initiate distinct ligand-specific pathways: PTHR14356:SF2 (IL21)
  signals via IL21R/IL2RG to mediate the interleukin-21-mediated signaling
  pathway (GO:0038114), whereas PTHR14356:SF3 (IL15) signals via
  IL15RA/IL2RB/IL2RG to mediate the interleukin-15-mediated signaling pathway
  (GO:0035723).
