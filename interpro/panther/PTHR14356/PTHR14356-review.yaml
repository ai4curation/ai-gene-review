  id: UniProtKB:Q9HBE4
  label: Interleukin-21
  gene_symbol: IL21
  organism: Homo sapiens
  gene_review: genes/human/IL21/IL21-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR14356:SF2
    clade_node_id: PANTHER:PTN007637558
    label: INTERLEUKIN-21
    description: >-
      Vertebrate Interleukin-21 (IL21) orthologs. Secreted by activated CD4+
      T cells (especially T follicular helper and Th17 cells) and NKT cells;
      binds the heterodimeric IL21R/IL2RG receptor complex to activate
      JAK1/JAK3 and STAT3 (as well as STAT1 and STAT5), driving germinal center
      B cell differentiation, immunoglobulin production, Tfh differentiation,
      and NK/CD8+ T cell effector maturation.
    representative_members:
      - id: UniProtKB:Q9HBE4
        label: Interleukin-21
        gene_symbol: IL21
        organism: Homo sapiens
        gene_review: genes/human/IL21/IL21-ai-review.yaml
      - id: UniProtKB:Q9ES17
        label: Interleukin-21
        gene_symbol: Il21
        organism: Mus musculus
      - id: UniProtKB:A3QPB9
        label: Interleukin-21
        gene_symbol: Il21
        organism: Rattus norvegicus
    diverged_from_family: false
    supported_by:
      - reference_id: PMID:11081504
        supporting_text: >-
          We constructed a complementary DNA expression library from activated
          human CD3+ T cells, and identified a cytokine with a four-helix-bundle
          structure using functional cloning. This cytokine is most closely
          related to IL2 and IL15, and has been designated IL21 with the
          receptor designated IL21 R.
      - reference_id: PMID:12244150
        supporting_text: >-
          IL-21 is a recently characterized T cell-derived cytokine that
          regulates NK and T cell function. IL-21R shares the common
          gamma-chain (gamma(c)) with the receptors for IL-2, IL-4, IL-7, IL-9,
          and IL-15.
  - subfamily_id: PANTHER:PTHR14356:SF3
    clade_node_id: PANTHER:PTN002682897
    label: INTERLEUKIN-15
    description: >-
      Vertebrate Interleukin-15 (IL15) orthologs. Trans-presented by IL15RA on
      myeloid and stromal cells to the heterodimeric IL2RB/IL2RG signaling
      complex on NK and CD8+ memory T cells, activating JAK1/JAK3 and STAT5 to
      drive NK cell development and memory CD8+ T cell homeostasis.
    representative_members:
      - id: UniProtKB:P40933
        label: Interleukin-15
        gene_symbol: IL15
        organism: Homo sapiens
        gene_review: genes/human/IL15/IL15-ai-review.yaml
      - id: UniProtKB:P48346
        label: Interleukin-15
        gene_symbol: Il15
        organism: Mus musculus
      - id: UniProtKB:P97604
        label: Interleukin-15
        gene_symbol: Il15
        organism: Rattus norvegicus
    diverged_from_family: false
    supported_by:
      - reference_id: PMID:12244150
        supporting_text: >-
          IL-15 induced STAT5 DNA binding to the IL-2Ralpha IFN-gamma-activated
          sequence (GAS), MyD88 GAS, and c-cis-inducible elements, whereas
          IL-21 induced STAT3 DNA binding to MyD88 GAS and c-sis-inducible
          elements.
