term_assessments:
  - assessed_term:
      id: GO:0005125
      label: cytokine activity
    scope: FAMILY_WIDE
    scope_reason: >-
      All members of PTHR14356 (both IL21 in PTHR14356:SF2 and IL15 in
      PTHR14356:SF3) are secreted four-helix-bundle cytokines that bind and
      activate class I cytokine receptor complexes.
    supported_by:
      - reference_id: PMID:11081504
        supporting_text: >-
          We constructed a complementary DNA expression library from activated
          human CD3+ T cells, and identified a cytokine with a four-helix-bundle
          structure using functional cloning. This cytokine is most closely
          related to IL2 and IL15, and has been designated IL21 with the
          receptor designated IL21 R.
  - assessed_term:
      id: GO:0005576
      label: extracellular region
    scope: FAMILY_WIDE
    scope_reason: >-
      Both IL15 and IL21 function as extracellular cytokines engaging
      cell-surface receptors.
    supported_by:
      - reference_id: PMID:11081504
        supporting_text: >-
          Conditioned media from activated human CD3+ T cells supported
          proliferation of the assay cell line.
  - assessed_term:
      id: GO:0001819
      label: positive regulation of cytokine production
    scope: FAMILY_WIDE
    scope_reason: >-
      Both IL15 and IL21 stimulate IFN-gamma and pro-inflammatory cytokine
      expression in NK and T lymphocytes.
    supported_by:
      - reference_id: PMID:12244150
        supporting_text: >-
          Both IL-15 and IL-21 rapidly induced mRNA synthesis for IFN-gamma,
          T-bet, IL-2Ralpha, IL-12Rbeta2, IL-18R, and myeloid differentiation
          factor 88 (MyD88), the genes that are important in activating innate
          immunity and Th1 response.
  - assessed_term:
      id: GO:0038114
      label: interleukin-21-mediated signaling pathway
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR14356:SF2
        label: INTERLEUKIN-21
    scope_reason: >-
      Only members of PTHR14356:SF2 (IL21) bind the IL21R/IL2RG receptor complex
      to initiate the interleukin-21-mediated signaling pathway (GO:0038114);
      PTHR14356:SF3 (IL15) signals through IL15RA/IL2RB/IL2RG (GO:0035723).
    supported_by:
      - reference_id: PMID:12244150
        supporting_text: >-
          IL-21 is a recently characterized T cell-derived cytokine that
          regulates NK and T cell function. IL-21R shares the common
          gamma-chain (gamma(c)) with the receptors for IL-2, IL-4, IL-7, IL-9,
          and IL-15.
  - assessed_term:
      id: GO:0035723
      label: interleukin-15-mediated signaling pathway
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR14356:SF3
        label: INTERLEUKIN-15
    scope_reason: >-
      Specific to Interleukin-15 orthologs in PTHR14356:SF3 signaling through
      the IL15RA/IL2RB/IL2RG receptor complex.
    supported_by:
      - reference_id: PMID:12244150
        supporting_text: >-
          IL-15 induced STAT5 DNA binding to the IL-2Ralpha IFN-gamma-activated
          sequence (GAS), MyD88 GAS, and c-cis-inducible elements, whereas
          IL-21 induced STAT3 DNA binding to MyD88 GAS and c-sis-inducible
          elements.
