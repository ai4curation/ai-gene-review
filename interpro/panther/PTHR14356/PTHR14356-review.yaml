notes: >-
  PTHR14356 unites the paralogous gamma-c cytokines IL15 (PTHR14356:SF3, clade
  PTN002682897) and IL21 (PTHR14356:SF2, clade PTN007637558). PAINT currently
  places GO:0005125 (cytokine activity) and GO:0005576 (extracellular region)
  only on the IL15 clade PTN002682897 rather than at the family root
  PTN002682898, and omits GO:0038114 (interleukin-21-mediated signaling
  pathway) on the IL21 clade PTN007637558.
