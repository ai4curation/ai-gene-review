    id: NCBITaxon:33154
    label: Opisthokonta
  paint_snapshot: '20190221'
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The only seeds are human beta-arrestin-1 and beta-arrestin-2, but the term is placed at the family root
    and so descends to the vertebrate visual arrestins. Those lack the clathrin- and AP-2-binding motifs that
    beta-arrestins use to recruit receptors to clathrin-coated pits, and rod rhodopsin sits in disc membranes
    that are not endocytosed. The S-arrestin clade (PTN002623649, SF15) and the arrestin-C clade
    (PTN002623637, SF19) each need an IRD for this term; in the cached tree they are separate clades beside
    the beta-arrestins, so one IRD cannot cover both. Whether the invertebrate and fungal arrestins under the
    node internalize receptors was not assessed; the verdict is about the vertebrate visual branch, and does
    not settle whether the root placement is otherwise too deep.
