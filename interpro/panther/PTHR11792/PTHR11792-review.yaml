family_id: PANTHER:PTHR11792
family_name: ARRESTIN
summary: >-
  Arrestins are soluble cytoplasmic proteins that bind activated, phosphorylated G protein-coupled receptors
  and so stop G protein activation. Jawed vertebrates have four: the visual arrestins Arr-S (SAG, rods) and
  Arr-C (ARR3, cones), which quench light-activated opsins in photoreceptor outer segments, and the
  beta-arrestins ARRB1 and ARRB2, which are expressed widely, desensitize many GPCRs and also act as
  adaptors that carry receptors to clathrin-coated pits for internalization. Invertebrates have their own
  visual arrestins (Drosophila phosrestins) and a non-visual arrestin (kurtz). Receptor binding and signal
  termination are shared across the family; photoreceptor compartments belong to the visual arrestins, and
  receptor internalization through clathrin and AP-2 belongs to the beta-arrestins and the
  Drosophila non-visual arrestin kurtz.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members bind activated GPCRs. The vertebrate visual arrestins (PTHR11792:SF15 S-arrestin, SF19
  arrestin-C) diverge from the beta-arrestins (SF20, SF22) in lacking the C-terminal clathrin- and
  AP-2-binding motifs that beta-arrestins use to internalize receptors, and in working in photoreceptor
  compartments. In the cached tree the four vertebrate arrestin clades descend side by side from
  PTN000209634, so the two visual arrestins are not sister clades there.
