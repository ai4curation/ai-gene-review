term_assessments:
- assessed_term:
    id: GO:0001664
    label: G protein-coupled receptor binding
  scope: FAMILY_WIDE
  scope_reason: >-
    Binding activated, phosphorylated GPCRs is the defining arrestin activity, shared by visual arrestins
    (rhodopsin, cone opsins) and beta-arrestins (many receptors). For SAG the gene review refines the IBA to
    opsin binding (GO:0002046), the informative term for a visual arrestin; that is not a disagreement with
    the family-level term.
  supported_by:
  - reference_id: PMID:9333241
    supporting_text: Arrestins are soluble cytoplasmic proteins that bind to G-protein-coupled receptors
- assessed_term:
    id: GO:0002046
    label: opsin binding
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Opsin binding is the physiological role of the vertebrate visual arrestins, Arr-S in rods (SF15) and
    Arr-C in cones (SF19). The invertebrate visual arrestins (phosrestins, SF16 and SF23) are also expected
    to bind their rhodopsins, but no cached source was checked for them, so they are not listed.
  applicable_subfamilies:
  - id: PANTHER:PTHR11792:SF15
    label: S-ARRESTIN
  - id: PANTHER:PTHR11792:SF19
    label: ARRESTIN-C
  supported_by:
  - reference_id: PMID:29321241
    supporting_text: that encode proteins that we denote, respectively, as Arr-S (expressed in rods), Arr-C (in cones), Arr-B1 and Arr-B2
- assessed_term:
    id: GO:0002031
    label: G protein-coupled receptor internalization
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Receptor internalization runs through the beta-arrestin C-terminal motifs that bind clathrin and the
    clathrin adaptor AP-2; the vertebrate visual arrestins lack these motifs, and rhodopsin in rod discs is
    not internalized. The term is therefore safe for beta-arrestin-1 (SF22) and beta-arrestin-2 (SF20). It is
    not safe for S-arrestin (SF15) or arrestin-C (SF19). The Drosophila non-visual arrestin kurtz (SF17)
    promotes clathrin-dependent internalization of Smoothened and of GPCRs, so SF17 is included. The
    invertebrate visual arrestins and remaining subfamilies (SF16, SF18, SF23) were not assessed and are left
    unlisted. Because SAG's subfamily is outside the
    scope, the SAG review's MARK_AS_OVER_ANNOTATED agrees with the family without a member exception; the
    pruning is recorded on node PTN001370087.
  applicable_subfamilies:
  - id: PANTHER:PTHR11792:SF22
    label: BETA-ARRESTIN-1
  - id: PANTHER:PTHR11792:SF20
    label: BETA-ARRESTIN-2
  - id: PANTHER:PTHR11792:SF17
    label: KURTZ ARRESTIN
  supported_by:
  - reference_id: PMID:21437272
    supporting_text: promote Smoothened internalization and degradation in a clathrin- and proteosomal-dependent manner
  - reference_id: PMID:20802461
    supporting_text: promote internalization of GPCRs on receptor activation
  - reference_id: PMID:29321241
    supporting_text: in contrast to visual arrestins, both classes of β-arrestin contain motifs involved in binding clathrin and the clathrin adaptor, AP-2
  - reference_id: PMID:29321241
    supporting_text: Figure 11 shows these final three motifs to be absent from the visual arrestins of agnathan vertebrates, cartilaginous fishes and bony fishes
  - reference_id: PMID:21540189
    supporting_text: Non-visual arrestins (arrestin-2 and arrestin-3) function as adaptor proteins to recruit 7TMRs to clathrin-coated pits
- assessed_term:
    id: GO:0005737
    label: cytoplasm
  scope: FAMILY_WIDE
  scope_reason: >-
    Arrestins are soluble cytoplasmic proteins. This includes the visual arrestins, which shuttle between the
    inner segment and the outer segment of photoreceptors; the SAG review keeps cytosol (a part of cytoplasm)
    as non-core. The two PAINT IRD losses of cytoplasm on the visual arrestin clades are therefore not
    supported (see the node assessments).
  supported_by:
  - reference_id: PMID:9333241
    supporting_text: Arrestins are soluble cytoplasmic proteins that bind to G-protein-coupled receptors
  - reference_id: PMID:12716919
    supporting_text: Arrestin localizes predominantly to the inner segments and perinuclear region of dark-adapted
      rod photoreceptors, whereas light induces redistribution of arrestin to the rod outer segments.
- assessed_term:
    id: GO:0001750
    label: photoreceptor outer segment
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The outer segment is where the vertebrate visual arrestins quench light-activated opsin: Arr-S in rods and
    Arr-C in cones. Beta-arrestins are not photoreceptor proteins.
  applicable_subfamilies:
  - id: PANTHER:PTHR11792:SF15
    label: S-ARRESTIN
  - id: PANTHER:PTHR11792:SF19
    label: ARRESTIN-C
  supported_by:
  - reference_id: PMID:3720866
    supporting_text: The protein was predominantly located to the proximal portion of the rod outer segment and
      appeared to be distributed on the disc membrane but not on the plasma membrane.
  - reference_id: PMID:29321241
    supporting_text: that encode proteins that we denote, respectively, as Arr-S (expressed in rods), Arr-C (in cones), Arr-B1 and Arr-B2
- assessed_term:
    id: GO:0001917
    label: photoreceptor inner segment
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Rod arrestin is held in the inner segment in darkness and moves to the outer segment in light; the
    inner segment is a storage compartment rather than the site of function, which is why the SAG review keeps
    the row as non-core. Shown for rod arrestin (SF15); not checked here for arrestin-C, so SF19 is not listed.
  applicable_subfamilies:
  - id: PANTHER:PTHR11792:SF15
    label: S-ARRESTIN
  supported_by:
  - reference_id: PMID:12716919
    supporting_text: Arrestin localizes predominantly to the inner segments and perinuclear region of dark-adapted
      rod photoreceptors, whereas light induces redistribution of arrestin to the rod outer segments.
- assessed_term:
    id: GO:0007600
    label: sensory perception
  scope: UNRESOLVED
  scope_reason: >-
    True for the visual arrestins of vertebrates and Drosophila, whose loss impairs the shut-off of the light
    response (the SAG review keeps it as non-core). Whether the beta-arrestins, which the PAINT node also
    covers, take part in a sensory perception process was not established from the cached sources.
  supported_by:
  - reference_id: PMID:9333241
    supporting_text: although arrestin
      is required for normal signal termination, it does not participate directly in
      light adaptation.
