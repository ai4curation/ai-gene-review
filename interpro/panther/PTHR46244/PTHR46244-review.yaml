  scope: UNRESOLVED
  scope_reason: The enzyme-I activity is independently supported for standalone PtsI, regulatory PtsP
    and the reviewed fused FruB exemplars. This targeted architectural audit has not established the complete
    extant descendant set for a family-wide grant; it makes no negative claim about the PAINT placement.
    Even a positive activity assertion establishes only PEP entry, not fusion, fructose specificity or
    an internal EIIA relay.
