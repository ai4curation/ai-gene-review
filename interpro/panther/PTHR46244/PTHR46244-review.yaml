- assessed_term:
    id: GO:0015764
    label: N-acetylglucosamine transport
  scope: UNRESOLVED
  scope_reason: N-acetylglucosamine transport is a physiological process, not an inevitable consequence
    of enzyme-I chemistry. The PAINT gain is at the broad root and seeded by P. aeruginosa Q9HXN5; a complete
    appraisal of that seed and all descendant transport contexts is not available. E. coli PtsI retains
    a supported non-core process judgment, while E. coli PtsP removes the target-specific process transfer
    based on NPr specificity. Neither all-family propagation nor a blanket denial to regulatory proteins
    is settled here.
  supported_by:
  - reference_id: PMID:10473571
    supporting_text: EI(Ntr) phosphorylated NPr but not HPr, whereas Enzyme I exhibited a strong preference
      for HPr.
