    organism: Pseudomonas aeruginosa PAO1
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  assessment: TOO_DEEP
  assessment_reason: >-
    A substrate-specific sugar transport process is placed on the root bacterial node
    from a single seed, the P. aeruginosa multiphosphoryl transfer protein PA3760
    (Q9HXN5, an 842-residue EI-HPr-EIIA fusion of the N-acetylglucosamine PTS). The
    same node covers the EI(Ntr) subfamily SF1, which phosphorylates only NPr and takes
    part in no sugar transport, and enzyme I proteins whose physiological sugars are
    unrelated to N-acetylglucosamine. The term belongs, at most, on the clade of
    N-acetylglucosamine PTS multiphosphoryl proteins containing the seed; it descends
    wrongly to E. coli and P. putida PtsP.
  supported_by:
