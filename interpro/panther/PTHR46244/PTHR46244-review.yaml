      that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr) to NPr
      to EIIA(Ntr).
  - reference_id: PMID:27109061
    supporting_text: Decreasing intracellular glutamine concentration triggers phosphorylation of EI(Ntr)
      and its downstream components HPr and EIIA(Ntr).
- assessed_term:
    id: GO:0015764
    label: N-acetylglucosamine transport
  scope: UNRESOLVED
  scope_reason: N-acetylglucosamine transport is a physiological process, not an inevitable consequence
    of enzyme-I chemistry. The PAINT gain is at the broad root and seeded by P. aeruginosa Q9HXN5; a complete
    appraisal of that seed and all descendant transport contexts is not available. E. coli PtsI retains
    a supported non-core process judgment, while PtsP remains unresolved. Neither all-family propagation
    nor a blanket denial to regulatory proteins is settled here.
  supported_by:
  - reference_id: PMID:10473571
    supporting_text: EI(Ntr) phosphorylated NPr but not HPr, whereas Enzyme I exhibited a strong preference
      for HPr.
- assessed_term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  scope: UNRESOLVED
  scope_reason: Sugar-PTS participation is positive for characterized PtsI but not a family-wide annotation.
    Native KT2440 evidence explicitly distinguishes its PtsP regulatory branch from sugar traffic; NA1000
    regulatory role does not establish sugar transport. E. coli PtsP sugar annotation remains UNDECIDED
    because reconstitution/cross-system exchange does not settle native physiological participation. No
    blanket SF6 or SF1 negative is imposed.
  supported_by:
  - reference_id: PMID:18296519
    supporting_text: Our results show that the source of phosphate available to the system is PEP and
      that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr) to NPr
      to EIIA(Ntr).
  - reference_id: PMID:10473571
    supporting_text: EI(Ntr) phosphorylated NPr but not HPr, whereas Enzyme I exhibited a strong preference
      for HPr.
