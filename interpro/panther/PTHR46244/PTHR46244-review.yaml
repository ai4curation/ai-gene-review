    supporting_text: Enzyme I-Ntr transfers the phosphoryl group from phosphoenolpyruvate (PEP) to the
      phosphoryl carrier protein (NPr)
notes: 'Module constraint: EI, HPr and fructose EIIA must occur on the same supported FruB protein, with
  a compatible FruA partner. Domain order and phosphate-flow direction differ. Fusion does not prove strictly
  intramolecular transfer. Do not transfer N-acetylglucosamine transport from a PAINT process row simply
  because its node also carries enzyme-I activity; donor count is not the issue, target substrate and
  clade membership are. Full node-placement adjudication remains open. This is a completed review of applicability
  to the fused-fructose module; the explicit unresolved family-wide partitions and PAINT-node placement
  are not asserted as settled.'
