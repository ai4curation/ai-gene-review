  scope: FAMILY_WIDE
  scope_reason: The family-level enzyme-I chemistry is supported across the independently characterized
    PtsP and PtsI routes and by the PAINT gain at their common ancestral node. This grant concerns PEP-to-protein-histidine
    transfer only; it does not assign a specific native acceptor, sugar-transport role, GAF ligand or
    downstream output. The earlier fructose-only audit left whole-family scope unresolved because it did
    not inspect the extant node. The present nitrogen audit adds the frozen 43-leaf PAINT-node analysis
    with both PtsI and PtsP experimental anchors. This chemistry grant does not imply fused architecture,
    fructose specificity, native nitrogen routing, or intramolecular phosphate transfer.
