family_id: PANTHER:PTHR46244
family_name: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
functional_coherence: HETEROGENEOUS
review_status: COMPLETE
reviewed_by: codex (annotation-reviewer consultation)
review_date: '2026-11-07'
preferred_name: PEP-dependent enzyme-I proteins with distinct native phosphocarrier partners
summary: Members share enzyme-I phosphotransfer chemistry but feed different physiological systems. Sugar-PTS
  PtsI phosphorylates HPr, whereas nitrogen-regulatory PtsP preferentially supplies NPr or a native regulatory
  HPr. Regulatory input domains and phosphocarrier specificity distinguish physiological roles; the PANTHER
  subfamily partitions do not uniquely identify those roles.
coherence_reason: The conserved PEP-to-protein phosphotransfer activity does not imply a shared transported
  sugar or regulatory partner. SF1 contains characterized gamma-proteobacterial PtsP, while SF6 contains
  both NA1000 regulatory PtsP and E. coli sugar-PTS PtsI. A family or SF6 match is therefore insufficient
  to assign a nitrogen-regulatory entry role.
