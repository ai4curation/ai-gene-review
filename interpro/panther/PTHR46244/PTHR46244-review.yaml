family_id: PANTHER:PTHR46244
family_name: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
preferred_name: PTS enzyme I family (enzyme I, enzyme I(Ntr)/PtsP and multiphosphoryl transfer proteins)
summary: >-
  Bacterial (and haloarchaeal) phosphoenolpyruvate-dependent histidine
  phosphotransferases of the phosphotransferase system (PTS). All members carry the
  enzyme I architecture: an N-terminal HPr-binding domain, a central phosphohistidine
  domain and a C-terminal PEP-binding domain, and autophosphorylate from
  phosphoenolpyruvate before passing the phosphoryl group to an HPr-like carrier. The
  family splits by partner and role: sugar-PTS enzyme I (PtsI) that phosphorylates HPr
  for carbohydrate uptake; multiphosphoryl transfer proteins (FruB, FryA, PtsA) that
  fuse enzyme I to HPr and EIIA modules for fructose-type sugar PTSs; and enzyme
  I(Ntr) (PtsP), which adds an N-terminal GAF sensory domain, phosphorylates NPr but
  not HPr, and starts the regulatory nitrogen PTS (PTS(Ntr)) that transports no sugar.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The catalytic activity (PEP + protein histidine to pyruvate + protein
  phosphohistidine) is shared by every characterized member, so GO:0008965 is safe
  family-wide. The biological role is not: enzyme I and the multiphosphoryl proteins
  feed sugar transport, whereas EI(Ntr) (SF1) is acceptor-specific for NPr and feeds a
  regulatory relay. Process terms naming sugar transport, and above all
  substrate-specific transport terms, must not be read from the family id.
reference_protein:
  id: UniProtKB:P37177
  label: Phosphoenolpyruvate-dependent phosphotransferase system
  gene_symbol: ptsP
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/ptsP/ptsP-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR46244:SF1
  label: PHOSPHOENOLPYRUVATE-DEPENDENT PHOSPHOTRANSFERASE SYSTEM
  description: >-
    Enzyme I(Ntr) (PtsP): E. coli PtsP (P37177), Salmonella PtsP (P37178) and
    Pseudomonas putida KT2440 PtsP (Q88CN5). GAF-domain enzyme I paralogues that
    phosphorylate NPr, the entry step of the nitrogen-regulatory PTS. This is the
    subfamily used to select the entry step of the bacterial nitrogen-regulatory PTS
    module.
  representative_members:
  - id: UniProtKB:P37177
    label: Phosphoenolpyruvate-dependent phosphotransferase system
    gene_symbol: ptsP
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/ptsP/ptsP-ai-review.yaml
  - id: UniProtKB:Q88CN5
    label: Phosphoenolpyruvate--protein phosphotransferase
    gene_symbol: ptsP
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/ptsP/ptsP-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    The catalytic activity is retained, but the acceptor changed from HPr to NPr and the
    pathway role changed from sugar transport to a regulatory phosphorelay; an
    N-terminal GAF domain makes the enzyme responsive to glutamine and 2-oxoglutarate.
  supported_by:
  - reference_id: PMID:10473571
    supporting_text: EI(Ntr) phosphorylated NPr but not HPr, whereas Enzyme I exhibited a strong preference for HPr.
  - reference_id: PMID:23517463
    supporting_text: >-
      the GAF signal transduction domain is necessary for the regulation of enzyme
      I(Ntr) activity by the two signal molecules
  - reference_id: PMID:18296519
    supporting_text: comprise a branch of the system unrelated to sugar traffic but thought to have an influence on coordination of N and C metabolism
- subfamily_id: PANTHER:PTHR46244:SF6
  label: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
  description: >-
    Proteobacterial sugar-PTS enzyme I (E. coli PtsI P08839, Salmonella, Haemophilus,
    Buchnera) together with proteobacterial multiphosphoryl transfer proteins (FruB of
    Rhodobacter capsulatus and Xanthomonas; P. putida KT2440 FruB Q88PQ5 is classified
    here by UniProt). Both feed carbohydrate uptake. The multiphosphoryl transfer
    proteins fuse EIIA(Fru), HPr and enzyme I modules in one polypeptide and are the
    soluble relay of fused fructose PTSs that phosphorylate an EIIB'BC FruA permease;
    the X. campestris and P. putida fruB mutants are defective in fructose uptake. The
    subfamily therefore mixes the separate sugar-PTS enzyme I and the fused fructose
    relay; that architectural split is not resolved by the subfamily id.
  representative_members:
  - id: UniProtKB:P08839
    label: Phosphoenolpyruvate-protein phosphotransferase
    gene_symbol: ptsI
    organism: Escherichia coli K-12
  - id: UniProtKB:P45597
    label: Multiphosphoryl transfer protein
    gene_symbol: fruB
    organism: Xanthomonas campestris pv. campestris (strain ATCC 33913)
    gene_review: genes/XANCP/fruB/fruB-ai-review.yaml
  - id: UniProtKB:Q88PQ5
    label: Phosphoenolpyruvate-protein phosphotransferase
    gene_symbol: fruB
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/fruB/fruB-ai-review.yaml
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:18296519
    supporting_text: Two of these PTS constituents (FruA and FruB) form a complete
      system for fructose intake.
  - reference_id: file:interpro/panther/PTHR46244/PTHR46244-entries.csv
    supporting_text: P45597,Multiphosphoryl transfer protein,protein
  - reference_id: PMID:7496537
    supporting_text: The construction of a fruB mutant confirmed the role of the MTP in fructose transport and phosphorylation in X. campestris.
- subfamily_id: PANTHER:PTHR46244:SF3
  label: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
  description: >-
    Sugar-PTS enzyme I of Firmicutes, Actinobacteria, Chlamydiae, Mollicutes and
    Haloferax (B. subtilis PtsI P08838 and others). Not checked experimentally for this
