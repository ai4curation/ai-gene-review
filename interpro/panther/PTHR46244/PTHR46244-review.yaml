notes: >-
  Written for the bacterial nitrogen-regulatory PTS module. Subfamily membership was
  read from the PANTHER entries inventory (51 reviewed members: SF3 34, SF6 9, SF4 6,
  SF1 2) and from the DR PANTHER lines of the P. putida KT2440 records (PtsP Q88CN5 in
  SF1, FruB Q88PQ5 in SF6). The reference protein is E. coli PtsP rather than the
  better-studied enzyme I because it anchors the module step and has a complete gene
  review. No residue sites are curated; the active-site histidine positions are
  UniProt by-similarity features. Extended for the bacterial fructose PTS modules:
  the fused fructose multiphosphoryl transfer proteins of P. putida KT2440 (Q88PQ5)
  and X. campestris (P45597) were added as SF6 representatives with complete gene
  reviews, and the GO:0015764 N-acetylglucosamine transport IBA that the root node
  passes to X. campestris FruB is removed in that gene review, consistent with the
  TOO_DEEP node assessment.
