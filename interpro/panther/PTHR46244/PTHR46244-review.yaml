  assessment_reason: >-
    Root bacterial node seeded by both sugar-PTS enzyme I and EI(Ntr). The PEP-dependent
    histidine phosphotransferase activity is the defining chemistry of the enzyme I fold
    and is experimentally established on both seeds, which sit in different subfamilies
    (SF6 and SF1), so every descendant plausibly inherits it.
  supported_by:
