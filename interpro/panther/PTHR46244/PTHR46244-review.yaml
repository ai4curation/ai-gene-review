notes: 'Bounded review of chemistry, native partner roles and four actual PAINT gains using the 12-gene
  experimental/control panel. Exact official labels come from panther.obo; InterPro metadata descriptions
  are marked LLM-generated and are not primary functional evidence. Frozen tree topology is read from
  tree-evidence-20261107 raw treeinfo plus compact descendants. Missing KT2440 or NA1000 leaves do not
  establish phylogenetic loss, and SF labels are not interchangeable with PTN clades. No residue conservation/loss
  claim, guessed clade root, universal effector, or new PAINT node is authored. Abstract-only primary
  sources are used only for explicit reported observations; native genetic/cellular assays are distinguished
  from purified kinetics. Reference/member records and all gene judgments remain unchanged. Module constraint:
  EI, HPr and fructose EIIA must occur on the same supported FruB protein, with a compatible FruA partner.
  Domain order and phosphate-flow direction differ. Fusion does not prove strictly intramolecular transfer.
  Do not transfer N-acetylglucosamine transport from a PAINT process row simply because its node also
  carries enzyme-I activity; donor count is not the issue, target substrate and clade membership are.
  Full node-placement adjudication remains open. This is a completed review of applicability to the fused-fructose
  module; the explicit unresolved family-wide partitions and PAINT-node placement are not asserted as
  settled. 2026-11-08 reconciliation: retain both audits’ representative proteins, quotes and architecture/partner
  boundaries. The added nitrogen-family topology evidence resolves only the shared PEP-transfer chemistry;
  sugar-specific ancestral process scope remains open. 2026-11-11 reconciliation: retain incoming representatives
  and positive biochemical evidence from the merged PTS review. Target-specific physiological and partner
  boundaries remain those assessed in this audit; unsupported universal subfamily grants and exact pruning
  placements are not inferred from labels. The added kinase-regulator term is explicitly unresolved at
  subfamily scale.'
