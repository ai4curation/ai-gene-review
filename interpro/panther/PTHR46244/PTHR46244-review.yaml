notes: Bounded review of chemistry, native partner roles and four actual PAINT gains using the 12-gene
  experimental/control panel. Exact official labels come from panther.obo; InterPro metadata descriptions
  are marked LLM-generated and are not primary functional evidence. Frozen tree topology is read from
  tree-evidence-20261107 raw treeinfo plus compact descendants. Missing KT2440 or NA1000 leaves do not
  establish phylogenetic loss, and SF labels are not interchangeable with PTN clades. No residue conservation/loss
  claim, guessed clade root, universal effector, or new PAINT node is authored. Abstract-only primary
  sources are used only for explicit reported observations; native genetic/cellular assays are distinguished
  from purified kinetics. Reference/member records and all gene judgments remain unchanged.
