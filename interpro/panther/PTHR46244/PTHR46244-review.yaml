family_id: PANTHER:PTHR46244
family_name: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
functional_coherence: HETEROGENEOUS
review_status: COMPLETE
reviewed_by: codex
review_date: '2026-11-11'
preferred_name: PEP-dependent enzyme-I proteins, regulatory entry enzymes and fused phosphotransfer relays
summary: 'PEP-dependent PTS enzyme-I proteins initiate histidine phosphorylation. Their physiological
  partners and architectures differ: standalone sugar-PTS enzyme I transfers phosphate to a separate HPr,
  nitrogen-regulatory EI-Ntr acts with NPr, and fused FruB proteins combine enzyme-I, HPr and fructose-specific
  EIIA regions. A common enzyme-I family or subfamily assignment does not establish a complete fused fructose
  relay. In the nitrogen-regulatory route, native partner specificity and input sensing must be established
  independently; Caulobacter PtsP shares SF6 with carbohydrate PtsI and fused FruB.'
coherence_reason: 'The conserved PEP-to-protein phosphotransfer activity does not imply a shared transported
  sugar or regulatory partner. SF1 contains characterized gamma-proteobacterial PtsP, while SF6 contains
  both NA1000 regulatory PtsP and E. coli sugar-PTS PtsI. A family or SF6 match is therefore insufficient
  to assign a nitrogen-regulatory entry role. Heterogeneous for physiological output and the fused-fructose
  role: SF6 contains both standalone PtsI and fused FruB, while SF1 contains nitrogen-regulatory PtsP.
  This does not challenge the common PEP-dependent entry chemistry or infer that a short PAINT donor list
  is weak evidence.'
