family_id: PANTHER:PTHR46244
family_name: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
preferred_name: PTS enzyme I family (enzyme I, enzyme I(Ntr)/PtsP and multiphosphoryl transfer proteins)
summary: 'Bacterial (and haloarchaeal) phosphoenolpyruvate-dependent histidine phosphotransferases of
  the phosphotransferase system (PTS). All members carry the enzyme I architecture: an N-terminal HPr-binding
  domain, a central phosphohistidine domain and a C-terminal PEP-binding domain, and autophosphorylate
  from phosphoenolpyruvate before passing the phosphoryl group to an HPr-like carrier. The family splits
  by partner and role: sugar-PTS enzyme I (PtsI) that phosphorylates HPr for carbohydrate uptake; multiphosphoryl
  transfer proteins (FruB, FryA, PtsA) that fuse enzyme I to HPr and EIIA modules for fructose-type sugar
  PTSs; and enzyme I(Ntr) (PtsP), which adds an N-terminal GAF sensory domain, phosphorylates NPr but
  not HPr, and starts the regulatory nitrogen PTS (PTS(Ntr)) that transports no sugar. PEP-dependent PTS
  enzyme-I proteins initiate histidine phosphorylation. Their physiological partners and architectures
  differ: standalone sugar-PTS enzyme I transfers phosphate to a separate HPr, nitrogen-regulatory EI-Ntr
  acts with NPr, and fused FruB proteins combine enzyme-I, HPr and fructose-specific EIIA regions. A common
  enzyme-I family or subfamily assignment does not establish a complete fused fructose relay.'
functional_coherence: HETEROGENEOUS
coherence_reason: 'The catalytic activity (PEP + protein histidine to pyruvate + protein phosphohistidine)
  is shared by every characterized member, so GO:0008965 is safe family-wide. The biological role is not:
  enzyme I and the multiphosphoryl proteins feed sugar transport, whereas EI(Ntr) (SF1) is acceptor-specific
  for NPr and feeds a regulatory relay. Process terms naming sugar transport, and above all substrate-specific
  transport terms, must not be read from the family id. Heterogeneous for physiological output and the
  fused-fructose role: SF6 contains both standalone PtsI and fused FruB, while SF1 contains nitrogen-regulatory
  PtsP. This does not challenge the common PEP-dependent entry chemistry or infer that a short PAINT donor
  list is weak evidence.'
