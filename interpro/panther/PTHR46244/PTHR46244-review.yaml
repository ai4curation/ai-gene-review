family_id: PANTHER:PTHR46244
family_name: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
functional_coherence: HETEROGENEOUS
preferred_name: PTS enzyme-I proteins and fused multiphosphoryl relays
summary: 'PEP-dependent PTS enzyme-I proteins initiate histidine phosphorylation. Their physiological
  partners and architectures differ: standalone sugar-PTS enzyme I transfers phosphate to a separate HPr,
  nitrogen-regulatory EI-Ntr acts with NPr, and fused FruB proteins combine enzyme-I, HPr and fructose-specific
  EIIA regions. A common enzyme-I family or subfamily assignment does not establish a complete fused fructose
  relay.'
coherence_reason: 'Heterogeneous for physiological output and the fused-fructose role: SF6 contains both
  standalone PtsI and fused FruB, while SF1 contains nitrogen-regulatory PtsP. This does not challenge
  the common PEP-dependent entry chemistry or infer that a short PAINT donor list is weak evidence.'
