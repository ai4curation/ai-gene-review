  description: 'Enzyme I(Ntr) (PtsP): E. coli PtsP (P37177), Salmonella PtsP (P37178) and Pseudomonas
    putida KT2440 PtsP (Q88CN5). GAF-domain enzyme I paralogues that phosphorylate NPr, the entry step
    of the nitrogen-regulatory PTS. This is the subfamily used to select the entry step of the bacterial
    nitrogen-regulatory PTS module. Nitrogen-regulatory enzyme I transfers phosphate to NPr and is not
    by itself a fused FruB transport relay. A regulatory PTS may cross-talk with transport without replacing
    every transport component.'
