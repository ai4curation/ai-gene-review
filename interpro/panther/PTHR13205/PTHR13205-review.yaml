  scope: UNRESOLVED
  scope_reason: Direct yeast and human experiments establish dolichol kinase activity, and curated pombe
    orthology supports its transfer to Sec59. Other polyprenol kinase branches and substrates must be
    distinguished rather than inferred from a broad membrane-kinase fold. The complete set of substrate-specific
    branches is not asserted.
