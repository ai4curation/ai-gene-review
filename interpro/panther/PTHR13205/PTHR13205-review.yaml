family_id: PANTHER:PTHR13205
family_name: TRANSMEMBRANE PROTEIN 15-RELATED
preferred_name: Polyprenol kinases including dolichol kinase
summary: Dolichol kinases phosphorylate the polyprenol carrier used in protein glycosylation and GPI-anchor
  synthesis, using CTP as donor. The integrated InterPro group also includes plant phytol kinases involved
  in tocopherol biosynthesis. The lipid substrate and metabolic pathway therefore need to be resolved
  independently of the shared membrane-associated kinase architecture.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Yeast sec59 mutant complementation with human DOLK and biochemical assays establish
  CTP-dependent dolichol phosphorylation while distinguishing it from diacylglycerol kinase. The pombe
  assignment is a curated ortholog inference to this experimentally grounded enzyme. The integrated polyprenol-kinase
  group includes other lipid substrates, so its wider structural definition is not a universal dolichol-specific
  grant.
