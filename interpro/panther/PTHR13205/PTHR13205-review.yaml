notes: Dolichyl phosphate production supplies glycosylation pathways upstream; Sec59 itself does not transfer
  mannose or attach GPI anchors. The separate CTP-dependent diacylglycerol kinase activity is explicitly
  distinguished by the primary biochemical study.
