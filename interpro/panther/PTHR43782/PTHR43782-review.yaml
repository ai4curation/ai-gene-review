- node_id: PANTHER:PTN000144386
  asserted_term:
    id: GO:0000050
    label: urea cycle
  paint_snapshot: '20250904'
  seeds:
  - id: SGD:S000006032
    label: CAR1
    organism: Saccharomyces cerevisiae
  - id: PomBase:SPBP26C9.02c
    label: car1
    organism: Schizosaccharomyces pombe
  - id: RGD:2150
    label: Arg1
    organism: Rattus norvegicus
  - id: UniProtKB:Q8I384
    label: ARG
    organism: Plasmodium falciparum
  - id: UniProtKB:C4LSS0
    label: ARG
    organism: Entamoeba histolytica
  assessment: UNRESOLVED
  assessment_reason: >-
    The root placement follows the seeds: SGD (IDA, IMP) and PomBase (IGI) both annotate their
    fungal arginases to urea cycle, and protist arginases are seeds too. The term therefore
    reaches ARG2, bacterial RocF and every fungal member. The ARG1 review accepts it, since
    ARG1 performs the terminal step of the hepatic urea cycle. The CAR1 review changes every
    CAR1 urea-cycle annotation, including this IBA, to L-arginine catabolic process, because
    S. cerevisiae is not ureotelic. PomBase's own literature, however, describes the fission yeast
    arginases as urea-cycle enzymes. Whether GO:0000050 should mean the ureotelic hepatic cycle
    (then the node is too deep) or the arginine/ornithine reaction loop in any organism with
    arginase (then it is sound) is a convention question for GO, not a phylogenetic one.
  supported_by:
  - reference_id: PMID:3540966
    supporting_text: Arginase (EC 3.5.3.1) catalyzes the last step of the urea cycle in the liver of ureotelic
      animals.
  - reference_id: PMID:20435771
    supporting_text: These results indicate that the biosynthesis of ornithine from glutamate can sustain both
      ferrichrome production and cell survival without any ornithine supply from the arginases of the urea
      cycle.
