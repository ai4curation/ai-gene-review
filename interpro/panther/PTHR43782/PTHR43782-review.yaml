notes: >-
  Node reach was read from the PAINT UniProt GAF: PTN000144386 reaches all subfamilies;
  PTN000144387 (cytosol) reaches ARG1 and SF3 but not ARG2; PTN002886720 (ARG2) adds
  mitochondrion and GO:0032720 and negates cytosol and nucleus. The CAR1 review says its
  urea-cycle MODIFY is consistent with the ARG1 review of the same node, but the ARG1 review
  accepts urea cycle (correctly, for ARG1); the two reviews agree only once the term is scoped
  to SF2. The fission yeast car1 and aru1 reviews are still stubs. The urea cycle module lists ARG2
  as a representative of the ARG1 annoton while stating that ARG2 does not substitute for hepatic
  ureagenesis. No residue sites asserted.
