family_id: PANTHER:PTHR43782
family_name: ARGINASE
preferred_name: Arginases (ARG1, ARG2, fungal CAR1/car1/aru1, bacterial RocF)
summary: >-
  Binuclear manganese metalloenzymes of the ureohydrolase superfamily that hydrolyse L-arginine
  to L-ornithine and urea. The family contains the vertebrate cytosolic hepatic arginase ARG1
  (SF2) and mitochondrial extrahepatic ARG2 (SF4), and a broad SF3 with fungal (S. cerevisiae
  CAR1, S. pombe car1 and aru1, Aspergillus agaA, Neurospora aga-1), bacterial (Bacillus RocF,
  Staphylococcus Arg, Brucella and Agrobacterium ArcB/ArcA) and protist (Plasmodium, Entamoeba)
  arginases. Agmatinases and other ureohydrolases are in separate PANTHER families. S. cerevisiae
  CAR1 also binds and inhibits ARG3 ornithine carbamoyltransferase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Arginase activity and manganese binding are shared by every characterized member, and the
  family contains no known non-arginase subfamily. Members diverge in location and process. ARG1
  and the fungal enzymes are cytosolic, ARG2 is mitochondrial. ARG1 serves the hepatic urea
  cycle; ARG2, the fungal enzymes and the bacterial enzymes act in arginine catabolism and
  ornithine supply. SF3 also contains a Streptomyces N(omega)-hydroxy-L-arginine
  amidinohydrolase (DcsB, D2Z025) of D-cycloserine biosynthesis, a substrate-diverged member.
