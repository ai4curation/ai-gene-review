  assessment: SOUND
  assessment_reason: >-
    Root node of the family, seeded by Salmonella and E. coli EutC. EutC is an
    obligate subunit of the alpha6-beta6 EutB/EutC enzyme in every
    characterized member; the E. coli complex is defined by purification and
    crystal structures. PAINT places no catalytic activity on this node, which is
    correct: the active site lies in EutB, so EutC only contributes to
    ethanolamine ammonia-lyase activity.
  supported_by:
  - reference_id: file:interpro/panther/PTHR39330/PTHR39330-paint.tsv
    supporting_text: "PTHR39330\tPTN002217404\tGO:0009350\tC\tIBD\tfalse\tUniProtKB:P19265|UniProtKB:P19636"
  - reference_id: PMID:19762342
    supporting_text: >-
      The eutB and eutC genes in the eut operon encoded the large and small
      subunits of the enzyme, respectively. The enzyme existed as the
      heterododecamer alpha(6)beta(6).
term_assessments:
- assessed_term:
    id: GO:0009350
    label: ethanolamine ammonia-lyase complex
  scope: FAMILY_WIDE
  scope_reason: Ancestral at the family root; every member is the EAL small subunit.
  supported_by:
  - reference_id: file:interpro/panther/PTHR39330/PTHR39330-paint.tsv
    supporting_text: "PTHR39330\tPTN002217404\tGO:0009350\tC\tIBD\tfalse"
- assessed_term:
    id: GO:0008851
    label: ethanolamine ammonia-lyase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    True of every member, but with the relation contributes_to: EutC is the
    non-catalytic small subunit, and the active site is in the EutB barrel.
    Electronic and experimental rows that annotate EutC with `enables` carry a
    wrong qualifier, recorded as source defects in the E. coli and KT2440 gene
    reviews.
  supported_by:
  - reference_id: PMID:20519496
    supporting_text: >-
      The active site is in the (beta/alpha)(8) barrel of the alpha-subunit;
      the beta-subunit covers the lower part of the cobalamin that is bound in
      the interface of the alpha- and beta-subunits.
- assessed_term:
    id: GO:0031419
    label: cobalamin binding
  scope: FAMILY_WIDE
  scope_reason: >-
    Not asserted by PAINT, but the E. coli member has experimentally defined
    adenosylcobalamin-contact residues, and the cofactor is bound at the
    EutB/EutC interface with direct contacts from both subunits.
  supported_by:
  - reference_id: file:genes/ECOLI/eutC/eutC-uniprot.txt
    supporting_text: >-
      Note=Binds 1 AdoCbl between the large and small subunits, with 6
      cofactors per holoenzyme.
- assessed_term:
    id: GO:0031471
    label: ethanolamine degradation polyhedral organelle
  scope: UNRESOLVED
  scope_reason: >-
    The microcompartment location (transferred by HAMAP/UniRule, not PAINT)
    depends on whether the genome encodes Eut shell proteins, not on the EutC
    sequence, so it is not a family property. Members from shell-less genomes
    such as P. putida KT2440 (Q88QF2, whose proteome encodes no BMC or EutN/CcmL
    shell protein) cannot be encapsulated, and that review removes the term. For
    enterobacterial members the EutC N-terminal peptide targets cargo into Eut
    compartments, but a genetic model places native EutBC outside the shell, so
    the E. coli review keeps the term as non-core.
  supported_by:
  - reference_id: PMID:27450681
    supporting_text: >-
      the signal sequence EutC1-19 targets cargo to the interior of
      nanocompartments via a hydrophobic interaction with a helix on shell
      protein EutS
  - reference_id: PMID:23585538
    supporting_text: >-
      The model predicts that EutBC (ethanolamine-ammonia lyase) lies outside
      the compartment, using external coenzyme B12 and injecting its product,
      acetaldehyde, into the lumen
  - reference_id: file:genes/PSEPK/eutC/eutC-bioinformatics/RESULTS.md
    supporting_text: >-
      KT2440 encodes no BMC-domain or EutN/CcmL-domain protein anywhere in its reference
      proteome, while the same queries recover the complete E. coli Eut shell set.
