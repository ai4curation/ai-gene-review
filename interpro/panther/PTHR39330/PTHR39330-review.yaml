family_id: PANTHER:PTHR39330
family_name: ETHANOLAMINE AMMONIA-LYASE LIGHT CHAIN
preferred_name: Ethanolamine ammonia-lyase small (beta) subunit EutC family
summary: >-
  Small (beta) subunit, EutC, of adenosylcobalamin (coenzyme B12)-dependent
  ethanolamine ammonia-lyase (EAL, EC 4.3.1.7), which deaminates ethanolamine to
  acetaldehyde and ammonium in the first step of bacterial ethanolamine
  utilization. EutC pairs with the catalytic large subunit EutB (PANTHER
  PTHR39329) to form the alpha6-beta6 holoenzyme. EutC has no active site of its
  own: the catalytic barrel is in EutB, and EutC covers the lower face of the
  cobalamin bound at the subunit interface, contributing direct cofactor
  contacts. In enterobacterial members the N-terminal segment, which is
  dispensable for catalysis, acts as a signal that targets cargo to the Eut
  microcompartment via the shell protein EutS; members from shell-less eut loci,
  such as Pseudomonas putida KT2440 EutC, act in the cytoplasm.
functional_coherence: COHERENT
coherence_reason: >-
  The family has a single subfamily, PTHR39330:SF1. All 75 cached reviewed members
  (Escherichia, Salmonella, Shigella, Pseudomonas, Listeria, Clostridium,
  Xanthomonas and other Gram-negative and Gram-positive genera; 242 to 303
  residues) are named ethanolamine ammonia-lyase small subunit, and the single
  PAINT assertion sits on the family root node.
