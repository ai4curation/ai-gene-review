  description: >-
    49 of its 61 reviewed members are PqqE, but the subfamily also holds the
    mycofactocin maturase MftC, the pre-heme d1 synthase NirJ, the
    Fe-coproporphyrin III synthase AhbC, SkfB, AlbA and a GMGT synthase. PqqA
    peptide cyclase activity is therefore a property of the PqqE clade, which
    InterPro IPR011843 and NCBIfam TIGR02109 recognize specifically.
