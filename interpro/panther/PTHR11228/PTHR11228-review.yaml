family_id: PANTHER:PTHR11228
family_name: RADICAL SAM DOMAIN PROTEIN
preferred_name: SPASM-domain radical SAM peptide- and cofactor-modifying enzymes
summary: >-
  PTHR11228 is a large family of radical S-adenosylmethionine (SAM) enzymes, most
  with a C-terminal SPASM domain carrying auxiliary iron-sulfur clusters. Members
  modify peptides, proteins or tetrapyrroles: PqqE cross-links the glutamate and
  tyrosine of the PQQ precursor peptide PqqA, MftC modifies the mycofactocin
  precursor, SkfB and AlbA mature sporulation-killing factor and subtilosin, NirJ
  and AhbC act in heme d1 and alternative heme biosynthesis, and further members
  make GMGT lipids or modify tungsten-enzyme cofactors. PANTHER places PqqE,
  MftC, NirJ, AhbC, SkfB and AlbA together in subfamily SF7, named PQQA PEPTIDE
  CYCLASE after its most numerous members, so the subfamily is not functionally
  uniform. The PqqE enzymes of M. extorquens AM1 and P. putida KT2440 are SF7
  members; AM1 PqqE was shown to need PqqD and a flavodoxin reducing system to
  form the PqqA cross-link.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Shared radical SAM chemistry with SPASM auxiliary clusters, but distinct
  substrates and products across PqqE, MftC, SkfB/AlbA, NirJ, AhbC and other
  members, several of them within the same PANTHER subfamily.
