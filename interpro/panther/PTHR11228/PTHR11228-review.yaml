    id: GO:0009975
    label: cyclase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The PqqA Glu-Tyr cross-link (EC 1.21.98.4, RHEA:56836) is shown for AM1 PqqE
    and conserved in the PqqE clade, which is only part of SF7; MftC, NirJ, AhbC,
    SkfB and AlbA in the same subfamily catalyze other reactions. The PQQ module
    therefore grounds PqqE on InterPro IPR011843, not on this family or subfamily.
  applicable_subfamilies:
