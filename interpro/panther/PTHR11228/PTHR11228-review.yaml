node_assessments:
- node_id: PANTHER:PTN000132400
  asserted_term:
    id: GO:0006783
    label: heme biosynthetic process
  node_taxon:
    id: NCBITaxon:2157
    label: Archaea
  evidence: IBD
  paint_snapshot: '20180619'
  seeds:
  - id: UniProtKB:G3XD10
  assessment: WRONG_NODE
  assessment_reason: >-
    The only seed is P. aeruginosa NirJ, a pre-heme d1 synthase for which the term
    is right. The node is an archaeal SPASM clade of 15 leaves; apart from NirJ they
    are Korarchaeum, Sulfolobus, Pyrobaculum, Methanosarcina and Halobacterium
    radical SAM proteins, several annotated as PqqE-like or as tungsten-enzyme
    cofactor-modifying proteins, with no shown role in heme synthesis. The KT2440
    and AM1 PqqE enzymes are not leaves of this node. The P. aeruginosa NirJ gene
    review reaches the same conclusion. Recommended fix: move the IBD to the NirJ
    (and, if supported, AhbC) clades.
