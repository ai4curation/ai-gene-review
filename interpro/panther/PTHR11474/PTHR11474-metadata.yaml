  name:
    name: Tyrosinase and Hemocyanin
    short: Tyrosinase/Hemocyanin
  description:
  - text: The Tyrosinase family includes copper-containing oxidases involved in pigment
      formation, such as melanins and other polyphenolic compounds. Members catalyze
      the hydroxylation of tyrosine to DOPA and the oxidation of DOPA to DOPA-quinone,
      which are key steps in melanin biosynthesis. Some family members also function
      in the oxidation of mono- and o-diphenols to o-diquinones, contributing to defense
      mechanisms against various stress factors. Additionally, the family encompasses
      hemocyanins, which are oxygen carriers in mollusks and arthropods. The family's
      diverse roles reflect its involvement in pigmentation, defense, and oxygen transport.
