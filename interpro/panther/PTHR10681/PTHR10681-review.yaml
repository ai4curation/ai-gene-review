family_id: PANTHER:PTHR10681
family_name: THIOREDOXIN PEROXIDASE
preferred_name: Typical 2-Cys peroxiredoxin family (AhpC/TSA/PRDX1-4)
summary: >-
  Typical 2-Cys peroxiredoxins reduce hydrogen peroxide, alkyl hydroperoxides and peroxynitrite with
  a peroxidatic and an intersubunit resolving cysteine, and are recycled by thioredoxin (or AhpF
  in bacteria). Several eukaryotic members switch to a chaperone function on hyperoxidation. The
  family contains bacterial AhpC, S. cerevisiae TSA1/TSA2, S. pombe tpx1, mitochondrial PRDX3-type
  enzymes, and human PRDX1, PRDX2 and PRDX4.
functional_coherence: COHERENT
coherence_reason: >-
  All subfamilies are typical 2-Cys peroxiredoxins; they differ in compartment (cytosol, mitochondria,
  ER for PRDX4) and reductant.
