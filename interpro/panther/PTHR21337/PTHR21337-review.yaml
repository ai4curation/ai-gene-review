family_id: PANTHER:PTHR21337
family_name: PHOSPHO-2-DEHYDRO-3-DEOXYHEPTONATE ALDOLASE 1, 2
preferred_name: Type II DAHP synthases (plant DHS, actinobacterial AroG/AroH, PhzC)
summary: >-
  Type II 3-deoxy-D-arabino-heptulosonate 7-phosphate (DAHP) synthases. They catalyse the same
  first committed shikimate-pathway reaction as the type I enzymes of PTHR21225 and share their
  (beta/alpha)8-barrel core and active-site arrangement, but have almost no sequence identity
  and different regulatory decorations and oligomeric states. Members include the plastid DAHP
  synthases of land plants (Arabidopsis DHS1 and DHS2, potato SHKA/SHKB, tobacco, rice, Petunia),
  diatom homologs, actinobacterial enzymes (Mycobacterium tuberculosis AroG, Streptomyces
  coelicolor AroH), the Pseudomonas phenazine-cluster PhzC proteins, Neurospora aro-8, and
  P. putida AroH (PP_1866).
functional_coherence: COHERENT
coherence_reason: >-
  DAHP synthase activity is shared by all characterized members and PAINT places it at the
  family root (PTN000481914) with a plant seed (DHS1) and a bacterial seed (M. tuberculosis
  AroG). The chloroplast localization is a property of the photosynthetic-eukaryote clade only.
  Some bacterial members (Pseudomonas PhzC) are encoded in secondary-metabolite gene clusters;
  their physiological role was not examined here and no term assessed below depends on it.
  SF0 is a mixed default subfamily containing bacterial, fungal and plant members.
