notes: >-
  Used by modules/bacterial_shikimate_chorismate_biosynthesis.yaml (DAHP synthase step,
  pthr21337_dahp_synthase_variant) with the family-level selector PANTHER:PTHR21337 and
  GO:0003849; that selector is safe. The module labels the family "PHOSPHO-2-DEHYDRO-3-DEOXYHEPTONATE
  ALDOLASE 1, 2", which matches PANTHER's official family name. Topology from the PANTHER 19
  treeinfo service filtered to model organisms: root PTN000481914 (LUCA) holds Neurospora aro-8,
  an Actinomycetales node (M. tuberculosis AroG, S. coelicolor AroH and SCO3210) and the
  SAR/HA_supergroup node PTN008369313 (Thalassiosira, rice and Arabidopsis paralogs). The only
  member with an in-repo gene review is P. putida AroH (Q88LR3, SF0), which is not in the PAINT
  UniProt GAF and receives no IBA; its review takes GO:0003849 and GO:0009423 as core, consistent
  with this review.
