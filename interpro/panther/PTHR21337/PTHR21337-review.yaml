term_assessments:
- assessed_term:
    id: GO:0003849
    label: 3-deoxy-7-phosphoheptulonate synthase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The family-defining reaction. This is the activity the shikimate module asserts for the
    PTHR21337 implementation of the DAHP synthase step (represented by P. putida AroH).
  supported_by:
  - reference_id: PMID:16288916
    supporting_text: indicate a common ancestry for the type I and type II DAH7PSs, despite their
      minimal sequence identity
- assessed_term:
    id: GO:0009423
    label: chorismate biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    DAHP is the first committed intermediate of the shikimate pathway, so a DAHP synthase
    contributes to chorismate synthesis wherever it acts; in M. tuberculosis the pathway is
    essential. PAINT asserts the process
    only for the plant/diatom node PTN008369313, which is narrower than this scope.
  supported_by:
  - reference_id: PMID:16288916
    supporting_text: The shikimate pathway, responsible for the biosynthesis of aromatic compounds,
      is essential for the growth of Mycobacterium tuberculosis
- assessed_term:
    id: GO:0009507
    label: chloroplast
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Only the plant and algal members are plastidic. The plant-only subfamilies are listed; SF0 is
    not, because it mixes plant plastid enzymes with bacterial and fungal ones. Apply via the
    PTN008369313 node rather than by subfamily.
