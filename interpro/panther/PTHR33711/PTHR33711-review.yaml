family_id: PANTHER:PTHR33711
family_name: DIOXYGENASE, PUTATIVE (AFU_ORTHOLOGUE AFUA_2G02910)-RELATED
preferred_name: Intradiol ring-cleavage dioxygenase family
summary: >-
  Non-heme Fe(III) intradiol ring-cleavage dioxygenases, which open
  catechol-type rings between the two hydroxylated carbons using both atoms of
  O2. The family spans bacterial catechol 1,2-dioxygenases (CatA) of the
  catechol branch of the beta-ketoadipate pathway, chlorocatechol and
  hydroxyquinol 1,2-dioxygenases of modified ortho-cleavage pathways, fungal
  catechol/hydroxyquinol dioxygenases (e.g. Candida albicans HQD2, Aspergillus
  PrcA), and both subunits of the heteromeric protocatechuate 3,4-dioxygenase
  (PcaG alpha, PcaH beta). It also contains uncharacterised eukaryotic and
  bacterial intradiol-domain proteins. The CatA-type 1,2-dioxygenases are
  homodimers with one Fe(III) per subunit and an N-terminal helical-zipper
  domain, whereas protocatechuate 3,4-dioxygenases assemble (alpha beta Fe)n
  oligomers in which each active site is built at a subunit interface.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The ring-cleavage dioxygenase chemistry and Fe(III) cofactor are shared by
  every characterised member, so the broad dioxygenase term is safe. Substrate
  specificity is not: SF7 mixes catechol, chlorocatechol and hydroxyquinol
  1,2-dioxygenases, SF9/SF10 are the two subunits of protocatechuate
  3,4-dioxygenase (the alpha subunit only contributes to the active site), and
  several eukaryotic SF10/SF11 members are uncharacterised.
