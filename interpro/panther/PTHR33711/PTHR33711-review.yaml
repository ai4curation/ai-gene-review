  description: >-
    Protocatechuate 3,4-dioxygenase beta subunits (PcaH), which carry the
    Fe(III) ligands, plus uncharacterised eukaryotic (plant, algal,
    cephalochordate) and Rickettsia intradiol-domain proteins.
  representative_members:
