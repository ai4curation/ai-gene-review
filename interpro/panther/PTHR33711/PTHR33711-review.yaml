- node_id: PANTHER:PTN002135486
  asserted_term:
    id: GO:0051213
    label: dioxygenase activity
  evidence: IBD
  paint_snapshot: '20250904'
  seeds:
  - id: CGD:CAL0000188195
    label: Catechol 1,2-dioxygenase
    organism: Candida albicans
  assessment: SOUND
  assessment_reason: >-
    PTN002135486 is the root (LUCA) node of the PANTHER 19 tree and covers all
    five subfamilies. Every characterised member is an Fe(III) intradiol
    ring-cleavage dioxygenase (catechol, chlorocatechol and hydroxyquinol
    1,2-dioxygenases in SF7; protocatechuate 3,4-dioxygenase subunits in
    SF9/SF10; fungal PrcA in SF5), so the broad term is a safe family-wide
    inheritance. Caveats that do not require pruning: PcaG-type alpha chains
    (SF9) contribute to the activity only within the alpha-beta enzyme, and the
    uncharacterised eukaryotic SF10/SF11 members inherit only this broad term.
    No reviewed gene in this corpus currently carries an IBA from this node.
  supported_by:
