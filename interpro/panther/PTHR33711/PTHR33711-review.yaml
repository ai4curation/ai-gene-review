- assessed_term:
    id: GO:0018576
    label: catechol 1,2-dioxygenase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Catechol 1,2-dioxygenases occur only in SF7, so the term must not descend
    to SF5, SF9, SF10 or SF11. SF7 membership is necessary but not sufficient:
    SF7 also holds hydroxyquinol 1,2-dioxygenases (e.g. Corynebacterium
    glutamicum Q8NL92) and chlorocatechol 1,2-dioxygenases, so a member is
    assigned the term on its own evidence or on CatA clade membership (NCBIfam
    TIGR02439 proteobacterial, TIGR02438 actinobacterial), as for the reviewed
    ADP1, KT2440 and R. opacus 1CP CatA proteins.
  applicable_subfamilies:
