- subfamily_id: PANTHER:PTHR33711:SF9
  label: PROTOCATECHUATE 3,4-DIOXYGENASE ALPHA CHAIN
  description: >-
    Alpha subunits of protocatechuate 3,4-dioxygenase (PcaG). The alpha chain
    contributes to the interface active site of the alpha-beta enzyme rather
    than carrying a complete active site itself.
  representative_members:
  - id: UniProtKB:Q88E13
