  name:
    name: Phosphotransferase System Sugar-Specific Components
    short: PTS_Sugar-Specific_Components
  description:
  - text: 'The Phosphoenolpyruvate-dependent Sugar Phosphotransferase System (PTS)
      is a major carbohydrate active transport system that catalyzes the phosphorylation
      of incoming sugar substrates concomitantly with their translocation across the
      cell membrane. The PTS is involved in the transport of various sugars including
      beta-glucosides, sucrose, trehalose, N-acetylmuramic acid, and MurNAc-GlcNAc.
      It consists of multiple domains: EIIC forms the translocation channel with a
      substrate-binding site; EIIB is phosphorylated by phospho-EIIA on a cysteinyl
      or histidyl residue, depending on the sugar, and transfers the phosphoryl group
      to the sugar substrate; EIIA is phosphorylated by phospho-HPr on a histidyl
      residue and transfers the phosphoryl group to EIIB. The system plays a key role
      in the uptake and phosphorylation of sugars, facilitating their utilization
      as carbon and energy sources, and is involved in the regulation of various cellular
      processes.'
