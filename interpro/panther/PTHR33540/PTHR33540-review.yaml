family_id: PANTHER:PTHR33540
family_name: TRNA THREONYLCARBAMOYLADENOSINE BIOSYNTHESIS PROTEIN TSAE
preferred_name: ASKHA-fold ATPases splitting into TsaE (t6A biosynthesis) and AmgK (anomeric MurNAc/GlcNAc kinase) subfamilies
summary: >-
  A small family of ASKHA/actin-like nucleotide-binding-fold proteins that
  PANTHER names after its dominant member, TsaE. The family holds two
  functionally unrelated groups. SF2 (TsaE) is the accessory ATPase of the
  universal tRNA N6-threonylcarbamoyladenosine (t6A37) modification system,
  acting with TsaB, TsaC and TsaD. SF1 (AmgK) is the anomeric sugar kinase of the
  Pseudomonas-type peptidoglycan recycling shortcut: it phosphorylates the C1
  (anomeric) hydroxyl of N-acetylmuramate and N-acetylglucosamine to give the
  alpha-1-phosphates, the substrates that MurU converts to UDP-MurNAc, bypassing
  de novo synthesis. The two subfamilies share only the nucleotide-binding fold;
  their biological roles do not overlap.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  SF2 (TsaE) proteins are ATPases of the t6A tRNA-modification machinery
  (GO:0002949), whereas SF1 (AmgK) proteins are anomeric MurNAc/GlcNAc kinases of
  peptidoglycan recycling (GO:0019200). The PANTHER family name reflects only the
  TsaE group; neither function is safe across the whole family.
