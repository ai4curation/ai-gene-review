    exemplified by P. putida KT2440 AmgK (Q88QT3). Phosphorylate the C1 hydroxyl
    of MurNAc/GlcNAc to the alpha-1-phosphate.
  representative_members:
  - id: UniProtKB:Q88QT3
    label: N-acetylmuramate/N-acetylglucosamine kinase
    gene_symbol: amgK
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/amgK/amgK-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    AmgK carries no role in t6A tRNA modification (the function of the family's
    dominant TsaE members). It is an anomeric sugar kinase that acts in
    peptidoglycan recycling, phosphorylating MurNAc/GlcNAc at C1; it does not
    inherit the TsaE node (PTN002128764) and carries none of its terms.
  supported_by:
