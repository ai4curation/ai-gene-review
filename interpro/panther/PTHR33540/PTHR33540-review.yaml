notes: >-
  Written for the peptidoglycan_recycling module, whose AmgK step is grounded on
  SF1 with P. putida KT2440 AmgK (Q88QT3) as representative. The PANTHER family
  name is dominated by TsaE (SF2), a wholly unrelated t6A-modification ATPase;
  the AmgK kinase function is scoped SUBFAMILY_ONLY to SF1 and the TsaE
  t6A-modification function to SF2. The only PTHR33540 gene in this repository is
  P. putida AmgK (SF1), which carries the SF1-scoped kinase term and none of the
  TsaE terms.
