    supporting_text: ATP-dependent phosphorylation
- subfamily_id: PANTHER:PTHR33540:SF2
  label: TRNA THREONYLCARBAMOYLADENOSINE BIOSYNTHESIS PROTEIN TSAE
  description: >-
    The TsaE ATPases of the t6A37 tRNA-modification system, exemplified by
    E. coli TsaE (P0AF67) and B. subtilis TsaE (O05515); the dominant group the
    family is named for. Not grounded with a gene review here.
  diverged_from_family: false
