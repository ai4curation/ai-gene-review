family_id: PANTHER:PTHR42923
family_name: PROTOPORPHYRINOGEN OXIDASE
preferred_name: Protoporphyrinogen oxidase / carotenoid desaturase family (amine oxidase superfamily)
summary: >-
  FAD-dependent oxidases of the amine oxidase/PPOX fold. Protoporphyrinogen oxidase (S. cerevisiae
  HEM14, S. pombe hem14, human PPOX, plant PPXI/PPXII) makes protoporphyrin IX in heme and chlorophyll
  synthesis. Plant and cyanobacterial phytoene desaturase (PDS) and zeta-carotene desaturase (ZDS)
  desaturate carotenoid backbones. Other members include carotenoid-pathway oxidases such as CrtU.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrates differ by subfamily: protoporphyrinogen (SF3, SF44), phytoene (SF45), zeta-carotene
  (SF41) and other carotenoids.
