notes: >-
  PTHR11304 (EPHRIN) is a functionally coherent eumetazoan ligand family rooted at
  PTN000885159 (Eumetazoa). PAINT already places IBDs for GO:0048013 (ephrin receptor
  signaling pathway), GO:0005886 (plasma membrane), GO:0007411 (axon guidance), and
  GO:0046875 (ephrin receptor binding) at PTN000885159, but does not assert GO:0048018
  (receptor ligand activity) at that node. Because GO:0046875 is a binding term rather
  than a child of GO:0048018, ephrins in species that rely on PAINT IBA for molecular
  function (including Drosophila Ephrin and several zebrafish ephrins) are annotated
  to GO:0048013 without a ligand-activity MF.
