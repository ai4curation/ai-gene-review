family_id: PANTHER:PTHR11304
family_name: EPHRIN
preferred_name: Ephrins (membrane-tethered Eph receptor ligands, ephrin-A and ephrin-B subclasses)
summary: >-
  Eumetazoan family of membrane-anchored receptor ligands that bind and activate Eph
  receptor tyrosine kinases across cell-cell contacts. Members share an extracellular
  cupredoxin-like Eph receptor-binding domain (RBD) and fall into two structural
  subclasses in vertebrates: glycosylphosphatidylinositol (GPI)-anchored ephrin-A
  ligands (EFNA1-EFNA5, preferentially engaging EphA receptors) and single-pass type I
  transmembrane ephrin-B ligands (EFNB1-EFNB3, preferentially engaging EphB receptors
  and capable of reverse intracellular signaling via their conserved cytoplasmic tail
  and PDZ-binding motif), alongside invertebrate ephrins such as Drosophila Ephrin and
  Caenorhabditis elegans EFN-1 to EFN-4.
functional_coherence: COHERENT
