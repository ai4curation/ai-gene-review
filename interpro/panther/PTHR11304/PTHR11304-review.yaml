term_assessments:
  - assessed_term:
      id: GO:0048018
      label: receptor ligand activity
    scope: FAMILY_WIDE
    scope_reason: >-
      All members of PTHR11304 are membrane-tethered receptor ligands (ephrins) that
      engage and activate Eph receptor tyrosine kinases at sites of cell-cell contact.
    supported_by:
      - reference_id: PMID:26790531
        supporting_text: Eph receptor Tyr kinases and their membrane-tethered ligands, the ephrins, elicit short-distance cell-cell signalling and thus regulate many developmental processes at the interface between pattern formation and morphogenesis, including cell sorting and positioning, and the formation of segmented structures and ordered neural maps.
      - reference_id: PMID:7973638
        supporting_text: A family of cell surface-bound ligands exhibiting distinct, but overlapping, specificities for these EPH-related kinases was identified.
  - assessed_term:
      id: GO:0048013
      label: ephrin receptor signaling pathway
    scope: FAMILY_WIDE
    scope_reason: >-
      Every ephrin initiates the ephrin receptor signaling pathway by binding and
      clustering Eph receptors across cell-cell contacts.
    supported_by:
      - reference_id: PMID:15928710
        supporting_text: Eph receptor tyrosine kinases mould the behaviour of many cell types by binding membrane-anchored ligands, ephrins, at sites of cell-cell contact.
      - reference_id: PMID:8798744
        supporting_text: Membrane-bound and soluble forms of LERK-2 were demonstrated to signal through HEK2 as judged by receptor phosphorylation.
  - assessed_term:
      id: GO:0046875
      label: ephrin receptor binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Direct binding to Eph receptors via the extracellular cupredoxin-like RBD is
      shared across the family; under GO ligand conventions, the effector molecular
      function on the ligand is GO:0048018 (receptor ligand activity), which has_part
      signaling receptor binding.
    supported_by:
      - reference_id: PMID:15928710
        supporting_text: Eph receptor tyrosine kinases mould the behaviour of many cell types by binding membrane-anchored ligands, ephrins, at sites of cell-cell contact.
  - assessed_term:
      id: GO:0005886
      label: plasma membrane
    scope: FAMILY_WIDE
    scope_reason: >-
      Ephrins are anchored to the plasma membrane either via a GPI anchor (ephrin-A)
      or a single-pass transmembrane helix (ephrin-B) and require membrane attachment
      or clustering for receptor activation.
    supported_by:
      - reference_id: PMID:7973638
        supporting_text: A family of cell surface-bound ligands exhibiting distinct, but overlapping, specificities for these EPH-related kinases was identified.
  - assessed_term:
      id: GO:0007411
      label: axon guidance
    scope: FAMILY_WIDE
    scope_reason: >-
      Conserved developmental process regulated by ephrin-Eph contact signaling across
      bilaterians.
    supported_by:
      - reference_id: PMID:15928710
        supporting_text: New models explain how quantitative variations in the densities and signalling abilities of Eph receptors and ephrins could account for the different effects that are elicited on axon guidance, cell adhesion and cell migration during development, homeostasis and disease.
