    label: 2-dehydro-3-deoxy-phosphogluconate aldolase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    KDPG cleavage is the defining activity of the Eda members (E. coli, Pseudomonas,
    Zymomonas) and is the grounding for the KDPG aldolase step of the
    entner_doudoroff_and_gluconeogenesis module. PANTHER has a single subfamily, so the
    galacto-specific DgoA branch is recorded as a member exception rather than by subfamily
    scope.
  member_exceptions:
  - member:
      id: UniProtKB:Q6BF16
      gene_symbol: dgoA
      organism: Escherichia coli K-12
    exception_reason: >-
      DgoA is the 2-dehydro-3-deoxy-6-phosphogalactonate aldolase of D-galactonate
      catabolism, the galacto-configured paralog, not a KDPG aldolase.
    supported_by:
    - reference_id: file:interpro/panther/PTHR30246/PTHR30246-entries.csv
      supporting_text: Q6BF16,2-dehydro-3-deoxy-6-phosphogalactonate aldolase
