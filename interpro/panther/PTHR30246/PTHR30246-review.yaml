family_id: PANTHER:PTHR30246
family_name: 2-KETO-3-DEOXY-6-PHOSPHOGLUCONATE ALDOLASE
preferred_name: KHG/KDPG class I aldolase family (Eda, DgoA, KdgA)
summary: >-
  PTHR30246 is the bacterial KHG/KDPG aldolase family (InterPro IPR000887, Pfam PF01081).
  Members are lysine-dependent class I aldolases with an alpha/beta (TIM) barrel fold that
  form trimers and cleave 2-keto-3-deoxy sugar acid phosphates by a Schiff-base mechanism.
  The family contains the Entner-Doudoroff KDPG aldolases (Eda) of Escherichia coli,
  Pseudomonas and Zymomonas, the Bacillus subtilis KdgA, and the E. coli DgoA
  2-dehydro-3-deoxy-6-phosphogalactonate aldolase of D-galactonate catabolism. E. coli Eda
  additionally cleaves 4-hydroxy-2-oxoglutarate (KHG). The aldol-cleavage chemistry is
  family-wide, while substrate stereospecificity (gluconate vs galactonate series) varies
  between branches that PANTHER does not split into subfamilies.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The 14 reviewed members all fall in the single subfamily PTHR30246:SF1. Ten are named
  KDPG or KHG/KDPG aldolase and one (E. coli DgoA) is the galacto-configured paralog. The
  shared aldehyde-lyase activity is coherent; the KDPG-specific activity excludes the DgoA
  branch.
