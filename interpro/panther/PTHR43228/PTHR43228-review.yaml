  asserted_term:
    id: GO:0101006
    label: protein histidine phosphatase activity
  evidence: IBD
  paint_snapshot: '20250919'
  seeds:
  - id: AGI_LocusCode:AT3G04280
    organism: Arabidopsis thaliana
  assessment: TOO_DEEP
  assessment_reason: >-
    The GO definition is "Catalysis of the reaction: protein histidine phosphate + H2O =
    protein histidine + phosphate." The only seed is Arabidopsis ARR22, yet the term sits
    at the family root and so reaches bacterial CheY, Spo0A and the other receivers.
    CheY's phosphatase chemistry is the hydrolysis of its own aspartyl phosphate, not of
    a phosphohistidine on another protein, and nothing supports phosphohistidine
    phosphatase activity outside the plant ARR22 lineage. The term should be restricted
    to the ARR22 clade; because SF1 holds both ARR22 and bacterial CheY, no subfamily can
    be named as affected.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43228/PTHR43228-paint.tsv
    supporting_text: "PTHR43228\tPTN001981629\tGO:0101006\tF\tIBD\tfalse\tAGI_LocusCode:AT3G04280\ttaxon:\t20250919"
