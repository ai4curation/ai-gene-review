- node_id: PANTHER:PTN001981629
  asserted_term:
    id: GO:0101006
    label: protein histidine phosphatase activity
  evidence: IBD
  paint_snapshot: '20250919'
  seeds:
  - id: AGI_LocusCode:AT3G04280
    organism: Arabidopsis thaliana
  assessment: UNRESOLVED
  assessment_reason: >-
    The asserted reaction is protein histidine phosphate + water to protein histidine and phosphate. The
    cached PAINT IBD is a judgment at the family root, experimentally grounded in ARR22; a single plant
    seed does not show that the function arose only within plants. The earlier TOO_DEEP verdict also treated
    CheY's phosphoaspartate intermediate as excluding a net histidine-phosphate hydrolysis reaction. That
    exclusion is not established: CheA transfers phosphate to CheY, which then dephosphorylates, while
    ARR22 removes phosphate from AHP proteins and depends on its conserved receiver aspartate. Receiver
    chemistry alone therefore cannot identify a plant-specific gain or a bacterial loss. The ARR22 primary
    assay paper is currently available here only as an abstract; the later full-text study supports the
    AHP sink role but does not establish a family-wide evolutionary boundary. The evidence does not yet
    distinguish when coupled phosphotransfer and autohydrolysis should be annotated with this net-reaction
    term, nor whether all descendant receivers satisfy its catalytic requirements. Retain the actual IBD
    and its seed, withdraw the proposed plant-only restriction, and leave the ancestral placement unresolved
    pending reaction-level comparison and PAINT curator clarification. No target-specific loss has been
    demonstrated. The physiological distinction matters: E. coli CheY carries the motor-output signal
    and hydrolyses its own Asp-phosphate to terminate that signal, whereas Sinorhizobium CheY1 is a dedicated
    sink receiving phosphate drained from CheY2 through CheA (PMID9485379, PMID22194454). The latter provides
    stronger biological grounding for a net histidine-phosphate drainage description. That asymmetry neither
    proves that the carrier cannot support net turnover nor establishes family-wide histidine-phosphatase
    catalysis. No additional node placement, member exception or family-wide reaction is inferred from
    it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR43228/PTHR43228-paint.tsv
    supporting_text: "PTHR43228\tPTN001981629\tGO:0101006\tF\tIBD\tfalse\tAGI_LocusCode:AT3G04280\ttaxon:\t\
