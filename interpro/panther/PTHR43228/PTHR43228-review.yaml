family_id: PANTHER:PTHR43228
family_name: TWO-COMPONENT RESPONSE REGULATOR
preferred_name: Single-domain CheY-like response regulator family (with plant ARR22-type and Spo0A regulators)
summary: >-
  A PANTHER family of receiver-domain response regulators. Its best-characterized members
  are the stand-alone chemotaxis response regulators CheY of E. coli, Salmonella and many
  other bacteria: CheY accepts a phosphoryl group from the CheA kinase on a conserved
  aspartate (Asp57 in E. coli), and phospho-CheY binds the FliM switch protein of the
  flagellar motor to promote clockwise rotation, before being dephosphorylated by its own
  autophosphatase activity and by CheZ. The family also contains the B. subtilis and
  Bacillus Spo0A sporulation master regulators (receiver plus DNA-binding output domain),
  B. subtilis GlnL, fungal stress response regulator Srr1, and plant response regulators
  including Arabidopsis ARR22/ARR24 and rice ORR41/ORR42, which act in cytokinin
  signalling.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Phospho-aspartate receiver activity (phosphorelay response regulator activity) is shared
  by every characterized member. Output function diverges by lineage: CheY binds the
  flagellar switch (SF1 bacterial members), Spo0A is a transcription factor (SF5), and the
  plant members act in cytokinin signalling. Subfamily SF1 is itself mixed, holding both
  bacterial CheY and Arabidopsis ARR22.
