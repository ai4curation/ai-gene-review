family_id: PANTHER:PTHR45790
family_name: SIROHEME SYNTHASE-RELATED
preferred_name: Uroporphyrinogen-III C-methyltransferase (SUMT/CysG) family
summary: >-
  Class III SAM-dependent tetrapyrrole methyltransferases. SUMT (S. cerevisiae MET1, bacterial CysG
  and CobA, plant UPM1) bismethylates uroporphyrinogen III to precorrin-2 for siroheme and cobalamin.
  SF4 holds CobM (cobalt-precorrin-4 C11-methyltransferase). Several basidiomycete members in SF3
  and SF6 (LedMA, PgiMA) are named as peptide alpha-N-methyltransferases, not SUMT.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Methylation targets differ: uroporphyrinogen III (SUMT), cobalt-precorrin-4 (CobM, SF4), and in
  some fungal members peptide backbones.
