family_id: PANTHER:PTHR31458
family_name: POLYGALACTURONASE 1 BETA-LIKE PROTEIN 2
preferred_name: Polygalacturonase-associated BURP proteins
summary: BURP-domain proteins in this group include polygalacturonase-associated noncatalytic subunits
  and related plant proteins. A BURP domain does not itself establish glycoside hydrolase activity or
  a conserved reproductive phenotype.
functional_coherence: HETEROGENEOUS
coherence_reason: The rice target has a signal peptide and BURP domain, consistent with a secreted protein.
  Pollen maturation needs gene-specific or well-resolved ortholog evidence; neither secretion nor a polygalacturonase-associated
  family name establishes it.
