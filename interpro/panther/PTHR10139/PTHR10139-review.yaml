term_assessments:
- assessed_term:
    id: GO:0004520
    label: DNA endonuclease activity
  scope: FAMILY_WIDE
  scope_reason: The conserved function represented by DNA endonuclease activity is the family core for
    intact members. Nuclease chemistry and DNA-end processing provide a defensible core, while repair-pathway
    usage, checkpoint outputs and meiotic phenotypes require the relevant organism and complex context.
    Exonuclease directionality and endonuclease activity must remain separate claims.
  supported_by:
  - reference_id: PMID:9651580
    supporting_text: 'We have investigated the enzymatic activities of the purified proteins

      and found that Mre11 by itself has 3'' to 5'' exonuclease activity that is

      increased when Mre11 is in a complex with Rad50. Mre11 also exhibits

      endonuclease activity, as shown by the asymmetric opening of DNA hairpin loops.'
  - reference_id: PMID:22705791
    supporting_text: 'To understand the functional

      architecture of MRN, we determined the crystal structures of the

      Schizosaccharomyces pombe Mre11 dimeric catalytic domain alone and in complex

      with a fragment of Nbs1.'
  - reference_id: PMID:19139281
    supporting_text: 'This study demonstrates

      for the first time that Mre11 (Schizosaccharomyces pombe Rad32(Mre11)) nuclease

      activity is required for the removal of Rec12(Spo11).'
  - reference_id: PMID:9705271
    supporting_text: 'We show that the Rad50-Mre11-p95 complex possesses

      manganese-dependent single-stranded DNA endonuclease and 3'' to 5'' exonuclease

      activities.'
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR10139-evidence.md
    supporting_text: Core component of the MRN complex, which plays a central role in double-strand break
      (DSB) repair, DNA recombination, maintenance of telomere integrity and meiosis (PubMed:15654094,
      PubMed:22705791, PubMed:23080121, PubMed:7885834). The MRN complex is involved in the repair of
      DNA double-strand breaks (DSBs) via homologous recombination (HR), an error-free mechanism which
      primarily occurs during S and G2 phases (By similarity). The complex (1) mediates the end resection
      of damaged DNA, which generates proper single-stranded DNA, a key initial steps in HR, and is (2)
      required for the recruitment of other repair factors and efficient activation of ATM and ATR upon
      DNA damage (By similarity). Within the MRN complex, rad32 possesses both single-strand endonuclease
      activity and double-strand-specific 3'-5' exonuclease activity (Probable) (PubMed:22705791). Rad32
      first endonucleolytically cleaves the 5' strand at DNA DSB ends to prevent non-homologous end joining
      (NHEJ) and licence HR (By similarity). It then generates a single-stranded DNA gap via 3' to 5'
      exonucleolytic degradation, which is required for single-strand invasion and recombination (By similarity)
