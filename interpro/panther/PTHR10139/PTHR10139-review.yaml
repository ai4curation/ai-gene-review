family_id: PANTHER:PTHR10139
family_name: DOUBLE-STRAND BREAK REPAIR PROTEIN MRE11
summary: Mre11/Rad32 proteins are DNA-end-processing nucleases that cooperate with Rad50-containing complexes
  in DNA repair. Their conserved nuclease functions are coupled to DNA-end recognition and organism-specific
  checkpoint and meiotic programs.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Purified Mre11 and human MRN experiments establish both endonuclease and 3-prime-to-5-prime
  exonuclease activities (PMID:9651580; PMID:9705271). Pombe structures establish the Mre11-Nbs1 interface,
  and pombe genetics demonstrate nuclease-dependent Rec12 removal (PMID:22705791; PMID:19139281). These
  support a conserved DNA-end-processing nuclease while separating catalytic chemistry from organism-specific
  checkpoint and meiotic outcomes.
