family_id: PANTHER:PTHR46208
family_name: MITOCHONDRIAL IMPORT RECEPTOR SUBUNIT TOM70
preferred_name: Tom70 import receptors and Acl4 ribosome-assembly chaperones
summary: >-
  PTHR46208 is an opisthokont tetratricopeptide-repeat family whose Tom70/Tom71
  members are mitochondrial outer-membrane import receptors in the TOM complex.
  A Saccharomycetaceae duplicate has diverged into Acl4, a soluble cytoplasmic
  and nuclear escort for ribosomal protein Rpl4, so TOM-receptor localization
  and mitochondrial protein-import terms should be pruned before the Acl4
  branch.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  PTHR46208:SF1 contains Tom70/Tom71 mitochondrial outer-membrane import
  receptors, whereas PTHR46208:SF2 contains the S. cerevisiae Acl4 Rpl4
  assembly chaperone that no longer acts as a mitochondrial TOM receptor.
