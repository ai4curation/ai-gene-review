  name:
    name: ESCO Acetyltransferase
    short: ESCO_Acetyltransferase
  description:
  - text: The ESCO acetyltransferase family is characterized by its essential role
      in the establishment of sister chromatid cohesion during the S phase of the
      cell cycle. Members of this family function as acetyltransferases that are necessary
      for pairing sister chromatids by acetylating the cohesin complex component SMC3.
      This acetylation is crucial for the cohesion process that ensures accurate chromosome
      segregation during cell division. The family is also involved in DNA replication
      coupling and genome integrity preservation. The N-terminal region of these proteins
      is associated with chromosomal binding, which is key to their function, while
      the Zn finger domain is not involved in this process. The ESCO family is vital
      for proper development and DNA repair, and its members are found across various
      species, indicating a conserved mechanism in eukaryotic organisms.
