        supporting_text: "PTHR10961\tPTN000860715\tGO:0016491\tF\tIBD\tfalse"
  - assessed_term:
      id: GO:0008115
      label: sarcosine oxidase activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Sarcosine oxidase activity is established for bacterial MSOX in SF7 (reference protein
      P40873) and animal PIPOX in SF46, but not for the fructosyl amino acid (SF24) or saccharopine
      (SF26) oxidases. Within SF7 the enterobacterial MTOX enzymes prefer N-methyl-L-tryptophan, so
      sarcosine oxidase is the primary activity only of the MSOX members.
    applicable_subfamilies:
      - id: PANTHER:PTHR10961:SF7
        label: FAD DEPENDENT OXIDOREDUCTASE DOMAIN-CONTAINING PROTEIN
      - id: PANTHER:PTHR10961:SF46
