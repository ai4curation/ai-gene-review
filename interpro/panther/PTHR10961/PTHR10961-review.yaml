      oxidase (SolA/MTOX), plus the Arabidopsis probable sarcosine oxidase. This is the subfamily
      that realises the monomeric sarcosine oxidase variant of bacterial sarcosine catabolism;
      MSOX releases the one-carbon unit as formaldehyde rather than transferring it to
      tetrahydrofolate.
