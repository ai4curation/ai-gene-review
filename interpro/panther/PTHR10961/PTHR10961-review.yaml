family_id: PANTHER:PTHR10961
family_name: PEROXISOMAL SARCOSINE OXIDASE
preferred_name: MSOX/MTOX family of FAD-dependent N-methyl amino acid oxidases
summary: >-
  Single-chain FAD-dependent amine oxidases of the D-amino acid oxidase (DAO) fold that
  oxidatively demethylate or oxidise secondary-amine amino acids with O2 as acceptor. The family
  contains bacterial monomeric sarcosine oxidase (MSOX, e.g. Arthrobacter sp. TE1826 SoxA,
  Bacillus MSOX) and enterobacterial N-methyl-L-tryptophan oxidase (SolA/MTOX) in subfamily SF7,
  animal peroxisomal sarcosine/L-pipecolate oxidase (PIPOX) and fungal pipecolate oxidase in SF46,
  fungal fructosyl amino acid oxidases in SF24 and fission-yeast L-saccharopine oxidase in SF26.
  The shared chemistry is FAD-dependent oxidation of a CH-NH bond with oxygen as acceptor; the
  substrate (sarcosine, N-methyl-L-tryptophan, L-pipecolate, fructosyl amino acids, saccharopine)
  is subfamily-specific.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members are FAD-dependent oxidases acting on the CH-NH group of an amino acid
  with O2 as acceptor (PAINT root assertion of oxidoreductase activity), but substrate specificity
  diverges by subfamily: sarcosine oxidase activity is supported only in SF7 (MSOX, and as a
  secondary activity of MTOX) and SF46 (PIPOX), while SF24 and SF26 members oxidise fructosyl amino
  acids and saccharopine.
