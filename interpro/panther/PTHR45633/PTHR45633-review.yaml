family_id: PANTHER:PTHR45633
family_name: 60 KDA HEAT SHOCK PROTEIN, MITOCHONDRIAL
summary: The family includes ATP-dependent group I chaperonins such as Hsp60/GroEL and the divergent mitochondrial
  chaperone Tcm62. These proteins assist protein biogenesis, but their folding mechanisms and dependence
  on ATP are not uniform.
functional_coherence: HETEROGENEOUS
coherence_reason: Hsp60/GroEL uses ATP-dependent folding cycles, whereas Tcm62 is a divergent chaperonin-related
  assembly and antiaggregation factor whose ATP-dependent folding mechanism is not established. Mitochondrial
  residence, antigenicity and particular imported substrates are lineage-specific contexts; chaperone-assisted
  import is not membrane-channel activity.
subfamilies:
- label: Benchmark members without resolved subfamily placement
  description: Protein-folding assistance is the conserved core, while mitochondrial residence, antigenicity
    and particular imported substrates are lineage-specific contexts. Chaperonin involvement in protein
    import should not be equated with forming a membrane translocation channel.
