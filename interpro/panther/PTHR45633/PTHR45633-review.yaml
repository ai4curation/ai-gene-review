  supported_by:
  - reference_id: PMID:1346131
    supporting_text: 'facilitates the formation of catalytically active ribulose-bisphosphate

      carboxylase from an unfolded state in the presence of K+ and MgATP.'
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR45633-evidence.md
    supporting_text: Chaperonin implicated in mitochondrial protein import and macromolecular assembly.
      Together with Hsp10, facilitates the correct folding of imported proteins. May also prevent misfolding
      and promote the refolding and proper assembly of unfolded polypeptides generated under stress conditions
      in the mitochondrial matrix (PubMed:11422376, PubMed:1346131). The functional units of these chaperonins
      consist of heptameric rings of the large subunit Hsp60, which function as a back-to-back double
      ring. In a cyclic reaction, Hsp60 ring complexes bind one unfolded substrate protein per ring, followed
      by the binding of ATP and association with 2 heptameric rings of the co-chaperonin Hsp10. This leads
      to sequestration of the substrate protein in the inner cavity of Hsp60 where, for a certain period
      of time, it can fold undisturbed by other cell components. Synchronous hydrolysis of ATP in all
      Hsp60 subunits results in the dissociation of the chaperonin rings and the release of ADP and the
      folded substrate protein (Probable)
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR45633-evidence.md
    supporting_text: 'The assembly of proteins has been thought to be the sole result of properties inherent
      in the primary sequence of polypeptides themselves. In some cases, however, structural information
      from other protein molecules is required for correct folding and subsequent assembly into oligomers
      [[cite:PUB00004022]]. These `helper'' molecules are referred to as molecular chaperones, a subfamily
      of which are the chaperonins [[cite:PUB00004550]]. They are required for normal cell growth (as
      demonstrated by the fact that no temperature sensitive mutants for the chaperonin genes can be found
      in the temperature range 20 to 43 degrees centigrade [[cite:PUB00004022]]), and are stress-induced,
      acting to stabilise or protect disassembled polypeptides under heat-shock conditions [[cite:PUB00004550]].
      This entry represents the 60kDa chaperonin (Cpn60), its bacterial homologue groEL and RuBisCO subunit-binding
      protein [[cite:PUB00099589]]), which are mainly present in bacteria and eukaryots.


      The 60kDa form of chaperonin is the immunodominant antigen of patients with Legionnaire''s disease
      [[cite:PUB00001725]], and is thought to play a role in the protection of the Legionella spp. bacteria
      from oxygen radicals within macrophages. This hypothesis is based on the finding that the cpn60
      gene is upregulated in response to hydrogen peroxide, a source of oxygen radicals. Cpn60 has also
      been found to display strong antigenicity in many bacterial species [[cite:PUB00000632]], and has
      the potential for inducing immune protection against unrelated bacterial infections. The RuBisCO
      subunit binding protein (which has been implicated in the assembly of RuBisCO) and cpn60 have been
      found to be evolutionary homologues, the RuBisCO subunit binding protein having the C-terminal Gly-Gly-Met
      repeat found in all bacterial cpn60 sequences. Although the precise function of this repeat is unknown,
      it is thought to be important as it is also found in 70kDa heat-shock proteins [[cite:PUB00001725]].
      The crystal structure of Escherichia coli GroEL has been resolved to 2.8A [[cite:PUB00004190]].'
  - reference_id: PMID:10745098
    supporting_text: 'Tcm62p, distantly related to chaperonins, is required for the assembly of

      succinate dehydrogenase in mitochondria of Saccharomyces cerevisiae and was

      proposed to exert chaperone activity. We demonstrate here crucial functions of

      Tcm62p under heat stress. It ensures mitochondrial gene expression at elevated

      temperatures and prevents heat-aggregation of the ribosomal subunit Var1p.

      Similar to chaperonins, Tcm62p forms a high molecular mass protein complex of

      approximately 850 kDa in the mitochondrial matrix space. These results suggest a

      more general chaperone function of Tcm62p in mitochondria.'
