family_id: PANTHER:PTHR42866
family_name: 3-DEOXY-MANNO-OCTULOSONATE CYTIDYLYLTRANSFERASE
preferred_name: CMP-KDO synthetases (KdsB) and SpsF-like cytidylyltransferases
summary: >-
  CMP-KDO synthetases (KdsB, EC 2.7.7.38), which activate KDO with CTP to CMP-KDO, the donor that WaaA transfers
  to lipid A. The family covers bacterial KdsB and the plant mitochondrial KDSB (SF2, SF8, SF9 and SF10), the Shewanella
  KdsB that activates 8-amino-KDO (Kdo8N), and a small SF1 clade of SpsF-like spore-coat polysaccharide cytidylyltransferases
  of unknown sugar specificity. Of the 401 reviewed members, 399 are in SF2.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The CMP-KDO synthetase IBD at PTN000486355 covers every bacterial and plant KdsB leaf. The exceptions are the
  SF1 SpsF clade, which lies outside that node, and the Shewanella Kdo8N-activating enzymes, which are inside it.
