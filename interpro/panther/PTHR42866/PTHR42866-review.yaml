  assessment: UNRESOLVED
  assessment_reason: >-
    Seeded by E. coli KdsB and the Arabidopsis and maize KDSB enzymes, and covering 88 of 98 leaves: every bacterial
    and plant KdsB, while excluding the SF1 SpsF clade and two basal eukaryotic leaves. The placement is sound for
    KDO activation across bacterial and plant KdsB. One branch cannot be decided: the node includes the Shewanella
    oneidensis leaf Q8EEA9, whose KdsB activates 8-amino-KDO (Kdo8N) for its lipid A. The cached evidence shows
    Kdo8N is made from KDO before incorporation, but does not say whether this KdsB still activates KDO. An assay
    of Shewanella KdsB with KDO is needed to decide between keeping the inheritance and pruning that branch.
  supported_by:
