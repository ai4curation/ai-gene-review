  name:
    name: Multifunctional E3 Ligases and Regulators
    short: Multifunc_E3Ligases_Regulators
  description:
  - text: The protein family is involved in a variety of cellular processes including
      DNA damage repair, ubiquitination, transcriptional regulation, and maintaining
      genomic stability. Members of the family, such as the BRCA1-BARD1 heterodimer,
      function as E3 ubiquitin-protein ligases, mediating the formation of 'Lys-6'-linked
      polyubiquitin chains. Some proteins within the family act as transcription factors
      that regulate cardiac gene expression and endothelial cell activation. Others
      are involved in the regulation of NF-kappa-B transcription factor activity,
      influencing cell growth and actin filament dynamics. Additionally, certain family
      members participate in proteasome assembly, apoptosis, and tumorigenesis. The
      family also includes proteins that may disrupt host actin cytoskeletal structure,
      enhancing pathogen invasion.
