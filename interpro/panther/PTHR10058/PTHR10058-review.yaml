family_id: PANTHER:PTHR10058
family_name: MACROPHAGE COLONY STIMULATING FACTOR
preferred_name: Macrophage colony-stimulating factor family
summary: >-
  Single-subfamily vertebrate CSF1 / M-CSF cytokine family represented in the
  compact local reviewed InterPro inventory by human CSF1, mouse Csf1 and rat
  Csf1. Human CSF1 is the only reviewed Swiss-Prot human member, and all local
  reviewed members sit in PTHR10058:SF0.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed members are orthologous macrophage colony-stimulating factors
  that act as secreted and membrane-tethered disulfide-linked cytokines for
  CSF1R/FMS. PAINT restricts cytokine activity and extracellular region to the
  CSF1 clade and places macrophage/osteoclast differentiation on an overlapping
  CSF1 node; no local reviewed member suggests a divergent non-cytokine
  activity or a loss of the CSF1R ligand function.
