family_id: PANTHER:PTHR34476
family_name: DNA-DIRECTED RNA POLYMERASE SUBUNIT OMEGA
preferred_name: Bacterial RNA polymerase omega subunit (RpoZ) family
summary: Bacteria-specific family of the small RNA polymerase omega subunit (RpoZ, 67-91 aa). Omega binds
  and latches the N- and C-terminal regions of beta-prime, prevents beta-prime aggregation and promotes
  its incorporation into the alpha2 beta subassembly. It is homologous in fold to eukaryotic RPB6 and
  archaeal Rpo6, which PANTHER places in other families. Omega is not catalytic and is dispensable for
  basal activity (B. subtilis RNAP lacking omega has native activity), but its loss changes holoenzyme
  composition in E. coli. E. coli K-12 RpoZ (P0A800) is the reference member.
functional_coherence: COHERENT
coherence_reason: 'A single subfamily (SF1) of bacterial rpoZ genes with one conserved role: beta-prime
  binding and core assembly. No member reviewed shows divergence.'
