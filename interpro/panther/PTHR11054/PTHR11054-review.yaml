family_id: PANTHER:PTHR11054
family_name: 6-PHOSPHOGLUCONOLACTONASE
preferred_name: 6-Phosphogluconolactonase (PGLS/SOL) family
summary: >-
  6-Phosphogluconolactonases hydrolyse 6-phospho-D-glucono-1,5-lactone to 6-phosphogluconate, the
  second step of the oxidative pentose phosphate pathway. The family contains bacterial Pgl, S. cerevisiae
  SOL3/SOL4, S. pombe SPCC16C4.10, human PGLS, and plant cytosolic and plastid PGL isozymes.
functional_coherence: COHERENT
coherence_reason: All subfamilies are 6-phosphogluconolactonases; plant subfamilies differ in compartment.
