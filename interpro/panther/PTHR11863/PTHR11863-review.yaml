term_assessments:
- assessed_term:
    id: GO:0000254
    label: C-4 methylsterol oxidase activity
  scope: UNRESOLVED
  scope_reason: Mouse and human CH25H cDNAs encode cholesterol 25-hydroxylases with experimentally required
    histidine clusters (PMID:9852097). This side-chain hydroxylation differs from C4 methylsterol oxidation
    and C5 desaturation in other branches of the sterol-enzyme grouping. C4 methylsterol oxidase activity is
    therefore not a family-wide grant and is not supported for CH25H; the exact positively supported
    sterol-oxidase subfamily set remains unresolved.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-b.json
    supporting_text: Catalyzes the formation of 25-hydroxycholesterol from cholesterol
  - reference_id: PMID:9852097
    supporting_text: "Here, we report the cloning of cholesterol \n25-hydroxylase cDNAs from the mouse and human."
- assessed_term:
    id: GO:0102772
    label: sphingolipid C4-monooxygenase activity
  scope: UNRESOLVED
  scope_reason: >-
    Sphingolipid C4-hydroxylase is the activity of S. cerevisiae SUR2 and S. pombe sur2, as
    sphingolipid_de_novo_synthesis selects. Both sit in SF226 together with the sterol
    desaturases and oxidases ERG3, ERG25 and SC5D, so no subfamily is safe for it; it has to
    be applied per member. This differs from the SOD1/CCS case in PTHR10003, which is scoped
    family-wide with member exceptions: there the members that lack the activity (the CCS
    chaperones) form an enumerable, PAINT-negated set, whereas here the members that lack
    sphingolipid C4-hydroxylase activity are most of the subfamily.
  supported_by:
  - reference_id: file:genes/yeast/SUR2/SUR2-ai-review.yaml
    supporting_text: is the sphingolipid C4-hydroxylase of Saccharomyces cerevisiae
