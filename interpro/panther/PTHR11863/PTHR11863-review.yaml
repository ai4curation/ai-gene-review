- assessed_term:
    id: GO:0102772
    label: sphingolipid C4-monooxygenase activity
  scope: UNRESOLVED
  scope_reason: >-
    Sphingolipid C4-hydroxylase is the activity of S. cerevisiae SUR2 and S. pombe sur2, as
    sphingolipid_de_novo_synthesis selects. Both sit in SF226 together with the sterol
    desaturases and oxidases ERG3, ERG25 and SC5D, so no subfamily is safe for it; it has to
    be applied per member. This differs from the SOD1/CCS case in PTHR10003, which is scoped
    family-wide with member exceptions: there the members that lack the activity (the CCS
    chaperones) form an enumerable, PAINT-negated set, whereas here the members that lack
    sphingolipid C4-hydroxylase activity are most of the subfamily.
  supported_by:
  - reference_id: file:genes/yeast/SUR2/SUR2-ai-review.yaml
    supporting_text: is the sphingolipid C4-hydroxylase of Saccharomyces cerevisiae
