family_id: PANTHER:PTHR11863
family_name: STEROL DESATURASE
summary: This membrane oxidoreductase grouping includes cholesterol hydroxylases, sterol desaturases and
  other lipid-modifying enzymes. CH25H converts cholesterol to 25-hydroxycholesterol, a reaction distinct
  from sterol C4 demethylation or introduction of a sterol double bond. Related metal-dependent architectures
  do not make these reactions interchangeable.
functional_coherence: HETEROGENEOUS
coherence_reason: Mouse and human CH25H cDNAs encode cholesterol 25-hydroxylases with experimentally required
  histidine clusters (PMID:9852097). This side-chain hydroxylation differs from C4 methylsterol oxidation
  and C5 desaturation in other branches of the sterol-enzyme grouping. C4 methylsterol oxidase activity
  is therefore not a family-wide grant and is not supported for CH25H; the exact positively supported
  sterol-oxidase subfamily set remains unresolved.
