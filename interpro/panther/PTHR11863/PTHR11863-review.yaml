family_id: PANTHER:PTHR11863
family_name: STEROL DESATURASE
summary: PTHR11863 groups fatty-acid-hydroxylase/sterol-desaturase membrane oxygenases, including fungal Erg25
  C-4 methylsterol oxidases, fungal Erg3 and animal SC5D C-5 sterol desaturases, CH25H cholesterol
  25-hydroxylases, and fungal Sur2 sphingolipid C-4 hydroxylases.
functional_coherence: HETEROGENEOUS
coherence_reason: 'The broad family shares His-box di-iron membrane oxygenase chemistry, but substrate and bond
  specificity differ by clade: Erg25/SMO proteins oxidize C-4 methylsterols, Erg3/SC5D proteins desaturate Delta7
  sterols at C-5, CH25H hydroxylates cholesterol at C-25, and Sur2 hydroxylates sphingoid bases.'
