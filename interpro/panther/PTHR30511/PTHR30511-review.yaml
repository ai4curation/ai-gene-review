term_assessments:
- assessed_term:
    id: GO:0008784
    label: alanine racemase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Alanine racemization is the shared catalytic chemistry; biosynthetic Alr, catabolic DadX and the
    broad-specificity BSRs all have measured alanine racemase activity, though for the BSRs it is a minor,
    non-core activity.
  supported_by:
  - reference_id: PMID:23995642
    supporting_text: >-
      However, DadX did show 6- and 9-fold higher k(cat)/K(m) values than Alr with l- and d-alanine,
      respectively.
- assessed_term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    The peptidoglycan D-alanine role depends on cellular context, not on subfamily: it holds for the
    biosynthetic Alr enzymes in both SF4 (E. coli) and SF0 (Firmicutes, mycobacteria), is shared or
    redundant for catabolic DadX in some Proteobacteria, and is absent for the periplasmic BSRs. No PANTHER
    subfamily or single node captures the set, so the term should be judged per gene.
  supported_by:
  - reference_id: PMID:30008699
    supporting_text: We found no evidence to suggest that any products of Alr activity were incorporated into peptidoglycan
  - reference_id: PMID:11267762
    supporting_text: A D-alanine requiring double knock-out mutant of E. coli (alr, dadX) was constructed
