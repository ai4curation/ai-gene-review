notes: >-
  Reviewed for the D-amino-acid supply for peptidoglycan precursor biosynthesis module. Because the
  biosynthetic Alr enzymes are split between SF4 and SF0 and SF0 also holds catabolic and periplasmic
  racemases, the module grounds its D-alanine step at the family level (PTHR30511) with the E. coli K-12
  Alr exemplar and the root PAINT node, and assigns the physiological role per gene rather than by
  subfamily.
