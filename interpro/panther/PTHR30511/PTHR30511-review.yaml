family_id: PANTHER:PTHR30511
family_name: ALANINE RACEMASE
preferred_name: PLP-dependent alanine racemase family (Alr, DadX and broad-specificity amino-acid racemases)
summary: >-
  PTHR30511 is the fold-type III pyridoxal 5'-phosphate (PLP)-dependent alanine racemase family (EC 5.1.1.1).
  Members interconvert L- and D-alanine through a PLP aldimine with an active-site lysine and a second
  catalytic tyrosine from the partner subunit of the obligate dimer. Their physiological roles differ by
  context rather than by fold. Biosynthetic racemases (E. coli Alr, B. subtilis Alr1, M. tuberculosis Alr)
  supply cytoplasmic D-alanine for D-Ala-D-Ala and peptidoglycan; catabolic DadX enzymes (E. coli, P.
  putida, P. aeruginosa) feed L-alanine into D-amino acid dehydrogenase-dependent catabolism; and
  periplasmic broad-specificity amino-acid racemases (BSR; P. putida KT2440 Alr/PP_3722, V. cholerae BsrV)
  have a signal peptide, prefer lysine and arginine, and act in basic amino-acid catabolism or extracellular
  D-amino-acid release. VanT-type serine racemases of vancomycin-resistance clusters and lysine/ornithine
  racemases also sit in the family. PANTHER subfamilies do not track these roles: SF4 ("biosynthetic") holds
  only the enterobacterial and Vibrio Alr enzymes, while SF0 ("catabolic-related") holds the catabolic DadX
  enzymes, the BSRs, VanT and also the biosynthetic Alr of Gram-positive bacteria and mycobacteria.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The catalytic chemistry (PLP-dependent amino-acid racemization, with measurable alanine racemase activity in
  the characterised members) is shared family-wide, but substrate preference (alanine, serine, lysine/arginine)
  and physiological role (peptidoglycan D-alanine supply, alanine catabolism, periplasmic basic-amino-acid
  catabolism) vary, and the subfamily split does not separate them.
