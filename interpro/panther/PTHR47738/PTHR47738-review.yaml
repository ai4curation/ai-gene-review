family_id: PANTHER:PTHR47738
family_name: PTS SYSTEM FRUCTOSE-LIKE EIIA COMPONENT-RELATED
preferred_name: PTS EIIA type-2 domain proteins (EIIA(Ntr)/PtsN and fructose/galactitol-type EIIA)
summary: >-
  Soluble PTS EIIA proteins of the type-2 (fructose/mannitol) fold, each carrying an
  active-site histidine that is phosphorylated by an HPr-like carrier. The family
  joins two different kinds of protein. Sugar-specific EIIA components (galactitol GatA,
  fructose-like FrvA) pass the phosphoryl group on to the EIIB domain of a sugar
  permease. EIIA(Ntr) (PtsN), the terminal protein of the nitrogen-regulatory PTS, is
  phosphorylated by NPr but has no EIIB/EIIC partner; instead its phosphorylation state
  controls direct interactions with regulatory targets, including the KdpD potassium
  sensor kinase (E. coli and P. putida), the TrkA potassium transporter subunit
  (E. coli) and pyruvate dehydrogenase E1 (P. putida).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Histidyl phosphoacceptor chemistry is shared, but the sugar EIIAs (SF2 FrvA, SF4 GatA)
  are transport components, whereas the nitrogen-regulatory proteins (SF1 PtsN) are
  regulatory adaptors that transport nothing. Even within SF1 the sign of the KdpD
  output differs between lineages: dephosphorylated E. coli IIA(Ntr) stimulates KdpD,
  while P. putida PtsN, mainly phosphorylated, represses kdpFABC through KdpD.
reference_protein:
  id: UniProtKB:P69829
  label: Nitrogen regulatory protein
  gene_symbol: ptsN
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/ptsN/ptsN-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR47738:SF1
  label: NITROGEN REGULATORY PROTEIN
  description: >-
    EIIA(Ntr)/PtsN of proteobacteria: E. coli PtsN (P69829), Shigella, Klebsiella,
    Haemophilus, Bradyrhizobium and Pseudomonas aeruginosa PtsN, and P. putida KT2440
    PtsN (Q88PA0). This subfamily selects the terminal step of the bacterial
    nitrogen-regulatory PTS module.
  representative_members:
  - id: UniProtKB:P69829
    label: Nitrogen regulatory protein
    gene_symbol: ptsN
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/ptsN/ptsN-ai-review.yaml
  - id: UniProtKB:Q88PA0
    label: Phosphotransferase system enzyme IIA, regulation of potassium transport
    gene_symbol: ptsN
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/ptsN/ptsN-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Lost the sugar-transport role of EIIA: no EIIB/EIIC partner, and the phosphoacceptor
    acts as a phosphorylation-state-dependent regulator of other proteins (KdpD, TrkA,
    AceE).
  supported_by:
  - reference_id: PMID:19400808
    supporting_text: >-
      Two-hybrid data and biochemical analysis revealed that IIA(Ntr) interacts with
      sensor kinase KdpD and stimulates kinase activity, resulting in increased levels of
      phosphorylated response regulator KdpE.
  - reference_id: PMID:26224366
    supporting_text: >-
      Bacterial two-hybrid assays demonstrated that kdpFp regulation is implemented
      through direct interaction of the PtsN protein with the sensor kinase KdpD of the
      KdpD/KdpE two-component system.
  - reference_id: PMID:18296519
    supporting_text: comprise a branch of the system unrelated to sugar traffic but thought to have an influence on coordination of N and C metabolism
- subfamily_id: PANTHER:PTHR47738:SF2
  label: PTS SYSTEM FRUCTOSE-LIKE EIIA COMPONENT
  description: E. coli FrvA (P32155), a fructose-like sugar PTS EIIA; not checked experimentally here.
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR47738:SF4
  label: PTS SYSTEM GALACTITOL-SPECIFIC EIIA COMPONENT
  description: E. coli GatA (P69828) and orthologues, the galactitol PTS EIIA; not checked experimentally here.
  diverged_from_family: false
