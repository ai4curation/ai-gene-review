notes: >-
  Written for the bacterial nitrogen-regulatory PTS module, whose terminal step is
  grounded on SF1 with E. coli and P. putida PtsN as representatives. Counts are from the
  PANTHER entries inventory (12 reviewed members: SF1 7, SF4 3, SF2 1, and the Haloferax
  ptfA EIIA D4GYE4 without a subfamily assignment); P. putida KT2440 PtsN (Q88PA0,
  unreviewed) is placed in SF1 by its DR PANTHER line. The SF1 member P33670 is an
  89-residue P. putida PtsN entry. The KdpD sign question is recorded as a
  suggested experiment in the E. coli and P. putida PtsN gene reviews. The ptsN_eiia_ntr
  annoton of the module asserts only protein kinase regulator activity, not the
  activator term placed at PTN002021052.
