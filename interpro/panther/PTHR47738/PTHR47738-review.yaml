  seeds:
  - id: UniProtKB:P69829
    label: ptsN
    organism: Escherichia coli K-12
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  assessment: TOO_DEEP
  assessment_reason: >-
    The only seed is E. coli IIA(Ntr), whose stimulation of KdpD is direct and well
    supported. The node is placed at Bacteria level, so the activator direction descends
    to EIIA(Ntr) proteins of other lineages, and P. putida PtsN contradicts it: PtsN
    binds KdpD but represses kdpFABC transcription, mainly in its phosphorylated form
    (P. putida receives the activator term by a TreeGrafter IEA from PTN002412134). KdpD
    regulation itself (the parent, protein kinase regulator activity) is supported in
    both lineages and is a reasonable ancestral claim for the EIIA(Ntr) clade; the
    activator sign arose later, or is set by lineage-specific context, and belongs on an
    enterobacterial node.
  supported_by:
  - reference_id: PMID:19400808
    supporting_text: The data suggest that exclusively dephosphorylated IIA(Ntr) binds and activates KdpD.
  - reference_id: PMID:26224366
    supporting_text: >-
      Measurements of kdpFp promoter activity in different pts mutants showed that PtsN
      is responsible for repression of kdpFABC transcription.
