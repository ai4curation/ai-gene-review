family_id: PANTHER:PTHR11630
family_name: DNA REPLICATION LICENSING FACTOR MCM FAMILY MEMBER
summary: MCM-family ATPases include the MCM2-7 replicative helicase subunits and MCM8/9-associated DNA
  repair factors. Eukaryotic MCM2-7 functions as a heterohexamer within the active replisome, with different
  subunits contributing to an assembled motor. Related MCM8/9 proteins do not simply substitute for replication-licensing
  subunits.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory contains MCM2-7, MCM8/9 and MCM-domain proteins. Curated IPR031327 separates
  the replicative MCM2-7 motor from repair-associated MCM8/9. NCU02539 maps to MCM4 and contributes to
  an assembled helicase; this does not demonstrate autonomous helicase activity by the isolated chain
  or establish that every family member participates in origin licensing.
subfamilies:
- subfamily_id: PANTHER:PTHR11630:SF66
  label: DNA REPLICATION LICENSING FACTOR MCM4
  description: IPR031327 distinguishes MCM2-7 from MCM8/9. NCU02539 maps to MCM4, supporting replicative-helicase
    participation in the appropriate complex. Origin licensing, double-strand-break repair and intrinsic
    helicase activity of an isolated subunit must be distinguished, rather than inherited as an undifferentiated
    set.
  representative_members:
  - id: UniProtKB:Q7SHS5
    label: DNA replication licensing factor MCM4
    gene_symbol: NCU02539
    organism: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
    gene_review: genes/NEUCR/NCU02539/NCU02539-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0003678
    label: DNA helicase activity
  scope: UNRESOLVED
  scope_reason: Helicase function is supported for assembled MCM complexes, but the family-level term
    cannot encode the distinction between a contributing subunit and an independently active helicase.
