family_id: PANTHER:PTHR43578
family_name: NADH-QUINONE OXIDOREDUCTASE SUBUNIT F
preferred_name: >-
  Complex I 51 kDa-type NADH-oxidising flavoprotein family (bacterial NuoF / Nqo1
  together with NAD(P)-reducing and electron-bifurcating hydrogenase subunits)
summary: >-
  NADH(P)-oxidising flavoproteins built from the complex I 51 kDa subunit fold: an
  NADH-binding Rossmann-type domain, an FMN-binding domain and a C-terminal
  [4Fe-4S]-binding domain. The best-characterised members are bacterial complex I
  NuoF subunits (E. coli NuoF, Thermus Nqo1, Pseudomonas NuoF), which oxidise NADH
  on the FMN and pass electrons via cluster N3 into the iron-sulfur wire of NDH-1.
  As classified by InterPro/UniProt the family also contains the same flavin module
  in other enzymes: the NAD+-reducing soluble hydrogenase subunit HoxF of Cupriavidus
  necator, the NADP-reducing hydrogenase subunit HndC of Solidesulfovibrio
  fructosivorans, the beta subunit HydB of the electron-bifurcating [FeFe]
  hydrogenase of Thermotoga maritima (its own subfamily, SF2), and (by the
  representative structure) the NAD+-reducing subunit of formate dehydrogenase. The
  shared chemistry is two-electron NAD(P)H/NAD(P)+ exchange at a flavin coupled to
  one-electron transfer through iron-sulfur clusters; what differs between members
  is the partner complex (proton-pumping quinone reductase versus hydrogenase or
  formate dehydrogenase), and with it the direction and acceptor of the overall
  reaction.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The subunit-level chemistry (NAD(H)-binding, FMN-dependent NADH oxidation or NAD+
  reduction, electron transfer via [4Fe-4S]) is shared by complex I NuoF and by the
  hydrogenase and formate-dehydrogenase flavoprotein subunits, but complex-level
  terms are not: complex I membership, NADH:quinone (GO:0008137) activity and
  respiratory-chain process terms hold only for the NuoF/Nqo1 members, and the
  subfamily axis does not separate them, because PTHR43578:SF3 contains HoxF (P22317)
  and HndC (Q46507) alongside NuoF, while only HydB is split off into SF2. Two
  members are outliers: HndC is named and was characterised as NADP-reducing, so the
  NADH-specific term may not apply to it; and P07324, a 102-residue Clostridium
  pasteurianum [2Fe-2S] ferredoxin, is far too short to contain the flavin and
  NADH-binding domains. A further, classification-level caveat: PANTHER's own 19.0
  release does not agree with InterPro/UniProt on where complex I NuoF belongs.
  InterPro/UniProt place E. coli P31979, T. thermophilus Q56222, P. aeruginosa
  Q9I0J7 and P. putida Q88FH3 in PTHR43578:SF3, whereas PANTHER 19.0's E. coli
  classification file places E. coli nuoF in PTHR11780:SF10 with mitochondrial
  NDUFV1 (reviewed separately in PTHR11780), and the PAINT node that supplies NuoF
  IBAs (PTN000207323) is the one assessed in the PTHR11780 review. Neither placement
  is changed here.
reference_protein:
  id: UniProtKB:Q56222
  label: NADH-quinone oxidoreductase subunit 1
  gene_symbol: nqo1
  organism: Thermus thermophilus (strain ATCC 27634 / DSM 579 / HB8)
  gene_review: genes/THET8/nqo1/nqo1-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR43578:SF3
    label: NADH-QUINONE OXIDOREDUCTASE SUBUNIT F
    description: >-
      Holds the complex I NuoF/Nqo1 members of the slice (E. coli, Salmonella,
      Pseudomonas aeruginosa, Thermus, Aquifex, Rhizobium NuoF2, Buchnera) together
      with the hydrogenase flavoprotein subunits HoxF (C. necator) and HndC
      (S. fructosivorans) and a short Clostridium [2Fe-2S] ferredoxin. The bacterial
      complex I exemplar P. putida KT2440 NuoF (Q88FH3) is here by its UniProt
      cross-reference, as is Thermus Nqo1 (Q56222), whose peripheral-arm structure shows the
      FMN within electron-transfer distance of cluster N3.
    diverged_from_family: false
    representative_members:
      - id: UniProtKB:Q88FH3
        label: NADH-quinone oxidoreductase subunit F
        gene_symbol: nuoF
        organism: Pseudomonas putida KT2440
        gene_review: genes/PSEPK/nuoF/nuoF-ai-review.yaml
      - id: UniProtKB:Q56222
        label: NADH-quinone oxidoreductase subunit 1
        gene_symbol: nqo1
        organism: Thermus thermophilus (strain ATCC 27634 / DSM 579 / HB8)
        gene_review: genes/THET8/nqo1/nqo1-ai-review.yaml
      - id: UniProtKB:P22317
        label: NAD-reducing hydrogenase HoxS subunit alpha
        gene_symbol: hoxF
        organism: Cupriavidus necator (strain ATCC 17699 / H16)
      - id: UniProtKB:Q46507
        label: NADP-reducing hydrogenase subunit HndC
        gene_symbol: hndC
        organism: Solidesulfovibrio fructosivorans
  - subfamily_id: PANTHER:PTHR43578:SF2
    label: BIFURCATING [FEFE] HYDROGENASE BETA SUBUNIT
    description: >-
      The flavin (NADH-binding) subunit of electron-bifurcating [FeFe] hydrogenases,
      represented by Thermotoga maritima HydB (O52682, 626 residues, with extra
      iron-sulfur domains). It belongs to a hydrogenase, not to complex I.
    diverged_from_family: true
    divergence_description: >-
      Partner complex and overall reaction differ: HydB is part of a bifurcating
      hydrogenase that couples NADH and reduced ferredoxin to H2 production rather
      than a proton-pumping quinone reductase, so complex I component, NADH:quinone
      activity and respiratory electron transport terms do not apply; the
      subunit-level NAD(H)/FMN chemistry is retained.
    representative_members:
      - id: UniProtKB:O52682
        label: Bifurcating [FeFe] hydrogenase beta subunit
        gene_symbol: hydB
        organism: Thermotoga maritima (strain ATCC 43589 / MSB8)
