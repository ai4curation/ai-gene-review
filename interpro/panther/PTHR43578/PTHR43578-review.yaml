term_assessments:
  - assessed_term:
      id: GO:0003954
      label: NADH dehydrogenase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      NADH oxidation at the FMN of the 51 kDa-type flavin module is shared by the
      complex I NuoF members (experimentally in E. coli NuoF) and by the NAD+-reducing
      hydrogenase and formate-dehydrogenase flavoprotein subunits, which catalyse the
      same NADH/NAD+ exchange (GO:0003954 is defined without direction-specific
      acceptor). The nuo locus itself was found with probes from the conserved
      NAD(H)-binding subunit shared by complex I and the NAD+-reducing hydrogenase.
      Two members are recorded as exceptions: the truncated ferredoxin P07324, and
      HndC, whose NADP specificity would put it outside this NADH-specific term.
    supported_by:
      - reference_id: PMID:7690854
        supporting_text: 'The primers used for the reaction were derived from consensus
          sequences of the NAD(H)-binding subunit of mitochondrial NADH: ubiquinone
          oxidoreductase and the NAD(+)-reducing hydrogenase of Alcaligenes eutrophus.'
      - reference_id: PMID:19061856
        supporting_text: Replacement of glutamate 95 for glutamine in the NADH- and
          FMN-binding NuoF subunit of E. coli Complex I decreased NADH oxidation
          activity 2.5-4.8 times
    member_exceptions:
      - member:
          id: UniProtKB:P07324
          label: Ferredoxin, 2Fe-2S
          organism: Clostridium pasteurianum
        exception_reason: >-
          A 102-residue [2Fe-2S] ferredoxin; it cannot contain the NADH-binding,
          FMN-binding and [4Fe-4S] domains of a ~430-residue 51 kDa-type subunit, so
          its placement reflects a partial domain match, and NADH dehydrogenase
          activity is not expected.
        supported_by:
          - reference_id: file:interpro/panther/PTHR43578/PTHR43578-entries.csv
            supporting_text: P07324,"Ferredoxin, 2Fe-2S",protein,1501,Clostridium
              pasteurianum,Clostridium pasteurianum,,102,PTHR43578:SF3
      - member:
          id: UniProtKB:Q46507
          label: NADP-reducing hydrogenase subunit HndC
          organism: Solidesulfovibrio fructosivorans
        exception_reason: >-
          Named and originally characterised as the NADP-reducing subunit of the Hnd
          hydrogenase; if NADP-specific, the NADH-specific GO:0003954 does not hold.
          Recorded tentatively; its nucleotide specificity was not re-examined here.
        supported_by:
          - reference_id: file:interpro/panther/PTHR43578/PTHR43578-entries.csv
            supporting_text: Q46507,NADP-reducing hydrogenase subunit HndC,protein,878
  - assessed_term:
      id: GO:0010181
      label: FMN binding
    scope: FAMILY_WIDE
    scope_reason: >-
      The FMN-binding domain (InterPro Nuo51_FMN-bd) defines the family; one FMN per
      subunit in complex I NuoF, and the same flavin module in the hydrogenase
      subunits. The truncated ferredoxin P07324 is the evident exception.
  - assessed_term:
      id: GO:0045271
      label: respiratory chain complex I
    scope: UNRESOLVED
    scope_reason: >-
      True only for the NuoF/Nqo1 members. Not expressible by subfamily: SF3 mixes
      NuoF with HoxF and HndC hydrogenase subunits, and only HydB is separated (SF2).
      Scope by clade (the PAINT node PTN000207323, which PANTHER itself places in
      PTHR11780) rather than by this family.
  - assessed_term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    scope: UNRESOLVED
    scope_reason: >-
      A complex-level, acceptor-specific activity: correct (as a contribution) for
      complex I NuoF in ubiquinone-using bacteria, wrong for the hydrogenase and
      formate-dehydrogenase subunits and imprecise for menaquinone-only organisms.
      The subfamily axis cannot express the boundary (see GO:0045271).
