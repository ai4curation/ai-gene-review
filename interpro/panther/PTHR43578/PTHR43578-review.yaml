review_status: COMPLETE
reviewed_by: AI-assisted bacterial respiratory complex I module curation
review_date: '2026-11-02'
notes: >-
  Written for the bacterial respiratory complex I module, whose NuoF part grounds to
  PANTHER:PTHR43578 with GO:0003954 NADH dehydrogenase activity (assessed
  FAMILY_WIDE here, with two member exceptions). Family and subfamily names are
  verbatim from panther.obo; members from PTHR43578-entries.csv (13 reviewed
  proteins: 12 in SF3, HydB in SF2). PTHR43578-paint.tsv was fetched with `just
  fetch-panther-paint PTHR43578` and has three rows, all at PTN000207323 and all
  assessed above.

  Classification disagreement, recorded rather than resolved: InterPro and the
  UniProt PANTHER cross-references put E. coli NuoF (P31979), T. thermophilus Nqo1
  (Q56222), P. aeruginosa NuoF (Q9I0J7) and P. putida NuoF (Q88FH3) in
  PTHR43578:SF3, but PANTHER 19.0's own classification file for E. coli
  (.cache/panther/PTHR19.0_e_coli) assigns nuoF to PTHR11780:SF10 ("NADH
  DEHYDROGENASE [UBIQUINONE] FLAVOPROTEIN 1, MITOCHONDRIAL") together with
  mitochondrial NDUFV1, and the PAINT IBD node PTN000207323 that gives P31979 and
  Q9I0J7 their IBAs is in the PTHR11780 tree (see
  interpro/panther/PTHR11780/PTHR11780-review.yaml, not edited here). The likely
  explanation is that the InterPro member list reflects an HMM assignment of the
  bacterial NuoF clade to the broader flavin-module family that also captures
  hydrogenase subunits, while PANTHER's tree builds groups NuoF with NDUFV1. No
  family ids were changed. A curator deciding which assignment is right should do so
  via interpro/panther/panther-members-overrides.tsv. Because of this split, and
  because SF3 does not separate complex I NuoF from hydrogenase subunits,
  complex-level terms are left UNRESOLVED; resolving them needs a PANTHER tree split
  that separates complex I NuoF from the NAD(P)-reducing hydrogenase subunits.
  Placement decision, 2026-11-02: E. coli NuoF (P31979) is recorded in
  interpro/panther/panther-members-overrides.tsv as PTHR11780:SF10, following PANTHER
  19.0's own classification and tree, which carry its IBAs on PTN000207323; it is
  therefore no longer a representative here. The reference protein is the reviewed
  Thermus thermophilus Nqo1 (Q56222), which is listed in this family's InterPro entries
  slice (SF3) and has its own gene review. P. putida Q88FH3 stays a representative by
  UniProt's cross-reference only (P. putida is not in PANTHER's classification files). The P. aeruginosa orthologue Q9I0J7 is classified PTHR11780:SF10
  by PANTHER, so the proteobacterial NuoF clade may belong to PTHR11780 by tree; settling
  Q88FH3 needs its PANTHER tree placement. See the PTHR11780 review.
