family_id: PANTHER:PTHR19136
family_name: MOLYBDENUM COFACTOR GUANYLYLTRANSFERASE
preferred_name: MobA-like nucleotidyltransferase / type 1 DapD acyltransferase family
summary: 'A heterogeneous PANTHER family that groups two unrelated enzyme chemistries. Subfamilies SF81,
  SF86 and SF84 are MobA-like nucleotidyltransferases: molybdenum cofactor guanylyltransferase MobA, adenosylcobinamide-phosphate
  guanylyltransferase CobY and the bifunctional inositol-1-phosphate cytidylyltransferase/di-myo-inositol
  phosphate synthases of hyperthermophiles. Subfamily SF52, the largest by reviewed entries (188, all
  named DapD), holds the type 1 tetrahydrodipicolinate N-succinyltransferases (DapD, EC 2.3.1.117) of
  the succinylase branch of lysine biosynthesis, which are trimeric left-handed beta-helix (hexapeptide-repeat)
  acyltransferases. The type 2 DapD enzymes of Pseudomonas and other gamma-proteobacteria (HAMAP MF_02122,
  NCBIfam TIGR03536), such as P. putida KT2440 Q88MP1, are not classified in this family.'
functional_coherence: HETEROGENEOUS
coherence_reason: The family name and its root PAINT molecular function (nucleotidyltransferase) describe
  the MobA-like subfamilies only; DapD (SF52) catalyses succinyl transfer from succinyl-CoA and no nucleotidyltransferase
  activity has been reported for it.
