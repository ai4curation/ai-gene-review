family_id: PANTHER:PTHR19136
family_name: MOLYBDENUM COFACTOR GUANYLYLTRANSFERASE
preferred_name: MobA molybdenum cofactor guanylyltransferase family (with DapD, CobY and DIPP-synthase
  subfamilies)
summary: PTHR19136 is named for MobA, which transfers GMP from GTP to Mo-molybdopterin to make the molybdopterin
  guanine dinucleotide cofactor (MGD and bis-MGD). Beside the MobA subfamily (SF81), PANTHER places three
  other subfamilies here. SF86 holds CobY adenosylcobinamide-phosphate guanylyltransferases, and SF84
  holds bifunctional IPC transferase and DIPP synthase proteins. SF52 holds DapD tetrahydropyridine-2,6-dicarboxylate
  N-succinyltransferases, which are acyltransferases of lysine biosynthesis. The type 2 DapD enzymes of
  Pseudomonas and other gamma-proteobacteria (HAMAP MF_02122, NCBIfam TIGR03536), such as P. putida KT2440
  Q88MP1, are not classified in this family.
functional_coherence: HETEROGENEOUS
coherence_reason: SF81 (211 frozen entries) is MobA, while SF52 (210 entries) is DapD. The two subfamilies
  catalyse unrelated reactions on unrelated substrates. The SF84 and SF86 members are nucleotidyltransferases
  with different acceptors. The MobA-specific GTP:Mo-MPT guanylyltransferase activity is therefore confined
  to SF81.
