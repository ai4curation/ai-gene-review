notes: 'The module molybdenum_cofactor_biosynthesis grounds its MGD branch on SF81. The pruning recommendation
  for GO:0016779 on the DapD branch (PTN001057733) is a PAINT curation suggestion; no IRD row exists in
  the current PAINT slice. The tree check was generated from the PANTHER 19 treeinfo service on 2026-11-10.
  Merged with the lysine_biosynthesis review (2026-11-11): added the SF84 and SF86 subfamily entries,
  the GO:0008666, GO:0009085 and GO:0016779 term assessments and the DapD (PMID:6365916) evidence. That
  review had rated the root nucleotidyltransferase IBD TOO_DEEP; the tree check above shows the DapD clade
  nested below the LUCA root, so NEEDS_PRUNING is kept. The fetched entries and metadata files are the
  2026-07-20 fetch already on main (426 reviewed entries); a 2026-11-11 refetch returned only 360 rows
  and was discarded as incomplete.'
