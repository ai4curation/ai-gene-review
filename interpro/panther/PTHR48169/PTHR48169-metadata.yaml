  name:
    name: CASP8 and FADD-like apoptosis regulator
    short: CASP8/FADD-like_regulator
  description:
  - text: The CASP8 and FADD-like apoptosis regulator family includes proteins that
      play crucial roles in cell death pathways, acting as molecular switches for
      apoptosis, necroptosis, and pyroptosis. Members of this family are involved
      in the activation and regulation of caspases, crucial enzymes in programmed
      cell death. They participate in the formation of the death-inducing signaling
      complex (DISC), which is essential for the activation of initiator and effector
      caspases. Some family members lack catalytic activity but still contribute to
      apoptosis regulation by inhibiting caspase recruitment and activation. Additionally,
      certain proteins within this family can modulate immune responses, such as NF-kappa-B
      activation, and may interfere with host-pathogen interactions. The family also
      includes viral proteins that mimic host counterparts to evade immune responses
      and promote viral persistence.
