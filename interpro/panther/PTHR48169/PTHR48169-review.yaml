family_id: PANTHER:PTHR48169
family_name: DED DOMAIN-CONTAINING PROTEIN
summary: Death-effector-domain-associated regulatory proteins organize signaling interactions rather than
  sharing one universal enzymatic reaction. PEA15 regulates kinase localization and signaling outputs
  through protein interactions.
functional_coherence: HETEROGENEOUS
coherence_reason: PEA15 directly docks to ERK2, disrupts features of its active conformation and protects
  bound ERK2 from dephosphorylation (PMID:23575685). This establishes kinase regulation for the PEA15
  branch. Other death-effector-domain proteins recruit different signaling partners; a common DED does
  not establish ERK regulation, protease activity or identical apoptotic wiring. The complete set with
  protein kinase regulator activity remains unresolved.
