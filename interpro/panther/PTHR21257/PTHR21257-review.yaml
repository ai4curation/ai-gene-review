family_id: PANTHER:PTHR21257
family_name: DELTA(14)-STEROL REDUCTASE
preferred_name: ERG4/ERG24 sterol reductase family (C-14, C-24(28) and C-7 sterol reductases)
summary: >-
  Polytopic ER membrane NADPH-dependent sterol reductases. Delta14-sterol reductase (S. cerevisiae
  ERG24, S. pombe erg24, human TM7SF2 and LBR) acts after C-14 demethylation. Delta24(28)-sterol
  reductase (S. cerevisiae ERG4, S. pombe erg4) makes the last step of ergosterol synthesis. 7-Dehydrocholesterol
  reductase (DHCR7) makes the last step of cholesterol synthesis.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The double bond reduced is subfamily-specific: delta-14 (SF52, SF55), delta-24(28) (SF31, SF48)
  and delta-7 (DHCR7, SF38).
