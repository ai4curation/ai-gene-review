family_id: PANTHER:PTHR21257
family_name: DELTA(14)-STEROL REDUCTASE
preferred_name: ERG4/ERG24 sterol reductase family (C-14, C-24(28) and C-7 sterol reductases)
summary: Polytopic ER-membrane NADPH-dependent sterol reductases in the ERG4/ERG24 family. Fungal ERG24/TM7SF2-type enzymes
  are Delta14-sterol reductases, fungal ERG4 branches are Delta24(24-1)-sterol reductases that make the terminal ergosterol
  reduction, DHCR7 branches are 7-dehydrocholesterol reductases, and LBR/TM7SF2 animal branches retain C-14 reductase activity
  in cholesterol synthesis.
functional_coherence: HETEROGENEOUS
coherence_reason: 'The reduced double bond is subfamily-specific: Delta14 in SF52/SF55, fungal Delta24(24-1) in SF31/SF48,
  and Delta7 in the DHCR7 SF38 branch.'
