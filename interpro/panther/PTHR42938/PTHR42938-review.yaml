family_id: PANTHER:PTHR42938
family_name: FORMATE DEHYDROGENASE 1
preferred_name: 'D-isomer 2-hydroxyacid dehydrogenase family: PHGDH, formate dehydrogenase and PdxB'
summary: >-
  NAD-dependent D-isomer-specific 2-hydroxyacid dehydrogenases. D-3-phosphoglycerate dehydrogenases
  (human PHGDH, plant PGDH1-3, B. subtilis SerA) catalyse the first step of phosphorylated serine
  biosynthesis. SF9 joins two lineages: eukaryotic NAD-dependent formate dehydrogenases (S. cerevisiae
  FDH1, plant FDH) and bacterial erythronate-4-phosphate dehydrogenase PdxB of the DXP-dependent
  PLP pathway.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrates differ by clade: 3-phosphoglycerate (SF22, SF42, SF46, SF5, SF47), formate (eukaryotic
  part of SF9) and 4-phospho-D-erythronate (bacterial PdxB part of SF9).
