    label: ILV6
    organism: Saccharomyces cerevisiae
  assessment: UNRESOLVED
  assessment_reason: >-
    The only seed is a proteomic identification of S. cerevisiae Ilv6 in purified mtDNA nucleoids.
    The ILV6 gene review keeps it as a non-core localization. Nucleoid association of
    mitochondrial metabolic enzymes in S. cerevisiae (Ilv5, Aco1) has been tied to mtDNA
    maintenance in that species. Whether the localization holds across Dikarya (for example
    S. pombe ilv6, which receives it) has not been tested. The term is not wrong for the seed,
    but a single proteomic seed is thin support for a Dikarya-wide placement.
  supported_by:
  - reference_id: PMID:15692048
    supporting_text: We have identified 22 mtDNA-associated proteins in yeast
