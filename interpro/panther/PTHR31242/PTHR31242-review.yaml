family_id: PANTHER:PTHR31242
family_name: ACETOLACTATE SYNTHASE SMALL SUBUNIT, MITOCHONDRIAL
preferred_name: Fungal mitochondrial acetohydroxyacid synthase regulatory subunit (ILV6)
summary: >-
  Fungal regulatory (small) subunits of the mitochondrial acetohydroxyacid synthase (AHAS),
  represented by Saccharomyces cerevisiae ILV6, Schizosaccharomyces pombe ilv6 and Verticillium
  ILV6. ILV6 does not catalyse the reaction itself. It stimulates the catalytic subunit ILV2 up
  to 7-fold and confers valine feedback inhibition on it. Fungal AHAS differs from bacterial and
  plant AHAS in that MgATP reverses valine inhibition, and the fungal regulatory subunit carries a
  sequence insert proposed to form the MgATP site. ILV6 is imported into mitochondria and was
  also recovered with mtDNA nucleoids. PANTHER classifies these proteins in a family separate
  from the bacterial/plant small subunits (PTHR30239).
functional_coherence: COHERENT
coherence_reason: >-
  The single subfamily, SF2, contains only fungal ILV6 orthologs. All characterized members
  (S. cerevisiae ILV6) are AHAS regulatory subunits, and nothing in the inventory suggests
  divergence.
