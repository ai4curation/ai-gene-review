family_id: PANTHER:PTHR43247
family_name: PHOSPHOSERINE AMINOTRANSFERASE
preferred_name: Phosphoserine aminotransferase (SerC/PSAT) family
summary: >-
  PLP-dependent class V aminotransferases that transaminate 3-phosphohydroxypyruvate to O-phospho-L-serine
  in phosphorylated serine biosynthesis (E. coli and P. putida SerC, S. cerevisiae SER1, S. pombe
  SPAC1F12.07, human PSAT1). Bacterial SerC also acts in the DXP-dependent PLP pathway.
functional_coherence: COHERENT
coherence_reason: Every subfamily (SF1, SF3, SF5) is a phosphoserine aminotransferase.
