notes: >-
  Reviewed for the acetyl-CoA carboxylase part of modules/type_ii_fatty_acid_synthesis.yaml, whose heteromeric
  AccABCD variant lists one representative per subunit. The four subunit families are reviewed together
  so that GO:0003989 acetyl-CoA carboxylase activity is treated the same way in each: it names the complete
  reaction ATP + acetyl-CoA + hydrogencarbonate = ADP + phosphate + malonyl-CoA, which no single subunit
  performs, so it is scoped NOT_APPLICABLE here and recorded as contributes_to_molecular_function in the
  member gene reviews, with in_complex GO:0009317. This family is the one that carries a second, genuine
  function: the proteobacterial AccD subunits bind their own subunit mRNAs through a bacterial-specific
  zinc domain and repress translation, which the E. coli accD review models as a second core function.
  Scope divergence worth stating plainly: the three new ACC subunit families (PTHR42853 AccA,
  PTHR42995 AccD, PTHR45266 AccB) all scope GO:0003989 NOT_APPLICABLE, because no one of these
  subunits carries out the whole reaction: AccC carboxylates AccB's biotin, the AccA-AccD pair
  transfers that carboxyl group to acetyl-CoA at an interface the two of them share, and AccB only
  ferries it between the two active sites, so each subunit performs at most a half-reaction and only
  inside the assembled holoenzyme. PTHR48095 (AccC) instead scopes it SUBFAMILY_ONLY with member
  exceptions, which is the version main already carried from the pyruvate-metabolism review and
  which was deliberately kept rather than overwritten. The two formulations express the same
  judgement - a subunit contributes to the holoenzyme activity instead of enabling it - and both
  leave the member reviews' contributes_to records consistent; the values are not identical, and
  aligning them is a decision for whoever owns PTHR48095.
