family_id: PANTHER:PTHR42995
family_name: ACETYL-COENZYME A CARBOXYLASE CARBOXYL TRANSFERASE SUBUNIT BETA, CHLOROPLASTIC
preferred_name: AccD-type carboxyltransferase beta subunit family
summary: >-
  Beta subunits of biotin-dependent carboxyltransferases. The large subfamily SF5 (504 of 505 inventory
  members) holds the AccD subunit of bacterial and plastid acetyl-CoA carboxylase, together with the actinobacterial
  AccD3/AccD-type subunits that serve mycolic-acid synthesis; SF1 holds a malonate-decarboxylase carboxyltransferase.
  In proteobacteria the AccA2AccD2 carboxyltransferase additionally binds its own subunit mRNAs through
  a bacterial-specific zinc domain on the beta subunit and represses their translation, which the family's
  proteobacterial node records.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are carboxyltransferase beta-type subunits of biotin-dependent enzymes, but the carboxylase
  they belong to differs: acetyl-CoA carboxylase for most of SF5, long-chain acyl-CoA carboxylases of
  mycolic-acid synthesis for the actinobacterial clade, and malonate decarboxylase for SF1.
