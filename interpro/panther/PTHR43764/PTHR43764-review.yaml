family_id: PANTHER:PTHR43764
family_name: MOLYBDENUM COFACTOR BIOSYNTHESIS
preferred_name: MogA molybdopterin adenylyltransferase family
summary: PTHR43764 contains the bacterial MogA proteins, which adenylate molybdopterin with ATP. The
  adenylyl-molybdopterin product is the substrate on which MoeA inserts molybdate. A few cyanobacterial
  and green-sulfur-bacterial members are bifunctional MogA-MoaB fusion proteins.
functional_coherence: COHERENT
coherence_reason: The family has a single subfamily (SF1). Its frozen entries are named molybdopterin
  adenylyltransferase or molybdenum cofactor biosynthesis bifunctional protein. The PAINT root PTN000022863
  asserts the adenylyltransferase activity with no loss rows, and the E. coli seed is the characterized
  MogA.
