family_id: PANTHER:PTHR13697
family_name: PHOSPHOFRUCTOKINASE
preferred_name: ATP-dependent 6-phosphofructokinase (PFK-1) family
summary: >-
  ATP-dependent phosphofructokinases phosphorylate fructose 6-phosphate to fructose 1,6-bisphosphate,
  the committed and most regulated step of glycolysis. The family contains bacterial PfkA, the S.
  cerevisiae alpha/beta hetero-octamer (PFK1, PFK2), S. pombe pfk1 and the animal PFKM/PFKL/PFKP
  isozymes.
functional_coherence: COHERENT
coherence_reason: All subfamilies are ATP-PFK-1 enzymes.
