notes: >-
  PAINT has six node-level IBD rows on four clade nodes, none at the family root and none negated. Only
  plasma membrane (PTN001156326) reaches the skywalker subfamily; the cached TBC1D24 GOA file carries
  that one IBA and no other. No Rab GTPase-activator term is propagated anywhere in the family, so the
  TBC1D24 gene review, which asserts no GAP activity, does not conflict with PAINT; the only tension is
  the PANTHER subfamily name. The cited paper allows that TBC1D24 "may catalyze the GTP hydrolysis of
  its downstream target in an alternative way", so the absence of GAP activity is not settled. Seeds resolved
  through UniProt (FBgn0013576 mtd, MGI:2179326 Oxr1, WBGene00018700 lmd-3). Not examined: the OXR1, NCOA7,
  MEAK7, TLDC2 and RTC5 subfamilies and their nodes, and the extent of the Opisthokonta node PTN001156326.
