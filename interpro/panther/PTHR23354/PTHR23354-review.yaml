  description: >-
    Human TBC1D24 and Drosophila skywalker: an N-terminal TBC domain and a C-terminal TLDc domain. Despite
    the PANTHER name, the TBC domain lacks the catalytic arginine finger of canonical Rab GTPase-activating
    proteins, and PAINT propagates no GTPase-activator term to this subfamily.
