family_id: PANTHER:PTHR23354
family_name: NUCLEOLAR PROTEIN 7/ESTROGEN RECEPTOR COACTIVATOR-RELATED
preferred_name: TLDc-domain proteins
summary: >-
  Proteins sharing a C-terminal TLDc domain. The family groups functionally unrelated subfamilies: OXR1
  and its orthologs (oxidative-stress resistance), the nuclear receptor coactivator NCOA7, the mTOR-associated
  MEAK7, TLDC2, yeast RTC5 and the TBC1D24/skywalker proteins, which pair the TLDc domain with an atypical
  TBC domain and act at presynaptic membranes and in neurite outgrowth.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The TLDc domain is the only shared feature. Subfamilies carry different second domains and functions
  (transcriptional coactivation for NCOA7, mTOR association for MEAK7, oxidative-stress protection for
  OXR1, membrane trafficking for TBC1D24), and PAINT accordingly places every term at a clade-level node
  rather than at the family root.
