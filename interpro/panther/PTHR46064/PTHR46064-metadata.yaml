  name:
    name: Queuine tRNA-ribosyltransferase
    short: Queuine_tRNA-ribosyltrfase
  description:
  - text: The Queuine tRNA-ribosyltransferase family is involved in the modification
      of tRNA molecules. Specifically, the QTRT2 subfamily members act as non-catalytic
      subunits in the queuine tRNA-ribosyltransferase (TGT) complex. This complex
      is responsible for the base-exchange of a guanine residue with queuine at the
      anticodon wobble position 34 in tRNAs that recognize codons starting with guanine
      (GU(N) anticodons). The tRNAs targeted include those for aspartic acid, asparagine,
      histidine, and tyrosine. The result of this modification is the formation of
      the hypermodified nucleoside queuosine, which is essential for accurate and
      efficient protein synthesis. Queuosine is known for its role in the translational
      regulation and maintenance of the stability and structure of tRNA.
