family_id: PANTHER:PTHR11444
family_name: ASPARTATEAMMONIA/ARGININOSUCCINATE/ADENYLOSUCCINATE LYASE
preferred_name: Class II fumarase (FumC/FH) family
summary: >-
  Although PANTHER names the family after the wider fumarase/aspartase lyase superfamily, the
  members classified here are class II, iron-independent, homotetrameric fumarate hydratases
  (EC 4.2.1.2): mitochondrial and cytosolic eukaryotic fumarases (yeast FUM1, S. pombe fum1, human
  FH) and bacterial FumC enzymes (P. putida FumC and FumC-I). All catalyse the reversible,
  stereospecific hydration of fumarate to (S)-malate, the TCA-cycle step between succinate
  oxidation and malate oxidation. Eukaryotic members are dual-localised, with a matrix pool for the
  TCA cycle and an extramitochondrial pool linked to the DNA damage response. Iron-sulfur class I
  fumarases (FumA/FumB) are unrelated and sit in other PANTHER families (e.g. PTHR43351 for
  P. putida PP_0897).
functional_coherence: COHERENT
coherence_reason: >-
  Both subfamilies (SF1 mitochondrial-type and SF22 bacterial class II) are fumarate hydratases;
  the only lineage-restricted property is mitochondrial targeting, which PAINT places at a
  eukaryotic node (PTN000154501).
