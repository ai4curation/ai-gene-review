family_name: CITRATE SYNTHASE
preferred_name: Bacterial type II citrate synthase (GltA) family
summary: >-
  Hexameric, NADH-inhibited type II citrate synthases of Gram-negative bacteria condense acetyl-CoA
  and oxaloacetate at the start of the TCA cycle (P. putida GltA, Methylorubrum GltA).
