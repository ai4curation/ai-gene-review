family_name: TRANSKETOLASE
preferred_name: Transketolase family
summary: >-
  ThDP-dependent transketolases of the non-oxidative pentose phosphate pathway (S. cerevisiae TKL1
  and TKL2, S. pombe SPBC2G5.05, E. coli TktA/TktB, plant chloroplast TKL). SF6 holds methylotrophic
  yeast dihydroxyacetone synthase (DAS1), a formaldehyde transketolase.
