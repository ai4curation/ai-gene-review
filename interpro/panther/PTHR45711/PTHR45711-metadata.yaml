  name:
    name: Chloride Channel/Proton-Coupled Anion Transporter
    short: ClC/H+-Cl-_Transporter
  description:
  - text: The Chloride Channel (ClC) family includes both chloride channels and proton-coupled
      anion transporters that exchange chloride or another anion for protons. Members
      of the ClcA subfamily function as proton-coupled chloride transporters, operating
      as antiport systems that exchange two chloride ions for one proton. They are
      likely involved in providing an electrical shunt for an outwardly-directed proton
      pump linked to amino acid decarboxylation, a mechanism that is part of the extreme
      acid resistance response in bacteria. Other subfamilies, such as ClC-3, ClC-4,
      and ClC-5, are characterized by strongly outwardly rectifying, electrogenic
      H(+)/Cl(-) exchangers that mediate the exchange of chloride ions against protons,
      playing roles in endosomal acidification, membrane excitability, and renal tubular
      function. The presence or absence of conserved gating glutamate residues distinguishes
      channel function from antiporter activity within the family.
