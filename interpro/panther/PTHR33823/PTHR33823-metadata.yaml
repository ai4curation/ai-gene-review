  name:
    name: RNA polymerase-binding transcription factor DksA
    short: DksA
  description:
  - text: The DksA family comprises transcription factors that interact directly with
      RNA polymerase (RNAP) to modulate gene expression. Members of the DksA family
      are involved in the negative regulation of rRNA expression and the positive
      regulation of amino acid biosynthesis promoters. They are also essential for
      the regulation of fis expression. By binding to RNAP, DksA proteins disrupt
      RNAP-DNA interactions, inhibit the formation of initiation complexes, and enhance
      the effects of ppGpp and initiating NTPs on rRNA transcription. They can inhibit
      transcript elongation, exonucleolytic RNA cleavage, and pyrophosphorolysis,
      while increasing intrinsic termination. Some family members are implicated in
      DNA double-strand break repair and in the expression of small RNAs that antagonize
      CsrA, thus playing a role in broader regulatory networks.
