  name:
    name: Mitochondrial Import Receptor TOM5
    short: Mito_Import_Receptor_TOM5
  description:
  - text: This family of proteins is involved in the mitochondrial import process.
      Members function as components of the TOM receptor complex, which is essential
      for recognizing and translocating proteins synthesized in the cytosol into the
      mitochondria. Specifically, these proteins contribute to the insertion of preproteins
      into the TOM40 translocation pore, facilitating their proper import into the
      mitochondrial matrix or integration into the mitochondrial membrane.
