family_id: PANTHER:PTHR11717
family_name: LOW MOLECULAR WEIGHT PROTEIN TYROSINE PHOSPHATASE
preferred_name: Low-molecular-weight phosphotyrosine protein phosphatase family
summary: >-
  PTHR11717 groups low-molecular-weight cysteine phosphatases with activity
  against phosphotyrosyl proteins or, in some bacterial branches, other
  phosphoamino-acid or polysaccharide-synthesis substrates. The one reviewed
  human member, ACP1/LMW-PTP, is a soluble cytoplasmic phosphotyrosine protein
  phosphatase whose active A and B splice isoforms also hydrolyze small
  phosphate monoesters, while isoform C lacks the active-site pocket.
functional_coherence: COHERENT
coherence_reason: >-
  The current PAINT assertion is limited to protein tyrosine phosphatase
  activity at PTN000197212 and is supported by human ACP1 together with yeast,
  fission-yeast, Drosophila and bacterial low-molecular-weight PTP donors.
  PAINT already records two Drosophila IRDs for losses below that positive
  node, and the human ACP1 lineage has no recorded IRD or IKR.
