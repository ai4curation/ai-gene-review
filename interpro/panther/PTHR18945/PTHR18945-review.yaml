family_id: PANTHER:PTHR18945
family_name: NEUROTRANSMITTER GATED ION CHANNEL
preferred_name: Pentameric ligand-gated ion channel (Cys-loop receptor) family
summary: 'The Cys-loop pentameric ligand-gated ion channels of animals. Five subunits assemble around
  a central pore that opens when a neurotransmitter or other ligand binds the extracellular domain. The
  family contains the cation-selective nicotinic acetylcholine receptors (nAChRs), 5-HT3 serotonin receptors
  and the zinc-activated channel ZAC. It also contains the anion-selective GABA-A and glycine receptors
  and a large set of invertebrate chloride channels gated by glutamate, histamine, acetylcholine, serotonin,
  tyramine or protons. Within the cation lineage there are further divergent groups: the C. elegans proton-gated
  PBO-5/PBO-6 channel, the vertebrate alpha9/alpha10 receptor of cochlear efferent synapses, and the cephalopod
  chemotactile receptors (octopus CRT1), which evolved from nAChRs to detect terpenes. PANTHER defines
  177 subfamilies. Our gene reviews in this family are all nAChR subunits plus CRT1, and none carries
  a PANTHER subfamily cross-reference, so this review works at the level of PAINT nodes.'
functional_coherence: HETEROGENEOUS
coherence_reason: 'The family spans opposite ion selectivities (cation channels such as nAChR, 5-HT3 and
  ZAC; anion channels such as GABA-A, glycine receptor and invertebrate GluCl/HisCl/ACC/pHCl) and at least
  eight different agonists. Only the architecture-level claims hold family-wide: being a pentameric transmembrane
  channel at the plasma membrane, and ion transmembrane transport. Every ligand-specific activity, every
  transmitter-specific synaptic process and every selectivity-specific transport term belongs to a clade.'
