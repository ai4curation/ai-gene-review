  assessment: SOUND
  assessment_reason: 'Although labelled taxon:2759, this node is the root of the cation-selective clade,
    not of the family: in PANTHER''s leaf GAF its human recipients are the 17 nAChR subunits, CHRFAM7A
    and the five 5-HT3 subunits, and no GABA-A or glycine receptor subunit inherits it. Calcium permeation
    is documented for the nAChRs, and 20 of the 24 member reviews that receive the row accept it. The
    ZAC branch is cut by the IRD at PTN008566881. The worm DEG-3 group subunit ACR-18 is left UNDECIDED
    in its review for lack of a selectivity measurement, which is a gap in the data, not evidence that
    calcium permeability was lost.'
