  assessment: UNRESOLVED
  assessment_reason: 'Placed on the large anion-selective clade: vertebrate glycine receptors plus invertebrate
    glutamate-, histamine-, acetylcholine-, serotonin- and pH-gated chloride channels (GluClalpha, HisCl1,
    pHCl, C. elegans ACC-1-4, GLC-1-4, AVR-14/15, MOD-1). The term''s definition requires channel opening
    to increase membrane potential, which fits cation channels. Chloride channels in mature neurons are
    inhibitory, and the same node asserts chloride transmembrane transport. Inhibitory extracellular ligand-gated
    channel activity (GO:0005237) fits the clade better. The seeds are experimental, though, and depolarizing
    glycinergic currents occur in immature neurons. No member of this clade has a gene review, so this
    is flagged rather than overruled.'
