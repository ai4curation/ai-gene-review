- assessed_term:
    id: GO:0005886
    label: plasma membrane
  scope: FAMILY_WIDE
  scope_reason: Every member is a surface pentameric channel. PAINT asserts it at PTN001054635, whose
    human recipients include all nAChR, 5-HT3, ZAC, GABA-A and glycine receptor subunits, and every member
    review accepts it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR18945/PTHR18945-paint.tsv
    supporting_text: "PTHR18945\tPTN001054635\tGO:0005886\tC\tIBD\tfalse"
  - reference_id: file:genes/human/CHRNA1/CHRNA1-ai-review.yaml
    supporting_text: Retain the active plasma-membrane receptor pool.
- assessed_term:
    id: GO:0034220
    label: monoatomic ion transmembrane transport
  scope: FAMILY_WIDE
  scope_reason: 'Every member is a ligand-gated ion channel, so the term is true family-wide, whichever
    ion passes. PAINT places it only at the cation-lineage root (PTN000434994); the anion clades carry
    chloride transmembrane transport, which is a descendant. The selectivity-specific children are clade-scoped:
    cation transmembrane transport for the cation lineage, chloride transmembrane transport for the anion
    lineages.'
  supported_by:
  - reference_id: PMID:32272141
    supporting_text: members of this family have evolved differential selectivities for cations and anions
- assessed_term:
    id: GO:0006816
    label: calcium ion transport
  scope: UNRESOLVED
  scope_reason: It can only apply within the cation-selective lineage (PTN000434994), and never to the
    anion clades, which PAINT already keeps out of reach. Within the cation lineage calcium permeability
    varies with subunit composition, and has not been measured for the nematode DEG-3 group, ZAC or most
    invertebrate members. This cannot yet be expressed as a subfamily scope, because no reviewed member
    carries a PANTHER subfamily cross-reference.
  supported_by:
  - reference_id: file:genes/worm/acr-18/acr-18-ai-review.yaml
    supporting_text: Many nAChRs are Ca2+-permeable, but calcium permeability differs widely among subunit
      compositions.
- assessed_term:
    id: GO:0050910
    label: detection of mechanical stimulus involved in sensory perception of sound
  scope: NOT_APPLICABLE
  scope_reason: No member detects mechanical stimuli. The only route into the family is the alpha10 node
    (PTN002707806), and alpha9/alpha10 receptors carry efferent cholinergic signals to hair cells. All
    three alpha10 reviews mark the row over-annotated.
  supported_by:
