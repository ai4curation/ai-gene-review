notes: 'Node membership was read from PANTHER''s current leaf GAF (gene_association.paint_uniprot.gaf.gz)
  by collecting the leaf IBAs whose with/from names each node. Labels such as taxon:2759 on PTN000434994
  do not match the clade content, so membership was taken from the leaves. 60 of the 85 PAINT rows are
  assessed: every row that reaches one of the 24 reviewed nAChR members, all IRD rows, and the PBO-5/PBO-6
  and anion-clade rows flagged above. The 25 unassessed rows are gains on the GABA-A (PTN008360627, PTN008566841,
  PTN008360792), glycine receptor (PTN001055255, PTN002707984, the remaining PTN001055382 rows), 5-HT3
  (PTN002707828/854/863 gains) and worm PTN001450542 nodes, none of which has a reviewed member here.
  Upstream suggestions for PAINT: (1) add IRDs for the PBO-5/PBO-6 branch at PTN000435512 (GO:0022848),
  PTN001825278 (GO:0005892) and PTN001054960 (GO:0007271); (2) withdraw the GO:0042391 IRDs on the 5-HT3
  nodes; (3) move the serotonin-gated gain from PTN004502671 down to the 5-HT3 clade root, which retires
  three IRDs; (4) remove GO:0050910 from PTN002707806; (5) check GO:0005231 (excitatory) on the anion-selective
  PTN001055382.'
