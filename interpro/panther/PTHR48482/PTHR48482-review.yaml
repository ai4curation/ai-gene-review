family_id: PANTHER:PTHR48482
family_name: INTERLEUKIN-19-RELATED
preferred_name: IL-10 subfamily of class-II alpha-helical cytokines (IL-10, IL-19, IL-20,
  IL-24, IL-26 and the virally captured IL-10 mimics)
summary: >-
  Secreted class-II cytokines of the IL-10 group: compact, mostly amphipathic
  six-helix-bundle proteins (IL-10 itself is an intertwined domain-swapped homodimer)
  that signal through pairs of class-II cytokine receptor chains and converge on
  JAK/TYK2-driven STAT3 phosphorylation. All members are secreted and all are cytokines,
  so secretion, cytokine activity, participation in immune responses and positive
  regulation of JAK-STAT signalling are true throughout. What is *not* shared is the
  receptor used and, critically, the direction of the immunological effect. IL-10 (SF5)
  acts on haematopoietic cells through IL-10RA/IL-10RB and is the prototypical
  anti-inflammatory cytokine, suppressing pro-inflammatory cytokine production and MHC
  class II expression. IL-19, IL-20 and IL-24 (SF3, SF2, SF4) act mainly on epithelium
  through IL-20 receptor complexes (IL-20RA/IL-20RB, with IL-22RA1/IL-20RB additionally
  used by IL-20), and IL-26 (SF1) acts on epithelium through IL-20RA/IL-10RB; these
  members are associated with epithelial defence, keratinocyte and mucosal responses and
  are frequently pro-inflammatory. The IL-10 subfamily (SF5) also contains virally
  captured homologs (Epstein-Barr virus BCRF1, human cytomegalovirus UL111A, equine
  herpesvirus 2 E7), which retain IL-10-like immunosuppressive activity but exercise it
  as host-immune-evasion factors rather than as part of a host immune response. Note
  that IL-22, often discussed alongside these cytokines, is *not* a member of this
  PANTHER family. The InterPro slice records 2786 proteins across 2506 taxa (integrated
  entry IPR020443); the fetched entries.csv covers the 43 reviewed (UniProtKB/Swiss-Prot)
  members, which are all vertebrate or herpesviral.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Coherent at the level of "secreted class-II cytokine signalling to STAT3", but
  heterogeneous in the two respects that matter for term propagation: receptor identity
  and the direction of immune regulation. The IL-10 subfamily (SF5) is anti-inflammatory
  and IL-10-receptor-specific; the epithelial members IL-19/IL-20/IL-24 (SF3/SF2/SF4)
  and IL-26 (SF1) use IL-20 receptor complexes and are largely pro-inflammatory - IL-26
  carries an IDA to GO:0001819 (positive regulation of cytokine production, PMID:18483078),
  the exact opposite of IL-10's GO:0001818, and IL-20 is curated as a regulator of skin
  inflammation (PMID:11470428). A third, finer split sits *inside* SF5: the herpesviral
  IL-10 homologs are immune-evasion mimics, so host-process framings do not transfer to
  them even though the biochemistry does.
reference_protein:
  id: UniProtKB:P22301
  label: Interleukin-10
  gene_symbol: IL10
  organism: Homo sapiens
  gene_review: genes/human/IL10/IL10-ai-review.yaml

subfamilies:
  - subfamily_id: PANTHER:PTHR48482:SF5
    label: INTERLEUKIN-10
    description: >-
      IL-10 orthologs across mammals, birds and fish, plus the virally captured IL-10
      homologs (EBV BCRF1, HCMV UL111A, EHV-2 E7). Signals through IL-10RA/IL-10RB to
      JAK1/TYK2 and STAT3 and suppresses pro-inflammatory cytokine production, MHC class
      II expression and T cell activation. This is the only subfamily for which the
      IL-10-specific terms (interleukin-10 receptor binding, interleukin-10-mediated
      signaling pathway) and the anti-inflammatory direction terms are appropriate. The
      largest subfamily in the reviewed slice (23 cellular + 6 viral entries of 43).
    representative_members:
      - id: UniProtKB:P22301
        label: Interleukin-10
        gene_symbol: IL10
        organism: Homo sapiens
        gene_review: genes/human/IL10/IL10-ai-review.yaml
      - id: UniProtKB:P18893
        label: Interleukin-10
        gene_symbol: Il10
        organism: Mus musculus
      - id: UniProtKB:Q6A2H4
        label: Interleukin-10
        gene_symbol: IL10
        organism: Gallus gallus
      - id: UniProtKB:P03180
        label: Viral interleukin-10 homolog
        gene_symbol: BCRF1
        organism: Epstein-Barr virus (strain B95-8)
  - subfamily_id: PANTHER:PTHR48482:SF1
    label: INTERLEUKIN-26
    description: >-
      IL-26, a Th17/Th1-derived cytokine with no murine ortholog, acting on epithelium
      through IL-20RA/IL-10RB. Shares IL-10RB and STAT3 activation with IL-10 but not the
      anti-inflammatory outcome.
    representative_members:
      - id: UniProtKB:Q9NPH9
        label: Interleukin-26
        gene_symbol: IL26
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      Pro-inflammatory rather than anti-inflammatory: GOA records IDA annotations to
      GO:0001819 (positive regulation of cytokine production) and GO:0045944 from
      PMID:18483078, and the paper reports increased pro-inflammatory gene expression in
      intestinal epithelial cells and upregulation in active Crohn's disease. It uses
      IL-20RA/IL-10RB, not the IL-10 receptor, so interleukin-10 receptor binding and the
      interleukin-10-mediated signaling pathway do not apply.
  - subfamily_id: PANTHER:PTHR48482:SF2
    label: INTERLEUKIN-20
    description: >-
      IL-20, acting on keratinocytes and other epithelia through IL-20RA/IL-20RB and
      IL-22RA1/IL-20RB.
    representative_members:
      - id: UniProtKB:Q9NYY1
        label: Interleukin-20
        gene_symbol: IL20
        organism: Homo sapiens
      - id: UniProtKB:Q9JKV9
        label: Interleukin-20
        gene_symbol: Il20
        organism: Mus musculus
    diverged_from_family: true
    divergence_description: >-
      Epithelial/keratinocyte effector rather than a suppressor of myeloid inflammation;
      GOA curates it to GO:0050727 (regulation of inflammatory response) and to
      keratinocyte differentiation terms from PMID:11470428, and to GO:0045517/GO:0045518
      (interleukin-20 receptor binding), not to IL-10 receptor binding.
  - subfamily_id: PANTHER:PTHR48482:SF3
    label: INTERLEUKIN-19
    description: >-
      IL-19, secreted mainly by monocytes and epithelial cells and signalling through
      IL-20RA/IL-20RB to STAT3.
    representative_members:
      - id: UniProtKB:Q9UHD0
        label: Interleukin-19
        gene_symbol: IL19
        organism: Homo sapiens
      - id: UniProtKB:Q8CJ70
        label: Interleukin-19
        gene_symbol: Il19
        organism: Mus musculus
    diverged_from_family: true
    divergence_description: >-
      Uses the IL-20 receptor pair rather than IL-10RA/IL-10RB, and acts on epithelium
      rather than suppressing macrophage/T cell activation, so neither the IL-10-specific
      receptor-binding and pathway terms nor the anti-inflammatory direction term should
      descend here.
  - subfamily_id: PANTHER:PTHR48482:SF4
    label: INTERLEUKIN-24
    description: >-
      IL-24 (MDA-7), signalling through IL-20RA/IL-20RB and IL-22RA1/IL-20RB, with a
      well-documented tumour-selective apoptosis-inducing activity.
    representative_members:
      - id: UniProtKB:Q13007
        label: Interleukin-24
        gene_symbol: IL24
        organism: Homo sapiens
      - id: UniProtKB:Q925S4
        label: Interleukin-24
        gene_symbol: Il24
        organism: Mus musculus
    diverged_from_family: true
    divergence_description: >-
      GOA curates IL-24 to apoptotic process (GO:0006915) and cell-proliferation
      regulation rather than to suppression of inflammation; it does not use the IL-10
      receptor. The IL-10-specific and anti-inflammatory terms must not reach this clade.

node_assessments:
  - node_id: PANTHER:PTN009232391
    asserted_term:
      id: GO:0005576
      label: extracellular region
    paint_snapshot: "20260828"
    seeds:
      - id: MGI:MGI:1890473
      - id: MGI:MGI:2135548
      - id: MGI:MGI:96537
      - id: RGD:2886
      - id: RGD:621484
      - id: UniProtKB:P22301
        label: Interleukin-10
        organism: Homo sapiens
      - id: UniProtKB:Q13007
        label: Interleukin-24
        organism: Homo sapiens
      - id: UniProtKB:Q6A2H4
        label: Interleukin-10
        organism: Gallus gallus
      - id: UniProtKB:Q9NPH9
        label: Interleukin-26
        organism: Homo sapiens
      - id: UniProtKB:Q9NYY1
        label: Interleukin-20
        organism: Homo sapiens
      - id: UniProtKB:Q9UHD0
        label: Interleukin-19
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Every member is a secreted cytokine with a cleaved signal peptide, and the seed set
      spans all five subfamilies, so the location assertion is safe at the family root.
      This row also documents a term update rather than a new claim: human IL10's cached
      goa.tsv still carries the older IBA to GO:0005615 (dated 20241010), which is now the
      obsolete "obsolete extracellular space" term, while current GO_Central propagation
      from this node gives IL10, IL19, IL20, IL24 and IL26 GO:0005576 (dated 20260601,
      checked in QuickGO on 2026-09-04). The gene-side GOA snapshot, not the PAINT
      curation, is the stale artefact here.
  - node_id: PANTHER:PTN009232391
    asserted_term:
      id: GO:0005125
      label: cytokine activity
    paint_snapshot: "20260828"
    seeds:
      - id: MGI:MGI:1890473
      - id: MGI:MGI:96537
      - id: UniProtKB:P22301
        label: Interleukin-10
        organism: Homo sapiens
      - id: UniProtKB:Q9NPH9
        label: Interleukin-26
        organism: Homo sapiens
      - id: UniProtKB:Q9UHD0
        label: Interleukin-19
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Cytokine activity is the one molecular function every member has, independently
      confirmed by member-specific experimental annotations outside the seed set (IL-26
      IDA from PMID:18483078, IL-19 IDA from PMID:35479078). The seeds include IL-10,
      IL-19 and IL-26, i.e. both sides of the anti-/pro-inflammatory split, so the
      placement at the family root is well grounded. P22301 appearing among its own IBA
      sources is expected: IL-10's experimental annotation is one of the descendant
      evidences the IBD rests on.
  - node_id: PANTHER:PTN009232391
    asserted_term:
      id: GO:0006955
      label: immune response
    paint_snapshot: "20260828"
    seeds:
      - id: RGD:2886
      - id: UniProtKB:P22301
        label: Interleukin-10
        organism: Homo sapiens
      - id: ZFIN:ZDB-GENE-051111-1
    assessment: SOUND
    assessment_reason: >-
      Broad enough to be direction-neutral: it is satisfied by IL-10's suppression of
      myeloid activation and equally by the epithelial-defence roles of IL-19, IL-20,
      IL-24 and IL-26, so it does not smuggle in a direction the epithelial members do not
      share. The one group for which the framing would be wrong is the herpesviral IL-10
      homologs inside SF5, which act to evade the host immune response rather than to
      mount one; in practice GO_Central emits no IBAs at all to the viral entries
      (P03180 and P17150 return zero ECO:0000318 annotations in QuickGO, checked
      2026-09-04), so nothing needs pruning today. No affected subfamily is named because
      the viral members share SF5 with cellular IL-10 - the boundary is a clade inside a
      subfamily, not a subfamily.
  - node_id: PANTHER:PTN009232481
    asserted_term:
      id: GO:0046427
      label: positive regulation of receptor signaling pathway via JAK-STAT
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20241010"
    seeds:
      - id: UniProtKB:P22301
        label: Interleukin-10
        organism: Homo sapiens
      - id: UniProtKB:Q9NPH9
        label: Interleukin-26
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      JAK/STAT activation is the shared mechanism of the whole family - every member
      engages a class-II receptor pair and drives STAT3 phosphorylation - and the two
      seeds deliberately straddle the functional split (anti-inflammatory IL-10 and
      pro-inflammatory IL-26), each with its own IDA for the term. If anything this node
      is placed conservatively: the term is at least as safe at PTN009232391, since
      IL-19, IL-20 and IL-24 also signal to STAT3 through IL-20 receptor complexes but do
      not currently receive it.
  - node_id: PANTHER:PTN009232481
    asserted_term:
      id: GO:0050728
      label: negative regulation of inflammatory response
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20260828"
    seeds:
      - id: MGI:MGI:96537
      - id: UniProtKB:P22301
        label: Interleukin-10
        organism: Homo sapiens
      - id: ZFIN:ZDB-GENE-051111-1
    assessment: SOUND
    assessment_reason: >-
      The assertion itself is exactly right for the IL-10 clade - three independent
      vertebrate seeds (mouse, human, zebrafish) and the strongest experimental record in
      the family - and its current scope is correct in the propagated data: only IL-10
      orthologs receive it (human P22301 and mouse Il10, both dated 20260601 in QuickGO on
      2026-09-04). It is nevertheless the one row in this family that has to stay watched,
      because it is a *direction* term on a node that is not IL-10-only: IL-26 descends
      from PTN009232481 (its GO:0046427 IBA names this node) yet does not receive
      GO:0050728, which means an IRD or equivalent scoping is holding the epithelial
      branch back. That exclusion must be preserved. IL-26 is curated to the opposite
      direction (GO:0001819, IDA, PMID:18483078) and IL-20 to skin inflammation
      (PMID:11470428), so if a future release moved this term to PTN009232391 or dropped
      the exclusion, the assessment would become TOO_DEEP.
  - node_id: PANTHER:PTN009232481
    asserted_term:
      id: GO:0140105
      label: interleukin-10-mediated signaling pathway
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20260828"
    seeds:
      - id: RGD:2886
      - id: UniProtKB:P22301
        label: Interleukin-10
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Effectively tautological for the IL-10 clade, whose members are the defining ligand
      of this pathway, and correctly scoped in practice: it reaches human and mouse IL-10
      only (QuickGO, 2026-09-04). Like GO:0050728 it sits on a node with non-IL-10
      descendants, and it is receptor-specific rather than merely directional, so it must
      never reach IL-19/IL-20/IL-24 (IL-20RA/IL-20RB) or IL-26 (IL-20RA/IL-10RB) - sharing
      the IL-10RB chain is not the same as signalling through the IL-10 receptor.

term_assessments:
  - assessed_term:
      id: GO:0005125
      label: cytokine activity
    scope: FAMILY_WIDE
    scope_reason: >-
      The defining molecular function of every member, already asserted at the family root
      and independently supported by member-level experimental annotations across
      subfamilies.
  - assessed_term:
      id: GO:0005576
      label: extracellular region
    scope: FAMILY_WIDE
    scope_reason: >-
      All members are signal-peptide-bearing secreted proteins. Prefer this term over the
      now-obsolete GO:0005615 that older IBA rows (including human IL10's cached GOA)
      still carry.
  - assessed_term:
      id: GO:0006955
      label: immune response
    scope: FAMILY_WIDE
    scope_reason: >-
      Direction-neutral and true for both the anti-inflammatory IL-10 clade and the
      epithelial IL-19/IL-20/IL-24/IL-26 clades. The only members it misdescribes are the
      herpesviral IL-10 mimics, which sit inside SF5 and so cannot be excluded by a
      subfamily scope; they currently receive no IBAs at all.
  - assessed_term:
      id: GO:0046427
      label: positive regulation of receptor signaling pathway via JAK-STAT
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member engages a class-II cytokine receptor pair and drives JAK/TYK2-dependent
      STAT3 phosphorylation; IL-10 and IL-26 each hold an independent IDA. Safe to extend
      from PTN009232481 to the family root, which would additionally give it to IL-19,
      IL-20 and IL-24.
  - assessed_term:
      id: GO:0019221
      label: cytokine-mediated signaling pathway
    scope: FAMILY_WIDE
    scope_reason: >-
      Not currently asserted by PAINT in this family, but safe everywhere and a better
      family-level home for the shared signalling biology than any IL-10-specific pathway
      term. Recommended to a future PAINT curator as a family-root addition.
  - assessed_term:
      id: GO:0050727
      label: regulation of inflammatory response
    scope: FAMILY_WIDE
    scope_reason: >-
      This is the answer to the family's central question: an inflammation term is safe
      family-wide only if it is direction-neutral. Every member modulates inflammation -
      IL-10 by suppressing myeloid cytokine output, IL-19/IL-20/IL-24 as epithelial
      effectors, IL-26 by increasing pro-inflammatory gene expression - so the parent
      regulation term holds throughout while its negative child does not. IL-20 is already
      curated to exactly this term (TAS, PMID:11470428).
    supported_by:
      - reference_id: PMID:11470428
        supporting_text: "yet it appears to be an autocrine factor for keratinocytes that regulates"
      - reference_id: PMID:18483078
        supporting_text: "increases the mRNA expression of proinflammatory cytokines but decreases cell"
  - assessed_term:
      id: GO:0050728
      label: negative regulation of inflammatory response
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The anti-inflammatory direction is an IL-10 clade property, not a family property.
      IL-26 carries an IDA to the opposite term (GO:0001819, positive regulation of
      cytokine production, PMID:18483078) and is upregulated in active Crohn's disease;
      IL-20 is a keratinocyte effector in skin inflammation (PMID:11470428); IL-24's
      curated roles are apoptotic and proliferative rather than inflammation-suppressing.
      Safe only for SF5, where it rests on human, mouse and zebrafish experimental
      evidence.
    applicable_subfamilies:
      - id: PANTHER:PTHR48482:SF5
        label: INTERLEUKIN-10
    supported_by:
      - reference_id: PMID:1940799
        supporting_text: "IL-10, added to monocytes, activated by interferon gamma (IFN-gamma), LPS, or combinations of LPS and IFN-gamma at the onset of the cultures, strongly inhibited the production of IL-1 alpha, IL-1 beta, IL-6, IL-8, TNF alpha, GM-CSF, and G-CSF at the transcriptional level."
      - reference_id: PMID:18483078
        supporting_text: "increases the mRNA expression of proinflammatory cytokines but decreases cell"
  - assessed_term:
      id: GO:0001818
      label: negative regulation of cytokine production
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Same split, stated at the level of the assay that defines IL-10: inhibition of
      IL-1/IL-6/IL-8/TNF/GM-CSF output by activated monocytes. IL-26 is annotated to the
      opposite term from an IDA, so this must not descend outside SF5. Within SF5 it also
      covers the viral homologs, which reproduce the cytokine-suppressing activity.
    applicable_subfamilies:
      - id: PANTHER:PTHR48482:SF5
        label: INTERLEUKIN-10
    supported_by:
      - reference_id: PMID:1940799
        supporting_text: "Viral-IL-10, which has similar biological activities on human cells, also inhibited the production of TNF alpha and GM-CSF by monocytes following LPS activation."
  - assessed_term:
      id: GO:0140105
      label: interleukin-10-mediated signaling pathway
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Receptor-specific: only the IL-10 clade signals through IL-10RA/IL-10RB.
      IL-19/IL-20/IL-24 use IL-20RA/IL-20RB (IL-20 additionally IL-22RA1/IL-20RB) and
      IL-26 uses IL-20RA/IL-10RB; sharing the IL-10RB signal-transducing chain does not
      make a cytokine an IL-10-pathway ligand.
    applicable_subfamilies:
      - id: PANTHER:PTHR48482:SF5
        label: INTERLEUKIN-10
    supported_by:
      - reference_id: PMID:18483078
        supporting_text: "RESULTS: All examined intestinal epithelial cell (IEC) lines express both IL-26"
  - assessed_term:
      id: GO:0005141
      label: interleukin-10 receptor binding
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The molecular-function counterpart of the pathway term, and unsafe outside SF5 for
      the same reason. The IL-10/IL-10R1/IL-10R2 assembly has been mapped in detail
      (PMID:16982608); the other subfamilies bind IL-20 receptor complexes, and GOA
      curates IL-20 to GO:0045517/GO:0045518 (interleukin-20 receptor binding) instead.
    applicable_subfamilies:
      - id: PANTHER:PTHR48482:SF5
        label: INTERLEUKIN-10
    supported_by:
      - reference_id: PMID:16982608
        supporting_text: "The ternary IL-10 signaling complex is assembled in a sequential order with the IL-10.IL-10R1 interaction occurring first followed by engagement of the IL-10R2 chain."
  - assessed_term:
      id: GO:0005126
      label: cytokine receptor binding
    scope: FAMILY_WIDE
    scope_reason: >-
      The chemistry-neutral parent that is safe everywhere: every member binds a class-II
      cytokine receptor chain pair. Offered as the family-level alternative to the
      IL-10-specific receptor-binding term, and as a better molecular-function anchor than
      bare protein binding.

