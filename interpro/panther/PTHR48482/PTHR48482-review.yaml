review_status: NEEDS_REVIEW
reviewed_by: AI-assisted PAINT no-IBA project family review
review_date: "2026-09-04"
notes: >-
  Written to support the human IL10 gene review. All node ids, asserted terms, seeds,
  taxa and snapshot dates are verbatim from the cached PTHR48482-paint.tsv; subfamily
  accessions and official names, and the member/taxon spread, are from
  PTHR48482-entries.csv; counts are from PTHR48482-metadata.yaml. Propagation outcomes
  quoted in the assessments were checked against QuickGO on 2026-09-04 for P22301,
  P18893, Q9UHD0, Q9NYY1, Q13007, Q9NPH9, Q8CJ70, P03180 and P17150.

  On the project's premise: IL10 is on the PAINT "human no-IBA" list, but that is list
  staleness, not node scoping or pruning. P22301 currently receives six IBAs - GO:0005125,
  GO:0005576 and GO:0006955 from PTN009232391, and GO:0046427, GO:0050728 and GO:0140105
  from PTN009232481 - and its own cached goa.tsv already contains all six. The only
  genuine staleness is on the gene side and in the opposite direction: IL10's GOA snapshot
  still records the extracellular IBA as GO:0005615, which the ontology has since
  obsoleted and PAINT has already replaced with GO:0005576. The IL10 gene review
  consequently accepts GO:0005615 rows that a re-fetch should convert to GO:0005576; that
  is a gene-side follow-up, not a family-level problem.

  IL-22 is not in this family despite being part of the IL-10 cytokine group in the
  literature, so no assessment here speaks to it.

  Background noted for context only: the IL10 gene review documents four GO_REF:0000024
  ISS rows whose WITH/FROM accession is UniProtKB:P06804 (mouse TNF), transferring
  canonical TNF activities onto IL-10 across a fold boundary. That is an ISS-pipeline
  defect with no bearing on PAINT - none of those terms appear at either node here - but
  it is a reminder that the noisiest annotations on this gene are not the phylogenetic
  ones.

  No residue_sites: nothing in this family's term propagation turns on individual
  positions. The boundaries are receptor choice and the direction of the immune effect,
  both clade-level properties, and the IL-10R1/IL-10R2 interfaces are helix-face surfaces
  rather than point residues.
