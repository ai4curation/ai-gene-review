family_id: PANTHER:PTHR11404
family_name: SUPEROXIDE DISMUTASE 2
preferred_name: Manganese/iron superoxide dismutase (SodA/SOD2) family
summary: >-
  Mn- and Fe-containing superoxide dismutases dismutate superoxide in the mitochondrial matrix (eukaryotic
  SOD2) or cytosol (bacterial SodA/SodB). The family contains bacterial SodA, S. cerevisiae SOD2,
  S. pombe sod2, C. elegans sod-2/sod-3, human SOD2 and plant MSD/FSD isozymes.
functional_coherence: COHERENT
coherence_reason: >-
  All subfamilies are superoxide dismutases; they differ in metal (Mn or Fe) and compartment.
