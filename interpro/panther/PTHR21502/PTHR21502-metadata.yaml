  name:
    name: DZIP and RILPL
    short: DZIP_RILPL
  description:
  - text: The DZIP/RILPL protein family is involved in the assembly and function of
      cilia, as well as in cellular transport and cell shape and polarity regulation.
      Members of the family, such as DZIP1 and DZIP1L, act as molecular adapters recruiting
      protein complexes to the cilium basal body, facilitating vesicle-mediated transport
      of proteins, and playing roles in Hedgehog signaling and spermatogenesis. They
      are also involved in the organization of the basal body and assembly of the
      sperm flagellum. RILPL proteins, on the other hand, are involved in the regulation
      of cell shape and polarity, cellular protein transport, and neuroprotection
      by sequestering GAPDH in the cytosol. They also interact with RAB10, influencing
      ciliogenesis. Overall, the family contributes to the structural and functional
      integrity of cilia, cellular organization, and signaling pathways.
