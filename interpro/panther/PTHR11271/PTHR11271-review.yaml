family_id: PANTHER:PTHR11271
family_name: GUANINE DEAMINASE
preferred_name: Guanine deaminase (GuaD/GUD1/GDA) amidohydrolase family
summary: >-
  Zinc-dependent amidohydrolases that deaminate guanine to xanthine in purine catabolism (bacterial
  GuaD, S. cerevisiae GUD1, S. pombe SPCC1672.03c, human GDA). A small subfamily (SF48) contains
  HutF formimidoylglutamate deiminases of histidine utilization.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Guanine deaminase activity is uniform in SF6. SF48 HutF deiminates formimidoylglutamate instead.
reference_protein:
  id: UniProtKB:Q07729
  label: Probable guanine deaminase
  gene_symbol: GUD1
  organism: Saccharomyces cerevisiae
  gene_review: genes/yeast/GUD1/GUD1-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR11271:SF6
  label: GUANINE DEAMINASE
  description: Guanine deaminases.
  representative_members:
  - id: UniProtKB:Q07729
    gene_symbol: GUD1
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/GUD1/GUD1-ai-review.yaml
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR11271:SF48
  label: AMIDOHYDROLASE-RELATED DOMAIN-CONTAINING PROTEIN
  description: >-
    HutF formimidoylglutamate deiminases (EC 3.5.3.13), which hydrolyse
    N-formimidoyl-L-glutamate to N-formyl-L-glutamate and ammonia in the
    two-step HutF/HutG terminal branch of histidine utilization. Pseudomonas
    aeruginosa HutF (Q9HU77) is the biochemically characterized member and
    the PAINT seed; P. putida KT2440 HutF (Q88CZ3) is placed here by its
    UniProt PANTHER cross-reference.
  representative_members:
  - id: UniProtKB:Q9HU77
    label: Formimidoylglutamate deiminase
    gene_symbol: hutF
    organism: Pseudomonas aeruginosa PAO1
    gene_review: genes/PSEAE/hutF/hutF-ai-review.yaml
  - id: UniProtKB:Q88CZ3
    label: Formimidoylglutamate deiminase
    gene_symbol: hutF
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/hutF/hutF-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Deiminate the formimidoyl amidine of N-formimidoyl-L-glutamate in
    histidine utilization rather than deaminating guanine in purine
    catabolism.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11271/PTHR11271-entries.csv
    supporting_text: "Q9HU77,Formimidoylglutamate deiminase"
  - reference_id: file:PSEPK/hutF/hutF-uniprot.txt
    supporting_text: "DR   PANTHER; PTHR11271:SF48; AMIDOHYDROLASE-RELATED DOMAIN-CONTAINING PROTEIN; 1."
  - reference_id: PMID:17128965
    supporting_text: >-
      N-Formimino-l-glutamate iminohydrolase (HutF) from Pseudomonas aeruginosa
      catalyzes the deimination of N-formimino-l-glutamate in the histidine
      degradation pathway.
