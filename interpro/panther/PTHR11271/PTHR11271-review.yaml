  - id: RGD:621617
  - id: SGD:S000002397
  - id: UniProtKB:P76641
  - id: UniProtKB:Q9Y2T3
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node is seeded by guanine deaminases, for which deaminase activity is
    correct. It also sits above the SF48 HutF enzymes, which receive the
    term by IBA (P. aeruginosa HutF) and TreeGrafter (P. putida HutF). HutF
    hydrolyses a formimidoyl amidine to release ammonia; in GO its activity
    (GO:0050416) is placed under linear-amidine hydrolases, not under
    deaminase activity, so the inherited term names the wrong chemistry for
    SF48 and should be blocked there.
