        label: SUN domain-containing protein 2
        gene_symbol: Sun2
        organism: Mus musculus
  - subfamily_id: PANTHER:PTHR12911:SF44
    label: SUN DOMAIN-CONTAINING PROTEIN 5
    description: >-
      Mammalian SUN5, part of the amniote testis-SUN clade PTN000308291 together with
      SF16 (SPAG4) and SF24 (SUN3).
    representative_members:
      - id: UniProtKB:Q8TC36
        label: SUN domain-containing protein 5
        gene_symbol: SUN5
        organism: Homo sapiens
        gene_review: genes/human/SUN5/SUN5-ai-review.yaml
      - id: UniProtKB:Q9DA32
        label: SUN domain-containing protein 5
        gene_symbol: Sun5
        organism: Mus musculus
    diverged_from_family: true
    divergence_description: >-
      Post-meiotic, spermatid-specific LINC function. SUN5 pairs with nesprin-3 and binds
      lamin B1 at the posterior nuclear envelope (implantation fossa) to anchor the
      head-tail coupling apparatus. Sun5 knockout leaves meiosis intact. SUN3 (SF24, with
      nesprin-1) and SPAG4 (SF16) are likewise spermiogenesis-specific, in manchette and
      sperm-head shaping. The anchoring activity is the family's. Its context is not
      meiotic, so the meiotic complex term should not descend here.
  - subfamily_id: PANTHER:PTHR12911:SF24
    label: SUN DOMAIN-CONTAINING PROTEIN 3
    description: >-
      Amniote SUN3, testis-SUN clade. Mouse Sun3 is one of the five seeds of the meiotic
      complex IBD at PTN000308197, but its seed evidence (PMID:20711465) describes a
      spermiogenesis-specific Sun3-nesprin-1 LINC complex, not a meiotic one.
    representative_members:
      - id: UniProtKB:Q8TAQ9
        label: SUN domain-containing protein 3
        gene_symbol: SUN3
        organism: Homo sapiens
      - id: UniProtKB:Q5SS91
        label: SUN domain-containing protein 3
        gene_symbol: Sun3
        organism: Mus musculus
    diverged_from_family: true
    divergence_description: >-
      Spermiogenesis-specific LINC component (Sun3-nesprin-1 at the manchette-facing
      nuclear pole). Same divergence as SF44: post-meiotic, not meiotic.
  - subfamily_id: PANTHER:PTHR12911:SF2
    label: SUN DOMAIN-CONTAINING PROTEIN 1
    clade_node_id: PANTHER:PTN000308316
    description: >-
      Nematode SUN-1/matefin (Caenorhabditis node PTN000308316, 10 leaves, all SF2).
      SUN-1 is the meiotic (pairing-centre) and embryonic (centrosome attachment) SUN
      partner of ZYG-12. Note that PANTHER gives SF2 and SF23 the same name ("SUN
      DOMAIN-CONTAINING PROTEIN 1"), although they are distinct clades on opposite sides
      of the protostome-deuterostome split.
    representative_members:
      - id: UniProtKB:Q20924
        label: SUN domain-containing protein 1
        gene_symbol: sun-1
        organism: Caenorhabditis elegans
        gene_review: genes/worm/sun-1/sun-1-ai-review.yaml
  - subfamily_id: PANTHER:PTHR12911:SF8
    label: KLAROID PROTEIN-RELATED
    description: >-
      Large catch-all subfamily: 100 of 222 leaves in the PANTHER 19 tree. It spans
      fungi, Dictyostelium, plants, stramenopiles, excavates and invertebrate animals. It
      includes the functionally distinct worm UNC-84 (somatic) alongside the meiotic and
      SPB-anchoring fungal proteins and plant SUN1. An SF8 label therefore says nothing
      about which LINC context a member has. The InterPro member inventory also lists
      the equine herpesvirus 1 glycoprotein gp2 (P28968, EUs4) under SF8. UniProt gives
      it no PANTHER cross-reference (its InterPro/Pfam domain is Herpes_gp2), and it is
      not a tree leaf, so this is probably a spurious match.
    representative_members:
