residue_sites:
  - site_id: sun_kash_disulfide_cys
    label: SUN-KASH interchain disulfide cysteine (KASH-lid)
    description: >-
      Conserved cysteine near the start of the SUN domain (STRCSE motif) that forms an
      interchain disulfide with the penultimate-region cysteine of bound KASH peptides.
      UniProt DISULFID feature: SUN2 C563 (with SYNE2 C6862) and SUN1 C630. The same
      motif and cysteine are present in worm UNC-84 (C953). The cysteine is not
      universal. A simple motif scan found no STRCSE-type cysteine in Sad1, Mps3,
      Arabidopsis SUN1/SUN2, SUN5 or worm SUN-1. No negative controls are asserted,
      because an alignment-verified counterpart position was not established for those
      proteins.
    anchor:
      id: UniProtKB:Q9UH99
      label: SUN domain-containing protein 2
      gene_symbol: SUN2
      organism: Homo sapiens
    anchor_sequence_version: 3
    residues:
      - position: 563
        expected: [C]
        role: interchain disulfide with the KASH peptide cysteine
    required_for:
      - term:
          id: GO:0140444
          label: cytoskeleton-nuclear membrane anchor activity
        strength: CONTRIBUTES
        rationale: >-
          The disulfide covalently locks the KASH peptide into the SUN trimer and
          strengthens force transmission across the nuclear envelope. SUN-KASH binding
          itself is non-covalent and does not require it. In C. elegans, mutating the
          UNC-84 or ANC-1 cysteines disrupts actin-based nuclear anchorage but not
          UNC-83-dependent nuclear migration. So the site contributes to high-force
          anchoring but is not required for the activity.
        supported_by:
          - reference_id: PMID:33058875
            supporting_text: >-
              Finally, a disulfide bond can be formed between SUN2 C563 and KASH1 C8774 or
              KASH2 C6862 via highly conserved cysteine residues.
          - reference_id: PMID:30245107
            supporting_text: >-
              Mutations of conserved cysteines in SUN or KASH disrupted ANC-1-dependent
              nuclear anchorage in C. elegans
    site_source: UNIPROT_FEATURE
    positive_controls:
      - id: UniProtKB:O94901
        label: SUN domain-containing protein 1
        gene_symbol: SUN1
        organism: Homo sapiens
        control_position: 630
        control_residue: C
      - id: UniProtKB:Q20745
        label: Nuclear migration and anchoring protein unc-84
        gene_symbol: unc-84
        organism: Caenorhabditis elegans
        control_position: 953
        control_residue: C

term_assessments:
  - assessed_term:
      id: GO:0005635
      label: nuclear envelope
    scope: FAMILY_WIDE
    scope_reason: >-
      All characterized members are inner-nuclear-membrane proteins. The root IBD is
      seeded across all eukaryotic lineages and accepted by every member review.
    supported_by:
      - reference_id: PMID:10375507
        supporting_text: UNC-84 is widely expressed and localized to the nuclear envelope
      - reference_id: PMID:12493774
        supporting_text: >-
          Nep98p is an essential integral membrane protein of the nuclear envelope and is
          enriched in the spindle pole body (SPB)
  - assessed_term:
      id: GO:0140444
      label: cytoskeleton-nuclear membrane anchor activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Nearly every member review selects it as the core molecular function: human
      SUN1/SUN2, worm UNC-84 and SUN-1, Sad1, Mps3 (meiotic t-LINC), Arabidopsis
      SUN1/SUN2 and Koi. Each retains KASH partners that engage microtubule motors, the
      spindle pole body or actin. The SUN5 review uses the parent GO:0043495 because
      SUN5's partner structure is the sperm head-tail coupling apparatus. That is still
      a centriole-based cytoskeletal structure, so the child term is not contradicted.
      PAINT currently asserts only the parent GO:0043495 at the root PTN000308195.
      Asserting GO:0140444 there would match the member reviews.
    supported_by:
      - reference_id: PMID:18396275
        supporting_text: >-
          the KASH domains of Nesprins 1, 2 and 3 interact promiscuously with luminal
          domains of Sun1 and Sun2.
      - reference_id: PMID:22270916
        supporting_text: >-
          Here, we show that AtWIP1, AtWIP2, and AtWIP3 interact with AtSUN1 and AtSUN2
          at the NE
      - reference_id: PMID:16923827
        supporting_text: >-
          provide evidence that it interacts with the Mps2 C terminus to tether the
          half-bridge to the core SPB
  - assessed_term:
      id: GO:0034993
      label: meiotic nuclear membrane microtubule tethering complex
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Safe for vertebrate SUN1 (SF23; KASH5 partner), SUN2 (SF22; partial, redundant
      with SUN1) and nematode SUN-1 (SF2). SF8 is listed because most of its
      characterized members hold the term: Sad1 (Sad1-Kms1), Mps3 (t-LINC) and Koi
      (germline pairing). But it is a mixed subfamily. Worm UNC-84 (SF8) is somatic and
      must be excluded at the node level (IRD at PTN000308327), not by subfamily. The
      term is wrong for the post-meiotic testis-SUN clade (SF24, SF16, SF44). Plant SUN1/SUN2 do have a meiotic telomere role, but their KASH partners
      couple to actin, not microtubules, and they are outside the node that carries the
      IBD. The Arabidopsis reviews accordingly use the neutral GO:0106083 nuclear
      membrane protein complex.
    applicable_subfamilies:
      - id: PANTHER:PTHR12911:SF23
        label: SUN DOMAIN-CONTAINING PROTEIN 1
      - id: PANTHER:PTHR12911:SF22
        label: SUN DOMAIN-CONTAINING PROTEIN 2
      - id: PANTHER:PTHR12911:SF2
        label: SUN DOMAIN-CONTAINING PROTEIN 1
      - id: PANTHER:PTHR12911:SF8
        label: KLAROID PROTEIN-RELATED
    supported_by:
      - reference_id: PMID:17543861
        supporting_text: >-
          The nuclear envelope protein Matefin/SUN-1 is required for homologous pairing in
          C. elegans meiosis.
      - reference_id: PMID:28945193
        supporting_text: >-
          We found that knockout of Sun5 has no effects on mouse meiosis, acrosome
          biogenesis or sperm nuclear remodeling
      - reference_id: PMID:20711465
        supporting_text: >-
          They consist either of
          spermiogenesis-specific Sun3 and Nesprin1 or Sun1eta, a novel non-nuclear Sun1
          isoform, and Nesprin3.
  - assessed_term:
      id: GO:0106094
      label: nuclear membrane microtubule tethering complex
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The general LINC-complex term chosen by the animal and fungal member reviews
      (SUN1, SUN2, SUN5, UNC-84, SUN-1 embryonic complex, Sad1-Kms2, Mps3-Mps2 SPB
      complex, Koi). Its definition requires coupling to cytoplasmic microtubules. That
      fits animal SUN proteins, whose nesprins and UNC-83 recruit dynein and kinesin, and
      fungal SPB anchoring. It fits badly for actin-coupled bridges: plant
      SUN-WIP-WIT2-myosin XI-i and budding-yeast meiotic t-LINC. So it is not safe
      family-wide. SF8 is listed for its fitting members (UNC-84, Koi, Sad1, Mps3 SPB
      complex), but it also contains Arabidopsis SUN1, for which the term does not fit.
      The testis SUNs (SF24, SF16, SF44) form spermiogenic LINC complexes with nesprins
      and are included. Plant SF47 is not. GO has no
      cytoskeleton-neutral LINC complex term between GO:0106083 nuclear membrane protein
      complex and the two microtubule-tethering terms. This gap is worth raising with GO.
    applicable_subfamilies:
      - id: PANTHER:PTHR12911:SF23
        label: SUN DOMAIN-CONTAINING PROTEIN 1
      - id: PANTHER:PTHR12911:SF22
        label: SUN DOMAIN-CONTAINING PROTEIN 2
