      - id: UniProtKB:Q09825
        label: Spindle pole body-associated protein sad1
        gene_symbol: sad1
        organism: Schizosaccharomyces pombe
        gene_review: genes/SCHPO/sad1/sad1-ai-review.yaml
      - id: UniProtKB:P47069
        label: Spindle pole body assembly component MPS3
        gene_symbol: MPS3
