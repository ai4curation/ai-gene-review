      nucleoplasmic partners (telomere, centromere and lamina proteins). The seeds span
      plants, fungi and mammals, so the root placement is well supported. Most reviews
      use the more specific child GO:0140444 cytoskeleton-nuclear membrane anchor
      activity as the core function. That child could also be asserted at this node (see
      term assessments).
