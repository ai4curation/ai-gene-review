family_id: PANTHER:PTHR12911
family_name: SAD1/UNC-84-LIKE PROTEIN-RELATED
preferred_name: C-terminal SUN-domain (Sad1/UNC-84) inner-nuclear-membrane LINC proteins
summary: >-
  Pan-eukaryotic family of C-terminal SUN-domain proteins. These are type II integral
  proteins of the inner nuclear membrane. Each has a nucleoplasmic N-terminal region
  that binds lamins or chromatin/telomere/centromere partners, a transmembrane
  segment, luminal coiled coils that trimerize, and a C-terminal SUN domain in the
  perinuclear space. The SUN domain binds the C-terminal KASH (or KASH-like) peptides of
  outer-nuclear-membrane proteins. The resulting SUN-KASH bridges (LINC complexes) span
  the nuclear envelope and couple the nucleoskeleton and chromosomes to cytoskeletal
  force. The family covers:
  (1) Vertebrate SUN1 (SF23) and SUN2 (SF22). These are ubiquitous somatic LINC anchors
  for nesprins in nuclear positioning, nucleokinesis and mechanotransduction. SUN1, and
  SUN2 in part, also pairs with KASH5 to tether meiotic telomeres.
  (2) An amniote testis-specific clade: SUN3 (SF24), SPAG4/SUN4 (SF16) and SUN5 (SF44).
  These form spermiogenesis-specific LINC complexes that shape the sperm head and anchor
  the head-tail coupling apparatus after meiosis.
  (3) Nematode paralogs that split the ancestral roles. UNC-84 (SF8) is the somatic
  anchor for UNC-83 (microtubule-motor nuclear migration) and ANC-1 (actin-based nuclear
  anchorage). SUN-1 (SF2) is the meiotic and embryonic partner of ZYG-12.
  (4) Drosophila Klaroid (SF8), the SUN partner of Klarsicht and Msp300 in nuclear
  migration, myonuclear positioning and germline centromere pairing.
  (5) The single fungal SUN proteins Sad1 (fission yeast) and Mps3 (budding yeast), both
  SF8. These anchor the spindle pole body to the nuclear envelope with KASH or KASH-like
  partners (Kms2, Mps2) and form meiotic telomere-bouquet LINC complexes (Sad1-Kms1;
  Mps3-Mps2-Csm4).
  (6) Plant Cter-SUN proteins (Arabidopsis SUN1 in SF8, SUN2 in SF47). They anchor
  plant-specific KASH proteins (WIP, SINE, TIK) and couple the nucleus to actin via
  WIT2-myosin XI-i. They also act in meiotic telomere attachment.
  The SUN-KASH anchoring activity and nuclear-envelope location are conserved across the
  family. The kind of cytoskeleton coupled (microtubules, actin, the spindle pole body)
  and the cell-cycle context (somatic, meiotic, spermiogenic) differ between lineages.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member is an inner-nuclear-membrane SUN protein that retains
  KASH-type partners in the outer nuclear membrane. Nuclear envelope and
  protein-membrane adaptor activity (and its child, cytoskeleton-nuclear membrane
  anchor activity) are family-wide, and all reviewed members accept the root IBAs.
  The divergence is in context and partner, not in activity. The meiotic
  telomere/pairing-centre role is held by specific paralogs: human SUN1 (and partly
  SUN2), worm SUN-1, fission yeast Sad1, budding yeast Mps3, fly Koi and plant SUN1/SUN2.
  Other paralogs are somatic or spermiogenic specialists (worm UNC-84; amniote SUN3,
  SPAG4 and SUN5). The partner cytoskeleton also varies: microtubule motors in animals,
  the spindle pole body in fungi, actin in budding-yeast meiosis and in plants. So the
  GO complex terms defined as microtubule tethering do not fit every member.
