    label: SUN DOMAIN-CONTAINING PROTEIN 1
    clade_node_id: PANTHER:PTN009003303
    description: >-
      Vertebrate SUN1 (euteleostome node PTN009003303, 23 leaves, all SF23). Somatic LINC
      anchor for nesprins, and the principal meiotic SUN protein (with KASH5).
    representative_members:
