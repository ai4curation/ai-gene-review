notes: >-
  All PTN ids, GO ids, seeds and snapshot dates are verbatim from the cached
  PTHR12911-paint.tsv (three IBD rows). Seed ids were resolved via UniProt:
  MGI:1923657 Sun5, MGI:1924303 Sun1, MGI:2443011 Sun2, MGI:2444120 Spag4, MGI:3041199
  Sun3, WBGene00006311 sun-1, WBGene00006816 unc-84, FBgn0265003 koi, SGD:S000003556
  MPS3, AT3G10730 SUN2, AT5G04990 SUN1, DDB_G0272869 Dictyostelium sun1. The seeds and
  evidence of the GO:0034993 IBA were checked in QuickGO (withFrom lists; mouse Sun3 IDA
  PMID:20711465; UNC-84 IPI PMID:16481402 by ComplexPortal). Tree topology is from the
  live PANTHER 19 treeinfo service (2026-09-27). The root PTN000308195 (Eukaryota, 222
  leaves) splits into Unikonts PTN000308196 (Opisthokonta PTN000308197 plus
  Dictyostelium) and Bikonts PTN008544041 (plants, SAR, excavates). In the vertebrate
  duplication PTN001402874, the SUN1 clade PTN009003303 separates from a lineage that
  gives the SUN2 amniote clade PTN001402899 and the testis-SUN clade PTN000308291
  (SUN3/SPAG4/SUN5). In nematodes the duplication PTN000308315 gives SUN-1
  (PTN000308316) and UNC-84 (PTN000308327). Drosophila Koi and a fly spag4 paralog sit
  under PTN000308330 (Diptera). Residue positions were read from current UniProt
  sequences (SUN2 Q9UH99 SV3 C563 and SUN1 O94901 SV4 C630, both UniProt DISULFID
  features; UNC-84 Q20745 C953 in the same STRCSE motif).

  Status of the reviews of Arabidopsis SUN1, Arabidopsis SUN2 and Drosophila koi: all
  three had status COMPLETE when checked before this family review was written, and
  their judgments are incorporated.

  Recommendations. (1) Add IRD/NOT rows for GO:0034993 at PTN000308327 (UNC-84) and
  PTN000308291 (testis SUNs), or move the IBD to the paralog nodes with meiotic
  evidence and assert GO:0106094 at the opisthokont node. (2) Consider asserting
  GO:0140444 at the root alongside GO:0043495. (3) Consider an IBD for GO:0106166
  spindle pole body-nuclear membrane anchor activity at the fungal node PTN000985518.
  Both fungal members (Sad1, Mps3) take it as a core function. It is a fungus-specific
  structure and must not go deeper. (4) Raise with GO the lack of a
  cytoskeleton-neutral LINC complex term. GO:0106094/GO:0034993 are defined as
  microtubule tethering, which misdescribes actin-coupled plant and budding-yeast
  meiotic bridges.

  Naming: "SAD1/UNC-84-LIKE PROTEIN-RELATED" is accurate for the family. The subfamily
  names mislead. SF2 (nematode SUN-1) and SF23 (vertebrate SUN1) share the name "SUN
  DOMAIN-CONTAINING PROTEIN 1". SF47 and SF22 share "SUN DOMAIN-CONTAINING PROTEIN 2"
  (plant vs vertebrate). SF8 "KLAROID PROTEIN-RELATED" is a pan-eukaryotic catch-all.
  Mid-SUN proteins are classified separately (Arabidopsis mid-SUN SUN3, F4I316, is in
  PTHR12953).

  Modules: linc_complex.yaml and nucleokinesis.yaml cite PANTHER:PTHR12911 /
  "SAD1/UNC-84-LIKE PROTEIN-RELATED" for SUN1/SUN2. The id and label are correct. For
  a descriptor specifically meaning somatic SUN1/SUN2, the subfamilies
  PANTHER:PTHR12911:SF23 "SUN DOMAIN-CONTAINING PROTEIN 1" and PANTHER:PTHR12911:SF22
  "SUN DOMAIN-CONTAINING PROTEIN 2" are more precise, and they exclude the testis SUNs.
  PAINT nodes the modules can cite are PANTHER:PTN000308195 (root; nuclear envelope and
  protein-membrane adaptor activity, sound family-wide) and PANTHER:PTN000308197 for
  the meiotic variant, with the pruning caveat above.
