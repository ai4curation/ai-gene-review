        label: unc-84
        gene_symbol: unc-84
        organism: Caenorhabditis elegans
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      A meiotic SUN-KASH role is real in several opisthokont lineages: human SUN1-KASH5,
      worm SUN-1/ZYG-12, Sad1-Kms1, Mps3-Mps2-Csm4 and fly Koi-Klar in germline pairing.
      These reviews ACCEPT or KEEP_AS_NON_CORE the IBA, so an opisthokont origin is
      defensible. But the node reaches paralogs that are not meiotic. (a) Worm UNC-84 is
      the somatic SUN protein; C. elegans meiosis uses its paralog SUN-1. The UNC-84
      review MODIFYs the IBA to GO:0106094. Recommend an IRD/NOT at the UNC-84 clade node
      PTN000308327 (Caenorhabditis, sister to the SUN-1 clade PTN000308316 under
      duplication PTN000308315). (b) The amniote testis-SUN clade PTN000308291 (SUN3
      SF24, SPAG4 SF16, SUN5 SF44) works after meiosis. Sun5 knockout leaves meiosis
      intact, and the SUN5 review MODIFYs the IBA. Recommend an IRD/NOT at PTN000308291.
      Seed quality is also weak. Two of the five seeds are non-meiotic LINC evidence
      recorded under the meiotic term: UNC-84's IPI with UNC-83 (PMID:16481402, a
      ComplexPortal annotation of a somatic nuclear-migration complex) and mouse Sun3's
      IDA (PMID:20711465, a spermiogenesis-specific Sun3-nesprin-1 complex). The
      SUN1/SUN2 seed rows are mostly somatic LINC evidence, which those reviews MODIFY to
      GO:0106094. Across the whole subtree the non-meiotic parent GO:0106094 would be the
      safer IBD, with GO:0034993 kept at the paralog nodes that have shown meiotic
      function. Even GO:0106094 is a poor fit for budding-yeast meiotic t-LINC, which
      drives actin-based, not microtubule-based, telomere movement. Plant SUN proteins
      sit in the bikont branch (PTN008544041), so they correctly do not inherit this term.
