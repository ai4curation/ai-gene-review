    assessment: SOUND
    assessment_reason: >-
      Every member review ACCEPTs this IBA. SUN proteins retain KASH-type partners at
      the outer nuclear membrane: nesprins and KASH5 for SUN1/SUN2, UNC-83/ANC-1 for
      UNC-84, ZYG-12 for SUN-1, Kms1/Kms2 for Sad1, Mps2 for Mps3, WIP/SINE/TIK for
