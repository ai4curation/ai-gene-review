  - subfamily_id: PANTHER:PTHR12911:SF22
    label: SUN DOMAIN-CONTAINING PROTEIN 2
    description: >-
      Vertebrate SUN2. Ubiquitous somatic LINC anchor (TAN lines, nuclear migration,
      nucleokinesis). It contributes partially and redundantly with SUN1 to meiotic
      telomere attachment.
    representative_members:
      - id: UniProtKB:Q9UH99
        label: SUN domain-containing protein 2
        gene_symbol: SUN2
        organism: Homo sapiens
        gene_review: genes/human/SUN2/SUN2-ai-review.yaml
