family_id: PANTHER:PTHR10131
family_name: TNF RECEPTOR ASSOCIATED FACTOR
summary: TRAF proteins organize receptor-associated signaling assemblies through conserved interaction
  domains and variable amino-terminal regions. Their roles include recruiting ubiquitin-system components
  and controlling inflammatory and survival pathways.
functional_coherence: HETEROGENEOUS
coherence_reason: TRAF2 recruits cIAP proteins through its coiled-coil region, as shown by reconstitution,
  structure and binding-site mutagenesis (PMID:20447407). This directly supports signaling adaptor activity
  independently of whether TRAF2 has intrinsic E3 ligase activity. The PANTHER grouping also includes
  plant and other divergent TRAF-type proteins whose receptor partners and adaptor mechanism are not defined
  by the TRAF2 experiment. The exhaustive signaling-adaptor grant boundary remains unresolved; RING-dependent
  ubiquitination is a separate assessment.
