  supported_by:
  - reference_id: PMID:20447407
    supporting_text: 'To fulfill

      this role, cIAPs must be recruited to the receptor complex by

      TNF-receptor-associated factor (TRAF) 2. In this study, we reconstituted the

      complex between baculoviral IAP repeat (BIR) 1 of cIAP1 and the coiled-coil

      region of TRAF2, solved the structure of BIR1 from cIAP1, and mapped key binding

      residues on each molecule using mutagenesis.'
  - reference_id: PMID:11907583
    supporting_text: 'TRAF2 is

      required for TNF-alpha-mediated activation of c-Jun N-terminal kinase (JNK),

      contributes to activation of NF-kappaB, and mediates anti-apoptotic signals,.'
  - reference_id: file:genes/HORSE/TRAF2/TRAF2-bioinformatics/RESULTS.md
    supporting_text: The downloaded human Q12933 sequence (501 residues) and selected horse F7BIV4 sequence
      (516 residues) share 92.0% identity among 501 paired residues. Paired coverage is 100.0% of human
      and 97.1% of horse.
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR10131-evidence.md
    supporting_text: E3 ubiquitin-protein ligase that regulates activation of NF-kappa-B and JNK and plays
      a central role in the regulation of cell survival and apoptosis (PubMed:10346818, PubMed:11784851,
      PubMed:12917689, PubMed:15383523, PubMed:18981220, PubMed:19150425, PubMed:19810754, PubMed:19918265,
      PubMed:19937093, PubMed:20047764, PubMed:20064526, PubMed:20385093, PubMed:20577214, PubMed:22212761).
      Catalyzes 'Lys-63'-linked ubiquitination of target proteins, such as BIRC3, IKBKE, MLST8, RIPK1
      and TICAM1 (PubMed:23453969, PubMed:28489822). Is an essential constituent of several E3 ubiquitin-protein
      ligase complexes, where it promotes the ubiquitination of target proteins by bringing them into
      contact with other E3 ubiquitin ligases (PubMed:15383523, PubMed:18981220). Regulates BIRC2 and
      BIRC3 protein levels by inhibiting their autoubiquitination and subsequent degradation; this does
      not depend on the TRAF2 RING-type zinc finger domain (PubMed:11907583, PubMed:19506082). Plays a
      role in mediating activation of NF-kappa-B by EIF2AK2/PKR (PubMed:15121867). In complex with BIRC2
      or BIRC3, promotes ubiquitination of IKBKE (PubMed:23453969). Acts as a regulator of mTORC1 and
      mTORC2 assembly by mediating 'Lys-63'-linked ubiquitination of MLST8, thereby inhibiting formation
      of the mTORC2 complex, while facilitating assembly of the mTORC1 complex (PubMed:28489822). Required
      for normal antibody isotype switching from IgM to IgG (By similarity)
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR10131-evidence.md
    supporting_text: Was reported to interact with IL15RA (PubMed:10463949). However, this work was later
      retracted (PubMed:21357251)
