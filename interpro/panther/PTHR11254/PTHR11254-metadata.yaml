  name:
    name: E3 ubiquitin-protein ligase
    short: E3_ubiq-protein_ligase
  description:
  - text: The protein family described is involved in the ubiquitination process,
      where members act as E3 ubiquitin-protein ligases. These enzymes accept ubiquitin
      from E2 ubiquitin-conjugating enzymes as thioesters and transfer them directly
      to target substrates. This post-translational modification can lead to various
      outcomes, including proteasomal degradation, altered cellular location, or changes
      in activity of the substrate proteins. The family members regulate diverse biological
      processes such as signal transduction, cell cycle progression, apoptosis, DNA
      repair, mRNA export, rRNA maturation, and immune responses. Some proteins within
      the family also have roles in regulating membrane dynamics, neuronal development,
      and autophagy. They are characterized by the presence of HECT, WW, or C2 domains,
      which mediate interactions with substrates and regulatory proteins, and are
      involved in autoinhibition and activation of the ligase activity.
