    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Correct for the respiratory clades, but the plastid NdhB clade descends from this
      node (poplar ndhB1/ndhB2 receive the IBA with exactly this WITH/FROM) and is part
      of the distinct thylakoid NAD(P)H dehydrogenase complex, GO:0010598, not
      respiratory chain complex I. The gene reviews narrow the inherited term
      accordingly; the plastid branch needs an IRD/NOT.
  - node_id: PANTHER:PTN000511884
    asserted_term:
      id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    paint_snapshot: "20250225"
    seeds:
      - id: UniProtKB:P0AFF0
        label: NADH-quinone oxidoreductase subunit N
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Ubiquinone is the acceptor only in the respiratory clades; the plastid NDH complex
      reduces plastoquinone, so the ubiquinone-specific activity term must not descend
      into the plastid NdhB clade. The poplar gene reviews keep the chemistry via the
      broader quinone-acceptor term GO:0016655.
  - node_id: PANTHER:PTN000511884
    asserted_term:
      id: GO:0022904
      label: respiratory electron transport chain
    paint_snapshot: "20250225"
    seeds:
      - id: UniProtKB:P0AFF0
        label: NADH-quinone oxidoreductase subunit N
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      The plastid NdhB clade operates in photosynthetic cyclic electron flow
      (GO:0009778), not a respiratory electron transport chain; the term must be pruned
      from that branch. Poplar ndhB1/ndhB2 replace the inherited IBA with GO:0009778.

