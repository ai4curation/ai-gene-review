family_id: PANTHER:PTHR22773
family_name: NADH DEHYDROGENASE
preferred_name: Complex I / NDH-1 subunit N family (NuoN / mitochondrial ND2 / plastid NdhB)
summary: >-
  Antiporter-like membrane subunit family of the proton-pumping NADH:quinone
  oxidoreductases: bacterial NuoN, mitochondrial ND2, and the plastid-encoded NdhB of
  the chloroplast NDH complex. Bacterial and mitochondrial members are respiratory,
  passing electrons to ubiquinone within NDH-1 or respiratory complex I. The plastid
  NdhB clade (in poplar, the identical inverted-repeat copies ndhB1 and ndhB2) belongs
  to the thylakoid NAD(P)H dehydrogenase complex (GO:0010598), which drives
  photosynthetic cyclic electron flow around photosystem I and chlororespiration,
  reducing plastoquinone. Respiratory-chain and ubiquinone-specific terms are unsafe
  across the plastid boundary.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Respiratory members (NuoN, ND2) act in bacterial NDH-1 or mitochondrial respiratory
  complex I on ubiquinone; the plastid NdhB clade acts in the thylakoid NDH complex on
  plastoquinone in photosynthetic cyclic electron flow. The fetched slice records no
  subfamily partition separating the groups (poplar ndhB carries only a family-level
  PANTHER cross-reference), so the boundary is a clade, not a subfamily.
reference_protein:
  id: UniProtKB:P0AFF0
  label: NADH-quinone oxidoreductase subunit N
  gene_symbol: nuoN
  organism: Escherichia coli (strain K12)

