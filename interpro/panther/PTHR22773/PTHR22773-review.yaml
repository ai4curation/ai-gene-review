  assessment_reason: 'The exact target leaf descends from this node, but modern chloroplast NDH has ferredoxin-input
    architecture rather than the NADH-oxidizing module (PMID:21505067; PMID:39856350). Both donor and acceptor
    chemistry must be respected: GO:0016655 still requires NAD(P)H and does not repair the mismatch. Populus
