summary: COMPLEXIN (PANTHER:PTHR16705) is characterized in PANTHER PAINT across 2 ancestral PTN node(s)
  (PANTHER:PTN000422952, PANTHER:PTN001047612) with 6 IBD node assertion(s) and 0 term(s) carrying negated
  IRD/IKR branch blocks, covering terminal bouton (GO:0043195, CC), synaptic vesicle exocytosis (GO:0016079,
  BP), regulation of synaptic vesicle fusion to presynaptic active zone membrane (GO:0031630, BP), modulation
  of chemical synaptic transmission (GO:0050804, BP) and 2 additional GO term(s).
