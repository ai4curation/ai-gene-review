  assessment: UNRESOLVED
  assessment_reason: >-
    The phylogenetic placement is not in question: every characterized complexin
    associates with the assembled SNARE core complex. What is unresolved is whether
    part_of SNARE complex is the right relation for an accessory ligand of the
    four-helix bundle. GO itself treats a complexin-bound SNARE complex as a SNARE
    complex (GO:0070032 is an is_a child of GO:0031201), which supports the term,
    but two of the three member reviews mark it as over-annotated in favour of
    SNARE binding. This is an ontology-convention question, not a node-placement
    error.
