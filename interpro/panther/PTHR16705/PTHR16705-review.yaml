term_assessments:
- assessed_term:
    id: GO:0000149
    label: SNARE binding
  scope: FAMILY_WIDE
  scope_reason: >-
    Binding to the assembled SNARE core complex through the central helix is the
    defining, conserved activity of the family (mammalian and squid evidence).
  supported_by:
  - reference_id: PMID:7553862
    supporting_text: Complexins bind weakly to syntaxin alone and not at all to synaptobrevin and SNAP-25,
      but strongly to the SNAP receptor-core complex composed of these three molecules.
  - reference_id: PMID:12004067
    supporting_text: A helical segment of complexin binds in anti-parallel fashion to the four-helix bundle
      of the core SNARE complex
- assessed_term:
    id: GO:0031201
    label: SNARE complex
  scope: UNRESOLVED
  scope_reason: >-
    The association is family-wide; the open question is the relation. The human
    CPLX1 review modifies the term to the specific complexin-containing complex
    GO:0070032, while the worm and squid reviews mark it over-annotated because
    complexin is an accessory ligand rather than a SNARE. SNARE binding is the safe
    family-level statement.
  supported_by:
  - reference_id: PMID:11239399
    supporting_text: Synaphin/complexin is a cytosolic protein that preferentially binds to syntaxin within
      the SNARE complex.
- assessed_term:
    id: GO:0016079
    label: synaptic vesicle exocytosis
  scope: FAMILY_WIDE
  scope_reason: >-
    All characterized complexins act in a late step of synaptic vesicle
    exocytosis. The squid review prefers the regulatory term positive regulation
    of synaptic vesicle exocytosis; both describe the same participation.
  supported_by:
  - reference_id: PMID:11239399
    supporting_text: Injection of this peptide into squid giant presynaptic terminals inhibited neurotransmitter
      release at a late prefusion step of synaptic vesicle exocytosis.
- assessed_term:
    id: GO:0031630
    label: regulation of synaptic vesicle fusion to presynaptic active zone membrane
  scope: FAMILY_WIDE
  scope_reason: >-
    Clamping and facilitating functions on vesicle fusion are shown in mammals and
    C. elegans; the unsigned term covers both directions.
  supported_by:
  - reference_id: PMID:21785414
    supporting_text: Complexin prevents SNAREs from releasing neurotransmitters until an action potential
      arrives at the synapse.
  - reference_id: PMID:21215634
    supporting_text: Loss of CPX-1 results in a 3-fold increase in the rate of tonic synaptic transmission
      at the neuromuscular junction, whereas stimulus-evoked SV fusion is decreased 10-fold.
- assessed_term:
    id: GO:0050804
    label: modulation of chemical synaptic transmission
  scope: FAMILY_WIDE
  scope_reason: >-
    True family-wide but redundant with GO:0031630, of which it is an ancestor; the
    human review modifies it for that reason, the worm review accepts it.
  supported_by:
  - reference_id: PMID:21215634
    supporting_text: Loss of CPX-1 results in a 3-fold increase in the rate of tonic synaptic transmission
      at the neuromuscular junction, whereas stimulus-evoked SV fusion is decreased 10-fold.
- assessed_term:
    id: GO:0043195
    label: terminal bouton
  scope: UNRESOLVED
  scope_reason: >-
    Presynaptic enrichment is family-wide, but terminal bouton names a specific
    terminal morphology. Accepted by the human and squid reviews, modified by the
    worm review because C. elegans motor neurons do not form terminal boutons.
  supported_by:
  - reference_id: PMID:21215634
    supporting_text: CPX-1::GFP was diffusely expressed throughout the axon with some enrichment at presynaptic
      terminals
