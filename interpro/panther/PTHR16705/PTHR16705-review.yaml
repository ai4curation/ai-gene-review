family_id: PANTHER:PTHR16705
family_name: COMPLEXIN
preferred_name: Complexins (synaphins)
summary: >-
  Complexins are small, soluble, mostly cytosolic metazoan proteins (about 130-160
  residues) that bind the assembled neuronal SNARE complex of syntaxin-1, SNAP-25
  and synaptobrevin/VAMP2 through a central alpha-helix that packs antiparallel
  against the four-helix bundle. Through this binding they regulate the final,
  calcium-triggered step of synaptic vesicle fusion, clamping spontaneous fusion
  and promoting synchronous evoked fusion to different degrees in different
  preparations. Vertebrates have four paralogs (complexin-1 to -4; CPLX3 and CPLX4
  are retinal ribbon-synapse forms with a C-terminal CAAX farnesylation motif);
  invertebrates such as Drosophila, squid and C. elegans have a single complexin.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member, across mammals, squid and C. elegans, binds the
  assembled SNARE core complex and regulates a late step of synaptic vesicle
  exocytosis. The disagreements among the member gene reviews concern how the
  SNARE relationship and the synaptic location are expressed in GO (complex
  membership versus binding; terminal bouton versus presynapse), not a functional
  divergence between subfamilies.
