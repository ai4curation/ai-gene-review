  BP), modulation of chemical synaptic transmission (GO:0050804, BP) and 2 additional GO term(s)) are
  conserved across the primary ancestral clade, with lineage-specific variation reflected by IBD assertions
  distributed across 2 PTN nodes (PANTHER:PTN000422952, PANTHER:PTN001047612).
