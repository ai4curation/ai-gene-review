notes: >-
  Reviewed members examined: human CPLX1 (SF6), C. elegans cpx-1 and squid cpx
  (both SF4). Subfamilies SF5 and SF12 (COMPLEXIN-3), SF7 (COMPLEXIN-4), SF9
  (COMPLEXIN-2) and SF13 (COMPLEXIN 2) were not examined at member level; the
  retinal CPLX3/CPLX4 forms are membrane-anchored by farnesylation and act at
  ribbon synapses, which this review does not adjudicate. The fetched entries
  list holds only 21 reviewed UniProt members of the 4725 family proteins, so the
  species tally was not used to judge the family's taxonomic span. Node placement
  was judged from the seeds and member evidence, without the PANTHER tree or
  alignment.
