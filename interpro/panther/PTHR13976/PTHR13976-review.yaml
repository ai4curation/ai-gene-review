family_id: PANTHER:PTHR13976
family_name: HETEROGENEOUS NUCLEAR RIBONUCLEOPROTEIN-RELATED
preferred_name: ESRP, hnRNP H/F and related RNA-binding proteins
summary: ESRP and hnRNP H/F-related proteins use RNA-recognition motifs in transcript processing and regulation.
  The retrieved family also includes GRSF1 and other RNA-binding proteins with distinct RNA targets and
  subcellular destinations.
functional_coherence: HETEROGENEOUS
coherence_reason: The shark target has ESRP-type RRM architecture and the fly benchmark includes glo.
  Nuclear residence is compatible with splicing regulators, but mitochondrial GRSF1 and localization-dependent
  isoforms prevent a universal nuclear assignment. Epithelial splicing programs must not be transferred
  to every RRM-containing member.
