  scope: UNRESOLVED
  scope_reason: ESRP-type RRMs in the shark protein support comparison to nuclear splicing regulators,
    while the fly Glo branch has its own RNA-localization biology. Direct GRSF1 studies identify a mitochondrial-matrix
    isoform, providing a concrete counterexample to universal nuclear localization. The complete isoform/targeting
    boundary among ESRP, hnRNP H/F and GRSF1-like branches is unresolved; RNA-binding fold conservation
    does not fix the compartment.
