family_id: PANTHER:PTHR44169
family_name: NADPH-DEPENDENT 1-ACYLDIHYDROXYACETONE PHOSPHATE REDUCTASE
preferred_name: AYR1 1-acyldihydroxyacetone-phosphate reductase family
summary: >-
  Fungal SDR enzymes. SF6 holds the 1-acyl-DHAP reductases (S. cerevisiae AYR1, S. pombe ayr1) of
  the DHAP route to phosphatidic acid, found on lipid droplets and ER; AYR1 also has triacylglycerol
  lipase activity. SF3 holds secondary-metabolism SDRs such as SrdE/FogD.
functional_coherence: HETEROGENEOUS
coherence_reason: SF6 reduces acyl-DHAP; SF3 SDRs act in polyketide pathways.
