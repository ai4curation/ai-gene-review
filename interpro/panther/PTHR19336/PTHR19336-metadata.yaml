  name:
    name: Centrosomal microtubule-associated protein
    short: Centrosomal_MT-associated
  description:
  - text: This family of proteins is involved in the organization and function of
      centrosomes, which are key structures for microtubule organization and spindle
      assembly during cell division. Members of this family are characterized by their
      ability to localize to centrosomes and to interact with microtubules, potentially
      forming ring-like structures around them. These proteins may play a role in
      tethering microtubules to centrosomes and kinetochores, and could be involved
      in the nucleation and bundling of microtubules. Additionally, some family members
      are implicated in the nuclear translocation and mitogenic activity of internalized
      growth factors, such as FGF2. The family is part of the broader translokin family,
      indicating a shared structural or functional domain that mediates their interactions
      with other proteins and cellular components.
