  name:
    name: Polyadenylate-binding/CELF RNA-binding
    short: PABP/CELF_RNA-bind
  description:
  - text: The protein family includes RNA-binding proteins that play critical roles
      in post-transcriptional regulation of gene expression. Members of the family
      are involved in various aspects of mRNA metabolism, including pre-mRNA alternative
      splicing, mRNA stability, translation initiation, and possibly miRNA biogenesis.
      They bind to poly(A) tails of mRNAs and may interact with other RNA sequences,
      influencing mRNA biogenesis, stability, and translation. Some family members
      are implicated in the regulation of cardiac isoforms of TNNT2 during heart development
      and may regulate exon inclusion or exclusion in a tissue-specific manner. Others
      are involved in deadenylation processes, contributing to mRNA decay. The family
      also includes proteins that may have roles in the perception of gravity, sporulation,
      and flowering time regulation in plants.
