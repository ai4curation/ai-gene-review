residue_sites:
- site_id: natc_sys1_nt_anchor
  label: N-terminal aromatic/hydrophobic residue (Tyr2/Phe2) of the NatC-acetylated SYS1-binding amphipathic helix
  description: >-
    Canonical PTHR45909:SF1 GTPases (ARFRP1 / fungal Arl3p / plant ARFC1) lack the Gly2
    N-myristoylation motif of classical Arfs and instead feature a 14-residue N-terminal
    amphipathic helix starting with Met1 followed at position 2 by a bulky aromatic residue
    (Tyr2 in metazoans: human Q13795, mouse Q8BXL7, rat Q63055, fly Q9W389, worm Q9N3C8;
    Phe2 in yeast Arl3p Q02804 and Arabidopsis ARFC1 Q38921). Position 2 directs
    co-translational N-alpha-acetylation of Met1 by the heterotrimeric NatC complex
    (NAA30/Mak3p-NAA35/Mak10p-NAA38/Mak31p; crystal structure solved with yeast Arl3p
    1-MFHLV-5 peptide, PMID:33139728) and mediates direct, nucleotide-independent docking onto
    the multipass trans-Golgi membrane receptor SYS1/Sys1p; mutating Tyr2 to Ala (Y2A) in
    mammalian ARFRP1 or Phe2/Met1 acetylation determinants in yeast Arl3p abolishes SYS1
    interaction and TGN targeting (PMID:15077113, PMID:15077114, PMID:32972971). Out-of-tree
    InterPro matches SRPRB (Q9Y5M8, Ala2; anchored at the ER via an internal TM helix at
    residues 37-57) and Dictyostelium arrL (Q54YV7, Gly2) lack this aromatic NatC/SYS1
    determinant.
