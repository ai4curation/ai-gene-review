family_id: PANTHER:PTHR45909
family_name: ADP-RIBOSYLATION FACTOR-RELATED PROTEIN 1
preferred_name: Arf-related trans-Golgi network GTPases (ARFRP1 / fungal Arl3p / plant ARFC1)
summary: >-
  PANTHER family PTHR45909 centers on eukaryotic ADP-ribosylation factor-related protein 1
  (ARFRP1; named Arl3p in Saccharomyces cerevisiae and GB1/ARFC1 in Arabidopsis thaliana)
  within subfamily PANTHER:PTHR45909:SF1, alongside two uncharacterized single-species plant
  subfamilies in the PANTHER ontology (PTHR45909:SF2 in Oryza sativa and PTHR45909:SF3 in
  Brassica napus). Canonical PTHR45909:SF1 GTPases are ~190-205-residue soluble monomeric
  Arf-family small GTPases that lack the Gly2 N-myristoylation site typical of canonical
  Arfs. Instead, they carry an N-terminal amphipathic helix beginning with Met1 followed by
  an aromatic/hydrophobic residue (Tyr2 in metazoans, Phe2 in budding yeast and land plants)
  that is co-translationally N-alpha-acetylated on Met1 by the heterotrimeric NatC complex
  (NAA30/Mak3p, NAA35/Mak10p, NAA38/Mak31p). The N-terminally acetylated amphipathic helix
  binds directly to the multipass Golgi integral membrane receptor SYS1 (Sys1p) on the
  cytoplasmic leaflet of the trans-Golgi network (TGN) independently of nucleotide state.
  Once activated to the GTP-bound state at the TGN, ARFRP1/Arl3p initiates a conserved
  trans-Golgi GTPase cascade by recruiting downstream ARL1 (Arl1p) and GRIP-domain golgins—and
  in mammals also ARL5 and the GARP tethering complex as well as AP-1/GOPC cargo-sorting
  machinery—to drive endosome-to-TGN retrograde tethering and selective TGN-to-plasma-membrane
  and TGN-to-lysosome anterograde export. Importantly, InterPro's profile HMM for PTHR45909
  (IPR024156 / PTHR45909-entries.csv) additionally matches two out-of-clade small-GTPase
  groups that belong to distinct phylogenetic trees in PANTHER 19.0: four eukaryotic signal
  recognition particle receptor beta subunits (SRPRB: human Q9Y5M8, mouse P47758, rat
  Q4FZX7, and Dictyostelium Q54XX1, classified in PANTHER 19.0 PTHR11485:SF34 at node
  PTN002608117), which are single-pass endoplasmic reticulum membrane GTPases mediating
  SRP-dependent cotranslational protein targeting, and Dictyostelium ADP-ribosylation factor L
  (arrL, Q54YV7, classified in PANTHER 19.0 PTHR11711:SF222), which carries a Gly2-type
  N-terminus rather than the NatC/SYS1 aromatic N-terminal anchor.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Within PANTHER 19.0 proper (ancestral node PTN000196303), PTHR45909:SF1 is a functionally
  cohesive eukaryotic clade of NatC-acetylated, SYS1-recruited trans-Golgi network small
  GTPases (mammalian ARFRP1, fly Arfrp1, worm Y54E10BR.2, budding yeast ARL3, and plant
  ARFC1/GB1), accompanied by two uncharacterized single-gene plant subfamilies in panther.obo
  (PTHR45909:SF2 OS07G0620400 and PTHR45909:SF3 BNAA03G12710D). However, the InterPro profile
  HMM slice for PTHR45909 (PTHR45909-entries.csv and PTHR45909-paint.tsv) conflates true
  PTHR45909:SF1 ARFRP1/Arl3p orthologs with two out-of-tree Ras/Arf-superfamily groups:
  (1) single-pass endoplasmic reticulum membrane signal recognition particle receptor beta
  subunits (SRPRB: human Q9Y5M8, mouse P47758, rat Q4FZX7, and Dictyostelium Q54XX1, whose
  PAINT annotations derive from PANTHER 19.0 PTHR11485:SF34 node PTN002608117 and which act
  in cotranslational ER protein targeting rather than Golgi vesicular traffic) and
  (2) Dictyostelium arrL (Q54YV7, whose PAINT annotations derive from PANTHER 19.0
  PTHR11711:SF222 nodes PTN000195484, PTN000917851, and PTN000918181). Consequently, TGN/Golgi
  trafficking and ER SRP-receptor functions partition strictly between these clades and only
  basal GTP binding (GO:0005525) holds across the full InterPro member set.
