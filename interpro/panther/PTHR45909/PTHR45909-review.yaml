- assessed_term:
    id: GO:0007165
    label: signal transduction
  scope: NOT_APPLICABLE
  scope_reason: >-
    A legacy TAS annotation of human ARFRP1 to GO:0007165 (PMID:8530503) rested on the 1995
    cloning paper's tentative speculation that ARP might participate in plasma-membrane
    signaling by analogy with Ras-family GTPases; subsequent genetic and biochemical studies
    across yeast and mammals demonstrated that ARFRP1/Arl3p is a TGN membrane-trafficking
    switch rather than a signal-transduction component, and SRPRB is a cotranslational ER
    protein-targeting receptor subunit.
  supported_by:
  - reference_id: PMID:8530503
    supporting_text: Thus, the structural and functional characteristics of ARP indicate that it represents a novel subtype of GTPases, presumably exerting a unique function and possibly involved in plasma membrane-related signaling events.
  - reference_id: PMID:31575603
    supporting_text: Our findings thus demonstrate that ARFRP1 is a master regulator of retrograde-carrier tethering to the TGN.
