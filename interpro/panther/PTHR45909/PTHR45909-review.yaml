- subfamily_id: PANTHER:PTHR45909:SF1
  label: ADP-RIBOSYLATION FACTOR-RELATED PROTEIN 1
  description: >-
    Conserved eukaryotic clade of NatC-acetylated, SYS1-targeted trans-Golgi network Arf-like
    small GTPases, including vertebrate ARFRP1 (human Q13795, mouse Q8BXL7, rat Q63055, bovine
    Q32LJ2), Drosophila melanogaster Arfrp1 (Q9W389 / CG7039), Caenorhabditis elegans
    Y54E10BR.2 (Q9N3C8), Saccharomyces cerevisiae Arl3p (Q02804; note the historical yeast
    homonym with unrelated vertebrate ciliary ARL3 P36405), and Arabidopsis thaliana GB1/ARFC1
    (Q38921). Members lack Gly2 N-myristoylation, conserve an N-terminal Met1-Tyr2/Phe2
    amphipathic helix acetylated by NatC to bind SYS1 at the TGN, and regulate recruitment of
    ARL1/golgins (and in mammals ARL5/GARP and AP-1/GOPC) for retrograde endosome-to-Golgi and
    anterograde TGN-to-plasma-membrane protein sorting. Note that InterPro's profile HMM for
    PTHR45909:SF1 (PTHR45909-entries.csv) additionally assigns four ER-resident SRPRB proteins
    (Q9Y5M8, P47758, Q4FZX7, Q54XX1; PANTHER 19.0 PTHR11485:SF34) and Dictyostelium arrL
    (Q54YV7; PANTHER 19.0 PTHR11711:SF222) to PTHR45909:SF1.
