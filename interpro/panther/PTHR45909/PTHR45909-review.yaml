  label: Switch II (G3 DxxGQ) catalytic glutamine Gln79
  description: >-
    Catalytic glutamine in the Switch II G3 motif (75-DLGGQ-79 in metazoan ARFRP1 orthologs
    Q13795, Q8BXL7, Q63055, Q9W389, Q9N3C8; 74-DLGGQ-78 in Arabidopsis ARFC1 Q38921 and
