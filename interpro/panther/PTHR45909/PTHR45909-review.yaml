notes: >-
  InterPro's profile HMM for PTHR45909 (IPR024156) recruits four eukaryotic SRPRB proteins
  (human Q9Y5M8, mouse P47758, rat Q4FZX7, Dictyostelium Q54XX1; PANTHER 19.0 PTHR11485:SF34
  at PTN002608117) and Dictyostelium arrL (Q54YV7; PANTHER 19.0 PTHR11711:SF222) alongside
  true PTHR45909:SF1 ARFRP1/Arl3p orthologs (PTN000196303). Also note the major nomenclature
  hazard across eukaryotes: Saccharomyces cerevisiae ARL3 (Q02804) is the true 1:1 ortholog of
  mammalian ARFRP1 (Q13795) in PTHR45909:SF1, whereas mammalian ARL3 (P36405) is a distinct
  ciliary GTPase absent from budding yeast.
