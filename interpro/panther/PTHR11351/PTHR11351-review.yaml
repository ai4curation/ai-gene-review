family_id: PANTHER:PTHR11351
family_name: ACYL-COA DESATURASE
preferred_name: Acyl-CoA desaturase (OLE1/SCD) family
summary: >-
  ER membrane di-iron acyl-CoA desaturases. The stearoyl-CoA delta-9 desaturases (S. cerevisiae OLE1,
  S. pombe ole1, animal SCD1-5) insert the first cis double bond into palmitoyl- and stearoyl-CoA.
  Other subfamilies include plant and insect desaturases with different regiospecificity (delta-12
  and others) and bacterial homologs.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Desaturase chemistry is shared but the position of the double bond varies. Delta-9 acyl-CoA desaturation
  is established for the fungal OLE1 (SF31) and animal SCD subfamilies (SF102, SF97, SF100, SF39).
  SF31 also includes an insect delta-12 desaturase.
