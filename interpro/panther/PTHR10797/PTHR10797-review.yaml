family_id: PANTHER:PTHR10797
family_name: CCR4-NOT TRANSCRIPTION COMPLEX SUBUNIT
preferred_name: CAF1/POP2 DEDD-family CCR4-NOT deadenylases
summary: >-
  PTHR10797 is the CAF1/POP2 branch of the DEDD-family poly(A)-specific ribonucleases. Its members
  occupy the CNOT1 MIF4G docking site in CCR4-NOT, pair with an EEP-family CNOT6/CNOT6L or fungal
  Ccr4 nuclease, and hydrolyze mRNA poly(A) tails during cytoplasmic deadenylation-dependent decay.
  Human CNOT7 and CNOT8 are the two reviewed human Swiss-Prot members of this family and represent
  the vertebrate CNOT7 and CNOT8 subfamilies; both retain the conserved CAF1 catalytic role.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed human members and the PAINT seeds retain the CAF1/POP2 role: DEDD-family
  poly(A)-specific ribonuclease activity in the CCR4-NOT core complex, acting in
  deadenylation-dependent mRNA decay. PANTHER splits vertebrate CNOT8 and CNOT7 into SF1 and SF79,
  but that split reflects paralogy rather than a known loss of the ancestral activity.
