family_id: PANTHER:PTHR10029
family_name: ACYLPHOSPHATASE
preferred_name: Acylphosphatase family
summary: >-
  PTHR10029 contains small acylphosphatases that hydrolyze carboxyl-phosphate
  bonds in acyl phosphates. Human has two reviewed Swiss-Prot members: ACYP1,
  the organ-common/erythrocyte isozyme in PANTHER subfamily SF21, and ACYP2,
  the muscle-type isozyme in SF20. Both human paralogs retain the conserved
  EC 3.6.1.7 activity; current PAINT propagates only that molecular function.
  The subfamily list below is scoped to the two human-containing vertebrate
  subfamilies.
functional_coherence: COHERENT
coherence_reason: >-
  The current PAINT row places acylphosphatase activity at PTN000003030, the
  family root, with human ACYP2, fly Acyp/Acyp2, rat, horse, bovine and
  bacterial acylphosphatase donors. The activity reaches both human
  subfamilies and neither human lineage carries an IRD/IKR loss.
