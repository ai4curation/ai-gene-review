family_id: PANTHER:PTHR13301
family_name: X-BOX TRANSCRIPTION FACTOR-RELATED
preferred_name: Plant cellulose synthase and cellulose-synthase-like glycosyltransferases
summary: Plant cellulose synthases and related glycosyltransferases synthesize different glycan products.
  The retrieved group contains cellulose synthases, mixed-linkage glucan synthases and specialized small-molecule
  glycosyltransferases; the PANTHER X-box transcription-factor label is misleading for these members.
functional_coherence: HETEROGENEOUS
coherence_reason: The peanut target has CSLD3-like placement. Reconstitution distinguishes UDP-glucose-dependent
  beta-1,4-glucan synthesis by Arabidopsis CSLD3 from GDP-mannose use by CSLA9, so mannan activity is
  not validated by a CSLD label. Membrane architecture supports glycan synthesis but does not specify
  donor or polymer.
subfamilies:
- label: Plant cellulose synthase and cellulose-synthase-like glycosyltransferases
  description: The peanut target has cellulose-synthase-like D placement. Neither an X-box transcription-factor
    label nor a generic glycosyltransferase label identifies its reaction. Resolve the CSLD branch and
    polymer product before transferring cellulose, mixed-linkage glucan or small-molecule glycosylation
    functions.
  representative_members:
  - id: UniProtKB:A0A444Z7V7
    gene_symbol: A0A444Z7V7
    organism: Arachis hypogaea
    gene_review: genes/ARAHY/A0A444Z7V7/A0A444Z7V7-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0051753
    label: mannan synthase activity
  scope: UNRESOLVED
  scope_reason: Reconstituted Arabidopsis CSLD3 uses UDP-glucose to synthesize beta-1,4-glucan, whereas
    CSLA9 in the same study uses GDP-mannose. Earlier CSLD mutant and heterologous-membrane assays linked
    CSLDs to mannan, but the purified-protein comparison is stronger evidence for CSLD3 donor/product
    specificity. The peanut CSLD3-like placement therefore does not validate mannan synthase activity.
    Other glycosyltransferase branches differ, so this CSLD3 counterexample is not encoded as a family-wide
    negative.
