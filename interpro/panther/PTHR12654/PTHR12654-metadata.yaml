  name:
    name: Non-lysosomal glucosylceramidase
    short: Non-lysos_glucosylceramidase
  description:
  - text: The non-lysosomal glucosylceramidase family encompasses enzymes that catalyze
      the hydrolysis of glucosylceramides to glucose and ceramide, playing a crucial
      role in the metabolism of glycosphingolipids. These glycosphingolipids are involved
      in various cellular processes including growth, differentiation, adhesion, signaling,
      and membrane dynamics. Family members also exhibit transglucosylation activity,
      transferring glucose from glucosylceramides to cholesterol, affecting its solubility
      and function. Additionally, they can reverse this process under certain conditions.
      The enzymes are also capable of hydrolyzing and forming bile acid-glucose conjugates,
      and they can act on galactosylceramides with lower efficiency. Their activity
      is lipid-dependent and subject to regulation by various factors, including metal
      ions and specific inhibitors.
