family_id: PANTHER:PTHR12654
family_name: BILE ACID BETA-GLUCOSIDASE-RELATED
preferred_name: GBA2 nonlysosomal glucosylceramidases
summary: GBA2 proteins hydrolyze glucosylceramide outside the lysosomal GBA pathway. Human isoform-expression
  experiments show strong activity and altered ceramide balance for isoform 1, whereas the other tested
  isoforms had activity near background. An assignment of the family therefore supports a glycosphingolipid-metabolism
  hypothesis but is insufficient to declare every alternative protein record catalytically active.
functional_coherence: MOSTLY_COHERENT
coherence_reason: GBA2 is a nonlysosomal glucosylceramidase family whose complete membrane-associated
  architecture matters for activity. Expression of nine human GBA2 isoforms found only isoform 1 active
  in the tested fluorogenic-substrate and lipid assays (PMID:33261081), providing a direct counterexample
  to treating every GBA2 gene product as catalytically equivalent. The altered N terminus of the fly CG33090
  benchmark isoform does not by itself prove catalytic loss, particularly when its catalytic-region sequence
  is retained. Conserved family chemistry is supported, but activity, substrate access and topology must
  be assessed on the exact product.
