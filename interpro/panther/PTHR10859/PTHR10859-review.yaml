    label: dolichyl-phosphate beta-glucosyltransferase activity
  scope: UNRESOLVED
  scope_reason: Glucose transfer to dolichyl phosphate is experimentally supported for human ALG5 and
    is distinct from the mannose transfer performed by DPM relatives. The PANTHER vocabulary contains
    more than one glucosyltransferase-labelled subfamily, so the two benchmark ALG5 representatives do
    not define an exhaustive list of glucose-transferring branches. Exact substrate specificity and full
    catalytic architecture must delimit the applicable set; the ALG5 reaction itself is not in doubt.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-b.json
    supporting_text: Dolichyl-phosphate beta-glucosyltransferase produces dolichyl beta-D-glucosyl phosphate/Dol-P-Glc,
      the glucose donor substrate used sequentially by ALG6, ALG8 and ALG10
  - reference_id: PMID:10359825
    supporting_text: "Expression of the human ALG5 and ALG6 cDNA could partially \ncomplement the respective\
      \ S. cerevisiae alg5 and alg6 deficiency."
