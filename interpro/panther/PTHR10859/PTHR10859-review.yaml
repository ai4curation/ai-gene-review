family_id: PANTHER:PTHR10859
family_name: GLYCOSYL TRANSFERASE
summary: This dolichol-phosphate glycosyltransferase family contains enzymes producing different lipid-linked
  sugar donors. ALG5 transfers glucose from UDP-glucose to dolichyl phosphate, whereas DPM-type enzymes
  generate dolichyl-phosphate mannose. Both feed glycosylation pathways but the sugar donor and product
  are different.
functional_coherence: HETEROGENEOUS
coherence_reason: The frozen PANTHER classification separates dolichyl-phosphate beta-glucosyltransferase
  and beta-D-mannosyltransferase subfamilies. The reviewed human ALG5 reaction establishes glucose transfer
  for the ALG5 branch, including the matched horse target by orthology. Mannose transfer is not an interchangeable
  annotation.
