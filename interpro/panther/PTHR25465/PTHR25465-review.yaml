term_assessments:
- assessed_term:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  scope: RESIDUE_DETERMINED
  scope_reason: 'This is safe for members with a C3HC4 RING (site ring_c3hc4): TRIM25, RNF135, TRIM65,
    TRIM8 and TRIM47 have direct experimental evidence, and TRIM42 has a RING but little evidence. It
    is not safe for the RING-less subfamilies SF7 (TRIM29) and SF10 (TRIM16/TRIM16L) by family inference.
    TRIM16 carries an EXP annotation from a single report of B-box-dependent activity. That annotation
    should be judged on its own evidence and is not grounds for extending the term to TRIM29 or TRIM16L.
    The cell-based NEMO ubiquitination attributed to TRIM29 shows ubiquitination that depends on TRIM29,
    not that TRIM29 catalyses it, which is the weakness the 2026 review points out in in cellulo substrate
    claims.'
  determined_by_site: ring_c3hc4
  supported_by:
  - reference_id: PMID:27425606
    supporting_text: RING dimerization is required for catalysis, TRIM25-mediated RIG-I ubiquitination,
      interferon induction, and antiviral activity.
  - reference_id: PMID:40216791
    supporting_text: Although TRIM47 and TRIM72 exhibited weak activity with UBE2D1, both had enhanced
      auto-ubiquitination with UBE2D2 and UBE2D3, respectively.
  - reference_id: PMID:22629402
    supporting_text: we demonstrated that TRIM16, devoid of a classical RING domain had auto-polyubiquitination
      activity and acted as an E3 ubiquitin ligase in vivo and in vitro assays
  - reference_id: PMID:42746740
    supporting_text: For example, it has been shown that TRIM29 mediates assembly of DNA repair complex
      proteins in an E3 ligase-independent manner [25].
  - reference_id: PMID:42746740
    supporting_text: Moreover, the validation of bona fide substrates using recombinant proteins remains
      scarce in the field, with many studies correlating in cellulo substrate ubiquitination status with
      co-immunoprecipitation with the TRIM of interest.
  - reference_id: PMID:27695001
    supporting_text: TRIM29 directly bound NEMO and subsequently induced its ubiquitination and proteolytic
      degradation
