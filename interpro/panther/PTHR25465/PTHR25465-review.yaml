notes: 'This review is a companion to the PTHR24103 review and was prompted by PMID:42746740. Membership
  comes from PANTHER 19.0 human sequence classifications. The cached PAINT slice for this family also
  lists PTN007774218 and PTN000762195, the TRIM-wide nodes. In PANTHER 19.0 no human member of PTHR25465
  inherits GO:0061630 from PTN007774218: TRIM14, the RING-less protein that does inherit it, is classified
  in PTHR24103. The GOA snapshot of 2026-10-06 carries no GO:0061630 IBA on TRIM16, TRIM29, TRIM8, TRIM25,
  TRIM42, TRIM47 or TRIM65. PTN000407857 (GO:0061630, seeded by BFAR and Arabidopsis PRT1) appears
  in the slice. No human PTHR25465 member inherits from it, and its relation to this family was not
  assessed. Recommendations for gene level: the TRIM16 review keeps the EXP annotation as ACCEPT and
  the EC-derived IEA as KEEP_AS_NON_CORE. That is defensible under the rule against overruling experimental
  annotations, but the reviewer should note that RING-less TRIMs are treated as a separate class in
  PMID:42746740 and that the B-box-ligase claim has not been replicated. If TRIM29 is ever reviewed,
  no ubiquitin ligase MF should be added on the strength of the cell-based NEMO data alone.'
