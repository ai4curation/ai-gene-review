    organism: Homo sapiens
  diverged_from_family: true
  divergence_description: 'There is no RING domain. TRIM16 is reported to act as a scaffold in selective
    autophagy and stress-granule clearance. A single study proposed that its B-boxes adopt RING-like
    folds and support autoubiquitination and E3 activity in cells and in vitro, and that study underlies
    the TRIM16 EXP GO:0061630 annotation. No independent biochemical confirmation is cached here. The
    2026 TRIM E3 review groups RING-less TRIMs as a class whose function is largely unknown. TRIM16L
    has no ligase evidence.'
- subfamily_id: PANTHER:PTHR25465:SF7
  label: TRIPARTITE MOTIF-CONTAINING PROTEIN 29
  description: TRIM29 (ATDC), which has B-boxes and a coiled coil but no RING.
  representative_members:
  - id: UniProtKB:Q14134
    gene_symbol: TRIM29
    organism: Homo sapiens
  diverged_from_family: true
  divergence_description: 'There is no RING domain. TRIM29 binds modified histone tails and assembles
    DNA repair proteins into damaged chromatin as a scaffold, independently of E3 activity. A cell-based
    study reported that TRIM29 binds NEMO and induces its ubiquitination and degradation. That study
    did not show direct catalysis, and GOA carries no ubiquitin ligase annotation for TRIM29.'
