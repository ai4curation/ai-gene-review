family_id: PANTHER:PTHR25465
family_name: B-BOX DOMAIN CONTAINING
preferred_name: TRIM25/TRIM8/TRIM65/RNF135 RING E3s together with the RING-less TRIM16 and TRIM29
summary: 'PTHR25465 is a small TRIM-related family. In PANTHER 19.0 its nine human members are TRIM8,
  TRIM16, TRIM16L, TRIM25, TRIM29, TRIM42, TRIM47, TRIM65 and RNF135 (Riplet). Six of them carry an
  N-terminal C3HC4 RING. TRIM25, RNF135, TRIM65, TRIM8 and TRIM47 are RING-type E3 ubiquitin ligases,
  several of which act in RIG-I-like receptor and NF-kappaB signalling. For TRIM25, RING dimerisation
  is required for catalysis and for K63-linked ubiquitination of RIG-I. TRIM16, TRIM16L and TRIM29 have
  no RING; they keep B-boxes and a coiled coil, and TRIM16 also keeps a PRY/SPRY domain. TRIM29 binds
  histones and acts as a scaffold that assembles DNA repair proteins on damaged chromatin, independently
  of E3 ligase activity. TRIM16 is described as an autophagy and stress-granule scaffold, and one study
  reported B-box-dependent autoubiquitination.'
functional_coherence: HETEROGENEOUS
coherence_reason: 'The family combines RING-type E3 ligases with RING-less scaffolds. TRIM16 and TRIM16L
  (PTHR25465:SF10) and TRIM29 (PTHR25465:SF7) lack the RING domain, a third of the human membership. Their characterised
  activities are scaffolding, through histone binding, DNA-repair complex assembly and autophagy-receptor
  recruitment. No PAINT node in the cached slice places ubiquitin ligase activity across the whole family,
  consistent with this split. The only ligase IBD that reaches a human member is the RNF135-specific
  node PTN002556572. The UniProt/InterPro family cross-reference also disagrees with PANTHER for some
  members. UniProt and InterPro place TRIM14 here, whereas PANTHER 19.0 puts it in PTHR24103:SF595.
  UniProt places TRIM16L in PTHR19872, whereas PANTHER puts it in SF10.'
