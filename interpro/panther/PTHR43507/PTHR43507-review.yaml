family_id: PANTHER:PTHR43507
family_name: NADH-UBIQUINONE OXIDOREDUCTASE CHAIN 4
preferred_name: Complex I / NDH-1 subunit M family (NuoM / mitochondrial ND4 / plastid NdhD)
summary: >-
  Antiporter-like proton-pumping membrane subunit family of the NADH:quinone
  oxidoreductases: bacterial NuoM, mitochondrial ND4, and the plastid-encoded NdhD of
  the chloroplast NDH complex. Bacterial and mitochondrial members are respiratory,
  reducing ubiquinone in NDH-1 or respiratory complex I during aerobic respiration. The
  plastid NdhD clade (subfamily SF21 in the fetched slice) belongs to the thylakoid
  NAD(P)H dehydrogenase complex (GO:0010598), which runs photosynthetic cyclic electron
  flow around photosystem I and chlororespiration on plastoquinone. The
  compartment-neutral coupling chemistry (electron transport coupled proton transport)
  is true family-wide; respiratory-process, NADH-donor and ubiquinone-specific terms are
  not.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Respiratory members (NuoM, ND4) act in bacterial NDH-1 or mitochondrial respiratory
  complex I on ubiquinone; the plastid NdhD clade acts in the thylakoid NDH complex on
  plastoquinone in photosynthetic cyclic electron flow. Uniquely among the POPTR NDH
  families, the plastid members here do sit in their own subfamily (SF21, NAD(P)H-QUINONE
  OXIDOREDUCTASE CHAIN 4, CHLOROPLASTIC), but the challenged assertions sit on a node
  above that split, so they still leak across it.
reference_protein:
  id: UniProtKB:P0AFE8
  label: NADH-quinone oxidoreductase subunit M
  gene_symbol: nuoM
  organism: Escherichia coli (strain K12)

subfamilies:
  - subfamily_id: PANTHER:PTHR43507:SF21
    label: NAD(P)H-QUINONE OXIDOREDUCTASE CHAIN 4, CHLOROPLASTIC
    description: >-
      The plastid-encoded NdhD clade (137 members in the fetched slice, dominated by
      chloroplastic chain-4 proteins), including poplar ndhD.
    representative_members:
      - id: UniProtKB:A4GYW6
        label: NAD(P)H-quinone oxidoreductase chain 4, chloroplastic
        organism: Populus trichocarpa
        gene_review: genes/POPTR/ndhD/ndhD-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      Diverged from the respiratory role of the bacterial/mitochondrial members into the
      thylakoid NDH complex, which drives photosynthetic cyclic electron flow and
      chlororespiration and uses plastoquinone; aerobic-respiration, NADH-donor and
      ubiquinone-specific terms inherited from deeper nodes are over-annotations here,
      while proton-coupled electron transport remains its core chemistry.

node_assessments:
  - node_id: PANTHER:PTN000511780
    asserted_term:
      id: GO:0009060
      label: aerobic respiration
    paint_snapshot: "20251220"
    seeds:
      - id: FB:FBgn0262952
      - id: UniProtKB:P03905
        label: NADH-ubiquinone oxidoreductase chain 4
        organism: Homo sapiens
      - id: UniProtKB:P0AFE8
        label: NADH-quinone oxidoreductase subunit M
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Aerobic respiration is correct for the bacterial and mitochondrial seeds, but the
      plastid NdhD clade (SF21) descends from this node (poplar ndhD receives the IBA
      with exactly this WITH/FROM) and functions in photosynthetic cyclic electron flow
      and chlororespiration; the poplar gene review removes the inherited term.
    affected_subfamilies:
      - id: PANTHER:PTHR43507:SF21
        label: NAD(P)H-QUINONE OXIDOREDUCTASE CHAIN 4, CHLOROPLASTIC
  - node_id: PANTHER:PTN000511780
    asserted_term:
      id: GO:0003954
      label: NADH dehydrogenase activity
    paint_snapshot: "20260530"
    seeds:
      - id: UniProtKB:P0AFE8
        label: NADH-quinone oxidoreductase subunit M
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      NADH-donor activity fits the respiratory members, but the plastid NDH complex
      accepts electrons from ferredoxin/NAD(P)H onto plastoquinone, so the NADH-specific
      activity term should not descend unmodified into SF21; the poplar gene review
      keeps the chemistry via the better-matched quinone-acceptor term GO:0016655.
    affected_subfamilies:
      - id: PANTHER:PTHR43507:SF21
        label: NAD(P)H-QUINONE OXIDOREDUCTASE CHAIN 4, CHLOROPLASTIC
  - node_id: PANTHER:PTN000511780
    asserted_term:
      id: GO:0048039
      label: ubiquinone binding
    paint_snapshot: "20170428"
    seeds:
      - id: UniProtKB:P0AFE8
        label: NADH-quinone oxidoreductase subunit M
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      The plastid NDH complex binds plastoquinone, not ubiquinone, so the
      ubiquinone-specific binding term must not descend into SF21; the poplar gene
      review generalizes the inherited term to quinone binding (GO:0048038).
    affected_subfamilies:
      - id: PANTHER:PTHR43507:SF21
        label: NAD(P)H-QUINONE OXIDOREDUCTASE CHAIN 4, CHLOROPLASTIC
  - node_id: PANTHER:PTN000511780
    asserted_term:
      id: GO:0015990
      label: electron transport coupled proton transport
    paint_snapshot: "20170428"
    seeds:
      - id: UniProtKB:P0AFE8
        label: NADH-quinone oxidoreductase subunit M
        organism: Escherichia coli (strain K12)
    assessment: SOUND
    assessment_reason: >-
      Coupling electron transfer to proton translocation is the shared chemistry of the
      bacterial, mitochondrial and plastid complexes alike, so this compartment-neutral
      process term is safe for every descendant; the poplar NDH gene reviews use it as
      the core process.
  - node_id: PANTHER:PTN000511783
    asserted_term:
      id: GO:0045271
      label: respiratory chain complex I
    paint_snapshot: "20241121"
    seeds:
      - id: FB:FBgn0262952
      - id: MGI:MGI:102498
      - id: UniProtKB:P03905
        label: NADH-ubiquinone oxidoreductase chain 4
        organism: Homo sapiens
      - id: UniProtKB:P03910
    assessment: SOUND
    assessment_reason: >-
      Complex I membership is placed on a narrower node seeded entirely by mitochondrial
      ND4 proteins, and the plastid clade does not inherit it: poplar ndhD carries no
      GO:0045271 IBA. Correctly scoped.

