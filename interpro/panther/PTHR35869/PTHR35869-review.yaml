family_id: PANTHER:PTHR35869
family_name: OUTER-MEMBRANE LIPOPROTEIN CARRIER PROTEIN
preferred_name: LolA periplasmic lipoprotein carrier family
summary: >-
  PTHR35869 represents LolA-like soluble periplasmic lipoprotein carriers with a hydrophobic cavity that
  shields the cargo lipid anchor. In the characterized E. coli pathway, LolA accepts lipoproteins from
  LolCDE and delivers them to LolB for outer-membrane insertion. This partner arrangement is not universal:
  a CB15-derived Caulobacter LolA construct supports both carrier and insertion functions in engineered
  E. coli, and distant Bacteroidota systems have specialized LolA/LolB homologs. Carrier function does
  not imply that every family member requires the E. coli LolB partner or has an autonomous insertase
  activity.
functional_coherence: COHERENT
coherence_reason: >-
  Characterized members share a lipoprotein-carrier architecture, but exact substrate coverage across
  the entire family is unresolved. The inventory names alone do not establish activity. F. johnsoniae
  LolA1/A5FI22 and LolA2/A5FKZ5 share SF1, while the latter is associated with a flexirubin biosynthesis
  locus and its substrate remains uncertain. This is not evidence of a demonstrated loss of lipoprotein
  binding.
