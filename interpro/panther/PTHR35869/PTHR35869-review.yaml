notes: >-
  The PAINT node is placed at Gammaproteobacteria; LolA homologs outside that class (e.g. other proteobacteria
  and non-proteobacterial diderms) are covered by PANTHER classification but not by this node's IBD. Re-audit
  2026-11-07: the current tree confirms nine descendants under the gamma node. PMID:36716372 cloned CC_3705
  from C. vibrioides CB15; decisive complementation used a final-12-residue E. coli substitution and permissive
  E. coli backgrounds including delta-lpp. It supports a bounded bifunctional construct, not a direct
  native CB15 insertion assay or universal LolA insertion. PMID:40050408 establishes distant Bacteroidota
  LolA/LolB roles with substrate and partner specialization; absence of the classical LolB sequence family
  is not absence of an insertion partner. Preserve the unmodified historical PAINT assertions. The broader
  GO:0140598/GO:0044874 scopes are unresolved because substrate specificity of SF1 LolA2/A5FKZ5 is not
  settled; this does not withdraw canonical positive evidence or infer activity loss. Named-member assays,
  not the broad classification alone, should qualify module realizers.
