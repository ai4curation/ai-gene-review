family_id: PANTHER:PTHR35869
family_name: OUTER-MEMBRANE LIPOPROTEIN CARRIER PROTEIN
preferred_name: LolA periplasmic lipoprotein carrier family
summary: >-
  PTHR35869 is the LolA family of periplasmic outer-membrane lipoprotein
  carriers. LolA is a soluble periplasmic protein with an incomplete beta-barrel
  enclosing a hydrophobic cavity. It is recruited by LolC of the inner-membrane
  LolCDE complex, accepts released mature lipoproteins, shields their lipid
  anchor across the periplasm and passes them mouth-to-mouth to the
  outer-membrane receptor LolB.
functional_coherence: COHERENT
coherence_reason: >-
  Almost all reviewed members (171 of 173 in the reviewed inventory) are
  annotated as outer-membrane lipoprotein carrier proteins and fall in the
  single subfamily SF1; the two exceptions are uncharacterized proteins from
  Aquifex and Rickettsia with no contradicting evidence.
