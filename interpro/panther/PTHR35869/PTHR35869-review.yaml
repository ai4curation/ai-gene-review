term_assessments:
- assessed_term:
    id: GO:0140598
    label: lipoprotein carrier activity
  scope: UNRESOLVED
  scope_reason: >-
    Direct carrier/localization evidence is retained for E. coli LolA and the characterized LolA lineage,
    including F. johnsoniae LolA1. The same SF1 also contains LolA2/A5FKZ5: PMID:40050408 finds a conserved
    LolA2/LolB2 pair within flexirubin-related loci, with differing cavity and terminal architecture,
    and proposes a pigment-related role. This positive contextual specialization makes substrate generalization
    uncertain; direct pigment transport or loss of lipoprotein carriage is not established. Whole-family
    and whole-SF1 applicability remain unresolved. Exact positive member evidence and the narrower gamma
    PAINT assertions are preserved; no exhaustive alternative subfamily boundary or evolutionary loss
    is invented. Insertion activity and universal LolB dependence are separate claims.
