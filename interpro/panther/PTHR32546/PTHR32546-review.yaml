    label: protein-membrane adaptor activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Both vertebrate members recruit R7 RGS-Gbeta5 complexes to the membrane: GPR158 translocates RGS7-Gbeta5 to
    the plasma membrane in transfected cells and is needed for its membrane association in brain, and GPR179 is
    required to target RGS7 and RGS11 to ON-bipolar dendritic tips. The GPR179 review accepts this as the core
    molecular role. The invertebrate subfamilies (CG31760-related SF16 and others) are untested, so the term is
    scoped to SF11 and SF7.
