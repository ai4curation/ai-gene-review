family_id: PANTHER:PTHR32546
family_name: G-PROTEIN COUPLED RECEPTOR 158-RELATED
preferred_name: GPR158/GPR179 orphan class C receptor family
summary: >-
  Distant class C G protein-coupled receptor-like proteins that lack the Venus flytrap ligand-binding module of
  typical class C receptors. The vertebrate members are GPR158, a neuronal receptor that anchors the
  RGS7-Gbeta5 complex at the plasma membrane, allosterically enhances its GTPase-activating activity toward
  Galpha(o), and has been identified as a metabotropic glycine receptor; and GPR179, a retina-restricted
  paralog that targets the RGS7- and RGS11-Gbeta5 complexes to the dendritic tips of ON-bipolar cells, where it
  forms complexes with mGluR6 and TRPM1 and is required for the ON response. The family also contains
  uncharacterized invertebrate members such as Drosophila CG31760.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Membrane anchoring of R7 RGS-Gbeta5 complexes is shown for both vertebrate members and is the shared,
  best-supported activity. Receptor activity diverges: GPR158 has a defined ligand (glycine) and regulates
  Go signalling through RGS7 rather than by canonical G protein activation, while GPR179 has no known ligand and
  no demonstrated G protein activation. The invertebrate subfamilies are uncharacterized.
