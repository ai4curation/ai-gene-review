- assessed_term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The family is placed in class C by sequence and both vertebrate members keep the residues that class C
    receptors use to activate G proteins, but neither activates G proteins canonically. For GPR158 a ligand is
    known: glycine binds it and, through RGS7, regulates Go signalling, so receptor activity holds in the specific
    form of G protein-coupled glycine receptor activity (the GPR158 review MODIFYs the generic row to that term).
    For GPR179 no ligand and no ligand-induced G protein activation has been shown, and the original description
    of both proteins left open whether they act as bona fide GPCRs; the GPR179 review marks the InterPro-derived
    row over-annotated. The term is therefore safe for SF11 only. There is no PAINT node for this family, so the
    term reaches members only electronically.
