  name:
    name: Yes-associated protein 1
    short: YAP1
  description:
  - text: The YAP1 family comprises transcriptional regulators that function as coactivators
      or corepressors. They are essential components of the Hippo signaling pathway,
      which is crucial for controlling organ size, suppressing tumors, and regulating
      apoptosis and proliferation. Family members mediate tissue tension and 3D tissue
      shape by influencing the cortical actomyosin network. They interact with TEAD
      transcription factors and are involved in various cellular processes, including
      cell contact-mediated growth control, epithelial-mesenchymal transition, and
      ciliogenesis suppression. Some members also play roles in neural plate development,
      stress response, and aging.
