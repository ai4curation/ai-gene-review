family_id: PANTHER:PTHR10173
family_name: METHIONINE SULFOXIDE REDUCTASE
preferred_name: Methionine-R-sulfoxide reductase B family
summary: >-
  PTHR10173 contains thioredoxin-dependent methionine-R-sulfoxide reductase B
  enzymes. The two reviewed human family members are MSRB2, a mitochondrial
  enzyme in SF37, and MSRB3, an ER/mitochondrial enzyme in SF56. Both retain the
  peptide-Met-R-SO reductase core and structural Zn-binding Cys pairs.
functional_coherence: COHERENT
coherence_reason: >-
  The PAINT annotations in the current family are limited to the root
  peptide-Met-R-SO reductase molecular function and the coarse cytoplasm
  component. Both apply to human MSRB2 and MSRB3: the activity is the shared
  core MsrB reaction, and GO cytoplasm is broad enough to include their
  mitochondrial and ER locations.
