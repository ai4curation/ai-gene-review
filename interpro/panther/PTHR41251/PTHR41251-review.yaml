  assessment: SOUND
  assessment_reason: The actual tree places the Bacillus, PAO1 and H37Rv exemplars below this node, and
    the experimentally characterized Ku scaffold binds duplex ends. The two listed seeds support the conserved
    activity; their count is not a weakness. KT2440 Q88HU8 is absent from the sampled tree and is not
