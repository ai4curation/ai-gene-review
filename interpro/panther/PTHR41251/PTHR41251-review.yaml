    label: double-stranded DNA binding
  scope: FAMILY_WIDE
  scope_reason: Conserved Ku DNA-binding scaffold and the inspected PAINT node support duplex binding.
    This does not transfer the exact end-protection kinetics of a truncated construct to every member.
  supported_by:
  - *id003
- assessed_term:
    id: GO:0045027
    label: DNA end binding
  scope: UNRESOLVED
  scope_reason: DNA-end binding is established for the characterized bacterial members and is retained
    on their gene reviews and the bacterial module. The inspected PAINT node asserts only duplex binding,
    and the current family also contains nonbacterial leaves whose end-specific function was not independently
    established. No finer experimentally supported clade boundary was established for all family members,
    so this finer term is not granted family-wide. This uncertainty does not retract the measured member-level
    end binding.
  supported_by:
  - *id003
- assessed_term:
    id: GO:0140078
    label: class I DNA-(apurinic or apyrimidinic site) endonuclease activity
  scope: UNRESOLVED
  scope_reason: AP beta-elimination is measured for Bacillus and Pseudomonas Ku, but no experimentally
    or phylogenetically justified family-wide catalytic grant or narrower gain/loss node has been established.
    Retain the positive member evidence without treating every Ku as an AP lyase.
  supported_by:
