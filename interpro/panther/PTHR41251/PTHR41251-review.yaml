family_id: PANTHER:PTHR41251
family_name: NON-HOMOLOGOUS END JOINING PROTEIN KU
preferred_name: Prokaryotic-type Ku DNA-end-binding proteins
summary: Ku proteins bind broken duplex DNA ends and assemble end-joining complexes. Bacterial Ku homodimers
  recruit repair ligases and protect or align DNA ends. Some experimentally characterized Ku proteins
  additionally process abasic sites, but this chemistry has not been established throughout the family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: DNA-end binding is the conserved structural role. C-terminal organization, repair partners
  and measured AP/5-prime-dRP lyase activities differ in evidential scope; the latter are not granted
  family-wide. The family contains nonbacterial records, so family membership alone does not establish
  bacterial taxon context.
