family_id: PANTHER:PTHR19970
family_name: RIBOSOMAL PROTEIN L39E
preferred_name: eL39 large-ribosomal-subunit proteins
summary: eL39 is a small structural protein of the eukaryotic large ribosomal subunit. Its location in
  the assembled ribosome supports translation and influences the environment encountered by a nascent
  chain. Its short length is normal for this ribosomal protein family and is not itself evidence of a
  truncated nonfunctional protein.
functional_coherence: COHERENT
coherence_reason: The 43-member inventory consistently identifies eL39 relatives, and NCU08990/Q7S2X9
  has both the specific eL39 InterPro and Pfam signatures. Its 51-residue length is compatible with this
  naturally small structural ribosomal protein. This supports a large-subunit structural role by family
  evidence, not a direct Neurospora functional assay or proof of a paralog-specific translational program.
subfamilies:
- subfamily_id: PANTHER:PTHR19970:SF0
  label: LARGE RIBOSOMAL SUBUNIT PROTEIN EL39
  description: The inventory consistently contains eL39 and closely related paralogs, and a Neurospora
    ribosome structure provides organism-relevant structural context. Broad structural-ribosome participation
    is supported; individual paralog-specific developmental or translational phenotypes require separate
    evidence.
