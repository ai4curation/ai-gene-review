  2 additional GO term(s)) are conserved across the primary ancestral clade, with lineage-specific variation reflected by
  IBD assertions distributed across 2 PTN nodes (PANTHER:PTN000359335, PANTHER:PTN000359344); member-specific pruning exception(s)
  on GO:1990604.
