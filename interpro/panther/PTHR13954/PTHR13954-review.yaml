  member_exceptions:
  - member:
      id: UniProtKB:G0RBE3
      gene_symbol: IRE1
      organism: HYPJE
      gene_review: genes/HYPJE/IRE1/IRE1-ai-review.yaml
    pruned_node_id: PANTHER:PTN000359344
    exception_reason: Mark mammalian ER-stress apoptosis signaling as over-propagation to fungal IRE1. The focused fungal
      IRE1 report found no evidence that Trichoderma IRE1 drives the mammalian IRE1-TRAF2-ASK1/JNK apoptotic arm.
    supported_by:
    - reference_id: file:genes/HYPJE/IRE1/IRE1-ai-review.yaml
      supporting_text: drives the mammalian IRE1-TRAF2-ASK1/JNK apoptotic arm. The direct target paper
  - member:
      id: UniProtKB:P32361
      gene_symbol: IRE1
      organism: yeast
      gene_review: genes/yeast/IRE1/IRE1-ai-review.yaml
    pruned_node_id: PANTHER:PTN000359344
    exception_reason: IBA annotation for apoptotic signaling in response to ER stress. This is primarily a metazoan function
      (IRE1alpha/beta in mammals). Yeast does not have classical apoptosis, although programmed cell death mechanisms exist.
      The IBA inference from mammalian orthologs may not be fully appropriate for yeast. This annotation appears to have been
      inferred from mammalian ERN paralogs where IRE1 contributes to apoptotic signaling under prolonged ER stress.
    supported_by:
    - reference_id: file:genes/yeast/IRE1/IRE1-ai-review.yaml
      supporting_text: IBA annotation for apoptotic signaling in response to ER stress.
