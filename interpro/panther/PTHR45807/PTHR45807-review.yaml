notes: >-
  Tree topology, subfamily assignments and PTN positions come from the PANTHER 19 treeinfo service (family=PTHR45807).
  The filtered and unfiltered views gave the same 91-leaf tree. The root PTN001975446 (labelled Eumetazoa,
  SF7) has two children: the Trichoplax leaf and the Bilateria node PTN001562978. The Bilateria node splits
  into Deuterostomia (sea urchin, then amphioxus, then a Ciona duplication, then the euteleostome four-way
  duplication polytomy PTN002521566 over SF6, SF5, SF1 and SF3) and Hexapoda-Crustacea (Drosophila hop,
  Daphnia). The tree contains no nematode, amoebozoan, fungal or plant leaf. InterPro matches of the HMM
  outside Metazoa are few (40 fungal, 29 of them arbuscular-mycorrhizal Glomeromycota, all 47-876 residues;
  2 plant; 1 choanoflagellate; 0 amoebozoan). Nematode matches are 5 fragments of 99-430 residues. The
  choanoflagellate match, Monosiga A9UPS2, is a FERM-SH2-dual-kinase protein whose kinase domain groups
  with SYK, not JAK (PMID:24058787). PAINT seed identities were resolved from the tree (MGI:96628 Jak1,
  MGI:96629 Jak2, MGI:99928 Jak3, RGD:69056 Jak1, RGD:2939 Jak2, RGD:2940 Jak3; ZFIN:ZDB-GENE-980526-481
  is zebrafish jak2a/jak4 in SF2) and from UniProt (K7GSE8 pig JAK3). Findings for PAINT. (1) The negated
  IRD for GO:0007259 on the TYK2 node PTN002910252 is contradicted by TYK2's own experimental record and
  should be retracted. Human and mouse TYK2 currently get no GO:0007259 IBA because of it. (2) The GH-receptor
  IBDs on the euteleostome duplication polytomy reach JAK3. GO:0060397 has only JAK2 seeds and belongs
  on PTN002910276. GO:0005131 and GO:0060333 need an IRD on the JAK3 clade. (3) The worm and Dictyostelium
  GO:0007259 IBAs do not come from this family. They come from the STAT family node PTN000927860 (PTHR11801).
  This family's tree confirms that those organisms have no JAK, which is the basis for the taxon-constraint
  proposals made alongside this review. The older free-text PTHR45807-review.md and the Falcon deep research
  (which framed the family as under-annotated and did not address nematodes or Dictyostelium) were read.
  Neither changes the node verdicts. The Falcon JH1 residue numbering (catalytic lysines K908/K882/K855/K930
  and activation-loop tyrosines Y1034/Y1007/Y980/Y1054 for JAK1/JAK2/JAK3/TYK2) was checked against UniProt
  canonical sequences and is correct. JAK origin and distribution (sponge JAK-like protein as the earliest
  bona fide JAK-like architecture, canonical JAK and pathway assembly in Bilateria, and the choanoflagellate
  JAK-like protein grouping with SYK, so that no bona fide JAK is known outside Metazoa) follow the Liongue
  and Ward 2013 evolutionary review (PMID:24058787). A cross-gene briefing on JAK-STAT
  taxon scope across the STAT, JAK and PIAS families and the C. elegans and Dictyostelium STAT modules
  is at https://claude.ai/artifact/4MLfbbbWWnLchDvspwdPuM.
