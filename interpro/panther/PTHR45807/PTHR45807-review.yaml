family_id: PANTHER:PTHR45807
family_name: TYROSINE-PROTEIN KINASE HOPSCOTCH
preferred_name: Janus kinases (JAK1, JAK2, JAK3, TYK2, Drosophila Hopscotch)
summary: >-
  Janus kinases are cytoplasmic (non-membrane-spanning) protein tyrosine kinases. They are the catalytic
  partners of cytokine receptors that have no kinase domain of their own. Each JAK has an N-terminal FERM
  domain and an SH2-like domain that together bind the membrane-proximal box1/box2 region of a receptor
  tail, a JH2 pseudokinase domain that holds the kinase off until ligand binds, and a C-terminal JH1 tyrosine
  kinase domain. When a cytokine brings two receptor chains together, the attached JAKs trans-phosphorylate
  each other's activation loops. They then phosphorylate receptor tyrosines, which become docking sites
  for STAT SH2 domains, and finally the STATs themselves, which dimerize and move to the nucleus. Vertebrates
  have four paralogs that arose by duplication near the root of Euteleostomi, each used by a different
  set of receptors. JAK1 serves class II (interferon, IL-10 family), gamma-c and gp130 receptors. JAK2
  serves the homodimeric hormone-like receptors (erythropoietin, thrombopoietin, growth hormone) and IFN-gamma,
  and is required for definitive erythropoiesis. JAK3 binds only the common gamma chain of the IL-2, -4,
  -7, -9, -15 and -21 receptors. TYK2 pairs with JAK1 or JAK2 on the type I IFN, IL-10, IL-12 and IL-23
  receptors. Insects have a single JAK, Hopscotch, which signals from the Upd/Domeless receptor to Stat92E
  in segmentation, hematopoiesis and immunity. A canonical JAK, with both the pseudokinase and the kinase
  domain, is a bilaterian feature. A sponge protein with FERM, SH2 and a single JAK-related kinase domain
  marks the earliest JAK-like architecture. Nematodes have STATs but no JAK, and Dictyostelium, whose
  STATs are activated by tyrosine kinase-like kinases, has no JAK either. No bona fide JAK is known outside
  Metazoa.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member, the four vertebrate paralogs and Drosophila Hopscotch, is a receptor-associated
  non-receptor tyrosine kinase that drives STAT activation. The JH1 catalytic lysine, HRD aspartate and
  the tyrosine-kinase catalytic-loop arginine (HRDLAARN/HRDLATRN) are conserved in all of them. The family
  has no catalytically inactive lineage. The JH2 pseudokinase is a regulatory domain present in every
  full-length member, and in JAK2 it even has weak dual-specificity kinase activity. It is not a subfamily-level
  pseudoenzyme. The divergence between paralogs is in which receptors they serve, not in what they do.
  So the kinase activity, cytokine-receptor binding and JAK-STAT signaling are family-wide, while each
  named cytokine pathway is paralog-specific (see term assessments). Two caveats concern membership, not
  function. (1) The pre-bilaterian members under the family root (sponge, placozoan, cnidarian) are uncharacterized,
  and PAINT correctly places the family terms one node lower, at Bilateria. (2) The PANTHER HMM also catches
  short kinase-domain fragments in nematodes and a few fungi. These are not JAKs: a 203-residue Panagrolaimus
  fragment carries a Ser/Thr-type catalytic loop. Through TreeGrafter they pick up the family's IEA terms.
