residue_sites:
- site_id: jh1_ptk_catalytic
  label: JH1 tyrosine-kinase catalytic residues
  description: >-
    Three catalytic residues of the C-terminal JH1 kinase domain of JAK1, from UniProt features and the
    catalytic-loop sequence. K908 is the ATP-binding lysine (UniProt binding site). D1003 is the HRD catalytic
    base (UniProt active site, proton acceptor). R1007 is the arginine of the HRDLAARN catalytic loop,
    a tyrosine-kinase hallmark: serine/threonine kinases carry HRDLKPEN, with the basic residue two positions
    earlier and an acidic residue here. The same three residues are present in JAK2 (K882, D976, R980;
    loop HRDLATRN), JAK3 (K855, D949, R953), TYK2 (K930, D1023, R1027) and Drosophila Hopscotch (K926,
    D1014, R1018), checked against UniProt canonical sequences. The JH2 pseudokinase domain is deliberately
    not used. It is a regulatory domain present in every full-length member, and JAK2 JH2 has weak dual-specificity
    activity on S523 and Y570, so no member-level GO claim depends on it. The negative control is a sequence-level
    one, not an experimentally tested one. It is the 203-residue Panagrolaimus superbus fragment A0A914YCL6,
    which PANTHER places in SF7 and which TreeGrafter annotates with the family's tyrosine-kinase and
    JAK-STAT terms. Its catalytic loop reads HCDLKASN, a Ser/Thr-type loop (InterPro IPR008271) with S171
    at the position of JAK1 R1007.
  anchor:
    id: UniProtKB:P23458
    label: Tyrosine-protein kinase JAK1
    gene_symbol: JAK1
    organism: Homo sapiens
  anchor_sequence_version: 2
  site_source: UNIPROT_FEATURE
  residues:
  - position: 908
    expected:
    - K
    role: ATP-binding lysine (beta3)
  - position: 1003
    expected:
    - D
    role: catalytic base (HRD motif, proton acceptor)
  - position: 1007
    expected:
    - R
    role: tyrosine-kinase-specific catalytic-loop arginine (HRDLAARN)
  required_for:
  - term:
      id: GO:0004715
      label: non-membrane spanning protein tyrosine kinase activity
    strength: CONTRIBUTES
    rationale: >-
      Phosphotransfer in the JH1 domain needs the beta3 lysine to position ATP and the HRD aspartate as
      the catalytic base. The catalytic-loop arginine of the HRDLAARN loop is what distinguishes tyrosine
      kinases from serine/threonine kinases, so its replacement flags a kinase domain that is unlikely
      to phosphorylate tyrosine. The site is recorded as CONTRIBUTES, not REQUIRED, because no full-length
      family member lacks it and the only negative control is a sequence fragment, not a tested protein.
    supported_by:
    - reference_id: PMID:8314084
      supporting_text: >-
        The hop gene encodes a putative nonreceptor tyrosine kinase of the Janus kinase family, based
        on an internal duplication of the catalytic domain.
    - reference_id: PMID:21841788
      supporting_text: >-
        Here we show that JH2 is a dual-specificity protein kinase that phosphorylates two negative regulatory
        sites in JAK2
