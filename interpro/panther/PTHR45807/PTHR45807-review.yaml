    organism: Drosophila melanogaster
  - id: MGI:MGI:96629
    label: Jak2
    organism: Mus musculus
  assessment: SOUND
  assessment_reason: >-
    PTN001562978 is the Bilateria speciation node in the PANTHER 19 tree. It sits one step below the family
    root (PTN001975446, labelled Eumetazoa, which also holds the Trichoplax member) and covers the deuterostome
    JAKs (sea urchin, amphioxus, Ciona and the four vertebrate paralogs) and the Hexapoda-Crustacea branch
    (Drosophila hop, Daphnia). JAKs have no transmembrane segment. They are cytoplasmic and bind the cytoplasmic
    tails of cytokine receptors through their FERM-SH2 region. Seeds from the fly (hop) and mouse (Jak2)
    bracket the node. Cytosol is a correct, if incomplete, location. The receptor-bound pool at the cytoplasmic
    face of the plasma membrane is the site of action.
