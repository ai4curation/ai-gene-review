term_assessments:
- assessed_term:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Shown directly for JAK1, JAK2, JAK3, TYK2 and Hopscotch. The JH1 catalytic site (jh1_ptk_catalytic)
    is intact in every full-length member checked, so it is core for all four vertebrate subfamilies,
    the teleost SF2 and hop. It does not apply to the short kinase-domain fragments the HMM also captures
    in nematodes and fungi. These are not JAKs, and the residue site shows what one of them looks like.
  supported_by:
  - reference_id: PMID:7796812
    supporting_text: We conclude that hopTum-l encodes a hyperactive Hop kinase
  - reference_id: PMID:7526154
    supporting_text: >-
      the p135tyk2 tyrosine kinase directly binds and tyrosine phosphorylates this receptor subunit
  - reference_id: PMID:8343951
    supporting_text: >-
      EPO induces tyrosine phosphorylation of JAK2 kinase and activates its in vitro autophosphorylation
- assessed_term:
    id: GO:0005126
    label: cytokine receptor binding
  scope: FAMILY_WIDE
  scope_reason: >-
    Receptor binding through the FERM-SH2 module is the mechanism that defines the family. It is shown
    for JAK2 (EPOR, GHR), TYK2 (IFNAR1), JAK1 and JAK3 (IL-2R beta and gamma-c), and for hop through the
    Upd/Domeless system. It is core for all bilaterian members.
  supported_by:
  - reference_id: PMID:8343951
    supporting_text: >-
      JAK2 physically associates with a membrane-proximal region of the EPOR cytoplasmic domain that is
      required for biological activity
  - reference_id: PMID:7973659
    supporting_text: >-
      Jak3-negative fibroblasts expressing reconstituted IL-2R became responsive to IL-2 after the additional
      expression of Jak3 complementary DNA
  - reference_id: PMID:24058787
    supporting_text: >-
      the association of the prototypal JAK with a membrane-bound receptor that lacked intracellular tyrosine
      kinase activity
- assessed_term:
    id: GO:0007259
    label: cell surface receptor signaling pathway via JAK-STAT
  scope: FAMILY_WIDE
  scope_reason: >-
    It is the defining process for every full-length bilaterian member. It is shown for all four vertebrate
    paralogs and for Drosophila hop, which acts upstream of the STAT Marelle. It applies to TYK2 in particular,
    despite the PAINT IRD on the TYK2 node, which this review judges wrong. Pre-bilaterian JAK-like members
    sit outside the PAINT node and are untested. The term must not reach nematode proteins. Nematodes
    have no JAK, so the only nematode members are kinase-domain fragments that the HMM captures. One of
    these receives the term by TreeGrafter IEA and is excepted below. TreeGrafter also gives GO:0007259
    as IEA to 13 fungal (mostly Glomeromycota), 2 plant and 1 bacterial protein that the family HMM matches
    (QuickGO, October 2026). Those deserve the same scrutiny, but whether they are assembly contaminants,
    horizontal transfers or mis-scored kinases was not resolved here, so they are not listed as exceptions.
  member_exceptions:
  - member:
      id: UniProtKB:A0A914YCL6
      label: Serine/threonine-protein (fragment)
      organism: Panagrolaimus superbus
    exception_reason: >-
      A 203-residue nematode fragment that has only a protein kinase domain (no FERM, SH2 or JH2) with
      a Ser/Thr-type catalytic loop (HCDLKASN). PANTHER places it in SF7, and TreeGrafter then grafts
      it under the Bilateria node PTN001562978, so it receives GO:0007259, GO:0019221, GO:0004715 and
      GO:0005126 as IEA. It is not a JAK ortholog, and nematodes have no JAK. C. elegans has no JAK homolog,
      the PANTHER 19 reference tree has no nematode member, and across all nematode proteomes the family
      HMM matches only five fragments of 99-430 residues. The PAINT node is sound for real JAKs, so no
      pruned node is named. The error is in the HMM/TreeGrafter placement of a fragment.
    supported_by:
    - reference_id: PMID:28874466
      supporting_text: There is no conserved homolog of the JAK kinases in C. elegans
    - reference_id: PMID:24058787
      supporting_text: >-
        The canonical JAK domain architecture inclusive of a pseudo-kinase domain appears to be unique
        within bilateria
  supported_by:
  - reference_id: PMID:8608595
    supporting_text: Our results demonstrate the existence of an invertebrate JAK/STAT system.
  - reference_id: PMID:9784499
    supporting_text: >-
      Upd is a secreted protein, associated with the extracellular matrix, that activates the JAK pathway.
  - reference_id: PMID:1386289
    supporting_text: >-
      This finding shows that tyk2 links the interferon alpha/beta receptor to the cytoplasmic transcription
      factor that mediates activation of interferon-responsive genes.
  - reference_id: PMID:9590172
    supporting_text: >-
      they fail to manifest biologic responses to cytokines that bind to three distinct families of cytokine
