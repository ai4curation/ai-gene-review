  description: >-
    PANTHER's default subfamily, assigned at the family root (PTN001975446, Eumetazoa). It collects every
    member not placed in a vertebrate paralog subfamily: Drosophila Hopscotch and other arthropod JAKs,
    the single JAKs of sea urchin, amphioxus and Ciona, the placozoan, cnidarian and sponge JAK-like proteins
    (for example Ephydatia EfPTK30, which has FERM, SH2 and a single kinase domain), and the HMM-captured
    kinase-domain fragments from nematodes and fungi. It is phylogenetically heterogeneous. The bilaterian
    members (hop and the invertebrate deuterostome JAKs) share the family function, but the pre-bilaterian
    members are untested and the fragments are not JAKs.
