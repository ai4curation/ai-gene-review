  - id: ZFIN:ZDB-GENE-980526-481
    label: jak2a (jak4)
    organism: Danio rerio
  assessment: SOUND
  assessment_reason: >-
    The defining process of the family. Seeds come from both bilaterian branches: fly hop and zebrafish
    jak2a, mouse Jak1/Jak2/rat Jak2, and human JAK1, JAK2 and TYK2. Hop acts upstream of the STAT Marelle/Stat92E,
    which shows an invertebrate JAK/STAT system. The Upd ligand activates the pathway through Hop. No
    nematode or Dictyostelium protein sits in the PANTHER 19 tree for this family, and C. elegans has
    no JAK homolog. So this node does not deliver the JAK-STAT term to any organism that lacks the pathway.
    The worm and slime-mould GO:0007259 IBAs come from the STAT family (PTHR11801 node PTN000927860),
    not from here. The one route by which a nematode protein gets this term from PTHR45807 is TreeGrafter
    IEA onto kinase-domain fragments (see the member exception on the GO:0007259 term assessment). The
    TYK2-node IRD that blocks descent of this term to TYK2 is assessed separately and judged wrong. The
    Bilateria placement matches the evolutionary record: the canonical JAK architecture with a JH2 pseudokinase,
    and the assembly of JAK, STAT, SHP and SOCS into a working pathway, are both dated to Bilateria, while
    the only older JAK-like protein is a sponge FERM-SH2-kinase protein without JH2 (PMID:24058787; quotes
    on the GO:0007259 term assessment).
