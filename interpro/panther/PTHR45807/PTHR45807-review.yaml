  assessment_reason: >-
    PAINT records no taxon. In the PANTHER 19 tree PTN002521566 is the euteleostome duplication node,
    and it is a four-way polytomy over the TYK2 (SF6), JAK1 (SF5), JAK2 (SF1, with the teleost SF2 below
    it) and JAK3 (SF3) clades. With seeds from JAK1 (mouse, rat), JAK2 (rat) and TYK2 (human), the polytomy
    forces the assertion onto the duplication node, so JAK3 inherits it with no evidence of its own. JAK2
    is the physiological GH-receptor kinase: it was identified as the GHR-associated tyrosine kinase,
    and GH responses depend on it. JAK1 and TYK2 binding is supported only by the seed annotations and
    should be non-core. JAK3 associates selectively with the common gamma chain of the IL-2-family receptors.
    Nothing places it on the GH receptor. An IRD on the JAK3 clade (PTN008462070) is recommended. JAK3
    also currently receives GO:0060397 from this node (QuickGO, P52333).
