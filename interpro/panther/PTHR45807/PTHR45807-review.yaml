  assessment_reason: >-
    The seeds are hop and mouse Jak2 plus human JAK1, JAK2 and TYK2, which span both bilaterian branches
    below this node. Hop was identified as a JAK by its tandem kinase domains. The gain-of-function hopTum-l
    allele raises Hop tyrosine autophosphorylation in cells. TYK2, JAK1 and JAK2 phosphorylate receptor
