family_id: PANTHER:PTHR45688
family_name: FAMILY NOT NAMED
summary: Class-III PLP-enzyme relatives catalyze several distinct reactions. AGXT2 is a transaminase,
  ETNPPL degrades phosphoethanolamine and PHYKPL degrades phosphohydroxylysine; other classified proteins
  have decarboxylase or racemase functions. Absence of transaminase activity in a relative does not establish
  a catalytically inactive protein.
functional_coherence: HETEROGENEOUS
coherence_reason: The actual inventory contains AGXT2 transaminases, ETNPPL and PHYKPL phospholyases,
  and decarboxylase/racemase proteins. Purified human AGXT2L1/ETNPPL Q8TBG4 degrades phosphoethanolamine,
  while AGXT2L2/PHYKPL acts on phosphohydroxylysine (PMID:22241472). Q8TBG4 is the source of the CG8745
  caution, so that caution argues against transamination, not against catalysis generally. CG8745 lies
  in mixed SF13, not the dedicated vertebrate ETNPPL SF1; its precise substrate is unresolved.
