  name:
    name: Oxidized Nucleotide Hydrolase
    short: Oxidized_Nt_Hydrolase
  description:
  - text: This family of proteins mediates the hydrolysis of oxidized nucleoside diphosphate
      derivatives, specifically targeting those containing 8-oxo-7,8-dihydroguanine.
      They convert these oxidized nucleotides to their corresponding monophosphate
      forms, thus playing a crucial role in maintaining the integrity of the nucleotide
      pool by preventing the incorporation of damaged nucleotides into DNA and RNA.
      The family members exhibit specificity towards 8-oxo-dGDP and 8-oxo-GDP, as
      well as hydrolyzing 8-OH-dADP and 2-OH-dADP. They show minimal or no activity
      against non-oxidized or triphosphate forms of these nucleotides. By excising
      oxidized guanine nucleotides, these enzymes protect the genetic material from
      oxidative damage and contribute to the cellular response to oxidative stress.
