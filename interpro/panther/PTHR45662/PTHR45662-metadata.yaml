  name:
    name: SAC Phosphatidylinositol Phosphatase
    short: SAC_PtdIns_Phosphatase
  description:
  - text: The SAC phosphatase family comprises enzymes that primarily hydrolyze phosphatidylinositol
      phosphates, particularly phosphatidylinositol 4-phosphate (PtdIns(4)P) and phosphatidylinositol
      3-phosphate (PtdIns(3)P), with lower activity towards phosphatidylinositol-3,5-bisphosphate
      (PtdIns(3,5)P2). Members of this family are involved in various cellular processes,
      including the coordination of secretory pathways, actin cytoskeleton dynamics,
      root hair development, endocytic recycling, cell migration, and defense responses.
      Some family members show enhanced PtdIns(4)P phosphatase activity in a 'cis'
      configuration within the cellular environment and are regulated by binding to
      other proteins such as PLEKHA3. The SAC domain contains a phosphatase catalytic
      core motif characteristic of metal-independent protein phosphatases and inositol
      polyphosphate phosphatases.
