notes: |-
  DROME/jumu: Q9XTP7, 719 aa, sequence version 1; cohorts FLY41. Source extracts preserve evidence codes, reviewed status and generated-description flags. PANTHER placement is a classification observation. Curated biological prose and member experiments inform the boundary, with unresolved coverage stated explicitly. No ancestral node placement or residue-loss projection is asserted without a checked tree/alignment and sequence anchor. Term assessments include functional-transfer hypotheses and are not a transcription of ProtNLM output; the cohort prediction snapshots remain authoritative about what was emitted.

  Placement evidence (2026-10-02)

  | Protein / source | Frozen UniProt placement (historical observation) | Official PANTHER 19.0 row |
  |---|---|---|
  | Q9XTP7 (fruit_fly / 8165) | PTHR46721:SF3 — FORKHEAD BOX N1 | PTHR13962:SF17 |

  Parent membership is unresolved. This protein is comparative evidence outside structured membership; neither parent is asserted as a replacement.

  The five cached reviewed entries are FOXN1 O15353/Q61575 and FOXN4 A2BGM5/Q3BJS1/Q8K3Q3. Their shared sequence-specific DNA-binding transcription-factor mechanism is coherent in this represented subset. Thymic, neural and multiciliated-cell programs are different biological contexts, not evidence of different molecular functions. Fly Jumu Q9XTP7 has experimental chromatin/nucleolar localization and developmental requirements (PMID:10887088; PMID:20213139). It cooperates in enhancer repression and uses sequence-specific forkhead sites (PMID:22378636). Xenopus Foxn4 co-regulates multiciliated-cell genes with Foxj1 with distinct promoter/enhancer occupancy (PMID:27864379). Those results preserve target functions without transferring vertebrate thymic or multiciliogenesis programs to every Jumu/FOXN-related protein. Jumu is not asserted as a PTHR46721 member. The official rows place human O15353 and mouse Q61575 FOXN1 in PTHR46721:SF1, and Xenopus Q3BJS1 Foxn4 in PTHR46721:SF2. Mouse Q8K3Q3 and zebrafish A2BGM5 Foxn4 instead occur as PTHR13962:SF17; their biology is retained only as comparative evidence outside asserted PTHR46721 membership. The coherent sampled DNA-binding mechanism remains supported, but these five proteins neither enumerate the 2,210 metadata proteins nor establish whole-family coverage.

  The table records source observations, not live membership declarations. Complete earlier descriptors and assessments are preserved at https://github.com/ai4curation/ai-gene-review/blob/e82261ba811dadbb944cd3770e7fdd2889ec69a4/interpro/panther/PTHR46721/PTHR46721-review.yaml. Current structured term assessments are authoritative; duplicate historical copies have been removed from these notes.

