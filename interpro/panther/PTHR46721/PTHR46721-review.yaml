notes: |-
  DROME/jumu: Q9XTP7, 719 aa, sequence version 1; cohorts FLY41. Source extracts preserve evidence codes, reviewed status and generated-description flags. PANTHER placement is a classification observation. Curated biological prose and member experiments inform the boundary, with unresolved coverage stated explicitly. No ancestral node placement or residue-loss projection is asserted without a checked tree/alignment and sequence anchor. Term assessments include functional-transfer hypotheses and are not a transcription of ProtNLM output; the cohort prediction snapshots remain authoritative about what was emitted.

  PANTHER classification conflict assessment (2026-10-01). Unresolved parent-family classification for UniProtKB:Q9XTP7: the frozen UniProt record records PTHR46721:SF3 (FORKHEAD BOX N1), whereas the authenticated official PANTHER 19.0 fruit_fly sequence-classification row 8165 records PTHR13962:SF17 (FORKHEAD BOX PROTEIN N4). The latter is also the tested upstream membership index assignment. This target is retained below as unresolved comparative evidence, not an asserted member of either parent family. No replacement family or ancestral placement is inferred.

  Withdraw Jumu membership and remove it from the family-inclusion sentence. Retain FOXN1/FOXN4 developmental distinctions. Change FAMILY_WIDE transcription-factor scope to UNRESOLVED because the complete classification boundary is not established, without disputing the target experiments.

  Provenance: diagnostic run 36943928592, attempt 1, source head 86ffe004ffe04b167981c081a14c1c526fb24da2; compact artifact 11201891369 (SHA256 9861e63fc8279e570e57ad56d639c36edafeac62809ee9867681a27175707136). The official inputs declare PTHR19.0 and HTTP Last-Modified 2024-06-20; panther.obo and the parser also declare 19.0. The UniProt and PAINT snapshots are later observations but do not establish a different PANTHER release. Full raw-source digests are runner-recorded, not independently recomputed from this compact artifact. No PAINT node or alternate functional assignment is inferred. This review is IN_PROGRESS until the conflicting placement is resolved.

  Preserved previous placement and biological interpretation (historical evidence; membership assertions below are not current claims):
  summary: FOXN-related transcription factors share a forkhead DNA-binding domain but regulate distinct
    developmental programs. The family includes vertebrate FOXN regulators and related invertebrate proteins
    such as fly Jumu.
  coherence_reason: Forkhead/winged-helix factors share sequence-specific DNA recognition but regulate different
    developmental programs. Fly jumu experiments establish chromatin/nucleolar localization and developmental
    requirements (PMID:10887088; PMID:20213139). Xenopus Foxn4 instead co-regulates multiciliated-cell genes
    with Foxj1, with distinct promoter and enhancer occupancy (PMID:27864379). These results support broad
    DNA-binding transcription-factor activity while preventing transfer of vertebrate thymic or multiciliogenesis
    programs to every jumu/FOXN-related protein.
