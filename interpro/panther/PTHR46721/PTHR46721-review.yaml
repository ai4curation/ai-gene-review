family_id: PANTHER:PTHR46721
family_name: FORKHEAD BOX PROTEIN N1
summary: FOXN-related transcription factors share a forkhead DNA-binding domain and regulate distinct
  developmental programs, including vertebrate thymic and neural or multiciliated-cell development.
functional_coherence: COHERENT
coherence_reason: >-
  FOXN1 and FOXN4 share a forkhead DNA-binding domain and a sequence-specific transcription-factor mechanism.
  Human and mouse FOXN1 and Xenopus Foxn4 have independently corroborated in-family assignments. The cached
  family description and reviewed FOXN1/FOXN4 records support the same broad mechanism; distinct thymic,
  neural and multiciliated-cell programs concern targets and biological context, not a demonstrated loss
  of DNA-binding transcription-factor activity. Mouse and zebrafish Foxn4 and fly Jumu remain comparative
  evidence because their observed official parents differ. Coherence is inferred at the molecular-function
  level, without transferring their individual developmental programs.
