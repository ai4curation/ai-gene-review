  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR46721-evidence.md
    supporting_text: 'This family includes Forkhead box protein N41 and N4.


      Forkhead box protein N1 (FOXN1) acts as a transcriptional regulator which regulates the development,
      differentiation, and function of thymic epithelial cells (TECs) [[cite:PUB00102938], [cite:PUB00102936]],
      both in the prenatal and postnatal thymus [[cite:PUB00102939], [cite:PUB00102934], [cite:PUB00102935],
      [cite:PUB00102937]]. Loss of function of this transcription factor leads to the human counterpart
      of the nude mouse characterised by athymia with severe T cell immunodeficiency, congenital alopecia,
      and nail dystrophy [[cite:PUB00102938]]. It has been reported that FOXN1 duplication leads to congenital
      hypertrichosis [[cite:PUB00102936]]. It is also an important factor in controlling the skin wound
      healing process, as it actively participates in re-epithelialization and is responsible for scar
      formation [[cite:PUB00102941], [cite:PUB00102940]].


      Forkhead box protein N4 (FOXN4) acts as a transcription factor essential for neural and some non-neural
      tissue development, such as retina and lung, respectively [[cite:PUB00102945], [cite:PUB00102944],
      [cite:PUB00102948], [cite:PUB00102296], [cite:PUB00101977]]. During development of the central nervous
      system, FOXN4 is required in specifying the amacrine and horizontal cell fates from multipotent
      retinal progenitors, while suppressing alternative photoreceptor cell fates [[cite:PUB00102946],
      [cite:PUB00102947], [cite:PUB00102943]]. In non-neural tissues, it plays an essential role in specifying
      the atrioventricular canal and is indirectly required for patterning the distal airway during lung
      development [[cite:PUB00102296]]. FOX transcription factors recognize the core sequence 5''-(A/C)AA(C/T)A-3''.'
