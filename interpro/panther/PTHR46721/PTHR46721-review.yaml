family_id: PANTHER:PTHR46721
family_name: FORKHEAD BOX PROTEIN N1
summary: FOXN-related transcription factors share a forkhead DNA-binding domain but regulate distinct
  developmental programs. The family includes vertebrate FOXN regulators and related invertebrate proteins
  such as fly Jumu.
functional_coherence: HETEROGENEOUS
coherence_reason: Forkhead/winged-helix factors share sequence-specific DNA recognition but regulate different
  developmental programs. Fly jumu experiments establish chromatin/nucleolar localization and developmental
  requirements (PMID:10887088; PMID:20213139). Xenopus Foxn4 instead co-regulates multiciliated-cell genes
  with Foxj1, with distinct promoter and enhancer occupancy (PMID:27864379). These results support broad
  DNA-binding transcription-factor activity while preventing transfer of vertebrate thymic or multiciliogenesis
  programs to every jumu/FOXN-related protein.
