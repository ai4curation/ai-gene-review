notes: >-
  Reviewed for the bacterial gallate catabolism module, which uses GalB as the hydratase of
  the GalD/GalB route; GalB is therefore the reference protein, although PIG-L is the
  family's namesake. Subfamilies SF27 and SF30 (N-acetyl-alpha-D-glucosaminyl L-malate
  deacetylases) and the PAINT tree topology were not adjudicated. The sphingomonad
  hydratase LigJ that performs the analogous step is unrelated (PTHR21240, amidohydrolase
  fold).
