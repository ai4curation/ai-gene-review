- subfamily_id: PANTHER:PTHR12993:SF29
  label: BLR3841 PROTEIN
  description: >-
    Holds GalB, the gallate-pathway 4-oxalomesaconate hydratase. GalB was described as the
    founding member of a new family of zinc-containing hydratases; it converts the enol
    tautomer of 4-oxalomesaconate to 4-carboxy-4-hydroxy-2-oxoadipate.
  representative_members:
