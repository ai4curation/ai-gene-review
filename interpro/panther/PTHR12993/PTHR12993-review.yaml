family_id: PANTHER:PTHR12993
family_name: N-ACETYLGLUCOSAMINYL-PHOSPHATIDYLINOSITOL DE-N-ACETYLASE-RELATED
preferred_name: PIG-L/MshB zinc-dependent deacetylase family
summary: >-
  Zinc-dependent metalloenzymes of the PIG-L/MshB fold. Most characterized members are
  de-N-acetylases acting on N-acetylglucosamine-containing substrates: eukaryotic
  GlcNAc-PI de-N-acetylase (PIG-L, GPI-anchor biosynthesis; subfamily SF11, which also holds
  archaeal diacetylchitobiose deacetylase and mycobacterial mycothiol S-conjugate amidase)
  and actinobacterial MshB mycothiol-biosynthesis deacetylase (SF26). Subfamily SF29 holds
  Pseudomonas putida GalB, a zinc-containing 4-oxalomesaconate hydratase of gallate
  catabolism that does not hydrolyze an amide bond.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The fold and zinc site are shared, but the family includes both amide hydrolases
  (deacetylases) and at least one hydro-lyase (GalB). The root-level PAINT assertion of
  linear-amide C-N hydrolase activity therefore does not hold for the GalB lineage.
