    gene_symbol: galB
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/galB/galB-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Hydro-lyase (water addition across a C=C bond) instead of amide hydrolysis; the
    family-root deacetylase-class term does not apply.
  supported_by:
