family_id: PANTHER:PTHR23132
family_name: D-ALANINE--D-ALANINE LIGASE
preferred_name: Ddl D-alanine--D-alanine ligase family (ATP-grasp), including Van-type depsipeptide ligases
summary: >-
  PTHR23132 is the ATP-grasp family of D-alanine--D-alanine ligases (Ddl, EC 6.3.2.4). Members condense two
  D-alanine molecules using ATP, through a D-alanyl phosphate intermediate, to form the D-Ala-D-Ala dipeptide
  that MurF adds to UDP-MurNAc-tripeptide; the reaction requires Mg(2+) and the omega-loop that closes over
  the active site. E. coli K-12 has two ligases, DdlA and DdlB, both purified and kinetically characterised;
  DdlB is the original ddl gene and the model for structure and mechanism. The vancomycin-resistance ligases
  VanA and VanB are homologues that additionally make the depsipeptide D-Ala-D-Lac, and VanC enzymes make
  D-Ala-D-Ser; these altered-specificity ligases still supply peptidoglycan precursors, now with a C-terminal
  residue that vancomycin binds poorly. PANTHER splits the bacterial ligases into SF23 (named DdlB) and SF25
  (named DdlA), but the A/B gene names given by genome annotation do not track the split (P. aeruginosa
  "DdlA" is SF23). SF25 also holds most Gram-positive and mycobacterial Ddl enzymes and the Van ligases. SF0
  holds the plant (chloroplast-type) Ddl homologues, and SF14/SF26 are small groups of ATP-grasp
  domain-containing proteins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The characterised bacterial members are D-Ala-D-Ala ligases; the Van-type members in SF25 keep the fold
  and some D-Ala-D-Ala activity but have gained D-Ala-D-Lac or D-Ala-D-Ser ligation, and the small SF14 and
  SF26 groups are uncharacterised.
