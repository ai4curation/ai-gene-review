family_id: PANTHER:PTHR11732
family_name: ALDO/KETO REDUCTASE
preferred_name: Aldo-keto reductase (AKR) superfamily
summary: >-
  NAD(P)H-dependent aldo-keto reductases with a (beta/alpha)8 barrel reduce a wide range of aldehydes
  and ketones. Subfamilies specialize: aldose/xylose reductases (S. cerevisiae GRE3, Scheffersomyces
  XYL1), D-arabinose dehydrogenase (S. cerevisiae ARA1), glycerol dehydrogenase (GCY1), and the animal
  steroid-metabolizing AKR1C (3-alpha-hydroxysteroid dehydrogenases such as AKR1C4) and AKR1D1 (steroid
  5-beta-reductase).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrate and reaction are subfamily-specific: aldose reduction, arabinose oxidation, steroid 3-alpha
  or 5-beta reduction, and others.
