    supporting_text: Catalyzes the ATP-dependent biosynthesis of glutamine from glutamate and ammonia.
- subfamily_id: PANTHER:PTHR43407:SF1
  label: LENGSIN
  description: Mixed subfamily holding actinobacterial, cyanobacterial and archaeal type I glutamine synthetases
    (for example Mycobacterium tuberculosis GlnA1 and Streptomyces coelicolor GlnA) together with vertebrate
    lengsin. The bacterial and archaeal members keep GS activity; only the lengsin clade carries the PAINT
    loss annotation. No member has a gene review here.
  diverged_from_family: false
