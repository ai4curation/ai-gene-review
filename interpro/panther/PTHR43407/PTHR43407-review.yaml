  label: GLUTAMINE SYNTHETASE
  description: Proteobacterial type I glutamine synthetases, including the enterobacterial and pseudomonad
    enzymes whose synthesis is induced by NtrC and whose activity is set by reversible adenylylation.
  representative_members:
