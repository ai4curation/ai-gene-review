family_id: PANTHER:PTHR43407
family_name: GLUTAMINE SYNTHETASE
preferred_name: Type I glutamine synthetase (GSI) family, with vertebrate lengsin
summary: Type I glutamine synthetases, dodecameric enzymes that ligate ammonium to L-glutamate with ATP
  to form L-glutamine, the first step of ammonium assimilation in bacteria and archaea. The family also
  contains vertebrate lengsin (LGSN), a lens protein that retains the GS fold.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Glutamine synthetase activity is shared by the bacterial and archaeal members of both
  subfamilies. The exception is the vertebrate lengsin clade inside SF1, for which PAINT records a loss
  of GS activity (IKR NOT at PTN001073615). Regulation by GlnE-catalysed adenylylation is a property of
  enterobacterial and other proteobacterial GSI-alpha enzymes, not of the whole family.
