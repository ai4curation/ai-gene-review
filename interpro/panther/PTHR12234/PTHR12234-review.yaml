  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Sound for the bifunctional SF0 enzymes, which carry the C-terminal
    cyclodeaminase domain and are the seeds. The same node also carries the
    transferase activity that SF8 inherits, so if the SF8 transferase-only
