family_id: PANTHER:PTHR12234
family_name: FORMIMINOTRANSFERASE-CYCLODEAMINASE
preferred_name: Formiminotransferase and formiminotransferase-cyclodeaminase family
summary: >-
  Family built on the folate-dependent formiminotransferase fold. Animal and
  Dictyostelium FTCD (SF0) are bifunctional, octameric enzymes in which an
  N-terminal formiminotransferase (two subdomains) transfers the formimino
  group of N-formimidoyl-L-glutamate to tetrahydrofolate, releasing
  L-glutamate as the last step of histidine catabolism, and a C-terminal
  cyclodeaminase converts the resulting 5-formimidoyltetrahydrofolate to
  5,10-methenyltetrahydrofolate and ammonia, feeding the one-carbon pool.
  Bacterial and archaeal members (SF8) are about 300 residues long, have only
  the transferase portion, and are named glutamate formimidoyltransferases. A
  third group (SF1; human FTCDNL1, Arabidopsis FTCD-L) contains only the
  formiminotransferase N-terminal subdomain or a related fragment and has no
  established activity. Human FTCD also associates reversibly with the
  cytosolic face of the Golgi.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Domain architecture divides the family. The transferase activity is shared
  by the bifunctional SF0 enzymes and the transferase-only SF8 proteins, but
  the cyclodeaminase activity requires the C-terminal domain present only in
  SF0. SF1 members lack most of the transferase fold and no activity has
  been assigned to them, so even the generic transferase term at the family
  root may not hold for SF1.
