- subfamily_id: PANTHER:PTHR12234:SF8
  label: FORMIMINOTRANSFERASE-CYCLODEAMINASE
  description: >-
    Monofunctional prokaryotic glutamate formimidoyltransferases of about 300
    residues (Streptococcus pyogenes Q99XR4, Thermoplasma acidophilum Q9HI69,
    Picrophilus torridus Q6KZM5). None has a gene review in this repository,
    so no representative member is listed.
  diverged_from_family: true
  divergence_description: >-
    Lack the C-terminal cyclodeaminase domain and therefore the
    formimidoyltetrahydrofolate cyclodeaminase activity, despite the
    subfamily's bifunctional-sounding name.
  supported_by:
  - reference_id: file:interpro/panther/PTHR12234/PTHR12234-entries.csv
    supporting_text: "Q9HI69,Glutamate formimidoyltransferase"
- subfamily_id: PANTHER:PTHR12234:SF1
  label: FORMIMINOTRANSFERASE N-TERMINAL SUBDOMAIN-CONTAINING PROTEIN
  description: >-
    Short proteins with only a formiminotransferase N-terminal subdomain
    (human FTCDNL1 E5RQL4, 147 residues) or a related fragment (Arabidopsis
    FTCD-L Q9SKT4). No gene review in this repository, so no representative
    member is listed.
  diverged_from_family: true
  divergence_description: >-
    No catalytic activity has been assigned; the truncated architecture lacks
    the transferase C-subdomain and the cyclodeaminase domain.
  supported_by:
  - reference_id: file:interpro/panther/PTHR12234/PTHR12234-entries.csv
    supporting_text: "E5RQL4,Formiminotransferase N-terminal subdomain-containing protein"
