  assessment: UNRESOLVED
  assessment_reason: >-
    The generic transferase term is true for the SF0 and SF8 members, which
    carry the formiminotransferase fold, and is seeded by vertebrate FTCD.
    If this root node also covers the SF1 N-terminal-subdomain proteins, the
    term would reach members with no demonstrated activity and an incomplete
    transferase fold. The tree topology needed to decide this is not in the
    committed data, so the placement is left unresolved rather than pruned.
