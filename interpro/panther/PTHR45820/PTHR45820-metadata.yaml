  name:
    name: Cation Diffusion Facilitator Transporter
    short: CDF_Transporter
  description:
  - text: This family of proteins is involved in the transport and homeostasis of
      metal ions, primarily zinc and manganese. Members of this family function as
      antiporters, exchanging protons for zinc or calcium for manganese across cellular
      membranes. They play a crucial role in protecting cells from metal ion toxicity
      by mediating the efflux of excess intracellular zinc and manganese. Some members
      are also implicated in the transport of zinc into cytoplasmic vesicles, which
      may contribute to the inactivation of engulfed pathogens in macrophages. Additionally,
      these proteins are involved in the regulation of metal ion concentrations in
      organelles such as the endoplasmic reticulum, vacuole, and pseudocoelum, affecting
      various signaling pathways and biological processes.
