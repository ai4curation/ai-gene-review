family_id: PANTHER:PTHR36999
family_name: ISOCITRATE DEHYDROGENASE [NADP]
preferred_name: Monomeric-type NADP-isocitrate dehydrogenase (Idh/IcdII) family
summary: >-
  Large (about 80 kDa) monomeric NADP-dependent isocitrate dehydrogenases (EC 1.1.1.42) of
  bacteria, unrelated in fold to the dimeric isocitrate/isopropylmalate dehydrogenase family. They
  catalyse the Mg2+/Mn2+-dependent oxidative decarboxylation of isocitrate to 2-oxoglutarate with
  NADPH production and supply the isocitrate step of the TCA cycle, often alongside a dimeric Icd
  in the same organism (as in P. putida KT2440, with Idh PP_4012 and Icd PP_4011).
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF1) of monomeric NADP-isocitrate dehydrogenases.
