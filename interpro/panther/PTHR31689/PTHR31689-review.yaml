family_id: PANTHER:PTHR31689
family_name: DIAMINOPIMELATE EPIMERASE, CHLOROPLASTIC
preferred_name: DapF diaminopimelate epimerase family
summary: Family of cofactor-independent, two-cysteine diaminopimelate epimerases (DapF, EC 5.1.1.7) that
  interconvert LL- and meso-2,6-diaminopimelate. Each subunit has two similar alpha/beta domains with
  the active site in the cleft between them, and the E. coli enzyme is active as a homodimer. DapF supplies
  meso-DAP both for LysA in the last step of lysine biosynthesis and for peptidoglycan. Members are bacterial
  and plant (chloroplastic); all 424 reviewed entries sit in the single subfamily SF0, and 418 of them
  are named diaminopimelate epimerase. The chloroplast-biased family name does not reflect the mainly
  bacterial membership.
functional_coherence: COHERENT
coherence_reason: One reaction across bacteria and plants. A single reviewed member is named O-ureido-serine
  racemase (a DapF-like enzyme in a natural product pathway), so a rare paralog can carry a different
  racemase activity, but it does not affect the family-level assertion.
