  name:
    name: T-cell Activation and Immune Regulation Protein
    short: T-cell_Activation_Regulation
  description:
  - text: This family of proteins is involved in the modulation of immune responses,
      particularly in T-cell activation and immune tolerance. Members of this family
      function as costimulatory molecules that are essential for T-cell proliferation,
      cytokine production, and the determination of T-cell fate regarding immunity
      or anergy. They interact with receptors such as CD28 and CTLA-4 on T-cells,
      influencing the activation threshold and effector responses. Some family members
      are ligands for the inhibitory receptor PDCD1/PD-1, playing a role in the maintenance
      of self-tolerance and limiting autoimmunity. They are also implicated in the
      immune escape of tumors by inhibiting cytotoxic T lymphocyte function. Additionally,
      certain members can act as transcription coactivators and are involved in signaling
      pathways such as NF-kappa-B activation. The family belongs to the immunoglobulin
      superfamily and includes proteins that may also interact with microbial agents,
      suggesting a role in infectious disease responses.
