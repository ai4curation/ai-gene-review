family_id: PANTHER:PTHR12122
family_name: RETINAL CONE RHODOPSIN-SENSITIVE CGMP 3',5'-CYCLIC PHOSPHODIESTERASE GAMMA-SUBUNIT-RELATED
summary: >-
  The vertebrate inhibitory gamma subunits of the photoreceptor cGMP phosphodiesterase PDE6: the rod
  subunit PDE6G (subfamily SF4), the cone subunit PDE6H (SF5) and further vertebrate gamma subunits (SF8,
  SF10). These are small, largely disordered proteins of about 80-90 residues with no catalytic or GAF
  domain. Two copies bind the catalytic dimer of the PDE6 holoenzyme on the outer segment disc membranes,
  where the C-terminus of each occludes a catalytic site in darkness; light-activated transducin alpha
  displaces it. The family's defining function is inhibition of a partner enzyme, not cyclic nucleotide
  hydrolysis.
functional_coherence: COHERENT
coherence_reason: >-
  The two characterized paralogues, rod PDE6G and cone PDE6H, do the same job for their own catalytic
  subunits (PDE6A/PDE6B in rods, PDE6C in cones), and both reviews take enzyme inhibitor activity as the
  single core function. The PAINT propagation set below the family root is vertebrate only (mammals,
  birds, reptiles, amphibians and ray-finned fish). The family name refers to the holoenzyme the members
  belong to, not to an activity of the members: no member has a phosphodiesterase domain. The
  uncharacterized fish and amphibian gamma subunits in SF8 and SF10 are presumed to share the function by
  sequence family alone.
reference_protein:
  id: UniProtKB:P18545
  label: Retinal rod rhodopsin-sensitive cGMP 3',5'-cyclic phosphodiesterase subunit gamma
  gene_symbol: PDE6G
  organism: Homo sapiens
  gene_review: genes/human/PDE6G/PDE6G-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0004857
    label: enzyme inhibitor activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The core function of both reviewed paralogues: the rod subunit inhibits PDE6A/PDE6B and the cone
    subunit inhibits PDE6C, each by occluding the entrance to the catalytic site. Both gene reviews
    ACCEPT it (ISS and TAS) and make it the core molecular function. PAINT does not propagate it; the
    family carries no IBD for any molecular function, so this assessment records that the term would be
    safe at the family root rather than adjudicating an existing node.
  supported_by:
  - reference_id: file:genes/human/PDE6G/PDE6G-uniprot.txt
    supporting_text: Inhibitory gamma subunit of the rod-specific cGMP
  - reference_id: file:genes/human/PDE6H/PDE6H-uniprot.txt
    supporting_text: Inhibitory gamma subunit of the cone-specific cGMP
  - reference_id: PMID:33007200
    supporting_text: The C-terminus of each PDEγ subunit binds at the entrance of the active site of each
      catalytic domain
- assessed_term:
    id: GO:0004114
    label: 3',5'-cyclic-nucleotide phosphodiesterase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    Not propagated by PAINT in this family; it reaches PDE6G and PDE6H only through the InterPro2GO
    mapping of the PDE6 gamma-subunit family IPR006952, and both gene reviews REMOVE it. The gamma
    subunits have no phosphodiesterase domain; cGMP hydrolysis is done by the catalytic subunits of the
    holoenzyme, which the gamma subunit inhibits. The mapping transfers a property of the complex to its
    inhibitory subunit and is wrong for every member.
  supported_by:
  - reference_id: file:genes/human/PDE6G/PDE6G-uniprot.txt
    supporting_text: catalytic subunits (PDE6A and PDE6B) and two inhibitory gamma subunits.
  - reference_id: PMID:33007200
    supporting_text: vardenafil, which occupies the substrate-binding sites on the PDEα and PDEβ subunits
- assessed_term:
    id: GO:0030553
    label: cGMP binding
  scope: NOT_APPLICABLE
  scope_reason: >-
    Not propagated by PAINT in this family; like the phosphodiesterase activity row it comes only from
    the InterPro2GO mapping of IPR006952, and both gene reviews REMOVE it. The noncatalytic cGMP sites of
    PDE6 lie in the GAF-A domains of the catalytic subunits; the N-terminus of the gamma subunit forms a
    lid over that site rather than binding cGMP itself. No member has a GAF domain.
  supported_by:
  - reference_id: PMID:33007200
    supporting_text: the N-terminus of each PDEγ interacts with the GAFa domain, forming a lid that covers
      the allosteric cGMP-binding site
- assessed_term:
    id: GO:0042622
    label: photoreceptor outer segment membrane
  scope: FAMILY_WIDE
  scope_reason: >-
    Both paralogues sit on the outer segment disc membranes with their holoenzyme, the rod subunit in rod
    outer segments and the cone subunit in cone outer segments, so the term inherited from the family root
    fits both. Both gene reviews MODIFY the IBA only to refine it, to rod photoreceptor disc membrane
    (GO:0120202) for PDE6G and cone photoreceptor disc membrane (GO:0120201) for PDE6H; those refinements
    are subfamily-specific (SF4 and SF5 respectively) and should not be propagated from the root, but the
    general term is sound for both. The gamma subunit has no membrane anchor of its own; it is held at the
    membrane by the prenylated catalytic subunits.
  supported_by:
  - reference_id: file:genes/human/PDE6H/PDE6H-uniprot.txt
    supporting_text: Localized in cone outer segment
  - reference_id: file:genes/human/PDE6G/PDE6G-uniprot.txt
    supporting_text: segment {ECO:0000250|UniProtKB:P04972}.
- assessed_term:
    id: GO:0045742
    label: positive regulation of epidermal growth factor receptor signaling pathway
  scope: UNRESOLVED
  scope_reason: >-
    The only evidence is one study in human HEK293 cells (PMID:11502744), in which antisense knockdown of
    endogenous rod PDE6G ablated EGF- and thrombin-stimulated ERK activation and transfected rod or cone
    PDE6G/PDE6H increased it. Both mammalian paralogues were tested, so the term plausibly holds for both;
    both gene reviews KEEP_AS_NON_CORE it as a real but peripheral, non-retinal role. Whether the role is
    shared by the fish and amphibian gamma subunits, or is relevant in vivo, has not been tested, so the
    family-wide scope is left unresolved rather than asserted.
  supported_by:
  - reference_id: PMID:11502744
    supporting_text: First, the transfection of cells with an antisense rod PDEgamma plasmid construct,
      which reduced endogenous rod PDEgamma expression, ablated the epidermal growth factor- and
      thrombin-dependent stimulation of p42/p44 mitogen-activated protein kinase.
  - reference_id: PMID:11502744
    supporting_text: Second, the transfection of cells with recombinant rod or cone PDEgamma and/or
      G-protein-coupled receptor kinase 2 increased the stimulation of p42/p44 mitogen-activated protein
      kinase by epidermal growth factor or thrombin.
- assessed_term:
    id: GO:0045745
    label: positive regulation of G protein-coupled receptor signaling pathway
  scope: UNRESOLVED
  scope_reason: >-
    Rests on the same HEK293 study as the EGF receptor term: thrombin acts through a G protein-coupled
    receptor, and rod or cone gamma subunit with GRK2 increased thrombin-stimulated ERK activation. Both
    gene reviews KEEP_AS_NON_CORE it. As for the EGF receptor term, conservation beyond the two mammalian
    paralogues and in vivo relevance are untested.
  supported_by:
  - reference_id: PMID:11502744
    supporting_text: Here, we show that PDEgamma interacts with the G-protein-coupled receptor kinase 2
      signaling system to regulate the epidermal growth factor- and thrombin-dependent stimulation of
      p42/p44 mitogen-activated protein kinase in human embryonic kidney 293 cells.
node_assessments:
- node_id: PANTHER:PTN000252232
  asserted_term:
    id: GO:0042622
    label: photoreceptor outer segment membrane
  evidence: IBD
  assessment: SOUND
  assessment_reason: >-
    PTN000252232 is the family root (AN0 in the PAINT TreeGrafter annotations), with a vertebrate-only
    propagation set. The seed is bovine rod PDE6G (P04972), but the cone paralogue is equally an outer
    segment protein, so placement at the node that joins rod and cone gamma subunits is right. The gene
    reviews refine the inherited term to the rod or cone disc membrane, which is a granularity change,
    not a challenge to the placement.
  supported_by:
  - reference_id: file:genes/human/PDE6H/PDE6H-uniprot.txt
    supporting_text: Localized in cone outer segment
  - reference_id: file:genes/human/PDE6H/PDE6H-ai-review.yaml
    supporting_text: PDE6 gamma node; placement sound; modified only to the cone disc membrane child.
- node_id: PANTHER:PTN000252232
  asserted_term:
    id: GO:0045742
    label: positive regulation of epidermal growth factor receptor signaling pathway
  evidence: IBD
  assessment: UNRESOLVED
  assessment_reason: >-
    The seeds are mouse Pde6g and Pde6h, one from each mammalian paralogue, so the root is the smallest
    node that covers both and the placement follows from them. Their IDA rows come from a single HEK293
    cell study of the human proteins, partly with overexpressed protein, and no ortholog outside mammals
    has been tested. The data do not show whether the role is ancestral to the vertebrate gamma subunits
    or a mammalian property, so the placement is neither confirmed nor refuted. The human members keep
    the inherited term as non-core.
  supported_by:
  - reference_id: PMID:11502744
    supporting_text: The inhibitory gamma subunits of the retinal rod and cone photoreceptor type 6
      retinal cyclic guanosine monophosphate phosphodiesterase (PDEgamma) are expressed in non-retinal
      tissues.
- node_id: PANTHER:PTN000252232
  asserted_term:
    id: GO:0045745
    label: positive regulation of G protein-coupled receptor signaling pathway
  evidence: IBD
  assessment: UNRESOLVED
  assessment_reason: >-
    Same seeds (mouse Pde6g and Pde6h) and the same single HEK293 study as the EGF receptor row; the
    placement is the minimal node joining the two seeds, but conservation of the role across the
    vertebrate clade below the root is untested. The human members keep the inherited term as non-core.
  supported_by:
  - reference_id: PMID:11502744
    supporting_text: Second, the transfection of cells with recombinant rod or cone PDEgamma and/or
      G-protein-coupled receptor kinase 2 increased the stimulation of p42/p44 mitogen-activated protein
      kinase by epidermal growth factor or thrombin.
