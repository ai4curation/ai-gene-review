notes: >-
  PAINT holds three IBD rows for this family, all at the root node PTN000252232 and dated 2019-02-21:
  photoreceptor outer segment membrane and the two signalling terms. It propagates no molecular function;
  the phosphodiesterase activity and cGMP binding rows that both members carry come from InterPro2GO,
  not from PAINT, and are assessed here as not applicable to any member. Enzyme inhibitor activity, the
  real family-wide function, is not propagated by PAINT. The PANTHER tree and alignment were not
  inspected; node judgements rest on the PAINT slice, the TreeGrafter node list, the member inventory and
  the literature. One chicken member in the propagation set (Q802E4) carries the gene symbol OXLD1 in
  the PAINT GAF; this was not investigated.
