notes: >-
  PTHR21012 inputs were fetched for this review (just fetch-panther-family / fetch-panther-paint). No
  gene review exists in the repo for any member. The coenzyme_a_biosynthesis module's use of the
  family for the bacterial PanD variant, and its statement that budding yeast uses a polyamine-derived
  route instead (PMID:11154694), agree with this review. Fungi have no member of this family. In
  enterobacteria PanD processing needs the accessory protein PanZ/PanM. That is a maturation
  requirement, not a separate activity of PanD.
