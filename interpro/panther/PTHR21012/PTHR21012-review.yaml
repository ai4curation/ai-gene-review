    label: panD
    organism: Escherichia coli K-12
  - id: UniProtKB:P9WIL3
    label: panD
    organism: Mycobacterium tuberculosis
  assessment: SOUND
  assessment_reason: >-
    The node is the bacterial root of the family. All UniProt proteins that receive the IBA in the PAINT
    GAF (26 rows) are SF0 PanD proteins, the E. coli and B. subtilis enzymes among them. The function is
    uniform across the family, so placing the activity at this node is correct. The same node also
    carries GO:0006523 alanine biosynthetic process, a mis-chosen term: see its term assessment.
  supported_by:
