    supporting_text: >-
      panD mutants of E. coli are defective in beta-alanine biosynthesis and lack aspartate
      1-decarboxylase.
term_assessments:
- assessed_term:
    id: GO:0004068
    label: aspartate 1-decarboxylase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the function that defines the family, shown biochemically and genetically for E. coli
    PanD, and inherited from the bacterial root node by every member. It is the term the module
    attaches to the family.
  supported_by:
  - reference_id: PMID:9169598
    supporting_text: >-
      The Escherichia coli panD gene, encoding l-aspartate-alpha-decarboxylase, was cloned by PCR,
      and shown to complement a panD mutant defective in beta-alanine biosynthesis.
  - reference_id: PMID:9169598
    supporting_text: Aspartate decarboxylase is a pyruvoyl-dependent enzyme
- assessed_term:
    id: GO:0019483
    label: beta-alanine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    PanD's product is beta-alanine, and the module names this as the concept for its beta-alanine
    supply part. PAINT asserts no beta-alanine term, only the mis-chosen GO:0006523. GO:0019483 is the
    correct process term for the whole family.
  supported_by:
  - reference_id: PMID:6767707
    supporting_text: >-
      Therefore, the enzyme functions in the biosynthesis of the beta-alanine moiety of
      pantothenate.
- assessed_term:
    id: GO:0015940
    label: pantothenate biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Beta-alanine from PanD is condensed with pantoate by PanC to make pantothenate. The PTN000470402
    IBA (seeded by M. tuberculosis PanD) is correct family-wide.
  supported_by:
  - reference_id: PMID:6767707
    supporting_text: >-
      Therefore, the enzyme functions in the biosynthesis of the beta-alanine moiety of
      pantothenate.
- assessed_term:
    id: GO:0006523
    label: alanine biosynthetic process
  scope: NOT_APPLICABLE
  scope_reason: >-
    GO defines alanine here as 2-aminopropanoic acid. PanD makes beta-alanine (3-aminopropanoic acid),
    whose process term GO:0019483 is not a descendant of GO:0006523. The IBD at PTN000470402 (seed M.
    tuberculosis PanD, 2021) therefore uses the wrong chemical entity, and every PanD inherits an
    L-alanine biosynthesis claim. It should be replaced by GO:0019483 at the same node.
  supported_by:
  - reference_id: PMID:6767707
    supporting_text: >-
      panD mutants of E. coli are defective in beta-alanine biosynthesis and lack aspartate
      1-decarboxylase.
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: FAMILY_WIDE
  scope_reason: >-
    PanD is a soluble bacterial enzyme. The bacterial-node cytosol IBA (seeds E. coli and M.
    tuberculosis PanD) is unremarkable.
