family_id: PANTHER:PTHR21012
family_name: ASPARTATE 1-DECARBOXYLASE
preferred_name: PanD pyruvoyl-dependent L-aspartate 1-decarboxylase
summary: >-
  PanD is the bacterial L-aspartate alpha-decarboxylase that supplies beta-alanine for pantothenate
  (vitamin B5) and hence coenzyme A synthesis. It is a pyruvoyl-dependent enzyme. It is made as an
  inactive pi-protein precursor that cleaves itself at an X-Ser bond, leaving a beta subunit and an
  alpha subunit whose N-terminal serine has become the catalytic pyruvoyl group. The active enzyme is
  a tetramer. The family is prokaryotic, and all reviewed members are bacterial PanD proteins in a
  single subfamily, a few organisms having two paralogs (PanD1/PanD2). Budding yeast and other fungi
  have no PanD. Saccharomyces makes beta-alanine from spermine by the Fms1 polyamine oxidase route.
  Some bacteria use unrelated, PLP-dependent aspartate decarboxylases instead.
functional_coherence: COHERENT
coherence_reason: >-
  One subfamily (SF0, ASPARTATE 1-DECARBOXYLASE). All 412 reviewed entries are named aspartate
  1-decarboxylase (402 plain, plus five each named aspartate 1-decarboxylase 1 and 2 for paralog
  pairs). The pyruvoyl-dependent
  decarboxylation of L-aspartate to beta-alanine is the shared function. No divergent branch was
  identified.
