  name:
    name: AMP-activated protein kinase gamma/SDS23 families
    short: AMPK_gamma/SDS23_families
  description:
  - text: The AMP-activated protein kinase (AMPK) gamma subunit family and the SDS23
      family are involved in distinct cellular processes. The AMPK gamma subunit family
      plays a crucial role in cellular energy homeostasis. It regulates energy metabolism
      by activating energy-producing pathways and inhibiting energy-consuming processes
      in response to ATP depletion. This family's members bind AMP, ADP, and ATP,
      leading to the activation or inhibition of AMPK. They are involved in phosphorylating
      metabolic enzymes and transcription regulators, affecting processes like protein,
      carbohydrate, and lipid biosynthesis, as well as cell growth and proliferation.
      Additionally, they contribute to cellular polarity by remodeling the actin cytoskeleton.
      The SDS23 family members are implicated in DNA replication and cell separation,
      with some involved in sexual development and mitosis. Despite the different
      functions, both families share a common feature of having CBS domains that mediate
      nucleotide binding.
