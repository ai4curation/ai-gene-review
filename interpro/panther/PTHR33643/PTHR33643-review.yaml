- node_id: PANTHER:PTN008658292
  asserted_term:
    id: GO:0018237
    label: urease activator activity
  evidence: IBD
  paint_snapshot: '20250310'
  seeds:
  - id: AGI_LocusCode:AT2G35035
  assessment: SOUND
  assessment_reason: >-
    Single plant seed, but the activity is the defining function of the family:
    K. aerogenes UreD is required for nickel incorporation into the apoprotein, and
    Arabidopsis ureD insertion lines lack urease activity. The term's definition
    ("increases the activity of urease by promoting the incorporation of nickel into
    the active site") describes exactly what UreD does, without claiming catalysis.
  supported_by:
  - reference_id: file:interpro/panther/PTHR33643/PTHR33643-paint.tsv
    supporting_text: "PTHR33643\tPTN008658292\tGO:0018237\tF\tIBD\tfalse"
  - reference_id: PMID:7909161
    supporting_text: >-
      extracts of cells containing a
      ureD deletion derivative failed to generate active urease, thus highlighting a
      key role for UreD in the metallocenter assembly process
- node_id: PANTHER:PTN008658292
  asserted_term:
    id: GO:0019627
    label: urea metabolic process
  evidence: IBD
  paint_snapshot: '20250904'
  seeds:
  - id: AGI_LocusCode:AT2G35035
  - id: PomBase:SPAC3A12.09c
  assessment: SOUND
  assessment_reason: >-
    Broad but correct. UreD acts upstream of urea hydrolysis by producing active
    urease, and Arabidopsis ureD mutants cannot use urea as sole nitrogen source.
    Note for module use: the activation step itself, not urea hydrolysis, is what
    UreD performs.
  supported_by:
  - reference_id: file:interpro/panther/PTHR33643/PTHR33643-paint.tsv
    supporting_text: "PTHR33643\tPTN008658292\tGO:0019627\tP\tIBD\tfalse"
  - reference_id: PMID:16244137
    supporting_text: >-
      Plants bearing T-DNA or Ds
      element insertions in either the structural gene for urease or in any of the
      three putative urease accessory genes AtureD, AtureF, and AtureG lacked the
      corresponding mRNAs and were defective in urease activity.
