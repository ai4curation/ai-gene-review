family_id: PANTHER:PTHR33643
family_name: UREASE ACCESSORY PROTEIN D
preferred_name: Urease accessory protein UreD/UreH family
summary: >-
  UreD (named UreH in Helicobacter) is the urease accessory protein that binds the
  urease apoprotein and serves as the platform of the pre-activation complex. In
  Klebsiella aerogenes it is the one accessory protein without which nickel
  addition to cell extracts cannot activate the apoprotein. UreD-apourease
  complexes are activation-competent, and UreD dissociates on activation. UreD
  binds UreF; the UreD-UreF pair then recruits the GTPase UreG, so that UreG-bound
  nickel is delivered to the urease active site. The family spans bacteria (UreD,
  Helicobacter UreH), plants (Arabidopsis and rice UreD, required for urease
  activity in planta), and fungi (S. pombe and Cryptococcus homologues).
functional_coherence: COHERENT
coherence_reason: >-
  All 257 cached members fall in one subfamily (PTHR33643:SF1) and are annotated
  as urease accessory protein D/UreH or as UreD-like proteins encoded by
  urease-containing genomes. Bacterial, Helicobacter and plant members
  characterized by genetics, reconstitution or structure perform the same scaffold
  role in urease activation.
