family_id: PANTHER:PTHR30188
family_name: ABC TRANSPORTER PERMEASE PROTEIN-RELATED
preferred_name: MlaE/YrbE/TGD1 transmembrane permease subunits of MCE-type lipid transport systems
summary: MlaE-related polytopic permeases form membrane components of ABC-associated lipid transport assemblies.
  E. coli MlaE pairs with MlaF ATPases and the MlaD ring; the mycobacterial YrbE paralogs occur in fatty-acid/cholesterol
  uptake systems, and plant TGD1 acts at the chloroplast envelope. The family and SF4 therefore mix cargo
  and cellular contexts. Characterized alternate substrates are positive biology, not proof that every
  secondary phospholipid activity is absent. Bacterial Mla roles require a compatible cargo, partner and
  envelope context in addition to classification.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The shared membrane-permease architecture supports comparison among bacterial MlaE,
  mycobacterial YrbE and plant TGD1. Positive fatty-acid/cholesterol uptake by YrbE does not establish
  phospholipid-negative chemistry. Plant chloroplast localization is independently supported and its original
  plasma-membrane IRD remains intact. SF4 mixes these roles, SF13 contains YrbE partners and SF14 includes
  Brassica proteins, so substrate and compartment judgments cannot be reduced to an exclusive subfamily
  list.
