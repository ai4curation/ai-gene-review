    supporting_text: Fatty acids and cholesterol are imported across the Mtb cell wall via the dedicated
      Mce1 and Mce4 transporters, respectively.
  - reference_id: PMID:36642182
    supporting_text: All eight of these putative permease proteins have similar predicted transmembrane
      topologies with a homologous, 47 amino acid cytosolic loop containing an EExDA motif which is a
      strong candidate for a shared MceG-binding site analogous to a coupling helix (10).
