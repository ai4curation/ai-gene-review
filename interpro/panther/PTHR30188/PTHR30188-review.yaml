    its cyanobacterial and mycobacterial relatives receive both (checked in QuickGO, 2026-10-23). Being
    an IRD, it produces no NOT annotation on the plant genes - it simply withholds the term, which is
    the appropriate mechanism for a compartment change of this kind. The scope is right too: it is placed
    on the Viridiplantae branch, not on SF4 as a whole, which matters because SF4 also contains MlaE and
