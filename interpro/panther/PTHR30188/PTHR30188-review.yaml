    assessment: LOSS_SUPPORTED
    assessment_reason: >-
      The IRD stops the ancestral plasma-membrane IBD from descending into the green
      plants, and that is correct: the plant member of this family, TGD1, is a
      chloroplast envelope protein. UniProt curates it to chloroplast inner membrane
