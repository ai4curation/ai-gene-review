  - assessed_term:
      id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    scope: FAMILY_WIDE
    scope_reason: >-
      Every member is the transmembrane subunit of an ABC transporter: MlaE within
      MlaFEDB, the YrbE pairs within the Mce1-Mce4 transporters driven by the shared MceG
      ATPase, and TGD1 within the plant TGD1/TGD2/TGD3 translocator. Substrate-neutral,
