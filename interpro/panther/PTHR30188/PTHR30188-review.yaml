        supporting_text: At the center of the complex, a core ABC transporter module is formed from two copies each of the MlaF ATPase and the MlaE transmembrane domains (TMDs).
      - reference_id: PMID:22544736
        supporting_text: TGD1, -2, and -3 (systematically named AtABCI4, -5, and -3) form a putative ABC transporter found in the chloroplast inner envelope membrane of plants and algae, in which TGD1 is similar to an ABC transporter permease, TGD3 to an NBD, and TGD2 to an SBD ( 8 , 9 ).
  - subfamily_id: PANTHER:PTHR30188:SF13
    label: CONSERVED HYPOTHETICAL INTEGRAL MEMBRANE PROTEIN YRBE3B
    description: >-
      The mycobacterial and actinobacterial "B" subunits of the mce operons - YrbE1B,
      YrbE2B, YrbE3B, YrbE4B and the Streptomyces equivalent - which pair with the "A"
      subunits in SF4 to make the heterodimeric permease of each Mce transporter. All
      eight mycobacterial YrbE proteins share a predicted topology and a cytosolic loop
      carrying an EExDA motif, the candidate binding site for the shared MceG ATPase.
    representative_members:
      - id: UniProtKB:L0T2Q9
        label: Conserved integral membrane protein YrbE1B
        gene_symbol: yrbE1B
        organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
      - id: UniProtKB:O53966
        label: Conserved hypothetical integral membrane protein YrbE3B
        gene_symbol: yrbE3B
        organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
      - id: UniProtKB:I6Y3P5
        label: Conserved integral membrane protein YrbE4B. Possible ABC transporter
        gene_symbol: yrbE4B
        organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
    diverged_from_family: true
    divergence_description: >-
      Substrate and direction both differ from the Mla consensus. These are the
      permease partners of the mycobacterial Mce transporters, which import host fatty
      acids (Mce1) and cholesterol (Mce4) across the cell envelope, rather than cycling
      phospholipids between the two membranes of a diderm envelope. Generic terms
      (plasma membrane, lipid transport, ABC transporter complex) transfer; phospholipid
      transport, intermembrane phospholipid transfer and phospholipid transfer activity
      do not. The same caveat applies to the mycobacterial members of SF4, which PANTHER
      does not separate from MlaE.
    supported_by:
      - reference_id: PMID:36642182
        supporting_text: "Fatty acids and cholesterol are imported across the Mtb cell wall via the dedicated Mce1 and Mce4 transporters, respectively."
      - reference_id: PMID:36642182
        supporting_text: "All eight of these putative permease proteins have similar predicted transmembrane topologies with a homologous, 47 amino acid cytosolic loop containing an EExDA motif which is a strong candidate for a shared MceG-binding site analogous to a coupling helix (10)."
  - subfamily_id: PANTHER:PTHR30188:SF3
    label: ABC TRANSPORTER PERMEASE
    description: >-
      A second bacterial subfamily of uncharacterized permeases that are not encoded in
      an mla operon: Pseudomonas PP_0142 and PA3211 (part of the separate Mce-like
      PP_0140-PP_0142 system that the module's deep research distinguishes from the core
      Mla route), Helicobacter HP_1466 and Aquifex aq_1530. Members receive the
      plasma-membrane and phospholipid-transport IBAs from the family node, but none has
      experimental characterization, so the substrate assignment for this subfamily rests
      entirely on the propagation.
    representative_members:
