      label: lipid transport
    scope: FAMILY_WIDE
    scope_reason: >-
      The substrate-neutral parent, true of every member and the term that should be kept
      wherever a phospholipid-specific child is pruned (the mycobacterial Mce permeases).
      Not currently asserted by PAINT in this family; recommended to a future curator as
