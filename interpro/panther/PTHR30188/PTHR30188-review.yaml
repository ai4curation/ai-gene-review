- assessed_term:
    id: GO:1990531
    label: phospholipid-translocating ATPase complex
  scope: NOT_APPLICABLE
  scope_reason: 'Inapplicable throughout this family on the term definition rather than on substrate:
    GO:1990531 is a protein complex that functions as a phospholipid-translocating P-Type ATPase, i.e.
    a P4-ATPase flippase complex, while MlaFEDB, the Mce transporters and the plant TGD translocator are
    all ABC systems. E. coli MlaE carries this term by IPI from the complex-definition work, and its completed
    gene review modifies it to GO:0043190; the same replacement is correct for every other member. PAINT
    does not assert the term in this family, so nothing needs pruning - this entry exists to stop the
    term being re-added here.'
  supported_by:
  - reference_id: PMID:33236984
    supporting_text: At the center of the complex, a core ABC transporter module is formed from two copies
      each of the MlaF ATPase and the MlaE transmembrane domains (TMDs).
