term_assessments:
- assessed_term:
    id: GO:0005886
    label: plasma membrane
  scope: UNRESOLVED
  scope_reason: Bacterial MlaE/YrbE plasma-membrane localization remains supported, and the original plant
    LOSS_SUPPORTED IRD PTN001575509 is retained unchanged. Its actual 50-leaf plant clade spans SF4 and
    SF14. A family-wide grant with one Arabidopsis exception would falsely license other plants, while
    an entire-SF exclusion would lose bacterial positives. The exact Q8L4R0 negative remains CURRENT_SUPPORTED_NEGATIVE
    in the consultation ledger because production forbids live member_exceptions under UNRESOLVED. The
    PAINT loss remains machine-readable in this review.
- assessed_term:
    id: GO:0015914
    label: phospholipid transport
  scope: UNRESOLVED
  scope_reason: Canonical MlaE contributes to phospholipid transport and TGD1 participates in chloroplast
    lipid transport. Mycobacterial YrbE1A/4A have positive fatty-acid/cholesterol uptake evidence, which
    does not prove absence of all secondary phospholipid transport. GO0120010 is not defined as bacterial
    diderm maintenance. SF4 mixes these contexts, SF3 has other bacterial paralogs and SF14 contains plant
    members; no exclusive subfamily or loss boundary is established here.
- assessed_term:
    id: GO:0006869
    label: lipid transport
  scope: FAMILY_WIDE
  scope_reason: The substrate-neutral process is consistent with positively characterized Mla phospholipid
    handling, mycobacterial fatty-acid/cholesterol uptake and plant TGD lipid import, together with conserved
    permease architecture. It retains those positive lipid roles without requiring a negative phospholipid
    assertion or licensing exact cargo/partners for every member.
- assessed_term:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  scope: FAMILY_WIDE
  scope_reason: 'Every member is the transmembrane subunit of an ABC transporter: MlaE within MlaFEDB,
    the YrbE pairs within the Mce1-Mce4 transporters driven by the shared MceG ATPase, and TGD1 within
    the plant TGD1/TGD2/TGD3 translocator. Substrate-neutral, so it needs no exceptions, and it is the
    correct replacement for the misfitting GO:1990531 (a P-type flippase complex term) that the E. coli
    mlaE and mlaD reviews modify away from.'
  supported_by:
  - reference_id: PMID:33236984
    supporting_text: At the center of the complex, a core ABC transporter module is formed from two copies
      each of the MlaF ATPase and the MlaE transmembrane domains (TMDs).
