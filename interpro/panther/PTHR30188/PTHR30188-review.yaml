  divergence_description: These are the permease partners of mycobacterial Mce uptake systems, with positive
    fatty-acid/cholesterol routes and corresponding partners rather than independently demonstrated Mla
    phospholipid cycling. That contextual difference prevents using them as verified Mla realizers; it
    does not demonstrate absence of secondary phospholipid transport or justify a substrate-loss node.
    SF4 contains the paired YrbE proteins alongside MlaE and TGD1.
  supported_by:
