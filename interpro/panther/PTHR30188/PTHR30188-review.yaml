  - id: UniProtKB:P64606
    label: Intermembrane phospholipid transport system permease protein MlaE
    organism: Escherichia coli (strain K12)
  assessment: SOUND
  assessment_reason: 'A location assertion for a polytopic integral membrane protein, seeded by the one
    member with direct localization evidence: E. coli MlaE is curated to plasma membrane by IDA from two
    independent studies (PMID:17309111, PMID:33199922) and its own gene review accepts the term. Every
    bacterial descendant is an inner (plasma) membrane permease, including the mycobacterial YrbE proteins,
    whose topology and MceG-binding cytosolic loop place them in the plasma membrane even though their
    substrates differ. The one clade for which the term is wrong - Viridiplantae, where TGD1 is in the
    chloroplast envelope - is already excluded by the IRD at PTN001575509 assessed below, so the gain
    needs no further pruning. The single seed is not a weakness here: the inference being propagated is
    membrane topology, which is the best-conserved property in the family.'
  supported_by:
  - reference_id: PMID:33236984
    supporting_text: Our cryo-EM structure reveals that the core TMD of MlaE consists of five transmembrane
      helices (TM1 - TM5) (Figure 2A and E-G).
