  - assessed_term:
      id: GO:0015914
      label: phospholipid transport
    scope: FAMILY_WIDE
    scope_reason: >-
      Safe wherever the transported lipid is a phospholipid, which covers the Mla
      permeases (IDA-grounded on E. coli MlaE), their uncharacterized bacterial
      relatives, and plant TGD1 whose substrate is phosphatidic acid. The mycobacterial
      Mce permeases are the exception, and they are listed individually rather than by
      subfamily because PANTHER puts the "A" subunits in SF4 together with MlaE. Note
      that the completed E. coli mlaE and mlaD gene reviews MODIFY this term to the more
      specific GO:0120010; that is a refinement of a correct term, consistent with this
      scope.
    member_exceptions:
      - member:
          id: UniProtKB:O07412
          label: Conserved integral membrane protein YrbE1A
          gene_symbol: yrbE1A
          organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
        exception_reason: >-
          YrbE1A is the permease of Mce1, the mycobacterial fatty-acid importer; a
          yrbE1A deletion mutant is defective in fatty-acid uptake and metabolism. Its
          substrate is not a phospholipid, so GO:0006869 lipid transport (or a fatty-acid
          transport term) is the correct annotation.
        pruned_node_id: PANTHER:PTN000766204
        supported_by:
          - reference_id: PMID:28708968
            supporting_text: "To test this hypothesis, we inactivated the Mce1 permease Rv0167/YrbE1A subunit by allelic exchange (ΔyrbE1A::hyg) and quantified fatty acid uptake and metabolism in this mutant."
      - member:
          id: UniProtKB:O53546
          label: Conserved integral membrane protein YrbE4A. Possible ABC transporter
          gene_symbol: yrbE4A
          organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
        exception_reason: >-
          YrbE4A is the permease subunit of the Mce4 cholesterol transporter; the
          deletion mutant is defective in cholesterol uptake and catabolism. Cholesterol
          is not a phospholipid, so the phospholipid-specific term does not hold.
        pruned_node_id: PANTHER:PTN000766204
        supported_by:
          - reference_id: PMID:28708968
            supporting_text: "The levels of cholesterol metabolism and uptake in the ΔlucA::hyg strain was comparable to a Mtb Erdman mutant lacking the permease subunit of the Mce4 cholesterol transporter Rv3501c/YrbE4A (ΔyrbE4A::hyg) (Figure 1B,C and Figure 1—figure supplement 2D)."
  - assessed_term:
