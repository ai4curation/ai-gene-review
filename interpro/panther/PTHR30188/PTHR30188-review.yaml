review_status: COMPLETE
reviewed_by: AI-assisted family review supporting modules/bacterial_mla_intermembrane_phospholipid_transport.yaml
review_date: "2026-10-24"
notes: >-
  Written to support the Mla module's MlaE part
  (modules/bacterial_mla_intermembrane_phospholipid_transport.yaml), which selects
  PANTHER:PTHR30188:SF4 with the PSEPK exemplar Q88P93. All node ids, asserted terms,
  seeds, taxa, evidence codes, negation and snapshot dates are verbatim from the cached
  PTHR30188-paint.tsv (one assessment per row, three rows); subfamily labels are
  verbatim from interpro/panther/panther.obo; member accessions come from
  PTHR30188-entries.csv or from UniProt cross-reference queries, with each
  representative member's subfamily read from its own UniProt DR PANTHER lines.
  Propagation outcomes were checked in QuickGO on 2026-10-23 (PTN000766204: 1231
  annotations across both terms).

  The IRD row is the most informative thing in this family and the reason the review
  exists in this shape. PAINT noticed that the plant branch of an otherwise
  plasma-membrane family had moved compartment, and withheld the location term from
  exactly that branch while letting the phospholipid-transport term through. That is a
  model of correctly scoped curation, and it also shows what PAINT has not yet done
  here: the equivalent substrate divergence in the mycobacterial Mce permeases is not
  scoped at all, so GO:0015914 still reaches YrbE1A (fatty acids) and YrbE4A
  (cholesterol). Hence NEEDS_PRUNING on that row, with member exceptions rather than
  subfamily exclusions, because SF4 mixes MlaE, TGD1 and the YrbE "A" subunits.

  On GO:1990531: the term is defined for P-type (P4-ATPase) flippase complexes, so it
  misfits every ABC-transporter member of this family. That is recorded as a
  NOT_APPLICABLE term assessment here and as WRONG_NODE on the corresponding PAINT row
  in the PTHR43023 (MlaF) family review, where PAINT does assert it.

  No residue_sites: the functional boundaries in this family are substrate and
  compartment, both clade properties, and no claim in this review or in the member gene
  reviews turns on an individual position. The MlaE substrate-binding site is a
  membrane-embedded cavity formed by several helices rather than a small set of
  catalytic residues.
