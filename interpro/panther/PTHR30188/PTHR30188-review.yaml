        organism: Pseudomonas putida (strain KT2440)
      - id: UniProtKB:O26002
        label: Conserved hypothetical integral membrane protein
        gene_symbol: HP_1466
        organism: Helicobacter pylori (strain 26695)
      - id: UniProtKB:O67489
        label: ABC transporter permease
        gene_symbol: aq_1530
        organism: Aquifex aeolicus (strain VF5)
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR30188:SF14
    label: ABC TRANSPORTER PERMEASE PROTEIN
    description: >-
      The fourth subfamily. No member appears in the fetched PTHR30188-entries.csv, and
      a UniProt cross-reference query for this subfamily restricted to the organisms
      used elsewhere in this review returned no proteins, so no representative_members
      are asserted and no divergence is claimed. Recorded as unassessed: check it before
      assuming any family-wide lipid term is safe there.
    diverged_from_family: false

node_assessments:
  - node_id: PANTHER:PTN000766204
    asserted_term:
      id: GO:0005886
      label: plasma membrane
    evidence: IBD
    paint_snapshot: "20230111"
    seeds:
      - id: UniProtKB:P64606
        label: Intermembrane phospholipid transport system permease protein MlaE
        organism: Escherichia coli (strain K12)
    assessment: SOUND
    assessment_reason: >-
      A location assertion for a polytopic integral membrane protein, seeded by the one
      member with direct localization evidence: E. coli MlaE is curated to plasma
      membrane by IDA from two independent studies (PMID:17309111, PMID:33199922) and
      its own gene review accepts the term. Every bacterial descendant is an inner
      (plasma) membrane permease, including the mycobacterial YrbE proteins, whose
      topology and MceG-binding cytosolic loop place them in the plasma membrane even
      though their substrates differ. The one clade for which the term is wrong -
      Viridiplantae, where TGD1 is in the chloroplast envelope - is already excluded by
      the IRD at PTN001575509 assessed below, so the gain needs no further pruning. The
      single seed is not a weakness here: the inference being propagated is membrane
      topology, which is the best-conserved property in the family.
    supported_by:
      - reference_id: PMID:33236984
        supporting_text: "Our cryo-EM structure reveals that the core TMD of MlaE consists of five transmembrane helices (TM1 - TM5) (Figure 2A and E-G)."
  - node_id: PANTHER:PTN000766204
    asserted_term:
      id: GO:0015914
      label: phospholipid transport
    evidence: IBD
    paint_snapshot: "20211112"
    seeds:
      - id: UniProtKB:P64606
        label: Intermembrane phospholipid transport system permease protein MlaE
        organism: Escherichia coli (strain K12)
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Right for most of the family and wrong for an identifiable branch. The seed, E.
      coli MlaE, has IDA evidence for phospholipid transfer activity and intermembrane
      phospholipid transfer from the MlaFEDB work, and the term is equally correct for
      the Mla orthologs and for plant TGD1, whose substrate (phosphatidic acid) is a
      phospholipid - note that TGD1 keeps this IBA while losing the plasma-membrane one,
      which is exactly the right outcome. The branch that should not have it is the
      mycobacterial Mce permeases: a YrbE1A deletion is defective in fatty-acid uptake
      and a YrbE4A deletion in cholesterol uptake, so neither transports phospholipids,
      and the same holds for their SF13 "B" partners. Because that branch spans SF4
      (with MlaE) and SF13, no affected_subfamilies are named - excluding SF4 would
      wrongly strip the reference protein's own clade - and the two best-evidenced
      mycobacterial members are recorded as member exceptions on the term assessment
      instead. GO:0006869 lipid transport is what those members should keep.
    supported_by:
      - reference_id: PMID:28708968
        supporting_text: "To test this hypothesis, we inactivated the Mce1 permease Rv0167/YrbE1A subunit by allelic exchange (ΔyrbE1A::hyg) and quantified fatty acid uptake and metabolism in this mutant."
      - reference_id: PMID:28708968
        supporting_text: "The levels of cholesterol metabolism and uptake in the ΔlucA::hyg strain was comparable to a Mtb Erdman mutant lacking the permease subunit of the Mce4 cholesterol transporter Rv3501c/YrbE4A (ΔyrbE4A::hyg) (Figure 1B,C and Figure 1—figure supplement 2D)."
