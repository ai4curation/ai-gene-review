  gene_review: genes/ECOLI/mlaE/mlaE-ai-review.yaml

subfamilies:
  - subfamily_id: PANTHER:PTHR30188:SF4
    label: PROTEIN TRIGALACTOSYLDIACYLGLYCEROL 1, CHLOROPLASTIC
    description: >-
      The subfamily the Mla module uses, despite being named after the plant member. It
      is functionally mixed and that is its most important property for term
      propagation: it contains the enterobacterial and Haemophilus MlaE permeases, the
      Pseudomonas orthologs, Rickettsia and cyanobacterial/red-algal members,
      Arabidopsis TGD1 (chloroplast inner envelope), and the mycobacterial "A" subunits
      YrbE1A, YrbE2A, YrbE3A and YrbE4A of the mce operons. Any term scoped to this
      subfamily as a whole will reach phospholipid, cholesterol/fatty-acid and plant
      organellar transporters alike.
    representative_members:
