- subfamily_id: PANTHER:PTHR30188:SF13
  label: CONSERVED HYPOTHETICAL INTEGRAL MEMBRANE PROTEIN YRBE3B
  description: The mycobacterial and actinobacterial "B" subunits of the mce operons - YrbE1B, YrbE2B,
    YrbE3B, YrbE4B and the Streptomyces equivalent - which pair with the "A" subunits in SF4 to make the
    heterodimeric permease of each Mce transporter. All eight mycobacterial YrbE proteins share a predicted
    topology and a cytosolic loop carrying an EExDA motif, the candidate binding site for the shared MceG
    ATPase.
