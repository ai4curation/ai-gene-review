family_id: PANTHER:PTHR30188
family_name: ABC TRANSPORTER PERMEASE PROTEIN-RELATED
preferred_name: >-
  MlaE/YrbE/TGD1 transmembrane permease subunits of MCE-type lipid transport systems
summary: >-
  Small polytopic inner-membrane permeases (~260-350 aa, five transmembrane helices in
  the resolved core) that form the transmembrane domain of MCE-type lipid transporters.
  The reference member, Escherichia coli MlaE (also called YrbE), sits at the centre of
  the MlaFEDB complex: two copies of MlaE pair with two MlaF ATPases (PTHR43023) on the
  cytoplasmic side and with the MlaD (MCE) hexamer (PTHR33371) on the periplasmic side,
  and cryo-EM shows a continuous lipid pathway running from the MlaE substrate-binding
  site through MlaD into the periplasm. MlaE's fold is related to the transmembrane
  domains of MacB and LptFG rather than to classical ABC importers. The family's three
  functional settings mirror those of its ATPase and MCE partners. In diderm bacteria
  the Mla permease handles phospholipids as part of outer-membrane lipid-asymmetry
  maintenance. In mycobacteria the paralogous YrbE proteins come in pairs (YrbE1A/1B to
  YrbE4A/4B) encoded in the four mce operons, and they are the permeases of importers
  for host-derived apolar lipids: deleting YrbE1A blocks fatty-acid uptake and deleting
  YrbE4A blocks cholesterol uptake. In plants and algae the orthologous permease TGD1
  works with TGD2 and TGD3 at the chloroplast inner envelope to import ER-derived
  lipid, and it is a chloroplast envelope protein rather than a plasma-membrane one.
  PANTHER's family name is a generic ABC-permease descriptor and its SF4 name is taken
  from the plant member, so neither conveys that the family is overwhelmingly
  bacterial: the InterPro slice records 25930 proteins across 11877 proteomes in four
  subfamilies, while the fetched entries.csv covers only 14 reviewed members
  (enterobacterial/Haemophilus MlaE, a set of Rickettsia and cyanobacterial/red-algal
  orthologs, and Arabidopsis TGD1).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are the membrane-embedded permease of an MCE-type lipid translocator, and
  that is enough to make the generic terms (plasma membrane for the bacterial members,
  lipid transport, ABC transporter complex) safe. Two groups diverge in ways that
  matter for propagation. The mycobacterial YrbE permeases, split by PANTHER across
  SF4 (the A subunits) and SF13 (the B subunits), serve importers whose substrates are
  fatty acids (Mce1) and cholesterol (Mce4), so phospholipid-specific terms do not hold
  for them even though they sit in the same subfamily as MlaE. The plant/algal TGD1
  clade, also inside SF4, resides in the chloroplast envelope, which is why PAINT
  already carries an IRD removing the plasma-membrane term from the Viridiplantae
  branch. The divergence therefore cuts across subfamilies rather than along them, and
  is recorded here as member exceptions.
