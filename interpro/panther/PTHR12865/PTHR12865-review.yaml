family_id: PANTHER:PTHR12865
family_name: PHOSPHATIDYLINOSITOL 4-KINASE TYPE-II
preferred_name: Type II phosphatidylinositol 4-kinase (LSB6/PI4K2) family
summary: >-
  Palmitoylated, membrane-bound type II PI 4-kinases phosphorylate phosphatidylinositol to PI4P on
  endosomes, the trans-Golgi network and the plasma membrane (S. cerevisiae LSB6, S. pombe lsb6,
  animal PI4K2A/B). They are structurally unrelated to the type III PI4Ks of PTHR10048.
functional_coherence: COHERENT
coherence_reason: All subfamilies are type II PI4Ks.
