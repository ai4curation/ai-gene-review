family_id: PANTHER:PTHR22749
family_name: RIBOFLAVIN KINASE/FMN ADENYLYLTRANSFERASE
preferred_name: Riboflavin kinase (RFK/FMN1/RibF) family
summary: >-
  Riboflavin kinases phosphorylate riboflavin to FMN. Eukaryotic RFK (S. cerevisiae FMN1, S. pombe
  fmn1, human RFK) is monofunctional. Bacterial RibF fuses it to an N-terminal FMN adenylyltransferase
  domain that makes FAD.
functional_coherence: COHERENT
coherence_reason: >-
  All members are riboflavin kinases. The FMN adenylyltransferase domain is present only in bacterial
  RibF, which PANTHER places in SF6 with the fungal enzymes.
