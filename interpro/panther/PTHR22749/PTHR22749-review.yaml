subfamilies:
- subfamily_id: PANTHER:PTHR22749:SF6
  label: RIBOFLAVIN KINASE
  description: 'Mixed subfamily of 42 reviewed members: monofunctional fungal riboflavin kinases (S. cerevisiae
    FMN1, S. pombe fmn1) and bifunctional bacterial riboflavin kinase/FMN adenylyltransferases (RibF,
    including E. coli RibF and P. putida KT2440 RibF; B. subtilis RibC). Only the bacterial members carry
    the N-terminal FAD synthetase domain.'
