- assessed_term:
    id: GO:0003919
    label: FMN adenylyltransferase activity
  scope: UNRESOLVED
  scope_reason: FMN adenylyltransferase activity belongs to the N-terminal FAD synthetase domain of bacterial
    RibF. SF6 holds both these bifunctional proteins and monofunctional fungal riboflavin kinases (FMN1,
    fmn1) that lack the domain and the activity, so subfamily membership does not decide it, and no PAINT
    node in this family asserts the activity. Delimiting the bifunctional clade would need a member-level
    domain survey of SF6, which was not done; riboflavin_biosynthesis grounds the activity on the gene-reviewed
    E. coli and P. putida RibF.
  supported_by:
  - reference_id: PMID:10887197
    supporting_text: In contrast to bifunctional prokaryotic flavokinase/FAD synthetase enzymes, the yeast
      enzyme did not show accompanying FAD synthetase activity.
  - reference_id: PMID:9473052
    supporting_text: This work shows that the ribC wild-type gene product has both flavokinase and flavin
      adenine dinucleotide synthetase (FAD-synthetase) activities.
