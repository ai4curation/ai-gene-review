term_assessments:
- assessed_term:
    id: GO:0004396
    label: hexokinase activity
  scope: UNRESOLVED
  scope_reason: >-
    The modules' core activity (emp_glycolysis uses it as required_function). It holds for all
    characterized hexokinases and glucokinases (glucokinase activity is a child term). It is
    doubtful for the N-acetylglucosamine kinases (NGK1, Km for glucose 71 mM). The plant
    hexokinase-like proteins (SF63, SF18), which do not inherit the kinase node PTN004516717,
    were not assessed. Because of those groups the term is not scoped family-wide; the
    required_function filter in the module is the right safeguard.
  supported_by:
  - reference_id: PMID:8549830
    supporting_text: Two hexokinases were characterized in Schizosaccharomyces pombe
  - reference_id: PMID:36216916
    supporting_text: The Km values of Ngk1 for GlcNAc and glucose were 0.11 mM and 71 mM, respectively
- assessed_term:
    id: GO:0004340
    label: glucokinase activity
  scope: UNRESOLVED
  scope_reason: >-
    PAINT uses this term for the glucose-to-glucose-6-phosphate reaction at PTN004516717, and the
    yeast, S. pombe, HK1 and GCK reviews all accept the IBA in that sense. The glucose-specific
    glucokinase role (GLK1, GCK) is what the module's glucokinase variant means, and it is not a
    subfamily property: SF30 also holds the conventional S. pombe hexokinase hxk2. NGK1 inherits
    it with only weak glucose activity.
  supported_by:
  - reference_id: PMID:8549830
    supporting_text: A NADP-dependent glucose dehydrogenase was detected, but not a glucokinase.
  - reference_id: PMID:36216916
    supporting_text: The Km values of Ngk1 for GlcNAc and glucose were 0.11 mM and 71 mM, respectively
- assessed_term:
    id: GO:0008865
    label: fructokinase activity
  scope: UNRESOLVED
  scope_reason: >-
    Holds for the broad-specificity hexokinases and is used by the module's fructose entry step
    (via GO:0004396 with HXK1, HXK2 and hxk1 as exemplars). It does not hold for S. cerevisiae
    GLK1 (removed by its review) or NGK1, and both sit in subfamilies shared with fructose-active
    members or not separable by subfamily. See PTN004516717.
  supported_by:
  - reference_id: PMID:6300872
    supporting_text: one (hxk1 hxk2) lacking both hexokinase A(P-I) and B(P-II) but containing glucokinase
      (and hence able to grow on glucose but not fructose)
  - reference_id: PMID:8549830
    supporting_text: Spores carrying the double disruption hxk1+ hxk2+ did not grow on glucose or fructose
- assessed_term:
    id: GO:0019158
    label: mannokinase activity
  scope: UNRESOLVED
  scope_reason: >-
    Asserted on three separate nodes (Dikarya PTN001066695, vertebrate GCK PTN002714980,
