family_id: PANTHER:PTHR19443
family_name: HEXOKINASE
preferred_name: Eukaryotic hexokinases, glucokinases and hexokinase-related sugar kinases
summary: >-
  ATP-dependent sugar kinases with the actin-fold hexokinase N-terminal and C-terminal domains,
  found throughout eukaryotes. Most members phosphorylate D-glucose at C6, the first step of
  glycolysis. The broad-specificity hexokinases also phosphorylate D-fructose and D-mannose:
  S. cerevisiae HXK1 and HXK2, S. pombe hxk1 and hxk2, mammalian HK1-3 and HKDC1, and plant HXKs.
  The glucose-specific glucokinases include S. cerevisiae GLK1 and the high-Km vertebrate
  glucose sensor GCK (hexokinase IV), which sets the threshold for insulin secretion. The family
  also contains divergent members. S. cerevisiae NGK1 is an N-acetylglucosamine kinase with
  negligible hexose activity. Candida HXK1/Nag5 is a GlcNAc kinase. Plants have hexokinase-like
  (HKL) proteins. Mammalian HK1 and HK2 bind the mitochondrial outer membrane through an
  N-terminal porin-binding peptide.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Hexose phosphorylation at C6 is shared by the characterized hexokinases and glucokinases of
  fungi, plants and animals. Three things diverge. (1) Substrate range: GLK1-type fungal
  glucokinases are aldohexose-specific and do not phosphorylate fructose, while the
  N-acetylglucosamine kinases (NGK1, SF83) phosphorylate neither fructose nor mannose and use
  glucose only at very high Km. (2) Mitochondrial outer-membrane binding: it depends on the
  N-terminal peptide of vertebrate HK1 and HK2 (PAINT also seeds it from a plant HXK), and fungal
  hexokinases and GCK do not have it. (3) Organismal roles such as glucose sensing for insulin
  secretion are vertebrate GCK-specific. The PANTHER subfamilies do not follow these lines:
  SF30 GLUCOKINASE-1-RELATED holds both S. cerevisiae GLK1 and the conventional S. pombe
  hexokinase hxk2, and SF16 HEXOKINASE TYPE 1-RELATED holds yeast HXK1 and HXK2, S. pombe hxk1,
  Arabidopsis HXK1 and the Drosophila hexokinases. So substrate- and compartment-specific terms
  have to be scoped by node or member, not by subfamily.
