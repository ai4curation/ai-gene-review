notes: >-
  Modules. emp_glycolysis selects the whole family with required_function GO:0004396
  (hexokinase, fructose and mannose entry) or GO:0004340 (glucokinase entry). That is the
  appropriate safeguard, given the GlcNAc kinases and the mixed SF16 and SF30.
  glycolysis_investment_phase selects the whole family for GO:0004396 without a required_function,
  which would include NGK1. The emp_glycolysis fructose-entry exemplars (HXK1, HXK2, S. pombe hxk1)
  are fructose-active, which is consistent. Gene-review consistency: the fungal reviews (HXK1, HXK2,
  GLK1, hxk1, hxk2) and GCK mark or remove GO:0032473 and GO:0001678, while HK1 accepts GO:0032473
  and keeps GO:0001678 non-core, as expected given the lineage split. GLK1 removes GO:0008865,
  agreeing with the PTN004516717 assessment. NGK1 (YLR446W) has no gene review yet; it inherits
  GO:0004340, GO:0008865, GO:0019158, GO:0006013, GO:0006096 and GO:0032473 IBAs. PAINT also
  gives S. pombe hxk2 no mannokinase IBA (it is outside PTN001066695), although it is a
  conventional hexokinase. One PTN000455350 GO:0032473 row in the PAINT UniProt GAF has an
  empty with/from. No IRD/IKR rows for this family's nodes in .cache/panther/IBD.gaf. The
  Arabidopsis locus/accession pairing for HXK3 and HKL1 differs between UniProt (Q9LPS1 HXK3 =
  At1g50460; Q9FZG4 HKL1 = At1g47840) and the PAINT seed AT1G47840 used for glucokinase; this was
  not resolved here.
