- subfamily_id: PANTHER:PTHR19443:SF83
  label: N-ACETYLGLUCOSAMINE KINASE
  description: S. cerevisiae NGK1 (YLR446W), an N-acetylglucosamine kinase.
  representative_members:
  - id: UniProtKB:Q06204
    label: N-acetylglucosamine kinase
    gene_symbol: NGK1
    organism: Saccharomyces cerevisiae
  diverged_from_family: true
  divergence_description: >-
    High affinity for GlcNAc (Km 0.11 mM) and only weak glucose phosphorylation (Km 71 mM); no
    detectable fructose or mannose phosphorylation. It nevertheless inherits glucokinase,
    fructokinase, mannokinase, glycolysis and mannose-metabolism IBAs from this family's nodes.
  supported_by:
  - reference_id: PMID:36216916
    supporting_text: The Km values of Ngk1 for GlcNAc and glucose were 0.11 mM and 71 mM, respectively,
      suggesting that Ngk1 possesses a high affinity for GlcNAc, unlike hexokinases.
  - reference_id: PMID:36216916
    supporting_text: The phosphorylation product was hardly detected when either fructose, mannose, or
      galactose was used as a sugar substrate, suggesting that this enzyme does not recognize these
      monosaccharides as a substrate.
