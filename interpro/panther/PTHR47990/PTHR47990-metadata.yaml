  name:
    name: Iron/ascorbate-dependent oxidoreductase
    short: Iron_ascorbate_oxido_reductase
  description:
  - text: The iron/ascorbate-dependent oxidoreductase family is involved in a wide
      range of biosynthetic processes, including the production of antibiotics, plant
      hormones, and secondary metabolites with various biological activities. Members
      of this family function as 2-oxoglutarate-dependent dioxygenases, catalyzing
      hydroxylation reactions that are essential for the biosynthesis of cyclic peptides,
      gibberellins, and other compounds. These enzymes play crucial roles in fungal
      cell wall formation inhibition, plant development regulation through gibberellin
      catabolism, and the formation of bioactive compounds with antifungal, antibacterial,
      and antitumor properties.
