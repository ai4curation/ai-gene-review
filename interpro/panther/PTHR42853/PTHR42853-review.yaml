notes: >-
  Reviewed for the acetyl-CoA carboxylase part of modules/type_ii_fatty_acid_synthesis.yaml, whose heteromeric
  AccABCD variant lists one representative per subunit. The four subunit families are reviewed together
  so that GO:0003989 acetyl-CoA carboxylase activity is treated the same way in each: it names the complete
  reaction ATP + acetyl-CoA + hydrogencarbonate = ADP + phosphate + malonyl-CoA, which no single subunit
  performs, so it is scoped NOT_APPLICABLE here and recorded as contributes_to_molecular_function in the
  member gene reviews, with in_complex GO:0009317. Scope divergence worth stating plainly: this review
  and the two other new ACC subunit families (PTHR42853 AccA, PTHR42995 AccD, PTHR45266 AccB) scope GO:0003989
  NOT_APPLICABLE, because every member of each of them is a single subunit that performs no step of the
  complete reaction. PTHR48095 (AccC) instead scopes it SUBFAMILY_ONLY with member exceptions, which is
  the version main already carried from the pyruvate-metabolism review and which was deliberately kept
  rather than overwritten. The two formulations express the same judgement - a subunit contributes to
  the holoenzyme activity instead of enabling it - and both leave the member reviews' contributes_to records
  consistent; the values are not identical, and aligning them is a decision for whoever owns PTHR48095.
