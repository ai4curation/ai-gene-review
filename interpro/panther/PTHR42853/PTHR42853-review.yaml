family_id: PANTHER:PTHR42853
family_name: ACETYL-COENZYME A CARBOXYLASE CARBOXYL TRANSFERASE SUBUNIT ALPHA
preferred_name: AccA carboxyltransferase alpha subunit family
summary: >-
  The alpha subunit of the bacterial acetyl-CoA carboxylase carboxyltransferase. Two alpha and two beta
  subunits form the alpha2beta2 carboxyltransferase whose active sites lie at the alpha-beta interfaces;
  it accepts the carboxyl group from carboxybiotinyl-AccB and transfers it to acetyl-CoA, completing malonyl-CoA
  synthesis. All 473 members of the local inventory are AccA-type alpha subunits in a single subfamily,
  spanning proteobacteria, firmicutes and plastid-encoded plant enzymes.
functional_coherence: COHERENT
coherence_reason: >-
  One subfamily, one role: every inventory member is annotated as the carboxyl transferase alpha subunit
  of acetyl-CoA carboxylase.
