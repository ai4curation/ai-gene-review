family_id: PANTHER:PTHR12317
family_name: DIACYLGLYCEROL O-ACYLTRANSFERASE
preferred_name: DGAT2/MOGAT acyltransferase family
summary: >-
  ER membrane acyl-CoA-dependent acyltransferases of the DGAT2 family. DGAT2 (human DGAT2, S. cerevisiae
  DGA1, S. pombe dga1) makes triacylglycerol from diacylglycerol. Related subfamilies acylate monoacylglycerol
  (MOGAT1-3) or wax alcohols (AWAT1/2).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The acyl acceptor differs by subfamily: diacylglycerol (SF0, SF14, SF63), monoacylglycerol (SF26,
  SF74) and fatty alcohols (SF16).
