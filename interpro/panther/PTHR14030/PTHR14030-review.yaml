  member_exceptions:
  - member:
      id: UniProtKB:P47074
      gene_symbol: MAD3
      organism: yeast
      gene_review: genes/yeast/MAD3/MAD3-ai-review.yaml
    pruned_node_id: PANTHER:PTN000361607
    exception_reason: PAINT node PTN000361607 (the ancestor of both Bub1 and Mad3/BubR1) carries meiotic
      centromeric cohesion, seeded by fission-yeast Bub1 (SPCC1322.12c) and Drosophila BubR1 (FBgn0263855).
      In fission and budding yeast this function belongs to the Bub1 kinase, which phosphorylates H2A
      to recruit shugoshin and thereby protects centromeric Rec8 cohesin in meiosis I. Budding-yeast Mad3
      is the kinase-less product of the Bub1/Mad3 duplication and the genome retains Bub1 (SGD:S000003420),
      which carries the same IBA; no study implicates Mad3 in centromeric cohesion, and the direct meiotic
      analyses of Mad3 (prophase timer and nonexchange-chromosome segregation via Stu1/CLASP; PMID:15951820
      and PMID:39079532) describe different functions. The node placement is defensible for the family
      ancestor, but the function requires the kinase output that Mad3 lacks entirely (PMID:17227844) and
      is executed in yeast by the paralog Bub1.
    supported_by:
    - reference_id: file:genes/yeast/MAD3/MAD3-ai-review.yaml
      supporting_text: centromeric cohesion, seeded by fission-yeast Bub1 (SPCC1322.12c) and Drosophila
        BubR1
