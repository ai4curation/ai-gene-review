family_id: PANTHER:PTHR11252
family_name: POLYRIBONUCLEOTIDE NUCLEOTIDYLTRANSFERASE
preferred_name: Polynucleotide phosphorylase (PNPase) family
summary: Polynucleotide phosphorylases are homotrimeric, ring-shaped 3'-to-5' exoribonucleases with two
  RNase PH domains per protomer plus KH and S1 RNA-binding domains. They degrade single-stranded RNA processively
  by phosphorolysis, releasing nucleoside diphosphates, and can polymerize NDPs. Bacterial PNPases act
  in the cytoplasm, often bound to the RNase E degradosome scaffold; eukaryotic members (PNPT1) are imported
  into mitochondria (and plastids in plants), where they degrade mitochondrial mRNA and process RNA 3'
  ends.
functional_coherence: COHERENT
coherence_reason: Phosphorolytic polyribonucleotide nucleotidyltransferase activity is conserved in every
  characterised member; differences concern compartment (bacterial cytosol vs. mitochondrion/plastid)
  rather than activity.
