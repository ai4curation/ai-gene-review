    PNPT1 and Drosophila PNPase reviews accept it. Resolution needs a GO decision on whether GO:0000175
    should be mechanism-neutral.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11252/PTHR11252-paint.tsv
    supporting_text: "PTHR11252\tPTN000134193\tGO:0000175\tF\tIBD\tfalse"
  - reference_id: file:genes/ECOLI/pnp/pnp-ai-review.yaml
