family_id: PANTHER:PTHR30557
family_name: THIAMINE BIOSYNTHESIS PROTEIN THIC
preferred_name: ThiC radical-SAM phosphomethylpyrimidine synthase family
summary: >-
  Radical S-adenosyl-L-methionine (SAM) enzymes that rearrange the purine-pathway intermediate
  5-aminoimidazole ribonucleotide (AIR) into 4-amino-2-methyl-5-(phosphooxymethyl)pyrimidine (HMP-P),
  the pyrimidine moiety of thiamine (EC 4.1.99.17). Canonical members (about 600 aa) have an N-terminal
  ThiC-associated domain, a central (beta/alpha)8 barrel that binds AIR and an active-site divalent
  metal, and a C-terminal CX2CX4C motif that ligates the SAM-cleaving [4Fe-4S] cluster. PANTHER
  places every member in a single subfamily, SF1. It contains bacterial ThiC (E. coli, Salmonella,
  Pseudomonas putida), the nuclear-encoded, plastid-targeted ThiC of plants and green algae
  (Arabidopsis THIC), shorter archaeal and anaerobic-bacterial ThiC1/ThiC2 paralogs, a Bifidobacterium
  ThiE-ThiC fusion, and the diverged anaerobic BzaA/BzaB proteins. BzaA/BzaB convert AIR into
  5-hydroxybenzimidazole, a precursor of the lower ligand of cobamides, rather than into HMP-P.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Phosphomethylpyrimidine synthase activity and thiamine biosynthesis hold for the canonical bacterial
  and plant/algal ThiC proteins, which make up nearly all members. Plant and algal ThiC differ only in
  being targeted to the chloroplast, not in catalysis. The BzaA/BzaB 5-hydroxybenzimidazole synthases
  of anaerobic Firmicutes use the same radical-SAM rearrangement of AIR to make a different product,
  for cobamide biosynthesis. PANTHER does not separate them into their own subfamily, so they are
  recorded as member exceptions to the HMP-P synthase and thiamine terms.
