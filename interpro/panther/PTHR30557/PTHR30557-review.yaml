  scope: FAMILY_WIDE
  scope_reason: >-
    This is the activity the thiamine_diphosphate_biosynthesis module assigns to PTHR30557, and it holds
    for the canonical bacterial and plant/algal ThiC proteins. Because PANTHER has only one subfamily
    (SF1), the activity applies family-wide, except for the BzaA/BzaB 5-hydroxybenzimidazole synthases
    listed as member exceptions. The short archaeal ThiC1/ThiC2 paralogs are named HMP-P synthases, but
    their activity has not been checked here. Assigning the activity to a family member should be
    confirmed with HAMAP MF_00089 or TIGR00190, since these models separate ThiC from Bza.
