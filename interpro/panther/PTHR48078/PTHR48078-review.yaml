notes: >-
  Node receivers were read from the PAINT UniProt GAF (.cache/panther/gene_association.paint_uniprot.gaf.gz)
  and matched to the family inventory. Subfamily placement of the P. putida KT2440 proteins
  (Q88HB4, Q88CN1, which are not in the reviewed inventory) was checked against their UniProt
  PANTHER cross-references (both PTHR48078:SF11). The root node PTN000034104 carries cytoplasm and
  cysteine biosynthetic process (GO:0019344). Its seeds are cysteine synthase/CBS proteins, and an
  IRD at the threonine-synthase node PTN000741516 blocks the cysteine term. No reviewed
  threonine-deaminase member in the inventory receives GO:0019344, so it is not assessed here. No
  residue sites were curated.
