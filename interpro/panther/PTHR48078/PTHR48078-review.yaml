- assessed_term:
    id: GO:0006567
    label: L-threonine catabolic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    This is the core process of the catabolic dehydratases (SF2 CHA1, SF8 SDS, and the TdcB
    members of SF6). PAINT places it at the catabolic node PTN000034171, negates it at the DsdA
    node, and does not give it to the biosynthetic branch. SF11 is listed only for a minor,
    non-core contribution. In S. cerevisiae, ilv1 cha1 genetics (IGI) show that the anabolic
    deaminase backs up threonine utilization to a limited extent, and the ILV1 review keeps the
    term as non-core. The P. putida ilvA-I/ilvA-II reviews accept the term as core, reasoning
    that deamination breaks threonine down. That reading is broader than PAINT's and the ILV1
    review's, and a curator may want to align them.
