- subfamily_id: PANTHER:PTHR48078:SF9
  label: D-SERINE DEHYDRATASE
  description: >-
    Bacterial D-serine dehydratases (DsdA), e.g. E. coli P00926. PAINT places D-serine ammonia-lyase
    activity (GO:0008721) and D-serine catabolism at PTN000034699. At the same node it places IRDs
