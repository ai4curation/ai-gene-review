family_id: PANTHER:PTHR48078
family_name: THREONINE DEHYDRATASE, MITOCHONDRIAL-RELATED
preferred_name: Fold-type II PLP serine/threonine dehydratase family (threonine deaminases, serine dehydratases, D-serine dehydratase, threonine synthase)
summary: >-
  Pyridoxal 5'-phosphate (fold-type II) enzymes that act on hydroxy amino acids. The best-studied
  group is the biosynthetic threonine deaminase (IlvA in bacteria, ILV1 in budding yeast, tda1 in
  fission yeast, OMR1 in Arabidopsis). It deaminates L-threonine to 2-oxobutanoate and ammonia,
  the first committed step of L-isoleucine synthesis, and has a C-terminal regulatory domain that
  is feedback-inhibited by isoleucine. The family also contains catabolic L-serine/L-threonine
  dehydratases that prefer serine (yeast CHA1, mammalian SDS, bacterial TdcB), the mammalian
  SDS-like protein SDSL (which also has glutamate racemase activity), bacterial D-serine
  dehydratase DsdA, and, in the subfamily PANTHER labels for catabolic TdcB, the threonine
  synthases ThrC, which catalyse a different reaction. Threonine deaminase activity is
  therefore shared by several subfamilies. Isoleucine biosynthesis belongs only to the
  biosynthetic branch.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family groups PLP enzymes that catalyse at least three reactions: L-threonine/L-serine
  ammonia-lyase (biosynthetic IlvA/ILV1 in SF11 and SF10; catabolic CHA1, SDS, SDSL and TdcB in
  SF2, SF8, SF16 and SF6), D-serine ammonia-lyase (DsdA, SF9) and threonine synthase (ThrC, which
  PANTHER places in SF6 together with TdcB). PAINT handles this through nodes rather than through
  the family root. Threonine deaminase activity sits at PTN002459384, which does not include the
  ThrC threonine synthases, and an IRD at the bacterial DsdA node PTN000034699 negates it.
  Isoleucine biosynthesis sits at the narrower biosynthetic node PTN002463966. Serine and
  threonine catabolism sit at PTN000034171, the serine-dehydratase clade, which does not include
  the biosynthetic enzymes. Within the biosynthetic subfamily SF11, Alternaria AKTS1-1 (V5Y0V0),
  a threonine dehydratase-like protein from an AK-toxin gene cluster, is a specialized member.
  It does not receive the PAINT isoleucine term.
