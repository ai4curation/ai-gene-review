family_id: PANTHER:PTHR31561
family_name: 3-KETOACYL-COA SYNTHASE
preferred_name: Plant 3-ketoacyl-CoA synthase (KCS/FAE1) family
summary: >-
  Plant-specific ER condensing enzymes of very-long-chain fatty acid elongation, unrelated to the
  ELO family. Arabidopsis FAE1/KCS18 elongates C18 to C20/C22 in seeds, and CER6/CUT1 makes wax precursors
  in the epidermis.
functional_coherence: COHERENT
coherence_reason: >-
  All members are 3-ketoacyl-CoA synthases; chain-length and tissue specificity vary between the
  21 Arabidopsis paralogs.
