  description:
  - text: This family of proteins includes membrane-localized transporters involved
      in the exchange of cations, particularly calcium, across cellular membranes.
      They function by mediating the efflux of calcium in exchange for sodium or lithium
      ions, which is crucial for maintaining calcium homeostasis within various organelles,
      including mitochondria. These transporters play a vital role in a range of physiological
      processes, such as insulin secretion, cell survival, and B-lymphocyte chemotaxis.
      Some family members are also implicated in the regulation of neural circuit
      patterning. The activity of these proteins can be modulated by specific inhibitors,
      highlighting their potential as therapeutic targets.
