  assessment: UNRESOLVED
  assessment_reason: >-
    Legacy metazoan node for the mitochondrial ATP synthase inhibitory factor IF1 (bovine P01096,
    human ATP5IF1 Q9UII2), corresponding to PANTHER subfamily SF6 ATPASE INHIBITOR, MITOCHONDRIAL,
    which explains the family's composite name. The current UniProt record for Q9UII2 classifies
    it in PTHR48417, not PTHR23407, so whether this node still has IF1 descendants in this family
