family_id: PANTHER:PTHR23407
family_name: ATPASE INHIBITOR/5-FORMYLTETRAHYDROFOLATE CYCLO-LIGASE
preferred_name: 5-Formyltetrahydrofolate cyclo-ligase (Fau/FAU1/MTHFS) family
summary: >-
  ATP-dependent cyclo-ligases convert 5-formyl-THF (folinic acid) to 5,10-methenyl-THF, returning
  this storage and inhibitor form of folate to the active one-carbon pool (bacterial Fau/YgfA, S.
  cerevisiae FAU1, human MTHFS).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The cyclo-ligase subfamily SF1 (with the SF10 mitochondrial-like isoform) carries the family's
  defining activity. PANTHER also names SF6 ATPASE INHIBITOR, MITOCHONDRIAL, and the legacy PAINT
  node PTN001157997 annotates the unrelated IF1 ATP synthase inhibitor function with IRD losses of
  the cyclo-ligase activity; the current UniProt record for human IF1 (Q9UII2) places it in
  PTHR48417, so that clade is a historical composite rather than a divergent cyclo-ligase.
