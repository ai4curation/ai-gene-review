  description:
  - text: This family of proteins includes components of intercellular desmosome junctions,
      which are critical for cell-cell adhesion. They interact with plaque proteins
      and intermediate filaments, playing a key role in maintaining tissue integrity.
      Some members are involved in the maintenance of planar cell polarity and inhibition
      of cell proliferation and differentiation. Others mediate calcium-dependent
      heterophilic interactions and are essential for normal sensory functions. These
      proteins typically contain cadherin domains that bind calcium ions to ensure
      structural rigidity and proper function.
