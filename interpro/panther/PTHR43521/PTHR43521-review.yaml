family_id: PANTHER:PTHR43521
family_name: ALPHA-AMINOADIPIC SEMIALDEHYDE DEHYDROGENASE
summary: This aldehyde-dehydrogenase family contains ALDH7/aminoadipate-semialdehyde and ALDH4/pyrroline-5-carboxylate
  dehydrogenase branches. These enzymes share a dehydrogenase framework while acting on different semialdehydes
  in amino-acid metabolism; individual members also contribute to protection from reactive aldehydes.
functional_coherence: HETEROGENEOUS
coherence_reason: Recombinant human ALDH7A1 metabolizes aminoadipic semialdehyde and additional aldehydes
  (PMID:20207735), supporting the aminoadipate-semialdehyde reaction in its branch. ALDH4/P5C-related
  members act on a different semialdehyde in proline metabolism. The complete substrate-specific boundary
  is unresolved across these branches; lysine catabolism, proline catabolism, cofactor preferences and
  stress responses are not interchangeable universal functions.
