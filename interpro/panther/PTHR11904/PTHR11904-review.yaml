family_id: PANTHER:PTHR11904
family_name: METHYLTHIOADENOSINE/PURINE NUCLEOSIDE PHOSPHORYLASE
preferred_name: Purine nucleoside phosphorylase (PNP) family
summary: >-
  Trimeric purine nucleoside phosphorylases phosphorolyse inosine, guanosine and their 2'-deoxy forms
  to the base and (deoxy)ribose 1-phosphate in purine salvage. S. cerevisiae PNP1 also cleaves nicotinamide
  riboside in NAD salvage. The family contains S. cerevisiae PNP1, S. pombe SPAC1805.16c and human
  PNP.
functional_coherence: COHERENT
coherence_reason: Both subfamilies (SF9, SF12) are purine nucleoside phosphorylases.
