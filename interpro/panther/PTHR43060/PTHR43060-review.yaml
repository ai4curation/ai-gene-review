family_id: PANTHER:PTHR43060
family_name: 3-HYDROXYISOBUTYRATE DEHYDROGENASE-LIKE 1, MITOCHONDRIAL-RELATED
preferred_name: HIBADH-related NAD(P)-dependent beta-hydroxyacid dehydrogenases (tartronate semialdehyde reductases GlxR/GarR, L-threonate dehydrogenase LtnD, plant HDH-like)
summary: >-
  A family of NAD(P)-dependent beta-hydroxyacid dehydrogenases of the
  3-hydroxyisobutyrate dehydrogenase (HIBADH)-related type, with an N-terminal
  6-phosphogluconate dehydrogenase-like Rossmann NAD(P)-binding domain and a C-terminal
  HIBADH-like helical domain. The best-characterized members are the enterobacterial
  tartronate semialdehyde (2-hydroxy-3-oxopropionate) reductases: GlxR of the glyoxylate
  glycerate pathway (gcl-hyi-glxR) and its paralog GarR of galactarate/glucarate
  catabolism, which reduce tartronate semialdehyde to D-glycerate. Other subfamilies hold
  the L-threonate dehydrogenases LtnD of four-carbon acid sugar catabolism (SF17), the
  plant mitochondrial 3-hydroxyisobutyrate dehydrogenase-like proteins (SF13), a
  trypanosomatid dehydrogenase-like clade (SF14), and a broad, mostly uncharacterized SF15
  that spans bacteria, archaea and eukaryotes.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members are NAD(P)-binding beta-hydroxyacid oxidoreductases, but substrates and
  pathways differ. The tartronate semialdehyde reductase activity is confined to one
  proteobacterial clade (PTN000541522) that spans part of SF15 (GlxR) and the nested SF3
  (GarR). SF17 LtnD enzymes prefer four-carbon beta-hydroxyacids (L-threonate), and the
  remainder of SF15 includes archaeal NAD-dependent L-serine dehydrogenase, plant
  HIBADH-like 1 and uncharacterized Bacillus, Mycobacterium and cyanobacterial proteins.
  Only the generic oxidoreductase term is family-wide; the specific reductase activity is
  clade-level.
