notes: >-
  Tree topology, subfamily-to-node mapping and leaf membership come from the PANTHER 19
  treeinfo service (family=PTHR43060, fetched 2026-10-24). The root PTN008678011 is a
  duplication separating the SF17 LtnD clade (PTN008678012) from the SF15 clade
  (PTN008448985), which contains SF3, SF13 and SF14 nested within it. Inside SF15 a
  horizontal-transfer node PTN005142488 holds the proteobacterial tartronate semialdehyde
  reductase clade PTN000541522 (Bradyrhizobium blr3168; Gammaproteobacteria PTN002453672
  with P. aeruginosa PA1500 and the enterobacterial duplication PTN002534389 into GarR
  PTN001885285 and GlxR PTN001885287), a second proteobacterial clade PTN000541519, and the
  Archaea-Eukaryota clade PTN000541322. All four PAINT rows are sound; there is no IRD. The
  practical caveat is subfamily-level grounding: SF15 is too broad to stand for GlxR. The
  PANTHER family name refers to the plant mitochondrial HIBADH-like proteins; human HIBADH
  itself is classified in PTHR22981, not in this family, so no human gene review can serve
  as reference protein here.
