    synthases (464 reviewed entries carry that name) but also containing animal HOGA1 and several bacterial
    sugar-acid aldolases and dehydratases. Despite its HOGA1-derived name, SF66 is the DapA subfamily
    for annotation purposes; activity terms must still be checked per clade.
