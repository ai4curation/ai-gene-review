- subfamily_id: PANTHER:PTHR12128:SF15
  label: 4-HYDROXY-TETRAHYDRODIPICOLINATE SYNTHASE 1, CHLOROPLASTIC
  description: Plant chloroplastic DapA paralog (Arabidopsis DHDPS1), placed outside SF66 although it
    performs the DapA reaction.
