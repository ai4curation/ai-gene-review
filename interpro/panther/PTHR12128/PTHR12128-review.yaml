family_id: PANTHER:PTHR12128
family_name: DIHYDRODIPICOLINATE SYNTHASE
preferred_name: Dihydrodipicolinate Synthase
summary: DIHYDRODIPICOLINATE SYNTHASE (PANTHER:PTHR12128) is characterized in PANTHER PAINT across 4 ancestral PTN
  node(s) (PANTHER:PTN000252718, PANTHER:PTN000252839, PANTHER:PTN000950946, PANTHER:PTN008533556) with 7 IBD node
  assertion(s) and 1 term(s) carrying negated IRD/IKR branch blocks, covering 4-hydroxy-tetrahydrodipicolinate synthase
  activity (GO:0008840, MF), cytosol (GO:0005829, CC), mitochondrion (GO:0005739, CC), (R,S)-4-hydroxy-2-oxoglutarate
  aldolase activity (GO:0008700, MF) and 3 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR12128 (DIHYDRODIPICOLINATE SYNTHASE) span 4 distinct ancestral
  PTN nodes (PANTHER:PTN000252718, PANTHER:PTN000252839, PANTHER:PTN000950946, PANTHER:PTN008533556) with different
  molecular function assignments across clades (4-hydroxy-tetrahydrodipicolinate synthase activity (GO:0008840),
  (R,S)-4-hydroxy-2-oxoglutarate aldolase activity (GO:0008700), N-acetylneuraminate lyase activity (GO:0008747)),
  indicating clade-level functional specialization across the family.
