notes: >-
  Selected by modules/glucarate_galactarate_catabolism.yaml for the KDGDH step
  (SF19). Counts are re-derived from PTHR12128-entries.csv (590 Swiss-Prot
  members: SF66 505, SF19 59, SF21 11, others 15) and the PANTHER 19 tree (268
  leaves). The DapA-activity scope is left UNRESOLVED; this is consistent with
  the NEEDS_PRUNING verdict on PTN000252718, and the KDGDH clade is outside its
  scope either way. The SF19 reference-tree leaf SCO1889 (S. coelicolor, named
  "Dihydropicolinate synthase") is a TrEMBL entry not in the Swiss-Prot table;
  its function is unassessed.
