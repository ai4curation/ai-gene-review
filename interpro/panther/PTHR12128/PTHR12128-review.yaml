term_assessments:
- assessed_term:
    id: GO:0047448
    label: 5-dehydro-4-deoxyglucarate dehydratase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    KDGDH activity is the SF19 activity. All 59 Swiss-Prot SF19 members are
    KDGDH proteins (HAMAP MF_00694), and A. baylyi ACIAD0130 is
    biochemically characterized. No other subfamily carries it.
  applicable_subfamilies:
  - id: PANTHER:PTHR12128:SF19
    label: 5-DEHYDRO-4-DEOXYGLUCARATE DEHYDRATASE 2-RELATED
  supported_by:
