notes: 'Written for the hydroxyproline-catabolism module and compatible with the templated draft in open
  PR #5077: the same reference protein (HOGA1), PAINT nodes and subfamily ids, with corrections. SF72
  is added for the PP_1257 deaminase, and SF19 is marked diverged. The DHDPS node is NEEDS_PRUNING because
  TreeGrafter still reaches KDGDH and deaminase lineages. The HOGA1-specific terms carry exceptions for
  the bacterial DapA members of SF66. Cytosol is UNRESOLVED rather than restricted to SF21/SF66, because
  SF66 mixes cytosolic bacterial and mitochondrial animal members. The Enterobacteriaceae IRD node is
  UNRESOLVED pending tree leaves. Merged with the lysine_biosynthesis review (2026-11-11): added the GO:0009085
  term assessment (DapA subfamilies, HOGA1 excepted), extended the GO:0008840 scope to the plant DapA
  subfamilies SF55 and SF57, linked the E. coli DapA gene review and added the E. coli DapA structural/NMR
  evidence. The reference protein (HOGA1) and all other assessments of this version are kept.'
