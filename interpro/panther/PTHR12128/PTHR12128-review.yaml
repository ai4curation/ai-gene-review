family_id: PANTHER:PTHR12128
family_name: DIHYDRODIPICOLINATE SYNTHASE
preferred_name: DapA-family class I (Schiff-base) aldolases and dehydratases
summary: >-
  The DapA (dihydrodipicolinate synthase) family of TIM-barrel enzymes that act
  through a lysine Schiff base on a pyruvate- or 2-oxoacid-derived substrate.
  The namesake activity, 4-hydroxy-tetrahydrodipicolinate synthase (DapA),
  condenses pyruvate with L-aspartate-4-semialdehyde in lysine and
  diaminopimelate biosynthesis. It is found in most bacteria and in plant
  chloroplasts and dominates the bacterial SF66 subfamily and the plant
  subfamilies. Several clades have evolved other activities. Animal
  mitochondrial 4-hydroxy-2-oxoglutarate aldolase (HOGA1) acts in
  hydroxyproline catabolism, and N-acetylneuraminate lyase (NPL, SF21) cleaves
  sialic acid. The bacterial 5-dehydro-4-deoxyglucarate dehydratases (KDGDH,
  SF19) decarboxylate and dehydrate the common aldarate intermediate in
  oxidative glucarate and galactarate catabolism. Other members include fungal
  L-threo-3-deoxy-hexulosonate aldolases (SF24), enterobacterial YagE/YjhH
  2-keto-3-deoxy-sugar acid aldolases (SF28), archaeal KDG/KDPG aldolases,
  2-dehydro-3-deoxy-L-arabinonate dehydratases and
  trans-o-hydroxybenzylidenepyruvate hydratase-aldolases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared chemistry is Schiff-base catalysis on 2-oxoacids, but the reaction
  differs by clade: DapA condensation (SF66 bacteria, plant SF15/SF55/SF57/SF71),
  HOGA retro-aldol cleavage (bilaterian HOGA1 in SF66), sialic acid cleavage
  (SF21), KDG dehydration-decarboxylation (SF19), and sugar-acid aldolases
  (SF24, SF28, archaeal SF66 members). SF66 itself is mixed.
