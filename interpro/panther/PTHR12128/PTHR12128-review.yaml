    supporting_text: Q6FFQ1,Probable 5-dehydro-4-deoxyglucarate dehydratase
- assessed_term:
    id: GO:0042838
    label: D-glucarate catabolic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Follows the KDGDH activity: the substrate, 5-dehydro-4-deoxy-D-glucarate,
    is the product of glucarate dehydratase, so SF19 enzymes act in
    D-glucarate catabolism.
  applicable_subfamilies:
  - id: PANTHER:PTHR12128:SF19
    label: 5-DEHYDRO-4-DEOXYGLUCARATE DEHYDRATASE 2-RELATED
  supported_by:
  - reference_id: file:genes/ACIAD/ACIAD0130/ACIAD0130-ai-review.yaml
    supporting_text: KDGDH performs step 2 of ADP1 D-glucarate degradation.
- assessed_term:
    id: GO:0046392
    label: D-galactarate catabolic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Galactarate dehydratase (GarD) yields the same 5-dehydro-4-deoxy-D-glucarate
    intermediate, so in organisms that also encode GarD the SF19 enzyme performs
    the shared second step. Whether a given genome carries GarD is decided per
    gene, not by family membership.
  applicable_subfamilies:
  - id: PANTHER:PTHR12128:SF19
    label: 5-DEHYDRO-4-DEOXYGLUCARATE DEHYDRATASE 2-RELATED
  supported_by:
  - reference_id: file:genes/PSEPK/PP_3599/PP_3599-ai-review.yaml
    supporting_text: PP_3599 is the shared reaction after D-galactarate entry.
- assessed_term:
    id: GO:0008840
    label: 4-hydroxy-tetrahydrodipicolinate synthase activity
  scope: UNRESOLVED
  scope_reason: >-
    DapA activity is the majority function of SF66 and the plant subfamilies,
    but SF66 is mixed (HOGA1, archaeal KDG/KDPG aldolases and DapA-like lyases,
    2-dehydro-3-deoxy-L-arabinonate dehydratases, hydratase-aldolases), and it
    is excluded from SF19 KDGDH, SF21 NPL and SF28 YagE/YjhH. A subfamily-level
    scope cannot be stated without enumerating SF66 exceptions. Deciding it
    needs node-level pruning of SF66 (IRDs for the archaeal and non-DapA
    bacterial clades) and assay data for the uncharacterized archaeal DapA-like
    lyases.
  supported_by:
  - reference_id: file:interpro/panther/PTHR12128/PTHR12128-entries.csv
    supporting_text: Q86XE5,"4-hydroxy-2-oxoglutarate aldolase, mitochondrial"
  - reference_id: file:genes/ACIAD/ACIAD0130/ACIAD0130-ai-review.yaml
    supporting_text: TreeGrafter DapA activity is wrong for this KDGDH-subfamily member.
