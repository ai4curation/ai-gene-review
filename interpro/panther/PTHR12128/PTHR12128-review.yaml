family_id: PANTHER:PTHR12128
family_name: DIHYDRODIPICOLINATE SYNTHASE
preferred_name: DapA/NAL class I (Schiff-base) aldolase family
summary: 'A large family of TIM-barrel class I aldolases and dehydratases that share a Schiff-base lysine
  mechanism with a pyruvate (or 2-oxo acid) substrate. The family consensus, and the great majority of
  reviewed members, are DapA 4-hydroxy-tetrahydrodipicolinate synthases (EC 4.3.3.7) that condense pyruvate
  with L-aspartate 4-semialdehyde in the first committed step of diaminopimelate/lysine biosynthesis in
  bacteria and plants. The same fold has been recruited many times for other aldol and dehydration chemistry:
  N-acetylneuraminate lyases (NanA/NPL), 5-dehydro-4-deoxyglucarate dehydratases, 2-dehydro-3-deoxygluconate
  aldolases, trans-O-hydroxybenzylidenepyruvate hydratase-aldolases and the animal mitochondrial 4-hydroxy-2-oxoglutarate
  aldolase HOGA1. PANTHER subfamily names are misleading here: bacterial DapA enzymes, including E. coli
  DapA, sit in SF66, which is named after HOGA1, while several plant chloroplastic DapA paralogs sit in
  separate small subfamilies.'
functional_coherence: HETEROGENEOUS
coherence_reason: 'All members share the class I aldolase fold and Schiff-base chemistry, but substrate
  specificity and pathway differ between clades (lysine biosynthesis, sialic acid catabolism, glucarate
  and gluconate catabolism, hydroxyproline catabolism). Subfamily SF66 itself is mixed: it holds the bacterial
  DapA consensus together with animal HOGA1, which PAINT correctly cuts off from the DapA activity with
  an IRD.'
