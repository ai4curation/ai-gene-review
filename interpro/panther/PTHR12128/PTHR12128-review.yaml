- subfamily_id: PANTHER:PTHR12128:SF66
  label: 4-HYDROXY-2-OXOGLUTARATE ALDOLASE, MITOCHONDRIAL
  description: The largest subfamily. It holds the canonical bacterial DHDPS (E. coli and M. tuberculosis
    DapA, both KT2440 DapA paralogs) together with the bilaterian mitochondrial HOGA1 aldolases. The subfamily
    label reflects HOGA1 only.
  diverged_from_family: true
  divergence_description: HOGA1 and its bilaterian orthologs cleave 4-hydroxy-2-oxoglutarate to glyoxylate
    and pyruvate in the mitochondrion and do not synthesize dihydrodipicolinate. PAINT records this as
    an IRD on DHDPS activity at PTN000950946. Bacterial SF66 members keep DHDPS activity.
