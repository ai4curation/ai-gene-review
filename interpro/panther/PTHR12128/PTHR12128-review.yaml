family_id: PANTHER:PTHR12128
family_name: DIHYDRODIPICOLINATE SYNTHASE
preferred_name: DapA/NanA (dihydrodipicolinate synthase / N-acetylneuraminate lyase) superfamily
summary: Class I (Schiff-base) TIM-barrel enzymes that act on pyruvate-related alpha-keto acids. The family
  holds 4-hydroxy-tetrahydrodipicolinate synthases (DapA, lysine biosynthesis), the animal mitochondrial
  4-hydroxy-2-oxoglutarate aldolase HOGA1 (hydroxyproline catabolism to glyoxylate and pyruvate), N-acetylneuraminate
  lyases (NPL), 2-dehydro-3-deoxy sugar acid aldolases (YagE/YjhH), 5-dehydro-4-deoxyglucarate dehydratases
  (KDGDH, aldarate catabolism), and the bacterial Delta1-pyrroline-4-hydroxy-2-carboxylate deaminase of
  trans-4-hydroxy-L-proline catabolism (Pseudomonas putida PP_1257). The fold and the active-site lysine
  are shared, but the substrates and reaction classes differ between lineages. The deaminase is a hydrolase,
  not a lyase.
functional_coherence: HETEROGENEOUS
coherence_reason: Subfamilies differ in reaction class (lyase, aldolase, dehydratase, hydrolytic deaminase)
  and substrate, and the largest subfamily, SF66, itself mixes bacterial and plant-type DHDPS with the
  bilaterian HOGA1 aldolases. PAINT places DHDPS activity at PTN000252718 and blocks it (IRD) at the bilaterian
  HOGA1 node. Curated TreeGrafter grafting nevertheless transfers it to non-DHDPS members such as the
  KDGDH PP_3599 and the hydroxyproline-pathway deaminase PP_1257.
