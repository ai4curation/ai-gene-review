    The DapA activity is placed at a LUCA-level node covering 230 of 268
    reference-tree leaves. PAINT already blocks it with IRDs for bilaterian
    HOGA1 (PTN000950946) and enterobacterial YagE/YjhH (PTN001740926). It
    still reaches the KDGDH clade (SF19, six leaves under PTN000252820:
