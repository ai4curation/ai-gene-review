family_id: PANTHER:PTHR38098
family_name: LPS-ASSEMBLY LIPOPROTEIN LPTE
preferred_name: LptE outer-membrane LPS-assembly lipoprotein family
summary: >-
  LptE proteins are outer-membrane lipoproteins that form a 1:1 complex with the beta-barrel
  protein LptD, the outer-membrane translocon of the lipopolysaccharide transport (Lpt)
  system. LptE sits as a plug inside the LptD barrel, is needed for LptD to fold and
  assemble, binds LPS, and helps disaggregate LPS during its insertion into the outer leaflet
  of the outer membrane. LptE is essential in Escherichia coli. The family consists of a
  single PANTHER subfamily confined in the reference tree to Proteobacteria.
functional_coherence: COHERENT
coherence_reason: >-
  One subfamily (SF1); all reference-tree members descend from PTN002866256 and are LptD
  partner lipoproteins.
