term_assessments:
- assessed_term:
    id: GO:1990351
    label: transporter complex
  scope: FAMILY_WIDE
  scope_reason: >-
    True for every member, as the plug lipoprotein of the LptD/LptE translocon; member reviews refine it to GO:0062051
    rather than reject it.
- assessed_term:
    id: GO:0062051
    label: lipopolysaccharide transport system
  scope: FAMILY_WIDE
  scope_reason: >-
    The LptD/LptE translocon is the outer-membrane part of the seven-protein Lpt
    machine; the E. coli and P. putida member reviews carry this term as their core
    complex.
  supported_by:
  - reference_id: PMID:29449493
    supporting_text: Thus, all seven Lpt proteins and ATP are necessary and sufficient
      for membrane-to-membrane transport to occur.
- assessed_term:
    id: GO:0015920
    label: lipopolysaccharide transport
  scope: FAMILY_WIDE
  scope_reason: >-
    Every LptE is the LptD plug lipoprotein of the LPS translocon; PAINT places the term at
    a gammaproteobacterial node, which is narrower than the family but not contradicted by it.
- assessed_term:
    id: GO:0009279
    label: cell outer membrane
  scope: FAMILY_WIDE
  scope_reason: Outer-membrane lipoprotein in all characterized members.
- assessed_term:
    id: GO:0001530
    label: lipopolysaccharide binding
  scope: FAMILY_WIDE
  scope_reason: >-
    LPS binding is shown directly for E. coli LptE and underlies its role in disaggregating
    LPS at the translocon. PAINT places the term at the gammaproteobacterial node; the
    family is a single subfamily of LptD plug lipoproteins and no member is known to lack
    the activity, so the scope is not narrowed.
  supported_by:
  - reference_id: PMID:24938785
    supporting_text: Therefore, LptE binds to and solubilizes LPS adhered to a CM3 chip.
