family_id: PANTHER:PTHR38098
family_name: LPS-ASSEMBLY LIPOPROTEIN LPTE
preferred_name: LptE outer-membrane LPS-assembly lipoprotein family
summary: LptE-family outer-membrane lipoproteins associate with LptD and support terminal envelope-complex
  assembly. In E. coli, LptE occupies the barrel lumen and directly binds/remodels LPS during transport;
  it also promotes LptD biogenesis. Native meningococcal LptE stabilizes LptD, but surface-accessible
  LPS persists without LptE under tested conditions. This positive assembly role is distinct from an obligatory
  transport contribution and does not establish absence of every LPS interaction outside Gammaproteobacteria.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The single SF1 combines LptD partners with differing demonstrated transport requirements.
  Q9K0A7 Neisseria lies under the family root but outside the gamma binding/transport node; exact H44/76
  evidence supports assembly/stability. The cached gamma branch also contains a Ricinus-labeled leaf of
  unresolved provenance, so it is not a literal all-gammaproteobacterial inventory. A family-wide LPS-binding/transport
  grant cannot follow from absence of a known negative assay.
