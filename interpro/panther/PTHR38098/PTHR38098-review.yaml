term_assessments:
- assessed_term:
    id: GO:1990351
    label: transporter complex
  scope: FAMILY_WIDE
  scope_reason: Conserved LptD-associated complex membership is supported in E. coli and Neisseria, independently
    of whether LptE is obligatory for transport. This broad structural inference does not establish autonomous
    transport or identical activity in every partner context.
- assessed_term:
    id: GO:0062051
    label: lipopolysaccharide transport system
  scope: FAMILY_WIDE
  scope_reason: LptE participates in the terminal Lpt assembly in characterized LPS-bearing bacteria,
    including the Neisseria LptD-stability role. Membership in the system is distinct from being essential
    to every transport event. No universal seven-essential-component claim is made, and a family hit alone
    does not establish a complete native system.
  supported_by:
  - reference_id: PMID:29449493
    supporting_text: Thus, all seven Lpt proteins and ATP are necessary and sufficient for membrane-to-membrane
      transport to occur.
  - reference_id: file:analysis/module_audits/bacterial_lps_transport/neisseria-consultation/primary-evidence.md
    supporting_text: Affinity purification using Ni 2+ -NTA beads on membrane extracts resulted in co-purification
      of LptD with LptE
- assessed_term:
    id: GO:0015920
    label: lipopolysaccharide transport
  scope: UNRESOLVED
  scope_reason: The positive PAINT binding/transport node PTN002211326 excludes Neisseria Q9K0A7, whereas
    SF1 spans the full family. Direct E. coli binding/remodeling and transport evidence support the gamma
    module cohort. Native H44/76 LptE instead supports LptD abundance/assembly while surface-accessible
    LPS remains after deletion. That result neither proves absence of binding nor excludes every transport
    contribution, but it does not justify a universal family grant. No existing subfamily separates these
    roles; keep family scope unresolved and use source-qualified members in the module.
  supported_by:
  - reference_id: file:analysis/module_audits/bacterial_lps_transport/neisseria-consultation/primary-evidence.md
    supporting_text: Only the LPS of the wild type and of the Δ lptE mutant was surface-accessible
