notes: 'The frozen reference tree has 11 SF1 leaves: PTN002211326 covers10 and excludes Q9K0A7; PTN002211333
  covers the three enterobacterial leaves. B9TI40 has a Ricinus label inside the broader gamma branch;
  its origin is unresolved, not assumed contamination. All original node judgments/payloads are retained.
  Family-wide binding/transport scope is separately unresolved. The exact natural H44/76 LptE sequence
  matches MC58 Q9K0A7; native deletion/complementation phenotypes remain H44/76/HB-1 observations. Positive
  assembly does not manufacture an autonomous foldase MF or a NOT binding/transport assertion.'
