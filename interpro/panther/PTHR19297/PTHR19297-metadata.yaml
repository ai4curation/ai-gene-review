  name:
    name: Mucin-type O-glycan biosynthesis glycosyltransferase
    short: Mucin-type_O-glycan_GT
  description:
  - text: This family of proteins includes glycosyltransferases involved in the biosynthesis
      of mucin-type O-glycans, which are critical for the formation of mucin's protective
      and structural functions in various tissues. Members of this family catalyze
      the transfer of N-acetylglucosamine (GlcNAc) in a beta-1,6 linkage to mucin
      core structures, facilitating the branching of these glycan chains. This branching
      is essential for the synthesis of complex and diverse glycan structures on mucins.
      Some members also have I-branching enzyme activity, which contributes to the
      introduction of blood group I antigen during embryonic development. The enzymes
      are involved in various biological processes, including cell signaling, development,
      and the immune response, by modifying glycoproteins and glycolipids with branched
      glycan structures.
