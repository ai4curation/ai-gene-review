preferred_name: Aggrecan/Versican Proteoglycan
summary: AGGRECAN/VERSICAN PROTEOGLYCAN (PANTHER:PTHR22804) is characterized in PANTHER PAINT across 2
  ancestral PTN node(s) (PANTHER:PTN000515588, PANTHER:PTN008374273) with 4 IBD node assertion(s) and
  1 term(s) carrying negated IRD/IKR branch blocks, covering skeletal system development (GO:0001501,
  BP), central nervous system development (GO:0007417, BP), synapse (GO:0045202, CC), perineuronal net
  (GO:0072534, CC).
