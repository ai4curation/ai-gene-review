  conserved across the primary ancestral clade, with lineage-specific variation reflected by IBD assertions
  distributed across 2 PTN nodes (PANTHER:PTN000515588, PANTHER:PTN008374273); negated IRD/IKR loss assertion(s)
  on GO:0005886.
