  name:
    name: Hyaluronan-binding Proteoglycan
    short: Hyaluronan_bind_Proteoglycan
  description:
  - text: The protein family is involved in the structural organization and stabilization
      of the extracellular matrix in various tissues, including cartilage and the
      central nervous system. Members of the family bind to hyaluronic acid, contributing
      to the formation of proteoglycan aggregates that resist compression in cartilage
      and facilitate neuronal conduction. Some family members modulate cell adhesion,
      motility, growth, and differentiation, and may also play roles in the formation
      of perineuronal nets and in the transmission of inhibitory synapses in the brain.
