family_id: PANTHER:PTHR22594
family_name: ASPARTYL/LYSYL-TRNA SYNTHETASE
preferred_name: Aspartyl/asparaginyl tRNA synthetase-related proteins
summary: This group joins related class-II aminoacyl-tRNA synthetases with aspartate or asparagine specificity.
  Human mitochondrial DARS2 directly catalyzes aspartylation of tRNA and is distinct from the cytosolic
  translation machinery. Similar catalytic architecture does not establish the same amino acid, tRNA substrate
  or cellular compartment for every member.
functional_coherence: HETEROGENEOUS
coherence_reason: The official family definition explicitly spans Asp/Asn ligases, while biochemical characterization
  establishes DARS2 as mitochondrial AspRS. A DARS2 annotation should be scoped to the mitochondrial AspRS
  lineage rather than transferred across the amino-acid specificity boundary. DARS2 can also be assayed
  for misacylation of tRNA-Asn; that is a separate substrate question and does not make it an asparagine-activating
  enzyme.
