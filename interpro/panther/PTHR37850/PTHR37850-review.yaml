family_id: PANTHER:PTHR37850
family_name: STRU PROTEIN
preferred_name: DRL / StrU-like NAD(P)-binding oxidoreductase family
summary: >-
  A family of uncharacterized NAD(P)-binding oxidoreductases related to homoserine dehydrogenase and
  usually carrying a C-terminal SAF domain. Its one biochemically characterized member is the
  DXR-like enzyme DRL of Brucella abortus (BAB2_0264), which catalyses the same NADPH-dependent
  conversion of 1-deoxy-D-xylulose 5-phosphate (DXP) to 2-C-methyl-D-erythritol 4-phosphate (MEP) as
  the unrelated canonical DXR, replacing it in bacteria that lack DXR. The family is named after StrU,
  and its members are scattered across bacteria, a few archaea and fungi; DRL-like sequences also
  occur in organisms that have no MEP pathway, so the DXR-like activity cannot be assumed for the
  family as a whole.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  DXR-like activity is demonstrated only for Brucella DRL and for complementing homologues in one
  clade of the original phylogeny. Several homologues failed to complement a DXR-deficient E. coli
  strain, and some come from organisms without the MEP pathway. PANTHER splits the family into three
  subfamilies (SF1 and SF2, "SAF DOMAIN PROTEIN"; SF3, "BLR7815 PROTEIN"), none of which is named for
  the DXR reaction.
