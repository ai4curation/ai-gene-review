- assessed_term:
    id: GO:0030604
    label: 1-deoxy-D-xylulose-5-phosphate reductoisomerase activity
  scope: UNRESOLVED
  scope_reason: >-
    Demonstrated in vitro for Brucella DRL and by complementation for some homologues, but other
    homologues failed to complement and DRL-like sequences occur in organisms without the MEP pathway.
    No PANTHER subfamily boundary is known to match the active clade, so the term is not extended
    beyond experimentally supported members.
  supported_by:
  - reference_id: PMID:20660776
    supporting_text: >-
      Samples containing either DRL or DXR were found to produce MEP from DXP in a similar fashion
  - reference_id: PMID:20660776
    supporting_text: >-
      failed to rescue the loss of DXR activity in E. coli cells
  - reference_id: PMID:20660776
    supporting_text: >-
      A third class (C) was formed by bacteria with DRL but no MEP pathway enzymes.
