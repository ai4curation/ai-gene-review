family_id: PANTHER:PTHR11550
family_name: CTP SYNTHASE
preferred_name: CTP synthase family (PyrG/CTPS/URA7)
summary: >-
  CTP synthases aminate UTP to CTP, using glutamine (or ammonia) and ATP. This is the only de novo
  route to CTP. The enzyme has an N-terminal amidoligase domain and a C-terminal class I
  glutamine amidotransferase domain. It is regulated by assembly from dimers into tetramers, by
  GTP activation and by CTP feedback inhibition. In many eukaryotes and bacteria it also
  polymerizes into filaments (cytoophidia). Bacteria (PyrG), fungi (S. cerevisiae URA7 and URA8,
  S. pombe ura7/cts1), plants and animals (CTPS1, CTPS2) all have members. In S. cerevisiae URA7
  is the major isozyme, and loss of both URA7 and URA8 is lethal.
functional_coherence: COHERENT
coherence_reason: >-
  Every reviewed member is a full-length CTP synthase. The 694 reviewed entries are 524 to 644
  residues long, apart from one 99-residue Mycoplasma fragment (Q93DW6). PANTHER splits off the
  vertebrate CTPS1 (SF8) and CTPS2 (SF2) and several plant paralog groups. Those are paralog
  splits and not functional divergence. Bacterial, fungal and other eukaryotic members share the
  catch-all SF0 (CTP SYNTHASE-RELATED).
