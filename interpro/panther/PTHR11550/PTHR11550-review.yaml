notes: >-
  Modules using this family: de_novo_pyrimidine_synthesis (ctp_synthase_activity, base family
  PTHR11550, GO:0003883, location cytosol). It is consistent with PAINT and with the URA7, URA8
  and S. pombe ura7 gene reviews. The only disputed PAINT assertion is GO:0019856 at
  PTN000167473, which all three fungal reviews MODIFY. The S. pombe ura7 review proposes
  GO:0006221 as the replacement, whereas the URA7 and URA8 reviews propose GO:0044210; the more
  specific GO:0044210 fits better. The S. pombe ura7 review also lists identical protein binding
  (GO:0042802) as a core molecular function, which conflicts with the repo guidance against
  protein-binding terms as core functions. Arabidopsis CTP synthases fall in several small
  paralog subfamilies (SF28, SF31, SF34, SF40) that were not assessed individually. The P.
  putida pyrG DRAFT review marks GO:0006241 as over-annotated only because it keeps the more
  specific GO:0044210, which is redundancy rather than disagreement.
