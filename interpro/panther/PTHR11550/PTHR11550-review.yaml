node_assessments:
- node_id: PANTHER:PTN000167473
  asserted_term:
    id: GO:0019856
    label: pyrimidine nucleobase biosynthetic process
  paint_snapshot: '20180918'
  seeds:
  - id: SGD:S000000135
    label: URA7
    organism: Saccharomyces cerevisiae
  assessment: WRONG_NODE
  assessment_reason: >-
    The problem is the term, not the depth of the node. The single seed is the S. cerevisiae URA7
    IMP annotation from the URA7 cloning paper. CTP synthase converts one nucleotide (UTP) into
    another (CTP) and makes no pyrimidine nucleobase, so the nucleobase process term
    misdescribes the activity for every member. The URA7, URA8 and S. pombe ura7 gene reviews
    all propose MODIFY to a nucleotide-level term. The same node already carries CTP biosynthetic
    process (GO:0006241), which is correct, so withdrawing this IBD loses no information.
  supported_by:
  - reference_id: file:genes/yeast/URA7/URA7-ai-review.yaml
    supporting_text: Nucleobase term misdescribes a nucleotide-to-nucleotide conversion; use de novo
      CTP biosynthesis.
  - reference_id: PMID:8121398
    supporting_text: In the pyrimidine biosynthetic pathway, CTP synthetase catalyses the conversion
      of uridine 5'-triphosphate (UTP) to cytidine 5'-triphosphate (CTP).
