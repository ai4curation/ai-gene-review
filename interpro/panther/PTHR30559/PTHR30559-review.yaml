family_id: PANTHER:PTHR30559
family_name: FRUCTOSE-BISPHOSPHATE ALDOLASE CLASS 2
preferred_name: Class II (zinc-dependent) fructose-bisphosphate aldolases of fungi and bacteria
summary: >-
  Class II fructose-bisphosphate aldolases are divalent-metal (Zn2+) dependent enzymes that reversibly
  cleave D-fructose 1,6-bisphosphate into dihydroxyacetone phosphate and D-glyceraldehyde 3-phosphate.
  The family is the fungal and bacterial aldolase lineage: S. cerevisiae Fba1, S. pombe fba1, E. coli
  FbaA and M. tuberculosis Fba are members. The class II enzymes share no ancestry and no mechanism with
  the Schiff-base class I aldolases of animals and plants (PTHR11627), although both catalyse the same
  reaction and carry the same GO molecular function term. PANTHER defines a single subfamily (SF0).
functional_coherence: COHERENT
coherence_reason: >-
  Every Swiss-Prot member in the PANTHER inventory (28 entries) is named as a fructose-bisphosphate
  aldolase, and the family has a single subfamily. The yeast members carry direct genetic and
  biochemical evidence: FBA1 disruptants lack aldolase activity, and the S. pombe enzyme is the sole,
  essential aldolase. No member has been shown to have lost the activity or to have changed substrate.
  Related class II aldolases with other substrates (for example tagatose-bisphosphate aldolases) are
  not in this PANTHER family's Swiss-Prot inventory.
