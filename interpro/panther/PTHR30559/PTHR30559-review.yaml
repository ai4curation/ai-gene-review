    id: GO:0004332
    label: fructose-bisphosphate aldolase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The modules (emp_glycolysis aldolase_activity, gluconeogenesis gng_aldolase_activity) assert this
    activity for PTHR30559 together with the class I family PTHR11627. Aldolase activity is the defining
