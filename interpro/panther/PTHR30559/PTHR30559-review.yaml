- assessed_term:
    id: GO:0008270
    label: zinc ion binding
  scope: FAMILY_WIDE
  scope_reason: >-
    Zinc is the catalytic cofactor of the class II aldolase mechanism, so the binding is a property of
    the whole family rather than of a lineage. It is a cofactor term, subsidiary to the aldolase activity;
    the S. cerevisiae review accepts it and the S. pombe review keeps it as non-core.
  supported_by:
  - reference_id: file:genes/SCHPO/fba1/fba1-ai-review.yaml
    supporting_text: IBA zinc ion binding; class II aldolases bind a catalytic and a structural Zn2+ per subunit.
  - reference_id: file:interpro/panther/PTHR30559/PTHR30559-paint.tsv
    supporting_text: "PTHR30559\tPTN001254576\tGO:0008270\tF\tIBD\tfalse\tUniProtKB:P0AB71"
- assessed_term:
    id: GO:0006096
    label: glycolytic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Aldolase cleavage of fructose 1,6-bisphosphate is a glycolytic step wherever the enzyme is the
    cell's aldolase, and the class II enzymes are the glycolytic aldolase of fungi and of the bacteria
    that carry them. The term is asserted at both the root node PTN001254576 and the actinobacterial node
    PTN002412655.
  supported_by:
  - reference_id: file:genes/SCHPO/fba1/fba1-ai-review.yaml
    supporting_text: 'Fba1 is the sole, essential class II (Zn2+-dependent) fructose-bisphosphate aldolase of'
  - reference_id: file:interpro/panther/PTHR30559/PTHR30559-paint.tsv
    supporting_text: "PTHR30559\tPTN001254576\tGO:0006096\tP\tIBD\tfalse\tPomBase:SPBC19C2.07|SGD:S000001543|UniProtKB:P0AB71"
- assessed_term:
    id: GO:0006094
    label: gluconeogenesis
  scope: FAMILY_WIDE
  scope_reason: >-
    The aldolase reaction is freely reversible and a sole aldolase must run in the condensing direction
    when cells grow on gluconeogenic carbon. The yeast FBA1 disruptant fails to grow on substrates from
    either side of the reaction, which is the genetic basis for the gluconeogenesis seed. Applies to
    members that are the organism's aldolase; bacteria that carry a second, class I aldolase may divide
    the directions between paralogs, but that has not been documented for any member here.
  supported_by:
  - reference_id: PMID:2647491
    supporting_text: fail to grow in media containing as a carbon source metabolites of only one side of
      the aldolase reaction
  - reference_id: file:interpro/panther/PTHR30559/PTHR30559-paint.tsv
    supporting_text: "PTHR30559\tPTN001254576\tGO:0006094\tP\tIBD\tfalse\tSGD:S000001543"
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: FAMILY_WIDE
  scope_reason: >-
    The class II aldolases are soluble enzymes without targeting signals. The cytosol IBD sits on node
    PTN007827492, seeded by yeast Fba1 and E. coli FbaA, and both yeast gene reviews accept it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30559/PTHR30559-paint.tsv
    supporting_text: "PTHR30559\tPTN007827492\tGO:0005829\tC\tIBD\tfalse\tSGD:S000001543|UniProtKB:P0AB71"
  - reference_id: file:genes/yeast/FBA1/FBA1-ai-review.yaml
    supporting_text: IBA is_active_in cytosol (PTN007827492); correct.
