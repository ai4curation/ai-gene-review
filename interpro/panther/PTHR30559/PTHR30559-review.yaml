notes: >-
  Used by modules emp_glycolysis (aldolase_activity) and gluconeogenesis (gng_aldolase_activity), in
  both cases paired with the class I family PTHR11627 under the same activity term. The PAINT nodes are
  PTN001254576 (activity, zinc binding, glycolysis, gluconeogenesis), PTN002412655 (an actinobacterial
  node that repeats activity, zinc binding and glycolysis with the M. tuberculosis seed) and PTN007827492
  (cytosol). The paint file records taxon:2759 for PTN001254576 although E. coli FbaA is among its seeds
  and recipients; the taxon field was not used for any judgement here. No IRD or IKR rows exist for these
  nodes in .cache/panther/IBD.gaf. Both yeast gene reviews also carry the IMP/IGI rows to the now
  obsolete GO:0061621 (canonical glycolysis), which they modify to glycolysis; that is consistent with
  this review.
