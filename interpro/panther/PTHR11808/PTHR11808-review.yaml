- assessed_term:
    id: GO:0016765
    label: transferase activity, transferring alkyl or aryl (other than methyl) groups
  scope: UNRESOLVED
  scope_reason: >-
    The EC 2.5.1 transferase class covers the gamma-replacement enzymes (cystathionine gamma-synthase,
    SF75; O-succinylhomoserine sulfhydrylase, P. putida MetZ in SF80) but not the elimination enzymes
    (gamma-lyases, SF15; beta-lyases, SF50). SF80 itself mixes a sulfhydrylase (MetZ), a gamma-synthase
    (P. putida MetB) and methionine gamma-lyase-like members, so neither the family nor SF80 determines
    it; GO also lacks a term for the O-succinylhomoserine sulfhydrylase reaction.
  supported_by:
  - reference_id: file:genes/ECOLI/metB/metB-uniprot.txt
    supporting_text: >-
      Catalyzes the formation of L-cystathionine from O-succinyl-L-homoserine (OSHS) and L-cysteine,
      via a gamma-replacement reaction.
