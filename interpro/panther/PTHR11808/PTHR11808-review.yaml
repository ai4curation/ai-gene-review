family_id: PANTHER:PTHR11808
family_name: TRANS-SULFURATION ENZYME FAMILY MEMBER
preferred_name: Transsulfuration enzyme family (cystathionine gamma-lyase, beta-lyase and gamma-synthase)
summary: >-
  Fold-type I PLP enzymes of sulfur amino acid metabolism. Cystathionine gamma-lyase (S. cerevisiae
  CYS3, human CTH) cleaves cystathionine to cysteine in reverse transsulfuration. Cystathionine beta-lyase
  (S. cerevisiae STR3, S. pombe cbl1) releases homocysteine in forward transsulfuration. Cystathionine
  gamma-synthase (MetB) makes cystathionine from O-acylhomoserine and cysteine. Other members include
  O-succinylhomoserine sulfhydrylase (MetZ) and methionine gamma-lyase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The reaction differs by subfamily: gamma-elimination (CGL, SF15), beta-elimination (CBL, SF50)
  and gamma-replacement (CGS, SF75, SF90, SF35). SF80 is named for cystathionine gamma-lyase but
  holds P. putida MetB and MetZ.
