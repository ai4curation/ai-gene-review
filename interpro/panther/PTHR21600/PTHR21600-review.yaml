notes: Family and subfamily names are read from panther.obo; representative assignments are checked against
  the frozen UniProt PANTHER cross-references and available member inventory. Source provenance and sequence
  lengths are recorded in projects/PROTNLM_EVALUATION/family-curation/evidence-c/PTHR21600.md. Functional
  statements derived from ARBA and LLM-generated descriptions are not independent validation. No PAINT
  ancestral-node placement or residue-loss assertion is made without the corresponding phylogenetic or
  sequence analysis. S. cerevisiae RIB2/Pus8 (SF40) is a fused protein, whose N-terminal RluA-type domain is the cytoplasmic tRNA pseudouridine(32) synthase and its C-terminal domain is the riboflavin-pathway DRAP deaminase (PMID:15466869); the deaminase activity belongs to the fused domain, not to this family, and is not inherited by other members. Node assessments were added during riboflavin_biosynthesis module curation.
