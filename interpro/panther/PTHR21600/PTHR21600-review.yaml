family_id: PANTHER:PTHR21600
family_name: MITOCHONDRIAL RNA PSEUDOURIDINE SYNTHASE
preferred_name: RluA-related RNA pseudouridine synthases
summary: RluA-related enzymes isomerize uridine to pseudouridine in RNA, but family branches act on different
  rRNAs, tRNAs and other RNA substrates. The inventory includes RluC, RluD, TruC and organellar RNA-modification
  proteins. Fly RluA-1 and RluA-2 have experimentally demonstrated neuronal phenotypes without those phenotypes
  identifying their modified RNA nucleotide.
functional_coherence: HETEROGENEOUS
coherence_reason: RluA-like pseudouridine synthases share uridine-isomerization chemistry but differ in
  RNA class, modification site and compartment across RluC/RluD/TruC and RPUSD-related branches. Fly RluA-1
  and RluA-2 loss-of-function and rescue establish roles in nociceptive behavior (PMID:33028630), without
  identifying their modified RNA or nucleotide. The phenotype is therefore not evidence for an inherited
  bacterial rRNA site or a specific tRNA position. Exact substrate-site assignments remain branch-specific.
