family_id: PANTHER:PTHR32248
family_name: RNA POLYMERASE SIGMA-54 FACTOR
preferred_name: Sigma-54 (RpoN) RNA polymerase sigma factor family
summary: Bacterial sigma-54 (RpoN/NtrA) factors. Sigma-54 binds core RNA polymerase and recognises -24/-12
  promoters, forming a stable closed complex that cannot isomerise to an open complex without ATP-dependent
  remodelling by a bacterial enhancer-binding protein (PTHR32071). It is unrelated in sequence to the
  sigma-70 family.
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF4) of sigma-54 orthologs with conserved activator-interacting,
  core-binding and -24/-12 recognition regions.
