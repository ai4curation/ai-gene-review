family_id: PANTHER:PTHR34524
family_name: CALCYPHOSIN
summary: Calcyphosin and calcyphosin-like proteins are EF-hand proteins with a calcium-sensing architecture.
  Human calcyphosin binds calcium in four EF-hand motifs and is largely monomeric; the related CAPSL branch
  retains calcium-binding-associated sequence signatures. Their specific cellular partners and conserved
  physiological outputs are incompletely characterized.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Human calcyphosin (CAPS, Q13938; verified SF2) has a calcium-loaded crystal structure
  with two pairs of calcium-binding EF hands (PMID:18775726). CAPSL proteins in SF5 retain paired EF-hand
  and calcium-binding-site signatures, supporting calcium binding by homology. The exact calcium affinities,
  ligand partners and physiological regulatory mechanism of CAPSL are not established. Calcium binding
  is a credible shared property, but its unconditional grant across the classified sequences remains unresolved
  without resolving EF-hand integrity; calcium transport or a specific signaling pathway does not follow
  from it.
