family_id: PANTHER:PTHR23031
family_name: RHOPHILIN
preferred_name: Rhophilin Rho-associated cytoskeletal adaptors
summary: Rhophilin proteins bind Rho-family signaling proteins and organize downstream cytoskeletal interactions.
  Characterized vertebrate RHPN1 and RHPN2 connect Rho signaling to actin-associated structures. Their
  role as Rho effectors is distinct from GTP hydrolysis or nucleotide exchange catalyzed by other parts
  of the signaling system.
functional_coherence: COHERENT
coherence_reason: Rhophilins are Rho-associated interaction scaffolds with Bro1/PDZ-containing architecture.
  Direct comparison found both RHPN1 and RHPN2 binding GDP- and GTP-bound RhoA in vitro, whereas only
  RHPN2 produced the tested stress-fiber-loss phenotype (PMID:12221077). Thus exclusive binding to activated
  RhoA and uniform inhibition of actin assembly are not family-wide properties. The common scaffold mechanism
  is coherent, but the nucleotide-state preference, downstream partners and actin outcome of fly Rhp remain
  distinct questions.
