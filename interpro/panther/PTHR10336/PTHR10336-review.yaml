family_id: PANTHER:PTHR10336
family_name: PHOSPHOINOSITIDE-SPECIFIC PHOSPHOLIPASE C FAMILY PROTEIN
preferred_name: Phosphoinositide-specific phospholipase C (PI-PLC) family
summary: >-
  PI-PLCs hydrolyse phosphatidylinositol 4,5-bisphosphate to diacylglycerol and inositol 1,4,5-trisphosphate.
  The family contains the animal beta, gamma, delta, epsilon and zeta isozymes, which differ in regulatory
  domains and activators (G proteins, receptor tyrosine kinases, Ca2+, Ras), and the single fungal
  PLC (S. cerevisiae PLC1, S. pombe plc1).
functional_coherence: COHERENT
coherence_reason: >-
  All subfamilies are PIP2-hydrolysing PLCs. They differ in regulation and signaling context, not
  catalytic activity.
