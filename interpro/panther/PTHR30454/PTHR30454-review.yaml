node_assessments:
- node_id: PANTHER:PTN000765215
  asserted_term:
    id: GO:0046429
    label: 4-hydroxy-3-methylbut-2-en-1-yl diphosphate synthase activity (ferredoxin)
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: AGI_LocusCode:AT5G60600
  - id: UniProtKB:P62620
  assessment: NEEDS_PRUNING
  proposed_action:
    paint_action: ADD_IRD
    target_node_id: PANTHER:PTN000765227
  assessment_reason: >-
    The node is the family root (86 leaves) and the term names ferredoxin as the electron donor. It is
    right for the Arabidopsis seed, whose ferredoxin-coupled activity was measured, but the second
    seed, E. coli IspG, uses flavodoxin, and the separate flavodoxin term (GO:0141197) post-dates this
    2017 node. As placed, the ferredoxin activity descends to every flavodoxin-coupled bacterial IspG.
    The carrier split does not follow a PANTHER subfamily, so no subfamily is named; the affected
    members are listed as exceptions under the term assessment below. The proposed fix is an IRD at
    PTN000765227, the proteobacterial node (12 leaves) that contains the flavodoxin-coupled E. coli
    seed. The carriers of the other proteobacterial leaves are inferred from the E. coli case rather
    than measured, and flavodoxin-coupled lineages outside that node would need separate losses once
    their carrier is established.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30454/PTHR30454-paint.tsv
    supporting_text: "PTHR30454\tPTN000765215\tGO:0046429\tF\tIBD\tfalse"
  - reference_id: file:genes/ECOLI/ispG/ispG-uniprot.txt
