family_id: PANTHER:PTHR30454
family_name: 4-HYDROXY-3-METHYLBUT-2-EN-1-YL DIPHOSPHATE SYNTHASE
preferred_name: IspG/GcpE HMBPP synthase family
summary: >-
  IspG (GcpE, HDS) is the [4Fe-4S] enzyme that reductively converts 2-C-methyl-D-erythritol
  2,4-cyclodiphosphate (ME-CPP) into (E)-4-hydroxy-3-methylbut-2-enyl diphosphate (HMBPP), the sixth
  reaction of the methylerythritol phosphate (MEP) pathway. The two electrons come from a low-potential
  carrier that differs between lineages: many proteobacteria, including E. coli and P. putida, use
  flavodoxin (EC 1.17.7.3), whereas plastid enzymes of plants use ferredoxin (EC 1.17.7.1). The plant
  enzyme is also about twice as long (741 residues for Arabidopsis ISPG against 372 for E. coli IspG). All members fall in one PANTHER subfamily (SF0),
  so the electron-carrier split is not visible in the subfamily classification.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member catalyses the ME-CPP to HMBPP conversion, but the physiological electron donor
  (flavodoxin or ferredoxin) varies within SF0, so GO terms that encode the donor cannot be placed on
  the whole family.
