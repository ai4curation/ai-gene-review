term_assessments:
- assessed_term:
    id: GO:0046429
    label: 4-hydroxy-3-methylbut-2-en-1-yl diphosphate synthase activity (ferredoxin)
  scope: FAMILY_WIDE
  scope_reason: >-
    PAINT places the ferredoxin-coupled activity on the whole family, and PANTHER has a single
    subfamily, so the term is in scope for every member. It holds for ferredoxin-coupled enzymes such
    as the plant plastid IspG, and the flavodoxin-coupled bacterial enzymes are recorded as exceptions.
  member_exceptions:
  - member:
      id: UniProtKB:P62620
      gene_symbol: ispG
      organism: Escherichia coli K-12
      gene_review: genes/ECOLI/ispG/ispG-ai-review.yaml
    exception_reason: >-
      E. coli IspG uses flavodoxin as its electron donor; its activity is GO:0141197.
    pruned_node_id: PANTHER:PTN000765215
    supported_by:
    - reference_id: file:genes/ECOLI/ispG/ispG-uniprot.txt
      supporting_text: "flavodoxin as the reducing agent."
  - member:
      id: UniProtKB:Q88PJ7
      gene_symbol: ispG
      organism: Pseudomonas putida KT2440
      gene_review: genes/PSEPK/ispG/ispG-ai-review.yaml
    exception_reason: >-
      UniProt assigns the P. putida enzyme the flavodoxin reaction (Rhea 43604), like its E. coli
      ortholog.
    pruned_node_id: PANTHER:PTN000765215
    supported_by:
    - reference_id: file:genes/PSEPK/ispG/ispG-uniprot.txt
      supporting_text: "Rhea:RHEA:43604"
  supported_by:
  - reference_id: file:interpro/panther/PTHR30454/PTHR30454-paint.tsv
    supporting_text: "PTHR30454\tPTN000765215\tGO:0046429\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0141197
    label: 4-hydroxy-3-methylbut-2-enyl-diphosphate synthase activity (flavodoxin)
  scope: FAMILY_WIDE
  scope_reason: >-
    No PAINT node carries the flavodoxin-coupled activity, and the single PANTHER subfamily does not
    separate electron carriers. The term holds for the flavodoxin-coupled bacterial enzymes, including
    the E. coli reference protein, whose flavodoxin requirement was shown directly, and P. putida IspG.
    The ferredoxin-coupled plant plastid enzyme is recorded as an exception, mirroring the exceptions
    to GO:0046429 above.
  member_exceptions:
  - member:
      id: UniProtKB:F4K0E8
      gene_symbol: ISPG
      organism: Arabidopsis thaliana
      gene_review: genes/ARATH/ISPG/ISPG-ai-review.yaml
    exception_reason: >-
      The Arabidopsis plastid enzyme is ferredoxin-coupled (Rhea 26119, EC 1.17.7.1), so its activity
