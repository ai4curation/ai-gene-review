- node_id: PANTHER:PTN000778007
  asserted_term:
    id: GO:0004520
    label: DNA endonuclease activity
  evidence: IBD
  paint_snapshot: '20260506'
  seeds:
  - id: UniProtKB:P76213
  assessment: SOUND
  assessment_reason: >-
    The node is the common ancestor of UvrC (SF1) and Cho (SF10); E. coli UvrC (P0A8G0) and Cho
    (P76213) both receive IBA rows from it. Both groups are experimentally established DNA
    endonucleases (UvrC for 3' and 5' incision, Cho for 3' incision), so the generic
    endonuclease term is safe for every characterized descendant. The single seed is Cho; E. coli
    UvrC independently satisfies the term (both incision catalytic sites mapped by mutagenesis).
  supported_by:
  - reference_id: file:interpro/panther/PTHR30562/PTHR30562-paint.tsv
    supporting_text: "PTHR30562\tPTN000778007\tGO:0004520\tF\tIBD\tfalse\tUniProtKB:P76213"
  - reference_id: PMID:11818552
    supporting_text: In this paper we show that this protein, which we refer to as Cho (UvrC homologue),
      can incise the DNA at the 3' side of a lesion during nucleotide excision repair.
  - reference_id: PMID:10671556
    supporting_text: Here we show that the catalytic site for incision on the 3' side is in this protein
      as well, because substitution R42A abolishes 3' incision, whereas formation of the UvrBC-DNA complex
      and the 5' incision reaction are unaffected.
  - reference_id: PMID:1387639
    supporting_text: Enzyme reconstituted with these mutant proteins carried out normal 3' incision but
      was completely defective in 5' incision activity.
