      name: EXCINUCLEASE CHO'
  - reference_id: PMID:11818552
    supporting_text: The genome of E. coli contains an SOS-inducible gene (ydjQ) encoding a protein that
      is homologous to the N-terminal half of UvrC.
  - reference_id: PMID:11818552
    supporting_text: Remaining damages, that for structural reasons obstruct the 3' incision by UvrC, will
      be repaired by the combined action of Cho (for 3' incision) and UvrC (for 5' incision).
