family_id: PANTHER:PTHR30562
family_name: UVRC/OXIDOREDUCTASE
preferred_name: UvrC excinuclease and Cho family
summary: >-
  A bacterial family of GIY-YIG nucleases that make the incisions of nucleotide excision
  repair. Its main members are UvrC (UvrABC system protein C), the catalytic subunit of the
  UvrABC excinuclease: recruited by lesion-bound UvrB, UvrC cuts the damaged strand on the 3'
  side with its N-terminal GIY-YIG domain and on the 5' side with its C-terminal RNase H-like
  domain, releasing a short lesion-containing oligonucleotide. A UVR domain between the two
  nuclease domains binds UvrB and a C-terminal tandem helix-hairpin-helix module binds DNA. A
  small enterobacterial paralog, Cho (UvrC homologue), corresponds to the N-terminal half of
  UvrC only; it is SOS-inducible and makes an alternative 3' incision, four nucleotides
  further from the lesion, on substrates that UvrC incises poorly, leaving the 5' incision
  to UvrC. All characterized members are therefore damage-specific DNA endonucleases acting in
  nucleotide excision repair, but only UvrC carries out both incisions of the excinuclease
  reaction. The PANTHER family name ("UVRC/OXIDOREDUCTASE") does not describe any current
  member; no oxidoreductase is among the reviewed members.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Of the 602 reviewed members in the cached inventory, 596 are in SF1 (UVRABC SYSTEM PROTEIN C),
  593 of them named UvrABC system protein C, and 6 are in SF10 (EXCINUCLEASE CHO), all named
  Excinuclease cho (enterobacterial Escherichia, Shigella and Salmonella proteins of 293-295
  residues). DNA endonuclease activity and nucleotide-excision repair hold for both groups;
  the complete dual-incision excinuclease reaction holds for UvrC (SF1) only, because Cho lacks
  the C-terminal 5' incision domain. Three SF1 members are not UvrC and were not adjudicated:
  Bacillus subtilis YurQ (O32158, 124 residues, uncharacterized) and the Mycobacterium
  tuberculosis putative bifunctional exonuclease/endonuclease Rv2191 (P9WLJ1) and its CDC1551
  counterpart MT2247 (P9WLJ0). These are named exceptions, not a separate subfamily.
