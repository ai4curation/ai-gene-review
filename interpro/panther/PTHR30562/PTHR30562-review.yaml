- label: EXCINUCLEASE CHO
  description: >-
    PANTHER subfamily PTHR30562:SF10 (EXCINUCLEASE CHO, verbatim from panther.obo), the
    enterobacterial Cho proteins such as E. coli Cho (P76213, ydjQ). Its subfamily id is not
    declared here because Cho is not yet in the PANTHER member index used to check declared
    representatives; the assignment comes from the reviewed-member inventory.
  diverged_from_family: true
  divergence_description: >-
    Cho is homologous only to the N-terminal half of UvrC. It retains a 3' incision activity
    (shifted 4 nt further from the lesion) and binds a different UvrB domain, but lacks the
    5' incision domain, so it cannot perform the excinuclease dual incision alone and works
    with UvrC, which makes the 5' incision. Unlike uvrC, cho is SOS-inducible. DNA endonuclease
    activity and nucleotide-excision repair still apply; excinuclease ABC activity does not.
  supported_by:
  - reference_id: file:interpro/panther/PTHR30562/PTHR30562-entries.csv
    supporting_text: P76213,Excinuclease cho,protein,83333,Escherichia coli (strain K12),Escherichia coli
      (strain K12),cho,295,PTHR30562:SF10,EXCINUCLEASE CHO,True
  - reference_id: file:interpro/panther/panther.obo
