  name:
    name: Short-chain dehydrogenases/reductases
    short: SDR
  description:
  - text: The Short-chain dehydrogenases/reductases (SDR) family encompasses enzymes
      with diverse functions, including the reduction of various substrates such as
      3-ketoacyl-CoA intermediates in fatty acid elongation systems and 3-hydroxy
      acids. Members of the family are involved in the production of very long-chain
      fatty acids (VLCFA) which are precursors for ceramide and sphingolipids, crucial
      components of cell membranes and signaling molecules. Some SDR family proteins
      also participate in the biosynthesis of alkanes and the metabolism of steroid
      hormones. The family's broad substrate specificity is exemplified by its ability
      to act on both L- and D-isomers of amino acids and hydroxy acids, as well as
      to detoxify malonic semialdehyde, a byproduct of pyrimidine degradation.
