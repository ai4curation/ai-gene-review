notes: The Vmn2r73 signal peptide and ligand-binding region are retained, but stable expression, ligand
  identity and possible association with intact receptors remain unknown. Loss of autonomous GPCR activity
  does not exclude every accessory role in receptor signaling. The short product is not claimed to represent
  evolutionary loss of signaling by the whole Vmn2r73 locus.
