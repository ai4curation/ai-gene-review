    id: GO:0004930
    label: G protein-coupled receptor activity
  scope: UNRESOLVED
  scope_reason: Full-length class C receptors require a seven-transmembrane G-protein-coupling module.
    The selected 496-residue Vmn2r73 product lacks that module and cannot receive the activity merely
    from family membership. This target counterexample does not delimit all receptor-competent products
    across the family.
