family_id: PANTHER:PTHR24061
family_name: CALCIUM-SENSING RECEPTOR-RELATED
preferred_name: Class-C GPCR ligand-recognition proteins
summary: This group links class-C receptor proteins whose extracellular ligand-recognition regions support
  distinct sensory functions. Calcium-sensing, glutamate-responsive and vomeronasal receptors cannot be
  assigned each other's ligands from shared receptor architecture. For mouse Vmn2r73, receptor-family
  placement is a starting point for investigating vomeronasal signaling, not proof of a particular pheromone
  or peptide ligand.
functional_coherence: HETEROGENEOUS
coherence_reason: Class C receptor proteins share extracellular ligand-recognition architecture but differ
  in ligand specificity. The selected Vmn2r73 product retains its ligand-binding region and lacks the
  intact seven-transmembrane module, as established by exact comparison with the longer same-gene product.
  The primary mGlu5 structural study distinguishes extracellular ligand binding from seven-transmembrane
  G-protein coupling.
subfamilies:
- subfamily_id: PANTHER:PTHR24061:SF413
  label: VOMERONASAL 2, RECEPTOR 66-RELATED
  description: The selected Vmn2r73 representative has a retained ligand-binding region but lacks the
    full receptor signaling module. Its fold membership is valid, while autonomous GPCR activity and glutamate
    specificity cannot be transferred.
