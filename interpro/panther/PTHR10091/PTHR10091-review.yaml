family_id: PANTHER:PTHR10091
family_name: ALDOSE-1-EPIMERASE
preferred_name: Aldose 1-epimerase (galactose mutarotase, GalM/GALM) family
summary: >-
  Aldose 1-epimerases (mutarotases) interconvert the alpha and beta anomers of aldoses. Galactose
  mutarotase converts beta-D-galactose to the alpha anomer used by galactokinase, the first step
  of the Leloir pathway. The family contains the standalone bacterial GalM and animal GALM enzymes,
  a Levilactobacillus maltose epimerase, uncharacterized yeast paralogs (YHR210C, YNR071C), and fungal
  putative epimerases in SF6. Fungal Gal10 carries its mutarotase as a domain fused to UDP-glucose
  4-epimerase and is not in this family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The galactose mutarotases of bacteria and animals (SF0) are well characterized. SF0 also holds
  a maltose epimerase, which works on a different sugar, and uncharacterized members (E. coli YihR,
  S. cerevisiae YHR210C and YNR071C) whose activities have not been tested. SF6 contains fungal putative
  epimerases (FSL3, ARB_05372) without demonstrated mutarotase activity.
