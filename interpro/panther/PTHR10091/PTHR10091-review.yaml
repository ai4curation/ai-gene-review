  assessment_reason: >-
    The activity is ancestral, but participation in the Leloir pathway is shown only for the
    galactose mutarotases (E. coli GalM, human GALM). Placing the process at the LUCA root also
    passes it to uncharacterized SF0 paralogs (E. coli YihR, S. cerevisiae YHR210C and YNR071C;
