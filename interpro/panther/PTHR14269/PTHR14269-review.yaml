  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node joins the PgsA-type PGP synthases (SF62, SF40, SF11, SF52), the SF60 cardiolipin
    synthases and the HAD-domain-only proteins. For the phosphatidyltransferase members the
    generic term is correct, and in practice it is hidden behind more specific terms (CRD1
    carries GO:0032049 instead). All 11 seeds are phosphatidyltransferase-domain proteins
    (PGP synthases and CL synthases). The PAINT UniProt GAF nevertheless gives GO:0046474 to
    human and mouse HDHD5 (SF17), yeast YKR070W (SF57), trypanosome Q38DW6 and Candida SRG1
    (SF4). None of these has the CDP-alcohol phosphatidyltransferase domain (UniProt Pfam:
    PF13344/PF13242 only), and none has evidence of any role in glycerophospholipid synthesis.
    Their HAD domain matches the S. pombe crd1 hydrolase part, which is of unknown function.
    Recommended fix: an IRD at the node(s) leading to the HAD-only lineage, unless a
    glycerophospholipid-pathway activity is shown for HDHD5-type hydrolases. This would need
    checking against the tree, which was not inspected here.
