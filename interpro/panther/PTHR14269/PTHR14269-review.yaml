  UniProt REST API. Seed identifiers MGI:1913836, RGD:1311037 and FB:FBgn0039360 were resolved
  to Crls1/CLS through UniProt cross-reference queries. Arabidopsis and worm seeds were not
  resolved and are left unlabelled. The node PTN000370517 (GO:0005886 plasma membrane,
  Gammaproteobacteria, seed E. coli PgsA) was not assessed, because no reviewed member of the
  modules depends on it. Module consistency: cdp_dag_phospholipid_synthesis uses SF61 for CHO1
  and SF60 for CRD1, which matches this review. bacterial_phosphatidylethanolamine_biosynthesis
  correctly selects type-II PssA through InterPro IPR004533 rather than a PANTHER subfamily,
  since its two exemplars sit in different PTHR14269 subfamilies (PP_4677 in SF61, B. subtilis
  PssA in SF59). No PAINT node supplies PS-synthase activity to CHO1/pps1 or PGP-synthase
  activity to bacterial PgsA. These are curation gaps.
