family_id: PANTHER:PTHR14269
family_name: CDP-DIACYLGLYCEROL--GLYCEROL-3-PHOSPHATE 3-PHOSPHATIDYLTRANSFERASE-RELATED
preferred_name: Integral-membrane CDP-alcohol phosphatidyltransferases (PgsA, CLS, type-II PssA) with associated HAD-domain proteins
summary: >-
  A large family, mostly of integral-membrane CDP-alcohol phosphatidyltransferases (Pfam
  PF01066, CDP-OH_P_transf). These transfer the phosphatidyl group of CDP-diacylglycerol to
  different alcohol acceptors. The bacterial and plastid/plant PgsA-type PGP synthases use
  glycerol 3-phosphate. The eukaryotic mitochondrial cardiolipin synthases (CMP-forming)
  (yeast CRD1, S. pombe crd1, human CRLS1, plant CLS) use phosphatidylglycerol. The type-II
  phosphatidylserine synthases (yeast CHO1, S. pombe pps1, B. subtilis and mycobacterial PssA,
  P. putida PP_4677) use L-serine. PANTHER also places here proteins with only a
  haloacid-dehalogenase (HAD)-like hydrolase domain and no phosphatidyltransferase domain:
  human HDHD5/CECR5, yeast YKR070W and trypanosome and Candida CECR5-like proteins. These are
  related to the HAD domain that is fused N-terminal to the cardiolipin synthase domain in
  S. pombe crd1.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family joins at least three acceptor specificities, each of which defines a different
  pathway step: glycerol 3-phosphate (PgsA, SF62/SF40/SF11/SF52), phosphatidylglycerol (CLS,
  SF60) and L-serine (type-II PssA/CHO1, SF61/SF59). It also includes HAD-domain-only proteins
  (SF4, SF17, SF57) that lack the phosphatidyltransferase domain entirely and whose activity
  is unknown. No specific MF term is safe at family level. Activity terms must be scoped by
  subfamily or PAINT node. Generic glycerophospholipid-biosynthesis terms placed at deep nodes
  reach the HAD-only proteins without evidence. Eukaryotic mitochondrial PGP synthase (PGS1)
  is not in this family: it is the PLD-type enzyme of PTHR12586.
