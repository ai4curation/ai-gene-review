  assessment: UNRESOLVED
  assessment_reason: 'Pyridoxine metabolic process. No reviewed recipient keeps the term as stated: SNO1
    and SNO2 replace it (MODIFY) and S. pombe marks it over-annotated, all for the same reason, that the
    PdxT/SNO glutaminase feeds de novo pyridoxal 5''-phosphate synthesis, which does not pass through pyridoxine.
    PAINT has since asserted the correct process at this same node, GO:0042823 pyridoxal 5''-phosphate biosynthetic
    process (snapshot 20250904, assessed SOUND below), but has not retracted this 2017 IBD, so both descend.
    The node placement is sound; the term has been superseded rather than misplaced, which none of the existing
    classes describes, so it is left unresolved.'
