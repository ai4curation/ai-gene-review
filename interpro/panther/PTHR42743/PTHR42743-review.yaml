  node_taxon:
    id: NCBITaxon:1236
    label: Gammaproteobacteria
  paint_snapshot: '20170828'
  seeds:
  - id: UniProtKB:P28305
    label: pabC
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    Gammaproteobacterial PabC node (SF2 members in the cached GAF: E. coli and V. cholerae
    PabC). Conservative: the fungal ADC lyases (ABZ2, SPBC19G7.02) and B. subtilis PabC in SF11
