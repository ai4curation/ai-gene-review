    experimental support; the S. pombe ortholog is a putative ADC lyase).
- node_id: PANTHER:PTN000214662
  asserted_term:
    id: GO:0019752
    label: carboxylic acid metabolic process
  paint_snapshot: '20221009'
  seeds:
  - id: AGI_LocusCode:AT5G57850
    label: DAAT
    organism: Arabidopsis thaliana
  - id: SGD:S000004902
    label: ABZ2
    organism: Saccharomyces cerevisiae
  - id: UniProtKB:P0AB80
    label: ilvE
    organism: Escherichia coli K-12
  - id: UniProtKB:P28305
    label: pabC
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    A deliberately generic process at the family root that is true for all three activities
    (amino acid and 2-oxo acid interconversion; ADC to p-aminobenzoate plus pyruvate). It is the
    only family-level term PAINT places here, which is the correct response to a heterogeneous
    family. ABZ2 and SPBC19G7.02 receive it.
term_assessments:
- assessed_term:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The IlvE-named members are in SF11 and SF4, but SF11 also holds ADC lyases, which are
    listed as exceptions. PAINT asserts the activity only for gammaproteobacterial IlvE
    (PTN000214714). The branched-chain amino acid module lists PTHR42743:SF11 for E. coli IlvE;
    that is accurate as a classification, but SF11 must not be read as a branched-chain
    transaminase subfamily, because ABZ2 and SPBC19G7.02 are in it. Arabidopsis At3g05190
    (SF11, "BCAT-like protein 1") was not assessed.
  applicable_subfamilies:
  - id: PANTHER:PTHR42743:SF11
    label: AMINODEOXYCHORISMATE LYASE
  - id: PANTHER:PTHR42743:SF4
    label: BRANCHED-CHAIN-AMINO-ACID AMINOTRANSFERASE-RELATED
  member_exceptions:
  - member:
      id: UniProtKB:Q03266
      label: ABZ2
      gene_symbol: ABZ2
      organism: Saccharomyces cerevisiae
      gene_review: genes/yeast/ABZ2/ABZ2-ai-review.yaml
    exception_reason: >-
      ABZ2 is in SF11 with E. coli IlvE but is an ADC lyase required for p-aminobenzoate
      synthesis, not a branched-chain transaminase; yeast branched-chain transamination is done
      by BAT1/BAT2 (PTHR11825).
    supported_by:
    - reference_id: PMID:17873082
      supporting_text: A detailed characterization of YMR289w revealed that this gene was required for
        growth in media lacking p-aminobenzoic or folic acid and encoded a 4-amino-4-deoxychorismate
        lyase
  - member:
      id: UniProtKB:O42951
      label: SPBC19G7.02
      gene_symbol: SPBC19G7.02
      organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
    exception_reason: >-
      Fission-yeast ABZ2 ortholog, annotated as a putative ADC lyase; the S. pombe branched-chain
      aminotransferase is eca39 (PTHR11825).
    supported_by:
    - reference_id: file:interpro/panther/PTHR42743/PTHR42743-entries.csv
      supporting_text: O42951,Putative aminodeoxychorismate lyase,protein,284812
  - member:
      id: UniProtKB:P28821
      label: pabC
      gene_symbol: pabC
      organism: Bacillus subtilis (strain 168)
    exception_reason: Bacillus subtilis PabC, an ADC lyase placed in SF11.
    supported_by:
    - reference_id: file:interpro/panther/PTHR42743/PTHR42743-entries.csv
      supporting_text: P28821,Aminodeoxychorismate lyase,protein,224308
  supported_by:
  - reference_id: PMID:378964
    supporting_text: Transaminase B (branched-chain amino acid aminotransferase, EC 2.6.1.42), the ilvE
      gene product, was purified to apparent homogeneity from an Escherichia coli K-12 strain
- assessed_term:
    id: GO:0008696
    label: 4-amino-4-deoxychorismate lyase activity
  scope: UNRESOLVED
  scope_reason: >-
    Safe for SF2 (gammaproteobacterial PabC) as a whole. In SF11 it holds for the ADC-lyase
    members (ABZ2, S. pombe SPBC19G7.02, B. subtilis PabC, M. tuberculosis Rv0812) but not for
    the many IlvE members of the same subfamily (E. coli, Salmonella, P. aeruginosa, archaeal and
    Rickettsia IlvE); E. coli ADC lyase activity is PabC (SF2), while E. coli IlvE is
    transaminase B. The tetrahydrofolate module's use of SF11 for the fungal ABZ2 variant is
    therefore correct only if read as "the ABZ2 members of SF11". Because SF11 is not pure, the
    scope is left unresolved and per-lineage application is required.
  supported_by:
  - reference_id: PMID:2071583
    supporting_text: The aminodeoxychorismate lyase gene, designated pabC, was mapped to 25 min on the E.
      coli chromosome
  - reference_id: PMID:17873082
    supporting_text: ABZ2 was able to rescue the p-aminobenzoate auxotrophy of an Escherichia coli pabC
      mutant, thus demonstrating that ABZ2 and pabC are functional homologues.
  - reference_id: PMID:378964
    supporting_text: Purified transaminase B catalyzed transamination between alpha-ketoglutarate and
      l-isoleucine, l-leucine, l-valine
- assessed_term:
    id: GO:0019752
    label: carboxylic acid metabolic process
  scope: FAMILY_WIDE
  scope_reason: Generic process true of every activity in the family; see PTN000214662.
