notes: >-
  PAINT rows fetched in this session (just fetch-panther-paint PTHR42743). Subfamily
  assignments from entries.csv and the PANTHER 19.0 model-organism classification files;
  propagation sets from the cached PAINT UniProt GAF. Module/literature tension: the
  tetrahydrofolate module (quoting PMID:17873082) describes fungal ABZ2-type ADC lyases as
  having no significant homology to bacterial or plant ADC lyases, yet PANTHER classifies ABZ2
  and S. pombe SPBC19G7.02 in the same subfamily (SF11) as B. subtilis PabC and E. coli IlvE,
  and in the same family as E. coli PabC (SF2). The two statements are not strictly
  contradictory (HMM family membership versus pairwise similarity), but the module's separate
  "bacterial PabC" and "fungal ABZ2" variants should not be read as unrelated families. S. pombe
  SPBC19G7.02 has no gene review in the repo.
