    gene_symbol: ABZ2
    organism: Saccharomyces cerevisiae (strain ATCC 204508 / S288c)
    gene_review: genes/yeast/ABZ2/ABZ2-ai-review.yaml
  - id: UniProtKB:O42951
    label: SPBC19G7.02
    gene_symbol: SPBC19G7.02
    organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
  - id: UniProtKB:P28821
