      (strain K12),Escherichia coli (strain K12),ilvE,309,PTHR42743:SF11,AMINODEOXYCHORISMATE LYASE
  - reference_id: file:interpro/panther/PTHR42743/PTHR42743-entries.csv
    supporting_text: Q03266,Aminodeoxychorismate lyase,protein,559292
- subfamily_id: PANTHER:PTHR42743:SF2
  label: AMINODEOXYCHORISMATE LYASE
  description: >-
    Gammaproteobacterial PabC ADC lyases (E. coli P28305, Vibrio harveyi and V. cholerae PabC).
    This is the clade below the PAINT ADC-lyase node PTN000214711. Used by the tetrahydrofolate
    module for the bacterial PabC variant.
  representative_members:
  - id: UniProtKB:P28305
    label: pabC
    gene_symbol: pabC
    organism: Escherichia coli (strain K12)
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR42743:SF10
  label: D-ALANINE AMINOTRANSFERASE
  description: >-
    Firmicute D-alanine aminotransferases (Bacillus, Listeria, Staphylococcus Dat). Not used by
    the modules; listed to show the third activity in the family.
  representative_members:
  - id: UniProtKB:O07597
    label: dat
    gene_symbol: dat
    organism: Bacillus subtilis (strain 168)
  diverged_from_family: true
  divergence_description: >-
    D-amino acid transamination rather than branched-chain transamination or ADC elimination.
    Neither GO:0004084 nor GO:0008696 applies.
node_assessments:
- node_id: PANTHER:PTN000214714
  asserted_term:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  node_taxon:
    id: NCBITaxon:1236
    label: Gammaproteobacteria
  paint_snapshot: '20200817'
  seeds:
  - id: UniProtKB:P0AB80
    label: ilvE
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    A shallow gammaproteobacterial IlvE node. In the cached GAF it reaches only six proteins
    (E. coli, Salmonella and P. aeruginosa IlvE among the reviewed ones). The ADC lyases in the
    same subfamily (ABZ2, SPBC19G7.02, B. subtilis PabC) do not inherit it, which is correct.
    Archaeal, Rickettsia, cyanobacterial and Thermotoga IlvE do not inherit it either; their
    branched-chain transaminase activity, if real, would need its own node, so the placement is
    conservative rather than wrong.
- node_id: PANTHER:PTN000214714
  asserted_term:
    id: GO:0006532
    label: L-aspartate biosynthetic process
  node_taxon:
    id: NCBITaxon:1236
    label: Gammaproteobacteria
  paint_snapshot: '20200817'
  seeds:
  - id: UniProtKB:P0AB80
    label: ilvE
    organism: Escherichia coli K-12
  assessment: UNRESOLVED
  assessment_reason: >-
    Single-seed process term on the IlvE node. The source experiment for an aspartate
    biosynthesis role of E. coli transaminase B was not reviewed here, and the purified enzyme
    is reported free of aspartate transaminase activity (PMID:378964). Flagged for checking
    against the seed annotation; not used by any module.
  supported_by:
  - reference_id: PMID:378964
    supporting_text: The enzyme was free of aspartate transaminase and of transaminase C.
- node_id: PANTHER:PTN000214711
  asserted_term:
