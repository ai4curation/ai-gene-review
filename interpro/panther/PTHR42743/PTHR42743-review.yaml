family_id: PANTHER:PTHR42743
family_name: AMINO-ACID AMINOTRANSFERASE
preferred_name: Class IV PLP-fold aminotransferases and aminodeoxychorismate lyases (IlvE/Dat/PabC/ABZ2)
summary: >-
  Pyridoxal 5'-phosphate-dependent enzymes of the class IV aminotransferase fold that carry
  out at least three different reactions. Branched-chain amino acid aminotransferases
  (E. coli/Salmonella/Pseudomonas aeruginosa IlvE, archaeal and Rickettsia IlvE, cyanobacterial
  and Thermotoga IlvE) transaminate leucine, isoleucine and valine with 2-oxoglutarate.
  D-amino acid aminotransferases (Bacillus/Staphylococcus Dat, Arabidopsis DAAT) act on
  D-alanine and other D-amino acids. 4-Amino-4-deoxychorismate lyases (E. coli/Vibrio PabC,
  Bacillus subtilis PabC, S. cerevisiae ABZ2, S. pombe SPBC19G7.02) eliminate pyruvate from
  aminodeoxychorismate to give p-aminobenzoate for folate synthesis; Mycobacterium Rv0812 is
  annotated as bifunctional ADC lyase / D-amino acid transaminase. The yeast branched-chain
  aminotransferases BAT1/BAT2 are not in this family (PTHR11825).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family lumps branched-chain transaminases, D-amino acid transaminases and
  aminodeoxychorismate lyases. No specific molecular function term is safe family-wide, and the
  PANTHER subfamilies do not follow the functional split: SF11 (official name AMINODEOXYCHORISMATE
  LYASE) contains E. coli, Salmonella and P. aeruginosa IlvE and archaeal/Rickettsia IlvE
  (branched-chain transaminases) together with S. cerevisiae ABZ2, S. pombe SPBC19G7.02,
  B. subtilis PabC and M. tuberculosis Rv0812 (ADC lyases). Two modules use SF11 for two
  different reactions. Only PAINT nodes, not subfamily labels, separate the activities.
subfamilies:
- subfamily_id: PANTHER:PTHR42743:SF11
  label: AMINODEOXYCHORISMATE LYASE
  description: >-
    Mixed subfamily. Branched-chain transaminases: E. coli IlvE P0AB80, Salmonella IlvE,
    P. aeruginosa IlvE, archaeal and Rickettsia IlvE. ADC lyases: S. cerevisiae ABZ2,
    S. pombe SPBC19G7.02, B. subtilis PabC, M. tuberculosis Rv0812. Also Arabidopsis
    At3g05190 (BCAT-like protein 1). The branched-chain amino acid module uses SF11 for E. coli
    IlvE; the tetrahydrofolate module uses it for fungal ABZ2-type ADC lyases.
  representative_members:
  - id: UniProtKB:P0AB80
    label: ilvE
    gene_symbol: ilvE
    organism: Escherichia coli (strain K12)
  - id: UniProtKB:Q03266
