  name:
    name: Insulin-like Growth Factor
    short: IGF
  description:
  - text: The Insulin-like Growth Factor (IGF) family is characterized by its structural
      and functional relationship to insulin, exhibiting a higher growth-promoting
      activity. Members of the family act as ligands for the IGF1 receptor (IGF1R),
      binding to its alpha subunit and triggering tyrosine kinase activity, leading
      to downstream signaling via the PI3K-AKT/PKB and Ras-MAPK pathways. They also
      bind to integrins, forming ternary complexes essential for IGF1 signaling. Some
      family members are involved in glucose transport, glycogen synthesis, synapse
      maturation, and sensory perception of smell. In insects, certain peptides activate
      prothoracic glands for ecdysone production. The family also includes variants
      with specific functions, such as promoting head development by inhibiting Wnt
      signaling during embryogenesis and different forms that may have distinct roles
      in juvenile and adult stages.
