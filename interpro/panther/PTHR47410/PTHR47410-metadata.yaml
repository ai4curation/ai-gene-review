  name:
    name: Toll-like Receptor
    short: Toll-like_rcpt
  description:
  - text: The Toll-like receptor family is a group of proteins that are essential
      components of the innate and adaptive immune systems. They recognize molecular
      patterns specific to microorganisms, such as RNA degradation products, single-stranded
      RNAs, and unmethylated CpG dinucleotides, leading to the activation of immune
      responses. Upon ligand binding, these receptors dimerize, facilitating the recruitment
      of the adapter protein MYD88. This interaction initiates the formation of the
      Myddosome signaling complex, which includes IRAK4, IRAK1, TRAF6, and TRAF3.
      Subsequent activation of transcription factors NF-kappa-B and IRF7 results in
      the production of pro-inflammatory cytokines and interferons, which are crucial
      for the defense against various pathogens, including viruses and bacteria.
