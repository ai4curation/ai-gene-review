family_id: PANTHER:PTHR13980
family_name: CDC68 RELATED
preferred_name: Spt16 FACT histone chaperones
summary: Spt16 is the large subunit of FACT, a histone chaperone that reorganizes nucleosomes while preserving
  chromatin integrity. Its amino-terminal aminopeptidase-like fold binds histones H3 and H4. Structural
  and biochemical work on pombe Spt16 establishes a nonenzymatic histone-binding function for that fold,
  rather than aminopeptidase catalysis.
functional_coherence: COHERENT
coherence_reason: All 26 inspected entries identify Spt16 orthologs. Direct pombe structural and mutational
  studies show that the aminopeptidase-like N-terminal domain binds histone H3-H4 cores and tails rather
  than catalyzing proteolysis (PMID:18579787). FACT membership is a coherent family assignment; histone
  binding does not confer histone-modifying enzymatic activity or aminopeptidase activity.
