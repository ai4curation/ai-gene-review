  name:
    name: E3 ubiquitin-protein ligase and sorting receptor
    short: E3_ligase_sorting_rcpt
  description:
  - text: This family of proteins is involved in various cellular processes including
      protein ubiquitination, signaling pathway regulation, protein trafficking, and
      cellular growth control. Members of this family function as E3 ubiquitin-protein
      ligases, catalyzing the attachment of ubiquitin to substrate proteins, thereby
      targeting them for degradation or altering their cellular location and function.
      They play roles in the regulation of the TORC1 signaling pathway through polyubiquitination
      of specific proteins, influencing nutrient response and growth regulation. Some
      members are also implicated in the sorting and trafficking of proteins to vacuoles,
      acting as sorting receptors. Additionally, they are involved in synaptic transmission
      regulation and endosomal trafficking by mediating ubiquitination of receptors
      and vesicular proteins. The family includes proteins that regulate lysosome
      positioning and are involved in the G1/S transition of the cell cycle.
