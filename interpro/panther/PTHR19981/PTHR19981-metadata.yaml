  name:
    name: Actin-binding talin-like protein
    short: Actin-binding_talin-like
  description:
  - text: This family of proteins includes actin-binding components that are involved
      in the linkage of cytoskeletal structures to the plasma membrane. They play
      a crucial role in cell motility, chemotaxis, and cell adhesion. Members of this
      family are characterized by a FERM domain at the N-terminus and a flexible C-terminal
      rod composed of amphipathic helical bundles. These proteins are essential for
      the organization of the actin cytoskeleton, cell shape, and the dynamics of
      cell adhesion sites. They are also involved in the recruitment and activation
      of kinases at focal adhesion plaques, indicating a role in signal transduction
      pathways related to cell adhesion and movement.
