family_id: PANTHER:PTHR23122
family_name: MEMBRANE-ASSOCIATED GUANYLATE KINASE  MAGUK
preferred_name: MPP/CASK MAGUK interaction scaffolds
summary: MPP-like and CASK-like MAGUK proteins assemble membrane-associated interaction complexes using
  conserved PDZ, SH3 and guanylate-kinase-like modules. Fly Metro stabilizes a perisynaptic complex with
  Dlg and DLin-7 through L27-domain interactions. The guanylate-kinase-like domain is an interaction module
  and does not establish GMP phosphorylation.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory includes MPP/PALS and CASK/LIN-2 proteins with different amino-terminal
  architectures. A kinase-domain property of CASK cannot be transferred to Metro, while guanylate-kinase
  catalysis must not be inferred from the MAGUK acronym. Synaptic and epithelial polarity complexes also
  require member-specific assignment.
