family_id: PANTHER:PTHR23293
family_name: FAD SYNTHETASE-RELATED  FMN ADENYLYLTRANSFERASE
preferred_name: Eukaryotic FAD synthase (FAD1/FLAD1) family
summary: >-
  PAPS-reductase-fold FMN adenylyltransferases make FAD from FMN and ATP (S. cerevisiae FAD1, S.
  pombe nad1, human FLAD1, which also has a molybdopterin-binding-like domain with FAD hydrolase
  activity). Bacterial FAD synthesis uses the unrelated RibF.
