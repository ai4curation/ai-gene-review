  description:
  - text: The [NiFe]/[NiFeSe] hydrogenase large subunit family comprises enzymes involved
      in redox reactions, particularly hydrogen metabolism. Members of this family
      function as part of enzyme complexes that catalyze the reduction of protons
      to produce hydrogen, a process that may play a role in hydrogen cycling during
      fermentative growth. Some subunits are part of bifunctional enzyme complexes
      with sulfur-reducing activity. Others are involved in reducing coenzyme F420,
      a low-potential two-electron acceptor, or providing reducing equivalents for
      heterodisulfide reductase. The family includes various hydrogenase components,
      such as F420-non-reducing hydrogenases and sulfhydrogenases, which exhibit activity
      with different electron donors like NADPH and, in some cases, NAD.
