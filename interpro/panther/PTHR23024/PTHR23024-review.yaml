subfamilies:
  - subfamily_id: PANTHER:PTHR23024:SF485
    label: GIBBERELLIN RECEPTOR GID1A
    description: >-
      Brassicaceae GID1A (4 leaves). Arabidopsis GID1A and GID1C come from a
      Brassicaceae duplication (PTN000546397).
    representative_members:
      - id: UniProtKB:Q9MAA7
        label: Gibberellin receptor GID1A
        gene_symbol: GID1A
        organism: Arabidopsis thaliana
        gene_review: genes/ARATH/GID1A/GID1A-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      Non-catalytic gibberellin receptor (see SF492). Hydrolase and carboxylesterase
      terms of the family must not descend here.
    supported_by:
      - reference_id: PMID:24961590
        supporting_text: >-
          GID1 was first described in rice as a nuclear localized protein similar to
          hormone-sensitive lipase family without hydrolase activity
  - subfamily_id: PANTHER:PTHR23024:SF98
    label: GIBBERELLIN RECEPTOR GID1B
    description: >-
      Eudicot GID1B (43 leaves), the paralog from the Pentapetalae duplication
      PTN001887735 that separates GID1B from the GID1A/GID1C lineage.
    representative_members:
      - id: UniProtKB:Q9LYC1
        label: Gibberellin receptor GID1B
        gene_symbol: GID1B
        organism: Arabidopsis thaliana
        gene_review: genes/ARATH/GID1B/GID1B-ai-review.yaml
    diverged_from_family: true
    divergence_description: Non-catalytic gibberellin receptor (see SF492).
  - subfamily_id: PANTHER:PTHR23024:SF492
    label: GIBBERELLIN RECEPTOR GID1C
    clade_node_id: PANTHER:PTN007726047
    description: >-
      The largest GID1 subfamily (58 leaves). It holds Arabidopsis GID1C, the monocot
      GID1s (rice GID1, the founding GA receptor) and the four Selaginella GID1s at the
      base of the GID1 clade PTN007726047. Five other subfamilies (SF485, SF98, SF462,
      SF659, and SF629 despite its "CARBOXYLESTERASE" name) are nested inside the same
      clade.
    representative_members:
      - id: UniProtKB:Q940G6
        label: Gibberellin receptor GID1C
        gene_symbol: GID1C
        organism: Arabidopsis thaliana
        gene_review: genes/ARATH/GID1C/GID1C-ai-review.yaml
      - id: UniProtKB:Q6L545
        label: Gibberellin receptor GID1
        gene_symbol: GID1
        organism: Oryza sativa
    diverged_from_family: true
    divergence_description: >-
      GID1 receptors keep the hormone-sensitive-lipase fold but replace the catalytic
      histidine with valine. They bind bioactive gibberellins with high affinity and
      present a GA-closed lid to DELLA proteins instead of hydrolysing esters. The
      Physcomitrella GID1-like proteins keep the histidine and neither bind GA nor
      interact with DELLA.
    supported_by:
      - reference_id: PMID:16193045
        supporting_text: >-
          The GID1 gene encodes an unknown protein with similarity
          to the hormone-sensitive lipases
      - reference_id: PMID:17965273
        supporting_text: >-
          At the third amino acid residue, however, the Sm GID1 proteins contained V, as in
          other GID1 proteins, while Pp GID1L proteins contained H, as in HSLs.
  - subfamily_id: PANTHER:PTHR23024:SF629
    label: CARBOXYLESTERASE
    description: >-
      Three Asteraceae leaves (sunflower, lettuce) nested inside the GID1 clade
      PTN007726047. UniProt names one of them "Carboxylesterase", but its gene symbol
      is ATGID1B. Despite PANTHER's name, these
      are GID1 receptors by phylogenetic position.
    representative_members:
      - id: UniProtKB:A0A251TJ51
        label: Carboxylesterase
        gene_symbol: ATGID1B
        organism: Helianthus annuus
    diverged_from_family: true
    divergence_description: >-
      Placed in the GID1 receptor clade, so expected to be a non-catalytic GA receptor
      despite the subfamily name. Not experimentally characterized.
  - subfamily_id: PANTHER:PTHR23024:SF529
    label: CARBOXYLESTERASE 5-RELATED
    description: >-
      Arabidopsis CXE5, one of the plant carboxylesterases that seed the
      carboxylesterase IBD at PTN008378658. Representative of the catalytic plant CXE
      majority.
    representative_members:
      - id: UniProtKB:Q9FX94
        label: Probable carboxylesterase 5
        gene_symbol: CXE5
        organism: Arabidopsis thaliana
  - subfamily_id: PANTHER:PTHR23024:SF368
    label: 2-HYDROXYISOFLAVANONE DEHYDRATASE
    description: >-
      Soybean HIDH, a carboxylesterase-fold enzyme that dehydrates 2-hydroxyisoflavanones
      in isoflavone biosynthesis and also has esterase activity. It seeds both the
      carboxylesterase and the hydrolase IBDs.
    representative_members:
      - id: UniProtKB:Q5NUF3
        label: 2-hydroxyisoflavanone dehydratase
        gene_symbol: HIDH
        organism: Glycine max

