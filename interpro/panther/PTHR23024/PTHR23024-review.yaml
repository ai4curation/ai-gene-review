review_status: NEEDS_REVIEW
reviewed_by: claude-code (AI-assisted PANTHER family review)
review_date: "2026-10-14"
notes: >-
  Scope. The review covers the whole PTHR23024 family, focused on the GID1 receptor
  clade, which holds the three reviewed Arabidopsis members. The catalytic subfamilies
  (AADAC, NCEH1, AFMID, plant CXEs) are summarized but not individually assessed.

  Sources. Tree topology is from the live PANTHER 19 treeinfo service (fetched
  2026-10-14). The path from GID1A to the root runs: Brassicaceae duplication
  PTN000546397 (GID1A/GID1C), then Pentapetalae duplication PTN001887735 (adds GID1B),
  then angiosperm GID1 node PTN000546395 (Magnoliophyta, 109 leaves, carrying the GID1
  IBDs), then vascular-plant GID1 clade PTN007726047 (113 leaves, adds Selaginella
  GID1a/b), then Tracheophyta duplication PTN009058860 (sister clades hold CXE8, CXE9,
  CXE18, CXE20), then the plant/CXE node PTN008378658 (1,673 leaves; the carboxylesterase
  IBD), and finally the family root PTN009058710 (2,060 leaves; the hydrolase IBD).
  Seeds were resolved via UniProt: AT3G05120 GID1A, Q6L545 rice GID1, AT1G49660 CXE5,
  AT3G48690 CXE12, AT5G23530 CXE18, AT5G62180 CXE20, Q5NUF3 soybean HIDH.

  PAINT slice gap. The cached PTHR23024-paint.tsv, re-sliced unchanged on 2026-10-14,
  lacks the family-root IBD of GO:0016787 hydrolase activity at PTN009058710. That IBD
  exists in PANTHER's IBD.gaf (seeds include CXE5, CXE12, CXE18, Arabidopsis ICME, HIDH,
  mouse/rat AADAC-like proteins and bacterial esterases), and it is the source of the
  GO:0016787 IBA on GID1A/B/C in GOA. It could not be given a node_assessment because
  the validator checks nodes against the slice. It is handled above as a FAMILY_WIDE
  term with GID1 member exceptions. In the PANTHER leaf GAF, GID1A/B/C also inherit
  GO:0106435 from PTN008378658, but GOA/QuickGO show them GO:0016787 instead. Once the
  slicer emits the PTN009058710 root IBD, the GO:0016787 member exceptions should gain
  pruned_node_id PANTHER:PTN009058710, with a matching node assessment.

  Node coverage. The cached slice has 5 nodes; 2 are assessed (PTN000546395,
  PTN008378658). The other 3 are not adjudicated, and their IBDs should not be read as
  endorsed or rejected. PTN001887812 (rosids; seed CXE18 AT5G23530; GO:0009860) and
  PTN009058812 (Mesangiospermae; seed soybean HIDH Q5NUF3; GO:0019748) are
  single-seed process IBDs in catalytic carboxylesterase clades. Neither seed has a gene
  review in this repo, and neither node is on the path from GID1A to the root given
  above, so no reviewed member inherits them. PTN004595044 (the eurosid CXE20 clade;
  GO:0016788 IBA, GO:0043722 IBD, NOT GO:0106435) is cited above only as precedent for a
  NOT annotation in this family; its own placements were not assessed, for the same
  reasons.

  Reference protein. GID1A is the reference protein because it is the best-characterized
  member in the ARATH corpus this review serves, but it is a non-catalytic outlier of a
  family whose core is serine hydrolases. A future curator adding a catalytic-triad
  residue site should anchor it on a catalytic member (an AADAC or plant CXE) instead.

  UniProt still gives GID1A/B/C an EC 3.-.-.- and ACT_SITE features (Ser191 and Asp289
  in GID1A) by similarity, and Val319 sits at the catalytic-His position. No residue
  site is curated here, because the His position has not been alignment-verified
  against a catalytic CXE control.

  Gene-review gap (curation). The GID1A review was built from a GOA snapshot without
  IBA rows. Live QuickGO (2026-10-14) shows four IBAs on GID1A: GO:0010331, GO:0005634,
  GO:0005737 and GO:0016787. GID1B and GID1C carry them, with GO:0016787 REMOVEd.

  Recommendations to PAINT. (1) Add IRD/NOT for GO:0106435 and GO:0016787 at the GID1
  clade PTN007726047. (2) Consider moving GO:0010331 from PTN000546395 to PTN007726047,
  to include the lycophyte GID1s.
