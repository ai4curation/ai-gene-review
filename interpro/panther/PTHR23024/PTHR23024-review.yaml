family_id: PANTHER:PTHR23024
family_name: ARYLACETAMIDE DEACETYLASE
preferred_name: GDXG/HSL-like alpha/beta-hydrolase family (AADAC, NCEH1, AFMID, plant carboxylesterases and GID1 gibberellin receptors)
summary: >-
  A large family (PANTHER 19 tree: 2,060 leaves from bacteria to plants and animals) of
  alpha/beta-hydrolase-fold-3 proteins of the "GDXG" (hormone-sensitive-lipase-like)
  lipolytic enzyme type. Most members are serine hydrolases with a Ser-His-Asp catalytic
  triad, a GXSXG nucleophile elbow and an HGG oxyanion-hole motif. Examples are animal
  arylacetamide deacetylase (AADAC, AADACL2-4), neutral cholesterol ester hydrolase 1
  (NCEH1), kynurenine formamidase (AFMID; yeast BNA7), bacterial acetyl esterase (E. coli
  Aes) and the plant carboxylesterases (Arabidopsis CXE family; soybean
  2-hydroxyisoflavanone dehydratase HIDH). The vascular-plant GID1 clade (clade
  PTN007726047, Tracheophyta) is a non-catalytic exception. GID1A/B/C in Arabidopsis,
  GID1 in rice and the Selaginella GID1s keep the fold, the GXSXG serine and the HGG
  motif, but have valine at the position of the catalytic histidine. They have turned
  the substrate pocket into a gibberellin-binding site: GA binding closes an N-terminal
  lid that then binds the DELLA domain of DELLA repressors, and this triggers DELLA
  degradation via SCF(SLY1/GID2). GID1 proteins are nucleocytoplasmic soluble GA
  receptors. The moss GID1-like proteins sit outside this clade among the carboxylesterases;
  they keep the histidine and do not bind GA.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Most of the family hydrolyses ester or amide bonds, but on very different substrates:
  aryl acetamides and drug esters (AADAC), cholesterol esters (NCEH1), N-formylkynurenine
  (AFMID), and plant volatile and isoflavonoid esters (CXEs, HIDH). One deeply nested
  clade, the GID1 gibberellin receptors, has lost catalysis and acts as a hormone
  receptor. Hydrolase activity is safe family-wide except for the GID1 clade.
  Carboxylesterase activity is not safe family-wide (AFMID and BNA7 are amidases). The
  gibberellin terms (gibberellin binding, nucleus) belong to the GID1 subfamilies only.
