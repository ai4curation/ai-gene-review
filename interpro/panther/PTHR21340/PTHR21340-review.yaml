    label: dihydroneopterin triphosphate pyrophosphohydrolase activity
  scope: UNRESOLVED
  scope_reason: >-
    This is NudB's activity (with its E. coli O157 and Shigella orthologs P0AFC1 and P0AFC2).
    UniProt and the InterPro entry list cross-reference NudB to PTHR21340:SF0, but PANTHER 19
    classifies it in PTHR43736:SF1. While that disagreement stands, the term holds for NudB
    and its orthologs and for no other PTHR21340 member: no Ap4A hydrolase has shown
    dihydroneopterin triphosphate activity. It must not spread to SF0 as a whole. The
    folate-pathway process terms (GO:0046654, GO:0046656) follow the same rule.
  supported_by:
