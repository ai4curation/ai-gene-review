term_assessments:
- assessed_term:
    id: GO:0004081
    label: bis(5'-nucleosyl)-tetraphosphatase (asymmetrical) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for SF0, the subfamily of every characterized asymmetrical Ap4A hydrolase (NUDT2
    orthologs, ndx-4, Datp/Apf, Plasmodium) and of Thermus Ndx1, which also releases ATP
    and AMP from Ap4A. The term is ancestral to the family (see the PTN000482012 node
    assessment). SF7 is left out of the applicable set because none of its members has been
    assayed. That is a lack of evidence, not evidence of loss. Inside SF0, the large DNA virus
    enzymes are the weakest cases. ASFV g5R does hydrolyse diadenosine and diguanosine
    polyphosphates, but its preferred substrates are diphosphoinositol polyphosphates and
    RNA-linked mRNA caps, so whether its Ap4A cleavage is asymmetrical, and whether it
    matters, is not established. Members whose catalytic Nudix glutamates are changed should
    be checked against site nudix_catalytic_glutamates.
  applicable_subfamilies:
  - id: PANTHER:PTHR21340:SF0
    label: BIS(5'-NUCLEOSYL)-TETRAPHOSPHATASE [ASYMMETRICAL]
  supported_by:
  - reference_id: PMID:11738085
    supporting_text: >-
      The purified recombinant enzyme behaves as a typical animal Ap4A hydrolase.
  - reference_id: PMID:15596429
    supporting_text: >-
      Asymmetric diadenosine 5',5'''-P(1),P(4)-tetraphosphate (Ap(4)A) hydrolases play a
      major role in maintaining homeostasis
  - reference_id: PMID:11773415
    supporting_text: >-
      Diadenosine and diguanosine nucleotides were substrates, but the enzyme showed no
      activity with cap analogues such as 7mGp3A.
- assessed_term:
    id: GO:0015967
    label: diadenosine tetraphosphate catabolic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    This is the process the clade's Ap4A hydrolase activity serves. The enzymes keep
    intracellular Ap4A low by cleaving it back to ATP and AMP. That is direct participation:
    the enzyme does the catabolic step. It is the right replacement for the product-based AMP
    and ATP biosynthetic process terms PAINT has at the root. No PAINT node currently asserts
    it. It is best scoped to the Archaea-Eukaryota node PTN001084988 within SF0, where the
    characterized Ap4A hydrolases sit. It should not be assumed for the viral SF0 members
    (g5R prefers diphosphoinositol polyphosphates and capped mRNA) or for Thermus Ndx1, whose
    preferred substrate is Ap6A.
  applicable_subfamilies:
