    organism: Sus scrofa
  - id: WB:WBGene00003581
    label: ndx-4
    organism: Caenorhabditis elegans
  assessment: SOUND
  assessment_reason: >-
    PTN000482012 is the root (LUCA) of the PANTHER 19 PTHR21340 tree. PAINT records no taxon
    for it. The three seeds come from three distant eukaryotic lineages (alveolate, nematode,
    mammal), each with direct biochemical evidence for asymmetrical Ap4A cleavage to ATP and
    AMP. That spread already supports an Archaea-Eukaryota origin, and the reference archaeal
    leaves (Pyrobaculum, Halobacterium, Nitrosopumilus) belong to the same animal/archaeal
    group of Ap4A hydrolases. Placing the term at the root also passes it to the eubacterial
    clade. This is supported, though not proven, by Thermus Ndx1, a bacterial SF0 member that
    releases ATP from Ap4A and the other (di)adenosine polyphosphates through the same Nudix
    glutamates. No member has been shown to lack the activity, so the root placement stands.
    The weakest descendants are the actinobacterial SF7 proteins (Rv3733c, SCO1203), which
    have never been assayed. Applying this term to them is a prediction, not an established
    fact. Gene-level agreement: ndx-4, mouse Nudt2 and the other vertebrate orthologs accept
    this term.
