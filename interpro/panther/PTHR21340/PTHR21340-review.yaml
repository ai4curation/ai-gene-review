family_id: PANTHER:PTHR21340
family_name: DIADENOSINE 5,5-P1,P4-TETRAPHOSPHATE PYROPHOSPHOHYDROLASE MUTT
preferred_name: Asymmetrical Ap4A hydrolase (NUDT2-type) Nudix family
summary: >-
  PTHR21340 is a family of small Nudix hydrolases built around the animal-type asymmetrical
  diadenosine tetraphosphate (Ap4A) hydrolases. Its best-characterized members are human,
  mouse, rat, pig and bovine NUDT2, C. elegans NDX-4 and the Plasmodium falciparum enzyme. They
  cleave Ap4A, and other (di)nucleoside polyphosphates with four or more phosphates, between
  the third and fourth phosphate, always releasing ATP (AMP and ATP from Ap4A). Mammalian and
  nematode Ap4A hydrolases also hydrolyse 5-phosphoribosyl 1-pyrophosphate (PRPP) at the same
  active site. Their accepted physiological role is to keep intracellular Ap4A low. Catalysis
  runs through the Nudix box glutamates, and in C. elegans NDX-4 the Gln substitution of the
  most important of them (E56) cuts kcat about 100,000-fold. The PANTHER tree is rooted at
  LUCA, with an Archaea-Eukaryota clade that holds all the characterized eukaryotic enzymes
  and a eubacterial clade of mostly uncharacterized proteins. UniProt's PANTHER
  cross-references (from HMM scoring) also put some divergent members in subfamily SF0 that
  are not leaves of the reference tree. These are Thermus thermophilus Ndx1, which prefers
  diadenosine hexaphosphate but also produces ATP and AMP from Ap4A, and the
  nucleocytoplasmic DNA virus Nudix enzymes. Of the viral enzymes, African swine fever virus
  g5R prefers diphosphoinositol polyphosphates and decaps RNA-linked mRNA caps. UniProt
  also maps E. coli NudB, a dihydroneopterin triphosphate pyrophosphatase, to SF0, but
  PANTHER's own tree places it in a different family (PTHR43736).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The characterized members of the Archaea-Eukaryota clade (NUDT2 orthologs, NDX-4,
  Plasmodium Ap4A hydrolase) share asymmetrical Ap4A hydrolase activity. The one
  characterized bacterial member, Thermus Ndx1, also releases ATP from Ap4A but prefers Ap6A.
  Three groups depart from the core function. (1) African swine fever virus g5R and the other
  large DNA virus homologs (mimivirus L375, iridovirus 414L/111R), which UniProt places in SF0
  but which are not leaves of the reference tree. g5R prefers diphosphoinositol
  polyphosphates and has mRNA decapping activity. (2) The actinobacterial subfamily SF7
  (Mycobacterium Rv3733c, Streptomyces SCO1203), which has no characterized member. (3) E.
  coli NudB (dihydroneopterin triphosphate and dATP pyrophosphatase). UniProt cross-references
  NudB to SF0, but the PANTHER 19 tree and classification files put it in PTHR43736:SF1, so
  its folate-pathway function is not evidence about this family. Without these, the family is
  coherent for the asymmetrical (di)nucleoside tetraphosphate hydrolase activity. The
  product-based AMP and ATP biosynthetic process terms at the root node are not family
  functions.
