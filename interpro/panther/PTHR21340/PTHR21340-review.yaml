residue_sites:
- site_id: nudix_catalytic_glutamates
  label: Nudix box catalytic glutamates
  description: >-
    The two glutamates of the Nudix box REUXEE segment (ndx-4 Nudix box 37-58,
    GHVDPGEDEWQAAIRETKEEAN) that bind the essential divalent cation and position the
    attacking water at the P4 phosphate. E56 is the most critical: Gln substitution lowers
    kcat about 100,000-fold. E52Q lowers it about 1,000-fold. Km is unchanged in both, so
    these are catalytic residues, not substrate-binding residues. The equivalent glutamates are
    human NUDT2 E58/E62, Plasmodium E64/E68 and Thermus Ndx1 E46/E50. In Ndx1, mutagenesis
    likewise identifies Glu-46 and Glu-50 as catalytic.
  anchor:
    id: UniProtKB:Q9U2M7
    label: ndx-4
    organism: Caenorhabditis elegans
  anchor_sequence_version: 1
  site_source: LITERATURE
  residues:
  - position: 52
    expected:
    - E
    role: Nudix box glutamate (metal ligand), catalytic
  - position: 56
    expected:
    - E
    role: Nudix box glutamate (metal ligand), principal catalytic residue
  required_for:
  - term:
      id: GO:0004081
      label: bis(5'-nucleosyl)-tetraphosphatase (asymmetrical) activity
    strength: CONTRIBUTES
    rationale: >-
      Nudix hydrolysis runs through a metal-activated water, and the REUXEE glutamates
      coordinate that metal. Replacing E56 with Gln drops kcat about 100,000-fold without
      changing Km, which in practice abolishes catalysis. Active-site mutants of ndx-4 have no
      activity against either nucleotide or PRPP substrates. The mechanism would justify
      REQUIRED, but the strength is kept at CONTRIBUTES because no natural member is known
      that lacks both these glutamates and the activity. Without such a negative control the
      site cannot be validated as a discriminator.
    supported_by:
    - reference_id: PMID:12475970
      supporting_text: >-
        the wild type k(cat) of 23 s(-1) was reduced by 10(5)-, 10(3)-, and 30-fold,
        respectively, by replacement of the conserved P(4)-phosphate-binding catalytic
        residues Glu(56), Glu(52), and Glu(103) by Gln
    - reference_id: PMID:12370170
      supporting_text: >-
        Active site mutants of the Caenorhabditis elegans diadenosine tetraphosphate
        hydrolase had no activity
    - reference_id: PMID:15024014
      supporting_text: >-
        Glu-46 and Glu-50 were conserved residues in the Nudix motif and were involved in
        catalysis
  positive_controls:
