notes: >-
  Tree topology, the root position of PTN000482012 and the PTHR43736 placement of
  PTN005180687 come from the PANTHER 19 treeinfo service. tree_check.py regenerates them into
  PTHR21340-tree-check.txt. PANTHER 19's own classification files put P0AFC0 (nudB) in
  PTHR43736:SF1 and O69700 (Rv3733c) in PTHR21340:SF7. UniProt's cross-references disagree
  for nudB (PTHR21340:SF0) and give Rv3733c only at family level. The viral members (ASFV g5R,
  mimivirus L375, IIV-6 414L) and Thermus Ndx1 are not leaves of the 55-leaf reference tree.
  Their SF0 assignment comes from UniProt's PANTHER cross-references, and the InterPro entry
  list also places IIV-3 111R (Q196U9) and phage T4 y06L (P32271) in SF0, although UniProt
  gives them no PANTHER cross-reference. IBA recipients of PTN000482012 (paint_uniprot GAF)
  include all 55 reference leaves, including the SF7 actinobacterial proteins and several
  bacterial paralog sets (Chloroflexus x3, Streptomyces x2 in SF0). Nudix box glutamate
  positions were read from current UniProt sequences: ndx-4 E52/E56 (v1), NUDT2 E58/E62 (v3),
  Plasmodium C0H4F3 E64/E68 (v1), Thermus Ndx1 E46/E50 (v1), ASFV g5R E147/E151 (v1, UniProt
  ACT_SITE 147). No negative control is recorded because no naturally Nudix-box-degenerate
  member is known, so the site's requirement strength is CONTRIBUTES rather than REQUIRED. The ASFV g5R decapping and diphosphoinositol polyphosphatase activities
  (PMID:19695654, PMID:11773415) are member-specific. They are recorded in the summary and not
  assessed as family terms.
