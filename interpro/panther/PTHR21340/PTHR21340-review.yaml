  seeds:
  - id: WB:WBGene00003581
    label: ndx-4
    organism: Caenorhabditis elegans
  assessment: WRONG_NODE
  assessment_reason: >-
    The only seed is C. elegans ndx-4, and its own experimental annotation to this term rests
    on AMP being one product of Ap4A hydrolysis in vitro. Releasing a product during
    catabolism of a signalling dinucleotide is not participation in AMP biosynthesis, a
    pathway carried out by de novo and salvage purine synthesis. The ndx-4 gene review marks
    both its IDA rows and this IBA as over-annotations (ROLE_CONFLATION /
    TERM_SCOPING_PROBLEM). The appropriate process for the clade is GO:0015967 diadenosine
    tetraphosphate catabolic process. The seed evidence supports this term at no node, so the
    root placement passes a product-based process to all 55 reference leaves, eukaryotic,
    archaeal and bacterial, including the uncharacterized SF7. Recommended fix: withdraw the
    IBD, or replace it with GO:0015967 at the Archaea-Eukaryota node (PTN001084988).
