family_id: PANTHER:PTHR46047
family_name: TYROSINE-PROTEIN PHOSPHATASE NON-RECEPTOR TYPE 61F
preferred_name: PTPN1/PTPN2 non-receptor protein tyrosine phosphatase family
summary: >-
  PTHR46047 is a compact animal non-receptor protein tyrosine phosphatase family
  containing human PTPN2/TC-PTP, human PTPN1/PTP1B and Drosophila Ptp61F. The
  conserved catalytic role is removal of phosphotyrosine from
  receptor and non-receptor protein kinases. Human PTPN1 is anchored to the
  cytoplasmic face of the ER and acts on receptors at ER-plasma membrane or
  ER-endosome contact sites as well as PERK during the ER unfolded protein
  response. Human PTPN2 encodes both an ER/ERGIC isoform and a nuclear-cytosolic
  isoform that dephosphorylates STATs, JAKs and several receptor tyrosine kinases.
functional_coherence: COHERENT
coherence_reason: >-
  All reviewed PANTHER members are catalytically active cytoplasmic-domain
  protein tyrosine phosphatases. The two human paralogous subfamilies differ
  mainly in non-catalytic targeting sequences and substrate emphasis: PTPN1 is
  a constitutive ER-tail-anchored phosphatase, whereas PTPN2 has a TC48
  ER/ERGIC isoform and a TC45 nuclear-cytoplasmic isoform. PAINT correctly adds
  PTPN1-specific ER, early-endosome and PERK-UPR assertions and prunes the
  root nucleus assertion from the PTPN1 branch.
