  name:
    name: Non-receptor type tyrosine-specific phosphatase
    short: NR_tyrosine_phosphatase
  description:
  - text: This family of proteins includes non-receptor type tyrosine-specific phosphatases
      involved in a variety of cellular processes. They dephosphorylate receptor and
      non-receptor protein tyrosine kinases, regulating signaling pathways related
      to hematopoiesis, inflammation, cell proliferation and differentiation, glucose
      homeostasis, and immune system development. They play roles in T-cell receptor
      signaling, cytokine-mediated signaling, and growth factor receptor signaling,
      including negative regulation of insulin, EGF, and PDGF receptors. Some members
      are involved in the endoplasmic reticulum unfolded protein response and cell
      reorganization.
