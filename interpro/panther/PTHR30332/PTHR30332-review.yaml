term_assessments:
- assessed_term:
    id: GO:0015627
    label: type II protein secretion system complex
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for the GspD secretins of SF24 and the XpsD secretin of SF25. It must not reach the
    injectisome secretins of SF4 and SF5, the piliation secretins of SF17, or the filamentous-phage
    pIV proteins that share SF24 with GspD and belong to a phage, not to a secretion system.
  applicable_subfamilies:
  - id: PANTHER:PTHR30332:SF24
    label: SECRETIN GSPD-RELATED
  - id: PANTHER:PTHR30332:SF25
    label: SECRETIN XPSD
  supported_by:
  - reference_id: PMID:29042496
    supporting_text: class averages revealed that XcpQ is a pentadecameric secretin complex
  - reference_id: PMID:19815547
    supporting_text: we investigated HxcQ, the OM component of the second Pseudomonas aeruginosa
      type II secretion system
- assessed_term:
    id: GO:0008320
    label: protein transmembrane transporter activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The secretin forms the channel itself, so the transport activity belongs to it rather than to
    the machine as a whole; it is asserted for the type II secretion secretins of SF24 and SF25,
    where the pore has been resolved (a pentadecameric XcpQ ring, dodecameric Klebsiella and Vibrio
    secretins) and where loss of the secretin blocks export. It is left unadjudicated for the
    injectisome and piliation secretins of SF4, SF5 and SF17, whose conduits carry a needle or a
    pilus fibre: this review covers the type II secretion branch, so a claim either way for them
    belongs to a review of their own, and modules/bacterial_type_iii_secretion_injectisome.yaml,
    which grounds its secretin on this family at family level, will need that subfamily-scoped
    adjudication before its GO:0008320 assertion is covered here. It is not asserted for the
    filamentous-phage pIV proteins of SF24, which export an assembled virion rather than a protein.
  applicable_subfamilies:
  - id: PANTHER:PTHR30332:SF24
    label: SECRETIN GSPD-RELATED
  - id: PANTHER:PTHR30332:SF25
    label: SECRETIN XPSD
  supported_by:
  - reference_id: PMID:29042496
    supporting_text: class averages revealed that XcpQ is a pentadecameric secretin complex
  - reference_id: PMID:23188826
    supporting_text: The exoproteins are secreted across the outer membrane via a large
      translocation channel, the secretin, which typically adopts a dodecameric structure
notes: >-
  No family-level scope is asserted for the generic term GO:0015628's parent GO:0009306 protein
  secretion, although it is true of every member: the gene reviews refine it to the
  system-specific term where the system is known, as the XcpQ review does for the InterPro2GO row
  derived from the secretin domain shared with the type III secretion secretins, so a FAMILY_WIDE
  scope here would contradict them. The node assessment for PTN001251149 records why PAINT is
  nevertheless right to hold the generic term at a node above the system-specific ones.
  Used by modules/bacterial_type_ii_secretion.yaml for the GspD secretin annoton, with
  P. aeruginosa XcpQ (P35818), P. putida KT2440 XcpQ (Q88P07) and Klebsiella PulD (P15644) as
  exemplars; the module grounds that annoton on InterPro IPR013356 (the GspD-specific entry) rather
  than on this PANTHER family, because PTHR30332 also holds the type III secretion, piliation and
  filamentous-phage secretins. This family is the clearest case of the shared-machinery problem in
  the T2SS: the secretin fold is used by at least four different systems, and PAINT handles it by
  node separation rather than by subfamily restriction. Secretin stoichiometry differs between
  systems and between members (fifteen subunits for XcpQ, twelve for the Klebsiella and Vibrio
  secretins), which is recorded in the XcpQ gene review rather than as a family-level claim. The
  SF17 piliation branch and the T3SS nodes are assessed here for completeness but are outside the
  module's scope.
