family_id: PANTHER:PTHR30332
family_name: PROBABLE GENERAL SECRETION PATHWAY PROTEIN D
preferred_name: Secretins of type II and type III secretion systems, pili and filamentous phages
summary: >-
  Secretins: outer-membrane proteins that oligomerise into large ring-shaped channels through which
  a macromolecule crosses the outer membrane. Members share a C-terminal secretin domain, which
  drives multimerisation and forms the pore, and a series of periplasmic N-domains that reach down
  to the inner-membrane machinery. The family spans several systems: the GspD secretins of type II
  secretion (SF24, with P. aeruginosa XcpQ, Klebsiella PulD, Aeromonas ExeD; the Xanthomonas XpsD
  secretin is separated as SF25), the SctC secretins of type III secretion injectisomes (SF4, SF5),
  secretins of type IV piliation systems (SF17), and the pIV virion-export proteins of filamentous
  phages, which PANTHER places in SF24 beside GspD. PAINT keeps the T2SS, T3SS and generic
  protein-secretion claims at separate nodes, with Ricinus losses below the T3SS node.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Pore formation in the outer membrane is shared, but what passes through is not: folded exoproteins
  in type II secretion, the injectisome needle and unfolded effectors in type III secretion, a pilus
  fibre in piliation systems, and an assembled virion in filamentous phages. The system-specific
  complex and process terms therefore cannot be family-wide.
