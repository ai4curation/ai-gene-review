family_id: PANTHER:PTHR10225
family_name: HYALURONAN  RECEPTOR
preferred_name: CD44/LYVE1 link-domain hyaluronan receptor family
summary: PTHR10225 contains the CD44 and LYVE1 hyaluronan receptor branches, both type-I
  membrane glycoproteins with an extracellular Link domain that binds hyaluronan. The
  family-wide PAINT rows for plasma membrane, hyaluronan binding and broad transmembrane
  signaling receptor activity fit both human CD44 and LYVE1. A separate CD44 branch carries
  the PAINT annotations for MIF/CD74 cytokine receptor signaling, ERK activation,
  inflammation and CD44-specific membrane microdomains; those terms correctly stay inside
  PTHR10225:SF6 and are not inherited by LYVE1.
review_status: COMPLETE
functional_coherence: MOSTLY_COHERENT
coherence_reason: CD44 and LYVE1 share Link-domain hyaluronan binding at the plasma membrane,
  but the CD44 branch has acquired additional cytokine-receptor and signaling-scaffold roles
  in CD74/MIF receptor complexes that are not shared by LYVE1.
