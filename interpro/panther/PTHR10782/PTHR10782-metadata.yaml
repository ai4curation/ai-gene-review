  name:
    name: Protein Inhibitor of Activated STAT (PIAS)
    short: PIAS
  description:
  - text: The PIAS protein family includes E3 SUMO-protein ligases that play a crucial
      role in transcriptional coregulation across various cellular pathways, including
      the STAT, p53, Wnt, and steroid hormone signaling pathways. Members of the family
      function as SUMO-tethering factors, stabilizing the interaction between UBE2I
      and substrates. They are involved in gene silencing, sumoylation of nuclear
      hormone receptors, and DNA damage response. The family also contributes to the
      regulation of transcription factors and chromatin structure, influencing processes
      like cell growth, stress responses, and developmental pathways. The PIAS family
      is characterized by domains such as the SP-RING-type zinc finger, LXXLL motif,
      and occasionally the SAP and PINIT domains, which are essential for their E3
      ligase activity, nuclear targeting, and transcriptional coregulator interactions.
