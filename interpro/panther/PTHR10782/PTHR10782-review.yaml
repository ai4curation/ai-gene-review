    DNA binding. PIAS3 does the same to Stat3, and Su(var)2-10 binds and counteracts activated
    STAT92E, so inhibition of transcription factors is shared across the vertebrate and insect
    members. The ZMIZ coactivators are correctly excluded. For GEI-17 the term is plausible but
    not demonstrated. The term covers inhibition by binding or by post-translational modification.
    A binding route through the SAP domain is not supported: GEI-17 has no detectable SAP domain,
    and in PIAS1 the ligase-independent inhibition does not need it anyway, mapping instead to a
    region around an acidic cluster (PMID:24036127). GEI-17 keeps a PIAS1-like SIM-plus-acidic
    module at the equivalent position after the SP-RING, so binding through that module is not
    excluded, though untested. A modification route is also plausible: GEI-17 inhibits formation of piRNA transcription condensates
    built by the USTC transcription complex in a SUMOylation-dependent way (PMID:40316696), but
    whether it SUMOylates USTC components directly is not shown in the cached abstract. The gei-17
    gene review therefore leaves its IBA UNDECIDED rather than refuting it. Transcription-factor
    inhibition by PIAS proteins is not limited to STATs (MITF and others), so the activity need not
    depend on a JAK-STAT pathway.
  supported_by:
  - reference_id: PMID:9388184
    supporting_text: "PIAS3 blocked the DNA-binding activity of Stat3 and inhibited Stat3-mediated gene activation."
  - reference_id: PMID:11504941
    supporting_text: "dPIAS counteracts the activated STAT92E"
