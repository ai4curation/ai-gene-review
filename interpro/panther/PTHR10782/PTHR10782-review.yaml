  assessment: SOUND
  assessment_reason: >-
    In the PANTHER 19 tree, PTN000081660 is the family root (Eukaryota speciation). Its seeds span
    fungi, plants, nematode, insect and vertebrates, so a root placement is the only one that
    covers them. The mechanism is the shared SP-RING, which binds Ubc9 and activates the
    E2~SUMO thioester. The four zinc ligands (PIAS1 C351/H353/C374/C377) are conserved in every
    reviewed member aligned here: PIAS1-4, ZMIZ1/2, Su(var)2-10, GEI-17, yeast Siz1, Pli1,
    Arabidopsis SIZ1, PIAL1 and PIAL2. No branch therefore shows a catalytic-site loss that would
    call for an IRD. Two clades inherit the term with weaker support. (1) The bilaterian ZMIZ clade
    (PTN000081664: ZMIZ1, ZMIZ2, tonalli, miz-1) has no ZMIZ seed. hZimp10 increases AR sumoylation
    only modestly, and the authors could not conclude that it acts directly as an E3. Gene reviews
    for ZMIZ1/2 should treat the IBA as non-core, not remove it. (2) PIAL1/PIAL2 are chain-forming
    ligases. That is a mode of SUMO ligase activity, not a different activity, and both are seeds.
  supported_by:
  - reference_id: PMID:11572779
    supporting_text: "Siz1 and the related protein Siz2 promote SUMO conjugation to different substrates at different stages of the cell cycle and, together, are required for most SUMO conjugation in yeast."
  - reference_id: PMID:11583632
    supporting_text: "PIAS1 catalyzed the sumoylation of p53 both in U2OS cells and in vitro in a domain-dependent manner."
  - reference_id: PMID:25475837
    supporting_text: "Moreover, the L/A mutation of the SP-RING within GEI-17 drastically diminishes its SUMO E3 activity."
