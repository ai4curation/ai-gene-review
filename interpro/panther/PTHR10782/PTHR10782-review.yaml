  diverged_from_family: true
  divergence_description: >-
    The mode of ligation differs. PIAL1 and PIAL2 are characterised as SUMO chain-forming ("E4")
    ligases, not as ligases that transfer single SUMO moieties onto substrates. This is still SUMO
    ligase activity (GO:0061665): SUMO is transferred to an acceptor lysine that sits on SUMO.
