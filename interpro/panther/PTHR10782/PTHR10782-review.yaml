  required_for:
  - term:
      id: GO:0061665
      label: SUMO ligase activity
    strength: CONTRIBUTES
    rationale: >-
      The SP-RING binds Ubc9 and positions the E2~SUMO thioester for transfer, as RING E3s do.
      Zinc coordination holds the RING fold together, so mutating the ligands breaks the Ubc9
      interface and ligase activity without affecting the separate SUMO- and substrate-binding
      surfaces.
    supported_by:
    - reference_id: PMID:11583632
      supporting_text: PIAS1 that was mutated in the RING finger-like domain bound p53 and SUMO-1,
        but not Ubc9.
    - reference_id: PMID:11572779
      supporting_text: Siz1, Siz2, and the PIAS (protein inhibitor of activated STAT) proteins form
        a conserved family defined by an unusual RING-related motif.
