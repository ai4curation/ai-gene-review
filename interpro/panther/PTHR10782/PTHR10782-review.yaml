    The placement follows from the seeds, PIAS1 (vertebrate) and Su(var)2-10 (insect), whose last
    common ancestor in this tree is the eumetazoan PIAS node. The JAK-STAT role is well supported
    in both lineages. The nematode branch is the problem: C. elegans has no JAK, and its STAT STA-1
    works through a JAK-independent pathway. GEI-17 (leaf PTN000081832, under the ecdysozoan node
