notes: >-
  Tree topology, subfamily assignments and PTN positions come from the PANTHER 19 treeinfo service,
  queried both filtered to model organisms and unfiltered. The unfiltered tree is needed to see
  PTN001324782 (Metazoa-Choanoflagellida) and PTN000845825 (eumetazoan PIAS root), which the
  model-organism view collapses. Seed ids were resolved with the PANTHER organism classification
  files and UniProt xref queries. PANTHER's family name (ZINC FINGER MIZ DOMAIN-CONTAINING PROTEIN)
  comes from ZMIZ and does not reflect the family's main activity. Family background (SP-RING ligase
  acting like a RING E3, SAP DNA-binding domain, coregulator effects often independent of the RING, and
  STAT interaction as the historical but not the defining activity) follows the Palvimo 2007 review
  (PMID:18031232, abstract only). The InterPro LLM description
  ("Protein Inhibitor of Activated STAT") gives too much weight to metazoan STAT biology. Fly
  Su(var)2-10 is cited as Q7KNF5 to match its gene review; PANTHER's own classification uses
  A1Z7P5, and both carry SF94. The family deep-research report (OpenScientist) recommended demoting
  chromatin to nucleus and claimed universal subfamily GO mappings. The chromatin recommendation is
  rejected here (see the GO:0000785 node and term assessments). Its subfamily GO counts were not
  re-derived. SP-RING zinc-ligand conservation was checked by pairwise local alignment (BLOSUM62)
  of UniProt canonical sequences against the PIAS1 SP-RING (residues 301-420). The GEI-17 member
  exception on GO:0046426 is supported by the C. elegans primary paper (PMID:28874466); the Liongue and
  Ward 2013 JAK-STAT evolution review (PMID:24058787) does not discuss PIAS proteins or nematode JAK
  absence, so it is not cited for that exception. A cross-gene briefing on JAK-STAT taxon scope across
  the STAT, JAK and PIAS families and the C. elegans and Dictyostelium STAT modules is at
  https://claude.ai/artifact/4MLfbbbWWnLchDvspwdPuM.
