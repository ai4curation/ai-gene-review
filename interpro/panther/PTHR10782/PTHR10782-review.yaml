    lacks. An IRD for the C. elegans/nematode lineage, or a NOT annotation on GEI-17, is
    recommended. No subfamily is named as affected because SF94 contains both GEI-17 and the valid
    seed Su(var)2-10; GEI-17 is instead recorded as a member exception on the GO:0046426 term
