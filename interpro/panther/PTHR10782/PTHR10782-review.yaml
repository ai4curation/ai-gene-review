  assessment: SOUND
  assessment_reason: >-
    The seeds sit on both sides of the PIAS/ZMIZ split (gei-17 on one, tonalli on the other) and
    include budding yeast, so the root placement follows from them. The family deep-research
    report calls this term over-annotated because Siz1 also sumoylates bud-neck septins. That
    argument does not hold. An is_active_in chromatin assertion does not claim that chromatin is
    the only location, and Siz1's best-studied nuclear substrate, PCNA, is sumoylated when it is
    loaded onto DNA. The SAP DNA-binding motif and the chromatin-level roles of PIAS proteins
    (heterochromatin and chromosome structure for Su(var)2-10, mitotic chromosomes for GEI-17,
    Brahma-complex interactions for tonalli) fit chromatin as a site of action across the family.
