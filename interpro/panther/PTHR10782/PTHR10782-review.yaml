residue_sites:
- site_id: spring_zinc_site
  label: SP-RING zinc ligands
  description: >-
    The four zinc-coordinating residues of the SP-RING (MIZ-type) zinc finger, from UniProt binding
    features on PIAS1. Mutating C351 abolishes UBE2I binding and almost abolishes PIAS1-promoted p53
    sumoylation, while SUMO1 and p53 binding are kept. Pairwise alignment to the PIAS1 SP-RING (this
    review, Biopython local alignment) shows all four ligands conserved in PIAS2, PIAS3, PIAS4,
    ZMIZ1 (C758/H760/C781/C784), ZMIZ2 (C616/H618/C639/C642), Su(var)2-10 (Q7KNF5 C341/H343/C364/C367),
    GEI-17 (C431/H433/C454/C457), yeast Siz1, Pli1, Arabidopsis SIZ1, PIAL1 and PIAL2. No reviewed
    family member lacks the site, so there is no natural negative control. That is why the strength
    is CONTRIBUTES and not REQUIRED.
