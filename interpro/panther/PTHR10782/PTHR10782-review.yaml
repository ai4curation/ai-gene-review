family_id: PANTHER:PTHR10782
family_name: ZINC FINGER MIZ DOMAIN-CONTAINING PROTEIN
preferred_name: PIAS/Siz family of SP-RING SUMO ligases (PIAS1-4, ZMIZ1/2, Siz1/Siz2/Pli1, plant SIZ1 and PIAL1/2)
summary: >-
  Eukaryotic SP-RING (Siz/PIAS RING, also called MIZ-type zinc finger) proteins. The SP-RING is
  a RING-related domain that binds the SUMO E2 Ubc9/UBE2I and, like a RING E3, activates the
  E2~SUMO thioester for transfer to a substrate lysine; it has no catalytic cysteine and forms no
  E3~SUMO intermediate. Most members also carry an N-terminal SAP DNA-binding motif and a PINIT
  domain. The founding members, budding yeast Siz1 and Siz2, are E3-like factors that together
  account for most SUMO conjugation in yeast (septins at the bud neck in G2/M, PCNA during S
  phase). Fission yeast Pli1, Arabidopsis and rice SIZ1/SIZ2, C. elegans GEI-17, Drosophila
  Su(var)2-10 and vertebrate PIAS1-4 are SUMO E3 ligases for many nuclear substrates. Arabidopsis
  PIAL1 and PIAL2 are SP-RING ligases specialised for SUMO chain formation ("E4" activity).
  Vertebrate ZMIZ1 and ZMIZ2 and their invertebrate orthologs (Drosophila tonalli, C. elegans
  miz-1) form a separate bilaterian clade of transcriptional coregulators. They keep an intact
  SP-RING zinc site, but direct SUMO ligase activity has not been firmly shown. In vertebrates
  and flies the PIAS proteins also bind activated STAT dimers and block STAT DNA binding, a
  coregulator activity that often does not need the SP-RING. Plants, fungi and protists have no
  STAT-PIAS relationship of this kind.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SUMO ligase activity and protein sumoylation are shared across the family. Ligase activity is
  shown directly for fungal (Siz1/Siz2, Pli1), plant (SIZ1, PIAL1/2), nematode (GEI-17), insect
  (Su(var)2-10) and vertebrate (PIAS1-4) members. The four SP-RING zinc ligands of PIAS1 (C351,
  H353, C374, C377) are conserved in every reviewed member checked, ZMIZ1/2 and PIAL1/2
  included, so no lineage looks like a pseudoligase. The exceptions are not losses of ligase
  activity. Two groups differ in emphasis or mode: (1) the ZMIZ clade (SF7 ZMIZ1, SF38 ZMIZ2,
  and tonalli/miz-1 within SF4), which act mainly as transcriptional coactivators and whose
  ligase activity is only weakly supported; (2) plant PIAL1 (SF68) and PIAL2 (in SF4), which
  extend SUMO chains, still within SUMO ligase activity. STAT inhibition and JAK-STAT regulation
  belong to the metazoan PIAS clade (SF9, SF10, SF11, SF12, SF101, SF94). Even there, C. elegans
  GEI-17 inherits the JAK-STAT term although nematodes have no JAK.
