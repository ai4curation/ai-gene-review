    of the family, so the term is safe by default. It does not hold for orthologous clades that kept the
    fold and lost inhibition; the two established on direct evidence here, corticosteroid-binding globulin
    and angiotensinogen, are listed as member exceptions, as are thyroxine-binding globulin and serpin H1 on the evidence of its own gene reviews. The fold-level InterPro signature IPR000215 and
    the clade-A PAINT node PTN008970140 cannot separate these clades from their inhibitory relatives.
