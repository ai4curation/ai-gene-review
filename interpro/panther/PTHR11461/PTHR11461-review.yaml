      reactive-centre loop without being inhibited. The loss applies to the whole SERPINA6 clade below PTN008322172,
      where an IRD is requested.
    supported_by:
    - reference_id: PMID:2370299
      supporting_text: unlike A1-PI, CBG does not alter the activity of this enzyme
