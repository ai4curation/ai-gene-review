notes: 'Scope: written with the SERPINA6 gene review; only the PAINT rows on the lineages of SERPINA6, AGT
  and SERPINC1 that bear on inhibitor activity and secretion are assessed. Not assessed: the other GO:0004867
  IBD rows (PTN000156127, PTN002479231, PTN008322214), the existing IRD at PTN000156704 (SERPINB13 clade)
  and the process and location rows of clade B, E, F and H serpins. Lead for a later pass, not asserted here: serpin H1 (SF27) inherits GO:0004867 from PTN000156127 and its gene review marks
  the term over-annotated, whereas the SERPINA6 and AGT reviews remove it, so the three reviews should be
  harmonised when SERPINH1 is revisited.'
