family_id: PANTHER:PTHR11461
family_name: SERINE PROTEASE INHIBITOR, SERPIN
preferred_name: Serpins (serine protease inhibitors and their non-inhibitory relatives)
summary: 'The serpin superfamily. Most members are suicide-substrate inhibitors of serine (and some cysteine)
  proteases: the protease cleaves an exposed reactive-centre loop, the loop inserts into beta-sheet A (the
  stressed-to-relaxed transition) and the protease is trapped in a covalent complex. A minority of members
  keep the fold but do not inhibit. In the chordate clade-A group these include corticosteroid-binding
  globulin (SERPINA6), which carries cortisol and uses loop cleavage to release it, thyroxine-binding globulin
  (SERPINA7), and angiotensinogen
  (AGT), the precursor of angiotensin peptides; elsewhere in the family the collagen chaperone SERPINH1 is
  a further example. This review covers the PAINT assertions that reach the members reviewed in this
  repository; it is not a survey of all 108 subfamilies.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'Protease inhibition by the suicide-substrate mechanism is the ancestral and majority
  function, and the PAINT IBD rows for it are seeded only by inhibitory members. The divergent groups are
  whole orthologous clades that keep the fold and have lost inhibition: corticosteroid-binding globulin
  (SF34, hormone carrier), angiotensinogen (SF13, hormone precursor) and serpin H1 (SF27, collagen chaperone).
  PAINT already records one such loss in the family (IRD at PTN000156704) but not for these clades.'
