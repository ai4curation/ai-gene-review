family_id: PANTHER:PTHR42879
family_name: 3-OXOACYL-(ACYL-CARRIER-PROTEIN) REDUCTASE
preferred_name: FabG-type 3-oxoacyl-ACP reductase / SDR family
summary: >-
  Classical SDRs including bacterial FabG, the NADPH-dependent ketoreductase of type II fatty acid
  synthesis (P. putida FabG). The same subfamily includes 3-hydroxybutyrate dehydrogenase (P. putida
  HbdH), hydroxysteroid dehydrogenases, and B. subtilis YmfI, a carbonyl reductase that acts on the
  5-aminopentanone intermediate of the elongation factor P Lys32 modification rather than on a
  fatty-acid or steroid substrate.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  SF2 mixes FabG with other SDR activities (3-hydroxybutyrate dehydrogenase, 7-alpha-hydroxysteroid
  dehydrogenase, and the EF-P-modification carbonyl reductase YmfI). The shared feature is the
  NAD(P)-dependent oxidoreduction of a carbonyl/hydroxyl pair, not the substrate or the pathway.
reference_protein:
  id: UniProtKB:Q88LL6
  label: 3-oxoacyl-[acyl-carrier-protein] reductase
  gene_symbol: fabG
  organism: Pseudomonas putida
  gene_review: genes/PSEPK/fabG/fabG-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR42879:SF2
  label: 3-OXOACYL-[ACYL-CARRIER-PROTEIN] REDUCTASE FABG
  description: FabG, HbdH and related SDRs.
  representative_members:
  - id: UniProtKB:Q88LL6
    gene_symbol: fabG
    organism: Pseudomonas putida
    gene_review: genes/PSEPK/fabG/fabG-ai-review.yaml
  - id: UniProtKB:P0AEK2
    label: 3-oxoacyl-[acyl-carrier-protein] reductase FabG
    gene_symbol: fabG
