notes: >-
  Updated 2026-11-02 while curating the efp_translation_stall_rescue module, whose B. subtilis EF-P
  activation variant uses YmfI (O31767), an SF2 member. The earlier note that no PAINT IBD rows exist
  for this family was based on an empty local slice; a refreshed PTHR42879-paint.tsv has 11 IBD rows,
  of which the two bearing on SF2 are assessed above. The remaining nodes (PTN000672121,
  PTN000673022, PTN002449501, PTN002462176, PTN002462799, PTN008676316) concern eukaryotic SDRs,
  BacG antibiotic biosynthesis, mycofactocin/quinone and NAD-dependent dehydratase claims in other
  subfamilies and are not assessed here. PTHR42879 is too heterogeneous to ground any module step;
  the module names YmfI as a concrete UniProt gene product (UniProtKB:O31767) and grounds that step on
  no family or signature at all. The signature that does separate the YmfI-type clade, should
  signature-level grounding ever be wanted, is NCBIfam NF047420 (EF_P_mod_YmfI) from this entry's own
  DR lines; the module does not currently use it.
