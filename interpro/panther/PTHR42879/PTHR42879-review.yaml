  diverged_from_family: false
node_assessments:
- node_id: PANTHER:PTN002449287
  asserted_term:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  evidence: IBD
  negated: false
  paint_snapshot: '20260530'
  seeds:
  - id: UniProtKB:P0AEK2
    label: 3-oxoacyl-[acyl-carrier-protein] reductase FabG
    gene_symbol: fabG
    organism: Escherichia coli K-12
  - id: UniProtKB:P05707
    gene_symbol: hsdH
    organism: Comamonas testosteroni
  assessment: SOUND
  assessment_reason: >-
    The node asserts only the shared SDR chemistry (NAD(P)-dependent oxidoreduction at a CH-OH /
    carbonyl pair), which is what the Rossmann-fold catalytic tetrad of these enzymes does, and it
    deliberately stops short of naming a substrate. It therefore holds even for members whose
    substrate is not a fatty-acyl or steroid, including B. subtilis YmfI, whose reaction reduces the
    5-aminopentanone carbonyl of modified EF-P to 5-aminopentanol.
- node_id: PANTHER:PTN001211919
  asserted_term:
    id: GO:0030497
    label: fatty acid elongation
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  evidence: IBD
  negated: false
  paint_snapshot: '20190227'
  seeds:
  - id: UniProtKB:P0AEK2
    label: 3-oxoacyl-[acyl-carrier-protein] reductase FabG
    gene_symbol: fabG
    organism: Escherichia coli K-12
  - id: UniProtKB:P0A2C9
    label: 3-oxoacyl-[acyl-carrier-protein] reductase FabG
    gene_symbol: fabG
    organism: Salmonella typhimurium
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Both seeds are enterobacterial FabG, for which fatty acid elongation is correct, but the node is
    placed high enough in the bacterial SDR clade to propagate the process claim onto members that do
    not act in fatty-acid synthesis. B. subtilis YmfI receives GO:0030497 by IBA from this node while
    its characterized role is reducing the EF-P Lys32 5-aminopentanone intermediate; B. subtilis
    carries out type II fatty acid synthesis with its own dedicated FabG (P51831). The
    molecular-function node PTN002449287 propagates safely; this process node does not. The pruning
    applies to the YmfI-type clade (the members NCBIfam separates as NF047420), not to SF2 as a
    whole: the genuine FabG members of SF2, such as P. putida FabG, are correctly annotated to
    fatty acid elongation and keep the term.
  supported_by:
  - reference_id: file:genes/BACSU/ymfI/ymfI-ai-review.yaml
    supporting_text: >-
      B. subtilis encodes its own FabG (fabG/ylpF, BSU15910, UniProt P51831, RecName
      3-oxoacyl-[acyl-carrier-protein] reductase FabG), and FabG is essential, whereas
      ymfI mutants lose only 5% of growth rate, the same slight defect as efp mutants,
      so YmfI is not doing fatty acid synthesis.
term_assessments:
- assessed_term:
    id: GO:0004316
    label: 3-oxoacyl-[acyl-carrier-protein] reductase (NADPH) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    FabG within SF2, as type_ii_fatty_acid_synthesis asserts on the base family. SF2 also contains
    HbdH and HSDHs.
  applicable_subfamilies:
  - id: PANTHER:PTHR42879:SF2
    label: 3-OXOACYL-[ACYL-CARRIER-PROTEIN] REDUCTASE FABG
  supported_by:
  - reference_id: file:genes/PSEPK/fabG/fabG-ai-review.yaml
    supporting_text: Exact core molecular function for FabG.
  - reference_id: file:genes/PSEPK/fabG/fabG-ai-review.yaml
    supporting_text: 3-oxoacyl-[acyl-carrier-protein] reductase (NADPH) activity
  member_exceptions:
  - member:
      id: UniProtKB:O31767
      label: Uncharacterized oxidoreductase YmfI
      gene_symbol: ymfI
      organism: Bacillus subtilis 168
      gene_review: genes/BACSU/ymfI/ymfI-ai-review.yaml
    exception_reason: >-
      YmfI sits in SF2 on fold similarity but is not a 3-oxoacyl-ACP reductase. Its characterized
      reaction is carbonyl reduction of the 5-aminopentanone intermediate on Lys32 of B. subtilis
      EF-P, giving the 5-aminopentanol modification; B. subtilis has a separate FabG for type II
      fatty acid synthesis. Neither GO:0004316 nor the fatty-acid-elongation process should be
      propagated to it.
    supported_by:
    - reference_id: file:genes/BACSU/ymfI/ymfI-uniprot.txt
      supporting_text: Uncharacterized oxidoreductase YmfI
- assessed_term:
    id: GO:0030497
    label: fatty acid elongation
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Fatty acid elongation holds for the genuine FabG members of SF2, which supply the ketoreduction
    step of type II fatty acid synthesis. It does not hold for every SF2 member: the subfamily also
    contains SDRs acting on other substrates, including YmfI.
  applicable_subfamilies:
  - id: PANTHER:PTHR42879:SF2
    label: 3-OXOACYL-[ACYL-CARRIER-PROTEIN] REDUCTASE FABG
  supported_by:
  - reference_id: file:genes/PSEPK/fabG/fabG-ai-review.yaml
    supporting_text: 3-oxoacyl-[acyl-carrier-protein] reductase (NADPH) activity
  member_exceptions:
  - member:
      id: UniProtKB:O31767
      label: Uncharacterized oxidoreductase YmfI
      gene_symbol: ymfI
      organism: Bacillus subtilis 168
      gene_review: genes/BACSU/ymfI/ymfI-ai-review.yaml
    exception_reason: >-
      YmfI does not act in fatty acid synthesis; it reduces the EF-P-bound 5-aminopentanone
      intermediate, and B. subtilis has a separate essential FabG. Its GO:0030497 IBA row from
      PTN001211919 is removed in the gene review as an over-propagation.
    pruned_node_id: PANTHER:PTN001211919
    supported_by:
    - reference_id: file:genes/BACSU/ymfI/ymfI-ai-review.yaml
      supporting_text: >-
        The demonstrated YmfI substrate is a 5-aminopentanone moiety attached to EF-P
        Lys32, not a 3-oxoacyl-ACP.
