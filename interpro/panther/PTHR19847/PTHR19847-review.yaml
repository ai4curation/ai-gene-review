family_id: PANTHER:PTHR19847
family_name: DDB1- AND CUL4-ASSOCIATED FACTOR 11
preferred_name: DCAF11/WDR23 ubiquitin-ligase substrate adaptors
summary: DCAF11/WDR23 proteins serve as substrate receptors in CUL4-DDB1-associated protein regulation.
  Direct C. elegans experiments identify SKN-1 and GEN-1 regulatory relationships, with different outcomes
  for nuclear and cytoplasmic isoforms. The common WD-repeat architecture supports substrate recruitment,
  while exact substrates and regulatory outcomes cannot be assumed identical across products.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Primary worm experiments establish WDR-23 association with CUL-4/DDB-1 and isoform-dependent
  regulation of SKN-1 and GEN-1. The selected S6FN32 product retains every annotated WD repeat and the
  common 498-residue core but lacks the distinct N termini of both assayed isoforms. Thus a qualified
  adaptor assignment is supported, while localization and substrate fate remain product-specific.
