term_assessments:
- assessed_term:
    id: GO:0060090
    label: molecular adaptor activity
  scope: UNRESOLVED
  scope_reason: Direct WDR-23 interaction and substrate experiments support an adaptor mechanism in characterized
    worm isoforms; the selected product retains the common WD-repeat region. The evidence does not delimit
    every functional product across the family or establish identical substrate specificity.
  supported_by:
  - reference_id: PMID:19273594
    supporting_text: "WDR-23, which interacts with the \nCUL-4/DDB-1 ubiquitin ligase"
- assessed_term:
    id: GO:0005634
    label: nucleus
  scope: UNRESOLVED
  scope_reason: Nuclear WDR-23B and cytoplasmic WDR-23A have experimentally distinct outcomes. S6FN32
    is not identical to either tested isoform, so a universal nuclear-location grant is not justified.
  supported_by:
  - reference_id: PMID:31409866
    supporting_text: 'These opposing roles are mediated by two distinct isoforms: WDR-23A

      in the cytoplasm and WDR-23B in the nucleus.'
