  label: DDB1- AND CUL4-ASSOCIATED FACTOR 11
  description: The WDR23/DCAF11 substrate-receptor lineage has primary experimental support. S6FN32 preserves
    its common repeat region but starts downstream of the distinctive N termini of both WDR-23A and WDR-23B.
