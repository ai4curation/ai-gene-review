review_status: COMPLETE
reviewed_by: codex
review_date: '2026-09-10'
notes: The selected sequence exactly matches WDR-23A residues 74–571 and WDR-23B residues 33–530. The
  independent RACK1 donor of the ProtNLM ribosome-related GO claims is a different WD-repeat lineage;
  fold similarity does not establish ribosome association of WDR-23. The absence of a ribosome assay leaves
  that additional hypothesis unresolved rather than proving a negative.
