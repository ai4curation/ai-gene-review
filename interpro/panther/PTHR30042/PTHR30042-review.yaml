  assessment: UNRESOLVED
  assessment_reason: >-
    The placement across the family is not in doubt (every member is a KdpC
    subunit), but an enables-level MF on KdpC overstates its role. KdpC does
    not bind ATP catalytically or translocate K+ itself; it is an essential
    accessory subunit of the complex that carries this activity. The node is
    defensible only as a contributes_to statement; at the enables level it
    should not be read as KdpC's own activity.
