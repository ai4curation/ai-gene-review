family_id: PANTHER:PTHR30042
family_name: POTASSIUM-TRANSPORTING ATPASE C CHAIN
preferred_name: KdpC accessory subunit of KdpFABC
summary: >-
  KdpC is a single-transmembrane-helix subunit of the KdpFABC high-affinity
  potassium uptake complex, with a large periplasmic domain. It has no known
  homologues outside Kdp systems and no catalytic activity of its own. In E.
  coli it is essential for a functional complex and has been described as a
  catalytic chaperone that raises the ATP affinity of KdpB through a transient
  KdpB-KdpC-ATP ternary complex; its periplasmic domain has also been proposed
  to cap the KdpA pore. Its contribution to transport is therefore accessory
  and complex-dependent.
functional_coherence: COHERENT
coherence_reason: >-
  A single PANTHER subfamily (SF2) and one PAINT node with a single loss row.
  All characterized members are KdpC subunits of Kdp operons. The caution for
  this family is not heterogeneity but the level of the assertion: the
  transporter activity belongs to the assembled complex, not to KdpC alone.
