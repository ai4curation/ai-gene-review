family_id: PANTHER:PTHR30042
family_name: POTASSIUM-TRANSPORTING ATPASE C CHAIN
preferred_name: KdpC accessory subunit of KdpFABC
summary: >-
  KdpC is a single-pass accessory subunit of KdpFABC with a large periplasmic domain contacting KdpA.
  Its structural contribution supports the ATP-driven potassium pump without assigning ATP hydrolysis
  or an autonomous ion path to KdpC. Earlier E. coli experiments reported nucleotide-sensitive interactions
  and proposed a catalytic-chaperone role with KdpB; later intact-complex topology challenges that cytoplasmic-contact
  model. The detailed accessory mechanism and physiological ATP binding remain incompletely resolved.
functional_coherence: COHERENT
coherence_reason: >-
  A single PANTHER subfamily (SF2) and one PAINT node with a single loss row.
  All characterized members are KdpC subunits of Kdp operons. The caution for
  this family is not heterogeneity but the level of the assertion: the
  transporter activity belongs to the assembled complex, not to KdpC alone.
