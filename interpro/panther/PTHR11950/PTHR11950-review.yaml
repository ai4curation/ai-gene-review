family_id: PANTHER:PTHR11950
family_name: RUNT RELATED
summary: >-
  PTHR11950 contains Runt-domain transcription factors. The reviewed human members
  RUNX1, RUNX2 and RUNX3 share sequence-specific regulatory DNA binding through the
  Runt domain, heterodimerize with CBFB in core-binding-factor complexes, and regulate
  RNA polymerase II transcription from nuclear chromatin. The mammalian paralogs diverge
  most strongly in their developmental target programs: RUNX1 is prominent in
  hematopoietic and immune-cell programs, RUNX2 in osteoblast differentiation and
  ossification, and RUNX3 in several neural, immune, and tumor-suppressive contexts.
  PAINT places the shared DNA-binding and nuclear terms on the bilaterian RUNX node and
  the vertebrate developmental programs on a vertebrate RUNX node; that is a sound
  family-level placement, but the developmental processes should be interpreted as
  context-dependent outputs rather than as the core molecular activity of every member.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The Runt-domain DNA-binding transcription-factor mechanism is conserved across the
  reviewed RUNX1, RUNX2 and RUNX3 subfamilies. Specific tissue programs diverge by
  paralog and cellular context, so family-wide PAINT process rows are retained as
  inherited developmental outputs but should not by themselves define a member's core
  molecular function.
