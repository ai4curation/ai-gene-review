family_id: PANTHER:PTHR14021
family_name: IRON-SULFUR CLUSTER CO-CHAPERONE PROTEIN HSCB
preferred_name: HscB/HSC20/Jac1 J-type co-chaperone family
summary: >-
  Dedicated J-domain co-chaperones of iron-sulfur cluster biogenesis. An N-terminal
  J-domain with the HPD motif stimulates ATP hydrolysis by the partner Hsp70 (bacterial
  HscA, mitochondrial HSPA9/mortalin, yeast Ssq1), and a C-terminal three-helix domain
  binds the cluster-loaded scaffold IscU/ISCU, so HscB delivers the scaffold to the
  chaperone and couples the ATPase cycle to cluster transfer. Members are
  proteobacterial HscB (Hsc20), yeast Jac1 and the mitochondrial HSCB/HSC20 of animals
  and plants; essentially all reviewed members fall in subfamily SF15.
functional_coherence: COHERENT
coherence_reason: >-
  The J-domain HPD motif and the scaffold-binding C-terminal domain are conserved
  across bacterial and eukaryotic members, which differ only in compartment.
