  - id: UniProtKB:P9WIL5
    label: panC
    organism: Mycobacterium tuberculosis
  assessment: SOUND
  assessment_reason: >-
    The seeds are bacterial, fungal and plant PanC enzymes. In the PAINT UniProt GAF the node's
    descendants carrying the term are all SF1 pantothenate synthetases, so no cytidylate kinase
    inherits it. Pan6 is among the seeds through its own experimental annotation, as expected.
    The pantothenate biosynthetic process term at the same node (GO:0015940) is equally sound.
- node_id: PANTHER:PTN000480631
  asserted_term:
    id: GO:0004592
    label: pantoate-beta-alanine ligase activity
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  paint_snapshot: '20190820'
  assessment: UNRESOLVED
  assessment_reason: >-
    This is an IRD (negated) row: it stops PanC activity from reaching the bacterial Cmk clade,
    which is right for the monofunctional cytidylate kinases. In the PAINT UniProt GAF the
    cyanobacterial PanCY fusions (Synechocystis Q55074, Gloeobacter Q7NJM6) descend from this
    node too. They receive cytidine metabolism (GO:0015949) from it, so the NOT also reaches
    them. UniProt annotates both as bifunctional, with a Pantoate_ligase domain (PF02569) and
    HAMAP rule MF_01349, so their N-terminal PanC domain is probably active. Those
    annotations are rule-based, and no experimental PanC activity has been checked for the
    fusions. The negation is therefore probably too broad for them, but this is left
    unresolved.
