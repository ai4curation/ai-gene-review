family_id: PANTHER:PTHR21299
family_name: CYTIDYLATE KINASE/PANTOATE-BETA-ALANINE LIGASE
preferred_name: Pantothenate synthetase (PanC) and bacterial cytidylate kinase (Cmk) family
summary: >-
  A PANTHER family holding two enzymes with different reactions. Pantothenate synthetase (PanC,
  EC 6.3.2.1), subfamily SF1, condenses (R)-pantoate with beta-alanine via a pantoyl-adenylate
  intermediate to make pantothenate (vitamin B5). It is found in bacteria, fungi (S. cerevisiae
  Pan6, S. pombe pan6) and plants. Bacterial cytidylate kinase (Cmk, EC 2.7.4.25), subfamily SF2,
  phosphorylates CMP and dCMP in pyrimidine nucleotide metabolism. A small group of
  cyanobacterial PanCY proteins fuses an N-terminal PanC domain to a C-terminal Cmk domain;
  PANTHER classifies these fusions in the Cmk subfamily (SF2).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  SF1 is pantothenate synthetase and SF2 is cytidylate kinase, and the two do unrelated
  reactions in different pathways. PAINT reflects the split: pantoate-beta-alanine ligase is
  placed on the PanC node PTN000480612, and an IRD on the bacterial Cmk node PTN000480631
  negates it for that clade. No catalytic term is safe at the family level. Only the generic
  cytosol location (PTN000480630) spans both.
