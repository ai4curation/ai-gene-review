family_id: PANTHER:PTHR43065
family_name: SENSOR HISTIDINE KINASE
preferred_name: HisKA/HATPase sensor histidine kinase family (NtrB/ZraS/DctB/CbrA-type)
summary: A large family of two-component sensor histidine kinases sharing the DHp (HisKA) dimerisation/phosphoacceptor
  and CA (HATPase_c) catalytic domains, including bacterial NtrB, ZraS/AtoS, DctB, PilS, FleS, the Bacillus
  sporulation kinases KinA/KinB, and fungal hybrid kinases. Members autophosphorylate on a conserved histidine
  and phosphorylate a cognate response regulator; their N-terminal sensory domains (PAS, periplasmic,
  transporter-like) and hence their signals differ.
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'Sensor kinase activity is shared, but input architecture diverges: hybrid kinases in
  the fungal clade carry receiver domains and participate in multistep phosphorelays, whereas simple sensor
  kinases such as CbrA transfer directly to a response regulator; some members (CbrA) additionally carry
  a functional SLC5 transporter domain. Histidine phosphotransfer kinase activity (GO:0009927) is therefore
  not family-wide, and localisation varies between soluble and membrane members.'
reference_protein: &id001
  id: UniProtKB:Q88DX3
  label: histidine kinase
  gene_symbol: cbrA
  organism: Pseudomonas putida KT2440
  gene_review: genes/PSEPK/cbrA/cbrA-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43065:SF10
  label: PEROXIDE STRESS-ACTIVATED HISTIDINE KINASE MAK3
  description: Mixed subfamily that, despite its name taken from fungal Mak3, also holds Pseudomonas CbrA,
    an atypical sensor kinase whose N-terminal SLC5 solute/sodium symporter domain (13 transmembrane helices)
    binds and transports L-histidine. CbrA keeps the family's sensor kinase activity and phosphorylates
    the sigma-54 activator CbrB; the transporter activity is a member-level addition.
  representative_members:
  - *id001
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:32214184
    supporting_text: CbrA is composed of a domain with similarity to proteins of the solute/sodium symporter
      family (SLC5) and domains typically found in bacterial sensor kinases.
  - reference_id: PMID:32214184
    supporting_text: It is demonstrated that CbrA can bind and transport L-histidine. Transport is specific
      for L-histidine and probably driven by an electrochemical proton gradient.
