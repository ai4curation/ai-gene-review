notes: Written for MODULE:pseudomonad_cbr_crc_catabolite_control. The module grounds CbrA as a concrete
  gene product, not to this family, because the family is a generic sensor-kinase grouping and SF10 is
  named for an unrelated fungal kinase. CbrA is the reference protein because it is the member with a
  complete gene review here; canonical seeds such as E. coli NtrB (P0AFB5) have no review yet. SF10 membership
  of Q88DX3 is from the UniProt PANTHER cross-reference.
