- node_id: PANTHER:PTN002190847
  asserted_term:
    id: GO:0008962
    label: phosphatidylglycerophosphatase activity
  evidence: IBD
  node_taxon:
    id: NCBITaxon:1224
    label: Pseudomonadota
  paint_snapshot: '20241031'
  seeds:
  - id: UniProtKB:P18200
    label: pgpA
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    The PGP-specific activity is placed at the Proteobacteria node, seeded by E. coli PgpA,
    which has direct biochemical and genetic evidence. It does not reach Bacteroides BT_1525,
    which has a different substrate. Haemophilus and Pseudomonas PgpA are proteobacterial
    members carrying the PgpA-specific PIRSF006162 family. A single well-characterized seed
    is adequate for this shallow placement.
  supported_by:
  - reference_id: PMID:21148555
    supporting_text: A mutant with deletions in all three phosphatase genes is not viable unless covered
      by a plasmid expressing either pgpA, pgpB, or pgpC.
