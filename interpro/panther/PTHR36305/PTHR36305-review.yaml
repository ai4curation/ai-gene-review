family_id: PANTHER:PTHR36305
family_name: PHOSPHATIDYLGLYCEROPHOSPHATASE A
preferred_name: PgpA-type membrane lipid phosphomonoesterases (PgpA/YutG domain)
summary: >-
  A bacterial family of small, Mg2+-dependent, multi-pass membrane phosphatases with the
  PgpA domain (Pfam PF04608, InterPro IPR007686 YutG/PgpA). The type member, Escherichia coli
  PgpA, dephosphorylates phosphatidylglycerol phosphate (PGP) to phosphatidylglycerol. This is
  the second step of phosphatidylglycerol synthesis, redundant in E. coli with the unrelated
  PgpB and PgpC. Proteobacterial members (E. coli, Haemophilus, Pseudomonas putida PP_0520)
  share this function. The family is not uniform. The Bacteroides thetaiotaomicron member
  BT_1525 shares the PgpA domain but dephosphorylates phosphatidylinositol phosphate
  diacylglycerol (PIP-DAG) to phosphatidylinositol diacylglycerol in an inositol-lipid
  pathway. The domain is thus a general phospholipid-headgroup phosphomonoesterase fold
  whose substrate differs between lineages.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized proteobacterial members are PGP phosphatases, and PAINT restricts the PGP
  phosphatase activity to a Proteobacteria node (PTN002190847). The generic phosphatase
  activity is placed at the Bacteria-level root (PTN002190842). PANTHER has only one
  subfamily (SF1), and it also contains Bacteroides BT_1525, a phosphatidylinositol-phosphate
  phosphatase. The PGP-specific activity is therefore safe within the proteobacterial clade,
  but not for every SF1 member.
