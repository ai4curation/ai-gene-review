notes: >-
  The entries file lists three reviewed UniProt members, all in SF1 (P18200, P44157,
  Q8A7J9), and PAINT has three IBD rows on two nodes. The function and naming of Q8A7J9 were
  checked against its UniProt record and PMID:35725777. The record names it a putative
  phosphatidylinositol-3-phosphatase (EC 3.1.3.64); its PIP-DAG phosphatase function is
  supported by the deletion phenotype. The PgpA and PP_0520 gene reviews
  (genes/ECOLI/pgpA, genes/PSEPK/pgpA) accept GO:0008962 and GO:0006655, consistent with
  this review. The module bacterial_phosphatidylglycerol_cardiolipin_biosynthesis grounds
  its PgpA step to this family, with E. coli PgpA and P. putida PgpA as representatives,
  both proteobacterial SF1 members.
