    label: pgpA
    organism: Escherichia coli K-12
  assessment: SOUND
  assessment_reason: >-
    PgpA performs the PGP-to-PG step of phosphatidylglycerol synthesis. In E. coli, loss of
    all three PGP phosphatases causes PGP accumulation and PG depletion. The process placement
    matches the activity node.
  supported_by:
  - reference_id: PMID:21148555
    supporting_text: As growth slows at 42 °C, PGP accumulates to high levels, and the PG content declines.
term_assessments:
- assessed_term:
    id: GO:0008962
    label: phosphatidylglycerophosphatase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    SF1, the only subfamily, holds all PGP phosphatases, as PAINT applies the term at the
    Proteobacteria node. The Bacteroides inositol-lipid phosphatase BT_1525 is an explicit
    exception. Other non-proteobacterial SF1 members have not been characterized and should
    get the term only with lineage-specific evidence.
  applicable_subfamilies:
  - id: PANTHER:PTHR36305:SF1
    label: PHOSPHATIDYLGLYCEROPHOSPHATASE A
  member_exceptions:
  - member:
      id: UniProtKB:Q8A7J9
      label: BT_1525
      organism: Bacteroides thetaiotaomicron
    exception_reason: >-
      BT_1525 is the phosphatidylinositol-phosphate diacylglycerol phosphatase of the
      Bacteroides inositol-lipid pathway. Its deletion causes PIP-DAG accumulation; PGP
      phosphatase activity has not been shown.
    supported_by:
    - reference_id: PMID:35725777
      supporting_text: Although BT_1525 has homology to the phosphatidylglycerophosphatase A protein family
        (Pfam), this sequence similarity could reflect an expansion of the functional role of this protein
        motif from the dephosphorylation of a phospholipid glycerophosphate headgroup to an inositol
        phosphate headgroup.
  supported_by:
  - reference_id: PMID:6296050
    supporting_text: The pgpA gene product is specific for PGP
- assessed_term:
    id: GO:0006655
    label: phosphatidylglycerol biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Same scope as the PGP phosphatase activity. The process follows from the PGP-to-PG step and
    does not apply to the inositol-lipid phosphatase BT_1525.
  applicable_subfamilies:
  - id: PANTHER:PTHR36305:SF1
    label: PHOSPHATIDYLGLYCEROPHOSPHATASE A
  member_exceptions:
  - member:
      id: UniProtKB:Q8A7J9
      label: BT_1525
      organism: Bacteroides thetaiotaomicron
    exception_reason: >-
      BT_1525 acts in phosphatidylinositol diacylglycerol synthesis, not phosphatidylglycerol
      synthesis.
    supported_by:
    - reference_id: PMID:35725777
      supporting_text: BT synthesizes PI-DAG using a mycobacterial-like pathway with a PIP-DAG intermediate;
        previously, the bacterial PI-DAG synthesis pathway lacked a PIPPh, which we have identified here
        as BT_1525.
  supported_by:
  - reference_id: PMID:21148555
    supporting_text: As growth slows at 42 °C, PGP accumulates to high levels, and the PG content declines.
