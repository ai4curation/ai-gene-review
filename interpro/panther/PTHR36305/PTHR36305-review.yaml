  assessment_reason: >-
    The generic phosphatase activity at the family root is supported on both sides of the
    tree: E. coli PgpA dephosphorylates PGP, and Bacteroides BT_1525 is required to convert
    PIP-DAG to PI-DAG. Both are phosphomonoesterases acting on a lipid headgroup phosphate.
    The term is broad but correct for every member with data.
  supported_by:
  - reference_id: PMID:6296050
    supporting_text: The pgpA gene product is specific for PGP
  - reference_id: PMID:35725777
