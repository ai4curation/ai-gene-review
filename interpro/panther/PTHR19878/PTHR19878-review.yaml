family_id: PANTHER:PTHR19878
family_name: AUTOPHAGY PROTEIN 16-LIKE
preferred_name: ATG16-like proteins
summary: >-
  PTHR19878 contains ATG16 and its vertebrate paralogs ATG16L1 and ATG16L2. ATG16L1 binds the ATG12-ATG5
  conjugate, recruits it to the phagophore and is required for autophagosome formation. ATG16L2 also forms
  an ATG12-ATG5-ATG16L2 complex but is not recruited to phagophores and is not required for canonical
  autophagy.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Complex formation with ATG12-ATG5 is shared; recruitment to the phagophore and a role in autophagosome
  assembly are lost in the ATG16L2 clade.
