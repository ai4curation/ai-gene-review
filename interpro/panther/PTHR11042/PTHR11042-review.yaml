term_assessments:
- assessed_term:
    id: GO:0004713
    label: protein tyrosine kinase activity
  scope: UNRESOLVED
  scope_reason: 'Tyrosine-directed inhibitory CDK phosphorylation is supported for human WEE1 and for
    pombe Wee1: purified pombe Wee1 directly phosphorylates cyclin-associated Cdc2 on Tyr15 (PMID:1372994).
    These proteins occupy different PANTHER subfamilies, and additional Wee1-related regulators require
    the same substrate-level assessment. The broader family also includes eIF2-alpha-directed serine/threonine
    kinases. Human WEE1 SF72 is therefore a verified positive branch, not the exhaustive boundary of protein
    tyrosine kinase activity; the complete applicable set remains unresolved.'
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-b.json
    supporting_text: Phosphorylation of cyclin B1-CDK1 occurs exclusively on 'Tyr-15' and phosphorylation
      of monomeric CDK1 does not occur
  - reference_id: PMID:1372994
    supporting_text: In vitro, p107wee1 phosphorylated p34cdc2 on Tyr-15 only when p34cdc2 was complexed
      with cyclin.
