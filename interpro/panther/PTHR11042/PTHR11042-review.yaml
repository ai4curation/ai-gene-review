family_id: PANTHER:PTHR11042
family_name: EUKARYOTIC TRANSLATION INITIATION FACTOR 2-ALPHA KINASE  EIF2-ALPHA KINASE -RELATED
summary: This kinase family combines cell-cycle inhibitory kinases with stress-responsive translation-control
  kinases and other related enzymes. WEE1-family proteins inhibit CDK-driven mitotic entry, whereas eIF2-alpha
  kinases control translation during specific stresses. Shared protein-kinase chemistry does not imply
  common substrates or phosphoacceptor specificity.
functional_coherence: HETEROGENEOUS
coherence_reason: The curated human WEE1 record and primary studies support CDK1 inhibitory tyrosine phosphorylation.
  PANTHER also contains GCN2, PKR, PERK and other eIF2-alpha kinase branches. WEE1 tyrosine-kinase and
  G2/M-control annotations should therefore be scoped to the WEE1 branch rather than propagated from kinase-fold
  similarity.
