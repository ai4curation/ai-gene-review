family_id: PANTHER:PTHR46362
family_name: GEM-ASSOCIATED PROTEIN 5
summary: Gemin5-related proteins recognize RNA and contribute to ribonucleoprotein assembly. Mammalian
  Gemin5 delivers snRNAs to the SMN assembly machinery and also has RNA- and translation-associated functions
  outside a single assembly step.
functional_coherence: COHERENT
coherence_reason: Gemin5 WD40-domain structures, binding calorimetry and mutagenesis establish recognition
  of the Sm site of pre-snRNAs (PMID:27881600). The classified family comprises Gemin5 orthologs rather
  than unrelated WD-repeat proteins, supporting snRNA binding as the shared function of intact RNA-recognition
  architecture. This broad activity does not require identical affinities for each snRNA or identical
  cap recognition; SMN assembly partnership and other translation functions are separate claims. Gemin5
  is not itself the spliceosome’s RNA-splicing catalyst.
