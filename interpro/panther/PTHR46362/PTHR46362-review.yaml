  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR46362-evidence.md
    supporting_text: The SMN complex catalyzes the assembly of small nuclear ribonucleoproteins (snRNPs),
      the building blocks of the spliceosome, and thereby plays an important role in the splicing of cellular
      pre-mRNAs (PubMed:16857593, PubMed:18984161, PubMed:20513430, PubMed:33963192). Most spliceosomal
      snRNPs contain a common set of Sm proteins SNRPB, SNRPD1, SNRPD2, SNRPD3, SNRPE, SNRPF and SNRPG
      that assemble in a heptameric protein ring on the Sm site of the small nuclear RNA to form the core
      snRNP (Sm core). In the cytosol, the Sm proteins SNRPD1, SNRPD2, SNRPE, SNRPF and SNRPG are trapped
      in an inactive 6S pICln-Sm complex by the chaperone CLNS1A that controls the assembly of the core
      snRNP (PubMed:18984161). To assemble core snRNPs, the SMN complex accepts the trapped 5Sm proteins
      from CLNS1A forming an intermediate (PubMed:18984161). Binding of snRNA inside 5Sm ultimately triggers
      eviction of the SMN complex, thereby allowing binding of SNRPD3 and SNRPB to complete assembly of
      the core snRNP. Within the SMN complex, GEMIN5 recognizes and delivers the small nuclear RNAs (snRNAs)
      to the SMN complex (PubMed:11714716, PubMed:16314521, PubMed:16857593, PubMed:19377484, PubMed:19750007,
      PubMed:20513430, PubMed:27834343, PubMed:27881600, PubMed:27881601). Binds to the 7-methylguanosine
      cap of RNA molecules (PubMed:19750007, PubMed:27834343, PubMed:27881600, PubMed:27881601, Ref.27).
      Binds to the 3'-UTR of SMN1 mRNA and regulates its translation; does not affect mRNA stability (PubMed:25911097).
      May play a role in the regulation of protein synthesis via its interaction with ribosomes (PubMed:27507887)
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR46362-evidence.md
    supporting_text: This entry represents Gemin-5, a protein involved in the assembly and function of
      small nuclear ribonucleoproteins (snRNPs), which are essential components of the spliceosome, the
      complex responsible for the splicing of pre-mRNA in eukaryotic cells [[cite:PUB00155015], [cite:PUB00103799]].
      They recognise and bind to snRNAs and the 7-methylguanosine cap found on mRNA and snRNA molecules
      [[cite:PUB00155012], [cite:PUB00155013], [cite:PUB00155014]]. They are part of the SMN complex,
      facilitating the formation of the core snRNP by delivering snRNAs to the complex. Additionally,
      they may interact with ribosomes and play a role in the regulation of protein synthesis. In Drosophila,
      is also described as a nuclear receptor cofactor in ecdysone-regulated gene expression during molting
      and puparium formation [[cite:PUB00155010]] and it is essential in muscle and neuronal tissues for
      motor function, including climbing ability and flight [[cite:PUB00155011]].
