family_id: PANTHER:PTHR24286
family_name: CYTOCHROME P450 26
preferred_name: Cytochrome P450 CYP26/CYP61/CYP88/CYP90/CYP716 family
summary: >-
  A large PANTHER family of class II cytochromes P450 from fungi, plants and animals. It includes
  fungal CYP61 (S. cerevisiae ERG5, S. pombe erg5), the C-22 sterol desaturase of ergosterol synthesis;
  animal CYP26 retinoic acid hydroxylases; plant CYP88 ent-kaurenoic acid oxidases (gibberellin synthesis),
  CYP90 brassinosteroid hydroxylases and CYP716 triterpene oxidases; and allene oxide synthase-like
  enzymes.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Each subfamily oxidizes a different substrate (sterol C-22, retinoic acid, ent-kaurenoic acid,
  brassinosteroids, triterpenes).
