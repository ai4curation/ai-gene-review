family_id: PANTHER:PTHR11822
family_name: NADP-SPECIFIC ISOCITRATE DEHYDROGENASE
preferred_name: NADP-specific isocitrate dehydrogenase (IDP/IDH1/IDH2) family
summary: >-
  Homodimeric NADP-dependent isocitrate dehydrogenases make 2-oxoglutarate and NADPH. S. cerevisiae
  has mitochondrial IDP1, cytosolic IDP2 and peroxisomal IDP3, which supplies NADPH for beta-oxidation
  of unsaturated fatty acids. Animals have cytosolic/peroxisomal IDH1 and mitochondrial IDH2. They
  are not the NAD-dependent TCA-cycle IDH.
functional_coherence: COHERENT
coherence_reason: All members are NADP-IDHs; subfamilies differ in compartment.
