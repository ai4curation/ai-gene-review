  - id: UniProtKB:Q00517
  node_taxon: &pseudo
    id: NCBITaxon:1224
    label: Pseudomonadota
  assessment: SOUND
  assessment_reason: >-
    Minor pseudopilins are anchored in the inner membrane by their post-cleavage hydrophobic helix,
    which is the plasma membrane of a diderm bacterium; this was shown for XcpW by fractionation of
    wild-type and pilD mutant cells. The claim is a property of the shared prepilin architecture,
    so it is safe across the Pseudomonadota clade recorded for the node and would in fact be safe
    more widely, including for the competence and PpdB-type members.
  supported_by:
  - reference_id: file:interpro/panther/PTHR39583/PTHR39583-paint.tsv
    supporting_text: "PTHR39583\tPTN002446812\tGO:0005886\tC\tIBD\tfalse"
  - reference_id: PMID:8331069
    supporting_text: the precursor forms of XcpT-W are located predominantly in the bacterial inner
      membrane, and their localization is not altered after PilD-mediated removal of the leader
      sequence
- node_id: PANTHER:PTN002446812
  asserted_term:
    id: GO:0015627
    label: type II protein secretion system complex
  evidence: IBD
  paint_snapshot: '20260616'
  seeds:
  - id: UniProtKB:Q00517
  node_taxon: *pseudo
  assessment: SOUND
  assessment_reason: >-
    The term is correct for the seed, whose membership of the Xcp machine rests on co-purification
    and surface plasmon resonance of the XcpU-V-W-X tip complex and on the crystallised XcpVW core,
    and the node is restricted to Pseudomonadota, where the GspJ clade sits. Two caveats are
    recorded rather than treated as faults of the node: no annotation in current QuickGO cites this
    node, the propagating node for XcpW being PTN002218419 whose 618 leaves are overwhelmingly
    GspJ-named, which looks like a tree-version renaming; and the Pseudomonadota restriction keeps
    the term away from the Bacillus ComGD member of the same subfamily, which is the behaviour a
    T2SS complex term needs in a family that also holds a competence pilin.
  affected_subfamilies:
