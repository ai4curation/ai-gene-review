family_id: PANTHER:PTHR39583
family_name: TYPE II SECRETION SYSTEM PROTEIN J-RELATED
preferred_name: GspJ minor pseudopilins of type II secretion systems
summary: >-
  GspJ minor pseudopilins and their closest relatives. Members have a prepilin-type N terminus
  processed by the prepilin peptidase, a single inner-membrane helix and a periplasmic head whose
  structure has been solved for P. aeruginosa XcpW. GspJ pairs with GspI in the pseudopilus tip:
  in Klebsiella the PulI-PulJ pair nucleates filament assembly as a staggered complex in the
  plasma membrane, and in Pseudomonas XcpW is recruited by XcpV and in turn recruits XcpH (XcpU),
  the XcpV-XcpW pair being the indispensable core of the tip. Most reviewed members are GspJ or
  GspH proteins of proteobacterial T2SS loci, but the family also holds the PpdB-type prepilin
  peptidase-dependent proteins of cryptic systems (SF3), a Bacillus competence pilin (ComGD) and
  a Thermus pilin-like protein, so it is not T2SS-only.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reviewed membership is dominated by T2SS minor pseudopilins of the GspJ and GspH types, but
  the same subfamily SF2 also contains Bacillus subtilis ComGD, a competence pilin of a monoderm
  bacterium that has no outer membrane or secretin, and Thermus thermophilus PilA3; SF3 holds
  E. coli PpdB and a Haemophilus homolog from cryptic prepilin-dependent loci whose function is
  not established.
