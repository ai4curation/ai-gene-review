    Dickeya OutJ, E. coli GspJ) together with GspH-named members of the same T2SS loci
    (E. coli GspH P41443, Vibrio EpsH P45774). It also contains two proteins of other systems,
    Bacillus subtilis ComGD and Thermus thermophilus PilA3.
