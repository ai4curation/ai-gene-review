    label: protein secretion by the type II secretion system
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Established for the GspJ and GspH minor pseudopilins of proteobacterial T2SS loci in SF2. It
    must not reach the PpdB-type members of SF3, whose loci are cryptic, nor the Bacillus ComGD
    competence pilin that shares SF2 but belongs to a DNA-uptake machine in a monoderm bacterium.
  applicable_subfamilies:
