notes: >-
  Used by modules/bacterial_type_ii_secretion.yaml for the GspJ minor-pseudopilin annoton, at
  PANTHER:PTHR39583:SF2 with P. aeruginosa XcpW (Q00517), P. putida KT2440 XcpW (Q88P01) and
  Klebsiella PulJ (P15749) as exemplars. The family records the competence connection of the
  minor pseudopilins directly: Bacillus subtilis ComGD sits in the same subfamily as the GspJ
  proteins, which is why the T2SS terms here are assessed as SUBFAMILY_ONLY and the node's
  Pseudomonadota taxon restriction matters. The PAINT seed node PTN002446812 and the node that
  actually propagates to XcpW in current GOA (PTN002218419) differ; this is tracked as an open
  question in genes/PSEAE/xcpW/xcpW-ai-review.yaml and is the reason the leaf-composition evidence
  cited here comes from the PTN002218419 table.
