- subfamily_id: PANTHER:PTHR39583:SF3
  label: PREPILIN PEPTIDASE-DEPENDENT PROTEIN B
  description: >-
    PpdB-type prepilin peptidase-dependent proteins, from E. coli K-12 and Haemophilus influenzae
    loci that are not known to assemble a functional secretion machine.
  representative_members:
  - id: UniProtKB:P08371
    label: Prepilin peptidase-dependent protein B
  - id: UniProtKB:P44080
    label: Uncharacterized protein HI_0939
  diverged_from_family: true
  divergence_description: >-
    These proteins are prepilin peptidase substrates of cryptic loci rather than established
    components of a working T2SS. E. coli K-12 carries a cryptic general secretory pathway operon
    whose products are functional when expressed but which is silent in the laboratory strain, so
    neither the T2SS complex term nor the process term should be asserted for them without
    system-specific evidence.
  supported_by:
  - reference_id: file:interpro/panther/PTHR39583/PTHR39583-entries.csv
    supporting_text: P08371,Prepilin peptidase-dependent protein B
