term_assessments:
- assessed_term:
    id: GO:0004798
    label: dTMP kinase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the defining activity of the bacterial, viral and eukaryotic thymidylate kinases. Both
    modules that use the family (dntp_de_novo_synthesis with CDC8, DTYMK and E. coli tmk;
    thymidylate_synthesis with DTYMK) assert it, and all their representative members are true
    TMPKs. Vertebrate CMPK2 (SF4) is an exception: PAINT pruned it with an IRD, and its
    characterized substrates are dUMP, dCMP, CMP and UMP.
  member_exceptions:
  - member:
      id: UniProtKB:Q5EBM0
      label: UMP-CMP kinase 2, mitochondrial
      gene_symbol: CMPK2
      organism: Homo sapiens
    exception_reason: >-
      A mitochondrial UMP-CMP/dUMP kinase that is closer in sequence to thymidylate kinase but has
      a different substrate range. PAINT records the loss of dTMP kinase activity with an IRD at
      the CMPK2 clade.
    lost_in_clade_node_id: PANTHER:PTN001620248
    supported_by:
    - reference_id: PMID:17999954
      supporting_text: belonged to a novel nucleoside monophosphate kinase family, which was closer
        to thymidylate kinase than to cytosolic UMP-CMP kinase
    - reference_id: file:interpro/panther/PTHR10344/PTHR10344-paint.tsv
      supporting_text: "PTHR10344\tPTN001620248\tGO:0004798\tF\tIRD\ttrue"
  supported_by:
  - reference_id: PMID:6088527
    supporting_text: we show, by several biochemical criteria, that thymidylate kinase is the product
      of the CDC8 gene
  - reference_id: PMID:6094555
    supporting_text: The enzyme catalyzes the phosphorylation of deoxythymidine monophosphate to form
      deoxythymidine diphosphate in the presence of phosphate donor.
