notes: >-
  Seed identities were resolved with UniProt cross-reference queries: RGD:1305881 is rat Cmpk2,
  RGD:1309614 is rat Dtymk, MGI:99830 is mouse Cmpk2, MGI:108396 is mouse Dtymk. Which nodes each
  member inherits from was read from the PAINT UniProt GAF. Two PAINT rows for this family are in
  IBD.gaf: the IRD NOT GO:0004798 at PTN001620248 (also in the fetched paint tsv) and the IRD NOT
  GO:0005739 at PTN000819740 (Fungi), which the fetched paint tsv misses. PTN001620248 also
  carries an IBA-coded row for GO:0047507 inherited from PTN000038985, which is unusual and was
  not adjudicated. The modules and gene reviews agree with the family scope: both modules assert
  GO:0004798 on true TMPKs, and the dntp module's note that CDC8 is not mitochondrial matches the
  fungal IRD.
