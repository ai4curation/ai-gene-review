family_id: PANTHER:PTHR10344
family_name: THYMIDYLATE KINASE
preferred_name: Thymidylate kinase (TMPK/Tmk) family
summary: >-
  Thymidylate kinases are small P-loop nucleoside monophosphate kinases. They phosphorylate dTMP
  to dTDP using ATP, the step shared by the de novo route (from thymidylate synthase) and the
  salvage route (from thymidine kinase) to dTTP. The family includes bacterial Tmk (E. coli, B.
  subtilis, M. tuberculosis), eukaryotic TMPK (S. cerevisiae CDC8, S. pombe tmp1, human DTYMK) and
  several viral thymidylate kinases. Many members also phosphorylate dUMP weakly, and purified
  yeast Cdc8 has some nucleoside-diphosphate kinase activity in vitro. One vertebrate member is
  functionally distinct: the mitochondrial UMP-CMP kinase 2 (CMPK2). It phosphorylates dUMP, dCMP,
  CMP and UMP, has interferon-induced antiviral roles, and PAINT treats it as having lost dTMP
  kinase activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  dTMP kinase activity is conserved across the bacterial, viral and eukaryotic Tmk proteins. The
  exception is the CMPK2 clade. PAINT puts NOT dTMP kinase on the CMPK2 node PTN001620248 (an
  IRD) and gives it nucleoside-diphosphate kinase and (deoxy)nucleoside-phosphate kinase terms
  instead. PANTHER's subfamily names are misleading here. SF4 is officially "UMP-CMP KINASE 2,
  MITOCHONDRIAL", but nearly all of its several hundred reviewed members are bacterial Tmk proteins
  (E. coli Tmk, B. subtilis Tmk, M. tuberculosis Tmk) and only the two CMPK2 orthologs are
  CMPK2s. SF1 ("THYMIDYLATE KINASE") holds the eukaryotic and most viral TMPKs. Subfamily
  membership therefore cannot separate CMPK2 from the bacterial thymidylate kinases. The E. coli
  SF4 members YghR and YghT are uncharacterized ATP-binding proteins that inherit dTMP kinase by
  IBA. That was neither confirmed nor refuted here.
