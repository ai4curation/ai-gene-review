- assessed_term:
    id: GO:0006227
    label: dUDP biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    A side activity on dUMP, shown for yeast Cdc8 and other TMPKs and the preferred substrate of
    CMPK2. Correct but not the biological purpose of the thymidylate kinases. The CDC8 and DTYMK
    reviews keep it as non-core.
  supported_by:
  - reference_id: PMID:17999954
    supporting_text: Its efficacy to convert dUMP was highest
- assessed_term:
    id: GO:0120136
    label: dUMP kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    PAINT asserts it at the Opisthokonta node PTN000038989, from yeast CDC8, S. pombe tmp1 and fly
    Dtymk seeds. Human and mouse DTYMK do not receive it. The CDC8 review keeps it as non-core. The
    activity is probably broader (bacterial and mammalian TMPKs also phosphorylate dUMP to some
    extent), but the exact boundary was not established here.
  supported_by:
  - reference_id: file:interpro/panther/PTHR10344/PTHR10344-paint.tsv
    supporting_text: "PTHR10344\tPTN000038989\tGO:0120136\tF\tIBD\tfalse\tFB:FBgn0034299|PomBase:SPCC70.07c|SGD:S000003818\ttaxon:33154"
- assessed_term:
    id: GO:0005739
    label: mitochondrion
  scope: UNRESOLVED
  scope_reason: >-
    Mitochondrial location is genuine for CMPK2 (N-terminal targeting signal) and is asserted by
    PAINT for plant and animal TMPKs. It is correctly excluded from fungi by the PTN000819740 IRD.
    Whether human DTYMK has a functional mitochondrial pool is disputed: the DTYMK review marks
    the IBA as over-annotated. Neither module asserts a mitochondrial location.
  supported_by:
  - reference_id: PMID:17999954
    supporting_text: the mitochondrial targeting signal was included in the N-terminal 22 amino acids
