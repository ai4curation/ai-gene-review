  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Placement is correct for the thymidylate kinases. But the CMPK2 clade (PTN001620248) is
    pruned only for the molecular function (NOT GO:0004798). Human and mouse CMPK2 still inherit
    dTDP biosynthetic process (GO:0006233), and also dTTP biosynthetic process (GO:0006235), from
    this node. Making dTDP from dTMP is exactly the activity PAINT says CMPK2 lacks, and the
    characterized substrates of human CMPK2 do not include dTMP. Recommend matching IRDs for
    GO:0006233 and GO:0006235 at PTN001620248. dUDP biosynthesis (GO:0006227) can stay, because
    CMPK2 phosphorylates dUMP well.
