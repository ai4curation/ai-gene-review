- assessed_term:
    id: GO:0006235
    label: dTTP biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    TMPK performs an obligatory step of dTTP synthesis, and the CDC8 and DTYMK gene reviews accept
    the IBA. CMPK2 is again the exception (same rationale as for dTDP biosynthesis).
  member_exceptions:
  - member:
      id: UniProtKB:Q5EBM0
      label: UMP-CMP kinase 2, mitochondrial
      gene_symbol: CMPK2
      organism: Homo sapiens
    exception_reason: >-
      CMPK2 does not phosphorylate dTMP, so it does not contribute the TMPK step of dTTP
      synthesis. The IBA reaches it only because the PTN001620248 IRD covers the molecular
      function alone.
    lost_in_clade_node_id: PANTHER:PTN001620248
    supported_by:
    - reference_id: PMID:17999954
      supporting_text: The enzyme was able to phosphorylate dUMP, dCMP, CMP, and UMP with ATP as
        phosphate donor
  supported_by:
  - reference_id: file:interpro/panther/PTHR10344/PTHR10344-paint.tsv
