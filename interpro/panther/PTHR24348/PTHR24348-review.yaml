    gene_symbol: ULK3
    organism: Homo sapiens
    gene_review: genes/human/ULK3/ULK3-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    ULK3 keeps protein serine/threonine kinase activity and a broad cytoplasmic
    location, but it is not a member of the canonical ULK1/ULK2 phagophore-initiation
    complex. In human cells its best supported direct process is positive
    regulation of Hedgehog/Smoothened signaling through phosphorylation of GLI
    transcription factors.
- subfamily_id: PANTHER:PTHR24348:SF22
  label: NON-SPECIFIC SERINE_THREONINE PROTEIN KINASE
  description: >-
    Broad fungal/metazoan/amoebozoan Atg1 branch that also contains budding-yeast
    Ksp1 and Sks1, so the subfamily itself is not a clean Atg1 ortholog group.
  representative_members:
  - id: UniProtKB:P53104
    gene_symbol: ATG1
    organism: Saccharomyces cerevisiae
  diverged_from_family: false
  divergence_description: >-
    PANTHER SF22 contains genuine Atg1 proteins together with related fungal
    kinases such as Ksp1 and Sks1; family-level PAINT placement, rather than this
    subfamily label, identifies the conserved Atg1/ULK autophagy branch.
