family_id: PANTHER:PTHR24348
family_name: SERINE/THREONINE-PROTEIN KINASE UNC-51-RELATED
preferred_name: Atg1/ULK and related serine/threonine kinases
summary: >-
  PTHR24348 is a heterogeneous serine/threonine kinase family. The conserved
  catalytic activity is broad across the reviewed human ULK1, ULK2 and ULK3
  branches, but the canonical Atg1/ULK autophagy-initiation role is narrower:
  human ULK1 and ULK2 are Atg1-like kinases that start phagophore formation,
  whereas human ULK3 is a shorter Fused-family kinase that phosphorylates GLI
  transcription factors in Hedgehog signaling and should not inherit the
  autophagosome-assembly, selective-autophagy or phagophore-membrane PAINT rows
  placed on Atg1/ULK branches.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family joins canonical Atg1/ULK autophagy-initiation kinases, vertebrate
  ULK3, fungal Ksp1/Sks1-like kinases and several plant ATG1 paralog groups.
  PAINT's PTN002805221 serine/threonine kinase IBD is safe for the human ULK
  members, but the PTN000681272 and PTN000681273 autophagy IBD rows overreach
  to the ULK3 subfamily.
