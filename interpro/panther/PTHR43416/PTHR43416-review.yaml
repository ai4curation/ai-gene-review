family_id: PANTHER:PTHR43416
family_name: >-
  DIHYDROLIPOYLLYSINE-RESIDUE SUCCINYLTRANSFERASE COMPONENT OF 2-OXOGLUTARATE DEHYDROGENASE COMPLEX,
  MITOCHONDRIAL-RELATED
preferred_name: 2-oxoglutarate dehydrogenase E2 (DLST/SucB/KGD2) family
summary: >-
  Lipoyl-domain acyltransferases. Most members are E2o of the 2-oxoglutarate dehydrogenase complex
  (human DLST, S. cerevisiae KGD2, S. pombe kgd2, bacterial SucB), which transfer succinyl groups
  in the TCA cycle; human DLST also acts as E2 of the 2-oxoadipate dehydrogenase complex in lysine
  catabolism. SF4 and SF38 hold plastid biotin carboxyl carrier proteins of acetyl-CoA carboxylase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  SF5, SF18, SF40 and SF41 are E2o succinyltransferases; SF4 and SF38 are BCCP subunits that only
  share the lipoyl/biotinyl domain fold.
