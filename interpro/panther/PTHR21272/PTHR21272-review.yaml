notes: >-
  Used by modules/bacterial_shikimate_chorismate_biosynthesis.yaml (type II dehydroquinase
  variant, aroq_dehydroquinase) with the family-level selector PANTHER:PTHR21272 and GO:0003855;
  safe for the activity. Topology from the PANTHER 19 treeinfo service filtered to model
  organisms: root PTN000479790 (Eubacteria) splits into Terrabacteria (M. tuberculosis AroQ, B.
  subtilis YqhS) and a horizontal-transfer node PTN004537260 that joins H. influenzae AroQ with
  the Pezizomycotina node PTN002723599 (qutE, qa-2). The Gourley et al. abstract does not name
  the organisms whose biosynthetic DHQases were solved, so it is cited only for the general point
  that type II DHQases can be biosynthetic. P. putida is not in the PAINT UniProt GAF, so the
  three P. putida paralogs receive no IBA.
