family_id: PANTHER:PTHR21272
family_name: CATABOLIC 3-DEHYDROQUINASE
preferred_name: Type II 3-dehydroquinate dehydratases (biosynthetic AroQ and catabolic QutE/qa-2)
summary: >-
  Type II 3-dehydroquinate dehydratases (dehydroquinases, EC 4.2.1.10), small dodecameric
  flavodoxin-fold enzymes that convert 3-dehydroquinate to 3-dehydroshikimate by a trans
  dehydration through an enolate intermediate. They are unrelated in sequence and mechanism to
  the type I (Schiff-base) dehydroquinases (AroD, the AROM and plant DHQ-SDH domains) that
  catalyse the same reaction. The same reaction serves two pathways. In bacteria, AroQ can serve as
  the biosynthetic dehydroquinase of the shikimate pathway (an Actinobacillus aroQ complements an
  E. coli aroD mutant). In filamentous fungi (Aspergillus nidulans QutE,
  Neurospora crassa qa-2) the type II enzyme belongs to the inducible quinic acid utilization
  pathway, while biosynthesis uses the type I domain of AROM. Organisms such as Pseudomonas
  putida carry several paralogs whose pathway assignment is not established.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The catalytic activity is uniform across the family and safe family-wide. The physiological
  pathway is not: biosynthetic (chorismate) and catabolic (quinate) roles are both found, and they
  are not separated by PANTHER subfamily. SF5 holds only Pezizomycotina catabolic QutE/qa-2
  enzymes, but SF3, despite its name CATABOLIC 3-DEHYDROQUINASE, holds the bacterial
  biosynthetic AroQ enzymes together with further fungal qutE paralogs. Both subfamilies carry
  the same official name.
