    supporting_text: The A. nidulans dehydroquinase (2) gene QUTE has been shown to complement an auxotrophic
      mutant aroD6 of Escherichia coli lacking biosynthetic dehydroquinase
  - reference_id: PMID:1329726
    supporting_text: shown to encode quinate-inducible 3-dehydroquinase activity that allows a qutE-
