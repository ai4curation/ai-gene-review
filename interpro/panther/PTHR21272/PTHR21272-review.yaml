- node_id: PANTHER:PTN000479790
  asserted_term:
    id: GO:0019631
    label: quinate catabolic process
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  paint_snapshot: '20210623'
  seeds:
  - id: UniProtKB:P05147
    label: qutE
    organism: Aspergillus nidulans FGSC A4
  assessment: TOO_DEEP
  assessment_reason: >-
    The only seed is A. nidulans QutE, a member of the Pezizomycotina quinate-utilization clade
    (PTN002723599, SF5). Placing the process at the family root passes quinate catabolism to the
    bacterial biosynthetic AroQ enzymes, which in the PAINT UniProt GAF include M. tuberculosis
    AroQ (P9WPX7), B. subtilis YqhS and H. influenzae AroQ. The bacterial type II enzymes were
    identified as biosynthetic dehydroquinases (an Actinobacillus aroQ was cloned by
    complementing an E. coli aroD mutant), and type II enzymes are described as biosynthetic
    DHQases of the shikimate pathway. That an enzyme can support quinate use
    when expressed in Aspergillus shows catalytic capacity, not participation in quinate
    catabolism in its own organism. Recommended fix: move the IBD to the Pezizomycotina node
    PTN002723599, or add IRDs on the bacterial branches. The node also gives no chorismate
    biosynthesis term to any member, so the bacterial biosynthetic role is unrepresented.
