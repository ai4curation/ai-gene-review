family_id: PANTHER:PTHR46399
family_name: B30.2/SPRY DOMAIN-CONTAINING PROTEIN
preferred_name: Ryanodine receptor slice
summary: >-
  PTHR46399 contains ryanodine-sensitive intracellular Ca2+-release channels. This review covers the three
  reviewed human ryanodine receptors: skeletal-muscle RYR1, cardiac RYR2 and the more broadly expressed RYR3.
  All three are very large homotetrameric channels in sarcoplasmic or endoplasmic-reticulum membranes whose
  cytosolic domains gate release of stored Ca2+ into the cytosol.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reviewed human RYR1, RYR2 and RYR3 branches share the ryanodine-sensitive Ca2+-release pore and SR/ER
  membrane architecture. They differ mainly in the excitable tissues where the channel is used: RYR1 couples
  skeletal-muscle T-tubule depolarization to Ca2+ release, RYR2 drives cardiac calcium-induced calcium release,
  and RYR3 has less direct human evidence and should not inherit all muscle-junction locations.
