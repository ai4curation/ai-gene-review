family_id: PANTHER:PTHR23113
family_name: GUANINE NUCLEOTIDE EXCHANGE FACTOR
preferred_name: Guanine Nucleotide Exchange Factor
summary: GUANINE NUCLEOTIDE EXCHANGE FACTOR (PANTHER:PTHR23113) is characterized in PANTHER PAINT across
  12 ancestral PTN node(s) (PANTHER:PTN000560991, PANTHER:PTN000561159, PANTHER:PTN000561787, PANTHER:PTN001896698
  (+8 more)) with 19 IBD node assertion(s) and 1 term(s) carrying negated IRD/IKR branch blocks, covering
  guanyl-nucleotide exchange factor activity (GO:0005085, MF), Ras protein signal transduction (GO:0007265,
  BP), Rap protein signal transduction (GO:0032486, BP), traversing start control point of mitotic cell
  cycle (GO:0007089, BP) and 13 additional GO term(s).
functional_coherence: MOSTLY_COHERENT
coherence_reason: Core family functions (guanyl-nucleotide exchange factor activity (GO:0005085, MF),
  Ras protein signal transduction (GO:0007265, BP), Rap protein signal transduction (GO:0032486, BP),
  traversing start control point of mitotic cell cycle (GO:0007089, BP) and 13 additional GO term(s))
  are conserved across the primary ancestral clade, with lineage-specific variation reflected by IBD assertions
  distributed across 12 PTN nodes (PANTHER:PTN000560991, PANTHER:PTN000561159, PANTHER:PTN000561787, PANTHER:PTN001896698
  (+8 more)); negated IRD/IKR loss assertion(s) on GO:0007265.
