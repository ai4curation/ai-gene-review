family_id: PANTHER:PTHR31716
family_name: PROTEIN FMC1 HOMOLOG
summary: This grouping contains animal FMC1-related proteins with a proposed relationship to mitochondrial
  ATP synthase assembly factors. Yeast Fmc1 is a soluble mitochondrial-matrix protein that helps F1 assembly
  under heat stress; equivalent activity of the fly CG34117 family branch is not directly established.
functional_coherence: UNKNOWN
coherence_reason: The primary yeast study describes a nuclear-encoded mitochondrial-matrix protein, not
  a nuclear-localized protein. Fmc1 becomes important for F1 assembly at elevated temperature, and increased
  Atp12 dosage suppresses its deficiency (PMID:11096112). These observations define an assembly-factor
  mechanism rather than ATP synthesis or ATP hydrolysis by Fmc1 itself. The animal PANTHER grouping and
  the yeast experimental protein are not assumed to be identical subfamily assignments; transfer to fly
  CG34117 remains a homology-supported hypothesis with an unresolved conserved mechanism.
