family_id: PANTHER:PTHR42986
family_name: BENZALDEHYDE DEHYDROGENASE YFMT
preferred_name: Aromatic aldehyde dehydrogenases of the aldehyde dehydrogenase superfamily
summary: >-
  A bacterial PANTHER family of NAD(P)-dependent aldehyde dehydrogenases
  (Pfam Aldedh) that oxidize aromatic aldehydes to the corresponding acids in
  peripheral aromatic catabolism. Its single subfamily (SF1) holds the vanillin
  dehydrogenases of the ferulate route (Pseudomonas sp. HR199, P. fluorescens,
  P. putida KT2440, Corynebacterium glutamicum, Amycolatopsis), the TOL-plasmid
  benzaldehyde dehydrogenase XylC, the naphthalene-pathway salicylaldehyde
  dehydrogenases NahF/DoxF, the NADP-dependent 4-hydroxybenzaldehyde
  dehydrogenase PchA, a limonin dehydrogenase, and Bacillus subtilis YfmT and
  AldY.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members are aldehyde dehydrogenases with the conserved glutamate and
  cysteine active-site residues, but the physiological aldehyde (vanillin,
  benzaldehyde, salicylaldehyde, 4-hydroxybenzaldehyde, limonin) and in some
  cases the cofactor (NAD+ versus NADP+ for PchA) differ by member, and these
  specificities are not separated into PANTHER subfamilies.
