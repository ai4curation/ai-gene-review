node_assessments:
  - node_id: PANTHER:PTN001709183
    asserted_term:
      id: GO:0018479
      label: benzaldehyde dehydrogenase (NAD+) activity
    evidence: IBD
    negated: false
    paint_snapshot: '20241203'
    seeds:
      - id: UniProtKB:O06478
        gene_symbol: yfmT
        organism: Bacillus subtilis 168
    assessment: TOO_DEEP
    assessment_reason: >-
      PTN001709183 subtends all 10 leaves of the PANTHER 19 tree (the whole
      family), so a term seeded only by YfmT descends to every member through
      TreeGrafter. GO:0018479 is defined as "Catalysis of the reaction:
      benzaldehyde + NAD+ + H2O = benzoate + NADH + H+." That is right for the
      YfmT and XylC benzaldehyde dehydrogenases, but the family also contains
      enzymes characterized on other aldehydes: the vanillin dehydrogenases
      (HR199 Vdh, whose curated function is NAD-dependent oxidation of vanillin
      to vanillic acid), salicylaldehyde dehydrogenases and the NADP-dependent
      4-hydroxybenzaldehyde dehydrogenase PchA. A substrate-specific term should
      not descend family-wide; a generic aldehyde dehydrogenase term would be the
      safe root-level assertion. The two
      vanillin dehydrogenase gene reviews in this repository do not carry this
      IBA-derived term.
    supported_by:
      - reference_id: file:interpro/panther/PTHR42986/PTHR42986-paint.tsv
        supporting_text: "PTHR42986\tPTN001709183\tGO:0018479\tF\tIBD\tfalse\tUniProtKB:O06478"
      - reference_id: file:genes/PSEUH/vdh/vdh-uniprot.txt
        supporting_text: Catalyzes the NAD-dependent oxidation of vanillin to vanillic acid.
      - reference_id: file:interpro/panther/PTHR42986/PTHR42986-entries.csv
        supporting_text: Q59702,4-hydroxybenzaldehyde dehydrogenase (NADP(+)),protein,303,Pseudomonas putida
term_assessments:
  - assessed_term:
      id: GO:0018479
      label: benzaldehyde dehydrogenase (NAD+) activity
    scope: UNRESOLVED
    scope_reason: >-
      Correct for the benzaldehyde dehydrogenases (YfmT, XylC) but not
      established for the vanillin, salicylaldehyde and 4-hydroxybenzaldehyde
      dehydrogenases in the same single subfamily. Whether the vanillin
      dehydrogenases also oxidize benzaldehyde at a physiologically meaningful
      rate has not been compared across members in the evidence reviewed here,
      so the boundary of the activity within SF1 is left unresolved.
    supported_by:
      - reference_id: file:interpro/panther/PTHR42986/PTHR42986-entries.csv
        supporting_text: O06478,Benzaldehyde dehydrogenase YfmT,protein,224308
