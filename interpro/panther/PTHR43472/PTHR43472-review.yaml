family_id: PANTHER:PTHR43472
family_name: PHOSPHORIBOSYLAMINE--GLYCINE LIGASE
preferred_name: Standalone PurD GAR synthetases
summary: >-
  PurD (glycinamide ribonucleotide synthetase, GARS, EC 6.3.4.13) is an ATP-grasp enzyme. It
  ligates glycine to 5-phosphoribosylamine to give glycinamide ribonucleotide (GAR), the second step
  of de novo purine synthesis. This family holds the standalone PurD proteins of bacteria, archaea
  and plants (the plastid PUR2 enzymes). The homologous GARS domains of the fungal ADE5,7/ade1
  (PurD-PurM) and animal GART (PurD-PurN-PurM) fusions are not here: PANTHER classifies those whole
  proteins in PTHR10520:SF12.
functional_coherence: COHERENT
coherence_reason: >-
  All 105 reviewed entries are phosphoribosylamine--glycine ligases (104 bacterial/archaeal PurD, and
  the chloroplastic Arabidopsis PUR2). No divergent branch was identified. SF1 is named after the
  plant chloroplastic enzyme but holds the bacterial and archaeal PurD proteins as well. That is a
  naming artefact, not a functional split.
