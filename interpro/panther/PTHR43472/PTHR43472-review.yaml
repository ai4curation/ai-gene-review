notes: >-
  In the de_novo_purine_synthesis module, the purD_activity leaf lists PTHR43472 together with
  PTHR10520:SF12 as family_terms. Only PTHR43472 is a PurD selector in its own right. PTHR10520:SF12
  is a PurM (AIR synthetase) subfamily: only its fungal and animal fusion members have a GARS domain,
  and most of its members are standalone bacterial PurM (see the PTHR10520 review). The PANTHER obo
  also lists SF7 (PHOSPHORIBOSYLAMINE--GLYCINE LIGASE), which has no reviewed entries in this export.
  No yeast member of this family exists: the yeast GARS activity sits in ADE5,7 (PTHR10520).
