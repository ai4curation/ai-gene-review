family_id: PANTHER:PTHR43013
family_name: GLUTAMYL-TRNA REDUCTASE
preferred_name: Glutamyl-tRNA reductase (HemA/GluTR) family
summary: >-
  Glutamyl-tRNA reductases (GluTR, HemA; EC 1.2.1.70) catalyse the first committed step of
  the C5 route to 5-aminolevulinate: NADPH-dependent reduction of glutamate charged on
  tRNA(Glu) to glutamate 1-semialdehyde, via a thioester intermediate on a conserved
  active-site cysteine. Without NADPH the enzyme hydrolyses the thioester and releases
  glutamate (substrate esterase activity). GluTR is found in most bacteria, archaea and
  plant and algal plastids and pairs with glutamate-1-semialdehyde 2,1-aminomutase
  (PTHR43713); organisms that use the C4 (Shemin) route instead (animals, fungi,
  alpha-proteobacteria) lack it. Plant GluTRs are chloroplastic and tightly regulated by
  FLU, GluTR-binding protein and heme feedback.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF1); all characterized members are glutamyl-tRNA reductases. One
  Swiss-Prot member is named a probable multifunctional siroheme biosynthesis protein
  (a fusion) but retains the GluTR region.
