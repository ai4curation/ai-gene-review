family_id: PANTHER:PTHR24324
family_name: HOMEOBOX PROTEIN HHEX
summary: Homeobox proteins share a compact DNA-recognition domain and have diversified into regulators
  of many cellular and developmental programs. Fungal members include transcriptional regulators with
  functions that differ from animal developmental homeobox proteins.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory contains animal HHEX and fungal Pho2, Yox1/Yhp1 and Phx1-related regulators.
  Neurospora kal-1/NCU03593 has a homeodomain and a directly described colony-morphology deletion phenotype
  (PMID:16801547, Figure 3). These support a fungal developmental-regulatory interpretation, but the phenotype
  does not determine a DNA recognition sequence or activator versus repressor mechanism, and the HHEX
  subfamily label does not establish vertebrate development.
