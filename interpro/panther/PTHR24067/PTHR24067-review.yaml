family_id: PANTHER:PTHR24067
family_name: UBIQUITIN-CONJUGATING ENZYME E2
preferred_name: E2 ubiquitin-like modifier conjugases and E2-like regulators
summary: The E2 fold includes enzymes for ubiquitin, SUMO, NEDD8 and ISG15 conjugation as well as noncatalytic
  E2-like regulators. Catalytic thiol chemistry and modifier recognition must both be considered when
  transferring enzyme functions.
functional_coherence: HETEROGENEOUS
coherence_reason: NCU04302 aligns across its full length to experimentally characterized Ubc9 proteins,
  and Ubc9 forms a SUMO thioester. Rabbit G1TUN6 instead belongs to a ubiquitin/ISG15-associated comparison.
  Generic transferase activity does not identify the modifier, and cannot be assigned to every E2-like
  regulator. SUMO, NEDD8 and ubiquitin reaction labels are not interchangeable.
