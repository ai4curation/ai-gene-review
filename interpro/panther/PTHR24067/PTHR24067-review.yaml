term_assessments:
- assessed_term:
    id: GO:0016740
    label: transferase activity
  scope: UNRESOLVED
  scope_reason: Thioester formation and modifier transfer are demonstrated for Ubc9/SUMO and UbcH8/ISG15
    branches, whereas noncatalytic E2-like proteins can retain the fold without transfer. The Hus5.62
    experiment further shows that even formation of a SUMO thioester does not guarantee productive substrate
    conjugation. The complete catalytic/noncatalytic branch boundary is unresolved; ubiquitin, SUMO and
    NEDD8 specificity require separate evidence.
  supported_by:
  - reference_id: PMID:15131269
    supporting_text: "UbcH8 \nis a major E2 enzyme for ISG15 conjugation"
  - reference_id: PMID:9435231
    supporting_text: 'Moreover, recombinant yeast and mammalian UBC9 enzymes were found to form

      thioester complexes with SMT3 and SUMO-1, respectively.'
  - reference_id: PMID:12597774
    supporting_text: 'The

      Hus5.62 protein is also capable of forming a thioester link with SUMO, but it

      does not function in sumoylation assays, either in the modification of Rad22 or

      in SUMO chain formation.'
  - reference_id: file:genes/NEUCR/NCU04302/NCU04302-bioinformatics/RESULTS.md
    supporting_text: The full-length target sequence is 75.0% identical to fission-yeast Ubc9 P40984 across
      156 aligned residue pairs (99.36% target coverage), and 62.42% identical to human Ubc9 P63279 across
      157 residue pairs (100% target coverage).
  - reference_id: file:genes/RABIT/G1TUN6/G1TUN6-uniprot.txt
    supporting_text: DR   InterPro; IPR000608; UBC.
