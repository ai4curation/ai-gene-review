- assessed_term:
    id: GO:0090483
    label: phosphatidylglycerol-phosphatidylethanolamine phosphatidyltransferase activity
  scope: UNRESOLVED
  scope_reason: >-
    Shown only for E. coli ClsC (SF12) acting with YmdB. The other SF12 members (Helicobacter
    HP_0190/jhp_0176, P. putida PP_5276) are uncharacterized, and whether they use PE or PG
    as donor, or need a YmdB-like partner, is unknown. The term is right for E. coli ClsC
    but is not asserted for the whole subfamily.
  supported_by:
  - reference_id: PMID:22988102
    supporting_text: Most significant is the demonstration that the mode of CL biosynthesis by the combined
      YmdB-ClsC follows neither the “eukaryotic” nor “prokaryotic” pathway but involves the transfer
      of a phosphatidyl moiety from PE to the terminal free hydroxyl of PG to form CL.
- assessed_term:
    id: GO:0032049
    label: cardiolipin biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Every characterized subfamily makes cardiolipin, by either donor chemistry, and PAINT
    places the process at the family root.
  supported_by:
  - reference_id: PMID:22988102
    supporting_text: Deletion of all three genes (∆ clsABC ) resulted in a complete lack of CL.
