  divergence_description: >-
    The characterized member, E. coli ClsC, uses phosphatidylethanolamine rather than a
    second phosphatidylglycerol as phosphatidyl donor, so the family-root PG + PG cardiolipin
    synthase activity is not the right reaction for it. Cardiolipin biosynthesis itself is
    conserved.
  supported_by:
  - reference_id: PMID:22988102
    supporting_text: Most significant is the finding that YmdB-ClsC, an apparent unusual two-component complex,
      uses PG and PE in an unexpected mode of CL biosynthesis.
