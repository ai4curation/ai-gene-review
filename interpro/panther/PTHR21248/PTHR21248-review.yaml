    id: GO:0008808
    label: cardiolipin synthase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for the PG + PG cardiolipin synthase subfamilies with characterized members: SF22
    (ClsA-type, including T. brucei CLS), SF23 (ClsB-type) and SF7 (B. subtilis minor ClsB).
    Not for SF12 (ClsC, PE donor). SF11 and SF20 have no characterized member in the cached
    evidence and are left out.
