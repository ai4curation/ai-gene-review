- subfamily_id: PANTHER:PTHR21248:SF12
  label: CARDIOLIPIN SYNTHASE C
  description: >-
    The ClsC subfamily: E. coli ClsC, Helicobacter pylori HP_0190/jhp_0176 and P. putida
    KT2440 PP_5276. E. coli ClsC has no transmembrane helix. It needs its operon partner YmdB
    for high activity and uses phosphatidylethanolamine as the phosphatidyl donor to
    phosphatidylglycerol. The other members are uncharacterized; PP_5276 keeps both HKD motifs.
  representative_members:
  - id: UniProtKB:P75919
    label: Cardiolipin synthase C
    gene_symbol: clsC
    organism: Escherichia coli K-12
