family_id: PANTHER:PTHR21248
family_name: CARDIOLIPIN SYNTHASE
preferred_name: Phospholipase D-type (HKD) cardiolipin synthases (bacterial ClsA, ClsB, ClsC and kinetoplastid CLS)
summary: >-
  A family of phospholipase D (PLD) superfamily phosphatidyltransferases with two HxK(x4)D
  (HKD) catalytic motifs that form cardiolipin by phosphatidyl transfer between
  glycerophospholipids, releasing the head-group alcohol. This is the "prokaryotic" route to
  cardiolipin, distinct from the CDP-diacylglycerol-dependent eukaryotic cardiolipin synthases
  of PTHR14269. Most members are bacterial: the major ClsA-type enzymes anchored by N-terminal
  transmembrane helices (E. coli ClsA, B. subtilis ClsA, Pseudomonas ClsA; PANTHER SF22), the
  peripheral ClsB-type enzymes of enterobacteria and Pseudomonas (SF23), the minor B. subtilis
  ClsB (SF7), the Bacillus YwiE-related enzymes (SF20), and the ClsC subfamily (SF12). The
  family also reaches kinetoplastids: the Trypanosoma brucei cardiolipin synthase is a SF22
  PAINT seed. Most characterized members use two phosphatidylglycerol molecules, giving
  cardiolipin and glycerol. E. coli ClsC instead works with its partner YmdB and transfers
  the phosphatidyl group of phosphatidylethanolamine to phosphatidylglycerol. E. coli ClsB
  also makes phosphatidylglycerol from phosphatidylethanolamine and glycerol, and can
  transfer the phosphatidyl group to water.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Cardiolipin biosynthesis is shared by every characterized member. The exact reaction
  differs: the PG + PG cardiolipin synthase activity (GO:0008808) holds for ClsA-type (SF22),
  ClsB-type (SF23) and the B. subtilis minor ClsB (SF7). The ClsC subfamily (SF12) uses
  phosphatidylethanolamine as phosphatidyl donor (GO:0090483). SF11 (PLD
  phosphodiesterase domain-containing protein) and SF20 (YwiE-related) have no characterized
  member in the cached evidence and were not adjudicated.
