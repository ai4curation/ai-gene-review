family_id: PANTHER:PTHR10724
family_name: 30S RIBOSOMAL PROTEIN S1
preferred_name: S1-domain RNA-binding proteins
summary: This group contains bacterial ribosomal S1 proteins alongside S1-domain proteins such as Tex
  and other RNA-associated proteins. RNA-binding architecture is shared more broadly than incorporation
  into a ribosomal subunit.
functional_coherence: HETEROGENEOUS
coherence_reason: The Deinococcus protein has repeated S1 domains and bS1 placement, supporting mRNA binding
  and ribosomal participation. A ribosome term cannot be extended to every S1-domain protein, and the
  presence of an S1 fold alone does not identify the RNA substrate.
subfamilies:
- subfamily_id: PANTHER:PTHR10724:SF7
  label: SMALL RIBOSOMAL SUBUNIT PROTEIN BS1C
  description: Recorded placement of Q9RSY6. The Deinococcus protein has repeated S1 domains and bS1 placement,
    supporting mRNA binding and ribosomal participation. A ribosome term cannot be extended to every S1-domain
    protein, and the presence of an S1 fold alone does not identify the RNA substrate.
  representative_members:
