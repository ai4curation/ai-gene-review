- assessed_term:
    id: GO:0005840
    label: ribosome
  scope: UNRESOLVED
  scope_reason: Ribosomal S1 is directly identified as a 30S subunit protein in the cited biochemical
    study. This supports ribosome membership for bS1 orthologs, while Tex and other S1-domain-containing
    proteins need not be ribosomal constituents. The S1 fold cannot define an exhaustive ribosome-member
    boundary across this broader family.
  supported_by:
