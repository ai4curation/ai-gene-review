term_assessments:
- assessed_term:
    id: GO:0003676
    label: nucleic acid binding
  scope: UNRESOLVED
  scope_reason: Purified E. coli S1 binds poly(A) and poly(C), directly establishing nucleic-acid binding
    in the ribosomal S1 branch. The repeated S1 domains in the Deinococcus target support that RNA-binding
    comparison. Other S1-domain proteins recognize different RNA substrates; the complete distribution
    of experimentally competent binding modules is not delimited.
  supported_by:
