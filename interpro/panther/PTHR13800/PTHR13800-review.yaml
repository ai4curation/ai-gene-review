family_id: PANTHER:PTHR13800
family_name: TRANSIENT RECEPTOR POTENTIAL CATION CHANNEL, SUBFAMILY M, MEMBER 6
preferred_name: TRPM (melastatin-related) transient receptor potential channel family
summary: >-
  TRPM channels are tetrameric six-transmembrane cation channels of the transient receptor potential
  superfamily. The vertebrate members fall into branches with very different gating and selectivity:
  TRPM1 and TRPM3 (nonselective, Ca2+-permeable; TRPM1 is the mGluR6-gated channel of retinal ON-bipolar
  cells), TRPM6 and TRPM7 (divalent-permeable channels fused to an alpha-kinase domain), TRPM2 (gated by
  ADP-ribose through a C-terminal NUDT9-homology domain) and TRPM8 (cold and menthol sensor), and TRPM4
  and TRPM5 (Ca2+-activated channels selective for monovalent cations). Invertebrate members include
  C. elegans GON-2, GTL-1 and GTL-2 and Drosophila Trpm.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Cation channel activity at the plasma membrane is shared by every characterized member. What diverges is
  divalent permeability and gating. TRPM4 and TRPM5 conduct monovalent cations and are not detectably
  permeable to Ca2+, so calcium channel terms are safe only for the TRPM1/3/6/7, TRPM2/8 and nematode
  GON-2/GTL-1 branches; PAINT stops the ligand-gated calcium channel IBD for TRPM4 and TRPM5 with IRDs.
  Ca2+-activated gating (TRPM4/5), ADP-ribose gating (TRPM2), kinase activity (TRPM6/7) and cold sensing
  (TRPM8) are branch-specific.
