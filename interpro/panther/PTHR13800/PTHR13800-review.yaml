notes: >-
  The PAINT slice was fetched with just fetch-panther-paint on 2026-11-16. Reviewed members are human TRPM1
  (SF13) and C. elegans GON-2 (SF44), GTL-1 (SF10) and GTL-2 (SF1); no other human TRPM has a gene review.
  Which branches lie below each node was read from the PTN ids in the IBA rows of human TRPM1-8 in QuickGO,
  not from the tree itself. Not assessed, as they are not on a reviewed member's lineage: the TRPM8
  thermoception and cold-induced thermogenesis IBDs at PTN008551499 and the TRPM2 release of sequestered
  calcium IBD at PTN008551503.
