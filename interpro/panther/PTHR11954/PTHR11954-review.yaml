family_id: PANTHER:PTHR11954
family_name: D-DOPACHROME DECARBOXYLASE
preferred_name: Macrophage migration inhibitory factor / D-dopachrome tautomerase (MIF/DDT) cytokine family
summary: >-
  Eukaryotic family of barrel-shaped homotrimeric cytokines and keto-enol
  tautomerases/isomerases comprising macrophage migration inhibitory factor (MIF,
  PTHR11954:SF6) and its functional paralog D-dopachrome tautomerase /
  D-dopachrome decarboxylase (DDT / MIF-2, PTHR11954:SF22), together with the
  primate duplicate DDTL (PTHR11954:SF39) and nematode MIF-like proteins
  (mif-2, mif-3). Members share a conserved 4-oxalocrotonate tautomerase-like
  beta-alpha-beta fold that assembles into a three-fold symmetric homotrimer with
  three catalytic pockets at the subunit interfaces, each centered on an invariant
  catalytic N-terminal proline (Pro-2 after initiator Met-1 cleavage) that
  catalyzes phenylpyruvate tautomerization and D-dopachrome isomerization. In
  vertebrates and bilaterians, secreted MIF and DDT function as high-affinity
  agonistic cytokine ligands for the cell-surface receptor CD74 (the MHC class II
  invariant chain), recruiting the signaling co-receptor CD44 to activate Src
  tyrosine kinases and the sustained ERK1/2 MAP kinase cascade.
functional_coherence: COHERENT
