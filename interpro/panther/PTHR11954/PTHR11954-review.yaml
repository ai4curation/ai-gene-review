      label: cytokine activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Both major subfamilies (MIF in SF6 and DDT in SF22) function as secreted
      proinflammatory cytokines that bind the CD74-CD44 receptor complex with
      nanomolar affinity to activate intracellular signaling.
    supported_by:
      - reference_id: PMID:12782713
        supporting_text: MIF binds to the extracellular domain of CD74, and CD74 is required for MIF-induced activation of the extracellular signal-regulated kinase-1/2 MAP kinase cascade, cell proliferation, and PGE2 production.
      - reference_id: PMID:21817065
        supporting_text: We produced recombinant D-DT and demonstrate that it binds with high affinity to CD74, activates the ERK1/2 MAP kinase signaling cascade, and recapitulates many of the inflammatory functions of MIF, including modulation of macrophage migration and glucocorticoid-induced immunosuppression.
  - assessed_term:
      id: GO:0035691
      label: macrophage migration inhibitory factor signaling pathway
    scope: FAMILY_WIDE
    scope_reason: >-
      Both MIF (SF6) and DDT/MIF-2 (SF22) initiate the macrophage migration
      inhibitory factor signaling pathway by binding the cell-surface receptor CD74
      and recruiting the co-receptor CD44 to activate Src and ERK1/2 MAP kinase
      signaling. PAINT already places GO:0005125 (cytokine activity) at the
      bilaterian node PTN000237513 but places GO:0035691 only on the chordate CD74
      receptor node PTN002679661; in GOA, human DDT (UniProtKB:P30046) carries a
      direct IDA annotation to GO:0035691 (PMID:21817065), whereas human MIF
      (UniProtKB:P14174) was only annotated to the parent term GO:0007166 (cell
      surface receptor signaling pathway, IDA, PMID:12782713) and neither MIF nor
      DDT receives GO:0035691 by IBA.
    supported_by:
      - reference_id: PMID:12782713
        supporting_text: MIF binds to the extracellular domain of CD74, and CD74 is required for MIF-induced activation of the extracellular signal-regulated kinase-1/2 MAP kinase cascade, cell proliferation, and PGE2 production.
      - reference_id: PMID:17045821
        supporting_text: CD74 alone mediated MIF binding; however, MIF-induced ERK1 and ERK2 kinase phosphorylation required the coexpression of full-length CD44.
      - reference_id: PMID:21817065
        supporting_text: We produced recombinant D-DT and demonstrate that it binds with high affinity to CD74, activates the ERK1/2 MAP kinase signaling cascade, and recapitulates many of the inflammatory functions of MIF, including modulation of macrophage migration and glucocorticoid-induced immunosuppression.
  - assessed_term:
      id: GO:0050178
      label: phenylpyruvate tautomerase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Catalyzed by the conserved N-terminal Pro-2 catalytic base and interfacial
      substrate-binding pocket across eukaryotic MIF and DDT family members.
    supported_by:
      - reference_id: PMID:11439086
        supporting_text: The catalytic specificity of recombinant TsMIF in the ketonization of phenylpyruvate (1.4x10(6) M(-1) x s(-1)) was comparable with that of human MIF, while that of p-hydroxyphenylpyruvate (9.1x10(4) M(-1) x s(-1)) was 71-fold lower.
      - reference_id: PMID:17526494
        supporting_text: We studied the crystal structures of MIF.OXIM-based inhibitors and found two opposite orientations for binding to the active site that were dependent on the chemical structures of an R-group. One orientation was completely unexpected based on previous studies with hydroxyphenylpyruvate and (S,R)-3-(4-hydroxyphenyl)-4,5-dihydro-5-isoxazole acetic acid methyl ester (ISO-1).
      - reference_id: PMID:21817065
