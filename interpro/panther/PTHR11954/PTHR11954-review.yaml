residue_sites:
  - site_id: tautomerase_active_site
    label: Pro-2 phenylpyruvate and D-dopachrome tautomerase catalytic site
    description: >-
      Interfacial keto-enol tautomerase active site of the MIF/DDT homotrimer. The
      uncapped imino nitrogen of N-terminal Pro-2 (exposed after cleavage of
      initiator Met-1) has a depressed pKa (~5.6-6.0) and acts as the general base
      catalyst for proton transfer during tautomerization of phenylpyruvate,
      p-hydroxyphenylpyruvate, and D-dopachrome, while Lys-33, Ile-65, and Asn-98
      bind and orient the substrate carboxylate and keto/enol groups.
    anchor:
      id: UniProtKB:P14174
      label: MIF
      gene_symbol: MIF
      organism: Homo sapiens
      gene_review: genes/human/MIF/MIF-ai-review.yaml
    anchor_sequence_version: 4
    residues:
      - position: 2
        expected:
          - P
        role: Catalytic general base (N-terminal imino nitrogen after initiator Met-1 cleavage)
      - position: 33
        expected:
          - K
        role: Substrate carboxylate-binding positively charged side chain
      - position: 65
        expected:
          - I
        role: Active-site backbone hydrogen-bond donor to substrate
      - position: 98
        expected:
          - N
        role: Substrate hydrogen-bonding side chain across the subunit interface
    required_for:
      - term:
          id: GO:0050178
          label: phenylpyruvate tautomerase activity
        strength: CONTRIBUTES
        rationale: >-
          The N-terminal Pro-2 imino group is the catalytic base that abstracts the
          substrate proton during keto-enol tautomerization, while Lys-33, Ile-65,
          and Asn-98 form the interfacial substrate-binding pocket conserved across
          MIF and DDT family members.
        supported_by:
          - reference_id: PMID:21817065
            supporting_text: The D-DT proteins share with MIF a canonical N-terminal proline (formed after posttranslational excision of the initiating methionine), which catalyzes substrate tautomerization ( 19 ), but they lack two of the three conserved cysteines (Cys 59 and Cys 80 ) that appear in all known mammalian MIF proteins.
    site_source: UNIPROT_FEATURE
    positive_controls:
      - id: UniProtKB:P14174
        label: MIF
        gene_symbol: MIF
        organism: Homo sapiens
        gene_review: genes/human/MIF/MIF-ai-review.yaml
