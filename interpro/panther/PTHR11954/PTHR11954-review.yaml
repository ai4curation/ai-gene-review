notes: >-
  PTHR11954 (D-DOPACHROME DECARBOXYLASE) encompasses both MIF (SF6) and its
  functional cytokine homolog DDT/MIF-2 (SF22). PAINT places GO:0005125 (cytokine
  activity) at the bilaterian ancestor PTN000237513 and GO:0005576 (extracellular
  region) + GO:0050178 (phenylpyruvate tautomerase activity) at the eukaryotic root
  PTN000237510, but does not place GO:0035691 (macrophage migration inhibitory
  factor signaling pathway) on PTN000237513. Adding GO:0035691 to PTN000237513 (and
  directly to human MIF via its gene review, complementing the existing direct IDA
  annotation on human DDT from PMID:21817065) closes the ligand gap on GO:0035691
  across MIF and DDT orthologs.
