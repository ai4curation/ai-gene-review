family_id: PANTHER:PTHR44140
family_name: LD25575P
summary: DNAJC3/P58IPK-related proteins combine repeat-mediated protein interactions with a J-domain cochaperone
  module. Their protein-folding roles are coupled to cellular stress responses and the chaperone systems
  present in their compartment.
functional_coherence: MOSTLY_COHERENT
coherence_reason: TPR/J-domain cochaperones bind nonnative proteins and communicate with an Hsp70 partner.
  Direct P58/DNAJC3 experiments show that most molecules enter the ER lumen, its TPR-containing region
  binds misfolded clients, and BiP plus ATP promotes client release through a functional J-domain (PMID:18923430).
  ATPase chemistry belongs to BiP rather than the cochaperone. The related Jem1 and animal branches can
  differ in membrane attachment and clients; the broad cochaperone mechanism is coherent, but universal
  PKR inhibition, a cytosolic localization or one substrate is not established by the family name.
