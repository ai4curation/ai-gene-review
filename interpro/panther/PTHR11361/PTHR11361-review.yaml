family_id: PANTHER:PTHR11361
family_name: DNA MISMATCH REPAIR PROTEIN MUTS FAMILY MEMBER
preferred_name: MutS/MSH mismatch-recognition ATPases
summary: 'The MutS homolog family: bacterial MutS and the eukaryotic MSH proteins. Bacterial MutS (SF34)
  is a homodimer that recognizes base-base mismatches and small insertion/deletion loops and, through
  an ATP-dependent conformational switch, recruits MutL to initiate repair; this step is shared by MutH-dependent
  and MutH-independent bacteria. Eukaryotes use heterodimers: MSH2 with MSH6 (MutSalpha) or MSH3 (MutSbeta)
  for nuclear mismatch repair, MSH4 with MSH5 for meiotic crossover formation, and the organellar MSH1
  (which falls in SF34 with bacterial MutS). The bacterial MutS2 proteins form a separate, small subfamily.'
functional_coherence: HETEROGENEOUS
coherence_reason: 'Of 667 reviewed members, 595 are in SF34, 584 of them named DNA mismatch repair protein
  MutS, with the organellar MSH1 proteins of plants and yeast as the eukaryotic minority. The remaining
  subfamilies are eukaryotic: MSH3 (SF122, 34), MSH2 (SF35, 12), MSH6 (SF148, 8), MSH5 (SF20, 7) and MSH4
  (SF21, 6), plus small MSH6/MSH3 and MutS2 groups. Mismatch recognition belongs to the bacterial MutS,
  MSH2, MSH3 and MSH6 clades; MSH4 and MSH5 act in meiotic recombination and do not recognize mismatches.
  Duplex DNA binding is the only activity PAINT places at the root.'
