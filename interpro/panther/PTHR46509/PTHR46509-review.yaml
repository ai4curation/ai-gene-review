node_assessments:
- node_id: PANTHER:PTN000591370
  asserted_term:
    id: GO:0004604
    label: phosphoadenylyl-sulfate reductase (thioredoxin) activity
  paint_snapshot: '20200810'
  seeds:
  - id: SGD:S000006371
    label: MET16
    organism: Saccharomyces cerevisiae
  - id: UniProtKB:P17854
    label: cysH
    organism: Escherichia coli K-12
  - id: UniProtKB:P56859
    label: sA
    organism: Aspergillus nidulans
  assessment: UNRESOLVED
  assessment_reason: >-
    All three seeds are PAPS reductases, and the fungal and gamma-proteobacterial descendants
    (MET16, met16, Salmonella, Vibrio, Shewanella and Xanthomonas CysH) are correctly covered. But
    the node also passes GO:0004604 to bacterial APS reductases that carry the Fe-S cysteine motif:
    in the PAINT UniProt GAF, B. subtilis CysH (P94498) and CysH2 (O06737), B. cereus (Q81FZ1),
    Streptomyces coelicolor (Q9ADG3) and Deinococcus radiodurans (P56860) CysH all inherit it,
    and UniProt names them APS reductases (EC 1.8.4.10). B. subtilis CysH has been shown to reduce
    PAPS as well as APS, so the transfer is not wrong for every APS-reductase descendant, but no
    data show PAPS reduction by the others. An IRD at the Fe-S APS-reductase clade (with the
    B. subtilis enzyme handled separately), or a separate GO:0043866 assertion there, would make
    the substrate split explicit. Not resolved without the tree topology inside SF1.
  supported_by:
  - reference_id: PMID:12072441
    supporting_text: >-
      we have redefined the
      substrate specificity of the B. subtilis CysH, formerly designated a PAPS
      reductase, as an APS reductase, based on its ability to complement a mutant E.
      coli strain deficient in APS kinase.
  - reference_id: PMID:16008502
    supporting_text: >-
      Interestingly, another member of this subclass, from Bacillus subtilis, can reduce PAPS in
      addition to APS [19].
- node_id: PANTHER:PTN008207357
  asserted_term:
    id: GO:0009973
    label: adenylyl-sulfate reductase activity
  paint_snapshot: '20250911'
  seeds:
  - id: AGI_LocusCode:AT4G04610
    label: APR1
    organism: Arabidopsis thaliana
  - id: AGI_LocusCode:AT1G62180
    label: APR2
    organism: Arabidopsis thaliana
  - id: AGI_LocusCode:AT4G21990
    label: APR3
    organism: Arabidopsis thaliana
  assessment: SOUND
  assessment_reason: >-
    The seeds are the Arabidopsis plant-type APS reductases. The node also contains the bacterial
    APS reductase of M. tuberculosis (P9WIK3, SF1), which receives GO:0009973 by IBA from this
    node (checked in the PAINT UniProt GAF), and P. aeruginosa CysH (O05927) is a seed for the
    companion GO:0000103 IBD here. Plant APRs use glutathione through a C-terminal
    thioredoxin-like domain that the bacterial enzymes lack, and M. tuberculosis CysH uses
    thioredoxin. The current GO:0009973 definition is acceptor-generic (A + AMP + sulfite =
    APS + AH2), so it holds for both groups and the placement is sound; for the bacterial
    members the more specific GO:0043866 adenylyl-sulfate reductase (thioredoxin) activity
    would be the better annotation. The companion GO:0000103 IBD is sound for all descendants.
  supported_by:
  - reference_id: PMID:16008502
    supporting_text: >-
      (A) APS reductases from higher plants (group a) possess a reductase domain and a unique
      C-terminal domain with high homology to thioredoxin. Bacterial APS reductases (group b)
      lack this specialized domain, but share the cysteine motif -CC-X∼80-CXXC- present in the
      reductase domain.
  - reference_id: PMID:12072441
    supporting_text: >-
      genetic complementation using Escherichia coli mutant
      strains deficient in APS kinase and PAPS reductase was used to define the M.
      tuberculosis and Mycobacterium smegmatis CysH enzymes as APS reductases.
term_assessments:
- assessed_term:
    id: GO:0004604
    label: phosphoadenylyl-sulfate reductase (thioredoxin) activity
  scope: UNRESOLVED
  scope_reason: >-
    Safe for the PAPS reductases (fungal MET16/met16, A. nidulans sA, enterobacterial CysH),
    which lack the Fe-S cysteine motif. Not established for the bacterial APS reductases that
    share SF1 (M. tuberculosis CysH is an APS reductase; B. subtilis CysH reduces both). The
    distinguishing feature is the presence or absence of the -CC-X~80-CXXC- motif rather than
    subfamily membership; no residue site is formalised here because motif positions were not
    checked in each sequence. The APS-dependent sulfate reduction module uses SF1 with a
    GO:0004604 required_function and fungal plus E. coli representatives, which is consistent;
    the SF1 selector alone would also capture APS reductases.
  supported_by:
  - reference_id: PMID:3060034
    supporting_text: >-
      reduces 3'-phosphoadenylyl sulphate to adenosine-3',5'-bisphosphate and free sulphite at a
      stoichiometry of 1:1. Reduced thioredoxin is required as cosubstrate.
  - reference_id: PMID:2203779
    supporting_text: we show that MET16 is the structural gene for PAPS reductase
  - reference_id: PMID:16008502
    supporting_text: >-
      PAPS reductases (group c) lack this cysteine motif as well as the thioredoxin domain.
  - reference_id: PMID:12072441
    supporting_text: >-
      genetic complementation using Escherichia coli mutant
      strains deficient in APS kinase and PAPS reductase was used to define the M.
      tuberculosis and Mycobacterium smegmatis CysH enzymes as APS reductases.
- assessed_term:
    id: GO:0000103
    label: sulfate assimilation
  scope: FAMILY_WIDE
  scope_reason: >-
    Both PAPS and APS reductases catalyse the first committed reductive step of sulfate
    assimilation. Asserted at both PAINT nodes (PTN000591370 and PTN008207357); sound.
  supported_by:
  - reference_id: PMID:16008502
    supporting_text: >-
      Sulfonucleotide reductases are a diverse family of enzymes that catalyze the
      first committed step of reductive sulfur assimilation.
- assessed_term:
    id: GO:0009973
    label: adenylyl-sulfate reductase activity
  scope: UNRESOLVED
  scope_reason: >-
    APS reduction holds for the bacterial APS reductases with the Fe-S cysteine motif
    (M. tuberculosis, B. subtilis, Streptomyces, Deinococcus CysH) and for the plant APRs in the
    PAINT tree, but not for the PAPS reductases (MET16, met16, E. coli CysH), which share SF1.
    Applicability follows the -CC-X~80-CXXC- motif, not subfamily membership. MET16 and met16
    must not receive it.
  supported_by:
  - reference_id: PMID:16008502
    supporting_text: >-
      PAPS reductases (group c) lack this cysteine motif as well as the thioredoxin domain.
