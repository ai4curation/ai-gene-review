notes: >-
  Module: aps_dependent_assimilatory_sulfate_reduction (SF1 with GO:0004604 required_function;
  MET16 P18408, met16 Q10270, E. coli CysH P17854). The MET16 and met16 gene reviews accept the
  GO:0004604 IBA, consistent with this review. The P. putida KT2440 CysH (Q88KG2, gene review
  genes/PSEPK/cysH, core function GO:0043866) is in PTHR46482, not this family. UniProt names,
  EC numbers, Pfam domains and lengths for P94498, O06737, Q81FZ1, Q9ADG3, P56860, P9WIK3 and the
  Arabidopsis APRs were checked by UniProt REST on 2026-10-06. The PAINT tree used for the paint
  file places Arabidopsis APR1-3 inside PTHR46509, whereas their current UniProt PANTHER
  cross-reference is PTHR46482; this is a PANTHER version/classification discrepancy and is not
  resolved here.
