family_id: PANTHER:PTHR46509
family_name: PHOSPHOADENOSINE PHOSPHOSULFATE REDUCTASE
preferred_name: Thioredoxin-dependent sulfonucleotide reductases (PAPS reductases and bacterial APS reductases)
summary: >-
  Sulfonucleotide reductases of the CysH type, which reduce activated sulfate to sulfite with
  electrons supplied by thioredoxin, the first committed step of reductive sulfate assimilation.
  The family contains two biochemically distinct groups that share the same fold and catalytic
  mechanism: PAPS reductases, which act on 3'-phosphoadenosine 5'-phosphosulfate (E. coli and
  other gamma-proteobacterial CysH, fungal MET16 of S. cerevisiae, S. pombe and Aspergillus), and
  bacterial APS reductases, which act on adenosine 5'-phosphosulfate and carry a [4Fe-4S] cluster
  bound by a -CC-X~80-CXXC- cysteine motif (Mycobacterium tuberculosis, Bacillus, Streptomyces,
  Deinococcus CysH). Plant APS reductases (APR1-3), which add a C-terminal thioredoxin-like domain
  and use glutathione, are classified by UniProt in PTHR46482 but appear in this family's PAINT
  tree.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are sulfonucleotide reductases acting in sulfate assimilation, by a conserved
  thioredoxin-dependent mechanism. Substrate specificity diverges: the PAPS reductases (fungal
  MET16, enterobacterial CysH) lack the iron-sulfur cysteine motif, whereas the bacterial APS
  reductases (M. tuberculosis, B. subtilis, Streptomyces, Deinococcus CysH) have it and reduce
  APS (B. subtilis CysH also reduces PAPS). Both groups are in the single subfamily SF1, so
  PAPS- versus APS-reductase activity cannot be scoped by subfamily.
