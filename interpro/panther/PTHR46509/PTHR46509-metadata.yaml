  name:
    name: Phosphoadenosine phosphosulfate reductase
    short: PAPS_reductase_CysH
  description:
  - text: The PAPS reductase family, specifically the CysH subfamily, consists of
      enzymes that play a crucial role in the biological process of sulfur assimilation.
      Members of this family are responsible for the reduction of phosphoadenosine
      5'-phosphosulfate (PAPS) or adenosine 5'-phosphosulfate (APS) to sulfite, a
      key step in the biosynthesis of essential sulfur-containing compounds. The enzymatic
      reaction is dependent on thioredoxin, which acts as an electron donor. This
      reduction process is vital for the synthesis of sulfur amino acids and other
      sulfur metabolites that are fundamental for cellular function. The activity
      of these enzymes is subject to regulation, with some members being inhibited
      by compounds that modify cysteine residues or by adenosine diphosphate (ADP).
