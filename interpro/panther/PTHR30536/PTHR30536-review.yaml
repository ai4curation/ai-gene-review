family_id: PANTHER:PTHR30536
family_name: ALTRONATE/GALACTARATE DEHYDRATASE
preferred_name: UxaA-family altronate and galactarate dehydratases
summary: >-
  Bacterial (and a few archaeal and eukaryotic) hydro-lyases that share an
  N-terminal SAF beta-clip domain, a dimerization domain and a C-terminal
  catalytic domain with a novel Rossmann-like fold, unrelated to the enolase
  superfamily. The family splits into two characterized activities. SF1 is
  galactarate dehydratase (GarD). It dehydrates galactarate to
  5-dehydro-4-deoxy-D-glucarate, the entry step of galactarate catabolism;
  E. coli GarD is the biochemically and structurally characterized member and
  is Fe2+-dependent. SF5 holds D-altronate dehydratases (UxaA) of the Ashwell
  hexuronate (galacturonate) pathway. SF5 also contains the beta subunit (SuyB)
  of the two-subunit (2R)-sulfolactate sulfo-lyase, a different reaction.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members are acid-sugar hydro-lyases on a shared fold, but
  the substrate is clade-specific: galactarate in SF1 (GarD), D-altronate in
  most of SF5 (UxaA). SF5 also includes SuyB, a sulfolactate sulfo-lyase
  subunit, so neither the galactarate nor the altronate activity is
  family-wide.
