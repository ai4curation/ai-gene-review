- subfamily_id: PANTHER:PTHR30536:SF5
  label: ALTRONATE DEHYDRATASE
  description: >-
    D-altronate dehydratases (UxaA) of galacturonate catabolism, plus the
    SuyB beta subunit of (2R)-sulfolactate sulfo-lyase and uncharacterized
    archaeal, planctomycete and choanoflagellate members.
  diverged_from_family: true
  divergence_description: >-
    SF5 members act on D-altronate rather than galactarate; the SuyB members
    contribute to desulfonation of sulfolactate rather than acid-sugar
    dehydration.
