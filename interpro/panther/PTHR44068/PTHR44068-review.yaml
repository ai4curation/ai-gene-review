family_id: PANTHER:PTHR44068
family_name: ZGC:194242
preferred_name: Erg6/SMT and geranyl-diphosphate methyltransferase family
summary: >-
  PTHR44068 is a class I-like SAM-dependent methyltransferase family containing
  fungal, plant and amoebozoan sterol methyltransferases, bacterial and
  cyanobacterial geranyl-diphosphate or lipid methyltransferases, archaeal
  methyltransferase-like proteins, and several specialized-metabolism
  O-/N-methyltransferases. The sterol 24-C-methyltransferase Erg6/SMT proteins
  sit in a clade within PTHR44068:SF1 and methylate a sterol side chain at C-24;
  in fungi this Erg6 branch feeds ergosterol biosynthesis.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Methyl transfer is shared broadly, but the acceptor differs: fungal Erg6
  proteins methylate zymosterol or related sterol intermediates, plant SMTs
  methylate cycloartenol-derived sterols, and the sibling PTHR44068:SF11 branch
  contains geranyl-diphosphate and secondary-metabolite methyltransferases.
