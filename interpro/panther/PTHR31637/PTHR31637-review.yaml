notes: >-
  IBA recipients were listed from the PAINT UniProt GAF (PANTHER 19). No IRD or IKR rows
  for this family's nodes were found in the PAINT IBD GAF. Module usage: emp_glycolysis and
  gluconeogenesis both put PTHR31637 in family_terms beside the dPGM family PTHR11931 for
  the PGAM step. That is consistent with this review: the module representatives from yeasts
  are dPGM (GPM1, gpm1), and B. subtilis gpmI is the only iPGM representative. No yeast gene
  review applies, because S. cerevisiae and S. pombe have no iPGM. The P. putida gpmI review
  (Q88CX4, SF0) is consistent with the family-wide activity. QuickGO now reports the
  route-specific glycolysis terms (GO:0061615, GO:0061621) as obsolete in favour of GO:0006096
  glycolytic process, while the repository's pinned ontology still has them. This review
  assesses no glycolysis route term for this family.
