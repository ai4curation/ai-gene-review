family_id: PANTHER:PTHR31637
family_name: 2,3-BISPHOSPHOGLYCERATE-INDEPENDENT PHOSPHOGLYCERATE MUTASE
preferred_name: Cofactor-independent phosphoglycerate mutase (iPGM, GpmI)
summary: >-
  Cofactor-independent phosphoglycerate mutases (iPGM, GpmI) interconvert 3-phosphoglycerate
  and 2-phosphoglycerate in glycolysis and gluconeogenesis. They are manganese-dependent
  enzymes and are unrelated to the
  2,3-bisphosphoglycerate-dependent mutases (dPGM, PTHR11931) that fungi and vertebrates use.
  The family covers bacterial GpmI (E. coli, B. subtilis, Pseudomonas, cyanobacteria,
  mycoplasmas), some archaeal GpmI, nematode and filarial ipgm-1, trypanosomatid PGAM and the
  cytosolic plant iPGMs. S. cerevisiae and S. pombe have no member.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member is a phosphoglycerate mutase. The PAINT seeds for phosphoglycerate
  mutase activity span bacteria (E. coli and B. subtilis GpmI), a trypanosomatid (T. brucei
  PGAM), a nematode (C. elegans ipgm-1) and both Arabidopsis paralogs (PGM1 in SF7 and PGM2 in
  SF13). The subfamilies are taxonomic (SF0 bacterial, nematode and trypanosomatid; SF7 and
  SF13 plant), not functional. No neofunctionalized or catalytically dead branch was found in
  the PANTHER member inventory.
