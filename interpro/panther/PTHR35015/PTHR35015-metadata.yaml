  name:
    name: Notch pathway signaling modulators
    short: Notch_signaling_modulators
  description:
  - text: This family of proteins includes secreted factors that are likely involved
      in Notch signaling pathways. Members of this family are implicated in determining
      cell fate decisions, particularly in vulval precursor cells, by acting redundantly
      with other ligands. They are also associated with neuronal functions, contributing
      to avoidance responses and the regulation of sleep-like quiescence during larval
      to adult transition. These proteins function through activation of Notch receptors
      and may operate in conjunction with EGF signaling.
