family_id: PANTHER:PTHR45728
family_name: ACETYL-COA CARBOXYLASE, ISOFORM A
preferred_name: Eukaryotic multidomain acetyl-CoA carboxylase family
summary: >-
  Biotin-dependent multidomain acetyl-CoA carboxylases (S. cerevisiae ACC1 and mitochondrial HFA1,
  S. pombe cut6, human ACACA and ACACB) that make malonyl-CoA for fatty acid synthesis; ACACB also
  regulates beta-oxidation.
functional_coherence: COHERENT
coherence_reason: All subfamilies are acetyl-CoA carboxylases; compartments differ.
