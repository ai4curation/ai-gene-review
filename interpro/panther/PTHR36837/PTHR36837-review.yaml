family_id: PANTHER:PTHR36837
family_name: POLY(3-HYDROXYALKANOATE) POLYMERASE SUBUNIT PHAC
preferred_name: PHA synthases with variable polymer and subunit scope
summary: Proteins related to polyhydroxyalkanoate synthases catalyze ester-polymer formation from hydroxyacyl-CoA
  precursors. Characterized class I and class II enzymes differ in preferred substrates, and other classes
  have partner requirements. The same SF5 includes Cupriavidus necator PhaC and Pseudomonas-type class
  II PhaC1/PhaC2; its name does not make every member a PHB-specific or medium-chain-specific synthase.
functional_coherence: HETEROGENEOUS
coherence_reason: The family joins characterized synthases with unresolved branches. Class I/class II
  substrate preferences are not interchangeable, and a class label is not an absolute exclusion of secondary
  substrates. SF4 includes a submitter-named phaZ member, but that unreviewed name is not evidence of
  a verified catalytic switch.
