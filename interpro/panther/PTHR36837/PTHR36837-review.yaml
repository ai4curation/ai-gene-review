term_assessments:
- assessed_term:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  scope: UNRESOLVED
  scope_reason: Characterized synthases perform non-amino-acyl transfer during polyester elongation. A
    whole-family grant is withheld for unresolved branches; this does not deny the positive class I/class
    II synthase members or assert a hydrolase loss from a submitter label.
  supported_by:
  - &id001
    reference_id: file:genes/ECTOL/phaC1/phaC1-uniprot.txt
    supporting_text: Synthesizes poly(3-hydroxyalkanoates) (PHA), complements a mutant of P.putida that
      does not make PHA.
  - &id002
    reference_id: file:analysis/module_audits/bacterial_mcl_pha_synthesis_and_mobilization/family-consultation/P23608-uniprot.json
    supporting_text: Polymerizes (R)-3-hydroxybutyryl-CoA to create polyhydroxybutyrate (PHB) which consists
      of thousands of hydroxybutyrate molecules linked end to end.
- assessed_term:
    id: GO:0042621
    label: poly(3-hydroxyalkanoate) biosynthetic process
  scope: UNRESOLVED
  scope_reason: Positive PHA biosynthesis is established for the characterized synthases. Family and SF5
    classification alone do not resolve polymer composition, partner requirements or activity of every
    member.
  supported_by:
  - *id001
  - &id003
    reference_id: file:genes/ECTOL/phaC1/phaC1-uniprot.txt
    supporting_text: Belongs to the PHA/PHB synthase family. Type II PhaC subfamily.
- assessed_term:
    id: GO:0042619
    label: poly-hydroxybutyrate biosynthetic process
  scope: UNRESOLVED
  scope_reason: PHB formation is directly supported for C. necator P23608; the same SF5 includes mcl-PHA
    synthases. The PHB-specific process cannot be granted from SF5 membership alone. This is a scope uncertainty,
    not an assertion that class II enzymes never accept C4 or that class I enzymes never accept longer
    precursors. Primary10612741 reports C8/C12 comonomer incorporation by the class I enzyme in engineered
    E. coli precursor contexts; this is PHB-rich copolymer synthesis, not a pure-mcl-polymer or complete
    native H16 turnover assay.
  supported_by:
  - *id002
  - *id003
  - reference_id: PMID:10612741
    supporting_text: R. eutropha PHA synthase accepts, besides the main substrate 3-hydroxybutyryl-CoA,
      also the CoA thioesters of 3HO and 3HDD.
- assessed_term:
    id: GO:0070088
    label: polyhydroxyalkanoate granule
  scope: UNRESOLVED
  scope_reason: Granule-associated function is supported for bacterial PHA synthesis systems, but universal
    location and polymer context are not established for all branches of this broad family.
  supported_by:
  - *id001
