  name:
    name: Ras-related protein Rab
    short: Rab
  description:
  - text: The Rab protein family is involved in the regulation of intracellular membrane
      trafficking, which includes the formation, movement, tethering, and fusion of
      transport vesicles. Members of this family cycle between an inactive GDP-bound
      form and an active GTP-bound form, recruiting various downstream effectors to
      maintain organelle identity and morphology. They play roles in processes such
      as endocytic and secretory pathways, autophagosome assembly, cell adhesion and
      migration, and neuron projection development. Some Rab proteins are also implicated
      in the maturation and exocytosis of cytotoxic granules in lymphocytes, the structural
      integrity of the Golgi apparatus, and the formation of contacts between endoplasmic
      reticulum and lipid droplets. Additionally, they contribute to the development
      and function of various tissues, including eyes and brain, and are involved
      in cellular defense against pathogens.
