  label: DIPHTHINE METHYL ESTER SYNTHASE
  description: >-
    Holds every reviewed member: eukaryotic Dph5 (yeast, fission yeast, human, mouse, fly,
    worm, Dictyostelium, Arabidopsis) and archaeal diphthine synthases (Pyrococcus,
    Methanocaldococcus, Sulfolobales, haloarchaea and others), plus a minority of bacterial
    tetrapyrrole-methylase-domain proteins. It is a sequence-classification group, not a clade
    with a single reaction: the methyl ester product is eukaryote-specific.
