notes: >-
  Module: modules/diphthamide_biosynthesis.yaml uses PANTHER:PTHR10882 (family level) for the
  Dph5 annoton with GO:0141133; that is right for the yeast and human representatives it lists,
  but the family as a whole also contains archaeal diphthine synthases (GO:0004164) and
  bacterial domain proteins. `just fetch-panther-paint PTHR10882` found no PAINT IBD node, and
  .cache/panther/IBD.gaf has no IRD/IKR rows for the family. Subfamily composition by
  kingdom was read from the InterPro API (protein/uniprot/entry/panther/PTHR10882/taxonomy),
  whose per-protein PANTHER matches carry the subfamily: in the first 200 bacterial, archaeal
  and eukaryotic matches every protein was SF0 (bacteria 58 total, archaea 622, eukaryotes
  4015). The GO taxon constraints (GO:0141133 only in Eukaryota, GO:0004164 only in Archaea)
  were read from the GO sqlite build used by the term validator.
