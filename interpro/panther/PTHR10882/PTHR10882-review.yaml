family_id: PANTHER:PTHR10882
family_name: DIPHTHINE SYNTHASE
preferred_name: Dph5 diphthamide-pathway methyltransferase family (tetrapyrrole methylase fold)
summary: >-
  Dph5 is the S-adenosyl-L-methionine-dependent methyltransferase of the second step of
  diphthamide biosynthesis. It acts on the 3-amino-3-carboxypropyl (ACP) histidine that the
  Dph1-Dph2 (archaeal Dph2) radical-SAM-like step installs on translation elongation factor 2,
  and it shares the tetrapyrrole (uroporphyrinogen III) methylase fold with cobalamin-pathway
  methylases. The reaction differs between the two domains of life that make diphthamide.
  Archaeal Dph5 trimethylates the amino group of the ACP side chain (diphthine synthase,
  GO:0004164, which GO restricts to Archaea). Yeast Dph5 additionally methylates the carboxylate
  and produces diphthine methyl ester (GO:0141133, restricted by GO to Eukaryota), which the
  WD40 methylesterase Dph7 then hydrolyses before Dph6 amidates the free carboxylate. Archaea
  have no Dph7. Diphthamide occurs only on archaeal and eukaryotic EF2, yet the family also
  contains a small number of bacterial tetrapyrrole-methylase-domain proteins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every characterized member is the Dph5 methyltransferase of diphthamide biosynthesis, so
  protein methyltransferase activity on EF2 and involvement in diphthamide formation are shared.
  The exact reaction is not: the eukaryotic enzyme makes diphthine methyl ester, the archaeal
  enzyme makes N-trimethylated (diphthine-type) product. PANTHER does not separate the two;
  all 69 reviewed UniProt members, archaeal and eukaryotic, sit in the single populated
  subfamily SF0 (DIPHTHINE METHYL ESTER SYNTHASE). InterPro also places about 58 bacterial
  proteins, annotated only as tetrapyrrole methylase domain-containing, in SF0; bacteria do not
  make diphthamide, so these are not Dph5 enzymes in any demonstrated sense. The second
  subfamily, SF7 (BIOSYNTHESIS PRECORRIN-6B METHYLASE, PUTATIVE (CBIE)-RELATED), has no
  reviewed or model-organism member and was not characterized here.
