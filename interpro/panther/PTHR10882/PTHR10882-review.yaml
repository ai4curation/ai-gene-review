term_assessments:
- assessed_term:
    id: GO:0141133
    label: diphthine methyl ester synthase activity
  scope: UNRESOLVED
  scope_reason: >-
    This is the term the diphthamide module asserts for the Dph5 role, and it is correct for the
    eukaryotic members: yeast Dph5 makes the methyl ester (IDA/IMP on DPH5, accepted in the gene
    review). It is not correct for the archaeal members, whose Dph5 does not esterify the
    carboxylate, and GO itself restricts the term to Eukaryota. The boundary is taxonomic
    (eukaryotic versus archaeal Dph5), and PANTHER puts both in SF0, so neither family-wide nor
    subfamily scope is right. No PAINT node exists in this family that could carry the
    eukaryote-only assertion. Apply only to eukaryotic members.
  supported_by:
  - reference_id: PMID:24739148
    supporting_text: yeast Dph5 catalyzes tetramethylation of the ACP group
  - reference_id: PMID:24739148
    supporting_text: Since archaeal Dph5 does not catalyze the extra methylation
  - reference_id: file:genes/yeast/DPH5/DPH5-ai-review.yaml
    supporting_text: This tetramethylation distinguishes the eukaryotic enzyme from archaeal Dph5,
- assessed_term:
    id: GO:0004164
    label: diphthine synthase activity
  scope: UNRESOLVED
  scope_reason: >-
    The archaeal counterpart of GO:0141133 (GO restricts it to Archaea). It describes the
    archaeal members of SF0. For eukaryotic Dph5 it is the wrong term: yeast DPH5 carries it
    only by a YeastPathways RCA row, which the DPH5 gene review modifies to GO:0141133. As with
    GO:0141133, the split follows the archaea/eukaryote boundary inside SF0 and cannot be
    expressed as a subfamily scope.
  supported_by:
  - reference_id: PMID:24739148
    supporting_text: also reported that archaeal Dph5 catalyzes N-trimethylation
  - reference_id: file:genes/yeast/DPH5/DPH5-ai-review.yaml
    supporting_text: GO:0004164 describes trimethylation of ACP-histidine to diphthine and is taxon-restricted
- assessed_term:
    id: GO:0017183
    label: protein histidyl modification to diphthamide
  scope: UNRESOLVED
  scope_reason: >-
    Safe for the eukaryotic and archaeal Dph5 enzymes, which perform the methylation step of
    diphthamide formation. Not safe for the bacterial SF0 members, because bacteria have no
    diphthamide. No PAINT node in the family asserts the term, so nothing currently propagates
    it to bacteria.
  supported_by:
  - reference_id: PMID:23169644
    supporting_text: Diphthamide is a posttranslationally modified histidine residue found on archaeal
      and eukaryotic translation elongation factor 2 (eEF-2)
