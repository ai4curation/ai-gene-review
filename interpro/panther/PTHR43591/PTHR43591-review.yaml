family_id: PANTHER:PTHR43591
family_name: METHYLTRANSFERASE
preferred_name: UbiE/COQ5 methyltransferase family
summary: >-
  Class I SAM-dependent methyltransferases. SF24 holds the quinone C-methyltransferases UbiE/COQ5
  (ubiquinone) and MenG (menaquinone). SF30 holds the fungal secondary-metabolism regulator LaeA;
  other subfamilies include plant Mg-protoporphyrin IX methyltransferase-related proteins and natural-product
  O/C-methyltransferases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrates differ by subfamily: quinone rings (SF24), LaeA (SF30) and natural products in other
  subfamilies.
