family_id: PANTHER:PTHR10210
family_name: RIBOSE-PHOSPHATE DIPHOSPHOKINASE FAMILY MEMBER
preferred_name: Ribose-phosphate diphosphokinase (PRPP synthase) family
summary: >-
  PRPP synthases transfer the beta,gamma-diphosphate of ATP to ribose 5-phosphate, making phosphoribosyl
  diphosphate for nucleotide, histidine, tryptophan and NAD synthesis. The family contains the bacterial
  and plant Prs enzymes, the five S. cerevisiae PRS paralogs (which form heteromeric complexes),
  S. pombe PRPP synthases, and human PRPS1-3. It also contains the non-catalytic PRPP synthase-associated
  proteins PRPSAP1 and PRPSAP2, which bind and regulate PRPS.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  PRPP synthase activity is conserved except in PRPSAP1 (SF28) and PRPSAP2 (SF29), which are non-catalytic
  regulatory paralogs. PAINT handles them with an IRD (NOT ribose phosphate diphosphokinase activity)
  and an enzyme regulator activity at PTN008303105.
