term_assessments:
- assessed_term:
    id: GO:0008983
    label: protein-glutamate O-methyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Methylation of receptor glutamates with S-adenosylmethionine is the conserved
    activity of every member that carries the CheR catalytic domain, in all main
    subfamilies; it is the activity the chemotaxis module asserts for its CheR annoton
    (grounded by E. coli CheR and KT2440 CheR2). Two SF10 Swiss-Prot entries lack the
    CheR domain and are listed as exceptions.
  supported_by:
  - reference_id: file:ECOLI/cheR/cheR-uniprot.txt
    supporting_text: Reaction=L-glutamyl-[protein] + S-adenosyl-L-methionine = [protein]-L- glutamate 5-O-methyl
      ester + S-adenosyl-L-homocysteine;
  member_exceptions:
  - member:
      id: UniProtKB:Q9I3S1
      label: Biofilm dispersion protein BdlA
      gene_symbol: bdlA
      organism: Pseudomonas aeruginosa PAO1
    exception_reason: >-
      BdlA is a PAS-PAS-MCP-domain chemotaxis-transducer-like protein that controls
      biofilm dispersion through c-di-GMP; it has no CheR catalytic domain, so its
      placement in this family does not imply methyltransferase activity.
    supported_by:
    - reference_id: PMID:17050921
      supporting_text: The BdlA protein harbors an MCP (methyl-accepting chemotaxis protein) domain and two
        PAS (Per-Arnt-Sint) domains
  - member:
      id: UniProtKB:Q7NBF9
      label: Fibronectin-binding protein PlpA
      gene_symbol: plpA
      organism: Mycoplasmoides gallisepticum
    exception_reason: >-
      PlpA (MGA_1199) is a surface-exposed fibronectin-binding cytadherence-associated
      protein of a wall-less, non-chemotactic mycoplasma. Nothing supports receptor
      glutamate methyltransferase activity.
    supported_by:
    - reference_id: PMID:16495551
      supporting_text: we propose that PlpA functions as a fibronectin-binding protein in vivo
