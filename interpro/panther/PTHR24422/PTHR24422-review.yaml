family_id: PANTHER:PTHR24422
family_name: CHEMOTAXIS PROTEIN METHYLTRANSFERASE
preferred_name: CheR chemoreceptor glutamate methyltransferase family
summary: >-
  CheR proteins are S-adenosylmethionine-dependent methyltransferases that esterify
  specific glutamate residues in the cytoplasmic signalling domain of methyl-accepting
  chemoreceptors, forming glutamyl 5-methyl esters. Together with the CheB methylesterase
  they set receptor methylation level and so provide the sensory adaptation of
  chemosensory arrays. Members carry an N-terminal CheR_N all-alpha domain and a
  C-terminal Rossmann-like SAM-binding domain. Many bacteria encode several CheR
  paralogs that act on different chemosensory systems: in Pseudomonas putida KT2440,
  CheR2 (PP_4392, SF21) is the flagellar-chemotaxis methyltransferase that methylates
  the McpS receptor, whereas CheR1 acts in a biofilm-related pathway. PANTHER also
  places a few Swiss-Prot proteins without a CheR catalytic domain in SF10.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Genuine CheR-domain members (E. coli and B. subtilis CheR in SF19, KT2440 CheR2 in
  SF21, Halobacterium CheR in SF10) are receptor glutamate methyltransferases. SF10 also
  contains Pseudomonas aeruginosa BdlA, a PAS-MCP domain chemotaxis-transducer-like
  protein, and Mycoplasma gallisepticum PlpA, a surface fibronectin-binding protein;
  neither is a methyltransferase. KT2440 CheR3 (SF8) is uncharacterized.
