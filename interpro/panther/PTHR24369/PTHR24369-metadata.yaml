  description:
  - text: This family of proteins includes a variety of members with diverse functions,
      primarily involved in cellular signaling, synaptic adhesion, and regulation
      of neuronal activity. Some act as inhibitors, such as those that inhibit TGF-beta
      signaling or phospholipase A2 activity. Others are involved in the immune response,
      bone homeostasis, and regulation of the JAK/STAT pathway. Notably, several members
      function as receptors that mediate axonal growth inhibition and neuronal plasticity,
      interacting with ligands like RTN4, OMG, and MAG, and are implicated in brain
      development and synaptic organization. Additionally, some proteins in this family
      are involved in the negative regulation of viral infection and in the formation
      of platelet plugs.
