  PLP-dependent glutamate decarboxylases of plants and fungi (S. cerevisiae GAD1, Arabidopsis GAD1-5,
  Petunia GAD) that make GABA, the first step of the GABA shunt. Plant GADs carry a C-terminal calmodulin-binding
  domain.
