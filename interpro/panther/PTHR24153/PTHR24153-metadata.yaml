  name:
    name: Espin and Espin-like domain-containing protein
    short: Espin/Espin-like
  description:
  - text: This family of proteins includes multifunctional actin-bundling proteins
      that are essential for the organization and dynamics of actin filament-rich
      structures. They play a pivotal role in the formation and maintenance of stereocilia
      in inner ear hair cells, which are crucial for hearing. Members of this family
      are involved in the assembly and stabilization of parallel actin bundles within
      these cellular protrusions and are necessary for the proper elongation of actin
      filaments. Additionally, they contribute to the regulation of stereocilia length
      and diameter, as well as the formation of the characteristic staircase pattern.
      Some family members are known to bind actin monomers through their WH2 domains,
      facilitating the assembly of actin bundles, while others bind to actin without
      promoting cross-linking.
