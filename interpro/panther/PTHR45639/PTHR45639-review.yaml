family_id: PANTHER:PTHR45639
family_name: HSC70CB, ISOFORM G-RELATED
summary: Hsp70-related chaperones share nucleotide-binding and substrate-interaction architecture but
  differ in compartment and dominant chaperone-system role. Hsp110-related proteins provide an important
  boundary within this broader structural group.
functional_coherence: HETEROGENEOUS
coherence_reason: HSPA4 must be distinguished from conventional Hsp70 substrate-cycling proteins and ribosome-associated
  chaperones. Nucleotide exchange, substrate binding, ATP hydrolysis and membership in a particular folding
  complex are separate claims, and none follows solely from an Hsp70-family name.
