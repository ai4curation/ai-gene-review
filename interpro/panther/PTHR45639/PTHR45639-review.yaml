term_assessments:
- assessed_term:
    id: GO:0000774
    label: adenyl-nucleotide exchange factor activity
  scope: UNRESOLVED
  scope_reason: HSPA4/Apg2 in SF6 supports nucleotide-exchange activity. HSPH1, LHS1/GRP170 and other
    Hsp110-related branches also have nucleotide-exchange evidence, so the HSPA4 branch is not the only
    applicable group. The complete boundary among the diverse family members remains unresolved. HSPA4
    must be distinguished from conventional Hsp70 substrate-cycling proteins and ribosome-associated chaperones.
    Nucleotide exchange, substrate binding, ATP hydrolysis and membership in a particular folding complex
    are separate claims, and none follows solely from an Hsp70-family name.
  supported_by:
  - reference_id: PMID:30521813
    supporting_text: 'Hsp110s support the refolding of

      aggregated polypeptides acting as specialized nucleotide exchange factors of

      Hsp70. We have studied how Apg2, one of the three human Hsp110s, regulates the

      activity of Hsc70 (HspA8), the constitutive Hsp70 in our cells.'
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR45639-evidence.md
    supporting_text: 'Heat shock proteins, Hsp70 chaperones help to fold many proteins. Hsp70 assisted
      folding involves repeated cycles of substrate binding and release. Hsp70 activity is ATP dependent.
      Hsp70 proteins are made up of two regions: the amino terminus is the ATPase domain and the carboxyl
      terminus is the substrate binding region [[cite:PUB00000958]].


      Hsp70 proteins have an average molecular weight of 70kDa [[cite:PUB00000712], [cite:PUB00000809],
      [cite:PUB00004019]]. In most species, there are many proteins that belong to the Hsp70 family. Some
      of these are only expressed under stress conditions (strictly inducible), while some are present
      in cells under normal growth conditions and are not heat-inducible (constitutive or cognate) [[cite:PUB00004070],
      [cite:PUB00001766]]. Hsp70 proteins can be found in different cellular compartments (nuclear, cytosolic,
      mitochondrial, endoplasmic reticulum, for example).


      This entry represents the Hsp70 family, and includes chaperone protein DnaK and luminal-binding
      proteins. It also includes heat shock protein 110 (Hsp110) from Caenorhabditis elegans which helps
      prevent the aggregation of denatured proteins in neurons [[cite:PUB00082583]]. Also included is
      endoplasmic reticulum (ER) chaperone BiP (HSPA5) which is important for protein folding and quality
      control in the ER [[cite:PUB00090977]].'
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR45639-evidence.md
    supporting_text: The Heat Shock Protein 70 (HSP70) family is a group of highly conserved molecular
      chaperones involved in a variety of cellular processes. Members of this family play crucial roles
      in the folding of newly synthesized proteins, preventing the aggregation of denatured proteins under
      stress, assisting in protein translocation into organelles, and participating in the degradation
      of damaged proteins. They are also implicated in the assembly of multimeric protein complexes within
      the endoplasmic reticulum. Some HSP70 proteins act as nucleotide-exchange factors, promoting the
      release of ADP from other chaperones to trigger substrate release. They are essential for cellular
      protection against stress conditions such as heat shock and hypoxia, where they may help in cytoprotection
      and protein folding.
