notes: >-
  The clamp's role in mismatch repair is a partner-recruitment and
  incision-licensing context, not a separate clamp activity; MutS and MutL
  both bind it [PMID:21050827 "Binding of MutS to β is important to recruit
  MutS and MutL to foci."]. Both module representatives (E. coli P0A988 and P.
  putida P0A120) are SF0 members in the PANTHER 19.0 member index.
