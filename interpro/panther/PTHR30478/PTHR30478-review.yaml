family_id: PANTHER:PTHR30478
family_name: DNA POLYMERASE III SUBUNIT BETA
preferred_name: Bacterial beta sliding clamp (DnaN)
summary: >-
  Bacterial beta sliding clamps (DnaN). The homodimeric ring encircles duplex
  DNA, is loaded at primer-template junctions by the clamp loader, and tethers
  DNA polymerase III to the template for processive replication. The clamp is a
  hub for many other DNA-processing proteins, including mismatch repair: MutS
  and MutL both bind the beta clamp, clamp binding recruits them to repair
  foci, and in MutH-independent systems such as Bacillus subtilis the clamp
  binds and stimulates the MutL endonuclease.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family has one subfamily (SF0). Of its 65 reviewed members, 64 are named
  Beta sliding clamp; the exception is the Streptomyces GriR protein, a beta
  sliding clamp homolog encoded with secondary-metabolite genes whose clamp
  function has not been assessed in the cached evidence. PAINT annotates one
  bacterial node, with DNA strand elongation, seeded by E. coli DnaN.
