family_id: PANTHER:PTHR20854
family_name: INOSITOL MONOPHOSPHATASE
preferred_name: Inositol monophosphatase (IMPase/SuhB) family
summary: >-
  Lithium-sensitive, Mg2+-dependent phosphatases that dephosphorylate inositol monophosphates to
  free myo-inositol for de novo synthesis and recycling (S. cerevisiae INM1/INM2, bacterial SuhB,
  animal IMPA1/2, plant IMP). The family also includes Neurospora QutG of quinate utilization and
  plastid IMPL1.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  IMPase activity holds for SF4, SF26, SF29, SF46 and SF48. QutG (SF39) and IMPL1 (SF17) are related
  phosphatases of other pathways.
