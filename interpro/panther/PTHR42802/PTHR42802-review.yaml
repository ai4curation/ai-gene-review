notes: >-
  Modules that need the ornithine-specific activity should ground it on the
  member protein (or on member-level gene reviews) rather than on this family
  id: the family is coherent for the reaction type and the iron-homeostasis
  process, but its single subfamily mixes ornithine, lysine and putrescine
  N-hydroxylases. The InterPro integration is IPR025700 (Lys/Orn_oxygenase,
  Pfam PF13434), whose name reflects the same lumping.
