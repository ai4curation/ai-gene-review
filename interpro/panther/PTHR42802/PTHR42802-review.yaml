  - id: PomBase:SPAC23G3.03
  - id: UniProtKB:E9QYP0
  - id: UniProtKB:G5EB76
  assessment: SOUND
  assessment_reason: >-
    The seeds are fungal siderophore ornithine N5-monooxygenases (S. pombe sib2,
    Nannizzia/Trichophyton sidA) whose function is to initiate hydroxamate
    siderophore biosynthesis, and every reviewed descendant of this family does
    the same for its own siderophore, so a shared iron-homeostasis role is
    inherited rather than lineage-specific. Note that the term describes the
    downstream physiological outcome of siderophore-mediated iron acquisition
    rather than the hydroxylation each enzyme performs, so recipients with a
    specific pathway annotation (P. aeruginosa PvdA carries GO:0002049 pyoverdine
    biosynthetic process from direct experiment) are better served by that term;
    the PAO1 gene review therefore records MODIFY on granularity grounds while
    agreeing with the clade-level claim. The PAINT row's recorded taxon
    (taxon:451864, Dikarya) is narrower than the set of recipients, which include
    bacterial members; that is a question about the recorded node taxon, not a
    reason to doubt that the function is ancestral to the N-hydroxylase clade.
