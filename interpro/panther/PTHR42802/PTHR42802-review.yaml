  label: L-ORNITHINE N(5)-MONOOXYGENASE
  description: >-
    The family's only subfamily, and therefore functionally mixed despite its
    name: it holds the ornithine N5-monooxygenases (PvdA of P. aeruginosa and
    P. fluorescens, fungal SidA/Sid1/Sib2/Omo1/DffA), the lysine
    N6-monooxygenases (E. coli IucD, M. tuberculosis MbtG), the putrescine
    N-hydroxylases (B. pertussis/parapertussis/bronchiseptica AlcA, S. oneidensis
    PubA, S. agalactiae FbsI) and the rhizobactin enzyme RhbE.
