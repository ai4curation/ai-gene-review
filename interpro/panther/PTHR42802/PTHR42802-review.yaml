term_assessments:
- assessed_term:
    id: GO:0006879
    label: intracellular iron ion homeostasis
  scope: FAMILY_WIDE
  scope_reason: >-
    Every reviewed member initiates biosynthesis of a hydroxamate siderophore
    (pyoverdine, ferrichrome/fusarinine, aerobactin, mycobactin, alcaligin,
    rhizobactin), so participation in iron acquisition and hence intracellular
    iron homeostasis holds family-wide. It is a broad, downstream framing: a
    member with a characterized pathway should carry the specific biosynthetic
    process term as well.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42802/PTHR42802-paint.tsv
    supporting_text: "PTHR42802\tPTN001009003\tGO:0006879\tP\tIBD\tfalse"
  - reference_id: file:interpro/panther/PTHR42802/PTHR42802-entries.csv
    supporting_text: "P65199,Alcaligin biosynthesis enzyme"
- assessed_term:
    id: GO:0031172
    label: ornithine N5-monooxygenase activity
  scope: UNRESOLVED
  scope_reason: >-
    Substrate-specific and not establishable from family or subfamily
    membership. PTHR42802 has a single subfamily (SF1) that contains ornithine
    N5-monooxygenases together with lysine N6-monooxygenases (IucD, MbtG) and
    putrescine N-hydroxylases (AlcA, PubA, FbsI), and the purified enzymes are
    specific for their own substrate, so neither FAMILY_WIDE nor SUBFAMILY_ONLY
    is truthful here. Resolving this properly requires curated active-site
    residues that discriminate the omega-amino substrates; the PvdA structures
    (PMID:21757711) report a substrate-binding domain with (hydroxy)ornithine
    bound, but the discriminating positions have not been curated in this repo,
    so no residue site is asserted and no RESIDUE_DETERMINED scope is claimed.
    Until then, grant this term from member-level evidence (as for Q51548, whose
    activity is directly assayed) rather than from family membership.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42802/PTHR42802-entries.csv
    supporting_text: "P11295,L-lysine N6-monooxygenase"
  - reference_id: PMID:17900176
    supporting_text: >-
      By extending the side chain by one methylene group (L-lysine), NADPH oxidation
      occurred at 80 % of the rate of L-ornithine; however, no hydroxylated product
      was formed.
  - reference_id: PMID:17015659
    supporting_text: >-
      Formation of the iron-chelating hydroxamate functional group in pyoverdine
      requires the enzyme PvdA, a flavin-dependent monooxygenase that catalyzes the
      N(5) hydroxylation of l-ornithine.
