family_id: PANTHER:PTHR42802
family_name: MONOOXYGENASE
preferred_name: >-
  Siderophore N-hydroxylating class B flavoprotein monooxygenases (ornithine
  N5-, lysine N6- and putrescine N-hydroxylases)
summary: >-
  FAD- and NADPH-dependent class B flavoprotein monooxygenases that hydroxylate
  the distal amine of an omega-amino substrate, creating the N-hydroxy group
  from which hydroxamate iron chelators are built. The family is the
  lysine N(6)-hydroxylase / L-ornithine N(5)-oxygenase family of UniProt, and
  its members initiate hydroxamate siderophore biosynthesis across bacteria and
  fungi: ornithine N5-monooxygenases (Pseudomonas PvdA for pyoverdine, fungal
  SidA/Sid1/Sib2 for ferrichrome- and fusarinine-type siderophores), lysine
  N6-monooxygenases (Escherichia coli IucD for aerobactin, Mycobacterium MbtG
  for mycobactin) and putrescine N-hydroxylases (Bordetella AlcA for alcaligin,
  Shewanella PubA, Streptococcus FbsI). All reviewed members share the reaction
  type, the FAD/NADPH cofactor pair and the siderophore-biosynthetic context;
  they differ in which omega-amino substrate they accept.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Coherent at the level of flavin-dependent N-hydroxylation of an omega-amino
  substrate in hydroxamate siderophore biosynthesis, and therefore for the
  iron-homeostasis process the PAINT node asserts. Not coherent at the level of
  substrate-specific molecular function: the family contains ornithine N5-,
  lysine N6- and putrescine N-hydroxylases, and the purified enzymes are
  mutually specific (PAO1 PvdA does not hydroxylate L-lysine, which instead acts
  as a non-substrate effector that uncouples NADPH oxidation). PANTHER places
  all of these in the single subfamily PTHR42802:SF1, so no family- or
  subfamily-level scoping can grant a substrate-specific term.
