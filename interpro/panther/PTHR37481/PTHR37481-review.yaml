notes: PMID42844470 uses an engineered E. coli LptC-A fusion for structural work; LPS-null Acinetobacter
  is a host expressing E. coli proteins, not a native ortholog test. PMID27529623 describes selected E.
  coli suppressors and does not establish a normal six-component lineage. In the native Neisseria study
  LptC deletion causes a surface-delivery defect; its exact MC58-to-H44 sequence bridge was not established,
  so no new target representative is added. Native LptC-LptC binding under some conditions is not contradicted
  by one LptC per extractor architecture. Existing PAINT judgments and payloads remain unchanged.
