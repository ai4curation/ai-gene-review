family_id: PANTHER:PTHR37481
family_name: LIPOPOLYSACCHARIDE EXPORT SYSTEM PROTEIN LPTC
preferred_name: LptC inner-membrane LPS-bridge anchor family
summary: >-
  LptC proteins are bitopic inner-membrane proteins of the lipopolysaccharide transport (Lpt)
  system of diderm bacteria. A single N-terminal transmembrane helix inserts into the LptF/LptG
  transmembrane domains of the LptB2FG ABC transporter, and the periplasmic beta-jellyroll
  domain receives LPS extracted by LptB2FG and passes it to the LptA bridge, which leads to
  the outer-membrane translocon LptD/LptE. LptC is essential in Escherichia coli, where its
  depletion blocks LPS transport to the outer membrane. The family consists of a single PANTHER
  subfamily.
functional_coherence: COHERENT
coherence_reason: >-
  One subfamily (SF1); all PAINT reference-tree members descend from the single IBD node
  PTN002444741 and are Lpt bridge anchors.
