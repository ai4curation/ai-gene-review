family_id: PANTHER:PTHR37481
family_name: LIPOPOLYSACCHARIDE EXPORT SYSTEM PROTEIN LPTC
preferred_name: LptC inner-membrane LPS-bridge anchor family
summary: LptC is a bitopic inner-membrane bridge anchor in characterized bacterial LPS transport systems.
  Its periplasmic beta-jellyroll accepts lipid from LptF and connects to LptA. In E. coli, bridge assembly
  and LPS-dependent movement of the LptC transmembrane helix regulate the extractor ATPase cycle. Wild-type
  LptC is important for normal transport, while selected suppressor backgrounds can bypass its requirement;
  conditional bypass does not erase its normal molecular function.
functional_coherence: COHERENT
coherence_reason: One SF1 of LptC-like bridge anchors; the cached reference tree supports the reviewed
  LPS-bearing bacterial scope. Unlike A/B/D/F/G, this limited tree does not contain the identified Deinococcus/Thermotoga
  substrate-context examples. Conserved transfer function is distinct from universal indispensability
  or cross-species complementation.
