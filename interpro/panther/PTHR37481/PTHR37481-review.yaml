- assessed_term:
    id: GO:0015920
    label: lipopolysaccharide transport
  scope: FAMILY_WIDE
  scope_reason: Conserved LptC bridge/transfer participation is supported in the characterized LPS-bearing
    lineages. E. coli suppressor-mediated bypass changes the machinery and does not show that native LptC
    lacks its function; native Neisseria loss likewise impairs surface LPS accessibility. This scope does
    not assert that every species needs LptC under every genetic condition.
  supported_by:
  - reference_id: PMID:27529623
    supporting_text: can compensate the lack of the essential protein LptC
- assessed_term:
    id: GO:0005886
    label: plasma membrane
  scope: FAMILY_WIDE
  scope_reason: All members carry the N-terminal inner-membrane anchor.
- assessed_term:
    id: GO:0140332
    label: lipopolysaccharide transfer activity
  scope: FAMILY_WIDE
  scope_reason: The periplasmic LptC groove supplies the LptF-to-LptA transfer connection in characterized
    LPS systems. New E. coli work supports coupled assembly-dependent regulation, not autonomous membrane-spanning
    transport by LptC. Compatible interfaces and substrate remain necessary; failed or conditional heterologous
    rescue is not proof of native functional loss.
  supported_by:
  - reference_id: PMID:21169485
    supporting_text: The crystal structure of LptC periplasmic domain has been recently solved and, like
      LptA, LptC has been shown to bind LPS in vitro ( 38 ).
  - reference_id: PMID:29449493
    supporting_text: Crosslinks between LPS and LptC were observed at the same time as crosslinks between
      LPS and LptD
  - reference_id: file:analysis/module_audits/bacterial_lps_transport/literature-consultation/source-excerpts.md
    supporting_text: Lpt bridge assembly triggers movement of the transmembrane helix of LptC (TM-LptC)
      in an LPS-dependent manner
