notes: >-
  Used by modules/bacterial_shikimate_chorismate_biosynthesis.yaml in the type I dehydroquinase
  annoton (type_i_dehydroquinase), whose family_terms are PTHR43699 and PTHR21089; the latter
  covers the plant bifunctional DHQ-SDH. PTHR43699 is safe for GO:0003855. The PANTHER 19 tree,
  read through the treeinfo service, has 20 leaves under one root PTN000472499: archaea, Firmicutes,
  Enterobacteriaceae, Chlamydia AroDE, Aquifex, Leptospira, Neisseria and Coxiella. The recommended
  PAINT fixes are to retire the GO:0046279 IBD at PTN000472499 and to add a GO:0009423
  chorismate biosynthesis IBD, with an IRD on catabolic QuiB-like branches if they are resolved.
