- node_id: PANTHER:PTN000472499
  asserted_term:
    id: GO:0046279
    label: 3,4-dihydroxybenzoate biosynthetic process
  evidence: IBD
  node_taxon:
    id: NCBITaxon:131567
    label: cellular organisms
  paint_snapshot: '20170228'
  seeds:
  - id: UniProtKB:P05194
    label: aroD
    organism: Escherichia coli K-12
  - id: UniProtKB:P58687
    label: aroD
    organism: Salmonella typhimurium LT2
  assessment: WRONG_NODE
  assessment_reason: >-
    The term is seeded only by the E. coli and Salmonella enzymes. Their experimental rows
    (PMID:13198937, PMID:7592767) measure the dehydration of 3-dehydroquinate to
    3-dehydroshikimate, not the formation of 3,4-dihydroxybenzoate. Converting
    3-dehydroshikimate to protocatechuate requires a 3-dehydroshikimate dehydratase (EC
    4.2.1.118), and E. coli K-12 has none. The seeds therefore do not themselves carry out the
    process, and descent passes it to the whole family, including archaea. The defensible
    process for this node is GO:0009423 chorismate biosynthetic process, which PAINT does not
    assert here. Only catabolic members such as Acinetobacter QuiB, which work alongside a
    3-dehydroshikimate dehydratase, could take part in protocatechuate formation, and that is
    a per-gene judgement. The E. coli aroD review marks all four of its GO:0046279 rows as
    over-annotations.
  supported_by:
  - reference_id: file:ECOLI/aroD/aroD-notes.md
    supporting_text: returned no entries, i.e. no E. coli K-12 protein carries EC 4.2.1.118
  - reference_id: file:ECOLI/aroD/aroD-uniprot.txt
    supporting_text: Catalyzes the cis-dehydration of 3-dehydroquinate (DHQ) and introduces the
      first double bond of the aromatic ring to yield 3-dehydroshikimate.
