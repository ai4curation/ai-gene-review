family_id: PANTHER:PTHR43699
family_name: 3-DEHYDROQUINATE DEHYDRATASE
preferred_name: Type I 3-dehydroquinate dehydratases (AroD)
summary: >-
  Type I 3-dehydroquinate dehydratases (dehydroquinases, EC 4.2.1.10) of bacteria and archaea.
  These (beta/alpha)8-barrel enzymes dehydrate 3-dehydroquinate to 3-dehydroshikimate in a cis
  elimination through a Schiff base formed with a conserved active-site lysine (Lys170 in E.
  coli AroD). This is the third step of the shikimate pathway to chorismate. They are
  unrelated in sequence and mechanism to the type II dehydroquinases (PTHR21272), which
  catalyse the same reaction. The family holds standalone AroD enzymes (E. coli, Salmonella,
  B. subtilis and archaea) and the Chlamydia AroDE fusions. It also holds at least one catabolic
  member, the Acinetobacter baylyi quinate-pathway QuiB. Type I dehydroquinase domains of
  eukaryotes are classified elsewhere: the fungal AROM domain in PTHR21090 and the plant DHQ-SDH
  domain in PTHR21089.
functional_coherence: COHERENT
coherence_reason: >-
  One activity throughout. Re-derived from PTHR43699-entries.csv, a real CSV parse of the 186
  reviewed entries, all in the family's only subfamily, SF1: 183 are named 3-dehydroquinate
  dehydratase, 2 are Chlamydia "Shikimate biosynthesis protein AroDE" fusions and 1 is the
  Acinetobacter catabolic dehydroquinase. The pathway role is shikimate biosynthesis for almost
  every member. QuiB is the exception: it uses the same reaction in quinate catabolism, and no
  subfamily separates it.
