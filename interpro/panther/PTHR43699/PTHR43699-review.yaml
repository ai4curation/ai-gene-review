    label: chorismate biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    This holds for almost every member, including the E. coli reference, whose pathway role is
    step 3 of chorismate biosynthesis. It does not hold for the Acinetobacter catabolic
    dehydroquinase Q59087, which sits in the same single subfamily. Checking each entries.csv
    row finds no other member named as catabolic, but no member-level literature was cached for
    QuiB, so the exception cannot yet be recorded with vetted evidence. The module uses this
    term only as module-level context, not as an annoton function.
  supported_by:
  - reference_id: file:ECOLI/aroD/aroD-uniprot.txt
    supporting_text: Involved in the third step of the chorismate pathway, which leads to the
      biosynthesis of aromatic amino acids (AroAA).
  - reference_id: file:interpro/panther/PTHR43699/PTHR43699-entries.csv
    supporting_text: Q59087,Catabolic 3-dehydroquinate dehydratase
- assessed_term:
    id: GO:0046279
    label: 3,4-dihydroxybenzoate biosynthetic process
  scope: NOT_APPLICABLE
  scope_reason: >-
    Not safe at family or subfamily level (see the PTN000472499 node assessment). The enzyme
    makes 3-dehydroshikimate, and protocatechuate formation needs a separate 3-dehydroshikimate
    dehydratase that the seed organisms lack.
  supported_by:
  - reference_id: file:ECOLI/aroD/aroD-notes.md
    supporting_text: returned no entries, i.e. no E. coli K-12 protein carries EC 4.2.1.118
