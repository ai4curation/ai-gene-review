review_status: COMPLETE
reviewed_by: codex
review_date: '2026-09-10'
notes: The Hes6 review accounts for the actual Myod1 interaction control and the hes6 mutant combinations
  in the full primary studies. Promiscuous in vitro bHLH binding does not establish physiological myogenesis.
  The segmentation-clock period affects segment number but does not instruct Hox-associated axial identity.
  No PAINT node or terminal-motif universality is asserted without phylogenetic evidence.
