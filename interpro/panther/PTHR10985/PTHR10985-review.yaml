family_id: PANTHER:PTHR10985
family_name: BASIC HELIX-LOOP-HELIX TRANSCRIPTION FACTOR, HES-RELATED
summary: HES/HEY-related bHLH proteins regulate developmental transcription through partner-dependent
  dimerization, DNA recognition and corepressor interactions. Direct zebrafish experiments show that Her7:Hes6
  heterodimers bind cyclic-gene promoters strongly whereas Hes6 homodimers do not. Developmental process,
  DNA-binding competence and repressive output vary among family members and dimer combinations.
functional_coherence: HETEROGENEOUS
coherence_reason: The common bHLH/Orange architecture permits dimerization but does not ensure identical
  DNA recognition or transcriptional output. Primary zebrafish experiments separate promiscuous protein
  interactions from selective promoter binding and establish a Hes6-dependent segmentation-clock mechanism.
  A blanket non-DNA-binding designation for HES6 would discard the experimentally demonstrated heterodimer
  contribution.
