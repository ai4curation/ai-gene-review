term_assessments:
  - assessed_term:
      id: GO:0018489
      label: vanillate monooxygenase activity
    scope: UNRESOLVED
    scope_reason: >-
      Vanillate O-demethylase activity is a member-level property within SF60,
      which also contains KshA, NdmA/NdmB, DdmC and other oxygenases with other
      substrates. No PANTHER subfamily or PAINT node isolates the VanA clade, and
      the evidence reviewed here does not establish which internal node of SF60
      the activity arose at.
    supported_by:
      - reference_id: file:interpro/panther/PTHR21266/PTHR21266-entries.csv
        supporting_text: C0HMM3,Vanillate O-demethylase oxygenase subunit,protein,101510
      - reference_id: PMID:10348863
        supporting_text: >-
          VanA and VanB form an oxygenative demethylase that converts vanillate
          to protocatechuate in microorganisms.
