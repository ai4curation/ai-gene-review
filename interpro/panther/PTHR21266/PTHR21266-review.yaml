family_id: PANTHER:PTHR21266
family_name: IRON-SULFUR DOMAIN CONTAINING PROTEIN
preferred_name: Rieske non-heme iron oxygenase alpha subunits (cholesterol 7-desaturase family)
summary: >-
  Rieske non-heme iron oxygenases: proteins with an N-terminal Rieske [2Fe-2S]
  domain and a C-terminal catalytic domain carrying a mononuclear iron, which
  together with a separate reductase activate O2 for hydroxylation,
  demethylation, desaturation or dioxygenation. Plant and algal members are
  chloroplast enzymes of chlorophyll metabolism (chlorophyllide a oxygenase CAO,
  pheophorbide a oxygenase PAO) or the TIC55 translocon component; animal
  members are the steroid 7-desaturases Neverland/DAF-36. The bacterial
  subfamilies hold two-component oxygenases of aromatic and steroid catabolism,
  including vanillate O-demethylase VanA, 3-ketosteroid 9-alpha-monooxygenase
  KshA, the caffeine N-demethylases NdmA/NdmB, dicamba O-demethylase DdmC and
  phthalate and carbazole dioxygenases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The Rieske/catalytic-iron architecture and oxygenase chemistry are shared,
  but substrates and reactions differ by subfamily and, within the bacterial
  SF60 and SF59 subfamilies, by member: SF60 interleaves vanillate
  O-demethylases with 3-ketosteroid 9-alpha-hydroxylases, methylxanthine
  N-demethylases, dicamba O-demethylase, toluenesulfonate monooxygenase and
  aminopyrrolnitrin oxygenase. Plant SF29 (TIC55) has a protein-import role,
  and SF19/SF24 act on chlorophyll catabolites.
