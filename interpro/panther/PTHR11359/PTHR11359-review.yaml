family_id: PANTHER:PTHR11359
family_name: AMP DEAMINASE
preferred_name: AMP deaminase (AMD1/AMPD) family
summary: >-
  AMP deaminases hydrolytically deaminate AMP to IMP, part of the purine nucleotide cycle and of
  adenylate pool control. The family contains S. cerevisiae AMD1, plant FAC1/AMPD and human AMPD1-3,
  and an inactive S. cerevisiae paralog, YBR284W (SF7).
functional_coherence: MOSTLY_COHERENT
coherence_reason: All subfamilies except SF7 (the "inactive deaminase" YBR284W-related) are AMP deaminases.
