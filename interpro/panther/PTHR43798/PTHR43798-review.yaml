- node_id: PANTHER:PTN001661081
  asserted_term:
    id: GO:0016020
    label: membrane
  evidence: IBD
  paint_snapshot: '20260530'
  seeds:
  - id: MGI:MGI:1913332
  assessment: TOO_DEEP
  assessment_reason: 'A single mouse Abhd6 seed places membrane on a 134-leaf node. The node covers almost
    the whole family: SF5 ABHD6 plus SF33, SF31, SF14, SF26 and other bacterial, fungal and algal hydrolases.
    ABHD6 has a transmembrane anchor that the soluble bacterial members do not share. TreeGrafter grafts
    PpG2 AcoC into PTN008685320 under this node. AcoC has no transmembrane segment, and its gene review
    marks the inherited membrane row over-annotated. The term belongs on the ABHD6 clade (PTN008685307
    or narrower). Incoming nicotinate evidence adds soluble-extract NicD in SF33 without a transmembrane
    or signal feature, consistent with the bounded membrane-scope judgment; it does not imply that all
    peripheral membrane association requires an anchor.'
  affected_subfamilies:
