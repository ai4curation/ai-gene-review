- node_id: PANTHER:PTN001661081
  asserted_term:
    id: GO:0016020
    label: membrane
  evidence: IBD
  paint_snapshot: '20260530'
  seeds:
  - id: MGI:MGI:1913332
  assessment: TOO_DEEP
  assessment_reason: >-
    A single mouse seed supports a membrane assertion at a node spanning 134 leaves of the cached PANTHER
    19.0 tree, across SF5, SF14, SF20, SF24, SF26, SF27, SF28, SF31 and SF33, including many soluble
    bacterial enzymes. The only mouse leaf below the node is Abhd6 (Q8R2Y0), so the seed is the ABHD6
    clade, whose membrane location reflects an N-terminal transmembrane anchor that is not a feature of
    the bacterial hydrolase subfamilies. P. putida NicD, an SF33 member, has no transmembrane or signal
    feature and was assayed in soluble extracts. Its TreeGrafter membrane IEA is the downstream
    consequence of this node and is marked as an over-annotation in the NicD gene review. The
    assertion is defensible for SF5 (and probably the vertebrate SF14/SF32/SF34 relatives), not for
    the bacterial subfamilies.
