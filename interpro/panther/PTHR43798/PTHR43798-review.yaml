- id: file:analysis/module_audits/bacterial_mcl_pha_synthesis_and_mobilization/gpo1-consultation/primary-scope.md
  title: 'GPo1 primary evidence: native polyester turnover and limits of substrate/location inference'
review_status: NEEDS_REVIEW
reviewed_by: codex
review_date: '2026-11-13'
notes: 'Node extents come from the PANTHER 19.0 treeinfo API (2026-11-02). PTN000177089, PTN000863140,
  PTN002458043 and PTN002463243 appear in this family''s PAINT slice but not in its 19.0 tree. The sub-clade
  PTN008685320 (9 SF33 leaves: diatom, oomycete, green-algal and rice proteins) is the TreeGrafter graft
  point for PpG2 AcoC and lies under PTN001661081. PR #5078 carries a machine-generated draft of this
  file; this curated version supersedes it. SF33 contains the P. putida PpG2 acetoin-system E2 AcoC (Q59695),
  grafted there by its C-terminal AB hydrolase-1 domain while its N-terminal lipoyl domain carries the
  E2 role. No GO:0004742 assessment is made: acetyl transfer is a property of that one member, not of
  SF33''s 60 fungal and algal putative hydrolases, and a SUBFAMILY_ONLY scope would assert it for all
  of them. The acetoin module therefore grounds the E2 on NCBIfam NF011457, which groups the lipoyl/alpha-beta-hydrolase
  acetoin E2s, and records that no PANTHER family describes the E2 role. This targeted follow-up preserves
  the prior AcoC assessment and unrelated PAINT objects/judgments. P26495 is confirmed in PTHR43798:SF5
  by both raw entries and official UniProt; it is not forcibly moved into PTHR43433. TreeGrafter PTN002465558
  has 49 reference descendants, but P26495 is not one of the reference leaves; no precise graft attachment
  is independently claimed. Granule association is not itself a membrane assay, and absence of a TM helix
  is not proof of no peripheral association. Native GPo1 mutant is leaky and the rescue fragment includes
  phaC1 plus phaZ; no purified forward-product, intracellular-versus-extracellular equivalence, or secondary-MAG
  negative claim follows. 2026-11-11 integration: retain main''s NicD SF33 representative and source evidence,
  mouse ABHD6 representative, and membrane term assessment. Add the P26495 membrane exception to match
  its retained gene judgment. Existing PhaZ substrate/process exceptions and unresolved exact ancestral
  placements are retained; no NicD or ABHD6 positive evidence is discarded.'
