notes: >-
  Node extents come from the PANTHER 19.0 treeinfo API (2026-11-02). PTN000177089, PTN000863140,
  PTN002458043 and PTN002463243 appear in this family's PAINT slice but not in its 19.0 tree. The
  sub-clade PTN008685320 (9 SF33 leaves: diatom, oomycete, green-algal and rice proteins) is the
  TreeGrafter graft point for PpG2 AcoC and lies under PTN001661081. PR #5078 carries a
  machine-generated draft of this file; this curated version supersedes it.
  SF33 contains the P. putida PpG2 acetoin-system E2 AcoC (Q59695), grafted there by its
  C-terminal AB hydrolase-1 domain while its N-terminal lipoyl domain carries the E2 role.
  No GO:0004742 assessment is made: acetyl transfer is a property of that one member, not of
  SF33's 60 fungal and algal putative hydrolases, and a SUBFAMILY_ONLY scope would assert it
  for all of them. The acetoin module therefore grounds the E2 on NCBIfam NF011457, which
  groups the lipoyl/alpha-beta-hydrolase acetoin E2s, and records that no PANTHER family
  describes the E2 role.
  Merged with the independent review written for modules/aerobic_nicotinate_degradation.yaml
  (PR #5897). That review added NicD as an SF33 representative, ABHD6 representatives for SF5, the
  NicD evidence on the PTN001661081 TOO_DEEP assessment and the SF5-only membrane scope. Where the
  two reviews differed, this file keeps the acetoin review's TOO_DEEP verdict on PTN008685307; the
  nicotinate review had left that node UNRESOLVED. No member of SF33 or SF26 has monoacylglycerol
  lipase evidence, and the two reviews agree that the node does not reach the bacterial NicD-like
  proteins. AcoC stays the reference protein. NicD's hydrolase activity is consistent with the
  FAMILY_WIDE hydrolase scope.
