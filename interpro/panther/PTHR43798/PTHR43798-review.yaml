family_id: PANTHER:PTHR43798
family_name: MONOACYLGLYCEROL LIPASE
preferred_name: Alpha/beta-hydrolase fold-1 enzymes (ABHD6 monoacylglycerol lipases, proline iminopeptidases,
  RutD, dehalogenases, NicD and relatives)
summary: >-
  A very large, functionally diverse branch of the alpha/beta-hydrolase fold-1 superfamily (Pfam
  Abhydrolase_1). Members share the alpha/beta-hydrolase core and, in most, a Ser-His-Asp/Glu
  nucleophile-acid-base triad, but act on unrelated substrates. Vertebrate ABHD6 is a
  membrane-anchored monoacylglycerol lipase (SF5). Bacterial and fungal members include proline
  iminopeptidases, haloalkane and haloacetate dehalogenases, meta-cleavage-product (C-C) hydrolases,
  enol-lactonases, carboxylesterases, the RutD component of the pyrimidine-utilization pathway, and
  Pseudomonas putida NicD. NicD is the N-formylmaleamate deformylase of aerobic nicotinate degradation;
  its activity was measured in recombinant soluble extracts and abolished by S101A, D125A or H245A. The
  PANTHER family name reflects ABHD6 only.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Only the generic hydrolase fold, and in most members a Ser-based catalytic triad, are shared. Substrate
  class differs between subfamilies (acylglycerols, peptides, haloalkanes, C-C bonds, amides) and also
  within them. SF33 alone contains proline iminopeptidases, RutD, haloalkane dehalogenases,
  meta-cleavage hydrolases, mesoderm-specific transcript (MEST) homologues, NicD and the AcoC protein of
  the acetoin-cleaving system. Neither activity nor membrane location can be propagated from the
  ABHD6 clade to the bacterial subfamilies.
