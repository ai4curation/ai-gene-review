  name:
    name: RNA/DNA Helicase
    short: RNA-DNA_Helicase
  description:
  - text: The helicase family is involved in various aspects of RNA and DNA metabolism,
      including unwinding of duplexes, RNA surveillance, and processing of mitochondrial
      RNA. Members of this family play a crucial role in the degradation of RNA with
      a 3'-to-5' directionality in an ATP-dependent manner, often as part of larger
      complexes such as the mitochondrial degradosome (mtEXO), the nuclear exosome,
      and the SKI complex. They regulate the stability and removal of aberrant mRNAs,
      contribute to rRNA biogenesis, and are implicated in stress responses, DNA damage
      response, and recombination. Some members also have a role in antiviral defense
      and cellular stress tolerances, and are essential for embryogenesis, cell fate
      determination, and plasmodesmata development.
