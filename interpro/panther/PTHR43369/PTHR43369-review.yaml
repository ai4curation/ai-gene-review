    label: phosphoribosylglycinamide formyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the defining activity of a coherent family, inherited from a sound node. The module uses
    it for the PurN leaf with PTHR43369 as selector, which is correct. The same leaf also lists
    PTHR10520:SF12, which is valid only for animal GART (see the PTHR10520 review).
  supported_by:
  - reference_id: PMID:8501063
    supporting_text: >-
      We demonstrate here that Escherichia coli synthesizes two different glycinamide ribonucleotide
      (GAR) transformylases, both catalyzing the third step in the purine biosynthetic pathway.
- assessed_term:
    id: GO:0006189
    label: '''de novo'' IMP biosynthetic process'
  scope: FAMILY_WIDE
  scope_reason: Inherited from PTN000055290, and correct for all members.
- assessed_term:
    id: GO:0005737
    label: cytoplasm
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the broad location IBA from PTN000055290. Bacterial and fungal enzymes are soluble, and
    the plant PUR3 enzymes are plastid-targeted, which still falls under cytoplasm in GO's sense.
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: UNRESOLVED
  scope_reason: >-
    PAINT restricts cytosol to the bacterial node PTN000055315 (taxon Bacteria, seed E. coli PurN),
    which keeps it off the plastid plant PUR3 proteins. Fungal ADE8 is cytosolic by its own evidence.
    The family has only one populated subfamily (SF2), which also holds the plastid plant enzymes, so
    the safe scope depends on the clade (non-plant members) and cannot be stated as a subfamily
    grant. Cytosol must not be propagated to the plant plastid enzymes.
