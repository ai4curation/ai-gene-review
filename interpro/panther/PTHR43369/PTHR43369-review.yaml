family_id: PANTHER:PTHR43369
family_name: PHOSPHORIBOSYLGLYCINAMIDE FORMYLTRANSFERASE
preferred_name: Standalone PurN folate-dependent GAR transformylases
summary: >-
  PurN, the folate-dependent glycinamide ribonucleotide (GAR) transformylase (EC 2.1.2.2), moves a
  formyl group from 10-formyltetrahydrofolate onto GAR to make FGAR, step 3 of de novo purine
  synthesis. This family holds the standalone PurN enzymes: bacterial PurN (E. coli, B. subtilis,
  M. tuberculosis, P. putida), fungal ADE8 (S. cerevisiae) and ade5 (S. pombe), Dictyostelium purN,
  and the plant plastid PUR3 proteins. The homologous transformylase domain of animal trifunctional
  GART is classified with GART's whole protein in PTHR10520. Some bacteria also have PurT, an
  unrelated ATP-grasp enzyme (PTHR43055) that formylates GAR with free formate.
functional_coherence: COHERENT
coherence_reason: >-
  All 19 reviewed entries are phosphoribosylglycinamide formyltransferases in the single subfamily
  SF2. Folate-dependent GAR formylation is the shared function.
