notes: >-
  This is a partial review of a 97-subfamily family. Examined: the family root
  node PTN000461349, the plasma-membrane syntaxin node PTN000461524 and the
  syntaxin-1 node PTN000461527, through human STX1B (SF334, SYNTAXIN-1B) and
  C. elegans unc-64 (SF424, SYNTAXIN-1A); which nodes reach them was read from the
  PTN ids in their GOA IBA rows. All other subfamilies (syntaxin-2 to -19, the
  yeast, plant and protist syntaxins, and the many T-SNARE coiled-coil homology
  subfamilies) and the nodes PTN000272438, PTN000461386, PTN000461791,
  PTN000751604, PTN001071126, PTN002717040, PTN002717184 and PTN008572346 were read
  but not adjudicated; their terms are recorded as UNRESOLVED. Seed lists of the
  root node are abridged in node_assessments and given in full in the quoted
  PAINT rows. Both member GOA files carry a GO:0000149 SNARE binding IBA citing
  PTN000461349, which is absent from the current PAINT snapshot; unc-64 carries no
  IBA from PTN000461527 despite its bilaterian taxon. GO:0005484 is labelled
  "helical-bundle zippering fusogenic activity" in current GOA/QuickGO; the local
  ontology snapshot used by the validators still has "SNAP receptor activity",
  which is used here.
