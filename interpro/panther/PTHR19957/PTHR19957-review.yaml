family_id: PANTHER:PTHR19957
family_name: SYNTAXIN
preferred_name: Syntaxin family Qa-SNAREs
summary: >-
  Syntaxins are tail-anchored Qa-SNAREs with an N-terminal regulatory Habc domain
  and a membrane-proximal H3 SNARE motif that supplies the Qa helix of the
  four-helix trans-SNARE bundle. The family is large and old (97 PANTHER
  subfamilies), with paralogs that each act on a different membrane: the
  plasma-membrane syntaxins (syntaxin-1 to -4 in animals, yeast Sso1/Sso2, plant
  SYP12x) in exocytosis, syntaxin-5 at the ER-Golgi interface, syntaxin-6, -10 and
  -16 in endosome-to-Golgi transport, syntaxin-7, -8 and -12 on endosomes,
  syntaxin-17 on autophagosomes, and yeast Pep12, Vam3 and Tlg2 on internal
  compartments. The SNARE activity is family-wide; the compartment and process
  are clade-specific.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members are Qa-SNAREs that drive vesicle fusion as part of a
  SNARE complex, so the molecular function is coherent. The family is
  heterogeneous in location and trafficking route, and PAINT records those on
  clade nodes (plasma-membrane syntaxins, syntaxin-5, syntaxin-17, endosomal and
  synaptic clades) rather than at the root. Only the plasma-membrane and
  neuronal syntaxin-1 nodes were examined here.
