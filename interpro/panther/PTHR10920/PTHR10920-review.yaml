family_id: PANTHER:PTHR10920
family_name: RIBOSOMAL RNA METHYLTRANSFERASE
summary: FtsJ/RlmE-related methyltransferases modify ribose groups in RNA. The family includes bacterial
  ribosomal RNA enzymes, mitochondrial Mrm2 and eukaryotic enzymes acting on tRNA or preribosomal RNA.
  RNA type, modified nucleotide and subcellular location define the important functional boundaries. Human
  MRM2 also has a ribosome-assembly function that does not require its methyltransferase activity, and
  disrupting its fly ortholog causes mitochondrial developmental defects.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory separates bacterial RlmE, mitochondrial MRM2, FTSJ3/Spb1 prerRNA factors
  and tRNA methyltransferases. PMID:35177605 directly demonstrates human MRM2-dependent assembly that
  persists with methyltransferase-defective variants, and also tests the Drosophila ortholog in developmental
  arrest. Human catalytic independence is not itself a fly catalytic-mutant experiment. RNA substrate,
  nucleotide numbering and organellar targeting remain branch-specific.
reference_protein: &id001
  id: UniProtKB:Q9VDT6
  label: rRNA methyltransferase 2, mitochondrial
  gene_symbol: Mrm2
  organism: Drosophila melanogaster
subfamilies:
- subfamily_id: PANTHER:PTHR10920:SF18
  label: RRNA METHYLTRANSFERASE 2, MITOCHONDRIAL
  description: The classification separates mitochondrial rRNA methyltransferase 2 from FTSJ3 and tRNA-modifying
    branches. Fly Mrm2 has the mitochondrial branch assignment, but family membership alone cannot specify
    a methylated nucleotide number across divergent rRNAs. Ribosome assembly phenotypes must be distinguished
    from evidence that methylation itself is required.
  representative_members:
  - *id001
