family_id: PANTHER:PTHR43364
family_name: NADH-SPECIFIC METHYLGLYOXAL REDUCTASE-RELATED
preferred_name: AKR6/AKR7-like aldo-keto reductases (YdhF/Tas/AKR7/aryl-alcohol dehydrogenase family)
summary: >-
  Aldo-keto reductase (AKR) superfamily enzymes with the (alpha/beta)8-barrel fold and the
  His/Tyr/Lys/Asp catalytic tetrad that reduce aldehydes or ketones with NAD(P)H. The family is
  functionally broad: it holds the mammalian aflatoxin B1 aldehyde reductases (AKR7), fungal
  aryl-alcohol dehydrogenases and mycotoxin-pathway reductases (norsolorinic acid reductase,
  versiconal hemiacetal acetate reductase), plant and yeast pyridoxal reductases, bacterial Tas,
  YajO, IolS and YhdN, and the bacterial subfamily SF1, which contains the two characterized
  6-dehydroglucose reductases of sulfoquinovose degradation, Agrobacterium fabrum SmoB and
  Novosphingobium aromaticivorans SquF, together with the uncharacterized E. coli YdhF and
  B. subtilis YcsN.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members share AKR chemistry (NAD(P)H-dependent reduction of a carbonyl to an alcohol) but act on
  unrelated substrates in unrelated processes: aflatoxin detoxification (AKR7), fungal secondary
  metabolism, vitamin B6 salvage, and in SF1 the terminal step of oxidative sulfoquinovose
  degradation. Only the generic CH-OH/NAD(P) oxidoreductase class can be inherited across the
  family; substrate-level terms need subfamily or member evidence.
reference_protein:
  id: UniProtKB:A9CEY6
  label: 6-dehydroglucose reductase
  gene_symbol: smoB
  organism: Agrobacterium fabrum C58
  gene_review: genes/AGRFC/smoB/smoB-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR43364:SF1
  label: OXIDOREDUCTASE YDHF
  description: >-
    Four inventory members: the 6-dehydroglucose reductases SmoB (A. fabrum) and SquF
    (N. aromaticivorans), which reduce the desulfonated sugar released by SQ monooxygenases to
    glucose, and the uncharacterized E. coli YdhF and B. subtilis YcsN. Whether YdhF and YcsN
    share the 6-dehydroglucose activity is unknown; E. coli degrades SQ by the sulfo-EMP route,
    which produces no 6-dehydroglucose.
  representative_members:
  - id: UniProtKB:A9CEY6
    gene_symbol: smoB
    organism: Agrobacterium fabrum C58
    gene_review: genes/AGRFC/smoB/smoB-ai-review.yaml
  - id: UniProtKB:Q2G5J3
    gene_symbol: squF
    organism: Novosphingobium aromaticivorans DSM 12444
    gene_review: genes/NOVAD/squF/squF-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    The characterized SF1 members are dedicated to 6-dehydroglucose reduction in sulfoquinovose
    catabolism (NADP-specific in SmoB), a substrate and pathway not shared with the AKR7,
    fungal aryl-alcohol dehydrogenase or pyridoxal reductase members of other subfamilies.
