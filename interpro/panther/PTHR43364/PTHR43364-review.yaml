notes: >-
  Reviewed while completing the bacterial sulfoquinovose catabolism module, whose
  6-dehydroglucose reductase annoton uses subfamily SF1. Subfamily counts re-derived from the
  55-member inventory with the csv module (SF4 21, SF2 11, SF9 7, SF7 6, SF1 4, SF15 4, SF5 1,
  SF6 1). PANTHER's family name (NADH-specific methylglyoxal reductase-related) reflects one SF4
  member; InterPro IPR050523 describes the family as AKR detoxification and biosynthesis enzymes.
  The eukaryotic PAINT nodes are left UNRESOLVED where their seed evidence is not cached; they do
  not reach the bacterial SF1 members used by the module.
