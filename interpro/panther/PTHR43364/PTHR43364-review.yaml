term_assessments:
- assessed_term:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  scope: FAMILY_WIDE
  scope_reason: >-
    NAD(P)H-dependent interconversion of a carbonyl and an alcohol on the AKR scaffold is the
    family's shared chemistry; it is the most specific GO term that holds for the characterized
    SF1 members SmoB and SquF, whose EC 1.1.1.432 activity has no GO term yet.
  supported_by:
  - reference_id: PMID:35074914
    supporting_text: The overall fold has high structural conservation with members of the aldo-keto reductase
      (AKR) superfamily.
  - reference_id: PMID:35074914
    supporting_text: 'Only enzymatic reactions conducted in the presence of NADP+ produced product labeled
      with 18O at C6: NAD+ failed to produce any product, supporting our observations by ITC and defining
      the cofactor specificity of SmoB.'
- assessed_term:
    id: GO:1902777
    label: 6-sulfoquinovose(1-) catabolic process
  scope: UNRESOLVED
  scope_reason: >-
    Holds for SmoB and SquF, the two characterized SF1 members, which complete the oxidative SQ
    pathway. The other two SF1 members, E. coli YdhF and B. subtilis YcsN, are uncharacterized; E.
    coli uses the sulfo-EMP route, which does not generate 6-dehydroglucose, so SF1-wide scope
    cannot be asserted without assays of YdhF and YcsN.
  supported_by:
  - reference_id: PMID:41676062
    supporting_text: Following the C-S cleavage by SquD/SsuE, the NAD(P)H-dependent oxidoreductase SquF
      reduces 6-dehydro-D-glucose to form glucose, which can enter primary metabolism
