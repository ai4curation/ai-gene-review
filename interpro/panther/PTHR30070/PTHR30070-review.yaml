    supported_by:
      - reference_id: file:interpro/panther/PTHR30070/PTHR30070-paint.tsv
        supporting_text: "PTHR30070\tPTN001247807\tGO:1903607\tP\tIBD\tfalse\tUniProtKB:P0ABL8"
      - reference_id: PMID:17419738
        supporting_text: >-
