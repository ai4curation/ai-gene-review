family_id: PANTHER:PTHR30070
family_name: HEME EXPORTER PROTEIN B
preferred_name: CcmB cytochrome c maturation membrane subunit family
summary: >-
  PTHR30070 is the CcmB/CycW/HelB family of integral inner-membrane subunits of
  cytochrome c maturation system I. CcmB is the membrane partner of the CcmA
  ABC ATPase; CcmA is membrane-bound only when CcmB is present, and the CcmAB
  complex hydrolyses ATP to release holo-CcmE from CcmC. Members include E.
  coli, Pseudomonas, Haemophilus, Rhodobacter (HelB), Paracoccus and
  Bradyrhizobium (CycW) orthologs and the Arabidopsis mitochondrial CCMB
  homolog. Despite the PANTHER family name, direct heme export by CcmAB is not
  established, and no molecular activity is assigned to CcmB on its own.
  PANTHER defines a single subfamily (SF1).
functional_coherence: COHERENT
coherence_reason: >-
  All Swiss-Prot members are system I CcmB orthologs or the plant mitochondrial
  homolog in the single subfamily SF1; both PAINT assertions (cytochrome c
  biosynthetic process and plasma membrane) describe the shared role and
  location.
