      polytopic inner (cytoplasmic) membrane protein.
    supported_by:
      - reference_id: file:interpro/panther/PTHR30070/PTHR30070-paint.tsv
        supporting_text: "PTHR30070\tPTN001247811\tGO:0005886\tC\tIBD\tfalse\tUniProtKB:P0ABL8\ttaxon:2"
