  description: Recorded placement of D3VIU4. The bacterial target is a small signal-peptide-bearing solute-binding
    protein without a multipass pore architecture. This argues against the proposed ligand-gated ion-channel
    activity for the target. MltF transglycosylase activity also cannot be assigned to isolated substrate-binding
    modules.
