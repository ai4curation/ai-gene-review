family_id: PANTHER:PTHR35936
family_name: MEMBRANE-BOUND LYTIC MUREIN TRANSGLYCOSYLASE F
preferred_name: Family-3 solute-binding and MltF-associated modules
summary: The family includes amino-acid-binding proteins and solute-binding modules associated with lytic
  transglycosylases. Binding-domain conservation does not establish either a membrane pore or the enzymatic
  activity of a fused domain.
functional_coherence: HETEROGENEOUS
coherence_reason: The bacterial target is a small signal-peptide-bearing solute-binding protein without
  a multipass pore architecture. This argues against the proposed ligand-gated ion-channel activity for
  the target. MltF transglycosylase activity also cannot be assigned to isolated substrate-binding modules.
