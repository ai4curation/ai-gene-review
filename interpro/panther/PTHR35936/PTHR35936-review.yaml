    label: ligand-gated monoatomic ion channel activity
  scope: UNRESOLVED
  scope_reason: The Xenorhabdus product is a signal-peptide-bearing soluble solute-binding module, without
    the transmembrane pore architecture required for a ligand-gated ion channel. MltF relatives combine
    such binding modules with a lytic transglycosylase domain, which is also not a channel. These observations
    refute the proposed mechanism for the inspected architectures but do not substitute for a complete
    domain inventory of every family branch.
