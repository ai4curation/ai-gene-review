  name:
    name: UNC-13 domain-containing protein
    short: UNC-13_domain
  description:
  - text: This family of proteins is involved in various intracellular trafficking
      processes, including endosome to Golgi retrograde transport, and the regulation
      of secretory lysosome exocytosis. Members of this family play a crucial role
      in cytotoxic granule exocytosis in lymphocytes, which is essential for immune
      response. They are required for granule maturation, docking, and priming at
      the immunologic synapse. These proteins also regulate the assembly of recycling
      and late endosomal structures, leading to the formation of an endosomal exocytic
      compartment that fuses with granules at the immunologic synapse. Additionally,
      they are involved in the maturation and exocytosis of secretory lysosome-related
      organelles, particularly in tracheal development and neuronal signaling. They
      may interact with SNARE fusion receptors and membrane phospholipids in response
      to calcium influx, influencing neurotransmitter and hormone secretion, which
      can affect behavior and food intake.
