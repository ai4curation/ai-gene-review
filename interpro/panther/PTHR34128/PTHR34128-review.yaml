family_id: PANTHER:PTHR34128
family_name: CYTOCHROME C-TYPE BIOGENESIS PROTEIN CCME HOMOLOG, MITOCHONDRIAL
preferred_name: CcmE heme chaperone family
summary: >-
  PTHR34128 is the CcmE/CycJ family of membrane-anchored heme chaperones of
  cytochrome c maturation system I. CcmE has an N-terminal membrane anchor and
  a periplasmic OB-fold domain that binds heme covalently through a single
  conserved histidine (His130 in E. coli) after heme is loaded by the CcmCDE
  complex; holo-CcmE is then released by CcmAB ATP hydrolysis and delivers the
  heme to the CcmF/CcmH ligation complex for attachment to apocytochrome c.
  Members span proteobacteria (Escherichia, Pseudomonas, Shewanella,
  Haemophilus, Rhodobacter, Paracoccus, Bradyrhizobium), Deinococcus and the
  plant mitochondrial CCME homolog of Arabidopsis. PANTHER defines a single
  subfamily (SF2) for all Swiss-Prot members.
functional_coherence: COHERENT
coherence_reason: >-
  All members are CcmE orthologs in a single subfamily. PAINT places heme
  binding and cytochrome c biosynthetic process at the family root
  (PTN002436954) with seeds from E. coli CcmE and Arabidopsis CCME, and a
  mitochondrial inner membrane location only at the plant clade.
