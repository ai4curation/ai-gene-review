  name:
    name: Dendritic Spine Regulation and Scaffold
    short: Dendritic_Spine_Reg/Scaffold
  description:
  - text: The protein family is involved in various cellular functions, including
      the regulation of dendritic spine distribution and maintenance, acting as scaffolding
      proteins in dendritic spines, and participating in the ubiquitination and proteasomal
      degradation of target proteins. Members of the family are also implicated in
      translational fidelity, presynaptic neurotoxin activity, and endosome-to-plasma
      membrane trafficking. The family includes proteins that may serve as scaffold
      components in the postsynaptic density and are involved in the recruitment of
      vesicles to dendritic spines. Additionally, some members are associated with
      the inhibition of kinase activity under specific conditions and may lack ubiquitin-protein
      ligase activity in vitro.
