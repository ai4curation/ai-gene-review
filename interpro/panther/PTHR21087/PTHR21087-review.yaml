family_id: PANTHER:PTHR21087
family_name: SHIKIMATE KINASE
preferred_name: Shikimate kinases (AroK, AroL, plant SK) and plant inactive SK-like proteins
summary: >-
  P-loop nucleoside monophosphate kinase-fold enzymes that phosphorylate the 3-hydroxyl of
  shikimate with ATP to give shikimate 3-phosphate, the fifth step of the shikimate pathway.
  Members are bacterial AroK (E. coli, B. subtilis, M. tuberculosis, P. putida PP_5079), the
  enterobacterial AroL isoenzyme, and the plastid shikimate kinases of land plants (Arabidopsis
  SK1 and SK2, rice SK1 to SK3). Land plants also carry two ancient, catalytically inactive
  paralogs, shikimate kinase-like 1 and 2 (SKL1, SKL2), which arose by duplication of SK more than
  400 million years ago; SKL1 is required for chloroplast biogenesis. The fungal and apicomplexan
  AROM shikimate kinase domain is in a different PANTHER family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Shikimate kinase activity holds for bacterial AroK and AroL and for plant SK, but not for the
  plant SKL1 (SF4) and SKL2 (SF23) clades, which do not encode SK activity. PANTHER keeps the SKL
  paralogs in their own subfamilies, so the exception can be scoped by subfamily. SF16 ("SHIKIMATE
  KINASE 1, CHLOROPLASTIC") is a large mixed default subfamily holding most bacterial AroK
  together with plant SK1 orthologs.
