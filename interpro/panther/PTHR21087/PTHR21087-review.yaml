notes: >-
  Used by modules/bacterial_shikimate_chorismate_biosynthesis.yaml (discrete-enzyme architecture,
  arok_shikimate_kinase) with the family-level selector PANTHER:PTHR21087 and GO:0004765.
  Topology from the PANTHER 19 treeinfo service filtered to model organisms: root PTN000472457
  (LUCA) holds Arabidopsis SKL2 as a separate branch and a Eubacteria node PTN009043753, whose
  children are Terrabacteria AroK, a Gammaproteobacteria node (H. influenzae AroK; E. coli
  AroK/AroL duplication) and the plant duplication node PTN004530860 joining SKL1 with the
  SK1/SK2 duplication. SKL2 receives no
  PAINT annotation at all, not even chloroplast, which suggests it sits outside the Embryophyta
  node in the full tree. The P. putida AroK review (Q88CV1) takes GO:0004765 and GO:0009423 as
  core, consistent with this review.
