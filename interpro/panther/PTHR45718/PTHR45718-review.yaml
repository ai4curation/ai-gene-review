review_status: NEEDS_REVIEW
reviewed_by: claude-code
review_date: '2026-09-29'
notes: >-
  Why this family needed a review. Three separate gene curations in this project noted that
  PTHR45718 had none, and it matters because the family name is dominated by one member.
  Read at face value, "TRANSCRIPTIONAL ACTIVATOR CUBITUS INTERRUPTUS" suggests a family of
  Hedgehog effectors. It is a family of GLI-type zinc-finger transcription factors in which
  the Hedgehog effectors are one group and the GLIS factors are another.

  A classification discrepancy that a curator must know about. Three sources disagree on how
  wide this family is. The cached per-family member table under interpro/panther/, and the
  InterPro API, both place the ZIC proteins, Drosophila Odd-paired, GLIS2 and nematode TRA-1
  inside PTHR45718, which would make the family considerably more heterogeneous than
  described above. PANTHER's current sequence classification, which the repository's
  membership check is built from, places all of those in PTHR19818 "ZINC FINGER PROTEIN ZIC
  AND GLI" instead, leaving PTHR45718 as the Ci/GLI group plus GLIS1 and GLIS3. This review
  follows the current classification, and asserts no representative member that the rebuilt
  index does not place here. That membership index is a build artifact rather than a
  committed file: it is regenerated by `just ensure-panther-members` from release-pinned
  PANTHER classification files, with curated exceptions in
  interpro/panther/panther-members-overrides.tsv.

  An earlier stage of this project hit a related disagreement over KIF7, and it is worth
  recording how that one actually resolved, because it is not the same shape as this one.
  There the cached table and UniProt's cross-reference both said PTHR47969 while PANTHER's
  per-organism classification said PTHR24115, and the rebuilt index now carries both as
  acceptable alternates rather than declaring either stale. So a disagreement between these
  sources does not by itself mean the cached side is wrong. This family is the stronger case:
  the two partitions differ over which proteins are members at all, not over which subfamily
  a member sits in, and following the current classification is what keeps the review's
  representative members and its membership check consistent with each other.

  The cached PAINT slice reflects the older, broader partition. Its nodes carry seeds that are
  now classified elsewhere, which is why two node assessments are left UNRESOLVED rather than
  judged: the Eukaryota-level node and the ZIC-seeded nervous-system node may not belong to
  this family under the current release at all. Assessing them on their biology would give a
  confident answer to the wrong question.

  A relationship that is real but is not membership. ZIC and GLI proteins bind each other
  through their zinc fingers and modulate each other's transcriptional activity, which is why
  ZIC proteins are sometimes called Hedgehog pathway modulators. That is an interaction
  between two families, not a reason to give ZIC proteins the pathway term, and under the
  current classification it is not even an intra-family relationship.

  What this review does not assert. No residue_sites are recorded, though this family is a
  strong candidate: the five-finger DNA-binding module is its defining feature and the
  zinc-coordinating positions are the obvious site. That needs a structure-anchored position
  set and a verified negative control, neither of which was assembled here. The earlier
  calcium site in the Hedgehog family review shows the shape such an entry should take.
