family_id: PANTHER:PTHR45718
family_name: TRANSCRIPTIONAL ACTIVATOR CUBITUS INTERRUPTUS
preferred_name: GLI/Ci Hedgehog effectors with the GLIS1 and GLIS3 zinc-finger factors
summary: >-
  PTHR45718 holds the C2H2 zinc-finger transcription factors built on the GLI-type finger
  set. Under PANTHER's current classification it contains two functional groups. The Ci/GLI
  group are the terminal effectors of Hedgehog signalling: Drosophila Cubitus interruptus
  and the vertebrate GLI1, GLI2 and GLI3. They bind a common consensus site through five
  zinc fingers, and in Ci and GLI3 the same protein yields two opposite outputs, a
  full-length activator and a proteolytically generated N-terminal repressor, so the
  pathway's switch is built into the effector itself. The GLIS group present here, GLIS1 and
  GLIS3, shares the finger architecture without the Hedgehog role. What the family shares is
  nuclear, sequence-specific RNA polymerase II transcription factor activity; the pathway
  role belongs to the Ci/GLI group alone, and PAINT scopes it that way.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Only the Ci/GLI members transduce Hedgehog signalling. PAINT places GO:0007224 at
  PTN001836086, stamped Deuterostomia and seeded entirely by vertebrate GLI paralogs, so the
  assertion reaches neither the GLIS members nor the protostomes. GLIS1 and GLIS3 act in
  reprogramming and in pancreatic and thyroid development with no Hedgehog assertion of any
  kind. A pathway or signed-activity term on the whole family would be wrong for the GLIS
  members; the generic transcription-factor terms are what is safe family-wide.
reference_protein:
  id: UniProtKB:P19538
  label: Transcriptional activator cubitus interruptus
  gene_symbol: ci
  organism: Drosophila melanogaster
  gene_review: genes/DROME/ci/ci-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR45718:SF4
    clade_node_id: PANTHER:PTN000456649
    label: TRANSCRIPTIONAL ACTIVATOR CUBITUS INTERRUPTUS
    description: >-
      Drosophila Ci and its close relatives, the founding Hedgehog effector and the subfamily
      the family is named for. Ci is the single Gli-family factor of the fly and carries both
      pathway outputs: the full-length activator Ci-155 and the processed repressor Ci-75.
    representative_members:
      - id: UniProtKB:P19538
        gene_symbol: ci
        organism: Drosophila melanogaster
        gene_review: genes/DROME/ci/ci-ai-review.yaml
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR45718:SF2
    label: ZINC FINGER PROTEIN GLI1
    description: >-
      GLI1, the vertebrate amplifying activator. It is itself a Hedgehog target gene, so it
      sits downstream of the pathway as well as inside it, and unlike GLI2 and GLI3 it is not
      known to yield a repressor form.
    representative_members:
      - id: UniProtKB:P08151
        gene_symbol: GLI1
        organism: Homo sapiens
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR45718:SF6
    label: ZINC FINGER PROTEIN GLI2
    description: >-
      GLI2, the principal activator-forming paralog of vertebrate Hedgehog signalling and the
      effector most curated GO-CAM models place at the pathway's output.
    representative_members:
      - id: UniProtKB:P10070
        gene_symbol: GLI2
        organism: Homo sapiens
        gene_review: genes/human/GLI2/GLI2-ai-review.yaml
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR45718:SF5
    clade_node_id: PANTHER:PTN001836086
    label: TRANSCRIPTIONAL ACTIVATOR GLI3
    description: >-
      GLI3, the principal repressor-forming paralog. Its processed N-terminal form is the
      vertebrate counterpart of Ci-75, and that correspondence was recognised from the human
      disease phenotypes before the mechanism was worked out.
    representative_members:
      - id: UniProtKB:P10071
        gene_symbol: GLI3
        organism: Homo sapiens
        gene_review: genes/human/GLI3/GLI3-ai-review.yaml
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR45718:SF3
    label: ZINC FINGER PROTEIN GLIS1
    description: >-
      GLIS1, a GLI-similar factor with no Hedgehog role, best known as an enhancer of
      reprogramming to pluripotency.
    representative_members:
      - id: UniProtKB:Q8NBF1
        gene_symbol: GLIS1
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      Shares the zinc-finger DNA-binding module and nuclear transcription factor activity with
      the rest of the family, but transduces no Hedgehog signal and carries no assertion from
      the Deuterostomia pathway node. Do not inherit pathway terms here.
  - subfamily_id: PANTHER:PTHR45718:SF1
    label: ZINC FINGER PROTEIN GLIS3
    description: >-
      GLIS3, a GLI-similar factor acting in pancreatic beta-cell and thyroid development, with
      no Hedgehog role.
    representative_members:
      - id: UniProtKB:Q8NEA6
        gene_symbol: GLIS3
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      As for GLIS1: the finger architecture is shared, the pathway role is not.
node_assessments:
  - node_id: PANTHER:PTN001836086
    asserted_term:
      id: GO:0007224
      label: smoothened signaling pathway
    seeds:
      - id: UniProtKB:P08151
        gene_symbol: GLI1
        organism: Homo sapiens
      - id: UniProtKB:P10070
        gene_symbol: GLI2
        organism: Homo sapiens
        gene_review: genes/human/GLI2/GLI2-ai-review.yaml
      - id: UniProtKB:P10071
        gene_symbol: GLI3
        organism: Homo sapiens
        gene_review: genes/human/GLI3/GLI3-ai-review.yaml
      - id: UniProtKB:A0A8J1LVR3
        gene_symbol: gli2.S
        organism: Xenopus laevis
    assessment: SOUND
    assessment_reason: >-
      The one Hedgehog assertion in this family, and it is correctly confined. The node is
      stamped Deuterostomia and seeded entirely by vertebrate GLI paralogs, so it reaches
      neither the GLIS members nor the protostomes. Curating Drosophila ci confirmed the
      consequence from the other side: ci sits in this family but carries no IBA for
      GO:0007224 at all, and its pathway role rests instead on a large body of its own
      experimental annotation, including a demonstration that cells lacking Ci produce no
      Hedgehog output whatever. A shallower placement would have been the error here, and
      PAINT did not make it.
    node_taxon:
      id: NCBITaxon:33511
      label: Deuterostomia
    paint_snapshot: '20260530'
  - node_id: PANTHER:PTN000456649
    asserted_term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    seeds:
      - id: FB:FBgn0004859
        gene_symbol: ci
        organism: Drosophila melanogaster
        gene_review: genes/DROME/ci/ci-ai-review.yaml
      - id: UniProtKB:P08151
        gene_symbol: GLI1
        organism: Homo sapiens
      - id: UniProtKB:A0A8J1LVR3
        gene_symbol: gli2.S
        organism: Xenopus laevis
    assessment: SOUND
    assessment_reason: >-
      The generic transcription-factor assertion for the Ci/GLI group, placed at Bilateria and
      seeded by both a protostome and several deuterostomes. This is the node the fly gene's
      own IBA rows descend from. Leaving the term unsigned is correct rather than imprecise,
      because the same node covers members whose output is activation and members whose output
      is repression, and in Ci and GLI3 it covers both outputs of one protein.
    node_taxon:
      id: NCBITaxon:33213
      label: Bilateria
    paint_snapshot: '20260828'
  - node_id: PANTHER:PTN000456649
    asserted_term:
      id: GO:0005634
      label: nucleus
    seeds:
      - id: FB:FBgn0004859
        gene_symbol: ci
        organism: Drosophila melanogaster
        gene_review: genes/DROME/ci/ci-ai-review.yaml
      - id: UniProtKB:P10071
        gene_symbol: GLI3
        organism: Homo sapiens
        gene_review: genes/human/GLI3/GLI3-ai-review.yaml
    assessment: SOUND
    assessment_reason: >-
      Where these factors act. Nuclear entry is regulated rather than constitutive in this
      group, since Ci is held in the cytoplasm and translocates on signalling, but the
      location term describes where the activity happens and the regulation does not
      contradict it.
    node_taxon:
      id: NCBITaxon:33213
      label: Bilateria
    paint_snapshot: '20260530'
  - node_id: PANTHER:PTN000456649
    asserted_term:
      id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    seeds:
      - id: UniProtKB:P10071
        gene_symbol: GLI3
        organism: Homo sapiens
        gene_review: genes/human/GLI3/GLI3-ai-review.yaml
      - id: MGI:MGI:95727
        organism: Mus musculus
    assessment: SOUND
    assessment_reason: >-
      The DNA-binding counterpart of the activity assertion at the same node. The GLI/Ci
      consensus site is bound through the same five zinc fingers in every member of the
      group, by both the activator and the repressor forms, which is why the binding term is
      safe where the signed activity terms are not.
    node_taxon:
      id: NCBITaxon:33213
      label: Bilateria
    paint_snapshot: '20200907'
  - node_id: PANTHER:PTN000456649
    asserted_term:
      id: GO:0006357
      label: regulation of transcription by RNA polymerase II
    seeds:
      - id: FB:FBgn0004859
        gene_symbol: ci
        organism: Drosophila melanogaster
        gene_review: genes/DROME/ci/ci-ai-review.yaml
      - id: UniProtKB:P08151
        gene_symbol: GLI1
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      The process counterpart of the activity term, at the same node and equally unsigned.
      Signed regulation terms exist for individual members and for particular target genes,
      but they are gene-level claims, not properties of the clade.
    node_taxon:
      id: NCBITaxon:33213
      label: Bilateria
    paint_snapshot: '20210601'
  - node_id: PANTHER:PTN001803442
    asserted_term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    seeds:
      - id: PomBase:SPAC6G10.12c
        organism: Schizosaccharomyces pombe
      - id: MGI:MGI:106676
        organism: Mus musculus
    assessment: UNRESOLVED
    assessment_reason: >-
      The deepest node in the slice, stamped Eukaryota and seeded across fungi, insects and
      mammals. The assertion itself is unobjectionable, since it says only what a
      zinc-finger transcription factor is, and a node spanning that distance should carry
      nothing more specific. What cannot be settled from the cached data is whether this node
      belongs to this family at all under the current classification. Several of its seeds are
      proteins that PANTHER now places in PTHR19818 rather than here, so the node may describe
      the older, broader partition that included the ZIC group. See the notes; the same caveat
      applies to any other node in this slice whose seeds are not Ci/GLI or GLIS proteins.
    node_taxon:
      id: NCBITaxon:2759
      label: Eukaryota
    paint_snapshot: '20251219'
  - node_id: PANTHER:PTN008366297
    asserted_term:
      id: GO:0007417
      label: central nervous system development
    seeds:
      - id: UniProtKB:Q15915
        gene_symbol: ZIC1
        organism: Homo sapiens
      - id: MGI:MGI:106679
        organism: Mus musculus
    assessment: UNRESOLVED
    assessment_reason: >-
      A nervous-system development node whose seeds are ZIC proteins. Two things block a
      judgement. The row carries no taxon at all in the cached slice, so the clade that
      inherits it is unknown; and its seeds are proteins that PANTHER's current classification
      places in PTHR19818, so the node may not belong to this family any more. Either
      objection alone would warrant flagging it. Recorded rather than pruned, because pruning
      a node on a classification discrepancy would be acting on the least reliable part of the
      evidence.
    paint_snapshot: '20260828'
term_assessments:
  - assessed_term:
      id: GO:0007224
      label: smoothened signaling pathway
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Safe only for the Ci/GLI members. Neither GLIS member transduces Hedgehog, and PAINT
      already confines the assertion to a Deuterostomia node seeded by vertebrate GLI
      paralogs. Drosophila Ci is listed as applicable on its own experimental record rather
      than by inheritance: it carries no IBA from that node, because it sits outside the
      clade the node describes.
    applicable_subfamilies:
      - id: PANTHER:PTHR45718:SF2
        label: ZINC FINGER PROTEIN GLI1
      - id: PANTHER:PTHR45718:SF5
        label: TRANSCRIPTIONAL ACTIVATOR GLI3
      - id: PANTHER:PTHR45718:SF6
        label: ZINC FINGER PROTEIN GLI2
      - id: PANTHER:PTHR45718:SF4
        label: TRANSCRIPTIONAL ACTIVATOR CUBITUS INTERRUPTUS
    supported_by:
      - reference_id: PMID:11171398
        supporting_text: >-
          The Gli homolog Cubitus interruptus (Ci) is involved in controlling the
          transcription of Drosophila Hh target genes and thus represents the most downstream
          component known in this pathway.
  - assessed_term:
      id: GO:0000981
      label: DNA-binding transcription factor activity, RNA polymerase II-specific
    scope: FAMILY_WIDE
    scope_reason: >-
      What every member is, asserted at the Bilateria node for the Ci/GLI group and safe for
      the GLIS members on the same architecture. Deliberately unsigned: this family contains
      activators, repressors, and single proteins that are both depending on processing, so
      the signed children are subfamily-level or gene-level claims rather than family-level
      ones.
  - assessed_term:
      id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    scope: FAMILY_WIDE
    scope_reason: >-
      The shared five-finger DNA-binding module is the structural feature that defines
      membership, and the binding term follows it. In the Ci/GLI group both the activator and
      the repressor forms bind the same consensus through the same fingers, so this term
      survives the processing event that splits the signed activity terms.
  - assessed_term:
      id: GO:0005634
      label: nucleus
    scope: FAMILY_WIDE
    scope_reason: >-
      Where all of these factors act. Regulated nuclear entry in the Ci/GLI group is a control
      mechanism, not an exception to the location.
  - assessed_term:
      id: GO:0001227
      label: DNA-binding transcription repressor activity, RNA polymerase II-specific
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The signed repressor term belongs to the members that generate a repressor form by
      limited proteolysis, which among the Hedgehog effectors means Ci and GLI3. It is not a
      family-wide property and must not descend from the unsigned parent at the Bilateria
      node. GLI2 is excluded deliberately: it is the activator-forming paralog, and the
      curated models place the repressor output on GLI3.
    applicable_subfamilies:
      - id: PANTHER:PTHR45718:SF4
        label: TRANSCRIPTIONAL ACTIVATOR CUBITUS INTERRUPTUS
      - id: PANTHER:PTHR45718:SF5
        label: TRANSCRIPTIONAL ACTIVATOR GLI3
    supported_by:
      - reference_id: PMID:10077605
        supporting_text: >-
          Ci is sequestered in the cytoplasm and is subject to posttranslational processing
          whereby the full-length transcriptional activator form (Ci155) can be cleaved to a
          repressor form (Ci75).
  - assessed_term:
      id: GO:0001228
      label: DNA-binding transcription activator activity, RNA polymerase II-specific
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      The mirror of the repressor assessment above, and scoped conservatively for a
      different reason. Activation is the Hedgehog-responsive output of this family: the
      full-length forms enter the nucleus when Hedgehog is received and turn on pathway
      targets. Two subfamilies are listed because two have curated reviews in this
      repository that anchor the activity directly, Drosophila Ci by genetic interaction
      with the dCBP coactivator and by mutational analysis of decapentaplegic activation,
      and human GLI2 by direct assay, where it is identified as the major transcriptional
      activator of the pathway and is typed with exactly this term in four cached GO-CAMs.
      GLI1 is almost certainly in scope on the same grounds and is deliberately not listed:
      it has no curated review here, and this project does not assert a subfamily grant it
      cannot anchor. GLI3 is excluded as the repressor-forming paralog, consistent with the
      GO:0001227 assessment above. GLIS1 and GLIS3 are not assessed either way. They are
      GLI-type zinc-finger factors with transcriptional activity of their own but they are
      not Hedgehog effectors, and nothing in this repository establishes whether this
      signed, polymerase-II-specific term holds for them, so an absence here should be read
      as unexamined rather than as denied.
    applicable_subfamilies:
      - id: PANTHER:PTHR45718:SF4
        label: TRANSCRIPTIONAL ACTIVATOR CUBITUS INTERRUPTUS
      - id: PANTHER:PTHR45718:SF6
        label: ZINC FINGER PROTEIN GLI2
    supported_by:
      - reference_id: PMID:10669739
        supporting_text: >-
          Taken together, our data suggest that dCBP function is necessary for ci-mediated
          transactivation of wg during Drosophila embryogenesis.
      - reference_id: PMID:15994174
        supporting_text: >-
          Zinc finger-containing Gli proteins mediate responsiveness to Hedgehog (Hh)
          signaling, with Gli2 acting as the major transcriptional activator in this pathway
          in mice.
