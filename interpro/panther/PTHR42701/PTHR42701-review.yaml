family_id: PANTHER:PTHR42701
family_name: IMIDAZOLE GLYCEROL PHOSPHATE SYNTHASE SUBUNIT HISH
preferred_name: Imidazole glycerol phosphate synthase glutaminase subunit (HisH) family
summary: >-
  HisH is the class I (triad-type) glutamine amidotransferase subunit of the heterodimeric
  imidazole glycerol phosphate synthase (IGPS) of bacteria and archaea. HisH hydrolyses
  L-glutamine to L-glutamate and ammonia, and the ammonia is channelled to the active site of the
  HisF cyclase subunit, which converts PRFAR to imidazole glycerol phosphate and AICAR, step 5 of
  L-histidine biosynthesis. HisH has no productive activity apart from HisF. The family has two
  subfamilies, both HisH: SF1 (most bacteria and archaea, including E. coli HisH and the second
  HisH paralogs that several genomes carry) and SF2 (a beta- and gammaproteobacterial group that
  includes Pseudomonas and Neisseria HisH). The fungal fused HisHF proteins (S. cerevisiae HIS7,
  S. pombe his4) are not in this family; PANTHER classifies them in PTHR21235:SF2.
functional_coherence: COHERENT
coherence_reason: >-
  Both subfamilies are HisH glutaminase subunits of IGP synthase. Several genomes carry two or
  three HisH paralogs (UniProt "HisH 1", "HisH 2"); these sit in SF1 and SF2 alike, and no member
  of either subfamily is known in the cached evidence to have lost the glutaminase or to act
  outside histidine biosynthesis.
