notes: 'Bounded family audit for mannose PTS interpretation. All cached PAINT identities, terms, evidence,
  polarity, seeds and dates are copied unchanged into assessments. No raw source is rewritten. No evolutionary
  loss or catalytic residue rule is invented; positive target activities remain valid where supported.
  The subfamily roster below names characterized or directly classified relevant branches and does not
  pretend every member or every downstream enzyme was experimentally re-reviewed. PTHR33799 membership
  alone licenses neither an EIIB domain nor a second relay role: fused ManX/PtnAB/ManL require independent
  PF03830/IPR004720 evidence for IIB. Separate Bacillus LevE P26380 has PF03830 but no PANTHER cross-reference
  in the archived official record; it is an external fructose-system architecture control, not a member
  assigned to this family or a positive mannose exemplar.'
