family_id: PANTHER:PTHR33799
family_name: PTS PERMEASE-RELATED-RELATED
preferred_name: Mannose-family PTS IIA and fused IIAB phosphorelay proteins
summary: Members participate in sugar-specific phosphoenolpyruvate-dependent phosphotransfer systems.
  The shared IIA architecture occurs both as a separate soluble phosphorelay protein, exemplified by Bacillus
  LevD, and fused to an IIB domain, exemplified by Escherichia coli ManX. Substrates include mannose-family
  system sugars, fructose and sorbose; the fold or single PANTHER subfamily does not define the transported
  sugar or ensure a fused IIAB protein. Sugar phosphorylation and membrane translocation require compatible
  partners.
functional_coherence: HETEROGENEOUS
coherence_reason: Specific sugar, domain fusion and assembled activity differ despite a shared PTS phosphorelay
  role.
