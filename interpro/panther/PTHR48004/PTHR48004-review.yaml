- assessed_term:
    id: GO:0016301
    label: kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    F4JLB7 has an LRR solenoid without a complete protein-kinase domain or an ordered catalytic motif
    arrangement; isolated DFG-like strings do not establish a kinase active site. This refutes intrinsic
    kinase activity for that sequence. The evidence does not define a family-wide kinase or non-kinase
    mechanism, or a supported catalytically distinct subfamily boundary, so the target-level result is
    not promoted to a universal NOT_APPLICABLE judgment.
  supported_by:
  - reference_id: file:genes/ARATH/F4JLB7/F4JLB7-hypotheses/prediction-kinase-activity/openscientist.md
    supporting_text: Second, a **direct motif scan** of the sequence recovered 9 canonical LRR cores but
      found no ordered kinase catalytic triad; the isolated "DFG" (position 149, inside PEDFGSV) and a
      "GNGFHG" hit (position 186) are coincidental tripeptides embedded within the LRR solenoid, not part
      of a folded catalytic cleft.
  - reference_id: file:genes/ARATH/F4JLB7/F4JLB7-uniprot.txt
    supporting_text: DR   InterPro; IPR001611; Leu-rich_rpt.
  - reference_id: file:genes/ARATH/F4JLB7/F4JLB7-uniprot.txt
    supporting_text: DR   InterPro; IPR032675; LRR_dom_sf.
  - reference_id: file:genes/ARATH/F4JLB7/F4JLB7-uniprot.txt
    supporting_text: DR   Pfam; PF00560; LRR_1; 3.
  - reference_id: file:genes/ARATH/F4JLB7/F4JLB7-uniprot.txt
    supporting_text: DR   Pfam; PF13855; LRR_8; 1.
