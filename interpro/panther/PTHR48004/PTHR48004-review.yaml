    supporting_text: DR   InterPro; IPR001611; Leu-rich_rpt.
  - reference_id: file:genes/ARATH/F4JLB7/F4JLB7-uniprot.txt
    supporting_text: DR   InterPro; IPR032675; LRR_dom_sf.
