family_id: PANTHER:PTHR48004
family_name: OS01G0149700 PROTEIN
preferred_name: Plant leucine-rich-repeat receptor-like proteins
summary: The retrieved family includes plant receptor-like proteins RLP19 and PII-2. Extracellular leucine-rich
  repeats provide a recognition surface; receptor-associated signaling can occur without an intrinsic
  protein kinase domain.
functional_coherence: UNKNOWN
coherence_reason: >-
  F4JLB7, RLP19 and PII-2 support extracellular LRR receptor-like architecture, but a recognition surface
  alone does not establish a common ligand, catalytic reaction or partner-mediated signaling mechanism.
  The F4JLB7 sequence lacks a complete kinase domain; an associated kinase could in principle mediate
  signaling, but no such target mechanism is established. The unresolved coherence concerns what shared
  activity the architecture performs, not the ratio of cached entries to a metadata protein count.
subfamilies:
- label: F4JLB7 LRR receptor-like protein
  description: Both classification snapshots place F4JLB7 in the same parent family; its exact subfamily
    is unresolved. F4JLB7 is an LRR receptor-like sequence, and its OpenScientist domain analysis finds
    no kinase domain. Kinase activity is therefore contradicted for that sequence; participation in phosphorylation-mediated
    signaling is a separate unresolved question. Ligand recognition and partner kinases require member-specific
    evidence.
  representative_members:
  - id: UniProtKB:F4JLB7
    gene_symbol: F4JLB7
    organism: Arabidopsis thaliana
    gene_review: genes/ARATH/F4JLB7/F4JLB7-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0016310
    label: phosphorylation
  scope: UNRESOLVED
  scope_reason: An extracellular LRR receptor-like protein can regulate a phosphorylation pathway through
    a partner kinase without itself phosphorylating a substrate. F4JLB7 lacks the kinase domain in the
    sequence/domain analysis, but no partner-dependent phosphorylation mechanism is established for it.
    The family evidence therefore does not support a universal phosphorylation-process grant or a universal
    negative.
  supported_by:
  - reference_id: file:genes/ARATH/F4JLB7/F4JLB7-hypotheses/prediction-kinase-activity/openscientist.md
    supporting_text: no protein-kinase Pfam (PF00069) and no InterPro protein-kinase domain is present
      anywhere in the sequence.
