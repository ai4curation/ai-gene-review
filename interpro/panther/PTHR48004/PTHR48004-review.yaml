term_assessments:
- assessed_term:
    id: GO:0016310
    label: phosphorylation
  scope: UNRESOLVED
  scope_reason: An extracellular LRR receptor-like protein can regulate a phosphorylation pathway through
    a partner kinase without itself phosphorylating a substrate. F4JLB7 lacks the kinase domain in the
    sequence/domain analysis, but no partner-dependent phosphorylation mechanism is established for it.
    The family evidence therefore does not support a universal phosphorylation-process grant or a universal
    negative.
  supported_by:
  - reference_id: file:genes/ARATH/F4JLB7/F4JLB7-hypotheses/prediction-kinase-activity/openscientist.md
    supporting_text: no protein-kinase Pfam (PF00069) and no InterPro protein-kinase domain is present
      anywhere in the sequence.
