notes: |-
  ARATH/F4JLB7: requested accession F4JLB7; current record F4JLB7; sequence length 450; source cohort ARGO50. Family boundaries were assessed using the fetched member set and the cited domain, literature and analytical evidence. Gene-review verdicts and ARBA assertions are not independent validation. PANTHER subfamily labels and membership are recorded from the frozen UniProt records and panther.obo; they do not by themselves prove functional uniformity within a subfamily. PAINT rows were inspected as ancestral assertions, but node placement is not adjudicated without the relevant descendant tree/alignment. No residue requirement is encoded without a verified sequence-version anchor. A target-level refutation is not a family-wide NOT_APPLICABLE judgment. Exact protein-name-only predictions are treated as family-identification hypotheses rather than invented GO predictions.

  Placement evidence (2026-10-02)

  | Protein / source | Frozen UniProt placement (historical observation) | Official PANTHER 19.0 row |
  |---|---|---|
  | F4JLB7 (arabidopsis / 15922) | PTHR48004:SF58 — OS01G0162200 PROTEIN | PTHR48004:SF38 |

  Both observations support this parent; only numbered subfamily placement is unresolved.

  Both observed classification sources place F4JLB7 in PTHR48004, while SF58 versus SF38 remains unresolved. Its frozen 2026 UniProt record combines RIC7 naming with a 450-residue LRR sequence, sequence version 1 since 2011. The alternative name is not evidence for a CRIB-effector mechanism or accession sequence drift. The cached PAINT table has no F4JLB7 seed or SF38/SF58 bridge. OpenScientist sequence/domain analysis finds an LRR solenoid, no complete protein-kinase domain and no ordered catalytic motif arrangement; isolated DFG-like strings are not a kinase active site. Intrinsic kinase activity is contradicted for this sequence, but an extracellular LRR protein could in principle regulate phosphorylation through a partner kinase. No such F4JLB7 partner-dependent mechanism is established. RLP19 and PII-2 illustrate receptor-like architecture in the retrieved cohort; ligand recognition and partners require member-specific evidence. Current UNRESOLVED term reasons below govern the family; they are not historical or universal negative claims.

  The table records source observations, not live membership declarations. Complete earlier descriptors and assessments are preserved at https://github.com/ai4curation/ai-gene-review/blob/e82261ba811dadbb944cd3770e7fdd2889ec69a4/interpro/panther/PTHR48004/PTHR48004-review.yaml. Current structured term assessments are authoritative; duplicate historical copies have been removed from these notes.

