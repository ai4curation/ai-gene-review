notes: |-
  ARATH/F4JLB7: requested accession F4JLB7; current record F4JLB7; sequence length 450; source cohort ARGO50. Family boundaries were assessed using the fetched member set and the cited domain, literature and analytical evidence. Gene-review verdicts and ARBA assertions are not independent validation. PANTHER subfamily labels and membership are recorded from the frozen UniProt records and panther.obo; they do not by themselves prove functional uniformity within a subfamily. PAINT rows were inspected as ancestral assertions, but node placement is not adjudicated without the relevant descendant tree/alignment. No residue requirement is encoded without a verified sequence-version anchor. A target-level refutation is not a family-wide NOT_APPLICABLE judgment. Exact protein-name-only predictions are treated as family-identification hypotheses rather than invented GO predictions.

  PANTHER classification conflict assessment (2026-10-01). Unresolved classification for UniProtKB:F4JLB7: the frozen UniProt record records PTHR48004:SF58 (OS01G0162200 PROTEIN), whereas the authenticated official PANTHER 19.0 arabidopsis sequence-classification row 15922 records PTHR48004:SF38 (ROP-INTERACTIVE CRIB MOTIF-CONTAINING PROTEIN 7). The latter is also the tested upstream membership index assignment. Both source observations are retained; neither is silently replaced by the other. Exact subfamily placement remains unresolved.

  Retain F4JLB7 in an unnumbered functional group. The 2026 UniProt record itself combines RIC7 naming with a 450-residue LRR sequence, sequence version 1 since 2011. The 2024 label is not evidence for a CRIB-effector mechanism or accession sequence drift. The cached PAINT table has no F4JLB7 seed and no SF38/SF58 bridge.

  Provenance: diagnostic run 36943928592, attempt 1, source head 86ffe004ffe04b167981c081a14c1c526fb24da2; compact artifact 11201891369 (SHA256 9861e63fc8279e570e57ad56d639c36edafeac62809ee9867681a27175707136). The official inputs declare PTHR19.0 and HTTP Last-Modified 2024-06-20; panther.obo and the parser also declare 19.0. The UniProt and PAINT snapshots are later observations but do not establish a different PANTHER release. Full raw-source digests are runner-recorded, not independently recomputed from this compact artifact. No PAINT node or alternate functional assignment is inferred. This review is IN_PROGRESS until the conflicting placement is resolved.

