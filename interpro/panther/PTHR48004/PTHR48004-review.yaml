family_id: PANTHER:PTHR48004
family_name: OS01G0149700 PROTEIN
preferred_name: Plant leucine-rich-repeat receptor-like proteins
summary: The retrieved family includes plant receptor-like proteins RLP19 and PII-2. Extracellular leucine-rich
  repeats provide a recognition surface; receptor-associated signaling can occur without an intrinsic
  protein kinase domain.
functional_coherence: MOSTLY_COHERENT
coherence_reason: F4JLB7 is an LRR receptor-like sequence, and its OpenScientist domain analysis finds
  no kinase domain. Kinase activity is therefore contradicted for that sequence; participation in phosphorylation-mediated
  signaling is a separate unresolved question. Ligand recognition and partner kinases require member-specific
  evidence.
