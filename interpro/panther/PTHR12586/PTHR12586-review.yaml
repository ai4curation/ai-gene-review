notes: >-
  IBA recipients were listed from the PAINT UniProt GAF. Inconsistency for the module curators:
  cdp_dag_phospholipid_synthesis selects the PGS1 annoton (pgs1_activity) by PTHR12586:SF1 and
  calls it the "mitochondrial PGP synthase subfamily". SF1 is the family's only subfamily and
  also contains the type-I bacterial PS synthases (E. coli P23830, H. influenzae P44704). The
  annoton should be scoped by the eukaryotic node PTN000287047, as
  bacterial_phosphatidylethanolamine_biosynthesis already does for PssA with PTN001758495.
  S. pombe pgs1 (Q9HDW1) and human PGS1 (Q32NB8) have no gene reviews.
