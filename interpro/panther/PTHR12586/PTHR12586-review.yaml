family_id: PANTHER:PTHR12586
family_name: CDP-DIACYLGLYCEROL--SERINE O-PHOSPHATIDYLTRANSFERASE
preferred_name: PLD-superfamily CDP-alcohol phosphatidyltransferases (eukaryotic PGS1 and type-I bacterial PssA)
summary: >-
  Phospholipase D (PLD)-superfamily phosphatidyltransferases that transfer the phosphatidyl
  group of CDP-diacylglycerol to a soluble alcohol acceptor. There are two characterized
  groups. Eukaryotic PGS1 (yeast PGS1/PEL1, S. pombe pgs1, human PGS1) is the mitochondrial
  phosphatidylglycerophosphate (PGP) synthase. It uses sn-glycerol 3-phosphate and catalyses
  the committed step of phosphatidylglycerol and cardiolipin synthesis. Type-I bacterial PssA
  (E. coli, H. influenzae, P. putida) is a peripheral-membrane phosphatidylserine synthase
  that uses L-serine. These enzymes are unrelated to the integral-membrane CDP-alcohol
  phosphatidyltransferases of PTHR14269, which include bacterial and plant PgsA, the type-II
  PS synthases and yeast CHO1.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family joins two acceptor specificities, glycerol 3-phosphate (eukaryotic PGS1) and
  L-serine (gammaproteobacterial type-I PssA). PANTHER has only one subfamily, SF1, named
  CDP-DIACYLGLYCEROL--GLYCEROL-3-PHOSPHATE 3-PHOSPHATIDYLTRANSFERASE, MITOCHONDRIAL. It holds
  both groups: E. coli PssA P23830 and H. influenzae PssA P44704 sit in SF1 next to yeast,
  S. pombe and human PGS1. The subfamily therefore cannot separate the two functions. PAINT
  separates them at the node level: PTN000287047 (Eukaryota) gives PGP synthase, cardiolipin
  synthesis and mitochondrion to PGS1, and PTN001758495 (Gammaproteobacteria) gives PS synthase
  and cytosol to PssA. Each function must be scoped by node, not by subfamily.
