notes: >-
  Modules: modules/dntp_de_novo_synthesis.yaml uses PANTHER:PTHR23409 (family level) for the
  radical-bearing small subunit, with RNR2, RRM2 and nrdB as representatives. It models RNR4
  separately as a GENE_PRODUCT "inactive small-subunit partner", but RNR4 is also a member of
  PTHR23409:SF18, so the family selector includes it too. The family selector also includes
  R2lox (SF36), which is not an RNR subunit. modules/mitochondrial_dntp_supply.yaml uses
  PTHR23409 for RRM2B (SF19), which is consistent. PAINT has no MF IBD in this family, so yeast
  RNR2/RNR4 and the bacterial R2s receive no IBA from it. The only node, PTN001158161, is
  animal-level (33 eukaryotic taxa, all bilaterian/vertebrate members in the model-organism
  files). .cache/panther/IBD.gaf has no IRD/IKR rows for this node. Subfamily placements are
  from the PANTHER 19 model-organism classification files. Other subfamilies (SF35 Arabidopsis
  RNR2A, SF37, SF40, SF41, SF42 frog rrm2.2) are not discussed individually. The PANTHER name
  CAPSID PROTEIN for SF21 was not investigated.
