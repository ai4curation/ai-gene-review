term_assessments:
- assessed_term:
    id: GO:0004748
    label: ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The activity the dNTP and mitochondrial dNTP-supply modules assert for the RNR role. It is
    safe, with the contributes_to sense appropriate for a subunit, for the radical-bearing small
    subunits in SF18, SF20 and SF19. It does not apply to the R2lox oxidases (SF36), and it is
    unestablished for SF21 (F54H12.2). Within SF18, yeast Rnr4 is catalytically inactive. It
    still contributes to holoenzyme activity as the obligate beta' partner of Rnr2, and its
    gene review keeps the activity term in that sense, so it is not listed as an exception
    here. A module selector "PTHR23409 = radical-bearing small subunit" therefore also captures
    Rnr4.
