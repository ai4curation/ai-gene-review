  assessment: SOUND
  assessment_reason: >-
    PAINT records no taxon for this node. Its inheritors in the PAINT UniProt GAF are 33
    eukaryotic taxa: vertebrate RRM2 and RRM2B, fly RnrS and worm rnr-2, so the node is an
    animal-level node. The term is correct for these. The placement is shallower than the
    biology: yeast, plant and bacterial R2s do the same job and inherit nothing from it. That
    is under-propagation, not an error. One inheritor is questionable. C. elegans F54H12.2
    (SF21) also receives the term, although no RNR function is known for it. This should be
    reviewed at that leaf. It is not flagged as NEEDS_PRUNING because no evidence of
    inactivity was checked. The RRM2B review accepts the IBA.
  supported_by:
