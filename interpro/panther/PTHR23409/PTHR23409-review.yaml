family_id: PANTHER:PTHR23409
family_name: RIBONUCLEOSIDE-DIPHOSPHATE REDUCTASE SMALL CHAIN
preferred_name: Ribonucleotide reductase small (beta, R2) subunit and R2-like ferritin-fold family
summary: >-
  Class I ribonucleotide reductase (RNR) small subunits (beta, R2) are ferritin-like
  four-helix-bundle proteins with a carboxylate-bridged dimetal site. The site activates oxygen
  to make a stable tyrosyl radical, which is passed to the large subunit (PTHR11573) to start
  each reduction of a ribonucleoside diphosphate to a deoxyribonucleoside diphosphate. Active
  members include eukaryotic R2 (yeast Rnr2, fission yeast Suc22, human RRM2 and the
  p53-inducible RRM2B/p53R2, fly, worm and plant R2) and bacterial NrdB (class Ia) and NrdF
  (class Ib). The family also contains R2 homologs that no longer work as RNR subunits. One is
  budding-yeast Rnr4, an essential but catalytically inactive beta' partner that lacks iron
  ligands and folds and stabilizes Rnr2 in a 1:1 heterodimer. Another is the R2-like
  ligand-binding oxidases (R2lox) such as M. tuberculosis Rv0233. Their R2 scaffold is
  remodeled around a Mn/Fe cofactor into an oxidase that is not an RNR subunit.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Most members are radical-generating RNR small subunits. Three groups diverge. (1) The
  R2-like ligand-binding oxidases, PANTHER SF36 (R2-LIKE LIGAND BINDING OXIDASE), are not RNR
  subunits. (2) Fungal Rnr4 is a catalytically inactive beta' paralog. It sits in the large
  mixed subfamily SF18 together with Rnr2, bacterial NrdB/NrdF and the animal, plant and
  Dictyostelium R2s, so no subfamily boundary separates it. (3) SF21, which PANTHER names
  CAPSID PROTEIN, contains among model organisms only the uncharacterized C. elegans protein
  F54H12.2. No RNR activity is known for it. The vertebrate RRM2 (SF20) and RRM2B (SF19)
  paralogs are both active with RRM1, with lower activity for RRM2B.
