family_id: PANTHER:PTHR22969
family_name: IKB KINASE
preferred_name: IKK/TBK1-related serine-threonine kinases
summary: IKK-related kinases share protein-phosphorylation machinery but act in distinct signaling circuits.
  Canonical IKK subunits, TBK1 and IKK-epsilon differ in partners and substrates. Fly IKK-epsilon has
  direct evidence for regulation of actin turnover and polarized morphogenesis, showing that an immune-pathway-only
  family description is incomplete.
functional_coherence: HETEROGENEOUS
coherence_reason: IKK-family serine/threonine kinases have conserved kinase chemistry but different substrate
  and pathway relationships. Fly IKKepsilon regulates actin turnover, membrane ruffling and nonapoptotic
  DIAP1-dependent morphogenesis in tracheal and bristle cells (PMID:16887350). These direct fly experiments
  support a cytoskeletal signaling branch; they do not make I-kappaB phosphorylation, mammalian interferon
  induction or a single ubiquitin-pathway substrate universal across IKKalpha/beta and IKKepsilon/TBK1
  relatives.
