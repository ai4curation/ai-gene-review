    reference_id: PMID:25825430
    supporting_text: YrvO is able to transfer sulfur directly to MnmA.
  - &id002
    reference_id: PMID:31801798
    supporting_text: These results suggest direct persulfide transfer from the cysteine desulfurases to
      MnmA during s2U formation.
