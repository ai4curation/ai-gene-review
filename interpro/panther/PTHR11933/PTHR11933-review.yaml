notes: All eight original PAINT rows are preserved verbatim in the immutable raw slice. The MSA verifies
  E. coli D99/C102/C199 and Bacillus D101/C104/C200 in corresponding columns; Thermus Q72GX1 is not a
  sampled tree/MSA leaf and its three-cysteine primary result is target-specific. No universal residue-dependent
  activity rule is authored. GO0103016 and GO0061708 are sibling reactions, not interchangeable labels.
  The mite IRD and its source IBD are retained without inventing a molecular-loss explanation. Full2021
  and2024 E. coli primary studies disagree about the physiological Fe-S requirement; the critical2025
  review explicitly identifies the unresolved discrepancy. C-type Thermus biochemical cofactor dependence
  is positive evidence and is retained. No universal Fe-S-binding grant is added.
