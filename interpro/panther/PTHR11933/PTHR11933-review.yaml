    MTU1 carries the chemically distinct taurino-substrate sibling. SF5 cannot separate them, and SF6
    exact chemistry is unestablished. Exact positive members retain activity; no secondary-substrate absence
    is asserted.
  supported_by:
  - *id001
  - *id002
  - reference_id: PMID:39660893
