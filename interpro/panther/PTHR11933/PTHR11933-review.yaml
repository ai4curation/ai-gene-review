family_id: PANTHER:PTHR11933
family_name: TRNA  5-METHYLAMINOMETHYL-2-THIOURIDYLATE -METHYLTRANSFERASE
preferred_name: MnmA/TRMU tRNA-specific 2-thiouridylase family
summary: >-
  ATP-dependent PP-loop enzymes that 2-thiolate uridine 34 of tRNA(Lys),
  tRNA(Glu) and tRNA(Gln). Subfamily SF5 holds the bacterial MnmA enzymes (E.
  coli, Pseudomonas, Bacillus and others) and the mitochondrial TRMU/MTU1 (human)
  and Slm3 (yeast) enzymes; despite the family name, members are
  2-thiouridylases, not methyltransferases. The enzyme adenylates U34 and
  incorporates sulfur from a persulfide donor via two catalytic cysteines; in
  gammaproteobacteria sulfur arrives through the IscS-TusA-TusBCD-TusE relay. SF6
  (THIL AANH DOMAIN-CONTAINING PROTEIN) is a small uncharacterized group outside
  the PAINT root of the 2-thiouridylase function.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  PAINT places sulfurtransferase activity and wobble-uridine thiolation at
  PTN000232426, whose reference-tree leaves are exactly the 94 SF5 members, seeded
  by E. coli MnmA, human TRMU and yeast Slm3. Eukaryotic members are
  mitochondrial (PTN000232428). SF6 lies outside the node and has no
  characterized member.
