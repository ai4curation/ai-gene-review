family_id: PANTHER:PTHR11933
family_name: TRNA  5-METHYLAMINOMETHYL-2-THIOURIDYLATE -METHYLTRANSFERASE
preferred_name: MnmA/MTU1-related PP-loop sulfurtransferases
summary: MnmA and mitochondrial MTU1 activate tRNA wobble uridine and install sulfur at C2. Their donor
  partnerships, C5-modified substrate preferences and cofactor requirements differ. The family tree also
  contains an SF6 ThiI-AANH-like branch outside the principal MnmA/MTU1 node, so the family label does
  not establish the same reaction for all members.
functional_coherence: MOSTLY_COHERENT
coherence_reason: SF5 contains experimentally supported bacterial MnmA and mitochondrial MTU1, whereas
  the additional SF6 branch lacks a demonstrated MnmA assignment in this audit. D-type and C-type MnmAs
  share SF5; iron-sulfur dependence and compatible donors cannot be inferred from that identifier.
