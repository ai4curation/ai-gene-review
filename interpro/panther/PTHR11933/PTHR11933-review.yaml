  scope: SUBFAMILY_ONLY
  scope_reason: The original PTN000232426 assertion covers the MnmA/MTU1 SF5 clade. SF6 is outside that
    node and lacks independently established exact MnmA activity here; this is a scope limit, not a negative
    assay. Compatible donor pairing and native compartment remain target-specific.
  supported_by:
