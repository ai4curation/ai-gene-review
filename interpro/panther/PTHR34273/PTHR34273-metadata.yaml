  name:
    name: Methylthioribose Kinase
    short: Methylthioribose_kinase
  description:
  - text: The Methylthioribose Kinase Family is composed of enzymes that catalyze
      the phosphorylation of methylthioribose into methylthioribose-1-phosphate, a
      crucial step in the methionine salvage pathway. This pathway recycles by-products
      of the S-adenosylmethionine (SAM) cycle, thereby maintaining cellular methionine
      and SAM levels. Members of this family are also involved in the biosynthesis
      of psilocybin, a psychotropic compound produced by certain fungi. In this context,
      they phosphorylate 4-hydroxytryptamine to form norbaeocystin, a precursor in
      the psilocybin biosynthetic pathway. Additionally, some family members have
      been shown to possess broader substrate specificity, such as the ability to
      phosphorylate 5-deoxyribose, contributing to a salvage pathway for toxic by-products
      of radical SAM enzymes.
