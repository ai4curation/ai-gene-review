family_id: PANTHER:PTHR34273
family_name: METHYLTHIORIBOSE KINASE
preferred_name: Methylthioribose kinase (MtnK) family
summary: >-
  Aminoglycoside-phosphotransferase-fold kinases that phosphorylate 5-methylthioribose released from
  MTA by MtnN nucleosidase, a step of the bacterial and plant methionine salvage pathway (Bacillus
  MtnK). The same PANTHER subfamily includes the Psilocybe 4-hydroxytryptamine kinase PsiK of psilocybin
  synthesis.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Most Swiss-Prot members are MtnK enzymes, but SF2 also contains PsiK, which phosphorylates 4-hydroxytryptamine.
subfamilies:
- subfamily_id: PANTHER:PTHR34273:SF2
  label: METHYLTHIORIBOSE KINASE
  description: Methylthioribose kinases and PsiK.
  representative_members:
  - id: UniProtKB:A0RI39
    gene_symbol: mtnK
    organism: Bacillus thuringiensis
  - id: UniProtKB:A0A286LEZ6
    gene_symbol: psiK
    organism: Psilocybe cyanescens
  diverged_from_family: false
term_assessments:
- assessed_term:
    id: GO:0046522
    label: S-methyl-5-thioribose kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    Asserted by methionine_salvage_mta_cycle for Bacillus MtnK. SF2 also contains PsiK, a 4-hydroxytryptamine
    kinase, so the activity cannot be scoped by subfamily. No member gene review exists.
