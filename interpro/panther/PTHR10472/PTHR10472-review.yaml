family_id: PANTHER:PTHR10472
family_name: D-TYROSYL-TRNA TYR  DEACYLASE
summary: DTD-family enzymes remove inappropriate amino acids from aminoacyl-tRNAs, providing a trans-editing
  checkpoint during translation. The characterized DTD mechanism rejects L-chiral amino acids and can
  also act on glycine-charged tRNAs; tRNA identity helps distinguish productive proofreading from misediting.
  The historical D-tyrosyl name is narrower than the established substrate class.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Direct DTD structural and biochemical studies establish an invariant cross-subunit Gly-cisPro
  substrate-selection mechanism. Human DUE-B/DTD1 has an enzymatically active N-terminal core and a separable
  C-terminal DNA-binding contribution. The selected 127-residue product ends before the human reference
  Gly139-Pro140 motif, so DTD1 family identity does not establish a complete editing site in that product.
subfamilies:
- subfamily_id: PANTHER:PTHR10472:SF5
  label: D-AMINOACYL-TRNA DEACYLASE 1
  description: The human DTD1 branch includes a complete tRNA-editing protein with additional DUE-B DNA-binding
    biology. The selected short product lacks the reference Gly-cisPro motif and the later C-terminal
    material; functions assayed with longer constructs cannot be transferred indiscriminately.
