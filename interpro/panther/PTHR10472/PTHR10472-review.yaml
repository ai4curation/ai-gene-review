review_status: COMPLETE
reviewed_by: codex
review_date: '2026-09-10'
notes: A0A2R8YCT7 retains 125/127 identities to the first 127 residues of Q8TEA8 and lacks the annotated
  Gly139-Pro140 motif. This is a short-product boundary, not evidence that the intact human gene is a
  pseudoenzyme. ATD chiral-selectivity divergence is relevant structural-superfamily context, but its
  membership in this exact PANTHER family is not asserted.
term_assessments:
- assessed_term:
    id: GO:0003677
    label: DNA binding
  scope: UNRESOLVED
  scope_reason: Human DUE-B has a C-terminal DNA-binding contribution demonstrated experimentally, but
    that function is not established for all DTD proteins. The benchmark product ends before the relevant
    C-terminal portion, and its DNA binding is not established.
  supported_by:
  - reference_id: PMID:17264083
    supporting_text: 'However, this region is

      essential for DNA binding in vitro and becomes ordered in the presence of DNA.'
