- subfamily_id: PANTHER:PTHR43245:SF13
  label: UDP-D-APIOSE_UDP-D-XYLOSE SYNTHASE 2
  description: Bacterial ArnA and nucleotide-sugar epimerase/dehydratase relatives.
  diverged_from_family: true
  divergence_description: >-
    Members retain SDR-fold redox chemistry but act on nucleotide-sugar or lipid-A
    precursors rather than sterol C-4 carboxysterols.
- subfamily_id: PANTHER:PTHR43245:SF52
  label: NAD-DEPENDENT EPIMERASE_DEHYDRATASE
  description: Mycobacterial NAD-dependent epimerase/dehydratase branch.
  diverged_from_family: true
  divergence_description: >-
    This bacterial branch is outside the eukaryotic Erg26/NSDHL sterol
    decarboxylase node and is not expected to participate in sterol C-4
    demethylation.
