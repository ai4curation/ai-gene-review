family_id: PANTHER:PTHR43245
family_name: BIFUNCTIONAL POLYMYXIN RESISTANCE PROTEIN ARNA
preferred_name: Erg26/NSDHL and ArnA-like SDR dehydrogenase family
summary: >-
  PTHR43245 groups several Rossmann-fold short-chain dehydrogenase/reductase branches,
  including bacterial ArnA and nucleotide-sugar dehydratases, animal and poxvirus
  3-beta-hydroxysteroid dehydrogenases, plant 3-beta-hydroxysteroid
  dehydrogenase/decarboxylases, and fungal Erg26/animal NSDHL C-3 sterol
  dehydrogenase/C-4 decarboxylases. PAINT's exact GO:0000252 activity is correctly
  placed below the root on the eukaryotic Erg26/NSDHL-like node, and the fungal ER
  localization and Dikarya ergosterol-biosynthesis nodes agree with the reviewed
  yeast, Candida, Aspergillus and Neurospora Erg26 recipients.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The broad family shares CH-OH/NAD(P) oxidoreductase chemistry but not a single
  physiological substrate or process: bacterial branches modify nucleotide sugars or
  lipid A precursors, while eukaryotic SF51 contains sterol-pathway C-4
  decarboxylases plus other 3-beta-HSD/isomerase proteins.
