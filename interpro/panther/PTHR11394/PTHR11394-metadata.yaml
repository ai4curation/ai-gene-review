  name:
    name: Taste receptor type 2
    short: Taste_rcpt_type2
  description:
  - text: The Taste receptor type 2 family comprises G-protein coupled receptors involved
      in the perception of bitterness. These receptors are gustducin-linked and may
      play a role in sensing the chemical composition of the gastrointestinal content.
      Upon activation by bitter compounds, they signal through phospholipase C beta-2
      (PLCB2) and the calcium-regulated cation channel TRPM5. Some members are also
      implicated in airway epithelial cell functions, where they detect and help eliminate
      noxious agents by increasing intracellular calcium concentration and stimulating
      ciliary beat frequency. The family includes receptors with varying specificity
      for bitter compounds, including some that are activated by specific phytonutrients
      or synthetic sweeteners.
