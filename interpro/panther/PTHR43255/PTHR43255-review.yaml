  - reference_id: PMID:17951379
    supporting_text: Similar experiments showed that strains with mutations in the dgcAB (PA5398-PA5399)
      genes, which exhibit homology to genes that encode other enzymes with demethylase activity, are
      required for the conversion of DMG to sarcosine.
