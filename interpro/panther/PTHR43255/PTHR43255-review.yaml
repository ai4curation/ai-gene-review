review_status: COMPLETE
reviewed_by: Codex, following existing family and individual gene reviews
review_date: '2026-11-06'
notes: Reviewed for the bacterial dimethylglycine and sarcosine catabolism module. Because SF1 mixes archaeal
  heterodisulfide reductase subunits with several unrelated bacterial electron-transfer systems, the module
  does not use PTHR43255 as the grounding id of its DgcB role. Three node assessments are UNRESOLVED because
  their GlpC/GlcF seeds are classified outside this family in the current UniProt cross-references. Native
  gene disruption supports the four-gene DMG pathway; purified transfer between Csal_0991 and its proposed
  partners was not shown.
