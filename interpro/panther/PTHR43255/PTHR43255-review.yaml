family_id: PANTHER:PTHR43255
family_name: IRON-SULFUR-BINDING OXIDOREDUCTASE FADF-RELATED-RELATED
preferred_name: HdrC/FadF-like cysteine-rich iron-sulfur electron-transfer subunits
summary: 'Iron-sulfur subunits carrying ferredoxin-type [4Fe-4S] clusters and CCG (cysteine-rich, heterodisulfide
  reductase subunit C-like) domains. The family includes the archaeal heterodisulfide reductase HdrC subunits
  of methanogens and, in bacteria, larger (~650-715 residue) membrane-anchored proteins that couple soluble
  flavoenzymes to the membrane: the Syntrophomonas EtfAB:quinone oxidoreductase Swol_0698, B. subtilis
  FadF, and the dimethylglycine catabolism ferredoxins Csal_0991 of Chromohalobacter and DgcB of Pseudomonas.
  Members act as electron carriers within oxidoreductase systems rather than as stand-alone catalysts.
  For the DgcB/Csal_0991 members, pathway requirement is genetic evidence; the ordered DgcA-to-ferredoxin-to-ETF
  relay is still proposed.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: Members share electron-carrier architecture, while pathway associations differ by lineage.
  HdrC participates in archaeal heterodisulfide reductase; bacterial proteins include Etf-associated oxidoreductases
  and the DgcA-associated carrier. In the latter, donor/acceptor order is proposed from domains and genetics,
  not directly measured with purified partners.
