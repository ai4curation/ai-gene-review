  Tandem-domain CTP:phosphoethanolamine cytidylyltransferases (human PCYT2, S. cerevisiae ECT1/MUQ1,
  S. pombe SPAC15E1.05c) that make CDP-ethanolamine, the rate-limiting step of the Kennedy pathway
  to phosphatidylethanolamine.
