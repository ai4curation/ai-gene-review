  name:
    name: Intermediate filament structural protein
    short: Intermediate_filament
  description:
  - text: This family of proteins includes various types of intermediate filaments
      that play critical roles in cell structure and integrity. They are involved
      in maintaining the shape and mechanical resilience of cells, especially in muscle
      and neuronal tissues. In muscle cells, they are essential for the proper structure
      and function of sarcomeres, contributing to the strength and stability of muscle
      fibers during contraction. In neurons, they are involved in maintaining neuronal
      caliber and may cooperate with other proteins to form networks that support
      the nervous system's architecture. Some family members are also implicated in
      the stabilization of specific mRNAs and may participate in transcriptional regulation.
