notes: PANTHER 19.0 family/subfamily placement is kept distinct from reaction specificity. SF48 remains
  the selected homocitrate-synthase group. The glucosinolate module uses a MAM activity constraint across
  verified SF60 and SF73 representatives; SF73 as a whole is not assigned MAM activity. Gene-specific
  substrate loss and promiscuity remain relevant to the separate IPMS ancestral assertion.
