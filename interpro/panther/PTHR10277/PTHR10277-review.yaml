family_id: PANTHER:PTHR10277
family_name: HOMOCITRATE SYNTHASE-RELATED
preferred_name: >-
  DRE-TIM metallolyase family (homocitrate, 2-isopropylmalate, methylthioalkylmalate and citramalate
  synthases)
summary: >-
  Claisen-condensation enzymes of the DRE-TIM metallolyase superfamily, which add acetyl-CoA to a
  2-oxo acid. Subfamilies differ in the 2-oxo acid: 2-oxoglutarate for homocitrate synthase (lysine
  biosynthesis by the alpha-aminoadipate pathway: S. cerevisiae LYS20/LYS21, S. pombe lys4; SF48,
  SF63); 2-oxoisovalerate for 2-isopropylmalate synthase (leucine biosynthesis; LeuA, the largest
  subfamily, SF9); omega-methylthio-2-oxoalkanoates for plant MAM enzymes (glucosinolate chain elongation;
  SF60); and pyruvate for citramalate synthase (CimA; SF57).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The condensation chemistry is shared, but the 2-oxo acid substrate, and so the pathway served,
  is set by subfamily. No one synthase activity is safe family-wide.
