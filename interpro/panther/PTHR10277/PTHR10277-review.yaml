- assessed_term:
    id: GO:0010177
    label: methylthioalkylmalate synthase activity
  scope: UNRESOLVED
  scope_reason: MAM chemistry is established for Arabidopsis MAM1/MAM3 in SF60 and directly for Brassica
    juncea BjMAM1-A (C5J4P1; gsl-elong-A1) in SF73. The target is linked to the assayed protein by GenBank
    FM161920/CAQ56040.1 and PDB6E1J. An exclusive SF60 boundary would exclude this demonstrated enzyme;
    extending the claim to all SF73 would exceed the evidence. The exact complete subfamily/node boundary
    therefore remains unresolved. Specific experimentally characterized members remain supported, and
    functional constraints are needed when selecting from the broader family.
  supported_by:
  - reference_id: PMID:14740211
    supporting_text: MAM1, one of two similar genes in the A. thaliana ecotype Columbia, encodes a MAMS
      catalyzing the condensing reactions of the first two elongation cycles but not those of further
      cycles.
  - reference_id: PMID:31023839
    supporting_text: BjMAM1-A and BjMAM1-B were less than threefold more efficient than AtMAM1 with 5MTOP
      but were 85- to 1,140-fold more efficient with 5MTOP compared with BjMAM2-A and BjMAM2-B.
  - reference_id: file:genes/BRAJU/gsl-elong-A1/gsl-elong-A1-uniprot.txt
    supporting_text: DR   PANTHER; PTHR10277:SF73; PYRUVATE CARBOXYLTRANSFERASE DOMAIN-CONTAINING PROTEIN;
      1.
  - reference_id: file:genes/BRAJU/gsl-elong-A1/gsl-elong-A1-uniprot.txt
    supporting_text: DR   EMBL; FM161920; CAQ56040.1; -; Genomic_DNA.
