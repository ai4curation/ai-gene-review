family_id: PANTHER:PTHR19850
family_name: GUANINE NUCLEOTIDE-BINDING PROTEIN BETA  G PROTEIN BETA
preferred_name: Heterotrimeric G protein beta subunits
summary: >-
  Beta subunits of heterotrimeric G proteins: seven-bladed WD40 beta-propellers that bind
  a G gamma subunit tightly and, as the beta-gamma dimer, hold the GDP-bound alpha subunit
  in its inactive state, contact the activated receptor, and after receptor-catalysed
  nucleotide exchange on alpha dissociate to regulate effectors of their own (ion
  channels, phospholipase C-beta, adenylyl cyclase isoforms). The family covers the
  conventional vertebrate beta1-4 subunits, the divergent beta5 subunit, which pairs
  mainly with the G gamma-like domain of R7 RGS proteins and supports their GTPase-
  activating activity on Go, and single beta subunits of fungi, Dictyostelium and plants.
  Beta subunits bind no nucleotide and have no catalytic activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member is a beta-propeller scaffold of receptor-G protein signalling complexes and
  takes part in GPCR signalling, so the four terms PAINT places at the root are safe
  family-wide. The exception is the degree to which beta5 (GNB5) behaves as a conventional
  heterotrimer subunit: in cells it is found mainly in obligate dimers with RGS6, RGS7,
  RGS9 and RGS11, which do not form heterotrimers with Go or Gq alpha, although Gbeta5
  with a gamma subunit can bind Gq alpha in vitro. This makes heterotrimer membership a
  real but secondary property of beta5 rather than a loss.
