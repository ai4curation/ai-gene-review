    insect cells. A broad but true location, kept as ACCEPT or KEEP_AS_NON_CORE by the
    reviewed members.
  supported_by:
  - reference_id: PMID:10521509
    supporting_text: RGS7 with the Gbeta5 subunit (but not Gbetas 1-4) are found in the
- assessed_term:
    id: GO:0003924
    label: GTPase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    No beta subunit binds or hydrolyses GTP: nucleotide exchange and hydrolysis take place
    on the alpha subunit, and beta-gamma only stabilises alpha-GDP and supports receptor
    coupling. The GTPase rows on human beta subunits come from cloning papers or from an
    assay of stimulated GTPgammaS binding to a heterotrimer, which measures the alpha
    subunit's cycle. PAINT propagates neither GTPase activity nor G protein activity in
    this family, which is sound. The beta subunit's part in the heterotrimer's activity is
    a contribution (contributes_to G protein activity, as GNB3's core function records),
    and Gbeta5's part in RGS-catalysed GTP hydrolysis on Go alpha is a contribution to
    GTPase activator activity, not GTPase activity. GNB1, GNB2 and GNB3 REMOVE their GTPase
    rows and GNB5 MODIFIES its row, in agreement.
  supported_by:
  - reference_id: PMID:8521505
    supporting_text: alpha by beta gamma. Repeated WD motifs in beta form a circularized sevenfold
  - reference_id: PMID:1543505
    supporting_text: gamma subunits are thought to have a more passive role in G protein function
  - reference_id: PMID:10521509
    supporting_text: act as GTPase-activating proteins specifically toward Galpha(o).
