  scope_reason: >-
    The beta-propeller is a scaffold whose conserved blade cores display variable surfaces
    that contact alpha, gamma, receptor and effectors. In beta1-4 it assembles the
    receptor-heterotrimer complex; in beta5 it assembles and stabilises the R7 RGS
    complexes. The activity therefore holds across both branches, which is how the GNB1,
    GNB2, GNB4 and GNB5 reviews ACCEPT the IBA; GNB3 keeps it as non-core because its
    emphasised roles are as a transducin and Go subunit, not because the scaffold is
    absent.
