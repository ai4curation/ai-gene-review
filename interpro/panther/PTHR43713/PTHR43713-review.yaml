family_id: PANTHER:PTHR43713
family_name: GLUTAMATE-1-SEMIALDEHYDE 2,1-AMINOMUTASE
preferred_name: Glutamate-1-semialdehyde 2,1-aminomutase (HemL/GSAM) family and related class III aminotransferases
summary: >-
  A family within the class III pyridoxal 5'-phosphate (PLP)-dependent aminotransferase
  fold. Its dominant members are glutamate-1-semialdehyde 2,1-aminomutases (GSAM, HemL;
  EC 5.4.3.8), which complete the C5 route to 5-aminolevulinate by moving the C2 amino
  group of glutamate 1-semialdehyde to C1 through a 4,5-diaminovalerate intermediate,
  without an external amino donor. GSAM is found in bacteria, archaea and plant and algal
  plastids and works with glutamyl-tRNA reductase (PTHR43013). The family also contains
  true transaminases recruited to other pathways, which PANTHER places in the same
  subfamily (SF3) as most GSAMs: aminoglycoside 6'-oxoglucosaminyl:L-glutamate
  aminotransferases of neomycin, butirosin and kanamycin biosynthesis, a 3-aminobutyryl-CoA
  aminotransferase of lysine fermentation, the fumonisin-degrading aminopentol
  aminotransferase FumI and a beta-phenylalanine aminotransferase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  PLP-dependent class III aminotransferase chemistry is family-wide and most members are
  GSAMs, but SF3 also holds characterized intermolecular aminotransferases with unrelated
  substrates (neamine-forming aminoglycoside transaminases, 3-aminobutyryl-CoA
  aminotransferase, FumI, beta-phenylalanine aminotransferase) and uncharacterized paralogs
  such as S. pombe SPCC417.11c, which PANTHER does not separate from the GSAM clades.
