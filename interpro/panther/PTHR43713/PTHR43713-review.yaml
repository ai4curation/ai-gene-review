notes: >-
  Tree structure from the PANTHER 19 treeinfo service: the root PTN000241365 (LUCA, 115
  leaves; 109 SF3, 4 SF1, 2 SF6) carries the PLP-binding and isomerase assertions;
  PTN000241400 is a 15-leaf proteobacterial GSAM clade; PTN005178622 is the 60-leaf
  Viridiplantae clade. Non-GSAM leaves in the tree include S. pombe SPCC417.11c (O94492),
  Streptomyces coelicolor SCO0401, two Nitrosopumilus class III aminotransferases and
  P. aeruginosa PA5523. The aminoglycoside, lysine-fermentation, fumonisin and
  beta-phenylalanine aminotransferases are Swiss-Prot SF3 members that are not tree
  leaves. The GSAM activity is therefore left UNRESOLVED at family level, and the module
  that uses this family grounds its GSAM step on the PTN000241400 node.
