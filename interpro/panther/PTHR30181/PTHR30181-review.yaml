family_id: PANTHER:PTHR30181
family_name: MANNITOL PERMEASE IIC COMPONENT
preferred_name: Mannitol-type PTS Enzyme II components and the enterobacterial fructose FPr protein
summary: >-
  PANTHER groups bacterial phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS)
  proteins that share a type-2 (mannitol/fructose-type) EIIA domain. Most members are mannitol
  Enzyme II proteins: EIICBA permeases such as E. coli MtlA, split EIICB permeases, and soluble
  EIIA-only MtlF proteins of Firmicutes and Mollicutes. The family also contains FPr (FruB) of
  Enterobacteriaceae, Pasteurellaceae and Vibrionaceae, a soluble EIIA(Fru)-M-HPr fusion that is
  phosphorylated by enzyme I and donates phosphate to the fructose permease FruA. Members are thus
  united by the EIIA relay step, while EIIB, EIIC and HPr-like regions are present or absent by
  lineage.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Every member takes part in the PEP-dependent sugar PTS, but domain content and sugar
  specificity differ. Mannitol permeases carry EIIB and EIIC domains and catalyse transport of
  mannitol; MtlF and FPr have no EIIB or EIIC domain and move no sugar themselves; FPr serves the
  fructose system and carries an HPr-like domain absent from the mannitol proteins. SF3 is named
  for the multiphosphoryl transfer protein but also contains the Mycoplasma pneumoniae EIICB
  protein P75146, so the subfamily name does not define domain content.
