    supporting_text: In contrast to classical PTS systems, the fructose-specific PTS has no requirement for HPr; FruB combines a IIA domain with a HPr domain.
  - reference_id: PMID:7006754
    supporting_text: A protein that substitutes for histidine-containing protein (HPr) in the phosphoenolpyruvate, fructose phosphotransferase system has been found in Escherichia coli grown on fructose.
  - reference_id: file:interpro/panther/PTHR30181/PTHR30181-entries.csv
