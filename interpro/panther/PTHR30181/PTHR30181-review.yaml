  label: MULTIPHOSPHORYL TRANSFER PROTEIN
  description: >-
    Proteobacterial FPr (FruB) proteins of E. coli, Salmonella, Haemophilus and Vibrio, which fuse
    a fructose-type EIIA domain to an HPr-like domain and lack enzyme I, EIIB and EIIC regions.
    The subfamily also contains the Mycoplasma pneumoniae EIICB protein P75146, so EIIB-dependent
    terms cannot be ruled in or out from subfamily membership alone.
  representative_members:
