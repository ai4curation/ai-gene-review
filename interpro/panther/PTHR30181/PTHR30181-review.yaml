  - id: UniProtKB:P17127
    label: Multiphosphoryl transfer protein
    gene_symbol: fruB
    organism: Salmonella typhimurium LT2
  diverged_from_family: true
  divergence_description: >-
    FPr members have diverged from the mannitol permease role: they act in the fructose PTS as
    HPr substitutes and EIIA donors to FruA, rather than as mannitol transporters.
  supported_by:
