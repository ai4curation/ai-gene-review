notes: >-
  Reviewed for the fructose PTS uptake module, where FPr (SF3) is the EIIA(Fru)-HPr partner of
  standalone enzyme I in the split relay of Enterobacteriaceae. The mannitol branch was not
  reviewed at gene level. Family membership identifies a type-2 EIIA relay domain only; it does not
  establish sugar specificity, EIIB/EIIC content or an HPr-like domain.
