  name:
    name: Sugar Phosphotransferase System (PTS)
    short: Sugar_PTS
  description:
  - text: The Phosphoenolpyruvate-dependent Sugar Phosphotransferase System (sugar
      PTS) is a major carbohydrate active transport system that catalyzes the phosphorylation
      of incoming sugar substrates concomitantly with their translocation across the
      cell membrane. The PTS consists of several components, including the EIIC type-2
      domain which forms the translocation channel and contains the substrate-binding
      site, the EIIA type-2 domain which is phosphorylated by phospho-HPr on a histidine
      residue and transfers the phosphoryl group to the EIIB type-2 domain, and the
      EIIB type-2 domain which is phosphorylated by phospho-EIIA on a cysteine residue
      and transfers the phosphoryl group to the sugar substrate. The family is involved
      in the transport of specific sugars such as D-mannitol and fructose, with some
      variations in the requirement for HPr among different systems.
