        supporting_text: Catalyzes the NAD(+)-dependent oxidation of L-carnitine to 3-
      - reference_id: file:genes/RHIME/bcoE-bcoF/bcoE-bcoF-uniprot.txt
        supporting_text: Multifunctional enzyme that catalyzes the NAD(+)-dependent
  - assessed_term:
      id: GO:0006631
      label: fatty acid metabolic process
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      This term is not a PAINT node assertion for this family: it reaches
      members through the InterPro2GO mapping of the 3-hydroxyacyl-CoA
      dehydrogenase domains IPR006108/IPR006176/IPR022694. The mapping fits the
      acyl-CoA dehydrogenases but not the L-carnitine dehydrogenases, whose
      substrate is a free quaternary-amine hydroxy acid; the cdhA, lcdH and
      bcoE-bcoF reviews therefore remove the row and record the mapping as a
      source defect against InterPro. Listed for SF9 (FadB2); within SF5 it
      applies only to the acyl-CoA members, not to the carnitine clade.
    supported_by:
      - reference_id: file:genes/PSEAE/cdhA/cdhA-ai-review.yaml
        supporting_text: >-
          InterPro2GO maps IPR006108/IPR006176/IPR022694 (3-hydroxyacyl-CoA
          dehydrogenase domains) to fatty acid metabolic process. The L-carnitine
          dehydrogenase subfamily (IPR026578, HAMAP MF_02129) shares these
          domains but does not act on fatty acids; the InterPro mapping should
          exclude it.
      - reference_id: file:genes/PSEAE/cdhA/cdhA-uniprot.txt
        supporting_text: >-
          D,L-3- hydroxybutyrate, L-lactate, ethanol, L-malate and
          D,L-isocitrate are not substrates (PubMed:4302217).
    applicable_subfamilies:
      - id: PANTHER:PTHR48075:SF9
        label: 3-HYDROXYBUTYRYL-COA DEHYDROGENASE
