        supporting_text: Q9Y2S2,Lambda-crystallin homolog,protein
  - subfamily_id: PANTHER:PTHR48075:SF9
    label: 3-HYDROXYBUTYRYL-COA DEHYDROGENASE
    description: Mycobacterial FadB2 3-hydroxybutyryl-CoA dehydrogenases.
    representative_members:
      - id: UniProtKB:P9WNP7
        label: 3-hydroxybutyryl-CoA dehydrogenase
        gene_symbol: fadB2
        organism: Mycobacterium tuberculosis H37Rv
    diverged_from_family: false
    supported_by:
      - reference_id: file:interpro/panther/PTHR48075/PTHR48075-entries.csv
        supporting_text: P9WNP7,3-hydroxybutyryl-CoA dehydrogenase,protein
