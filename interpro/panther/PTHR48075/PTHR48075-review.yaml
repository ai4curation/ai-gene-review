- assessed_term:
    id: GO:0047728
    label: carnitine 3-dehydrogenase activity
  scope: UNRESOLVED
  scope_reason: Named CdhA/LcdH and fused BcoEF proteins support carnitine 3-dehydrogenase chemistry,
    but mixed SF5 also includes acyl-CoA dehydrogenases. No whole-SF5 grant is justified and no residue-defined
    universal selector is established. Preserve member-level curated chemistry, orthology and primary
    construct boundaries; the fusion has additional thioesterase reactions.
  supported_by:
