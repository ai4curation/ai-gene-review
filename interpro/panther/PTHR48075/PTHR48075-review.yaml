  assessment: UNRESOLVED
  assessment_reason: 'Seeded by E. coli PaaH (SF5) and M. tuberculosis FadB2 (SF9). The L-carnitine dehydrogenases
    of SF5 (P. aeruginosa CdhA, P. putida LcdH, S. meliloti BcoE-BcoF) carry no GO:0008691 IBA in GOA,
    so the node does not include the carnitine clade and the acyl-CoA activity is not propagated to it.
    The node (PTHR48075:AN269; TreeGrafter subfamily SF5) is a reasonable place for a CoA-substrate 3-hydroxyacyl-CoA
    dehydrogenase activity, but the asserted term is a poor fit for its seeds. GO:0008691 is defined with
    NADP+ as acceptor, whereas E. coli PaaH is NAD+-dependent and acts on (S)-3-hydroxyadipyl-CoA (PMID:20660314;
    UniProt reaction RHEA:34851), and M. tuberculosis FadB2 conserves the NAD+-binding residues of human
    mitochondrial HAD (PMID:30644849). The better-supported term is GO:0003857 (3S)-3-hydroxyacyl-CoA
    dehydrogenase (NAD+) activity, which is how the E. coli paaH review MODIFYs both its IDA and IBA rows.
    The clade also likely includes L-carnitine dehydrogenases of SF5, for which a 3-hydroxyacyl-CoA activity
    would not hold; that could not be resolved without the tree. Merge reconciliation: UNRESOLVED from
    the phenylacetate review is kept over SOUND. GO:0008691 is defined with NADP+ and 3-hydroxybutanoyl-CoA,
    but the seed E. coli PaaH was assayed with NAD+ and 3-hydroxyadipyl-CoA (the E. coli paaH review modifies
    this term to GO:0003857). The fatty-acid review''s point that the node does not reach the carnitine
    dehydrogenases is retained.'
