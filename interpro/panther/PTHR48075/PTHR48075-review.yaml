notes: >-
  PANTHER uses the identical name "3-HYDROXYBUTYRYL-COA DEHYDROGENASE" for two subfamilies (SF5
  and SF9); they are distinguished here by accession. Node mapping from PANTHER's
  PAINT_TreeGrafter_Annotations_TOTAL.txt (paint/current, 2026-10-23): PTN002455225 =
  PTHR48075:AN0 (root), PTN000592731 = AN7 (SF1), PTN008732775 = AN269 (SF5). Subfamilies SF3,
  SF7 and SF10 carry no PAINT rows and are not described. Module use: phenylacetate_catabolism
  grounds PaaH on GO:0003857, which this review scopes SUBFAMILY_ONLY (SF5, SF9). Because SF5 is
  substrate-mixed, the module selects the PaaH step with the paa-specific NCBIfam model
  NCBIfam:TIGR02279 rather than with SF5 or the bare family. The PaaH IDA row for GO:0008691 (from PMID:20660314) is
  questionable because that paper assayed 3-hydroxyadipyl-CoA with NAD+, not 3-hydroxybutyryl-CoA
  with NADP+.
