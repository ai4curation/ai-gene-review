term_assessments:
  - assessed_term:
      id: GO:0047728
      label: carnitine 3-dehydrogenase activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Only the L-carnitine dehydrogenase members of SF5 (stand-alone CdhA/LcdH
      and bifunctional CdhAB/BcoE-BcoF). SF5 also contains Hbd and PaaH, so the
      term needs member-level evidence (EC 1.1.1.108, HAMAP MF_02129, locus
      context) and must not be propagated subfamily-wide.
    applicable_subfamilies:
      - id: PANTHER:PTHR48075:SF5
        label: 3-HYDROXYBUTYRYL-COA DEHYDROGENASE
    supported_by:
