family_id: PANTHER:PTHR48075
family_name: 3-HYDROXYACYL-COA DEHYDROGENASE FAMILY PROTEIN
preferred_name: 3-Hydroxyacyl-CoA dehydrogenase family (PaaH, Hbd, FadB2, L-carnitine and L-gulonate dehydrogenases)
summary: >-
  NAD(P)-dependent dehydrogenases with an N-terminal Rossmann-fold NAD-binding domain (3HCDH_N)
  and a helical C-terminal 3HCDH dimerization domain. The family's classical activity is the
  NAD+-dependent oxidation of (S)-3-hydroxyacyl-CoA to 3-oxoacyl-CoA: E. coli PaaH oxidizes
  (S)-3-hydroxyadipyl-CoA to 3-oxoadipyl-CoA in the beta-oxidation-like lower part of aerobic
  phenylacetate catabolism; clostridial and bacillar Hbd/MmgB act on 3-hydroxybutyryl-CoA in
  butyrate/butanol fermentation; M. tuberculosis FadB2 is an L-3-hydroxyacyl-CoA dehydrogenase
  implicated in beta-oxidation. Other branches have moved to non-CoA substrates: lambda-crystallin
  (CRYL1) is the uronate-cycle L-gulonate 3-dehydrogenase recruited as a lens crystallin, and a
  large bacterial group in the same PANTHER subfamily as PaaH is annotated as L-carnitine
  dehydrogenases (some fused to betainyl-CoA thioesterase).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  NAD(P)+-dependent secondary-alcohol oxidation in the 3-hydroxyacyl-CoA dehydrogenase fold is
  shared, but substrate and pathway diverge sharply: (S)-3-hydroxyadipyl-CoA (PaaH, phenylacetate
  catabolism), 3-hydroxybutyryl-CoA (Hbd, fermentation), longer 3-hydroxyacyl-CoAs (FadB2,
  beta-oxidation), L-gulonate (CRYL1, SF1, uronate cycle) and L-carnitine (bacterial L-carnitine
  dehydrogenases, classified in SF5 together with PaaH and Hbd). Subfamily SF5 is itself
  substrate-mixed, so neither a CoA-substrate activity nor a pathway term is safe family-wide, and
  even subfamily-scoped activity terms need member-level confirmation.
