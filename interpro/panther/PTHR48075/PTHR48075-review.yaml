  - reference_id: file:genes/RHIME/bcoE-bcoF/bcoE-bcoF-uniprot.txt
    supporting_text: Multifunctional enzyme that catalyzes the NAD(+)-dependent
- assessed_term:
    id: GO:0006631
    label: fatty acid metabolic process
  scope: UNRESOLVED
  scope_reason: Positive fatty-acid metabolism of appropriate acyl-CoA enzymes is retained, but the mixed
    family/domain assignment alone cannot establish that physiological process for a carnitine enzyme.
    Conversely, a different native substrate is not a universal negative substrate assay. The observed
    PAO1 substrate exclusions and target-specific gene judgments must not be extrapolated to every SF5
    or SF9 member. Exact process scope remains unresolved.
  supported_by:
  - reference_id: file:genes/PSEAE/cdhA/cdhA-uniprot.txt
    supporting_text: D,L-3- hydroxybutyrate, L-lactate, ethanol, L-malate and D,L-isocitrate are not substrates
      (PubMed:4302217).
  - reference_id: file:analysis/module_audits/bacterial_l_carnitine_catabolism/family-consultation/evidence.md
    supporting_text: PaaH's alternative physiological pathway alone does not disprove secondary fatty-acid
      chemistry, so the native beta-oxidation node scope stays unresolved.
- assessed_term:
    id: GO:0003857
    label: (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity
  scope: UNRESOLVED
  scope_reason: 'Positive named-member evidence supports Bacillus FadN O32178: curated reaction, NAD/dehydrogenase
    domains and native yusL palmitate genetics. The additional hydratase domain is not itself a target
    hydration assay. Neither this member nor the SF7 label establishes the substrate and reaction for
    every SF7 member, much less the mixed carnitine/gulonate/acyl-CoA family. No new exact-reaction PAINT
    node is inferred from the broad PTN002455225 oxidoreductase assertion.'
  supported_by:
  - reference_id: file:genes/BACSU/fadN/fadN-uniprot.txt
    supporting_text: Reaction=a (3S)-3-hydroxyacyl-CoA + NAD(+) = a 3-oxoacyl-CoA + NADH + H(+);
  - reference_id: file:genes/BACSU/fadE/fadE-source-analysis/primary-scope.md
    supporting_text: IPTG induces downstream genes to mitigate insertion polarity.
