- node_id: PANTHER:PTN008732775
  asserted_term:
    id: GO:0006635
    label: fatty acid beta-oxidation
  evidence: IBD
  negated: false
  paint_snapshot: '20220311'
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  seeds:
  - id: UniProtKB:P9WNP7
  assessment: TOO_DEEP
  assessment_reason: 'The only seed is M. tuberculosis FadB2, and the node also covers E. coli PaaH, whose
    characterized role is phenylacetate catabolism (3-hydroxyadipyl-CoA oxidation) rather than fatty acid
    beta-oxidation. Adjudicating the placement needs the PANTHER tree topology below the node and in vivo
    evidence on which acyl-CoAs the non-seed members oxidize. The node does not reach the carnitine dehydrogenases,
    so the module is not affected. The only seed is M. tuberculosis FadB2 (SF9), implicated in mycobacterial
    beta-oxidation (PMID:30644849). The node, however, also covers the SF5 PaaH clade, whose members perform
    the analogous dehydrogenation on (S)-3-hydroxyadipyl-CoA, a ring-derived dicarboxylyl-CoA of phenylacetate
    catabolism, not on fatty acyl-CoA; E. coli fatty acid beta-oxidation uses FadB/FadJ. SF5 also contains
    fermentative 3-hydroxybutyryl-CoA dehydrogenases (Hbd) and L-carnitine dehydrogenases, neither of
    which acts in fatty acid beta-oxidation. The process arose on (or is evidenced only for) the FadB2
    branch, so the term should sit there. This agrees with the E. coli paaH review, which marks the inherited
    IBA as over-annotated. Merge reconciliation: TOO_DEEP for the SF5 PaaH branch is kept. The only seed
    is M. tuberculosis FadB2 (SF9); E. coli PaaH, which the node covers, acts in phenylacetate catabolism.
    The SF9 FadB2 branch keeps the term.'
