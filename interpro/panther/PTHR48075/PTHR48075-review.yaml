      MmgB), 3-hydroxyadipyl-CoA dehydrogenase PaaH, and L-carnitine
      dehydrogenases, including bifunctional dehydrogenase-thioesterases.
    representative_members:
      - id: UniProtKB:Q9HTH8
        label: L-carnitine dehydrogenase
        gene_symbol: cdhA
        organism: Pseudomonas aeruginosa PAO1
        gene_review: genes/PSEAE/cdhA/cdhA-ai-review.yaml
      - id: UniProtKB:Q88R32
        label: L-carnitine dehydrogenase
        gene_symbol: lcdH
        organism: Pseudomonas putida KT2440
        gene_review: genes/PSEPK/lcdH/lcdH-ai-review.yaml
      - id: UniProtKB:Q92NF5
        label: L-carnitine dehydrogenase/betainyl-CoA thioesterase
        gene_symbol: bcoE-bcoF
        organism: Sinorhizobium meliloti 1021
        gene_review: genes/RHIME/bcoE-bcoF/bcoE-bcoF-ai-review.yaml
      - id: UniProtKB:P76083
        label: 3-hydroxyadipyl-CoA dehydrogenase
        gene_symbol: paaH
        organism: Escherichia coli K-12
    diverged_from_family: true
    divergence_description: >-
      The L-carnitine dehydrogenases act on a free hydroxy acid rather than an
      acyl-CoA thioester and are specific for L-carnitine; they sit in the same
      subfamily as the 3-hydroxyacyl-CoA dehydrogenases Hbd and PaaH. Carnitine
      3-dehydrogenase activity is therefore not safe subfamily-wide and needs
      member-level evidence (EC 1.1.1.108, HAMAP MF_02129, carnitine locus).
    supported_by:
      - reference_id: file:interpro/panther/PTHR48075/PTHR48075-entries.csv
        supporting_text: Q9HTH8,L-carnitine dehydrogenase,protein
      - reference_id: file:interpro/panther/PTHR48075/PTHR48075-entries.csv
        supporting_text: P76083,3-hydroxyadipyl-CoA dehydrogenase,protein
      - reference_id: PMID:3058208
        supporting_text: the carnitine dehydrogenase is specific for L-carnitine and NAD+
  - subfamily_id: PANTHER:PTHR48075:SF1
    label: LAMBDA-CRYSTALLIN HOMOLOG
    description: Animal lambda-crystallins, which act as L-gulonate 3-dehydrogenases.
    representative_members:
      - id: UniProtKB:Q9Y2S2
