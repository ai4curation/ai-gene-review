family_id: PANTHER:PTHR48075
family_name: 3-HYDROXYACYL-COA DEHYDROGENASE FAMILY PROTEIN
preferred_name: 3-Hydroxyacyl-CoA dehydrogenase family (L-carnitine dehydrogenase, Hbd/PaaH, lambda-crystallin)
summary: >-
  NAD-dependent dehydrogenases with the 3-hydroxyacyl-CoA dehydrogenase
  N-terminal NAD-binding (3HCDH_N) and C-terminal (3HCDH) domains. The reviewed
  members fall into three functional groups. SF5 mixes bacterial
  3-hydroxybutyryl-CoA dehydrogenases (Clostridium Hbd, Bacillus MmgB), the
  3-hydroxyadipyl-CoA dehydrogenase PaaH of phenylacetate catabolism, and
  L-carnitine dehydrogenases (EC 1.1.1.108), some of which (Rhizobiales and
  Roseobacter CdhAB/BcoE-BcoF) carry a C-terminal betainyl-CoA thioesterase
  region. SF9 holds mycobacterial FadB2. SF1 holds the animal lambda-crystallins
  (L-gulonate 3-dehydrogenase), and SF7 and SF3 hold further acyl-CoA
  dehydrogenase-like proteins.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Every characterized member is an NAD-dependent oxidoreductase acting on a
  CH-OH group, but the substrate differs between and within subfamilies: acyl-CoA
  thioesters (Hbd, PaaH, FadB2), the free quaternary-amine acid L-carnitine
  (CdhA/LcdH), and L-gulonate (lambda-crystallin). SF5 itself contains both
  3-hydroxyacyl-CoA dehydrogenases and L-carnitine dehydrogenases, so neither
  the carnitine nor the acyl-CoA substrate transfers from the subfamily label.
reference_protein:
  id: UniProtKB:Q9HTH8
  label: L-carnitine dehydrogenase
  gene_symbol: cdhA
  organism: Pseudomonas aeruginosa PAO1
  gene_review: genes/PSEAE/cdhA/cdhA-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR48075:SF5
    label: 3-HYDROXYBUTYRYL-COA DEHYDROGENASE
    description: >-
