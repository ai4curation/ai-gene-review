- assessed_term:
    id: GO:0003857
    label: (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity
  scope: UNRESOLVED
  scope_reason: 'UNRESOLVED. The activity is established for named members (PaaH in SF5, FadB2 in SF9,
    FadN in SF7), but SF5 also holds the L-carnitine dehydrogenases, so no subfamily grant is safe. Positive
    named-member evidence supports Bacillus FadN O32178: curated reaction, NAD/dehydrogenase domains and
    native yusL palmitate genetics. The additional hydratase domain is not itself a target hydration assay.
    Neither this member nor the SF7 label establishes the substrate and reaction for every SF7 member,
    much less the mixed carnitine/gulonate/acyl-CoA family. No new exact-reaction PAINT node is inferred
    from the broad PTN002455225 oxidoreductase assertion. Established for PaaH (SF5; NAD+, (S)-3-hydroxyadipyl-CoA)
    and consistent with FadB2 (SF9). Not applicable to the L-gulonate 3-dehydrogenases (SF1). SF5 also
    contains bacterial L-carnitine dehydrogenases, so within SF5 the term should be confirmed per member
    rather than inherited. Merge reconciliation: UNRESOLVED from the fatty-acid review is kept. SF5 also
    holds the L-carnitine dehydrogenases, so the branch''s SF5/SF9 SUBFAMILY_ONLY grant would over-reach.
    The phenylacetate module no longer selects this family for PaaH; it uses NCBIfam TIGR02279.'
