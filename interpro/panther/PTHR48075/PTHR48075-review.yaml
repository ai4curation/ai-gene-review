- node_id: PANTHER:PTN008732775
  asserted_term:
    id: GO:0008691
    label: 3-hydroxybutyryl-CoA dehydrogenase activity
  evidence: IBD
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  paint_snapshot: '20220311'
  seeds:
  - id: UniProtKB:P76083
    label: paaH
    organism: Escherichia coli (strain K12)
  - id: UniProtKB:P9WNP7
    label: fadB2
    organism: Mycobacterium tuberculosis H37Rv
  assessment: UNRESOLVED
  assessment_reason: >-
    The node (PTHR48075:AN269; TreeGrafter subfamily SF5) is a reasonable place for a CoA-substrate
    3-hydroxyacyl-CoA dehydrogenase activity, but the asserted term is a poor fit for its seeds.
    GO:0008691 is defined with NADP+ as acceptor, whereas E. coli PaaH is NAD+-dependent and acts
    on (S)-3-hydroxyadipyl-CoA (PMID:20660314; UniProt reaction RHEA:34851), and M. tuberculosis
    FadB2 conserves the NAD+-binding residues of human mitochondrial HAD (PMID:30644849). The
    better-supported term is GO:0003857 (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity,
    which is how the E. coli paaH review MODIFYs both its IDA and IBA rows. The clade also likely
    includes L-carnitine dehydrogenases of SF5, for which a 3-hydroxyacyl-CoA activity would not
    hold; that could not be resolved without the tree.
  supported_by:
  - reference_id: file:interpro/panther/PTHR48075/PTHR48075-paint.tsv
    supporting_text: "PTHR48075\tPTN008732775\tGO:0008691\tF\tIBD\tfalse\tUniProtKB:P76083|UniProtKB:P9WNP7\ttaxon:2"
  - reference_id: PMID:20660314
    supporting_text: >-
      PaaH therefore functioned as an NAD + -dependent [probably ( S )-3–specific]
      3-hydroxyadipyl-CoA dehydrogenase forming 3-oxoadipyl-CoA
  - reference_id: PMID:30644849
    supporting_text: >-
      Both of these residues are juxtaposed with the nicotinamide group of NAD+, indicating the
      catalytic centre of the enzyme.
- node_id: PANTHER:PTN008732775
  asserted_term:
    id: GO:0006635
    label: fatty acid beta-oxidation
  evidence: IBD
  node_taxon:
    id: NCBITaxon:2
    label: Bacteria
  paint_snapshot: '20220311'
  seeds:
  - id: UniProtKB:P9WNP7
    label: fadB2
    organism: Mycobacterium tuberculosis H37Rv
  assessment: TOO_DEEP
  assessment_reason: >-
    The only seed is M. tuberculosis FadB2 (SF9), implicated in mycobacterial beta-oxidation
    (PMID:30644849). The node, however, also covers the SF5 PaaH clade, whose members perform the
    analogous dehydrogenation on (S)-3-hydroxyadipyl-CoA, a ring-derived dicarboxylyl-CoA of
    phenylacetate catabolism, not on fatty acyl-CoA; E. coli fatty acid beta-oxidation uses
    FadB/FadJ. SF5 also contains fermentative 3-hydroxybutyryl-CoA dehydrogenases (Hbd) and
    L-carnitine dehydrogenases, neither of which acts in fatty acid beta-oxidation. The process
    arose on (or is evidenced only for) the FadB2 branch, so the term should sit there. This agrees
    with the E. coli paaH review, which marks the inherited IBA as over-annotated.
