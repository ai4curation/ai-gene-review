notes: '2026-11-11 reconciliation retains both reviews'' source evidence and incoming PaaH membership.
  The verified SF1 topology includes nonanimal homologs; an animal-only label is not a taxonomic boundary.
  The exact GO:0008691 cofactor/substrate assignment is UNRESOLVED because the incoming primary PaaH experiment
  measured NAD+-dependent 3-hydroxyadipyl-CoA oxidation. Native beta-oxidation has positive SF9/SF7 scope,
  while placement at the mixed PTN008732775 remains UNRESOLVED: a different characterized physiological
  role alone is not an assay excluding secondary participation. PAO1 CdhA is outside that node; KT2440
  and RHIME accessions are absent from the snapshot. The phenylacetate module uses the PaaH-specific NCBIfam
  selector, and GO:0003857 remains unsafe as a family-wide or mixed-SF5 grant. No source PAINT assertion,
  seed, snapshot or node identity was rewritten.'
