  assessment_reason: >-
    PTN002476593 is the single human SLC23A1 leaf. SLC23A1 is SVCT1, the sodium-dependent vitamin C transporter:
    expressed in HRPE cells it transports ascorbate in a sodium-dependent, electrogenic manner with 2:1
    sodium:ascorbate stoichiometry (PMID:10556483), and UniProt lists seven further IDA/EXP rows for this
    activity. The loss is contradicted.
