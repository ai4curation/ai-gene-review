family_id: PANTHER:PTHR11119
family_name: XANTHINE-URACIL / VITAMIN C PERMEASE FAMILY MEMBER
preferred_name: Nucleobase-ascorbate transporter family (SLC23)
summary: >-
  PTHR11119 contains the nucleobase-ascorbate transporters, including the bacterial and fungal xanthine
  and uracil permeases and the vertebrate sodium-dependent vitamin C transporters SVCT1 (SLC23A1) and
  SVCT2 (SLC23A2).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All are secondary transporters of the same fold; vertebrate SVCTs carry ascorbate with sodium while
  other members carry nucleobases.
