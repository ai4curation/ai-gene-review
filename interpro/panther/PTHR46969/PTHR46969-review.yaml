family_id: PANTHER:PTHR46969
family_name: BIFUNCTIONAL PROTEIN HLDE
summary: 'HldE, the enzyme that carries both middle steps of ADP-heptose synthesis: an N-terminal PfkB-family
  kinase domain that phosphorylates D-glycero-beta-D-manno-heptose 7-phosphate at C-1, and a C-terminal
  cytidylyltransferase-fold domain that adenylylates the resulting 1-phosphate. The two activities are
  fused in most bacteria and split between separate HldA and HldC proteins in Neisseria and some beta-proteobacteria.
  The family is functionally uniform for these heptose activities.'
functional_coherence: COHERENT
coherence_reason: A single subfamily carrying the family name, with the kinase and adenylyltransferase
  activities seeded on one node by the characterized E. coli HldE; no divergent functional group is apparent.
