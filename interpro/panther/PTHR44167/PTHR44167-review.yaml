family_id: PANTHER:PTHR44167
family_name: OVARIAN-SPECIFIC SERINE/THREONINE-PROTEIN KINASE LOK-RELATED
preferred_name: Diverse checkpoint, replication and signaling kinases
summary: This broad kinase group includes CHK2/Cds1, CDC7, viral and microbial kinases, and probable inactive
  kinase-like proteins. Shared kinase architecture does not unify the regulated biological processes.
functional_coherence: HETEROGENEOUS
coherence_reason: The Paramecium target's kinase-domain evidence supports a phosphorylation hypothesis,
  but autophagy, checkpoint signaling and DNA-replication initiation belong to different branches. The
  retrieved inactive kinase-like members prevent assuming that every detected homolog executes protein
  phosphorylation.
