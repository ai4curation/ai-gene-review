notes: 'PARTE/A0BFB4: requested accession A0BFB4; current record A0BFB4; sequence length 381; source cohort
  ARGO50. Family boundaries were assessed using the fetched member set and the cited domain, literature
  and analytical evidence. Gene-review verdicts and ARBA assertions are not independent validation. PANTHER
  subfamily labels and membership are recorded from the frozen UniProt records and panther.obo; they do
  not by themselves prove functional uniformity within a subfamily. Focused 2026-09-20 update: the actual
  PTHR24348 PAINT topology was inspected and places A0BFB4 below PTN000681272; retained lineage and accession
  mapping are in the cited snapshot. This resolves target descent and supports its four autophagy annotations.
  It does not establish a family-wide autophagy grant or justify repointing the independently verified
  PTHR44167 HMM identifier. Other family branches were not newly reviewed in this focused update. No residue
  requirement is encoded without a verified sequence-version anchor. A target-level refutation is not
  a family-wide NOT_APPLICABLE judgment. Exact protein-name-only predictions are treated as family-identification
  hypotheses rather than invented GO predictions.'
