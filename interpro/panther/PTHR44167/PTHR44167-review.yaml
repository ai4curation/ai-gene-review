family_id: PANTHER:PTHR44167
family_name: OVARIAN-SPECIFIC SERINE/THREONINE-PROTEIN KINASE LOK-RELATED
preferred_name: Diverse checkpoint, replication and signaling kinases
summary: This broad sequence-classifier group includes CHK2/Cds1, CDC7, viral and microbial kinases, and
  probable inactive kinase-like proteins. Shared kinase architecture does not unify the regulated biological
  processes. A0BFB4 retains a verified PTHR44167:SF18 sequence classification, while its actual PAINT
  tree places it in the distinct UNC-51-related family PTHR24348 below an autophagy-bearing ancestor;
  these resources require reconciliation.
functional_coherence: HETEROGENEOUS
coherence_reason: Catalytically competent members support protein phosphorylation, but the broad sequence-classifier
  group also contains divergent and probable inactive kinase-like proteins. Checkpoint, replication and
  autophagy functions cannot be assigned uniformly. For A0BFB4, however, inspected descent from PAINT
  ancestor PTN000681272 supports inherited autophagy; the differing PTHR44167 HMM assignment and compact
  architecture are not evidence of functional loss.
subfamilies:
- subfamily_id: PANTHER:PTHR44167:SF18
  label: PROTEIN KINASE DOMAIN-CONTAINING PROTEIN
  description: Current UniProt, InterPro and the local PANTHER membership index assign A0BFB4 to PTHR44167:SF18.
    This verified sequence-classifier placement is retained. The actual PAINT tree instead explicitly
    contains A0BFB4/GSPATT00028266001 as leaf PTN002805316 in PTHR24348:SF22, descending from autophagy
    ancestor PTN000681272. Thus this sequence-family record cannot be used to reject the target's inherited
    autophagy annotations; the cross-resource family discrepancy remains under focused adjudication.
  representative_members:
  - id: UniProtKB:A0BFB4
    gene_symbol: A0BFB4
    organism: Paramecium tetraurelia
    gene_review: genes/PARTE/A0BFB4/A0BFB4-ai-review.yaml
