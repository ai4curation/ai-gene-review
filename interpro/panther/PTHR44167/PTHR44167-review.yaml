    supporting_text: DR   InterPro; IPR017441; Protein_kinase_ATP_BS.
  - reference_id: file:genes/PARTE/A0BFB4/A0BFB4-uniprot.txt
    supporting_text: DR   InterPro; IPR008271; Ser/Thr_kinase_AS.
