- assessed_term:
    id: GO:0006468
    label: protein phosphorylation
  scope: UNRESOLVED
  scope_reason: The Paramecium sequence has protein-kinase, ATP-binding and serine/threonine active-site
    signatures supporting the accepted target phosphorylation annotations. The retrieved broad family
    also includes divergent and probable inactive kinase-like proteins, so catalytic competence must be
    checked before a universal family grant. This family-level unresolved scope does not contradict the
    target's autophagy inheritance, established by its actual PAINT lineage in PTHR24348. No exact target
    phosphorylation substrate is established.
