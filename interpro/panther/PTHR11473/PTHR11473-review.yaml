family_id: PANTHER:PTHR11473
family_name: AROMATIC AMINO ACID HYDROXYLASE
summary: Aromatic amino-acid hydroxylases use reduced pterin and oxygen to hydroxylate aromatic substrates.
  Phenylalanine hydroxylase produces tyrosine, tyrosine hydroxylase produces L-DOPA and tryptophan hydroxylase
  produces 5-hydroxytryptophan. These homologous reactions feed different metabolic and signaling pathways.
functional_coherence: HETEROGENEOUS
coherence_reason: Phenylalanine, tyrosine and tryptophan hydroxylases retain related oxygenation chemistry
  with different substrates. Within the phenylalanine-hydroxylase-associated group, the native Hn-PD input
  E8NH57 contains only a C-terminal portion of the catalytic domain. Retained iron ligands do not restore
  the missing substrate/cofactor architecture, so neither family nor subfamily identity can grant the
  complete reaction to every isoform.
subfamilies:
- subfamily_id: PANTHER:PTHR11473:SF24
  label: PHENYLALANINE-4-HYDROXYLASE
  description: Phenylalanine-hydroxylase-associated branch containing Hn; full-length Hn and the short
    Hn-PD protein share classification, but differ in catalytic-domain completeness. The E8NH57 representative
    is the short input and is not a positive catalytic control.
  representative_members:
  - id: UniProtKB:E8NH57
    label: phenylalanine 4-monooxygenase
    gene_symbol: Hn
    organism: Drosophila melanogaster
    gene_review: genes/DROME/Hn/Hn-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0004505
    label: phenylalanine 4-monooxygenase activity
  scope: UNRESOLVED
  scope_reason: Phenylalanine hydroxylation is supported for full-length PAH/Hn-type proteins, but a subfamily
    assignment is insufficient for every isoform. The exact fly E8NH57 input is Hn-PD, a native 178-residue
    isoform matching the C-terminal part of full-length Hn. The reproducible human-PAH comparison preserves
    metal ligands but retains only 149 of 307 catalytic-domain positions and lacks mapped substrate/cofactor-binding
    architecture. Thus the gene-level removal concerns this incomplete catalytic architecture, not inactivity
    of full-length Hn or the entire PAH branch. The safe family grant must resolve both substrate-specific
    branches and complete catalytic domains; it remains unresolved at the unconditional subfamily level.
  supported_by:
  - reference_id: file:genes/DROME/Hn/Hn-bioinformatics/RESULTS.md
    supporting_text: only 149 of 307 positions remain in PD
