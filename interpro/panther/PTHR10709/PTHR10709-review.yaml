family_id: PANTHER:PTHR10709
family_name: ACTIN-RELATED PROTEIN 2/3 COMPLEX SUBUNIT 1
preferred_name: ARPC1 WD-repeat subunit family
summary: >-
  PTHR10709 contains ARPC1 WD-repeat subunits of the eukaryotic Arp2/3 complex.
  Vertebrates carry ARPC1A and ARPC1B paralogs, represented in human by ARPC1A in
  PTHR10709:SF11 and ARPC1B in PTHR10709:SF10. The human paralogs both assemble into
  Arp2/3 complexes but differ in actin-assembly potency, cortactin/coronin-regulated
  network disassembly and tissue use.
functional_coherence: COHERENT
coherence_reason: >-
  The family is coherent at the level of the Arp2/3 p41 WD-repeat subunit. The current
  PAINT table places only broad Arp2/3 complex membership, Arp2/3-mediated actin
  nucleation and cortical actin cytoskeleton organization at the root node PTN000076207.
  Those assertions are appropriate for human ARPC1A and ARPC1B and avoid modeling the
  mammalian ARPC1A/ARPC1B kinetic and tissue biases as different GO functions.
