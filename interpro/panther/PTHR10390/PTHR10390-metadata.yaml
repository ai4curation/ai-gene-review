  name:
    name: SIX/Sine oculis homeobox transcription factors
    short: SIX/Sine_oculis_HD_TF
  description:
  - text: The SIX/Sine oculis homeobox family is a group of transcription factors
      that play crucial roles in organogenesis and development. Members of this family
      are involved in the regulation of cell proliferation, apoptosis, and embryonic
      development. They are key regulators in the formation of several organs, including
      the kidney, muscle, inner ear, and eye. They function as transcriptional repressors
      or activators, depending on the context, and often require interaction with
      EYA family members for transcriptional activation. They are also implicated
      in the development of the forebrain, lens induction, and retina formation, as
      well as in the maintenance of progenitor cell populations in the kidney and
      the development of craniofacial structures.
