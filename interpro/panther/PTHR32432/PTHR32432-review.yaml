notes: Official name follows panther.obo; the integrated InterPro description is unreviewed LLM text and
  was not used as evidence. All six actual PAINT rows are assessed. Tree inspected at https://pantherdb.org/services/oai/pantherdb/treeinfo?family=PTHR32432.
  SF13 also includes Listeria Q8Y7U6 and Fusobacterium Q8RH37; no exact PTN for the origin of reactivation
  is asserted because the fetched PAINT slice has no corresponding EutA activity IBD. Direct biochemical
  exchange measurements are E. coli, whereas LT2 aggregation limited detailed enzymology.
