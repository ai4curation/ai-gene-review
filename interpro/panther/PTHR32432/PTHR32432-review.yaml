family_id: PANTHER:PTHR32432
family_name: CELL DIVISION PROTEIN FTSA-RELATED
preferred_name: FtsA-related proteins including EutA reactivases and EutJ/PilM relatives
summary: This heterogeneous family includes cell-division FtsA proteins, EutJ/PilM-related proteins and
  ethanolamine ammonia-lyase reactivases EutA. EutA promotes replacement of damaged or inactive cobalamin
  in its cognate EutBC complex. Family membership therefore does not by itself assign cell division, pilus
  assembly or general protein folding to EutA.
functional_coherence: HETEROGENEOUS
coherence_reason: The official tree separates SF4 FtsA, SF3 EutJ/PilM-related proteins and SF13 EutA.
  SF3 itself combines experimentally characterized PilM with EutJ proteins whose precise physiological
  activity remains uncertain.
reference_protein:
  id: UniProtKB:Q9ZFV2
  gene_symbol: eutA
  organism: Salmonella typhimurium LT2
  gene_review: genes/SALTY/eutA/eutA-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR32432:SF13
  label: ETHANOLAMINE AMMONIA-LYASE REACTIVASE EUTA
  description: EutA reactivases associated with ethanolamine ammonia-lyase. E. coli purified-enzyme experiments
    establish ATP/Mg2+-dependent cofactor exchange; LT2 experiments establish cognate complex association
    and physiological complementation. Cross-species complementation can require the matching EutBC partner
    and is not a test of universal interchangeability.
  representative_members:
  - id: UniProtKB:Q9ZFV2
    gene_symbol: eutA
    organism: Salmonella typhimurium LT2
