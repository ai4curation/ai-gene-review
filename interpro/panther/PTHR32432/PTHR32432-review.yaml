term_assessments:
- assessed_term:
    id: GO:0008047
    label: enzyme activator activity
  scope: SUBFAMILY_ONLY
  scope_reason: EutA increases EutBC catalytic capacity through cofactor exchange/reactivation. E. coli
    purified-protein chemistry and LT2 cognate-partner evidence support the EutA SF13 branch, including
    the requirement for appropriate substrate-enzyme recognition. This does not establish generic unfolding/refolding
    or activation by the FtsA and EutJ/PilM branches.
  supported_by:
  - &id001
    reference_id: PMID:15466038
    supporting_text: reactivation and activation occur through the exchange of modified coenzyme for free
      intact adenosylcobalamin.
  - &id002
    reference_id: PMID:35785499
    supporting_text: EAL reactivation requires a cognate EutA.
  - reference_id: PMID:35785499
    supporting_text: We observed that EutT, EutA, and EAL localize to the Eut metabolosome, and that EutA
      and EAL interact directly.
  applicable_subfamilies:
  - id: PANTHER:PTHR32432:SF13
    label: ETHANOLAMINE AMMONIA-LYASE REACTIVASE EUTA
- assessed_term:
    id: GO:0046336
    label: ethanolamine catabolic process
  scope: UNRESOLVED
  scope_reason: EutA directly maintains the catalytic competence of EutBC, but a uniform pathway-process
    grant for this broad family would conflate EutA with FtsA and EutJ/PilM. Native dependence on reactivation
    is conditional; there is no family-wide requirement. This focused review does not create a new process
    grant from growth necessity.
  supported_by:
  - *id001
  - *id002
references:
- id: PMID:15466038
  title: Identification of a reactivating factor for adenosylcobalamin-dependent ethanolamine ammonia
    lyase.
- id: PMID:35785499
  title: Localization and interaction studies of the Salmonella enterica ethanolamine ammonia-lyase (EutBC),
    its reactivase (EutA), and the EutT corrinoid adenosyltransferase.
