notes: >-
  Member counts and subfamily assignments are from PTHR47019-entries.csv (all 20 members in SF1); the
  family and subfamily names are interpro/panther/panther.obo verbatim. Residue positions in members
  other than P0AF16 were obtained by global pairwise alignment (BLOSUM62) to P0AF16 and the declared
  controls make them re-checkable against the current UniProt sequences. The conservation survey behind
  the residue site covered every accession in the inventory. Items for upstream attention. (1) The
  GO:0034204 row at PTN001341949 should be refined to its child GO:0034203 glycolipid translocation,
  which is true of the whole clade, already held by the E. coli gene from an IMP, and asserted at no node
  in the family. (2) The Mycobacterium tuberculosis MviN proteins P9WJK2 and P9WJK3 are 1184 residues
  against 449 to 516 for every other member and lack cavity residues that are individually essential in
  E. coli, including the arginine corresponding to Arg52, whose position the invariant LPNL motif fixes
  unambiguously; they nevertheless receive all five MurJ terms through UniProt's TreeGrafter-based
  electronic pipeline, as does Borreliella burgdorferi O51750, which substitutes the arginine
  corresponding to Arg270. Whether these proteins flip lipid II is open, so nothing is excepted here; a
  cavity-residue complementation test on MviN, or a mycobacterial flipping assay, is the experiment that
  would let a future review either confirm the family-wide scope or add an IKR. (3) UniProt still
  records the identity of the lipid II flippase as controversial on the strength of FtsW's in vitro
  activity in model membranes; the demonstration that SEDS proteins are peptidoglycan polymerases
  largely settles it, and the remaining gap is that no purified-MurJ proteoliposome assay has been
  reported. Unlike the other three families in this set, this one has no stem-peptide granularity
  problem, because MurJ transports the precursor whatever its third stem residue. No proposed_action is
  recorded for either PAINT recommendation above, because both are additive - refining a sound row to a
  child term and pairing a term with a sibling - and the paint_action enum covers moves, removals and
  losses rather than additions.
