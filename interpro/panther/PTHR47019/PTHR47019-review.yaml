family_id: PANTHER:PTHR47019
family_name: LIPID II FLIPPASE MURJ
preferred_name: MurJ/MviN lipid II flippases
summary: >-
  Polytopic inner-membrane transporters of the MOP (multidrug, oligosaccharidyl-lipid and
  polysaccharide) exporter superfamily that move the completed peptidoglycan precursor across the
  cytoplasmic membrane. MurJ, formerly MviN, has fourteen transmembrane helices arranged around a
  solvent-exposed central cavity, and it flips lipid II - undecaprenyl-pyrophosphoryl-MurNAc-pentapeptide
  -GlcNAc - from the inner to the outer leaflet, where the SEDS polymerases and the transpeptidases can
  use it. The step sits between MurG, which makes lipid II on the cytoplasmic face, and the periplasmic
  polymerisation that builds the sacculus, so MurJ is essential: depleting it accumulates lipid-linked
  precursors and the cells swell and lyse. The mechanism is alternating access, captured
  crystallographically in inward-facing, outward-facing and intermediate states, and it needs the
  membrane potential; charged residues lining the central cavity are individually essential, and
  cardiolipin competes with lipid II for the site. The family is small and tight, with one notable
  outlier: the mycobacterial MviN proteins are more than twice the length of the rest and have lost
  some of those cavity residues.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Eighteen of the twenty members of the cached inventory are canonical MurJ proteins of 449 to 516
  residues, all assigned to the family's single subfamily, and the activity, the location and the
  pathway are the same for all of them, so this is the most uniform of the peptidoglycan-precursor
  families reviewed in this set. The identified exception is the Mycobacterium tuberculosis pair
  P9WJK2 and P9WJK3, annotated as probable peptidoglycan biosynthesis protein MviN, at 1184 residues -
  more than twice the length of every other member - and carrying substitutions at cavity positions
  that are individually essential in Escherichia coli, including the arginine corresponding to
  E. coli Arg52. Whether those proteins flip lipid II is not established by anything available here, so
  the family is called mostly coherent and the outlier is flagged rather than excepted.
