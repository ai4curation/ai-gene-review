  assessment: SOUND
  assessment_reason: >-
    MurJ does some of the work of this process rather than merely being required for it: the pathway
    cannot proceed until lipid II has crossed the membrane, and MurJ performs that step, so the
    participation test the project applies to process terms is satisfied without relying on the
    perturbation data. The perturbation data are nevertheless unambiguous - a thermosensitive mviN
    mutant swells, bursts and accumulates lipid II, depletion accumulates lipid-linked precursors, and
    UniProt files the protein under the peptidoglycan biosynthesis pathway on the strength of three
    separate papers. Bacteria is the right scope and both reviewed members accept the term. Note that
    this is the stem-agnostic row of the family: unlike the MurF, MraY and MurG activity terms, nothing
    here depends on whether the organism builds a meso-diaminopimelate or an L-lysine stem peptide,
    because MurJ transports the precursor whatever its third residue - a point the crystallographers
    make explicitly when they choose the L-lysine form of lipid II for docking into a Thermotoga
    enzyme's cavity.
