    label: Bacteria
  assessment: SOUND
  assessment_reason: >-
    A single-seed IBD that is as well grounded as any in this set, which is the standard case against
    reading donor count as a proxy for strength. The seed is the E. coli enzyme, and what stands behind
    it is an in vivo flipping assay rather than an inference: periplasmically delivered colicin M
    cleaves only lipid II that has already been flipped, so its products report flipping directly, and
    rapid chemical inactivation of a single-cysteine MurJ variant abolishes them in both cells and
    spheroplasts. Depletion accumulates lipid-linked precursors, the activity requires the membrane
    potential, and the structures of two thermophilic members in inward- and outward-facing states give
    the alternating-access mechanism the assay implies. Bacteria is the right taxon for the claim: the
    clade is bacterial throughout, the substrate exists only where peptidoglycan is made, and both
    reviewed members accept the term. The one caution worth recording is not about the node but about
    the field: UniProt still flags the identity of the lipid II flippase as controversial because FtsW
    showed transbilayer movement of lipid II in model membranes, and no purified-MurJ proteoliposome
    assay has been reported. That controversy was largely resolved by showing the SEDS proteins to be
    peptidoglycan polymerases, which explains their requirement without making them flippases, and it
    does not bear on whether the activity is inherited across this clade.
