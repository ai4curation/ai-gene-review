residue_sites:
- site_id: central_cavity_charges
  label: Charged residues lining the solvent-exposed central cavity
  description: >-
    The five charged residues of the E. coli MurJ central cavity that were substituted individually and
    scored for function: Arg18, Arg24, Asp39 and Arg270, where replacement by alanine or cysteine
    abolishes activity, and Arg52, where the alanine substitution reduces activity and the cysteine
    substitution abolishes it. They line the solvent-exposed cavity that the topology study and the
    structural model identified, and in the crystallised Thermosipho africanus enzyme the side chain of
    the residue corresponding to Arg18 was modelled as flexible for docking lipid II into that cavity,
    so the set is the substrate path rather than an incidental cluster of charges. Conservation across
    the family was checked by aligning every member of the cached inventory to P0AF16: sixteen of the
    eighteen members tested retain all five, among them the two proteins whose structures define the
    mechanism (Thermosipho africanus B7IE18 at 18, 24, 39, 52 and 255, Thermotoga maritima Q9WXU1 at 18,
    24, 39, 52 and 252) and the reviewed Pseudomonas putida member, which retains all five at the
    identical positions. Two members do not. Borreliella burgdorferi O51750 keeps the first four, with a
    conservative lysine for Arg24, and has valine at the position corresponding to Arg270. The
    Mycobacterium tuberculosis MviN proteins P9WJK2 and P9WJK3 keep Arg18 and Arg24 and lose the rest:
    the position corresponding to Arg52 is alanine, which the alignment fixes unambiguously because the
    invariant LPNL immediately preceding it aligns without gaps, while the positions corresponding to
    Asp39 and Arg270 also lack their residues on a weaker local alignment. Those proteins are 1184
    residues against 511 for E. coli MurJ, so they are a different architecture and not simply a
    divergent MurJ. Positions in members other than the anchor were obtained by global pairwise
    alignment (BLOSUM62) to P0AF16 and are stated in each protein's own numbering; the positive controls
    make them re-checkable. No negative control is declared, because no member of this family has been
    shown to lack flippase activity - the mycobacterial proteins are essential in their own organism and
    nothing cached here says what they transport - and that is precisely why the requirement below is
    recorded as CONTRIBUTES rather than REQUIRED.
  anchor:
    id: UniProtKB:P0AF16
    label: Lipid II flippase MurJ
    gene_symbol: murJ
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/murJ/murJ-ai-review.yaml
  anchor_sequence_version: 1
  site_source: UNIPROT_FEATURE
  residues:
  - position: 18
    expected:
    - R
    role: cavity arginine; R18A and R18C abolish activity
  - position: 24
    expected:
    - R
    role: cavity arginine; R24A and R24C abolish activity
  - position: 39
    expected:
    - D
    role: cavity aspartate; D39A and D39C abolish activity
  - position: 52
    expected:
    - R
    role: cavity arginine; R52A reduces and R52C abolishes activity
  - position: 270
    expected:
    - R
    role: cavity arginine; R270A and R270C abolish activity
  required_for:
  - term:
      id: GO:0015648
      label: lipid-linked peptidoglycan transporter activity
    strength: CONTRIBUTES
    rationale: >-
      Lipid II crosses the membrane through the solvent-exposed central cavity, whose charged lining has
      to coordinate the pyrophosphate and peptide head group of the substrate as the protein alternates
      between inward- and outward-facing states; losing any one of these five charges leaves a cavity
      that cannot hold that head group, which is why each substitution on its own costs function in the
      complementation assay. The evidence is strong enough for REQUIRED on the E. coli protein, where
      four of the five positions abolish activity when substituted by either alanine or cysteine. It is
      recorded as CONTRIBUTES at family level for a specific reason rather than out of caution: no member
      of this family is independently verified to lack flippase activity, so the schema's requirement
      that a REQUIRED site carry a negative control cannot be met honestly, and promoting the strength
      would license a validator to contradict a gene review on the strength of an alignment alone.
    supported_by:
    - reference_id: PMID:23935042
      supporting_text: Furthermore, we present functional studies demonstrating that specific charged
        residues localized in the central cavity are essential for function.
    - reference_id: file:ECOLI/murJ/murJ-uniprot.txt
      supporting_text: 'R->A,C: Lack of activity.'
    - reference_id: file:ECOLI/murJ/murJ-uniprot.txt
      supporting_text: 'D->A,C: Lack of activity.'
    - reference_id: PMID:28024149
      supporting_text: the side chains of Arg 18 and Glu 57 of MurJTA were treated as flexible for
        docking as they appeared to be flexible in our structure
  positive_controls:
