  label: LIPID II FLIPPASE MURJ
  description: >-
    The family's only subfamily, holding all twenty members of the cached inventory, and for once the
    official name is both informative and correct for nearly all of them. It spans the proteobacteria
    (E. coli P0AF16 and P0AF17, Pseudomonas putida Q88Q94, Burkholderia B4E9G3, Haemophilus P44958,
    Bradyrhizobium Q89AI1), the deep-branching thermophiles whose proteins gave the crystal structures
    (Thermosipho africanus B7IE18, Thermotoga maritima Q9WXU1), the spirochaetes (Treponema pallidum
    O83529, Borreliella burgdorferi O51750), Bacillus subtilis O34238 and the actinobacteria. The
    central-cavity charges curated below are intact in sixteen of the eighteen members tested. The two
    that are not are Borreliella O51750, which substitutes the arginine corresponding to E. coli Arg270
    while keeping the rest, and the Mycobacterium tuberculosis MviN pair P9WJK2 and P9WJK3, which are
    1184 residues long and lack at least the arginine corresponding to Arg52; those are described in
    the residue site and in the notes rather than treated as a separate group, because the family has no
    second subfamily to put them in and no evidence here settles what they do.
