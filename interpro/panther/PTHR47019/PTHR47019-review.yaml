  scope_reason: >-
    The family's defining activity, asserted at its only node with a Bacteria taxon and accepted by both
    reviewed members. The protein name, the single subfamily name and the family name all say the same
    thing, the substrate exists wherever peptidoglycan is made, and the central-cavity charges that carry
    the substrate are intact in sixteen of the eighteen members tested. One caveat is attached rather
    than carved out: the Mycobacterium tuberculosis MviN proteins are 1184 residues and lack at least the
    arginine corresponding to E. coli Arg52, so whether the term holds for them is genuinely open. They
    are not recorded as member exceptions because an exception is an assertion that the term does not
    hold, and no evidence available here supports that - they are essential proteins of a mycobacterium
    whose transported substrate has not been determined in anything cached for this review. A
    mycobacterial flipping assay, or a cavity-residue complementation test on MviN, would settle it.
