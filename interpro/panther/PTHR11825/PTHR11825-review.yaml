residue_sites:
- site_id: plp_lysine
  label: PLP Schiff-base lysine
  description: >-
    The lysine that forms the internal aldimine with pyridoxal 5'-phosphate in human BCAT2, a
    UniProt feature with experimental evidence. Precursor numbering (transit peptide 1-27).
  anchor: *id001
  anchor_sequence_version: 2
  residues:
  - position: 229
    expected:
    - K
    role: PLP Schiff-base lysine
  required_for:
  - term:
      id: GO:0004084
      label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
    strength: CONTRIBUTES
    rationale: >-
      Transamination runs through the PLP cofactor bound to this lysine as a Schiff base, which
      shuttles the amino group between the amino acid and the 2-oxo acid. Kept at CONTRIBUTES
      because no cached source states the loss-of-function consequence for this family.
    supported_by:
    - reference_id: file:genes/human/BCAT2/BCAT2-uniprot.txt
      supporting_text: /note="N6-(pyridoxal phosphate)lysine"
  site_source: UNIPROT_FEATURE
