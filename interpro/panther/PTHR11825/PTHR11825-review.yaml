  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The eukaryotic node (PTHR11825:AN1) is seeded by mitochondrial BCATs (S. cerevisiae BAT1, S.
    pombe eca39, human, mouse and rat BCAT2), and mitochondrial location is ancestral for
    eukaryotic BCATs. Two branches have relocated to the cytosol and still inherit the term in
    the PAINT UniProt GAF (95 receivers, including P47176 and P54687): the vertebrate BCAT1
    clade (SF70) and S. cerevisiae BAT2, the post-duplication paralog of BAT1 (SF44, recorded
    as a member exception). An IRD on the BCAT1 clade node and on the BAT2 branch would fix the
    propagation. The BAT2 gene review removes this IBA.
