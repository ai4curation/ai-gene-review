family_id: PANTHER:PTHR11825
family_name: SUBGROUP IIII AMINOTRANSFERASE
summary: Branched-chain amino-acid aminotransferases reversibly exchange amino groups between branched-chain
  amino acids and their ketoacids using pyridoxal phosphate. Cytosolic, mitochondrial and microbial members
  retain related chemistry while serving different metabolic directions and compartments.
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'The PANTHER subfamily inventory comprises branched-chain aminotransferase, BCAT1 and
  BCAT2 groups. Rat BCAT2 expression directly produces branched-chain aminotransferase activity with processing
  of its mitochondrial targeting sequence (PMID:9165094); the human ortholog and reviewed substrate chemistry
  support the same broad reaction. This supports the reaction across intact members, while the shared
  class-IV PLP fold alone would not: mitochondrial location, catabolic direction and physiological substrate
  flux differ among lineages.'
