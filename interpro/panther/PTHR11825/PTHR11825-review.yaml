- subfamily_id: PANTHER:PTHR11825:SF44
  label: BRANCHED-CHAIN-AMINO-ACID AMINOTRANSFERASE
  description: >-
    The largest subfamily (23 of 32 reviewed members) and the one the BCAA module uses for the
    fungal transaminase step. It mixes bacterial IlvE (Bacillus subtilis IlvE and IlvK,
    Mycobacterium tuberculosis and M. leprae IlvE, Staphylococcus IlvE, Streptomyces IlvE), the
    fungal BCATs (S. cerevisiae BAT1 and BAT2, S. pombe eca39, Emericella atnH), invertebrate and
    early-branching eukaryote BCATs (C. elegans bcat-1, Drosophila Bcat, Nematostella, Monosiga,
    Dictyostelium bcaA). In S. cerevisiae the two paralogs from the whole-genome duplication have
    split the roles of the single ancestral enzyme: mitochondrial Bat1, with an N-terminal
    targeting extension and expression under biosynthetic conditions, performs the last step of
    valine, leucine and isoleucine synthesis in the matrix, while cytosolic Bat2 serves mainly
    branched-chain amino acid catabolism (Ehrlich pathway). The Kluyveromyces lactis ortholog and
    S. pombe eca39 are single mitochondrial BCATs.
  representative_members:
  - id: UniProtKB:P38891
    label: BAT1
    gene_symbol: BAT1
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/BAT1/BAT1-ai-review.yaml
  - id: UniProtKB:P47176
    label: BAT2
    gene_symbol: BAT2
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/BAT2/BAT2-ai-review.yaml
  - id: UniProtKB:O14370
    label: eca39
    gene_symbol: eca39
    organism: Schizosaccharomyces pombe
    gene_review: genes/SCHPO/eca39/eca39-ai-review.yaml
  - id: UniProtKB:O31461
    label: ilvE
    gene_symbol: ilvE
    organism: Bacillus subtilis (strain 168)
  - id: UniProtKB:P9WQ75
    label: ilvE
    gene_symbol: ilvE
    organism: Mycobacterium tuberculosis (strain ATCC 25618 / H37Rv)
  diverged_from_family: false
  divergence_description: >-
    Compartment and direction, not reaction, diverge inside SF44. All members are
    branched-chain-amino-acid:2-oxoglutarate transaminases. S. cerevisiae BAT2 lost the
    mitochondrial presequence after the whole-genome duplication and is cytosolic, so it must not
    inherit the mitochondrion IBA from the eukaryotic node PTN000214536 (recorded as a member
    exception). Bacterial members are cytoplasmic and outside that eukaryotic node. Whether a
    given member acts mainly in synthesis (BAT1, eca39, bacterial IlvE) or in degradation (BAT2)
    is a physiological role set by compartment and expression, not by sequence.
  supported_by:
  - reference_id: PMID:8798704
    supporting_text: encodes a protein of 393 amino acid
      residues with an NH2-terminal extension that directs Bat1p to the mitochondrial
      matrix.
  - reference_id: PMID:8798704
    supporting_text: A highly homologous protein, Bat2p, of 376 amino acid residues was found
      in the cytosol.
  - reference_id: PMID:21267457
    supporting_text: Our results show that the KlBat1 orthologous BCAT is a
      bifunctional enzyme, which participates in the biosynthesis and catabolism of
      branched chain aminoacids (BCAAs).
  - reference_id: PMID:21267457
    supporting_text: subcellular relocalization has resulted in the distribution of the biosynthetic
      and catabolic roles of the ancestral BCAT in two isozymes
- subfamily_id: PANTHER:PTHR11825:SF70
  label: BRANCHED-CHAIN-AMINO-ACID AMINOTRANSFERASE, CYTOSOLIC
  description: >-
    Vertebrate cytosolic BCAT1 (BCATc), e.g. human BCAT1 (P54687) and sheep BCAT1 (Q9GKM4). In
    mammals BCAT1 and the mitochondrial BCAT2 (SF39) catalyse the reversible first step of
    branched-chain amino acid catabolism; vertebrates do not synthesize branched-chain amino
    acids, so neither vertebrate subfamily has a biosynthetic role. BCAT1 is expressed mainly in
    brain and a few other tissues.
  representative_members:
  - id: UniProtKB:P54687
    label: BCAT1
    gene_symbol: BCAT1
    organism: Homo sapiens
  diverged_from_family: true
  divergence_description: >-
    Cytosolic rather than mitochondrial vertebrate paralog. The reaction is unchanged, but SF70
    members lack the mitochondrial location that PAINT places at the eukaryotic node
    PTN000214536, and they should not inherit it.
  supported_by:
  - reference_id: PMID:35697072
    supporting_text: Human BCAT1 is cytoplasmic (hence BCATc) and is mostly present in the peripheral nervous system of brain, ovaries, and testes
