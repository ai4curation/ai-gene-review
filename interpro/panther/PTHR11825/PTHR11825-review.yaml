  - id: WB:WBGene00001149
    label: bcat-1
    organism: Caenorhabditis elegans
  assessment: UNRESOLVED
  assessment_reason: >-
    The seeds are all animal BCATs (fly Bcat, mouse Bcat1 and Bcat2, rat Bcat2, worm bcat-1), for
    which the catabolic role is the main one, but the node is the family root, so the term also
    descends to bacterial IlvE (B. subtilis, Mycobacterium, Staphylococcus) and to the fungal
    biosynthetic isozymes BAT1 and eca39. The reaction is reversible, and the ancestral-like
    single fungal BCAT of K. lactis is bifunctional, so catabolic participation is plausible for
    fungi: the BAT2 gene review accepts the IBA and the BAT1 and eca39 reviews keep it as
    non-core. For the bacterial receivers, whose established role is the last step of synthesis,
    no catabolic evidence was reviewed. Placing the term at an animal node would be more
    defensible, but bacterial catabolic participation was not tested here, so the verdict stays
    unresolved rather than TOO_DEEP.
  supported_by:
