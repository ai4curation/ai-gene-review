family_id: PANTHER:PTHR45772
family_name: CONSERVED COMPONENT OF ABC TRANSPORTER FOR NATURAL AMINO ACIDS-RELATED
preferred_name: LivG/LivF/LptB-type ABC transporter ATP-binding protein family
summary: >-
  An ABC (ATP-binding cassette) nucleotide-binding-domain family of bacteria and archaea.
  All members are cytoplasmic ATPase subunits that dock onto the transmembrane domains of an
  inner-membrane ABC transporter and couple ATP binding and hydrolysis to transport. Two
  functionally distinct groups are well characterized. The LivG/LivF/BraF-type subunits
  (SF11, SF7 and related subfamilies) energize binding-protein-dependent uptake of
  branched-chain and other neutral amino acids. The LptB subfamily (SF10) energizes the
  LptB2FG transporter, which extracts lipopolysaccharide from the inner membrane and pushes
  it into the periplasmic Lpt bridge; LptB is essential in Escherichia coli, and ATP
  hydrolysis by LptB is required for LPS transport. Substrate and pathway therefore differ
  by subfamily, while ATPase activity and inner-membrane association are shared.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family lumps amino-acid uptake ATPases (LivG/LivF/BraF, SF11 and SF7; branched-chain
  amino acid ATPases of archaea, SF5 and SF8) with the LPS-export ATPase LptB (SF10).
  Transport substrate and direction cannot be propagated family-wide; only the ABC ATPase
  activity and membrane association are shared.
