  description: LivG/BraF ATPases of high-affinity branched-chain amino acid ABC transporters (E. coli
    LivG P0A9S7, Pseudomonas aeruginosa BraF P21629); the seeds of the amino-acid transport IBD node.
  diverged_from_family: false
