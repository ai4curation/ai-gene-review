term_assessments:
- assessed_term:
    id: GO:0015920
    label: lipopolysaccharide transport
  scope: UNRESOLVED
  scope_reason: The reviewed E. coli and KT2440 LptB proteins are positively grounded in SF10 and their
    matched LptFG systems; the amino-acid ABC groups cannot substitute. However, SF10 also contains Thermotoga
    Q9X0E4 and Deinococcus Q9RSJ0 from non-LPS-producing diderms, plus plant/algal-labeled leaves of unresolved
    provenance. SF10 identity is necessary classification context for this module cohort, not sufficient
    evidence of native LPS transport across the subfamily. Keep broader scope unresolved and require a
    demonstrated/inferred specific LptB role, LPS/LOS substrate and compatible partners. No new loss node
    or assertion of universal catalytic inactivity is inferred.
  supported_by:
  - reference_id: PMID:24639492
    supporting_text: Our studies establish the essentiality of ATP hydrolysis by LptB to power LPS transport
      in cells and suggest strategies to inhibit transporter function away from the LptB active site.
  - reference_id: file:analysis/module_audits/bacterial_lps_transport/family-consultation/tree-evidence.md
    supporting_text: 'PTN000656759: Q9RSJ0; DR_2134; Deinococcus radiodurans; PTHR45772:SF10.'
- assessed_term:
    id: GO:0016887
    label: ATP hydrolysis activity
  scope: FAMILY_WIDE
  scope_reason: All members are ABC nucleotide-binding domains; ATP hydrolysis is shown directly for LptB
    and is the shared mechanism of the family.
  supported_by:
  - reference_id: PMID:24639492
    supporting_text: We characterize these residues using biochemical experiments combined with high-resolution
      crystal structures of LptB pre- and post-ATP hydrolysis and suggest a role for an active site residue
      in phosphate exit.
- assessed_term:
    id: GO:0005886
    label: plasma membrane
  scope: FAMILY_WIDE
  scope_reason: Cytoplasmic-face subunits of inner-membrane ABC transporters throughout.
