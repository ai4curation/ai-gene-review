  diverged_from_family: true
  divergence_description: >-
    Energizes lipopolysaccharide extraction from the inner membrane by LptF/LptG instead of
    amino-acid uptake; LptB lies outside the PAINT node (PTN000656921) that carries the
    amino-acid transport terms and correctly inherits none of them.
  supported_by:
