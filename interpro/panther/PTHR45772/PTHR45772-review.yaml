notes: >-
  Tree topology was read from the PANTHER 19.0 treeinfo service. The root PTN002516950
  (DUPLICATION) splits into the amino-acid branch containing PTN000656921 (SF7 19 leaves,
  SF11 6) and the PTN000657161 branch (SF10 LptB 25 leaves, SF8 9). E. coli LptB P0A9V1
  descends PTN002516950 > PTN000657161 > ... and is not below PTN000656921. The amino-acid
  transport rows at PTN000656921 are left UNRESOLVED because this review was done for the
  bacterial_lps_transport module and did not examine the LivG/BraF literature; they need a
  follow-up review if the Liv transporter is curated. Status is NEEDS_REVIEW rather than
  COMPLETE for that reason; the LptB (SF10) judgements used by the LPS transport module are
  settled.
