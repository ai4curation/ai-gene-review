family_id: PANTHER:PTHR28629
family_name: TRIOKINASE/FMN CYCLASE
preferred_name: Dihydroxyacetone kinase / triokinase (DAK/TKFC) family
summary: >-
  ATP-dependent two-domain dihydroxyacetone kinases phosphorylate DHA (and in mammals D-glyceraldehyde)
  to triose phosphates (S. cerevisiae DAK1/DAK2, S. pombe dak1/dak2, human TKFC). Human TKFC also
  has an FMN cyclase (FAD-AMP lyase) activity.
functional_coherence: COHERENT
coherence_reason: >-
  Both subfamilies are DHA kinases; triokinase and FMN cyclase activities are established for mammalian
  TKFC.
