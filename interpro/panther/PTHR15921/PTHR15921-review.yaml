family_id: PANTHER:PTHR15921
family_name: PRE-MRNA CLEAVAGE COMPLEX II
preferred_name: Pcf11 transcription-termination and RNA-processing factors
summary: Pcf11 couples RNA polymerase II termination to pre-mRNA 3-prime-end processing through interactions
  with the polymerase and cleavage/polyadenylation machinery. Its function depends on a multidomain protein
  and association with factors such as Clp1. A short fragment matching part of Pcf11 cannot be assumed
  to carry all functions of the intact protein.
functional_coherence: COHERENT
coherence_reason: Pcf11 proteins couple RNA polymerase II transcription to RNA-end processing through
  separable interaction domains. Yeast experiments distinguish CTD binding from other 3-prime-processing
  functions (PMID:12727883). Reconstituted mammalian CFII contains Pcf11 and Clp1; Pcf11 zinc fingers
  bind RNA, while the kinase is Clp1 and its kinase activity is dispensable for the tested cleavage reaction
  (PMID:30139799). The 86-residue fly benchmark product represents only a limited portion of this multidomain
  mechanism; family identity does not establish all full-length Pcf11 functions on that short exact product.
