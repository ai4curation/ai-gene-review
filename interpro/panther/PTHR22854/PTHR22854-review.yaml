notes: >-
  Counts come from the parsed entries.csv (397 reviewed proteins: 396 SF2, 1
  SF17). Node descendants were checked against the PANTHER 19.0 tree (treeinfo
  service). In that tree, PTN000523336 is the root and contains E. coli TrpCF
  and P. aeruginosa TrpC. S. pombe trp1 is absent from the tree, and the
  PANTHER HMM file places it in PTHR43418:SF4 while UniProt cross-references it
  here, so the reference protein was changed from trp1 to E. coli TrpCF.
  Because PRAI is architecture-determined, the tryptophan_biosynthesis module
  does not ground its fused-PRAI annoton on this family.
