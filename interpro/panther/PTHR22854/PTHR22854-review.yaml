family_id: PANTHER:PTHR22854
family_name: TRYPTOPHAN BIOSYNTHESIS PROTEIN
preferred_name: Indole-3-glycerol-phosphate synthase (TrpC) family
summary: >-
  IGPS converts 1-(2-carboxyphenylamino)-1-deoxyribulose 5-phosphate to indole-3-glycerol phosphate,
  the fourth step of tryptophan synthesis. Bacterial TrpC is often fused to PRA isomerase (TrpF).
  Fungal trp1 (S. pombe) is trifunctional, with glutamine amidotransferase, IGPS and PRAI domains.
functional_coherence: COHERENT
coherence_reason: All members carry IGPS activity; domain fusions vary by lineage.
