    PRAI activity depends on domain architecture, not subfamily. It is true
    for TrpC-TrpF fusions (E. coli TrpCF, assayed directly) and false for
    standalone TrpC in the same subfamily SF2 (P. putida TrpC, whose
    TreeGrafter PRAI row is removed). No PANTHER subfamily separates the two
    architectures, so the term cannot be scoped to a subfamily. It should be
    predicted from the presence of a TrpF domain (Pfam PF00697).
