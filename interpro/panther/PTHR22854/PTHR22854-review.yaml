family_id: PANTHER:PTHR22854
family_name: TRYPTOPHAN BIOSYNTHESIS PROTEIN
preferred_name: Indole-3-glycerol-phosphate synthase (TrpC) family
summary: >-
  Indole-3-glycerol-phosphate synthases (IGPS, TrpC, EC 4.1.1.48). They convert
  1-(2-carboxyphenylamino)-1-deoxy-D-ribulose 5-phosphate to indole-3-glycerol
  phosphate, the fourth step of tryptophan synthesis. The family holds
  standalone TrpC (P. putida and P. aeruginosa TrpC), the bifunctional
  TrpC-TrpF fusions of enteric bacteria, in which a C-terminal
  phosphoribosylanthranilate isomerase domain follows the IGPS domain (E. coli
  TrpCF), and plant plastid IGPS (SF17). UniProt also cross-references the
  fungal trifunctional TrpG-TrpC-TrpF protein (S. pombe trp1) to this family,
  but the PANTHER 19 HMM assignment and tree place trp1 in PTHR43418.
functional_coherence: COHERENT
coherence_reason: >-
  Every reviewed member (396 in SF2, 1 in SF17) carries the IGPS domain and
  activity. Fused domains vary by lineage, so PRAI activity is present only
  where a TrpF domain is fused. PAINT records one loss clade of 12 eukaryotic
  sequences (PTN000523338), none of them reviewed.
