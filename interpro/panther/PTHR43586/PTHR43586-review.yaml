notes: The official label and classification are preserved, including the surprising chloroplastic SF8
  name. Q72HV9 is absent from the sampled tree and reviewed-member CSV but is classified by the official
  UniProt record; a missing target leaf is not a negative loss trace. No new IRD/IKR or residue-based
  discrimination is invented. PMID26149121 full text confirms purified M. smegmatis EgtE expressed in
  E. coli and alternate C-S lyase chemistry; PMID15790858 is abstract-only but explicitly establishes
  SepCysS conversion chemistry. Neither is cited as a cysteine-desulfurase-negative assay.
