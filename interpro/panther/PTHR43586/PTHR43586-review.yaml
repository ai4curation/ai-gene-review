family_id: PANTHER:PTHR43586
family_name: CYSTEINE DESULFURASE
preferred_name: SufS/CsdA-related PLP-dependent enzymes
summary: This PLP-enzyme family includes group-II cysteine desulfurases, EgtE hercynylcysteine sulfoxide
  lyase and SepCysS aminoacyl-tRNA conversion enzymes. Thermus HB27 SufS supplies sulfur to MnmA in a
  purified cysteine-fed reaction, while other members have different physiological substrates and partners.
functional_coherence: HETEROGENEOUS
coherence_reason: 'Experimentally supported alternative chemistry occurs even within SF8: Thermus SufS
  and mycobacterial EgtE share the same official subfamily. SepCysS lies in SF3. Positive alternate activities
  do not prove a lack of secondary cysteine desulfuration, but they prevent an unqualified family-wide
  or SF8-wide role grant.'
