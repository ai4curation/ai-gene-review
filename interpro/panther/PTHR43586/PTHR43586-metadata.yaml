  name:
    name: Class-V pyridoxal-phosphate-dependent aminotransferase family, Csd subfamily
    short: Class-V_PLP-dep_AT_Csd
  description:
  - text: The cysteine desulfurase family catalyzes the removal of sulfur from L-cysteine
      to produce L-alanine, playing a crucial role in sulfur metabolism and the biosynthesis
      of sulfur-containing biomolecules. These enzymes are involved in the activation
      and mobilization of sulfur in the SUF pathway for iron-sulfur (Fe-S) cluster
      biogenesis. They are also implicated in the formation of selenocysteine lyase
      in vitro, mobilizing selenium from L-selenocysteine, although their in vivo
      selenocysteine lyase activity is uncertain. The family includes proteins that
      are part of the suf operon, which is activated under conditions like oxidative
      stress and iron limitation. Some members are also involved in the biosynthesis
      of ergothioneine, an antioxidant that protects bacteria from oxidative stress.
