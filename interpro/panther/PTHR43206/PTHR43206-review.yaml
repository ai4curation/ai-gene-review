family_id: PANTHER:PTHR43206
family_name: AMINOTRANSFERASE
preferred_name: 4-aminobutyrate aminotransferase (GABA-AT) family
summary: >-
  PLP-dependent class III aminotransferases. Eukaryotic GABA transaminases (human ABAT, S. cerevisiae
  UGA1, S. pombe uga1) catalyse the second step of the GABA shunt. SF2 holds actinobacterial L-lysine
  epsilon-aminotransferases (Lat).
functional_coherence: MOSTLY_COHERENT
coherence_reason: SF1 and SF4 are GABA transaminases; SF2 is Lat, a lysine 6-aminotransferase.
