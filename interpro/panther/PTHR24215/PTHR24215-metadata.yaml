  name:
    name: Cysteine and glycine-rich LIM domain-containing protein
    short: CSRP_LIM-domain
  description:
  - text: This family of proteins includes regulators of myogenesis, acting as cofactors
      for myogenic bHLH transcription factors like MYOD1, MYOG, and MYF6. They enhance
      DNA-binding activities of these factors, promoting myogenesis and playing crucial
      roles in cardiomyocyte cytosolic structure organization. Some members are involved
      in mechanical stretch sensing and may serve as scaffold proteins at Z-line structures,
      essential for calcineurin anchorage and stress-induced activation. They can
      bind to actin filaments, cross-link them into bundles, and protect them from
      depolymerization, contributing to muscle cell integrity. Additionally, they
      may participate in cardiac stress signaling by modulating PKC/PRKCA activity
      and are implicated in early sarcomere organization. Some are down-regulated
      in transformed cells or in response to injury, suggesting roles in cell growth,
      differentiation, and vascular development. Others may be involved in signal
      transduction pathways mediating adhesion-stimulated gene expression changes.
