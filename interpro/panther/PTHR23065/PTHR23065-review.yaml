family_id: PANTHER:PTHR23065
family_name: PROLINE-SERINE-THREONINE PHOSPHATASE INTERACTING PROTEIN 1
preferred_name: F-BAR membrane and cytoskeletal scaffolds
summary: F-BAR proteins organize membrane-associated assemblies and connect membranes to cytoskeletal
  or trafficking machinery. The group includes GAS7, PACSIN, PSTPIP, cytokinesis proteins and Rho-GAP-containing
  proteins with distinct accessory domains.
functional_coherence: HETEROGENEOUS
coherence_reason: The pufferfish target has GAS7-related F-BAR architecture, and GAS7 membrane-sheet assembly
  is a relevant physical mechanism. Cytoplasmic and peripheral-membrane activity is compatible with this
  branch, but the family includes spatially specialized proteins and does not imply phosphatase catalysis
  despite the historical name.
