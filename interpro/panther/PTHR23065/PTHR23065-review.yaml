  scope_reason: GAS7 forms sheets on the cytoplasmic face of membranes and is recruited to phagocytic
    cups, supporting a peripheral membrane/cytoplasmic context for that branch. The F-BAR module in the
    pufferfish target is compatible with the mechanism. Other family members differ in targeting and accessory
    activities, so neither a specific organelle nor a universally diffuse cytoplasmic distribution follows.
