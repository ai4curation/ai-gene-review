family_id: PANTHER:PTHR38040
family_name: UBIQUINONE BIOSYNTHESIS ACCESSORY FACTOR UBIK
preferred_name: UbiK ubiquinone biosynthesis accessory factor family
summary: >-
  UbiK is a small proteobacterial accessory factor of aerobic ubiquinone
  biosynthesis. In Escherichia coli and Salmonella it forms a complex with the
  SCP2-domain scaffold UbiJ, belongs to the soluble cytoplasmic Ubi metabolon,
  and is needed for efficient ubiquinone synthesis under aerobic but not
  anaerobic conditions. It has no known catalytic activity; its proposed role
  is assembly or targeting of the Ubi enzymes. Pseudomonas putida KT2440 UbiK
  (PP_5235) is assigned to the same subfamily by sequence alone.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF1) of UbiK accessory factors; every characterized
  member is the E. coli or Salmonella UbiK protein.
