family_id: PANTHER:PTHR23309
family_name: 3-HYDROXYACYL-COA DEHYROGENASE
preferred_name: Peroxisomal L-bifunctional enzyme (EHHADH/MFP2/AIM1) family
summary: >-
  Peroxisomal multifunctional proteins with an N-terminal crotonase-fold enoyl-CoA hydratase and
  a C-terminal (S)-3-hydroxyacyl-CoA dehydrogenase. Animal EHHADH (L-bifunctional protein) and plant
  MFP2/AIM1 carry out the second and third steps of peroxisomal beta-oxidation. Fungal FOX2 is an
  unrelated D-specific MFE.
functional_coherence: COHERENT
coherence_reason: All subfamilies are bifunctional hydratase/dehydrogenase MFPs.
