family_id: PANTHER:PTHR23151
family_name: DIHYDROLIPOAMIDE ACETYL/SUCCINYL-TRANSFERASE-RELATED
preferred_name: Pyruvate dehydrogenase E2 / E3-binding protein family (DLAT/LAT1, PDHX/PDX1)
summary: >-
  Lipoyl-domain proteins of the pyruvate dehydrogenase core. The catalytic E2 dihydrolipoyllysine
  acetyltransferase (S. cerevisiae LAT1, S. pombe lat1, human DLAT) transfers the acetyl group to
  CoA and forms the complex core. The E3-binding protein (S. cerevisiae PDX1, S. pombe SPCC1259.09c,
  human PDHX) has a degenerate, non-catalytic acetyltransferase domain and tethers E3 to the core.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Catalytic E2 (SF90, SF89, SF75, SF83) and non-catalytic E3BP (SF82) are distinct roles. Human PDHX
  sits in SF90 with DLAT although it is non-catalytic.
