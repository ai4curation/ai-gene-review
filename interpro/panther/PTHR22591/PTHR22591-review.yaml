term_assessments:
- assessed_term:
    id: GO:0030036
    label: actin cytoskeleton organization
  scope: UNRESOLVED
  scope_reason: Xin-repeat expression and actin-binding assays show stabilization of the actin cytoskeleton,
    with corresponding repeats in XIRP2. This supports an actin-organizing mechanism across characterized
    Xin proteins rather than an XIRP2-exclusive effect. Shortened isoforms and other architectures require
    separate assessment before defining a complete positive set.
  supported_by:
  - reference_id: PMID:15454575
    supporting_text: 'Human XIRP2 contains 28 Xin repeats with properties identical

      to those of Xin'
  - reference_id: file:genes/BOVIN/E1BL04/E1BL04-uniprot.txt
    supporting_text: DR   InterPro; IPR012510; Actin-binding_Xin_repeat.
  - reference_id: PMID:15454575
    supporting_text: 'these repeats bind to and stabilize the

      actin-based cytoskeleton.'
- assessed_term:
    id: GO:0030054
    label: cell junction
  scope: UNRESOLVED
  scope_reason: Xin immunolocalization identifies intercalated discs and myotendinous junctions in muscle,
    giving concrete junctional evidence. It does not establish identical junctional residence for every
    XIRP isoform or tissue, including auditory contexts. Junction localization follows preserved targeting
    architecture and cellular expression, not repeats alone.
  supported_by:
  - reference_id: PMID:15454575
    supporting_text: 'Human XIRP2 contains 28 Xin repeats with properties identical

      to those of Xin'
  - reference_id: file:genes/BOVIN/E1BL04/E1BL04-uniprot.txt
    supporting_text: DR   InterPro; IPR012510; Actin-binding_Xin_repeat.
  - reference_id: PMID:15454575
    supporting_text: 'these repeats bind to and stabilize the

      actin-based cytoskeleton.'
  - reference_id: PMID:15454575
    supporting_text: 'Xin is found primarily in the intercalated discs

      of cardiomyocytes and the myotendinous junctions of skeletal muscle cells'
- assessed_term:
    id: GO:0003779
    label: actin binding
  scope: UNRESOLVED
  scope_reason: Purified-repeat and cell-expression assays directly support Xin-mediated actin binding;
    XIRP2 repeats share those properties. The repeated actin-binding module is the relevant transferable
    feature. The full set of products retaining a functional repeat array has not been delimited, so no
    exclusive XIRP2-only or unconditional family-wide grant is made.
  supported_by:
  - reference_id: PMID:15454575
    supporting_text: 'Human XIRP2 contains 28 Xin repeats with properties identical

      to those of Xin'
  - reference_id: file:genes/BOVIN/E1BL04/E1BL04-uniprot.txt
    supporting_text: DR   InterPro; IPR012510; Actin-binding_Xin_repeat.
  - reference_id: PMID:15454575
    supporting_text: 'these repeats bind to and stabilize the

      actin-based cytoskeleton.'
