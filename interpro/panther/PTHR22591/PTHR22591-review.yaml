family_id: PANTHER:PTHR22591
family_name: XIN
preferred_name: Xin actin-associated repeat proteins
summary: Xin proteins contain actin-associated repeats and participate in cytoskeletal organization. XIRP1
  and XIRP2 share this architectural role while differing in tissue context, binding partners and isoforms.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The bovine target has Xin repeats and XIRP2 placement, and experimental XIRP2 work supports
  the repeat-mediated actin relationship. Junctional residence requires the relevant cell type and isoform;
  a generic family assignment does not establish a particular junction or auditory versus cardiac function.
