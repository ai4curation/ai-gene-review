notes: 'BOVIN/E1BL04: requested accession E1BL04; current record E1BL04; sequence length 3561; source
  cohort ARGO50. Family boundaries were assessed using the fetched member set and the cited domain, literature
  and analytical evidence. Gene-review verdicts and ARBA assertions are not independent validation. PANTHER
