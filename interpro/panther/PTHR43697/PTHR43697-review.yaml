- assessed_term:
    id: GO:0098619
    label: selenocysteine-tRNA ligase activity
  scope: UNRESOLVED
  scope_reason: >-
    Serylation of tRNA(Sec) is the shared first step of selenocysteine synthesis, and
    SerS performs it in Sec-decoding bacteria such as E. coli. It is only physiological
    where a tRNA(Sec) gene exists, which varies between genomes inside the single
    subfamily (many bacteria in the family make no selenoproteins), so applicability is
    a per-genome question rather than a subfamily property.
  supported_by:
  - reference_id: file:PSEPK/serS/serS-uniprot.txt
    supporting_text: >-
      Is also able to aminoacylate tRNA(Sec) with serine, to form the misacylated tRNA
      L-seryl-tRNA(Sec), which will be further converted into selenocysteinyl-tRNA(Sec).
  - reference_id: PMID:2405383
    supporting_text: >-
      The results demonstrate that selenocysteine is synthesized from L-serine bound to
      tRNA(UCA)
