family_id: PANTHER:PTHR43697
family_name: SERYL-TRNA SYNTHETASE
preferred_name: Bacterial-type seryl-tRNA synthetases (SerS)
summary: >-
  Class II seryl-tRNA synthetases (SerS, EC 6.1.1.11) of the bacterial type. They
  charge tRNA(Ser) with L-serine for translation and, in organisms that decode UGA as
  selenocysteine, also charge tRNA(Sec) with serine to give the L-seryl-tRNA(Sec)
  precursor of Sec-tRNA(Sec). All 686 Swiss-Prot members are in the single subfamily
  SF1, almost all named serine--tRNA ligase; several Firmicutes and Streptomyces
  genomes carry two paralogs (serS1/serS2). A few archaeal and eukaryotic sequences
  also classify here: Methanosarcina and Halobacterium SerS, Plasmodium falciparum
  cytoplasmic SerRS, and a Methanopyrus kandleri protein named type-2 serine--tRNA
  ligase. Eukaryotic cytoplasmic and mitochondrial SerRS are mostly in PTHR11778.
functional_coherence: COHERENT
coherence_reason: >-
  Every member is named and annotated as a serine--tRNA ligase, and the bacterial clade
  PAINT node is seeded by the biochemically characterized E. coli enzyme. The paralog
  pairs in some bacteria do not have a recorded divergence of activity.
