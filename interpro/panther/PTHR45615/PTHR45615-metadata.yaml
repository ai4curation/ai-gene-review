  name:
    name: Myosin ATPase superfamily
    short: Myosin_ATPase_superfamily
  description:
  - text: This family of proteins is involved in muscle contraction and cytoskeleton
      organization. They are actin-based motor molecules with ATPase activity, essential
      for the contraction process. These proteins form part of the thick filaments
      in muscle fibers and interact with actin thin filaments to generate force. They
      also play roles in cell shape, cytokinesis, and specialized functions such as
      secretion and capping. Some family members are implicated in intracellular trafficking
      and may influence the regulation of muscle-specific genes. Additionally, certain
      myosins have specialized functions in non-muscle cells, contributing to processes
      like cell motility, stabilization of mRNAs, and immune responses.
