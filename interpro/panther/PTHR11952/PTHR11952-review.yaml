notes: Benchmark representatives and subfamily identifiers are verified against the frozen UniProt records
  and PANTHER vocabulary. The summary distinguishes family classification from biological evidence. No
  PAINT ancestral-node placement is asserted without a tree-based assessment, and no catalytic-residue
  loss is inferred from a short or incomplete input sequence.
term_assessments:
- assessed_term:
    id: GO:0003977
    label: UDP-N-acetylglucosamine diphosphorylase activity
  scope: UNRESOLVED
  scope_reason: The UAP1 branch has direct enzymatic support and the frog SF4 representative preserves
    its substrate-pocket architecture. The broad family also includes different UDP-sugar specificities,
    and the complete set of GlcNAc-active subfamilies is not enumerated. Thus no universal or falsely
    exhaustive subfamily grant is made.
