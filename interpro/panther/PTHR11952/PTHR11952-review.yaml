family_id: PANTHER:PTHR11952
family_name: UDP- GLUCOSE PYROPHOSPHORYLASE
summary: UDP-sugar pyrophosphorylase relatives activate sugar phosphates with UTP to supply nucleotide-sugar
  donors. UAP1-type proteins act on N-acetylhexosamine phosphates, while other branches use different
  sugars. The identity and stereochemistry of the sugar phosphate determine the biochemical annotation.
functional_coherence: HETEROGENEOUS
coherence_reason: Direct recombinant UAP1 enzymology and human UDP-GlcNAc/UDP-GalNAc-bound structures
  establish an N-acetylhexosamine branch distinct from UDP-glucose pyrophosphorylase. The frog target
  retains all annotated human nucleotide-sugar contacts and lacks a 17-residue segment present in the
  longer human isoform; that difference does not establish a frog-specific substrate ratio.
subfamilies:
- subfamily_id: PANTHER:PTHR11952:SF4
  label: UDP-N-ACETYLHEXOSAMINE PYROPHOSPHORYLASE
  description: IPR039741 and the verified UAP1 subfamily establish an N-acetylhexosamine branch despite
    the broad family name mentioning glucose. The description of two UAP1 activities must not be interpreted
    as evidence for two independent catalytic domains. Xenopus uap1.S should be evaluated for its own
    sugar specificity and homeolog/isoform completeness.
  representative_members:
  - id: UniProtKB:Q6DCZ6
    label: Uap1-prov protein
    gene_symbol: uap1.S
    organism: Xenopus laevis
    gene_review: genes/XENLA/uap1.S/uap1.S-ai-review.yaml
