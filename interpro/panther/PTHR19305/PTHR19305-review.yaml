family_id: PANTHER:PTHR19305
family_name: SYNAPTOSOMAL ASSOCIATED PROTEIN
preferred_name: SNAP-25 family Qbc-SNAREs
summary: >-
  The SNAP-25 family of Qbc-SNAREs, which contribute two SNARE motifs (Qb and Qc)
  to the four-helix trans-SNARE bundle that drives membrane fusion. It includes
  neuronal SNAP-25, the ubiquitous plasma-membrane paralog SNAP-23, SNAP-29 and
  SNAP-47, invertebrate SNAP-25 homologs (C. elegans RIC-4, Drosophila Snap25),
  C. elegans AEX-4, yeast Sec9 and Spo20, and plant SNAP33-like proteins. All
  share the SNARE fusogenic activity; they differ in which membrane and which
  trafficking route they act on, and synaptic vesicle exocytosis is a property of
  the neuronal SNAP-25 lineage only.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The Qbc-SNARE activity, syntaxin binding and SNARE-complex membership are shared
  by the characterized members. The compartment and process are not: SNAP-25
  (SF5) and its invertebrate homologs (SF14) act in synaptic vesicle exocytosis,
  SNAP-23 (SF4) in constitutive and non-neuronal regulated exocytosis and in
  endosome-to-plasma-membrane recycling, and SNAP-29 (SF9) mainly in
  intracellular fusion steps. Synaptic vesicle terms are therefore safe only for
  the SNAP-25 lineage, and the PAINT node that carries them reaches SNAP-23.
