notes: >-
  PAINT data were fetched for this review (just fetch-panther-paint). Reviewed
  members examined: human SNAP25 (SF5), C. elegans ric-4 (SF14) and, because the
  synaptic-vesicle IBAs reach it, human SNAP23 (SF4). Which PAINT nodes reach which
  genes was read from the PTN ids in their GOA IBA rows, not from the tree. Not
  examined: SNAP-29 (SF9, including yeast and C. elegans snap-29), SNAP-47 (SF1),
  C. elegans AEX-4 (SF10), the plant SNAP33-like and other plant subfamilies, and
  the remaining T-SNARE coiled-coil subfamilies. GO:0005484 is labelled "helical-bundle
  zippering fusogenic activity" in current GOA/QuickGO; the local ontology
  snapshot used by the validators still has "SNAP receptor activity", which is
  used here.
