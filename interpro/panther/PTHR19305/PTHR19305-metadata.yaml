  name:
    name: SNAP-25/SVAP1 Membrane Fusion
    short: SNAP-25/SVAP1
  description:
  - text: The SNAP-25/SVAP1 protein family is involved in the regulation of intracellular
      membrane fusion processes, which are critical for vesicle trafficking, neurotransmitter
      release, and cytokinesis. Members of the family function as t-SNAREs or v-SNAREs,
      forming trans-SNARE complexes that drive membrane fusion. These proteins are
      essential for the fusion of cellular membranes, including processes like exocytosis,
      autophagy, and ciliogenesis. They associate with other proteins involved in
      vesicle docking and membrane fusion, and some members regulate plasma membrane
      recycling and modulate ion channel characteristics. The family also includes
      proteins that play roles in sporulation and the secretion of enzymes or other
      factors.
