term_assessments:
- assessed_term:
    id: GO:0015221
    label: lipopolysaccharide transmembrane transporter activity
  scope: FAMILY_WIDE
  scope_reason: >-
    With LptE, LptD passes LPS from the periplasmic bridge through the outer membrane
    into its outer leaflet; members carry the term with the contributes_to qualifier
    because the activity belongs to the LptD/LptE pair.
  supported_by:
  - reference_id: PMID:29449493
    supporting_text: LptDE inserts LPS into the outer leaflet of the outer membrane
- assessed_term:
    id: GO:1990351
    label: transporter complex
  scope: FAMILY_WIDE
  scope_reason: >-
    True for every member, as the barrel subunit of the LptD/LptE translocon; member reviews refine it to GO:0062051
    rather than reject it.
- assessed_term:
    id: GO:0062051
    label: lipopolysaccharide transport system
  scope: FAMILY_WIDE
  scope_reason: >-
    The LptD/LptE translocon is the outer-membrane part of the seven-protein Lpt
    machine; the E. coli and P. putida member reviews carry this term as their core
    complex.
  supported_by:
  - reference_id: PMID:29449493
    supporting_text: Thus, all seven Lpt proteins and ATP are necessary and sufficient
      for membrane-to-membrane transport to occur.
- assessed_term:
    id: GO:0015920
    label: lipopolysaccharide transport
  scope: FAMILY_WIDE
  scope_reason: >-
    LPS insertion is the defining activity of LptD. Members from diderms without canonical
    LPS (Deinococcus, Thermotoga) are untested and may move other surface glycolipids; no
    evidence of loss exists, so the scope is not narrowed.
  supported_by:
  - reference_id: PMID:18424520
    supporting_text: >-
      Our results suggest that LptA, LptB, LptC, LptD, and LptE operate in the LPS
      assembly pathway
- assessed_term:
    id: GO:0009279
    label: cell outer membrane
  scope: FAMILY_WIDE
  scope_reason: >-
    Outer-membrane beta-barrel in all bacterial members; the plant leaves are handled by
    PAINT IRD rows rather than by narrowing the scope.
