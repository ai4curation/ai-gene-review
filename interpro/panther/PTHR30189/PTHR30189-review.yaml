notes: >-
  Tree composition was read from the PANTHER 19.0 treeinfo service: 25 SF1 leaves, all
  under PTN001249597. The Ricinus communis leaves sit under the HORIZ_TRANSFER node
  PTN008624292. Ricinus leaves also appear in the LptB (PTHR45772:SF10), LptF/G
  (PTHR33529) and LptE (PTHR38098) trees, which is consistent with bacterial sequence in
  the Ricinus assembly; that origin is not established here and is not needed for the
  verdicts. Reviewed for the bacterial_lps_transport module.
