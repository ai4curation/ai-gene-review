family_id: PANTHER:PTHR30189
family_name: LPS-ASSEMBLY PROTEIN
preferred_name: LptD outer-membrane LPS translocon family
summary: >-
  LptD proteins are the outer-membrane component of the lipopolysaccharide transport (Lpt)
  system of diderm bacteria. Each has an N-terminal periplasmic beta-jellyroll domain that
  joins the LptA bridge and a C-terminal 26-stranded beta-barrel that, with the plug
  lipoprotein LptE, forms the LptD/LptE translocon. LPS arriving through the bridge is
  released through a lateral opening of the barrel into the outer leaflet of the outer
  membrane. In Escherichia coli LptD (formerly Imp/OstA) is essential and was first noticed
  through mutations that increase outer-membrane permeability to organic solvents and
  antibiotics. The family is a single PANTHER subfamily and its distribution tracks
  diderm bacteria with an outer membrane.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  One subfamily (SF1) of LptD translocons. The reference tree also includes homologues from
  diderms that lack canonical lipid A-core LPS (Deinococcus radiodurans, Thermotoga
  maritima), where the transported glycolipid has not been established, and two Ricinus
  communis leaves (B9TE54, B9THV2) on a horizontal-transfer branch that PAINT already
  excludes from the outer-membrane term by IRD.
