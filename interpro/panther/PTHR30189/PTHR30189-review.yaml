notes: The frozen tree contains 25 SF1 leaves. Existing outer-membrane IRDs for B9TE54 and B9THV2 are
  unchanged and now mirrored in term-scope exceptions. Plant labels are not treated as proof of contamination
  or horizontal transfer. Native H44/76 LptD F0MIT7 has direct surface-localization evidence but is not
  an exact leaf in this limited cache; Q9K187 is the cached Neisseria leaf. Do not substitute them as
  an identity proof. The gene consultation independently establishes the H44/76 target. Scope uncertainty
  concerns family-wide cargo, not the positive bacterial module examples.
