term_assessments:
- assessed_term:
    id: GO:0015221
    label: lipopolysaccharide transmembrane transporter activity
  scope: UNRESOLVED
  scope_reason: Characterized E. coli LptD and native H44/76 LptD support LPS insertion and participation
    in the LPS transport system. However, the same SF1 contains Q9RWU2 from non-LPS-producing Deinococcus
    and Q9X257 from Thermotoga. Their native cargo and exact activity are not established. No existing
    subfamily separates the positive LPS cohort from these homologs, so family-wide LPS-specific scope
    remains unresolved. This does not negate the positive named members or establish an evolutionary loss;
    the module must require LPS/LOS substrate and compatible machinery. LptE-dependent assembly/transport
    requirements also differ between E. coli and Neisseria.
  supported_by:
  - reference_id: PMID:29449493
    supporting_text: LptDE inserts LPS into the outer leaflet of the outer membrane
