notes: 'The module molybdenum_cofactor_biosynthesis grounds its MoeB step on SF194. Other modules ground
  ATG7 (SF3; autophagosome_core_biogenesis, metazoan_autophagosome_biogenesis) and ThiF (SF240; thiamine_diphosphate_biosynthesis)
  in this family. Their ATG7 activities are assessed SUBFAMILY_ONLY for SF3. The ThiF row there asserts
  GO:0008641, which is left UNRESOLVED here because its thiolester-bond definition has not been checked
  for ThiF. Only the PAINT rows on the path from the root to MoeB are node-assessed; the eukaryotic E1
  clade gains and their IRD losses relative to PTN000102040 are left for a review centred on those enzymes.
  The tree check was generated from the PANTHER 19 treeinfo service on 2026-11-10.'
