family_id: PANTHER:PTHR10953
family_name: UBIQUITIN-ACTIVATING ENZYME E1
preferred_name: E1-like ThiF/MoeB adenylating-enzyme superfamily
summary: PTHR10953 contains the E1-like enzymes that adenylate the C-terminal glycine of a ubiquitin-fold
  protein. The bacterial members include MoeB, which activates the MoaD sulfur carrier of molybdopterin
  synthase, ThiF, which activates ThiS in thiamine biosynthesis, and rhodanese-domain MoeZ-type proteins.
  The eukaryotic members include MOCS3/UBA4 and the ubiquitin, SUMO, NEDD8, UFM1, ATG7 and ATG12 activating
  enzymes. The shared chemistry is ATP-dependent adenylation of a carrier C terminus; the carrier, the
  downstream thioester or thiocarboxylate chemistry and the biological process differ between subfamilies.
functional_coherence: HETEROGENEOUS
coherence_reason: All members share the ThiF-type adenylation domain, but substrate carriers and downstream
  chemistry differ between subfamilies. Molybdopterin-synthase adenylyltransferase activity belongs
  to the MoeB subfamily SF194 and to the MOCS3 members of the mixed SF102. ThiS adenylation belongs to
  SF240, and ubiquitin-like modifier activation to the eukaryotic E1 clades. A rhodanese-like sulfurtransferase domain is present only in the MOCS3/UBA4/MoeZ
  lineage (SF102). This review assesses only the root and bacterial-clade PAINT rows that reach MoeB;
  the eukaryotic E1 clade rows are out of scope here.
