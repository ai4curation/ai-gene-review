    gene_symbol: UBA4
    organism: Saccharomyces cerevisiae (strain ATCC 204508 / S288c)
  clade_node_id: PANTHER:PTN000102535
  divergence_description: Dual-function adenylyltransferase and sulfurtransferase (MOCS3/UBA4) that activates URM1 for protein
    urmylation (GO:0042292, GO:0032447) and transfers sulfur for tRNA wobble uridine thiolation (GO:0002143) and molybdenum
    cofactor biosynthesis (GO:0006777). Note that PANTHER:PTN000102535 places an IRD on parent term GO:0032446 (protein modification
    by small protein conjugation) even though yeast UBA4 (SGD:S000001153) is an experimental seed for the root IBD at PANTHER:PTN000102039
    and seeds child term GO:0032447 (protein urmylation) at PANTHER:PTN000102537.
