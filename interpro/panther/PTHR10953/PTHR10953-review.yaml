  - reference_id: file:interpro/panther/PTHR10953/PTHR10953-entries.csv
    supporting_text: Adenylyltransferase and sulfurtransferase UBA4
- assessed_term:
    id: GO:0004792
    label: thiosulfate-cyanide sulfurtransferase activity
  scope: UNRESOLVED
  scope_reason: Not applicable to the single-domain MoeB (SF194) or ThiF (SF240) proteins, which lack
    a rhodanese-like domain. Whether every rhodanese-domain MOCS3/UBA4/MoeZ member (SF102) catalyses the
    thiosulfate-cyanide reaction, rather than only persulfide sulfur transfer to its carrier, was not
    adjudicated here. E. coli MoeB in particular has only the ThiF adenylation domain, and no MoeB-bound
    sulfur was detected.
  supported_by:
