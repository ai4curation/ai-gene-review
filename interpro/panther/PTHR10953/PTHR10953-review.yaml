term_assessments:
- assessed_term:
    id: GO:0061605
    label: molybdopterin-synthase adenylyltransferase activity
  scope: UNRESOLVED
  scope_reason: MoaD adenylation is established for the MoeB subfamily SF194, where all members are MoeB
    proteins. It also holds for human MOCS3, but MOCS3 sits in SF102, which mixes MOCS3, fungal UBA4, cyanobacterial
    HesA, a ThiF-named protein, MoeZ-type and archaeal SAMP-activating E1 proteins. Granting the term SUBFAMILY_ONLY
    to SF194 would wrongly exclude MOCS3, and granting it to SF102 would include proteins that activate
    other carriers. The family-level scope is therefore left unresolved. SF194 members and MOCS3 rest
    on their own gene reviews.
  supported_by:
  - reference_id: file:genes/ECOLI/moeB/moeB-uniprot.txt
    supporting_text: Catalyzes the adenylation by ATP of the carboxyl group of the
  - reference_id: PMID:11463785
