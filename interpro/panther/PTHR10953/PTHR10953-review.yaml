- assessed_term:
    id: GO:0008641
    label: ubiquitin-like modifier activating enzyme activity
  scope: UNRESOLVED
  scope_reason: GO defines this activity as activation of a ubiquitin-like protein through formation of
    an ATP-dependent high-energy thiolester bond. The eukaryotic E1 and ATG7 subfamilies meet that definition.
    The bacterial ThiF (SF240) and MoeB (SF194) enzymes adenylate their ubiquitin-fold carriers (ThiS,
    MoaD), but for MoeB no E1-like thioester intermediate was observed. Whether ThiF forms a thioester
    with ThiS was not adjudicated here, so the term is not granted to SF240 or SF194.
  supported_by:
  - reference_id: PMID:21724998
    supporting_text: ThiFS forms a stable complex, and ThiF catalyzes the adenylation of the terminal glycine
      residue of ThiS
  - reference_id: PMID:11463785
    supporting_text: unlike
      the ubiquitin activation reaction, the formation of a thioester intermediate
      between MoeB and MoaD could not be observed.
