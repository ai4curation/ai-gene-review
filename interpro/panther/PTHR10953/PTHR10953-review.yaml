  assessment_reason: Root-level assertion of GO:0032446 (protein modification by small protein conjugation) at PANTHER:PTN000102039
    (LUCA) is supported by 38 eukaryotic E1 seeds (including yeast UBA4 SGD:S000001153 in PANTHER:PTHR10953:SF102) but over-propagates
    to prokaryotic sulfur-carrier adenylyltransferases (MoeB in PANTHER:PTHR10953:SF194 and ThiF in PANTHER:PTHR10953:SF240)
    that do not catalyze protein conjugation; additionally, PANTHER:PTN000102535 (Eukaryota, PANTHER:PTHR10953:SF102 MOCS3/UBA4)
    places a contradictory IRD on GO:0032446 even though UBA4 seeds both the root IBD and child term GO:0032447 (protein urmylation)
    at PANTHER:PTN000102537.
