  divergence_description: Mammalian ubiquitin-like modifier-activating enzyme 7 (UBA7/UBE1L) specialized for ISG15 activation
    in innate antiviral immunity rather than canonical ubiquitin conjugation, with PANTHER:PTN008313461 (Mammalia) placing
    negated IRDs on GO:0004839 (ubiquitin activating enzyme activity), GO:0006511 (ubiquitin-dependent protein catabolic process),
    and GO:0016567 (protein ubiquitination) (and parent node PANTHER:PTN000102404 blocking GO:0004792 and GO:0016779). However,
    PANTHER:PTN008313461 also places a negated IRD on GO:0005634 (nucleus), which contradicts both the ancestral IBD at PANTHER:PTN000102404
    (where UniProtKB:P41226 UBA7 is one of the 6 experimental seeds) and in-repo UBA7 curation (which retains GO:0005634 nucleus).
