family_id: PANTHER:PTHR10953
family_name: UBIQUITIN-ACTIVATING ENZYME E1
preferred_name: Ubiquitin-Activating Enzyme E1
summary: UBIQUITIN-ACTIVATING ENZYME E1 (PANTHER:PTHR10953) is characterized in PANTHER PAINT across 14 ancestral PTN node(s)
  (PANTHER:PTN000102039, PANTHER:PTN000102040, PANTHER:PTN000102043, PANTHER:PTN000102114 (+10 more)) with 39 IBD node assertion(s)
  and 7 term(s) carrying negated IRD/IKR branch blocks, covering protein modification by small protein conjugation (GO:0032446,
  BP), cytoplasm (GO:0005737, CC), thiosulfate-cyanide sulfurtransferase activity (GO:0004792, MF), nucleotidyltransferase
  activity (GO:0016779, MF) and 28 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR10953 (UBIQUITIN-ACTIVATING ENZYME E1) span 14 distinct ancestral PTN
  nodes (PANTHER:PTN000102039, PANTHER:PTN000102040, PANTHER:PTN000102043, PANTHER:PTN000102114, PANTHER:PTN000102175 (+9
  more)) with different molecular function assignments across clades (thiosulfate-cyanide sulfurtransferase activity (GO:0004792),
  nucleotidyltransferase activity (GO:0016779), SUMO activating enzyme activity (GO:0019948), NEDD8 activating enzyme activity
  (GO:0019781) and 8 additional molecular function term(s)), indicating clade-level functional specialization across the family.
