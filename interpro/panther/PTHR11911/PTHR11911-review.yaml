family_id: PANTHER:PTHR11911
family_name: INOSINE-5-MONOPHOSPHATE DEHYDROGENASE RELATED
preferred_name: IMP dehydrogenase / GMP reductase family
summary: >-
  IMP dehydrogenases oxidize IMP to XMP, the rate-limiting step of GTP synthesis; they are the target
  of mycophenolic acid. The family contains bacterial GuaB, the S. cerevisiae IMD2-4 paralogs, human
  IMPDH1/2 and plant IMPDH. It also contains GMP reductases, which reduce GMP back to IMP.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  IMPDH activity holds across the IMPDH subfamilies. GMP reductase (SF122) catalyses the reverse-direction
  reduction of GMP.
