family_id: PANTHER:PTHR13773
family_name: PHOSPHATIDATE CYTIDYLYLTRANSFERASE
preferred_name: CDS-type (integral membrane) CDP-diacylglycerol synthase family
summary: >-
  Integral-membrane CTP:phosphatidate cytidylyltransferases (CDP-diacylglycerol synthases,
  EC 2.7.7.41) that convert phosphatidic acid and CTP to CDP-diacylglycerol, the activated
  lipid donor for phosphatidylinositol and phosphatidylserine (and, in other compartments,
  phosphatidylglycerol/cardiolipin) synthesis. Members are eukaryotic ER-membrane enzymes
  (S. cerevisiae CDS1, S. pombe SPBC13A2.03, human CDS1/CDS2, fly Cds, worm cdgs-1, plant
  CDS1-3) plus Mycoplasma CdsA. The E. coli and B. subtilis CdsA proteins are in a separate
  PANTHER family (PTHR46382), and the mitochondrial CDP-DAG synthase Tam41 is an unrelated
  enzyme (PTHR13619).
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member is a CDP-diacylglycerol synthase; PAINT places the activity, the
  CDP-DAG biosynthetic process and ER membrane at one Eukaryota root node (PTN000349519) that
  reaches all eukaryotic SwissProt members present in the PAINT GAF. Subfamily splits reflect lineage-specific paralogs (vertebrate
  CDS1 vs CDS2, plant CDS1-3), not different reactions.
  The official subfamily name of SF8 ("PHOTORECEPTOR-SPECIFIC", after Drosophila Cds) is
  misleading for its yeast, worm and Mycoplasma members.
