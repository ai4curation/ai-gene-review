  assessment_reason: >-
    Seeds span fungi, animals, plants and Plasmodium; in the cached GAF the node reaches 181
    proteins, including 16 of the 19 SwissProt members (all except the two Mycoplasma CdsA
    entries and Encephalitozoon CDS1, which are absent from the PAINT GAF). The S. cerevisiae CDS1 gene review accepts the IBA. This is
    the node behind the CDP-DAG module's ER CDS annoton.
- node_id: PANTHER:PTN000349519
  asserted_term:
    id: GO:0140042
    label: lipid droplet formation
  node_taxon:
    id: NCBITaxon:2759
    label: Eukaryota
  paint_snapshot: '20250826'
  seeds:
