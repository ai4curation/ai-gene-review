    label: CDS2
    organism: Homo sapiens
  - id: UniProtKB:Q92903
    label: CDS1
    organism: Homo sapiens
  assessment: UNRESOLVED
  assessment_reason: >-
    All seeds are mammalian, yet the term is placed at the Eukaryota root and descends to yeast,
    plant and Plasmodium members. The likely basis is that loss of CDS raises phosphatidic acid
    and enlarges lipid droplets, which is evidence of necessity rather than of CDS doing a step
    of droplet formation; the S. cerevisiae CDS1 review keeps the IBA only as non-core for the
    same reason. The seed full texts were not reviewed here, so the node is flagged, not
    rejected; if retained, a mammalian placement would match the seeds.
term_assessments:
- assessed_term:
    id: GO:0004605
    label: phosphatidate cytidylyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The defining reaction of every characterized member. The CDP-DAG module's use of the whole
    family PANTHER:PTHR13773 for the ER CDS step is consistent with this.
  supported_by:
  - reference_id: PMID:8557688
    supporting_text: Therefore, the essential CDS1 gene encodes the majority, if not all, of the synthase activity.
- assessed_term:
    id: GO:0016024
    label: CDP-diacylglycerol biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: Direct consequence of the activity; asserted at the same root node.
- assessed_term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  scope: FAMILY_WIDE
  scope_reason: >-
    The eukaryotic members are ER-membrane enzymes; in budding yeast CDS1 is exclusively in the
    ER, with mitochondrial CDP-DAG made by the unrelated Tam41. Mycoplasma CdsA (SF8) has no ER;
    the PAINT location applies to the eukaryotic members only.
  supported_by:
  - reference_id: PMID:23623749
    supporting_text: In this study, we carefully analyzed the cellular localization of Cds1 and found that Cds1
      is exclusively present in the ER, indicating existence of another CDP-DAG synthase in mitochondria.
