family_id: PANTHER:PTHR48080
family_name: D-GALACTONATE DEHYDRATASE-RELATED
preferred_name: >-
  Enolase-superfamily acid-sugar dehydratases and the SF3 epimerase/muconate
  cycloisomerase group
summary: >-
  A large enolase-superfamily family built on the mandelate
  racemase/muconate lactonizing enzyme fold. Most of the family (SF1, SF2,
  SF4, SF5, SF6) consists of acid-sugar dehydratases: D-galactonate and
  D-gluconate dehydratases (DgoD, archaeal GAD), glucarate dehydratase (GudD)
  and its low-activity paralog GudX, D-mannonate dehydratases and the RspA
  starvation-sensing proteins, and D(-)-tartrate dehydratases. SF3 is a
  distinct group of L-Ala-D/L-Glu and dipeptide epimerases (E. coli YcjG,
  Bacteroides AEEP), 4-hydroxyproline betaine epimerase, cis-3-hydroxy-L-proline
  dehydratase and an o-succinylbenzoate synthase. SF3 also contains the
  muconate cycloisomerase of the actinobacterium Rhodococcus opacus 1CP
  (CatB), which works in the catechol ortho-cleavage pathway and matches the
  same muconate cycloisomerase family model as proteobacterial CatB. The
  proteobacterial CatB proteins are classified in PTHR48073.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family groups acid-sugar dehydratases (hydro-lyases) with the SF3
  epimerases, racemases, OSBS and the actinobacterial muconate cycloisomerase
  (an intramolecular lyase). Hydro-lyase activity is safe only outside SF3,
  and even among the dehydratases the substrate (galactonate, gluconate,
  glucarate, mannonate, tartrate) is clade-specific.
