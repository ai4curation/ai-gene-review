  name:
    name: Oxylipin biosynthesis and metabolism
    short: Oxylipin_biosynth_metab
  description:
  - text: The protein family is involved in the biosynthesis and metabolism of oxylipins,
      which are signaling molecules derived from polyunsaturated fatty acids. Members
      of the family exhibit dual cyclooxygenase and peroxidase activities, catalyzing
      the conversion of arachidonic acid to prostaglandin G2 and subsequently to prostaglandin
      H2, precursors to various prostanoids involved in inflammatory responses. Some
      members also produce hydroxyoctadecadienoates from linoleic acid and contribute
      to the generation of specialized pro-resolving mediators during inflammation.
      Additionally, the family includes enzymes that catalyze the primary oxygenation
      of fatty acids into hydroperoxides, playing roles in cell signaling, wound healing,
      and protection from infection. The family's activity is regulated by nonsteroidal
      anti-inflammatory drugs and other inhibitors, indicating its significance in
      both physiological and pathological processes.
