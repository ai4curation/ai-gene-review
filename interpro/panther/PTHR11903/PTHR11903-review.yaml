family_id: PANTHER:PTHR11903
family_name: PROSTAGLANDIN G/H SYNTHASE
preferred_name: Oxylipin oxygenase and collagen triple-helix repeat family
summary: PTHR11903 contains several oxylipin oxygenase groups, including vertebrate PTGS1/COX-1 and
  PTGS2/COX-2 prostaglandin G/H synthases, plant alpha-dioxygenases, fungal linoleate dioxygenases
  and the chordate CTHRC1 collagen triple-helix repeat proteins. PTGS1/PTGS2 retain heme-dependent
  cyclooxygenase and peroxidase chemistry, whereas CTHRC1 is a secreted extracellular protein and
  should not inherit prostaglandin synthase activity, the cyclooxygenase pathway or PTGS
  membrane/neuron localizations.
functional_coherence: HETEROGENEOUS
coherence_reason: The PTGS subfamilies are ER/nuclear-envelope heme prostaglandin synthases, plant
  and fungal subfamilies are separate fatty-acid oxygenases, and PTHR11903:SF18 CTHRC1 is a secreted
  collagen triple-helix protein with no prostaglandin G/H synthase role.
