family_id: PANTHER:PTHR11365
family_name: 5-OXOPROLINASE RELATED
preferred_name: 5-Oxoprolinase / hydantoinase family
summary: >-
  ATP-dependent 5-oxoprolinases open 5-oxoproline (pyroglutamate) to glutamate, closing the gamma-glutamyl
  cycle (S. cerevisiae OXP1, S. pombe oxp1 and oxp2, human OPLAH). Bacterial hydantoinase/oxoprolinase-related
  proteins (SF23) form a separate subfamily.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The eukaryotic 5-oxoprolinases (SF2) are uniform. SF23 bacterial members are hydantoinase-related,
  with activities not established here.
