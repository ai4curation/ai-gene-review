  name:
    name: FAD-dependent Oxidoreductases and Apoptosis Regulators
    short: FAD-oxidoreductase/Apoptosis
  description:
  - text: The FAD-dependent oxidoreductase family is characterized by its involvement
      in various oxidation-reduction processes. Members of this family function as
      electron transfer components in multicomponent enzyme systems, catalyzing reactions
      that involve the transfer of electrons from NAD(P)H to different substrates,
      often through intermediary proteins like ferredoxins. These proteins play roles
      in the metabolism of aromatic compounds, including the degradation of herbicides
      and pollutants, and in the regulation of apoptosis. Some family members are
      involved in the detoxification of reactive oxygen species, while others participate
      in normal mitochondrial function and biogenesis of the respiratory chain. The
      family includes proteins that act as NADH oxidoreductases, apoptosis-inducing
      factors, and components of dioxygenase systems for the hydroxylation of aromatic
      rings.
