family_id: PANTHER:PTHR24072
family_name: RHO FAMILY GTPASE
summary: Rho-family proteins share a small-GTPase fold and regulate cellular organization through nucleotide-dependent
  interactions. Their catalytic and regulatory properties vary among conventional and atypical branches.
functional_coherence: HETEROGENEOUS
coherence_reason: Direct full-length RHOJ/TCL experiments establish GDP/GTP exchange and intrinsic GTP
  hydrolysis, while mutational analysis identifies N-terminal and distal-loop determinants of exchange
  and membrane association. This does not establish identical kinetics for other Rho branches. The selected
  153-residue RHOJ product preserves only the first 103 residues continuously and has a divergent remainder
  lacking the complete reference nucleotide-recognition architecture.
subfamilies:
- label: Benchmark members without resolved subfamily placement
  description: The selected human RHOJ product has a verified same-gene sequence relationship but an altered
    C-terminal half. Full-length RHOJ is an active GTPase; activity and localization of this particular
    shortened product remain unresolved.
