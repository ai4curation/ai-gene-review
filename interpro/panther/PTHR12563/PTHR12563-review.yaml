    label: acyltransferase activity, transferring groups other than amino-acyl groups
  scope: FAMILY_WIDE
  scope_reason: The member inventory includes bacterial PlsB, mitochondrial GPAT1/GPAT2 and DAPAT proteins.
    Shared acyl transfer does not establish identical acceptor specificity, organelle localization or
    acyl-chain preference. The GPAT1 structure supports GPAM inference but does not establish the same
    substrate preference for every family member.
- assessed_term:
    id: GO:0004366
    label: glycerol-3-phosphate O-acyltransferase activity
  scope: UNRESOLVED
  scope_reason: The GPAM/GPAT1 branch in SF16 has directly demonstrated glycerol-3-phosphate acyltransferase
    activity. The family also contains GPAT2 and bacterial PlsB proteins, so this activity is not exclusive
    to SF16. DAPAT proteins introduce a different acceptor specificity. The exhaustive set of substrate-compatible
    branches remains unresolved; the GPAT1 experiment establishes a positive example rather than an exclusion
    of other GPAT enzymes.
