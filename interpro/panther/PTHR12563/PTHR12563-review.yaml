family_id: PANTHER:PTHR12563
family_name: GLYCEROL-3-PHOSPHATE ACYLTRANSFERASE
preferred_name: GPAT/DAPAT lipid acyltransferases
summary: This family contains glycerol-3-phosphate acyltransferases and dihydroxyacetone phosphate acyltransferases,
  which initiate different branches of glycerolipid synthesis. Human GPAM/GPAT1 transfers an acyl group
  to glycerol-3-phosphate at the mitochondrial outer membrane. Its experimentally determined membrane
  association uses an amphipathic surface rather than the transmembrane topology formerly proposed.
functional_coherence: HETEROGENEOUS
coherence_reason: The member inventory includes bacterial PlsB, mitochondrial GPAT1/GPAT2 and DAPAT proteins.
  Shared acyl transfer does not establish identical acceptor specificity, organelle localization or acyl-chain
  preference. The GPAT1 structure supports GPAM inference but does not establish the same substrate preference
  for every family member.
