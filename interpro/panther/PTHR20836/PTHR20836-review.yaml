family_id: PANTHER:PTHR20836
family_name: DIHYDRODIPICOLINATE REDUCTASE
preferred_name: DapB 4-hydroxy-tetrahydrodipicolinate reductase family
summary: Family of NAD(P)H-dependent 4-hydroxy-tetrahydrodipicolinate reductases (DapB, EC 1.17.1.8) with
  an N-terminal Rossmann-type dinucleotide-binding domain and a C-terminal substrate-binding/tetramerisation
  domain. DapB dehydrates and reduces the DapA product HTPA to tetrahydrodipicolinate in the second step
  of the diaminopimelate pathway of lysine biosynthesis in bacteria and plants. Almost all reviewed members
  are bacterial DapB enzymes in SF0; plants have chloroplastic DAPB paralogs and a divergent chloroplast
  protein, CRR1 (SF6), that is involved in NDH complex assembly rather than lysine synthesis.
functional_coherence: MOSTLY_COHERENT
coherence_reason: The bacterial and plant DapB members share one reaction; the exception is the land-plant
  CRR1 lineage, which PAINT cuts off from the reductase activity with an IRD.
