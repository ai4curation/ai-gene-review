family_id: PANTHER:PTHR11164
family_name: GLUTAMATE CYSTEINE LIGASE
preferred_name: Glutamate-cysteine ligase catalytic subunit (GCLC/GSH1) family
summary: >-
  Glutamate-cysteine ligases make gamma-glutamylcysteine, the first and rate-limiting step of glutathione
  synthesis. Animal GCLC is regulated by the modifier subunit GCLM. The family contains S. cerevisiae
  GSH1, S. pombe gcs1 and human GCLC.
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF0) of catalytic glutamate-cysteine ligases.
