  name:
    name: AP2-associated Ser/Thr protein kinase
    short: AP2_assoc_SerThr_kinase
  description:
  - text: The AP2-associated protein kinase family is involved in the regulation of
      clathrin-mediated endocytosis. Members of this family phosphorylate the AP2M1/mu2
      subunit of the adaptor protein complex 2 (AP-2), enhancing AP-2's affinity for
      cargo membrane proteins during endocytosis initiation. They may preferentially
      phosphorylate threonine residues and also regulate the phosphorylation of other
      AP-2 subunits, AP-2 localization, and AP-2-mediated internalization of ligand
      complexes. Additionally, they phosphorylate NUMB, influencing its endosomal
      localization, and bind to NOTCH1, stabilizing its activated form and modulating
      its transcriptional activity. Some members are implicated in osteoblast differentiation,
      and others play a role in viral entry and lifecycle, including hepatitis C,
      Ebola, and Dengue viruses.
