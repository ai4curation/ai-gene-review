- subfamily_id: PANTHER:PTHR43197:SF2
  label: UTP--GLUCOSE-1-PHOSPHATE URIDYLYLTRANSFERASE
  description: >-
    Enterobacterial GalF (E. coli, Salmonella, Shigella, Klebsiella), encoded at the start of
    O-antigen and capsule gene clusters.
  diverged_from_family: true
  divergence_description: >-
    GalF descends from a catalytic UDP-glucose pyrophosphorylase but has only very low residual
    activity compared with GalU; it can partly complement a galU mutant only when over-expressed.
    The UDP-glucose pyrophosphorylase activity term is still true for GalF but does not describe
    its main physiological role, which remains poorly defined.
  supported_by:
  - reference_id: PMID:26617591
    supporting_text: we show that GalF derives from a catalytic (UDP-glucose pyrophosphorylase)
      ancestor, but its activity is very low compared to GalU
