- assessed_term:
    id: GO:0003983
    label: UTP:glucose-1-phosphate uridylyltransferase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    The defining activity of the family, seeded across Gram-negative and Gram-positive bacteria.
    Asserted by the udp_glucose_and_udp_galactose_biosynthesis module with E. coli GalU and P.
    putida GalU (SF1). GalF (SF2) has only residual activity but is not catalytically dead.
  supported_by:
