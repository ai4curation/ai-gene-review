notes: >-
  Node coverage was read from the PAINT UniProt GAF (gene_association.paint_uniprot.gaf): B.
  subtilis GtaB, Mycoplasma genitalium GalU and M. jannaschii MJ1334 inherit GO:0003983, and
  GtaB and M. genitalium GalU also inherit GO:0009244 from PTN000501197. Eukaryotic UDP-glucose
  pyrophosphorylases (UGP1, UGP2) are not in this family. Seed O05576 was not resolved to a gene
  name here. Subfamily labels for SF1 and SF2 are identical in PANTHER; GalF identity of SF2 comes
  from the entries file.
