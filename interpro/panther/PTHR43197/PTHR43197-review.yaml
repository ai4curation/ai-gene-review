family_id: PANTHER:PTHR43197
family_name: UTP--GLUCOSE-1-PHOSPHATE URIDYLYLTRANSFERASE
preferred_name: Prokaryotic UDP-glucose pyrophosphorylase family (GalU/GtaB/HasC, UDPGP type 2)
summary: >-
  Prokaryotic UTP--glucose-1-phosphate uridylyltransferases (UDP-glucose pyrophosphorylases, EC
  2.7.7.9) of the UDPGP type 2 family, a nucleotidyltransferase fold distinct from the eukaryotic
  UGP1/UGP2 enzymes. Members catalyse the Mg2+-dependent, reversible formation of UDP-glucose and
  diphosphate from UTP and alpha-D-glucose 1-phosphate. UDP-glucose made by these enzymes is the
  glucosyl donor for lipopolysaccharide core, capsule and exopolysaccharides, teichoic acids and
  glucolipid membrane anchors, trehalose, cellulose and membrane-derived oligosaccharides, and the
  substrate of GalE for UDP-galactose. The family includes E. coli GalU, P. aeruginosa and P.
  putida GalU, B. subtilis GtaB (and the paralogs YngB and YtdA), staphylococcal GtaB, the
  streptococcal capsule/hyaluronan enzymes HasC and Cap3C/Cap4C, Komagataeibacter CelA, Rhizobium
  ExoN, Mycoplasma GalU and the archaeal M. jannaschii MJ1334. A second enterobacterial subfamily,
  GalF, derives from a catalytic ancestor but retains only very low pyrophosphorylase activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reaction is shared across the family. The enterobacterial GalF subfamily (SF2) is a
  partially inactivated paralog with residual UDP-glucose pyrophosphorylase activity far below
  that of GalU. Physiological roles depend on the cell envelope of the lineage (LPS core in
  Gram-negative bacteria, teichoic acid and glucolipid anchors in Gram-positive bacteria, capsule
  in streptococci), but the reaction does not.
