  assessment: TOO_DEEP
  assessment_reason: >-
    Both seeds are Gram-negative GalU enzymes whose UDP-glucose supplies LPS core
    glucosylation. The node, however, also covers Gram-positive and wall-less members that make no
    lipopolysaccharide: the PAINT GAF gives GO:0009244 to B. subtilis GtaB (Q05852) and Mycoplasma
