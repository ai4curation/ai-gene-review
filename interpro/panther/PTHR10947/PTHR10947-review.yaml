summary: PHENYLALANYL-TRNA SYNTHETASE BETA CHAIN AND LEUCINE-RICH REPEAT-CONTAINING PROTEIN 47 (PANTHER:PTHR10947)
  is characterized in PANTHER PAINT across 1 ancestral PTN node(s) (PANTHER:PTN000101805) with 3 IBD node
  assertion(s) and 0 term(s) carrying negated IRD/IKR branch blocks, covering phenylalanine-tRNA ligase
  complex (GO:0009328, CC), phenylalanine-tRNA ligase activity (GO:0004826, MF), phenylalanyl-tRNA aminoacylation
  (GO:0006432, BP).
functional_coherence: MOSTLY_COHERENT
coherence_reason: Core family functions (phenylalanine-tRNA ligase complex (GO:0009328, CC), phenylalanine-tRNA
  ligase activity (GO:0004826, MF), phenylalanyl-tRNA aminoacylation (GO:0006432, BP)) are conserved across
  the primary ancestral clade, while PANTHER:PTHR10947:SF3 (LEUCINE-RICH REPEAT-CONTAINING PROTEIN 47)
  represents a distinct subfamily architecture and GO:0004826 carries a subunit-qualifier distinction
  (contributes_to vs direct catalysis) in pheT (Q88K22).
