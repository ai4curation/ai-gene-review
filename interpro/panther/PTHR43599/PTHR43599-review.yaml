  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The SAICAR synthetase activity is right for the bacterial PurC and animal PAICS clades that the
    seeds represent. The PAINT row records taxon:2 (Bacteria) for the node, even though its
    recipients include animal PAICS. The cached PAINT UniProt GAF lists 68 recipients. A Pfam check of
    all of them found 9 with Pfam matches but no SAICAR synthetase domain (PF01259), and 4 with no
    Pfam data. The 9 fall on two branches. The first is proteobacterial RimK-like ATP-grasp proteins:
    P. aeruginosa PA1345 and PA1944 (SF1) and Vibrio cholerae VC_2333. The second is vertebrate
    proteins made only of Myb/SANT-like domains: zebrafish fc32g12 (SF8) and unreviewed Myb/SANT
    proteins from medaka, macaque, opossum and platypus. These branches need IRDs; the companion IBDs at
    this node (GO:0006189 'de novo' IMP biosynthetic process, GO:0005829 cytosol) reach the same
    proteins. For the PF01259-containing recipients the placement is sound, and the human PAICS gene
    review accepts the inherited activity.
