notes: >-
  Domain evidence comes from interpro/panther/PTHR43599/ptn_domain_check.py (PTHR43599 PTN009171110
  GO:0004639 PF01259), which lists the Pfam architecture of every PAINT recipient of the node. The SF3
  outliers that do not inherit from the node (X1WBH5, Q9W2G2) were checked separately and are listed
  in PTHR43599-domains-SF3-outliers.md. SF7 (NOVEL PROTEIN; zebrafish Q7SZZ0, 163 residues, no Pfam
  match) is not described. Several vertebrate PAICS recipients carry a Myb/SANT-like domain next to
  the PAICS domains, which suggests readthrough or fused gene models. That may be how Myb/SANT-only
  proteins came into the family, but it was not tested.
