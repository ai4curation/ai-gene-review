- assessed_term:
    id: GO:0004638
    label: phosphoribosylaminoimidazole carboxylase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The module asserts the direct (class II) AIR carboxylase for the whole family
    (direct_air_carboxylase_activity uses PANTHER:PTHR43599). The activity belongs to the C-terminal
    class II PurE domain (PF00731) of PAICS fusions. Every vertebrate PAICS in SF11 has that domain.
    Bacterial PurC, SF1 and SF8 proteins do not. The invertebrate PAICS fusions (Drosophila Paics,
    C. elegans pacs-1) also carry the domain but sit in SF3 with domain-less bacterial PurC, so SF3
    cannot be granted as a whole. Applicability follows domain architecture. SF11 is the only
    subfamily for which the term is safe by label.
  applicable_subfamilies:
  - id: PANTHER:PTHR43599:SF11
    label: BIFUNCTIONAL PHOSPHORIBOSYLAMINOIMIDAZOLE CARBOXYLASE_PHOSPHORIBOSYLAMINOIMIDAZOLE SUCCINOCARBOXAMIDE
      SYNTHETASE
  supported_by:
  - reference_id: PMID:17224163
    supporting_text: Based on structural comparison and functional complementation analyses, the active
      sites of SAICARs and AIRc were identified, including a putative substrate CO(2)-binding site.
  - reference_id: PMID:2253271
    supporting_text: its 3' terminal half corresponds to the catalytic subunit of Escherichia coli and B.
      subtilis AIR carboxylase (E.C.4.1.1.21).
  - reference_id: file:interpro/panther/PTHR43599/PTHR43599-PTN009171110-domains.md
    supporting_text: '- P22234 PAICS (taxon:9606; PTHR43599:SF11): PF01259 SAICAR synthetase 12-238; PF00731
