family_id: PANTHER:PTHR43599
family_name: MULTIFUNCTIONAL PROTEIN ADE2
preferred_name: PurC-type SAICAR synthetases and animal PAICS (PurC + class II PurE) fusions
summary: >-
  This family's catalytic core is the PurC-type SAICAR synthetase domain (Pfam PF01259). The domain
  catalyses the ATP-dependent ligation of L-aspartate to 4-carboxy-5-aminoimidazole ribonucleotide
  (CAIR), giving SAICAR, step 7 of de novo IMP synthesis. Bacterial members (E. coli, B. subtilis,
  Pseudomonas PurC) are standalone SAICAR synthetases. Animal members are PAICS, a bifunctional
  protein: the N-terminal SAICAR synthetase domain is fused to a C-terminal class II PurE domain
  (PF00731) that carboxylates AIR directly with CO2 (AIR carboxylase, EC 4.1.1.21). Human PAICS forms
  an octamer with tunnels connecting the two kinds of active site. Despite PANTHER's family name, the
  family does not contain fungal ADE2. That PurK-PurE fusion is in PTHR11609, and the fungal SAICAR
  synthetase Ade1 is in PTHR43700. The family also takes in sequences with no SAICAR synthetase
  domain: proteobacterial RimK-like ATP-grasp proteins and vertebrate and insect proteins made only of
  Myb/SANT-like domains.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Three functional groups are mixed, and the PANTHER subfamily labels do not separate them.
  (1) Standalone bacterial PurC (SAICAR synthetase only) is in SF3, named SI:DKEY-6E2.2.
  (2) Bifunctional PAICS (SAICAR synthetase plus class II AIR carboxylase) is in SF11 for
  vertebrates, but in SF3 for Drosophila Paics and C. elegans pacs-1. (3) Sequences without the
  SAICAR synthetase domain: SF1 (ATP-GRASP DOMAIN-CONTAINING PROTEIN) holds RimK-like ATP-grasp
  proteins such as P. aeruginosa PA1345 and PA1944. SF8 holds the Myb/SANT-domain zebrafish protein
  fc32g12. Even SF3's name-giving zebrafish protein si:dkey-6e2.2 (X1WBH5) and Drosophila CG10494 are
  Myb/SANT-domain proteins. So SAICAR synthetase activity is safe only for members with the PF01259
  domain, and AIR carboxylase activity only for PAICS-type fusions.
