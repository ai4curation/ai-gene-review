family_id: PANTHER:PTHR21631
family_name: ISOCITRATE LYASE/MALATE SYNTHASE
preferred_name: Isocitrate lyase / 2-methylisocitrate lyase family
summary: >-
  Isocitrate lyases cleave isocitrate to succinate and glyoxylate, the first step of the glyoxylate
  shunt (S. cerevisiae ICL1, bacterial AceA, plant and nematode ICL). A fungal mitochondrial paralog
  subfamily (ICL2, SF13) is a 2-methylisocitrate lyase of propionate catabolism.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Isocitrate lyase holds for SF3; the SF13 ICL2-type paralogs cleave 2-methylisocitrate instead.
