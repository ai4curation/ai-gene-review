subfamilies:
- subfamily_id: PANTHER:PTHR33705:SF1
  label: PHOSPHOCARRIER PROTEIN HPR
  description: Includes the characterized E. coli carbohydrate-PTS HPr; its native enzyme-I/EIIA phosphotransfer
    role is a positive control and not interchangeable with NPr solely from shared chemistry. The frozen
    reference tree also assigns the unassessed Dictyostelium HPr-domain protein F0ZH96 to SF1; this classification
    is not sufficient to transfer the characterized bacterial physiological role to that member.
  representative_members:
