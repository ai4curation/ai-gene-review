- subfamily_id: PANTHER:PTHR33705:SF2
  label: PHOSPHOCARRIER PROTEIN NPR
  description: A mixed HPr/NPr classification despite the official NPR label. Characterized members include
    nitrogen-regulatory carriers and B. subtilis sugar-PTS HPr with a phosphoserine/CcpA output. Assign
    partner-role specificity from native experiments and architecture, not this name.
  representative_members:
