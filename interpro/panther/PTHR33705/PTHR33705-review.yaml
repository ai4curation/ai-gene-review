notes: >-
  Written for the bacterial nitrogen-regulatory PTS module, whose NPr step is grounded
  on SF2 with E. coli and P. putida NPr as representatives. Subfamily counts are from the
  PANTHER entries inventory (64 reviewed members: SF2 49, SF1 13, SF5 2); P. putida
  KT2440 PP_0948 (Q88PA2, unreviewed) is placed in SF2 by its DR PANTHER line. The
  reference protein is E. coli NPr, which anchors the module step and has a complete
  gene review. Neither the PAINT seeds nor the IBD row distinguish NPr from HPr, so the
  NPr role remains a context-level, not a family-level, assignment.
