term_assessments:
- assessed_term:
    id: GO:0016775
    label: phosphotransferase activity, nitrogenous group as acceptor
  scope: UNRESOLVED
  scope_reason: 'Nitrogenous-acceptor phosphotransfer is positively supported for the characterized E.
    coli HPr/NPr, KT2440 NPr, NA1000 regulatory HPr and B. subtilis HPr. This shared chemistry does not
    identify a nitrogen-specific role. A blanket subfamily grant is withheld: the actual tree also places
    a Dictyostelium HPr-domain protein F0ZH96 in SF1, and other HPr-like homologues including SF5 Crh
    are not independently adjudicated here. Their presence is a scope limit, not evidence that those proteins
    lost or lack phosphotransfer activity. Retain the positive native gene judgments without manufacturing
    a whole-family or whole-subfamily assertion.'
  supported_by:
  - reference_id: PMID:10473571
    supporting_text: EI(Ntr) phosphorylated NPr but not HPr, whereas Enzyme I exhibited a strong preference
      for HPr.
  - reference_id: PMID:7876255
    supporting_text: 'Purified IIANtr and NPr exchange phosphate appropriately with Enzyme I, HPr, and
      Enzyme IIA proteins of the phosphoenolpyruvate: sugar phosphotransferase system.'
  - reference_id: PMID:18296519
    supporting_text: Our results show that the source of phosphate available to the system is PEP and
      that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr) to NPr
      to EIIA(Ntr).
- assessed_term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  scope: UNRESOLVED
  scope_reason: 'The broad PAINT gain is grounded in genuine sugar-PTS HPr seeds but its descendant scope
    includes NPr and Crh-classified proteins. E. coli NPr is MARK_AS_OVER_ANNOTATED for the physiological sugar process: purified cross-system phosphotransfer
    is real but does not alone establish native coupled sugar transport. KT2440 NPr receives phosphate from FruB in vivo, but native coupled sugar uptake through the regulatory
    branch is not established and its process claim is likewise marked over-annotated, while B. subtilis and E. coli HPr remain positive controls.
    A whole-SF2 grant or exclusion would be incorrect.'
  supported_by:
  - reference_id: PMID:7876255
    supporting_text: 'Purified IIANtr and NPr exchange phosphate appropriately with Enzyme I, HPr, and
      Enzyme IIA proteins of the phosphoenolpyruvate: sugar phosphotransferase system.'
  - reference_id: PMID:18296519
    supporting_text: Our results show that the source of phosphate available to the system is PEP and
      that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr) to NPr
      to EIIA(Ntr).
  - reference_id: PMID:10473571
    supporting_text: EI(Ntr) phosphorylated NPr but not HPr, whereas Enzyme I exhibited a strong preference
      for HPr.
- assessed_term:
    id: GO:0003714
    label: transcription corepressor activity
  scope: UNRESOLVED
  scope_reason: B. subtilis phosphoserine-HPr is a demonstrated CcpA transcriptional corepressor. This
    positive member-level output does not establish the function throughout SF2, and the absence of corresponding
    native data for regulatory NPr is not a demonstrated evolutionary loss.
  supported_by:
  - reference_id: PMID:8596444
    supporting_text: Footprinting experiments revealed that the purified CcpA protein interacted with
      P-ser-HPr to cause specific protection of the gnt CRE against DNase I digestion.
