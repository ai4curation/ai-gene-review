family_id: PANTHER:PTHR33705
family_name: PHOSPHOCARRIER PROTEIN HPR
functional_coherence: HETEROGENEOUS
review_status: COMPLETE
reviewed_by: codex (annotation-reviewer consultation)
review_date: '2026-11-07'
preferred_name: HPr-like phosphocarriers and regulatory homologues
summary: This family includes carbohydrate-PTS HPr, nitrogen-regulatory NPr/HPr and other HPr-like homologues.
  Histidyl phosphate transfer is shared by characterized phosphocarriers, whereas physiological donors,
  acceptors and regulatory partners differ. Some HPr proteins also act as phosphoserine-dependent transcriptional
  cofactors; the subfamily named NPr includes ordinary sugar-PTS HPr.
coherence_reason: SF2 includes E. coli NPr, KT2440 and NA1000 regulatory carriers, and B. subtilis sugar-PTS
  HPr. E. coli sugar-PTS HPr belongs to SF1. The SF2 name cannot establish nitrogen-pathway specificity,
  and B. subtilis CcpA cofactor activity cannot be generalized to all NPr/HPr proteins. SF5 Crh classification
  is present in the tree/member table but its chemistry is not independently adjudicated in this bounded
  review.
