family_id: PANTHER:PTHR33705
family_name: PHOSPHOCARRIER PROTEIN HPR
preferred_name: HPr family PTS phosphocarriers (HPr, NPr and HPr-like Crh)
summary: >-
  Small (about 85-110 residue) HPr-domain proteins of the bacterial
  phosphotransferase system. Canonical HPr carries a phosphoryl group on an N-terminal
  histidine (His15 in HPr, His16 in E. coli NPr) from enzyme I to the EIIA domains of
  sugar-specific enzyme II complexes, and in Firmicutes is also phosphorylated on a
  serine as a catabolite-repression signal. NPr (PtsO) is the proteobacterial
  paralogue encoded in the rpoN operon; it receives phosphate from enzyme I(Ntr) and
  donates it to the regulatory EIIA(Ntr) (PtsN) of the nitrogen PTS, which transports
  no sugar. The Bacillus HPr-like protein Crh forms a third group.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Histidyl phosphotransfer between PTS proteins is common to HPr and NPr, but their
  pathway roles differ: HPr serves sugar uptake, NPr serves the regulatory
  EI(Ntr)-NPr-EIIA(Ntr) relay that runs in parallel to the transport PTS. PANTHER does
  not separate the two cleanly: SF2 ("PHOSPHOCARRIER PROTEIN NPR") contains the
  proteobacterial NPr proteins together with the canonical sugar-PTS HPr of Firmicutes,
  Actinobacteria and Chlamydiae, while SF1 holds the enterobacterial HPr.
  Neither the sugar PTS process nor the NPr role can therefore be read from the family
  or subfamily id.
reference_protein:
  id: UniProtKB:P0A9N0
  label: Phosphocarrier protein NPr
  gene_symbol: ptsO
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/ptsO/ptsO-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR33705:SF1
  label: PHOSPHOCARRIER PROTEIN HPR
  description: >-
    Enterobacterial and pasteurellacean sugar-PTS HPr (E. coli PtsH P0AA04, Salmonella,
    Klebsiella, Haemophilus, Vibrio PtsH, Buchnera and Borrelia). The E. coli member is
    a PAINT seed of the sugar-PTS IBD.
  representative_members:
  - id: UniProtKB:P0AA04
    label: Phosphocarrier protein HPr
    gene_symbol: ptsH
    organism: Escherichia coli K-12
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR33705:SF2
  label: PHOSPHOCARRIER PROTEIN NPR
  description: >-
    Mixed subfamily of 49 reviewed members: proteobacterial NPr/PtsO (E. coli P0A9N0,
    Klebsiella P51185, Proteus, Shewanella, Vibrio npr) and P. putida KT2440 PtsH/NPr
    (Q88PA2; the reviewed Pseudomonas PtsH entries Q9Z426 and Q9HVV2 also fall here),
    together with the sugar-PTS HPr of Firmicutes
    (B. subtilis P08877, Staphylococcus, Listeria, Streptococcus), Streptomyces,
    Chlamydiae, Mollicutes and Neisseria. Membership in SF2 identifies an HPr-domain histidine
    phosphocarrier; whether a member is NPr or a sugar-PTS HPr has to be read from
    genomic and pathway context (rpoN-operon ptsO next to ptsN; acceptor specificity
    of EI versus EI(Ntr)).
  representative_members:
  - id: UniProtKB:P0A9N0
    label: Phosphocarrier protein NPr
    gene_symbol: ptsO
    organism: Escherichia coli K-12
    gene_review: genes/ECOLI/ptsO/ptsO-ai-review.yaml
  - id: UniProtKB:Q88PA2
    label: Phosphocarrier protein HPr
    gene_symbol: ptsH
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/ptsH/ptsH-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    The NPr members within SF2 retain histidyl phosphotransfer but switched partners
    to EI(Ntr) and EIIA(Ntr) and act in a regulatory phosphorelay rather than sugar
    uptake; the HPr members of SF2 do not share this divergence.
  supported_by:
  - reference_id: PMID:10473571
    supporting_text: EI(Ntr) phosphorylated NPr but not HPr, whereas Enzyme I exhibited a strong preference for HPr.
  - reference_id: PMID:19400808
    supporting_text: >-
      Proteins EI(Ntr), NPr and IIA(Ntr) form a phosphoryl group transfer chain
      (Ntr-PTS) working in parallel to the phosphoenolpyruvate:carbohydrate
      phosphotransferase system (transport-PTS) in Escherichia coli.
- subfamily_id: PANTHER:PTHR33705:SF5
  label: HPR-LIKE PROTEIN CRH
  description: >-
    Bacillus HPr-like protein Crh (B. subtilis O06976, Halalkalibacterium halodurans
    Q9K708). Not checked experimentally for this review and given no PTS function here.
  diverged_from_family: true
  divergence_description: >-
    Separate HPr-like paralogue group of Bacillus; its function was not assessed in this
    review and the histidyl phosphocarrier term is not extended to it.
node_assessments:
- node_id: PANTHER:PTN002135312
  asserted_term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence: IBD
  negated: false
  paint_snapshot: '20241008'
  seeds:
  - id: UniProtKB:O50515
    label: ptsH
    organism: Streptomyces coelicolor A3(2)
  - id: UniProtKB:P0AA04
    label: ptsH
    organism: Escherichia coli K-12
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The sugar PTS process is correct for the HPr seeds (Streptomyces HPr in SF2, E. coli
    HPr in SF1) and for HPr generally, so placement at a node spanning both subfamilies
    is defensible. But the node also covers the proteobacterial NPr branch (E. coli,
    Klebsiella, Proteus, Shewanella and Vibrio PtsO/Npr, and P. putida PP_0948), which
    receives phosphate only from EI(Ntr) and serves the regulatory PTS(Ntr) relay
    parallel to the transport PTS. That branch needs an IRD so that NPr proteins do not
    inherit sugar transport (currently E. coli PtsO receives GO:0009401 by IBA).
  supported_by:
  - reference_id: PMID:10473571
    supporting_text: >-
      The results suggest that E. coli possesses at least two distinct PTS phosphoryl
      transfer chains, EI(Ntr) --> NPr --> IIA(Ntr) and EI --> HPr --> IIA(sugar).
  - reference_id: PMID:18296519
    supporting_text: comprise a branch of the system unrelated to sugar traffic but thought to have an influence on coordination of N and C metabolism
term_assessments:
- assessed_term:
    id: GO:0016775
    label: phosphotransferase activity, nitrogenous group as acceptor
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    HPr and NPr accept a phosphoryl group on their active-site histidine and donate it to
    the histidine of an EIIA domain (a nitrogenous acceptor). This is shown for E. coli
    NPr and P. putida NPr and is the textbook HPr reaction; it is granted to SF1 (HPr)
    and SF2 (HPr and NPr). The Crh subfamily SF5 was not assessed and is excluded.
  applicable_subfamilies:
  - id: PANTHER:PTHR33705:SF1
    label: PHOSPHOCARRIER PROTEIN HPR
  - id: PANTHER:PTHR33705:SF2
    label: PHOSPHOCARRIER PROTEIN NPR
  supported_by:
  - reference_id: PMID:7876255
    supporting_text: >-
      Purified IIANtr and NPr exchange phosphate appropriately with Enzyme I, HPr, and
      Enzyme IIA proteins of the phosphoenolpyruvate: sugar phosphotransferase system.
  - reference_id: PMID:18296519
    supporting_text: >-
      Our results show that the source of phosphate available to the system is PEP and
      that the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to
      EI(Ntr) to NPr to EIIA(Ntr).
