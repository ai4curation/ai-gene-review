  name:
    name: Keratin-associated protein type 19
    short: KRTAP_type_19
  description:
  - text: The KRTAP type 19 family is involved in the structural integrity of hair.
      Members of this family are hair keratin-associated proteins (KRTAPs) that play
      a crucial role in the hair cortex. They are part of an interfilamentous matrix
      that embeds hair keratin intermediate filaments. These proteins contribute to
      the formation of a rigid and resistant hair shaft by facilitating extensive
      disulfide bond cross-linking with the cysteine residues of hair keratins. The
      matrix proteins are characterized by their high-sulfur and high-glycine-tyrosine
      content, which is essential for the mechanical strength and durability of hair.
