notes: >-
  Module bacterial_shikimate_chorismate_biosynthesis attaches GO:0004107 to the whole family
  (aroc_chorismate_synthase), which is consistent with FAMILY_WIDE scope here. Its description of
  ARO2 as bifunctional (PMID:8971708) matches the fungal flavin reductase clade. The ARO2 review
  accepts the GO:0004107, GO:0005829, GO:0009073 and GO:0009423 IBAs, keeps GO:0042602 as
  non-core, and makes GO:0052873 core; all of this is consistent here. The S. pombe aro2 review is
  still a stub (PENDING), and the P. putida aroC review has no IBA rows. Node membership was
  checked in the PAINT UniProt GAF on 2026-10-06.
