family_id: PANTHER:PTHR21085
family_name: CHORISMATE SYNTHASE
preferred_name: Chorismate synthase (AroC/ARO2)
summary: >-
  Chorismate synthases catalyse the last step of the shikimate pathway, the
  1,4-trans-elimination of phosphate from 5-enolpyruvylshikimate 3-phosphate (EPSP) to give
  chorismate. Chorismate is the branch point for phenylalanine, tyrosine, tryptophan, folate,
  quinones and other aromatic compounds. The reaction is redox-neutral but needs reduced FMN.
  Bacterial and plant enzymes take reduced flavin from other enzymes. Fungal chorismate synthases
  (N. crassa aro-2, S. cerevisiae ARO2) are bifunctional and reduce FMN with NADPH themselves. The
  family is found in bacteria, archaea, fungi, apicomplexans and plants. Almost all members sit in
  one subfamily (SF0); SF1 holds a single tomato plastid enzyme.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member is a chorismate synthase, and PANTHER makes no functional split
  (SF0 holds 716 of 717 reviewed members). Two properties vary by lineage and must be scoped by
  PAINT node or by member, not family-wide. The intrinsic NADPH-dependent flavin reductase
  activity is fungal (bifunctional enzymes). Cellular location is cytosolic in bacteria and fungi
  but plastidic in plants.
