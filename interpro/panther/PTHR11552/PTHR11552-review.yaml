subfamilies:
- subfamily_id: PANTHER:PTHR11552:SF147
  label: CHOLINE DEHYDROGENASE, MITOCHONDRIAL
  description: >-
    The largest subfamily. It contains bacterial BetA choline dehydrogenases (E. coli,
    P. putida KT2440, P. aeruginosa and many others) and vertebrate mitochondrial CHDH, but
    also non-choline enzymes: ecdysone oxidase, the Chlorella fatty-acid photodecarboxylase
    FAP, alcohol dehydrogenase [acceptor] and Strobilurus str4. The choline dehydrogenases
    are a clade within it, marked more precisely by InterPro IPR011533 (BetA) and NCBIfam
    TIGR01810 than by the PANTHER subfamily. That is why the choline-to-glycine-betaine
    module grounds its BetA step on NCBIfam TIGR01810 (IPR011533).
