notes: >-
  Written for the bacterial_choline_to_glycine_betaine_biosynthesis module. All seven cached
  PAINT node/term pairs are assessed. Subfamily labels are verbatim from panther.obo;
  representative members were checked against the entries CSV and the PANTHER 19.0 member
  index. Node taxa are copied from the PAINT taxon column as NCBITaxon CURIEs (labels checked in
  OLS); PTN000167771 has no PAINT taxon. The Viridiplantae taxon of PTN001694860 contradicts
  its bacterial seed and is discussed on that node.
