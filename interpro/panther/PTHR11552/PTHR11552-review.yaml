family_id: PANTHER:PTHR11552
family_name: GLUCOSE-METHANOL-CHOLINE  GMC  OXIDOREDUCTASE
preferred_name: Glucose-methanol-choline (GMC) oxidoreductase family
summary: >-
  The GMC oxidoreductases are FAD-dependent enzymes with an N-terminal Rossmann-type
  FAD-binding domain and a C-terminal substrate-binding domain. They oxidize alcohols
  (CH-OH donors) and related substrates, passing the electrons either to O2 (oxidases) or
  to quinones and other acceptors (dehydrogenases). The family includes bacterial BetA and
  vertebrate mitochondrial choline dehydrogenases (CHDH), choline oxidase, fungal glucose
  oxidases and pyranose dehydrogenases, yeast methanol (alcohol) oxidases, insect ecdysone
  oxidase, the algal fatty-acid photodecarboxylase, and many fungal oxidoreductases that work
  in secondary-metabolite gene clusters. FAD-dependent oxidoreduction is common to the whole
  family. Substrate, acceptor and pathway are not, so specific activity terms apply only
  within clades. The choline dehydrogenases (BetA/CHDH) use a non-NAD acceptor, and no
  member is an NAD-dependent dehydrogenase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All characterized members are FAD-dependent oxidoreductases acting on CH-OH donors, but
  they differ in substrate (choline, glucose, pyranoses, methanol, ecdysone, fatty acids,
  polyketide intermediates) and acceptor (O2 for oxidases; quinone or other acceptors for
  dehydrogenases). Even PANTHER's choline-dehydrogenase subfamily SF147 also holds ecdysone
  oxidase, the Chlorella fatty-acid photodecarboxylase and an alcohol dehydrogenase
  [acceptor], so choline dehydrogenase activity cannot be granted at subfamily level.
