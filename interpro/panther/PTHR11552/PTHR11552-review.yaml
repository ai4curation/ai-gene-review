term_assessments:
- assessed_term:
    id: GO:0016491
    label: oxidoreductase activity
  scope: FAMILY_WIDE
  scope_reason: FAD-dependent oxidoreduction is the common denominator of all characterized members.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11552/PTHR11552-paint.tsv
    supporting_text: "PTHR11552\tPTN000167771\tGO:0016491\tF\tIBD\tfalse"
- assessed_term:
    id: GO:0008812
    label: choline dehydrogenase activity
  scope: UNRESOLVED
  scope_reason: >-
    Sound for bacterial BetA (PTN001694860, which needs pruning of its FAP branch) and the animal
    CHDH clade (PTN000167855), where PAINT places it, but not expressible at PANTHER subfamily level. SF147 also holds
    ecdysone oxidase, fatty-acid photodecarboxylase and an alcohol dehydrogenase [acceptor],
    and choline oxidase (O2-linked) sits in SF152. IPR011533/TIGR01810 is the reliable
    family marker for the activity.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11552/PTHR11552-entries.csv
    supporting_text: A0A248QE08,"Fatty acid photodecarboxylase, chloroplastic",protein,554065,Chlorella variabilis
- assessed_term:
    id: GO:0008802
    label: betaine-aldehyde dehydrogenase (NAD+) activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    No GMC member is an NAD-dependent dehydrogenase. HAMAP MF_00750 propagates EC 1.2.1.8 to
    BetA, but purified E. coli BetA does not oxidize betaine aldehyde. Purified rat CHDH
    oxidizes betaine aldehyde with phenazine methosulfate as acceptor. A. baumannii BetA also
    oxidizes it in vitro; that paper does not name the acceptor, and our inference is that it is
    not NAD+, because GMC flavoproteins carry FAD and have no NAD-binding site. The NAD-dependent
    step belongs to BetB in PTHR11699. Both BetA gene reviews remove this term.
  supported_by:
  - reference_id: PMID:39510372
    supporting_text: failed to further oxidize betaine aldehyde to betaine
  - reference_id: PMID:34431198
    supporting_text: BetA was found to be associated with the membrane and to contain a flavin, indicative for BetA donating electrons into the respiratory chain.
  - reference_id: PMID:6996732
    supporting_text: The preparation thus purified oxidized only choline and betaine aldehyde.
