- subfamily_id: PANTHER:PTHR11552:SF152
  label: OXIDASE (CODA), PUTATIVE (AFU_ORTHOLOGUE AFUA_8G04090)-RELATED
  description: >-
    Choline oxidases (Arthrobacter globiformis CodA), which use O2 rather than a
    respiratory acceptor and produce H2O2. They make betaine aldehyde from choline but are not
    BetA-type dehydrogenases, so choline dehydrogenase activity (GO:0008812) should not be
    inherited here. They still satisfy the family-wide oxidoreductase activity.
