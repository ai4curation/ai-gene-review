family_id: PANTHER:PTHR45754
family_name: METHYLENETETRAHYDROFOLATE REDUCTASE
preferred_name: Methylenetetrahydrofolate reductase (MTHFR/MetF) family
summary: >-
  Flavoprotein methylenetetrahydrofolate reductases that reduce 5,10-methylene-THF to 5-methyl-THF,
  the methyl donor for methionine synthesis. Human MTHFR and S. cerevisiae MET13 (SF3) use NADPH;
  bacterial MetF uses NADH; MET12 and S. pombe met11 (SF1) form the second fungal paralog; plant
  MTHFR (SF4) prefers NADH.
functional_coherence: COHERENT
coherence_reason: All members are MTHFRs; cofactor preference (NADH vs NADPH) differs.
