family_id: PANTHER:PTHR43504
family_name: ISOCITRATE DEHYDROGENASE [NADP]
preferred_name: Prokaryotic dimeric NADP-isocitrate dehydrogenase (Icd) family
summary: >-
  Homodimeric NADP-dependent isocitrate dehydrogenases (EC 1.1.1.42) of bacteria and archaea, typified
  by E. coli Icd, belonging to the isocitrate/isopropylmalate dehydrogenase fold. They catalyse the
  divalent-metal-dependent oxidative decarboxylation of isocitrate to 2-oxoglutarate and CO2 with
  NADPH production at the isocitrate step of the TCA cycle, a branch point with the glyoxylate
  bypass in many bacteria. Eukaryotic NAD-dependent mitochondrial IDH3/Idh1-Idh2 subunits belong to
  a different PANTHER family (PTHR11835).
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF1) of prokaryotic NADP-isocitrate dehydrogenases.
