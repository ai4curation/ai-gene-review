    label: fatty acid elongation
  evidence: IBD
  negated: false
  paint_snapshot: '20260530'
  seeds:
  - id: UniProtKB:P0A2C9
    gene_symbol: fabG
    organism: Salmonella typhimurium LT2
  - id: UniProtKB:P0AEK2
    gene_symbol: fabG
    organism: Escherichia coli K-12
  assessment: TOO_DEEP
  assessment_reason: >-
    Both seeds are genuine FabG 3-oxoacyl-ACP reductases, but in the PANTHER 19 tree
    (pantherdb.org treeinfo service) PTN001211919 is a Eubacteria-level node
    subtending 179 leaves across 14 subfamilies, SF123 among them. Fatty acid
    elongation therefore descends onto the BenD/XylL aromatic cis-diol
    dehydrogenases, whose reaction has no acyl-ACP intermediate, and all three
    reviewed benD genes remove it. The term belongs on the FabG-like branch, not at
    this node.
