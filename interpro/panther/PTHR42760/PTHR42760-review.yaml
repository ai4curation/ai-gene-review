family_id: PANTHER:PTHR42760
family_name: SHORT-CHAIN DEHYDROGENASES/REDUCTASES FAMILY MEMBER
preferred_name: Short-chain dehydrogenase/reductase (SDR) family (FabG-like subset)
summary: >-
  A large PANTHER family of classical SDR oxidoreductases. It includes 3-oxoacyl-ACP reductases of
  mitochondrial type II fatty acid synthesis (S. cerevisiae OAR1, S. pombe oar2), plastid and bacterial
  FabG-like enzymes, and many SDRs of other pathways: KduD, benzoate dihydrodiol dehydrogenase BenD,
  fungal secondary-metabolite reductases and peroxisomal (3R)-hydroxyacyl-CoA dehydrogenases.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The substrate differs by subfamily. Even SF133, which holds OAR1/oar2, contains secondary-metabolite
  reductases such as PatN.
