family_id: PANTHER:PTHR21090
family_name: AROM/DEHYDROQUINATE SYNTHASE
preferred_name: EPSP synthase (AroA) family, including the fungal pentafunctional AROM polypeptides and the AROM-derived quinate repressors
summary: >-
  The family is held together by homology to 5-enolpyruvylshikimate-3-phosphate (EPSP) synthase
  (3-phosphoshikimate 1-carboxyvinyltransferase, AroA), the sixth enzyme of the shikimate
  pathway, and by homology to the AROM polypeptide of which that enzyme is one domain. Almost all
  members (subfamily SF5, about 650 reviewed proteins) are either monofunctional AroA enzymes of
  bacteria, archaea and plant plastids (E. coli AroA, Arabidopsis At2g45300), or the
  pentafunctional AROM polypeptides of fungi (S. cerevisiae ARO1, S. pombe aro1, A. nidulans
  AROM). In AROM, EPSP synthase is fused with 3-dehydroquinate synthase, shikimate kinase, type I
  3-dehydroquinase and shikimate dehydrogenase, so one chain performs steps 2 to 6 of the
  pathway. Two small plant subfamilies (SF30, SF31) are further plastid EPSP synthases. Subfamily
  SF27 holds the fungal quinate repressors (A. nidulans QutR, N. crassa qa-1S). These have no EPSP
  synthase domain. They are homologous to the three C-terminal AROM domains (shikimate kinase,
  dehydroquinase, shikimate dehydrogenase) and act as transcriptional repressors of quinate
  catabolism, not as shikimate-pathway enzymes.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  EPSP synthase activity is shared by every member that has an EPSP synthase domain: the bacterial,
  archaeal and plant AroA proteins and the fungal AROM polypeptides (SF5, SF30, SF31). Two things
  diverge. First, the other four AROM activities (3-dehydroquinate synthase, 3-dehydroquinase,
  shikimate dehydrogenase, shikimate kinase) are confined to the fungal AROM members. These share
  SF5 with several hundred monofunctional AroA proteins, so SF5 cannot carry them. Second, the
  quinate repressors QutR and qa-1S (SF27) lack the EPSP synthase domain and are regulators.
  QutR even has Arg in place of the Schiff-base Lys of type I dehydroquinases. The family-root
  PAINT node nevertheless passes EPSP synthase activity and chorismate biosynthesis to them.
