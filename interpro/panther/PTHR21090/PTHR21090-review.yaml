- assessed_term:
    id: GO:0003856
    label: 3-dehydroquinate synthase activity
  scope: UNRESOLVED
  scope_reason: >-
    Holds only for the fungal AROM polypeptides, which carry an N-terminal 3-dehydroquinate
    synthase domain. These share SF5 with several hundred monofunctional AroA proteins that have
    no such domain, so no PANTHER subfamily is safe for the term. It is a member-level (domain
    architecture) property. The module's AROM annoton for this step uses SF5 as its selector,
    which also selects every bacterial and plant AroA.
  supported_by:
  - reference_id: PMID:2825635
    supporting_text: >-
      The observed homologies demonstrate that the arom polypeptide is a mosaic of functional
      domains
- assessed_term:
    id: GO:0003855
    label: 3-dehydroquinate dehydratase activity
  scope: UNRESOLVED
  scope_reason: >-
    Fungal AROM members only (type I dehydroquinase domain), for the same reason as
    3-dehydroquinate synthase. Within the family the only other proteins with a type I
    dehydroquinase-like domain are the SF27 quinate repressors. In QutR that domain has Arg in
    place of the catalytic Lys, so the repressors should not receive the term either.
  supported_by:
  - reference_id: PMID:1544567
    supporting_text: >-
      The change from Lys----Arg in the inferred QUTR protein may allow the protein to bind but not
      metabolise the substrate for 3-dehydroquinase enzymes, namely 3-dehydroquinate.
- assessed_term:
    id: GO:0004764
    label: shikimate 3-dehydrogenase (NADP+) activity
  scope: UNRESOLVED
  scope_reason: >-
    Fungal AROM members only. The monofunctional AroA proteins of SF5 lack the shikimate
    dehydrogenase domain. The SF27 repressors have a homologous domain, but no catalytic activity
    has been shown for them.
  supported_by:
  - reference_id: PMID:2825635
    supporting_text: >-
      Functional regions within the polypeptide chain have been identified by comparison with the
      sequences of the five monofunctional Escherichia coli enzymes whose activities correspond
      with those of the arom multifunctional enzyme.
- assessed_term:
    id: GO:0004765
    label: shikimate kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    Fungal AROM members only. The SF27 repressors keep a nucleotide-binding motif in their
    shikimate kinase-like domain, but kinase activity has only been suggested for them, not
    shown.
  supported_by:
  - reference_id: PMID:1544567
    supporting_text: >-
      The inferred QUTR aa sequence has a completely conserved aa sequence motif, Gly, Xaa4, Gly,
      Lys, Ser, that is found in proteins that bind purine nt, suggesting that the inferred protein
      may have an in vivo kinase activity.
