notes: >-
  Module bacterial_shikimate_chorismate_biosynthesis uses PTHR21090:SF5 as the family for all five
  annotons of the pentafunctional AROM architecture (GO:0003856, GO:0003855, GO:0004764, GO:0004765,
  GO:0003866). SF5 is right for the EPSP synthase domain but over-selects for the other four
  activities, because nearly all of SF5 is monofunctional AroA. Those four annotons need a
  member-level or architecture-level selector, for example HAMAP MF_03143 (the AROM rule cited
  in the ARO1 and aro1 UniProt records) or a required_function constraint. The same module's
  discrete EPSP synthase step uses NCBIfam TIGR01356 for P. putida PP_1770, which is itself an SF5
  member, so either id would serve there. The ARO1 review accepts the IBAs for GO:0003866,
  GO:0005737 and GO:0009423, which is consistent here. The S. pombe aro1 review is still a stub
  (PENDING). Q00784, P11637 and P05466 node inheritance and Pfam content were checked against the
  PAINT UniProt GAF and UniProt REST on 2026-10-06. The PTN000472635 cytoplasm (GO:0005737) row is
  not assessed: plant plastid EPSP synthases inherit it, and in GO the plastid is part of the
  cytoplasm.
