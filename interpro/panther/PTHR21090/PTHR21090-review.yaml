  diverged_from_family: false
  supported_by:
  - reference_id: PMID:2825635
    supporting_text: >-
      The observed homologies demonstrate that the arom polypeptide is a mosaic of functional
      domains and are consistent with the hypothesis that the ARO1 gene evolved by the linking of
      ancestral E. coli-like genes.
- subfamily_id: PANTHER:PTHR21090:SF27
  label: QUINATE REPRESSOR PROTEIN
  description: >-
    Fungal quinate repressors (A. nidulans QutR Q00784, N. crassa qa-1S P11637 and two other
    Neurospora qa-1S proteins). They are homologous to the three C-terminal AROM domains and
    carry Pfam SKI, DHquinase_I, Shikimate_dh_N, Shikimate_DH and SDH_C, but no EPSP synthase
    domain.
  representative_members:
  - id: UniProtKB:Q00784
    label: Quinate repressor protein
    gene_symbol: qutR
    organism: Aspergillus nidulans
  - id: UniProtKB:P11637
    label: Transcription factor qa-1s
    gene_symbol: qa-1s
    organism: Neurospora crassa
  diverged_from_family: true
  divergence_description: >-
    Transcriptional repressors of the quinate-utilization genes, derived from the C-terminal half
    of AROM. They have no EPSP synthase domain, and the QutR dehydroquinase-like domain has Arg in
    place of the catalytic Schiff-base Lys. No shikimate-pathway catalytic activity has been
    shown for them.
  supported_by:
  - reference_id: PMID:1544567
    supporting_text: >-
      The inferred aa sequence shows a high level of similarity throughout its length with the aa
      sequence of the three C-terminal domains (shikimate kinase; 3-dehydroquinase; shikimate
      dehydrogenase) of the pentafunctional AROM protein of Aspergillus nidulans
  - reference_id: PMID:1544567
    supporting_text: >-
      In active 3-dehydroquinases, the Arg (of QUTR) is replaced by Lys, which is involved in
      Schiff base formation as part of the reaction mechanism.
  - reference_id: PMID:8294040
    supporting_text: >-
      The repressor protein is homologous throughout its length with the three C-terminal domains
      of a pentafunctional enzyme catalysing five consecutive steps in the related anabolic
      shikimate pathway.
