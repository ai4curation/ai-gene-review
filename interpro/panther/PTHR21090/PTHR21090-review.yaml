subfamilies:
- subfamily_id: PANTHER:PTHR21090:SF5
  label: PENTAFUNCTIONAL AROM POLYPEPTIDE
  description: >-
    Despite its name, this subfamily holds both the monofunctional EPSP synthases of bacteria,
    archaea and plants (579 of the 648 reviewed members are named aroA, including E. coli P0A6D3,
    P. putida PP_1770 and Arabidopsis At2g45300) and the fungal pentafunctional AROM polypeptides
    (S. cerevisiae ARO1, S. pombe aro1, A. nidulans aromA, 61 reviewed fungal proteins of
    1538-1715 residues). The bacterial_shikimate_chorismate_biosynthesis module uses this id for
    all five AROM-domain annotons.
