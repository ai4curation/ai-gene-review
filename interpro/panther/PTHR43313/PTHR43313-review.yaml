family_id: PANTHER:PTHR43313
family_name: SHORT-CHAIN DEHYDROGENASE/REDUCTASE FAMILY 9C
preferred_name: SDR9C family (BDH1, HSD11B2, HSD17B2, HSD17B6, RDH5, RDH16, DHRS9, SDR9C7)
summary: >-
  The SDR9C family groups extended classical short-chain
  dehydrogenases/reductases, mostly animal, that use NAD(H) to interconvert
  hydroxyl and carbonyl groups on small hydroxy acids, steroids and retinoids.
  Its members include the mitochondrial D-beta-hydroxybutyrate dehydrogenase
  BDH1, which interconverts D-3-hydroxybutyrate and acetoacetate in ketone-body
  metabolism; the ER-associated 11-beta-hydroxysteroid dehydrogenase type 2
  (HSD11B2) that inactivates cortisol; 17-beta-hydroxysteroid dehydrogenases
  types 2 and 6; the retinol dehydrogenases RDH5 and RDH16; DHRS9; and SDR9C7.
  The family also contains bacterial and nematode SDRs such as Escherichia coli
  YbbO and Caenorhabditis elegans DHS-16 (SF1). Bacterial D-3-hydroxybutyrate
  dehydrogenases (for example Pseudomonas putida HbdH) are not in this family;
  they belong to the FabG-type SDR family PTHR42879, so the 3-hydroxybutyrate
  dehydrogenase activity of BDH1 and of HbdH is shared SDR chemistry reached in
  separate lineages.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  NAD(H)-dependent oxidoreductase activity on a CH-OH group is shared, but the
  substrate defines each subfamily: D-3-hydroxybutyrate (SF25 and its
  vertebrate splits), 11-beta-hydroxy glucocorticoids (SF2), 17-beta-hydroxy
  steroids (SF3, SF4), cis- and all-trans-retinol (SF12, SF11/SF14) and
  others. Location also differs: BDH1 sits on the matrix face of the
  mitochondrial inner membrane, whereas the steroid and retinol dehydrogenases
  are ER membrane enzymes.
