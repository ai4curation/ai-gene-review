notes: >-
  Written for the ketone_body_oxidation module, whose oxidation step has an
  animal BDH1 variant grounded on PTHR43313:SF25 (human BDH1 is classified at
  exactly that subfamily). The remaining IBD rows concern steroid,
  glucocorticoid and retinoid dehydrogenase clades (PTN001963393,
  PTN002879150, PTN008103905, PTN008103906 and their location and process
  rows) and are outside the module; they were not assessed. The bacterial
  3-hydroxybutyrate dehydrogenase variant of the same module is grounded on
  InterPro IPR011294 rather than on PANTHER, because its PANTHER family
  (PTHR42879, FabG-type SDRs) is too heterogeneous.
