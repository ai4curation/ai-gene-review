family_id: PANTHER:PTHR10030
family_name: ALPHA-L-FUCOSIDASE
preferred_name: Alpha-L-fucosidase family
summary: >-
  Glycoside hydrolase family 29 alpha-L-fucosidases that release L-fucose from
  fucosylated glycans. The local reviewed-protein inventory includes lysosomal
  tissue alpha-L-fucosidases such as human FUCA1, secreted plasma
  alpha-L-fucosidases such as human FUCA2, plant FUC1 enzymes, Dictyostelium
  AlfA, and more divergent GH29 members in the SF37 subfamily.
functional_coherence: COHERENT
coherence_reason: >-
  The family root supports alpha-L-fucosidase activity, fucose metabolism, and
  glycoside catabolism across the local inventory. Human FUCA1 and FUCA2 differ
  mainly in compartment and physiological substrate context rather than in the
  conserved catalytic reaction.
