family_id: PANTHER:PTHR11241
family_name: DEOXYURIDINE 5'-TRIPHOSPHATE NUCLEOTIDOHYDROLASE
preferred_name: Trimeric dUTPase (Dut) family
summary: >-
  Trimeric dUTP pyrophosphatases (dUTPase, EC 3.6.1.23) are Mg2+-dependent hydrolases that
  cleave dUTP to dUMP and diphosphate. The reaction does two things. It keeps the dUTP/dTTP
  ratio low so that DNA polymerases do not incorporate uracil, and it supplies dUMP, the
  substrate of thymidylate synthase. The enzyme is essential in yeast and E. coli, and is found
  in bacteria, eukaryotes and many DNA viruses and prophages. Human DUT is expressed from one
  gene as a nuclear (DUT-N) and a mitochondrial (DUT-M) isoform. The family also contains a
  small number of dUTPase-like sequences that PANTHER labels as inactive or as domain-only
  proteins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Almost all members (455 of 456 reviewed UniProt entries are SF0, the remaining one, human
  DUT, is SF11) are active dUTPases, and PAINT places all four IBD terms on one node,
  PTN000133341. That node is seeded by bacterial, fungal, animal, plant and Dictyostelium
  enzymes, and its inheritors span 26 bacterial and 94 eukaryotic taxa. The exceptions are the
  subfamilies PANTHER names as non-catalytic or domain-only. One is SF12 (INACTIVE DEOXYURIDINE
  5'-TRIPHOSPHATE NUCLEOTIDOHYDROLASE-LIKE PROTEIN FLJ16323-RELATED), whose human member Q6ZN92
  is a dubious, possibly endogenous-retroviral CDS that nonetheless inherits the activity.
  Another is SF8 (DUTPASE-LIKE DOMAIN-CONTAINING PROTEIN), which was not examined here.
