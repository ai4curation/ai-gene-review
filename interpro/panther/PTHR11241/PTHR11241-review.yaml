notes: >-
  Modules: modules/dntp_de_novo_synthesis.yaml and modules/thymidylate_synthesis.yaml both use
  PANTHER:PTHR11241 (family level) with GO:0004170, which is consistent with this review. The
  two modules label human DUT (P33316) differently. dntp_de_novo_synthesis uses the current
  UniProt recommended name "Deoxyuridine 5'-triphosphate nucleotidohydrolase, mitochondrial";
  thymidylate_synthesis omits ", mitochondrial". A family-level selector also captures the
  SF12 inactive-like human sequence. Q6ZN92's inheritance of all four PTN000133341 terms, and
  its SF12 placement, are from the PAINT UniProt GAF and the PANTHER 19 human classification
  file. The InterPro-derived entries csv has no SF12 member. A regex scan for conserved
  dUTPase motif patterns was not informative: it also missed the active E. coli and SPbeta
  enzymes. No residue-loss claim is therefore made for Q6ZN92. .cache/panther/IBD.gaf has no
  IRD/IKR rows for this node.
