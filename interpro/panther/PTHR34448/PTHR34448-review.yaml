family_id: PANTHER:PTHR34448
family_name: AMINOPEPTIDASE
preferred_name: M29-like aminopeptidase T/AmpS family and the NicX 2,5-dihydroxypyridine dioxygenases
summary: >-
  A small family combining two functionally unrelated groups that share the M29 exopeptidase-like
  architecture recorded by InterPro (IPR052170). SF3 holds the characterized M29 metallo-aminopeptidases:
  aminopeptidase T of Thermus, aminopeptidase 2 of Geobacillus, Bacillus subtilis AmpS and Streptococcus
  thermophilus PepS. SF1 holds NicX, the non-heme Fe(II) dioxygenase that cleaves the pyridine ring of
  2,5-dihydroxypyridine to N-formylmaleamate in aerobic nicotinate degradation. Pseudomonas putida
  KT2440 NicX has purified-enzyme, product and crystal-structure evidence, and the Bordetella
  bronchiseptica orthologue has product evidence reported in a meeting abstract. NicX additionally
  carries its own family signature (IPR058739, Pfam PF26233), which the aminopeptidases lack. The
  PANTHER family name describes SF3 only.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Peptide hydrolysis (SF3) and dioxygenolytic aromatic ring cleavage (SF1) are different chemistries.
  The KT2440 NicX structure shows a four-residue Fe(II) site used for O2 activation rather than the
  dinuclear metallo-peptidase site of the aminopeptidases. Neither activity can be propagated across
  the family; each is subfamily-restricted.
