family_id: PANTHER:PTHR21308
family_name: PHYTANOYL-COA ALPHA-HYDROXYLASE
preferred_name: Phytanoyl-CoA dioxygenase (PhyH) family, including the Saccharomyces biotin-synthesis protein BIO1
summary: >-
  A small PANTHER family of Fe(II)/2-oxoglutarate-dependent oxygenases of the phytanoyl-CoA
  dioxygenase (PhyH) type. Its characterized members are the metazoan peroxisomal phytanoyl-CoA
  2-hydroxylases (human PHYH and its mammalian and nematode orthologs). PHYH catalyses the first
  step of phytanic acid alpha-oxidation, and its deficiency causes Refsum disease. The family
  also contains two Saccharomyces proteins. YJR154W is uncharacterized. BIO1 is a paralog of
  YJR154W found in biotin-prototrophic strains, where it is needed for an oxygen-dependent early
  step of biotin synthesis that supplies the pimelate moiety. BIO1's reaction is unknown. All
  six reviewed members, and BIO1, are in the single subfamily SF1.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The members share a 2-oxoglutarate oxygenase fold but not a known function. Metazoan PHYH is
  a phytanoyl-CoA 2-hydroxylase in peroxisomal fatty-acid alpha-oxidation. Saccharomyces BIO1 is
  a neofunctionalized duplicate of YJR154W, required for biotin synthesis upstream of
  8-amino-7-oxononanoate, with an unknown substrate. YJR154W has no known function. PANTHER puts
  all of them in one subfamily (SF1), so no specific activity or process is safe at subfamily
  level. PAINT scopes the PHYH terms to a eumetazoan node, so the yeast proteins do not inherit
  them.
reference_protein:
  id: UniProtKB:O14832
  label: Phytanoyl-CoA dioxygenase, peroxisomal
  gene_symbol: PHYH
  organism: Homo sapiens
subfamilies:
- subfamily_id: PANTHER:PTHR21308:SF1
  label: PHYTANOYL-COA DIOXYGENASE, PEROXISOMAL
  description: >-
    The only PANTHER subfamily. It contains metazoan PHYH (human, mouse, rat, bovine, C. elegans
    ZK550.6), S. cerevisiae YJR154W (P47181) and, per its UniProt PANTHER cross-reference,
    S. cerevisiae BIO1 (E9P9F6). The biotin_biosynthesis module uses the family-level id
    PTHR21308 for BIO1 without asserting a GO molecular function.
  representative_members:
  - id: UniProtKB:O14832
    label: Phytanoyl-CoA dioxygenase, peroxisomal
    gene_symbol: PHYH
    organism: Homo sapiens
  - id: UniProtKB:E9P9F6
    label: Putative pimeloyl-CoA synthetase
    gene_symbol: BIO1
    organism: Saccharomyces cerevisiae (strain A364a)
    gene_review: genes/yeast/BIO1/BIO1-ai-review.yaml
  - id: UniProtKB:P47181
    label: Uncharacterized protein YJR154W
    gene_symbol: YJR154W
    organism: Saccharomyces cerevisiae
  diverged_from_family: true
  divergence_description: >-
    Functionally mixed. The yeast members (BIO1, YJR154W) are not known to hydroxylate
    phytanoyl-CoA. BIO1 is required for biotin synthesis upstream of KAPA by an oxygen-dependent,
    uncharacterized reaction.
  supported_by:
  - reference_id: PMID:18073433
    supporting_text: >-
      BIO1 is a paralog of YJR154W, a gene of unknown function and adjacent to BIO6.
  - reference_id: PMID:32276977
    supporting_text: >-
      However, biotin prototrophy was restricted to aerobic conditions, probably reflecting the
      involvement of oxygen in the reaction catalyzed by the putative oxidoreductase CfBio1.
node_assessments:
- node_id: PANTHER:PTN001084068
  asserted_term:
    id: GO:0048244
    label: phytanoyl-CoA dioxygenase activity
  node_taxon:
    id: NCBITaxon:6072
    label: Eumetazoa
  paint_snapshot: '20170228'
  seeds:
  - id: RGD:620317
    label: Phyh
    organism: Rattus norvegicus
  - id: UniProtKB:O14832
    label: PHYH
    organism: Homo sapiens
  assessment: SOUND
  assessment_reason: >-
    In the PAINT UniProt GAF the node covers 47 metazoan proteins (mammals, fish, arthropods,
    nematodes) and no fungal member. YJR154W and BIO1 do not inherit phytanoyl-CoA dioxygenase
    activity, which is correct given that neither is known to act on phytanoyl-CoA.
  supported_by:
  - reference_id: PMID:9326940
    supporting_text: >-
      the disease is caused by the deficiency of phytanoyl-CoA hydroxylase (PhyH), a peroxisomal
      protein catalyzing the first step in the alpha-oxidation of phytanic acid.
term_assessments:
- assessed_term:
    id: GO:0048244
    label: phytanoyl-CoA dioxygenase activity
  scope: UNRESOLVED
  scope_reason: >-
    Correct for metazoan PHYH orthologs (PAINT node PTN001084068, Eumetazoa). They share SF1 with
    the yeast BIO1 and YJR154W proteins, so the term must be scoped by node, not by subfamily, and
    not applied to the fungal members.
  supported_by:
  - reference_id: PMID:16186124
    supporting_text: >-
      phytanoyl-CoA 2-hydroxylase (PAHX), an Fe(II) and 2-oxoglutarate (2OG)-dependent oxygenase
      that catalyzes the initial alpha-oxidation step in the degradation of phytenic acid in
      peroxisomes.
- assessed_term:
    id: GO:0001561
    label: fatty acid alpha-oxidation
  scope: UNRESOLVED
  scope_reason: Metazoan PHYH clade only (PTN001084068), for the same reason as the activity.
  supported_by:
  - reference_id: PMID:9326940
    supporting_text: >-
      a peroxisomal protein catalyzing the first step in the alpha-oxidation of phytanic acid.
- assessed_term:
    id: GO:0005777
    label: peroxisome
  scope: UNRESOLVED
  scope_reason: >-
    Metazoan PHYH carries a cleavable PTS2 peroxisomal targeting signal. A peroxisomal location
    has not been shown for BIO1 or YJR154W.
  supported_by:
  - reference_id: PMID:9326940
    supporting_text: >-
      which contains a cleavable peroxisomal targeting signal type 2 (PTS2).
- assessed_term:
    id: GO:0009102
    label: biotin biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    Holds for Saccharomyces BIO1 (and its Saccharomycotina orthologs used to restore biotin
    prototrophy), which is the family's role in the biotin_biosynthesis module. It does not hold
    for metazoan PHYH, and YJR154W has no known role in biotin synthesis. BIO1 shares SF1 with
    both, so the term is member-level only.
  supported_by:
  - reference_id: PMID:18073433
    supporting_text: >-
      The biotin auxotroph strain S288c was able to grow on media lacking biotin when BIO1 and the
      known biotin synthesis gene BIO6 were introduced together on a plasmid vector.
- assessed_term:
    id: GO:0042410
    label: 6-carboxyhexanoate-CoA ligase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    SGD annotates BIO1 to this activity by sequence similarity, by analogy with the Bacillus
    pimeloyl-CoA synthetase BioW. No member of this family has an acyl-CoA ligase fold. Bio1
    orthologs have the structural motifs of phytanoyl-CoA and 2-oxoglutarate/Fe(II) dioxygenases,
    and Bio1-dependent biotin synthesis needs oxygen. The BIO1 review leaves the ISS
    UNDECIDED, and the module asserts no GO activity for BIO1.
  supported_by:
  - reference_id: PMID:32276977
    supporting_text: >-
      Although the amino acid similarities of the six Bio1 orthologs ranged from 15% to 62%, all
      contained common structural motifs typical for phytanoyl-CoA dioxygenases and
      2-oxoglutarate-iron(II)-dependent dioxygenases.
  - reference_id: PMID:32276977
    supporting_text: >-
      BIO1 (ScBIO1) previously was hypothesized to act as a CoA ligase that activates free pimelic
      acid for biotin synthesis, similar to the enzyme encoded by bioW in Bacillus subtilis
