notes: >-
  The family files were fetched for this review (just fetch-panther-family / fetch-panther-paint
  PTHR21308). BIO1 (E9P9F6, strain A364a) is not among the reviewed entries in the PANTHER
  inventory. Its PTHR21308 and SF1 placement is from its UniProt PANTHER cross-reference
  (genes/yeast/BIO1/BIO1-uniprot.txt). The biotin_biosynthesis module's treatment of BIO1
  agrees with this review: family-level id, no GO molecular function, an explicit statement that
  GO:0042410 is doubtful, and catalytic activity unknown. The BIO1 review accepts GO:0009102
  (IGI, ISS) and leaves GO:0042410 (ISS) UNDECIDED. The evidence in PMID:32276977 and in this
  family review would support REMOVE or MARK_AS_OVER_ANNOTATED for that ISS. No residue sites
  are curated: the PHYH Fe(II) ligands (His175, Asp177, His264; PMID:16186124) have not been
  checked against BIO1 or YJR154W.
