    gene_symbol: A0A8C5FPT8
    organism: Gadus morhua
    gene_review: genes/GADMO/A0A8C5FPT8/A0A8C5FPT8-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0005776
    label: autophagosome
  scope: UNRESOLVED
  scope_reason: The TBC1D14 paper localizes the regulator to recycling endosomes and reports relocalization
    toward Golgi on starvation; regulation of autophagosome formation is not itself residence on an autophagosome.
    The cod target is assigned TBC1D12-like, whereas the prediction lead is TBC1D14. The location therefore
    requires both correct paralog placement and direct compartment evidence; the TBC fold and autophagy
    phenotype do not resolve it.
