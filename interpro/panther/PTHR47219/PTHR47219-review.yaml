family_id: PANTHER:PTHR47219
family_name: RAB GTPASE-ACTIVATING PROTEIN 1-LIKE
preferred_name: TBC-domain trafficking regulators
summary: TBC-domain proteins include Rab GTPase-activating enzymes and noncatalytic trafficking regulators.
  Rab preference, organelle recruitment and catalytic competence vary among branches.
functional_coherence: HETEROGENEOUS
coherence_reason: TBC1D14 regulates autophagosome formation from a recycling-endosome/Golgi context and
  is not a Rab11 GAP in the cited assays. The cod member is assigned TBC1D12-like, so both paralog identity
  and actual autophagosome residence remain unresolved. Neither the TBC fold nor an autophagy phenotype
  establishes the proposed compartment.
subfamilies:
- subfamily_id: PANTHER:PTHR47219:SF15
  label: TBC1 DOMAIN FAMILY MEMBER 12 ISOFORM X1
  description: Recorded placement of A0A8C5FPT8. TBC1D14 binds Rab11 without acting as its GAP in the
    cited experiments. The cod target's frozen assignment is TBC1D12-like while its ProtNLM nearest-name
    lead is TBC1D14, so autophagosome transfer requires resolving this placement. Neither TBC-domain presence
    nor a Rab-GAP family label establishes autophagosome residence or GAP activity.
  representative_members:
