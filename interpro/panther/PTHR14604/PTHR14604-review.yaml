preferred_name: Wd40 Repeat Pf20
summary: WD40 REPEAT PF20 (PANTHER:PTHR14604) is characterized in PANTHER PAINT across 9 ancestral PTN
  node(s) (PANTHER:PTN000458584, PANTHER:PTN000520418, PANTHER:PTN000520494, PANTHER:PTN001026566 (+5
  more)) with 23 IBD node assertion(s) and 0 term(s) carrying negated IRD/IKR branch blocks, covering
  small-subunit processome (GO:0032040, CC), U3 snoRNA binding (GO:0034511, MF), endonucleolytic cleavage
  in ITS1 to separate SSU-rRNA from 5.8S rRNA and LSU-rRNA from tricistronic rRNA transcript (SSU-rRNA,
  5.8S rRNA, LSU-rRNA) (GO:0000447, BP), SCF ubiquitin ligase complex (GO:0019005, CC) and 12 additional
  GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR14604 (WD40 REPEAT PF20) span 9 distinct ancestral
  PTN nodes (PANTHER:PTN000458584, PANTHER:PTN000520418, PANTHER:PTN000520494, PANTHER:PTN001026566, PANTHER:PTN002336971
  (+4 more)) with different molecular function assignments across clades (ubiquitin protein ligase activity
  (GO:0061630), ubiquitin-like ligase-substrate adaptor activity (GO:1990756), U3 snoRNA binding (GO:0034511)),
  indicating clade-level functional specialization across the family.
