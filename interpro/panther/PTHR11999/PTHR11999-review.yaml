preferred_name: Group Ii Pyridoxal-5-Phosphate Decarboxylase
summary: GROUP II PYRIDOXAL-5-PHOSPHATE DECARBOXYLASE (PANTHER:PTHR11999) is characterized in PANTHER
  PAINT across 4 ancestral PTN node(s) (PANTHER:PTN000242942, PANTHER:PTN000242975, PANTHER:PTN002634081,
  PANTHER:PTN007556042) with 9 IBD node assertion(s) and 3 term(s) carrying negated IRD/IKR branch blocks,
  covering histidine decarboxylase activity (GO:0004398, MF), histamine biosynthetic process (GO:0001694,
  BP), L-histidine catabolic process (GO:0006548, BP), aromatic-L-amino-acid decarboxylase activity (GO:0004058,
  MF) and 5 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR11999 (GROUP II PYRIDOXAL-5-PHOSPHATE DECARBOXYLASE)
  span 4 distinct ancestral PTN nodes (PANTHER:PTN000242942, PANTHER:PTN000242975, PANTHER:PTN002634081,
  PANTHER:PTN007556042) with different molecular function assignments across clades (histidine decarboxylase
  activity (GO:0004398), aromatic-L-amino-acid decarboxylase activity (GO:0004058), 3,4-dihydroxyphenylacetaldehyde
  synthase activity (GO:0106425), carboxy-lyase activity (GO:0016831)), indicating clade-level functional
  specialization across the family.
