family_id: PANTHER:PTHR42686
family_name: GH17980P-RELATED
summary: This AKR-related group contains experimentally named sugar and pyridoxal dehydrogenases with
  divergent substrate preferences. The conserved barrel and nucleotide-binding architecture support oxidoreductase
  chemistry, while substrate-recognition loops distinguish individual reactions. A broad aldo-keto-reductase
  superfamily description does not determine the physiological direction or substrate of each member.
functional_coherence: HETEROGENEOUS
coherence_reason: The narrow PANTHER inventory contains L-galactose, D-arabinose, D-threo-aldose and pyridoxal
  dehydrogenases, demonstrating substrate divergence within an oxidative AKR-related group. The broad
  integrated AKR entry also describes reductases and regulatory proteins outside this narrow inventory.
  CG18547 has AKR and LGALDH-like signatures; these support an oxidoreductase hypothesis without identifying
  a plant ascorbate pathway or a physiological sugar substrate in fly.
