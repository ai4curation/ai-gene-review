  name:
    name: Mucin/von Willebrand/Thrombospondin superfamily
    short: Mucin_vWF_Thrombospondin_sf
  description:
  - text: The protein family is involved in various biological processes, including
      the protection of mucosal surfaces, hemostasis, and developmental events in
      the central nervous system. Members of the family function as gel-forming mucins
      that coat epithelia, providing a protective barrier against pathogens and facilitating
      nutrient absorption. They also play roles in platelet adhesion during vascular
      injury, neuronal aggregation, and gamete recognition during fertilization. Some
      family members act as chaperones for other proteins, contribute to the structural
      integrity of specific tissues, and participate in innate immunity by storing
      antimicrobial molecules.
