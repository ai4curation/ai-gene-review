family_id: PANTHER:PTHR12604
family_name: KU AUTOANTIGEN DNA HELICASE
preferred_name: Ku70/Ku80 DNA end-binding family
summary: >-
  The Ku family contains the two eukaryotic Ku heterodimer subunits, Ku70/XRCC6
  and Ku80/XRCC5. Together they form a preassembled ring that binds double-stranded
  DNA ends, protects the end, recruits DNA-PKcs, and initiates classical
  non-homologous end joining. Ku is also conserved at telomeres, where it binds
  telomeric repeats and contributes to telomere maintenance.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The reviewed non-Drosophila Ku70 and Ku80 members share the heterodimeric
  DNA-end and telomeric-DNA functions. PAINT places all five positive assertions
  at the PTHR12604 root, then blocks the same assertions on a Drosophila node
  with IRD losses that are outside the reviewed human XRCC5/XRCC6 lineages.
