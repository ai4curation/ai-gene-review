  name:
    name: Ku protein family involved in NHEJ and telomere maintenance
    short: Ku_NHEJ_telomere_maint
  description:
  - text: The Ku protein family is involved in the DNA non-homologous end joining
      (NHEJ) pathway, essential for double-strand break repair. Members of the family
      function as single-stranded DNA-dependent ATP-dependent helicases. They exhibit
      sequence-independent DNA-binding with high affinity to nicks and ends of duplex
      DNA, providing chromosomal end protection. The family plays a crucial role in
      telomere maintenance, interacting with telomeric repeats and subtelomeric sequences
      to control telomere length and protect against rearrangement. Additionally,
      they maintain telomeric chromatin for gene silencing at telomeres. The heterodimer
      formed by Ku70 and Ku80 subunits is involved in the recruitment of telomerase
      and other factors for telomere elongation and recombination. This family also
      participates in processes such as V(D)J recombination, chromosome stability,
      and transcription regulation. Some members have been implicated in the innate
      immune response through the cGAS-STING pathway.
