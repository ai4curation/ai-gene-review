family_id: PANTHER:PTHR16675
family_name: MHC CLASS I-RELATED
preferred_name: MHC class I heavy chains and non-classical MHC-I-like receptors (FCGRT, HFE, AZGP1)
summary: >-
  Jawed-vertebrate superfamily of MHC class I-fold alpha1-alpha2 platform and
  C1-set immunoglobulin-like heavy chains (IPR050208). While classical MHC
  class Ia heavy chains (HLA-A, HLA-B, HLA-C) and non-classical class Ib heavy
  chains (HLA-E, HLA-F, HLA-G) present endogenous peptides to CD8+ T cells and
  NK receptors, the family has radiated into functionally specialized lineages
  whose alpha1-alpha2 grooves are remodeled or occluded: the neonatal Fc
  receptor heavy chain FCGRT (PANTHER:PTHR16675:SF3), which has a closed
  peptide groove and instead binds monomeric IgG and serum albumin in acidic
  endosomes (pH <= 6.5) for salvage recycling and transcytosis; HFE
  (PANTHER:PTHR16675:SF172), which binds transferrin receptor TFRC to regulate
  iron homeostasis; NKG2D stress ligands (MICA/MICB, ULBP1-6/RAET1); and
  zinc-alpha-2-glycoprotein AZGP1 (PANTHER:PTHR16675:SF289), a secreted
  B2M-independent adipokine that binds polyunsaturated fatty acids.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Family members share the MHC class I alpha1-alpha2/alpha3 domain architecture
  but perform radically distinct molecular functions across subfamilies: peptide
  antigen presentation (HLA-A/B/C/E/G), pH-dependent IgG and albumin
  salvage/transcytosis (FCGRT, PANTHER:PTHR16675:SF3), transferrin receptor
  regulation (HFE, PANTHER:PTHR16675:SF172), NKG2D receptor activation
  (MICA/B, ULBP1-6), and secreted lipid-binding adipokine activity (AZGP1,
  PANTHER:PTHR16675:SF289). Broad PAINT annotations for antigen presentation
  (GO:0002476, GO:0002486), T-cell cytotoxicity (GO:0001916), and immune
  response (GO:0006955) over-propagate onto non-presenting paralogs such as
  AZGP1 and FCGRT.
reference_protein:
  id: UniProtKB:P55899
  label: IgG receptor FcRn large subunit p51
  gene_symbol: FCGRT
  organism: Homo sapiens
subfamilies:
  - subfamily_id: PANTHER:PTHR16675:SF3
    label: IGG RECEPTOR FCRN LARGE SUBUNIT P51
    description: >-
      Non-classical MHC class I-like alpha chain (FCGRT) that heterodimerizes
      with beta-2-microglobulin (B2M) to form the neonatal Fc receptor (FcRn).
      Possesses an occluded alpha1-alpha2 groove incapable of peptide
      presentation and instead binds IgG Fc and serum albumin at distinct,
      non-overlapping pH-dependent interfaces (pH 5.5-6.5) in sorting endosomes
      to mediate half-life extension and transepithelial transcytosis.
    representative_members:
      - id: UniProtKB:P55899
        label: IgG receptor FcRn large subunit p51
        gene_symbol: FCGRT
        organism: Homo sapiens
      - id: UniProtKB:Q61559
        label: IgG receptor FcRn large subunit p51
        gene_symbol: Fcgrt
        organism: Mus musculus
      - id: UniProtKB:P13599
        label: IgG receptor FcRn large subunit p51
        gene_symbol: Fcgrt
        organism: Rattus norvegicus
    diverged_from_family: true
    divergence_description: >-
      FCGRT has a closed alpha1-alpha2 groove (occluded by Pro183 in the
      precursor / Pro160 in the mature chain, corresponding to MHC class I
      Pro162, which kinks the alpha-2 helix) and does not bind or present
      antigenic peptides; instead it binds monomeric IgG and serum albumin at
      exterior pH-dependent interfaces.
    supported_by:
      - reference_id: file:genes/human/FCGRT/FCGRT-uniprot.txt
        supporting_text: >-
          Mechanistically, monomeric IgG binding to FcRn in acidic endosomes of
          endothelial and hematopoietic cells recycles IgG to the cell surface
          where it is released into the circulation (PubMed:10998088). In
          addition of IgG, regulates homeostasis of the other most abundant
          circulating protein albumin/ALB (PubMed:24469444, PubMed:28330995).
  - subfamily_id: PANTHER:PTHR16675:SF229
    label: HLA CLASS I HISTOCOMPATIBILITY ANTIGEN, A ALPHA CHAIN
    description: >-
      Classical MHC class Ia heavy chain that binds endogenous cytosolic
      peptides in the ER and presents them at the cell surface to CD8+ T cells.
    representative_members:
      - id: UniProtKB:P04439
        label: HLA class I histocompatibility antigen, A alpha chain
        gene_symbol: HLA-A
        organism: Homo sapiens
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR16675:SF270
    label: HLA CLASS I HISTOCOMPATIBILITY ANTIGEN, B ALPHA CHAIN
    description: >-
      Classical MHC class Ia heavy chain that presents endogenous peptide
      antigens to CD8+ cytotoxic T lymphocytes and engages NK cell KIR receptors.
    representative_members:
      - id: UniProtKB:P01889
        label: HLA class I histocompatibility antigen, B alpha chain
        gene_symbol: HLA-B
        organism: Homo sapiens
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR16675:SF251
    label: HLA CLASS I HISTOCOMPATIBILITY ANTIGEN, C ALPHA CHAIN
    description: >-
      Classical MHC class Ia heavy chain that presents endogenous peptides to
      CD8+ T cells and serves as a major ligand for inhibitory KIR receptors on
      NK cells.
    representative_members:
      - id: UniProtKB:P10321
        label: HLA class I histocompatibility antigen, C alpha chain
        gene_symbol: HLA-C
        organism: Homo sapiens
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR16675:SF172
    label: HEREDITARY HEMOCHROMATOSIS PROTEIN
    description: >-
      Non-classical MHC class I-like membrane protein (HFE) with a narrowed
      alpha1-alpha2 groove that associates with B2M and binds transferrin
      receptor (TFRC) to regulate hepatic hepcidin expression and systemic iron
      homeostasis.
    representative_members:
      - id: UniProtKB:Q30201
        label: Hereditary hemochromatosis protein
        gene_symbol: HFE
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      HFE has a narrowed alpha1-alpha2 cleft that cannot bind peptides and
      instead binds transferrin receptor 1 (TFRC) to regulate iron homeostasis.
  - subfamily_id: PANTHER:PTHR16675:SF289
    label: ZINC-ALPHA-2-GLYCOPROTEIN
    description: >-
      Secreted soluble MHC class I-like glycoprotein (AZGP1/ZAG) that neither
      associates with B2M nor binds peptides, but instead binds hydrophobic
      polyunsaturated fatty acids in its alpha1-alpha2 groove and stimulates
      adipocyte lipolysis.
    representative_members:
      - id: UniProtKB:P25311
        label: Zinc-alpha-2-glycoprotein
        gene_symbol: AZGP1
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      AZGP1 is a secreted monomeric adipokine that lacks a transmembrane domain,
      does not pair with B2M, and binds hydrophobic fatty acids rather than
      antigenic peptides.
    supported_by:
      - reference_id: file:genes/human/AZGP1/AZGP1-uniprot.txt
        supporting_text: >-
          Stimulates lipid degradation in adipocytes and causes the extensive
          fat losses associated with some advanced cancers. May bind
          polyunsaturated fatty acids.
