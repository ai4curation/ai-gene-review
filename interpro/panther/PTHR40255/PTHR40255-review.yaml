term_assessments:
- assessed_term:
    id: GO:0070818
    label: protoporphyrinogen oxidase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    GO defines this term with an unspecified acceptor ("protoporphyrinogen IX + 3 acceptor =
    protoporphyrin IX + 3 reduced acceptor"), which fits HemJ: the characterized
    Synechocystis member oxidizes protoporphyrinogen IX but does not use oxygen or
    artificial quinones, so neither the oxygen-acceptor (GO:0004729) nor the
    quinone-acceptor (GO:0070819) child term is warranted. All Swiss-Prot members of the
    single subfamily are annotated as this activity and none is shown to differ.
  supported_by:
  - reference_id: file:genes/CERS4/hemJ/hemJ-uniprot.txt
    supporting_text: >-
      Catalyzes the oxidation of protoporphyrinogen IX to protoporphyrin IX.
  - reference_id: file:genes/CERS4/hemJ/hemJ-uniprot.txt
    supporting_text: >-
      Does not use oxygen or artificial electron acceptors such as menadione or
      benzoquinone.
