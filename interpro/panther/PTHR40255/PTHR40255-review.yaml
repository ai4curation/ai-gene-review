notes: >-
  PAINT carries no node-level annotations for this family (just fetch-panther-paint
  PTHR40255 reports 12 nodes and no annotations), so there are no node assessments. The
  PANTHER 19 tree (pantherdb.org treeinfo service) roots the family at PTN002220222
  (Eubacteria, 8 leaves, all SF1) with cyanobacterial and proteobacterial clades. The
  best-characterized member, Synechocystis HemJ (P72793), has no gene review in this
  repository, so the reviewed R. sphaeroides member is used as the reference protein; its
  UniProt functional annotation is transferred by similarity from P72793.
