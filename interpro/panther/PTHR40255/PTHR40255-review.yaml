family_id: PANTHER:PTHR40255
family_name: UPF0093 MEMBRANE PROTEIN SLR1790
preferred_name: HemJ-type protoporphyrinogen IX oxidase family
summary: >-
  HemJ proteins are small integral-membrane proteins (former UPF0093 / DUF420 family) that
  act as protoporphyrinogen IX oxidases in cyanobacteria and many proteobacteria lacking
  HemY and HemG. Synechocystis sp. PCC 6803 HemJ (Slr1790) is essential for growth,
  catalyzes the oxidation of protoporphyrinogen IX to protoporphyrin IX, does not use
  oxygen or artificial quinone electron acceptors, and is functionally coupled to
  coproporphyrinogen III oxidase. The physiological electron acceptor is not established.
  The PANTHER family name reflects the
  old uncharacterized-protein name of the Synechocystis member, while its only subfamily
  (SF1) is named protoporphyrinogen IX oxidase.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF1) whose Swiss-Prot members are all annotated as protoporphyrinogen
  IX oxidases, with experimental support for the Synechocystis member and no member shown to
  do anything else.
reference_protein:
  id: UniProtKB:Q53229
  label: Protoporphyrinogen IX oxidase
  organism: Cereibacter sphaeroides (strain ATCC 17023 / DSM 158 / JCM 6121 / CCUG 31486 / LMG 2827 / NBRC 12203 / NCIMB 8253 / ATH 2.4.1.)
  gene_review: genes/CERS4/hemJ/hemJ-ai-review.yaml
subfamilies:
