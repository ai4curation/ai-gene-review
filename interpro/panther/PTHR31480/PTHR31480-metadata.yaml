  name:
    name: Phytoene/Squalene Synthase
    short: Phytoene/Squalene_Synthase
  description:
  - text: The phytoene/squalene synthase family is involved in the biosynthesis of
      carotenoids and hopanoids, essential components for cellular functions across
      various organisms. Members of this family catalyze key steps in the production
      of carotenoids, such as the condensation of isoprenoid diphosphate molecules
      to form phytoene or the head-to-head condensation of farnesyl diphosphate to
      produce diapophytoene. Some enzymes also exhibit bifunctional activity, catalyzing
      both the synthesis of phytoene and the cyclization of lycopene to beta-carotene.
      Additionally, subfamilies within this group participate in the biosynthesis
      of hopanoid precursors, converting farnesyl diphosphate to presqualene diphosphate
      and hydroxysqualene. These processes are crucial for the formation of protective
      pigments, membrane integrity, and stress response in various species, including
      bacteria, fungi, and plants.
