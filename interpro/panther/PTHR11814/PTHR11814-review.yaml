term_assessments:
- assessed_term:
    id: GO:0022857
    label: transmembrane transporter activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Generic transmembrane transporter activity is the root PAINT assertion
    (PTN002483418, assessed SOUND), seeded from bacteria to mammals, and every
    member carries the SLC26/SulP multipass transport domain. Only the generic
    activity is family-wide: cargo (sulfate, chloride, bicarbonate, oxalate,
    C4-dicarboxylates) and coupling are clade-specific, and mammalian prestin
    is specialized as a membrane motor. For bacterial members such as P.
    putida PP_0075 nothing more specific than this term is inherited.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11814/PTHR11814-paint.tsv
    supporting_text: "PTHR11814\tPTN002483418\tGO:0022857\tF\tIBD\tfalse"
  - reference_id: file:genes/PSEPK/PP_0075/PP_0075-uniprot.txt
    supporting_text: InterPro; IPR001902; SLC26A/SulP_fam.
- assessed_term:
    id: GO:0008509
    label: monoatomic anion transmembrane transporter activity
  scope: UNRESOLVED
  scope_reason: SLC26A11 has direct evidence for both sulfate transport and chloride conductance. Sulfate
    is polyatomic, so sulfate transport alone would not support the monoatomic-anion term; the measured
    chloride conductance does. Other SLC26/SulP branches differ in substrate and in exchange, channel
    or motor specialization, so an unconditional family-wide monoatomic-anion transfer is not justified.
  supported_by:
  - reference_id: PMID:42509233
    supporting_text: both a sulfate transporter and a chloride channel
  - reference_id: file:genes/PANPA/A0A2R9CAF4/A0A2R9CAF4-uniprot.txt
    supporting_text: DR   InterPro; IPR001902; SLC26A/SulP_fam.
