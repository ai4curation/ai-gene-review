notes: >-
  2026-11-02 update (choline-O-sulfate module curation): added the SLC26A1
  reference protein, split subfamilies into a eukaryotic grouping and a
  bacterial grouping that holds P. putida PP_0075, and assessed all 16 PAINT
  rows. Node placements were judged from seed sets and node taxa; the PANTHER
  tree was not inspected, so two rows whose clade cannot be identified are
  UNRESOLVED. The cited members are assigned only at family level in the
  member index, so no subfamily ids are declared. Earlier notes (codex,
  2026-09-10): PANPA/A0A2R9CAF4 was assessed from its frozen UniProt record;
  gene-review verdicts and ARBA assertions are not independent validation, and
  a target-level refutation is not a family-wide NOT_APPLICABLE judgment.
