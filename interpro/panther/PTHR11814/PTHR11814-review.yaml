term_assessments:
- assessed_term:
    id: GO:0008509
    label: monoatomic anion transmembrane transporter activity
  scope: UNRESOLVED
  scope_reason: SLC26A11 has direct evidence for both sulfate transport and chloride conductance. Sulfate
    is polyatomic, so sulfate transport alone would not support the monoatomic-anion term; the measured
    chloride conductance does. Other SLC26/SulP branches differ in substrate and in exchange, channel
    or motor specialization, so an unconditional family-wide monoatomic-anion transfer is not justified.
  supported_by:
  - reference_id: PMID:42509233
    supporting_text: both a sulfate transporter and a chloride channel
