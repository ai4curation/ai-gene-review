family_id: PANTHER:PTHR11814
family_name: SULFATE TRANSPORTER
preferred_name: SLC26/SulP anion transport and motor proteins
summary: SLC26/SulP proteins share a membrane transport fold and commonly a STAS domain. Members transport
  different anions with different coupling modes; the family also includes the specialized mammalian prestin
  motor.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All members share the SLC26/SulP multipass transport domain, usually followed
  by a cytoplasmic STAS domain, and transmembrane anion movement is the shared
  ancestral property. Cargo and coupling are clade-specific and cannot be
  interchanged: eukaryotic SulP/SULTR and SLC26A1/A2 sulfate transporters,
  metazoan chloride/bicarbonate/oxalate exchangers (SLC26A3/A4/A6), the
  SLC26A11 sulfate transporter with chloride-channel activity, the mammalian
  prestin motor, and bacterial members with C4-dicarboxylate (E. coli DauA),
  bicarbonate (cyanobacterial BicA) or uncharacterized cargo, such as the
  Pseudomonas putida PP_0075 protein adjacent to the choline sulfatase gene.
reference_protein:
  id: UniProtKB:Q9H2B4
  label: Sulfate anion transporter 1
  gene_symbol: SLC26A1
  organism: Homo sapiens
  gene_review: genes/human/SLC26A1/SLC26A1-ai-review.yaml
subfamilies:
- label: Eukaryotic SLC26/SulP anion transporters and prestin
  description: >-
    Animal SLC26 proteins, plant SULTRs and fungal sulfate permeases. Sulfate
    transport dominates the plant and fungal clades and SLC26A1/A2; the
    metazoan SLC26A3/A4/A6 clade exchanges chloride, bicarbonate, oxalate and
    other anions; mammalian prestin is a membrane motor. These groupings are
    clade-level, not PANTHER subfamilies: the member index assigns the cited
    eukaryotic members only at family level.
  representative_members:
  - id: UniProtKB:Q9H2B4
    label: Sulfate anion transporter 1
    gene_symbol: SLC26A1
    organism: Homo sapiens
