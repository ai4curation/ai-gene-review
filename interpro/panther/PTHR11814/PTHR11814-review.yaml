    supporting_text: 'FUNCTION: Sodium-independent sulfate anion transporter'
  - reference_id: PMID:42509233
    supporting_text: both a sulfate transporter and a chloride channel
- label: Bacterial SulP-family transporters
  description: >-
    Bacterial members keep the SLC26/SulP-STAS architecture but have divergent
    or unknown cargo: E. coli DauA is a C4-dicarboxylic acid transporter,
    cyanobacterial BicA transports bicarbonate, and Bacillus YvdB and
    Mycobacterium Rv1739c are only putative sulfate transporters. Pseudomonas
    putida PP_0075, encoded beside the choline sulfatase gene betC, has no
    transport assay; sulfate or choline-O-sulfate cargo must not be inherited
    from the PANTHER family name or from the eukaryotic sulfate-transport
    nodes.
  representative_members:
