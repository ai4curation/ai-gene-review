family_id: PANTHER:PTHR11814
family_name: SULFATE TRANSPORTER
preferred_name: SLC26/SulP anion transport and motor proteins
summary: SLC26/SulP proteins share a membrane transport fold and commonly a STAS domain. Members transport
  different anions with different coupling modes; the family also includes the specialized mammalian prestin
  motor.
functional_coherence: HETEROGENEOUS
coherence_reason: The bonobo target has a multipass membrane architecture consistent with its assigned
  SLC26 subgroup. Sulfate, chloride, bicarbonate and organic-anion specificities cannot be interchanged.
  The prestin branch prevents treating ordinary anion transport as an invariant physiological function
  of every family member.
