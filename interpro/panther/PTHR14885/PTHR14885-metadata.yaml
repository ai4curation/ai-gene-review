  name:
    name: Cilia- and flagella-associated protein 43
    short: CFAP43
  description:
  - text: The CFAP43 family comprises flagellar proteins that are implicated in the
      organization and function of flagellum axonemes. Members of this family play
      a crucial role in the structural integrity of flagella and cilia, which are
      essential for cell motility and sensory functions. In multiciliated cells, such
      as those in the respiratory tract and larval epidermis, CFAP43 proteins are
      involved in regulating the beating frequency of motile cilia, which is vital
      for fluid movement and sensory perception. In sperm cells, these proteins are
      essential for the proper organization and function of the sperm flagellum, which
      is critical for sperm motility and fertility.
