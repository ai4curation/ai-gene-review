family_id: PANTHER:PTHR10844
family_name: CAVEOLIN
preferred_name: Caveolin family
summary: >-
  PTHR10844 contains metazoan caveolins, small hairpin membrane proteins that
  organize caveolar membrane domains. Human CAV1 and CAV2 are coexpressed
  caveolins in many non-muscle caveolae, with CAV2 acting as a CAV1-associated
  accessory partner. Human CAV3 is the muscle-enriched caveolin branch that
  performs the analogous caveolar membrane-organizing role at the sarcolemma.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Caveola localization and caveola assembly are shared across the reviewed human
  CAV1, CAV2 and CAV3 branches. PAINT is branch-specific for several CAV1 and
  CAV2 regulatory outcomes, but a few root biological-process or sarcolemma
  assertions still mix CAV1, CAV2 and CAV3 biology and need source-level
  checking before they are treated as family-wide.
