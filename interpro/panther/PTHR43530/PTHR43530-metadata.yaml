  name:
    name: Queuine tRNA-ribosyltransferase
    short: Queuine_tRNA-ribosyltrans
  description:
  - text: This family of proteins includes catalytic subunits of queuine tRNA-ribosyltransferase
      (TGT), which are responsible for the base-exchange reaction that replaces a
      guanine (G) residue with queuine (Q) at the wobble position 34 in tRNAs with
      GU(N) anticodons. This modification results in the formation of the hypermodified
      nucleoside queuosine, which is essential for accurate and efficient protein
      synthesis. The reaction mechanism involves a double-displacement process, where
      the enzyme forms a covalent intermediate with the RNA and facilitates the exchange
      of the guanine base with queuine through nucleophilic attacks on the ribose
      moiety.
