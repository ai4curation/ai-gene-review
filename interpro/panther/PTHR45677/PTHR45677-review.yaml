family_id: PANTHER:PTHR45677
family_name: GLUTAMATE DECARBOXYLASE-RELATED
preferred_name: 'Animal group II PLP decarboxylase family: GAD1/GAD2, CSAD and GADL1'
summary: >-
  PLP-dependent acidic amino acid decarboxylases of animals. GAD1 (GAD67) and GAD2 (GAD65) make GABA
  in neurons; CSAD decarboxylates cysteine sulfinate to hypotaurine in taurine synthesis; GADL1 decarboxylates
  aspartate and cysteine sulfinate.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Substrates differ by subfamily: glutamate (SF5, SF15, SF11, SF10), cysteine sulfinate (SF8) and
  aspartate/cysteine sulfinate (SF1).
