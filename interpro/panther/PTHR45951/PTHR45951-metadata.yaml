  description:
  - text: This family of proteins is involved in the hedgehog (Hh) signaling pathway.
      Members of this family play a crucial role in regulating the release and extracellular
      accumulation of cholesterol-modified hedgehog proteins, which is essential for
      the effective production of the Hh signal. Some family members have been shown
      to synergize with SCUBE2 to enhance the secretion of SHH, a ligand in the Hh
      signaling pathway. The function of these proteins is critical for various developmental
      processes and cellular communication.
