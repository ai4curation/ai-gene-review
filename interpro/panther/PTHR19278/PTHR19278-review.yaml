family_id: PANTHER:PTHR19278
family_name: OROTATE PHOSPHORIBOSYLTRANSFERASE
preferred_name: Orotate phosphoribosyltransferase family, including bifunctional UMP synthase
summary: >-
  PTHR19278 is built around the orotate phosphoribosyltransferase (OPRT) fold, which transfers
  phosphoribose from PRPP to orotate to make OMP. It holds three architectures. Standalone OPRTs
  (pyrE) come from many bacteria and archaea (166 to 232 residues among reviewed entries), and
  some eukaryotes, such as nematodes, keep a standalone copy too. Bifunctional UMP synthases
  (UMPS, 461 to 497 residues) of animals, plants, Dictyostelium and other eukaryotes fuse an
  N-terminal OPRT domain to a C-terminal OMP decarboxylase (ODCase) domain and make UMP from
  orotate in the last two steps of de novo UMP synthesis. Archaeal GfcR transcriptional regulators
  (SF41) carry a winged helix-turn-helix DNA-binding domain followed by a PRT-like regulatory
  domain. UniProt also cross-references 18 fungal monofunctional ODCases (for example S. pombe
  ura4) to SF9, but PANTHER's own HMM classification puts S. pombe ura4 in PTHR32119:SF2, the
  OMP decarboxylase family, with S. cerevisiae URA3. The PAINT node that gives those enzymes
  their annotations (PTN001280965) is a PTHR32119 node. S. cerevisiae URA5/URA10 and the
  E. coli-type pyrE fall in a different family, PTHR46683.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The catalytic members share OPRT activity and UMP biosynthesis. Two things break full
  coherence. ODCase activity is limited to members that carry the C-terminal decarboxylase
  domain (UMPS, and the fungal ODCases that UniProt maps here). The archaeal GfcR proteins (SF41)
  are annotated as transcriptional regulators whose PRT-like domain is described as a regulatory
  or effector-binding domain, and none has an OPRT assay. PAINT nevertheless propagates OPRT
  activity and UMP biosynthesis from the family root to them.
