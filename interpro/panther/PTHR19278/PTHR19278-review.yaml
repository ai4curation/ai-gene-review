notes: >-
  Modules using this family: de_novo_pyrimidine_synthesis (orotate phosphoribosyltransferase
  annoton, human UMPS; OMP decarboxylase annoton, human UMPS and S. pombe ura4). The module's
  InterPro family selectors are unaffected. S. pombe ura4 is a family-placement conflict:
  UniProt's cross-reference says PTHR19278:SF9, PANTHER's member index says PTHR32119:SF2, and
  ura4 receives its IBAs from the PTHR32119 node PTN001280965. The PTHR32119 placement fits the
  biology (a monofunctional ODCase related to URA3) and the PAINT data; no override was added.
  S. cerevisiae URA5/URA10 and P. putida pyrE are in PTHR46683, not this family. Recipient
  counts and Pfam architectures were read from the cached PAINT UniProt GAF (PANTHER 19.0) and
  UniProt on 2026-11-13. The SF42 and SF43 subfamilies have no reviewed members and were not
  assessed.
