- subfamily_id: PANTHER:PTHR19278:SF41
  label: PYRE-LIKE PROTEIN
  description: >-
    Archaeal GfcR transcriptional regulators (30 reviewed entries, about 200 residues, mostly
    methanogens), for example M. jannaschii GfcR (Q59040) and Methanosarcina GfcR1/GfcR2. They
    combine an N-terminal DNA-binding domain with a PRT-like regulatory domain. No OPRT assay is
    recorded for any of them, yet they receive OPRT activity and UMP biosynthesis IBAs from the
    family root.
  representative_members:
  - id: UniProtKB:Q59040
    label: gfcR
    gene_symbol: gfcR
    organism: Methanocaldococcus jannaschii
  diverged_from_family: true
  divergence_description: >-
    Annotated as transcriptional regulators rather than enzymes; the PRT-like domain is treated
    as a regulatory or effector-binding domain. Whether it keeps OPRT catalysis is unknown.
  supported_by:
  - reference_id: file:interpro/panther/PTHR19278/PTHR19278-entries.csv
    supporting_text: Q59040,Transcriptional regulator GfcR,protein,243232
