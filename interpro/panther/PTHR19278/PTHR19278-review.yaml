subfamilies:
- subfamily_id: PANTHER:PTHR19278:SF9
  label: URIDINE 5'-MONOPHOSPHATE SYNTHASE
  description: >-
    The large subfamily (292 of 325 reviewed entries). Despite its name it mixes architectures.
    It holds most standalone bacterial and archaeal pyrE OPRTs (260 entries named orotate
    phosphoribosyltransferase), the animal and Dictyostelium UMPS fusions (human UMPS, mouse
    Umps, Drosophila r-l, C. elegans umps-1) and the cyanobacterial PyrF/PyrE fusion of Nostoc.
    UniProt also maps 18 fungal monofunctional ODCases here (S. pombe ura4), which PANTHER
    classifies in PTHR32119. OPRT activity is the shared function; ODCase activity is present only
    in members with the decarboxylase domain. The module's orotate phosphoribosyltransferase and
    OMP decarboxylase annotons cite human UMPS from this subfamily.
