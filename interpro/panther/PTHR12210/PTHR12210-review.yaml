family_id: PANTHER:PTHR12210
family_name: DULLARD PROTEIN PHOSPHATASE
summary: FCP/SCP-like phosphatase-domain proteins in this family serve distinct cellular roles. CTD small
  phosphatases such as CTDSP2 dephosphorylate protein substrates associated with transcriptional regulation,
  whereas TIM50-family proteins participate in mitochondrial precursor import. Shared phosphatase-like
  architecture does not make all members mitochondrial translocase subunits.
functional_coherence: HETEROGENEOUS
coherence_reason: Small CTD phosphatases preferentially dephosphorylate RNAPII CTD Ser5 in biochemical
  assays, with the most detailed mechanism established for SCP1 (PMID:12721286). CTDSP2 belongs to this
  phosphatase branch, whereas TIM50-related members participate in mitochondrial precursor import. Neither
  phosphatase catalysis nor import-complex participation follows universally from the shared phosphatase-like
  fold; the exact CTD-phosphatase branch set remains unresolved.
