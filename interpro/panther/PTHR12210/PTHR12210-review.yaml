  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    This IRD NOT covers a 288-leaf clade made of the opisthokont and plant Tim50 orthologues
    (125 leaves in PTHR12210:SF3, including human TIMM50, mouse Timm50, budding-yeast TIM50, fission-yeast
    tim50, fly ttm50/ttm2/ttm3, worm scpl-4 and Arabidopsis TIM50) together with a large plant-specific
    set of FCP1-homology/HAD-like proteins (SF64, SF121, SF172 and smaller subfamilies). The ancestral IBD
    at PTN000258719 keeps the activity for the CTD small phosphatases and for Trypanosoma brucei Tim50
    (Q57ZA0), which lies outside this clade, keeps an intact DXDX(T/V) catalytic motif, and loses activity
    when its motif aspartates are mutated. Inside the clade, fungal Tim50 lacks a perfect motif and has no
    phosphatase activity, and UniProt notes that human TIMM50 also lacks the canonical D-x-D-x-[TV] site.
    A motif scan of UniProt sequences (human, mouse, yeast, fission yeast, fly, worm and Arabidopsis Tim50,
    plus the Arabidopsis SF64, SF121 and SF172 members) found no canonical DXDX(T/V) in any of them, while
    TbTim50 has DLDET; the scan was not saved as a repository file. The conflicting evidence is a single
    2004 in vitro report of phosphatase activity for recombinant human TIMM50, which reviews still cite
    but for which no physiological substrate or in vivo role has been found. That IDA stays valid as a
    leaf annotation of an in vitro activity; it does not show that the clade kept the ancestral catalytic
    function. The IRD placement, just below the split from catalytically active kinetoplastid Tim50, is
    therefore supported. Only SF3 is listed as an affected subfamily because it is the branch with
    experimental and sequence evidence; the plant HAD-like subfamilies below the node are untested and
    were only partly sequence-checked.
  supported_by:
  - reference_id: PMID:34360547
    supporting_text: However, since fungal Tim50 does not have a perfect motif, it does not possess phosphatase
