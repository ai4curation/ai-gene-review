  assessment: SOUND
  assessment_reason: >-
    The IBD places kinase activity across the AnmK family, seeded by E. coli AnmK,
    which has direct experimental evidence for anhMurNAc kinase activity
    (PMID:15901686). The family is uniform, so inheritance of the kinase term is
    sound for all members. The term is broad; the more descriptive
    phosphotransferase term (GO:0016773, alcohol group as acceptor) is the one
    used at the module level.
term_assessments:
- assessed_term:
    id: GO:0016301
    label: kinase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    All members are anhMurNAc kinases, so kinase activity is safe for the whole
    family. A more specific phosphotransferase description (GO:0016773) is equally
    applicable family-wide.
- assessed_term:
    id: GO:0016773
    label: phosphotransferase activity, alcohol group as acceptor
  scope: FAMILY_WIDE
  scope_reason: >-
    AnmK phosphorylates the C6 hydroxyl (an alcohol) of the ring-opened sugar in
    every member, so the alcohol-acceptor phosphotransferase description is safe
    family-wide. This is the term used for the AnmK step in the recycling module.
- assessed_term:
    id: GO:0009254
    label: peptidoglycan turnover
  scope: FAMILY_WIDE
  scope_reason: >-
    AnmK commits recovered anhMurNAc to recycling in every member, so the
    peptidoglycan turnover role applies family-wide.
