family_id: PANTHER:PTHR30605
family_name: ANHYDRO-N-ACETYLMURAMIC ACID KINASE
preferred_name: Anhydro-N-acetylmuramic acid kinase (AnmK)
summary: >-
  A compact, functionally uniform bacterial family of anhydro-N-acetylmuramic
  acid kinases (AnmK, EC 2.7.1.170). Each member catalyses a single unusual
  reaction in peptidoglycan recycling: ATP-dependent phosphorylation of
  1,6-anhydro-N-acetylmuramic acid (anhMurNAc) with simultaneous hydrolytic
  opening of the 1,6-anhydro ring, producing N-acetylmuramate 6-phosphate. The
  enzyme uses an ASKHA/actin-like ATPase nucleotide-binding fold. AnmK channels
  anhMurNAc recovered from the sacculus (via lytic transglycosylases, AmpG import
  and NagZ/AmpD processing) into downstream sugar salvage, which in E. coli
  continues through the MurQ etherase and in Pseudomonas-type organisms through
  the MupP/AmgK/MurU anabolic route.
functional_coherence: COHERENT
coherence_reason: >-
  The family is defined by a single enzymatic activity (anhMurNAc kinase) and the
  single PANTHER subfamily SF0. All members share the anhMurNAc kinase reaction;
  no functionally divergent group is present.
