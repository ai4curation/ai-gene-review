family_id: PANTHER:PTHR43706
family_name: NADH DEHYDROGENASE
preferred_name: Type II NADH dehydrogenase (NDH-2) family
summary: >-
  Single-subunit, non-proton-pumping NAD(P)H:quinone oxidoreductases of the mitochondrial inner membrane:
  internal NDI1 and external NDE1/NDE2 of S. cerevisiae, S. pombe SPBC947.15c and SPAC3A11.07, and
  plant NDA/NDB enzymes. They feed electrons from matrix or cytosolic NADH to ubiquinone without
  complex I.
functional_coherence: COHERENT
coherence_reason: >-
  All subfamilies are type II NAD(P)H dehydrogenases; they differ in membrane side (internal vs external)
  and NADPH use (plant NDB).
