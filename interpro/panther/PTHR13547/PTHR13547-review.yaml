family_id: PANTHER:PTHR13547
family_name: FAMILY NOT NAMED
preferred_name: Proteinaceous RNase P catalytic proteins
summary: Proteinaceous RNase P proteins use an RNA-recognition region and a nuclease domain to remove
  precursor tRNA 5-prime leaders. Plant PRORPs and animal mitochondrial RNase P catalytic subunits differ
  in compartment and partner dependence.
functional_coherence: COHERENT
coherence_reason: The curated member set contains plant PRORP1/2/3 and metazoan PRORP/MRPP3 proteins,
  including human O15091 and Arabidopsis Q66GI4, Q680B9 and F4JKB6. Plant biochemical and genetic experiments
  establish precursor-tRNA 5-prime processing in organelles and the nucleus; reconstituted human mitochondrial
  RNase P and its substrate-bound structure establish the homologous cleavage function in animals. Conserved
  RNA-recognition and nuclease architecture supports a coherent tRNA-processing family despite differences
  in compartment and partner dependence.
subfamilies:
- subfamily_id: PANTHER:PTHR13547:SF13
  label: PROTEINACEOUS RNASE P 2
  description: Recorded placement of A0A1S3Y076. The tobacco target combines PRORP-related recognition
    and nuclease domains. Biochemical precursor-tRNA cleavage supports tRNA processing as the conserved
    role; nuclear versus organellar localization and autonomous versus complex-dependent activity require
    branch-specific assessment.
  representative_members:
