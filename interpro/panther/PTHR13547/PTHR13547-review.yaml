term_assessments:
- assessed_term:
    id: GO:0008033
    label: tRNA processing
  scope: FAMILY_WIDE
  scope_reason: 'tRNA processing is the shared broad function of plant PRORP enzymes and animal mitochondrial
    PRORP/MRPP3 catalytic subunits. Arabidopsis experiments establish RNase P activity in organelles and
    the nucleus (PMID:22549728); human reconstitution and the precursor-tRNA-bound structure establish
    PRORP-dependent 5-prime leader cleavage in the mitochondrial complex (PMID:18984158; PMID:34489609).
    The member set includes these plant and metazoan proteins, and the tobacco target retains the PPR
    recognition region and PRORP catalytic region. The family-wide process assignment does not transfer
    autonomous single-protein activity, a particular compartment, or tRNA methyltransferase activity:
    human PRORP requires TRMT10C and SDR5C1, and methylation is performed by its partner TRMT10C.'
