  name:
    name: SecE/SEC61-gamma translocon subunit
    short: SecE_SEC61-gamma
  description:
  - text: The SecE/SEC61-gamma family consists of proteins that are integral components
      of the SEC61 translocon complex, which is essential for the translocation of
      proteins across the endoplasmic reticulum (ER) membrane. Family members form
      a part of the channel-forming translocon complex that interacts with ribosomes
      to facilitate the cotranslational translocation of nascent polypeptides. Additionally,
      they are involved in the ER membrane insertion of transmembrane proteins, cooperating
      with other complexes such as the multi-pass translocon (MPT) complex and the
      translocating protein TRAM1. The SEC61 channel functions as a ribosome receptor
      and creates a gated pore in the ER membrane, which are both critical for the
      import of signal peptide-containing precursor polypeptides into the ER. This
      family plays a pivotal role in the biogenesis of multi-pass membrane proteins
      and is necessary for the proper functioning of the secretory pathway.
