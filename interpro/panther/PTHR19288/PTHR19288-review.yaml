    label: Fungi
  paint_snapshot: '20180914'
  seeds:
  - id: SGD:S000001142
    label: GEP4
    organism: Saccharomyces cerevisiae
  assessment: SOUND
  assessment_reason: >-
    S. cerevisiae Gep4 is the only seed, and the node is the fungal Gep4 clade. It passes the
    term to S. pombe gep4 and other fungi, and to no member of another subfamily. The placement
    is if anything conservative. SF25 also contains plant, algal and B. subtilis PGP
    phosphatases (the Arabidopsis and Chlamydomonas PGPP1 proteins are themselves seeds of the
    root phosphatase node), so the activity probably extends to the whole SF25 clade. The
    mitochondrion (GO:0005739) and cardiolipin biosynthetic process (GO:0032049) terms at the
    same node fit the fungal mitochondrial enzymes, and the S. cerevisiae gene review accepts
    all three IBAs.
