family_id: PANTHER:PTHR19288
family_name: 4-NITROPHENYLPHOSPHATASE-RELATED
preferred_name: HAD subfamily IIA phosphatases (PDXP, LHPP, PGP/G3PP, GEP4/PgpP, PHO13, NagD)
summary: >-
  Magnesium-dependent phosphatases of the haloacid dehalogenase (HAD) superfamily, all with the
  same Rossmannoid HAD core and DxD nucleophile motif but very different substrates. Mammalian
  PDXP (chronophin, SF94) dephosphorylates pyridoxal 5'-phosphate and phospho-Ser3 of cofilin.
  PGP (SF92) is the mammalian glycerol-3-phosphate and phosphoglycolate phosphatase. LHPP
  (SF44) is a phospholysine/phosphohistidine/pyrophosphate phosphatase. Subfamily SF25 holds
  the phosphatidylglycerophosphate (PGP) phosphatases: mitochondrial Gep4 of yeasts, the
  Arabidopsis and Chlamydomonas PGPP1 proteins and B. subtilis PgpP (YqeG). SF46 is a large
  mixed group that includes S. cerevisiae Pho13, S. pombe pho2, human HDHD2 and the bacterial
  NagD/AraL sugar phosphatases. Generic phosphatase activity is conserved across the family;
  substrate specificity is set separately in each subfamily.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Phosphomonoesterase activity is shared, but each characterized subfamily has a different
  physiological substrate: B6 vitamers and cofilin (SF94 PDXP), glycerol-3-phosphate (SF92
  PGP), phospholysine and pyrophosphate (SF44 LHPP), phosphatidylglycerophosphate (SF25
  Gep4/PGPP1/PgpP), and a mix of sugar phosphates and small phosphoesters (SF46). PAINT
  reflects this: only the generic phosphatase activity term (GO:0016791) is placed at the root
  (PTN002711682), and every specific activity is on a shallow lineage node. No
  substrate-specific term is safe at family level.
