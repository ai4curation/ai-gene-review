term_assessments:
- assessed_term:
    id: GO:0008962
    label: phosphatidylglycerophosphatase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for SF25 (Gep4/PGPP1/PgpP), not for other subfamilies. The CDP-DAG phospholipid module
    (gep4_activity) grounds the annoton on PANTHER:PTHR19288:SF25, the correct descriptor.
  applicable_subfamilies:
  - id: PANTHER:PTHR19288:SF25
    label: PHOSPHATIDYLGLYCEROPHOSPHATASE GEP4, MITOCHONDRIAL
  supported_by:
  - reference_id: PMID:20485265
    supporting_text: Here, we identify a novel phosphatase in the mitochondrial matrix space, Gep4,
      and demonstrate that it dephosphorylates phosphatidylglycerolphosphate to generate phosphatidylglycerol,
      an essential step during CL biosynthesis.
  - reference_id: PMID:20485265
    supporting_text: Expression of a mitochondrially targeted variant of Escherichia coli phosphatase
      PgpA restores CL levels in Gep4-deficient cells, indicating functional conservation.
- assessed_term:
    id: GO:0006655
    label: phosphatidylglycerol biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    PGP dephosphorylation is the final step of phosphatidylglycerol synthesis, and the SF25
    enzymes perform it. The CDP-DAG module uses this process term for Gep4. It is the direct
    process for every SF25 member, whatever its compartment.
  applicable_subfamilies:
  - id: PANTHER:PTHR19288:SF25
    label: PHOSPHATIDYLGLYCEROPHOSPHATASE GEP4, MITOCHONDRIAL
  supported_by:
  - reference_id: PMID:20485265
    supporting_text: dephosphorylates phosphatidylglycerolphosphate to generate phosphatidylglycerol
- assessed_term:
    id: GO:0032049
    label: cardiolipin biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Appropriate for the mitochondrial SF25 enzymes, because cardiolipin synthase uses the PG
    that Gep4 makes and Gep4 performs a step of the CL pathway. It is the term PAINT asserts at
    the fungal node PTN001060726. For plastid-targeted SF25 members (Chlamydomonas PGPP1) the PG
    feeds thylakoid lipids rather than cardiolipin, so phosphatidylglycerol biosynthetic process
    is the safer term across the whole subfamily.
  applicable_subfamilies:
  - id: PANTHER:PTHR19288:SF25
    label: PHOSPHATIDYLGLYCEROPHOSPHATASE GEP4, MITOCHONDRIAL
  supported_by:
