notes: >-
  Used by modules/cdp_dag_phospholipid_synthesis.yaml (gep4_activity, SF25), which is consistent
  with this review, and by modules/vitamin_b6_plp_metabolism.yaml (pdxp_activity), which grounds
  on the whole family; SF94 would be the precise descriptor. The PHO13/pho2 node PTN001060795
  (alkaline phosphatase and phosphoglycolate phosphatase, Fungi) is not assessed, because no
  reviewed gene in this repo inherits from it. The S. cerevisiae GEP4 review MODIFYs the root
  cytoplasm IBA (PTN002711682, GO:0005737) towards a mitochondrial term. That is not a node
  error, since GO counts mitochondria as part of the cytoplasm. The S. pombe gep4 gene review
  is still a stub with every action PENDING.
