family_id: PANTHER:PTHR10969
family_name: MICROTUBULE-ASSOCIATED PROTEINS 1A/1B LIGHT CHAIN 3-RELATED
preferred_name: ATG8/LC3/GABARAP ubiquitin-like autophagy modifiers
summary: >-
  PTHR10969 is the compact ATG8/LC3/GABARAP ubiquitin-like modifier family.
  Fungal Atg8 proteins are proteolytically processed to expose a C-terminal
  glycine, conjugated to phosphatidylethanolamine on phagophore and
  autophagosome membranes, and inherited the conserved eukaryotic ATG8
  autophagosome-membrane, PE-binding, autophagosome-assembly, mitophagy,
  starvation-response and autophagosome-maturation PAINT assertions. The family
  also contains metazoan LC3/GABARAP branches with non-fungal microtubule and
  GABA-receptor annotations.
