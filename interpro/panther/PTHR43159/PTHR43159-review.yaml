family_id: PANTHER:PTHR43159
family_name: ENOYL-[ACYL-CARRIER-PROTEIN] REDUCTASE
preferred_name: FabI NADH-dependent enoyl-ACP reductase family
summary: >-
  NADH-dependent enoyl-[acyl-carrier-protein] reductases of the SDR-like FabI fold: E. coli FabI,
  M. tuberculosis InhA and plant plastid ENR (MOD1), which catalyse the last reduction of each type
  II FAS elongation cycle.
