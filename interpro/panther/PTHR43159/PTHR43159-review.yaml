  id: UniProtKB:P0AEK4
  label: Enoyl-[acyl-carrier-protein] reductase [NADH] FabI
  gene_symbol: fabI
  organism: Escherichia coli K-12
  gene_review: genes/ECOLI/fabI/fabI-ai-review.yaml
