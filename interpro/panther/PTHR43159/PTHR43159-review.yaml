  label: ENOYL-[ACYL-CARRIER-PROTEIN] REDUCTASE [NADH], CHLOROPLASTIC
  description: FabI/InhA and plant ENR1.
  diverged_from_family: false
- subfamily_id: PANTHER:PTHR43159:SF7
  label: ENOYL-[ACYL-CARRIER-PROTEIN] REDUCTASE [NADH] 2, CHLOROPLASTIC
