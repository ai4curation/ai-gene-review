notes: >-
  Reference protein added for modules/type_ii_fatty_acid_synthesis.yaml, which grounds its FabI enoyl-reduction
  variant on this family: E. coli FabI (P0AEK4) is a PAINT seed of the family's node PTN001215190 and now has a
  complete gene review, with four EXP and three IDA rows for GO:0004318 and the demonstration that it is the only
  enoyl-ACP reductase of E. coli. The module deliberately grounds the variant on the parent family rather than on
  subfamily SF2, whose official label is chloroplast-biased although the subfamily contains bacterial FabI.
