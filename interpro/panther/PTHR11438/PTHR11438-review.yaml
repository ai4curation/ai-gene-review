- subfamily_id: PANTHER:PTHR11438:SF4
  clade_node_id: PANTHER:PTN002605991
  label: PROENKEPHALIN-B
  description: >-
    Prodynorphin (PDYN; UniProt name Proenkephalin-B) orthologs; 23 tree leaves from gar and teleosts to mammals.
    Eutherian PDYN has exactly three Tyr-Gly-Gly-Phe-Leu cores, the N-termini of alpha/beta-neoendorphin, dynorphin
    A and dynorphin B (rimorphin/leumorphin) (human P01213 Tyr175, Tyr207, Tyr226), each preceded by Lys-Arg. Dynorphin
    A is Leu5 in eutherians, lizard and Xenopus and Met5 in opossum, platypus, chicken, teleosts and gar (zebrafish
    dynorphin A is the peptide whose opioid receptor binding seeds GO:0031628). Non-mammalian PDYN has one or two
    further cores N-terminal to neoendorphin, including a Tyr-Gly-Gly-Phe-Ile core in Xenopus, teleosts and gar and a Tyr-Gly-Gly-Phe-Met core in anole (the proenkephalin signature noted for sarcopterygian prodynorphins,
    PMID:15891003). Dynorphins are the endogenous agonists of the kappa opioid receptor and also bind mu and delta.
    The chicken leaf (A0A8V0Z2W9) contradicts the earlier report that PDYN was lost in chicken (PMID:20463905);
    its N-terminal region and the platypus leaf (A0A6I8NN41, 206 residues, Tyr-Gly-Ala-Ser at the dynorphin B position) look like incomplete gene models and are not taken as evidence of loss.
