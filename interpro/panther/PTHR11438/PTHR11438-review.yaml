      opioid receptors.
- assessed_term:
    id: GO:0031628
    label: opioid receptor binding
  scope: FAMILY_WIDE
  scope_reason: >-
    Enkephalins bind delta and mu, dynorphins bind kappa (and mu and delta), and nociceptin binds the nociceptin
    receptor OPRL1, which GO places under opioid receptors (GO:0031853 nociceptin receptor binding is a child of
    GO:0031628). The term carries no requirement of opiate-like pharmacology, so it holds for mammalian prepronociceptin
    as well.
  supported_by:
  - reference_id: PMID:7566152
    supporting_text: >-
      Taken together, these data indicate that the newly discovered heptadecapeptide is an endogenous agonist of
      the ORL1 receptor and that it may be endowed with pro-nociceptive properties.
  - reference_id: PMID:9047294
    supporting_text: >-
      Dynorphin A (1-17) (dynorphin) acts preferentially and with high affinity at the kappa-opioid receptor, for
      which it is the natural, endogenous ligand.
- assessed_term:
    id: GO:0038003
    label: G protein-coupled opioid receptor signaling pathway
  scope: FAMILY_WIDE
  scope_reason: >-
    The peptides of all three clades are the endogenous agonists that initiate signaling by the four receptors GO
    groups under G protein-coupled opioid receptor activity (GO:0004985, part of GO:0038003; nociceptin receptor
    activity GO:0001626 is one of its children). The ligand performs the initiating step, and GO makes receptor
    ligand activity part of signal transduction, so this is participation and not mere necessity. The term is not
    a PAINT row in this family. Among the family's ligands only mouse Penk has an experimental row (IMP PMID:6933569);
    QuickGO returned 128 experimental, author-statement or IBA rows for the term and its descendants in eight vertebrates, nearly all on
    receptors, so the query can return positives and the gap on ligands is real. With that single seed a PAINT IBD
    could at present be justified only at the PENK node (PTN002606001), not at the root as the previous version
    of this review requested; root placement would need experimental rows in the PDYN and PNOC clades first.
  supported_by:
  - reference_id: PMID:9047294
    supporting_text: >-
      Dynorphin A (1-17) (dynorphin) acts preferentially and with high affinity at the kappa-opioid receptor, for
      which it is the natural, endogenous ligand.
  - reference_id: PMID:7566152
    supporting_text: >-
      The ORL1 receptor, an orphan receptor whose human and murine complementary DNAs have recently been characterized,
      structurally resembles opioid receptors and is negatively coupled with adenylate cyclase.
- assessed_term:
    id: GO:0031635
    label: adenylate cyclase-inhibiting opioid receptor signaling pathway
  scope: FAMILY_WIDE
  scope_reason: >-
    All four receptors couple to pertussis-toxin-sensitive Gi/o and inhibit adenylate cyclase, and the family's
    peptides are their agonists; nociceptin was in fact isolated by its inhibition of forskolin-stimulated adenylate
    cyclase in cells expressing its receptor. Direct ligand-level evidence cited here is for nociceptin; for enkephalins
    and dynorphins the cited support is receptor coupling shown with mu-selective agonists plus the identity of
    the endogenous ligand, which is an inference. No ligand in human, mouse, rat or zebrafish carries this term
    in GO (the same query returned experimental rows on OPRK1, Oprm1 and Itgb3, so it can return a positive); the
    term is little used anywhere, there is no PAINT seed, and no PAINT change is requested.
  supported_by:
  - reference_id: PMID:7481766
    supporting_text: >-
      Nanomolar concentrations of orphanin FQ inhibited forskolin-stimulated adenylyl cyclase activity in cells
      transfected with LC132.
  - reference_id: PMID:7566152
    supporting_text: >-
      The synthetic heptadecapeptide potently inhibits adenylate cyclase in CHO(ORL1+) cells in culture and induces
      hyperalgesia when administered intracerebroventricularly to mice.
  - reference_id: PMID:18384820
    supporting_text: >-
      In control animals, the mu-opioid selective agonists, sufentanil and DAMGO, stimulated [35S]5'-(gamma-thio)-triphosphate
      ([35S]GTP gamma S) binding and inhibited forskolin-stimulated adenylyl cyclase activity, through a mechanism
      involving pertussis toxin (PTX) sensitive G alpha(i/o) subunits.
  - reference_id: PMID:22437502
    supporting_text: >-
      The μOR couples predominantly to Gi, the inhibitory G protein for adenylyl cyclase. μOR signaling through
      Gi is responsible for its analgesic properties4.
