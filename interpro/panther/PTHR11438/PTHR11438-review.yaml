node_assessments:
- node_id: PANTHER:PTN000153716
  asserted_term:
    id: GO:0043025
    label: neuronal cell body
  evidence: IBD
  negated: false
  paint_snapshot: '20170228'
  seeds:
  - id: RGD:62054
  - id: RGD:68946
  assessment: SOUND
  assessment_reason: >-
    The node is the family root, a duplication node with no taxon in PAINT, whose three children are the PDYN, PENK
    and PNOC clades (each Euteleostomi). The seeds are rat Pdyn (RGD:62054; IDA PMID:16924480) and rat Penk (RGD:68946;
    IDA PMID:2695900, synenkephalin immunocytochemistry), one in each of two child clades; the PNOC clade has no
    seed. All three precursors are made in neurons and transit the soma before packaging into dense-core vesicles,
    so the location holds for every descendant and the placement is right. Caveat for PAINT: the seeds are located_in
    rows and the IBA is emitted as is_active_in, although the peptides act after secretion on receptors of target
    cells; the cell body is a site of synthesis. The human PNOC gene review marks its row over-annotated for that
    reason. The term is true as a location; the qualifier, not the node, is what needs attention.
- node_id: PANTHER:PTN000153716
  asserted_term:
    id: GO:0001515
    label: opioid peptide activity
  evidence: IBD
  negated: false
  paint_snapshot: '20260828'
  seeds:
  - id: UniProtKB:P01211
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The single seed is bovine PENK (P01211), a leaf of the PENK clade; the PDYN and PNOC clades have no seed. Root
    placement is defensible for PENK and PDYN: every leaf of both clades encodes at least two Tyr-Gly-Gly-Phe cores
    preceded by paired basic residues, and enkephalins and dynorphins are the peptides the term's definition names.
    It is also the likely ancestral state of the PNOC clade, whose non-mammalian members keep a Tyr-Gly-Gly-Phe
    nociceptin. The mammalian PNOC branch (PTN000153720, 13 leaves from human to platypus) has lost the function
    as GO defines it (an opiate-like effect reversible by naloxone or another morphine antagonist): all 13 have
    the identical nociceptin FGGFTGARKSARKLANQ, with Phe replacing the N-terminal Tyr (human Q13519 Phe130) and
    Leu replacing Trp14 (Leu143), and no other Tyr-Gly-Gly-Phe core anywhere in the precursor. That peptide does
    not activate opioid receptors, its action at its own receptor is unaffected by opioid ligands, and it produces
    hyperalgesia instead of analgesia (PMID:7481766, PMID:7566152); the Tyr1 to Phe change is the one that nearly
    abolishes opioid receptor binding of dynorphin A, and restoring Tyr1 in nociceptin raises opioid receptor affinity
    10- to 40-fold (PMID:8798582, abstract). The loss rests on named residues, so an IKR at the mammalian PNOC node
    is requested. It is not requested for the whole PNOC clade: chicken, Xenopus, teleost and gar nociceptin have
    Tyr1 and Trp14, the form that in sturgeon binds mu, delta and kappa receptors with near-equal affinity to NOP
    (PMID:11290742, abstract), and nothing shows those peptides lack opioid activity. The anole leaf (Phe1, Trp14)
    lies outside the requested node and is unresolved. Separately, the seed could not be verified: on 2026-11-26
    QuickGO returned no experimental GO:0001515 annotation on P01211 or on any other tree leaf (the same query returned
    experimental rows for other proteins, so it can return a positive), and live IBA rows dated 2025-12-02 still
    list mouse Penk and rat Penk as sources that the 2026-08-28 PAINT row no longer has. The model-organism rows
    now use receptor ligand activity (GO:0048018) for Penk, so this IBD may lose its last seed.
