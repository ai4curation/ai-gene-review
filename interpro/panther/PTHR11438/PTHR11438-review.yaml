  clade_node_id: PANTHER:PTN002606001
  label: PROENKEPHALIN-A
  description: >-
    Proenkephalin (PENK) orthologs; 25 tree leaves from spotted gar and teleosts (zebrafish has two copies, a duplication
    at PTN000153768) to mammals. In the family alignment the six N-terminal cysteines (human P01210 Cys26, Cys30,
    Cys33, Cys48, Cys52, Cys65) are present in every complete sequence. Human, rodent, bovine, marsupial, monotreme,
    bird, lizard and Xenopus PENK have seven Tyr-Gly-Gly-Phe cores at conserved alignment positions (human P01210 Tyr100, Tyr107, Tyr136, Tyr186, Tyr210, Tyr230, Tyr261), preceded by a pair of basic residues (Lys-Asn before one core in two Xenopus laevis copies); gar PENK also has seven and teleost PENK four to six. The core at human 230-234 is Leu-enkephalin in amniotes, gar and one zebrafish
    copy and Met-enkephalin in the five Xenopus leaves, so Xenopus PENK encodes no Leu-enkephalin. The products
    (Met- and Leu-enkephalin, Met-enkephalin-Arg-Phe, Met-enkephalin-Arg-Gly-Leu and the BAM peptides) are agonists
    of the delta and mu opioid receptors; BAM8-22, which lacks the N-terminal Tyr-Gly-Gly-Phe, instead activates
    MRGPRX1. Three leaves are incomplete or extended gene models (cat Q28409 is a 187-residue fragment; cat A0A5F5XWQ5 and dog A0A8I3S6A4 are longer models lacking the N-terminal cysteines) and are not evidence of loss.
