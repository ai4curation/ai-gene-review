  assessment: SOUND
  assessment_reason: >-
    Seeds sit in two of the three child clades: mouse Penk (MGI:MGI:104629; IMP PMID:8849726, annotated acts_upstream_of_or_within)
    and human PENK in the PENK clade, mouse Pnoc (MGI:MGI:105308; IGI PMID:19448152 and PMID:22311985) in the PNOC
