- site_id: opioid_message_tyr
  label: >-
    N-terminal tyrosine of the opioid core at the dynorphin A / BAM22 / nociceptin alignment position
  description: >-
    The first residue of the Tyr-Gly-Gly-Phe opioid core that occupies PANTHER 19 alignment columns 637-641, the
    one core position aligned as HMM match columns in all three clades: Met-enkephalin 210-214 at the start of BAM22
    in human PENK (P01210, the anchor; UniProt PEPTIDE feature), dynorphin A 207 in human PDYN and nociceptin 130
    in human PNOC. The position is taken from UniProt peptide features and the alignment projection in PTHR11438-tree-msa-check.txt,
    not from an active-site feature. PENK and PDYN carry further copies of the core elsewhere, so this single position
    contributes to, and does not by itself decide, their opioid peptide activity; in PNOC it is the only core in
    mammals.
