subfamilies:
- subfamily_id: PANTHER:PTHR11438:SF3
  clade_node_id: PANTHER:PTN002606001
  label: PROENKEPHALIN-A
  description: >-
    Vertebrate Proenkephalin-A (PENK) orthologs. Synthesized in striatal medium spiny neurons,
    dorsal horn interneurons, and adrenal medullary chromaffin cells and processed by prohormone
    convertases PC1/PC2 and carboxypeptidase E into Met-enkephalin, Leu-enkephalin,
    Met-enkephalin-Arg-Gly-Leu, Met-enkephalin-Arg-Phe, and BAM peptides, which preferentially
    activate delta (OPRD1) and mu (OPRM1) opioid receptors to drive Gi/o-coupled adenylate
    cyclase-inhibiting opioid receptor signaling (GO:0038003, GO:0031635) and analgesia.
  representative_members:
  - id: UniProtKB:P01210
    label: Proenkephalin-A
    gene_symbol: PENK
    organism: Homo sapiens (Human)
    gene_review: human/PENK
  - id: UniProtKB:P22005
    label: Proenkephalin-A
    gene_symbol: Penk
    organism: Mus musculus (Mouse)
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:7057924
    supporting_text: >-
      The corresponding amino acid sequence shows that the precursor is 267 amino acids long and
      contains six interspersed Met-enkephalin sequences and one Leu-enkephalin sequence. Five of
      the seven enkephalins are flanked on both sides by pairs of basic amino acid residues.
- subfamily_id: PANTHER:PTHR11438:SF4
  clade_node_id: PANTHER:PTN002606008
  label: PROENKEPHALIN-B
  description: >-
    Vertebrate Proenkephalin-B / Prodynorphin (PDYN) orthologs. Processed in dense-core
    vesicles into dynorphin A(1-17), dynorphin A(1-8), dynorphin B (rimorphin), alpha- and
    beta-neoendorphin, and Leu-enkephalin, which act as the high-affinity endogenous agonists
    for the kappa-opioid receptor (OPRK1) to drive Gi/o-coupled adenylate cyclase-inhibiting
    opioid receptor signaling (GO:0038003, GO:0031635), presynaptic inhibition, and pain/stress
    modulation.
  representative_members:
  - id: UniProtKB:P01213
    label: Proenkephalin-B
    gene_symbol: PDYN
    organism: Homo sapiens (Human)
    gene_review: human/PDYN
  - id: UniProtKB:O35417
