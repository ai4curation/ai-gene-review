- subfamily_id: PANTHER:PTHR11438:SF5
  clade_node_id: PANTHER:PTN000153743
  label: PREPRONOCICEPTIN
  description: >-
    Teleost-specific prepronociceptin paralog (zebrafish Q5RIC2, ZFIN ZDB-GENE-040114-1; medaka H2MNG6), one of
    the two teleost copies produced by the duplication at PTN001687710 inside the PNOC clade. Like the other teleost
    copy it encodes a Tyr-Gly-Gly-Phe-Ile nociceptin and an upstream Phe-Gly-Gly-Phe peptide, each preceded by Lys-Arg.
    The only experimental GO annotation on a member is a morpholino phenotype in zebrafish placode development (PMID:23906067);
    no receptor pharmacology was found for this copy specifically, so nothing distinguishes its function from SF2.
