    label: Prepronociceptin
    gene_symbol: Pnoc
    organism: Rattus norvegicus (Rat)
  diverged_from_family: true
  divergence_description: >-
    The divergence is limited to opioid peptide activity (GO:0001515) and, on present evidence, to the mammalian
    branch (PTN000153720), which the subfamily boundary does not separate. Mammalian nociceptin has Phe in place
    of the N-terminal Tyr of the opioid core and Leu in place of Trp14; it does not activate the classical opioid
    receptors, its action is not blocked by opioid ligands, and it is hyperalgesic, not analgesic, when given centrally
    (PMID:7481766, PMID:7566152). Substituting Tyr for Phe1 raises its affinity for opioid receptors 10- to 40-fold
    while leaving NOP binding intact (PMID:8798582). The other family-level terms (receptor binding in GO's broad
    sense, neuropeptide signaling, the opioid receptor signaling pathway) still apply. Non-mammalian PNOC keeps
    the Tyr-Gly-Gly-Phe core and Trp14; sturgeon orphanin of that form binds mu, delta and kappa receptors as well
    as NOP (PMID:11290742), so no divergence is asserted there.
  supported_by:
  - reference_id: PMID:7481766
    supporting_text: >-
      This inhibitory activity was not affected by the addition of opioid ligands, nor did the peptide activate
      opioid receptors.
  - reference_id: PMID:7566152
