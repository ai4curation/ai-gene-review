family_id: PANTHER:PTHR11438
family_name: PROENKEPHALIN
preferred_name: Proenkephalin / prodynorphin / prepronociceptin opioid neuropeptide family
summary: >-
  Secreted vertebrate opioid and opioid-related neuropeptide polyprotein precursors
  (InterPro:IPR006024), comprising three paralogous subfamilies: Proenkephalin-A (PENK,
  PANTHER:PTHR11438:SF3; cleaved into six Met-enkephalin copies, including C-terminally extended
  heptapeptide/octapeptide forms and BAM8-22, plus one Leu-enkephalin copy), Proenkephalin-B /
  Prodynorphin (PDYN, PANTHER:PTHR11438:SF4; cleaved into alpha- and beta-neoendorphin,
  dynorphin A, dynorphin B/rimorphin, leumorphin, and Leu-enkephalin), and Prepronociceptin
  (PNOC, PANTHER:PTHR11438:SF2; cleaved into the heptadecapeptide nociceptin / orphanin FQ).
  All three precursors share a conserved N-terminal cysteine-rich domain and tandem dibasic
  prohormone convertase cleavage sites releasing peptides with the canonical Tyr-Gly-Gly-Phe-Met/Leu
  (PENK, PDYN) or Phe-Gly-Gly-Phe (PNOC) message motif, which act as endogenous opioid peptide
  ligands (GO:0001515) for the Gi/o-coupled opioid receptor GPCRs OPRD1, OPRM1, OPRK1, and
  OPRL1 to initiate the G protein-coupled opioid receptor signaling pathway (GO:0038003) and
  its canonical adenylate cyclase-inhibiting opioid receptor signaling pathway (GO:0031635).
functional_coherence: COHERENT
coherence_reason: >-
  All vertebrate members of PANTHER:PTHR11438 (PENK in SF3, PDYN in SF4, and PNOC in SF2) are
  secreted dense-core-vesicle neuropeptide polyproteins that share opioid peptide activity
  (GO:0001515, a child of neuropeptide hormone activity GO:0005184 and receptor ligand activity
  GO:0048018), opioid receptor binding (GO:0031628), extracellular/vesicular localization
  (GO:0005576, GO:0099013), and direct participation in the G protein-coupled opioid receptor
  signaling pathway (GO:0038003) and its canonical adenylate cyclase-inhibiting opioid receptor
  signaling pathway (GO:0031635). PAINT places GO:0001515, GO:0031628, GO:0007218 (neuropeptide
  signaling pathway), GO:0019233 (sensory perception of pain), and GO:0043025 at the
  Euteleostomi root node PTN000153716, but omits both GO:0038003 and GO:0031635 across the
  family, leaving PDYN and zebrafish penka/penkb without GO:0038003 and all family members
  without GO:0031635 (Category A/B pathway gap).
