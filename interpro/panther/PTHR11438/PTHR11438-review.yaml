  seeds:
  - id: ZFIN:ZDB-GENE-060417-1
  assessment: SOUND
  assessment_reason: >-
    The seed is zebrafish pdyn (ZFIN:ZDB-GENE-060417-1; IPI PMID:17069980, in which zebrafish and mammalian dynorphin
    A displaced diprenorphine from, and activated, the cloned zebrafish delta-, mu- and kappa-like receptors; abstract).
    The tree leaf for zebrafish pdyn carries no ZFIN id (A0A8M3AYT0), so the seed was matched through QuickGO, where
    the rows sit on other accessions of the same gene; it lies in the PDYN clade only. The term nevertheless holds
    in all three clades: PENK peptides bind delta and mu receptors, and nociceptin binds OPRL1, which GO classes
    as an opioid receptor (nociceptin receptor binding GO:0031853 is a child of GO:0031628). Unlike GO:0001515 this
    term does not require opiate-like pharmacology, so the mammalian PNOC branch is not an exception. A row placed
    above its only seed is the usual over-propagation pattern; here the sister clades are among the best-established
    opioid receptor ligands known, and mouse Penk and mouse Pnoc carry experimental receptor ligand activity rows
    (GO:0048018; IDA PMID:6933569, IGI PMID:19448152).
