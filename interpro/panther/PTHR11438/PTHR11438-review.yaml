- subfamily_id: PANTHER:PTHR11438:SF2
  clade_node_id: PANTHER:PTN002606008
  label: PREPRONOCICEPTIN
  description: >-
    Prepronociceptin (PNOC) orthologs; node PTN002606008 has 23 leaves from gar and teleosts to mammals, 21 labelled
    SF2 and two (one teleost duplicate) labelled SF5. Each sequence has one nociceptin (orphanin FQ) heptadecapeptide,
    at the alignment columns of the dynorphin A core, flanked by Lys-Arg. The 13 mammalian leaves (human to platypus)
    have the identical peptide FGGFTGARKSARKLANQ (human Q13519 130-146). Chicken, Xenopus, teleost and gar leaves
    have YGGFIG[VI]RKSARKWN[NS]Q, with Tyr at position 1 and Trp at position 14; the anole leaf has Phe1 with Trp14.
    Amphibian and fish precursors also carry a second, upstream Phe-Gly-Gly-Phe peptide (two nociceptin-like sequences
    were described for zebrafish, PMID:14522087). Nocistatin (human 98-127) is alignable only among therian mammals,
    where its C-terminal Glu-Gln-Lys-Gln-Leu-Gln is conserved in eutherians; orphanin FQ2 (human 149-165) is conserved
    in mammals and recognisable in tetrapods. Nociceptin is the agonist of the nociceptin receptor OPRL1.
  representative_members:
  - id: UniProtKB:Q13519
    label: Prepronociceptin
    gene_symbol: PNOC
    organism: Homo sapiens (Human)
    gene_review: human/PNOC
  - id: UniProtKB:Q64387
