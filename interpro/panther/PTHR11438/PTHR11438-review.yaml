  required_for:
  - term:
      id: GO:0001515
      label: opioid peptide activity
    strength: CONTRIBUTES
    rationale: >-
      Classical opioid receptors recognise the N-terminal Tyr-Gly-Gly-Phe message of enkephalins and dynorphins.
      Replacing Tyr1 of dynorphin A by Phe nearly abolishes opioid receptor binding, and mammalian nociceptin, which
      has Phe here, does not activate opioid receptors, while Tyr1-nociceptin gains 10- to 40-fold affinity for
      them (PMID:8798582, abstract). Graded CONTRIBUTES, not REQUIRED, because proenkephalin and prodynorphin have
      other copies of the core, and because a Tyr at this position is not shown to be sufficient (the non-mammalian
      nociceptins are untested apart from sturgeon).
