term_assessments:
- assessed_term:
    id: GO:0001515
    label: opioid peptide activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for the proenkephalin and prodynorphin clades, whose peptides are the opioids the term's definition names
    and whose Tyr-Gly-Gly-Phe cores are present in every tree leaf. Not safe family-wide: mammalian prepronociceptin
    (the 13 leaves under PTN000153720) encodes only a Phe-Gly-Gly-Phe nociceptin that does not activate opioid receptors
    and whose effects are not opiate-like, which is what GO:0001515 requires (naloxone-reversible opiate-like effect).
    Non-mammalian prepronociceptin (SF2 outside mammals, and SF5) keeps the Tyr core and may retain the activity
    (sturgeon orphanin binds the classical receptors, PMID:11290742), but that is untested for any tree species,
    so it is neither granted nor requested for pruning. The term is not a child of neuropeptide hormone activity
    (GO:0005184), as the previous version of this review said; its parent is receptor ligand activity (GO:0048018).
  applicable_subfamilies:
  - id: PANTHER:PTHR11438:SF3
    label: PROENKEPHALIN-A
  - id: PANTHER:PTHR11438:SF4
    label: PROENKEPHALIN-B
  supported_by:
  - reference_id: PMID:7057924
    supporting_text: >-
      The corresponding amino acid sequence shows that the precursor is 267 amino acids long and contains six interspersed
      Met-enkephalin sequences and one Leu-enkephalin sequence.
  - reference_id: PMID:7481766
    supporting_text: >-
