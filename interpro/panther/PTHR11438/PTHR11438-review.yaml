    supporting_text: >-
      Dynorphin A (1-17) (dynorphin) acts preferentially and with high affinity at the
      kappa-opioid receptor, for which it is the natural, endogenous ligand.
- subfamily_id: PANTHER:PTHR11438:SF2
  clade_node_id: PANTHER:PTN002605991
  label: PREPRONOCICEPTIN
  description: >-
    Vertebrate Prepronociceptin (PNOC) orthologs. Processed in neuronal dense-core vesicles into
    the heptadecapeptide nociceptin (orphanin FQ, FGGFTGARKSARKLANQ), the selective endogenous
    agonist for the Gi/o-coupled nociceptin opioid receptor OPRL1 (NOP; GO:0038003, GO:0031635).
