notes: >-
  Re-reviewed on 2026-11-26 against the PANTHER 19 tree and family alignment (tree_msa_check.py and PTHR11438-tree-msa-check.txt
  in this folder; all residue numbers are UniProt numbering of the named accession, and the alignment rows of the
  reviewed leaves were confirmed identical to the UniProt sequences, sequence version as recorded in that file).
  Corrections to the first version: the clade nodes of SF4 and SF2 were swapped (PTN002605991 is prodynorphin, PTN002606008
  is prepronociceptin), which had attached dynorphin evidence to two prepronociceptin PAINT rows; SF5 was missing;
  GO:0001515 was called family-wide and a child of GO:0005184; and PAINT was asked to add GO:0038003 and GO:0031635
  at the root without seeds there. Evolution: PENK, PDYN and PNOC descend from one ancestral gene through the two
  vertebrate genome duplications, with POMC a local duplicate of PNOC (PMID:20463905, PMID:8710928); the root of
  this tree is therefore older than its Euteleostomi children, and cartilaginous-fish and lamprey members discussed
  in the literature (PMID:20937278) are not among the tree leaves. Limits of this review: PMID:22311985, PMID:8798582,
  PMID:11290742, PMID:17069980, PMID:11826101, PMID:6933569, PMID:14522087, PMID:15891003, PMID:20463905 and PMID:21247980
  were read as PubMed abstracts only and are not in the local publication cache, so nothing is quoted from them;
  the seed papers PMID:16924480, PMID:2695900, PMID:7911809, PMID:8847409 and PMID:8849726 were taken from the QuickGO
  rows and not read beyond titles or abstracts. Experimental annotations were read from QuickGO on 2026-11-26 for
  all 71 tree leaves; outside human, mouse, rat and zebrafish there are none. Originally curated for the Ligands
  in Signaling Pathways work on the opioid receptor signaling module.
