family_id: PANTHER:PTHR11438
family_name: PROENKEPHALIN
preferred_name: Proenkephalin / prodynorphin / prepronociceptin opioid neuropeptide precursor family
summary: >-
  Secreted neuropeptide polyprotein precursors of bony vertebrates (InterPro:IPR006024). The PANTHER 19 tree has
  71 leaves in three ortholog clades that arise from a duplication at the family root and are each present from
  spotted gar and teleosts to mammals: proenkephalin (PENK; PANTHER:PTHR11438:SF3, node PTN002606001), prodynorphin
  (PDYN, UniProt name Proenkephalin-B; PANTHER:PTHR11438:SF4, node PTN002605991) and prepronociceptin (PNOC; PANTHER:PTHR11438:SF2,
  node PTN002606008, which also contains the teleost-specific duplicate PANTHER:PTHR11438:SF5). The fourth member
  of the vertebrate opioid precursor gene family, proopiomelanocortin, is classified in a different PANTHER family
  and is not covered here. All members share a signal peptide, an N-terminal domain with six cysteines that are
  invariant in the family alignment, and a C-terminal region in which peptides are released at paired basic residues.
  PENK carries four to seven copies of the Tyr-Gly-Gly-Phe-Met/Leu enkephalin core (seven in human: six Met-enkephalin
  cores, two of them C-terminally extended, and one Leu-enkephalin). PDYN carries two to five cores; the three shared
  by all complete sequences are the neoendorphin, dynorphin A and dynorphin B cores, and non-mammalian PDYN has
  additional enkephalin-like cores. Enkephalins and dynorphins are agonists of the delta, mu and kappa opioid receptors.
  PNOC encodes one nociceptin (orphanin FQ) heptadecapeptide at the alignment position of dynorphin A, plus lineage-specific
  peptides (nocistatin and orphanin FQ2 in mammals; a second Phe-Gly-Gly-Phe peptide in amphibians and ray-finned
  fishes). Nociceptin is the agonist of the nociceptin receptor OPRL1 (NOP). In all 13 mammalian PNOC sequences
  in the tree its first residue is Phe and residue 14 is Leu, and this peptide neither activates the classical opioid
  receptors nor has naloxone-reversible opiate-like action; in chicken, Xenopus, teleost and gar PNOC the same peptide
  starts Tyr-Gly-Gly-Phe and has Trp at residue 14, the form that in sturgeon binds the classical opioid receptors
  as well as NOP. All four receptors are Gi/o-coupled and inhibit adenylate cyclase.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Every member is a secreted prohormone processed at dibasic sites into neuropeptide ligands of the opioid receptor
  family, so receptor ligand activity, opioid receptor binding in GO's sense (GO:0031628 has nociceptin receptor
  binding GO:0031853 as a child), neuropeptide signaling (GO:0007218) and the G protein-coupled opioid receptor
  signaling pathway (GO:0038003, of which nociceptin receptor activity GO:0001626 is a part through GO:0004985)
  hold across the three clades. The exception is opioid peptide activity (GO:0001515), which GO defines by an opiate-like
  effect reversible by naloxone: it holds for the proenkephalin and prodynorphin clades, where every tree leaf has
  at least two Tyr-Gly-Gly-Phe cores, and not for mammalian prepronociceptin, whose only core is Phe-Gly-Gly-Phe
  (human Q13519 Phe130) and whose peptide does not activate opioid receptors (PMID:7481766). Non-mammalian prepronociceptin
  retains the Tyr core and is experimentally uncharacterised apart from the sturgeon peptide (PMID:11290742), so
  its status for GO:0001515 is open. Two reviewed proteins that PANTHER's HMM assigns to SF3 but that are not tree
  leaves, and so receive no IBA, differ further: shrew soricidin (P0C2P6, 54 residues) is a salivary paralytic toxin
  and TRPV6 inhibitor that matches only the N-terminal cysteine domain and has no opioid core, and fangblenny proenkephalin
  (P0DP56) is a venom-gland transcript.
