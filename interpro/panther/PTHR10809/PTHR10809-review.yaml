family_id: PANTHER:PTHR10809
family_name: VESICLE-ASSOCIATED MEMBRANE PROTEIN-ASSOCIATED PROTEIN
summary: VAP proteins provide membrane-associated docking surfaces for lipid-transfer and other trafficking
  proteins. Canonical VAPA/VAPB and yeast Scs proteins use an MSP domain to recognize FFAT-containing
  partners, helping organize membrane contacts rather than transporting lipids through an intrinsic catalytic
  site.
functional_coherence: MOSTLY_COHERENT
coherence_reason: IPR016763 and the reviewed human VAPA record support ER-associated partner recruitment.
  Plant VAP-related proteins and variant architectures require separate assessment of membrane anchoring
  and partner specificity. VAPA family membership is insufficient evidence for plasma-membrane residence,
  tight-junction membership or lipid-transfer activity of VAPA itself.
