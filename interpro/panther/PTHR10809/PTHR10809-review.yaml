    label: endoplasmic reticulum membrane
  scope: UNRESOLVED
  scope_reason: The FFAT-contact study directly identifies VAP-A and VAP-B as ER receptors, supporting
    ER residence in both canonical mammalian branches rather than only VAPA. The family also contains
    yeast Scs proteins and plant/variant architectures with different membrane anchors. A complete localization
    boundary is not defined, but ER-membrane residence is well supported for the anchored VAPA/VAPB mechanism.
    Contact with another organelle does not relocate the VAP anchor to that organelle.
  supported_by:
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/evidence-b.json
    supporting_text: Endoplasmic reticulum (ER)-anchored protein that mediates the formation of contact
      sites between the ER and endosomes via interaction with FFAT motif-containing proteins such as STARD3
      or WDR44
  - reference_id: PMID:33124732
    supporting_text: 'The endoplasmic

      reticulum possesses three major receptors, VAP-A, VAP-B, and MOSPD2'
