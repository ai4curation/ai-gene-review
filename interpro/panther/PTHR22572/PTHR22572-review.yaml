  diverged_from_family: true
  divergence_description: >-
    Catalytically inactive. GMPPA binds GDP-mannose with high affinity and inhibits GMPPB
    allosterically within the GMPPA-GMPPB complex. Koehler et al. attribute the loss of catalysis
    to a conserved 2-residue insertion in the nucleotide-binding motif, which they say is present
    in GMPPAs from all species. PAINT has an IRD (NOT nucleotidyltransferase activity) at
    PTN000500807, and no SF104 member receives GO:0004475 or GO:0016779. Members should not be
    annotated with GDP-mannose pyrophosphorylase activity or GDP-mannose biosynthetic process.
  supported_by:
  - reference_id: PMID:33986552
    supporting_text: catalytically inactive subunit GMPPA displays a much higher affinity to GDP-Man
