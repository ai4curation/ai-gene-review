    GMPPB-type enzymes catalyse the last step of GDP-mannose synthesis, so this is participation.
    GMPPA regulates the GDP-mannose level allosterically but catalyses no step. Restrict the term
    to SF15, matching the module and the PSA1 and mpg1 gene reviews.
  applicable_subfamilies:
