notes: >-
  The fetched entries.csv has no subfamily column for this family, so subfamily placements come
  from the PANTHER 19.0 per-organism classification files. The paint tsv omits the IRD at
  PTN000500807, which was found in IBD.gaf. The GMPPA-lineage members it covers were inferred
  from the PAINT GAF: all SF104 model-organism members receive only GO:0005737 from PTN000500804,
  and nothing from PTN000500861. Arabidopsis At2g04650 (SF146, "ADP-GLUCOSE PYROPHOSPHORYLASE
  FAMILY PROTEIN") also receives only the cytoplasm IBA. Its function was not examined. Two open
  questions in the gene reviews have answers here. The mpg1 review asks whether S. pombe has a
  non-catalytic GMPPA-like paralog: PANTHER puts SPBC13G1.02 (O60064) in the GMPPA subfamily SF104,
  covered by the PAINT IRD. The PSA1 review asks the same for S. cerevisiae: the PANTHER 19
  budding-yeast proteome has no member of SF104 or of any other PTHR22572 subfamily besides PSA1.
