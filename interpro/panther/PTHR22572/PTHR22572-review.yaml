  description: >-
    The GMPPA lineage: human, mouse and zebrafish GMPPA, fly Gmppa, worm Y47D9A.1, Dictyostelium
    gmppA, Candida PSA2, Arabidopsis F9E10.24 and S. pombe SPBC13G1.02. S. cerevisiae has no member
    of this subfamily in PANTHER 19.
  representative_members:
