family_id: PANTHER:PTHR22572
family_name: SUGAR-1-PHOSPHATE GUANYL TRANSFERASE
preferred_name: Sugar-1-phosphate nucleotidyltransferase family (GMPPB/GMPPA and relatives)
summary: >-
  Sugar-1-phosphate nucleotidyltransferases condense a sugar 1-phosphate with a nucleoside
  triphosphate to give a nucleotide sugar and pyrophosphate. In eukaryotes the best-known members
  are the catalytic GDP-mannose pyrophosphorylases: S. cerevisiae PSA1, S. pombe mpg1, human
  GMPPB and Arabidopsis CYT1. They make GDP-mannose from mannose 1-phosphate and GTP, the last step
  of GDP-mannose synthesis. Animals, fungi other than budding yeast, plants and Dictyostelium also
  have a paralogous GMPPA lineage. GMPPA is catalytically inactive and binds GDP-mannose; it forms
  a complex with GMPPB and inhibits it allosterically. The family further includes bacterial and
  archaeal nucleotidyltransferases with other specificities: M. tuberculosis ManB (GDP-mannose),
  Synechocystis CugP (UDP-glucose) and the HddC enzymes that make GDP-heptose.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family shares a nucleotidyltransferase fold, but its members differ in sugar and nucleotide
  specificity: GDP-mannose for GMPPB, PSA1, mpg1, CYT1 and M. tuberculosis ManB; UDP-glucose for
  Synechocystis CugP; GDP-D-glycero-alpha-D-manno-heptose for HddC. The GMPPA lineage (SF104) has
  lost catalysis and become an allosteric regulator. So no specific activity term is safe at the
  family level. Mannose-1-phosphate guanylyltransferase activity is safe for the GMPPB-type
  subfamily SF15, which is exactly the subfamily the dolichol_phosphate_sugar_donor_supply module
  uses. PAINT handles the GMPPA split with an IRD (NOT GO:0016779 at PTN000500807, Eukaryota). That
  row is in IBD.gaf but missing from the fetched paint tsv. PAINT keeps GO:0004475 at the GMPPB
  node PTN000500861.
