  - id: SGD:S000002213
    label: PSA1
    organism: Saccharomyces cerevisiae
  - id: CGD:CAL0000178573
    label: MPG1
    organism: Candida albicans
  assessment: UNRESOLVED
  assessment_reason: >-
    The node is the right clade. The question is the term. GMPPB-type enzymes make the
    nucleotide-sugar donor, which is necessary for glycoprotein synthesis (vig9/psa1 and mpg1
    mutants are glycosylation-defective), but the enzyme performs no step of glycan assembly or
    transfer to protein. The PSA1 and mpg1 reviews keep the IBA as non-core. GDP-mannose
    biosynthetic process (GO:0009298, asserted at the same node) is the process the enzyme
    actually carries out.
  supported_by:
  - reference_id: PMID:9195935
    supporting_text: Saccharomyces cerevisiae VIG9 encodes GDP-mannose pyrophosphorylase, which is
      essential for protein glycosylation.
term_assessments:
- assessed_term:
    id: GO:0004475
    label: mannose-1-phosphate guanylyltransferase (GTP) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Safe for the catalytic GMPPB-type subfamily SF15. This is the subfamily
    (PANTHER:PTHR22572:SF15) that the dolichol_phosphate_sugar_donor_supply module names for its
    GMPP annoton, with PSA1, mpg1 and GMPPB as representatives. Not safe for the GMPPA lineage
    (SF104), nor for prokaryotic members with other nucleotide-sugar specificities (CugP,
    HddC). Other subfamilies named "MANNOSE-1-PHOSPHATE GUANYLYLTRANSFERASE" (for example SF141,
    which holds Arabidopsis At4g30570, and SF159, which holds M. tuberculosis ManB) probably also
    qualify, but their members were not checked here and they are not listed.
  applicable_subfamilies:
  - id: PANTHER:PTHR22572:SF15
    label: MANNOSE-1-PHOSPHATE GUANYLTRANSFERASE BETA
  supported_by:
