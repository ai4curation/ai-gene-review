family_id: PANTHER:PTHR35891
family_name: THIOL:DISULFIDE INTERCHANGE PROTEIN DSBA
preferred_name: DsbA and DsbL protein thiol-disulfide oxidoreductases
summary: DsbA and DsbL proteins exchange disulfides with protein substrates. Characterized bacterial members
  introduce disulfides into exported proteins, with distinct client preferences and recycling partners.
  Reduced E. coli DsbA also catalyzes disulfide isomerization in vitro; that secondary capability is not
  equivalent to a conserved native isomerase role. The DsbL-labelled subfamily includes the two active
  monomeric Campylobacter 81116 DsbAs.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Protein thiol-disulfide chemistry is shared by characterized DsbA/DsbL proteins, but
  client specificity, partner recognition, localization and secondary isomerase capacity cannot be generalized
  from the family name.
