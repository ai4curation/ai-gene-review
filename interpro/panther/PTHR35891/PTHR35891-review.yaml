term_assessments:
- assessed_term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  scope: UNRESOLVED
  scope_reason: The reversible protein thiol/disulfide reaction is established for active DsbA/DsbL representatives
    in SF2 and SF3, including both exact-sequence Campylobacter exemplars. However, the primary paper
    reports inactive truncated DsbA2 variants in other Campylobacter strains. Their exact current family
    and tree placement was not resolved here, so neither a whole-family grant nor a blanket exclusion
    of SF3 is justified. The positive SF2 PAINT node is assessed separately. No residue-loss branch or
    member exception is invented.
  supported_by: &id005
  - reference_id: PMID:34948248
    supporting_text: We found that both CjDsbAs recognized RNaseA as their substrate and exhibited oxidase
      activity such as that of EcDsbA
  - &id002
    reference_id: PMID:8155639
    supporting_text: The reduced form of the protein is a disulfide isomerase while the oxidized protein
      can assist formation of disulfide bonds in reduced substrates under physiological conditions.
- assessed_term:
    id: GO:0003756
    label: protein disulfide isomerase activity
  scope: UNRESOLVED
  scope_reason: A quantitative E. coli DsbA assay establishes a real secondary activity (misfolded IGF-I,
    Km 43 micromolar, kcat 0.2 per minute). Lack of a known native IGF-I client is not grounds for deleting
    that MF. Whether other SF2 or SF3 proteins retain comparable isomerization is not established by oxidative
    RNase refolding or the shared CXXC chemistry. No loss branch is inferred.
  supported_by: &id004
  - *id002
- assessed_term:
    id: GO:0030288
    label: outer membrane-bounded periplasmic space
  scope: SUBFAMILY_ONLY
  scope_reason: The sampled SF2 clade comprises diderm bacterial periplasmic DsbAs. Broader SF3 sampling
    includes a plant protein; bacterial Campylobacter evidence does not establish this bacterial compartment
    throughout SF3.
  supported_by: &id003
  - reference_id: PMID:8155639
    supporting_text: DsbA is an Escherichia coli periplasmic protein that mediates disulfide bond formation
      in newly secreted proteins in vivo.
  applicable_subfamilies:
  - id: PANTHER:PTHR35891:SF2
    label: THIOL:DISULFIDE INTERCHANGE PROTEIN DSBA
- assessed_term:
    id: GO:0071236
    label: cellular response to antibiotic
  scope: UNRESOLVED
  scope_reason: The PAINT annotation is recorded, but a conserved antibiotic-response mechanism cannot
    be established from the accessible target-level experiments. The original E. coli review retains uncertainty
    for its experimental rows. This is neither evidence of evolutionary loss nor a claim that the seed
    paper studied the wrong gene.
