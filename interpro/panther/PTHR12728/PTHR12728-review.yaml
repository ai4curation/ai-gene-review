    supporting_text: Rpf2 is a conserved protein essential for the maturation of 25 S rRNA and the 60
      S ribosomal subunit assembly [[cite:PUB00020277]]. It is part of the complex (Rpf2/Rrs1/rpL5/rpL11)
      that functions in intermediate stages of 66S preribosome maturation and assembles into 90S preribosomes
      containing 35S pre-rRNA [[cite:PUB00090083]].
