family_id: PANTHER:PTHR12728
family_name: BRIX DOMAIN CONTAINING PROTEIN
preferred_name: Rpf2 large-subunit ribosome assembly factors
summary: Rpf2 proteins are conserved Brix-domain ribosome assembly factors. Together with Rrs1 and ribosomal
  proteins, they participate in incorporation and maturation of the large-subunit ribonucleoprotein particle.
  Their role is RNA binding and preribosome assembly rather than peptide synthesis or an intrinsic rRNA-processing
  nuclease reaction.
functional_coherence: COHERENT
coherence_reason: Curated IPR039770 and the inventory specifically identify Rpf2, rather than an arbitrary
  Brix-domain protein. The conserved role is assembly of the large-subunit preribosome with Rrs1 and the
  5S-ribonucleoprotein components. This supports NCU08595 large-subunit assembly by orthology, while exact
  pre-rRNA intermediate numbers and a catalytic nuclease activity cannot be supplied by the Brix domain.
subfamilies:
- subfamily_id: PANTHER:PTHR12728:SF0
  label: RIBOSOME PRODUCTION FACTOR 2 HOMOLOG
  description: The curated InterPro entry specifically identifies Rpf2 rather than all Brix-domain proteins,
    and the sampled members are Rpf2 orthologs. Large-subunit assembly is transferable within that group;
    precise pre-rRNA intermediate names can differ among organisms.
