  name:
    name: Polyamine Aminopropyltransferase
    short: Polyamine_APTase
  description:
  - text: This family of proteins is involved in the biosynthesis of polyamines, which
      are organic compounds that play critical roles in cellular processes such as
      DNA stabilization, RNA function, and growth of thermophilic microorganisms under
      high-temperature conditions. Members of this family catalyze the irreversible
      transfer of a propylamine group from the amino donor S-adenosylmethioninamine
      (decarboxylated S-adenosylmethionine) to various amine acceptors, including
      putrescine, to produce spermidine. Some enzymes within this family can also
      transfer the propylamine group to other acceptors such as 1,3-diaminopropane,
      norspermidine, and spermidine, yielding a variety of polyamines like sym-norspermidine,
      thermospermine, and caldopentamine. The activity of these enzymes is essential
      for the proper function and development of organisms, including the regulation
      of xylem specification in plants.
