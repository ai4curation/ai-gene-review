family_id: PANTHER:PTHR14084
family_name: KYNURENINASE
preferred_name: Kynureninase (BNA5/KYNU) family
summary: >-
  PLP-dependent kynureninases hydrolyse 3-hydroxykynurenine (and kynurenine) to 3-hydroxyanthranilate
  (or anthranilate) and alanine on the kynurenine route of de novo NAD synthesis (S. cerevisiae BNA5,
  human KYNU, bacterial KynU). Some fungi have a second paralog (SF2).
functional_coherence: COHERENT
coherence_reason: Both subfamilies are kynureninases.
