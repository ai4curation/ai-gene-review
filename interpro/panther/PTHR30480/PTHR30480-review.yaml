notes: >-
  Written for the peptidoglycan_recycling module, whose NagZ step is grounded on
  SF13 with E. coli NagZ (P75949) and P. putida KT2440 NagZ (Q88KZ4) as
  representatives. The PANTHER family name ("BETA-HEXOSAMINIDASE-RELATED") lumps
  the bacterial NagZ clade with a divergent eukaryotic histone-acetyltransferase
  clade, so the glucosaminidase and recycling terms are scoped SUBFAMILY_ONLY to
  SF13. The only PTHR30480 genes in this repository are bacterial NagZ members
  (SF13), which carry the scoped terms correctly.
