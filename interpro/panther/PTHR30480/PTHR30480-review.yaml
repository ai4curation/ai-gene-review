family_id: PANTHER:PTHR30480
family_name: BETA-HEXOSAMINIDASE-RELATED
preferred_name: Glycoside hydrolase family 3 proteins (bacterial NagZ beta-N-acetylglucosaminidase subfamily plus divergent eukaryotic members)
summary: >-
  A glycoside hydrolase family 3 (GH3) grouping whose bacterial members are NagZ,
  the cytoplasmic beta-N-acetylglucosaminidase of peptidoglycan recycling. NagZ
  removes the terminal beta-1,4-linked N-acetylglucosamine from imported
  anhydromuropeptides, releasing free GlcNAc and the 1,6-anhydro-MurNAc-peptide,
  and so feeds both the sugar and peptide salvage arms. The family as named by
  PANTHER is not functionally uniform: besides the bacterial NagZ clade it
  contains a divergent eukaryotic (fungal) clade whose PAINT node carries nuclear
  histone acetyltransferase and transcription-regulation terms rather than
  glycosidase activity. The glucosaminidase activity is therefore a property of
  the bacterial NagZ subfamily, not of the whole family.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The bacterial NagZ clade (SF13) are beta-N-acetylglucosaminidases acting in
  cytoplasmic peptidoglycan recycling, whereas a divergent eukaryotic/fungal
  clade (PAINT node PTN001253301, seeded by a Candida albicans protein) is
  annotated with nuclear histone H3 acetyltransferase activity (GO:0010484) and
  RNA-polymerase-II transcription regulation (GO:0006357). These are unrelated
  functions, so no glycosidase term is safe across the whole family.
