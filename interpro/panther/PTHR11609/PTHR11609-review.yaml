node_assessments:
- node_id: PANTHER:PTN000549205
  asserted_term:
    id: GO:0004638
    label: phosphoribosylaminoimidazole carboxylase activity
  paint_snapshot: '20251202'
  seeds:
  - id: CGD:CAL0000185210
    label: ADE2
    organism: Candida albicans
  - id: SGD:S000005654
    label: ADE2
