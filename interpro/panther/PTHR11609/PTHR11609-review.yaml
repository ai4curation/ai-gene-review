  asserted_term:
    id: GO:0006144
    label: purine nucleobase metabolic process
  paint_snapshot: '20260528'
  seeds:
  - id: CGD:CAL0000185210
    label: ADE2
    organism: Candida albicans
  - id: SGD:S000005654
    label: ADE2
    organism: Saccharomyces cerevisiae
  - id: UniProtKB:C8V449
    label: ANIA_03626
    organism: Aspergillus nidulans
  assessment: WRONG_NODE
  assessment_reason: >-
    The seeds' annotations follow the historical habit of calling the de novo "adenine pathway" a
    nucleobase pathway. PurK and the PurK-PurE fusions act on ribonucleotide intermediates (AIR,
    N5-CAIR, CAIR) of de novo IMP synthesis, and no free purine base is formed or consumed. In the GO
    release used for validation, GO:0006189 'de novo' IMP biosynthetic process is not a descendant of
    GO:0006144, so the inherited term is a misclassification, not a correct but general term. The
    S. cerevisiae ADE2 and S. pombe ade6 gene reviews MODIFY this IBA to GO:0006189. Recommended fix:
    change the IBD at this node to GO:0006189, which holds for all PurK-domain members. The non-PurK
    outliers that inherit it (for example B. cereus Pyl) need pruning either way.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11609/PTHR11609-paint.tsv
    supporting_text: "PTHR11609\tPTN000549205\tGO:0006144\tP\tIBD\tfalse\tCGD:CAL0000185210|SGD:S000005654|UniProtKB:C8V449"
  - reference_id: file:genes/SCHPO/ade6/ade6-ai-review.yaml
    supporting_text: Should be de novo IMP biosynthetic process.
