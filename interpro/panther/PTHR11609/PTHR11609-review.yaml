  - id: UniProtKB:P09029
    label: purK
    organism: Escherichia coli K-12
  assessment: WRONG_NODE
  assessment_reason: >-
    GO:0004638 is defined as the class II reaction, AIR + CO2 = CAIR, with no ATP and no N5-CAIR
    intermediate. No descendant of this node performs it. E. coli PurK, a seed, catalyses only the
    first half-reaction (AIR + HCO3- + ATP -> N5-CAIR), as Mueller et al. showed. The fungal ADE2
    seeds catalyse both half-reactions (ATP-dependent N5-CAIR formation, then class I mutase), as
    Firestine et al. showed for the Cryptococcus enzyme. The overall stoichiometry is still not the
    GO:0004638 reaction. The seeds' experimental annotations record a block at AIR carboxylation,
    which is the right step but the wrong chemistry. All 110 recipients therefore receive an activity
    they do not perform, including the 37 recipients that have Pfam data but no PurE domain (mostly bacterial PurK) and the
    non-PurK outliers (B. cereus Pyl Q814Z5, Shewanella SO_3265, Streptomyces SCO0993). The fix is to
    replace the IBD with GO:0034028 (5-(carboxyamino)imidazole ribonucleotide synthase activity),
    which every PurK-domain member has. GO:0034023 (mutase) belongs only on the fused fungal/plant
    clade, if PAINT can isolate it. The S. cerevisiae ADE2 and S. pombe ade6 gene reviews both
    MODIFY this IBA to the two half-reaction terms. No subfamily is listed as affected because SF5,
    which holds every reviewed member, would have to be listed in full.
  supported_by:
  - reference_id: PMID:8117684
    supporting_text: PurK is shown, by NMR spectroscopy, to catalyze the conversion of AIR in the presence
      of HCO3- and ATP to ADP, P(i), and the carbamate of AIR (designated N5-CAIR).
  - reference_id: PMID:9500840
    supporting_text: The N-terminal domain is related to E. coli PurK and a series of kinetic experiments
      show that the ADE2-PurK activity uses AIR, ATP, and HCO3- as substrates.
  - reference_id: PMID:21548610
    supporting_text: In bacteria, yeasts, and plants, 5-aminoimidazole ribonucleotide (AIR) is converted
      to 4-carboxy-AIR (CAIR) by two enzymes
  - reference_id: file:genes/SCHPO/ade6/ade6-ai-review.yaml
    supporting_text: The N5-CAIR route is captured by the PurK and class I PurE half-reaction terms, not
      the class II direct-carboxylase term.
