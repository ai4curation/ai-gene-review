family_id: PANTHER:PTHR11609
family_name: PURINE BIOSYNTHESIS PROTEIN 6/7, PUR6/7
preferred_name: PurK-type N5-CAIR synthetases and fungal/plant PurK-PurE (ADE2-type) fusions
summary: >-
  This family is defined by the PurK-type ATP-grasp N5-carboxyaminoimidazole ribonucleotide
  (N5-CAIR) synthetase. In bacteria, yeasts and plants the carboxylation of 5-aminoimidazole
  ribonucleotide (AIR) to 4-carboxy-AIR (CAIR) takes two half-reactions. PurK uses ATP and
  bicarbonate to carbamylate the AIR exocyclic amine, giving N5-CAIR, and a class I PurE mutase then
  moves the carboxylate onto C4 of the ring. Bacterial members (E. coli, B. subtilis, Pseudomonas
  PurK) are standalone N5-CAIR synthetases with a separate PurE partner. Fungal ADE2 (S. cerevisiae
  Ade2, S. pombe ade6, Candida and Cryptococcus ADE2) and plant PURKE proteins fuse an N-terminal
  PurK domain to a C-terminal class I PurE domain, so one polypeptide carries out both
  half-reactions. Dictyostelium purC/E fuses a SAICAR synthetase domain, a PurE domain and a PurK
  domain. None of these proteins catalyses the class II direct, ATP-independent carboxylation of AIR
  with CO2 that animal PAICS performs.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The PurK N5-CAIR synthetase activity is shared by the bacterial standalone PurK proteins and the
  PurK domains of the fungal, plant and Dictyostelium fusions. Two things diverge. First, the class I
  PurE mutase activity is present only in the fused members: the bacterial standalone PurKs lack the
  PurE (PF00731) domain. Both groups sit in PANTHER subfamily SF5, so the mutase cannot be scoped by
  subfamily label. Second, the reviewed SF5 member Q814Z5 (Bacillus cereus Pyl) is an ATP-grasp
  carboxylate-amine ligase in cell-surface polysaccharide synthesis. It lacks the PurK-type
  ATP-grasp domain (PF02222) and does not make N5-CAIR.
