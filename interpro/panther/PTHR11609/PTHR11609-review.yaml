- assessed_term:
    id: GO:0004638
    label: phosphoribosylaminoimidazole carboxylase activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    The class II direct carboxylase reaction (AIR + CO2 = CAIR, no ATP) is not performed by any member
    of this family. Bacterial PurK makes N5-CAIR, and the fungal/plant fusions run the ATP-dependent
    two-step N5-CAIR route. The term reaches the family through the PAINT IBD at PTN000549205 (judged
    WRONG_NODE above) and through EC 4.1.1.21 mappings in IEA and YeastPathways RCA annotations.
    Treponema denticola PurE shows what a genuine class II enzyme looks like: no PurK gene, and AIR
    and CO2 bound directly.
  supported_by:
  - reference_id: PMID:21548610
    supporting_text: In animals, the conversion of AIR to CAIR requires a single enzyme, AIR carboxylase
      (class II PurE).
  - reference_id: PMID:21548610
    supporting_text: The spirochete dental pathogen Treponema denticola lacks a purK gene and contains a
      class II purE gene, the hallmarks of CO(2)-dependent CAIR synthesis.
  - reference_id: file:genes/yeast/ADE2/ADE2-ai-review.yaml
    supporting_text: GO:0004638 (EC 4.1.1.21) describes direct CO2-dependent carboxylation of AIR, the class
      II (animal PAICS) chemistry.
