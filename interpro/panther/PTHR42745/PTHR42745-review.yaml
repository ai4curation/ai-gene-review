    supporting_text: The enzyme is specific for A5P and Ru5P
  - reference_id: PMID:16199563
    supporting_text: Recombinant GutQ was shown to indeed be a second copy of API from the E. coli K-12 genome
  - reference_id: file:ECOLI/kdsD/kdsD-uniprot.txt
