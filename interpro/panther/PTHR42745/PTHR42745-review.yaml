      member P42502 kpsF PTHR42745:SF1 length 317 NOT_IN_TREE: Arabinose 5-phosphate isomerase KpsF
- assessed_term:
    id: GO:0019294
    label: keto-3-deoxy-D-manno-octulosonic acid biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    The arabinose 5-phosphate made by these isomerases feeds KDO synthesis in E. coli (KdsD, and GutQ when KdsD
    is absent), but paralogs are deployed in different contexts: KpsF serves capsule KDO, GutQ also regulates the
    gut operon, and the second KT2440 SF1 paralog PP_1806 has no tested role. Which paralog carries LPS KDO flux
    in a genome with more than one cannot be read from subfamily membership, so the process is assessed per gene.
  supported_by:
  - reference_id: PMID:16199563
    supporting_text: >-
      it is suggested that A5P is not only a building block for KDO biosynthesis but also may be a regulatory molecule
      involved in expression of the gut operon
  - reference_id: PMID:16765569
    supporting_text: indicating genetic redundancy for these two functions
