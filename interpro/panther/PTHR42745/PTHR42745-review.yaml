- assessed_term:
    id: GO:0019146
    label: arabinose-5-phosphate isomerase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Both subfamilies contain directly assayed APIs (E. coli KdsD in SF1, GutQ in SF2), and every reviewed member
    is either named as an API or is an uncharacterized protein with the same SIS plus tandem CBS architecture. No
    member is recorded as having lost the activity, and PAINT makes no assertion either way.
  supported_by:
