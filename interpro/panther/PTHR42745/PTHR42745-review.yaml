family_id: PANTHER:PTHR42745
family_name: FAMILY NOT NAMED
preferred_name: KdsD/GutQ/KpsF-type arabinose-5-phosphate isomerases
summary: >-
  Arabinose-5-phosphate isomerases (API, EC 5.3.1.13) with an N-terminal SIS sugar-isomerase domain and two C-terminal
  CBS domains (the KdsD/KpsF architecture, PIRSF004692, TIGR00393). They interconvert D-ribulose 5-phosphate and
  D-arabinose 5-phosphate, the first committed step of KDO synthesis. The 23 reviewed members fall into SF1 (17
  members: KdsD of enterobacteria, Pseudomonas, Francisella and Yersinia, the capsule-cluster KpsF isomerases of
  E. coli, and uncharacterized orthologs of Helicobacter, Aquifex, Haemophilus and Rickettsia) and SF2 (6 members:
  enterobacterial GutQ). PANTHER has no PAINT annotations for this family.
functional_coherence: COHERENT
coherence_reason: >-
  Every characterized member is an arabinose-5-phosphate isomerase: E. coli KdsD and GutQ are assayed enzymes, and
  the KpsF and uncharacterized members share the full SIS plus tandem CBS architecture. The paralogs differ in physiological
  deployment (LPS KDO for KdsD, capsule KDO for KpsF, gut operon signalling and backup KDO supply for GutQ), not
  in the catalysed reaction.
