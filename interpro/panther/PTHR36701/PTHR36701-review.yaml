family_id: PANTHER:PTHR36701
family_name: EPOXYQUEUOSINE REDUCTASE QUEH
preferred_name: QueH cobalamin-independent epoxyqueuosine reductase family
summary: >-
  QueH (formerly DUF208, InterPro IPR003828) is a nonorthologous replacement
  for QueG: it catalyses the same final epoxyqueuosine-to-queuosine step of
  tRNA queuosine biosynthesis without cobalamin, using an active-site [4Fe-4S]
  cluster beside a second coordinated metal. The family is unrelated in
  sequence to QueG and occurs largely in genomes that lack queG. The
  Thermotoga maritima member is the structurally characterized reference.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF1). All 10 reviewed members in the entries file are
  named epoxyqueuosine reductase QueH.
reference_protein:
  id: UniProtKB:Q9WZJ0
  label: Epoxyqueuosine reductase QueH
  gene_symbol: queH
  organism: Thermotoga maritima MSB8
  gene_review: genes/THEMA/queH/queH-ai-review.yaml
subfamilies:
