term_assessments:
- assessed_term:
    id: GO:0052693
    label: epoxyqueuosine reductase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Single subfamily. Genes from eight phylogenetically distant members of this
    family, including the Thermotoga reference, each restored queuosine in an
    E. coli queG deletion, so the activity is family-wide rather than
    lineage-specific. Both reviewed members accept it as core, and the
    queuosine maturation module asserts it for the QueH route.
  supported_by:
  - reference_id: PMID:28128549
    supporting_text: >-
      All the genes duf208 from B. pertussis, D. ethenogenes, H. somnus, S.
      aureus, S. epidermidis, S. pyogenes, T. maritima, and H. pylori allows
      the restoration of the presence of Q into the ΔqueG strain when present
      on a pBAD24 plasmid.
- assessed_term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  scope: FAMILY_WIDE
  scope_reason: >-
    The Thermotoga structure resolves a [4Fe-4S] cluster in the active site,
    and UniProt maps its four cysteine ligands in both reviewed members. The
    cluster is required for the reductase chemistry.
  supported_by:
  - reference_id: PMID:34652139
    supporting_text: >-
      The structure reveals an unusual active site architecture with a
      [4Fe-4S] metallocluster along with an adjacent coordinated iron metal.
