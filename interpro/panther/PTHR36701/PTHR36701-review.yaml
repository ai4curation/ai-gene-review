notes: >-
  PAINT has no node-level annotations for this family (16 nodes, none
  annotated), so there are no node assessments to make and no PAINT slice is
  kept in the repository. The identity of the second active-site metal and the
  physiological electron donor are open; purified QueH consumes
  epoxyqueuosine-tRNA in vitro but queuosine has not been detected as product.
  One member, Helicobacter pylori Hp0100 (O24926), was separately identified as
  a component of a stable, tRNA-independent Asn-transamidosome, where it
  enhances AdT-catalysed conversion of Asp-tRNA(Asn) to Asn-tRNA(Asn) about
  35-fold (PMID:23258533). That paper assays the complex, not epoxyqueuosine
  reduction, so it does not displace the reductase assignment; whether the two
  activities coexist in this member is open. (FamilyReview references carry no
  supporting_text slot, so the verbatim quote for this claim cannot be stored
  here.)
