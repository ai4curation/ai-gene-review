family_id: PANTHER:PTHR28657
family_name: INDOLEAMINE 2,3-DIOXYGENASE
preferred_name: Indoleamine 2,3-dioxygenase (IDO/BNA2) family
summary: >-
  Heme dioxygenases that open the indole ring of tryptophan to N-formylkynurenine, the first step
  of the kynurenine route to NAD. Fungal BNA2 (S. cerevisiae) feeds de novo NAD synthesis. Animal
  IDO1 (immunoregulatory) and IDO2 act on tryptophan and other indoleamines. Further fungal members
  sit in secondary-metabolite clusters.
functional_coherence: COHERENT
coherence_reason: >-
  All subfamilies are tryptophan/indoleamine 2,3-dioxygenases; their physiological roles differ.
