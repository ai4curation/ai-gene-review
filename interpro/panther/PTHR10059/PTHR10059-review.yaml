family_id: PANTHER:PTHR10059
family_name: GRANULOCYTE-MACROPHAGE COLONY-STIMULATING FACTOR  GM-CSF
preferred_name: Granulocyte-macrophage colony-stimulating factor family
summary: >-
  PTHR10059 is a compact mammalian GM-CSF cytokine family. All reviewed
  InterPro/PANTHER members are mammalian CSF2 orthologs, including human CSF2,
  mouse Csf2 and rat Csf2. The family carries a single PANTHER subfamily, SF0,
  and a single PAINT node with IBD annotations for extracellular region,
  cytokine activity and myeloid cell differentiation.
functional_coherence: COHERENT
coherence_reason: >-
  The reviewed family is functionally coherent: its members are secreted GM-CSF
  cytokines that bind species-specific GM-CSF receptors and signal through the
  alpha/common-beta receptor complex. No reviewed PTHR10059 member suggests a
  divergent non-cytokine activity or a loss clade.
