review_date: '2026-11-27'
notes: >-
  Human CSF2 is the only human reviewed Swiss-Prot member of PTHR10059 and the
  only missing human review in this family. The single PAINT node, PTN000006643,
  aligns with the direct human CSF2 literature for extracellular location,
  cytokine activity and myeloid cell differentiation; no module or GO-CAM review
  was added because the family itself is a one-ligand cytokine family rather than
  a multi-protein mechanism.
