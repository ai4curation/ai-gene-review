family_id: PANTHER:PTHR43853
family_name: 3-KETOACYL-COA THIOLASE, PEROXISOMAL
preferred_name: 'Thiolase family: peroxisomal 3-ketoacyl-CoA thiolase, FadA and PaaJ'
summary: >-
  Biosynthetic/degradative thiolases. Peroxisomal 3-ketoacyl-CoA thiolases (human ACAA1, S. cerevisiae
  POT1, plant KAT) catalyse the last step of each beta-oxidation cycle; bacterial FadA does the same
  in the cytosol. SF2 (PaaJ) cleaves 3-oxoadipyl-CoA and 3-oxo-5,6-dehydrosuberyl-CoA in phenylacetate
  catabolism.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are 3-ketoacyl-CoA thiolases; chain-length and substrate preferences differ by subfamily.
