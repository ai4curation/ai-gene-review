family_id: PANTHER:PTHR43853
family_name: 3-KETOACYL-COA THIOLASE, PEROXISOMAL
preferred_name: 'Thiolase family: peroxisomal 3-ketoacyl-CoA thiolase, FadA and PaaJ'
summary: >-
  Thiolases of the peroxisomal 3-ketoacyl-CoA thiolase family. Peroxisomal 3-ketoacyl-CoA thiolases (human
  ACAA1, S. cerevisiae POT1, plant KAT; SF8, SF13, SF15, SF17, SF19) catalyse the last step of each beta-oxidation
  cycle; bacterial FadA (SF11), the beta subunit of the FadBA complex, does the same in the cytoplasm
  of enterobacteria and pseudomonads. SF2 (PaaJ) cleaves 3-oxoadipyl-CoA and 3-oxo-5,6-dehydrosuberyl-CoA
  in phenylacetate catabolism.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All members are 3-ketoacyl-CoA thiolases; chain-length and substrate preferences differ by subfamily.
