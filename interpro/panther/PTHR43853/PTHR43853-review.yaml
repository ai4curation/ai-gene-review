family_id: PANTHER:PTHR43853
family_name: 3-KETOACYL-COA THIOLASE, PEROXISOMAL
preferred_name: 'Thiolase family: peroxisomal 3-ketoacyl-CoA thiolase, FadA and PaaJ'
summary: Thiolases of the peroxisomal 3-ketoacyl-CoA thiolase family. Peroxisomal 3-ketoacyl-CoA thiolases
  (human ACAA1, S. cerevisiae POT1, plant KAT; SF8, SF13, SF15, SF17, SF19) catalyse the last step of
  each beta-oxidation cycle; bacterial FadA (SF11), the beta subunit of the FadBA complex, does the same
  in the cytoplasm of enterobacteria and pseudomonads. Characterized PaaJ enzymes cleave aromatic-pathway
  CoA esters; the exact KT2440 PP3275/PP3280 substrate-assay bridge and a blanket SF2 chemistry grant
  remain unresolved. Pseudomonas fragi thiolase requires its matched alpha partner in the isolated-subunit
  assay. Bacillus FadA is assigned to the steroid-named SF21, so the common FadA symbol is not a subfamily
  identifier. The H37Rv beta chain is in PTHR43365 and is not a representative of this family.
functional_coherence: MOSTLY_COHERENT
coherence_reason: All members are 3-ketoacyl-CoA thiolases; chain-length and substrate preferences differ
  by subfamily.
