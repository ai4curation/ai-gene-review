family_id: PANTHER:PTHR43853
family_name: 3-KETOACYL-COA THIOLASE, PEROXISOMAL
preferred_name: 'Thiolase family: peroxisomal 3-ketoacyl-CoA thiolase, FadA, PcaF/PaaJ'
summary: >-
  Degradative (class I) thiolases that cleave 3-oxoacyl-CoA thioesters with CoA, through a
  covalent acyl-enzyme at an active-site cysteine, into acetyl-CoA and an acyl-CoA two carbons
  shorter. Peroxisomal 3-ketoacyl-CoA thiolases (human ACAA1, S. cerevisiae POT1, plant KAT/PED1)
  catalyse the last step of each peroxisomal beta-oxidation cycle; bacterial FadA (SF11) does the
  same in the cytosol as part of the FadBA complex; actinobacterial FadA5-type thiolases (SF21)
  act on steroid side chains. Subfamily SF2 holds the 3-oxoadipyl-CoA thiolases of aromatic
  catabolism: PaaJ of the phenylacetate pathway, which cleaves both the ring-derived C8
  intermediate 3-oxo-5,6-dehydrosuberyl-CoA (to 2,3-dehydroadipyl-CoA and acetyl-CoA) and
  3-oxoadipyl-CoA (to succinyl-CoA and acetyl-CoA), and PcaF of the protocatechuate branch of the
  beta-ketoadipate pathway.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All characterized members are 3-ketoacyl-CoA thiolases, so acetyl-CoA C-acyltransferase
  activity is family-wide. Substrate and pathway differ by subfamily: straight-chain fatty
  acyl-CoAs in peroxisomal beta-oxidation (SF8 and plant KAT subfamilies) and bacterial
  beta-oxidation (SF11 FadA), steroid side chains (SF21), and 3-oxoadipyl-CoA / ring-derived
  dicarboxylyl-CoAs in aromatic catabolism (SF2 PaaJ/PcaF). Fatty acid beta-oxidation and
  peroxisome are therefore not family-wide.
