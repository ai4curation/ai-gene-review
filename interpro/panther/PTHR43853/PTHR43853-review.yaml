    a secondary fatty-acyl role, so the positive FadA/peroxisomal scope is retained without a categorical
    SF2 loss or pruning claim. E. coli FadA appearing among the seeds is expected experimental grounding,
    not circularity. Placement at the family root is defensible for the beta-oxidation thiolases that
    seed it (peroxisomal ACAA1/POT1 in SF8 and bacterial FadA in SF11), and POT1 and ACAA1 accept it.
    One identified branch never acts on fatty acyl-CoAs: the SF2 3-oxoadipyl-CoA thiolases (PaaJ, PcaF)
    cleave ring-derived 3-oxo-5,6-dehydrosuberyl-CoA and 3-oxoadipyl-CoA in aromatic catabolism, while
    E. coli fatty acid beta-oxidation uses FadA/FadI. The E. coli paaJ review marks the inherited IBA
