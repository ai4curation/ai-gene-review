notes: The2026-11-06 beta-oxidation audit verifies the cached root/node topology but distinguishes it
  from the absent phenylacetate IBD and unresolved KT2440 PaaJ identity. Previous categorical claims that
  no FadA participates in phenylacetate metabolism and that SF2 must lose beta-oxidation are withdrawn
  pending exact evidence. These are uncertainty judgments, not positive phenylacetate assignments. Family/PAINT
  source files and original node/seed identities are unchanged. Added representatives preserve the official
  SF11 and SF21 labels; matched complex and substrate-range evidence governs actual module capacity.
