notes: >-
  Classification conflict for E. coli PaaJ (P0C7L2): PANTHER 19.0's E. coli classification file
  (.cache/panther/PTHR19.0_e_coli) places it in PTHR43853:SF2, but its UniProt cross-reference
  (and InterPro's PTHR18919 member list) says PTHR18919:SF12 (ACYLTRANSFERASE RV0859-RELATED). P.
  putida KT2440 PaaJ (Q88HS3) is PTHR43853:SF2 in both sources. Because the family/gene
  cross-check joins on the UniProt cross-reference, the E. coli paaJ review is checked against the
  PTHR18919 review, not this one; that review records the conflict on its SF12 entry. Note also
  that 17259607 calls the thiolase gene "paaE" in the P. putida nomenclature. E. coli paaJ, ACAA1
  and POT1 carry a GO:0010124 (phenylacetate catabolic process) IBA citing PTN001823071 that is
  absent from the current PAINT slice (snapshot 20260530); ACAA1 and POT1 reviews reject it, the
  E. coli paaJ review accepts it on its own experimental grounds. Node mapping from PANTHER's
  PAINT_TreeGrafter_Annotations_TOTAL.txt (paint/current, 2026-10-23): PTN001823071 =
  PTHR43853:AN0 (root), PTN000432379 = AN1 (SF8). Module use: phenylacetate_catabolism grounds
  PaaJ at SF2 on GO:0003988 and GO:0033812.
