family_id: PANTHER:PTHR10460
family_name: ABL INTERACTOR FAMILY MEMBER
preferred_name: WAVE/SCAR regulatory complex ABI subunit and Abl interactor adaptor family
summary: 'Eukaryotic scaffolding adaptor family whose members occupy the obligate ABI subunit slot of the heteropentameric
  WAVE/SCAR regulatory complex (WRC; CYFIP1/2-NCKAP1/1L-WASF1/2/3-ABI-BRK1 in vertebrates). Across metazoans,
  Dictyostelium (abiA), and land plants (ABIL1-ABIL5), family members conserve an N-terminal helical bundle
  (WAVE-binding WAB helices, t-SNARE-like coiled-coil, and homeodomain homologous region) that forms a trimeric
  coiled-coil core with WAVE/SCAR and BRK1/HSPC300 and docks onto  the CYFIP:NCKAP subcomplex to transduce
  Rac1/CED-10 signals to Arp2/3-mediated branched actin nucleation. Metazoan members additionally carry proline-rich
  PxxP motifs and a C-terminal Src homology 3 (SH3) domain that couple the actin machinery to non-receptor
  tyrosine kinases and auxiliary effectors. Within vertebrates, gene duplication produced three paralogous
  clades with distinct signaling outputs: ABI1 (SF2/SF40) and ABI2 (SF26/SF57) retain a central PNDY phosphotyrosine
  linker and C-terminal SH3 domain that bind and regulate c-Abl/Arg kinases and assemble the EPS8-ABI1-SOS1
  Rac-GEF complex, whereas ABI3/NESH (SF7/SF58/SF60) retains WRC assembly and the C-terminal SH3 domain but
  lost c-Abl binding/activation and forms an alternative WAVE2 complex that dampens WAVE2 plasma-membrane translocation
  and lamellipodial protrusion. Plant ABIL proteins (SF10/SF11/SF32/SF47/SF54/SF61/SF62 and plant leaves of
  SF0) and Dictyostelium abiA lack the metazoan C-terminal SH3 domain and c-Abl signaling axis.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: 'All characterised members share the core N-terminal SCAR/WAVE-binding helical bundle and
  act as structural and signaling adaptors (GO:0035591) within the SCAR/WAVE regulatory complex (GO:0031209).
  Functional divergence partitions C-terminal effector coupling along subfamily and kingdom lines: (1) canonical
  metazoan ABI1 (SF2/SF40), ABI2 (SF26/SF57), and invertebrate metazoan ABI (SF0) bind and promote c-Abl/Arg
  tyrosine kinase phosphorylation of WAVE2 and ENAH/Mena (GO:0061098, GO:0030296); (2) vertebrate ABI3/NESH
  (SF7/SF58/SF60) lacks the c-Abl-interacting central linker/PNDY motif, does not activate c-Abl, and instead
  negatively regulates WAVE2 plasma-membrane localization (GO:1903077) and lamellipodium assembly (GO:0010593);
  and (3) plant ABIL subfamilies and Dictyostelium abiA lack the metazoan C-terminal SH3 domain altogether.'
