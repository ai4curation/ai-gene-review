  diverged_from_family: true
  divergence_description: Unlike ABI1 and ABI2, ABI3/NESH does not bind c-Abl or promote c-Abl-mediated phosphorylation
    of WAVE2 or ENAH/Mena, because it lacks the central PNDY phosphotyrosine and linker region upstream of
    the SH3 domain. Instead, competitive assembly of an ABI3-based WAVE2 complex reduces WAVE2 translocation
    to the plasma membrane and suppresses peripheral lamellipodia formation and cell motility.
  supported_by:
  - reference_id: PMID:17101133
