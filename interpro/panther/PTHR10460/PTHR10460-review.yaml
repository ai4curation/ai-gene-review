- subfamily_id: PANTHER:PTHR10460:SF0
  label: ABELSON INTERACTING PROTEIN, ISOFORM D
  description: Ancestral/basal subfamily grouping single-copy invertebrate metazoan ABI orthologs (Drosophila
    Abi, C. elegans abi-1) together with amoebozoan Dictyostelium abiA and Arabidopsis ABIL1. Metazoan SF0
    members possess the full domain architecture (N-terminal WAB/SNARE/HHR core, central polyproline region,
    and C-terminal SH3 domain) and couple SCAR/WVE-1 complex assembly to Abl, Ena, and MIG-10/Lamellipodin
    signaling, whereas Dictyostelium abiA and plant ABIL1 are shorter ~300-335 aa proteins retaining only the
    N-terminal SCAR/NAP1-binding core. Note that PTHR10460-entries.csv lists Dictyostelium UniProtKB:Q55FT9
    (gene abiA) under the legacy PANTHER protein name "Abl interactor homolog" within subfamily PTHR10460:SF0
    ("ABELSON INTERACTING PROTEIN, ISOFORM D"), whereas its current UniProtKB/Swiss-Prot recommended name is
    "SCAR complex subunit abi".
