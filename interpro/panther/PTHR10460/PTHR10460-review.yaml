residue_sites:
- site_id: abl_pndy_py213_s216
  label: Central PNDY phosphotyrosine-213 / Ser216 regulatory switch
  description: Conserved central PNDY..SP motif (residues 210-217 in canonical human ABI1 Q8IZP0-1) preserved
    in vertebrate ABI1 (SF2) and ABI2 (SF26) but absent from the shorter ABI3/NESH (SF7) paralog and non-metazoan
    ABIL proteins. Tyr213 is phosphorylated by c-Abl/BCR-ABL to create a high-affinity docking site for the
    c-Abl SH2 domain and the C-terminal SH2 domain of PI3K p85, whereas mitotic CDK1 phosphorylation at Ser216
    attenuates F-actin assembly and PTEN dephosphorylation of Tyr213/Ser216 triggers calpain-mediated ABI1
    turnover.
  anchor:
    id: UniProtKB:Q8IZP0
    label: Abl interactor 1
    gene_symbol: ABI1
    organism: Homo sapiens
