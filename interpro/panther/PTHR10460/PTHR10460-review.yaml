notes: Harmonized across all 11 reviewed PTHR10460 genes in the repository (human ABI1/ABI2/ABI3, mouse Abi1/Abi2/Abi3,
  rat Abi1, zebrafish abi1a/abi1b, Drosophila Abi, and C. elegans abi-1). Note that Arabidopsis thaliana ABI1
  (ABA INSENSITIVE 1, P49597) is an unrelated clade A PP2C phosphatase in abscisic acid signaling; true Arabidopsis
  PTHR10460 orthologs are named ABIL1-ABIL4 (Q8S8M5, Q9M3A3, Q6NMC6, Q9FHY1; PMID:15659634). Also note that
  PTHR10460-entries.csv lists Dictyostelium discoideum UniProtKB:Q55FT9 (abiA) under the PANTHER entry name
  "Abl interactor homolog" within subfamily PTHR10460:SF0 ("ABELSON INTERACTING PROTEIN, ISOFORM D"), whereas
  its current UniProtKB/Swiss-Prot entry name is "SCAR complex subunit abi".
