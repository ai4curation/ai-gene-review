  - reference_id: PMID:18328268
    supporting_text: The mechanism, which is pertinent to the nonmyristoylated c-Abl kinase, involves high
      affinity concurrent binding of the phosphotyrosine pY213 to the Abl SH2 domain and binding of a proximal
      PXXP motif to the Abl SH3 domain.
  - reference_id: PMID:19798448
    supporting_text: To this end, we utilized the SH3 domain of TOCA-1 to search for novel interactors,
      employing phage display libraries of human polypeptides [47]. We found ABI-1 among the most represented
      interactors (not shown). We validated this interaction by showing that endogenous and ectopically
      expressed TOCA-1 and ABI-1 coimmunoprecipitated (Figure 7A and 7B), and interacted in in vitro binding
      experiments using immobilized SH3 domain of TOCA-1 (Figure S7C).
  - reference_id: PMID:19798448
    supporting_text: In keeping with this notion, we found that in vitro translated C. elegans ABI-1 readily
      interacted with the SH3 domain of CeTOCA-2 (Figure 7C), indicating that this interaction is conserved
      in the nematode.
