      to the plasma membrane was significantly reduced and the formation of peripheral lamellipodial structures
      was disturbed, suggesting that the NESH/Abi-3-based WAVE2 complex was unable to help produce lamellipodial
      protrusions.
  - reference_id: PMID:26428302
    supporting_text: Structural studies showed that a linker region between the proline-rich regions and the
      Src homology 3 (SH3) domain of Abi-1 is crucial for its interaction with c-Abl and c-Abl-mediated phosphorylation
