- site_id: cterm_sh3_aromatic_cage
  label: Metazoan C-terminal SH3 peptide-binding aromatic cage (Tyr455)
  description: Conserved RT-loop tyrosine (Tyr455 in VAIYDYTKDK of human ABI1 Q8IZP0-1, within the C-terminal
    SH3 domain spanning residues 446-505) that lines the hydrophobic PxxP peptide-recognition groove across
    metazoan ABI orthologs and paralogs (Drosophila Abi, C. elegans abi-1, vertebrate ABI1, ABI2, and ABI3).
    In metazoan ABI1, ABI2, Drosophila Abi, and C. elegans abi-1 (the seven positive_controls below), this
    SH3 groove contributes to GO:0019901 binding to the proline-rich C-terminal tail of Abl family non-receptor
    tyrosine kinases alongside proline-rich cytoskeletal effectors (SOS1/2, ENAH/N-WASP, ProSAP2/SHANK3,
    and C. elegans MIG-10). Vertebrate ABI3/Abi3 paralogs (human Q9P2A4 Tyr317 in KVVTLYPYTS and mouse
    Q8BYZ1 Tyr318 in KVVTLYPYTR) structurally conserve this RT-loop aromatic tyrosine for non-kinase proline-rich
    partners while lacking GO:0019901 c-Abl kinase binding (PMID:17101133), and are therefore omitted from
    positive_controls. Absent from Dictyostelium abiA (Q55FT9) and Arabidopsis ABIL1-4 (Q8S8M5, Q9M3A3,
    Q6NMC6, Q9FHY1), which terminate upstream of the SH3 fold; these five SH3-less members are listed in
    negative_controls without control_position or control_residue because the entire domain is absent and
    no homologous residue position exists.
