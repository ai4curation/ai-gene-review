  anchor_sequence_version: 4
  site_source: LITERATURE
  residues:
  - position: 213
    expected:
    - Y
    role: c-Abl SH2 and PI3K p85 C-SH2 docking phosphotyrosine (dephosphorylated by PTEN)
  - position: 216
    expected:
    - S
    role: Proline-directed CDK1 mitotic phosphorylation site and PTEN substrate
  motif:
    pattern_regex: PNDY..SP
    start: 210
    end: 217
    role: Coupled phosphotyrosine / proline-directed phosphoserine switch conserved across ABI1 and ABI2
  required_for:
  - term:
      id: GO:0061098
      label: positive regulation of protein tyrosine kinase activity
    strength: CONTRIBUTES
    rationale: Concurrent engagement of ABI1/ABI2 phosphotyrosine-213 by the c-Abl SH2 domain together with
      proximal PxxP/linker and C-terminal SH3 contacts regulates c-Abl catalytic activity and substrate phosphorylation
      (WAVE2 Tyr150, ENAH Tyr296); ABI3 lacks this central PNDY/linker module and cannot promote c-Abl-mediated
      phosphorylation.
    supported_by:
    - reference_id: PMID:18328268
      supporting_text: The mechanism, which is pertinent to the nonmyristoylated c-Abl kinase, involves high
        affinity concurrent binding of the phosphotyrosine pY213 to the Abl SH2 domain and binding of a proximal
        PXXP motif to the Abl SH3 domain.
    - reference_id: PMID:17101133
      supporting_text: Although Abi-2, like Abi-1, promoted the c-Abl-mediated phosphorylation of Mena and
        WAVE2, NESH (Abi-3) had no such effect.
    - reference_id: PMID:26428302
      supporting_text: Structural studies showed that a linker region between the proline-rich regions and
        the Src homology 3 (SH3) domain of Abi-1 is crucial for its interaction with c-Abl and c-Abl-mediated
        phosphorylation of WAVE2.
    - reference_id: PMID:32673396
      supporting_text: We demonstrate that PTEN dephosphorylation of Abi1 at Y213 and S216 results in Abi1
        degradation through the calpain pathway. This leads to down-regulation of the WRC and reorganization
        of the actin cytoskeleton.
