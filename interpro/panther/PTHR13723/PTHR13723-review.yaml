family_id: PANTHER:PTHR13723
family_name: ADAMTS  A DISINTEGRIN AND METALLOPROTEASE WITH THROMBOSPONDIN MOTIFS  PROTEASE
preferred_name: ADAMTS metalloproteases and papilins
summary: >-
  PTHR13723 contains the secreted ADAMTS metalloproteases and the papilins. ADAMTS enzymes cleave extracellular
  matrix substrates such as procollagens and proteoglycans. Papilins carry the ADAMTS-like ancillary domains
  without a protease domain; they are extracellular matrix glycoproteins of basement membranes that inhibit
  procollagen N-proteinase.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Metalloprotease activity belongs to the ADAMTS branches; the papilin clade has lost it but remains an
  extracellular matrix component.
