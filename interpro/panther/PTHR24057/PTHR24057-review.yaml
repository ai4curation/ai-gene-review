- assessed_term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    This is the ancestral activity, placed by PAINT at the eukaryotic root. It is shown
    experimentally in vertebrate, fungal, plant and amoebozoan members, and the catalytic Lys/Asp
    pair is intact in every member examined. It is the core MF for every gene review in the
    family. Priming-dependent phosphorylation is a widespread, ancestral property within this
    activity. GO has no separate term for it, so it should be described in gene-review text
    rather than invented as a term.
  supported_by:
