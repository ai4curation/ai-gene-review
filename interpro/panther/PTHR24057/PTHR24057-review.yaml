residue_sites:
- site_id: catalytic_lys_asp
  label: Catalytic Lys (beta3) and catalytic-loop Asp
  description: >-
    The ATP-binding lysine (GSK3B K85) and the catalytic-loop proton-acceptor aspartate (GSK3B
    D181), from the UniProt GSK3B feature table. These are the canonical eukaryotic protein
    kinase catalytic residues. Pairwise local alignment (BLOSUM62) of UniProt canonical
    sequences to GSK3B shows both conserved in GSK3A (K148/D244), GskA (K85/D179), Mck1
    (K68/D164), Rim11 (K68/D164), Mrk1 (K193/D289), Ygk3 (K74/D173), BIN2/ASK7 (K69/D165), shaggy
    (K83/D179), C. elegans GSK-3 (K65/D161) and S. pombe Gsk3 (K61/D157). No negative control is
    known in the family, so the strength is CONTRIBUTES rather than REQUIRED. GskA K85R abolishes
    function in vivo.
  anchor:
    id: UniProtKB:P49841
    label: Glycogen synthase kinase-3 beta
    gene_symbol: GSK3B
    organism: Homo sapiens
  anchor_sequence_version: 2
  site_source: UNIPROT_FEATURE
  residues:
  - position: 85
    expected: [K]
    role: ATP binding (beta3 lysine)
  - position: 181
    expected: [D]
    role: proton acceptor (catalytic loop)
  required_for:
  - term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    strength: CONTRIBUTES
    rationale: >-
      Phosphotransfer in protein kinases needs the beta3 lysine to position the ATP alpha/beta
      phosphates and the catalytic-loop aspartate to act as the base that deprotonates the
      substrate hydroxyl. Losing either inactivates the enzyme. The Dictyostelium K85R mutant
      fails to complement the null.
    supported_by:
    - reference_id: PMID:20534815
      supporting_text: no phenotypic rescue was seen after expression of a mutant gene that lacks
        kinase activity (GskAK85R), indicating a requirement for kinase activity to mediate GskA function
