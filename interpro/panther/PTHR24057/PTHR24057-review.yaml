notes: >-
  Tree topology, subfamily-to-node mapping and leaf membership come from the PANTHER 19 treeinfo
  service for PTHR24057, queried both filtered to model organisms and unfiltered. The unfiltered
  tree is needed to see PTN001173193 (Metazoa-Choanoflagellida, with its Monosiga branch
  PTN008603402) and the SF nodes of the plant radiation. Seed ids were resolved through UniProt
  cross-references (SGD S000004747 = RIM11, S000005251 = MCK1; PomBase SPAC1687.15 = gsk3,
  SPBC8D2.01 = gsk31; AT4G18710 = BIN2/ASK7, AT1G06390 = ASK9/BIL2, AT2G30980 = ASK6,
  AT3G05840 = ASK3, AT4G00720 = ASK8). The paint.tsv slice also contains rows for
  PTN000622075, PTN000623091 and PTN000756102 (seeded by MAPKs, CDKs and other CMGC kinases).
  These are CMGC-level nodes outside the PTHR24057 tree. They are shared with PTHR24055 and
  PTHR24056 and are not adjudicated here; the IRD NOT GO:0004674 at PTN000756102 does not lie
  above the GSK-3 root. PANTHER's family name (GLYCOGEN SYNTHASE KINASE-3 ALPHA) is taken from
  one vertebrate paralog. Glycogen synthase phosphorylation is the historical namesake activity,
  but it is a vertebrate-characterised substrate relationship and no PAINT term encodes it.
  Only two family members have gene reviews in this repo: human GSK3B (SF8) and Dictyostelium
  gskA (SF0). Both agree with the scopes here. GSK3B accepts the Wnt, destruction-complex, tau
  and insulin terms; gskA accepts Ser/Thr kinase activity, marks tau-protein kinase activity as
  over-annotated and carries no Wnt terms. Residue positions in controls and descriptions come
  from pairwise local alignment (Biopython PairwiseAligner, BLOSUM62, gap open -10, extend -0.5)
  of UniProt canonical sequences against GSK3B (P49841 sequence version 2). The Ygk3
  phosphate-pocket substitutions (R96L, R180G, K205Q equivalents) are an alignment observation
  that predicts loss of priming-dependent substrate recognition. It has not been tested
  experimentally, so Ygk3 is not used as a negative control.
