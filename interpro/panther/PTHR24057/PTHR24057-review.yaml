  assessment: TOO_DEEP
  assessment_reason: >-
    PTN001173193 is the Metazoa + Choanoflagellida node. Its children are the eumetazoan GSK-3
    node PTN001173194, which holds all the seeds, and a Monosiga brevicollis branch
    (PTN008603402, two SF0 leaves). Wnt pathway components are absent from choanoflagellate
    genomes, so the Monosiga kinases inherit negative regulation of a pathway their organism does
    not have. The term should sit on PTN001173194 (Eumetazoa). No subfamily is named as affected
    because the Monosiga leaves share SF0 with the valid seeds sgg and C. elegans gsk-3. The same
    node also carries cytosol, positive regulation of proteasomal ubiquitin-dependent protein
    catabolism and regulation of microtubule cytoskeleton organization. Those terms are not
    Wnt-specific: the priming-dependent phospho-degron mechanism also operates in yeast. They are
    not disputed here.
