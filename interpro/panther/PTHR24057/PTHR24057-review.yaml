  assessment: UNRESOLVED
  assessment_reason: >-
    The seeds do regulate differentiation in their own lineages: animal development, yeast
    meiosis/sporulation through Rim11 and Mck1, plant brassinosteroid-dependent development,
    and Dictyostelium spore/stalk fate. In every case, though, the kinase regulates a
    lineage-specific fate decision by phosphorylating transcriptional regulators; it does not
    perform differentiation. The Dictyostelium gene review modified this IBA to specific
    regulatory sorocarp terms. Node placement is defensible, but the term is a poor fit for a
    signalling kinase, and the review leaves it to gene-level curation.
  supported_by:
