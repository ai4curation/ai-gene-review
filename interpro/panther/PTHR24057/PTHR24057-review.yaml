family_id: PANTHER:PTHR24057
family_name: GLYCOGEN SYNTHASE KINASE-3 ALPHA
preferred_name: Glycogen synthase kinase-3 (GSK-3) / shaggy family of CMGC protein kinases
summary: >-
  The GSK-3 family is the CMGC-group serine/threonine protein kinase lineage that is present
  in essentially all eukaryotes. It includes the vertebrate paralogs GSK3A and GSK3B, Drosophila
  shaggy (sgg), C. elegans GSK-3, the four Saccharomyces cerevisiae homologs (Mck1, Rim11,
  Mrk1, Ygk3), fission yeast Gsk3 and Gsk31, Dictyostelium GskA, trypanosome GSK3 and the
  expanded plant shaggy-like kinases (Arabidopsis ASK/AtSK1-10, including BIN2, and rice
  GSK1-4). The shared, ancestral activity is protein serine/threonine phosphorylation.
  A characteristic and widely conserved property is a preference for substrates already
  phosphorylated ("primed") four residues C-terminal to the target site (S/T-x-x-x-pS/pT).
  A phosphate-binding pocket built around Arg96 in GSK3B recognises the primed site. This
  priming dependence is documented in vertebrates (beta-catenin, tau) and in budding yeast
  (Mck1 on Eco1 and Rcn1). The family kinases often feed phospho-degrons to SCF ubiquitin
  ligases, and they are typically restrained by upstream signals rather than switched on.
  The pathways they serve are lineage specific. In animals GSK-3 is a core component of the
  beta-catenin destruction complex in canonical Wnt signalling, is inhibited downstream of
  insulin/Akt, phosphorylates glycogen synthase and, in vertebrates, tau. In flowering
  plants, BIN2 and its clade-II paralogs are the negative regulators of brassinosteroid
  signalling that phosphorylate BZR1/BES1 and YODA. In fungi the four yeast paralogs have
  split meiosis, stress, cell-cycle and protein-turnover roles. Dictyostelium GskA is a
  cAMP-receptor-regulated kinase controlling spore versus stalk fate and chemotaxis.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The molecular function, protein serine/threonine kinase activity, is shared across the family.
  Every reviewed member keeps the catalytic Lys (GSK3B K85) and the catalytic-loop Asp (GSK3B
  D181): GskA, Mck1, Rim11, Mrk1, Ygk3, BIN2, shaggy, C. elegans GSK-3 and S. pombe Gsk3. Kinase
  activity is shown experimentally in vertebrates, yeast, plants and Dictyostelium.
  Heterogeneity lies in the processes and complexes. (1) Canonical Wnt signalling, the
  beta-catenin destruction complex and beta-catenin binding are metazoan-only, because the Wnt
  pathway is absent from non-metazoan genomes. They must not descend to fungal, amoebozoan,
  kinetoplastid or plant members. (2) Tau-protein kinase activity, insulin-receptor signalling,
  neuronal and synaptic terms are vertebrate (or deuterostome) PAINT placements. (3)
  Brassinosteroid signalling is restricted to the flowering-plant clade-II ASK/GSK subfamilies.
  (4) Paralogs within one organism are not interchangeable. In budding yeast only Mck1 among the
  four GSK-3 homologs targets Eco1. Ygk3 (placed in SF4 by UniProt, in PTHR24056 by PANTHER 19's
  own classification) has substitutions at all three
  phosphate-pocket positions (GSK3B R96, R180, K205 align to L, G, Q). The ancestral
  priming-dependent mode may therefore be lost in that paralog. This is an alignment
  observation, not a tested one.
