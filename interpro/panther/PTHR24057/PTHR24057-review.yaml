- site_id: priming_phosphate_pocket
  label: Primed-substrate phosphate-binding Arg
  description: >-
    GSK3B Arg96 forms part of the basic pocket (with R180 and K205) that binds the priming
    phosphate of S/T-x-x-x-pS/pT substrates. R96A abolishes phosphorylation of primed substrates
    but not of unprimed ones. By alignment, R96 is conserved in GSK3A (R159), GskA (R96), Mck1
    (R79), Rim11 (R79), Mrk1 (R204), BIN2 (R80), shaggy (R94), C. elegans GSK-3 (R76) and S.
    pombe Gsk3 (R72). It is substituted in S. cerevisiae Ygk3 (L85), which also carries G and Q
    at the R180 and K205 positions.
  anchor:
    id: UniProtKB:P49841
    label: Glycogen synthase kinase-3 beta
    gene_symbol: GSK3B
    organism: Homo sapiens
  anchor_sequence_version: 2
  site_source: LITERATURE
  residues:
  - position: 96
    expected: [R]
    role: binds priming phosphate of primed substrates
  required_for:
  - term:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    strength: ASSOCIATED
    rationale: >-
      R96 is needed for the priming-dependent mode of substrate recognition, not for catalysis.
      Its loss narrows the substrate range to unprimed sites and does not abolish kinase activity,
      so it cannot be used to deny the kinase term.
    supported_by:
