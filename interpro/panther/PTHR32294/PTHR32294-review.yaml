  assessment: SOUND
  assessment_reason: 'The node is the root of PTHR32294 (PANTHER 19 treeinfo service reports PTN000793159
    as the ROOT node, a duplication node with taxonomic range Eubacteria), so the assertion reaches every
    member of the family. That is the right depth for this term: the only seed is E. coli DnaE, but templated
    DNA synthesis is the shared chemistry of the whole type-C fold, and each subfamily''s representatives
    have it independently. SF4 is a process-level divergence, not a catalytic one: its catalytic residues
    are retained and functionally required, as the active-site substitution experiment in M. tuberculosis
    shows. No member is known to have lost polymerase activity, so there is no clade for which the inherited
    term fails.'
