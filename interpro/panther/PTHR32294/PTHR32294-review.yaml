- subfamily_id: PANTHER:PTHR32294:SF4
  label: ERROR-PRONE DNA POLYMERASE
  description: >-
    DnaE2 proteins supply the catalytic DNA-synthesis step of the ImuA-type accessory/ImuB/DnaE2 cassette.
    M. smegmatis catalytic-site substitution reproduces the deletion phenotype; M. tuberculosis and Caulobacter
    genetics independently support damage-induced synthesis. Assay organism is retained rather than assigning
    every experiment to the reference protein.
  representative_members:
  - id: UniProtKB:P9WNT5
    label: Error-prone DNA polymerase
    gene_symbol: dnaE2
    organism: Mycobacterium tuberculosis H37Rv
    gene_review: genes/MYCTU/dnaE2/dnaE2-ai-review.yaml
  - id: UniProtKB:Q9A3J3
    label: Error-prone DNA polymerase
    gene_symbol: dnaE2
    organism: Caulobacter vibrioides CB15
    gene_review: genes/CAUVC/dnaE2/dnaE2-ai-review.yaml
  - id: UniProtKB:Q88I82
    label: Error-prone DNA polymerase
    gene_symbol: dnaE2
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/dnaE2/dnaE2-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    DnaE2 differs from the bulk chromosome replicases while still participating in DNA replication through
    translesion synthesis. Error-proneness does not itself prove absence of proofreading: target-specific
    PHP residues and biochemical evidence determine that activity. PMID41728957 finds variable PHP inactivation
    across C-family groups, with exceptions even in DnaE2. Neither a universal GO0006260 exclusion nor
    a universal exonuclease denial is justified by SF4 membership.
  supported_by:
  - reference_id: file:interpro/panther/PTHR32294/PTHR32294-entries.csv
    supporting_text: P9WNT5,Error-prone DNA polymerase,protein
  - reference_id: PMID:20615954
    supporting_text: Point mutations in the DnaE2 active site eliminated induced mutagenesis and
      damage tolerance, reproducing the dnaE2 deletion phenotype.
  - reference_id: PMID:20615954
    supporting_text: The corresponding domain of Mtb DnaE1 retains all amino acids associated with
      exonuclease activity ( 34 – 36 ), whereas key residues are absent in DnaE2.
- subfamily_id: PANTHER:PTHR32294:SF5
  label: DNA POLYMERASE III POLC-TYPE
  description: PolC-type replicative polymerases of Firmicutes, which combine the polymerase domain
