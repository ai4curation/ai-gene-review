family_id: PANTHER:PTHR32294
family_name: DNA POLYMERASE III SUBUNIT ALPHA
preferred_name: Type-C (DnaE/PolC) DNA polymerase alpha subunits, replicative and error-prone
summary: >-
  The bacterial C-family DNA polymerases: the catalytic alpha subunits of DNA
  polymerase III and their damage-inducible paralogs. All members share the
  polymerase, PHP, OB-fold and finger domains of the type-C fold and all are
  DNA-directed DNA polymerases, so catalysis is the family-wide property. The
  biological role splits cleanly by subfamily. SF0 holds the essential
  replicative alpha subunits (E. coli DnaE and its orthologs) and SF5 the
  PolC-type replicases of Firmicutes, which carry their own proofreading
  exonuclease domain. SF4 holds the DnaE2 proteins: second, non-essential copies
  that are SOS-regulated, dispensable for chromosome replication, and act as the
  catalytic component of the ImuA-ImuB-DnaE2 damage-induced mutagenesis
  cassette. DnaE2 proteins lack the C-terminal clamp-loader-binding region of
  the replicative alpha subunit and have lost the PHP-domain residues associated
  with exonuclease activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  DNA-directed DNA polymerase activity holds for every member, and that is what
  the family's single PAINT node asserts. Process and fidelity do not transfer
  across the subfamily boundary: replicative synthesis and the associated
  proofreading belong to SF0 and SF5, whereas SF4 performs inducible,
  damage-tolerant synthesis and is not part of chromosome replication.
reference_protein:
  id: UniProtKB:P9WNT5
  label: Error-prone DNA polymerase
  gene_symbol: dnaE2
  organism: Mycobacterium tuberculosis H37Rv
  gene_review: genes/MYCTU/dnaE2/dnaE2-ai-review.yaml
subfamilies:
  - subfamily_id: PANTHER:PTHR32294:SF0
    label: DNA POLYMERASE III SUBUNIT ALPHA
    description: >-
      Essential replicative alpha subunits of DNA polymerase III, including
      E. coli DnaE. These carry the C-terminal region that binds the clamp-loader
      subunit tau, which couples leading- and lagging-strand synthesis, and they
      partner the dnaQ-encoded proofreading exonuclease.
    representative_members:
      - id: UniProtKB:P10443
        label: DNA polymerase III subunit alpha
        gene_symbol: dnaE
        organism: Escherichia coli K-12
      - id: UniProtKB:Q88MG5
        label: DNA polymerase III subunit alpha
        gene_symbol: dnaEA
        organism: Pseudomonas putida KT2440
        gene_review: genes/PSEPK/dnaEA/dnaEA-ai-review.yaml
    diverged_from_family: false
    supported_by:
      - reference_id: file:interpro/panther/PTHR32294/PTHR32294-entries.csv
        supporting_text: P10443,DNA polymerase III subunit alpha,protein
      - reference_id: PMID:20615954
        supporting_text: >-
          All major DNA polymerase IIIα structural/functional domains ( 23 , 24 )
          are readily identified in DnaE2, except for the very C-terminal region
          which in E. coli has been implicated in the interaction of α with the
          clamp-loader subunit, τ ( 28 , 29 ).
  - subfamily_id: PANTHER:PTHR32294:SF4
    label: ERROR-PRONE DNA POLYMERASE
    description: >-
      DnaE2 proteins: damage-inducible, non-essential type-C polymerases that
      supply the catalytic step of the ImuA-ImuB-DnaE2 mutagenesis cassette.
      Substituting the catalytic residues reproduces the deletion phenotype, so
      these proteins perform the synthesis past lesions themselves rather than
      only scaffolding it.
    representative_members:
      - id: UniProtKB:P9WNT5
        label: Error-prone DNA polymerase
        gene_symbol: dnaE2
        organism: Mycobacterium tuberculosis H37Rv
        gene_review: genes/MYCTU/dnaE2/dnaE2-ai-review.yaml
      - id: UniProtKB:Q9A3J3
        label: Error-prone DNA polymerase
        gene_symbol: dnaE2
        organism: Caulobacter vibrioides CB15
        gene_review: genes/CAUVC/dnaE2/dnaE2-ai-review.yaml
      - id: UniProtKB:Q88I82
        label: Error-prone DNA polymerase
        gene_symbol: dnaE2
        organism: Pseudomonas putida KT2440
        gene_review: genes/PSEPK/dnaE2/dnaE2-ai-review.yaml
    diverged_from_family: true
    divergence_description: >-
      Retains the polymerase chemistry but not the replicative role: these
      proteins are dispensable for growth, induced by DNA damage under
      LexA control, and lack the C-terminal clamp-loader-binding region. They
      have also lost the PHP-domain residues associated with 3'-5' exonuclease
      activity that the replicative DnaE1 retains, so proofreading must not be
      transferred to them. Replication process terms (GO:0006260) and
      proofreading activity (GO:0008408) are over-annotations on this subfamily;
      all three member reviews flag them.
    supported_by:
      - reference_id: file:interpro/panther/PTHR32294/PTHR32294-entries.csv
        supporting_text: P9WNT5,Error-prone DNA polymerase,protein
      - reference_id: PMID:20615954
        supporting_text: >-
          Point mutations in the DnaE2 active site eliminated induced mutagenesis
          and damage tolerance, reproducing the dnaE2 deletion phenotype.
      - reference_id: PMID:20615954
        supporting_text: >-
          The corresponding domain of Mtb DnaE1 retains all amino acids
          associated with exonuclease activity ( 34 – 36 ), whereas key residues
          are absent in DnaE2.
  - subfamily_id: PANTHER:PTHR32294:SF5
    label: DNA POLYMERASE III POLC-TYPE
    description: >-
      PolC-type replicative polymerases of Firmicutes, which combine the
      polymerase domain with an intrinsic 3'-5' proofreading exonuclease domain
      rather than relying on a separate DnaQ subunit.
    representative_members:
      - id: UniProtKB:A0AIC1
        label: DNA polymerase III PolC-type
        gene_symbol: polC
        organism: Listeria welshimeri serovar 6b
    diverged_from_family: false
    supported_by:
      - reference_id: file:interpro/panther/PTHR32294/PTHR32294-entries.csv
        supporting_text: A0AIC1,DNA polymerase III PolC-type,protein
node_assessments:
  - node_id: PANTHER:PTN000793159
    asserted_term:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    evidence: IBD
    negated: false
    paint_snapshot: '20241008'
    node_taxon:
      id: NCBITaxon:2
      label: Bacteria
    seeds:
      - id: UniProtKB:P10443
    assessment: SOUND
    assessment_reason: >-
      The node is the root of PTHR32294 (PANTHER 19 treeinfo service reports
      PTN000793159 as the ROOT node, a duplication node with taxonomic range
      Eubacteria), so the assertion reaches every member of the family. That is
      the right depth for this term: the only seed is E. coli DnaE, but
      templated DNA synthesis is the shared chemistry of the whole type-C fold,
      and each subfamily's representatives have it independently. SF4 is a
      process-level divergence, not a catalytic one: its catalytic residues are
      retained and functionally required, as the active-site substitution
      experiment in M. tuberculosis shows. No member is known to have lost
      polymerase activity, so there is no clade for which the inherited term
      fails.
    affected_subfamilies:
      - id: PANTHER:PTHR32294:SF4
        label: ERROR-PRONE DNA POLYMERASE
    supported_by:
      - reference_id: file:interpro/panther/PTHR32294/PTHR32294-paint.tsv
        supporting_text: "PTHR32294\tPTN000793159\tGO:0003887\tF\tIBD\tfalse\tUniProtKB:P10443"
      - reference_id: PMID:20615954
        supporting_text: >-
          In contrast, replacement of DnaE2 catalytic residues reproduces the
          dnaE2 gene deletion phenotype, strongly implying a direct role for the
          α-subunit in mutagenic lesion bypass.
term_assessments:
  - assessed_term:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    scope: FAMILY_WIDE
    scope_reason: >-
      Templated nucleotidyl transfer is the defining chemistry of the type-C
      fold and is asserted for every subfamily, including the error-prone SF4,
      whose catalytic residues are retained and functionally required. The
      bacterial_imuabc_damage_induced_mutagenesis module asserts this activity
      for its DnaE2 annoton on that basis.
    supported_by:
      - reference_id: PMID:20615954
        supporting_text: >-
          Point mutations in the DnaE2 active site eliminated induced mutagenesis
          and damage tolerance, reproducing the dnaE2 deletion phenotype.
  - assessed_term:
      id: GO:0008408
      label: 3'-5' exonuclease activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Proofreading is intrinsic to the PolC-type replicases of SF5, which carry
      their own exonuclease domain, and is supplied in trans by DnaQ for the SF0
      replicative alpha subunits. It must not be transferred to SF4: published
      comparison of the PHP domains shows that the replicative DnaE1 retains
      every residue associated with exonuclease activity while they are absent in
      DnaE2. InterPro2GO nonetheless maps this term onto DnaE2 proteins from the
      shared IPR004805 and IPR011708 signatures, which is why all three DnaE2
      reviews flag it as an over-annotation.
    applicable_subfamilies:
      - id: PANTHER:PTHR32294:SF5
        label: DNA POLYMERASE III POLC-TYPE
      - id: PANTHER:PTHR32294:SF0
        label: DNA POLYMERASE III SUBUNIT ALPHA
    supported_by:
      - reference_id: PMID:20615954
        supporting_text: >-
          The corresponding domain of Mtb DnaE1 retains all amino acids
          associated with exonuclease activity ( 34 – 36 ), whereas key residues
          are absent in DnaE2.
  - assessed_term:
      id: GO:0006260
      label: DNA replication
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Chromosome replication is the role of the SF0 and SF5 replicases. DnaE2
      proteins are dispensable for replication and are induced only on DNA
      damage, and they lack the C-terminal region through which the replicative
      alpha subunit engages the clamp loader, which is thought to be why they
      cannot substitute for replicative synthesis. The InterPro mapping from the
      shared alpha-subunit domains nevertheless gives every DnaE2 this term.
    applicable_subfamilies:
      - id: PANTHER:PTHR32294:SF0
        label: DNA POLYMERASE III SUBUNIT ALPHA
      - id: PANTHER:PTHR32294:SF5
        label: DNA POLYMERASE III POLC-TYPE
    supported_by:
      - reference_id: file:genes/MYCTU/dnaE2/dnaE2-uniprot.txt
        supporting_text: 'CC       polymerase. Does not appear to be essential for chromosomal'
      - reference_id: PMID:20615954
        supporting_text: >-
          All major DNA polymerase IIIα structural/functional domains ( 23 , 24 )
          are readily identified in DnaE2, except for the very C-terminal region
          which in E. coli has been implicated in the interaction of α with the
          clamp-loader subunit, τ ( 28 , 29 ).
  - assessed_term:
      id: GO:0042276
      label: error-prone translesion synthesis
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Damage-tolerant, mutagenic synthesis is the SF4 role and must not be
      generalized to the replicases. Within SF4 it is established for the
      mycobacterial and Caulobacter members; the P. putida member is a documented
      exception, acting as an anti-mutator for stationary-phase base
      substitutions, so its review uses the parent term GO:0019985 instead.
    applicable_subfamilies:
      - id: PANTHER:PTHR32294:SF4
        label: ERROR-PRONE DNA POLYMERASE
    member_exceptions:
      - member:
          id: UniProtKB:Q88I82
          gene_symbol: dnaE2
          organism: Pseudomonas putida KT2440
        exception_reason: >-
          In P. putida, DnaE2 and ImuB have antagonistic effects on mutagenesis
          and DnaE2 suppresses stationary-phase base substitutions, so the
          mutagenic child term is not asserted; its review keeps the parent
          translesion synthesis term.
        supported_by:
          - reference_id: PMID:17331811
            supporting_text: it acted as an anti-mutator in accumulation of base substitution
    supported_by:
      - reference_id: PMID:20615954
        supporting_text: >-
          In combination with the prediction that ImuB lacks polymerase activity,
          this observation implies that DnaE2 catalyzes translesion synthesis.
