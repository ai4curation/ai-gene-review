  assessment_reason: 'The node is the root of PTHR32294 (PANTHER 19 treeinfo service reports PTN000793159
    as the ROOT node, a duplication node with taxonomic range Eubacteria), so the assertion reaches every
    member of the family. That is the right depth for this term: the only seed is E. coli DnaE, but templated
