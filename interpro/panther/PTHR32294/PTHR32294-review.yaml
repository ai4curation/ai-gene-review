term_assessments:
- assessed_term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  scope: FAMILY_WIDE
  scope_reason: Templated nucleotidyl transfer is the defining chemistry of the type-C fold and is
    asserted for every subfamily, including the error-prone SF4, whose catalytic residues are
    retained and functionally required. The bacterial_imuabc_damage_induced_mutagenesis module
    asserts this activity for its DnaE2 annoton on that basis.
  supported_by:
  - reference_id: PMID:20615954
    supporting_text: Point mutations in the DnaE2 active site eliminated induced mutagenesis and
      damage tolerance, reproducing the dnaE2 deletion phenotype.
- assessed_term:
    id: GO:0008408
    label: 3'-5' exonuclease activity
  scope: UNRESOLVED
  scope_reason: Intrinsic exonuclease activity is not a blanket SF0 property. M. tuberculosis P9WNT7
    has directly measured PHP exonuclease activity, whereas E. coli/Pseudomonas alpha
    implementations rely on separate DnaQ and Bacillus DnaE3 errors can be proofread by PolC. PolC
    provides a separate intrinsic proofreading domain. The comparative survey finds variable PHP
    inactivation across all four C-family groups. Retain experimentally supported P9WNT7 and PolC
    activity, and target-specific negative/uncertain DnaE2 judgments, without a whole-SF0 grant or
    denial. A general transfer rule remains unresolved until finer clades or a curated residue model
    have been established; a domain name is insufficient.
  supported_by:
  - reference_id: PMID:20615954
    supporting_text: The corresponding domain of Mtb DnaE1 retains all amino acids associated with
      exonuclease activity ( 34 – 36 ), whereas key residues are absent in DnaE2.
  - *id001
  - *id002
