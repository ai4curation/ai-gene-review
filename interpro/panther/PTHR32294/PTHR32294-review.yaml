notes: >-
  Written while promoting modules/bacterial_imuabc_damage_induced_mutagenesis.yaml
  to COMPLETE, which grounds its polymerase step in this family's SF4. The node
  depth for PTN000793159 was read from the PANTHER 19 treeinfo service
  (pantherdb.org/services/oai/pantherdb/treeinfo?family=PTHR32294), which reports
  it as the family ROOT with taxonomic range Eubacteria; the local
  PTHR32294-paint.tsv records the assertion itself. The family term is too broad
  to be the module's descriptor, so the module uses InterPro IPR023073
  (DNA polymerase, error-prone) for the DnaE2 role and records this review for the
  subfamily split.
