family_id: PANTHER:PTHR32294
family_name: DNA POLYMERASE III SUBUNIT ALPHA
preferred_name: Type-C (DnaE/PolC) DNA polymerase alpha subunits, replicative and error-prone
summary: 'Bacterial C-family DNA polymerases share templated DNA-synthesis chemistry but differ in replication
  role and proofreading architecture. SF0 includes replicative DnaE1 and Bacillus DnaE3: E. coli and Pseudomonas
  implementations use a separate DnaQ exonuclease, whereas M. tuberculosis DnaE1 has an experimentally
  active intrinsic PHP domain. Bacillus DnaE3 extends RNA primers before handoff to PolC and can be proofread
  by PolC. SF5 PolC contains an intrinsic DnaQ-like proofreading domain. SF4 DnaE2 proteins supply damage-tolerant
  synthesis and do not substitute for the ordinary replicative polymerase. Broad family or subfamily membership
  alone does not establish a native polymerase role or an active PHP proofreader.'
functional_coherence: MOSTLY_COHERENT
coherence_reason: DNA-directed DNA polymerase chemistry is the shared property assessed by the existing
  PAINT root judgment. Chromosome-replication role and intrinsic proofreading require finer distinctions,
  including distinctions within SF0. Being partnered with DnaQ is not intrinsic exonuclease activity of
  the alpha subunit.
