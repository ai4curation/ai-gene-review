- subfamily_id: PANTHER:PTHR32294:SF4
  label: ERROR-PRONE DNA POLYMERASE
  description: 'DnaE2 proteins: damage-inducible, non-essential type-C polymerases that supply the catalytic
    step of the ImuA-ImuB-DnaE2 mutagenesis cassette. Substituting the catalytic residues reproduces the
    deletion phenotype, so these proteins perform the synthesis past lesions themselves rather than only
    scaffolding it.'
  representative_members:
  - id: UniProtKB:P9WNT5
    label: Error-prone DNA polymerase
    gene_symbol: dnaE2
    organism: Mycobacterium tuberculosis H37Rv
    gene_review: genes/MYCTU/dnaE2/dnaE2-ai-review.yaml
  - id: UniProtKB:Q9A3J3
    label: Error-prone DNA polymerase
    gene_symbol: dnaE2
    organism: Caulobacter vibrioides CB15
    gene_review: genes/CAUVC/dnaE2/dnaE2-ai-review.yaml
  - id: UniProtKB:Q88I82
    label: Error-prone DNA polymerase
    gene_symbol: dnaE2
    organism: Pseudomonas putida KT2440
    gene_review: genes/PSEPK/dnaE2/dnaE2-ai-review.yaml
  diverged_from_family: true
  divergence_description: 'Retains the polymerase chemistry but not the replicative role: these proteins
    are dispensable for growth, induced by DNA damage under LexA control, and lack the C-terminal clamp-loader-binding
    region. They have also lost the PHP-domain residues associated with 3''-5'' exonuclease activity that
    the replicative DnaE1 retains, so proofreading must not be transferred to them. Replication process
    terms (GO:0006260) and proofreading activity (GO:0008408) are over-annotations on this subfamily;
    all three member reviews flag them.'
  supported_by:
  - reference_id: file:interpro/panther/PTHR32294/PTHR32294-entries.csv
