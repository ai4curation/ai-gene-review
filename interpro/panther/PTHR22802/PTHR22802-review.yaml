  organism: Homo sapiens
subfamilies:
  - subfamily_id: PANTHER:PTHR22802:SF470
    label: ASIALOGLYCOPROTEIN RECEPTOR 1
    description: >-
      Major subunit (H1/ASGR1) of the hepatic asialoglycoprotein receptor
      (Ashwell-Morell receptor) that binds terminal D-galactose and GalNAc via
      a Ca2+-dependent QPD motif on the sinusoidal hepatocyte surface and
      mediates rapid clathrin-dependent endocytosis via a cytosolic YQDL motif.
    representative_members:
      - id: UniProtKB:P07306
        label: Asialoglycoprotein receptor 1
        gene_symbol: ASGR1
        organism: Homo sapiens
      - id: UniProtKB:P34927
        label: Asialoglycoprotein receptor 1
        gene_symbol: Asgr1
        organism: Mus musculus
      - id: UniProtKB:P02706
        label: Asialoglycoprotein receptor 1
        gene_symbol: Asgr1
        organism: Rattus norvegicus
    diverged_from_family: false
    supported_by:
      - reference_id: file:genes/human/ASGR1/ASGR1-uniprot.txt
        supporting_text: >-
          Transmembrane protein predominantly expressed on hepatocytes that
          plays a key role in endocytosis of plasma glycoproteins that lack
          terminal sialic acid residues. Specifically recognizes terminal
          galactose and N-acetylgalactosamine residues, facilitating the
          clearance of desialylated glycoproteins from circulation.
  - subfamily_id: PANTHER:PTHR22802:SF433
    label: ASIALOGLYCOPROTEIN RECEPTOR 2
    description: >-
      Minor subunit (H2/ASGR2) of the hepatic asialoglycoprotein receptor that
      co-oligomerizes with ASGR1 via its stalk coiled-coil neck to organize
      three QPD carbohydrate-recognition domains for high-avidity multivalent
      Gal/GalNAc capture and endocytosis via its cytosolic FGPLV motif.
    representative_members:
      - id: UniProtKB:P07307
        label: Asialoglycoprotein receptor 2
        gene_symbol: ASGR2
        organism: Homo sapiens
      - id: UniProtKB:P24721
        label: Asialoglycoprotein receptor 2
        gene_symbol: Asgr2
        organism: Mus musculus
      - id: UniProtKB:P08290
        label: Asialoglycoprotein receptor 2
        gene_symbol: Asgr2
        organism: Rattus norvegicus
    diverged_from_family: false
    supported_by:
      - reference_id: file:genes/human/ASGR2/ASGR2-uniprot.txt
        supporting_text: >-
          Mediates the endocytosis of plasma glycoproteins to which the terminal
          sialic acid residue on their complex carbohydrate moieties has been
          removed. The receptor recognizes terminal galactose
  - subfamily_id: PANTHER:PTHR22802:SF197
    label: CD209 ANTIGEN
    description: >-
      Dendritic cell and macrophage mannose/fucose-specific C-type lectin
      pattern recognition receptor (DC-SIGN/CD209).
    representative_members:
      - id: UniProtKB:Q9NNX6
        label: CD209 antigen
        gene_symbol: CD209
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      CD209 (DC-SIGN) carries an EPN Ca2+-coordinating motif selective for
      high-mannose and fucosylated pathogen glycans on myeloid cells rather than
      the QPD Gal/GalNAc-selective motif of hepatic ASGR1/ASGR2.
  - subfamily_id: PANTHER:PTHR22802:SF325
    label: LOW AFFINITY IMMUNOGLOBULIN EPSILON FC RECEPTOR
    description: >-
      C-type lectin-fold B-cell and myeloid receptor (FCER2/CD23) that binds the
      Fc region of IgE.
    representative_members:
      - id: UniProtKB:P06734
        label: Low affinity immunoglobulin epsilon Fc receptor
        gene_symbol: FCER2
        organism: Homo sapiens
    diverged_from_family: true
    divergence_description: >-
      FCER2 (CD23) has repurposed the C-type lectin-like domain to bind the
      proteinaceous Ce3 domain of IgE rather than galactose/GalNAc glycans.
