family_id: PANTHER:PTHR22802
family_name: C-TYPE LECTIN SUPERFAMILY MEMBER
preferred_name: Hepatic asialoglycoprotein receptors (ASGR1/ASGR2) and myeloid C-type lectins
summary: >-
  Large metazoan family of calcium-dependent (C-type) lectin domain (CTLD)
  receptors (PANTHER:PTHR22802) in PANTHER 19.0 HMM classifications, including
  the hepatic asialoglycoprotein receptor subunits ASGR1
  (PANTHER:PTHR22802:SF470) and ASGR2 (PANTHER:PTHR22802:SF433), macrophage
  galactose-type lectin CLEC10A (PANTHER:PTHR22802:SF416), Kupffer cell
  receptor CLEC4F (PANTHER:PTHR22802:SF238), Langerin/CLEC4K
  (PANTHER:PTHR22802:SF14), DC-SIGN/CD209 (PANTHER:PTHR22802:SF197), Dectin-2/
  CLEC6A (PANTHER:PTHR22802:SF249), Mincle/CLEC4E (PANTHER:PTHR22802:SF402),
  low-affinity IgE receptor FCER2/CD23 (PANTHER:PTHR22802:SF325), and
  scavenger/collectin receptor COLEC12 (PANTHER:PTHR22802:SF394). Note that
  UniProtKB cross-references currently place several of these proteins (including
  human ASGR1 and ASGR2) under the sibling C-type lectin family
  PANTHER:PTHR22803 (MANNOSE, PHOSPHOLIPASE, LECTIN RECEPTOR RELATED).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Members of PTHR22802 share a C-type lectin-like carbohydrate recognition
  domain (IPR001304) but diverge sharply in ligand specificity and biological
  pathway: ASGR1 (PANTHER:PTHR22802:SF470) and ASGR2 (PANTHER:PTHR22802:SF433)
  carry a QPD (Gln-Pro-Asp) calcium-coordinating triad specific for terminal
  beta-D-galactose and N-acetyl-D-galactosamine (GalNAc) and function as
  constitutive clathrin-dependent endocytic clearance receptors on hepatocytes
  (GO:0004873 asialoglycoprotein receptor activity), whereas CD209, CLEC4K,
  CLEC4E, and CLEC6A carry EPN (Glu-Pro-Asn) motifs specific for
  D-mannose/L-fucose and act as myeloid innate immune pattern recognition
  receptors (GO:0038187), and FCER2 (SF325) acts as a low-affinity IgE Fc
  receptor.
