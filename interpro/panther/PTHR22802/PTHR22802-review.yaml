    scope_reason: >-
      Endocytic lectin receptors such as ASGR1 (SF470), ASGR2 (SF433), CLEC10A
      (SF416), CLEC4F (SF238), and CD209 (SF197) internalize bound glycoprotein
      ligands via clathrin-coated pits, whereas secreted C-type lectins do not
