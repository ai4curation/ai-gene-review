notes: >-
  PTHR22802-entries.csv contains only 5 non-mammalian protein rows because the
  InterPro API endpoint for PTHR22802 returns only UniProtKB entries whose DR
  PANTHER cross-reference is PTHR22802, whereas mammalian members such as
  ASGR1 (P07306, P34927, P02706), ASGR2 (P07307, P24721, P08290), CD209
  (Q9NNX6), and FCER2 (P06734) are classified under PTHR22802 subfamilies
  (SF470, SF433, SF197, SF325) in PANTHER's HMM classification (panther.obo and
  the PANTHER member index) while carrying DR PANTHER PTHR22803 in UniProtKB.
  These dual-indexed accessions are intentionally retained without an entry in
  interpro/panther/panther-members-overrides.tsv so that both PTHR22802
  (PANTHER 19.0 HMM subfamily placement) and PTHR22803 (UniProtKB DR PANTHER
  cross-reference and PAINT propagation) can be reviewed side by side.
