    supported_by:
      - reference_id: file:genes/human/ASGR1/ASGR1-uniprot.txt
        supporting_text: >-
          Upon ligand binding, the receptor-ligand complex is internalized and
          trafficked to a sorting organelle, where dissociation occurs. The
