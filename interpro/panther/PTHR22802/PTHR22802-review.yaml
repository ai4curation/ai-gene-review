residue_sites:
  - site_id: asgr1_qpd_gal_galnac_specificity_triad
    label: ASGR1 QPD (Gln240-Pro241-Asp242) and Trp244 Gal/GalNAc specificity motif
    description: >-
      Primary Ca2+-coordinating QPD triad (Gln240-Pro241-Asp242) and adjacent
      hydrophobic stacking tryptophan (Trp244) in the carbohydrate-recognition
      domain of human ASGR1 (resolved in the 2.3 A H1 CRD crystal structure
      PDB:1DV8, PubMed:10891274, and Gal/GalNAc-bound structures PDB:5JPV and
      PDB:5JQ1) that confer specificity for equatorial C3/C4 hydroxyls of
      D-galactose and N-acetyl-D-galactosamine (GalNAc) over D-mannose.
    anchor:
      id: UniProtKB:P07306
      label: Asialoglycoprotein receptor 1
      gene_symbol: ASGR1
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: STRUCTURE
    residues:
      - position: 240
        expected:
          - Q
        role: >-
          Glutamine of the QPD motif that hydrogen-bonds to the equatorial 3-OH
          and axial 4-OH of galactose/GalNAc and coordinates Ca2+ at site 2
      - position: 241
        expected:
          - P
        role: >-
          Cis-proline of the QPD triad that orients Gln240 and Asp242 at the
          primary sugar-binding Ca2+ site
      - position: 242
        expected:
          - D
        role: >-
          Aspartate of the QPD motif that coordinates the primary Ca2+ ion and
          hydrogen-bonds to the 4-OH group of galactose/GalNAc
      - position: 244
        expected:
          - W
        role: >-
          Aromatic indole ring that stacks against the apolar B-face of the
          galactopyranose/GalNAc ring
    motif:
      pattern_regex: "QPD.W"
      start: 240
      end: 244
      role: Gal/GalNAc-selective Ca2+-coordinating C-type lectin motif
    required_for:
      - term:
          id: GO:0004873
          label: asialoglycoprotein receptor activity
        strength: CONTRIBUTES
        rationale: >-
          Gln240, Asp242, and Trp244 form the primary Ca2+-dependent
