family_id: PANTHER:PTHR11441
family_name: THYMIDINE KINASE
preferred_name: Thymidine kinase 1 (TK1/Tdk) family
summary: >-
  Cytosolic type I thymidine kinases phosphorylate thymidine to dTMP in pyrimidine salvage. They
  are cell-cycle regulated in animals. The family contains bacterial Tdk, human TK1, poxvirus thymidine
  kinases and plant TK1 isozymes. S. cerevisiae and S. pombe have no member.
functional_coherence: COHERENT
coherence_reason: >-
  Almost all members are in SF0 (cytosolic thymidine kinases); plant TK1A is a separate subfamily.
subfamilies:
