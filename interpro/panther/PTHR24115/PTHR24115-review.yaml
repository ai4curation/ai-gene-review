  assessment: LOSS_CONTRADICTED
  proposed_action:
    paint_action: REMOVE_LOSS
  assessment_reason: >-
    PTN008606205 holds the fission yeast kinesin-8 proteins Klp5 and Klp6 and a Schizosaccharomyces japonicus
    relative (3 leaves). Klp5 and Klp6 belong to the microtubule-destabilising kinesins (PMID:12426374),
    and the Klp5-Klp6 heterodimer controls microtubule length by inducing catastrophe (PMID:31427431).
    The microtubule depolymerization function is retained in this clade.
