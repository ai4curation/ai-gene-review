family_id: PANTHER:PTHR24115
family_name: KINESIN-RELATED
preferred_name: Kinesin-related proteins (kinesin-8 and related kinesins)
summary: >-
  PTHR24115 is a large group of kinesin motor-domain proteins. The clade assessed here holds the fission
  yeast kinesin-8 heterodimer Klp5-Klp6, which destabilises microtubules and limits spindle length.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Kinesin motor domains are shared, but members differ in motility, microtubule destabilisation and cellular
  role.
