family_id: PANTHER:PTHR42679
family_name: S-METHYL-5'-THIOADENOSINE PHOSPHORYLASE
preferred_name: MTA phosphorylase (MtnP/MEU1/MTAP) family
summary: >-
  S-methyl-5'-thioadenosine phosphorylases cleave MTA, the by-product of polyamine synthesis, to
  adenine and 5-methylthioribose 1-phosphate, starting methionine salvage in fungi and animals (S.
  cerevisiae MEU1, S. pombe mta1, human MTAP, bacterial MtnP).
functional_coherence: COHERENT
coherence_reason: Both subfamilies are MTA phosphorylases.
