  name:
    name: Polycomb group WD repeat-containing protein
    short: PcG_WD-repeat
  description:
  - text: This family of proteins is involved in epigenetic regulation of gene expression
      through the modification of histones. Members of this family are part of the
      Polycomb group (PcG) proteins, which form multiprotein complexes that methylate
      specific lysine residues on histone H3, leading to transcriptional repression
      of target genes. These modifications can heritably alter chromatin structure
      and maintain the repressed state of genes across cell divisions. Functions of
      these proteins include roles in development, such as the maintenance of homeotic
      gene repression, regulation of seed endosperm development, and X chromosome
      inactivation. They are also implicated in the regulation of various metabolic
      processes and cellular differentiation. The WD repeat domain within these proteins
      is responsible for recognizing specific trimethylated histone peptides, contributing
      to the targeting of the PcG complexes to chromatin.
