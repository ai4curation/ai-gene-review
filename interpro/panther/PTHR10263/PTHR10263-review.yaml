family_id: PANTHER:PTHR10263
family_name: V-TYPE PROTON ATPASE PROTEOLIPID SUBUNIT
preferred_name: V-ATPase rotor-ring proteolipids (subunits c, c' and c'')
summary: >-
  Small, highly hydrophobic proteolipids that form the membrane rotor ring (c-ring) of the V0 domain of
  vacuolar H+-ATPases and of archaeal A-type ATPases. Each ring is built from 16 kDa c subunits (4 transmembrane
  helices; human ATP6V0C, yeast VMA3, C. elegans VHA-1 to VHA-3), the fungal c' subunit (VMA11) and the
  21 kDa c'' subunit (5 helices; human ATP6V0B, yeast VMA16). A conserved buried glutamate in each subunit
  carries protons across the membrane as the ring rotates.
functional_coherence: COHERENT
coherence_reason: >-
  All examined members (human ATP6V0C and ATP6V0B, C. elegans VHA-1) are proton-conducting pore subunits
  of the V0 complex; paralogs differ in helix number and position in the ring, not in function.
