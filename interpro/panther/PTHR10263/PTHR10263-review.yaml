  assessment: SOUND
  assessment_reason: >-
    Root node seeded across eukaryotes (yeast VMA3, VMA11 and VMA16; fly, mouse, rat, bovine and human
    c and c'' subunits) and an archaeal A-type ATP synthase subunit K. Every member is a multi-pass integral
    membrane proteolipid of the rotor ring, so membrane is true at the deepest node. The term is generic:
    the specific organelle membrane differs between cell types and is left to experimental annotation.
