notes: >-
  PAINT carries a single node-level annotation for this family, membrane at the root node PTN000813763;
  no molecular function or process (for example proton transmembrane transport) is propagated by PAINT,
  so those come to members from other sources. The cached member table gives no subfamily assignments
  for the reviewed members and the UniProt records cross-reference only the family, so no subfamilies
  are listed. Examined members: human ATP6V0C and ATP6V0B, C. elegans vha-1. Not examined: VHA-2/VHA-3/VHA-4,
  the yeast and fly members, and the archaeal and plant members.
