  name:
    name: Phosphotransferase System Glucose-Specific EIICBA
    short: PTS_Glucose_EIICBA
  description:
  - text: The Phosphotransferase System (PTS) Glucose-Specific EIICBA Family is involved
      in the active transport and phosphorylation of sugars across the cell membrane,
      primarily glucose, but also glucosamine, N-acetylglucosamine, and various alpha-
      and beta-glucosides. The system operates via a phosphoenolpyruvate-dependent
      mechanism, where the EIIA domain receives a phosphoryl group from phospho-HPr
      and transfers it to the EIIB domain. The EIIB domain, in turn, phosphorylates
      the sugar substrate during its translocation by the EIIC domain, which forms
      the translocation channel and contains the substrate-binding site. The phosphorylation
      of sugars is a critical step in their metabolism, and the PTS plays a significant
      role in regulating sugar uptake based on cellular needs and environmental availability.
