family_id: PANTHER:PTHR43160
family_name: ACONITATE HYDRATASE B
preferred_name: AcnB-type and mitochondrial aconitases
summary: >-
  [4Fe-4S] aconitases of the aconitase/IPM isomerase superfamily that interconvert citrate and
  isocitrate through cis-aconitate. The family holds the bacterial AcnB enzymes (Escherichia coli,
  Salmonella enterica, Pseudomonas) and the eukaryotic mitochondrial aconitases (yeast ACO1, human
  ACO2). Bacterial AcnB is the main TCA-cycle aconitase of E. coli, also hydrates
  2-methyl-cis-aconitate to 2-methylisocitrate in the 2-methylcitrate cycle of propionate catabolism,
  and as an apo-protein binds mRNA. A fungal paralog lineage (yeast ACO2) has specialised as a
  mitochondrial homocitrate dehydratase in lysine biosynthesis.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Aconitate hydratase activity and [4Fe-4S] cluster binding hold across the family. The homocitrate
  dehydratase lineage (SF2, yeast ACO2) retains only weak aconitase activity and a disputed TCA-cycle
  role, and 2-methylisocitrate dehydratase activity is documented for bacterial AcnB (SF4) rather
  than family-wide.
