- node_id: PANTHER:PTN000764659
  asserted_term:
    id: GO:0005829
    label: cytosol
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: UniProtKB:P0AAB4
  assessment: UNRESOLVED
  assessment_reason: >-
    E. coli UbiD activity is partly soluble after French-press lysis, but the
    enzyme needs phospholipid and acts on a membrane-bound substrate, and
    UniProt records it as a peripheral membrane protein. Whether the
    functional enzyme is cytosolic or membrane-associated is not settled by
    any assay we could read (a fractionation of the endogenous protein with
    membrane and cytosol markers is missing).
  supported_by:
  - reference_id: file:interpro/panther/PTHR30108/PTHR30108-paint.tsv
    supporting_text: "PTHR30108\tPTN000764659\tGO:0005829\tC\tIBD\tfalse"
  - reference_id: PMID:782527
    supporting_text: The fact that the substrate of the carboxy-lyase is membrane-bound and the enzyme is stimulated
      by phospholipid suggests that it normally functions in association with the cytoplasmic membrane in vivo.
