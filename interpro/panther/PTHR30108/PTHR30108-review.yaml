family_id: PANTHER:PTHR30108
family_name: 3-OCTAPRENYL-4-HYDROXYBENZOATE CARBOXY-LYASE-RELATED
preferred_name: UbiD-family prFMN-dependent reversible decarboxylases
summary: >-
  UbiD-family decarboxylases use the prenylated FMN cofactor made by
  UbiX/Pad1 to decarboxylate aromatic and alpha,beta-unsaturated acids. The
  family is chemically coherent but pathway-diverse. Escherichia coli UbiD
  decarboxylates 3-octaprenyl-4-hydroxybenzoate in ubiquinone biosynthesis;
  fungal Fdc1 decarboxylates cinnamic, coumaric and ferulic acids; Bacillus
  subtilis BsdC is a phenolic acid decarboxylase; Pseudomonas aeruginosa HudA
  is a pyrrole-2-carboxylate decarboxylase; and SF21 holds archaeal
  anhydromevalonate phosphate decarboxylases of the archaeal mevalonate
  pathway. Ubiquinone-pathway UbiD (E. coli, P. putida KT2440, P.
  aeruginosa) shares subfamily SF17 with Fdc1, BsdC and HudA, so no PANTHER
  subfamily isolates the ubiquinone function.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All characterized members are prFMN-dependent carboxy-lyases, but substrate
  and pathway differ between members of the same subfamily (SF17 holds UbiD,
  Fdc1, BsdC and HudA); only the generic carboxy-lyase activity is safe at
  family level.
