  (modules/bacterial_sulfoquinovose_catabolism.yaml), which grounds the YihU SLA reductase annoton at the
  family level (PANTHER:PTHR22981). UniProt places YihU in subfamily SF7 (3-HYDROXYISOBUTYRATE DEHYDROGENASE,
