family_id: PANTHER:PTHR22981
family_name: 3-HYDROXYISOBUTYRATE DEHYDROGENASE-RELATED
preferred_name: HIBADH-related beta-hydroxyacid dehydrogenases (including YihU sulfolactaldehyde reductase)
summary: >-
  NAD(P)-dependent beta-hydroxyacid dehydrogenases and aldehyde reductases with an N-terminal Rossmann
  NAD(P)-binding domain and a 6-phosphogluconate dehydrogenase-like C-terminal domain, assembling as dimers
  or tetramers. Reviewed members in the local inventory are mitochondrial and bacterial 3-hydroxyisobutyrate
  dehydrogenases (HIBADH, MmsB) of valine catabolism, the Pseudomonas NAD-dependent L-serine dehydrogenase,
  Eubacterium 2-(hydroxymethyl)glutarate dehydrogenase, and the enterobacterial YihU 3-sulfolactaldehyde
  reductases, which reduce sulfolactaldehyde to 2,3-dihydroxypropane-1-sulfonate with NADH as the terminal
  step of sulfoglycolysis and also reduce succinic semialdehyde weakly.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The NAD(P)-dependent oxidoreduction of a CH-OH group is shared, but substrate and pathway differ: HIBADH
  oxidizes 3-hydroxyisobutyrate in valine catabolism, PA0743 oxidizes L-serine, Hgd acts on 2-(hydroxymethyl)glutarate
  in nicotinate fermentation, and YihU reduces the organosulfonate sulfolactaldehyde in sulfoquinovose
  catabolism. All 20 reviewed members fall in one PANTHER subfamily (SF7), which therefore does not separate
  these activities.
