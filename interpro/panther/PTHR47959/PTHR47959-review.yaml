notes: 'Module bacterial_rna_degradation grounds its helicase variants to InterPro IPR023554 (RhlB) and
  IPR028622 (RhlE) rather than to PANTHER subfamilies: SF10 is a clean RhlB grouping, but SF13 mixes RhlE
  with unrelated eukaryotic helicases (gemin3, MRH4, DDX31). E. coli RhlE is a ribosome-assembly factor
  that replaces RhlB in the degradosome only in reconstitution; its degradosome role in Pseudomonas syringae
  is lineage-specific. Most PAINT nodes in this family are eukaryotic ribosome-biogenesis, splicing, translation
  and germline assertions; each is UNRESOLVED with its seeds named and the experiment that would test
  inheritance beyond them, because no seed of those nodes has a complete review in this corpus.'
