family_id: PANTHER:PTHR47959
family_name: ATP-DEPENDENT RNA HELICASE RHLE-RELATED
preferred_name: DEAD-box ATP-dependent RNA helicase family (RhlB/RhlE/SrmB/DbpA-related)
summary: A large DEAD-box RNA helicase family spanning bacterial helicases (RhlB, RhlE, SrmB, DbpA, DeaD/CsdA,
  CrhR) and many eukaryotic nucleolar, mitochondrial and germline DEAD-box proteins. Members share the
  Q motif and DEAD-box helicase core that couples RNA-dependent ATP hydrolysis to local duplex unwinding.
  Bacterial members act in RNA decay (RhlB on the RNase E degradosome scaffold) and ribosome assembly
  (SrmB, DbpA, DeaD, RhlE); eukaryotic members act mainly in rRNA processing and ribosome biogenesis.
functional_coherence: MOSTLY_COHERENT
coherence_reason: RNA helicase activity is conserved family-wide; biological roles, partners and compartments
  (degradosome, ribosome assembly, nucleolus, mitochondrion, germ granules) vary by subfamily, and several
  PANTHER subfamilies (e.g. SF13) mix unrelated roles.
