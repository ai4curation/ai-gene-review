family_id: PANTHER:PTHR12413
family_name: DOLICHYL GLYCOSYLTRANSFERASE
preferred_name: ALG6/ALG8 dolichyl-phosphoglucose glucosyltransferase family
summary: >-
  ER-lumenal Dol-P-Glc-dependent glucosyltransferases that add the first two glucoses to the lipid-linked
  oligosaccharide: ALG6 (SF1) adds alpha-1,3-glucose to Man9GlcNAc2-PP-Dol, and ALG8 (SF2) adds the
  second alpha-1,3-glucose (S. cerevisiae, S. pombe and human orthologs).
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Both subfamilies are Dol-P-Glc glucosyltransferases with the same linkage chemistry; the acceptor
  (Glc0 or Glc1 LLO) separates ALG6 (SF1) from ALG8 (SF2).
