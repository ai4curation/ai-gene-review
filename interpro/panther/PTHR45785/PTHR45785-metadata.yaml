  name:
    name: Complement System Regulators and Virion Entry Mediators
    short: ComplSys_Reg/VirEntry_Med
  description:
  - text: The protein family is involved in the regulation of the complement system,
      a critical component of the innate immune response. Members of the family include
      glycoproteins that inhibit complement activation on self cells by binding to
      specific markers, accelerating the decay of C3 convertase, and acting as cofactors
      for factor I to degrade C3b. Some family members also mediate cellular responses
      by interacting with receptors, aiding in pathogen phagocytosis and destruction.
      Additionally, certain proteins within the family are associated with lipid metabolism
      and may influence tissue-bound complement fragments, competing with physiological
      inhibitors. The family also includes a protein that aids in viral entry into
      host cells by participating in the dissolution of virion membranes.
