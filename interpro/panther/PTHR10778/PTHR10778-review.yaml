  activity (GO:0022857), UDP-galactose transmembrane transporter activity (GO:0005459), UDP-glucose transmembrane
  transporter activity (GO:0005460), 3'-phosphoadenosine 5'-phosphosulfate transmembrane transporter activity
  (GO:0046964) and 2 additional molecular function term(s)), indicating clade-level functional specialization
  across the family.
