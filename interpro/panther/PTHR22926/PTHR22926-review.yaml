term_assessments:
- assessed_term:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
  scope: FAMILY_WIDE
  scope_reason: >-
    The only reaction term that covers both branches, and the one PAINT asserts at the family root with
    three MraY and three WecA seeds. Every member transfers a substituted phosphate group from a
    UDP-sugar to a polyprenyl phosphate; what differs is the sugar moiety and therefore the polymer.
    Nothing narrower can be scoped family-wide, because the three branch-specific terms - GO:0008963
    and GO:0051992 for MraY, GO:0036380 for WecA - are siblings under this one, so there is no
    intermediate to drop to. Note that the reviewed MraY member marks its own GO:0016780 row
    over-annotated as redundant with the substrate-specific GO:0051992 it also carries; that is a
    judgement about what is informative for one gene, not a denial that the term is true, and the
    family-level scope is unaffected.
  supported_by:
  - reference_id: file:interpro/panther/PTHR22926/PTHR22926-paint.tsv
    supporting_text: "PTHR22926\tPTN000531998\tGO:0016780\tF\tIBD\tfalse"
  - reference_id: file:PSEPK/mraY/mraY-uniprot.txt
    supporting_text: transfers peptidoglycan precursor phospho-MurNAc-pentapeptide from UDP-MurNAc-
      pentapeptide onto the lipid carrier undecaprenyl phosphate
- assessed_term:
    id: GO:0005886
    label: plasma membrane
  scope: FAMILY_WIDE
  scope_reason: >-
    Safe for every member. These are polytopic proteins of the cytoplasmic membrane with about ten
    transmembrane helices, their acceptor substrate is a membrane-embedded polyprenyl phosphate, and
    their product remains in the bilayer, so the location is a requirement of the chemistry rather than
    an incidental observation. Both reviewed members accept the term and PAINT asserts it at the root
    with a seed from each branch.
  supported_by:
  - reference_id: file:PSEPK/mraY/mraY-uniprot.txt
    supporting_text: 'SUBCELLULAR LOCATION: Cell inner membrane'
  - reference_id: file:interpro/panther/PTHR22926/PTHR22926-paint.tsv
    supporting_text: "PTHR22926\tPTN000531998\tGO:0005886\tC\tIBD\tfalse"
- assessed_term:
    id: GO:0008963
    label: phospho-N-acetylmuramoyl-pentapeptide-transferase activity
  scope: UNRESOLVED
  scope_reason: >-
    No scope the schema offers is accurate. The term is certainly not family-wide, since the WecA branch
    does not catalyse this reaction at all; but it is not simply SUBFAMILY_ONLY for PTHR22926:SF5
    either, because the term is defined on the L-lysine pentapeptide and most of SF5 sits in organisms
    that build a meso-diaminopimelate stem peptide, for which GO:0051992 is the physiological reaction.
    The split inside SF5 is made by the organism's MurE, one step upstream in the pathway and outside
    this family, and it is not resolved by any subfamily or by any residue curated here: the enzyme
    transfers whatever pentapeptide it is given. Nor is the term false for a DAP-type member, since the
    L-lysine reaction is directly demonstrated on E. coli MraY by two independent curated annotations.
    The usable statements are the clade-level one, the PAINT row at PTN000532041 assessed above, and the
    per-gene one; the P. putida review keeps GO:0051992 and marks this term over-annotated, which is the
    right call for that gene and not generalisable to the subfamily. A stem-agnostic parent term in GO
    would make the question disappear.
  supported_by:
  - reference_id: file:interpro/panther/PTHR22926/PTHR22926-paint.tsv
    supporting_text: "PTHR22926\tPTN000532041\tGO:0008963\tF\tIBD\tfalse\tUniProtKB:P0A6W3\ttaxon:1224"
  - reference_id: file:genes/PSEPK/mraY/mraY-ai-review.yaml
    supporting_text: KT2440 MurE inserts meso-diaminopimelate, so GO:0051992, which
      this gene already carries, is the reaction it performs
- assessed_term:
    id: GO:0051992
    label: UDP-N-acetylmuramoyl-L-alanyl-D-glutamyl-meso-2,6-diaminopimelyl-D-alanyl-D-alanine:undecaprenyl-phosphate
      transferase activity
  scope: UNRESOLVED
  scope_reason: >-
    The mirror of GO:0008963 and undecidable for the mirror reason: it is the physiological reaction of
    the meso-DAP-type members of PTHR22926:SF5, which is most of them, and not of the L-lysine-type
    Bacillota members, and the division is organism-level rather than subfamily- or residue-level. It is
    recorded here because the asymmetry between the pair is worth stating explicitly. Of the two sibling
    terms, PAINT asserts only the L-lysine one, and asserts it on a clade (Pseudomonadota) that is
    uniformly meso-DAP-type, while the DAP term - which is what the reviewed member of this family
    accepts, and what Rhea maps onto E. coli MraY - is asserted at no node in the family at all. The
    recommendation that follows is to add it beside GO:0008963 at PTN000532041 rather than to dispute
    the existing row.
  supported_by:
  - reference_id: file:PSEPK/mraY/mraY-uniprot.txt
    supporting_text: 'Xref=Rhea:RHEA:28386'
  - reference_id: file:genes/PSEPK/mraY/mraY-ai-review.yaml
    supporting_text: The term corresponds exactly to the UniProt catalytic activity (RHEA:28386, EC
      2.7.8.13) using meso-diaminopimelate-containing precursor, the physiological substrate in
      Gram-negative Pseudomonas.
- assessed_term:
    id: GO:0036380
    label: UDP-N-acetylglucosamine-undecaprenyl-phosphate N-acetylglucosaminephosphotransferase activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The WecA-branch counterpart of the MraY terms, and the one place in this family where the subfamily
    axis does the work cleanly: the reaction is the transfer of GlcNAc-1-phosphate from UDP-GlcNAc to
    undecaprenyl phosphate, which is what the members of PTHR22926:SF3 do and what no MraY does. It is
    recorded here because PAINT asserts it nowhere in the family even though it is the exact reaction of
    the SF3 members, which reach it only through Rhea and EC mappings; an IBD for it at PTN000532005
    would be better grounded than the lipopolysaccharide row already there. Two caveats keep the scope
    at subfamily rather than promoting it further: the mycobacterial members use decaprenyl rather than
    undecaprenyl phosphate, and WbpL, the branch's best-characterised member here, also transfers
    Fuc2NAc and GalNAc, for which GO has no term, so the GlcNAc term describes part of what that enzyme
    does rather than all of it.
  applicable_subfamilies:
  - id: PANTHER:PTHR22926:SF3
    label: UNDECAPRENYL-PHOSPHATE ALPHA-N-ACETYLGLUCOSAMINYL 1-PHOSPHATE TRANSFERASE
  supported_by:
  - reference_id: PMID:9680202
    supporting_text: Cross-complementation experiments using WbpL and its homologue, Escherichia coli
      WecA, demonstrates that WbpL is bifunctional, initiating B-band synthesis with a Fuc2NAc residue
      and A-band synthesis with either a GlcNAc (N-acetylglucosamine) or GalNAc (N-acetylgalactosamine)
      residue.
- assessed_term:
    id: GO:0009103
    label: lipopolysaccharide biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Confined to the WecA branch: the MraY members make a peptidoglycan precursor and have nothing to do
    with lipopolysaccharide, and PAINT correctly asserts the term at the branch node rather than at the
    family root. Within SF3 the term holds for the Gram-negative members, whose product initiates the
    O antigen and the enterobacterial common antigen, and the reviewed member keeps it as a true but
    general statement, preferring the O-antigen child term for itself. It does not hold for the
    subfamily's Terrabacteria members, which are carved out as exceptions below, because
    lipopolysaccharide is by definition an outer-membrane polymer of Gram-negative bacteria and those
    organisms have no outer membrane. Scoping to the subfamily and excepting the members is the right
    shape here, because the division is a clade inside SF3 rather than a property of SF3 as a whole.
  applicable_subfamilies:
  - id: PANTHER:PTHR22926:SF3
    label: UNDECAPRENYL-PHOSPHATE ALPHA-N-ACETYLGLUCOSAMINYL 1-PHOSPHATE TRANSFERASE
  member_exceptions:
  - member:
      id: UniProtKB:O34753
      label: Probable undecaprenyl-phosphate N-acetylglucosaminyl 1-phosphate transferase
      gene_symbol: tagO
      organism: Bacillus subtilis 168
    exception_reason: >-
      Bacillus subtilis is a Gram-positive organism with no outer membrane and makes no
      lipopolysaccharide, so a lipopolysaccharide biosynthetic process term cannot hold for any protein
      it encodes. TagO's own product is the undecaprenyl-linked GlcNAc that starts wall teichoic acid, a
      cell-wall polymer, which is why this member keeps the cell-wall terms from PTN000531998 while the
      lipopolysaccharide row is wrong for it. The row does reach it: TagO carries the GO:0009103 IBA
      citing PTN000532005 and the same three seeds, which is what makes this an active over-propagation
      rather than a hypothetical one.
    pruned_node_id: PANTHER:PTN000532005
    supported_by:
    - reference_id: file:interpro/panther/PTHR22926/PTHR22926-paint.tsv
      supporting_text: "PTHR22926\tPTN000532005\tGO:0009103\tP\tIBD\tfalse\tUniProtKB:G3XD50|UniProtKB:P0AC78|UniProtKB:Q9X1N5\ttaxon:2"
  - member:
      id: UniProtKB:P9WMW5
      label: Decaprenyl-phosphate N-acetylglucosaminephosphotransferase
      gene_symbol: wecA
      organism: Mycobacterium tuberculosis H37Rv
    exception_reason: >-
      The mycobacterial envelope has no lipopolysaccharide either; this enzyme initiates the
      decaprenyl-linked arabinogalactan, and UniProt files it under a capsule-polysaccharide pathway
      rather than an LPS one. As with TagO the row reaches it, by the same IBA from PTN000532005, and as
      with TagO the exception is narrow: the member's generic transferase term from PTN000531998 is
      supported by its own direct experimental evidence and is not disturbed. The same judgement applies
      to its orthologs in the inventory (P9WMW4, P45830, A0R211) and to the Streptomyces member P40180,
      which have no gene reviews here to cross-check against.
    pruned_node_id: PANTHER:PTN000532005
    supported_by:
    - reference_id: file:interpro/panther/PTHR22926/PTHR22926-paint.tsv
      supporting_text: "PTHR22926\tPTN000532005\tGO:0009103\tP\tIBD\tfalse\tUniProtKB:G3XD50|UniProtKB:P0AC78|UniProtKB:Q9X1N5\ttaxon:2"
- assessed_term:
    id: GO:0044038
    label: cell wall macromolecule biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    True of both branches, for different polymers. The MraY members make the committed precursor of
    peptidoglycan; TagO makes the start of wall teichoic acid; the mycobacterial members make the start
    of arabinogalactan; and for the Gram-negative WecA enzymes the O antigen and the enterobacterial
    common antigen are part of what GO itself calls the Gram-negative-bacterium-type cell wall, a term
    E. coli WecA is directly annotated to. Both seeds of the PAINT row carry direct experimental
    annotations to this term. The reviewed WecA-branch member disagrees, marking its inherited row
    over-annotated on the ground that the O antigen is an outer-membrane rather than a cell-wall
    component; that reading is defensible under a narrower sense of cell wall than GO uses, and it is
    recorded here as a disagreement for a human to settle rather than resolved by excepting the member,
    because excepting it would mean overruling two experimental annotations whose papers this review has
    not read.
  supported_by:
  - reference_id: file:interpro/panther/PTHR22926/PTHR22926-paint.tsv
    supporting_text: "PTHR22926\tPTN000531998\tGO:0044038\tP\tIBD\tfalse"
  - reference_id: file:PSEPK/mraY/mraY-uniprot.txt
    supporting_text: 'PATHWAY: Cell wall biogenesis; peptidoglycan biosynthesis.'
- assessed_term:
    id: GO:0071555
    label: cell wall organization
  scope: FAMILY_WIDE
  scope_reason: >-
    The broadest of the process terms in play and safe for the same reasons as GO:0044038, with the same
    single dissent from the reviewed WecA-branch member. Every member of the family initiates the
    assembly of a surface polymer of its own envelope, and the term describes that outcome without
    committing to which polymer, which is exactly the generality a family-wide scope needs. It is worth
    saying what the term does not license: it is not a substitute for the branch-specific process terms,
    and a gene whose own pathway is known should carry GO:0009252 or GO:0009103 and its children in
    addition.
  supported_by:
  - reference_id: file:interpro/panther/PTHR22926/PTHR22926-paint.tsv
    supporting_text: "PTHR22926\tPTN000531998\tGO:0071555\tP\tIBD\tfalse"
  - reference_id: file:PSEPK/mraY/mraY-uniprot.txt
    supporting_text: Cell wall biogenesis/degradation
