- subfamily_id: PANTHER:PTHR22926:SF3
  clade_node_id: PANTHER:PTN000532005
  label: UNDECAPRENYL-PHOSPHATE ALPHA-N-ACETYLGLUCOSAMINYL 1-PHOSPHATE TRANSFERASE
  description: >-
    The WecA/TagO/GnpTA branch, 20 members, and the reason this family is heterogeneous. Its enzymes
    transfer N-acetylhexosamine-1-phosphate rather than phospho-MurNAc-pentapeptide, so their reaction
    is GO:0036380 (EC 2.7.8.33) and not the MraY reaction, and the polymer they initiate differs with
    the organism: O antigen and enterobacterial common antigen for the enterobacterial and Thermotoga
    WecA enzymes (P0AC78, Q8Z386, Q8XAS7, Q9ZCW4, Q8ZAE1, Q9CNG8, P45341, Q9X1N5) and for Pseudomonas
    aeruginosa WbpL (G3XD50), wall teichoic acid for Bacillus subtilis TagO (O34753), the
    decaprenyl-linked arabinogalactan of the mycobacterial envelope for the actinobacterial enzymes
    (P9WMW4, P9WMW5, P45830, A0R211, P40180), and protein N-glycosylation for the archaeal GnpTA
    proteins (P39465, P96000, O26830). WbpL is the branch's best-characterised member in this
    repository and is also its most permissive: the same protein initiates both P. aeruginosa O antigens,
    with Fuc2NAc for B band and with GlcNAc or GalNAc for A band.
