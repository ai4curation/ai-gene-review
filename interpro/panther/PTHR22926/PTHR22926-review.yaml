    supporting_text: Cross-complementation experiments using WbpL and its homologue, Escherichia coli
      WecA, demonstrates that WbpL is bifunctional, initiating B-band synthesis with a Fuc2NAc residue
      and A-band synthesis with either a GlcNAc (N-acetylglucosamine) or GalNAc (N-acetylgalactosamine)
      residue.
