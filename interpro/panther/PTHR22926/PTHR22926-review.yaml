notes: >-
  Member counts and subfamily assignments are from PTHR22926-entries.csv (716 in SF5, 20 in SF3 of 736
  members); family and subfamily names are interpro/panther/panther.obo verbatim. The PROSITE pattern in
  the residue site was taken from PS01348 and scanned over sequences fetched from UniProt; the
  alignment-derived positions are stated in each protein's own numbering and the declared controls make
  them re-checkable. Leaf-level annotation facts used in the reasoning but not quoted - which members
  receive which IBA from which node, and which seeds carry their own experimental annotations - were
  read from QuickGO on 2026-11-15; the underlying papers (PMID:1846850 and PMID:215212 for E. coli MraY,
  PMID:11700352 for E. coli WecA, PMID:18723618 for Thermotoga WecA, PMID:4208473 for S. aureus MraY,
  PMID:20637039 for Mycobacterium WecA) are not in this repository's publication cache, so they are
  described rather than quoted and nothing in this review overrules them. Items for upstream attention.
  (1) The stem-peptide gap: GO:0008963 (L-lysine) and GO:0051992 (meso-DAP) are siblings under
  GO:0016780 with no stem-agnostic parent, so every MraY annotation must commit to a stem type that MraY
  does not select. The identical gap exists for MurF (GO:0047480 against GO:0008766) and MurG
  (GO:0050511 against GO:0051991); one new parent per pair would fix three families. (2) PAINT asserts
  only the L-lysine form, and does so on a clade that is uniformly meso-DAP-type; adding a GO:0051992
  IBD beside it at PTN000532041 would mirror what PAINT already did for MurF. (3) The lipopolysaccharide
  row at PTN000532005 reaches Bacillus and Mycobacterium members whose organisms have no outer membrane,
  and needs a loss on the Terrabacteria branch. (4) GO:0036380, the exact reaction of the whole SF3
  branch, is asserted at no node in this family and reaches its members only through Rhea and EC
  mappings. (5) One leaf annotation looks like a source defect rather than a propagation problem:
  E. coli WecA (P0AC78) carries a GO:0008963 IDA from EcoliWiki citing PMID:18723618, a paper whose
  other annotations in GOA are all on the Thermotoga maritima enzyme, and GO:0008963 is the MraY
  reaction rather than WecA's. The paper is not cached here, so this is recorded as probable and for
  EcoliWiki's attention rather than asserted.
