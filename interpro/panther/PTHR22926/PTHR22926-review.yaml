  description: >-
    MraY proper: 716 of the 736 members of the cached inventory, spanning essentially the whole
    bacterial world, from Escherichia coli P0A6W3 and Pseudomonas putida Q88N79 through Staphylococcus
    aureus Q2FZ93 and Listeria A0AKD7 to the deep-branching Aquifex aeolicus O66465. These catalyse
