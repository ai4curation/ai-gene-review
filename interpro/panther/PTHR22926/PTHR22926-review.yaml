    strength: ASSOCIATED
    rationale: >-
      The site is recorded as an observed correlation, deliberately and at the weakest strength. The
      block is the signature by which PROSITE recognises this family, it sits on the cytoplasmic face
      where the UDP-sugar donor must be bound, and its two aspartates are conserved across both
      branches, which is consistent with a role in the shared transfer chemistry and with the
      magnesium dependence UniProt records as a cofactor. But no residue of it has been mutated in any
      member whose paper is cached here, the structural work on the family is not in the cache either,
      and a protein can carry both aspartates while failing the pattern and still have direct evidence
      for the activity. Asserting CONTRIBUTES or REQUIRED would therefore be claiming a mechanism this
      review has not seen tested; the site is curated so that the positions are pinned, checkable and
      ready to be promoted when the mutagenesis is available.
