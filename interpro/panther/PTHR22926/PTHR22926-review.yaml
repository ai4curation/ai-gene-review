    stem-peptide chemistry: it holds both the meso-diaminopimelate-type enzymes of the Gram-negative
    bacteria, the mycobacteria and Bacillus, and the L-lysine-type enzymes of Staphylococcus and the
    other Bacillota, and the two have different GO terms. Note that the clade node recorded here is the
    one PAINT uses for its Pseudomonadota-restricted activity row, not the root of the whole subfamily.
