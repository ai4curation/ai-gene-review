family_id: PANTHER:PTHR22926
family_name: PHOSPHO-N-ACETYLMURAMOYL-PENTAPEPTIDE-TRANSFERASE
preferred_name: 'Polyprenyl-phosphate N-acetylhexosamine-1-phosphate transferases: MraY and the WecA/TagO
  branch'
summary: >-
  Polytopic inner-membrane enzymes of glycosyltransferase family 4 that start a polyprenyl-linked
  biosynthetic pathway by transferring a sugar-1-phosphate from a soluble UDP-sugar onto the lipid
  carrier undecaprenyl phosphate, releasing UMP. Two branches of the family do this with different
  donors, for different polymers. MraY, the large branch, transfers phospho-MurNAc-pentapeptide from
  UDP-MurNAc-pentapeptide to give lipid I, the first membrane-bound intermediate of peptidoglycan
  synthesis and the committed entry into the lipid cycle that MurG and MurJ continue. The WecA/TagO
  branch transfers N-acetylhexosamine-1-phosphate from UDP-GlcNAc (or, in Pseudomonas aeruginosa WbpL,
  also UDP-Fuc2NAc and UDP-GalNAc) and so initiates the O antigen and enterobacterial common antigen in
  Gram-negative bacteria, wall teichoic acid in Bacillus subtilis, and the arabinogalactan of the
  mycobacterial envelope; the archaeal members of the same branch initiate protein N-glycosylation. All
  of them are magnesium-dependent, all sit in the cytoplasmic membrane with around ten transmembrane
  helices, and the only reaction description that covers the whole family is the generic transfer of a
  substituted phosphate group.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family lumps two reactions that differ in their donor and in the polymer they commit the cell to
  making, and here, unlike in most PANTHER families, the subfamily axis does separate them cleanly:
  PANTHER:PTHR22926:SF5 (716 of the 736 members in the cached inventory) is MraY, and
  PANTHER:PTHR22926:SF3 (20 members) is the WecA/TagO/GnpTA branch. GO has an exact term for each
  branch - GO:0008963 and GO:0051992 for MraY, GO:0036380 for WecA - and all three are siblings under
  GO:0016780, so nothing more specific than GO:0016780 is safe family-wide. Inside the MraY branch a
  second, finer split runs on stem-peptide chemistry, since GO:0008963 is defined on the L-lysine
  pentapeptide and GO:0051992 on the meso-diaminopimelate one; and inside the WecA branch a third split
  runs on which polymer is initiated, which is why the lipopolysaccharide term asserted for that clade
  reaches Bacillus and Mycobacterium members whose organisms have no outer membrane at all.
