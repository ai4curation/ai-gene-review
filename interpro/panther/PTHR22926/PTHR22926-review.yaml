- node_id: PANTHER:PTN000532041
  asserted_term:
    id: GO:0008963
    label: phospho-N-acetylmuramoyl-pentapeptide-transferase activity
  evidence: IBD
  negated: false
  paint_snapshot: '20170602'
  seeds:
  - id: UniProtKB:P0A6W3
    label: Phospho-N-acetylmuramoyl-pentapeptide-transferase
    gene_symbol: mraY
    organism: Escherichia coli K-12
  node_taxon:
    id: NCBITaxon:1224
    label: Pseudomonadota
  assessment: SOUND
  assessment_reason: >-
    Sound as an assertion, incomplete as a description, and the gap is the same stem-peptide gap that
    runs through MurE, MurF and MurG. GO:0008963 is defined on the L-lysine pentapeptide; its
    meso-diaminopimelate counterpart GO:0051992 is a sibling under GO:0016780, not a child, so the two
    do not entail each other. The node is restricted to Pseudomonadota, which build a meso-DAP stem
    peptide throughout, so on the face of it the row propagates the wrong stem form to the whole clade -
    and the reviewed P. putida member marks the inherited row over-annotated for that reason, keeping
    GO:0051992 instead. What stops this being a mis-inference is the seed itself: E. coli MraY carries
    two independent direct experimental annotations to GO:0008963, from EcoCyc and EcoliWiki, whose
    papers are not in this repository's cache. The historical assays of MraY used UDP-MurNAc-pentapeptide
    prepared from Gram-positive organisms, so the L-lysine reaction is a demonstrated capability of the
    E. coli enzyme even though it is not the reaction E. coli performs in vivo, and there is nothing
    here to overrule those curators with. The row therefore stands, and what the family needs is the
    other half of the pair: no PAINT row in this family asserts GO:0051992 anywhere, although it is the
    physiological reaction of every member below this node. Asserting both stem forms at the same node
    is precisely what PAINT did for MurF at PTN000566380 in 2026, and the same fix applies here. The
    durable solution remains a stem-agnostic parent term in GO.
  supported_by:
  - reference_id: file:interpro/panther/PTHR22926/PTHR22926-paint.tsv
    supporting_text: "PTHR22926\tPTN000532041\tGO:0008963\tF\tIBD\tfalse"
