residue_sites:
- site_id: mray_loop3_dgxdg
  label: Aspartate pair of the third cytoplasmic loop (PROSITE MraY family signature 2)
  description: >-
    PROSITE's second MraY family signature, [NHS]-x(2)-[NK]-x-[TINAS]-[DN]-G-[ILVM]-D-G-[LM], lies in
    the third cytoplasmic loop and contains two invariant aspartates; PROSITE records that it detects
    all members of the MraY family and, among Swiss-Prot sequences, only one protein outside it. In
    E. coli MraY the block runs 189-200 as NAVNLTDGLDGL, putting the aspartates at 195 and 198, and the
    reviewed P. putida member has the identical block at the identical positions. Scanning the pattern
    over the family's members reproduces PROSITE's claim and sharpens it: every MraY member tested
    matches (P. putida Q88N79, S. aureus Q2FZ93 at 166-177, Aquifex O66465 at 187-198, Listeria A0AKD7
    at 168-179), while the enterobacterial WecA enzymes (P0AC78, Q8Z386), the Thermotoga enzyme
    (Q9X1N5), the mycobacterial enzyme (P9WMW5), P. aeruginosa WbpL (G3XD50) and the archaeal GnpTA
    protein (P39465) do not. The two exceptions are instructive rather than fatal: Bacillus subtilis
    TagO (O34753, at 153-164) matches although it belongs to the WecA branch, and so does Haemophilus
    influenzae WecA (P45341, at 144-155), which is the single out-of-family hit PROSITE itself
    documents. So the pattern is a good but imperfect branch marker, and it is the surrounding block
    rather than the aspartates that carries the signal - the aspartates themselves are conserved in the
    non-matching WecA enzymes too (P0AC78 at 156 and 159, Q9X1N5 at 128 and 131, P9WMW5 at 193 and 196).
    No mutagenesis of either aspartate is available in this repository's cache, so no mechanistic claim
    is made and no negative control is declared: a WecA enzyme would be the natural negative for the
    MraY reaction, but it carries the aspartates and has its own direct evidence for the generic
    transferase activity, so it cannot serve as one. Positions in members other than the anchor were
    obtained by global pairwise alignment (BLOSUM62) to P0A6W3 and by scanning the pattern directly; the
    controls below make them re-checkable.
