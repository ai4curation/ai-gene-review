    organism: Thermotoga maritima MSB8
  assessment: SOUND
  assessment_reason: >-
    This row looks wrong at first sight and is not, which is why it is worth stating the reasoning in
    full. The two seeds are both WecA enzymes, whose products are the O antigen and the enterobacterial
    common antigen, so the obvious objection is that those are outer-membrane glycans rather than cell
    wall, and the gene review of the family's reviewed WecA-branch member marks the inherited row
    over-annotated on exactly that ground. Two things answer the objection. First, both seeds carry
    direct experimental annotations to this term made by curators who read the full papers, which are
    not in this repository's cache, so there is nothing here to overrule them with. Second, GO's own
    treatment of the Gram-negative envelope is wider than the peptidoglycan sacculus: the term
    GO:0009276 Gram-negative-bacterium-type cell wall exists and E. coli WecA is directly annotated to
    it, so a glycan destined for that structure does satisfy the definition of a macromolecule destined
    to form part of a cell wall. The term is in any case true of the whole MraY branch for the ordinary
    reason, since lipid I is the committed precursor of peptidoglycan, and of the TagO and mycobacterial
    members of the WecA branch, whose teichoic acid and arabinogalactan are cell-wall polymers in every
    sense. The gene-level disagreement is recorded in the term assessment below rather than resolved by
    a pruning action.
