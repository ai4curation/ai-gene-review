  diverged_from_family: true
  divergence_description: >-
    These members do not catalyse the reaction the family is named after. Their donor is a UDP-N-acetyl
    hexosamine rather than UDP-MurNAc-pentapeptide, their product is an undecaprenyl- or
    decaprenyl-pyrophosphoryl-HexNAc rather than lipid I, and their pathway is O antigen, teichoic acid,
    arabinogalactan or protein glycosylation rather than peptidoglycan. The divergence is visible in
    sequence as well as in reaction: scanning PROSITE's MraY family signature 2 across the inventory
    matches every MraY member tested and fails on the enterobacterial, Thermotoga and mycobacterial WecA
    enzymes, on WbpL and on the archaeal GnpTA proteins, and the reviewed member WbpL carries no PROSITE
    MraY cross-reference while the reviewed MraY member carries both. The practical consequence for
    propagation is that no MraY-reaction term (GO:0008963 or GO:0051992) may descend here, while the
    generic GO:0016780, the plasma membrane location and - with the exceptions recorded below - the
    cell-wall process terms all legitimately do.
  supported_by:
