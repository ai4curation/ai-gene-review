family_id: PANTHER:PTHR43762
family_name: L-GULONOLACTONE OXIDASE
preferred_name: Aldonolactone oxidase family (ALO1 / GULO)
summary: >-
  FAD-dependent aldonolactone oxidases. Fungal D-arabinono-1,4-lactone oxidases (S. cerevisiae ALO1,
  S. pombe alo1) make D-erythroascorbate in mitochondria; animal L-gulonolactone oxidase (GULO, SF8)
  makes ascorbate and is lost in primates and guinea pigs.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The lactone substrate differs: D-arabinono-1,4-lactone (SF1) or L-gulono-1,4-lactone (SF8).
