family_id: PANTHER:PTHR43816
family_name: NICOTINAMIDE PHOSPHORIBOSYLTRANSFERASE
preferred_name: Nicotinamide phosphoribosyltransferase (NAMPT/NadV) family
summary: >-
  Nicotinamide phosphoribosyltransferases transfer the phosphoribosyl group of
  PRPP to nicotinamide, making nicotinamide mononucleotide (NMN) for direct
  adenylylation to NAD+ by NMN adenylyltransferases. This is the main
  nicotinamide salvage route of mammals and of bacteria that carry NadV-type
  enzymes; it bypasses nicotinamide deamidation. The reviewed members in the
  local inventory are in SF1 and include human, mouse, rat and pig NAMPT and
  bacterial enzymes from Xanthomonas, Acinetobacter and Mycoplasmoides. All three
  PANTHER subfamilies carry the same name.
functional_coherence: COHERENT
coherence_reason: >-
  Reviewed members are nicotinamide phosphoribosyltransferases; the PAINT node
  carrying the activity is seeded by experimentally characterized mammalian
  NAMPT.
