  scope: FAMILY_WIDE
  scope_reason: >-
    Asserted by MODULE:nad_biosynthesis_salvage for the NMN route and accepted
    on human NAMPT. FAMILY_WIDE is the expectation from the evidence available,
    not a check of every subfamily: all reviewed members (all in SF1) are
    nicotinamide phosphoribosyltransferases, the activity is inherited from
    PTN000120784, and PANTHER names SF2 and SF3 nicotinamide
    phosphoribosyltransferase as well. No SF2 or SF3 member has been
    characterized or reviewed, so a divergent subfamily would change this
    scope.
