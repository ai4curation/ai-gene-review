  name:
    name: Zyxin/Ajuba LIM domain-containing
    short: Zyxin/Ajuba_LIM
  description:
  - text: The Zyxin/Ajuba family proteins are involved in various cellular processes
      related to cell adhesion, motility, and signal transduction. They play structural
      roles at cell adhesion sites, maintaining cell shape and facilitating motility.
      Members of the family serve as scaffold proteins, assembling distinct protein
      complexes in the cytoplasm and nucleus. They are implicated in the regulation
      of gene transcription and in the signaling pathways from cell adhesion sites
      to the nucleus. Additionally, they participate in the stabilization of actin
      filaments and in the regulation of integrin-mediated cell-cell adhesion. Some
      family members are involved in synaptogenesis and muscle cell damage sensing,
      while others may regulate phagocytosis and cell differentiation.
