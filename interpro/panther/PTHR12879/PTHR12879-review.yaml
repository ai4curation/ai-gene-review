family_id: PANTHER:PTHR12879
family_name: SPHINGOLIPID DELTA 4 DESATURASE/C-4 HYDROXYLASE PROTEIN DES2
preferred_name: Sphingolipid delta-4 desaturase (DEGS1/DES2) family
summary: >-
  Di-iron membrane desaturases that introduce the 4,5-trans double bond into dihydroceramide to make
  ceramide (DEGS1, S. pombe dsd1). DEGS2 also hydroxylates C4, making phytoceramide. S. cerevisiae
  has no member: it makes phytoceramides with the unrelated hydroxylase SUR2.
functional_coherence: COHERENT
coherence_reason: All subfamilies desaturate at delta-4; DEGS2 (SF21) adds C4-hydroxylase activity.
