  assessment: NEEDS_PRUNING
  assessment_reason: 'This node backs two in-repo gene reviews from opposite directions: it is the donor
    of both the XENTR aldh1a2 GO:0004029 IBA and the rat Aldh1l1 GO:0004029 IBA. The node placement itself
    is defensible and broadly seeded -- bacteria (E. coli betB and others), fungi (A. nidulans aldA, A.
    fumigatus, yeast ALD4/ALD5), Drosophila, and many mammalian paralogs including the ALDH1A retinaldehyde
    dehydrogenases, ALDH2, ALDH9A1 and ALDH1L1 -- so the only activity shared across that breadth is generic
    NAD+-dependent aldehyde oxidation, which is exactly the term asserted; a substrate-specific term such
    as retinal dehydrogenase could not sit here. For the ALDH1A/RALDH branch inheritance is sound: the
    XENTR target''s own ortholog group is among the seeds (human ALDH1A2 O94788 and mouse Aldh1a2 MGI:107928),
    i.e. the function is experimentally grounded inside the very branch that inherits it (expected, not
    circular), and the frog target retains the complete catalytic machinery (see residue sites and the
    gene review''s residue claims). The problem is one identified descendant branch: the ALDH1L/FDH clade
    (rooted at PTN008524390, subfamilies SF120 and SF131) diverged in cofactor specificity -- its C-terminal
    ALDH domain catalyzes an NADP(+)-dependent oxidation (PMID:7822273; PMID:1848231; PMID:17302434) and
    no NAD+ activity is documented for it, so the NAD+ cofactor term is wrong for every ALDH1L member.
    Crucially this is cofactor divergence, not activity loss: the catalytic nucleophile and general base
    are fully intact in the clade (aldh_nucleophile site -- Cys707/Glu673 in rat and human ALDH1L1, Cys728/Glu694
    in human ALDH1L2, verified against the live UniProt sequences), so a pseudo-enzyme reading (REMOVE)
    would be wrong. The fix is an IRD/NOT pruning GO:0004029 at the ALDH1L clade so the NADP+-scoped term
    GO:0033721 carries the activity there instead; this concurs with the rat Aldh1l1 gene review''s MODIFY
    to GO:0033721 and leaves the XENTR aldh1a2 inheritance untouched. Renumbering note: the XENTR GOA
    row (dated 20250411) cites node PANTHER:PTN000192421 in WITH/FROM with essentially this seed list;
    that node id does not appear in the current cached PAINT slice (snapshot 20260828), consistent with
    a PANTHER re-release renumbering the node. This assessment applies to the current node PTN000192666.


    A second descendant branch needs the same treatment, identified in the 2026-11-04 pass: the bacterial
    EutE/PduP acylating aldehyde dehydrogenases (SF68). Their reaction is CoA-acylating, giving acetyl-CoA
    rather than the free carboxylate of GO:0004029, and it is measured directly on Salmonella EutE (P41793)
    in both directions (PMID:21803884); the in-repo eutE gene review therefore MODIFYs this term to GO:0008774.
    As for ALDH1L this is reaction divergence with the catalytic machinery intact, not activity loss,
    so the fix is a prune at the acylating branch rather than a removal. Inheritance for the mitochondrial
    classical ALDHs, including human ALDH2 (P05091, SF233) whose own COMPLETE gene review accepts the
    term on direct kinetics, is unaffected.'
