- subfamily_id: PANTHER:PTHR11699:SF68
  label: ACETALDEHYDE DEHYDROGENASE (ACETYLATING) EUTE
  description: The bacterial EutE/PduP branch of CoA-acylating acetaldehyde dehydrogenases. Salmonella
    Typhimurium LT2 EutE (P41793) is the second enzyme of ethanolamine catabolism and is classified at
    this subfamily by PANTHER's own 19.0 classification for Salmonella and by the local member index;
    its UniProt record carries only the family-level PANTHER cross-reference, so the subfamily assignment
    is taken from PANTHER's files rather than from UniProt. The Salmonella propanediol-utilisation paralog
    PduP (Q9XDN1) is classified at the same subfamily in that file. Members carry the curated PIRSF036410
    EutE_PduP signature and the IPR012408 acetaldehyde/propionaldehyde dehydrogenase family signature.
  representative_members:
  - id: UniProtKB:P41793
    label: eutE
    organism: Salmonella typhimurium (strain LT2 / SGSC1412 / ATCC 700720)
    gene_review: genes/SALTY/eutE/eutE-ai-review.yaml
  diverged_from_family: true
  divergence_description: 'Diverged in the chemistry itself, not merely in substrate or cofactor: the
    reaction is CoA-acylating (acetaldehyde + NAD+ + CoA = acetyl-CoA + NADH + H+, EC 1.2.1.10, RHEA:23288),
    so the product is a thioester rather than the free carboxylate that GO:0004029 describes, and the
    enzyme also runs the reverse acetyl-CoA reductase direction. The non-acylating NAD+ cofactor term
    GO:0004029 must therefore not descend here; the correct activity term is GO:0008774. The characterized
    Salmonella EutE and PduP enzymes are associated with their respective bacterial microcompartments;
    that context is not inferred for every family member.'
