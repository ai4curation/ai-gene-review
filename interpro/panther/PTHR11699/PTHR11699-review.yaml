      - id: UniProtKB:P77674
      - id: UniProtKB:P80668
      - id: UniProtKB:Q4WCK7
        label: ALDH
        organism: Aspergillus fumigatus
      - id: UniProtKB:Q9HTJ1
      - id: UniProtKB:Q9HWJ2
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      This node backs two in-repo gene reviews from opposite directions: it is
      the donor of both the XENTR aldh1a2 GO:0004029 IBA and the rat Aldh1l1
      GO:0004029 IBA. The node placement itself is defensible and broadly
      seeded -- bacteria (E. coli betB and others), fungi (A. nidulans aldA,
      A. fumigatus, yeast ALD4/ALD5), Drosophila, and many mammalian paralogs
      including the ALDH1A retinaldehyde dehydrogenases, ALDH2, ALDH9A1 and
      ALDH1L1 -- so the only activity shared across that breadth is generic
      NAD+-dependent aldehyde oxidation, which is exactly the term asserted; a
      substrate-specific term such as retinal dehydrogenase could not sit
      here. For the ALDH1A/RALDH branch inheritance is sound: the XENTR
      target's own ortholog group is among the seeds (human ALDH1A2 O94788 and
      mouse Aldh1a2 MGI:107928), i.e. the function is experimentally grounded
      inside the very branch that inherits it (expected, not circular), and
      the frog target retains the complete catalytic machinery (see residue
      sites and the gene review's residue claims). The problem is one
      identified descendant branch: the ALDH1L/FDH clade (rooted at
      PTN008524390, subfamilies SF120 and SF131) diverged in cofactor
      specificity -- its C-terminal ALDH domain catalyzes an NADP(+)-dependent
      oxidation (PMID:7822273; PMID:1848231; PMID:17302434) and no NAD+
      activity is documented for it, so the NAD+ cofactor term is wrong for
      every ALDH1L member. Crucially this is cofactor divergence, not activity
      loss: the catalytic nucleophile and general base are fully intact in the
      clade (aldh_nucleophile site -- Cys707/Glu673 in rat and human ALDH1L1,
      Cys728/Glu694 in human ALDH1L2, verified against the live UniProt
      sequences), so a pseudo-enzyme reading (REMOVE) would be wrong. The fix
      is an IRD/NOT pruning GO:0004029 at the ALDH1L clade so the NADP+-scoped
      term GO:0033721 carries the activity there instead; this concurs with
      the rat Aldh1l1 gene review's MODIFY to GO:0033721 and leaves the
      XENTR aldh1a2 inheritance untouched. Renumbering note: the XENTR GOA row
      (dated 20250411) cites node PANTHER:PTN000192421 in WITH/FROM with
      essentially this seed list; that node id does not appear in the current
      cached PAINT slice (snapshot 20260828), consistent with a PANTHER
      re-release renumbering the node. This assessment applies to the current
      node PTN000192666.
    affected_subfamilies:
      - {id: PANTHER:PTHR11699:SF120, label: CYTOSOLIC 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE}
      - {id: PANTHER:PTHR11699:SF131, label: MITOCHONDRIAL 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE}

  - node_id: PANTHER:PTN002619055
    asserted_term:
      id: GO:0046185
      label: aldehyde catabolic process
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20260409"
    seeds:
      - id: UniProtKB:P05091
        label: ALDH2
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      This is the node behind the XENTR aldh1a2 BP IBA. The target's GOA row
      (dated 20250320) records the older form of this assertion, GO:0006081
      (aldehyde metabolic process) with WITH/FROM seeds mouse Aldh1a2
      (MGI:107928), human ALDH1A3 (P47895), human ALDH2 (P05091), rat Aldh2
      (RGD:69219) and Drosophila Aldh (FB:FBgn0012036); the current PAINT
      snapshot narrows the term to aldehyde catabolic process with human ALDH2
      as the recorded seed, placed at Eumetazoa. Under either version the
      assertion is conservative-but-correct for the clade: the descendants mix
      retinaldehyde-specific members (ALDH1A2, ALDH1A3) with non-retinoid
      members (ALDH2, Drosophila Aldh), so a retinoid-specific process term
      (GO:0002138) could not have been asserted here, and generic aldehyde
      metabolism/catabolism is true of every descendant -- for the frog target,
      oxidation of retinaldehyde consumes an aldehyde, so the generic process
      subsumes its specific one. This confirms the prior gene-level judgment
      (KEEP_AS_NON_CORE, root_cause NO_FAILURE_NON_CORE, GRANULARITY_MISMATCH):
      the right fix is a separate specific NEW annotation on the gene, not a
      re-scoping of this node.

  - node_id: PANTHER:PTN008524390
    asserted_term:
      id: GO:0005739
      label: mitochondrion
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20251210"
    seeds:
      - {id: UniProtKB:Q3SY69, label: ALDH1L2, organism: Homo sapiens}
    assessment: TOO_DEEP
    assessment_reason: >-
      PTN008524390 is the ancestral node of the whole ALDH1L/FDH clade, recorded at
      Eukaryota: the same node carries the GO:0016155 (formyltetrahydrofolate dehydrogenase
      activity) and GO:0009258 IBDs, whose seeds include both cytosolic ALDH1L1 members
      (human O75891, mouse, rat, zebrafish) and mitochondrial ALDH1L2 members (Q3SY69), so
      both paralog branches descend from it. The mitochondrion IBD at this node, however,
      is seeded solely by human ALDH1L2 (Q3SY69). Mitochondrial targeting is an
      ALDH1L2-lineage innovation -- Q3SY69 carries an N-terminal transit peptide (UniProt
      transit peptide 1-19) that ALDH1L1 lacks, and ALDH1L1 orthologs are cytosolic
      (UniProt names rat P28037 and human O75891 "Cytosolic 10-formyltetrahydrofolate
      dehydrogenase"; rat cytosol is directly supported, PMID:1848231). Placing the
      compartment at the eukaryote-wide FDH ancestor therefore makes the clade that never
      had it -- the cytosolic ALDH1L1 branch (SF120) -- inherit the term. The IBD should sit
      on the ALDH1L2 (SF131) clade instead. The slice's other two GO:0005739 IBDs
      (PTN000916385, a fungal branch seeded from SGD; PTN008977985, seeded by mitochondrial
      classical ALDHs including P05091) sit on other branches and are not disputed. This
      concurs with the rat Aldh1l1 gene review's REMOVE of its mitochondrion IBA.
    affected_subfamilies:
      - {id: PANTHER:PTHR11699:SF120, label: CYTOSOLIC 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE}

residue_sites:
  - site_id: catalytic_cys
    label: Catalytic cysteine nucleophile
    description: >-
      The active-site cysteine that attacks the aldehyde carbonyl to form the
      covalent thiohemiacetal, then thioacyl, intermediate of the ALDH
      mechanism. In the anchor (human ALDH1A2) it is Cys320, the second
      cysteine of the near-invariant FNQGQC[C] block; UniProt annotates the
      homologous position as ACT_SITE Nucleophile in ALDH2 (P05091 Cys319) and
      ALDH1A1 (P00352 Cys303). The Xenopus tropicalis aldh1a2 target carries
      the same block with the corresponding cysteine at position 313. The one
      documented family member with a degenerate active site, ALDH16A1
      (Q8IZ83; UniProt CAUTION "The active site cysteine and glutamate
      residues are not conserved in this protein"), is too diverged for a
      confident position-level mapping (the region around the catalytic
      cysteine does not align cleanly), so it is recorded here in prose rather
      than as a machine-checkable control with an asserted position. This site
      and general_base_glu describe the same catalytic dyad as
      aldh_nucleophile, from an ALDH1A2 anchor instead of an ALDH2 anchor;
      both anchors are kept because different gene reviews cite them.
    anchor:
      id: UniProtKB:O94788
      label: ALDH1A2
      organism: Homo sapiens
    anchor_sequence_version: 3
    site_source: UNIPROT_FEATURE
    residues:
      - position: 320
        expected: [C]
        role: nucleophile
    required_for:
      - term:
          id: GO:0004029
          label: aldehyde dehydrogenase (NAD+) activity
        strength: CONTRIBUTES
        rationale: >-
          Catalysis runs through a covalent adduct at this cysteine's thiolate,
          so mechanistically its loss abolishes aldehyde oxidation and the
          dependency is absolute. It is nevertheless recorded as CONTRIBUTES
          rather than REQUIRED because REQUIRED licenses a validator to
          contradict gene reviews and therefore demands a verified negative
          control from within the family, and the only documented
          catalytically degenerate member (ALDH16A1) cannot be cleanly aligned
          at this position, leaving no machine-checkable example of loss.
          Promote to REQUIRED if and when a mappable negative control is
          established.
      - term:
          id: GO:0006081
          label: aldehyde metabolic process
        strength: CONTRIBUTES
        rationale: >-
          Within this family, participation in aldehyde metabolism is direct
          enzymatic aldehyde oxidation through this nucleophile, whatever the
          substrate or cofactor, so retention of the cysteine is what carries
          the process term to a member. Kept at CONTRIBUTES for the same
          negative-control reason as the activity term.
    positive_controls:
      - id: UniProtKB:O94788
        label: ALDH1A2
        organism: Homo sapiens
        control_position: 320
        control_residue: C
      - id: UniProtKB:P05091
        label: ALDH2
        organism: Homo sapiens
        control_position: 319
        control_residue: C
      - id: UniProtKB:P00352
        label: ALDH1A1
        organism: Homo sapiens
        control_position: 303
        control_residue: C

  - site_id: general_base_glu
    label: General-base glutamate
    description: >-
      The conserved glutamate that acts as general base, activating the
      catalytic cysteine/the hydrolytic water during deacylation. It sits in
      the invariant LKRVTL[E]LGGKSP block: Glu286 in the anchor (human
      ALDH1A2), Glu285 in ALDH2 (P05091) and Glu269 in ALDH1A1 (P00352), each
      carried as an ACT_SITE "Proton acceptor" feature on its own UniProt
      record. The Xenopus tropicalis aldh1a2 target has the identical block
      with Glu279, which is the single ACT_SITE feature on its own record
      (PROSITE-ProRule PRU10007) -- note the target's earlier gene review
      mislabelled that feature as a cysteine, an error corrected in the
      2026-08-31 pass.
    anchor:
      id: UniProtKB:O94788
      label: ALDH1A2
      organism: Homo sapiens
    anchor_sequence_version: 3
    site_source: UNIPROT_FEATURE
    residues:
      - position: 286
        expected: [E]
        role: general base (proton acceptor)
    required_for:
      - term:
          id: GO:0004029
          label: aldehyde dehydrogenase (NAD+) activity
        strength: CONTRIBUTES
        rationale: >-
          The general base is part of the core catalytic machinery, but the
          discriminating residue in this family is the cysteine nucleophile,
          and (as for catalytic_cys) no machine-checkable negative control
          exists, so the dependency is recorded as CONTRIBUTES.
    positive_controls:
      - id: UniProtKB:O94788
        label: ALDH1A2
        organism: Homo sapiens
        control_position: 286
        control_residue: E
      - id: UniProtKB:P05091
        label: ALDH2
        organism: Homo sapiens
        control_position: 285
        control_residue: E
      - id: UniProtKB:P00352
        label: ALDH1A1
        organism: Homo sapiens
        control_position: 269
        control_residue: E

  - site_id: aldh_nucleophile
    label: ALDH catalytic Cys nucleophile / Glu general base
    description: >-
      The invariant catalytic dyad of the ALDH fold: a cysteine nucleophile that forms the
      covalent thiohemiacetal/thioacyl intermediate with the aldehyde carbon, and a
      glutamate general base that activates the hydrolytic water. Recorded here to make the
      key negative point of this review machine-checkable: the ALDH1L/FDH clade retains
      this site completely, so its GO:0004029 problem is cofactor scope (NADP+ vs NAD+),
      not loss of aldehyde dehydrogenase chemistry. The rat Aldh1l1 gene review's RETAINED
      residue claim (ALDH2 Cys319 -> rat Cys707) is the gene-level citation of this site.
      The negative control, human ALDH16A1 (PTHR11699:SF211), is the family's documented
      pseudo-enzyme: UniProt cautions that "The active site cysteine and glutamate residues
      are not conserved in this protein". Its active-site segment is diverged beyond
      confident single-column mapping -- pairwise alignment against ALDH2 places Cys319 in
      a gap and the sequence retains neither the NQGQC catalytic-cysteine motif nor the
      ELGGK general-base motif -- so no own-numbering control position is asserted for it
      (an absent position says "not established"; an aligned guess would say something
      false). This site describes the same dyad as catalytic_cys/general_base_glu from an
      ALDH2 anchor; both anchors are kept because different gene reviews cite them.
    anchor:
      id: UniProtKB:P05091
      label: Aldehyde dehydrogenase, mitochondrial
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: UNIPROT_FEATURE
    residues:
      - {position: 319, expected: [C], role: catalytic nucleophile}
      - {position: 285, expected: [E], role: general base (proton acceptor)}
    required_for:
      - term:
          id: GO:0004030
          label: aldehyde dehydrogenase [NAD(P)+] activity
        strength: REQUIRED
        rationale: >-
          ALDH catalysis proceeds through a covalent acyl-enzyme intermediate on the
          catalytic cysteine; without the thiol there is no nucleophilic attack on the
          aldehyde carbon and no hydride transfer to the nicotinamide cofactor, whichever
          cofactor the branch uses. The dependency is demonstrated within this family:
          substituting the corresponding cysteine of the rat ALDH1L1 ALDH domain (Cys707)
          abolishes the dehydrogenase reaction while leaving the independent hydrolase
          activity and cofactor binding intact.
        supported_by:
          - reference_id: PMID:7822273
            supporting_text: 10-FTHFDH with alanine substituted for cysteine at position
              707 had no dehydrogenase activity, while hydrolase activity and binding of
              NADP+ were unchanged.
    positive_controls:
      - id: UniProtKB:P05091
        label: ALDH2
        organism: Homo sapiens
        control_position: 319
        control_residue: C
      - id: UniProtKB:P28037
        label: Aldh1l1
        organism: Rattus norvegicus
        gene_review: genes/rat/Aldh1l1/Aldh1l1-ai-review.yaml
        control_position: 707
        control_residue: C
      - id: UniProtKB:O75891
        label: ALDH1L1
        organism: Homo sapiens
        control_position: 707
        control_residue: C
      - id: UniProtKB:Q3SY69
        label: ALDH1L2
        organism: Homo sapiens
        control_position: 728
        control_residue: C
    negative_controls:
      - id: UniProtKB:Q8IZ83
        label: ALDH16A1
        organism: Homo sapiens

term_assessments:
  - assessed_term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
    scope: UNRESOLVED
    scope_reason: >-
      Sound where PAINT scopes it (the PTN000192666 clade minus the ALDH1L
      branch flagged for pruning), but not safe family-wide and not
      expressible with the available scoping axes. Not FAMILY_WIDE: the family
      also holds NADP(+)-preferring members -- the ALDH1L/FDH clade (SF120,
      SF131), whose intact ALDH domain is strictly NADP+-dependent and whose
      in-repo rat Aldh1l1 gene review MODIFYs this exact term to GO:0033721,
      and the subfamily officially named "SUCCINATE-SEMIALDEHYDE DEHYDROGENASE
      [NADP(+)] 2-RELATED" -- plus CoA-acylating EutE-type enzymes whose
      chemistry the term does not describe, and the degenerate ALDH16A1. Not
      RESIDUE_DETERMINED: retention of the catalytic cysteine is necessary but
      does not determine NAD+ versus NADP+ cofactor specificity, so a residue
      site alone would over-grant the NAD+-specific term. Not SUBFAMILY_ONLY:
      the family has ~47 subfamilies, many genuinely NAD+-dependent (ALDH2,
      ALDH1A1, ALDH1B1, ALDH9A1, yeast and bacterial members), and
      enumerating every safe subfamily is beyond this review's scope. The
      practical guidance is per-node, as PAINT already does it: inherit from
      PTN000192666 (with the ALDH1L branch pruned), and treat as a non-core
      generic parent for substrate-specialized members such as the ALDH1A
      branch.
    supported_by:
      - reference_id: PMID:7822273
        supporting_text: The enzyme, 10-formyltetrahydrofolate dehydrogenase (10-FTHFDH)
          (EC 1.5.1.6) catalyzes both the NADP(+)-dependent oxidation of
          10-formyltetrahydrofolate to tetrahydrofolate and CO2 and the NADP(+)-independent
          hydrolysis of 10-formyltetrahydrofolate to tetrahydrofolate and formate.
      - reference_id: PMID:1848231
        supporting_text: Intact 10-formyltetrahydrofolate dehydrogenase exhibits
          NADP-dependent aldehyde dehydrogenase activity.

  - assessed_term:
      id: GO:0006081
      label: aldehyde metabolic process
    scope: RESIDUE_DETERMINED
    determined_by_site: catalytic_cys
    scope_reason: >-
      Generic aldehyde metabolism is the family's common denominator at the
      process level and, unlike the NAD+-specific activity term, does not
      depend on cofactor or substrate identity -- an NADP+-preferring or
      acylating member still metabolizes aldehydes. What does decide
      applicability is whether a member retains the catalytic machinery at
      all: the one documented exception in the family is ALDH16A1, whose
      active-site cysteine and glutamate are not conserved per its UniProt
      CAUTION and whose activity is "unsure", so members failing the
      catalytic_cys site should not inherit even this generic process term.
      For the XENTR aldh1a2 target the site is retained (Cys313), consistent
      with its KEEP_AS_NON_CORE of the generic term and a separate specific
      proposal (GO:0002138).

  - assessed_term:
      id: GO:0001758
      label: retinal dehydrogenase (NAD+) activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Retinaldehyde specificity belongs to the ALDH1A/RALDH branch only; the
      family's other branches (ALDH2, ALDH9A1, ALDH1L1, bacterial and fungal
      members) are not retinaldehyde dehydrogenases, which is precisely why the
      PAINT nodes above carry only generic terms. The subfamily grants rest on
      two different evidential bases, stated explicitly: SF102 and SF140 are
      anchored by locally indexed members (human ALDH1A2 O94788 and human
      ALDH1A1 P00352, both established retinaldehyde dehydrogenases); SF209
      and SF303 are granted on PANTHER's official subfamily names, which
      directly name the established retinaldehyde dehydrogenase ALDH1A3/RALDH3
      and a second RETINAL DEHYDROGENASE 2 grouping, without a locally
      verifiable member list. The Xenopus tropicalis aldh1a2 target carries this term as
      its accepted core function but has no subfamily cross-reference, so it
      cannot be machine-placed inside the allowed set; its support is direct
      (EC 1.2.1.36 mapping plus orthology to characterized RALDH2 enzymes),
      not subfamily membership.
    applicable_subfamilies:
      - id: PANTHER:PTHR11699:SF102
        label: RETINAL DEHYDROGENASE 2
      - id: PANTHER:PTHR11699:SF209
        label: RETINALDEHYDE DEHYDROGENASE 3
      - id: PANTHER:PTHR11699:SF140
        label: ALDEHYDE DEHYDROGENASE 1A1
      - id: PANTHER:PTHR11699:SF303
        label: RETINAL DEHYDROGENASE 2

