  assessment: TOO_DEEP
  assessment_reason: 'PTN008524390 is the ancestral node of the whole ALDH1L/FDH clade, recorded at Eukaryota:
    the same node carries the GO:0016155 (formyltetrahydrofolate dehydrogenase activity) and GO:0009258
    IBDs, whose seeds include both cytosolic ALDH1L1 members (human O75891, mouse, rat, zebrafish) and
    mitochondrial ALDH1L2 members (Q3SY69), so both paralog branches descend from it. The mitochondrion
    IBD at this node, however, is seeded solely by human ALDH1L2 (Q3SY69). Mitochondrial targeting is
    an ALDH1L2-lineage innovation -- Q3SY69 carries an N-terminal transit peptide (UniProt transit peptide
    1-19) that ALDH1L1 lacks, and ALDH1L1 orthologs are cytosolic (UniProt names rat P28037 and human
    O75891 "Cytosolic 10-formyltetrahydrofolate dehydrogenase"; rat cytosol is directly supported, PMID:1848231).
    Placing the compartment at the eukaryote-wide FDH ancestor therefore makes the clade that never had
    it -- the cytosolic ALDH1L1 branch (SF120) -- inherit the term. The IBD should sit on the ALDH1L2
    (SF131) clade instead. The slice''s other two GO:0005739 IBDs (PTN000916385, a fungal branch seeded
    from SGD; PTN008977985, seeded by mitochondrial classical ALDHs including P05091) sit on other branches
    and are not disputed. This concurs with the rat Aldh1l1 gene review''s REMOVE of its mitochondrion
    IBA.'
