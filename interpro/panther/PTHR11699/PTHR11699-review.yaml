- subfamily_id: PANTHER:PTHR11699:SF120
  label: CYTOSOLIC 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE
  description: The cytosolic ALDH1L1/FDH branch. Multidomain fusion enzymes (folate-binding hydrolase
    domain + 4'-phosphopantetheine carrier + C-terminal ALDH domain) that oxidize 10-formyl-THF to THF
    and CO2. The ALDH domain retains the catalytic Cys/Glu machinery (rat/human Cys707, Glu673) but is
    strictly NADP+-dependent.
  representative_members:
  - id: UniProtKB:O75891
    label: ALDH1L1
    organism: Homo sapiens
  - id: UniProtKB:P28037
    label: Aldh1l1
    organism: Rattus norvegicus
    gene_review: genes/rat/Aldh1l1/Aldh1l1-ai-review.yaml
  diverged_from_family: true
  divergence_description: 'Diverged in cofactor and substrate, not in catalytic competence: the ALDH domain
    acts on an enzyme-bound formyl-4''-phosphopantetheine intermediate rather than a free aldehyde, and
    uses NADP+ rather than NAD+ (C707A abolishes the dehydrogenase step while NADP+ binding is retained,
    PMID:7822273). NAD+ cofactor terms (GO:0004029) must not be inherited here; the correct activity term
    is GO:0033721. Members are cytosolic -- the mitochondrion term belongs only to the ALDH1L2 sister
    branch.'
- subfamily_id: PANTHER:PTHR11699:SF131
  label: MITOCHONDRIAL 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE
  description: The mitochondrial ALDH1L2 branch, the vertebrate sister of ALDH1L1. Same fusion architecture
    and NADP+-dependent FDH chemistry, but targeted to mitochondria by an N-terminal transit peptide (UniProt
    Q3SY69 transit peptide 1-19) acquired in this lineage. ALDH1L2 is the sole seed of the disputed mitochondrion
    IBD at the ALDH1L clade node.
  representative_members:
  - id: UniProtKB:Q3SY69
    label: ALDH1L2
    organism: Homo sapiens
  diverged_from_family: true
  divergence_description: As SF120 (NADP+-dependent FDH fusion enzyme, so NAD+ cofactor terms must not
    descend here either), plus a lineage-specific gain of mitochondrial targeting that its cytosolic ALDH1L1
    sister branch never had.
