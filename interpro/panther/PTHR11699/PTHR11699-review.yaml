  - id: UniProtKB:P00352
    label: ALDH1A1
    organism: Homo sapiens
    control_position: 269
    control_residue: E
- site_id: aldh_nucleophile
  label: ALDH catalytic Cys nucleophile / Glu general base
  description: 'The invariant catalytic dyad of the ALDH fold: a cysteine nucleophile that forms the covalent
    thiohemiacetal/thioacyl intermediate with the aldehyde carbon, and a glutamate general base that activates
    the hydrolytic water. Recorded here to make the key negative point of this review machine-checkable:
    the ALDH1L/FDH clade retains this site completely, so its GO:0004029 problem is cofactor scope (NADP+
    vs NAD+), not loss of aldehyde dehydrogenase chemistry. The rat Aldh1l1 gene review''s RETAINED residue
    claim (ALDH2 Cys319 -> rat Cys707) is the gene-level citation of this site. The negative control,
    human ALDH16A1 (PTHR11699:SF211), is the family''s documented pseudo-enzyme: UniProt cautions that
    "The active site cysteine and glutamate residues are not conserved in this protein". Its active-site
    segment is diverged beyond confident single-column mapping -- pairwise alignment against ALDH2 places
    Cys319 in a gap and the sequence retains neither the NQGQC catalytic-cysteine motif nor the ELGGK
    general-base motif -- so no own-numbering control position is asserted for it (an absent position
    says "not established"; an aligned guess would say something false). This site describes the same
    dyad as catalytic_cys/general_base_glu from an ALDH2 anchor; both anchors are kept because different
    gene reviews cite them.'
  anchor:
    id: UniProtKB:P05091
    label: Aldehyde dehydrogenase, mitochondrial
    organism: Homo sapiens
  anchor_sequence_version: 2
  site_source: UNIPROT_FEATURE
  residues:
  - position: 319
    expected:
    - C
    role: catalytic nucleophile
  - position: 285
    expected:
    - E
    role: general base (proton acceptor)
  required_for:
  - term:
      id: GO:0004030
      label: aldehyde dehydrogenase [NAD(P)+] activity
    strength: REQUIRED
    rationale: 'ALDH catalysis proceeds through a covalent acyl-enzyme intermediate on the catalytic cysteine;
      without the thiol there is no nucleophilic attack on the aldehyde carbon and no hydride transfer
      to the nicotinamide cofactor, whichever cofactor the branch uses. The dependency is demonstrated
      within this family: substituting the corresponding cysteine of the rat ALDH1L1 ALDH domain (Cys707)
      abolishes the dehydrogenase reaction while leaving the independent hydrolase activity and cofactor
      binding intact.'
    supported_by:
    - reference_id: PMID:7822273
      supporting_text: 10-FTHFDH with alanine substituted for cysteine at position 707 had no dehydrogenase
        activity, while hydrolase activity and binding of NADP+ were unchanged.
  positive_controls:
  - id: UniProtKB:P05091
    label: ALDH2
    organism: Homo sapiens
    control_position: 319
    control_residue: C
  - id: UniProtKB:P28037
    label: Aldh1l1
