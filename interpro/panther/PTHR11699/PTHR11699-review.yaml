family_id: PANTHER:PTHR11699
family_name: ALDEHYDE DEHYDROGENASE-RELATED
preferred_name: Aldehyde dehydrogenase (ALDH) family
summary: >-
  The aldehyde dehydrogenases share a conserved three-domain architecture -- a
  Rossmann-fold NAD(P)+-binding domain, a catalytic domain, and a smaller
  oligomerization domain -- and oxidize aldehydes to their carboxylic acids
  through a covalent thio(hemi)acetal intermediate formed at a catalytic
  cysteine nucleophile, with a conserved glutamate acting as general base. The
  family is old and broad: the deepest cached PAINT node for NAD+-dependent
  aldehyde dehydrogenase activity is seeded by bacterial, fungal, plant and
  animal members, and 47 PANTHER subfamilies span substrate specialists as
  different as retinaldehyde dehydrogenases (the ALDH1A/RALDH branch, source of
  embryonic retinoic acid), mitochondrial acetaldehyde-preferring ALDH2,
  betaine-aldehyde and succinate-semialdehyde dehydrogenases, acylating
  acetaldehyde dehydrogenases (EutE), 10-formyltetrahydrofolate dehydrogenase
  fusion proteins (ALDH1L), and at least one member with degenerate active-site
  residues (ALDH16A1). Generic aldehyde-oxidation chemistry is close to
  family-wide; substrate identity, cofactor preference (NAD+ vs NADP+),
  localization and pathway context are not, and are the properties that
  distinguish subfamilies.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The shared property is the catalytic fold and the Cys-nucleophile/Glu-base
  mechanism, not any one substrate, cofactor or pathway. Divergent groups
  include: NAD+-dependent broad-substrate and retinaldehyde-specific enzymes
  (ALDH1A/ALDH2 branches); NADP(+)-preferring members (the subfamily officially
  named "SUCCINATE-SEMIALDEHYDE DEHYDROGENASE [NADP(+)] 2-RELATED"; the ALDH1L1
  10-formyltetrahydrofolate dehydrogenase, whose in-repo rat gene review
  MODIFYs the NAD+-specific term GO:0004029 for exactly this reason); acylating
  acetaldehyde dehydrogenases ("ACETALDEHYDE DEHYDROGENASE (ACETYLATING) EUTE",
  a CoA-acylating rather than acid-forming chemistry); and ALDH16A1, whose
  UniProt record (Q8IZ83) states "The active site cysteine and glutamate
  residues are not conserved in this protein. Its activity is therefore
  unsure." No specific activity term is safe at family level, which matches the
  absence of family-wide InterPro2GO mappings and the legacy free-text review's
  conclusion that annotation belongs on subfamily/node anchors.
reference_protein:
  id: UniProtKB:O94788
  label: Retinal dehydrogenase 2
  gene_symbol: ALDH1A2
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR11699:SF102
    label: RETINAL DEHYDROGENASE 2
    description: >-
      The ALDH1A2/RALDH2 branch of the ALDH1A (retinaldehyde dehydrogenase)
      group: cytosolic NAD+-dependent enzymes that oxidize all-trans
      retinaldehyde to retinoic acid and supply the embryonic retinoid signal.
      Human ALDH1A2 (O94788) is recorded in this subfamily by the local
      panther-members index. The Xenopus tropicalis target of the companion
      gene review (Q28CC8, genes/XENTR/aldh1a2) is the one-to-one ortholog of
      the members of this branch, but its own UniProt record carries only a
      family-level PANTHER cross-reference, so its subfamily assignment is
      deliberately not asserted here. Note PANTHER also has a second subfamily
      with the identical official name (SF303); only SF102 is anchored by an
      indexed member locally.
    representative_members:
      - id: UniProtKB:O94788
        label: ALDH1A2
        organism: Homo sapiens
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR11699:SF209
    label: RETINALDEHYDE DEHYDROGENASE 3
    description: >-
      Named by PANTHER for ALDH1A3/RALDH3, an established retinaldehyde
      dehydrogenase (human P47895) that acts alongside ALDH1A2 in embryonic
      retinoic acid production. No member-to-subfamily link for this SF is
      recorded in UniProt cross-references or the local member index, so no
      representative members are asserted; the functional characterization
      rests on the official subfamily name and the biochemistry of its
      eponymous member.
  - subfamily_id: PANTHER:PTHR11699:SF140
    label: ALDEHYDE DEHYDROGENASE 1A1
    description: >-
      Named by PANTHER for ALDH1A1/RALDH1 (human P00352), a cytosolic
      NAD+-dependent enzyme with both broad aldehyde and retinaldehyde
      dehydrogenase activity. As for SF209, no member-to-subfamily link is
      locally indexed, so no representative members are asserted.

