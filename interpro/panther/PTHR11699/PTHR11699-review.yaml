  label: RETINAL DEHYDROGENASE 2
  description: 'The ALDH1A2/RALDH2 branch of the ALDH1A (retinaldehyde dehydrogenase) group: cytosolic
    NAD+-dependent enzymes that oxidize all-trans retinaldehyde to retinoic acid and supply the embryonic
    retinoid signal. Human ALDH1A2 (O94788) is recorded in this subfamily by the local panther-members
