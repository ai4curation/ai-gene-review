residue_sites:
  - site_id: catalytic_cys
    label: Catalytic cysteine nucleophile
    description: >-
      The active-site cysteine that attacks the aldehyde carbonyl to form the
      covalent thiohemiacetal, then thioacyl, intermediate of the ALDH
      mechanism. In the anchor (human ALDH1A2) it is Cys320, the second
      cysteine of the near-invariant FNQGQC[C] block; UniProt annotates the
      homologous position as ACT_SITE Nucleophile in ALDH2 (P05091 Cys319) and
      ALDH1A1 (P00352 Cys303). The Xenopus tropicalis aldh1a2 target carries
      the same block with the corresponding cysteine at position 313. The one
      documented family member with a degenerate active site, ALDH16A1
      (Q8IZ83; UniProt CAUTION "The active site cysteine and glutamate
      residues are not conserved in this protein"), is too diverged for a
      confident position-level mapping (the region around the catalytic
      cysteine does not align cleanly), so it is recorded here in prose rather
      than as a machine-checkable negative control.
    anchor:
      id: UniProtKB:O94788
      label: ALDH1A2
      organism: Homo sapiens
    anchor_sequence_version: 3
    site_source: UNIPROT_FEATURE
    residues:
      - position: 320
        expected: [C]
        role: nucleophile
    required_for:
      - term:
          id: GO:0004029
          label: aldehyde dehydrogenase (NAD+) activity
        strength: CONTRIBUTES
        rationale: >-
          Catalysis runs through a covalent adduct at this cysteine's thiolate,
          so mechanistically its loss abolishes aldehyde oxidation and the
          dependency is absolute. It is nevertheless recorded as CONTRIBUTES
          rather than REQUIRED because REQUIRED licenses a validator to
          contradict gene reviews and therefore demands a verified negative
          control from within the family, and the only documented
          catalytically degenerate member (ALDH16A1) cannot be cleanly aligned
          at this position, leaving no machine-checkable example of loss.
          Promote to REQUIRED if and when a mappable negative control is
          established.
      - term:
          id: GO:0006081
          label: aldehyde metabolic process
        strength: CONTRIBUTES
        rationale: >-
          Within this family, participation in aldehyde metabolism is direct
          enzymatic aldehyde oxidation through this nucleophile, whatever the
          substrate or cofactor, so retention of the cysteine is what carries
          the process term to a member. Kept at CONTRIBUTES for the same
          negative-control reason as the activity term.
    positive_controls:
      - id: UniProtKB:O94788
        label: ALDH1A2
        organism: Homo sapiens
        control_position: 320
        control_residue: C
      - id: UniProtKB:P05091
        label: ALDH2
        organism: Homo sapiens
        control_position: 319
        control_residue: C
      - id: UniProtKB:P00352
        label: ALDH1A1
        organism: Homo sapiens
        control_position: 303
        control_residue: C
  - site_id: general_base_glu
    label: General-base glutamate
    description: >-
      The conserved glutamate that acts as general base, activating the
      catalytic cysteine/the hydrolytic water during deacylation. It sits in
      the invariant LKRVTL[E]LGGKSP block: Glu286 in the anchor (human
      ALDH1A2), Glu285 in ALDH2 (P05091) and Glu269 in ALDH1A1 (P00352), each
      carried as an ACT_SITE "Proton acceptor" feature on its own UniProt
      record. The Xenopus tropicalis aldh1a2 target has the identical block
      with Glu279, which is the single ACT_SITE feature on its own record
      (PROSITE-ProRule PRU10007) -- note the target's earlier gene review
      mislabelled that feature as a cysteine, an error corrected in the
      2026-08-31 pass.
    anchor:
      id: UniProtKB:O94788
      label: ALDH1A2
      organism: Homo sapiens
    anchor_sequence_version: 3
    site_source: UNIPROT_FEATURE
    residues:
      - position: 286
        expected: [E]
        role: general base (proton acceptor)
    required_for:
      - term:
          id: GO:0004029
          label: aldehyde dehydrogenase (NAD+) activity
        strength: CONTRIBUTES
        rationale: >-
          The general base is part of the core catalytic machinery, but the
          discriminating residue in this family is the cysteine nucleophile,
          and (as for catalytic_cys) no machine-checkable negative control
          exists, so the dependency is recorded as CONTRIBUTES.
    positive_controls:
      - id: UniProtKB:O94788
        label: ALDH1A2
        organism: Homo sapiens
        control_position: 286
        control_residue: E
      - id: UniProtKB:P05091
        label: ALDH2
        organism: Homo sapiens
        control_position: 285
        control_residue: E
      - id: UniProtKB:P00352
        label: ALDH1A1
        organism: Homo sapiens
        control_position: 269
        control_residue: E

term_assessments:
  - assessed_term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
    scope: UNRESOLVED
    scope_reason: >-
      Sound where PAINT scopes it (the PTN000192666 clade, whose seeds are all
      NAD+-dependent aldehyde dehydrogenases) but not safe family-wide, and not
      expressible with the available scoping axes. Not FAMILY_WIDE: the family
      also holds NADP(+)-preferring members (the "SUCCINATE-SEMIALDEHYDE
      DEHYDROGENASE [NADP(+)] 2-RELATED" subfamily; rat Aldh1l1, whose in-repo
      gene review MODIFYs this exact term), CoA-acylating EutE-type enzymes
      whose chemistry the term does not describe, and the degenerate ALDH16A1.
      Not RESIDUE_DETERMINED: retention of catalytic_cys is necessary but does
      not determine NAD+ versus NADP+ cofactor specificity, so the residue
      site alone would over-grant the NAD+-specific term. Not SUBFAMILY_ONLY:
      the family has 47 subfamilies, almost none of which have locally
      verifiable member lists, so enumerating the safe ones would be
      guesswork. The practical guidance is per-node, as PAINT already does it:
      inherit from PTN000192666, treat as non-core generic parent for
      substrate-specialized members such as the ALDH1A branch.
  - assessed_term:
      id: GO:0006081
      label: aldehyde metabolic process
    scope: RESIDUE_DETERMINED
    determined_by_site: catalytic_cys
    scope_reason: >-
      Generic aldehyde metabolism is the family's common denominator at the
      process level and, unlike the NAD+-specific activity term, does not
      depend on cofactor or substrate identity -- an NADP+-preferring or
      acylating member still metabolizes aldehydes. What does decide
      applicability is whether a member retains the catalytic machinery at
      all: the one documented exception in the family is ALDH16A1, whose
      active-site cysteine and glutamate are not conserved per its UniProt
      CAUTION and whose activity is "unsure", so members failing the
      catalytic_cys site should not inherit even this generic process term.
      For the XENTR aldh1a2 target the site is retained (Cys313), consistent
      with its KEEP_AS_NON_CORE of the generic term and a separate specific
      proposal (GO:0002138).
  - assessed_term:
      id: GO:0001758
      label: retinal dehydrogenase (NAD+) activity
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      Retinaldehyde specificity belongs to the ALDH1A/RALDH branch only; the
      family's other branches (ALDH2, ALDH9A1, ALDH1L1, bacterial and fungal
      members) are not retinaldehyde dehydrogenases, which is precisely why the
      PAINT nodes above carry only generic terms. The subfamily grants rest on
      two different evidential bases, stated explicitly: SF102 is anchored by a
      locally indexed member (human ALDH1A2, O94788, an established
      retinaldehyde dehydrogenase); SF209, SF140 and SF303 are granted on
      PANTHER's official subfamily names, which directly name the established
      retinaldehyde dehydrogenases ALDH1A3/RALDH3 and ALDH1A1/RALDH1 and a
      second RETINAL DEHYDROGENASE 2 grouping, without a locally verifiable
      member list. The Xenopus tropicalis aldh1a2 target carries this term as
      its accepted core function but has no subfamily cross-reference, so it
      cannot be machine-placed inside the allowed set; its support is direct
      (EC 1.2.1.36 mapping plus orthology to characterized RALDH2 enzymes),
      not subfamily membership.
    applicable_subfamilies:
      - id: PANTHER:PTHR11699:SF102
        label: RETINAL DEHYDROGENASE 2
      - id: PANTHER:PTHR11699:SF209
        label: RETINALDEHYDE DEHYDROGENASE 3
      - id: PANTHER:PTHR11699:SF140
        label: ALDEHYDE DEHYDROGENASE 1A1
      - id: PANTHER:PTHR11699:SF303
        label: RETINAL DEHYDROGENASE 2

review_status: DRAFT
reviewed_by: AI-assisted family curation (second-pass IBA review for XENTR aldh1a2)
review_date: "2026-08-31"
notes: >-
  Scope: written to adjudicate the two IBA rows on genes/XENTR/aldh1a2
  (GO:0004029 MF and the GO:0006081 BP whose node now asserts GO:0046185), so
  node_assessments cover only the two backing nodes. Other cached PAINT rows
  (semialdehyde/betaine/benzaldehyde activities, mitochondrion/cytosol CC
  nodes, and a second GO:0004029 IBD at PTN000192422 seeded by human ALDH7A1
  P49419 and Arabidopsis AT5G62530, i.e. the ALDH7 branch, which does not back
  the target's IBA) were read but deliberately not assessed.

  Provenance of residue positions: all anchor and control positions were read
  from the live UniProt feature tables of O94788 (SV3), P05091 (SV2) and
  P00352 (SV2) on 2026-08-31 and verified against the fetched sequences; the
  Glu block LKRVTL[E]LGGKSP and Cys block xNQGQC[C] are identical across all
  three anchors and the XENTR target (Q28CC8 SV1: Glu279, Cys313), and ad hoc
  pairwise alignments of each anchor to the target give the same
  correspondences. The target's own record carries only the Glu ACT_SITE
  (position 279, PROSITE-ProRule PRU10007); its previous gene review called
  that feature a cysteine, which was wrong and is corrected in the companion
  gene-review update.

  Known gaps, on purpose: Q28CC8 and the anchor/control proteins other than
  O94788/P23883 are not yet in interpro/panther/panther-members.tsv, so
  membership checks surface UNRESOLVED warnings; `just refresh-panther-members`
  was deliberately not run (shared file, orchestrator runs it once). ALDH16A1
  is documented in prose but not as a negative control because its active-site
  region does not align confidently, and consequently both required_for
  strengths are held at CONTRIBUTES rather than REQUIRED. The legacy free-text
  PTHR11699-review.md (Falcon integration, 2026-06-28) concluded that no
  family-wide GO mapping is safe; this structured review agrees and adds the
  node- and residue-level machinery.
