- assessed_term:
    id: GO:0140088
    label: acetaldehyde dehydrogenase (NADP+) activity
  scope: UNRESOLVED
  scope_reason: 'Sound for the yeast PDH-bypass aldehyde dehydrogenases -- cytosolic ALD6 (essentially
    NADP+-specific) and mitochondrial ALD4 and ALD5, whose gene reviews accept GO:0140088 on EXP evidence
    -- but not expressible with the available subfamily axis. The PANTHER 19.0 member index places ALD6
    (P54115) and ALD4 (P46367) in SF268 and ALD5 (P40047) in SF211; UniProt gives these entries no subfamily.
    SF268 holds only those two yeast enzymes among the reference genomes, but SF211 is heterogeneous:
    besides ALD5 it holds the vertebrate ALDH16A1 orthologs (human ALDH16A1 has lost the catalytic cysteine
    and glutamate) and bacterial aldehyde dehydrogenases that act on other aldehydes, such as E. coli
    PatD and FeaB. Scoping the term to SF211 would assert acetaldehyde NADP+ dehydrogenase activity for
    all of them, so pdh_bypass_acetyl_coa_synthesis selects these steps at family level with the yeast
    enzymes as representative members.'
  supported_by:
  - reference_id: file:genes/yeast/ALD6/ALD6-ai-review.yaml
    supporting_text: It is essentially NADP+-specific
  - reference_id: file:genes/human/ALDH16A1/ALDH16A1-ai-review.yaml
    supporting_text: human ALDH16A1 has lost the catalytic cysteine and glutamate and shows no aldehyde
      oxidation activity
- assessed_term:
    id: GO:0008774
    label: acetaldehyde dehydrogenase (acetylating, NAD+) activity
  scope: UNRESOLVED
  scope_reason: 'CoA-acylating aldehyde oxidation is the diverged reaction of the EutE/PduP branch (SF68),
    and is not a property of the non-acylating classical ALDHs that make up the rest of the family, which
    yield the free carboxylate. Within SF68, Salmonella EutE (P41793) has acetaldehyde-to-acetyl-CoA activity
    on direct assay (PMID:21803884) and E. coli EutE (P77445) is its ortholog, but PANTHER 19.0 (Salmonella
    classification file) also places Salmonella PduP (Q9XDN1) in SF68, and UniProt records PduP''s reaction
    as the CoA-acylation of propanal in 1,2-propanediol degradation. The acetaldehyde-specific term therefore
    cannot be granted to the whole subfamily without asserting it for PduP, whose acetaldehyde activity
    is not reviewed here, and no residue site separating the two substrate preferences is known. The term
    is left per-member: the bacterial_ethanolamine_uptake_catabolism module selects SF68 for membership
    and grounds the activity on the EutE representative''s own gene review.'
  supported_by:
  - reference_id: PMID:21803884
    supporting_text: In vitro assays showed that this enzyme had both acetaldehyde dehydrogenase activity
      (68.07 ± 1.63 μmol min(-1) mg(-1)) and the desired acetyl-CoA reductase activity (49.23 ± 2.88 μmol
      min(-1) mg(-1)).
