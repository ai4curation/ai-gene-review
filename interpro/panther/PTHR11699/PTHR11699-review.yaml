family_id: PANTHER:PTHR11699
family_name: ALDEHYDE DEHYDROGENASE-RELATED
preferred_name: Aldehyde dehydrogenase (ALDH) superfamily
summary: >-
  The aldehyde dehydrogenase superfamily shares a conserved three-part architecture -- a
  Rossmann-type NAD(P)+-binding domain, a catalytic domain carrying an invariant cysteine
  nucleophile with a glutamate general base, and an oligomerization domain -- and oxidizes
  aldehydes to their carboxylic acids. Within that shared chemistry the family is highly
  heterogeneous in substrate, cofactor, and compartment: it spans classical NAD+-dependent
  detoxifying enzymes (ALDH2, ALDH1A1, ALDH1B1), semialdehyde dehydrogenases, bacterial and
  fungal branches, and the ALDH1L clade of 10-formyltetrahydrofolate dehydrogenases (FDH).
  The ALDH1L proteins are multidomain fusion enzymes: an N-terminal folate-binding
  hydrolase/formyltransferase-like domain and a 4'-phosphopantetheine carrier domain deliver
  the formyl group of 10-formyl-THF to a C-terminal ALDH domain that oxidizes it to CO2
  using NADP+, not NAD+. Vertebrates carry a compartment-split ALDH1L paralog pair --
  cytosolic ALDH1L1 and mitochondrial ALDH1L2, the latter distinguished by an N-terminal
  mitochondrial transit peptide acquired in its own lineage. Both cofactor specificity and
  subcellular compartment therefore vary between branches, which is why family- or
  deep-node-level propagation of NAD+ cofactor terms or of a compartment term is unsafe
  even though the catalytic fold and the Cys/Glu machinery are conserved.

functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All characterized members share the ALDH fold and the Cys-nucleophile mechanism, but the
  family diverges along three axes that matter for GO propagation: cofactor (classical
  branches such as ALDH2/ALDH1A1 are NAD+-dependent, while the ALDH1L/FDH clade is strictly
  NADP+-dependent), substrate (free aldehydes vs the enzyme-tethered formyl group of
  10-formyl-THF in ALDH1L), and compartment (cytosolic ALDH1L1 vs mitochondrial ALDH1L2 and
  the mitochondrial classical ALDHs). No single specific activity or compartment term is
  safe family-wide.

reference_protein:
  id: UniProtKB:P05091
  label: Aldehyde dehydrogenase, mitochondrial
  gene_symbol: ALDH2
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR11699:SF233
    label: ALDEHYDE DEHYDROGENASE, MITOCHONDRIAL
    description: >-
      Classical mitochondrial NAD+-dependent aldehyde dehydrogenase (ALDH2), the
      best-characterized member of the family and the anchor for the catalytic-site
      numbering used here (Cys319 nucleophile, Glu285 general base).
    representative_members:
      - {id: UniProtKB:P05091, label: ALDH2, organism: Homo sapiens}
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11699:SF120
    label: CYTOSOLIC 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE
    description: >-
      The cytosolic ALDH1L1/FDH branch. Multidomain fusion enzymes (folate-binding
      hydrolase domain + 4'-phosphopantetheine carrier + C-terminal ALDH domain) that
      oxidize 10-formyl-THF to THF and CO2. The ALDH domain retains the catalytic
      Cys/Glu machinery (rat/human Cys707, Glu673) but is strictly NADP+-dependent.
    representative_members:
      - {id: UniProtKB:O75891, label: ALDH1L1, organism: Homo sapiens}
      - {id: UniProtKB:P28037, label: Aldh1l1, organism: Rattus norvegicus,
         gene_review: genes/rat/Aldh1l1/Aldh1l1-ai-review.yaml}
    diverged_from_family: true
    divergence_description: >-
      Diverged in cofactor and substrate, not in catalytic competence: the ALDH domain acts
      on an enzyme-bound formyl-4'-phosphopantetheine intermediate rather than a free
      aldehyde, and uses NADP+ rather than NAD+ (C707A abolishes the dehydrogenase step
      while NADP+ binding is retained, PMID:7822273). NAD+ cofactor terms (GO:0004029) must
      not be inherited here; the correct activity term is GO:0033721. Members are cytosolic
      -- the mitochondrion term belongs only to the ALDH1L2 sister branch.

  - subfamily_id: PANTHER:PTHR11699:SF131
    label: MITOCHONDRIAL 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE
    description: >-
      The mitochondrial ALDH1L2 branch, the vertebrate sister of ALDH1L1. Same fusion
      architecture and NADP+-dependent FDH chemistry, but targeted to mitochondria by an
      N-terminal transit peptide (UniProt Q3SY69 transit peptide 1-19) acquired in this
      lineage. ALDH1L2 is the sole seed of the disputed mitochondrion IBD at the ALDH1L
      clade node.
    representative_members:
      - {id: UniProtKB:Q3SY69, label: ALDH1L2, organism: Homo sapiens}
    diverged_from_family: true
    divergence_description: >-
      As SF120 (NADP+-dependent FDH fusion enzyme, so NAD+ cofactor terms must not descend
      here either), plus a lineage-specific gain of mitochondrial targeting that its
      cytosolic ALDH1L1 sister branch never had.

node_assessments:
  - node_id: PANTHER:PTN000192666
    asserted_term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
    paint_snapshot: "20260828"
    seeds:
      - {id: UniProtKB:P00352, label: ALDH1A1, organism: Homo sapiens}
      - {id: UniProtKB:P05091, label: ALDH2, organism: Homo sapiens}
      - {id: UniProtKB:P30837, label: ALDH1B1, organism: Homo sapiens}
      - {id: UniProtKB:P49189, label: ALDH9A1, organism: Homo sapiens}
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      This is the donor node of rat Aldh1l1's GO:0004029 IBA (the GOA with-list cites
      PANTHER:PTN000192666 directly). The IBD is broadly and soundly seeded for the
      classical branches -- the with-list spans human ALDH1A1/ALDH2/ALDH1B1/ALDH9A1 plus
      mouse, rat, fly, yeast and bacterial members that are genuinely NAD+-dependent -- so
      the node placement itself is defensible. The problem is one identified descendant
      branch: the ALDH1L/FDH clade (rooted at PTN008524390, subfamilies SF120 and SF131)
      diverged in cofactor specificity. Its C-terminal ALDH domain catalyzes an
      NADP(+)-dependent oxidation (PMID:7822273; PMID:1848231; PMID:17302434), and no NAD+
      activity is documented for it, so the NAD+ cofactor term is wrong for every ALDH1L
      member. Crucially this is cofactor divergence, not activity loss: the catalytic
      nucleophile and general base are fully intact in the clade (aldh_nucleophile site --
      Cys707/Glu673 in rat and human ALDH1L1, Cys728/Glu694 in human ALDH1L2, verified
      against the live UniProt sequences), so a pseudo-enzyme reading (REMOVE) would be
      wrong. The fix is an IRD/NOT pruning GO:0004029 at the ALDH1L clade so the
      NADP+-scoped term GO:0033721 (aldehyde dehydrogenase (NADP+) activity) carries the
      activity there instead. This concurs with the rat Aldh1l1 gene review's MODIFY to
      GO:0033721.
    affected_subfamilies:
      - {id: PANTHER:PTHR11699:SF120, label: CYTOSOLIC 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE}
      - {id: PANTHER:PTHR11699:SF131, label: MITOCHONDRIAL 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE}

  - node_id: PANTHER:PTN008524390
    asserted_term:
      id: GO:0005739
      label: mitochondrion
    node_taxon: {id: NCBITaxon:2759, label: Eukaryota}
    paint_snapshot: "20251210"
    seeds:
      - {id: UniProtKB:Q3SY69, label: ALDH1L2, organism: Homo sapiens}
    assessment: TOO_DEEP
    assessment_reason: >-
      PTN008524390 is the ancestral node of the whole ALDH1L/FDH clade, recorded at
      Eukaryota: the same node carries the GO:0016155 (formyltetrahydrofolate dehydrogenase
      activity) and GO:0009258 IBDs, whose seeds include both cytosolic ALDH1L1 members
      (human O75891, mouse, rat, zebrafish) and mitochondrial ALDH1L2 members (Q3SY69), so
      both paralog branches descend from it. The mitochondrion IBD at this node, however,
      is seeded solely by human ALDH1L2 (Q3SY69). Mitochondrial targeting is an
      ALDH1L2-lineage innovation -- Q3SY69 carries an N-terminal transit peptide (UniProt
      transit peptide 1-19) that ALDH1L1 lacks, and ALDH1L1 orthologs are cytosolic
      (UniProt names rat P28037 and human O75891 "Cytosolic 10-formyltetrahydrofolate
      dehydrogenase"; rat cytosol is directly supported, PMID:1848231). Placing the
      compartment at the eukaryote-wide FDH ancestor therefore makes the clade that never
      had it -- the cytosolic ALDH1L1 branch (SF120) -- inherit the term. The IBD should sit
      on the ALDH1L2 (SF131) clade instead. The slice's other two GO:0005739 IBDs
      (PTN000916385, a fungal branch seeded from SGD; PTN008977985, seeded by mitochondrial
      classical ALDHs including P05091) sit on other branches and are not disputed. This
      concurs with the rat Aldh1l1 gene review's REMOVE of its mitochondrion IBA.
    affected_subfamilies:
      - {id: PANTHER:PTHR11699:SF120, label: CYTOSOLIC 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE}

residue_sites:
  - site_id: aldh_nucleophile
    label: ALDH catalytic Cys nucleophile / Glu general base
    description: >-
      The invariant catalytic dyad of the ALDH fold: a cysteine nucleophile that forms the
      covalent thiohemiacetal/thioacyl intermediate with the aldehyde carbon, and a
      glutamate general base that activates the hydrolytic water. Recorded here to make the
      key negative point of this review machine-checkable: the ALDH1L/FDH clade retains
      this site completely, so its GO:0004029 problem is cofactor scope (NADP+ vs NAD+),
      not loss of aldehyde dehydrogenase chemistry. The rat Aldh1l1 gene review's RETAINED
      residue claim (ALDH2 Cys319 -> rat Cys707) is the gene-level citation of this site.
      The negative control, human ALDH16A1 (PTHR11699:SF211), is the family's documented
      pseudo-enzyme: UniProt cautions that "The active site cysteine and glutamate residues
      are not conserved in this protein". Its active-site segment is diverged beyond
      confident single-column mapping -- pairwise alignment against ALDH2 places Cys319 in
      a gap and the sequence retains neither the NQGQC catalytic-cysteine motif nor the
      ELGGK general-base motif -- so no own-numbering control position is asserted for it
      (an absent position says "not established"; an aligned guess would say something
      false).
    anchor:
      id: UniProtKB:P05091
      label: Aldehyde dehydrogenase, mitochondrial
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: UNIPROT_FEATURE
    residues:
      - {position: 319, expected: [C], role: catalytic nucleophile}
      - {position: 285, expected: [E], role: general base (proton acceptor)}
    required_for:
      - term:
          id: GO:0004030
          label: aldehyde dehydrogenase [NAD(P)+] activity
        strength: REQUIRED
        rationale: >-
          ALDH catalysis proceeds through a covalent acyl-enzyme intermediate on the
          catalytic cysteine; without the thiol there is no nucleophilic attack on the
          aldehyde carbon and no hydride transfer to the nicotinamide cofactor, whichever
          cofactor the branch uses. The dependency is demonstrated within this family:
          substituting the corresponding cysteine of the rat ALDH1L1 ALDH domain (Cys707)
          abolishes the dehydrogenase reaction while leaving the independent hydrolase
          activity and cofactor binding intact.
        supported_by:
          - reference_id: PMID:7822273
            supporting_text: 10-FTHFDH with alanine substituted for cysteine at position
              707 had no dehydrogenase activity, while hydrolase activity and binding of
              NADP+ were unchanged.
    positive_controls:
      - id: UniProtKB:P05091
        label: ALDH2
        organism: Homo sapiens
        control_position: 319
        control_residue: C
      - id: UniProtKB:P28037
        label: Aldh1l1
        organism: Rattus norvegicus
        gene_review: genes/rat/Aldh1l1/Aldh1l1-ai-review.yaml
        control_position: 707
        control_residue: C
      - id: UniProtKB:O75891
        label: ALDH1L1
        organism: Homo sapiens
        control_position: 707
        control_residue: C
      - id: UniProtKB:Q3SY69
        label: ALDH1L2
        organism: Homo sapiens
        control_position: 728
        control_residue: C
    negative_controls:
      - id: UniProtKB:Q8IZ83
        label: ALDH16A1
        organism: Homo sapiens

term_assessments:
  - assessed_term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
    scope: UNRESOLVED
    scope_reason: >-
      Family-wide applicability was not adjudicated: the family has ~47 subfamilies and
      many branches (ALDH2, ALDH1A1, ALDH1B1, ALDH9A1, yeast and bacterial members) are
      genuinely NAD+-dependent, and enumerating every safe subfamily is beyond this
      review's scope. What this review does establish is the negative: the term is not
      safe for the ALDH1L/FDH clade (SF120, SF131), whose intact ALDH domain is strictly
      NADP+-dependent -- see node assessment PTN000192666 and the aldh_nucleophile site.
      For those members the correct term is GO:0033721 (aldehyde dehydrogenase (NADP+)
      activity).
    supported_by:
      - reference_id: PMID:7822273
        supporting_text: The enzyme, 10-formyltetrahydrofolate dehydrogenase (10-FTHFDH)
          (EC 1.5.1.6) catalyzes both the NADP(+)-dependent oxidation of
          10-formyltetrahydrofolate to tetrahydrofolate and CO2 and the NADP(+)-independent
          hydrolysis of 10-formyltetrahydrofolate to tetrahydrofolate and formate.
      - reference_id: PMID:1848231
        supporting_text: Intact 10-formyltetrahydrofolate dehydrogenase exhibits
          NADP-dependent aldehyde dehydrogenase activity.

references:
  - id: PMID:7822273
    title: Cysteine 707 is involved in the dehydrogenase activity site of rat 10-formyltetrahydrofolate dehydrogenase
  - id: PMID:1848231
    title: Isolation and characterization of cDNA clones for rat liver 10-formyltetrahydrofolate dehydrogenase
  - id: PMID:17302434
    title: 'Crystal structures of the carboxyl terminal domain of rat 10-formyltetrahydrofolate dehydrogenase: implications for the catalytic mechanism of aldehyde dehydrogenases'

review_status: NEEDS_REVIEW
reviewed_by: AI-assisted family adjudication (paint-slice + UniProt sequence verification)
review_date: "2026-08-31"
notes: >-
  Scope: this review adjudicates only the two PAINT node/term pairs disputed by the rat
  Aldh1l1 gene review; it does not attempt an encyclopedic pass over the family's 20
  cached PAINT rows.

  Stale IBAs: rat Aldh1l1's GOA also carries IBAs to GO:0006081 (aldehyde metabolic
  process, with-list citing PTN000192666) and GO:0006740 (NADPH regeneration, with-list
  citing PTN008524390), but the current cached PAINT slice (rows dated 2017-02 to 2026-08)
  contains no IBD row for either term at any node, so those assertions appear withdrawn or
  re-scoped upstream and there is nothing at family level to adjudicate; the gene review
  already grades them on independent enzymological evidence.

  The slice's second GO:0004029 IBD, at PTN000192422, is not the rat donor (the GOA
  with-list names PTN000192666) and was not adjudicated. Noted for PAINT attention: its
  seed P49419 (human ALDH7A1) is classified in PTHR43521:SF5 in the current member index,
  i.e. no longer a PTHR11699 member, suggesting that node's seeding predates a family
  re-circumscription.

  Provenance: subfamily assignments (P28037/O75891 -> SF120, Q3SY69 -> SF131, P05091 ->
  SF233) were read from the PANTHER geneinfo service, not inferred; family and subfamily
  labels are verbatim from interpro/panther/panther.obo. All residue positions
  (P05091 C319/E285 v2, P28037 C707/E673 v3, O75891 C707/E673 v2, Q3SY69 C728/E694 v2) and
  the Q3SY69 transit peptide (1-19) were verified against the live UniProt REST sequences
  and feature tables, per the IBA_REVIEW counter-lesson.
