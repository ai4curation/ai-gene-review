family_id: PANTHER:PTHR11699
family_name: ALDEHYDE DEHYDROGENASE-RELATED
preferred_name: Aldehyde dehydrogenase (ALDH) superfamily
summary: >-
  The aldehyde dehydrogenases share a conserved three-domain architecture -- a
  Rossmann-fold NAD(P)+-binding domain, a catalytic domain, and a smaller
  oligomerization domain -- and oxidize aldehydes to their carboxylic acids
  through a covalent thio(hemi)acetal intermediate formed at a catalytic
  cysteine nucleophile, with a conserved glutamate acting as general base. The
  family is old and broad: the deepest cached PAINT node for NAD+-dependent
  aldehyde dehydrogenase activity is seeded by bacterial, fungal, plant and
  animal members, and 47 PANTHER subfamilies span substrate specialists as
  different as retinaldehyde dehydrogenases (the ALDH1A/RALDH branch, source of
  embryonic retinoic acid), mitochondrial acetaldehyde-preferring ALDH2,
  betaine-aldehyde and succinate-semialdehyde dehydrogenases, acylating
  acetaldehyde dehydrogenases (EutE), 10-formyltetrahydrofolate dehydrogenase
  fusion proteins (ALDH1L), and at least one member with degenerate active-site
  residues (ALDH16A1). The ALDH1L proteins are multidomain fusion enzymes: an
  N-terminal folate-binding hydrolase/formyltransferase-like domain and a
  4'-phosphopantetheine carrier domain deliver the formyl group of 10-formyl-THF
  to a C-terminal ALDH domain that oxidizes it to CO2 using NADP+, not NAD+;
  vertebrates carry a compartment-split ALDH1L paralog pair -- cytosolic ALDH1L1
  and mitochondrial ALDH1L2, the latter distinguished by an N-terminal
  mitochondrial transit peptide acquired in its own lineage. Generic
  aldehyde-oxidation chemistry is close to family-wide; substrate identity,
  cofactor preference (NAD+ vs NADP+), localization and pathway context are not,
  and are the properties that distinguish subfamilies -- which is why family- or
  deep-node-level propagation of NAD+ cofactor terms or of a compartment term is
  unsafe even though the catalytic fold and the Cys/Glu machinery are conserved.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  All characterized members share the ALDH fold and the
  Cys-nucleophile/Glu-base mechanism, but the family diverges along axes that
  matter for GO propagation: cofactor (classical branches such as
  ALDH2/ALDH1A1 are NAD+-dependent, while the ALDH1L/FDH clade is strictly
  NADP+-dependent and the subfamily officially named "SUCCINATE-SEMIALDEHYDE
  DEHYDROGENASE [NADP(+)] 2-RELATED" prefers NADP+); substrate (free aldehydes
  vs the enzyme-tethered formyl group of 10-formyl-THF in ALDH1L, and
  CoA-acylating rather than acid-forming chemistry in EutE-type members);
  compartment (cytosolic ALDH1L1 vs mitochondrial ALDH1L2 and the
  mitochondrial classical ALDHs); and catalytic competence itself (ALDH16A1,
  whose UniProt record Q8IZ83 states "The active site cysteine and glutamate
  residues are not conserved in this protein. Its activity is therefore
  unsure."). No single specific activity or compartment term is safe
  family-wide, which matches the absence of family-wide InterPro2GO mappings
  and the legacy free-text review's conclusion that annotation belongs on
  subfamily/node anchors.

reference_protein:
  id: UniProtKB:P05091
  label: Aldehyde dehydrogenase, mitochondrial
  gene_symbol: ALDH2
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR11699:SF233
    label: ALDEHYDE DEHYDROGENASE, MITOCHONDRIAL
    description: >-
      Classical mitochondrial NAD+-dependent aldehyde dehydrogenase (ALDH2), the
      best-characterized member of the family and the anchor for the
      catalytic-site numbering used by the aldh_nucleophile site (Cys319
      nucleophile, Glu285 general base).
    representative_members:
      - {id: UniProtKB:P05091, label: ALDH2, organism: Homo sapiens}
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11699:SF102
    label: RETINAL DEHYDROGENASE 2
    description: >-
      The ALDH1A2/RALDH2 branch of the ALDH1A (retinaldehyde dehydrogenase)
      group: cytosolic NAD+-dependent enzymes that oxidize all-trans
      retinaldehyde to retinoic acid and supply the embryonic retinoid signal.
      Human ALDH1A2 (O94788) is recorded in this subfamily by the local
      panther-members index. The Xenopus tropicalis target of the companion
      gene review (Q28CC8, genes/XENTR/aldh1a2) is the one-to-one ortholog of
      the members of this branch, but its own UniProt record carries only a
      family-level PANTHER cross-reference, so its subfamily assignment is
      deliberately not asserted here. Note PANTHER also has a second subfamily
      with the identical official name (SF303); only SF102 is anchored by an
      indexed member locally.
    representative_members:
      - id: UniProtKB:O94788
        label: ALDH1A2
        organism: Homo sapiens
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11699:SF209
    label: RETINALDEHYDE DEHYDROGENASE 3
    description: >-
      Named by PANTHER for ALDH1A3/RALDH3, an established retinaldehyde
      dehydrogenase (human P47895) that acts alongside ALDH1A2 in embryonic
      retinoic acid production. No member-to-subfamily link for this SF is
      recorded in UniProt cross-references or the local member index, so no
      representative members are asserted; the functional characterization
      rests on the official subfamily name and the biochemistry of its
      eponymous member.

  - subfamily_id: PANTHER:PTHR11699:SF140
    label: ALDEHYDE DEHYDROGENASE 1A1
    description: >-
      The ALDH1A1/RALDH1 branch: cytosolic NAD+-dependent enzymes with both
      broad aldehyde and retinaldehyde dehydrogenase activity. Human ALDH1A1
      (P00352) is recorded in this subfamily by the local panther-members
      index, so the membership is under the hard representative-member check
      rather than resting on the official subfamily name alone.
    representative_members:
      - id: UniProtKB:P00352
        label: ALDH1A1
        organism: Homo sapiens
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11699:SF120
    label: CYTOSOLIC 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE
    description: >-
      The cytosolic ALDH1L1/FDH branch. Multidomain fusion enzymes (folate-binding
      hydrolase domain + 4'-phosphopantetheine carrier + C-terminal ALDH domain) that
      oxidize 10-formyl-THF to THF and CO2. The ALDH domain retains the catalytic
      Cys/Glu machinery (rat/human Cys707, Glu673) but is strictly NADP+-dependent.
    representative_members:
      - {id: UniProtKB:O75891, label: ALDH1L1, organism: Homo sapiens}
      - {id: UniProtKB:P28037, label: Aldh1l1, organism: Rattus norvegicus,
         gene_review: genes/rat/Aldh1l1/Aldh1l1-ai-review.yaml}
    diverged_from_family: true
    divergence_description: >-
      Diverged in cofactor and substrate, not in catalytic competence: the ALDH domain acts
      on an enzyme-bound formyl-4'-phosphopantetheine intermediate rather than a free
      aldehyde, and uses NADP+ rather than NAD+ (C707A abolishes the dehydrogenase step
      while NADP+ binding is retained, PMID:7822273). NAD+ cofactor terms (GO:0004029) must
      not be inherited here; the correct activity term is GO:0033721. Members are cytosolic
      -- the mitochondrion term belongs only to the ALDH1L2 sister branch.

  - subfamily_id: PANTHER:PTHR11699:SF131
    label: MITOCHONDRIAL 10-FORMYLTETRAHYDROFOLATE DEHYDROGENASE
    description: >-
      The mitochondrial ALDH1L2 branch, the vertebrate sister of ALDH1L1. Same fusion
      architecture and NADP+-dependent FDH chemistry, but targeted to mitochondria by an
      N-terminal transit peptide (UniProt Q3SY69 transit peptide 1-19) acquired in this
      lineage. ALDH1L2 is the sole seed of the disputed mitochondrion IBD at the ALDH1L
      clade node.
    representative_members:
      - {id: UniProtKB:Q3SY69, label: ALDH1L2, organism: Homo sapiens}
    diverged_from_family: true
    divergence_description: >-
      As SF120 (NADP+-dependent FDH fusion enzyme, so NAD+ cofactor terms must not descend
      here either), plus a lineage-specific gain of mitochondrial targeting that its
      cytosolic ALDH1L1 sister branch never had.

