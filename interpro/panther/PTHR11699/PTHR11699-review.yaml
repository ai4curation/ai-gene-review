residue_sites:
- site_id: catalytic_cys
  label: Catalytic cysteine nucleophile
  description: The active-site cysteine that attacks the aldehyde carbonyl to form the covalent thiohemiacetal,
    then thioacyl, intermediate of the ALDH mechanism. In the anchor (human ALDH1A2) it is Cys320, the
    second cysteine of the near-invariant FNQGQC[C] block; UniProt annotates the homologous position as
    ACT_SITE Nucleophile in ALDH2 (P05091 Cys319) and ALDH1A1 (P00352 Cys303). The Xenopus tropicalis
    aldh1a2 target carries the same block with the corresponding cysteine at position 313. The one documented
    family member with a degenerate active site, ALDH16A1 (Q8IZ83; UniProt CAUTION "The active site cysteine
    and glutamate residues are not conserved in this protein"), is too diverged for a confident position-level
    mapping (the region around the catalytic cysteine does not align cleanly), so it is recorded here
    in prose rather than as a machine-checkable control with an asserted position. This site and general_base_glu
    describe the same catalytic dyad as aldh_nucleophile, from an ALDH1A2 anchor instead of an ALDH2 anchor;
    both anchors are kept because different gene reviews cite them.
  anchor:
    id: UniProtKB:O94788
    label: ALDH1A2
    organism: Homo sapiens
  anchor_sequence_version: 3
  site_source: UNIPROT_FEATURE
  residues:
  - position: 320
    expected:
    - C
    role: nucleophile
  required_for:
  - term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
    strength: CONTRIBUTES
    rationale: Catalysis runs through a covalent adduct at this cysteine's thiolate, so mechanistically
      its loss abolishes aldehyde oxidation and the dependency is absolute. It is nevertheless recorded
      as CONTRIBUTES rather than REQUIRED because REQUIRED licenses a validator to contradict gene reviews
      and therefore demands a verified negative control from within the family, and the only documented
      catalytically degenerate member (ALDH16A1) cannot be cleanly aligned at this position, leaving no
      machine-checkable example of loss. Promote to REQUIRED if and when a mappable negative control is
      established.
  - term:
      id: GO:0006081
      label: aldehyde metabolic process
    strength: CONTRIBUTES
    rationale: Within this family, participation in aldehyde metabolism is direct enzymatic aldehyde oxidation
      through this nucleophile, whatever the substrate or cofactor, so retention of the cysteine is what
      carries the process term to a member. Kept at CONTRIBUTES for the same negative-control reason as
      the activity term.
  positive_controls:
  - id: UniProtKB:O94788
    label: ALDH1A2
    organism: Homo sapiens
    control_position: 320
    control_residue: C
  - id: UniProtKB:P05091
    label: ALDH2
    organism: Homo sapiens
    control_position: 319
    control_residue: C
  - id: UniProtKB:P00352
    label: ALDH1A1
    organism: Homo sapiens
    control_position: 303
    control_residue: C
- site_id: general_base_glu
  label: General-base glutamate
  description: 'The conserved glutamate that acts as general base, activating the catalytic cysteine/the
    hydrolytic water during deacylation. It sits in the invariant LKRVTL[E]LGGKSP block: Glu286 in the
    anchor (human ALDH1A2), Glu285 in ALDH2 (P05091) and Glu269 in ALDH1A1 (P00352), each carried as an
    ACT_SITE "Proton acceptor" feature on its own UniProt record. The Xenopus tropicalis aldh1a2 target
    has the identical block with Glu279, which is the single ACT_SITE feature on its own record (PROSITE-ProRule
    PRU10007) -- note the target''s earlier gene review mislabelled that feature as a cysteine, an error
    corrected in the 2026-08-31 pass.'
  anchor:
    id: UniProtKB:O94788
    label: ALDH1A2
    organism: Homo sapiens
  anchor_sequence_version: 3
  site_source: UNIPROT_FEATURE
  residues:
  - position: 286
    expected:
    - E
    role: general base (proton acceptor)
  required_for:
  - term:
      id: GO:0004029
      label: aldehyde dehydrogenase (NAD+) activity
    strength: CONTRIBUTES
    rationale: The general base is part of the core catalytic machinery, but the discriminating residue
      in this family is the cysteine nucleophile, and (as for catalytic_cys) no machine-checkable negative
      control exists, so the dependency is recorded as CONTRIBUTES.
  positive_controls:
  - id: UniProtKB:O94788
    label: ALDH1A2
    organism: Homo sapiens
    control_position: 286
    control_residue: E
  - id: UniProtKB:P05091
    label: ALDH2
    organism: Homo sapiens
    control_position: 285
