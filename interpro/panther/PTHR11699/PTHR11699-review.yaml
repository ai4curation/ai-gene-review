notes: 'Merge provenance: two independent reviews of this family were authored in parallel -- one adjudicating
  the two PAINT node/term pairs behind the XENTR aldh1a2 IBAs (branch for PR #2958), one adjudicating
  the two pairs disputed by the rat Aldh1l1 gene review (merged to main in PR #2830). This file is their
  union: subfamilies, node assessments, residue sites and term assessments from both are kept, and the
  one node/term pair both assessed (PTN000192666 / GO:0004029) is merged into a single NEEDS_PRUNING assessment
  that carries both conclusions -- sound inheritance for the ALDH1A branch, IRD-prune for the ALDH1L clade.
  The dyad sites catalytic_cys + general_base_glu (ALDH1A2 anchor) and aldh_nucleophile (ALDH2 anchor)
  describe the same catalytic machinery from different anchors; both are kept because the XENTR aldh1a2
  and rat Aldh1l1 gene reviews cite them respectively.

  Scope: every cached PAINT node/term pair now has a node assessment. The 2026-11-03 completion pass added
  the BetB/ALDH9A1 subfamily (SF228) and assessed the betaine-aldehyde (PTN000193442) and cytosol (PTN002269941)
  nodes behind the E. coli BetB IBAs. It also judged the mitochondrion, aldehyde-detoxification and ALDH1L
  folate nodes against the COMPLETE mouse Aldh2, yeast ALD4/ALD5 and rat Aldh1l1 gene reviews. Nodes it
  could not judge are marked UNRESOLVED, each with the missing evidence named. The reference protein moved
  from human ALDH2 (no gene review) to its mouse ortholog Aldh2 (P47738, SF233, COMPLETE review).

  Stale IBAs: rat Aldh1l1''s GOA also carries IBAs to GO:0006081 (with-list citing PTN000192666) and GO:0006740
  (with-list citing PTN008524390), but the current cached PAINT slice contains no IBD row for either term
  at any node, so those assertions appear withdrawn or re-scoped upstream and there is nothing at family
  level to adjudicate; the gene review already grades them on independent enzymological evidence.

  The slice''s second GO:0004029 IBD, at PTN000192422, backs neither companion gene review (the XENTR
  and rat with-lists name PTN000192421/PTN000192666) and was not adjudicated. Noted for PAINT attention:
  its seed P49419 (human ALDH7A1) is classified in PTHR43521:SF5 in the current member index, i.e. no
  longer a PTHR11699 member, suggesting that node''s seeding predates a family re-circumscription.

  Provenance: subfamily assignments (P28037/O75891 -> SF120, Q3SY69 -> SF131, P05091 -> SF233, O94788
  -> SF102) were read from the PANTHER geneinfo service or the local member index, not inferred; family
  and subfamily labels are verbatim from interpro/panther/panther.obo. All residue positions (P05091 C319/E285
  v2, P28037 C707/E673 v3, O75891 C707/E673 v2, Q3SY69 C728/E694 v2, O94788 C320/E286 v3, P00352 C303/E269
  v2) and the Q3SY69 transit peptide (1-19) were verified against the live UniProt REST sequences and
  feature tables. The XENTR target''s own record carries only the Glu ACT_SITE (position 279, PROSITE-ProRule
  PRU10007); its previous gene review called that feature a cysteine, which was wrong and is corrected
  in the companion gene-review update. ALDH16A1 carries no asserted control position on the ALDH1A2-anchored
  sites (its active-site region does not align confidently there), which is why their required_for strengths
  are held at CONTRIBUTES; the ALDH2-anchored aldh_nucleophile site records it as a position-free negative
  control per the rat-review pass. The legacy free-text PTHR11699-review.md (Falcon integration, 2026-06-28)
  concluded that no family-wide GO mapping is safe; this structured review agrees and adds the node- and
  residue-level machinery.


  2026-11-06 integration of existing ethanolamine PR #5970 with published main retains the BetB/ALDH9A1
  SF228 review and adds the EutE/PduP SF68 substrate/chemistry restriction. Main''s experimentally grounded
  BetB activity and corrected cytosol-node taxon interpretation supersede older statements that the relevant
  gene reviews or descendant evidence were absent. The fungal mitochondrial node is SOUND for the ALD4/ALD5 branch, with ALD6
  explicitly retained as the cytosolic seed exception. The cached primary text supports both ALDH5
  mitochondrial import and ALDH1 (current ALD6) cytosolic fractionation; member-level activity-versus-presence
  distinctions remain in the gene reviews (see the node assessment). Both branches'' references, residue sites and distinct
  term assessments are retained. Current node counts: {''NEEDS_PRUNING'': 1, ''SOUND'': 8, ''TOO_DEEP'':
  1, ''UNRESOLVED'': 10}.'
