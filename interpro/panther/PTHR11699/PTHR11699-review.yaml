      paralogs including the ALDH1A retinaldehyde dehydrogenases, ALDH2,
      ALDH9A1 and ALDH1L1. The only activity shared and defensible across that
      breadth is generic NAD+-dependent aldehyde oxidation, which is exactly
      the term asserted -- a substrate-specific term such as retinal
      dehydrogenase could not sit here, so the placement is deliberately and
      correctly generic. Notably the target's own ortholog group is among the
      seeds (human ALDH1A2 O94788 and mouse Aldh1a2 MGI:107928), i.e. the
      function is experimentally grounded inside the very branch that inherits
      it, which is expected and not circular. The frog target retains the
      complete catalytic machinery (catalytic Cys and general-base Glu; see
      residue sites and the gene review's residue claims), so descent-based
      inheritance holds. The target's GOA row (dated 20250411) cites node
      PANTHER:PTN000192421 in WITH/FROM with essentially this seed list; that
      node id does not appear in the current cached PAINT slice (snapshot
      20260828), consistent with a PANTHER re-release renumbering the node.
      This assessment applies to the current node PTN000192666.
