family_id: PANTHER:PTHR11699
family_name: ALDEHYDE DEHYDROGENASE-RELATED
preferred_name: Aldehyde dehydrogenase (ALDH) superfamily
summary: 'The aldehyde dehydrogenases share a conserved three-domain architecture -- a Rossmann-fold NAD(P)+-binding
  domain, a catalytic domain, and a smaller oligomerization domain -- and oxidize aldehydes to their carboxylic
  acids through a covalent thio(hemi)acetal intermediate formed at a catalytic cysteine nucleophile, with
  a conserved glutamate acting as general base. The family is old and broad: the deepest cached PAINT
  node for NAD+-dependent aldehyde dehydrogenase activity is seeded by bacterial, fungal, plant and animal
  members, and 47 PANTHER subfamilies span substrate specialists as different as retinaldehyde dehydrogenases
  (the ALDH1A/RALDH branch, source of embryonic retinoic acid), mitochondrial acetaldehyde-preferring
  ALDH2, betaine-aldehyde and succinate-semialdehyde dehydrogenases, acylating acetaldehyde dehydrogenases
  (EutE), 10-formyltetrahydrofolate dehydrogenase fusion proteins (ALDH1L), and at least one member with
  degenerate active-site residues (ALDH16A1). The ALDH1L proteins are multidomain fusion enzymes: an N-terminal
  folate-binding hydrolase/formyltransferase-like domain and a 4''-phosphopantetheine carrier domain deliver
  the formyl group of 10-formyl-THF to a C-terminal ALDH domain that oxidizes it to CO2 using NADP+, not
  NAD+; vertebrates carry a compartment-split ALDH1L paralog pair -- cytosolic ALDH1L1 and mitochondrial
  ALDH1L2, the latter distinguished by an N-terminal mitochondrial transit peptide acquired in its own
  lineage. Generic aldehyde-oxidation chemistry is close to family-wide; substrate identity, cofactor
  preference (NAD+ vs NADP+), localization and pathway context are not, and are the properties that distinguish
  subfamilies -- which is why family- or deep-node-level propagation of NAD+ cofactor terms or of a compartment
  term is unsafe even though the catalytic fold and the Cys/Glu machinery are conserved.'
functional_coherence: HETEROGENEOUS
coherence_reason: 'All characterized members share the ALDH fold and the Cys-nucleophile/Glu-base mechanism,
  but the family diverges along axes that matter for GO propagation: cofactor (classical branches such
  as ALDH2/ALDH1A1 are NAD+-dependent, while the ALDH1L/FDH clade is strictly NADP+-dependent and the
  subfamily officially named "SUCCINATE-SEMIALDEHYDE DEHYDROGENASE [NADP(+)] 2-RELATED" prefers NADP+);
  substrate (free aldehydes vs the enzyme-tethered formyl group of 10-formyl-THF in ALDH1L, and CoA-acylating
  rather than acid-forming chemistry in EutE-type members); compartment (cytosolic ALDH1L1 vs mitochondrial
  ALDH1L2 and the mitochondrial classical ALDHs); and catalytic competence itself (ALDH16A1, whose UniProt
  record Q8IZ83 states "The active site cysteine and glutamate residues are not conserved in this protein.
  Its activity is therefore unsure."). No single specific activity or compartment term is safe family-wide,
  which matches the absence of family-wide InterPro2GO mappings and the legacy free-text review''s conclusion
  that annotation belongs on subfamily/node anchors.'
