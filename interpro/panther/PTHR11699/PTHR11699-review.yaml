    organism: Homo sapiens
term_assessments:
- assessed_term:
    id: GO:0004029
    label: aldehyde dehydrogenase (NAD+) activity
  scope: UNRESOLVED
  scope_reason: 'Sound where PAINT scopes it (the PTN000192666 clade minus the ALDH1L branch flagged for
    pruning), but not safe family-wide and not expressible with the available scoping axes. Not FAMILY_WIDE:
    the family also holds NADP(+)-preferring members -- the ALDH1L/FDH clade (SF120, SF131), whose intact
    ALDH domain is strictly NADP+-dependent and whose in-repo rat Aldh1l1 gene review MODIFYs this exact
    term to GO:0033721, and the subfamily officially named "SUCCINATE-SEMIALDEHYDE DEHYDROGENASE [NADP(+)]
    2-RELATED" -- plus CoA-acylating EutE-type enzymes whose chemistry the term does not describe, and
    the degenerate ALDH16A1. Not RESIDUE_DETERMINED: retention of the catalytic cysteine is necessary
    but does not determine NAD+ versus NADP+ cofactor specificity, so a residue site alone would over-grant
    the NAD+-specific term. Not SUBFAMILY_ONLY: the family has ~47 subfamilies, many genuinely NAD+-dependent
    (ALDH2, ALDH1A1, ALDH1B1, ALDH9A1, yeast and bacterial members), and enumerating every safe subfamily
    is beyond this review''s scope. The practical guidance is per-node, as PAINT already does it: inherit
    from PTN000192666 (with the ALDH1L branch pruned), and treat as a non-core generic parent for substrate-specialized
    members such as the ALDH1A branch.'
  supported_by:
  - reference_id: PMID:7822273
    supporting_text: The enzyme, 10-formyltetrahydrofolate dehydrogenase (10-FTHFDH) (EC 1.5.1.6) catalyzes
      both the NADP(+)-dependent oxidation of 10-formyltetrahydrofolate to tetrahydrofolate and CO2 and
      the NADP(+)-independent hydrolysis of 10-formyltetrahydrofolate to tetrahydrofolate and formate.
  - reference_id: PMID:1848231
    supporting_text: Intact 10-formyltetrahydrofolate dehydrogenase exhibits NADP-dependent aldehyde dehydrogenase
      activity.
- assessed_term:
    id: GO:0006081
    label: aldehyde metabolic process
  scope: RESIDUE_DETERMINED
  determined_by_site: catalytic_cys
  scope_reason: 'Generic aldehyde metabolism is the family''s common denominator at the process level
    and, unlike the NAD+-specific activity term, does not depend on cofactor or substrate identity --
    an NADP+-preferring or acylating member still metabolizes aldehydes. What does decide applicability
    is whether a member retains the catalytic machinery at all: the one documented exception in the family
    is ALDH16A1, whose active-site cysteine and glutamate are not conserved per its UniProt CAUTION and
    whose activity is "unsure", so members failing the catalytic_cys site should not inherit even this
    generic process term. For the XENTR aldh1a2 target the site is retained (Cys313), consistent with
    its KEEP_AS_NON_CORE of the generic term and a separate specific proposal (GO:0002138).'
- assessed_term:
    id: GO:0001758
    label: retinal dehydrogenase (NAD+) activity
  scope: SUBFAMILY_ONLY
  scope_reason: 'Retinaldehyde specificity belongs to the ALDH1A/RALDH branch only; the family''s other
    branches (ALDH2, ALDH9A1, ALDH1L1, bacterial and fungal members) are not retinaldehyde dehydrogenases,
    which is precisely why the PAINT nodes above carry only generic terms. The subfamily grants rest on
    two different evidential bases, stated explicitly: SF102, SF140 and SF209 are anchored by locally
    indexed members (human ALDH1A2 O94788, human ALDH1A1 P00352 and human ALDH1A3 P47895, all established
    retinaldehyde dehydrogenases); SF303 is granted on PANTHER''s official subfamily name, a second RETINAL
    DEHYDROGENASE 2 grouping, without a locally verifiable member list. The Xenopus tropicalis aldh1a2
    target carries this term as its accepted core function but has no subfamily cross-reference, so it
    cannot be machine-placed inside the allowed set; its support is direct (EC 1.2.1.36 mapping plus orthology
    to characterized RALDH2 enzymes), not subfamily membership.'
