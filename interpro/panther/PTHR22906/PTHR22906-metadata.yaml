  name:
    name: Complement and asymmetry regulator
    short: Compl_asym_regulator
  description:
  - text: This family of proteins includes regulators of the alternate pathway of
      complement. Members are characterized by their ability to bind and stabilize
      C3- and C5-convertase enzyme complexes, thereby playing a crucial role in the
      innate immune response. They are also involved in inhibiting the degradation
      of the Complement C3 beta chain (C3b) by CFI-CFH. Additionally, some family
      members are implicated in the determination of left/right asymmetry in the nervous
      system, particularly in the polarization and migration of neuroblasts. The family
      is characterized by the presence of TSP type-1 domains, which are known to mediate
      protein multimerization through specific domain-domain interactions.
