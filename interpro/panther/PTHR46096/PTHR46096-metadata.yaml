  name:
    name: Perforin-1 pore-forming
    short: Perforin-1_pore-forming
  description:
  - text: The Perforin-1 family includes pore-forming proteins that are essential
      for granzyme-mediated programmed cell death and immune defense against virus-infected
      or neoplastic cells. Members of the family can insert into target cell membranes
      when bound to calcium, oligomerize, and form large pores. This action facilitates
      the passage and uptake of cytotoxic granzymes into target cells, promoting cytolysis
      and apoptosis. The family is characterized by a MACPF domain responsible for
      pore formation, an EGF-like domain connecting MACPF and C2 domains, and a C2
      domain for calcium-dependent lipid membrane binding. The C2 domain's calcium
      binding induces structural rearrangements, leading to oligomerization and the
      insertion of transmembrane beta-strands into the membrane as amphipathic beta-hairpins.
      These proteins are also involved in delivering cationic cargo proteins and releasing
      mature caspase-7 into the extracellular space.
