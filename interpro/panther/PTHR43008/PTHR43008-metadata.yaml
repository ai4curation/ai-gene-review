  name:
    name: Short-chain Dehydrogenases/Reductases
    short: SDR
  description:
  - text: The Short-chain Dehydrogenases/Reductases (SDR) family comprises enzymes
      that catalyze the NAD(P)+-dependent oxidation-reduction of a wide range of substrates,
      including sugars, alcohols, and aromatic compounds. Members of the SDR family
      are characterized by their ability to act on various substrates, often with
      stereochemical specificity, and are involved in diverse metabolic pathways.
      Functions include the conversion of D-arabinitol to D-ribulose, oxidation of
      D-mannitol, reduction of L-sorbose to D-glucitol, and transformation of naphthalene
      dihydrodiol into 1,2-dihydroxynaphthalene, among others. These enzymes play
      roles in carbohydrate metabolism, detoxification, and biosynthesis of complex
      molecules, contributing to cellular homeostasis and organismal adaptation.
