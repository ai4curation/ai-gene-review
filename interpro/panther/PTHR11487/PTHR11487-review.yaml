family_name: THIOESTERASE
preferred_name: Type II thioesterase (OLAH/TesA) family
summary: >-
  Alpha/beta-hydrolase type II thioesterases that release acyl chains from acyl carrier proteins
  or phosphopantetheinyl arms. Human OLAH releases medium-chain fatty acids from fatty acid synthase
  in mammary gland; bacterial TesA-type enzymes edit polyketide and nonribosomal peptide synthases.
