family_id: PANTHER:PTHR23023
family_name: DIMETHYLANILINE MONOOXYGENASE
preferred_name: FMO-related flavin-dependent oxidative enzymes
summary: FMO-related proteins catalyze diverse NADPH- and FAD-dependent oxidative reactions, including
  nucleophilic heteroatom (N-, S-) oxygenation and specialized-metabolite transformations. The family
  includes deuterostome microsomal flavin-containing monooxygenases (FMO1-FMO5) that oxidize trimethylamine,
  hypotaurine, and xenobiotics at the endoplasmic reticulum membrane, crucifer glucosinolate S-oxygenases
  (FMOGS-OX1-7), fungal thiol-oxidizing enzymes, and specialized halogenating or Baeyer-Villiger enzymes.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory spans mammalian microsomal N-/S-monooxygenases (FMO1-FMO5), plant aliphatic
  glucosinolate S-oxygenases (FMOGS-OX1-7), fungal thiol monooxygenases (yeast FMO1), and uncharacterized
  fungal flavin-dependent oxidoreductases (Neurospora NCU06296). While FAD- and NAD(P)H-dependent monooxygenase
  chemistry (GO:0004497) is conserved across catalytic clades, specific physiological substrates such as
  trimethylamine, hypotaurine, methylthioalkyl glucosinolates, or glutathione are clade- and paralog-specific.
reference_protein: &fmo3_human
  id: UniProtKB:P31513
  gene_symbol: FMO3
  organism: Homo sapiens
  label: Flavin-containing monooxygenase 3
  gene_review: genes/human/FMO3/FMO3-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR23023:SF44
  label: FLAVIN-CONTAINING MONOOXYGENASE 3
  description: Microsomal C-terminally tail-anchored FAD- and NADPH-dependent monooxygenases of the
    deuterostome lineage that catalyze the oxygenation of nucleophilic nitrogen- and sulfur-containing
    endogenous metabolites and xenobiotics at the cytoplasmic face of the endoplasmic reticulum membrane.
    In mammals, FMO3 (SF44) is the principal adult hepatic trimethylamine N-oxygenase, whereas FMO1 is
    the main extrahepatic (renal/intestinal) and fetal hepatic isoform and physiological hypotaurine S-oxygenase.
  supported_by:
  - reference_id: PMID:9536088
    supporting_text: We show here that mutations in the human flavin-containing monooxygenase isoform 3
      gene ( FMO3 ) impair N -oxygenation of xenobiotics and are responsible for the trimethylaminuria
      phenotype.
  - reference_id: PMID:9776311
    supporting_text: Therefore, at physiological pH, human FMO3 is a very specific and efficient TMA
      N-oxygenase, and is likely responsible for the metabolic clearance of TMA in vivo in humans.
  - reference_id: PMID:9344459
    supporting_text: Catalytic activities of mouse and human FMO3 were high toward the substrate methimazole;
      however, in the presence of trimethylamine and thioacetamide, FMO-dependent methimazole oxidation
      by both enzymes was reduced by greater than 85%.
  representative_members:
  - *fmo3_human
  - id: UniProtKB:P97501
    gene_symbol: Fmo3
    organism: Mus musculus
    label: Flavin-containing monooxygenase 3
    gene_review: genes/mouse/Fmo3/Fmo3-ai-review.yaml
- label: Crucifer glucosinolate S-oxygenases (FMOGS-OX clade)
  diverged_from_family: true
  description: Brassicaceae-specific flavin-containing monooxygenases that catalyze the S-oxygenation
    of methylthioalkyl glucosinolates to methylsulfinylalkyl glucosinolates in aliphatic glucosinolate
    biosynthesis, diverging from the xenobiotic and trimethylamine N-oxygenase activities of animal FMOs.
  supported_by:
  - reference_id: PMID:17461789
    supporting_text: We report the identification of an Arabidopsis flavin-monooxygenase (FMO) enzyme,
      FMO(GS-OX1), which catalyzes the conversion of methylthioalkyl GSLs into methylsulfinylalkyl GSLs.
  representative_members:
  - id: UniProtKB:Q9SS04
    gene_symbol: FMOGS-OX1
    organism: Arabidopsis thaliana
    label: Flavin-containing monooxygenase FMO GS-OX1
    gene_review: genes/ARATH/FMOGS-OX1/FMOGS-OX1-ai-review.yaml
- label: Fungal and uncharacterized FMO-related flavin-dependent monooxygenases
  diverged_from_family: true
  description: Fungal and microbial FMO-related flavoproteins spanning yeast thiol monooxygenases and
    uncharacterized filamentous fungal enzymes. Direct yeast yFMO experiments establish thiol oxidation
    at the cytoplasmic face of the ER (PMID:10077572), whereas the Neurospora NCU06296 assignment supports
    only general flavin-dependent monooxygenase activity without an established physiological substrate.
  representative_members:
  - id: UniProtKB:Q7SAD4
    gene_symbol: NCU06296
    organism: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
    label: FAD/NAD(P)-binding domain-containing protein
    gene_review: genes/NEUCR/NCU06296/NCU06296-ai-review.yaml
