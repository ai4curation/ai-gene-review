family_id: PANTHER:PTHR23023
family_name: DIMETHYLANILINE MONOOXYGENASE
preferred_name: FMO-related flavin-dependent oxidative enzymes
summary: FMO-related proteins catalyze diverse oxidative reactions, including heteroatom oxygenation and
  specialized-metabolite transformations. The family includes trimethylamine oxidases, thiol-oxidizing
  enzymes and proteins catalogued as brominating enzymes. Yeast FMO experiments link thiol oxidation to
  endoplasmic-reticulum redox balance, but that substrate and pathway are not a default for all fungal
  homologs.
functional_coherence: HETEROGENEOUS
coherence_reason: The inventory spans thiol monooxygenases, trimethylamine oxidases and specialized-metabolite
  oxidative enzymes. Direct yeast yFMO experiments establish thiol oxidation and a role at the cytoplasmic
  face of the ER (PMID:10077572); those data do not specify the Neurospora NCU06296 substrate. A family-level
  flavin-oxidation comparison is appropriate, while ER-lumen residence, glutathione specificity and mammalian
  trimethylamine metabolism remain separate claims.
subfamilies:
- label: FMO-related flavin-dependent oxidative enzymes
  description: The member inventory spans several substrate classes and specialized reactions. The Neurospora
    NCU06296 assignment supports investigation of flavin-dependent oxidation, while a specific dimethylaniline,
    trimethylamine or glutathione substrate remains unestablished without subfamily and biochemical evidence.
