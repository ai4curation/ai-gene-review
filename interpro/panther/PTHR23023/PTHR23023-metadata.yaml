  name:
    name: Flavin-containing Monooxygenases
    short: FMO
  description:
  - text: The FMO family comprises flavin-containing monooxygenases that play a crucial
      role in the metabolism of a wide array of nitrogen- and sulfur-containing compounds,
      including xenobiotics, drugs, and dietary components. Members of this family
      are involved in the detoxification of trimethylamine (TMA), converting it to
      trimethylamine N-oxide (TMAO), a process influenced by gut microbiota from dietary
      precursors such as choline and carnitine. This reaction is significant for regulating
      TMAO concentration, impacting platelet responsiveness and thrombus formation.
      Additionally, the family includes enzymes that catalyze the conversion of methylthioalkyl
      glucosinolates into methylsulfinylalkyl glucosinolates, and the oxidation of
      various other substrates, indicating a broad substrate specificity. Some members
      are also involved in the biosynthesis of secondary metabolites and pigments,
      as well as the oxidative metabolism of therapeutic drugs and insecticides. The
      family's functions are essential for various physiological processes, including
      correct protein folding, cholesterol biosynthesis, glucose homeostasis, and
      systemic acquired resistance in plants.
