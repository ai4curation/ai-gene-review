  name:
    name: Non-receptor protein-tyrosine kinase
    short: Non-receptor_Tyr_kinase
  description:
  - text: This family of proteins includes non-receptor protein-tyrosine kinases that
      play a crucial role in cell signaling related to migration, adhesion, proliferation,
      and apoptosis. They are involved in the reorganization of the actin cytoskeleton,
      formation and disassembly of focal adhesions, and cell protrusions. These proteins
      are essential for various developmental processes including embryonic development,
      angiogenesis, and nervous system development. They function downstream of integrins,
      growth factor receptors, G-protein coupled receptors, and other signaling molecules,
      forming complexes with SRC family members to phosphorylate additional residues.
      They are involved in multiple signaling pathways, including activation of phosphatidylinositol
      3-kinase, MAP kinase cascades, and modulation of Rho family GTPases. They also
      have roles in the immune response, bone remodeling, and regulation of P53/TP53
      activity.
