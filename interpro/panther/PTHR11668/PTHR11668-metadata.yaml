  description:
  - text: This family of proteins includes serine/threonine-protein phosphatases that
      are involved in a wide range of cellular processes. They associate with regulatory
      proteins to form holoenzymes that dephosphorylate numerous biological targets.
      These enzymes are essential for cell division and participate in the regulation
      of glycogen metabolism, muscle contractility, and protein synthesis. They are
      involved in the control of chromatin structure, cell cycle progression, ionic
      conductances, and long-term synaptic plasticity. Some family members play roles
      in the regulation of circadian rhythms, chromosome cohesion during meiosis,
      and mitosis, as well as in stress responses, such as osmotic stress and endoplasmic
      reticulum stress. They are regulated by various inhibitors and can be inactivated
      by binding to specific proteins or inhibited by toxins.
