family_id: PANTHER:PTHR10623
family_name: MICROTUBULE-ASSOCIATED PROTEIN RP/EB FAMILY MEMBER
summary: RP/EB-related proteins use a calponin-homology region to associate with microtubules. Canonical
  end-binding proteins organize growing microtubule ends and recruit partner proteins, while specialized
  members can connect stable microtubule bundles to other cellular structures. The fly Mst27D example
  links nuclear pores to bundled microtubules during sperm nuclear elongation.
functional_coherence: HETEROGENEOUS
coherence_reason: Mst27D binds microtubules through its N-terminal calponin-homology domain and Nup358
  through its C terminus, linking nuclear pores to microtubule bundles during sperm nuclear elongation
  (PMID:37428798). This specialized linkage does not establish canonical growing-plus-end tracking. Even
  canonical EB paralogs differ in catastrophe suppression, and their effects in vitro differ from those
  in cells (PMID:19255245). Microtubule association is better conserved than a uniform plus-end or dynamic-instability
  function; no exhaustive subfamily boundary for GO:0051010 is established.
