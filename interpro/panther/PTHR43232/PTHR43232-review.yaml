notes: The module molybdenum_cofactor_biosynthesis models the catalytically competent MoaB alternative
  with an ORTHOLOG_OF selector anchored on P. furiosus Q8U3T3, not with this family id, because the
  activity is member-dependent. P. putida KT2440 carries two MoaB-family paralogs, moaB-I (Q88L15) and
  moaB-II (Q88E67), and no separate MogA; which of them, if either, adenylates MPT in vivo is unresolved.
