    label: molybdopterin adenylyltransferase activity
  scope: UNRESOLVED
  scope_reason: Active in P. furiosus MoaB and inactive in E. coli MoaB, both in SF2. No residue site
    that separates active from inactive members has been established, so the activity is neither granted
    family-wide nor restricted to a subfamily. It must be decided per member from direct evidence.
  supported_by:
  - reference_id: PMID:18154309
    supporting_text: Comparison of P. furiosus MoaB to E. coli MoaB and MogA revealed
      that only MogA is able to catalyze MPT adenylylation, whereas E. coli MoaB is
      inactive.
  - reference_id: PMID:18154309
    supporting_text: MoaB reconstituted the function of the homologous Escherichia coli
      MogA protein and catalyzes the adenylylation of MPT in a Mg2+ and ATP-dependent
      way.
