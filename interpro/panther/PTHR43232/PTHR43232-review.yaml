family_id: PANTHER:PTHR43232
family_name: MOLYBDENUM COFACTOR BIOSYNTHESIS PROTEIN B
preferred_name: MoaB MogA-related protein family
summary: PTHR43232 contains MoaB proteins, which have the MoaB/Mog fold of the MogA molybdopterin adenylyltransferases.
  Catalytic competence varies within the family. Pyrococcus furiosus MoaB adenylates molybdopterin and
  can replace E. coli MogA, whereas E. coli MoaB is inactive in the same assay. Many Firmicutes, which
  have no separate MogA, carry a MoaB.
functional_coherence: HETEROGENEOUS
coherence_reason: All frozen entries and tree leaves are in the single subfamily SF2, but the one direct
  comparison shows an active archaeal member and an inactive E. coli member. Subfamily membership therefore
  does not settle MPT adenylyltransferase activity. The only PAINT row is a root cytosol assertion.
