  name:
    name: Short-chain dehydrogenases/reductases (SDR) enzymes
    short: SDR_enzymes
  description:
  - text: The Short-chain dehydrogenases/reductases (SDR) family is involved in various
      biosynthetic pathways for natural products, including fungal metabolites, meroterpenoids,
      and isoprene degradation. Members of this family function as oxidoreductases,
      catalyzing NAD(+)-dependent reactions. They play roles in the formation of multicellular
      structures, the biosynthesis of bioactive compounds with anticancer properties,
      and the degradation of environmental pollutants. The SDR enzymes exhibit diverse
      substrate specificities and participate in complex chemical transformations,
      such as ketoreduction, epoxidation, and dehydration, contributing to the structural
      diversity of natural products and their bioactivities.
