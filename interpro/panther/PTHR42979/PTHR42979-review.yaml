term_assessments:
- assessed_term:
    id: GO:0003862
    label: 3-isopropylmalate dehydrogenase activity
  scope: FAMILY_WIDE
  scope_reason: >-
    Every assayed member, including glucosinolate-specialized IMDH1, catalyses the reaction with
    3-isopropylmalate; IMDH1 merely prefers the methylthio-substituted substrate. Used by the
    branched-chain amino acid module on SF1 (LeuB/LEU2/leu1) and by the aliphatic glucosinolate
    module on SF5 (IMDH1).
  supported_by:
  - reference_id: PMID:21697089
    supporting_text: Site-directed mutagenesis of Phe-137 to a leucine in AtIPMDH1 (AtIPMDH1-F137L)
      reduced activity toward 3-(2'-methylthio)ethylmalate by 200-fold, but enhanced catalytic efficiency
      with 3-isopropylmalate to levels observed with AtIPMDH2 and AtIPMDH3.
  - reference_id: file:modules/branched_chain_amino_acid_biosynthesis.yaml
    supporting_text: 'statement: IBD propagation from PTN000216982 in PTHR42979.'
- assessed_term:
    id: GO:0009098
    label: L-leucine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    Safe for SF1 and for both SF5 Arabidopsis members (IMDH3 is a leucine-pathway enzyme and
    IMDH1 contributes to leucine levels). Whether the fungal SF4 cluster paralogs (AMT6, htyC)
    contribute to leucine synthesis is not established, but they do not receive the IBA, so no
    pruning is needed for the propagated set.
  supported_by:
  - reference_id: PMID:21697089
    supporting_text: The methionine chain-elongation pathway is required for aliphatic glucosinolate
      biosynthesis in plants and evolved from leucine biosynthesis.
- assessed_term:
    id: GO:0019761
    label: glucosinolate biosynthetic process
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Only Brassicales IMDH1 orthologs. Note that the PANTHER subfamily that contains IMDH1 (SF5)
    also contains the leucine-pathway paralog IMDH3, so applying this term by SF5 membership
    would wrongly include IMDH3; it must be applied to the IMDH1 lineage only. No PAINT node
    asserts it in this family.
  applicable_subfamilies:
  - id: PANTHER:PTHR42979:SF5
    label: 3-ISOPROPYLMALATE DEHYDROGENASE 1, CHLOROPLASTIC-RELATED
  member_exceptions:
  - member:
      id: UniProtKB:Q9SA14
      label: IMDH3
      gene_symbol: IMDH3
      organism: Arabidopsis thaliana
    exception_reason: >-
      IMDH3 is in SF5 with IMDH1 but is a leucine-biosynthesis isozyme, not the glucosinolate
      chain-elongation enzyme.
    supported_by:
    - reference_id: PMID:21697089
      supporting_text: three 3-isopropylmalate dehydrogenases (AtIPMDHs) play key roles in methionine
        chain-elongation for the synthesis of aliphatic glucosinolates (e.g. AtIPMDH1) and leucine
        (e.g. AtIPMDH2 and AtIPMDH3)
  supported_by:
  - reference_id: PMID:21697089
    supporting_text: These results indicate that a single amino acid substitution results in functional
      divergence of IPMDH in planta to affect substrate specificity and contributes to the evolution of
      specialized glucosinolate biosynthesis from the ancestral leucine pathway.
- assessed_term:
    id: GO:0005829
    label: cytosol
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Bacterial and fungal LeuB/LEU2/leu1 are cytosolic, but the Arabidopsis IPMDHs are plastid
    enzymes (PAINT asserts chloroplast at the Streptophyta node PTN008677315). The cytosol IBD at
    the root node PTN000216982 therefore descends to plastid IMDH1-3 as well; the IMDH1 review's
    core location is chloroplast stroma. Treat cytosol as safe for non-plant SF1 members only.
  applicable_subfamilies:
  - id: PANTHER:PTHR42979:SF1
    label: 3-ISOPROPYLMALATE DEHYDROGENASE
  supported_by:
