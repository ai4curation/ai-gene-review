notes: >-
  Subfamily assignments from the PANTHER 19.0 model-organism classification files and the
  family entries.csv; propagation sets from the cached PAINT UniProt GAF. The IMDH1 F137
  specificity residue was confirmed in the current UniProt sequence of Q9FMT1 (position 137 = F)
  and IMDH3 L133 (position 133 = L), but no residue_site was recorded because no GO term
  captures the methylthioalkylmalate preference (GO:0103093 is obsolete) and the residue does
  not decide IPMDH activity itself. Module inconsistency: the aliphatic glucosinolate module
  names SF5 the "IPMDH1 subfamily", but SF5 also holds IMDH3, a leucine-pathway enzyme. The
  S. pombe leu1 review still has its IBAs at PENDING.
