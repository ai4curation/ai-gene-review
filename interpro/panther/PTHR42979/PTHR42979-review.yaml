family_id: PANTHER:PTHR42979
family_name: 3-ISOPROPYLMALATE DEHYDROGENASE
preferred_name: 3-isopropylmalate dehydrogenase (LeuB/LEU2/leu1/IMDH) family
summary: >-
  NAD+-dependent 3-isopropylmalate dehydrogenases of the isocitrate/isopropylmalate
  dehydrogenase fold. Members catalyse the oxidative decarboxylation of
  (2R,3S)-3-isopropylmalate to 4-methyl-2-oxopentanoate, the third step of the leucine-specific
  branch of branched-chain amino acid biosynthesis, in bacteria (LeuB), fungi (S. cerevisiae
  LEU2, S. pombe leu1) and plants (Arabidopsis IMDH1-3, plastid-targeted). In Brassicales the
  same chemistry was recruited into methionine chain elongation for aliphatic glucosinolates:
  Arabidopsis IMDH1 prefers 3-(2'-methylthio)ethylmalate, a switch attributed to a single
  active-site residue, but it keeps measurable isopropylmalate dehydrogenase activity. A small
  fungal subfamily (SF4) holds IPMDH paralogs encoded in secondary-metabolite clusters
  (Alternaria AMT6, Aspergillus htyC) together with ordinary-looking fungal LEU2 sequences.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The 3-isopropylmalate dehydrogenase reaction is shared by every characterized member that
  has been assayed, including the glucosinolate-specialized Arabidopsis IMDH1 (SF5). What
  diverges is substrate preference and pathway: IMDH1 serves methionine chain elongation in
  glucosinolate biosynthesis, and SF4 contains fungal paralogs from secondary-metabolite gene
  clusters whose in vivo substrates are not established here. Leucine biosynthesis
  (GO:0009098) is therefore the family core but not a property of every member, while the
  molecular function term is safe family-wide. PANTHER SF5 is not a pure glucosinolate group:
  it contains both IMDH1 and the leucine-pathway IMDH3, whereas IMDH2 sits in SF1.
