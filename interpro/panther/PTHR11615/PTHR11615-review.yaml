review_status: COMPLETE
reviewed_by: codex
review_date: '2026-09-10'
notes: NARF/IOP2 and NARFL/IOP1 must remain distinct. The aconitase knockdown result is evidence for divergent
  tested cellular roles, not proof that NARF can never bind an Fe-S cluster. J3KS48 retains reference
  blocks 1–128 and 174–258 but lacks much of the rest of Q9UHQ1. No arbitrary PANTHER subfamily, ancestral
  catalytic loss or family-wide membrane topology is assigned.
subfamilies:
- label: Human NARF
  description: The selected shortened NARF product has a verified same-gene relationship to the nuclear
    prelamin-A-associated protein. Its deletions do not establish retention of that interaction or an
    Fe-S assembly role.
