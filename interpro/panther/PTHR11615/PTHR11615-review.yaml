family_id: PANTHER:PTHR11615
family_name: NITRATE, FORMATE, IRON DEHYDROGENASE
summary: NARF and NARFL/Nar1-related proteins illustrate functional divergence among hydrogenase-related
  proteins. Human NARF binds prenylated prelamin A, whereas NARFL/IOP1 has direct support in cytosolic
  iron-sulfur protein maturation. Broad structural relationships do not establish respiratory hydrogenase
  chemistry or identical Fe-S assembly roles.
functional_coherence: UNKNOWN
coherence_reason: 'Comparative human knockdown experiments distinguish IOP1/NARFL from IOP2/NARF: IOP1
  depletion impairs cytosolic aconitase activity, while IOP2 depletion does not. The frozen PANTHER vocabulary
  also contains discordant membrane-protein labels, so the uniformity and evolutionary meaning of the
  entire grouping remain unresolved. The selected NARF product has extensive deletions relative to the
  experimentally characterized larger protein.'
