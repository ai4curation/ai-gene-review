family_id: PANTHER:PTHR34874
family_name: PROTEIN YCHN
preferred_name: TusD/YchN family with a sulfur-relay TusD branch
summary: TusD is the persulfide-bearing subunit of the heterohexameric TusBCD sulfur-transfer complex.
  The distinct YchN branch shares ancestry but is not thereby assigned the TusD-specific U34 role.
