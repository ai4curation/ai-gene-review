family_id: PANTHER:PTHR34874
family_name: PROTEIN YCHN
preferred_name: DsrE/TusD family of DsrEFH-fold sulfur-relay proteins (TusD and YchN subfamilies)
summary: >-
  Small DsrE-like (DsrEFH-fold) proteins. Subfamily SF3 holds TusD, the
  sulfur-carrying subunit of the heterohexameric TusBCD complex: in Escherichia
  coli TusD accepts persulfide sulfur from TusA on Cys78 and passes it to TusE for
  2-thiolation of mnm5s2U at tRNA wobble position 34. Subfamily SF1, which gives
  the family its PANTHER name, holds YchN-like proteins of enterobacteria,
  Shewanella, Thermotoga, Dictyoglomus and methanogenic archaea, none of which has
  an established function. The full SF3 inventory also includes Allochromatium
  vinosum DsrE of the Dsr sulfur-oxidation system.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  PAINT assigns the TusBCD complex, sulfur carrier activity and wobble-uridine
  thiolation only to node PTN002166909, whose reference-tree leaves are exactly
  the seven SF3 TusD orthologs. The SF1 YchN-like proteins sit outside that node
  and are uncharacterized, so the family as a whole is not functionally uniform;
  only the cytosol call (PTN002166889) spans both subfamilies.
