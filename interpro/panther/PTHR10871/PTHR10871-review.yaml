family_id: PANTHER:PTHR10871
family_name: 30S RIBOSOMAL PROTEIN S13/40S RIBOSOMAL PROTEIN S18
summary: uS13-related proteins contribute to the structure and function of the small ribosomal subunit.
  The family includes bacterial-type and mitochondrial uS13 proteins as well as eukaryotic cytosolic counterparts.
  The mitochondrial small-subunit protein Sws2 therefore shares a ribosomal function without sharing the
  localization of every family member.
functional_coherence: MOSTLY_COHERENT
coherence_reason: All 848 inspected entry names identify uS13 proteins, including cytosolic, mitochondrial
  and other organellar variants. The official vocabulary contains a topoisomerase-like label, but the
  member inventory provides no corresponding topoisomerase protein evidence. Sws2 has a reviewed uS13m
  assignment supporting mitochondrial small-subunit function. Ribosomal structure is coherent across the
  inspected proteins; mitochondrial targeting remains branch-dependent.
reference_protein: &id001
  id: UniProtKB:O59772
  label: Small ribosomal subunit protein uS13m
  gene_symbol: sws2
  organism: Schizosaccharomyces pombe (strain 972 / ATCC 24843)
  gene_review: genes/SCHPO/sws2/sws2-ai-review.yaml
subfamilies:
- subfamily_id: PANTHER:PTHR10871:SF1
  label: SMALL RIBOSOMAL SUBUNIT PROTEIN US13M
  description: The Sws2 reviewed record and uS13m assignment support a mitochondrial ribosomal role. Subfamily
    labels also include a topoisomerase-labelled outlier; its architecture and membership require inspection
    before asserting that every classified sequence is exclusively ribosomal. That label alone is not
    evidence that Sws2 has topoisomerase activity.
  representative_members:
  - *id001
term_assessments:
- assessed_term:
    id: GO:0005763
    label: mitochondrial small ribosomal subunit
  scope: UNRESOLVED
  scope_reason: Mitochondrial small-subunit membership is supported for Sws2/uS13m, but mitochondrial
    uS13-related proteins occupy multiple subfamilies in the classification. Cytosolic and bacterial counterparts
    have the same broad structural role in different translation systems. A single pombe uS13m subfamily
    is not an exhaustive mitochondrial allowed set; targeting, architecture and ribosome membership must
    determine the branch boundary.
