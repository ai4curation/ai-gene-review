family_id: PANTHER:PTHR11596
family_name: ALKALINE PHOSPHATASE
preferred_name: Alkaline phosphatase (metallo-phosphomonoesterase, EC 3.1.3.1)
summary: >-
  A metallo-phosphomonoesterase family that hydrolyses phosphate monoesters at
  alkaline pH through a covalent phosphoseryl intermediate, present from bacteria
  to vertebrates. Catalysis is carried out by a trinuclear metal centre of two
  Zn(2+) and one Mg(2+) together with an invariant active-site serine, and every
  reviewed member of the family retains that serine in an essentially unchanged
  D-S-A/G context. There is no known pseudo-enzyme branch here: unlike families
  where a catalytic residue has been lost in one lineage, this one has kept its
  chemistry intact everywhere it has been examined.

  What has diverged is not the reaction but where it is performed and what it is
  performed on. Bacteria secrete the enzyme into the periplasm for phosphate
  scavenging; fungi relocated it to the vacuole membrane; animals bolted it to the
  outer leaflet of the plasma membrane through a C-terminal GPI anchor, making it
  an ectoenzyme that acts on extracellular substrates. Animals also gained a
  structural Ca(2+) site and a crown domain that have no counterpart in the
  bacterial enzyme. In bony vertebrates the tissue-nonspecific branch was then
  recruited to skeletal mineralization, where it destroys extracellular
  pyrophosphate, and the tissue-specific branch duplicated into the intestinal,
  placental and germ-cell isozymes.

  The family is therefore a case where an IBA for the molecular function is safe
  everywhere and IBAs for compartment and process are safe only within their own
  clades -- which is exactly how PAINT has scoped them.

functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Coherent for the molecular function: the catalytic serine and the Zn/Zn/Mg
  ligands are conserved in every reviewed member across bacteria, fungi and
  animals, so alkaline phosphatase activity holds family-wide and no member is a
  candidate pseudo-enzyme. Not coherent for localisation or biological process.
  The same reaction is run in the bacterial periplasm, on the fungal vacuole
  membrane and on the animal cell surface, and only the vertebrate
  tissue-nonspecific branch performs biomineralization. Terms in the C and P
  aspects must be scoped by clade rather than granted to the family.

reference_protein:
  id: UniProtKB:P05187
  label: Alkaline phosphatase, placental type
  gene_symbol: ALPP
  organism: Homo sapiens

subfamilies:
  - subfamily_id: PANTHER:PTHR11596:SF5
    label: ALKALINE PHOSPHATASE
    description: >-
      The microbial subfamily, holding the bacterial and fungal members together:
      E. coli PhoA, Bacillus subtilis PhoA and PhoB, Serratia, Pseudomonas and
      Streptomyces enzymes, plus fungal Pho8 from S. cerevisiae and the S. pombe
      enzyme. All retain the catalytic serine and the Zn/Zn/Mg centre; none has
      the animal structural calcium site or a GPI anchor. Note that this single
      PANTHER subfamily spans two different compartments -- bacterial periplasm
      and fungal vacuole membrane -- which is why the localisation terms are
      handled at PAINT nodes rather than at subfamily level.
    representative_members:
      - id: UniProtKB:P00634
        label: phoA
        organism: Escherichia coli
      - id: UniProtKB:P11491
        label: PHO8
        organism: Saccharomyces cerevisiae
      - id: UniProtKB:O60109
        label: SPBC14F5.13c
        organism: Schizosaccharomyces pombe
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11596:SF74
    label: ALKALINE PHOSPHATASE, TISSUE-NONSPECIFIC ISOZYME
    description: >-
      The vertebrate tissue-nonspecific branch (TNAP): human, mouse, rat, bovine,
      cat and chicken ALPL. This is the only branch of the family with an
      established set of physiological substrates -- inorganic pyrophosphate,
      pyridoxal 5'-phosphate, phosphoethanolamine and phosphocholine -- and the
      only one recruited to skeletal and dental mineralization. Human
      loss-of-function causes hypophosphatasia.
    representative_members:
      - id: UniProtKB:P05186
        label: ALPL
        organism: Homo sapiens
        gene_review: genes/human/ALPL/ALPL-ai-review.yaml
      - id: UniProtKB:P09242
        label: Alpl
        organism: Mus musculus
      - id: UniProtKB:Q92058
        label: ALPL
        organism: Gallus gallus
    diverged_from_family: true
    divergence_description: >-
      Divergence of acquired role rather than lost chemistry. TNAP is the only
      part of the family that carries a biomineralization function, and it does so
      by destroying extracellular pyrophosphate. That is a gain restricted to bony
      vertebrates and it must not be projected onto the rest of the family, nor
      onto the tissue-specific isozymes of the same species.

  - subfamily_id: PANTHER:PTHR11596:SF30
    label: INTESTINAL-TYPE ALKALINE PHOSPHATASE
    description: >-
      One of two intestinal-type subfamilies. Holds human ALPI, rat Alpi (P15693)
      and bovine ALPI. Human ALPI acts in the gut lumen, dephosphorylating the
      lipid A moiety of bacterial lipopolysaccharide and thereby restraining TLR4
      signalling; biallelic loss of function causes Mendelian inflammatory bowel
      disease.
    representative_members:
      - id: UniProtKB:P09923
        label: ALPI
        organism: Homo sapiens
        gene_review: genes/human/ALPI/ALPI-ai-review.yaml
      - id: UniProtKB:P15693
        label: Alpi
        organism: Rattus norvegicus
    diverged_from_family: true
    divergence_description: >-
      Substrate and compartment divergence: acts on a bacterial glycolipid in the
      intestinal lumen rather than on host phosphometabolites at a mineralizing
      front. Upregulated TNAP does not restore luminal function in ALPI-deficient
      intestine, so the two are not interchangeable despite identical catalytic
      machinery.

  - subfamily_id: PANTHER:PTHR11596:SF43
    label: INTESTINAL-TYPE ALKALINE PHOSPHATASE
    description: >-
      The second intestinal-type subfamily, holding mouse Iap (P24822) and a rat
      member (P51740). PANTHER gives it the same name as SF30 but assigns the
      rodent and the human/bovine intestinal enzymes to different subfamilies,
      which reflects the rodent-specific expansion of intestinal alkaline
      phosphatase genes. Recorded separately here precisely because the shared
      label invites the two from being conflated.
    representative_members:
      - id: UniProtKB:P24822
        label: Iap
        organism: Mus musculus
      - id: UniProtKB:P51740
        label: Akp3
        organism: Rattus norvegicus
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11596:SF69
    label: ALKALINE PHOSPHATASE, PLACENTAL TYPE
    description: >-
      Human ALPP (PLAP, the Regan isozyme), expressed almost exclusively in
      syncytiotrophoblast. Distinguished biochemically by exceptional heat
      stability and by uncompetitive inhibition by L-amino acids, both traceable
      to Glu429 near the active-site entrance. No physiological substrate has
      been established.
    representative_members:
      - id: UniProtKB:P05187
        label: ALPP
        organism: Homo sapiens
        gene_review: genes/human/ALPP/ALPP-ai-review.yaml
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11596:SF81
    label: ALKALINE PHOSPHATASE, GERM CELL TYPE
    description: >-
      Human ALPG (GCAP, the Nagao isozyme; gene long called ALPPL2). Roughly 98%
      identical to ALPP and differing at only seven residues, of which Gly429 --
      where ALPP has Glu429 -- makes it sensitive to L-leucine, EDTA and heat.
      Expressed in testis, thymus and germ cells, with strong ectopic expression
      in seminoma. No physiological substrate has been established.
    representative_members:
      - id: UniProtKB:P10696
        label: ALPG
        organism: Homo sapiens
        gene_review: genes/human/ALPG/ALPG-ai-review.yaml
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11596:SF42
    label: ALKALINE PHOSPHATASE, GERM CELL TYPE
    description: >-
      The rodent germ-cell-type subfamily, holding mouse Alpg (P24823). Kept
      distinct from the human SF81 for the same reason as the two intestinal
      subfamilies: PANTHER reuses the name across separate subfamilies, and the
      human and rodent tissue-specific isozymes are not one-to-one orthologues.
    representative_members:
      - id: UniProtKB:P24823
        label: Alpg
        organism: Mus musculus
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11596:SF83
    label: ALKALINE PHOSPHATASE 4
    description: >-
      Drosophila Alp4, one of the invertebrate members. Relevant to family review
      mainly because fly genes are among the seeds for the family-wide molecular
      function node, showing that the catalytic assertion is not vertebrate-bound.
    representative_members:
      - id: UniProtKB:Q24238
        label: Alp4
        organism: Drosophila melanogaster
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11596:SF90
    label: ALKALINE PHOSPHATASE
    description: >-
      The cold-adapted teleost enzyme from Atlantic cod (Gadus morhua), a
      long-standing model for psychrophilic alkaline phosphatase catalysis. Same
      chemistry with a markedly higher turnover at low temperature.
    representative_members:
      - id: UniProtKB:P83456
        label: Alkaline phosphatase
        organism: Gadus morhua
    diverged_from_family: false

  - subfamily_id: PANTHER:PTHR11596:SF91
    label: ALKALINE PHOSPHATASE-RELATED
    description: >-
      Bombyx mori Alp-m, a membrane-bound insect alkaline phosphatase. The
      PANTHER label carries the "-RELATED" qualifier; recorded verbatim.
    representative_members:
      - id: UniProtKB:P29523
        label: Alp-m
        organism: Bombyx mori
    diverged_from_family: false

node_assessments:
  - node_id: PANTHER:PTN000174527
    asserted_term:
      id: GO:0004035
      label: alkaline phosphatase activity
    seeds:
      - id: UniProtKB:P00634
        label: phoA
        organism: Escherichia coli
      - id: UniProtKB:P05186
        label: ALPL
        organism: Homo sapiens
      - id: UniProtKB:P05187
        label: ALPP
        organism: Homo sapiens
      - id: UniProtKB:P10696
        label: ALPG
        organism: Homo sapiens
      - id: UniProtKB:Q92058
        label: ALPL
        organism: Gallus gallus
    assessment: SOUND
    assessment_reason: >-
      An unrestricted node for the catalytic activity, seeded from seventeen
      descendants spanning E. coli, fission and budding yeast, Dictyostelium,
      Drosophila, zebrafish, rat, mouse and human. The residue evidence agrees
      with the placement independently of the seeds: the catalytic serine is
      present in every reviewed member checked here, in an essentially invariant
      D-S-A/G context, and the Zn/Zn/Mg ligands are likewise conserved from PhoA
      to the human isozymes. There is no descendant lineage with evidence of
      catalytic loss, so no pruning is warranted and the term is safe for the
      whole family.

      Note for anyone reviewing an ALP gene: the appearance of a target's own
      accession in this node's WITH/FROM list is expected rather than circular.
      Human ALPL, ALPP and ALPG each have their own experimental annotation for
      this term, which is why they are among the descendant evidences the curator
      used, and the IBA then adds the further claim that the activity is
      inherited rather than lineage-specific.
    paint_snapshot: "20260828"

  - node_id: PANTHER:PTN000904735
    asserted_term:
      id: GO:0005886
      label: plasma membrane
    seeds:
      - id: UniProtKB:P05186
        label: ALPL
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Scoped to Eumetazoa, which is the right boundary. GPI anchoring to the outer
      leaflet of the plasma membrane is an animal arrangement in this family: the
      bacterial members are periplasmic and the fungal members sit on the vacuole
      membrane, so a family-wide plasma membrane assertion would have been wrong.
      Restricting it to the animal clade lets the same node cover all four human
      isozymes plus the rodent and other vertebrate orthologues without leaking
      onto PhoA or Pho8. The four seed genes are all mammalian TNAPs, which is a
      narrow seed set for a Eumetazoa-wide claim, but the supporting structural
      argument is general -- every animal member examined carries a C-terminal GPI
      signal -- so the placement stands.
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20260828"

  - node_id: PANTHER:PTN000904807
    asserted_term:
      id: GO:0000329
      label: fungal-type vacuole membrane
    seeds:
      - id: SGD:S000002889
        label: PHO8
        organism: Saccharomyces cerevisiae
    assessment: SOUND
    assessment_reason: >-
      Scoped to Fungi and seeded from a single gene, S. cerevisiae PHO8. A single
      seed is not weak support here: PHO8 is the canonical vacuolar alkaline
      phosphatase, its localisation is thoroughly established, and the claim being
      made is about where the fungal lineage put the enzyme rather than about how
      similar any target is to PHO8. The restriction to Fungi is what keeps this
      compartment assertion from colliding with the periplasmic and plasma
      membrane nodes covering the same family.
    node_taxon:
      id: NCBITaxon:4751
      label: Fungi
    paint_snapshot: "20191022"

  - node_id: PANTHER:PTN001698225
    asserted_term:
      id: GO:0042597
      label: periplasmic space
    seeds:
      - id: UniProtKB:P00634
        label: phoA
        organism: Escherichia coli
    assessment: SOUND
    assessment_reason: >-
      Scoped to Enterobacteriaceae and seeded from E. coli PhoA, the enzyme in
      which periplasmic secretion and phosphate-starvation induction were
      originally worked out. The taxon restriction is conservative -- other
      bacterial members in SF5 come from Bacillus, Streptomyces, Serratia and
      Pseudomonas, and Gram-positive members have no periplasm in the same sense --
      so confining the term to Enterobacteriaceae rather than to Bacteria is the
      correct call rather than an omission.
    node_taxon:
      id: NCBITaxon:543
      label: Enterobacteriaceae
    paint_snapshot: "20191022"

  - node_id: PANTHER:PTN002613308
    asserted_term:
      id: GO:0030282
      label: bone mineralization
    seeds:
      - id: MGI:MGI:87983
        label: Alpl
        organism: Mus musculus
      - id: ZFIN:ZDB-GENE-040420-1
        label: alpl
        organism: Danio rerio
    assessment: SOUND
    assessment_reason: >-
      The most interesting node in the family, and the one most likely to be
      misread as weak. It carries only two seeds, mouse Alpl and zebrafish alpl,
      and asserts a biological process rather than a compartment. Both features
      are appropriate. Bone is a euteleostome innovation, so scoping the term to
      Euteleostomi places the gain exactly where the tissue it acts on arose, and
      a mouse plus a teleost seed spans that clade rather than sampling one corner
      of it. Donor count is not the measure here: the question is whether the
      target descends from the node at which the function arose, and every
      vertebrate TNAP does.

      The restriction also does real work. It keeps bone mineralization off the
      invertebrate, fungal and bacterial members, and off the tissue-specific
      human isozymes ALPI, ALPP and ALPG, which sit outside the TNAP branch and
      have no mineralization role. Human ALPL's own IBA for this term derives from
      this node and was accepted on that basis in the ALPL gene review.
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20250408"

residue_sites:
  - site_id: catalytic_serine
    label: Active-site serine forming the phosphoseryl intermediate
    description: >-
      The nucleophile of the two-step in-line displacement mechanism: this serine
      attacks the substrate phosphorus to form a covalent phosphoseryl
      intermediate, which is then hydrolysed to release inorganic phosphate and
      regenerate the enzyme. It is the single residue on which the family's
      molecular function depends.

      Recorded here as a site that is retained everywhere, which is the point.
      Across bacteria, fungi and animals every reviewed member checked carries
      serine at the homologous position, in a near-invariant context: PLAP reads
      KHVPD[S]GATAT, human ALPL AQVPD[S]AGTAT, E. coli PhoA DYVTD[S]AASAT, S.
      pombe SLITD[S]AAGAT and S. cerevisiae Pho8 SLVTD[S]AAGAT. Checking all
      twenty-seven reviewed members of the family found serine at the annotated
      active site in every one, and a pairwise alignment to the anchor maps the
      position correctly in the microbial members independently of the UniProt
      feature.

      Mechanistically this residue is required, not merely contributory: the
      phosphoseryl intermediate cannot form without it. It is nevertheless
      recorded here with no required_for entry, because the schema reserves
      REQUIRED for sites backed by a negative control and this family contains
      none -- nothing has lost the serine. Recording CONTRIBUTES instead would
      assert something false in a machine-readable field, so the site is left as a
      checkable retention record. The absence of a negative control is itself the
      finding: any future claim that a member of this family is a pseudo-enzyme
      should be tested against this site first.
    anchor:
      id: UniProtKB:P05187
      label: ALPP
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: UNIPROT_FEATURE
    residues:
      - position: 114
        expected: [S]
        role: nucleophile
    positive_controls:
      - id: UniProtKB:P05186
        label: ALPL
        organism: Homo sapiens
        control_position: 110
        control_residue: S
      - id: UniProtKB:P09923
        label: ALPI
        organism: Homo sapiens
        control_position: 111
        control_residue: S
      - id: UniProtKB:P10696
        label: ALPG
        organism: Homo sapiens
        control_position: 111
        control_residue: S
      - id: UniProtKB:P09242
        label: Alpl
        organism: Mus musculus
        control_position: 110
        control_residue: S
      - id: UniProtKB:P00634
        label: phoA
        organism: Escherichia coli
        control_position: 124
        control_residue: S
      - id: UniProtKB:O60109
        label: SPBC14F5.13c
        organism: Schizosaccharomyces pombe
        control_position: 115
        control_residue: S
      - id: UniProtKB:P11491
        label: PHO8
        organism: Saccharomyces cerevisiae
        control_position: 123
        control_residue: S

  - site_id: catalytic_metal_centre
    label: Trinuclear Zn/Zn/Mg catalytic centre
    description: >-
      The two zinc ions and one magnesium ion that together polarise the substrate
      phosphate, activate the serine nucleophile and stabilise the transition
      state. Conserved from the bacterial to the human enzymes; UniProt annotates
      the same ligand set in E. coli PhoA and in all four human isozymes.

      Recorded as a retained site for the same reason as the serine, and with no
      required_for entry for the same reason: metal loading is genuinely necessary
      for catalysis, but no member of the family has lost the ligands, so there is
      no negative control to license a REQUIRED claim. Its documentary value is
      that it removes the "the metal machinery decayed" argument from the table for
      every member of this family.
    anchor:
      id: UniProtKB:P05187
      label: ALPP
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: UNIPROT_FEATURE
    residues:
      - position: 64
        expected: [D]
        role: Zn(2+) and Mg(2+) binding
      - position: 114
        expected: [S]
        role: Zn(2+) binding, catalytic nucleophile
      - position: 338
        expected: [D]
        role: Zn(2+) binding
      - position: 342
        expected: [H]
        role: Zn(2+) binding
      - position: 454
        expected: [H]
        role: Zn(2+) binding
    positive_controls:
      - id: UniProtKB:P00634
        label: phoA
        organism: Escherichia coli
        control_position: 124
        control_residue: S
      - id: UniProtKB:P05186
        label: ALPL
        organism: Homo sapiens
        control_position: 110
        control_residue: S

  - site_id: structural_calcium_site
    label: Animal-specific structural calcium site
    description: >-
      A four-residue calcium site with no counterpart in the bacterial or fungal
      enzymes, and the cleanest lineage marker in this family. UniProt annotates
      four Ca(2+) ligands in every animal member examined and none in E. coli
      PhoA, S. pombe or S. cerevisiae Pho8. The ligand identities are invariant
      across the animals -- Glu, Phe, Glu, Asp -- differing only in numbering:
      E238/F291/E292/D307 in ALPP, E235/F290/E291/D306 in human and mouse ALPL,
      E235/F288/E289/D304 in ALPI, ALPG and mouse Iap, E236/F289/E290/D305 in rat
      Alpi and E234/F287/E288/D303 in mouse Alpg.

      The site is structural rather than catalytic: UniProt notes for ALPL that
      calcium binding does not influence phosphatase activity. It is recorded here
      because it is the evidence behind proposing GO:0005509 for the isozymes that
      lack it in GOA, and because its absence from the microbial members is a
      concrete reason not to grant that term family-wide.
    anchor:
      id: UniProtKB:P05187
      label: ALPP
      organism: Homo sapiens
    anchor_sequence_version: 2
    site_source: UNIPROT_FEATURE
    residues:
      - position: 238
        expected: [E]
        role: Ca(2+) binding
      - position: 291
        expected: [F]
        role: Ca(2+) binding
      - position: 292
        expected: [E]
        role: Ca(2+) binding
      - position: 307
        expected: [D]
        role: Ca(2+) binding
    required_for:
      - term:
          id: GO:0005509
          label: calcium ion binding
        strength: REQUIRED
        rationale: >-
          These are the calcium ligands themselves. Members lacking the site --
          the bacterial and fungal branch -- should not carry the term. This is
          the one site in the family with a genuine negative control, which is why
          it is the only one carrying a REQUIRED claim.
    positive_controls:
      - id: UniProtKB:P05186
        label: ALPL
        organism: Homo sapiens
        control_position: 235
        control_residue: E
      - id: UniProtKB:P09923
        label: ALPI
        organism: Homo sapiens
        control_position: 235
        control_residue: E
      - id: UniProtKB:P10696
        label: ALPG
        organism: Homo sapiens
        control_position: 235
        control_residue: E
      - id: UniProtKB:P09242
        label: Alpl
        organism: Mus musculus
        control_position: 235
        control_residue: E
    negative_controls:
      - id: UniProtKB:P00634
        label: phoA
        organism: Escherichia coli
        control_position: 282
        control_residue: A
      - id: UniProtKB:P11491
        label: PHO8
        organism: Saccharomyces cerevisiae
        control_position: 278
