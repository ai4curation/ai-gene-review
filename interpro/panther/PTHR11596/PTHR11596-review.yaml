term_assessments:
  - assessed_term:
      id: GO:0004035
      label: alkaline phosphatase activity
    scope: FAMILY_WIDE
    determined_by_site: catalytic_serine
    scope_reason: >-
      Safe for every member. The catalytic serine and the Zn/Zn/Mg ligands are
      retained in all reviewed members from E. coli to human, and no branch has
      been reported to have lost activity. This is the one term in the family that
      needs no clade restriction.

  - assessed_term:
      id: GO:0008270
      label: zinc ion binding
    scope: FAMILY_WIDE
    determined_by_site: catalytic_metal_centre
    scope_reason: >-
      The binuclear zinc centre is annotated in the bacterial as well as the
      animal members, so this term travels with the catalytic activity. Worth
      stating explicitly because GOA currently gives it to only some of the human
      isozymes -- ALPI and ALPP have it, ALPL and ALPG do not -- an inconsistency
      that has no basis in the sequences.

  - assessed_term:
      id: GO:0005509
      label: calcium ion binding
    scope: RESIDUE_DETERMINED
    determined_by_site: structural_calcium_site
    scope_reason: >-
      Determined by presence of the four-residue calcium site, which cleanly
      separates the animal members from the bacterial and fungal ones. All animal
      members examined carry E/F/E/D at the site; PhoA, Pho8 and the S. pombe
      enzyme have no calcium ligands annotated at all. Recorded as
      RESIDUE_DETERMINED rather than clade-scoped because the site itself is the
      check, and it happens to align with the animal clade rather than defining it
      by assumption.

  - assessed_term:
      id: GO:0005886
      label: plasma membrane
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR11596:SF30
        label: INTESTINAL-TYPE ALKALINE PHOSPHATASE
      - id: PANTHER:PTHR11596:SF42
        label: ALKALINE PHOSPHATASE, GERM CELL TYPE
      - id: PANTHER:PTHR11596:SF43
        label: INTESTINAL-TYPE ALKALINE PHOSPHATASE
      - id: PANTHER:PTHR11596:SF69
        label: ALKALINE PHOSPHATASE, PLACENTAL TYPE
      - id: PANTHER:PTHR11596:SF74
        label: ALKALINE PHOSPHATASE, TISSUE-NONSPECIFIC ISOZYME
      - id: PANTHER:PTHR11596:SF81
        label: ALKALINE PHOSPHATASE, GERM CELL TYPE
      - id: PANTHER:PTHR11596:SF83
        label: ALKALINE PHOSPHATASE 4
      - id: PANTHER:PTHR11596:SF90
        label: ALKALINE PHOSPHATASE
      - id: PANTHER:PTHR11596:SF91
        label: ALKALINE PHOSPHATASE-RELATED
    scope_reason: >-
      Applies to the animal subfamilies only, where the enzyme is GPI-anchored on
      the outer leaflet. The microbial subfamily SF5 spans the bacterial periplasm
      and the fungal vacuole membrane and must not receive it. PAINT already
      enforces this by restricting the node to Eumetazoa.

  - assessed_term:
      id: GO:0030282
      label: bone mineralization
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR11596:SF74
        label: ALKALINE PHOSPHATASE, TISSUE-NONSPECIFIC ISOZYME
    scope_reason: >-
      Applies to the tissue-nonspecific subfamily SF74 only, and within it only to
      bony vertebrates. This is an acquired role, not an ancestral one: it depends
      on the enzyme destroying extracellular pyrophosphate at a mineralizing front,
      which requires both a skeleton and the surrounding ENPP1/ANKH pyrophosphate
      system. It must not be transferred to the intestinal, placental or germ-cell
      isozymes, which sit outside this subfamily, nor to invertebrate or microbial
      members.

  - assessed_term:
      id: GO:0140928
      label: inhibition of non-skeletal tissue mineralization
    scope: NOT_APPLICABLE
    scope_reason: >-
      Recorded as a warning rather than a scoping decision. This term is
      directionally wrong for alkaline phosphatases and should not be propagated
      to any member of the family. The enzyme degrades extracellular
      pyrophosphate, the endogenous inhibitor of hydroxyapatite propagation, so it
      promotes rather than prevents ectopic mineralization; the mouse Alpl IDA
      behind the existing transfers traces to an experiment in which TNAP
      overexpression increased aortic calcification. The genes that genuinely
      perform this process -- ENPP1, ANKH, ABCC6 -- make or export pyrophosphate
      and are not in this family. See the ALPL gene review, where the human
      annotation is removed and a term in the promoting direction is proposed.

