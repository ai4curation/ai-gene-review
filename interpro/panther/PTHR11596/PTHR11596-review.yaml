reviewed_by: AI-assisted family and residue analysis
review_date: "2026-09-01"
notes: >-
  Residue positions were read from live UniProt feature tables and the residue
  identities confirmed against the actual sequences for eleven members (four human
  isozymes, mouse Alpl, mouse Iap, mouse Alpg, rat Alpi, E. coli PhoA, S. pombe
  and S. cerevisiae Pho8). Two checks are worth recording because they were the
  point of the exercise: the catalytic serine is present in all eleven, and the
  structural calcium site is present in all eight animal members and absent from
  all three microbial ones.

  Subfamily labels are PANTHER's own, taken verbatim from panther.obo. Note that
  PANTHER reuses two labels within this family: "INTESTINAL-TYPE ALKALINE
  PHOSPHATASE" names both SF30 (human, rat Alpi, bovine) and SF43 (mouse Iap, rat
  Akp3), and "ALKALINE PHOSPHATASE, GERM CELL TYPE" names both SF81 (human ALPG)
  and SF42 (mouse Alpg). Both pairs are recorded separately here so that the human
  and rodent tissue-specific isozymes are not treated as one-to-one orthologues.

  Curating the family caught a factual error in the ALPI and ALPP gene reviews,
  which described P15693 as mouse. It is rat Alpi (PPBI1_RAT); the reviews have
  been corrected in all five places it appeared. The mouse intestinal member of
  this family is P24822 (Iap), in a different subfamily.

  The PAINT slice for this family is unusually instructive and is the reason the
  node assessments are the substantive part of this review. One unrestricted node
  carries the molecular function; three separate clade-restricted nodes carry
  three different compartments for the same reaction (Enterobacteriaceae
  periplasm, fungal vacuole membrane, eumetazoan plasma membrane); and one
  Euteleostomi-restricted node carries the acquired biomineralization process.
  All five were assessed SOUND.
