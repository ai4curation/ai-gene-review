  name:
    name: Plant cell wall-modifying expansin
    short: Expansin
  description:
  - text: This family of proteins is involved in the modification of plant cell walls.
      Members of this family are known to facilitate the loosening and extension of
      cell walls by altering the non-covalent interactions between cellulose microfibrils
      and matrix glucans. They do not possess enzymatic activity. Some proteins in
      this family are implicated in processes such as fertilization by modifying the
      cell walls of the stigma and style to assist pollen tube penetration. Others
      are associated with the adaptation of plants to environmental conditions, such
      as enabling rapid internodal elongation in rice during submergence. Additionally,
      certain members are recognized as allergens in pollen.
