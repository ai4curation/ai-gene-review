subfamilies:
- subfamily_id: PANTHER:PTHR43822:SF9
  label: 3-ISOPROPYLMALATE DEHYDRATASE
  description: >-
    Bacterial LeuC large subunits (E. coli P0A6A6, P. putida KT2440 Q88LE8, B. subtilis,
    Thermus) together with the single-chain fungal IPMIs S. cerevisiae LEU1 (P07264) and
    S. pombe leu2 (O14289). Both architectures are 3-isopropylmalate dehydratases. The
    subfamily does not tell a LeuC-LeuD heteromer from a fused monomer. The BCAA module uses SF9
    for both its heteromeric LeuC and its fused LEU1 variant annotons, and its notes say this
    correctly.
