- subfamily_id: PANTHER:PTHR43822:SF2
  label: HOMOACONITASE, MITOCHONDRIAL
  description: >-
    A mixed subfamily. It contains the fungal mitochondrial homoaconitases S. cerevisiae LYS4
    (P49367) and S. pombe lys2 (Q9UT74), the methanogen homoaconitase large subunit
    M. jannaschii HacA/MJ1003 (Q58409), and the Arabidopsis IPMI large subunit IIL1 (Q94AR8),
    which works in leucine biosynthesis and glucosinolate methionine chain elongation. The
    lysine module uses SF2 as its homoaconitase selector, but IIL1 shows that SF2 membership
    alone does not imply homoaconitase activity.
  representative_members:
  - id: UniProtKB:P49367
    label: LYS4
    gene_symbol: LYS4
    organism: Saccharomyces cerevisiae
    gene_review: genes/yeast/LYS4/LYS4-ai-review.yaml
  - id: UniProtKB:Q9UT74
    label: lys2
    gene_symbol: lys2
    organism: Schizosaccharomyces pombe
  - id: UniProtKB:Q58409
    label: hacA
    gene_symbol: hacA
    organism: Methanocaldococcus jannaschii
  - id: UniProtKB:Q94AR8
    label: IIL1
    gene_symbol: IIL1
    organism: Arabidopsis thaliana
    gene_review: genes/ARATH/IIL1/IIL1-ai-review.yaml
  diverged_from_family: true
  divergence_description: >-
    Most characterized members are homoaconitases rather than isopropylmalate isomerases. Fungal
    LYS4 only interconverts cis-homoaconitate and homoisocitrate. Methanogen HacA-HacB also
    dehydrates (R)-homocitrate and accepts longer-chain homologs for coenzyme B. The plant member
    IIL1 is instead an IPMI large subunit, so the divergence is not uniform across the subfamily.
  supported_by:
  - reference_id: PMID:23106124
    supporting_text: these enzymes only catalysed the interconversion between homoaconitate and homoisocitrate
  - reference_id: PMID:18765671
    supporting_text: HACN activity evolved in parallel in the archaeal and fungal lineages from isopropylmalate
      isomerase or aconitase ancestors, respectively.
  - reference_id: PMID:19597944
    supporting_text: Metabolic profiling of large subunit mutants revealed accumulation of intermediates
      of both Leu biosynthesis and Met chain elongation
- subfamily_id: PANTHER:PTHR43822:SF21
  label: 3-ISOPROPYLMALATE DEHYDRATASE LARGE SUBUNIT 1
  description: >-
    Contains Thermus thermophilus HacA (Q9ZNE0), the large subunit of the Thermus homoaconitase
    of its alpha-aminoadipate-type lysine pathway. Despite PANTHER's label, the characterized
    member is a homoaconitase.
  representative_members:
  - id: UniProtKB:Q9ZNE0
    label: hacA
    gene_symbol: hacA
    organism: Thermus thermophilus
  diverged_from_family: true
  divergence_description: >-
    The characterized member is a homoaconitase that hydrates cis-homoaconitate and does not act
    on cis-aconitate. The subfamily name implies isopropylmalate isomerase.
  supported_by:
  - reference_id: PMID:16524361
    supporting_text: HACN catalyses the hydration of cis-homoaconitate to (2R,3S)-homoisocitrate
- subfamily_id: PANTHER:PTHR43822:SF22
  label: ISOPROPYLMALATE_CITRAMALATE ISOMERASE LARGE SUBUNIT
  description: >-
    Archaeal IPMI/citramalate isomerase large subunits, including M. jannaschii LeuC/MJ0499
    (P81291). With MJ1277 it forms the isopropylmalate/citramalate isomerase of leucine and
    isoleucine synthesis.
  representative_members:
  - id: UniProtKB:P81291
    label: leuC
    gene_symbol: leuC
    organism: Methanocaldococcus jannaschii
  diverged_from_family: false
  supported_by:
  - reference_id: PMID:18765671
    supporting_text: identified one combination of M. jannaschii proteins (MJ0499 and MJ1277) as the isopropylmalate/citramalate
      isomerase that is involved in leucine and isoleucine biosyntheses
