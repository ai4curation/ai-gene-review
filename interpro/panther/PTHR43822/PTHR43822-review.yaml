family_id: PANTHER:PTHR43822
family_name: HOMOACONITASE, MITOCHONDRIAL-RELATED
preferred_name: Aconitase-family [4Fe-4S] hydro-lyase large subunits (LeuC isopropylmalate isomerase, homoaconitase, fused fungal LEU1)
summary: >-
  [4Fe-4S] hydro-lyases of the aconitase superfamily that isomerize 2-alkylmalates to 3-alkylmalates
  by dehydration followed by rehydration. The family holds the catalytic large subunit (LeuC) of
  bacterial, archaeal and plant isopropylmalate isomerase (IPMI). That enzyme is a LeuC-LeuD
  heteromer in which the small subunit, from a separate family (PTHR43345), supplies the
  substrate-recognition region. The fungal IPMI (S. cerevisiae LEU1, S. pombe leu2) is a single
  cytosolic monomer that carries both the large- and small-subunit regions. The family also
  holds homoaconitases. Fungal mitochondrial LYS4 hydrates cis-homoaconitate to homoisocitrate in
  the alpha-aminoadipate lysine pathway, and the preceding dehydration of homocitrate is done by
  an aconitase. Thermus HacA works in an alpha-aminoadipate-type lysine pathway. Methanogen HacA,
  partnered with HacB, catalyses both half-reactions on homocitrate-series substrates for
  coenzyme B. Plant IPMI large subunit IIL1 pairs with different small subunits to work in
  leucine synthesis or in methionine chain elongation for glucosinolates. Substrate specificity
  is therefore set partly by the large-subunit lineage and partly, in heteromeric enzymes, by
  the small subunit.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family lumps at least three activities: 3-isopropylmalate dehydratase (LeuC, LEU1/leu2,
  plant IIL1, M. jannaschii MJ0499), homoaconitate hydratase (fungal LYS4/lys2, Thermus HacA,
  methanogen HacA) and, for plant IIL1, isomerization of methylthioalkylmalates in glucosinolate
  chain elongation. PANTHER subfamilies do not separate these cleanly. SF2 (HOMOACONITASE,
  MITOCHONDRIAL) contains fungal LYS4 and S. pombe lys2, M. jannaschii HacA (MJ1003) and also
  the Arabidopsis IPMI large subunit IIL1. Drevland et al. conclude that methanogen and fungal
  homoaconitases evolved in parallel, so SF2's homoaconitases are not one clade of a single
  origin. SF9 (3-ISOPROPYLMALATE DEHYDRATASE) mixes the heteromeric bacterial LeuC subunits with
  the monomeric fused fungal LEU1/leu2. There are no PAINT annotations for this family, so no
  IBAs descend from it.
