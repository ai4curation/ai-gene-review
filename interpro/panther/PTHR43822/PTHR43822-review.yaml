notes: >-
  just fetch-panther-paint PTHR43822 returned no PAINT nodes, so no node assessments are possible
  and no IBA descends from this family. Subfamily placements of P07264, O14289, P49367, Q9UT74,
  Q94AR8 and Q88LE8 were confirmed against their UniProt PANTHER cross-references. Q58409
  (MJ1003), Q9ZNE0 (Thermus HacA) and P81291 (MJ0499) were placed from the family inventory.
  Assigning MJ1003 to hacA was checked against its UniProt ordered locus name.
