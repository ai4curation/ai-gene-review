term_assessments:
- assessed_term:
    id: GO:0002143
    label: tRNA wobble position uridine thiolation
  scope: UNRESOLVED
  scope_reason: >-
    Established for the gammaproteobacterial TusB orthologs used by the
    MnmA relay (E. coli experimentally; P. putida KT2440 PP_3995 by family
    signature and tus locus), but the single subfamily also holds Thermotoga and
    Dictyoglomus homologs whose role in tRNA thiolation is
    unknown, so the term cannot be granted family-wide. Missing evidence: tRNA
    thiolation data for the non-Tus members.
  supported_by:
  - reference_id: file:interpro/panther/PTHR37526/PTHR37526-paint.tsv
    supporting_text: "PTHR37526\tPTN002206503\tGO:0002143\tP\tIBD\tfalse"
  - reference_id: file:genes/ECOLI/tusB/tusB-uniprot.txt
    supporting_text: >-
      Part of a sulfur-relay system required for 2-thiolation of 5-
      methylaminomethyl-2-thiouridine (mnm(5)s(2)U) at tRNA wobble positions.
- assessed_term:
    id: GO:1990228
    label: sulfurtransferase complex
  scope: FAMILY_WIDE
  scope_reason: >-
    Every member in the reference tree is a small DsrEFH-fold protein encoded at
    consecutive loci with its two partner subunits (for example TM_0979-TM_0981
    and Dtur_0512-Dtur_0514 in the tree check); the term describes the heteromeric sulfur-transfer
    complex rather than tRNA-specific chemistry.
  supported_by:
  - reference_id: file:interpro/panther/PTHR37526/PTHR37526-paint.tsv
    supporting_text: "PTHR37526\tPTN002206503\tGO:1990228\tC\tIBD\tfalse"
- assessed_term:
    id: GO:0097163
    label: sulfur carrier activity
  scope: NOT_APPLICABLE
  scope_reason: >-
    TusB has no sulfur-carrying cysteine; only TusD Cys78 transfers sulfur in the
    TusBCD complex. TusB contributes to the complex's carrier activity as a
    structural subunit and should not be annotated as enabling it.
  supported_by:
  - reference_id: PMID:16472754
    supporting_text: >-
      In vivo mutant analyses revealed that only Cys78, in the TusD subunit,
      participates in sulfur transfer during the s2U modification process.
