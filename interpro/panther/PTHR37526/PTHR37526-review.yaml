family_id: PANTHER:PTHR37526
family_name: PROTEIN TUSB
preferred_name: TusB (DsrH-like) subunit of the TusBCD sulfur-relay complex
summary: >-
  Small DsrEFH-like proteins of the TusB/DsrH family. In Escherichia coli TusB is
  one of the three subunits of the heterohexameric TusBCD complex, which relays
  persulfide sulfur from TusA to TusE in the pathway that forms the 2-thio group
  of mnm5s2U at tRNA wobble position 34. TusB has no catalytic cysteine; the
  sulfur-carrying residue of the complex is on TusD. PANTHER defines a single
  subfamily. Most members are gammaproteobacterial Tus orthologs, but the
  reference tree also places DsrEFH-like homologs of Thermotoga maritima and
  Dictyoglomus turgidum under the same PAINT node.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family has one subfamily (SF1, PROTEIN TUSB) and the single PAINT node
  (PTN002206503, Bacteria) assigns the TusBCD complex and wobble-uridine
  thiolation, seeded by E. coli TusB. The characterized members are TusB orthologs
  encoded with TusC and TusD homologs; no member with a divergent function is
  documented, but the roles of the Thermotoga and Dictyoglomus homologs
  under the same node are not established (tree check).
