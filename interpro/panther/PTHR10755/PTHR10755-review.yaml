family_id: PANTHER:PTHR10755
family_name: COPROPORPHYRINOGEN III OXIDASE, MITOCHONDRIAL
preferred_name: Oxygen-dependent coproporphyrinogen III oxidase (HemF/CPOX/HEM13) family
summary: >-
  Oxygen-dependent coproporphyrinogen III oxidases (EC 1.3.3.3) use molecular oxygen to
  oxidatively decarboxylate the propionate side chains of pyrrole rings A and B of
  coproporphyrinogen III, giving the vinyl groups of protoporphyrinogen IX. The family is a
  single conserved enzyme lineage found in aerobic proteobacteria and cyanobacteria (HemF),
  fungi (S. cerevisiae HEM13, S. pombe hem13), animals (human CPOX) and plant plastids.
  Location follows the host lineage: bacterial HemF and yeast HEM13 are soluble cytoplasmic
  enzymes, animal CPOX is imported into the mitochondrial intermembrane space, and plant
  enzymes are plastidic. Under anaerobic conditions the same step is catalysed by the
  unrelated radical SAM HemN enzymes (PTHR13932).
functional_coherence: COHERENT
coherence_reason: >-
  All PANTHER subfamilies (SF0 and the plant-specific SF3, SF9 and SF10) are
  coproporphyrinogen III oxidases; no characterized member performs a different reaction.
