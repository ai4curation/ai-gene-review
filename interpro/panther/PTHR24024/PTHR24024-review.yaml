    assessment: SOUND
    assessment_reason: >-
      All collectins are secreted; the seed list spans both the serum
      (MBL/CL-10/CL-11) and surfactant (SP-A/SP-D) branches, so the deep
      eumetazoan placement is safe family-wide. MBL2's own EXP/IDA
      extracellular evidence is among the descendant support (expected, not
      circular). The cached human GOA row for this IBA (2026-05-29) cites an
      older node id (PTN002369884); the current snapshot re-asserts it here.
  - node_id: PANTHER:PTN001167206
    asserted_term:
      id: GO:0038187
      label: pattern recognition receptor activity
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20260803"
    seeds:
      - id: RGD:67380
      - id: UniProtKB:P11226
        label: Mannose-binding protein C
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Soluble pattern-recognition activity is the family's shared core: both
      the complement branch and the surfactant branch recognize microbial
      carbohydrate patterns via the Ca2+-dependent CRD. A two-seed donor list
      is not weak support - the claim is about where the function arose, and
      it is consistent with every characterized member. Propagation to human
      MBL2 would be sound and is grounded on MBL2's own IDA (PMID:9087411);
      the IBA does not yet appear in the cached GOA only because the IBD
      (2026-08-03) postdates the GOA fetch.
  - node_id: PANTHER:PTN001167206
    asserted_term:
      id: GO:0001867
      label: complement activation, lectin pathway
    node_taxon:
      id: NCBITaxon:6072
      label: Eumetazoa
    paint_snapshot: "20260803"
    seeds:
      - id: MGI:MGI:96923
      - id: MGI:MGI:96924
      - id: RGD:3055
      - id: UniProtKB:P11226
        label: Mannose-binding protein C
        organism: Homo sapiens
      - id: UniProtKB:Q9BWP8
        label: Collectin-11
        organism: Homo sapiens
      - id: UniProtKB:Q9Y6Z7
        label: Collectin-10
        organism: Homo sapiens
    assessment: NEEDS_PRUNING
    assessment_reason: >-
      Every seed is a MASP-coupled complement activator (MBL orthologs,
      CL-10, CL-11), and for that branch the assertion is exactly right - it
      would give human MBL2 a sound IBA grounded partly on its own IDA
      evidence. But this is the same deep eumetazoan node whose GO:0005576
      assertion is seeded with SP-A/SP-D, so the surfactant branch descends
      from it and would inherit lectin-pathway complement activation, which is
      not established for SP-A or SP-D (their innate defense is largely
      complement/MASP-independent). Whether MASP-coupled activation is
      ancestral and lost in the surfactant branch, or arose after the split,
      cannot be settled from this slice; either way the surfactant clade
      (SF13/SF15) should carry an IRD/NOT so the term does not descend into
      it.
    affected_subfamilies:
      - id: PANTHER:PTHR24024:SF13
        label: PULMONARY SURFACTANT-ASSOCIATED PROTEIN A1
      - id: PANTHER:PTHR24024:SF15
        label: PULMONARY SURFACTANT-ASSOCIATED PROTEIN D
  - node_id: PANTHER:PTN001523874
    asserted_term:
      id: GO:0043129
      label: surfactant homeostasis
    node_taxon:
      id: NCBITaxon:32524
      label: Amniota
    paint_snapshot: "20260828"
    seeds:
      - id: MGI:MGI:109515
      - id: RGD:3667
      - id: UniProtKB:P35247
        label: Pulmonary surfactant-associated protein D
        organism: Homo sapiens
    assessment: TOO_DEEP
    assessment_reason: >-
      The seeds are exclusively surfactant-branch collectins, for which the
      term is experimentally sound. But human MBL2 - a liver-derived serum
      lectin with no surfactant biology - has carried an IBA to this term
      citing this very node since 2017 (still present in the cached GOA),
      which means the MBL clade descends from the assertion point and wrongly
      inherits the term. The MBL2 gene review REMOVEs that IBA
      (propagation_review root cause PROPAGATION_BAD), corroborated by a
      focused OpenScientist adjudication that refuted surfactant homeostasis
      as a direct MBL2 function. The function belongs at (or should be pruned
      down to) the surfactant clade (SF13/SF15) rather than any node that
      contains the MBL/collectin-10/11 branch.
    affected_subfamilies:
      - id: PANTHER:PTHR24024:SF34
        label: MANNOSE-BINDING PROTEIN C
      - id: PANTHER:PTHR24024:SF35
        label: MANNOSE-BINDING PROTEIN A
  - node_id: PANTHER:PTN002771384
    asserted_term:
      id: GO:0050766
      label: positive regulation of phagocytosis
    node_taxon:
      id: NCBITaxon:117571
      label: Euteleostomi
    paint_snapshot: "20260803"
    seeds:
      - id: MGI:MGI:96923
      - id: MGI:MGI:96924
      - id: RGD:3665
      - id: RGD:3667
      - id: UniProtKB:P11226
        label: Mannose-binding protein C
        organism: Homo sapiens
    assessment: SOUND
    assessment_reason: >-
      Enhancement of phagocytosis of bound microbes is genuinely shared across
      both branches - MBL as a complement-depositing opsonin, SP-A/SP-D as
      direct opsonins in the alveolus - and the seed list draws on both. Human
      MBL2 receives this IBA (cached GOA, 2022) and the gene review keeps it
      as a genuine, downstream, non-core function. Note that the cached GOA
      row for MBL2's GO:0005771 multivesicular-body IBA cites this same node
      id, but no GO:0005771 IBD exists anywhere in the current PAINT
      snapshot: that assertion - a surfactant-branch trafficking compartment
      that never fit serum MBL, and which the MBL2 gene review REMOVEs - has
      been withdrawn by PAINT, and the stale GOA row should lapse when the new
      snapshot flows through.

term_assessments:
  - assessed_term:
      id: GO:0120153
      label: calcium-dependent carbohydrate binding
    scope: FAMILY_WIDE
    scope_reason: >-
      Ca2+-dependent recognition of carbohydrate via the C-type CRD is the
      defining, conserved molecular function of every collectin in the family,
      in both the serum and surfactant branches. Safe at family level and the
      best candidate for a family-wide MF assertion in a future PAINT pass.
    supported_by:
      - reference_id: PMID:6643429
        supporting_text: A serum lectin specific for mannose and N-acetylglucosamine residues was
      - reference_id: PMID:8082295
        supporting_text: The binding was inhibited by unlabelled MBP, by mannose and by N-acetyl-D-glucosamine
  - assessed_term:
      id: GO:0001867
      label: complement activation, lectin pathway
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      MASP-coupled lectin-pathway activation is established for the MBL and
      collectin-10/11 subfamilies but not for the pulmonary surfactant
      collectins; it must not descend family-wide (see the PTN001167206
      adjudication). Collectin-10's subfamily is outside the fetched
      reviewed-entry slice, so only slice-verified subfamilies are listed.
    applicable_subfamilies:
      - id: PANTHER:PTHR24024:SF34
        label: MANNOSE-BINDING PROTEIN C
      - id: PANTHER:PTHR24024:SF35
        label: MANNOSE-BINDING PROTEIN A
      - id: PANTHER:PTHR24024:SF14
        label: COLLECTIN-11
    supported_by:
      - reference_id: PMID:9087411
        supporting_text: complement activation through MBL, like the classical pathway,
  - assessed_term:
      id: GO:0043129
      label: surfactant homeostasis
    scope: SUBFAMILY_ONLY
    scope_reason: >-
      A pulmonary-surfactant-branch function only. Its historical propagation
      onto serum MBL2 is a documented IBA failure (removed in the MBL2 gene
      review with OpenScientist corroboration); a future PAINT pass should
      keep it inside the surfactant clade.
    applicable_subfamilies:
      - id: PANTHER:PTHR24024:SF13
        label: PULMONARY SURFACTANT-ASSOCIATED PROTEIN A1
      - id: PANTHER:PTHR24024:SF15
        label: PULMONARY SURFACTANT-ASSOCIATED PROTEIN D

