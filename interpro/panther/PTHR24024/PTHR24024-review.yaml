notes: >-
  Written alongside the human MBL2 gene review (genes/human/MBL2). All node
  ids, seeds, taxa and snapshot dates are verbatim from the cached
  PTHR24024-paint.tsv; subfamily ids/labels verified against panther.obo;
  human-member subfamily assignments (MBL2=SF34, SFTPD=SF15, COLEC11=SF14)
  from the fetched PTHR24024-entries.csv (44 reviewed proteins of 4456 family
  members across ~2600 taxa; SP-A1 human entries and COLEC10 are outside the
  reviewed slice, though Q8IWL1/Q8IWL2 and Q9Y6Z7 appear among IBD seeds).
  MGI/RGD seed accessions are copied verbatim without gene-symbol labels
  because they were not independently resolved. Contrary to the project's
  "no-IBA" framing, MBL2 does receive IBAs; the real story here is IBA churn:
  the current (Aug 2026) PAINT snapshot has withdrawn the bad
  multivesicular-body assertion, added sound family-root assertions
  (extracellular region, PRR activity) whose IBAs have not yet reached the
  cached GOA, kept a sound phagocytosis assertion, but still asserts
  surfactant homeostasis at a node from which MBL2 has historically inherited
  it, and asserts lectin-pathway activation at a root node that the
  surfactant branch also descends from. Propagation of GO:0038187 and
  GO:0001867 to human MBL2 itself would be entirely sound (both are backed by
  MBL2's own IDA evidence); the pruning needs are all about the surfactant
  branch. No residue_sites: the branch split is an effector-wiring
  (MASP-coupling and tissue-context) divergence, not a point-residue
  question.
