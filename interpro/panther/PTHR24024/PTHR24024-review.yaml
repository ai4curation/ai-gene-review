family_id: PANTHER:PTHR24024
family_name: PULMONARY SURFACTANT-ASSOCIATED PROTEIN A
preferred_name: Collectin family (MBL, collectin-10/11, and pulmonary surfactant proteins SP-A/SP-D)
summary: >-
  Family of collagenous C-type lectins (collectins): secreted proteins that
  combine a collagen-like region with a Ca2+-dependent C-type
  carbohydrate-recognition domain and oligomerize into multivalent
  pattern-recognition molecules of innate immunity. The family name is
  dominated by one member (SP-A); the family in fact splits into two
  functionally distinct branches. The serum/complement branch - mannose-binding
  lectin (human MBL2, rodent Mbl1/Mbl2) and collectin-10/11 (CL-L1/CL-K1) -
  recognizes microbial carbohydrate patterns and activates the lectin pathway
  of complement through associated MASP serine proteases. The pulmonary
  surfactant branch - SP-A and SP-D - acts in the alveolar lining, where it
  contributes to surfactant homeostasis and largely complement-independent
  opsonization and immune modulation. Shared, family-wide biology: secretion,
  Ca2+-dependent carbohydrate binding, pattern-recognition activity, and
  enhancement of phagocytosis of bound microbes. Branch-specific biology
  (lectin-pathway complement activation; surfactant homeostasis and its
  multivesicular-body/lamellar-body trafficking compartment) does not
  propagate safely across the family, and both directions of leakage have
  occurred in past PAINT-derived IBAs on human MBL2.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Coherent at the level of secreted, Ca2+-dependent collectin
  pattern-recognition activity, but the family lumps two effector-distinct
  branches: MASP-coupled complement activators (MBL, CL-10/CL-11) versus
  pulmonary surfactant collectins (SP-A/SP-D) with surfactant-homeostasis and
  pneumocyte-trafficking biology. Downstream process and compartment terms are
  branch-specific, which is exactly where the observed IBA over-propagation
  onto MBL2 (surfactant homeostasis, multivesicular body) came from.
reference_protein:
  id: UniProtKB:P11226
  label: Mannose-binding protein C
  gene_symbol: MBL2
  organism: Homo sapiens (Human)

subfamilies:
  - subfamily_id: PANTHER:PTHR24024:SF34
    label: MANNOSE-BINDING PROTEIN C
    description: >-
      MBL-C orthologs including human MBL2, the prototypic lectin-pathway
      initiator: Ca2+-dependent mannose/GlcNAc/fucose recognition of microbial
      surfaces, MASP association, complement activation, opsonization.
    representative_members:
      - id: UniProtKB:P11226
        label: Mannose-binding protein C
        gene_symbol: MBL2
        organism: Homo sapiens (Human)
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR24024:SF14
    label: COLLECTIN-11
    description: >-
      Collectin-11 (CL-K1) orthologs; plasma collectins that associate with
      MASPs and activate the lectin pathway, functionally aligned with the MBL
      branch.
    representative_members:
      - id: UniProtKB:Q9BWP8
        label: Collectin-11
        gene_symbol: COLEC11
        organism: Homo sapiens (Human)
    diverged_from_family: false
  - subfamily_id: PANTHER:PTHR24024:SF15
    label: PULMONARY SURFACTANT-ASSOCIATED PROTEIN D
    description: >-
      SP-D orthologs: airway/alveolar collectins acting in surfactant biology
      and complement-independent microbial aggregation/opsonization.
    representative_members:
      - id: UniProtKB:P35247
        label: Pulmonary surfactant-associated protein D
        gene_symbol: SFTPD
        organism: Homo sapiens (Human)
    diverged_from_family: true
    divergence_description: >-
      Diverged from the complement-activating branch: SP-D acts in the alveolar
      lining in surfactant homeostasis and MASP-independent innate defense;
      lectin-pathway complement activation is not established for it.
  - subfamily_id: PANTHER:PTHR24024:SF13
    label: PULMONARY SURFACTANT-ASSOCIATED PROTEIN A1
    description: >-
      SP-A orthologs: the surfactant-associated collectins of the alveolar
      lining (surfactant homeostasis, tubular myelin, complement-independent
      opsonization and immunomodulation); trafficked through pneumocyte
      lamellar/multivesicular compartments.
    diverged_from_family: true
    divergence_description: >-
      Same divergence as SF15: alveolar surfactant biology instead of
      MASP-coupled complement activation, with an intracellular trafficking
      compartment (lamellar/multivesicular bodies) alien to the serum branch.

