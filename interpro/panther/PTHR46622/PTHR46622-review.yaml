family_id: PANTHER:PTHR46622
family_name: DNA-DEPENDENT METALLOPROTEASE WSS1
summary: Wss1-related metalloproteases act in the resolution of DNA-associated protein obstacles, including
  DNA-protein crosslinks. DNA association and recruitment mechanisms couple proteolysis to genome-maintenance
  pathways.
functional_coherence: MOSTLY_COHERENT
coherence_reason: Budding-yeast Wss1 experiments directly demonstrate DNA-dependent proteolysis of topoisomerase
  substrates and protection against DNA-protein crosslinks (PMID:24998930). Pombe Wss1 has the WLM metalloprotease
  domain and a Wss1-family assignment, supporting a conserved mechanistic inference. It is not a DNA nuclease,
  and particular SUMO-dependent recruitment mechanisms or lesion preferences are not established merely
  by membership.
