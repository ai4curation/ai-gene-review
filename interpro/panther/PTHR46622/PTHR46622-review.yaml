    supporting_text: 'Notably, in vitro assays indicate

      that substrates such as topoisomerase 1 are processed by the metalloprotease

      directly and in a DNA-dependent manner.'
  - reference_id: file:genes/SCHPO/wss1/wss1-uniprot.txt
    supporting_text: DR   Pfam; PF08325; WLM; 1.
  - reference_id: file:projects/PROTNLM_EVALUATION/family-curation/PTHR46622-evidence.md
    supporting_text: Metalloendopeptidase that acts selectively on DNA-binding proteins. DNA is needed
      to bring the protease and substrates together to enable proteolysis. Involved in the repair of toxic
      DNA-protein cross-links (DPCs) such as covalently trapped topoisomerase 1 (top1) adducts on DNA
      lesions or DPCs induced by reactive compounds such as formaldehyde. Involved in DNA damage response
      and processing of stalled or collapsed replication forks by removing the covalently trapped top1
      from chromatin. DPC proteolysis enables the repair of the lesions via downstream DNA repair pathways.
      May be recruited to DPCs via the SUMOylation of substrate proteins at damaged DNA sites (By similarity)
