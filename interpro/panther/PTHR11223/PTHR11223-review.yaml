family_id: PANTHER:PTHR11223
family_name: EXPORTIN 1/5
preferred_name: Exportin-1 and exportin-5 transport receptors
summary: Exportins mediate nuclear export of distinct cargo classes. Exportin-1 recognizes protein export
  signals, whereas exportin-5 and related receptors export structured RNAs and selected other cargos.
functional_coherence: HETEROGENEOUS
coherence_reason: The Drosophila virilis target has exportin-5 architecture. Cytoplasmic residence is
  compatible with the transport cycle, but it does not identify cargo specificity or mean that the protein
  is excluded from the nucleus. Exportin-1 cargo biology should not be inherited by exportin-5 solely
  from the combined family.
