    label: cytoplasm
  scope: UNRESOLVED
  scope_reason: Exportins shuttle cargo through a nucleus-to-cytoplasm transport cycle; cytoplasmic cargo
    detection alone is not a direct localization assay of every exportin. The Drosophila Exp5 study establishes
    RNA binding and export, and the virilis target has exportin-5 architecture. This supports a nucleocytoplasmic
    context without treating cytoplasm as exclusive or transferring exportin-1 protein-cargo specificity
    to exportin-5.
