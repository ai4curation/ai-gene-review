family_id: PANTHER:PTHR11941
family_name: ENOYL-COA HYDRATASE-RELATED
preferred_name: Crotonase superfamily (enoyl-CoA hydratases, isomerases, decarboxylases and relatives)
summary: >-
  The crotonase (enoyl-CoA hydratase/isomerase, ClpP/crotonase fold) superfamily as PANTHER
  groups it. Members bind acyl-CoA thioesters in a conserved oxyanion hole that stabilizes a
  thioester enolate, but use that common chemistry for very different reactions. Classical
  enoyl-CoA hydratases (mitochondrial ECHS1; bacterial PaaF) hydrate trans-2-enoyl-CoA using two
  catalytic glutamates; Delta3,Delta2-enoyl-CoA isomerases (ECI1, plant ECI/IBR10) move the double
  bond with a single acid/base; AUH and its plant ortholog hydrate 3-methylglutaconyl-CoA in leucine
  catabolism; ECHDC1 and E. coli ScpB (YgfG) are decarboxylases (ethylmalonyl-/methylmalonyl-CoA);
  E. coli CaiD hydrates crotonobetainyl-CoA in carnitine metabolism; and PaaG isomerizes ring
  1,2-epoxyphenylacetyl-CoA to oxepin-CoA. In the aerobic phenylacetate pathway two crotonase
  members act back to back: PaaG (subfamily SF133 in PANTHER 19.0) and the 2,3-dehydroadipyl-CoA
  hydratase PaaF (SF54), which form a stable heterocomplex whose active sites are adapted to the
  ring-derived Paa intermediates. Eukaryotic members are targeted to mitochondria or peroxisomes,
  bacterial ones are cytosolic.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The fold and the thioester-enolate chemistry are shared, but reaction class diverges between
  subfamilies (hydratase: ECHS1/PaaF/CaiD/AUH; isomerase: ECI1, plant ECI, PaaG; decarboxylase:
  ECHDC1, ScpB) and pathway diverges even more (fatty acid beta-oxidation, leucine catabolism,
  carnitine metabolism, propionate metabolism, metabolite repair, phenylacetate catabolism,
  polyketide synthesis via PksI in SF133). Subfamily SF54 is itself mixed: PANTHER 19.0 places
  mammalian ECHS1, E. coli PaaF, CaiD (crotonobetainyl-CoA hydratase) and ScpB (methylmalonyl-CoA
  decarboxylase) together. No activity or process term below "hydro-lyase"/"isomerase" level is
  safe at the family root, and even SF54-scoped terms need member exceptions.
