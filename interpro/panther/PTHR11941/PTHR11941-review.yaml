family_id: PANTHER:PTHR11941
family_name: ENOYL-COA HYDRATASE-RELATED
preferred_name: Crotonase-like hydratase/isomerase family with heterogeneous reactions
summary: The reviewed inventory includes enoyl-CoA hydratases, enoyl-CoA isomerases, methylglutaconyl-CoA
  hydratase and ethylmalonyl-CoA decarboxylase. Bacillus subtilis 168 FadB/YsiB P94549 is a verified SF175
  member with directly measured recombinant crotonyl-CoA hydration. The common fold and family label do
  not determine the reaction or native pathway for every member.
functional_coherence: HETEROGENEOUS
coherence_reason: Inventory examples include P30084 enoyl-CoA hydratase, P42126 enoyl-CoA delta isomerase,
  Q13825 methylglutaconyl-CoA hydratase and Q9NTX5 ethylmalonyl-CoA decarboxylase in distinct subfamilies.
  Their assignments are used to bound transfer, not as new biochemical measurements. The metadata prose
  is marked unchecked LLM-generated and is not functional evidence.
