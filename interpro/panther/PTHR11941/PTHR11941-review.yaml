  scope: UNRESOLVED
  scope_reason: Direct purified recombinant strain168 FadB supports the reversible 2-enoyl reaction, using
    crotonyl-CoA as substrate. This positive member supports the gene core, but the reviewed inventory
    and limited primary coverage cannot justify an exhaustive SF175 grant. Neither alternative hydratase
    substrates nor isomerase/decarboxylase reactions elsewhere in the family imply this exact activity.
