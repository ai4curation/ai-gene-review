  assessment_reason: >-
    PTN000941828 is PTHR11941:AN0, the root of the whole crotonase family, so fatty acid
    beta-oxidation descends to every member, including AUH (leucine catabolism), PaaG and PaaF
    (phenylacetate catabolism), CaiD (carnitine metabolism), ScpB and ECHDC1 (decarboxylases) and
    PksI (polyketide synthesis). The seeds are all mitochondrial beta-oxidation enzymes (ECHS1 and
    ECI1 orthologs), i.e. the function is evidenced only on the ECHS1 (SF54 eukaryotic) and ECI1
