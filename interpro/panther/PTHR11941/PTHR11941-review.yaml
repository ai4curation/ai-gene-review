    clades. Clades that never had it and inherit it here include SF133 (PaaG; its active site is
    adapted to Paa intermediates, PMID:22961985) and SF27 (ECHDC1 decarboxylases); within SF54 the
    bacterial PaaF is recorded as a member exception (see term assessment). Consistent with this,
    the E. coli paaG review REMOVEs and the paaF review marks the inherited IBA over-annotated, and
    the AUH review leaves it UNDECIDED.
