  name:
    name: Kynurenine--oxoglutarate transaminase
    short: Kynurenine-oxoglutarate_AT
  description:
  - text: The Kynurenine--oxoglutarate transaminase family includes enzymes that catalyze
      the irreversible transamination of L-kynurenine to form kynurenic acid, an intermediate
      in the tryptophan catabolic pathway and a broad-spectrum antagonist of ionotropic
      excitatory amino acid receptors. Members of the family also metabolize cysteine
      conjugates of halogenated alkenes and alkanes to form reactive metabolites and
      catalyze the beta-elimination of S-conjugates and Se-conjugates of L-(seleno)cysteine,
      resulting in the cleavage of the C-S or C-Se bond. Some members show activity
      with various amino acids and keto-acids as amino group acceptors. The family
      belongs to the class-I pyridoxal-phosphate-dependent aminotransferase family,
      indicating a dependence on pyridoxal phosphate as a cofactor for their enzymatic
      activity.
