  name:
    name: Gamma-glutamyl amide hydrolase
    short: Gamma-glu_amide_hydrolase
  description:
  - text: This family of proteins includes enzymes that are involved in the hydrolysis
      of gamma-glutamyl amide bonds in specific substrates. Members of this family
      play a role in the biosynthesis of ergothioneine, an important antioxidant that
      protects certain bacteria from oxidative stress. Ergothioneine acts as a redox
      buffer, safeguarding bacterial cells against redox stressors and antibiotics,
      which can lead to respiratory alterations and bioenergetic deficiencies impacting
      virulence. Additionally, some family members are implicated in the degradation
      of glutathione and other peptides containing a gamma-glu-X bond, suggesting
      a broader role in amino acid and peptide metabolism.
