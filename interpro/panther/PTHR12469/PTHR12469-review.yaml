review_status: COMPLETE
reviewed_by: codex
review_date: '2026-09-10'
notes: The exact mouse product retains all 27 reference transit-peptide residues. The altered C-terminus
  is a product-integrity qualification; no ancestral loss or full-length-family inactivity is inferred.
  The gene-level EMT and beta-catenin effects have primary evidence in PMID:23983127, but are context-dependent
  outcomes and not family-wide maturation functions.
term_assessments:
- assessed_term:
    id: GO:0018293
    label: protein-FAD linkage
  scope: UNRESOLVED
  scope_reason: Covalent flavin attachment is directly supported for characterized intact SDHAF2 proteins.
    The family-level maturation mechanism is coherent, but the selected mouse product lacks the intact
    reference C-terminal segment. This assessment does not grant full activity to every partial or alternative
    product and does not assert catalytic loss solely from shorter length.
  supported_by:
  - reference_id: PMID:32887801
    supporting_text: "works in synergy with SDHAF2 to properly orient the flavin and \ncapping domains\
      \ of SDHA"
  - reference_id: file:genes/mouse/Sdhaf2/Sdhaf2-bioinformatics/RESULTS.md
    supporting_text: Selected A0A494B8X4 has 135 residues; reference Q8C6I2 has 164 residues.
