family_id: PANTHER:PTHR12469
family_name: PROTEIN EMI5 HOMOLOG, MITOCHONDRIAL
summary: SDHAF2/Sdh5/SdhE proteins promote maturation of the succinate-dehydrogenase flavoprotein, particularly
  covalent flavinylation. They help establish a catalytically competent flavoprotein rather than serving
  as the respiratory substrate-oxidizing enzyme. The same assembly principle spans mitochondrial and bacterial
  systems.
functional_coherence: COHERENT
coherence_reason: The conserved biological role is flavoprotein maturation, supported by human SDHA-SDHAF2
  structure/reconstitution and mouse myocyte rescue experiments. Assembly-factor action is distinct from
  the electron-transfer reaction of the mature complex. The selected short mouse product retains its targeting
  peptide but has an altered C-terminal region, so full assembly activity cannot be assumed for that product.
subfamilies:
- subfamily_id: PANTHER:PTHR12469:SF2
  label: SUCCINATE DEHYDROGENASE ASSEMBLY FACTOR 2, MITOCHONDRIAL
  description: Mitochondrial Sdhaf2 assembly-factor branch. The selected 135-residue mouse product matches
    the first 122 residues of the 164-residue reference almost exactly, including the complete transit
    peptide, and then has an alternative tail. Mitochondrial localization is supported; preservation of
    SDHA binding and flavinylation remains unresolved.
  representative_members:
