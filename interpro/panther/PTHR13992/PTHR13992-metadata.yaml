  name:
    name: Nuclear receptor corepressor
    short: N-CoR_corepressor
  description:
  - text: This family of proteins functions as transcriptional corepressors for nuclear
      receptors. They are involved in chromatin condensation, which restricts access
      of basal transcription machinery to DNA, thereby repressing gene expression.
      Members of this family contain conserved CORNR box motifs that are essential
      for binding to unligated nuclear hormone receptors. Flanking sequences of the
      CORNR box determine specificity for different nuclear receptors. These proteins
      are implicated in various biological processes including the regulation of circadian
      rhythm, lipid metabolism in the liver, and cellular proliferation. They participate
      in complexes that promote histone deacetylation, contributing to the formation
      of repressive chromatin structures. Additionally, they play roles in the regulation
      of B-cell proliferation and survival within germinal centers, and are involved
      in androgen receptor signaling.
