  name:
    name: Cell Adhesion and Viral Modulation Protein
    short: Cell_Adhesion-Viral_Mod
  description:
  - text: This family of proteins includes diverse members with various functions
      related to cellular and viral processes. Some proteins in this family are involved
      in cell adhesion and cytoskeletal organization, facilitating actin-membrane
      attachment at focal adhesion sites and recruiting other proteins to these sites.
      Other members are viral proteins that play roles in the viral life cycle, including
      capsid transport, uncoating, and modulation of host immune responses. These
      viral proteins can act as deneddylases, interfering with host cell cycle progression
      and promoting viral genome replication. They may also inhibit host defense mechanisms
      by affecting ubiquitination pathways and autophagy. Additionally, the family
      includes proteins that are structural components of extracellular matrices or
      involved in species-specific fertilization processes.
