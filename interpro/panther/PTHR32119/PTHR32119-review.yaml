family_id: PANTHER:PTHR32119
family_name: OROTIDINE 5'-PHOSPHATE DECARBOXYLASE
preferred_name: Monofunctional OMP decarboxylase family (PyrF/URA3)
summary: >-
  Monofunctional orotidine 5'-phosphate decarboxylases (ODCase; PyrF in bacteria, URA3/ura4/pyrG
  in fungi) decarboxylate OMP to UMP, the last step of de novo UMP synthesis. The 455 reviewed
  members are all in the single subfamily SF2 and are 201 to 397 residues long. Most are
  bacterial PyrF (E. coli, Bacillus, Pseudomonas, Streptococcus, cyanobacteria and others); the
  family also holds archaeal PyrF and the fungal ODCases of yeasts and filamentous fungi
  (S. cerevisiae URA3, Candida URA3, Aspergillus pyrG, Neurospora pyr-4). The longest members
  (about 380 to 400 residues) are from filamentous ascomycetes. PANTHER's own classification also
  places S. pombe ura4 here, although UniProt cross-references it to PTHR19278. Animal and plant
  ODCase activity resides instead in the C-terminal domain of the bifunctional UMP synthase
  (PTHR19278).
functional_coherence: COHERENT
coherence_reason: >-
  Every reviewed member is named and annotated as orotidine 5'-phosphate decarboxylase, the
  lengths are consistent with a single ODCase domain, and PANTHER defines no further subfamily.
  Experimentally characterised members from bacteria (E. coli pyrF) and fungi (S. cerevisiae
  URA3, S. pombe ura4, Aspergillus pyrG) all have the activity.
