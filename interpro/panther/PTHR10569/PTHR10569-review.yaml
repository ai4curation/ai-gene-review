family_id: PANTHER:PTHR10569
family_name: GLYCOGEN DEBRANCHING ENZYME
preferred_name: Eukaryotic glycogen debranching enzyme family (GDB1/AGL)
summary: >-
  The bifunctional glycogen debranching enzyme of fungi and animals has a 4-alpha-glucanotransferase
  domain that moves a maltotriosyl unit from a phosphorylase-limit branch to the main chain, and
  an amylo-alpha-1,6-glucosidase domain that releases the remaining branch-point glucose.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF2) of bifunctional debranching enzymes, including S. cerevisiae GDB1 and
  human AGL.
