family_id: PANTHER:PTHR13906
family_name: PORCUPINE
preferred_name: MBOAT lysophospholipid acyltransferase / Porcupine family
summary: >-
  Membrane-bound O-acyltransferases. Lysophospholipid acyltransferases (S. cerevisiae ALE1, S. pombe
  ale1, human LPCAT3, MBOAT1/2/7) reacylate lysophospholipids in the Lands cycle. The family also
  contains Porcupine, which palmitoleoylates Wnt proteins, and ghrelin O-acyltransferase (GOAT),
  which octanoylates ghrelin.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  Lysophospholipid acyltransferases (SF4, SF14, SF6, SF7, SF16, SF18) and protein O-acyltransferases
  (Porcupine SF12, GOAT SF3) act on different acceptors.
