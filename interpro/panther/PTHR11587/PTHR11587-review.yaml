- node_id: PANTHER:PTN000172504
  asserted_term:
    id: GO:0000050
    label: urea cycle
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: RGD:2163
  - id: UniProtKB:P00966
  assessment: TOO_DEEP
  assessment_reason: >-
    The only seeds are mammalian (rat and human ASS1), but the assertion sits at the family root and so
    reaches bacterial ArgG. GO:0000050 is a cycle in which arginine is cleaved to urea and ornithine; it
    holds where a urea-producing arginase closes the cycle (mammals, and fungi, where yeast ARG1 and S.
    pombe arg12 keep the IBA as non-core) but not for Synechocystis ArgG, whose characterized cycle
    returns ornithine through the ArgZ arginine dihydrolase and releases ammonia, nor for P. putida
    KT2440 ArgG, whose arginine catabolism runs through other pathways. Both bacterial reviews mark the
    urea-cycle rows as over-annotated. PAINT already blocks the protostome clade with an IRD (next
    node assessment). A node limited to eukaryotes with a urea-producing arginase would fit the seeds;
    the bacterial branches should not inherit the term.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11587/PTHR11587-paint.tsv
    supporting_text: "PTHR11587\tPTN000172504\tGO:0000050\tP\tIBD\tfalse\tRGD:2163|UniProtKB:P00966\ttaxon:\t20170228"
  - reference_id: file:genes/SYNY3/argG/argG-ai-review.yaml
    supporting_text: ArgZ rather than urea, so the urea-cycle term over-states the target pathway.
  - reference_id: file:genes/PSEPK/argG/argG-ai-review.yaml
    supporting_text: ArgG biosynthetic chemistry alone does not establish a complete urea-cycle role in
      KT2440.
  - reference_id: file:genes/yeast/ARG1/ARG1-ai-review.yaml
    supporting_text: The target has the annotated OTC/ASS/ASL reaction and native fungal arginase supplies
      the return chemistry.
- node_id: PANTHER:PTN002612332
  asserted_term:
    id: GO:0000050
    label: urea cycle
  evidence: IRD
  negated: true
  node_taxon:
    id: NCBITaxon:33317
    label: Protostomia
  paint_snapshot: '20260126'
  seeds:
  - id: PANTHER:PTN000172504
  assessment: LOSS_SUPPORTED
  assessment_reason: >-
    The protostome branch is excluded from the urea cycle. This matches the Drosophila Ass review, which
    removes a urea-cycle mapping because insects lack ornithine carbamoyltransferase and cannot run the
    cycle; the IRD blocks inheritance of the root urea-cycle assertion in that clade while leaving the
    activity and arginine-biosynthesis assertions intact.
  supported_by:
  - reference_id: file:interpro/panther/PTHR11587/PTHR11587-paint.tsv
    supporting_text: "PTHR11587\tPTN002612332\tGO:0000050\tP\tIRD\ttrue\tPANTHER:PTN000172504\ttaxon:33317\t20260126"
  - reference_id: file:genes/DROME/Ass/Ass-ai-review.yaml
    supporting_text: no insect can synthesize arginine via the urea cycle, as ornithine carbamoyltransferase
      is absent from all genomes analysed
