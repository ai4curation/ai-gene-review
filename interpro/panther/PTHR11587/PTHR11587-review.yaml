family_id: PANTHER:PTHR11587
family_name: ARGININOSUCCINATE SYNTHASE
preferred_name: Argininosuccinate synthase (ArgG/ASS1)
summary: >-
  Type-1 argininosuccinate synthases, the ATP-dependent enzymes that condense L-citrulline and L-aspartate
  to argininosuccinate, the penultimate step of L-arginine biosynthesis. The family spans bacterial and
  cyanobacterial ArgG, fungal ARG1/arg12, plant chloroplastic ASS and animal ASS1. All PAINT IBD assertions
  sit at one root node (PTN000172504): argininosuccinate synthase activity, L-arginine biosynthesis, cytosol
  and urea cycle, with a negated urea-cycle IRD for the protostome clade. The catalytic and biosynthetic
  assertions are sound family-wide; the urea-cycle assertion holds only in lineages whose arginase closes
  the cycle, and is placed too deep for bacteria that recycle or degrade arginine by other routes.
functional_coherence: COHERENT
coherence_reason: >-
  Every reviewed member has the same reaction and acts in arginine biosynthesis; members differ only in
  pathway context (whether a urea-producing arginase closes a cycle), not in molecular function. Nearly
  all Swiss-Prot members fall in SF2; SF5 holds human ASS1 alone and shows no functional divergence.
