term_assessments:
- assessed_term:
    id: GO:0006744
    label: ubiquinone biosynthetic process
  scope: UNRESOLVED
  scope_reason: >-
    Required for ubiquinone synthesis in E. coli and Providencia, and SF113 is
    almost entirely proteobacterial UbiB, but SF113 also holds plant ABC1K7
    and mycobacterial members of organisms that use menaquinone, and the
    other subfamilies are plastid ABC1Ks. No PAINT node carries the process.
    ubiquinone_biosynthesis uses the family for its UbiB accessory annoton
    without a molecular function; member assignment rests on the UbiB gene
    reviews.
  supported_by:
  - reference_id: PMID:10960098
    supporting_text: Both the P. stuartii aarF and E. coli ubiB (yigR) disruption mutant strains lack CoQ
      and accumulate octaprenylphenol.
- assessed_term:
    id: GO:0016887
    label: ATP hydrolysis activity
  scope: UNRESOLVED
  scope_reason: >-
    Shown for purified E. coli UbiB (SF113) and conserved with the Coq8
    orthologs of the separate family PTHR43851, so it is likely ancestral to
    the UbiB fold; but no plastid ABC1K of this family has been assayed in the
    sources we read, and SF113 also holds plant and mycobacterial members, so
    neither a family-wide nor a subfamily scope can be asserted.
    ubiquinone_biosynthesis uses the activity for its UbiB annoton on the
    strength of the E. coli UbiB gene review.
  supported_by:
  - reference_id: PMID:29198567
    supporting_text: We found that ATPase activity is an evolutionarily conserved feature of COQ8 orthologs
      from E. coli to humans that is enhanced by phenolic compounds resembling CoQ biosynthetic precursors.
- assessed_term:
    id: GO:0004672
    label: protein kinase activity
  scope: UNRESOLVED
  scope_reason: >-
    Asserted by PAINT only for the plant ABC1K clade; no protein substrate or
    protein kinase activity has been demonstrated for bacterial UbiB, whose
    demonstrated activity is ATP hydrolysis.
  supported_by:
  - reference_id: PMID:10960098
    supporting_text: The possible protein kinase function of UbiB and Abc1 and the role these polypeptides
      may play in CoQ biosynthesis are discussed.
