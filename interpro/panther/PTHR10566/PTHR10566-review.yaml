    PTN004168993 is the plant/algal ABC1K clade (431 of the 446 tree leaves),
    seeded by three Arabidopsis ABC1K proteins; the bacterial UbiB clade that
    holds E. coli UbiB and P. aeruginosa UbiB (PTN000059961, 10 leaves) is
