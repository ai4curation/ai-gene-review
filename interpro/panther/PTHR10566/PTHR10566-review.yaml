family_id: PANTHER:PTHR10566
family_name: CHAPERONE-ACTIVITY OF BC1 COMPLEX  CABC1 -RELATED
preferred_name: UbiB/ABC1 atypical kinase-like family (bacterial UbiB and plastid ABC1K)
summary: >-
  UbiB/ABC1-domain proteins of bacteria and plastids. Bacterial UbiB (E. coli
  UbiB, Providencia AarF) is required for aerobic ubiquinone biosynthesis:
  disruption abolishes ubiquinone and accumulates octaprenylphenol, the
  substrate of the first ring hydroxylation. Purified E. coli UbiB hydrolyzes
  ATP, an activity it shares with the mitochondrial Coq8 orthologs, but no
  protein substrate has been found and the step its ATPase cycle drives is
  unknown. The plastid ABC1K proteins of plants and
  algae (Arabidopsis ABC1K1, ABC1K3, ABC1K7, ABC1K8) form the bulk of the
  PANTHER tree and are associated with plastoglobule prenyl-lipid metabolism.
  The mitochondrial Coq8/ADCK proteins of the CoQ synthome are classified in
  the separate family PTHR43851.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family joins bacterial UbiB (ubiquinone pathway, SF113) with several
  plastid ABC1K subfamilies of other pathways; the only shared feature is the
  ABC1/protein-kinase-like fold; bacterial UbiB is an ATPase with no known
  protein kinase substrate.
