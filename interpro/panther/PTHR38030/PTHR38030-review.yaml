family_id: PANTHER:PTHR38030
family_name: PROTOPORPHYRINOGEN IX DEHYDROGENASE [MENAQUINONE]
preferred_name: HemG long-chain flavodoxin protoporphyrinogen IX dehydrogenase family
summary: >-
  A family of long-chain flavodoxin-fold FMN proteins. Its characterized core members are
  the HemG protoporphyrinogen IX dehydrogenases of gammaproteobacteria (E. coli, Salmonella)
  and the horizontally acquired Leishmania enzyme, which carry out the six-electron
  oxidation of protoporphyrinogen IX to protoporphyrin IX without using oxygen directly,
  passing the electrons to menaquinone or ubiquinone and thence to the respiratory chain.
  HemG is a peripheral inner-membrane protein and is one of three unrelated bacterial
  protoporphyrinogen oxidases, alongside HemY (PTHR42923) and HemJ (PTHR40255). The family
  also contains flavodoxin-like proteins of Clostridia, Fusobacteria and archaea that are
  not HemG orthologs in function: Clostridioides difficile BilS, the best-characterized of
  them, is an electron-transfer partner of the bilirubin reductase BilR in heme
  degradation.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  FMN-flavodoxin chemistry is shared family-wide, and the proteobacterial and Leishmania
  members are protoporphyrinogen IX dehydrogenases, but PANTHER keeps the whole family in a
  single subfamily (SF2) that also contains the clostridial BilS electron-transfer
  flavodoxin and uncharacterized archaeal members (Methanocaldococcus MJ0298).
