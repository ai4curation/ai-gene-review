    label: protoporphyrinogen oxidase activity, quinone as acceptor
  evidence: IBD
  paint_snapshot: '20250904'
  seeds:
  - id: UniProtKB:P0ACB4
  - id: UniProtKB:Q4QIU7
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Sound for the proteobacterial HemG clade and the Leishmania enzyme that seed it, but the
    node is the family root (Eubacteria in the PANTHER tree) and its descendants include
    clostridial, fusobacterial and archaeal flavodoxin-like proteins. In the same subfamily,
    C. difficile BilS (P0DXD1, not itself a tree leaf) is an electron-transfer flavodoxin
    for bilirubin reduction, so membership alone does not establish the activity for the
    non-proteobacterial branches. No reviewed gene in this repository lies on those
    branches; PANTHER does not separate them into a subfamily, so no subfamily is named
    here and the known non-HemG member is recorded as a member exception.
  supported_by:
  - reference_id: file:interpro/panther/PTHR38030/PTHR38030-paint.tsv
    supporting_text: "PTHR38030\tPTN002445460\tGO:0070819\tF\tIBD\tfalse\tUniProtKB:P0ACB4|UniProtKB:Q4QIU7"
  - reference_id: PMID:38172624
    supporting_text: >-
      bilR is the putative bilirubin reductase, bilS is a flavodoxin-like protein and bilQ
      is a MarR family transcriptional regulator.
- node_id: PANTHER:PTN002445460
  asserted_term:
    id: GO:0006783
