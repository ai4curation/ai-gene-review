  - id: UniProtKB:Q4QIU7
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    Same placement as the dehydrogenase activity: sound for HemG enzymes, which make the
    protoporphyrin IX used for heme, but inherited by flavodoxin-like branches for which no
    heme-biosynthetic role is known; BilS acts in heme degradation instead.
  supported_by:
  - reference_id: file:interpro/panther/PTHR38030/PTHR38030-paint.tsv
    supporting_text: "PTHR38030\tPTN002445460\tGO:0006783\tP\tIBD\tfalse\tUniProtKB:P0ACB4|UniProtKB:Q4QIU7"
  - reference_id: PMID:38172624
    supporting_text: >-
      There was no sequence homology detected between the flavodoxin-like domain encoded by
      the Ruminococcus gnavus CC55_001C bilR and the flavodoxin-like protein encoded by
      bilS, although they are predicted to have the same fold and are probably involved in
      electron transfer.
