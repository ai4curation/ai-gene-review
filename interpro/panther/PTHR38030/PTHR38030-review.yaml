notes: >-
  The PANTHER 19 tree (pantherdb.org treeinfo service) roots the family at PTN002445460
  (17 leaves, all SF2), with descendants in E. coli, Salmonella, Yersinia, Vibrio,
  Shewanella, Leishmania, Clostridium botulinum, Fusobacterium nucleatum, Methanosarcina
  acetivorans and Methanocaldococcus jannaschii. Whether the clostridial and archaeal leaves
  are BilS-like electron carriers or genuine HemG enzymes has not been tested; the
  NEEDS_PRUNING verdicts record that the root placement over-reaches for at least the
  BilS lineage, without naming a subfamily because PANTHER has none that separates it.
