  description:
  - text: The Metacaspase family comprises cysteine proteases that are involved in
      programmed cell death, which is analogous to apoptosis in multicellular organisms.
      These enzymes typically cleave after arginine or lysine residues and are implicated
      in various cellular processes including stress responses, aging, and the maintenance
      of cellular homeostasis. Metacaspases are activated by calcium ions, which induce
      conformational changes necessary for their proteolytic activity. Some family
      members are involved in the regulation of cell death in response to oxidative
      stress or immune responses, while others may play roles in parasite growth and
      virulence. The family also includes inactive metacaspases that may have regulatory
      functions.
