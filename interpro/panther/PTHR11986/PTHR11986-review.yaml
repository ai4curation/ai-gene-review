family_id: PANTHER:PTHR11986
family_name: AMINOTRANSFERASE CLASS III
preferred_name: Class-III PLP-dependent omega/delta-aminotransferases (OAT, ArgD/ARG8, AstC, PatA, DavT)
summary: >-
  Pyridoxal 5'-phosphate-dependent fold-type I class-III aminotransferases that transfer a
  terminal (omega or delta) amino group to 2-oxoglutarate. The family groups several
  distinct enzymes with different amino donors: ornithine delta-aminotransferase (OAT; yeast
  CAR2, fission yeast car2, human OAT, plant delta-OAT, Bacillus RocD), the anabolic
  N-acetylornithine aminotransferases of arginine biosynthesis (bacterial ArgD, fungal
  mitochondrial ARG8/arg1, plant WIN1), the catabolic N-succinylornithine transaminases of the
  arginine succinyltransferase pathway (E. coli AstC, Pseudomonas AruC), E. coli PatA
  putrescine aminotransferase, and 4-aminobutyrate / 5-aminovalerate aminotransferases such as
  PuuE and DavT. The shared chemistry is PLP-dependent omega-transamination; the amino donor,
  and therefore the pathway, is set by subfamily.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  No specific transaminase activity is safe at family level. Ornithine transaminase activity
  (GO:0004587) belongs to SF18 (ornithine aminotransferases); acetylornithine transaminase
  activity (GO:0003992) belongs to the ArgD-like subfamilies SF79 and SF122 and is shared,
  as a secondary activity, by the AstC/AruC succinylornithine transaminases of SF113;
  putrescine (SF112), 5-aminovalerate (DavT, SF58) and 4-aminobutyrate (PuuE, SF58)
  transaminases use different donors. Biological roles also split by subfamily: SF79/SF122
  enzymes are arginine-biosynthetic, SF18 and SF113 enzymes are arginine-catabolic. Location is
  lineage-specific rather than subfamily-specific: animal and plant OATs and fungal ARG8/arg1 are
  mitochondrial, while the yeast OATs CAR2 and car2 are cytosolic.
