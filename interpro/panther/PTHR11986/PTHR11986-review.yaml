  scope: SUBFAMILY_ONLY
  scope_reason: >-
    Asserted by the arginine catabolism module for the SF18 annoton. OAT degrades ornithine in
    fungi and plants; in mammals the reaction is reversible and also contributes to ornithine
    synthesis, so the process is a context-dependent direction of the SF18 activity. It also
    holds, as a secondary role, for the SF113 succinylornithine transaminases (AstC/AruC):
    the AST pathway degrades ornithine through N2-succinylornithine, the AstC substrate, and
    disruption of E. coli astC impairs ornithine utilization. The ArgD-like biosynthetic
    subfamilies (SF79, SF122) and the other donors' subfamilies are not covered.
  applicable_subfamilies:
  - id: PANTHER:PTHR11986:SF18
    label: ORNITHINE AMINOTRANSFERASE, MITOCHONDRIAL
  - id: PANTHER:PTHR11986:SF113
    label: SUCCINYLORNITHINE TRANSAMINASE
  supported_by:
  - reference_id: PMID:1737786
    supporting_text: ornithine delta-aminotransferase is a nuclear-encoded mitochondrial matrix enzyme which
      catalyzes the reversible interconversion of ornithine and alpha-ketoglutarate to glutamate semialdehyde
      and glutamate
  - reference_id: PMID:9696779
    supporting_text: Its disruption prevented arginine catabolism, impaired ornithine utilization, and affected
      the synthesis of all the enzymes of the AST pathway.
  - reference_id: PMID:9393691
    supporting_text: The arginine succinyltransferase (AST) pathway is the major arginine and ornithine utilization
      (aru) pathway under aerobic conditions in Pseudomonas aeruginosa.
- assessed_term:
    id: GO:0005759
    label: mitochondrial matrix
  scope: UNRESOLVED
  scope_reason: >-
    Location is lineage-determined, not subfamily-determined. Mitochondrial matrix is correct for
    metazoan OATs (PTN000944787) and for the fungal ARG8/arg1 clade (PTN000241284), both sound
    PAINT placements. It does not apply to the cytosolic yeast OATs in the same subfamily (SF18)
    or to any bacterial member.
  supported_by:
  - reference_id: PMID:3456579
    supporting_text: a nonabundant mitochondrial matrix enzyme
  - reference_id: PMID:205532
    supporting_text: acetylornithine aminotransferase, and acetylornithine-glutamate acetyltransferase. These
      enzymes were exclusively particulate.
