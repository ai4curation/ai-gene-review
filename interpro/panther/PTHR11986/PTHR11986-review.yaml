notes: >-
  Node reach was read from the PAINT UniProt GAF (rows whose WITH column starts with the PTN).
  PTN000944876 (GO:0030170 and GO:0009450 GABA catabolic process) reaches the GABA
  transaminases S. cerevisiae UGA1, S. pombe uga1, human ABAT and E. coli GabT, which PANTHER 19
  classifies in PTHR43206, not PTHR11986; the PAINT tree for these rows predates that split. GOA
  still delivers these IBAs (and the PTN000241468 cytosol IBA) to P. aeruginosa DavT inside
  PTHR11986, so those three rows are now assessed for that recipient. PTN001736429 (Enterobacteriaceae PatA) correctly carries
  putrescine transaminase/catabolism IBDs and IRDs negating GO:0003992 and GO:0006526.
  PTN000241155 (Eukaryota, GO:0006527) reaches only SF18 OATs and is sound. The fission yeast
  car2 review is a stub and still lists the older mitochondrion IBA. Subfamily assignment of
  human OAT differs between the InterPro member list (SF18) and the PANTHER 19 HMM files
  (SF118). No residue sites asserted.
