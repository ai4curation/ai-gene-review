  name:
    name: Chloroplast protein import-associated protein
    short: Chloroplast_import_assoc
  description:
  - text: This family of proteins is involved in the import of protein precursors
      into chloroplasts. They are part of a motor complex that includes a co-chaperone
      and a chaperone associated with the chloroplast import channel. These proteins
      facilitate the release of transit peptides from the import channel and enhance
      the ATPase activity of the chaperone. Additionally, they play a role in the
      reinsertion of proteins from the stroma back into the inner membrane of chloroplasts.
      They contain domains that interact with other components of the import machinery
      and have regions necessary for membrane integration.
