family_id: PANTHER:PTHR23068
family_name: DNA  CYTOSINE-5- -METHYLTRANSFERASE 3-RELATED
preferred_name: DNMT3/DRM methyltransferases and noncatalytic relatives
summary: This family includes active DNMT3 DNA methyltransferases together with regulatory relatives such
  as DNMT3L and inactive DRM proteins. DNMT3L recognizes chromatin and stimulates methyltransferase partners
  without supplying an independent DNA-methylation active site. The group also contains proteins catalogued
  as PWWP2B, underscoring that shared domains do not ensure conserved methyltransferase activity.
functional_coherence: HETEROGENEOUS
coherence_reason: The primary DNMT3A-DNMT3L structure contains two DNMT3A catalytic sites in a heterotetramer,
  with DNMT3L providing activating interfaces rather than extra catalytic centers. This establishes catalytic
  versus regulatory subunit roles independently of family names. Other DNMT3 and DRM branches prevent
  an exhaustive catalytic grant restricted to the sampled DNMT3A subfamily.
