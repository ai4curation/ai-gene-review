  diverged_from_family: true
  divergence_description: Retains chromatin and methyltransferase interaction functions without intrinsic
    DNA cytosine methyltransferase activity.
- subfamily_id: PANTHER:PTHR23068:SF10
  label: DNA (CYTOSINE-5)-METHYLTRANSFERASE 3A
  description: DNMT3A catalytic branch. Characterized members catalyze de novo DNA cytosine methylation;
    DNMT3L is a distinct regulatory partner.
  representative_members:
  - id: UniProtKB:A0A9L0TK01
    gene_symbol: DNMT3A
    organism: Equus caballus
    label: DNA (cytosine-5-)-methyltransferase
    gene_review: genes/HORSE/DNMT3A/DNMT3A-ai-review.yaml
  - id: UniProtKB:Q9Y6K1
    gene_symbol: DNMT3A
    organism: Homo sapiens
    label: DNA (cytosine-5)-methyltransferase 3A
    gene_review: genes/human/DNMT3A/DNMT3A-ai-review.yaml
term_assessments:
- assessed_term:
    id: GO:0003886
    label: DNA (cytosine-5-)-methyltransferase activity
  scope: UNRESOLVED
  scope_reason: DNMT3A in SF10 is a demonstrated catalytic DNA methyltransferase, while DNMT3L in SF13
    is a catalytically inactive regulator. DNMT3B and active DRM proteins show that catalytic activity
    is not exclusive to the DNMT3A branch. The full boundary across DNMT3, DRM and other domain-related
    proteins has not been established, so no exhaustive allowed-subfamily set is asserted. This uncertainty
    concerns family-wide coverage; it does not weaken the established DNMT3A activity or the DNMT3L noncatalytic
    distinction.
  supported_by:
  - reference_id: PMID:17713477
    supporting_text: 'the carboxy-terminal domain of human Dnmt3L interacts with

      the catalytic domain of Dnmt3a, demonstrating that Dnmt3L has dual functions of

      binding the unmethylated histone tail and activating DNA methyltransferase.'
  - reference_id: PMID:17713477
    supporting_text: 'forming a tetrameric complex with two active

      sites.'
- assessed_term:
    id: GO:0008047
    label: enzyme activator activity
  scope: UNRESOLVED
  scope_reason: DNMT3L in SF13 activates DNMT3 methyltransferase partners through complex formation. This
    is a positive regulatory function distinct from DNA methyltransferase catalysis. The available evidence
    does not establish that enzyme-activator activity is exclusive to SF13 across all noncatalytic and
    regulatory relatives, so the complete family-wide scope remains unresolved.
  supported_by:
  - reference_id: PMID:17713477
    supporting_text: 'the carboxy-terminal domain of human Dnmt3L interacts with

      the catalytic domain of Dnmt3a, demonstrating that Dnmt3L has dual functions of

      binding the unmethylated histone tail and activating DNA methyltransferase.'
