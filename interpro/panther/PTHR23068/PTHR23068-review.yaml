notes: DNMT3L can participate in DNA methylation as a chromatin-associated activator without enabling
  intrinsic DNA methyltransferase activity. The human-horse DNMT3L alignment covers all 386 human residues,
  supporting the overall regulatory architecture but not a horse-specific biochemical assay. The reference
  DNMT3A cysteine anchor is not used to invent an aligned residue loss in DNMT3L. Family scope remains
  explicitly unresolved beyond the experimentally established catalytic/regulatory examples.
