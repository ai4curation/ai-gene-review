  name:
    name: DNA Methyltransferase 3
    short: DNMT3
  description:
  - text: The DNA Methyltransferase 3 family is involved in the process of adding
      methyl groups to the 5 position of cytosine in DNA, a key epigenetic modification
      essential for development and gene regulation. Members of the family are responsible
      for de novo methylation, establishing DNA methylation patterns, and are linked
      to the methylation of histones, suggesting a coordinated regulation of epigenetic
      marks. Some members preferentially methylate DNA at nucleosomal cores or linkers
      and may also methylate non-CpG sites. The family includes catalytically active
      enzymes that can repress transcription by recruiting HDAC activity, and catalytically
      inactive regulatory factors that modulate the activity of active members. These
      proteins play roles in imprinting, gene silencing, retrotransposon repression
      in germ cells, and RNA-directed DNA methylation, with implications in plant
      and animal development.
