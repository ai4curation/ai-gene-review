family_id: PANTHER:PTHR48105
family_name: THIOREDOXIN REDUCTASE 1-RELATED-RELATED
preferred_name: Low-Mr thioredoxin reductase family (TRR1/TrxB and AhpF)
summary: >-
  FAD/NADPH-dependent pyridine nucleotide-disulfide oxidoreductases. Low-Mr thioredoxin reductases
  (S. cerevisiae TRR1 cytosolic and TRR2 mitochondrial, S. pombe trr1, bacterial TrxB) reduce thioredoxin.
  SF6 holds AhpF, the alkyl hydroperoxide reductase subunit that reduces AhpC instead.
functional_coherence: MOSTLY_COHERENT
coherence_reason: SF16 reduces thioredoxin; SF6 (AhpF) reduces the peroxiredoxin AhpC.
