node_assessments:
- node_id: PANTHER:PTN000559455
  asserted_term:
    id: GO:0004042
    label: L-glutamate N-acetyltransferase activity, acting on acetyl-CoA as donor
  evidence: IBD
  paint_snapshot: '20170228'
  seeds:
  - id: SGD:S000004666
  assessment: NEEDS_PRUNING
  assessment_reason: >-
    The node is the family root and its single seed is yeast ARG7, whose acetyl-CoA-dependent activity
    is genuine but modest. The activity is retained by B. subtilis ArgJ (its review accepts the IBA),
    but M. jannaschii ArgJ is experimentally monofunctional, and its review removes the IBA; Streptomyces
    coelicolor and Thermus thermophilus ArgJ are also reported monofunctional. S. pombe aga1
    and yeast ARG7 keep it as non-core. The node therefore propagates the second activity to at least one
    branch that lacks it; an IRD/NOT is needed for the archaeal monofunctional lineage, and the
    distribution in other lineages is not established.
  supported_by:
  - reference_id: file:interpro/panther/PTHR23100/PTHR23100-paint.tsv
    supporting_text: "PTHR23100\tPTN000559455\tGO:0004042\tF\tIBD\tfalse\tSGD:S000004666"
  - reference_id: PMID:10931207
    supporting_text: M. jannaschii ArgJ is therefore a monofunctional enzyme, whereas T. neapolitana and
      B. stearothermophilus encoded ArgJ are bifunctional.
  - reference_id: file:genes/METJA/argJ/argJ-ai-review.yaml
    supporting_text: Thus a family-level initiation assignment must exclude this experimentally monofunctional
      member
  - reference_id: PMID:15838030
    supporting_text: in Actinomycetes such as Streptomyces coelicolor and the extreme thermophilic bacterium
      Thermus thermophilus , the argJ gene product has been shown to encode a monofunctional enzyme displaying
      only ornithine acetyltransferase activity
  - reference_id: file:genes/BACSU/argJ/argJ-ai-review.yaml
    supporting_text: B. subtilis ArgJ is the bifunctional form capable of initiating N-acetylglutamate
      synthesis with acetyl-CoA as well as recycling acetylornithine.
- node_id: PANTHER:PTN000559455
  asserted_term:
    id: GO:0006592
    label: L-ornithine biosynthetic process
  evidence: IBD
  paint_snapshot: '20200809'
  seeds:
  - id: SGD:S000004666
  - id: UniProtKB:Q5AVF8
  assessment: SOUND
  assessment_reason: >-
    Release of L-ornithine from N2-acetyl-L-ornithine is the shared ArgJ reaction, so ornithine synthesis
    is inherited family-wide. Every reviewed recipient (B. subtilis and M. jannaschii argJ, S. pombe aga1,
    yeast ARG7) accepts this IBA.
  supported_by:
  - reference_id: file:interpro/panther/PTHR23100/PTHR23100-paint.tsv
    supporting_text: "PTHR23100\tPTN000559455\tGO:0006592\tP\tIBD\tfalse\tSGD:S000004666|UniProtKB:Q5AVF8"
  - reference_id: PMID:9428669
    supporting_text: While forming ornithine, this enzyme regenerates acetylglutamate
  - reference_id: file:genes/SCHPO/aga1/aga1-ai-review.yaml
    supporting_text: aga1 catalyses the reaction that releases L-ornithine from N-acetylornithine, the
      final step of ornithine synthesis in the fungal acetyl cycle.
- node_id: PANTHER:PTN001134096
  asserted_term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence: IBD
  node_taxon: {id: "NCBITaxon:451864", label: "Dikarya"}
  paint_snapshot: '20170228'
  seeds:
  - id: SGD:S000004666
  assessment: SOUND
  assessment_reason: >-
    The node is restricted to Dikarya (taxon 451864), so the matrix location reaches only fungal ArgJ.
    Yeast ARG7 is experimentally mitochondrial, and the S. pombe aga1 review accepts the IBA alongside
    native mitochondrial localization data. Bacterial, archaeal and plant members do not inherit it.
  supported_by:
  - reference_id: file:interpro/panther/PTHR23100/PTHR23100-paint.tsv
    supporting_text: "PTHR23100\tPTN001134096\tGO:0005759\tC\tIBD\tfalse\tSGD:S000004666\ttaxon:451864"
  - reference_id: PMID:9428669
    supporting_text: We have cloned by functional complementation and characterized the yeast ARG7 gene
      encoding mitochondrial ornithine acetyltransferase, the enzyme catalyzing the fifth step in arginine
      biosynthesis.
  - reference_id: file:genes/SCHPO/aga1/aga1-ai-review.yaml
    supporting_text: The PAINT matrix assignment is consistent with native mitochondrial HDA localization
      and the curated HAMAP matrix assignment.
term_assessments:
- assessed_term:
    id: GO:0004358
    label: L-glutamate N-acetyltransferase activity, acting on acetyl-L-ornithine as donor
  scope: FAMILY_WIDE
  scope_reason: >-
    Acetylornithine-to-glutamate acetyl transfer is the defining ArgJ reaction, shown for monofunctional
    and bifunctional members alike (M. jannaschii, B. subtilis, yeast ARG7) and accepted by every member
    review.
  supported_by:
  - reference_id: PMID:10931207
    supporting_text: the purified His-tagged ArgJ enzyme of M. jannaschii only catalyzes N2-acetylornithine
      conversion to ornithine
  - reference_id: file:genes/METJA/argJ/argJ-ai-review.yaml
    supporting_text: Purified archaeal ArgJ recycles acetylornithine and complements argE deficiency; it
      does not use acetyl-CoA (PMID:10931207).
- assessed_term:
    id: GO:0004042
    label: L-glutamate N-acetyltransferase activity, acting on acetyl-CoA as donor
  scope: UNRESOLVED
  scope_reason: >-
    The acetyl-CoA-dependent activity is present in some members (B. subtilis, B. stearothermophilus and
    T. neapolitana ArgJ; weakly in yeast ARG7) and absent in others (M. jannaschii ArgJ). All members sit
    in one subfamily, and no clade or residue is known to separate the two forms, so the term can be
    granted only member by member from direct assays. G. stearothermophilus ArgJ (Q07908) is the directly
    assayed bifunctional member with a gene review. Family membership alone does not establish it, as the
    P. putida KT2440 argJ review records.
  supported_by:
  - reference_id: PMID:9428669
    supporting_text: Among these evolutionarily related enzymes, some but not all appear bifunctional,
      being able to produce acetylglutamate not only from acetylornithine but also from acetyl-CoA
  - reference_id: PMID:17347518
    supporting_text: Not all OATs possess this dual activity
  - reference_id: file:genes/PSEPK/argJ/argJ-ai-review.yaml
    supporting_text: PMID:17347518 cautions that family membership does not establish the second, acetyl-CoA-dependent
      activity.
- assessed_term:
    id: GO:0006592
    label: L-ornithine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    The shared recycling reaction releases L-ornithine, so every member contributes to ornithine
    synthesis; consistent with the SOUND root-node IBD.
  supported_by:
  - reference_id: file:interpro/panther/PTHR23100/PTHR23100-paint.tsv
    supporting_text: "PTHR23100\tPTN000559455\tGO:0006592\tP\tIBD\tfalse"
- assessed_term:
    id: GO:0006526
    label: L-arginine biosynthetic process
  scope: FAMILY_WIDE
  scope_reason: >-
    ArgJ is the ornithine-forming enzyme of the acetyl cycle of arginine biosynthesis in bacteria, archaea,
    fungi and plants, and every member review accepts this process. Duplicated paralogs (ArgJ 1/2/3,
    Streptomyces Oat2) are not individually characterized; their shared reaction still yields the
    arginine-pathway intermediate ornithine.
  supported_by:
  - reference_id: PMID:10931207
    supporting_text: the key enzyme involved in the acetyl cycle of L-arginine biosynthesis
  - reference_id: file:genes/BACSU/argJ/argJ-ai-review.yaml
    supporting_text: It recycles the acetyl group from N-acetylornithine to glutamate, releasing ornithine
      and regenerating N-acetylglutamate
