family_id: PANTHER:PTHR23100
family_name: ARGININE BIOSYNTHESIS BIFUNCTIONAL PROTEIN ARGJ
preferred_name: ArgJ ornithine acetyltransferase (acetyl-cycle glutamate N-acetyltransferase)
summary: >-
  ArgJ-type ornithine acetyltransferases (EC 2.3.1.35) of the cyclic, acetyl-recycling route of
  arginine biosynthesis. Every characterized member transfers the acetyl group of N2-acetyl-L-ornithine
  to L-glutamate, releasing L-ornithine and regenerating N-acetyl-L-glutamate. The precursor is cleaved
  autocatalytically into alpha and beta chains that assemble into a heterotetramer. Some members are
  also bifunctional, acetylating glutamate with acetyl-CoA (EC 2.3.1.1): Bacillus subtilis and
  B. stearothermophilus ArgJ, Thermotoga neapolitana ArgJ, and, weakly, Saccharomyces cerevisiae ARG7.
  Others, including Methanocaldococcus jannaschii ArgJ, are monofunctional. Fungal members (ARG7,
  S. pombe aga1) are mitochondrial matrix enzymes, and plant members are chloroplastic. In PANTHER 19
  all 223 reviewed members fall in one subfamily, SF0.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The acetylornithine-dependent recycling activity and ornithine synthesis are shared by all
  characterized members. The acetyl-CoA-dependent initiating activity is not: it is present in some
  bacterial ArgJ proteins, weak in yeast ARG7, and absent from M. jannaschii ArgJ, and no PANTHER
  subfamily separates the two forms. Location also follows lineage (bacterial and archaeal cytoplasm,
  fungal mitochondrial matrix, plant chloroplast).
