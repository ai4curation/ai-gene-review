family_id: PANTHER:PTHR32179
family_name: NICOTINATE-NUCLEOTIDE PYROPHOSPHORYLASE [CARBOXYLATING]
preferred_name: Quinolinate phosphoribosyltransferase (NadC/BNA6/QPRT) family
summary: >-
  Type II phosphoribosyltransferases that convert quinolinate and PRPP to nicotinate mononucleotide,
  CO2 and pyrophosphate, linking de novo quinolinate synthesis to NAD (bacterial NadC, S. cerevisiae
  BNA6, human QPRT, plant QPT). ModD-related proteins form a separate subfamily of unclear function.
functional_coherence: MOSTLY_COHERENT
coherence_reason: QPRTase activity holds for SF3; SF4 ModD-related proteins are uncharacterized.
