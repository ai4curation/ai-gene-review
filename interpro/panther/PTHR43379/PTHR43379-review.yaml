family_id: PANTHER:PTHR43379
family_name: CYSTATHIONINE GAMMA-SYNTHASE
preferred_name: Plant chloroplastic cystathionine gamma-synthase (CGS1) family
summary: >-
  PLP-dependent cystathionine gamma-synthases of plant plastids (Arabidopsis and tobacco CGS1), which
  condense O-phospho-L-homoserine with cysteine in the first committed step of methionine biosynthesis.
  Arabidopsis CGS1 prefers O-phospho-L-homoserine over O-succinyl- and O-acetyl-L-homoserine and has a
  very weak gamma-elimination side activity. The N-terminal region carries the MTO1 domain for
  SAM-regulated mRNA decay. The family also holds Arabidopsis CGS2, which is uncharacterized.
functional_coherence: COHERENT
coherence_reason: >-
  The two characterized members (Arabidopsis and tobacco CGS1) are plastidial cystathionine
  gamma-synthases; the third reviewed member, Arabidopsis CGS2, is a predicted paralog with no
  contrary evidence.
