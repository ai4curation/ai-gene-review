- site_id: g3p_phosphate_arg437
  label: Arginine binding the C-3 phosphate of glyceraldehyde 3-phosphate
  description: >-
    Arg437 of S. mutans GapN (UniProt numbering), listed by UniProt as a substrate-binding residue from the ternary
    complex structure (PMID:10864505). With Arg103 and Arg283 it forms the phosphate-binding set of bacterial and
    plant GapN. A mutagenesis study of the same enzyme reports that replacing the arginines it numbers Arg-301 and
    Arg-459 lowers catalytic efficiency by about five orders of magnitude and that replacing Arg-124 only weakens
    binding (PMID:12163495); those numbers follow a superfamily numbering, and their identification with UniProt
    Arg283, Arg437 and Arg103 is inferred here from residue type and order (the same papers call Cys284 Cys-302),
    not read from the full text. In the alignment all three arginines are present in every full-length leaf of the
    Firmicutes plus Viridiplantae GapN clade and Arg437 is absent from every leaf outside it. The site marks bacterial/plant-type
    GapN; it cannot be used to deny the activity, because the archaeal NAD(P)-dependent GapN enzymes have His at
    this position (T. tenax His455, S. solfataricus SSO3194 His463).
  anchor: *id001
  anchor_sequence_version: 2
  site_source: UNIPROT_FEATURE
  residues:
  - position: 437
    expected:
    - R
    role: binds the C-3 phosphate of glyceraldehyde 3-phosphate
  required_for:
  - term:
      id: GO:0008886
      label: glyceraldehyde-3-phosphate dehydrogenase (NADP+) (non-phosphorylating) activity
    strength: CONTRIBUTES
    rationale: >-
      The arginine side chain binds the substrate phosphate and positions glyceraldehyde 3-phosphate relative to
      the catalytic cysteine, which is what makes a general aldehyde dehydrogenase active site specific for the
      phosphorylated triose. It is CONTRIBUTES, not REQUIRED, because archaeal GapN achieves the same specificity
