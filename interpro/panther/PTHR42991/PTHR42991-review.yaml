- node_id: PANTHER:PTN000193241
  asserted_term:
    id: GO:0008886
    label: glyceraldehyde-3-phosphate dehydrogenase (NADP+) (non-phosphorylating) activity
  node_taxon:
    id: NCBITaxon:33090
    label: Viridiplantae
  evidence: IBD
  paint_snapshot: '20250919'
  seeds:
  - id: AGI_LocusCode:AT2G24270
  assessment: SOUND
  assessment_reason: >-
    The seed is Arabidopsis ALDH11A3 (Q1WIQ6), a plant non-phosphorylating NADP-dependent GapN, and
    the node is placed at the green-plant clade. Every green-plant SwissProt member of the family in
    the local inventory (pea, tobacco, Arabidopsis, maize, wheat, celery and the green alga
    Scenedesmus) is named NADP-dependent glyceraldehyde-3-phosphate dehydrogenase, so the node
    placement matches the characterized function of the clade. The bacterial SLA dehydrogenases are
    outside this taxon and do not receive the row.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42991/PTHR42991-paint.tsv
    supporting_text: "PTHR42991\tPTN000193241\tGO:0008886\tF\tIBD\tfalse\tAGI_LocusCode:AT2G24270"
  - reference_id: file:interpro/panther/PTHR42991/PTHR42991-entries.csv
    supporting_text: Q1WIQ6,NADP-dependent glyceraldehyde-3-phosphate dehydrogenase
- node_id: PANTHER:PTN008677383
  asserted_term:
    id: GO:0008911
    label: lactaldehyde dehydrogenase (NAD+) activity
  evidence: IBD
  paint_snapshot: '20250919'
  seeds:
  - id: UniProtKB:Q58806
  assessment: TOO_DEEP
  assessment_reason: >-
    The single seed is Methanocaldococcus jannaschii MJ1411 (Q58806), the lactaldehyde
    dehydrogenase of F420 biosynthesis, and the Methanococcales orthologs in SF1 are named
    lactaldehyde dehydrogenases. The node, however, lies deep in SF1: in the PAINT leaf file its IBA
    reaches Dictyostelium, bryophytes, Selaginella and crenarchaeal and haloarchaeal GapN paralogs,
    and TreeGrafter carries the term from this part of the tree to the Bacillus SLA dehydrogenases
    SlaB and SftD (TreeGrafter rows citing PTN008677393). SlaB and SftD are characterized as
    3-sulfolactaldehyde dehydrogenases, with no reported lactaldehyde activity, and SF1 also holds
    glyceraldehyde-3-phosphate dehydrogenases, so lactaldehyde specificity cannot be inherited across
    this node. The assertion belongs on the Methanococcales lactaldehyde dehydrogenase clade.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42991/PTHR42991-paint.tsv
    supporting_text: "PTHR42991\tPTN008677383\tGO:0008911\tF\tIBD\tfalse\tUniProtKB:Q58806"
  - reference_id: file:interpro/panther/PTHR42991/PTHR42991-entries.csv
    supporting_text: Q58806,Lactaldehyde dehydrogenase
  - reference_id: file:genes/PRIAR/sftD/sftD-ai-review.yaml
    supporting_text: but lactaldehyde was not reported as a substrate.
term_assessments:
- assessed_term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD or NADP as acceptor
  scope: FAMILY_WIDE
  scope_reason: >-
    NAD(P)+-dependent oxidation of an aldehyde is what the characterized members share, whichever the
    substrate (glyceraldehyde 3-phosphate, lactaldehyde, sulfoacetaldehyde, phosphonoacetaldehyde,
    aspartate semialdehyde or 3-sulfolactaldehyde) and whichever pyridine nucleotide is used.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42991/PTHR42991-entries.csv
    supporting_text: Q2BN77,Sulfoacetaldehyde dehydrogenase
  - reference_id: file:interpro/panther/PTHR42991/PTHR42991-entries.csv
    supporting_text: Q92UV7,Phosphonoacetaldehyde dehydrogenase
  - reference_id: PMID:32919372
    supporting_text: Thus, protein SftD is another NAD+-dependent SLA dehydrogenase
- assessed_term:
    id: GO:0004029
    label: aldehyde dehydrogenase (NAD+) activity
  scope: SUBFAMILY_ONLY
  scope_reason: >-
    The NAD+-specific aldehyde dehydrogenase term is the parent used for the SLA dehydrogenase step,
    for which GO has no specific term (EC 1.2.1.97). It holds for the NAD+-dependent members of SF1:
    the SLA dehydrogenases SlaB (RHEA:47932 recorded with experimental evidence) and SftD (assayed
    with NAD+), and plausibly the lactaldehyde, sulfoacetaldehyde and phosphonoacetaldehyde
    dehydrogenases. It does not hold for the NADP-dependent GapN enzymes of plants, green algae and
    streptococci, which are excepted by name. The aspartate-semialdehyde dehydrogenases and the
    uncharacterized y4uC are left without an exception entry because their cofactor use is not
    established in the committed data. Because SF1 is substrate-heterogeneous, a module that needs
    the SLA dehydrogenase step should select members by function or gene-cluster context, not by SF1
    membership alone.
  applicable_subfamilies:
  - id: PANTHER:PTHR42991:SF1
    label: ALDEHYDE DEHYDROGENASE
