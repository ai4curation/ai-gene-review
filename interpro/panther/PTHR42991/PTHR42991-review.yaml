  scope_reason: >-
    The NAD+-specific aldehyde dehydrogenase term is the parent used for the 3-sulfolactaldehyde dehydrogenase step,
    for which GO has no specific term (EC 1.2.1.97). All members shown to use NAD+ are in SF1: SlaB and SftD (assayed
    with NAD+), SafD (specific for NAD+, NADP+ not a substrate), PhnY (NAD-dependent) and MJ1411 (prefers NAD+ over
    NADP+). SF1 is, however, the residual label for most of the family, and the term does not hold for the NADP-specific
    GapN clade inside it (Firmicutes and Viridiplantae, node PTN008677396, which also contains SF7 and SF11): S.
    equinus GapN cannot use NAD+, and every full-length leaf of that clade has Thr at anchor position 180, the residue
    reported to set NADP specificity in S. mutans GapN (PMID:10388564), where SlaB and SftD have Glu182. The Swiss-Prot
    members of that clade are listed as exceptions; unreviewed members of the clade are excepted on the same ground.
    Position 180 alone does not decide the cofactor outside the GapN clade (NAD+-specific SafD has Pro164, NAD+-preferring
    MJ1411 Ser166, dual-cofactor T. tenax GapN Ile194), so the scope is stated by clade and by assay, not as a residue
    rule. The archaeal NAD(P)- dependent GapN enzymes, the Pseudomonas aspartate-semialdehyde dehydrogenases and
    y4uC are left without an exception entry: the first use both cofactors and the cofactor of the others is not
    established. A module that needs the 3-sulfolactaldehyde dehydrogenase step should select members by function
    or gene-cluster context, not by SF1 membership.
