notes: >-
  Re-reviewed on 2026-11-26 against the PANTHER 19 tree (treeinfo service, 118 leaves) and PANTHER's own family
  alignment (familymsa service); tree_msa_check.py regenerates PTHR42991-tree-msa-check.txt, which holds the topology,
  the residue table for every leaf, the pairwise residue table for Swiss-Prot members that are not tree leaves,
  curated UniProt statements and the QuickGO annotation check. Residue numbers are in each protein's own UniProt
  numbering; the anchor is S. mutans GapN (Q59931, sequence version 2), which is not a tree leaf, so its positions
  were carried to alignment columns through S. pneumoniae GapN (Q8DPS7, 73% identical). Only 4 of the 24 Swiss-Prot
  members are tree leaves (Q1WIQ6, Q43272, Q8LK61, Q58806); statements about SlaB, SftD, SafD, PhnY, T. tenax GapN
  and SSO3194 rest on pairwise alignment to the anchor and on their UniProt records, not on a tree position. Literature
  was read as PubMed abstracts only (none of the cited papers except PMID:32919372 is in the local publication cache),
  so literature claims are cited by PMID without quotations and are limited to what the abstracts or the curated
  UniProt statements say. Not verified: the biochemical function of the Halobacterium, Dictyostelium and streptophyte
  members of the Archaea-Eukaryota clade (no experimental data found); whether haloarchaea obtain F420 lactate through
  a homolog of MJ1411; the horizontal-transfer event PANTHER reconstructs for plant GapN (taken from the tree, with
  only PMID:16562377 noting the close plant-bacterial relationship); and the origin of the TreeGrafter lactaldehyde
  dehydrogenase rows that cite graft points outside the current IBD clade. Observations outside PAINT: QuickGO carries
  an IDA of S. mutans GapN (Q59931) to GO:0047100, the phosphorylating NADP+ activity, from PMID:24032678, whose
  title and abstract describe the nonphosphorylating enzyme, so GO:0008886 looks like the intended term (a query
  for the annotating group, not a confirmed defect); and Marchantia A0A2R6WS28 (1019 residues, named for ribosomal
  protein uL1c) and A0A2R6XUC3 (1117 residues) are fused gene models. The review was first written for the bacterial
  sulfoquinovose catabolism module, whose sulfo-SFT 3-sulfolactaldehyde dehydrogenase annoton selects PTHR42991:SF1
  with SlaB and SftD as representatives; that placement is correct but SF1 is not specific for the step.
