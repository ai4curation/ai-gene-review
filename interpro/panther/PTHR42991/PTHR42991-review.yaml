residue_sites:
- site_id: catalytic_cysteine
  label: Catalytic cysteine nucleophile
  description: >-
    The active-site cysteine of the ALDH fold, Cys284 of S. mutans GapN in UniProt numbering (the papers on this
    enzyme call it Cys-302 in a superfamily-wide numbering; pea GapN Cys298). It attacks the aldehyde carbon to
    form the hemithioacetal and, after hydride transfer, the thioacyl enzyme. In the PANTHER 19 alignment it is
    present in every tree leaf whose sequence covers the position except one 227-residue Manihot fragment (A0A2C9VEP7,
    Tyr); a Selaginella model (D8R863) has an alignment gap there.
  anchor: &id001
    id: UniProtKB:Q59931
    label: NADP-dependent glyceraldehyde-3-phosphate dehydrogenase
    gene_symbol: gapN
    organism: Streptococcus mutans serotype c (strain ATCC 700610 / UA159)
  anchor_sequence_version: 2
  site_source: UNIPROT_FEATURE
  residues:
  - position: 284
    expected:
    - C
    role: nucleophile
  required_for:
  - term:
      id: GO:0016620
      label: >-
        oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD or NADP as acceptor
    strength: CONTRIBUTES
    rationale: >-
      Oxidation proceeds through covalent catalysis: the cysteine thiolate adds to the aldehyde, hydride is transferred
      from the hemithioacetal to NAD(P)+, and the resulting thioacyl enzyme is hydrolysed. Without the thiol there
      is no intermediate from which hydride transfer can occur (PMID:10864505, PMID:9461340). Recorded as CONTRIBUTES,
      not REQUIRED, only because the family has no member verified to be inactive through loss of this cysteine
      to serve as a negative control.
    supported_by:
    - reference_id: file:interpro/panther/PTHR42991/PTHR42991-tree-msa-check.txt
      supporting_text: E250 ACT_SITE; R283 BINDING substrate; C284 ACT_SITE
