notes: >-
  Reviewed for the bacterial sulfoquinovose catabolism module, whose sulfo-SFT SLA dehydrogenase
  annoton selects PTHR42991:SF1 with SlaB and SftD as representatives. SF1 is the correct PANTHER
  placement of both proteins but is not SLA-specific (it also holds GapN, lactaldehyde,
  sulfoacetaldehyde and phosphonoacetaldehyde dehydrogenases). The local member inventory lists only
  SwissProt members, all in SF1; subfamilies SF7 and SF11 (official names checked in panther.obo)
  have no SwissProt member here and are not assessed. The PAINT leaf file used for the PTN008677383
  breadth check is the release-pinned gene_association.paint_uniprot.gaf held in the local PANTHER
  cache.
