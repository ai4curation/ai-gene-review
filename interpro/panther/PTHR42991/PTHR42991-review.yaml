node_assessments:
- node_id: PANTHER:PTN000193241
  asserted_term:
    id: GO:0008886
    label: glyceraldehyde-3-phosphate dehydrogenase (NADP+) (non-phosphorylating) activity
  node_taxon:
    id: NCBITaxon:33090
    label: Viridiplantae
  evidence: IBD
  paint_snapshot: '20250919'
  seeds:
  - id: AGI_LocusCode:AT2G24270
  assessment: SOUND
  assessment_reason: >-
    Confirmed against the PANTHER 19 tree and alignment. The node is the Viridiplantae speciation node (91 leaves:
    Chlamydomonas, Klebsormidium, Marchantia, Physcomitrium, Selaginella and 73 angiosperm leaves, with 20 duplication
    nodes below it), and its seed, Arabidopsis ALDH11A3 (Q1WIQ6, AT2G24270), is a tree leaf below it with an IDA
    for the term from a null mutant that lacks the enzyme activity (PMID:16927206). The function is conserved across
    the clade on sequence grounds: 80 of 91 leaves carry the identical residue pattern at all 13 site positions
    of S. mutans GapN (Q59931), including the phosphate-binding Arg103, Arg283 and Arg437, Lys177 and Thr180 of
    the NADP 2'-phosphate site, and the catalytic Glu250 and Cys284; the Pentapetalae (SF11) and Brassica (SF7)
    paralog clades keep the same set. The 11 leaves that deviate are incomplete or aberrant gene models, not a diverged
    subclade: ten are short models of 215-439 residues (five Ricinus, two Brassica napus, one each from Manihot,
    Eucalyptus and Nelumbo; the Manihot fragment has Tyr at the Cys284 position and the Nelumbo model Glu at the
    Arg103 position) and one is a Selaginella model with an alignment gap at Arg283-Cys284, so no pruning is requested.
    PANTHER reconstructs the plant clade as a horizontal transfer nested in Bacilli: its sister is Bacillus cereus
    BC_0868 and the next outgroups are Streptococcus pneumoniae and Clostridium botulinum gapN, all with the same
    residue pattern, which agrees with the characterized NADP-dependent GapN of S. mutans and S. equinus and with
    the reported GapN activity of Bacillus, Streptococcus and Clostridium strains (PMID:7751269, PMID:16562377).
    The function is therefore probably older than this node (Firmicutes node PTN008677396), but no tree leaf outside
    Viridiplantae has an experimental annotation for the term, so the IBD cannot be seeded deeper from current annotations;
    the placement is conservative, not wrong. All 79 IBA rows for the term on family leaves lie below this node.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42991/PTHR42991-paint.tsv
    supporting_text: "PTHR42991\tPTN000193241\tGO:0008886\tF\tIBD\tfalse\tAGI_LocusCode:AT2G24270"
