family_id: PANTHER:PTHR42991
family_name: ALDEHYDE DEHYDROGENASE
preferred_name: >-
  GapN-related aldehyde dehydrogenases (non-phosphorylating glyceraldehyde-3-phosphate dehydrogenases and small-aldehyde
  dehydrogenase relatives)
summary: >-
  Members of the aldehyde dehydrogenase superfamily (Pfam PF00171) that oxidize an aldehyde to the corresponding
  carboxylate with NAD+ or NADP+ through a covalent thioacyl intermediate on a conserved cysteine, without forming
  an acyl phosphate. Most of the family tree (94 of 118 leaves in PANTHER 19) is one clade of non-phosphorylating,
  NADP-dependent glyceraldehyde-3-phosphate dehydrogenases (GapN, EC 1.2.1.9): the enzymes of Firmicutes (streptococci,
  clostridia, bacilli) and, nested among them, the cytosolic GapN (ALDH11) of green algae and land plants, which
  generates NADPH from triose phosphate exported from the chloroplast. All full-length members of this clade keep
  the three arginines that bind the substrate phosphate in Streptococcus mutans GapN (Arg103, Arg283, Arg437) and
  the threonine at position 180 of the NADP site. The remaining members lack that arginine set and have other substrates
  where they have been studied: the lactaldehyde dehydrogenase MJ1411 of Methanocaldococcus jannaschii (lactate
  supply for coenzyme F420, no activity with glyceraldehyde 3-phosphate), two succinate semialdehyde dehydrogenases
  of Saccharolobus solfataricus (SSO1629 and SSO1842, long named GapN-1 and GapN-2), the NAD+-dependent 3-sulfolactaldehyde
  dehydrogenases SlaB and SftD of Priestia (sulfo-TAL sulfoquinovose degradation), sulfoacetaldehyde dehydrogenase
  SafD, phosphonoacetaldehyde dehydrogenase PhnY and two Pseudomonas enzymes proposed to oxidize aspartate semialdehyde.
  The allosteric archaeal NAD(P)-dependent GapN enzymes of Thermoproteus tenax and S. solfataricus (SSO3194) are
  also classified here; they oxidize glyceraldehyde 3-phosphate but carry a histidine where bacterial and plant
  GapN have Arg437. A second, uncharacterized eukaryotic group (Dictyostelium and streptophyte paralogs distinct
  from plant GapN) branches with the archaeal members.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The ALDH-fold chemistry is shared and the catalytic cysteine (Cys284 of S. mutans GapN, UniProtKB:Q59931) is present
  in every full-length tree leaf, but substrate and cofactor differ between clades, and PANTHER subfamilies do not
  follow the functional boundaries: SF1 is the residual label at the family root and covers 101 of 118 tree leaves,
  including most plant GapN, all bacterial members and all archaeal and Dictyostelium members, while SF11 (a Pentapetalae
  GapN paralog clade) and SF7 (three Brassica leaves) are nested inside the plant GapN clade and keep the same GapN
  residues as their SF1 neighbours. The functional units are tree clades. (1) The Firmicutes plus Viridiplantae
  GapN clade (PTN008677396, 94 leaves): all full-length leaves read R/R/R at anchor positions 103, 283 and 437 and
  K177/T180, and the characterized members (S. mutans and S. equinus GapN, plant GapN) are NADP-specific glyceraldehyde-3-phosphate
  dehydrogenases. (2) The Archaea-Eukaryota clade (PTN008677383, 19 leaves): no leaf has Arg at 437 and only the
  Halobacterium leaf has Arg at 283; its characterized leaves are a lactaldehyde dehydrogenase (MJ1411, no activity
  with glyceraldehyde 3-phosphate) and two succinate semialdehyde dehydrogenases (SSO1629, SSO1842; PMID:23296511).
  (3) Bacterial leaves outside the GapN clade (B. cereus BC_2241, Streptomyces, Aquifex, Dictyoglomus, Geobacter)
  have V/S at 283 and F/Y at 437; the NAD+-dependent 3-sulfolactaldehyde dehydrogenases SlaB and SftD, which are
  not tree leaves, are 50% identical to members of this group and share its residues (V285, Y440, and Glu182 at
  the position where NADP-specific GapN has Thr180). A substrate-specific term therefore cannot be inherited from
  family or SF1 membership; it has to be placed on the clade that carries it.
