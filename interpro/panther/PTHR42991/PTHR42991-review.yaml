- node_id: PANTHER:PTN008677383
  asserted_term:
    id: GO:0008911
    label: lactaldehyde dehydrogenase (NAD+) activity
  evidence: IBD
  paint_snapshot: '20250919'
  seeds:
  - id: UniProtKB:Q58806
  assessment: TOO_DEEP
  assessment_reason: >-
    The single seed is Methanocaldococcus jannaschii MJ1411 (Q58806), whose IDA rests on enzyme assays of the MJ1411
    gene product: it oxidizes lactaldehyde with NAD+ for the lactate of coenzyme F420 and has no activity with glyceraldehyde
    3-phosphate (PMID:16585745). In the PANTHER 19 tree the IBD sits one step below the family root, at the Archaea-Eukaryota
    node (19 leaves), and all 19 IBA rows for the term lie below it. The seed is one of those leaves and the other
    18 do not support inheritance. (1) The two Saccharolobus solfataricus leaves, SSO1629 (Q97XS9) and SSO1842 (Q97XA5),
    have been characterized biochemically as succinate semialdehyde dehydrogenases, with physiologically significant
    activity only on succinate semialdehyde and alpha-ketoglutarate semialdehyde (PMID:23296511), so the IBA is
    contradicted by experiment on the nearest archaeal clade; in the alignment they read Asn/Leu where MJ1411 has
    Val273/Phe426 (anchor positions 283 and 437). (2) The seed's sister leaf, Halobacterium salinarum Q9HQZ2, is
    34% identical to MJ1411 and differs at the substrate-site positions (Ser108, Tyr158, Lys180, Arg286, His445
    against Arg96, Phe141, His163, Val273, Phe426 of MJ1411); with Tyr, Lys, Arg and His at anchor positions 155,
    177, 283 and 437 it matches the archaeal NAD(P)-dependent GapN of Thermoproteus tenax (Tyr169, Lys191, Arg296,
    His455), not the seed. (3) The 15 eukaryotic leaves (two Dictyostelium, 13 streptophyte) have no experimental
    annotation and read Ser at 283 and Met, Val, Leu or Thr at 437 where the sequence covers those positions; seven
    of the nine Selaginella leaves and two Marchantia leaves are fragmentary or fused gene models. No internal node
    below the IBD has a second experimentally supported member: the Methanococcales orthologs that share the seed's
    residues (57-63% identity) are not tree leaves, and the smallest internal node containing the seed (Euryarchaeota,
    PTN002873899) would pass the term only to the GapN-like Halobacterium protein. The request is therefore to retire
    the IBD; MJ1411 keeps the term through its own IDA. This corrects the earlier text of this review, which described
    the node as deep in SF1 and as the source of the TreeGrafter rows on the bacterial 3-sulfolactaldehyde dehydrogenases
    SlaB and SftD. Those rows cite the eubacterial node PTN008677393, the sister of the IBD node, and 20 of the
    22 TreeGrafter rows for this term on family members cite graft points outside the IBD clade (the family root,
    the Firmicutes node, plant GapN leaves), so they do not follow from the current PAINT placement and are a separate
    TreeGrafter data issue.
  supported_by:
  - reference_id: file:interpro/panther/PTHR42991/PTHR42991-paint.tsv
    supporting_text: "PTHR42991\tPTN008677383\tGO:0008911\tF\tIBD\tfalse\tUniProtKB:Q58806"
