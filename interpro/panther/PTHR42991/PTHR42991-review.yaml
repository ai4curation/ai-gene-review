family_id: PANTHER:PTHR42991
family_name: ALDEHYDE DEHYDROGENASE
preferred_name: Aldehyde dehydrogenase-related metabolic enzymes (GapN, lactaldehyde, sulfoacetaldehyde and sulfolactaldehyde dehydrogenases)
summary: >-
  Members of the aldehyde dehydrogenase superfamily (Pfam PF00171) that oxidize small phosphorylated
  or sulfonated aldehydes to the corresponding acids with NAD+ or NADP+, without forming an acyl
  phosphate. The characterized SwissProt members in the local inventory (24 proteins, all in subfamily
  SF1) include the non-phosphorylating glyceraldehyde-3-phosphate dehydrogenases (GapN) of plants,
  green algae, streptococci and crenarchaea, the lactaldehyde dehydrogenases of Methanococcales
  (F420 biosynthesis), the sulfoacetaldehyde dehydrogenase SafD, the phosphonoacetaldehyde
  dehydrogenase PhnY, two Pseudomonas aspartate-semialdehyde dehydrogenases, and the
  3-sulfolactaldehyde (SLA) dehydrogenases SlaB (Bacillus megaterium) and SftD (Bacillus
  aryabhattai) of the sulfo-TAL sulfoquinovose degradation pathway, which oxidize SLA to
  sulfolactate with NAD+.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The ALDH-fold chemistry (NAD(P)+-dependent oxidation of an aldehyde to a carboxylate) is shared,
  but substrate and cofactor differ between characterized members, and PANTHER places all of them
  in one subfamily (SF1): GapN oxidizes glyceraldehyde 3-phosphate with NADP+ (plants, streptococci)
  or NAD(P)+ (crenarchaea), the Methanococcus enzymes oxidize lactaldehyde, SafD sulfoacetaldehyde,
  PhnY phosphonoacetaldehyde and SlaB/SftD 3-sulfolactaldehyde. A substrate-specific term therefore
  cannot be inherited from SF1 membership; substrate has to be established per member from assay or
  gene-cluster context.
