family_id: PANTHER:PTHR11920
family_name: GUANYLYL CYCLASE
preferred_name: Guanylyl Cyclase
summary: GUANYLYL CYCLASE (PANTHER:PTHR11920) is characterized in PANTHER PAINT across 6 ancestral PTN node(s) (PANTHER:PTN000228929,
  PANTHER:PTN000229249, PANTHER:PTN000938100, PANTHER:PTN002629644 (+2 more)) with 13 IBD node assertion(s) and
  3 term(s) carrying negated IRD/IKR branch blocks, covering natriuretic peptide receptor activity (GO:0016941,
  MF), peptide hormone binding (GO:0017046, MF), plasma membrane (GO:0005886, CC), peptide receptor activity (GO:0001653,
  MF) and 9 additional GO term(s).
functional_coherence: HETEROGENEOUS
coherence_reason: PAINT annotations for PANTHER:PTHR11920 (GUANYLYL CYCLASE) span 6 distinct ancestral PTN nodes
  (PANTHER:PTN000228929, PANTHER:PTN000229249, PANTHER:PTN000938100, PANTHER:PTN002629644, PANTHER:PTN008332489
  (+1 more)) with different molecular function assignments across clades (natriuretic peptide receptor activity
  (GO:0016941), peptide receptor activity (GO:0001653), guanylate cyclase activity (GO:0004383), adenylate cyclase
  activity (GO:0004016) and 1 additional molecular function term(s)), indicating clade-level functional specialization
  across the family.
