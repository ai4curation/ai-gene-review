family_id: PANTHER:PTHR45928
family_name: RE38146P
preferred_name: Mitochondrial carrier family of SLC25A34/SLC25A35 (and, by UniProt/InterPro, the fungal Oac1 carriers)
summary: >-
  Mitochondrial carrier (SLC25) proteins with the six-transmembrane-helix carrier fold. By PANTHER
  19.0's own classification files the family holds the vertebrate orphan carriers SLC25A34
  (SF3) and SLC25A35 (SF2) and a group of Drosophila carriers (SF1, named after the fly cDNA clone
  RE38146P). No substrate has been established for these proteins in the sources reviewed here.
  UniProt cross-references and the InterPro member inventory also place the fungal
  mitochondrial oxaloacetate/sulfate/alpha-isopropylmalate carrier Oac1 (S. cerevisiae OAC1, S.
  pombe oac1), Dictyostelium UcpA and Aspergillus niger CtpE in SF1, but PANTHER's HMM
  classification places Oac1, oac1 and UcpA in PTHR45618:SF18 instead. The family's membership,
  and therefore whether any functional statement about Oac1 belongs here, depends on which
  classification is used.
functional_coherence: UNKNOWN
coherence_reason: >-
  The members PANTHER 19.0 itself assigns to the family (vertebrate SLC25A34/SLC25A35 and the fly
  SF1 carriers) have no characterized substrate in the sources reviewed. The only
  biochemically characterized protein attributed to the family, S. cerevisiae Oac1, is attributed
  only by UniProt/InterPro; PANTHER's own classification puts it in PTHR45618. Generic
  mitochondrial-carrier properties (inner-membrane location, transmembrane transport) are
  expected from the fold, but no substrate-level coherence can be judged.
