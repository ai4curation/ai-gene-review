notes: >-
  Placement sources compared on 2026-11-12. (1) PTHR45928-entries.csv (InterPro protein list) and
  the UniProt DR PANTHER lines of P32332 and Q9UTN1 give PTHR45928:SF1 "RE38146P". (2) PANTHER
  19.0 classification files (PTHR19.0_budding_yeast, PTHR19.0_fission_yeast,
  PTHR19.0_dictyostelium) give PTHR45618:SF18 "MITOCHONDRIAL OXALOACETATE TRANSPORT PROTEIN" for
  OAC1, oac1 and ucpA, and PTHR45928 only for vertebrate SLC25A34/SLC25A35 (and their orthologs
  in chicken, frog and fish) and three Drosophila carriers in SF1. (3) The project member index
  built from both records both assignments for P32332 and Q9UTN1, with PTHR45618:SF18 as the
  PANTHER-file placement. The PAINT tree agrees with (2): the IBAs OAC1 and oac1 receive come
  from PTN002515516, the PTHR45618 root. This review therefore treats Oac1 as a PTHR45618:SF18
  protein and describes PTHR45928 from its undisputed members. The reference protein is human
  SLC25A34 because its placement agrees in every source; it has no gene review, and no member
  of PTHR45928 with undisputed placement has one. OAC1 and oac1 have gene reviews
  (genes/yeast/OAC1, genes/SCHPO/oac1) but are not used as reference proteins here for the reason
  above. The PTN002515516 rows appear in this family's paint.tsv slice although TreeGrafter puts
  the node in PTHR45618; they are assessed here because the slice lists them.
