- subfamily_id: PANTHER:PTHR45928:SF1
  label: RE38146P
  description: >-
    Membership differs by source. PANTHER 19.0's Drosophila classification file places the fly
    carriers CG18327 (A1Z9L9), CG8323 (Q7JZE8) and CG18324 (A1Z9M0) here. The InterPro member
    inventory (entries.csv) and the UniProt DR PANTHER lines instead list four reviewed fungal
    and amoebozoan members here: S. cerevisiae OAC1 (P32332), S. pombe oac1 (Q9UTN1),
    Dictyostelium ucpA (Q55BF4) and Aspergillus niger ctpE (G3XP90). PANTHER 19.0's own
    classification files (budding yeast, fission yeast and Dictyostelium) place OAC1, oac1 and
    ucpA in PTHR45618:SF18 "MITOCHONDRIAL OXALOACETATE TRANSPORT PROTEIN"; ctpE is not in a
    PANTHER 19.0 organism file. Because of this disagreement, the alpha-isopropylmalate export
    function of Oac1 in leucine biosynthesis (PMID:18682385) is recorded on PTHR45618:SF18, which
    is the selector the BCAA module uses, and is not asserted for this subfamily.
