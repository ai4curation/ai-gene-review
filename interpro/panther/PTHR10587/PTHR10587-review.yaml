family_id: PANTHER:PTHR10587
family_name: GLYCOSYL TRANSFERASE-RELATED
preferred_name: CE4 polysaccharide deacetylase family
summary: >-
  Carbohydrate esterase family 4 metalloenzymes that remove N-acetyl or N-formyl groups from amino-sugar
  polymers or lipid-linked sugars. The family contains fungal chitin deacetylases (S. cerevisiae
  CDA1/CDA2, which make chitosan in the ascospore wall; Cryptococcus CDA1-3), bacterial peptidoglycan
  deacetylases (PgdA, PdaA), polysaccharide deacetylases, and the ArnD formyl-arabinose deformylase
  of lipid A modification (the largest subfamily).
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The CE4 catalytic mechanism is shared, but the substrate differs by subfamily: chitin (SF133, SF98,
  SF135), peptidoglycan (SF78, and bacterial PgdA within SF133), chitooligosaccharides (SF80), and
  undecaprenyl-linked 4-formamido-arabinose (ArnD, SF137).
