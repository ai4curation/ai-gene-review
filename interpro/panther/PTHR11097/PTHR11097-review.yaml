  - node_id: PANTHER:PTN000120503
    asserted_term:
      id: GO:0035925
      label: mRNA 3'-UTR AU-rich region binding
    evidence: IBD
    negated: false
    paint_snapshot: '20240205'
    seeds:
      - id: UniProtKB:Q06265
      - id: UniProtKB:Q96B26
    assessment: TOO_DEEP
    assessment_reason: >-
      The AU-rich RNA-binding seed proteins are human EXOSC8/OIP2 and EXOSC9/PM-Scl75.
      PMID:16912217 also tested EXOSC4/RRP41, but not EXOSC7/RRP42. PTN000120503 is the
      PTHR11097 root and therefore propagates the term to EXOSC7 and archaeal RRP42
      branches where AU-rich eukaryotic mRNA binding is unsupported. The term should be
      removed from the root and asserted only on experimentally supported descendant
      branches.
    proposed_action:
      paint_action: REMOVE_IBD
    supported_by:
      - reference_id: file:interpro/panther/PTHR11097/PTHR11097-paint.tsv
        supporting_text: "PTHR11097\tPTN000120503\tGO:0035925\tF\tIBD\tfalse"
      - reference_id: PMID:16912217
        supporting_text: >-
          RNase PH domains from two other exosomal components, OIP2 and RRP41, as well
          as from Escherichia coli polynucleotide phosphorylase, are all capable of
          specifically interacting with RNAs containing an AU-rich element
  - node_id: PANTHER:PTN000120504
