family_id: PANTHER:PTHR11097
family_name: EXOSOME COMPLEX EXONUCLEASE  RIBOSOMAL RNA PROCESSING PROTEIN
preferred_name: RNA exosome RNase PH-like core subunits RRP42, RRP43 and RRP45
summary: >-
  PTHR11097 groups RNase PH-like RNA exosome core proteins, including human EXOSC7/RRP42,
  EXOSC8/RRP43/OIP2 and EXOSC9/RRP45/PM-Scl75. In eukaryotes these subunits are
  catalytically inert components of the nine-subunit Exo-9 scaffold, which forms the core of
  nuclear, nucleolar and cytoplasmic RNA exosome complexes and presents substrates to the
  associated DIS3, DIS3L and EXOSC10/RRP6 ribonucleases. PAINT correctly propagates the
  nuclear and cytoplasmic exosome complex placements and conserved nuclear RNA-processing
  processes to the human members. Its AU-rich RNA-binding IBD is over-broad: the human
  experimental seeds support EXOSC8 and EXOSC9, but the root placement also descends to
  EXOSC7 and archaeal RRP42 proteins.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  The family is coherent for RNA exosome core membership and scaffold function, and the
  cytoplasmic and nuclear exosome PAINT assertions are sound for the reviewed human
  RRP42/RRP43/RRP45 proteins. However, RNA exosome subunits occupy distinct positions in
  the ring and do not all share the same direct RNA-binding details: the GO:0035925
  AU-rich RNA-binding assertion is supported for the human RRP43 and RRP45 subfamilies
  but is over-propagated from the root to RRP42.
