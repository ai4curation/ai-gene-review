term_assessments:
  - assessed_term:
      id: GO:0000178
      label: exosome (RNase complex)
    scope: FAMILY_WIDE
    scope_reason: >-
      Human EXOSC7, EXOSC8 and EXOSC9, their yeast orthologs, and archaeal RRP42
      proteins are all RNase PH-like exosome core proteins. This broad complex term is
      safe family-wide even though eukaryotic nuclear/nucleolar/cytoplasmic variants add
      distinct catalytic subunits and cofactors.
    supported_by:
      - reference_id: PMID:20531389
        supporting_text: >-
          The nine-subunit core of the eukaryotic exosome is catalytically inactive and
          may have an architectural function and mediate substrate binding.
  - assessed_term:
      id: GO:0000176
      label: nuclear exosome (RNase complex)
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR11097:SF8
        label: EXOSOME COMPLEX COMPONENT RRP42
      - id: PANTHER:PTHR11097:SF9
        label: EXOSOME COMPLEX COMPONENT RRP43
      - id: PANTHER:PTHR11097:SF14
        label: EXOSOME COMPLEX COMPONENT RRP45
    scope_reason: >-
      Nuclear and nucleolar RNA exosome membership is safe for the eukaryotic human
      RRP42/RRP43/RRP45 subfamilies, but the term is not meaningful for the archaeal
      RRP42-like proteins in the PTHR11097 root.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11097/PTHR11097-paint.tsv
        supporting_text: "PTHR11097\tPTN000120504\tGO:0000176\tC\tIBD\tfalse"
  - assessed_term:
      id: GO:0035925
      label: mRNA 3'-UTR AU-rich region binding
    scope: SUBFAMILY_ONLY
    applicable_subfamilies:
      - id: PANTHER:PTHR11097:SF9
        label: EXOSOME COMPLEX COMPONENT RRP43
      - id: PANTHER:PTHR11097:SF14
        label: EXOSOME COMPLEX COMPONENT RRP45
    scope_reason: >-
      AU-rich RNA binding is directly supported for EXOSC8 and EXOSC9 but should not
      sit at the PTHR11097 root.
    supported_by:
      - reference_id: file:interpro/panther/PTHR11097/PTHR11097-paint.tsv
        supporting_text: "PTHR11097\tPTN000120503\tGO:0035925\tF\tIBD\tfalse"
