  name:
    name: Exosome complex component Rrp42 subfamily
    short: Exosome_comp_Rrp42_subfam
  description:
  - text: The Rrp42 subfamily of the RNase PH family is comprised of non-catalytic
      components of the RNA exosome complex, which is essential for 3'->5' exoribonuclease
      activity. The family plays a significant role in RNA processing and degradation,
      contributing to the maturation of stable RNA species such as rRNA, snRNA, and
      snoRNA, as well as the elimination of RNA processing by-products and non-coding
      transcripts. In the nucleus, it helps limit the export of defective mRNAs to
      the cytoplasm. In the cytoplasm, it is involved in mRNA turnover, degrading
      unstable mRNAs with AU-rich elements and participating in RNA surveillance pathways
      to prevent translation of aberrant mRNAs. Members of the Rrp42 subfamily are
      also implicated in structuring the active site of other exosome components,
      such as Rrp41, and may be involved in Ig class switch recombination and somatic
      hypermutation.
