family_id: PANTHER:PTHR10631
family_name: N 2 ,N 2 -DIMETHYLGUANOSINE TRNA METHYLTRANSFERASE
preferred_name: Trm1/TRMT1 tRNA guanine dimethyltransferase family
summary: >-
  PTHR10631 contains SAM-dependent Trm1-like tRNA guanine dimethyltransferases.
  The ancestral family function is guanine N2 dimethylation on tRNA substrates,
  but the exact target position has diverged. Human TRMT1 belongs to the canonical
  G26 Trm1 subfamily and dimethylates position 26 of cytoplasmic and mitochondrial
  tRNAs. Vertebrate TRMT1L belongs to a paralogous subfamily that has lost the
  G26-specific activity and now dimethylates G27 of tRNA(Tyr); a cached PAINT row
  also asserts a dual G26/G27 activity on an Archaea-scoped node whose bacterial
  Aquifex seed leaves that placement unresolved.
functional_coherence: HETEROGENEOUS
coherence_reason: >-
  The family is coherent at the level of tRNA guanine dimethyltransferase
  activity and tRNA processing, but not at a single nucleotide position. PAINT
  handles the human split correctly: PTN000066880 carries the G26-specific
  GO:0160104 term that reaches TRMT1, and PTN000066953 prunes that term from
  TRMT1L while retaining generic guanine methyltransferase activity.
