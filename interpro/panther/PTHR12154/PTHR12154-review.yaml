family_id: PANTHER:PTHR12154
family_name: GLYCOSYL TRANSFERASE-RELATED
preferred_name: ALG14 UDP-GlcNAc transferase membrane subunit family
summary: >-
  Alg14 is the ER membrane-anchored subunit of the Alg13-Alg14 UDP-GlcNAc transferase. It recruits
  the cytosolic catalytic subunit Alg13 to the ER membrane for the second step of lipid-linked oligosaccharide
  assembly (S. cerevisiae ALG14, S. pombe alg14, human ALG14).
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF4) of Alg14 membrane anchors.
