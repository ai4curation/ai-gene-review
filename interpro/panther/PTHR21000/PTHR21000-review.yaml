subfamilies:
- subfamily_id: PANTHER:PTHR21000:SF5
  label: DIHYDROXY-ACID DEHYDRATASE, MITOCHONDRIAL
  description: >-
    The whole reviewed inventory: fungal mitochondrial DHADs (S. cerevisiae ILV3, S. pombe ilv3,
    A. fumigatus IlvC), Arabidopsis plastid DHAD, M. tuberculosis IlvD, and bacterial and archaeal
    IlvD paralogs (for example rhizobial IlvD2/IlvD3 and Sulfolobus IlvD). "MITOCHONDRIAL" in the
    PANTHER name applies only to the fungal members. In the branched-chain amino acid pathway
    these enzymes form 2-oxoisovalerate and 3-methyl-2-oxopentanoate in the shared trunk; in
    fungi this step is in the mitochondrial matrix, upstream of the mitochondrial transaminase
    BAT1/eca39. The BCAA module selects this step by NCBIfam TIGR00110 rather than a PANTHER
    family, because the E. coli-type bacterial enzymes are in PTHR43661.
