    id: UniProtKB:P39522
    label: ILV3
    gene_symbol: ILV3
    organism: Saccharomyces cerevisiae
  anchor_sequence_version: 2
  residues:
  - position: 70
    expected:
    - C
    role: '[2Fe-2S] cluster ligand'
  - position: 143
    expected:
    - C
    role: '[2Fe-2S] cluster ligand'
  - position: 221
    expected:
    - C
    role: '[2Fe-2S] cluster ligand'
  required_for:
  - term:
      id: GO:0004160
      label: dihydroxy-acid dehydratase activity
    strength: CONTRIBUTES
    rationale: >-
      The [2Fe-2S] cluster is the Lewis-acid cofactor that binds the substrate hydroxyl during
      dehydration; ILV3 activity disappears when cluster assembly fails under iron limitation.
      Kept at CONTRIBUTES because the ligand positions are transferred by similarity, not
      determined for ILV3 itself.
    supported_by:
