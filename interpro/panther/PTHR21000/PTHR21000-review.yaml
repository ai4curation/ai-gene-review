family_id: PANTHER:PTHR21000
family_name: DIHYDROXY-ACID DEHYDRATASE  DAD
preferred_name: Dihydroxy-acid dehydratase, plant/fungal/mycobacterial lineage (ILV3, ilv3, Arabidopsis DHAD, Mtb IlvD)
summary: >-
  Dihydroxy-acid dehydratases (DHAD, EC 4.2.1.9) of the IlvD/EDD superfamily that catalyse the
  third shared step of branched-chain amino acid biosynthesis: dehydration of
  (2R)-2,3-dihydroxy-3-methylbutanoate to 2-oxoisovalerate (valine and leucine precursor) and of
  (2R,3R)-2,3-dihydroxy-3-methylpentanoate to 3-methyl-2-oxopentanoate (isoleucine precursor).
  The family holds the fungal mitochondrial enzymes (S. cerevisiae ILV3, S. pombe ilv3,
  Aspergillus fumigatus IlvC), the plastid enzyme of plants (Arabidopsis DHAD), Mycobacterium
  tuberculosis IlvD, and IlvD paralogs of many bacteria and archaea. Members bind a [2Fe-2S]
  cluster that acts as a Lewis acid, together with Mg(2+); the [2Fe-2S] cluster type was first
  described for the spinach enzyme. Bacterial IlvD of the E. coli type, which carries a [4Fe-4S]
  cluster, is in the separate PANTHER family PTHR43661. Fungal members are mitochondrial matrix
  enzymes, plant members plastidic, and prokaryotic members cytoplasmic. Some fungi carry extra
  DHAD paralogs encoded in secondary-metabolite gene clusters (Aspergillus terreus astD,
  Penicillium brasilianum pbrD).
functional_coherence: COHERENT
coherence_reason: >-
  Every member of the reviewed inventory (160 of 160, all in SF5) is named a dihydroxy-acid
  dehydratase, and the characterized members from fungi (ILV3, ilv3), plants and Mycobacterium
  are active DHADs with the same cofactor architecture. The catalytic and pathway terms are
  therefore safe family-wide. What varies is compartment, which follows lineage (mitochondrion
  in Dikarya, plastid in plants, cytoplasm in prokaryotes), and the biological role of the
  secondary-metabolite-cluster paralogs, which was not reviewed here.
