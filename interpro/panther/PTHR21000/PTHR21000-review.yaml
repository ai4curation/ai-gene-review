notes: >-
  PANTHER's official family name contains a double space ("DIHYDROXY-ACID DEHYDRATASE  DAD") and
  is copied verbatim. panther.obo lists SF5, SF13 and SF14 (the latter two named
  "DIHYDROXY-ACID DEHYDRATASE"), but every reviewed member in entries.csv is SF5; SF13 and SF14
  are not described because no reviewed member falls in them. Node receivers were read from the
  PAINT UniProt GAF. The [2Fe-2S] versus [4Fe-4S] split between this family and PTHR43661 is
  stated from the members characterized (spinach-type plant enzyme here; E. coli, S. aureus and
  C. jejuni IlvD in PTHR43661); cluster type was not determined for every member of either family.
  Because the bacterial E. coli-type enzymes are in PTHR43661, the BCAA module correctly avoids a
  single PANTHER selector for the dihydroxy-acid dehydratase step.
