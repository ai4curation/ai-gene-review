family_id: PANTHER:PTHR38693
family_name: UBIQUINONE BIOSYNTHESIS PROTEIN UBIJ
preferred_name: UbiJ SCP2-domain ubiquinone biosynthesis scaffold family
summary: >-
  UbiJ is a proteobacterial accessory factor of aerobic ubiquinone
  biosynthesis. Escherichia coli UbiJ carries a C-terminal SCP2 lipid-binding
  domain that binds hydrophobic ubiquinone intermediates and is essential for
  the stability of the soluble cytoplasmic Ubi complex, a 1-MDa metabolon that
  performs the last six reactions of the pathway; it also binds UbiK. UbiJ has
  no catalytic activity. Pseudomonas putida KT2440 UbiJ is assigned to the
  same subfamily by sequence alone.
functional_coherence: COHERENT
coherence_reason: >-
  A single subfamily (SF1) of UbiJ scaffolds; the characterized member is E.
  coli UbiJ, and the other listed members are enterobacterial orthologs.
