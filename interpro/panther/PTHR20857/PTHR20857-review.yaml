family_id: PANTHER:PTHR20857
family_name: THIAMINE-PHOSPHATE PYROPHOSPHORYLASE
preferred_name: Thiamine-phosphate synthase (ThiE/THI6) family
summary: >-
  Thiamine-phosphate synthases couple the pyrimidine (HMP-PP) and thiazole moieties into thiamine
  monophosphate. The family contains bacterial ThiE (SF15) and the bifunctional fungal THI6 (S. cerevisiae
  THI6, S. pombe thi4; SF23), which adds a hydroxyethylthiazole kinase domain. TenI (SF22) is a ThiE-like
  thiazole tautomerase without synthase activity.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  TMP synthase activity holds for SF15 and SF23. TenI (SF22) is non-synthase. The thiazole kinase
  domain is present only in the fungal bifunctional members of SF23.
