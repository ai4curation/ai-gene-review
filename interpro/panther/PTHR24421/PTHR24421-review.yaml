  - subfamily_id: PANTHER:PTHR24421:SF10
    label: NITRATE_NITRITE SENSOR PROTEIN NARQ
    description: >-
      Despite its NarQ label, this subfamily groups sensor kinases with unrelated
      inputs: E. coli NarQ (nitrate and nitrite), staphylococcal NreB (oxygen),
      several uncharacterized B. subtilis kinases, and the Pseudomonas putida
      KT2440 lanthanide-responsive sensor PedS2 (PP_2671), which phosphorylates
      the LuxR-type regulator PedR2 in the absence of lanthanides. The shared
      molecular function is phosphorelay sensor kinase activity; the sensed
      signal is member-specific.
