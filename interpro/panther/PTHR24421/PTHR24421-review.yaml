notes: >-
  Reviewed as the family grounding for the PedS2 sensor kinase in
  MODULE:pseudomonad_lanthanide_switch_pqq_alcohol_oxidation. The family id
  grounds only the generic phosphorelay sensor kinase activity of PedS2; its
  lanthanide responsiveness is a member-level property supported by PMID:30158283
  and is not inherited by other SF10 members. Subfamily assignments are from
  UniProt PANTHER cross-references and the cached entries inventory. Node
  coverage was read from the PANTHER 19 tree (pantherdb.org treeinfo service,
  fetched 2026-10-23); PedS2 (Q88JH8) and M. extorquens MxcQ are not leaves of
  that tree because their proteomes are not PANTHER reference proteomes, which
  is why neither carries IBA annotations from these nodes.
