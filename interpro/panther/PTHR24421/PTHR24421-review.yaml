family_id: PANTHER:PTHR24421
family_name: NITRATE/NITRITE SENSOR PROTEIN NARX-RELATED
preferred_name: HisKA_3 (NarX/NarQ/UhpB/DesK-type) sensor histidine kinases
summary: >-
  Bacterial sensor histidine kinases of two-component systems that share the
  HisKA_3 dimerization/phosphoacceptor subdomain and a C-terminal HATPase_c
  catalytic domain, usually preceded by transmembrane helices, a periplasmic or
  membrane-embedded sensing region and a HAMP linker. Members autophosphorylate a
  conserved histidine and transfer the phosphoryl group to the receiver aspartate
  of a cognate response regulator, which in this lineage is almost always a
  LuxR/NarL-type (GerE-domain) transcription factor of PANTHER PTHR43214. Many
  members are bifunctional and also stimulate dephosphorylation of their partner
  regulator when the stimulus is absent. The catalytic chemistry is conserved
  across the family, but the sensed input is not: it includes nitrate and nitrite
  (E. coli NarX and NarQ), external glucose-6-phosphate via UhpC (UhpB), membrane
  fluidity and temperature (B. subtilis DesK), cell-envelope stress (LiaS, VraS),
  oxygen via an iron-sulfur cluster (staphylococcal NreB), hypoxia, NO and CO via
  heme (mycobacterial DosS and DosT), methanol-oxidation control in
  methylotrophs (Paracoccus MoxY), and lanthanide availability in Pseudomonas
  putida (PedS2), so input-specific process terms cannot be inherited from the
  subfamily label.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  Phosphorelay sensor kinase activity (histidine autophosphorylation and
  His-to-Asp phosphotransfer to a cognate response regulator) is shared by the
  characterized members and is safe family-wide. The family is heterogeneous in
  its sensory input and partner regulator, and PANTHER subfamily labels do not
  track the input: SF10 (named for NarQ) also holds the oxygen sensor NreB and the
  lanthanide-responsive PedS2, and SF58 (named for UhpB) also holds the methanol
  regulators MoxY and MxcQ. Subcellular placement also varies: most members are
  integral inner-membrane proteins, but the mycobacterial heme-GAF kinases (SF56)
  have a different, sensor-domain architecture, so a family-wide plasma-membrane
  assertion should be checked against the clade it covers.
