family_id: PANTHER:PTHR10909
family_name: ELECTRON TRANSPORT OXIDOREDUCTASE
preferred_name: Peroxisomal acyl-CoA oxidase (ACOX/POX) family
summary: >-
  FAD-dependent peroxisomal acyl-CoA oxidases catalyse the first, H2O2-producing step of peroxisomal
  beta-oxidation. Substrate preference differs by paralog: ACOX1 for straight-chain and very-long-chain
  acyl-CoAs, ACOX2 for the bile-acid intermediate trihydroxycholestanoyl-CoA, ACOX3 for pristanoyl-CoA,
  and S. cerevisiae POX1, the single fungal enzyme.
functional_coherence: MOSTLY_COHERENT
coherence_reason: >-
  All subfamilies are acyl-CoA oxidases; the acyl substrate (straight-chain, branched, bile-acid
  intermediate) is set by subfamily.
