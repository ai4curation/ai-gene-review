family_id: PANTHER:PTHR20371
family_name: ENOLASE-PHOSPHATASE E1
preferred_name: Enolase-phosphatase E1 (MtnC/UTR4/ENOPH1) family
summary: >-
  HAD-superfamily enolase-phosphatases convert 2,3-diketo-5-methylthiopentyl 1-phosphate to the acireductone
  1,2-dihydroxy-3-keto-5-methylthiopentene in the methionine salvage pathway (bacterial MtnC, S.
  cerevisiae UTR4, S. pombe utr4, human ENOPH1). In some plants the enzyme is fused to MtnB.
functional_coherence: COHERENT
coherence_reason: A single subfamily (SF1) of enolase-phosphatases.
