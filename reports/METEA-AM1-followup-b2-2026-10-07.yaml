ledger:
  ackA:
    accession: C5AT21
    status: corrected
    reviewed_and_supported:
      - >-
        The AM1 accession, strain and locus identify a conserved acetate kinase
        inferred from HAMAP family evidence.
      - >-
        The exact GO:0008776 acetate kinase activity remains the core molecular
        function, with cytosolic localization and Mg2+/Mn2+ cofactor use
        retained as family-supported inferences.
    corrections:
      - >-
        Demoted GO:0006085 acetyl-CoA biosynthetic process from ACCEPT to
        KEEP_AS_NON_CORE and removed it from core_functions because
        acetate-grown AM1 barely detected AckA/Pta and predicted acetate
        activation mainly through AMP-forming Acs.
      - >-
        Demoted the generic phosphotransferase parent to non-core because the
        exact acetate kinase activity row carries the core molecular function.
      - Added PMID:22105076 primary acetate-growth evidence.
    unresolved:
      - >-
        No direct AM1 purified-enzyme kinetics, localization assay, AckA
        knockout phenotype or condition where AckA-Pta is the dominant
        acetate-activation route was found.
  pta:
    accession: C5B1T5
    status: corrected
    reviewed_and_supported:
      - >-
        The AM1 accession, strain and locus identify a predicted phosphate
        acetyltransferase with the PTA_PTB domain.
      - >-
        The exact GO:0008959 phosphate acetyltransferase activity remains the
        core molecular function.
    corrections:
      - >-
        Demoted the generic acyltransferase activity row from ACCEPT to
        KEEP_AS_NON_CORE because it is a parent of the exact phosphate
        acetyltransferase activity.
      - >-
        Added PMID:22105076 primary context to record that AckA/Pta was barely
        detected under acetate-growth conditions.
    unresolved:
      - >-
        Direct AM1 Pta kinetics and condition-specific AckA-Pta flux remain
        experimentally unresolved.
  acnA:
    accession: C5ATQ7
    status: corrected
    reviewed_and_supported:
      - >-
        The AM1 accession and locus identify an aconitate hydratase/aconitase
        whose TCA-cycle role is supported by UniProt pathway annotation and AM1
        central-metabolism studies.
      - >-
        The exact GO:0003994 aconitate hydratase activity remains the core
        molecular function.
    corrections:
      - >-
        Changed GO:0047456 2-methylisocitrate dehydratase activity from
        KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED because the Rhea projection
        is only a plausible, hedged side-activity inference for AM1.
      - >-
        Removed description and core-function wording that treated
        propionate/short-chain fatty-acid catabolism as an established AcnA
        function.
    unresolved:
      - >-
        AcnA 2-methylcitrate-cycle activity, propionate physiology and apo-AcnA
        RNA-binding regulation have not been directly resolved in AM1.
  fumC:
    accession: Q8KTE1
    status: reviewed_supported
    reviewed_and_supported:
      - >-
        FumC is the only curated AM1 fumarase review in the METEA set; the
        fetched UniProt record maps Q8KTE1 to fumC/MexAM1_META1p2857.
      - >-
        GOA rows all align to the exact fumarate hydratase activity, its direct
        fumarate/malate metabolism, the TCA-cycle process or non-core ancestors.
    corrections: []
    unresolved:
      - >-
        The review still distinguishes organism-supported TCA context from
        family-level directionality, cytosolic localization and oligomeric
        inference; no edit was required in this batch.
  gltA:
    accession: C5AU34
    status: reviewed_supported
    reviewed_and_supported:
      - >-
        GltA is the only curated AM1 citrate synthase review in the METEA set;
        the fetched UniProt record maps C5AU34 to gltA/MexAM1_META1p5129.
      - >-
        GOA rows all align to the exact citrate synthase activity, the
        TCA-cycle process, inferred cytosol localization or non-core
        acyltransferase parents.
    corrections: []
    unresolved:
      - >-
        Direct AM1 purified-enzyme kinetics and localization were not found,
        and the review already frames cytosolic localization as an inference.
  icd:
    accession: C5AXM3
    status: corrected
    reviewed_and_supported:
      - >-
        The AM1 accession and locus identify an NADP-dependent isocitrate
        dehydrogenase that performs the oxidative decarboxylation of
        D-threo-isocitrate to 2-oxoglutarate.
      - >-
        The existing glyoxylate-bypass over-annotation decision and TCA-cycle
        placement are supported by the acetate-growth primary paper.
    corrections:
      - >-
        Replaced generated-report snippets with PMID:21124828 primary support
        for the NADPH-producing AM1 Icd assay.
      - >-
        Replaced generated-report snippets with PMID:22105076 primary support
        for acetate-grown TCA operation and AM1's lack of isocitrate lyase.
    unresolved:
      - >-
        The NADP-specific replacement for the NAD-binding parent remains a
        proposed ontology improvement rather than a direct existing GOA row.
  sucB:
    accession: C5B053
    status: corrected
    reviewed_and_supported:
      - >-
        The AM1 accession and locus identify the dihydrolipoyllysine-residue
        succinyltransferase E2 core of the 2-oxoglutarate dehydrogenase complex.
      - >-
        GO:0004149 and GO:0045252 remain the exact core activity and complex
        annotations.
    corrections:
      - >-
        Removed project/GEM curation commentary from the top-level biological
        description.
      - >-
        Replaced bare UniProt:C5B053 references with the fetched local UniProt
        file reference used elsewhere in the review.
      - >-
        Demoted the generic transferase and acyltransferase parent MFs to
        non-core.
      - >-
        Removed obsolete GO:0033512 saccharopine lysine catabolism as an
        electronic UniRule/UniPathway over-propagation onto OGDH E2.
    unresolved:
      - >-
        No AM1-specific evidence was found for a SucB-containing
        2-oxoadipate dehydrogenase complex or saccharopine lysine-catabolism
        role.
