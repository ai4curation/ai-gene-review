findings:
  - id: AM1-01
    priority: P1
    genes: [mxaI]
    locations:
      - {path: genes/METEA/mxaI/mxaI-ai-review.yaml, line: 59}
      - {path: genes/METEA/mxaI/mxaI-ai-review.yaml, line: 175}
    title: Methanol-to-methyl-CoM term accepted for aerobic methanol dehydrogenase
    problem: >-
      GO:0015946 is accepted and included in core_functions on the basis of
      methanol-to-formaldehyde chemistry. Its actual definition describes
      conversion to methyl-Coenzyme M. The label alone masks a different
      pathway. The xoxG and mxaD records already recognize this distinction.
    recommendation: >-
      Review as MODIFY to GO:0046170 (methanol catabolic process), retaining
      the structural-subunit rationale, and replace the incorrect core BP.
    sources:
      - https://amigo.geneontology.org/amigo/term/GO:0015946
  - id: AM1-02
    priority: P1
    genes: [mxaJ, mxaK]
    locations:
      - {path: genes/METEA/mxaJ/mxaJ-ai-review.yaml, line: 102}
      - {path: genes/METEA/mxaK/mxaK-ai-review.yaml, line: 48}
    title: Cofactor maturation is encoded as demonstrated protein-folding activity
    problem: >-
      Both records create GO:0044183 annotations and use that MF in their cores.
      MxaJ's own rationale explicitly states that it acts on already-folded
      MxaF, not by folding it. The 2025 AM1 assembly study supports PQQ loading
      by MxaJ and Ca incorporation requiring MxaK, not MxaK-mediated folding.
      A closest available term with a contradictory definition is not valid.
    recommendation: >-
      Withdraw the unsupported NEW folding assertions. Preserve supported
      maturation biology and use a grounded proposed_molecular_function for
      the established MxaJ cofactor-assembly activity. Do not assign a precise
      MxaK MF until its mechanism is supported.
    sources:
      - https://amigo.geneontology.org/amigo/term/GO:0044183
      - https://www.nature.com/articles/s41467-025-61958-w
  - id: AM1-03
    priority: P2
    genes: [gcvT]
    locations:
      - {path: genes/METEA/gcvT/gcvT-ai-review.yaml, line: 84}
    title: Aminomethyl transfer is incorrectly treated as transamination
    problem: >-
      GO:0008483 is retained as non-core because the enzyme transfers an
      aminomethyl group. GcvT transfers a one-carbon unit to THF and releases
      ammonium; this is EC 2.1.2.10, not the EC 2.6.1 amino-group transfer
      represented by transaminase activity. Non-core status still asserts it.
    recommendation: >-
      Remove the unsupported transaminase annotation with a reaction-based
      rationale, while retaining GO:0004047 aminomethyltransferase activity.
    sources:
      - https://amigo.geneontology.org/amigo/term/GO:0008483
      - https://amigo.geneontology.org/amigo/term/GO:0004047
  - id: AM1-04
    priority: P2
    genes: [mllBC]
    locations:
      - {path: genes/METEA/mllBC/mllBC-ai-review.yaml, line: 9}
      - {path: genes/METEA/mllBC/mllBC-ai-review.yaml, line: 192}
    title: MllBC is confused with the adjacent MllDE fusion
    problem: >-
      The description and research-derived finding name AsbD/AsbE as the
      constituent homologs. Table 1 of the primary cluster paper identifies
      META1p4133/MllBC as AsbB-like NIS synthetase plus AsbC-like adenylation
      domain. AsbD/AsbE belongs to META1p4134/MllDE.
    recommendation: >-
      Correct the curated identity to the AsbB/AsbC fusion and cite Table 1
      directly. Flag the research report's mistaken claim in notes rather
      than editing the generated report.
    sources:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11317620/
      - publications/PMID_39078674.md
  - id: AM1-05
    priority: P2
    genes: [gcvP, gcvT]
    locations:
      - {path: genes/METEA/gcvP/gcvP-ai-review.yaml, line: 18}
      - {path: genes/METEA/gcvP/gcvP-ai-review.yaml, line: 230}
      - {path: genes/METEA/gcvT/gcvT-ai-review.yaml, line: 16}
    title: SerA is assigned the serine-to-glycine reaction
    problem: >-
      These summaries say that serA produces glycine from serine. SerA is
      phosphoglycerate dehydrogenase in the phosphoserine pathway; GlyA is
      serine hydroxymethyltransferase. The linked serA and glyA records
      themselves correctly identify those enzymes.
    recommendation: >-
      Replace the erroneous enzyme attribution and distinguish serine-to-glycine
      SHMT chemistry from the net glycine-to-serine assimilatory direction
      during methylotrophic growth.
    sources:
      - genes/METEA/serA/serA-uniprot.txt
      - genes/METEA/glyA/glyA-uniprot.txt
      - https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0013001
  - id: AM1-06
    priority: P2
    genes: [pckA]
    locations:
      - {path: genes/METEA/pckA/pckA-ai-review.yaml, line: 20}
      - {path: genes/METEA/pckA/pckA-ai-review.yaml, line: 197}
    title: PckA is called essential despite viable methanol-grown deletion strains
    problem: >-
      Both description and core claim essentiality for C1 growth. The AM1
      C3-C4 flux study reports methanol growth of two pck deletion backgrounds;
      Table 1 reports reduced yields, not abolition of growth. The annotation
      rationale already mentions that yield phenotype, contradicting the summary.
    recommendation: >-
      Describe the condition-dependent yield and flux contribution without
      claiming essentiality. Keep the supported PEPCK/gluconeogenic function.
    sources:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC4949768/
  - id: AM1-07
    priority: P2
    genes: [lanM]
    locations:
      - {path: genes/METEA/lanM/lanM-ai-review.yaml, line: 12}
      - {path: genes/METEA/lanM/lanM-ai-review.yaml, line: 261}
    title: Lanthanide binding is overextended to essential transport and delivery
    problem: >-
      The description calls LanM essential for lanthanide utilization and the
      core asserts delivery to XoxF1. The AM1 genetic study instead discusses
      a nonessential or redundant role, consistent with homolog knockout
      results. Strong binding/selectivity measurements do not establish an
      essential native shuttle or direct delivery to a particular enzyme.
    recommendation: >-
      Keep selective lanthanide binding as established. Qualify transport,
      homeostasis and XoxF delivery as hypotheses unless supported by direct
      AM1 evidence; do not transfer a homolog's phenotype as an AM1 assay.
    sources:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC7391723/
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC6850437/
  - id: AM1-08
    priority: P2
    genes: [mtdA]
    locations:
      - {path: genes/METEA/mtdA/mtdA-ai-review.yaml, line: 25}
      - {path: genes/METEA/mtdA/mtdA-ai-review.yaml, line: 121}
      - {path: genes/METEA/mtdA/mtdA-ai-review.yaml, line: 260}
    title: In-vitro substrate preference displaces the assimilatory MtdA role
    problem: >-
      The record describes only oxidation of both carrier-bound substrates
      and calls H4MPT oxidation the primary physiological reaction in the
      proposed-term definition. AM1 work also establishes methenyl-H4F
      reduction to methylene-H4F for assimilation and models regulation of
      that activity. Relative oxidation rates alone do not rank physiological
      flux or establish the assimilatory reaction direction.
    recommendation: >-
      Explicitly describe the reductive H4F assimilatory role alongside the
      H4MPT activity. Keep any new MF definition reaction-based, without a
      gene-specific and unsupported primary-physiology claim.
    sources:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC3650556/
  - id: AM1-09
    priority: P2
    genes: [glyA]
    locations:
      - {path: genes/METEA/glyA/glyA-ai-review.yaml, line: 7}
    title: The serine-cycle summary reverses GlyA's C1-assimilatory role
    problem: >-
      The description makes GlyA the source of THF-bound C1 units during
      serine-cycle operation and assigns it transfer from the H4MPT route
      into the THF pool. In the assimilatory cycle GlyA consumes
      methylene-THF and glycine to make serine. The upstream formate/H4F
      pathway supplies that C1 unit. Reversibility does not make these
      physiological roles interchangeable.
    recommendation: >-
      Center the methylotrophic summary on serine formation and distinguish
      reverse SHMT activity under other conditions. Reassess whether the
      glycine-biosynthesis core BP is supported for the stated growth context.
    sources:
      - https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0013001
  - id: AM1-10
    priority: P2
    genes: [mxaD]
    locations:
      - {path: genes/METEA/mxaD/mxaD-ai-review.yaml, line: 29}
      - {path: genes/METEA/mxaD/mxaD-ai-review.yaml, line: 122}
    title: Electron-transfer facilitation is exported as unqualified MF activity
    problem: >-
      The record creates GO:0009055 and uses molecular_function for the core,
      although both its rationale and core description explicitly say that
      MxaD facilitates the MDH-cytochrome interaction and should be modeled
      as a contribution. The cited study supports enhanced interaction,
      not autonomous electron-carrier activity of MxaD.
    recommendation: >-
      Reassess the unqualified NEW MF. If the contribution interpretation is
      supported, encode contributes_to_molecular_function consistently with
      the schema rather than leaving it solely in prose. Otherwise retain
      the supported accessory process without assigning electron-carrier MF.
    sources:
      - https://pubmed.ncbi.nlm.nih.gov/12686160/
      - https://amigo.geneontology.org/amigo/term/GO:0009055
  - id: AM1-11
    priority: P2
    genes: [mllJ]
    locations:
      - {path: genes/METEA/mllJ/mllJ-ai-review.yaml, line: 60}
      - {path: genes/METEA/mllJ/mllJ-ai-review.yaml, line: 115}
    title: An unknown function is represented by a positive NAS root annotation
    problem: >-
      GO:0003674 is introduced with NEW/NAS to make core_functions align with
      annotations, despite an explicit statement that the activity is unknown.
      GO root annotations communicate absence of functional data via ND;
      they are not positive evidence for a molecular activity.
    recommendation: >-
      Do not manufacture a core MF to satisfy cross-section alignment. Omit
      an unsupported core assignment, or use the appropriate ND convention
      if an explicit unknown-function annotation is wanted.
    sources:
      - https://geneontology.org/GO_REF/0000015.html
  - id: AM1-12
    priority: P2
    genes: [mluA]
    locations:
      - {path: genes/METEA/mluA/mluA-ai-review.yaml, line: 145}
      - {path: genes/METEA/mluA/mluA-ai-review.yaml, line: 167}
    title: Non-core signaling is simultaneously exported as a core function
    problem: >-
      GO:0038023 is deliberately KEEP_AS_NON_CORE with an ancillary-function
      rationale, but the second core_functions entry contains that same MF.
      Consumers of the two sections receive opposite curation decisions.
    recommendation: >-
      Choose one evidence-grounded core/non-core interpretation and make the
      action, reason and core_functions agree.
    sources:
      - genes/METEA/mluA/mluA-ai-review.yaml
  - id: AM1-13
    priority: P2
    genes: [eno]
    locations:
      - {path: genes/METEA/eno/eno-ai-review.yaml, line: 16}
      - {path: genes/METEA/eno/eno-ai-review.yaml, line: 95}
      - {path: genes/METEA/eno/eno-ai-review.yaml, line: 169}
    title: The biological summary reasserts localization rejected by the review
    problem: >-
      The description says fractions of AM1 enolase occur at the cell surface
      and are secreted. Both corresponding reviews instead identify those
      claims as unsupported transfer of moonlighting behavior from other
      organisms and mark them over-annotated.
    recommendation: >-
      Remove the affirmative AM1 localization claim from the description or
      explicitly restrict it to observations in homologs; keep the summary
      consistent with the chosen annotation decisions.
    sources:
      - genes/METEA/eno/eno-ai-review.yaml
  - id: AM1-14
    priority: P2
    genes: [mxbM]
    locations:
      - {path: genes/METEA/mxbM/mxbM-ai-review.yaml, line: 7}
    title: An inferred promoter-binding model becomes established mechanism
    problem: >-
      Description and core assert direct binding of phosphorylated MxbM to
      both promoters. The annotation-level caveat correctly says direct
      binding was not demonstrated. The cited AM1 regulatory study presents
      this as a model inferred from promoter reporters and mutant phenotypes.
    recommendation: >-
      Retain the supported regulatory role and family-based phosphorelay
      inference, but qualify the direct binding and phosphorylation-dependent
      promoter mechanism consistently throughout the record.
    sources:
      - https://journals.asm.org/doi/full/10.1128/jb.05367-11
  - id: AM1-15
    priority: P3
    genes: [mluI]
    locations:
      - {path: genes/METEA/mluI/mluI-ai-review.yaml, line: 18}
    title: A primary locus-to-gene mapping is incorrectly reported unavailable
    problem: >-
      The description and core treat the mluI/META1p4131 identity as dependent
      on a secondary review. The primary methylolanthanin paper explicitly
      maps mluI to META1p4131 in Table 1. This does not prove its detailed
      regulon, but the identity need not remain tentative.
    recommendation: >-
      Cite the primary table for gene identity and keep only the appropriate
      caveat about inferred sigma-factor targets and mechanism.
    sources:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11317620/
      - genes/METEA/mluI/mluI-uniprot.txt
  - id: AM1-16
    priority: P2
    genes: [xoxF1]
    locations:
      - {path: genes/METEA/xoxF1/xoxF1-ai-review.yaml, line: 148}
    title: Electron-acceptor-specific IDA annotation cites a nonspecific MDH assay
    problem: >-
      The NEW cytochrome-c(L)-coupled MF is labeled IDA to PMID:23209751.
      That paper establishes lanthanide-dependent MDH activity, but does not
      report the XoxG-coupled assay needed for the electron-acceptor-specific
      assertion. The later XoxG/XoxJ biochemical paper is the relevant source.
    recommendation: >-
      Keep the supported biological function, but anchor its specificity and
      evidence code to the direct coupled assay in PMID:31017712. This is an
      evidence-attribution correction, not a claim that XoxF1 lacks the activity.
    sources:
      - https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0050480
      - https://pubmed.ncbi.nlm.nih.gov/31017712/
open_questions:
  - genes: [mxaC]
    question: >-
      Does evidence establish calcium movement by MxaC itself, or only the
      requirement for Ca loading of MxaF? Its NEW GO:0006816 should not follow
      automatically from an inactive-MDH mutant. Transport need not cross a
      membrane, so lack of transmembrane transport alone is not a disproof.
    sources:
      - https://www.nature.com/articles/s41467-025-61958-w
  - genes: [gcvH]
    question: >-
      What supports the accepted protein-lipoylation process beyond GcvH
      being lipoylated at its acceptor lysine? Distinguish modification
      substrate from a demonstrated lipoyl donor/participant in AM1 before
      deciding whether to retain or change this BP.
  - genes: [mllA, mllBC, mllF, mllH, mluA]
    question: >-
      Reconcile the iron-exclusion reasoning across the cluster. Some records
      keep iron-specific siderophore BP as an analogy, while others rule out
      iron transport or call the product categorically not a siderophore.
      The primary paper reports iron-responsive transcription and discusses
      possible dual Fe/Ln biology as a hypothesis. Neither an analogy nor
      Ln binding alone settles Fe involvement; avoid both unsupported
      positive retention and categorical exclusion.
    sources:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC11317620/
      - https://amigo.geneontology.org/amigo/term/GO:0019290
  - genes: [mdh, eno]
    question: >-
      Should the core summaries explicitly capture their direct serine-cycle
      roles under C1 growth instead of emphasizing only TCA/glycolysis?
      Check the physiological direction and source-specific pathway evidence.
    sources:
      - https://journals.plos.org/plosone/article?id=10.1371/journal.pone.0013001
  - genes: [xoxG]
    question: >-
      The two NEW process annotations include both methanol catabolic process
      and its broader methanol metabolic process. Reconcile this with the
      repository rule against adding ancestor/descendant redundancy.
companion_document_findings:
  - path: projects/METEA_MLL_CLUSTER.md
    line: 58
    priority: P2
    problem: >-
      Historical tables still map mllBC to C5B1I3 (actually mluI) and mllDE to
      C5B1I2 (actually mluR), with additional obsolete IDs and COMPLETE flags.
      They also call mllG an aldolase although its current review explicitly
      declines that assignment. A warning near the top acknowledges staleness,
      but readers copying the table still obtain incorrect gene mappings.
    recommendation: >-
      Regenerate the tables from current YAML or clearly separate/remove
      obsolete identity and completion claims. Correct mllBC to C5B1I5,
      mllDE to C5B1I6, mllF to C5B1I7, mllG to C5B1I8, mllH to C5B1I9,
      mllJ to C5B1J0, mluI to C5B1I3 and mluR to C5B1I2.
