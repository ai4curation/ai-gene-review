  discovery: >-
    Gene-review searches included hidden and gitignored files. All 51 METEA
    records declare NCBITaxon:272630. The additional organism-name matches in
    PSEPK/pqqB and PSEPK/pqqF are comparative mentions; those records declare
    NCBITaxon:160488 and are not AM1 records. The ten-gene METEA_MLL_CLUSTER
    project is a subset, not the full AM1 collection.
  method: >-
    Read descriptions, annotation decisions, core-function assignments and
    proposal content across the collection. Primary-literature and current GO
    definition checks targeted questionable claims. This is an audit of the
    existing reviews, not a new exhaustive literature review for every gene.
    Absence of a finding below is not an independent certification of every
    supporting quotation or every experimental claim.
