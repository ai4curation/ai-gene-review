ledger:
  mllDE:
    accession: C5B1I6
    locus: MexAM1_META1p4134
    status: corrected
    reviewed_and_supported:
      - >-
        The AM1 accession and locus identify mllDE as the
        PS50075/PF00550 carrier-domain protein with an ACP-like
        phosphopantetheine-binding region plus DUF6005.
      - >-
        PMID:39078674 maps META1p4134 to an AsbD-like aryl carrier protein /
        AsbE-like ligase fusion in the methylolanthanin mll cluster.
    corrections:
      - >-
        Replaced generated support for the phosphopantetheine-binding NEW row
        and core function with UniProt PP-binding evidence and exact primary
        paper support, while explicitly leaving the AsbE-like/DUF6005 candidate
        ligase half without a separate MF until MllDE's reaction is tested.
      - >-
        Replaced generated support for the GO:0044550 NEW process row with
        primary mll-cluster homology and whole-cluster product-abundance
        evidence.
      - >-
        Removed categorical "rather than an iron siderophore" language and
        preserved the primary paper's unresolved Fe/Ln dual-chelation hypothesis.
    unresolved:
      - >-
        No purified MllDE reaction, substrate specificity, ligase mechanism,
        localization assay or single-gene knockout phenotype was found.
  mllF:
    accession: C5B1I7
    locus: MexAM1_META1p4135
    status: corrected
    reviewed_and_supported:
      - >-
        The AM1 accession and locus identify a PF01261/Gene3D
        divalent-metal-dependent TIM-barrel enzyme in the methylolanthanin
        cluster.
      - >-
        PMID:39078674 names the protein AsbF-like but also reports that no
        antiSMASH asbF model was used because the mllF/PF01261 bitscore was low.
    corrections:
      - >-
        Recast the reviewer-proposed catalytic and secondary-metabolite
        biosynthesis rows as NAS rather than IEA.
      - >-
        Replaced generated evidence for the broad catalytic assertion with
        UniProt TIM-barrel evidence and primary paper support for a divergent
        AsbF-like assignment; kept the term at catalytic activity because the
        4-HB-containing methylolanthanin product blocks direct transfer of the
        characterized AsbF 3,4-DHB hydro-lyase reaction.
      - >-
        Replaced GO:0044550 support from expression induction with primary
        whole-cluster product-abundance evidence.
      - >-
        Removed categorical "NOT an iron siderophore" wording while continuing
        to avoid the Fe(III)-specific GO:0019290 process term, and added the
        primary 4-HB/3,4-DHB structural contrast and mll promoter iron-response
        evidence.
    unresolved:
      - >-
        The exact MllF reaction, metal cofactor, substrate and relationship to
        the 4-hydroxybenzoate moieties in methylolanthanin remain untested.
  mllG:
    accession: C5B1I8
    locus: MexAM1_META1p4136
    status: corrected
    reviewed_and_supported:
      - >-
        PMID:39078674 maps META1p4136 to mllG, a DUF2218 protein conserved in
        rhodopetrobactin-like loci and inferred from comparative context to act
        in regulation or transport rather than core biosynthetic chemistry.
      - >-
        The review still correctly leaves existing_annotations and
        core_functions empty because neither a molecular function nor a specific
        localization has been experimentally established for DUF2218.
    corrections:
      - >-
        Reworded the primary-paper finding so the review no longer says that the
        rhodopetrobactin-like AM1 product is not iron-binding; the Fe-chelation
        possibility is now recorded as an unconfirmed primary-paper hypothesis.
    unresolved:
      - >-
        MllG's direct biochemical or biophysical function, pathway position and
        subcellular location remain unknown.
  mllH:
    accession: C5B1I9
    locus: MexAM1_META1p4137
    status: corrected
    reviewed_and_supported:
      - >-
        The AM1 accession and locus identify a GNAT-family acetyltransferase in
        the mll cluster; PMID:39078674 maps META1p4137 to putative
        acetyltransferase mllH.
      - >-
        The inferred N-acetyltransferase function is consistent with the GNAT
        UniProt record and the acetylated central amine of methylolanthanin's
        homospermidine residues.
    corrections:
      - >-
        Replaced generated support for GO:0008080 and GO:0044550 with primary
        methylolanthanin structure, mllH mapping and whole-cluster abundance
        evidence.
      - >-
        Recast the reviewer-proposed GO:0044550 row as NAS rather than an
        InterPro IGC/GO_REF:0000002 assertion.
      - >-
        Removed categorical iron-siderophore language while preserving the
        unresolved Fe-chelation caveat.
    unresolved:
      - >-
        The true acetyl acceptor, donor specificity, order of the tailoring step
        and the requirement for mllH specifically remain untested.
  mluR:
    accession: C5B1I2
    locus: MexAM1_META1p4130
    status: corrected
    reviewed_and_supported:
      - >-
        The AM1 accession and locus identify a FecR-family inner-membrane
        signal transducer with a PF04773 FecR hit.
      - >-
        PMID:39078674 maps META1p4130 to the anti-sigma factor in the mluARI
        region upstream of the mll biosynthetic genes.
    corrections:
      - >-
        Replaced the claim that no primary paper mapped this locus with exact
        primary support for the anti-sigma-factor assignment.
      - >-
        Added UniProt FecR and PMID:39078674 support to the accepted sigma
        factor antagonist row and the core function.
    unresolved:
      - >-
        The cognate MluR-MluI interaction, target promoters and
        lanthanide-specific signaling mechanism remain inferred rather than
        directly demonstrated.
