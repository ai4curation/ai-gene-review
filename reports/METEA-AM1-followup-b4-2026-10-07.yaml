ledger:
  mxaB:
    accession: C5AQ96
    locus: MexAM1_META1p4525
    status: corrected
    reviewed_and_supported:
      - >-
        PMID:9495022 identifies AM1 mxaB as a response-regulator-family gene
        required for regulation of methanol oxidation and did not find an
        adjacent sensor kinase.
      - >-
        PMID:26833413 summarizes MxaB with MxcQE and MxbDM as the regulators
        required for mxa operon expression while explicitly leaving directness
        and sensed inputs unresolved.
    corrections:
      - >-
        Removed unsupported MxaY/noncanonical-pair and direct lanthanide-switch
        mechanism claims from the description, annotation support and core
        function.
      - >-
        Replaced generated evidence with UniProt receiver/HTH domains plus
        primary AM1 literature for response-regulator and transcriptional
        regulation assertions.
    unresolved:
      - >-
        MxaB's cognate phosphodonor, phosphorylation state, direct DNA-binding
        targets and relationship to the lanthanide switch remain unresolved in
        the reviewed AM1 primary evidence.
  mxaF:
    accession: P16027
    locus: MexAM1_META1p4538
    status: corrected
    reviewed_and_supported:
      - >-
        MxaF is the Ca/PQQ-dependent catalytic large subunit of MxaFI methanol
        dehydrogenase, acting in the periplasm and transferring electrons to
        the MxaG cytochrome cL acceptor.
      - >-
        PMID:2504152 establishes the alpha2-beta2 M. extorquens AM1 methanol
        dehydrogenase composition, and PMID:26833413 confirms mxaF is required
        for Ca-dependent methanol growth.
    corrections:
      - >-
        Replaced generated support for activity, Ca/PQQ binding, periplasmic
        localization and methanol-metabolism rows with UniProt and primary AM1
        evidence.
      - >-
        Softened unsupported kinetic-control language to describe MxaF as
        catalyzing the initial methanol-oxidation step.
    unresolved:
      - >-
        No remaining unsupported term choice was found in the reviewed rows;
        kinetic details of metal selectivity remain a biochemical follow-up,
        not a GO correction.
  mxaG:
    accession: P14774
    locus: MexAM1_META1p4536
    status: corrected
    reviewed_and_supported:
      - >-
        PMID:2851998 identifies AM1 mxaG as cytochrome cL, and PMID:12730156
        places the specific cytochrome c electron acceptor in the mxa
        methanol-oxidation cluster.
      - >-
        UniProt supports the exported periplasmic c-type cytochrome model with
        one covalent heme c group per subunit.
    corrections:
      - >-
        Removed unsupported redox-potential comparisons, direct respiratory
        handoff details and lanthanide-switch promoter specificity from the
        description and core function.
      - >-
        Anchored heme, iron, electron-transfer, methanol-process and periplasm
        rows to UniProt and AM1 primary evidence instead of generated reports.
      - >-
        After PR review, demoted the generic iron ion binding row to
        KEEP_AS_NON_CORE because the accepted heme binding term carries the
        specific cofactor context.
    unresolved:
      - >-
        The downstream AM1 electron acceptor from reduced MxaG is outside this
        record and was not asserted.
  mxbD:
    accession: C5B133
    locus: MexAM1_META1p1753
    status: corrected
    reviewed_and_supported:
      - >-
        PMID:9168623 reports that mxbDM is required for an mxaF
        transcriptional reporter and that the nucleotide sequence predicts a
        histidine protein kinase with two transmembrane domains.
      - >-
        UniProt supports a HAMP and histidine-kinase architecture consistent
        with the IEA sensor-kinase molecular-function calls.
    corrections:
      - >-
        Replaced generated support with UniProt domains plus the 1997 primary
        mxbDM paper and collapsed the redundant second core function into a
        single phosphorelay sensor-kinase core.
      - >-
        Changed generic signal-transduction, kinase and transferase parents to
        KEEP_AS_NON_CORE and removed unsupported direct xox1/mxa lanthanide
        switch language.
    unresolved:
      - >-
        Direct AM1 MxbD autophosphorylation, MxbD-to-MxbM phosphotransfer,
        sensed input and any apo-XoxF interaction remain unresolved.
  mxcE:
    accession: C5ASP3
    locus: MexAM1_META1p4897
    status: corrected
    reviewed_and_supported:
      - >-
        MxcE has receiver and LuxR-type HTH domains, and PMID:9168623 places
        MxcQE upstream of MxbDM because mxbD promoter activity was reduced to
        non-detectable levels in MxcQ and MxcE mutants.
    corrections:
      - >-
        Removed unsupported NEW GO:0001216 DNA-binding transcription activator
        activity and GO:0005737 cytoplasm rows.
      - >-
        Rewrote the description and core function to distinguish inferred
        response-regulator/DNA-binding activity from unshown direct promoter
        binding.
    unresolved:
      - >-
        Direct MxcQ-to-MxcE phosphotransfer and direct binding of AM1 MxcE to
        mxbDM, mxa or xox promoters remain unresolved.
  mxcQ:
    accession: C5ASP2
    locus: MexAM1_META1p4896
    status: corrected
    reviewed_and_supported:
      - >-
        UniProt identifies HAMP, HisKA_3, HATPase and two predicted
        transmembrane spans, supporting a membrane sensor-histidine-kinase
        topology.
      - >-
        PMID:9168623 places MxcQE genetically upstream of mxbDM expression in
        the methanol-oxidation regulatory hierarchy.
    corrections:
      - >-
        Replaced generated support for the sensor-kinase core with UniProt and
        AM1 primary evidence and stopped presenting autophosphorylation or
        phosphotransfer to MxcE as demonstrated.
      - >-
        Changed the NreB-derived cytoplasm, iron-sulfur cluster binding and
        4Fe-4S binding IEAs to REMOVE.
      - >-
        Demoted generic kinase, transferase and dimerization terms to
        KEEP_AS_NON_CORE where the sensor-kinase term is more informative.
    unresolved:
      - >-
        The native sensed input, direct MxcQ-MxcE phosphotransfer and any
        apo-XoxF interaction remain unresolved.
  pqqA:
    accession: Q49148
    locus: MexAM1_META1p1745
    status: reviewed_no_change
    reviewed_and_supported:
      - >-
        The existing review already treats PqqA as the ribosomal precursor
        peptide whose conserved Glu/Tyr residues contribute to the PQQ core,
        not as an enzyme.
      - >-
        The review already preserves the biological uncertainty that AM1 pqqA
        mutants still produce PQQ, implying a redundant source of precursor.
    corrections: []
    unresolved:
      - >-
        The alternative precursor that permits PQQ production without canonical
        PqqA remains unknown.
  pqqE:
    accession: P71517
    locus: MexAM1_META1p1748
    status: corrected
    reviewed_and_supported:
      - >-
        PMID:26961875 directly demonstrates that MePqqE, in conjunction with
        PqqD, catalyzes radical SAM Glu-Tyr carbon-carbon cross-linking on
        PqqA as the first step in PQQ biosynthesis.
      - >-
        PMID:25817994 establishes that AM1 PqqD binds PqqA and forms a ternary
        PqqA-D-E complex with PqqE.
    corrections:
      - >-
        Added PMID:26961875 as primary support for the GO:0009975 cyclase
        activity row, GO:0018189 PQQ biosynthetic process row and PqqA peptide
        cyclase core function.
      - >-
        Added an exportable proposed_new_terms entry for specific PqqA peptide
        cyclase activity, the ontology gap now tracked in #4421.
    unresolved:
      - >-
        GO still lacks a molecular-function term specific to the EC 1.21.98.4
        PqqA peptide cyclase reaction, so the review must use generic
        GO:0009975 cyclase activity until #4421 is resolved.
