        Kept the first enzyme-catalyzed wording in core_functions and replaced
        the UniProt reaction support with an exact line-local snippet.
    - gene: mch
      finding: GO:0046294 remained generated-report-only
      resolution: Added UniProt and PMID:10215859 support to the process row.
ledger:
  fae:
    accession: Q9FA38
    status: corrected
    reviewed_and_supported:
      - >-
        Fae is the soluble formaldehyde-activating enzyme that condenses
        formaldehyde with H4MPT in the cytoplasm.
      - >-
        The fae disruption mutant is methanol-negative and more sensitive to
        methanol or formaldehyde on succinate medium.
      - >-
        The apo and methylene-H4MPT-bound crystal structures support the
        homopentameric assembly and H4MPT-binding description.
    corrections:
      - >-
        Replaced generated-report support with direct support from PMIDs
        11073907 and 15632161.
      - >-
        Changed "first and critical step" to "first enzyme-catalyzed step" to
        preserve the primary paper's spontaneous H4MPT condensation result.
      - >-
        Corrected the 1.9 A-only structure sentence to distinguish the 2.0 A
        apo structure from the 1.9 A methylene-H4MPT-bound structure.
      - >-
        Replaced a stale generated-report rationale on the carbon-nitrogen lyase
        removal with direct UniProt/Rhea and PMID:11073907 support.
      - >-
        Propagated first-enzyme-catalyzed wording to the core function and
        replaced a stitched UniProt quote with exact flat-file text.
    unresolved:
      - >-
        GO still lacks an exact EC 4.2.1.147 molecular-function term, so the
        review retains hydro-lyase activity as the nearest supported parent.
  mch:
    accession: O85014
    status: corrected
    reviewed_and_supported:
      - >-
        Mch is the H4MPT-specific methenyl-H4MPT cyclohydrolase in the
        formaldehyde oxidation route, distinct from the H4F cyclohydrolase.
      - >-
        The purified enzyme is homodimeric with 33 kDa subunits and is
        sequence-similar to archaeal methenyl-H4MPT cyclohydrolases.
    corrections:
      - >-
        Added PMID:10215859 primary support to the exact GO:0018759 activity
        and the core function.
      - >-
        Expanded the top-level PMID:10215859 finding with exact homodimer and
        archaeal-similarity snippets.
      - >-
        Replaced generated-report-only formaldehyde-catabolism support with
        UniProt and PMID:10215859 support.
    unresolved:
      - No AM1-native structural data were found beyond N-terminal identification.
  mtdB:
    accession: O85012
    status: corrected
    reviewed_and_supported:
      - >-
        MtdB oxidizes methylene-H4MPT to methenyl-H4MPT using NAD+ or NADP+,
        but does not act on methylene-H4F.
      - mtdB mutants are methanol-negative and formaldehyde-sensitive.
    corrections:
      - Added PMID:10848995 primary support to the core C1 oxidation claims.
    unresolved:
      - No further AM1-native MtdB/MtdA flux apportionment was resolved here.
  hprA:
    accession: Q59516
    status: corrected
    reviewed_and_supported:
      - >-
        HprA is the serine-cycle hydroxypyruvate reductase; the AM1 insertion
        mutant loses C1 growth while retaining C2 growth.
      - >-
        Purified AM1 HprA reduces hydroxypyruvate and glyoxylate in vitro with
        NADH or NADPH, but glycolate oxidation was not detected.
    corrections:
      - >-
        Removed unsupported high-control/commitment-point framing for HprA.
      - >-
        Clarified that a separate low-activity enzyme, not HprA, accounts for
        the glyoxylate/glycolate interconversion seen in hprA mutant extracts.
      - >-
        Replaced title-only support snippets with exact abstract evidence from
        PMIDs 8144463, 1657886 and 1729225.
      - >-
        Removed a stale generated-report high-control-point finding and kept
        the glycolate-oxidation negative result in its negated context.
      - >-
        Changed the cofactor-specific molecular-function action to MODIFY
        toward GO:0016618 and used GO:0016618 as the core function.
    unresolved:
      - >-
        The identity and physiological role of the separate low-activity
        glyoxylate/glycolate enzyme remain unknown.
  gck:
    accession: C5AUT6
    status: corrected
    reviewed_and_supported:
      - >-
        Gck is the AM1 serine-cycle glycerate kinase whose measured activity
        forms glycerate 2-phosphate.
      - >-
        A NEW formaldehyde-assimilation annotation passes the participation
        check because Gck catalyzes a step of the serine cycle itself.
    corrections:
      - >-
        Removed the unsupported oxalate-mutant rationale and anchored the
        serine-cycle role to PMIDs 12730156 and 20957036.
      - Corrected a stale generated-report citation title.
      - >-
        Changed the NEW formaldehyde-assimilation row's original_reference_id
        from the generated research report to PMID:12730156.
      - >-
        Marked residual oxalate-growth generated findings as unverified and
        strengthened the primary activity quote from PMID:20957036.
    unresolved:
      - >-
        Direct purified-enzyme regiospecificity and regulation for C5AUT6
        remain proposed experiments rather than asserted AM1 results.
  serA:
    accession: C5APD6
    status: reviewed_supported
    reviewed_and_supported:
      - >-
        SerA remains phosphoglycerate dehydrogenase in the phosphoserine
        L-serine biosynthesis branch, not a serine-cycle enzyme.
      - >-
        The current review already preserves the lack of AM1-specific kinetics,
        cofactor preference and allostery.
    corrections: []
    unresolved:
      - >-
        AM1-native SerA enzymology remains unreported in the cached literature.
  ecm:
    accession: Q49115
    status: corrected
    reviewed_and_supported:
      - >-
        Ecm is the adenosylcobalamin-dependent ethylmalonyl-CoA mutase that
        interconverts (2R)-ethylmalonyl-CoA and (2S)-methylsuccinyl-CoA.
      - >-
        The GO:0019681 acetyl-CoA assimilation NEW row passes the participation
        check because Ecm catalyzes an ethylmalonyl-CoA pathway step rather
        than merely supplying a pathway substrate.
    corrections:
      - >-
        Moved the core molecular function from broad GO:0016866 to the
        proposed exact ethylmalonyl-CoA mutase activity.
      - >-
        Added primary support to the incorrect methylmalonyl-CoA-mutase rows,
        cobalamin and metal binding, the acetyl-CoA assimilation proposal, the
        core function, and the proposed new term.
      - >-
        Repointed the broad catalytic-activity row to the proposed exact NTR
        and changed the incorrect methylmalonyl-CoA mutase row to REMOVE.
    unresolved:
      - >-
        GO has no exact ethylmalonyl-CoA mutase term; the proposed term remains
        an ontology request.
  mdcD:
    accession: C5APL4
    status: reviewed_supported
    reviewed_and_supported:
      - >-
        The MdcD family call and local mdcA/C/D/E neighborhood support an
        inferred malonate-decarboxylase beta-subunit identity for AM1.
      - >-
        The broad carboxy-lyase activity and ISS malonate catabolic process
        reflect characterized Pseudomonas MdcD-MdcE catalysis without claiming
        an AM1-native assay.
      - >-
        An ignored-inclusive local search of genes/METEA/mdcD, cache, interpro
        and src found GO:0016831 and GO:0090410, but no exact MdcD-MdcE
        malonyl-ACP decarboxylase molecular-function term.
    corrections: []
    unresolved:
      - AM1 MdcD-MdcE reconstitution remains untested.
