adversarial_review:
  result: no_blocking_findings
  addressed_findings:
    - gene: hprA
      finding: stale generated high-control-point finding
      resolution: Removed from reference_review support.
    - gene: hprA
      finding: misleading glycolate-to-glyoxylate support snippet
      resolution: >-
        Replaced the clipped negated phrase with separate snippets for HprA's
        glyoxylate-reducing activity and the explicit failure to detect
        glycolate oxidation.
    - gene: fae
      finding: stale generated-report support in the carbon-nitrogen lyase removal
      resolution: >-
        Replaced the rationale and support with the UniProt/Rhea reaction and
        primary AM1 H4MPT condensation evidence.
    - gene: mch
      finding: underspecified PMID:10215859 reference finding
      resolution: >-
        Added separate exact abstract snippets for the homodimeric subunit
        evidence and archaeal methenyl-H4MPT cyclohydrolase similarity.
    - gene: gck
      finding: generated-report original_reference_id on a NEW row
      resolution: Changed the formaldehyde-assimilation row to PMID:12730156.
