items:
  - number: 1
    disposition: ADDRESSED
    detail: >-
      Restore MxaK and MxaD core biological roles without an invented MF.
      CoreFunction.molecular_function is optional, and the validator checks
      it only when present. MxaK retains an explicitly unresolved molecular
      mechanism; MxaD retains an accessory role, not electron-carrier activity.
  - number: 2
    disposition: ADDRESSED
    detail: >-
      Add PMID:40683858 directly to MxaC, MxaK and MxaI. Distinguish the
      reconstructed AM1 system in E. coli from native-cell experiments and
      accessory requirements from direct metal-binding assays.
  - number: 3
    disposition: ADDRESSED_WITH_CLARIFICATION
    detail: >-
      The +172 mV and La-to-Nd Km findings were already retained under
      PMID:31017712 in the reviewed commit, despite removal of duplicate
      generated-report findings. Preserve them and match their snippets to
      the refreshed cache. Restore the genetic-requirement finding with
      PMID:32728125 without restoring the redundant methanol-metabolism parent.
  - number: 4
    disposition: ADDRESSED
    detail: >-
      The live PMC Results section directly reports heterologous periplasmic
      purification. Refresh the cache using the official fetcher and restore
      GO:0042597 with that assay context. Replace MISCITED with UNVERIFIED for
      the generated report's coordinate mapping. Confirm the consistent
      13-residue offset but do not infer its cause or silently transfer
      paper-frame residue numbers to UniProt C5B121.
  - number: 5
    disposition: UNCERTAINTY_RETAINED_WITH_PRIMARY_EVIDENCE
    detail: >-
      The enum defines UNDECIDED for an unclear annotation; inaccessible
      literature is a mandatory use case, not its exclusive definition.
      PMID:39078674 explicitly hypothesizes chelation of Ln in addition to Fe
      and says further study is required. Add that primary evidence to the
      five iron-specific decisions, retaining uncertainty rather than
      asserting either iron function or its absence. A generic transporter
      MF establishes no particular transported metal, so it does not settle
      the iron-specific BP assertions. GcvH is a separate substrate-versus-
      participant question: the cited evidence establishes a lipoylated
      carrier, not an AM1 lipoyl-donor/relay function. Its UNDECIDED decision
      and exclusion of protein lipoylation from core_functions are unchanged.
    anchors:
      - src/ai_gene_review/schema/gene_review.yaml:2709
      - publications/PMID_39078674.md:215
      - genes/METEA/gcvH/gcvH-ai-review.yaml:66
  - number: 6
    disposition: ADDRESSED
    detail: Remove GO:0015945 from the MxaI core and retain its catabolic child GO:0046170.
  - number: 7
    disposition: ADDRESSED
    detail: Use LOW_QUALITY for the generated MllBC report's factual fusion-identity error.
  - number: 8
    disposition: ADDRESSED
    detail: >-
      Clarify MluA signaling as an ancillary homology-based hypothesis in
      both description and annotation review; cite the primary paper's
      homologous-system statement instead of claiming a measured AM1 interaction.
  - number: 9
    disposition: ADDRESSED
    detail: >-
      Restore a cluster-level pathway diagram and siderophore comparison
      table, explicitly distinguishing established biosynthesis/binding
      from predicted receptor and regulatory links.
