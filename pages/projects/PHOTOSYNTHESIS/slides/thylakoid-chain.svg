<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="bold" fill="#15201e">Module layout: light reactions feed the CBB cycle</text>

  <!-- stroma / lumen labels -->
  <text x="24" y="120" font-size="14" fill="#56655f">STROMA</text>
  <text x="24" y="400" font-size="14" fill="#56655f">LUMEN</text>
  <!-- thylakoid membrane -->
  <rect x="20" y="250" width="920" height="70" fill="#e8f1ee"/>
  <line x1="20" y1="250" x2="940" y2="250" stroke="#8fa39c" stroke-width="2"/>
  <line x1="20" y1="320" x2="940" y2="320" stroke="#8fa39c" stroke-width="2"/>
  <text x="936" y="340" font-size="12" text-anchor="end" fill="#56655f">thylakoid membrane</text>

  <!-- PSII -->
  <rect x="70" y="220" width="140" height="130" rx="14" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="140" y="262" font-size="17" text-anchor="middle" font-weight="bold" fill="#0e6b66">PSII</text>
  <text x="140" y="282" font-size="12" text-anchor="middle" fill="#15201e">D1 / D2, CP43 / CP47</text>
  <text x="140" y="300" font-size="12" text-anchor="middle" fill="#15201e">PsbO (OEC)</text>
  <text x="140" y="390" font-size="13" text-anchor="middle" fill="#15201e">2 H2O → O2 + 4 H+</text>
  <line x1="140" y1="375" x2="140" y2="354" stroke="#56655f" stroke-width="2" marker-end="url(#g)"/>

  <!-- b6f -->
  <rect x="300" y="225" width="130" height="120" rx="14" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="365" y="266" font-size="17" text-anchor="middle" font-weight="bold" fill="#0e6b66">cyt b6f</text>
  <text x="365" y="286" font-size="12" text-anchor="middle" fill="#15201e">petA / petB / petC</text>
  <text x="365" y="304" font-size="12" text-anchor="middle" fill="#15201e">Q-cycle, H+ pump</text>

  <!-- PSI -->
  <rect x="520" y="220" width="140" height="130" rx="14" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="590" y="258" font-size="17" text-anchor="middle" font-weight="bold" fill="#0e6b66">PSI</text>
  <text x="590" y="278" font-size="12" text-anchor="middle" fill="#15201e">PsaA / PsaB</text>
  <rect x="548" y="200" width="84" height="30" rx="8" fill="#1d8a4b"/>
  <text x="590" y="220" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">psaC ✓</text>

  <!-- ATP synthase -->
  <rect x="760" y="225" width="110" height="120" rx="14" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="815" y="270" font-size="15" text-anchor="middle" font-weight="bold" fill="#0e6b66">ATP</text>
  <text x="815" y="288" font-size="15" text-anchor="middle" font-weight="bold" fill="#0e6b66">synthase</text>
  <text x="815" y="306" font-size="12" text-anchor="middle" fill="#15201e">atpA / atpB</text>

  <!-- electron path -->
  <path d="M210,270 L296,270" stroke="#0e6b66" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="253" y="262" font-size="12" text-anchor="middle" fill="#0e6b66">PQH2</text>
  <path d="M430,330 C470,380 480,380 516,330" stroke="#0e6b66" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="473" y="398" font-size="12" text-anchor="middle" fill="#0e6b66">plastocyanin / cyt c6</text>
  <path d="M630,200 C660,150 690,140 720,140" stroke="#0e6b66" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <text x="650" y="150" font-size="12" text-anchor="end" fill="#0e6b66">ferredoxin</text>
  <rect x="722" y="118" width="140" height="44" rx="10" fill="#dcefec" stroke="#0e6b66"/>
  <text x="792" y="138" font-size="13" text-anchor="middle" font-weight="bold" fill="#0e6b66">FNR (petH)</text>
  <text x="792" y="154" font-size="11" text-anchor="middle" fill="#15201e">NADP+ → NADPH</text>
  <path d="M815,222 L815,176" stroke="#56655f" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <text x="826" y="200" font-size="12" fill="#56655f">ATP</text>

  <!-- CBB cycle -->
  <circle cx="440" cy="115" r="62" fill="#fff4e8" stroke="#b8620f" stroke-width="2"/>
  <text x="440" y="100" font-size="15" text-anchor="middle" font-weight="bold" fill="#b8620f">CBB cycle</text>
  <text x="440" y="118" font-size="12" text-anchor="middle" fill="#15201e">Rubisco, PRK,</text>
  <text x="440" y="134" font-size="12" text-anchor="middle" fill="#15201e">GAPDH, RCA</text>
  <path d="M720,130 C620,110 560,110 506,112" stroke="#56655f" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#g)"/>
  <text x="600" y="100" font-size="12" fill="#56655f">NADPH + ATP</text>
  <rect x="290" y="56" width="92" height="28" rx="8" fill="#b8620f"/>
  <text x="336" y="75" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">CP12 ◐</text>
  <text x="260" y="130" font-size="13" text-anchor="end" fill="#15201e">CO2 →</text>

  <!-- CCM -->
  <rect x="70" y="60" width="150" height="54" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="145" y="82" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">CO2-concentrating</text>
  <text x="145" y="100" font-size="12" text-anchor="middle" fill="#56655f">mechanism (algae)</text>
  <rect x="100" y="150" width="90" height="28" rx="8" fill="#1d68b3"/>
  <text x="145" y="169" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">LCI5 ◐</text>

  <!-- legend -->
  <rect x="24" y="450" width="18" height="18" rx="4" fill="#1d8a4b"/><text x="50" y="464" font-size="13" fill="#15201e">reviewed, COMPLETE</text>
  <rect x="210" y="450" width="18" height="18" rx="4" fill="#b8620f"/><text x="236" y="464" font-size="13" fill="#15201e">reviewed, DRAFT</text>
  <rect x="370" y="450" width="18" height="18" rx="4" fill="#1d68b3"/><text x="396" y="464" font-size="13" fill="#15201e">no GOA rows; new terms proposed</text>
  <text x="24" y="496" font-size="13" fill="#56655f">All other named genes are candidates only (modules A–G checklist). Chlamydomonas genes shown; module is taxon-neutral.</text>
</svg>
