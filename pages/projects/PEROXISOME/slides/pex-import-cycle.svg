<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8620f"/></marker>
  </defs>

  <!-- peroxisome -->
  <ellipse cx="640" cy="280" rx="260" ry="200" fill="#e8f1ee" stroke="#0e6b66" stroke-width="4"/>
  <text x="640" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#0e6b66">peroxisome matrix</text>
  <text x="640" y="274" text-anchor="middle" font-size="13" fill="#56655f">imported enzymes: β-oxidation of very-long-chain</text>
  <text x="640" y="292" text-anchor="middle" font-size="13" fill="#56655f">fatty acids, ether lipid and bile acid synthesis</text>
  <text x="30" y="496" font-size="13" fill="#56655f">cytosol</text>

  <!-- receptors in cytosol -->
  <rect x="30" y="112" width="200" height="36" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="130" y="135" text-anchor="middle" font-size="14" fill="#15201e"><tspan font-weight="700">PEX5</tspan> + PTS1 cargo (-SKL)</text>
  <rect x="30" y="160" width="200" height="36" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="130" y="183" text-anchor="middle" font-size="14" fill="#15201e"><tspan font-weight="700">PEX7</tspan> + PTS2 cargo</text>
  <text x="130" y="98" text-anchor="middle" font-size="12" fill="#56655f">cargo receptors</text>

  <!-- docking -->
  <rect x="372" y="142" width="124" height="36" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="434" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">PEX13 · PEX14</text>
  <path d="M232 150 L368 158" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <text x="300" y="140" text-anchor="middle" font-size="12" fill="#0e6b66">① dock</text>
  <path d="M498 170 L560 206" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <text x="566" y="208" font-size="12" fill="#0e6b66">② cargo released</text>

  <!-- RING -->
  <rect x="300" y="262" width="150" height="36" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="375" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">PEX2 · PEX10 · PEX12</text>
  <text x="290" y="276" text-anchor="end" font-size="12" fill="#0e6b66">③ RING E3 ligases</text>
  <text x="290" y="292" text-anchor="end" font-size="12" fill="#0e6b66">mono-ubiquitinate PEX5</text>

  <!-- AAA exportomer -->
  <rect x="345" y="362" width="150" height="40" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="420" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">PEX1 · PEX6</text>
  <text x="420" y="396" text-anchor="middle" font-size="12" fill="#56655f">anchored by PEX26</text>
  <path d="M343 390 C 180 420, 90 330, 110 202" stroke="#0e6b66" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="160" y="430" font-size="12" fill="#0e6b66">④ AAA ATPases extract PEX5;</text>
  <text x="160" y="446" font-size="12" fill="#0e6b66">receptor recycles (ATP)</text>

  <!-- membrane protein insertion -->
  <rect x="580" y="62" width="120" height="36" rx="8" fill="#ffffff" stroke="#b8620f" stroke-width="1.6"/>
  <text x="640" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">PEX3 · PEX16</text>
  <rect x="330" y="14" width="190" height="34" rx="8" fill="#f6efe6" stroke="#b8620f"/>
  <text x="425" y="36" text-anchor="middle" font-size="14" fill="#15201e"><tspan font-weight="700">PEX19</tspan> + membrane protein</text>
  <path d="M522 36 L590 66" stroke="#b8620f" stroke-width="2" marker-end="url(#o)"/>
  <text x="712" y="54" font-size="12" fill="#b8620f">⑤ membrane-protein insertion (mPTS)</text>

  <!-- division -->
  <rect x="832" y="262" width="110" height="36" rx="8" fill="#ffffff" stroke="#7657a3" stroke-width="1.6"/>
  <text x="887" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">PEX11A/B/G</text>
  <text x="887" y="320" text-anchor="middle" font-size="12" fill="#7657a3" stroke="#ffffff" stroke-width="4" paint-order="stroke">⑥ elongation</text>
  <text x="887" y="336" text-anchor="middle" font-size="12" fill="#7657a3" stroke="#ffffff" stroke-width="4" paint-order="stroke">and division</text>

  <!-- phases -->
  <g font-size="12" fill="#15201e">
    <text x="945" y="508" text-anchor="end">Phase 1: PEX1, 5, 6, 7, 14, 26 · Phase 2: PEX2, 10, 12, 13 · Phase 3: PEX3, 16, 19, 11A/B/G</text>
  </g>
</svg>
