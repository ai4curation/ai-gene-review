  citation: NO_PRESYNAPTIC_CONTEXT
  biology: INDIRECT
  notes: >-
    Indirect evidence exists for a presynaptic beta1-containing receptor
    mechanism, but no direct demonstration sufficient for the presynaptic
    qualifier. In Gabrb1 L285R and P228H mutant mice, mIPSC frequency in
    nucleus accumbens medium spiny neurons is reduced, and the authors propose
    presynaptic spontaneously open beta1 receptors as one explanation; a global
    mutation and an mIPSC frequency change do not show where beta1 acts. (This
    paper was missed by the first screen and found by an external review.) The
    initial screen's "beta1" hits were beta1-adrenoceptors, and afferent and
    terminal GABA-A studies report beta2/beta3 or beta3. Conventional
    heteromeric GABA-A receptors contain beta subunits, but that does not say
    whether a given presynaptic receptor contains beta1, beta2 or beta3. None of
    this rescues PMID:26950270 as evidence for GO:0099507, and none of it
    justifies a NOT annotation. The presynaptic annotations human GABRB1
    carries are not independent support: GO:0099505 (GOC IEA, GO_REF:0000108)
    is computed from this GO:0099507 row, and GO:0048787 presynaptic active zone
    membrane (Ensembl IEA) is projected from rat Gabrb1, whose SynGO row comes
    from a GABA-B receptor paper (PMID:15174078; see
    data/gaba_receptor_swaps-verdicts.yaml).
  supported_by:
