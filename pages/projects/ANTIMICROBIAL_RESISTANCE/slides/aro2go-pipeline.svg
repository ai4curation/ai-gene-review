<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bd3a30"/></marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#15201e">UniProt → ARO → GO: how a CARD record becomes a GO candidate</text>
  <!-- UniProt -->
  <g transform="translate(30 80)">
    <rect width="200" height="150" rx="12" fill="#e8f1ee" stroke="#8fa39c" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#15201e">UniProtKB entry</text>
    <text x="100" y="56" text-anchor="middle" font-size="13" fill="#56655f">4,182 entries with a</text>
    <text x="100" y="74" text-anchor="middle" font-size="13" fill="#56655f">CARD cross-reference</text>
    <text x="100" y="106" text-anchor="middle" font-size="11" fill="#15201e" font-family="Menlo, monospace">DR CARD; ARO:3000318;</text>
    <text x="100" y="122" text-anchor="middle" font-size="11" fill="#15201e" font-family="Menlo, monospace">mphB; ...</text>
  </g>
  <g transform="translate(30 270)">
    <rect width="200" height="80" rx="12" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="5 4"/>
    <text x="100" y="30" text-anchor="middle" font-size="14" fill="#15201e">no DR CARD line?</text>
    <text x="100" y="52" text-anchor="middle" font-size="13" fill="#56655f">fall back to RGI output</text>
    <text x="100" y="68" text-anchor="middle" font-size="12" fill="#56655f">(e.g. MphA)</text>
  </g>
  <path d="M230 155 L300 155" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M230 310 L270 310 L270 175 L300 175" fill="none" stroke="#0e6b66" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <!-- ARO hierarchy -->
  <g transform="translate(305 70)">
    <rect width="300" height="300" rx="12" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
    <text x="150" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#0e6b66">ARO (CARD ontology)</text>
    <rect x="60" y="50" width="180" height="40" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
    <text x="150" y="68" text-anchor="middle" font-size="13" fill="#15201e">beta-lactamase</text>
    <text x="150" y="83" text-anchor="middle" font-size="11" fill="#56655f">ARO:3000001 · family node</text>
    <path d="M110 90 L70 140" stroke="#8fa39c" stroke-width="1.5"/>
    <path d="M150 90 L150 140" stroke="#8fa39c" stroke-width="1.5"/>
    <path d="M190 90 L230 140" stroke="#8fa39c" stroke-width="1.5"/>
    <rect x="25" y="140" width="80" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="65" y="160" text-anchor="middle" font-size="12" fill="#15201e">CTX-M</text>
    <rect x="110" y="140" width="80" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="150" y="160" text-anchor="middle" font-size="12" fill="#15201e">KPC</text>
    <rect x="195" y="140" width="80" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="235" y="160" text-anchor="middle" font-size="12" fill="#15201e">NDM ...</text>
    <text x="150" y="196" text-anchor="middle" font-size="13" fill="#0e6b66">5,317 descendant gene terms</text>
    <text x="150" y="226" text-anchor="middle" font-size="12" fill="#56655f">propagation is exact-or-narrower:</text>
    <text x="150" y="244" text-anchor="middle" font-size="12" fill="#56655f">a mapping on a family node reaches</text>
    <text x="150" y="262" text-anchor="middle" font-size="12" fill="#56655f">every is_a descendant</text>
  </g>
  <!-- SSSOM bridge -->
  <path d="M605 150 L680 150" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="642" y="138" text-anchor="middle" font-size="12" fill="#0e6b66">SSSOM</text>
  <g transform="translate(685 70)">
    <rect width="250" height="160" rx="12" fill="#e8f1ee" stroke="#8fa39c" stroke-width="1.5"/>
    <text x="125" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#15201e">GO molecular function</text>
    <text x="125" y="58" text-anchor="middle" font-size="13" fill="#15201e">GO:0008800</text>
    <text x="125" y="76" text-anchor="middle" font-size="13" fill="#56655f">beta-lactamase activity</text>
    <text x="125" y="108" text-anchor="middle" font-size="12" fill="#56655f">aro2go.sssom.yaml</text>
    <text x="125" y="126" text-anchor="middle" font-size="12" fill="#56655f">23 mappings + 9 recorded gaps</text>
    <text x="125" y="144" text-anchor="middle" font-size="12" fill="#56655f">CURIE + label checked</text>
  </g>
  <!-- filter -->
  <path d="M810 230 L810 275" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <g transform="translate(655 280)">
    <rect width="280" height="80" rx="12" fill="#ffffff" stroke="#b8620f" stroke-width="1.6"/>
    <text x="140" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#b8620f">subsumption filter</text>
    <text x="140" y="50" text-anchor="middle" font-size="12" fill="#15201e">drop a candidate if the entry already</text>
    <text x="140" y="66" text-anchor="middle" font-size="12" fill="#15201e">has a more specific child term</text>
  </g>
  <path d="M760 360 L700 420" stroke="#bd3a30" stroke-width="2" marker-end="url(#r)"/>
  <text x="610" y="440" text-anchor="middle" font-size="15" font-weight="600" fill="#bd3a30">104 suppressed</text>
  <text x="610" y="458" text-anchor="middle" font-size="12" fill="#56655f">mostly aminoglycoside AAC/ANT/APH</text>
  <path d="M860 360 L860 420" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="770" y="424" width="180" height="60" rx="10" fill="#0e6b66"/>
  <text x="860" y="450" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">630</text>
  <text x="860" y="472" text-anchor="middle" font-size="12" fill="#ffffff">candidate GO annotations</text>
  <text x="30" y="420" font-size="13" fill="#56655f">Check: the pipeline reproduces the hand-curated calls</text>
  <text x="30" y="440" font-size="13" fill="#56655f">MphB (DR CARD) → GO:0050073 + GO:0046677</text>
  <text x="30" y="460" font-size="13" fill="#56655f">MphA (RGI) → GO:0050073</text>
</svg>
