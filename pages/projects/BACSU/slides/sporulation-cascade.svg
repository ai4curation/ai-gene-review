<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8620f"/></marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#15201e">The sporulation sigma cascade: two compartments take turns</text>
  <!-- predivisional -->
  <g transform="translate(24 70)">
    <rect width="150" height="90" rx="40" fill="#e8f1ee" stroke="#8fa39c" stroke-width="1.5"/>
    <text x="75" y="38" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">Spo0A~P</text>
    <text x="75" y="58" text-anchor="middle" font-size="12" fill="#56655f">phosphorelay</text>
    <text x="75" y="74" text-anchor="middle" font-size="12" fill="#56655f">response regulator</text>
  </g>
  <text x="99" y="182" text-anchor="middle" font-size="12" fill="#56655f">pre-divisional cell</text>
  <path d="M176 115 L230 115" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="203" y="104" text-anchor="middle" font-size="11" fill="#0e6b66">asymmetric</text>
  <text x="203" y="136" text-anchor="middle" font-size="11" fill="#0e6b66">division</text>
  <!-- sporangium -->
  <rect x="236" y="60" width="700" height="400" rx="120" fill="#f4f7f6" stroke="#8fa39c" stroke-width="2"/>
  <line x1="700" y1="68" x2="700" y2="452" stroke="#15201e" stroke-width="3"/>
  <text x="470" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#56655f">MOTHER CELL</text>
  <text x="815" y="90" text-anchor="middle" font-size="16" font-weight="600" fill="#56655f">FORESPORE</text>
  <!-- SpoIIE on septum -->
  <rect x="660" y="112" width="80" height="34" rx="6" fill="#ffffff" stroke="#b8620f" stroke-width="1.8"/>
  <text x="700" y="134" text-anchor="middle" font-size="13" font-weight="600" fill="#b8620f">SpoIIE</text>
  <text x="652" y="134" text-anchor="end" font-size="10" fill="#56655f">PP2C phosphatase</text>
  <path d="M740 130 L775 150" stroke="#b8620f" stroke-width="2" marker-end="url(#o)"/>
  <text x="818" y="125" text-anchor="middle" font-size="11" fill="#56655f">SpoIIAA-P → SpoIIAA</text>
  <!-- sigF -->
  <circle cx="815" cy="182" r="30" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="815" y="188" text-anchor="middle" font-size="16" font-weight="600" fill="#0e6b66">σF</text>
  <text x="870" y="220" text-anchor="middle" font-size="11" fill="#56655f">early forespore</text>
  <!-- signal to SpoIIGA -->
  <path d="M785 190 L740 238" stroke="#0e6b66" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="780" y="236" font-size="11" fill="#0e6b66">signal</text>
  <rect x="660" y="240" width="80" height="34" rx="6" fill="#ffffff" stroke="#b8620f" stroke-width="1.8"/>
  <text x="700" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="#b8620f">SpoIIGA</text>
  <text x="652" y="292" text-anchor="end" font-size="10" fill="#56655f">membrane aspartic protease</text>
  <!-- pro-sigE -> sigE -->
  <rect x="520" y="248" width="80" height="26" rx="13" fill="#ffffff" stroke="#8fa39c"/>
  <text x="560" y="266" text-anchor="middle" font-size="12" fill="#15201e">pro-σE</text>
  <path d="M660 258 L602 258" stroke="#b8620f" stroke-width="2" marker-end="url(#o)"/>
  <path d="M520 262 L462 262" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <text x="490" y="252" text-anchor="middle" font-size="10" fill="#56655f">cleaved</text>
  <circle cx="430" cy="262" r="30" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="430" y="268" text-anchor="middle" font-size="16" font-weight="600" fill="#0e6b66">σE</text>
  <text x="430" y="310" text-anchor="middle" font-size="11" fill="#56655f">early mother cell</text>
  <!-- sigE enables sigG -->
  <path d="M460 280 Q 640 330 785 345" fill="none" stroke="#0e6b66" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <circle cx="815" cy="350" r="30" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="815" y="356" text-anchor="middle" font-size="16" font-weight="600" fill="#0e6b66">σG</text>
  <text x="815" y="398" text-anchor="middle" font-size="11" fill="#56655f">late forespore</text>
  <text x="815" y="414" text-anchor="middle" font-size="10" fill="#56655f">held by anti-σ Gin (CsfB)</text>
  <!-- sigG signal -> SpoIVFB -> sigK -->
  <path d="M785 360 L742 392" stroke="#0e6b66" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="660" y="392" width="80" height="34" rx="6" fill="#ffffff" stroke="#b8620f" stroke-width="1.8"/>
  <text x="700" y="414" text-anchor="middle" font-size="13" font-weight="600" fill="#b8620f">SpoIVFB</text>
  <rect x="520" y="400" width="80" height="26" rx="13" fill="#ffffff" stroke="#8fa39c"/>
  <text x="560" y="418" text-anchor="middle" font-size="12" fill="#15201e">pro-σK</text>
  <path d="M660 412 L602 412" stroke="#b8620f" stroke-width="2" marker-end="url(#o)"/>
  <path d="M520 412 L462 408" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <circle cx="430" cy="404" r="30" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="430" y="410" text-anchor="middle" font-size="16" font-weight="600" fill="#0e6b66">σK</text>
  <text x="340" y="440" text-anchor="middle" font-size="11" fill="#56655f">late mother cell</text>
  <!-- GO note -->
  <g transform="translate(262 120)">
    <rect width="220" height="96" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="12" y="22" font-size="12" font-weight="600" fill="#15201e">GO calls on the σ factors</text>
    <text x="12" y="44" font-size="11" fill="#1d8a4b">ACCEPT  sigma factor activity</text>
    <text x="12" y="62" font-size="11" fill="#bd3a30">REMOVE  DNA-directed RNA pol. activity</text>
    <text x="12" y="80" font-size="11" fill="#bd3a30">REMOVE  cis-regulatory region binding</text>
  </g>
  <text x="480" y="495" text-anchor="middle" font-size="12" fill="#56655f">Orange: the membrane phosphatase and proteases that gate each step. Dashed: signals across the septum. SpoIVFB was not itself reviewed.</text>
</svg>
