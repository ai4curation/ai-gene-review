<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="200" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="#bd3a30">43 BP terms · OBSOLETE</text>
  <text x="560" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="#0e6b66">surviving BP parents</text>
  <text x="840" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="#1d68b3">where specificity lives (MF)</text>
  <!-- block 1 -->
  <rect x="30" y="52" width="340" height="206" rx="12" fill="#fbeceb" stroke="#bd3a30" stroke-dasharray="7 5" stroke-width="1.5"/>
  <text x="48" y="80" font-size="15" font-weight="600" fill="#15201e">Block 1 · 23 terms</text>
  <g font-size="12.5" fill="#15201e">
    <text x="48" y="104">20 × &lt;aa&gt;yl-tRNA aminoacylation</text>
    <text x="64" y="122" fill="#56655f">GO:0006419 alanyl … GO:0006438 valyl</text>
    <text x="48" y="146">GO:0061475 cytosolic valyl- (1 annotation)</text>
    <text x="48" y="166">GO:1990762 cytoplasmic alanyl- (0)</text>
    <text x="48" y="190">GO:0070681 Gln-tRNA(Gln) via transamidation</text>
    <text x="64" y="208" fill="#b8620f">breaks 1:1 pattern; inclusion to confirm</text>
  </g>
  <text x="48" y="242" font-size="13" fill="#56655f">179 experimental annotations (QuickGO)</text>
  <!-- block 2 -->
  <rect x="30" y="282" width="340" height="170" rx="12" fill="#fbeceb" stroke="#bd3a30" stroke-dasharray="7 5" stroke-width="1.5"/>
  <text x="48" y="310" font-size="15" font-weight="600" fill="#15201e">Block 2 · 20 terms</text>
  <g font-size="12.5" fill="#15201e">
    <text x="48" y="334">20 × mitochondrial &lt;aa&gt;yl-tRNA aminoacylation</text>
    <text x="64" y="352" fill="#56655f">GO:0070143 … GO:0070185</text>
    <text x="48" y="376">6 of 20 have zero annotations of any kind</text>
    <text x="48" y="396">GO:0070153, GO:0070155: sole annotation is</text>
    <text x="48" y="414">zebrafish gtpbp3 (not a synthetase)</text>
  </g>
  <text x="48" y="438" font-size="13" fill="#56655f">24 experimental annotations</text>
  <!-- targets -->
  <rect x="440" y="110" width="250" height="90" rx="12" fill="#dcefec" stroke="#0e6b66" stroke-width="1.8"/>
  <text x="458" y="140" font-size="17" font-weight="600" fill="#15201e">GO:0006418</text>
  <text x="458" y="162" font-size="13" fill="#15201e">tRNA aminoacylation for</text>
  <text x="458" y="180" font-size="13" fill="#15201e">protein translation</text>
  <rect x="440" y="320" width="250" height="90" rx="12" fill="#dcefec" stroke="#0e6b66" stroke-width="1.8"/>
  <text x="458" y="350" font-size="17" font-weight="600" fill="#15201e">GO:0070127</text>
  <text x="458" y="372" font-size="13" fill="#15201e">tRNA aminoacylation for</text>
  <text x="458" y="390" font-size="13" fill="#15201e">mitochondrial protein translation</text>
  <path d="M372 155 L436 155" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <path d="M372 365 L436 365" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <!-- MF -->
  <rect x="730" y="110" width="210" height="300" rx="12" fill="#eaf1fa" stroke="#1d68b3" stroke-width="1.5"/>
  <g font-size="12.5" fill="#15201e">
    <text x="746" y="138" font-weight="600">20 × &lt;aa&gt;-tRNA ligase</text>
    <text x="746" y="156" font-weight="600">activity (kept)</text>
    <text x="746" y="182">GO:0004813 alanine-</text>
    <text x="746" y="200">GO:0004828 serine-</text>
    <text x="746" y="218">… GO:0004832 valine-</text>
    <text x="746" y="248">GO:0050567 glutaminyl-</text>
    <text x="746" y="266">tRNA synthase (Gln-</text>
    <text x="746" y="284">hydrolyzing) (kept)</text>
    <text x="746" y="316" fill="#56655f">mitochondrial twins map</text>
    <text x="746" y="334" fill="#56655f">to the SAME MF: compartment</text>
    <text x="746" y="352" fill="#56655f">is not an MF distinction</text>
  </g>
  <path d="M692 155 L728 155" stroke="#1d68b3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M692 365 L728 365" stroke="#1d68b3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="30" y="492" font-size="13" fill="#56655f">Already landed: go-ontology #32537 (tRNA aminoacylation cut from amino acid metabolism) and #32541 (GO:0043039 renamed "tRNA charging").</text>
</svg>
