# Combined "X involved in Y" terms judged KEEP_PRECOMPOSED: the term is the
# right grain and is not decomposed. Curated input to scripts/inventory.py,
# which flags rows and authored uses of these terms `kept` and leaves them out
# of module_candidates.yaml. A label containing "involved in" is not by itself
# a reason to decompose; each entry says why this one stays.
- id: GO:0106074
  label: aminoacyl-tRNA metabolism involved in translational fidelity
  triage_class: D-iii
  round: 5
  reason: >-
    The term is the aminoacyl-tRNA editing (proofreading) process, and GO has
    no other term for it. Its genus candidate, GO:0006399 tRNA metabolic
    process, covers all tRNA metabolism and would lose the editing meaning.
    The "translational fidelity" half adds nothing a decomposition could carry:
    the term already is_a GO:0006450 regulation of translational fidelity. GO
    itself attaches the editing activity to this process (GO:0002161
    aminoacyl-tRNA deacylase activity part_of GO:0106074), and every review
    that uses the term in core_functions pairs it with that activity or one of
    its children. Upstream: rename to the process it names and add a logical
    definition (upstream-tickets.md, ticket 6).
- id: GO:0006271
  label: DNA strand elongation involved in DNA replication
  triage_class: B
  round: 5
  reason: >-
    The term names the elongation stage of DNA replication (EXACT synonym
    "DNA replication elongation"; Reactome R-HSA-69190 "DNA strand
    elongation"), as GO:0006414 translational elongation names a stage of
    translation. Its own subclasses, GO:0006272 leading strand elongation and
    GO:0006273 lagging strand elongation, are stages of replication too, so
    decomposing the parent to GO:0022616 DNA strand elongation would leave
    them under a retired class. The genus also covers strand extension outside
    replication, so the polymerase, clamp, clamp loader and helicase subunits
    that carry the term would lose which process they serve. Upstream: rename
    to the EXACT synonym (upstream-tickets.md, ticket 6).
