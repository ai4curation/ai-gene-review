<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker>
  </defs>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#15201e">Lateral inhibition picks which progenitor becomes a neuron</text>
  <!-- cell A -->
  <ellipse cx="190" cy="220" rx="150" ry="120" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <text x="190" y="88" font-size="15" text-anchor="middle" fill="#56655f">Progenitor A (proneural high)</text>
  <rect x="100" y="150" width="180" height="40" rx="6" fill="#1d68b3"/>
  <text x="190" y="176" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">ASCL1 / NEUROG1/2</text>
  <line x1="190" y1="192" x2="190" y2="232" stroke="#0e6b66" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="140" y="236" width="100" height="34" rx="6" fill="#dcefec" stroke="#0e6b66"/>
  <text x="190" y="259" font-size="15" text-anchor="middle" fill="#15201e">DLL1 ligand</text>
  <line x1="190" y1="272" x2="190" y2="306" stroke="#0e6b66" stroke-width="3" marker-end="url(#ar)"/>
  <text x="190" y="322" font-size="15" text-anchor="middle" fill="#15201e" font-weight="bold">NEUROD1 → neuron</text>
  <!-- signal -->
  <line x1="242" y1="253" x2="470" y2="253" stroke="#0e6b66" stroke-width="4" marker-end="url(#ar)"/>
  <text x="405" y="282" font-size="13" text-anchor="middle" fill="#0e6b66">Delta–Notch</text><text x="405" y="298" font-size="13" text-anchor="middle" fill="#0e6b66">contact</text>
  <!-- cell B -->
  <ellipse cx="620" cy="220" rx="150" ry="120" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <text x="620" y="88" font-size="15" text-anchor="middle" fill="#56655f">Progenitor B (Notch on)</text>
  <rect x="475" y="236" width="90" height="34" rx="6" fill="#dcefec" stroke="#0e6b66"/>
  <text x="520" y="259" font-size="15" text-anchor="middle" fill="#15201e">NOTCH1</text>
  <line x1="567" y1="253" x2="600" y2="253" stroke="#0e6b66" stroke-width="3" marker-end="url(#ar)"/>
  <rect x="604" y="236" width="90" height="34" rx="6" fill="#dcefec" stroke="#0e6b66"/>
  <text x="649" y="259" font-size="15" text-anchor="middle" fill="#15201e">HES1</text>
  <line x1="649" y1="234" x2="649" y2="186" stroke="#bd3a30" stroke-width="3"/>
  <line x1="635" y1="186" x2="663" y2="186" stroke="#bd3a30" stroke-width="4"/>
  <rect x="560" y="146" width="180" height="36" rx="6" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="4 3"/>
  <text x="650" y="170" font-size="15" text-anchor="middle" fill="#56655f">ASCL1 / NEUROG (off)</text>
  <text x="620" y="300" font-size="13" text-anchor="middle" fill="#15201e">PAX6, SOX2 keep progenitor state</text>
  <!-- gliogenic switch -->
  <line x1="620" y1="342" x2="620" y2="385" stroke="#56655f" stroke-width="3" marker-end="url(#ar2)"/>
  <text x="632" y="370" font-size="14" fill="#56655f">later: gliogenic switch</text>
  <rect x="420" y="392" width="230" height="84" rx="8" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
  <text x="535" y="418" font-size="16" text-anchor="middle" fill="#b8620f" font-weight="bold">Astrocyte</text>
  <text x="535" y="442" font-size="14" text-anchor="middle" fill="#15201e">SOX9, NFIA, STAT3 (JAK-STAT)</text>
  <text x="535" y="462" font-size="13" text-anchor="middle" fill="#56655f">GFAP and astrocyte genes</text>
  <rect x="670" y="392" width="230" height="84" rx="8" fill="#ffffff" stroke="#7657a3" stroke-width="2"/>
  <text x="785" y="418" font-size="16" text-anchor="middle" fill="#7657a3" font-weight="bold">Oligodendrocyte</text>
  <text x="785" y="442" font-size="14" text-anchor="middle" fill="#15201e">OLIG2 (with SHH ventrally)</text>
  <text x="785" y="462" font-size="13" text-anchor="middle" fill="#56655f">also motor neurons</text>
  <!-- legend -->
  <text x="30" y="420" font-size="14" fill="#15201e"><tspan fill="#0e6b66" font-weight="bold">→</tspan> activates</text>
  <text x="30" y="444" font-size="14" fill="#15201e"><tspan fill="#bd3a30" font-weight="bold">⊣</tspan> represses</text>
  <text x="30" y="476" font-size="13" fill="#56655f">DLX1 later drives GABAergic</text>
  <text x="30" y="494" font-size="13" fill="#56655f">interneuron identity.</text>
</svg>
