<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fa39c"/></marker></defs>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#15201e">The classical fate ladder in GO, and what the reviews decided</text>
  <text x="30" y="60" font-size="14" fill="#56655f">Each rung needs a different experiment. Rows below are from the gene review YAML files.</text>
  <!-- rungs -->
  <g font-size="15">
    <rect x="30" y="90" width="200" height="70" rx="8" fill="#dcefec" stroke="#0e6b66"/>
    <text x="130" y="118" text-anchor="middle" font-weight="bold" fill="#15201e">Specification</text>
    <text x="130" y="140" text-anchor="middle" font-size="13" fill="#56655f">reversible; test in neutral site</text>
    <rect x="265" y="90" width="200" height="70" rx="8" fill="#dcefec" stroke="#0e6b66"/>
    <text x="365" y="118" text-anchor="middle" font-weight="bold" fill="#15201e">Determination</text>
    <text x="365" y="140" text-anchor="middle" font-size="13" fill="#56655f">irreversible; test by transplant</text>
    <rect x="500" y="90" width="200" height="70" rx="8" fill="#dcefec" stroke="#0e6b66"/>
    <text x="600" y="118" text-anchor="middle" font-weight="bold" fill="#15201e">Commitment</text>
    <text x="600" y="140" text-anchor="middle" font-size="13" fill="#56655f">heritable restriction</text>
    <rect x="735" y="90" width="200" height="70" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="835" y="118" text-anchor="middle" font-weight="bold" fill="#15201e">Differentiation</text>
    <text x="835" y="140" text-anchor="middle" font-size="13" fill="#56655f">specialized features</text>
    <line x1="232" y1="125" x2="262" y2="125" stroke="#8fa39c" stroke-width="3" marker-end="url(#a)"/>
    <line x1="467" y1="125" x2="497" y2="125" stroke="#8fa39c" stroke-width="3" marker-end="url(#a)"/>
    <line x1="702" y1="125" x2="732" y2="125" stroke="#8fa39c" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <!-- verdict cards -->
  <g font-size="14" fill="#15201e">
    <rect x="30" y="190" width="200" height="120" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="42" y="214" font-weight="bold">ASCL1</text><text x="42" y="234">GO:0048665 neuron fate</text><text x="42" y="252">specification</text>
    <rect x="42" y="266" width="70" height="24" rx="4" fill="#1d8a4b"/><text x="77" y="283" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ACCEPT</text>

    <rect x="30" y="325" width="200" height="120" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="42" y="349" font-weight="bold">OLIG2</text><text x="42" y="369">GO:0021778 oligodendrocyte</text><text x="42" y="387">cell fate specification</text>
    <rect x="42" y="401" width="70" height="24" rx="4" fill="#1d8a4b"/><text x="77" y="418" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ACCEPT</text>

    <rect x="265" y="190" width="200" height="255" rx="8" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="5 4"/>
    <text x="365" y="300" text-anchor="middle" fill="#56655f">No determination-term</text>
    <text x="365" y="320" text-anchor="middle" fill="#56655f">annotations on the</text>
    <text x="365" y="340" text-anchor="middle" fill="#56655f">13 reviewed genes</text>

    <rect x="500" y="190" width="200" height="80" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="512" y="212" font-weight="bold">ASCL1 · GO:0048663</text><text x="512" y="230" font-size="13">neuron fate commitment</text>
    <rect x="512" y="238" width="70" height="22" rx="4" fill="#1d8a4b"/><text x="547" y="254" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ACCEPT</text>
    <rect x="500" y="278" width="200" height="80" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="512" y="300" font-weight="bold">PAX6 · GO:0048663 (NAS)</text><text x="512" y="318" font-size="13">neuron fate commitment</text>
    <rect x="512" y="326" width="140" height="22" rx="4" fill="#56655f"/><text x="582" y="342" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">KEEP_AS_NON_CORE</text>
    <rect x="500" y="366" width="200" height="80" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="512" y="388" font-weight="bold">OLIG2 · GO:0021779</text><text x="512" y="406" font-size="13">oligodendrocyte fate commitment</text>
    <rect x="512" y="414" width="50" height="22" rx="4" fill="#1d68b3"/><text x="537" y="430" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">NEW</text>

    <rect x="735" y="190" width="200" height="120" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="747" y="214" font-weight="bold">ASCL1 · GO:0030182</text><text x="747" y="234">neuron differentiation</text><text x="747" y="252" font-size="13" fill="#56655f">(IBA)</text>
    <rect x="747" y="266" width="70" height="24" rx="4" fill="#1d8a4b"/><text x="782" y="283" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">ACCEPT</text>
    <rect x="735" y="325" width="200" height="120" rx="8" fill="#e8f1ee" stroke="#0e6b66"/>
    <text x="747" y="349" font-weight="bold">All fate-stage rows</text><text x="747" y="369">14 rows on 5 genes:</text><text x="747" y="389">9 ACCEPT, 1 NEW,</text><text x="747" y="409">4 KEEP_AS_NON_CORE,</text><text x="747" y="429">0 removed</text>
  </g>
  <text x="30" y="490" font-size="14" fill="#56655f">Fate-stage terms survived review: accepted for ASCL1 and OLIG2; NAS rows on PAX6 and SOX2 kept as non-core.</text>
</svg>
