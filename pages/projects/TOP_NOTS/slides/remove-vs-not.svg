<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56655f"/></marker></defs>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">Why a REMOVE is not enough for a pseudo-enzyme</text>
  <text x="24" y="56" font-size="13" fill="#56655f">Example: a JmjC-family tree in which one member (Epe1) has lost its Fe(II)-binding catalytic residues (schematic)</text>

  <!-- left panel: REMOVE only -->
  <rect x="24" y="74" width="440" height="360" rx="10" fill="#f4f7f6" stroke="#8fa39c"/>
  <text x="44" y="102" font-size="16" font-weight="bold" fill="#bd3a30">REMOVE in one review only</text>
  <!-- tree -->
  <g stroke="#15201e" stroke-width="2" fill="none">
    <path d="M70 250 L 110 250"/><path d="M110 170 L 110 330"/>
    <path d="M110 170 L 170 170"/><path d="M110 330 L 170 330"/>
    <path d="M170 140 L 170 200"/><path d="M170 140 L 230 140"/><path d="M170 200 L 230 200"/>
    <path d="M170 300 L 170 360"/><path d="M170 300 L 230 300"/><path d="M170 360 L 230 360"/>
  </g>
  <circle cx="110" cy="250" r="7" fill="#0e6b66"/>
  <text x="118" y="272" font-size="12" fill="#0e6b66">IBD: demethylase</text>
  <g font-size="13" fill="#15201e">
    <text x="238" y="145">active JmjC A  ✓</text>
    <text x="238" y="205">active JmjC B  ✓</text>
    <text x="238" y="305">active JmjC C  ✓</text>
    <text x="238" y="365" font-weight="bold" fill="#bd3a30">Epe1 (degenerate site)</text>
  </g>
  <path d="M300 380 C 330 410, 390 410, 420 380" stroke="#bd3a30" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <text x="44" y="412" font-size="12" fill="#15201e">The IBA/IEA row is struck from our YAML, but the next GOA</text>
  <text x="44" y="428" font-size="12" fill="#15201e">release re-asserts it: nothing upstream records the loss.</text>

  <!-- right panel: NOT -->
  <rect x="496" y="74" width="440" height="360" rx="10" fill="#e3f3e8" stroke="#1d8a4b"/>
  <text x="516" y="102" font-size="16" font-weight="bold" fill="#1d8a4b">NOT annotation filed upstream</text>
  <g stroke="#15201e" stroke-width="2" fill="none">
    <path d="M542 250 L 582 250"/><path d="M582 170 L 582 330"/>
    <path d="M582 170 L 642 170"/><path d="M582 330 L 642 330"/>
    <path d="M642 140 L 642 200"/><path d="M642 140 L 702 140"/><path d="M642 200 L 702 200"/>
    <path d="M642 300 L 642 360"/><path d="M642 300 L 702 300"/>
  </g>
  <path d="M642 360 L 702 360" stroke="#bd3a30" stroke-width="3"/>
  <line x1="664" y1="348" x2="680" y2="372" stroke="#bd3a30" stroke-width="3"/><line x1="680" y1="348" x2="664" y2="372" stroke="#bd3a30" stroke-width="3"/>
  <circle cx="582" cy="250" r="7" fill="#0e6b66"/>
  <text x="590" y="272" font-size="12" fill="#0e6b66">IBD: demethylase</text>
  <g font-size="13" fill="#15201e">
    <text x="710" y="145">active JmjC A  ✓</text>
    <text x="710" y="205">active JmjC B  ✓</text>
    <text x="710" y="305">active JmjC C  ✓</text>
    <text x="710" y="365" font-weight="bold" fill="#1d8a4b">Epe1: NOT demethylase</text>
  </g>
  <text x="516" y="412" font-size="12" fill="#15201e">The negated row marks the loss at the tip, so propagation</text>
  <text x="516" y="428" font-size="12" fill="#15201e">and domain-based IEA stop re-asserting the activity.</text>

  <rect x="24" y="450" width="912" height="56" rx="8" fill="#dcefec"/>
  <text x="44" y="474" font-size="14" font-weight="bold" fill="#0e6b66">A NOT needs positive evidence of absence</text>
  <text x="44" y="494" font-size="13" fill="#15201e">(a degenerate active site, a negative assay), not merely missing evidence. Most REMOVEs do not qualify; the pseudo-enzymes do.</text>
</svg>
