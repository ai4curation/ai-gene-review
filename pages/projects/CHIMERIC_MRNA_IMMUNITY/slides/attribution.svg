<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="36" font-size="21" font-weight="bold" fill="#15201e">Where the chimera's function is recorded</text>
<g font-size="14">
<rect x="340" y="70" width="280" height="90" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="480" y="100" text-anchor="middle" font-weight="bold" fill="#0e6b66">Chimera function (mouse)</text>
<text x="480" y="124" text-anchor="middle" fill="#15201e">cofactor that accelerates</text>
<text x="480" y="144" text-anchor="middle" fill="#15201e">GSDMD-NT pore formation</text>
<!-- GSDMD -->
<rect x="30" y="240" width="400" height="230" rx="10" fill="#ffffff" stroke="#8fa39c" stroke-width="2"/>
<text x="45" y="268" font-weight="bold" fill="#15201e">human GSDMD review (77 rows)</text>
<text x="45" y="296" fill="#15201e">existing_annotations, core_functions:</text>
<text x="45" y="316" fill="#1d8a4b">canonical pore-forming biology only</text>
<text x="45" y="344" fill="#15201e">knowledge_gaps:</text>
<text x="45" y="364" fill="#0e6b66">full set of pore cofactors undefined;</text>
<text x="45" y="384" fill="#0e6b66">human chimera unknown</text>
<text x="45" y="412" fill="#15201e">suggested question:</text>
<text x="45" y="432" fill="#0e6b66">does a human orthologous chimera exist</text>
<text x="45" y="452" fill="#0e6b66">and act as in mouse?</text>
<!-- TMEM106A -->
<rect x="530" y="240" width="400" height="230" rx="10" fill="#ffffff" stroke="#8fa39c" stroke-width="2"/>
<text x="545" y="268" font-weight="bold" fill="#15201e">human TMEM106A review (10 rows)</text>
<text x="545" y="296" fill="#15201e">existing_annotations, core_functions:</text>
<text x="545" y="316" fill="#1d8a4b">macrophage activation, plasma membrane</text>
<text x="545" y="344" fill="#15201e">knowledge_gaps:</text>
<text x="545" y="364" fill="#0e6b66">canonical protein's MF is dark (MF_DARK)</text>
<text x="545" y="384" fill="#0e6b66">human chimera unknown (BP_DARK)</text>
<text x="545" y="412" fill="#bd3a30" font-weight="bold">wrong-frame trap:</text>
<text x="545" y="432" fill="#15201e">chimera uses an out-of-frame peptide,</text>
<text x="545" y="452" fill="#15201e">not the canonical TMEM106A protein</text>
<!-- arrows -->
<path d="M400 160 L 250 236" stroke="#0e6b66" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
<path d="M560 160 L 710 236" stroke="#0e6b66" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
<text x="480" y="200" text-anchor="middle" fill="#bd3a30" font-weight="bold">not an annotation of either parent</text>
<text x="480" y="220" text-anchor="middle" fill="#56655f">recorded as gaps and questions</text>
</g>
</svg>
