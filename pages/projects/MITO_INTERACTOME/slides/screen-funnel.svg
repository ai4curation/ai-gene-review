<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" font-weight="700" fill="#15201e">From 630,003 pairs to curation-grade evidence</text>

  <!-- funnel bars (widths not to scale beyond order) -->
  <g font-size="14">
    <rect x="30" y="70" width="600" height="56" rx="6" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="46" y="96" font-weight="700" fill="#15201e">630,003 heteromeric pairs</text>
    <text x="46" y="115" fill="#56655f">all pairs of 1123 MitoCarta3.0 proteins, AlphaFold-Multimer × 5 models</text>

    <rect x="80" y="140" width="500" height="56" rx="6" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="96" y="166" font-weight="700" fill="#15201e">541,758 (86%) below ipTM 0.2</text>
    <text x="96" y="185" fill="#56655f">clear non-interactors</text>

    <rect x="150" y="210" width="360" height="56" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
    <text x="166" y="236" font-weight="700" fill="#0e6b66">2,895 hits at mean ipTM ≥ 0.5</text>
    <text x="166" y="255" fill="#56655f">~85% precision · ~67% recall</text>

    <rect x="200" y="280" width="260" height="56" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
    <text x="216" y="306" font-weight="700" fill="#0e6b66">57% previously unreported</text>
    <text x="216" y="325" fill="#56655f">43% already in STRING, BioGRID…</text>

    <rect x="240" y="350" width="180" height="56" rx="6" fill="#f6efe6" stroke="#b8620f" stroke-width="1.6"/>
    <text x="256" y="376" font-weight="700" fill="#b8620f">85 of 101 orphans</text>
    <text x="256" y="395" fill="#56655f">get a partner</text>

    <rect x="270" y="420" width="120" height="56" rx="6" fill="#ffffff" stroke="#1d68b3" stroke-width="2"/>
    <text x="330" y="446" text-anchor="middle" font-weight="700" fill="#1d68b3">1 orphan</text>
    <text x="330" y="465" text-anchor="middle" fill="#1d68b3">validated: COA4</text>
  </g>

  <!-- rule panel -->
  <g transform="translate(660 70)">
    <rect width="280" height="406" rx="10" fill="#ffffff" stroke="#0e6b66"/>
    <text x="16" y="30" font-size="15" font-weight="700" fill="#0e6b66">How the repo uses it</text>
    <g font-size="13" fill="#15201e">
      <text x="16" y="62" font-weight="700" fill="#bd3a30">A predicted hit is not</text>
      <text x="16" y="80" font-weight="700" fill="#bd3a30">annotation evidence</text>
      <text x="16" y="104">never in existing_annotations;</text>
      <text x="16" y="122">never a reason for protein binding;</text>
      <text x="16" y="140">record in predictions-review or</text>
      <text x="16" y="158">bioinformatics RESULTS.md</text>
      <text x="16" y="196" font-weight="700" fill="#1d8a4b">The experiments are</text>
      <text x="16" y="214">co-IP, CRISPR KO, ICP-MS,</text>
      <text x="16" y="232">BN-PAGE and respirometry on COA4;</text>
      <text x="16" y="250">co-IP/MS of the yeast Coq metabolon</text>
      <text x="16" y="288" font-weight="700" fill="#b8620f">Caveats to carry</text>
      <text x="16" y="306">~1 in 7 hits wrong at the cutoff</text>
      <text x="16" y="324">absence ≠ no interaction</text>
      <text x="16" y="342">binary pair ≠ physiological complex</text>
      <text x="16" y="360">mito × mito pairs only</text>
    </g>
  </g>
</svg>
