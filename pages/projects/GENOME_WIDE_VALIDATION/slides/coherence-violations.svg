<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="34" font-size="19" font-weight="bold" fill="#0e6b66">The 17 unsatisfied dependencies, by triage class</text>
<rect x="30.0" y="56" width="52.9" height="34" fill="#bd3a30" stroke="#ffffff" stroke-width="2"/>
<text x="56.5" y="79" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">1</text>
<rect x="82.9" y="56" width="317.6" height="34" fill="#b8620f" stroke="#ffffff" stroke-width="2"/>
<text x="241.8" y="79" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">6</text>
<rect x="400.6" y="56" width="158.8" height="34" fill="#7657a3" stroke="#ffffff" stroke-width="2"/>
<text x="480.0" y="79" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">3</text>
<rect x="559.4" y="56" width="370.6" height="34" fill="#8fa39c" stroke="#ffffff" stroke-width="2"/>
<text x="744.7" y="79" font-size="15" text-anchor="middle" font-weight="bold" fill="#ffffff">7</text>
<rect x="30" y="110" width="12" height="12" fill="#bd3a30"/><text x="48" y="121" font-size="14" font-weight="bold" fill="#15201e">Genuine biological gap (1)</text>
<text x="48" y="140" font-size="12" fill="#15201e">denitrification pathway → nitrous-oxide reductase activity</text>
<rect x="30" y="178" width="12" height="12" fill="#b8620f"/><text x="48" y="189" font-size="14" font-weight="bold" fill="#15201e">Annotation-granularity gap (6)</text>
<text x="48" y="208" font-size="12" fill="#15201e">DnaB-DnaC complex → DnaB helicase complex</text>
<text x="48" y="225" font-size="12" fill="#15201e">DnaA-DiaA complex → DiaA complex</text>
<text x="48" y="242" font-size="12" fill="#15201e">DnaB-DnaG complex → DnaB helicase complex</text>
<text x="48" y="259" font-size="12" fill="#15201e">tRNA CCA addition → CC tRNA cytidylyltransferase</text>
<text x="48" y="276" font-size="12" fill="#15201e">tRNA CCA addition → ATP:CC-tRNA adenylyltransferase</text>
<text x="48" y="293" font-size="12" fill="#15201e">molybdopterin biosynthesis → MPT-synthase sulfurtransferase</text>
<rect x="500" y="110" width="12" height="12" fill="#7657a3"/><text x="518" y="121" font-size="14" font-weight="bold" fill="#15201e">Probable over-annotation (3)</text>
<text x="518" y="140" font-size="12" fill="#15201e">heterochromatin formation → heterochromatin boundary formation</text>
<text x="518" y="157" font-size="12" fill="#15201e">establishment of integrated proviral latency → viral genome integration</text>
<text x="518" y="174" font-size="12" fill="#15201e">virion attachment to host cell → host cell surface binding</text>
<rect x="500" y="224" width="12" height="12" fill="#8fa39c"/><text x="518" y="235" font-size="14" font-weight="bold" fill="#15201e">Not yet triaged (7)</text>
<text x="518" y="254" font-size="12" fill="#15201e">cytokinesis → membrane fission</text>
<text x="518" y="271" font-size="12" fill="#15201e">RNA-binding transcription regulator → regulatory region RNA binding</text>
<text x="518" y="288" font-size="12" fill="#15201e">translational initiation → initiation ternary complex formation</text>
<text x="518" y="305" font-size="12" fill="#15201e">protein deubiquitination → cysteine-type deubiquitinase</text>
<text x="518" y="322" font-size="12" fill="#15201e">glycolipid transfer activity → glycolipid binding</text>
<text x="518" y="339" font-size="12" fill="#15201e">receptor-mediated virion attachment → signaling receptor binding</text>
<text x="518" y="356" font-size="12" fill="#15201e">side of membrane → leaflet of membrane bilayer</text>
<text x="30" y="440" font-size="12" fill="#56655f">Each class routes to a different action: confirm absence by sequence search; add the finer MF/CC term; or review for REMOVE.</text>
<text x="30" y="460" font-size="12" fill="#56655f">Classes follow the pilot README triage; seven violations are not assigned a class there.</text>
<text x="30" y="488" font-size="12" fill="#56655f">Source: projects/GENOME_WIDE_VALIDATION/pilot-ecoli/violations.tsv and README.md (C → missing required part F).</text>
</svg>