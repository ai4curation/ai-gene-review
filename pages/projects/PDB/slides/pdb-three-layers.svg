<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker></defs>
  <text x="30" y="38" font-size="21" font-weight="700" fill="#15201e">A structure paper is three kinds of evidence</text>
  <text x="30" y="62" font-size="14" fill="#56655f">H1 ledger, round 2 frontier genes (no prior experimental GO): what each layer filled</text>

  <!-- paper -->
  <rect x="30" y="90" width="180" height="370" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="120" y="120" text-anchor="middle" font-size="17" font-weight="700" fill="#15201e">Structure paper</text>
  <!-- tiny ribbon glyph with cofactor -->
  <path d="M60,170 C80,140 100,200 120,170 C140,140 160,200 180,170" fill="none" stroke="#0e6b66" stroke-width="5" stroke-linecap="round"/>
  <path d="M60,210 C80,180 100,240 120,210 C140,180 160,240 180,210" fill="none" stroke="#8fa39c" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="190" r="10" fill="#b8620f"/>
  <text x="120" y="258" text-anchor="middle" font-size="13" fill="#15201e">coordinates +</text>
  <text x="120" y="276" text-anchor="middle" font-size="13" fill="#15201e">bound cofactor</text>
  <text x="120" y="306" text-anchor="middle" font-size="13" fill="#15201e">+ assays, mutants,</text>
  <text x="120" y="324" text-anchor="middle" font-size="13" fill="#15201e">biological context</text>
  <text x="120" y="354" text-anchor="middle" font-size="13" fill="#15201e">+ sequence / EC</text>
  <text x="120" y="420" text-anchor="middle" font-size="12" fill="#56655f">e.g. merA 1ZK7</text>
  <text x="120" y="438" text-anchor="middle" font-size="12" fill="#56655f">PMID:16114877</text>

  <!-- layers -->
  <g font-size="14" fill="#15201e">
    <line x1="210" y1="150" x2="262" y2="150" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="266" y="92" width="664" height="116" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="284" y="118" font-size="16" font-weight="700">1 · Coordinates</text>
    <text x="284" y="140">"X binding", metal binding, ATP hydrolysis, complex, heterooligomerization</text>
    <text x="284" y="164" fill="#bd3a30" font-weight="700">Low information.</text>
    <text x="412" y="164">Where the structure-unique and NEW wins landed:</text>
    <text x="284" y="186">merA Hg²⁺ + FAD binding (2 UNIQUE); mcrA Ni binding, MCR complex; secA ATP</text>
    <text x="284" y="200" font-size="12" fill="#56655f">hydrolysis; HSPB3 heterooligomerization (4 NEW annotations in the reviews)</text>

    <line x1="210" y1="290" x2="262" y2="290" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="266" y="224" width="664" height="124" rx="8" fill="#e6effa" stroke="#1d68b3" stroke-width="2"/>
    <text x="284" y="250" font-size="16" font-weight="700">2 · The paper's functional hypothesis</text>
    <text x="284" y="272">Informative, but scored clearly useful in 1 of 6 papers (merA), 1 marginal (secA)</text>
    <text x="284" y="296" font-weight="700" fill="#b8620f">Throttle 1: subunit mismatch (3 of 6)</text>
    <text x="284" y="316">mcrA paper is about McrD; mxaI about mxaF; psaC about the LHC antenna</text>
    <text x="284" y="338" font-weight="700" fill="#b8620f">Throttle 2: GO expressivity</text>
    <text x="520" y="338">"delivers Hg²⁺ to the catalytic core" has no MF term</text>

    <line x1="210" y1="410" x2="262" y2="410" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="266" y="364" width="664" height="96" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="284" y="390" font-size="16" font-weight="700">3 · Catalytic identity</text>
    <text x="284" y="412">Mercuric reductase, methyl-CoM reductase: carried by sequence and EC</text>
    <text x="284" y="436" fill="#1d8a4b" font-weight="700">Structure confirms it: FIRST_EXPERIMENTAL (~12 annotations), never UNIQUE</text>
  </g>
  <text x="30" y="496" font-size="13" fill="#56655f">Round 1 (genes already curated experimentally) was the wrong test: 4 of 4 structures only corroborated.</text>
</svg>
