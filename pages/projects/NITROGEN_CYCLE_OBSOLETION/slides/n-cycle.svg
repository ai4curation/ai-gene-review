<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d68b3"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8fa39c"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="36" font-size="18" font-weight="600" fill="#15201e">The nitrogen cycle is a set of microbial pathways</text>
  <g font-size="16" font-weight="600" fill="#15201e" text-anchor="middle">
    <rect x="80" y="90" width="110" height="48" rx="24" fill="#e8f1ee" stroke="#8fa39c"/><text x="135" y="120">N₂</text>
    <rect x="80" y="330" width="110" height="48" rx="24" fill="#e8f1ee" stroke="#8fa39c"/><text x="135" y="360">NH₄⁺</text>
    <rect x="380" y="330" width="110" height="48" rx="24" fill="#e8f1ee" stroke="#8fa39c"/><text x="435" y="360">NO₂⁻</text>
    <rect x="620" y="330" width="110" height="48" rx="24" fill="#e8f1ee" stroke="#8fa39c"/><text x="675" y="360">NO₃⁻</text>
    <rect x="620" y="200" width="110" height="48" rx="24" fill="#e8f1ee" stroke="#8fa39c"/><text x="675" y="230">NO₂⁻</text>
    <rect x="380" y="90" width="150" height="48" rx="24" fill="#e8f1ee" stroke="#8fa39c"/><text x="455" y="120">NO, N₂O</text>
    <rect x="60" y="440" width="150" height="48" rx="24" fill="#e8f1ee" stroke="#8fa39c"/><text x="135" y="470" font-size="14">organic N</text>
  </g>
  <!-- fixation -->
  <path d="M135 140 L135 326" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <text x="148" y="230" font-size="13" font-weight="600" fill="#0e6b66">fixation (GO:0009399)</text>
  <text x="148" y="248" font-size="12" fill="#56655f">nitrogenase; NifA activates nif genes</text>
  <!-- nitrification -->
  <path d="M192 354 L376 354" stroke="#8fa39c" stroke-width="3" marker-end="url(#g)"/><path d="M492 354 L616 354" stroke="#8fa39c" stroke-width="3" marker-end="url(#g)"/>
  <text x="440" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#56655f">nitrification</text>
  <!-- denitrification -->
  <path d="M675 328 L675 252" stroke="#1d68b3" stroke-width="3" marker-end="url(#b)"/>
  <path d="M640 200 C 600 150, 560 120, 534 116" stroke="#1d68b3" stroke-width="3" fill="none" marker-end="url(#b)"/>
  <path d="M378 114 L194 114" stroke="#1d68b3" stroke-width="3" marker-end="url(#b)"/>
  <text x="690" y="290" font-size="13" font-weight="600" fill="#1d68b3">napA: NO₃⁻ → NO₂⁻</text>
  <text x="560" y="84" font-size="13" font-weight="600" fill="#1d68b3">denitrification (GO:0019333)</text>
  <!-- mineralization -->
  <path d="M135 438 L135 382" stroke="#8fa39c" stroke-width="3" marker-end="url(#g)"/>
  <text x="220" y="416" font-size="13" font-weight="600" fill="#56655f">mineralization</text>
  <!-- off-cycle -->
  <rect x="770" y="410" width="170" height="90" rx="10" fill="#fbeceb" stroke="#bd3a30" stroke-dasharray="6 4"/>
  <text x="855" y="436" text-anchor="middle" font-size="13" font-weight="600" fill="#bd3a30">not in the cycle</text>
  <text x="855" y="458" text-anchor="middle" font-size="12" fill="#15201e">mouse Pkd1, Prkcsh,</text>
  <text x="855" y="476" text-anchor="middle" font-size="12" fill="#15201e">Sec63, Apc</text>
  <text x="855" y="493" text-anchor="middle" font-size="11" fill="#56655f">kidney/liver phenotypes</text>
</svg>
