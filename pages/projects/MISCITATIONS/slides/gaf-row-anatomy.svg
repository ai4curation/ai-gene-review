<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">Where the error lives in one annotation row</text>
  <text x="24" y="58" font-size="14" fill="#56655f">Six seed cases, each re-verified live. Only the red column is graded by reference_review.correctness.</text>
  <!-- row header -->
  <g font-size="15" font-weight="bold">
    <rect x="24"  y="90" width="120" height="54" fill="#e8f1ee" stroke="#8fa39c"/><text x="84"  y="122" text-anchor="middle" fill="#15201e">Gene</text>
    <rect x="144" y="90" width="150" height="54" fill="#e8f1ee" stroke="#8fa39c"/><text x="219" y="122" text-anchor="middle" fill="#15201e">Qualifier</text>
    <rect x="294" y="90" width="150" height="54" fill="#e8f1ee" stroke="#8fa39c"/><text x="369" y="122" text-anchor="middle" fill="#15201e">GO term</text>
    <rect x="444" y="90" width="150" height="54" fill="#e8f1ee" stroke="#8fa39c"/><text x="519" y="122" text-anchor="middle" fill="#15201e">Evidence code</text>
    <rect x="594" y="90" width="170" height="54" fill="#fbe4e1" stroke="#bd3a30" stroke-width="2"/><text x="679" y="122" text-anchor="middle" fill="#bd3a30">Reference</text>
    <rect x="764" y="90" width="172" height="54" fill="#e8f1ee" stroke="#8fa39c"/><text x="850" y="122" text-anchor="middle" fill="#15201e">WITH/FROM</text>
  </g>
  <text x="24" y="184" font-size="13" font-weight="bold" fill="#bd3a30">red: reference-level</text>
  <text x="24" y="202" font-size="13" font-weight="bold" fill="#1d68b3">blue: evidence-attachment</text>
  
  <!-- reference-level cases -->
  <g font-size="13" fill="#15201e">
    <path d="M679 150 L 679 206" stroke="#bd3a30" stroke-width="2"/>
    <rect x="574" y="206" width="210" height="104" rx="8" fill="#ffffff" stroke="#bd3a30"/>
    <text x="586" y="228" font-weight="bold" fill="#bd3a30">NLRP3 · WRONG_IDENTIFIER</text>
    <text x="586" y="246">PMID:1189953 = a 1975 paper</text>
    <text x="586" y="262">on profanity; meant 31189953</text>
    <text x="586" y="286" font-weight="bold" fill="#bd3a30">SULT1B1 · MISCITED</text>
    <text x="586" y="302">not among the paper's 4 hits</text>

    <!-- attachment: WITH/FROM -->
    <path d="M850 150 L 850 206" stroke="#1d68b3" stroke-width="2"/>
    <rect x="796" y="206" width="150" height="120" rx="8" fill="#ffffff" stroke="#1d68b3"/>
    <text x="806" y="228" font-weight="bold" fill="#1d68b3">ZBP1</text>
    <text x="806" y="246">Q13601 is KRR1;</text>
    <text x="806" y="262">the partner is RIPK1</text>
    <text x="806" y="286" font-weight="bold" fill="#1d68b3">GRID1</text>
    <text x="806" y="304">partner is haemoglobin</text>
    <text x="806" y="320">beta, a contaminant</text>

    <!-- attachment: evidence code -->
    <path d="M519 150 L 519 206" stroke="#1d68b3" stroke-width="2"/>
    <rect x="404" y="206" width="160" height="104" rx="8" fill="#ffffff" stroke="#1d68b3"/>
    <text x="416" y="228" font-weight="bold" fill="#1d68b3">PEX39</text>
    <text x="416" y="246">ECO:0000269 on a</text>
    <text x="416" y="262">2023 meeting report</text>
    <text x="416" y="278">(UniProt)</text>

    <!-- attachment: qualifier -->
    <path d="M219 150 L 219 216" stroke="#1d68b3" stroke-width="2"/>
    <rect x="94" y="216" width="250" height="104" rx="8" fill="#ffffff" stroke="#1d68b3"/>
    <text x="106" y="238" font-weight="bold" fill="#1d68b3">PNPLA3 · missing NOT</text>
    <text x="106" y="256">EXP for GO:0003841 from a paper</text>
    <text x="106" y="272">that assayed LPAAT and found none</text>
    <text x="106" y="296">with NOT, the citation</text>
    <text x="106" y="312">would be impeccable</text>
  </g>

  <!-- summary -->
  <rect x="24" y="360" width="912" height="136" rx="10" fill="#dcefec"/>
  <text x="44" y="392" font-size="16" font-weight="bold" fill="#0e6b66">4 of 6 cases have a correct paper, so reference_review grades them VERIFIED</text>
  <text x="44" y="418" font-size="14" fill="#15201e">The defect survives only as free text in review_notes, which no aggregation can find.</text>
  <text x="44" y="442" font-size="14" fill="#15201e">The register therefore under-counts attachment defects relative to reference defects.</text>
  <text x="44" y="474" font-size="14" fill="#15201e">Source of each error: GOA (NLRP3, SULT1B1, PNPLA3) · IntAct (ZBP1, GRID1) · UniProt (PEX39). None is in this repo.</text>
</svg>
