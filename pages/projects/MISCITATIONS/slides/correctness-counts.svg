<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">23,416 adjudicated references: 21,130 VERIFIED, 871 flagged</text>
<text x="24" y="58" font-size="14" fill="#56655f">Non-VERIFIED values of reference_review.correctness (miscitation-register.md). 2,731 of 5,296 reviews carry any reference_review.</text>
<text x="200" y="116" font-size="15" text-anchor="end" font-weight="bold" fill="#15201e">MISCITED</text>
<rect x="210" y="98" width="178" height="28" rx="3" fill="#b8620f"/>
<text x="396" y="118" font-size="15" font-weight="bold" fill="#15201e">349</text>
<text x="200" y="168" font-size="15" text-anchor="end" font-weight="bold" fill="#15201e">DISPUTED</text>
<rect x="210" y="150" width="152" height="28" rx="3" fill="#8fa39c"/>
<text x="370" y="170" font-size="15" font-weight="bold" fill="#15201e">297</text>
<text x="200" y="220" font-size="15" text-anchor="end" font-weight="bold" fill="#15201e">LOW_QUALITY</text>
<rect x="210" y="202" width="94" height="28" rx="3" fill="#8fa39c"/>
<text x="312" y="222" font-size="15" font-weight="bold" fill="#15201e">184</text>
<text x="200" y="272" font-size="15" text-anchor="end" font-weight="bold" fill="#15201e">WRONG_IDENTIFIER</text>
<rect x="210" y="254" width="21" height="28" rx="3" fill="#bd3a30"/>
<text x="239" y="274" font-size="15" font-weight="bold" fill="#15201e">41</text>
<text x="200" y="324" font-size="15" text-anchor="end" font-weight="bold" fill="#15201e">UNVERIFIED</text>
<rect x="210" y="306" width="600" height="28" rx="3" fill="#c9d6d1"/>
<text x="818" y="326" font-size="15" font-weight="bold" fill="#15201e">1174</text>
<line x1="24" y1="366" x2="936" y2="366" stroke="#8fa39c"/>
<text x="24" y="396" font-size="16" font-weight="bold" fill="#0e6b66">3.7% is a flag rate on an enriched sample, not a GO error rate</text>
<text x="24" y="422" font-size="14" fill="#15201e">Reviewers adjudicate a reference when they are already looking at it, often because it looked wrong.</text>
<text x="24" y="448" font-size="14" fill="#15201e">Human accounts for 656 of the 871 flags because that is where curation effort went.</text>
<text x="24" y="474" font-size="14" fill="#15201e">304 flags sit on prefixes the validator never snippet-checks: 212 file:, 44 GO_REF:, 48 Reactome:.</text>
</svg>
