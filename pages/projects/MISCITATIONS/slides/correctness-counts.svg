<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">14,559 adjudicated references: 13,414 VERIFIED, 559 flagged</text>
<text x="24" y="58" font-size="14" fill="#56655f">Non-VERIFIED values of reference_review.correctness (miscitation-register.md). 2,074 of 4,513 reviews carry any reference_review.</text>
<text x="200" y="116" font-size="15" text-anchor="end" font-weight="bold" fill="#15201e">MISCITED</text>
<rect x="210" y="98" width="274" height="28" rx="3" fill="#b8620f"/>
<text x="492" y="118" font-size="15" font-weight="bold" fill="#15201e">274</text>
<text x="200" y="168" font-size="15" text-anchor="end" font-weight="bold" fill="#15201e">DISPUTED</text>
<rect x="210" y="150" width="151" height="28" rx="3" fill="#8fa39c"/>
<text x="369" y="170" font-size="15" font-weight="bold" fill="#15201e">151</text>
<text x="200" y="220" font-size="15" text-anchor="end" font-weight="bold" fill="#15201e">LOW_QUALITY</text>
<rect x="210" y="202" width="108" height="28" rx="3" fill="#8fa39c"/>
<text x="326" y="222" font-size="15" font-weight="bold" fill="#15201e">108</text>
<text x="200" y="272" font-size="15" text-anchor="end" font-weight="bold" fill="#15201e">WRONG_IDENTIFIER</text>
<rect x="210" y="254" width="26" height="28" rx="3" fill="#bd3a30"/>
<text x="244" y="274" font-size="15" font-weight="bold" fill="#15201e">26</text>
<text x="200" y="324" font-size="15" text-anchor="end" font-weight="bold" fill="#15201e">UNVERIFIED</text>
<rect x="210" y="306" width="586" height="28" rx="3" fill="#c9d6d1"/>
<text x="804" y="326" font-size="15" font-weight="bold" fill="#15201e">586</text>
<line x1="24" y1="366" x2="936" y2="366" stroke="#8fa39c"/>
<text x="24" y="396" font-size="16" font-weight="bold" fill="#0e6b66">3.8% is a flag rate on an enriched sample, not a GO error rate</text>
<text x="24" y="422" font-size="14" fill="#15201e">Reviewers adjudicate a reference when they are already looking at it, often because it looked wrong.</text>
<text x="24" y="448" font-size="14" fill="#15201e">Human accounts for 470 of the 559 flags because that is where curation effort went.</text>
<text x="24" y="474" font-size="14" fill="#15201e">127 flags sit on prefixes the validator never snippet-checks: 72 file:, 28 GO_REF:, 27 Reactome:.</text>
</svg>