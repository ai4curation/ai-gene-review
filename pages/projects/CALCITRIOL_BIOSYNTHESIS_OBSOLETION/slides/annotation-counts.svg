<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="44" font-size="18" font-weight="600" fill="#15201e">24 curated annotations to GO:0036378, by gene and species</text>
  <text x="40" y="68" font-size="13" fill="#56655f">QuickGO, experimental and manual evidence, 2026-06-20 (table on the project page)</text>
  <!-- scale: 1 annotation = 40px, bars start x=190 -->
  <g font-size="15" fill="#15201e">
    <text x="176" y="128" text-anchor="end" font-weight="600">CYP27B1</text>
    <text x="176" y="198" text-anchor="end" font-weight="600">CYP2R1</text>
    <text x="176" y="268" text-anchor="end" font-weight="600">CYP27A1</text>
    <text x="176" y="338" text-anchor="end" font-weight="600">CYP24A1</text>
    <text x="176" y="408" text-anchor="end" font-weight="600">CYP3A4</text>
  </g>
  <!-- CYP27B1: human 9, mouse 3, rat 2, zebrafish 1 -->
  <rect x="190" y="104" width="360" height="36" fill="#0e6b66"/>
  <rect x="550" y="104" width="120" height="36" fill="#1d68b3"/>
  <rect x="670" y="104" width="80" height="36" fill="#7657a3"/>
  <rect x="750" y="104" width="40" height="36" fill="#b8620f"/>
  <text x="800" y="128" font-size="15" font-weight="600" fill="#15201e">15</text>
  <!-- CYP2R1: human 3, mouse 1 -->
  <rect x="190" y="174" width="120" height="36" fill="#0e6b66"/>
  <rect x="310" y="174" width="40" height="36" fill="#1d68b3"/>
  <text x="360" y="198" font-size="15" font-weight="600" fill="#15201e">4</text>
  <!-- CYP27A1: human 1, rat 1 -->
  <rect x="190" y="244" width="40" height="36" fill="#0e6b66"/>
  <rect x="230" y="244" width="40" height="36" fill="#7657a3"/>
  <text x="280" y="268" font-size="15" font-weight="600" fill="#15201e">2</text>
  <text x="310" y="268" font-size="13" fill="#1d8a4b">human review exists (row now on GO:1901755, kept non-core)</text>
  <!-- CYP24A1: human 1, rat 1 -->
  <rect x="190" y="314" width="40" height="36" fill="#0e6b66"/>
  <rect x="230" y="314" width="40" height="36" fill="#7657a3"/>
  <text x="280" y="338" font-size="15" font-weight="600" fill="#15201e">2</text>
  <text x="310" y="338" font-size="13" fill="#b8620f">inactivating enzyme: successor term to confirm</text>
  <!-- CYP3A4: human 1 -->
  <rect x="190" y="384" width="40" height="36" fill="#0e6b66"/>
  <text x="240" y="408" font-size="15" font-weight="600" fill="#15201e">1</text>
  <text x="270" y="408" font-size="13" fill="#56655f">drug-metabolising CYP; minor 25-hydroxylase</text>
  <!-- legend -->
  <g font-size="13.5" fill="#15201e">
    <rect x="190" y="458" width="16" height="16" fill="#0e6b66"/><text x="212" y="471">human</text>
    <rect x="290" y="458" width="16" height="16" fill="#1d68b3"/><text x="312" y="471">mouse</text>
    <rect x="390" y="458" width="16" height="16" fill="#7657a3"/><text x="412" y="471">rat</text>
    <rect x="470" y="458" width="16" height="16" fill="#b8620f"/><text x="492" y="471">zebrafish</text>
  </g>
</svg>
