<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker></defs>
  <text x="480" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#15201e">Where along the chain does the readout sit?</text>
  <!-- chain -->
  <rect x="40" y="80" width="150" height="70" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="115" y="112" text-anchor="middle" font-size="17" font-weight="bold" fill="#0e6b66">perturb G</text><text x="115" y="134" text-anchor="middle" font-size="12" fill="#56655f">KO, RNAi, mutant</text>
  <rect x="250" y="80" width="190" height="70" rx="10" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/><text x="345" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#15201e">G's own activity</text><text x="345" y="132" text-anchor="middle" font-size="12" fill="#56655f">phosphotransfer, DNA binding</text>
  <rect x="500" y="80" width="190" height="70" rx="10" fill="#fdf1e4" stroke="#b8620f" stroke-width="2"/><text x="595" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#15201e">hub state</text><text x="595" y="132" text-anchor="middle" font-size="12" fill="#56655f">ROS, caspase, UPR, ΔΨm</text>
  <rect x="750" y="80" width="170" height="70" rx="10" fill="#fdf1e4" stroke="#b8620f" stroke-width="2"/><text x="835" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#15201e">cell phenotype</text><text x="835" y="132" text-anchor="middle" font-size="12" fill="#56655f">viability, migration</text>
  <g stroke="#56655f" stroke-width="2.5" marker-end="url(#a)"><line x1="190" y1="115" x2="248" y2="115"/><line x1="440" y1="115" x2="498" y2="115"/><line x1="690" y1="115" x2="748" y2="115"/></g>
  <!-- other inputs converging on hub -->
  <g stroke="#8fa39c" stroke-width="2" marker-end="url(#a)"><line x1="530" y1="200" x2="570" y2="152"/><line x1="595" y1="210" x2="595" y2="152"/><line x1="660" y1="200" x2="620" y2="152"/></g>
  <text x="595" y="232" text-anchor="middle" font-size="13" fill="#56655f">many unrelated inputs feed the same hub</text>
  <!-- molecular assay label -->
  <rect x="250" y="270" width="190" height="130" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="345" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#0e6b66">molecular readout</text>
  <text x="345" y="322" text-anchor="middle" font-size="13" fill="#15201e">kinase assay, ChIP/EMSA,</text>
  <text x="345" y="340" text-anchor="middle" font-size="13" fill="#15201e">GTPase, electrophysiology</text>
  <text x="345" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d8a4b">licenses MF, can be core</text>
  <line x1="345" y1="270" x2="345" y2="152" stroke="#0e6b66" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="560" y="270" width="330" height="130" rx="10" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
  <text x="725" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#b8620f">phenotypic hub readout</text>
  <text x="725" y="322" text-anchor="middle" font-size="13" fill="#15201e">CellROX, caspase-3/7, 5×UPRE,</text>
  <text x="725" y="340" text-anchor="middle" font-size="13" fill="#15201e">TMRM, MTT, scratch assay</text>
  <text x="725" y="372" text-anchor="middle" font-size="14" font-weight="bold" fill="#7657a3">at most BP/CC, default non-core</text>
  <line x1="725" y1="270" x2="725" y2="240" stroke="#b8620f" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="480" y="448" text-anchor="middle" font-size="15" fill="#15201e">Exception: a transcriptional reporter can support MF for a bona fide DNA-binding TF.</text>
  <text x="480" y="474" text-anchor="middle" font-size="15" fill="#15201e">Promote a hub-supported process to core only if G is in the process's machinery or it is G's signature output.</text>
</svg>
