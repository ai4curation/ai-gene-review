<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15201e"/></marker>
    <marker id="bar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5,0 L5,10" stroke="#bd3a30" stroke-width="3"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="30" font-size="18" font-weight="bold" fill="#15201e">Twenty genes, five mechanisms that set yeast replicative lifespan</text>

  <!-- Panel 1: NAD+ / sirtuins -->
  <rect x="20" y="50" width="300" height="200" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="34" y="74" font-size="14" font-weight="bold" fill="#0e6b66">1 · NAD+ and sirtuin silencing</text>
  <rect x="36" y="92" width="96" height="34" rx="6" fill="#ffffff" stroke="#0e6b66"/>
  <text x="84" y="114" font-size="13" text-anchor="middle" fill="#15201e">PNC1</text>
  <text x="84" y="142" font-size="11" text-anchor="middle" fill="#56655f">nicotinamide → NA</text>
  <line x1="132" y1="109" x2="178" y2="109" stroke="#15201e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="155" y="100" font-size="10" text-anchor="middle" fill="#56655f">NAD+</text>
  <rect x="180" y="92" width="124" height="34" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="242" y="114" font-size="13" font-weight="bold" text-anchor="middle" fill="#15201e">SIR2</text>
  <text x="242" y="142" font-size="11" text-anchor="middle" fill="#56655f">NAD-dependent deacetylase</text>
  <rect x="180" y="156" width="58" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="209" y="176" font-size="12" text-anchor="middle" fill="#15201e">SIR3</text>
  <rect x="246" y="156" width="58" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="275" y="176" font-size="12" text-anchor="middle" fill="#15201e">SIR4</text>
  <text x="242" y="206" font-size="11" text-anchor="middle" fill="#56655f">SIR complex: silent chromatin</text>
  <rect x="36" y="170" width="44" height="28" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="58" y="189" font-size="11" text-anchor="middle" fill="#15201e">HST2</text>
  <rect x="86" y="170" width="44" height="28" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="108" y="189" font-size="11" text-anchor="middle" fill="#15201e">HST3</text>
  <text x="84" y="216" font-size="11" text-anchor="middle" fill="#56655f">other sirtuins</text>
  <text x="84" y="230" font-size="11" text-anchor="middle" fill="#56655f">(HST3: H3K56ac)</text>

  <!-- Panel 2: nutrient signalling -->
  <rect x="330" y="50" width="300" height="200" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="344" y="74" font-size="14" font-weight="bold" fill="#0e6b66">2 · Nutrient signalling</text>
  <rect x="346" y="92" width="80" height="32" rx="6" fill="#ffffff" stroke="#0e6b66"/>
  <text x="386" y="113" font-size="13" text-anchor="middle" fill="#15201e">RAS2</text>
  <line x1="426" y1="108" x2="462" y2="108" stroke="#15201e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="508" y="113" font-size="12" text-anchor="middle" fill="#15201e">cAMP / PKA</text>
  <rect x="346" y="176" width="80" height="32" rx="6" fill="#ffffff" stroke="#0e6b66"/>
  <text x="386" y="197" font-size="13" text-anchor="middle" fill="#15201e">TOR1</text>
  <rect x="520" y="140" width="92" height="34" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="566" y="162" font-size="13" font-weight="bold" text-anchor="middle" fill="#15201e">RIM15</text>
  <line x1="530" y1="118" x2="552" y2="138" stroke="#bd3a30" stroke-width="1.8" marker-end="url(#bar)"/>
  <line x1="426" y1="188" x2="516" y2="164" stroke="#bd3a30" stroke-width="1.8" marker-end="url(#bar)"/>
  <line x1="566" y1="174" x2="566" y2="204" stroke="#15201e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="566" y="222" font-size="12" text-anchor="middle" fill="#15201e">G1 → G0 (quiescence)</text>
  <text x="386" y="232" font-size="11" text-anchor="middle" fill="#56655f">TORC1 kinase</text>

  <!-- Panel 3: respiration / ROS -->
  <rect x="640" y="50" width="300" height="200" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="654" y="74" font-size="14" font-weight="bold" fill="#0e6b66">3 · Respiration and ROS</text>
  <rect x="656" y="92" width="80" height="32" rx="6" fill="#ffffff" stroke="#0e6b66"/>
  <text x="696" y="113" font-size="13" text-anchor="middle" fill="#15201e">HAP4</text>
  <text x="696" y="140" font-size="11" text-anchor="middle" fill="#56655f">activation domain for the</text>
  <text x="696" y="153" font-size="11" text-anchor="middle" fill="#56655f">DNA-bound HAP2/3/5 complex</text>
  <line x1="736" y1="108" x2="780" y2="108" stroke="#15201e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="840" y="104" font-size="11" text-anchor="middle" fill="#56655f">respiratory genes</text>
  <rect x="782" y="112" width="116" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="840" y="132" font-size="12" text-anchor="middle" fill="#15201e">CYC1 cyt c</text>
  <rect x="656" y="176" width="120" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="716" y="196" font-size="12" text-anchor="middle" fill="#15201e">SOD2 Mn-SOD</text>
  <rect x="782" y="176" width="140" height="30" rx="6" fill="#ffffff" stroke="#b8620f"/>
  <text x="852" y="196" font-size="12" text-anchor="middle" fill="#15201e">CAT2</text>
  <text x="852" y="222" font-size="11" text-anchor="middle" fill="#b8620f">carnitine acetyltransferase,</text>
  <text x="852" y="236" font-size="11" text-anchor="middle" fill="#b8620f">not a catalase</text>

  <!-- Panel 4: mRNA and translation -->
  <rect x="20" y="270" width="460" height="200" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="34" y="294" font-size="14" font-weight="bold" fill="#0e6b66">4 · mRNA fate and translation</text>
  <rect x="40" y="316" width="176" height="130" rx="40" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="5 4"/>
  <text x="128" y="336" font-size="11" text-anchor="middle" fill="#56655f">nucleus</text>
  <rect x="190" y="340" width="52" height="34" rx="6" fill="#dcefec" stroke="#0e6b66"/>
  <text x="216" y="362" font-size="12" text-anchor="middle" fill="#15201e">DBP5</text>
  <text x="216" y="390" font-size="10" text-anchor="middle" fill="#56655f">mRNA export</text>
  <text x="216" y="402" font-size="10" text-anchor="middle" fill="#56655f">at the NPC</text>
  <rect x="70" y="400" width="80" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="110" y="420" font-size="12" text-anchor="middle" fill="#15201e">NMD3</text>
  <line x1="150" y1="415" x2="262" y2="430" stroke="#15201e" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="272" y="440" font-size="11" fill="#56655f">60S subunit export</text>
  <rect x="300" y="316" width="80" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="340" y="336" font-size="12" text-anchor="middle" fill="#15201e">LSM1</text>
  <text x="392" y="336" font-size="11" fill="#56655f">decapping, P-bodies</text>
  <rect x="300" y="372" width="80" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="340" y="392" font-size="12" text-anchor="middle" fill="#15201e">SUI2</text>
  <text x="392" y="392" font-size="11" fill="#56655f">eIF2α,</text>
  <text x="392" y="405" font-size="11" fill="#56655f">initiation</text>
  <line x1="242" y1="357" x2="298" y2="334" stroke="#15201e" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Panel 5: proteostasis / polarity -->
  <rect x="500" y="270" width="440" height="200" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="514" y="294" font-size="14" font-weight="bold" fill="#0e6b66">5 · Proteostasis and asymmetric division</text>
  <rect x="520" y="316" width="84" height="32" rx="6" fill="#ffffff" stroke="#0e6b66"/>
  <text x="562" y="337" font-size="12" text-anchor="middle" fill="#15201e">ATG7 (E1)</text>
  <line x1="604" y1="332" x2="646" y2="332" stroke="#15201e" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="652" y="328" font-size="11" fill="#15201e">ATG12, ATG8 activation</text>
  <text x="652" y="342" font-size="11" fill="#56655f">(ATG3 does the lipidation)</text>
  <rect x="520" y="366" width="84" height="32" rx="6" fill="#ffffff" stroke="#0e6b66"/>
  <text x="562" y="387" font-size="12" text-anchor="middle" fill="#15201e">UBP3</text>
  <text x="614" y="387" font-size="11" fill="#56655f">deubiquitinase; ribophagy</text>
  <rect x="520" y="416" width="84" height="32" rx="6" fill="#ffffff" stroke="#0e6b66"/>
  <text x="562" y="437" font-size="12" text-anchor="middle" fill="#15201e">SPA2</text>
  <text x="614" y="437" font-size="11" fill="#56655f">polarisome scaffold at the bud tip</text>
  <line x1="386" y1="208" x2="386" y2="248" stroke="#bd3a30" stroke-width="1.6"/>
  <path d="M386,248 C386,300 470,300 516,330" fill="none" stroke="#bd3a30" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#bar)"/>
  <text x="452" y="262" font-size="10" fill="#bd3a30">TORC1 ⊣ autophagy</text>

  <text x="24" y="500" font-size="11" fill="#56655f">Arrows: activates or produces. Red bars: inhibits. Labels follow the gene reviews' core functions; drawn by hand, not to scale.</text>
</svg>
