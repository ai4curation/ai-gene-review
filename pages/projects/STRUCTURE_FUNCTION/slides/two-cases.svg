<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#15201e">Same question, opposite answers: does structure add anything?</text>
  <!-- column headers -->
  <text x="195" y="78" text-anchor="middle" font-size="15" fill="#56655f">method</text>
  <text x="480" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#15201e">lanmodulin (lanM, C5B164)</text>
  <text x="480" y="90" text-anchor="middle" font-size="13" fill="#56655f">133 aa, EF-hand ×3; tool outputs are expected, not run</text>
  <text x="780" y="70" text-anchor="middle" font-size="18" font-weight="bold" fill="#15201e">DUF4246 (A0A2N3VF44)</text>
  <text x="780" y="90" text-anchor="middle" font-size="13" fill="#56655f">496 aa, Nocardia fluminea</text>
  <g font-size="15">
    <!-- rows -->
    <text x="60" y="140" font-weight="bold" fill="#15201e">HMM / InterPro</text>
    <rect x="340" y="116" width="280" height="38" rx="8" fill="#fdf1e4" stroke="#b8620f"/><text x="480" y="141" text-anchor="middle" fill="#15201e">"calcium ion binding"</text>
    <rect x="650" y="116" width="260" height="38" rx="8" fill="#f1f5f4" stroke="#8fa39c"/><text x="780" y="141" text-anchor="middle" fill="#56655f">"unknown function"</text>
    <text x="60" y="200" font-weight="bold" fill="#15201e">AlphaFold + Foldseek</text>
    <rect x="340" y="176" width="280" height="38" rx="8" fill="#fdf1e4" stroke="#b8620f"/><text x="480" y="201" text-anchor="middle" fill="#15201e">expected: EF-hand, like calmodulin</text>
    <rect x="650" y="176" width="260" height="38" rx="8" fill="#e6f4ea" stroke="#1d8a4b" stroke-width="2"/><text x="780" y="201" text-anchor="middle" font-weight="bold" fill="#1d8a4b">2OG-Fe(II) oxygenase</text>
    <text x="60" y="260" font-weight="bold" fill="#15201e">ML GO predictors</text>
    <rect x="340" y="236" width="280" height="38" rx="8" fill="#fdf1e4" stroke="#b8620f"/><text x="480" y="261" text-anchor="middle" fill="#15201e">expected: "calcium ion binding"</text>
    <rect x="650" y="236" width="260" height="38" rx="8" fill="#f1f5f4" stroke="#8fa39c"/><text x="780" y="261" text-anchor="middle" fill="#56655f">not run</text>
    <text x="60" y="320" font-weight="bold" fill="#15201e">What resolves it</text>
    <rect x="340" y="296" width="280" height="56" rx="8" fill="#e8f1ee" stroke="#0e6b66"/><text x="480" y="319" text-anchor="middle" fill="#15201e">Ln-bound crystal + NMR,</text><text x="480" y="339" text-anchor="middle" fill="#15201e">Pro→Ala mutagenesis</text>
    <rect x="650" y="296" width="260" height="56" rx="8" fill="#e8f1ee" stroke="#0e6b66"/><text x="780" y="319" text-anchor="middle" fill="#15201e">all top-20 PDB hits agree;</text><text x="780" y="339" text-anchor="middle" fill="#15201e">matches Holm 2023 (6N1F)</text>
  </g>
  <!-- why -->
  <rect x="340" y="378" width="280" height="96" rx="10" fill="#fbeeec"/>
  <text x="480" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#bd3a30">structure adds nothing</text>
  <text x="480" y="426" text-anchor="middle" font-size="13" fill="#15201e">same fold; the difference is loop</text>
  <text x="480" y="444" text-anchor="middle" font-size="13" fill="#15201e">geometry from P36/P60/P85/P109</text>
  <text x="480" y="462" text-anchor="middle" font-size="13" fill="#15201e">that no tool models</text>
  <rect x="650" y="378" width="260" height="96" rx="10" fill="#e6f4ea"/>
  <text x="780" y="404" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d8a4b">structure is the only signal</text>
  <text x="780" y="426" text-anchor="middle" font-size="13" fill="#15201e">8–15% identity to the hits;</text>
  <text x="780" y="444" text-anchor="middle" font-size="13" fill="#15201e">BLAST and HMMs find only</text>
  <text x="780" y="462" text-anchor="middle" font-size="13" fill="#15201e">other DUF4246 proteins</text>
  <text x="480" y="504" text-anchor="middle" font-size="13" fill="#56655f">The Foldseek run was done interactively and not saved to the repository.</text>
</svg>
