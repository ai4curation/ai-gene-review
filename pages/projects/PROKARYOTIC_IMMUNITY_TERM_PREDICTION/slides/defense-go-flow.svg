<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#56655f"/></marker></defs>
<text x="30" y="34" font-size="19" font-weight="bold" fill="#0e6b66">The translation layer: family call in, GO policy out</text>
<rect x="30" y="170" width="180" height="110" rx="8" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="6 4"/>
<text x="120" y="200" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">Defense predictor</text>
<text x="120" y="222" font-size="12" text-anchor="middle" fill="#56655f">emits a family label</text>
<text x="120" y="240" font-size="12" text-anchor="middle" fill="#56655f">+ confidence</text>
<text x="120" y="266" font-size="11" text-anchor="middle" fill="#b8620f">not wired in yet</text>
<text x="120" y="310" font-size="12" text-anchor="middle" fill="#56655f">"CRISPR/Cas", "R-M",</text>
<text x="120" y="327" font-size="12" text-anchor="middle" fill="#56655f">"Abi", "thsA/thsB system"</text>
<line x1="212" y1="225" x2="266" y2="225" stroke="#56655f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<rect x="270" y="110" width="250" height="230" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="395" y="140" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">defense_go registry</text>
<text x="395" y="158" font-size="11" text-anchor="middle" fill="#56655f">src/ai_gene_review/defense_go/</text>
<g font-size="13" fill="#15201e">
<text x="290" y="192">1. resolve alias</text><text x="310" y="210" font-size="11" fill="#56655f">"CRISPR/Cas" → CRISPR-Cas</text>
<text x="290" y="238">2. assign stable ID</text><text x="310" y="256" font-size="11" fill="#56655f">DEFENSE_FAMILY:CRISPR_CAS</text>
<text x="290" y="284">3. look up GO policy</text><text x="310" y="302" font-size="11" fill="#56655f">automatic, or review-only + notes</text>
</g>
<text x="395" y="330" font-size="11" text-anchor="middle" fill="#0e6b66">5 families · 5 tests · alias conflicts rejected</text>
<line x1="522" y1="180" x2="596" y2="140" stroke="#56655f" stroke-width="2" marker-end="url(#a)"/>
<line x1="522" y1="280" x2="596" y2="320" stroke="#56655f" stroke-width="2" marker-end="url(#a)"/>
<rect x="600" y="80" width="330" height="120" rx="8" fill="#ffffff" stroke="#1d8a4b" stroke-width="2.5"/>
<text x="616" y="106" font-size="14" font-weight="bold" fill="#1d8a4b">Automatic suggestion</text>
<text x="616" y="130" font-size="13" fill="#15201e">CRISPR-Cas → GO:0099048</text>
<text x="630" y="147" font-size="11" fill="#56655f">CRISPR-cas system</text>
<text x="616" y="170" font-size="13" fill="#15201e">Restriction-modification → GO:0009307</text>
<text x="630" y="187" font-size="11" fill="#56655f">DNA restriction-modification system</text>
<rect x="600" y="260" width="330" height="120" rx="8" fill="#ffffff" stroke="#b8620f" stroke-width="2.5"/>
<text x="616" y="286" font-size="14" font-weight="bold" fill="#b8620f">Review-only (no GO term)</text>
<text x="616" y="310" font-size="13" fill="#15201e">Abortive infection, CBASS, Thoeris</text>
<text x="616" y="332" font-size="11" fill="#56655f">family too mechanistically broad; curator must</text>
<text x="616" y="348" font-size="11" fill="#56655f">review the specific effector and mechanism</text>
<text x="616" y="368" font-size="11" fill="#56655f">shown with notes, never silently dropped</text>
<rect x="600" y="420" width="330" height="60" rx="8" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="6 4"/>
<text x="765" y="446" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">PredictionReview YAML export</text>
<text x="765" y="466" font-size="11" text-anchor="middle" fill="#b8620f">deferred</text>
<line x1="765" y1="200" x2="765" y2="256" stroke="#8fa39c" stroke-width="1.5"/>
<line x1="765" y1="382" x2="765" y2="416" stroke="#8fa39c" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#a)"/>
<text x="30" y="470" font-size="12" fill="#56655f">Solid: built (April 2026). Dashed: planned.</text>
<text x="30" y="488" font-size="12" fill="#56655f">Family-level calls never imply a specific Cas, methyltransferase or endonuclease activity.</text>
</svg>
