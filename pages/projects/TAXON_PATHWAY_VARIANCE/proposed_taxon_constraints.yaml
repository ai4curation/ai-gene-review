# Proposed GO taxon constraints, collected by the Taxon Pathway Variance project.
# One entry per (term, constraint, taxon). Every GO and NCBITaxon id is verified
# (OLS / QuickGO / NCBITaxon), never written from memory.
#
# Fields:
#   go_term:                 {id, label}
#   constraint:              never_in_taxon | only_in_taxon
#   taxon:                   {id, label}
#   existing_go_constraint:  what GO already asserts on the term or its ancestors, or null
#   evidence:                list of {reference_id, supporting_text} (verbatim quotes)
#   blocks:                  annotations the constraint would remove (gene, term, evidence, source node)
#   would_wrongly_block:     members of the taxon that do have the presupposed component, or []
#   prerequisites:           ontology changes needed before the constraint can be applied:
#                            {kind, term, change, reason, status: NOT_REQUESTED | REQUESTED | DONE}
#   status:                  PROPOSED | SUBMITTED | ACCEPTED | REJECTED
#   source:                  where in this repo the case was found
proposals:
- id: TPV-001
  go_term:
    id: GO:0007259
    label: cell surface receptor signaling pathway via JAK-STAT
  constraint: never_in_taxon
  taxon:
    id: NCBITaxon:6231
    label: Nematoda
  conservative_alternative:
    taxon:
      id: NCBITaxon:6237
      label: Caenorhabditis
    rationale: The direct statement of JAK absence is for C. elegans. PANTHER's JAK family
      (PTHR45807) has no nematode leaf and the profile matches only five nematode fragments,
      and has no member in C. briggsae or Pristionchus pacificus, so the phylum-wide claim
      is an inference from genome coverage, not a statement for every nematode.
  existing_go_constraint: null
  evidence:
  - reference_id: PMID:28874466
    supporting_text: There is no conserved homolog of the JAK kinases in C. elegans
  blocks:
  - gene: sta-1
    protein: UniProtKB:Q9NAD6
    organism: Caenorhabditis elegans
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - gene: sta-2
    protein: UniProtKB:Q20977
    organism: Caenorhabditis elegans
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - gene: T12G3.2
    protein: UniProtKB:D3YT30
    organism: Caenorhabditis elegans
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - gene: sta-1
    protein: UniProtKB:Q61AP6
    organism: Caenorhabditis briggsae
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - gene: sta-2
    protein: UniProtKB:B0K0A6
    organism: Caenorhabditis briggsae
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - protein: UniProtKB:A8X0M7
    organism: Caenorhabditis briggsae
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - protein: UniProtKB:A0A2A6BZA0
    organism: Pristionchus pacificus
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - protein: UniProtKB:A0A2A6CKG1
    organism: Pristionchus pacificus
    evidence: IBA
    source_node: PANTHER:PTN000927860
  - protein: UniProtKB:A0A914YCL6
    organism: Panagrolaimus sp.
    evidence: IEA (TreeGrafter)
    source_node: PANTHER:PTN001562978
    note: 203-aa Ser/Thr kinase fragment misplaced into the JAK family
  would_wrongly_block: []
  in_repo_agreement:
  - genes/worm/sta-1/sta-1-ai-review.yaml (REMOVE)
  - genes/worm/sta-2/sta-2-ai-review.yaml (REMOVE)
  - interpro/panther/PTHR11801/PTHR11801-review.yaml (GO:0007259 SUBFAMILY_ONLY, nematode
    subfamilies excluded; PTN000927860 TOO_DEEP)
  - interpro/panther/PTHR45807/PTHR45807-review.yaml (member exception for A0A914YCL6)
  status: PROPOSED
  source: modules/c_elegans_jak_independent_stat_signaling.yaml
