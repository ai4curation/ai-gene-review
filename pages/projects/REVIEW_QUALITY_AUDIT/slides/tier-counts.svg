<text x="180" y="410" font-size="13" fill="#56655f">reason-only; many large hubs and repeated-term reviews</text>
<text x="24" y="500" font-size="14" fill="#15201e">The large hub genes carry the most annotations, which is where templating saves the most effort and does the most harm.</text>
