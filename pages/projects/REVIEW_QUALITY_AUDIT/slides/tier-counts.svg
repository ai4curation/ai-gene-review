<text x="244" y="131" font-size="15" font-weight="bold" fill="#15201e">4</text>
<text x="110" y="156" font-size="12" fill="#56655f">now</text>
<text x="188" y="159" font-size="15" font-weight="bold" fill="#1d8a4b">0</text>
<text x="180" y="186" font-size="13" fill="#56655f">mouse Egfr, Grb2, Cbl, Egf: re-reviewed</text>
<text x="24" y="244" font-size="17" font-weight="bold" fill="#15201e">Tier 2</text>
<text x="110" y="240" font-size="12" fill="#56655f">first run</text>
<rect x="180" y="226" width="182" height="22" rx="3" fill="#b8620f"/>
<text x="370" y="243" font-size="15" font-weight="bold" fill="#15201e">13</text>
<text x="110" y="268" font-size="12" fill="#56655f">now</text>
<rect x="180" y="254" width="56" height="22" rx="3" fill="#b8620f" opacity="0.55"/>
<text x="244" y="271" font-size="15" font-weight="bold" fill="#15201e">4</text>
<text x="180" y="298" font-size="13" fill="#56655f">original 13 are re-reviewed; 4 live hits need detector tuning (#4010)</text>
<text x="24" y="356" font-size="17" font-weight="bold" fill="#15201e">Tier 3</text>
<text x="110" y="352" font-size="12" fill="#56655f">first run</text>
<rect x="180" y="338" width="476" height="22" rx="3" fill="#8fa39c"/>
