<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56655f"/></marker></defs>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">scan_boilerplate.py: three questions per review file</text>
  <!-- start -->
  <rect x="24" y="64" width="200" height="60" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="124" y="90" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">each *-ai-review.yaml</text>
  <text x="124" y="110" font-size="12" text-anchor="middle" fill="#56655f">all reviewed annotations</text>
  <path d="M224 94 L 262 94" stroke="#56655f" stroke-width="2" marker-end="url(#ar)"/>
  <!-- Q1 -->
  <rect x="266" y="60" width="330" height="68" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="280" y="86" font-size="14" font-weight="bold" fill="#0e6b66">Q1 · placeholder supporting_text</text>
  <text x="280" y="108" font-size="13" fill="#15201e">on 3 or more annotations?</text>
  <path d="M596 94 L 640 94" stroke="#bd3a30" stroke-width="2" marker-end="url(#ar)"/><text x="604" y="86" font-size="12" fill="#bd3a30">yes</text>
  <rect x="644" y="60" width="292" height="68" rx="10" fill="#fbe4e1" stroke="#bd3a30"/>
  <text x="658" y="86" font-size="15" font-weight="bold" fill="#bd3a30">Tier 1 · critical</text>
  <text x="658" y="108" font-size="13" fill="#15201e">evidence is fake: re-review fully</text>
  <path d="M431 128 L 431 166" stroke="#56655f" stroke-width="2" marker-end="url(#ar)"/><text x="440" y="152" font-size="12" fill="#56655f">no</text>
  <!-- Q2 -->
  <rect x="266" y="170" width="330" height="68" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="280" y="196" font-size="14" font-weight="bold" fill="#0e6b66">Q2 · unique summaries ≤ 15%</text>
  <text x="280" y="218" font-size="13" fill="#15201e">and unique reasons ≤ 15%?</text>
  <path d="M596 204 L 640 204" stroke="#b8620f" stroke-width="2" marker-end="url(#ar)"/><text x="604" y="196" font-size="12" fill="#b8620f">yes</text>
  <rect x="644" y="170" width="292" height="68" rx="10" fill="#fdf0e2" stroke="#b8620f"/>
  <text x="658" y="196" font-size="15" font-weight="bold" fill="#b8620f">Tier 2 · candidate rework</text>
  <text x="658" y="218" font-size="13" fill="#15201e">inspect for duplicate-row artifacts</text>
  <path d="M431 238 L 431 276" stroke="#56655f" stroke-width="2" marker-end="url(#ar)"/><text x="440" y="262" font-size="12" fill="#56655f">no</text>
  <!-- Q3 -->
  <rect x="266" y="280" width="330" height="68" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="280" y="306" font-size="14" font-weight="bold" fill="#0e6b66">Q3 · unique reasons ≤ 15%,</text>
  <text x="280" y="328" font-size="13" fill="#15201e">summaries term-specific?</text>
  <path d="M596 314 L 640 314" stroke="#56655f" stroke-width="2" marker-end="url(#ar)"/><text x="604" y="306" font-size="12" fill="#56655f">yes</text>
  <rect x="644" y="280" width="292" height="68" rx="10" fill="#f4f7f6" stroke="#8fa39c"/>
  <text x="658" y="306" font-size="15" font-weight="bold" fill="#56655f">Tier 3 · low severity</text>
  <text x="658" y="328" font-size="13" fill="#15201e">only the one-line reason is lazy</text>
  <!-- example -->
  <rect x="24" y="376" width="912" height="126" rx="10" fill="#dcefec"/>
  <text x="44" y="404" font-size="15" font-weight="bold" fill="#0e6b66">The Tier 1 signature, found first on mouse Fyn (247 annotations)</text>
  <text x="44" y="430" font-size="13" fill="#15201e">reason, repeated:  "Supported secondary or context-specific role" · "Directly supported core function, process, or location"</text>
  <text x="44" y="454" font-size="13" fill="#15201e">supporting_text on every row:  "… deep research report reviewed for GO term specificity, core-function context,</text>
  <text x="44" y="472" font-size="13" fill="#15201e">and evidence synthesis."  plus the same UniProt FUNCTION block regardless of the term.</text>
  <text x="44" y="494" font-size="12" fill="#56655f">Fyn also carried contradictory REMOVE and ACCEPT pairs on the same core terms.</text>
</svg>
