<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d68b3"/></marker>
  </defs>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#15201e">One word, two cells</text>
  <line x1="480" y1="60" x2="480" y2="330" stroke="#8fa39c" stroke-dasharray="5 4"/>
  <!-- fly -->
  <text x="240" y="70" font-size="17" text-anchor="middle" font-weight="bold" fill="#15201e">Fly / protostome neuroblast</text>
  <text x="240" y="90" font-size="13" text-anchor="middle" fill="#56655f">mitotic, self-renewing neural stem cell</text>
  <circle cx="120" cy="190" r="42" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="120" y="195" font-size="15" text-anchor="middle" fill="#15201e">NB</text>
  <path d="M120,148 C120,110 175,110 170,150" fill="none" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="150" y="118" font-size="12" fill="#0e6b66">self-renews</text>
  <line x1="164" y1="190" x2="250" y2="190" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="206" y="180" font-size="12" text-anchor="middle" fill="#0e6b66">asymmetric</text>
  <circle cx="280" cy="190" r="26" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/><text x="280" y="195" font-size="13" text-anchor="middle" fill="#15201e">GMC</text>
  <line x1="308" y1="190" x2="360" y2="190" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="385" cy="170" r="16" fill="#ffffff" stroke="#8fa39c"/><circle cx="385" cy="212" r="16" fill="#ffffff" stroke="#8fa39c"/>
  <text x="385" y="250" font-size="12" text-anchor="middle" fill="#56655f">neurons</text>
  <text x="240" y="290" font-size="14" text-anchor="middle" fill="#15201e">GO neuroblast division terms fit here</text>
  <text x="240" y="310" font-size="13" text-anchor="middle" fill="#56655f">e.g. insc, GO:0055059: ACCEPT</text>
  <!-- vertebrate -->
  <text x="720" y="70" font-size="17" text-anchor="middle" font-weight="bold" fill="#15201e">Vertebrate neuroblast</text>
  <text x="720" y="90" font-size="13" text-anchor="middle" fill="#56655f">postmitotic, migrates, then differentiates</text>
  <circle cx="560" cy="190" r="36" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="560" y="186" font-size="12" text-anchor="middle" fill="#15201e">neural</text><text x="560" y="201" font-size="12" text-anchor="middle" fill="#15201e">precursor</text>
  <path d="M560,154 C560,118 610,118 606,160" fill="none" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="590" y="122" font-size="12" fill="#0e6b66">proliferates</text>
  <line x1="598" y1="190" x2="660" y2="190" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <circle cx="690" cy="190" r="26" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/><text x="690" y="195" font-size="13" text-anchor="middle" fill="#15201e">NB</text>
  <text x="690" y="236" font-size="12" text-anchor="middle" fill="#bd3a30">no division</text>
  <line x1="718" y1="190" x2="790" y2="190" stroke="#8fa39c" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="754" y="180" font-size="12" text-anchor="middle" fill="#56655f">migrates</text>
  <circle cx="820" cy="190" r="22" fill="#ffffff" stroke="#8fa39c"/><text x="820" y="236" font-size="12" text-anchor="middle" fill="#56655f">neuron</text>
  <text x="720" y="290" font-size="14" text-anchor="middle" fill="#15201e">The dividing cell is the neural precursor</text>
  <text x="720" y="310" font-size="13" text-anchor="middle" fill="#56655f">GO:0061351 neural precursor cell proliferation</text>
  <!-- mapping -->
  <rect x="30" y="345" width="900" height="150" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="50" y="372" font-size="15" font-weight="bold" fill="#15201e">Proposed per-row rule for the 42 vertebrate annotations</text>
  <rect x="50" y="390" width="330" height="88" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="62" y="412" font-size="13" fill="#15201e">GO:0007405 neuroblast proliferation (26)</text>
  <text x="62" y="430" font-size="13" fill="#15201e">GO:0055059 asymmetric NB division (4)</text>
  <text x="62" y="448" font-size="13" fill="#15201e">GO:0021849 / 0021847 SVZ, VZ NB division (8)</text>
  <text x="62" y="466" font-size="13" fill="#15201e">GO:0045200, GO:0021873 (4)</text>
  <line x1="384" y1="434" x2="470" y2="434" stroke="#1d68b3" stroke-width="3" marker-end="url(#r)"/>
  <rect x="476" y="390" width="140" height="40" rx="6" fill="#b8620f"/><text x="546" y="415" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">MODIFY</text>
  <text x="630" y="408" font-size="13" fill="#15201e">→ GO:0061351 or a VZ/SVZ/forebrain</text>
  <text x="630" y="424" font-size="13" fill="#15201e">neural-precursor child, per cited paper</text>
  <rect x="476" y="440" width="140" height="36" rx="6" fill="#bd3a30"/><text x="546" y="463" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">REMOVE</text>
  <text x="630" y="463" font-size="13" fill="#15201e">if the paper supports no proliferation claim</text>
</svg>
