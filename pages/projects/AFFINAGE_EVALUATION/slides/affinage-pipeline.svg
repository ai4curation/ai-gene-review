<text x="515" y="112" font-size="12" text-anchor="middle" fill="#56655f">"current model" +</text>
<text x="515" y="128" font-size="12" text-anchor="middle" fill="#56655f">year-by-year history</text>
<line x1="600" y1="90" x2="668" y2="72" stroke="#56655f" stroke-width="2" marker-end="url(#a)"/>
