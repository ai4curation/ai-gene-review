<text x="730" y="484" font-size="12" text-anchor="middle" fill="#1d8a4b">FA cohort n=22; PAINT n=91</text>
<line x1="640" y1="470" x2="306" y2="424" stroke="#1d8a4b" stroke-width="2" marker-end="url(#a)"/>
