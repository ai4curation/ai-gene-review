  <text x="46" y="246" font-size="13" fill="#56655f">NAS, PMID:27066478, on 8 TRAPP</text>
  <text x="46" y="264" font-size="13" fill="#56655f">subunits: TRAPPC1, 3, 4, 5, 8,</text>
  <text x="46" y="282" font-size="13" fill="#56655f">11, 12, 13</text>
  <path d="M292 238 L560 238" stroke="#b8620f" stroke-width="2.4" marker-end="url(#m)"/>
  <rect x="330" y="220" width="190" height="30" rx="6" fill="#ffffff"/>
