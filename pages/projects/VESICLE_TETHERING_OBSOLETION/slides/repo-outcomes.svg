  <text x="46" y="102" font-size="15" font-weight="600" fill="#15201e">GO:7770062 vesicle membrane tethering activity</text>
  <path d="M362 87 L560 87" stroke="#15201e" stroke-width="2" marker-end="url(#a)"/>
  <text x="461" y="78" text-anchor="middle" font-size="13" fill="#15201e" font-style="italic">part_of</text>
  <rect x="564" y="56" width="366" height="62" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.8"/>
