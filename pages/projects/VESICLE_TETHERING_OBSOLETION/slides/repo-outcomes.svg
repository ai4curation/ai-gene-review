  <rect x="564" y="378" width="366" height="84" rx="10" fill="#e3eefa" stroke="#1d68b3" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="580" y="404" font-size="15" font-weight="600" fill="#15201e">GO:7770062 tethering activity</text>
  <text x="580" y="426" font-size="14" fill="#15201e">NEW MF row and core MF; obsolete</text>
  <text x="580" y="446" font-size="14" fill="#15201e">row, core BP, new-term request removed</text>
