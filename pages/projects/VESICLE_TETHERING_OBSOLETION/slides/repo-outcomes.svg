  <text x="425" y="270" text-anchor="middle" font-size="12" fill="#56655f">"any TRAPP complex acts as a membrane</text>
  <text x="425" y="286" text-anchor="middle" font-size="12" fill="#56655f">tether is currently inconclusive"</text>
  <rect x="564" y="206" width="366" height="64" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.8"/>
  <text x="580" y="232" font-size="15" font-weight="600" fill="#15201e">GO:0006888 endoplasmic reticulum to</text>
  <text x="580" y="252" font-size="15" font-weight="600" fill="#15201e">Golgi vesicle-mediated transport</text>
  <!-- TMF1 lane -->
  <text x="30" y="344" font-size="15" font-weight="600" fill="#15201e">Fixed in #3237 (merged)</text>
  <rect x="30" y="356" width="260" height="130" rx="10" fill="#fbeceb" stroke="#bd3a30" stroke-width="1.6" stroke-dasharray="7 5"/>
  <text x="46" y="378" font-size="12" font-weight="600" fill="#bd3a30">OBSOLETE · BP</text>
  <text x="46" y="400" font-size="15" font-weight="600" fill="#15201e">GO:0099041 vesicle</text>
  <text x="46" y="419" font-size="15" font-weight="600" fill="#15201e">tethering to Golgi</text>
  <text x="46" y="442" font-size="13" fill="#56655f">TMF1: NEW row (NAS) and</text>
  <text x="46" y="460" font-size="13" fill="#56655f">core_functions; MF stand-in</text>
  <text x="46" y="478" font-size="13" fill="#56655f">GO:0060090 molecular adaptor</text>
  <path d="M292 420 L560 420" stroke="#8fa39c" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#a)"/>
