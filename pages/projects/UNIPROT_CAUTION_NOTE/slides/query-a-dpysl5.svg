<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="32" y="40" font-size="23" font-weight="bold" fill="#15201e">Query A: a positive parent above a NOT-ed child</text>
  <text x="32" y="64" font-size="15" fill="#56655f">DPYSL5 (CRMP5), the case that defined the query, and what the query found when scaled</text>

  <!-- hierarchy -->
  <text x="40" y="100" font-size="13" font-weight="bold" fill="#56655f">GO molecular function (is_a, general → specific)</text>
  <rect x="40" y="112" width="400" height="58" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="56" y="136" font-size="14" font-weight="bold" fill="#15201e">GO:0016787 hydrolase activity</text>
  <text x="56" y="157" font-size="12" fill="#bd3a30">positive · IEA (InterPro) → REMOVE</text>

  <rect x="40" y="196" width="400" height="58" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="56" y="220" font-size="14" font-weight="bold" fill="#15201e">GO:0016810 … carbon-nitrogen (non-peptide) bonds</text>
  <text x="56" y="241" font-size="12" fill="#bd3a30">positive · IEA (InterPro) → REMOVE</text>

  <rect x="40" y="280" width="400" height="50" rx="8" fill="#f4f7f6" stroke="#8fa39c" stroke-dasharray="4 3"/>
  <text x="56" y="310" font-size="13" fill="#56655f">GO:0016812 … in cyclic amides (not annotated)</text>

  <rect x="40" y="356" width="400" height="58" rx="8" fill="#e8f1ee" stroke="#1d8a4b" stroke-width="2"/>
  <text x="56" y="380" font-size="14" font-weight="bold" fill="#15201e">NOT GO:0004157 dihydropyrimidinase</text>
  <text x="56" y="401" font-size="12" fill="#1d8a4b">NOT · IBA → ACCEPT</text>

  <path d="M240,194 L240,172" stroke="#56655f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M240,278 L240,256" stroke="#56655f" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M240,354 L240,332" stroke="#56655f" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="40" y="432" width="400" height="66" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="56" y="456" font-size="13" fill="#15201e">The metal-site loss behind the NOT also removes the</text>
  <text x="56" y="474" font-size="13" fill="#15201e">basis for any metallo-hydrolase parent. NOT propagates</text>
  <text x="56" y="492" font-size="13" fill="#15201e">down, not up, so the parents survive unless removed.</text>

  <!-- funnel -->
  <text x="500" y="100" font-size="13" font-weight="bold" fill="#56655f">Query A scaled over reviewed UniProt (QuickGO MF)</text>
  <g font-size="14">
    <rect x="500" y="112" width="420" height="46" rx="6" fill="#dcefec"/>
    <text x="516" y="141" fill="#15201e"><tspan font-weight="bold">14,513</tspan> CAUTION accessions</text>
    <rect x="530" y="166" width="360" height="46" rx="6" fill="#dcefec"/>
    <text x="546" y="195" fill="#15201e"><tspan font-weight="bold">12,194</tspan> with MF annotations</text>
    <rect x="560" y="220" width="300" height="46" rx="6" fill="#bfe0da"/>
    <text x="576" y="249" fill="#15201e"><tspan font-weight="bold">247</tspan> parent/NOT-child pairs</text>
    <rect x="590" y="274" width="240" height="46" rx="6" fill="#0e6b66"/>
    <text x="606" y="303" fill="#ffffff"><tspan font-weight="bold">105</tspan> STRONG (100 net-new)</text>
    <rect x="620" y="328" width="180" height="46" rx="6" fill="#bd3a30"/>
    <text x="636" y="357" fill="#ffffff"><tspan font-weight="bold">8</tspan> human genes reviewed</text>
  </g>
  <text x="500" y="404" font-size="13" fill="#15201e">STRONG hits land on known pseudoenzymes:</text>
  <text x="500" y="424" font-size="13" fill="#15201e">CRMP family (DPYSL2/3/4, CRMP1), ILK, ROR1,</text>
  <text x="500" y="444" font-size="13" fill="#15201e">CASP12, AZIN2, and orthologs in other species.</text>
  <text x="500" y="474" font-size="12" fill="#56655f">Local check first: 8 of 11 STRONG flags matched the</text>
  <text x="500" y="492" font-size="12" fill="#56655f">action curators had already taken.</text>
</svg>
