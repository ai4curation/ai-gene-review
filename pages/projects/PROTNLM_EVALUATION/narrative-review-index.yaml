counting_unit: One gene/accession function-review record; categories indicate presence among its assessed
  narrative claims and may overlap.
excluded_claims: Separate GO/name/location predictions, hypothetical replacements, and statements explicitly
  marked not asserted are excluded. SUPPORTED means biological support without a COR/CNN/LSP novelty-specific
  judgment.
interpretation_notes:
  DROME/dati: The UNC mentioned in prose concerns the separate GO prediction, so it is not a narrative
    category.
  NEUCR/NCU04637: The CNN for generic endocytosis is explicitly not an emitted claim; only NPI is counted.
  NEUCR/NCU04302: The LSP mentioned in prose is the separate GO prediction; the narrative is PLI.
  SCHPO/rpa49: Independent-subunit polymerase activity is explicitly not asserted by the paragraph and
    is not counted.
  HORSE/HSPD1: The stated uncertainty about exact-model ATP-assisted folding is represented as UNC; conserved
    family chemistry alone does not establish activity of this input.
  HORSE/SIRT5: Uncertain and not established for horse are represented as UNC.
  HORSE/ALG5: The supported N-glycosylation interpretation substitutes Dol-P-Glc for the emitted Dol-P-Man;
    this alternative is not an additional supported emitted claim.
  rat/Ptk7: NPI applies to the fly visual-system claim; the separate adhesion/Plexin/axon-guidance claims
    remain UNC.
