<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="600" fill="#0e6b66">% of reviewed rows ACCEPTed, by evidence code</text>
  <rect x="620" y="24" width="14" height="14" fill="#8fa39c"/><text x="640" y="36" font-size="13" fill="#15201e">% ACCEPT</text>
  <rect x="740" y="24" width="14" height="14" fill="#0e6b66"/><text x="760" y="36" font-size="13" fill="#15201e">% term in core_functions</text>
  <!-- scale: 100% = 600 px from x=110 -->
  <g font-size="14" fill="#15201e">
    <text x="40" y="80">TAS</text><rect x="110" y="66" width="458" height="14" fill="#8fa39c"/><rect x="110" y="80" width="343" height="10" fill="#0e6b66"/><text x="575" y="80">76.4 / 57.1</text>
    <text x="40" y="125">IBA</text><rect x="110" y="111" width="437" height="14" fill="#8fa39c"/><rect x="110" y="125" width="305" height="10" fill="#0e6b66"/><text x="554" y="125">72.8 / 50.8</text>
    <text x="40" y="170">IDA</text><rect x="110" y="156" width="412" height="14" fill="#8fa39c"/><rect x="110" y="170" width="272" height="10" fill="#0e6b66"/><text x="529" y="170">68.7 / 45.3</text>
    <text x="40" y="215">IEA</text><rect x="110" y="201" width="304" height="14" fill="#8fa39c"/><rect x="110" y="215" width="175" height="10" fill="#0e6b66"/><text x="421" y="215">50.6 / 29.1</text>
    <text x="40" y="260">IMP</text><rect x="110" y="246" width="280" height="14" fill="#8fa39c"/><rect x="110" y="260" width="201" height="10" fill="#0e6b66"/><text x="397" y="260">46.7 / 33.5</text>
    <text x="40" y="305">IGI</text><rect x="110" y="291" width="278" height="14" fill="#8fa39c"/><rect x="110" y="305" width="179" height="10" fill="#0e6b66"/><text x="395" y="305">46.4 / 29.8</text>
    <text x="40" y="350">ISO</text><rect x="110" y="336" width="204" height="14" fill="#8fa39c"/><rect x="110" y="350" width="103" height="10" fill="#0e6b66"/><text x="321" y="350">34.0 / 17.2</text>
    <text x="40" y="395" font-weight="600" fill="#bd3a30">IEP</text><rect x="110" y="381" width="131" height="14" fill="#bd3a30"/><rect x="110" y="395" width="62" height="10" fill="#0e6b66"/><text x="248" y="395" font-weight="600" fill="#bd3a30">21.8 / 10.4</text>
    <text x="40" y="440">IPI</text><rect x="110" y="426" width="47" height="14" fill="#8fa39c"/><rect x="110" y="440" width="20" height="10" fill="#0e6b66"/><text x="164" y="440">7.8 / 3.4</text>
  </g>
  <text x="560" y="300" font-size="14" fill="#15201e">IEP's missing ACCEPTs went to</text>
  <text x="560" y="322" font-size="14" fill="#15201e"><tspan font-weight="600" fill="#0e6b66">KEEP_AS_NON_CORE: 53.4%</tspan>, the highest</text>
  <text x="560" y="344" font-size="14" fill="#15201e">share of any code. True but peripheral.</text>
  <text x="560" y="380" font-size="13" fill="#56655f">IPI is low because of protein binding.</text>
  <text x="40" y="490" font-size="13" fill="#56655f">Source: projects/IEP/iep-corpus-survey.md (repo AI reviews; IEP n = 646 rows, survey of 2026-10-04).</text>
</svg>
