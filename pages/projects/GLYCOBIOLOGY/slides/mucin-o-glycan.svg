<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
  </defs>
  <text x="30" y="36" font-size="18" font-weight="700" fill="#15201e">Mucin-type O-glycan initiation: who adds which sugar</text>

  <!-- legend -->
  <g font-size="12" fill="#56655f">
    <rect x="620" y="20" width="14" height="14" fill="#b8620f"/><text x="640" y="32">GalNAc</text>
    <circle cx="707" cy="27" r="7" fill="#f6efe6" stroke="#b8620f" stroke-width="2"/><text x="720" y="32">Gal</text>
    <rect x="762" y="20" width="14" height="14" fill="#1d68b3"/><text x="782" y="32">GlcNAc</text>
  </g>

  <!-- stage backbones -->
  <g stroke="#56655f" stroke-width="3">
    <line x1="40" y1="300" x2="180" y2="300"/>
    <line x1="270" y1="300" x2="410" y2="300"/>
    <line x1="500" y1="300" x2="640" y2="300"/>
    <line x1="730" y1="300" x2="920" y2="300"/>
  </g>
  <g font-size="12" fill="#56655f" text-anchor="middle">
    <text x="110" y="322">Ser/Thr in a mucin domain</text>
    <text x="340" y="322">Tn antigen</text>
    <text x="570" y="322">core 1 (T antigen)</text>
    <text x="825" y="322">core 2</text>
  </g>

  <!-- stage 1: bare -->
  <circle cx="110" cy="300" r="6" fill="#ffffff" stroke="#56655f" stroke-width="2"/>
  <!-- stage 2: GalNAc -->
  <line x1="340" y1="300" x2="340" y2="266" stroke="#15201e" stroke-width="2"/>
  <rect x="330" y="246" width="20" height="20" fill="#b8620f"/>
  <!-- stage 3: GalNAc + Gal -->
  <line x1="570" y1="300" x2="570" y2="266" stroke="#15201e" stroke-width="2"/>
  <rect x="560" y="246" width="20" height="20" fill="#b8620f"/>
  <line x1="570" y1="246" x2="570" y2="212" stroke="#15201e" stroke-width="2"/>
  <circle cx="570" cy="202" r="10" fill="#f6efe6" stroke="#b8620f" stroke-width="2"/>
  <text x="578" y="232" font-size="10" fill="#56655f">β1-3</text>
  <!-- stage 4: core 2 -->
  <line x1="825" y1="300" x2="825" y2="266" stroke="#15201e" stroke-width="2"/>
  <rect x="815" y="246" width="20" height="20" fill="#b8620f"/>
  <line x1="825" y1="246" x2="825" y2="212" stroke="#15201e" stroke-width="2"/>
  <circle cx="825" cy="202" r="10" fill="#f6efe6" stroke="#b8620f" stroke-width="2"/>
  <line x1="835" y1="252" x2="866" y2="222" stroke="#15201e" stroke-width="2"/>
  <rect x="862" y="202" width="20" height="20" fill="#1d68b3"/>
  <text x="850" y="252" font-size="10" fill="#56655f">β1-6</text>

  <!-- enzyme arrows -->
  <g stroke="#0e6b66" stroke-width="2.5" fill="none">
    <path d="M186 280 L262 280" marker-end="url(#a)"/>
    <path d="M416 280 L492 280" marker-end="url(#a)"/>
    <path d="M646 280 L722 280" marker-end="url(#a)"/>
  </g>
  <g text-anchor="middle">
    <text x="224" y="110" font-size="15" font-weight="700" fill="#0e6b66">GALNT1</text>
    <text x="224" y="128" font-size="11" fill="#56655f">GalNAc-T1 (GT27)</text>
    <text x="224" y="142" font-size="11" fill="#56655f">1 of 20 paralogues</text>
    <text x="454" y="110" font-size="15" font-weight="700" fill="#0e6b66">C1GALT1</text>
    <text x="454" y="128" font-size="11" fill="#56655f">T-synthase (GT31)</text>
    <text x="454" y="142" font-size="11" fill="#56655f">needs Cosmc to fold</text>
    <text x="684" y="110" font-size="15" font-weight="700" fill="#0e6b66">GCNT1</text>
    <text x="684" y="128" font-size="11" fill="#56655f">C2GnT1 (GT14)</text>
    <text x="684" y="142" font-size="11" fill="#56655f">core 2 branch</text>
  </g>
  <g stroke="#8fa39c" stroke-width="1.2" stroke-dasharray="3 3">
    <line x1="224" y1="150" x2="224" y2="272"/>
    <line x1="454" y1="150" x2="454" y2="272"/>
    <line x1="684" y1="150" x2="684" y2="272"/>
  </g>

  <!-- Cosmc -->
  <rect x="384" y="170" width="140" height="40" rx="8" fill="#ffffff" stroke="#7657a3" stroke-width="1.6"/>
  <text x="454" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#15201e">C1GALT1C1 (Cosmc)</text>
  <text x="454" y="203" text-anchor="middle" font-size="10" fill="#7657a3">ER chaperone, no transferase</text>

  <!-- review notes -->
  <g font-size="12" fill="#15201e">
    <rect x="30" y="352" width="210" height="150" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="42" y="374" font-weight="700" fill="#0e6b66">GALNT1 · 29 rows</text>
    <text x="42" y="394">viral protein processing</text>
    <text x="42" y="410" fill="#7657a3">→ over-annotated (Reactome</text>
    <text x="42" y="426" fill="#7657a3">SARS-CoV-2 ORF3a acceptor)</text>

    <rect x="252" y="352" width="220" height="150" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="264" y="374" font-weight="700" fill="#0e6b66">C1GALT1 · 13 rows</text>
    <text x="264" y="394">no O-glycosylation process row;</text>
    <text x="264" y="410">only SNP-study BP rows</text>
    <text x="264" y="430" fill="#1d68b3">→ NEW GO:0016266 O-glycosylation</text>
    <text x="264" y="446" fill="#1d68b3">via GalNAc (IDA)</text>

    <rect x="484" y="352" width="210" height="150" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="496" y="374" font-weight="700" fill="#0e6b66">C1GALT1C1 · 9 rows</text>
    <text x="496" y="394">NOT GO:0016263 (T-synthase</text>
    <text x="496" y="410">activity) accepted: curators</text>
    <text x="496" y="426">negated the client's activity</text>
    <text x="496" y="446" fill="#56655f">core MF: protein folding chaperone</text>

    <rect x="706" y="352" width="224" height="150" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="718" y="374" font-weight="700" fill="#0e6b66">GCNT1 · 22 rows</text>
    <text x="718" y="394">selectin-ligand physiology</text>
    <text x="718" y="410">(cell adhesion molecule</text>
    <text x="718" y="426">production) → over-annotated;</text>
    <text x="718" y="446" fill="#bd3a30">nuclear speck, 2 protein binding</text>
    <text x="718" y="462" fill="#bd3a30">→ removed</text>
  </g>
</svg>
