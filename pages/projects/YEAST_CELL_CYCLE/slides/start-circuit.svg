<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15201e"/></marker>
    <marker id="inh" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5,0 L5,10" stroke="#bd3a30" stroke-width="3"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="bold" fill="#15201e">Start: how a G1 cell commits to S phase</text>
  <text x="30" y="60" font-size="15" fill="#56655f">Classical transcriptional circuit (top) and the translational layer this project wants to test (bottom)</text>
  <!-- phase band -->
  <rect x="30" y="80" width="600" height="26" fill="#e8f1ee"/><text x="330" y="99" font-size="15" text-anchor="middle" fill="#56655f">G1</text>
  <rect x="630" y="80" width="300" height="26" fill="#dcefec"/><text x="780" y="99" font-size="15" text-anchor="middle" fill="#0e6b66">S phase</text>
  <line x1="630" y1="74" x2="630" y2="330" stroke="#0e6b66" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="636" y="126" font-size="14" fill="#0e6b66" font-weight="bold">Start</text>
  <!-- nodes -->
  <rect x="40" y="150" width="150" height="56" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="115" y="175" font-size="17" text-anchor="middle" fill="#15201e" font-weight="bold">Cln3–Cdc28</text>
  <text x="115" y="195" font-size="13" text-anchor="middle" fill="#56655f">size-dependent G1 CDK</text>
  <rect x="250" y="150" width="130" height="56" rx="8" fill="#fbe9e7" stroke="#bd3a30" stroke-width="2"/>
  <text x="315" y="175" font-size="17" text-anchor="middle" fill="#15201e" font-weight="bold">Whi5</text>
  <text x="315" y="195" font-size="13" text-anchor="middle" fill="#56655f">repressor on SBF</text>
  <rect x="440" y="150" width="150" height="56" rx="8" fill="#e8f1ee" stroke="#8fa39c" stroke-width="2"/>
  <text x="515" y="175" font-size="17" text-anchor="middle" fill="#15201e" font-weight="bold">SBF / MBF</text>
  <text x="515" y="195" font-size="13" text-anchor="middle" fill="#56655f">G1/S transcription</text>
  <rect x="440" y="250" width="150" height="56" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="515" y="275" font-size="17" text-anchor="middle" fill="#15201e" font-weight="bold">Cln1/2–Cdc28</text>
  <text x="515" y="295" font-size="13" text-anchor="middle" fill="#56655f">positive feedback</text>
  <rect x="660" y="150" width="120" height="56" rx="8" fill="#fbe9e7" stroke="#bd3a30" stroke-width="2"/>
  <text x="720" y="175" font-size="17" text-anchor="middle" fill="#15201e" font-weight="bold">Sic1</text>
  <text x="720" y="195" font-size="13" text-anchor="middle" fill="#56655f">CDK inhibitor</text>
  <rect x="800" y="250" width="140" height="56" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="870" y="275" font-size="17" text-anchor="middle" fill="#15201e" font-weight="bold">Clb5/6–Cdc28</text>
  <text x="870" y="295" font-size="13" text-anchor="middle" fill="#56655f">fires replication</text>
  <!-- edges -->
  <line x1="190" y1="178" x2="246" y2="178" stroke="#bd3a30" stroke-width="3" marker-end="url(#inh)"/>
  <text x="218" y="168" font-size="12" text-anchor="middle" fill="#56655f">P</text>
  <line x1="380" y1="178" x2="436" y2="178" stroke="#bd3a30" stroke-width="3" marker-end="url(#inh)"/>
  <line x1="515" y1="206" x2="515" y2="246" stroke="#15201e" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M440,278 C360,278 330,240 330,210" fill="none" stroke="#bd3a30" stroke-width="2.5" marker-end="url(#inh)"/>
  <line x1="590" y1="270" x2="656" y2="200" stroke="#bd3a30" stroke-width="2.5" marker-end="url(#inh)"/>
  <text x="640" y="250" font-size="12" fill="#56655f">P → degraded</text>
  <line x1="780" y1="195" x2="830" y2="246" stroke="#bd3a30" stroke-width="2.5" marker-end="url(#inh)"/>
  <line x1="590" y1="190" x2="796" y2="262" stroke="#15201e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="700" y="232" font-size="12" fill="#56655f"> </text>
  <!-- translational layer -->
  <rect x="30" y="360" width="900" height="130" rx="10" fill="#eef4fb" stroke="#1d68b3" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="50" y="386" font-size="16" font-weight="bold" fill="#1d68b3">Translational layer (the project's question)</text>
  <rect x="50" y="402" width="200" height="70" rx="8" fill="#ffffff" stroke="#1d68b3"/>
  <text x="150" y="428" font-size="15" text-anchor="middle" fill="#15201e" font-weight="bold">TORC1 (TOR1)</text>
  <text x="150" y="448" font-size="12" text-anchor="middle" fill="#56655f">nutrients → growth</text>
  <rect x="290" y="402" width="220" height="70" rx="8" fill="#ffffff" stroke="#1d68b3"/>
  <text x="400" y="428" font-size="15" text-anchor="middle" fill="#15201e" font-weight="bold">Ribosome biogenesis</text>
  <text x="400" y="448" font-size="12" text-anchor="middle" fill="#56655f">RRN3, IMP3, RPS3, RPL3</text>
  <rect x="550" y="402" width="220" height="70" rx="8" fill="#ffffff" stroke="#1d68b3"/>
  <text x="660" y="428" font-size="15" text-anchor="middle" fill="#15201e" font-weight="bold">Initiation factors</text>
  <text x="660" y="448" font-size="12" text-anchor="middle" fill="#56655f">eIF1 (SUI1), eIF4A (TIF1)</text>
  <line x1="250" y1="437" x2="286" y2="437" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="510" y1="437" x2="546" y2="437" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  
  <path d="M660,400 C620,320 150,330 115,212" fill="none" stroke="#1d68b3" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="800" y="470" font-size="12" fill="#1d68b3">Cln3 synthesis tracks</text>
  <text x="800" y="486" font-size="12" fill="#1d68b3">translation capacity?</text>
</svg>
