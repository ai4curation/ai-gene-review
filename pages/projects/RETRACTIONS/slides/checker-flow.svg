<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56655f"/></marker></defs>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">check_retractions.py: what it asks, and what a hit means</text>
  <!-- step 1 -->
  <rect x="24" y="64" width="250" height="150" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="40" y="90" font-size="15" font-weight="bold" fill="#0e6b66">1 · Harvest with citation site</text>
  <text x="40" y="114" font-size="13" fill="#15201e">every PMID cited in a gene review</text>
  <text x="40" y="140" font-size="13" fill="#15201e">reference: references list</text>
  <text x="40" y="160" font-size="13" fill="#15201e">supporting_text: quoted in a judgement</text>
  <text x="40" y="180" font-size="13" font-weight="bold" fill="#bd3a30">annotation: original_reference_id</text>
  <text x="40" y="200" font-size="12" fill="#56655f">the GO evidence line itself</text>
  <path d="M274 139 L 330 139" stroke="#56655f" stroke-width="2" marker-end="url(#ar)"/>
  <!-- step 2 -->
  <rect x="334" y="64" width="280" height="150" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="350" y="90" font-size="15" font-weight="bold" fill="#0e6b66">2 · Ask PubMed (efetch, 200/batch)</text>
  <text x="350" y="116" font-size="13" fill="#15201e">PublicationType list</text>
  <text x="350" y="136" font-size="13" fill="#15201e">CommentsCorrections RefTypes:</text>
  <text x="350" y="156" font-size="13" fill="#15201e">RetractionIn, ExpressionOfConcernIn,</text>
  <text x="350" y="176" font-size="13" fill="#15201e">ErratumIn</text>
  <text x="350" y="200" font-size="12" fill="#56655f">any failed batch: exit, write nothing</text>
  <path d="M614 139 L 670 139" stroke="#56655f" stroke-width="2" marker-end="url(#ar)"/>
  <!-- step 3 -->
  <rect x="674" y="64" width="262" height="150" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="690" y="90" font-size="15" font-weight="bold" fill="#0e6b66">3 · Suppress notices</text>
  <text x="690" y="116" font-size="13" fill="#15201e">a retraction notice, EoC notice</text>
  <text x="690" y="136" font-size="13" fill="#15201e">or erratum is never a finding</text>
  <text x="690" y="162" font-size="13" fill="#15201e">so a review that cites the paper</text>
  <text x="690" y="182" font-size="13" fill="#15201e">and its notice is not penalised</text>
  <!-- severity x site grid -->
  <text x="24" y="256" font-size="16" font-weight="bold" fill="#15201e">A hit is triaged by signal and by site</text>
  <g font-size="13">
    <rect x="24" y="270" width="190" height="36" fill="#dcefec"/><text x="34" y="293" fill="#15201e" font-weight="bold">signal \ cited as</text>
    <rect x="214" y="270" width="230" height="36" fill="#dcefec"/><text x="224" y="293" fill="#15201e" font-weight="bold">reference only</text>
    <rect x="444" y="270" width="240" height="36" fill="#dcefec"/><text x="454" y="293" fill="#15201e" font-weight="bold">supporting_text</text>
    <rect x="684" y="270" width="252" height="36" fill="#dcefec"/><text x="694" y="293" fill="#bd3a30" font-weight="bold">annotation evidence</text>

    <rect x="24" y="306" width="190" height="60" fill="#ffffff" stroke="#8fa39c"/><text x="34" y="332" font-weight="bold" fill="#bd3a30">Retracted</text><text x="34" y="352" fill="#56655f">actionable</text>
    <rect x="214" y="306" width="230" height="60" fill="#ffffff" stroke="#8fa39c"/><text x="224" y="332" fill="#15201e">is_invalid: true;</text><text x="224" y="352" fill="#15201e">cite the notice</text>
    <rect x="444" y="306" width="240" height="60" fill="#ffffff" stroke="#8fa39c"/><text x="454" y="332" fill="#15201e">find independent support</text><text x="454" y="352" fill="#15201e">or soften the review text</text>
    <rect x="684" y="306" width="252" height="60" fill="#fbe4e1" stroke="#bd3a30"/><text x="694" y="332" fill="#15201e">corroborated elsewhere? keep;</text><text x="694" y="352" fill="#15201e">sole evidence: UNDECIDED / upstream</text>

    <rect x="24" y="366" width="190" height="60" fill="#ffffff" stroke="#8fa39c"/><text x="34" y="392" font-weight="bold" fill="#b8620f">Expression of concern</text><text x="34" y="412" fill="#56655f">read the notice</text>
    <rect x="214" y="366" width="722" height="60" fill="#ffffff" stroke="#8fa39c"/><text x="224" y="392" fill="#15201e">reference_review: correctness DISPUTED, notice PMID in review_notes</text><text x="224" y="412" fill="#15201e">(this is how a retraction or EoC reaches the miscitation register)</text>

    <rect x="24" y="426" width="190" height="60" fill="#ffffff" stroke="#8fa39c"/><text x="34" y="452" font-weight="bold" fill="#56655f">Erratum</text><text x="34" y="472" fill="#56655f">usually benign</text>
    <rect x="214" y="426" width="722" height="60" fill="#ffffff" stroke="#8fa39c"/><text x="224" y="452" fill="#15201e">reported quietly; driven by a few heavily cited interactome and genome papers</text><text x="224" y="472" fill="#56655f">(PMID:40205054 alone is cited by 277 genes)</text>
  </g>
  <text x="24" y="510" font-size="12" fill="#56655f">Never mass-remove: a retraction is about the source; scope any action to the one evidence line.</text>
</svg>
