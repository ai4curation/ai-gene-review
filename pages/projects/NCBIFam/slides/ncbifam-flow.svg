<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d68b3"/></marker>
  </defs>
  <text x="30" y="36" font-size="20" font-weight="700" fill="#15201e">Today: one route in, and it hides the source</text>

  <!-- NCBIFAM models -->
  <rect x="30" y="60" width="200" height="120" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="130" y="86" text-anchor="middle" font-size="16" font-weight="700" fill="#15201e">NCBIFAM models</text>
  <text x="130" y="108" text-anchor="middle" font-size="13" fill="#15201e">18,511 in InterPro API</text>
  <text x="130" y="128" text-anchor="middle" font-size="13" fill="#15201e">(PGAP file: 34,351)</text>
  <text x="130" y="150" text-anchor="middle" font-size="13" fill="#56655f">CDD: 19,902 models,</text>
  <text x="130" y="168" text-anchor="middle" font-size="13" fill="#56655f">no GO of its own</text>

  <!-- integrated path -->
  <line x1="230" y1="90" x2="300" y2="90" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="265" y="80" text-anchor="middle" font-size="12" fill="#0e6b66">40%</text>
  <rect x="305" y="62" width="160" height="56" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="385" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">InterPro entry</text>
  <text x="385" y="104" text-anchor="middle" font-size="12" fill="#56655f">+ Pfam, CDD, PROSITE…</text>
  <line x1="465" y1="90" x2="520" y2="90" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="525" y="62" width="150" height="56" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="600" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">interpro2go</text>
  <text x="600" y="104" text-anchor="middle" font-size="12" fill="#56655f">30,200 rows</text>
  <line x1="675" y1="90" x2="730" y2="90" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="735" y="56" width="195" height="68" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="832" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">GOA IEA row</text>
  <text x="832" y="98" text-anchor="middle" font-size="12" fill="#15201e">GO_REF:0000002</text>
  <text x="832" y="115" text-anchor="middle" font-size="12" fill="#bd3a30">WITH/FROM = IPR only</text>

  <!-- unintegrated -->
  <line x1="230" y1="150" x2="300" y2="150" stroke="#bd3a30" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="265" y="142" text-anchor="middle" font-size="12" fill="#bd3a30">60%</text>
  <text x="308" y="148" font-size="14" fill="#bd3a30" font-weight="700">unintegrated: 11,064 models reach GO by no route</text>
  <text x="308" y="168" font-size="13" fill="#56655f">(CDD: 14,843 unintegrated)</text>

  <!-- masking callout -->
  <rect x="525" y="190" width="405" height="62" rx="8" fill="#fbf3ea" stroke="#b8620f"/>
  <text x="540" y="214" font-size="13" fill="#15201e">Re-joining this repo's 5,549 InterPro2GO rows to members:</text>
  <text x="540" y="236" font-size="13" fill="#15201e"><tspan font-weight="700" fill="#b8620f">NCBIFAM backs 705 (13%)</tspan>, sole signature for <tspan font-weight="700">250</tspan></text>

  <line x1="30" y1="272" x2="930" y2="272" stroke="#8fa39c" stroke-dasharray="4 4"/>
  <text x="30" y="304" font-size="20" font-weight="700" fill="#15201e">Proposed: a direct ncbifam2go mapping</text>

  <rect x="30" y="324" width="200" height="130" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="130" y="350" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">NCBI curated metadata</text>
  <text x="130" y="374" text-anchor="middle" font-size="13" fill="#15201e">11,228 models with GO</text>
  <text x="130" y="394" text-anchor="middle" font-size="13" fill="#15201e">6,417 with EC</text>
  <text x="130" y="414" text-anchor="middle" font-size="13" fill="#15201e">13,253 equivalogs</text>
  <text x="130" y="436" text-anchor="middle" font-size="12" fill="#56655f">(one shared function)</text>

  <line x1="230" y1="390" x2="300" y2="390" stroke="#1d68b3" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="305" y="340" width="190" height="100" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="400" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">Checks</text>
  <text x="400" y="388" text-anchor="middle" font-size="13" fill="#15201e">EC → ec2go agrees?</text>
  <text x="400" y="408" text-anchor="middle" font-size="13" fill="#15201e">altitude (FtsX case)</text>
  <text x="400" y="428" text-anchor="middle" font-size="13" fill="#15201e">structure (OpenScientist)</text>

  <line x1="495" y1="390" x2="545" y2="390" stroke="#1d68b3" stroke-width="2.5" marker-end="url(#g)"/>
  <rect x="550" y="316" width="380" height="72" rx="8" fill="#e6effa" stroke="#1d68b3" stroke-width="2"/>
  <text x="565" y="342" font-size="15" font-weight="700" fill="#15201e">ncbifam2go.sssom.yaml: 250 rows</text>
  <text x="565" y="364" font-size="13" fill="#15201e">246 exactMatch · 2 narrowMatch · 2 broadMatch</text>
  <text x="565" y="380" font-size="12" fill="#56655f">passes just validate-ncbifam-mappings</text>
  <rect x="550" y="400" width="380" height="60" rx="8" fill="#ffffff" stroke="#1d68b3" stroke-dasharray="5 4"/>
  <text x="565" y="424" font-size="15" font-weight="700" fill="#15201e">candidates.tsv: 2,455 models</text>
  <text x="565" y="446" font-size="13" fill="#15201e">EC-bridge confirmed · 843 more "refine" models</text>

  <text x="30" y="496" font-size="13" fill="#56655f">Counts from NCBIFam.md (InterPro API, hmm_PGAP.tsv, GO release 2026-04-28) and the committed SSSOM/TSV files.</text>
</svg>
