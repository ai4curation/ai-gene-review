<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- pathogen damage -->
  <rect x="14" y="40" width="150" height="220" rx="10" fill="#fbeceb" stroke="#bd3a30" stroke-width="1.5"/>
  <text x="89" y="64" text-anchor="middle" font-size="14" font-weight="bold" fill="#bd3a30">Pathogen damage</text>
  <text x="89" y="90" text-anchor="middle" font-size="12" fill="#15201e">P. aeruginosa ToxA</text>
  <text x="89" y="106" text-anchor="middle" font-size="12" fill="#15201e">blocks translation</text>
  <text x="89" y="138" text-anchor="middle" font-size="12" fill="#15201e">mitochondrial and</text>
  <text x="89" y="154" text-anchor="middle" font-size="12" fill="#15201e">proteasome damage</text>
  <text x="89" y="188" text-anchor="middle" font-size="11" fill="#56655f" font-style="italic">the host senses</text>
  <text x="89" y="202" text-anchor="middle" font-size="11" fill="#56655f" font-style="italic">the damage,</text>
  <text x="89" y="216" text-anchor="middle" font-size="11" fill="#56655f" font-style="italic">not a PAMP</text>

  <!-- intestinal cell -->
  <rect x="184" y="14" width="540" height="350" rx="14" fill="#e8f1ee" stroke="#8fa39c" stroke-width="1.5"/>
  <text x="200" y="36" font-size="13" font-weight="bold" fill="#56655f">INTESTINAL CELL</text>

  <!-- p38 cascade -->
  <g font-size="13" font-weight="bold" fill="#15201e" text-anchor="middle">
    <rect x="204" y="54" width="86" height="34" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/><text x="247" y="76">TIR-1</text>
    <rect x="320" y="54" width="86" height="34" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/><text x="363" y="76">NSY-1</text>
    <rect x="436" y="54" width="86" height="34" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/><text x="479" y="76">SEK-1</text>
    <rect x="552" y="54" width="100" height="34" rx="6" fill="#0e6b66" stroke="#0e6b66"/><text x="602" y="76" fill="#ffffff">PMK-1 p38</text>
  </g>
  <g stroke="#0e6b66" stroke-width="2" marker-end="url(#ara)">
    <line x1="290" y1="71" x2="318" y2="71"/><line x1="406" y1="71" x2="434" y2="71"/><line x1="522" y1="71" x2="550" y2="71"/>
  </g>
  <text x="420" y="104" text-anchor="middle" font-size="11" fill="#56655f">SARM1 adaptor → MAP3K → MAP2K → p38 MAPK</text>

  <!-- PMK-1 targets -->
  <g font-size="13" font-weight="bold" fill="#15201e" text-anchor="middle">
    <rect x="552" y="130" width="72" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="588" y="150">ATF-7</text>
    <rect x="636" y="130" width="72" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="672" y="150">SKN-1</text>
  </g>
  <line x1="592" y1="88" x2="588" y2="128" stroke="#56655f" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="620" y1="88" x2="668" y2="128" stroke="#56655f" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- ZIP-2 branch -->
  <line x1="164" y1="100" x2="202" y2="100" stroke="#bd3a30" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="164" y1="200" x2="300" y2="200" stroke="#bd3a30" stroke-width="1.5" marker-end="url(#ar)"/>
  <g font-size="13" font-weight="bold" fill="#15201e" text-anchor="middle">
    <rect x="302" y="184" width="150" height="34" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/><text x="377" y="206">ZIP-2 + CEBP-2</text>
  </g>
  <text x="377" y="234" text-anchor="middle" font-size="11" fill="#56655f">bZIP pair induced by translation block</text>

  <!-- other TFs -->
  <g font-size="13" font-weight="bold" fill="#15201e" text-anchor="middle">
    <rect x="204" y="262" width="80" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="244" y="282">ELT-2</text>
    <rect x="296" y="262" width="84" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="338" y="282">HLH-30</text>
    <rect x="392" y="262" width="90" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="437" y="282">DAF-16</text>
    <rect x="494" y="262" width="84" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="536" y="282">FSHR-1</text>
  </g>
  <g font-size="10.5" fill="#56655f" text-anchor="middle">
    <text x="244" y="306">GATA, gut identity</text><text x="338" y="306">TFEB, autophagy</text><text x="437" y="306">FOXO, DAF-2 IIS</text><text x="536" y="306">GPCR</text>
  </g>

  <!-- SMA receptor from DBL-1 -->
  <rect x="596" y="262" width="112" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/>
  <text x="652" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#15201e">SMA-6 / SMADs</text>

  <!-- output arrow to effectors -->
  <line x1="708" y1="150" x2="760" y2="150" stroke="#56655f" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="452" y1="201" x2="760" y2="201" stroke="#56655f" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="708" y1="277" x2="760" y2="250" stroke="#56655f" stroke-width="2" marker-end="url(#ar)"/>

  <!-- effectors -->
  <rect x="764" y="112" width="182" height="176" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="855" y="134" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e6b66">Induced effectors</text>
  <g font-size="13" font-weight="bold" fill="#15201e">
    <text x="780" y="162">irg-1</text><text x="780" y="198">LYS-7</text><text x="780" y="234">CLEC-60</text>
  </g>
  <g font-size="10.5" fill="#56655f">
    <text x="826" y="162">readout gene</text><text x="826" y="198">lysozyme-like</text><text x="846" y="234">C-type lectin</text>
    <text x="780" y="268">secreted into gut lumen</text>
  </g>

  <!-- DBL-1 source -->
  <rect x="740" y="330" width="206" height="40" rx="8" fill="#ffffff" stroke="#8fa39c"/>
  <text x="843" y="355" text-anchor="middle" font-size="12.5" fill="#15201e"><tspan font-weight="bold">DBL-1</tspan> TGF-β, from neurons</text>
  <path d="M740 350 C 700 350, 680 320, 660 296" fill="none" stroke="#56655f" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- epidermis -->
  <rect x="184" y="386" width="540" height="72" rx="14" fill="#f2efe6" stroke="#8fa39c" stroke-width="1.5"/>
  <text x="200" y="406" font-size="13" font-weight="bold" fill="#56655f">EPIDERMIS · fungal infection (D. coniospora)</text>
  <g font-size="13" font-weight="bold" fill="#15201e" text-anchor="middle">
    <rect x="300" y="416" width="84" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="342" y="436">NIPI-3</text>
    <rect x="420" y="416" width="84" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="462" y="436">p38</text>
    <rect x="540" y="416" width="84" height="30" rx="6" fill="#ffffff" stroke="#8fa39c"/><text x="582" y="436">STA-2</text>
  </g>
  <line x1="384" y1="431" x2="418" y2="431" stroke="#56655f" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="504" y1="431" x2="538" y2="431" stroke="#56655f" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="640" y="436" font-size="11" fill="#56655f">→ nlp-29 AMP</text>

  <!-- correction badges -->
  <g font-size="10.5" font-weight="bold">
    <rect x="200" y="112" width="132" height="34" rx="5" fill="#ffffff" stroke="#bd3a30"/>
    <text x="207" y="126" fill="#bd3a30">REMOVE TLR-pathway</text><text x="207" y="140" fill="#bd3a30">term (no TLR role)</text>
    <line x1="247" y1="112" x2="247" y2="90" stroke="#bd3a30" stroke-dasharray="3 2"/>

    <rect x="392" y="318" width="170" height="34" rx="5" fill="#ffffff" stroke="#b8620f"/>
    <text x="399" y="332" fill="#b8620f">MODIFY adaptive immune →</text><text x="399" y="346" fill="#b8620f">innate immune response</text>

    <rect x="494" y="232" width="128" height="26" rx="5" fill="#ffffff" stroke="#bd3a30"/>
    <text x="501" y="249" fill="#bd3a30">REMOVE hormone rows</text>

    <rect x="200" y="470" width="190" height="34" rx="5" fill="#ffffff" stroke="#bd3a30"/>
    <text x="207" y="484" fill="#bd3a30">REMOVE protein kinase activity</text><text x="207" y="498" fill="#bd3a30">(NIPI-3 is a pseudokinase)</text>
    <line x1="330" y1="470" x2="336" y2="446" stroke="#bd3a30" stroke-dasharray="3 2"/>

    <rect x="530" y="470" width="190" height="34" rx="5" fill="#ffffff" stroke="#bd3a30"/>
    <text x="537" y="484" fill="#bd3a30">REMOVE JAK-STAT signalling</text><text x="537" y="498" fill="#bd3a30">(worms have no JAK kinase)</text>
    <line x1="582" y1="470" x2="582" y2="446" stroke="#bd3a30" stroke-dasharray="3 2"/>

    <rect x="752" y="388" width="194" height="34" rx="5" fill="#ffffff" stroke="#7657a3"/>
    <text x="759" y="402" fill="#7657a3">OVER-ANNOTATED lysozyme</text><text x="759" y="416" fill="#7657a3">activity (LYS-7 lacks active site)</text>
    <path d="M846 388 C 900 330, 900 230, 830 202" fill="none" stroke="#7657a3" stroke-dasharray="3 2"/>
  </g>
  <text x="752" y="450" font-size="11" fill="#56655f">Badges: inherited functions the</text>
  <text x="752" y="464" font-size="11" fill="#56655f">review corrected on worm genes.</text>
</svg>
