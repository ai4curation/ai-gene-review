<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#56655f"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#bd3a30"/></marker>
  </defs>
  <text x="30" y="36" font-size="18" font-weight="600" fill="#15201e">What the proteome clean-up does to a gene review</text>
  <!-- UniProtKB -->
  <rect x="30" y="70" width="380" height="250" rx="14" fill="#e8f1ee" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="50" y="98" font-size="16" font-weight="600" fill="#0e6b66">UniProtKB</text>
  <rect x="50" y="115" width="160" height="60" rx="8" fill="#ffffff" stroke="#1d8a4b"/>
  <text x="130" y="140" text-anchor="middle" font-size="14" fill="#15201e">Swiss-Prot</text>
  <text x="130" y="160" text-anchor="middle" font-size="12" fill="#1d8a4b">not affected</text>
  <rect x="225" y="115" width="165" height="60" rx="8" fill="#ffffff" stroke="#1d8a4b"/>
  <text x="307" y="140" text-anchor="middle" font-size="14" fill="#15201e">TrEMBL, reference</text>
  <text x="307" y="160" text-anchor="middle" font-size="12" fill="#1d8a4b">retained</text>
  <rect x="50" y="195" width="340" height="105" rx="8" fill="#fbeceb" stroke="#bd3a30"/>
  <text x="220" y="222" text-anchor="middle" font-size="14" fill="#15201e">TrEMBL from redundant and</text>
  <text x="220" y="240" text-anchor="middle" font-size="14" fill="#15201e">"other" proteomes</text>
  <text x="220" y="268" text-anchor="middle" font-size="13" font-weight="600" fill="#bd3a30">~58M entries on the removal list</text>
  <text x="220" y="288" text-anchor="middle" font-size="12" fill="#56655f">proteins_to_remove_from_UniProtKB.txt</text>
  <!-- UniParc -->
  <rect x="560" y="200" width="360" height="100" rx="14" fill="#f4f7f6" stroke="#8fa39c"/>
  <text x="740" y="232" text-anchor="middle" font-size="16" font-weight="600" fill="#15201e">UniParc archive</text>
  <text x="740" y="256" text-anchor="middle" font-size="13" fill="#56655f">sequence kept under a UPI identifier</text>
  <text x="740" y="276" text-anchor="middle" font-size="13" fill="#56655f">no longer a UniProtKB entry</text>
  <path d="M392 250 L556 250" stroke="#bd3a30" stroke-width="2.4" marker-end="url(#r)"/>
  <text x="474" y="240" text-anchor="middle" font-size="13" fill="#bd3a30">release 2026_02</text>
  <!-- review -->
  <rect x="30" y="370" width="380" height="120" rx="14" fill="#ffffff" stroke="#8fa39c"/>
  <text x="50" y="398" font-size="15" font-weight="600" fill="#15201e">genes/ECO57/stx2A/stx2A-ai-review.yaml</text>
  <text x="50" y="424" font-size="14" fill="#15201e">id: A0A9Q6Z964</text>
  <text x="50" y="450" font-size="13" fill="#56655f">fetch-gene, GOA download and validation</text>
  <text x="50" y="470" font-size="13" fill="#56655f">all key on this accession</text>
  <path d="M220 368 L220 304" stroke="#56655f" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="560" y="370" width="360" height="120" rx="14" fill="#fbeceb" stroke="#bd3a30"/>
  <text x="740" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#bd3a30">stranded review</text>
  <text x="740" y="428" text-anchor="middle" font-size="13" fill="#15201e">A0A9Q6Z964 is now "Inactive, DELETED"</text>
  <text x="740" y="448" text-anchor="middle" font-size="13" fill="#15201e">in UniProt (checked 2026-09-26)</text>
  <text x="740" y="472" text-anchor="middle" font-size="12" fill="#56655f">fix: re-key to a retained entry, or archive</text>
  <path d="M412 430 L556 430" stroke="#bd3a30" stroke-width="2" marker-end="url(#r)"/>
</svg>
