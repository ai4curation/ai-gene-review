<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15201e"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8620f"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="32" y="40" font-size="23" font-weight="bold" fill="#15201e">Where does GO:0016567 protein ubiquitination stop?</text>
  <text x="32" y="64" font-size="15" fill="#56655f">UniPathway UPA00143 has three child steps; GO needs a per-gene boundary. 124 human TRUE-unique rows triaged.</text>

  <!-- accepted zone -->
  <rect x="28" y="84" width="700" height="250" rx="12" fill="#e8f1ee" stroke="#1d8a4b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="44" y="108" font-size="15" font-weight="bold" fill="#1d8a4b">ACCEPT: direct transfer machinery or direct substrate recruitment</text>

  <!-- Ub token -->
  <circle cx="72" cy="200" r="20" fill="#ffffff" stroke="#15201e" stroke-width="2"/>
  <text x="72" y="206" font-size="15" text-anchor="middle" fill="#15201e">Ub</text>

  <!-- E1 -->
  <rect x="104" y="170" width="128" height="62" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="168" y="196" font-size="17" font-weight="bold" text-anchor="middle" fill="#0e6b66">E1</text>
  <text x="168" y="218" font-size="11" text-anchor="middle" fill="#56655f">UPA00831 activation</text>
  <!-- E2 -->
  <rect x="252" y="170" width="128" height="62" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="316" y="196" font-size="17" font-weight="bold" text-anchor="middle" fill="#0e6b66">E2</text>
  <text x="316" y="218" font-size="11" text-anchor="middle" fill="#56655f">UPA00832 · UBE2Z (1)</text>
  <!-- E3 -->
  <rect x="396" y="150" width="166" height="102" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="479" y="178" font-size="17" font-weight="bold" text-anchor="middle" fill="#0e6b66">E3 ligase</text>
  <text x="479" y="198" font-size="12" text-anchor="middle" fill="#56655f">UPA00833 transfer</text>
  <text x="479" y="218" font-size="12" text-anchor="middle" fill="#15201e">catalytic E3s (45)</text>
  <text x="479" y="236" font-size="10" text-anchor="middle" fill="#56655f">BRCA1 RAD18 SYVN1 PEX2/10/12</text>
  <!-- CRL module -->
  <rect x="404" y="268" width="150" height="50" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="479" y="289" font-size="13" text-anchor="middle" fill="#15201e">Elongin BC module</text>
  <text x="479" y="306" font-size="11" text-anchor="middle" fill="#56655f">ELOB; ELOC comparator</text>
  <!-- adaptor -->
  <rect x="574" y="150" width="148" height="102" rx="8" fill="#ffffff" stroke="#1d68b3" stroke-width="2"/>
  <text x="648" y="176" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d68b3">Substrate</text>
  <text x="648" y="194" font-size="15" font-weight="bold" text-anchor="middle" fill="#1d68b3">adaptor (63)</text>
  <text x="648" y="214" font-size="11" text-anchor="middle" fill="#15201e">SOCS4 SOCS5 KCTD11</text>
  <text x="648" y="230" font-size="11" text-anchor="middle" fill="#15201e">ZSWIM8 · ASB/DCAF/FBXO</text>
  <text x="648" y="246" font-size="11" text-anchor="middle" fill="#1d68b3">MF GO:1990756</text>
  <!-- substrate -->
  <rect x="605" y="276" width="86" height="36" rx="18" fill="#ffffff" stroke="#15201e" stroke-width="1.5"/>
  <text x="648" y="299" font-size="13" text-anchor="middle" fill="#15201e">substrate</text>

  <path d="M92,200 L102,200" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M232,200 L250,200" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M380,200 L394,200" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M562,200 L572,200" stroke="#15201e" stroke-width="2"/>
  <path d="M648,252 L648,274" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>

  <!-- UBA7 modify -->
  <rect x="104" y="376" width="276" height="84" rx="8" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
  <text x="118" y="402" font-size="15" font-weight="bold" fill="#b8620f">MODIFY · UBA7 (1)</text>
  <text x="118" y="424" font-size="13" fill="#15201e">E1 for ISG15, not ubiquitin</text>
  <text x="118" y="444" font-size="13" fill="#15201e">→ GO:0032020 ISG15-protein conjugation</text>
  <path d="M168,374 L168,236" stroke="#b8620f" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- excluded -->
  <rect x="392" y="360" width="540" height="140" rx="10" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="408" y="386" font-size="15" font-weight="bold" fill="#bd3a30">Outside the boundary unless separate transfer evidence</text>
  <text x="408" y="412" font-size="13" fill="#15201e">Deubiquitinase: USP9Y (1), usually MODIFY or REMOVE</text>
  <text x="408" y="434" font-size="13" fill="#15201e">Ubiquitin-binding cargo handler: HDAC6 (1)</text>
  <text x="408" y="456" font-size="13" fill="#15201e">Regulatory / complex-module inspect bucket (12):</text>
  <text x="424" y="476" font-size="12" fill="#56655f">APPBP2 ARMC5 CDCA3 MED8 TULP4 ZBTB16 … inspect manually</text>
  <text x="752" y="112" font-size="12" fill="#56655f">Counts: human TRUE-unique</text>
  <text x="752" y="128" font-size="12" fill="#56655f">GO:0016567 triage buckets</text>
</svg>
