<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#56655f"/></marker></defs>
  <text x="30" y="36" font-size="18" font-weight="600" fill="#15201e">modules/gluconeogenesis_human.yaml compiled to a boolean circuit</text>
  <text x="30" y="58" font-size="13" fill="#56655f">parts are AND · variant sets are OR · each gene is an atom whose truth value comes from the context oracle</text>
  <!-- AND spine -->
  <rect x="30" y="90" width="900" height="210" rx="14" fill="#f4f7f6" stroke="#0e6b66" stroke-dasharray="6 5"/>
  <text x="44" y="112" font-size="13" font-weight="600" fill="#0e6b66">AND (every step)</text>
  <!-- step 1 -->
  <g transform="translate(50 140)">
    <rect width="140" height="130" rx="10" fill="#ffffff" stroke="#8fa39c"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" fill="#56655f">pyruvate carboxylase</text>
    <rect x="30" y="50" width="80" height="34" rx="17" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="70" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">PC</text>
  </g>
  <path d="M192 205 L218 205" stroke="#56655f" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- step 2 -->
  <g transform="translate(222 140)">
    <rect width="150" height="130" rx="10" fill="#ffffff" stroke="#8fa39c"/>
    <text x="75" y="22" text-anchor="middle" font-size="12" fill="#56655f">PEPCK · OR</text>
    <rect x="35" y="36" width="80" height="32" rx="16" fill="#ffffff" stroke="#1d68b3"/><text x="75" y="57" text-anchor="middle" font-size="14" fill="#15201e">PCK1</text>
    <rect x="35" y="80" width="80" height="32" rx="16" fill="#ffffff" stroke="#1d68b3"/><text x="75" y="101" text-anchor="middle" font-size="14" fill="#15201e">PCK2</text>
  </g>
  <path d="M374 205 L400 205" stroke="#56655f" stroke-width="1.6" marker-end="url(#a)"/>
  <g transform="translate(404 140)">
    <rect width="120" height="130" rx="10" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="4 3"/>
    <text x="60" y="60" text-anchor="middle" font-size="12" fill="#56655f">reversible</text>
    <text x="60" y="76" text-anchor="middle" font-size="12" fill="#56655f">glycolytic trunk</text>
  </g>
  <path d="M526 205 L552 205" stroke="#56655f" stroke-width="1.6" marker-end="url(#a)"/>
  <g transform="translate(556 140)">
    <rect width="150" height="130" rx="10" fill="#ffffff" stroke="#8fa39c"/>
    <text x="75" y="22" text-anchor="middle" font-size="12" fill="#56655f">FBPase · OR</text>
    <rect x="35" y="36" width="80" height="32" rx="16" fill="#ffffff" stroke="#1d68b3"/><text x="75" y="57" text-anchor="middle" font-size="14" fill="#15201e">FBP1</text>
    <rect x="35" y="80" width="80" height="32" rx="16" fill="#ffffff" stroke="#1d68b3"/><text x="75" y="101" text-anchor="middle" font-size="14" fill="#15201e">FBP2</text>
  </g>
  <path d="M708 205 L734 205" stroke="#56655f" stroke-width="1.6" marker-end="url(#a)"/>
  <g transform="translate(738 140)">
    <rect width="176" height="130" rx="10" fill="#fbf1e6" stroke="#b8620f" stroke-width="2"/>
    <text x="88" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#b8620f">glucose release · AND</text>
    <rect x="18" y="36" width="140" height="32" rx="16" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="88" y="57" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">G6PC1</text>
    <rect x="18" y="80" width="140" height="32" rx="16" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="88" y="101" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">SLC37A4</text>
  </g>
  <!-- G6PC3 not accepted -->
  <rect x="770" y="318" width="120" height="30" rx="15" fill="#ffffff" stroke="#bd3a30" stroke-dasharray="4 3"/>
  <text x="830" y="338" text-anchor="middle" font-size="13" fill="#bd3a30">G6PC3 ✗</text>
  <text x="830" y="366" text-anchor="middle" font-size="11" fill="#56655f">ubiquitous paralog,</text>
  <text x="830" y="380" text-anchor="middle" font-size="11" fill="#56655f">not an atom here</text>
  <!-- legend / outputs -->
  <g transform="translate(40 330)" font-size="13" fill="#15201e">
    <text y="0" font-weight="600" fill="#0e6b66">What the engine computes</text>
    <text y="26">4 routes (PCK1|PCK2 × FBP1|FBP2)</text>
    <text y="48">AND-core on every route: <tspan font-weight="600">PC, G6PC1, SLC37A4</tspan></text>
    <text y="70">unsatisfied steps under an oracle = the gap, named by gene</text>
  </g>
  <g transform="translate(420 330)" font-size="13" fill="#15201e">
    <text y="0" font-weight="600" fill="#0e6b66">Oracles (only thing that changes)</text>
    <text y="26">GTEx: gene expressed in this tissue?</text>
    <text y="48">Halpern 2017: expressed in this lobule layer?</text>
    <text y="70">KEGG: ortholog encoded in this genome?</text>
  </g>
  <text x="480" y="486" text-anchor="middle" font-size="13" fill="#56655f">Circuit and core atoms from compile_module_file() / core_atoms() in src/ai_gene_review/module_logic.py</text>
</svg>
