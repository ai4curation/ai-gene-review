<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8620f"/></marker>
  </defs>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">Where the 19 genes act: two views of the germ granule</text>
  <!-- Left panel: adult germ cell -->
  <text x="40" y="70" font-size="14" font-weight="bold" fill="#56655f">A. Adult germ cell: perinuclear condensates</text>
  <circle cx="220" cy="360" r="120" fill="#dcefec" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="220" y="370" font-size="14" fill="#0e6b66" text-anchor="middle">nucleus</text>
  <rect x="200" y="233" width="12" height="10" fill="#56655f"/>
  <rect x="286" y="262" width="12" height="10" fill="#56655f" transform="rotate(35 292 267)"/>
  <text x="220" y="392" font-size="11" fill="#56655f" text-anchor="middle">granules sit over nuclear pores</text>
  <ellipse cx="190" cy="178" rx="120" ry="62" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="190" y="146" font-size="14" font-weight="bold" fill="#0e6b66" text-anchor="middle">P granule</text>
  <text x="190" y="164" font-size="11" fill="#15201e" text-anchor="middle">PGL-1, PGL-2, PGL-3 (scaffold)</text>
  <text x="190" y="179" font-size="11" fill="#15201e" text-anchor="middle">GLH-1, GLH-4 (VASA helicases)</text>
  <text x="190" y="194" font-size="11" fill="#15201e" text-anchor="middle">DEPS-1, PRG-1 (Piwi)</text>
  <text x="190" y="209" font-size="11" fill="#15201e" text-anchor="middle">CSR-1, WAGO-1 (Argonautes)</text>
  <circle cx="345" cy="205" r="38" fill="#eef2fb" stroke="#1d68b3" stroke-width="2.5"/>
  <text x="345" y="201" font-size="12" font-weight="bold" fill="#1d68b3" text-anchor="middle">Z granule</text>
  <text x="345" y="217" font-size="11" fill="#15201e" text-anchor="middle">ZNFX-1</text>
  <circle cx="395" cy="275" r="36" fill="#f2eef8" stroke="#7657a3" stroke-width="2.5"/>
  <text x="395" y="271" font-size="11" font-weight="bold" fill="#7657a3" text-anchor="middle">Mutator</text>
  <text x="395" y="285" font-size="11" fill="#15201e" text-anchor="middle">MUT-16</text>
  <text x="40" y="504" font-size="11" fill="#56655f">Also reviewed, P-body-like: CGH-1 (DDX6), CAR-1 (LSM14)</text>
  <!-- Right panel: embryo -->
  <text x="500" y="70" font-size="14" font-weight="bold" fill="#56655f">B. One-cell embryo: granules move to the posterior</text>
  <ellipse cx="715" cy="250" rx="200" ry="120" fill="#f4f7f6" stroke="#8fa39c" stroke-width="2.5"/>
  <!-- MEX-5 gradient -->
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#b8620f" stop-opacity="0.35"/><stop offset="0.6" stop-color="#b8620f" stop-opacity="0"/></linearGradient></defs>
  <ellipse cx="715" cy="250" rx="198" ry="118" fill="url(#g)"/>
  <text x="560" y="220" font-size="13" font-weight="bold" fill="#b8620f">MEX-5</text>
  <text x="560" y="236" font-size="11" fill="#15201e">anterior RNA-binding</text>
  <text x="560" y="250" font-size="11" fill="#15201e">gradient competes for RNA</text>
  <text x="560" y="264" font-size="11" fill="#15201e">and dissolves granules</text>
  <!-- small dissolving granules anterior -->
  <circle cx="600" cy="300" r="5" fill="#e8f1ee" stroke="#0e6b66" stroke-dasharray="2 2"/>
  <circle cx="625" cy="320" r="4" fill="#e8f1ee" stroke="#0e6b66" stroke-dasharray="2 2"/>
  <!-- posterior granules -->
  <circle cx="850" cy="230" r="10" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <circle cx="870" cy="262" r="12" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <circle cx="842" cy="290" r="9" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <circle cx="820" cy="255" r="8" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <text x="735" y="176" font-size="13" font-weight="bold" fill="#0e6b66">MEG-3, MEG-4</text>
  <text x="735" y="192" font-size="11" fill="#15201e">IDR scaffolds (GO:0140693)</text>
  <text x="735" y="206" font-size="11" fill="#15201e">with PGL proteins, posterior</text>
  <path d="M660,300 L800,270" stroke="#b8620f" stroke-width="2" marker-end="url(#a)"/>
  <text x="715" y="395" font-size="12" fill="#15201e" text-anchor="middle"><tspan font-weight="bold">MBK-2</tspan> (DYRK kinase) phosphorylates MEG proteins: disassembly</text>
  <text x="715" y="412" font-size="12" fill="#15201e" text-anchor="middle"><tspan font-weight="bold">MEG-1, MEG-2</tspan>: regulate granule dynamics</text>
  <text x="520" y="452" font-size="12" fill="#56655f">anterior</text>
  <text x="870" y="452" font-size="12" fill="#56655f">posterior (P1)</text>
  <line x1="580" y1="448" x2="860" y2="448" stroke="#8fa39c" stroke-width="1.5"/>
  <text x="500" y="504" font-size="11" fill="#56655f">Schematic drawn from the project page. Not to scale.</text>
</svg>
