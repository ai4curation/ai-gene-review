<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">cGAS-STING: from cytosolic DNA to type I interferon</text>
  <text x="24" y="56" font-size="13" fill="#56655f">Filled boxes: gene already has a complete review (STING1, TBK1, IFI16). Outlined boxes: no gene folder yet.</text>

  <!-- DNA sources -->
  <text x="40" y="100" font-size="13" fill="#56655f">cytosolic DNA</text>
  <text x="40" y="116" font-size="11" fill="#56655f">pathogen, mitochondrial,</text>
  <text x="40" y="130" font-size="11" fill="#56655f">micronuclei</text>
  <path d="M40 150 q 12 -12 24 0 t 24 0 t 24 0 t 24 0" fill="none" stroke="#15201e" stroke-width="3"/>
  <path d="M40 160 q 12 -12 24 0 t 24 0 t 24 0 t 24 0" fill="none" stroke="#15201e" stroke-width="3"/>

  <!-- TREX1 degrades DNA -->
  <rect x="40" y="200" width="110" height="40" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="95" y="225" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">TREX1</text>
  <text x="95" y="256" font-size="11" text-anchor="middle" fill="#56655f">exonuclease: clears self-DNA</text>
  <line x1="95" y1="198" x2="95" y2="172" stroke="#bd3a30" stroke-width="3"/>
  <line x1="84" y1="172" x2="106" y2="172" stroke="#bd3a30" stroke-width="3"/>
  <!-- SAMHD1 -->
  <rect x="40" y="290" width="110" height="40" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="95" y="315" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">SAMHD1</text>
  <text x="95" y="346" font-size="11" text-anchor="middle" fill="#56655f">dNTPase; negative regulator</text>

  <!-- sensors -->
  <line x1="152" y1="155" x2="208" y2="155" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="214,155 202,149 202,161" fill="#1d8a4b"/>
  <rect x="216" y="132" width="110" height="46" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="271" y="160" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">CGAS</text>
  <text x="271" y="196" font-size="11" text-anchor="middle" fill="#56655f">DNA sensor; synthase</text>
  <rect x="216" y="220" width="110" height="40" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="271" y="245" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">IFI16</text>
  <text x="271" y="276" font-size="11" text-anchor="middle" fill="#56655f">alternative DNA sensor</text>

  <!-- cGAMP -->
  <line x1="328" y1="155" x2="384" y2="155" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="390,155 378,149 378,161" fill="#1d8a4b"/>
  <circle cx="420" cy="155" r="28" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <text x="420" y="152" font-size="11" text-anchor="middle" fill="#15201e">2'3'-</text>
  <text x="420" y="166" font-size="11" text-anchor="middle" fill="#15201e">cGAMP</text>
  <!-- ENPP1 -->
  <rect x="370" y="60" width="100" height="36" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="420" y="83" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">ENPP1</text>
  <text x="480" y="83" font-size="11" fill="#56655f">hydrolyses extracellular cGAMP</text>
  <line x1="420" y1="98" x2="420" y2="124" stroke="#bd3a30" stroke-width="3"/>
  <line x1="409" y1="124" x2="431" y2="124" stroke="#bd3a30" stroke-width="3"/>

  <!-- ER membrane with STING1 -->
  <rect x="470" y="200" width="300" height="34" fill="#e8f1ee"/>
  <line x1="470" y1="200" x2="770" y2="200" stroke="#8fa39c" stroke-width="2"/>
  <line x1="470" y1="234" x2="770" y2="234" stroke="#8fa39c" stroke-width="2"/>
  <text x="776" y="222" font-size="12" fill="#56655f">ER membrane</text>
  <rect x="520" y="176" width="110" height="82" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="575" y="222" font-size="15" text-anchor="middle" font-weight="bold" fill="#15201e">STING1</text>
  <path d="M448 162 C 480 170, 500 190, 516 200" fill="none" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="520,204 506,202 512,192" fill="#1d8a4b"/>

  <!-- TBK1 -->
  <line x1="575" y1="260" x2="575" y2="296" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="575,302 569,290 581,290" fill="#1d8a4b"/>
  <rect x="520" y="304" width="110" height="40" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="575" y="329" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">TBK1</text>
  <text x="640" y="329" font-size="11" fill="#56655f">kinase</text>

  <!-- IRF3 / NFKB1 -->
  <line x1="560" y1="346" x2="520" y2="386" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="516,390 520,377 528,385" fill="#1d8a4b"/>
  <line x1="600" y1="346" x2="660" y2="386" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="665,390 652,387 658,378" fill="#1d8a4b"/>
  <rect x="440" y="392" width="110" height="40" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="495" y="417" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">IRF3 / IRF7</text>
  <rect x="620" y="392" width="100" height="40" rx="6" fill="#ffffff" stroke="#8fa39c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="670" y="417" font-size="14" text-anchor="middle" fill="#15201e">NF-κB</text>

  <!-- output -->
  <line x1="495" y1="434" x2="495" y2="462" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="495,468 489,456 501,456" fill="#1d8a4b"/>
  <rect x="420" y="470" width="300" height="36" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="570" y="493" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">IFNB1 and type I interferon response</text>

  <!-- disease panel -->
  <rect x="776" y="270" width="176" height="236" rx="8" fill="#e8f1ee"/>
  <text x="788" y="296" font-size="13" font-weight="bold" fill="#0e6b66">Disease links</text>
  <text x="788" y="322" font-size="12" fill="#15201e">Type 1 interferonopathy</text>
  <text x="788" y="338" font-size="12" fill="#15201e">(TREX1, SAMHD1; AGS)</text>
  <text x="788" y="364" font-size="12" fill="#15201e">SAVI (STING1)</text>
  <text x="788" y="406" font-size="12" fill="#15201e">Lupus</text>
  <text x="788" y="432" font-size="12" fill="#15201e">STING agonists in</text>
  <text x="788" y="448" font-size="12" fill="#15201e">cancer immunotherapy</text>
  <text x="788" y="474" font-size="12" fill="#15201e">Senescence, ageing</text>
</svg>
