<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="bold" fill="#15201e">One family, two substrate classes, one propagated term</text>

  <!-- reaction strip -->
  <rect x="24" y="52" width="912" height="56" rx="10" fill="#e8f1ee"/>
  <text x="40" y="76" font-size="14" font-weight="bold" fill="#0e6b66">Stilbene cleavage:</text>
  <text x="178" y="76" font-size="14" fill="#15201e">trans-resveratrol + O2 → 3,5-dihydroxybenzaldehyde + 4-hydroxybenzaldehyde</text>
  <text x="40" y="98" font-size="13" fill="#56655f">Fe(II), four-His centre, seven-bladed β-propeller shared with carotenoid cleavage oxygenases (PANTHER PTHR10543)</text>

  <!-- family root -->
  <rect x="380" y="130" width="200" height="46" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="480" y="152" font-size="15" text-anchor="middle" font-weight="bold" fill="#0e6b66">CCO family node</text>
  <text x="480" y="169" font-size="12" text-anchor="middle" fill="#15201e">PTHR10543</text>

  <!-- propagated terms -->
  <rect x="640" y="126" width="296" height="54" rx="8" fill="#f3eefa" stroke="#7657a3"/>
  <text x="652" y="148" font-size="13" fill="#7657a3" font-weight="bold">Propagated to every member:</text>
  <text x="652" y="168" font-size="12" fill="#15201e">GO:0010436 carotenoid dioxygenase activity</text>

  <!-- branches -->
  <path d="M480,176 L480,200 L200,200 L200,226" fill="none" stroke="#8fa39c" stroke-width="2"/>
  <path d="M480,200 L700,200 L700,226" fill="none" stroke="#8fa39c" stroke-width="2"/>

  <!-- carotenoid clade -->
  <rect x="60" y="226" width="280" height="200" rx="12" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/>
  <text x="200" y="252" font-size="16" text-anchor="middle" font-weight="bold" fill="#1d8a4b">Carotenoid cleavers</text>
  <text x="84" y="286" font-size="14" fill="#15201e">cao-2 (Neurospora, torulene)</text>
  <text x="84" y="312" font-size="14" fill="#56655f">Cco1 (Ustilago, β-carotene)*</text>
  <rect x="84" y="336" width="232" height="30" rx="6" fill="#1d8a4b"/>
  <text x="200" y="356" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">term correct: ACCEPT</text>
  <text x="84" y="400" font-size="12" fill="#56655f">* named on the page as paralog</text>
  <text x="84" y="416" font-size="12" fill="#56655f">control; no review in the repo</text>

  <!-- stilbene clade -->
  <rect x="400" y="226" width="536" height="200" rx="12" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="668" y="252" font-size="16" text-anchor="middle" font-weight="bold" fill="#bd3a30">Stilbene cleavers (6 reviewed)</text>
  <text x="424" y="284" font-size="14" fill="#15201e">cao-1 · Neurospora</text>
  <text x="424" y="306" font-size="14" fill="#15201e">Rco1 · Ustilago</text>
  <text x="620" y="284" font-size="14" fill="#15201e">NOV1, NOV2 · Novosphingobium</text>
  <text x="620" y="306" font-size="14" fill="#15201e">LSD-I, LSD-III · Sphingomonas</text>
  <text x="424" y="326" font-size="12" fill="#56655f">via IBA (GO_REF:0000033)</text>
  <text x="620" y="326" font-size="12" fill="#56655f">via TreeGrafter IEA (GO_REF:0000118)</text>
  <rect x="424" y="342" width="488" height="30" rx="6" fill="#bd3a30"/>
  <text x="668" y="362" font-size="13" text-anchor="middle" fill="#ffffff" font-weight="bold">GO:0010436 carotenoid dioxygenase: REMOVE on all six</text>
  <rect x="424" y="380" width="488" height="30" rx="6" fill="#b8620f"/>
  <text x="668" y="400" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">carotene catabolism: MODIFY ×4 to GO:0046272 stilbene catabolic; REMOVE ×2</text>

  <text x="24" y="470" font-size="14" fill="#15201e">Fix at the family node: annotate a stilbene-cleavage subfamily with a proposed</text>
  <text x="24" y="490" font-size="14" fill="#15201e"><tspan font-style="italic">hydroxystilbene α,β-dioxygenase activity</tspan> grouping term (parent of GO:7770086 and GO:0050054).</text>
</svg>
