<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="36" font-size="18" font-weight="600" fill="#15201e">All 143 NOT annotations on human genes, adjudicated</text>
<text x="30" y="58" font-size="13" fill="#56655f">July 2026 audit, after BRCA2 moved REMOVE → ACCEPT · the grown set now has 188 NOT rows</text>
<text x="230" y="110" text-anchor="end" font-size="14" fill="#15201e">ACCEPT</text>
<rect x="240" y="90" width="571.5" height="28" fill="#1d8a4b"/>
<text x="817.5" y="110" font-size="14" font-weight="600" fill="#15201e">127</text>
<text x="230" y="154" text-anchor="end" font-size="14" fill="#15201e">KEEP_AS_NON_CORE</text>
<rect x="240" y="134" width="36.0" height="28" fill="#56655f"/>
<text x="282.0" y="154" font-size="14" font-weight="600" fill="#15201e">8</text>
<text x="230" y="198" text-anchor="end" font-size="14" fill="#15201e">MARK_AS_OVER_ANNOTATED</text>
<rect x="240" y="178" width="13.5" height="28" fill="#7657a3"/>
<text x="259.5" y="198" font-size="14" font-weight="600" fill="#15201e">3</text>
<text x="230" y="242" text-anchor="end" font-size="14" fill="#15201e">REMOVE</text>
<rect x="240" y="222" width="13.5" height="28" fill="#bd3a30"/>
<text x="259.5" y="242" font-size="14" font-weight="600" fill="#15201e">3</text>
<text x="230" y="286" text-anchor="end" font-size="14" fill="#15201e">UNDECIDED</text>
<rect x="240" y="266" width="9.0" height="28" fill="#8fa39c"/>
<text x="255.0" y="286" font-size="14" font-weight="600" fill="#15201e">2</text>
<rect x="30" y="330" width="900" height="160" rx="12" fill="#f4f7f6" stroke="#8fa39c"/>
<text x="50" y="362" font-size="14" font-weight="600" fill="#15201e">The three REMOVEs are right because the negative itself is wrong:</text>
<text x="50" y="394" font-size="14" fill="#15201e">TOMM40 NOT mitochondrion: it is the core TOM-complex channel.</text>
<text x="50" y="426" font-size="14" fill="#15201e">AGR2 NOT ER-stress response: contradicted by direct positive evidence (PMID:34237462).</text>
<text x="50" y="458" font-size="14" fill="#15201e">AGO3 NOT miRNA silencing: a 2004 negative superseded by 2017 slicer evidence (PMID:29040713).</text>
</svg>