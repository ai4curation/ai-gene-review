<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker></defs>
  <text x="40" y="40" font-size="18" font-weight="600" fill="#0e6b66">An ISO row can fail in two places</text>
  <!-- source -->
  <rect x="40" y="90" width="250" height="130" rx="10" fill="#e8f1ee" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="165" y="116" text-anchor="middle" font-size="13" fill="#56655f">source (donor)</text>
  <text x="165" y="142" text-anchor="middle" font-size="16" font-weight="600" fill="#15201e">human ANG</text>
  <text x="165" y="168" text-anchor="middle" font-size="13" fill="#15201e">angiogenesis (experimental)</text>
  <text x="165" y="190" text-anchor="middle" font-size="13" fill="#15201e">RNase activity</text>
  <!-- edge -->
  <path d="M290 155 H660" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <text x="475" y="140" text-anchor="middle" font-size="14" fill="#0e6b66">ISO · GO_REF:0000119</text>
  <!-- target -->
  <rect x="670" y="90" width="250" height="130" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="795" y="116" text-anchor="middle" font-size="13" fill="#56655f">target</text>
  <text x="795" y="142" text-anchor="middle" font-size="16" font-weight="600" fill="#15201e">mouse Ang2 / Angrp</text>
  <text x="795" y="168" text-anchor="middle" font-size="13" fill="#15201e">divergent paralog:</text>
  <text x="795" y="190" text-anchor="middle" font-size="13" fill="#15201e">RNase yes, angiogenic no</text>
  <!-- checks -->
  <circle cx="165" cy="270" r="20" fill="#b8620f"/><text x="165" y="277" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">1</text>
  <circle cx="475" cy="200" r="20" fill="#bd3a30"/><text x="475" y="207" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">2</text>
  <line x1="165" y1="220" x2="165" y2="250" stroke="#b8620f" stroke-width="2"/>
  <rect x="40" y="310" width="420" height="160" rx="10" fill="#ffffff" stroke="#b8620f"/>
  <text x="56" y="336" font-size="15" font-weight="600" fill="#b8620f">Is the source annotation sound?</text>
  <g font-size="13" fill="#15201e">
    <text x="56" y="362">SOURCE_BAD · miscited, homonym, contradicted</text>
    <text x="56" y="386">SOURCE_STALE_OR_MISSING · gone from donor</text>
    <text x="56" y="410">SOURCE_WEAK_OR_INFERRED</text>
    <text x="56" y="434">EVIDENCE_CIRCULAR_OR_REDUNDANT</text>
    <text x="56" y="458" fill="#56655f">Ang2: 8 of 46 transfers had no current source term</text>
  </g>
  <line x1="475" y1="220" x2="620" y2="310" stroke="#bd3a30" stroke-width="2"/>
  <rect x="500" y="310" width="420" height="160" rx="10" fill="#ffffff" stroke="#bd3a30"/>
  <text x="516" y="336" font-size="15" font-weight="600" fill="#bd3a30">Is this term safe across this edge?</text>
  <g font-size="13" fill="#15201e">
    <text x="516" y="362">PROPAGATION_BAD · paralog, divergence</text>
    <text x="516" y="386">TERM_SCOPING_PROBLEM · too broad / narrow</text>
    <text x="516" y="410">NO_FAILURE_NON_CORE · true but contextual</text>
    <text x="516" y="434">NO_FAILURE_CORE · keep</text>
    <text x="516" y="458" fill="#56655f">Ang2: 41 of 46 ISO rows REMOVE</text>
  </g>
</svg>
