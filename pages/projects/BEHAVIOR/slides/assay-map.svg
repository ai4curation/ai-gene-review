<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker></defs>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">Assay → GO term it can support (at most non-core)</text>
  <text x="30" y="56" font-size="13" fill="#56655f">From projects/BEHAVIOR/impress/behavioural_assay_go_map.yaml (16 assays, ids QuickGO-verified)</text>
  <g font-size="14" fill="#15201e">
    <text x="30" y="92" font-weight="bold" fill="#56655f" font-size="13">ASSAY</text><text x="470" y="92" font-weight="bold" fill="#56655f" font-size="13">GO TERMS LICENSED</text>
    <rect x="30" y="102" width="360" height="30" rx="5" fill="#dcefec"/><text x="42" y="122">Open Field</text><line x1="392" y1="117" x2="462" y2="117" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/><text x="470" y="122">locomotory behavior · exploration behavior</text>
    <rect x="30" y="138" width="360" height="30" rx="5" fill="#dcefec"/><text x="42" y="158">Rotarod</text><line x1="392" y1="153" x2="462" y2="153" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/><text x="470" y="158">motor behavior · locomotory behavior</text>
    <rect x="30" y="174" width="360" height="30" rx="5" fill="#dcefec"/><text x="42" y="194">Fear Conditioning</text><line x1="392" y1="189" x2="462" y2="189" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/><text x="470" y="194">associative learning · behavioral fear response · memory</text>
    <rect x="30" y="210" width="360" height="30" rx="5" fill="#dcefec"/><text x="42" y="230">Hot Plate, Von Frey</text><line x1="392" y1="225" x2="462" y2="225" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/><text x="470" y="230">behavioral response to pain</text>
    <rect x="30" y="246" width="360" height="30" rx="5" fill="#dcefec"/><text x="42" y="266">Sleep-Wake</text><line x1="392" y1="261" x2="462" y2="261" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/><text x="470" y="266">sleep · circadian behavior</text>
    <rect x="30" y="282" width="360" height="30" rx="5" fill="#dcefec"/><text x="42" y="302">Morris Water Maze (not in IMPReSS)</text><line x1="392" y1="297" x2="462" y2="297" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/><text x="470" y="302">memory · learning</text><text x="640" y="302" fill="#bd3a30" font-weight="bold">not swimming behavior</text>
  </g>
  <text x="30" y="350" font-size="16" font-weight="bold" fill="#15201e">Fenced traps</text>
  <g font-size="14" fill="#15201e">
    <rect x="30" y="364" width="280" height="96" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/><text x="44" y="390" font-weight="bold">Grip Strength</text><text x="44" y="412" font-size="13" fill="#56655f">neuromuscular readout;</text><text x="44" y="430" font-size="13" fill="#56655f">no behaviour term</text>
    <rect x="340" y="364" width="280" height="96" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/><text x="354" y="390" font-weight="bold">Tail Suspension</text><text x="354" y="412" font-size="13" fill="#56655f">no GO term for depression-like</text><text x="354" y="430" font-size="13" fill="#56655f">immobility</text>
    <rect x="650" y="364" width="280" height="96" rx="8" fill="#ffffff" stroke="#b8620f" stroke-width="2"/><text x="664" y="390" font-weight="bold">Auditory Brain Stem Response</text><text x="664" y="412" font-size="13" fill="#56655f">electrophysiology: sensory perception</text><text x="664" y="430" font-size="13" fill="#56655f">of sound at most, not auditory behavior</text>
  </g>
  <text x="30" y="495" font-size="13" fill="#56655f">The checker (check_behaviour_assays.py) re-derived the Casp3 swimming case from the assay side.</text>
