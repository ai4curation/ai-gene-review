<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8fa39c"/></marker></defs>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#15201e">From knockout to "behavior": a long causal chain</text>
  <!-- chain -->
  <g font-size="14" text-anchor="middle" fill="#15201e">
    <rect x="30" y="56" width="150" height="56" rx="8" fill="#0e6b66"/><text x="105" y="80" fill="#fff" font-weight="bold">gene product</text><text x="105" y="99" fill="#dcefec" font-size="12">e.g. α-tubulin</text>
    <rect x="215" y="56" width="150" height="56" rx="8" fill="#dcefec" stroke="#0e6b66"/><text x="290" y="80">molecular defect</text><text x="290" y="99" font-size="12" fill="#56655f">microtubules</text>
    <rect x="400" y="56" width="150" height="56" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="475" y="80">cell / tissue</text><text x="475" y="99" font-size="12" fill="#56655f">neuronal migration</text>
    <rect x="585" y="56" width="150" height="56" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="660" y="80">circuit / organ</text><text x="660" y="99" font-size="12" fill="#56655f">brain malformation</text>
    <rect x="770" y="56" width="160" height="56" rx="8" fill="#ffffff" stroke="#7657a3" stroke-width="2"/><text x="850" y="80" font-weight="bold" fill="#7657a3">behaviour</text><text x="850" y="99" font-size="12" fill="#56655f">locomotion (IMP)</text>
    <line x1="182" y1="84" x2="212" y2="84" stroke="#8fa39c" stroke-width="3" marker-end="url(#a)"/>
    <line x1="367" y1="84" x2="397" y2="84" stroke="#8fa39c" stroke-width="3" marker-end="url(#a)"/>
    <line x1="552" y1="84" x2="582" y2="84" stroke="#8fa39c" stroke-width="3" marker-end="url(#a)"/>
    <line x1="737" y1="84" x2="767" y2="84" stroke="#8fa39c" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <text x="30" y="140" font-size="13" fill="#56655f">IMP and IGI record that the phenotype is real; they say nothing about how close the gene sits to it. Mouse Tuba1a: 5 behaviour rows, all kept non-core.</text>
  <!-- rubric -->
  <text x="30" y="178" font-size="17" font-weight="bold" fill="#15201e">The rubric, applied to each behaviour annotation</text>
  <g font-size="14" fill="#15201e">
    <rect x="30" y="192" width="430" height="68" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="46" y="218" font-weight="bold">1. Contradicted by the evidence?</text><text x="46" y="240" font-size="13" fill="#56655f">wrong gene or paralog (verify first)</text>
    <rect x="480" y="206" width="190" height="40" rx="6" fill="#bd3a30"/><text x="575" y="232" text-anchor="middle" fill="#fff" font-weight="bold">REMOVE</text>
    <text x="690" y="224" font-size="13">Agtr1a drinking: IEA/ISO rows</text><text x="690" y="242" font-size="13">removed; IMP/IGI left UNDECIDED</text>

    <rect x="30" y="272" width="430" height="68" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="46" y="298" font-weight="bold">2. Gene acts in the behaving circuit?</text><text x="46" y="320" font-size="13" fill="#56655f">receptor, channel, neuropeptide, clock</text>
    <rect x="480" y="286" width="190" height="40" rx="6" fill="#1d8a4b"/><text x="575" y="312" text-anchor="middle" fill="#fff" font-weight="bold">ACCEPT</text>
    <text x="690" y="304" font-size="13">lov-1, pkd-2 mating; tax-4;</text><text x="690" y="322" font-size="13">CRY circadian; GCG feeding</text>

    <rect x="30" y="352" width="430" height="68" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="46" y="378" font-weight="bold">3. Real but distal phenotype?</text><text x="46" y="400" font-size="13" fill="#56655f">structural, metabolic, ciliary, developmental gene</text>
    <rect x="480" y="366" width="190" height="40" rx="6" fill="#56655f"/><text x="575" y="392" text-anchor="middle" fill="#fff" font-weight="bold">KEEP_AS_NON_CORE</text>
    <text x="690" y="384" font-size="13">Tuba1a, App, nphp-1;</text><text x="690" y="402" font-size="13">the default call</text>

    <rect x="30" y="432" width="430" height="68" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="46" y="458" font-weight="bold">4. Term uselessly broad, or assay mistaken?</text><text x="46" y="480" font-size="13" fill="#56655f">"adult behavior"; the assay's modality taken as function</text>
    <rect x="480" y="446" width="190" height="40" rx="6" fill="#7657a3"/><text x="575" y="472" text-anchor="middle" fill="#fff" font-weight="bold" font-size="12">MARK_AS_OVER_ANNOTATED</text>
    <text x="690" y="464" font-size="13">rat Casp3 swimming behavior</text><text x="690" y="482" font-size="13">(Morris water maze)</text>
  </g>
</svg>
