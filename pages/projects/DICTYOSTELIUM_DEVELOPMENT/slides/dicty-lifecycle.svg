<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="bold" fill="#15201e">~24 h of development, 14 modules, 52 reviewed genes</text>

  <!-- stage pictograms along a timeline -->
  <line x1="40" y1="200" x2="920" y2="200" stroke="#8fa39c" stroke-width="2" marker-end="url(#a)"/>
  <!-- amoebae -->
  <g fill="#dcefec" stroke="#0e6b66" stroke-width="1.5">
    <ellipse cx="70" cy="160" rx="12" ry="8"/><ellipse cx="96" cy="148" rx="10" ry="7"/><ellipse cx="88" cy="176" rx="11" ry="7"/><ellipse cx="116" cy="166" rx="10" ry="7"/>
  </g>
  <text x="92" y="224" font-size="13" text-anchor="middle" fill="#15201e">starving amoebae</text>
  <!-- aggregation streams -->
  <g stroke="#0e6b66" stroke-width="3" fill="none">
    <path d="M200,130 Q230,150 250,165"/><path d="M300,130 Q270,150 255,165"/><path d="M200,190 Q230,178 250,170"/><path d="M305,190 Q275,180 258,170"/>
  </g>
  <circle cx="253" cy="167" r="9" fill="#0e6b66"/>
  <text x="253" y="224" font-size="13" text-anchor="middle" fill="#15201e">aggregation (cAMP waves)</text>
  <!-- mound -->
  <path d="M370,190 Q400,140 430,190 Z" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <circle cx="400" cy="152" r="5" fill="#b8620f"/>
  <text x="400" y="224" font-size="13" text-anchor="middle" fill="#15201e">tipped mound</text>
  <!-- slug -->
  <path d="M490,190 Q500,168 560,172 Q598,174 604,184 Q600,192 560,192 Z" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <path d="M560,172 Q598,174 604,184 Q600,192 560,192 Z" fill="#fff4e8" stroke="#b8620f" stroke-width="2"/>
  <text x="548" y="224" font-size="13" text-anchor="middle" fill="#15201e">slug (prestalk front,</text>
  <text x="548" y="240" font-size="13" text-anchor="middle" fill="#15201e">prespore rear)</text>
  <!-- fruiting body -->
  <line x1="760" y1="192" x2="760" y2="90" stroke="#b8620f" stroke-width="4"/>
  <circle cx="760" cy="82" r="20" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <ellipse cx="760" cy="192" rx="18" ry="5" fill="#fff4e8" stroke="#b8620f"/>
  <text x="760" y="224" font-size="13" text-anchor="middle" fill="#15201e">fruiting body</text>
  <text x="800" y="86" font-size="12" fill="#56655f">spores</text>
  <text x="772" y="150" font-size="12" fill="#56655f">stalk</text>

  <!-- module bands -->
  <g font-size="12">
    <rect x="40" y="268" width="232" height="30" rx="6" fill="#dcefec"/><text x="48" y="287" fill="#15201e">1 Starvation (yakA, pufA, cmfA)</text>
    <rect x="160" y="304" width="340" height="30" rx="6" fill="#0e6b66"/><text x="168" y="323" fill="#ffffff">2 cAMP relay (acaA, carA–D, gpaB, dagA, pkaC, regA)</text>
    <rect x="160" y="340" width="340" height="30" rx="6" fill="#dcefec"/><text x="168" y="359" fill="#15201e">3 Chemotaxis · 12 cGMP / Ca2+ (rasC/G, pten, mhcA, gcA)</text>
    <rect x="200" y="376" width="290" height="30" rx="6" fill="#dcefec"/><text x="208" y="395" fill="#15201e">4 Adhesion, allorecognition (csaA, cadA, tgrB1/C1)</text>
    <rect x="360" y="412" width="345" height="30" rx="6" fill="#fff4e8" stroke="#b8620f"/><text x="368" y="431" fill="#15201e">5 DIF-1 · 6 prestalk / prespore (stlB, dmtA, dimA/B, ecmA)</text>
    <rect x="600" y="268" width="320" height="30" rx="6" fill="#fff4e8" stroke="#b8620f"/><text x="608" y="287" fill="#15201e">7 Stalk death · 10 autophagy (ecmB, cudA, tagC, atg1)</text>
    <rect x="600" y="304" width="320" height="30" rx="6" fill="#dcefec"/><text x="608" y="323" fill="#15201e">8 Spores · 9 culmination SDF-2 (acbA, tagC, dhkA, cotB)</text>
    <rect x="240" y="448" width="250" height="30" rx="6" fill="#dcefec"/><text x="248" y="467" fill="#15201e">11 Group size (smlA, ctnA)</text>
    <rect x="500" y="448" width="200" height="30" rx="6" fill="#dcefec"/><text x="508" y="467" fill="#15201e">14 Slug / tip (tipA)</text>
    <rect x="40" y="484" width="880" height="26" rx="6" fill="#e8f1ee"/><text x="48" y="502" fill="#15201e">13 Transcriptional network throughout (gbfA, gtaC, statA/C, srfA, dimA/B, cudA)</text>
  </g>
</svg>
