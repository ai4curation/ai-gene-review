<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="36" font-size="16" font-weight="600" fill="#15201e">The reaction GO:0102067 describes (EC 1.3.1.83, RHEA:26229)</text>
  <!-- GGPP: four isoprene units -->
  <text x="40" y="92" font-size="15" font-weight="600" fill="#15201e">geranylgeranyl diphosphate (GGPP)</text>
  <g stroke="#15201e" stroke-width="2.4" fill="none">
    <polyline points="60,150 100,130 140,150 180,130 220,150 260,130 300,150 340,130 380,150 420,130 460,150 500,130 540,150 580,130 620,150 660,130"/>
  </g>
  <g stroke="#bd3a30" stroke-width="2.4">
    <line x1="104" y1="140" x2="136" y2="156"/>
    <line x1="264" y1="140" x2="296" y2="156"/>
    <line x1="424" y1="140" x2="456" y2="156"/>
  </g>
  <line x1="584" y1="140" x2="616" y2="156" stroke="#1d8a4b" stroke-width="2.4"/>
  <rect x="664" y="116" width="60" height="28" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="694" y="135" font-size="13" text-anchor="middle">OPP</text>
  <text x="60" y="188" font-size="12.5" fill="#bd3a30">3 double bonds reduced</text>
  <text x="560" y="188" font-size="12.5" fill="#1d8a4b">allylic C2=C3 kept</text>
  <!-- arrow -->
  <path d="M360 210 L360 290" stroke="#15201e" stroke-width="2" marker-end="url(#a)"/>
  <rect x="390" y="224" width="240" height="52" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="510" y="246" font-size="14" text-anchor="middle" font-weight="600" fill="#0e6b66">CHLP / ChlP / GGR</text>
  <text x="510" y="265" font-size="12.5" text-anchor="middle" fill="#15201e">3 NADPH + 3 H+ → 3 NADP+</text>
  <!-- phytyl-PP -->
  <text x="40" y="330" font-size="15" font-weight="600" fill="#15201e">phytyl diphosphate</text>
  <g stroke="#15201e" stroke-width="2.4" fill="none">
    <polyline points="60,390 100,370 140,390 180,370 220,390 260,370 300,390 340,370 380,390 420,370 460,390 500,370 540,390 580,370 620,390 660,370"/>
  </g>
  <line x1="584" y1="380" x2="616" y2="396" stroke="#1d8a4b" stroke-width="2.4"/>
  <rect x="664" y="356" width="60" height="28" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="694" y="375" font-size="13" text-anchor="middle">OPP</text>
  <!-- outputs -->
  <path d="M730 370 L790 330" stroke="#15201e" stroke-width="1.8" marker-end="url(#a)"/>
  <path d="M730 380 L790 420" stroke="#15201e" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="798" y="330" font-size="14" fill="#15201e">chlorophyll</text>
  <text x="798" y="346" font-size="12" fill="#56655f">phytol tail</text>
  <text x="798" y="428" font-size="14" fill="#15201e">tocopherols</text>
  <text x="780" y="140" font-size="12" fill="#56655f">also acts on</text>
  <text x="780" y="156" font-size="12" fill="#56655f">geranylgeranyl-</text>
  <text x="780" y="172" font-size="12" fill="#56655f">chlorophyll a</text>
  <text x="40" y="490" font-size="12.5" fill="#56655f">Chain drawn schematically (skeletal, methyl branches omitted). Plastid enzyme of plants and cyanobacteria.</text>
</svg>
