<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="36" font-size="21" font-weight="bold" fill="#15201e">TDMD: a ligase that reads a trigger-bound AGO-miRNA complex</text>
<g font-size="13">
<!-- AGO -->
<ellipse cx="200" cy="270" rx="120" ry="85" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
<text x="200" y="215" text-anchor="middle" font-weight="bold" fill="#0e6b66" font-size="15">AGO1-4</text>
<!-- miRNA and trigger -->
<path d="M120 265 H280" stroke="#bd3a30" stroke-width="5"/>
<text x="200" y="255" text-anchor="middle" fill="#bd3a30" font-weight="bold">miRNA</text>
<path d="M60 290 H120 C 150 290, 150 292, 280 290 H350" stroke="#1d68b3" stroke-width="5" fill="none"/>
<g stroke="#1d68b3" stroke-width="2"><line x1="135" y1="268" x2="135" y2="288"/><line x1="160" y1="268" x2="160" y2="288"/><line x1="185" y1="268" x2="185" y2="288"/><line x1="210" y1="268" x2="210" y2="288"/><line x1="235" y1="268" x2="235" y2="288"/><line x1="260" y1="268" x2="260" y2="288"/></g>
<text x="200" y="315" text-anchor="middle" fill="#1d68b3" font-weight="bold">trigger RNA</text>
<text x="200" y="333" text-anchor="middle" fill="#56655f">highly complementary</text>
<text x="60" y="400" fill="#56655f">e.g. CYRANO → miR-7, NREP → miR-29b,</text>
<text x="60" y="418" fill="#56655f">SERPINE1 → miR-30b/c (context only)</text>
<!-- ligase -->
<rect x="420" y="190" width="120" height="60" rx="10" fill="#0e6b66"/>
<text x="480" y="217" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="15">ZSWIM8</text>
<text x="480" y="236" text-anchor="middle" fill="#dcefec">substrate receptor</text>
<rect x="430" y="255" width="50" height="34" rx="6" fill="#dcefec" stroke="#0e6b66"/><text x="455" y="277" text-anchor="middle" fill="#15201e">ELOB</text>
<rect x="485" y="255" width="50" height="34" rx="6" fill="#dcefec" stroke="#0e6b66"/><text x="510" y="277" text-anchor="middle" fill="#15201e">ELOC</text>
<rect x="545" y="215" width="230" height="40" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="660" y="240" text-anchor="middle" fill="#15201e" font-weight="bold">CUL3 scaffold</text>
<rect x="780" y="210" width="60" height="50" rx="8" fill="#ffffff" stroke="#8fa39c"/><text x="810" y="240" text-anchor="middle" fill="#56655f">RBX1</text>
<rect x="760" y="290" width="110" height="50" rx="8" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
<text x="815" y="313" text-anchor="middle" fill="#b8620f" font-weight="bold">ARIH1</text>
<text x="815" y="330" text-anchor="middle" fill="#56655f">partner E3</text>
<path d="M418 225 C 370 225, 340 240, 318 250" stroke="#0e6b66" stroke-width="3" fill="none"/>
<polygon points="322,242 312,254 327,255" fill="#0e6b66"/>
<text x="300" y="150" fill="#0e6b66">ZSWIM8 recognizes the</text>
<text x="300" y="166" fill="#0e6b66">trigger-bound complex</text>
<!-- ubiquitin -->
<g fill="#7657a3"><circle cx="300" cy="360" r="9"/><circle cx="318" cy="372" r="9"/><circle cx="336" cy="384" r="9"/><circle cx="354" cy="396" r="9"/></g>
<text x="372" y="400" fill="#7657a3" font-weight="bold">AGO polyubiquitylation</text>
<path d="M760 320 C 600 360, 450 370, 372 380" stroke="#b8620f" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
<!-- outcome -->
<rect x="560" y="400" width="370" height="90" rx="10" fill="#ffffff" stroke="#15201e"/>
<text x="575" y="426" fill="#15201e" font-weight="bold">Outcome</text>
<text x="575" y="448" fill="#15201e">AGO turned over by the proteasome;</text>
<text x="575" y="468" fill="#15201e">the released miRNA is degraded</text>
<text x="575" y="484" fill="#56655f">GO:0140958 target-directed miRNA degradation</text>
</g>
</svg>
