<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
  </defs>

  <!-- compartments -->
  <text x="24" y="28" font-size="13" fill="#56655f">cytosol (precursors from ribosomes)</text>
  <rect x="16" y="140" width="928" height="22" fill="#dcefec" stroke="#8fa39c"/>
  <text x="936" y="134" text-anchor="end" font-size="12" fill="#56655f">outer membrane</text>
  <text x="936" y="186" text-anchor="end" font-size="12" fill="#56655f">intermembrane space</text>
  <rect x="16" y="290" width="928" height="22" fill="#dcefec" stroke="#8fa39c"/>
  <rect x="16" y="312" width="928" height="196" fill="#f3f6f5"/>
  <text x="24" y="500" font-size="12" fill="#56655f">matrix</text>

  <!-- OM machines -->
  <rect x="36" y="130" width="100" height="42" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="86" y="156" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">MTCH2</text>
  <rect x="160" y="130" width="140" height="42" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="230" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">SAM</text>
  <text x="230" y="165" text-anchor="middle" font-size="11" fill="#56655f">SAMM50 · MTX1 · MTX2</text>
  <rect x="330" y="126" width="210" height="50" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="435" y="147" text-anchor="middle" font-size="15" font-weight="700" fill="#15201e">TOM</text>
  <text x="435" y="165" text-anchor="middle" font-size="11" fill="#56655f">TOMM40 · 20 · 22 · 70 · 5 · 6 · 7</text>

  <!-- IMS -->
  <rect x="580" y="200" width="150" height="40" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="655" y="218" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">MIA</text>
  <text x="655" y="233" text-anchor="middle" font-size="11" fill="#56655f">CHCHD4 · GFER</text>

  <!-- IM machines -->
  <rect x="330" y="280" width="180" height="42" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="420" y="299" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">TIM23</text>
  <text x="420" y="315" text-anchor="middle" font-size="11" fill="#56655f">TIMM23 · 17A · 50 · 21</text>
  <rect x="610" y="280" width="110" height="42" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="665" y="306" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">TIM22</text>
  <rect x="770" y="280" width="120" height="42" rx="8" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="4 3"/>
  <text x="830" y="299" text-anchor="middle" font-size="13" fill="#56655f">OXA1L</text>
  <text x="830" y="315" text-anchor="middle" font-size="10" fill="#56655f">export, not import</text>

  <!-- matrix -->
  <rect x="330" y="350" width="180" height="40" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="420" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">PAM motor</text>
  <text x="420" y="383" text-anchor="middle" font-size="11" fill="#56655f">HSPA9 · TIMM44 · PAM16</text>
  <rect x="330" y="402" width="180" height="40" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.6"/>
  <text x="420" y="420" text-anchor="middle" font-size="14" font-weight="700" fill="#15201e">MPP</text>
  <text x="420" y="435" text-anchor="middle" font-size="11" fill="#56655f">PMPCA · PMPCB clip presequence</text>

  <!-- arrows -->
  <g stroke="#0e6b66" stroke-width="2.2" fill="none">
    <path d="M86 50 L86 126" marker-end="url(#a)"/>
    <path d="M435 50 L435 122" marker-end="url(#a)"/>
    <path d="M360 178 C 330 240, 250 240, 232 176" marker-end="url(#a)"/>
    <path d="M520 178 L 578 212" marker-end="url(#a)"/>
    <path d="M540 168 C 780 180, 770 250, 692 278" marker-end="url(#a)"/>
    <path d="M420 178 L 420 276" marker-end="url(#a)"/>
    <path d="M420 324 L 420 346" marker-end="url(#a)"/>
    <path d="M512 301 L 600 301" stroke-dasharray="5 3" marker-end="url(#a)"/>
  </g>
  <g font-size="13" font-weight="700" fill="#0e6b66">
    <text x="94" y="92">①</text>
    <text x="262" y="246">②</text>
    <text x="548" y="186">③</text>
    <text x="762" y="236">④</text>
    <text x="428" y="250">⑤</text>
    <text x="548" y="296">⑥</text>
  </g>
  <text x="444" y="92" font-size="12" fill="#0e6b66">most precursors</text>

  <!-- legend of GO terms -->
  <g font-size="12" fill="#15201e">
    <text x="560" y="352" font-weight="700" fill="#0e6b66">GO:7770058 mitochondrial protein import pathway</text>
    <text x="560" y="374">① α-helical OM insertion · GO:7770059</text>
    <text x="560" y="394">② β-barrel OM insertion · GO:7770063</text>
    <text x="560" y="414">③ IMS disulfide relay · GO:0160203</text>
    <text x="560" y="434">④ TIM22 IM insertion · GO:7770061</text>
    <text x="560" y="454">⑤ matrix import (TIM23-PAM) · GO:0030150</text>
    <text x="560" y="474">⑥ TIM23-SORT lateral IM insertion · GO:7770060</text>
  </g>
  <text x="936" y="332" text-anchor="end" font-size="12" fill="#56655f">inner membrane</text>
</svg>
