<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bd3a30"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#15201e">Electron flow in the AhpC/AhpF system (GO:0009321 complex)</text>
  <!-- NADH -->
  <rect x="40" y="200" width="140" height="80" rx="12" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="110" y="236" text-anchor="middle" font-size="20" font-weight="600" fill="#15201e">NADH</text>
  <text x="110" y="260" text-anchor="middle" font-size="13" fill="#56655f">→ NAD+</text>
  <path d="M182 240 L268 240" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <text x="225" y="228" text-anchor="middle" font-size="13" fill="#0e6b66">2 e-</text>
  <!-- AhpF -->
  <rect x="272" y="150" width="220" height="180" rx="14" fill="#dcefec" stroke="#0e6b66" stroke-width="1.8"/>
  <text x="382" y="182" text-anchor="middle" font-size="20" font-weight="600" fill="#0e6b66">AhpF</text>
  <text x="382" y="208" text-anchor="middle" font-size="14" fill="#15201e">FAD-containing</text>
  <text x="382" y="228" text-anchor="middle" font-size="14" fill="#15201e">disulfide reductase</text>
  <text x="382" y="262" text-anchor="middle" font-size="12.5" fill="#56655f">ECOLI review: GO:0047134</text>
  <text x="382" y="282" text-anchor="middle" font-size="12.5" fill="#56655f">contributes_to GO:0102039</text>
  <text x="382" y="310" text-anchor="middle" font-size="12" fill="#56655f">AhpF reviewed; AhpC gap remains</text>
  <path d="M494 240 L580 240" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <text x="537" y="228" text-anchor="middle" font-size="13" fill="#0e6b66">reduces</text>
  <!-- AhpC -->
  <rect x="584" y="150" width="200" height="180" rx="14" fill="#e8f1ee" stroke="#0e6b66" stroke-width="1.4"/>
  <text x="684" y="182" text-anchor="middle" font-size="20" font-weight="600" fill="#0e6b66">AhpC</text>
  <text x="684" y="208" text-anchor="middle" font-size="14" fill="#15201e">peroxiredoxin</text>
  <text x="684" y="228" text-anchor="middle" font-size="14" fill="#15201e">(oxidized ⇄ reduced)</text>
  <text x="684" y="262" text-anchor="middle" font-size="12" fill="#56655f">P. putida ahpC review:</text>
  <text x="684" y="280" text-anchor="middle" font-size="12" fill="#56655f">IEA GO:0102039 → MODIFY to</text>
  <text x="684" y="298" text-anchor="middle" font-size="12" fill="#56655f">GO:0051920 peroxiredoxin activity</text>
  <!-- peroxide -->
  <path d="M786 240 L850 240" stroke="#bd3a30" stroke-width="3" marker-end="url(#r)"/>
  <rect x="852" y="190" width="90" height="100" rx="12" fill="#fbeceb" stroke="#bd3a30"/>
  <text x="897" y="228" text-anchor="middle" font-size="16" font-weight="600" fill="#15201e">ROOH</text>
  <text x="897" y="252" text-anchor="middle" font-size="13" fill="#56655f">↓</text>
  <text x="897" y="274" text-anchor="middle" font-size="15" fill="#15201e">ROH + H2O</text>
  <!-- bracket: system = EC 1.11.1.26 -->
  <path d="M272 380 L272 400 L784 400 L784 380" stroke="#0e6b66" stroke-width="1.6" fill="none"/>
  <text x="528" y="428" text-anchor="middle" font-size="15" fill="#0e6b66">together: NADH-dependent peroxiredoxin activity, EC 1.11.1.26 (GO:0102039)</text>
  <text x="480" y="480" text-anchor="middle" font-size="13" fill="#56655f">The obsoletion changes the term, not the biology: peroxide reduction driven by NADH is the same reaction family.</text>
</svg>
