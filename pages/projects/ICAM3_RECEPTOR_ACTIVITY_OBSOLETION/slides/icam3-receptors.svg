<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="36" font-size="16" font-weight="600" fill="#15201e">One ligand, structurally unrelated receptors</text>
  <!-- top cell: ICAM3-expressing leukocyte -->
  <rect x="40" y="70" width="880" height="24" fill="#e8f1ee" stroke="#56655f"/>
  <text x="50" y="62" font-size="13" font-weight="600" fill="#56655f">leukocyte expressing ICAM3 (CD50)</text>
  <!-- bottom cell -->
  <rect x="40" y="430" width="880" height="24" fill="#dcefec" stroke="#0e6b66"/>
  <text x="50" y="478" font-size="13" font-weight="600" fill="#0e6b66">receptor-bearing cell (T cell, DC, sinusoidal endothelium)</text>
  <!-- ICAM3 molecules: chain of Ig domains hanging down -->
  <g fill="#ffffff" stroke="#1d68b3" stroke-width="2">
    <ellipse cx="200" cy="116" rx="14" ry="18"/><ellipse cx="200" cy="152" rx="14" ry="18"/><ellipse cx="200" cy="188" rx="14" ry="18"/><ellipse cx="200" cy="224" rx="14" ry="18"/><ellipse cx="200" cy="260" rx="14" ry="18"/>
    <ellipse cx="480" cy="116" rx="14" ry="18"/><ellipse cx="480" cy="152" rx="14" ry="18"/><ellipse cx="480" cy="188" rx="14" ry="18"/><ellipse cx="480" cy="224" rx="14" ry="18"/><ellipse cx="480" cy="260" rx="14" ry="18"/>
    <ellipse cx="760" cy="116" rx="14" ry="18"/><ellipse cx="760" cy="152" rx="14" ry="18"/><ellipse cx="760" cy="188" rx="14" ry="18"/><ellipse cx="760" cy="224" rx="14" ry="18"/><ellipse cx="760" cy="260" rx="14" ry="18"/>
  </g>
  <text x="222" y="200" font-size="12" fill="#1d68b3">ICAM3</text>
  <!-- glycans on third -->
  <g stroke="#b8620f" stroke-width="2" fill="#b8620f">
    <line x1="774" y1="190" x2="800" y2="182"/><circle cx="804" cy="181" r="4"/><circle cx="812" cy="174" r="4"/><circle cx="812" cy="188" r="4"/>
    <line x1="774" y1="226" x2="800" y2="234"/><circle cx="804" cy="235" r="4"/><circle cx="812" cy="228" r="4"/><circle cx="812" cy="242" r="4"/>
  </g>
  <text x="820" y="150" font-size="12" fill="#b8620f">high-mannose</text>
  <text x="820" y="164" font-size="12" fill="#b8620f">glycans</text>
  <!-- LFA-1 heterodimer -->
  <g>
    <path d="M186 430 L186 330 Q186 296 200 290" stroke="#0e6b66" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M214 430 L214 330 Q214 300 206 292" stroke="#7657a3" stroke-width="10" fill="none" stroke-linecap="round"/>
    <text x="120" y="360" font-size="13" fill="#0e6b66" font-weight="600">αL</text>
    <text x="226" y="360" font-size="13" fill="#7657a3" font-weight="600">β2</text>
    <text x="250" y="410" font-size="13" fill="#15201e" font-weight="600">LFA-1</text>
    <text x="200" y="500" font-size="12" text-anchor="middle" fill="#56655f">ITGAL + ITGB2 · IMP</text>
  </g>
  <!-- aD/b2 -->
  <g>
    <path d="M466 430 L466 330 Q466 296 480 290" stroke="#1d8a4b" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M494 430 L494 330 Q494 300 486 292" stroke="#7657a3" stroke-width="10" fill="none" stroke-linecap="round"/>
    <text x="400" y="360" font-size="13" fill="#1d8a4b" font-weight="600">αD</text>
    <text x="506" y="360" font-size="13" fill="#7657a3" font-weight="600">β2</text>
    <text x="530" y="410" font-size="13" fill="#15201e" font-weight="600">αD/β2</text>
    <text x="480" y="500" font-size="12" text-anchor="middle" fill="#56655f">ITGAD + ITGB2 · no GO:0030369 row</text>
  </g>
  <!-- lectin tetramer -->
  <g>
    <path d="M840 430 L840 262" stroke="#b8620f" stroke-width="6"/>
    <circle cx="826" cy="250" r="12" fill="#fdf1e6" stroke="#b8620f" stroke-width="2"/>
    <circle cx="844" cy="240" r="12" fill="#fdf1e6" stroke="#b8620f" stroke-width="2"/>
    <circle cx="848" cy="262" r="12" fill="#fdf1e6" stroke="#b8620f" stroke-width="2"/>
    <text x="828" y="360" font-size="13" fill="#b8620f" font-weight="600" text-anchor="end">C-type lectin</text>
    <text x="828" y="410" font-size="13" text-anchor="end" fill="#15201e" font-weight="600">CLEC4M / CD209</text>
    <text x="760" y="500" font-size="12" text-anchor="middle" fill="#56655f">CLEC4M · NAS · glycan-dependent</text>
  </g>
  <text x="330" y="160" font-size="12.5" fill="#56655f" text-anchor="middle">integrins bind the</text>
  <text x="330" y="176" font-size="12.5" fill="#56655f" text-anchor="middle">ICAM3 protein</text>
  <text x="620" y="160" font-size="12.5" fill="#56655f" text-anchor="middle">lectins bind its</text>
  <text x="620" y="176" font-size="12.5" fill="#56655f" text-anchor="middle">sugars</text>
</svg>
