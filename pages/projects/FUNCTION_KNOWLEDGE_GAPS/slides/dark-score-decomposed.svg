<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="36" font-size="18" font-weight="600" fill="#15201e">What a "no molecular function" score actually flags</text>
<text x="30" y="58" font-size="13" fill="#56655f">conserved subset of the ~14% of ~2,100 reviewed genes the score called MF-dark · triage-grade shares from the project page</text>
<rect x="30" y="80" width="900" height="70" rx="6" fill="#dcefec" stroke="#0e6b66"/>
<text x="480" y="112" text-anchor="middle" font-size="17" font-weight="600" fill="#0e6b66">score: gene has no specific molecular function in core_functions</text>
<text x="480" y="134" text-anchor="middle" font-size="13" fill="#56655f">looks like the unknome (Wood ~20%, Unknome 23%)</text>
<rect x="30" y="190" width="582" height="80" fill="#7657a3" fill-opacity="0.85"/>
<text x="321" y="238" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff">64%</text>
<rect x="612" y="190" width="127" height="80" fill="#b8620f" fill-opacity="0.85"/>
<text x="675" y="238" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff">14%</text>
<rect x="739" y="190" width="27" height="80" fill="#8fa39c" fill-opacity="0.85"/>
<rect x="766" y="190" width="164" height="80" fill="#1d68b3" fill-opacity="0.85"/>
<text x="848" y="238" text-anchor="middle" font-size="22" font-weight="600" fill="#ffffff">18%</text>
<path d="M480 150 L480 186" stroke="#56655f" stroke-width="1.5"/>
<rect x="40" y="310" width="18" height="18" fill="#7657a3"/>
<text x="70" y="324" font-size="15" fill="#15201e"><tspan font-weight="600">64%</tspan>  Structural / accessory subunits</text>
<text x="560" y="324" font-size="14" fill="#7657a3" font-weight="600">fixed by: ONTOLOGY</text>
<rect x="40" y="350" width="18" height="18" fill="#b8620f"/>
<text x="70" y="364" font-size="15" fill="#15201e"><tspan font-weight="600">14%</tspan>  MF term not filled</text>
<text x="560" y="364" font-size="14" fill="#b8620f" font-weight="600">fixed by: CURATION</text>
<rect x="40" y="390" width="18" height="18" fill="#8fa39c"/>
<text x="70" y="404" font-size="15" fill="#15201e"><tspan font-weight="600">3%</tspan>  Stub reviews</text>
<text x="560" y="404" font-size="14" fill="#8fa39c" font-weight="600">fixed by: hygiene</text>
<rect x="40" y="430" width="18" height="18" fill="#1d68b3"/>
<text x="70" y="444" font-size="15" fill="#15201e"><tspan font-weight="600">18%</tspan>  Genuinely unknown mechanism</text>
<text x="560" y="444" font-size="14" fill="#1d68b3" font-weight="600">fixed by: EXPERIMENT</text>
<text x="40" y="490" font-size="14" fill="#15201e">Only about one in five is real ignorance. <tspan font-weight="600">So a gap is called by reading, not by counting.</tspan></text>
</svg>