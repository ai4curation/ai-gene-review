<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="19" font-weight="600" fill="#15201e">Three obligate pairs, one failure mode: the fold decides the annotation</text>
  <g font-family="Helvetica, Arial, sans-serif">
  <!-- column template: x offsets 30, 340, 650 ; width 280 -->
  <!-- PqsBC -->
  <g transform="translate(30 60)">
    <text x="140" y="16" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">PqsB / PqsC</text>
    <text x="140" y="34" text-anchor="middle" font-size="11" fill="#56655f">P. aeruginosa quinolone signal · PDB 5DWZ · ipTM 0.95</text>
    <path d="M40 60 h90 a20 20 0 0 1 20 20 v70 a20 20 0 0 1 -20 20 h-90 a20 20 0 0 1 -20 -20 v-70 a20 20 0 0 1 20 -20z" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
    <text x="85" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#b8620f">PqsB</text>
    <text x="85" y="122" text-anchor="middle" font-size="10" fill="#15201e">no active site</text>
    <path d="M150 60 h90 a20 20 0 0 1 20 20 v70 a20 20 0 0 1 -20 20 h-90 z" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
    <text x="205" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#0e6b66">PqsC</text>
    <text x="205" y="122" text-anchor="middle" font-size="10" fill="#15201e">Cys129 / His269</text>
    <circle cx="205" cy="140" r="6" fill="#0e6b66"/>
    <text x="85" y="200" text-anchor="middle" font-size="11" fill="#7657a3">OVER-ANNOTATED</text>
    <text x="85" y="214" text-anchor="middle" font-size="11" fill="#15201e">acyltransferase</text>
    <text x="205" y="200" text-anchor="middle" font-size="11" fill="#bd3a30">REMOVE fatty acid</text>
    <text x="205" y="214" text-anchor="middle" font-size="11" fill="#bd3a30">biosynthesis</text>
    <text x="205" y="232" text-anchor="middle" font-size="11" fill="#b8620f">MODIFY 3-oxoacyl-ACP</text>
    <text x="205" y="246" text-anchor="middle" font-size="11" fill="#b8620f">synthase</text>
    <text x="140" y="280" text-anchor="middle" font-size="11" fill="#1d68b3">no GO term for EC 2.3.1.230:</text>
    <text x="140" y="294" text-anchor="middle" font-size="11" fill="#1d68b3">new term proposed</text>
  </g>
  <!-- KS-CLF -->
  <g transform="translate(340 60)">
    <text x="140" y="16" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">KSα / KSβ-CLF</text>
    <text x="140" y="34" text-anchor="middle" font-size="11" fill="#56655f">S. coelicolor actinorhodin · PDB 1TQY · ipTM 0.96</text>
    <path d="M40 60 h90 v110 h-90 a20 20 0 0 1 -20 -20 v-70 a20 20 0 0 1 20 -20z" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
    <text x="85" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#0e6b66">actI-ORF1</text>
    <text x="85" y="122" text-anchor="middle" font-size="10" fill="#15201e">KSα, catalytic</text>
    <circle cx="85" cy="140" r="6" fill="#0e6b66"/>
    <path d="M150 60 h90 a20 20 0 0 1 20 20 v70 a20 20 0 0 1 -20 20 h-90 a20 20 0 0 1 -20 -20 v-70 a20 20 0 0 1 20 -20z" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
    <text x="205" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#b8620f">actI-ORF2</text>
    <text x="205" y="122" text-anchor="middle" font-size="10" fill="#15201e">CLF, no active site</text>
    <text x="85" y="200" text-anchor="middle" font-size="11" fill="#b8620f">MODIFY fatty-acid terms</text>
    <text x="85" y="214" text-anchor="middle" font-size="11" fill="#b8620f">→ polyketide synthase</text>
    <text x="85" y="232" text-anchor="middle" font-size="11" fill="#bd3a30">REMOVE fatty acid</text>
    <text x="85" y="246" text-anchor="middle" font-size="11" fill="#bd3a30">elongation</text>
    <text x="205" y="200" text-anchor="middle" font-size="11" fill="#7657a3">OVER-ANNOTATED</text>
    <text x="205" y="214" text-anchor="middle" font-size="11" fill="#15201e">acyltransferase (×2)</text>
    <text x="140" y="280" text-anchor="middle" font-size="11" fill="#1d68b3">"chain length factor activity"</text>
    <text x="140" y="294" text-anchor="middle" font-size="11" fill="#1d68b3">proposed</text>
  </g>
  <!-- Ery -->
  <g transform="translate(650 60)">
    <text x="140" y="16" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">EryCIII / EryCII</text>
    <text x="140" y="34" text-anchor="middle" font-size="11" fill="#56655f">S. erythraea erythromycin · PDB 2YJN · ipTM 0.92</text>
    <path d="M40 60 h90 v110 h-90 a20 20 0 0 1 -20 -20 v-70 a20 20 0 0 1 20 -20z" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
    <text x="85" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#0e6b66">EryCIII</text>
    <text x="85" y="122" text-anchor="middle" font-size="10" fill="#15201e">desosaminyl GT</text>
    <circle cx="85" cy="140" r="6" fill="#0e6b66"/>
    <path d="M150 60 h90 a20 20 0 0 1 20 20 v70 a20 20 0 0 1 -20 20 h-90 a20 20 0 0 1 -20 -20 v-70 a20 20 0 0 1 20 -20z" fill="#ffffff" stroke="#b8620f" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="205" y="104" text-anchor="middle" font-size="14" font-weight="600" fill="#b8620f">EryCII</text>
    <text x="205" y="122" text-anchor="middle" font-size="10" fill="#15201e">P450 fold, no heme</text>
    <text x="85" y="200" text-anchor="middle" font-size="11" fill="#bd3a30">REMOVE UDP-GT</text>
    <text x="85" y="214" text-anchor="middle" font-size="11" fill="#15201e">(donor is TDP-sugar)</text>
    <text x="205" y="200" text-anchor="middle" font-size="11" fill="#bd3a30">REMOVE monooxygenase,</text>
    <text x="205" y="214" text-anchor="middle" font-size="11" fill="#bd3a30">heme, iron, oxidoreductase</text>
    <text x="205" y="232" text-anchor="middle" font-size="11" fill="#1d68b3">NEW enzyme activator</text>
    <text x="205" y="246" text-anchor="middle" font-size="11" fill="#1d68b3">activity</text>
  </g>
  </g>
  <!-- legend -->
  <g transform="translate(120 400)">
    <rect width="720" height="92" rx="10" fill="#f4f7f6" stroke="#8fa39c"/>
    <rect x="20" y="22" width="28" height="20" rx="4" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
    <circle cx="34" cy="32" r="4" fill="#0e6b66"/>
    <text x="58" y="37" font-size="12" fill="#15201e">catalytic subunit (dot = active site)</text>
    <rect x="300" y="22" width="28" height="20" rx="4" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
    <text x="338" y="37" font-size="12" fill="#15201e">non-catalytic partner or pseudoenzyme</text>
    <text x="20" y="72" font-size="12" fill="#56655f">Pattern: the partner inherits the catalytic MF of its fold; the catalytic subunit inherits fatty-acid or UDP terms from its family.</text>
  </g>
</svg>
