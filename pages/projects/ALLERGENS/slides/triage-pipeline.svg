<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="38" font-size="21" font-weight="bold" fill="#15201e">A triage layer that feeds ordinary function review</text>
<g font-size="13">
<!-- sources -->
<rect x="30" y="80" width="200" height="90" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="45" y="104" font-weight="bold" fill="#15201e" font-size="14">UniProt KW-0020</text>
<text x="45" y="126" fill="#15201e">"Allergen" keyword</text>
<text x="45" y="146" fill="#56655f">1,020 reviewed entries</text>
<text x="45" y="162" fill="#56655f">624 molecules (2026_02)</text>
<rect x="30" y="200" width="200" height="90" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="45" y="224" font-weight="bold" fill="#15201e" font-size="14">IEDB IQ-API</text>
<text x="45" y="246" fill="#15201e">epitopes, IgE flag</text>
<text x="45" y="266" fill="#56655f">joined by allergen name</text>
<text x="45" y="282" fill="#56655f">within source taxon</text>
<rect x="30" y="320" width="200" height="90" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="45" y="344" font-weight="bold" fill="#15201e" font-size="14">Gene reviews</text>
<text x="45" y="366" fill="#15201e">core functions,</text>
<text x="45" y="386" fill="#15201e">knowledge gaps</text>
<!-- index -->
<rect x="330" y="170" width="220" height="150" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="440" y="200" text-anchor="middle" font-weight="bold" fill="#0e6b66" font-size="15">allergen_index.tsv</text>
<text x="440" y="226" text-anchor="middle" fill="#15201e">molecule ↔ gene bridge</text>
<text x="440" y="246" text-anchor="middle" fill="#56655f">Fel d 1 = CH1 + CH2</text>
<text x="440" y="274" text-anchor="middle" fill="#15201e">32 genes · 31 molecules</text>
<text x="440" y="296" text-anchor="middle" fill="#56655f">gap flag × epitope load</text>
<g stroke="#0e6b66" stroke-width="2.5" fill="none"><path d="M230 125 C 290 125, 290 210, 328 210"/><path d="M230 245 H328"/><path d="M230 365 C 290 365, 290 280, 328 280"/></g>
<!-- worklist -->
<rect x="330" y="360" width="220" height="80" rx="8" fill="#ffffff" stroke="#8fa39c"/>
<text x="440" y="388" text-anchor="middle" font-weight="bold" fill="#15201e" font-size="14">allergen_worklist.tsv</text>
<text x="440" y="410" text-anchor="middle" fill="#56655f">1,014 not yet fetched,</text>
<text x="440" y="428" text-anchor="middle" fill="#56655f">each with a fetch-gene command</text>
<line x1="230" y1="140" x2="328" y2="390" stroke="#8fa39c" stroke-width="2" stroke-dasharray="5 4"/>
<!-- decision -->
<line x1="550" y1="245" x2="625" y2="245" stroke="#0e6b66" stroke-width="3"/><polygon points="625,238 640,245 625,252" fill="#0e6b66"/>
<rect x="645" y="90" width="290" height="130" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
<text x="660" y="116" font-weight="bold" fill="#bd3a30" font-size="14">High load + unknown function</text>
<text x="660" y="140" fill="#15201e">Bet v 1 · Fel d 1 · Can f 1</text>
<text x="660" y="164" fill="#15201e">curate and record the gap:</text>
<text x="660" y="184" fill="#15201e">"what do we lose if we</text>
<text x="660" y="204" fill="#15201e">knock it out?"</text>
<rect x="645" y="270" width="290" height="130" rx="8" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/>
<text x="660" y="296" font-weight="bold" fill="#1d8a4b" font-size="14">High load + known function</text>
<text x="660" y="320" fill="#15201e">Der p 1 (cysteine protease)</text>
<text x="660" y="342" fill="#15201e">Der p 2 (MD-2 mimic, TLR4)</text>
<text x="660" y="366" fill="#15201e">document function;</text>
<text x="660" y="386" fill="#15201e">lower review priority</text>
<text x="645" y="440" fill="#56655f">The allergen label never changes a GO annotation.</text>
<text x="645" y="458" fill="#56655f">No GO molecular function for "allergen" exists.</text>
</g>
</svg>
