<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d8a4b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#bd3a30"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="32" y="40" font-size="23" font-weight="bold" fill="#15201e">KW-1110 remapping: from a non-pathway to a pathway-specific term</text>
  <text x="32" y="64" font-size="15" fill="#56655f">State checked 2026-10-04 against QuickGO and the current GO uniprotkb_kw2go file</text>

  <!-- keywords -->
  <rect x="32" y="104" width="250" height="96" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="48" y="130" font-size="13" fill="#56655f">UniProt parent keyword</text>
  <text x="48" y="152" font-size="16" font-weight="bold" fill="#15201e">KW-1113</text>
  <text x="48" y="172" font-size="12" fill="#15201e">Inhibition of host IFN-mediated</text>
  <text x="48" y="190" font-size="12" fill="#15201e">response initiation by virus</text>
  <rect x="32" y="262" width="250" height="78" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="48" y="288" font-size="13" fill="#56655f">UniProt keyword</text>
  <text x="48" y="310" font-size="16" font-weight="bold" fill="#0e6b66">KW-1110</text>
  <text x="48" y="329" font-size="13" fill="#15201e">Inhibition of host TRAFs by virus</text>
  <path d="M157,258 L157,204" stroke="#8fa39c" stroke-width="2" marker-end="url(#a)"/>
  <text x="166" y="232" font-size="12" fill="#56655f">child of</text>

  <!-- old term -->
  <rect x="380" y="92" width="300" height="100" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="396" y="118" font-size="16" font-weight="bold" fill="#bd3a30">GO:0039527  OBSOLETE</text>
  <text x="396" y="140" font-size="13" fill="#15201e" text-decoration="line-through">symbiont-mediated suppression of host</text>
  <text x="396" y="158" font-size="13" fill="#15201e" text-decoration="line-through">TRAF-mediated signal transduction</text>
  <text x="396" y="180" font-size="12" fill="#56655f">"does not correspond to a specific pathway"</text>
  <path d="M284,286 C330,286 330,150 376,150" stroke="#bd3a30" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#r)"/>
  <text x="300" y="214" font-size="12" fill="#bd3a30">old KW2GO</text>

  <!-- new term -->
  <rect x="380" y="250" width="300" height="118" rx="8" fill="#e8f1ee" stroke="#1d8a4b" stroke-width="2"/>
  <text x="396" y="276" font-size="16" font-weight="bold" fill="#1d8a4b">GO:0140476</text>
  <text x="396" y="298" font-size="13" fill="#15201e">symbiont-mediated suppression of host</text>
  <text x="396" y="316" font-size="13" fill="#15201e">cytoplasmic pattern recognition receptor</text>
  <text x="396" y="334" font-size="13" fill="#15201e">signaling pathway via inhibition of</text>
  <text x="396" y="352" font-size="13" fill="#15201e">TRAF activity</text>
  <path d="M284,310 L376,310" stroke="#1d8a4b" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="292" y="302" font-size="11" fill="#1d8a4b">KW2GO now</text>

  <!-- sibling -->
  <rect x="380" y="400" width="300" height="84" rx="8" fill="#ffffff" stroke="#8fa39c"/>
  <text x="396" y="424" font-size="16" font-weight="bold" fill="#15201e">GO:0140470</text>
  <text x="396" y="446" font-size="13" fill="#15201e">... host toll-like receptor signaling</text>
  <text x="396" y="464" font-size="13" fill="#15201e">pathway via inhibition of TRAF activity</text>

  <!-- consider arrows from obsolete -->
  <path d="M690,142 C770,142 770,300 684,305" stroke="#56655f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <path d="M690,160 C820,160 820,440 684,442" stroke="#56655f" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text x="780" y="228" font-size="12" fill="#56655f">"consider"</text>

  <text x="836" y="300" font-size="13" fill="#15201e">RLR</text>
  <text x="836" y="318" font-size="13" fill="#15201e">evidence</text>
  <text x="836" y="440" font-size="13" fill="#15201e">TLR</text>
  <text x="836" y="458" font-size="13" fill="#15201e">evidence</text>
  <text x="32" y="400" font-size="13" fill="#56655f">Repo impact: 0 gene reviews carry</text>
  <text x="32" y="418" font-size="13" fill="#56655f">GO:0039527, GO:0140476 or KW-1110</text>
</svg>
