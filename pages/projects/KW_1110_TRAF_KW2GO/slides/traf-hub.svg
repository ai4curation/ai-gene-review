<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="32" y="40" font-size="23" font-weight="bold" fill="#15201e">Why "TRAF-mediated signal transduction" is not a pathway</text>
  <text x="32" y="64" font-size="15" fill="#56655f">TRAF adaptors sit inside several distinct innate-immune pathways; the new terms name the pathway being suppressed</text>

  <!-- receptors column -->
  <g font-size="14">
    <rect x="40" y="104" width="220" height="74" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
    <text x="56" y="130" font-weight="bold" fill="#0e6b66">RLR (cytoplasmic PRR)</text>
    <text x="56" y="150" font-size="12" fill="#15201e">RIG-I / MDA5 / LGP2 → MAVS</text>
    <text x="56" y="168" font-size="12" fill="#1d8a4b">→ GO:0140476</text>

    <rect x="40" y="202" width="220" height="74" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="56" y="228" font-weight="bold" fill="#15201e">TLR</text>
    <text x="56" y="248" font-size="12" fill="#15201e">Toll-like receptors</text>
    <text x="56" y="266" font-size="12" fill="#56655f">→ GO:0140470</text>

    <rect x="40" y="300" width="220" height="74" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="56" y="326" font-weight="bold" fill="#15201e">TNF / TNFR</text>
    <text x="56" y="346" font-size="12" fill="#15201e">death-domain receptors</text>
    <text x="56" y="364" font-size="12" fill="#56655f">not covered by GO:0140476</text>

    <rect x="40" y="398" width="220" height="74" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="56" y="424" font-weight="bold" fill="#15201e">cGAS–STING</text>
    <text x="56" y="444" font-size="12" fill="#15201e">cytosolic DNA sensing</text>
    <text x="56" y="462" font-size="12" fill="#56655f">not covered by GO:0140476</text>
  </g>

  <!-- TRAF hub -->
  <circle cx="470" cy="288" r="62" fill="#0e6b66"/>
  <text x="470" y="284" font-size="24" font-weight="bold" text-anchor="middle" fill="#ffffff">TRAF</text>
  <text x="470" y="306" font-size="13" text-anchor="middle" fill="#dcefec">adaptor / E3</text>
  <path d="M262,141 C360,141 380,240 414,258" stroke="#0e6b66" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M262,239 C340,239 380,270 408,278" stroke="#8fa39c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M262,337 C340,337 380,305 408,300" stroke="#8fa39c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M262,435 C360,435 390,340 418,322" stroke="#8fa39c" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- outputs -->
  <rect x="660" y="200" width="250" height="60" rx="8" fill="#ffffff" stroke="#8fa39c"/>
  <text x="676" y="226" font-size="14" font-weight="bold" fill="#15201e">TBK1 → IRF3</text>
  <text x="676" y="246" font-size="12" fill="#56655f">type I interferon</text>
  <rect x="660" y="300" width="250" height="60" rx="8" fill="#ffffff" stroke="#8fa39c"/>
  <text x="676" y="326" font-size="14" font-weight="bold" fill="#15201e">NF-κB</text>
  <text x="676" y="346" font-size="12" fill="#56655f">inflammatory genes</text>
  <path d="M534,270 L656,232" stroke="#56655f" stroke-width="2" marker-end="url(#a)"/>
  <path d="M534,300 L656,328" stroke="#56655f" stroke-width="2" marker-end="url(#a)"/>

  <!-- viral effector -->
  <rect x="400" y="410" width="160" height="50" rx="25" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="480" y="440" font-size="14" font-weight="bold" text-anchor="middle" fill="#bd3a30">viral effector</text>
  <path d="M480,408 L480,356" stroke="#bd3a30" stroke-width="3"/>
  <path d="M462,356 L498,356" stroke="#bd3a30" stroke-width="4"/>
  <text x="576" y="440" font-size="12" fill="#56655f">KW-1110: blocks TRAF; which GO term applies</text>
  <text x="576" y="458" font-size="12" fill="#56655f">depends on the pathway the evidence shows</text>
</svg>
