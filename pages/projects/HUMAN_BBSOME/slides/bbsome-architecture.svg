<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- cilium -->
  <path d="M600 40 L600 300 Q600 330 630 330 L870 330 Q900 330 900 300 L900 40" fill="#eef5f3" stroke="#8fa39c" stroke-width="1.5"/>
  <text x="750" y="30" text-anchor="middle" font-size="15" fill="#56655f">primary cilium</text>
  <line x1="600" y1="300" x2="900" y2="300" stroke="#b8620f" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="750" y="352" text-anchor="middle" font-size="13" fill="#b8620f">transition zone (diffusion barrier)</text>
  <!-- IFT train -->
  <rect x="690" y="90" width="120" height="26" rx="13" fill="#ffffff" stroke="#8fa39c"/>
  <text x="750" y="108" text-anchor="middle" font-size="13" fill="#15201e">IFT train</text>
  <path d="M730 240 L730 125" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <path d="M775 125 L775 240" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <text x="760" y="190" font-size="12" fill="#0e6b66" transform="rotate(-90 792 190)">retrieval / export</text>
  <!-- GPCR cargo in membrane -->
  <g transform="translate(640 250)"><rect width="36" height="34" rx="6" fill="#dcefec" stroke="#0e6b66"/><text x="18" y="22" text-anchor="middle" font-size="11" fill="#15201e">GPCR</text></g>
  <text x="658" y="243" text-anchor="middle" font-size="11" fill="#56655f">SSTR3 · SMO</text>
  <!-- chaperonin assembly -->
  <g transform="translate(40 60)">
    <rect width="220" height="120" rx="10" fill="#f6efe6" stroke="#b8620f"/>
    <text x="110" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#b8620f">assembly (not subunits)</text>
    <text x="110" y="52" text-anchor="middle" font-size="14" fill="#15201e">MKKS/BBS6 · BBS10 · BBS12</text>
    <text x="110" y="74" text-anchor="middle" font-size="14" fill="#15201e">+ CCT/TRiC chaperonin</text>
    <text x="110" y="102" text-anchor="middle" font-size="12" fill="#56655f">GO:0044183 protein folding chaperone</text>
  </g>
  <path d="M260 120 L318 190" stroke="#b8620f" stroke-width="2" marker-end="url(#b)"/>
  <!-- BBSome core -->
  <g transform="translate(300 180)">
    <rect width="250" height="220" rx="14" fill="#e8f1ee" stroke="#0e6b66" stroke-width="1.6"/>
    <text x="125" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#0e6b66">BBSome octamer · GO:0034464</text>
    <g font-size="13" fill="#15201e" text-anchor="middle">
      <circle cx="60" cy="70" r="26" fill="#ffffff" stroke="#8fa39c"/><text x="60" y="74">BBS2</text>
      <circle cx="125" cy="70" r="26" fill="#ffffff" stroke="#8fa39c"/><text x="125" y="74">BBS7</text>
      <circle cx="190" cy="70" r="26" fill="#ffffff" stroke="#8fa39c"/><text x="190" y="74">BBS9</text>
      <circle cx="60" cy="132" r="26" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="60" y="136">BBS1</text>
      <circle cx="125" cy="132" r="26" fill="#ffffff" stroke="#8fa39c"/><text x="125" y="136">BBS4</text>
      <circle cx="190" cy="132" r="26" fill="#ffffff" stroke="#8fa39c"/><text x="190" y="136">TTC8</text>
      <circle cx="90" cy="190" r="22" fill="#ffffff" stroke="#8fa39c"/><text x="90" y="194">BBS5</text>
      <circle cx="160" cy="190" r="22" fill="#ffffff" stroke="#8fa39c"/><text x="160" y="194">BBIP1</text>
    </g>
  </g>
  <text x="425" y="510" text-anchor="middle" font-size="12" fill="#56655f">β-propeller core (BBS2/7/9) · TPR adaptors (BBS4, TTC8) · PH lipid binder (BBS5)</text>
  <!-- ARL6 -->
  <g transform="translate(360 440)">
    <rect width="130" height="44" rx="8" fill="#ffffff" stroke="#1d68b3" stroke-width="1.6"/>
    <text x="65" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="#1d68b3">ARL6 · GTP</text>
    <text x="65" y="36" text-anchor="middle" font-size="11" fill="#56655f">membrane recruiter</text>
  </g>
  <path d="M390 440 L352 318" stroke="#1d68b3" stroke-width="2" marker-end="url(#c)"/>
  <!-- LZTFL1 -->
  <g transform="translate(70 300)">
    <rect width="170" height="54" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="85" y="23" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">LZTFL1 · CCDC28B</text>
    <text x="85" y="41" text-anchor="middle" font-size="11" fill="#56655f">regulate ciliary entry</text>
  </g>
  <path d="M240 327 L298 310" stroke="#8fa39c" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- to cilium -->
  <path d="M552 270 L630 268" stroke="#0e6b66" stroke-width="2.4" marker-end="url(#a)"/>
  <text x="590" y="258" text-anchor="middle" font-size="12" fill="#0e6b66">coat</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0e6b66"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b8620f"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1d68b3"/></marker>
  </defs>
</svg>
