<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d68b3"/></marker>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#bd3a30"/></marker>
  </defs>

  <!-- compartments -->
  <text x="24" y="32" font-size="13" fill="#56655f">intermembrane space</text>
  <rect x="16" y="200" width="928" height="78" fill="#f3f6f5" stroke="#8fa39c"/>
  <text x="24" y="244" font-size="12" fill="#56655f">inner</text>
  <text x="24" y="258" font-size="12" fill="#56655f">membrane</text>
  <text x="24" y="300" font-size="13" fill="#56655f">matrix</text>

  <!-- legend -->
  <g font-size="12">
    <rect x="600" y="18" width="14" height="14" rx="3" fill="#dcefec" stroke="#0e6b66"/><text x="620" y="30" fill="#15201e">reviewed subunit</text>
    <rect x="730" y="18" width="14" height="14" rx="3" fill="#f6efe6" stroke="#b8620f"/><text x="750" y="30" fill="#15201e">assembly / biogenesis factor</text>
    <line x1="600" y1="50" x2="630" y2="50" stroke="#1d68b3" stroke-width="2" stroke-dasharray="5 3"/><text x="636" y="54" fill="#15201e">electrons</text>
    <line x1="730" y1="50" x2="760" y2="50" stroke="#bd3a30" stroke-width="2"/><text x="766" y="54" fill="#15201e">protons</text>
  </g>

  <!-- Complex I -->
  <rect x="92" y="208" width="120" height="62" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <rect x="176" y="270" width="44" height="80" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="140" y="245" text-anchor="middle" font-size="20" font-weight="700" fill="#0e6b66">I</text>
  <text x="198" y="372" text-anchor="middle" font-size="12" fill="#15201e">NADH → NAD⁺</text>

  <!-- Complex II -->
  <rect x="240" y="236" width="50" height="38" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <rect x="236" y="274" width="58" height="52" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="265" y="306" text-anchor="middle" font-size="18" font-weight="700" fill="#0e6b66">II</text>
  <text x="265" y="346" text-anchor="middle" font-size="12" fill="#15201e">succinate →</text>
  <text x="265" y="360" text-anchor="middle" font-size="12" fill="#15201e">fumarate (TCA)</text>

  <!-- Q pool -->
  <ellipse cx="322" cy="226" rx="20" ry="14" fill="#ffffff" stroke="#1d68b3" stroke-width="1.5"/>
  <text x="322" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#1d68b3">Q</text>
  <text x="322" y="160" text-anchor="middle" font-size="11" fill="#56655f">CoQ pool</text>
  <text x="322" y="174" text-anchor="middle" font-size="11" fill="#56655f">COQ8A · ETFDH feeds in</text>

  <!-- Complex III -->
  <rect x="360" y="192" width="96" height="98" rx="12" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="408" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#0e6b66">III₂</text>

  <!-- cyt c -->
  <circle cx="492" cy="160" r="20" fill="#ffffff" stroke="#1d68b3" stroke-width="1.5"/>
  <text x="492" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#1d68b3">c</text>
  <text x="492" y="126" text-anchor="middle" font-size="11" fill="#56655f">cytochrome c (CYCS)</text>

  <!-- Complex IV -->
  <rect x="530" y="194" width="92" height="94" rx="12" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="576" y="248" text-anchor="middle" font-size="20" font-weight="700" fill="#0e6b66">IV</text>
  <text x="576" y="312" text-anchor="middle" font-size="12" fill="#15201e">O₂ → H₂O</text>

  <!-- Complex V -->
  <rect x="720" y="206" width="110" height="66" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="775" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#0e6b66">Fo (c-ring)</text>
  <line x1="775" y1="272" x2="775" y2="298" stroke="#0e6b66" stroke-width="5"/>
  <ellipse cx="775" cy="334" rx="66" ry="36" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="775" y="339" text-anchor="middle" font-size="15" font-weight="700" fill="#0e6b66">F1 (α₃β₃)</text>
  <text x="775" y="390" text-anchor="middle" font-size="12" fill="#15201e">ADP + Pi → ATP</text>

  <!-- electron path -->
  <g stroke="#1d68b3" stroke-width="2" stroke-dasharray="5 3" fill="none">
    <path d="M198 300 L198 226 L300 226" marker-end="url(#e)"/>
    <path d="M265 280 L265 240 L304 232" marker-end="url(#e)"/>
    <path d="M342 226 L358 226" marker-end="url(#e)"/>
    <path d="M440 190 L472 168" marker-end="url(#e)"/>
    <path d="M512 164 L548 192" marker-end="url(#e)"/>
  </g>

  <!-- protons -->
  <g stroke="#bd3a30" stroke-width="2.5" fill="none">
    <path d="M130 205 L130 120" marker-end="url(#h)"/>
    <path d="M395 188 L395 110" marker-end="url(#h)"/>
    <path d="M600 190 L600 110" marker-end="url(#h)"/>
    <path d="M760 110 L760 202" marker-end="url(#h)"/>
  </g>
  <g font-size="13" font-weight="700" fill="#bd3a30">
    <text x="138" y="126">4 H⁺</text><text x="403" y="116">4 H⁺</text><text x="608" y="116">4 H⁺</text><text x="768" y="116">H⁺ back</text>
  </g>

  <!-- gene panels -->
  <g font-size="11.5">
    <rect x="40" y="410" width="200" height="98" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="50" y="428" font-weight="700" fill="#0e6b66">Complex I (5)</text>
    <text x="50" y="448" fill="#15201e">NDUFS1 · NDUFV1 · NDUFS2</text>
    <text x="50" y="466" fill="#15201e">NDUFS4</text>
    <text x="50" y="490" fill="#b8620f">ACAD9 (MCIA assembly)</text>

    <rect x="248" y="410" width="120" height="98" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="258" y="428" font-weight="700" fill="#0e6b66">Complex II (5)</text>
    <text x="258" y="448" fill="#15201e">SDHA · SDHB</text>
    <text x="258" y="466" fill="#15201e">SDHC · SDHD</text>
    <text x="258" y="490" fill="#b8620f">SDHAF2</text>

    <rect x="376" y="410" width="130" height="98" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="386" y="428" font-weight="700" fill="#0e6b66">Complex III (4)</text>
    <text x="386" y="448" fill="#15201e">CYC1 · UQCRFS1</text>
    <text x="386" y="466" fill="#15201e">UQCRC1</text>
    <text x="386" y="490" fill="#b8620f">BCS1L</text>

    <rect x="514" y="410" width="196" height="98" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="524" y="428" font-weight="700" fill="#0e6b66">Complex IV (12)</text>
    <text x="524" y="448" fill="#15201e">COX4I1 · COX4I2 · COX5B</text>
    <text x="524" y="466" fill="#15201e">COX6A1 · COX6B1 · NDUFA4</text>
    <text x="524" y="484" fill="#b8620f">SURF1 · SCO1 · SCO2</text>
    <text x="524" y="500" fill="#b8620f">COX10 · COX15 · LRPPRC</text>

    <rect x="718" y="410" width="214" height="98" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="728" y="428" font-weight="700" fill="#0e6b66">ATP synthase (7)</text>
    <text x="728" y="448" fill="#15201e">ATP5F1A · ATP5F1B</text>
    <text x="728" y="466" fill="#15201e">ATP5MC1-3 · ATP5IF1 (inhibitor)</text>
    <text x="728" y="490" fill="#b8620f">TMEM70 (c-ring assembly)</text>
  </g>
</svg>
