<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8620f"/></marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#15201e">Who does the work: catalytic versus accessory subunits in K⁺ uptake</text>
  <text x="40" y="84" font-size="13" fill="#56655f">outside</text>
  <rect x="30" y="110" width="900" height="70" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="480" y="150" text-anchor="middle" font-size="12" fill="#56655f">cytoplasmic membrane</text>
  <text x="40" y="206" font-size="13" fill="#56655f">cytoplasm</text>
  <!-- Kdp -->
  <text x="250" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">KdpFABC: ATP-driven, high affinity</text>
  <rect x="150" y="100" width="90" height="90" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="195" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0e6b66">KdpB</text>
  <text x="195" y="158" text-anchor="middle" font-size="10" fill="#15201e">P-type ATPase</text>
  <rect x="250" y="120" width="70" height="60" rx="10" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
  <text x="285" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#b8620f">KdpC</text>
  <text x="285" y="166" text-anchor="middle" font-size="10" fill="#15201e">chaperone</text>
  <path d="M195 70 L195 96" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <text x="170" y="82" text-anchor="end" font-size="12" fill="#0e6b66">K⁺</text>
  <text x="195" y="228" text-anchor="middle" font-size="11" fill="#1d8a4b">ACCEPT P-type K⁺ transporter</text>
  <text x="285" y="252" text-anchor="middle" font-size="11" fill="#bd3a30">REMOVE ATP binding, hydrolase</text>
  <text x="285" y="268" text-anchor="middle" font-size="11" fill="#b8620f">MODIFY → ATPase activator activity</text>
  <!-- split KdpD -->
  <g transform="translate(90 300)">
    <rect width="330" height="170" rx="12" fill="#f4f7f6" stroke="#8fa39c"/>
    <text x="165" y="24" text-anchor="middle" font-size="14" font-weight="600" fill="#15201e">A KdpD split across two genes</text>
    <rect x="20" y="44" width="130" height="60" rx="8" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
    <text x="85" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#b8620f">DVU3336</text>
    <text x="85" y="86" text-anchor="middle" font-size="10" fill="#15201e">KdpD N-term sensor + UspA</text>
    <rect x="180" y="44" width="130" height="60" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
    <text x="245" y="68" text-anchor="middle" font-size="13" font-weight="600" fill="#0e6b66">DVU3335</text>
    <text x="245" y="86" text-anchor="middle" font-size="10" fill="#15201e">PAS + HisKA + HATPase_c</text>
    <path d="M150 74 L176 74" stroke="#8fa39c" stroke-width="2" marker-end="url(#a)"/>
    <text x="85" y="128" text-anchor="middle" font-size="11" fill="#bd3a30">REMOVE histidine kinase</text>
    <text x="85" y="143" text-anchor="middle" font-size="11" fill="#bd3a30">and kinase rows (IEA)</text>
    <text x="245" y="128" text-anchor="middle" font-size="11" fill="#1d8a4b">holds the kinase core</text>
  </g>
  <!-- Trk -->
  <text x="700" y="60" text-anchor="middle" font-size="15" font-weight="600" fill="#15201e">Trk: constitutive channel</text>
  <rect x="650" y="100" width="100" height="90" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="700" y="140" text-anchor="middle" font-size="14" font-weight="600" fill="#0e6b66">TrkH</text>
  <text x="700" y="158" text-anchor="middle" font-size="10" fill="#15201e">DVU0413 · pore</text>
  <path d="M700 70 L700 96" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <text x="676" y="82" text-anchor="end" font-size="12" fill="#0e6b66">K⁺</text>
  <text x="840" y="140" text-anchor="middle" font-size="11" fill="#b8620f">MODIFY generic cation</text>
  <text x="840" y="155" text-anchor="middle" font-size="11" fill="#b8620f">transport → K⁺ transport</text>
  <!-- RCK ring -->
  <g transform="translate(700 270)">
    <circle r="62" fill="none" stroke="#b8620f" stroke-width="2" stroke-dasharray="6 4"/>
    <g fill="#ffffff" stroke="#b8620f" stroke-width="2">
      <circle cx="0" cy="-48" r="16"/><circle cx="34" cy="-34" r="16"/><circle cx="48" cy="0" r="16"/><circle cx="34" cy="34" r="16"/>
      <circle cx="0" cy="48" r="16"/><circle cx="-34" cy="34" r="16"/><circle cx="-48" cy="0" r="16"/><circle cx="-34" cy="-34" r="16"/>
    </g>
    <text x="0" y="-2" text-anchor="middle" font-size="13" font-weight="600" fill="#b8620f">TrkA RCK</text>
    <text x="0" y="14" text-anchor="middle" font-size="10" fill="#15201e">octameric ring</text>
  </g>
  <path d="M700 206 L700 190" stroke="#b8620f" stroke-width="2"/>
  <text x="700" y="360" text-anchor="middle" font-size="11" fill="#15201e">DVU0412, DVU1606 · gated by ATP/ADP, c-di-AMP</text>
  <text x="700" y="384" text-anchor="middle" font-size="11" fill="#b8620f">MODIFY cation transporter activity</text>
  <text x="700" y="400" text-anchor="middle" font-size="11" fill="#b8620f">→ potassium channel regulator activity</text>
  <text x="480" y="500" text-anchor="middle" font-size="12" fill="#56655f">Teal: subunits that catalyse or conduct. Orange: accessory subunits that had inherited catalytic or transporter terms.</text>
</svg>
