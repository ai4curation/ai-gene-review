title: ataxia telangiectasia-mutated (atm) signaling pathway
description: 'DNA lesions, particularly double-strand breaks (DSBs), can have severe genotoxic effects
  if not promptly handled. DSBs can be initiated by DNA damaging agents such as ionizing radiation or
  arise during replication through exposure to metabolites, and are also physiological intermediates generated
  during V(D)J [variable (V), diversity (D) and joining (J) recombination] and class switch recombination
  in lymphocytes of the immune system. The cells possess a robust response mechanism to DNA damage which
  triggers a range of signals to adequately handle the damage and maintain genomic integrity, collectively
  known as the DNA damage response (DDR). Central to mediating the response are the DDR kinases - ataxia
  telangiectasia-mutated (ATM), ATM and RAD3-related (ATR) and DNA-dependent protein kinase (DNA-PKcs).
  Of these, ATM plays a pivotal role - its signaling is activated by DSBs to promote double-strand repair
  and prompt cell cycle checkpoint pathways, regulate cell fate decision (apoptosis or senescence), transcription
  and metabolic pathways. ATM, like the other DDR kinases, belongs to the phosphatidylinositol (PI) 3-kinase-like
  kinase (PIKK) family. It is a large serine/threonine kinase with an impressive repertoire of substrates,
  the size of which underlies the range of responses it can promote. As the name suggests, the human gene
  is mutated in the autosomal recessive condition associated with neurodegenerative and immunodeficiency
  phenotypes. A major function of ATM signaling is to activate the double-strand repair pathways. There
  are two principal DSB pathways: non-homologous end-joining (NHEJ) and homologous recombination (HR).
  The error-prone NHEJ which can be active throughout the cell cycle is the predominant one whereas the
  error-free HR is restricted to the S and G2 phases when sister chromatids are available to provide the
  necessary template. ATM signaling proceeds through several and overlapping layers, accompanied by activating
  positive feedback and regulatory negative inhibition loops. Two downstream sensors - Tp53bp1 and Brca1,
  prompt the unfolding of NHEJ or HR, respectively. ATM activation in response to DSBs involves autophosphorylation
  followed by monomerization and kinase activity and acetylation of a C-terminal lysine by Kat5, known
  as Tip60. The exact mechanism of ATM activation is still elusive; however, the presence of the MRN complex
  at the site of the DSB appears to be a requirement. The MRN complex is composed of Mre11a, Rad50 and
  Nbs1 proteins, of which the first two are important for DSB recognition and the latter for ATM recruitment;
  MRN itself is an ATM substrate. ATM phosphorylation of a histone variant - H2afx, at a conserved serine
  residue prompts its recognition by the mediator of DNA damage checkpoint protein 1 (Mdc1); Mdc1 also
  interacts with ATM for which it is a substrate. Mdc1 promotes a positive feedback resulting in additional
  accumulation of MRN-ATM and H2afx phosphorylation. Phosphorylated Mdc1 also recruits E3 ubiquitin ligase
  Rnf8 that in turn will lead to recruitment of Rnf168 E3 ligase for which H2afx is a substrate. E3, together
  with E2 ligases such as Ube2n, promote K63-linked polyubiquitination at DSBs leading to the generation
  of a chromatin domain, permissive for the recruitment of several proteins, including Tp53bp1 and Brca1.
  Additional E3 ligases such as the Rnf20-Rnf40 heterodimer, also an ATM substrate, are recruited in an
  H2afx independent manner. Tp53bp1 opposes the resection reaction that is central to the HR repair type,
  thus promoting NHEJ repair while Brca1 antagonizes Tp53bp1 to achieve the opposite effect, thus promoting
  the HR repair. The mechanisms by which the two proteins oppose each other to initiate the specific downstream
  repair route are incompletely understood. Tp53bp1 acts as a scaffold for additional interactors such
  as Rif1 and the chromatin modulator Mum1 (Expand1). On the other hand Brca1, which interacts with Rbbp8
  (Ctip), may promote the eviction of Tp53bp1 and Rif1 to favor HR. Chromatin remodeling complexes are
  also recruited (not shown) and the identity of the complex may also impact on the choice of repair pathway.
  Tb53bp1 chromatin binding is dependent upon its homo-oligomerization and the dual recognition of histone
  4 dimethylated at lysine 20 and of histone 2A ubiquitinated at lysine 15 (not shown). The ATM signaling
  network is highly regulated to avoid spreading of chromatin modification to undamaged sites, to disassemble/deactivate
  the components and to reinstate the cell cycle by stopping the checkpoint activation, among others.
  For instance, the balance between the constitutive phosphorylation of H2afx at tyrosine 142 by Baz1b
  and its dephosphorylation, dictates whether the response will lead to repair and survival or death via
  apoptosis. H2afx phosphorylated at both Y142 and Ser139 promotes apoptosis and possibly, local chromatin
  remodeling; dephosphorylation of Y142 promotes binding of Mdc1 and repair. A number of phosphatases,
  ubiquitin and SUMO ligases, and deubiquitinases regulate ATM, H2afx, Mdc1 and the K63 ubiquitination
  states. To check the ontology report for annotations, GViewer and download, click here'
