title: chromatin remodeling pathway
description: 'Epigenetic changes, the modification and remodeling of chromatin, play a key role in the
  differential expression of genes. Chromatin modification and remodeling directly affect the relative
  relaxation or compaction of chromatin and thus, the extent to which DNA replication, transcription,
  damage response and repair, associated RNA processing and splicing are promoted or are silenced, respectively.
  The basic unit of chromatin is the nucleosome - it consists of 145-147 base pairs of DNA wrapped around
  an octameric structure formed by core histones. Repeating nucleosomes assemble into higher-order structures
  stabilized by a linker histone. Chromatin modification involves the methylation of cytosine residues
  in DNA and the many ways in which the histone residues are modified. The remodeling of chromatin involves
  the ATP-dependent sliding, spacing and repositioning of entire nucleosomes, insertion, eviction or exchange
  of histones, chromatin assembly and disassembly. It is carried out by four major protein complexes representing
  four remodeling pathways with distinct functions. Epigenetic changes are heritable and independent of
  DNA sequence. However, DNA sequence variation can affect the function of players involved and thus,
  of epigenetic outcomes. An intimate dialog exists between the pathways of chromatin modification and
  remodeling to finely tune the epigenetic responses. The four remodeling pathways represent the subdivision
  of catalytic subunits of chromatin remodelers - members of the DEAD/H family of ATP-binding helicases,
  into four families whose function and associated complexes perform specific, non-redundant functions.
  The four families/complexes are: SWI/SNF, INO80(SWRI), ISWI and CHD. Chromatin remodeling complexes
  (CRCs) interact with nucleosomal DNA and histones, with modified histones and with other proteins via
  several DNA and protein recognition domains. The four remodeling complexes are individually described.
  SWI/SNF complex SWI/SNF complex, originally identified in yeast, was subsequently identified in fly
  and mammals. There are several mammalian SWI/SNF complexes of which the main ones are BAF (yeast SWI/SNF-A)
  and PBAF (yeast SWI/SNF-B), present in the same cell type (shown). Others are cell-specific and represented
  by neural progenitor BAF (npBAF), neuron BAF (nBAF) and embryonic stem cell BAF (esBAF) (not shown).
  All complexes contain one of the two catalytic subunits Smarca4/Brg1 or Smarca2/Brm, share several other
  core subunits and include accessory subunits specific to given complexes. The presence of subunits is
  in many cases, mutually exclusive. Many subunits are represented by gene families allowing for the combinatorial
  assembly of complexes and are subject to gene expression and developmental programs. Subunit exchange
  is also a feature of SWI/SNF assembly, further increasing the number of possible complex instances,
  estimated to be in excess of seventy. Besides the catalytic subunits, the other core subunits include
  Smarcc1/Baf155 or Smarcc2/Baf170, Smarcd1, 2 or 3 (Baf60a/b/c), Actl6A or B (Baf53a/b) and Smarcb1 (Baf47/Snf5).
  Additional subunits include Arid1A or B (Baf250a/b ) or Arid2 (Baf200), Pbrm1 (Baf180), Phf10, Dpf1,
  3 or 2 (Baf45a/b/c/d), Brd7, Brd9, Smarce1 (Baf57) and beta-actin. The two catalytic subunits - Smarca4
  and 2 have N-terminal DEXD and HELIC subdomains and C-terminal bromodomains that can bind acetylated
  histone tails. They have ATPase and translocase activity but no helicase activity. Other domains present
  in the various subunits of the complexes facilitate the interaction with DNA ARID, HMG zinc finger,
  leucine zipper domains; or the interaction with proteins - LXXLL, BAH, SANT, SWIRM, SWIB domains. The
  mammalian SWI/SNF complexes be found within intergenic regions and also promoters. They can slide nucleosomes,
  eject and insert histone octamers, are involved in chromatin opening, chromosome condensation and segregation
  and exert both activation and repression of genes. They also play a role in the DNA repair. The structure
  of an yeast complex related to ySWI/SNF, show the nucleosome being engulfed within a central cavity.
  Mutations in several subunits of BAF and PBAF complexes are present in 20% of human cancers and they
  include both catalytic subunits as well as shared and unique components. Most are loss of functions
  resulting from frameshift, deletion and nonsense.'
