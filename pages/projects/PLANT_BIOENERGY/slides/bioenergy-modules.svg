<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="22" font-weight="bold" fill="#15201e">Five modules, from fixed carbon to feedstock</text>

  <!-- photosynthesis source -->
  <rect x="24" y="210" width="160" height="90" rx="12" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="104" y="244" font-size="16" text-anchor="middle" font-weight="bold" fill="#0e6b66">Photosynthesis</text>
  <text x="104" y="266" font-size="12" text-anchor="middle" fill="#15201e">CO2 → sugars</text>
  <text x="104" y="284" font-size="12" text-anchor="middle" fill="#56655f">carbon supply</text>

  <!-- intermediates -->
  <text x="232" y="92" font-size="13" text-anchor="start" fill="#56655f">Phe</text>
  <text x="226" y="204" font-size="13" text-anchor="start" fill="#56655f">UDP-Glc</text>
  <text x="226" y="316" font-size="13" text-anchor="start" fill="#56655f">UDP-Xyl</text>
  <text x="212" y="428" font-size="13" text-anchor="start" fill="#56655f">G3P + acyl-CoA</text>
  <path d="M184,236 C200,150 210,96 226,88" stroke="#8fa39c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M184,246 L220,200" stroke="#8fa39c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M184,262 L220,306" stroke="#8fa39c" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M184,274 C196,360 200,400 206,414" stroke="#8fa39c" stroke-width="2" fill="none" marker-end="url(#a)"/>

  <!-- module lanes -->
  <g>
    <rect x="320" y="56" width="360" height="72" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="336" y="80" font-size="15" font-weight="bold" fill="#15201e">Lignin (monolignol) biosynthesis</text>
    <text x="336" y="100" font-size="11" fill="#15201e">PAL → C4H → 4CL → HCT/C3'H → CCR → F5H/COMT → CAD</text>
    <text x="336" y="118" font-size="12" fill="#56655f">export; laccase/peroxidase coupling into H/G/S lignin</text>
    <line x1="264" y1="88" x2="316" y2="88" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <g>
    <rect x="320" y="168" width="360" height="72" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="336" y="192" font-size="15" font-weight="bold" fill="#15201e">Cellulose biosynthesis</text>
    <text x="336" y="212" font-size="12" fill="#15201e">CESA rosettes (primary / secondary wall)</text>
    <text x="336" y="230" font-size="12" fill="#56655f">microtubule guidance; KORRIGAN, COBRA</text>
    <line x1="298" y1="200" x2="316" y2="200" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <g>
    <rect x="320" y="280" width="360" height="72" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="336" y="304" font-size="15" font-weight="bold" fill="#15201e">Xylan biosynthesis</text>
    <text x="336" y="324" font-size="12" fill="#15201e">IRX9 / IRX10 / IRX14 backbone; GUX, GXM</text>
    <text x="336" y="342" font-size="12" fill="#56655f">O-acetylation by ESK1/TBL29 + RWA</text>
    <line x1="298" y1="312" x2="316" y2="312" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <g>
    <rect x="320" y="392" width="360" height="72" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
    <text x="336" y="416" font-size="15" font-weight="bold" fill="#15201e">Seed triacylglycerol biosynthesis</text>
    <text x="336" y="436" font-size="12" fill="#15201e">GPAT → LPAAT → PAP → DGAT; PDAT route</text>
    <text x="336" y="454" font-size="12" fill="#56655f">oleosin packaging into oil bodies</text>
  </g>

  <!-- levers -->
  <rect x="712" y="56" width="224" height="296" rx="12" fill="#fff4e8" stroke="#b8620f"/>
  <text x="824" y="84" font-size="15" text-anchor="middle" font-weight="bold" fill="#b8620f">Recalcitrance levers</text>
  <text x="728" y="112" font-size="13" fill="#15201e">• lower lignin, raise S/G</text>
  <text x="728" y="208" font-size="13" fill="#15201e">• alter crystallinity,</text>
  <text x="740" y="226" font-size="13" fill="#15201e">secondary-wall CESAs</text>
  <text x="728" y="312" font-size="13" fill="#15201e">• less acetylation</text>
  <text x="740" y="330" font-size="13" fill="#15201e">(acetate inhibits fermentation)</text>
  <text x="824" y="160" font-size="12" text-anchor="middle" fill="#56655f">→ lignocellulosic sugars</text>
  <rect x="712" y="392" width="224" height="72" rx="12" fill="#fff4e8" stroke="#b8620f"/>
  <text x="824" y="420" font-size="15" text-anchor="middle" font-weight="bold" fill="#b8620f">Oil yield lever</text>
  <text x="824" y="444" font-size="13" text-anchor="middle" fill="#15201e">DGAT/PDAT flux, oleosin dosage</text>

  <text x="24" y="500" font-size="13" fill="#56655f">All five modules are status DRAFT; enzymes shown are the steps each module models, with Arabidopsis exemplars.</text>
</svg>
