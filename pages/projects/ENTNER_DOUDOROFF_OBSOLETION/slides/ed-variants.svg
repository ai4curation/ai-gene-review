<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="40" y="38" font-size="16" font-weight="600" fill="#15201e">The ED variants GO used to name separately; all now annotate to GO:0061678</text>
  <g font-size="15" fill="#15201e">
    <!-- top row: phosphorylative -->
    <rect x="40" y="90" width="120" height="44" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="100" y="117" text-anchor="middle">glucose</text>
    <rect x="230" y="90" width="150" height="44" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="305" y="117" text-anchor="middle">glucose-6-P</text>
    <rect x="450" y="90" width="190" height="44" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="545" y="117" text-anchor="middle">6-phosphogluconate</text>
    <rect x="710" y="90" width="110" height="44" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="765" y="117" text-anchor="middle">KDPG</text>
    <!-- bottom row: gluconate -->
    <rect x="230" y="300" width="150" height="44" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="305" y="327" text-anchor="middle">gluconate</text>
    <rect x="450" y="300" width="190" height="44" rx="8" fill="#e8f1ee" stroke="#8fa39c"/><text x="545" y="327" text-anchor="middle">KDG</text>
    <!-- products -->
    <rect x="740" y="200" width="190" height="44" rx="8" fill="#dcefec" stroke="#0e6b66"/><text x="835" y="227" text-anchor="middle">pyruvate + G3P</text>
    <rect x="700" y="400" width="230" height="44" rx="8" fill="#dcefec" stroke="#0e6b66"/><text x="815" y="427" text-anchor="middle">pyruvate + glyceraldehyde</text>
  </g>
  <g stroke="#15201e" stroke-width="1.8" fill="none">
    <path d="M160 112 L226 112" marker-end="url(#a)"/>
    <path d="M380 112 L446 112" marker-end="url(#a)"/>
    <path d="M640 112 L706 112" marker-end="url(#a)"/>
    <path d="M790 134 L825 196" marker-end="url(#a)"/>
    <path d="M100 134 C 100 250, 150 322, 226 322" marker-end="url(#a)"/>
    <path d="M380 322 L446 322" marker-end="url(#a)"/>
    <path d="M305 300 C 330 220, 450 160, 520 136" marker-end="url(#a)" stroke-dasharray="6 4"/>
    <path d="M640 314 C 700 300, 730 200, 745 138" marker-end="url(#a)" stroke-dasharray="6 4"/>
    <path d="M640 330 C 680 360, 700 400, 740 400" marker-end="url(#a)"/>
  </g>
  <g font-size="13" font-weight="600" fill="#0e6b66">
    <text x="648" y="150">Edd</text><text x="648" y="166" font-weight="400" fill="#56655f">dehydratase</text>
    <text x="840" y="160">Eda</text><text x="840" y="176" font-weight="400" fill="#56655f">KDPG aldolase</text>
  </g>
  <g font-size="12.5" fill="#56655f">
    <text x="360" y="220">gluconate kinase</text>
    <text x="384" y="313" font-size="11.5">dehydratase</text>
    <text x="626" y="240">KDG kinase</text>
    <text x="618" y="390">aldolase</text>
  </g>
  <!-- labels for obsolete terms -->
  <g font-size="12.5" fill="#bd3a30" font-weight="600">
    <text x="450" y="72">GO:0009255 · via 6-phosphogluconate (P. putida Edd/Eda)</text>
    <text x="40" y="378">GO:0061679 · via gluconate</text>
    <text x="730" y="270">GO:0061681 · KDG → KDPG → G3P</text>
    <text x="700" y="466">GO:0061680 · to glyceraldehyde</text>
  </g>
  <text x="40" y="500" font-size="13" fill="#56655f">KDPG = 2-keto-3-deoxy-6-phosphogluconate; KDG = 2-keto-3-deoxygluconate. Dashed = routes that rejoin phosphorylated intermediates.</text>
</svg>
