<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
  </defs>

  <!-- step 1 -->
  <g transform="translate(30 40)">
    <rect width="410" height="190" rx="12" fill="#e8f1ee" stroke="#0e6b66" stroke-width="1.5"/>
    <text x="16" y="26" font-size="16" font-weight="700" fill="#0e6b66">① acyl-CoA dehydrogenase (FAD)</text>
    <text x="16" y="46" font-size="12" fill="#56655f">acyl-CoA (Cn) → (2E)-enoyl-CoA</text>
    <g font-size="13" fill="#15201e">
      <text x="16" y="76"><tspan font-weight="700">VLC / LC</tspan>  ACADVL, ACAD9  ·  fly Acadvl, Egm</text>
      <text x="16" y="102"><tspan font-weight="700">MC</tspan>  ACADM  ·  fly Mcad</text>
      <text x="16" y="128"><tspan font-weight="700">SC</tspan>  ACADS  ·  fly Arc42</text>
    </g>
    <text x="16" y="158" font-size="12" fill="#b8620f">ACAD9: very-long → long-chain MF (MODIFY)</text>
    <text x="16" y="176" font-size="12" fill="#b8620f">fly CG4860: short-chain → general ACAD (MODIFY)</text>
  </g>

  <!-- step 2 -->
  <g transform="translate(520 40)">
    <rect width="410" height="190" rx="12" fill="#e8f1ee" stroke="#0e6b66" stroke-width="1.5"/>
    <text x="16" y="26" font-size="16" font-weight="700" fill="#0e6b66">② enoyl-CoA hydratase</text>
    <text x="16" y="46" font-size="12" fill="#56655f">(2E)-enoyl-CoA → (3S)-3-hydroxyacyl-CoA</text>
    <g font-size="13" fill="#15201e">
      <text x="16" y="76"><tspan font-weight="700">LC</tspan>  HADHA (MTP α)  ·  fly Mtpalpha</text>
      <text x="16" y="102"><tspan font-weight="700">S / MC</tspan>  ECHS1  ·  fly Echs1</text>
    </g>
    <rect x="16" y="112" width="378" height="70" rx="8" fill="#ffffff" stroke="#8fa39c" stroke-dasharray="4 3"/>
    <text x="28" y="132" font-size="12" font-weight="700" fill="#56655f">unsaturated FA: auxiliary isomerases feed in (2E)-enoyl-CoA</text>
    <text x="28" y="152" font-size="12" fill="#15201e">mito: fly CG4592 / CG4594 / CG4598 · perox: Dci · Ech1</text>
    <text x="28" y="172" font-size="11" fill="#bd3a30">DECR1 reductase: no fly ortholog assignable</text>
  </g>

  <!-- step 3 -->
  <g transform="translate(520 300)">
    <rect width="410" height="190" rx="12" fill="#e8f1ee" stroke="#0e6b66" stroke-width="1.5"/>
    <text x="16" y="26" font-size="16" font-weight="700" fill="#0e6b66">③ 3-hydroxyacyl-CoA dehydrogenase</text>
    <text x="16" y="46" font-size="12" fill="#56655f">(3S)-3-hydroxyacyl-CoA → 3-oxoacyl-CoA (NAD+)</text>
    <g font-size="13" fill="#15201e">
      <text x="16" y="76"><tspan font-weight="700">LC</tspan>  HADHA (MTP α)  ·  fly Mtpalpha</text>
      <text x="16" y="102"><tspan font-weight="700">S / MC</tspan>  HADH  ·  fly scu (scully)</text>
    </g>
    <text x="16" y="132" font-size="12" fill="#56655f">fly has no classical HADH (type I);</text>
    <text x="16" y="150" font-size="12" fill="#56655f">scully is the HSD17B10 (type II) ortholog</text>
    <text x="16" y="176" font-size="12" fill="#7657a3">HADHA moonlights: MLCL acyltransferase</text>
  </g>

  <!-- step 4 -->
  <g transform="translate(30 300)">
    <rect width="410" height="190" rx="12" fill="#e8f1ee" stroke="#0e6b66" stroke-width="1.5"/>
    <text x="16" y="26" font-size="16" font-weight="700" fill="#0e6b66">④ 3-ketoacyl-CoA thiolase</text>
    <text x="16" y="46" font-size="12" fill="#56655f">3-oxoacyl-CoA → acetyl-CoA + acyl-CoA (Cn−2)</text>
    <g font-size="13" fill="#15201e">
      <text x="16" y="76"><tspan font-weight="700">LC</tspan>  HADHB (MTP β)  ·  fly Mtpbeta</text>
      <text x="16" y="102"><tspan font-weight="700">M / LC</tspan>  ACAA2  ·  fly Acaa</text>
      <text x="16" y="128"><tspan font-weight="700">SC / ketone</tspan>  ACAT1  ·  fly Acat1</text>
    </g>
    <text x="16" y="158" font-size="12" fill="#bd3a30">ACAT1: SOAT cholesterol-acyltransferase and</text>
    <text x="16" y="176" font-size="12" fill="#bd3a30">ER rows removed (name collision)</text>
  </g>

  <!-- cycle arrows -->
  <path d="M442 110 L516 110" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="479" y="100" text-anchor="middle" font-size="10" fill="#b8620f">RHEA</text>
  <text x="479" y="130" text-anchor="middle" font-size="10" fill="#b8620f">gap</text>
  <path d="M725 232 L725 296" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M518 400 L444 400" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M235 298 L235 234" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="224" y="270" text-anchor="end" font-size="12" fill="#0e6b66">Cn−2 re-enters</text>

  <!-- MTP note -->
  <g transform="translate(480 265)">
    <rect x="-150" y="-14" width="300" height="30" rx="15" fill="#dcefec" stroke="#0e6b66"/>
    <text x="0" y="6" text-anchor="middle" font-size="12" fill="#15201e">MTP α2β2 (HADHA + HADHB) runs long-chain ②–④</text>
  </g>
</svg>
