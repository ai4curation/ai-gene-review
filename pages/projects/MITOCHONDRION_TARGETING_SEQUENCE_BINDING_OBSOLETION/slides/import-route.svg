<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#15201e"/></marker></defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="600" fill="#15201e">Who recognises the presequence, and who only conducts it</text>
  <text x="30" y="80" font-size="13" fill="#56655f">cytosol</text>
  <rect x="30" y="150" width="900" height="36" fill="#fdf0e3" stroke="#b8620f"/><text x="36" y="206" font-size="12" fill="#b8620f">outer membrane (TOM)</text>
  <text x="30" y="250" font-size="13" fill="#56655f">intermembrane space</text>
  <rect x="30" y="300" width="900" height="36" fill="#e8f1ee" stroke="#8fa39c"/><text x="36" y="356" font-size="12" fill="#56655f">inner membrane (TIM)</text>
  <text x="30" y="420" font-size="13" fill="#56655f">matrix</text>
  <!-- precursor -->
  <path d="M120 70 L200 70" stroke="#1d68b3" stroke-width="5"/><path d="M200 70 L300 70" stroke="#8fa39c" stroke-width="5" stroke-dasharray="3 3"/>
  <text x="120" y="60" font-size="12" fill="#1d68b3">N-terminal presequence</text>
  <!-- TOM receptors -->
  <ellipse cx="250" cy="130" rx="46" ry="22" fill="#dcefec" stroke="#0e6b66" stroke-width="2.4"/><text x="250" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">TOM20</text>
  <ellipse cx="370" cy="130" rx="46" ry="22" fill="#dcefec" stroke="#0e6b66" stroke-width="2.4"/><text x="370" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">TOM22</text>
  <rect x="296" y="144" width="28" height="48" rx="6" fill="#ffffff" stroke="#15201e"/><text x="290" y="210" text-anchor="end" font-size="12" font-weight="600" fill="#15201e">TOM40</text>
  <!-- TIM50 & TIM23 -->
  <ellipse cx="400" cy="268" rx="44" ry="20" fill="#dcefec" stroke="#0e6b66" stroke-width="2.4"/><text x="400" y="273" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">TIM50</text>
  <rect x="296" y="294" width="28" height="48" rx="6" fill="#ffffff" stroke="#b8620f" stroke-width="2"/><text x="290" y="360" text-anchor="end" font-size="12" font-weight="600" fill="#15201e">TIM23</text>
  <path d="M310 90 L310 460" stroke="#15201e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <!-- carrier route -->
  <path d="M640 70 L800 70" stroke="#7657a3" stroke-width="5"/><text x="640" y="60" font-size="12" fill="#7657a3">carrier precursor, internal signals</text>
  <ellipse cx="760" cy="130" rx="46" ry="22" fill="#e3edf8" stroke="#1d68b3" stroke-width="2"/><text x="760" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">TOM70</text>
  <rect x="699" y="294" width="28" height="48" rx="6" fill="#ffffff" stroke="#b8620f" stroke-width="2"/><text x="735" y="360" font-size="12" font-weight="600" fill="#15201e">TIM22</text>
  <path d="M713 150 L713 290" stroke="#7657a3" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <!-- legend -->
  <rect x="30" y="460" width="16" height="16" rx="3" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/><text x="54" y="473" font-size="13" fill="#15201e">presequence receptor: clean fit for GO:0140436</text>
  <rect x="420" y="460" width="16" height="16" rx="3" fill="#ffffff" stroke="#b8620f" stroke-width="2"/><text x="444" y="473" font-size="13" fill="#15201e">channel: receptor term doubtful, review each row</text>
  <rect x="30" y="486" width="16" height="16" rx="3" fill="#e3edf8" stroke="#1d68b3" stroke-width="2"/><text x="54" y="499" font-size="13" fill="#15201e">TOM70: receptor for carrier and hydrophobic precursors; upstream groups it with the TOM receptors</text>
</svg>
