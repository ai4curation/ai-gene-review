<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15201e"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="32" y="40" font-size="23" font-weight="bold" fill="#15201e">Bile acid synthesis crosses four compartment boundaries</text>
  <text x="32" y="64" font-size="15" fill="#56655f">Bile-acid scoping sketch. Green: reviewed transporter. Red "?": candidate gap to inventory.</text>

  <!-- hepatocyte -->
  <rect x="24" y="82" width="820" height="420" rx="26" fill="#f4f7f6" stroke="#8fa39c" stroke-width="2"/>
  <text x="44" y="108" font-size="14" font-weight="bold" fill="#56655f">hepatocyte cytosol</text>

  <!-- mitochondrion -->
  <ellipse cx="200" cy="300" rx="130" ry="82" fill="#ffffff" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="200" y="262" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e6b66">mitochondrion</text>
  <text x="200" y="298" font-size="13" text-anchor="middle" fill="#15201e">CYP27A1</text>
  <text x="200" y="316" font-size="12" text-anchor="middle" fill="#56655f">side-chain hydroxylation</text>

  <!-- peroxisome -->
  <circle cx="560" cy="300" r="96" fill="#ffffff" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="560" y="250" font-size="15" font-weight="bold" text-anchor="middle" fill="#0e6b66">peroxisome</text>
  <text x="560" y="290" font-size="13" text-anchor="middle" fill="#15201e">β-oxidation</text>
  <text x="560" y="308" font-size="12" text-anchor="middle" fill="#56655f">C27-CoA → C24</text>
  <text x="560" y="326" font-size="12" text-anchor="middle" fill="#56655f">bile acids</text>

  <!-- step 1: cholesterol import -->
  <text x="70" y="150" font-size="13" fill="#15201e">cholesterol, C27 intermediates</text>
  <path d="M120,160 L150,222" stroke="#15201e" stroke-width="2" marker-end="url(#a)"/>
  <text x="44" y="200" font-size="12" fill="#56655f">StAR, TSPO</text>
  <text x="44" y="215" font-size="12" fill="#56655f">(partial)</text>

  <!-- step 2: mito export BBE -->
  <path d="M300,250 L380,200" stroke="#bd3a30" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <circle cx="340" cy="222" r="15" fill="#bd3a30"/>
  <text x="340" y="228" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">?</text>
  <text x="300" y="160" font-size="12" fill="#bd3a30">export of C27 intermediates</text>
  <text x="300" y="175" font-size="12" fill="#bd3a30">(SLC25 candidates?)</text>

  <!-- step 3: ABCD3 import -->
  <text x="300" y="398" font-size="13" fill="#15201e">DHCA-CoA, THCA-CoA</text>
  <path d="M420,384 L484,344" stroke="#1d8a4b" stroke-width="3" marker-end="url(#a)"/>
  <rect x="470" y="404" width="84" height="34" rx="6" fill="#1d8a4b"/>
  <text x="512" y="426" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">ABCD3</text>
  <text x="380" y="462" font-size="12" fill="#1d8a4b">import resolved by the pilot review</text>
  <text x="380" y="478" font-size="12" fill="#1d8a4b">proposed GO:0015125 (IMP)</text>

  <!-- step 4: peroxisome export BBE -->
  <path d="M650,262 L720,210" stroke="#bd3a30" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <circle cx="684" cy="236" r="15" fill="#bd3a30"/>
  <text x="684" y="242" font-size="17" font-weight="bold" text-anchor="middle" fill="#ffffff">?</text>
  <text x="620" y="150" font-size="12" fill="#bd3a30">export of mature C24 bile acids</text>
  <text x="620" y="165" font-size="12" fill="#bd3a30">(or diffusion after CoA release?)</text>

  <!-- canalicular -->
  <rect x="844" y="160" width="94" height="240" fill="#dcefec" stroke="#0e6b66"/>
  <text x="891" y="186" font-size="13" font-weight="bold" text-anchor="middle" fill="#0e6b66">bile</text>
  <text x="891" y="202" font-size="12" text-anchor="middle" fill="#0e6b66">canaliculus</text>
  <path d="M760,300 L842,300" stroke="#15201e" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="770" y="310" width="66" height="28" rx="6" fill="#0e6b66"/>
  <text x="803" y="329" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">ABCB11</text>
  <text x="742" y="360" font-size="11" fill="#56655f">BSEP; conjugated vs</text>
  <text x="742" y="374" font-size="11" fill="#56655f">unconjugated nuances</text>
</svg>
