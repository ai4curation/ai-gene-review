<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">Where the 20 genes act in a T cell (and its partners)</text>
  <text x="24" y="56" font-size="13" fill="#56655f">Grouping follows the project page's "Key Pathways"; arrows: green = activates, red = inhibits</text>

  <!-- cell outline -->
  <rect x="24" y="110" width="690" height="390" rx="40" fill="#e8f1ee" stroke="#8fa39c" stroke-width="3"/>
  <text x="44" y="488" font-size="13" fill="#56655f">T cell</text>

  <!-- surface receptors row -->
  <!-- TCR -->
  <rect x="60" y="92" width="70" height="40" rx="6" fill="#ffffff" stroke="#15201e" stroke-width="2"/>
  <text x="95" y="117" font-size="13" text-anchor="middle" fill="#15201e">TCR</text>
  <rect x="150" y="92" width="70" height="40" rx="6" fill="#dcefec" stroke="#1d8a4b" stroke-width="2"/>
  <text x="185" y="117" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">CD28</text>
  <rect x="240" y="92" width="70" height="40" rx="6" fill="#dcefec" stroke="#bd3a30" stroke-width="2"/>
  <text x="275" y="117" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">CTLA4</text>
  <text x="185" y="82" font-size="12" text-anchor="middle" fill="#56655f">co-stimulation</text>
  <text x="275" y="82" font-size="12" text-anchor="middle" fill="#56655f">co-inhibition</text>
  <!-- cytokine receptors -->
  <rect x="340" y="92" width="70" height="40" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="375" y="117" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">IL2RA</text>
  <rect x="420" y="92" width="64" height="40" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="452" y="117" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">IL7R</text>
  <rect x="494" y="92" width="70" height="40" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="529" y="117" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">IL23R</text>
  <text x="452" y="82" font-size="12" text-anchor="middle" fill="#56655f">cytokine receptors</text>
  <rect x="590" y="92" width="100" height="40" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="640" y="117" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">TNFRSF1A</text>
  <text x="640" y="82" font-size="12" text-anchor="middle" fill="#56655f">TNF receptor 1</text>

  <!-- PTPN22 brake on TCR -->
  <rect x="60" y="180" width="110" height="36" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="115" y="203" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">PTPN22</text>
  <text x="115" y="232" font-size="11" text-anchor="middle" fill="#56655f">phosphatase</text>
  <line x1="95" y1="178" x2="95" y2="138" stroke="#bd3a30" stroke-width="3"/>
  <line x1="84" y1="138" x2="106" y2="138" stroke="#bd3a30" stroke-width="3"/>

  <!-- CTLA4 inhibits CD28 signal -->
  <path d="M275 134 C 275 160, 200 160, 190 140" fill="none" stroke="#bd3a30" stroke-width="2.5"/>
  <line x1="181" y1="143" x2="199" y2="137" stroke="#bd3a30" stroke-width="3"/>

  <!-- STATs -->
  <rect x="360" y="190" width="80" height="36" rx="18" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="400" y="213" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">STAT4</text>
  <rect x="460" y="190" width="80" height="36" rx="18" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="500" y="213" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">STAT3</text>
  <line x1="529" y1="134" x2="505" y2="186" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="502,190 498,178 510,181" fill="#1d8a4b"/>
  <text x="460" y="250" font-size="11" fill="#56655f">IL-12 / IFN (STAT4), IL-23 (STAT3)</text>

  <!-- NF-kB with TNFAIP3 brake -->
  <rect x="600" y="190" width="80" height="36" rx="18" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="640" y="213" font-size="13" text-anchor="middle" fill="#15201e">NF-κB</text>
  <line x1="640" y1="134" x2="640" y2="186" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="640,190 634,178 646,178" fill="#1d8a4b"/>
  <rect x="580" y="262" width="110" height="36" rx="6" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="635" y="285" font-size="13" text-anchor="middle" font-weight="bold" fill="#15201e">TNFAIP3</text>
  <text x="635" y="314" font-size="11" text-anchor="middle" fill="#56655f">A20, NF-κB brake</text>
  <line x1="640" y1="260" x2="640" y2="230" stroke="#bd3a30" stroke-width="3"/>
  <line x1="629" y1="230" x2="651" y2="230" stroke="#bd3a30" stroke-width="3"/>

  <!-- nucleus with TFs -->
  <ellipse cx="300" cy="400" rx="250" ry="72" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="300" y="350" font-size="12" text-anchor="middle" fill="#56655f">nucleus: lineage and tolerance transcription factors</text>
  <text x="150" y="385" font-size="14" font-weight="bold" fill="#15201e">GATA3</text>
  <text x="150" y="401" font-size="11" fill="#56655f">Th2</text>
  <text x="225" y="385" font-size="14" font-weight="bold" fill="#15201e">IRF4</text>
  <text x="290" y="385" font-size="14" font-weight="bold" fill="#15201e">BACH2</text>
  <text x="365" y="385" font-size="14" font-weight="bold" fill="#15201e">EGR2</text>
  <text x="365" y="401" font-size="11" fill="#56655f">anergy</text>
  <text x="430" y="385" font-size="14" font-weight="bold" fill="#15201e">IKZF1</text>
  <text x="200" y="435" font-size="14" font-weight="bold" fill="#15201e">SMAD3</text>
  <text x="200" y="451" font-size="11" fill="#56655f">TGF-β signal</text>
  <line x1="450" y1="228" x2="450" y2="336" stroke="#1d8a4b" stroke-width="2.5"/>
  <polygon points="450,342 444,330 456,330" fill="#1d8a4b"/>

  <!-- ER with ORMDL3 -->
  <rect x="470" y="420" width="200" height="50" rx="20" fill="#ffffff" stroke="#8fa39c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="570" y="442" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">ORMDL3</text>
  <text x="570" y="460" font-size="11" text-anchor="middle" fill="#56655f">ER; sphingolipid regulation</text>

  <!-- secreted cytokines -->
  <rect x="740" y="110" width="196" height="390" rx="8" fill="#ffffff" stroke="#8fa39c" stroke-width="2"/>
  <text x="756" y="136" font-size="14" font-weight="bold" fill="#0e6b66">Secreted cytokines</text>
  <text x="756" y="176" font-size="15" font-weight="bold" fill="#15201e">IL4, IL13</text>
  <text x="756" y="194" font-size="12" fill="#56655f">Th2 cytokines</text>
  <text x="756" y="236" font-size="15" font-weight="bold" fill="#15201e">IL10</text>
  <text x="756" y="254" font-size="12" fill="#56655f">anti-inflammatory</text>
  <path d="M552 390 C 610 380, 700 350, 732 340" fill="none" stroke="#1d8a4b" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="738,338 726,334 728,346" fill="#1d8a4b"/>
  <text x="756" y="320" font-size="12" fill="#56655f">Gene symbols in bold are</text>
  <text x="756" y="336" font-size="12" fill="#56655f">the 20 project genes;</text>
  <text x="756" y="352" font-size="12" fill="#56655f">TCR and NF-κB are shown</text>
  <text x="756" y="368" font-size="12" fill="#56655f">for context only.</text>
</svg>
