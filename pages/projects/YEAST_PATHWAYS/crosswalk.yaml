- module: oxphos
  action: ALIGN
  pathways: [PWY3O-188]
  gocam: [YeastPathways_PWY3O-188, 663d668500000596]
  rationale: >-
    S. cerevisiae lacks complex I and uses NDI1/NDE1/NDE2 type II NADH
    dehydrogenases -- a defining variant to add (S. pombe also lacks complex
    I). Complexes II-IV via the mitochondrial_complex_* modules.

- module: diphthamide_biosynthesis
  action: NEW
