# YeastPathways -> module crosswalk.
#
# Every YeastPathways (SGD YeastCyc) pathway and every metabolic PomBase GO-CAM
# is assigned to exactly one module group. Groups are deliberately coarser than
# YeastCyc: YeastCyc splits superpathways, variants and single reactions into
# separate frames, whereas a module is a reusable biological unit at the level
# at which the biology generalises across taxa.
#
# action:
#   NEW    - no adequate module exists; create one at the stated scope.
#   ALIGN  - an existing taxon-neutral module covers the chemistry; add fungal
#            variants/representatives, GO-CAM associations and evidence.
#   GENERALIZE - an existing module is written for one lineage (usually human);
#            broaden title/description and add a fungal variant without losing
#            the lineage-specific content.
#   FOLD   - pathway is a single reaction or fragment; it is recorded inside
#            the named module rather than as a module of its own.
#   NOTE   - no module: pathway hole (no yeast enzyme), grab-bag frame, or a
#            single-enzyme frame with no reusable boundary; see `rationale`.
#
# scope: the generalisation level chosen for the module.
#
# Pathway ids are YeastCyc frame ids (https://pathway.yeastgenome.org/YEAST/
# NEW-IMAGE?object=<id>); `gocam` lists production GO-CAM ids (YeastPathways_*
# models are the YeastPathways2GO conversions, GO_REF:0000123; bare hex ids are
# PomBase models).

groups:

# ---------------------------------------------------------------- amino acids
- module: histidine_biosynthesis
  action: ALIGN
  scope: cellular organisms with the His pathway (bacteria, archaea, fungi, plants)
  pathways: [HISTSYN-PWY]
  gocam: [YeastPathways_HISTSYN-PWY, 6690711d00002904]
  rationale: >-
    Existing module is already family-level with architecture variants. Fungi
    add two fusion architectures that must be explicit variants: the
    trifunctional HIS4 (HisI-HisE-HisD) and the bifunctional HIS7 (HisH-HisF
    glutamine amidotransferase/cyclase). Fungal HIS2 is a PHP-family
    histidinol-phosphatase, a third independent phosphatase origin.

- module: arginine_biosynthesis
  action: ALIGN
  scope: acetyl-cycle (recycling) arginine biosynthesis in microbes and fungi
  pathways: [ARGSYNBSUB-PWY, CITRUL-BIO2-PWY]
  gocam: [YeastPathways_ARGSYNBSUB-PWY, YeastPathways_CITRUL-BIO2-PWY, 6690711d00000916]
  rationale: >-
    Fungi run the cyclic (ornithine acetyltransferase, ARG7) route split
    between mitochondrion (glutamate -> ornithine) and cytosol (ornithine ->
    arginine), with a fused ARG5,6 kinase/reductase polyprotein and an
    arginine-specific carbamoyl-phosphate synthetase (CPA1/CPA2) distinct from
    the pyrimidine CPSase-ATCase (URA2). Citrulline biosynthesis is a fragment of
    this pathway and is folded in.

- module: lysine_biosynthesis_aminoadipate
  action: NEW
  scope: alpha-aminoadipate (AAA) pathway in fungi and the LysW-carrier AAA pathway of Thermus/Sulfolobus
  pathways: [LYSINE-AMINOAD-PWY-2]
  gocam: [YeastPathways_LYSINE-AMINOAD-PWY-2, 667dfe8d00001131]
  rationale: >-
    Existing lysine_biosynthesis is the bacterial diaminopimelate pathway,
    chemically unrelated. The AAA pathway is the right generalisation: the
    homocitrate -> 2-oxoadipate half is shared by fungi and LysW-type
    prokaryotes (homologous to the leucine/TCA aconitase and isocitrate
    dehydrogenase steps), while the 2-aminoadipate -> lysine half diverges
    (fungal LYS2 adenylation/reduction + saccharopine route vs. LysW-protected
    ArgBCDE-like route). Model the second half as a variant set.

- module: branched_chain_amino_acid_biosynthesis
  action: ALIGN
  scope: cellular organisms (bacteria, fungi, plants)
  pathways: [BRANCHED-CHAIN-AA-SYN-PWY-1, ILEUSYN-PWY-1, VALSYN-PWY, LEUSYN-PWY-1]
  gocam: [YeastPathways_BRANCHED-CHAIN-AA-SYN-PWY-1, YeastPathways_ILEUSYN-PWY-1, YeastPathways_VALSYN-PWY, YeastPathways_LEUSYN-PWY-1, 6690711d00002706]
  rationale: >-
    Existing module already models the shared ILV2/ILV6-ILV5-ILV3 trunk and
    leucine branch. Fungal specifics: the mitochondrial location of the
    shared trunk and of alpha-IPM synthesis, alpha-IPM export, cytosolic
    LEU1/LEU2, and the BAT1 (mitochondrial)/BAT2 (cytosolic) transaminase
    paralog pair from the whole-genome duplication.

- module: bacterial_shikimate_chorismate_biosynthesis
  action: GENERALIZE
  scope: shikimate pathway in bacteria, fungi, plants and apicomplexa
  pathways: [ARO-PWY-1]
  gocam: [YeastPathways_ARO-PWY-1, 67369e7600004623]
  rationale: >-
    The seven reactions are universal; fungi encode steps 2-6 in the
    pentafunctional AROM polypeptide (ARO1), which is the main architectural
    variant. Keep the slug; broaden the title/description and add an AROM
    fusion variant rather than creating a parallel fungal module.

- module: phenylalanine_tyrosine_biosynthesis
  action: NEW
  scope: chorismate -> phenylalanine/tyrosine in bacteria, fungi and plants (prephenate and arogenate routes)
  pathways: [COMPLETE-ARO-PWY-1, PWY3O-4153, PWY3O-4120]
  gocam: [YeastPathways_COMPLETE-ARO-PWY-1, YeastPathways_PWY3O-4153, YeastPathways_PWY3O-4120, 67369e7600004623]
  rationale: >-
    No module covers the chorismate-mutase branch. The generalisation is a
    branch module with a route variant set: fungi/most bacteria use the
    prephenate route (PHA2 prephenate dehydratase, TYR1 prephenate
    dehydrogenase, then ARO8/ARO9 transamination), plants and some bacteria
    transaminate first (arogenate route). The superpathway frame is the union of
    the shikimate, tryptophan and this module and is not modelled itself.

- module: tryptophan_biosynthesis
  action: ALIGN
  scope: microbial and plant tryptophan biosynthesis
  pathways: [TRPSYN-PWY-1]
  gocam: [YeastPathways_TRPSYN-PWY-1, 67369e7600004623]
  rationale: >-
    Existing microbial module. Fungal fusion variants: TRP3 (TrpG
    glutamine-amidotransferase + TrpC indole-3-glycerol-phosphate synthase) and
    TRP5 (fused TrpA-TrpB tryptophan synthase), TRP2/TRP3 anthranilate synthase.

- module: phosphorylated_serine_biosynthesis
  action: ALIGN
  scope: cellular organisms
  pathways: [SERSYN-PWY]
  gocam: [YeastPathways_SERSYN-PWY, 6690711d00001545]
  rationale: >-
    Taxon-neutral three-step module already; add SER3/SER33, SER1, SER2 and
    fission yeast exemplars. Yeast also makes serine from glycine (SHMT
    reverse) and glyoxylate (AGX1/SHM); those routes are in glycine_serine_interconversion.

- module: glycine_serine_interconversion
  action: NEW
  scope: eukaryotic and microbial glycine supply routes
  pathways: [PWY3O-261, GLYSYN-PWY, GLYSYN-THR-PWY, GLYSYN-ALA-PWY, PWY3O-230]
  gocam: [YeastPathways_PWY3O-261]
  rationale: >-
    YeastCyc has five frames for glycine/serine formation, each one reaction.
    Biologically they are alternative routes into one glycine pool:
    serine hydroxymethyltransferase (cytosolic SHM2 / mitochondrial SHM1),
    threonine aldolase (GLY1, the main route in S. cerevisiae), and
    alanine:glyoxylate aminotransferase (AGX1). Model as a variant set of
    glycine-forming routes; the glycine cleavage system is separate.

- module: aspartate_family_threonine_biosynthesis
  action: NEW
  scope: aspartate -> homoserine -> threonine in bacteria, fungi and plants
  pathways: [THRESYN-PWY, PWY3O-7, P4-PWY-1, HOMOSERSYN-PWY, HOMOSER-THRESYN-PWY]
  gocam: [YeastPathways_THRESYN-PWY, YeastPathways_PWY3O-7, YeastPathways_P4-PWY-1, YeastPathways_HOMOSERSYN-PWY, YeastPathways_HOMOSER-THRESYN-PWY, 678073a900003175]
  rationale: >-
    The aspartate-family trunk (aspartate kinase, aspartate-semialdehyde
    dehydrogenase, homoserine dehydrogenase) feeds both threonine and
    methionine. Yeast HOM3/HOM2/HOM6 are monofunctional whereas E. coli
    ThrA/MetL and plant AK-HSDH are bifunctional fusions; THR1/THR4 complete
    threonine. Lysine is NOT a branch in fungi (unlike bacteria), which is a
    key generalisation caveat. Aspartate supply (PYC + AAT) belongs to
    aspartate_asparagine_metabolism.

- module: methionine_biosynthesis
  action: ALIGN
  scope: L-methionine from homoserine (bacteria, fungi, plants)
  pathways: [PWY3O-954, PWY-5344, PWY3O-238]
  gocam: [YeastPathways_PWY3O-954, YeastPathways_PWY-5344, YeastPathways_PWY3O-238, 66a3e0bb00001342]
  rationale: >-
    Existing module already has activation/sulfur-incorporation/methylation
    variants. Fungi: MET2 homoserine O-acetyltransferase, MET17 direct
    sulfhydrylase, MET6 cobalamin-independent methionine synthase using
    MET13/MET12 + MET7 polyglutamate folate.

- module: fungal_sulfur_amino_acid_transsulfuration
  action: NEW
  scope: bidirectional transsulfuration in fungi (forward CBS/CGL and reverse CGS/CBL)
  pathways: [PWY-821-1, HOMOCYS-CYS-CONVERT, CYSTEINE-SYN2-PWY, HOMOCYSDEGR-PWY-1]
  gocam: [YeastPathways_PWY-821-1, YeastPathways_HOMOCYS-CYS-CONVERT, YeastPathways_CYSTEINE-SYN2-PWY, YeastPathways_HOMOCYSDEGR-PWY-1]
  rationale: >-
    homocysteine_metabolism is human-specific (remethylation + forward
    transsulfuration). S. cerevisiae makes cysteine only by forward
    transsulfuration (CYS4, CYS3) but also runs the reverse direction (STR2,
    STR3), so a bidirectional module is the right generalisation for fungi;
    the forward arm conforms to the animal CBS/CGL arm. Named for its scope;
    linked to homocysteine_metabolism via notes.

- module: aps_dependent_assimilatory_sulfate_reduction
  action: ALIGN
  scope: assimilatory sulfate reduction (APS and PAPS branches)
  pathways: [SO4ASSIM-PWY, PWY-781, PWY-5340]
  gocam: [YeastPathways_SO4ASSIM-PWY, YeastPathways_PWY-781, YeastPathways_PWY-5340, 66a3e0bb00001342]
  rationale: >-
    The existing module explicitly models only the APS-reductase branch and
    calls PAPS the alternative. Fungi use the PAPS branch (MET14 APS kinase,
    MET16 PAPS reductase) and a NADPH sulfite reductase MET10/MET5. Add the
    PAPS branch as a variant rather than creating a second module; PAPS
    activation for sulfonation (PWY-5340) is the MET3+MET14 prefix.

- module: siroheme_biosynthesis
  action: NEW
  scope: uroporphyrinogen III -> siroheme (bacteria CysG, fungi Met1+Met8, plants)
  pathways: [PWY-5194-1]
  gocam: [YeastPathways_PWY-5194-1]
  rationale: >-
    Three reactions (SAM-dependent bis-methylation, dehydrogenation,
    ferrochelation) with fused (CysG) and split (MET1 + MET8) architectures;
    cofactor supply for sulfite reductase. Shares uroporphyrinogen III with heme.

- module: methionine_cycle
  action: ALIGN
  scope: taxon-neutral SAM cycle
  pathways: [PWY-5041, SAM-PWY]
  gocam: [YeastPathways_PWY-5041, 69c59f8a00000584]
  rationale: >-
    Existing module is taxon-neutral; add SAM1/SAM2, SAH1, MET6 and fission
    yeast exemplars. SAM biosynthesis (single MAT reaction) folds in.

- module: methionine_salvage_mta_cycle
  action: NEW
  scope: universal 5'-methylthioadenosine (MTA) cycle
  pathways: [PWY3O-64, PWY3O-351]
  gocam: [YeastPathways_PWY3O-64, YeastPathways_PWY3O-351]
  rationale: >-
    Six-step MTA cycle (MEU1 MTA phosphorylase, MRI1 isomerase, MDE1
    dehydratase, UTR4 enolase-phosphatase, ADI1 dioxygenase, ARO8/BAT
    transamination). YeastCyc attaches only the transaminases; the remaining
    enzymes are well characterised in yeast and must be added. The
    superpathway frame adds polyamine synthesis, which is a separate module.

- module: proline_metabolism
  action: GENERALIZE
  scope: eukaryotic proline-P5C cycle (fungi, animals, plants)
  pathways: [PROSYN-PWY, PROUT-PWY]
  gocam: [YeastPathways_PROSYN-PWY, YeastPathways_PROUT-PWY, 678073a900003902]
  rationale: >-
    The chemistry is identical; only the architecture differs (yeast PRO1
    gamma-glutamyl kinase + PRO2 gamma-glutamyl-phosphate reductase vs. the
    fused animal/plant P5CS; PUT1/PUT2 vs. PRODH/ALDH4A1). Broaden the existing
    module with a split-P5CS variant.

- module: arginine_catabolism_arginase_pathway
  action: NEW
  scope: arginase -> ornithine aminotransferase -> P5C -> glutamate (fungi, plants, animals)
  pathways: [ARGDEG-YEAST-PWY, ARG-PRO-PWY]
  gocam: [YeastPathways_ARGDEG-YEAST-PWY, YeastPathways_ARG-PRO-PWY]
  rationale: >-
    Arginine as a nitrogen source: CAR1 arginase, CAR2 ornithine
    aminotransferase, spontaneous cyclisation, then PUT2 (or PRO3 back to
    proline). Shares P5C with proline_metabolism; the urea product feeds
    ureide/urea catabolism.

- module: nitrogen_assimilation_glutamate_glutamine
  action: NEW
  scope: eukaryotic microbial ammonium assimilation (GDH + GS/GOGAT) and glutamate catabolism
  pathways: [PWY3O-13, GLUNH3-PWY, GLNSYN-PWY, GLUGLNSYN-PWY, PWY-3322]
  gocam: [YeastPathways_PWY3O-13, 67c10cc400000148]
  rationale: >-
    bacterial_ammonia_assimilation is bacterial GS-GOGAT only and
    glutamate_glutamine_ammonia_hub is human (no GOGAT, mitochondrial GDH).
    Fungi assimilate ammonium chiefly by NADP-GDH (GDH1/GDH3) plus GS (GLN1)
    and NADH-GOGAT (GLT1), with NAD-GDH (GDH2) for catabolism and
    2-oxoglutarate from IDH/IDP. A fungal-scope module with assimilation
    variants (GDH vs GS-GOGAT) is the honest level; conformance notes link the
    bacterial GS-GOGAT module.

- module: aspartate_asparagine_metabolism
  action: NEW
  scope: aspartate and asparagine synthesis and turnover (eukaryotes)
  pathways: [ASPBIO-PWY, ASPARTATESYN-PWY, ASPARAGINE-BIOSYNTHESIS-1, ASPARAGINE-DEG2-PWY, ALANINE-SYN2-PWY, ALANINE-DEG3-PWY]
  gocam: [YeastPathways_ASPBIO-PWY, YeastPathways_ASPARAGINE-BIOSYNTHESIS-1, YeastPathways_ASPARAGINE-DEG2-PWY, 67c10cc400005826]
  rationale: >-
    Single-reaction YeastCyc frames (AAT transamination, ASN1/ASN2
    asparagine synthetase, ASP1/ASP3 asparaginases, ALT1 alanine
    transaminase) are folded into one transamination/amidation module rather
    than five one-enzyme modules. Pyruvate carboxylation (PYC) is upstream and
    lives in pyruvate_metabolism.

- module: ehrlich_pathway
  action: NEW
  scope: fungal amino-acid catabolism to fusel alcohols/acids (Ehrlich pathway)
  pathways: [PWY3O-4109, PWY3O-4112, PWY3O-4105, PWY3O-4115, PWY3O-4108, PWY3O-214]
  gocam: [YeastPathways_PWY3O-4109, YeastPathways_PWY3O-4112, YeastPathways_PWY3O-4105, YeastPathways_PWY3O-4115, YeastPathways_PWY3O-4108, YeastPathways_PWY3O-214]
  rationale: >-
    Six YeastCyc frames (Ile, Leu, Val, Phe, Tyr, Trp degradation) are one
    three-step pathway with substrate variants: transamination (BAT1/BAT2 for
    BCAA, ARO8/ARO9 for aromatics) -> thiamine-dependent 2-oxoacid
    decarboxylation (ARO10, PDC1/5/6) -> reduction (ADH) or oxidation (ALD).
    YeastCyc omits ARO10, the main phenylpyruvate decarboxylase; it must be
    added. The superpathway structure is the right generalisation, with
    substrate as the variant axis.

- module: gaba_shunt
  action: GENERALIZE
  scope: GABA shunt in fungi, plants and animals
  pathways: [GLUDEG-I-PWY-1, YEAST-4AMINOBUTMETAB-PWY]
  gocam: [YeastPathways_GLUDEG-I-PWY-1, YeastPathways_YEAST-4AMINOBUTMETAB-PWY, 696022cd00001857]
  rationale: >-
    Same three activities (GAD1, UGA1, UGA2) in yeast; module is labelled
    mammalian. Broaden with fungal exemplars while keeping the neuronal context
    as a lineage note.

- module: polyamine_metabolism
  action: GENERALIZE
  scope: eukaryotic polyamine biosynthesis
  pathways: [POLYAMSYN-YEAST-PWY, BSUBPOLYAMSYN-PWY, ARGSPECAT-PWY, PWY-46]
  gocam: [YeastPathways_POLYAMSYN-YEAST-PWY, YeastPathways_BSUBPOLYAMSYN-PWY, YeastPathways_ARGSPECAT-PWY, 67b1629100004168]
  rationale: >-
    SPE1 ODC, SPE2 AdoMetDC, SPE3/SPE4 aminopropyltransferases, FMS1
    polyamine oxidase (back-conversion, also beta-alanine source) are
    orthologous to the human set; add fungal exemplars.

- module: ureide_urea_catabolism
  action: NEW
  scope: purine ring nitrogen recovery (allantoin -> urea -> NH3/CO2) with urease vs urea amidolyase variants
  pathways: [ALLANTOINDEG-PWY, PWY-5694, PWY-5697, PWY-5703]
  gocam: [YeastPathways_ALLANTOINDEG-PWY, YeastPathways_PWY-5694, YeastPathways_PWY-5697, YeastPathways_PWY-5703, 665912ed00002626]
  rationale: >-
    S. cerevisiae lacks urate oxidase and urease: it takes up allantoin and
    uses DAL1-DAL2-DAL3 then the biotin-dependent urea amidolyase DUR1,2.
    S. pombe instead has urate oxidase and urease (PomBase model). The right
    generalisation is one ureide pathway with an entry variant (urate oxidase
    route present/absent) and a urea-cleavage variant (urease vs. urea
    carboxylase + allophanate hydrolase).

- module: chorismate_superpathway
  action: NOTE
  pathways: [ALL-CHORISMATE-PWY-1]
  rationale: >-
    Union frame (shikimate + Phe/Tyr + Trp + folate pABA + one-carbon); every
    reaction is assigned to a component module. Not modelled itself.

- module: lysine_catabolism
  action: NOTE
  pathways: [LYSDEGII-PWY, PWY-5177]
  rationale: >-
    LYSDEGII-PWY has no yeast enzymes in YeastCyc and PWY-5177 has only ERG10
    for the final thiolase. S. cerevisiae does not use lysine as a carbon or
    nitrogen source; these frames are pathway holes/predictions. No module.

- module: threonine_serine_deamination
  action: NOTE
  pathways: [THREOCAT2-PWY, SERDEG-PWY]
  rationale: >-
    CHA1 catabolic serine/threonine dehydratase only (one enzyme); recorded in
    the ehrlich_pathway/BCAA notes as the catabolic counterpart of ILV1.

# ------------------------------------------------------------- central carbon
- module: emp_glycolysis
  action: ALIGN
  scope: generic EMP glycolysis
  pathways: [GLYCOLYSIS, PWY3O-3827, PWY3O-0, PWY3O-1743]
  gocam: [YeastPathways_GLYCOLYSIS, YeastPathways_PWY3O-0, YeastPathways_PWY3O-1743, 663d668500002302]
  rationale: >-
    Generic module; add HXK1/HXK2/GLK1, PGI1, PFK1/PFK2 hetero-octamer, FBA1,
    TPI1, TDH1-3, PGK1, GPM1, ENO1/2, CDC19/PYK2 and fission yeast exemplars.
    Fructose and mannose entry frames (hexokinase, PMI40) fold in as entry
    points.

- module: alcoholic_fermentation
  action: NEW
  scope: pyruvate -> acetaldehyde -> ethanol (yeasts, plants under hypoxia, Zymomonas)
  pathways: [GLUCFERMEN-PWY, PWY3O-440, PWY3O-335, PWY3O-981, PWY3O-661, PWY3O-246]
  gocam: [YeastPathways_GLUCFERMEN-PWY, YeastPathways_PWY3O-440, YeastPathways_PWY3O-335, YeastPathways_PWY3O-981, 678073a900000393]
  rationale: >-
    Two-step NAD+-regenerating branch (PDC1/5/6 + ADH1) downstream of
    glycolysis, with the acetoin/2,3-butanediol carboligation side branch
    (PDC side activity, BDH1) folded in as an optional branch. The
    superpathway frame is glycolysis + this module.

- module: pdh_bypass_acetyl_coa_synthesis
  action: NEW
  scope: cytosolic acetyl-CoA via pyruvate decarboxylase/acetaldehyde dehydrogenase/acetyl-CoA synthetase; ethanol reutilisation
  pathways: [PWY3O-4300, ACETATEUTIL2-PWY]
  gocam: [YeastPathways_PWY3O-4300]
  rationale: >-
    Fungi lack ATP-citrate lyase (in S. cerevisiae) and make cytosolic
    acetyl-CoA by PDC -> ALD6 -> ACS1/ACS2; on ethanol, ADH2 feeds the same
    chain. Distinct from alcoholic fermentation (opposite direction) and from
    mitochondrial PDH.

- module: gluconeogenesis
  action: ALIGN
  scope: generic gluconeogenesis
  pathways: [GLUCONEO-PWY-1]
  gocam: [YeastPathways_GLUCONEO-PWY-1]
  rationale: Add PYC1/2, PCK1, FBP1, MDH2 and the glycolytic reversible enzymes.

- module: tca_cycle
  action: ALIGN
  scope: generic TCA cycle
  pathways: [TCA-EUK-PWY, PWY-5084, PWY3O-94]
  gocam: [YeastPathways_TCA-EUK-PWY, YeastPathways_PWY-5084, YeastPathways_PWY3O-94, 665912ed00000015]
  rationale: >-
    Add yeast/fission yeast exemplars (CIT1, ACO1, IDH1/IDH2 NAD-IDH, KGD1/KGD2/
    LPD1, LSC1/LSC2, SDH1-4, FUM1, MDH1). The superpathway frame adds the
    glyoxylate cycle, a separate module.

- module: glyoxylate_cycle
  action: NEW
  scope: isocitrate lyase + malate synthase bypass (bacteria, fungi, plants, nematodes)
  pathways: [GLYOXYLATE-BYPASS]
  gocam: [YeastPathways_GLYOXYLATE-BYPASS]
  rationale: >-
    Two signature enzymes (ICL1, MLS1/DAL7) plus shared citrate synthase
    (peroxisomal CIT2), aconitase and malate dehydrogenase (MDH3), with the
    fungal compartmental split (peroxisome/cytosol) as context.
    glycolate_glyoxylate_assimilation is a different bacterial pathway.

- module: pyruvate_metabolism
  action: ALIGN
  scope: mitochondrial pyruvate fates (PDH + PC)
  pathways: [PYRUVDEHYD-PWY]
  gocam: [YeastPathways_PYRUVDEHYD-PWY, 67086be200000251]
  rationale: Add PDA1/PDB1/LAT1/LPD1/PDX1 and PYC1/PYC2 (cytosolic in yeast).

- module: pentose_phosphate_pathway
  action: ALIGN
  scope: generic PPP (oxidative + non-oxidative + PRPP)
  pathways: [PENTOSE-P-PWY, OXIDATIVEPENT-PWY, NONOXIPENT-PWY, PWY0-662]
  gocam: [YeastPathways_PENTOSE-P-PWY, YeastPathways_OXIDATIVEPENT-PWY, YeastPathways_NONOXIPENT-PWY, 67b1629100000953]
  rationale: >-
    Add ZWF1, SOL3/SOL4, GND1/GND2, RPE1, RKI1, TKL1/2, TAL1/NQM1 and PRS1-5.
    YeastCyc omits the lactonases and 6PGDH in its gene lists; they must be
    added from literature.

- module: glycerol_metabolism
  action: NEW
  scope: glycerol synthesis (G3P dehydrogenase + G3P phosphatase) and utilisation (glycerol kinase + G3P oxidase/dehydrogenase) in eukaryotic microbes
  pathways: [PWY3O-48, AERO-GLYCEROL-CAT-PWY]
  gocam: [YeastPathways_AERO-GLYCEROL-CAT-PWY, 6796b94c00004743]
  rationale: >-
    Synthesis (GPD1/GPD2 + GPP1/GPP2; osmoprotection and redox balance) and
    utilisation (GUT1 + mitochondrial FAD-GUT2) share glycerol-3-phosphate;
    glycerol_phosphate_shuttle (human) is the redox-shuttle subset.

- module: galactose_leloir_pathway
  action: ALIGN
  scope: generic Leloir pathway
  pathways: [YEAST-GALACT-METAB-PWY]
  gocam: [YeastPathways_YEAST-GALACT-METAB-PWY, 6796b94c00002484]
  rationale: Add GAL1, GAL7, GAL10 (fused epimerase/mutarotase), PGM1/PGM2.

- module: xylose_oxidoreductase_pathway
  action: NEW
  scope: D-xylose -> xylitol -> D-xylulose -> D-xylulose 5-P (fungal oxidoreductase route) vs. bacterial xylose isomerase
  pathways: [PWY3O-8, PWY3O-5]
