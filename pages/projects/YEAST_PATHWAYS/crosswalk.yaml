  gocam: [YeastPathways_YEAST-RNT-SALV, YeastPathways_YEAST-SALV-PYRMID-DNTP, 69a0c46f00003691]
  rationale: >-
    FUR1 UPRTase, FCY1 cytosine deaminase, CDD1, URK1, URH1 nucleosidase.
    S. cerevisiae lacks thymidine kinase, which is why it cannot salvage
    thymidine -- a defining realisation caveat.

- module: thymidylate_synthesis
  action: FOLD
  pathways: []
  rationale: Grounded via dntp_de_novo_synthesis (CDC21, CDC8, DUT1).

