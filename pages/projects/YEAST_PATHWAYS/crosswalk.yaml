  rationale: >-
    DPH1-DPH2-DPH3(KTI11)-DPH4 radical-SAM ACP transfer, DPH5 methylation,
    DPH7 (RRT2) demethylation, DPH6 amidation. A protein-modification pathway
    rather than small-molecule metabolism, but a clean multi-step module.

