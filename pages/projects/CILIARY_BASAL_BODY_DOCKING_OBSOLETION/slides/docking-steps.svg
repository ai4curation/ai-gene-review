<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- bracket: GO:1905349 spans all -->
  <rect x="30" y="18" width="900" height="34" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="480" y="41" text-anchor="middle" font-size="15" font-weight="600" fill="#0e6b66">GO:1905349 ciliary transition zone assembly covers every step below</text>
  <rect x="30" y="60" width="560" height="28" rx="8" fill="#fbeceb" stroke="#bd3a30" stroke-dasharray="6 4"/>
  <text x="310" y="79" text-anchor="middle" font-size="13" fill="#bd3a30">obsolete GO:0097711 docking described steps 1 to 3 as a single event</text>

  <!-- plasma membrane line across panels 3 -->
  <!-- Panel 1 -->
  <text x="40" y="118" font-size="14" font-weight="600" fill="#15201e">1 · Vesicle capture</text>
  <g transform="translate(150,330)">
    <!-- centriole barrel -->
    <rect x="-28" y="-20" width="56" height="120" rx="6" fill="#e8f1ee" stroke="#56655f" stroke-width="1.6"/>
    <line x1="-18" y1="-14" x2="-18" y2="94" stroke="#8fa39c" stroke-width="3"/>
    <line x1="0" y1="-14" x2="0" y2="94" stroke="#8fa39c" stroke-width="3"/>
    <line x1="18" y1="-14" x2="18" y2="94" stroke="#8fa39c" stroke-width="3"/>
    <!-- distal appendages / transition fibers -->
    <line x1="-28" y1="-16" x2="-62" y2="-44" stroke="#7657a3" stroke-width="3"/>
    <line x1="28" y1="-16" x2="62" y2="-44" stroke="#7657a3" stroke-width="3"/>
    <!-- vesicles -->
    <circle cx="-46" cy="-70" r="16" fill="#ffffff" stroke="#1d68b3" stroke-width="2"/>
    <circle cx="10" cy="-84" r="18" fill="#ffffff" stroke="#1d68b3" stroke-width="2"/>
    <circle cx="58" cy="-66" r="14" fill="#ffffff" stroke="#1d68b3" stroke-width="2"/>
  </g>
  <text x="40" y="470" font-size="12.5" fill="#56655f">Mother centriole's distal appendages</text>
  <text x="40" y="487" font-size="12.5" fill="#56655f">(transition fibers) dock small vesicles.</text>
  <text x="40" y="504" font-size="12.5" fill="#1d68b3">RAB3IP (Rabin8), Rab8 GEF: vesicle delivery</text>

  <path d="M290 300 L340 300" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>

  <!-- Panel 2 -->
  <text x="350" y="118" font-size="14" font-weight="600" fill="#15201e">2 · Ciliary vesicle, TZ starts</text>
  <g transform="translate(470,330)">
    <rect x="-28" y="-20" width="56" height="120" rx="6" fill="#e8f1ee" stroke="#56655f" stroke-width="1.6"/>
    <line x1="-18" y1="-14" x2="-18" y2="94" stroke="#8fa39c" stroke-width="3"/>
    <line x1="0" y1="-14" x2="0" y2="94" stroke="#8fa39c" stroke-width="3"/>
    <line x1="18" y1="-14" x2="18" y2="94" stroke="#8fa39c" stroke-width="3"/>
    <line x1="-28" y1="-16" x2="-62" y2="-40" stroke="#7657a3" stroke-width="3"/>
    <line x1="28" y1="-16" x2="62" y2="-40" stroke="#7657a3" stroke-width="3"/>
    <!-- ciliary vesicle cap -->
    <path d="M-70 -38 C -70 -150, 70 -150, 70 -38 Z" fill="#ffffff" stroke="#1d68b3" stroke-width="2.2"/>
    <!-- TZ + growing axoneme -->
    <rect x="-22" y="-60" width="44" height="40" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
    <line x1="-12" y1="-60" x2="-12" y2="-96" stroke="#0e6b66" stroke-width="3"/>
    <line x1="12" y1="-60" x2="12" y2="-96" stroke="#0e6b66" stroke-width="3"/>
  </g>
  <text x="350" y="470" font-size="12.5" fill="#56655f">Vesicles fuse into one ciliary vesicle;</text>
  <text x="350" y="487" font-size="12.5" fill="#56655f">transition zone and axoneme begin.</text>
  <text x="350" y="504" font-size="12.5" fill="#0e6b66">CEP290: transition zone component</text>

  <path d="M600 300 L650 300" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>

  <!-- Panel 3 -->
  <text x="660" y="118" font-size="14" font-weight="600" fill="#15201e">3 · Membrane docking, fusion</text>
  <!-- plasma membrane -->
  <path d="M660 200 L740 200 C 745 200, 748 196, 748 190 L748 132 L812 132 L812 190 C 812 196, 815 200, 820 200 L930 200" fill="none" stroke="#15201e" stroke-width="3"/>
  <text x="870" y="192" font-size="11.5" fill="#56655f">plasma</text>
  <text x="870" y="220" font-size="11.5" fill="#56655f">membrane</text>
  <g transform="translate(780,330)">
    <rect x="-28" y="-60" width="56" height="120" rx="6" fill="#e8f1ee" stroke="#56655f" stroke-width="1.6"/>
    <line x1="-18" y1="-54" x2="-18" y2="54" stroke="#8fa39c" stroke-width="3"/>
    <line x1="0" y1="-54" x2="0" y2="54" stroke="#8fa39c" stroke-width="3"/>
    <line x1="18" y1="-54" x2="18" y2="54" stroke="#8fa39c" stroke-width="3"/>
    <line x1="-28" y1="-58" x2="-60" y2="-126" stroke="#7657a3" stroke-width="3"/>
    <line x1="28" y1="-58" x2="60" y2="-126" stroke="#7657a3" stroke-width="3"/>
    <rect x="-22" y="-110" width="44" height="50" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/>
    <line x1="-12" y1="-110" x2="-12" y2="-196" stroke="#0e6b66" stroke-width="3"/>
    <line x1="12" y1="-110" x2="12" y2="-196" stroke="#0e6b66" stroke-width="3"/>
  </g>
  <text x="660" y="470" font-size="12.5" fill="#56655f">Basal body docks at the plasma membrane;</text>
  <text x="660" y="487" font-size="12.5" fill="#56655f">ciliary vesicle fuses, cilium emerges</text>
  <text x="660" y="504" font-size="12.5" fill="#56655f">with a finished transition zone.</text>
</svg>
