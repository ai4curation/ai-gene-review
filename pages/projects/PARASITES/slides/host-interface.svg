<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- parasite body -->
  <rect x="16" y="16" width="360" height="488" rx="18" fill="#e8f1ee" stroke="#8fa39c" stroke-width="1.5"/>
  <rect x="352" y="16" width="24" height="488" fill="#dcefec" stroke="#0e6b66" stroke-width="1.5"/>
  <text x="364" y="260" font-size="12" fill="#0e6b66" font-weight="bold" text-anchor="middle" transform="rotate(-90 364 260)">CUTICLE / SURFACE</text>
  <text x="32" y="42" font-size="14" font-weight="bold" fill="#56655f">PARASITE</text>
  <text x="32" y="60" font-size="11" fill="#56655f">B. malayi (filaria) · S. carpocapsae (EPN)</text>

  <!-- host -->
  <rect x="584" y="16" width="360" height="488" rx="18" fill="#fbf3ea" stroke="#8fa39c" stroke-width="1.5"/>
  <text x="600" y="42" font-size="14" font-weight="bold" fill="#56655f">HOST</text>
  <text x="600" y="60" font-size="11" fill="#56655f">human (filaria) · insect haemocoel (EPN)</text>

  <!-- secreted proteins -->
  <g font-size="13">
    <!-- nas-8 -->
    <rect x="40" y="80" width="290" height="54" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/>
    <text x="52" y="102" font-weight="bold" fill="#15201e">nas-8 <tspan font-weight="normal" fill="#56655f" font-size="11.5">S. carpocapsae · astacin protease</tspan></text>
    <text x="52" y="122" font-size="11.5" fill="#15201e">metalloendopeptidase (EXP, IEA both ACCEPT)</text>
    <line x1="330" y1="107" x2="600" y2="107" stroke="#0e6b66" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="604" y="84" width="320" height="46" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="616" y="104" font-size="12" fill="#15201e">degrades insect host proteins</text>
    <text x="616" y="121" font-size="11" fill="#56655f">induced by contact with host tissue</text>

    <!-- cpi-2 -->
    <rect x="40" y="150" width="290" height="54" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/>
    <text x="52" y="172" font-weight="bold" fill="#15201e">cpi-2 <tspan font-weight="normal" fill="#56655f" font-size="11.5">secreted cystatin</tspan></text>
    <text x="52" y="192" font-size="11.5" fill="#15201e">cysteine-type endopeptidase inhibitor</text>
    <line x1="330" y1="177" x2="600" y2="177" stroke="#0e6b66" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="604" y="150" width="320" height="58" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="616" y="170" font-size="12" fill="#15201e">blocks cathepsins L/S/B and legumain (AEP)</text>
    <text x="616" y="186" font-size="11" fill="#56655f">in antigen-presenting cells → less MHC II</text>
    <text x="616" y="201" font-size="11" fill="#56655f">antigen processing</text>

    <!-- far-1 -->
    <rect x="40" y="220" width="290" height="54" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/>
    <text x="52" y="242" font-weight="bold" fill="#15201e">far-1 <tspan font-weight="normal" fill="#56655f" font-size="11.5">Bm20, FAR family</tspan></text>
    <text x="52" y="262" font-size="11.5" fill="#15201e">fatty acid binding, retinol binding (IDA)</text>
    <line x1="600" y1="247" x2="332" y2="247" stroke="#0e6b66" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="604" y="224" width="320" height="46" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="616" y="244" font-size="12" fill="#15201e">scavenges host retinol and fatty acids</text>
    <text x="616" y="261" font-size="11" fill="#56655f">lipids the parasite cannot make</text>

    <!-- gp29 -->
    <rect x="40" y="290" width="290" height="54" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="1.5"/>
    <text x="52" y="312" font-weight="bold" fill="#15201e">gp29 <tspan font-weight="normal" fill="#56655f" font-size="11.5">cuticular surface antigen</tspan></text>
    <text x="52" y="332" font-size="11.5" fill="#15201e">glutathione peroxidase (Cys, not Sec)</text>
    <line x1="600" y1="317" x2="332" y2="317" stroke="#bd3a30" stroke-width="2" marker-end="url(#ag)"/>
    <rect x="604" y="294" width="320" height="46" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="616" y="314" font-size="12" fill="#15201e">oxidants from host immune cells</text>
    <text x="616" y="331" font-size="11" fill="#56655f">lipid hydroperoxides reduced at the cuticle</text>
  </g>

  <!-- internal -->
  <line x1="40" y1="366" x2="330" y2="366" stroke="#8fa39c" stroke-dasharray="4 3"/>
  <text x="40" y="386" font-size="12" font-weight="bold" fill="#56655f">PARASITE'S OWN DEVELOPMENT</text>
  <g font-size="13">
    <rect x="40" y="396" width="290" height="46" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="52" y="416" font-weight="bold" fill="#15201e">dpy-31 <tspan font-weight="normal" fill="#56655f" font-size="11.5">astacin, procollagen C-proteinase</tspan></text>
    <text x="52" y="433" font-size="11.5" fill="#15201e">cuticle collagen processing, molting</text>
    <rect x="40" y="450" width="290" height="46" rx="8" fill="#ffffff" stroke="#8fa39c"/>
    <text x="52" y="470" font-weight="bold" fill="#15201e">mf1 <tspan font-weight="normal" fill="#56655f" font-size="11.5">microfilarial endochitinase</tspan></text>
    <text x="52" y="487" font-size="11.5" fill="#15201e">chitin catabolism; exsheathment in mosquito</text>
  </g>

  <!-- correction callout -->
  <rect x="604" y="380" width="320" height="104" rx="8" fill="#fdf3e7" stroke="#b8620f" stroke-width="1.5"/>
  <text x="616" y="402" font-size="12" font-weight="bold" fill="#b8620f">MODIFY on cpi-2 (IDA, PMID:15664654)</text>
  <text x="616" y="422" font-size="11.5" fill="#15201e">aspartic-type endopeptidase inhibitor</text>
  <text x="616" y="438" font-size="11.5" fill="#15201e">→ cysteine-type endopeptidase inhibitor</text>
  <text x="616" y="458" font-size="11" fill="#56655f">the target, asparaginyl endopeptidase (legumain),</text>
  <text x="616" y="473" font-size="11" fill="#56655f">is a cysteine protease, not an aspartic one</text>
  <path d="M700 380 C 700 330, 560 300, 470 210" fill="none" stroke="#b8620f" stroke-dasharray="3 2"/>
</svg>
