<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="500" fill="#ffffff"/>
  <defs>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d8a4b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bd3a30"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8620f"/>
    </marker>
    <marker id="bar-inhib" viewBox="0 0 10 12" refX="5" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <line x1="5" y1="1" x2="5" y2="11" stroke="#bd3a30" stroke-width="3"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="28" y="34" font-size="20" font-weight="bold" fill="#15201e">Endosomal sorting as a particle-conserving ABM (N = 100 cargo particles)</text>
  <text x="28" y="54" font-size="13" fill="#56655f">Compiled directly from modules/endosomal_trafficking_routing.yaml · uniform base rate r = 0.45 · competing inhibition ×0.25</text>

  <!-- Step 1: Surface Binding -->
  <rect x="28" y="185" width="145" height="72" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
  <text x="100" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#15201e">1. Cargo binding</text>
  <text x="100" y="230" text-anchor="middle" font-size="12" fill="#0e6b66">TFRC (t = 0: 100)</text>
  <text x="100" y="246" text-anchor="middle" font-size="11" fill="#56655f">PTHR10404:SF26</text>

  <line x1="175" y1="221" x2="206" y2="221" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <!-- Step 2: Clathrin / AP-2 -->
  <rect x="210" y="185" width="150" height="72" rx="8" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <text x="285" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#15201e">2. Internalization</text>
  <text x="285" y="230" text-anchor="middle" font-size="12" fill="#0e6b66">CLTC / AP2M1</text>
  <text x="285" y="246" text-anchor="middle" font-size="11" fill="#56655f">clathrin-coated pit</text>

  <line x1="362" y1="221" x2="393" y2="221" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <!-- Step 3: Early Endosome Sorting Hub -->
  <rect x="397" y="175" width="175" height="92" rx="12" fill="#dcefec" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="484" y="203" text-anchor="middle" font-size="15" font-weight="bold" fill="#15201e">3. Early endosome</text>
  <text x="484" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#0e6b66">ATP6V1A (pH ~6.0)</text>
  <text x="484" y="240" text-anchor="middle" font-size="11" fill="#56655f">3-way sorting hub:</text>
  <text x="484" y="256" text-anchor="middle" font-size="11" fill="#56655f">splits flux by active rates</text>

  <!-- Branch A: Recycling (Top) -->
  <path d="M530,175 C565,125 605,112 650,112" fill="none" stroke="#1d8a4b" stroke-width="3" marker-end="url(#arr-green)"/>
  <text x="582" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d8a4b">r = 0.45</text>

  <rect x="656" y="74" width="276" height="76" rx="8" fill="#eef8f2" stroke="#1d8a4b" stroke-width="2"/>
  <text x="794" y="99" text-anchor="middle" font-size="14" font-weight="bold" fill="#15201e">4. EHD1 recycling branch</text>
  <text x="794" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d8a4b">WT: 47%  |  Rab7 loss: 53%</text>
  <text x="794" y="137" text-anchor="middle" font-size="11" fill="#56655f">ERC return to plasma membrane (PMID:15020713)</text>

  <!-- Branch B: Cytosolic Escape (Middle) -->
  <line x1="572" y1="221" x2="650" y2="221" stroke="#b8620f" stroke-width="3" stroke-dasharray="6 3" marker-end="url(#arr-amber)"/>
  <text x="611" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#b8620f">r = 0.45 × 0.25</text>

  <rect x="656" y="183" width="276" height="76" rx="8" fill="#fdf6ee" stroke="#b8620f" stroke-width="2"/>
  <text x="794" y="208" text-anchor="middle" font-size="14" font-weight="bold" fill="#15201e">6. Cytosolic cargo escape</text>
  <text x="794" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#b8620f">WT: 10%  |  Rab7 loss: 47%</text>
  <text x="794" y="246" text-anchor="middle" font-size="11" fill="#56655f">Productive LNP / payload delivery (PMID:41814093)</text>

  <!-- Branch C: ESCRT / Rab7 Late Endosome -> CTSD Lysosome (Bottom) -->
  <path d="M530,267 C555,335 585,355 620,355" fill="none" stroke="#bd3a30" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="548" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#bd3a30">r = 0.45</text>

  <rect x="626" y="317" width="144" height="76" rx="8" fill="#fbeeed" stroke="#bd3a30" stroke-width="2"/>
  <text x="698" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#15201e">5. Late endosome</text>
  <text x="698" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#bd3a30">TSG101 / RAB7A</text>
  <text x="698" y="378" text-anchor="middle" font-size="11" fill="#56655f">CTSD KO traps 43%</text>

  <line x1="772" y1="355" x2="796" y2="355" stroke="#bd3a30" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <rect x="802" y="317" width="130" height="76" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
  <text x="867" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#bd3a30">7. Lysosome</text>
  <text x="867" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#15201e">CTSD: 43% WT</text>
  <text x="867" y="376" text-anchor="middle" font-size="11" fill="#56655f">0% in Rab7 KO</text>

  <!-- Competing inhibition edge from stage 5 to stage 6 -->
  <path d="M698,317 L698,266" fill="none" stroke="#bd3a30" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#bar-inhib)"/>
  <text x="706" y="295" font-size="11" font-weight="bold" fill="#bd3a30">NEGATIVELY_REGULATES (×0.25)</text>

  <!-- Bottom comparison strip -->
  <rect x="28" y="422" width="904" height="58" rx="8" fill="#f4f7f6" stroke="#8fa39c"/>
  <text x="44" y="446" font-size="14" font-weight="bold" fill="#0e6b66">Why Boolean isn't enough:</text>
  <text x="235" y="446" font-size="13" fill="#15201e">A Boolean network sets all reachable branches to 1 and cannot represent conservation (∑ n_i(t) = 100).</text>
  <text x="44" y="467" font-size="13" fill="#56655f">In the ABM, knocking out Rab7 (stage 5) lifts competing sequestration and diverts trapped early-endosomal cargo into escape (10% → 47%).</text>
</svg>
