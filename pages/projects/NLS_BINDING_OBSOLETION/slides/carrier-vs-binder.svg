<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker></defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="18" font-weight="600" fill="#15201e">Carrying an NLS versus holding one</text>
  <!-- nuclear envelope vertical at x=560 with pore -->
  <rect x="540" y="60" width="40" height="150" fill="#e8f1ee" stroke="#8fa39c"/>
  <rect x="540" y="290" width="40" height="200" fill="#e8f1ee" stroke="#8fa39c"/>
  <g stroke="#b8620f" stroke-width="2" fill="none"><path d="M540 214 C 555 230, 525 240, 545 254 S 530 276, 544 286"/><path d="M580 214 C 565 230, 595 240, 575 254 S 590 276, 576 286"/></g>
  <text x="560" y="52" text-anchor="middle" font-size="12" fill="#56655f">nuclear envelope</text>
  <text x="600" y="320" font-size="12" fill="#b8620f">NPC with FG-repeat Nups</text>
  <text x="600" y="336" font-size="11.5" fill="#56655f">(Nup98, Nup153, Nup214, Nup58)</text><path d="M598 316 L582 280" stroke="#b8620f" stroke-width="1.2"/>
  <text x="200" y="80" text-anchor="middle" font-size="14" fill="#56655f">cytoplasm</text>
  <text x="790" y="80" text-anchor="middle" font-size="14" fill="#56655f">nucleus</text>
  <!-- importin complex -->
  <rect x="140" y="200" width="90" height="46" rx="10" fill="#e3edf8" stroke="#1d68b3"/><text x="185" y="228" text-anchor="middle" font-size="13" fill="#15201e">cargo</text>
  <rect x="160" y="190" width="30" height="12" fill="#1d68b3"/><text x="175" y="184" text-anchor="middle" font-size="11" fill="#1d68b3">NLS</text>
  <ellipse cx="260" cy="200" rx="46" ry="26" fill="#dcefec" stroke="#0e6b66" stroke-width="2.4"/><text x="260" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">KPNA</text>
  <ellipse cx="350" cy="200" rx="46" ry="26" fill="#dcefec" stroke="#0e6b66" stroke-width="2.4"/><text x="350" y="205" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">KPNB1</text>
  <path d="M400 214 C 470 230, 500 250, 690 250" stroke="#0e6b66" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <rect x="700" y="228" width="90" height="46" rx="10" fill="#e3edf8" stroke="#1d68b3"/><text x="745" y="256" text-anchor="middle" font-size="13" fill="#15201e">cargo</text>
  <text x="30" y="150" font-size="14" font-weight="600" fill="#0e6b66">Carrier: binds the NLS and moves with the cargo</text>
  <text x="30" y="168" font-size="12.5" fill="#56655f">GO:0140142 fits (importins, transportins, IPO4, yeast Kaps)</text>
  <!-- masking -->
  <text x="30" y="340" font-size="14" font-weight="600" fill="#b8620f">Masking: binds the NLS and keeps the cargo out</text>
  <text x="30" y="358" font-size="12.5" fill="#56655f">IκBα on NF-κB p65; Su(fu) on Ci/Gli; BRAP retention</text>
  <rect x="140" y="400" width="110" height="46" rx="10" fill="#e3edf8" stroke="#1d68b3"/><text x="195" y="428" text-anchor="middle" font-size="13" fill="#15201e">NF-κB p65</text>
  <rect x="160" y="390" width="30" height="12" fill="#1d68b3"/>
  <ellipse cx="200" cy="384" rx="60" ry="18" fill="#fdf0e3" stroke="#b8620f" stroke-width="2.2"/><text x="200" y="389" text-anchor="middle" font-size="13" font-weight="600" fill="#15201e">IκBα</text>
  <path d="M290 424 L500 424" stroke="#bd3a30" stroke-width="3"/><path d="M500 410 L500 438" stroke="#bd3a30" stroke-width="4"/>
  <text x="395" y="414" text-anchor="middle" font-size="12" fill="#bd3a30">no import</text>
  <text x="30" y="480" font-size="12.5" fill="#56655f">Same assay readout (NLS binding), opposite role: GO:0140142 would be wrong here.</text>
</svg>
