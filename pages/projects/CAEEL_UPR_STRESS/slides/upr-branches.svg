<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8620f"/></marker>
  </defs>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">Two unfolded protein responses converge on the nucleus</text>
  <!-- ER -->
  <rect x="24" y="60" width="330" height="250" rx="16" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="40" y="84" font-size="15" font-weight="bold" fill="#0e6b66">ER: three sensors</text>
  <text x="40" y="104" font-size="11" fill="#56655f">unfolded proteins titrate BiP (HSP-4)</text>
  <rect x="40" y="118" width="96" height="56" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="88" y="140" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">IRE-1</text>
  <text x="88" y="156" font-size="10" fill="#15201e" text-anchor="middle">kinase/RNase,</text>
  <text x="88" y="168" font-size="10" fill="#15201e" text-anchor="middle">splices xbp-1 mRNA</text>
  <rect x="146" y="118" width="96" height="56" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="194" y="140" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">PEK-1</text>
  <text x="194" y="156" font-size="10" fill="#15201e" text-anchor="middle">PERK: phosphorylates</text>
  <text x="194" y="168" font-size="10" fill="#15201e" text-anchor="middle">eIF2alpha</text>
  <rect x="252" y="118" width="90" height="56" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="297" y="140" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">ATF-6</text>
  <text x="297" y="156" font-size="10" fill="#15201e" text-anchor="middle">membrane TF,</text>
  <text x="297" y="168" font-size="10" fill="#15201e" text-anchor="middle">cleaved</text>
  <rect x="146" y="196" width="96" height="36" rx="6" fill="#f4f7f6" stroke="#8fa39c" stroke-width="1.5"/>
  <text x="194" y="213" font-size="12" font-weight="bold" fill="#15201e" text-anchor="middle">GCN-2</text>
  <text x="194" y="226" font-size="10" fill="#56655f" text-anchor="middle">amino acid ISR</text>
  <text x="40" y="258" font-size="12" fill="#15201e"><tspan font-weight="bold">ABU-1</tspan>: alternative UPR when IRE-1/XBP-1</text>
  <text x="40" y="274" font-size="12" fill="#15201e">is blocked</text>
  <text x="40" y="296" font-size="11" fill="#bd3a30">IRE-1 unfolded protein binding (IBA): REMOVE</text>
  <!-- Mito -->
  <rect x="24" y="330" width="330" height="170" rx="60" fill="#fdf3e7" stroke="#b8620f" stroke-width="2.5"/>
  <text x="50" y="358" font-size="15" font-weight="bold" fill="#b8620f">Mitochondrion</text>
  <text x="50" y="380" font-size="12" fill="#15201e"><tspan font-weight="bold">CLPP-1</tspan> protease cuts unfolded proteins</text>
  <text x="50" y="398" font-size="12" fill="#15201e"><tspan font-weight="bold">ATFS-1</tspan> import fails under stress</text>
  <text x="50" y="416" font-size="12" fill="#15201e">readouts: <tspan font-weight="bold">HSP-6</tspan> (mtHSP70), <tspan font-weight="bold">HSP-60</tspan></text>
  <text x="50" y="440" font-size="11" fill="#bd3a30">HSP-60 TF binding (IPI): REMOVE; the paper</text>
  <text x="50" y="454" font-size="11" fill="#bd3a30">showed DVE-1 on the hsp-60 promoter</text>
  <!-- nucleus -->
  <rect x="440" y="60" width="496" height="420" rx="40" fill="#dcefec" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="690" y="90" font-size="15" font-weight="bold" fill="#0e6b66" text-anchor="middle">Nucleus</text>
  <rect x="490" y="130" width="120" height="30" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="550" y="150" font-size="12" font-weight="bold" fill="#0e6b66" text-anchor="middle">XBP-1s</text>
  <rect x="620" y="130" width="120" height="30" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="680" y="150" font-size="12" font-weight="bold" fill="#0e6b66" text-anchor="middle">ATF-4</text>
  <rect x="750" y="130" width="120" height="30" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="810" y="150" font-size="12" font-weight="bold" fill="#0e6b66" text-anchor="middle">ATF-6 (N-term)</text>
  <text x="680" y="190" font-size="12" fill="#15201e" text-anchor="middle">ER chaperones, e.g. hsp-4 (BiP)</text>
  <rect x="490" y="260" width="120" height="30" rx="6" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
  <text x="550" y="280" font-size="12" font-weight="bold" fill="#b8620f" text-anchor="middle">ATFS-1</text>
  <rect x="620" y="260" width="140" height="30" rx="6" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
  <text x="690" y="280" font-size="12" font-weight="bold" fill="#b8620f" text-anchor="middle">DVE-1 + UBL-5</text>
  <text x="690" y="312" font-size="12" fill="#15201e" text-anchor="middle">mito chaperones: hsp-6, hsp-60</text>
  <text x="690" y="346" font-size="12" fill="#15201e" text-anchor="middle"><tspan font-weight="bold">MET-2 + LIN-65</tspan>: H3K9me2 heterochromatin</text>
  <text x="690" y="364" font-size="12" fill="#15201e" text-anchor="middle"><tspan font-weight="bold">JMJD-3.1</tspan>: H3K27 demethylase</text>
  <text x="690" y="392" font-size="11" fill="#bd3a30" text-anchor="middle">UBL-5 protein tag activity: REMOVE (no di-Gly)</text>
  <text x="690" y="408" font-size="11" fill="#bd3a30" text-anchor="middle">JMJD-3.1 DNA binding, MET-2 H3K36 methylation: REMOVE</text>
  <text x="690" y="424" font-size="11" fill="#1d68b3" text-anchor="middle">MET-2 H3K9 dimethyltransferase activity: NEW</text>
  <!-- arrows -->
  <path d="M354,146 L484,146" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <text x="400" y="138" font-size="10" fill="#0e6b66" text-anchor="middle">active TFs</text>
  <path d="M290,398 C400,390 440,300 488,280" fill="none" stroke="#b8620f" stroke-width="2.5" marker-end="url(#o)"/>
  <!-- neuron -->
  <text x="370" y="506" font-size="12" fill="#15201e"><tspan font-weight="bold">OCR-2</tspan> (TRPV, sensory neurons): cell-non-autonomous control</text>
</svg>
