<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
  </defs>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">Lysosome-to-nucleus OEA signalling in a worm intestinal cell</text>
  <!-- cell outline -->
  <rect x="20" y="60" width="920" height="370" rx="30" fill="#f4f7f6" stroke="#8fa39c" stroke-width="2"/>
  <!-- lysosome -->
  <circle cx="160" cy="240" r="110" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="160" y="118" font-size="13" fill="#56655f" text-anchor="middle">lysosome (acidic)</text>
  <!-- TAG droplets -->
  <circle cx="110" cy="210" r="16" fill="#f3e3c3" stroke="#b8620f"/>
  <text x="110" y="214" font-size="10" fill="#15201e" text-anchor="middle">TAG</text>
  <rect x="140" y="222" width="80" height="34" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="180" y="244" font-size="14" font-weight="bold" fill="#0e6b66" text-anchor="middle">LIPL-4</text>
  <path d="M126,214 L140,232" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <text x="160" y="282" font-size="11" fill="#15201e" text-anchor="middle">acid lipase</text>
  <text x="160" y="297" font-size="11" fill="#15201e" text-anchor="middle">GO:0004806</text>
  <circle cx="200" cy="318" r="7" fill="#1d68b3"/>
  <text x="212" y="322" font-size="12" fill="#1d68b3">OEA</text>
  <!-- LBP-8 -->
  <path d="M252,240 L372,240" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <rect x="380" y="205" width="150" height="70" rx="35" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="455" y="233" font-size="14" font-weight="bold" fill="#0e6b66" text-anchor="middle">LBP-8</text>
  <text x="455" y="250" font-size="11" fill="#15201e" text-anchor="middle">FABP chaperone</text>
  <circle cx="455" cy="264" r="6" fill="#1d68b3"/>
  <text x="455" y="300" font-size="12" fill="#b8620f" text-anchor="middle">transmembrane transporter</text>
  <text x="455" y="316" font-size="12" fill="#b8620f" text-anchor="middle">→ lipid transfer activity</text>
  <text x="455" y="332" font-size="11" fill="#56655f" text-anchor="middle">(MODIFY)</text>
  <path d="M530,240 L618,240" stroke="#0e6b66" stroke-width="3" marker-end="url(#a)"/>
  <!-- nucleus -->
  <ellipse cx="770" cy="245" rx="150" ry="150" fill="#dcefec" stroke="#0e6b66" stroke-width="2.5"/>
  <text x="770" y="118" font-size="13" fill="#56655f" text-anchor="middle">nucleus</text>
  <rect x="660" y="165" width="100" height="44" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="710" y="185" font-size="14" font-weight="bold" fill="#0e6b66" text-anchor="middle">NHR-80</text>
  <text x="710" y="200" font-size="10" fill="#15201e" text-anchor="middle">binds OEA</text>
  <circle cx="668" cy="170" r="6" fill="#1d68b3"/>
  <rect x="770" y="165" width="100" height="44" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="820" y="185" font-size="14" font-weight="bold" fill="#0e6b66" text-anchor="middle">NHR-49</text>
  <text x="820" y="200" font-size="10" fill="#15201e" text-anchor="middle">partner</text>
  <line x1="660" y1="232" x2="880" y2="232" stroke="#56655f" stroke-width="4"/>
  <text x="770" y="226" font-size="11" fill="#56655f" text-anchor="middle">DNA</text>
  <path d="M770,238 L770,262" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <text x="770" y="282" font-size="13" fill="#15201e" text-anchor="middle">fat-5, fat-6, fat-7 (desaturases)</text>
  <text x="770" y="300" font-size="13" fill="#15201e" text-anchor="middle">acs-2 (beta-oxidation)</text>
  <text x="770" y="326" font-size="11" fill="#56655f" text-anchor="middle">targets not yet reviewed</text>
  <!-- legend for corrections -->
  <text x="40" y="462" font-size="13" fill="#15201e"><tspan font-weight="bold" fill="#b8620f">NHR-80</tspan>: DNA-binding TF activity (IEA) → ligand-modulated TF activity, GO:0098531 (MODIFY; NEW by IDA)</text>
  <text x="40" y="486" font-size="13" fill="#15201e"><tspan font-weight="bold" fill="#b8620f">NHR-49</tspan>: four protein binding (IPI) rows → DNA-binding transcription factor binding (MODIFY)</text>
  <text x="40" y="508" font-size="11" fill="#56655f">After Folick et al. 2015 (PMID:25554789). Blue dots: OEA.</text>
</svg>
