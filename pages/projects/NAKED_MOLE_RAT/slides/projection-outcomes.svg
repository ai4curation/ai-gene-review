<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#15201e">One projection, three possible outcomes (180 rows, 8 genes)</text>
<!-- sources -->
<rect x="30" y="80" width="220" height="150" rx="10" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="140" y="108" font-size="17" font-weight="bold" fill="#15201e" text-anchor="middle">Annotated donors</text>
<text x="140" y="136" font-size="15" fill="#56655f" text-anchor="middle">mouse / human / rat IDA, IMP</text>
<text x="140" y="160" font-size="15" fill="#56655f" text-anchor="middle">PANTHER node (PTN)</text>
<text x="140" y="184" font-size="15" fill="#56655f" text-anchor="middle">ARBA / InterPro rules</text>
<text x="140" y="212" font-size="13" fill="#56655f" text-anchor="middle">IEA / ISS, GO_REF:0000118 etc.</text>
<line x1="250" y1="155" x2="330" y2="155" stroke="#0e6b66" stroke-width="3"/>
<polygon points="330,147 346,155 330,163" fill="#0e6b66"/>
<rect x="350" y="95" width="200" height="120" rx="10" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="450" y="130" font-size="17" font-weight="bold" fill="#0e6b66" text-anchor="middle">Naked mole rat</text>
<text x="450" y="152" font-size="17" font-weight="bold" fill="#0e6b66" text-anchor="middle">protein</text>
<text x="450" y="180" font-size="14" fill="#15201e" text-anchor="middle">hypothesis: "does what</text>
<text x="450" y="198" font-size="14" fill="#15201e" text-anchor="middle">the ortholog does"</text>
<text x="450" y="245" font-size="14" fill="#56655f" text-anchor="middle">tested against 37 HETGA papers</text>
<!-- branches -->
<path d="M550 130 C 620 130, 620 100, 680 100" stroke="#1d8a4b" stroke-width="3" fill="none"/>
<path d="M550 155 C 620 155, 620 235, 680 235" stroke="#7657a3" stroke-width="3" fill="none"/>
<path d="M550 180 C 620 180, 620 370, 680 370" stroke="#bd3a30" stroke-width="3" fill="none"/>
<rect x="680" y="60" width="255" height="85" rx="8" fill="#ffffff" stroke="#1d8a4b" stroke-width="2"/>
<text x="695" y="86" font-size="16" font-weight="bold" fill="#1d8a4b">1. Holds, confirmed</text>
<text x="695" y="108" font-size="13" fill="#15201e">core molecular function kept</text>
<text x="695" y="128" font-size="13" fill="#15201e">ACCEPT 58</text>
<rect x="680" y="180" width="255" height="110" rx="8" fill="#ffffff" stroke="#7657a3" stroke-width="2"/>
<text x="695" y="206" font-size="16" font-weight="bold" fill="#7657a3">2. Holds, but peripheral</text>
<text x="695" y="228" font-size="13" fill="#15201e">developmental / organ terms</text>
<text x="695" y="246" font-size="13" fill="#15201e">from mouse KO or rat tissue</text>
<text x="695" y="270" font-size="13" fill="#15201e">non-core 57 · over-annotated 27</text>
<rect x="680" y="320" width="255" height="110" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
<text x="695" y="346" font-size="16" font-weight="bold" fill="#bd3a30">3. Protein differs</text>
<text x="695" y="368" font-size="13" fill="#15201e">quantitative: refine (MODIFY 22)</text>
<text x="695" y="388" font-size="13" fill="#15201e">reversed / refuted: REMOVE 4</text>
<text x="695" y="412" font-size="13" fill="#15201e">new species biology: NEW 11</text>
<!-- bar -->
<text x="30" y="300" font-size="16" font-weight="bold" fill="#15201e">Actions across 180 rows</text>
<g font-size="13" fill="#15201e">
<text x="30" y="332">ACCEPT</text><rect x="190" y="320" width="348" height="16" fill="#1d8a4b"/><text x="544" y="333">58</text>
<text x="30" y="358">KEEP_AS_NON_CORE</text><rect x="190" y="346" width="342" height="16" fill="#8fa39c"/><text x="538" y="359">57</text>
<text x="30" y="384">OVER_ANNOTATED</text><rect x="190" y="372" width="162" height="16" fill="#7657a3"/><text x="358" y="385">27</text>
<text x="30" y="410">MODIFY</text><rect x="190" y="398" width="132" height="16" fill="#b8620f"/><text x="328" y="411">22</text>
<text x="30" y="436">NEW</text><rect x="190" y="424" width="66" height="16" fill="#1d68b3"/><text x="262" y="437">11</text>
<text x="30" y="462">REMOVE</text><rect x="190" y="450" width="24" height="16" fill="#bd3a30"/><text x="220" y="463">4</text>
<text x="30" y="488">UNDECIDED</text><rect x="190" y="476" width="6" height="16" fill="#56655f"/><text x="202" y="489">1</text>
</g>
</svg>
