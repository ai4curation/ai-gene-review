<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="40" font-size="22" font-weight="bold" fill="#15201e">Two ways a propagation fails in this species</text>
<!-- left: cGAS -->
<text x="30" y="80" font-size="18" font-weight="bold" fill="#0e6b66">Cgas: the function flips sign</text>
<rect x="30" y="100" width="430" height="60" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="245" y="125" font-size="14" fill="#15201e" text-anchor="middle">PTN002579681, Euteleostomi cGAS node</text>
<text x="245" y="146" font-size="13" fill="#56655f" text-anchor="middle">seeds: human CGAS, mouse Cgas</text>
<line x1="140" y1="160" x2="140" y2="200" stroke="#8fa39c" stroke-width="2"/>
<line x1="350" y1="160" x2="350" y2="200" stroke="#8fa39c" stroke-width="2"/>
<rect x="30" y="200" width="220" height="150" rx="8" fill="#ffffff" stroke="#8fa39c"/>
<text x="140" y="225" font-size="14" font-weight="bold" fill="#15201e" text-anchor="middle">human / mouse cGAS</text>
<text x="140" y="260" font-size="13" fill="#15201e" text-anchor="middle">nuclear cGAS</text>
<line x1="95" y1="285" x2="175" y2="285" stroke="#bd3a30" stroke-width="3"/>
<line x1="175" y1="275" x2="175" y2="295" stroke="#bd3a30" stroke-width="3"/>
<text x="140" y="320" font-size="13" fill="#15201e" text-anchor="middle">homologous recombination</text>
<text x="140" y="340" font-size="12" fill="#bd3a30" text-anchor="middle">suppresses</text>
<rect x="260" y="200" width="200" height="150" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="360" y="225" font-size="14" font-weight="bold" fill="#0e6b66" text-anchor="middle">naked mole rat cGAS</text>
<text x="360" y="248" font-size="12" fill="#15201e" text-anchor="middle">4 fixed amino acids</text>
<text x="360" y="266" font-size="12" fill="#15201e" text-anchor="middle">longer chromatin retention</text>
<text x="360" y="284" font-size="12" fill="#15201e" text-anchor="middle">FANCI–RAD50 → RAD50 recruited</text>
<line x1="300" y1="300" x2="410" y2="300" stroke="#1d8a4b" stroke-width="3"/>
<polygon points="410,293 424,300 410,307" fill="#1d8a4b"/>
<text x="360" y="325" font-size="13" fill="#15201e" text-anchor="middle">homologous recombination</text>
<text x="360" y="342" font-size="12" fill="#1d8a4b" text-anchor="middle">promotes</text>
<rect x="30" y="370" width="430" height="110" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
<text x="45" y="395" font-size="13" font-weight="bold" fill="#bd3a30">REMOVE GO:2000042</text>
<text x="45" y="415" font-size="13" fill="#15201e">negative regulation of double-strand break</text>
<text x="45" y="433" font-size="13" fill="#15201e">repair via homologous recombination (IEA)</text>
<text x="45" y="458" font-size="12" fill="#56655f">The node is sound for its seeds; the naked mole rat</text>
<text x="45" y="474" font-size="12" fill="#56655f">sits inside the clade and diverged.</text>
<!-- right: Hyal2 -->
<text x="510" y="80" font-size="18" font-weight="bold" fill="#0e6b66">Hyal2: positive rule, negated donor</text>
<rect x="510" y="100" width="420" height="120" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
<text x="525" y="125" font-size="14" font-weight="bold" fill="#15201e">GO_REF:0000120 rule donor set</text>
<text x="525" y="150" font-size="13" fill="#15201e">includes mouse Hyal2</text>
<rect x="525" y="162" width="390" height="44" rx="6" fill="#ffffff" stroke="#bd3a30"/>
<text x="540" y="182" font-size="13" fill="#bd3a30">curated on mouse Hyal2:</text>
<text x="540" y="199" font-size="13" fill="#bd3a30">NOT | enables GO:0001618 (IDA)</text>
<line x1="720" y1="220" x2="720" y2="262" stroke="#0e6b66" stroke-width="3"/>
<polygon points="712,262 720,276 728,262" fill="#0e6b66"/>
<rect x="510" y="280" width="420" height="70" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="525" y="305" font-size="13" fill="#15201e">propagated to naked mole rat Hyal2:</text>
<text x="525" y="328" font-size="14" font-weight="bold" fill="#15201e">enables GO:0001618 virus receptor activity</text>
<rect x="510" y="370" width="420" height="110" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
<text x="525" y="395" font-size="13" font-weight="bold" fill="#bd3a30">REMOVE GO:0001618 and its dependent</text>
<text x="525" y="415" font-size="13" fill="#15201e">GO:0046718 symbiont entry into host cell</text>
<text x="525" y="445" font-size="12" fill="#56655f">A positive assertion propagated out of a donor set</text>
<text x="525" y="461" font-size="12" fill="#56655f">holding an explicit negation for the same term.</text>
</svg>
