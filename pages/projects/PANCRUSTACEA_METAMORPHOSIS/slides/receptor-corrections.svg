<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="38" font-size="21" font-weight="bold" fill="#15201e">Propagated receptor terms, corrected to what the protein does</text>
<text x="40" y="72" font-size="14" fill="#56655f">Propagated (IBA / IEA)</text>
<text x="600" y="72" font-size="14" fill="#56655f">Reviewed</text>
<g font-size="14">
<!-- trn -->
<rect x="30" y="90" width="400" height="80" rx="8" fill="#ffffff" stroke="#8fa39c"/>
<text x="45" y="115" font-weight="bold" fill="#15201e">tartan (trn), LRR transmembrane</text>
<text x="45" y="140" fill="#15201e">GO:0038023 signaling receptor activity</text>
<text x="45" y="158" font-size="12" fill="#56655f">IBA, from a TLR-containing family</text>
<!-- klg -->
<rect x="30" y="190" width="400" height="80" rx="8" fill="#ffffff" stroke="#8fa39c"/>
<text x="45" y="215" font-weight="bold" fill="#15201e">klingon (klg), GPI-anchored IgSF</text>
<text x="45" y="240" fill="#15201e">GO:0008046 axon guidance receptor activity</text>
<text x="45" y="258" font-size="12" fill="#56655f">IBA; a GPI anchor cannot transduce a signal</text>
<!-- kni -->
<rect x="30" y="300" width="400" height="190" rx="8" fill="#ffffff" stroke="#8fa39c"/>
<text x="45" y="325" font-weight="bold" fill="#15201e">knirps (kni), orphan NR, no ligand-binding domain</text>
<text x="45" y="352" fill="#15201e">GO:0004879 nuclear receptor activity</text>
<text x="45" y="392" fill="#15201e">GO:0034056 estrogen response element binding</text>
<text x="45" y="432" fill="#15201e">GO:0030522 intracellular receptor signaling</text>
<text x="45" y="450" fill="#15201e">pathway (IEA)</text>
<!-- arrows -->
<g stroke="#b8620f" stroke-width="3"><line x1="435" y1="135" x2="575" y2="175"/><line x1="435" y1="235" x2="575" y2="185"/><line x1="435" y1="348" x2="575" y2="348"/><line x1="435" y1="388" x2="575" y2="408"/></g>
<g fill="#b8620f"><polygon points="573,168 588,178 571,182"/><polygon points="571,178 588,182 575,192"/><polygon points="575,341 590,348 575,355"/><polygon points="573,401 589,410 571,415"/></g>
<line x1="435" y1="440" x2="575" y2="462" stroke="#bd3a30" stroke-width="3" stroke-dasharray="6 4"/>
<rect x="595" y="140" width="340" height="75" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="610" y="165" font-size="12" font-weight="bold" fill="#b8620f">MODIFY (both)</text>
<text x="610" y="188" fill="#15201e">GO:0098632 cell-cell adhesion</text>
<text x="610" y="205" fill="#15201e">mediator activity</text>
<rect x="595" y="315" width="340" height="60" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="610" y="335" font-size="12" font-weight="bold" fill="#b8620f">MODIFY</text>
<text x="610" y="358" fill="#15201e">GO:0001227 DNA-binding repressor, Pol II</text>
<rect x="595" y="385" width="340" height="55" rx="8" fill="#dcefec" stroke="#0e6b66" stroke-width="2"/>
<text x="610" y="405" font-size="12" font-weight="bold" fill="#b8620f">MODIFY</text>
<text x="610" y="428" fill="#15201e">GO:0000978 Pol II cis-regulatory DNA binding</text>
<rect x="595" y="448" width="340" height="42" rx="8" fill="#ffffff" stroke="#bd3a30" stroke-width="2"/>
<text x="610" y="475" font-weight="bold" fill="#bd3a30">REMOVE (ligand-independent)</text>
