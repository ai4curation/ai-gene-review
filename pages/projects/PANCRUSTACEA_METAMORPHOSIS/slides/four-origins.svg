<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
<rect width="960" height="520" fill="#ffffff"/>
<text x="30" y="38" font-size="21" font-weight="bold" fill="#15201e">Four independent origins of metamorphosis (schematic, not to scale)</text>
<g stroke="#8fa39c" stroke-width="3" fill="none">
<!-- root -->
<path d="M40 280 H110"/>
<path d="M110 100 V460"/>
<!-- four pairs -->
<path d="M110 100 H230"/><path d="M110 210 H230"/><path d="M110 340 H230"/><path d="M110 460 H230"/>
<path d="M230 75 V125"/><path d="M230 185 V235"/><path d="M230 315 V365"/><path d="M230 435 V485"/>
<path d="M230 125 H420"/><path d="M230 235 H420"/><path d="M230 365 H420"/><path d="M230 485 H420"/>
</g>
<g stroke="#0e6b66" stroke-width="5" fill="none">
<path d="M230 75 H420"/><path d="M230 185 H420"/><path d="M230 315 H420"/><path d="M230 435 H420"/>
</g>
<g fill="#b8620f"><circle cx="300" cy="75" r="9"/><circle cx="300" cy="185" r="9"/><circle cx="300" cy="315" r="9"/><circle cx="300" cy="435" r="9"/></g>
<text x="104" y="256" font-size="12" fill="#56655f" text-anchor="end">Pancrustacea</text>
<text x="104" y="272" font-size="12" fill="#56655f" text-anchor="end">~500 My</text>
<g font-size="15">
<text x="430" y="80" fill="#0e6b66" font-weight="bold">Insecta</text><text x="540" y="80" fill="#56655f">mayflies to flies</text>
<text x="430" y="130" fill="#15201e">non-insect Hexapoda</text><text x="600" y="130" fill="#56655f">springtails</text>
<text x="430" y="190" fill="#0e6b66" font-weight="bold">Eucarida</text><text x="540" y="190" fill="#56655f">crabs, shrimp, lobster, krill</text>
<text x="430" y="240" fill="#15201e">Peracarida</text><text x="600" y="240" fill="#56655f">isopods, amphipods</text>
<text x="430" y="320" fill="#0e6b66" font-weight="bold">Copepoda</text><text x="540" y="320" fill="#56655f">Calanoida, Harpacticoida</text>
<text x="430" y="370" fill="#15201e">Branchiopoda</text><text x="600" y="370" fill="#56655f">fairy shrimp, water fleas</text>
<text x="430" y="440" fill="#0e6b66" font-weight="bold">Thecostraca</text><text x="540" y="440" fill="#56655f">barnacles</text>
<text x="430" y="490" fill="#15201e">Podocopida</text><text x="600" y="490" fill="#56655f">ostracods</text>
</g>
<rect x="770" y="70" width="170" height="300" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
<circle cx="790" cy="96" r="8" fill="#b8620f"/><text x="805" y="101" font-size="13" fill="#15201e">Metamorphosis LCA</text>
<line x1="782" y1="126" x2="802" y2="126" stroke="#0e6b66" stroke-width="5"/><text x="810" y="131" font-size="13" fill="#15201e">metamorphic</text>
<line x1="782" y1="152" x2="802" y2="152" stroke="#8fa39c" stroke-width="3"/><text x="810" y="157" font-size="13" fill="#15201e">sister (direct)</text>
<text x="785" y="195" font-size="13" font-weight="bold" fill="#0e6b66">At the four LCAs</text>
<text x="785" y="217" font-size="12" fill="#15201e">births 3,722 OGs</text>
<text x="785" y="235" font-size="12" fill="#56655f">(sisters 1,112)</text>
<text x="785" y="258" font-size="12" fill="#15201e">expansions 2,078</text>
<text x="785" y="276" font-size="12" fill="#56655f">(sisters 843)</text>
<text x="785" y="302" font-size="12" fill="#15201e">60 of 100 GO terms</text>
<text x="785" y="320" font-size="12" fill="#15201e">shared by all four,</text>
<text x="785" y="338" font-size="12" fill="#15201e">mostly distinct genes</text>
<text x="770" y="400" font-size="12" fill="#56655f">Source: Campli et al. 2026,</text>
<text x="770" y="416" font-size="12" fill="#56655f">bioRxiv preprint (CC-BY 4.0)</text>
</svg>
