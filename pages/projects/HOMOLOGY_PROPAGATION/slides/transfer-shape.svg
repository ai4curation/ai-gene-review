<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text x="270" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#15201e">Donor</text>
  <text x="530" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#15201e">Intermediate</text>
  <text x="800" y="44" text-anchor="middle" font-size="22" font-weight="bold" fill="#15201e">Target</text>

  <!-- row labels -->
  <g font-size="20" font-weight="bold" fill="#0e6b66">
    <text x="24" y="118">ISO / ISS</text>
    <text x="24" y="238">IBA (PAINT)</text>
    <text x="24" y="358">Compara (IEA)</text>
  </g>
  <g font-size="14" fill="#56655f">
    <text x="24" y="140">ortholog transfer</text>
    <text x="24" y="260">phylogenetic node</text>
    <text x="24" y="380">electronic ortholog</text>
  </g>

  <!-- ISO row -->
  <rect x="170" y="80" width="200" height="76" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="270" y="112" text-anchor="middle" font-size="16" fill="#15201e">gene in WITH/FROM</text>
  <text x="270" y="134" text-anchor="middle" font-size="14" fill="#56655f">experimental annotation</text>
  <rect x="430" y="80" width="200" height="76" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="530" y="112" text-anchor="middle" font-size="16" fill="#15201e">orthology call</text>
  <text x="530" y="134" text-anchor="middle" font-size="14" fill="#56655f">Alliance, HCOP, curator</text>
  <rect x="700" y="80" width="200" height="76" rx="8" fill="#ffffff" stroke="#15201e" stroke-width="1.5"/>
  <text x="800" y="112" text-anchor="middle" font-size="16" fill="#15201e">annotated gene</text>
  <text x="800" y="134" text-anchor="middle" font-size="14" fill="#56655f">e.g. mouse, rat</text>
  <line x1="372" y1="118" x2="426" y2="118" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="632" y1="118" x2="696" y2="118" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- IBA row -->
  <rect x="170" y="200" width="200" height="76" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="270" y="232" text-anchor="middle" font-size="16" fill="#15201e">PAINT seed genes</text>
  <text x="270" y="254" text-anchor="middle" font-size="14" fill="#56655f">experimental annotations</text>
  <rect x="430" y="200" width="200" height="76" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="530" y="232" text-anchor="middle" font-size="16" fill="#15201e">PANTHER node (PTN…)</text>
  <text x="530" y="254" text-anchor="middle" font-size="14" fill="#56655f">placed by a curator</text>
  <rect x="700" y="196" width="200" height="22" rx="5" fill="#ffffff" stroke="#8fa39c"/>
  <rect x="700" y="227" width="200" height="22" rx="5" fill="#ffffff" stroke="#8fa39c"/>
  <rect x="700" y="258" width="200" height="22" rx="5" fill="#ffffff" stroke="#15201e" stroke-width="1.5"/>
  <text x="800" y="212" text-anchor="middle" font-size="13" fill="#56655f">descendant</text>
  <text x="800" y="243" text-anchor="middle" font-size="13" fill="#56655f">descendant</text>
  <text x="800" y="274" text-anchor="middle" font-size="13" fill="#15201e">every descendant</text>
  <line x1="372" y1="238" x2="426" y2="238" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="632" y1="238" x2="696" y2="207" stroke="#0e6b66" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="632" y1="238" x2="696" y2="238" stroke="#0e6b66" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="632" y1="238" x2="696" y2="269" stroke="#0e6b66" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Compara row -->
  <rect x="170" y="320" width="200" height="76" rx="8" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="270" y="352" text-anchor="middle" font-size="16" fill="#15201e">ortholog</text>
  <text x="270" y="374" text-anchor="middle" font-size="14" fill="#56655f">experimental annotation</text>
  <rect x="430" y="320" width="200" height="76" rx="8" fill="#dcefec" stroke="#0e6b66"/>
  <text x="530" y="352" text-anchor="middle" font-size="16" fill="#15201e">Compara relation</text>
  <text x="530" y="374" text-anchor="middle" font-size="14" fill="#56655f">≥40% identity, no curator</text>
  <rect x="700" y="320" width="200" height="76" rx="8" fill="#ffffff" stroke="#15201e" stroke-width="1.5"/>
  <text x="800" y="352" text-anchor="middle" font-size="16" fill="#15201e">annotated gene</text>
  <text x="800" y="374" text-anchor="middle" font-size="14" fill="#56655f">IEA, GO_REF:0000107</text>
  <line x1="372" y1="358" x2="426" y2="358" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="632" y1="358" x2="696" y2="358" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- three questions -->
  <line x1="170" y1="420" x2="900" y2="420" stroke="#8fa39c" stroke-dasharray="4 4"/>
  <g font-size="15">
    <circle cx="190" cy="456" r="13" fill="#bd3a30"/>
    <text x="190" y="461" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
    <text x="212" y="452" fill="#15201e" font-weight="bold">Is the donor sound?</text>
    <text x="212" y="474" fill="#56655f">still carried, experimental,</text>
    <text x="212" y="494" fill="#56655f">about that gene</text>

    <circle cx="450" cy="456" r="13" fill="#bd3a30"/>
    <text x="450" y="461" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
    <text x="472" y="452" fill="#15201e" font-weight="bold">Is the relation right?</text>
    <text x="472" y="474" fill="#56655f">1:1 ortholog, paralog,</text>
    <text x="472" y="494" fill="#56655f">or the wrong node</text>

    <circle cx="720" cy="456" r="13" fill="#bd3a30"/>
    <text x="720" y="461" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
    <text x="742" y="452" fill="#15201e" font-weight="bold">Is the term safe to move?</text>
    <text x="742" y="474" fill="#56655f">activity vs tissue, lineage,</text>
    <text x="742" y="494" fill="#56655f">compartment context</text>
  </g>
</svg>
