<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#15201e"/></marker>
    <marker id="arM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b8620f"/></marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d68b3"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="19" font-weight="bold" fill="#15201e">Where the 10 planned genes sit in yeast fermentation</text>
  <text x="24" y="54" font-size="13" fill="#56655f">Main flux left to right; glycerol and the pentose phosphate pathway branch off. Enzyme names in boxes; none reviewed yet.</text>

  <!-- main line metabolites -->
  <g font-size="14" fill="#15201e" text-anchor="middle" font-weight="bold">
    <text x="60" y="186">glucose</text>
    <text x="210" y="186">G6P</text>
    <text x="360" y="186">F1,6BP</text>
    <text x="510" y="186">GAP</text>
    <text x="660" y="186">pyruvate</text>
    <text x="790" y="186">acetaldehyde</text>
    <text x="905" y="186">ethanol</text>
  </g>
  <g stroke="#15201e" stroke-width="2.2" marker-end="url(#ar)">
    <line x1="92" y1="181" x2="186" y2="181"/>
    <line x1="232" y1="181" x2="322" y2="181"/>
    <line x1="398" y1="181" x2="486" y2="181"/>
    <line x1="534" y1="181" x2="622" y2="181"/>
    <line x1="698" y1="181" x2="740" y2="181"/>
    <line x1="840" y1="181" x2="872" y2="181"/>
  </g>
  <!-- enzyme boxes on main line -->
  <g font-size="13" text-anchor="middle">
    <rect x="104" y="120" width="70" height="30" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="139" y="140" fill="#0e6b66" font-weight="bold">HXK1</text>
    <rect x="242" y="120" width="70" height="30" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="277" y="140" fill="#0e6b66" font-weight="bold">PFK1</text>
    <rect x="408" y="120" width="70" height="30" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="443" y="140" fill="#56655f">aldolase</text>
    <rect x="552" y="120" width="70" height="30" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="587" y="140" fill="#0e6b66" font-weight="bold">TDH1</text>
    <rect x="684" y="120" width="70" height="30" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="719" y="140" fill="#0e6b66" font-weight="bold">PDC1</text>
    <rect x="822" y="120" width="70" height="30" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="857" y="140" fill="#0e6b66" font-weight="bold">ADH1</text>
  </g>
  <text x="587" y="210" font-size="12" text-anchor="middle" fill="#1d68b3">NAD+ → NADH</text>
  <text x="857" y="210" font-size="12" text-anchor="middle" fill="#1d68b3">NADH → NAD+</text>
  <text x="587" y="226" font-size="11" text-anchor="middle" fill="#56655f">(via 1,3-BPG … PEP)</text>

  <!-- ADH2 reverse -->
  <path d="M 905 200 C 905 250, 800 250, 790 204" fill="none" stroke="#b8620f" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arM)"/>
  <rect x="820" y="248" width="70" height="30" rx="6" fill="#fdf0e2" stroke="#b8620f"/>
  <text x="855" y="268" font-size="13" text-anchor="middle" fill="#b8620f" font-weight="bold">ADH2</text>
  <text x="855" y="294" font-size="11" text-anchor="middle" fill="#56655f">ethanol use after</text>
  <text x="855" y="308" font-size="11" text-anchor="middle" fill="#56655f">glucose runs out</text>

  <!-- glycerol branch from DHAP -->
  <text x="430" y="300" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">DHAP</text>
  <line x1="400" y1="192" x2="425" y2="282" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="430" y1="310" x2="430" y2="384" stroke="#bd3a30" stroke-width="2.2" marker-end="url(#ar)"/>
  <rect x="448" y="330" width="100" height="30" rx="6" fill="#fbe9e7" stroke="#bd3a30"/>
  <text x="498" y="350" font-size="13" text-anchor="middle" fill="#bd3a30" font-weight="bold">GPD1 · GPD2</text>
  <text x="430" y="404" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">glycerol-3-P → glycerol</text>
  <text x="430" y="424" font-size="12" text-anchor="middle" fill="#1d68b3">NADH → NAD+ (redox sink)</text>
  <text x="430" y="442" font-size="12" text-anchor="middle" fill="#bd3a30">byproduct engineers try to reduce</text>

  <!-- PPP branch -->
  <line x1="210" y1="194" x2="210" y2="282" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="100" y="222" width="90" height="30" rx="6" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="145" y="242" font-size="13" text-anchor="middle" fill="#0e6b66" font-weight="bold">ZWF1</text>
  <text x="210" y="304" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">pentose phosphate</text>
  <text x="210" y="322" font-size="12" text-anchor="middle" fill="#1d68b3">NADP+ → NADPH</text>

  <!-- PYC1 branch -->
  <line x1="660" y1="194" x2="660" y2="282" stroke="#15201e" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="672" y="222" width="70" height="30" rx="6" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="707" y="242" font-size="13" text-anchor="middle" fill="#0e6b66" font-weight="bold">PYC1</text>
  <text x="660" y="304" font-size="14" text-anchor="middle" font-weight="bold" fill="#15201e">oxaloacetate</text>
  <text x="660" y="322" font-size="12" text-anchor="middle" fill="#56655f">anaplerosis</text>

  <!-- legend -->
  <rect x="24" y="474" width="14" height="14" rx="3" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="44" y="486" font-size="12" fill="#15201e">planned gene, not reviewed</text>
  <rect x="230" y="474" width="14" height="14" rx="3" fill="#fbe9e7" stroke="#bd3a30"/>
  <text x="250" y="486" font-size="12" fill="#15201e">byproduct-suppression target</text>
  <text x="470" y="486" font-size="12" fill="#1d68b3">blue: cofactor turnover</text>
  <text x="650" y="486" font-size="12" fill="#56655f">grey label: step not on the gene list</text>
</svg>
