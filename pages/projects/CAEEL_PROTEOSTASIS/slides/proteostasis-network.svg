<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0e6b66"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#56655f"/></marker>
  </defs>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#15201e">Fates of a misfolded protein, and the 18 reviewed genes</text>
  <!-- regulators band -->
  <rect x="24" y="52" width="912" height="96" rx="10" fill="#f4f7f6" stroke="#8fa39c"/>
  <text x="40" y="74" font-size="13" font-weight="bold" fill="#56655f">Transcriptional control (tier 3 + HSF-1)</text>
  <rect x="40" y="86" width="96" height="44" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="88" y="106" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">DAF-2</text>
  <text x="88" y="121" font-size="10" fill="#56655f" text-anchor="middle">insulin receptor</text>
  <line x1="136" y1="108" x2="170" y2="108" stroke="#bd3a30" stroke-width="2.5"/>
  <line x1="170" y1="98" x2="170" y2="118" stroke="#bd3a30" stroke-width="2.5"/>
  <rect x="176" y="86" width="96" height="44" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="224" y="106" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">DAF-16</text>
  <text x="224" y="121" font-size="10" fill="#56655f" text-anchor="middle">FOXO</text>
  <rect x="292" y="86" width="96" height="44" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="340" y="106" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">HSF-1</text>
  <text x="340" y="121" font-size="10" fill="#56655f" text-anchor="middle">heat shock TF</text>
  <rect x="408" y="86" width="96" height="44" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="456" y="106" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">SKN-1</text>
  <text x="456" y="121" font-size="10" fill="#56655f" text-anchor="middle">Nrf, oxidative stress</text>
  <rect x="524" y="86" width="96" height="44" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="572" y="106" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">HLH-30</text>
  <text x="572" y="121" font-size="10" fill="#56655f" text-anchor="middle">TFEB, autophagy</text>
  <rect x="640" y="86" width="130" height="44" rx="6" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="705" y="106" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">AAK-2, SIR-2.1</text>
  <text x="705" y="121" font-size="10" fill="#56655f" text-anchor="middle">AMPK, sirtuin</text>
  <text x="790" y="104" font-size="11" fill="#56655f">energy and</text>
  <text x="790" y="118" font-size="11" fill="#56655f">nutrient sensing</text>
  <path d="M340,130 L340,196" stroke="#56655f" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#m)"/>
  <path d="M600,130 C820,160 830,250 820,336" fill="none" stroke="#56655f" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#m)"/>
  <!-- central misfolded protein -->
  <path d="M430,300 q15,-30 30,-5 t30,5 t25,-15 t20,20" fill="none" stroke="#bd3a30" stroke-width="4"/>
  <text x="470" y="330" font-size="13" font-weight="bold" fill="#bd3a30" text-anchor="middle">misfolded protein</text>
  <!-- fold -->
  <rect x="200" y="200" width="250" height="70" rx="10" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <text x="325" y="220" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">Refold (foldases, ATP)</text>
  <text x="325" y="238" font-size="12" fill="#15201e" text-anchor="middle">HSP-1 (HSP70), HSP-90 (DAF-21)</text>
  <text x="325" y="256" font-size="12" fill="#15201e" text-anchor="middle">HSP-4 (BiP, in the ER)</text>
  <path d="M430,290 L400,272" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- hold -->
  <rect x="40" y="300" width="260" height="84" rx="10" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="170" y="320" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">Hold (holdase, no ATP)</text>
  <text x="170" y="338" font-size="12" fill="#15201e" text-anchor="middle">HSP-16.2 (small HSP)</text>
  <text x="170" y="356" font-size="11" fill="#bd3a30" text-anchor="middle">protein refolding: REMOVE</text>
  <text x="170" y="372" font-size="11" fill="#1d68b3" text-anchor="middle">protein folding chaperone: NEW</text>
  <path d="M425,305 L305,335" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- proteasome -->
  <rect x="520" y="200" width="200" height="90" rx="10" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <text x="620" y="220" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">Degrade: proteasome</text>
  <text x="620" y="238" font-size="12" fill="#15201e" text-anchor="middle">CDC-48 (p97) extracts</text>
  <text x="620" y="254" font-size="12" fill="#15201e" text-anchor="middle">UFD-1 (ERAD adaptor)</text>
  <text x="620" y="270" font-size="12" fill="#15201e" text-anchor="middle">RPN-10 (Ub receptor)</text>
  <path d="M515,290 L540,275" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- autophagy -->
  <rect x="640" y="340" width="250" height="84" rx="10" fill="#e8f1ee" stroke="#0e6b66" stroke-width="2"/>
  <text x="765" y="360" font-size="13" font-weight="bold" fill="#0e6b66" text-anchor="middle">Degrade: autophagy</text>
  <text x="765" y="378" font-size="12" fill="#15201e" text-anchor="middle">BEC-1, ATG-18, LGG-1</text>
  <text x="765" y="396" font-size="11" fill="#bd3a30" text-anchor="middle">LGG-1 GABA receptor binding: REMOVE</text>
  <path d="M520,318 L636,370" stroke="#0e6b66" stroke-width="2.5" marker-end="url(#a)"/>
  <!-- footnote -->
  <text x="40" y="460" font-size="12" fill="#15201e">Most MODIFY rows replace <tspan font-weight="bold">protein binding</tspan> (IPI); on HSP-1 → protein-folding chaperone binding.</text>
  <text x="40" y="482" font-size="12" fill="#15201e">HSP-90 is the single worm HSP90 (Q18688); daf-21 is its old mutant name.</text>
  <text x="40" y="504" font-size="11" fill="#56655f">Schematic drawn from the project page and review files. Red bar: inhibition.</text>
</svg>
