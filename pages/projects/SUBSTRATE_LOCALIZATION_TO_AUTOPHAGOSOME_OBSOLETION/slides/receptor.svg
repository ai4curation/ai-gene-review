<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <!-- phagophore arc -->
  <path d="M660 60 Q 600 260 660 460" fill="none" stroke="#0e6b66" stroke-width="16" stroke-linecap="round"/>
  <path d="M660 60 Q 600 260 660 460" fill="none" stroke="#dcefec" stroke-width="10" stroke-linecap="round"/>
  <text x="690" y="200" font-size="14" font-weight="600" fill="#0e6b66">phagophore membrane</text><text x="690" y="220" font-size="12.5" fill="#56655f">(forming autophagosome)</text><text x="690" y="240" font-size="12.5" fill="#56655f">ATG8 proteins lipidated</text><text x="690" y="258" font-size="12.5" fill="#56655f">on its surface</text>
  <!-- ATG8 dots on inner surface -->
  <g fill="#0e6b66">
    <circle cx="626" cy="120" r="15"/><circle cx="614" cy="200" r="15"/><circle cx="611" cy="260" r="15"/><circle cx="614" cy="320" r="15"/><circle cx="626" cy="400" r="15"/>
  </g>
  <g font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">
    <text x="626" y="124">ATG8</text><text x="614" y="204">ATG8</text><text x="611" y="264">ATG8</text><text x="614" y="324">ATG8</text><text x="626" y="404">ATG8</text>
  </g>
  <!-- receptors -->
  <g font-size="14">
    <rect x="410" y="100" width="150" height="40" rx="20" fill="#1d68b3"/><text x="485" y="125" text-anchor="middle" fill="#ffffff" font-weight="600">STBD1</text>
    <rect x="410" y="180" width="150" height="40" rx="20" fill="#1d68b3"/><text x="485" y="205" text-anchor="middle" fill="#ffffff" font-weight="600">RETREG2</text>
    <rect x="410" y="240" width="150" height="40" rx="20" fill="#56655f"/><text x="485" y="265" text-anchor="middle" fill="#ffffff" font-weight="600">SMURF1 (E3)</text>
    <rect x="410" y="300" width="150" height="40" rx="20" fill="#1d68b3"/><text x="485" y="325" text-anchor="middle" fill="#ffffff" font-weight="600">IRGQ</text>
  </g>
  <g stroke="#15201e" stroke-width="2">
    <path d="M560 120 L611 120"/><path d="M560 200 L599 200"/><path d="M560 320 L599 320"/>
    <path d="M330 120 L410 120"/><path d="M330 200 L410 200"/><path d="M330 260 L410 260"/><path d="M330 320 L410 320"/>
  </g>
  <text x="566" y="112" font-size="11" fill="#56655f">LIR/AIM</text>
  <!-- cargo -->
  <g font-size="14" fill="#15201e" text-anchor="end">
    <text x="322" y="116" font-weight="600">glycogen</text><text x="322" y="134" font-size="12" fill="#56655f">→ glycophagy</text>
    <text x="322" y="196" font-weight="600">ER membrane</text><text x="322" y="214" font-size="12" fill="#56655f">→ reticulophagy</text>
    <text x="322" y="256" font-weight="600">mitochondria, bacteria</text><text x="322" y="274" font-size="12" fill="#56655f">→ mitophagy, xenophagy</text>
    <text x="322" y="316" font-weight="600">misfolded MHC-I</text><text x="322" y="334" font-size="12" fill="#b8620f">→ no specific term yet</text>
  </g>
  <!-- TOM1 -->
  <rect x="410" y="400" width="150" height="40" rx="20" fill="#56655f"/><text x="485" y="425" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="600">TOM1</text>
  <text x="322" y="416" font-size="14" font-weight="600" fill="#15201e" text-anchor="end">later step</text>
  <text x="322" y="434" font-size="12" fill="#56655f" text-anchor="end">→ autophagosome-lysosome fusion</text>
  <!-- legend -->
  <rect x="30" y="30" width="330" height="54" rx="8" fill="#e3eefa" stroke="#1d68b3"/>
  <text x="44" y="52" font-size="13" font-weight="600" fill="#1d68b3">cargo → receptor → ATG8 is a bridging activity</text>
  <text x="44" y="72" font-size="12.5" fill="#15201e">= MF GO:0160247, not a separate process</text>
  <text x="30" y="470" font-size="12.5" fill="#56655f">grey: annotated gene products that are not ATG8-binding cargo receptors</text>
  <text x="30" y="490" font-size="13" fill="#56655f">The process each receptor serves is named by its cargo, so the obsolete BP splits by cargo.</text>
</svg>
