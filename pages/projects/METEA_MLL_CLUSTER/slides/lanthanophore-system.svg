<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0e6b66"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#b8620f"/></marker>
  </defs>
  <text x="480" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#15201e">Methylolanthanin: a siderophore-like system for lanthanides</text>
  <!-- compartments -->
  <text x="40" y="44" font-size="13" fill="#56655f">outside</text>
  <rect x="30" y="92" width="900" height="26" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="40" y="110" font-size="12" fill="#56655f">outer membrane</text>
  <text x="40" y="146" font-size="13" fill="#56655f">periplasm</text>
  <rect x="30" y="226" width="900" height="26" fill="#e8f1ee" stroke="#8fa39c"/>
  <text x="40" y="244" font-size="12" fill="#56655f">inner membrane</text>
  <text x="40" y="280" font-size="13" fill="#56655f">cytoplasm</text>
  <!-- Ln outside -->
  <circle cx="200" cy="62" r="14" fill="#ffffff" stroke="#7657a3" stroke-width="2"/><text x="200" y="67" text-anchor="middle" font-size="11" fill="#7657a3">Ln³⁺</text>
  <text x="180" y="66" text-anchor="end" font-size="11" fill="#56655f">poorly soluble (e.g. Nd₂O₃)</text>
  <!-- secreted chelator -->
  <path d="M320 300 L320 60" stroke="#8fa39c" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="312" y="215" text-anchor="end" font-size="11" fill="#56655f">secreted</text>
  <g transform="translate(300 42)"><rect width="140" height="30" rx="15" fill="#dcefec" stroke="#0e6b66"/><text x="70" y="20" text-anchor="middle" font-size="12" fill="#0e6b66">methylolanthanin</text></g>
  <path d="M214 62 L296 58" stroke="#7657a3" stroke-width="1.5" marker-end="url(#a)"/>
  <!-- MluA receptor -->
  <rect x="560" y="80" width="70" height="56" rx="8" fill="#ffffff" stroke="#0e6b66" stroke-width="2"/>
  <text x="595" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#0e6b66">MluA</text>
  <text x="595" y="122" text-anchor="middle" font-size="10" fill="#56655f">TonB-dep.</text>
  <path d="M440 57 Q 540 50 575 78" fill="none" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <text x="520" y="42" text-anchor="middle" font-size="11" fill="#56655f">Ln³⁺ complex</text>
  <path d="M595 138 L595 178" stroke="#0e6b66" stroke-width="2"/>
  <!-- XoxF -->
  <g transform="translate(360 150)"><rect width="200" height="56" rx="10" fill="#dcefec" stroke="#0e6b66"/><text x="100" y="24" text-anchor="middle" font-size="13" font-weight="600" fill="#0e6b66">XoxF MDH (Ln³⁺, PQQ)</text><text x="100" y="42" text-anchor="middle" font-size="11" fill="#15201e">methanol → formaldehyde</text></g>
  <path d="M595 178 L566 178" stroke="#0e6b66" stroke-width="2" marker-end="url(#a)"/>
  <text x="603" y="200" font-size="10" fill="#56655f">Ln³⁺ delivered to MDH</text>
  <!-- MllJ periplasmic -->
  <g transform="translate(140 150)"><rect width="110" height="40" rx="8" fill="#ffffff" stroke="#8fa39c"/><text x="55" y="18" text-anchor="middle" font-size="12" fill="#15201e">MllJ</text><text x="55" y="33" text-anchor="middle" font-size="10" fill="#56655f">ferritin-like, TAT</text></g>
  <!-- signalling -->
  <path d="M630 110 Q 700 110 720 226" fill="none" stroke="#b8620f" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#o)"/>
  <text x="745" y="145" font-size="11" fill="#b8620f">cell-surface signalling</text>
  <rect x="690" y="226" width="80" height="26" rx="6" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
  <text x="730" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#b8620f">MluR</text>
  <text x="790" y="244" font-size="10" fill="#56655f">anti-σ</text>
  <path d="M730 254 L730 292" stroke="#b8620f" stroke-width="2" marker-end="url(#o)"/>
  <text x="742" y="280" font-size="10" fill="#56655f">releases</text>
  <circle cx="730" cy="318" r="24" fill="#ffffff" stroke="#b8620f" stroke-width="2"/>
  <text x="730" y="323" text-anchor="middle" font-size="12" font-weight="600" fill="#b8620f">MluI</text>
  <text x="768" y="324" font-size="10" fill="#56655f">ECF σ</text>
  <path d="M706 330 L620 380" stroke="#b8620f" stroke-width="2" marker-end="url(#o)"/>
  <text x="690" y="378" font-size="10" fill="#56655f">transcribes cluster</text>
  <!-- cluster -->
  <g transform="translate(90 380)">
    <text x="0" y="-8" font-size="12" font-weight="600" fill="#15201e">mll biosynthetic cluster (META1p4129–4138), ~32-fold induced under Ln limitation</text>
    <g font-size="11" fill="#15201e" text-anchor="middle">
      <path d="M0 0 h58 l12 17 l-12 17 h-58 z" fill="#dcefec" stroke="#0e6b66"/><text x="32" y="21">mllA</text>
      <path d="M76 0 h58 l12 17 l-12 17 h-58 z" fill="#dcefec" stroke="#0e6b66"/><text x="108" y="21">mllBC</text>
      <path d="M152 0 h58 l12 17 l-12 17 h-58 z" fill="#dcefec" stroke="#0e6b66"/><text x="184" y="21">mllDE</text>
      <path d="M228 0 h58 l12 17 l-12 17 h-58 z" fill="#dcefec" stroke="#0e6b66"/><text x="260" y="21">mllF</text>
      <path d="M304 0 h58 l12 17 l-12 17 h-58 z" fill="#ffffff" stroke="#8fa39c"/><text x="336" y="21">mllG</text>
      <path d="M380 0 h58 l12 17 l-12 17 h-58 z" fill="#dcefec" stroke="#0e6b66"/><text x="412" y="21">mllH</text>
      <path d="M456 0 h58 l12 17 l-12 17 h-58 z" fill="#dcefec" stroke="#0e6b66"/><text x="488" y="21">mllJ</text>
    </g>
    <g font-size="10" fill="#56655f" text-anchor="middle">
      <text x="32" y="50">IucA/C-like</text><text x="32" y="63">ligase</text>
      <text x="108" y="50">AsbD/E-like</text><text x="108" y="63">fusion</text>
      <text x="184" y="50">carrier +</text><text x="184" y="63">ligase</text>
      <text x="260" y="50">xylose</text><text x="260" y="63">isomerase-like</text>
      <text x="336" y="50">DUF2218,</text><text x="336" y="63">no MF asserted</text>
      <text x="412" y="50">GCN5</text><text x="412" y="63">acetyltransferase</text>
      <text x="488" y="50">ferritin-like</text><text x="488" y="63">periplasmic</text>
    </g>
  </g>
  <path d="M400 376 L360 310 L330 300" fill="none" stroke="#0e6b66" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="372" y="336" font-size="11" fill="#0e6b66">builds</text>
</svg>
