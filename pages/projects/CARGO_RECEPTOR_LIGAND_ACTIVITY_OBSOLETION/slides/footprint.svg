<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8fa39c"/></marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="40" font-size="18" font-weight="600" fill="#15201e">172 annotations to GO:0140355, and where they come from</text>
  <text x="30" y="62" font-size="13" fill="#56655f">QuickGO, 2026-09-12. All molecular function, all "enables".</text>
  <!-- column: 6 experimental -->
  <text x="30" y="104" font-size="13" font-weight="600" fill="#0e6b66">6 EXPERIMENTAL ROWS (the curation job)</text>
  <g font-size="13.5" fill="#15201e">
    <rect x="30" y="116" width="280" height="30" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="42" y="136">TCN1 human · EXP · Reactome</text>
    <rect x="30" y="152" width="280" height="30" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="42" y="172">TCN2 human · EXP · Reactome</text>
    <rect x="30" y="188" width="280" height="30" rx="6" fill="#e8f1ee" stroke="#8fa39c"/><text x="42" y="208">CBLIF human · EXP · Reactome</text>
    <rect x="30" y="236" width="280" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/><text x="42" y="256">Tcn2 mouse · IDA · MGI  (seed)</text>
    <rect x="30" y="272" width="280" height="30" rx="6" fill="#dcefec" stroke="#0e6b66" stroke-width="1.6"/><text x="42" y="292">Cblif mouse · IDA · MGI  (seed)</text>
    <rect x="30" y="320" width="280" height="30" rx="6" fill="#fbeceb" stroke="#bd3a30" stroke-width="1.6"/><text x="42" y="340">ATG5 yeast · IDA · SGD  (seed)</text>
  </g>
  <text x="30" y="372" font-size="12" fill="#bd3a30">ATG5 is conjugation machinery, not cargo: remove</text>
  <!-- IEA fan-out bars: scale 4px per row -->
  <text x="420" y="104" font-size="13" font-weight="600" fill="#56655f">157 IEA ROWS · Ensembl orthology (GO_REF:0000107)</text>
  <path d="M312 251 L416 251" stroke="#8fa39c" stroke-width="2" marker-end="url(#g)"/>
  <rect x="420" y="236" width="308" height="30" fill="#0e6b66"/><text x="738" y="256" font-size="14" font-weight="600" fill="#15201e">77</text>
  <path d="M312 287 L416 287" stroke="#8fa39c" stroke-width="2" marker-end="url(#g)"/>
  <rect x="420" y="272" width="272" height="30" fill="#0e6b66"/><text x="702" y="292" font-size="14" font-weight="600" fill="#15201e">68</text>
  <path d="M312 335 L416 335" stroke="#8fa39c" stroke-width="2" marker-end="url(#g)"/>
  <rect x="420" y="320" width="48" height="30" fill="#bd3a30"/><text x="478" y="340" font-size="14" font-weight="600" fill="#15201e">12 fungal</text>
  <text x="420" y="136" font-size="13" fill="#15201e">Regenerated from the seeds every Ensembl release.</text>
  <text x="420" y="156" font-size="13" fill="#15201e">Clearing the human Reactome rows alone would leave</text>
  <text x="420" y="176" font-size="13" fill="#15201e">the whole fan-out standing: the seeds are mouse.</text>
  <!-- ISO -->
  <text x="30" y="420" font-size="13" font-weight="600" fill="#56655f">9 ISO ROWS</text>
  <rect x="30" y="432" width="300" height="30" fill="#8fa39c"/>
  <text x="42" y="452" font-size="13" fill="#ffffff">8 Tcn2/Cblif orthology transfers (mouse, rat)</text>
  <rect x="336" y="432" width="300" height="30" rx="6" fill="#fbeceb" stroke="#bd3a30" stroke-width="1.6"/>
  <text x="348" y="452" font-size="13" fill="#15201e">1 mouse Hpse: source human HPSE row is gone</text>
  <text x="30" y="490" font-size="12.5" fill="#56655f">6 + 9 + 157 = 172. Net human curation effort: 6 rows.</text>
</svg>
