# Reviewed bridge between the Kholodenko 2000 MAPK cascade kinetic model
# (BioModels BIOMD0000000010, PMID:10712587) and curated module element ids.
# Format: models/kinetic/README.md. Symbols are a shared namespace.
#
# This is curation knowledge, not lexical matching:
#   - the model is a generic three-tier MAPK cascade. Its species are
#     annotated to Xenopus laevis proteins: MAPKKK to RAF1 (UniProt P09560,
#     RAF1_XENLA), MAPKK to MEK1 (Q05116, MP2K1_XENLA) and MAPK to MAPK1
#     (P26696, MK01_XENLA). The MAPKKK species are *named* "Mos" in the SBML
#     but annotated to RAF1; the annotation is what places them on the module's
#     RAF (MAP3K) tier;
#   - each tier's phosphoforms collapse onto one symbol, and activity_levels
#     records how far each form is along the activation path (0 = inactive).
#     In the model only the fully phosphorylated MAPKK and MAPK forms catalyse
#     downstream reactions, and only singly phosphorylated MAPKKK exists;
#   - the model has no adaptor, SOS, RAS, phosphatase or output species
#     (dephosphorylation is a parameterised reaction with no enzyme species), so
#     the module's GRB2/SOS/RAS/DUSP/ERK_OUTPUT edges have no counterpart here.
source: https://www.ebi.ac.uk/biomodels/BIOMD0000000010
publication: PMID:10712587
modules:
  erk_cascade:
    RAF: raf_map3k
    MEK: mek_map2k
    ERK: erk_mapk
external:
  RAF: [MKKK, MKKK_P]
  MEK: [MKK, MKK_P, MKK_PP]
  ERK: [MAPK, MAPK_P, MAPK_PP]
activity_levels:
  MKKK: 0
  MKKK_P: 1
  MKK: 0
  MKK_P: 1
  MKK_PP: 2
  MAPK: 0
  MAPK_P: 1
  MAPK_PP: 2
notes: |
  The model's only regulatory term outside the forward cascade is MAPK-PP in
  the MAPKKK activation rate law, v = V1 * MKKK / ((1 + (MAPK_PP/Ki)^n) *
  (K1 + MKKK)): the ERK -| MAP3K negative feedback that produces the model's
  oscillations. The module's ERK -| RAF connection is the same feedback.
