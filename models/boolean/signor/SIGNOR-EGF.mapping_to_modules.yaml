# Reviewed bridge between SIGNOR-EGF ("EGFR Signaling") entity names and the
# shared symbols used for the ERK/p38/JNK cascade modules (the same symbol
# namespace as models/boolean/bbm-070-mapk-cancer-cell-fate/mapping_to_modules.yaml,
# so the two sources can be compared with each other as well as with the modules).
#
# SIGNOR uses single proteins (HRAS, BRAF, SOS1) and protein-family nodes
# ("ERK1/2", "MEK1/2"). Module tiers are family-level, so several SIGNOR
# entities collapse onto one symbol (SHC1 and GRB2 onto the adaptor step, which
# the module models as one "GRB2/SHC adaptor" annoton).
source: https://signor.uniroma2.it/getPathwayData.php?pathway=SIGNOR-EGF&relations=only
publication: PMID:36243968
modules:
  erk_cascade:
    GRB2: adaptor_recruitment
    SOS: ras_gef_step
    RAS: ras_active
    RASGAP: rasgap_step
    RAF: raf_map3k
    MEK: mek_map2k
    ERK: erk_mapk
    ERK_OUTPUT: erk_output
    DUSP: mapk_negative_regulation
  jnk_cascade:
    STRESS_MAP3K: jnk_map3k
    MKK47: jnk_map2k
    JNK: jnk_mapk
    JNK_OUTPUT: jnk_output
    DUSP: jnk_negative_regulation
external:
  GRB2: [GRB2, SHC1]
  SOS: SOS1
  RAS: HRAS
  RAF: BRAF
  MEK: MEK1/2
  ERK: ERK1/2
  ERK_OUTPUT: [ELK1, FOS]
  STRESS_MAP3K: MAP3K1
  MKK47: MAP2K4
  JNK: MAPK8
  JNK_OUTPUT: JUN
notes: |
  SIGNOR-EGF has no phosphatase acting on ERK1/2 and no RasGAP, so the module's
  DUSP -| ERK and RASGAP -| RAS edges are expected to be module-only. ELK1 is also
  phosphorylated by MAPK8 (JNK) in SIGNOR, which becomes a JNK -> ERK_OUTPUT
  source-only edge (lumping artefact, as for BBM-070). Partially mapped edges
  (e.g. SRC -| HRAS, PTPN11 -> HRAS, CBLB -| EGFR) are the external regulators of
  mapped tiers that the module does not name.
  The module asserts two SOS feedbacks, ERK -| SOS (direct, PMID:8816480) and
  ERK_OUTPUT -| SOS (RSK, PMID:22827337). SIGNOR-EGF carries only the direct ERK1/2
  -| SOS1 rows, so ERK -| SOS agrees and the RSK route ERK_OUTPUT -| SOS is
  expected to be module-only.
