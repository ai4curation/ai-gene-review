# Frozen from modules/erk_cascade.yaml by scripts/build_boolean_conformance.py;
# translation-relevant keys only. Refresh with --refresh-inputs.
id: MODULE:erk_cascade
title: ERK1/2 (Ras-RAF-MEK-ERK) MAPK cascade module
module:
  id: erk_cascade
  label: ERK1/2 (Ras-RAF-MEK-ERK) cascade
  module_type: SIGNALING_PATHWAY
  parts:
  - node:
      id: adaptor_recruitment
      label: GRB2/SHC adaptor recruitment to receptor phosphotyrosine
      module_type: REGULATORY_STEP
      annotons:
      - id: grb2_shc_adaptor
        label: GRB2/SHC adaptor function
        participant: {}
  - node:
      id: ras_nucleotide_switch
      label: Ras GTPase nucleotide switch (SOS / Ras / RasGAP)
      module_type: REACTION
      parts:
      - node:
          id: ras_gef_step
          label: SOS guanine nucleotide exchange on Ras
          module_type: REACTION
          annotons:
          - id: sos_gef
            label: SOS Ras GEF activity
            participant: {}
      - node:
          id: ras_active
          label: Active GTP-bound Ras
          module_type: REACTION
          annotons:
          - id: ras_gtpase
            label: Ras GTPase
            participant: {}
      - node:
          id: rasgap_step
          label: RasGAP acceleration of Ras GTP hydrolysis
          module_type: REACTION
          annotons:
          - id: rasgap_role
            label: RasGAP function
            participant: {}
      connections:
      - source: ras_gef_step
        target: ras_active
        connection_type: CAUSES
      - source: rasgap_step
        target: ras_active
        connection_type: NEGATIVELY_REGULATES
  - node:
      id: erk_relay
      label: ERK kinase relay (RAF -> MEK -> ERK)
      module_type: REACTION
      parts:
      - node:
          id: raf_map3k
          label: RAF MAP kinase kinase kinase activation
          module_type: REACTION
          annotons:
          - id: raf_kinase
            label: RAF MAP3K activity
            participant: {}
      - node:
          id: mek_map2k
          label: MEK1/MEK2 MAP kinase kinase activation
          module_type: REACTION
          annotons:
          - id: mek_kinase
            label: MEK MAP2K activity
            participant: {}
      - node:
          id: erk_mapk
          label: ERK1/ERK2 MAP kinase activation
          module_type: REACTION
          annotons:
          - id: erk_kinase
            label: ERK1/ERK2 MAP kinase activity
            participant: {}
      connections:
      - source: raf_map3k
        target: mek_map2k
        connection_type: CAUSES
      - source: mek_map2k
        target: erk_mapk
        connection_type: CAUSES
  - node:
      id: erk_output
      label: ERK effector and transcriptional output
      module_type: REGULATORY_STEP
      annotons:
      - id: erk_substrate_output
        label: ERK substrate phosphorylation and transcriptional activation
        participant: {}
      - id: rsk_kinase
        label: RSK (p90 ribosomal S6 kinase) effector activity
        participant: {}
  - node:
      id: mapk_negative_regulation
      label: DUSP/MKP dephosphorylation of ERK
      module_type: REACTION
      annotons:
      - id: dusp_role
        label: DUSP/MKP phosphatase function
        participant: {}
  - optional: true
    node:
      id: sprouty_spred_feedback
      label: Sprouty/SPRED feedback inhibition of Ras-RAF activation
      module_type: REGULATORY_STEP
      variant_sets:
      - id: sprouty_spred_mechanisms
        variants:
        - id: spry_grb2_variant
          label: Sprouty GRB2 sequestration (SPRY2)
          module_type: REGULATORY_STEP
          annotons:
          - id: spry_grb2_sequestration
            label: Sprouty GRB2 sequestering activity
            participant: {}
        - id: spry_raf_variant
          label: Sprouty kinase inhibition (SPRY1, SPRY2, SPRY4)
          module_type: REGULATORY_STEP
          annotons:
          - id: spry_raf_inhibition
            label: Sprouty RAF kinase inhibition
            participant: {}
        - id: spred_nf1_variant
          label: SPRED neurofibromin recruitment (SPRED1, SPRED2)
          module_type: REGULATORY_STEP
          annotons:
          - id: spred_nf1_recruitment
            label: SPRED neurofibromin membrane recruitment
            participant: {}
  connections:
  - source: adaptor_recruitment
    target: ras_nucleotide_switch
    connection_type: PROVIDES_INPUT_FOR
  - source: ras_nucleotide_switch
    target: erk_relay
    connection_type: CAUSES
  - source: erk_relay
    target: erk_output
    connection_type: PROVIDES_INPUT_FOR
  - source: mapk_negative_regulation
    target: erk_mapk
    connection_type: NEGATIVELY_REGULATES
  - source: erk_output
    target: sprouty_spred_feedback
    connection_type: CAUSES
  - source: sprouty_spred_feedback
    target: ras_nucleotide_switch
    connection_type: NEGATIVELY_REGULATES
  - source: sprouty_spred_feedback
    target: erk_relay
    connection_type: NEGATIVELY_REGULATES
  - source: erk_output
    target: mapk_negative_regulation
    connection_type: CAUSES
  - source: erk_mapk
    target: raf_map3k
    connection_type: NEGATIVELY_REGULATES
  - source: erk_mapk
    target: ras_gef_step
    connection_type: NEGATIVELY_REGULATES
  - source: erk_output
    target: ras_gef_step
    connection_type: NEGATIVELY_REGULATES
executable_models:
- id: erk_cascade_boolean
  model_type: BOOLEAN
  derivation: DERIVED_FROM_MODULE
  scenarios:
  - id: unstimulated
    label: No stimulus
    description: No receptor-adaptor recruitment. The cascade rests with every tier
      off.
    settings:
    - element: adaptor_recruitment
      active: false
    - element: rasgap_step
      active: false
    expected_attractor_kind: FIXED_POINT
    expected_attractor_count: 1
    expected_inactive:
    - ras_active
    - erk_mapk
  - id: sustained_stimulus
    label: Sustained stimulus
    description: 'Adaptor recruitment held on, as under a persistent growth-factor
      signal. Because ERK inhibits RAF and SOS directly and induces DUSP phosphatases
      and Sprouty, there is no steady state with ERK on: the single attractor is cyclic,
      which in a Boolean model reads as transient (pulsed or adapting) ERK activity
      rather than literal oscillation. The published MAPK logical model (BBM-070)
      also has a cyclic ERK attractor under growth-factor input, but there the transience
      is driven by receptor-level feedback (receptor degradation and PKC), which lies
      outside this module''s boundary; its authors report that disrupting the downstream
      feedbacks does not qualitatively change the outcome. The two models agree in
      attractor kind, not in mechanism.'
    settings:
    - element: adaptor_recruitment
      active: true
    - element: rasgap_step
      active: false
    expected_attractor_kind: CYCLIC
    expected_attractor_count: 1
    expected_oscillating:
    - raf_map3k
    - erk_mapk
    - mapk_negative_regulation
    evidence:
    - source_id: PMID:24250280
      statement: The published MAPK logical model reads its cyclic ERK attractor under
        growth-factor input as transient ERK activation.
      supporting_text: In other words, ERK oscillations in our state transition graph
        correspond to the transient ERK activation in the ODE-based model from Orton
        et al.
    - source_id: PMID:24250280
      statement: In the published model the transience is attributed to feedback acting
        on the receptors, not to the downstream feedbacks this module wires.
      supporting_text: The main negative feedbacks underlying such responses are acting
        directly on the receptors ... disruption of any other downstream negative
        feedback does not qualitatively influence the outcome
  - id: feedback_cut
    label: Feedback loops cut
    description: 'Counterfactual: the module''s wiring before its negative feedback
      was curated in. The five feedback connections are removed and the DUSP and Sprouty
      steps are held at their uninduced (off) state. ERK then locks on. That outcome
      is contradicted at the level of behaviour: ERK signalling is transient, and
      BBM-070 does not lock ERK on under receptor stimulation. As for sustained_stimulus,
      the external model reaches that outcome through receptor-level feedback outside
      this module, so it does not corroborate the mechanism.'
    settings:
    - element: adaptor_recruitment
      active: true
    - element: rasgap_step
      active: false
    - element: mapk_negative_regulation
      active: false
    - element: sprouty_spred_feedback
      active: false
    removed_connections:
    - source: erk_mapk
      target: raf_map3k
    - source: erk_mapk
      target: ras_gef_step
    - source: erk_output
      target: ras_gef_step
    - source: erk_output
      target: mapk_negative_regulation
    - source: erk_output
      target: sprouty_spred_feedback
    expected_attractor_kind: FIXED_POINT
    expected_attractor_count: 1
    expected_active:
    - erk_mapk
    - erk_output
  - id: transcriptional_feedback_lost
    label: DUSP and Sprouty knocked out
    description: 'Both induced feedbacks removed, as by knockout of the inducible
      phosphatases and Sprouty/Spred. The direct ERK phosphorylation of RAF and SOS
      still prevents a locked-on state: the feedbacks are redundant, and the post-translational
      ones alone suffice to keep signalling transient in this model. This is a property
      of the module''s wiring, not a literature-calibrated result: in BBM-070 the
      sufficient feedback is at the receptor, outside this module.'
    settings:
    - element: adaptor_recruitment
      active: true
    - element: rasgap_step
      active: false
    - element: mapk_negative_regulation
      active: false
    - element: sprouty_spred_feedback
      active: false
    expected_attractor_kind: CYCLIC
    expected_attractor_count: 1
    expected_oscillating:
    - erk_mapk
  - id: mek_inhibited
    label: MEK inhibited
    description: MEK held off, as by a MEK inhibitor. ERK cannot be activated whatever
      the upstream input; RAS and RAF stay on because nothing downstream feeds back.
    settings:
    - element: adaptor_recruitment
      active: true
    - element: rasgap_step
      active: false
    - element: mek_map2k
      active: false
    expected_attractor_kind: FIXED_POINT
    expected_attractor_count: 1
    expected_active:
    - ras_active
    - raf_map3k
    expected_inactive:
    - erk_mapk
  - id: rasgap_dominant
    label: RasGAP active
    description: RasGAP (e.g. NF1) held on. RAS-GTP cannot accumulate, so the cascade
      stays off despite the stimulus.
    settings:
    - element: adaptor_recruitment
      active: true
    - element: rasgap_step
      active: true
    expected_attractor_kind: FIXED_POINT
    expected_attractor_count: 1
    expected_inactive:
    - ras_active
    - erk_mapk
