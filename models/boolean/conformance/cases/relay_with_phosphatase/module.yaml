# Synthetic: a three-tier relay with a phosphatase on the last tier.
# Exercises the default rule (OR activators, AND NOT inhibitors), free inputs, and
# a structural PART_OF edge (kinase A in a scaffold complex) that translation ignores.
id: MODULE:conformance_relay_with_phosphatase
module:
  id: relay
  label: Relay with phosphatase
  parts:
  - node: {id: signal, label: Signal}
  - node: {id: kinase_a, label: Kinase A}
  - node: {id: kinase_b, label: Kinase B}
  - node: {id: phosphatase, label: Phosphatase}
  - node: {id: scaffold, label: Scaffold complex}
  connections:
  - {source: signal, target: kinase_a, connection_type: CAUSES}
  - {source: kinase_a, target: kinase_b, connection_type: POSITIVELY_REGULATES}
  - {source: phosphatase, target: kinase_b, connection_type: NEGATIVELY_REGULATES}
  - {source: kinase_a, target: scaffold, connection_type: PART_OF}
executable_models:
- id: relay_boolean
  model_type: BOOLEAN
  derivation: DERIVED_FROM_MODULE
  scenarios:
  - id: stimulated
    settings: [{element: signal, active: true}, {element: phosphatase, active: false}]
    expected_attractor_kind: FIXED_POINT
    expected_active: [kinase_b]
  - id: phosphatase_on
    settings: [{element: signal, active: true}, {element: phosphatase, active: true}]
    expected_inactive: [kinase_b]
  - id: kinase_a_knocked_out
    settings: [{element: signal, active: true}, {element: phosphatase, active: false}, {element: kinase_a, active: false}]
    expected_inactive: [kinase_b]
