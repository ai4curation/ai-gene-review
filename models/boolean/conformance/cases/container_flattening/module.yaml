# Synthetic: an edge into a wired container lands on its entry tiers, an edge
# out leaves from its exit tiers, and a pure inhibitor tier (a GAP) is neither.
# The annoton under the effector is an atomic variable.
id: MODULE:conformance_container_flattening
module:
  id: flat
  label: Container flattening
  parts:
  - node: {id: receptor, label: Receptor}
  - node:
      id: switch
      label: GTPase switch
      parts:
      - node: {id: gef, label: GEF}
      - node: {id: gtpase, label: Active GTPase}
      - node: {id: gap, label: GAP}
      connections:
      - {source: gef, target: gtpase, connection_type: CAUSES}
      - {source: gap, target: gtpase, connection_type: NEGATIVELY_REGULATES}
  - node:
      id: effector
      label: Effector
      annotons:
      - {id: effector_kinase, label: Effector kinase, participant: {}}
  connections:
  - {source: receptor, target: switch, connection_type: CAUSES}
  - {source: switch, target: effector_kinase, connection_type: CAUSES}
executable_models:
- id: flat_boolean
  model_type: BOOLEAN
  derivation: DERIVED_FROM_MODULE
  scenarios:
  - id: stimulated
    settings: [{element: receptor, active: true}, {element: gap, active: false}]
    expected_active: [gtpase, effector_kinase]
  - id: gap_active
    settings: [{element: receptor, active: true}, {element: gap, active: true}]
    expected_inactive: [gtpase, effector_kinase]
