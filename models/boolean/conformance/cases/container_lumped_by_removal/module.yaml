# Synthetic: removing a container's only internal connection makes it one lumped
# step. The scenario network then has a variable the base network does not (the
# container) and loses its children, so scenario variables, rules and edges are
# the variant's own.
id: MODULE:conformance_container_lumped_by_removal
module:
  id: lump
  label: Container lumped by removal
  parts:
  - node: {id: signal, label: Signal}
  - node:
      id: relay
      label: Two-tier relay
      parts:
      - node: {id: upstream_tier, label: Upstream tier}
      - node: {id: downstream_tier, label: Downstream tier}
      connections:
      - {source: upstream_tier, target: downstream_tier, connection_type: CAUSES}
  - node: {id: response, label: Response}
  connections:
  - {source: signal, target: relay, connection_type: CAUSES}
  - {source: relay, target: response, connection_type: CAUSES}
executable_models:
- id: lump_boolean
  model_type: BOOLEAN
  derivation: DERIVED_FROM_MODULE
  scenarios:
  - id: wired
    settings: [{element: signal, active: true}]
    expected_active: [upstream_tier, downstream_tier, response]
  - id: internal_wiring_removed
    settings: [{element: signal, active: true}]
    removed_connections: [{source: upstream_tier, target: downstream_tier}]
    expected_active: [relay, response]
