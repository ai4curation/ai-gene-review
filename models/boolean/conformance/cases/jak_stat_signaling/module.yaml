# translation-relevant keys only. Refresh with --refresh-inputs.
id: MODULE:jak_stat_signaling
title: Canonical JAK-STAT cytokine signaling pathway module
module:
  id: jak_stat_signaling
  label: Canonical JAK-STAT cytokine signaling pathway
  module_type: SIGNALING_PATHWAY
  parts:
  - node:
      id: ligand_receptor_engagement
      label: Cytokine binding and receptor reorganization
      module_type: REGULATORY_STEP
      annotons:
      - id: cytokine_ligand
        label: Cytokine/hormone ligand
        participant: {}
      - id: cytokine_receptor
        label: Single-pass cytokine receptor chain(s)
        participant: {}
  - node:
      id: jak_activation
      label: Receptor-associated JAK activation
      module_type: REACTION
      annotons:
      - id: jak_kinase_role
        label: Janus kinase catalytic role
        participant: {}
      variant_sets:
      - id: receptor_jak_pairing
        variants:
        - id: type1_ifn_jak
          label: Type I interferon receptor (JAK1 + TYK2)
          module_type: REACTION
          annotons:
          - id: type1_ifn_jak1
            label: JAK1 at IFNAR2
            participant: {}
          - id: type1_ifn_tyk2
            label: TYK2 at IFNAR1
            participant: {}
        - id: type2_ifn_jak
          label: Type II interferon receptor (JAK1 + JAK2)
          module_type: REACTION
          annotons:
          - id: type2_ifn_jak1
            label: JAK1 at IFNGR1
            participant: {}
          - id: type2_ifn_jak2
            label: JAK2 at IFNGR2
            participant: {}
        - id: gp130_jak
          label: gp130/IL-6-family receptor (JAK1/JAK2/TYK2)
          module_type: REACTION
          annotons:
          - id: gp130_jak1
            label: JAK1 at gp130 (dominant)
            participant: {}
        - id: gammac_jak
          label: Common gamma-chain receptor (JAK1 + JAK3)
          module_type: REACTION
          annotons:
          - id: gammac_jak1
            label: JAK1 at the cytokine-specific chain
            participant: {}
          - id: gammac_jak3
            label: JAK3 at the common gamma chain
            participant: {}
        - id: homodimeric_jak2
          label: Homodimeric hormone receptor (JAK2 only)
          module_type: REACTION
          annotons:
          - id: homodimeric_jak2_unit
            label: JAK2 at homodimeric receptor
            participant: {}
  - node:
      id: receptor_phosphorylation
      label: Receptor tail phosphorylation and STAT docking-site creation
      module_type: REACTION
      annotons:
      - id: receptor_tyr_phosphorylation
        label: JAK-mediated receptor tyrosine phosphorylation
        participant: {}
  - node:
      id: stat_recruitment_phosphorylation
      label: STAT recruitment and phosphorylation
      module_type: REACTION
      annotons:
      - id: stat_substrate_role
        label: STAT recruitment via SH2 and phosphorylation
        participant: {}
      variant_sets:
      - id: stat_paralog_usage
        variants:
        - id: stat1_stat2_variant
          label: STAT1/STAT2 (interferon responses)
          module_type: REACTION
          annotons:
          - id: stat1_unit
            label: STAT1
            participant: {}
          - id: stat2_unit
            label: STAT2
            participant: {}
        - id: stat3_variant
          label: STAT3 (IL-6/gp130, IL-10, IL-21)
          module_type: REACTION
          annotons:
          - id: stat3_unit
            label: STAT3
            participant: {}
        - id: stat4_variant
          label: STAT4 (IL-12/IL-23, Th1/IFN-gamma production)
          module_type: REACTION
          annotons:
          - id: stat4_unit
            label: STAT4
            participant: {}
        - id: stat5_variant
          label: STAT5A/STAT5B (gammac cytokines, EPO, GH, prolactin)
          module_type: REACTION
          annotons:
          - id: stat5b_unit
            label: STAT5B
            participant: {}
          - id: stat5a_unit
            label: STAT5A
            participant: {}
        - id: stat6_variant
          label: STAT6 (IL-4/IL-13, Th2 responses)
          module_type: REACTION
          annotons:
          - id: stat6_unit
            label: STAT6
            participant: {}
  - node:
      id: stat_dimerization_import
      label: STAT dimerization and nuclear import
      module_type: TRANSPORT_STEP
      annotons:
      - id: stat_dimer_import
        label: STAT dimer nuclear import
        participant: {}
  - node:
      id: stat_transcription
      label: STAT-dependent transcription
      activation_logic:
        all_of:
        - element: stat_dimerization_import
        - none_of:
          - element: ptp_dephosphorylation
          - element: pias_restraint
      omitted_regulators:
      - mapk_branch_interface
      module_type: REGULATORY_STEP
      annotons:
      - id: stat_transcriptional_activation
        label: STAT dimer transcriptional activation
        participant: {}
  - optional: false
    node:
      id: jak_stat_negative_regulation
      label: Negative regulation of JAK-STAT signaling
      module_type: REGULATORY_STEP
      parts:
      - node:
          id: socs_feedback
          label: SOCS/CIS negative feedback
          module_type: REGULATORY_STEP
          annotons:
          - id: socs_inhibitor_role
            label: SOCS/CIS feedback inhibitor
            participant: {}
      - node:
          id: ptp_dephosphorylation
          label: Protein tyrosine phosphatase dephosphorylation
          module_type: REACTION
          annotons:
          - id: ptp_role
            label: JAK/STAT tyrosine phosphatase
            participant: {}
      - node:
          id: pias_restraint
          label: PIAS SUMO-ligase restraint of nuclear STATs
          module_type: REGULATORY_STEP
          annotons:
          - id: pias_role
            label: PIAS negative regulator
            participant: {}
  - optional: true
    node:
      id: jak_stat_branch_interfaces
      label: Branch-point interfaces to parallel pathways
      module_type: REGULATORY_STEP
      parts:
      - node:
          id: mapk_branch_interface
          label: Ras-MAPK branch interface
          module_type: REGULATORY_STEP
          annotons:
          - id: erk_stat_serine_feedback
            label: ERK serine phosphorylation of STATs
            participant: {}
      - node:
          id: pi3k_branch_interface
          label: PI3K-AKT-mTOR branch interface
          module_type: REGULATORY_STEP
          annotons:
          - id: pi3k_branch_recruitment
            label: PI3K recruitment at the cytokine receptor
            participant: {}
      - node:
          id: alt_stat_inputs
          label: RTK / Src / GPCR inputs into STATs
          module_type: REGULATORY_STEP
          annotons:
          - id: rtk_src_stat_input
            label: RTK/Src tyrosine phosphorylation of STATs
            participant: {}
  connections:
  - source: ligand_receptor_engagement
    target: jak_activation
    connection_type: PROVIDES_INPUT_FOR
  - source: jak_activation
    target: receptor_phosphorylation
    connection_type: PRECEDES
  - source: receptor_phosphorylation
    target: stat_recruitment_phosphorylation
    connection_type: PROVIDES_INPUT_FOR
  - source: stat_recruitment_phosphorylation
    target: stat_dimerization_import
    connection_type: PRECEDES
  - source: stat_dimerization_import
    target: stat_transcription
    connection_type: PROVIDES_INPUT_FOR
  - source: ptp_dephosphorylation
    target: jak_activation
    connection_type: NEGATIVELY_REGULATES
  - source: ptp_dephosphorylation
    target: stat_transcription
    connection_type: NEGATIVELY_REGULATES
  - source: pias_restraint
    target: stat_transcription
    connection_type: NEGATIVELY_REGULATES
  - source: stat_transcription
    target: socs_feedback
    connection_type: CAUSES
  - source: socs_feedback
    target: jak_activation
    connection_type: NEGATIVELY_REGULATES
  - source: receptor_phosphorylation
    target: mapk_branch_interface
    connection_type: PROVIDES_INPUT_FOR
  - source: receptor_phosphorylation
    target: pi3k_branch_interface
    connection_type: PROVIDES_INPUT_FOR
  - source: mapk_branch_interface
    target: stat_transcription
    connection_type: POSITIVELY_REGULATES
  - source: alt_stat_inputs
    target: stat_recruitment_phosphorylation
    connection_type: PROVIDES_INPUT_FOR
executable_models:
- id: jak_stat_signaling_boolean
  model_type: BOOLEAN
  derivation: DERIVED_FROM_MODULE
  scenarios:
  - id: unstimulated
    label: No cytokine
    description: No ligand engagement; the pathway rests with every step off.
    settings:
    - element: ligand_receptor_engagement
      active: false
    - element: ptp_dephosphorylation
      active: false
    - element: pias_restraint
      active: false
    - element: alt_stat_inputs
      active: false
    expected_attractor_kind: FIXED_POINT
    expected_attractor_count: 1
    expected_inactive:
    - jak_activation
    - stat_transcription
  - id: sustained_cytokine
    label: Sustained cytokine
    description: 'Ligand engagement held on. STAT-driven transcription induces SOCS,
      which inhibits JAK, so there is no steady state with STAT transcription on:
      the single attractor is cyclic, which in a Boolean model reads as a transient
      (pulsed or adapting) response rather than literal oscillation.'
    settings:
    - element: ligand_receptor_engagement
      active: true
    - element: ptp_dephosphorylation
      active: false
    - element: pias_restraint
      active: false
    - element: alt_stat_inputs
      active: false
    expected_attractor_kind: CYCLIC
    expected_attractor_count: 1
    expected_oscillating:
    - jak_activation
    - stat_transcription
    - socs_feedback
    evidence:
    - source_id: PMID:9202125
      statement: SOCS genes are cytokine-induced and proposed to act in a classic
        negative feedback loop on cytokine signalling.
      supporting_text: Transcription of all four SOCS genes is increased rapidly in
        response to interleukin-6, in vitro and in vivo, suggesting they may act in
        a classic negative feedback loop to regulate cytokine signal transduction.
  - id: socs_lost
    label: SOCS knocked out
    description: 'SOCS held off under sustained cytokine. With nothing else wired
      to terminate JAK, the pathway locks on with STAT transcription sustained: in
      this module SOCS is the only loop that makes the response transient.'
    settings:
    - element: ligand_receptor_engagement
      active: true
    - element: ptp_dephosphorylation
      active: false
    - element: pias_restraint
      active: false
    - element: alt_stat_inputs
      active: false
    - element: socs_feedback
      active: false
    expected_attractor_kind: FIXED_POINT
    expected_attractor_count: 1
    expected_active:
    - jak_activation
    - stat_transcription
    evidence:
    - source_id: PMID:9202125
      statement: SOCS-1 inhibits receptor phosphorylation and STAT activation.
      supporting_text: Expression of SOCS-1 inhibited both interleukin-6-induced receptor
        phosphorylation and STAT activation.
  - id: jak_inhibited
    label: JAK inhibited
    description: JAK held off, as by a JAK inhibitor. Receptor and STAT phosphorylation
      cannot occur and STAT transcription stays off.
    settings:
    - element: ligand_receptor_engagement
      active: true
    - element: ptp_dephosphorylation
      active: false
    - element: pias_restraint
      active: false
    - element: alt_stat_inputs
      active: false
    - element: jak_activation
      active: false
    expected_attractor_kind: FIXED_POINT
    expected_attractor_count: 1
    expected_inactive:
    - receptor_phosphorylation
    - stat_transcription
  - id: pias_restraint
    label: PIAS active
    description: PIAS held on under sustained cytokine. STATs are still activated
      and imported, but nuclear transcription is blocked; because SOCS is then never
      induced, JAK stays on. The nuclear brake stops the output without terminating
      the upstream signal.
    settings:
    - element: ligand_receptor_engagement
      active: true
    - element: ptp_dephosphorylation
      active: false
    - element: pias_restraint
      active: true
    - element: alt_stat_inputs
      active: false
    expected_attractor_kind: FIXED_POINT
    expected_attractor_count: 1
    expected_active:
    - jak_activation
    - stat_dimerization_import
    expected_inactive:
    - stat_transcription
    - socs_feedback
  - id: jak_independent_input
    label: JAK-independent STAT input
    description: No cytokine, but STATs phosphorylated by a JAK-independent kinase
      (RTK, Src). STAT transcription comes on and induces SOCS, but SOCS acts only
      on JAK, so in this wiring it cannot terminate the response. A property of the
      module's wiring, not a curated biological claim.
    settings:
    - element: ligand_receptor_engagement
      active: false
    - element: ptp_dephosphorylation
      active: false
    - element: pias_restraint
      active: false
    - element: alt_stat_inputs
      active: true
    expected_attractor_kind: FIXED_POINT
    expected_attractor_count: 1
    expected_active:
    - stat_transcription
    - socs_feedback
    expected_inactive:
    - jak_activation
