# Synthetic: mutual inhibition with no inputs. Two fixed points (bistability);
# forcing one side on leaves one.
id: MODULE:conformance_toggle_switch
module:
  id: toggle
  label: Toggle switch
  parts:
  - node: {id: left, label: Left repressor}
  - node: {id: right, label: Right repressor}
  connections:
  - {source: left, target: right, connection_type: NEGATIVELY_REGULATES}
  - {source: right, target: left, connection_type: NEGATIVELY_REGULATES}
executable_models:
- id: toggle_boolean
  model_type: BOOLEAN
  derivation: DERIVED_FROM_MODULE
  scenarios:
  - id: free
    expected_attractor_kind: FIXED_POINT
    expected_attractor_count: 2
  - id: left_forced_on
    settings: [{element: left, active: true}]
    expected_attractor_count: 1
    expected_inactive: [right]
