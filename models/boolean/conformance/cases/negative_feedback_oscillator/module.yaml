# Synthetic: a kinase that induces its own inhibitor. Sustained input gives a
# cyclic attractor; removing the feedback connection gives a fixed point.
id: MODULE:conformance_negative_feedback_oscillator
module:
  id: loop
  label: Negative feedback loop
  parts:
  - node: {id: stimulus, label: Stimulus}
  - node: {id: kinase, label: Kinase}
  - node: {id: inhibitor, label: Induced inhibitor}
  connections:
  - {source: stimulus, target: kinase, connection_type: CAUSES}
  - {source: kinase, target: inhibitor, connection_type: CAUSES}
  - {source: inhibitor, target: kinase, connection_type: NEGATIVELY_REGULATES}
executable_models:
- id: loop_boolean
  model_type: BOOLEAN
  derivation: DERIVED_FROM_MODULE
  scenarios:
  - id: sustained
    settings: [{element: stimulus, active: true}]
    expected_attractor_kind: CYCLIC
    expected_oscillating: [kinase, inhibitor]
  - id: rest
    settings: [{element: stimulus, active: false}]
    expected_attractor_kind: FIXED_POINT
    expected_inactive: [kinase, inhibitor]
  - id: feedback_cut
    settings: [{element: stimulus, active: true}]
    removed_connections: [{source: inhibitor, target: kinase}]
    expected_attractor_kind: FIXED_POINT
    expected_active: [kinase, inhibitor]
