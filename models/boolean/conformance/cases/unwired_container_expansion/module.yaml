# Synthetic: a container with no internal wiring is normally one lumped step,
# but when one of its children is itself an endpoint (the induced SOCS-like
# tier), it is expanded so the container does not double as a variable.
id: MODULE:conformance_unwired_container_expansion
module:
  id: expand
  label: Unwired container expansion
  parts:
  - node: {id: cytokine, label: Cytokine}
  - node: {id: jak, label: JAK}
  - node: {id: stat, label: STAT}
  - node:
      id: negative_regulation
      label: Negative regulation
      parts:
      - node: {id: socs, label: SOCS}
      - node: {id: ptp, label: Phosphatase}
  - node:
      id: lumped_output
      label: Lumped output
      parts:
      - node: {id: output_a, label: Output A}
      - node: {id: output_b, label: Output B}
  connections:
  - {source: cytokine, target: jak, connection_type: CAUSES}
  - {source: jak, target: stat, connection_type: CAUSES}
  - {source: stat, target: socs, connection_type: CAUSES}
  - {source: negative_regulation, target: jak, connection_type: NEGATIVELY_REGULATES}
  - {source: stat, target: lumped_output, connection_type: CAUSES}
