# Reviewed bridge between BBM-070 (Grieco 2013 MAPK cancer cell fate model,
# PMID:24250280) variables and curated module element ids. Symbols are a shared
# namespace: each side lists the ids that collapse onto a symbol.
#
# This is curation knowledge, not lexical matching:
#   - the module's family-level tiers (RAF kinases, MEK1/2, ERK1/2) map to the
#     model's lumped variables (v_RAF, v_MEK1_2, v_ERK);
#   - the module's single "ERK effector output" step maps to the model's RSK and
#     ELK1 nodes (both direct ERK substrates); MSK is left unmapped because in the
#     model it is also driven by p38, which would inject a spurious p38 -> ERK_OUTPUT
#     edge into the comparison;
#   - the module's stress-activated MAP3K tiers (p38 and JNK cascades) both map to
#     the model's stress MAP3Ks (TAK1, TAOK, MTK1, MAP3K1_3); the model has no MAP2K
#     tier for p38/JNK (MAP3K -> p38 directly), a tier compression the diff reports
#     as a collapsed path rather than a disagreement;
#   - the model's receptors (EGFR, FGFR3, FRS2, TGFBR) and the PI3K/AKT/p53 branch
#     are deliberately unmapped: the ERK module starts at adaptor recruitment.
source: https://github.com/sybila/biodivine-boolean-models (model 070)
publication: PMID:24250280
modules:
  erk_cascade:
    GRB2: adaptor_recruitment
    SOS: ras_gef_step
    RAS: ras_active
    RASGAP: rasgap_step
    RAF: raf_map3k
    MEK: mek_map2k
    ERK: erk_mapk
    ERK_OUTPUT: erk_output
    DUSP: mapk_negative_regulation
  p38_cascade:
    STRESS: stress_input
    STRESS_MAP3K: p38_map3k
    MKK36: p38_map2k
    P38: p38_mapk
    P38_OUTPUT: p38_output
    DUSP: p38_negative_regulation
  jnk_cascade:
    STRESS: stress_input
    STRESS_MAP3K: jnk_map3k
    MKK47: jnk_map2k
    JNK: jnk_mapk
    JNK_OUTPUT: jnk_output
    DUSP: jnk_negative_regulation
external:
  GRB2: v_GRB2
  SOS: v_SOS
  RAS: v_RAS
  RAF: v_RAF
  MEK: v_MEK1_2
  ERK: v_ERK
  ERK_OUTPUT: [v_RSK, v_ELK1]
  DUSP: v_DUSP1
  STRESS_MAP3K: [v_TAK1, v_TAOK, v_MTK1, v_MAP3K1_3]
  P38: v_p38
  JNK: v_JNK
  P38_OUTPUT: [v_ATF2, v_MAX]
  JNK_OUTPUT: v_JUN
notes: |
  v_RASGAP has no counterpart in the model (no GAP tier); the module's RASGAP -| RAS
  edge is therefore expected to be module-only. v_DUSP1 in the model inhibits p38 and
  JNK but not ERK (the model has no ERK phosphatase), so the module's DUSP -| ERK edge
  is expected to be module-only while DUSP -| P38 and DUSP -| JNK should agree.
  v_ELK1 is also activated by JNK and p38 in the model; those become JNK -> ERK_OUTPUT
  and P38 -> ERK_OUTPUT model-only edges, an artefact of lumping ELK1 under ERK output.
  The module asserts two SOS feedbacks, ERK -| SOS (direct ERK phosphorylation,
  PMID:8816480) and ERK_OUTPUT -| SOS (RSK, PMID:22827337). The model carries only
  the RSK route (v_SOS, v_GRB2 & !v_RSK), so ERK_OUTPUT -| SOS agrees and the direct
  ERK -| SOS edge is expected to be module-only.
