  notes: >-
    Each set carries one taxon condition that goes with its signature (Chordata, Bacteria, Eukaryota,
    Viridiplantae, Fungi, Metazoa, Pseudomonadati, Mammalia). The comment names a reaction step and Swiss-Prot
    gives it to arginases of organisms without a complete urea cycle, so the taxa are not a statement
    about where the cycle exists.
