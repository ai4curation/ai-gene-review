review_summary: >-
  Accuracy: all nine live condition sets were checked against Swiss-Prot on 2026-11-09. Every reviewed
  match of every set carries the pathway comment (16, 13, 9, 8, 6, 6, 6, 4 and 3 entries for sets 1 to
  9). TrEMBL matches were counted but not inspected. Meaning and parsimony: sets 1 to 8 select one unit,
  the arginases, for which the arginase step of the urea cycle is the right comment. Set 9 selects a different
  unit. Its three mammalian Swiss-Prot matches are AGMAT orthologues (human Q9BSE5), which Swiss-Prot
  names guanidino acid hydrolase; the record says the enzyme prefers taurocyamine and guanidino propanoic
  and butanoic acids and "Metabolizes L-arginine with low efficiency", and its pathway comment is a curator
  inference (ECO:0000305). The comment is therefore true of set 9 only through a weak side activity, and
  a rule that propagates it to 174 UniProtKB entries presents a guanidino acid hydrolase as a urea-cycle
  arginase. Among the arginase sets, sets 3 and 8 have no reviewed match outside set 2 and sets 4 and
  7 none outside set 1, which is mild redundancy.
action: MODIFY
action_rationale: >-
  The comment is accurate for sets 1 to 8 and those sets describe one enzyme family. Set 9 should be dropped:
  it extends an arginase pathway step to the AGMAT family on the strength of a low-efficiency activity
  that the curated record itself separates from the enzyme's function. Confidence is moderate because
  Swiss-Prot does carry the comment on the three AGMAT entries, so the question is one of meaning, not
  of a wrong annotation.
suggested_modifications:
- >-
  Drop set 9 (FunFam 3.40.800.10:FF:000002 AND Mammalia). Its reviewed matches are AGMAT orthologues (Q9BSE5,
  A2AS89, Q0D2L3), guanidino acid hydrolases whose arginase activity is a low-efficiency side reaction.
biological_meaning:
  assessment: HETEROGENEOUS
  notes: >-
    Two units. Arginases (sets 1 to 8) fit the consequent. The AGMAT guanidino acid hydrolases (set 9)
    fit it only by a pathway comment inferred from a low-efficiency activity. The consequent is a pathway
    comment, so rule_redundancy.tsv has no row for this rule.
  sets_examined_for_meaning: 9
