corrections:
- date: '2026-11-10'
  withdrawn_claim: The rule inappropriately conflates arginase (EC 3.5.3.1) with agmatinase (EC 3.5.3.11).
  correction: The claim rested on the label of FunFam 3.40.800.10:FF:000002. Its mammalian Swiss-Prot members are
    AGMAT, which Swiss-Prot curates with arginase activity and with the same urea-cycle pathway comment the rule
    assigns.
  error_type: REFUTED_BY_CURATED_ANNOTATION
  evidence:
  - 'UniProtKB Q9BSE5 (AGMAT_HUMAN): AltName Arginase, mitochondrial, EC 3.5.3.1 {ECO:0000269|PubMed:36543883};
    CC PATHWAY Nitrogen metabolism; urea cycle; L-ornithine and urea from L-arginine'
  - UniProtKB Q9BSE5 DR FunFam 3.40.800.10:FF:000002; Agmatinase
  - 'Swiss-Prot matches of CS9 (FunFam 3.40.800.10:FF:000002 AND Mammalia): 3, all with the pathway comment'
- date: '2026-11-10'
  withdrawn_claim: The rule should be deprecated because it provides no GO term annotations.
  correction: The rule assigns a pathway comment, which the earlier review itself judged accurate. Not emitting
    GO terms is not a reason to retire a correct rule.
  error_type: OTHER
  evidence:
  - 'Live rule annotation: commentType PATHWAY'
  - 'All 9 sets: every Swiss-Prot match carries the comment'
- date: '2026-11-10'
  withdrawn_claim: GO:0052689 (carboxylic acid dimethylamide hydrolase activity) is the molecular function term
    for agmatinase.
  correction: GO:0052689 is carboxylic ester hydrolase activity. Agmatinase activity is GO:0008783.
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
  - 'QuickGO GO:0052689: carboxylic ester hydrolase activity'
  - 'QuickGO GO:0008783: agmatinase activity'
- date: '2026-11-10'
  withdrawn_claim: Nested InterPro terms in condition set 1 (IPR014033 within IPR006035 within IPR023696) create
    redundancy that is a design flaw.
  correction: Nested conjuncts leave the matched set equal to that of the narrowest term and cannot cause a wrong
    annotation. The live set 1 is IPR006035 AND IPR014033 AND Chordata.
  error_type: CONJUNCTION_IGNORED
  evidence:
  - 'Live rule CS1 (2026-11-09): IPR006035 (Ureohydrolase) AND IPR014033 (Arginase) AND Chordata; 16 Swiss-Prot
    matches, 16 with the pathway comment'
- date: '2026-11-10'
  withdrawn_claim: The taxonomic restrictions are inconsistent and poorly justified, and some FunFam sets have no
    taxon restriction.
  correction: Every live set has a taxon condition, and different signatures having different taxon scopes is not
    an inconsistency.
  error_type: TAXON_MISREAD
  evidence:
  - 'Live rule (2026-11-09): 9 condition sets, each with one taxon condition'
