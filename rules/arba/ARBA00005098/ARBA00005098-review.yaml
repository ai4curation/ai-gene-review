parsimony:
  assessment: ACCEPTABLE
  notes: >-
    Nine sets, 44 distinct reviewed matches. Sets 3 and 8 have no reviewed match outside set 2, and sets
    4 and 7 none outside set 1; these were compared on reviewed entries only, so they may still reach
    unreviewed entries the larger sets miss. A single condition on IPR014033 (Arginase) would not replace
    the rule: six reviewed plant arginases matched by set 5 lack it, and nine of its 44 reviewed members
    are outside sets 1 to 8.
