review_summary: All nine live condition sets were checked against Swiss-Prot. Every reviewed match of every set
  carries the pathway comment (16, 13, 9, 8, 6, 6, 6, 4 and 3 entries for sets 1 to 9). Set 9 uses a FunFam whose
  CATH label is "Agmatinase", but its three mammalian Swiss-Prot members are AGMAT orthologues (human Q9BSE5, mouse
  A2AS89, rat Q0D2L3), which Swiss-Prot curates as guanidino acid hydrolase with arginase activity (EC 3.5.3.1,
  PubMed:36543883) and with this pathway comment. Checked against Swiss-Prot by UniProtKB query on 2026-11-09; TrEMBL
  matches were counted but not inspected.
