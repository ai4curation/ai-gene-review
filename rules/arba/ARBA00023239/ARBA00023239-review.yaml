review_summary: >-
  Accuracy: every one of the 908 live condition sets was put through one check in this pass, namely whether
  its Swiss-Prot matches carry the keyword (UniProtKB queries, November 2026); 31 sets were also read
  in detail and are recorded. All 908 sets match Swiss-Prot entries (2 at least, median 10). In 907 sets
  every Swiss-Prot match carries KW-0456 Lyase; summed over sets, 54,395 of 54,396 matches do. The exception
  is set 150, the ACMSD family: 27 of its 28 Swiss-Prot matches are decarboxylases or hydratases, and
  the 28th, A6KWY3 (LGAB_PHOV8), is an experimentally characterised L-galactono-1,5-lactonase (EC 3.1.1.126),
  a hydrolase. The rule gives the keyword to TrEMBL copies of that enzyme: I8ZCI2, identical to A6KWY3
  over all 308 residues, carries Lyase with ARBA00023239 as its source. Meaning and parsimony: the keyword
  names EC class 4, and the sets select lyase families: in the 30-set sample the reviewed matches are
  carbon-carbon lyases (12 sets), carbon-oxygen lyases (12) and other EC 4 subclasses (6). That is the
  level at which the keyword exists, so the rule is coherent. No set is empty and none duplicates or contains
  another.
action: MODIFY
action_rationale: >-
  The rule does what its label says for 907 of 908 sets on reviewed evidence, and its size is the size
  of the enzyme class. The one defect found is specific: set 150 takes in a lactonase subfamily of the
  ACMSD family and labels it Lyase. The set should be tightened; the rest stands. Confidence is limited
  because the check on the other 907 sets is the reviewed entries' own keyword, not an inspection of the
  TrEMBL entries the rule annotates.
confidence: 0.7
suggested_modifications:
- >-
  Tighten set 150 (IPR006680 AND IPR032465 AND IPR032466) so that it no longer matches the L-galactono-1,5-lactonase
  subfamily, for example by adding NOT FunFam 3.20.20.140:FF:000136 (5 UniProtKB entries, including A6KWY3
  and its identical TrEMBL copy I8ZCI2) and reviewing PANTHER subfamily PTHR21240:SF19 (5,644 entries,
  of which A6KWY3 is the only reviewed one and 5,596 carry the keyword).
- >-
  Remove the Lyase keyword from I8ZCI2, Q8A1P4, R9I5S5 and I9QZD0, the four TrEMBL entries of FunFam 3.20.20.140:FF:000136
  that carry it with ARBA00023239 as source.
biological_meaning:
  assessment: COHERENT
  notes: >-
    A keyword rule: the consequent is an enzyme class, and the question is whether the sets select members
    of that class. In a sample of 30 sets (drawn with a seeded pseudo-random generator, Python random.Random(rule
    id).sample over the live set numbers) every set selects a lyase family, and across all 908 sets the
    reviewed matches carry the keyword in all but one protein. UniProt has more specific keywords under
    Lyase (for example Decarboxylase), but they are assigned alongside it, not in its place, so the class-level
    keyword is not an umbrella that hides a better label. projects/ARBA_REVIEW/rule_redundancy.tsv covers
    GO rules only and has no row for this rule.
  sets_examined_for_meaning: 31
