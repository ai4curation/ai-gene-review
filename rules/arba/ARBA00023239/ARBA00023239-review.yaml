    ARBA00089180)'
- date: '2026-11-10'
  withdrawn_claim: 894 condition sets is 75 times the limit of 12 and a fatal design flaw; the rule should
    be deprecated.
  correction: The limit of 12 is the default of this repository's overlap-analysis tool. The number of
    alternative sets is not evidence that any of them is wrong.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'src/ai_gene_review/etl/rule_analysis.py: max_condition_sets: int = 12 (default of the overlap-analysis
    tool)'
- date: '2026-11-10'
  withdrawn_claim: Basic inspection reveals many redundant condition sets.
  correction: The review recorded no condition sets, so no inspection result can be checked.
