annotation_assessments:
- annotation_kind: KEYWORD
  value: KW-0456
  label: Lyase
  assessment: PARTIALLY_CORRECT
  matched_protein_count: 2276972
  correct_examples:
  - Q8TDX5
  - Q60FX6
  incorrect_examples:
  - I8ZCI2
  notes: >-
    All 908 sets: 54,395 of 54,396 Swiss-Prot matches (summed over sets) carry the keyword. Set 150 is
    the exception. I8ZCI2 is a TrEMBL entry identical in sequence to A6KWY3 (L-galactono-1,5-lactonase,
    EC 3.1.1.126, a hydrolase with experimental evidence, PubMed:24963813) and carries KW Lyase {ECO:0000256|ARBA:ARBA00023239}.
    matched_protein_count is the TrEMBL count UniProt reports for the rule.
corrections:
- date: '2026-11-10'
  withdrawn_claim: More than 2.5 million matched proteins with zero reviewed entries shows the rule 
    captures everything lyase-related without discrimination.
  correction: UniProt reports reviewedProteinCount 0 for ARBA rules in general, so the zero carries 
    no information about this rule.
  error_type: OTHER
  evidence:
  - 'rest.uniprot.org/arba statistics, 2026-11-09: reviewedProteinCount is 0 for all 14 live rules fetched
    for this batch (ARBA00001096, ARBA00023002, ARBA00023239, ARBA00026572, ARBA00026647, ARBA00026698,
    ARBA00027169, ARBA00027651, ARBA00028334, ARBA00047230, ARBA00047239, ARBA00067001, ARBA00085883,
    ARBA00089180)'
- date: '2026-11-10'
  withdrawn_claim: 894 condition sets is 75 times the limit of 12 and a fatal design flaw; the rule 
    should be deprecated.
  correction: The limit of 12 is the default of this repository's overlap-analysis tool. The number 
    of alternative sets is not evidence that any of them is wrong.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'src/ai_gene_review/etl/rule_analysis.py: max_condition_sets: int = 12 (default of the overlap-analysis
    tool)'
- date: '2026-11-10'
  withdrawn_claim: Basic inspection reveals many redundant condition sets.
  correction: The review recorded no condition sets, so no inspection result can be checked.
  error_type: UNEXAMINED_RULE
  evidence:
  - 'Old review: rule.condition_sets empty'
- date: '2026-11-10'
  withdrawn_claim: The keyword "Lyase" is too generic, so the rule should be deprecated.
  correction: A correct general keyword is not a wrong annotation.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - 'rest.uniprot.org/arba/ARBA00023239 annotations: keyword KW-0456 Lyase'
- date: '2026-11-10'
  withdrawn_claim: geneontology/go-annotation issue 6035 documents pipeline performance problems 
    caused by this rule.
  correction: The issue could not be retrieved and checked, and performance is not a question of 
    annotation correctness.
  error_type: UNSUPPORTED_SOURCE
  evidence:
  - Issue not accessible from this review environment (2026-11-09)
- date: '2026-11-12'
  withdrawn_claim: >-
    None of the 908 condition sets has been examined, no protein wrongly given the keyword has been identified,
    and the review is open.
  correction: >-
    All 908 sets were checked against the keywords of their Swiss-Prot matches and 31 were read in detail.
    The rule is a coherent class-level keyword rule with no idle or duplicated sets, and one set (150)
    gives the keyword to a lactonase subfamily; a wrongly annotated TrEMBL entry is named.
  error_type: MEANING_NOT_JUDGED
  evidence:
  - >-
    UniProtKB queries per set, (set conditions) AND (reviewed:true) with and without (keyword:KW-0456),
    November 2026: 908 sets, 54,396 matches, 54,395 with the keyword
  - >-
    UniProtKB A6KWY3 (LGAB_PHOV8): EC 3.1.1.126, ECO:0000269 PubMed:24963813; keywords Carbohydrate metabolism,
    Galactose metabolism, Hydrolase
  - >-
    UniProtKB I8ZCI2 (I8ZCI2_PHOVU): KW Lyase {ECO:0000256|ARBA:ARBA00023239}; sequence identical to A6KWY3
    (308 of 308 residues)
  - >-
    UniProtKB query (xref:interpro-IPR006680) AND (xref:interpro-IPR032465) AND (xref:interpro-IPR032466)
    AND (xref:funfam-3.20.20.140:FF:000136) AND (keyword:KW-0456) AND (source:ARBA00023239): 4 entries
parsimony:
  assessment: ACCEPTABLE
  notes: >-
    908 alternative sets: 599 with one signature, 143 with two, 166 with three; 200 carry a taxon. Comparing
    every pair of sets in the live rule, none is a duplicate of another and none contains another's signatures
    with the same or no taxon (0 of 908), and every set matches at least 2 Swiss-Prot entries, so no set
    is idle. The number of sets reflects the number of lyase families. This is not a GO rule, so rule_redundancy.tsv
    and InterPro2GO do not apply.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    708 of 908 sets have no taxon. Seven of the 30 sampled sets carry one (Viridiplantae, Mycobacterium
    tuberculosis complex, Rhodopseudomonas, Rickettsiales, Magnoliopsida, Amoebozoa, Vibrio); in each,
    every Swiss-Prot match in the taxon carries the keyword. Narrow taxa such as a single genus limit
    coverage and were not found to cause a wrong keyword. Taxon scope was judged on the sample only.
