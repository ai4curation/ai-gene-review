review_summary: >-
  Accuracy: the first pass examined no condition set. Fourteen of the 1340 served sets were drawn at random
  (Python random.sample, seed 4, over set numbers) and checked against curated annotations of their Swiss-Prot
  members; in every one a reviewed member carries a curated descendant of GO:0016740 (transferase activity),
  so the annotation is true for the sample and no false positive was found. The other 1326 sets were not
  checked. Meaning and parsimony: the term is the root of all transferase activities and says nothing
  about a protein whose reaction is known. The fourteen sets resolve into fourteen unrelated families
  (phage polymerases, plant UDP-glycosyltransferases, arginine kinase, malate synthase, sulfotransferases,
  histone acetyltransferases, protein kinases, aminotransferases, prenyl diphosphate synthases and others),
  each with its own curated activity term. rule_redundancy.tsv finds 1013 of 1340 sets already matched
  by a rule asserting a more specific term, so three quarters of the rule emits nothing.
action: SPLIT
action_rationale: >-
  A random sample gives the same answer in fourteen of fourteen sets: the unit has a specific curated
  activity and the umbrella term adds nothing to it. Most of the rule is already duplicated by rules for
  more specific terms. The remainder should be split toward the activity of each family, not kept under
  the root term.
suggested_modifications:
- >-
  Drop the sets already matched by rules asserting a more specific term (1013 of 1340 in rule_redundancy.tsv;
  covering terms GO:0016772 transferase activity, transferring phosphorus-containing groups, GO:0016755
  aminoacyltransferase activity, GO:0016758 hexosyltransferase activity, GO:0016757 glycosyltransferase
  activity, GO:0016747 acyltransferase activity, transferring groups other than amino-acyl groups). Of
  the fourteen sampled sets these are 41, 137, 185, 212, 318, 593, 622, 812, 823, 1126.
- >-
  Move uncovered sets to the activity of their family; for the sampled ones: set 121 to GO:0008194 (UDP-glycosyltransferase
  activity); set 455 to GO:0004402 (histone acetyltransferase activity); set 484 to GO:0050694 (galactose
  3-O-sulfotransferase activity); set 981 to GO:0004364 (glutathione transferase activity).
- >-
  Where a covering rule asserts only an intermediate term (kinase activity, glycosyltransferase activity),
  prefer the family-specific activity that curated annotation supports, as listed in biological_units.
- >-
  Assign the 1326 sets not examined here to units in the same way; none should stay under the root term
  once its family is identified.
