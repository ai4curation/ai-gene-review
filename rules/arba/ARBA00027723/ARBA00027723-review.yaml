id: ARBA00027723
description: >-
  ARBA rule assigning GO:0016740 transferase activity through 1340 alternative condition sets built
  from InterPro, CATH FunFam, PANTHER and taxon conditions.
status: IN_PROGRESS
rule_type: ARBA
rule:
  rule_id: ARBA00027723
  condition_sets: []
  go_annotations:
  - go_id: GO:0016740
    go_label: transferase activity
    aspect: MF
  entries: []
  reviewed_protein_count: 0
  unreviewed_protein_count: 0
  created_date: '2021-10-20'
  modified_date: '2026-07-18'
  retrieved_date: '2026-11-09'
  source_condition_set_count: 1340
review_summary: >-
  The live rule has 1340 condition sets, 227 of which carry a taxon condition. No condition set was
  examined against annotated proteins, so none is recorded here and no verdict is given. The term
  is the general parent of all transferase activities; that makes the annotation uninformative where
  a specific activity is known, not wrong.
action: UNDECIDED
action_rationale: None of the 1340 condition sets was examined, and no wrongly annotated protein is
  known.
suggested_modifications:
- >-
  Examine a sample of condition sets against curated molecular function annotations of their Swiss-Prot
  members.
annotation_assessments:
- annotation_kind: GO_TERM
  value: GO:0016740
  label: transferase activity
  assessment: UNDECIDED
  notes: >-
    No matched protein was checked. IPR000014 (PAS domain) does not occur in any condition set of
    the rule retrieved on 2026-11-09.
corrections:
- date: '2026-11-10'
  withdrawn_claim: The rule erroneously includes the non-transferase PAS domain IPR000014.
  correction: >-
    IPR000014 is not in any of the 1340 live condition sets. Whether an earlier version used it, and
    with which other conditions, could not be checked.
  error_type: STALE_RULE_VERSION
  evidence:
  - 'rest.uniprot.org/arba/ARBA00027723, modified 2026-07-18: no condition with value IPR000014'
- date: '2026-11-10'
  withdrawn_claim: The rule lacks taxonomic restrictions.
  correction: 227 of the 1340 live condition sets carry a taxon condition.
  error_type: TAXON_MISREAD
  evidence:
  - Count over conditionSets of rest.uniprot.org/arba/ARBA00027723, 2026-11-09
- date: '2026-11-10'
  withdrawn_claim: >-
    1094 condition sets exceed a limit of 12 by two orders of magnitude, so the rule should be deprecated.
  correction: Rule size is not evidence about correctness.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - No protein-level evidence was given
- date: '2026-11-10'
  withdrawn_claim: GO:0016740 is too broad, so the rule should be deprecated.
  correction: A general term that is true of the matched proteins is not an error.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - GO:0016740 transferase activity is the parent of all EC 2 activities
- date: '2026-11-10'
  withdrawn_claim: Condition overlap is complete.
  correction: No overlap was measured; the assessment is removed.
  error_type: UNEXAMINED_RULE
  evidence:
  - 'Previous file recorded condition_sets: []'
