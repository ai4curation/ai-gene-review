parsimony:
  assessment: OVERLY_COMPLEX
  notes: >-
    rule_redundancy.tsv: 1013 of 1340 sets are matched by a rule asserting a more specific term (most
    often by rules for phosphotransferase, kinase, acyltransferase and glycosyltransferase terms). Of
    the 14 sampled sets, 10 are covered. QuickGO lists 118745 annotations attributed to the rule, which
    come from the uncovered sets. Each signature is used in one set; no single InterPro2GO mapping could
    replace a rule over unrelated families.
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    GO:0016740 (transferase activity) has 2172 descendants. Every sampled unit has a curated descendant
    several levels more specific, e.g. GO:0004474 (malate synthase activity), GO:0046316 (gluconokinase
    activity), GO:0050694 (galactose 3-O-sulfotransferase activity).
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    227 of 1340 sets carry a taxon condition. In the sample the restrictions fit the family (Uroviricota
    for phage polymerases, Ecdysozoa for arginine kinase, Rhabditida for a nematode GST FunFam, Gentianales
    for a plant UGT family); Gentianales and Ascomycota (MYST acetyltransferases) are narrower than the
    families, which is narrow coverage, not wrong annotation.
