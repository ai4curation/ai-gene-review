corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule uses IPR001096 for papain-type cysteine proteases, IPR003675 for subtilisin-type serine
    proteases and IPR001915 for aminopeptidase-type metalloproteases.
  correction: >-
    All three identifiers were given the names of other families. IPR001096 is Peptidase C13, legumain;
    IPR003675 is the CAAX prenyl protease 2/Lysostaphin resistance protein A-like domain; IPR001915
    is Peptidase M48. None is an aminopeptidase family, and aminopeptidases would not be endopeptidases.
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
  - >-
    InterPro API: IPR001096 name Peptidase C13, legumain; IPR003675 name CAAX prenyl protease 2/Lysostaphin
    resistance protein A-like domain; IPR001915 name Peptidase M48.
- date: '2026-11-10'
  withdrawn_claim: The GO term is biologically correct for all covered proteins.
  correction: >-
    The condition sets had not been recorded and the families were misidentified, so this had not
    been checked. It holds for reviewed matches by count, with the reservation on set 14.
  error_type: UNEXAMINED_RULE
  evidence:
  - The old file recorded condition_sets as an empty list.
  - >-
    UniProtKB release 2026_04: 30 of the 40 reviewed matches of set 14 have no manual annotation to
    GO:0004175 or a descendant.
- date: '2026-11-10'
  withdrawn_claim: >-
    More specific terms should be used: GO:0004194 for aspartic proteases, GO:0008234 for cysteine
    proteases and GO:0008237 for metalloproteases.
  correction: >-
