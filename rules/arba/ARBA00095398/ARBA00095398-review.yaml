  retrieved_date: '2026-11-09'
review_summary: >-
  The rule has one condition set and it was examined. Its Swiss-Prot matches are S. cerevisiae RPL12A
  (P0CX53) and RPL12B (P0CX54) and C. albicans RPL12 (Q5AJF7). SGD annotates both S. cerevisiae proteins
  to ribophagy by IGI from PMID:39934334, "Rpl12 is a conserved ribophagy receptor", with the qualifier
  acts_upstream_of_or_within. The C. albicans protein has no curated ribophagy annotation, and the 159
  unreviewed matches across Saccharomycotina rest on transfer from the two S. cerevisiae paralogs.
action: ACCEPT
action_rationale: >-
  The only condition set identifies uL11 in budding yeasts, and the two reviewed S. cerevisiae members
  carry an experimental annotation to the exact term. Confidence is moderate because the support is a
  single paper and one species, and the curated qualifier is acts_upstream_of_or_within rather than involved_in.
literature_support:
  assessment: MODERATE
  notes: >-
    One primary paper, PMID:39934334 (Nat Cell Biol 2025), is the source of the SGD IGI annotations of
    P0CX53 and P0CX54 to GO:0034517. The paper is not in the local publication cache, so no quotation
    is given.
annotation_assessments:
- annotation_kind: GO_TERM
  value: GO:0034517
  label: ribophagy
  assessment: CORRECT
  correct_examples:
