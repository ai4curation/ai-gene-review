review_summary: >-
  Accuracy: the rule has one condition set, the two 60S ribosomal protein L12 (uL11) CATH FunFams in Saccharomycotina.
  Its Swiss-Prot matches are S. cerevisiae RPL12A (P0CX53) and RPL12B (P0CX54) and C. albicans RPL12 (Q5AJF7).
  SGD annotates both S. cerevisiae proteins to GO:0034517 (ribophagy) by IGI from PMID:39934334, with
  the qualifier acts_upstream_of_or_within; the 159 unreviewed matches rest on transfer from those two
  paralogs. Meaning and parsimony: the set selects one unit, ribosomal protein uL11 of budding yeasts,
  and the consequent is the specific, experimentally shown role of that protein as a ribophagy receptor.
  GO:0034517 has no descendants and no other ARBA rule covers the set; QuickGO holds 162 annotations from
  this rule. The two FunFams are the two domains of one protein and the set carries no idle condition.
action: ACCEPT
action_rationale: >-
  One unit, one specific term with direct experimental support on the unit, and a minimal condition set
  that emits annotations no other rule provides. Confidence is moderate because the support is a single
  paper in one species, the curated qualifier is acts_upstream_of_or_within, and the taxon is narrower
  than the paper's claim of conservation.
