review_summary: >-
  Accuracy: all 131 live condition sets have now been examined (UniProtKB and QuickGO queries, November
  2026). Every set matches Swiss-Prot entries with manual annotation to GO:0010629 (negative regulation
  of gene expression) or a descendant, from an experiment in 130 sets (set 82, the nematode scavenger
  decapping enzyme, has non-experimental manual evidence only). No wrongly annotated protein was identified,
  and the false positive alleged earlier (ESA1, set 106) is not one. Meaning and parsimony: the rule is
  an umbrella over unrelated machineries that each have their own child term: epigenetic silencing and
  heterochromatin (33 sets), mRNA decay and destabilization (36), small-RNA silencing (28), negative regulators
  of cytokine production (12), translational repressors (9), transposable element silencing (3) and splicing
  repressors (2). Rules for those child terms exist and match 52 of the 131 sets exactly. A tail of eight
  sets rests on phenotype-style annotations to the consequent itself, or to a distant descendant, on proteins
  that have nothing in common (mycobacterial resuscitation-promoting factors, MAP2K1 and MAP2K2 in rat,
  yeast PAK kinases, PLA2G3, SMAD2, HEY repressors, PAI-1).
action: SPLIT
action_rationale: >-
  For 123 of the 131 sets a more specific curated term names the mechanism, and for 52 of them a rule
  asserting such a term already uses the same condition set, so the parent rule adds nothing there. The
  rule should be split along the mechanisms, and the eight sets where 'negative regulation of gene expression'
  records an observed effect on some gene's expression, not a function of the family, should be judged
  one by one.
confidence: 0.8
