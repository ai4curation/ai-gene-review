parsimony:
  assessment: REDUNDANT
  notes: >-
    Fifty-two of 131 sets are matched exactly (same signatures, same or no taxon) by a rule for a descendant
    term, chiefly ARBA00027536 (GO:0031047 (regulatory ncRNA-mediated gene silencing), 16 sets), ARBA00033599
    (GO:0045814 (negative regulation of gene expression, epigenetic), 15) and ARBA00027180 (GO:0006402
    (mRNA catabolic process), 13); 105 are matched on signatures when the taxon is allowed to differ,
    and 26 by no descendant rule (rest.uniprot.org/arba search over all 274 descendants of the consequent,
    2026-11-12). No set is empty. Several pairs of sets select the same proteins by different signatures
    (Dicer in sets 1, 18, 19 and 20; SRRT in 11 and 128; DCP2 in 4 and 22).
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    GO:0010629 (negative regulation of gene expression) has 274 descendants. Curated annotation on the
    matched proteins is to its children: GO:0045814 (negative regulation of gene expression, epigenetic)
    tops 33 sets, GO:0006402 (mRNA catabolic process) 32, GO:0031047 (regulatory ncRNA-mediated gene silencing)
    29, GO:0001818 (negative regulation of cytokine production) 11 and GO:0017148 (negative regulation
    of translation) 9.
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    Fifty-nine of 131 sets carry a taxon. Many follow lineage-specific biology (plant RNA-directed DNA
    methylation factors in Embryophyta or Spermatophyta, fission yeast heterochromatin proteins, yeast
    silencing factors in Saccharomycetaceae). Others only reflect the species of the experiment: Mus (sets
    15 and 28), Rattus (61), Homo (41), Hominidae (34), Murinae (59), Muridae (53) for families conserved
    across mammals or wider. Narrow coverage, not wrong annotation.
