review_summary: >-
  Accuracy: both live condition sets were examined. Set 1 matches five primate Swiss-Prot entries, all
  PAK1, PAK2 or PAK3; set 2 matches human CREBBP and EP300. The five human proteins are annotated by Reactome
  (TAS, R-HSA-5621481) to GO:0002223 (stimulatory C-type lectin receptor signaling pathway), a child of
  the rule's term, so the rule does not produce false statements among the proteins it selects, but there
  is no experimental GO evidence for the term on any of them. Meaning and parsimony: the two sets select
  unrelated families (group I p21-activated kinases; the CBP/p300 acetyltransferases) that share the consequent
  only through membership of one Reactome pathway, and GO:1990858 (cellular response to lectin) says nothing
  about what either does. The rule is also dead weight: ARBA00087826 asserts the more specific GO:0002223
  (stimulatory C-type lectin receptor signaling pathway) with the same two condition sets, UniProt keeps
  only the most specific ARBA term, and QuickGO holds no annotation attributed to ARBA00089180 (0, against
  323 for ARBA00087826).
action: DEPRECATE
action_rationale: >-
  Every condition set of the rule is matched, signature for signature and taxon for taxon, by a rule asserting
  a descendant term, so the rule emits nothing and removing it changes no annotation. Replacing the consequent
  with the child term, as first proposed, would only duplicate ARBA00087826.
