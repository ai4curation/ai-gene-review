corrections:
- date: '2026-11-10'
  withdrawn_claim: The rule must be removed because 185 condition sets far exceed a manageable limit
    of 12 and make it impossible to validate.
  correction: 'Set count is not evidence about the annotations, and the rule can be checked set by set:
    this was done for all live sets.'
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'Live rule: 188 condition sets (2026-11-09)'
  - 'Swiss-Prot support per set: 164 fully supported, 24 partly, 0 unsupported, 0 without reviewed matches'
- date: '2026-11-10'
  withdrawn_claim: GO:1901137 is too broad a term, and its breadth creates massive false positive 
    risk.
  correction: A broad term is true of more proteins, not fewer; breadth does not make an annotation 
    wrong.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - 'QuickGO GO:1901137: carbohydrate derivative biosynthetic process, not obsolete'
- date: '2026-11-10'
  withdrawn_claim: Significant overlap and complete subsumption between condition sets is virtually 
    guaranteed.
  correction: No overlap was measured, and the condition sets were not recorded.
  error_type: UNEXAMINED_RULE
  evidence:
  - 'Earlier version of this file: condition_sets empty, protein counts 0'
- date: '2026-11-10'
  withdrawn_claim: Covering bacterial peptidoglycan synthesis and mammalian glycosaminoglycan 
    synthesis under one term is taxonomically inappropriate.
  correction: Both are carbohydrate derivative biosynthesis, so a parent term that covers both is 
    correct for both.
  error_type: TAXON_MISREAD
  evidence:
  - 'Live rule: 94 of 188 sets carry their own taxon condition'
- date: '2026-11-10'
  withdrawn_claim: This is the most complex rule in the ARBA system.
  correction: Other ARBA rules have more condition sets.
  error_type: OTHER
  evidence:
  - 'rest.uniprot.org/arba/ARBA00022722: 538 condition sets; ARBA00027624: 472; ARBA00026480: 343 (2026-11-09)'
- date: '2026-11-12'
  withdrawn_claim: >-
    No verdict can be given because the reviewed matches without independent annotation in 24 partly supported
    sets were not examined individually.
  correction: >-
    The rule-level verdict does not turn on those matches. The consequent is a chemical grouping term
    with 296 descendants; the families the sets select each have a more specific curated term, in unrelated
    pathways; two sets select families whose curated role lies outside the term; and 88 of 191 sets are
    already covered by more specific rules. The rule should be split.
  error_type: MEANING_NOT_JUDGED
  evidence:
  - >-
    projects/ARBA_REVIEW/rule_redundancy.tsv: ARBA00026302 go_descendants 296, condition_sets 191, covered_sets
    88
  - >-
    Q86SR1 GO:0016266 IDA PMID:18562306; Q93063 GO:0015012 IDA PMID:36593275; P16066 GO:0006182 IDA PMID:1672777
  - >-
    P04062 GO:0006680 glucosylceramide catabolic process IDA PMID:16293621 (not a descendant of GO:1901137
    in QuickGO, is_a/part_of)
- date: '2026-11-12'
  withdrawn_claim: >-
    Covering bacterial peptidoglycan synthesis and mammalian glycosaminoglycan synthesis under one term
    is unobjectionable because the parent term is correct for both.
  correction: >-
    Correct, and still not the right level: a parent that is true of unrelated pathways tells the reader
    nothing about any of them. Truth of the umbrella term is the accuracy axis; the informative term for
    each unit is a separate question, answered in biological_units.
  error_type: MEANING_NOT_JUDGED
  evidence:
  - >-
    biological_units of this review: nine units with nine different specific descendants of GO:1901137
parsimony:
  assessment: REDUNDANT
  notes: >-
    rule_redundancy.tsv: 88 of 191 condition sets are matched by a rule asserting a more specific term
    and so emit nothing. The same family enters through several signatures, for example polypeptide N-acetylgalactosaminyltransferases
    in at least nine sets. The other sets do work: QuickGO lists 75875 annotations from the rule. rules/arba/_interpro2go.txt
    maps one InterPro entry, IPR005855 (Glucosamine-fructose-6-phosphate aminotransferase, isomerising),
    to the consequent, so no single-signature mapping would replace the rule.
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    GO:1901137 has 296 is_a/part_of descendants (rule_redundancy.tsv). Nine of eleven units examined carry
    a specific curated descendant, and for the other two the informative term is outside the consequent.
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    94 of 188 sets carry a taxon condition. Many confine a widely conserved family to the clade where
    its curated annotations sit: the GALNT architecture to Primates (set 1), carbohydrate sulfotransferases
    to Homo (set 10), membrane guanylate cyclases to Rattus (sets 13, 105), F1 beta subunits to Rodentia
    (set 87). That is narrow coverage following the training data, not wrong annotation. Restrictions
    such as Pseudomonadati for lipid A enzymes (sets 23, 44) follow the biology.
