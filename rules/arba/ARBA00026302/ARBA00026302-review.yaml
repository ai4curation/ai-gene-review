review_summary: >-
  Accuracy: all 188 live condition sets were queried against Swiss-Prot on 2026-11-09, counting a match
  as supported when it carries GO:1901137 (carbohydrate derivative biosynthetic process) or an is_a/part_of
  descendant with evidence other than ARBA. In 164 sets every reviewed match is supported and in 24 some
  are not; no set is unsupported or without reviewed matches. The partly supported sets were not adjudicated
  match by match. QuickGO lists 75875 annotations attributed to the rule. Meaning and parsimony: the term
  is a chemical grouping, not a process a biologist would recognise. Under it the rule puts protein O-glycosylation
  enzymes, heparan sulfate and hyaluronan synthases, purine nucleotide enzymes, guanylate cyclases, lipid
  A acyltransferases and ATP synthase subunits, each of which carries a specific curated descendant (protein
  O-linked glycosylation via N-acetylgalactosamine, heparan sulfate proteoglycan biosynthetic process,
  cGMP biosynthetic process, lipid A biosynthetic process and so on). For some sets the term is true only
  by a side reaction or a genetic interaction: lysosomal glucosylceramidase (set 148) is a degradative
  enzyme whose curated role is glucosylceramide catabolism, and the yeast 14-3-3 proteins (set 111) are
  signalling adaptors linked to chitin synthesis by one genetic interaction. rule_redundancy.tsv finds
  88 of 191 sets already matched by a rule with a more specific term.
action: SPLIT
action_rationale: >-
  The rule should be split by family. The units are real and each has a better term, so one umbrella annotation
  on 75875 proteins adds little and in places misleads (a catabolic enzyme labelled biosynthetic). Sets
  covered by more specific rules can be dropped; the rest should move to the term of their unit; sets
  148 and 111 should be dropped. Units were assigned for 30 sets whose signatures name the family; confidence
  reflects that sample.
confidence: 0.8
suggested_modifications:
- >-
  Drop the sets already matched by rules asserting a more specific term (88 of 191 in rule_redundancy.tsv;
  covering terms GO:0009260 ribonucleotide biosynthetic process, GO:0009101 glycoprotein biosynthetic
  process, GO:0006493 protein O-linked glycosylation, GO:0016138 glycoside biosynthetic process, GO:0009226
  nucleotide-sugar biosynthetic process).
- >-
  Move the remaining sets to the specific term of their unit: sets 1, 51, 67, 70, 79, 97, 117, 118, 140
  to GO:0016266 (protein O-linked glycosylation via N-acetylgalactosamine); sets 2, 54, 80, 173 to GO:0015012
  (heparan sulfate proteoglycan biosynthetic process); sets 12, 81, 178 to GO:0030213 (hyaluronan biosynthetic
  process); sets 9, 27, 37, 55, 105 to GO:0006182 (cGMP biosynthetic process); sets 8, 34 to GO:0006167
  (AMP biosynthetic process); set 25 to GO:0009245 (lipid A biosynthetic process); sets 87, 91 to GO:0015986
  (proton motive force-driven ATP synthesis); set 61 to GO:0019761 (glucosinolate biosynthetic process);
  set 109 to GO:0006491 (N-glycan processing).
- >-
  Drop set 148 (FunFam 3.20.20.80:FF:000030, lysosomal acid glucosylceramidase): the family's curated
  process is GO:0006680 (glucosylceramide catabolic process), outside the consequent.
- >-
  Drop set 111 (FunFam 1.20.190.20:FF:000002 in Saccharomycetales, 14-3-3 proteins BMH1 and BMH2): the
  term rests on one genetic-interaction annotation to chitin biosynthetic process.
