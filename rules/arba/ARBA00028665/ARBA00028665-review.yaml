review_summary: >-
  Accuracy: the first 10 of the 392 live condition sets were examined. Six match reviewed entries, and
  78 of 79 of those entries carry GO:0048468 (cell development) or a descendant, 48 by manual evidence.
  Four of the ten repeat the conditions of a neighbouring set for Archaea or Bacteria and match no UniProtKB
  entry. The other 382 sets were not checked against proteins. Meaning and parsimony: GO:0048468 has 672
  descendants. The sampled sets are domain architectures (BTB with C2H2 zinc fingers, SH2 with SH3, the
  tyrosine phosphatase domain, hedgehog, peptidase M17) restricted to an animal clade, and their reviewed
  members reach the term through unrelated developmental phenotypes: axon guidance for Abl, Ptp69D, lola
  and Shh, spermatid development for the Drosophila sperm leucyl aminopeptidases and Dhh, photoreceptor
  development for ttk. The consequent is the common ancestor of those phenotype terms, not a property
  the architectures share. Across the whole rule, 103 sets of conditions occur three times, once each
  for Archaea, Bacteria and Eukaryota, so 206 of the 392 sets are copies of animal developmental families
  under prokaryotic taxa; all four such copies in the sample match nothing.
action: SPLIT
action_rationale: >-
  The term is true of the reviewed matches and uninformative, and it fits the units for unrelated reasons,
  so the rule is heterogeneous. More specific rules already cover 76 sets. The remedy is to drop the prokaryotic
  copies, re-point each remaining family to the developmental term its members are curated to, and remove
  sets that generalise one paralog group's phenotype to a whole enzyme family. Based on 10 of 392 sets,
  with the triplication measured on the whole rule.
confidence: 0.65
suggested_modifications:
- >-
  Remove the Archaea and Bacteria copies of eukaryotic sets (206 sets in the live rule; of the recorded
  sets these are 1, 3, 8 and 10), which match no UniProtKB entry.
- >-
  Remove set 4 (peptidase M17 N- and C-terminal domains in Ecdysozoa). Its 8 reviewed matches are the
  Drosophila sperm leucyl aminopeptidases S-Lap1 to S-Lap8, curated to GO:0007286 (spermatid development);
  the set also matches 848 unreviewed M17 aminopeptidases, 634 of them outside Drosophilidae, for which
  a sperm-specific paralog phenotype is no evidence.
- >-
  Sets 5 (SH2 with SH3 in Arthropoda) and 7 (tyrosine phosphatase domain in Hexapoda) are architecture-level:
  replace them with family-level sets, asserting GO:0007411 (axon guidance) where that is what the family's
  members are curated to (Abl, Ptp69D, Lar), or remove them. As written, set 7 gives the term to every
  tyrosine phosphatase of insects (5382 unreviewed entries).
- >-
  Sets 2 (BTB zinc-finger transcription regulators), 6 and 9 (hedgehog proteins): re-point to the specific
  developmental terms of the family, or leave to the more specific rules that already cover part of this
  rule (GO:0007409, GO:0048666, GO:0031175, GO:0030097, GO:0007281).
