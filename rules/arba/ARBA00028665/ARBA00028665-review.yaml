corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    Manual inspection shows the condition sets overlap and are heterogeneous, and the rule would over-annotate
    housekeeping proteins.
  correction: >-
    The file recorded no condition sets and no protein counts, so nothing had been inspected. No over-annotated
    protein was named.
  error_type: UNEXAMINED_RULE
  evidence:
  - The old file recorded condition_sets as an empty list and both protein counts as 0.
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule should be deprecated because it has 174 condition sets, more than the analysis tool can
    process.
  correction: >-
    The number of sets, and the capacity of a tool, are not evidence about whether the annotations
    are right.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'UniProt ARBA API, ARBA00028665, retrieved 2026-11-09: 392 condition sets.'
- date: '2026-11-10'
  withdrawn_claim: >-
    Cell development is too broad for the diverse molecular functions captured, and should be replaced
    by terms such as DNA-binding transcription factor activity.
  correction: >-
    Cell development is a biological process term. Proteins with different molecular functions can
    take part in the same process, and a molecular function term does not replace a process term.
    A general true term is not a reason to deprecate.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - 'QuickGO: GO:0048468 aspect biological_process; GO:0003700 aspect molecular_function.'
- date: '2026-11-10'
  withdrawn_claim: The taxonomic scope is too broad and the restrictions are arbitrary.
  correction: >-
    All 392 live condition sets carry a taxon condition, many of them narrow clades such as Glires,
    Mus or Hexapoda. Narrow restrictions limit reach; they do not widen it.
  error_type: TAXON_MISREAD
  evidence:
