review_summary: 'All 8 condition sets served on 2026-11-17 were examined as conjunctions in UniProtKB
  2026_04. Together they match 3,535 entries: 3,460 fungal, 75 non-fungal eukaryotes and no bacteria or
  archaea. Every one of the 28 reviewed matches is a fungal FAS alpha or beta subunit whose EC 2.3.1.86
  is curated in Swiss-Prot, by experiment or by similarity to S. cerevisiae FAS1/FAS2 or A. parasiticus
  aflA/aflB, and none carries it from ARBA. An earlier version of the rule did reach bacteria: bacterial
  polyketide synthases carried EC 2.3.1.86 from this rule in the June and September 2026 releases (all
  20 entries sampled from the 529) and lost it in 2026_04, but QuickGO still serves 529 GO:0004321 EC2GO
  rows on them.'
action: ACCEPT
action_rationale: 'Each of the 8 sets matches fungal FAS subunits, and the in-sample support is uniform:
  the reviewed matches in every set carry EC 2.3.1.86 as curated Swiss-Prot annotation, the same consequent
  the rule assigns. The rule''s consequent repeats Swiss-Prot''s own practice of giving the system reaction
  to both FAS subunits; whether that reaction should be an activity of a single chain is a question for
  the EC/GO mapping, not for this rule. The 75 non-fungal eukaryote matches (stramenopile FAS-alpha-like
  models, several fragments, and single proteins from protists, plants and one amphipod) are uncertain
  rather than shown wrong, about 2% of the rule''s output. The bacterial false positives that motivated
  this review are no longer produced by the rule as served.'
suggested_modifications: []
parsimony:
  assessment: ACCEPTABLE
  notes: Alpha-subunit sets (1, 5, 6, 8) and beta-subunit sets (2, 3, 4, 7) overlap heavily, as alternative
    routes to the same two subunit families; the overlap adds recall across FunFam and InterPro coverage
    gaps and does not change what is annotated.
literature_support:
  assessment: MODERATE
  notes: The fungal FAS is a 2.6-MDa alpha6beta6 complex whose two chains together carry all the catalytic
    domains of the cycle (PMID:17431175), so the overall EC 2.3.1.86 reaction belongs to the complex both
    subunits form. Support for each set comes from the curated Swiss-Prot FAS subunits it matches (RESULTS-condition-sets.md).
  supported_by:
  - reference_id: PMID:17431175
    supporting_text: We report crystal structures of the 2.6-megadalton alpha6beta6 heterododecameric
      fatty acid synthase from Thermomyces lanuginosus at 3.1 angstrom resolution.
  - reference_id: PMID:17431175
    supporting_text: The alpha and beta polypeptide chains form the six catalytic domains required for
      fatty acid synthesis
condition_overlap:
  assessment: MINOR
  notes: Sets split into two groups by subunit; within each group sets reach the same reviewed entries
    (for example P07149 and P34229 are matched by sets 3, 4 and 7). Alternative sets are expected to overlap
    this way when they back each other up across signature databases.
  supported_by:
  - reference_id: file:rules/arba/ARBA00048237/RESULTS-condition-sets.md
    supporting_text: '| 7 | 1163 | 1162 | 0 | 0 | 1 | P07149, P34229, I1S489 |'
taxonomic_scope:
  assessment: APPROPRIATE
  notes: 'Sets 1, 3 and 7 carry no taxon condition; set 3 is constrained by the fungal family IPR016452
    (Fatty acid synthase beta subunit AflB /Fas1-like, fungi), while sets 1 and 7 rest on signature conjunctions
    alone. Their signatures confine them to fungal-type FAS in practice: no bacterial or archaeal entry
    matches any set in 2026_04. Adding a Fungi condition to set 1 would remove 71 stramenopile and protist
    FAS-alpha-like entries; that is worth doing only if those are shown not to be fungal-type FAS, which
    this review did not establish.'
  supported_by:
  - reference_id: file:rules/arba/ARBA00048237/RESULTS-condition-sets.md
    supporting_text: '| any | 3535 | 3460 | 0 | 0 | 75 | |'
confidence: 0.7
references:
- id: PMID:17431175
  title: Structure of fungal fatty acid synthase and implications for iterative substrate shuttling.
  findings:
  - statement: Fungal FAS is an alpha6beta6 complex whose two chains together form all six catalytic domains
      of fatty acid synthesis.
- id: file:rules/arba/ARBA00048237/RESULTS-condition-sets.md
  title: ARBA00048237 condition-set matches
  findings:
  - statement: 'In UniProtKB 2026_04 the 8 sets match 3,535 entries: 3,460 fungal, 75 non-fungal eukaryotes,
      no bacteria or archaea; all 28 reviewed matches are fungal FAS subunits.'
- id: file:rules/arba/ARBA00048237/RESULTS-bacterial-rows.md
  title: Bacterial GO:0004321 rows and their EC source
  findings:
  - statement: QuickGO serves 696 EC2GO GO:0004321 rows on bacteria; 529 are on entries that no longer
      carry EC 2.3.1.86 in UniProtKB 2026_04, and all 20 of an evenly spread sample of them carried it
      from ARBA00048237 in the June and September 2026 releases. The other 167 carry submitter EC (ECO:0000313).
supported_by:
- reference_id: file:rules/arba/ARBA00048237/RESULTS-bacterial-rows.md
  supporting_text: '- no EC 2.3.1.86 in current entry: 529'
- reference_id: file:rules/arba/ARBA00048237/RESULTS-bacterial-rows.md
  supporting_text: 20 of 20 sampled entries carried EC 2.3.1.86 from ARBA00048237 in an earlier version.
annotation_assessments:
- annotation_kind: CATALYTIC_ACTIVITY
  value: EC:2.3.1.86
  label: acetyl-CoA + n malonyl-CoA + 2n NADPH + 4n H(+) = a long-chain-acyl-CoA + n CoA + n CO2 + 2n
    NADP(+) (fatty-acyl-CoA synthase system)
  assessment: CORRECT
  matched_protein_count: 3535
  incorrect_protein_count: 0
  correct_examples:
  - P19097
  - P07149
  - Q10289
  - P34229
  - Q8TGA2
  - Q8TGA1
  - P43098
  - Q2TXF0
  notes: 'Correct for the 3,460 fungal matches, judged from the 28 reviewed matches, all fungal FAS subunits
    with curated EC 2.3.1.86 (S. cerevisiae FAS2 P19097 and FAS1 P07149, S. pombe fas2 Q10289 and fas1
    P34229, A. parasiticus aflA Q8TGA2 and aflB Q8TGA1, ...). No entry is counted incorrect. The 75 non-fungal
    eukaryote matches are uncertain: 65 stramenopile entries (Phytophthora and relatives, PANTHER PTHR10982:SF21
    or PTHR11712:SF336, several of them gene-model fragments of 369-1,195 residues), single long FAS-like
    proteins from Capsaspora, Sphaeroforma, Thecamonas, Acanthamoeba, Carpediemonas and Vitrella, three
    plant entries and one 780-residue amphipod protein (A0A6A7G509) combining ketosynthase and phosphopantetheinyl
    transferase domains. A fungal-type FAS outside fungi is not excluded for the stramenopile and protist
    entries, so they are not listed as false positives. Two entries are most likely contaminant or chimeric
    sequences rather than proteins of their host: A0A6A7G509 (amphipod transcriptome, 780 aa) and A0A8T0CGI0
    (Corymbia, 133 aa); neither animals nor plants have a fungal-type FAS. They are taxon errors in the
    source sequence, not mistakes a rule condition could avoid. PANTHER PTHR11712:SF336 (3-OXOACYL-[ACYL-CARRIER-PROTEIN]
    SYNTHASE, MITOCHONDRIAL) on many of these entries does not mark them as mitochondrial ketoacyl-ACP
    synthases: of the 113 set-1 matches lacking IPR050830, 100 are fungal and 82 of those carry PTHR11712:SF336,
    most named fatty acid synthase alpha subunit or KS3-domain protein; a type II ketoacyl-ACP synthase
    would also lack the integral phosphopantetheinyl transferase domain set 1 requires. Requiring IPR050830
    or PTHR10982 in set 1 would drop those 100 fungal matches with 13 of the 71 non-fungal ones.'
