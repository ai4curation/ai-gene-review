  overall reaction of the alpha6beta6 type I fatty acid synthase) to unreviewed entries that carry fungal
  FAS alpha- or beta-subunit signatures, through eight condition sets combining InterPro, PANTHER and
  CATH FunFam signatures, five of them with a fungal or eukaryotic taxon condition.
