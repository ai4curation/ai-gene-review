review_summary: >-
  All 19 live condition sets were examined. They match 86 reviewed entries in total; 85 carry GO:0005681
  or a descendant, 70 by manual evidence. Every set has at least two reviewed matches with a manual
  annotation to the term or to a more specific spliceosomal complex. The rule is sound for the proteins
  that can be checked.
action: ACCEPT
action_rationale: >-
  Each set selects proteins curated as spliceosome components, many with experimental evidence. Every
  set carries a taxon condition. The counts are from Swiss-Prot, which is also what ARBA learns its
  rules from, so they show the condition sets are coherent rather than giving an independent error
  rate for unreviewed entries.
go_specificity:
  assessment: APPROPRIATE
  notes: >-
    GO:0005681 is the general spliceosomal complex term. Reviewed matches carry it directly or through
    more specific descendants such as GO:0071013 (catalytic step 2 spliceosome) and GO:0000243 (commitment
    complex).
annotation_assessments:
- annotation_kind: GO_TERM
  value: GO:0005681
  label: spliceosomal complex
  assessment: CORRECT
  matched_protein_count: 86
  correct_examples:
  - Q9Y3C6
  - O42643
  - P14678
  - Q8IYB3
  - Q96DI7
  - O74555
  notes: >-
    Manual annotations on reviewed matches (QuickGO, retrieved 2026-11-09). Set 1: Q9Y3C6 (PPIL1),
    GO:0005681, IPI, PMID:30728453. Set 2: O42643 (prp22), GO:0005681, IDA, PMID:24014766. Set 8:
    Q8IYB3 (SRRM1), GO:0005681, IPI, PMID:39068178. Set 9: P14678 (SNRPB), GO:0005681, IPI, PMID:30728453.
    Set 14: Q96DI7 (SNRNP40), GO:0005681, IPI, PMID:30728453. Set 18: O74555 (bpb1), GO:0005681, IDA,
    PMID:24014766. The one reviewed match without the term is Q5NVL7 (Pongo abelii PPWD1, set 1),
    an orthologue of human PPWD1 (Q96BP3), which carries GO:0005681 IPI, PMID:39068178.
confidence: 0.75
corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    With 17 condition sets the rule exceeds recommended limits, analysis is computationally prohibitive,
    and it should be cut to fewer than 12 sets.
  correction: >-
    The number of condition sets is not evidence about whether the annotations are right. All 19 live
    sets were checked against Swiss-Prot.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - >-
    UniProtKB release 2026_04: the 19 sets match 86 reviewed entries, 85 of which carry GO:0005681
    or a descendant.
- date: '2026-11-10'
  withdrawn_claim: >-
    Taxonomic scope is missing: several conditions have no taxonomic restriction and the restrictions
    are inconsistent.
  correction: >-
    Every live condition set has a taxon condition. Restrictions differ between sets because each
    set is a separate alternative for a different protein family.
  error_type: TAXON_MISREAD
  evidence:
  - >-
    UniProt ARBA API, ARBA00035048, modified 2026-07-18, retrieved 2026-11-09: 19 condition sets,
    each with one taxon condition (7 Eukaryota, 12 narrower taxa).
- date: '2026-11-10'
  withdrawn_claim: >-
    Several sets target similar families, which indicates redundancy and a need to consolidate.
  correction: >-
    Sets are alternatives. Two sets for related families do not produce conflicting or wrong annotations,
    since the rule has a single consequent.
  error_type: OTHER
  evidence:
  - 'UniProt ARBA API, ARBA00035048: one annotation, GO:0005681.'
- date: '2026-11-10'
  withdrawn_claim: Statements about the rule were supported by quotations from ARBA00035048.enriched.json.
