review_summary: >-
  Accuracy: all 19 live condition sets were examined. They match 86 reviewed entries; 85 carry GO:0005681
  (spliceosomal complex) or a descendant, 70 by manual evidence. One set is wider than its evidence: set
  2 requires only two generic DEAH-box helicase signatures in Taphrinomycotina, and three of its eight
  reviewed Schizosaccharomyces pombe matches carry the term only from this rule while PomBase places them
  in the nucleolus or cytosol. Meaning and parsimony: eighteen sets select subunits and stably associated
  factors of one machine (Sm core proteins, U1A and U2B'', spliceosomal DEAH-box helicases, PRP17, SNRNP40,
  cyclophilins, the exon junction factor MAGOH, branchpoint-binding protein and others), and the general
  complex term is the one curated on most of them, usually beside several stage-specific descendants,
  so it is the right level for a rule that spans stages. Set 2 is the exception. Three sets are covered
  by rules asserting more specific spliceosome terms, and InterPro2GO already maps an Sm F entry to the
  term.
action: MODIFY
action_rationale: >-
  The rule is a coherent statement about one complex and should be kept, with set 2 removed or tightened:
  sets 3 and 4 already select the fungal spliceosomal DEAH-box helicases by FunFam, and set 2 adds the
  ribosome-biogenesis helicases prh1 (Q03319) and Q9HDY4 and the cytosolic ucp12 (O94536). The primate-level
  taxon limits on several sets are narrow coverage and not an error.
suggested_modifications:
- >-
  Remove condition set 2 (IPR002464 (DNA/RNA helicase, ATP-dependent, DEAH-box type, conserved site) AND
  IPR007502 (Helicase-associated domain) AND taxon Taphrinomycotina), or add a condition specific to the
  splicing helicases. Its reviewed matches Q03319 (prh1), Q9HDY4 and O94536 (ucp12) are not curated spliceosome
  components; the splicing helicases it matches (prp22, prp16, prp43, cdc28) are matched by sets 3 and
  4.
- >-
  Consider widening the taxon of sets 1, 6, 7, 9 and 10 (Primates, Euarchontoglires, Haplorrhini, Catarrhini)
  to the range in which the FunFam or InterPro entry stays specific; other Sm protein sets (15, 16, 17)
  already use Eukaryota.
