  (PEX2/10, PEX4, PEX11, PEX12, PEX13, PEX14 and the fungal DysF-domain peroxins), peroxisomal ABC
  transporters, PMP34 (SLC25A17), ATAD1, fatty acyl-CoA reductase, NBR1 and a Penicillium transporter
  FunFam, each with a taxon restriction.
