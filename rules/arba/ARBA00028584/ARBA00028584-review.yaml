review_summary: >-
  All 16 live condition sets were examined. They match 83 reviewed entries in total; 82 carry GO:0005778
  or a descendant, 77 by manual evidence. Fourteen sets are supported by experimental localisation
  of at least one reviewed match. Two are weaker: the NBR1 set rests on Reactome TAS annotations only,
  and the Penicillium transporter set includes sorT (B6HNK5), which has no peroxisomal annotation.
action: ACCEPT
action_rationale: >-
  The rule selects proteins that are curated to the peroxisomal membrane, almost all with experimental
  evidence. The two weaker sets are recorded in annotation_assessments; nothing checked shows either
  to be wrong. The counts are from Swiss-Prot, which is also what ARBA learns its rules from, so they
  show the condition sets are coherent rather than giving an independent error rate for unreviewed
  entries.
literature_support:
  assessment: STRONG
  notes: >-
    Peroxisomal membrane location is documented for the transporter and import-machinery families
    the rule covers.
  supported_by:
  - reference_id: PMID:22185573
    supporting_text: Recombinant and purified SLC25A17 was reconstituted into liposomes
  - reference_id: PMID:35908918
    supporting_text: >-
      ABCD1-3 are localized to peroxisomal membranes and involved in the transport of various acyl-CoAs
      from the cytosol to the peroxisomal lumen.
  - reference_id: PMID:36541703
    supporting_text: >-
      PEX13, a component of the peroxisomal matrix import system, is required to prevent the degradation
      of otherwise healthy peroxisomes.
go_specificity:
  assessment: APPROPRIATE
  notes: >-
    GO:0005778 is the cellular component term carried, with experimental evidence, by reviewed members
    of the sets (accessions in annotation_assessments).
  supported_by:
  - reference_id: PMID:35908918
    supporting_text: >-
