corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    Condition set 9 targets DECR2, which lacks transmembrane domains and is probably a matrix enzyme,
    so the set should be reviewed and the term changed to peroxisomal matrix.
  correction: >-
    The live rule has no DECR2 set. Separately, absence of a transmembrane segment does not exclude
    membrane association, and rat Decr2 carries an experimental peroxisomal membrane annotation.
  error_type: STALE_RULE_VERSION
  evidence:
  - >-
    UniProt ARBA API, ARBA00028584, modified 2026-07-18, retrieved 2026-11-09: 16 condition sets,
    none on FunFam 3.40.50.720:FF:000477.
  - >-
    QuickGO: UniProtKB:Q9Z2M4 (rat Decr2), GO:0005778, IDA, PMID:10333503, assigned by UniProt.
- date: '2026-11-10'
  withdrawn_claim: >-
    The NBR1 set should be removed because NBR1 is not a peroxisomal membrane protein; a knockdown
    result confirms that it is a pexophagy signal and not a membrane component.
  correction: >-
    The cited paper calls NBR1 the peroxisomal autophagy receptor and does not address whether it
    is at the membrane. NBR1 carries GO:0005778 as a Reactome TAS annotation in human and mouse. The
    set is weakly supported, with no experimental annotation, but removal is not justified by what
    was cited.
  error_type: UNSUPPORTED_SOURCE
  evidence:
  - >-
    QuickGO: UniProtKB:Q14596 (NBR1), GO:0005778, TAS, Reactome:R-HSA-9664867; UniProtKB:P97432 (Nbr1),
    GO:0005778, TAS, Reactome:R-MMU-9666410.
  - >-
    publications/PMID_37493040.md: 'genetic knockdown of the peroxisomal autophagy receptor NBR1 resulted
    in restoration of peroxisomal functions'.
- date: '2026-11-10'
  withdrawn_claim: >-
    IPR010482 restricted to Fungi returns 10 reviewed proteins, all established peroxisomal membrane
    proteins, and the DysF-domain peroxins are peripheral membrane proteins.
  correction: >-
    The live set is restricted to Saccharomycetes and matches five reviewed Saccharomyces cerevisiae
    peroxins, all with IDA evidence. Across Fungi the same domain also matches reviewed proteins that
    UniProt places in the endoplasmic reticulum membrane only, so the wider statement does not hold.
    UniProt describes these peroxins as multi-pass membrane proteins.
  error_type: SAMPLE_OVERGENERALISED
  evidence:
  - >-
    QuickGO: P53203 (PEX31), Q06169 (PEX30), P38292 (PEX32), GO:0005778, IDA, PMID:14617799; Q03370
    (PEX29), P38848 (PEX28), GO:0005778, IDA, PMID:12707309.
  - >-
    UniProtKB W1QL91 (Ogataea parapolymorpha PEX29) and W1QAK2 (PEX23): SUBCELLULAR LOCATION Endoplasmic
    reticulum membrane, ECO:0000269 PubMed:32665322; Multi-pass membrane protein.
  - 'UniProtKB release 2026_04: IPR010482 AND taxonomy Fungi AND reviewed returns 14 entries.'
- date: '2026-11-10'
  withdrawn_claim: >-
    The taxonomic restrictions are too narrow (PEX14 to Muridae, ABCD1 to Glires, ABCD3 to Rodentia)
    and should be broadened to Eukaryota or Vertebrata.
  correction: >-
    A narrow taxon limits how many proteins the rule reaches; it does not make any annotation wrong.
    No check was made that the FunFams stay specific outside the stated taxa. The live rule already
    has ABCD1 at Mammalia, ABCD3 at Glires, and a separate fungal PEX14 set.
  error_type: LOW_RECALL_IS_NOT_WRONG
  evidence:
  - >-
    UniProt ARBA API, ARBA00028584, modified 2026-07-18: set 5 taxon Mammalia, set 9 taxon Glires,
    set 11 taxon Muridae, set 1 (IPR006785 AND IPR025655) taxon Fungi.
- date: '2026-11-10'
  withdrawn_claim: The FunFam labels unambiguously identify the protein each set targets.
  correction: >-
    A FunFam label is the name of a representative member, not a statement of membership. The FunFam
    labelled ATP-binding cassette sub-family D member 1 also matches ABCD2.
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
  - >-
    UniProtKB release 2026_04: set 5 (FunFam 3.40.50.300:FF:000800 AND Mammalia) reviewed matches
    include Q9UBJ2 (human ABCD2) as well as P33897 (human ABCD1).
references:
- id: PMID:22185573
  title: The human gene SLC25A17 encodes a peroxisomal transporter of coenzyme A, FAD and NAD+
  findings:
  - statement: >-
      SLC25A17 is the only member of the mitochondrial carrier family localized to the peroxisomal
      membrane. It transports CoA, FAD, FMN, AMP, and to a lesser extent NAD+, PAP, and ADP into peroxisomes.
- id: PMID:35908918
  title: >-
    Substrate Specificity and the Direction of Transport in the ABC Transporters ABCD1-3 and ABCD4
  findings:
  - statement: >-
      ABCD1-3 are localized to peroxisomal membranes and transport various acyl-CoAs from the cytosol
      to the peroxisomal lumen. ABCD4 is lysosomal. Mutations in ABCD1, ABCD3, and ABCD4 cause genetic
      diseases.
- id: PMID:36541703
  title: PEX13 prevents pexophagy by regulating ubiquitinated PEX5 and peroxisomal ROS
  findings:
  - statement: >-
      PEX13 is a component of the peroxisomal matrix import system and is required to prevent degradation
      of healthy peroxisomes. Loss of PEX13 causes accumulation of ubiquitinated PEX5 on peroxisomes
      and induces pexophagy.
- id: PMID:14617799
  title: >-
    Pex30p, Pex31p, and Pex32p form a family of peroxisomal integral membrane proteins regulating
    peroxisome size and number in Saccharomyces cerevisiae
  findings:
  - statement: Reference for the IDA annotations of GO:0005778 on PEX30, PEX31 and PEX32.
