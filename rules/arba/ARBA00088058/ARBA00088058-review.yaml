review_summary: >-
  Accuracy: all five live condition sets were examined. Every Swiss-Prot entry that matches a full conjunction
  is curated to GO:0051010 (microtubule plus-end binding) itself, and each set has at least one match
  with experimental evidence: CLIP1 and CLIP2 of mouse and rat (set 1), MAPRE1 of human, mouse and rat
  (set 2), human CLASP1 and CLASP2 (set 3), S. cerevisiae BIM1 and S. pombe mal3 (set 4), and S. pombe
  dis1 (set 5; alp14 by TAS). Meaning and parsimony: the five sets resolve into four closely related units,
  the classic plus-end tracking protein families (CLIP-170, EB, CLASP, XMAP215/Dis1), and the consequent
  is the most informative function term curators put on all of them; it has no descendants and no set
  is covered by another rule. Each set does its own work. The one weakness is taxon scope: CLIP is limited
  to Glires and CLASP to Primates, which reflects where the training annotations are, not where the families
  exist. That is narrow coverage, not wrong annotation.
action: ACCEPT
action_rationale: >-
  The rule is accurate, coherent and economical: four related families, one term that is the specific
  curated function of each, five sets with no overlap and 4,943 annotations in QuickGO that no other rule
  supplies. The narrow taxa of sets 1 and 3 lose coverage but do not make the rule wrong, so no change
  is required; widening them is noted as an improvement under taxonomic_scope.
suggested_modifications: []
