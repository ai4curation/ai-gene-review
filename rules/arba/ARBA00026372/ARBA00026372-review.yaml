corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule should be deprecated to prevent false annotations, because it puts two mechanistically
    distinct enzyme families under one term.
  correction: >-
    No false annotation was shown. Both families, and the leucine carboxyl methyltransferase family
    now also in the rule, methylate a carboxyl group on a protein, which is what GO:0051998 says.
    The argument made was that the term is general, and that is not a reason to deprecate.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - >-
    QuickGO: GO:0051998 definition, Catalysis of the transfer of a methyl group to a carboxyl group
    on a protein.
  - >-
    QuickGO ancestors: GO:0004671, GO:0004719 and GO:0018423 are each is_a descendants of GO:0051998.
  - 'UniProtKB release 2026_04: 40 of 40 reviewed matches carry GO:0051998 or a descendant.'
- date: '2026-11-10'
  withdrawn_claim: >-
    The complete disjointness between the ICMT and PIMT condition sets, and between two ICMT FunFams,
    shows the rule is incoherent.
  correction: >-
    Alternative condition sets are expected to select different proteins. Disjointness between them
    is not a defect.
  error_type: OTHER
  evidence:
  - 'UniProt ARBA API: the consequent applies when any one condition set is satisfied.'
- date: '2026-11-10'
  withdrawn_claim: >-
    IPR025770 is a complete subset of IPR007269, so condition set 1 is redundant and badly designed.
  correction: >-
    The two conditions are combined with AND inside one set. A nested pair makes the set equal to
    its narrower member; it does not make any annotation wrong.
  error_type: CONJUNCTION_IGNORED
  evidence:
  - 'UniProt ARBA API, ARBA00026372 set 1: IPR007269 AND IPR025770 AND PANTHER:PTHR12714.'
- date: '2026-11-10'
  withdrawn_claim: The literature contradicts the rule.
  correction: >-
    The papers cited describe the two enzymes as carboxyl methyltransferases acting on proteins, which
    agrees with the term. They show that the families differ, not that the annotation is false.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - >-
    PMID:22195972 and PMID:31234761 were cited by the old review for the mechanism of each family;
    neither was cited for a statement that the enzymes lack protein carboxyl O-methyltransferase activity.
- date: '2026-11-10'
  withdrawn_claim: Condition set 1 has no taxon restriction and would annotate all domains of life.
  correction: >-
    Set 1 requires membership of PANTHER family PTHR12714 together with two InterPro entries for the
