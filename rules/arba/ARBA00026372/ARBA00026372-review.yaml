review_summary: >-
  Accuracy: all six live condition sets were examined. They match 40 reviewed entries and every one carries
  GO:0051998 (protein carboxyl O-methyltransferase activity) or a descendant, 39 by manual evidence, so
  the annotation is true for every family the rule covers. Meaning and parsimony: the six sets resolve
  into three unrelated enzyme families, each of which has its own curated child term: isoprenylcysteine
  carboxyl methyltransferase (sets 1, 3, 4), GO:0004671 (protein C-terminal S-isoprenylcysteine carboxyl
  O-methyltransferase activity); protein-L-isoaspartate O-methyltransferase (sets 2, 5), GO:0004719 (protein-L-isoaspartate
  (D-aspartate) O-methyltransferase activity); and leucine carboxyl methyltransferase 1 (set 6), GO:0018423
  (protein C-terminal leucine carboxyl O-methyltransferase activity). The consequent is the shared parent
  and says less than any of them. Four of the sets are already matched by rules asserting a more specific
  term, so they emit nothing, and InterPro2GO maps both InterPro entries of set 1 to GO:0004671.
action: SPLIT
action_rationale: >-
  The rule is true but uninformative: an umbrella term over three families that each carry a more specific
  curated term with experimental evidence (O60725, P22061, Q9UIC8). The families share no substrate site
  (a C-terminal prenylcysteine, an internal isoaspartyl residue, a C-terminal leucine of PP2A), so nothing
  is gained by annotating them at the parent. Splitting by family gives the term that curators use, and
  most of the rule is already redundant with more specific rules and with InterPro2GO.
suggested_modifications:
- >-
  Sets 1, 3 and 4 (isoprenylcysteine carboxyl methyltransferase): assert GO:0004671 (protein C-terminal
  S-isoprenylcysteine carboxyl O-methyltransferase activity). Set 1 is already covered by InterPro2GO
  for IPR007269 and IPR025770 and can be dropped.
- >-
  Sets 2 and 5 (protein-L-isoaspartate O-methyltransferase): assert GO:0004719 (protein-L-isoaspartate
  (D-aspartate) O-methyltransferase activity).
- >-
  Set 6 (leucine carboxyl methyltransferase 1): assert GO:0018423 (protein C-terminal leucine carboxyl
  O-methyltransferase activity).
