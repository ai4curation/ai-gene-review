review_summary: >-
  All six live condition sets were examined. They match 40 reviewed entries in total and every one
  carries GO:0051998 or a descendant, 39 by manual evidence. GO:0051998 is the common parent of the
  specific activities of the three families, so the annotation is true for every family the rule covers.
  More specific terms exist for each family and are already supplied by InterPro2GO for two of them.
action: ACCEPT
action_rationale: >-
  The annotation is correct for all three families. It is less specific than the per-family child
  terms, but a general true term is not an error, and one rule spanning three families can only use
  their shared parent. The counts are from Swiss-Prot, which is also what ARBA learns its rules from,
  so they show the condition sets are coherent rather than giving an independent error rate for unreviewed
  entries.
suggested_modifications:
- >-
  Optional refinement, not a correction: split by family so that sets 1, 3 and 4 give GO:0004671,
  sets 2 and 5 give GO:0004719 and set 6 gives GO:0018423.
go_specificity:
  assessment: APPROPRIATE
  notes: >-
    GO:0004671 (protein C-terminal S-isoprenylcysteine carboxyl O-methyltransferase activity), GO:0004719
    (protein-L-isoaspartate (D-aspartate) O-methyltransferase activity) and GO:0018423 (protein C-terminal
    leucine carboxyl O-methyltransferase activity) each have GO:0051998 as an is_a ancestor (QuickGO).
    The rule term is the most specific term shared by the three families it covers.
annotation_assessments:
- annotation_kind: GO_TERM
  value: GO:0051998
  label: protein carboxyl O-methyltransferase activity
  assessment: CORRECT
  matched_protein_count: 40
  incorrect_protein_count: 0
  notes: >-
    UniProtKB release 2026_04: the six sets match 12, 12, 6, 2, 2 and 6 reviewed entries; all 40 carry
    GO:0051998 or a descendant, 39 by manual-evidence annotation. In rules/arba/_interpro2go.txt,
    IPR007269 and IPR025770 map to GO:0004671 and IPR000682 maps to GO:0004719.
confidence: 0.8
corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule should be deprecated to prevent false annotations, because it puts two mechanistically
    distinct enzyme families under one term.
  correction: >-
    No false annotation was shown. Both families, and the leucine carboxyl methyltransferase family
    now also in the rule, methylate a carboxyl group on a protein, which is what GO:0051998 says.
    The argument made was that the term is general, and that is not a reason to deprecate.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - >-
    QuickGO: GO:0051998 definition, Catalysis of the transfer of a methyl group to a carboxyl group
    on a protein.
  - >-
    QuickGO ancestors: GO:0004671, GO:0004719 and GO:0018423 are each is_a descendants of GO:0051998.
  - 'UniProtKB release 2026_04: 40 of 40 reviewed matches carry GO:0051998 or a descendant.'
- date: '2026-11-10'
  withdrawn_claim: >-
    The complete disjointness between the ICMT and PIMT condition sets, and between two ICMT FunFams,
    shows the rule is incoherent.
  correction: >-
    Alternative condition sets are expected to select different proteins. Disjointness between them
    is not a defect.
  error_type: OTHER
  evidence:
  - 'UniProt ARBA API: the consequent applies when any one condition set is satisfied.'
- date: '2026-11-10'
  withdrawn_claim: >-
    IPR025770 is a complete subset of IPR007269, so condition set 1 is redundant and badly designed.
  correction: >-
    The two conditions are combined with AND inside one set. A nested pair makes the set equal to
    its narrower member; it does not make any annotation wrong.
  error_type: CONJUNCTION_IGNORED
  evidence:
  - 'UniProt ARBA API, ARBA00026372 set 1: IPR007269 AND IPR025770 AND PANTHER:PTHR12714.'
- date: '2026-11-10'
  withdrawn_claim: The literature contradicts the rule.
  correction: >-
    The papers cited describe the two enzymes as carboxyl methyltransferases acting on proteins, which
    agrees with the term. They show that the families differ, not that the annotation is false.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - >-
    PMID:22195972 and PMID:31234761 were cited by the old review for the mechanism of each family;
    neither was cited for a statement that the enzymes lack protein carboxyl O-methyltransferase activity.
- date: '2026-11-10'
  withdrawn_claim: Condition set 1 has no taxon restriction and would annotate all domains of life.
  correction: >-
    Set 1 requires membership of PANTHER family PTHR12714 together with two InterPro entries for the
    same enzyme, so it is limited by family rather than by taxon.
  error_type: CONJUNCTION_IGNORED
  evidence:
  - >-
    PANTHER:PTHR12714 name: PROTEIN-S ISOPRENYLCYSTEINE O-METHYLTRANSFERASE (interpro/panther/panther.obo).
