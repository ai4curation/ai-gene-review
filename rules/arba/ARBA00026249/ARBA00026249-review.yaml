review_summary: >-
  Accuracy: all three condition sets were examined and the annotation is correct for what they match.
  Set 1 rests on IPR005982 (Thioredoxin reductase), which InterPro2GO maps to GO:0004791 (thioredoxin-disulfide
  reductase (NADPH) activity); the FunFams of sets 2 and 3 each hold 18 Swiss-Prot proteins, all annotated
  to the term. Meaning and parsimony: the sets select one enzyme, thioredoxin reductase, in its low molecular
  weight form (sets 1 and 2) and its mammalian selenoprotein form (set 3), and the consequent is the defining
  activity, so the statement is coherent and at the right level. Most of the rule repeats InterPro2GO:
  every one of the 19539 UniProtKB entries matched by set 1 and of the 77 matched by set 3 carries an
  InterPro entry that already maps to the term, and only 136 of the 2641 entries matched by set 2 do not.
action: MODIFY
action_rationale: >-
  The rule says the right thing about the right family, but two of its three sets do no work that the
  InterPro2GO mappings of IPR005982, IPR006338 and IPR045870 do not already do. The specific change is
  to keep the part that adds annotations (set 2, 136 proteins) and drop the rest. Confidence is moderate
  because a duplicate true annotation does no harm, and leaving the rule alone is defensible.
suggested_modifications:
- >-
  Remove set 1 (IPR005982 AND IPR008255 AND IPR023753): all 19539 entries it matches receive GO:0004791
  from the InterPro2GO mapping of IPR005982.
- >-
  Remove set 3 (FunFam 3.50.50.60:FF:000190 in Glires): all 77 entries it matches carry IPR006338, which
  maps to GO:0004791 in InterPro2GO.
- >-
  Keep set 2 (FunFam 3.50.50.60:FF:000064 in Eukaryota), the only set that annotates proteins InterPro2GO
  misses (136 of 2641).
