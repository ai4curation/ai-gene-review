parsimony:
  assessment: REDUNDANT
  notes: >-
    rules/arba/_interpro2go.txt maps IPR005982 (Thioredoxin reductase), IPR006338 (Thioredoxin/glutathione
    reductase selenoprotein) and IPR045870 (TryX and NRX, thioredoxin domain) to GO:0004791. UniProtKB
    2026_04 counts of entries matched by a set and carrying none of the three: set 1, 0 of 19539; set
    2, 136 of 2641; set 3, 0 of 77. No other ARBA rule covers the sets (rule_redundancy.tsv covered_sets
    0). QuickGO lists 19807 annotations attributed to the rule, nearly all duplicating the InterPro2GO
    annotation of the same protein.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    Set 1 has no taxon condition, which fits an enzyme found in all domains. Eukaryota on set 2 and Glires
    on set 3 confine each FunFam to where its reviewed members are; Glires is narrower than the distribution
    of the selenoprotein form (all mammals), which is narrow coverage, not wrong annotation.
