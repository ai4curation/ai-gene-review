corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    Ribosomal proteins are cargo, not export factors, so annotating them with large-subunit export
    is a biological misconception, and the literature contradicts the rule.
  correction: >-
    For uL1 a curated experimental annotation says otherwise: SGD annotates RPL1A and RPL1B to GO:0000055
    by IMP. The only source given for the claim was the review's own research note.
  error_type: REFUTED_BY_CURATED_ANNOTATION
  evidence:
  - >-
    QuickGO: UniProtKB:P0CX43 (RPL1A) and UniProtKB:P0CX44 (RPL1B), GO:0000055, IMP, PMID:31439809,
    assigned by SGD.
  - >-
    PMID:31439809, title: The L1 stalk is required for efficient export of nascent large ribosomal
    subunits in yeast.
- date: '2026-11-10'
  withdrawn_claim: Only 12-28% of the targeted proteins carry the GO term, so the rule has poor 
    specificity.
  correction: >-
    Those percentages were computed for each FunFam on its own across all of Swiss-Prot. The rule
    requires two FunFams together with a taxon; the reviewed proteins that satisfy a whole condition
    set all carry the term.
  error_type: CONJUNCTION_IGNORED
  evidence:
  - >-
    UniProtKB release 2026_04: set 1 (both eL40 FunFams AND Saccharomycotina) matches 2 reviewed entries,
    set 2 (both uL1 FunFams AND Saccharomycetes) matches 4; all 6 carry GO:0000055.
- date: '2026-11-10'
  withdrawn_claim: >-
    InterPro entries IPR027312 and IPR037700 already cover this GO term more appropriately, so the
    rule is unnecessary.
  correction: >-
    Those entries are different protein families (Sda1 and nucleoporin NUP88/NUP82) and share no proteins
    with the rule's FunFams, so they cannot stand in for it.
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
  - 'InterPro API: IPR027312 name Sda1; IPR037700 name Nucleoporin NUP88/NUP82.'
  - >-
    The old file's own overlap table recorded intersection 0 between each of these entries and each
    FunFam of the rule.
- date: '2026-11-10'
  withdrawn_claim: The two conditions inside a condition set overlap by 64-90%, so the rule is 
    redundant.
  correction: >-
    Conditions within a set are combined with AND. Overlap between them is expected and does not make
    the set redundant.
  error_type: CONJUNCTION_IGNORED
  evidence:
  - >-
    UniProt ARBA API, ARBA00090252: each condition set lists two FunFam conditions and one taxon condition,
    all required.
- date: '2026-11-10'
  withdrawn_claim: The rule is restricted to Fungi (set 1) and Dikarya (set 2).
  correction: The live rule restricts set 1 to Saccharomycotina and set 2 to Saccharomycetes.
  error_type: STALE_RULE_VERSION
  evidence:
  - >-
    UniProt ARBA API, ARBA00090252, modified 2026-07-18: taxon conditions Saccharomycotina (NCBITaxon:147537)
    and Saccharomycetes (NCBITaxon:4891).
- date: '2026-11-12'
  withdrawn_claim: >-
    The rule is left undecided because nothing checked supports or excludes a role for eL40 in export,
    and a decision needs the yeast eL40 literature to be read.
  correction: >-
    SGD has read that literature: RPL40A is curated to GO:0000027 (ribosomal large subunit assembly) by
    IMP from PMID:22995916 and not to export. The rule's term for set 1 is therefore a term the curators
    did not assign, and set 1 should be removed or re-pointed.
  error_type: MEANING_NOT_JUDGED
  evidence:
  - >-
    QuickGO 2026-11-12: P0CH08 GO:0000027 IMP PMID:22995916 (SGD); GO:0000055 on P0CH08 only IEA from
    ARBA00090252.
  - 'QuickGO 2026-11-12: P0CX43 GO:0000055 IMP PMID:31439809 (SGD).'
