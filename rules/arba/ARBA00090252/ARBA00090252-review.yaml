parsimony:
  assessment: ACCEPTABLE
  notes: >-
    Two sets, each two FunFams and a taxon, matching 2 and 4 reviewed and 83 and 61 unreviewed entries.
    Neither is covered by another rule. The defect is set 1's consequent, not surplus conditions.
go_specificity:
  assessment: MISMATCHED
  notes: >-
    Appropriate for set 2. For set 1 the curated process is GO:0000027 (ribosomal large subunit assembly),
    a different branch.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    Saccharomycotina and Saccharomycetes bound the sets to the lineage of the yeast proteins on which
    the evidence was obtained. uL1 and eL40 are universal in eukaryotes, so this is narrow coverage that
    follows the training annotation, and is the cautious choice for a phenotype-derived process term.
