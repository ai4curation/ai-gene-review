review_summary: >-
  Accuracy: both live condition sets were examined. Set 2 (ribosomal protein uL1 in Saccharomycetes) is
  supported: Saccharomyces cerevisiae RPL1A and RPL1B carry GO:0000055 (ribosomal large subunit export
  from nucleus) with IMP evidence from SGD. Set 1 (ubiquitin-eL40 fusion proteins in Saccharomycotina)
  has no manual support: RPL40A and RPL40B carry the term only through this rule. Meaning and parsimony:
  the two sets select two unrelated ribosomal proteins, and the consequent fits only one of them. SGD
  curates eL40 from the paper that studied its role in 60S biogenesis to GO:0000027 (ribosomal large subunit
  assembly), which is not under the consequent, and did not annotate export. The rule is small and has
  no redundant set, but set 1 asserts a process that the curators who read the eL40 literature chose not
  to assert.
action: MODIFY
action_rationale: >-
  Set 2 is a coherent unit with a curated experimental annotation to the consequent. For set 1 the best
  curated term lies outside the consequent (P0CH08, GO:0000027 IMP PMID:22995916, SGD), and the only source
  of GO:0000055 on eL40 is this rule, so the set should be removed or re-pointed. A rule that then holds
  one protein in one class is a narrow but sound statement.
confidence: 0.7
suggested_modifications:
- >-
  Remove condition set 1 (CATH FunFams 3.10.20.90:FF:000014 and 4.10.1060.50:FF:000001 with taxon Saccharomycotina),
  or move it to a rule asserting GO:0000027 (ribosomal large subunit assembly), the term SGD curates on
  RPL40A.
- Keep condition set 2 (uL1 in Saccharomycetes) with GO:0000055.
