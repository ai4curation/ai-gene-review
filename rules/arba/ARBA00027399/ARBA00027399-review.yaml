review_summary: >-
  Accuracy: all 45 live condition sets were checked against Swiss-Prot. They match 292 reviewed entries
  and every one carries GO:0008236 (serine-type peptidase activity) or a descendant, 225 by manual evidence.
  Set 13 is wrong: it selects BMP1 and the tolloid-like proteins, which are zinc metalloproteases and
  carry a serine-type endopeptidase term only through a Reactome TAS annotation. Set 5 has the same contaminant:
  BMP1 (P13497) is one of its nine reviewed matches. Meaning and parsimony: of the 45 sets, 39 select
  serine endopeptidases (trypsin-fold coagulation, complement, kallikrein and granzyme proteases, subtilisin-like
  proprotein convertases, HtrA/DegP, rhomboid and others) whose members are curated to the child term
  GO:0004252 (serine-type endopeptidase activity). Three select tripeptidyl peptidases, curated to GO:0008240
  (tripeptidyl-peptidase activity); one selects carboxypeptidase Y, curated to GO:0004185 (serine-type
  carboxypeptidase activity); one selects L,D-transpeptidases, curated to GO:0071972 (peptidoglycan L,D-transpeptidase
  activity). The consequent is the parent that hides the endo/exo distinction every unit has. 21 sets
  are already covered by rules for those child terms and emit nothing.
action: SPLIT
action_rationale: >-
  The term is true of all but the metalloprotease matches, and less informative than the term each family
  is curated to. A rule made of 39 endopeptidase sets and 5 exopeptidase or transpeptidase sets should
  be four rules, each with the child term. Set 13 should be removed and set 5 tightened so that it no
  longer matches BMP1.
suggested_modifications:
- >-
  Sets 1 to 11, 14 to 20, 22, 23, 25 to 35 and 37 to 44 (serine endopeptidases): assert GO:0004252 (serine-type
  endopeptidase activity), or drop those already matched by a rule for that term.
- >-
  Sets 21, 24 and 45 (tripeptidyl-peptidase 1 and 2): assert GO:0008240 (tripeptidyl-peptidase activity).
- >-
  Set 36 (carboxypeptidase Y FunFam in Saccharomycotina): assert GO:0004185 (serine-type carboxypeptidase
  activity).
- >-
  Set 12 (L,D-transpeptidase YbiS FunFam in Bacteria): assert GO:0071972 (peptidoglycan L,D-transpeptidase
  activity).
- >-
  Remove condition set 13 (CATH FunFams 2.10.25.10:FF:000022 and 2.60.120.290:FF:000004 with taxon Haplorrhini),
  whose reviewed matches P13497, O43897 and Q9Y6L7 are metalloendopeptidases.
- >-
  Tighten condition set 5 (IPR000859 (CUB domain) AND PANTHER:PTHR24255 AND taxon Catarrhini), for example
  by adding a trypsin-domain signature: it matches P13497 (BMP1) beside C1r, C1s and the MASPs.
- >-
  Report upstream that the Reactome TAS annotation of GO:0004252 on P13497, O43897 and Q9Y6L7 (Reactome:R-HSA-2214330)
  is the source of the association.
