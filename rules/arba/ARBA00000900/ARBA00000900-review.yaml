corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule unifies RING, HECT and U-box ligases, which have fundamentally different catalytic mechanisms,
    and so is mechanistically incoherent.
  correction: >-
    The live rule has no HECT condition. RING and U-box ligases share the reaction of EC 2.3.2.27,
    direct transfer from the E2 to the substrate; HECT ligases have their own number, EC 2.3.2.26.
  error_type: UNEXAMINED_RULE
  evidence:
  - >-
    UniProt ARBA API, ARBA00000900, retrieved 2026-11-09: no condition on IPR000569 (HECT domain)
    or on a CATH FunFam of superfamily 3.30.2410.10; conditions on IPR001841 (Zinc finger, RING-type)
    and IPR003613 (U-box domain) are present.
  - >-
    Rule annotation: S-ubiquitinyl-[E2 ubiquitin-conjugating enzyme]-L-cysteine + [acceptor protein]-L-lysine
    = [E2 ubiquitin-conjugating enzyme]-L-cysteine + N(6)-ubiquitinyl-[acceptor protein]-L-lysine,
    EC 2.3.2.27.
  - 'UniProtKB release 2026_04: 131 reviewed entries carry EC 2.3.2.26.'
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule should be deprecated although its biological basis is sound and all targets share the
    activity.
  correction: >-
    If all targets share the activity the annotation is correct, and that is a reason to keep the
    rule. No wrongly annotated protein was named.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - >-
    UniProtKB release 2026_04: in the seven sets examined every reviewed match carries EC 2.3.2.27.
- date: '2026-11-10'
  withdrawn_claim: 298 condition sets create a high false positive risk and make the rule 
    unmaintainable.
  correction: The number of sets is not evidence about accuracy.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - >-
    UniProt ARBA API, ARBA00000900: 304 condition sets, 173 of them conjunctions of two or three conditions.
- date: '2026-11-10'
  withdrawn_claim: >-
    Applying the rule to bacteria is inappropriate because bacterial proteins lack a ubiquitin system.
  correction: >-
    The one bacterial set selects secreted effector ligases of Gammaproteobacteria that ubiquitinate
    host proteins, and their reviewed members carry EC 2.3.2.27.
  error_type: TAXON_MISREAD
  evidence:
  - >-
    Set 12: IPR029487 (Novel E3 ligase domain) AND IPR032675 (Leucine-rich repeat domain superfamily)
    AND taxon Gammaproteobacteria; 16 of 16 reviewed matches carry EC 2.3.2.27, for example D0ZPH9
    and P18014.
- date: '2026-11-10'
  withdrawn_claim: The rule lacks GO:0004842, the GO term equivalent to its EC number.
  correction: >-
    EC 2.3.2.27 is cross-referenced from GO:0061630 (ubiquitin protein ligase activity), a more specific
    term than GO:0004842 (ubiquitin-protein transferase activity). The rule has no GO annotation of
    its own; GO terms follow from the EC number.
  error_type: ONTOLOGY_MISREAD
  evidence:
  - >-
    QuickGO: GO:0061630 has EC cross-references 2.3.2.26, 2.3.2.27, 2.3.2.31, 2.3.2.33 and 2.3.2.36;
    GO:0004842 has none.
- date: '2026-11-12'
  withdrawn_claim: >-
    No verdict is given because the rule was sampled and not examined set by set; the sampled sets are
    sound.
  correction: >-
    The rule can be judged as a statement about one enzyme class. It is coherent for RING and U-box families,
    but a set of PIAS FunFams gives the ubiquitin transferase reaction to SUMO ligases, and set 12 covers
    effectors with a thioester mechanism. The first is a defect to remove.
  error_type: MEANING_NOT_JUDGED
  evidence:
  - >-
    UniProtKB search 2026-11-12: the three PIAS FunFams together match Q8N2W9, Q9JM05, F1R4C4 (reviewed)
    and 723 unreviewed entries, all 723 with EC 2.3.2.27.
  - 'UniProtKB 2026-11-12: P18014 ACT_SITE 357, Glycyl thioester intermediate.'
parsimony:
  assessment: ACCEPTABLE
  notes: >-
    UniProt ARBA API, 2026-11-12: 304 sets (131 with one condition, 90 with two, 83 with three); no set's
    conditions are a superset of another's, so none is trivially subsumed. Overlap between sets in matched
    proteins was not measured beyond the sample. rule_redundancy.tsv covers GO rules only.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    55 of 304 sets carry a taxon. In the sample, Streptophyta bounds the plant ATL family (set 5), Chordata
    bounds a set built on a fold-level beta-propeller entry (set 6), and Gammaproteobacteria bounds the
    secreted effector family (set 12). Each follows where the family occurs.
