review_summary: >-
  Accuracy: 7 of the 304 live condition sets were examined, the first six and the one bacterial set. They
  select RING-finger, U-box, Bre1, SIAH and plant ATL families and the bacterial novel E3 ligase effectors,
  and every reviewed match carries EC 2.3.2.27 (254 of 254, summed over sets). The rule contains no HECT-domain
  condition. The other 297 sets were not checked against proteins. Meaning and parsimony: EC 2.3.2.27
  names one enzyme class, RING-type E3 ubiquitin transferases, and six of the seven recorded sets select
  families of that class. Two units do not belong to it by mechanism. Set 12 selects IpaH/SspH-type bacterial
  effectors, which UniProt records as forming a glycyl thioester intermediate on an active-site cysteine,
  unlike RING and U-box ligases. And a scan of the names of all conditions in the live rule found one
  set built from three PIAS FunFams (not among the sets recorded here): it gives the ubiquitin transferase
  reaction to E3 SUMO-protein ligases, on the strength of the EC number that Swiss-Prot puts on PIAS4
  alone among the PIAS proteins.
action: MODIFY
action_rationale: >-
  The sampled RING and U-box sets are sound and the rule is a coherent statement about one enzyme class,
  apart from the two units named. The PIAS set propagates a ubiquitin-transfer reaction to SUMO ligases
  and should be removed; set 12 reproduces a curated EC assignment that fits the overall reaction but
  not the RING-type mechanism, and is flagged, not removed. The verdict rests on a seven-set sample plus
  a name scan of all 304 sets, hence the moderate confidence.
confidence: 0.55
suggested_modifications:
- >-
  Remove the condition set that requires CATH FunFams 1.10.720.30:FF:000009 (E3 SUMO-protein ligase PIAS4),
  2.60.120.780:FF:000002 (E3 SUMO-protein ligase PIAS4) and 3.30.40.10:FF:000003 (E3 SUMO-protein ligase
  PIAS2 isoform X1). It matches 3 reviewed PIAS4 orthologues (Q8N2W9, Q9JM05, F1R4C4) and 723 unreviewed
  entries, all of which carry EC 2.3.2.27. PIAS4 is a SUMO ligase (UniProt pathway: protein sumoylation);
  human PIAS1, PIAS2 and PIAS3 are given EC 2.3.2.- by Swiss-Prot.
- >-
  Report upstream that EC 2.3.2.27 on Q8N2W9 (PIAS4) is inconsistent with EC 2.3.2.- on O75925 (PIAS1),
  O75928 (PIAS2) and Q9Y6X2 (PIAS3).
- >-
  Set 12 (IpaH/SspH novel E3 ligase domain in Gammaproteobacteria): keep while Swiss-Prot assigns EC 2.3.2.27
  to these effectors, but note that their catalytic cysteine forms a ubiquitin thioester, so the RING-type
  class name does not describe them.
biological_meaning:
  assessment: COHERENT
  notes: >-
    Judged on the 7 recorded sets (the first six of the rule plus the bacterial set, chosen by the first
    pass) and on a scan of condition names across all 304 sets for SUMO, HECT, RBR and E2 terms, which
    found only the PIAS set. RING-finger and U-box families share the direct E2-to-substrate transfer
    that EC 2.3.2.27 describes. rule_redundancy.tsv has no row for catalytic activity rules.
  sets_examined_for_meaning: 7
