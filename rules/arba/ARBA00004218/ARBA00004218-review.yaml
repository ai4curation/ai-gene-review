review_summary: >-
  All 38 live condition sets are recorded. Three were checked against Swiss-Prot (sets 1, 2 and 4):
  each is a narrow conjunction defining one protein family, and the human member of each family carries
  a curated acrosome location in UniProt (CD46 and DLD experimentally, SCNN1A by similarity). Set
  3 is the zona-pellucida-binding protein family by its InterPro names. The other 34 sets were not
  checked against annotated proteins, so no verdict is given.
action: UNDECIDED
action_rationale: >-
  Three of 38 condition sets were checked and each reproduces a curated UniProt location. The remaining
  sets were not checked.
suggested_modifications:
- >-
  Check each remaining condition set against the Swiss-Prot subcellular location of its matched proteins.
- >-
  For set 2 (dihydrolipoamide dehydrogenase), decide whether a secondary location reported for sperm
  should be propagated to all chordate orthologues.
