  assessment: REDUNDANT
  notes: >-
    Each signature is used in one set only and no set is contained in another by its conditions. By matched
    proteins (UniProtKB 2026_04), set 5 has 338 entries and none outside set 19; no other set without
    a PANTHER subfamily condition is fully contained in the rest. Pairs of sets for the same family overlap
    heavily without being contained (set 16 has 6 of 194 entries outside set 2; set 18 has 13 of 191 outside
    set 4; set 15 has 5 of 702 outside set 1). The five negated taxon conditions repeated in 19 sets exclude
    nothing that a single Metazoa condition would not.
taxonomic_scope:
  assessment: TOO_BROAD
  notes: >-
    The acrosome is an organelle of animal sperm. Nineteen sets use Eukaryota minus Gnetales, Fungi, Magnoliopsida,
    Zygnematales and Dictyostelium, which leaves protists, algae and non-flowering plants in scope; for
    set 10 that admits 333 non-metazoan proteins. The other 19 sets use animal clades from Metazoa down
    to Murinae; the narrow ones (Muridae, Murinae, Myomorpha, Rodentia, Glires) follow where the reviewed
    proteins are, which is narrow coverage, not wrong annotation.
