review_summary: >-
  Accuracy: all 38 condition sets were turned into UniProtKB queries. In every set, every reviewed match
  carries a curated acrosome location, so the rule reproduces Swiss-Prot within animals. One set does
  not stay within animals: set 10 (MORN repeat-containing protein 3) is restricted only to Eukaryota minus
  five plant, fungal and amoebozoan taxa, and it puts the acrosome location on 333 proteins of trypanosomatids,
  alveolates and other protists, which have no acrosome. Meaning and parsimony: each set selects one family,
  and the shared statement is a location in an animal sperm organelle. For about fifteen sets the family
  is a widely expressed protein (dihydrolipoyl dehydrogenase, CDC42, RAB2, RAB6A, RACGAP1, golgin A1,
  the epithelial sodium channel alpha subunit, CD46 and others) whose acrosome location is a secondary
  site reported in sperm; the statement is true of the reviewed members but is not what those families
  are about. Set 5 adds no protein beyond set 19.
action: MODIFY
action_rationale: >-
  The rule is coherent as a location rule and agrees with curated locations for reviewed proteins, but
  it has specific defects: a taxon condition that does not follow the biology and produces wrong annotations
  for named non-metazoan proteins, and one set that does no work. These are fixable without touching the
  rest of the rule.
suggested_modifications:
- >-
  Set 10: replace the condition "Eukaryota, not Gnetales, Fungi, Magnoliopsida, Zygnematales or Dictyostelium"
  by Metazoa (or a narrower animal clade). It currently annotates 333 non-metazoan proteins, e.g. A0A088SGJ0
  (Leishmania panamensis) and A0A061JBB1 (Trypanosoma rangeli).
- >-
  Apply the same replacement to the other 18 sets that use this Eukaryota-minus-five-taxa construction
  (1, 3, 6, 7, 8, 11, 12, 15, 16, 21, 23, 29, 30, 31, 32, 34, 37, 38). None of them matches a non-metazoan
  entry today, so the change costs nothing and removes the exposure.
- >-
  Remove set 5 (IPR001806 AND IPR037874, Mammalia): all 338 entries it matches are matched by set 19.
- >-
  For the sets selecting widely expressed proteins (1, 2, 4, 5, 6, 15, 16, 17, 18, 19, 28, 34, 35, 36,
  37), consider whether a secondary sperm location should be the location an unreviewed orthologue receives;
  for dihydrolipoyl dehydrogenase (sets 2 and 16) the main location is the mitochondrial matrix.
confidence: 0.8
biological_meaning:
  assessment: COHERENT
  notes: >-
    Not a GO rule, so projects/ARBA_REVIEW/rule_redundancy.tsv has no row. Judged by whether the sets
    select families located in the acrosome: all 38 do, by the curated location of every reviewed match.
    The families are otherwise unrelated, which is expected of a location rule; about fifteen sets select
    widely expressed proteins for which the acrosome is a secondary location; the rest are mostly sperm
    and testis proteins for which it is the main statement. COHERENT is used here in the sense a location
    rule allows: the sets share the one property the consequent asserts, a curated acrosome location,
    and no unit has a more informative location term in its place. It is not a claim that the families
    are related, and it is not a precedent for process or function rules, where unrelated families under
    one term are HETEROGENEOUS or TRUE_BUT_UNINFORMATIVE. The 333 non-metazoan matches of set 10 are an
    accuracy defect of that set's taxon condition, recorded under annotation_assessments.
