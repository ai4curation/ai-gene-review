    The sample is 40 of the live condition sets, drawn with a seeded pseudo-random generator (Python random.Random(rule
    id).sample over the live set numbers); the sets are recorded in rule.condition_sets with their UniProtKB
    counts and curated terms. The 40 sets fall into eight units; in six the curated annotation is a specific
    descendant (33 of the 40 sets top under GO:0090304, nucleic acid metabolic process, and 6 under GO:0055086).
    Two units show the term fitting for reasons unrelated to nucleic acids: 2-oxoacid:ferredoxin oxidoreductases
    and ATP-citrate lyase qualify only through acetyl-CoA, and glyceraldehyde-3-phosphate dehydrogenase
    no longer qualifies at all. Covered-set figures are from rule_redundancy.tsv (799 sets in that snapshot);
    in the sample, 11 of 40 sets are matched exactly by a rule for a biological process term curated on
    their own members, which is a lower bound because only those terms were searched. Figures updated
    from rule_redundancy.tsv as rebuilt on 2026-11-12 from the rules UniProt serves now (773 condition
    sets): covered sets 711 in the earlier table, 706 now. Where the prose of this review quotes the earlier
    figure, this one replaces it.
