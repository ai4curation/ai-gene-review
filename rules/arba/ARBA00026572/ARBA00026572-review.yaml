    P00359, P00358, P00360) none. The rule yields no annotation in QuickGO (withFrom=ARBA:ARBA00026572,
    0 hits), so no wrongly annotated protein can be named. The other 733 sets were not examined.
corrections:
- date: '2026-11-10'
  withdrawn_claim: The rule should be deprecated because GO:0006139 is too broad; DNA repair, tRNA 
    aminoacylation and nucleotide biosynthesis terms should be used instead.
  correction: The proposed terms are descendants of GO:0006139, so the rule's annotation would be 
    true for those proteins. A true general term is not grounds for removal.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - QuickGO ancestors of GO:0006281, GO:0006418 and GO:0009165 each include GO:0006139
- date: '2026-11-10'
  withdrawn_claim: The literature contradicts the rule.
  correction: The only source cited was the reviewer's own manual notes file. No publication was 
    cited.
  error_type: UNSUPPORTED_SOURCE
  evidence:
  - Old literature_support cited only ARBA00026572-deep-research-manual.md
- date: '2026-11-10'
  withdrawn_claim: Sampling shows heterogeneous functional classes; taxonomic restrictions are 
    arbitrary.
  correction: The review recorded no condition sets, so neither statement can be checked.
  error_type: UNEXAMINED_RULE
  evidence:
  - 'Old review: rule.condition_sets empty, protein counts 0'
- date: '2026-11-10'
  withdrawn_claim: Because GO:0006139 is a universal process, taxon restrictions on the condition 
    sets are inappropriate.
  correction: A taxon condition narrows where a signature is trusted; it says nothing about how 
    widespread the process is.
  error_type: TAXON_MISREAD
  evidence:
  - 'Live rule: 773 condition sets, each a conjunction (rest.uniprot.org/arba/ARBA00026572, 2026-11-09)'
- date: '2026-11-10'
  withdrawn_claim: 781 condition sets make the rule unanalyzable and it should be rebuilt with at 
    most 12 sets per rule.
  correction: The number of alternative sets is not evidence that any of them is wrong.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'src/ai_gene_review/etl/rule_analysis.py: max_condition_sets: int = 12 (default of the overlap-analysis
    tool)'
- date: '2026-11-12'
  withdrawn_claim: >-
    The rule is undecided: no condition set was examined, and that the term is general is not a reason
    to deprecate.
  correction: >-
    Generality alone is not a reason, but the measurements are: the term has 1,374 descendants, 711 of
    799 sets are matched by rules for more specific terms, a sample of 40 sets shows each family carrying
    its own specific term, and the rule yields no annotation in QuickGO. Retiring it loses nothing.
  error_type: MEANING_NOT_JUDGED
  evidence:
  - >-
    projects/ARBA_REVIEW/rule_redundancy.tsv: ARBA00026572 go_descendants 1374, condition_sets 799, covered_sets
    711
  - >-
    QuickGO annotation search withFrom=ARBA:ARBA00026572: numberOfHits 0; goId=GO:0006139 goUsage=exact
    reference=GO_REF:0000117: numberOfHits 0 (2026-11-12)
  - >-
    Sampled sets and their curated terms in rule.condition_sets[].notes (UniProtKB and QuickGO, November
    2026)
parsimony:
  assessment: REDUNDANT
  notes: >-
    rule_redundancy.tsv: 799 condition sets, 711 of them matched by a rule asserting a more specific term
    (chiefly GO:0090304, GO:0034654 and GO:0055086). QuickGO annotation search withFrom=ARBA:ARBA00026572
    returns 0 annotations, and a search for the term with reference GO_REF:0000117 (ARBA) returns 0, so
    no set of the rule currently yields an annotation. Within the live rule no set duplicates or contains
    another (0 of 773), and all 40 sampled sets match UniProtKB entries; the redundancy is with other
    rules, not inside this one.
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    GO:0006139 (nucleobase-containing compound metabolic process) has 1,374 descendants (the project treats
    more than 200 as very general). Every sampled set with support is annotated to something far more
    specific, from GO:0006418 (tRNA aminoacylation for protein translation) to GO:0006396 (RNA processing)
    and GO:0006259 (DNA metabolic process).
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    637 of 773 sets have no taxon. Among the 40 sampled, the taxa mostly match lineage-specific families
    (bacterial sigma factors in Escherichia, archaeal oxidoreductases in Archaea and Thermoproteota, plant
    families in Streptophyta or Embryophyta); a few are narrower than the family (Primates for pseudouridine
    synthases in set 8, Mammalia for histidyl- and threonyl-tRNA synthetases in set 10), which is narrow
    coverage. Taxon scope is not what is wrong with this rule.
