review_summary: >-
  Accuracy: 40 of the 773 live condition sets were examined in this pass; the first pass had examined
  none. In 36 of them the Swiss-Prot matches carry an experimental annotation to a descendant of GO:0006139
  (nucleobase-containing compound metabolic process), and in 3 more (sets 221, 280 and 378) the only manual
  support is a NAS, TAS or IC annotation. One set has no support: set 278 selects yeast glyceraldehyde-3-phosphate
  dehydrogenases (P00359, P00358, P00360), whose curated process is GO:0006096 (glycolysis), which is
  not under the consequent in the current ontology. Meaning and parsimony: the consequent has 1,374 descendants
  and says only that a protein handles nucleic acids or nucleotides. The sampled sets resolve into RNA
  processing enzymes, aminoacyl-tRNA synthetases, DNA repair and replication factors, transcription factors,
  RNA decay enzymes and nucleotide metabolism enzymes, each with its own term, plus enzymes that reach
  the term only because acetyl-CoA counts as a nucleotide derivative. rule_redundancy.tsv counts 711 of
  799 sets as already matched by a rule for a more specific term, and QuickGO holds no annotation attributed
  to this rule at all.
action: SPLIT
action_rationale: >-
  The rule emits nothing: QuickGO returns 0 annotations for ARBA00026572 and no ARBA annotation to the
  term from any rule, so removing it loses no annotation. What it would say is uninformative for nearly
  every set, since the families it selects have specific terms that other ARBA rules already assert for
  most of them, and it is unsupported for at least one sampled set. The sets that no specific rule covers
  yet are better added to the rules for their own terms than kept under this one.
confidence: 0.7
suggested_modifications:
- >-
  Move the sets that no more specific rule matches to rules for their own terms, then retire what
  is left. The rule produces no annotation as it stands (QuickGO annotation search
  withFrom=ARBA:ARBA00026572, 0 hits), so nothing is lost meanwhile.
- >-
  The sets to move are those that no more specific rule matches (in the sample: 7, 10, 14, 74,
  124, 278, 282, 290, 449, 549, 727) and add those worth keeping to the rule for their own term, for example
  set 74 (DNA2) under GO:0006259 (DNA metabolic process) and set 549 (NAT10) under GO:0006396 (RNA processing).
- >-
  Do not carry over set 278 (glyceraldehyde-3-phosphate dehydrogenase, Saccharomycetes): its members have
  no curated annotation under the consequent.
