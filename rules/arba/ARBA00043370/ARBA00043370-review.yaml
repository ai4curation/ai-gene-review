review_summary: >-
  Accuracy: all 14 live condition sets were examined by retrieving the Swiss-Prot entries that match the
  whole conjunction and looking up their curated annotations. Every set has at least one Swiss-Prot match
  with an experimental annotation to GO:0140115 (export across plasma membrane) or an is_a/part_of descendant.
  In several sets only some reviewed matches are annotated, for example 4 of 47 in set 3 and 2 of 8 in
  set 12. The curator concern in geneontology/go-annotation issue 6140 could not be read, so the set it
  refers to is not identified. Meaning and parsimony: the 14 sets select unrelated exporter families that
  share only the direction of transport. They resolve into multidrug efflux transporters, plant ABCB auxin
  exporters, sodium-exporting pumps and exchangers, and fungal citrate exporters. Curated annotation gives
  the first three groups substrate-specific descendants: GO:1990961 (xenobiotic detoxification by transmembrane
  export across the plasma membrane), GO:0010315 (auxin export across the plasma membrane) and GO:0036376
  (sodium ion export across plasma membrane). Rules asserting those three terms already cover 7 of the
  14 sets (1, 3, 5, 9, 14; 2; 8), which therefore emit nothing here. What the substrate is, is the informative
  part of an export annotation, and the consequent leaves it out.
action: SPLIT
action_rationale: >-
  Each family has a better term than the parent, and for half the sets a rule asserting that better term
  already exists. The remaining sets should follow the same pattern: assert the substrate-specific term
  of their unit. Only the citrate exporter set, whose members are curated to GO:0140115 itself, has no
  narrower curated term. Confidence is moderate because the reviewed matches without annotations were
  not checked one by one and because two units have mixed substrates (sodium or potassium for the ENA
  ATPases, sodium or calcium for the exchangers).
suggested_modifications:
- >-
  Sets 1, 3, 5, 9 and 14 (bacterial and fungal multidrug exporters) are covered by ARBA00043467, which
  asserts GO:1990961 (xenobiotic detoxification by transmembrane export across the plasma membrane); remove
  them from this rule. Add set 6 (ABCG2, Metazoa) to that term: human ABCG2 (Q9UNQ0) is curated to it
  by IMP.
- >-
  Set 2 (plant ABCB, FunFam 1.20.1560.10:FF:000009) is covered by ARBA00092965, which asserts GO:0010315
  (auxin export across the plasma membrane); remove it here and move set 10 (ABCB6/ABCB20) to that term.
- >-
  Set 8 (Na+/K+-ATPase alpha, Primates) is covered by ARBA00089462, which asserts GO:0036376 (sodium ion
  export across plasma membrane); remove it here and move sets 7, 11 and 13 (ENA P-type ATPases, fungal
  Na+/H+ antiporter) to that term. Set 4 (Na+/Ca2+ exchangers, Rattus) fits GO:0036376 for Slc8a1 and
  GO:1990034 (calcium ion export across plasma membrane) for Slc8a2 and Slc8a3, and needs a decision between
  them.
- >-
  Set 12 (MFS citrate exporter cexA family, Pezizomycotina): keep GO:0140115 (export across plasma membrane);
  no narrower curated term was found.
