    The covered MFS, ABC and P-type ATPase transporters may import, export or work bidirectionally at
    various membranes, so direction and location cannot be inferred.
  correction: >-
    The claim was made about superfamily names without reading the condition sets. Each live set is a
    narrow conjunction whose reviewed members are experimentally annotated to export across the plasma
    membrane.
  error_type: UNEXAMINED_RULE
