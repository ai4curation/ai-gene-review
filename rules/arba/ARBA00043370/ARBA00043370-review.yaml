review_summary: >-
  All 14 live condition sets were examined by retrieving the Swiss-Prot entries that match the whole conjunction
  and looking up their curated annotations. Every set has at least one Swiss-Prot match with an experimental
  annotation to GO:0140115 or an is_a/part_of descendant: xenobiotic detoxification by transmembrane export
  across the plasma membrane (GO:1990961), sodium, potassium or calcium ion export across plasma membrane
  (GO:0036376, GO:0097623, GO:1990034), auxin export across the plasma membrane (GO:0010315) and L-cysteine
  export across plasma membrane (GO:0033228). In several sets only some of the reviewed matches are annotated;
  for example 4 of 47 in set 3 and 2 of 8 in set 12. The check uses Swiss-Prot, the source ARBA rules
  are mined from, and does not measure precision on unreviewed entries. The curator concern in geneontology/go-annotation
  issue 6140 could not be read during this review, so the set or protein it refers to is not identified
  here.
action: ACCEPT
action_rationale: >-
  Each condition set is a narrow conjunction, usually with a taxon condition, and each has reviewed members
  with experimental evidence of export across the plasma membrane. The parent term is true of all of them
  and is less specific than the substrate-specific terms the reviewed members carry. Confidence is moderate
  because the unannotated reviewed matches were not checked individually and the cited curator issue was
  not available.
suggested_modifications:
- >-
  No change to the rule is proposed. If the matter raised in geneontology/go-annotation issue 6140 concerns
  a specific protein, identify which of the 14 sets matches it and assess that set alone.
