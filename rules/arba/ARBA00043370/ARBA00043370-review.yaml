id: ARBA00043370
description: >-
  Assigns GO:0140115 (export across plasma membrane) through 14 alternative condition sets that identify
  efflux transporters: bacterial SMR and Emr multidrug exporters, fungal MFS and ABC drug exporters, plant
  ABCB auxin transporters, metazoan ABCG2, sodium-exporting P-type ATPases, Na+/K+-ATPase alpha subunits,
  fungal Na+/H+ antiporters and Na+/Ca2+ exchangers.
