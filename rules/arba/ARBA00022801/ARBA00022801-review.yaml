  created_date: '2020-05-12'
  modified_date: '2026-07-18'
  retrieved_date: '2026-11-09'
  source_condition_set_count: 4171
review_summary: >-
  The live rule has 4171 condition sets and UniProt reports 10,279,889 unreviewed proteins for it.
  Four sets (1-4) were examined: by the official InterPro names they describe DEAD-box helicases,
  dUTPase and the tetrahydrofolate dehydrogenase/cyclohydrolase family, all of which are hydrolases.
  No false positive has been identified. 4167 sets were not examined, so no verdict is given.
action: UNDECIDED
action_rationale: >-
  Only 4 of 4171 condition sets were examined, and all four are sound. Nothing verified shows a wrong
  annotation, and nothing verified covers the rest of the rule.
suggested_modifications:
- >-
  Examine a sample of condition sets against Swiss-Prot keyword use before recommending any change.
annotation_assessments:
- annotation_kind: KEYWORD
  value: KW-0378
  label: Hydrolase
  assessment: UNDECIDED
  matched_protein_count: 10279889
  notes: >-
    matched_protein_count is the unreviewedProteinCount reported by rest.uniprot.org/arba/ARBA00022801
    on 2026-11-09. Sets 1-4 name hydrolase families by their official InterPro names (IPR014014, IPR027417,
    IPR033704, IPR036157, IPR000629, IPR001650, IPR011545, IPR000672, IPR020630). No individual protein
    was checked.
corrections:
- date: '2026-11-10'
  withdrawn_claim: The rule includes non-hydrolytic domains (kinases, GTPase-activating proteins).
  correction: >-
    The four recorded condition sets carried wrong InterPro names. With the official names all four
    describe hydrolases, so no non-hydrolytic family has been shown in the rule.
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
  - >-
    InterPro API: IPR014014 = RNA helicase, DEAD-box type, Q motif (was labelled Beta-lactamase class
    A)
  - >-
    InterPro API: IPR033704 = dUTPase, trimeric; IPR036157 = dUTPase-like superfamily (were labelled
    beta-lactamase entries)
  - >-
    InterPro API: IPR000629 = ATP-dependent RNA helicase DEAD-box, conserved site (was labelled ATP/GTP-binding
    site motif A)
  - >-
    InterPro API: IPR000672 = Tetrahydrofolate dehydrogenase/cyclohydrolase; IPR020630 = Tetrahydrofolate
    dehydrogenase/cyclohydrolase, catalytic domain (were labelled GTPase-activating protein and Tyrosine-protein
    kinase, catalytic domain)
- date: '2026-11-10'
  withdrawn_claim: 4070 condition sets make the rule unmanageable and it should be removed.
  correction: >-
    The number of condition sets says nothing about whether the keyword is correct for the matched
    proteins.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'rest.uniprot.org/arba/ARBA00022801, 2026-11-09: 4171 condition sets'
- date: '2026-11-10'
  withdrawn_claim: The rule likely produces more false positives than useful annotations.
  correction: >-
    No false positive was identified; only four condition sets had been read, and the fourth was recorded
    without its PANTHER condition.
  error_type: UNEXAMINED_RULE
  evidence:
  - 'Live set 4: IPR000672 AND IPR020630 AND PTHR48099:SF5'
- date: '2026-11-10'
  withdrawn_claim: Literature contradicts the rule.
  correction: >-
    The only sources were the review's own notes and two papers that do not discuss this rule; the
    literature assessment is removed.
  error_type: UNSUPPORTED_SOURCE
  evidence:
  - No publication on ARBA00022801 or on KW-0378 assignment was cited
