parsimony:
  assessment: ACCEPTABLE
  notes: >-
    Each signature is used in exactly one set (3300 FunFam, 2049 InterPro and 610 PANTHER conditions;
    2940 sets are a single signature) and no set is contained in another by its conditions. 4170 of 4171
    sets match reviewed entries (median 7 per set); one matches none: set 389, which matches no UniProtKB
    entry at all because its taxon condition (Flaviviridae) no longer contains the hepatitis C virus proteins
    its signature selects. 1759 sets share their signatures with a set of a rule for a narrower keyword
    under Hydrolase; because an entry carries both keywords, these are not dead sets. Overlap between
    sets by matched proteins was not measured. keyword_redundancy.tsv: 1,759 of 4,171 condition sets are
    also matched by a rule for a descendant keyword (Protease 758, Nuclease 362, Glycosidase 284, Helicase
    221 and others; a set can be covered by more than one). Keywords from different rules stack on a protein,
    so these sets still emit this keyword; they are redundant only if the parent keyword could be derived
    from the child, which is not established.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    478 of 4171 sets carry a taxon condition. Hydrolases occur in all life; in the 44 sets examined in
    detail no restriction excluded a lineage whose reviewed members carry the keyword. Not assessed set
    by set beyond that.
