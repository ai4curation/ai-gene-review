review_summary: >-
  Accuracy: all 4171 served condition sets were compared with Swiss-Prot keyword use. 4170 sets match
  reviewed entries, and in all but one of them every reviewed match carries the keyword Hydrolase (130233
  of 130239 reviewed matches summed over sets). The exception is set 2549, two FunFams whose reviewed
  members are translin: none of the six carries the keyword, yet the 1160 unreviewed translins it matches
  all receive Hydrolase from this rule. One set (389) matches no UniProtKB entry at all. The 44 sets recorded
  here in detail (four from the first pass and a random sample of 40) all agree with Swiss-Prot. Meaning
  and parsimony: the rule does what its label says, selecting hydrolase families one by one and giving
  them the class-level keyword. The keyword is broad by design; UniProt keywords are hierarchical and
  an entry carries the class keyword beside a narrower one, so the 1759 sets that are also condition sets
  of rules for narrower keywords (Protease 689, Nuclease 355, Glycosidase 284, Helicase 201, Protein phosphatase
  141 and others) still do work.
action: MODIFY
action_rationale: >-
  On reviewed evidence the rule is accurate in every set but one and coherent as a class-level keyword
  rule; its size is the size of the enzyme class. The specific defects are set 2549, which labels translin
  a hydrolase against curated usage, and set 389, which cannot fire. Confidence is moderate because the
  check is the keyword of reviewed entries, not an inspection of the 10 million unreviewed entries the
  rule annotates.
suggested_modifications:
- >-
  Remove set 2549 (FunFam 1.20.58.190:FF:000001 AND FunFam 1.20.58.200:FF:000002): its reviewed members
  are translin, which Swiss-Prot does not label Hydrolase (0 of 6); the curated function of human translin
  (Q15631) within the Translin-TRAX complex is single-stranded RNA binding. The same two FunFams should
  be checked in the Nuclease and Endonuclease keyword rules ARBA00022722 and ARBA00022759, which annotate
  the same unreviewed translins.
- >-
  Set 389 (IPR002166 AND Flaviviridae) matches no UniProtKB entry: IPR002166 (RNA dependent RNA polymerase,
  hepatitis C virus) is found on 7769 entries, all now classified outside Flaviviridae (hepatitis C virus
  is in Hepaciviridae in the current taxonomy). Remove the set, or repoint its taxon condition if the
  keyword is wanted on these polyproteins.
confidence: 0.7
biological_meaning:
  assessment: COHERENT
  notes: >-
    Not a GO rule, so projects/ARBA_REVIEW/rule_redundancy.tsv has no row. Judged by whether the sets
    select members of the enzyme class the keyword names. Units were assigned for 45 sets: the four recorded
    by the first pass, 40 drawn at random (Python random.sample over set numbers 1-4171, seed 4) and the
    one set the full scan flagged. In the 44 unflagged sets each selects one hydrolase family whose reviewed
    members all carry the keyword, and the keyword count holds across all 4169 other sets that match Swiss-Prot
    entries. Narrower keywords under Hydrolase are assigned alongside it, not in its place, so the class-level
    keyword does not hide a better label.
  sets_examined_for_meaning: 45
  sets_covered_by_more_specific_rule: 1759
