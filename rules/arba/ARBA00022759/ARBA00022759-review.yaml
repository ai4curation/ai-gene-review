review_summary: >-
  11 of the 320 live condition sets were examined: the first six and five that contain a domain shared
  with non-nuclease proteins. In each of the eleven, every reviewed match carries the Endonuclease
  keyword (4008 of 4008, summed over sets). The five sets with a broadly shared domain each pair it
  with a signature for a known endonuclease: FEN1, the nidovirus NendoU domain, UV-damage endonuclease
  UvdE, plant MORC proteins and retroviral polymerase polyproteins. The remaining 309 sets were not
  examined.
action: UNDECIDED
action_rationale: >-
  The rule was sampled, not examined set by set, so no verdict is given. The sampled sets are sound,
  which removes the grounds of the earlier verdict but does not establish that every set is right.
  The counts are from Swiss-Prot, which is also what ARBA learns its rules from, so they show the
  condition sets are coherent rather than giving an independent error rate for unreviewed entries.
annotation_assessments:
- annotation_kind: KEYWORD
  value: KW-0255
  label: Endonuclease
  assessment: UNDECIDED
  correct_examples:
  - P0A898
  - P58557
  - P39749
  - Q10988
  - Q84WV6
  notes: >-
    UniProtKB release 2026_04, reviewed entries matching a set and carrying KW-0255: set 2, P0A898
    (Escherichia coli ybeY) and P58557 (human YBEY); set 13, P39749 (mouse Fen1); set 52, Q10988 (Schizosaccharomyces
    pombe uve1); set 97, Q84WV6 (Arabidopsis MORC1). Per-set counts are in the condition set notes.
corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    A condition set combines the SRP54-type GTPase domain with a ribosomal protein S30AE signature;
    these are ribosomal and signal recognition particle domains, not endonucleases, and show the rule
    produces false positives.
  correction: >-
    Both identifiers were given the names of other entries. The set is IPR002036 (Endoribonuclease
    YbeY) AND IPR023091 (Metalloprotease catalytic domain superfamily, predicted), which selects the
    YbeY endoribonuclease family.
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
  - >-
    InterPro API: IPR002036 name Endoribonuclease YbeY; IPR023091 name Metalloprotease catalytic domain
    superfamily, predicted.
  - >-
    UniProtKB release 2026_04: 711 reviewed entries match set 2 and all 711 carry keyword KW-0255,
    for example P0A898 and P58557.
- date: '2026-11-10'
  withdrawn_claim: IPR001352 is a papain-like protease domain entry.
  correction: IPR001352 is the Ribonuclease HII/HIII family; set 1 selects RNase HII and HIII.
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
  - 'InterPro API: IPR001352 name Ribonuclease HII/HIII.'
  - 'UniProtKB release 2026_04: 797 reviewed entries match set 1 and all carry keyword KW-0255.'
- date: '2026-11-10'
  withdrawn_claim: >-
    Several domains in the rule belong to non-nuclease proteins (SAM-dependent methyltransferases,
    histidine kinases, xylose isomerases, PIN-like domains), so the rule annotates non-nucleases.
  correction: >-
    Each of those domains occurs only inside a conjunction with a signature specific to an endonuclease.
    The domain was judged alone, without the other conditions of its set.
  error_type: CONJUNCTION_IGNORED
  evidence:
  - >-
    Set 35: IPR009461 AND IPR029063 AND IPR043609 (NendoU domain, nidovirus); 35 of 35 reviewed matches
    carry KW-0255.
  - >-
    Set 52: IPR004601 (UV-endonuclease UvdE) AND IPR036237 AND PANTHER:PTHR31290:SF5; 21 of 21.
  - 'Set 13: IPR029060 AND PANTHER:PTHR11081:SF9, FLAP ENDONUCLEASE 1; 188 of 188.'
  - >-
    Set 97: IPR036890 AND IPR041006 AND taxon Streptophyta; 7 of 7, for example Q84WV6 (MORC1).
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule must be removed because 318 condition sets make it impossible to review and the Endonuclease
    category is too broad to be meaningful.
  correction: >-
    The number of sets is not evidence of error, and a broad keyword that is true of a protein is
    not a wrong annotation. No protein wrongly given the keyword was identified.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - >-
    UniProt ARBA API, ARBA00022759, retrieved 2026-11-09: 320 condition sets, 222 of them conjunctions
    of two or three conditions.
- date: '2026-11-10'
  withdrawn_claim: The rule is deficient because it assigns a keyword and not GO terms.
  correction: >-
    The rule's consequent is a UniProt keyword by design. The absence of a GO term is not a defect
    of a keyword rule.
  error_type: OTHER
  evidence:
  - 'UniProt ARBA API, ARBA00022759: single annotation, keyword KW-0255 Endonuclease.'
- date: '2026-11-10'
  withdrawn_claim: The literature contradicts the rule.
  correction: >-
    The only sources given were the review's own research notes, which describe diversity among nucleases.
    No publication was cited that shows a matched protein is not an endonuclease.
  error_type: UNSUPPORTED_SOURCE
  evidence:
  - >-
    The old literature_support block cited only rules/arba/ARBA00022759/ARBA00022759-deep-research-manual.md.
