parsimony:
  assessment: ACCEPTABLE
  notes: >-
    UniProt ARBA API, 2026-11-12: 320 sets, none whose conditions are a superset of another's. 250 of
    the 320 sets also occur verbatim in ARBA00022722 (Nuclease, KW-0540), the parent keyword; that redundancy
    is the parent rule's, since no UniProtKB entry carries KW-0255 without KW-0540. Sets 5 and 6 both
    address RNase III with different signatures. Set 10 is not redundant but too loose.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    116 of 320 sets carry a taxon. In the sample, Streptophyta on set 97 bounds a fold-level ATPase entry
    to plant MORC proteins, and Pararnavirae on set 10 bounds the reverse transcriptase domain to reverse-transcribing
    viruses; the taxon is right, the domain is the problem.
