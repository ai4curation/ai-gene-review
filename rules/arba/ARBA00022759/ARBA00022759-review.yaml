review_summary: >-
  Accuracy: 11 of the 320 live condition sets were examined, the first six and five that contain a domain
  shared with non-nuclease proteins. In each, every reviewed match carries the Endonuclease keyword KW-0255
  (4008 of 4008, summed over sets). The remaining 309 sets were not checked against proteins. Meaning
  and parsimony: the keyword names an enzyme class, and ten of the eleven recorded sets select a family
  whose signature is that of the nuclease itself (RNase HII, YbeY, RuvC, RNase P protein, RNase III, FEN1,
  NendoU, UvdE, plant MORC). Set 10 is different: its only signature is the reverse transcriptase domain,
  in Pararnavirae, and it reaches the keyword because full-length retroviral and pararetroviral polymerase
  polyproteins also contain RNase H. Of the 30500 unreviewed entries it matches, 28740 are fragments and
  20788 are at most 400 residues long with no RNase H signature, so the set labels reverse transcriptase
  fragments as endonucleases.
action: MODIFY
action_rationale: >-
  The rule is a coherent statement about one enzyme class for the sets built on nuclease signatures. Set
  10 selects the wrong domain: the condition is sufficient for "is a retroelement polymerase" but not
  for "contains an endonuclease", and most of what it matches are short fragments. That is a specific
  set to tighten. The verdict rests on 11 of 320 sets, hence the moderate confidence.
confidence: 0.55
suggested_modifications:
- >-
  Tighten condition set 10 (IPR043128 (Reverse transcriptase/Diguanylate cyclase domain) AND taxon Pararnavirae)
  by requiring an RNase H signature such as IPR002156 (Ribonuclease H domain) or IPR012337 (Ribonuclease
  H-like superfamily), or exclude fragments. Note that 78 of its 204 reviewed matches have none of IPR002156,
  IPR012337 or IPR036397 (Ribonuclease H superfamily), so a replacement condition needs checking against
  hepadnavirus and caulimovirus polymerases first.
biological_meaning:
  assessment: COHERENT
  notes: >-
    Judged on the 11 recorded sets (first six, plus five the first pass chose because they contain a widely
    shared domain). Ten select endonuclease families by a nuclease signature. Set 10 is the exception
    and is treated as a defect. rule_redundancy.tsv has no row for keyword rules.
  sets_examined_for_meaning: 11
