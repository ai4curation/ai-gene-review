parsimony:
  assessment: ACCEPTABLE
  notes: >-
    Each signature is used in exactly one set (309 FunFam, 157 InterPro and 35 PANTHER conditions over
    335 sets; 220 sets are a single signature) and no set is contained in another by its conditions. Every
    set matches reviewed entries. Overlap by matched proteins was not measured, so some sets may add nothing
    beyond others, as sets 1 and 2 (both DEAD-box signatures, 1035 and 924 reviewed matches) suggest.
    No single InterPro entry covers all helicase superfamilies, so a multi-set rule is needed.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    244 sets are unrestricted and 91 carry a taxon condition, including virus taxa for viral helicase
    FunFams (Papovaviricetes, Pisuviricota, Begomovirus) and Bacillati or Fungi for lineage-specific FunFams.
    Helicases occur in all cellular life and many viruses; no restriction was found that excludes a lineage
    where reviewed members of the set carry the keyword.
