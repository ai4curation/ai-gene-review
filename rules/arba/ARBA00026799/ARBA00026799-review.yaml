review_summary: All five condition sets of the rule as served on 2026-11-10 were turned into UniProtKB
  queries. In every set the reviewed matches are NAD kinases by curated EC number (698 of 704 across the
  sets), and sets 1 and 5 include members with experimental GO:0003951 annotations. The one soft spot
  is in set 1, which also matches the mitochondrial NADH kinase POS5 and its S. pombe ortholog; these
  are curated as NADH kinases (EC 2.7.1.86), and NAD+ kinase activity is not annotated for POS5.
action: ACCEPT
action_rationale: Each condition set selects the NAD kinase family, and the consequent is the family's
  defining activity. The NADH kinase members of set 1 are few (3 of 541 reviewed matches), belong to the
  same family, and are not shown to lack NAD+ kinase activity, so they do not justify a change. The counts
  are from reviewed entries, which the rule was derived from; unreviewed matches were counted, not inspected.
go_specificity:
  assessment: APPROPRIATE
  notes: GO:0003951 (NAD+ kinase activity) is the activity named by EC 2.7.1.23, which the reviewed matches
    carry. GO:0042736 (NADH kinase activity) is a separate term for the EC 2.7.1.86 reaction.
