review_summary: >-
  Accuracy: all five condition sets of the rule as served on 2026-11-10 were turned into UniProtKB queries.
  In every set the reviewed matches are NAD kinases by curated EC number (698 of 704 across the sets),
  and sets 1, 4 and 5 include members with experimental GO:0003951 (NAD+ kinase activity) annotations.
  The soft spot is in set 1, which also matches the mitochondrial NADH kinase POS5 and its S. pombe ortholog,
  curated as NADH kinases (EC 2.7.1.86). Meaning and parsimony: the sets select one enzyme family, NAD
  kinase, including the metazoan mitochondrial NADK2 branch, and the consequent is its defining activity.
  Nearly all of the rule repeats InterPro2GO, which maps IPR002504 (NAD kinase) to the same term: sets
  1, 2 and 3 match no entry without that mapping, set 4 matches 6 and set 5 matches 45.
action: MODIFY
action_rationale: >-
  The statement is coherent and at the right level. The defect is redundancy: three of five sets annotate
  nothing that the InterPro2GO mapping of IPR002504 (or IPR017437) does not already annotate, and the
  whole rule adds 51 proteins. The specific change is to drop the sets that do no work. Confidence is
  moderate because the duplicated annotations are true, and leaving the rule alone is defensible.
suggested_modifications:
- >-
  Remove sets 1, 2 and 3: every entry they match (27802, 1600 and 1073 in UniProtKB 2026_04) carries IPR002504
  or IPR017437, both mapped to GO:0003951 by InterPro2GO.
- Keep sets 4 and 5, which annotate 6 and 45 entries that lack both InterPro mappings.
- >-
  Independently of this rule, the POS5-type NADH kinases (Q06892, Q9UT98) receive NAD+ kinase activity
  through IPR002504; that is a question for the InterPro2GO mapping.
