parsimony:
  assessment: PARSIMONIOUS
  notes: >-
    Two sets of one signature plus one taxon each, sharing no reviewed match (5 and 19 entries). rule_redundancy.tsv
    reports 0 of 2 sets covered by a more specific rule. The two InterPro2GO mappings to GO:0004438 in
    rules/arba/_interpro2go.txt, IPR039802 (Myotubularin-related protein 14) and IPR046352 (MTMR3, protein
    tyrosine phosphatase domain), cover MTMR14 and MTMR3 only, so no single InterPro entry replaces the
    rule. The fault is too little condition in set 2, not too much.
go_specificity:
  assessment: APPROPRIATE
  notes: >-
    GO:0004438 is a leaf term and is the term curators use for these enzymes. Several members also carry
    GO:0052629 (phosphatidylinositol-3,5-bisphosphate 3-phosphatase activity), a different activity that
    is not a descendant of the consequent.
