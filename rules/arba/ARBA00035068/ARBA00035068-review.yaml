review_summary: 'Both live condition sets were checked against Swiss-Prot. Set 1 is supported: its 5 reviewed matches
  all carry GO:0004438 with non-electronic evidence. Set 2 is not specific to myotubularins. Of its 19 reviewed
  matches, 6 are MTMR3 or MTMR4 experimentally annotated to GO:0004438, for example Q9NYA4 MTMR4 by IDA from PMID:11302699, and 13 are
  insect Lst2 homologues that have a FYVE domain but no phosphatase domain and carry GO:0004438 only from this rule
  (e.g. Q9VB70, IEA GO_REF:0000117 with ARBA:ARBA00035068). In UniProtKB as a whole, 126 of 3192 matches of set
  2 (3.9%) lack the myotubularin phosphatase domain IPR010569.'
action: MODIFY
action_rationale: Set 2 rests on a FunFam of the FYVE zinc-finger region, which MTMR3 and MTMR4 share with unrelated
  FYVE proteins. The rule therefore assigns a phosphatase activity to Lst2 homologues that have no phosphatase domain.
  Set 1 is sound.
suggested_modifications:
- Add InterPro IPR010569 (Myotubularin-like, phosphatase domain) as a required condition of set 2. This keeps 3066
  of the 3192 UniProtKB matches and removes the 126 that lack the phosphatase domain, including the Lst2 homologues.
condition_overlap:
  assessment: NONE
  notes: The two FunFams share no Swiss-Prot protein (intersection 0 in the recorded entries).
taxonomic_scope:
  assessment: TOO_NARROW
  notes: Set 1 is limited to Primates, but all 15 Swiss-Prot members of FunFam 2.30.29.30:FF:000038 in any taxon
    (human, mouse, rat, bovine, chicken, Xenopus, zebrafish, orangutan) carry GO:0004438. The restriction costs
    coverage; it does not cause wrong annotation.
