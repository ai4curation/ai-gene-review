review_summary: >-
  Accuracy: both live condition sets were checked against Swiss-Prot. Set 1 is supported: its 5 reviewed
  matches (MTM1, MTMR1, MTMR2) all carry GO:0004438 (phosphatidylinositol-3-phosphate phosphatase activity)
  with non-electronic evidence. Set 2 is not specific to myotubularins. Of its 19 reviewed matches, 6
  are MTMR3 or MTMR4 experimentally annotated to the term, for example Q9NYA4 by IDA from PMID:11302699,
  and 13 are insect Lst2 homologues that have a FYVE domain but no phosphatase domain and carry the term
  only from this rule. In UniProtKB 126 of 3192 matches of set 2 lack IPR010569 (Myotubularin-like, phosphatase
  domain). Meaning and parsimony: the intended units are two branches of the myotubularin family, and
  GO:0004438 is the most informative molecular function term curated on both, with no descendants in GO.
  For those units the rule is coherent and minimal. Set 2 also selects a third, unrelated unit, the Lst2
  FYVE proteins, whose curated function is phosphatidylinositol-3-phosphate binding and not hydrolysis,
  because its only signature is a FunFam of the FYVE region.
action: MODIFY
action_rationale: >-
  The term is at the right level and the rule is small; the defect is specific. Set 2 rests on a FunFam
  of the FYVE zinc-finger region that MTMR3 and MTMR4 share with Lst2 homologues, so it assigns a phosphatase
  activity to proteins without a phosphatase domain. Requiring the phosphatase domain restores a single-family
  rule.
suggested_modifications:
- >-
  Add InterPro IPR010569 (Myotubularin-like, phosphatase domain) as a required condition of set 2. This
  keeps 3066 of the 3192 UniProtKB matches and removes the 126 that lack the phosphatase domain, including
  the Lst2 homologues.
- >-
  Optionally widen set 1 beyond Primates: all 15 Swiss-Prot members of FunFam 2.30.29.30:FF:000038 in
  any taxon carry GO:0004438.
biological_meaning:
  assessment: HETEROGENEOUS
  notes: >-
    Three units: MTM1/MTMR1/MTMR2 (set 1) and MTMR3/MTMR4 (set 2), for both of which the consequent is
    the curated term, and Lst2 FYVE proteins (set 2), for which it is false. With the suggested extra
    condition the rule becomes coherent. GO:0004438 has no descendants, and no other ARBA rule covers
    either set with a more specific term.
