  notes: >-
    Eleven of the thirteen units examined carry a curated descendant of the consequent that names their
    actual role; the consequent is their only common ancestor. One unit (FGF receptors) fits only by phenotype
    annotation, and one (CodY, sets 34 and 58) has no curated term under the consequent on its best-studied
    member. The sample is the 26 recorded sets whose signature labels name a family unambiguously; one
    member per unit was looked up in QuickGO.
