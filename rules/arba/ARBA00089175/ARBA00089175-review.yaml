review_summary: >-
  The single condition set was examined. It matches 116 UniProtKB proteins, all metazoan, including
  human, mouse and rat PLEKHM1. Human and mouse PLEKHM1 are experimentally annotated to GO:0032418
  lysosome localization, which is an is_a child of the rule's term GO:1990849. The rule is therefore
  correct for what it matches but asserts the parent of the term the evidence supports.
action: MODIFY
action_rationale: >-
  The matched family is PLEKHM1 in animals, where the organelle is the lysosome and the experimental
  annotations are to lysosome localization. No matched protein lies outside Metazoa, so the generic
  vacuolar term gains nothing.
suggested_modifications:
- >-
  Replace the consequent GO:1990849 vacuolar localization with its child GO:0032418 lysosome localization.
parsimony:
  assessment: ACCEPTABLE
  notes: >-
    The two FunFams co-occur in the same three Swiss-Prot proteins (recorded Jaccard 1.0), so the
    second adds no discrimination there; it does no harm.
