review_summary: >-
  Accuracy: all 52 live condition sets were examined by retrieving the Swiss-Prot entries that match the
  whole conjunction and looking up their curated annotations to GO:0006401 (RNA catabolic process) and
  its is_a/part_of descendants. In 51 sets at least one Swiss-Prot match has an experimental annotation;
  the exception is set 28 (pelota FunFams), whose two matches carry GO:0070481 (nuclear-transcribed mRNA
  catabolic process, non-stop decay) by IEP only. Helicases, nucleotidyltransferases and RNA-binding proteins
  in the rule take part in decay pathways, which is what a process term records. Meaning and parsimony:
  the 52 sets resolve into eleven units, and for nine of them curated annotation uses a more specific
  descendant of the consequent: decapping, poly(A) tail shortening, deadenylation-dependent decay, nonsense-mediated
  decay, polyadenylation-dependent ncRNA decay, polyuridylation-dependent mRNA decay, miRNA catabolism,
  nuclear RNA surveillance and mitochondrial RNA catabolism. Only the exosome and its helicase cofactors
  are curated at the level of the consequent itself. Rules asserting more specific terms already cover
  a large part of the rule: rule_redundancy.tsv counts 20 covered sets, and on the rule set downloaded
  2026-11-12 it is 21 of 52, 18 of them by the mRNA catabolic process rule ARBA00027180. Those sets emit
  nothing here. A minority of sets select proteins that reach the term through one paper on an indirect
  role (HSP70, the 3',5'-bisphosphate nucleotidase MET22, the cap-binding protein CBC2), which a parent
  term absorbs without comment.
action: SPLIT
action_rationale: >-
  RNA catabolic process is true of every unit and specific to none: an mRNA decapping enzyme, a miRNA-binding
  protein and a mitochondrial PNPase are annotated alike. Curators distinguish them, the GO branch has
  64 descendants to do it with, and other ARBA rules already assert several of those descendants from
  the same signatures. The rule should be split so that each uncovered set asserts the term of its unit,
  leaving the exosome and the unclassified single-family sets under the parent. Confidence is moderate
  because units were assigned from the per-set receipts recorded in the first pass (the most specific
  experimental term per set), not from a fresh lookup of every member, and some families act in more than
  one decay pathway.
suggested_modifications:
- >-
  Remove the sets already covered by a more specific rule; they emit nothing here. On the rule set of
  2026-11-12: sets 1, 3, 4, 7, 8, 13, 14, 17, 18, 20, 21, 27, 28, 31, 41, 43, 45 and 46 (ARBA00027180,
  GO:0006402 mRNA catabolic process), 10 and 11 (ARBA00092385, GO:0010587 miRNA catabolic process), 49
  (ARBA00027041, GO:0071025 RNA surveillance).
- >-
  Sets 6 and 30 (DCP2 FunFam, DCS1/DCS2): assert GO:0000290 (deadenylation-dependent decapping of nuclear-transcribed
  mRNA).
- >-
  Sets 32, 33, 38 and 39 (PARN, PNLDC1, NOT4, plant CAF1): assert GO:0000289 (nuclear-transcribed mRNA
  poly(A) tail shortening).
- >-
  Set 24 (JSN1/PUF2): assert GO:0000288 (nuclear-transcribed mRNA catabolic process, deadenylation-dependent
  decay).
- >-
  Sets 25, 26 and 35 (XRN1, SMG6, MAGOH): assert GO:0000184 (nuclear-transcribed mRNA catabolic process,
  nonsense-mediated decay).
- >-
  Sets 5 and 16 (TRAMP poly(A) polymerases TRF4/TRF5, TENT4): assert GO:0043634 (polyadenylation-dependent
  ncRNA catabolic process).
- >-
  Set 34 (BRN1/BRN2, Embryophyta): assert GO:0006402 (mRNA catabolic process), the term its members carry
  by IDA.
- >-
  Set 15 (DIS3L2): assert GO:0010587 (miRNA catabolic process) or GO:0000956 (nuclear-transcribed mRNA
  catabolic process); its members are curated to both.
- 'Sets 12 and 52 (WDR82, ZC3H4): assert GO:0071027 (nuclear RNA surveillance).'
- >-
  Set 29 (plant PNPase): assert GO:0000957 (mitochondrial RNA catabolic process) only if the chloroplast
  paralog PNP1 (Q8GZQ3) is excluded; otherwise leave at the parent.
- >-
  Keep GO:0006401 (RNA catabolic process) for the exosome and helicase sets 2, 9, 36, 42, 44 and 48 and
  for the single-family sets 19, 22, 37, 50 and 51. Review sets 23 (HSP70, Haplorrhini), 40 (MET22/HAL2
  nucleotidase) and 47 (CBC2) for removal: their link to RNA decay is indirect and rests on one paper
  each.
