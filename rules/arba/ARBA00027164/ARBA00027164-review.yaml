    distinct decay pathways. Figures updated from rule_redundancy.tsv as rebuilt on 2026-11-12 from the
    rules UniProt serves now, which has 52 sets: covered sets 20 in the earlier table, 21 now. Where
    the prose of this review quotes the earlier figure, this one replaces it.
