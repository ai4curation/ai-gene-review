  withdrawn_claim: >-
    The rule wrongly gives a catabolic annotation to RNA helicases such as SKI2, which unwind RNA rather
    than degrade it.
  correction: >-
    SKI2 and MTR4 helicases are experimentally annotated to RNA catabolic terms; taking part in a decay
    pathway is what the process term records.
  error_type: REFUTED_BY_CURATED_ANNOTATION
  evidence:
  - UniProtKB:P35207 SKI2 GO:0006402 IDA PMID:23953113 (ComplexPortal)
  - UniProtKB:P35207 SKI2 GO:0000956 IMP PMID:10611222 (SGD)
  - UniProtKB:P42285 MTREX GO:0006401 IDA PMID:29906447 (UniProt)
- date: '2026-11-10'
  withdrawn_claim: >-
    Terminal transferases (PAPD5/PAPD7, Cid1) are synthetic enzymes and so cannot be annotated to RNA
    catabolism.
  correction: >-
    Tailing by these enzymes marks RNA for decay, and they carry experimental annotations to descendants
    of GO:0006401.
