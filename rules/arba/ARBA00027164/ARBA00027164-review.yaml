review_summary: >-
  All 52 live condition sets were examined by retrieving the Swiss-Prot entries that match the whole conjunction
  and looking up their curated annotations to GO:0006401 and its is_a/part_of descendants. In 51 sets
  at least one Swiss-Prot match has an experimental annotation (IDA, IMP, IGI, IPI or EXP). The exception
  is set 28 (three pelota FunFams), whose two Swiss-Prot matches, Arabidopsis PEL1 (Q9ZT87) and PEL2 (Q9M2H7),
  carry GO:0070481 nuclear-transcribed mRNA catabolic process, non-stop decay by IEP only. The matched
  families include exosome subunits, decapping enzymes, deadenylases, the SKI2 and MTR4 helicases, TRAMP
  and terminal uridylyl transferases, and ZFP36-type zinc finger proteins. The check uses Swiss-Prot,
  the source ARBA rules are mined from, so it shows that no set lacks curated support; it does not measure
  precision on unreviewed entries.
action: ACCEPT
action_rationale: >-
  Every condition set has Swiss-Prot matches curated to RNA catabolic process or a descendant, 51 of 52
  with experimental evidence. The helicases, nucleotidyltransferases and RNA-binding proteins in the rule
  take part in RNA decay pathways, which is what a biological process term records; it does not require
  the protein to be a nuclease.
