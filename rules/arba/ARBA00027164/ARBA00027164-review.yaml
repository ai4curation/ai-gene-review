parsimony:
  assessment: REDUNDANT
  notes: >-
    rule_redundancy.tsv (built on a 54-set version): go_descendants 64, condition_sets 54, covered_sets
    20, covered_by_terms GO:0006402, GO:0010587, GO:0071025. Recomputed with the same structural test
    on the 52-set rule downloaded 2026-11-12: 21 sets covered, 18 by ARBA00027180 (GO:0006402), sets 10
    and 11 by ARBA00092385 (GO:0010587) and sets 46 and 49 by ARBA00027041 (GO:0071025). Covered sets
    emit nothing; QuickGO returns 9,239 annotations with withFrom ARBA:ARBA00027164 (2026-11-12), from
    the rest. Several units are selected more than once (DCP2 by sets 1 and 6; MTR4 by sets 9, 42 and
    44; SKI2 by sets 8 and 44). rules/arba/_interpro2go.txt maps nine InterPro entries to GO:0006401,
    including IPR011807 (Exosome complex component Rrp41) and IPR016438 (ATP-dependent RNA helicase SKI2-like),
    which overlap the units of sets 46 and 8 but not the rest.
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    The descendants named in biological_units (GO:0000290, GO:0000289, GO:0000288, GO:0000184, GO:0043634,
    GO:1990074, GO:0010587, GO:0071027, GO:0000957) are the terms curated by experiment on members of
    31 of the 52 sets, taken from the first pass's QuickGO lookups of GO:0006401 and its is_a/part_of
    descendants.
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    Many restrictions follow the species of the supporting annotations: Mus for the ZFP36 family (set
    7), Glires for TUT4/TUT7 (set 20), Primates for exosome PH-domain subunits and IRE1 (sets 2, 22),
    Haplorrhini for HSP70 (set 23), Hominidae for MAGOH (set 35). These families are conserved across
    eukaryotes or animals, so this is narrow coverage, not wrong annotation. Restrictions such as Bacteria
    for RelE (set 37), Fungi for the NOT module (set 3) and Viridiplantae for plant XRNs (set 11) follow
    the unit.
