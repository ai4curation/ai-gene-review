review_summary: >-
  Accuracy: all 14 live condition sets were examined. Eleven match reviewed entries, 32 in total, and
  every one carries GO:0045454 (cell redox homeostasis), 30 by manual evidence. The nitric oxide synthase
  set rests on a Reactome TAS annotation only. Three sets match no UniProtKB entry. Meaning and parsimony:
  the rule mixes two kinds of unit. Thioredoxins, peroxiredoxins and glutathione reductase (sets 2, 9,
  10, 11, 13, 14) are the thiol redox system that the term describes, and the consequent is their most
  informative process term. KRIT1, selenide water dikinase 1, the yeast mitochondrial porin and SCO proteins
  (sets 4, 6, 7, 12) carry the term from a mutant phenotype while their defining curated processes lie
  elsewhere. The nitric oxide synthases (set 1) have it only from a Reactome pathway mapping, and their
  curated process is GO:0006809 (nitric oxide biosynthetic process). Sets 3, 5 and 8 repeat the conditions
  of sets 4 and 9 for Archaea or Bacteria and match nothing.
action: MODIFY
action_rationale: >-
  The consequent has no descendants and no set is covered by a more specific rule, so the rule cannot
  be split toward better terms; the remedy is to remove the sets that do no work and the one that rests
  on a pathway mapping. The phenotype-supported sets are true annotations of pleiotropic proteins and
  are kept, with the reservation that they make the rule a list of unrelated proteins and not a statement
  about a redox system.
suggested_modifications:
- >-
  Remove sets 3, 5 and 8, which match no UniProtKB entry (reviewed or unreviewed) and repeat the FunFam
  conditions of sets 4 and 9 under Archaea or Bacteria.
- >-
  Remove set 1 (nitric oxide synthase FunFams in Primates). Its only support is the Reactome TAS annotation
  from R-HSA-1222556 on human NOS1, NOS2 and NOS3; the enzymes are curated experimentally to GO:0006809
  (nitric oxide biosynthetic process), which is not under the consequent.
- >-
  Review set 10 (glutathione reductase FunFams in Bacteria): it matches 45 unreviewed entries and no reviewed
  entry, so it has no curated support of its own.
