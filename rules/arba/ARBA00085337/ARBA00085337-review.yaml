corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    The KRIT1 set is an over-annotation and should be removed, because the main role of KRIT1 is vascular
    development and its effect on redox state is indirect.
  correction: >-
    Human KRIT1 is curated to GO:0045454 with experimental evidence, and PAINT propagates the term
    in the family. Whether redox homeostasis is the main role of the protein does not decide whether
    the annotation is true.
  error_type: REFUTED_BY_CURATED_ANNOTATION
  evidence:
  - >-
    QuickGO: UniProtKB:O00522 (KRIT1), GO:0045454, IMP, PMID:20668652, assigned by UniProt; also IBA,
    GO_REF:0000033.
  - >-
    PMID:20668652, title: KRIT1 regulates the homeostasis of intracellular reactive oxygen species.
- date: '2026-11-10'
  withdrawn_claim: >-
    The Por1p set is an over-annotation and should be removed, because the porin is a metabolite channel
    and its link to redox is indirect.
  correction: Both yeast porins are curated to GO:0045454 by SGD from a mutant phenotype.
  error_type: REFUTED_BY_CURATED_ANNOTATION
  evidence:
  - >-
    QuickGO: UniProtKB:P04840 (POR1) and UniProtKB:P40478 (POR2), GO:0045454, IMP, PMID:18768136,
    assigned by SGD.
  - >-
    PMID:18768136, title: Redox regulation of protein expression in Saccharomyces cerevisiae mitochondria:
    possible role of VDAC.
- date: '2026-11-10'
  withdrawn_claim: >-
    The SCO1 set is a false positive that arises from structural similarity to thioredoxins, and should
    be removed.
  correction: >-
    Yeast SCO1 and SCO2 are curated to GO:0045454 by SGD from genetic interaction evidence. No source
    was given for the statement that the association comes from fold similarity.
  error_type: REFUTED_BY_CURATED_ANNOTATION
  evidence:
