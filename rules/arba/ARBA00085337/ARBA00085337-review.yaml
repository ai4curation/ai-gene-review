    QuickGO: UniProtKB:P23833 (SCO1) and UniProtKB:P38072 (SCO2), GO:0045454, IGI, PMID:30593977,
    assigned by SGD.
  - 'PMID:30593977, title: Mitochondrial Sco proteins are involved in oxidative stress defense.'
- date: '2026-11-10'
  withdrawn_claim: The nitric oxide synthase set is an over-annotation and should be removed.
  correction: >-
    No source was cited for this. The three human NOS isoforms carry GO:0045454 as a Reactome TAS
    annotation; there is no experimental annotation, so this set is the least supported, but nothing
    checked shows it to be wrong.
  error_type: UNSUPPORTED_SOURCE
