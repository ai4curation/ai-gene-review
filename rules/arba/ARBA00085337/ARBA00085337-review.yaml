  source_condition_set_count: 14
review_summary: >-
  All 14 live condition sets were examined. Eleven match reviewed entries, 32 in total, and every
  one carries GO:0045454, 30 by manual evidence. The KRIT1, mitochondrial porin and SCO1 sets, which
  could look out of place beside thioredoxins and peroxiredoxins, each rest on an experimental annotation
  of the protein. The nitric oxide synthase set rests on a Reactome TAS annotation only and is the
  least supported. Three sets match no UniProtKB entry.
action: ACCEPT
action_rationale: >-
  Each set that matches reviewed proteins selects proteins already curated to cell redox homeostasis,
  most with experimental evidence. A protein does not need redox homeostasis as its main role for
  the annotation to be true. The counts are from Swiss-Prot, which is also what ARBA learns its rules
  from, so they show the condition sets are coherent rather than giving an independent error rate
  for unreviewed entries.
go_specificity:
  assessment: APPROPRIATE
  notes: >-
    GO:0045454 is the term carried by the reviewed members of every set, with experimental evidence
    codes for the thioredoxin, peroxiredoxin, glutathione reductase, KRIT1, SEPHS1, porin and SCO
    sets (accessions in annotation_assessments).
