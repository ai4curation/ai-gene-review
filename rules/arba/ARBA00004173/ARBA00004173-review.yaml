  - number: 779
    conditions:
    - condition_type: FUNFAM
      value: 3.30.1050.10:FF:000001
      curie: CATH.FunFam:3.30.1050.10:FF:000001
      label: Putative Non-specific lipid-transfer protein
    - condition_type: FUNFAM
      value: 3.40.47.10:FF:000016
      curie: CATH.FunFam:3.40.47.10:FF:000016
      label: Non-specific lipid-transfer protein
    - condition_type: TAXON
      value: Archaea
      curie: NCBITaxon:2157
      label: Archaea
      negated: true
    - condition_type: TAXON
      value: Bacteria
      curie: NCBITaxon:2
      label: Bacteria
      negated: true
    - condition_type: TAXON
      value: Viruses
      curie: NCBITaxon:10239
      label: Viruses
      negated: true
    notes: >-
      THE DEFECTIVE BRANCH underlying geneontology/go-annotation#6412. This is the
      condition set whose signature pair matches the architecture of Drosophila
      ScpX (Q9VJ43, 544 aa): an N-terminal thiolase domain (CATH 3.40.47.10,
      IPR020616/IPR055140/IPR016039) plus a C-terminal SCP2 sterol-binding domain
      (CATH 3.30.1050.10, IPR003033/IPR036527). Exhaustive scanning of all 1,490
      condition sets shows only CS779 and CS812 could match Q9VJ43's signature
      complement; the InterPro/PANTHER SCP2 sets (CS249, CS303) cannot. (I could
      not query CATH FunFam assignments for Q9VJ43 directly, so this is an
      architecture-level match, not a verified FunFam hit.) The defect: the
      mitochondrial evidence for this family comes exclusively from an
      ISOFORM-SCOPED UniProt annotation. In mouse SCP2_MOUSE (P32020), ALTERNATIVE
      PRODUCTS records alternative initiation with two isoforms; the SUBCELLULAR
      LOCATION comment scoped to "Isoform SCPx" (P32020-1, the full-length
      thiolase+SCP2 protein that this FunFam pair detects) lists Peroxisome ONLY
      (ECO:0000269, PMID:26901662), whereas the comment scoped to "Isoform SCP2"
      (P32020-2, the short alternative-initiation product that LACKS the thiolase
      domain) lists Cytoplasm, Peroxisome, Endoplasmic reticulum and Mitochondrion
      (ECO:0000269, PMID:11003606 and PMID:26901662). ARBA has learned the
      SUBCELLULAR LOCATION comment while discarding its `molecule:` (isoform)
      qualifier, so it requires the thiolase FunFam - i.e. selects precisely the
      isoform that is NOT annotated mitochondrial. The same collapse is visible
      across sibling rules: the identical FunFam pair is CS2894 of ARBA00004496
      (Cytoplasm), and 3.40.47.10:FF:000016 alone is CS80 of ARBA00004275
      (Peroxisome), so this one architecture triggers three location rules and
      reproduces the union of the two isoforms' locations. Only the peroxisome
      call is consistent with what UniProt records for isoform SCPx. RETIRE or
      repair this branch (and CS2894 of ARBA00004496).
  - number: 812
    conditions:
    - condition_type: FUNFAM
      value: 3.40.47.10:FF:000020
      curie: CATH.FunFam:3.40.47.10:FF:000020
    - condition_type: TAXON
