      negated: true
    - condition_type: TAXON
      value: Viruses
      curie: NCBITaxon:10239
      label: Viruses
      negated: true
    notes: >-
      The second (and only other) set that could match Q9VJ43. A single, entirely
      UNLABELED FunFam from the thiolase CATH superfamily 3.40.47.10 plus the
      prokaryote/virus exclusion. Thiolase-fold proteins are distributed across
      mitochondria, peroxisomes and cytosol, so a bare FunFam from this
      superfamily cannot discriminate compartment. Representative of the 693
      single-FunFam branches (46.5% of the rule), 240 of which carry no resolved
      label at all.
  - number: 1124
    conditions:
    - condition_type: FUNFAM
      value: 3.40.47.10:FF:000007
      curie: CATH.FunFam:3.40.47.10:FF:000007
      label: acetyl-CoA acetyltransferase, mitochondrial
    - condition_type: TAXON
      value: Anura
      curie: NCBITaxon:8342
      label: Anura
    notes: >-
      Representative clade-overfitting artefact. The FunFam label identifies
      ACAT1, the mitochondrial matrix acetoacetyl-CoA thiolase - a genuinely
      pan-metazoan (indeed pan-eukaryotic) mitochondrial enzyme - yet the branch
      is restricted to Anura (frogs). 187 of 1,490 sets carry a positive taxon
      condition and they use 140 distinct clades, each appearing only once or
      twice (Anura, Pongo, Bos, Homo, Mus, Kluyveromyces, Oryza, Camelineae,
      "Aspergillus subgen. Circumdati", ...). These read as training-set clade
      artefacts rather than biology: they neither add precision nor reflect the
      taxonomic distribution of the family, and they silently sacrifice recall.
