  created_date: '2020-05-12'
  modified_date: '2025-12-14'
review_summary: >-
  ARBA00004173 is not one rule but an umbrella of 1,490 independent, OR-ed
  branch-level classifiers that all emit the same UniProt SUBCELLULAR LOCATION
  value (Mitochondrion, SL-0173), which GO_REF:0000044 converts to GO:0005739
  (IEA/ECO:0007322) on 536,854 unreviewed proteins with zero reviewed proteins
  acting as controls. The rule is genuinely heterogeneous rather than uniformly
  bad. Many branches are unimpeachable - MIC60 (CS15), TOM40 (CS74), Tim10-like
  translocase subunits (CS23), mitochondrially encoded cytochrome b (CS1),
  cytochrome c oxidase subunits, sideroflexins (CS38) - and for these GO:0005739
  is correct, if often underspecified relative to available submitochondrial
  child terms.

  The GO curator complaint (geneontology/go-annotation#6412, @hattrill, about
  Drosophila ScpX / Q9VJ43) exposes a specific and structural defect rather than a
  one-off mistake. The branch whose signature pair matches Q9VJ43's architecture
  is CS779 (FunFam 3.30.1050.10:FF:000001 AND FunFam 3.40.47.10:FF:000016 AND
  NOT Bacteria/Archaea/Viruses), i.e. it requires the N-terminal thiolase domain
  in addition to the C-terminal SCP2 domain. But in the mouse orthologue P32020
  the mitochondrion assertion is scoped by UniProt to "Isoform SCP2" (P32020-2),
  the short alternative-initiation product that LACKS the thiolase domain, while
  the comment scoped to "Isoform SCPx" (P32020-1, the full-length architecture
  CS779 actually detects) lists Peroxisome only. ARBA has evidently learned the
  SUBCELLULAR LOCATION comment while discarding its `molecule:` (isoform)
  qualifier, so the branch selects exactly the isoform that is not annotated
  mitochondrial. The curator's diagnosis ("only the short isoform P32020_2 is
  potentially mitochondrial") is correct and, on the UniProt record, even
  understated.

  This is not an isolated bug. The same SCPx architecture simultaneously fires
  ARBA00004496 (Cytoplasm; CS2894 is the identical FunFam pair) and ARBA00004275
  (Peroxisome; CS80 is 3.40.47.10:FF:000016 alone), so the three sibling location
  rules jointly reproduce the union of the two isoforms' recorded locations, of
  which only Peroxisome is right for SCPx. Quantitatively, 139/1,490 (9.3%) of
  this rule's condition sets have a signature set that also appears verbatim in
  the Cytoplasm rule and 19/1,490 (1.3%) in the Peroxisome rule (3 in both) -
  a signature of isoform/dual-localization collapse operating at scale, not once.
  Worse, the literature actively argues against mitochondrial residence for this
  family: Li, Fan & Papadopoulos (PMID:26901662) showed by live-cell confocal
  imaging that the N-terminal presequence of SCPX/SCP2 is not sufficient to direct
  the proteins to mitochondria, and that PTS1-mediated peroxisomal targeting
  dominates.

  Structurally the rule is far outside any parsimony envelope: 693 sets (46.5%)
  are a single FunFam plus taxon (240 with no resolved label at all), 1,303
  (87%) have no positive taxon condition beyond NOT(Bacteria/Archaea/Viruses),
  only 422 (28%) contain any signature whose label mentions "mitochondri*" (a
  weak proxy), and of the 885 distinct InterPro entries used, 493 have some
  InterPro2GO mapping but only 35 are mapped to GO:0005739 by InterPro curators -
  i.e. ~96% of the rule's InterPro conditions make a mitochondrial claim that
  InterPro curators declined to make.

  Recommended action is MODIFY rather than DEPRECATE: the biologically sound
  branches are numerous and valuable, and wholesale retirement would lose a large
  amount of correct annotation. The deeper fix is SPLIT into per-family rules,
  mirroring the falcon report's framing that the rule should survive only "as a
  container for branch-level classifiers".

  Caveats on this review: `just analyze-rule ARBA00004173` refuses to run on rules
  with more than 12 condition sets, so no pairwise overlap statistics, heatmap or
  `entries` view could be generated, and `sync-rule-review-single` / `render-rule`
  are not runnable. Only one deep-research provider succeeded (falcon); the
  perplexity run failed with HTTP 401 (quota exhausted). Twelve illustrative
  condition sets are enumerated above with their true 1-based numbers; the other
  1,478 have not been individually adjudicated.
action: MODIFY
action_rationale: >-
  MODIFY, not DEPRECATE. Unlike a rule that is wrong throughout, ARBA00004173
  contains a large core of correct branches keyed on whole-protein mitochondrial
  families (MIC60, TOM40, Tim chaperones, COX subunits, sideroflexins, MT-encoded
  OXPHOS subunits) for which GO:0005739 is exactly the right assertion; deleting
  the rule would discard correct annotation on a large fraction of 536,854
  proteins. The defect the GO curators reported is specific, mechanistically
  identifiable, and fixable: ARBA is learning UniProt SUBCELLULAR LOCATION
  comments without honouring their `molecule:` (isoform) scoping, so an
  architecture-specific signature (thiolase + SCP2 FunFam pair, CS779) inherits a
  location that UniProt records only for a different, domain-deficient isoform
  (P32020-2). Because this failure mode is systematic - 139 of this rule's
  condition sets share a signature set with the Cytoplasm rule ARBA00004496 and 19
  with the Peroxisome rule ARBA00004275 - it warrants a targeted engineering fix
  plus branch pruning rather than either blanket acceptance or blanket removal. A
  secondary, independent problem is the very large tail of low-information
  branches (693 single-FunFam sets, 240 unlabeled) and 140 singleton positive
  taxon clades that look like training-set residue. If UniProt is unwilling to
  make ARBA isoform-aware, the fallback should be SPLIT into per-family rules so
  that each branch can be accepted, audited or retired on its own evidence.
suggested_modifications:
- >-
  Retire or repair CS779 (FunFam 3.30.1050.10:FF:000001 AND FunFam
  3.40.47.10:FF:000016 AND NOT Bacteria/Archaea/Viruses) and its sibling CS2894 in
  the Cytoplasm rule ARBA00004496 (the identical FunFam pair). The mitochondrion
  and cytoplasm calls for the SCPx thiolase+SCP2 architecture derive from a
  UniProt SUBCELLULAR LOCATION comment scoped to isoform P32020-2, which lacks the
  thiolase domain that these branches require. For this architecture only the
  peroxisome call (ARBA00004275 CS80) should be retained. This directly resolves
  the false GO:0005739 IEA on Drosophila ScpX (Q9VJ43) reported in
  geneontology/go-annotation#6412.
- >-
  Make ARBA isoform-aware at the training stage: exclude, or explicitly scope,
  SUBCELLULAR LOCATION comments that carry a `molecule:` (isoform) qualifier
  whenever the learned signature is architecture-specific and the named isoform
  differs in domain content from the displayed sequence. At minimum, do not let a
  location asserted for an alternative-initiation or alternative-splice product be
  transferred by a signature that requires a domain absent from that product.
- >-
  Audit the 139 condition sets whose signature set also appears in ARBA00004496
  (Cytoplasm) and the 19 that also appear in ARBA00004275 (Peroxisome). Sets
  emitting three different compartments from one identical signature are prima
  facie evidence of collapsed isoform- or condition-specific localization and
  should be triaged first.
- >-
  Drop, or gate behind benchmarking, condition sets consisting of a single FunFam
  plus only NOT(Bacteria/Archaea/Viruses) where the FunFam has no
  mitochondria-specific label (693 single-FunFam sets, of which 240 have no
  resolved label at all; e.g. CS608 = 2.130.10.10:FF:000404, CS812 =
  3.40.47.10:FF:000020). Require each retained branch to have at least one
  reviewed Swiss-Prot positive exemplar with experimental mitochondrial evidence.
- >-
  Replace the 140 singleton positive taxon clades (187 sets; e.g. CS1124 =
  mitochondrial acetyl-CoA acetyltransferase FunFam restricted to Anura, CS9 =
  COX2 restricted to Euarchontoglires, CS13 = COX2 restricted to Laurasiatheria)
  with evidence-based taxonomic scope derived from the phylogenetic distribution
  of experimentally localized orthologues. Merge branches that differ only in
  clade.
- >-
  Collapse redundant nested InterPro conjunctions where a domain, its homologous
  superfamily and the corresponding family all describe the same region and the
  family alone is diagnostic (e.g. CS23: IPR004217 + IPR035427 + IPR050673).
  Retain nesting only where the broad signature is promiscuous and the narrow one
  supplies genuine discrimination (e.g. CS74 Tom40 within the porin superfamily).
- >-
  Where branch-level evidence supports it, propagate a submitochondrial child term
  in addition to GO:0005739 (mitochondrial inner membrane for sideroflexins/CS38
  and the OXPHOS branches, mitochondrial outer membrane for TOM40/CS74,
  mitochondrial intermembrane space for the Tim chaperones/CS23) rather than
  leaving every prediction at the organelle level.
- >-
  Strategic option (deeper fix): SPLIT ARBA00004173 into per-family rules so that
  each branch carries its own provenance, taxonomic scope, GO granularity and
  benchmark, instead of 1,490 classifiers of wildly differing quality sharing one
  rule identifier and one blanket ECO:0007322 evidence code. This also makes
  individual branches citable and retractable in response to GO curator reports.
parsimony:
  assessment: OVERLY_COMPLEX
  notes: >-
    1,490 OR-ed condition sets, i.e. ~124x the 12-condition-set threshold above
    which the project's own tooling refuses to analyse a rule. The complexity is
    not merely large but poorly structured: 693 sets (46.5%) are a single FunFam
    plus taxon, 240 of those FunFams have no resolved label at all; 180 sets are
    two FunFams, 131 are InterPro+InterPro+PANTHER, 102 are three FunFams, 81 a
    single InterPro, 19 a single PANTHER. Condition-type usage is taxon 1,490,
    FunFam 1,359, InterPro 885, PANTHER 287. All 1,490 signature sets are distinct
    (no exact duplicates), so the complexity is not literal duplication - it is
    the absence of any shared mechanistic basis: the sets have nothing in common
    except emitting the same location string. Nested InterPro triples
    (domain + homologous superfamily + family for the same region, e.g. CS23) add
    conditions without adding discrimination. A rule of this shape cannot be
    reviewed, benchmarked or maintained as a unit, which is why the deeper
    recommendation is to split it into per-family rules.
  supported_by:
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-analysis-notes.md
    supporting_text: Rule ARBA00004173 has 1490 condition sets, which exceeds the
      maximum of 12. Analysis is skipped for rules with too many condition sets as
      they would require excessive UniProt API queries and take too long.
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
    supporting_text: Treat each of the 1,490 condition sets as an independently
      testable classifier.
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
    supporting_text: The rule should be retained only as a container for
      branch-level classifiers, with systematic removal or refinement of
      generic-domain, fragment-prone, paralogue-ambiguous, and organelle-confounded
      branches.
literature_support:
  assessment: MODERATE
  notes: >-
    Literature support is bimodal, and a single enum cannot express that; MODERATE
    is chosen as the rule-level summary. For a substantial minority of branches the
    support is effectively STRONG: MIC60, TOM40, the small Tim chaperones,
    mitochondrially encoded cytochrome b and cytochrome c oxidase subunits, and
    sideroflexins are textbook mitochondrial proteins with abundant experimental
    localization evidence, and the falcon report singles out the sideroflexin
    branch (CS38/IPR004686) as well supported. For the branch the GO curator
    complained about, support is CONTRADICTED: Li, Fan & Papadopoulos
    (PMID:26901662) tested the putative N-terminal mitochondrial presequence of
    SCPX/SCP2 directly by live-cell confocal imaging of fluorescent fusions and
    concluded it is not sufficient to localize either protein to mitochondria,
    while C-terminal PTS1-mediated peroxisomal targeting is. The only primary
    evidence for mitochondrial SCP2 is Starodub et al. (PMID:11003606), an
    immunofluorescence study of the SHORT SCP-2 protein in L-cell fibroblasts that
    ranks mitochondria third behind peroxisomes and ER - and UniProt correctly
    scopes that evidence to isoform P32020-2, not to the SCPx architecture that
    CS779 detects. For the very large tail of unlabeled single-FunFam branches
    there is no identifiable literature at all, because the branches cannot even be
    resolved to a named family. The falcon report additionally warns that rules
    trained on noisy source annotations reinforce systematic errors, which is
    precisely what the isoform-collapse defect demonstrates.
  supported_by:
  - reference_id: PMID:26901662
    supporting_text: the N-terminal mitochondrial targeting sequence is not powerful
      enough to localize the SCPX and SCP2 proteins to the mitochondria.
  - reference_id: PMID:26901662
    supporting_text: The Scp2 gene contains two transcription initiation sites,
      giving rise to the 58 kDa sterol carrier protein-x (SCPX) and 15 kDa pro-SCP2
      proteins
  - reference_id: PMID:11003606
    supporting_text: detected SCP-2 in peroxisomes > endoplasmic reticulum >
      mitochondria >
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
    supporting_text: Sideroflexins are mitochondrial inner-membrane proteins,
      although their transported substrates and physiological roles differ among
      paralogues. That branch is well supported for GO:0005739.
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
    supporting_text: Thus, family rules trained on noisy source annotations can
      reinforce systematic errors.
  - reference_id: https://github.com/geneontology/go-annotation/issues/6412
    supporting_text: From orthology to P32020, only the sort isoform P32020_2 is
      potentially mitochondrial.
condition_overlap:
  assessment: SIGNIFICANT
  notes: >-
    Quantitative pairwise overlap could not be computed because `just analyze-rule`
    refuses to run on rules with >12 condition sets, so `pairwise_overlap` and
    `entries` are empty. Qualitative and cross-rule evidence nonetheless makes
    SIGNIFICANT the right call, on three distinct axes. (1) Within-set redundancy:
    the recurrent InterPro triple shape (domain + its homologous superfamily + the
    corresponding family, 99 sets of shape InterPro x3, e.g. CS23 = IPR004217 +
    IPR035427 + IPR050673) conjoins nested annotations of the same sequence region,
    which cannot increase specificity. (2) Between-set overlap within the rule:
    693 single-FunFam sets drawn from broad CATH superfamilies will match
    overlapping protein sets, and multi-FunFam sets built from the same superfamily
    (3.40.47.10 appears in CS779, CS812, CS1124 among others) partially subsume one
    another. (3) Cross-rule overlap, which is the most consequential: 139/1,490
    (9.3%) of this rule's condition sets have a signature set that appears
    identically in the Cytoplasm rule ARBA00004496, 19/1,490 (1.3%) in the
    Peroxisome rule ARBA00004275, and 3 in both. Identical antecedents emitting
    mutually exclusive compartments are not sensitivity-enhancing overlap; they are
    evidence that isoform- and condition-specific locations have been collapsed
    into a single architecture-level signature. CS779 is the worked example: the
    same FunFam pair is CS2894 of ARBA00004496, and its thiolase half alone is CS80
    of ARBA00004275. Separately, of the 885 distinct InterPro entries used by this
    rule, 493 already carry some InterPro2GO mapping but only 35 are mapped to
    GO:0005739 by InterPro curators, so ~96% of the rule's InterPro conditions make
    a mitochondrial claim the InterPro2GO curators declined to make - the rule is
    largely non-redundant with InterPro2GO precisely where it is least supported.
  supported_by:
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-analysis-notes.md
    supporting_text: Rule ARBA00004173 has 1490 condition sets, which exceeds the
      maximum of 12. Analysis is skipped for rules with too many condition sets as
      they would require excessive UniProt API queries and take too long.
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
    supporting_text: Multiple signatures may either add specificity or simply be
      nested/redundant annotations of the same sequence region.
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
    supporting_text: Where a PANTHER subfamily is sufficient and more specific, a
      parent-family condition may be redundant.
go_specificity:
  assessment: APPROPRIATE
  notes: >-
    GO:0005739 (mitochondrion) is the right granularity for a rule whose source
    assertion is the UniProt subcellular-location keyword Mitochondrion (SL-0173):
    for every true positive it is a correct, conservative cellular-component term,
    and it is the term GO_REF:0000044 legitimately produces from that keyword. The
    aspect and branch are right (cellular component, not molecular function or
    biological process), so it is not MISMATCHED, and it is certainly not
    TOO_NARROW. The honest qualifier is that it is frequently UNDERSPECIFIED rather
    than wrong: many branches identify families whose submitochondrial compartment
    is well established (inner membrane for sideroflexins and OXPHOS subunits,
    outer membrane for TOM40, intermembrane space for the Tim chaperones) and could
    support a child term in addition to the parent. I have deliberately not scored
    this TOO_BROAD, because the false positives this rule generates - Q9VJ43 being
    the reported case - are not failures of term granularity at all: no
    mitochondrial child or parent term would be correct there. Fixing them requires
    fixing the antecedent (isoform scoping, branch pruning), not the consequent.
    Scoring TOO_BROAD would misdirect the fix.
  supported_by:
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
    supporting_text: GO:0005739 denotes the mitochondrion as a cellular component.
      It is appropriate if the protein resides in any mitochondrial compartment
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
    supporting_text: For branches supported by submitochondrial evidence, more
      precise cellular-component terms should be propagated in addition to the
      parent
taxonomic_scope:
  assessment: TOO_BROAD
  notes: >-
    The dominant taxonomic condition is NOT(Bacteria/Archaea/Viruses), present as
    the ONLY taxon constraint in 1,303/1,490 sets (87%). This is a coarse
    "eukaryote-ish" filter and carries almost no organelle information: it does not
    distinguish mitochondria from cytosol, nucleus, ER, Golgi, peroxisome or - in
    plants and algae - plastid, and it is largely redundant with signatures that
    are already eukaryote-restricted. Combined with the 693 bare single-FunFam
    branches, this is the principal false-positive generator, and it is exactly how
    the Drosophila ScpX case arises: CS779's taxonomic condition does nothing to
    prevent a peroxisomal/cytosolic lipid-transfer protein from being called
    mitochondrial.

    A separate, opposite artefact coexists with this over-breadth and is worth
    recording even though the enum can only carry one value: the 187 sets that do
    have a positive taxon condition use 140 distinct clades, each occurring only
    once or twice (Anura, Pongo, Bos, Homo, Mus, Kluyveromyces, Oryza, Camelineae,
    "Aspergillus subgen. Circumdati", ...). These are TOO_NARROW in effect and
    read as training-set residue rather than biology - CS1124 confines the
    FunFam labelled "acetyl-CoA acetyltransferase, mitochondrial" (ACAT1), a
    pan-metazoan mitochondrial matrix thiolase, to frogs; CS9 and CS13 split
    cytochrome c oxidase subunit II between Euarchontoglires and Laurasiatheria.
    They sacrifice recall without buying precision. The rule therefore manages to
    be simultaneously too broad where it matters (the 87% with no positive
    constraint) and arbitrarily too narrow where it does constrain.
  supported_by:
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
    supporting_text: It cannot distinguish mitochondrial from plastid targeting in
      plants and algae, or mitochondrial from peroxisomal, ER, and Golgi
      localization in other eukaryotes.
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
    supporting_text: They can also be overfitted if derived from sparse reviewed
      examples. Taxonomic exclusions should therefore be supported by phylogenetic
      inspection of experimentally localized orthologues, not merely by absence of
      training examples.
  - reference_id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
    supporting_text: a domain shared by proteins in several compartments is not
      intrinsically a localization signal
confidence: 0.35
references:
- id: file:rules/arba/ARBA00004173/ARBA00004173-deep-research-falcon.md
  title: Deep research analysis via Falcon - UniProt rule ARBA00004173
  findings:
  - statement: The rule is an aggregated umbrella of 1,490 independent branch-level
      classifiers and should be audited branch-by-branch rather than accepted or
      rejected wholesale.
    supporting_text: Treat each of the 1,490 condition sets as an independently
      testable classifier.
  - statement: The report's final verdict is that the rule should survive only as a
      container for branch-level classifiers, with generic-domain and
      organelle-confounded branches removed.
    supporting_text: The rule should be retained only as a container for
      branch-level classifiers, with systematic removal or refinement of
      generic-domain, fragment-prone, paralogue-ambiguous, and organelle-confounded
      branches.
  - statement: Isoform choice is explicitly listed as a mechanism by which a
      structural-domain signature can fail to predict localization - the exact
      failure mode reported in go-annotation issue #6412 for CS779.
    supporting_text: alternative initiation, splicing, and competing targeting
      sequences can alter localization.
  - statement: Localization is a property of the complete protein, not of one
      structural domain, so a CATH FunFam match is a weak localization proxy.
    supporting_text: localization is a property of the complete protein—including
      terminal targeting information, transmembrane segments, isoform choice, and
      cellular context—not necessarily of one structural domain
  - statement: Single-signature branches are acceptable only when the signature is a
      mitochondria-specific whole-protein family, and unsafe when it is a generic
      domain - the basis for pruning the 693 bare single-FunFam sets.
    supporting_text: Conditions such as CS7, CS15, CS31, CS34, CS38, and CS39 rely
      on one InterPro entry plus a broad taxonomic exclusion. These are acceptable
      only when the InterPro entry is a mitochondria-specific whole-protein family;
      they are unsafe if it is a generic domain.
  - statement: The sideroflexin branch (CS38 / IPR004686) is a well-supported
      positive example for GO:0005739.
    supporting_text: Sideroflexins are mitochondrial inner-membrane proteins,
      although their transported substrates and physiological roles differ among
      paralogues. That branch is well supported for GO:0005739.
  - statement: GO:0005739 is an appropriate cellular-component term when
      mitochondrial residence holds, but is often underspecified relative to
      submitochondrial child terms.
    supporting_text: For branches supported by submitochondrial evidence, more
      precise cellular-component terms should be propagated in addition to the
      parent
  - statement: The NOT(Bacteria/Archaea/Viruses) filter provides essentially no
      organelle specificity within eukaryotes.
    supporting_text: It cannot distinguish mitochondrial from plastid targeting in
      plants and algae, or mitochondrial from peroxisomal, ER, and Golgi
      localization in other eukaryotes.
  - statement: Positive lineage restrictions can be overfitted to sparse reviewed
      training examples - consistent with the 140 singleton clades observed here.
    supporting_text: They can also be overfitted if derived from sparse reviewed
      examples. Taxonomic exclusions should therefore be supported by phylogenetic
      inspection of experimentally localized orthologues, not merely by absence of
      training examples.
  - statement: Rules trained on noisy source annotations reinforce systematic
      errors - the general form of the isoform-collapse defect documented here.
    supporting_text: Thus, family rules trained on noisy source annotations can
      reinforce systematic errors.
  - statement: Branches without reviewed positive exemplars should be flagged as
      speculative rather than merged invisibly into a high-volume rule.
    supporting_text: Branches with no reviewed positive exemplars should be flagged
      as speculative rather than merged invisibly into the same high-volume rule.
  - statement: Isoform-specific localization should be documented rather than
      collapsed, where the annotation model permits it.
    supporting_text: Conditional or isoform-specific localization should be
      documented where the annotation model permits it.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Falcon deep-research report generated for this rule. Its rule-level
      statistics (1,490 condition sets; 536,854 unreviewed proteins; condition-type
      usage taxon 1,490 / FunFam 1,359 / InterPro 885 / PANTHER 287) were
      independently re-derived from ARBA00004173.enriched.json and match exactly.
      Its identification of IPR004686 as the sideroflexin family and its CS38
      numbering were verified against the rule JSON. The report is an
      LLM-generated synthesis, so its literature citations were treated as leads
      rather than as verified facts, and no claim in this review rests on a
      citation appearing only in that report. The companion perplexity run failed
      (HTTP 401, quota exhausted), so this is the only deep-research provider
      available.
- id: PMID:26901662
  title: Sterol Carrier Protein-2, a Nonspecific Lipid-Transfer Protein, in
    Intracellular Cholesterol Trafficking in Testicular Leydig Cells.
  findings:
  - statement: Live-cell confocal imaging of fluorescent SCPX and SCP2 fusions
      showed that the C-terminal PTS1 signal drives peroxisomal targeting, while
      the putative N-terminal mitochondrial presequence is not sufficient to
      localize either protein to mitochondria. This is direct evidence against the
      mitochondrial assertion that ARBA00004173 CS779 makes for the SCPx
      thiolase+SCP2 architecture.
    supporting_text: the N-terminal mitochondrial targeting sequence is not powerful
      enough to localize the SCPX and SCP2 proteins to the mitochondria.
  - statement: The Scp2 gene uses two transcription initiation sites to produce the
      58 kDa SCPX (thiolase + SCP2 domain) and the 15 kDa pro-SCP2 (SCP2 domain
      only); the two products differ in domain content, which is why an
      isoform-scoped location cannot be transferred by a thiolase-requiring
      signature.
    supporting_text: The Scp2 gene contains two transcription initiation sites,
      giving rise to the 58 kDa sterol carrier protein-x (SCPX) and 15 kDa pro-SCP2
      proteins
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID verified against the cached publication record (Li NC, Fan J,
      Papadopoulos V, PLoS One 2016; full text available). This is the ECO:0000269
      source that UniProt cites for BOTH the "Isoform SCPx" peroxisome-only
      location and part of the "Isoform SCP2" multi-compartment location on P32020,
      confirmed by fetching the P32020 record from the UniProt REST API. Its
      experimental conclusion directly contradicts mitochondrial targeting of the
      full-length SCPx architecture.
- id: PMID:11003606
  title: Sterol carrier protein-2 localization in endoplasmic reticulum and role in
    phospholipid formation.
  findings:
  - statement: Indirect immunofluorescence and confocal microscopy of L-cell
      fibroblasts overexpressing the short SCP-2 protein ranked its distribution
      peroxisomes > endoplasmic reticulum > mitochondria > lysosomes. This is the
      primary source of the mitochondrial claim, and it concerns the short
      SCP2 product (UniProt isoform P32020-2), not the full-length SCPx
      architecture that ARBA00004173 CS779 requires.
    supporting_text: detected SCP-2 in peroxisomes > endoplasmic reticulum >
      mitochondria >
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID verified against the cached publication record (Starodub et al., Am J
      Physiol Cell Physiol 2000); the cache is abstract-only
      (full_text_available: false), so only the abstract was assessed. Confirmed
      via the UniProt REST API that P32020 cites this PMID exclusively under the
      SUBCELLULAR LOCATION comment scoped to "Isoform SCP2" (P32020-2) - it is not
      cited for the "Isoform SCPx" comment, which lists Peroxisome only. Cited here
      to establish the isoform scoping of the mitochondrial evidence, not to
      dispute the curator's original annotation.
- id: https://github.com/geneontology/go-annotation/issues/6412
  title: 'go-annotation issue #6412: ARBA00004173 mitochondrion annotation on
    UniProt:Q9VJ43 (Drosophila melanogaster ScpX)'
  findings:
  - statement: A GO curator reported that ARBA00004173 assigns a mitochondrial
      location to Drosophila melanogaster ScpX (Q9VJ43), and correctly diagnosed
      that in the mouse orthologue P32020 only the short isoform is potentially
      mitochondrial, with no evidence that D. melanogaster has an equivalent short
      isoform.
    supporting_text: From orthology to P32020, only the sort isoform P32020_2 is
      potentially mitochondrial.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The complaint was independently verified. QuickGO confirms Q9VJ43 carries
      GO:0005739 IEA via GO_REF:0000044 with with/from UniProtKB-SubCell:SL-0173,
      assigned by UniProt; the UniProt REST record for Q9VJ43 shows three ARBA
      location calls (Cytoplasm/ARBA00004496, Mitochondrion/ARBA00004173,
      Peroxisome/ARBA00004275). The curator's reading of P32020 is correct and, if
      anything, understated - UniProt scopes the mitochondrion location strictly to
      Isoform SCP2 (P32020-2) while Isoform SCPx (P32020-1) is annotated Peroxisome
      only.
