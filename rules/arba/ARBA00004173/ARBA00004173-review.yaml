  notes: >-
    Correct examples: P00156 and P00158 (cytochrome b of human and mouse) match set 1. P56757 (Arabidopsis
    ATP synthase subunit alpha, chloroplastic; set 251) is not listed as incorrect, because it carries
    GO:0005739 mitochondrion HDA PMID:22923678 (TAIR), a proteomics annotation; whether that is a real
