review_summary: >-
  All 1,525 live condition sets were screened with two UniProtKB queries each (2026-11-10): the Swiss-Prot
  entries that match the whole conjunction, and how many of them have the subcellular location Mitochondrion
  (SL-0173). 1,524 sets match at least one Swiss-Prot entry and 1 match none. In 1,513 sets every Swiss-Prot
  match has the location and in 11 sets some do not (sets 43, 209, 251, 365, 378, 456, 484, 549, 718,
  1084, 1384); set 1312 matches no Swiss-Prot entry. The search is at entry level and does not see locations
  scoped to one isoform. Summed over sets there are 18,954 set-level matches, 18,884 with the location.
  Sets 1 and 789 were read in detail; they and the sets with incomplete agreement are recorded in the
  rule block. Set 1 (cytochrome b) is sound. Three sets match plastid-encoded ATP synthase subunits whose
  curated location is the chloroplast thylakoid membrane: set 251 (33 of 41 Swiss-Prot matches, in rosids),
  set 456 (5 of 10, in Liliopsida) and set 484 (7 of 12, in Solanaceae). Set 1384 matches ATP-dependent
  6-phosphofructokinases, 6 of 8 recorded as Cytoplasm, and set 1084 matches amphibian adenylosuccinate
  synthetase isozyme 1, 3 of 6 recorded as Cytoplasm; in both cases the Swiss-Prot location comes from
  a HAMAP rule, not an experiment. Set 365 also matches four apicoplast lipoyl synthases. Set 789 is defective
  in a different way: it requires the thiolase-type FunFam 3.40.47.10:FF:000016 together with the SCP2
  FunFam 3.30.1050.10:FF:000001, but in the reviewed mouse and human entries the mitochondrial location
  belongs to the short SCP2 isoform, which lacks the region matched by the first FunFam, while the full-length
  SCPx isoform is recorded as Peroxisome only. The rule therefore gives Mitochondrion to full-length SCPx
  proteins such as Drosophila ScpX (Q9VJ43). In sets 43, 209, 378, 549 and 718 the entries without the
  location have only a generic or rule-derived location comment, which does not show the protein is absent
  from mitochondria. ARBA rules are mined from Swiss-Prot annotation, and precision on the 562,320 unreviewed
  entries the rule annotates was not measured.
action: MODIFY
action_rationale: >-
  Specific condition sets are defective. Sets 251, 456 and 484 match chloroplast ATP synthase subunits,
  and set 789 transfers a location that the source entries record for a different isoform than the one
  the set detects. These four sets should be removed or narrowed; sets 1384, 1084 and 365 need a closer
  look. The remaining sets were not shown to be wrong: 1,513 of 1,525 sets agree fully with Swiss-Prot
  locations at entry level, so the rule as a whole is kept.
suggested_modifications:
- >-
  Remove condition set 789 (FunFam 3.30.1050.10:FF:000001 AND FunFam 3.40.47.10:FF:000016 AND NOT Bacteria,
  Archaea, Viruses), or stop it from emitting Mitochondrion. In P32020 and P22307 the Mitochondrion location
  is scoped to isoform SCP2, which lacks residues 1-404 and so cannot match FunFam 3.40.47.10:FF:000016;
  isoform SCPx is recorded as Peroxisome.
- >-
  When rules are mined from subcellular location comments that are scoped to a named isoform, do not transfer
  the location through a signature set that the named isoform cannot match.
- >-
  Remove or narrow set 251 (IPR000194 AND IPR000793 AND rosids), set 456 (IPR005294 AND PTHR48082:SF2
  AND Liliopsida) and set 484 (IPR020537 AND IPR035921 AND Solanaceae): 33 of 41, 5 of 10 and 7 of 12
  of their Swiss-Prot matches are chloroplast ATP synthase subunits curated to the chloroplast thylakoid
  membrane (for example P56757, A6MMJ2, P06286).
- >-
  Review set 1384 (FunFams 3.40.50.450:FF:000010 AND 3.40.50.460:FF:000008): 6 of 8 Swiss-Prot matches
  are ATP-dependent 6-phosphofructokinases recorded as Cytoplasm by HAMAP rule MF_03184 (for example O94201,
  P78985). Review set 1084 (Amphibia adenylosuccinate synthetase, 3 of 6 recorded as Cytoplasm by HAMAP
  rule MF_03126) and set 365 (4 of 106 matches are apicoplast lipoyl synthases, for example Q8IDQ0).
