    The rule emits the UniProt location Mitochondrion (SL-0173), which UniProt converts to GO:0005739
    mitochondrion; for example Q9VJ43 carries GO:0005739 IEA GO_REF:0000044 assigned by UniProt. The term
    matches the location it is derived from.
