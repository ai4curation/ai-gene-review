go_specificity:
  assessment: APPROPRIATE
  notes: >-
    The rule emits the UniProt location Mitochondrion (SL-0173), which UniProt converts to GO:0005739
    (mitochondrion); for example Q9VJ43 carries GO:0005739 IEA GO_REF:0000044 assigned by UniProt. The
    organelle term is an informative location in itself and is the level a location rule of this kind
    is meant to assert; sub-compartment locations are assigned by separate ARBA rules for the few sets
    where signatures support them.
