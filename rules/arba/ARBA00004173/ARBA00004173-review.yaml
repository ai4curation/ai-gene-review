id: ARBA00004173
description: >-
  Aggregated ARBA localization rule that asserts the UniProt SUBCELLULAR LOCATION
  "Mitochondrion" (SL-0173) for eukaryotic proteins matching any of 1,490 OR-ed
  condition sets built from CATH FunFam, InterPro and PANTHER signatures. Via the
  UniProtKB-SubCell -> GO mapping (GO_REF:0000044) the assertion is propagated to
  GO:0005739 (mitochondrion) with evidence IEA / ECO:0007322. The rule currently
  annotates 536,854 unreviewed (TrEMBL) proteins and 0 reviewed proteins. It is not
  a single-family rule but an umbrella aggregating hundreds of independent
  branch-level classifiers of very uneven quality, ranging from canonical
  mitochondrial families (MIC60, TOM40, TIM/Tim10-like, cytochrome c oxidase
  subunits, sideroflexins) to bare single unlabeled FunFams and clade-overfitted
  singletons.
status: COMPLETE
rule_type: ARBA
rule:
  rule_id: ARBA00004173
  # 1490 condition sets total; 12 illustrative sets enumerated below with their
  # true 1-based `number` from rules/arba/ARBA00004173/ARBA00004173.enriched.json.
  # The full set cannot be enumerated here and `just analyze-rule` refuses to run
  # on rules with >12 condition sets, so pairwise_overlap and entries stay empty.
  condition_sets:
  - number: 1
    conditions:
    - condition_type: INTERPRO
      value: IPR005798
      curie: InterPro:IPR005798
      label: Cytochrome b/b6, C-terminal
      interpro_type: DOMAIN
    - condition_type: INTERPRO
      value: IPR027387
      curie: InterPro:IPR027387
      label: Cytochrome b/b6-like domain superfamily
      interpro_type: HOMOLOGOUS_SUPERFAMILY
    - condition_type: TAXON
      value: Eukaryota
      curie: NCBITaxon:2759
      label: Eukaryota
    notes: >-
      Sound. Mitochondrially encoded cytochrome b (MT-CYB and orthologues) is a
      bona fide mitochondrial inner-membrane protein, so GO:0005739 is correct
      (arguably underspecified relative to mitochondrial respiratory chain complex
      III / inner membrane). I specifically checked the plant chloroplast
      cytochrome b6f false-positive risk and it does not materialise: Arabidopsis
      cytochrome b6 (P56773) carries IPR005797 (N-terminal), not IPR005798, and
      plant petD (e.g. P56774, P05643, Q332U6) carries IPR005798 but not
      IPR027387, so the two-InterPro conjunction excludes the plastid subunits.
      This is an example of the rule's good branches.
  - number: 9
    conditions:
    - condition_type: INTERPRO
      value: IPR001505
      curie: InterPro:IPR001505
      label: Copper centre Cu(A)
      interpro_type: BINDING_SITE
    - condition_type: INTERPRO
      value: IPR002429
      curie: InterPro:IPR002429
      label: Cytochrome c oxidase subunit II-like C-terminal
      interpro_type: DOMAIN
    - condition_type: TAXON
      value: Euarchontoglires
      curie: NCBITaxon:314146
      label: Euarchontoglires
    notes: >-
      Biologically correct target (COX2 is mitochondrially encoded and resides in
      the mitochondrial inner membrane) but the positive taxon condition is an
      artefact: COX2 is pan-eukaryotic, yet this branch is confined to
      Euarchontoglires, and the near-identical CS13 (IPR036257 + IPR045187) is
      confined to Laurasiatheria. This is a recall-losing, training-set-shaped
      clade restriction rather than a biological one; the two branches should be
      merged and generalised.
  - number: 15
    conditions:
    - condition_type: INTERPRO
      value: IPR019133
      curie: InterPro:IPR019133
      label: MICOS complex subunit MIC60
      interpro_type: FAMILY
    - condition_type: TAXON
      value: Bacteria
      curie: NCBITaxon:2
      label: Bacteria
      negated: true
    - condition_type: TAXON
      value: Archaea
      curie: NCBITaxon:2157
      label: Archaea
      negated: true
    - condition_type: TAXON
      value: Viruses
      curie: NCBITaxon:10239
      label: Viruses
      negated: true
    notes: >-
      Sound single-signature branch. IPR019133 is a whole-protein family
      (MICOS/mitofilin MIC60) that is definitionally mitochondrial inner-membrane,
      so a single InterPro family plus the prokaryote/virus exclusion is
      acceptable here. This is exactly the case the falcon report says is
