review_summary: >-
  Accuracy: all 1,525 live condition sets were screened with two UniProtKB queries each (2026-11-10):
  the Swiss-Prot entries that match the whole conjunction, and how many of them have the subcellular location
  Mitochondrion (SL-0173). In 1,513 sets every Swiss-Prot match has the location, in 11 some do not (sets
  43, 209, 251, 365, 378, 456, 484, 549, 718, 1084, 1384) and set 1312 matches no Swiss-Prot entry. Three
  sets match plastid-encoded ATP synthase subunits curated to the chloroplast thylakoid membrane (set
  251, 33 of 41 matches; set 456, 5 of 10; set 484, 7 of 12). Set 789 transfers a location that mouse
  and human SCP2 entries record for the short SCP2 isoform to full-length SCPx proteins, which the entries
  record as peroxisomal; Drosophila ScpX (Q9VJ43) receives Mitochondrion from it. Sets 1384, 1084 and
  365 have minority matches located elsewhere. Precision on the 562,320 unreviewed entries the rule annotates
  was not measured. Meaning and parsimony: the rule assigns an organelle, and an organelle is an informative
  location in its own right. The 14 recorded sets select recognisable units (mitochondrially encoded cytochrome
  b, mitochondrial ABC transporters, HIG1 proteins, lipoyl synthase, ATP synthase subunits), and the complete
  screen shows that in 1,513 of 1,525 sets all reviewed matches are mitochondrial, so the sets do select
  what the label names. Where a unit has a known sub-compartment the rule stops at the organelle, but
  that is the level the rule is for, and only 47 of the 1,525 sets are covered by an ARBA rule for a mitochondrial
  sub-location. No set is subsumed by another. The defects are therefore the specific sets already identified,
  not the design of the rule.
action: MODIFY
action_rationale: >-
  Specific condition sets are defective. Sets 251, 456 and 484 match chloroplast ATP synthase subunits,
  and set 789 transfers a location that the source entries record for a different isoform than the one
  the set detects. These four sets should be removed or narrowed; sets 1384, 1084 and 365 need a closer
  look. The meaning and parsimony check adds no new defect: the label is at the right level for a location
  rule and the sets are not redundant with one another. The rule as a whole is kept.
suggested_modifications:
- >-
  Remove condition set 789 (FunFam 3.30.1050.10:FF:000001 AND FunFam 3.40.47.10:FF:000016 AND NOT Bacteria,
  Archaea, Viruses), or stop it from emitting Mitochondrion. In P32020 and P22307 the Mitochondrion location
  is scoped to isoform SCP2, which lacks residues 1-404 and so cannot match FunFam 3.40.47.10:FF:000016;
  isoform SCPx is recorded as Peroxisome.
- >-
  When rules are mined from subcellular location comments that are scoped to a named isoform, do not transfer
  the location through a signature set that the named isoform cannot match.
- >-
  Remove or narrow set 251 (IPR000194 (ATPase, F1/V1/A1 complex, alpha/beta subunit, nucleotide-binding
  domain) AND IPR000793 (ATP synthase, alpha subunit, C-terminal) AND rosids), set 456 (IPR005294 (ATP
  synthase, F1 complex, alpha subunit) AND PTHR48082:SF2 AND Liliopsida) and set 484 (IPR020537 (ATP synthase,
  F0 complex, subunit C, DCCD-binding site) AND IPR035921 (F/V-ATP synthase subunit C superfamily) AND
  Solanaceae): 33 of 41, 5 of 10 and 7 of 12 of their Swiss-Prot matches are chloroplast ATP synthase
  subunits curated to the chloroplast thylakoid membrane (for example A6MMJ2, P06286).
- >-
  Review set 1384 (FunFams 3.40.50.450:FF:000010 AND 3.40.50.460:FF:000008): 6 of 8 Swiss-Prot matches
  are ATP-dependent 6-phosphofructokinases recorded as Cytoplasm by HAMAP rule MF_03184 (for example O94201,
  P78985). Review set 1084 (Amphibia adenylosuccinate synthetase, 3 of 6 recorded as Cytoplasm by HAMAP
  rule MF_03126) and set 365 (4 of 106 matches are apicoplast lipoyl synthases, for example Q8IDQ0).
- >-
  Optional: sets 43 and 549 select the same ABCB7-type transporters (26 and 27 Swiss-Prot matches, the
  same one entry, Q8T9W2, without the location); check whether both are needed.
biological_meaning:
  assessment: COHERENT
  notes: >-
    Judged from the 14 sets recorded in the review and from the first pass's complete Swiss-Prot screen.
    The recorded sets are not a random sample: 2 were read in detail (1, 789), 11 were recorded because
    agreement was incomplete and 1 because it matched nothing, so they over-represent problem sets. Even
    so, each selects a recognisable unit, and the screen shows 1,513 of 1,525 sets with every reviewed
    match mitochondrial. Mitochondrion is a root organelle location, informative in itself; the rule does
    not claim a sub-compartment. This is a subcellular-location rule (UniProt converts SL-0173 to GO:0005739
    mitochondrion by GO_REF:0000044), so rule_redundancy.tsv has no row for it and the GO descendant and
    coverage fields are not filled.
  sets_examined_for_meaning: 14
