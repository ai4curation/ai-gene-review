    The broad NOT Bacteria/Archaea/Viruses taxon condition, combined with single-FunFam sets, is the principal
    false-positive generator and is exactly how the Drosophila ScpX case arises.
  correction: >-
    The ScpX case comes from a two-FunFam set and from an isoform-scoped source annotation; no taxon condition
    within eukaryotes would prevent it, and no false-positive rate was measured for any class of set.
    The taxonomic scope block was removed.
