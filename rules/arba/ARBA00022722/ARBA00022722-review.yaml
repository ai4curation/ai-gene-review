review_summary: >-
  Accuracy: the first 287 of 538 live condition sets (CS1 to CS287) were queried against Swiss-Prot on
  2026-11-09; each has reviewed matches and every reviewed match inspected carries the keyword Nuclease
  (KW-0540). On 2026-11-12 the remaining 251 sets, which this review does not record, were counted by
  UniProtKB query from the same rule snapshot: all have reviewed matches (966 summed over sets) and 250
  have none lacking the keyword. One does: the set FunFam 1.20.58.190:FF:000001 AND FunFam 1.20.58.200:FF:000002
  matches six reviewed entries, all translin (for example human Q15631 and mouse Q62348), and none carries
  the keyword. Translin is the non-catalytic partner of translin-associated protein X in the C3PO complex;
  Swiss-Prot gives the keywords Endonuclease and Nuclease and EC 3.1.26.- to the partner (Q99598) and
  not to translin. Of 1166 UniProtKB entries matching that set, 1160 unreviewed entries carry the keyword,
  for example Q7JVK6 with evidence ARBA:ARBA00022722. TrEMBL matches of the other sets were not inspected.
  Meaning and parsimony: the keyword names an enzyme class and the sets select nuclease families, one
  or a few sets per family. In a systematic sample of 12 recorded sets, 5 select endonucleases only (RNase
  HII, XPF, Slx1, retrotransposon Gag-Pol, hantavirus nucleoprotein), 6 exonucleases only (DNA polymerase
  I, Rrp6-like, Apollo, AddA, archaeal Rrp41 and a PANTHER subfamily of 3'-5' exonucleases) and 1 a family
  that Swiss-Prot keywords as Nuclease without a subclass (VapC toxins). Nuclease is the parent of Endonuclease
  and Exonuclease in the keyword hierarchy and UniProt shows parent and child together, so the general
  keyword is the expected companion of the specific one, not a replacement for it.
action: MODIFY
action_rationale: >-
  All 538 sets have now been checked against Swiss-Prot and 537 are clean, so the rule is sound as a whole
  and selects what its label names. One set transfers the keyword from a nuclease complex to its non-catalytic
  subunit and should be removed or tightened. Confidence is limited by the fact that only reviewed entries
  were inspected and that meaning was judged from a sample of 12 sets.
confidence: 0.75
suggested_modifications:
- >-
  Remove the condition set FunFam 1.20.58.190:FF:000001 AND FunFam 1.20.58.200:FF:000002 (one of the 251
  sets this review does not record). Its six reviewed matches are translin, which Swiss-Prot does not
  keyword as a nuclease; the catalytic subunit of the translin/TRAX complex is TRAX (Q99598).
biological_meaning:
  assessment: COHERENT
  notes: >-
    Judged from a systematic sample, every 25th recorded set (1, 25, 50, ..., 275), with the Endonuclease
    (KW-0255) and Exonuclease (KW-0269) keywords counted on the reviewed matches of each. Each sampled
    set selects one nuclease family. Eleven of twelve are wholly endonuclease or wholly exonuclease families
    and already carry the more specific keyword in Swiss-Prot, as the keyword hierarchy intends. This
    is a keyword rule, so rule_redundancy.tsv has no row for it.
  sets_examined_for_meaning: 12
