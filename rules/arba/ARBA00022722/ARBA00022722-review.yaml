parsimony:
  assessment: ACCEPTABLE
  notes: >-
    538 sets, none without reviewed matches (287 from the first pass, 251 counted on 2026-11-12). Containment
    of one set's matches in another's was not measured for this rule, and rule_redundancy.tsv covers GO
    rules only, so redundancy between sets is not quantified. No single signature could stand in for a
    class that spans dozens of unrelated folds.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    153 of 538 sets carry a taxon condition, for example Negarnaviricota on the hantavirus nucleocapsid
    signature of set 100 and Methanobacteriati on the Rrp41 FunFam of set 275. In the sets examined the
    taxon goes with a signature that is not nuclease-specific elsewhere, and no reviewed match within
    the taxon lacks the keyword.
