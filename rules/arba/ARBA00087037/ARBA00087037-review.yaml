    The rule requires cadherin, laminin beta and netrin domains, which cannot co-occur in a laminin chain.
  correction: >-
    The conditions are FunFams of the CATH laminin EGF-like superfamily 2.10.25.10; a FunFam name is the
    name of one member, not a statement that the matched protein is a cadherin or a netrin. The live conjunctions
    match laminin chains.
  error_type: WRONG_IDENTIFIER_MEANING
