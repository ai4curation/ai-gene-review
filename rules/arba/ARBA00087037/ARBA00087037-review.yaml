review_summary: >-
  Both live condition sets were examined. Set 1 matches three Swiss-Prot entries, all laminin subunit
  beta-2 (human P55268, rat P15800, mouse Q61292); human and mouse LAMB2 are experimentally annotated
  to laminin-121 trimer. Set 2 matches two Swiss-Prot entries, laminin subunit gamma-1 of human (P11047)
  and mouse (P02468), both annotated to the term by TAS. GO defines laminin-121 as the alpha1, beta2,
  gamma1 complex, so both families are subunits of it. Gamma-1 is also a subunit of other laminin trimers;
  the rule records only this one.
action: ACCEPT
action_rationale: >-
  Each condition set identifies one chain of the laminin-121 trimer and the reviewed matches are curated
  to the exact term. Confidence is limited by the small number of reviewed matches (three and two) against
  875 and 180 unreviewed matches, and by set 2 resting on TAS rather than experimental evidence.
