review_summary: >-
  Accuracy: both live condition sets were examined. Set 1 matches three Swiss-Prot entries, all laminin
  subunit beta-2 (human P55268, rat P15800, mouse Q61292); human and mouse LAMB2 are experimentally annotated
  to GO:0005608 (laminin-121 trimer). Set 2 matches laminin subunit gamma-1 of human (P11047) and mouse
  (P02468), both annotated to the term by TAS. For these reviewed vertebrate chains the annotation is
  true. Meaning and parsimony: the sets select two chains of one complex, so the rule is a coherent statement,
  with two limits. The term names one trimer among many that each chain builds: curated annotation puts
  human gamma-1 in eleven laminin trimers and beta-2 in nine, and no set selects alpha-1, the chain that
  distinguishes laminin-121. And the only taxon condition, NOT Fungi, does no work for a metazoan protein
  family and lets set 1 reach 26 non-vertebrate entries, 21 of them nematode laminin beta chains that
  QuickGO shows annotated to laminin-121 by this rule. The alpha1, beta2, gamma1 chain nomenclature is
  defined for vertebrate laminins.
action: MODIFY
action_rationale: >-
  The rule is kept, because each set selects a real subunit of the named complex and emits 1,060 annotations
  no other rule provides, but its taxon condition should follow the biology: restrict both sets to Vertebrata.
  That removes the nematode and arthropod matches of set 1 (set 2 already matches vertebrates only) and
  replaces a condition that excludes nothing relevant. Confidence is moderate: whether a nematode beta
  chain should be called a member of laminin-121 was judged from nomenclature, not from an experiment.
suggested_modifications:
- >-
  Replace the condition NOT Fungi in both sets with the positive taxon Vertebrata (NCBITaxon:7742). Set
  1 matches 878 UniProtKB entries, 852 in Vertebrata and 26 outside it (21 Nematoda, 2 Arthropoda), for
  example A0A0B2UNP1 (Toxocara canis) and A0A0D6M206 (Ancylostoma ceylanicum); set 2 matches 182 entries,
  all in Vertebrata.
- >-
  Optional, for coverage: the beta-2 and gamma-1 chains belong to many trimers (LAMB2 is curated to nine,
  LAMC1 to eleven), so the same sets could equally assert the sibling trimer terms, or the parent GO:0043256
  (laminin trimer); asserting only GO:0005608 is true but selective.
biological_meaning:
  assessment: COHERENT
  notes: >-
    Two units that are subunits of one complex: laminin beta-2 (set 1) and laminin gamma-1 (set 2). GO:0005608
    (laminin-121 trimer) is true of both and has no descendants. It is one of several equally specific
    sibling terms true of each chain, and the alpha-1 chain (P25391, curated to GO:0005608 by IPI PMID:10964500)
    is not selected by any set, so the rule is a partial statement about the complex, not a misleading
    one.
  consequent_descendant_count: 0
  sets_covered_by_more_specific_rule: 0
  sets_examined_for_meaning: 2
