parsimony:
  assessment: ACCEPTABLE
  notes: >-
    Two sets, one per chain, each a conjunction of three FunFams. rule_redundancy.tsv: go_descendants
    0, covered_sets 0; no other ARBA rule asserts a laminin trimer term from these sets, and QuickGO returns
    1,060 annotations with withFrom ARBA:ARBA00087037 (2026-11-12). The condition NOT Fungi is idle: laminins
    are metazoan and the FunFam conjunctions have no fungal matches to exclude. Whether all three FunFams
    of each conjunction are needed was not tested. No InterPro2GO mapping to GO:0005608 exists in rules/arba/_interpro2go.txt.
taxonomic_scope:
  assessment: TOO_BROAD
  notes: >-
    NOT Fungi is the only taxon condition. UniProtKB counts (2026-11-12): set 1 matches 878 entries, 852
    in Vertebrata, 26 outside (21 Nematoda, 2 Arthropoda); set 2 matches 182, all in Vertebrata. QuickGO
    shows 21 nematode entries annotated to GO:0005608 with ARBA:ARBA00087037, for example A0A0B2UNP1 and
    A0A0D6M206. Laminin beta-2 and the laminin-121 (alpha1, beta2, gamma1) designation are vertebrate,
    so the scope should be Vertebrata.
