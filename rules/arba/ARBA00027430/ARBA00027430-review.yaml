review_summary: >-
  Accuracy: ten of the 83 served condition sets were checked against the curated annotations of their
  Swiss-Prot members (sets 2, 4, 5, 16, 18, 19, 21, 24, 43 and 56). In each a reviewed member carries
  a curated annotation under GO:0006066 (alcohol metabolic process), so no false positive was found; the
  remaining sets were read by signature label only. Meaning and parsimony: the term is a chemical grouping.
  Under it the rule gathers inositol phosphate kinases, the retinoid isomerase RPE65, ceramidases, thiamine
  and sterol biosynthesis enzymes, yeast pyruvate decarboxylases, plant aconitases, leptin and dysferlin.
  Eight of the ten units carry a specific curated descendant that says what they do; for leptin and dysferlin
  the term is reached only through mutant-phenotype annotations and their informative terms lie outside
  it. rule_redundancy.tsv finds 40 of 83 sets already matched by a rule asserting a more specific term,
  and QuickGO lists no ARBA annotation to the term at all.
action: SPLIT
action_rationale: >-
  An umbrella term over families that each have a better one should be split toward those terms. The units
  are real, their specific terms are curated with experimental evidence, and about half of the sets are
  already duplicated by rules for more specific terms. The verdict rests on a sample of ten sets chosen
  for recognisable family names across the rule (three already recorded, seven added); confidence reflects
  that.
suggested_modifications:
- >-
  Drop the sets already matched by rules asserting a more specific term (40 of 83 in rule_redundancy.tsv;
  covering terms GO:0046165 alcohol biosynthetic process, GO:0019751 polyol metabolic process, GO:0034308
  primary alcohol metabolic process, GO:1902652 secondary alcohol metabolic process, GO:0046164 alcohol
  catabolic process). Of the sets recorded here these are 4, 5, 16, 19, 24 and 43.
- >-
  Move the remaining sets to the term of their unit: set 2 to GO:0032958 (inositol phosphate biosynthetic
  process); set 21 to GO:0006695 (cholesterol biosynthetic process); and, where the covering rule is still
  less specific than the curated term, set 4 to GO:0042572 (retinol metabolic process), set 5 to GO:0046512
  (sphingosine biosynthetic process), set 16 to GO:0009228 (thiamine biosynthetic process), set 19 to
  GO:0019655 (pyruvate fermentation to ethanol), set 24 to GO:0006696 (ergosterol biosynthetic process).
- >-
  Drop set 56 (leptin FunFam in Murinae) and set 43 (dysferlin FunFams in Glires): the term rests on mutant-phenotype
  annotations (cholesterol and glycerol metabolism), not on a role of the protein in alcohol metabolism.
- >-
  Drop set 18 (aconitate hydratase FunFams in Streptophyta) or move it to a tricarboxylic acid cycle term:
  isocitrate metabolism falls under the consequent only by chemical classification.
- >-
  Assign the 73 sets not examined here to units in the same way before any are kept under the umbrella
  term.
