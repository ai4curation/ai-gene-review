annotation_assessments:
- annotation_kind: GO_TERM
  value: GO:0006066
  label: alcohol metabolic process
  assessment: UNDECIDED
  notes: >-
    QuickGO is_a ancestors (2026-11-09): GO:0006067 ethanol metabolic process, GO:0006772 thiamine
    metabolic process, GO:0009228 thiamine biosynthetic process and GO:0008203 cholesterol metabolic
    process all have GO:0006066 as an ancestor. GO:0016126 sterol biosynthetic process and GO:0016125
    sterol metabolic process do not. No matched protein was checked.
corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    Enzymes of thiamine metabolism and ethanol metabolism are only tangentially related to alcohol
    metabolism and would be false positives.
  correction: >-
    These processes are is_a descendants of GO:0006066 in GO, so the annotation is true for them.
  error_type: ONTOLOGY_MISREAD
  evidence:
  - >-
    QuickGO: GO:0006772 thiamine metabolic process is_a GO:0034308 primary alcohol metabolic process
    is_a GO:0006066
  - 'QuickGO: GO:0006067 ethanol metabolic process has ancestor GO:0006066'
  - 'QuickGO: GO:0008203 cholesterol metabolic process has ancestor GO:0006066'
- date: '2026-11-10'
  withdrawn_claim: Sterol biosynthesis sets should use GO:0016126 as a more specific term.
  correction: >-
    GO:0016126 sterol biosynthetic process is not a descendant of GO:0006066, so it is not a refinement
    of the rule's term.
  error_type: ONTOLOGY_MISREAD
  evidence:
  - QuickGO is_a ancestors of GO:0016126 do not include GO:0006066
- date: '2026-11-10'
  withdrawn_claim: The term is too broad, so the rule should be deprecated.
  correction: >-
    The previous text itself proposed descendant terms, which concedes the annotation is true; that
    supports refinement, not deprecation.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - GO:0006067 and GO:0009228 are descendants of GO:0006066
- date: '2026-11-10'
  withdrawn_claim: Literature contradicts the rule.
  correction: >-
    The cited source was a note that no literature search had been run; the assessment is removed.
  error_type: UNSUPPORTED_SOURCE
