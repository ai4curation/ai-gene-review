parsimony:
  assessment: OVERLY_COMPLEX
  notes: >-
    rule_redundancy.tsv: 40 of 83 sets are matched by a rule asserting a more specific term (the same
    count was obtained independently from the rules downloaded on 2026-11-12). QuickGO returns no annotation
    with withFrom ARBA:ARBA00027430 and no ARBA (GO_REF:0000117) annotation to GO:0006066 at all, so the
    rule as served emits nothing. No InterPro2GO mapping is relevant: the sets are unrelated families.
    Each signature is used in one set and no set is contained in another.
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    GO:0006066 (alcohol metabolic process) has 229 descendants; every unit examined has a more specific
    curated term, eight of them under it.
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    Many taxon conditions follow where the supporting annotation sits, not where the family acts: Haplorrhini
    for the inositol polyphosphate kinases of set 2 (a pan-eukaryotic family), Murinae for leptin, Glires
    for dysferlin, Saccharomyces for pyruvate decarboxylase. This is narrow coverage, not wrong annotation.
    Chordata for alkaline ceramidases and Saccharomycotina for ERG11 are reasonable.
