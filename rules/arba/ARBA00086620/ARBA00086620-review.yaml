confidence: 0.75
corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    There is no support for the claim that MAPK, 14-3-3, syntaxin, chitin deacetylase and dynein light
    chain proteins collectively predict sexual sporulation; the families lack a common mechanism.
  correction: >-
    The rule makes no collective claim. Its condition sets are alternatives, each sufficient on its
    own, and each selects proteins with experimental evidence for ascospore formation.
  error_type: CONJUNCTION_IGNORED
  evidence:
  - >-
    UniProt ARBA API, ARBA00086620: four condition sets, each one FunFam plus taxon conditions.
  - >-
    QuickGO: experimental annotations to descendants of GO:0043935 on all eight reviewed matches (accessions
    in annotation_assessments).
- date: '2026-11-10'
  withdrawn_claim: >-
    The low overlap between condition sets (average Jaccard 0.006) shows the rule groups unrelated
    protein populations and is incoherent.
  correction: >-
    Alternative condition sets are meant to select different proteins. Their disjointness says nothing
    about whether each annotation is true.
  error_type: OTHER
  evidence:
  - 'UniProt ARBA API: the consequent applies when any one condition set is satisfied.'
- date: '2026-11-10'
  withdrawn_claim: The rule matches 0 proteins, which indicates unrealistic condition combinations.
  correction: >-
    The zero was the reviewed-protein statistic that the ARBA API reports for the rule, not a count
    of matches. The condition sets match reviewed and unreviewed UniProtKB entries.
  error_type: OTHER
  evidence:
  - >-
    UniProtKB release 2026_04: the four sets match 2 reviewed entries each and 80, 62, 70 and 0 unreviewed
    entries respectively.
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule applies a fungal process to all eukaryotes, which would cause massive over-annotation.
  correction: >-
    The live rule has no set that is open to all eukaryotes on a general domain. The only non-fungal
    taxon condition is on the chitin deacetylase FunFam, which matches 2 reviewed and 70 unreviewed
    entries. The earlier Eukaryota-wide kinase set required the mde3 FunFam, which had two Swiss-Prot
    members, both Schizosaccharomyces pombe sporulation kinases; it is now restricted to Fungi.
  error_type: TAXON_MISREAD
  evidence:
  - >-
    UniProt ARBA API, ARBA00086620, modified 2026-07-18: taxon conditions Saccharomycetes, Saccharomycetales,
    Eukaryota NOT Dictyostelia, Fungi.
  - >-
    QuickGO: O14132 (pit1) GO:0030437 IMP PMID:10747048; O43077 (mde3) GO:0030437 IGI PMID:10747048.
- date: '2026-11-10'
  withdrawn_claim: The condition sets include a MAPK FunFam and a dynein light chain FunFam.
  correction: Neither is in the live rule, which has four sets.
  error_type: STALE_RULE_VERSION
  evidence:
  - >-
    UniProt ARBA API, ARBA00086620, modified 2026-07-18: no condition on 1.10.510.10:FF:000624 or
    3.30.740.10:FF:000001.
