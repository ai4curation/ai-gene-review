review_summary: >-
  All four live condition sets were examined. Each matches two reviewed proteins, and all eight carry
  an experimentally supported annotation to a descendant of GO:0043935 (ascospore formation, ascospore
  wall assembly or prospore assembly). The rule is sound for the proteins that can be checked.
action: ACCEPT
action_rationale: >-
  Every condition set selects reviewed fungal proteins with direct experimental evidence for a role
  in ascospore formation. The four sets are alternatives and are expected to select different protein
  families. The counts are from Swiss-Prot, which is also what ARBA learns its rules from, so they
  show the condition sets are coherent rather than giving an independent error rate for unreviewed
  entries.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    Three of the four sets are restricted to fungal taxa. The chitin deacetylase set allows Eukaryota
    except Dictyostelia, but its two reviewed matches and its FunFam are fungal (Saccharomyces cerevisiae
    CDA1 and CDA2).
