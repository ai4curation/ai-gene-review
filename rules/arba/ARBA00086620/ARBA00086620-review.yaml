taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    Sets 1, 2 and 4 are fungal clades, which is where ascospores exist. Set 3 is written as Eukaryota
    excluding Dictyostelia, but all 72 UniProtKB entries it matches are fungal (query 2026-11-12), so
    the wording is odd and not harmful; Fungi would say what is meant. The narrow clades for the pleiotropic
    14-3-3 and Sso families follow where the yeast evidence is and are a sensible limit.
