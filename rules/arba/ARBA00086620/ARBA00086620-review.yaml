  alternative condition sets, each a CATH FunFam with a taxon restriction: 14-3-3 proteins in Saccharomycetes,
  a syntaxin FunFam in Saccharomycetales, a chitin deacetylase FunFam in Eukaryota excluding Dictyostelia,
  and the sporulation protein kinase mde3 FunFam in Fungi.
