review_summary: >-
  Accuracy: all four live condition sets were examined. Each matches two reviewed proteins, and all eight
  carry an experimentally supported annotation to a descendant of GO:0043935 (sexual sporulation resulting
  in formation of a cellular spore). The rule is sound for the proteins that can be checked. Meaning and
  parsimony: the four sets select four unrelated families (14-3-3 proteins, Sso t-SNAREs, chitin deacetylases,
  a sporulation kinase FunFam), and none of their members is curated to the consequent itself: every one
  carries a more specific descendant, GO:0030437 (ascospore formation), GO:0031321 (ascospore-type prospore
  assembly) or GO:0030476 (ascospore wall assembly). Two of the sets are already matched by a rule asserting
  GO:0030437 and emit nothing, and set 4 matches no unreviewed entry, so it annotates only two proteins
  that are already curated.
action: SPLIT
action_rationale: >-
  The consequent is an umbrella over fungal ascospore terms that the curators use directly. Because every
  set is confined to fungi (set 3 in effect: all 72 of its matches outside Dictyostelia are fungal), the
  ascospore terms apply to everything the rule reaches. The sets should be re-pointed to those terms,
  and set 4 can be dropped. For the 14-3-3 and Sso sets the sporulation role is one of many curated processes
  of pleiotropic proteins, so confidence in keeping them at all is lower than for the chitin deacetylase
  and kinase sets.
suggested_modifications:
- >-
  Sets 1 (14-3-3 in Saccharomycetes) and 4 (mde3 kinase FunFam in Fungi): assert GO:0030437 (ascospore
  formation), or drop them where a rule for GO:0030437 already matches.
- >-
  Set 2 (Sso syntaxins in Saccharomycetales): assert GO:0031321 (ascospore-type prospore assembly).
- >-
  Set 3 (chitin deacetylase FunFam): assert GO:0030476 (ascospore wall assembly) and replace the taxon
  Eukaryota excluding Dictyostelia with Fungi.
- >-
  Set 4 matches 2 reviewed and 0 unreviewed entries (UniProtKB release 2026_04), so it produces no new
  annotation and can be removed.
biological_meaning:
  assessment: TRUE_BUT_UNINFORMATIVE
  notes: >-
    Four unrelated families, each curated to a more specific ascospore term. The families are also heterogeneous
    in how central sporulation is to them: for chitin deacetylase Cda1/Cda2 and the mde3/pit1 kinases
    it is the main curated process; for the 14-3-3 proteins Bmh1/Bmh2 and the plasma-membrane t-SNAREs
    Sso1/Sso2 it is one phenotype among many. rule_redundancy.tsv: 15 descendants; 2 sets covered by rules
    asserting GO:0030437; the TSV counts 5 sets, the live rule has 4.
