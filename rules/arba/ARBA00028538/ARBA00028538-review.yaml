id: ARBA00028538
description: >-
  Assigns GO:0046467 to proteins matching any of 51 alternative condition sets built
  from 14 InterPro entries, 51 CATH FunFams and 39 taxon constraints. GO obsoleted
  GO:0046467 ("membrane lipid biosynthetic process") on 2025-12-09, replacing it with
  GO:0008610 lipid biosynthetic process, so the rule now emits no annotations at all -
  yet UniProt still serves it, and its last modification date of 2025-12-15 is six days
  after the obsoletion. The antecedents are heterogeneous: at most 26 of the 51 sets
  describe enzymes that build a membrane lipid, while the rest capture sphingolipid
  hydrolases, lipid A and GPI remodelling enzymes, GPI/dolichol-donor assembly,
  non-diagnostic glycosyltransferase families, and four mechanistically unrelated
  proteins reached through promiscuous folds (a PH-domain protein kinase,
  phosphoglycerate kinase, 5-aminolevulinate synthase, and a lipid-binding lipoprotein).
status: COMPLETE
rule_type: ARBA
rule:
  rule_id: ARBA00028538
