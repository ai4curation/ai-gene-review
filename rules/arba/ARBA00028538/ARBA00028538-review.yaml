review_summary: >-
  ARBA00028538 asserts a single consequent, GO:0046467, which the Gene Ontology obsoleted
  on 2025-12-09 (tracker geneontology/go-ontology#26698) as part of retiring the whole
  membrane-lipid grouping branch, on the ground that it grouped lipids by localization
  rather than by metabolic function. QuickGO now returns zero annotations to GO:0046467
  from any source, so the rule is inert. It is not, however, retired: UniProt still serves
  it and its modifiedDate of 2025-12-15 falls six days after the obsoletion, which means
  routine maintenance touched the rule without noticing that its only output term had
  ceased to exist. That matters because the obvious repair - substituting the replaced_by
  term GO:0008610 lipid biosynthetic process - would silently reactivate the rule and
  restore the errors that a GO curator raised against it in go-annotation#5835.
  Auditing all 51 OR-ed condition sets against what their InterPro entries and CATH
  FunFams actually identify, at most 26 describe an enzyme that builds a membrane lipid,
  and even those would be better served by pathway-specific children (GO:0030148,
  GO:0046513, GO:0006688, GO:0009245). Five sets are directionally wrong: alkaline
  ceramidase, acid and neutral sphingomyelinase, neutral ceramidase and lysosomal
  glucosylceramidase all hydrolyse membrane sphingolipids. Six describe modification or
  interconversion rather than synthesis (PagP, lipid A 1-phosphatase, sphingoid-base
  phosphatase, sphingosine kinase 2, PNPLA1, VLCFA reductase). Five sets are
  non-diagnostic families whose acceptor could equally be a protein or a wall polymer,
  and five concern GPI-anchor or dolichyl-phosphate-mannose assembly, which is the
  specific complaint raised in go-annotation#5835 against S. pombe Dpm1 (O14466). Four
  sets are mechanistically unrelated and reveal how the rule was built: CS37
  (5-aminolevulinate synthase) shares the Type I PLP fold with the serine
  palmitoyltransferases of CS18 and CS27; CS26 is phosphoglycerate kinase; CS12 is a
  PH-domain Ser/Thr protein kinase; CS43 is a lipid-BINDING lipoprotein, not a synthase.
  The apparent specificity of 51 named FunFams collapses onto only 26 CATH superfamilies,
  ten of which are reused across multiple condition sets, and in three cases
  same-superfamily neighbours disagree about whether a membrane lipid is being made at
  all. Two further conditions rest on the wrong domain entirely: CS16 and CS30 key on the
  cytochrome b5-like electron-donor module rather than a catalytic domain, and CS44
  ("sphingomyelin synthase-related protein 1") is assigned to an Ets-1 winged-helix
  superfamily. Redundancy is substantial: KDSR is reached three ways (CS4, CS9, CS36) and
  DPM1 twice by two FunFams of one superfamily carrying identical labels (CS23, CS50).
  The 39 taxon conditions name 34 distinct taxa and 12 sets carry no taxon at all; scopes
  such as Homo for sphingosine kinase 2, Hominidae for SPT2 and Glires for B4GALT6 are
  annotation-bias fossils, while Bacteria and Eukaryota are wide open. The falcon deep
  research reached the same overall verdict independently, from the literature rather
  than from fold membership, and supplies the directional anchors for the hydrolases and
  for LpxC/LpxH; it was, however, told the pre-obsoletion label by this repository's own
  stale label cache and therefore reasoned throughout about a live term.

action: DEPRECATE
action_rationale: >-
  The rule's only consequent no longer exists in GO, so there is nothing to accept and no
  in-place edit that leaves the rule correct. The natural mechanical fix - remap
  GO:0046467 to its replaced_by term GO:0008610 - must be rejected: nine of the 51
  condition sets (five catabolic, four mechanistically unrelated) would then produce
  annotations that are false rather than merely imprecise, and the remaining sound sets do
  not need a term as general as "lipid biosynthetic process" when pathway-specific
  children exist. Deprecation is also the honest response to go-annotation#5835. The
  obsoletion removed this rule's output without examining the reasoning that produced it,
  and the reporter's own follow-up ("oh no, some definitely are there now. Will reopen")
  is borne out: the same S. pombe Dpm1 protein still carries GO:0046474 from ARBA00028351
  and GO:1901137 from ARBA00026302, making the same category error. The defensible core -
  sphingolipid, glycosphingolipid, lipid A, GPI-anchor and dolichyl-phosphate-mannose
  biosynthesis - should be re-derived as separate pathway-scoped rules with specific
  terms, not preserved by re-pointing this one.

suggested_modifications:
- "Retire ARBA00028538 rather than remapping GO:0046467 to GO:0008610; the remap would reactivate the rule and convert nine condition sets from vague to false."
- "Re-derive sphingolipid/ceramide biosynthesis (GO:0030148, GO:0046513) as a separate rule from CS1, CS4, CS8, CS9, CS18, CS27, CS36, after collapsing the three redundant KDSR routes into one."
- "Re-derive glycosphingolipid biosynthesis (GO:0006688) from CS13, CS21, CS40, requiring evidence that the orthologue's physiological acceptor is a glycolipid."
- "Re-derive lipid A biosynthesis (GO:0009245) from CS7, CS24, CS38, with taxon scopes narrower than 'Bacteria' since lipid A enzyme architecture varies across phyla."
- "Re-derive GPI anchor biosynthesis (GO:0006506) from CS22, CS46, CS47."
- "Merge CS23 and CS50 into a single DPM1 condition asserting GO:0180047 dolichol phosphate mannose biosynthetic process - the term UniProt already uses for the protein named in go-annotation#5835."
- "Drop, do not re-point, the catabolic sets (CS2, CS5, CS15, CS19, CS45); if annotation is wanted, use the corresponding catabolic terms."
- "Drop the mechanistically unrelated sets CS12 (PH-domain protein kinase), CS26 (phosphoglycerate kinase), CS37 (5-aminolevulinate synthase) and CS43 (lipid-binding lipoprotein)."
- "Drop the non-diagnostic family sets CS3, CS6, CS33, CS48 and CS51, whose signatures do not establish a lipid acceptor."
- "Re-examine CS16, CS30 and CS44, whose CATH superfamilies (cytochrome b5-like; Ets-1 winged helix) indicate the condition keys on a non-catalytic or spurious domain assignment."
- "Add an obsoletion check to rule enrichment and sync, and refresh rules/_labels.json for obsoleted GO terms: this rule's stale cached label made an obsolete consequent look live to both curators and downstream tooling."

parsimony:
  assessment: OVERLY_COMPLEX
  notes: >-
    51 OR-ed condition sets for one consequent, against a working guideline of 12. The
    repository's own analysis tooling refuses to process it: 'just analyze-rule
    ARBA00028538' aborts with 'Rule ARBA00028538 has 51 condition sets, which exceeds the
    maximum of 12', so no pairwise overlap or heatmap data could be generated and the
    condition-level audit had to be done by hand. Complexity here is not the price of
    biological breadth; it is what allows five catabolic and four unrelated condition sets
    to sit unnoticed alongside genuine sphingolipid and lipid A enzymes, because in an OR
    the weakest condition sets the rule's real specificity.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028538/ARBA00028538-deep-research-falcon.md
    supporting_text: "Because any single condition triggers GO:0046467, the weakest condition determines the rule’s practical specificity."

literature_support:
  assessment: WEAK
  notes: >-
    Support is bimodal and the rule as a whole is governed by its weakest sets. The
    literature is strong and specific for a core: serine palmitoyltransferase, KDSR and
    the ceramide synthases as the de novo sphingolipid pathway; LpxC and LpxH as committed
    steps of lipid A biosynthesis; the GPI enzymes and Dol-P-Man donor chemistry. For five
    condition sets the literature is not merely thin but directly contradictory - acid
    sphingomyelinase, alkaline and neutral ceramidase and lysosomal glucosylceramidase are
    characterised as catabolic enzymes. For CS12, CS26, CS37 and CS43 no literature
    connects the family to membrane lipid synthesis at all, and their presence is
    explained by shared folds rather than shared function. The overall grade is therefore
    WEAK rather than STRONG or CONTRADICTED: a substantial well-evidenced core exists, but
    it cannot be inferred from the rule, only from auditing it set by set.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028538/ARBA00028538-deep-research-falcon.md
    supporting_text: "Acid sphingomyelinase is explicitly characterized as a lysosomal/secretory phospholipase C central to phospholipid **catabolism**, with more than 20 phospholipids cleaved in vitro; this directly contradicts conditions 5 and 19 as predictors of biosynthesis"
  - reference_id: file:rules/arba/ARBA00028538/ARBA00028538-deep-research-falcon.md
    supporting_text: "Conditions 12, 26, and 37—protein kinases, phosphoglycerate kinase, and 5-aminolevulinate synthase—have no direct basis for GO:0046467. Condition 43 is a lipid-binding protein rather than a biosynthetic catalyst."
  - reference_id: file:rules/arba/ARBA00028538/ARBA00028538-deep-research-falcon.md
    supporting_text: "LpxC deacetylates UDP-3-O-acyl-GlcNAc and drives the first committed step of lipid-A biosynthesis; LpxH hydrolyzes UDP-2,3-diacylglucosamine to lipid X as an obligatory biosynthetic reaction. Thus, hydrolytic chemistry does not imply catabolism when the reaction lies inside an anabolic pathway"

condition_overlap:
  assessment: SIGNIFICANT
  notes: >-
    The 51 named FunFams occupy only 26 distinct CATH superfamilies, and ten superfamilies
    are reused across two or more condition sets: 3.40.50.2000 across six (CS13, 14, 17,
    32, 33, 34), 3.90.550.10 across six (CS21, 23, 39, 40, 41, 50), and 3.40.50.720,
    3.40.640.10 and 3.60.21.10 across three each. Outright redundancy: KDSR is matched
    three times, by InterPro (CS4) and by two FunFams of one Rossmann superfamily (CS9
    Eukaryota, CS36 Saccharomycotina - a taxon subset of CS9); DPM1 is matched twice by
    CS23 and CS50, two FunFams of 3.90.550.10 carrying the identical CATH label; GPI
    ethanolamine phosphate transferases appear as CS22 and CS47 in 3.40.720.10. Worse than
    the duplication is the disagreement: 3.60.21.10 supplies the catabolic sphingomyelin
    phosphodiesterase (CS19), the biosynthetic LpxH (CS38) and an unidentified
    metallophosphoesterase (CS48), and 3.40.640.10 supplies both serine
    palmitoyltransferases and 5-aminolevulinate synthase. Quantitative pairwise overlap
    could not be computed because the analysis tool declines rules with more than 12
    condition sets; the superfamily census in scripts/census_arba00028538.py --cath is
    the substitute.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028538/ARBA00028538-analysis.md
    supporting_text: "Ten superfamilies are reused across two or more condition sets, and the\nsame-superfamily neighbours frequently disagree about the biology"
  - reference_id: file:rules/arba/ARBA00028538/ARBA00028538-deep-research-falcon.md
    supporting_text: "Conditions 23 and 50 appear redundant and should be merged after checking whether they represent distinct historical FunFam models."

go_specificity:
  assessment: MISMATCHED
  notes: >-
    The consequent is obsolete. GO:0046467 was obsoleted on 2025-12-09 and renamed
    "obsolete membrane lipid biosynthetic process", with replaced_by GO:0008610 lipid
    biosynthetic process; the stated reason is that the term "groups lipids by their
    localization rather than by their metabolic function, which is problematic since most
    lipids can function in multiple locations". QuickGO returns 0 annotations to it from
    any source. Beyond the obsoletion the term choice was already wrong in two distinct
    ways: directionally, for the five hydrolase condition sets, where the correct terms lie
    in the catabolic subtree; and by pathway, for the six GPI/dolichol sets, where GPI
    anchor biosynthesis (GO:0006506) and dolichol phosphate mannose biosynthesis
    (GO:0180047) are the right terms - the latter being exactly the point made in
    go-annotation#5835 about Dpm1, and the term UniProt already assigns to the flagged
    protein O14466. For the ~26 defensible sets the term was merely far too broad;
    GO:0030148, GO:0046513, GO:0006688 and GO:0009245 are available. Because the errors
    are of three different kinds, no single replacement term fixes the rule.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028538/ARBA00028538-analysis.md
    supporting_text: "*** the rule asserts an OBSOLETE GO term ***"
  - reference_id: file:rules/arba/ARBA00028538/ARBA00028538-analysis.md
    supporting_text: "GO:0046467 exact, any source        : 0"
  - reference_id: file:rules/arba/ARBA00028538/ARBA00028538-deep-research-falcon.md
    supporting_text: "For hydrolases, the term is directionally wrong rather than merely broad."

taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    The 39 taxon conditions name 34 distinct taxa, and 12 of the 51 sets carry no taxon
    constraint at all - a distribution that reflects where training annotations happened
    to sit rather than any phylogenetic judgment. Most scopes are far narrower than the
    biology: Homo for sphingosine kinase 2 (CS31) and Hominidae for serine
    palmitoyltransferase 2 (CS27), both pan-eukaryotic enzymes; Glires for B4GALT6 (CS21);
    Euarchontoglires for ST3GAL (CS3) and PNPLA1 (CS25); Primates for the protein kinase
    (CS12). A handful run the other way and are too broad: Bacteria for the lipid A
    acyltransferases (CS7) and PagP (CS10), despite well-documented plasticity of lipid A
    architecture across bacterial phyla, and Eukaryota for the generic glycosyltransferase
    set (CS6). In CS37 the taxon constraint is actively misleading rather than merely
    arbitrary: a FunFam named "5-aminolevulinate synthase, mitochondrial" is restricted to
    Bacteroidota, and the restriction hides the fold-level false positive instead of
    catching it. TOO_NARROW is recorded because arbitrary narrow clades are the dominant
    pattern, but the underlying problem is that taxon conditions here are doing filtering
    work, not encoding conservation.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028538/ARBA00028538-deep-research-falcon.md
    supporting_text: "Taxonomic restrictions such as Primates, Streptophyta, or Bacteroidota cannot rescue a mechanistically unrelated signature."
  - reference_id: file:rules/arba/ARBA00028538/ARBA00028538-analysis.md
    supporting_text: "The 39 taxon conditions name **34 distinct taxa**, and 12 of the 51\nsets carry no taxon constraint at all."

