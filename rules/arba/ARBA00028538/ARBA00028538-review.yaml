  - statement: "The 51 FunFams occupy only 26 CATH superfamilies; 3.40.640.10 supplies both serine palmitoyltransferases and 5-aminolevulinate synthase, and 3.60.21.10 supplies both the catabolic SMPD and the biosynthetic LpxH."
  - statement: "At most 26 of 51 condition sets describe an enzyme that builds a membrane lipid; 9 would become false rather than merely vague if the consequent were remapped to GO:0008610."
- id: file:rules/arba/ARBA00028538/ARBA00028538-deep-research-falcon.md
  title: "Deep research analysis via Falcon (Edison Scientific), 21 citations"
  findings:
  - statement: "Independent per-condition audit of all 51 sets concludes the rule is not valid in its present OR-ed form and should be split by pathway and reaction direction."
  - statement: "Flags CS12, CS26, CS37 and CS43 as mechanistically unrelated, and CS2, CS5, CS15, CS19, CS45 as catabolic - matching the fold-based analysis derived independently from CATH superfamily membership."
  - statement: "Did not know GO:0046467 is obsolete: the prompt supplied the pre-obsoletion label from this repository's stale rules/_labels.json cache, so its recommendation to rely on GO ancestor propagation to GO:0046467 is no longer available."
  - statement: "Its executive summary enumerates 14 removal candidates while claiming 12, and cites Grabner et al. 2022 (adipocyte lipolysis inhibitors) for PNPLA1's role in epidermal acylceramide synthesis; the per-set verdicts are sound but the roll-up counts and that one citation should not be quoted."
- id: file:rules/arba/ARBA00028538/scripts/census_arba00028538.py
  title: "Reproducible census of the rule, its consequent term, and the protein flagged in go-annotation#5835"
  findings:
  - statement: "Fetches the rule from rest.uniprot.org/arba, the term from QuickGO, and the CATH superfamily names live; all numbers in the analysis are reproducible from this script."
  - statement: "S. pombe Dpm1 (O14466) no longer carries ARBA00028538, but still carries GO:0046474 from ARBA00028351 and GO:1901137 from ARBA00026302, which make the same category error."
- id: PMID:34445706
  title: "Acid Sphingomyelinase, a Lysosomal and Secretory Phospholipase C, Is Key for Cellular Phospholipid Catabolism."
  findings:
  - statement: >-
      Frames acid sphingomyelinase as a catabolic enzyme: "sphingolipids of mammalian cells
      are degraded in a stepwise manner without an effective bypass in human lysosomal
      catabolism", and "The recessively inherited ASMD mainly leads to impaired cellular SM
      catabolism causing progressive SM accumulation in the cellular membranes." This is the
      direct basis for calling CS5 (SMPD1 architecture) and CS19 (sphingomyelin
      phosphodiesterase FunFam) directionally wrong.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.3390/ijms22169001 via NCBI esearch and cached with full text
      on 2026-08-29. The quoted sentences were checked verbatim against the cached text. The
      title alone carries the argument: this enzyme is classified as a phospholipase C for
      catabolism, not a biosynthetic enzyme.
- id: PMID:38458396
  title: "Common and varied molecular responses of Escherichia coli to five different inhibitors of the lipopolysaccharide biosynthetic enzyme LpxC."
  findings:
  - statement: >-
      "The essential enzyme LpxC catalyzes the first committed step of LPS synthesis and thus
      represents a promising antibiotic target", and "Instead of the first enzyme LpxA, which
      catalyzes a reversible reaction, the second enzyme, LpxC, is the main driver in this
      process as it catalyzes the first committed step". This supports CS24 (LpxC) as a
      genuine biosynthetic condition and, with it, the general point that hydrolytic chemistry
      inside an anabolic pathway (CS38, LpxH) is still biosynthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.1016/j.jbc.2024.107143 and cached with full text on
      2026-08-29; both quotes checked verbatim against the cached text.
- id: PMID:26563290
  title: "Biosynthesis of GPI-anchored proteins: special emphasis on GPI lipid remodeling."
  findings:
  - statement: >-
      Describes the GPI backbone as "ethanolamine phosphate (EtNP), three mannoses (Mans), one
      non-N-acetylated glucosamine, and inositol phospholipid" whose "Fatty chains of inositol
      phospholipids are inserted into the outer leaflet of the plasma membrane". GPI is
      therefore a membrane glycolipid, which is why CS22/CS46/CS47 are not absurd - but the
      informative term is GO:0006506, not a generic lipid-biosynthesis term.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.1194/jlr.R063313; the cached record is abstract-only
      (full_text_available: false), so only the abstract was quoted. It establishes GPI
      structure and membrane insertion, not the Dol-P-Man donor claim, for which UniProt's own
      GO:0180047 annotation on O14466 is the checkable anchor.
- id: PMID:26139634
  title: "Functional classification of CATH superfamilies: a domain-based approach for protein function annotation."
  findings:
  - statement: >-
      The FunFam method paper states that "the functional annotations provided by FunFams are
      found to be more precise compared with those generated by other domain-based resources".
      FunFam membership is nonetheless a prediction of functional coherence within a
      superfamily, not a measurement of a specific reaction - which is what CS8 (a ceramide
      synthase FunFam inside a Homeodomain-like superfamily), CS16/CS30 (cytochrome b5-like
      superfamily) and CS44 (Ets-1 winged-helix superfamily) illustrate.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.1093/bioinformatics/btv398 and cached with full text on
      2026-08-29; quote checked verbatim. Cited for the method's own scope, not against it.
- id: PMID:34357010
  title: "Ceramide Metabolism Enzymes-Therapeutic Targets against Cancer."
  findings:
  - statement: >-
      States plainly that "ceramidases catalyze the degradation of ceramide to sphingosine",
      naming "alkaline ceramidases (encoded by ACER1, ACER2 and ACER3), acidic ceramidase
      (encoded by ASAH1) and neutral ceramidase (encoded by ASAH2)". This covers CS2 (ACER
      InterPro entry) and CS15 (ASAH2 FunFam), both of which the rule assigns to a
      biosynthetic term.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.3390/medicina57070729 and cached with full text on 2026-08-29;
      quotes checked verbatim. This is the review the Falcon report leans on for the de novo
      sphingolipid pathway as well as for the ceramidases.
- id: PMID:28942130
  title: "Biosynthesis and structure-activity relationships of the lipid A family of glycolipids."
  findings:
  - statement: >-
      "Lipid A, the conserved, lipid component of LPS, anchors LPS to the outer membrane", and
      while "E. coli acyl transferases are chain length specific, orthologs from other
      Gram-negative bacteria are more tolerant, yielding a heterogeneous Lipid A composition of
      the outer membrane." The first clause supports CS7/CS24/CS38 as membrane-lipid
      biosynthesis; the second is why the "Bacteria" taxon scope on CS7 and CS10 is too broad.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.1016/j.cbpa.2017.07.008 and cached with full text on
      2026-08-29; both quotes checked verbatim against the cached text.
