  and 45) were checked against Swiss-Prot members and their GO annotations. In each case a matched protein
  carries a curated annotation to a lipid biosynthetic process: the ceramidases, sphingomyelinase and
  glucosylceramidase are annotated to biosynthesis of their products ceramide and sphingosine; protein
  kinase D and the chloroplast phosphoglycerate kinases are annotated to sphingolipid and galactolipid
  biosynthesis; and the Bacteroidota set selects serine palmitoyltransferases. So these sets reflect existing
  annotations rather than fold-level errors. The other 42 sets were not checked. Meaning and parsimony
  were not judged in full because the rule is gone. From the nine checked sets the pattern is an umbrella
  term over unrelated units: sphingolipid hydrolases annotated to biosynthesis of their products, protein
  kinase D reached through a Reactome pathway statement, chloroplast phosphoglycerate kinases reached
  through one genetic study, and bacterial serine palmitoyltransferases.
action: WITHDRAWN
action_rationale: >-
  UniProt no longer serves the rule (HTTP 404 on 2026-11-09) and its only consequent is an obsolete GO
