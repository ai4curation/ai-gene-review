  through 23 alternative condition sets. Sets 1 and 3 to 8 and the FunFams of superfamilies 1.10.287.990 and 3.55.40.20
  identify iron/manganese superoxide dismutases; set 2 and the FunFams of superfamily 2.60.40.200 identify copper/zinc
  superoxide dismutases. Most sets carry a taxon condition.
status: COMPLETE
