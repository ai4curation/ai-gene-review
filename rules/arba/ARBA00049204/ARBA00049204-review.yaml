review_summary: All 23 live condition sets were checked against Swiss-Prot. Each has at least two reviewed matches
  (2 to 54 per set) and every reviewed match of every set carries EC 1.15.1.1. Checked against Swiss-Prot by UniProtKB
  query on 2026-11-09; TrEMBL matches were counted but not inspected.
action: ACCEPT
action_rationale: 'Every live condition set is supported by curated Swiss-Prot annotation: no reviewed match of
  any of the 23 sets lacks EC 1.15.1.1.'
taxonomic_scope:
  assessment: APPROPRIATE
  notes: 'The taxon conditions go with precise sets. The copper/zinc binding domain alone is not specific: of 195
    Swiss-Prot proteins with IPR001424, 12 lack EC 1.15.1.1, and IPR024134 is named "Superoxide dismutase (Cu/Zn)/superoxide
    dismutase copper chaperone". The live sets that use copper/zinc signatures match only EC 1.15.1.1 proteins in
    Swiss-Prot (set 2: 42 of 42).'
annotation_assessments:
- annotation_kind: CATALYTIC_ACTIVITY
  value: RHEA:20696
  label: 2 superoxide + 2 H(+) = H2O2 + O2 (EC 1.15.1.1)
  assessment: CORRECT
  correct_examples:
  - P04179
  - P09671
  - P24704
  - O78310
  - P07505
  - P09678
  notes: 'Swiss-Prot matches with EC 1.15.1.1, sets 1 to 23: 54/54, 42/42, 29/29, 21/21, 16/16, 13/13, 7/7, 5/5,
    54/54, 30/30, 25/25, 22/22, 15/15, 14/14, 5/5, 5/5, 5/5, 3/3, 2/2, 2/2, 2/2, 2/2, 2/2. Rule statistics: 19126
    unreviewed proteins.'
confidence: 0.85
corrections:
- date: '2026-11-10'
  withdrawn_claim: The rule needs modification because its 24 condition sets exceed a manageable threshold of 12
    and make it intractable to validate.
  correction: The number of condition sets says nothing about whether the annotations are right. Checked set by
    set, every one is supported.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'Live rule: 23 condition sets (2026-11-09)'
  - Swiss-Prot matches of each set all carry EC 1.15.1.1 (per-set counts in annotation_assessments)
- date: '2026-11-10'
  withdrawn_claim: Condition set 3 (IPR019831 with IPR036324, Metazoa) is the copper/zinc superoxide dismutase of
    animals.
  correction: Both entries are iron/manganese signatures, so set 3 identifies the mitochondrial Mn superoxide dismutase
    (e.g. human SOD2, P04179).
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
  - 'InterPro IPR019831: Manganese/iron superoxide dismutase, N-terminal (domain)'
  - 'InterPro IPR036324: Manganese/iron superoxide dismutase, N-terminal domain superfamily'
  - Swiss-Prot matches of CS3 include P04179 (SOD2, human)
- date: '2026-11-10'
  withdrawn_claim: IPR001189 is the manganese/iron superoxide dismutase alpha-hairpin domain and IPR050265 its C-terminal
    domain; IPR019832 and IPR036314 are an iron/manganese family and its alpha-hairpin domain.
  correction: These labels were wrong; the official names are given in evidence.
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
  - 'InterPro IPR001189: Manganese/iron superoxide dismutase (family)'
  - 'InterPro IPR050265: Iron/Manganese Superoxide Dismutase (family)'
  - 'InterPro IPR019832: Manganese/iron superoxide dismutase, C-terminal (domain)'
  - 'InterPro IPR036314: Manganese/iron superoxide dismutase, C-terminal domain superfamily'
- date: '2026-11-10'
  withdrawn_claim: A separate copper/zinc set for Endopterygota is redundant with the broader Metazoa set.
  correction: The Metazoa set is an iron/manganese set, so it could not have made a copper/zinc set redundant. The
    live rule has no Endopterygota set.
  error_type: STALE_RULE_VERSION
  evidence:
  - 'Live rule (2026-11-09): no condition with taxon Endopterygota; CS3 = IPR019831 AND IPR036324 AND Metazoa'
- date: '2026-11-10'
  withdrawn_claim: Broader taxonomic groups should replace the specific lineages, because the subdivision has no
    biological justification.
  correction: No check of precision under broader taxa was made. The copper/zinc domain also occurs in proteins
    without superoxide dismutase activity, so widening is not shown to be safe.
  error_type: TAXON_MISREAD
  evidence:
  - 'UniProtKB query xref:interpro-IPR001424 AND reviewed:true: 195 entries; 12 without ec:1.15.1.1'
  - 'InterPro IPR024134: Superoxide dismutase (Cu/Zn)/superoxide dismutase copper chaperone'
