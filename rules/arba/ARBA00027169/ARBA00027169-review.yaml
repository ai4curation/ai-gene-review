    the last group carry a more specific complex term, and the snRNP and Lsm2-8 rules already assert those
    terms with the same signatures. rule_redundancy.tsv (a snapshot with 21 sets) counts 8 sets covered
    by GO:0030532; against the live rules 9 of 27 sets are matched with the same taxon and 24 on signatures,
    and UniProtKB queries show the 15 unrestricted sets among them match no entry outside Eukaryota. The
    rule emits 6,456 annotations in QuickGO (withFrom=ARBA:ARBA00027169). Figures updated from rule_redundancy.tsv
    as rebuilt on 2026-11-12 from the rules UniProt serves now (27 condition sets): covered sets 8 in
    the earlier table, 9 now. Where the prose of this review quotes the earlier figure, this one replaces
