    Twenty-four of 27 sets do no work. Each of sets 4 and 7 to 27 shares its signatures with a set of
    ARBA00033820 (GO:0030532 (small nuclear ribonucleoprotein complex), 23 sets), and ARBA00089766 (GO:0120115
