review_summary: >-
  Accuracy: all 27 live condition sets were examined. Every set matches Swiss-Prot entries, and in each
  at least one matched entry carries GO:0120114 (Sm-like protein family complex) or a descendant with
  experimental evidence; no matched Swiss-Prot entry lacks the term. Spliceosomal snRNPs are subclasses
  of the term (GO:0030532 (small nuclear ribonucleoprotein complex) is_a GO:0120114 (Sm-like protein family
  complex)), so snRNP proteins without an Sm fold, such as SF3B1, PRPF8, BRR2 and Snu114, are covered
  correctly. Meaning and parsimony: 24 of the 27 sets (4 to 27) select proteins of a particular snRNP
  or of the Lsm2-8 ring, and for all 24 a rule asserting a more specific term already uses the same signatures:
  ARBA00033820 asserts GO:0030532 (small nuclear ribonucleoprotein complex) for 22 of them and ARBA00089766
  asserts GO:0120115 (Lsm2-8 complex) for sets 5 and 6, with further rules for the individual U1, U2,
  U5, U6 and U7 snRNPs. Those sets emit nothing from this rule. Only sets 1 to 3, which are InterPro signatures
  spanning both Sm and Lsm paralogs, do work, and for them the umbrella term is the right level.
action: MODIFY
action_rationale: >-
  The annotations are true, but the rule is nine-tenths duplicate. Sets 4 to 27 are matched on their signatures
  by rules for descendants of the consequent, and none of the 15 that lack a taxon here matches any non-eukaryotic
  entry, so the Eukaryota condition on the covering rule excludes nothing. Removing those sets changes
  no annotation. What remains, sets 1 to 3, selects the Sm and Lsm fold families themselves, whose members
  sit in different Sm-like rings, and GO:0120114 (Sm-like protein family complex) is the most specific
  term true of all of them.
suggested_modifications:
- >-
  Remove sets 4 to 27: each shares its signatures with a set of ARBA00033820 (GO:0030532 (small nuclear
  ribonucleoprotein complex)) or, for sets 5 and 6, ARBA00089766 (GO:0120115 (Lsm2-8 complex)), so the
  more specific term is already assigned to the same proteins.
- >-
  Keep sets 1 and 2, whose Swiss-Prot matches mix Sm proteins of snRNPs with Lsm proteins of the Lsm2-8
  and Lsm1-7 rings.
- >-
  Consider moving set 3 (Lsm3, two InterPro signatures in Eukaryota) to GO:0120115 (Lsm2-8 complex), which
  its members carry and which set 5 already receives through ARBA00089766.
