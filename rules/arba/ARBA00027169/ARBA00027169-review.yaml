    Lsm3 (8 and 6 Swiss-Prot entries). rules/arba/_interpro2go.txt has no InterPro entry mapped to the
    consequent.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    Most sets are unrestricted or Eukaryota, which fits complexes found in all eukaryotes. A few are narrower
    than the biology (Rattus in set 15 for SmB and SmN, Mammalia in set 17, Craniata in set 18), following
    the species of the annotated proteins; those sets are among the ones to remove. Set 1 has no taxon
    and 223 of its 7,545 UniProtKB matches are outside Eukaryota; whether the term is apt for those was
    not checked.
