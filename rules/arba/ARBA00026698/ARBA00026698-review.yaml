review_summary: >-
  Accuracy: all 40 live condition sets were examined. Twenty-six match Swiss-Prot entries, and in every
  one of them at least one matched entry carries GO:0007034 (vacuolar transport) or a descendant with
  experimental evidence; no matched Swiss-Prot entry lacks the term. The other 14 sets are Archaea or
  Bacteria copies of eukaryotic sets and match no UniProtKB entry. Meaning and parsimony: the working
  sets all concern traffic to the vacuole or lysosome, but they fall into four groups that curated annotation
  distinguishes: protein targeting to the vacuole by sorting receptors (4 sets), the ESCRT and multivesicular
  body route from late endosomes (10), lysosomal transport in animals (9) and Golgi-to-vacuole SNAREs
  and adaptors (3). Each group has a child term of the consequent, and rules for three of those terms
  already match 8 of the working sets exactly. A third of the rule (14 sets) can never fire, and set 1
  repeats an InterPro2GO mapping.
action: SPLIT
action_rationale: >-
  The term is true and the families are related, so this is a mild case, but the curated annotations sit
  one level lower in every set and the lower-level rules exist (ARBA00087315, ARBA00033548, ARBA00026727,
  ARBA00086886). Splitting the 26 working sets among those terms gives each family the route it actually
  serves; the 14 empty sets should simply be deleted.
suggested_modifications:
- >-
  Delete the 14 sets that match no UniProtKB entry (2, 4, 10, 12, 15, 17, 26, 28, 32, 34, 35, 37, 38,
  40): Archaea and Bacteria copies of sets whose signatures occur only in eukaryotes.
- >-
  Send sets 3, 5, 7, 8 (plant vacuolar sorting receptors, fungal Vps10/sortilin) to GO:0006623 (protein
  targeting to vacuole) (ARBA00087315, which already matches sets 3 and 7).
- >-
  Send sets 6, 9, 11, 16, 18, 19, 27, 31, 33, 36 (ESCRT-I, ESCRT-II, ESCRT-III/Snf7, Vps4, Rsp5, Hse1/STAM,
  Pkh kinases, plant SYP2 syntaxins and RABF2) to GO:0045324 (late endosome to vacuole transport) (ARBA00026727).
- >-
  Send sets 1, 13, 21, 22, 23, 24, 25, 29, 30 (primate CHMPs, VPS4A/B, LAMP2, VPS53, HOOK, cystinosin,
  the cation-dependent mannose-6-phosphate receptor, AP-3 delta) to GO:0007041 (lysosomal transport) (ARBA00033548,
  which already matches sets 1, 13, 21, 24 and 29).
- >-
  Send sets 14, 20, 39 (plant SYP4 syntaxins, yeast GGA adaptors, Syn8) to GO:0006896 (Golgi to vacuole
  transport) (ARBA00086886).
- >-
  Set 1 (IPR005024 in Primates) duplicates the InterPro2GO mapping of IPR005024 to the consequent for
  the whole family and can be dropped in any case.
