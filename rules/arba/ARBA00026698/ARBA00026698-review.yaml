- date: '2026-11-12'
  withdrawn_claim: >-
    The rule is accepted as it stands; GO:0007034 is appropriate as the common term, and the empty Archaea
    and Bacteria sets are harmless.
  correction: >-
    Every working set is annotated by curators one level below the consequent, in four recognisable groups,
    and rules for those child terms already exist and match 8 working sets exactly. Fourteen sets that
    cannot fire and one that repeats an InterPro2GO mapping are a parsimony defect, not a harmless detail.
  error_type: MEANING_NOT_JUDGED
  evidence:
  - Per-set curated terms in rule.condition_sets[].notes (QuickGO, November 2026)
  - >-
    rest.uniprot.org/arba search: ARBA00033548 asserts GO:0007041, ARBA00087315 asserts GO:0006623, ARBA00026727
    asserts GO:0045324, ARBA00086886 asserts GO:0006896
  - >-
    rules/arba/_interpro2go.txt: InterPro:IPR005024 Snf7 family > GO:vacuolar transport ; GO:0007034
  - >-
    projects/ARBA_REVIEW/rule_redundancy.tsv: ARBA00026698 go_descendants 35, condition_sets 40, covered_sets
    10
parsimony:
  assessment: REDUNDANT
  notes: >-
    Fourteen of 40 sets match no UniProtKB entry. Of the 26 that do, 8 are matched exactly by a rule for
    a descendant term (sets 1, 13, 21, 24 and 29 by ARBA00033548, GO:0007041 (lysosomal transport); sets
    3 and 7 by ARBA00087315, GO:0006623 (protein targeting to vacuole); set 18 by ARBA00026727 and ARBA00086453)
    and 9 more working sets (9, 14, 19, 20, 22, 23, 30, 36, 39) share signatures with such a rule under
    a different taxon (rest.uniprot.org/arba search over all 35 descendants of the consequent, 2026-11-12).
    Sets 3 and 7 both select the plant vacuolar sorting receptors (8 Swiss-Prot entries each), and sets
    5 and 8 both select fungal sortilins (63 Swiss-Prot entries each), by different signatures. rules/arba/_interpro2go.txt
    maps IPR005024 to the consequent (line 'InterPro:IPR005024 Snf7 family > GO:vacuolar transport ; GO:0007034'),
    so set 1, the same entry restricted to Primates, adds nothing to InterPro2GO.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    The taxa on the working sets mostly follow the biology: plant receptors and syntaxins in Streptophyta,
    Embryophyta or eudicotyledons, fungal ESCRT and sortilin sets in Fungi or Dikarya, lysosomal factors
    in animal clades. Some animal sets are narrower than the families (Primates for CHMPs in sets 1 and
    13, Muridae for LAMP2 in set 21, Haplorrhini for HOOK in set 23), which is narrow coverage. The Archaea
    and Bacteria sets are unnecessary: their signatures do not occur there.
