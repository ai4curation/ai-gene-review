id: ARBA00026698
description: Assigns GO:0007034 vacuolar transport through 40 alternative condition sets, each a 
  conjunction of InterPro or CATH FunFam signatures with a taxon. The sets cover 
  ESCRT-III/Snf7-family proteins, ESCRT-I and ESCRT-II subunits, Vps4, sortilin/Vps10 and plant 
  vacuolar sorting receptors, vacuolar syntaxins, GGA/VHS adaptors, NEDD4/Rsp5-type ubiquitin 
  ligases and a few other families.
