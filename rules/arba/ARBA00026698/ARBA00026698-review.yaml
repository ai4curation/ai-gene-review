    matches have experimental annotation, with ESCRT-I (set 6) and LAMP2 (set 21) placed with their pathway.
    The four groups are related (all endolysosomal trafficking), which is why confidence in splitting
    is moderate, but none of them is annotated by curators at the level of the consequent. rule_redundancy.tsv
    counts 10 sets covered by GO:0007041, GO:0006896 and GO:0045324; against the live rules 10 of 40 sets
    are matched exactly (8 working, 2 empty) and 23 on signatures. The rule emits 9,246 annotations in
    QuickGO (withFrom=ARBA:ARBA00026698).
