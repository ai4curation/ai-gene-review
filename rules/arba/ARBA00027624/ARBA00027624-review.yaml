taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    Judged on the 60 recorded sets. Several confine a pan-eukaryotic family to the clade where its curated
    annotations are: ESCRT-III to Primates (set 6), cation efflux transporters to Haplorrhini (set 7),
    ABCD transporters to Muridae (set 21), Rab GTPases to Rattus (set 37), homeodomain TRAM/LAG1/CLN8-domain
    proteins to Mus (set 48). That is narrow coverage following the training annotations, not wrong annotation.
    Restrictions such as Fungi for PEX14 signatures (set 10) or Bacteria for magnetochrome proteins (set
    38) go with the signature.
