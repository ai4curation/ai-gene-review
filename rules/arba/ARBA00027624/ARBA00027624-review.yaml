review_summary: >-
  Accuracy: the first 60 of 472 live condition sets (CS1 to CS60) were queried against Swiss-Prot on 2026-11-09;
  the other 412 were not examined. A match counts as supported when it carries GO:0031090 (organelle membrane)
  or an is_a/part_of descendant with evidence other than ARBA. Of the 60, 50 are fully supported, 10 partly,
  and none is unsupported or without reviewed matches. Meaning and parsimony: the judgement does not need
  the other 412 sets. GO:0031090 has 333 descendants and is in the GO subset gocheck_do_not_annotate,
  a grouping term not meant for direct annotation; it says a protein is in the membrane of some organelle
  without saying which. The recorded sets select families whose membrane is known and curated: inositol
  trisphosphate and ryanodine receptors and seipin in the endoplasmic reticulum membrane, prohibitin,
  the pyruvate carrier and TIM44 in the mitochondrial inner membrane, PEX11 and PEX14 in the peroxisomal
  membrane, V-ATPase proteolipids in the vacuolar V0 domain, ESCRT-III, AP-2 and coatomer on their vesicle
  membranes, magnetosome proteins in the magnetosome membrane. For MHC class I heavy chains (sets 1 and
  2) the term holds only through Reactome trafficking steps; their curated location is the plasma membrane.
  rule_redundancy.tsv finds 193 of the rule's 322 sets already matched by a rule asserting a more specific
  term, and QuickGO holds no annotation attributed to this rule (2026-11-12).
action: SPLIT
action_rationale: >-
  The rule should be split by organelle. Its consequent is a do-not-annotate umbrella, the families it
  selects each have a specific membrane or membrane complex term in curated annotation, most of its sets
  are already covered by rules with such terms, and it emits no annotation as served. Units were assigned
  for 19 of the 60 recorded sets, chosen because the signature names one family, with one member each
  looked up; accuracy was established for 60 of 472 sets. Confidence reflects both limits. Retiring the
  rule outright would also be defensible.
confidence: 0.75
suggested_modifications:
- Stop asserting GO:0031090 (organelle membrane); it is in gocheck_do_not_annotate.
- >-
  Drop the sets already matched by rules asserting a more specific term (193 of 322 in rule_redundancy.tsv;
  covering terms GO:0098588 bounding membrane of organelle, GO:0019866 organelle inner membrane, GO:0030659
  cytoplasmic vesicle membrane, GO:0030662 coated vesicle membrane, GO:0005789 endoplasmic reticulum membrane).
- >-
  Move the remaining sets to the membrane of their unit, as in biological_units: sets 3, 4, 24, 28 to
  GO:0005789 (endoplasmic reticulum membrane) or the complex term; sets 25, 32, 33 to GO:0005743 (mitochondrial
  inner membrane); sets 10, 57 to GO:0005778 (peroxisomal membrane); set 26 to GO:0000220 (vacuolar proton-transporting
  V-type ATPase, V0 domain); set 20 to GO:0005774 (vacuolar membrane); set 6 to GO:0000815 (ESCRT III
  complex); set 8 to GO:0030122 (AP-2 adaptor complex); set 14 to GO:0030126 (COPI vesicle coat); set
  58 to GO:0012507 (ER to Golgi transport vesicle membrane); sets 38, 40 to GO:0110146 (magnetosome membrane).
- >-
  Drop sets 1 and 2 (MHC class I heavy chain signatures): the curated location of these proteins is the
  plasma membrane and GO:0042612 (MHC class I protein complex); organelle membrane terms reach them only
  as Reactome transit steps.
