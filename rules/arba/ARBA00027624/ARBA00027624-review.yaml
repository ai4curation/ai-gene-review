corrections:
- date: '2026-11-10'
  withdrawn_claim: The rule should be deprecated because 304 condition sets are 25 times a 
    recommended maximum of 12.
  correction: Set count is not evidence about any annotation.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'Live rule: 472 condition sets (2026-11-09)'
- date: '2026-11-10'
  withdrawn_claim: GO:0031090 is too general to use, and grouping membranes of organelles with 
    different targeting mechanisms is incoherent and contradicted by the literature.
  correction: GO:0031090 is a valid grouping term for the membrane of any organelle; a protein of 
    the mitochondrial, ER or nuclear membrane is correctly described by it. How proteins reach 
    different organelles has no bearing on whether the term is true. No publication was cited.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - 'QuickGO GO:0031090: organelle membrane, not obsolete; 332 is_a/part_of descendants'
- date: '2026-11-10'
  withdrawn_claim: 67% of condition sets contain a single FunFam, which indicates promiscuous 
    annotation and false positives.
  correction: A FunFam is a narrow functional family; a single-FunFam condition is not evidence of 
    imprecision, and no false positive was shown.
  error_type: UNEXAMINED_RULE
  evidence:
  - 'Earlier version of this file: condition_sets empty, protein counts 0'
- date: '2026-11-10'
  withdrawn_claim: Organelle targeting mechanisms evolved independently and are not conserved across
    broad taxa, so the taxonomic scope is too broad.
  correction: This was asserted without a source and does not bear on a cellular component 
    annotation. The taxon conditions restrict individual sets.
