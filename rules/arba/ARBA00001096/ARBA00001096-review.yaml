review_summary: The single condition set was examined. The rule annotates 9,242 TrEMBL entries. The most
  specific condition, the family IPR025532, is nested in the other two, so the conjunction selects the
  same proteins as IPR025532 alone. All five Swiss-Prot members carry EC 5.1.3.15, one from a published
  assay and four by similarity to it.
action: ACCEPT
action_rationale: The rule fires on a family signature named for the activity, and every reviewed member
  has that activity in UniProt. The two broader conditions are redundant but harmless.
parsimony:
  assessment: REDUNDANT
  notes: 'IPR008183 and IPR011013 add nothing to IPR025532: of 9,248 UniProtKB entries with IPR025532,
    one lacks IPR008183 and none lacks IPR011013 (UniProtKB queries, November 2026). The rule could be
    reduced to IPR025532 without changing its output materially.'
literature_support:
  assessment: MODERATE
  notes: 'UniProt record Q03161 (YMY9_YEAST): catalytic activity RHEA:16249, EC 5.1.3.15, evidence ECO:0000269
    PubMed:16857670. The other four Swiss-Prot members are annotated by similarity to Q03161.'
