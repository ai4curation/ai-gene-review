parsimony:
  assessment: ACCEPTABLE
  notes: >-
    Set 1 (domain plus active site, Primates) matches 660 UniProtKB entries. Set 2 matches 284, of which
    45 are not in set 1; set 3 matches 157, of which 8 are not in set 1; within primates set 4 adds nothing
    to set 1 (0 entries) but outside primates it is the only set that fires (3,192 eukaryotic entries)
    (UniProtKB queries, November 2026). So sets 2 and 3 are largely, not wholly, redundant, and their
    extra matches are entries that lack the active-site signature and should be looked at before the sets
    are relied on. rules/arba/_interpro2go.txt maps none of the rule's InterPro entries to the consequent
    (IPR016130 maps only to GO:0016311, dephosphorylation), so no single InterPro2GO line replaces the
    rule.
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    Sets 1 and 2 are restricted to Primates and set 3 to Haplorrhini, but active myotubularins are found
    across eukaryotes: 26 Swiss-Prot entries outside primates match the conditions of set 1, among them
    yeast Ymr1 (P47147). The restriction reflects where the experimental annotations are (human proteins),
    not where the enzyme occurs. This is narrow coverage, not wrong annotation; only set 4 (Eukaryota)
    reaches other lineages, and only for the MTMR3/MTMR4 subfamily.
