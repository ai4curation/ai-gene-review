review_summary: >-
  Accuracy: all four live condition sets were examined. Every Swiss-Prot entry matching any set carries
  GO:0052629 (phosphatidylinositol-3,5-bisphosphate 3-phosphatase activity), and each set contains members
  annotated from experiments (MTMR2, MTMR3, MTMR4, MTMR6, MTMR8, MTM1, MTMR1). In set 1 the active-site
  condition IPR016130 (Protein-tyrosine phosphatase, active site) is what separates the active myotubularins
  from the catalytically inactive family members. Meaning and parsimony: the four sets select one biological
  unit, the catalytically active myotubularins, and the consequent is a leaf term (no descendants) that
  experiments place on the members themselves, so the rule says the most informative thing that is true
  of what it selects. Sets 2 and 3 mostly repeat set 1 (239 of 284 and 149 of 157 of their UniProtKB matches
  also match set 1), which is some redundancy but not sets that do nothing. Three of the four sets are
  restricted to primates, which follows where the human annotations are and not where the enzyme exists.
action: ACCEPT
action_rationale: >-
  Each condition set selects active myotubularins with curated, mostly experimental, annotation to the
  rule's own term; the term cannot be made more specific; and no simpler construction is available, because
  the family domain alone would include the inactive paralogs. The primate restrictions cost coverage
  and do not make any annotation wrong.
