    (MTMR9), Q9C0I1 (MTMR12), A4FU01 (MTMR11), Q9NXD2 (MTMR10); UniProt names each "Inactive phosphatidylinositol
    3-phosphatase"'
  - 'Live rule set 1: IPR010569 AND IPR016130 AND Primates (rest.uniprot.org/arba/ARBA00047230, 2026-11-09)'
- date: '2026-11-10'
  withdrawn_claim: The two CATH FunFams are completely disjoint, so the rule conflates distinct annotation
    patterns and should be split; condition overlap is significant.
  correction: Condition sets are alternatives, so sets that match different proteins are expected and
    are not overlap. Each set on its own selects annotated myotubularins.
