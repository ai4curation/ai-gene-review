- date: '2026-11-10'
  withdrawn_claim: Both FunFams show 100% containment in the GO term, suggesting redundancy with simpler
    domain-based annotations.
  correction: Full containment in the GO term means every matched Swiss-Prot protein has the function;
    it is evidence for the rule. No InterPro2GO mapping gives GO:0052629 for these entries.
