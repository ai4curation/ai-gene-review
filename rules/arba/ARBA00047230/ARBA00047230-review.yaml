  withdrawn_claim: The dual domain requirement in condition set 1 is overly restrictive and may exclude
    legitimate myotubularin proteins; remove the PTP domain condition.
  correction: The second condition excludes the catalytically inactive myotubularins, which must not receive
    a phosphatase activity term. Removing it would create false positives.
