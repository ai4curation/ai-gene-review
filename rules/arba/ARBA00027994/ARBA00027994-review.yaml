parsimony:
  assessment: OVERLY_COMPLEX
  notes: >-
    rule_redundancy.tsv: 47 of 167 sets are matched by a rule asserting a more specific term (the same
    count was obtained independently from the rules downloaded on 2026-11-12). Those sets emit nothing
    from this rule. QuickGO lists 35483 annotations attributed to the rule, so the uncovered sets are
    active. Each signature is used in one set and no set is contained in another. No single InterPro2GO
    mapping could replace the construction, because the sets are different families.
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    GO:0006338 (chromatin remodeling) has 235 is_a/part_of descendants, and the units examined carry curated
    descendants such as GO:0031507 (heterochromatin formation), GO:0034728 (nucleosome organization) and
    GO:0042054 (histone methyltransferase activity).
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    Chromatin remodeling is pan-eukaryotic and most sets are unrestricted or limited to large clades.
    Some restrictions follow where the supporting annotation sits (Taphrinomycotina for the bromodomain
    set 7, whose S. pombe members are PomBase-annotated; Mus, Muridae, Suina on sets not examined here);
    that is narrow coverage, not wrong annotation.
