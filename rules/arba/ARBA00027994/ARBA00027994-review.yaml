review_summary: >-
  Accuracy: nine of the 167 served condition sets were checked against curated annotations of their Swiss-Prot
  members (sets 1, 7, 13, 19, 46, 63, 108, 130 and 140). In each a reviewed member carries a curated term
  that is GO:0006338 (chromatin remodeling) or an is_a/part_of descendant, so no false positive was found;
  the earlier report of a false positive on human UBR7 was not reproducible. The other 158 sets were not
  checked. Meaning and parsimony: GO places histone modifying activities, ATP-dependent remodeler activity
  and heterochromatin formation under the term, so the rule is true across its sets, but it flattens units
  that each carry a more informative term: histone methyltransferases, class I histone deacetylases, Polycomb
  EZH1/EZH2 and DNA methyltransferase 1 (heterochromatin formation), CHD1 (nucleosome organization), transcription-coupled
  remodeling factors, a histone variant, and DNA topoisomerase I, whose defining process is outside the
  term. rule_redundancy.tsv finds 47 of 167 sets already matched by a rule asserting a more specific term.
action: SPLIT
action_rationale: >-
  The consequent is an umbrella over the whole of chromatin biology and each unit examined has a better
  curated term, several of which already have their own ARBA rules. Splitting toward those terms is the
  useful change. The verdict rests on a sample of nine sets (four recorded by the first pass, five added
  for families the signature label names); confidence reflects that.
suggested_modifications:
- >-
  Drop the sets already matched by rules asserting a more specific term (47 of 167 in rule_redundancy.tsv;
  covering terms GO:0040029 epigenetic regulation of gene expression, GO:0140993 histone modifying activity,
  GO:0042054 histone methyltransferase activity, GO:0032452 histone demethylase activity, GO:0140658 ATP-dependent
  chromatin remodeler activity). Of the sets recorded here these are 63 and 108.
- >-
  Move histone-modifying enzyme sets to their activity: sets 1 to GO:0042054 (histone methyltransferase
  activity), set 13 to GO:0046975 (histone H3K36 methyltransferase activity), set 46 to GO:0004407 (histone
  deacetylase activity).
- >-
  Move set 19 (EZH1/EZH2) and set 108 (plant DNA methyltransferase 1) to GO:0031507 (heterochromatin formation)
  or, for set 108, GO:0006346 (DNA methylation-dependent constitutive heterochromatin formation); set
  63 (CHD1) to GO:0034728 (nucleosome organization); set 7 to GO:0045815 (transcription initiation-coupled
  chromatin remodeling).
- >-
  Drop set 130 (DNA topoisomerase I FunFams) or move it to a DNA topology term: the family is a topoisomerase
  and reaches the consequent through single phenotype-based annotations.
- >-
  Reconsider set 140 (histone H2A.Z FunFam): a histone variant is a constituent of chromatin, not an agent
  of remodeling.
- Assign the 158 sets not examined here to units in the same way.
