taxonomic_scope:
  assessment: TOO_BROAD
  notes: >-
    Most taxon conditions follow where the structure exists: plant clades on plant wall sets, fungal clades
    on fungal sets, Mycobacteriaceae on set 32. Two do not. Set 4 (fatty acyl-AMP ligase signatures, NOT
    Vertebrata) and set 8 (FunFam 3.40.50.12780:FF:000013 in Bacteria) are meant for the mycobacterial
    FadD enzymes but also match Q6E7K9 (JamA, jamaicamide biosynthesis in the cyanobacterium Moorena producens)
    and C5BK10 (TtuA, polyyne biosynthesis in the gammaproteobacterium Teredinibacter turnerae), natural-product
    ligases with no cell wall role. Both currently receive GO:0071766 from ARBA00050076, which covers
    these sets. A few other conditions are narrower than the biology, such as Liliopsida for the xylan
    O-acetyltransferases of set 1 and Malvales for the Rac GTPases of set 30; that limits coverage only.
