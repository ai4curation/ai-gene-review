review_summary: >-
  Accuracy: all 34 live condition sets were queried against Swiss-Prot, counting a match as supported
  when it carries GO:0042546 (cell wall biogenesis) or a descendant with evidence other than ARBA. In
  22 sets every reviewed match is supported; in 12 sets (CS2, CS3, CS4, CS6, CS7, CS8, CS10, CS11, CS20,
  CS21, CS22, CS32) only some are; no set is without support. Support is thin for CS11 (fungal mannose-1-phosphate
  guanylyltransferases, 1 of 12) and CS20 (phosphoglucosamine mutase GlmM, 71 of 316). The conditions
  of CS4 and CS8 also match two natural-product fatty acyl-AMP ligases outside the actinobacteria, JamA
  (Q6E7K9) and TtuA (C5BK10), for which a cell wall term is not true; these were listed as unsupported
  in the first pass and not adjudicated. Meaning and parsimony: "cell wall" here means four structures
  that share nothing but the name. The sets fall into plant wall units (cellulose synthase, xylan synthesis
  and acetylation, and other plant wall factors), the mycobacterial envelope lipid and arabinogalactan
  enzymes, fungal wall glucan and mannan enzymes with their regulators, bacterial peptidoglycan enzymes
  and the Bacillus spore coat protein SpoIVA. Each has a specific curated descendant: plant-type primary
  cell wall biogenesis, xylan biosynthetic process, Actinobacterium-type cell wall biogenesis, fungal-type
  cell wall biogenesis, peptidoglycan biosynthetic process, spore wall assembly. rule_redundancy.tsv finds
  16 of 34 sets already matched by rules asserting exactly such terms. Two sets select precursor-supply
  or signalling proteins with no curated wall term on the member looked up (CS11, CS22).
action: SPLIT
action_rationale: >-
  All 34 sets were assigned to a unit, and every unit but one has a more informative curated term in the
  wall type it belongs to. The rule should be split along those lines: an annotation that does not say
  whether the wall is plant, fungal, mycobacterial or peptidoglycan is of little use when the specific
  term is available from the same condition set. Sets 11 and 22 should be re-examined, not carried over.
confidence: 0.8
suggested_modifications:
- >-
  Drop the 16 sets that rule_redundancy.tsv reports as matched by rules asserting GO:0009272 (fungal-type
  cell wall biogenesis), GO:0009273 (peptidoglycan-based cell wall biogenesis), GO:0044038 (cell wall
  macromolecule biosynthetic process) or GO:0009832 (plant-type cell wall biogenesis); they emit nothing.
- >-
  Assign the remaining sets by unit: sets 2, 7, 25 to GO:0009833 (plant-type primary cell wall biogenesis);
  sets 1, 6, 13, 34 to GO:0045492 (xylan biosynthetic process); sets 16, 17, 27, 29, 30 to GO:0009832
  (plant-type cell wall biogenesis); sets 4, 8, 10, 14, 15, 18, 19, 21 to GO:0071766 (Actinobacterium-type
  cell wall biogenesis); set 32 to GO:0044038 (cell wall macromolecule biosynthetic process); sets 3,
  12, 23, 24, 26, 28 to GO:0009272 (fungal-type cell wall biogenesis); set 5 to GO:0046354 (mannan biosynthetic
  process); sets 9, 20, 33 to GO:0009252 (peptidoglycan biosynthetic process); set 31 to GO:0042244 (spore
  wall assembly).
- >-
  Restrict sets 4 and 8 to Mycobacteriales (or another actinobacterial taxon) before re-homing them: as
  written they match the natural-product ligases JamA (Q6E7K9, Moorena producens) and TtuA (C5BK10, Teredinibacter
  turnerae), which build no cell wall.
- >-
  Re-examine set 11 (mannose-1-phosphate guanylyltransferase FunFams in Fungi) and set 22 (MAP kinase
  FunFam 1.10.510.10:FF:000040 in Saccharomycotina): the members looked up (P41940, O74484, P36005) have
  no curated annotation at or under the consequent, and set 11 selects an enzyme of GDP-mannose supply,
  not of wall assembly.
