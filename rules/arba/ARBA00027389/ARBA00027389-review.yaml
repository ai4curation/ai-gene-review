review_summary: 'All 34 live condition sets were queried against Swiss-Prot, counting a match as supported when
  it carries GO:0042546 or a descendant with evidence other than ARBA. In 22 sets every reviewed match is supported;
  in 12 sets (CS2, CS3, CS4, CS6, CS7, CS8, CS10, CS11, CS20, CS21, CS22, CS32) only some are; no set is without
  support. The partly supported sets include mycobacterial cell-envelope lipid enzymes whose curated terms are descendants
  of GO:0042546, such as FadD26 P9WQ43 and PpsA P9WQE7 with GO:0071770 by IDA from PMID:15749014, and two sets where
  support is thin: CS11 (fungal mannose-1-phosphate guanylyltransferases, 1 of 12 supported) and CS20 (phosphoglucosamine
  mutase GlmM in Pseudomonadota, 71 of 316). An unsupported match is one without curated annotation, not one shown
  to be wrong, so these counts do not settle whether CS11 and CS20 are sound.'
action: UNDECIDED
action_rationale: Most sets are supported by curated annotation and no false positive was identified, but for CS11
  and CS20 most reviewed matches lack any independent annotation to the term, and that question was not resolved.
