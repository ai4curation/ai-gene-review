action_rationale: >-
  Glycolysis, the tricarboxylic acid cycle, oxidative phosphorylation and glycogen metabolism are
  all descendants of the rule term, so one rule for them is coherent. The defect found is the breadth
  of set 1. The counts are from Swiss-Prot, which is also what ARBA learns its rules from, so they
  show the condition sets are coherent rather than giving an independent error rate for unreviewed
  entries.
suggested_modifications:
- >-
  Narrow condition set 1 (IPR029061 with taxon Thermoproteota) so that it no longer matches acetolactate
  synthase, for example by requiring a signature specific to 2-oxoacid:ferredoxin oxidoreductases
  in place of the fold-level superfamily.
go_specificity:
  assessment: APPROPRIATE
  notes: >-
    GO:0006096, GO:0006099, GO:0006119, GO:0022904 and GO:0005977 each have GO:0015980 among their
    is_a or part_of ancestors (QuickGO), so the rule term is the shared parent of the pathways the
    sets cover.
annotation_assessments:
- annotation_kind: GO_TERM
  value: GO:0015980
  label: energy derivation by oxidation of organic compounds
  assessment: UNDECIDED
  discriminating_features:
  - >-
    Set 1 matches by fold alone; the reviewed matches are all 2-oxoacid:ferredoxin oxidoreductase
    subunits, while the acetolactate synthases that meet the same conditions are unreviewed.
  correct_examples:
  - Q96Y66
  - P72578
  notes: >-
    UniProtKB release 2026_04: set 1 (IPR029061 AND taxon Thermoproteota) matches 12 reviewed entries,
    all subunits of 2-oxoacid:ferredoxin oxidoreductase such as Q96Y66 and P72578, and 925 unreviewed
    entries. 51 of the unreviewed entries have EC 2.2.1.6, for example A0A2U9INF1 and G7VDF4, named
    Acetolactate synthase by RuleBase RU003591 and annotated to GO:0009099. The UniProtKB record of
    A0A2U9INF1 did not list GO:0015980 when retrieved on 2026-11-10, so the breadth is a property
    of the condition set as published; whether the annotation is emitted for these entries was not
    established.
confidence: 0.6
corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule is mechanistically incoherent because it combines unrelated pathways (glycolysis, the
    tricarboxylic acid cycle, electron transport, glycogen metabolism) with no shared functional basis.
  correction: >-
    Each of those pathways is a descendant of the rule term in GO, so the term is exactly what they
    share.
  error_type: ONTOLOGY_MISREAD
  evidence:
  - >-
    QuickGO ancestors (is_a, part_of): GO:0006096, GO:0006099, GO:0006119, GO:0022904 and GO:0005977
    each list GO:0015980.
- date: '2026-11-10'
  withdrawn_claim: The rule should be deprecated because the term is too broad for specific enzymes.
  correction: >-
    A general term that is true is not a wrong annotation. More specific terms can be added without
    removing this one.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - >-
    UniProtKB release 2026_04: in 68 of 69 sets every reviewed match carries GO:0015980 or a descendant.
- date: '2026-11-10'
  withdrawn_claim: >-
    The narrow taxon restrictions contradict the conservation of central metabolism and give a high
    risk of over-annotation.
  correction: >-
    A narrow taxon reduces how many proteins a set reaches and cannot cause over-annotation. Each
    restriction applies to one FunFam or signature, not to a pathway.
  error_type: LOW_RECALL_IS_NOT_WRONG
  evidence:
  - >-
    UniProt ARBA API, ARBA00026991, retrieved 2026-11-09: 48 of 69 condition sets contain a taxon
    condition, each attached to specific FunFam or InterPro conditions.
- date: '2026-11-10'
  withdrawn_claim: 83 condition sets exceed the recommended maximum and the analytical capacity.
  correction: >-
    The number of sets is not evidence about accuracy. All 69 live sets were checked against Swiss-Prot.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'UniProt ARBA API, ARBA00026991: 69 condition sets.'
- date: '2026-11-10'
  withdrawn_claim: >-
    The literature contradicts the rule, and several sets for related enzymes could give conflicting
    annotations.
  correction: >-
    The only source was the review's own research note. A rule with one consequent cannot give conflicting
    annotations.
  error_type: UNSUPPORTED_SOURCE
  evidence:
  - >-
    The old literature_support block cited only rules/arba/ARBA00026991/ARBA00026991-deep-research-manual.md.
  - 'UniProt ARBA API, ARBA00026991: one annotation, GO:0015980.'
