review_summary: >-
  Accuracy: all 69 live condition sets were checked against Swiss-Prot. In all but one, every reviewed
  match carries GO:0015980 (energy derivation by oxidation of organic compounds) or a descendant. Set
  29 has 9 reviewed matches of which 4 carry the term. Set 1 is too wide as written: it requires only
  the thiamin diphosphate-binding fold in Thermoproteota, a condition met by 51 unreviewed acetolactate
  synthases, which are biosynthetic enzymes. Meaning and parsimony: the 69 sets resolve into about ten
  pathway-level units, and curated annotation gives each a specific descendant: glycolysis, the tricarboxylic
  acid cycle, pyruvate decarboxylation to acetyl-CoA, the respiratory electron transport chain, anaerobic
  respiration, glycogen biosynthesis, glycogen catabolism and pyruvate fermentation. No reviewed match
  examined is curated to the consequent itself. Calling a glycogen synthase, a nitrate reductase and an
  enolase "energy derivation by oxidation of organic compounds" is true by ontology and tells a user nothing
  the specific terms do not. 51 sets are already matched by rules asserting a more specific term and emit
  nothing.
action: SPLIT
action_rationale: >-
  The term is the common ancestor of several pathways, not a property the sets share in any useful sense,
  and the pathway terms are available and curated on the members. The rule should be split by pathway.
  Most of it is already superseded by more specific rules (51 covered sets); what is left should be re-pointed,
  and set 1 narrowed as the first pass found.
suggested_modifications:
- >-
  Glycolysis sets (5, 11, 13, 19, 21, 27, 28, 33, 36, 41, 42, 43, 49, 60): assert GO:0006096 (glycolysis).
- >-
  Tricarboxylic acid cycle sets (35, 37, 46, 47, 53): assert GO:0006099 (tricarboxylic acid cycle).
- >-
  Pyruvate dehydrogenase complex sets (9, 17, 50, 62): assert GO:0006086 (pyruvate decarboxylation to
  acetyl-CoA).
- >-
  Mitochondrial and bacterial respiratory complex I, II and III sets (20, 22, 23, 24, 40, 54, 56, 63,
  64): assert GO:0022904 (respiratory electron transport chain), or the complex-specific descendants such
  as GO:0006120 (mitochondrial electron transport, NADH to ubiquinone) for sets 23 and 24.
- >-
  Enterobacterial nitrate reductase, formate dehydrogenase, DMSO reductase and c-type cytochrome sets
  (8, 10, 32, 38, 44, 52, 55, 65, 66): assert GO:0009061 (anaerobic respiration).
- >-
  Glycogen synthesis sets (2, 6, 12, 18, 26, 34, 45, 48, 57, 58, 59, 68, 69): assert GO:0005978 (glycogen
  biosynthetic process). Glycogen breakdown sets (4, 7, 15, 25, 39, 61): assert GO:0005980 (glycogen catabolic
  process).
- >-
  Fermentation sets: set 30 (L-lactate dehydrogenase) to GO:0019244 (pyruvate fermentation to lactate),
  set 31 (pyruvate decarboxylase) to GO:0019655 (pyruvate fermentation to ethanol).
- >-
  Narrow or remove condition set 1 (IPR029061 with taxon Thermoproteota) so that it no longer matches
  acetolactate synthase; sets 3, 14 and 16 already select the 2-oxoacid:ferredoxin oxidoreductases.
- >-
  Drop set 51 (glutamine--fructose-6-phosphate aminotransferase in Catarrhini) and set 67 (RGI family)
  unless better support is found: their only term under the consequent is GO:0006112 (energy reserve metabolic
  process), by TAS on GFPT1 and GFPT2 and by one IMP paper on RGI1 and RGI2.
