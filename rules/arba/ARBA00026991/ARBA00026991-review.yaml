    GO:0045333|GO:0006112|GO:0006113.
  - >-
    QuickGO 2026-11-12: P16861 GO:0006096 IDA PMID:3000145; P08417 GO:0006099 IMP PMID:1587456; P54840
    GO:0005978 IDA PMID:1731614; P19318 GO:0009061 IDA PMID:3311749.
- date: '2026-11-12'
  withdrawn_claim: >-
    In sets 1, 14 and 16 all reviewed matches carry GO:0015980 or a descendant by a manual-evidence GO
