    QuickGO 2026-11-12, Q96Y66 and P72578: the only non-TreeGrafter biological process annotation is GO:0006086
    IEA GO_REF:0000108; the IDA annotations (PMID:27619895 on Q96Y66; PMID:12009405 and PMID:8902625 on
    P72578) are in the molecular function aspect.
parsimony:
  assessment: REDUNDANT
  notes: >-
    51 sets are covered by rules asserting a more specific term (rule_redundancy.tsv) and emit nothing.
    Several pairs of sets select the same family once by InterPro and once by FunFam, with the same leading
    reviewed matches and near-equal counts: sets 2 and 12 (glycogen synthase, 10 and 10 reviewed), 5 and
    13 (pyruvate kinase, 10 and 10), 6 and 18 (glycogenin, 6 and 5), 7 and 15 (glycogen phosphorylase,
    6 and 6) (UniProtKB query 2026-11-12). Set 1 is the opposite problem, a fold-level condition that
    is too loose.
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    Many taxa follow the organism of the training annotation and not the pathway: pyruvate dehydrogenase
    E1 alpha to Homo (set 62), L-lactate dehydrogenase to Mus (set 30), aldolase to Hominidae (set 60),
    succinate--CoA ligase to Murinae (set 53), phosphorylase kinase to Rattus (set 39), enolase to Primates
    (set 27). Central metabolism is universal, so this is narrow coverage, not wrong annotation. The Enterobacterales
    limits on the anaerobic respiration sets follow where those enzymes were characterised and keep fold-level
    conditions (sets 8, 32) from over-reaching.
