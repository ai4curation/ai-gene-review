id: ARBA00028158
description: >-
  A 55-condition-set ARBA rule that assigns GO:0006366 (transcription by RNA polymerase II) to
  eukaryotic nuclear proteins. Eight condition sets use interpretable InterPro combinations and
  identify genuine components of the Pol II machinery (Spt6, ELL, TFIIF-beta/RAP30, TAF4, TAF2,
  Elongin A) plus one fungal RSC/polybromo chromatin-remodelling subunit. The remaining 47 sets
  are built from CATH FunFam identifiers, 27 of which fire on a single FunFam. Three named FunFam
  clauses reveal that the rule also reaches an ATP-dependent chromatin remodeller (CHD1), a
  ligand-activated DNA-binding transcription factor (AHR) and the Integrator endonuclease
  (INTS11) - classes for which the whole-process term is either uninformative or a distant
  ancestor of the term that actually describes them.
status: IN_PROGRESS
rule_type: ARBA
rule:
  rule_id: ARBA00028158
  go_annotations:
  - go_id: GO:0006366
    go_label: transcription by RNA polymerase II
  # `entries` cannot be populated: `just analyze-rule` refuses rules with >12 condition
  # sets ("Rule ARBA00028158 has 55 condition sets, which exceeds the maximum of 12"), so
  # no -analysis.yaml exists to sync from and no pairwise_overlap statistics are available.
  entries: []
  reviewed_protein_count: 0
  unreviewed_protein_count: 0
  created_date: '2021-10-20'
  modified_date: '2026-05-04'
  condition_sets:
  - number: 1
    notes: >-
      Spt6. IPR028088 is the Spt6-specific helix-turn-helix; the two generic folds (RuvA domain
      2-like, RNase H-like) are not diagnostic alone. Spt6 is a bona fide Pol II elongation factor,
      so GO:0006366 is a true but non-specific ancestor of the elongation and transcription-coupled
      chromatin terms that describe it.
    conditions:
    - condition_type: INTERPRO
      value: IPR010994
      curie: InterPro:IPR010994
      label: "RuvA domain 2-like"
    - condition_type: INTERPRO
      value: IPR012337
      curie: InterPro:IPR012337
      label: "Ribonuclease H-like superfamily"
    - condition_type: INTERPRO
      value: IPR028088
      curie: InterPro:IPR028088
      label: "Helix-turn-helix DNA-binding domain of Spt6"
  - number: 2
    notes: >-
      ELL. The ELL N-terminal signature carries the specificity; the occludin homology domain alone
      is shared with the tight-junction protein occludin and is not diagnostic.
    conditions:
    - condition_type: INTERPRO
      value: IPR010844
      curie: InterPro:IPR010844
      label: "Occludin homology domain"
    - condition_type: INTERPRO
      value: IPR019464
      curie: InterPro:IPR019464
      label: "RNA polymerase II elongation factor ELL, N-terminal"
    - condition_type: INTERPRO
      value: IPR031176
      curie: InterPro:IPR031176
      label: "ELL/occludin family"
  - number: 3
    notes: >-
      Fungal RSC/polybromo chromatin-remodelling subunit. This is the class the GO curator objected
      to in geneontology/go-annotation#6562: a remodeller receives the whole-process term.
      GO:0006338 chromatin remodeling plus GO:0006357 describe it better. A bromodomain is not
      diagnostic for Pol II transcription.
    conditions:
    - condition_type: INTERPRO
      value: IPR001487
      curie: InterPro:IPR001487
      label: "Bromodomain"
    - condition_type: INTERPRO
      value: IPR037382
      curie: InterPro:IPR037382
      label: "Remodelling complex subunit Rsc/polybromo"
    - condition_type: TAXON
      value: Fungi
      curie: NCBITaxon:4751
      label: "Fungi"
  - number: 4
    notes: >-
      TFIIF beta / RAP30. Core general transcription factor; GO:0006366 is well supported here.
      Caveat: winged-helix and TFIIF-like dimerisation modules were reused in the Pol I A49/A34.5
      subcomplex, so the TFIIF-beta family signature must stay mandatory.
