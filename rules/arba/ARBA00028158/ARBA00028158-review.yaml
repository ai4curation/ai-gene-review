review_summary: >-
  ARBA00028158 is a mega-rule that OR-s together 55 condition sets to emit a single whole-process
  term, GO:0006366 (transcription by RNA polymerase II). Its interpretable core is sound: condition
  sets 1, 2, 4, 5, 7 and 8 use multi-signature InterPro combinations that identify Spt6, ELL,
  TFIIF-beta/RAP30, TAF4, Elongin A and TAF2 - proteins that act directly in Pol II initiation or
  elongation, and for which the term is well supported by current structural and review literature.
  The problem is everything else. Forty-seven sets are keyed on CATH FunFam identifiers rather than
  named families, and 27 of those fire on a SINGLE FunFam with no corroborating signature; 13 have
  neither a second signature nor a taxon restriction. Because all 55 sets are disjunctive, any one
  over-broad FunFam independently produces the annotation, and the family identity behind a bare
  numeric FunFam cannot be reconstructed from the rule text.
  Where the FunFams ARE named, they expose the failure mode that GO curators reported. Condition set
  33 (two AHR FunFams, restricted to Glires) reaches the aryl hydrocarbon receptor, a
  ligand-activated DNA-binding regulator for which GO:0006357 is the diagnostic term; mouse Ahr
  (P30561) demonstrably carries this rule's GO:0006366 row next to a seven-species GO:0006357 PAINT
  IBA. Condition set 34 reaches INTS11, whose established roles are snRNA 3'-end processing and
  promoter-proximal termination. Condition set 3 reaches a fungal RSC/polybromo remodelling subunit.
  And condition set 14, which is unnamed, is verifiably the route by which S. cerevisiae CHD1
  (P32657) - an ATP-dependent chromatin remodeller - receives the term, duplicating far more
  specific SGD annotations (GO:0006338 IDA, GO:0006357 IDA, GO:0006368 IGI/IPI, GO:0006369 IMP).
  Two corrections to the framing in geneontology/go-annotation#6562 are worth recording. First, the
  reported protein, S. pombe spt16 (O94267), does NOT match any condition set in the current rule
  version: none of its five FunFams (2.30.29.150:FF:000002, 2.30.29.30:FF:000017,
  3.40.350.10:FF:000006, 2.30.29.210:FF:000001, 3.90.230.10:FF:000005) and none of its eleven
  InterPro entries appear anywhere in the rule JSON, so the complained-of annotation is not
  reproducible from the rule as it now stands and appears to be a stale row surviving a rule edit.
  Second, the complaint is best understood as over-breadth rather than a wrong-branch error: the term
  that properly describes Spt16, GO:0140673 (transcription elongation-coupled chromatin remodeling),
  is a DESCENDANT of GO:0006366 via GO:0006368 -> GO:0006354 -> GO:0006366. The ARBA row is
  therefore true-but-uninformative for FACT and CHD1, and genuinely mis-branched only for the
  regulator class exemplified by AHR, whose proper term GO:0006357 sits outside GO:0006366 entirely.
  The general class of complaint is real and reproducible even though the specific instance cited is
  not.
  Status is IN_PROGRESS rather than COMPLETE for two reasons, both tooling limits rather than open
  scientific questions. First, only one deep-research provider could be run: perplexity returned
  HTTP 401 insufficient_quota, cyberian is not a registered provider, and the openai route failed
  with model_not_found for o3-deep-research-2025-06-26, leaving falcon as the sole report against a
  two-provider convention. Second, `just analyze-rule` refuses this rule outright because 55
  condition sets exceed its maximum of 12, so there is no -analysis.yaml, no `entries`, and no
  computed pairwise overlap; the condition_overlap assessment below is structural (shared CATH
  superfamilies across clauses) rather than protein-set-based. The SPLIT recommendation does not
  depend on either gap.
action: SPLIT
action_rationale: >-
  The rule's condition sets do not share a mechanistic basis for the term they emit. Basal
  initiation factors (TFIID subunits, TFIIF-beta), elongation factors (Spt6, ELL, Elongin A),
  ATP-dependent chromatin remodellers (RSC/polybromo, CHD1), a ligand-activated sequence-specific
  transcription factor (AHR) and a termination/RNA-processing endonuclease (INTS11) are collapsed
  onto one whole-process parent. That is what makes the output simultaneously defensible for a
  minority of members and unhelpful or wrong for the rest, and it is not fixable by editing the GO
  term alone - different members need different terms, which requires different rules.
  SPLIT rather than DEPRECATE because the InterPro-based clauses are genuinely good: they use
  family-specific signatures alongside the generic folds, and the literature directly supports the
  term for the proteins they identify. SPLIT rather than MODIFY because the change needed is
  structural, not a parameter adjustment: six or so mechanistically coherent rules, each emitting
  the most specific supported term, would replace one disjunction of 55 clauses. The 27 bare-FunFam
  clauses should be suspended rather than carried into the successor rules until each FunFam's
  family identity, membership and taxonomic range have been documented, because no reviewer can
  assess them from the rule as published.
suggested_modifications:
- >-
  Split into mechanistically coherent family rules: (i) TFIID subunits (CS5, CS6, CS8) emitting
  Pol II preinitiation-complex assembly / core-promoter recognition; (ii) TFIIF-beta (CS4) emitting
  initiation and promoter escape; (iii) elongation factors Spt6, ELL, Elongin A (CS1, CS2, CS7)
  emitting GO:0006368 transcription elongation by RNA polymerase II or its positive regulation;
  (iv) chromatin remodellers (CS3, CS14 and the SNF2-family FunFam clauses) emitting GO:0006338
  chromatin remodeling plus GO:0006357; (v) AHR (CS33) emitting GO:0006357; (vi) INTS11 (CS34)
  emitting GO:0006369 termination of RNA polymerase II transcription and snRNA 3'-end processing.
- >-
  Replace GO:0006366 with the most specific supported child in each successor rule, and let
  GO:0006366 propagate as an inferred ancestor rather than being asserted directly. For the
  remodeller rule the correct leaf for FACT-like and CHD-like members is GO:0140673 transcription
  elongation-coupled chromatin remodeling, which already sits under GO:0006366.
- >-
  Do not emit GO:0006366 for AHR (CS33). A ligand-activated DNA-binding transcription factor
  modulates the rate and extent of Pol II transcription; GO:0006357 regulation of transcription by
  RNA polymerase II is the diagnostic term and is NOT a descendant of GO:0006366, so this is the
  one clause where the current output is wrong-branch rather than merely broad.
- >-
  Suspend the 13 condition sets that fire on a single bare CATH FunFam with no second signature and
  no taxon restriction (CS21, CS22, CS23, CS46, CS47, CS48, CS49, CS50, CS51, CS52, CS53, CS54,
  CS55), and the 14 that are a single FunFam plus a taxon, until each FunFam is documented with its
  current name, representative experimentally characterised members, domain coverage, CATH release
  and taxonomic range. Under OR semantics a single over-broad clause is sufficient to produce the
  annotation.
- >-
  Consolidate the clauses that appear to be different structural fragments of the same families:
  CATH 1.10.20.10 is used across six separate condition sets (CS12, CS21, CS26, CS37, CS46, CS47),
  1.10.10.10 across four (CS9, CS17, CS24, CS25), 1.10.10.60 across four (CS14, CS24, CS35, CS36),
  3.40.50.10810 across three (CS11, CS14, CS44), 3.40.50.300 across three (CS11, CS44, CS45),
  3.30.40.10 across three (CS26, CS31, CS41), and 3.40.50.10890 across two (CS34, CS55).
- >-
  Drop the genus- and narrow-clade-level taxon restrictions (Rattus in CS19, Mus in CS36, Homo in
  CS42, Myomorpha in CS39, Catarrhini in CS29, Haplorrhini in CS28, Hominidae in CS37, Glires in
  CS33, Mammalia in CS34) in favour of restrictions that match the actual conservation of the
  family. Twenty-one of the rule's 25 distinct taxon constraints are used exactly once, which is
  the signature of classifier boundaries rather than of lineage-specific innovation.
- >-
  Add negative conditions to the successor rules where a shared fold creates a specific known
  hazard: exclude occludin-like tight-junction proteins from the ELL rule, non-TAF aminopeptidases
  from the TAF2 rule, Pol I A49/A34.5 and Pol III TFIIF-like subunits from the TFIIF-beta rule, and
  unrelated metallo-beta-lactamase nucleases from the INTS11 rule.
- >-
  Reconcile the rule against the annotations already in the wild. S. pombe spt16 (O94267) carries a
  GO:0006366 row attributed to this rule but matches none of its current condition sets; such rows
  should be retracted when a rule edit removes the clause that produced them.
parsimony:
  assessment: OVERLY_COMPLEX
  notes: >-
    Fifty-five disjunctive condition sets for one whole-process GO term, spanning at least six
    mechanistically distinct classes of protein. Forty-seven sets are keyed on CATH FunFam
    identifiers rather than named families; 27 of those fire on a single FunFam, and 13 carry
    neither a second signature nor a taxon restriction. Only 8 sets use interpretable InterPro
    combinations. Twenty-five distinct taxon constraints appear, 21 of them exactly once, including
    single-genus restrictions to Rattus, Mus and Homo. The rule also exceeds this repository's own
    analysis threshold - `just analyze-rule` refuses it outright - so no pairwise overlap statistics
    can be computed and the rule is literally not auditable by the standard tooling.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028158/ARBA00028158-deep-research-falcon.md
    supporting_text: >-
      The largest unresolved concern is rule architecture. Forty-seven condition sets rely wholly or
      partly on numeric CATH FunFam identifiers that cannot be biologically interpreted from the
      rule text. Because all 55 sets are connected by **OR**, one broad, obsolete, or functionally
      heterogeneous FunFam can independently trigger the annotation.
  - reference_id: file:rules/arba/ARBA00028158/ARBA00028158-deep-research-falcon.md
    supporting_text: >-
      A single OR-rule currently conflates basal initiation factors, elongation factors, chromatin
      remodelers, sequence-specific transcription factors, and a termination/RNA-processing
      nuclease.
literature_support:
  assessment: MODERATE
  notes: >-
    Sharply bimodal. For the proteins identified by the eight InterPro clauses the literature is
    strong and recent: TFIID is the basal factor that nucleates the Pol II preinitiation complex,
    TFIIF-beta is a core GTF, and Spt6, ELL and Elongin A are established elongation factors, with
    2023 cryo-EM work resolving the ELOA-Pol II interface and showing causally that the ELOA latch
    is required for elongation stimulation. For the 47 FunFam clauses there is no literature support
    of any kind available to a reviewer, because the clauses do not say which families they denote.
    The overall assessment is therefore MODERATE rather than STRONG: the rule's evidence base covers
    a minority of its clauses, and the majority is not merely under-supported but unassessable.
  supported_by:
  - reference_id: PMID:38397413
    supporting_text: >-
      The Pol II core enzyme can itself synthesize RNA using a template DNA, but promoter-specific
      transcription initiation requires the canonical general transcription factors (GTFs): TFIIA,
      TFIIB, TFIID, TFIIE, TFIIF, and TFIIH
  - reference_id: PMID:38397413
    supporting_text: >-
      Elongation factors include Poly (ADP-ribose) Polymerases (PARPs), elongation factor for RNA
      Pol II (ELL), TFIIS, elongin A, DSIF, and Spt6, among others
  - reference_id: PMID:37932450
    supporting_text: >-
      The latch is required for the elongation-stimulatory activity of Elongin, but not for Pol II
      binding, indicating that Elongin functions by allosterically regulating the conformational
      mobility of the polymerase active center.
  - reference_id: PMID:36180603
    supporting_text: U snRNA processing is dependent on the catalytic site of INTS11
  - reference_id: file:rules/arba/ARBA00028158/ARBA00028158-deep-research-falcon.md
    supporting_text: >-
      These 47 sets cannot be responsibly evaluated family by family from numeric identifiers
      alone.
condition_overlap:
  assessment: SIGNIFICANT
  notes: >-
    Quantitative pairwise overlap could not be computed because `just analyze-rule` refuses rules
    with more than 12 condition sets, so the figures below are structural rather than
    protein-set-based. Nine CATH superfamilies are reused across multiple condition sets, strongly
    suggesting that separate clauses are matching different structural fragments of the same protein
    families: 1.10.20.10 appears in six sets (CS12, CS21, CS26, CS37, CS46, CS47), 1.10.10.10 in
    four (CS9, CS17, CS24, CS25), 1.10.10.60 in four (CS14, CS24, CS35, CS36), 3.40.50.10810 in
    three (CS11, CS14, CS44), 3.40.50.300 in three (CS11, CS44, CS45), 3.30.40.10 in three (CS26,
    CS31, CS41), and 1.10.10.2740, 1.20.5.170 and 3.40.50.10890 in two each. The overlap matters
    more than usual here: because the sets are OR-ed, a redundant fragment clause is not harmless
    padding but an independent trigger, and CS46/CS47 in particular are bare 1.10.20.10 FunFams with
    no second signature at all.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028158/ARBA00028158-deep-research-falcon.md
    supporting_text: >-
      Several FunFam conjunctions may be different structural fragments of the same protein family.
      If one specific whole-family model provides equal or better discrimination, redundant fragment
      clauses can be consolidated.
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    GO:0006366 spans the entire Pol II transcription cycle, so it is technically true for most
    proteins this rule reaches while being the most specific term for almost none of them. The cost
    is visible in the annotations it produces. S. cerevisiae CHD1 (P32657) receives GO:0006366 from
    condition set 14 while SGD already records GO:0006338 (IDA), GO:0006357 (IDA), GO:0006368
    (IGI/IPI) and GO:0006369 (IMP) - the ARBA row is a strictly less informative ancestor of terms
    the gene already has. S. pombe spt16 (O94267) likewise already carries GO:0140673 transcription
    elongation-coupled chromatin remodeling, which is a descendant of GO:0006366 via GO:0006368 and
    GO:0006354; the objection in go-annotation#6562 is therefore over-breadth, not a wrong-branch
    assignment. The one clause where the term is genuinely mis-branched is CS33: for the aryl
    hydrocarbon receptor the correct term is GO:0006357 regulation of transcription by RNA
    polymerase II, which is NOT under GO:0006366, and mouse Ahr (P30561) carries both the ARBA
    GO:0006366 row and a seven-species GO:0006357 PAINT IBA. The rule should emit stage-specific
    children per family and let GO:0006366 be inferred.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028158/ARBA00028158-deep-research-falcon.md
    supporting_text: >-
      GO:0006366 is defensible as an ancestor process, but **regulation of transcription by RNA
      polymerase II**, sequence-specific transcription-factor activity, and xenobiotic-response
      signaling are more diagnostic.
  - reference_id: file:rules/arba/ARBA00028158/ARBA00028158-deep-research-falcon.md
    supporting_text: >-
      **Overbroad as a sole annotation** for INTS11, whose most direct roles are nascent-RNA
      cleavage, snRNA processing, transcription attenuation, and termination.
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    The dominant defect is over-restriction, not over-reach. Pol II transcription is pan-eukaryotic,
    yet the rule carries 25 distinct taxon constraints of which 21 are used exactly once, including
    single-genus restrictions to Rattus (CS19), Mus (CS36) and Homo (CS42) and narrow primate clades
    Catarrhini (CS29), Haplorrhini (CS28) and Hominidae (CS37). These read as boundaries of the
    sequence sets the FunFams were built from rather than as origins of function. Two named cases
    make the point concretely: AHR is restricted to Glires (CS33) although it is broadly vertebrate,
    and INTS11 to Mammalia (CS34) although Integrator extends well beyond mammals. The
    consequence is systematic false negatives - the same protein escapes the rule in one species and
    is caught in another - which is also why the rule's own reviewed-protein count is uninformative.
    A handful of restrictions are defensible (Fungi for the RSC/polybromo clause, Eukaryota for
    TAF4, Metazoa for Elongin A).
  supported_by:
  - reference_id: file:rules/arba/ARBA00028158/ARBA00028158-deep-research-falcon.md
    supporting_text: >-
      Very narrow restrictions in the numeric FunFam block—Rattus, Mus, Homo, primates, Haplorrhini,
      Catarrhini, and several fungal subclades—may reflect classifier boundaries rather than genuine
      origins of Pol II function.
  - reference_id: file:rules/arba/ARBA00028158/ARBA00028158-deep-research-falcon.md
    supporting_text: >-
      **Glires for AHR:** probably too narrow biologically; AHR is broadly vertebrate.
confidence: 0.3
references:
- id: file:rules/arba/ARBA00028158/ARBA00028158-deep-research-falcon.md
  title: 'Deep research analysis via Falcon (Edison Scientific Literature): evaluation of ARBA00028158'
  findings:
  - statement: >-
      The eight interpretable InterPro condition sets identify genuine Pol II machinery components
      (Spt6, ELL, TFIIF-beta/RAP30, TAF4, Elongin A, TAF2) for which GO:0006366 is well supported,
      but 47 of the 55 sets are keyed on CATH FunFam identifiers whose family identity cannot be
      reconstructed, and under OR semantics any one of them independently triggers the annotation.
  - statement: >-
      The rule conflates basal initiation factors, elongation factors, chromatin remodellers, a
      sequence-specific transcription factor and a termination/RNA-processing nuclease, and should
      be split by mechanistic family with each successor emitting the most specific supported term.
  - statement: >-
      Narrow taxon restrictions in the FunFam block (Rattus, Mus, Homo, primate clades, fungal
      subclades) and the Glires restriction on AHR reflect classifier boundaries rather than the
      conservation of Pol II transcription.
- id: PMID:38397413
  title: Mechanisms and Functions of the RNA Polymerase II General Transcription Machinery during the Transcription Cycle.
  findings:
  - statement: >-
      TFIID, TFIIF and the other canonical general transcription factors are required for
      promoter-specific Pol II initiation, and Spt6, ELL and elongin A are established Pol II
      elongation factors - supporting GO:0006366 for the families identified by condition sets 1, 2,
      4, 5, 6, 7 and 8.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID verified by DOI lookup (10.3390/biom14020176); full text cached from PMC10886972.
      2024 review; quotes taken verbatim from the cached text.
- id: PMID:37932450
  title: Structure of the transcribing RNA polymerase II-Elongin complex.
  findings:
  - statement: >-
      Cryo-EM structures show ELOA binds the RPB2 side of Pol II and that its latch is required for
      Elongin's elongation-stimulatory activity, giving condition set 7 direct mechanistic support.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID verified by DOI lookup (10.1038/s41594-023-01138-w); full text cached from PMC.
- id: PMID:36180603
  title: Genomic regulation of transcription and RNA processing by the multitasking Integrator complex.
  findings:
  - statement: >-
      INTS11 is the catalytic endonuclease of Integrator and U snRNA 3'-end processing depends on
      its catalytic site, so for condition set 34 the diagnostic terms are termination of Pol II
      transcription and snRNA processing rather than the whole-process parent GO:0006366.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID verified by DOI lookup (10.1038/s41580-022-00534-2); full text cached from PMC.
- id: PMID:20797630
  title: RNA polymerase I contains a TFIIF-related DNA-binding subcomplex.
  findings:
  - statement: >-
      TFIIF-related winged-helix modules were reused in the Pol I A49/A34.5 subcomplex, which is why
      condition set 4 must keep the TFIIF-beta family signature mandatory rather than relying on the
      generic winged-helix and dimerisation folds.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID verified by DOI lookup (10.1016/j.molcel.2010.07.028). Cited for the false-positive
      hazard of generic TFIIF-like folds, not for a Pol II function claim. Cached entry is
      abstract-only (full_text_available: false), so no verbatim full-text quote is asserted from
      it; the claim it supports is drawn from the falcon report's reading of this paper.
- id: PMID:39541575
  title: The role of the polybromo-associated BAF complex in development.
  findings:
  - statement: >-
      Polybromo/BAF bromodomain proteins are multifunctional chromatin regulators that also act in
      DNA damage response and chromosome maintenance, so a bromodomain is not diagnostic for Pol II
      transcription and condition set 3 should emit chromatin-remodelling and regulatory terms.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PMID verified by DOI lookup (10.1139/bcb-2024-0224); full text cached from PMC.
- id: PMID:38570683
  title: Structural basis of Integrator-dependent RNA polymerase II termination.
  findings:
  - statement: >-
      Structural work on the Integrator-PP2A complex terminating paused Pol II supports termination
      and attenuation terms for INTS11 (condition set 34) rather than the whole-process parent.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID verified by DOI lookup (10.1038/s41586-024-07269-4); already cached, but the cached entry
      is abstract-only (full_text_available: false), so no verbatim full-text quote is asserted from
      it. The termination claim it supports is independently carried by PMID:36180603.
- id: https://github.com/geneontology/go-annotation/issues/6562
  title: 'ARBA2GO issue: ARBA00028158'
  findings:
  - statement: >-
      GO curators reported that ARBA00028158 assigns GO:0006366 to a chromatin remodeller,
      UniProtKB:O94267 (S. pombe spt16). The class of complaint is reproducible - condition set 14
      demonstrably produces the same outcome for S. cerevisiae CHD1 (P32657) - but the specific
      protein cited matches none of the rule's current 55 condition sets, so that row appears to be
      stale relative to the 2026-05-04 rule version.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Issue body read directly from the GitHub API on 2026-09-26; open, labelled ARBA, filed
      2026-09-23. Treated as an untrusted external report and independently verified against
      QuickGO and the rule JSON.
