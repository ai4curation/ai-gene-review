corrections:
- date: '2026-11-10'
  withdrawn_claim: The rule is fundamentally flawed and should be deprecated (confidence 0.95).
  correction: No condition set and no annotated protein was examined, so the verdict had no evidence about
    the rule's content.
  error_type: UNEXAMINED_RULE
  evidence:
  - 'Old review: rule.condition_sets empty, protein counts 0, dates "unknown"'
- date: '2026-11-10'
  withdrawn_claim: 930 condition sets with 267 InterPro domains is unmaintainable complexity; rules should
    have fewer than 12 sets.
  correction: The number of alternative sets is not evidence that any of them is wrong.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'src/ai_gene_review/etl/rule_analysis.py: max_condition_sets: int = 12 (default of the overlap-analysis
    tool)'
- date: '2026-11-10'
  withdrawn_claim: GO:0010468 is too broad to be useful, so the rule should be deprecated.
  correction: A true general term is not grounds for removal.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - 'QuickGO: GO:0010468 regulation of gene expression is a current, non-obsolete term'
- date: '2026-11-10'
  withdrawn_claim: Spanning 134 taxonomic groups shows indiscriminate application across all life.
  correction: Taxon conditions restrict where each set fires; many different taxa means many restricted
    sets.
  error_type: TAXON_MISREAD
  evidence:
  - 'Live rule: 929 sets, each a conjunction (rest.uniprot.org/arba/ARBA00028334, 2026-11-09)'
- date: '2026-11-10'
  withdrawn_claim: Literature support is NONE, supported by references "analysis:complexity", "analysis:domain_diversity",
    "analysis:taxonomic_distribution" and "analysis:rule_structure".
  correction: These are not sources. No literature search was made, which is not the same as finding no
    support.
  error_type: UNSUPPORTED_SOURCE
  evidence:
  - 'Old review literature_support notes: "No comprehensive literature search is possible"'
