taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    747 of 929 sets have no taxon. Among the 40 sampled, five carry one, and they match lineage-specific
    regulators (LexA in Gammaproteobacteria, CodY in Bacillati, AP2 factors in Liliopsida, Staufen and
    Loquacious in Drosophilidae) except set 41, which restricts the KMT2 methyltransferases to Myomorpha
    although they are conserved across animals; that is narrow coverage. Taxon scope is not the rule's
    problem.
