review_summary: >-
  Accuracy: 40 of the 929 live condition sets were examined in this pass; the first pass had examined
  none. In all 40 the Swiss-Prot matches carry a manual annotation to a descendant of GO:0010468 (regulation
  of gene expression), from an experiment in every sampled set, and no wrongly annotated protein was found.
  The other 889 sets remain unexamined, so nothing is claimed about them. Meaning and parsimony: the consequent
  has 874 descendants. Thirty of the 40 sampled sets select transcription factors, cofactors or sigma
  factors, whose curated term is GO:0006355 (regulation of DNA-templated transcription) or something below
  it; seven select translational and mRNA-stability regulators; two select cytokine-production regulators.
  Rules for those terms exist, and 27 of the 40 sampled sets are matched exactly by one of them (rule_redundancy.tsv:
  648 of 932 sets). The rule nevertheless still emits 185,510 annotations in QuickGO, so it is not dead
  weight: it is the uncovered third that is doing the annotating, with a term that names no mechanism.
action: SPLIT
action_rationale: >-
  A sample cannot support accepting or rejecting 929 sets one by one, but it does settle the question
  of level: every sampled family has a more specific curated term, three quarters of them the transcription
  term, and the specific rules already exist. The remedy is to move each set to the rule for its own term
  and drop the sets those rules already contain. Confidence reflects that the judgement rests on 40 sets
  and the redundancy table.
confidence: 0.75
suggested_modifications:
- >-
  Delete the sets already matched exactly by a rule for a descendant term (in the sample: 34, 75, 153,
  174, 193, 203, 239, 303, 321, 398, 405, 424, 436, 441, 446, 450, 454, 495, 510, 647, 726, 743, 776,
  859, 862, 870, 890; rule_redundancy.tsv counts 648 such sets in all).
- >-
  Move the remaining transcription-regulator sets (in the sample: 41, 107, 293, 361, 854, 894) to GO:0006355
  (regulation of DNA-templated transcription) (ARBA00028138) or, where the members carry it, a positive
  or negative regulation descendant.
- >-
  Move translational and mRNA-stability regulator sets (in the sample: 61, 288, 410, 726, 809, 875, 890)
  to GO:0010608 (post-transcriptional regulation of gene expression) (ARBA00026479) or a descendant such
  as GO:0006417 (regulation of translation).
- >-
  Move cytokine-production sets (in the sample: 495, 770) to GO:0001817 (regulation of cytokine production)
  and give set 676 the term its members carry.
- >-
  Classify the 889 unsampled sets the same way: by the most specific term curated on the Swiss-Prot matches
  of each set.
