review_summary: >-
  Accuracy: all 90 live condition sets were checked against Swiss-Prot on 2026-11-09. Every set has reviewed
  matches (2 to 507 per set) and every reviewed match inspected carries the keyword Aminopeptidase (KW-0031);
  for set 1 the first 500 of 507 were inspected. TrEMBL matches were counted but not inspected. Meaning
  and parsimony: the keyword names an enzyme class, and the sets select the peptidase families that make
  it up: M17 leucyl aminopeptidases, M24 methionine and Xaa-Pro aminopeptidases, the M1 family, M18 aspartyl
  aminopeptidases, S9B dipeptidyl peptidases, tripeptidyl peptidase II, proline iminopeptidases and a
  tail of smaller families such as the actin maturation protease and NAALADL1. Unlike an umbrella GO term,
  the keyword is the level at which the class is defined, so many families under one label is what the
  rule is for. The rule is redundant in places: 34 of 90 sets have reviewed matches wholly contained in
  those of one other set, measured on reviewed entries only.
action: ACCEPT
action_rationale: >-
  The keyword is correct for every reviewed match of every set and the sets select what the label names,
  family by family. Overlap between InterPro, PANTHER and FunFam sets for the same family is tolerable
  and was measured only on reviewed entries, so it is not a reason to change the rule.
