  withdrawn_claim: The rule has a high false positive risk and a high likelihood of annotating 
    non-aminopeptidases.
  correction: No false positive was shown, and the condition sets had not been read (the earlier 
    file listed none). Checked set by set, every reviewed match carries the keyword.
  error_type: UNEXAMINED_RULE
  evidence:
  - 90 live condition sets queried against Swiss-Prot on 2026-11-09; 0 reviewed matches without 
    KW-0031
- date: '2026-11-10'
  withdrawn_claim: 86 condition sets are too many, and combining mechanistically distinct peptidase 
    families is a design flaw that requires the rule to be decomposed.
  correction: The keyword Aminopeptidase applies to any aminopeptidase whatever its catalytic 
    mechanism, so covering several families is what the annotation requires. Set count is not 
    evidence of error.
  error_type: SIZE_AS_EVIDENCE
  evidence:
