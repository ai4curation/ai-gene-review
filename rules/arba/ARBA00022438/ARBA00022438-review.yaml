parsimony:
  assessment: ACCEPTABLE
  notes: >-
    90 sets, 1508 distinct reviewed matches, 3361 summed over sets (UniProtKB, 2026-11-12). For 34 sets
    the reviewed matches are a subset of those of one other set, and 49 sets have no reviewed match that
    another set lacks. This was measured on reviewed entries only; a set that looks redundant there may
    still reach unreviewed entries its neighbours miss, so no set is named for removal. No set matches
    zero reviewed entries.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    38 of 90 sets carry a taxon condition, each with a signature that is broader than the aminopeptidases
    outside that taxon (for example IPR001131, Peptidase M24B, X-Pro dipeptidase/aminopeptidase P, in
    Eurotiomycetes). Within every set all reviewed matches carry the keyword. Some restrictions are narrow
    (Glires, Primates, Muroidea) and follow where the annotated members are; that limits coverage only.
