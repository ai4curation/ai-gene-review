review_summary: >-
  Accuracy: all 12 live condition sets were examined by retrieving the Swiss-Prot entries that match the
  whole conjunction and looking up their curated annotations. Every set has at least one Swiss-Prot match
  with an experimental annotation to GO:0007031 (peroxisome organization) or an is_a/part_of descendant.
  The dynamin, VPS1 and FIS1 sets match proteins that also act in mitochondrial fission; their peroxisome
  annotations are experimental. Set 8 rests on one genetic-interaction paper, and sets 7 and 12 have no
  taxon condition; set 7 also matches Toxoplasma gondii DrpA (S8EYU3), which has no curated annotation
  to the term. Meaning and parsimony: the sets do not select one thing. They resolve into the matrix protein
  import machinery (PEX5, PEX7, PEX14/PEX33, PEX12), the fission machinery (PEX11, FIS1, the dynamin-related
  GTPases, VPS1), an inheritance pair (KIN4, FRK1) and the PEX28-PEX32 family. Curated annotation gives
  the first three groups more specific terms under the consequent: GO:0016558 (protein import into peroxisome
  matrix), GO:0016559 (peroxisome fission) and GO:0045033 (peroxisome inheritance). Only the PEX28-PEX32
  set has nothing better than the consequent. Rules for the import and fission terms already cover part
  of this rule (rule_redundancy.tsv counts 5 of 12 sets; the rule set downloaded on 2026-11-12 gives sets
  2, 5 and 10 for import and 3, 9 and 12 for fission), and those sets emit nothing here. The rule is true
  but says less than its own evidence supports.
action: SPLIT
action_rationale: >-
  Peroxisome organization is an umbrella over three processes that the matched families carry out separately,
  and curators annotate them separately. Each remaining set should assert the term of its unit, which
  is what the covered sets already do through other rules. After the split one set (PEX28-PEX32) stays
  under GO:0007031. The first pass's accuracy caveats (set 8 on one paper; sets 7 and 12 without a taxon)
  are unchanged.
suggested_modifications:
- >-
  Sets 1 and 6 (PEX12): assert GO:0016558 (protein import into peroxisome matrix), as ARBA00034601 already
  does for sets 2, 5 and 10 (PEX14/PEX33, PEX7, PEX5), which then need no entry in this rule.
- >-
  Sets 7 and 11 (dynamin-related protein 3A FunFam; VPS1): assert GO:0016559 (peroxisome fission), as
  ARBA00027945 already does for sets 3, 9 and 12 (PEX11, FIS1, Dynamin-1-like), which then need no entry
  in this rule.
- 'Set 8 (KIN4, FRK1 in Fungi): assert GO:0045033 (peroxisome inheritance).'
- >-
  Set 4 (PEX28-PEX32, IPR010482 in Saccharomycetes): keep GO:0007031 (peroxisome organization).
