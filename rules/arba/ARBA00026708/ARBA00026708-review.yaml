  notes: >-
    Four units. Import machinery, fission machinery and the inheritance kinases each carry a curated descendant
    of the consequent; only PEX28-PEX32 is annotated at the level of the consequent itself. The fission
    unit is shared with mitochondria (DNM1, DNM1L, FIS1), which is biology, not a rule error. The consequent
    has 15 descendants, so it is not a very general term, but 11 of 12 sets have a better one. Figures
    updated from rule_redundancy.tsv as rebuilt on 2026-11-12 from the rules UniProt serves now, which has 12 sets: covered sets 5 in the earlier table, 6 now. Where the prose of this review quotes the earlier
    figure, this one replaces it.
