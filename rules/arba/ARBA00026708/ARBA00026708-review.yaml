review_summary: >-
  All 12 live condition sets were examined by retrieving the Swiss-Prot entries that match the whole conjunction
  and looking up their curated annotations. Every set has at least one Swiss-Prot match with an experimental
  annotation to GO:0007031 or an is_a/part_of descendant (protein import into peroxisome matrix and its
  steps, peroxisome fission, peroxisome inheritance). The dynamin, VPS1 and FIS1 sets match proteins that
  also act in mitochondrial fission; their peroxisome annotations are experimental. Set 8 matches S. cerevisiae
  KIN4 and FRK1, annotated to peroxisome inheritance by IGI from one paper. Sets 7 and 12 have no taxon
  condition; set 7 also matches Toxoplasma gondii DrpA (S8EYU3), which has no curated annotation to the
  term. The check uses Swiss-Prot, the source ARBA rules are mined from, and does not measure precision
  on unreviewed entries.
action: ACCEPT
action_rationale: >-
  Each condition set identifies a characterised peroxisome biogenesis, fission or inheritance factor,
  and each has reviewed members with experimental support for the term or a descendant. Confidence is
  reduced by set 8, which rests on one genetic-interaction paper, and by the two dynamin sets without
  a taxon condition.
