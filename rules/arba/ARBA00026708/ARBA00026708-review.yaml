    Condition sets overlap significantly and the taxonomic scope is too broad, risking annotation of organisms
    without peroxisomes.
  correction: >-
    Neither was measured: the overlap was stated without any count and no organism lacking peroxisomes
    was shown to be annotated. Both blocks were removed.
  error_type: UNEXAMINED_RULE
  evidence:
  - >-
    Previous condition_overlap note began "Without quantitative analysis"; all previous entries had protein_count
    0
- date: '2026-11-12'
  withdrawn_claim: >-
    ACCEPT, because each condition set has reviewed members with experimental support for the term or
    a descendant.
  correction: >-
    Support by a descendant is the point: 11 of 12 sets select units whose curated term is a more specific
    descendant (import into the matrix, fission, inheritance), and rules for two of those terms already
    cover five or six of the sets. The rule is an umbrella and the verdict is SPLIT.
  error_type: MEANING_NOT_JUDGED
  evidence:
  - >-
    projects/ARBA_REVIEW/rule_redundancy.tsv: ARBA00026708 go_descendants 15, condition_sets 12, covered_sets
    5, covered_by_terms GO:0016559|GO:0016558
  - UniProtKB:P35056 PEX5 GO:0016558 IDA PMID:15283676 (UniProt)
  - UniProtKB:Q9STY0 PEX11B GO:0016559 IDA PMID:20826455 (UniProt)
  - UniProtKB:Q01919 KIN4 GO:0045033 IGI PMID:37509134 (SGD)
parsimony:
  assessment: REDUNDANT
  notes: >-
    rule_redundancy.tsv: go_descendants 15, condition_sets 12, covered_sets 5, covered_by_terms GO:0016559
    and GO:0016558. Recomputed on the ARBA rule set downloaded 2026-11-12 with the same structural test:
    sets 2, 5 and 10 are covered by ARBA00034601 (GO:0016558) and sets 3, 9 and 12 by ARBA00027945 (GO:0016559),
    six sets in all; these emit nothing from this rule. Sets 1 and 6 both select PEX12 and share Swiss-Prot
    matches (O00623, O88177, Q19189, Q8VC48). QuickGO returns 4,537 annotations with withFrom ARBA:ARBA00026708
    (2026-11-12), from the uncovered sets. rules/arba/_interpro2go.txt maps four InterPro entries to GO:0007031:
    IPR006966 (Peroxin-3), IPR015342 (Peroxisomal ATPase PEX1, N-terminal C-lobe), IPR025654 (Peroxisome
    biogenesis factor 2/10) and IPR037485 (Peroxisome biogenesis protein 22), none of which this rule
    uses, so InterPro2GO does not replace it.
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    GO:0016558 (protein import into peroxisome matrix), GO:0016559 (peroxisome fission) and GO:0045033
    (peroxisome inheritance) are is_a/part_of descendants of GO:0007031 in QuickGO and are the terms curated
    by experiment on the members of 11 of the 12 sets.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    Most restrictions follow the unit: Pezizomycotina for PEX14/PEX33, Viridiplantae for the plant PEX11
    family, Saccharomycetes for PEX28-PEX32, Streptophyta for plant FIS1, Fungi for KIN4. Sets 7 and 12
    (dynamin-related FunFams) have no taxon condition; the first pass noted that set 7 reaches Toxoplasma
    gondii DrpA (S8EYU3), which has no curated peroxisome annotation. Set 10 (PEX5, Saccharomycotina)
    is narrower than the family, which is lost coverage only.
