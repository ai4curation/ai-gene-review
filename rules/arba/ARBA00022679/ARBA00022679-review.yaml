- date: '2026-11-10'
  withdrawn_claim: >-
    Applying one keyword to 14 million proteins through thousands of condition sets is over-annotation,
    and the rule should be removed.
  correction: Neither the number of proteins nor the number of sets is evidence about correctness.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - >-
    Live rule: 4,603 condition sets; in the 461 sets screened, all 21,413 set-level Swiss-Prot matches
    carry KW-0808 (UniProtKB, 2026-11-10)
- date: '2026-11-10'
  withdrawn_claim: >-
    The Transferase keyword is meaningless and conflates kinases, methyltransferases and other classes.
  correction: >-
    It is a class label that is true of all of them; UniProt maps it to a GO molecular function term.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - >-
    UniProt KW-0808 definition: Enzyme that transfers a chemical group, e.g. a methyl group or a glycosyl
    group from one compound (donor) to another compound (acceptor).
  - 'UniProt keyword KW-0808 geneOntologies: GO:0016740 transferase activity'
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule covers phosphatases and histone deacetylases and likely creates more false positives than
    true annotations.
  correction: >-
    No condition set matching a phosphatase or deacetylase was identified and no false positive was shown.
  error_type: UNEXAMINED_RULE
  evidence:
