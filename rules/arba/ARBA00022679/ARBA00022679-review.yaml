parsimony:
  assessment: REDUNDANT
  notes: >-
    Structural test on the 4,603 sets downloaded 2026-11-12 (a set is covered when another rule has a
    set whose signatures are a subset, with no negative condition and no or the same taxon): 2,661 sets
    are covered by a rule for a descendant keyword of KW-0808: Kinase 1,196, Serine/threonine-protein
    kinase 556, Methyltransferase 453, Glycosyltransferase 387, Nucleotidyltransferase 305, Acyltransferase
    268, Tyrosine-protein kinase 69, Aminotransferase 67, DNA-directed DNA polymerase 49, RNA-directed
    RNA polymerase 18, RNA-directed DNA polymerase 10, Prenyltransferase 7 (a set can be covered by more
    than one). Keywords from different rules stack: an unreviewed kinase such as A0A1B0GXE3 carries Transferase
    from ARBA00022679, Kinase from ARBA00022777 and Serine/threonine-protein kinase from ARBA00022527.
    No set is subsumed by another set of the same rule. 3,342 sets are a single signature and 385 have
    a taxon condition. keyword_redundancy.tsv: 2,661 of 4,603 condition sets are also matched by a rule
    for a descendant keyword (Kinase 1,196, Serine/threonine-protein kinase 556, Methyltransferase 453,
    Glycosyltransferase 387 and others; a set can be covered by more than one). Keywords from different
    rules stack on a protein, so these sets still emit this keyword; they are redundant only if the parent
    keyword could be derived from the child, which is not established.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    385 of 4,603 sets have a taxon condition; transferases occur in all domains of life and in viruses,
    so a mostly unrestricted rule fits the class. The one recorded taxon condition, Riboviria on the polymerase
    superfamily (set 21), keeps a broad superfamily signature to RNA viruses. Taxon conditions were not
    reviewed beyond the recorded sets.
