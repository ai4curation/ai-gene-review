review_summary: >-
  Accuracy: all 100 served condition sets were turned into UniProtKB queries. In every set, every reviewed
  match carries the keyword Tyrosine-protein kinase; no reviewed match lacks it. Swiss-Prot gives the
  keyword to metazoan receptor and cytoplasmic tyrosine kinases, to bacterial BY-kinases and to dual-specificity
  kinases, and the rule follows that usage. Meaning and parsimony: the sets select one enzyme class, protein
  kinases that phosphorylate tyrosine, family by family, and the keyword is the label of that class; it
  has no narrower keyword beneath it. Each signature is used in one set and 95 of the 100 sets annotate
  proteins that no other set reaches.
action: ACCEPT
action_rationale: >-
  The rule is accurate for every set against Swiss-Prot, coherent as a statement about one enzyme class,
  and close to minimal. Unreviewed matches were counted, not inspected, which is why confidence is not
  higher.
