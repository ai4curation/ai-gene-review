parsimony:
  assessment: ACCEPTABLE
  notes: >-
    Each signature is used in exactly one set and no set is contained in another by its conditions. Every
    set matches reviewed entries. By matched proteins (UniProtKB 2026_04, each set against the union of
    the others, leaving the six PANTHER-subfamily sets out of the union), five sets add nothing: 10 (5427
    entries), 56 (1300), 75 (23), 93 (399) and 96 (142); the other 89 queryable sets add proteins. There
    is no single InterPro entry for the class that would replace the construction: the protein kinase
    domain entries also cover serine/threonine kinases.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    81 sets are unrestricted and 19 carry a taxon condition. The restrictions separate lineages in which
    a FunFam means a tyrosine kinase from those in which it does not (Bacteria and Actinomycetota for
    the BY-kinase FunFams, Viridiplantae and Embryophyta for plant dual-specificity kinases), which follows
    the biology; the mammal-level ones (Primates, Glires, Rodentia, Eutheria) follow the reviewed proteins
    and give narrow coverage, not wrong annotation.
