review_summary: >-
  The live rule has 100 condition sets; UniProt reports 177,623 unreviewed proteins. Five sets were
  examined. The bacterial and plant sets (sets 37, 86, 92, 95) match Swiss-Prot proteins that carry
  the Tyrosine-protein kinase keyword by curation. Swiss-Prot also gives this keyword to dual-specificity
  kinases such as MAP2K1 (Q02750). No false positive has been identified. 95 sets were not examined,
  so no verdict is given.
action: UNDECIDED
action_rationale: >-
  Five of 100 condition sets were examined; the four checked against Swiss-Prot agree with curated
  keyword use. The rest of the rule was not examined.
suggested_modifications:
- >-
  Check the remaining condition sets against Swiss-Prot use of KW-0829 before recommending any change.
