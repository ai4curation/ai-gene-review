review_summary: 'All four live condition sets were examined. The Swiss-Prot matches of every set carry
  a descendant of GO:0030167 with experimental evidence: beta-galactosidase GLB1 (keratan sulfate proteoglycan
  catabolic process, IMP), alpha-L-iduronidase (dermatan sulfate and heparan sulfate proteoglycan catabolic
  process, IDA and IMP), mouse HEXA and HEXB (dermatan sulfate proteoglycan catabolic process, IGI) and
  N-acetylglucosamine-6-sulfatase (heparan sulfate proteoglycan catabolic process, IDA and IMP). Beta-galactosidase
  and beta-hexosaminidase also degrade gangliosides; that is a further function, not a reason to withhold
  this one.'
action: ACCEPT
action_rationale: Each set selects one lysosomal enzyme family whose reviewed members are experimentally
  annotated to a child of the rule's term. The taxon conditions on sets 1 and 3 are narrow, which limits
  coverage but does not make the annotation wrong.
literature_support:
  assessment: STRONG
  notes: 'Curated GO annotations (QuickGO, November 2026): P16278 (GLB1) GO:0042340 IMP PMID:31720227;
    P35475 (IDUA) GO:0030209 IDA PMID:24036510; HEXA_MOUSE and HEXB_MOUSE GO:0030209 IGI PMID:11707436;
    P15586 (GNS) GO:0030200 IDA PMID:15595925. GO:0042340, GO:0030209 and GO:0030200 are descendants of
    GO:0030167.'
go_specificity:
  assessment: APPROPRIATE
  notes: GO:0030167 is the common parent of the three child terms the matched proteins are experimentally
    annotated to (GO:0042340 keratan sulfate, GO:0030209 dermatan sulfate and GO:0030200 heparan sulfate
    proteoglycan catabolic process). A per-set child term would be more specific.
