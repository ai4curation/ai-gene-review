review_summary: >-
  Accuracy: all four live condition sets were examined. The Swiss-Prot matches of every set carry a descendant
  of GO:0030167 (proteoglycan catabolic process) with experimental evidence: beta-galactosidase GLB1 (keratan
  sulfate, IMP), alpha-L-iduronidase (dermatan sulfate and heparan sulfate, IDA and IMP), mouse HEXA and
  HEXB (dermatan sulfate, IGI) and N-acetylglucosamine-6-sulfatase (heparan sulfate, IDA and IMP). No
  annotation the rule could make is false. Meaning and parsimony: the rule is an umbrella over four lysosomal
  glycosidase and sulfatase families, each of which has a curated child term naming the glycosaminoglycan
  it degrades. Those child terms are already asserted by other ARBA rules using the same condition sets
  (ARBA00087463, ARBA00085487, ARBA00085492), so all four sets are covered, and QuickGO holds no annotation
  attributed to this rule.
action: DEPRECATE
action_rationale: >-
  The split that the biology calls for has already been made upstream: each of the four sets is matched
  exactly by a rule asserting a more specific term. Because UniProt keeps only the most specific ARBA
  term, this rule emits nothing (0 annotations in QuickGO) and can be removed without losing an annotation.
suggested_modifications: []
biological_meaning:
  assessment: TRUE_BUT_UNINFORMATIVE
  notes: >-
    Four enzyme families of lysosomal glycosaminoglycan degradation, one per set. Each carries a child
    of the consequent that names its substrate class; the parent term adds nothing to them. rule_redundancy.tsv
    counts 4 of 4 sets as covered (by GO:0030200 and GO:0030209); checking the live rules for every descendant
    of the consequent shows all 4 are covered, set 1 by ARBA00087463 (GO:0042340 (keratan sulfate proteoglycan
    catabolic process)) and set 3 by ARBA00085492.
