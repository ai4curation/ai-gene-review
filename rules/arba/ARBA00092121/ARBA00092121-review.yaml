  notes: >-
    Withdrawn rule. For the record, its single set selected one family, and the curated annotation of
    the yeast members is GO:0034198 (cellular response to amino acid starvation) (IGI, PMID:23899355,
    SGD), which is not under GO:1903833 (positive regulation of cellular response to amino acid starvation).
