review_summary: >-
  UniProt returned 404 for this rule on 2026-11-09. The condition set recorded is that of the last version
  reviewed. The family is not unrelated to the process: the two yeast members of the FunFam, Rbg1 and
  Rbg2, are annotated by SGD to GO:0034198 cellular response to amino acid starvation with genetic-interaction
  evidence. The rule asserted the regulation term GO:1903833 rather than GO:0034198. Meaning was not judged
  further because the rule is gone; the one recorded set selects a single family (Rbg1/Rbg2-type DRG proteins
  in Fungi), whose curated term GO:0034198 (cellular response to amino acid starvation) is not a descendant
  of the regulation term the rule asserted.
action: WITHDRAWN
action_rationale: >-
  UniProt no longer serves the rule (HTTP 404 on 2026-11-09). That is a fact about its state, not a judgement
  that it was wrong.
