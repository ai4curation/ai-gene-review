review_summary: >-
  All 214 live condition sets were screened with two UniProtKB queries each (2026-11-10): the Swiss-Prot
  entries that match the whole conjunction, and how many of them carry KW-0904 Protein phosphatase. Every
  set matches at least one Swiss-Prot entry. Summed over sets there are 2,248 set-level matches (an entry
  that matches several sets is counted once per set) and 2,248 of them carry the keyword. No set has a
  Swiss-Prot match without the keyword. All 214 sets are recorded in the rule block with official signature
  names. 61 of the 214 sets have a taxon condition. ARBA rules are mined from Swiss-Prot annotation, so
  this screen shows that no set conflicts with curated keywords; it does not measure precision on the
  345,960 unreviewed entries the rule annotates.
action: ACCEPT
action_rationale: >-
  The keyword Protein phosphatase is defined by UniProt as: Enzyme that catalyzes the hydrolysis of phosphate
  monoesters bonds of phosphoserines, phosphothreonines, phosphotyrosines or phosphoaspartic acids. It
  is a class label, so its members are expected to be diverse. In every one of the 214 condition sets
  all Swiss-Prot matches carry the keyword. The rule emits a keyword, not a GO term; UniProt maps KW-0904
  to GO:0004721 phosphoprotein phosphatase activity. Confidence is moderate because the evidence is agreement
  with Swiss-Prot, the source ARBA rules are mined from, and precision on unreviewed entries was not measured.
