review_summary: >-
  Accuracy: all 1,392 live condition sets were screened with two UniProtKB queries each (2026-11-10):
  the Swiss-Prot entries that match the whole conjunction, and how many of them carry KW-0418 (Kinase).
  Every set matches at least one Swiss-Prot entry, and all 46,549 set-level matches carry the keyword.
  Ten sets are recorded with official signature names; the others were checked by count only. The screen
  shows no conflict with curated keywords; it does not measure precision on the 3,762,398 unreviewed entries
  the rule annotates. Meaning and parsimony: Kinase is an enzyme class label and the recorded sets select
  kinase families (GHMP kinases, adenylate, thymidylate and cytidylate kinases, the amino acid kinase
  family, phosphoglycerate kinase, plant protein kinases), so the label fits and, for the many small-molecule
  kinases, it is the most specific keyword UniProt has. The keyword hierarchy has two narrower keywords,
  Serine/threonine-protein kinase and Tyrosine-protein kinase, each with its own ARBA rule; 648 of the
  1,392 sets (47%) are structurally covered by a set of one of those two rules. Seen from above, 1,292
  of the 1,392 sets are in turn covered by the Transferase rule ARBA00022679. Keywords stack, so every
  set emits Kinase, but nearly half restate what the protein-kinase rules establish.
action: MODIFY
action_rationale: >-
  The first pass left the rule undecided because the sets were screened by count and not read. The class
  label is coherent on the recorded sample and on the complete Swiss-Prot screen, which found no match
  without the keyword. The construction can be simplified: assigning Kinase wherever one of its two child
  keywords is assigned would replace 648 sets and leave 744 for kinases with no narrower keyword. The
  annotations are not wrong. Confidence is modest because the proposal depends on ARBA being able to chain
  a keyword from a keyword, which was not verified, and because precision on unreviewed entries is unmeasured.
confidence: 0.55
suggested_modifications:
- >-
  Derive KW-0418 (Kinase) from its child keywords KW-0723 (Serine/threonine-protein kinase) and KW-0829
  (Tyrosine-protein kinase), and drop the 648 condition sets covered by a set of ARBA00022527 (587 sets)
  or ARBA00023137 (69 sets). None of the ten recorded sets is among them.
- >-
  Keep the remaining 744 sets, which select kinases with no narrower keyword (all ten recorded sets, for
  example sets 2, 6, 7 and 10, the nucleoside monophosphate kinases).
