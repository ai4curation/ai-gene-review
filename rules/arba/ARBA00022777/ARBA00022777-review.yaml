parsimony:
  assessment: REDUNDANT
  notes: >-
    Structural test on the 1,392 sets downloaded 2026-11-12: 648 sets are covered by a rule for a descendant
    keyword of KW-0418 (ARBA00022527 Serine/threonine-protein kinase 587; ARBA00023137 Tyrosine-protein
    kinase 69), and 1,292 are covered by a set of the parent rule ARBA00022679 (Transferase), 8 of the
    10 recorded sets among them (all but sets 1 and 9). Keywords from the three rules stack on one protein
    (A0A1B0GXE3 carries all three, each with its own ARBA evidence). No set is subsumed by another set
    of the same rule. 1,004 sets are a single signature and 171 have a taxon condition.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    171 of 1,392 sets have a taxon condition; kinases occur in all domains of life. The two recorded taxon
    conditions are Bacteria on the GHMP N-terminal domain (set 1) and Viridiplantae on the protein kinase
    active-site signatures (set 5); both narrow a broad signature and neither was shown to exclude true
    kinases wrongly. Not reviewed beyond the recorded sets.
