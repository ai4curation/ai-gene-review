    All previous supported_by entries cited rules/arba/ARBA00022777/ARBA00022777-deep-research-manual.md
- date: '2026-11-10'
  withdrawn_claim: The rule ignores taxonomy by covering bacteria, archaea, eukaryotes and viruses.
  correction: Kinases occur in all of these, and part of the rule is taxon-restricted.
