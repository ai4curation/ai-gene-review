    Live rule: 1,392 condition sets; every set has Swiss-Prot matches and all of them carry the keyword
- date: '2026-11-10'
  withdrawn_claim: The keyword Kinase gives no functional information and conflates distinct kinase classes.
  correction: >-
    It is a class label that is true of all of them; UniProt maps it to a GO molecular function term.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - >-
    UniProt KW-0418 definition: Enzyme that catalyzes the transfer of phosphate (phosphoryl or pyrophosphoryl
    transfer) usually from ATP to a second substrate.
  - 'UniProt keyword KW-0418 geneOntologies: GO:0016301 kinase activity'
- date: '2026-11-10'
  withdrawn_claim: Literature contradicts the rule because kinome studies classify kinases into families.
  correction: >-
    A finer classification does not contradict the superclass label, and the only source cited was the
    rule's own manual note.
  error_type: UNSUPPORTED_SOURCE
  evidence:
