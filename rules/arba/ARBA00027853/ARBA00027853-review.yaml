    the term with non-ARBA evidence. P40394 (ADH7): GO:0001523 IDA PMID:16787387. P28474 (mouse Adh5): GO:0001523
    IMP PMID:12027900 (MGI). P11712 (CYP2C9): GO:0016098 IDA PMID:16401082. Q05469 (LIPE): GO:0050253 IDA PMID:15955102.
    Q96AD5 (PNPLA2): GO:0050253 EXP PMID:17603008. Not supported: the eight GlpB entries listed match the conditions
    of CS18; Q8ZAH6 is named Anaerobic glycerol-3-phosphate dehydrogenase subunit B, EC 1.1.5.3, by HAMAP MF_00753
    and has PANTHER PTHR43734. QuickGO shows no GO:0006720 annotation from this rule on Q8ZAH6, so the defect is
    in the published conditions and was not seen in emitted annotations. Q6PQJ9 does carry GO:0006720 IEA GO_REF:0000117
    with ARBA:ARBA00027853.'
