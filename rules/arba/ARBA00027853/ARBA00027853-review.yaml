id: ARBA00027853
description: Assigns GO:0006720 isoprenoid metabolic process through 89 alternative condition sets 
  built from InterPro entries, PANTHER families and CATH FunFams, 70 of them with a taxon condition.
  The sets cover terpene synthases and cyclases, prenyl diphosphate synthases, carotenoid synthesis 
  and cleavage enzymes, gibberellin and abscisic acid oxidases, mevalonate pathway enzymes and 
  retinoid-metabolising enzymes.
