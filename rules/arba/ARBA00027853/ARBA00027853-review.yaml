review_summary: >-
  ARBA00027853 is a 94-branch omnibus rule whose GO term is correct and whose biological
  core is sound, but which is not auditable as published. GO:0006720 is a genuinely
  appropriate broad parent for the families the rule mostly targets: its definition covers
  compounds "containing or derived from linked isoprene residues", and QuickGO ancestor
  closures checked on 2026-08-22 confirm that retinoid metabolic process (GO:0001523),
  terpenoid metabolic process (GO:0006721), gibberellin biosynthetic process (GO:0009686)
  and the tetraterpenoid/diterpenoid biosynthetic terms are all descendants of it. That
  definition also answers the objection recorded in geneontology/go-annotation#5835 that a
  metabolite "is derived from an isoprenoid, but not an isoprenoid" - derived-from is
  explicitly in scope. The boundary that does bite is steroids: GO:0008202 steroid metabolic
  process is NOT a descendant of GO:0006720 (its QuickGO ancestor closure is GO:0008150,
  GO:0008152, GO:0006629, GO:0008202, GO:0044238, GO:0009987), which makes two branches
  wrong-branch rather than merely broad. Note also that the specific protein cited in #5835,
  S. pombe SPAC31G5.16c = dpm1 (O14466), is not reachable from any of this rule's condition
  sets and carries no GO:0006720 today; that part of the issue belongs to ARBA00028538 and
  ARBA00028655. This puts ARBA00027853 in a different position from its sibling rules in
  #5835: the GO term itself is in the right branch here, so the rule's problems are ones of
  branch construction and reproducibility rather than of a mis-chosen term. Branch triage
  gives 64 of 94 condition sets on-target, 13 to remove, 16 unresolvable from their
  identifiers, and one (CS39) mixed and needing a split. The empirical picture is better than the branch
  count suggests. The UniProt API reports zero annotated proteins for this rule - the figure
  the commissioned deep research was given, and on which it built its "no present production
  set" reasoning - but a QuickGO census on 2026-08-22 finds 8,974 live GO:0006720 /
  ECO:0000256 / GO_REF:0000117 annotations citing ARBA:ARBA00027853, across 1,570 taxa. A
  protein-name census of all 8,974 shows 47.6% carotenoid/retinoid cleavage enzymes (BCO1,
  BCO2, RPE65, NinaB), 30.4% prenyl and polyprenyl diphosphate synthases (PDSS1, PDSS2,
  FPPS, GGPPS), 16.0% uncharacterized entries, and a demonstrable false-positive tail of only
  a few percent. The 47 human annotations, enumerated exhaustively, are 100% on-target. The
  serious finding is a reproducibility failure: in a random 300-protein sample, 187 (62%)
  carry InterPro IPR004294 "Carotenoid oxygenase" but 167 of those 187 are not mammals, while
  the rule's only IPR004294 branch (CS7) requires taxon Mammalia; and 89 (30%) carry
  IPR000092 while only 25 of them also carry the IPR039702 that the rule's only IPR000092
  branch (CS16) requires. Either the published conjunctions are not enforced at annotation
  time or the rule content served today has diverged from the annotating release. Either way,
  the constraints that make this rule look safe on paper are invisible in the data it is
  credited with, and that is a plausible mechanism for the "lots of off target inferences"
  reported by curators.
action: MODIFY
action_rationale: >-
  MODIFY rather than DEPRECATE, because the rule is currently producing roughly 8,900
  annotations that are in the large majority correct and useful - carotenoid oxygenases and
  polyprenyl diphosphate synthases across 1,570 taxa, with a 100%-correct human subset.
  Retiring the rule would discard far more good annotation than bad. This is the opposite
  situation from ARBA00028655 in the same GO issue, where under 1% of emitted annotations
  were defensible and DEPRECATE/SPLIT was the right call. MODIFY rather than ACCEPT, because
  13 branches are indefensible on their own terms and because the rule cannot be audited
  against its own output. The commissioned deep research recommends SPLIT into pathway-specific
  rules (precursor/backbone, terpene synthases, carotenoids, gibberellin/ABA, retinoids,
  sterol/triterpenoid, juvenile hormone), which is a reasonable longer-term target and would
  also let each fragment carry a more specific descendant term than GO:0006720; but the
  immediate, minimal fix that answers the curators' complaint is branch surgery plus
  reconciliation of the published rule with its emitted annotations, not restructuring. The
  single highest-priority action is not biological at all: UniProt should reconcile the
  condition sets with the annotation set and fix the statistics block that reports zero
  proteins for a rule with 8,974 live annotations - that field caused an entire commissioned
  literature review to be conducted on a false premise. The confidence value below is
  confidence in this recommendation, not in the rule.
suggested_modifications:
- 'RECONCILE the published condition sets with the emitted annotation set, and fix the
  statistics block. The API reports reviewedProteinCount 0 / unreviewedProteinCount 0 while
  QuickGO reports 8,974 live annotations attributed to this rule (2026-08-22). Separately,
  62% of a random 300-protein sample carries IPR004294 with 89% of those non-mammalian,
  although the only IPR004294 branch requires Mammalia. Until this is explained, no
  per-branch curation decision below can be verified against real output.'
- 'REMOVE the 13 unusable condition sets - 12 off-target plus CS43, which is removable because
  it is unsatisfiable rather than because it is off-target: CS14 (IPR002213 bare UGT family +
  Caryophyllaceae), CS37 (CYP2C9 FunFam, Primates), CS43 (requires two distinct FunFams from
  within the same CATH superfamily 3.40.605.10, which one ALDH catalytic domain cannot satisfy),
  CS44 (hormone-sensitive lipase FunFams, Craniata), CS51 (ADH class 4 / ADH7, Vertebrata),
  CS55 (ADH5 / S-(hydroxymethyl)glutathione dehydrogenase, Mus), CS63 (LDLR + LRP1 FunFams,
  Catarrhini), CS64 (PNPLA2/ATGL FunFams, Eutheria), CS66 (phenylalanine aminomutase,
  Pinopsida), CS73 (CYP83B1, Asterales), CS78 (unlabelled P450 FunFam, Homo), CS83 (FunFam
  labelled only "Glycosyltransferase", Caryophyllaceae), CS94 (unlabelled Rossmann/SDR FunFam,
  no taxon).'
- 'SPLIT CS39 (CATH FunFam 3.40.50.720:FF:000808, "Iridoid synthase", asterids). This is the
  PRISE family, which contains both iridoid synthases (isoprenoid, correct) and progesterone
  5-beta-reductase / 3-oxo-Delta(4,5)-steroid 5-beta-reductases (steroid, and GO:0008202 is
  not under GO:0006720). Empirically the steroid members outnumber the iridoid members in this
  rule''s output: 132 vs 84 of 8,974 annotations. Restrict the branch to the iridoid synthase
  members, or drop it.'
- 'RESOLVE or drop the 16 unauditable branches: CS6 (generic P450 + PANTHER CYP71 family +
  Asterales), CS23, CS35, CS49, CS65, CS75, CS77, CS80, CS82, CS84, CS85, CS87, CS90, CS92 and
  - with a note that these two are likely keeps rather than deletes - CS38 and CS89. A bare
  FunFam identifier is not evidence, but the superfamily it sits in still carries information:
  CS38 (1.50.10.20) and CS89 (1.50.10.130) are in isoprenoid-dedicated cyclase folds, whereas
  CS90/CS92 (2.60.120.330 2OG dioxygenase), CS94 (3.40.50.720 Rossmann) and CS82/CS84/CS85
  (3.40.50.2000 GT-B) are in folds that carry mostly unrelated chemistry.'
- 'FIX three FunFam branches whose label names an enzyme that cannot occur in the clade the
  branch is restricted to - a reliable sign that a FunFam label is being read as a function
  rather than as the name of its best-studied member. CS23: "Cytochrome P450 99A2" (a rice,
  Poales, momilactone P450) restricted to campanulids. CS35: "Cytochrome P450 71D8" (a legume
  enzyme) restricted to Poales. CS75: "Taxadiene 5-alpha hydroxylase" (Taxus, Pinopsida)
  restricted to Caryophyllales.'
- 'CORRECT the truncated label on CS74, "Abscisic acid 8", to "abscisic acid 8''-hydroxylase"
  (CYP707A). The branch is biologically on-target - ABA is an apocarotenoid and its catabolism
  is inside GO:0006720 - but a label that stops mid-word is exactly the kind of thing that
  conceals a wrong FunFam id.'
- 'REVIEW the taxon constraints as a whole. Twenty-four of 94 sets have no taxon constraint at
  all (CS1, CS5, CS9, CS13, CS17, CS24, CS30, CS34, CS40, CS43, CS52, CS56-CS60, CS80,
  CS88-CS94) and therefore fire across all of UniProt, while other branches on universally
  conserved enzymes are pinned to a single genus or family: CS55 (Mus, on ADH5), CS78 (Homo,
  on an unlabelled P450 FunFam), CS72 (Hominidae, on CYP26B1), CS37 (Primates), CS50
  (Haplorrhini, on RDH12), CS63 (Catarrhini). These read as annotation-availability artifacts
  of the association-rule mining. By contrast the Lamiaceae tribe restrictions (Ocimeae,
  Nepetoideae, Elsholtzieae, Mentheae), Pinus, Amoebozoa/Evosea/Eumycetozoa, Actinomycetota
  and Arthropoda restrictions track real lineage-specific family expansions and should stay.'
- 'CONSIDER the deep research''s SPLIT recommendation as the longer-term target: separate rules
  for MVA/MEP precursor metabolism, prenyl diphosphate synthases, terpene synthases,
  carotenoid metabolism, gibberellin/ABA metabolism, retinoid metabolism, triterpenoid/squalene
  metabolism and juvenile hormone metabolism. Each fragment could then carry a more specific
  descendant of GO:0006720 - GO:0016114 terpenoid biosynthetic process, GO:0016109
  tetraterpenoid biosynthetic process, GO:0009686 gibberellin biosynthetic process, GO:0001523
  retinoid metabolic process - instead of the shared broad parent.'
- 'DO NOT act on the deep research''s recommendation to hold or delete the PANTHER-based
  branches CS1, CS4, CS5, CS8, CS10, CS12, CS15, CS17 and CS19 as "opaque identifiers". All
  nine resolve against interpro/panther/panther.obo to named isoprenoid families (see
  condition-set notes) and are on-target. Likewise CS20 and CS61 are not, as the report
  speculated, internally contradictory multi-FunFam conjunctions: the two FunFams in each are
  in different CATH superfamilies (1.10.600.10 isoprenoid-synthase alpha fold and 1.50.10.130
  terpene-cyclase beta-gamma fold) and plant class-I diterpene synthases carry both, so the
  conjunction is a sound domain-architecture requirement.'
parsimony:
  assessment: OVERLY_COMPLEX
  notes: >-
    94 condition sets and 122 distinct signature entries for a single GO term is far past the
    point where a rule can be reasoned about; the repository's own analysis tooling refuses to
    process it, capping post-enrichment analysis at 12 condition sets. Some of the complexity
    is legitimate - isoprenoid metabolism genuinely spans plant terpene synthases, bacterial
    2-methylisoborneol synthases, mammalian carotenoid oxygenases, insect JHAMT and the MVA and
    MEP pathways, and no small set of signatures covers that. But much of it is accretion. The
    same enzyme concept is expressed repeatedly through different databases and taxa: farnesyl
    diphosphate synthase appears in CS16 (InterPro, Ecdysozoa), CS67 (FunFam, rosids) and CS69
    (FunFam, Ecdysozoa, overlapping CS16 directly); ent-copalyl diphosphate synthase in CS21
    and CS25; phytoene synthase in CS24 and CS30; slime-mould terpene synthases in CS47, CS70
    and CS71 across three nested clades of Amoebozoa; phytoene desaturase in CS17, CS32, CS53,
    CS59 and CS60. The decisive parsimony argument, though, is empirical rather than structural:
    the emitted annotation set is dominated by carotenoid oxygenases and prenyl diphosphate
    synthases, so the great majority of the 94 branches contribute nothing observable. The ~19
    terpene synthase branches - the largest single group - account for 0.4% of output.
  supported_by:
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-analysis.md
    supporting_text: "condition sets contribute nothing observable"
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "biologically coherent at the GO-term level, but unsafe as a single 94-branch OR rule"
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "The top-level OR, however, means that the weakest single branch determines the rule’s overall false-positive liability."
literature_support:
  assessment: MODERATE
  notes: >-
    The commissioned deep research (Falcon / Edison Scientific Literature, run 2026-08-22)
    supports the GO term for the rule's core families and contradicts a defined minority of its
    branches - a genuinely mixed verdict, unlike the flat contradiction found for ARBA00028655.
    Its positive case rests on pathway-level reviews placing carotenoids, gibberellins, ABA and
    related hormones downstream of IPP/DMAPP and prenyl diphosphates (Bajguz & Piotrowska-
    Niczyporuk 2023, Metabolites 13:884), and on terpene synthase biology (Karunanithi & Zerbe
    2019, PMID:31632418). Its negative case rests on documented enzyme promiscuity: Werck-
    Reichhart 2023 (PMID:36830762) reports that CYP706A3 "oxidizes more than twenty different
    mono- and sesquiterpenes" and that CYP720B4 "catalyzes the three successive oxidations at
    C18 of 8 out of 24 different diterpenoid olefin skeletons" - which is what makes "generic
    P450 domain plus plant clade" non-diagnostic. It also cites quantitative limits on
    domain-based process transfer - DomFun Fmax 0.624 for molecular function versus 0.492 for
    biological process (Rojano et al. 2022, PMID:35033002); FunFam members agreeing on only
    36.9 +/- 0.6% of binding-residue annotations (Scheibenreif et al. 2019, PMID:31319797).
    Four honest limits on this evidence. First, the report was given the API's
    false "zero annotated proteins" figure and built its "no present production set from which
    empirical precision can be measured" reasoning on it; the census in the companion analysis
    corrects that. Second, it does not mention the GO Consortium or issue #5835 anywhere, so it
    offers no independent read on the curators' complaint and no Consortium ruling should be
    claimed from it. Third, its blanket recommendation to hold
    or delete "opaque" PANTHER identifiers and unnamed FunFams is too coarse - nine of the
    PANTHER branches resolve to named isoprenoid families, and two unnamed FunFams sit in
    isoprenoid-dedicated cyclase superfamilies. Fourth, one figure it quotes needs a
    scope caveat rather than a correction: its "29 documented substrates" for CYP706A3 is
    accurate - PMID:36830762 states verbatim "A total of 29 different substrates are thus
    currently reported for this enzyme" - but that total is reached only by adding the
    dinitroaniline herbicides to the terpenoid substrates, so 29 is not a count of terpenoid
    substrates and should not be cited as one. Only one external provider was reachable in this
    environment: Perplexity returned an insufficient-quota error, Cyberian is not configured,
    and the OpenAI deep-research model returned a 404, so this review rests on one commissioned
    report plus the independent empirical census rather than on two providers.
  supported_by:
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "GO:0006720 is **neither too narrow nor intrinsically incorrect** for the genuine pathway enzymes in this rule."
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "Several branches appear clearly off-target—notably CYP2C9, CYP83B1, hormone-sensitive lipase, PNPLA2, LDLR/LRP1, phenylalanine aminomutase, class-4 alcohol dehydrogenase and formaldehyde dehydrogenase."
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "one experimentally studied CYP706A3 accepts more than 20 mono- and sesquiterpenes plus herbicides, with 29 documented substrates"
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "These branches should not be retained merely because their substrates or transported particles can contain lipid-soluble isoprenoids."
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "a named, well-populated FunFam can be strong evidence, but a bare FunFam ID is not self-validating, particularly for a biological-process term"
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "This concern is amplified by the stated outcome of **zero currently annotated proteins**: there is no present production set from which empirical precision can be measured."
condition_overlap:
  assessment: SIGNIFICANT
  notes: >-
    Quantitative pairwise overlap could not be computed: the repository's analyse-rule step
    refuses rules above 12 condition sets ("Rule ARBA00027853 has 94 condition sets, which
    exceeds the maximum of 12"), so no pairwise_overlap blocks are populated below and the
    assessment here is structural rather than metric. Read at that level the redundancy is
    plain. Farnesyl diphosphate synthase is reached three times - CS16 (IPR000092 + IPR039702,
    Ecdysozoa), CS67 (FunFam 1.10.600.10:FF:000008, rosids) and CS69 (FunFam
    1.10.600.10:FF:000021, Ecdysozoa) - with CS16 and CS69 targeting the same enzymes in the
    same clade through different databases. Phytoene desaturase appears in five sets (CS17,
    CS32, CS53, CS59, CS60), phytoene synthase in three (CS5, CS24, CS30), ent-copalyl
    diphosphate synthase in two (CS21, CS25), triterpene cyclases in three (CS27, CS38, CS62),
    and Amoebozoan terpene synthases in three nested clades (CS47 Amoebozoa, CS70 Evosea, CS71
    Eumycetozoa - Evosea and Eumycetozoa both lie inside Amoebozoa, so CS70 and CS71 add
    coverage only if their FunFams differ from CS47's, which is not established). CATH
    superfamily 1.10.600.10 alone supplies conditions to 14 different sets and 1.10.630.10 to
    13. Cross-database redundancy of this kind is not harmful in itself - it buys coverage when
    InterPro, PANTHER and CATH disagree about a protein - but at this scale it makes the rule
    unmaintainable and hides which branch is responsible for any given annotation, which is
    exactly the problem when a curator files an off-target report.
  supported_by:
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "Redundancy is extensive among TPS InterPro/PANTHER/FunFam conditions, carotenoid synthase/desaturase/cyclase conditions, prenyl synthases and GA enzymes."
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "it complicates maintenance and can conceal inconsistent thresholds or obsolete family labels"
go_specificity:
  assessment: APPROPRIATE
  notes: >-
    GO:0006720 is the right level for a rule whose branches span terpene, carotenoid, retinoid,
    gibberellin, ABA, triterpenoid and juvenile-hormone chemistry, and it is genuinely correct
    for the families that dominate the output. Its definition - "compounds containing or
    derived from linked isoprene residues" - covers apocarotenoids and retinoids, and QuickGO
    ancestor closures checked on 2026-08-22 confirm GO:0001523 retinoid metabolic process,
    GO:0006721 terpenoid metabolic process, GO:0016114 terpenoid biosynthetic process,
    GO:0016109 tetraterpenoid biosynthetic process, GO:0016102 diterpenoid biosynthetic process
    and GO:0009686 gibberellin biosynthetic process are all descendants. Breadth is also a
    virtue for specific branches: CS5 combines the squalene/phytoene synthase family with its
    conserved site, and that signature cannot distinguish the sterol entry reaction from the
    carotenoid entry reaction, so the shared parent is the honest term. The one place the term
    is wrong rather than broad is where a branch reaches steroid chemistry: GO:0008202 steroid
    metabolic process is not a descendant of GO:0006720, which condemns CS63 (LDLR/LRP1,
    cholesterol uptake) and the progesterone 5-beta-reductase half of CS39. Against APPROPRIATE
    it must be said that for the strongest branches - HMGCR, DXS, IspH, mevalonate kinase, the
    GA oxidases, CYP26, LRAT, JHAMT - a specific descendant would carry far more information
    than the shared parent, and the deep research argues the term is "too broad as the only
    annotation" for those. That is an argument for splitting the rule, which is recorded under
    action_rationale, not for calling the term itself mismatched.
  supported_by:
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-analysis.md
    supporting_text: "**steroids are not in the\nisoprenoid branch**"
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "GO:0006720 is therefore safer than either a squalene- or phytoene-specific process term."
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "For many high-confidence branches, GO:0006720 is **too broad as the only annotation**, although it remains a valid ancestor."
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    The constraints are internally inconsistent, and the dominant failure is over-restriction
    on conserved families rather than over-inclusion. Six branches pin universally conserved
    enzymes to a single genus, family or primate clade: CS55 restricts ADH5 - a housekeeping
    formaldehyde dehydrogenase present in essentially every eukaryote - to Mus; CS78 restricts
    an unlabelled P450 FunFam to Homo; CS72 restricts CYP26B1 to Hominidae and CS36 restricts
    CYP26A1 to Metazoa though both are vertebrate-wide; CS50 restricts RDH12 to Haplorrhini;
    CS37 restricts CYP2C9 to Primates; CS63 restricts LDLR/LRP1 to Catarrhini. Restrictions of
    that shape are artifacts of where experimental annotation happens to exist, not statements
    about where the enzyme exists, and they guarantee the rule under-annotates real orthologues.
    Similarly CS41 (Mammalia) and CS42 (Chordata) restrict diphosphomevalonate decarboxylase and
    mevalonate kinase, which are not mammal- or chordate-specific. In the other direction, 24
    branches carry no taxon constraint at all and fire across all of UniProt, including CS94
    (bare Rossmann FunFam) and, nominally, CS43 (ALDH FunFams) - though CS43 appears
    unsatisfiable, so the missing constraint there is moot. Where such a branch does fire, a
    constraint would at least have limited the damage. Where the restrictions do track biology they are well chosen
    - the Lamiaceae tribes Ocimeae, Nepetoideae, Elsholtzieae and Mentheae for terpene synthase
    expansions, Pinus for conifer TPS, Amoebozoa for slime-mould TPS, Bacillati and
    Actinomycetota for 2-methylisoborneol synthase and geranyl diphosphate methyltransferase,
    Arthropoda for JHAMT - and those should be kept. Finally, the empirical audit shows the
    constraints may not be doing what they appear to: 167 of 187 sampled IPR004294 proteins are
    non-mammalian although the only IPR004294 branch requires Mammalia.
  supported_by:
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-analysis.md
    supporting_text: "these read as annotation-availability artifacts of\nthe association-rule mining, not as biology"
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "Several restrictions may be unnecessarily narrow: CYP26, RDH12, LRAT, GA enzymes and many prenyl synthases are conserved beyond the listed crown taxa."
  - reference_id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
    supporting_text: "They become problematic when used to rescue a generic fold. A Caryophyllaceae glycosyltransferase, Asterales P450 or mammalian ALDH is not automatically an isoprenoid enzyme."
confidence: 0.8
references:
- id: file:rules/arba/ARBA00027853/ARBA00027853-deep-research-falcon.md
  title: "Deep research analysis via Falcon (Edison Scientific Literature), run 2026-08-22"
  findings:
  - statement: >-
      GO:0006720 is an appropriate broad parent for the rule's genuine pathway enzymes -
      terpene synthases, MVA/MEP precursor enzymes, prenyl diphosphate synthases, carotenoid
      enzymes, gibberellin and ABA enzymes, retinoid enzymes and JHAMT - but the rule is
      "unsafe as a single 94-branch OR rule".
  - statement: >-
      Eight branch groups are off-target and should be removed: CYP2C9 (CS37), the mixed ALDH2
      conjunction (CS43), hormone-sensitive lipase (CS44), PNPLA2 (CS64), alcohol and
      formaldehyde dehydrogenases (CS51, CS55), LDLR/LRP1 (CS63), phenylalanine aminomutase
      (CS66) and CYP83B1 (CS73).
  - statement: >-
      Plant cytochrome P450 promiscuity is the rule rather than the exception - CYP706A3 has 29
      documented substrates spanning more than 20 mono- and sesquiterpenes plus herbicides - so
      a generic P450 domain plus a plant taxon cannot predict isoprenoid metabolism.
  - statement: >-
      Domain-based transfer is measurably weaker for biological process than for molecular
      function (DomFun Fmax 0.492 vs 0.624), and FunFam members agree on only 36.9% of
      binding-residue annotations, so a bare FunFam identifier is not self-validating for a
      process term.
  - statement: >-
      The report was given the UniProt API's figure of zero annotated proteins and reasoned
      from it that no empirical precision estimate was possible. That premise is false; see the
      companion analysis.
- id: file:rules/arba/ARBA00027853/ARBA00027853-analysis.md
  title: "ARBA00027853 analysis - condition-set triage, ontology-branch check and annotation census"
  findings:
  - statement: >-
      QuickGO on 2026-08-22 reports 8,974 live GO:0006720 / ECO:0000256 / GO_REF:0000117
      annotations citing ARBA:ARBA00027853 across 1,570 taxa, contradicting the rule's own
      statistics block of zero proteins.
  - statement: >-
      A protein-name census of all 8,974 gives 47.6% carotenoid/retinoid cleavage enzymes,
      30.4% prenyl and polyprenyl diphosphate synthases and 16.0% uncharacterized entries, with
      a demonstrable false-positive tail of a few percent; the 47 human annotations are 100%
      on-target.
  - statement: >-
      In a random 300-protein sample, 187 carry IPR004294 but 167 of those are non-mammalian
      although the rule's only IPR004294 branch requires Mammalia, and only 25 of 89 IPR000092
      proteins carry the co-required IPR039702 - so the emitted set cannot be reproduced from
      the published condition sets.
  - statement: >-
      GO:0008202 steroid metabolic process is not a descendant of GO:0006720, which makes CS63
      (LDLR/LRP1) and the progesterone 5-beta-reductase half of CS39 wrong-branch rather than
      merely broad.
  - statement: >-
      Nine PANTHER conditions the deep research treated as unauditable resolve against
      interpro/panther/panther.obo to named isoprenoid families, and the CS20/CS61 multi-FunFam
      conjunctions it suspected of being contradictory are sound domain-architecture
      requirements spanning two different CATH superfamilies.
- id: file:rules/arba/ARBA00027853/scripts/census_arba00027853.py
  title: "Reproducible QuickGO/UniProt census script for ARBA00027853"
  findings:
  - statement: >-
      Re-derives the annotation count, protein-name census and signature/taxon audit from
      primary sources with nothing hard-coded; run on 2026-08-22 it reproduces the figures
      quoted in the analysis and this review.
- id: PMID:37623827
  title: "Biosynthetic Pathways of Hormones in Plants."
  findings:
  - statement: >-
      Places gibberellins, abscisic acid, strigolactones and brassinosteroids downstream of
      IPP/DMAPP and the prenyl diphosphates, which is the pathway-level basis for treating
      GA20ox/GA3ox/GA2ox, ent-kaurene oxidase, ent-kaurenoic acid oxidase and the ABA
      8'-hydroxylases (CS28, CS29, CS31, CS57, CS58, CS74, CS91) as isoprenoid metabolism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.3390/metabo13080884 via NCBI esearch and cached with full text
      on 2026-08-22; this is the review the Falcon report leans on for its positive case.
- id: PMID:36830762
  title: "Promiscuity, a Driver of Plant Cytochrome P450 Evolution?"
  findings:
  - statement: >-
      CYP706A3 "oxidizes more than twenty different mono- and sesquiterpenes", and CYP720B4
      "catalyzes the three successive oxidations at C18 of 8 out of 24 different diterpenoid
      olefin skeletons". Plant P450 substrate breadth of this kind is why a generic P450 domain
      plus a plant clade (CS6, CS23, CS26, CS35, CS73, CS77) cannot predict isoprenoid
      metabolism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.3390/biom13020394 and cached with full text on 2026-08-22. The
      two quoted figures were checked verbatim against the cached text, as was the Falcon
      report's "29 documented substrates" for CYP706A3: the article states "A total of 29
      different substrates are thus currently reported for this enzyme". The caveat on that
      number is one of scope, not accuracy - it counts the dinitroaniline herbicides alongside
      the mono- and sesquiterpenes, so it is a count of total substrate breadth and not of
      terpenoid substrates.
- id: PMID:31632418
  title: "Terpene Synthases as Metabolic Gatekeepers in the Evolution of Plant Terpenoid"
  findings:
  - statement: >-
      Plant terpene synthase families diversify by duplication, domain loss/gain and small
      active-site changes that redirect carbocation cascades and product profiles. This supports
      annotating TPS branches at the level of GO:0006720 rather than transferring
      product-specific terms from a broad TPS domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.3389/fpls.2019.01166 and cached with full text on 2026-08-22.
- id: PMID:35033002
  title: "Assigning protein function from domain-function associations using DomFun."
  findings:
  - statement: >-
      Domain-based function transfer benchmarks measurably worse for biological process than
      for molecular function (Fmax 0.492 vs 0.624 in the no-knowledge partial evaluation),
      which is the general reason a FunFam or InterPro signature is weaker evidence for
      GO:0006720 than it would be for a corresponding molecular function term.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.1186/s12859-022-04565-6 and cached on 2026-08-22. Methodological
      background, not evidence about isoprenoid biology.
- id: PMID:38122964
  title: "FunPredCATH: An ensemble method for predicting protein function using CATH."
  full_text_unavailable: true
  findings:
  - statement: >-
      CATH FunFam-based function prediction reaches competitive but bounded accuracy, with
      union models increasing false-positive risk and intersection models trading coverage for
      precision - the trade-off this rule makes implicitly by OR-ing 94 branches.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.1016/j.bbapap.2023.140985 and cached on 2026-08-22.
      Abstract-only (no PMC record), so the specific Fmax figures quoted by the Falcon report
      were not independently checked against full text.
- id: PMID:31319797
  title: "FunFam protein families improve residue level molecular function prediction."
  findings:
  - statement: >-
      FunFam members agree on only 36.9 +/- 0.6% of binding-residue annotations - better than
      random grouping but far from uniform. A named, well-populated FunFam can be strong
      evidence, but a bare FunFam identifier is not self-validating, which is the basis for
      holding rather than accepting the 16 unlabelled-FunFam branches.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID resolved from DOI 10.1186/s12859-019-2988-x and cached with full text on 2026-08-22.
