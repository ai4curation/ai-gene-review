      specialized metabolism. It supplies the phenylisoserine side chain of paclitaxel, which is why
      it appears in a conifer context - but the enzyme's substrate and product are amino acids, not
      isoprenoids. Supplying a non-isoprenoid moiety to a taxane is not isoprenoid metabolism.
