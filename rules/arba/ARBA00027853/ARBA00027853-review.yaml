review_summary: >-
  Accuracy: all 89 live condition sets were queried against Swiss-Prot on 2026-11-09, counting a match
  as supported when it carries GO:0006720 (isoprenoid metabolic process) or an is_a/part_of descendant
  with evidence other than ARBA. Every set has reviewed matches; in 75 sets every match is supported and
  in 14 some are not. One defect is demonstrable: CS18 (PANTHER PTHR43734 in Pseudomonadati) matches GlpB,
  a glycerol-3-phosphate dehydrogenase subunit with no isoprenoid role, in 8 of its 22 reviewed matches.
  Q6PQJ9, a 3-oxo-Delta(4,5)-steroid 5-beta-reductase (CS37), and Q54E48 (CS1) are doubtful. QuickGO lists
  9043 annotations attributed to the rule. Meaning and parsimony: isoprenoid metabolic process is the
  common ancestor of pathways that have little else in common, and the sets divide among them: plant and
  microbial terpene synthases, carotenoid biosynthesis enzymes, animal carotenoid oxygenases, retinoid-metabolising
  enzymes, gibberellin oxidases, prenyl diphosphate synthases, the mevalonate and methylerythritol phosphate
  pathways and juvenile hormone synthesis. Each has a specific curated descendant. rule_redundancy.tsv
  finds 63 of 97 sets already matched by a rule asserting a more specific term. Four sets select proteins
  for which the term is nominal: the triglyceride lipases LIPE and PNPLA2 (sets 40, 59), the endocytic
  receptors LRP1 and LRP2 (set 57) and the drug-metabolising cytochromes P450 2C and 3A4 (sets 35, 74).
  Their curated roles are triglyceride catabolism, receptor-mediated endocytosis and xenobiotic metabolism;
  the isoprenoid term comes from a retinyl ester side activity, a Reactome pathway step or one terpene
  substrate.
action: SPLIT
action_rationale: >-
  The first pass kept the rule and asked for CS18 to be fixed. That fix still stands, but the larger point
  is that the term is the wrong level for nearly every set: the units are separable and each has a better
  term, two thirds of the sets are already covered by rules with such terms, and several sets select proteins
  whose function lies elsewhere. The rule should be split by pathway, the nominal sets dropped and CS18
  tightened. Units were assigned for 43 of the 89 sets from signature labels with one member looked up
  per unit; confidence reflects that.
suggested_modifications:
- >-
  Drop the sets already matched by rules asserting a more specific term (63 of 97 in rule_redundancy.tsv;
  covering terms GO:0008299 isoprenoid biosynthetic process, GO:0006721 terpenoid metabolic process, GO:0042214
  terpene metabolic process, GO:0045338 farnesyl diphosphate metabolic process, GO:0016101 diterpenoid
  metabolic process).
- >-
  Move the remaining sets to the term of their unit: terpene synthase sets 2, 3, 6, 11, 14, 17, 19, 21
  to GO:0046246 (terpene biosynthetic process); carotenoid sets 1, 9, 12, 15, 23, 27, 29, 52, 53, 54 to
  GO:0016117 (carotenoid biosynthetic process); retinoid sets 34, 41, 48, 50, 66 to GO:0001523 (retinoid
  metabolic process); gibberellin sets 25, 26 to GO:0009686 (gibberellin biosynthetic process); farnesyl
  diphosphate synthase sets 16, 61, 62, 63 to GO:0045337 (trans, trans-farnesyl diphosphate biosynthetic
  process); mevalonate pathway sets 30, 38, 39 to GO:0019287 (isopentenyl diphosphate biosynthetic process,
  mevalonate pathway); sets 49, 88 to GO:0019288 (isopentenyl diphosphate biosynthetic process, methylerythritol
  phosphate pathway); set 77 to GO:0006718 (juvenile hormone biosynthetic process).
- >-
  Drop sets 40 and 59 (hormone-sensitive lipase and PNPLA2 FunFams), set 57 (LRP1/LRP2 FunFams in Catarrhini)
  and sets 35 and 74 (cytochrome P450 2C9 and 3A4 FunFams): the curated process of these proteins is outside
  the consequent.
- >-
  CS18 (PANTHER PTHR43734 AND Pseudomonadati): exclude GlpB, for example by adding NOT InterPro IPR009158
  (Glycerol-3-phosphate dehydrogenase, GlpB subunit), or by requiring a carotenoid desaturase subfamily
  of PTHR43734.
- >-
  CS37 (FunFam 3.40.50.720:FF:000808 AND asterids): check whether the 3-oxo-Delta(4,5)-steroid 5-beta-reductases
  it matches (Q6PQJ9) belong under the term; steroid metabolic process GO:0008202 is not a descendant
  of GO:0006720.
