      curie: InterPro:IPR001906
      label: "Terpene synthase, N-terminal domain"
      interpro_type: DOMAIN
      negated: false
    - condition_type: INTERPRO
      value: IPR005630
      curie: InterPro:IPR005630
      label: "Terpene synthase-like, metal-binding domain"
      interpro_type: DOMAIN
      negated: false
    - condition_type: PANTHER
      value: PTHR31225:SF93
      curie: PTHR31225:SF93
      negated: false
    notes: >-
      ON-TARGET. IPR001906 (TPS N-terminal) + IPR005630 (TPS metal-binding C-terminal) + PANTHER
      PTHR31225:SF93. The PANTHER subfamily resolves to 'ALPHA-HUMULENE_(-)-(E)-BETA-CARYOPHYLLENE
      SYNTHASE' (panther.obo), a sesquiterpene synthase - the deep research treated bare PANTHER ids
      as unauditable, but the repository PANTHER build settles this one. Requiring both TPS domains
      plus a named subfamily is one of the better-constructed branches. No taxon constraint, which is
      fine for a subfamily this narrow.
