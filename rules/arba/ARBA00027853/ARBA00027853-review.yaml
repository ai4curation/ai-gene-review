id: ARBA00027853
description: >-
  Assigns GO:0006720 "isoprenoid metabolic process" to proteins matching any of 94
  alternative condition sets built from InterPro entries, CATH FunFams, PANTHER families
  and taxon constraints. The GO term is in the right branch for most of the rule: 64 of the
  94 sets identify genuine isoprenoid enzymes - terpene synthases and cyclases, the MVA and
  MEP precursor pathways, prenyl diphosphate synthases, carotenoid backbone and cleavage
  enzymes, gibberellin and ABA oxidases, named retinoid enzymes and JHAMT. Thirteen sets
  should be removed - twelve off-target (LDLR/LRP1, CYP2C9, CYP83B1, ADH5, ADH7,
  hormone-sensitive lipase, PNPLA2, phenylalanine aminomutase, bare UGT and Rossmann
  FunFams) plus one ALDH FunFam conjunction that appears unsatisfiable - one set is mixed
  and needs splitting, and sixteen cannot be audited from their identifiers. The rule's most
  serious defect is not biological: the 8,974 annotations it currently emits cannot be
  reproduced from its published condition sets.
status: COMPLETE
rule_type: ARBA
rule:
  rule_id: ARBA00027853
  condition_sets:
