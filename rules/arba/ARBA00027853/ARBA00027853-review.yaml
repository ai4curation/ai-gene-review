review_summary: 'All 89 live condition sets were queried. Each set was turned into a UniProtKB query and its Swiss-Prot
  matches were inspected on 2026-11-09. A match counts as supported when it carries the term or an is_a/part_of
  descendant with evidence other than ARBA; annotations placed by ARBA rules on Swiss-Prot entries were not counted.
  Every set has reviewed matches. In 75 sets every reviewed match is supported and in 14 sets (CS1, CS5, CS7, CS9,
  CS18, CS22, CS25, CS30, CS35, CS37, CS42, CS47, CS58, CS72) some are not. One of these is a demonstrable defect:
  CS18 (PANTHER PTHR43734 in Pseudomonadati) matches GlpB, a glycerol-3-phosphate dehydrogenase subunit with no
  isoprenoid role, in 8 of its 22 reviewed matches. Two further matches are doubtful: Q6PQJ9, a 3-oxo-Delta(4,5)-steroid
  5-beta-reductase that carries the term only from this rule (CS37), and Q54E48, an NADH dehydrogenase assembly
  factor homologue (CS1). The retinoid-related sets on ADH7, hormone-sensitive lipase, PNPLA2, LRP1 and CYP2C family
  members are supported by curated annotation in the isoprenoid branch. QuickGO lists 9043 annotations attributed
  to this rule, while the rule statistics served by UniProt report zero proteins.'
action: MODIFY
action_rationale: The term is supported for 75 sets outright and for most matches of the rest, so the rule should
  be kept. CS18 as published matches GlpB proteins, which are not isoprenoid enzymes, and needs a further condition.
suggested_modifications:
- 'CS18 (PANTHER PTHR43734 AND Pseudomonadati): exclude GlpB, for example by adding NOT InterPro IPR009158 (Glycerol-3-phosphate
  dehydrogenase, GlpB subunit), or by requiring a carotenoid desaturase subfamily of PTHR43734.'
- 'CS37 (FunFam 3.40.50.720:FF:000808 AND asterids): check whether the 3-oxo-Delta(4,5)-steroid 5-beta-reductases
  it matches (Q6PQJ9) belong under the term; steroid metabolic process GO:0008202 is not a descendant of GO:0006720.'
go_specificity:
  assessment: APPROPRIATE
  notes: 'The sets span terpenoid, carotenoid, retinoid and prenyl diphosphate metabolism, for which GO:0006720
    is the common ancestor: retinoid metabolic process GO:0001523 and monoterpenoid metabolic process GO:0016098
    are both among its descendants (QuickGO, is_a/part_of).'
