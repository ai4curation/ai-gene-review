    - condition_type: FUNFAM
      value: 3.40.605.10:FF:000001
      curie: CATH.FunFam:3.40.605.10:FF:000001
      label: "Aldehyde dehydrogenase 1"
      negated: false
    - condition_type: TAXON
      value: Euarchontoglires
      curie: NCBITaxon:314146
      label: "Euarchontoglires"
      negated: false
    notes: >-
      HOLD, but the case for retaining it is stronger than first stated. FunFam
      3.40.309.10:FF:000021 ('Aldehyde dehydrogenase family 8 member A1') + 3.40.605.10:FF:000001
      ('Aldehyde dehydrogenase 1') + Euarchontoglires. ALDH8A1 does have 9-cis-retinal
      dehydrogenase activity and ALDH1A1 is a retinal dehydrogenase, so the intent is legitimate.
      The earlier objection - that 'Aldehyde dehydrogenase 1' is too broad to exclude the wider
      ALDH superfamily - misread the conjunction as a disjunction. The two FunFams are AND-ed and
      sit in the two distinct ALDH-fold CATH superfamilies (3.40.309.10 and 3.40.605.10), so this
      is the same sound domain-architecture pattern accepted for CS20 and CS61; the broad conjunct
      cannot widen the match set, and the specific ALDH8A1 conjunct binds it. Unlike CS43 the
      branch is satisfiable, since it draws one FunFam from each superfamily rather than two from
      one. HOLD is retained only pending a member census to confirm the matched set is in fact
      ALDH8A1-like, not because the conjunction is unsound.
