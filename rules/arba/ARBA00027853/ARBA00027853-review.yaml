parsimony:
  assessment: REDUNDANT
  notes: >-
    rule_redundancy.tsv: 63 of 97 condition sets are matched by a rule asserting a more specific term
    and emit nothing; the rest account for the 9043 annotations QuickGO attributes to the rule. Farnesyl
    diphosphate synthase alone enters through four sets and phytoene desaturase through at least five.
    rules/arba/_interpro2go.txt has no InterPro entry mapped to GO:0006720.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    Most taxon conditions are plant clades on terpene synthase and P450 FunFams (Lamiaceae, Nepetoideae,
    asterids, Pinopsida), which follow lineage-specific specialised metabolism. Some confine conserved
    enzymes to where their annotations are, such as cytochrome P450 3A4 to Homo (set 74), P450 2C9 to
    Primates (set 35) and farnesyl diphosphate synthase to Glires (set 63); that is narrow coverage, not
    wrong annotation. CS18 is too broad in effect because its signature, not its taxon, admits GlpB.
