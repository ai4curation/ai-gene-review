      IPR008949 (isoprenoid synthase domain superfamily) + Ocimeae. Both conditions are homologous-
      superfamily entries, not families; the alpha-alpha toroid also covers squalene-hopene cyclase
      and the protein prenyltransferase alpha subunit. The Ocimeae (Lamiaceae) restriction reflects a
      real TPS expansion, so this is defensible, but two superfamily folds are weaker evidence than
