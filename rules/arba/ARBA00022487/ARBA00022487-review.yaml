review_summary: >-
  Accuracy: all 65 live condition sets were screened with two UniProtKB queries each (2026-11-10): the
  Swiss-Prot entries that match the whole conjunction, and how many of them carry KW-0719 (Serine esterase).
  Every set matches at least one Swiss-Prot entry, and all 1,028 set-level matches carry the keyword.
  The screen shows that no set conflicts with curated keywords; it does not measure precision on the 83,725
  unreviewed entries the rule annotates. Meaning and parsimony: the keyword is a class label (an ester
  hydrolase with a catalytic serine) and has no narrower keyword beneath it. Most sets select families
  of the alpha/beta-hydrolase fold for which the label is apt: cutinases, cholinesterases and type-B carboxylesterases,
  protein phosphatase methylesterase, BioH, FrsA, feruloyl and acetylxylan esterases, ABHD lipases. One
  unit sits less easily: six sets select HotDog-fold acyl-CoA thioesterases (ACOT7, ACOT8, ACOT9, ACOT11,
  ACOT12), which carry the keyword in Swiss-Prot although UniProt records Asn and Asp, not Ser, as the
  active site residues of human ACOT7. The clear parsimony defect is that the rule describes many families
  twice, once by InterPro signatures and once by a CATH FunFam, and at least eight of the FunFam sets
  match no UniProtKB entry that the InterPro set of the same family does not already match.
action: MODIFY
action_rationale: >-
  The rule is accurate against Swiss-Prot and its label fits the families it selects, so it is kept. Eight
  sets are contained entirely in another set of the rule across UniProtKB and can be removed without changing
  any annotation. Twenty-six pairs were tested; other FunFam sets overlap their InterPro counterpart only
  partly and do add matches (for example set 36 adds 451 entries beyond set 14), so the duplication is
  not general. The HotDog thioesterase question concerns the Swiss-Prot keyword itself and is raised,
  not acted on.
suggested_modifications:
- >-
  Remove the condition sets that are contained in another set of the rule (UniProtKB counts, 2026-11-12,
  set size = size of intersection): set 27 in set 1 (225) and set 48 in set 1 (6), BioH; set 26 in set
  2 (195), FrsA; set 30 in set 7 (9,089), S-formylglutathione hydrolase; set 29 in set 8 (47), acetyl
  esterase; set 51 in set 6 (27), cholinesterase; set 34 in set 13 (91), fungal feruloyl/acetylxylan esterase;
  set 47 in set 19 (16), feruloyl esterase A.
- >-
  Raise with UniProt whether KW-0719 (Serine esterase) is intended for HotDog-fold acyl-CoA thioesterases
  (sets 20, 22, 38, 43, 54 and 57): human ACOT7 (O00154) has active site features at positions 66 and
  255, which are Asn and Asp in its sequence, and ACOT9, ACOT11 and ACOT12 have no active site feature.
  The rule reproduces the Swiss-Prot keyword; no change to those sets is proposed until that is settled.
biological_meaning:
