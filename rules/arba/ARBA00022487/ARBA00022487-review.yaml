review_summary: >-
  All 65 live condition sets were screened with two UniProtKB queries each (2026-11-10): the Swiss-Prot
  entries that match the whole conjunction, and how many of them carry KW-0719 Serine esterase. Every
  set matches at least one Swiss-Prot entry. Summed over sets there are 1,028 set-level matches (an entry
  that matches several sets is counted once per set) and 1,028 of them carry the keyword. No set has a
  Swiss-Prot match without the keyword. All 65 sets are recorded in the rule block with official signature
  names. 46 of the 65 sets have a taxon condition. ARBA rules are mined from Swiss-Prot annotation, so
  this screen shows that no set conflicts with curated keywords; it does not measure precision on the
  83,725 unreviewed entries the rule annotates.
action: ACCEPT
action_rationale: >-
  The keyword Serine esterase is defined by UniProt as: Enzyme which catalyzes the hydrolysis of esters
  and is characterized by a catalytically active serine residue in its active site. It is a class label,
  so its members are expected to be diverse. In every one of the 65 condition sets all Swiss-Prot matches
  carry the keyword. The rule emits a keyword, not a GO term; UniProt maps KW-0719 to GO:0052689 carboxylic
  ester hydrolase activity. Confidence is moderate because the evidence is agreement with Swiss-Prot,
  the source ARBA rules are mined from, and precision on unreviewed entries was not measured.
