  notes: >-
    Five units covering all 65 sets, assigned from the signature names and the Swiss-Prot examples in
    the set notes. Four are alpha/beta-hydrolase or SGNH families with a serine nucleophile, where the
    label is apt. The fifth, acyl-CoA thioesterases, mixes the BAAT/ACOT1 type (alpha/beta hydrolase,
    charge relay system annotated in Q86TX2) with HotDog-fold enzymes for which a catalytic serine is
    not recorded. KW-0719 has no child keywords (parent: Hydrolase); UniProt maps it to GO:0052689 (carboxylic
    ester hydrolase activity). Keyword rule: no rule_redundancy.tsv row.
