parsimony:
  assessment: REDUNDANT
  notes: >-
    Each signature is used in one set and no set is contained in another by its conditions, but by matched
    proteins nine of the 26 sets add nothing: UniProtKB queries for each set NOT (all other sets) return
    0 for sets 10, 11, 14, 16, 17, 18, 19, 23 and 26 (1377, 1307, 1304, 2230, 3230, 1834, 315, 5 and 5922
    entries). The other FunFam sets do add proteins (set 12: 666, set 21: 15442, set 22: 722, set 24:
    554, set 25: 255). No single InterPro entry maps to this pathway comment, so the multi-set form itself
    is needed: six enzymes cannot share one signature.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    The pathway is universal. Eighteen sets carry no taxon condition; the eight that do (Eukaryota, Bacteria,
    Bacillati, Fungi, Pseudomonadati, Bacillota, Thermotogati, Archaea) confine a FunFam to the lineage
    where its reviewed members are, and every reviewed match inside them has the pathway comment.
