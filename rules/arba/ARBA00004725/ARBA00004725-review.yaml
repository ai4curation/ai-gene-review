review_summary: >-
  All 26 live condition sets are recorded with their official labels. By those labels the InterPro
  sets name dihydroorotate dehydrogenase, orotidine 5'-phosphate decarboxylase, orotate phosphoribosyltransferase,
  aspartate carbamoyltransferase and dihydroorotase families, which are enzymes of de novo UMP biosynthesis.
  The sets were not checked against the curated pathway comments of their Swiss-Prot members, so no
  verdict is given. UniProt reports 7889 unreviewed proteins for the rule.
action: UNDECIDED
action_rationale: >-
  The condition sets were read but not checked against annotated proteins. No wrongly annotated protein
  is known.
suggested_modifications:
- Check each condition set against the curated PATHWAY comment of its Swiss-Prot members.
