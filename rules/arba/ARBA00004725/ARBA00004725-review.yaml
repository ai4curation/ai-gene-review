review_summary: >-
  Accuracy: all 26 condition sets were turned into UniProtKB queries. In every set, every reviewed match
  carries the curated pathway comment for de novo UMP biosynthesis; no reviewed match lacks it. Meaning
  and parsimony: the sets resolve into the enzymes of one pathway (carbamoyl-phosphate synthase, aspartate
  carbamoyltransferase, dihydroorotase, dihydroorotate dehydrogenase with its electron-transfer subunit,
  orotate phosphoribosyltransferase and orotidine 5'-phosphate decarboxylase), and the pathway comment
  is the statement that is true of all of them, so the rule is a coherent biological statement. It is
  not minimal: nine FunFam sets match no protein that another set of the rule does not already match.
action: MODIFY
action_rationale: >-
  The rule is accurate and coherent. The only defect is redundancy: sets 10, 11, 14, 16, 17, 18, 19, 23
  and 26 add no protein in the current release, so they can be removed without changing what the rule
  annotates. If redundancy of this kind is tolerated as insurance against signature changes, the rule
  can stand as it is; nothing about its annotations needs correcting.
suggested_modifications:
- >-
  Remove sets 10, 11, 14, 16, 17, 18, 19, 23 and 26: in UniProtKB 2026_04 each matches only entries that
  another set of the rule also matches (comparison made without sets 6 and 9, whose PANTHER subfamily
  conditions cannot be queried).
confidence: 0.65
biological_meaning:
  assessment: COHERENT
  notes: >-
    Not a GO rule, so projects/ARBA_REVIEW/rule_redundancy.tsv has no row. All 26 sets select enzymes
    of the six-step de novo UMP pathway; the step-specific activities differ, and the pathway comment
    is the most informative statement common to them.
  sets_examined_for_meaning: 26
