- annotation_kind: OTHER
  value: 'PATHWAY: Pyrimidine metabolism; UMP biosynthesis via de novo pathway'
  assessment: UNDECIDED
  matched_protein_count: 7889
  notes: >-
    matched_protein_count is the unreviewedProteinCount from rest.uniprot.org/arba/ARBA00004725 on
    2026-11-09. InterPro API names: IPR005720 Dihydroorotate dehydrogenase, catalytic; IPR012135 Dihydroorotate
    dehydrogenase, class 1/ 2; IPR001754 Orotidine 5'-phosphate decarboxylase domain; IPR014732 and
    IPR011995 Orotidine 5'-phosphate decarboxylase families; IPR023031 Orotate phosphoribosyltransferase;
    IPR002082 Aspartate carbamoyltransferase; IPR004721 Dihydroorotase homodimeric type. No matched
    protein was checked.
corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule should add specific GO molecular function terms for each enzyme (for example dihydroorotate
    dehydrogenase activity).
  correction: >-
    A rule gives the same annotation to every protein it matches. This rule matches six different
    enzymes, so an enzyme-specific term added to it would be wrong for the other five. The shared
    pathway comment is the statement that holds for all of them.
  error_type: OTHER
  evidence:
  - 'Live set 1: IPR005720 AND IPR013785 AND IPR050074 (dihydroorotate dehydrogenase)'
  - 'Live set 3: IPR001754 AND IPR011060 AND IPR018089 (orotidine 5''-phosphate decarboxylase)'
  - 'Live set 7: IPR002082 AND IPR006130 AND IPR006131 (aspartate carbamoyltransferase)'
- date: '2026-11-10'
  withdrawn_claim: Bacillati and Pseudomonadati are very narrow taxonomic scopes.
  correction: Both are kingdom-rank bacterial taxa.
  error_type: TAXON_MISREAD
  evidence:
  - 'UniProt taxonomy 1783272 Bacillati: rank kingdom'
  - 'UniProt taxonomy 3379134 Pseudomonadati: rank kingdom'
- date: '2026-11-10'
  withdrawn_claim: Conditions 1, 2, 3, 12, 16, 18, 19, 20 and 24 all target dihydroorotate dehydrogenase.
  correction: >-
    Set 3 is an orotidine 5'-phosphate decarboxylase signature, and the previous text also listed
    condition 20 under orotidine 5'-phosphate decarboxylase. The overlap claim was not measured.
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
  - 'InterPro API: IPR001754 = Orotidine 5''-phosphate decarboxylase domain'
- date: '2026-11-10'
  withdrawn_claim: 27 condition sets exceed a recommended maximum of 12, so the rule needs consolidation.
  correction: >-
    Rule size is not evidence about correctness; a pathway with six enzymes needs several alternative
    conditions. The live rule has 26 sets.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'rest.uniprot.org/arba/ARBA00004725, 2026-11-09: 26 sets'
