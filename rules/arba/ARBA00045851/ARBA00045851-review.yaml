taxonomic_scope:
  assessment: TOO_BROAD
  notes: >-
    Set 1 has no taxon condition and set 2 is limited only to Eukaryota. UniProtKB 2026_04 counts for
    set 1, from a query on the PANTHER family and so upper bounds except where stated: 1,648 entries,
    of which 874 Vertebrata, 233 Arthropoda, 75 Viridiplantae, 25 Fungi. IPR016495 (p53 negative regulator
    Mdm2/Mdm4): 2,900 entries in Vertebrata, 34 in Arthropoda, 0 in Viridiplantae, 0 in Fungi. IPR002117
    (p53 tumour suppressor family): 4,674 in Vertebrata, 653 in Arthropoda, 1 in Viridiplantae, 0 in Fungi.
    The breadth follows the family's distribution, not the distribution of the mechanism the comment describes.
