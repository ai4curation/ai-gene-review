review_summary: 'Both condition sets were read. Set 1 (IPR003409 (MORN repeat) AND IPR052472 (MORN repeat-containing
  protein 3) AND PANTHER:PTHR46511:SF1) has no taxon condition. A query on the PANTHER family (a superset
  of the required subfamily, so an upper bound) returns 1,648 UniProtKB entries (release 2026_04): 874
  vertebrate, 233 arthropod, 75 Viridiplantae and 25 fungal; all 100 plant and fungal entries carry the
  subfamily. The comment the rule assigns names p53/TP53 and MDM2. No Viridiplantae or fungal entry in
  UniProtKB matches the Mdm2/Mdm4 family (IPR016495), and one Viridiplantae and no fungal entry matches
  the p53 family (IPR002117), so in those lineages the text describes partners that are not there. The
  Drosophila entry A1ZB08 carries the comment with evidence ECO:0000256 ARBA:ARBA00045851. The mechanism
  itself was shown for mammalian MORN3 (PMID:29681526), and the spermatogenesis role in mouse (PMID:25248657).'
action: MODIFY
action_rationale: The text is specific to a p53/MDM2 mechanism and the rule applies it to every eukaryotic
  member of the family, including 100 plant and fungal entries whose proteomes have no Mdm2/Mdm4 family
  member. Restricting the rule to the lineage where the mechanism was shown removes those. Whether the
  text holds for non-mammalian animals is not established either way; arthropods do have Mdm2/Mdm4 and
  p53 family members (34 and 653 entries).
suggested_modifications:
- 'Add a taxon condition to set 1 and narrow set 2 from Eukaryota: Mammalia (NCBITaxon:40674), where the
  mechanism was shown, or at most Vertebrata (NCBITaxon:7742).'
- Alternatively keep the scope and reduce the comment to what family membership supports.
taxonomic_scope:
  assessment: TOO_BROAD
  notes: 'Set 1 has no taxon condition and set 2 is limited only to Eukaryota. UniProtKB 2026_04 counts
    for set 1: 1,648 entries, of which 874 Vertebrata, 233 Arthropoda, 75 Viridiplantae, 25 Fungi. Mdm2/Mdm4
    family IPR016495: 2,900 entries in Vertebrata, 34 in Arthropoda, 0 in Viridiplantae, 0 in Fungi. p53
    family IPR002117: 4,674 in Vertebrata, 653 in Arthropoda, 1 in Viridiplantae, 0 in Fungi.'
