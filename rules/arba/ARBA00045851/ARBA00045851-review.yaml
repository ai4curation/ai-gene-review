parsimony:
  assessment: REDUNDANT
  notes: >-
    UniProtKB counts (2026-11-12): xref IPR052472 (MORN repeat-containing protein 3), 1,747 entries; xref
    PANTHER PTHR46511, 1,747 entries; IPR003409 (MORN repeat) AND IPR052472 AND PTHR46511, 1,648; IPR052472
    without IPR003409, 99. So in set 1 the InterPro family and the PANTHER family are the same set of
    proteins and only IPR003409 changes the result. Set 2 (FunFam 2.20.110.10:FF:000026 in Eukaryota)
    matches 185 entries, 183 of which carry IPR052472. One family signature plus a taxon would replace
    both sets. rule_redundancy.tsv covers GO rules only and has no row for this rule.
