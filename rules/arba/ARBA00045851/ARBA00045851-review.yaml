id: ARBA00045851
description: Assigns a FUNCTION comment describing assembly of a p53/TP53 suppression complex that 
  tethers SIRT1 and MDM2, and a possible role in spermatogenesis, to proteins of the MORN 
  repeat-containing protein 3 family across Eukaryota.
