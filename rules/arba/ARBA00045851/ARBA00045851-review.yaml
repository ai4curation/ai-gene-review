review_summary: >-
  Accuracy: both condition sets were read. Set 1 (IPR003409 (MORN repeat) AND IPR052472 (MORN repeat-containing
  protein 3) AND PANTHER:PTHR46511:SF1) has no taxon condition; a query on the PANTHER family, an upper
  bound, returns 1,648 UniProtKB entries, of which 874 are vertebrate, 233 arthropod, 75 Viridiplantae
  and 25 fungal. The FUNCTION comment the rule assigns names p53/TP53, SIRT1 and MDM2. No Viridiplantae
  or fungal entry in UniProtKB matches the Mdm2/Mdm4 family, IPR016495 (p53 negative regulator Mdm2/Mdm4),
  so in those lineages the text describes partners that are not there. The mechanism was shown for mammalian
  MORN3 (PMID:29681526) and the spermatogenesis role in mouse (PMID:25248657). Meaning and parsimony:
  the two sets select one unit, the MORN3 family, so the rule is coherent about which proteins it means;
  the defect is that it attaches a lineage-specific mechanism to the whole family. The construction is
  also heavier than it needs to be. IPR052472 and PANTHER:PTHR46511 match exactly the same 1,747 entries,
  so two of the three signatures of set 1 restate each other, and 183 of the 185 eukaryotic entries with
  the FunFam of set 2 already carry IPR052472. This is a FUNCTION-comment rule, so projects/ARBA_REVIEW/rule_redundancy.tsv
  has no row for it.
action: MODIFY
action_rationale: >-
  The text is specific to a p53/MDM2 mechanism and the rule applies it to every eukaryotic member of the
  family, including 100 plant and fungal entries whose proteomes have no Mdm2/Mdm4 family member. Restricting
  the rule to the lineage where the mechanism was shown removes those. The meaning check adds a second,
  smaller change: one family signature with a taxon would do the work of the present two sets. Whether
  the text holds for non-mammalian animals is not established either way.
suggested_modifications:
- >-
  Add a taxon condition to set 1 and narrow set 2 from Eukaryota: Mammalia (NCBITaxon:40674), where the
  mechanism was shown, or at most Vertebrata (NCBITaxon:7742).
- Alternatively keep the scope and reduce the comment to what family membership supports.
- >-
  Simplify the conditions: IPR052472 (MORN repeat-containing protein 3) and PANTHER:PTHR46511 match the
  same 1,747 UniProtKB entries, so set 1 needs only one of them (plus IPR003409 if the 99 entries without
  a MORN repeat match are to be excluded), and set 2 adds at most 2 of its 185 entries beyond the IPR052472
  family.
biological_meaning:
  assessment: COHERENT
  notes: >-
    One unit: the MORN repeat-containing protein 3 family, selected twice (InterPro/PANTHER in set 1,
    CATH FunFam in set 2). The comment is the experimentally described function of mammalian MORN3, so
    label and family agree; the problem is taxon scope, recorded under taxonomic_scope. No GO consequent,
    so no descendant or coverage counts apply and rule_redundancy.tsv has no row.
  sets_examined_for_meaning: 2
