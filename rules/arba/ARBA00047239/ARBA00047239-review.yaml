review_summary: >-
  Accuracy: all eight live condition sets were examined. In each set the Swiss-Prot matches carry GO:0032206
  (positive regulation of telomere maintenance) or a descendant with experimental evidence: TERF2 (IDA),
  ATM (IMP), tankyrases (IDA), MAPK1 and MAPK3 (IMP), CCT subunits (IMP), RTEL1 (IMP), mouse RUVBL1 and
  RUVBL2 (IMP) and SLX4 (IDA). No wrongly annotated protein was found. Meaning and parsimony: the rule
  is a list of eight unrelated proteins or protein pairs that have each been shown to promote telomere
  maintenance, by different routes (a shelterin subunit, checkpoint and MAP kinases, a poly-ADP-ribosyltransferase,
  a chaperonin, helicases, a nuclease scaffold). For four of them (ATM, tankyrase, CCT, RuvB-like helicases)
  the curated term is a descendant of the consequent, and a separate rule already asserts that descendant
  with the same signatures, so those four sets emit nothing. For the other four (TERF2, MAPK1/MAPK3, RTEL1,
  SLX4) the consequent is the curated term itself.
action: MODIFY
action_rationale: >-
  The annotations are right, but half of the rule does no work. Sets 2, 3 and 7 are matched exactly by
  rules for descendant terms, and set 5 by the same FunFam pair under a wider taxon. Removing them leaves
  four sets for which the consequent is the most informative curated term. The rule stays a mixed list
  and not a family, which is acceptable for a regulation term as long as each set rests on its own experiment.
suggested_modifications:
- >-
  Remove set 2 (ATM): ARBA00047255 asserts GO:1904358 (positive regulation of telomere maintenance via
  telomere lengthening) for the same set.
- >-
  Remove set 3 (tankyrase): ARBA00047236 asserts GO:0032212 (positive regulation of telomere maintenance
  via telomerase), ARBA00047255 asserts GO:1904358 (positive regulation of telomere maintenance via telomere
  lengthening) and ARBA00089794 asserts GO:1904355 (positive regulation of telomere capping) for the same
  set.
- >-
  Remove set 5 (CCT subunits, Catarrhini): ARBA00047236 asserts GO:0032212 (positive regulation of telomere
  maintenance via telomerase) for the same FunFam pair in Haplorrhini, which contains Catarrhini.
- >-
  Remove set 7 (RuvB-like helicases, Mus): ARBA00090219 asserts GO:1904507 (positive regulation of telomere
  maintenance in response to DNA damage) for the same set.
- >-
  Keep sets 1 (TERF2), 4 (MAPK1 and MAPK3), 6 (RTEL1) and 8 (SLX4), where the experimental annotations
  are to the consequent itself.
