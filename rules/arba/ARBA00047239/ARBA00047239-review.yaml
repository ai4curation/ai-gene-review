  notes: >-
    Eight unrelated units share the consequent only because each has an experimental annotation under
    it; the rule is a lookup table of curated regulators, not a family or a complex. Four units carry
    a more specific descendant that another rule already asserts (rule_redundancy.tsv: 4 of 8 sets covered,
    by GO:0032212, GO:1904358 and GO:1904507). For the remaining four the consequent is the level curators
    chose, and RTEL1 and SLX4 have no single descendant shared by their human and mouse annotations. Figures
    updated from rule_redundancy.tsv as rebuilt on 2026-11-12 from the rules UniProt serves now, which has 8 sets: covered sets 4 in the earlier table, 3 now. Where the prose of this review quotes the earlier
    figure, this one replaces it.
