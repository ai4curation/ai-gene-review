  notes: >-
    The taxa track the species of the experiments, not the biology: Mus for the RuvB-like helicases, Primates
    for tankyrase, Haplorrhini for MAPK1 and MAPK3, Catarrhini for CCT, although all of these proteins
    are conserved across mammals or wider. Only ATM (Eukaryota) and SLX4 (Metazoa) are broad, and RTEL1
    has no taxon. Narrow coverage, not wrong annotation.
