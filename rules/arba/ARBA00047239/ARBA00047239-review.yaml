review_summary: 'All eight live condition sets were examined. In each set the Swiss-Prot matches carry
  GO:0032206 or a descendant with experimental evidence: TERF2 (IDA), ATM (IMP, telomere lengthening),
  TNKS (IDA, via telomerase), MAPK1 and MAPK3 (IMP), CCT subunits (IMP, via telomerase), RTEL1 (IMP),
  mouse RUVBL1 and RUVBL2 (IMP, in response to DNA damage) and SLX4 (IDA). The FunFam conjunctions are
  narrow: each selects two to six Swiss-Prot proteins of a single orthologous group or pair of paralogs.'
action: ACCEPT
action_rationale: Every condition set reproduces a curated experimental annotation on the proteins it
  selects, and no Swiss-Prot match lacks the term. The taxon conditions are narrower than the experimental
  evidence requires in some sets (for example Mus for RuvB-like helicases), which limits coverage but
  does not make the annotation wrong.
literature_support:
  assessment: STRONG
  notes: 'Curated GO annotations (QuickGO, November 2026): Q15554 (TERF2) GO:0032206 IDA PMID:24012755;
    Q13315 (ATM) GO:1904358 IMP PMID:17694070 and PMID:26586427; O95271 (TNKS) GO:0032212 IDA PMID:12782650;
    P28482 (MAPK1) and P27361 (MAPK3) GO:0032206 IMP PMID:21531765; P17987 (TCP1) GO:0032212 IMP PMID:25467444;
    Q8IY92 (SLX4) GO:0032206 IDA PMID:24012755. GO:0032212, GO:1904358 and GO:1904507 are is_a children
    of GO:0032206.'
go_specificity:
  assessment: APPROPRIATE
  notes: The experimental annotations are to GO:0032206 itself (TERF2, MAPK1, MAPK3, SLX4, RTEL1) or to
    its children GO:0032212, GO:1904358 and GO:1904507, so GO:0032206 is the common term across the sets.
