corrections:
- date: '2026-11-10'
  withdrawn_claim: Condition set 1 mixes the archaeal thermosome (IPR054827, "Thermosome subunit alpha"),
    which does not exist in Primates, with eukaryotic CCT; remove it.
  correction: IPR054827 is the family "TCP-1 chaperonin-like", found on eukaryotic CCT subunits as well
    as archaeal thermosomes. The set is no longer in the live rule.
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
  - 'InterPro API: IPR054827 name "TCP-1 chaperonin-like", type family'
  - 'UniProtKB query (xref:interpro-IPR054827) AND (reviewed:true) AND (taxonomy_id:2759): 96 entries;
    with taxonomy_id:2157: 37 entries'
  - 'UniProtKB query (xref:interpro-IPR054827) AND (xref:interpro-IPR002194) AND (reviewed:true) AND (organism_id:9606):
    8 entries (CCT subunits)'
- date: '2026-11-10'
  withdrawn_claim: ATM triggers senescence at dysfunctional telomeres, which is negative regulation; the
    ATM set is a broad multifunctional family where membership does not predict telomere function.
  correction: The two-FunFam conjunction matches three Swiss-Prot proteins, all ATM orthologs, and ATM
    has experimental annotation to a child of the rule's term.
  error_type: REFUTED_BY_CURATED_ANNOTATION
  evidence:
  - 'UniProtKB query for set 2 with reviewed:true: Q13315 (ATM_HUMAN), ATM_MOUSE, ATM_PIG'
  - Q13315 GO:1904358 positive regulation of telomere maintenance via telomere lengthening, IMP, PMID:17694070
    and PMID:26586427 (BHF-UCL)
  - GO:1904358 is_a GO:0032206 (QuickGO)
- date: '2026-11-10'
  withdrawn_claim: The MAPK set covers the MAPK family (ERK, p38, JNK) with only indirect effects and
    should be removed.
  correction: The mammalian Swiss-Prot matches of the live set are MAPK1 and MAPK3, which are annotated
    to the rule's own term from a mutant phenotype.
  error_type: REFUTED_BY_CURATED_ANNOTATION
  evidence:
  - P28482 (MAPK1) GO:0032206 IMP PMID:21531765 (BHF-UCL)
  - P27361 (MAPK3) GO:0032206 IMP PMID:21531765 (BHF-UCL)
