review_summary: >-
  Accuracy: both live condition sets were checked against Swiss-Prot on 2026-11-09. Each matches six reviewed
  entries and all six carry EC 5.1.3.3 (GALM orthologues, e.g. human Q96C23). The Metazoa restriction
  in set 1 is needed, because across all taxa IPR008183 (Aldose 1-/Glucose-6-phosphate 1-epimerase) has
  32 Swiss-Prot members of which only 18 carry EC 5.1.3.3. TrEMBL matches were counted but not inspected.
  Meaning and parsimony: the two sets select one biological unit, the animal galactose mutarotase GALM,
  and the reaction assigned is the reaction that unit catalyses, so the rule is coherent. The six reviewed
  matches of set 2 are the same six entries as those of set 1; set 2 exists to reach non-metazoan eukaryotes
  through the narrower FunFam. The rule is small and each set does work.
action: ACCEPT
action_rationale: >-
  The annotation is correct for every reviewed match, the two sets describe a single enzyme family, and
  neither set is idle: set 1 covers 2715 UniProtKB entries in Metazoa and set 2 covers 1187 in Eukaryota
  through a different signature.
suggested_modifications: []
biological_meaning:
  assessment: COHERENT
  notes: >-
    One unit, galactose mutarotase (GALM), selected by both sets. The consequent is a catalytic activity
    (RHEA:28675, EC 5.1.3.3), not a GO term, so rule_redundancy.tsv has no row for this rule and no descendant
    count applies.
  sets_examined_for_meaning: 2
