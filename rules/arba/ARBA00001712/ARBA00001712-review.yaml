review_summary: 'Both live condition sets were checked against Swiss-Prot. Each matches six reviewed entries and
  all six carry EC 5.1.3.3 (GALM orthologues, e.g. human Q96C23). The Metazoa restriction in set 1 is needed: across
  all taxa IPR008183 has 32 Swiss-Prot members of which only 18 carry EC 5.1.3.3, the others including glucose-6-phosphate
  1-epimerases (EC 5.1.3.15, e.g. yeast Q03161) and the sulfoquinovose mutarotase P32139. Checked against Swiss-Prot
  by UniProtKB query on 2026-11-09; TrEMBL matches were counted but not inspected.'
action: ACCEPT
action_rationale: 'Every live condition set is supported: 6 of 6 Swiss-Prot matches of each set carry EC 5.1.3.3,
  and no reviewed match lacks it.'
parsimony:
  assessment: ACCEPTABLE
  notes: In set 1 IPR011013 is a homologous superfamily that contains every Swiss-Prot IPR008183 protein (31 of
    31 in the recorded pairwise overlap), so it does not narrow the set further. It does no harm.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: 'IPR008183 (Aldose 1-/Glucose-6-phosphate 1-epimerase) is not specific to galactose mutarotase: 32 Swiss-Prot
    members, 18 with EC 5.1.3.3, 5 with EC 5.1.3.15. Within Metazoa 6 of 6 carry EC 5.1.3.3, so the taxon condition
    is what makes set 1 precise. Set 2 uses a narrower FunFam and can afford the wider taxon.'
