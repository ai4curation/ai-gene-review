  notes: No GO consequent; the unit's activity is the Rhea reaction the rule assigns.
parsimony:
  assessment: ACCEPTABLE
  notes: >-
    Two sets. In set 1, IPR011013 (Galactose mutarotase-like domain superfamily) contains every Swiss-Prot
    IPR008183 protein and does not narrow the set. The reviewed matches of the two sets are identical
    (6 and 6, union 6), but the sets differ in UniProtKB as a whole (2715 and 1187 entries) and in taxon
    (Metazoa, Eukaryota), so neither is shown to be idle.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    The Metazoa condition of set 1 follows the biology of the signature: outside Metazoa IPR008183 also
    covers glucose-6-phosphate 1-epimerases (EC 5.1.3.15) and the sulfoquinovose mutarotase P32139. Set
    2 uses a narrower FunFam and can take Eukaryota.
