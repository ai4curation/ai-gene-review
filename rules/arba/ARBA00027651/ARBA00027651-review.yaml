  protein phosphatase activity) and the PP1 beta sets (15, 22) GO:0004722 (protein serine/threonine phosphatase
  activity) or GO:0017018 (myosin phosphatase activity).
- >-
  The 32 sets already matched exactly by ARBA00027656, ARBA00027653 or ARBA00033934 (1, 2, 3, 11, 12,
  17, 19, 20, 21, 25, 26, 31, 34, 35, 36, 37, 45, 46, 48, 51, 54, 55, 57, 62, 63, 68, 70, 72, 75, 76,
  77, 78) can be deleted from this rule at once; they change no annotation.
- >-
  Re-examine sets 65, 66 and 67 before keeping them under any phosphoprotein phosphatase term: their proteins
  are an inorganic pyrophosphatase, a non-catalytic regulatory subunit and a phosphoinositide phosphatase.
