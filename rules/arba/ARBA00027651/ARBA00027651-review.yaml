parsimony:
  assessment: REDUNDANT
  notes: >-
    Thirty-two of 82 sets are matched exactly (same signatures, same or no taxon) by a rule for a descendant
    term: 22 by ARBA00027656 (GO:0004725 (protein tyrosine phosphatase activity)), 10 by ARBA00027653
    (GO:0004722 (protein serine/threonine phosphatase activity)) and set 20 also by ARBA00033934 (rest.uniprot.org/arba
    search over all 36 descendants of the consequent, 2026-11-12). A further 35 share their signatures
    with such a rule under a different taxon; 15 sets (4, 5, 6, 7, 8, 13, 15, 18, 22, 42, 44, 59, 61,
    66, 73) are matched by no descendant rule and are where this rule's annotations come from. No set
    is empty. rules/arba/_interpro2go.txt offers no single InterPro family that maps to the consequent
    and covers these families.
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    Curated annotation on the matched proteins is to children of the consequent: GO:0004725 (protein tyrosine
    phosphatase activity) tops 34 sets and GO:0004722 (protein serine/threonine phosphatase activity)
    42, with GO:0008138 (protein tyrosine/serine/threonine phosphatase activity), GO:0033192 (calmodulin-dependent
    protein phosphatase activity), GO:0008420 (RNA polymerase II CTD heptapeptide repeat phosphatase activity)
    and GO:0017018 (myosin phosphatase activity) more specific still for their units.
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    Forty-one of 82 sets carry a taxon. Several are single genera or narrower than the family warrants
    (Rattus in sets 8 and 45, Mus in set 48, Homo in set 9, Hominidae in set 36, Glires in set 61, Myomorpha
    in set 65), which follows the species of the training annotations, not where the phosphatase families
    occur. Others are sensible lineage limits for lineage-specific families (Viridiplantae, Bacteria,
    Saccharomycotina). Narrow coverage, not wrong annotation.
