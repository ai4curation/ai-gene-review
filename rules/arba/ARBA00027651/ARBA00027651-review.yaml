review_summary: >-
  Accuracy: all 82 live condition sets have now been examined (UniProtKB and QuickGO queries, November
  2026). Every set matches Swiss-Prot entries, and in every set at least one matched entry carries GO:0004721
  (phosphoprotein phosphatase activity) or a descendant on manual evidence, in all 82 from an experiment.
  No clear false positive was found, but three sets select proteins whose main activity lies outside the
  term: set 65 (inorganic pyrophosphatases PPA1 and PPA2), set 66 (glycogen-targeting regulatory subunits
  of protein phosphatase 1, where rat PPP1R3E is annotated to the term with the qualifier contributes_to)
  and set 67 (the lipid phosphatases MTMR3 and MTMR4). Meaning and parsimony: the rule is an umbrella.
  Its sets resolve into protein tyrosine phosphatases (29 sets), protein serine/threonine phosphatases
  (26), dual-specificity phosphatases (12), RNA polymerase II CTD phosphatases (8), calcineurin (2) and
  the PP1 beta catalytic subunit (2), and each of these units carries a curated child term that says which
  kind of phosphatase it is. Rules for the two largest child terms already exist and match 32 of the 82
  sets exactly, so those sets emit nothing here.
action: SPLIT
action_rationale: >-
  The parent term is true of 79 sets but tells a user nothing that the child terms do not, and the child-term
  rules that exist (ARBA00027656 for GO:0004725 (protein tyrosine phosphatase activity), ARBA00027653
  for GO:0004722 (protein serine/threonine phosphatase activity)) already duplicate 32 of the sets. The
  remedy is to send every set to the rule for its child term and retire the parent rule, after deciding
  what to do with the three sets whose proteins are not protein phosphatases in the first place.
