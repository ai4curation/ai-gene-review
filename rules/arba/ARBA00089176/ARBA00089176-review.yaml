review_summary: >-
  Accuracy: both condition sets were examined. Set 1 selects PAK kinases in Primates and set 2 selects
  p300/CBP in Catarrhini; the five human proteins they match carry GO:0002223 (stimulatory C-type lectin
  receptor signaling pathway), a descendant of GO:1990840 (response to lectin), as a Reactome traceable
  author statement (R-HSA-5621481), so the rule repeats a curated annotation one level up. Meaning and
  parsimony: the two sets select unrelated families, a cytoskeletal signalling kinase and a transcriptional
  coactivator, joined only by membership of one Reactome pathway; neither has an experimental annotation
  to any lectin-response term, and the primate restriction reflects where the Reactome annotations sit,
  not where the proteins act. Both sets are also the exact condition sets of ARBA00087826, which asserts
  the descendant GO:0002223, and of ARBA00089180; QuickGO shows no annotation from ARBA00089176.
action: DEPRECATE
action_rationale: >-
  Every condition set is covered by a served rule asserting a more specific term from the same conditions,
  so this rule emits nothing. Independently of that, response to lectin says little about PAK kinases
  or p300/CBP: the term reaches them through a pathway-membership mapping, not through anything specific
  to lectins.
suggested_modifications:
- Retire ARBA00089176; ARBA00087826 asserts GO:0002223 from the same two condition sets.
- >-
  Whether a C-type lectin signalling term should be propagated to PAK and p300/CBP orthologues at all
  is a question for ARBA00087826, since its only support is Reactome pathway membership.
biological_meaning:
  assessment: HETEROGENEOUS
  notes: >-
    Two unrelated units. PAK kinases are experimentally annotated to cytoskeletal processes such as GO:0030036
    (actin cytoskeleton organization); p300/CBP to transcription, e.g. GO:0045944 (positive regulation
    of transcription by RNA polymerase II). The consequent fits both only through the Reactome mapping
    of the CLEC7A/DC-SIGN pathway onto generic downstream signalling components.
  consequent_descendant_count: 2
  sets_covered_by_more_specific_rule: 2
