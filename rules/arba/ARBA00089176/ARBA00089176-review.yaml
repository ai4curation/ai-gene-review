go_specificity:
  assessment: TOO_BROAD
  notes: >-
    The curated annotations are to GO:0002223 (stimulatory C-type lectin receptor signaling pathway),
    a descendant of the rule's term, and a rule for that descendant already exists.
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    Primates (set 1) and Catarrhini (set 2) are where the supporting human Reactome annotations and their
    close orthologues are, not a boundary of PAK or p300/CBP biology; both families are conserved across
    animals. This is narrow coverage, not a wrong annotation, and widening it would spread a pathway-mapping
    term further.
