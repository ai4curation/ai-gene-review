review_summary: >-
  Both live condition sets were examined. Set 1 selects PAK kinases in Primates and set 2 selects
  p300/CBP in Catarrhini. All five human proteins they match (PAK1, PAK2, PAK3, EP300, CREBBP) carry
  GO:0002223 stimulatory C-type lectin receptor signaling pathway, a descendant of GO:1990840, as
  a Reactome traceable author statement (R-HSA-5621481). The other two Swiss-Prot matches are ape
  PAK3 orthologues. The rule therefore extends a curated human pathway annotation to primate orthologues,
  using the parent term.
action: ACCEPT
action_rationale: >-
  Each condition set matches only the proteins, or primate orthologues of the proteins, that curators
  have annotated to a descendant of the rule's term. The support is pathway membership recorded by
  Reactome, not an experiment on lectin response, which is why confidence is moderate.
suggested_modifications:
- >-
  Optional refinement: assert GO:0002223 stimulatory C-type lectin receptor signaling pathway, the
  term the curated annotations use, instead of its ancestor GO:1990840.
literature_support:
  assessment: MODERATE
  notes: >-
    Curated database support only: Reactome pathway R-HSA-5621481 is the source of the TAS annotations
    of human PAK1, PAK2, PAK3, EP300 and CREBBP to GO:0002223. No experimental GO annotation to GO:1990840
    or GO:0002223 exists for these proteins in QuickGO.
condition_overlap:
  assessment: NONE
  notes: >-
    The two condition sets share no protein (recorded Swiss-Prot intersection counts of 0 between
    the kinase and p300 FunFams). Within set 2 the two FunFams co-occur in the same five proteins.
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    The curated annotations of the matched human proteins are to GO:0002223, a descendant of GO:1990840.
    The rule's term is true of them but less specific.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    Primates for set 1 and Catarrhini for set 2 keep the matches to the annotated human proteins and
    their close orthologues.
