- date: '2026-11-10'
  withdrawn_claim: >-
    Only 21.8% of proteins matching FunFam 1.20.1250.20:FF:000011 carry the term, which confirms poor
    specificity.
  correction: >-
    The figure counted existing annotations among Swiss-Prot members of the FunFam in all taxa, ignored
    the taxon condition of the set, and treated a missing annotation as evidence of absence.
  error_type: CONJUNCTION_IGNORED
  evidence:
