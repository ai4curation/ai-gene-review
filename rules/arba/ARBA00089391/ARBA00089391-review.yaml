review_summary: >-
  The live rule has one condition set, FunFam 1.20.1730.10:FF:000006 in Fungi, and it was examined. Its
  Swiss-Prot matches are S. cerevisiae DUR3 (P33413), C. albicans DUR3 (A0A1D8PDB5, named Spermidine transporter
  DUR3) and S. pombe dur3-1 (O94469). P33413 has spermidine transmembrane transporter activity by IDA
  and IMP from PMID:17218313, and A0A1D8PDB5 by IMP from PMID:22033918; GO:0015606 is part_of GO:1903711.
  The MFS multidrug transporter set that an earlier version of the rule contained (FunFam 1.20.1250.20:FF:000011
  in Taphrinomycotina) is no longer in the rule.
action: ACCEPT
action_rationale: >-
  The only condition set identifies fungal DUR3 orthologs, and two of the three reviewed matches have
  experimental evidence of spermidine transport. Confidence is limited because 1,445 unreviewed fungal
  entries match and S. pombe has several dur3 paralogs whose substrates have not been tested.
literature_support:
  assessment: MODERATE
  notes: >-
    PMID:17218313, "Polyamine uptake by DUR3 and SAM3 in Saccharomyces cerevisiae", is the source of the
    SGD IDA and IMP annotations of P33413 to GO:0015606. The paper is not in the local publication cache,
    so no quotation is given.
annotation_assessments:
