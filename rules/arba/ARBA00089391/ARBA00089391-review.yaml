- date: '2026-11-10'
  withdrawn_claim: >-
    If the FunFams predicted spermidine transport the function would be expected in broader taxa, so the
    taxon restrictions show ad hoc construction.
  correction: >-
    A taxon condition limits where the rule fires; it says nothing about whether the annotation is true
