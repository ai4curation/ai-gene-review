  withdrawn_claim: >-
    Tpo1-5 belong to specific MFS subfamilies, not to the generic FunFam 1.20.1250.20:FF:000011 used in
    the rule.
  correction: >-
    TPO1, TPO2 and TPO3 are members of that FunFam. The set that used it is no longer part of the rule.
  error_type: WRONG_IDENTIFIER_MEANING
  evidence:
