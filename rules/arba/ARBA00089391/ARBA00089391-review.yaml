      to GO:1903711 spermidine transmembrane transport or an is_a/part_of descendant (QuickGO): A0A1D8PDB5
      DUR3 GO:0015606 spermidine transmembrane transporter activity IMP PMID:22033918 (CGD); P33413 DUR3
      GO:0015606 spermidine transmembrane transporter activity IDA PMID:17218313 (SGD).
