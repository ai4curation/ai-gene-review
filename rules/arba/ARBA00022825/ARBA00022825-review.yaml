review_summary: >-
  The first 10 of the 244 live condition sets were examined. They select ClpP, subtilisin (peptidase
  S8), Lon, kallikrein-related trypsin-family and proteinase K-like families, and every reviewed match
  carries the Serine protease keyword (3533 of 3533, summed over sets). The other 234 sets were not
  examined.
action: UNDECIDED
action_rationale: >-
  The rule was sampled, not examined set by set, so no verdict is given. The sampled sets are sound,
  which removes the grounds of the earlier verdict but does not establish that every set is right.
  The counts are from Swiss-Prot, which is also what ARBA learns its rules from, so they show the
  condition sets are coherent rather than giving an independent error rate for unreviewed entries.
annotation_assessments:
- annotation_kind: KEYWORD
  value: KW-0720
  label: Serine protease
  assessment: UNDECIDED
  correct_examples:
  - Q16740
  - P0A6G7
  - P29120
  notes: >-
    UniProtKB release 2026_04, reviewed entries matching a set and carrying KW-0720: set 1, Q16740
    (human CLPP) and P0A6G7 (Escherichia coli clpP); set 4, P29120 (human PCSK1). Per-set counts are
    in the condition set notes.
corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule probably captures many non-protease proteins and has a high false positive risk, because
    its domain collection is too broad.
  correction: >-
    The condition sets had not been read when this was written, and no falsely annotated protein was
    named. In the ten sets examined every reviewed match carries the keyword.
  error_type: UNEXAMINED_RULE
  evidence:
  - The old file recorded condition_sets as an empty list.
  - 'UniProtKB release 2026_04: per-set counts for sets 1 to 10 are in the condition set notes.'
- date: '2026-11-10'
  withdrawn_claim: 240 condition sets indicate poor curation, and the sets are probably redundant.
  correction: >-
    The number of sets is not evidence about accuracy. Overlap between alternative sets cannot produce
    a wrong or conflicting annotation, since the rule has one consequent.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'UniProt ARBA API, ARBA00022825, retrieved 2026-11-09: 244 condition sets, one annotation.'
- date: '2026-11-10'
  withdrawn_claim: The rule should be removed because it gives no GO term.
  correction: The consequent is a UniProt keyword by design.
  error_type: OTHER
  evidence:
  - 'UniProt ARBA API, ARBA00022825: single annotation, keyword KW-0720 Serine protease.'
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule has not been validated against reviewed entries, as its reviewed protein count is 0.
  correction: >-
    The zero is the statistic the ARBA API reports for the rule, not a validation result. Reviewed
    entries do match the condition sets.
  error_type: OTHER
  evidence:
  - 'UniProtKB release 2026_04: set 1 matches 703 reviewed entries, set 4 matches 368.'
- date: '2026-11-10'
  withdrawn_claim: Taxonomic scope is missing because some sets have taxon restrictions and others
    do not.
  correction: >-
    Each set is a separate alternative; a taxon condition on one set and none on another is not an
    inconsistency.
  error_type: TAXON_MISREAD
  evidence:
  - 'UniProt ARBA API, ARBA00022825: 96 of 244 condition sets contain a taxon condition.'
