review_summary: >-
  Accuracy: the first 10 of the 244 live condition sets were examined. They select ClpP, subtilisin (peptidase
  S8), Lon, kallikrein-related trypsin-family and proteinase K-like families, and every reviewed match
  carries the Serine protease keyword KW-0720 (3533 of 3533, summed over sets). The other 234 sets were
  not checked against proteins. Meaning and parsimony: Serine protease is a catalytic-class keyword with
  no child keywords, and the sampled sets resolve into four serine peptidase clans whose members share
  exactly that property. Several sets address one family with different signatures and overlap heavily,
  but each sampled set still matches at least one reviewed entry that its sibling does not, so none is
  shown to do no work.
action: ACCEPT
action_rationale: >-
  The keyword is the most specific one available for the class, the sampled sets select families of that
  class, and no set in the sample is empty or wholly contained in another. The redundancy that exists
  is on the side of the parent rule: 165 of these 244 sets are repeated word for word in ARBA00022670
  (Protease). The verdict rests on a sample of 10 sets, which the confidence reflects.
confidence: 0.7
