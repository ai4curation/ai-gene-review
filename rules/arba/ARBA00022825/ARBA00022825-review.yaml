parsimony:
  assessment: ACCEPTABLE
  notes: >-
    UniProtKB reviewed entries, 2026-11-12: set 2 matches 42 entries that set 1 does not, and set 1 matches
    120 that set 2 does not; set 5 adds 14 entries to set 4; sets 8 and 10 add 1 each to set 4; set 9
    adds 1 to set 6, and set 6 adds 33 to set 9. So the family-level sets overlap but each contributes.
    No set's conditions are a superset of another set's (all 244 compared, UniProt ARBA API). 165 of the
    244 sets are also present verbatim in ARBA00022670 (Protease), where they are redundant because the
    parent keyword follows from this one.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    96 of 244 sets carry a taxon. In the sample only set 8 does (IPR050131, Subtilisin-like serine protease,
    in Eukaryota), which bounds a family-level entry to the kingdom it describes.
