review_summary: >-
  Accuracy: the first 10 of the 375 live condition sets were examined. They select aminoacyl-tRNA synthetases,
  Dicer-type RNase III helicases, pseudouridine synthases, terminal nucleotidyltransferases, plant RNA-editing
  factors, eL30-fold proteins and queuine tRNA-ribosyltransferases, and 2794 of 2794 reviewed matches
  carry GO:0016070 (RNA metabolic process) or a descendant. The other 365 sets were not checked against
  proteins. Meaning and parsimony: GO:0016070 has 507 descendants and is the root of nearly all RNA biology.
  The sampled sets resolve into seven unrelated units, and for each one curated annotation gives a far
  more specific descendant: tRNA aminoacylation, pre-miRNA processing, pseudouridine synthesis, RNA 3'-end
  processing, organellar RNA modification, rRNA processing and tRNA wobble guanine modification. No sampled
  unit is curated to the consequent itself. 289 of the rule's sets are already matched by rules asserting
  a more specific term, so most of the rule emits nothing, and what it does emit is the least informative
  thing that can be said about an RNA enzyme.
action: SPLIT
action_rationale: >-
  The rule is an umbrella over families that each have a better term, and most of it is already superseded.
  It should be split toward the family-level terms. The judgement is from the 10 recorded sets (the first
  ten of the rule) plus the rule-wide redundancy count; the proportion of covered sets (289 of 371 in
  the redundancy table) indicates that the sample is representative of the rest.
confidence: 0.75
suggested_modifications:
- >-
  Aminoacyl-tRNA synthetase sets (1, 6, 7, 10): assert GO:0006418 (tRNA aminoacylation for protein translation),
  or drop them where a rule for that term already matches.
- >-
  Dicer-type RNase III helicase set (2): assert GO:0031054 (pre-miRNA processing) or its parent for the
  family.
- >-
  Pseudouridine synthase set (3): assert GO:0001522 (pseudouridine synthesis), and replace the Primates
  restriction, which the superfamily entry does not need.
- "Terminal nucleotidyltransferase set (4): assert GO:0031123 (RNA 3'-end processing)."
- >-
  Queuine tRNA-ribosyltransferase set (9): assert GO:0002099 (tRNA wobble guanine modification).
- >-
  Plant MORF set (5): assert the organellar RNA modification term curated on its members, GO:1900865 (chloroplast
  RNA modification) for the plastid proteins.
- >-
  Set 8 (IPR029064, Ribosomal protein eL30-like superfamily, in Saccharomyces) is a fold-level entry over
  ribosomal proteins, snoRNP proteins, eRF1 and Dom34: remove it, or replace it by family-level sets with
  GO:0006364 (rRNA processing) for the ribosomal and snoRNP members.
- >-
  Apply the same procedure to the 365 sets not examined: 289 sets are already covered by rules for GO:0032774
  (RNA biosynthetic process), GO:0008380 (RNA splicing), GO:0006401 (RNA catabolic process), GO:0006400
  (tRNA modification) or GO:0006418 and can be removed outright.
