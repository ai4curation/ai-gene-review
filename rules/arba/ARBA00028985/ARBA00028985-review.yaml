review_summary: >-
  The first 10 of the 375 live condition sets were examined. They select aminoacyl-tRNA synthetases,
  RNase III helicases, pseudouridine synthases, terminal nucleotidyltransferases, plant RNA-editing
  factors and queuine tRNA-ribosyltransferases. In the sets for which both counts were obtained, 2794
  of 2794 reviewed matches carry GO:0016070 or a descendant. The other 365 sets were not examined.
action: UNDECIDED
action_rationale: >-
  The rule was sampled, not examined set by set, so no verdict is given. The sampled sets are sound,
  which removes the grounds of the earlier verdict but does not establish that every set is right.
  The counts are from Swiss-Prot, which is also what ARBA learns its rules from, so they show the
  condition sets are coherent rather than giving an independent error rate for unreviewed entries.
annotation_assessments:
- annotation_kind: GO_TERM
  value: GO:0016070
  label: RNA metabolic process
  assessment: UNDECIDED
  correct_examples:
  - P15625
  - P08425
  - P32048
  notes: >-
    UniProtKB release 2026_04: set 1 reviewed matches with a manual-evidence annotation to GO:0016070
    or a descendant include P15625 (Saccharomyces cerevisiae FRS2), P08425 (MSF1) and P32048 (MSK1).
    Per-set counts are in the condition set notes.
corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule should be deprecated because RNA metabolic process is too broad to be informative for
    tRNA synthetases, ribonucleases and helicases.
  correction: >-
    The term is true for those families. A general true term is not a reason to deprecate; at most
    it is a reason to add more specific terms.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - >-
    UniProtKB release 2026_04: in the sets examined the reviewed matches carry GO:0016070 or a descendant;
    counts are in the condition set notes.
- date: '2026-11-10'
  withdrawn_claim: Condition overlap is complete and false positives are virtually guaranteed.
  correction: >-
    The same passage states that no overlap analysis could be run and that no entries were analysed.
    No falsely annotated protein was named.
  error_type: UNEXAMINED_RULE
  evidence:
  - The old file recorded condition_sets and entries as empty lists.
- date: '2026-11-10'
  withdrawn_claim: 357 condition sets exceed the recommended maximum and make the rule unmanageable.
  correction: >-
    The number of sets is not evidence about accuracy, and the maximum cited was the default of an
    analysis tool, given once as 12 and once as 30.
  error_type: SIZE_AS_EVIDENCE
  evidence:
  - 'UniProt ARBA API, ARBA00028985, retrieved 2026-11-09: 375 condition sets.'
- date: '2026-11-10'
  withdrawn_claim: The literature contradicts the rule.
  correction: >-
    The only sources were the review's own notes. Literature on the specific functions of these families
    does not contradict their taking part in RNA metabolism.
  error_type: UNSUPPORTED_SOURCE
  evidence:
  - The old literature_support block cited only rules/arba/ARBA00028985/ARBA00028985-notes.md.
- date: '2026-11-10'
  withdrawn_claim: >-
    tRNA synthetases should be annotated with aminoacyl-tRNA ligase activity terms, not with RNA metabolism.
  correction: >-
    The first is a molecular function and the second a biological process; a protein can carry both.
  error_type: ONTOLOGY_MISREAD
  evidence:
  - 'QuickGO: GO:0016070 aspect biological_process.'
