parsimony:
  assessment: REDUNDANT
  notes: >-
    rule_redundancy.tsv: 293 of 375 sets are matched by a rule asserting a more specific term, and so
    emit nothing. UniProt ARBA API 2026-11-12: 375 sets, none whose conditions are a superset of another's.
    In the sample, sets 1, 6, 7 and 10 are four separate constructions for aminoacyl-tRNA synthetases,
    each a broad class-level signature with a taxon.
go_specificity:
  assessment: TOO_BROAD
  notes: >-
    Every unit in the sample carries a descendant several levels below GO:0016070 (QuickGO): GO:0006418,
    GO:0031054, GO:0001522, GO:0031123, GO:1900865, GO:0006364, GO:0002099.
taxonomic_scope:
  assessment: UNNECESSARY
  notes: >-
    83 of 375 sets carry a taxon. In the sample the taxa do not follow biology: aminoacyl-tRNA synthetase
    class signatures are limited to Saccharomycotina, Pseudomonadota, Archaea and Euteleostomi in turn,
    and the pseudouridine synthase superfamily to Primates, although the enzymes and the process are universal.
    These are artefacts of where the training annotations were; they narrow coverage and make no annotation
    wrong. On set 8 the genus restriction is what keeps a fold-level entry from spreading further.
