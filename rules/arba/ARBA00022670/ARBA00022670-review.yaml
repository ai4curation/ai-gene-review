    sets.
  - >-
    UniProtKB search 2026-11-12: keyword:KW-0720 NOT keyword:KW-0645 returns 0 entries; the same for KW-0482,
    KW-0788, KW-0064, KW-0888, KW-0031, KW-0121 and KW-0224.
parsimony:
  assessment: REDUNDANT
  notes: >-
    UniProt ARBA API, retrieved 2026-11-12: 605 of 1010 condition sets are identical (same conditions,
    same negation) to a set in one of the eight child-keyword rules. UniProt keywords API: KW-0645 is
    the parent of KW-0031, KW-0064, KW-0121, KW-0224, KW-0482, KW-0720, KW-0788 and KW-0888. UniProtKB
    search 2026-11-12: 0 entries carry any of those eight keywords without KW-0645. Within the sample,
    sets for one family also overlap: only 1 reviewed entry matches set 7 without matching set 5, and
    42 match set 2 without matching set 1. No set's conditions are a superset of another set's. keyword_redundancy.tsv:
    612 of 1,010 condition sets are also matched by a rule for a descendant keyword (Metalloprotease 199,
    Thiol protease 172, Serine protease 167, Aminopeptidase 47 and others; a set can be covered by more
    than one). Keywords from different rules stack on a protein, so these sets still emit this keyword;
    they are redundant only if the parent keyword could be derived from the child, which is not established.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    236 of 1010 sets carry a taxon. In the sample only set 10 does (Bacteria, for signal peptidase II),
    which is where that enzyme occurs.
