review_summary: >-
  Accuracy: the first 10 of the 1010 live condition sets were examined. They select ClpP, HslV, leucyl
  aminopeptidase, peptidase M48 and signal peptidase II families, and every reviewed match carries the
  Protease keyword KW-0645 (5150 of 5150, summed over sets). The other 1000 sets were not checked against
  proteins. Meaning and parsimony: the keyword names an enzyme class and the sampled sets select families
  of that class, so the rule is a coherent statement. Its construction is not economical. Protease is
  the parent of eight class keywords (Aminopeptidase, Aspartyl protease, Carboxypeptidase, Dipeptidase,
  Metalloprotease, Serine protease, Thiol protease, Threonine protease), each with its own ARBA rule,
  and 605 of the 1010 sets are word-for-word copies of a set in one of those eight rules. UniProtKB adds
  the parent keyword whenever a child keyword is present (no entry carries any of the eight without Protease),
  so those 605 sets cannot add an annotation.
action: MODIFY
action_rationale: >-
  Nothing in the sample is wrong, and the keyword is meaningful at the level of a UniProt keyword. The
  specific defect is redundancy with the child-keyword rules, measured on the whole rule and not on the
  sample. The verdict is from set identity across rules; the 405 remaining sets were not examined one
  by one, which is why confidence is moderate.
confidence: 0.6
suggested_modifications:
- >-
  Remove the 605 condition sets that are identical to a set of ARBA00022825 (Serine protease, 165 sets),
  ARBA00023049 (Metalloprotease, 196), ARBA00022807 (Thiol protease, 170), ARBA00022750 (Aspartyl protease,
  27), ARBA00022698 (Threonine protease, 7), ARBA00022438 (Aminopeptidase, 47), ARBA00022645 (Carboxypeptidase,
  38) or ARBA00022997 (Dipeptidase, 2); the parent keyword follows from the child. Of the recorded sets
  this applies to sets 1, 2, 3, 5, 6, 7, 9 and 10.
- >-
  For the remaining 405 sets, check whether the family has a known catalytic class and, if so, move the
  set to the class rule. Sets 4 and 8 (HslV) are examples: 430 of the 434 reviewed matches of set 8 carry
  Threonine protease (KW-0888), but neither set is in ARBA00022698.
