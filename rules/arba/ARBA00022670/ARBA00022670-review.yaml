corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule is a single condition set of 502 InterPro domains joined by OR, so any protein with any
    protease-related domain is annotated.
  correction: >-
    The rule is a list of alternative condition sets, and the conditions inside a set are joined by
    AND. The live rule has 1010 sets; 497 require two or three conditions together.
  error_type: CONJUNCTION_IGNORED
  evidence:
  - >-
    UniProt ARBA API, ARBA00022670, modified 2026-07-18, retrieved 2026-11-09: 1010 condition sets
    (513 with one condition, 309 with two, 188 with three); every condition has a single value.
- date: '2026-11-10'
  withdrawn_claim: The rule has no taxonomic restrictions.
  correction: 236 of the 1010 live condition sets include a taxon condition.
  error_type: TAXON_MISREAD
  evidence:
  - >-
    UniProt ARBA API, ARBA00022670: 236 condition sets contain a condition of type taxon, for example
    set 10 (taxon Bacteria).
- date: '2026-11-10'
  withdrawn_claim: >-
    Treating pepsin, trypsin and other mechanistically distinct proteases the same is a design flaw,
    and the classification literature contradicts the rule.
  correction: >-
    All of these enzymes are proteases, which is all the keyword says. That proteases fall into mechanistic
    classes does not make the keyword wrong for any of them. The source given for the contradiction
    was an unattributed sentence labelled as a database, not a retrievable publication.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - >-
    UniProtKB release 2026_04: in the ten sets examined every reviewed match carries keyword KW-0645;
    per-set counts are in the condition set notes.
- date: '2026-11-10'
  withdrawn_claim: >-
    Inactive zymogens and other non-catalytic proteins with protease domains would be annotated, giving
    massive false positives across 2.47 million proteins.
  correction: >-
    No falsely annotated protein was named and no rate was measured. Zymogens are protease precursors
    and carry the Protease keyword in Swiss-Prot.
  error_type: UNEXAMINED_RULE
  evidence:
  - The old file recorded no condition sets and no matched entries.
- date: '2026-11-10'
  withdrawn_claim: The rule is deficient because it assigns a keyword and not GO terms.
  correction: The consequent is a UniProt keyword by design.
  error_type: OTHER
  evidence:
  - 'UniProt ARBA API, ARBA00022670: single annotation, keyword KW-0645 Protease.'
- date: '2026-11-12'
  withdrawn_claim: No verdict is given because the rule was sampled and not examined set by set.
  correction: >-
    The sample is enough to judge meaning (the sets select protease families), and parsimony can be measured
    on the whole rule without reading every set: 605 of 1010 sets duplicate a set of a child-keyword rule.
    The rule should be reduced to the sets that have no class-specific counterpart. (This entry rested
    on the claim that the parent keyword follows automatically from the child. That claim is wrong, and
    both it and the recommendation above to reduce the rule are withdrawn in the next correction.)
  error_type: MEANING_NOT_JUDGED
  evidence:
  - >-
    UniProt ARBA API 2026-11-12: set-for-set comparison of ARBA00022670 with ARBA00022825, ARBA00023049,
    ARBA00022807, ARBA00022750, ARBA00022698, ARBA00022438, ARBA00022645 and ARBA00022997; 605 identical
    sets.
  - >-
    UniProtKB search 2026-11-12: keyword:KW-0720 NOT keyword:KW-0645 returns 0 entries; the same for KW-0482,
    KW-0788, KW-0064, KW-0888, KW-0031, KW-0121 and KW-0224.
- date: '2026-11-15'
  withdrawn_claim: >-
    Its construction is not economical: 605 of 1010 sets are copies of a set in a child-keyword rule,
    and because UniProtKB adds the parent keyword whenever a child keyword is present those sets cannot
    add an annotation; remove them (MODIFY, 0.6).
  correction: >-
    That no entry carries a class keyword without Protease does not show the parent is added automatically:
    it is what one expects when a rule asserts each keyword. The evidence tags show the latter, so the
    shared sets are doing the work and removing them would remove the keyword.
  error_type: OTHER
  evidence:
  - 'UniProtKB 2026_04, 2026-11-15: of 500 unreviewed entries carrying KW-0720 (Serine protease), all
    carry KW-0645 (Protease) with evidence of its own, an ARBA or other rule in nearly every case; none
    carries it with a derived tag.'
  - A0A8Q3WL70 carries Serine protease and Protease, each with an ARBA rule as its only evidence.
parsimony:
  assessment: ACCEPTABLE
  notes: >-
    UniProt ARBA API, retrieved 2026-11-12: 605 of 1010 condition sets are identical (same conditions,
    same negation) to a set in one of the eight child-keyword rules. UniProt keywords API: KW-0645 is
    the parent of KW-0031, KW-0064, KW-0121, KW-0224, KW-0482, KW-0720, KW-0788 and KW-0888. UniProtKB
    search 2026-11-12: 0 entries carry any of those eight keywords without KW-0645. Within the sample,
    sets for one family also overlap: only 1 reviewed entry matches set 7 without matching set 5, and
    42 match set 2 without matching set 1. No set's conditions are a superset of another set's. keyword_redundancy.tsv:
    612 of 1,010 condition sets are also matched by a rule for a descendant keyword (Metalloprotease 199,
    Thiol protease 172, Serine protease 167, Aminopeptidase 47 and others; a set can be covered by more
    than one). Keywords from different rules stack on a protein, and UniProt does not derive a parent
    keyword from a child: in samples of 500 unreviewed entries each for Serine protease, Serine/threonine-protein
    kinase and Kinase (UniProtKB 2026_04, 2026-11-15) the parent keyword always carried its own rule evidence
    (ARBA, PROSITE-ProRule, HAMAP, PIRNR or RuleBase). So these sets do work: without them the proteins
    would lose this keyword.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    236 of 1010 sets carry a taxon. In the sample only set 10 does (Bacteria, for signal peptidase II),
    which is where that enzyme occurs.
