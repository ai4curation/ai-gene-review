    so meaning is settled by the label and the family sample; the scan of all 1,010 sets is what supports
    accuracy. Overlap with child-keyword rules is in keyword_redundancy.tsv.
  sets_examined_for_meaning: 10
  sets_covered_by_more_specific_rule: 612
