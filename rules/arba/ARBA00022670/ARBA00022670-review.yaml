review_summary: >-
  The first 10 of the 1010 live condition sets were examined. They select ClpP, HslV, leucyl aminopeptidase,
  peptidase M48 and signal peptidase II families, and every reviewed match carries the Protease keyword
  (5150 of 5150, summed over sets). The other 1000 sets were not examined.
action: UNDECIDED
action_rationale: >-
  The rule was sampled, not examined set by set, so no verdict is given. The sampled sets are sound,
  which removes the grounds of the earlier verdict but does not establish that every set is right.
  The counts are from Swiss-Prot, which is also what ARBA learns its rules from, so they show the
  condition sets are coherent rather than giving an independent error rate for unreviewed entries.
annotation_assessments:
- annotation_kind: KEYWORD
  value: KW-0645
  label: Protease
  assessment: UNDECIDED
  correct_examples:
  - Q16740
  - P0A6G7
  - P38624
  notes: >-
    UniProtKB release 2026_04, reviewed entries matching a set and carrying KW-0645: set 1, Q16740
    (human CLPP) and P0A6G7 (Escherichia coli clpP); set 4, P38624 (Saccharomyces cerevisiae PRE3).
    Per-set counts are in the condition set notes.
corrections:
- date: '2026-11-10'
  withdrawn_claim: >-
    The rule is a single condition set of 502 InterPro domains joined by OR, so any protein with any
    protease-related domain is annotated.
  correction: >-
    The rule is a list of alternative condition sets, and the conditions inside a set are joined by
    AND. The live rule has 1010 sets; 497 require two or three conditions together.
  error_type: CONJUNCTION_IGNORED
  evidence:
  - >-
    UniProt ARBA API, ARBA00022670, modified 2026-07-18, retrieved 2026-11-09: 1010 condition sets
    (513 with one condition, 309 with two, 188 with three); every condition has a single value.
- date: '2026-11-10'
  withdrawn_claim: The rule has no taxonomic restrictions.
  correction: 236 of the 1010 live condition sets include a taxon condition.
  error_type: TAXON_MISREAD
  evidence:
  - >-
    UniProt ARBA API, ARBA00022670: 236 condition sets contain a condition of type taxon, for example
    set 10 (taxon Bacteria).
- date: '2026-11-10'
  withdrawn_claim: >-
    Treating pepsin, trypsin and other mechanistically distinct proteases the same is a design flaw,
    and the classification literature contradicts the rule.
  correction: >-
    All of these enzymes are proteases, which is all the keyword says. That proteases fall into mechanistic
    classes does not make the keyword wrong for any of them. The source given for the contradiction
    was an unattributed sentence labelled as a database, not a retrievable publication.
  error_type: GENERAL_IS_NOT_WRONG
  evidence:
  - >-
    UniProtKB release 2026_04: in the ten sets examined every reviewed match carries keyword KW-0645;
    per-set counts are in the condition set notes.
- date: '2026-11-10'
  withdrawn_claim: >-
    Inactive zymogens and other non-catalytic proteins with protease domains would be annotated, giving
    massive false positives across 2.47 million proteins.
  correction: >-
    No falsely annotated protein was named and no rate was measured. Zymogens are protease precursors
    and carry the Protease keyword in Swiss-Prot.
  error_type: UNEXAMINED_RULE
  evidence:
  - The old file recorded no condition sets and no matched entries.
- date: '2026-11-10'
  withdrawn_claim: The rule is deficient because it assigns a keyword and not GO terms.
  correction: The consequent is a UniProt keyword by design.
  error_type: OTHER
  evidence:
  - 'UniProt ARBA API, ARBA00022670: single annotation, keyword KW-0645 Protease.'
