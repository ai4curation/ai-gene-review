review_summary: >-
  The live rule has 88 condition sets. Three (sets 4, 5 and 6) were read for the identity of their
  InterPro families: gamma-tubulin complex component proteins, dynein regulatory complex proteins
  and Rubisco accumulation factor 1. None was checked against annotated proteins, and 85 sets were
  not examined. No false positive has been identified. No verdict is given.
action: UNDECIDED
action_rationale: The rule was not examined set by set, and nothing verified shows a wrong annotation.
suggested_modifications:
- Examine the condition sets against curated annotations of their Swiss-Prot members.
annotation_assessments:
- annotation_kind: GO_TERM
  value: GO:0065003
  label: protein-containing complex assembly
  assessment: UNDECIDED
  notes: >-
    InterPro API names of the families in sets 4-6: IPR007259 Gamma-tubulin complex component protein;
    IPR029440 Dynein regulatory complex protein 1, C-terminal; IPR039750 Dynein regulatory complex
    protein; IPR037494 Rubisco accumulation factor 1. No matched protein was checked.
