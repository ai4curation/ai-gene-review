review_summary: >-
  Accuracy: ten of the 88 served condition sets were checked against curated annotations of their Swiss-Prot
  members (sets 4, 5, 6, 11, 12, 24, 25, 32, 53 and 85). In each a reviewed member carries a curated descendant
  of GO:0065003 (protein-containing complex assembly), so no false positive was found; the other 78 sets
  were not checked. Meaning and parsimony: the term covers three different kinds of thing. Dedicated assembly
  factors (Rubisco accumulation factor 1, SdhE, SCO1/SCO2, NDUFAF5) and structural subunits (gamma-tubulin
  complex components, septins, dynein regulatory complex protein 1) each carry a named assembly term for
  their complex. Metabolic enzymes such as serine hydroxymethyltransferase, threonine dehydrogenase and
  fumarase are in the rule only because curators recorded that they form tetramers. Every unit examined
  has a more specific curated term, and rule_redundancy.tsv finds 38 of 88 sets already matched by a rule
  asserting one.
action: SPLIT
action_rationale: >-
  The consequent says only that a protein takes part in forming some complex. Each unit examined has a
  term that names the complex or the oligomeric state, most with experimental evidence, so the rule should
  be split toward those terms. The verdict rests on a sample of ten sets (three recorded by the first
  pass, seven added for families the signature label names); confidence reflects that.
suggested_modifications:
- >-
  Drop the sets already matched by rules asserting a more specific term (38 of 88 in rule_redundancy.tsv;
  covering terms GO:0051262 protein tetramerization, GO:0051259 protein complex oligomerization, GO:0022618
  protein-RNA complex assembly, GO:0051258 protein polymerization, GO:0007020 microtubule nucleation).
  Of the sets recorded here these are 4, 11, 12, 24, 25, 53 and 85.
- >-
  Move the remaining sets to the term of their unit: set 5 to GO:0070286 (axonemal dynein complex assembly);
  set 6 to GO:0110102 (ribulose bisphosphate carboxylase complex assembly); and where the covering rule
  is less specific than the curated term, set 12 to GO:0033617 (mitochondrial respiratory chain complex
  IV assembly), set 53 to GO:0034552 (respiratory chain complex II assembly), set 85 to GO:0032981 (mitochondrial
  respiratory chain complex I assembly), set 24 to GO:0000921 (septin ring assembly).
- >-
  For the tetrameric enzyme sets (11, 25, 32) decide whether an oligomerization term should be propagated
  at all; if so it is the tetramerization term, not the umbrella, and it should not stand in for the enzymes
  metabolic process terms.
- Assign the 78 sets not examined here to units in the same way.
