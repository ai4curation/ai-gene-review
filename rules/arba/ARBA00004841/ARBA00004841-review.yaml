parsimony:
  assessment: ACCEPTABLE
  notes: >-
    Two sets whose reviewed matches coincide (12 and 12, union 12). In UniProtKB set 1 matches 4029 entries
    and set 2 matches 3386, so set 2 may add little, but this was not measured on unreviewed entries.
    In set 1, IPR000863 (Sulfotransferase domain) adds nothing to IPR021930, whose Swiss-Prot members
    all carry it.
