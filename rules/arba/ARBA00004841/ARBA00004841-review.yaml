      label: Chordata
      negated: false
    notes: 'Swiss-Prot entries matching this set (2026-11-09): 12. 12 carry the PATHWAY comment "Glycan
      metabolism; heparin biosynthesis". UniProtKB entries matching: 3386.'
  go_annotations: []
  entries: []
  reviewed_protein_count: 0
  unreviewed_protein_count: 4061
  created_date: '2020-05-12'
  modified_date: '2026-07-18'
  retrieved_date: '2026-11-09'
  source_condition_set_count: 2
review_summary: >-
  Accuracy: both live condition sets were checked against Swiss-Prot on 2026-11-09. Each matches 12 reviewed
  entries, all NDST family members (human P52848 NDST1, P52849 NDST2, O95803 NDST3, Q9H3R1 NDST4), and
  all 12 carry the pathway comment. TrEMBL matches were counted but not inspected. Meaning and parsimony:
  the two sets select one unit, the bifunctional heparan sulfate N-deacetylase/N-sulfotransferases, and
  the pathway comment is the one Swiss-Prot gives that family, so the rule is coherent. The reviewed matches
  of the two sets are the same 12 entries; the sets differ only in the signature used and in their UniProtKB
  reach (4029 and 3386 entries).
action: ACCEPT
action_rationale: >-
  The comment is correct for every reviewed match and both sets describe the same enzyme family. Two alternative
  signatures for one family is modest redundancy, not a defect.
suggested_modifications: []
biological_meaning:
  assessment: COHERENT
  notes: >-
    One unit, the NDST family. The consequent is a pathway comment, not a GO term, so rule_redundancy.tsv
    has no row for this rule. rules/arba/_interpro2go.txt maps IPR021930 (Heparan sulphate-N-deacetylase,
    deacetylase domain) to GO:0015016 (heparan sulfate N-sulfotransferase activity), which confirms that
    the signature of set 1 names this family.
  sets_examined_for_meaning: 2
biological_units:
- name: Heparan sulfate N-deacetylase/N-sulfotransferase (NDST1-4)
  unit_kind: FAMILY
  condition_sets:
  - 1
  - 2
  example_proteins:
  - P52848
  - P52849
  - O95803
  - Q9H3R1
  evidence:
  - >-
    UniProtKB query for set 1 and for set 2 with reviewed:true (2026-11-12): the same 12 entries
  - >-
    rules/arba/_interpro2go.txt: InterPro:IPR021930 > GO:0015016 heparan sulfate N-sulfotransferase activity
  notes: No GO consequent; the unit is judged against the pathway comment.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    Both sets are restricted to Chordata. Heparin proper is chiefly a vertebrate mast-cell product, so
    a chordate restriction on a heparin biosynthesis comment follows the biology and is not only a reflection
    of where the curated entries are.
