id: ARBA00004841
description: Assigns the pathway comment "Glycan metabolism; heparin biosynthesis" to chordate 
  proteins that carry both the sulfotransferase domain (IPR000863) and the heparan sulphate 
  N-deacetylase domain (IPR021930), or CATH FunFam 3.40.50.300:FF:000176. Both sets identify the 
  bifunctional heparan sulfate N-deacetylase/N-sulfotransferases (NDST1-4).
status: COMPLETE
rule_type: ARBA
