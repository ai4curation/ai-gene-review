review_summary: >-
  Accuracy: every one of the 2,158 live condition sets was put through one check in this pass, namely
  whether its Swiss-Prot matches carry the keyword (UniProtKB queries, November 2026); 35 sets were also
  read in detail and are recorded. In 2,157 sets every Swiss-Prot match carries KW-0560 Oxidoreductase:
  summed over sets, 76,705 of 76,705 matches. The remaining set, 1969, matches no UniProtKB entry at all.
  No protein wrongly given the keyword was found; the earlier report on the copper chaperone for superoxide
  dismutase could not be reproduced. Meaning and parsimony: the keyword names EC class 1, and the sets
  select oxidoreductase families: in the sample the reviewed matches are dehydrogenases acting on CH-OH
  groups (10 sets), oxygenases and oxidases (7) and enzymes of nine other EC 1 subclasses (16). One sampled
  set selects the RuBisCO large subunit, an EC 4 enzyme that Swiss-Prot also labels Oxidoreductase for
  its oxygenase reaction. That is the level at which the keyword exists, so the rule is coherent. One
  set is idle; none duplicates or contains another.
action: MODIFY
action_rationale: >-
  On reviewed evidence the rule does what its label says in every set that matches anything, and its size
  is the size of the enzyme class. The only defect found is a set that cannot fire, which should be removed.
  Confidence is modest because the check on 2,157 sets is the reviewed entries' own keyword, not an inspection
  of the 7.2 million TrEMBL entries the rule annotates.
confidence: 0.6
suggested_modifications:
- >-
  Remove set 1969 (FunFam 3.40.50.80:FF:000046 AND Candida/Lodderomyces clade): no UniProtKB entry, reviewed
  or unreviewed, matches the conjunction (UniProtKB query, November 2026).
biological_meaning:
  assessment: COHERENT
  notes: >-
    A keyword rule: the consequent is an enzyme class, and the question is whether the sets select members
    of that class. In a sample of 30 sets (drawn with a seeded pseudo-random generator, Python random.Random(rule
    id).sample over the live set numbers) plus the four sets the first pass recorded, every set selects
    a family whose reviewed members all carry the keyword, and the same holds across all 2,157 sets that
    match Swiss-Prot entries. UniProt has more specific keywords under Oxidoreductase (for example Monooxygenase,
    Dioxygenase, Peroxidase), but they are assigned alongside it, not in its place, so the class-level
    keyword does not hide a better label. projects/ARBA_REVIEW/rule_redundancy.tsv covers GO rules only
    and has no row for this rule.
  sets_examined_for_meaning: 35
  sets_covered_by_more_specific_rule: 307
