parsimony:
  assessment: ACCEPTABLE
  notes: >-
    2,158 alternative sets: 1,606 with one signature, 332 with two, 220 with three; 279 carry a taxon.
    One set (1969) matches no UniProtKB entry and does no work; that single idle set is the only parsimony
    defect found. Comparing every pair of sets in the live rule, none is a duplicate of another and none
    contains another's signatures with the same or no taxon (0 of 2,158). Every other set matches Swiss-Prot
    entries (median 9). The number of sets reflects the number of oxidoreductase families, not excess.
    This is not a GO rule, so rule_redundancy.tsv and InterPro2GO do not apply. keyword_redundancy.tsv:
    307 of 2,158 condition sets are also matched by a rule for a descendant keyword (Monooxygenase 163,
    Dioxygenase 108, Peroxidase 36, Hydrogen peroxide 8; a set can be covered by more than one). Keywords
    from different rules stack on a protein, so these sets still emit this keyword; they are redundant
    only if the parent keyword could be derived from the child, which is not established.
taxonomic_scope:
  assessment: APPROPRIATE
  notes: >-
    1,879 of 2,158 sets have no taxon. Eight of the 35 recorded sets carry one (Pseudomonadati, Gammaproteobacteria,
    Viridiplantae, Vertebrata, rosids, Nematoda, Methanobacteria, Candida/Lodderomyces clade). In sets
    2 and 4 the taxon is what keeps a broad superfamily signature precise, as the first pass showed; in
    set 1969 the taxon leaves nothing to match. Taxon scope was otherwise judged on the sample only.
