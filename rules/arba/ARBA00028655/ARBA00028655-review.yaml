      this rule are wrong-branch rather than merely imprecise.
    supporting_text: "**GO:0006661 does not appear in that list.**"
- id: PMID:30617162
  title: 'Understanding phosphoinositides: rare, dynamic, and essential membrane phospholipids.'
  findings:
  - statement: Phosphoinositides are reversibly phosphorylated derivatives of PI; kinases add
      and phosphatases remove headgroup phosphates, a process chemically distinct from
      assembling PI from CDP-DAG and myo-inositol.
- id: PMID:32117988
  title: 'CDP-Diacylglycerol Synthases (CDS): Gateway to Phosphatidylinositol and Cardiolipin
    Synthesis.'
  findings:
  - statement: De novo PI synthesis proceeds via CDS1/CDS2 (phosphatidic acid + CTP ->
      CDP-diacylglycerol) followed by PI synthase; CDP-DAG also feeds phosphatidylglycerol and
      cardiolipin synthesis.
- id: PMID:32677674
  title: 'Class IA PI3K regulatory subunits: p110-independent roles and structures.'
  findings:
  - statement: p85 regulatory subunits have no lipid-kinase catalytic activity; they stabilise
      and restrain the p110 catalytic subunit and recruit the holoenzyme to receptors -
      relevant to condition set 15.
- id: PMID:18524850
  title: Sequential actions of myotubularin lipid phosphatases regulate endosomal PI(3)P and
    growth factor receptor trafficking.
  findings:
  - statement: Myotubularins act as endosomal phosphoinositide 3-phosphatases regulating PI3P
      levels, i.e. phosphoinositide turnover rather than PI biosynthesis - relevant to
      condition sets 1, 8 and 21.
- id: PMID:32156170
  title: Biosynthesis and biology of mammalian GPI-anchored proteins.
  findings:
  - statement: GPI-anchor biosynthesis begins by modifying pre-existing PI (PIGL, PIGN/PIGO,
      PGAP5/MPPE1 all act on GPI intermediates), so these enzymes consume rather than
      synthesise PI - relevant to condition sets 12, 22, 23 and 24.
- id: PMID:10642602
  title: Deficiency of dolichol-phosphate-mannose synthase-1 causes congenital disorder of
    glycosylation type Ie.
  findings:
  - statement: DPM1 deficiency reduces dolichol-phosphate-mannose synthase activity and impairs
      N-glycosylation and GPI-anchored protein production; DPM1's reaction is GDP-mannose +
      dolichol-phosphate -> Dol-P-Man, with no role in forming PI - relevant to condition set 25.
