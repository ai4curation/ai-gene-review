id: ARBA00028655
description: >-
  Assigns GO:0006661 "phosphatidylinositol biosynthetic process" to proteins matching any of
  25 alternative condition sets built from InterPro entries, CATH FunFams and taxon
  constraints. Only two of the 25 sets (CS18, CS19) identify the enzyme that actually makes
  phosphatidylinositol - CDP-diacylglycerol--inositol 3-phosphatidyltransferase (CDIPT/PIS,
  EC 2.7.8.11). The remaining 23 sets capture phosphoinositide kinases, phosphoinositide
  phosphatases, non-catalytic PI3K/VPS34 regulatory subunits, GPI-anchor pathway enzymes,
  DPM1, and two promiscuous structural folds - all of which act on, consume or are merely
  adjacent to PI rather than synthesising it.
status: COMPLETE
rule_type: ARBA
rule:
  rule_id: ARBA00028655
  condition_sets:
  - number: 1
    conditions:
    - condition_type: INTERPRO
      value: IPR000387
      curie: InterPro:IPR000387
      label: "Tyrosine-specific protein phosphatases domain"
      interpro_type: DOMAIN
      negated: false
    - condition_type: INTERPRO
      value: IPR010569
      curie: InterPro:IPR010569
      label: "Myotubularin-like, phosphatase domain"
      interpro_type: DOMAIN
      negated: false
    - condition_type: TAXON
      value: Primates
      curie: NCBITaxon:9443
      label: "Primates"
      negated: false
    notes: "INCORRECT. IPR000387 (PTP-like domain) + IPR010569 (myotubularin phosphatase domain) identifies the myotubularin family (MTM1, MTMR1-4, MTMR7). These are phosphoinositide 3-phosphatases: PI3P -> PI and PI(3,5)P2 -> PI5P. PI is a dephosphorylation product of a turnover reaction, not a de novo biosynthetic step; the deep research calls this verdict 'Outright incorrect'. Better BP: GO:0046856 phosphatidylinositol dephosphorylation. The Primates taxon restriction is an annotation-bias artifact - myotubularins are pan-eukaryotic."
  - number: 2
    conditions:
    - condition_type: INTERPRO
      value: IPR002013
      curie: InterPro:IPR002013
      label: "SAC domain"
      interpro_type: DOMAIN
      negated: false
    - condition_type: TAXON
      value: Haplorrhini
      curie: NCBITaxon:376913
      label: "Haplorrhini"
      negated: false
    notes: "INCORRECT. IPR002013 (SAC domain) captures SACM1L/Sac1, SYNJ1/SYNJ2, FIG4 and INPP5F - all phosphoinositide phosphatases (e.g. Sac1: PI4P -> PI). Same dephosphorylation-is-not-biosynthesis error as CS1. This condition set is a major contributor to the observed false positives (SAC-domain proteins dominate the human hit set). Better BP: GO:0046856. Haplorrhini restriction is arbitrary."
  - number: 3
    conditions:
    - condition_type: FUNFAM
      value: 1.10.1070.11:FF:000002
      curie: CATH.FunFam:1.10.1070.11:FF:000002
      label: "Phosphatidylinositol 3-kinase catalytic subunit type 3"
      negated: false
    - condition_type: TAXON
      value: Eukaryota
      curie: NCBITaxon:2759
      label: "Eukaryota"
      negated: false
    notes: "INCORRECT. PIK3C3/VPS34 class III PI3K FunFam. VPS34 phosphorylates pre-existing PI to PI3P; it consumes PI rather than making it. Better BP: GO:0036092 phosphatidylinositol-3-phosphate biosynthetic process (or GO:0046854 phosphatidylinositol phosphate biosynthetic process), which is a SIBLING of GO:0006661, not a descendant."
  - number: 4
    conditions:
    - condition_type: FUNFAM
      value: 1.10.1070.11:FF:000006
      curie: CATH.FunFam:1.10.1070.11:FF:000006
