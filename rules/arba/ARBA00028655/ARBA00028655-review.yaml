references:
- id: PMID:30617162
  title: 'Understanding phosphoinositides: rare, dynamic, and essential membrane phospholipids.'
  findings:
  - statement: Phosphoinositides are reversibly phosphorylated derivatives of PI; kinases add and 
      phosphatases remove headgroup phosphates, a process chemically distinct from assembling PI 
      from CDP-DAG and myo-inositol.
- id: PMID:32117988
  title: 'CDP-Diacylglycerol Synthases (CDS): Gateway to Phosphatidylinositol and Cardiolipin Synthesis.'
  findings:
  - statement: De novo PI synthesis proceeds via CDS1/CDS2 (phosphatidic acid + CTP -> 
      CDP-diacylglycerol) followed by PI synthase; CDP-DAG also feeds phosphatidylglycerol and 
      cardiolipin synthesis.
- id: PMID:18524850
  title: Sequential actions of myotubularin lipid phosphatases regulate endosomal PI(3)P and growth 
    factor receptor trafficking.
  findings:
  - statement: Myotubularins act as endosomal phosphoinositide 3-phosphatases that regulate PI3P 
      levels. Relevant to condition sets 1, 3 and 11, which select myotubularins.
