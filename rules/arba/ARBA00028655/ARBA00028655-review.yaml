      label: "Euarchontoglires"
      negated: false
    notes: "INCORRECT. PIGO (GPI ethanolamine phosphate transferase 3), Euarchontoglires. Modifies GPI precursors. Better BP: GO:0006506."
  - number: 24
    conditions:
    - condition_type: FUNFAM
      value: 3.60.21.10:FF:000022
      curie: CATH.FunFam:3.60.21.10:FF:000022
      label: "Putative metallophosphoesterase 1"
      negated: false
    notes: "INCORRECT. PGAP5/MPPE1 metallophosphoesterase; removes ethanolamine phosphate from Man2 during GPI remodelling. Better BP: GO:0006506 GPI anchor biosynthetic process (or a GPI-remodelling term). No taxon restriction."
  - number: 25
    conditions:
    - condition_type: FUNFAM
      value: 3.90.550.10:FF:000036
      curie: CATH.FunFam:3.90.550.10:FF:000036
      label: "Dolichol-phosphate mannosyltransferase subunit 1"
      negated: false
    notes: "INCORRECT - THE SET FLAGGED BY CURATORS. FunFam 3.90.550.10:FF:000036 'Dolichol-phosphate mannosyltransferase subunit 1' (DPM1). DPM1 makes Dol-P-Man from GDP-mannose and dolichol-phosphate; it has no role in forming PI. This is the route by which S. pombe dpm1 (SPAC31G5.16c, UniProt O14466) received GO:0006661, the annotation questioned in geneontology/go-annotation issue #5835. Correct BP: GO:0180047 dolichol phosphate mannose biosynthetic process (already annotated for O14466), with GO:0006506 by pathway participation. The deep research states this is 'not supportable'."
