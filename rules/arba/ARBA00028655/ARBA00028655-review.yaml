review_summary: >-
  ARBA00028655 is a wrong-branch, near-total-false-positive rule. GO:0006661 is effectively a
  leaf term denoting formation of the unphosphorylated phosphatidylinositol molecule itself
  (CDP-diacylglycerol + myo-inositol -> PI + CMP, EC 2.7.8.11). Only condition sets 18 and 19
  (CATH FunFams 1.20.120.1760:FF:000003 in Vertebrata and :FF:000021 in Fungi, both
  CDIPT/PIS) identify that enzyme. The other 23 condition sets identify PI3K/PI4K/PIP5K/PIP4K
  catalytic subunits (11 sets), phosphoinositide phosphatases (4 sets), GPI-anchor and
  dolichol-phosphate-mannose pathway enzymes (5 sets: PIGN, PIGL, PIGO, PGAP5/MPPE1, DPM1),
  and two non-catalytic regulatory subunits (PIK3R1/p85-alpha, UVRAG). Crucially, the
  phosphoinositide branch is a SIBLING of GO:0006661, not a descendant: the QuickGO ancestor
  closure of GO:0046854 "phosphatidylinositol phosphate biosynthetic process" (checked
  2026-08-15) does not contain GO:0006661 - the two terms first meet at GO:0046474
  glycerophospholipid biosynthetic process. So these are not over-broad annotations a curator
  could refine downward; they are simply in the wrong subtree. A QuickGO census on 2026-08-15
  found 4,782 GO:0006661 / ECO:0000256 / GO_REF:0000117 annotations attributed to
  ARBA00028655; in a stratified sample of 1,000 accessions only 8 (0.8%) were CDIPT/PIS,
  while 63.8% were myotubularin-family phosphoinositide 3-phosphatases and one hit was
  cytochrome b-c1 complex subunit 9 (UQCR10), a pure domain-promiscuity artifact. In the
  human subset (169 annotations, enumerated exhaustively) only 3 (1.8%) are PI synthase.
  Taxon constraints are biologically unmotivated (Homo-only INPPL1, Mus-only PIP5K1C,
  Catarrhini-only "Kinase"), and eight sets - including the DPM1 set that
  produced the S. pombe dpm1 annotation queried in geneontology/go-annotation#5835 - carry no
  taxon constraint at all. The rule is also incomplete in the one direction that would help:
  no condition set targets CDS1/CDS2, the other family legitimately part of de novo PI
  biosynthesis.
action: SPLIT
action_rationale: >-
  SPLIT rather than DEPRECATE, because condition sets 18 and 19 are correct and worth keeping:
  CDIPT/PIS is precisely the family GO:0006661 exists to describe, and a PIS-only rule would
  be a good rule. Everything else should be dissolved into the branch it actually belongs to -
  GO:0046854 (or a product-specific child such as GO:0036092) for the kinases, GO:0046856
  phosphatidylinositol dephosphorylation for the phosphatases, GO:0006506 GPI anchor
  biosynthetic process for the GPI enzymes, and GO:0180047 dolichol phosphate mannose
  biosynthetic process for DPM1 - with the non-catalytic (CS15 PIK3R1/p85, CS20 UVRAG) and
  fold-promiscuous (CS8 PH-domain superfamily, CS21 Zn-finger RING/FYVE/PHD superfamily) sets
  deleted outright rather than retargeted. If the maintainers prefer not to split, DEPRECATE
  is the correct fallback, since retaining the rule in its current form means retaining ~4,740
  wrong-branch annotations to salvage ~40 correct ones. The ~4,740 existing IEA annotations
  not derived from CS18/CS19 should be retracted. The confidence value below is confidence in
  this recommendation.
suggested_modifications:
- 'RETAIN GO:0006661 for CS18 (CATH FunFam 1.20.120.1760:FF:000003, Vertebrata) - CDIPT/PIS,
  the enzyme that forms PI. Correct as-is.'
- 'RETAIN GO:0006661 for CS19 (CATH FunFam 1.20.120.1760:FF:000021, Fungi) - PIS. Correct
  as-is. Consider merging CS18 and CS19 into a single PIS rule and relaxing the taxon to
  Eukaryota (or removing it), since the CDP-DAG/PIS route is pan-eukaryotic and PI synthase
  activity also exists outside Eukaryota.'
- 'ADD a condition set for CDS1/CDS2 (CDP-diacylglycerol synthases), currently absent: these
  supply the committed CDP-DAG precursor and are the only other family the literature
  regards as part of de novo PI biosynthesis.'
- 'RETIRE GO:0006661 from CS3, CS4, CS5, CS6, CS7, CS9, CS10, CS11, CS13, CS14 and CS17
  (PI3K class I/II/III, PI4K, PIP5K, PIP4K catalytic FunFams) and replace with GO:0046854
  phosphatidylinositol phosphate biosynthetic process; use the product-specific child where
  the FunFam pins the product, e.g. GO:0036092 phosphatidylinositol-3-phosphate biosynthetic
  process for CS3 (PIK3C3/VPS34).'
- 'RETIRE GO:0006661 from CS1 (IPR000387 + IPR010569 myotubularins), CS2 (IPR002013 SAC
  domain: SACM1L, SYNJ1/2, FIG4, INPP5F), CS16 (INPPL1/INPP5D) and CS21 (MTMR4) and replace
  with GO:0046856 phosphatidylinositol dephosphorylation. Producing PI by dephosphorylation
  is turnover, not biosynthesis.'
- 'RETIRE GO:0006661 from CS12 (PIGN), CS22 (PIGL), CS23 (PIGO) and CS24 (PGAP5/MPPE1) and
  replace with GO:0006506 GPI anchor biosynthetic process. These enzymes modify GPI
  intermediates that already contain PI.'
- 'RETIRE GO:0006661 from CS25 (CATH FunFam 3.90.550.10:FF:000036, DPM1) and replace with
  GO:0180047 dolichol phosphate mannose biosynthetic process (GO:0006506 additionally by
  pathway participation). This is the condition set that produced the S. pombe dpm1
  (SPAC31G5.16c / O14466) annotation queried in geneontology/go-annotation#5835; O14466
  already carries GO:0180047, GO:0006488, GO:0006506 and GO:0035269 and no GO:0006661.'
- 'DELETE CS15 (PIK3R1/p85-alpha regulatory subunit FunFams, Rodentia) and CS20 (UVRAG
  FunFam, Euteleostomi) entirely. Both proteins are non-catalytic; no biosynthetic BP term
  applies. At most p85 warrants the molecular function GO:0035014 phosphatidylinositol
  3-kinase regulator activity.'
- 'DELETE CS8 (CATH FunFam 2.30.29.30:FF:000038). Despite its "Myotubularin 1, isoform CRA_a"
  label this is a PH-domain-superfamily FunFam and in practice captures unrelated PH-domain
  proteins - PLEKHA3/FAPP1, PLEKHA8/FAPP2, PITPNM1 and PITPNM2 all appear in the emitted
  annotation set. A bare PH domain cannot support any catalytic BP term.'
- 'DELETE or heavily constrain CS9 (CATH FunFam 3.30.470.160:FF:000001, labelled only
  "Kinase", Catarrhini) and CS21 (CATH FunFam 3.30.40.10:FF:000073, in the promiscuous
  Zn-finger RING/FYVE/PHD superfamily, Mammalia). An uninformative label or a promiscuous
  small structural fold is not a safe sole condition.'
- 'REVIEW all taxon constraints. Homo-only (CS16), Mus-only (CS10), Catarrhini-only (CS9),
  Primates-only (CS1, CS7), Haplorrhini-only (CS2, CS8), Glires (CS14), Rodentia (CS15) and
  Eutheria/Euarchontoglires (CS22, CS23) restrictions on pan-eukaryotic enzyme families are
  annotation-bias artifacts, while CS4, CS5, CS6, CS11, CS12, CS13, CS24 and CS25 have no
  constraint at all and therefore fire across all of UniProt. The Viridiplantae restriction
  on CS17 is not in this category - plants have real PI4-kinase beta enzymes - so that set
  should be corrected on branch grounds rather than taxon grounds.'
- 'RETRACT the existing GO:0006661 IEA annotations attributed to this rule that do not derive
  from CS18/CS19 (approximately 4,740 of 4,782 as of 2026-08-15).'
parsimony:
  assessment: OVERLY_COMPLEX
  notes: >-
    25 condition sets for a single, effectively-leaf GO term is far beyond the point at which
    a rule can be reasoned about, and the complexity is not the good kind: it does not
    represent genuine biological diversity among PI-synthesising enzymes, it represents the
    accretion of every domain family that happens to co-occur with the string
    "phosphatidylinositol" in protein names. The one biologically coherent concept in the
    rule - PI synthase - is covered by just two sets (CS18, CS19), and those two are
    near-duplicates differing only in taxon (Vertebrata vs Fungi) and could be merged.
    Meanwhile the class IA/IB PI3K catalytic subunit is expressed four separate times (CS4,
    CS5, CS13, and partly CS3) and the class II PI3K twice (CS6, CS14), each as a different
    trio of FunFams from the same three CATH superfamilies (1.10.1070.11, 1.25.40.70,
    2.60.40.150). A parsimonious version of the correct part of this rule would be a single
    condition set on the CDIPT/PIS FunFam or on the corresponding InterPro PIS family entry.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-analysis.md
    supporting_text: "Summary: **2 correct (CS18, CS19)**; 15 kinase/phosphatase wrong-branch; 2 non-catalytic"
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-analysis.md
    supporting_text: "manages to be both massively over-inclusive and incomplete."
literature_support:
  assessment: CONTRADICTED
  notes: >-
    The commissioned deep research (Falcon / Edison Scientific Literature, run 2026-08-15)
    directly contradicts the rule for 23 of its 25 condition sets. Its executive conclusion is
    that GO:0006661 is not a correct blanket annotation for these families, and its per-family
    verdict table assigns "Outright incorrect" - explicitly defined there as a chemically
    different process rather than merely a less precise term - to every PI3K/PI4K/PIP5K/PIP4K
    family, every phosphoinositide phosphatase family (myotubularins, SACM1L/Sac1,
    synaptojanins, INPP5D), every GPI-pathway enzyme (PIGL, PIGN/PIGO, PGAP5/MPPE1), DPM1,
    UVRAG and PIK3R1/p85. The only families it endorses are CDIPT/PIS (the direct PI-forming
    enzyme, matching CS18 and CS19) and CDS1/CDS2 as precursor suppliers - and CDS1/CDS2 are
    not among the rule's conditions. The report is explicit that annotating DPM1 to GO:0006661
    is not supportable, which is exactly the case raised by curators in
    geneontology/go-annotation#5835. Note two honest limits of this evidence: the report found
    no retrievable GO Consortium adjudication of ARBA00028655 itself, so no formal Consortium
    ruling should be claimed; and it refers to GO:0046854 by its superseded label
    "phosphatidylinositol phosphorylation" (the current primary label, verified in QuickGO on
    2026-08-15, is "phosphatidylinositol phosphate biosynthetic process") - a labelling slip
    that does not affect its reasoning. Underlying primary and review literature (Dickson &
    Hille 2019; Blunsom & Cockcroft 2020; Fox et al. 2020; Cao et al. 2008; Kinoshita 2020;
    Imbach et al. 2000) is consistent with the report.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "GO:0006661 is not a biochemically correct blanket annotation for the listed families"
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "PIS/CDIPT is the enzyme that directly creates the PI molecule"
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "Only CDS1/CDS2 and CDIPT/PIS warrant GO:0006661 among the assessed catalytic families; CDIPT/PIS is the only direct PI-forming enzyme."
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "Assigning GO:0006661 directly to these proteins conflates"
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "Kinases add phosphate to the 3-, 4-, or 5-hydroxyl of the inositol headgroup"
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "MTM1/MTMR2 use PI3P and PI(3,5)P2 as substrates, yielding PI and PI5P, respectively."
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "A terminal product being PI does not convert a salvage or catabolic reaction into the canonical biosynthetic pathway."
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
