go_specificity:
  assessment: MISMATCHED
  notes: >-
    For sets 8 and 9 the term names what PI synthase does. For the other nine sets it is the wrong kind
    of term: QuickGO (2026-11-12) does not place GO:0046856 (phosphatidylinositol dephosphorylation),
    GO:0046854 (phosphatidylinositol phosphate biosynthetic process) or GO:0015914 (phospholipid transport)
    under GO:0006661, and those are the terms the reviewed members carry on experimental or phylogenetic
    evidence. The mismatch originates in the curated Reactome TAS annotations and is reproduced, not created,
    by the rule.
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    The narrow restrictions follow the species of the annotations each set copies, not the biology: Primates,
    Haplorrhini, Catarrhini and Hominidae where the support is human Reactome TAS (sets 1, 2, 3, 5, 6,
    10), and Mus where it is MGI IDA and IGI on the mouse PIP5K1 kinases (set 4). These are pan-eukaryotic
    enzyme families, so that is narrow coverage, not wrong annotation. The PI synthase sets are scoped
    to Chordata (set 8) and Fungi (set 9), which is reasonable. Two sets are wider than their evidence:
    set 7 is Eukaryota (482 matches) on two Arabidopsis TAS annotations, and set 11 is Metazoa and reaches
    the Lst2 proteins.
