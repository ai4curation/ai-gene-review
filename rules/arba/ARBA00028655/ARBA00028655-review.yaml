  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "Annotating DPM1 to GO:0006661 is not supportable."
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "VPS34 is the catalytic lipid kinase and major producer of PI3P; UVRAG is a targeting/regulatory component, not a phosphoinositide-metabolizing enzyme."
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "p85 has no PI/PIP lipid-kinase catalytic activity."
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
