      negated: false
    notes: "INCORRECT AND PROMISCUOUS. 2.30.29.30 is the PH-domain-like superfamily; FF:000038 carries the misleading label 'Myotubularin 1, isoform CRA_a' but in practice matches unrelated PH-domain proteins - PLEKHA3/FAPP1, PLEKHA8/FAPP2, PITPNM1 and PITPNM2 all appear in the emitted annotation set. A bare PH-domain FunFam cannot support any catalytic BP term. This condition set should be deleted outright rather than retargeted."
  - number: 9
    conditions:
    - condition_type: FUNFAM
      value: 3.30.470.160:FF:000001
      curie: CATH.FunFam:3.30.470.160:FF:000001
