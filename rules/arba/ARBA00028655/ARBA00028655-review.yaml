    notes: "INCORRECT. FunFam 3.30.470.160:FF:000001 is labelled only 'Kinase' (PIP-kinase insert region), restricted to Catarrhini. An uninformative label plus a primate-only taxon is not a defensible basis for a metabolic BP annotation. Better BP if retained: GO:0046854; preferably delete."
  - number: 10
    conditions:
