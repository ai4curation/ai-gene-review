review_summary: >-
  Accuracy: all eleven condition sets of the rule as served on 2026-11-10 were queried in UniProtKB and
  the reviewed matches of each were looked up in QuickGO. In every set the reviewed human, mouse, yeast
  or Arabidopsis members carry GO:0006661 (phosphatidylinositol biosynthetic process) on evidence other
  than this rule: Reactome TAS from the pathways R-HSA-1660499, R-HSA-1660516, R-HSA-1483248 and R-HSA-1483226,
  MGI IDA and IGI for the mouse PIP5K1 kinases (PMID:20622009), TIGR TAS for the plant PI 4-kinases, and
  IDA for PI synthase. So the rule reproduces what is in the annotation files. Set 11 is the exception:
  its FunFam is the FYVE zinc finger and it also matches Lst2 homologs, which have no phosphatase domain
  and carry the term only from this rule. Meaning and parsimony: reproducing annotations is not the same
  as saying something sensible. Only sets 8 and 9 select the enzyme that makes phosphatidylinositol, PI
  synthase. Sets 1, 2, 3, 5 and 11 select phosphoinositide phosphatases whose experimentally curated process
  is GO:0046856 (phosphatidylinositol dephosphorylation); sets 4 and 7 select phosphoinositide kinases,
  whose own term is GO:0046854 (phosphatidylinositol phosphate biosynthetic process); sets 6 and 10 select
  lipid transfer proteins curated to lipid transport terms. None of those terms is under GO:0006661, which
  has no descendants. The biosynthesis term reaches the non-synthase families through a pathway-membership
  mapping (Reactome "Synthesis of PIPs" pathways), so the rule puts "PI biosynthesis" on enzymes that
  remove phosphates from, or move, already made phosphoinositides. The rule is heterogeneous and should
  be split by what each family does.
action: SPLIT
action_rationale: >-
  The first pass kept the term for the kinase, phosphatase and transfer-protein sets because curated annotations
  carry it, and left the choice of term to Reactome, MGI and GO. That deference answers whether the proteins
  were annotated, not whether the term is meaningful for them, and the experimental annotations of the
  same proteins answer the second question directly: MTM1, MTMR3, SAC1 and SYNJ1 are curated by IDA to
  phosphatidylinositol dephosphorylation, PITPNM1 to phospholipid transport and PLEKHA8 to lipid transport.
  One rule cannot carry a single term that is right for a synthase, its product's kinases, their opposing
  phosphatases and lipid carriers. Splitting keeps the sound part (PI synthase) and gives each other family
  its own term. The set 11 defect found in the first pass stands and is carried into the split.
suggested_modifications:
- >-
  Keep GO:0006661 (phosphatidylinositol biosynthetic process) for sets 8 and 9 only (PI synthase, CDIPT/PIS1).
- >-
  Move sets 1, 2, 3, 5 and 11 (myotubularins, SAC-domain phosphatases, SHIP1/SHIP2) to a rule asserting
  GO:0046856 (phosphatidylinositol dephosphorylation), the term their reviewed members carry by IDA.
- >-
  In set 11, add IPR010569 (Myotubularin-like, phosphatase domain) as a required condition before reuse,
  so that Lst2 homologs (Q9VB70 and 12 other reviewed entries; 126 UniProtKB matches without the domain)
  are no longer annotated.
- >-
  Move sets 4 and 7 (PIP5K type I, PI 4-kinase beta) to a rule asserting GO:0046854 (phosphatidylinositol
  phosphate biosynthetic process).
- >-
  Remove sets 6 and 10 (PITPNM1/2, PLEKHA3/8) from this rule; they are lipid transfer proteins, curated
  to GO:0015914 (phospholipid transport) and GO:0006869 (lipid transport), and belong under a transport
  term if anywhere.
- >-
  Raise with Reactome and GO that the "Synthesis of PIPs" pathways (R-HSA-1660499, R-HSA-1660516, R-HSA-1483248)
  map phosphatases and transfer proteins to GO:0006661; those TAS annotations are what the rule was mined
  from.
biological_meaning:
  assessment: HETEROGENEOUS
  notes: >-
    Five kinds of unit: PI synthase (the consequent fits), phosphoinositide 3-, 4- and 5-phosphatases
    (best term GO:0046856, outside the consequent), phosphoinositide kinases (GO:0046854, outside), and
    two lipid transfer protein families (transport terms, outside). The consequent fits nine of eleven
    sets only through Reactome pathway membership or an acts_upstream_of_or_within annotation, not through
    what the proteins do. GO:0006661 has no descendants, so no narrower term under it could rescue the
    rule.
