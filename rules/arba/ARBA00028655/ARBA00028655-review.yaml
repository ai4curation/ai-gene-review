review_summary: 'All eleven condition sets of the rule as served on 2026-11-10 were queried in UniProtKB,
  and the reviewed matches of each were looked up in QuickGO. Sets 8 and 9 select PI synthase, the enzyme
  that forms phosphatidylinositol. Sets 1 to 7 and 10 select phosphoinositide kinases, phosphatases and
  transfer proteins. In every one of those sets the reviewed human, mouse or Arabidopsis members carry
  GO:0006661 itself on curated evidence: Reactome TAS from the pathways R-HSA-1660499, R-HSA-1660516,
  R-HSA-1483248 and R-HSA-1483226, MGI IDA and IGI for the mouse PIP5K1 kinases (PMID:20622009), and TIGR
  TAS for the plant PI 4-kinases. The rule therefore reproduces what curators annotated, and transfers
  it to orthologs. Set 11 is the exception: its FunFam is the FYVE zinc finger, and besides MTMR3 and
  MTMR4 it matches Lst2 homologs, which have no phosphatase domain and carry the term only from this rule.'
action: MODIFY
action_rationale: The one defect shown with named proteins is set 11, which puts the term on FYVE proteins
  that are not phosphoinositide enzymes. For the other sets the question is not whether the rule misfires
  but whether GO:0006661 is the right term for enzymes that interconvert phosphoinositides, and that is
  a question about the curated annotations the rule copies, not about the rule. GO keeps phosphatidylinositol
  phosphate biosynthesis (GO:0046854) outside GO:0006661, so the curated annotations may themselves be
  imprecise, but changing them is for Reactome, MGI and GO to decide.
suggested_modifications:
- 'Set 11: add IPR010569 (Myotubularin-like, phosphatase domain) as a required condition, so that Lst2
  homologs (Q9VB70 and 12 other reviewed entries; 126 UniProtKB matches without the domain) are no longer
  annotated.'
- Raise with Reactome and GO whether the "Synthesis of PIPs" pathways (R-HSA-1660499, R-HSA-1660516, R-HSA-1483248)
  should map to GO:0046854 phosphatidylinositol phosphate biosynthetic process and not GO:0006661. If
  the curated annotations change, the consequent of sets 1 to 7 and 10 should follow them.
go_specificity:
  assessment: APPROPRIATE
  notes: 'For sets 8 and 9 the term names what PI synthase does. For the other sets the term is the one
    curators used on the matched proteins. QuickGO, 2026-11-09: GO:0006661 has only regulation terms as
    children, and GO:0046854, GO:0006506, GO:0046856, GO:0180047 and GO:0036092 do not have it as an ancestor;
    so if the curated annotations were moved to those terms, this rule would have no more specific child
    to move to and would need separate rules.'
