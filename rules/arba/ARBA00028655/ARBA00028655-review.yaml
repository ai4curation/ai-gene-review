      negated: false
    notes: "INCORRECT. Three FunFams of the class IA PI3K catalytic subunit (PIK3CA/PIK3CB p110alpha/beta). These make PI(3,4,5)P3 from PI(4,5)P2. Better BP: GO:0046854 phosphatidylinositol phosphate biosynthetic process."
