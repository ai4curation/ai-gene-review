condition_overlap:
  assessment: SIGNIFICANT
  notes: >-
    Two distinct overlap problems. (1) Genuine near-duplication of the same biological concept
    across sets: CS4, CS5 and CS13 each specify a trio of FunFams drawn from the same three
    CATH superfamilies (1.10.1070.11 kinase catalytic, 1.25.40.70 helical/PIK, 2.60.40.150 C2)
    for class IA/IB PI3K catalytic subunits, and CS6/CS14 do the same for class II PI3K; the
    single superfamily 1.10.1070.11 appears in seven different condition sets (CS3, CS4, CS5,
    CS6, CS13, CS14, CS17), 2.60.40.150 in five (CS4, CS5, CS6, CS13, CS20) and 3.30.800.10 in
    three (CS7 PIP4K2B, CS10 PIP5K1C, CS11 Its3). CS18/CS19 are
    the same FunFam superfamily 1.20.120.1760 split only by taxon. (2) Overlap in the emitted
    protein set even where the conditions are formally disjoint: CS1 (IPR000387 + IPR010569)
    and CS2 (IPR002013 SAC domain) both hit synaptojanins, which carry a SAC domain alongside
    a 5-phosphatase domain, and CS8's PH-domain FunFam overlaps the lipid-transfer proteins
    also reachable through other sets. Because every set emits the same single GO term, this
    redundancy does not change the annotation content - it just multiplies the number of routes
    by which a wrong annotation can be produced and makes the rule harder to repair
    incrementally. Note that no automated pairwise_overlap statistics were computed for this
    review (the `just analyze-rule` step was not run for this rule), so the overlaps described
    here are structural/biological rather than quantitative.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-analysis.md
    supporting_text: "**INCORRECT** (also ~duplicate of CS4)"
go_specificity:
  assessment: MISMATCHED
  notes: >-
    Not merely too broad - wrong branch. GO:0006661 is defined as "The chemical reactions and
    pathways resulting in the formation of phosphatidylinositol, any glycophospholipid in which
    the sn-glycerol 3-phosphate residue is esterified to the 1-hydroxyl group of 1D-myo-inositol",
    and it is effectively a leaf (its only children are the regulation terms). It therefore
    asserts specifically that the protein helps form the unphosphorylated PI molecule. The
    products of the PI kinases fall under GO:0046854 phosphatidylinositol phosphate biosynthetic
    process, whose QuickGO ancestor closure (is_a + part_of, checked 2026-08-15) is GO:0046474,
    GO:0046486, GO:0006650, GO:0006644, GO:0008654, GO:0045017, GO:0008610, GO:0006629,
    GO:0019637, GO:0006793, GO:0090407, GO:0009058, GO:0044238, GO:0008152, GO:0009987,
    GO:0008150 - GO:0006661 is absent, and the two terms first meet at GO:0046474
    glycerophospholipid biosynthetic process. Phosphoinositide kinase annotations under this
    rule are therefore in a sibling subtree, not a descendant one, and cannot be repaired by
    refining the term downward. The same argument applies to the phosphatases (whose process is
    GO:0046856 phosphatidylinositol dephosphorylation, under the dephosphorylation/catabolism
    branch), to the GPI enzymes (GO:0006506) and to DPM1 (GO:0180047). For CS18/CS19 alone the
    term is exactly right. All replacement term labels were verified against QuickGO on
    2026-08-15.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "separate phosphorylation, signaling, and GPI terms are strong evidence that GO:0006661 should not be used as a generic parent for every reaction involving a PI-containing molecule."
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-analysis.md
    supporting_text: "**GO:0006661 does not appear in that list.**"
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-analysis.md
    supporting_text: "it is a **wrong-branch (MISMATCHED)** annotation whose true term lies in a parallel subtree."
taxonomic_scope:
  assessment: TOO_NARROW
  notes: >-
    The taxon constraints are internally incoherent rather than uniformly wrong, so no single
    enum value fits cleanly; TOO_NARROW is recorded because the dominant, systematic defect is
    that pan-eukaryotic enzyme families are pinned to arbitrary narrow clades. Across the 25
    sets the constraints are Primates (CS1, CS7), Haplorrhini (CS2, CS8), Catarrhini (CS9),
    Homo (CS16), Mus (CS10), Glires (CS14), Rodentia (CS15), Eutheria (CS22), Euarchontoglires
    (CS23), Mammalia (CS21), Vertebrata (CS18), Euteleostomi (CS20), Viridiplantae (CS17),
    Fungi (CS19), Eukaryota (CS3) - and none at all for CS4, CS5, CS6, CS11, CS12, CS13, CS24
    and CS25. Myotubularins, SAC-domain phosphatases, PI3Ks, PIP5Ks, the GPI pathway and DPM1
    are all pan-eukaryotic, so a Homo-only INPPL1 set or a Mus-only PIP5K1C set reflects which
    clade happened to be densely annotated in the training data, not where the biology exists.
    Conversely the eight unconstrained sets fire across all of UniProt - which is precisely how
    S. pombe dpm1 (SPAC31G5.16c) acquired GO:0006661 via CS25 and triggered
    geneontology/go-annotation#5835. The Viridiplantae restriction on CS17 is a genuine
    exception to this pattern and is not counted as an artifact here: plants do have
    PI4-kinase beta enzymes, so that constraint matches the family it names. Even the two correct
    sets are narrower than the biology: the CDP-DAG/PIS route is conserved across eukaryotes
    and PI synthase activity is not eukaryote-exclusive, so Vertebrata (CS18) and Fungi (CS19)
    could reasonably be relaxed to Eukaryota or removed.
  supported_by:
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "PI synthesis is not eukaryote-exclusive."
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-deep-research-falcon.md
    supporting_text: "its role is Dol-P-Man production for glycosylation/GPI pathways, not PI formation."
  - reference_id: file:rules/arba/ARBA00028655/ARBA00028655-analysis.md
    supporting_text: "None of these restrictions tracks the biology."
