review_summary: >-
  The live rule has one condition set and it was examined. Its Swiss-Prot matches are mouse Trpv1 (Q704Y3)
  and mouse Trpv4 (Q9EPK8); both are annotated by IMP to GO:0002024 diet induced thermogenesis, an is_a/part_of
  descendant of adaptive thermogenesis. Seven unreviewed Mus entries also match. The PM20D1 condition
  set described in the previous version of this review is no longer in the rule.
action: ACCEPT
action_rationale: >-
  The single condition set is restricted to Mus and both reviewed matches carry an experimental annotation
  to a descendant of the rule term. The set matches TRPV4 as well as TRPV1, and both are supported.
