biological_meaning:
  assessment: TRUE_BUT_UNINFORMATIVE
  notes: >-
    One unit (TRPV1/TRPV4 channels in Mus). Both reviewed members carry GO:0002024 (diet induced thermogenesis),
    a descendant of the consequent, from mouse knockout phenotypes, so the consequent is the less informative
    of two true terms. The term describes an organism-level phenotype of channel loss, not what the channel
    does.
