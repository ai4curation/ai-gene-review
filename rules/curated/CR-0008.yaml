id: CR-0008
title: Deltex-family proteins in animals take part in Notch signalling
status: PROPOSED
description: >-
  Assigns Notch signaling pathway to Deltex-family proteins only in Metazoa, the only lineage with a
  Notch receptor and DSL ligands. Proposed to replace the unconditional InterPro2GO mapping of
  IPR039398, which also assigns the term to Deltex-family RING E3 ligases in plants, green algae and
  other eukaryotes that have no Notch pathway.
condition_sets:
- number: 1
  conditions:
  - condition_type: INTERPRO
    value: IPR039398
    label: Deltex family
  - condition_type: TAXON
    value: NCBITaxon:33208
    label: Metazoa
  notes: The taxon is a proxy for the presence of the receptor. The Notch receptor and the DSL ligands
    are metazoan-specific, while Deltex itself is holozoan (PMID:19825158), so Deltex proteins outside
    Metazoa have no Notch receptor to act on.
go_annotations:
- go_id: GO:0007219
  go_label: Notch signaling pathway
  aspect: biological_process
replaces:
- source_type: INTERPRO2GO
  source_id: InterPro:IPR039398
  consequent: GO:0007219
  review_record: projects/INTERPRO/interpro2go.sssom.yaml (IPR039398 to GO:0007219, broadMatch)
supported_by:
- reference_id: PMID:19825158
  supporting_text: nine of the components are metazoan-specific, including the Notch receptor and the
    DSL ligands
- reference_id: PMID:19825158
  supporting_text: Other genes are specific to holozoans (O-Fut; Deltex).
validation_runs:
- run_date: '2026-11-15'
  uniprot_query: (xref:interpro-IPR039398 AND taxonomy_id:33208)
  matched_count: 7415
  replaced_source_count: 7940
  notes: UniProt release 2026_04. The rule drops 525 UniProtKB entries that the mapping covers, all
    outside Metazoa, 44 of them in Viridiplantae, 184 in Fungi and the rest in other eukaryotes and
    13 in prokaryotes and viruses (7,927 of the 7,940 matches are eukaryotic). QuickGO (2026-11-15) shows 7,453
    GO:0007219 rows from IPR039398, 221 of them outside Metazoa (26 plant, 6 bacterial); the fungal
    matches carry no row because GO:0007219 is never_in_taxon Fungi.
notes: >-
  Within Metazoa the rule keeps the mapping as it is, without judging how far each animal Deltex
  paralog takes part in the pathway. Flagged by the RAR plant/animal triage (two Selaginella rows);
  see projects/RAR_MISANNOTATION.md. A Metazoa-only constraint on GO:0007219 would stop the same rows
  at the ontology level.
