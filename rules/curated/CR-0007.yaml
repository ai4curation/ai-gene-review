validation_runs:
- run_date: '2026-11-07'
  uniprot_query: (xref:interpro-IPR011251 OR xref:interpro-IPR036661) NOT (one of the 18 negated F420-dependent
    family entries)
  matched_count: 98872
  replaced_source_count: 150375
  notes: The rule drops 51,503 entries that the mappings cover, 52 of them reviewed (Mer, F420-dependent
    glucose-6-phosphate dehydrogenases, the F420-dependent alcohol dehydrogenase and mycobacterial F420-dependent
    reductases); 1,491 of the F420-family matches are archaeal. The remaining matches were not examined
    member by member.
notes: The F420-family list was taken from an InterPro name search for F420 (2026-11-07), keeping the
  entries whose members all, or nearly all, match IPR011251. The PPOX-class F420-dependent families (IPR019965,
  IPR019966, IPR019967, IPR024031) were left out because their members do not match IPR011251 (one protein
  in total). Several of the listed families are named from sequence prediction rather than enzymology,
  and the remaining luciferase-like members may still include F420-dependent or other non-O2 enzymes without
  a family entry, so the rule's positive set is an upper bound.
