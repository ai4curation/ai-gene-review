id: CR-0007
title: Luciferase-like domain proteins outside the F420-dependent families use molecular oxygen
status: PROPOSED
description: Assigns oxidoreductase activity acting on paired donors with incorporation or reduction of
  molecular oxygen to proteins with the bacterial luciferase-like fold only when they do not belong to
  an F420-dependent family. The fold is shared by flavin-dependent monooxygenases (bacterial luciferase,
  alkanesulfonate monooxygenase), for which the term is right, and by a large clade of coenzyme F420-dependent
  hydride-transfer enzymes that bind no flavin and use no O2, such as methylene-H4MPT reductase (Mer)
  and F420-dependent glucose-6-phosphate dehydrogenase. Proposed to replace the unconditional InterPro2GO
  mappings of IPR011251 and IPR036661.
