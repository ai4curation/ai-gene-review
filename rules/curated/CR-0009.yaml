  matched_count: 1128
  replaced_source_count: 1620
  notes: UniProt release 2026_04 (1,122 Vertebrata, 6 Cephalochordata). The rule drops 492 UniProtKB
    entries that the mapping covers, including 9 tunicate, 58 fungal and 15 Viridiplantae entries.
    QuickGO (2026-11-15) shows 1,382 GO:0005540 rows from IPR026203, 1,083 of them vertebrate.
notes: >-
  No vertebrate member carries GO:0005540 by experimental evidence in GOA: human HMMR (O75330) and mouse
  Hmmr (Q00547) have it only from the InterPro2GO mapping (QuickGO, 2026-11-15). The binding is
  established biochemically for the mammalian protein (PMID:7682552), and the rule assumes it holds for
  vertebrate orthologs. That makes the vertebrate set the weaker half of the argument: one in vitro
  fusion-protein assay supports an MF on about 1,100 proteins, and RHAMM is largely intracellular, as
  the InterPro entry name says, while hyaluronan is mostly extracellular. The alternative is to drop
  the mapping and annotate HMMR directly from the literature. The Cephalochordata set rests on the
  presence of hyaluronan alone. Among animals, hyaluronan is known only in vertebrates and
  cephalochordates; some bacteria make it, but the microbial RHAMM ortholog is a chromosome
  segregation protein (PMID:23315448). Flagged by the RAR plant/animal triage (two Selaginella rows); see
  projects/RAR_MISANNOTATION.md.
