id: CR-0009
title: RHAMM-family proteins bind hyaluronan only where hyaluronan is made
status: PROPOSED
description: >-
  Assigns hyaluronic acid binding to RHAMM (HMMR) family proteins only in vertebrates and
  cephalochordates, the lineages in which hyaluronan is found. Proposed to replace the unconditional
  InterPro2GO mapping of IPR026203, which also assigns the term to RHAMM-like proteins in
  invertebrates, plants, fungi and bacteria that make no hyaluronan.
condition_sets:
- number: 1
  conditions:
  - condition_type: INTERPRO
    value: IPR026203
    label: Intracellular hyaluronic acid binding protein
  - condition_type: TAXON
    value: NCBITaxon:7742
    label: Vertebrata
  notes: Hyaluronan synthase genes and hyaluronan are found throughout vertebrates (PMID:23315448), and
    mammalian RHAMM binds hyaluronan in vitro (PMID:7682552).
- number: 2
  conditions:
  - condition_type: INTERPRO
    value: IPR026203
    label: Intracellular hyaluronic acid binding protein
  - condition_type: TAXON
    value: NCBITaxon:7735
    label: Cephalochordata
  notes: Hyaluronan has been observed in amphioxus (PMID:23315448), so the partner exists. No
    amphioxus RHAMM has been tested for binding. Tunicates are left out because Ciona has no hyaluronan
    synthase.
