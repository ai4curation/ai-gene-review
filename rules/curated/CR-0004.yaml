id: CR-0004
title: Archaeal malonyl-CoA reductase (3-hydroxypropionate/4-hydroxybutyrate cycle)
status: PROPOSED
description: >-
  Names archaeal members of the aspartate-semialdehyde dehydrogenase FunFam as
  malonyl-CoA reductase only when they match a malonyl-CoA-reductase-type CDD model.
  Proposed to replace ARBA00067001 (name) and ARBA00052213 (catalytic activity), which
  use the FunFam and taxon alone and so also name the true aspartate-semialdehyde
  dehydrogenase paralog of each genome.
condition_sets:
- number: 1
  conditions:
  - condition_type: FUNFAM
    value: 3.40.50.720:FF:000411
    label: Aspartate-semialdehyde dehydrogenase
  - condition_type: CDD
    value: cd23940
    label: ASADH_C_MCR
  - condition_type: TAXON
    value: NCBITaxon:2157
    label: Archaea
- number: 2
  conditions:
  - condition_type: FUNFAM
    value: 3.40.50.720:FF:000411
    label: Aspartate-semialdehyde dehydrogenase
  - condition_type: CDD
    value: cd24150
    label: ASADH_MCR_N
  - condition_type: TAXON
    value: NCBITaxon:2157
    label: Archaea
protein_name_annotations:
- name_type: RECOMMENDED
  ec_numbers:
  - 1.2.1.75
catalytic_activity_annotations:
- reaction_name: 3-oxopropanoate + NADP(+) + CoA = malonyl-CoA + NADPH + H(+)
  rhea_id: RHEA:26446
  ec_number: 1.2.1.75
replaces:
- source_type: ARBA
  source_id: ARBA:ARBA00067001
  consequent: EC:1.2.1.75
  review_record: rules/arba/ARBA00067001/ARBA00067001-review.yaml
- source_type: ARBA
  source_id: ARBA:ARBA00052213
  consequent: RHEA:26446
  review_record: rules/arba/ARBA00052213/ARBA00052213-review.yaml
gene_reviews:
- genes/METS5/Msed_0709/Msed_0709-ai-review.yaml
- genes/METS5/Msed_1700/Msed_1700-ai-review.yaml
validation_runs:
- run_date: '2026-10-30'
  uniprot_query: ("3.40.50.720:FF:000411" AND xref:cdd-cd23940 AND taxonomy_id:2157) OR
    ("3.40.50.720:FF:000411" AND xref:cdd-cd24150 AND taxonomy_id:2157)
  matched_count: 19
  replaced_source_count: 38
  notes: The 19 matches are the MCR-type entries of rules/arba/ARBA00067001/RESULTS.md
    (17 rule-annotated plus the reviewed A4YEN2 and Q96YK1). The rule drops the 17
    ASD-type entries, including Msed_1700, and leaves the 4 entries with no CDD model
    unannotated until they are checked.
supported_by:
- reference_id: PMID:23325803
  supporting_text: The two paralogous MCR and ASD enzymes show ∼40% amino acid sequence
    identity in the same organism, and their genes mcr and asd have different chromosomal
    locations.
notes: >-
  The ARBA rule assigns EC 1.2.1.75 with no full-name text; this rule does the same, so
  UniProt would display the EC-derived name. The MCR is also the cycle's succinyl-CoA
  reductase (EC 1.2.1.76; Msed_0709 review), which ARBA does not assign; adding it is a
  separate decision.
