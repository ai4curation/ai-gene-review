id: CR-0012
title: SIR2-like domain proteins outside the sirtuin deacylase family hydrolyse NAD+
status: PROPOSED
description: >-
  Assigns NAD+ nucleosidase activity to proteins matching the Pfam family PF13289,
  "SIR2-like domain" (SIR2_2), unless they also fall in the sirtuin deacylase family
  IPR050134. PF13289 is not integrated into any InterPro entry and has no GO mapping,
  so it reaches GOA through no InterPro2GO route: 8,300 of its 8,605 unreviewed members
  matched here carry neither the term nor a descendant. The family is the SIR2 branch
  found in immune systems, where the domain acts as an NAD+-degrading effector and not
  as a protein deacylase. Members with a demonstrated NADase activity come from
  unrelated systems and architectures: Thoeris ThsA, the defence-associated sirtuin
  DSR2, the Sir2 partner of short prokaryotic Argonautes, Sir2 of the Sir2-HerA system,
  and the vertebrate FAM118A and FAM118B proteins. This is new coverage; nothing
  currently fires on this family.
condition_sets:
- number: 1
  conditions:
  - condition_type: PFAM
    value: PF13289
    label: SIR2-like domain
  - condition_type: INTERPRO
    value: IPR050134
    label: NAD-dependent sirtuin protein deacylases
    negated: true
    notes: >-
      204 unreviewed members also match this PANTHER-based family of canonical sirtuin
      deacylases. None of them is characterized. The two signatures disagree about what
      the protein does, so the rule abstains on them; this is not a claim that they are
      deacylases.
  notes: >-
    No taxon condition: characterized members are bacterial and vertebrate, so a
    lineage restriction would cut across the evidence. The sirtuin catalytic core profile IPR026590 is not excluded, because
    224 of the 297 members that match it are named NAD(+) hydrolase ThsA, for which the
    term is right.
    No member matches the canonical sirtuin family PF02146.
go_annotations:
- go_id: GO:0003953
  go_label: NAD+ nucleosidase activity
  aspect: molecular_function
validation_runs:
- run_date: '2026-11-25'
  uniprot_query: (xref:pfam-PF13289 AND NOT xref:interpro-IPR050134)
  matched_count: 8620
  notes: >-
    UniProtKB 2026_04. PF13289 alone matches 8,824 entries; the exclusion removes 204.
    Closure-aware gain measured with projects/PFAM/pfam_rule_probe.py on the member list
    downloaded the same day: of the 8,620 matched, 15 are reviewed and 8,605 unreviewed;
    305 unreviewed carry GO:0003953 or a descendant, 8,300 do not (568 of them
    fragments). 91 of those 8,300 carry some other non-binding molecular function, the
    commonest being protein serine/threonine kinase activity (20), ATP hydrolysis
    activity (11) and protein tyrosine kinase activity (10), from further domains of the
    same protein; these do not contradict an NADase domain. Reviewed members: 11 carry
    the term (ThsA from five species, DSR2, FAM118B from five mammals); three further
    vertebrate entries (human and mouse FAM118A and a zebrafish homolog) have EC 3.2.2.5
    without the GO term; one (UniProtKB:P55383, Sinorhizobium fredii) is
    uncharacterized. Unreviewed members are 75.5% bacterial, 23.5% eukaryotic (1,886
    Metazoa; 2,043 unreviewed members fall in the FAM118 family IPR038916) and 1%
    archaeal; 87% have PF13289 as their only Pfam family. Unreviewed members with a
    structure whose UniProt citations name an NADase: UniProtKB:Q74DF6 (Geobacter
    sulfurreducens Sir2 of a short Argonaute system, PMID:37311833 and PMID:38923459)
    and UniProtKB:C1PH93 (Staphylococcus aureus Sir2 of Sir2-HerA, PMID:39465277).
    Structures also exist for members from the Avs5 and Kongming systems
    (UniProtKB:A0AA94GZI5, UniProtKB:A0AAC8TGL7); their activity was not checked here.
supported_by:
- reference_id: PMID:36192536
  supporting_text: Finally, we demonstrate that the SIR2 domain serves as an effector NADase in a
    diverse set of phage defence systems outside the DSR family.
- reference_id: PMID:32499527
  supporting_text: ThsA exhibits robust NAD+ cleavage activity and a two-domain architecture containing
    sirtuin-like and SLOG-like domains.
- reference_id: PMID:41249820
  supporting_text: The overexpression of wild-type human FAM118B and FAM118A leads to strongly decreased
    NAD levels in human cells, an effect that is abolished in catalytically dead or filament-deficient
    mutants.
notes: >-
  The rule asserts the molecular function only. Abortive infection, NAD+ catabolism
  and defence response to virus were considered and left out: they depend on the
  system the domain sits in, and most members are single-domain proteins of unknown
  context.

  Activity is conditional in every characterized member. ThsA is activated by a
  cyclic ADP-ribose signal, DSR2 by a phage tail tube protein, and FAM118B and FAM118A
  are individually very weak and become active together (PMID:41249820). The term
  describes what the domain does when active, not that a given protein is active
  alone.

  The FAM118 evidence is the weakest of the group: the published assay follows
  release of the nicotinamide moiety from an NAD analogue and NAD loss in cells, and
  UniProt records the activity as EC 3.2.2.5. A demonstration of the ADP-ribose product
  for a vertebrate member would settle whether hydrolysis is the reaction there.

  This rule comes from the Pfam coverage analysis in projects/PFAM.md (Part 3). It is
  one of the few candidates there that only a Pfam-level condition can reach.
