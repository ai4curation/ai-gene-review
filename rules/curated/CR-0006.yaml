id: CR-0006
title: Bride of sevenless class C GPCRs bind sevenless and act in sevenless signaling
status: PROPOSED
description: >-
  Assigns sevenless binding and the sevenless signaling pathway to arthropod proteins matching the
  Bride of sevenless signature only when they also belong to the metabotropic glutamate receptor
  (class C GPCR) family entry, as BOSS does. Proposed to replace the unconditional InterPro2GO mapping of
  IPR002956 to sevenless binding, whose only member signature, PRINTS PR01223, also matches 172
  GPRC5-family receptors (IPR051753; mouse Gprc5c, but not human GPRC5C) and unrelated bacterial and
  eukaryotic transporters. The entry's visual perception mapping is not carried over: BOSS induces the
  R7 photoreceptor fate but does not take part in perceiving light, so that mapping is recorded as a
  removal and the rule assigns the sevenless signaling pathway instead.
condition_sets:
- number: 1
  conditions:
  - condition_type: INTERPRO
    value: IPR002956
    label: Bride of sevenless protein
  - condition_type: INTERPRO
    value: IPR050726
    label: Metabotropic Glutamate Receptor
  - condition_type: TAXON
    value: NCBITaxon:6656
    label: Arthropoda
  notes: The sequence-feature condition excludes the false positives, which are not confined to
    one lineage. IPR050726 holds Drosophila BOSS (P22815); no IPR002956 match that is vertebrate,
    bacterial or in the GPRC5 family IPR051753 carries it (genes/mouse/Gprc5c/Gprc5c-bioinformatics/RESULTS.md).
    The taxon condition bounds the positives to where the consequent is valid. GO restricts
    GO:0045500 sevenless signaling pathway to Arthropoda (only_in_taxon NCBITaxon:6656, QuickGO,
    checked 2026-11-06); GO:0005118 sevenless binding has no taxon constraint. Without it the rule
    would annotate a bryozoan and a tardigrade protein in violation of that constraint.
go_annotations:
- go_id: GO:0005118
  go_label: sevenless binding
  aspect: molecular_function
- go_id: GO:0045500
  go_label: sevenless signaling pathway
  aspect: biological_process
replaces:
- source_type: INTERPRO2GO
  source_id: InterPro:IPR002956
  consequent: GO:0005118
  review_record: projects/INTERPRO/interpro2go.sssom.yaml (IPR002956 to GO:0005118, broadMatch)
gene_reviews:
- genes/mouse/Gprc5c/Gprc5c-ai-review.yaml
supported_by:
- reference_id: PMID:1316239
  supporting_text: This is mediated by the transmembrane protein bride of sevenless (boss) on the
    surface of the R8 cell, which binds the sevenless tyrosine kinase receptor (sev) on the surface of
    the R7 precursor cell.
- reference_id: PMID:9472002
  supporting_text: neuronal differentiation of the R7 photoreceptor cell is induced by the interaction
    of the receptor tyrosine kinase Sevenless with its ligand Bride of sevenless (Boss)
- reference_id: file:mouse/Gprc5c/Gprc5c-bioinformatics/RESULTS.md
  supporting_text: '| also IPR050726, vertebrates | `xref:interpro-IPR002956 AND xref:interpro-IPR050726
    AND taxonomy_id:7742` | 0 |'
validation_runs:
- run_date: '2026-11-06'
  uniprot_query: (xref:interpro-IPR002956 AND xref:interpro-IPR050726 AND taxonomy_id:6656)
  matched_count: 211
  replaced_source_count: 414
  notes: Breakdown from ipr002956_check.py (genes/mouse/Gprc5c/Gprc5c-bioinformatics/RESULTS.md). The
    rule keeps 211 arthropod entries (196 insects) and drops 203, among them all 172 vertebrate
    matches, all 172 GPRC5-family (IPR051753) matches (170 entries are in both sets), all 11
    bacterial matches, and the two IPR050726 matches outside Arthropoda (A0A7J7JGJ3, a bryozoan, and
    A0A1W0X445, a tardigrade). The 414 total is from the UniProtKB search; the InterPro API reports
    418 for the same entry.
notes: >-
  The rule keeps the terms on non-insect arthropod BOSS-like proteins (crustaceans, a horseshoe
  crab, a centipede) without evidence that each binds a sevenless receptor; restricting further
  would need a BOSS-specific subfamily. No gene review covers Drosophila boss itself, so the rule
  has no positive control yet; reviewing it is a curation to-do on projects/RAR_MISANNOTATION.md. Wei et al. 2020 (PMID:32470107) flagged the mouse Gprc5c
  row; see projects/RAR_MISANNOTATION.md.
