id: CR-0006
title: Bride of sevenless class C GPCRs bind sevenless and act in visual perception
status: PROPOSED
description: >-
  Assigns sevenless binding and visual perception to proteins matching the Bride of sevenless
  signature only when they also belong to the metabotropic glutamate receptor (class C GPCR)
  family, as BOSS does. Proposed to replace the unconditional InterPro2GO mappings of
  IPR002956, whose only member signature, PRINTS PR01223, also matches 172 vertebrate GPRC5-family
  receptors (IPR051753; mouse Gprc5c, but not human GPRC5C) and unrelated bacterial and eukaryotic
  transporters.
condition_sets:
- number: 1
  conditions:
  - condition_type: INTERPRO
    value: IPR002956
    label: Bride of sevenless protein
  - condition_type: INTERPRO
    value: IPR050726
    label: Metabotropic Glutamate Receptor family
  notes: A sequence-feature condition, because the false positives are not confined to one
    lineage. IPR050726 holds Drosophila BOSS (P22815); none of the 172 GPRC5-type receptors
    matching IPR002956 (all in IPR051753) and none of the transporter matches carry it.
go_annotations:
- go_id: GO:0005118
  go_label: sevenless binding
  aspect: molecular_function
- go_id: GO:0007601
  go_label: visual perception
  aspect: biological_process
replaces:
- source_type: INTERPRO2GO
  source_id: InterPro:IPR002956
  consequent: GO:0005118
  review_record: projects/INTERPRO/interpro2go.sssom.yaml (IPR002956 to GO:0005118, broadMatch)
- source_type: INTERPRO2GO
  source_id: InterPro:IPR002956
  consequent: GO:0007601
  review_record: projects/INTERPRO/interpro2go.sssom.yaml (IPR002956 to GO:0007601, broadMatch)
gene_reviews:
- genes/mouse/Gprc5c/Gprc5c-ai-review.yaml
validation_runs:
- run_date: '2026-11-06'
  uniprot_query: (xref:interpro-IPR002956 AND xref:interpro-IPR050726)
  matched_count: 213
  replaced_source_count: 414
  notes: The rule keeps 211 arthropod entries (196 insects) plus one bryozoan and one tardigrade,
    and drops 201 entries, including all 172 vertebrate GPRC5-type receptors (IPR051753) and the
    bacterial permeases and other transporters matched by PR01223. No kept entry is vertebrate,
    bacterial or in IPR051753.
notes: >-
  The rule keeps the terms on non-insect arthropod BOSS-like proteins (crustaceans, a horseshoe
  crab, a centipede) without evidence that each binds a sevenless receptor; restricting further
  would need a BOSS-specific subfamily. Wei et al. 2020 (PMID:32470107) flagged the mouse Gprc5c
  row; see projects/RAR_MISANNOTATION.md and genes/mouse/Gprc5c/Gprc5c-bioinformatics/RESULTS.md.
