notes: >-
  Positive control: the Drosophila boss review (genes/DROME/boss/boss-ai-review.yaml) accepts both
  consequents on experimental evidence (PMID:1857416, PMID:7680109, PMID:3167983). The rule no longer
  annotates non-dipteran BOSS cognates. The decisive argument is functional: Boss/Sev
  ligand-receptor activity has only been shown in Drosophila species, and sev loss-of-function in
  the butterfly Vanessa cardui and in Tribolium affects more photoreceptors than R7, so outside flies
  Sev appears to have broader roles and probably a different ligand (PMID:42043338). The sequence
  argument is weaker: the BOSS ectodomain is not detectably conserved outside Diptera, which the
  authors attribute to fast evolution rather than loss, and they left open conserved Sevenless
  signaling in other endopterygote insects (PMID:18392882). Within Diptera only Drosophila species have been
  tested, so the rule still extrapolates across the order on the conserved ectodomain. Wei et al.
  2020 (PMID:32470107) flagged the mouse Gprc5c row; see projects/RAR_MISANNOTATION.md.
