id: CR-0005
title: CacyBP/SIP CS-domain proteins in tunicates and vertebrates bind S100 proteins
status: PROPOSED
description: >-
  Assigns S100 protein binding to proteins with the Calcyclin-binding protein CS domain
  only in tunicates and craniates (Olfactores), the lineages with S100 proteins. Proposed to replace the
  unconditional InterPro2GO mapping of IPR037893, which also assigns the term to CacyBP/SIP
  orthologs in plants, invertebrates and apicomplexans, where no S100 partner exists.
condition_sets:
- number: 1
  conditions:
  - condition_type: INTERPRO
    value: IPR037893
    label: Calcyclin-binding Protein, CS domain
  - condition_type: TAXON
    value: NCBITaxon:89593
    label: Craniata
  notes: The taxon is a proxy for the presence of the partner. S100 proteins arose in the
    ancestor of tunicates and vertebrates (PMID:27764152). NCBI Taxonomy has no node for that
    clade (Olfactores), so the rule uses one set per member lineage. 977 UniProtKB matches on
    2026-11-12.
- number: 2
  conditions:
  - condition_type: INTERPRO
    value: IPR037893
    label: Calcyclin-binding Protein, CS domain
  - condition_type: TAXON
    value: NCBITaxon:7712
    label: Tunicata
  notes: Rests on four S100 hits in one tunicate species, Oikopleura dioica (PMID:27764152), so
    it is the weaker of the two sets. 2 UniProtKB matches on 2026-11-12. Cephalochordates, where
    no S100 protein is reported, are left out; a single Chordata condition would have annotated
    their 3 matches without a known partner.
go_annotations:
- go_id: GO:0044548
  go_label: S100 protein binding
  aspect: molecular_function
replaces:
- source_type: INTERPRO2GO
  source_id: InterPro:IPR037893
  consequent: GO:0044548
  review_record: projects/INTERPRO/interpro2go.sssom.yaml (IPR037893 to GO:0044548, broadMatch)
gene_reviews:
- genes/DROME/CG3226/CG3226-ai-review.yaml
- genes/human/CACYBP/CACYBP-ai-review.yaml
supported_by:
- reference_id: PMID:27764152
  supporting_text: All S100 hits were within vertebrates, with the exception of four hits from the
    tunicate Oikopleura dioica.
validation_runs:
- run_date: '2026-11-06'
  uniprot_query: (xref:interpro-IPR037893 AND taxonomy_id:7711)
  matched_count: 982
  replaced_source_count: 2172
  notes: Run with the earlier single Chordata condition. The rule drops 1,190 UniProtKB entries that the mapping covers, all outside
    Chordata. QuickGO (2026-11-05) shows 1,194 GO:0044548 IEA annotations outside Chordata,
    all from this mapping. The fly CG3226 review removes the term; the human CACYBP review
    accepts it, and the rule keeps it.
- run_date: '2026-11-12'
  uniprot_query: (xref:interpro-IPR037893) AND (taxonomy_id:89593 OR taxonomy_id:7712)
  matched_count: 979
  replaced_source_count: 2172
  notes: UniProtKB 2026_04. Craniata 977, Tunicata 2; the 3 cephalochordate entries the Chordata
    condition matched are no longer annotated. The rule drops 1,193 entries the mapping covers.
notes: >-
  Pairs with the taxon-constraint proposal TPV-006 (GO:0044548 only_in_taxon Chordata) in
  projects/TAXON_PATHWAY_VARIANCE/proposed_taxon_constraints.yaml, which would stop most of the
  same annotations at the ontology level. The constraint stays at Chordata because only_in_taxon
  takes one taxon and NCBI Taxonomy has no Olfactores node; the rule is the tighter of the two. Wei et al. 2020 (PMID:32470107) flagged the fly row by
  annotation-rate ratio; see projects/RAR_MISANNOTATION.md.
