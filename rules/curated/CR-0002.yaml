id: CR-0002
title: Crenarchaeal CdvB-family ESCRT-III proteins take part in Cdv-dependent cytokinesis
status: PROPOSED
description: >-
  Assigns Cdv-dependent cytokinesis to the archaeal CdvB proteins and to the CdvB1 and
  CdvB2 paralogs, which form the division rings of Sulfolobales and related crenarchaea.
  GO:0061639 was created for this machinery but had no annotations in GOA when checked.
condition_sets:
- number: 1
  conditions:
  - condition_type: INTERPRO
    value: IPR053654
    label: Cell division protein B
  notes: CdvB (NCBIfam NF041008, integrated in IPR053654), the template ring.
- number: 2
  conditions:
  - condition_type: INTERPRO
    value: IPR053492
    label: Cell Division Machinery Component
  notes: CdvB1 and CdvB2 (NCBIfam NF041005, integrated in IPR053492), the constricting
    copolymer. CdvB3 (NF041009) is not included; its role is not established.
go_annotations:
- go_id: GO:0061639
  go_label: Cdv-dependent cytokinesis
  aspect: biological_process
gene_reviews:
- genes/SULAC/cdvB/cdvB-ai-review.yaml
- genes/METS5/Msed_1695/Msed_1695-ai-review.yaml
validation_runs:
- run_date: '2026-10-30'
  uniprot_query: (xref:interpro-IPR053654) OR (xref:interpro-IPR053492)
  matched_count: 84
  notes: 28 entries match IPR053654 and 56 match IPR053492, all in Archaea (NCBITaxon:2157),
    and no entry matches both. No taxon condition is needed because both entries are
    archaeal-only.
supported_by:
- reference_id: PMID:32764038
  supporting_text: CdvB both templates the assembly of a contractile ESCRT-III copolymer,
    composed of the paralogs CdvB1 (Saci_0451) and CdvB2 (Saci_1416), and prevents their
    constriction
notes: >-
  The experimental evidence is from Sulfolobus acidocaldarius (CdvB, CdvB1, CdvB2);
  other members are covered by family membership only. Gene reviews annotate CdvB by IDA
  and the M. sedula CdvB2 ortholog Msed_1695 by ISS.
