id: CR-0014
title: Two-domain extradiol dioxygenases with the BphC N-terminal domain incorporate both atoms of
  O2 into one substrate
status: PROPOSED
description: >-
  Assigns oxidoreductase activity, acting on single donors with incorporation of two
  atoms of oxygen, to proteins matching the Pfam family PF22632, the N-terminal domain
  of 2,3-dihydroxybiphenyl dioxygenase BphC and related two-domain extradiol
  ring-cleavage dioxygenases. The family is not integrated into any InterPro entry.
  The catalytic C-terminal domain that these proteins share (PF00903, IPR004360) is
  common to the whole vicinal oxygen chelate superfamily, including glyoxalase I and
  fosfomycin resistance proteins, and so carries no molecular-function mapping; the
  N-terminal domain is what marks the dioxygenases. Members are left out where another
  signature classifies them as glyoxalase I or as methylmalonyl-CoA epimerase.
condition_sets:
- number: 1
  conditions:
  - condition_type: PFAM
    value: PF22632
    label: Dihydroxybiphenyl dioxygenase BphC D1
  - condition_type: INTERPRO
    value: IPR018146
    label: Glyoxalase I, conserved site
    negated: true
  - condition_type: INTERPRO
    value: IPR051785
    label: Methylmalonyl-CoA/ethylmalonyl-CoA epimerase
    negated: true
  notes: >-
    The two exclusions remove 223 members on which the signals conflict. InterPro2GO
    gives lactoylglutathione lyase activity through IPR018146, and about 20 members
    carry methylmalonyl-CoA epimerase activity. Before the exclusions 149
    unreviewed members lacking the term carried a different non-binding function;
    after them, one does. The rule abstains on the excluded members and does not
    claim they are not dioxygenases (see notes).
go_annotations:
- go_id: GO:0016702
  go_label: oxidoreductase activity, acting on single donors with incorporation of molecular oxygen,
    incorporation of two atoms of oxygen
  aspect: molecular_function
validation_runs:
- run_date: '2026-11-25'
  uniprot_query: (xref:pfam-PF22632 AND NOT xref:interpro-IPR018146 AND NOT xref:interpro-IPR051785)
  matched_count: 2589
  notes: >-
    UniProtKB 2026_04. PF22632 alone matches 2,812 entries. Closure-aware gain measured
    with projects/PFAM/pfam_rule_probe.py: 15 reviewed and 2,574 unreviewed entries
    match; 680 unreviewed carry GO:0016702 or a descendant and 1,894 do not, of which
    1,254 carry an ancestor (mostly dioxygenase activity) and 20 are fragments. All 15
    reviewed members are extradiol dioxygenases with four different EC numbers
    (1.13.11.39 biphenyl-2,3-diol 1,2-dioxygenase, 1.13.11.25 HsaC, 1.13.11.56
    1,2-dihydroxynaphthalene dioxygenase, 1.13.11.2 catechol 2,3-dioxygenase); 14 carry
    the term and the fifteenth (UniProtKB:P13453) has the incomplete EC 1.13.11.-.
    Unreviewed members are bacterial (67% Actinomycetota, 32% Pseudomonadota) and 99%
    have the architecture PF22632 plus PF00903.
supported_by:
- reference_id: PMID:7481800
  supporting_text: The monomer comprises amino- and carboxyl-terminal domains. Structural homology
    between and within the domains reveals evolutionary relationships within the extradiol dioxygenase
    family.
- reference_id: PMID:19300498
  supporting_text: This pathway includes an iron-dependent extradiol dioxygenase, HsaC, that cleaves
    catechols.
notes: >-
  The term is the most specific one the family shares. Its reviewed members cleave
  different catechols, so no single substrate-level term holds, and GO has no term for
  extradiol ring cleavage as a class. InterPro2GO gives 1,254 of the members that lack
  the term only dioxygenase activity or less.

  Possible InterPro2GO defect, not asserted here. 147 PF22632 members match the
  PROSITE patterns behind IPR018146 and so receive lactoylglutathione lyase activity;
  96 of them also match the extradiol ring-cleavage dioxygenase site IPR000486, and
  many are named 2,3-dihydroxybiphenyl 1,2-dioxygenase. If those pattern matches are
  false positives on dioxygenases, the mapping of IPR018146 over-annotates and the
  exclusion here could be dropped. That needs a check of the pattern against
  characterized enzymes before anything is recorded in
  projects/INTERPRO/interpro2go.sssom.yaml.

  From the Pfam coverage analysis in projects/PFAM.md (Part 3).
