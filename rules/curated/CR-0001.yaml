id: CR-0001
title: Snf7-family proteins in eukaryotes take part in vacuolar transport
status: PROPOSED
description: >-
  Assigns vacuolar transport to members of the Snf7 (ESCRT-III) family only in
  eukaryotes, the only organisms with a vacuole or endosomal system. Proposed to
  replace the unconditional InterPro2GO mapping of IPR005024, which also assigns the
  term to archaeal Cdv cell-division proteins.
condition_sets:
- number: 1
  conditions:
  - condition_type: INTERPRO
    value: IPR005024
    label: Vacuolar-sorting protein SNF7-like
  - condition_type: TAXON
    value: NCBITaxon:2759
    label: Eukaryota
  notes: The taxon is an exact proxy here, because the presupposed compartment (GO:0005773
    vacuole) is itself restricted to Eukaryota in GO.
go_annotations:
- go_id: GO:0007034
  go_label: vacuolar transport
  aspect: biological_process
replaces:
- source_type: INTERPRO2GO
  source_id: InterPro:IPR005024
  consequent: GO:0007034
  review_record: projects/INTERPRO/interpro2go.sssom.yaml (IPR005024 to GO:0007034, broadMatch)
gene_reviews:
- genes/METS5/Msed_1695/Msed_1695-ai-review.yaml
- genes/SULAC/cdvB/cdvB-ai-review.yaml
validation_runs:
- run_date: '2026-10-30'
  uniprot_query: (xref:interpro-IPR005024 AND taxonomy_id:2759)
  matched_count: 35636
  replaced_source_count: 35715
  notes: The rule drops 79 entries that the mapping covers, 41 of them archaeal (the
    Cdv proteins, which CR-0002 annotates instead); the other 38 are non-eukaryotic,
    non-archaeal matches that were not examined.
notes: >-
  The consequent is still broad inside eukaryotes. Gene reviews of human CHMP4A, CHMP4B,
  CHMP4C and CHMP5 modify it to GO:0071985 multivesicular body sorting pathway, and SCHPO
  cmp7 removes it (projects/INTERPRO/suspect_interpro_mappings.tsv). Narrowing the
  consequent, or splitting the rule by ESCRT-III subfamily, is an open question; this
  rule only fixes the taxon error and changes nothing for eukaryotes.
