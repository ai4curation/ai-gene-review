id: CR-0003
title: Eukaryotic proteasome alpha subunits take part in ubiquitin-dependent catabolism
status: PROPOSED
description: >-
  Assigns ubiquitin-dependent protein catabolic process to proteasome alpha subunits
  in eukaryotes. Proposed to replace the unconditional InterPro2GO mapping of IPR000426,
  which also assigns the term to archaeal and bacterial proteasome subunits in organisms
  without ubiquitin. Some archaea (Asgard lineages) encode a ubiquitin conjugation relay,
  and the rule does not annotate them: no paper shows ubiquitin-dependent proteasomal
  degradation in an archaeon. An earlier version used a module condition (the relay not
  known to be absent) to keep those rows; it was dropped for the reason counted in notes.
condition_sets:
- number: 1
  conditions:
  - condition_type: INTERPRO
    value: IPR000426
    label: Proteasome alpha-subunit, N-terminal domain
  - condition_type: TAXON
    value: NCBITaxon:2759
    label: Eukaryota
go_annotations:
- go_id: GO:0006511
  go_label: ubiquitin-dependent protein catabolic process
  aspect: biological_process
replaces:
- source_type: INTERPRO2GO
  source_id: InterPro:IPR000426
  consequent: GO:0006511
  review_record: projects/INTERPRO/interpro2go.sssom.yaml (IPR000426 to GO:0006511, broadMatch)
gene_reviews:
- genes/HALVD/psmA1/psmA1-ai-review.yaml
validation_runs:
- run_date: '2026-10-30'
  uniprot_query: (xref:interpro-IPR000426)
  matched_count: 29030
  replaced_source_count: 29030
  notes: The query cannot apply the module condition, so it matches everything the
    mapping covers. Of the 29,030 entries, 28,068 are eukaryotic and 888 archaeal; the
    remaining 74 were not examined (bacterial proteasomes would use Pup, not ubiquitin).
- run_date: '2026-10-30'
  notes: Earlier version of the rule. Module condition evaluated with the proteome oracle
    (src/ai_gene_review/context_oracle.py, detector rules/curated/context/ubiquitin_transfer_relay.yaml)
    on eight proteomes; see rules/curated/context/RESULTS.md. The rule annotates the
    proteasome alpha subunits of human (72), yeast (7) and two Asgard archaea
    (Promethearchaeum syntrophicum 2, Lokiarchaeum ossiferum 3), and blocks them in
    Haloferax volcanii (2) and Metallosphaera sedula (1). Halolamina pelagica (BUSCO 86)
    is below the completeness threshold, so the rule still fires there.
- run_date: '2026-10-31'
  uniprot_query: (xref:interpro-IPR000426) AND taxonomy_id:2157
  matched_count: 888
  replaced_source_count: 888
  notes: Earlier version of the rule (module condition). All 610 archaeal proteomes with an IPR000426 member resolved in bulk (just
    evaluate-module-context ... --taxon 2157). The relay is unsatisfiable in 501 complete
    proteomes, so the rule blocks 733 of the 888 archaeal annotations. It keeps the term on
    6 proteins in 3 proteomes where the relay is detected (two Asgard archaea and
    Candidatus Methanoplasma termitum), on 134 proteins in 106 proteomes below BUSCO 95,
    and on 15 entries that belong to no proteome. See rules/curated/context/RESULTS.md.
- run_date: '2026-11-12'
  uniprot_query: (xref:interpro-IPR000426) AND taxonomy_id:2759
  matched_count: 28078
  replaced_source_count: 29009
  notes: UniProtKB 2026_04, current version of the rule (Eukaryota condition). The rule
    drops the 931 non-eukaryotic entries the mapping covers.
notes: >-
  Until 2026-11-12 the rule used a MODULE_CONTEXT condition (MODULE:ubiquitin_transfer_relay)
  instead of the taxon. The rest of this note records that version and why it was replaced.
  The context condition was evaluated per proteome by src/ai_gene_review/context_oracle.py
  with the detector rules/curated/context/ubiquitin_transfer_relay.yaml. The module itself
  is a gene-free relay shared with SUMO, NEDD8 and ISG15, so the detector adds a
  ubiquitin-like-modifier step and relies on the UBC-fold E2, which the archaeal SAMP system
  lacks; Haloferax UbaA matches only the generic ThiF fold. The oracle reports the module
  unsatisfiable only for a complete proteome (reference proteome, full assembly, BUSCO at
  least 95), so incomplete genomes never lose the annotation. A Eukaryota condition would
  have blocked the two Asgard proteomes that encode a UBC E2, a ubiquitin-like protein and
  a RING protein. Literature (rules/curated/context/RESULTS.md) supports a working
  ubiquitin system in Asgard archaea (PMID:31942073, PMID:35697693, PMID:38358888) but no
  paper shows ubiquitin-dependent proteasomal degradation there. Known weakness: the
  detector finds a conjugation relay, not one coupled to the proteasome. Candidatus
  Methanoplasma termitum has a compact E1-Ubl-E2-JAB gene cluster whose make-up matches
  both eukaryote-like archaeal operons and bacterial anti-phage conjugation systems
  (PMID:39020165), so the rule keeps the term on its one alpha subunit without support.
  Cost of the exclusion-only policy, from the 2026-10-31 run: against a plain Eukaryota
  condition, the module condition keeps 155 archaeal annotations. Five (two Asgard
  proteomes) are plausible but unproven, one (Methanoplasma) is unsupported, and 149 are
  kept only because the proteome is below BUSCO 95 or the entry has no proteome. The
  relay was detected in 3 of 504 complete archaeal proteomes, so at that rate about one
  of the 106 incomplete proteomes would be expected to have it; nearly all 149 are
  annotations the rule exists to remove. "Absence of evidence never blocks" is therefore
  the wrong default when the feature is this rare in the lineage. The rule now uses the
  Eukaryota condition and accepts the loss of the five Asgard rows, which no paper
  supports. If ubiquitin-dependent proteasomal degradation is shown in an Asgard archaeon,
  add a condition set for that lineage. The alternative, a module condition that blocks
  unless the relay is detected, would need a change to the exclusion-only policy in
  rules/curated/README.md and is not implemented.
