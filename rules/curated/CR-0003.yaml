id: CR-0003
title: Proteasome alpha subunits take part in ubiquitin-dependent catabolism where ubiquitin
  conjugation exists
status: DRAFT
description: >-
  Assigns ubiquitin-dependent protein catabolic process to proteasome alpha subunits
  only in organisms whose ubiquitin conjugation relay is not known to be absent.
  Proposed to replace the unconditional InterPro2GO mapping of IPR000426, which also
  assigns the term to archaeal and bacterial proteasome subunits in organisms without
  ubiquitin. Uses a module condition instead of a taxon condition because ubiquitin-like
  systems may occur in some archaea (Asgard lineages), where a Eukaryota condition would
  wrongly block the term.
condition_sets:
- number: 1
  conditions:
  - condition_type: INTERPRO
    value: IPR000426
    label: Proteasome alpha-subunit, N-terminal domain
  - condition_type: MODULE_CONTEXT
    value: MODULE:ubiquitin_transfer_relay
    label: E1-E2-E3 ubiquitin transfer relay
go_annotations:
- go_id: GO:0006511
  go_label: ubiquitin-dependent protein catabolic process
  aspect: biological_process
replaces:
- source_type: INTERPRO2GO
  source_id: InterPro:IPR000426
  consequent: GO:0006511
  review_record: projects/INTERPRO/interpro2go.sssom.yaml (IPR000426 to GO:0006511, broadMatch)
gene_reviews:
- genes/HALVD/psmA1/psmA1-ai-review.yaml
validation_runs:
- run_date: '2026-10-30'
  uniprot_query: (xref:interpro-IPR000426)
  matched_count: 29030
  replaced_source_count: 29030
  notes: The query cannot apply the module condition, so it matches everything the
    mapping covers. Of the 29,030 entries, 28,068 are eukaryotic and 888 archaeal; the
    remaining 74 were not examined (bacterial proteasomes would use Pup, not ubiquitin).
notes: >-
  DRAFT because the context condition cannot be evaluated yet. Until a genome-level
  oracle exists, the condition is never false and the rule behaves exactly like the
  current mapping. Two requirements for the oracle: (1) MODULE:ubiquitin_transfer_relay
  is a gene-free relay shared with SUMO, NEDD8 and ISG15, so the oracle must require
  ubiquitin itself, not any ubiquitin-like modifier; otherwise archaeal SAMP activation
  (Haloferax UbaA) could satisfy it. (2) It must report "unsatisfiable" only when the
  relay is clearly absent from a complete genome. A conservative fallback until then is
  the condition TAXON NCBITaxon:2759 (Eukaryota), which would block the 888 archaeal
  entries at the cost of any Asgard proteasome with a working ubiquitin system.
