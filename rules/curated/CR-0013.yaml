id: CR-0013
title: DUS3-type dihydrouridine synthases modify U47 of tRNA
status: PROPOSED
description: >-
  Assigns tRNA-dihydrouridine47 synthase activity to proteins that carry both the
  DUS3L CCCH zinc finger domain (PF25585) and the dihydrouridine synthase catalytic
  domain (PF01207). The zinc finger is not integrated into any InterPro entry; together
  with the catalytic domain it marks the eukaryotic DUS3 orthologs, which no InterPro
  entry singles out. The gain is small: 35 unreviewed proteins lack the term, 25 of
  them fragments, because EC 1.3.1.89 already reaches the rest through other pipelines.
  The rule is kept as the curated, auditable statement of that assignment, and was
  trimmed from an earlier draft that also assigned mRNA dihydrouridine synthase
  activity (see notes).
condition_sets:
- number: 1
  conditions:
  - condition_type: PFAM
    value: PF25585
    label: DUS3L CCCH zinc finger domain
  - condition_type: PFAM
    value: PF01207
    label: Dihydrouridine synthase (Dus)
  notes: >-
    The catalytic domain is required because the zinc finger alone is not confined to
    DUS3: 219 of the 3,193 PF25585 members lack PF01207, among them poly(A) polymerase
    and E3 ligase architectures and the rice zinc finger protein UniProtKB:Q338N2.
    All matched proteins are eukaryotic, so no taxon condition is needed.
go_annotations:
- go_id: GO:0102265
  go_label: tRNA-dihydrouridine47 synthase activity
  aspect: molecular_function
validation_runs:
- run_date: '2026-11-25'
  uniprot_query: (xref:pfam-PF25585 AND xref:pfam-PF01207)
  matched_count: 2974
  notes: >-
    UniProtKB 2026_04. Closure-aware gain measured with
    projects/PFAM/pfam_rule_probe.py: 37 reviewed and 2,937 unreviewed entries match.
    2,902 unreviewed already carry GO:0102265 and 35 do not (25 of them fragments). All
    37 reviewed entries carry the term in Swiss-Prot (29 fungi, 5 animals, 2 plants, 1
    amoebozoan); experimental evidence is on the yeast and human proteins
    (UniProtKB:Q06053, UniProtKB:Q96G46), the others by similarity.
- run_date: '2026-11-25'
  uniprot_query: (xref:pfam-PF25585 AND xref:pfam-PF01207)
  matched_count: 2974
  notes: >-
    Overlap with what UniProt already does, UniProtKB 2026_04. The curated UniRule
    UR000077057 (formerly RU291113) selects the same subfamily with other signatures:
    PF01207 AND PROSITE PS50103 AND Eukaryota, which matches 2,982 entries. 2,526
    entries match both rules; 448 match only this rule and 456 only the UniRule, so
    the Pfam zinc finger and the PROSITE zinc finger profile each miss about 15% of
    what the other finds. UR000077057 assigns the name, GO:0017150 tRNA dihydrouridine
    synthase activity and EC 1.3.1.-, and adds EC 1.3.1.89 only in Fungi. Outside
    Fungi EC 1.3.1.89 comes from the ARBA rule ARBA00012376; 2,906 of the 2,937
    unreviewed entries matched here carry it, and EC2GO turns it into GO:0102265
    (evidence IEA:UniProtKB-EC on 497 of 500 sampled entries). Only 4 unreviewed
    entries lack GO:0017150.
supported_by:
- reference_id: PMID:14970222
  supporting_text: 'We show that each of the four Dus proteins has a distinct position specificity:
    Dus1p for U(16) and U(17), Dus2p for U(20), Dus3p for U(47), and Dus4p for U(20a) and U(20b).'
- reference_id: PMID:34556860
  supporting_text: Taken together, our iCLIP data show that U46-48 in the tRNA variable loop is a
    major dihydrouridylation site for human DUS3L.
notes: >-
  Why the mRNA term was dropped. An earlier draft also assigned GO:0106414 mRNA
  dihydrouridine synthase activity, which 2,065 matched unreviewed proteins lack. The
  activity is demonstrated in one organism: in fission yeast a specific mRNA is
  modified in a Dus3-dependent way (PMID:34798057). The human DUS3L study finds
  dihydrouridine in mRNA, but its authors write that orthogonal validation is needed
  to establish DUS3L-mediated modification outside the tRNA variable loop
  (PMID:34556860). Swiss-Prot carries the mRNA activity on all 37 reviewed orthologs by
  similarity, and UniProt's own curated rule for the subfamily does not assign it. A
  family-wide rule should not go further than that. Add the term back if a second
  organism is shown to depend on DUS3 for mRNA dihydrouridine.

  What this rule adds over existing sources is modest and should be weighed before it
  is activated. For 10 full-length and 25 fragment entries it supplies a term nothing
  else gives. For the rest it restates, from a curated rule with experimental support
  in yeast and human, a U47 assignment that outside Fungi currently rests on an ARBA
  rule. UniProt's curated rule stops at the general tRNA dihydrouridine synthase
  activity outside Fungi; this rule goes one step more specific on the strength of
  the human data. If that step is not wanted, the rule has no remaining purpose and
  should be retired.

  Not a Pfam-only rule: the UniRule reaches most of the same proteins through a
  PROSITE profile.

  From the Pfam coverage analysis in projects/PFAM.md (Part 3).
