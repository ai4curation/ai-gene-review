id: CR-0013
title: DUS3-type dihydrouridine synthases modify U47 of tRNA and uridines in mRNA
status: DRAFT
description: >-
  Assigns tRNA-dihydrouridine47 synthase activity and mRNA dihydrouridine synthase
  activity to proteins that carry both the DUS3L CCCH zinc finger domain (PF25585) and
  the dihydrouridine synthase catalytic domain (PF01207). The zinc finger is not
  integrated into any InterPro entry; together with the catalytic domain it marks the
  eukaryotic DUS3 orthologs, which no InterPro entry singles out. The tRNA term is
  already on 98.8% of the matched unreviewed proteins from other pipelines and is
  included as the defining activity. The mRNA term is the gain (2,065 unreviewed
  proteins lack it) and is also the reason the rule is a draft: it is demonstrated in
  fission yeast, and the human evidence is stated by its own authors to need
  orthogonal validation.
condition_sets:
- number: 1
  conditions:
  - condition_type: PFAM
    value: PF25585
    label: DUS3L CCCH zinc finger domain
  - condition_type: PFAM
    value: PF01207
    label: Dihydrouridine synthase (Dus)
  notes: >-
    The catalytic domain is required because the zinc finger alone is not confined to
    DUS3: 219 of the 3,193 PF25585 members lack PF01207, among them poly(A) polymerase
    and E3 ligase architectures and the rice zinc finger protein UniProtKB:Q338N2.
    All matched proteins are eukaryotic, so no taxon condition is needed.
go_annotations:
- go_id: GO:0102265
  go_label: tRNA-dihydrouridine47 synthase activity
  aspect: molecular_function
- go_id: GO:0106414
  go_label: mRNA dihydrouridine synthase activity
  aspect: molecular_function
validation_runs:
- run_date: '2026-11-25'
  uniprot_query: (xref:pfam-PF25585 AND xref:pfam-PF01207)
  matched_count: 2974
  notes: >-
    UniProtKB 2026_04. Closure-aware gain measured with
    projects/PFAM/pfam_rule_probe.py: 37 reviewed and 2,937 unreviewed entries match.
    GO:0102265: 2,902 unreviewed already carry it, 35 do not (25 of them fragments).
    GO:0106414: 872 unreviewed carry it, 2,065 do not, and 2,061 of those carry a tRNA
    dihydrouridine synthase term instead. All 37 reviewed entries carry both terms in
    Swiss-Prot (29 fungi, 5 animals, 2 plants, 1 amoebozoan); experimental evidence for the mRNA term
    is on UniProtKB:Q9UTH9 (S. pombe, PMID:34798057) and UniProtKB:Q96G46 (human,
    PMID:34556860), the others by similarity.
supported_by:
- reference_id: PMID:14970222
  supporting_text: 'We show that each of the four Dus proteins has a distinct position specificity:
    Dus1p for U(16) and U(17), Dus2p for U(20), Dus3p for U(47), and Dus4p for U(20a) and U(20b).'
- reference_id: PMID:34798057
  supporting_text: We show that the α-tubulin encoding mRNA nda2 undergoes Dus3-dependent dihydrouridylation,
    which affects its translation.
- reference_id: PMID:34556860
  supporting_text: We detected DHU in the mRNA-enriched fraction, although levels were far lower than
    in total RNA and small RNA.
notes: >-
  Open question that keeps this a draft. The mRNA activity rests on one organism.
  In fission yeast a specific mRNA is shown to be modified in a Dus3-dependent way
  (PMID:34798057). In human cells the DUS3L study finds dihydrouridine in mRNA and
  DUS3L-dependent sites, but its authors write that orthogonal validation is needed to
  establish DUS3L-mediated modification outside the tRNA variable loop (PMID:34556860).
  Swiss-Prot nevertheless carries the mRNA activity on all 37 reviewed orthologs by
  similarity, and GO carries an IDA on the human protein, so the rule would only
  extend an existing curatorial judgement. Promote it if that judgement is accepted;
  otherwise drop GO:0106414, after which the rule adds 35 annotations and is not worth
  keeping.

  Not a Pfam-only rule in the strict sense for the tRNA term, which other pipelines
  already deliver. It is Pfam-only for the DUS3 subfamily marker: the catalytic domain
  entry IPR035587 covers every Dus enzyme and carries no molecular-function mapping.

  From the Pfam coverage analysis in projects/PFAM.md (Part 3).
