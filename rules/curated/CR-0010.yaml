id: CR-0010
title: Fungal Hda2/Hda3 proteins are HDA1 complex subunits
status: PROPOSED
description: >-
  Assigns HDA1 complex to proteins with the HDA1 complex subunit 2/3 signature only in Fungi. Proposed
  to replace the unconditional InterPro2GO mapping of IPR021006, which also assigns the term to plant
  SNF2-type chromatin helicases such as MOM1 that share the region but have no known HDA1 complex.
condition_sets:
- number: 1
  conditions:
  - condition_type: INTERPRO
    value: IPR021006
    label: HDA1 complex subunit 2/3
  - condition_type: TAXON
    value: NCBITaxon:4751
    label: Fungi
  notes: InterPro describes the entry as the Hda2 and Hda3 subunits from fungi, and the complex is
    defined from yeast, where Hda2 and Hda3 bind Hda1 and are needed for its activity (PMID:11287668).
go_annotations:
- go_id: GO:0070823
  go_label: HDA1 complex
  aspect: cellular_component
replaces:
- source_type: INTERPRO2GO
  source_id: InterPro:IPR021006
  consequent: GO:0070823
  review_record: projects/INTERPRO/interpro2go.sssom.yaml (IPR021006 to GO:0070823, broadMatch)
supported_by:
- reference_id: PMID:11287668
  supporting_text: HDA2 and HDA3 are related proteins that interact with and are essential for the
    activity of the yeast histone deacetylase HDA1
validation_runs:
- run_date: '2026-11-15'
  uniprot_query: (xref:interpro-IPR021006 AND taxonomy_id:4751)
  matched_count: 797
  replaced_source_count: 831
  notes: UniProt release 2026_04. The rule drops 34 UniProtKB entries, 30 of them in Viridiplantae
    (28 in the MOM1-containing PANTHER families PTHR45623 and PTHR35116) and 1 metazoan. QuickGO
    (2026-11-15) shows 832 GO:0070823 rows from IPR021006, 799 fungal and 29 plant.
notes: >-
  Flagged by the RAR plant/animal triage (Selaginella MOM1-like D8T4Y8, PANTHER PTHR45623:SF13
  Helicase protein MOM1); see projects/RAR_MISANNOTATION.md.
