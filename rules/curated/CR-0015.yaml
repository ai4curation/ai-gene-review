id: CR-0015
title: Eukaryotic PARPs with a WGR domain ADP-ribosylate aspartate and glutamate residues
status: PROPOSED
description: >-
  Assigns NAD+-protein-aspartate and NAD+-protein-glutamate ADP-ribosyltransferase
  activity to eukaryotic proteins that carry both a WGR domain (PF05406) and a
  poly(ADP-ribose) polymerase catalytic domain (PF00644). Together the two domains
  mark the PARP1, PARP2 and PARP3 group of DNA-dependent PARPs. Neither domain alone
  supports the terms: the WGR domain also occurs in bacterial proteins that have no
  catalytic domain, and the catalytic domain is shared by PARPs with other residue
  specificities. InterPro2GO gives the group only NAD+ poly-ADP-ribosyltransferase
  activity through the catalytic and regulatory domain entries.
condition_sets:
- number: 1
  conditions:
  - condition_type: PFAM
    value: PF05406
    label: WGR domain
  - condition_type: PFAM
    value: PF00644
    label: Poly(ADP-ribose) polymerase catalytic domain
  - condition_type: TAXON
    value: NCBITaxon:2759
    label: Eukaryota
  notes: >-
    The catalytic domain removes 4,561 WGR proteins, mostly bacterial WGR-only proteins
    such as E. coli YehF (UniProtKB:P33345), which have no known ADP-ribosyltransferase
    activity. The taxon bounds the rule to where the residue specificity has been
    measured: 50 bacterial and viral proteins also carry both domains, and nothing is
    known about which residues they modify.
go_annotations:
- go_id: GO:0140806
  go_label: NAD+-protein-aspartate ADP-ribosyltransferase activity
  aspect: molecular_function
- go_id: GO:0140807
  go_label: NAD+-protein-glutamate ADP-ribosyltransferase activity
  aspect: molecular_function
gene_reviews:
- genes/human/PARP1/PARP1-ai-review.yaml
validation_runs:
- run_date: '2026-11-25'
  uniprot_query: (xref:pfam-PF05406 AND xref:pfam-PF00644 AND taxonomy_id:2759)
  matched_count: 6787
  notes: >-
    UniProtKB 2026_04. PF05406 alone matches 11,398 entries. The same rule written with
    the InterPro entries the two families are integrated into (xref:interpro-IPR008893
    AND xref:interpro-IPR012317 AND taxonomy_id:2759) matches 6,987, so this rule does
    not need Pfam; Pfam conditions are used because the purity was measured on them.
    Closure-aware gain measured with projects/PFAM/pfam_rule_probe.py: 28 reviewed and
    6,759 unreviewed entries match. GO:0140806: 1,150 unreviewed carry it, 5,609 do not
    (633 of them fragments). GO:0140807: 1,161 carry it, 5,598 do not. 5,508 of those
    lacking each term carry NAD+ poly-ADP-ribosyltransferase activity, which the rule
    adds to and does not contradict. All 28 reviewed entries carry both terms
    (vertebrates, insects, nematodes and plants); experimental evidence includes human
    PARP1, PARP2 and PARP3.
    Unreviewed members are 54% Metazoa, 23% Viridiplantae and 16% Fungi.
supported_by:
- reference_id: PMID:19764761
  supporting_text: Trypsin digestion of the modified domain D followed by LC-MS/MS analysis led to
    the identification of three ADP-ribosylation sites in domain D (D387, E488, and E491).
- reference_id: PMID:25043379
  supporting_text: We identify automodification sites on seven PARPs, and demonstrate that MAR and
    PAR generating PARPs modify similar amino acids
notes: >-
  The WGR domain is a marker of the subfamily here, not the source of the residue
  specificity. About half of the Swiss-Prot proteins that carry these two terms have
  no WGR domain, and this rule does not reach them.

  Serine is the main target of PARP1 and PARP2 in cells once HPF1 is bound, and the
  human PARP1 review in this repository keeps the aspartate and glutamate terms as part
  of the core activity while noting that shift. NAD+-protein-serine
  ADP-ribosyltransferase activity is left out of this rule: it depends on HPF1, which
  the rule cannot test for, and Swiss-Prot does not record it for PARP3.

  Outside animals the terms rest on similarity. Swiss-Prot carries them on the plant
  and nematode PARPs, and the rule follows that judgement to fungi, where no reviewed
  member exists.

  From the Pfam coverage analysis in projects/PFAM.md (Part 3).
