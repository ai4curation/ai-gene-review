# Proteome detector for MODULE:ubiquitin_transfer_relay, used by MODULE_CONTEXT
# conditions in curated rules (CR-0003). Maps each step (annoton id) of the module to
# InterPro signatures; a step is present in a proteome if any of its signatures is.
#
# The oracle is exclusion-only, so detectors are deliberately SENSITIVE (broad):
# more "present" calls mean fewer blocks, and a false "absent" would suppress a
# true annotation. The step that actually separates a ubiquitin system from the
# archaeal SAMP system is the UBC-fold E2: Haloferax UbaA (D4GSF3) matches the
# generic ThiF fold (IPR045886, IPR000594) and so counts as an E1 here, but no
# UBC E2 exists in non-Asgard archaea.
#
# All InterPro ids and names were checked against the InterPro API on 2026-10-30.
module: MODULE:ubiquitin_transfer_relay
module_path: modules/ubiquitin_transfer_relay.yaml
completeness:
  proteome_types:
  - Reference proteome
  - Representative proteome
  min_busco: 95
  assembly_level: full
steps:
  e1_activity:
    signatures:
    - IPR018075  # Ubiquitin-activating enzyme E1 (eukaryote-only)
    - IPR045886  # ThiF/MoeB/HesA family (broad: includes MoeB and SAMP E1)
    notes: Broad on purpose; the E1 step does not discriminate.
  e2_activity:
    signatures:
    - IPR000608  # Ubiquitin-conjugating (UBC), catalytic core domain
    notes: The discriminating step. In UniProtKB (2026-10-30) 124,222 eukaryotic,
      7 archaeal (mostly Asgard) and 119 bacterial entries match.
  e3_activity:
    signatures:
    - IPR001841  # Zinc finger, RING-type
    - IPR000569  # HECT domain
    - IPR003613  # U-box domain
extra_steps:
  ubiquitin_modifier:
    signatures:
    - IPR000626  # Ubiquitin-like domain
    - IPR019954  # Ubiquitin conserved site
    notes: The module has no step for the modifier itself, so the detector adds one.
      Haloferax SAMP1 (D4GUF6) matches neither signature.
