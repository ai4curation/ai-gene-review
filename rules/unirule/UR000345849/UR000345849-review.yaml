  HAMAP-derived UniRule for the PEMT/PLMT phospholipid methyltransferase family (MF_03216) in
  eukaryotes. Its main annotations give the second and third methylation steps (GO:0000773); a case
  restricted only by "not Fungi" adds GO:0004608 phosphatidylethanolamine N-methyltransferase activity,
  the first step.
