review_summary: >-
  The rule is right except for one case. Its own cases already separate the two kinds of member:
  case 6 gives the phosphatidylethanolamine (PE) methylation reaction and the PEMT name only outside
  Fungi and Viridiplantae, and case 5 names the fungal and plant members PLMT. But case 2, which gives
  GO:0004608 for the same PE methylation, excludes only Fungi, so 310 plant proteins get an activity
  that plant PLMTs lack: Arabidopsis PLMTs methylate the mono- and dimethyl intermediates but cannot
  use PE (PMID:19366698).
action: MODIFY
action_rationale: >-
  Case 2 contradicts case 6 of the same rule and the plant biochemistry. Aligning its taxon condition
  with case 6 removes the wrong plant annotations and keeps every correct animal one; the rest of the
  rule is unaffected.
suggested_modifications:
- >-
  Change the taxon condition of case 2 (GO:0004608) from NOT Fungi to NOT Fungi and NOT Viridiplantae,
  as in case 6, or move GO:0004608 into case 6.
biological_meaning:
  assessment: COHERENT
  notes: >-
    The main condition set resolves into three units: animal PEMT, fungal PLMT (Opi3) and plant PLMT. The
    main consequent GO:0000773 is curated on the fungal and plant units and is true of animal PEMT, which
    carries out all three methylations. The animal unit's most informative term, GO:0004608, is a sibling
    of GO:0000773 and belongs only to that unit; the defect is that case 2's taxon condition lets it reach
    the plant unit, not that the rule's main meaning is wrong.
  sets_examined_for_meaning: 1
