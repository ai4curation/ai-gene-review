id: UR000100608
description: UniRule UR000100608 is HAMAP rule MF_01093 (MtrA family). For archaeal proteins
  matching the MtrA family signature it assigns the name tetrahydromethanopterin S-methyltransferase
  subunit A, EC 7.2.1.4 and the Na+-translocating methyl-H4MPT:coenzyme M methyltransferase
  reaction (RHEA:53492), a cobamide cofactor and His binding site, membership of the eight-subunit
  MtrA-H complex, a cell membrane single-pass location with a triggered transmembrane prediction,
  membrane and translocase keywords, and the GO terms plasma membrane, tetrahydromethanopterin
  S-methyltransferase activity, one-carbon metabolic process and (in methanogen classes)
  methanogenesis from CO2. The family signature also matches the short cytoplasmic MtrA homologues,
  which consist only of the soluble cobamide domain, and the rule applies all of these statements
  to them unconditionally.
status: COMPLETE
rule_type: UNIRULE
