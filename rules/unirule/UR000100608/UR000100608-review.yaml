review_summary: 'The rule is right for the operon-encoded, membrane-anchored MtrA and wrong
  in most of its statements for the cytoplasmic MtrA homologues it also matches. Of 219
  UniProtKB entries annotated by the rule (query source:MF_01093, 2026-11-10), 197 are
  237-264 residues long with a C-terminal hydrophobic anchor and 22 are 167-204 residues
  long with none; no entry falls between the two classes on either criterion. All 22 soluble
  homologues (all Methanobacteria, each from a genome that also has an anchored MtrA) receive
  the cell membrane location, the eight-subunit complex statement, EC 7.2.1.4, the
  Na+-translocating reaction and function text, the membrane and translocase keywords, and
  GO:0005886, GO:0030269, GO:0006730 and GO:0019386. In the three reviewed homologues
  (O27134, D9PXT1, D3E0P6) the triggered transmembrane prediction places a helix inside the
  soluble cobamide domain. The cofactor, the His binding site and the family similarity hold
  for both classes. Gene reviews in this repository document both sides: METTH/mtrA1 and
  METJA/mtrA (operon subunits) and METTH/mtrA2 (the soluble paralog O27134).'
action: MODIFY
action_rationale: 'The family signature is sound and the cobamide-domain statements are true for
  every member, but the membrane, topology, complex, catalytic and methanogenesis statements are
  only true for the anchored subunit. Length separates the two classes cleanly (167-204 versus
  237-264 residues, matching the 215-residue criterion of Wagner et al. 2016), and HAMAP already
  supports length-conditional cases (MF_04119 uses case <Length>370>). Wrapping those statements
  in a length case removes the 22 false membrane/complex/EC assignments without losing any
  anchored subunit. Splitting the homologues into their own family would also work but needs a
  new profile, so MODIFY is the smaller change.'
suggested_modifications:
- 'Wrap the anchored-subunit statements in a length case, e.g. case <Length>215> (any cutoff from
  205 to 236 gives the same split on the 2026-11-10 data): DE name and EC 7.2.1.4, CATALYTIC
  ACTIVITY RHEA:53492, FUNCTION, PATHWAY, SUBUNIT, SUBCELLULAR LOCATION, the DR General
  Transmembrane and ADD_TOPO_DOMAIN triggers, the keywords Cell membrane, Membrane, Transmembrane,
  Transmembrane helix, Translocase, Methyltransferase and Methanogenesis, and the GO lines
  GO:0030269, GO:0019386 and GO:0005886.'
- 'In the else branch (short, anchorless homologues) keep only what the soluble cobamide domain
  supports: a family-level name such as "MtrA-like cytoplasmic corrinoid protein", SIMILARITY
  (MtrA family), the cobamide COFACTOR, the His BINDING feature and the Cobalt keyword. Assign no
  location beyond what is predicted (cytoplasm) and no complex, EC or reaction.'
- 'Alternatively, add a C-terminal anchor condition (a predicted TM helix in the last ~40 residues)
  in place of, or together with, the length case; on the current data both criteria give the same
  split.'
- 'Remove the rule-derived TRANSMEM and TOPO_DOM features of the reviewed homologues O27134
  (102-118), D9PXT1 (22-38) and D3E0P6 (39-58); each lies inside the soluble cobamide domain.'
- 'Even for the anchored subunit, EC 7.2.1.4 and GO:0030269 are activities of the whole MtrA-H
  complex; MtrA carries the methylated cobamide intermediate but catalyses neither half-reaction.
  Consider whether the GO:0030269 line should be dropped or recast as contributes_to.'
parsimony:
  assessment: PARSIMONIOUS
  notes: One family-signature condition plus the Archaea taxon. The defect is that the rule body
    has no case separating the two length classes that the signature admits, not redundant
    conditions; see annotation_assessments.
literature_support:
  assessment: STRONG
  notes: The operon MtrA is a well-characterised subunit of the Na+-translocating Mtr complex
    (biochemistry of the strain Marburg complex, EPR and mutagenesis of the His84 cobalt ligand,
    crystal structures of the cobamide domain, cryo-EM of the complex). Wagner et al. 2016 describe
    the cytoplasmic homologues as extra copies of only the soluble cobalamin-binding domain and give
    the length criterion used here. They report cobalamin binding for the M. fervidus homologue but
    no physiological role, partner or complex membership for any cytoplasmic homologue, so the
    literature supports the rule for the anchored class only.
  supported_by:
  - reference_id: PMID:27324530
    supporting_text: These cytoplasmic MtrA homologues consist only of a soluble cobalamin-binding
      domain of 170–180 amino acids, which is in contrast to the approximately 250 amino acids of
      membrane-associated MtrA.
  - reference_id: PMID:27324530
    supporting_text: sequences less than 215 amino acids correspond to cytoplasmic MtrA homologue
      without the juxtamembrane and transmembrane segments
  - reference_id: PMID:27324530
    supporting_text: The tight binding of cobalamin to the MtrA homologue was verified by gel filtration
condition_overlap:
  assessment: NONE
  notes: Only one signature condition, so there is no overlap between conditions to assess.
  supported_by: []
go_specificity:
  assessment: MISMATCHED
  notes: 'For the anchored subunit GO:0005886 plasma membrane and GO:0019386 methanogenesis, from
    carbon dioxide are appropriate and GO:0006730 one-carbon metabolic process is true but broad
    (GO has no H4MPT-specific child). GO:0030269 is the activity of the eight-subunit complex and
    is over-annotation on MtrA alone (contributes_to would fit). For the soluble homologues
    GO:0005886 and GO:0030269 are wrong and GO:0019386 and GO:0006730 are unsupported. A
    cobamide-binding term (GO:0031419 cobalamin binding) would be true for both classes and is the
    replacement the gene reviews propose for the keyword-derived cobalt ion binding rows.'
  supported_by:
  - reference_id: file:METTH/mtrA1/mtrA1-ai-review.yaml
    supporting_text: MtrA alone catalyses neither half-reaction.
  - reference_id: file:METTH/mtrH/mtrH-ai-review.yaml
    supporting_text: MtrH catalyses the first half-reaction, the transfer of the methyl
taxonomic_scope:
  assessment: APPROPRIATE
  notes: MtrA is restricted to methanogenic and related Archaea, so the Archaea condition and the
    methanogen-class case for the pathway are reasonable. The error is in which family members get
    the membrane/complex statements, not in the taxon. All 22 soluble homologues are
    Methanobacteria in this release.
  supported_by:
  - reference_id: file:rules/unirule/UR000100608/RESULTS.md
    supporting_text: Every one of the 22 soluble entries comes from an organism that also has an anchored
      entry annotated by this rule, so each is an extra copy beside the operon subunit.
