      negated: false
    - condition_type: TAXON
      value: Archaea
      curie: NCBITaxon:2157
      label: Archaea
      negated: false
    notes: 'One condition set: a match to the HAMAP MF_01093 family profile in Archaea, excluding
      fragments (a negative fragment condition in the cached rule JSON). The HAMAP flat file sets
      Size 183-262 and lists the duplicates in METRM, METTH and METTM, so the soluble paralogs of
      Methanothermobacter thermautotrophicus, M. marburgensis and Methanobrevibacter ruminantium are
      inside the rule by design. The cached UniRule JSON omits the case-conditional GO line
      GO:0019386 methanogenesis, from carbon dioxide, which the flat file adds for Methanobacteria,
      Methanococci, Methanomicrobia and Methanopyri; every rule-annotated entry carries it.'
