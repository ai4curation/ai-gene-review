review_summary: >-
  The RCK C-terminal domain gates potassium channels and Trk/Ktr potassium uptake systems, but the
  same fold sits in families with no potassium function. Two of them are clear: the Divalent Anion
  Sodium Symporter-related transporters (IPR051679, sodium-coupled anion symporters such as YfbS and the
  plant and algal sulfate transporter relatives) and the RimK/LysX alpha-L-glutamate ligases
  (IPR004666), an enzyme family. Together they account for about 10,000 of the 59,280 proteins that
  get each of the rule's two terms. The cation/H+ antiporters (IPR006153) are a third, milder case:
  regulation of potassium transport fits the K+/H+ antiporters, but they are not channels.
  A fourth class follows from the term's definition. GO:0015459 means binding to and modulating
  another protein's potassium channel, which fits standalone RCK subunits such as KtrA and TrkA. On
  proteins that carry the RCK module in cis on the channel itself (2,373 entries with a Potassium
  channel domain, IPR013099, and 68 with an Ion transport domain, IPR005821) it would make the channel
  a regulator of itself. Regulation of potassium ion transport still fits those members.
action: MODIFY
action_rationale: >-
  The rule is right for the channel and Trk/Ktr members, so it should be narrowed, not withdrawn.
  Negative conditions on the two unrelated families remove the clear errors without touching the
  correct members.
suggested_modifications:
- Add negative conditions for IPR051679 (Divalent Anion Sodium Symporter-Related Transporters) and
  IPR004666 (Ribosomal bS6 modification enzyme RimK/Lysine biosynthesis enzyme LysX) to condition set 1,
  for both GO terms.
- Consider dropping GO:0015459 for members with IPR006153 (Cation/H+ exchanger, transmembrane domain),
  which are antiporters rather than channels, while keeping GO:0043266.
- Drop GO:0015459, keeping GO:0043266, for members that carry the RCK module in cis on the channel or
  transporter itself, such as those with IPR013099 (Potassium channel domain) or IPR005821 (Ion
  transport domain); keep GO:0015459 for standalone RCK regulatory subunits.
