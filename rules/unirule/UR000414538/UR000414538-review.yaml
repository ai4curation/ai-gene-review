id: UR000414538
description: >-
  PROSITE-derived UniRule (PRU00544) that assigns potassium channel regulator activity and regulation
  of potassium ion transport to every protein with an RCK C-terminal domain (PS51202), in all three
  domains of life.
status: COMPLETE
