      label: RCK C-terminal domain profile
      negated: false
    - condition_type: TAXON
      value: Bacteria, Archaea, Eukaryota
      label: Bacteria, Archaea or Eukaryota
      negated: false
    notes: >-
      The only condition set, retrieved from the UniProt UniRule API on 2026-11-15 (rule version 7,
      modified 2026-07-20). The taxon condition lists all three domains, so the set is the domain alone.
      UniProtKB release 2026_04: 59,452 entries match PS51202. Of these, 29,984 also carry the RCK
