id: UR000038407
description: HAMAP MF_01501 (UniRule UR000038407) names archaeal members of the MtrH family
  "Tetrahydromethanopterin S-methyltransferase subunit H" and assigns them the whole-complex
  EC 7.2.1.4 and the Na+-translocating reaction RHEA:53492, the GO terms GO:0030269 and
  GO:0006730, and, in methanogen classes, GO:0019386 methanogenesis from CO2. The family
  match is specific; the problem is that the activity consequents describe the eight-subunit
  MtrA-H complex, while MtrH is a soluble subunit that catalyses only the first half-reaction.
