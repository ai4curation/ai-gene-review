review_summary: 'The rule identifies the right proteins: every UniProtKB entry matching
  MF_01501 carries the MtrH-specific family IPR028342 and comes from a methanogen class, and
  none is an MtxH-type paralog. What it says about them is partly wrong. The name, EC 7.2.1.4,
  RHEA:53492 and GO:0030269 all describe the whole Na+-pumping MtrA-H complex. MtrH is the
  soluble, peripherally attached subunit that catalyses only the first half-reaction,
  methylation of the MtrA cob(I)amide by methyl-H4MPT (PMID:10338124); the Na+-dependent
  methyl transfer to coenzyme M takes place at the membrane module. Because GO:0030269 is a
  child of sodium ion transmembrane transporter activity, the rule also leads GO to infer
  sodium ion transmembrane transport (GO_REF:0000108) for this soluble protein
  (genes/METTH/mtrH). The rule itself states no membrane location, unlike the MtrA-MtrG
  rules, and its FUNCTION text already describes the MtrH half-reaction correctly. Copying
  the complex reaction onto each subunit is the usual HAMAP convention for ion-translocating
  complexes (all Mtr, NDH-1 and Na+-NQR subunit rules do it), but the bacterial ATP synthase
  set shows that HAMAP can confine the EC and reaction to the catalytic subunits.'
action: MODIFY
action_rationale: 'The conditions are sound and need no change. The fix is to the
  consequents. GO:0030269 with enables asserts the whole Na+-translocating reaction for a
  subunit that does only one half of it, and it drags in a sodium transport process through
  inter-ontology inference. GO:0042086 (5-methyl-5,6,7,8-tetrahydromethanopterin-dependent
  methyltransferase activity), the direct parent of GO:0030269 that lacks the transporter
  parent, describes what MtrH itself does. The EC number and Rhea reaction follow a
  UniProt-wide convention and are lower priority, but the ATP synthase precedent shows they
  can be restricted.'
suggested_modifications:
- Replace GO:0030269 with GO:0042086 (5-methyl-5,6,7,8-tetrahydromethanopterin-dependent
  methyltransferase activity) in the MF_01501 GO lines. This keeps the methyl-H4MPT
  methyltransferase claim and removes the transporter parent that generates the GO:0035725
  sodium ion transmembrane transport inference for a soluble subunit.
- If the GO line must stay in step with the EC, export GO:0030269 with the contributes_to
  qualifier rather than enables.
- Ask Rhea for the MtrH half-reaction (methyl-H4MPT + a Co(I) corrinoid protein = H4MPT + a
  methyl-Co(III) corrinoid protein) and use it as the CATALYTIC ACTIVITY of MF_01501; until
  then, keep RHEA:53492 and EC 7.2.1.4 only as a complex-level statement, following the
  bacterial ATP synthase precedent (EC 7.1.2.2 only on the catalytic alpha and beta rules).
- Keep the FUNCTION sentence "MtrH catalyzes the transfer of the methyl group from
  methyl-tetrahydromethanopterin to the corrinoid prosthetic group of MtrA"; it is correct
  and should lead the text. Do not add a membrane location; if a location is added, use
  Cell membrane; Peripheral membrane protein; Cytoplasmic side.
- Review the Translocase keyword (KW-1278); it follows EC class 7 and says nothing true of
  MtrH alone.
parsimony:
  assessment: PARSIMONIOUS
  notes: One family profile, a taxon condition and a fragment exclusion. Nothing to remove.
literature_support:
  assessment: STRONG
  notes: The MtrH family membership and the subunit's own activity are well established;
    the literature also establishes that the Na+-dependent half-reaction and the Na+ path
    lie outside MtrH, which contradicts the enables reading of the whole-complex activity.
  supported_by:
  - reference_id: PMID:10338124
    supporting_text: We report here that the 34 kDa subunit MtrH catalyzes the methylation reaction.
  - reference_id: PMID:10338124
    supporting_text: MtrH was purified and shown to exhibit
      methyltetrahydromethanopterin:cob(I)alamin methyltransferase activity.
  - reference_id: PMID:11248186
    supporting_text: Subunit MtrA harbors a cob(I)amide prosthetic group which is methylated
      and demethylated in the catalytic cycle, demethylation being sodium
      ion-dependent.
  - reference_id: PMID:38530900
    supporting_text: Soluble MtrH, hosting the binding site for methyl-H4MPT is cytoplasmically attached
      to the residual MtrABCDEFG complex and easily lost during preparation
  - reference_id: PMID:38530900
    supporting_text: Putative coenzyme M and Na+ were identified inside or in a side-pocket of a
      cytoplasmic cavity formed within MtrCDE.
condition_overlap:
  assessment: NONE
  notes: Only one family condition, so there is no overlap to assess.
  supported_by: []
go_specificity:
  assessment: MISMATCHED
  notes: GO:0030269 is the complex's Na+-coupled reaction and is_a both GO:0042086 and
    GO:0015081 sodium ion transmembrane transporter activity (OLS ancestors). For MtrH the
    methyltransferase half is right and the transporter half is not, so the term is
    mismatched rather than too broad; GO:0042086 fits. GO:0006730 one-carbon metabolic
    process is true but broad, and GO:0019386 methanogenesis from CO2 (methanogen classes
    only) is right, since MtrH performs a chemical step of that pathway.
  supported_by:
  - reference_id: PMID:38530900
    supporting_text: Putative coenzyme M and Na+ were identified inside or in a side-pocket of a
      cytoplasmic cavity formed within MtrCDE.
  - reference_id: PMID:27324530
    supporting_text: MtrH as a peripheral protein without a membrane anchor
taxonomic_scope:
  assessment: APPROPRIATE
  notes: Archaea, with methanogen-specific statements (pathway, Methanogenesis keyword,
    GO:0019386) inside a case block restricted to Methanobacteria, Methanococci,
    Methanomicrobia and Methanopyri. All matched entries fall in those classes.
  supported_by:
  - reference_id: file:rules/unirule/UR000038407/RESULTS.md
    supporting_text: All are from
      the four methanogen classes.
