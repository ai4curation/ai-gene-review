# Function requirement (NOT) rules. Schema:
#   src/ai_gene_review/schema/function_requirement_rules.yaml
# Evaluate with:
#   just function-requirements acceptance   # test against experimental GOA
#   just function-requirements sweep        # flag local GOA rows
# InterPro labels are verbatim from the InterPro API; GO labels from GO.
rules:
  - id: FRR:0001
    title: Peptidoglycan glycosyltransferase activity requires a GT51 or SEDS domain
    term: {id: GO:0008955, label: peptidoglycan glycosyltransferase activity}
    include_descendants: true
    qualifiers: [enables]
    requires_any_of:
      - {id: IPR001264, label: "Glycosyl transferase, family 51"}
      - {id: IPR001182, label: Probable peptidoglycan glycosyltransferase FtsW/RodA}
    strength: REQUIRED
    status: PILOT
    rationale: >-
      Glycan-strand polymerization from lipid II is carried out by two known protein
      families: the GT51 transglycosylase domain of class A PBPs and the SEDS proteins
      (FtsW, RodA). Class B PBPs such as FtsI and PBP3 paralogs have only the
      transpeptidase domain and are misannotated when given this activity.
    supported_by:
      - reference_id: file:ECOLI/ftsI/ftsI-uniprot.txt
        supporting_text: Was originally thought to be a bifunctional enzyme

  - id: FRR:0002
    title: Acetyl-CoA carboxylase activity requires biotin carboxylase, BCCP or carboxyltransferase domains, and not a malonate decarboxylase beta subunit
    term: {id: GO:0003989, label: acetyl-CoA carboxylase activity}
    include_descendants: true
    qualifiers: [enables]
    requires_any_of:
      - {id: IPR005481, label: "Biotin carboxylase-like, N-terminal domain"}
      - {id: IPR011764, label: Biotin carboxylation domain}
      - {id: IPR000089, label: Biotin/lipoyl attachment}
      - {id: IPR011762, label: "Acetyl-coenzyme A carboxyltransferase, N-terminal"}
      - {id: IPR011763, label: "Acetyl-coenzyme A carboxyltransferase, C-terminal"}
    excluded_by_any_of:
      - {id: IPR017556, label: "Biotin-independent malonate decarboxylase, beta subunit"}
    strength: REQUIRED
    status: PILOT
    rationale: >-
      Acetyl-CoA carboxylase is a biotin-dependent two-step reaction: biotin carboxylase
      (ATP-grasp) carboxylates biotin on the carrier domain, and carboxyltransferase moves
      the carboxyl group to acetyl-CoA. Every catalytic subunit or multidomain enzyme
      carries one of these domains. The malonate decarboxylase beta subunit (MdcD)
      retains the carboxyltransferase fold but decarboxylates an ACP-bound malonyl group
      and has no biotin chemistry.
    expected_exceptions: >-
      Small non-catalytic accessory subunits, such as the Mycobacterium tuberculosis
      epsilon subunit (P96886), are required for complex activity; their rows should be
      contributes_to.
    supported_by:
      - reference_id: file:METEA/mdcD/mdcD-hypotheses/function-hypothesis-go-0003989/openscientist.md
        supporting_text: has **no ATP-grasp and no BCCP domain**

  - id: FRR:0003
    title: DNA-directed DNA polymerase activity requires a catalytic polymerase domain
    term: {id: GO:0003887, label: DNA-directed DNA polymerase activity}
    include_descendants: true
    qualifiers: [enables]
    requires_any_of:
      - {id: IPR043502, label: DNA/RNA polymerase superfamily}
      - {id: IPR043519, label: Nucleotidyltransferase superfamily}
      - {id: IPR004805, label: Error-prone DNA polymerase/DNA polymerase III subunit alpha DnaE/PolC}
      - {id: IPR044917, label: DNA-directed primase/polymerase protein}
      - {id: IPR014145, label: "DNA ligase D, polymerase domain"}
      - {id: IPR004475, label: DNA polymerase II large subunit DP2}
    strength: REQUIRED
    status: PILOT
    rationale: >-
      Nucleotide addition is catalysed by the palm domain of families A, B, Y and RT
      (DNA/RNA polymerase superfamily), the pol beta-like nucleotidyltransferase fold of
      family X, the PHP/pol III alpha fold of family C, the PrimPol fold, the LigD
      polymerase domain and the archaeal DP2 subunit. Sliding clamps, clamp loaders and
      accessory subunits (DnaN, theta, chi, psi, pol delta subunit 3) enable none of
      these steps.
    expected_exceptions: >-
      Accessory subunits of polymerase holoenzymes are commonly annotated enables; the
      rule treats these as rows that should be contributes_to.

  - id: FRR:0004
    title: Transmembrane transporter activity requires a transmembrane segment
    term: {id: GO:0022857, label: transmembrane transporter activity}
    include_descendants: true
    exempt_terms:
      # Complex activities whose catalytic subunit is peripheral and correctly
      # carries enables (SecA, F1/V1 ATPase, complex I and IV subunits).
      - {id: GO:0015399, label: primary active transmembrane transporter activity}
      - {id: GO:0046933, label: "proton-transporting ATP synthase activity, rotational mechanism"}
      # PTS group translocation: soluble IIA/IIB phosphotransfer components carry enables.
      - {id: GO:0008982, label: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity}
    qualifiers: [enables]
    requires_transmembrane_segment: true
    # Membrane beta-barrels and carriers whose UniProt entries often lack TRANSMEM
    # features; they satisfy the rule through their family instead.
    requires_any_of:
      - {id: IPR023614, label: Porin domain superfamily}
      - {id: IPR001702, label: "Porin, Gram-negative type"}
      - {id: IPR036942, label: "TonB-dependent receptor-like, beta-barrel domain superfamily"}
      - {id: IPR036777, label: "Nucleoside-specific channel-forming protein, Tsx-like superfamily"}
      - {id: IPR023395, label: Mitochondrial carrier protein domain superfamily}
      - {id: IPR003423, label: Outer membrane efflux protein}
      - {id: IPR003369, label: "Sec-independent protein translocase protein TatA/B/E, N-terminal"}
      - {id: IPR005821, label: Ion transport domain}
    strength: REQUIRED
    status: PILOT
    rationale: >-
      A transmembrane transporter provides the path across the membrane, which needs
      membrane-spanning helices or beta strands. Periplasmic substrate-binding proteins,
      the nucleotide-binding subunits of ABC transporters and F1 ATPase subunits have
      none; they contribute to the complex's activity but do not enable it alone.
    expected_exceptions: >-
      UniProt sometimes lacks TRANSMEM features for beta-barrel or poorly characterized
      membrane proteins; such rows need a manual check rather than removal.

  - id: FRR:0005
    title: Protein kinase activity requires a known protein kinase fold
    term: {id: GO:0004672, label: protein kinase activity}
    include_descendants: true
    qualifiers: [enables]
    requires_any_of:
      - {id: IPR011009, label: Protein kinase-like domain superfamily}
      - {id: IPR036890, label: Histidine kinase/HSP90-like ATPase superfamily}
      - {id: IPR027417, label: P-loop containing nucleoside triphosphate hydrolase}
      - {id: IPR005702, label: "Tyrosine-protein kinase Wzc-like, C-terminal domain"}
      - {id: IPR012893, label: "HipA-like, C-terminal"}
      - {id: IPR003812, label: Fido domain}
      - {id: IPR034907, label: Nucleoside diphosphate kinase-like domain}
      - {id: IPR005177, label: Bifunctional kinase-pyrophosphorylase}
      - {id: IPR023660, label: Protein arginine kinase}
      - {id: IPR008207, label: "Signal transduction histidine kinase, phosphotransfer (Hpt) domain"}
      - {id: IPR010452, label: Isocitrate dehydrogenase kinasephosphatase}
      - {id: IPR014374, label: "Protein kinase, T7-type, autographiviridae"}
    strength: ADVISORY
    status: PILOT
    rationale: >-
      Protein phosphorylation is catalysed by the eukaryotic-like protein kinase fold,
      the GHKL fold of histidine kinases, P-loop bacterial tyrosine and serine kinases,
      HipA, Fic/Doc, NDP kinase, the PPDK regulatory protein, the McsB arginine
      kinase and AceK; Hpt phosphotransfer proteins carry the histidine phosphotransfer
      kinase descendant term. Proteins with none of these, such as metabolic kinases with reported
      protein-kinase side activities or receptor ectodomains, need an explicit argument.
    expected_exceptions: >-
      Reported protein kinase activity of metabolic kinases (phosphoglycerate kinase,
      pyruvate kinase M2, PEPCK) is contested rather than impossible.

  - id: FRR:0006
    title: ATP hydrolysis activity usually requires a known ATPase fold
    term: {id: GO:0016887, label: ATP hydrolysis activity}
    include_descendants: true
    qualifiers: [enables]
    requires_any_of:
      - {id: IPR027417, label: P-loop containing nucleoside triphosphate hydrolase}
      - {id: IPR043129, label: "ATPase, nucleotide binding domain"}
      - {id: IPR036890, label: Histidine kinase/HSP90-like ATPase superfamily}
      - {id: IPR011761, label: ATP-grasp fold}
      - {id: IPR013651, label: "ATP-grasp fold, RimK-type"}
      - {id: IPR001757, label: P-type ATPase}
      - {id: IPR002423, label: Chaperonin Cpn60/GroEL/TCP-1 family}
      - {id: IPR000407, label: Nucleoside phosphatase GDA1/CD39}
      - {id: IPR011009, label: Protein kinase-like domain superfamily}
    strength: ADVISORY
    status: PILOT
    rationale: >-
      Most ATP hydrolysis coupled to work is done by P-loop NTPases, actin/Hsp70-fold
      ATPases, GHKL ATPases, ATP-grasp enzymes, P-type ATPases and chaperonins, and
      apyrases of the GDA1/CD39 family hydrolyse ATP as nucleotide scavengers. Atypical
      kinases of the UbiB/COQ8 family hydrolyse ATP on a protein kinase-like fold. A
      structural protein with none of these, such as F-plasmid TraB, should not carry
      the term.
    expected_exceptions: >-
      Triphosphate tunnel metalloenzymes, metallophosphoesterases, alkaline phosphatases
      and some apyrases hydrolyse ATP on other scaffolds.
    supported_by:
      - reference_id: file:ECOLI/traB/traB-hypotheses/function-hypothesis-go-0016887/openscientist.md
        supporting_text: P41067 lacks a Walker-A / P-loop motif

  - id: FRR:0007
    title: Phosphonoacetate hydrolase activity requires the alkaline phosphatase superfamily fold
    term: {id: GO:0047400, label: phosphonoacetate hydrolase activity}
    include_descendants: true
    qualifiers: [enables]
    requires_any_of:
      - {id: IPR017850, label: "Alkaline-phosphatase-like, core domain superfamily"}
      - {id: IPR012710, label: Phosphonoacetate hydrolase}
    strength: ADVISORY
    status: PILOT
    rationale: >-
      The characterized phosphonoacetate hydrolase (PhnA of Pseudomonas fluorescens 23F)
      is a binuclear-metal enzyme of the alkaline phosphatase superfamily. E. coli YjdM,
      historically named phnA, is an unrelated zinc-ribbon protein.
    supported_by:
      - reference_id: file:ECOLI/yjdM/yjdM-hypotheses/function-hypothesis-go-0047400/openscientist.md
        supporting_text: YjdM is a small (111-amino-acid) dual zinc-ribbon protein

  - id: FRR:0008
    title: Phosphogluconate 2-dehydrogenase activity requires an NAD(P)-binding domain
    term: {id: GO:0008114, label: phosphogluconate 2-dehydrogenase activity}
    include_descendants: true
    qualifiers: [enables]
    requires_any_of:
      - {id: IPR036291, label: NAD(P)-binding domain superfamily}
    strength: ADVISORY
    status: PILOT
    rationale: >-
      The reaction is an NAD(P)-dependent reduction of 2-dehydro-6-phosphogluconate,
      carried out by Rossmann-fold dehydrogenases. A broader rule for all NAD(P)-dependent
      CH-OH oxidoreductases (GO:0016616) fails, because isocitrate dehydrogenases, IMP
      dehydrogenase and iron-dependent alcohol dehydrogenases use other folds; the rule
      is therefore kept at this specific term.
    supported_by:
      - reference_id: file:PSEPK/kguE/kguE-hypotheses/function-hypothesis-go-0008114/openscientist.md
        supporting_text: zero oxidoreductases** — the family is exclusively EC class 4 (lyases/dehydratases) and class 5 (isomerases/epimerases)

  - id: FRR:0009
    title: DNA-binding transcription factor activity requires a DNA-binding domain
    term: {id: GO:0003700, label: DNA-binding transcription factor activity}
    include_descendants: true
    qualifiers: [enables]
    requires_any_of:
      - {id: IPR009057, label: "Homeodomain-like superfamily"}
      - {id: IPR036388, label: "Winged helix-like DNA-binding domain superfamily"}
      - {id: IPR036236, label: "Zinc finger C2H2 superfamily"}
      - {id: IPR036638, label: "Helix-loop-helix DNA-binding domain superfamily"}
      - {id: IPR046347, label: "Basic-leucine zipper domain superfamily"}
      - {id: IPR004827, label: Basic-leucine zipper domain}
      - {id: IPR008917, label: "Transcription factor, Skn-1-like, DNA-binding domain superfamily"}
      - {id: IPR018608, label: Global transcription regulator}
      - {id: IPR001628, label: "Zinc finger, nuclear hormone receptor-type"}
      - {id: IPR036864, label: "Zn(2)-C6 fungal-type DNA-binding domain superfamily"}
      - {id: IPR010982, label: "Lambda repressor-like, DNA-binding domain superfamily"}
      - {id: IPR036910, label: "High mobility group box domain superfamily"}
      - {id: IPR008967, label: "p53-like transcription factor, DNA-binding domain superfamily"}
      - {id: IPR000679, label: "Zinc finger, GATA-type"}
      - {id: IPR004883, label: "Lateral organ boundaries, LOB"}
      - {id: IPR036879, label: "Transcription factor, MADS-box superfamily"}
      - {id: IPR016177, label: "DNA-binding domain superfamily"}
      - {id: IPR036955, label: "AP2/ERF domain superfamily"}
      - {id: IPR036093, label: "NAC domain superfamily"}
      - {id: IPR013854, label: "Transcription factor AP-2, C-terminal"}
      - {id: IPR036576, label: "WRKY domain superfamily"}
      - {id: IPR036578, label: "SMAD MH1 domain superfamily"}
      - {id: IPR009061, label: "Putative DNA-binding domain superfamily"}
      - {id: IPR036887, label: "HTH APSES-type DNA-binding domain superfamily"}
      - {id: IPR038096, label: "TEA/ATTS domain superfamily"}
      - {id: IPR013321, label: "Arc-type ribbon-helix-helix"}
      - {id: IPR009072, label: "Histone-fold"}
      - {id: IPR013087, label: "Zinc finger C2H2-type"}
      - {id: IPR005175, label: "PPC domain"}
      - {id: IPR036395, label: "Copper fist DNA-binding domain superfamily"}
      - {id: IPR007604, label: "CP2 transcription factor"}
      - {id: IPR015300, label: "DNA-binding pseudobarrel domain superfamily"}
      - {id: IPR017956, label: "AT hook, DNA-binding motif"}
      - {id: IPR000792, label: "Transcription regulator LuxR-like, C-terminal"}
      - {id: IPR016032, label: "Signal transduction response regulator, C-terminal effector"}
      - {id: IPR005333, label: "Transcription factor, TCP"}
      - {id: IPR013325, label: "RNA polymerase sigma factor, region 2"}
      - {id: IPR013324, label: "RNA polymerase sigma factor, region 3/4-like"}
      - {id: IPR000394, label: "RNA polymerase sigma factor 54"}
      - {id: IPR010992, label: "Integration host factor (IHF)-like DNA-binding domain superfamily"}
      - {id: IPR000647, label: "CTF transcription factor/nuclear factor 1"}
      - {id: IPR019548, label: "CTF transcription factor/nuclear factor 1, N-terminal"}
      - {id: IPR036431, label: "ARID DNA-binding domain superfamily"}
      - {id: IPR036407, label: "DM DNA-binding domain superfamily"}
      - {id: IPR008540, label: "BES1/BZR1 plant transcription factor, N-terminal"}
      - {id: IPR036893, label: "SBP domain superfamily"}
      - {id: IPR003851, label: "Zinc finger, Dof-type"}
      - {id: IPR038006, label: "Transcription factor COE, IPT domain"}
      - {id: IPR047091, label: "Ethylene insensitive 3-like, DNA-binding domain"}
      - {id: IPR036115, label: "GCM domain superfamily"}
      - {id: IPR001289, label: "Nuclear transcription factor Y subunit A"}
      - {id: IPR005559, label: "CG-1 DNA-binding domain"}
      - {id: IPR006628, label: "Purine-rich element binding protein family"}
      - {id: IPR003444, label: "Transcriptional regulator MraZ"}
      - {id: IPR007159, label: "SpoVT-AbrB domain"}
      - {id: IPR010919, label: "SAND-like domain superfamily"}
      - {id: IPR003120, label: "Transcription factor Ste12-like, N-terminal domain"}
      - {id: IPR006774, label: "BAF1 / ABF1 chromatin reorganising factor"}
      - {id: IPR004212, label: "GTF2I-like repeat"}
      - {id: IPR031972, label: "Cysteine/serine-rich nuclear protein, N-terminal domain"}
    strength: ADVISORY
    status: PILOT
    rationale: >-
      A DNA-binding transcription factor binds a specific DNA sequence itself, so it
      carries a sequence-specific DNA-binding domain. Coactivators, corepressors,
      chromatin enzymes, mediator subunits and signalling proteins regulate
      transcription without one and belong under transcription coregulator activity
      or a process term. The list covers the DNA-binding families found among the
      proteins with experimental annotations to this term.
    expected_exceptions: >-
      Transcription factors from small or poorly characterized DNA-binding families
      not yet in the list, and isoform or fragment entries without InterPro matches.

  - id: FRR:0010
    title: GTPase activity requires a P-loop or tubulin-family GTPase domain
    term: {id: GO:0003924, label: GTPase activity}
    include_descendants: true
    qualifiers: [enables]
    requires_any_of:
      - {id: IPR027417, label: "P-loop containing nucleoside triphosphate hydrolase"}
      - {id: IPR036525, label: "Tubulin/FtsZ, GTPase domain superfamily"}
      - {id: IPR000407, label: "Nucleoside phosphatase GDA1/CD39"}
    strength: ADVISORY
    status: PILOT
    rationale: >-
      GTP hydrolysis by signalling, trafficking, translation and cytoskeletal GTPases
      uses either the P-loop NTPase fold (Ras-like, heterotrimeric G alpha, dynamin,
      septin, translation factors) or the tubulin/FtsZ fold; nucleoside
      triphosphate diphosphohydrolases hydrolyse GTP as one of several nucleotides.
      GTPase-activating proteins, guanine nucleotide dissociation inhibitors and
      G beta/gamma subunits regulate GTPases without carrying the activity.
