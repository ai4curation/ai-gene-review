    - An affinity-purified antibody to the COOH terminus of CAR-1 (Fig. 1 A) detected two closely spaced bands on Western
      blots that were reduced by >95% by RNAi of car-1 (see Fig. 3 D). From the latter half of the first division onward,
      CAR-1 localized prominently to large particles that were similar in size and distribution to P-granules, which are enriched
      in the germline precursors and contain poly(A)+ RNAs and several proteins that are predicted to bind RNA (Strome and
      Wood, 1982; Seydoux and Fire, 1994).
    - By performing immunofluorescence in a strain expressing GFP:PGL-1 (Cheeks et al., 2004), we confirmed that a subset
      of CAR-1 colocalizes with PGL-1 to P-granules (Fig. 2).
    - CAR-1 localizes to P-granules and additional smaller cytoplasmic particles.
    - By metaphase of the first mitotic division, most particulate CAR-1 colocalized with PGL-1 in large P-granules in the
      embryo posterior.
    - In two- and four-cell-stage embryos, CAR-1 continued to colocalize with P-granules in the germline precursors, but numerous
      additional smaller CAR-1-containing particles also were evident throughout the cytoplasm of all cells (Fig. 2).
    - In summary, consistent with the RNA-binding motifs in its primary sequence, CAR-1 localizes to P-granules that are partitioned
      to the germline precursors and to smaller particles that are present in all cells of early embryos.
    - This result indicates that the CAR-1 Sm domain is dispensable for its localization to P-granules and smaller particles.
