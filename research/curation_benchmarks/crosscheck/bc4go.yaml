    bc4go_name: protein complex
    bc4go_evidence: NONE
    bc4go_sentences:
    - A complex containing the Sm protein CAR-1 and the RNA helicase CGH-1 is required for embryonic cytokinesis in Caenorhabditis
      elegans
    - CAR-1 localizes to germline-specific RNA-containing particles and copurifies with the essential RNA helicase, CGH-1,
      in an RNA-dependent fashion.
    - We show that CAR-1 is a component of a multiprotein complex that also contains the DEAD box RNA helicase, CGH-1, and
      a Y-box-containing protein, CEY-2.
    - CAR-1 associates with the essential RNA helicase CGH-1 and the Y-box-containing protein CEY-2
    - Protein complexes containing GFPLAP:CAR-1 were purified by immunoprecipitation with antibodies to GFP, released by cleavage
      with the tobacco etch virus protease, and reisolated by binding to S-protein agarose. Proteins eluted from the S-protein
      agarose with urea were analyzed by solution mass spectrometry. Under these stringent purification conditions, we obtained
      significant sequence coverage for CAR-1 and two additional proteins, the RNA helicase, CGH-1, and the Y-box domain-containing
      protein, CEY-2, which also is predicted to bind RNA (Fig. 4, A and B).
    - CAR-1 copurifies with two widely conserved RNA-binding proteins.
    - CAR-1 associates with the helicase, CGH-1, whose inhibition results in penetrant sterility.
    - The maternal effect nature of the car-1 deletion, together with the functionally important RNA-binding motifs in the
      CAR-1 sequence, its association with conserved RNA-binding proteins, and its localization to P-granules and smaller
      cytoplasmic particles in the gonad and early embryo, is consistent with a model in which CAR-1 functions to regulate
      a specific set of maternally supplied RNAs.
    - CAR-1 forms a conserved complex with a DEAD box RNA helicase and a Y-box protein
    - CAR-1 copurifies with the essential DEAD box RNA helicase, CGH-1, and the Y-box protein, CEY-2.
