    bc4go_sentences:
    - Inhibition of CAR-1 by RNA-mediated depletion or mutation results in a specific defect in embryonic cytokinesis. This
      cytokinesis failure likely results from an anaphase spindle defect in which interzonal microtubule bundles that recruit
      Aurora B kinase and the kinesin, ZEN-4, fail to form between the separating chromosomes.
    - Cumulatively, our results suggest that CAR-1 functions with CGH-1 to regulate a specific set of maternally loaded RNAs
      that is required for anaphase spindle structure and cytokinesis.
    - Depletion of CAR-1 results in a specific defect in the microtubule cytoskeleton that becomes pronounced after anaphase
      onset, when assembly of interzonal microtubule bundles is impaired severely and cytokinesis fails.
    - Cumulatively, our results suggest that CAR-1 functions with CGH-1 to regulate a specific set of RNAs that is required
      for anaphase spindle structure and cytokinesis during early embryogenesis.
    - CAR-1-depleted embryos exhibit a pronounced defect in anaphase spindle structure
    - At anaphase onset, a dramatic defect was apparent in CAR-1-depleted embryos; the spindle poles separated abruptly and
      prematurely, and the interzonal microtubule bundles that normally form between the separating chromosome masses were
      not detectable (Fig. 6 A, arrows in 100-s panel).
    - These results indicate that CAR-1 is required for assembly of the anaphase spindle; this may explain the nature of the
      cytokinesis defect that is observed in CAR-1-depleted embryos.
    - CAR-1 depletion results in a pronounced defect in anaphase spindle structure.
    - In CAR-1-depleted embryos, interzonal microtubule bundles are absent or reduced significantly.
    - The presence of normal levels of Aurora B on chromosomes, and of ZEN-4 on meiotic midbody microtubules in CAR-1-depleted
      embryos (Fig. 7 C), suggests that that the failure of interzonal microtubule bundle formation in CAR-1-depleted embryos
      is not due to destabilization of Aurora B or ZEN-4.
    - Based on these results, we conclude that the failure to form interzonal microtubule bundles that can recruit AIR-2 and
      ZEN-4 is not a secondary consequence of premature spindle elongation, but is a primary defect in CAR-1-depleted embryos.
    - These results suggest that CGH-1 and CAR-1 coordinately regulate anaphase spindle structure during embryonic cytokinesis,
      and support the idea that CAR-1 is required for only a subset of CGH-1 functions.
    - Here we show that inhibition of the C. elegans Scd6 family member, CAR-1, results in a dramatic defect in anaphase spindle
      structure and failure to complete cytokinesis during early embryogenesis.
    - Because the dynamics of cytoskeletal polymers are very sensitive to the concentration of their regulators, it seems
      possible that the anaphase spindle defect in CAR-1-depleted embryos results from the translational misregulation of
      a component of the microtubule cytoskeleton.
    - In CAR-1-depleted embryos, which lack interzonal microtubule bundles, a primary furrow initiates ingression from one
      side of the embryo with a rate similar to the wild type.
