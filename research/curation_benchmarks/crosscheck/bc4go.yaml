      that is required for anaphase spindle structure and cytokinesis.
    - Depletion of CAR-1 results in a specific defect in the microtubule cytoskeleton that becomes pronounced after anaphase
      onset, when assembly of interzonal microtubule bundles is impaired severely and cytokinesis fails.
    - Cumulatively, our results suggest that CAR-1 functions with CGH-1 to regulate a specific set of RNAs that is required
      for anaphase spindle structure and cytokinesis during early embryogenesis.
    - Maternally loaded CAR-1 is essential for cytokinesis during early embryogenesis
    - Cytokinesis fails in car-1 mutant embryos.
    - 45 h after injection, when Western blotting revealed that CAR-1 was >95% depleted (e.g., see Fig. 3 D), >99% embryonic
      lethality was observed (e.g., see Fig. 3 F). Analysis of the depleted embryos by DIC confirmed the cytokinesis defect
      that was reported by Zipperlen and coworkers (2001) (Fig. 1 B; see Videos 1 and 2).
    - 45 h after injection, when Western blotting revealed that CAR-1 was >95% depleted (e.g., see Fig. 3 D), >99% embryonic
      lethality was observed (e.g., see Fig. 3 F). In a minority of cases (n = 9/50), the first cytokinesis succeeded, but
      subsequent divisions failed, which accounted for the penetrant embryonic lethality.
    - Embryos laid by homozygous car-1 mutant mothers exhibited a cytokinesis defect identical to that observed in embryos
      that were depleted of CAR-1 by RNAi (Fig. 1 C; Video 1; Video 3, available at http://www.jcb.org/cgi/content/full/jcb.200506124/DC1).
