  summary: Return ITIH1/ITIH2 vesicle rows to non-core; derive the CAT5 check's GO
    terms from the ontology
  details: |
    Sixth automated-review round on PR 4564. ITIH1 and ITIH2 have GO:0005540 hyaluronic acid binding (IDA, PMID:20463016), which GO places under carboxylic acid binding rather than glycosaminoglycan binding, so the id/name lists missed it. Both move to CAT5_BOUND (5 rows back to KEEP_AS_NON_CORE, files restored byte-exact). ITIH3 keeps CAT5 with a note on its hedged UniProt role. apply_decisions.py now takes binding terms from GO via oaklib (is_a descendants of GO:0008289, GO:0005539, GO:0043394, GO:0071813, GO:0120013, GO:7770043, plus GO:0005540), scans unhedged UniProt FUNCTION sentences for bind/binds/binding, and fails if a gene lacks a cached UniProt entry. Settled pass: 83 changed rows in 50 genes, 335 KEEP_AS_NON_CORE.
