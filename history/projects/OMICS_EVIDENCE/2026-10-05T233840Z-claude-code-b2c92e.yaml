  summary: Create OMICS_EVIDENCE from RCA_EVIDENCE; add HTP-family inventory
  details: |
    Merged RCA_EVIDENCE into a broader omics-evidence project at the user's request (RCA page and scripts moved to OMICS_EVIDENCE/rca.md and OMICS_EVIDENCE/rca/; reports regenerate identically). Added htp/htp_inventory.py: 65,876 HDA/HTP/HMP/HGI GOA rows (50,795 distinct gene x term pairs; annotation extensions inflate rows, e.g. 5 DUBs = 1,535 HMP rows) and 2,799 reviewed rows. Classified six uses of omics data; location rows are sound except vesicle cargo (6% accepted) and generic membrane (23%); function inferred from co-purification fails under either code (cadherin binding 2/50; RCA matrisome 56%); HDA-coded expression->process rows 0/9; NOT rows occur almost only under RCA. On the 12 papers cited under both codes, reviews accepted 74% of HDA location rows vs 56% of RCA function rows. HEP left to IEP. No gene reviews edited.
