  details: |
    Fifth automated-review round on PR 4564. SCGB1A1's exosome row (GO:0070062, PMID:23533145) stays MARK_AS_OVER_ANNOTATED with a per-protein reason: UniProt says it binds phosphatidylcholine and phosphatidylinositol, but as ligands in the homodimer's hydrophobic cavity (PubMed:7664082), not EV-surface association. apply_decisions.py's check of the CAT5 clause now also scans UniProt FUNCTION text for unhedged binds-lipid/GAG sentences and matches an explicit GO id list (incl. GO:0070300, GO:0030169, GO:0008035, GO:0019841), excluding receptor-binding terms; SCGB1A1 is the only hit. Gene records added for GM2A (withdrawal) and SCGB1A1. Counts unchanged.
