  summary: Record GO acceptance of JAK-STAT taxon constraints TPV-001 to TPV-003
  details: |
    Marked TPV-001, TPV-002 and TPV-003 ACCEPTED in proposed_taxon_constraints.yaml and added a submission block to each (tracker issue go-ontology#32689, submitted 2026-10-05, resolved 2026-11-03, commits 98389d1 and fed722d, PR #32861). GO added neverin:6231 (Nematoda) on GO:0007259 and GO:0046425 and onlyin:33208 (Metazoa) on GO:0007259, and renamed GO:0046425/6/7 to 'regulation of cell surface receptor signaling pathway via JAK-STAT'. The TPV-003 prerequisite (re-parenting GO:0007260) was not applied; GO:0007260 is listed for obsoletion in go-ontology#27064, noted as a loose end. Replaced the project page's 'no constraint today' text with an Outcome section and a status column linking the issue. Evidence read from the public GitHub issue, PR and commit pages.
