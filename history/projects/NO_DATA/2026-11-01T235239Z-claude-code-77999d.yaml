  summary: Align nd_search_support compliance credit with the nd_policy search rule
  details: |
    The nd_search_support compliance metric now uses a literature_search support mode that applies the same test as the nd_policy warning: a reason plus a publication (PMID, DOI, PMC) or the gene's deep-research or notes file. A citation of only the UniProt record no longer earns credit. Also recommends that a notes citation quote the queries and their result.
