  summary: Require a quote from the gene's own search record for an accepted ND
  details: |
    cites_search, shared by the nd_policy warning and the nd_search_support score, now counts a deep-research or notes file only when it is quoted in supported_by and lies in the review's own gene folder (symbol, accession, SYMBOL__ACCESSION, or the folder of the review's UniProt/GOA file). A bare filename, a file in additional_reference_ids or another gene's file no longer earns credit. Publications (PMID, DOI, PMC) count as before. On 2026-11-06 the warning flags 215 of 321 accepted ND rows in 153 reviews.
