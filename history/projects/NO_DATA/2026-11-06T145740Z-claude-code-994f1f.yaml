  summary: Require a quote from the gene's own search record for an accepted ND
  details: |
    cites_search, shared by the nd_policy warning and the nd_search_support score, now counts a deep-research or notes file only when it is quoted (nonblank supporting_text; supporting_text_fulltext does not count) in supported_by, is not a MOD gene description (-deep-research-sgd/-flybase/-wormbase), and lies in the review's own gene folder (taken from the review's path, which the validator now passes even under --no-goa, else the symbol, accession or SYMBOL__ACCESSION; references are not scanned, since a review may cite an ortholog's files; both file:ORG/GENE/ and file:genes/ORG/GENE/ forms). A bare filename, a file in additional_reference_ids or another gene's file no longer earns credit. Publications (PMID, DOI, PMC) count as before. On 2026-11-06 the warning flags 210 of 321 accepted ND rows in 150 reviews.
