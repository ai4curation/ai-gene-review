  summary: 'Create project: No Data (ND)'
  details: |
    Created the NO_DATA project page, which partitions ND (GO_REF:0000015) annotations into seven cases (stale or missed, not assayed but inferable, existence in question, true knowledge gap, ontology-blocked, tested and negative, bookkeeping artifact) with a proposed review action per case and a proposed nd_case slot plus validation coupling true-gap NDs to BIOLOGY knowledge_gaps with a matching dark_aspect. Added scripts/nd_inventory.py, which joins every reviewed ND row to GOA and UniProt and writes data/nd-inventory.yaml and data/nd-summary.md (361 ND rows in 237 reviews). GO rule text (GORULE:0000011, GORULE:0000054) was taken from the go-site rule files. Added an index card to pages/projects/index.html.
