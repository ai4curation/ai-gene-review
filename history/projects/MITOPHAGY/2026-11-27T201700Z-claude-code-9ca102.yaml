  summary: Refresh the MITOPHAGY slide deck to match the rewritten project page
  details: |
    Review follow-up on PR 6797. The manifest-linked deck projects/MITOPHAGY/slides/MITOPHAGY-slides.md still carried the pre-rewrite claims the same PR corrects on the page: SCOPING in the footer, 'Scoped, not started. No mitophagy module; PINK1 and PRKN are not reviewed', '8 of 14 listed candidates', mitophagy core only for OPTN/CALCOCO2/BNIP3L, and a Next steps slide asking for the PINK1/PRKN fetches and the module that already exist. Because the deck renders as a Slides pill directly under the page title, a reader was one click from the claim the PR exists to fix.
    Rewrote the deck against the review YAML on this branch rather than against the page prose: all 14 human candidates reviewed, 2,150 existing_annotations rows in total (PINK1 229, PRKN 427, OPTN 93, CALCOCO2 44, SQSTM1 272, TAX1BP1 51, NBR1 53, TBK1 218, BNIP3 179, BNIP3L 91, FUNDC1 46, PHB2 97, VCP 286, MFN2 64 -- BNIP3L had grown from the 63 the old deck quoted). Mitophagy is core in nine reviews, KEEP_AS_NON_CORE for SQSTM1 and MFN2, and absent from TAX1BP1, NBR1 and TBK1. Split the single mitophagy table into a core table (one representative row per gene with its evidence code and action, plus a note that PINK1's GO:1901525 negative-regulation row is the one marked over-annotated), a slide for the five non-core/absent genes, a molecular-function slide for the GO:0140580 convergence of BNIP3/BNIP3L/FUNDC1/PHB2 (checked against worm dct-1 and fndc-1), and a new module slide for MODULE:mitophagy. Next steps now mirror the page's remaining module work. Regenerated candidate-coverage.svg for the same numbers with a third 'reviewed, no mitophagy row' state; pink1-parkin-pathway.svg is biology only and was left alone. Re-rendered MITOPHAGY-slides.html with marp-cli 4.2.3 beside its source as the manifest convention requires.
    Left the earlier record 2026-11-23T200615Z-claude-code-3b3ce9 as AUDIT/needs_followup rather than retyping it EDIT/changed: it was accurate for the session it covers and docs/history.md says to append in that case, and this record is the followup it flagged. Added PR 6797 to its empty links.prs, which is fact completion and not a reclassification. No gene review, module or other curated content touched; projects/MITOPHAGY.md is unchanged by this session.
