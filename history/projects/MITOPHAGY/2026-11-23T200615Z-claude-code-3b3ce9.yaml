    Audited the 14 candidate genes and the module against the repository state. All 14 human candidate reviews now exist on main (PINK1, PRKN, BNIP3, FUNDC1 and MFN2 from PR #4427; PHB2 from PR #6675; the other eight from earlier Proteostasis-era batches), and modules/mitophagy.yaml models the pathway in five parts for human and C. elegans. The page still said 'scoped, not yet started', listed PINK1/PRKN as unreviewed and claimed no module existed. Rewrote the bottom line, the candidate table (adding review state, the core molecular function used for the mitophagy role, and how each review treats mitophagy process terms), added a Module section summarising MODULE:mitophagy and its boundary, and replaced the stub Project Status with the delivered items plus the remaining module-refinement work (fold in PHB2, decide on VCP and MFN2, GO-CAM cross-check, leave DRAFT). Statistics quoted on the page were computed from the review YAML, not copied from prior prose. No gene review, module or other curated content was edited.
