  summary: Set high-threshold mechanosensation policy
  details: |
    Updated the Mechanobiology mechanosensation evidence guide after the owner resolved the pressure-threshold policy: the project should not use a fixed pressure or membrane-tension cutoff, and should instead compare a high-threshold response with a known mechanosensor measured in a comparable assay. Removed the resolved threshold questions from the open-question list, kept the osmotic-BP and non-neuronal flow/compression modeling questions open, and revised response-term guidance for GO:0009612 and GO:0071260 to distinguish real peripheral responses from over-annotated downstream effects.
