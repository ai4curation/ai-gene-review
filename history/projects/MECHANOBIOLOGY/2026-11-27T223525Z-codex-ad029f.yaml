  summary: Add PKD2L1 high-threshold pressure-clamp comparison
  details: |
    Updated the Mechanobiology evidence guide to make the PKD1L1/PKD2L1 pressure-clamp example explicit: PMID:24336289 found no single-channel response at 0-60 mm Hg and an increase only at 80-100 mm Hg, in contrast to the approximately 28-31 mm Hg P50 range reported for mouse Piezo1 in PMID:20813920. Kept the numeric cutoff as an open question for cmungall rather than settling a hard threshold.
