  details: |
    Recorded batch 1 results: 37 gene reviews (human TLR1-10, CD14, LY96, UNC93B1, MYD88, TIRAP, TICAM1, IRAK4; mouse Tlr11-13; chicken TLR15, TLR21; zebrafish tlr5b, tlr21, tlr22; Drosophila spz, Tl, 18w, Toll-7, Myd88, tub, pll, cact, dl, Dif; worm tol-1; Nematostella MyD88), 2,734 existing annotations plus 14 NEW, each later cross-checked against Falcon deep research. Added per-gene action table, cross-gene findings (fly Toll-pathway term on human IRAK4/MYD88 by IBA; LPS receptor terms on non-LPS TLR partners; PMID:19593445 mis-cited on six genes; mouse Tlr11/Tlr12 literature-name swap), a proposed batch 2, regenerated checklist (65/202 reviewed), corrected accessions in the TLR family table, and pinned chicken TLR15/TLR21 accessions. Resolver now prefers reference-proteome entries.
