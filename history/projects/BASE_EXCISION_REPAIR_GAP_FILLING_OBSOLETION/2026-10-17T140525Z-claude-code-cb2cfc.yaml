    Second round of PR-review corrections on #5102. The sequencing was wrong: all three affected rows are Reactome TAS, so their term is whatever Reactome's pathway-to-GO export emits, and existing_annotations is validated against the regenerated GENE-goa.tsv where a row with no matching GOA entry is a blocking ERROR (validate_against_goa in src/ai_gene_review/validation/validator.py). Editing a review file after the GO release but before the Reactome remap and a fresh just fetch-gene would therefore fail validation, not merely jump the gun. Reordered the proposed approach so the two upstream steps come first and explicitly gate the in-repo step, which now lists all three gates; followed the ALKYL_HYDROPEROXIDE_REDUCTASE_OBSOLETION precedent of sequencing on the GOA pull. Changed the ADPRS instruction from retaining the row to deleting it once GOA drops it, with the compartment reasoning moved to ADPRS-notes.md so the analysis survives. Dropped the 'only ADPRS is mechanical' framing, which no longer holds. Replaced the propagation_rows.py line-number citation with the function name. Added a frontmatter comment stating that the genes list is the scope of the remap rather than a coverage claim. Updated the tracking issue #5103 with the same ordering and the PARG softening.
