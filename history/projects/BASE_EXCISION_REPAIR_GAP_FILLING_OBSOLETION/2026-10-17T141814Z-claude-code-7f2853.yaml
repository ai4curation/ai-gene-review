  details: |
    Third round of PR-review corrections on #5102, both about the mechanics of the in-repo edits rather than their sequencing. (1) A GOA-sourced existing_annotations term id is never rewritten (CLAUDE.md), so 'change the row id' was wrong in both the impact table and the approach. The obsoletion-specific form is stated in projects/ENTNER_DOUDOROFF_OBSOLETION.md and executed in genes/PSEPK/edd/edd-ai-review.yaml, which still carries the obsolete GO:0009255 as its row id with action MODIFY and proposed_replacement_terms GO:0061678. Rewrote the plan as three phases with distinct gates: MODIFY plus proposed_replacement_terms needs nothing and is doable now; FEN1's core_functions directly_involved_in entry needs a GO release linkml-term-validator resolves because author-supplied ids are hard validated; only the rows' own terms wait on a Reactome remap plus just fetch-gene. (2) Replaced the 'delete the ADPRS row' instruction with the documented retirement path: docs/goa_source_refresh.md directs setting retired: true, retaining the original source and review, and not deleting the historical record, and GOAValidator skips retired rows, so an orphaned retired row is not a validation error. This also keeps the compartment analysis attached to the row it explains instead of relocating it. (3) Verified phase 1 locally rather than asserting it: a probe adding action MODIFY with proposed_replacement_terms GO:7770138 to the FEN1 row left just validate human FEN1 passing even though GO:7770138 is absent from the ontology cache (proposed_replacement_terms has a plain Term range, not enum-bound), and added exactly one warning - 'Process term GO:0006287 is not reflected in existing_annotations', pointing at the core_functions entry that phase 2 fixes. The probe was reverted; FEN1 is unchanged in this PR. Also dropped a citation that named validate_against_goa against the wrong file, and reframed Priority and Status so the phase-1 work is not described as upstream-blocked.
