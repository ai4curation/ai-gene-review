  details: |
    Revised after automated PR review on #5102. (1) Added a section making explicit that GO:0006287 named a gap-filling STEP while GO:7770137/GO:7770138 name SUB-PATHWAYS (is_a GO:0006284, definitions spanning incision through ligation, shared comment stating both branches include the glycosylase and incision steps). Reworked the two judgments that depended on the old scope: the PARG row is now 'needs review, fall back to GO:0006284' rather than a drop, since the only argument against it was that PARG performs no gap-filling step, and R-HSA-110373's summary places PAR metabolism inside the sub-pathway ('in the presence of PARP1 or PARP2, FEN1 and DNA ligase I') though it names the writers rather than PARG; the ADPRS drop stands on the compartment argument, which the scope shift does not touch. Rewrote the APEX1 recommendation so the proposed new reason is that R-HSA-73933 is the branch-agnostic parent pathway, not that APEX1 does not fill the gap, which would also argue against GO:0006284 that APEX1 holds by IDA. (2) Checked GO_REF:0000120 rather than assuming: it is UniProt's combined multi-method IEA reference, not a projection pipeline, but all 120 rows for this term are UniProt-assigned and each carries a UniProtKB donor, an ensembl protein id and a PANTHER node, with donors only Q07864 (POLE, 64) and P28340 (POLD1, 56) - so they do follow the POLD1/POLE decisions, consistent with the repo's own classifier gate in propagation_rows.py:125. (3) Corrected the PAINT node counts from a page-1-only sample (115/85) to the fully paginated 121/93 = 214. (4) Added TAIR 1 to the assigning-group list, which now sums to 9,941. (5) Replaced the '14 gene products holding the term' figure, which was the frontmatter genes count, not the annotation set. (6) Noted that the FEN1 core_functions slot holds both GO:0006287 and GO:0006284, so the pair must collapse to GO:7770138 rather than the id being swapped in place; that the APEX1 text needing revision is the summary as well as the reason; that 'drop' for ADPRS means minting no replacement row and is not licence to flip MARK_AS_OVER_ANNOTATED to REMOVE; that executors should grep each file for further occurrences; that none of the ten experimental PMIDs is cached; and that the unusual GO:77701xx allocation is worth confirming with the ontology editors.
