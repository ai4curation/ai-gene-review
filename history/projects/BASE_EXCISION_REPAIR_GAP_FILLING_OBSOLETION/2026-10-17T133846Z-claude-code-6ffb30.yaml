  details: |
    Scoped the obsoletion of GO:0006287 base-excision repair, gap-filling from go-annotation#6627. Verified the two replacement terms (GO:7770137 short-patch base-excision repair, GO:7770138 long-patch base-excision repair, both is_a GO:0006284) from the merged go-edit.obo diff in go-ontology PR #32765; OLS has not yet served them and still reports GO:0006287 as non-obsolete. Inventoried all 9,941 annotations via the QuickGO annotation and stats APIs: 9,689 IEA (9,437 TreeGrafter, 132 Ensembl Compara, 120 GO_REF:0000120), 214 IBA, 14 TAS, 10 ISO, 7 IDA, 3 ISS, 3 IMP, 1 ISA. The 214 IBA rows trace to two PAINT nodes (PTN000035478 seeded by POLD1, PTN000072300 seeded by POLE), both long-patch, and a 800-row sample of the TreeGrafter tail is entirely pol delta/epsilon catalytic-subunit orthologs. Resolved all four Reactome pathway-to-GO mappings via the ContentService and proposed per-mapping destinations: R-HSA-110381 and R-HSA-5649702 (single-nucleotide) to GO:7770137, R-HSA-110373 (multiple-nucleotide patch) to GO:7770138, R-HSA-73933 (parent AP-site pathway) to GO:0006284; recommended dropping rather than remapping the PARG and ADPRS rows. Fetched PubMed titles for the 10 experimental rows and assigned branch destinations where the title settles patch length, flagging the four PMID:15177179 rows and the two pol lambda rows as needing full text. Flagged two MGI data queries: the IDA on P54098 (DPOG1_HUMAN) where mouse Polg is P54099, and a mouse Poll ISA whose WITH/FROM is that same human POLG accession. Repo impact is three reviews, all Reactome TAS: FEN1 to GO:7770138 (including its core_functions directly_involved_in slot), APEX1 to GO:0006284 with its reason corrected, ADPRS dropped. Noted a discrepancy between the tracker's 85 IEA count and QuickGO's 9,689. Also recorded that the created labels differ from the requested ones in go-ontology#32759.
