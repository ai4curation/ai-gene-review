    Created the PROTISTS project page covering eukaryotes outside animals, fungi and land plants. Inventoried existing protist gene folders (about 104 of 7,176, 62 Dictyostelium), built a GOA census of experimental and IBA annotation counts for 15 protist strains from the QuickGO API, organised the work into eight lineage tracks (three delegated to existing projects), and seeded 30 genes whose accessions were checked against the UniProt REST API. Added the project card to the projects index and rendered the page.
