  details: |
    Created the EXECUTABLE_MODELS project as the follow-on to BOOLEAN_MODELS. Schema: added declarative activation_logic (all_of/any_of/none_of over element references) on ModuleNode and ModuleAnnoton, and executable_models on ModuleReview (ExecutableModel with model_type BOOLEAN/KINETIC/CONSTRAINT_BASED/AGENT_BASED, derivation DERIVED_FROM_MODULE/EXTERNAL, files, evidence, and ModelScenario entries with settings, removed_connections and attractor expectations). Code: module_boolean honours activation_logic and removed connections with consistency checks against the declared connections; new module_dynamics finds asynchronous attractors by exhaustive enumeration (cross-checked against biodivine-aeon on the ERK module: one 188-state cyclic attractor), runs declared scenarios and exports a browser payload; new render_models writes an interactive in-browser page per derived Boolean model and a cross-module index under pages/models/, rendered with the module pages; module pages gain an Executable models card and the module index a Models column and filter; module_validator.validate_executable_models makes failed scenario expectations and inconsistent activation_logic blocking errors. Tests: tests/test_module_dynamics.py, tests/test_render_models.py. Corpus count (module-to-bnet --all, 364 modules): 159 steps in 100 modules have two or more activators and default to OR; recorded as a curation audit in the roadmap.
