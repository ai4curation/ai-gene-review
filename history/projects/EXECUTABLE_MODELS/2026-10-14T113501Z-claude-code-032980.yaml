  details: |
    Qualified the Grieco 2013 comparison as agreement in attractor kind, not mechanism. Validator: validate_executable_models now returns (errors, warnings); a scenario whose removed_connections break an activation_logic, or whose model exceeds the exhaustive-enumeration limit, is reported as a scenario failure instead of raising and aborting the batch; scenarios on external or non-Boolean models warn that they are not checked; missing model files are errors. In-browser pages are capped at 14 variables (the page re-enumerates all states on each toggle). run_scenario reuses iter_connections. Added tests for each, including the expected_oscillating slot.
