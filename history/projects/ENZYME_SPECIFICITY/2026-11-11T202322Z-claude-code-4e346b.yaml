  summary: Add Kinateder 2024 specificity-fingerprint check
  details: |
    Added ai_gene_review.validation.specificity_fingerprint and conf/specificity_fingerprints.yaml. The check aligns a query to a curated reference protein and reads residues at function-deciding positions from an alanine scan (Kinateder et al. 2024, PMID:38284491). First fingerprint: HAD histidinol-phosphate phosphatase PA0335 (Q9I6F6), D16/D18/Y47 required, Y57/T113 supporting, minimum identity 45%. PP_5147 (Q88CN3) carries the full fingerprint; M. jannaschii SerB (Q58989) is reported LOW_IDENTITY. Added curation principle 6 and a dated note. No gene review files were edited.
