  summary: Add Schnoes 2009 trusted-cutoff check and evaluation
  details: |
    Added ai_gene_review.validation.enzyme_family_cutoff, which scores a UniProt protein against NCBIfam family HMMs carrying an annotated EC/GO activity and compares scores with each model's trusted and noise cutoffs (steps 2 and 4 of Schnoes et al. 2009, PMID:20011109). Ran it over 38 electronic enzyme rows from 20 P. putida reviews plus human HADH (projects/ENZYME_SPECIFICITY/cutoff-check/). 11/12 ACCEPT rows with a model passed TC; 11/14 REMOVE rows with a model failed. Disagreements: pyrC' pseudoenzyme passes (needs residue check), metXS overlapping MetX donor families, PP_2325 paralog with ortholog biochemistry, human HADH below prokaryote-calibrated TC. No gene review files were edited.
