  details: |
    check_release_table.py now maps GO terms that cross-reference only Rhea to an EC through Rhea's rhea2ec.tsv and rhea-directions.tsv, when the term's Rhea reactions reach exactly one complete EC and it carries no partial EC (generic terms such as ATP hydrolysis and GTPase activity are excluded). 72 more pairs are compared (2919 in all); 68 agree, and the 4 that do not are triaged (Kce term on two acetyl-CoA transferases: wrong reaction; NadN and YfiH second activities: acceptable). Rhea-linked terms also count as candidates for the model's EC, so the adenosine deaminase models now list GO:0004000. All 84 class-term leads are triaged under class_term_triage (25 wrong-reaction and 2 wrong-cofactor entries, 14 to check, 21 acceptable), checked for coverage by render_feedback.py and listed in a new FEEDBACK.md section. Three earlier review nits fixed (ancestry-column caveat, CANDIDATES lead sentence, redundant continue). Rhea table checksums recorded. No review changes.
