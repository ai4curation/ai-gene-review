- type: EDIT
  outcome: changed
  summary: Record cross-aspect redundancy as over-annotation pattern 9
  details: |
    Closes the last documentation item on issue #2747: record the general pattern behind the tRNA aminoacylation obsoletion, that 'prefer the more specific term' is not unconditional and that cross-aspect redundancy can reveal a BP encoding MF-level specificity.

    Adds category 9, specificity that restates another aspect. The problem is a term more specific than its parent whose only added content is a fact already asserted in a different GO aspect; the shorthand then pushes a reviewer toward a term carrying no extra information, and in the worst case toward marking the correct parent as over-annotated. GO's own obsoletion comments are the authority quoted: each of the 42 amino-acid-specific terms says the term restates an existing molecular function and adds nothing beyond it, and 40 of them carry a replaced_by naming the compartment-level process. The section scopes that quotation to the 42 and sets GO:0070681 aside in its own paragraph, because that term was obsoleted as an out-of-scope pathway variant, its MF counterpart is GO:0050567, and it carries consider targets rather than a replaced_by. An earlier draft of this section counted it among the 43 and generalised the quoted rationale across all of them.

    The section spends as much space on what the pattern is not, because the obvious misreading is an argument against specificity in general. Compartment specificity came through the same obsoletion untouched: GO:0070127 is still live and still an is_a child of GO:0006418, because no MF term says where a reaction happens, so a mitochondrial synthetase should still be refined off the parent. The test offered is whether the added content is already carried elsewhere, not how deep the term sits.

    Recommended curation principle 1 is qualified in the same edit. It read 'Always prefer the most specific accurate term', which is exactly the belief this obsoletion overturned, so leaving it unchanged beside a section arguing the opposite would have put the page in contradiction with itself.

    The examples name the four reviews that actually made the inverted judgement, each of which has since been migrated: PSEPK/glnS and PSEPK/gltX marking GO:0006418 over-annotated, PSEPK/serS modifying it to GO:0006434, human/AARS1 modifying it to GO:0006419, all four now accepting GO:0006418 with it in core_functions; plus human/AARS2 and HORSE/DARS2 proposing a now-obsolete mitochondrial child. Correcting an earlier draft of this section, which said 15 PSEPK synthetases had made the judgement and implied they still did: the four are what AMINO_ACID_ACTIVATION_OBSOLETION.md audited, and the fifteen in that page is its separate count of reviews touching the obsoleted terms at all. The paragraph now also says this was a minority judgement, since PSEPK/valS and most other synthetase reviews accepted GO:0006418 throughout. Also adds the two reviews as exemplar rows and extends the frontmatter species and genes lists, and spells the horse mention HORSE/DARS2 so the per-mention autolink convention resolves it: bare DARS2 exists in both genes/human and genes/HORSE, and human is first in the page's species list. Renders clean.
- type: EDIT
  outcome: changed
  summary: Record the go-edit.obo provenance for the term ids this page now asserts
  details: |
    Appended rather than rewritten, in two later commits on PR #6131, so the record states where the page's ontology claims were read from. The first event's text stands as written.

    Provenance for every GO id the page now names, all read from go-edit.obo on the geneontology/go-ontology master branch: the 20 cytosolic terms carry replaced_by GO:0006418 and the 20 mitochondrial ones replaced_by GO:0070127, so 42 of the 43 carry a replaced_by and 40 of those name the compartment-level process; GO:0061475 and GO:1990762, the two compartment-qualified cytosolic variants, carry replaced_by GO:7770128 tRNA aminoacylation for cytosolic protein translation; and GO:0070681 carries consider GO:0043039 and consider GO:0050567 with no replaced_by.

    GO:7770128 is the one id on the page with no other in-repo trace: it has no cache/go/terms.csv row and is absent from the pinned snapshot in modules/bacterial_aminoacyl_trna_charging-analysis, because nothing in kb binds it and no validator run will therefore cache it. Its stanza was read twice, the second time because its neighbour GO:7770127 is a real and different term, cytosolic protein biosynthetic process, which GO:7770128 is part_of; a transposition against GO:0070127 tRNA aminoacylation for mitochondrial protein translation would have hidden exactly there. The derived cache is deliberately not hand-edited to add a row for it.

    The GO:0070681 paragraph gained a clause on GO:0070680 asparaginyl-tRNAAsn biosynthesis via transamidation, the structural twin its own comment names. That term was obsoleted on its own ticket, go-ontology#31932 against #15375 for the Gln term, and replaced by GO:0070981 L-asparagine biosynthetic process, which is not a tRNA term. It is not one of the 43. The clause exists so that a reader opening the pinned snapshot and finding 22 stanzas can account for them as the 20 cytosolic terms plus both transamidation terms.

    Also in these commits: all three DARS2 references now resolve to the horse entry. The frontmatter genes entry became HORSE/DARS2, and the Overview sentence uses an explicit gene tag so the prose still reads "horse DARS2". Both genes/human/DARS2 and genes/HORSE/DARS2 exist, and resolve_frontmatter_genes takes the first species hint with a review, which is human here, so a bare symbol linked to the wrong entry with no warning. The second instance was introduced by the commit that fixed the first two, and was found by grepping the rendered HTML rather than the source.
