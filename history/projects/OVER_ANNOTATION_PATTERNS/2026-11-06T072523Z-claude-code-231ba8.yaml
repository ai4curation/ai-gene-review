- type: EDIT
  outcome: changed
  summary: Record cross-aspect redundancy as over-annotation pattern 9
  details: |
    Closes the last documentation item on issue #2747: record the general pattern behind the tRNA aminoacylation obsoletion, that 'prefer the more specific term' is not unconditional and that cross-aspect redundancy can reveal a BP encoding MF-level specificity.

    Adds category 9, specificity that restates another aspect. The problem is a term more specific than its parent whose only added content is a fact already asserted in a different GO aspect; the shorthand then pushes a reviewer toward a term carrying no extra information, and in the worst case toward marking the correct parent as over-annotated. GO's own obsoletion comments are the authority quoted: each of the 42 amino-acid-specific terms says the term restates an existing molecular function and adds nothing beyond it, and 40 of them carry a replaced_by naming the compartment-level process. The section scopes that quotation to the 42 and sets GO:0070681 aside in its own paragraph, because that term was obsoleted as an out-of-scope pathway variant, its MF counterpart is GO:0050567, and it carries consider targets rather than a replaced_by. An earlier draft of this section counted it among the 43 and generalised the quoted rationale across all of them.

    The section spends as much space on what the pattern is not, because the obvious misreading is an argument against specificity in general. Compartment specificity came through the same obsoletion untouched: GO:0070127 is still live and still an is_a child of GO:0006418, because no MF term says where a reaction happens, so a mitochondrial synthetase should still be refined off the parent. The test offered is whether the added content is already carried elsewhere, not how deep the term sits.

    Recommended curation principle 1 is qualified in the same edit. It read 'Always prefer the most specific accurate term', which is exactly the belief this obsoletion overturned, so leaving it unchanged beside a section arguing the opposite would have put the page in contradiction with itself.

    The examples are the reviews that actually made the inverted judgement, named as such: the 15 PSEPK synthetases and human AARS1 marking GO:0006418 over-annotated or modifying it to an amino-acid-specific child, and human AARS2 and horse DARS2 proposing a now-obsolete mitochondrial child. Also adds the two reviews as exemplar rows and extends the frontmatter species and genes lists, and spells the horse mention HORSE/DARS2 so the per-mention autolink convention resolves it: bare DARS2 exists in both genes/human and genes/HORSE, and human is first in the page's species list. Renders clean.
