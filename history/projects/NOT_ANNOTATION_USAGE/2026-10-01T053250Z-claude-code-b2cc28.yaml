    Created projects/NOT_ANNOTATION_USAGE.md with fetch and analysis scripts. Downloaded all 10,622 NOT annotations from QuickGO and the UniProt CAUTION notes for 7,369 NOT-annotated accessions. Classified NOTs by aspect, relation, evidence, assigning group and GO-ancestry term category, and joined with the actions taken in 270 negated rows across this repo's reviews. Key findings: MF (mostly catalytic) NOTs dominate and align with CAUTION notes (27% vs 7% for BP/CC-only); 490 non-defense 'response to' NOTs are led by IEP evidence; 169 NOTs are IEP-only; 627 are TAIR RCA localization calls; our reviews ACCEPTed 83% of NOTs. Draft guidance and a worklist of 9 reviewed NOTs are in the project page. Prompted by the FGFR4 'NOT response to bile acid' annotation.
