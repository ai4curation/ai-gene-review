- type: EDIT
  outcome: changed
  summary: Engine compiles complexes per unit; census reads accession steps by organism
  details: |
    module_logic now compiles a protein_complex annoton with active_units into an AND over one atom per unit, so any oracle can evaluate a complex and gaps name the missing unit. selector_census.py drops its own complex handling (complex_units, mixed_complex_steps) and evaluates an accession-only step in an organism when the classification file lists the accession or UniProt names that organism for it (cached in .cache/panther/uniprot-organisms.json; reported as accession_steps). Census rerun over 17 modules: compared with main's own code on the same modules, the only verdict change is the worm passing lysosome_related_organelle_biogenesis on GLO-3 (Q21045); gap lists in the LRO, phagosome and synaptic-vesicle modules now name units. The census also picks up #6736's new Tim50 step in mitochondrial_protein_import, which fails in chytrid, both kinetoplastids, Giardia, Trichomonas and Entamoeba. rule-evaluation.md replaces the Engine limitation section with a Protein complexes section and updates the LRO and import text; the plan ticks the GLO-3 item; coverage.yaml updates the LRO row.
