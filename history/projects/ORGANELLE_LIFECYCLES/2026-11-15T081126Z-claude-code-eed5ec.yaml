  details: |
    coverage.yaml: the phagosome row now records stages and the assessment. phagosome_maturation is Eukaryota-scoped but not rule-shaped: in PANTHER's release-19 classification files the human RAB5A, PIKFYVE and V0a isoforms fall outside its required Rab5 (PTHR24073:SF858), PIKfyve (PTHR45748:SF7) and V0a (PTHR11629:SF63) selectors, and its required RILP and LAMP steps hold only holozoan proteins. Its core is the endolysosomal machinery, so no phagosome rule module is planned; the core belongs to the endosome-maturation item of the lysosome and endosome row. No module file changed.
