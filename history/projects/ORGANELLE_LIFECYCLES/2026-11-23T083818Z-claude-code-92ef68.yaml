- type: EDIT
  outcome: changed
  summary: 'Review fixes: unit functions, conjunction contract, accession-step gaps'
  details: |
    From the review of #6751. module_logic: each complex-unit atom carries the unit's own function, or the complex annoton's when it has none, so function-keyed oracles and REALIZER inference still see the step. With this the modules unsatisfiable in every context fall from 144 on main to 28; none entered the set and 116 left it (computed with main's engine and this branch's over the same modules). The census gains gaps_on_accession_steps, marking per organism the gaps whose absent steps include an accession step from another organism, so the 20 non-nematode exchange-factor gaps of the LRO module are not read as observing GLO-3's absence; the page says so. A corpus test now checks that atoms sharing an id share their selector (44 modules reuse unit ids, all for the same participant). The schema states the active_units conjunction contract.
