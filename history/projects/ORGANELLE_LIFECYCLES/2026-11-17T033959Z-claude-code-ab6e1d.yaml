  details: |
    From the review of #6481. selector_census.py: fetch_interpro_domains caches only accessions UniProt returned, each with its UniProt release, and reports unanswered accessions; the census records them with the releases under domain_lookup for modules with domain steps; a family step whose domain has no InterPro id stops the run instead of passing on presence alone. The census was rerun; verdicts are unchanged and the acidocalcisome module gains domain_lookup (UniProt 2026_04, no unanswered accessions). rule-evaluation.md, the plan and coverage.yaml now describe the step as a VTC-domain subunit of PTHR46140:SF1 rather than a catalytic Vtc4, note the Plasmodium caveat and put Dictyostelium among genomes that fail but may have acidocalcisomes; the inositol pyrophosphate entry moved to the function stage; a follow-up to separate Vtc4 from SF1 Vtc2/Vtc3-type subunits was added to the plan.
