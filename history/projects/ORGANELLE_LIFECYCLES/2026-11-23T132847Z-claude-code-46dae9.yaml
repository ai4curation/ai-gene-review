    Adds contractile_vacuole_complex to the selector census (18 modules); the other 17 modules' census output is unchanged. The module is met in 21 of the 24 organisms, including human, the fly, the worm and both yeasts, none of which has a contractile vacuole; it fails in Arabidopsis and rice, whose RabA proteins sit in other PTHR47979 subfamilies, and in Thalassiosira on the V-ATPase G subunit, which it already lacks in the V-ATPase rule. rule-evaluation.md gains a section saying why this is the expected result for a descriptive module, the census command lists the module, and the matrix and full gap list are regenerated with the renderer (the model-organism triage skips descriptive modules). coverage.yaml gains a contractile vacuole row, and the plan ticks the contractile vacuole item and adds a follow-up for the unmodelled machinery.
