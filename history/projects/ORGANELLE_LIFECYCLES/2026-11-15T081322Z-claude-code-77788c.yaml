  summary: Assess synaptic_vesicle_cycle as an organelle rule
  details: |
    coverage.yaml: the synaptic vesicle row now records the assessment. In PANTHER's release-19 classification files the module's required steps are met by human, Drosophila, C. elegans and Nematostella; Trichoplax fails on synapsin alone and Monosiga on synapsin, SNAP25, VAMP and synaptotagmin. Its V-ATPase, syntaxin, clathrin and dynamin families occur across eukaryotes, and its SNAP25 and VAMP families well beyond animals. Marked RULE_CANDIDATE with weak discrimination; its Metazoa context includes sponges and placozoans, which lack the organelle. No module file changed.
