  details: |
    From the second review of #6751. Compiling a complex into its units broke 18 committed module audit scripts that pass on main: they key their oracles on the complex annoton id and expand active_units themselves. The engine now takes expand_complexes (default true); with false it compiles one atom per complex annoton, as main does, and each of the 18 scripts opts in with one line. Over all 61 committed scripts that import module_logic, exit codes now match main's (40 pass, 21 fail on both for reasons unrelated to the engine), and with a fixed hash seed their outputs are byte-identical apart from the recorded hashes of the edited scripts and of module_logic.py. Route merging and core-atom detection now compare atoms by value, not by node id, so a subunit that two complexes give different functions (the Drosophila RNase P and MRP subunits, the shared biotin carrier of acetyl- and propionyl-CoA carboxylase; 28 such atoms in 6 modules) stays two steps. The _compile_annoton docstring states that an inherited unit function is a contributes-to claim. The plan's GLO-3 item now says GLO-3 itself was not looked for outside the worm. The census output is unchanged.
