- type: REVIEW
  outcome: changed
  summary: Evaluate the eukaryote-wide rule candidates across 24 reference proteomes
  details: |
    selector_census.py now takes its verdicts from the module engine (module_logic), so optional parts, variant sets and module references count as the engine reads them; protein-complex steps are evaluated over their active units, which the engine does not compile. The census now covers the twelve eukaryote-wide rule candidates plus phagosome_maturation and synaptic_vesicle_cycle. New page rule-evaluation.md reports the matrix: the reduced-organelle lineages fail the mitochondrial and peroxisomal rules and the non-ciliated ones the cilium rule, as expected, while several rules fail in model organisms on one selector (MPP beta and alpha are human-only subfamilies; Pex2's family misses the non-plant proteins). Plan items added for the selector fixes, the cilium rule's fly and worm gaps, the engine's complex handling and proteome checks. No module file changed.
