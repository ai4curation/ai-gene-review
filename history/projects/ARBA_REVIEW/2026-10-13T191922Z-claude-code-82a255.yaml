  summary: Create ARBA Rule Review project with failure-mode breakdown
  details: |
    New project page projects/ARBA_REVIEW.md. Classified all 76 ARBA rule reviews in rules/arba/ into failure modes (rule_failure_modes.yaml; mega-rule primary in 31, heterogeneous consequent in 14). Added gene_side_failures.py, which joins 6,051 ARBA annotations in gene reviews to their rules and breaks down the 1,394 not kept (62% true but uninformative, 9% wrong); the 133 REMOVE rows are classified by hand in gene_side_remove_modes.yaml (wrong location, activity, process, taxon, role confusion, paralog, etc.). Notes quality problems in the rule reviews (keyword and location rules wrongly said to produce no GO terms; the 12-condition-set analysis cap cited as best practice). Added an index card on pages/projects/index.html.
