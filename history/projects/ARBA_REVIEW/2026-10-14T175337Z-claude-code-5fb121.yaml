- type: EDIT
  outcome: changed
  summary: Add rule redundancy analysis and generic-rule review
  details: |
    Added rule_redundancy.py over UniProt's full ARBA rule set (12,936 GO rules). Findings: one rule per GO term, so redundancy is across levels; 62% of condition sets are covered by a more specific rule's set, UniProt keeps only the most specific ARBA term per protein (6 of 2,411 reviewed genes stack), 2,678 rules are covered in every set and 57 of 60 sampled produce no annotations. For 36 generic rules seen in reviews, a more specific term from another source is usually already present; project page proposes deprecating generic activity, development/regulation and membrane rules, keeping nucleus/plasma membrane/cytoplasm.
