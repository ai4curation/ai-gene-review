  summary: Add Reactome inventories
  details: |
    Added projects/REACTOME/inventory_reactome.py to inventory local Reactome integration points without calling external APIs. The script extracts Reactome-backed existing annotations from gene review YAMLs, joins older rows to their cached GOA TSVs to recover GO aspect and qualifier data, extracts Reactome source_id citations from module YAMLs with node and annoton context, and writes a human GO-CAM activity table that flags UniProtKB gene products also seen in Reactome-citing module annotons. Generated three TSV snapshots under projects/REACTOME/data/ and projects/REACTOME/RESULTS.md with headline counts, then checked off the corresponding inventory items on the umbrella project page.
