  summary: Resolve blank Reactome MF verdicts
  details: |
    Added projects/REACTOME/mf_manual_verdicts.tsv and wired it into projects/REACTOME/inventory_reactome.py so the first MF slice's 37 blank MARK_AS_OVER_ANNOTATED and REMOVE rows receive explicit candidate verdicts and manual reasons. The generator now validates the manual override table against current MF rows, writes the final verdicts and manual rationale into data/mf_verdict_slice.tsv, and reports manual failure-mode counts in MF_VERDICT_SLICE.md. Extended the verdict vocabulary with the newly used failure classes and checked off the blank-verdict resolution task in the umbrella project page.
