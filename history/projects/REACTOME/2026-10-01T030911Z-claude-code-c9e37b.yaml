  summary: Add Reactome-backed MF verdict slice
  details: |
    Extended projects/REACTOME/inventory_reactome.py to derive data/mf_verdict_slice.tsv from the Reactome-backed molecular-function rows in data/gene_reactome_annotations.tsv. The first pass assigns conservative candidate verdicts from completed review actions, flags local-module MF overlaps, multi-gene Reactome stable IDs, disease events, uncached Reactome rows, and missing titles, and writes projects/REACTOME/MF_VERDICT_SLICE.md with counts for accepted rows, term-refinement candidates, mixed over-annotations, removed rows, and undecided rows. Updated projects/REACTOME.md and projects/REACTOME/RESULTS.md to link the slice and record the next manual verdict-resolution pass.
