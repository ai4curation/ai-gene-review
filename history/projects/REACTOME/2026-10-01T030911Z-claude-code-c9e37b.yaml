  summary: Add purine nucleotide pilot and verdict vocabulary
  details: |
    Added projects/REACTOME/purine-nucleotide-interconversion.md as the first compact reaction-by-reaction Reactome pilot. The comparison aligns four Reactome reaction events against the purine_nucleotide_interconversion module's local GO molecular functions, keeps the R-HSA-73817 pathway container out of one-to-one MF matching, records the absence of matching human activities from the cached GO-CAM index, and updates the umbrella REACTOME project status and notes to link the pilot.

    Added projects/REACTOME/verdict-vocabulary.md to define the initial row-level coding scheme for Reactome-backed MF review. The vocabulary separates exact reaction-to-MF matches from term refinements, context-only CC/BP rows, complex active-member and over-export cases, pathway-container overreach, passive input/product roles, black-box gaps, transport boundary mismatches, and cases that need richer Reactome event-graph detail.
