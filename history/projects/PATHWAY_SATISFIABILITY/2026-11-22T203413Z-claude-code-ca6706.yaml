  summary: 'Independent review applied: retract the dark-matter claim, restate the
    GTEx result, fix the zonation reporting'
  details: |
    Carries an independent review of the project (projects/PATHWAY_SATISFIABILITY/REVIEW.md, new) and applies its engine, module and prose findings, ported onto the rewritten page rather than by reverting to an older branch version.

    Retracted the microbial 'metabolic dark matter' result on the page, in RESULTS.md and in the slide deck, naming both root causes (module scoped to the O-acyl-homoserine entry; a seven-entry step-to-KO table whose predicate returned False for an unmapped atom). See the methionine_biosynthesis record in the same change.

    Restated the 54-tissue GTEx result: the satisfiable set equals G6PC1 at or above threshold at every published threshold, because every other atom is near-ubiquitous, so the discriminating work is curation rather than circuit evaluation. The substrate-resolved module is identified as the case where the logic itself changes the answer.

    Corrected the zonation reporting: the pericentral pole fails at three steps, not one, which the previous single-gate claim hid by filtering to core atoms; and the oracle gained an absolute expression floor, because per-gene peak normalisation had let Fbp2, not expressed by liver, satisfy the FBPase step. The blocked zone grows from L1 to L1-L3 and the threshold sweep becomes monotonic.

    Also: Buchnera reframed as the shared-pathway cross-feeding exemplar rather than a plain auxotroph; OXCT1 liver corrected from 0 to 0.46 TPM; epistemics extended with the model-indicting reading of a gap. Engine tests 62 to 65 with three regression cases. Two manual_reviews entries record the review and its application.

    The review's gene-annotation findings were deliberately not applied: main had curated those genes independently in the interim and, in most cases, more thoroughly, so re-applying the older branch versions would have regressed it. REVIEW.md records each superseded finding, and the G6PC3 one as partly withdrawn on re-examination.
