  details: |
    Fourth PR review round (#5724). The proposed symbiont-mediated interferon-production term now answers the objection that both cited cases already carry accepted host-transcription-suppression terms, using the outcome-versus-mechanism argument the review makes for keeping GO:0039602 and GO:0039653 together, plus the separately measured interferon evidence. States the request's own weakness (both cases are global-Pol-II viruses) and declines to offer KSHV vIRF1 or HSV-1 ICP0 as a third case, since both act on IRF3 and plausibly fall under GO:0039548; records finding a genuine third case as the open question before filing. Also fixes two stale project-page sentences from the K3/K5 change.
