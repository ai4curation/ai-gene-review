  summary: 'CACAO batch 3: select by screen rather than by row count'
  details: |
    Row-count ranking is exhausted, so batch 3 is chosen by turning each of the three batch-2 failure shapes that need no paper reading into a query over the snapshot. Screen 1 finds 33 numerically-named genes sharing a cited PMID with another numeric gene in the same organism, the gp5.4 configuration, with phage phi29's PMID:820555 cluster the sharpest. Screen 2 needed correcting mid-design: taxon count alone over-flags, since the widest reference spans 25 taxa as a legitimate comparative study, so the candidate set is references spanning 2-4 sibling taxa. Screen 3 finds 63 non-standard-qualifier rows dominated by phage anti-CRISPR and host-interaction proteins, making it a replication test of the AcrIIA5 finding. Batch 3 is five genes from each screen.
