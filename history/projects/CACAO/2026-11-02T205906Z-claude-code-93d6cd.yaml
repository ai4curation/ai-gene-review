- type: AUDIT
  outcome: changed
  summary: Trace two pipeline amplifications to their source annotations
  details: |
    Traced the InterPro2GO GO:0019685 and PANTHER GO:0004029 findings from batch 3 to their origins and wrote per-resource reports. InterPro2GO: four light-independent chlorophyll entries map to the carbon-fixation grouping term, each already carrying its correct terms, so the fix is deletion of four lines; those four account for all 3,731 GOA annotations on the term. PANTHER: of 56 proteins with an experimental GO:0004029, exactly one is in PTHR48079, and its IDA cites a paper reporting an aldehyde reductase, the opposite reaction, so 63 PAINT and 1,324 TreeGrafter rows inherit a wrong term from one seed. Corrected the bchF and actC source_defects accordingly and fixed an imprecise Calvin-cycle claim on the project page.
