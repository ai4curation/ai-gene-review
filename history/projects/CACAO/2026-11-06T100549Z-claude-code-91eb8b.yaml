- type: EDIT
  outcome: changed
  summary: 'Corrected three claims about the INTERPRO enum gap that #5984 and #6027
    made false'
  details: |
    Three sentences in "Three things batch 3 says the project should change"
    had been tipped false, two of them by PR #6027 itself. Raised as a
    non-blocking suggestion on that PR, and taken because the statements are
    false rather than merely dated.

    What was wrong. Item 1's tail read "so just export-source-defects cannot
    produce the report that matters most. Adding INTERPRO (and probably
    PANTHER/TREEGRAFTER) would fix that; it is a schema change touching existing
    reviews, so it was recorded here rather than done in passing." The value was
    added in #5984 and 83 defects were re-filed onto it in #6027, so
    reports/source-defects/INTERPRO.md exists and carries 90, second only to
    UniProt. "Cannot produce" was false and "would fix that" described as
    pending something already done. The tail now says so, and keeps why the gap
    mattered in the past tense.

    CORRECTION, made before this record merged. The first version of this fix
    wrote that INTERPRO.md "carries 90, second only to UniProt". False:
    INTERPRO at 90 is SIXTH, behind UNIPROT, GO_CENTRAL, RGD, PSEUDOCAP and
    the OTHER pile it is draining. The cause was a scope slip - the preceding
    sentence's superlative is scoped to "this project has found", and I
    restated it as a corpus-wide rank without re-deriving it. The same slip is
    in PR #6027's description, which is where it came from. The page now gives
    the measured rank and says that the project-scoped superlative does not
    survive being restated corpus-wide.

    THE COUNTS HAVE TWO LEGITIMATE MEASURES, which is worth recording because
    an earlier version of this paragraph gave only one and the reviewer read it
    as an error. Over the exporter's scope (genes/*/*/*-ai-review.yaml plus
    gocams/*/*-review.yaml) on this head:

      resource     parsed defects   `resource:` lines
      UNIPROT      440              428
      GO_CENTRAL   162              162
      RGD          147              146
      PSEUDOCAP    116              116
      OTHER        112              112
      INTERPRO      90               90

    Sixth under either measure, which is all the rank claim needs. The two
    columns differ because gene reviews use YAML anchors and aliases inside
    source_defects: one anchored defect carries one resource: line and the
    parser yields a defect per reference, so the exporter emits more rows than
    there are lines. genes/rat/Ywhag declares - &id001 (:121), - &id002 (:125)
    and - &id003 (:198) and references them at :145-146, :163-164, :181-182,
    :215 and :230 - 3 lines, 10 rows. The whole UNIPROT gap is five aliased
    files: Ywhag 3->10, Dusp18 1->3, Dusp21 1->2, Gria1 4->5, Tardbp 1->2,
    which is +12; the same mechanism gives RGD 146->147. The four resources
    whose columns agree have no aliased defects. A loose grep returns 428 too,
    so it is not a quoting artifact, and gocams/ holds no UNIPROT defect at
    all.

    The consequence generalises beyond this record: line-counting resource:
    undercounts defects wherever a review uses aliases, so any figure quoted
    for this corpus has to be parsed rather than grepped. Whether
    per-reference expansion is the right semantics is a separate question -
    an aliased defect is one upstream problem that the per-resource report
    will list several times - and belongs to export_source_defects.py, not
    here.

    Item 1 also said "the remaining ~130 that now have a home are a separate
    migration", which read as pending. It now names #6027 as batch 1 of that
    migration and records what it actually moved: 85 defects, leaving 112
    resource: OTHER, of which 45 name no resource at all and cannot be triaged
    without reading each explanation. The ~130 is kept and labelled as the
    estimate made before the migration ran, because the gap between the estimate
    and the outcome is part of the record.

    CORRECTION, made before this record merged: the first version of the fix
    deleted the only occurrence of ~130 while adding a sentence referring to
    "the ~130 figure above", leaving a dangling back-reference and making this
    paragraph's claim that the figure was kept untrue. The figure is restored
    at line 662, which is what makes both statements true. The rationale above
    was right; the diff did not carry it out.

    The section's framing is deliberately preserved. Line 648 says the detail is
    kept because the counts and mechanism names are the project's record of how
    the gaps were found, and because two of the figures were themselves
    corrections; the reviewer's own defence of the section was that item 1 leads
    with a bolded "done in #5984". That framing is why this is a correction of
    the tail rather than a rewrite: the history stays, the tense stops claiming
    the work is outstanding.

    Third instance of this class in two PRs, which is the part worth recording.
    #5984's round-1 blocking finding was this same page recording the enum gaps
    as open after the schema closed them; an hour before this,
    projects/RADICAL_SAM.md was found asserting "SourceResourceEnum has no
    INTERPRO value" and corrected in #6027. The reviewer's sharpening is the
    useful one: we know about the RADICAL_SAM staleness only because that
    project committed a drift test, so the two instances are a selection effect
    rather than a count. The bounding check, measured rather than guessed: nine
    files outside genes/ and history/ mention a resource: enum value at all -
    CLAUDE.md, docs/source_defects.md, projects/CACAO.md,
    projects/PSEUDOCAP.md, projects/PSEUDOCAP/REVIEW_PROTOCOL.md,
    projects/RADICAL_SAM.md, projects/RADICAL_SAM/data/synthesis.yaml,
    reports/source-defects/OTHER.md and tests/test_export_source_defects.py -
    and only synthesis.yaml and its generator carry a by_resource summary. An
    earlier version of this record said "three files", which was asserted
    rather than counted.

    No gene review, annotation, term, action, evidence code or core function
    changed; no figure in this page was altered other than the ones named above.
