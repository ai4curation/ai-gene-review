    gocams/67e5e74400000148/67e5e74400000148-review.yaml,
    pages/projects/PSEUDOCAP.html,
    pages/projects/PSEUDOCAP/REVIEW_PROTOCOL.html, projects/CACAO.md,
    projects/PSEUDOCAP.md, projects/PSEUDOCAP/REVIEW_PROTOCOL.md,
    projects/RADICAL_SAM.md, projects/RADICAL_SAM/data/synthesis.yaml and
