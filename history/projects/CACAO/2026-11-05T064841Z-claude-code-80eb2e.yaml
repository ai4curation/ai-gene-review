  summary: 'Recorded schema gaps 1 and 2 as closed by PR #5984'
  details: |
    The section "Three things batch 3 says the project should change" had
    items 1 and 2 recorded as open: SourceResourceEnum having no INTERPRO
    value, and SourceDefectTypeEnum being unable to express the same
    assertion entered twice. PR #5984 closed both, so the page asserted two
    false things; it now records what was done, and the new heading note says
    two of the three are complete. Item 3 (KW-0081) is untouched and still
    open.

    The items keep their original detail, including two figures that were
    themselves corrections made on review of #5956, because the counts and
    the mechanism names are the project's record of how the gaps were found.
    They gain the corpus measurements that changed the shape of the fix: of
    200 defects filed resource: OTHER, 137 named a resource with no enum
    value (InterPro 84, Complex Portal 24, Ensembl 9, NCBI/RefSeq 5, DisProt
    4, CAFA 4, EC 3, HPA 2, PANTHER 1, GOC 1) and about 31 were misfiled onto
    values that already existed, so part of the pile was never a schema gap;
    and 315 of 451 cause values were OTHER. Item 2 also records the five new
    SourceDefectCauseEnum values against the three mechanisms it had named in
    prose. Recorded on review of #5984, which caught the page still asserting
    the gaps were open.
