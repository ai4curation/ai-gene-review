  details: |
    Scoped the upstream obsoletion of GO:0007164 (go-annotation#6638, parent ontology ticket go-ontology#32697) from an automated scan of the go-annotation tracker. Verified GO:0007164, GO:0001736, GO:0045198, GO:0120192, GO:0030011 and GO:0009860 against OLS (all live; GO:0007164 not yet obsolete) and confirmed that the upstream-proposed new module ids GO:7770140/GO:7770141 do not resolve. Pulled the 28 live GO:0007164 annotations from QuickGO, resolved the six cited PMIDs against PubMed and eight accessions against the UniProt REST API. Two gaps in the upstream table were found and recorded for reporting: a sixth experimental annotation (chicken Grg4, Q8JIM6, AgBase IMP, PMID:10772799, a tectum-organiser paper that looks like a wrong-term call) and a live ARBA rule ARBA00029049 emitting GO:0007164 despite the ticket stating no mappings exist, plus the propagation cascade behind fly pk and rat Hnf4a. Measured repo impact: no review cites GO:0007164, but 15 reviews use terms the parent PCP restructuring would obsolete or redefine. No gene review started; nothing reported upstream yet.
