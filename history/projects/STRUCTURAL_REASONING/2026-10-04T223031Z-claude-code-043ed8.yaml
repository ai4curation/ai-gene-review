  summary: Add Structural Reasoning in Annotation Review project page
  details: |
    New projects/STRUCTURAL_REASONING.md generalising the method developed on the SLC10 family: define a functional site from ligand contacts in a deposited structure, record whether each contact is side-chain or main-chain, map positions onto relatives by sequence alignment rather than geometry, calibrate with relatives that have the function, and store the result as residue claims a validator re-checks against UniProt. Documents the worked example (seven SLC10 gene reviews, the PTHR10361 family review, the bile salt cycling module), the two errors caught by the project's own checks, and the infrastructure added (site_source STRUCTURE, atom-level contact slots). The page gives equal weight to what the method cannot license: a retained site is not retained activity, AlphaFold models are apo so a projected ion is not a predicted interaction, contact sets depend on cutoff and conformational state, broad hydrophobic pockets are not diagnostic, and a site is only worth curating when its residues decide the function. Links the published artifact as a manifest entry and adds a card to the manually maintained project index.
