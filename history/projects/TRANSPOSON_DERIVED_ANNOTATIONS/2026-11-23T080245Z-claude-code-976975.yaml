  details: |
    Created projects/TRANSPOSON_DERIVED_ANNOTATIONS.md from the RAR fungus/vertebrate triage finding that PAINT node PTN008655974 gives fly Pericardin heart and ECM terms to a chicken reverse-transcriptase ORF. Measured the node (2,072 IBA rows across lineages, three terms) and added scripts/scan_te_iba.py, which lists IBA rows on proteins with transposable-element Pfam domains in 12 model proteomes; data/te_iba_scan.yaml records 1,152 such proteins, 100 with IBA rows (191) from 13 nodes, read by hand as mostly domesticated genes plus the Pericardin node and two unclear cases. Fixed a scan bug: QuickGO ignores goEvidence, so the script filters by ECO:0000318 and re-checks the evidence code.
