  summary: 'Create project: BioEMMA evaluation (KEGG KGML to model-specific Escher
    maps)'
  details: |
    Hands-on evaluation of BioEMMA 0.4.3 (Kachnov et al. 2026, Biology 15:1493). Reproduced the bundled e_coli_core reference case offline (12 reactions retained on map00010; GAPD retained, unlike the paper's reported run), projected P. putida KT2440 iJN1463 onto the 17 KEGG reference maps cited by modules/ (295 retained reactions, FBA overlay), classified every dropped model reaction against BiGG subsystems (no genuine misses; drops are KEGG granularity, missing kegg xrefs, or duplicated model reactions), and joined retained-reaction GPRs to genes/PSEPK reviews (186 of 292 genes reviewed). Found that organism KGML maps (ppu*) yield zero reactions and that the flux overlay mis-keys duplicated model reactions. Scripts and TSV results committed under projects/BIOEMMA/; page rendered with render-projects; frontmatter test passes.
