  summary: 'Create project BOOLEAN_MODELS: modules as Boolean networks, external Boolean
    models as calibration'
  details: |
    Created the BOOLEAN_MODELS project exploring (a) external Boolean/logical models (SIGNOR, BioModels SBML-qual, the BBM corpus, GINsim, Cell Collective, GO-CAM) as sources and calibration for curated modules, and (b) translating curated modules into Boolean networks in a common framework. Added src/ai_gene_review/module_boolean.py (module -> .bnet translation with hierarchy flattening and CaSQ default rules; .bnet parsing with sign inference; SIGNOR TSV ingest; mapping-mediated signed-edge diff with collapsed-path and feedback classification), tests/test_module_boolean.py, and the CLI command module-to-bnet. Cached BBM-070 (Grieco 2013 MAPK cancer cell fate, PMID:24250280) and SIGNOR-EGF under models/boolean/ with provenance READMEs and reviewed mappings to the erk/p38/jnk cascade modules. The demo (projects/BOOLEAN_MODELS/run_mapk_demo.py, run with uv run --with biodivine-aeon) generates RESULTS.md: the ERK module agrees with both sources on all six mapped edges with no sign conflicts; both sources carry ERK -| RAF and RSK/ERK -| SOS feedbacks the module lacks; the translated module has only fixed points while BBM-070 oscillates under EGFR stimulus, and adding the two feedbacks as rule overrides makes the translated module oscillate too. Schema-gap analysis proposes update_rule, sign, boolean_role and model_associations slots and a curation convention to stop cutting feedback loops. Verified: pytest for the new module and the module logic/notation suites, ruff, mypy, doctests; the full unit suite passes apart from a pre-existing just-dependent test that fails identically on the base branch.
