  summary: Close the feedback loops the calibration surfaced; add the feedback-loop
    QC check
  details: |
    Acted on the first-pass calibration: closed the feedback loops in modules/erk_cascade.yaml (ERK -| RAF, ERK output -| SOS, ERK output -> DUSP), modules/p38_cascade.yaml (p38 output -> DUSP1) and modules/jak_stat_signaling.yaml (SOCS -| JAK), each with PubMed-verified primary evidence and verbatim supporting text, and reworded the JNK negative-regulation step as an external input (DUSP1 induction is p38/ERK-driven cross-regulation, not JNK feedback). Fixed the translator so a feedback edge from a bundle's last tier does not hide that tier as the bundle exit and a pure-inhibitor tier (GAP) is not an exit. Added module_qc.feedback_loop_findings (advisory: a NEGATIVELY_REGULATES source whose prose asserts feedback/induction but has no upstream activating edge is a 'loop cut' warning; containers count as closed through their children; negated sentences are ignored), wired into module_validator warnings and a 'Feedback loops' card on module pages, with tests. Re-ran the demo: the ERK module now agrees with BBM-070 on all 8 mapped edges (was 6, with 2 feedbacks missing) and its translation oscillates under sustained stimulus (94-state complex attractor) like the published model; the counterfactual with loops cut gives a fixed point. Updated the project page, STATUS and schema-gap notes.
