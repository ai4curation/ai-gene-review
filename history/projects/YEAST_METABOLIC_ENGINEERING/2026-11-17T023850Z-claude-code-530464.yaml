    run_ast_eflux_comparison in run_yeast_gem_audit.py hardcoded per-gene expression values for four physiological regimes and reported the derived isozyme shares as findings, with the GAPD and PYRDC dominant-isoform labels fixed strings. No expression dataset is loaded, so the regime section was removed from the script, out/ast_eflux_conditions.yaml (regenerated by rerunning the script), RESULTS.md section 5, the project page and slide 7. The ChatGEM regex-parser benchmark is kept and labelled as synthetic test inputs. Slide 8 claims were corrected (steady-state flux model rather than COBRApy model; 15 reactions, 14 scenarios, 89 assertions; actual UI controls), and a third benchmark row that the script never produced was dropped from slide 7.
