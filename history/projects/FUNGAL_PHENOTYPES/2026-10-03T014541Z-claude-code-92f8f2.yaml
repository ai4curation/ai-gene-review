  summary: Create fungal growth and knockout phenotype resources project
  details: |
    Created projects/FUNGAL_PHENOTYPES.md surveying FUNG-GROWTH (species-level carbon-source growth profiles) and fungal mutant phenotype data. Added scripts/phenotype_overlap.py, which joins SCHPO and yeast reviews to PomBase (FYPO) and SGD (APO) bulk phenotype files, and its output data/reviewed_gene_phenotypes.tsv. Finding: nearly all reviewed yeast genes have curated phenotypes; nutrient-source phenotypes come mostly from two HTP screens (PMID:37787768, PMID:24721214) absent from GOA, and are largely indirect necessity evidence.
