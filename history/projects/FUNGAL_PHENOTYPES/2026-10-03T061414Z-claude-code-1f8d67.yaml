  summary: Add R. toruloides carbon-source fitness analysis sub-page
  details: |
    Added projects/FUNGAL_PHENOTYPES/RHOTO.md and three scripts: rhoto_specific_phenotypes.py (specific carbon-source defects from Kim 2021 RB-TDNAseq; 370 genes), rhoto_resolve_accessions.py (maps deleted IFO0880 accessions to reference proteome UP000199069 via UniParc + phmmer; 348/370 resolved), rhoto_candidates.py (137 strong defects grouped into modules). Flags two apparently fused UniProt gene models named after the wrong half (A0A0K3CAZ0 'Nup85' carrying MCC biotin carboxylase domains; A0A0K3C7C1 'ADP-ribose pyrophosphatase' carrying intradiol dioxygenase domains). Fixed the main page's condition count (27 conditions, 6,409 genes with data) and linked the sub-page.
