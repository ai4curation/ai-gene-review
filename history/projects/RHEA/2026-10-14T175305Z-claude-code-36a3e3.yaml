  summary: Correct the EC-less unmapped count from 192 to 191 and rename the batch-8
    proposed terms
  details: |
    RETRACTION of one figure in the earlier record 2026-09-29T165058Z-claude-code-2e3a87, which asserts '192 of them lacking an EC number too'. Records are append-only, so that record stands and this one supersedes the number: the correct figure is 191 of 201. The 192 came from reaction-level aggregation keeping the first-seen protein's EC for a reaction carried by several CYPs; RHEA:55928 (fenbendazole S-oxidation) is cited without an EC by one CYP and with EC 1.14.14.73 by another, so it was counted as EC-less. rhea_family_explorer.py and cyp_go_audit.py now union the EC and OR the experimental flag across the proteins carrying a reaction, and ec2go lookups split on the joined value. Also in this round: the batch-8 proposed term names dropped their 'very-long-chain' qualifier, which excluded the C22 anchor of each pair (docosanoate is 22 carbons, so GO:0102033's 13-22 range covers it and GO:0140692's >22 does not), and the step-3 name now follows its template GO:0097259 in being a monooxygenase. Both scripts now stamp the GO release they read and refuse to truncate a full API page. All other figures in the superseded record still hold.
