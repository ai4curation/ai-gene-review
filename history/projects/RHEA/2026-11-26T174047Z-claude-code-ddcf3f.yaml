  details: |
    Added completeness/subunit_consistency.py, subunit_flag_eval.py and SUBUNIT-FLAGS.md (follow-up to SUBUNIT-PROJECTION.md). Data re-fetched 2026-11-26; go-edit.obo at 2f2d73a. Metric split: of 14,255 curated-only non-consistent pairs (18.0%), subunit practice explains at most 167 (1.2%) on a strict test (contributes_to on the term, or a partner subunit in a different PANTHER family sharing a complex carries it), and at most 10.4% counting weaker complex cases; 678 consistent pairs are consistent only through a contributes_to row because UniProt GO cross-references drop the qualifier. Flags: complex signals have about 94% recall but 7-17% precision against curated contributes_to vs enables; PAINT contributes_to in the entry's PANTHER subfamily is best at about 60% (38% without IBA gold). Curated qualifiers on catalytic subunits are inconsistent across orthologs (106 of 5,960 subfamily-term groups mixed; COX1 UniProt ISS rows 106 enables vs 66 contributes_to). Proposed a two-tier review queue and no automatic conversion; a curated rule cannot carry a qualifier. Decision left to the user on issue 7071. After rebasing on the reviewed PR 7107 branch: added per-entry consistency output and joined it to the 1,228 collision pairs; 665 are consistent (contributes_to read as agreement), 528 none (outside the denominator; on 511 the curated contributes_to row is hidden behind an IEA evidence code in UniProt's one-evidence-per-term cross-references), and only 35 (19 disjoint, 16 ancestor_only) count as disagreement. Made the per-mapping output order deterministic.
