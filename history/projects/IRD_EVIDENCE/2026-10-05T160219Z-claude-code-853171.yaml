  details: |
    Created projects/IRD_EVIDENCE.md with fetch and analysis scripts. Extracted all 2,538 IRD rows from PAINT IBD.gaf (894 families) and showed that IRD never produces a leaf IBA, positive or NOT (all leaf NOT|IBA rows come from IKR or NOT|IBD nodes). Resolved IRD clades from PANTHER trees (52,660 protein rows), matched QuickGO experimental annotations to blocked terms with GO descendants (170 IRD rows contradicted inside the effective block, 165 supported by experimental NOTs), and joined clade members to gene reviews (24 stale IBAs in 15 reviews). Also corrected the IRD description in panther_paint.py.
