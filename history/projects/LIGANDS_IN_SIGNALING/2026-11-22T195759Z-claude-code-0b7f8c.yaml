  details: |
    Follow-up to the review of PR 6640. Each GAF object id is now named by its most frequent symbol, so MGI proteoform rows filed under the gene id (mVEGFA/iso:4, mFGF13/iso:2) no longer replace the gene symbol; this removes five mouse rows that passed with an empty ligand list. The slash filter is dropped, because real symbols contain slashes (zebrafish il17a/f1, dicty purC/E). gapcheck rows gain donor_genes (ligand genes without Complex Portal entries), which triage.py now reads as the donor pool, while ligand_genes keeps every ligand. export_artifact_data.py stops with a clear message when triage.json lacks a current row. Section 3 now describes the budding yeast GO:0007193 and Arabidopsis GO:0007200 and GO:0002220 rows as G. After review: donor_genes is no longer capped at eight (the triage reads it, and the cap had made the donor pool an alphabetical prefix), and all symbol lists are deduplicated (two ids can share a symbol, e.g. CALCA, CERK1). No triage category changed.
