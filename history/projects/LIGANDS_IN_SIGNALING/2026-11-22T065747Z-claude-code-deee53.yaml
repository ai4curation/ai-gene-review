- type: EDIT
  outcome: changed
  summary: Extend the ligand gap check to worm, Arabidopsis and Dictyostelium, and
    build the artifact from committed results
  details: |
    Added wb, tair and dictybase to the pipeline (fetch_data.sh, ligand_gap_check.py); every non-vertebrate organism is now its own lineage in triage.py. Curated additions: five X term labels (acetylcholine GPCR, octopamine, brassinosteroid, LPS, innate immune activating), organism flags for budding and fission yeast (glucose-sensing GPCR terms X), mouse and rat (IL-8 O: no CXCL8 gene), worm, Arabidopsis (contested plant GPCRs O) and Dictyostelium, and expected ligands for worm, both yeasts (mating pheromones) and Arabidopsis (peptide ligands). Rows and triage output are now sorted with the term id as a tie-breaker, so reruns are byte-identical. New scripts/export_artifact_data.py writes the data file for the Ligand gap check artifact from results/. Section 3 and the outputs list now cover ten organisms. Known limit noted on the page: symbol matching misses ligands with different symbols across species (mouse Fasl, Kitl, Hc come out N). The human acetylcholine GPCR pass rests only on AGRN, which looks like an over-annotation. After review: the relaxed-rule result files were regenerated in the new order; complexes and proteoform symbols are left out of the donor list; GO:0002220 moved from a term label to an Arabidopsis G flag (human passes it on COLEC10); yeast GO:0007193, Arabidopsis GO:0007200 and Dictyostelium GO:0007259 are G rather than X or O; triage.json now records each category source.
