  summary: 'LIGANDS_IN_SIGNALING: correct claims the files contradict'
  details: |
    Corrected the project page against the repository. PANTHER membership is not checked by the validator; the members are not in the index. UniProt DR PANTHER lines agree except for the pre-existing EPHA2/EPHB4 and CASP8 placements and some subfamily ids that UniProt does not list. There is no PAINT_TERM_NOT_ASSERTED warning for ephrin. The slit warning wording was corrected. The PTHR11574 node assessments are for GO:0005886 and GO:0008284, and PAINT does not place GO:0005125 there. The prior selectors were GENE_PRODUCT, not ENTITY, and for the death-receptor and chemokine modules only the remaining selectors were converted. For IL34, GO:0038145 is NAS, and GO:0005157 is IBA/IDA/IEA. The PTHR48488 GO:0050728 assessment is UNRESOLVED, not SCOPE_MISMATCH. The PTHR11471 node and subfamily assessments were corrected (GO:2001238 TOO_DEEP; GO:0008625 on SF33, SF27, SF23; no PTN007549844 row). PTN002682897 was added to the PTHR14356 entry. The page also records this session's MIF receptor-complex remodel and Euteleostomi scope, the EFNB1 and kitlga fixes, and the ephrin annoton rename. At the coordinator's request, the IL-34, IL-21 and IL-22 module entries describe the state produced by a parallel agent's module edits, which are not on main at the time of this record. IL-34 is a two-step module and GO:0038145 is not a module concept. The IL21R receptor MF is GO:0001532 and the IL22RA1 MF is GO:0042018; IL2RG and IL10RB keep GO:0004896. IL22RA2 is outside the boundary. The IL-21 ligand PAINT nodes attest only BP terms, and PTN002682898 has no taxon in paint.tsv. These statements were checked only for GO labels (QuickGO) and the PTHR14356 PAINT rows, not against the unmerged modules. Re-rendered with render-projects.
