  summary: Record the review round of PR 6331 and the review of the SIRT2 rows that
    cite the Sir2 paper
  details: |
    Second session on ai4curation/ai-gene-review#6331, the follow-up on the rows that the REMOVE re-review of human reviews had left UNDECIDED. Two things changed. First, the review of the pull request asked that a term kept as non-core be refined where the evidence is more specific: the two CRY1 phosphatase binding rows are now MODIFY to protein phosphatase binding and the two CRY1 positive regulation of protein ubiquitination rows are MODIFY to positive regulation of protein polyubiquitination, so the 15 settled rows are 8 MODIFY, 5 KEEP_AS_NON_CORE, 1 ACCEPT and 1 MARK_AS_OVER_ANNOTATED. The SIRT1 and ASCL1 reasons were made more explicit, and quotes that underpin a source defect were moved from the row to the defect (PMAIP1, SIRT2); an unrelated title quote was dropped (JAK1). Second, at the user's request the five other rows of the SIRT2 review that cite a study of Sir2 in muscle differentiation (PMID:12887892, probably about SIRT1) were reviewed on evidence about SIRT2 itself: protein binding MODIFY to REMOVE, histone acetyltransferase binding stays ACCEPT, negative regulation of DNA-templated transcription KEEP_AS_NON_CORE to TOO_GENERAL, negative regulation of striated muscle tissue development KEEP_AS_NON_CORE to UNDECIDED, response to redox state ACCEPT to UNDECIDED; five more source defects, twelve in the pull request. REMOVE_RE_REVIEW.md describes both in the section 'The UNDECIDED rows, revisited' (updated counts, a paragraph on the changes after review, a subsection 'SIRT2 and the Sir2 paper'), remove_rereview_changes.yaml has the new actions of the settled rows and a sirt2_sir2_paper_rows list, and the project page states the new split and the SIRT2 rows. Two papers were added to publications/ (PMID:35636510, PMID:41904135).
