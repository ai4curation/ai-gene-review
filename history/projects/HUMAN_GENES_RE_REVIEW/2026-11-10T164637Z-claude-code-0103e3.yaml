  summary: Re-review of all REMOVE actions in human gene reviews
  details: |
    Second-pass audit of every annotation row with action REMOVE in genes/human against the current action rules (REMOVE judges the claim; rows that share a term agree; true but broad terms are TOO_GENERAL or MODIFY; experimental annotations are not overruled from an abstract; ND and root-organelle policies). Scope: 23,802 REMOVE rows in 1,699 of 3,588 human review files. The 22,013 bare protein binding rows were audited by script against the protein-binding policy and none changed action. The 1,789 other rows were read one at a time in 25 alphabetical batches, with sibling rows, cached publications and, for transfers, the donor annotation and its paper. Outcome: 1,381 stand; 172 to MARK_AS_OVER_ANNOTATED, 131 to KEEP_AS_NON_CORE, 30 to TOO_GENERAL, 29 to UNDECIDED, 26 to ACCEPT, 20 to MODIFY; nine removal reasons corrected; 60 source_defects recorded; 222 review files edited, each with its own history record. The project page gains a November 2026 update, a completed-audit entry, and resolutions for the four fence cases (AGO3/AGR2, ATP23, GAPDH, HSPA1B) and two literature questions (ASCL1, ATF3). New sub-page projects/HUMAN_GENES_RE_REVIEW/REMOVE_RE_REVIEW.md gives the method, counts by evidence code and rule, the source defects and follow-ups; projects/HUMAN_GENES_RE_REVIEW/remove_rereview_changes.yaml lists every changed row and the REMOVE rows kept with a note. Edited reviews were validated with ai-gene-review validate --terms against a pre-pass baseline; no new errors.
