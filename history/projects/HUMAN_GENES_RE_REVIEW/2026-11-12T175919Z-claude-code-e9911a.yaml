  summary: Record the follow-up on the UNDECIDED rows of the REMOVE re-review
  details: |
    Follow-up to the REMOVE re-review of human reviews (ai4curation/ai-gene-review#6257, merged). The pass had left 34 rows UNDECIDED because the paper behind each could not be read. A second attempt to obtain the 22 papers failed (none is in the open-access subset and PMC refuses the repository's fetchers), so rows were settled only where other accessible evidence decides the claim: the provenance of the annotation in QuickGO, curated UniProt statements tied to a publication, the abstract of a donor paper, or an independent primary paper. Fifteen rows in nine reviews left UNDECIDED: 9 to KEEP_AS_NON_CORE (ASCL1 two rows, BBC3, BCL2L11, CRY1 four rows, JAK1), 4 to MODIFY (SIRT1 three rows, PMAIP1), 1 to ACCEPT (SIRT2) and 1 to MARK_AS_OVER_ANNOTATED (SCGB2A2, with a propagation_review). Seven source defects were recorded, all asking the source to check: three wrong terms on SIRT1, a wrong gene product on the settled SIRT2 row and on its same-term sibling (row 98, action unchanged), a reference that does not appear to support its row on PMAIP1, and a probable wrong gene product on VTI1A, which stays UNDECIDED. Nineteen rows remain UNDECIDED. Three papers were added to publications/ (PMID:22510886, PMID:27412556 with full text, PMID:27799566). The sub-page REMOVE_RE_REVIEW.md gains a section 'The UNDECIDED rows, revisited' with the settled rows, the remaining rows and the paper each needs, and a note that five further SIRT2 rows cite a paper that is probably about SIRT1; the tables of the pass as merged are left as they were. remove_rereview_changes.yaml gains an undecided_followup block. The project page states the follow-up in the November update, the completed-audits entry and the 'Needs literature' section, where ASCL1 is now KEEP_AS_NON_CORE.
