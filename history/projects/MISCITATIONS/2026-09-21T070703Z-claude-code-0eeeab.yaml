events:
- type: EDIT
  outcome: changed
  summary: Fold MISCITATION_AUDIT into MISCITATIONS; every project here is an audit,
    so the suffix distinguished nothing
  details: |
    Two projects had grown on the same ground: MISCITATION_AUDIT on main (citation-keyed, IN_PROGRESS) and MISCITATIONS from PR #3093 (gene-keyed, SCOPING). The index listed both. Merged under the shorter name at the repo owner's direction - the AUDIT suffix carries no information when every project in projects/ is an audit.

    Neither body of work was discarded, because they were complementary rather than duplicate:

    - The page is now MISCITATION_AUDIT's, which is the sharper document: citation-as-key with seven worked multi-gene examples, the ownership split that decides what the project is for (26 of 27 WRONG_IDENTIFIER rows are GOA-sourced, so the deliverable is a bug report upstream, not an internal clean-up), the failure-mode table, and an honest record of a detector that does not work (Check B, paralog mismatch, defeated by alias drift and complex-wide papers).
    - Two things the folded-in project had and that page lacked were carried into 'Scope and honest limits': the corpus-wide denominator (4,513 reviewed files, 2,074 adjudicated, 14,559 references, 559 flagged) with the caveat that 3.8% is a flag rate on an enriched opportunistic sample and not a background error rate; and the observation that attachment defects - sound citation hooked to the wrong annotation via wrong WITH/FROM, wrong evidence code, or a missing NOT - have no value in ReferenceCorrectnessEnum, so four of six seed cases are invisible to the register and the counts undercount by an unknown margin.
    - The folded-in page survives in full as MISCITATIONS/seed-cases-and-corpus-state.md rather than being deleted.

    Mechanics: harvest_citations.py, detect_citation_anomalies.py and reports/ moved into MISCITATIONS/; both scripts had projects/MISCITATION_AUDIT/reports as their default --out-dir, which would have written to a directory that no longer exists, so those defaults were repointed; MITO_INTERACTOME.md's two references repointed; the two index cards merged into one carrying all four links; the stale rendered MISCITATION_AUDIT.html and its directory removed.

    No history records existed for MISCITATION_AUDIT - it predates the history mechanism - so no target.superseded_by repair was needed and the layout test is unaffected.
