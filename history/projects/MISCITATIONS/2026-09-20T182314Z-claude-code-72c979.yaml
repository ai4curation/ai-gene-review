- type: CREATE
  outcome: changed
  summary: 'New project: aggregate reference_review adjudications into a miscitation
    register'
  details: |
    reference_review already existed per-gene; what was missing was aggregation. projects/MISCITATIONS/aggregate_miscitations.py walks every gene review and generates a register.

    First run: 14,559 adjudicated references across 2,074 of 4,513 reviewed gene files; 559 (3.8%) flagged as a citation problem (WRONG_IDENTIFIER 26, MISCITED 274, DISPUTED 151, LOW_QUALITY 108).

    Open limitation recorded on the page: 4 of 6 seed cases are attachment defects (wrong WITH/FROM, wrong evidence code, missing NOT) where the citation is fine but is hooked to the wrong annotation. ReferenceCorrectnessEnum has no value for that, so the register under-counts them. Note the adjacent MISCITATION_AUDIT project on main covers overlapping ground from the citation side.
