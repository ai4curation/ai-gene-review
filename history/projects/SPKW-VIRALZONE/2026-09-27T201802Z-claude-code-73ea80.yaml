- type: CREATE
  outcome: changed
  summary: 'Create SPKW ViralZone upstream-source subproject: audit ViralZone''s dual
    propagation into GO'
  details: |
    New SPKW subproject auditing an upstream source rather than a downstream annotation set, prompted by the discovery that the GO viral-factory branch used in modules/viral_factory.yaml is ViralZone-derived.

    Framing. ViralZone feeds GO by two routes that meet again downstream: it supplies definition dbxrefs (prefix VZ, e.g. GO:0039713 carries VZ:1951) and it declares primary UniProt keywords that generate SPKW GO_REF:0000043 IEA annotations. 107 pages sit on both. Where they coincide, an error upstream is not caught by checking the annotation against the term definition, because the definition came from the same page. SPKW-VIRUS's VZ-primary confidence flag assumed ViralZone's editorial quality without anyone testing it; this subproject tests it.

    Deliverables. projects/SPKW/viralzone/build_viralzone_audit.py enumerates ViralZone from its public sitemap, fetches each page, reads GO's VZ: dbxrefs from the local OAK build, and emits three TSVs (vz-go-xrefs.tsv, vz-dead-xrefs.tsv, vz-dual-path.tsv). No figure on the page is hand-entered: all 22 high-reuse table rows, the dead-xref list and the 24,824-character audit scope were verified programmatically against the generated TSVs before commit.

    Headline result, which corrects the working assumption I started with. Text reuse is the exception: of 148 scorable definitions, 10 are verbatim-ish, 12 close paraphrase, 24 reworded, and 102 (69%) largely independent. GO curators mostly used ViralZone as a reference and wrote their own definitions. The concern is concentrated rather than general -- 17 of the 22 high-reuse terms also sit on the keyword route, so that is where the double-counting risk actually lives, and the page refines SPKW-VIRUS's rule accordingly rather than contradicting it.

    Two measurement traps documented on the page because both silently produce wrong answers. difflib.SequenceMatcher must run with autojunk=False: above 200 characters the default heuristic treats frequent characters as noise and scores GO:0039713 against VZ:1951 at 0.006 instead of 0.82 (I hit this myself before catching it). And page prose must be cut at the UniProt entry table, which ViralZone appends to keyword pages -- VZ:982 is 161 KB of HTML around ~450 characters of definition.

    Maintenance defects found in passing, both filable without biology judgement: four GO terms cite ViralZone pages absent from the live sitemap (VZ:899, VZ:10117, VZ:1518, and VZ:719 on an already-obsolete term), and GO:0039587's label reads "symbiont-mediated-mediated suppression of host tetherin activity". Nine obsolete terms also retain VZ: xrefs; noted so the audit queue skips them.

    Source-quality assessment. ViralZone carries no inline references anywhere -- VZ:695 asserts specific mechanisms for Vaccinia K1 and ASFV A238L with no PMID -- so every claim is tertiary and untraceable. Copy quality is below journal standard. Prose is short (median ~1,300 chars) and the definitional content is largely already harvested into GO. Conclusion: useful for breadth and for definition provenance, not as evidence; never sole support for a curation action.

    A correction made during drafting: I initially wrote that SPKW-BPT4 flags GO:0039666 (pilus attachment) as a good phage target. It does not -- T4 attaches via tail fibers, not a pilus. Replaced with the two terms BPT4 actually names, GO:0099018 (R-M evasion, 9 mentions) and GO:0099000 (contractile-tail ejection, an explicit ACCEPT on T4 gp18/gp19/gp20).

    Scope decision. Filed as a subproject under SPKW rather than a top-level project: 152 terms is a fraction of SPKW's ~180k annotations, the output goes to GO as term-definition issues rather than to gene reviews, and the VZ numbering and VZ-primary analysis already live in SPKW. Consequently no pages/projects/index.html edit is needed, since that index carries one card per top-level project.

    Work queue left open: file the 5 defects, audit the 22 high-reuse definitions against primary literature recording divergences in both directions, grade the 107 dual-path pages so SPKW inherits a per-page confidence instead of a flat boolean, and decide whether VZ: should become quote-checkable.
