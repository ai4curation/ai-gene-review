  summary: Add a retrieval-recall cohort (n=91) measuring what Affinage finds rather
    than what it says
  details: |
    The existing cohorts in this project evaluate Affinage's GO grounding and its narrative — what it says. This adds the orthogonal measurement: used as the deep-research provider for real reviews, how much of the literature the finished review depends on does it actually find? Scored over the 91 human genes carrying a committed Affinage report.

    Pooled recall on novel references is 52%. The denominator is the substance of the result: 908 of the 1626 review-cited PMIDs arrive prepackaged in GOA and need no search, so scoring against all of them understates recall at 32%. Restricted to the 718 references the reviewer had to locate, Affinage supplied 371. Conversely 39% of what it returned was cited.

    gates_passed certifies precision only; there is no recall gate. Two verified misses on otherwise-clean reports: ADAMTSL1 PMID:22242013, the only molecular-function experiment ever done on the human protein, cited seven times in the review; and ACTG2 PMID:38820162, supplying four of five proposed new annotations, cited 29 times. Both absent from the report and from GOA. Six reports returned zero PMIDs unflagged, including the whole AADACL paralogue family; ACTL10's empty report carries gates_passed True.

    Recall does not vary with curation depth (52/50/56% across dark, medium and well-studied bands). The apparent dark-gene collapse in the sorted per-gene table is a small-denominator artifact, so the stratification lives in the script rather than in prose.

    Limits are stated rather than buried, and the larger one is circularity: the reviews were written with the report in hand and 56 of 91 cite it, so the numerator is enriched by construction. 52% is an upper bound.

    Review found two defects, both real and both fixed: a gene listed at 0% recall that the generated table scored at 7%, and a summary field labelled as one set while computing another. Both were prose or labelling drifting from generated data, so the consistency sweep is committed as tests rather than run once — including a guard that had itself reproduced the vacuous-pass defect this analysis criticises elsewhere, and a doctest runner for a module no harness was collecting.
