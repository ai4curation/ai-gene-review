  summary: Refine the filament sequence predictor and validate it on held-out organisms
  details: |
    Added two exclusion rules to filament_baseline.py behind --refine: not a lipoprotein, which is mechanistically motivated since a lipid-anchored protein is tethered rather than a free polymer subunit, and no named InterPro family, since the characterised subunits carry only superfamilies and structural domains while the false positives are already classified as Cytochrome c552, Octaheme c-type cytochrome or Cytochrome c550/c551-like. IPR051174 is excluded from the second rule because it only mirrors PANTHER PTHR30333, which this project records as heterogeneous. Because fitting two rules to four positives risks overfitting, they were tested on two Geobacteraceae not used to derive them, each with known cd21555 members: G. sulfurreducens 26 to 17 with 4 of 4 kept, C. bemidjiense 24 to 12 with 4 of 5, G. daltonii 19 to 14 with 2 of 2. Precision improves about a third at no recall cost. The single miss is attributable to the base filter rather than the refinement: C. bemidjiense B5EHF0 (omcS-3) has no signal-peptide annotation in UniProt and is lost without --refine too, so the signal-peptide clause is recorded as the known recall risk.
