  summary: Measure the heme-chain geometry and answer the autoclassification question
  details: |
    Added heme_geometry.py and RESULTS.md, which test from deposited coordinates the published claim that this class shares a heme arrangement rather than sequence or fold. Across OmcE (4 hemes), OmcS (6) and OmcZ (8), median nearest-neighbour Fe-Fe is 10.4, 9.3 and 9.2 Angstrom, with the two independent OmcZ depositions agreeing to 0.2 Angstrom as a control. Fe-Fe is a proxy for the edge-to-edge distances the papers quote and four structures is a consistency check, not a survey. Added a section answering whether the class can be autoclassified: a sequence HMM cannot see it and neither can Foldseek, since the fold is the part that is not conserved, and plain AlphaFold gives apo monomers that lack hemes and cannot show the inter-subunit ligation. A route exists via CXXCH motifs plus pseudo-iron placement on a predicted monomer, recorded as untested, with the cheap sequence baseline named as the first experiment. Rebuilt the project brief artifact with three figures and the measured chart.
