  summary: Measure out-of-class heme geometry; the spacing band is refuted as a classifier
    and replaced by chain continuity
  details: |
    The project proposed a sequence screen for recall followed by heme geometry for precision, and the geometry had only ever been measured within the class. Measured out of class now, which refutes the proposal.

    In class, extended: the two archaeal ECN structures were located by UniProt accession, 8E5F for PcECN (A3MW92) and 8E5G for AvECN (F2KMU8), and measured after the bacterial band was fixed. Both land inside it, at 10.4 and 9.4 Angstrom, so the published claim that this class shares heme arrangement without fold similarity now has an out-of-sample confirmation across two domains. The in-class band is 9.1 to 10.4 Angstrom over five proteins.

    Out of class, the result is negative. The cytochrome c3 entries PMID:36732469 names as having similar heme-heme distances, 1GYO, 2BQ4 and 2E84, separate cleanly at 11.4 to 11.7 Angstrom, above the band, so they are not a counterexample at the Fe-Fe level; the paper is describing edge-to-edge porphyrin contact and T-stacking, a different measurement. The real counterexample is the pentaheme nitrite reductases, which the sequence screen already yields as its hardest false positives: 1OAH, 2J7A and 3L1T give a median of 9.7 Angstrom each, inside the filament band, between OmcS at 9.3 and OmcE at 10.4, and reproducible across three organisms. Nearest-neighbour spacing therefore cannot be the precision stage, because the proteins it would have to exclude already satisfy it.

    What survives is continuity of the heme chain through the subunit interface, which the papers named all along as hemes coordinated by histidines in adjacent subunits. Added chain_continuity to heme_geometry.py, reporting the closest inter-chain Fe-Fe over the intra-chain spacing plus the fraction of hemes whose nearest neighbour is in another chain. The two multi-subunit filament depositions, 6EF8 with seven OmcS subunits and 7LQ5 with three OmcZ subunits, both measure 1.00, meaning the spacing does not change at the interface, with 29 and 17 percent of hemes having a cross-chain nearest neighbour. Every non-filament is 1.10 or above with 0 to 10 percent. The hardest control is 2J7A, the NrfHA complex, where electrons genuinely cross a subunit interface during catalysis and the junction is still 10 percent longer than the spacing either side of it. The threshold of 1.05 is provisional and rests on two filaments, which is stated in the script and the results page.

    The consequence for the project is recorded rather than softened: the discriminating feature is a property of the assembled polymer, not of the subunit, so the structural stage cannot be a monomer-structure lookup. That compounds the earlier finding that AlphaFold DB models are apo monomers lacking the inter-subunit signature, and the honest present position is that the sequence screen is a candidate generator with no automated second stage.

    Also added a within-chain measurement alongside the pooled one, since pooling all chains is right for a polymer but wrong for a soluble protein crystallised in several copies; for every structure measured here the two medians agree, so no conclusion turns on the choice. The script defaults now cover both the in-class and out-of-class sets so a single command reproduces every number on the results page.
