  summary: Correct two mis-identified negative accessions in the filament screen
  details: |
    Review challenge on PR 6413 disputed the stated reason for excluding CbcL and GSU2359. Checking the accessions showed the dispute was right and the cause worse than suspected: Q74FN7, registered as CbcL, is a nicotinamidase-related cysteine hydrolase (GSU0569), and Q74EV9, registered as GSU2359, is a DsbC/DsbG-like disulphide isomerase (GSU0850). Neither is a cytochrome and neither carries a single CXXCH motif, so both were excluded from the funnel before any clause of the filter applied. That is why nothing caught it: a negative excluded for a nonsense reason is indistinguishable in the output from one excluded for a real reason. The InterPro family names quoted for them in an earlier revision were read correctly off the records, but the records were the wrong proteins, so no claim made about CbcL or GSU2359 before this revision had been tested.

    The real CbcL is Q74GH2 (GSU0274), cytochrome c and cytochrome b, 619 aa, nine CXXCH motifs, with a transmembrane segment, and it is correctly excluded. GSU2359 is Q74AJ5, a family-57 glycoside hydrolase with no hemes, which was never a sensible negative for a cytochrome screen and is dropped rather than repaired. In its place NrfA (Q747W1, GSU3154), the periplasmic nitrite reductase these pages have named as a false positive throughout, is registered: four motifs, a signal peptide and no transmembrane segment, so every clause of the base filter passes it and only the named-family rule removes it.

    The negative set is now built so that each negative tests a different clause, and each attribution is verified by removing one clause at a time rather than asserted. NrfA becomes a false positive as soon as --refine is dropped, and CbcL stays excluded with no upper bound, which pins its exclusion on the transmembrane call. This also answers a fair objection to the named-family rule, that it drops the informative negatives before they can be scored: that rule's one hard case is now scored explicitly.

    Conclusions were re-run rather than assumed. No candidate count depends on the negative list, the five-proteome table is unchanged at 24, 18, 24, 1 and 7 with 13 of 13 recall, and the signal-peptide verdict is identical with the corrected set because NrfA carries a signal peptide and the other two are excluded on topology. Also corrected the cd21555 overlap count, which had reported all four members as plausible extras when two of them are the known positives OmcS and OmcT; the honest figure is two.
