  summary: Add a third multi-subunit filament to the continuity test, and a sixth
    proteome to the screen
  details: |
    The continuity criterion rested on two multi-subunit depositions, 6EF8 for OmcS and 7LQ5 for OmcZ, and the results page named a third as the first thing to add. Searching RCSB for cytochrome nanowires found 9YUQ, a bundled antiparallel extracellular cytochrome nanowire from Desulfuromonas soudanensis, 64 hemes over 16 chains, four per protomer, UniProt A0A0M4DKA8, which UniProt names omcE. The Wissink 2026 ANME structure cited in the cached paper as accession 10RP does not resolve at RCSB and appears not yet released, so it could not be used.

    On the continuity test 9YUQ gives a minimum inter-chain to intra-chain ratio of 1.00, matching the two existing filaments, against 1.10 or more for every non-filament. It was measured after the 1.05 threshold was set and did not move it, which is the only out-of-sample test the criterion has had.

    Examining it closely changed how the statistic is reported. The minimum ratio is an existence claim set by one close pair anywhere in a deposition, so the per-chain count was added: how many chains have their own closest other-chain heme within the factor. 6EF8 is 7 of 7 and 7LQ5 is 3 of 3, uniform wires. 9YUQ is 4 of 16, with two chains at 1.00, two at 1.05, two at 1.054 just over the cutoff and the remaining ten at 1.29 to 1.40, because most of the bundle is laterally packed rather than in axial register. That count is threshold-sensitive, reading 2 of 16 at a factor of 1.03, 4 of 16 at 1.05 and 6 of 16 at 1.07, so it is reported as indicative while the minimum remains the statistic that separates. The chain-level contact topology is recorded as the clearest view: 6EF8 gives a single unbranched run with contacts per chain of 2, 2, 2, 2, 2, 1, 1, 7LQ5 gives 2, 1, 1, and the 18-chain NrfHA complex gives zero contacting pairs.

    One alternative criterion was tried and discarded, and is recorded so it is not retried. Linking every pair of hemes within a fixed distance cutoff and asking for a single connected component fails in both directions: at 14 Angstrom NrfA's dimer links into one component of all ten hemes and reads as wire-like, while the genuine 9YUQ filament fragments into three, and tightening to 12 Angstrom fragments everything including the filaments. It separates the classes at none of the cutoffs tried, which is why the criterion in use is a ratio to each structure's own intra-chain spacing rather than an absolute distance.

    Two consequences elsewhere. The in-class spacing band widens from 9.1 to 10.4 Angstrom to 8.7 to 10.4, because 9YUQ is the tightest-packed member measured; that moves NrfA's 9.7 from just inside the band to near its middle and so strengthens rather than weakens the earlier refutation of spacing as a classifier. And A0A0M4DKA8 is a sixth solved filament, so the D. soudanensis proteome was added to the sequence screen as a clean out-of-sample row, with no rule or threshold touched: 3469 proteins to 7 candidates, a 496-fold reduction, with the filament retained. Recall across six proteomes is now 14 of 14, or 6 of 6 counting only solved filaments rather than cd21555 model members, and that candidate set is the cleanest of the six, all seven survivors being annotated putative multiheme cytochrome c.
