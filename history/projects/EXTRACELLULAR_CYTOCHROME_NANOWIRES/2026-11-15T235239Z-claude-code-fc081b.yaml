  summary: Drop the signal-peptide clause from the filament predictor after measuring
    it
  details: |
    The held-out miss pointed at installing SignalP, so the cheap alternative was measured first and made it unnecessary. Dropping the signal-peptide requirement costs about 25 percent more candidates across the three proteomes (17 to 21, 12 to 16, 14 to 17) and buys complete recall, 11 of 11 known members instead of 10 of 11, recovering C. bemidjiense B5EHF0. Checking each known negative directly also corrected a claim the previous revision of these pages made: the signal-peptide test excludes none of them. ImcH is excluded by having a transmembrane segment, CbcL and GSU2359 by heme count and by carrying a named InterPro family. Added --no-require-signal as the recommended setting, keeping the default so the documented funnel reproduces.
