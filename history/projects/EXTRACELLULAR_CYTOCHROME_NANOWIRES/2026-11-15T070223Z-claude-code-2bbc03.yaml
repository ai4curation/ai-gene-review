  summary: Run the sequence baseline for cytochrome filaments and record the result
  details: |
    Ran the cheap pure-sequence filter named as the first experiment on the project page, to test whether the proposed structural route is necessary. Over the G. sulfurreducens proteome (3402 proteins): at least four heme motifs plus a signal peptide and no transmembrane segment gives 52 candidates with perfect recall on OmcS, OmcE, OmcZ and OmcT, and correctly excludes the inner-membrane cytochromes ImcH, CbcL and GSU2359. Capping heme motifs at eight, which the known subunits respect since they carry four to eight while the false positives reach 34, halves the set to 26 with no loss of recall. Four of those 26 are CDD cd21555 members and so are plausible; the rest include three nitrite reductases including NrfA. S. oneidensis, with no known filaments, gives 10 candidates under the same filter. Conclusion recorded: the filter is a good candidate generator at a 130-fold cut and not a classifier, so the structural half is worth building. Limits recorded, chiefly that precision is measured against only three positives.
