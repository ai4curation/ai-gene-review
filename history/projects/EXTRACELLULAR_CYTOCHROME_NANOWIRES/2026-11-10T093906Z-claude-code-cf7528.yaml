  summary: Create the Extracellular Cytochrome Nanowires project page
  details: |
    Collects the three Geobacter filament cytochrome reviews (OmcS, OmcE, OmcZ), the PTHR30333 family review and CR-0007 under one page, and makes it the single narrative home for the extracellular cytochrome filament term proposal that was duplicated in the OmcS and OmcZ reviews. Records the ontology gap verified against GO on 2026-11-10: no cellular component for the filament and no process term for extracellular electron transfer, direct interspecies electron transfer or dissimilatory metal reduction, with the nearest CC terms (pilus, bacterial-type flagellum, cytochrome complex) all wrong in ways that matter. Records why sequence-based classification fails for this class, citing Baquero 2023 and Wang 2022 that the subunits share heme arrangement but not fold. Keeps the conductivity dispute as a recorded dispute rather than adjudicating it, since no annotation depends on it. Scope deliberately excludes conduction mechanism and materials applications.
