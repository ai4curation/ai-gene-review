  details: |
    Prompted by the PSEPK/PSEAE parB reviews. TIGR00180's 79 reviewed members span chromosomal ParB (32), Noc (33), plasmid SopB/P1 ParB/KorB/RepB (10), YubM (2) and Shigella VirB (2). GO:0007059 already covers 27,383/28,687 entries and all 6 reviewed gaps are plasmid partition proteins or VirB, so it is recorded as a narrowMatch (do not blanket-propagate); GO:0003677 is the family-level exactMatch; NCBI's GO:0000910 cytokinesis is not mapped. Seed now 252 rows (247 exact, 3 narrow, 2 broad); counts updated in NCBIFam.md; added the ParB paragraph and autolink_exclude for ParB. REFSEQ_GO.md: caveat that adding GO:0007059 to architecture 11445026 is safe only because Noc, SopB and KorB are named by their own PGAP models.
