  summary: 'NF041162 encapsulin mapping: check for viral capsid contamination'
  details: |
    Checked the NF041162 -> GO:0140737 exactMatch against Aguilar et al. 2026 Nat Commun (PMID:42875451), which reports the SrpI-like encapsulin domain in HK97-fold phage major capsid proteins. UniProtKB: 0/933 NF041162 members are viral; the 17 phage PF19307 capsids are NCBIFAM NF045672 (disjoint). Genomic context (+/-8 kb, NCBI) of 932 members: 829 with cysteine-desulfurase cargo; 6 with phage-gene names, hand-inspected, only H6SQ81 ambiguous. Mapping stands; recorded that a domain-level PF19307/IPR045641 rule would be unsafe. Script and results in projects/NCBIFam/NF041162-hypotheses/genomic_context/.
