    Independent re-review of the WRONG_GENE_PRODUCT / WRONG_REFERENCE source defects in this file (evidence re-read at the best available depth; identifiers verified by lookup; curator-deference rule applied).
    - UniProtKB:P0A9N8 (WRONG_GENE_PRODUCT): WITHDRAWN. Mis-typed. Verified by UniProt: P0A9N8 = nrdG (anaerobic RNR-activating protein, a radical-SAM activase) and P28903 = nrdD (the anaerobic ribonucleoside-triphosphate reductase). The annotation at issue (nrdG GO:0015949 nucleobase-containing small molecule interconversion) is correctly on nrdG: its GOA rows are properly symboled nrdG, the IMP seed (PMID:8954104) is an nrdG knockout, and the nrdG review states the IBA node (PTN001576428) is "correctly placed for clade membership." The problem is that the interconversion term describes nrdD's reductase chemistry, which nrdG only enables (installs the glycyl radical) - a necessity-vs-participation / role-conflation OVER-ANNOTATION, not a gene-identity error. The per-gene nrdG review records NO source defect; it handles this with MARK_AS_OVER_ANNOTATED + propagation_review (ROLE_CONFLATION). Per the project rule "an over-annotation is our review judgement, expressed by the action, not a source defect," I removed this entry (the annotation is not on the wrong gene, and repointing it to nrdD would be wrong). Updated source_defect_summary total 10 -> 9 and by_resource OTHER 5 -> 4 for consistency; the object-row MARK_AS_OVER_ANNOTATED judgement at line ~917 is retained and consistent. synthesis.yaml re-parses as YAML; no LinkML schema binds it.
