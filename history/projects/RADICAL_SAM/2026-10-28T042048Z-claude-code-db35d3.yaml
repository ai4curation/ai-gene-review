  summary: 'Phase 4: superfamily synthesis'
  details: |
    Completed Phase 4 of the RADICAL_SAM project: a superfamily-level synthesis computed from the 28 reviews rather than written from memory. Added projects/RADICAL_SAM/rsam_synthesis.py, which takes its gene list from the project page frontmatter and derives every figure from the review YAML, writing projects/RADICAL_SAM/data/synthesis.yaml. Main findings: the family's annotation problem is resolution rather than error (210 ACCEPT, 49 REMOVE, 112 MODIFY across 470 rows); GO:1904047 S-adenosyl-L-methionine binding was absent from GOA for 18 of the 20 members with established catalysis, a systematic gap the curated UniProt cofactor note could close; six members' core activity has no GO term and carry proposed_new_terms, three of them for reactions described since 2018; the treatment rule's only genuine deviations are MOCS1's three rows in the pre-existing review, which quantifies the Phase 3 worklist; and of 18 reviewed IBA rows only four were propagation failures, with signature-based IEA mappings producing more wrong claims, so PAINT was not the main culprit for paralog over-annotation here. The HemN/HemW case gives a mechanical test: when a subfamily loses an activity the molecular function is usually re-placed correctly while the biological process is left on the deeper node. Set maturity to IN_PROGRESS; Phase 3 remains outstanding.
