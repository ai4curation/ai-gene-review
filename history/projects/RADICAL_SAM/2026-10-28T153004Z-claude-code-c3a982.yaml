  summary: 'Phase 3: consistency pass over the pre-existing reviews'
  details: |
    Completed Phase 3 of the RADICAL_SAM project: applied the treatment rule for the domain-derived generic rows to the 17 radical SAM reviews that existed before the project. 43 rows re-actioned, 10 NEW GO:1904047 rows added, 29 core-function entries added and one core molecular function withdrawn.

    Every conflict listed when the rule was adopted resolved in the direction the rule names: 12 rows had been MARK_AS_OVER_ANNOTATED on terms that are not false, 4 were TOO_GENERAL without any more specific term asserted elsewhere, 6 filed the catalytic cofactor or cosubstrate as peripheral, and 2 used UNDECIDED where the reaction rather than the evidence was what was unresolved. Three rows on terms outside the rule table (GO:0016740, GO:0016783) followed the same principle, with human/LIAS as precedent. SACEN/eryCV now asserts no core molecular function, matching the project's other uncharacterised members: it is PE 4 Predicted, its only name is an unreviewed submitter annotation, and its reaction row is UNDECIDED.

    Corrected human/MOCS1's stale status INITIALIZED, which the Phase 4 data_quality block had been reporting; that block is now empty.

    Made the Phase 3 claim verifiable rather than asserted: rsam_synthesis.py now checks the same rule over a second scope, the pre-existing reviews listed in projects/RADICAL_SAM/data/phase3_scope.yaml, through the same rule_check() used for the genes in scope. Both scopes report zero deviations and tests/test_radical_sam_synthesis.py asserts both are empty. Widened the rule for GO:0051539 from ACCEPT to ACCEPT-or-NEW, because GOA does not always carry the 4Fe-4S row (PSEPK/bioB has GO:0051537 but not GO:0051539) and a cofactor the rule calls core has to be proposable where it is missing.

    Phase 4 figures shifted with MOCS1's three rows: MODIFY 112 to 115, KEEP_AS_NON_CORE 67 to 65, MARK_AS_OVER_ANNOTATED 21 to 20; the page and data/synthesis.yaml were regenerated together.

    Cross-checked the seven named modules. Where a module states a molecular function for a radical SAM step it agrees with the review's core MF in every case, including heme_biosynthesis typing HemN with GO:0051989 rather than the O2-dependent GO:0004109, which is the same correction this project filed against InterPro2GO IPR004558. Recorded four module curation gaps on the project page rather than as knowledge_gaps, since a curator closes them by annotating: ECOLI/queE is in no module; Fe-S cofactors are recorded on the bioB, moaA, hemN and thiH annotons but not the lipoylation or PqqE ones; moaA_gtp_38_cyclase has no family descriptor while its sibling moaC annoton does; and human/MOCS1, METEA/pqqE and the three POPTR lipoyl synthases are missing from representative-member lists.

    lipA (ECOLI) remains the one unreviewed gene in the project and is unchanged here.

    Addressed the review on PR #5691. Dropped eryCV's directly_involved_in GO:1901115: after the DE-label quote was removed under the UniProt-label policy, the entry's only support was two radical SAM family signatures that say nothing about erythromycin, and the record has no CC:PATHWAY line or erythromycin keyword, so the sole pathway signal was the submitter gene name the same review discounts when declining to name a molecular function. Trimmed that entry's description to biology, leaving the rationale in the rows' review.reason.

    Replaced the comparator in all 10 NEW GO:1904047 reasons. They had cited this project's own proposals, which cannot falsify anything; GOA in fact annotates GO:1904047 to radical SAM enzymes in the same role by UniRule (ECOLI/queE UR000100349; ECOLI/moaA and PSEPK/moaA UR000101305; METEA/pqqE and PSEPK/pqqE UR000098303), verified in the GOA files, so the absence is patchy UniRule coverage rather than a GO convention against the term. That also explains why those five genes have an existing row to ACCEPT or MODIFY while the other 18 need a NEW one.

    Gave the enforced rule an escape hatch. The rule table documents a branch its constant cannot express (keep GO:0046872 where a separate mononuclear metal ion is bound), and the new test turns a deviation into a CI failure, so honouring that branch would have meant editing a test. Such rows now go in projects/RADICAL_SAM/data/rule_exceptions.yaml and are reported under documented_rule_exceptions; an entry matching no row is reported stale and fails the test. Not the schema's review.consistency_exception, which is scoped to action_consistency.yaml and whose validator warns when a row declares one but is in no action-consistency conflict. Empty today, with a unit test driving rule_check() directly so the path is covered.

    Fixed the script docstring, which still described the MOCS1 status bug in the present tense after this change fixed it, and recorded on the project page that the canonical mechanism for a GO:0051539 row GOA lacks is an explicit NEW row (PSEPK/bioB) rather than only a replacement target (SCHPO/bio2, yeast/BIO2). Left the pre-existing file:genes/... prefix anomaly in STAWA/cfr alone as out of scope.

    Corrected the transition count on the project page from 43 to 44. Moving eryCV's GO:0033068 row to KEEP_AS_NON_CORE added a transition that the computed table and the eryCV bullet both omitted, which matters on a page whose claim is that its figures come from the diff. Recounted mechanically against origin/main: 44 transitions, and the GO:0033068 ACCEPT -> KEEP_AS_NON_CORE row is now in the table. The eryCV bullet also now records that two of its rows move to non-core rather than one, and on what evidence GO:0033068 survives.

    Tightened the eryCV paragraph's WITH/FROM sentence, which called IPR016863 a 'DesII family signature'. It is an InterPro entry, not a member-database signature, and that distinction is exactly what the round's finding was about: a UniProt record carries entries and signatures as unrelated DR lines, so no entry-to-signature pairing can be read off it. The sentence now says entry, and notes that the reviews assert no such pairing.

    Also corrected the project's Scope sentence, which had defined membership by 'the InterPro IPR007197 Radical SAM signature'. IPR007197 is an entry, and the UniProt query beneath it is a cross-reference to that entry rather than to a member-database signature. This predates the pass and was not flagged, but it is the same conflation the pass had just drawn a distinction about, in the sentence that defines the project's membership, so leaving it would have been inconsistent one level up.
