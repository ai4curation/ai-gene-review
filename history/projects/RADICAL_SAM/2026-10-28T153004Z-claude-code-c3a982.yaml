  summary: 'Phase 3: consistency pass over the pre-existing reviews'
  details: |
    Completed Phase 3 of the RADICAL_SAM project: applied the treatment rule for the domain-derived generic rows to the 17 radical SAM reviews that existed before the project. 43 rows re-actioned, 10 NEW GO:1904047 rows added, 29 core-function entries added and one core molecular function withdrawn.

    Every conflict listed when the rule was adopted resolved in the direction the rule names: 12 rows had been MARK_AS_OVER_ANNOTATED on terms that are not false, 4 were TOO_GENERAL without any more specific term asserted elsewhere, 6 filed the catalytic cofactor or cosubstrate as peripheral, and 2 used UNDECIDED where the reaction rather than the evidence was what was unresolved. Three rows on terms outside the rule table (GO:0016740, GO:0016783) followed the same principle, with human/LIAS as precedent. SACEN/eryCV now asserts no core molecular function, matching the project's other uncharacterised members: it is PE 4 Predicted, its only name is an unreviewed submitter annotation, and its reaction row is UNDECIDED.

    Corrected human/MOCS1's stale status INITIALIZED, which the Phase 4 data_quality block had been reporting; that block is now empty.

    Made the Phase 3 claim verifiable rather than asserted: rsam_synthesis.py now checks the same rule over a second scope, the pre-existing reviews listed in projects/RADICAL_SAM/data/phase3_scope.yaml, through the same rule_check() used for the genes in scope. Both scopes report zero deviations and tests/test_radical_sam_synthesis.py asserts both are empty. Widened the rule for GO:0051539 from ACCEPT to ACCEPT-or-NEW, because GOA does not always carry the 4Fe-4S row (PSEPK/bioB has GO:0051537 but not GO:0051539) and a cofactor the rule calls core has to be proposable where it is missing.

    Phase 4 figures shifted with MOCS1's three rows: MODIFY 112 to 115, KEEP_AS_NON_CORE 67 to 65, MARK_AS_OVER_ANNOTATED 21 to 20; the page and data/synthesis.yaml were regenerated together.

    Cross-checked the seven named modules. Where a module states a molecular function for a radical SAM step it agrees with the review's core MF in every case, including heme_biosynthesis typing HemN with GO:0051989 rather than the O2-dependent GO:0004109, which is the same correction this project filed against InterPro2GO IPR004558. Recorded four module curation gaps on the project page rather than as knowledge_gaps, since a curator closes them by annotating: ECOLI/queE is in no module; Fe-S cofactors are recorded on the bioB, moaA, hemN and thiH annotons but not the lipoylation or PqqE ones; moaA_gtp_38_cyclase has no family descriptor while its sibling moaC annoton does; and human/MOCS1, METEA/pqqE and the three POPTR lipoyl synthases are missing from representative-member lists.

    lipA (ECOLI) remains the one unreviewed gene in the project and is unchanged here.
