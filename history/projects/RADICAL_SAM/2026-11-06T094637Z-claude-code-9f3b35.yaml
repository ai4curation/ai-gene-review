- type: EDIT
  outcome: changed
  summary: Regenerated synthesis.yaml and corrected the now-false claim that SourceResourceEnum
    has no INTERPRO value
  details: |
    Two consequences of PR #6027's InterPro2GO re-filing, both caught by this
    project's own drift test rather than by me.

    projects/RADICAL_SAM/data/synthesis.yaml regenerated. The file is a
    committed derived artifact: rsam_synthesis.py recomputes it from the 29
    reviews in scope, and tests/test_radical_sam_synthesis.py asserts the
    committed copy equals a fresh run, precisely so the page's "computed, not
    recalled" claim cannot rot. Re-filing four defects on ECOLI/nrdG, ECOLI/hemN
    and ECOLI/hemW (IPR012837, IPR004558, IPR004559 x2) from resource: OTHER to
    INTERPRO changed four rows and the by_resource summary (OTHER 5 -> 1,
    INTERPRO 4 added). Six insertions, five deletions; no figure in the file
    changed other than those.

    The page's own statement was false after the change, and this is the part
    worth recording. It read: "SourceResourceEnum has no INTERPRO value, so
    those four are filed as resource: OTHER with InterPro named in each
    explanation." The enum gained INTERPRO in #5984 and the four were re-filed
    in #6027, so both halves had stopped being true. It now says they are filed
    resource: INTERPRO and route to reports/source-defects/INTERPRO.md, with the
    OTHER history kept as history rather than dropped, since the reason the
    defects were once filed that way is part of how the gap was found.

    This is the same failure shape as #5984's round-1 blocking finding, where
    projects/CACAO.md still recorded the enum gaps as open after the schema
    closed them. Swept the rest of the repo for the class: CACAO.md already
    reads "had no INTERPRO value - done in #5984" (past tense, correct), the
    FUNCTION_REQUIREMENT_RULES hit is about a UniProt entry's InterPro matches
    and unrelated, and none of the 75 re-filed reviews still carries a
    no-enum-value justification. RADICAL_SAM.md was the only stale one.

    How it was found: the merge queue dequeued #6027 with CI_FAILURE. The
    failure was real, not the VALIDATION_RESULT: cancelled signature that
    accounted for seven false failures on #5984 - VALIDATION_RESULT was success
    and SUITE_RESULT failure, 1 of 5385 tests. Established as this PR's by
    running the test at three points: it passes on plain origin/main, passes at
    this branch's merge-base, and fails on the branch head. The ECOLI/ydeM lines
    in the CI log were neighbouring entries in the same dict dump, not the
    cause.

    Checked that main's drift was not also involved: main had moved 80 gene
    reviews since this branch's base, and none of them is in the synthesis's
    29-gene scope, so regenerating here gives the same result as regenerating on
    merged main. No project file under projects/RADICAL_SAM/ changed in main
    since the base either.

    No gene review, annotation, term, action, evidence code or core function
    changed.
