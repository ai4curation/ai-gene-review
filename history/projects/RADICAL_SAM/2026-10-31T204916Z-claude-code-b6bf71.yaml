  summary: lipA reviewed; the project's gene scope is complete
  details: |
    ECOLI/lipA, the one gene left unreviewed when Phase 2 ran, is now reviewed, so all 29 members in scope have a finished review and nothing is excluded from the Phase 4 figures any more.

    Regenerated data/synthesis.yaml and updated every figure the page quotes: 28 reviewed across 500 rows becomes all 29 across 519; ACCEPT 210 to 218, MODIFY 115 to 122, REMOVE 51 from 49, NEW 29 from 28, MARK_AS_OVER_ANNOTATED 21 from 20; the uninformative protein-binding share of REMOVE 34 to 36; the SAM gap 18 of 20 members with established catalysis to 19 of 21; core-function assertions 25 of 28 to 26 of 29, and the count whose core functions use existing GO terms 19 to 20. The generic-row table was recomputed from the data rather than adjusted, and now includes the GO:1904047 line. Each claim was checked back against synthesis.yaml mechanically, and the action table and remove_breakdown were asserted to sum to the row and REMOVE totals.

    Phase 2's heading and the lipA checkbox were updated, and the standing 'lipA is not reviewed' note replaced. The 2026-10-19 note recording the safety-classifier interruption is left as written, with a pointer to the resolution, since the log is append-only in spirit.

    Added a 2026-10-31 NOTES entry recording the completion, how the review was written without reissuing blocked content or delegating it, and a validator quirk worth knowing: the supporting_text checker strips square brackets as editorial, so a quote containing [lipoyl]H-protein fails although verbatim, while [4Fe-4S] is exempt as scientific notation.

    maturity is left at IN_PROGRESS deliberately. Every checkbox in STATUS is now ticked, but the project's upstream deliverables -- seven proposed new terms and ten source defects -- have not been submitted, so whether the project counts as complete is the owner's call rather than mine.
