  summary: Keep the thermoregulation summary true after the Tacr3 regrade
  details: |
    Review finding on PR #6363, consequential edit. The thermoregulation bullet said the hot-flush role rests "in mouse on neuron manipulation". That was already incomplete and became misleading once the mouse Tacr3 GO:0001659 row was regraded to EXP precisely because its primary experiment is systemic administration of a selective NK3R agonist. The bullet now reads "a selective NK3R agonist plus manipulation of the kisspeptin and NK3R neuron populations", which covers both mouse rows: the agonist and ablation arms behind Tacr3 and the optogenetic/chemogenetic arm behind Tac2. One sentence, no change to scope, status or plan.
