  summary: Trim CR-0013 to the tRNA-U47 term and record its overlap with UniRule UR000077057
  details: |
    CR-0013 no longer assigns GO:0106414 mRNA dihydrouridine synthase activity, which is demonstrated in fission yeast only (PMID:34798057) and for which the human study asks for orthogonal validation (PMID:34556860). It now assigns GO:0102265 only and moves from DRAFT to PROPOSED. Checked what already supplies that term (UniProtKB 2026_04): the curated UniRule UR000077057 (formerly RU291113; PF01207 AND PROSITE PS50103 AND Eukaryota, 2,982 entries) selects the same subfamily and assigns GO:0017150 and EC 1.3.1.-, with EC 1.3.1.89 in Fungi only; outside Fungi EC 1.3.1.89 comes from ARBA00012376 and reaches GO:0102265 through EC2GO. 2,526 entries match both rules, 448 only CR-0013 and 456 only the UniRule. The trimmed rule adds the term to 35 unreviewed entries, 25 of them fragments. The human U47 quote replaces the mRNA quotes in supported_by. Validated with just validate-curated-rules, the UniProt count check and quote_check. rules/curated/README.md and PFAM.md Part 3 updated to match.
