  summary: 'Add Part 3: high-value, unique Pfam to GO candidates'
  details: |
    Added projects/PFAM/high_value_unique.py and its generated outputs (HIGH_VALUE_UNIQUE.md, high_value_unique_candidates.yaml), and a Part 3 section in PFAM.md. The script tests, on the reviewed members of every Pfam family, which specific non-binding molecular-function terms the family shares, whether any InterPro entry the same proteins match already supplies the term through interpro2go, and (via UniProt count queries) how many unreviewed members already carry it from any pipeline. It also flags reviewed members with a different function, and takes a census of Pfam use in rules/curated and projects/INTERPRO/interpro2go.sssom.yaml (none). Run of 2026-11-11 on InterPro 111.0, interpro2go 2026-07-06, GO 2026-07-26, UniProtKB 2026_04: 3,562 candidate pairs, 2,229 already supplied by InterPro2GO (1,389 only through an entry other than the family's own), 1,333 not supplied, 379 open after discounting other pipelines, 227 headline. Checked with tests/test_project_frontmatter.py and tests/test_project_counterparts.py and a local render-projects of both pages. No mapping is asserted; rows are candidates for curation.
