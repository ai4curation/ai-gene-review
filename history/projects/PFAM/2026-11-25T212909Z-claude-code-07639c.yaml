  summary: Curated rules CR-0012 to CR-0015 from the Pfam-only candidates; GH16_XgeA
    dropped
  details: |
    Profiled all UniProtKB members (2026_04) of the five Pfam families behind the six Pfam-only headline pairs with the new projects/PFAM/pfam_rule_probe.py, then wrote four curated rules. CR-0012 (PROPOSED): PF13289 SIR2-like domain AND NOT IPR050134 to GO:0003953; 8,620 matched, 8,300 unreviewed lack the term; supported by NADase evidence from Thoeris ThsA, DSR2, Argonaute-associated Sir2, Sir2-HerA and FAM118. CR-0013 (DRAFT): PF25585 AND PF01207 to GO:0102265 and GO:0106414; 2,974 matched; draft because the mRNA activity is demonstrated in fission yeast only and the human DUS3L study asks for orthogonal validation. CR-0014 (PROPOSED): PF22632 AND NOT IPR018146 AND NOT IPR051785 to GO:0016702; 2,589 matched; notes a possible InterPro2GO over-annotation by IPR018146 that was not verified. CR-0015 (PROPOSED): PF05406 AND PF00644 AND Eukaryota to GO:0140806 and GO:0140807; 6,787 matched; can equally be written on IPR008893 and IPR012317, so it is not Pfam-only. No rule for PF26113 GH16_XgeA: one experimentally characterized reviewed member, a median of four paralogs per genome, a structurally characterized endo-1,3-beta-glucanase member, and no GO ancestor of the two activities more specific than what InterPro2GO already assigns. Checks: just validate-curated-rules (15 pass), UniProt counts via curated_rules check --count match the recorded matched_count, quote_check verifies all 10 supporting quotes, pytest for curated rules and project pages. Cached nine publications and fetched InterPro metadata for the seven Pfam families named. PFAM.md Part 3 and rules/curated/README.md updated.
