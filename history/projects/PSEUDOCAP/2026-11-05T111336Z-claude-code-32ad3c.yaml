  summary: 'Tier 2 reviewed: 284 of 289 shared-node seed proteins'
  details: |
    Reviewed 284 of the 289 tier-2 PAO1 proteins (node terms with other seeds as well), covering 342 seedings and 43,061 leaf IBAs. Recorded 156 PseudoCAP defects (60 CONFIRMED, 70 PROBABLE, 26 SUSPECTED) on 130 genes, 41 PAINT/GO_CENTRAL, 10 UniProt and 1 other. Eleven seed rows describe a different gene or organism, among them the swapped BetT2/BetT3 choline transporter rows and four cases citing another species' paper. Eleven CONFIRMED node-term defects, including ArgJ-type activity on acetyl-CoA N-acetylglutamate synthases, cytochrome-c oxidase activity on a cytochrome/bc1 clade, and N-succinylarginine dihydrolase at the root of a family holding the unrelated succinyltransferases. Added the tier-2 results section to the project page, refreshed the defect reports and re-rendered the page. Not done: xcpT, xcpU, PA0681, PA0685, xqhA and the algC audit, whose agent was stopped by a safety classifier.
