  summary: Record all four tier-3 shared-claim groups
  details: |
    All four shared_claims groups that were entirely unreviewed when tier 3 opened are now done, 12 reviews in total, and the page records each because they turned out to be four different kinds of error -- which is the argument for grouping by shared claim rather than reviewing gene by gene. The cbb3 oxidases: one operon-level phenotype applied to eight subunits, separated by what each chain contributes, with the qualifier defect at PROBABLE because only an abstract was available. MCC: the same qualifier question settled at CONFIRMED because the full text shows the IDA was measured on a reconstituted two-subunit enzyme, plus a NEW term for the beta subunit unannotated half-reaction. The haem receptors: siderophore terms propagated from the LUCA root of PTHR30069 to the haem subfamilies, with relocation tested and ruled out because the smallest clade holding the five seeds also holds the haem subfamilies. The T6SS pair: toxin sequestering activity annotated to both the toxin and its antidote, removed from the effector with a WRONG_GENE_PRODUCT request and kept on the immunity protein, and a secretion row on the immunity protein marked over-annotated under the involved_in rule. Counts reconciled against the committed files: worklist 142 selected, 110 reviewed, 32 remaining (98 + 12 + 32), and the defect reports hold 431 entries matching the 431 recorded under genes/PSEAE.
