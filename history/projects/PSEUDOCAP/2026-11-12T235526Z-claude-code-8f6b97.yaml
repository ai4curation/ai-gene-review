  summary: Open tier 3 and record the cbb3 oxidase group
  details: |
    Plan item 6, the rest of the PseudoCAP corpus, is now started. Added a Tier 3 section explaining why the selection principle differs from tiers 1 and 2 (nothing here seeds a PAINT node, so the question is whether a row says what the experiment showed rather than whether a node suits its clade), the new builder and worklist, the four shared_claims groups it found, and the first group reviewed: the eight cbb3 oxidase subunits that all carry the same GO:0004129 IMP row from one whole-operon-deletion paper. The section records the gradient the six new reviews apply, the RCSB structural check on PDB 8SMR and 8SNH that identified PA4133 rather than CcoN1/CcoN2 as the modelled catalytic subunit and found no CcoQ chain in either model, and why CcoQ is marked over-annotated rather than removed.
