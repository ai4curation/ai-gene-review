  summary: 'PR review round 1: the tier-1 completeness sentence was stale the same way tier 3 was'
  details: |
    The review found that genes/PSEAE/pvdE/pvdE-ai-review.yaml exists while the page says in three
    places that it is still to be written. Correct, and it is the same defect this PR was opened to
    fix, one tier up: a completeness statement that stopped tracking the work.

    Deriving the figure rather than incrementing it turned up a second error the review did not name,
    and the two cancel in the count. Matching each of the 109 tier-1 table rows against
    genes/PSEAE/<symbol>/ and genes/PSEAE/<locus>/ gives 106 with a review and three without - wzm,
    pqsA, PA2403 - which is the page's number but not the page's membership, since the page names
    pvdE and never mentions wzm. wzm is in fact reviewed: line 110 of this page records it as
    "wzm/Q9HTB8", reviewed before the project began, and its folder is genes/PSEAE/Q9HTB8 because the
    entry has no gene symbol. My first lookup tried the symbol and the locus and not the accession, so
    it reported a false negative for exactly the convention the page documents two hundred lines above.
    That is the third time in this session a lookup pattern narrower than the data produced a
    confident wrong answer, after head -20 on a UniProt CC block and a grep alternation that omitted
    genes/ paths.

    Resolving by accession as well gives the truth: 107 of 109 have reviews, and the two without are
    pqsA and PA2403. So the page was wrong on the count and on the membership, and had the count been
    taken as corroboration of the membership it would have read as consistent.

    Corrected in three places - the Bottom line, the tier-1 results paragraph and the Not completed
    section - with the provenance stated: pvdE was written in tier-3 batch 5 (PR #6754, a3073d800f),
    not in the commit this branch is based on, and the Not completed section's note that a safety
    classifier blocked the write now applies only to pqsA. Both pqsA and PA2403 genuinely have folders
    with no review file, verified, so the page is right about them.

    Render warnings 101 before and after, as for the earlier edit.
- type: EDIT
  outcome: changed
  sections:
  - results
  summary: "PR review round 1: the defect tally's own self-check was false by 46, and the reports were stale"
  details: |
    The page asserted "423 in all, matching the 423 source_defects entries recorded under genes/PSEAE".
    Counted from the gene reviews: 469 - PSEUDOCAP 307, GO_CENTRAL 120, UNIPROT 30, INTERPRO 9,
    GOA_EBI 2, CACAO 1. The claim was true when written and false by 46 when read, and the clause
    asserting the match is what turned a stale snapshot into a false statement about agreement.

    Fixed by re-running the project's own exporter rather than editing the numbers:
    projects/PSEUDOCAP/export_pseae_defects.py collects every source_defects entry under genes/PSEAE
    and writes the per-resource reports. It regenerated five reports, created CACAO.md and GOA_EBI.md,
    and deleted the OTHER.md catch-all those two replace. The paragraph now carries the exporter's
    output with its date, points at the exporter, and says to re-run it rather than edit a total here -
    so the agreement between page and data is structural rather than asserted.

    The missing GOA_EBI report mattered more than the arithmetic, and the reviewer's framing was right
    even though the detail was slightly off. There was no report at all for GOA at EBI, and its two
    entries are the WRONG_GENE_PRODUCT / DELETE_ROW requests from the femA and femI reviews - one each,
    not two from femA as the review said. Those are the upstream deliverable of the femA finding this
    PR's new GO:0016987 paragraph is written around, so the page celebrated the finding while the
    mechanism for sending it upstream produced no file.

    Render warnings went 101 to 120, and the cause was isolated rather than assumed: with the prose
    edit reverted and only the regenerated reports in place the count is still 120, so all 19 come from
    the two new report pages and none from the new prose. Those pages are the exporter's own output; a
    warning in them is a property of the exporter, not of this edit.

    Second instance in one review round of the same defect at a different scale. Both the tier-1
    completeness sentence and this tally were figures copied once and then left, and in both cases the
    fix was to derive. The tally is the worse of the two because it carried an explicit self-check,
    which reads as evidence that someone verified it.
- type: EDIT
  outcome: changed
  sections:
  - results
  summary: 'PR review round 2: a third stale tally, and the GOA_EBI sentence described the wrong records'
  details: |
    The confidence tally at the end of the upstream-reports paragraph said "After tier 2 and the tree
    check the totals are 96, 126 and 50 for PseudoCAP and 32, 83 and 1 for PAINT". Those sum to 272
    and 116 - the exact pair this PR replaced with 307 and 120 four lines above. Derived from the gene
    reviews: PSEUDOCAP is 121 CONFIRMED / 131 PROBABLE / 55 SUSPECTED and GO_CENTRAL is 38 / 80 / 2,
    summing to the current figures.

    The review offered two fixes, update the numbers or re-tense, and the better answer is both: the
    sentence now says what the totals were after tier 2, notes that those sum to the superseded pair,
    gives the current figures with their date, and says to re-run the exporter rather than edit them.
    Re-tensing alone would leave a reader with no current figure next to a paragraph that has one;
    updating alone would create a fourth number to go stale. This is the third tally in one file to
    need the same treatment, which is the argument for the series being derived at render time rather
    than maintained - recorded here rather than attempted in a status PR.

    Separately, a factual error in text this PR added. The new paragraph said the two GOA at EBI
    entries "are the WRONG_GENE_PRODUCT requests from the femA and femI reviews". They are not the
    repoint requests; those are PseudoCAP entries. They are the two GO_REF:0000108 rows inferred from
    the misplaced ones - GO:2000142 on Q9I2J4 and GO:0033214 on Q9I2J2 - each reported at PROBABLE as
    a consequence to be re-derived once the repoint lands, the inference being sound and only its
    input wrong. Corrected.

    How I got it wrong is the same shape as three earlier instances today. I checked defect_type and
    resource, saw WRONG_GENE_PRODUCT on both, and concluded about the records without reading which
    record each entry names. Checking a field and asserting about the thing the field belongs to.

    Three non-blocking items also carried, all verified: the genes: frontmatter listed tatA and tatC
    but not tatB, femA or femI, though all three appear in passages this PR edits; pvdE was in
    autolink_exclude, so the one symbol the page now says is reviewed was the one that could not link,
    and the exclusion was presumably added when it had no review; and these history events used
    sections values matching no heading on the page, now results, which prior records in this folder
    use. Render output unchanged at 8 pages and 120 warnings.
- type: EDIT
  outcome: changed
  sections:
  - results
  summary: 'PR review round 3: the pvdE fix stopped at the prose and left the table and plan contradicting it'
  details: |
    Round 1 corrected three prose passages that called pvdE unwritten. It did not touch the tier-1
    summary table, which still carried "Review file not yet written (pvdE, pqsA, PA2403) | 3 | 151",
    nor Plan item 1, which still said the work was done "except for writing the pqsA, PA2403 and pvdE
    review files". So the page asserted at line 137 that pvdE is no longer in that list and at line 149
    that it is.

    This is the fourth time today I have fixed the instances a reviewer named and left their siblings,
    after the reference_review disclaimer, the provenance invariant in the InterPro header, and the
    enumeration gloss. The round-3 record on PR #7078 states the lesson in as many words. What makes
    this one different is that the siblings were findable by the obvious search: grepping the page for
    pvdE returns five hits and I had looked at three of them. The failure was not a narrow search
    pattern this time but stopping once the cited passages were fixed.

    The leaf-IBA column is what made it more than a stale name list. pvdE carries 140 leaf IBAs
    (line 284), so the row's 151 was 140 + 11, and removing the name without moving the count would
    have broken the 109 / 4,772 totals. pvdE needed a destination row.

    Chose "Seed right for PAO1, but the node term does not fit its clade" on the page's own evidence:
    pvdE's table row gives its seed as SOUND with the issue "Node too deep: 126 of 140 leaves are
    NBD-only proteins", which is a node-fit problem rather than a soundness one, and line 471 groups
    pvdE with PA5458 and PA3760, both of which already sit in that row's list. Recorded as a judgement
    rather than a derivation because the page is not self-consistent here: pqsH shares that same
    line-471 grouping and sits in the Sound list instead. The reviewer was right to leave the choice
    open rather than assert one.

    Result: node-does-not-fit 23 to 24 genes and 664 to 804 IBAs; not-yet-written 3 to 2 and 151 to 11;
    both column totals verified to still sum to 109 and 4,772. The bullet list for that row gains pvdE
    and Plan item 1 drops it.

    Swept every pvdE mention afterwards rather than assuming: five hits, all now consistent, and all
    four "not written" claims name only pqsA and PA2403. Render unchanged at 8 pages, 120 warnings.
