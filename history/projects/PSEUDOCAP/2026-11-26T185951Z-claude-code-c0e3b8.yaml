- type: EDIT
  outcome: changed
  sections:
  - results
  summary: 'Tier 3 complete: all 142 selected genes reviewed; correct the GO:0016987
    group and the tatB note'
  details: |
    The status PR for PseudoCAP tier 3, now that batch 8 (PR #7062) has merged and every selected gene
    carries a review. Four corrections, each verified against the data rather than taken from the
    carried-forward note that requested them - and one of those notes was wrong.

    1. The worklist is re-derived, not hand-edited. projects/PSEUDOCAP/pseudocap_mf_worklist.yaml had 32
       rows with review_folder: null and summary selected_reviewed: 110 / selected_remaining: 32. All 32
       of those genes do have a review on disk, checked by resolving each symbol under genes/*/. Rather
       than type the values in, I imported reviewed_accessions() from the worklist's own generator
       (projects/PSEUDOCAP/build_pseudocap_mf_worklist.py) and applied it, so the folder names and both
       counts come from the same code path that would produce them on a full rebuild. The result is
       selected_reviewed: 142, selected_remaining: 0, and the diff is exactly 32 review_folder lines plus
       the two summary lines.

       A full re-run of the generator was deliberately not done, for two reasons. pseudocap.tsv is absent
       from .cache/paint/ so the selection could not be rebuilt offline; and more importantly the
       generator's own comments say the selection is a fixed snapshot kept so the file doubles as a
       progress record, so re-running it could silently change which 142 genes are listed. Only the
       locally derivable fields are updated. reviewed_accessions() reads nothing but
       genes/PSEAE/*/*-ai-review.yaml, so that part needs no cache and no network.

    2. The GO:0016987 shared-claim line was wrong, and not in the way the note said. The note described
       it as a false claim about five sigma factors; checking the rows, the count of five is right.
       GO:0016987 with PMID:18086184 sits on exactly PA0149, PA2050, PA2093, PA4896 and femA. femI
       carries that PMID too but on GO:0015344 and GO:0015891, so it is not in this group - my first
       grep found six genes because it matched files containing both strings anywhere rather than rows
       pairing them, which is the same coarse-search error this session has produced repeatedly.

       What is false is "sigma factors including femA". The four PA loci accept the row; femA REMOVEs it,
       because femA is an 804-residue outer-membrane TonB-dependent beta-barrel receptor and the sigma
       factor activity the paper describes belongs to PA1912. So the group does not agree, and the page's
       wording asserted exactly what the group review disproved. Rewritten to say so, which makes the
       group a better illustration of the page's own argument for reading shared claims as groups than
       the original sentence was.

    3. The tatB notes are not merely stale; tatB's review confirms what the passage predicted. The page
       said GO:0008320 is MODIFY to GO:0009977 on tatA and TOO_GENERAL on tatC "with tatB unreviewed",
       and that the asymmetry is in GOA rather than in the biology. tatB is now reviewed and reproduces
       tatC exactly: its own GO:0009977 IBA row accepted, both GO:0008320 rows TOO_GENERAL. All three
       core functions are GO:0009977. The "QuickGO-blocked batch" clause is removed.

       One item in that passage stays open and is sharpened rather than resolved: whether tatA's three
       MODIFY rows meet the 2026-11-14 bar, given that an export phenotype is the IMP row's evidence for
       a proton-motive-force term. That is a judgement about a merged review and not a status-page edit.

    4. The remaining-gene count is corrected in both places that carry it, with the historical figure
       kept: 98 were already reviewed through tiers 1 and 2 when the list was built, the remaining 44
       have since been reviewed, and all 142 are complete. 44 is arithmetic on the page's own 142 and 98,
       and is consistent with the 12 + 32 the superseded sentences gave.

    Checked: the worklist parses and reports 142/142/0 with no null review_folder; the page renders with
    101 warnings, the same count as before this edit, so nothing here adds one; 2224 project tests pass.
- type: EDIT
