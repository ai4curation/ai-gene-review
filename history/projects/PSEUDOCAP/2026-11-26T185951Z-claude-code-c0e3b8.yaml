  summary: Round 4's three non-blocking suggestions, one of which the review itself
    understated
  details: |
    Round 5's review errored in its runner after 2m 9s without posting, so this round acts on the
    three non-blocking suggestions round 4 left, having already fixed its blocking finding.

    The tier-2 lower bound was understated by half. "Each of those two adds a PseudoCAP defect" is
    wrong: xcpT and xcpU each carry two, so the 156 is a lower bound by at least four, not two.

    Checking that against the files rather than the review found the review's own description
    incomplete, and my first edit had copied it. Round 4 named a WRONG_REFERENCE on xcpT alongside
    the evidence-code defect, which reads as though xcpU's second defect were something else or
    absent. Both genes carry the same pair: a CONFIRMED WRONG_EVIDENCE_CODE on GO:0015628, and a
    SUSPECTED WRONG_REFERENCE off the same asserted PMID:8331069 - repointed to PMID:9282737 for
    xcpT and PMID:19828448 for xcpU, different papers for the two genes. The page now says that.
    Taking a reviewer's description of a file for the file is the same substitution as taking a
    grep's window for the data, and it is worth noting that it happened on the round whose subject
    was that habit.

    The frontmatter genes: list gained pvdE, xcpT and xcpU. The same gap femA, femI and tatB closed
    last round, and the same shape: xcpQ, xcpR, xcpS, xcpV, xcpW and xcpX were all listed, and the
    two adjacent members whose reviews this PR discusses were not; pvdD, pvdH, pvdJ, pvdQ, pvdR,
    pvdS and pvdT were listed, and pvdE, the gene this PR moved between table rows, was not.

    Not taken here, and recorded rather than silently dropped: round 4's fourth suggestion, that an
    invariant check - the four outcome figures summing to the table's Total row - would have caught
    three of the five stale figure-pairs more cheaply than re-deriving each. It is right, and it is
    code rather than page text, so it belongs in its own PR rather than in a status PR for this
    page.

    On the one disagreement. Round 4 put the cohort PAINT figure at "at least 76", reasoning from
    the 75 the Bottom line carried plus pvdE's GO_CENTRAL defect. The figure committed last round
    is 74, counted by matching each entry's Recorded in path in the regenerated reports against the
    107 cohort folders; pvdE is in that cohort and its single GO_CENTRAL defect is included. The
    difference is that 75 was never a cohort count - it is the end-of-tier-1 whole-scope total, and
    defects have been removed since, among them the pilA one settled by a full-text read. So 74
    stands, and the derivation is stated so the next round can check it rather than take it.

    Render unchanged at 8 pages, 120 warnings.
- type: EDIT
  outcome: changed
  sections:
  - results
  summary: A state qualifier the pvdE sweep passed over, and a kind list that was five
    of six while implying six
  details: |
    Round 5 finally ran, on both commits that the two rate-limited runners never read, and
    re-derived every figure rather than reading it. The cohort pair 113 and 74 is confirmed
    against the reports, the four bullet lists hold their declared sizes, both table totals
    close, and the 74-versus-76 disagreement went my way: 75 was never a cohort count, so adding
    pvdE's defect to it was adding to a figure that does not measure the cohort. pvdE's single
    GO_CENTRAL defect is inside the 74, which the reviewer confirmed as entry 94, WRONG_TERM
    PROBABLE on GO:0042626 for Q9I183.

    Two findings, both small, both outside the diff.

    The first is the sixth consecutive instance of the same failure and the first where the stale
    text is not a number. The per-gene verdicts table's Defects cell for pvdE read "G (planned)".
    The column legend two hundred lines earlier defines that column as the source_defects
    recorded in the review, and pvdE's review records exactly that defect - entry 94, on
    GO:0042626, which is the very node term the row is about. It is filed, not planned. My sweep
    after moving pvdE searched for the gene name, found all five mentions, and all five name the
    gene correctly; the staleness was in a parenthetical qualifier attached to one of them. Last
    round the sweep found the name and missed the number that moved with it; this round it found
    the name and missed the word attached to it. No arithmetic invariant would have caught this
    one, because it is not a count - which is the reviewer's point in suggesting the dual check:
    no table cell should say "planned" for a gene that has a review on disk.

    The second was a self-contradiction four lines after the sentence I had just rewritten, in the
    one place on the page I was certain to be looking. The tier-2 kind list gives 77 wrong term,
    43 wrong evidence code, 22 wrong reference, 6 wrong gene product and 6 wrong qualifier, which
    is 154 against the 156 the same paragraph asserts, whose confidence split does close at
    60 + 70 + 26. The line predates this PR.

    The fix is not a re-derivation, and the reviewer was explicit that leaving the tier-2 figures
    as a dated snapshot remains right. The list names five kinds and the report uses six; the
    set-wide report holds exactly two OTHER PseudoCAP defects, on PA2133 and speH, neither in the
    tier-1 cohort. That is consistent with the missing pair being tier-2 OTHER rows and is not
    provable, because the page carries no derivable list of tier-2 membership - the same limit
    that keeps the snapshot dated. So the sentence now says five of six, states the 154, names
    the two OTHER rows as consistent-but-unproven, and stops asserting a sum it does not make.

    Also taken from the suggestions: the tier-1 disclaimer named four figures, "116, 75, 5 and
    11", of which only two survive on the page. 116 and 75 appear below as the confidence splits
    36 + 56 + 24 and 6 + 56 + 13; the UniProt and other totals of that moment were only ever
    carried by the Bottom line, which an earlier commit replaced with the cohort pair. The
    disclaimer now names the two that exist and says the other two are no longer quoted, which
    removes two numbers from the set a future reader would have to re-check.

    Not taken, with reasons. The Hxc gloss on two of the three remaining tier-2 genes but not on
    xqhA is not a defect: xqhA is its own symbol and needs none, and writing "(its own symbol)"
    beside it would add noise to avoid a question. And the invariant check the reviewer proposes
    is right and belongs in code rather than in a status page, so it joins the tier-1 sum check
    from round 4 as a queued code change rather than being half-implemented here.

    Render unchanged at 8 pages, 120 warnings.
- type: EDIT
  outcome: changed
  sections:
  - results
  summary: tatB's review moved its group from partial to a full divergence, and the
    sentences classifying it still said otherwise; the script's own output says six,
    not three or four
  details: |
    Round 6 verified both round-5 fixes by re-derivation - including that G is the right value for
    pvdE's cell and not merely the un-qualified one, since pvdE appears in Recorded in lines exactly
    once across all six reports - and found the seventh instance of the same failure. This PR's
    section 3 rewrote the passage describing tatB's review and left the three sentences that state
    its consequence, none of which name the gene.

    The reviewer was explicit that the finding came from reading
    check_shared_claim_consistency.py's source and the data it reads, not from running it, and that
    the run would win. So I ran it, and the run disagrees with the reading in the count: the summary
    line is "6 divergent, 16 consistent, 0 incomplete, 0 with no verdict". The reading predicted
    four full divergences. The direction of the finding is confirmed - no group is incomplete, so
    "the rest span reviewed and unreviewed members" and "among the comparable members of an
    incomplete group" were both stale - but the page's "All three full divergences are deliberate"
    was wrong by three rather than by one.

