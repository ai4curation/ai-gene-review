  summary: 'PR review round 3: tier 2 stale in four places with one false clause, the Bottom line pair, and the paragraph about the trap had fallen into it'
  details: |
    Three findings, two of them new, plus one I found by sweeping afterwards.

    Tier 2. xcpT and xcpU both have complete reviews - xcpT nine ACCEPT and one NEW, xcpU eight ACCEPT
    and two MARK_AS_OVER_ANNOTATED, a core function each - so "284 of 289" was stale at four places:
    the summary at line 40, the tier-2 opening at 484, the Not completed (tier 2) paragraph and Plan
    item 4. All now read 286, with PA0681, PA0685 and xqhA as the three that remain.

    One clause there was not merely stale but false: "Its analysis, which is not in any review file,
    found the tier-1 Xcp pattern again (the 1998 review PMID:9818381 cited as IDA, which should be
    TAS)". That analysis is in a review file, twice. xcpT and xcpU each record it as a
    WRONG_EVIDENCE_CODE defect on GO:0015628, ECO:0000314 to ECO:0000304, at CONFIRMED. Verified by
    reading both source_defects blocks. Rewritten to say where the finding lives.

    The tier-2 defect figures at line 494 are downstream of that and are deliberately not re-estimated.
    They are scoped to tier 2, not to the corpus, and this page carries no derivable list of which
    genes are tier 2, so a new number there would be a guess dressed as a derivation. Re-tensed to
    "the then 284 genes", with a note that each of the two new reviews adds a PseudoCAP defect so the
    figures are a lower bound, and that the set-wide figures above are the derived ones.

    The Bottom line carried the 272/116 pair a fourth time - "Across all PAO1 reviews the reports now
    hold 272 PseudoCAP, 116 PAINT, 15 UniProt and 12 other defects" - set-wide, unconditional present,
    in the first paragraph a reader meets. Now 307, 120, 30, 9, 2 and 1, 469 in all, dated, pointing at
    the exporter.

    The review's note on that one is the sharpest observation of the round. The "12 other" was still
    numerically 12, because 9 InterPro plus 2 GOA at EBI plus 1 CACAO happens to equal the old figure,
    while its composition changed completely and OTHER.md no longer exists. A reader spot-checking that
    number would have found it correct and stopped. Third instance today of errors or changes that
    cancel in a total, after the tier-1 count that was right with the wrong membership and the 423 that
    summed internally while being 46 short.

    Found by sweeping afterwards, not flagged in the review, and the best illustration on the page:
    lines 242-245 document this exact trap from a previous occurrence - the PAINT split moved while
    "the totals still summed to 116, which is why the stale figures survived several reading passes" -
    and that paragraph's own end state, 37/77/2, is now the 2026-11-05 snapshot rather than the
    present 38/80/2. The paragraph warning that a correct-looking total hides a changed split had
    fallen to it. Given its own date it was defensible as written, but it now carries the current
    figure too, and the point that the set-wide numbers avoid the mechanism by being the exporter's
    output rather than a copy of it.

    Render unchanged at 8 pages, 120 warnings.
- type: EDIT
  outcome: changed
  sections:
  - results
  summary: Bottom line's outcome count and its defect pair, both stale from my own earlier
    fixes in this PR
  details: |
    Round 4 verified every round-3 fix and raised one finding: the Bottom line still said "For 23 the
    seed is right for PAO1 but the node carries the term to proteins or lineages it does not fit",
    while the table and the bullet list both say 24 after pvdE moved into that row earlier in this PR.

    This is the fifth time in this PR that I fixed the cited instances of a claim and left a sibling,
    and the first where the sibling was created by a fix of mine two rounds earlier. The sweep I ran
    after moving pvdE looked for the string "pvdE" and found every mention of the gene. It did not look
    for the number that moved with it, which appears in a sentence that does not name the gene at all.
    Searching for the subject of a change does not find the places that state its consequence.

    Two of my own earlier corrections had to land in that one sentence and neither did. With 23 the
    paragraph read 21 + 23 + 30 + 32 = 106, which agreed with the tier-1 total of 106 that round 1
    corrected to 107. So the stale outcome count and the stale cohort size were consistent with each
    other, and the paragraph's arithmetic closed on the wrong pair. Fixing one of them was what made
    the inconsistency visible; had I fixed neither, nothing would have looked wrong. Fourth instance in
    this PR of two errors that cancel, and the clearest: internal arithmetic is evidence that a
    paragraph is self-consistent, never that it is current.

    Sweeping the rest of the paragraph then found a second stale pair the review had not flagged: "The
    reviews record 116 defects for PseudoCAP and 75 for PAINT", in the unconditional present. 116 and
    75 are the end-of-tier-1 totals - 36 + 56 + 24 and 6 + 56 + 13, both stated as such further down -
    and the disclaimer that labels them says "the tier-1 counts quoted below", so it does not reach a
    paragraph 165 lines above it. Neither reading of the sentence was true: set-wide the totals are now
    307 and 120, and restricted to this cohort, which is what the paragraph is about, they are 113 and
    74. Counted from the exporter output by matching each defect's "Recorded in" path against the 107
    cohort folders, with each report's header checked against its own entry count. The sentence now
    gives the cohort figures as the cohort's, names the set-wide pair beside them, and is dated.

    The 116 was unusually well hidden. PAINT's own post-tier-2 total is also 116 (32 + 83 + 1), and the
    page states that one 190 lines later as a figure the current numbers supersede. Two different
    quantities, one value, one page.

    Then derived every remaining count on the page that is a function of genes/PSEAE rather than
    reading it: the four bullet lists against their declared sizes (21, 24, 30, 32, each matching its
    members, summing to 107, plus pqsA and PA2403 for 109, and exactly 107 of the 109 resolving to a
    review file); the confidence splits (121/131/55 and 38/80/2, summing to the 307 and 120 in the
    reports' headers); tier 2 (515 reviews across 520 folders, the five without being PA0681, PA0685,
    PA2403, pqsA and xqhA); tier 3 (142 reviewed, 0 remaining, 142 review_folder lines); and both
    table totals (107 + 2 = 109 proteins, 4,761 + 11 = 4,772 leaves). All correct. The one stale number
    the review found and the one I found by sweeping were the only two left.

    Resolving the cohort needed the accession convention twice over: wzm is genes/PSEAE/Q9HTB8, which
    is what round 1 caught, so the lookup tries folder name, gene_symbol and locus tag. A first pass
    reported a 285-member cohort because the bullet regex ran across bullet boundaries; that figure was
    discarded rather than used, since the point of deriving a number is lost if the derivation is not
    itself checked.
- type: EDIT
  outcome: changed
