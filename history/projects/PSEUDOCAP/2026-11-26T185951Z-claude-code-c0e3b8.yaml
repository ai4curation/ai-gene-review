  summary: 'PR review round 2: a third stale tally, and the GOA_EBI sentence described the wrong records'
  details: |
    The confidence tally at the end of the upstream-reports paragraph said "After tier 2 and the tree
    check the totals are 96, 126 and 50 for PseudoCAP and 32, 83 and 1 for PAINT". Those sum to 272
    and 116 - the exact pair this PR replaced with 307 and 120 four lines above. Derived from the gene
    reviews: PSEUDOCAP is 121 CONFIRMED / 131 PROBABLE / 55 SUSPECTED and GO_CENTRAL is 38 / 80 / 2,
    summing to the current figures.

    The review offered two fixes, update the numbers or re-tense, and the better answer is both: the
    sentence now says what the totals were after tier 2, notes that those sum to the superseded pair,
    gives the current figures with their date, and says to re-run the exporter rather than edit them.
    Re-tensing alone would leave a reader with no current figure next to a paragraph that has one;
    updating alone would create a fourth number to go stale. This is the third tally in one file to
    need the same treatment, which is the argument for the series being derived at render time rather
    than maintained - recorded here rather than attempted in a status PR.

    Separately, a factual error in text this PR added. The new paragraph said the two GOA at EBI
    entries "are the WRONG_GENE_PRODUCT requests from the femA and femI reviews". They are not the
    repoint requests; those are PseudoCAP entries. They are the two GO_REF:0000108 rows inferred from
    the misplaced ones - GO:2000142 on Q9I2J4 and GO:0033214 on Q9I2J2 - each reported at PROBABLE as
    a consequence to be re-derived once the repoint lands, the inference being sound and only its
    input wrong. Corrected.

    How I got it wrong is the same shape as three earlier instances today. I checked defect_type and
    resource, saw WRONG_GENE_PRODUCT on both, and concluded about the records without reading which
    record each entry names. Checking a field and asserting about the thing the field belongs to.

    Three non-blocking items also carried, all verified: the genes: frontmatter listed tatA and tatC
    but not tatB, femA or femI, though all three appear in passages this PR edits; pvdE was in
    autolink_exclude, so the one symbol the page now says is reviewed was the one that could not link,
    and the exclusion was presumably added when it had no review; and these history events used
    sections values matching no heading on the page, now results, which prior records in this folder
    use. Render output unchanged at 8 pages and 120 warnings.
- type: EDIT
  outcome: changed
