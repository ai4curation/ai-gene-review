  summary: Node-level defects re-checked against the real PANTHER trees
  details: |
    Added projects/PSEUDOCAP/panther_tree.py, which pulls family topology from the PANTHER treeinfo service and reports a node's event type, subfamily composition, leaves and the smallest clade containing given accessions. Fetched trees for 103 of the 105 nodes with GO_CENTRAL defects and re-examined every call left SUSPECTED pending the tree. The PAINT report moved from 17 CONFIRMED, 82 PROBABLE, 17 SUSPECTED to 32, 83 and 1. Named target nodes for relocatable IBDs (astA, xcpV, pfeA, thrB, hutF, PA1257 and others), replaced the remedy where no target clade exists (fur, PA4088, ligD, aruC), and withdrew breadth objections the trees refuted (hutI, PA4521, part of arcA). Corrected the xcpV bioinformatics conclusion, whose GspI/PilV reading was a leaf-naming artefact.
