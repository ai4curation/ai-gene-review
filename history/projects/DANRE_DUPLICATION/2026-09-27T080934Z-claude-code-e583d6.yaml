  summary: Call zebrafish TGD paralog pairs from PANTHER v19 gene trees
  details: |
    Replaced the Ensembl Compara candidate script with scripts/panther_tgd_pairs.py, which reads PANTHER v19 AllParalogs/AllOrthologs (trees include zebrafish, medaka and spotted gar) and calls TGD pairs: TGD_tree (duplication on Neopterygii|Teleostei; 778 1:1 pairs), TGD_tree_no_gar (other *|Teleostei branches; 93), TGD_likely_parallel (Teleostei|DANRE 1:1 pairs sharing one gar co-ortholog with a parallel medaka duplication; 1062), TGD_or_lineage (1107) and unresolved (363). Output panther_tgd_pairs.tsv and panther_paralog_branch_counts.tsv committed; downloads cached in gitignored .cache/. Checked literature pairs against the calls and updated the project page's method, caveats, candidate tables and status.
