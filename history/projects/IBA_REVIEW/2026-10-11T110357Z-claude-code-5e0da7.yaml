  summary: 'IBA_REVIEW: add ortholog-family-split mechanism (DNAH12)'
  details: |
    Added mechanism C, 'Orthologs split across PANTHER families', to the IBA Incompleteness section, with DNAH12/Dnah12 as the worked example. In PANTHER 19, human DNAH12 is in PTHR46532 with no PAINT coverage, while mouse Dnah12 is in PTHR10676 and inherits inner dynein arm assembly and related terms. The same mouse leaf also over-inherits microtubule motor activity, which is cross-referenced to pattern 8. Added a screening heuristic (compare IBA counts across ortholog pairs, and check for disagreement between the PANTHER API and InterPro family assignments) and a row in the genes table. Facts were checked against the QuickGO and PANTHER 19 treeinfo/geneinfo services.
