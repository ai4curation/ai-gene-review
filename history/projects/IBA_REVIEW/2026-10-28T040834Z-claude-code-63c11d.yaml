  summary: Add the ccmC / PTHR30071 phenotype-derived-MF IBD seed case
  details: |
    Adds IBA Quality Issues pattern 16 (phenotype-derived molecular function as an IBD seed), a Featured Examples entry for SHEON ccmC in PANTHER family PTHR30071, a row in the Genes with IBA Issues table (HIGH), and SHEON/ccmC to the frontmatter species and genes lists. Facts verified against genes/SHEON/ccmC/ccmC-ai-review.yaml, ccmC-goa.tsv (IBA GO:0004096, GO_REF:0000033, WITH/FROM PANTHER:PTN001247822|UniProtKB:Q9I3N5) and interpro/panther/PTHR30071/PTHR30071-paint.tsv (the GO:0004096 IBD on PTN001247822 has the single seed UniProtKB:Q9I3N5) and PTHR30071-entries.csv / -metadata.yaml (family name HEME EXPORTER PROTEIN C; Q9I3N5 = ccmC of Pseudomonas aeruginosa PAO1). The page preserves the review's two distinct source_defects confidences (CONFIRMED against the GO_CENTRAL IBD, PROBABLE against the PseudoCAP row) and states that the possible mis-keying of PMID:16824107 is undetermined because the cached abstract names no organism. Rendered with ai-gene-review render-projects; no new warnings (the 3 reported are pre-existing). The regenerated pages/projects/IBA_REVIEW.html is deliberately not committed: this container's clone is shallow, so the render emits 'Source history unavailable (shallow checkout)', and the committed HTML is stale against unrelated corpus autolink drift.
