  summary: Rescope the ccmC IBA reach claim and record the node-scoped evidence from
    PSEPK ccmC
  details: |
    Correction round on PR #5651, rescoping one claim in the ccmC featured example and adding the evidence the reviewer asked for. The CONFIRMED bullet said the IBD "currently propagates to every bacterial CcmC in the family"; that quantifier is not supported by interpro/panther/PTHR30071/PTHR30071-paint.tsv and is contradicted in the repository, so the bullet now limits the reach to the leaves descending from PTN001247822, says the retraction request does not depend on the reach, and names the counterexample. Two smaller reach claims are rescoped with it: the Genes with IBA Issues row no longer says "propagated family-wide", and the pattern-16 problem statement now says a sole-seed IBD propagates to every leaf descending from the node that carries it rather than to every member of the family.

    A fourth Root Cause Analysis point records that the defect is node-scoped rather than signature-scoped: UniProtKB:Q88EX7 (Pseudomonas putida KT2440, genes/PSEPK/ccmC/) shares PTHR30071 and PTHR30071:SF1 with Q8EK42 by its own UniProt DR PANTHER lines, and its GOA, every row dated 20260727, carries no GO:0004096 row and no IBA row at all; its plasma-membrane IEA cites PANTHER:PTN002409360, which is absent from PTHR30071-paint.tsv. The entry states that why Q88EX7 falls outside PTN001247822 is not established, only that it does not carry the row, and draws the conclusion pattern 16 turns on: nothing in the family signature or the tree produces the annotation, so one seed row on one node is the whole remedy. Rendered with ai-gene-review render-projects; no new warnings. The regenerated pages/projects/IBA_REVIEW.html is again deliberately not committed: this container's clone is shallow, so the render emits 'Source history unavailable (shallow checkout)', and a faithful re-render drags in unrelated corpus autolink drift.
