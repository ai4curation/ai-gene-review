  summary: Correct the Epe1 pseudo-enzyme example (Fe(II) triad) and pattern count
  details: |
    Commit 89c324a01 replaced the catalogued Epe1 example's 'HVD (not HXD)' motif claim (a regex-scan artefact; HVD fits HXD) with the actual Fe(II) triad H297-E299-Y370, Tyr370 in place of the third iron-ligand His (UniProt O94603 CAUTION), in IBA_REVIEW.md and the deck. A correction note was appended to the 2026-01-22 HISTORY.md entry: the H297A phenotype is assay-dependent (PMID:25838386 endogenous loss of tethered-H3K9me erasure; PMID:31206516 prevention retained, removal lost; PMID:30573453 overexpressed H297A still disrupts silencing via SAGA), so the demethylase IBA is removed on biochemical and active-site evidence, not on the H297A phenotype. Also corrected the bottom-line count to 14 failure patterns plus one positive control (pattern 2). Companion gene-review fix is PR #3229 (open).
