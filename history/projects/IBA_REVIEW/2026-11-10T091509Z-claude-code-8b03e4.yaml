  details: |
    Asked how deeply these reviews read the full tree and the alignment, a census of committed artifacts found one behind 1.8% of 29,084 IBA rows and 4.5% of the 1,586 rows we had overruled. The live PANTHER tree service timed out from this environment, so the work reads PANTHER's 19.0 release files.

    Added: (1) `just fetch-panther-release`, a local git-ignored database of every family tree (events, taxa, branch lengths), family alignment, full-length leaf sequence and the node table; (2) `just phylo <org> <GENE>` writing GENE-phylo.yaml and `just phylo-family <PTHR>` writing <PTHR>-tree-nodes.yaml, documented in docs/phylo.md; (3) advisory checks missing_tree_evidence, tree_evidence_other_row and missing_residue_evidence in `just validate`, and NODE_TREE_EVIDENCE in `just validate-families`; (4) extracts for the 1,184 genes whose review overrules an IBA row and node listings for 220 families; (5) IBA_REVIEW/tree_evidence.py, tree-evidence-rows.tsv.gz, tree-evidence-candidates.yaml and tree-evidence.md, which join all 29,101 reviewed IBA rows with their tree facts.

    Result of the join: we overrule 1.3% of rows where the gene is itself a seed, 2.8% inside the seed clade with a one-to-one ortholog seed, 12.5% inside without one, 8.2% outside with one, 20.0% outside without one, and 45.5% of the 22 rated rows with an unlifted PAINT loss on the path. 233 rows where verdict and tree pull apart are listed for re-review (23 with a PAINT loss on the path, 19 paralog claims with no duplication in the tree, 191 overruled although the gene is a seed). No verdict was changed by the analysis.

    Corrections to this project's own examples, found by reading the tree: the Cds1 branch is the second longest below the PTHR10314 root, not the longest (0.528 against 0.659 for the threonine synthase branch); PTN008729690, called CIRBP's own subfamily node, is the PTHR48034 root, and the CIRBP/RBM3 branch is PTN008483167; the seeds called rat Tra2 are rat Rbmx and Rbmxrtl. Corrected in IBA_REVIEW.md, HISTORY.md (with a dated correction on the 2026-01-26 entry), the slide deck and its rendered HTML, PTHR10314-notes.md, PTHR48034-review.md and the three gene reviews (MYCTU and VIBCH cds1, human CIRBP), each of which has its own history record.

    Remaining: 1,685 overruled rows have an extract and do not yet quote it, and 386 of 392 node assessments that dispute a placement do not cite a tree listing.
