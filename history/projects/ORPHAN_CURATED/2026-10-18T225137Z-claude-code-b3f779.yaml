  summary: Create Swiss-Prot reference-proteome membership audit
  details: |
    Created the ORPHAN_CURATED project and just orphan-curated, producing CSV and
    issue-ready Markdown for local Swiss-Prot accessions outside all reference
    proteomes for their exact live taxon. The report counts original cached GOA
    evidence separately from reviewer proposals, records retrieval provenance
    and missing-data diagnostics, and preserves all gene sources. Added the
    project to the manually maintained project index.

    UniProt release 2026_03: scanned 7,989 review files, resolving 6,466 Swiss-Prot
    and 1,490 TrEMBL accessions and excluding 20 RNAcentral identifiers. Found
    39 candidates across 23 taxa with 240 cached GOA rows (97 non-IEA, including
    88 experimental-code rows). The POPTR subset reproduces the six starting
    accessions, with 34 GOA rows (33 IEA, one ISS). Retained full and POPTR reports.
    Entry-name resolution and local/live taxonomy differences are diagnostics;
    no gene reviews or cached gene sources were changed. Candidate membership
    does not establish unique gene/annotation loss; counterpart mapping and
    UniProt feedback remain project follow-up tasks.

    Validation: focused report and project-frontmatter tests passed (13 tests),
    Ruff and mypy passed for the implementation, and the history record passed
    schema validation. Ran live and offline audits, both format-specific CLI
    options including output paths with spaces, and verified CSV evidence totals
    and raw GOA file hashes. Rendered the project and both Markdown reports to a
    temporary output directory for link/metadata checks.
