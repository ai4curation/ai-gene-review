- type: CREATE
  outcome: changed
  summary: Propose obsoletion of GO:0004321 fatty-acyl-CoA synthase activity
  details: |
    New project. Audits all 17,305 annotations to GO:0004321 (QuickGO, UniProt 2026_03, retrieved 2026-11-01) with a reproducible script: ~21% are on fungal FAS subunits; the rest reach PTHR43605 acyl-CoA ligases (PAINT root IBD, go-annotation#6642), bacterial PKS/PUFA synthases via ARBA00048237, acyl-CoA ligases with submitter EC 2.3.1.86, and other ligases by IDA/IMP/ISO. Argues the term projects the EC 2.3.1.86 fungal FAS system onto a single-reaction MF: Rhea has RHEA:22896 with no EC link and no UniProt entries; Swiss-Prot gives the overall reaction as free text; SGD and PomBase annotate fungal FAS to GO:0004312 instead. Proposes obsoleting GO:0004321 and GO:0005836 with consider to component activities, GO:0005835 and GO:0006633; records the complex-level alternative (fatty_acid_de_novo_synthesis module, S. pombe GO-CAM). Draft go-ontology ticket included; not yet filed.
