- type: CREATE
  outcome: changed
  summary: 'Create project BGEEDB_EXPRESSION: pilot Bgee expression as evidence for
    GO annotations, paralogs and developmental modules'
  details: |
    New project page projects/BGEEDB_EXPRESSION.md with methods sub-page, scripts, committed Bgee call caches and generated results. Three pilots: (A) GO anatomy from go-plus logical definitions joined to Bgee 15.2 human calls for 12,080 reviewed annotations, calibrated against reviewer actions with a shuffled baseline; presence concordant above chance (46% vs 26% enriched for ACCEPT) but not discriminative (rejected vs retained ratio 1.02); absence informative only after screening developmental, regulator, non-autonomous and quiescent-cell artifacts. (B) PTN-level paralog comparison with the sister paralog as positive control: G6PC1/2/3 below PTN000971890 against the satisfiability engine's gluconeogenic tissues, PAX4/PAX6 below PTN002900580, and a corpus scan of 1,865 IBA groups (ACTL8 axon and AGFG2 acrosome assembly as leads). (C) cerebellum_development module evaluated per mouse developmental stage with module_logic and a Bgee anatomy x stage oracle; staggered onset broadly follows module order; flags the step-1 context, EN1/EN2 early onset and two CL location gaps. No gene reviews or modules were edited; leads are listed on the project page for curators. Validated with tests/test_project_frontmatter.py and a render-projects build of the page.
