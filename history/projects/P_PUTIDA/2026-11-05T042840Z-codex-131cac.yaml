  summary: Build reproducible KT2440 TF candidate census and coverage worklist
  details: |
    Implemented versioned source extraction and deterministic offline census builds
    under projects/P_PUTIDA/tf_census, with editable discovery rules and 20 calibration
    cases. Combined metadata names/keywords, GO branches, official InterPro/Pfam
    labels, RegPrecise regulator loci, published PRECISE321 module assignments and
    prior-network regulator identities, and accession/taxon-matched existing reviews.
    Produced 647 evidence-discovered candidates: 422 provisional main-TF candidates,
    59 related regulators, 141 unresolved roles and 25 main-queue exclusions by
    triage. Existing review files cover 59 candidates; no gene validation or completed
    biological adjudication is implied. Preserved 27 ambiguous aliases, explicitly
    multiple source loci and one unresolved RegPrecise record (RutR2). The rsmA
    negative control and out-of-proteome XylR remain outside the candidate denominator.
    Source and build manifests record checksums and the pinned PRECISE321 commit.
    Fourteen focused identity/scope regression tests, targeted Ruff checks and an
    independent byte-identical rebuild passed. Gene reviews and the legacy iModulon
    membership/weight importer were not edited. Updated project progress and links;
    added history provenance and checked local links and generated-artifact integrity.
