  summary: Create projects/PHAGES.md scoping tiered bacteriophage genome curation
    and reusable phage modules for pathway hole filling
  details: |
    Created projects/PHAGES.md and added its project card to pages/projects/index.html. Audited the existing 61 phage/archaeal-virus gene folders across 9 taxon codes (BPT4, 9CAUD, BPZF4, BPBPP, BPPHT, BPD31, ENTM13, ENTPH, SIRV1) and two viral modules (viral_factory, anti_crispr_suppression). Integrated verified UniProt taxon IDs, mnemonics, and Swiss-Prot reviewed/total proteome counts across Tier 1 micro/small genomes (phiX174/BPPHS, MS2/BPMS2, Qbeta/BPQBE, M13/BPM13, phi6/BPPH6, PRD1/BPPRD, phi29/BPPH2), Tier 2 canonical tailed phages (lambda/LAMBD, T7/BPT7, P22/BPP22, T4/BPT4, Mu/BPMU, P2/BPP2 + P4/BPP4, Mycobacteriophage L5/BPML5), and Tier 3/4 large/jumbo/anti-defense phages. Added a module-route satisfiability matrix, a 5-genome (~160-gene) execution plan starting with lambda (LAMBD), and a comprehensive OLS-verified phage GO term reference catalog covering BP lifecycle stages, CC virion/host components, MF activities, and ontology gaps.
