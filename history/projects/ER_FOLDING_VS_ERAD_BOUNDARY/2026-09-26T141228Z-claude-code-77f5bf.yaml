  summary: 'Scope go-annotation#6515: ER folding chaperones vs GO:0036503 ERAD pathway
    boundary'
  details: |
    Scoping project page created in response to upstream geneontology/go-annotation#6515 (PomBase request to move six fission-yeast ER chaperones/foldases from GO:0036503 ERAD pathway to GO:0034975 protein folding in endoplasmic reticulum).

    Independently re-derived from QuickGO, PomBase, UniProt, SGD and OLS on 2026-09-26:
    - Resolved the ticket's six gene names to current PomBase symbols: bip1, spj1 (not scj1), pdi4, pdi5, cal1 (synonym cnx1), cnx2 (the calreticulin-like gene, a separate gene rather than a synonym).
    - Resolved ISO/IBA donors: SGD KAR2, CNE1, SCJ1, EPS1.
    - Quantified the propagation footprint: GO:0036503 has 128684 annotations (4621 IBA); PANTHER node PTN000117401 (calnexin/calreticulin) contributes 390 IBA rows and PTN001834223 (BiP) 258, so the six species rows are ~0.9 percent of what the two nodes assert.
    - Recorded the conflict with this repo's existing reviews: CANX and CALR ACCEPT the same IBA that CALR3 keeps as non-core and CLGN marks as over-annotated; yeast KAR2 and CNE1 both ACCEPT.
    - Recorded counter-evidence from PMID:11381090 (retrotranslocation-competence role for BiP/Scj1/Jem1, substrate-class-specific), which lands inside the GO:0036503 definition rather than upstream of it.

    No annotation files modified. Follow-up: upstream decision is still pending (edwong57 commented 2026-09-25 that they are looking at it), and the intended replacement term may be a not-yet-created ER quality-control umbrella rather than GO:0034975.
