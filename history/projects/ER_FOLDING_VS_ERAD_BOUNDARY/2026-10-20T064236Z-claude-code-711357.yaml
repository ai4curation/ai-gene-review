- type: EDIT
  outcome: changed
  summary: Address review feedback on the ER folding vs ERAD scoping page
  details: |
    PR Shepherd follow-up addressing the four CHANGES_REQUESTED items raised by
    ai4c-reviewer on PR #3140. Every claim was re-verified against the repository
    before editing; no annotation files were modified.

    1. Corrected the propagation-footprint arithmetic. The page divided all six
       fission-yeast rows by an IBA-only denominator (648 = 390 PTN000117401 + 258
       PTN001834223) to get "0.9%". Only three of the six are IBA from those nodes
       (bip1, cal1, cnx2), per the page's own evidence table; the correct figure is
       3/648 = 0.46%, leaving 645 untouched assertions rather than "640+". The other
       three (spj1 from SGD:S000004827/SCJ1, pdi4 and pdi5 from SGD:S000001267/EPS1)
       are ISO rows that the PAINT nodes do not assert, are not in the 648, and are
       not reachable by an IBD edit; they are now documented as a separate
       remediation path running through the budding-yeast donor annotations.
    2. Added the three existing PTN001834223 member reviews the page omitted:
       genes/rat/Hspa5, genes/worm/hsp-3 and genes/worm/hsp-4, all ACCEPT on the
       identical IBA (GO_REF:0000033). The page previously read as if the node had
       no in-repo precedent. Also noted that rat/Hspa5 (two blocks) and worm/hsp-4
       (one block) carry GO:0036503 in core_functions.directly_involved_in while
       worm/hsp-3 does not despite its ACCEPT, an internal inconsistency worth
       resolving either way the boundary falls. Added these as re-check item 11 in
       the work plan.
    3. Added genes/yeast/EPS1, the ISO donor for pdi4/pdi5, which is already
       reviewed: ACCEPT on GO:0036503 by IMP from PMID:12881414, supporting text
       describing "a general role for Eps1 as a recognition component of the ERAD
       pathway", and GO:0036503 also used as a proposed_replacement_term elsewhere
       in the same review. Recognition is explicitly inside the GO:0036503
       definition ("It begins with recognition of the ER-resident protein, includes
       retrotranslocation (dislocation) of the protein from the ER to the
       cytosol..."), verified via OLS on 2026-10-20. This sharpens the page's own
       pdi4/pdi5 question from the ticket's blanket "do PDIs belong in ERAD" to
       whether Eps1's substrate-specific recognition role, demonstrated on
       Pma1-D378N, transfers by ISO to two generic fission-yeast PDIs.
    4. Registered the ANNOTATION_REVIEW tag so the project gets a tag facet. The
       reviewer flagged only tag_order in render_projects.py, but the tag was absent
       from the controlled vocabulary in tests/test_project_frontmatter.py as well,
       so tests/test_project_frontmatter.py::test_project_tags_are_controlled was
       failing on this branch. Added the tag to VALID_TAGS and to tag_order, plus a
       chip colour rule in the projects_table and project templates. Re-rendered
       pages/projects/ER_FOLDING_VS_ERAD_BOUNDARY.html.

    Note for a maintainer: ANNOTATION_REVIEW is a new entry in a shared controlled
    vocabulary and this page is its only user, so retagging the page with an
    existing tag instead is a reasonable alternative. Separately, EVALUATION and
    ML_PREDICTIONS are in VALID_TAGS but still missing from tag_order, so ~25 other
    project pages get no tag facet; left unfixed here to keep this diff scoped to
    the review.

    The earlier record in this folder (2026-09-26T141228Z-claude-code-77f5bf)
    repeats the superseded 0.9% figure in its details. History records are
    append-only, so it is left as written; this record supersedes that figure.
