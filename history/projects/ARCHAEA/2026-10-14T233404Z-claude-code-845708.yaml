  summary: Anchor ARCHAEA on Sulfolobales with methanogen co-theme
  details: |
    At the user's request, re-anchored the project for DOE relevance: Sulfolobales (SACS2, SULAC, METS5, ACIAM) as the anchor, methanogens (METJA, METAC, METTH) as a co-theme, and haloarchaea (HALVD, HALSA) as an experimental calibration set. Added new targets, all checked against UniProt REST: the M. sedula 3HP/4HB CO2-fixation enzymes (Msed_0709, Msed_1456, Msed_2001, Msed_1424, Msed_0406), A. ambivalens sulfur oxidation (sor, doxD, doxA), S. solfataricus lacS, xylS and dbh, and M. thermautotrophicus mcrA and frhA. Filled in UniProt ordered locus names for the METJA lipid enzymes (MJ1250, MJ0279, MJ0044). Changed the pilot to Msed_0709, sor, lacS, METTH mcrA and cdvB, with bop and psmA1 as a calibration pair.
