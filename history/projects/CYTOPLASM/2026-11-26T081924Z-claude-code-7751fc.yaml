- type: CREATE
  outcome: changed
  summary: 'Create project: CYTOPLASM (GO:0005737 policy, eukaryote vs prokaryote)'
  details: |
    Opened CYTOPLASM to settle how reviews treat GO:0005737 cytoplasm, prompted by the question whether projecting cytoplasm by IBA/ISS/IEA is ever useful. Proposed policy: in eukaryotes cytoplasm (which by GO definition includes every organelle) is never ACCEPT and never a core_functions location; TOO_GENERAL when the review asserts a location GO places under cytoplasm; MODIFY only on the row's own evidence (propagated rows stop at cytoplasm by construction); otherwise KEEP_AS_NON_CORE; no NEW cytoplasm rows. In prokaryotes cytoplasm is informative and keeps the normal rules, never TOO_GENERAL. Added a cytoplasm_policy validator warning (eukaryotic ACCEPT, NEW and core-location cases; lineage from the UniProt OC line) and the just cytoplasm-audit report, with tests. Census over 12,487 reviews: 4,618 eukaryotic ACCEPT rows (3,865 already entailed by a more specific asserted location), 989 core-function locations in 763 reviews, 596 MODIFYs on propagated eukaryotic rows. Checked against the GO snapshot that cytoskeleton, microtubule, centrosome, ribosome and nucleoid are not under cytoplasm, and that the cytoplasmic sequestering process terms (GO:0042994, GO:0051220) are obsolete. Worked example ARATH/NPR1 (six cytoplasm rows ACCEPTed, no cytosol row, supporting quote names the cytosol). After PR review, added rule 5's MODIFY-to-cytoplasm case (a wrong location is corrected laterally, not up to cytoplasm) as a warned EUK_MODIFY_TO_CYTOPLASM category (6 rows: human MCL1 x4, EPM2A x2; 1,981 warned files in all), made TOO_GENERAL entailment isoform-aware as in action_consistency, and noted that rule 2 overrides the assay table. No gene reviews edited.
