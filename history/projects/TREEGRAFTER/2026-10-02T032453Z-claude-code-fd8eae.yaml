  details: |
    ai4c-reviewer round 6 raised two bookkeeping items, both verified first-hand and both correct. (1) The audit's gene figure was wrong either way: batch-03 holds 166 gene entries but PSEPK/aroQ and PSEPK/aroQ-III are two records of the same protein (Q88IJ6, merged by this PR), so 166 entries cover 165 proteins and the 192 recorded rows cover 191 distinct adjudications. The pre-fix 165 was right only by accident, two cancelling errors (dapF collapsed to one label, aroQ split across two). Rather than pick a digit, the aroQ entry now declares merged_into and summarize.py derives all four figures from it: recorded_rows 192, distinct_adjudications 191, gene_entries 166, proteins 165. The README states what each counts and the project-page headline agrees. (2) check_outcomes.py skipped its action-vs-live-review invariant without reporting it when a recorded gene_file did not exist (live is None -> continue), so aroQ's action was verified against nothing while the gate printed 192 rows and 0 violations. A merged entry's action is now checked against the surviving twin and the substitution reported; a missing file with no merged_into is a violation, verified by temporarily removing the key (rc=1, one violation). The pytest wrapper asserts the merged entry is reported rather than skipped. Also aligned the dapA entry label with the folder-name convention, and noted in the refresh procedure that the frozen hotspot table still carries the ambiguous dapF label.
