  details: |
    ai4c-reviewer round 10 corrected a claim I had made twice. Commit 7a86768a8's message, and my round-9 reply, said that just validate passing confirms the tab-escaped PAINT quotes verbatim 'since the reference validator enforces that'. It does not: conf/reference_validator_config.yaml lists file in skip_prefixes (verified at line 31), so file: references are exempt from snippet checking entirely, and validate_reference_finding_supporting_text runs only on LITERATURE_PREFIXES (validator.py:123). The quotes themselves are verbatim - checked independently with cat -A and grep - so the artifact was never wrong, but my stated reason for confidence was. The gap is also not a new discovery: projects/MISCITATIONS.md documents it as 'a third blind spot' naming file in skip_prefixes, and SPKW.md and FUNCTION_KNOWLEDGE_GAPS.md carry it too, with the SPKW audit measuring roughly 48 percent of file: quotes non-verbatim while passing validation. My round-10 reply had framed it as the real finding, which overstated my part in it. Added a section to the audit README stating which quotes are gated (PMID/DOI) and which are hand-verified (file:), linking the three project pages and noting the three instances found inside this audit's own changed set. Separately, the next-step's QuickGO blacklist figure now carries the 2026-10-02 verification date the rest of that bullet already had; it was the only live-API claim there without one.
