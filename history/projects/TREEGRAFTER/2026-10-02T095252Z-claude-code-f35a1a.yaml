  summary: 'Round 14 (approve): name the two findings-slot wrap artifacts, denominate
    the SPKW rate, record the test-the-passes lesson'
  details: |
    ai4c-reviewer round 14 approved the PR with two blue suggestions, both closed here. First, the wrap-artifact row was the only line in the per-slot table whose members were not named, and it is the datum the 29%-vs-74% rate difference rests on - so every other figure in the section was grep-checkable and that one was not. The findings slot's two are now named: PSEPK/infC:128, straddling infC-uniprot.txt:29-31 (the IF-3 30S-binding sentence), and PSEPK/mraY:191, straddling mraY-uniprot.txt:32-34 (the phospho-MurNAc-pentapeptide transfer, whose quote begins at 'transfers', the last word of line 32). [Corrected in place per docs/history.md, because these identifiers were never true rather than accurate-when-written: this record first cited PSEPK/infC:182 straddling 29-30 and PSEPK/mraY:192 straddling 33-34. infC:182 was wrong twice over - it is a core_functions[].supported_by quote, not a references findings one, and its shorter text is verbatim at grep -cF count 1, so it is not a wrap artifact at all; the real one is the longer quote at :128. mraY's row and slot were right but its span began a line late. The reason is kept here because it is the kind of error that gets reintroduced: both locators were obtained by grepping the review file for the quote text in a step separate from the pass that had classified the quote, and that grep matched a different occurrence of similar text in a different slot. Found by ai4c-reviewer round 15; the corrected locators were read from the files with numbered output.] Second, the SPKW figure at the top of the section read ~48% with no denominator, eighty lines above a sentence declaring that every rate in the section carries its denominator; it now reads ~48% of 550. Also recorded, from the round's closing observation rather than its suggestions: round 14 was the first to test the sweep's passes rather than only its flags, sampling two quotes it had cleared on NICAT/NaPMT1.1 and finding both verbatim at count 1. A classifier audited only on what it reports can be wrong in the direction nobody looks, so the gate spec now carries that as a requirement - a gate without a cleared-quote check leaves its false-negative rate invisible. That is the one methodological point from fourteen rounds worth carrying into the tooling issue.
