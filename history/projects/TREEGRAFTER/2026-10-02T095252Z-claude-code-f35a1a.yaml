  summary: 'Round 14 (approve): name the two findings-slot wrap artifacts, denominate
    the SPKW rate, record the test-the-passes lesson'
  details: |
    ai4c-reviewer round 14 approved the PR with two blue suggestions, both closed here. First, the wrap-artifact row was the only line in the per-slot table whose members were not named, and it is the datum the 29%-vs-74% rate difference rests on - so every other figure in the section was grep-checkable and that one was not. The findings slot's two are now named: PSEPK/infC:182, straddling infC-uniprot.txt:29-30 (the IF-3 30S-binding sentence), and PSEPK/mraY:192, straddling mraY-uniprot.txt:33-34 (the phospho-MurNAc-pentapeptide transfer). Second, the SPKW figure at the top of the section read ~48% with no denominator, eighty lines above a sentence declaring that every rate in the section carries its denominator; it now reads ~48% of 550. Also recorded, from the round's closing observation rather than its suggestions: round 14 was the first to test the sweep's passes rather than only its flags, sampling two quotes it had cleared on NICAT/NaPMT1.1 and finding both verbatim at count 1. A classifier audited only on what it reports can be wrong in the direction nobody looks, so the gate spec now carries that as a requirement - a gate without a cleared-quote check leaves its false-negative rate invisible. That is the one methodological point from fourteen rounds worth carrying into the tooling issue.
