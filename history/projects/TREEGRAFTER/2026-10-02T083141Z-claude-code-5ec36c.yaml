  details: |
    ai4c-reviewer round 9 approved and noted that the confirmed ontology defect had no next-step: the label-vs-definition bullet still read 'worth raising with GO', which was the right register for a suspicion but not for a finding verified against the live ontology, and Next steps had an entry for the twelve hotspot families and none for this. That is the inverse of the stale-pointer failure round 2 caught on benB - a finished item left pointed at, versus an actionable one left unlisted. Added a next-step stating the defect (definition names the AccA/AccD carboxyltransferase component; the label says acetate CoA-transferase complex and a capable_of axiom points at GO:0008775, EC 2.8.3.8, different chemistry), the in-repo corroboration that GO curators themselves use the term for bacterial AccD (the PTHR42995 PAINT IBD seeded by E. coli P0A9Q5), the downstream evidence that the label misleads (QuickGO's blacklist for the term is roughly 80 NOT-qualified annotations on eukaryotic proteins), and a proposed fix.
