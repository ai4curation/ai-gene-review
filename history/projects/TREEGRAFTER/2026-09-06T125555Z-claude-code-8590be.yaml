  summary: 'Review pass: regenerate stale sidecars, fix broken links and wrong GO_REF:0000120
    claim, add aspect/taxon breakdown'
  details: |
    Review of the TreeGrafter Inference Evaluation project page, its
    failure-modes sub-page, scripts and sidecars.

    Verified: every GO_REF:0000118 GOA row in the corpus is IEA / TreeGrafter /
    PANTHER (898 rows); all ten exemplar OpenScientist + Falcon blinded runs and
    the ten Falcon family-characterization reports exist and their verdicts
    match the tables on the failure-modes page (9/10 families HETEROGENEOUS,
    PTHR39559 homogeneous; aceK/ahpC "too general", the rest refuted).

    Fixed: (1) sidecars were stale - the corpus had grown from 2,775 to 4,540
    review files and the reviewed TreeGrafter set from 415/202 genes to
    898/510 genes (now covering every GOA row); accept rate unchanged at ~41%,
    down-graded set 159 -> 306. Numbers on both pages updated. (2) The claim
    that GO_REF:0000120 has "only a handful" of PANTHER-derived rows was wrong:
    891 of ~7,200 rows carry a PANTHER:PTN WITH/FROM, as many as the whole
    GO_REF:0000118 set; reworded and added as a next step. (3) The mcr
    LPS-core error was mis-described as an organism-mismatched process on the
    main page (it is a lipid-A-vs-core sibling-process error, as the sub-page
    says). (4) Links to templates/treegrafter_function_hypothesis.md resolved
    above the site root in the rendered pages; now point at GitHub.
    (5) run_falcon.sh hard-coded a session scratch directory and absolute repo
    path. (6) analyze_treegrafter.py now uses the C YAML loader (minutes ->
    ~45 s) and emits action-by-GO-aspect and per-taxon breakdowns, both of
    which were listed as next steps. Added a corpus-composition caveat (~70%
    of rows are P. putida KT2440) and a snapshot note on the failure-modes
    page that the hand-curated mode tables predate the corpus growth.
