    ai4c-reviewer round 13 found that 43b53a658 rewrote the top of this section with both-slot figures but left two derived figures below as the supported_by-only measurement, stated unqualified - so the section contradicted itself. Line 148 read 'Of the 34 raw flags the sweep produced, only those 7 are real' twenty lines under a table saying 7 + 5 = 12, and line 170 still gave the rate as ~0.7% of 945 where the re-measurement is 12/1206, about 1.0%. Both were mine, introduced one commit earlier. Rather than only labelling the figures as the review suggested, the findings slot was classified too, so the table now gives raw flags per slot with every denominator named: supported_by 34 (25 wrap, 2 elision, 7 real) of 945; references findings 7 (2 wrap, 0 elision, 5 real) of 261; both 41 of 1206. That measurement confirms the review's prediction with data - the wrap-artifact rate is 74% in supported_by and 29% in findings, because findings-slot quotes are short and tend to stop at a wrap boundary rather than run across one (flgG:106 ends exactly where flgG-uniprot.txt:45 ends), so an implementer sizing the unwrapping work from the supported_by rate would be mis-tuned by the same slot asymmetry round 12 fixed elsewhere. Suggestion 2 is also verified and broader than reported: there is a third file: base convention, file:genes/SALSP/... which under reference_base_dir: genes resolves to genes/genes/..., and it appears in 50 reviews repo-wide rather than only mcr-4, so a gate must recognise all three forms rather than treating one as canonical. Suggestion 3's habit is adopted explicitly: every rate in the section now carries its denominator in the same sentence, with a note that three consecutive findings on this PR were the same shape - the measurement sound, the sentence around it wider than the measurement.
