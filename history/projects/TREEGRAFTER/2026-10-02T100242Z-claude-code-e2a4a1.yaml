    ai4c-reviewer round 15 found that both locators added one commit earlier in adae3d646 were wrong, and one was wrong twice over. Verified both before fixing. infC:182 is a core_functions[].supported_by quote, not a references findings one - core_functions begins at infC-ai-review.yaml:167, references spans 120-166 - and its text, the short 'IF-3 binds to the 30S ribosomal subunit', is verbatim at grep -cF count 1 inside infC-uniprot.txt:29, so it straddles nothing and is not a wrap artifact at all. The real findings-slot artifact in that gene is the longer quote at :128, under the - id: file:PSEPK/infC/infC-uniprot.txt parent at :121, which returns 0 on a plain fixed-string test and straddles infC-uniprot.txt:29-31, three source lines rather than two. For mraY the row and slot were right but the span began a line early: the quote starts at 'transfers', the last word of mraY-uniprot.txt:32, so the span is 32-34 and the supporting_text key is at :191 rather than :192. Root cause worth recording because it is the same shape as the error it was fixing: both locators were obtained by grepping the review file for the quote text in a separate step from the pass that had classified the quote, and that grep matched a different occurrence of similar text in a different slot. The corrected locators were read from the files directly with numbered output. The README now carries both correct locators, the detail that both return grep -cF 0 while matching after CC unwrapping, and a parenthetical recording what the earlier citation got wrong - since the line exists precisely to make that table row checkable, and a reader who tried to check it would have found a verbatim quote in the wrong slot.
