  details: |
    ai4c-reviewer round 12 found the sweep recorded in this README had covered only *.supported_by slots while stating 945/7 as a count of the changed set. Verified and the cause is exact: the sweep keyed on reference_id and supporting_text appearing in the same mapping, which holds in supported_by but not in references[].findings[], where the id sits on the parent - id:. So 261 findings-slot quotes were skipped silently. The reviewer's sharper observation is the one now written down: validator.py:117-131, the repo-local gate, iterates references[].findings[] only, while the external linkml-reference-validator CLI covers supported_by - so the audit hand-checked the slot the repo-local gate does not read and skipped the slot it does, and neither is gated for file: anyway (skip_prefixes on one side, LITERATURE_PREFIXES on the other). Rather than state a lower bound as the review suggested, the sweep was re-run across both slot classes: 1206 quotes in 104 reviews, 15 non-verbatim, 3 fixed and 12 left - supported_by 7 (merA 1, groES 1, retS 5) and references findings 5 (merA 2, retS 2, SALSP/mcr-4 1). That is three instances the review had not named. All twelve are byte-identical on main and on rows the audit did not move. The slot set is added to the gate spec, since a gate inheriting either existing path's scope measures half the corpus. Also recorded: merA's composition occupies two sites, so occurrences exceed distinct strings; and the review's suggestion that notes-sourced quotes are where compositions live is not borne out - two of the five findings misses are deep-research-sourced and one comes from a TSV. merA gains an appended record and SALSP/mcr-4 a new one.
