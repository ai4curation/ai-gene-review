  summary: 'Work the four open next steps: corroboration contrast (GO_REF:0000120
    / InterPro2GO), failure-mode classification of all 306 down-grades, family hotspot
    aggregation'
  details: |
    Worked the four next steps left open by the previous review pass.

    1. Corroboration contrast. Confirmed from the GO reference collection that
       GO_REF:0000120 is UniProt's "Combined Automated Annotation using
       Multiple IEA Methods" (identical annotations from >=2 pipelines, sources
       in WITH/FROM). In the corpus every GO_REF:0000120 row with a PANTHER
       node also lists another pipeline, and no gene carries the same term
       under both GO_REF:0000118 and GO_REF:0000002 - so GO_REF:0000118 is the
       *uncorroborated* TreeGrafter output. analyze_treegrafter.py now also
       collects, on the same 510 genes, the corroborated PANTHER rows (637:
       77% ACCEPT, 12% down-graded) and the uncorroborated InterPro2GO rows
       (698: 26% ACCEPT, 53% down-graded, dominated by generic MF terms), and
       writes treegrafter_contrast.tsv plus a same-term head-to-head (0 pairs,
       by construction). New "Corroboration" section on the page.
    2. Failure-mode classification. New classify_failure_modes.py assigns each
       of the 306 down-graded annotations a mode (1 granularity, 2 pseudo-
       enzyme, 3 generic/context, 4 mis-placement) from a per-row curated table
       (failure_mode_curated.tsv, 163 rows with justifications, written after
       reading every reviewer reason) plus a keyword heuristic for the rest
       (143 rows, 61 of them CC). Result: 128 / 4 / 116 / 58 (42/1/38/19%).
       Rule used: subfamily correct + bad term from a higher node = mode 1;
       subfamily itself the wrong enzyme = mode 4. TFP and IRE1 moved out of
       the pseudo-enzyme table; newly recognised mis-placements (mdh, mqo1-3,
       dapE/pepV, ptxD, mupP, quiA, kdsC, acoA, stilbene dioxygenases) added.
    3. Family hotspots. analyze_placement.py now aggregates outcomes per PANTHER
       family / subfamily / graft node over all 898 annotations
       (treegrafter_family_hotspots.tsv): 29 of 63 families with >=4 reviewed
       annotations have >=50% down-graded, 19 have none. Hotspot table and
       upstream-target next steps added.
    4. Main page set to autolink_gene_symbols: false because the new tables
       mis-linked cross-species symbols and family names (aprA->PSEAE, FAS,
       ArgE). Both pages re-rendered; anchors and local links verified.
