  details: |
    Scoping page for the four-term merge of GO:0099638 endosome to plasma
    membrane protein transport and its three regulation children into the
    GO:0032456 endocytic recycling family (go-annotation#6557). Every obsoleted
    term has a direct replaced_by and every replacement is a generalisation, so
    no annotation is invalidated.

    Written from an automated scan of the go-annotation tracker; the issue was
    untracked here. All eight GO ids and labels were verified in OLS on
    2026-09-19 (all still active in the release), and annotation counts,
    evidence splits and assignedBy splits were re-derived from QuickGO rather
    than taken from the upstream issue.

    Repo-side impact established: eleven reviews reference one of the four
    terms, and none carries the matching replacement, so the re-terming is
    clean. genes/human/LMTK3 is the only strict-validation exposure -- GO:1905750
    is in core_functions[].directly_involved_in (enum-bound) and is also the
    target of a NEW proposal; it validates today and should not once the
    obsoletion reaches the validation ontology. genes/human/SORL1 already
    carries GO:2001137 and will hold both the process and its positive
    regulation. Five AP-sigma reviews, projects/DELIVEROME.md and two cached
    GO-CAMs carry prose/context mentions.

    Two findings independent of the obsoletion: mouse Mfsd8 (GO:0099638, IMP,
    PMID:30301600) and human ALDH7A1 (GO:1905750, IDA, PMID:31492851) are
    present in the GO release via api.geneontology.org but absent from QuickGO.
    Since GENE-goa.tsv is QuickGO-derived, genes/human/ALDH7A1 is silently
    missing that row.

    No gene reviews were edited. The ontology thread (go-ontology#31237)
    reopened on 2026-09-19 with a request to de-merge, so the page recommends
    waiting for the ticket to settle before re-terming anything.
