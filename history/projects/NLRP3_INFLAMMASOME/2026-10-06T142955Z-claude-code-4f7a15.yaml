  summary: Reconcile NLRP3 project page with the 2025 Cell Mol Immunol review and
    link the new module
  details: |
    Updated projects/NLRP3_INFLAMMASOME.md against PMID:41062723 (Dubey et al., Cell Mol Immunol 2025).

    Replaced the 'Key Recent Discoveries (2020+)' bullet list, which was four vague headlines, with a 'Mechanism as currently modelled' section stating the actual mechanisms with primary citations: priming vs activation as two steps; inactive decamer/double-ring cage converting to an active PYD-filament disc; NEK7 as a kinase-independent cage-breaking licensing factor rather than a signalling kinase; PtdIns4P on the dispersed TGN and assembly at the MTOC; the unified ASC PYD-then-CARD polymerization mechanism; GSDMD linker cleavage, pore formation and electrostatic filtering of mature cytokines over precursors; and the non-canonical caspase-4/5/11 route as a separate sensing module joining at the K+ efflux feedback edge rather than an alternative sensor.

    Added an 'Other inflammasomes in the review' section distinguishing the sensors that reuse the ASC-caspase-1-GSDMD core verbatim (future sensor variants over a shared core) from those whose mechanism does not fit this module shape: NLRP1 and CARD8 functional degradation via FIIND autoproteolysis and DPP8/DPP9 restraint, and NAIP-NLRC4 where recognition sits on NAIP rather than on the platform-building NLR.

    Corrected the stale bottom line, which claimed the pathway was unmodelled and pointed at nlr_signaling as 'the natural home', and added a Modules section plus concrete next steps. Flagged PYCARD and NEK7 as the highest-value missing gene folders (both modelled, neither reviewed, and PYCARD's GO:0070269 is NAS only) and recorded the proposed 'inflammasome sensor activity' term as the open ontology blocker.

    Rendered with: uv run ai-gene-review render-projects projects/NLRP3_INFLAMMASOME.md -o pages/projects. The one render warning (ambiguous symbol CASP1 in POPTR/SORBI) is pre-existing, caused by there being no genes/human/CASP1 folder, and is non-blocking.
