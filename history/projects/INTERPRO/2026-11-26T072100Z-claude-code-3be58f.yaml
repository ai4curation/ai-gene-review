- type: EDIT
  outcome: changed
  sections:
  - mappings
  summary: 'PR review round 5: a count does not belong in the one field that travels with the set'
  details: |
    Round 4 removed the false blanket invariant from mapping_set_description and replaced it with a
    per-row pointer plus dated counts. The pointer was right; the counts were not, and putting them
    there was a mistake of the same family as the ones this PR has been fixing, made while fixing one.

    mapping_set_description is the field that leaves the repository with the set. A recipient - an
    InterPro2GO curator receiving these recommendations - has the mappings but not interpro/interpro/,
    so they cannot re-derive "9 of 38 entries, 25 of 66 rows" even in principle. A count there is
    unfalsifiable at the point of use and goes stale the moment a row is added, in a field that reads
    as authoritative precisely because it is structured metadata rather than a comment. That is
    strictly worse than the same count in a file comment, which at least sits beside the data it
    describes and beside the note saying it should be derived.

    Counts removed, pointer kept, and the omission is now stated as deliberate with the reason, so the
    next editor does not helpfully add them back. The live counts remain in the file header next to the
    retrospective paragraph.

    The durable/ephemeral distinction is the general lesson and is worth more than the edit: a claim's
    correct home depends on who can check it. "Each row's comment says what that row rests on" is true
    for every reader forever and costs nothing to keep true. "9 of 38" is true for one afternoon and
    only to a reader holding the repository.

    Still open and deliberately not touched: projects/INTERPRO.md:28-30 carries a set-wide count that
    is stale by more than this PR. It is a top-level status page, so it belongs in the status PR, and
    it should be derived there rather than hand-edited - the same conclusion this file reached after
    four failed attempts at maintaining one sentence.
- type: EDIT
  outcome: changed
  sections:
  - mappings
  summary: 'PR review round 6: the replacement enumeration was exhaustive and incomplete'
  details: |
    Round 5 took the counts out of mapping_set_description and left an enumeration: a report where one
    exists, "and otherwise a gene review plus primary literature, or a live InterPro/QuickGO query".
    That reads as exhausting the alternatives over all 66 rows, and it is false. IPR011251 and
