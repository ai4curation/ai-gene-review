  summary: Add the IPR023720 -> GO:0071474 mapping verdict (broadMatch), reversing
    an anticipated removal
  details: |
    Adds one row to projects/INTERPRO/interpro2go.sssom.yaml for InterPro:IPR023720 (Trehalase,
    periplasmic) -> GO:0071474 (cellular hyperosmotic response), as skos:broadMatch.

    This was carried forward from the PseudoCAP batch 6 work as an InterPro2GO "mapping defect", with a
    removal expected. The research done for this row reversed that. The entry's other three terms
    (GO:0004555, GO:0005993, GO:0042597 - InterPro API, checked 2026-11-26, 472 proteins) are sound for
    a family this narrow, and GO:0071474 turns out to be earned by the characterised E. coli enzyme
    rather than being a category error: PMID:1825082 shows a treA null accumulating trehalose
    extracellularly specifically under osmotic stress, and reads the wild type as a futile cycle by
    which the stressed cell sets its cytoplasmic trehalose level. So the argument that the mapping
    confuses "induced by a condition" with "participates in the response to it" - which is what the
    gene review had argued, citing the osmotic induction in PMID:2820965 - is not available here.

    The mapping is nevertheless over-broad, and the reason is the one this project exists to catch: the
    osmotic content lives in the circuitry around the enzyme (an osmotically regulated promoter,
    OtsAB-type trehalose synthesis, trehalose excretion), none of which a trehalase signature detects,
    and the enzyme's own reaction is catabolic under both conditions - osmolarity selects which
    catabolic route runs, with TreB/TreC/TreE serving the unstressed one (PMID:8391102). The same
    source draws the compartmental line the term straddles: endogenous trehalose is the protectant,
    external trehalose is carbon, and this enzyme acts on the latter.

    Rule cover is the deciding factor against a removal: no other InterPro entry and no UniRule
    supplies GO:0071474 to periplasmic trehalases, so removing it would strip the term from E. coli
    TreA, where it is supported. Recorded per the project README's "Before proposing a removal".

    Also recorded, because it is a limit of this project's usual fix: a curated rule
    (rules/curated/CR-nnnn.yaml) cannot cleanly separate the members that should keep the term, because
    the separating condition is "the organism runs an osmotically regulated trehalose cycle", which is
    not a sequence feature or a taxon. The primary ask is therefore to move the term to a source that
    can carry the regulatory condition, or to let it be curated per gene where induction or a
    stress-specific phenotype is shown.

    Provenance differs from the rest of this set: there is no family deep-research report for
    IPR023720. The verdict rests on the PSEAE/treA gene review plus three papers, and it corrects that
    review's reasoning rather than endorsing it. The project page's findings table is not updated here -
    that is a top-level status page and belongs in a status PR after this content merges.
