    of the three listed. IPR039398 rests on QuickGO plus a UniProt release count plus primary
    literature plus a genome survey, with no gene review at all. Verified by reading those rows.

    The header's parallel clause says "for example" and was right; the description's said "otherwise
    X, or Y" and was not. Now hedged the same way, with the UniProt-count basis named since it is
    attested, and with the incompleteness recorded so the list is not read as closed again.

    The part worth recording is how I first responded. Asked about this in round 6, I declined it:
    the enumeration is "of kinds, with no quantity attached", so hedging it further "would empty it".
    That argument is about the sentence's form and never touched the rows. The reviewer read the rows
    and found three that the list does not cover. Six rounds of this PR have been about checking a
    universal claim against the thing it quantifies over, and when handed one more I evaluated its
    shape instead of counting. The reviewer's own framing from the previous round applies exactly -
    a claim's correct home depends on who can check it - and the corollary I missed is that declining
    a correction is itself a claim, which needs the same check as the text it defends.

    This arrived as a non-blocking suggestion on an approved PR. Fixed and pushed anyway, because an
    enumeration that is false against the data is a defect introduced by my own commit two commits
    earlier rather than a style preference, and the project rule for that case is to fix it now. The
    push dismisses the round-6 approval.
- type: EDIT
  outcome: changed
  sections:
  - mappings
  summary: 'PR review round 7: the correction to the enumeration mis-described the rows it cited'
  details: |
    Round 6 hedged the description's enumeration and added a parenthetical naming IPR011251 and
    IPR036661 as resting on "a UniProt member count plus a PMID and a project annotation-patterns
    page". Both rows also cite "Gene review genes/METTH/mer (O27784)", so the gloss omitted a basis
    and thereby implied those rows lack a gene review, which is what made them look like
    counterexamples to the branch they were cited against. They are not counterexamples; they combine
    a gene review with a corpus-wide member count, which is what "rows combine bases" already says.
    IPR039398 is the row that genuinely has no gene review.

    The mechanism is exactly diagnosable and is the same one as the line-wrap failures earlier in this
    session. I extracted the rows' bases with a grep whose alternation listed UniProt dates, member
    counts, QuickGO, projects/ paths and PMIDs - and not genes/ paths. The category missing from the
    search pattern became the category missing from the claim, and I wrote the gloss from the
    extraction rather than from the rows. An incomplete read produced a confident complete-sounding
    statement, which is what happened with head -20 on the lptA CC block and with the single-line
    grep for a wrapped quote. Three instances, one cause: treating a tool's window as the data.

    Fixed by removing the per-row gloss rather than correcting it a third time. The general clause
    does the work - illustrative not exhaustive, rows combine bases, some rest on kinds not listed,
    read the row - and it needs no maintenance and cannot be wrong about a particular row. This is
    the same terminating move the reviewer identified for the retrospective's per-version arithmetic:
    when a sentence keeps being wrong in its specifics, drop the specifics rather than substitute
    better ones.

    Second non-blocking finding fixed on an approved head in two rounds, each time because the text
    was false rather than merely improvable. The round-6 approval was already dismissed by the
    previous push; this one dismisses nothing further, the PR having had no approval since.
- type: EDIT
  outcome: changed
  sections:
  - mappings
  summary: 'PR review round 7: the sentence explaining the omission could not be followed by its reader'
  details: |
    Round 5 removed the counts from mapping_set_description because that field travels with the set and
    a recipient cannot re-derive a figure in it. The replacement explained the omission and ended "The
    current counts are in the file header, beside the note on why they should be derived" - a pointer
    to a file the recipient does not have. The justification for removing the counts applied equally to
    the sentence justifying it, and I did not apply it.

    Both moved to the header. The description now carries only what a reader holding the set can act
    on: each row's comment names that row's basis. The header carries the counts and the reasoning
    about them, including why the description has neither, since the header is only ever read beside
    the data it describes.

    This completes a pattern worth stating as the lesson of the whole PR. Five successive repairs to
    this one field each introduced a smaller instance of the defect being repaired: a blanket invariant
    became an uncounted uniqueness claim, which became a two-population partition over three
    populations, which became a count in a field that cannot hold one, which became a pointer that
    cannot be followed, which became a per-row gloss that mis-stated the rows. The convergence is
    toward saying less, and every intermediate step would have been avoided by asking the same
    question earlier: who will hold this claim, and can they check it.

    The reviewer's cleaner example is noted and not used: IPR002956's basis is a bioinformatics
    RESULTS.md, a kind the list omits more plainly than the UniProt count does. No example is named now
    that the per-row gloss is gone, so there is nothing to choose between.
