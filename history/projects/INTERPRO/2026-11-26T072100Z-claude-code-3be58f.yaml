  summary: 'PR review round 2: the sentence that repaired the false header claim was itself false'
  details: |
    Round 1 softened the header's blanket provenance claim, correctly, and then added
    "IPR023720 is currently the only such row." That is false, and checkably so: of the mapping
    set's 38 distinct subject entries, only 11 have a cached
    interpro/interpro/<IPR>/<IPR>-metadata.yaml and 27 do not. IPR000534 rests on the Msed_0709 and
    Msed_1700 gene reviews, IPR001135 on the ECOLI/nuoC, PSEPK/nuoC and human NDUFS2 reviews plus
    the PTHR11993 family review, and IPR045122 records verification against the live InterPro and
    QuickGO APIs - the two exact departure modes the softened sentence had just named. Verified
    independently rather than taken from the review: counted the metadata files on disk and the
    distinct subject ids in the set, 16 files for 11 of the 38 entries, and read the three rows.

    So I replaced one unchecked blanket claim with another, in the same sentence I was repairing to
    make it checkable, and the second was wrong by 26 rows rather than 27. The shape is the one
    running through this session: a fact true of the fragment in front of me - my row departs from
    the stated provenance - written as a fact about the whole set.

    The replacement states only what was counted, hedges where it cannot verify a universal, and
    points the reader at the row rather than at an invariant: the comment is authoritative for what
    its row rests on; where the cached file and report exist the facts and verdict come from them;
    27 of 38 entries have no cached file, with the count dated; and four rows are named as examples
    of the two departure modes, each one checked. No claim is made about what all 27 rest on, since
    only four were read.

    Both superseded versions are recorded in the header itself so the next person does not reinstate
    either, and a derived breakdown is assigned to the refresh PR that regenerates
    suspect_interpro_mappings.tsv rather than to a hand-maintained sentence.
