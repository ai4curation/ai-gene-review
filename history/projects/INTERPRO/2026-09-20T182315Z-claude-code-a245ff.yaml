- type: EDIT
  outcome: changed
  summary: File three InterPro2GO defects found gene-first rather than family-first
  details: |
    Three InterPro2GO mappings caught while reviewing genes, added to the existing SSSOM proposed-edit mechanism (25 -> 29 mappings, nine -> twelve entries):

    - IPR045122 -> GO:0005227 (REMOVE): the entry is calcium *permeable*, the GO term means calcium *gated*; opposite directions of causation. Lands on TMEM63A/B/C.
    - IPR042371 -> GO:0003726 (REMOVE): a catalytic activity mapped onto a binding domain; ZBP1 has a Zalpha domain and no deaminase domain. The entry's GO:0003723 RNA binding is sound and recorded as ACCEPT.
    - IPR006935 -> GO:0003677 (REMOVE): the Helicase/UvrB N-terminal fold recurs in the RNA-sensing RIG-I-like receptors, so IFIH1 (MDA5) inherits DNA binding.

    Entry names, types and match counts verified against the live InterPro API; GO term definitions against QuickGO. The methodological point recorded in INTERPRO/notes.md: the family worklist ranks entries by how many reviewers already flagged them, so it is structurally blind to mappings that are wrong but rarely reviewed.
