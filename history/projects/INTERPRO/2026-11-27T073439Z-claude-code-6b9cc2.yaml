    to justify testing by containment rather than position, and under the note-level reading
    position would have succeeded on all seventeen. Containment is still the right test - a note's
    end is a judgement rather than a marked boundary, and the two genuine cases show the boundary
    moving - but the evidence is those two cases, not fourteen. The page now states the criterion
    inline, gives the figure for the predicate actually counted, and says plainly that position
    would have worked and why containment is preferred anyway.

