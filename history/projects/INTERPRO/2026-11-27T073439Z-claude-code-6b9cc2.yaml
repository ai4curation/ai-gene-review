    17, and in two of them the comment's final sentence is something else. The conclusion is
    unchanged and was never in doubt - containment is the robust test because a note's end is a
    judgement rather than a marked boundary, and those two rows are where the judgement bites.

    This is worse than a stale figure, and the reason is worth keeping: a reader meets an
    irreconcilable pair before reaching the conclusion, where a stale-but-consistent claim can at
    least be checked and found wrong. Consistency is what makes a claim checkable.

    The paragraph was also doing six jobs in one block - the figure, the containment argument, the
    two edge cases, the parse instruction, the excluded eighteenth case and the note-less eight.
    Split into prose and a three-step list, so a curator checking one removal reads the method
    without the argument. The re-derivation steps are now numbered and the as-of sits with the
    figure it dates.

