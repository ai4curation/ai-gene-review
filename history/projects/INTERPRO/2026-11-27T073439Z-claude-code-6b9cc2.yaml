- type: EDIT
  outcome: changed
  sections:
  - results
  summary: Record the IPR023720 verdict and replace two stale set-wide claims with
    derived ones
  details: |
    The status PR that #7078 deliberately deferred, now that it has merged. Three changes, two of
    them corrections to claims that had gone stale in the way this project keeps finding.

    The IPR023720 verdict is recorded in the findings table: GO:0071474 cellular hyperosmotic
    response on the periplasmic trehalase entry, filed as a removal and reversed by the research.
    An E. coli treA null accumulates trehalose extracellularly only under osmotic stress, which is
    participation evidence rather than induction, so the term is earned by the characterised
    enzyme; it is nevertheless over-broad, because the osmotic content lives in the circuit around
    the enzyme rather than in the enzyme, and a trehalase signature detects none of it. Recorded as
    broadMatch, with the two reasons a removal is wrong here: no other entry and no UniRule supplies
    the term to periplasmic trehalases, so removing it would strip it from the one protein where it
    holds, and a curated rule cannot separate the members because the condition is "the organism
    runs an osmotically regulated trehalose cycle", which is neither a sequence feature nor a taxon.

    The set-wide summary said "36 proposed mapping edits across fifteen entries: ten removals,
    twelve proposals to narrow or qualify a mapping, and fourteen endorsements". Every figure was
    stale: the set is 66 rows across 38 entries, 25 removals, 25 narrowings and 16 endorsements.
    What makes it worth recording rather than just fixing is that the old sentence stayed internally
    consistent the whole time it was wrong - 10 + 12 + 14 = 36 - while the set nearly doubled. That
    is the third time in two days a self-consistent total has hidden staleness, after the PSEUDOCAP
    Bottom line and its tier-2 kind list. So the sentence now carries its own derivation: a removal
    is skos:exactMatch with predicate_modifier Not, a narrowing is skos:broadMatch, an endorsement
    is an unmodified skos:exactMatch, and the instruction is to re-derive from the file rather than
    edit the prose.

    The second correction was a universal claim. "Each removal row in the mapping set ends with a
    note on what still supplies the term to the members that should keep it" is false for 8 of the
    25 removal rows. It now says 17 of 25 and names the six entries that carry no such note, so a
    reader checking a removal does not assume the note is there.

    One self-caught error worth recording, because it is the same habit in miniature. Writing that
    sentence I named "IPR017682 (two rows)" from an earlier note of mine. Deriving the per-entry
    breakdown instead showed two entries with two rows each, IPR017681 as well as IPR017682. The
    note I was copying from had said so and I had compressed it wrong. Six entries, eight rows:
    IPR002844, IPR005778, IPR017679 and IPR036080 with one each, IPR017681 and IPR017682 with two.

    Not done here, and deliberately: suspect_interpro_mappings.tsv is not regenerated. It is a
    generated artifact of a deterministic pipeline, which this project treats as an input, and
    refreshing it is a separate change with its own diff to inspect rather than something to fold
    into a status edit.

    Render: 5 pages, 3 warnings. validate-quotes does not apply - the page is Markdown prose with no
    supporting_text, and passing it to that recipe reports it as unparseable, which is my usage error
    rather than a finding. Nothing in the corpus quotes this page.
- type: EDIT
  outcome: changed
  sections:
  - projects/INTERPRO.md
  summary: >-
    Four stale set-wide claims the derived-figures change left standing, one of which it falsified;
    plus the rule-cover derivation criterion and two table fixes.
  details: >-
    The review's verdict is right and uncomfortable: a change whose thesis is that hand-maintained
    set-wide figures go stale while staying self-consistent left four of them on the page it was
    fixing. Verified each from the SSSOM before editing.

    1. The archaeal paragraph said its six rows were "not counted in the totals above". False once the
    totals are derived over the whole file: all six subject ids are present (IPR019982, IPR018229,
    IPR017402, IPR000426, IPR005024, IPR000534), so they are inside the 66, the 38 and the 25/25/16,
    and the three removals among them all carry Rule cover clauses, so they are inside the 17 of 25
    too. This is the one the change actively falsified rather than merely left behind, since the
    caveat was true against a hand-maintained 36. Now says they are inside the totals and why.

    2. "Each removal row ends with a rule-cover note" survived at the "What curators can act on"
    section, 42 lines after the same universal claim was corrected to "17 of the 25" - and that
    section is where a curator starts reading. The earlier change reported this claim as fixed and
    fixed one of its two instances. Now reworded to match.

    3. The supporting-material bullet gave "36 mapping assessments, 25 dated 2026-06-20, 4 added
    2026-09-17 and 7 added 2026-09-27", a second self-consistent 36 on the same page. The row count
    is now 66 across 38 entries, but the date split was dropped rather than corrected, because it is
    not derivable: mapping_date appears once at set level and 0 of 66 rows carry their own, so a
    corrected date split would go stale exactly as the counts did. The bullet says so and notes that
    per-row mapping_date would make it derivable.

    4. "three of the fifteen entries" matched neither reading: not the 38 entries of the set, and not
    the findings table, which this PR took from 15 rows to 16 by adding IPR023720 (the table runs 18
    lines including header and separator). Dropped the denominator rather than picking one, and
    likewise "the worklist below the first dozen entries" to "the lower-ranked part of the worklist".

    Swept the class rather than the named instances, which is the standing lesson: grepped every
    numeral and number word on the page in a claim-like position. Everything remaining is either a
    derived figure or the deliberate reference at line 35 to the value that went stale.

    Three suggestions taken. The 17-of-25 criterion is now literal - match the Rule cover or
    "cover (current ...)" clause - with the one near-miss named and excluded for a reason: the
    IPR017682 removal of GO:0050660 says where FAD binding does belong (FrhB, via IPR017679) without
    a cover clause, so a semantic reading reaches 18, and it is excluded because it names cover for a
    sibling entry's members rather than this entry's. The older vague sentence that said only "a count
    over the comment fields" now points at that criterion instead of restating itself. The IPR023720
    Request cell asked InterPro to move the term to a source that can carry the regulatory condition
    while the same cell establishes that no such source exists; it now asks for what InterPro can
    actually do - keep the mapping recorded as over-broad - and names dropping it as the fallback if
    policy forbids carrying a knowingly over-broad mapping. And the row moved to the end of the table
    so the T3SS/ATPase audit group (IPR013380, IPR004100, IPR005714) stays contiguous.

    Not taken here: the suggestion to put the counts in a just recipe, which the review answers
    affirmatively to a question this page asked. It is the right fix and it is code, not a status
    page; it belongs with the queued invariant-checks PR, where a check that greps the page for the
    figures it prints would have caught all four of these findings. Recorded there rather than
    widening a status PR.

    Render unchanged at 5 pages, 3 warnings.
- type: AUDIT
  outcome: needs_followup
  sections:
  - projects/INTERPRO.md
  - projects/INTERPRO/slides/INTERPRO-slides.md
  summary: >-
    The class extends past the page into the published deck, which carries a fourth self-consistent
    total one generation older and whose chart inverts the finding. Recorded as knowingly stale and
    queued rather than fixed here; added the rule-cover table's selection caveat.
  details: >-
    The review is right that the class sweep stopped at the page boundary while the class does not.
    Verified in the committed files: projects/INTERPRO/slides/INTERPRO-slides.md:41 reads "Output: 29
    proposed mapping edits on 12 entries: 7 remove, 10 narrow, 12 endorse", and
    interpro-pipeline.svg carries the same split as a legend (exactMatch 12, broadMatch 10,
    exactMatch+Not 7) with "29 (entry, GO term) verdicts, 12 entries". The rendered
    INTERPRO-slides.html embeds both markdown instances. 7+10+12 = 29, so it is a fourth
    self-consistent total, and projects/INTERPRO/notes.md:14 records exactly the 29 -> 36 transition
    it predates.

    The number is the lesser half. Derived now, the classes are 25 removals, 25 narrowings and 16
    endorsements, so the published legend reads 12 / 10 / 7 descending, which presents endorsements
    as the largest class when they are the smallest of the three. That is a misstatement of the
    project's finding in an artifact the page's own manifest links and Pages publishes, not a
    counter that drifted.

    Decision: recorded as knowingly stale and queued for a deck-refresh PR, which is the option the
    review offers alongside fixing it here. Two reasons, and the first is consistency rather than
    convenience. This PR excluded suspect_interpro_mappings.tsv on the grounds that a generated
    artifact deserves its own diff; the committed slide HTML is a Marp render and the SVG legend is
    hand-maintained geometry, which is the same category, so fixing one here while excluding the
    other would make the scope rule arbitrary. Second, the deck is not renumberable in place: its
    "Proposed removals (7)" heading introduces a section of six illustrative table rows, so a
    correct deck lists 25 removals or says explicitly that it shows a selection, and the legend rows
    read in descending order that the new figures reverse. That is deck authoring plus a regenerated
    HTML, not a counter edit.

    The refresh needs all three files together: the markdown at :41 and :67, the SVG legend at
    :72-75 with its ordering, and a re-render (marp is available through the slides recipe). It
    should take the derived figures rather than new hand-maintained ones, and the project's own
    lesson says the deck should cite the derivation rather than restate a count.

    Taken in this change: the rule-cover table's selection caveat. The table lists twelve entries
    and the seventeen cover notes span fifteen, so seven are absent -- IPR019982, IPR018229,
    IPR017402, IPR001135, IPR037893, IPR002956, IPR018194, each verified absent from the table and
    present among the cover rows. A curator looking one up could have concluded from the table that
    a removal has no cover note. The page now says the table is a selection and points at the row's
    own comment.

    Recorded for the queued check-interpro-counts recipe, which is the sharper of the two
    suggestions: the restriction is the load-bearing part, not the predicate map. Cover clauses also
    sit on six broadMatch rows, so a naive grep over the whole file returns 23 while the figure is
    17 over removal rows only. Verified both counts. A recipe that greps without restricting to
    removals would print a wrong number confidently, which is the failure this page exists to
    document.

    Render unchanged at 5 pages, 3 warnings.
- type: AUDIT
  outcome: changed
  sections:
  - projects/INTERPRO.md
  summary: >-
    The preceding event's intermediate figure is wrong and, unlike the figures this PR fixes, is not
    even self-consistent: the table lists eight entries, not twelve. Also surfaces the deck caveat
    where page readers meet it, and replaces the hand-listed seven with the rule.
  details: >-
    The previous event wrote "The table lists twelve entries and the seventeen cover notes span
    fifteen, so seven are absent". Eight, not twelve. The twelve came from grepping IPR ids anywhere
    in the table, which picks up entries named in the "what still supplies the term" column as well
    as the ones the rows are about; the first column carries IPR000719, IPR001424, IPR005714,
    IPR006935, IPR012724, IPR013380, IPR042371 and IPR045122, verified by reading column one alone.

    What makes this worse than the class it was written to fix: those figures were wrong while
    staying self-consistent, which is why they survived. This one does not even do that - 15 minus
    12 is 3, not the seven the same sentence then names - so a reader spot-checking the record hits
    a contradiction before reaching the conclusion. It is in the provenance for a fix to exactly
    this class, and the commit message repeats it.

    The conclusion is unaffected and holds under both readings, which is why the error was easy to
    miss: the table carries ten of the seventeen cover rows and eight of the fifteen entries that
    have one, and the seven absent entries carry exactly one row each, so 17 - 10 and 15 - 8 both
    give seven.

    Two suggestions taken. The deferral decision was recorded only in history/, which is provenance
    a page reader never sees, while the page's own manifest links the deck Pages publishes - so a
    curator clicking Slides still met 29/12 and a legend calling endorsements the largest class with
    nothing to warn them. The manifest entry's description now reads "AI generated; figures predate
    the 2026-11 refresh", which is the field CLAUDE.md documents as showing on the pill and as its
    tooltip, so the caveat appears where the click happens rather than in a record. And the
    rule-cover caveat now leads with the rule - a removal's cover note lives in its own row comment,
    and the table reproduces only some - with the seven named as of this writing rather than as the
    definition, since a hand-listed seven goes stale as more cover notes land.

    Recorded for the queued check-interpro-counts recipe, which now has three items: restrict the
    cover-clause match to removal rows (a whole-file grep gives 23, not 17); and
    predicate_modifier: Not has 26 hits of which only 25 are rows, the 26th being the header comment
    at :18, so a whole-file grep reports a partition that does not sum and reads as a data error
    rather than a tool error.

    Render unchanged at 5 pages, 3 warnings.
