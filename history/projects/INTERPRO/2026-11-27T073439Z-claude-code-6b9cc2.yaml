    header comment, and as the 23-versus-17 cover-clause count, where the extra six sit on
    broadMatch rows. Three instruments in one file that each return a number close enough to the
    right one to be believed. That is a seventh item for the queued recipe, and a different kind
    from the six already recorded: those say what to match and where to look, this one says how to
    read the file, because a line-oriented implementation of any of the three is wrong in a way
