    recorded checks compare numbers, grep for stale figures, flag undeclared criteria, or assert a
    projection is a fixed point. A term used with two referents inside one grammatical sentence has
    no number to compare and no missing criterion to flag; it is a legibility defect and the only
    control is naming the referent once. Recording that the check set has a floor is more useful
    than a tenth item that cannot be implemented.

