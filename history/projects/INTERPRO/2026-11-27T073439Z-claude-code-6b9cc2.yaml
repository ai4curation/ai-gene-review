    rather than counting had, for the first time, caught a reviewer-supplied figure before adoption
    - the review had proposed "two of the seventeen" and enumeration gave 14. The review's two was
    closer to right than the 14, for a reason neither of us had stated: it was counting notes with
    genuinely following material, and it had an unstated criterion of its own. So enumeration did
    not save the claim, because what was enumerated was not what the sentence asserted. Enumerate
    the predicate the sentence states, not a predicate that produces a number. A figure can be
    correctly derived and still be the wrong figure, and that failure looks exactly like diligence.
