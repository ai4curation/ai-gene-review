    is not what the sentence claims. In all seventeen the cover clause is the last element of its
    comment, so what the count treated as following text is, in twelve of the fourteen, the note's
    own continuation. Only two rows carry trailing material that is not cover content: IPR000719 on
    GO:0005524, where the sole-source check result follows, and IPR018194, where a cross-reference
    to IPR002844 and IPR036080 does.

