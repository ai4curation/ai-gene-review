  summary: Record the IPR023720 verdict and replace two stale set-wide claims with
    derived ones
  details: |
    The status PR that #7078 deliberately deferred, now that it has merged. Three changes, two of
    them corrections to claims that had gone stale in the way this project keeps finding.

    The IPR023720 verdict is recorded in the findings table: GO:0071474 cellular hyperosmotic
    response on the periplasmic trehalase entry, filed as a removal and reversed by the research.
    An E. coli treA null accumulates trehalose extracellularly only under osmotic stress, which is
    participation evidence rather than induction, so the term is earned by the characterised
    enzyme; it is nevertheless over-broad, because the osmotic content lives in the circuit around
    the enzyme rather than in the enzyme, and a trehalase signature detects none of it. Recorded as
    broadMatch, with the two reasons a removal is wrong here: no other entry and no UniRule supplies
    the term to periplasmic trehalases, so removing it would strip it from the one protein where it
    holds, and a curated rule cannot separate the members because the condition is "the organism
    runs an osmotically regulated trehalose cycle", which is neither a sequence feature nor a taxon.

    The set-wide summary said "36 proposed mapping edits across fifteen entries: ten removals,
    twelve proposals to narrow or qualify a mapping, and fourteen endorsements". Every figure was
    stale: the set is 66 rows across 38 entries, 25 removals, 25 narrowings and 16 endorsements.
    What makes it worth recording rather than just fixing is that the old sentence stayed internally
    consistent the whole time it was wrong - 10 + 12 + 14 = 36 - while the set nearly doubled. That
    is the third time in two days a self-consistent total has hidden staleness, after the PSEUDOCAP
    Bottom line and its tier-2 kind list. So the sentence now carries its own derivation: a removal
    is skos:exactMatch with predicate_modifier Not, a narrowing is skos:broadMatch, an endorsement
    is an unmodified skos:exactMatch, and the instruction is to re-derive from the file rather than
    edit the prose.

    The second correction was a universal claim. "Each removal row in the mapping set ends with a
    note on what still supplies the term to the members that should keep it" is false for 8 of the
    25 removal rows. It now says 17 of 25 and names the six entries that carry no such note, so a
    reader checking a removal does not assume the note is there.

    One self-caught error worth recording, because it is the same habit in miniature. Writing that
    sentence I named "IPR017682 (two rows)" from an earlier note of mine. Deriving the per-entry
    breakdown instead showed two entries with two rows each, IPR017681 as well as IPR017682. The
    note I was copying from had said so and I had compressed it wrong. Six entries, eight rows:
    IPR002844, IPR005778, IPR017679 and IPR036080 with one each, IPR017681 and IPR017682 with two.

    Not done here, and deliberately: suspect_interpro_mappings.tsv is not regenerated. It is a
    generated artifact of a deterministic pipeline, which this project treats as an input, and
    refreshing it is a separate change with its own diff to inspect rather than something to fold
    into a status edit.

    Render: 5 pages, 3 warnings. validate-quotes does not apply - the page is Markdown prose with no
    supporting_text, and passing it to that recipe reports it as unparseable, which is my usage error
    rather than a finding. Nothing in the corpus quotes this page.
