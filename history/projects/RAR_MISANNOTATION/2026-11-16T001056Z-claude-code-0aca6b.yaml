  summary: Family-wide RAR mapping and rule errors written up as SSSOM rows, curated
    rules CR-0008 to CR-0010 and two UniRule reviews
  details: |
    Turned the family-wide errors from the RAR plant/animal triage into structured records. InterPro2GO: broadMatch rows in projects/INTERPRO/interpro2go.sssom.yaml for IPR039398 (Deltex) to GO:0007219, IPR026203 (RHAMM) to GO:0005540 and IPR021006 (Hda2/Hda3) to GO:0070823, each naming a replacement rule: CR-0008 (IPR039398 AND Metazoa), CR-0009 (IPR026203 AND Vertebrata or Cephalochordata) and CR-0010 (IPR021006 AND Fungi), with UniProt 2026_04 counts and QuickGO row counts. UniRules: MODIFY reviews of UR000414538 (RCK_C; add negative conditions on IPR051679 DASS-related transporters and IPR004666 RimK/LysX) and UR000345849 (PEMT/PLMT; its GO:0004608 case excludes only Fungi, while case 6 already excludes Fungi and Viridiplantae for the same reaction). Corrected two triage verdicts: the PEMT rule already separates the branches except for the GO case, and anchoring junction on plasmodesmal proteins comes mainly from GO placing cell-cell junction under anchoring junction since 2019, not from the SL-0038 mapping (8 direct plant rows against 43,286 plant annotations under GO:0070161). Project page section and next steps updated. After PR review: UR000345849 cases 2 and 6 recorded as structured condition sets; UR000414538 adds the in-cis channel class (drop GO:0015459, keep GO:0043266); CR-0009 notes the weaker vertebrate evidence and scopes the hyaluronan claim to animals.
