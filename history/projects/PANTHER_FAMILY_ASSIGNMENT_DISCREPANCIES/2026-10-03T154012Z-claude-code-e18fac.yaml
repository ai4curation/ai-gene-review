  summary: Create PANTHER family assignment discrepancies project stub
  details: |
    Created a SCOPING project recording disagreements between UniProt/InterPro PANTHER cross-references and PANTHER's own sequence classification and PAINT trees. One case so far: C. elegans ced-1 (Q9XWD6) and human MEGF10 (Q96KG7). UniProt places them in PTHR24043:SF8 and PTHR24052:SF13; PANTHER 19.0 classification places both in PTHR24035 (SF109 Draper, SF136 MEGF10), consistent with PAINT nodes PTN002372116 and PTN009076277. Found while grounding the phagocytic engulfment module.
