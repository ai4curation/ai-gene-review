  summary: 'Create project page: Sea Urchin Endomesoderm GRN'
  details: |
    New project page collecting gene reviews for the core nodes of the Davidson-lab Strongylocentrotus purpuratus endomesoderm gene regulatory network (Tcf, SoxB1, Wnt8, Blimp1, Otx, GataE, FoxA, Eve, Pmar1, HesC, Alx1, Ets1, Erg, Dri, Delta, Gcm, GataC, Bra). Describes the network architecture, the curation conventions applied to a species whose GOA is almost entirely electronic, and the nodes not yet covered (Tbr, Hox11/13b, Hex, Tgif, FoxB). Rendered to pages/projects and added to the manually maintained project index.
