  details: |
    Drew a reproducible 50-row sample (scripts/sample_def_xref_spot_check.py, seed 20261123) from the 592 unflagged PW definition citations of live GO processes and judged each against the GO definition. 48 hold (3 exactMatch, 45 closeMatch); 2 cite a narrower GO term (PW:0000100 transcription pathway -> GO:0006351; PW:0000211 biogenic amines and polyamines -> GO:0006595), recorded as narrowMatch; none is wrong. Verdicts are in data/pw_def_xref_spot_check.yaml. analyze_rgd_pathways.py now writes unflagged citations as skos:closeMatch and spot-checked pairs with their verdicts; obsolete, missing and non-process citations stay relatedMatch. These rows were already used for matching, so tiers and summary counts are unchanged; 28 seeds' GO-mapping predicates change. Also adds tests for the missing-module and invalid-YAML warnings in load_modules. The optional transmembrane-only adenylyl cyclase node was not added: gpcr_camp_pka_signaling#adenylyl_cyclase_activation, which five modules reference, carries a Gs-stimulated/Gi-inhibited variant axis that a reference to the cassette's regulatory classes would not keep.
