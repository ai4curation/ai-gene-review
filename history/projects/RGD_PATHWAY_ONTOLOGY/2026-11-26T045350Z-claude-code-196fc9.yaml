- type: EDIT
  outcome: changed
  summary: 'Triage: GO-CAM completeness against mouse and rat GO-CAMs.'
  details: |
    analyze_rgd_pathways.py now counts, for each PW term's human gene basis, the genes whose mouse or rat ortholog (one-to-one HGNC MGI/RGD cross-reference) is in a GO-CAM of that species, and the share in any human, mouse or rat GO-CAM. New columns n_basis_in_mouse_gocam, n_basis_in_rat_gocam and frac_basis_in_any_mammal_gocam in pw_gocam_completeness.tsv; new summary counts. Of 144 in-scope diagram pathways, the median share of genes in a GO-CAM rises from 0.292 (human only) to 0.462 (human, mouse or rat), and pathways with at least half their genes covered rise from 42 to 70. 878 human genes have a mouse ortholog in a mouse GO-CAM and 39 a rat ortholog in a rat GO-CAM; 634 are covered only by a rodent model. Largest gains are metabolic: pentose phosphate (0 to 0.86), kynurenine (0 to 0.83), NAD biosynthesis (0.22 to 1.0), folate one-carbon (0.21 to 0.93). Tiers unchanged (136 has_module); the data refresh also picks up modules and reviews merged on main.
