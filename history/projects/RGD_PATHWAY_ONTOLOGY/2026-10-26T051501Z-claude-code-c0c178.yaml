- type: EDIT
  outcome: changed
  summary: Curated GO mappings for the 28 needs_go_mapping seeds
  details: |
    Added data/pw_go_curated.sssom.yaml, a hand-curated SSSOM set mapping the 28 RGD diagram pathways that had no GO biological process mapping (30 rows: 1 exact, 9 close, 4 narrow, 14 broad, 1 related, 1 sssom:NoTermFound). analyze_rgd_pathways.py merges it under pw2go:src/CURATED_MAPPING, checks each GO id and label against the pinned GO release, and uses only exact, close and narrow rows for GO-CAM and module matching. A new tier, no_specific_go_term, holds curated pathways with only a broad GO term or none. Re-run: candidate 9, related_module_only 24, no_specific_go_term 14, needs_go_mapping 0. Obsolete or unresolvable page citations are no longer also counted as disagreeing. The project page records the results and the GO term gaps (hormone-receptor signalling, CaMKII, ATM, mitochondrial vs cytosolic Fe-S assembly, histone modification).
