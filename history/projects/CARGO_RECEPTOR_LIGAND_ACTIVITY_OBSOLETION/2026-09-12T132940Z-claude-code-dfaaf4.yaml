    Scoping page for the proposed obsoletion of GO:0140355 cargo receptor ligand activity, selected by the automated go-annotation issue scanner from go-annotation#6533. Annotation footprint re-derived independently from QuickGO (172 rows / 164 gene products; 157 IEA, 9 ISO, 3 IDA, 3 EXP) rather than taken from the upstream thread, whose first count was corrected in-ticket; the IEA rows are a three-seed fan-out from mouse Tcn2 O88968, mouse Cblif P52787 and yeast ATG5 Q12380, leaving six manual rows. All six reference titles confirmed against PubMed and all six GO ids in OLS. Records repo impact: human/TCN2 and human/CBLIF use GO:0140355 in core_functions (strictly validated) and break when the obsoletion lands; human/TCN1 has the row only; human/HSPA12A mentions it in prose. Flags the orphaned mouse Hpse ISO row (source Q9Y251 unannotated) for upstream. Rendered with just render-project (no autolink warnings) and a card added to the manually-maintained pages/projects/index.html.
