  summary: Scope project on non-physiological reactions reaching GO via EC and Rhea
  details: |
    New project page. Frames the assay-substrate-to-annotation pipeline, proposes a five-category taxonomy separating assay substitutes from evolved xenobiotic degradation, lists candidate detection signals, and collects the 15 existing GO molecular-function obsoletions citing non-physiological substrates as a labelled calibration set. Documents two residues left by past obsoletions: Rhea xrefs pushed onto EC-level grouping classes (9 reactions across GO:0016616, GO:0008241, GO:0016712), and go-ontology#28108 having bulk-obsoleted GO:0018830 on criteria that selected for curation coverage rather than evidence. Linked bidirectionally with ASSAY_TO_FUNCTION as the readout/substrate pair of the same problem. Maturity SCOPING.
