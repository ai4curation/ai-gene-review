  summary: 'Re-review of every REMOVE row in the mouse and rat gene reviews: 109 of
    469 substantive rows changed'
  details: |
    Every annotation row with action REMOVE in genes/mouse and genes/rat was read again under the rules of the human REMOVE re-review (14 November 2026). There were 1,098 such rows in 452 review files; 629 are bare protein binding rows, audited by script and unchanged. Of the 469 substantive rows in 163 reviews, 109 no longer say REMOVE (40 MARK_AS_OVER_ANNOTATED, 32 KEEP_AS_NON_CORE, 20 MODIFY, 7 ACCEPT, 6 UNDECIDED, 4 TOO_GENERAL), 360 stand, 25 of those got a corrected reason, a recorded source defect or a recorded no-data case, and 16 source defects were recorded. 48 review files were edited (36 mouse, 12 rat). No row was changed to REMOVE. The largest group is orthology transfers that had been removed although the review of the donor ortholog keeps the source row (31 rows) or although the donor experiment shows the claim (6 rows); the pass adds the rule that a transfer is judged like its source row unless something specific to the target argues otherwise. Main was merged before the edits were applied, so six reviews added after the triage are covered. New sub-page projects/MOUSE_GENES_RE_REVIEW/REMOVE_RE_REVIEW.md describes the method, the rules, the changed rows, the rows that stand and the follow-ups; projects/MOUSE_GENES_RE_REVIEW/remove_rereview_changes.yaml lists every changed row with its rule, 21 REMOVE rows kept with a note (8 close calls), and rows outside the pass that it puts in question (twelve places in human reviews, two in rat reviews). The project page gains an entry under Follow-up corrections and a link under Related. Three items carried over from the review of ai4curation/ai-gene-review#6331 were done with the pass: the mouse Sirt2 transfers of a muscle term are UNDECIDED like their human source row, the human SIRT2 cell differentiation row is MODIFY to the specific term, and an unrelated quote was dropped from the human SIRT2 protein binding row.
