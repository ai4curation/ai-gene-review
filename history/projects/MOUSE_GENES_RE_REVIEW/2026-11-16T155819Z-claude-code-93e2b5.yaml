  details: |
    The branch was merged with main (4845b23e4) after ai4curation/ai-gene-review#6331 had been squash-merged. Counts on projects/MOUSE_GENES_RE_REVIEW/REMOVE_RE_REVIEW.md and in remove_rereview_changes.yaml are now final for the pass: 110 of the 469 substantive REMOVE rows no longer say REMOVE (40 MARK_AS_OVER_ANNOTATED, 32 KEEP_AS_NON_CORE, 20 MODIFY, 7 ACCEPT, 7 UNDECIDED, 4 TOO_GENERAL), 359 stand, 24 of those have a corrected record, 16 source defects, 48 mouse and rat review files edited (36 mouse, 12 rat). Changes since the first record of this pass: mouse App protein phosphorylation (IMP) is MARK_AS_OVER_ANNOTATED; mouse Hsp90aa1 positive regulation of cytotoxic T cell differentiation (TAS) has a suspected WRONG_TERM source defect and is UNDECIDED, not REMOVE, under the new rule on claims made from an abstract; the sub-page states the base commit of the pass (70e3fa209) and that main afterwards changed five of the rows the pass had left as REMOVE (mouse Lamp1, mouse and rat Map2k4, two rat Tardbp rows) and added 13 mouse and rat reviews; the note on mouse Map2k4 and the follow-up on human MAP2K4 were withdrawn, because main showed that the Map2k4 row is exported from a GO-CAM model and is not attached to the wrong gene; the follow-up on human TARDBP was corrected for the same reason. Eleven human rows remain listed as follow-ups.
