  details: |
    Round 7 for PR 4819: four qualifying and eight optional findings, answered in one push.

    Flag glossary. The round-6 fix made the legend self-enforcing but printed only the flags a run emitted, which silently dropped the definitions of NO_GO_ALIGNMENT, NO_CORE_FUNCTION_TERMS, ALIGNED_PROPOSED and UNTYPED - the flags whose absence the page argues from. flag_legend() now prints the whole glossary, ordered by the flag groups the audit exports, marks the qualifying flags and marks a flag no run emitted as such, and enforces that every flag emitted by either report has an entry. Tested with an invented flag in each report in turn; both exit 1.

    The MF/BP generalisation, in both histories that carry it. The round-4 record corrected the page but the claim also stands in the round-1 record (2026-10-11T125010Z-claude-code-1edc97.yaml), where the appended clause corrected only the NDUFA1 attribution and left the generalisation. It was never true, so it is corrected in place per docs/history.md: ancestry does cross between molecular function and biological process, because GO asserts part_of from transporter activities to the transport processes they carry out, and runoak confirms GO:0015184 reaches GO:0015811, GO:0008137 reaches GO:1902600 and GO:0015650 reaches GO:0015718. What is true is a fact about one pair, GO:0008137 not reaching GO:0006120. The NDUFA1 parenthetical on the page now says the same, and names MT-ND1 in the same table as a row that aligns across aspects by exactly that route.

    Tri-state dirty flags. bool(_git(...)) made a git failure indistinguishable from a clean tree, so a run whose provenance could not be read would have published as a clean one. _dirty() now returns None when git could not answer. Corrected in place per docs/history.md, because the clause that followed was never true: it said "and the page distinguishes the three states", but the renderer still filtered with `if PROV.get(k)`, under which None is falsy and so indistinguishable from False - the recorded distinction was discarded by its only consumer, and a run git could not be asked about still published with no dirtiness clause. Round 8 renders the unanswerable case as its own clause.

    Module flags read from the report. MODULE_FLAGS was a literal in make_page.py that had drifted from the audit's own grouping once PARTIAL_COVERAGE joined it; it is now read from flag_groups.module_sourced, with REASON_REQUIRING_MODULE_FLAGS excluding PARTIAL_COVERAGE. PARTIAL_COVERAGE is now also named in the membership-versus-coverage bullet with its own derived count, and in the module-flag preamble, which says why it obliges no hand-written reason: the covering pairs and the uncovered list in the Modules column already say what a reason would. The distinction is obligation, not importance.

    Also taken. Terms that resolve to no single aspect root are recorded as _aspect_unresolved rather than only counted as failures. The steady branch is split by flag group and its verb corrected. An empty term_aspects was intended to be distinguished from a missing one. Corrected in place per docs/history.md, because that was never true either: load() gated on truthiness, so an empty map was never stored, the == {} branch was unreachable, and a legitimate run matching no pairs was still told its script was superseded - the misdiagnosis the change was made to remove, now with dead code above it. The guard-tampering tests did not catch it because deleting the key and emptying it produced identical behaviour. Round 8 keys both carried fields on presence rather than truthiness. The audit_sha256 guard is unconditional. The unrecorded audit_revision is explained where it is printed, which is the case for a scratch tree the script was copied into; the sha256 in both reports matches the committed align_audit.py, so the script that ran is identifiable even though it was uncommitted at run time. A no-op comprehension in names() is removed. The mid-sentence splice at 2026-10-12T101913Z-claude-code-bea166.yaml:25, where a correction note ran into an unrelated semicolon list, is repaired.

    One error of mine in this round, caught by re-reading the rendered page rather than the source: the new bullet first said the Modules column marks a partially covered module (partial), which it does not - it names the uncovered terms after a dash. It also left the AIFM1 example reading as though it illustrated PARTIAL_COVERAGE, when AIFM1 is the MODULE_NOT_COVERING case. Both fixed, and the flag is named rather than referred to as this flag. A third draft called PARTIAL_COVERAGE the commonest of the three module states, which the counts refute (NO_MODULE_MEMBERSHIP 38, PARTIAL_COVERAGE 14, MODULE_NOT_COVERING 4); the claim is dropped rather than rewritten.

    report.yaml is regenerated from a tree holding origin/main plus all ten slice branches (459 modules, 2910 human reviews), since the alignment-project branch alone cannot produce it. report-branch-local.yaml is the second artifact and both carry audit_sha256 cb2d75e06157, so the comparison guards pass. Every guard was re-tested against a tampered copy: differing sha256, differing row counts, a review-independent flag moving, missing flag_groups, missing term_aspects in either report, an unglossed flag in either report, and a principal module flag with no reason. All nine exit 1; the untampered run exits 0.
