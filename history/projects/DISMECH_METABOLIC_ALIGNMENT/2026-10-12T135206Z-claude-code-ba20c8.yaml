  summary: 'Round 16: keep publication, local presence and the drift answer in their
    own scopes'
  details: |
    Round 16 for PR 4819: three qualifying and seven optional findings, answered in one push. The first is the sharpest of the series: the fix contradicted the reply that proposed it.

    Using cat-file as the primary test put the environment-dependent claim in the committed page that round 14's own reply rejected it for. That reply said the fix is not cat-file, "which answers about the local object store and would have put a claim in the committed page that is false for every reader" - and round 15 then asked cat-file first and published "The primary run's tree (897d012ae) is a commit here", true on the machine that rendered it and false for every reader, one line under the aigr_tree text that says the true thing. The mirror case is worse: both absent branches glossed why the object was missing, as "a tree assembled for that run rather than something committed", which cat-file cannot establish. CI checks out at fetch-depth 1, so a render there finds the branch-local revision absent and would have said that about an ordinary pushed commit - the third appearance of the gloss the adjacent comment forbids.

    The fix is to keep three facts in their own scopes, stated in _rev_state's docstring rather than left to the call sites. Published, meaning reachable from a remote-tracking ref, is environment-independent in its consequence: a revision on no pushed ref is in nobody's clone. Local presence is purely local and licenses computing a diff and no claim whatever about the revision - never about why it is missing, since a shallow clone, a pruned object and a tree never committed are indistinguishable. The drift answer needs the object and, once computed, is a fact about two commits and the same everywhere. The states are published, unpublished, not_here and unknown; the page leads with publication, so the primary bullet now reads "is on no pushed ref, so no clone holds it", which is what round 14 had right.

    The pytest wrapper would have gone red in CI for a reason unrelated to any guard. The untampered case declared the drift clause as its expected string, and that clause depends on this checkout holding the second run's revision, which fetch-depth 1 guarantees it does not. It now declares the flag-count line, which is derived from the reports alone. Verified by pointing the second report at an absent revision and running the case: it passes, and the sentence it renders carries no gloss. test (3.12) was still in progress when the review landed, so this is fixed ahead of the prediction rather than after it.

    A false code comment on a latent path. The comment said the caller appends no period while the caller does, and the two returns added their own, so a local revision would have rendered a double period - latent only because the branch-local revision is published and that clause is empty. The clause is now appended with the period it needs and the docstring states that the caller closes the sentence.

    Seven optional findings, all taken. The unknown entry in the reproducibility map is reachable now that not_here and unknown end the drift answer rather than replacing the clause. The memoization comment claimed each caller asked twice, which was true of neither version; it now says the cache never hits on this run, the two callers asking about one revision each, and exists so that adding a caller cannot multiply git calls. The harness fails loudly on a bare --case and on any unrecognised argument, where "coverage" was silently ignored and 21 cases reported success as though filtered. The one-element loop over the output path is gone. The two glossary cases inject distinct names, so the assertion shows which report's injection fired - the split they exist to prove. And the aigr_tree prose is now compared against the revision the report records: a first draft asserted that every sha in that text must be the recorded one, which the committed text refuted on the next render, since it legitimately names the base commit, ten branch tips and the merge; the invariant is that the recorded revision appears among them, and it is case 22.

    On the suggestion that the wrapper runs all 22 cases on every pytest run: measured rather than estimated, the harness is 15.8s and a single render 0.64s, so the cost is 22 subprocess renders and inherent. Marking it integration would exclude it from the default suite via pytest.ini's addopts, which is exactly the "nothing runs it" state round 14 asked to fix, so it stays in the suite. Re-dumping only the report a case mutated saves about a second; the first version of that optimisation silently reused the previous case's mutation and failed three cases, which the declared-string assertions caught - the harness working as intended on its own author.

    align_audit.py is untouched, so both reports still carry audit_sha256 4fa69f623798. The harness reports twenty-two cases, nineteen that must refuse, and passes; the pytest wrapper passes; no table row changed.
