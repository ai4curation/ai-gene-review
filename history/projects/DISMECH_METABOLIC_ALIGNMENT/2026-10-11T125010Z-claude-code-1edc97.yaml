  summary: 'Review round 1: function-aware module matching and provenance'
  details: |
    Review round 1 for PR 4819. The run behind the page as it now stands has all 161 principal rows clean apart from a module flag, with NO_MODULE_MEMBERSHIP on 26 and MODULE_NOT_COVERING on 4.

    Changes in this round. NO_MODULE conflated 'the gene is in no module' with 'no module covers the function this row aligned on', so a row could read ok while the module shown was about a different activity of the same gene. It is split into NO_MODULE_MEMBERSHIP and MODULE_NOT_COVERING, and the Modules column marks a non-covering module. Membership is now read from the module structure rather than by regex over the file text, so a gene named only in notes or evidence is not counted as a part; coverage reads the module's declared concepts as well as its annotons' terms, because a module states its scope as processes while annotons carry the molecular functions of parts. related() is documented as symmetric and distance-unbounded, and the table prints the core term each node term matched so the ancestry distance behind a match is visible per row. The report records run date, dismech revision, GO release and which ai-gene-review tree was read; report.yaml is committed as the record of the run.

    Four defects in the first version of this change were found by running it rather than reading it, each caught because the page generator now refuses to render a module flag with no stated reason. The module walk had to become recursive, since nodes carry nested parts and variant_sets (FBP1, PEX5, TARS2 and 16 others read as members of nothing). Coverage had to move from the gene's own annoton to the module as a whole, since a module routinely states a subunit's role with a different term from the dismech node's (MT-ND1, NDUFS7, LIPA, LEP). A double-strip in the recursive participant walk discarded every accession reached through a protein complex, so ABCG5, ABCG8, PEX2 and PEX10 read as members of nothing. And coverage had to read module concepts, without which PEX2 and PEX5 were flagged against the peroxisome module that plainly covers them.

    One reviewer example did not hold and was not applied: LIPA in ldl_receptor_mediated_endocytosis was cited as a second MODULE_NOT_COVERING case alongside AIFM1, but that module's LIPA annoton carries GO:0004771 sterol ester esterase activity and GO:0090122, which are the terms the row aligns on, so the module does cover it. AIFM1 is a real case and is flagged. Also recorded as a limitation rather than waived, and corrected in place per docs/history.md because the claim was never true: this record originally stated that is_a/part_of ancestry does not cross between molecular function and biological process, so a dismech node bound to an activity cannot be related to a module scoped to the corresponding process. Ancestry does cross, because GO asserts part_of from transporter activities to the transport processes they carry out; runoak confirms GO:0015184 reaches GO:0015811, GO:0008137 reaches GO:1902600 and GO:0015650 reaches GO:0015718, all of which are alignments in this table. What is true is narrower and is a fact about one pair: GO:0008137 does not reach GO:0006120. NDUFA1 was cited as the row the generalisation rested on, which review round 2 showed to be the wrong diagnosis; the corrected account of that row is in the round-2 record and the correction of the generalisation itself is in the round-4 record (2026-10-12T101913Z-claude-code-bea166.yaml).
