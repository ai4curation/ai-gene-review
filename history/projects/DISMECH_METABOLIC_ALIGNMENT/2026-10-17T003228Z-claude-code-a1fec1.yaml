  summary: 'Round 24: the case written to catch a regression could not catch it'
  details: |
    Two review findings, both on round 23's own additions.

    The species case added last round was vacuous. The harness searches the two rendered files concatenated, and the project page's own frontmatter carries 'species: [human]', so the fragment was satisfied whether or not the sub-page had it - deleting SPECIES_FRONTMATTER from the sub-page write would still have passed. That is the single regression the case existed to catch, so the species fix was still held by nothing but an uncommitted render warning. It is now one contiguous span from the sub-page's title line through its species line, which no other file can satisfy, and verified by negative control: removing SPECIES_FRONTMATTER fails the case. The case was also an unmutated, un-shimmed render identical to untampered, so the span rides on that case and the separate one is gone - 36 cases to 35, with strictly more asserted.

    The positional claim in the ancerr comment was wrong. The two sibling cases are four and five entries up, not four and three; the same sentence naming three intervening cases refutes the figure itself, since the nearer of the two leaves no room for the other at three. The figure came from round 23's review and I adopted it verbatim instead of counting - the same failure the fix it was part of had just corrected, which is that a comment made a false positional claim. It now names the two cases by what they test, merge-base answering 0 and answering 1, so it cannot go stale on insertion and cannot be confused with the third for-each-ref case, which is the fail mode.

    Suggestions 3 and 6 taken: the docstring names the subdirectory the self-check page is written to rather than saying 'beside', since the warning's force is in the path; and the self-check clause now anchors its structural claim to the script sha256 both runs record, so the paragraph reads entirely off recorded fields. Suggestions 4, 5 and 7 were observations the review itself judged correct as they stand.

    Harness: 35 cases, 20 refusals and 15 renders, all behaving as declared, re-runnable with 'just check-alignment-page-guards'; pytest wrapper passes; 'uv run ai-gene-review render-projects projects/DISMECH_METABOLIC_ALIGNMENT.md -o <dir> --verbose' reports no warnings.
