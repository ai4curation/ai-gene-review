  summary: 'Round 4: correct two false explanations and make the comparison a measurement'
  details: |
    Four blocking findings, two of them errors in the explanation round 3 added. First, the page claimed is_a/part_of ancestry cannot cross between molecular function and biological process. That is false: GO asserts part_of from transporter activities to the transport processes they carry out, and runoak confirms GO:0015184 reaches GO:0015811, GO:0008137 reaches GO:1902600 and GO:0015650 reaches GO:0015718, all of which are alignments in this table. What is true is narrower and is a fact about one pair: GO:0008137 does not reach GO:0006120, which is why the NDUFA1 verdict turns on the complex-membership asymmetry alone. The page now says this and also discloses that node MF and BP terms are compared against one pooled set of the review's core molecular functions and directly_involved_in processes, so cross-aspect matching is a real source of alignment that the method text had not mentioned. Second, the page explained MODULE_NOT_COVERING rising from 4 to 7 as a module not being shown to cover a gene whose review is absent. That is backwards: both module flags are computed only inside the branch where a review was found, so a missing review removes a module flag rather than adding one. The driver is the module files, 448 on this branch against 451 in the committed run, which also means the two trees are not nested since this branch has merged main. Third, the branch-local figures were six numbers hardcoded in make_page.py, unverifiable because the run behind them was not committed, unenforced, and written unconditionally so a later re-run would print them as fact. make_page.py now takes an optional second report, derives every figure from it, splits the rises by cause (a flag counting missing reviews rises because reviews are missing; a module flag cannot), exits if the two runs do not cover the same rows, and exits if a review-independent flag count moves. Both guards were tested against tampered copies and exit 1. Without a second report the paragraph is not printed at all, so it cannot go stale once the slices merge. report-branch-local.yaml is committed as the second artifact. Fourth, ALIGNED_CONTRIBUTES_ONLY was listed among the flags that do not read a gene review; it is derived entirely from a review's contributes_to_molecular_function and was identical across the runs only because genes/human/NDUFA1 is present on both trees. The set is now exported from align_audit.py as REVIEW_INDEPENDENT_FLAGS and read from the report, so the page cannot restate it wrongly. Also taken: covering_pairs records which aligned term matched which module term, symmetrically with aligned_pairs, so an earned coverage can be told from one won on a remote ancestor; the shared-node flag's scale is now set by a derived figure, 43 of the 48 principal rows it fires on align on at least one term identical to one of the gene's own core functions. Corrected in place per docs/history.md, because the inference this sentence drew was never true: it continued 'so only 5 are cases where the shared node could carry the verdict', but the 43 was computed on an any-pair basis and so included rows carrying one identical term alongside partner-derived ones. Round 5 split the same data into 31 all-identical, 12 some-but-not-all and 5 none, which makes the answer to that question 17 rather than 5. Nothing about the data changed, only the basis the figure was read on. Resuming the list of changes this round took: the principal-row count no longer says causative and untyped when no untyped row exists; the clean count now names the ALIGNED_NONCORE and ALIGNED_PROPOSED flags it tolerates; the principal and all-row count bases are cross-referenced; and the docstring says four properties rather than two. The round-3 history record's two never-true claims are corrected in place per docs/history.md.
