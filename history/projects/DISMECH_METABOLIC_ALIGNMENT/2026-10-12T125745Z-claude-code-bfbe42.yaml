  details: |
    Round 12 for PR 4819: two qualifying and six optional findings, answered in one push.

    A round-4 ask whose page half never landed. report-branch-local.yaml was named nowhere on the page, though the whole comparison section is derived from it - the fall and rise lists, every movement bullet, the cross-aspect figures and the second provenance line. Round 4 asked for the Method paragraph and the usage block; round 5 did the usage block and reported that accurately, and the page half was simply not done, which six rounds of work on the section it feeds did not surface. The Method paragraph now names it, derived from the path actually passed rather than written in, so it cannot be named when no second report is given.

    Both functions changed in round 11 still documented their pre-change behaviour, and show_rows' docstring defined the scoping round 10 had found wrong - verbatim, including the justification from the within-movement case and silence on the cross-bullet case that was the actual finding. The parameter it described had been removed. cover_evidence still said it named the first such row. Nothing published was affected; the defect is in the code's account of itself, which is what the next round reads first. Both docstrings now describe what the functions do, and why the superseded rule was wrong.

    Six optional findings, all taken. cover_evidence now asserts that it shows every row of the group it describes, exiting rather than printing a cause for two rows and evidence for one - tested by stripping a member's differing coverage, which exits 1. Its per-row break is gone, so a two-module row would show both differences instead of one reading as the whole; inert today, every row in the group being single-module. The MODULE_REASONS display keys route multi-row genes through AMBIGUOUS_SYMS, so HNF1A / HNF4A, SLC16A1 and APOB now carry the entries their flagged rows are in, as the movement accounting does. The weak-check list says five properties and carries the pooled-core-set property as a bullet, so it holds the same five properties align_audit.py's docstring says the page carries rather than being a four-item list beside a five-item claim. Corrected in place per docs/history.md, because the position stated here was never true: this record said the pooled property is the fifth bullet, and it is the fourth on the page and the third in the docstring, whose orders differ. The page's own sentence asserting the same position is removed rather than renumbered, since the ask was that the two lists hold the same properties, not that they be in one order, and a reader of the published page has neither the docstring nor this thread. And AMBIGUOUS_SYMS' scope is stated where it is computed.

    The sixth was the branch-local run's recorded revision sitting four commits behind the branch tip. That is unavoidable rather than a defect - the commit carrying each round's changes comes after the audit that fed it - but it leaves a reader checking the branch out on a different commit from the one the figures were read on. Rather than assert the two trees are equivalent, the page measures it: _alt_drift() asks git whether any file under genes/ or modules/ changed between the recorded revision and HEAD, and says which case it is, or says nothing is claimed when git could not answer. On this run nothing changed, which is what the reviewer had found by hand.

    Twenty-one generator guards tested against tampered reports. Eighteen exit 1, including the new coverage-subset assertion and the duplicate-row refusal. The untampered run and the unresolved-terms and empty-term_aspects runs exit 0. Corrected in place per docs/history.md: this record said twenty, which does not reconcile with the eighteen-plus-three it goes on to name. Round 14 commits the harness as check_page_guards.py, so the count is reproducible rather than asserted - it prints twenty-one cases, eighteen that must refuse. align_audit.py is untouched, so both reports still carry audit_sha256 4fa69f623798 and needed no re-run; no table row changed.
