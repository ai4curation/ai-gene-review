  summary: 'Round 18: split the unknown revision state from absence, guard the drift
    sentences, apply the tree-description check to both reports'
  details: |
    Round 18 of PR 4819, answering the round-17 review: three IMPORTANT findings and five suggestions on the provenance sentences of the alignment page generator.

    Finding 1, the unknown state grouped with not_here. _rev_state returns unknown from three places; _alt_drift_tail can reach only two of them, both in the else branch taken after "git cat-file -e" has already succeeded, so the object is present and the drift answer is computable. The no-repository unknown cannot arrive, because "git rev-parse HEAD" returns earlier. The grouped branch therefore printed "which this checkout does not hold" for the one state that proves the object is held, and skipped a merge-base and diff git would have answered. Demonstrated rather than traced: rendering with a PATH shim whose git exits 129 for for-each-ref and passes everything else through gave, on the committed generator, "recorded at 935e2e6d4, which this checkout does not hold, so the input-drift comparison below was not made", and on this one, "an ancestor of the branch tip, with no file under genes/ or modules/ changed between the two ... so the figures stand for either. Whether that revision is published could not be determined, so nothing is claimed about re-running this elsewhere." unknown now falls through to the drift answer and claims nothing about the object store.

    Finding 2, no harness case covered any drift sentence - the branch CI renders on every run at fetch-depth 1, and the one that carried a double period through rounds 15 to 17. Two cases added for this finding, injecting a revision whose state is the same in every checkout (the round added three cases in all; the third, an EXIT case, is finding 3's, and this figure counted it here - corrected in place per docs/history.md, the paragraph's own list and its "Both" having always said two): a well-formed sha absent everywhere (not_here), and a value that is not a revision. Both declare the clause to its final period and include the trailing newline, because expect is tested by containment and a string ending "either." is satisfied by a page saying "either.." - the exact defect. Checked load-bearing: reintroducing the double period at the call site fails both cases.

    Finding 3, the tree-description guard was primary-only, while the second report furnishes the closer pair - operator-supplied prose at page line 146, the sentence derived from aigr_revision at line 149, three lines apart and agreeing by the coincidence the guard exists to end. Factored into _check_tree_names_revision(which, text, rev), called at import for both reports, and reading ALT_TREE for the second because that is the string the page prints. Distinct refusal messages per report, so a primary-only regression cannot pass the second report case.

    Suggestions taken: the tip return now carries its reproducibility clause, committed-and-unpushed being the ordinary state while a round is prepared (4); _REPRODUCIBLE["not_here"] no longer repeats the absence its preceding sentence states (5); the rev-parse --git-dir probe is hoisted to a module-level _in_repo() asked once per process, rather than cached under a per-revision key (6); a recorded value that is not a sha becomes a fifth state, malformed, with its own sentence in both tails, instead of reading as absence (7). Suggestion 8 is resolved by finding 1: the shallow-clone clause now renders only for not_here.

    Validation: 25 harness cases, 20 refusals, all behave as declared; the pytest wrapper passes; the page is byte-identical to the committed one; align_audit.py untouched, so audit_sha256 4fa69f623798 holds for both reports.
