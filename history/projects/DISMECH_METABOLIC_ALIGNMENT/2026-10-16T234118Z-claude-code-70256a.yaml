  summary: 'Review round 21: publication state, stale self-check page, stale prose'
  details: |
    Covers c8848254e, 3f5d488db, 3e0e11fd7 and this commit, which change curated content after the record in 1d191a70e. That record is left as written: both of its statements were true when made, so they are stale rather than never-true.

    What it said that the shipped tree now refutes: the page and report were regenerated again after 96ab5d0c8, so report.yaml records aigr_revision c8848254e; and the two-run comparison is not dropped but rendered to projects/DISMECH_METABOLIC_ALIGNMENT/audit-self-check.md, from a report-branch-local.yaml re-run over 132532cf6 with the same script as the primary. That second report is the comparison's input, not only a harness fixture.

    This round answers review 5549720646's successor. The page had asserted that its own primary run was on no pushed ref and so could not be reproduced - the single claim the previous round existed to establish, published false. The cause was ordering: publication state is read at render time, and c8848254e had been committed but not yet pushed. Rather than only re-rendering, _rev_state now separates a revision that is this branch's own history and not yet pushed from one that is genuinely unpublished, and the clause for it is true on both sides of the push that follows rendering.

    The self-check page's write carried a comment promising that a stale page would not outlive its input, while the code only declined to write one - leaving the committed copy on disk for render-projects to publish with no link to it. It is now removed when there is no second report.

    Also: the Method paragraph pointed at a comparison section that is no longer on the page; the caveat that reproducing COMPLETE rows needs a tree holding the ten #4690 slices is retired now that all ten are on main; the self-check's closing clause named a table on the other page and an all-slices tree that is now just this branch; the self-check names the primary's answer for audit_dirty where the second run records none at the same script sha256; and check_page_guards.py derives the second report's short revision from the report instead of hardcoding it, which is the coupling that broke those cases when the report was regenerated.
