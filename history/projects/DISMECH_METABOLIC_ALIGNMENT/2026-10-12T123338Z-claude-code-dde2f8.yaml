  details: |
    Round 10 for PR 4819: four qualifying and six optional findings, answered in one push. Three of the four were in code round 9 added, and all four are the same family this PR has been working through - a sentence whose shape is settled before the rows are read.

    A template that converts a hedge into a finding. movement() ended in one unconditional f-string telling the reader the net count was misleading. Five of the nine flags move in one direction only - ALIGNED_NONCORE, ALIGNED_ON_SHARED_NODE_ONLY, AIGR_NOT_COMPLETE, NO_AIGR_REVIEW and NO_CORE_FUNCTION_TERMS - and for those the net is an exact summary: NO_AIGR_REVIEW 61 against 5 keeps all five original rows and adds 56, which is a shift of one population. The sentence is now derived from whether departures and arrivals are both non-empty, and the preamble says the same.

    Reading only one side for review state. move_cause() tested the absent and thin flags on the tree that does not carry the flag, so a row that gained an alignment flag because the review on its own side is a stub read as a substantive difference between the two reviews. Seven of PARTIAL_ALIGNMENT's eight arrivals are that case - ODC1, COX20, HSD17B4, GCK, EBP twice and COQ8B are stubs on the branch tree - and only DNAJC30 is COMPLETE on both, where the reviews genuinely differ. The page held both facts and did not join them, since ODC1 and COX20 appear in the AIGR_NOT_COMPLETE arrivals list eight lines above. The check now reads the flagged side too.

    Where that check sits took two attempts, and the second is the one to keep. Placed before the module causes it reattributed arrivals that had been traced to an absent module, undoing a verified result. A thin review can only change a module verdict by changing the aligned terms, so the stub test now fires only where the term sets differ, after both module causes. HAO1 is the case that fixes the order: same module, identical aligned terms, and glyoxylate_oxalate_metabolism covering GO:0003973 and GO:0046296 here against GO:0003973 there, so its PARTIAL_COVERAGE arrival is the module's own contents and its stub review is incidental.

    An account the data excludes. The steady branch still offered "either a stable property of the dismech side or a path these two runs do not separate" for ALIGNED_CONTRIBUTES_ONLY, which is review-sourced - round 4 removed it from REVIEW_INDEPENDENT_FLAGS for that reason - so the first half was unavailable and the second understated what the reports hold. They answer it: NDUFA1 is COMPLETE here and INITIALIZED on the branch tree, and aligned_via_contributes_to is GO:0008137 in both. The stable thing is the contributes-to term, not the dismech side, and the page now derives that from the two records.

    A justification the input contradicts. The ordinal in row_index()'s key was introduced because a gene can hold several rows inside one entry, citing ABCC8 and APOB. Both hold several rows, each in a different entry, which (entry, gene) already separates; counted over both reports no gene holds two rows in one entry, so the ordinal is always 0 and the keying change is inert. It is kept as a guard and the question is now measured rather than claimed: REPEATED_ROWS records any duplicate and the generator prints a note naming it, verified by injecting one.

    Six optional findings, all taken. The two definitional causes are phrased without naming a side, since they fire for a departure as readily as for an arrival. The last inferred cause is now shown from covering_pairs rather than reached by elimination - TMEM70's mitochondrial_complex_v covers GO:0030674 here and nothing there, HAO1's module covers two terms here and one there. show_rows() caps per cause rather than per side, which makes a small group enumerable - the module-set and module-contents causes this page argues from. Corrected in place per docs/history.md, because the consequence stated here was never true: this record said each group is enumerable instead of being a count with five examples, and six groups on this run exceed the cap of eight and print a remainder ("and 70 more" for AIGR_NOT_COMPLETE, "and 48 more" for NO_AIGR_REVIEW, and four others). The page itself was honest, since show_rows prints the remainder; the reason given for the change was not. Round 11 states the cap as a cap and says why the large groups are not inlined. The strict-subset clause says "by name" and reconciles itself with the row accounting, since provenance.modules records stems and some arrivals are attributed to shared modules whose contents differ. The steady sentence no longer says "(entry, gene)" after the key changed. And the round-9 record's two never-true claims are corrected in place per docs/history.md - the ordinal justification above, and a count of 144 unestablished rows that came from an intermediate generator version no committed artifact records and so cannot be recomputed.

    Nineteen generator guards tested against tampered reports, including an injected duplicate row. Sixteen exit 1; the untampered run, the empty-term_aspects run and the unresolved-terms run exit 0, and the duplicate-row run exits 0 printing the note. No moved row is reported as unestablished. align_audit.py is untouched, so both reports still carry audit_sha256 4fa69f623798 and needed no re-run; no table row changed.
