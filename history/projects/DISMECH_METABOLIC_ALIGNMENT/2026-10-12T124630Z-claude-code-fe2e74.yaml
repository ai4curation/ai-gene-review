  details: |
    Round 11 for PR 4819: two qualifying and six optional findings, answered in one push. Both qualifying findings are about whether a reader can get from a row the page names back to the row in the table.

    Disambiguation scoped to the wrong set. Round 8 asked for a repeated symbol to carry its entry, and round 10 widened that from one side of a movement to both sides - but the set was still computed from the rows of the movement being described, not from the reports. A gene with rows in three entries therefore printed bare wherever only one of them moved, and the same page printed the same symbol both ways: HADH disambiguated as two entries under MODULE_NOT_COVERING and bare two bullets later under PARTIAL_COVERAGE, where it is a third row. GCK printed bare beside EBP's two disambiguated rows while holding two rows itself; APOB and HNF4A the same. AMBIGUOUS_SYMS is now counted over the union of row keys from both reports and gives the 20 symbols a uniq over the reports gives, and cover_evidence uses it too.

    A stated consequence the artifact contradicts. The per-cause cap was described as making each group enumerable from the page. Six groups on this run exceed it and print a remainder - 70 more for AIGR_NOT_COMPLETE, 48 for NO_AIGR_REVIEW, and four others. The page was honest, since show_rows prints the remainder; the reason given for the change was not. It is now stated as a cap, with what it buys (a small group is enumerable) and why the large ones are not inlined. The same claim in the round-10 record is corrected in place per docs/history.md.

    Six optional findings, all taken. An intersection term in cover_evidence's module set was inert and its comment described a union that operator precedence did not produce; it is removed and the comment says what the expression does. The other-side thin check moves below the module causes and behind the same aligned-terms gate as the own-side one, since only the absent case is justified by the audit's control flow - AIGR_NOT_COMPLETE does not short-circuit the module tests - and PEX5 keeps its cause because its terms are absent on the second tree. The definitional message for the review_present_thin group now names both halves, since the group also covers NO_CORE_FUNCTION_TERMS. cover_evidence shows every member of its group rather than returning on the first, so COQ8A's coenzyme_q10_biosynthesis difference is shown beside HAO1's glyoxylate_oxalate_metabolism one instead of being asserted. The rose_mod paragraph no longer asserts a driver for the group and points at the per-row accounting above it, keeping only the shape of the two module sets. And REPEATED_ROWS is fatal rather than a console note: a true duplicate is exactly the case the page cannot disambiguate, since show_rows would print the same entry for both rows, so the accounting would name two rows a reader cannot separate.

    Nineteen generator guards tested against tampered reports. Seventeen exit 1, including the injected duplicate row, which was a note printed to stdout last round and is now a refusal. The untampered run and the unresolved-terms and empty-term_aspects runs exit 0, the last two printing the clause or note that is the point of their branch. align_audit.py is untouched, so both reports still carry audit_sha256 4fa69f623798 and needed no re-run; the page diff is seven lines and no table row changed.
