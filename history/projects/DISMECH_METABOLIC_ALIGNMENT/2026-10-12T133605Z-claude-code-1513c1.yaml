  summary: 'Round 15: separate the drift question from reproducibility, and make the
    guard harness assert its declared messages'
  details: |
    Round 15 for PR 4819: four qualifying and six optional findings, answered in one push. Three of the four are consequences of one over-correction: round 14 replaced a local-object-store test with a publication test, and then used that one boolean to answer three different questions.

    The over-correction itself. _published() was consulted before --is-ancestor, so publication gated the drift question. A revision committed in this checkout but not yet pushed answers the drift question perfectly - the diff is computable - and it rendered as "a tree assembled for that run rather than something committed - so there is nothing to compare its inputs against", both clauses false. Worse, the gloss about what the revision is is the one the adjacent comment, written in round 13, says the function avoids: ten lines below, the not-an-ancestor branch explains that the revision may be an unpushed tree or a commit on another branch and that the knowable fact is only the ancestry.

    The two questions are separable and both answerable, which is the fix. Did the inputs move is a question for the local object store; can a reader reproduce this needs reachability from a pushed ref. _rev_state() now returns one of absent, local, published or unknown, ancestry is tested first so the computable answer is given, and publication is appended as its own clause about reproducibility.

    The second consumer of the same helper treated a git failure as a negative answer. _primary_drift_tail() tested `not _published(rev)`, and None is falsy, so any git failure or absent revision rendered as a confident claim that no clone contains the tree the table was built from. That is the failure-versus-absence distinction this project has drawn in aspect(), the three dirty flags, term_aspects, flag_groups and twice in the drift function, appearing in the round's own second use of its own helper. Each state now has its own sentence, the unknown one included.

    The state the round was written to report could not be reported. for-each-ref --contains exits 129 for an absent object, which _published mapped to None along with every other failure, so in any clone the all-slices revision took the unknown branch and printed the same tooling-failure message that round-13 finding 1 was about, one branch further down - while the docstring listed "absent from this repository" among the states read from git. And the comment introducing the call said the check was cat-file while the helper's own docstring opened "Not cat-file", with the code calling neither. Existence is now asked with `cat-file -e <rev>^{commit}` before reachability, so absent is its own state, and both comments describe what runs.

    The harness asserted only exit status, and nothing ran it. An EXIT case passed when any guard fired rather than the declared one, and an OK case passed whenever the generator exited 0 - so the three OK cases, which exist to prove a clause renders, would have passed with that clause deleted. That is round 8's unreachable-gate lesson at the level of the test, which round 12 had already found once in this project's tampering test. Every case now declares a string: a refusal must carry the message it names, and a render must contain the clause it names. Verified by deleting the empty-term_aspects clause from the generator, which turns that previously-passing case red. Nothing ran the harness either - it was reachable only by typing the command, and being named check_* pytest did not collect it - so there is now a just recipe (check-alignment-page-guards, with a --case filter since each render reads the full 183-row reports) and tests/test_dismech_alignment_page_guards.py, which fails the suite on a regression in any of the eighteen refusals.

    Six optional findings, all taken. _primary_drift_tail() is emitted with the provenance block rather than inside alt_comparison(), which returns nothing without a second report, so the claim about the primary tree now prints in the documented two-argument form too. ALT_TREE_SHORT uses structured fields only - the branch name unless it is literally HEAD, which a detached run records and the provenance block already special-cases, else the short revision - instead of splitting a prose sentence on its punctuation. _rev_state memoizes, so a render asks git twice rather than four times. And the round-14 record's claim that for-each-ref can test existence is corrected in place: it can at the shell, but the code collapsed that exit code and so did not use it.

    align_audit.py is untouched again, so both reports still carry audit_sha256 4fa69f623798 and needed no re-run. The harness prints twenty-one cases, eighteen that must refuse, and passes; the pytest wrapper passes; no table row changed.
