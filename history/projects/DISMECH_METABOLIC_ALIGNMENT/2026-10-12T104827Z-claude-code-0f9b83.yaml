  details: |
    Four blocking findings, three of which landed on report.yaml because round 4 added fields to align_audit.py and re-ran only the branch-local report. The published table renders from report.yaml, so covering_pairs existed for none of the rows the page shows, and report.yaml also lacked review_independent_flags, meaning it came from a superseded script with nothing in its provenance to say so. Rather than document that gap, the combined tree was rebuilt: a scratch git worktree of origin/main at 0222675 with all ten themed slice branches of #4690 merged, which merged cleanly, giving 459 modules and 2910 human reviews. Both reports are regenerated from the same script, so every field is present in both, and the provenance now records audit_revision and audit_sha256 so two reports from different script versions are distinguishable. AIGR_TREE is set on both runs and the usage block documents the real three-argument renderer command, since the two-argument form documented before silently drops the comparison section. The explanation of the risen flags was wrong for 85 of 87 rows. It split the rises into module flags and everything else and told the reader everything else counted absent reviews, but AIGR_NOT_COMPLETE and NO_CORE_FUNCTION_TERMS both fire inside the branch where a review was found, so they count stub reviews present rather than reviews missing. The audit now exports four flag groups keyed on where each flag is appended relative to the review lookup, the page explains each risen flag by its group, and an unclassified flag is named as unexplained rather than inheriting a neighbour's cause. UNTYPED is added to the review-independent set, since it is decided before the review is read by the same definition. The scratch-directory sentence was guarded on aigr_dir not starting with /home, which asserted two things provenance does not record and was false for any ordinary checkout; the heuristic is gone and the page now says plainly when a run recorded no aigr_tree. Nesting is derived from recorded module stem lists instead of inferred from counts: the branch module set is a strict subset of the combined one, 11 modules here and not there and none the other way, where a lower count alone was equally consistent with nesting. Corrected in place per docs/history.md: this paragraph first said the derivation contradicted what both the previous page and the review asserted, which was never true. Those claims were about the earlier 451-module scratch tree, where four named absent modules did imply non-nesting; the rebuilt 459-module tree is a different tree and gives a different relation, so nothing was corrected by the derivation. What it replaced was an inference from counts with a set difference. PARTIAL_COVERAGE is added, since coverage is existential over aligned term by module term and a covered row could leave aligned terms no module reached; covering_pairs and the uncovered terms are now rendered per row, closing the asymmetry with aligned_pairs. The three cross-aspect examples were hardcoded prose and one had become false: SLC16A1 now matches GO:0015650 to GO:0015355, both molecular function, so it is not a cross-aspect row at all. The audit records each paired term's GO aspect and the page derives the figures, giving 29 rows with a cross-aspect pair and 2 where the row has no same-aspect pair, with MT-ND1 named from the data. The shared-node figure is split into rows where every aligned term is self-identical and rows where only some are, because only the identical terms license reading the flag as harmless: 31 of 48 rather than the 43 the any-pair basis gave. Both make_page guards were re-tested against tampered reports and the two new ones exit 1 as well.
