    Suggestions taken. The species frontmatter is one SPECIES_FRONTMATTER constant rather than two literals, so the project page and the sub-page cannot diverge and silently unlink symbols again, and a harness case now asserts the sub-page carries it - the species fix was previously held by a render warning that nothing commits. The self-check clause drops the aigr_dir parenthetical, which printed '.' and identified nothing. rev-parse --verify and cat-file -t are wrapped against FileNotFoundError like the two calls below them. The sub-page's missing maturity is explained where the frontmatter is written. Two drift sentences that no shim mode could reach - the diff failure and the rev-parse HEAD failure - have modes and cases of their own, so every sentence in the drift family is now asserted by some case.

