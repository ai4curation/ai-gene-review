    Three review findings, all on the surface round 22 added.

    Inserting the ancerr case ahead of the solo case put the solo case's five-line comment above ancerr, of which every clause is false: it is not the two-argument form, it deletes nothing, and it checks no deletion. The case guarding the generator's only destructive path was left as the one entry in the set with no comment. Each comment is now above the case it describes, and the ancerr comment's 'the two cases above' is corrected - they are four and three entries up.

