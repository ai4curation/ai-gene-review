  summary: 'Round 3: make the unreproducible-run disclosure checkable'
  details: |
    Round 1 finding 4 and the round-2 note on the unreproducible figure were answered by disclosing that the run cannot be reproduced on this branch. That disclosure was true but closed the question rather than answering it, and the committed report.yaml still records its aigr_dir as a scratch directory that no longer exists, so the provenance named where the bytes sat instead of what they were. The page now says the tree was materialised from the combined branch the ten themed PRs were split from, and reports what the audit produces when run on this branch alone: over the same 183 gene rows, NO_AIGR_REVIEW goes 5 to 61 and AIGR_NOT_COMPLETE 7 to 85 as the absent reviews are counted, the alignment flags fall with them (PARTIAL_ALIGNMENT 46 against 56, ALIGNED_ON_SHARED_NODE_ONLY 25 against 48, NO_MODULE_MEMBERSHIP 28 against 38), MODULE_NOT_COVERING rises 4 to 7 because a module cannot be shown to cover a gene whose review is absent, and the four flags that do not read a gene review are identical. That last identity is the point: it distinguishes missing inputs from a script behaving differently, which the previous wording could not. align_audit.py gains an optional aigr_tree provenance field, recorded from AIGR_TREE, so a future non-checkout run states how its tree was built; make_page.py prints it when present. Both figure sets were recomputed from the two report files rather than quoted, and the page was regenerated from the committed report.yaml, which reproduced it exactly apart from the edited paragraph.
