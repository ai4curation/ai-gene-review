  summary: 'Round 14: test revision availability by reachability from a pushed ref,
    and commit the guard harness'
  details: |
    Round 14 for PR 4819: three qualifying and five optional findings, answered in one push. Two of the three are in the function round 13 rewrote, and the first is a verification of mine that only held on this machine.

    The unknown-commit case, and a verification that was environment-dependent. Round 13 split `--is-ancestor` exit 1 out of the generic failure, which fixes the known-but-not-an-ancestor case. It does not fix the case a reader actually hits: git exits 128, not 1, for a commit the repository does not have, so such a revision still printed "git could not say whether it is an ancestor". The all-slices run records a merge commit the page itself describes as local to that run and not pushed, so no clone contains it. Worse, I reported rendering that example correctly - and it rendered correctly only because the scratch worktree that built the commit left the object in this repository. Run from a clone it takes the 128 path. I had in fact observed that path in round 13, using an all-zero sha, and read it as correct behaviour rather than as the defect.

    The fix is not cat-file either, which answers about the local object store and would have put a claim in the committed page that is false for every reader. The question is reachability from a pushed ref, which is environment-independent: _published() asks `git for-each-ref --contains <rev> refs/remotes` and returns None when git cannot be asked. The states are now unnamed, this branch's tip, not published, not an ancestor, and an ancestor with or without input changes, each with its own message, plus a distinct message per git failure. Also recorded for whoever re-checks this: `git rev-parse --verify <40-hex>` exits 0 for a sha no object matches, so it cannot be used to test existence; `cat-file` can. Corrected in place per docs/history.md: this record also named `for-each-ref --contains`, which does exit 129 with "no such commit" at the shell but whose exit code _published() collapsed into a single None, so the code did not use that distinction and the record described a capability it did not exercise. Round 15 asks `cat-file -e <rev>^{commit}` for existence and reads reachability separately.

    A docstring asserting the premise its own body branches on. _alt_drift_tail's docstring said the recorded revision is "necessarily an ancestor of the branch tip" thirty lines above the branch handling it not being one, and above a comment saying that case is real here. That is the round-11 shape again - a function documenting its pre-change account of itself - and here the account is the assumption the round removed. The docstring now says "usually", says why it is not necessary, and lists the five states.

    A hardcoded claim about the primary run, inside one branch of a function about the second. The sentence saying the primary tree is not a commit here was emitted only from the no-drift branch, so five of six states said nothing; it was asserted while the machinery to measure it sat in the same function; and it would have become false rather than stale once the slices merge and the audit runs from an ordinary checkout. _primary_drift_tail() derives it from PROV's own revision through the same _published() test and is emitted unconditionally.

    Five optional findings, all taken. ALT_TREE is a whole sentence by design, so naming it in two places printed ~190 characters twice and the revision three times; the Method paragraph now takes a short derived form (the branch name) and the full description appears once, in the comparison section, where the coordination no longer attaches to an embedded clause. A dead `if ALT_PATH else ""` is gone. The tip test compares the full revision, both reports recording forty characters, rather than a prefix disjunct nothing could reach.

    The last was the guard counts in these records being unverifiable from the tree, and the arithmetic not reconciling across rounds - the same class as the "144 unestablished" figure corrected out of the round-9 record. check_page_guards.py is now committed: it breaks one thing in a copy of each report, renders, and checks the generator refused where a refusal is declared and still rendered where the branch is a legitimate state. It prints twenty-one cases, eighteen that must refuse, and exits non-zero if any case behaves otherwise. The round-12 record's "twenty" is corrected in place, since eighteen plus three does not make twenty.

    align_audit.py is deliberately untouched - naming the harness in its usage block would have changed its sha256 and invalidated both reports' audit_sha256, for a reference that belongs to the generator - so both reports still carry 4fa69f623798 and needed no re-run. No table row changed.
