  summary: 'Round 6: define the new flag, fail loudly on aspect lookups, and surface
    the audit identity'
  details: |
    Four blocking findings. PARTIAL_COVERAGE was published on 14 table rows and in the summary counts while being defined nowhere, because the flag legend was hand-written prose carrying its own arithmetic about an older vocabulary. The legend is now generated from a glossary keyed on flag name, lists only the flags the run emitted, marks the qualifying ones, and exits if the run emits a flag with no entry - which was verified by injecting one. The aspect lookup swallowed every exception and recorded nothing, so an unavailable GO adapter would empty term_aspects and the page would print that no matched pair crosses the aspects, turning a lookup failure into a finding in the one paragraph round 4 had converted from prose into a measurement. It now collects failures and aborts in aggregate as the ancestor lookup already did, and the renderer exits when either report lacks term_aspects. The audit identity was recorded but neither rendered nor compared, and the printable half was null: the provenance block now prints the script sha256 and its last commit, alt_comparison exits when the two reports' hashes differ, which is the exact check the field-presence tests were a proxy for, and the run records whether the audit script, the ai-gene-review tree or the dismech tree had uncommitted changes. Both committed reports now disclose audit_dirty and aigr_dirty as true, which is accurate and was previously invisible: the recorded revisions name commits that are not what ran, because the script was edited after them. The round-4 history record's shared-node inference was corrected in place per docs/history.md, since it was never true: 43 of 48 was computed on an any-pair basis, so the claim that only 5 rows could have the shared node carrying the verdict understated it; the same data splits into 31 all-identical, 12 some-but-not-all and 5 none, making the answer 17. The round-5 record's framing was corrected in place for the same reason - it said the strict-subset derivation contradicted what the previous page and the review asserted, but those claims were about the earlier 451-module scratch tree, where four named absent modules did imply non-nesting; a rebuilt 459-module tree is a different tree and gives a different relation, so the derivation replaced an inference from counts with a set difference rather than correcting anybody. Also taken: the falls are now explained by group as the rises are, with the module-sourced flag's fall marked as not distinguishing the review cause from modules having been added; a flag identical across both runs is named rather than silently absent from both lists; the cross-aspect figures say they are over all rows rather than principal ones; covering_pairs holds pairs and the renderer formats them, so the uncovered set no longer comes from re-parsing a display string; the obsolete tolerance for reports missing the newer keys is gone along with the comment that justified it; and the docstring says five properties above its five bullets. AIGR_TREE now names the ten slice branches by name rather than describing the rebuild.
