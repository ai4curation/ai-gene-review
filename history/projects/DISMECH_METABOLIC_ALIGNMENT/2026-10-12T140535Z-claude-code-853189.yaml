  summary: 'Round 17: give the drift sentence sole ownership of its punctuation, and
    stop reporting a git failure as absence'
  details: |
    Round 17 for PR 4819: three qualifying and six optional findings, answered in one push.

    The double period, which round 15 raised, round 16 claimed to fix, and round 16's own verification rendered. The caller still appended a period and every non-empty reproducibility clause ended with one of its own, so three of the four states produced two - including not_here, which is what CI and any shallow clone get. Worse, the docstring round 16 added to fix it asserted the opposite of what three of its returns did, and a comment forty lines below accounted for base's period and not the clause's, so code, docstring and comment disagreed three ways. The function now owns all of its punctuation including the final period and the caller appends nothing; verified by rendering each state and reading the last characters.

    How it survived is the part worth recording. Round 16 verified the not_here branch by pointing the second report at an absent revision - the right test - and then read the result with cut -c1-240, which truncates the sentence before its end. The double period was on screen and outside the window I looked at. Checking a string's content by inspecting its prefix is the same error as checking a claim by re-reading the intention behind it, which is what this review thread has been about from the start; it simply moved from the claim to the evidence.

    A git failure folded into a fact. cat-file -e exits 128 both for a missing object and for "not a git repository", so the two were indistinguishable and both became not_here, which prints "which this checkout does not hold" and "is not in this checkout" - claims about an object store from a run that had no repository to ask. unknown existed for exactly this and was unreachable from that branch. One rev-parse --git-dir now settles it, and the for-each-ref call is wrapped too, so git missing from PATH no longer raises an uncaught FileNotFoundError through _primary_drift_tail, which called _rev_state with no guard of its own. Verified by rendering from a directory outside any repository: the drift sentence reports that git could not be asked, and the primary bullet reports that publication could not be determined, neither claiming anything about the object store.

    The harness wrapper hardcoded the count the harness exists to replace, and did so in the round that added the 22nd case - 18 of 21 where CASES is 19 of 22. The wrapper now states no count at all, since the harness prints its own, and the stale in-file comment quoting 21 is gone.

    Six optional findings. The sha regex now requires a digit, so a 7-to-40 character run of a-f that is an ordinary word (defaced) no longer makes the guard refuse to render over a provenance mismatch that does not exist. The not_here sentence is scoped to the input-drift comparison, which was reading as though the whole section had been skipped while the movement bullets below it come from the reports. _rev_state's docstring records that reachability cannot be computed without the object, so unpublished is obtainable only where the object is local and a reader re-rendering in a shallow clone gets the weaker sentence - a limit on the claim's availability, not its content. The one clause that names a cause, the shallow-clone note, is marked as admissible because it is about this checkout, which is observable, rather than about the revision. And the aigr_tree case now mutates the prose rather than the revision, so it exercises the regex as well as the comparison.

    One suggestion is declined with a measurement. The deep comparison that decides whether to re-dump a report was described as more expensive than the work it saves; measured on these reports it is 0.1 ms against 147.6 ms for one safe_dump, three orders of magnitude cheaper, which the end-to-end timing also showed (15.8s against 16.7s). Declaring per case which report it mutates would also be a second source of truth for something derivable from the mutation itself, which is the shape this project has removed repeatedly. The comparison stays, with the measurement recorded beside it.

    No table row changed and the page's own text is unchanged this round: the committed page's second-run revision is published, whose sentence was already correct, so every fix here is to states a reader reaches elsewhere. align_audit.py is untouched, so both reports still carry audit_sha256 4fa69f623798. The harness reports twenty-two cases, nineteen that must refuse, and passes; the pytest wrapper passes.
