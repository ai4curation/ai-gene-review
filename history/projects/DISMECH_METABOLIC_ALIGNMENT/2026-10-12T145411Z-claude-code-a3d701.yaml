  summary: 'Round 20: make the shim cases independent of the checkout, separate a
    present non-commit from an absent object, and stop the tree guard refusing a recorded
    ref'
  details: |
    Round 20 of PR 4819, answering the round-19 review: three IMPORTANT findings and six suggestions.

    Finding 1, a CI regression introduced by the two cases that answered round-18 finding 2. Both declared "an ancestor of the branch tip, with", a fragment produced only after _rev_state resolves 935e2e6d4, which is four commits back on this branch and absent in the fetch-depth 1 clone the test job uses - so rev-parse --verify failed, the shim interception was never reached, the absence sentence rendered, and both cases failed. The clone dependence round 16 removed from the untampered case, reintroduced one layer down. Demonstrated rather than reasoned: a fresh repository holding one empty commit and the project directory, where 935e2e6d4 does not resolve, fails both cases on the round-19 harness ("rendered page does not contain an ancestor of the branch tip, with") and passes all thirty on this one. The shim now stubs all four questions the drift sentence asks - rev-parse --verify, for-each-ref, merge-base --is-ancestor and diff --name-only - delegating rev-parse --git-dir and rev-parse HEAD, so what the cases assert is the generator assembly of the sentence from git answers rather than git answers themselves, and the rendered figure is deterministic. Each clause is therefore declared as one whole string, and the tuple-of-substrings support added last round is removed, having no remaining user.

    Finding 2, the blob-or-tree edge was claimed separated and was not. "rev-parse --verify <sha>^{commit}" exits 128 for an object the checkout holds that is not a commit exactly as for an absent object, and the distinguishing reason was on stderr, which the code discarded - so both still rendered "which this checkout does not hold", false of the one case git can name exactly. git is now asked rather than its stderr parsed: on failure, "cat-file -t <rev>" reports the type of anything in the object store, giving a not_a_commit state whose sentence names the type ("which this checkout holds as a blob rather than a commit"). The type is carried in the memo rather than in the state name, so the two sentence tables stay keyed on a closed set and a new state raises rather than rendering blank. The round-19 record claim is corrected in place per docs/history.md lines 167 to 171, having never been true.

    Finding 3, a recorded ref refused to render. _check_tree_names_revision compared the recorded value against the shas named in the tree description, and a ref satisfies neither startswith direction, so the generator exited on exactly the input finding 1 of round 18 established as the expected operator slip. The comparison is now confined to a recorded sha, which keeps the case the guard was written for - a short abbreviation is still compared - and the HEAD~3 render now works against the committed tree description rather than only against a sha-less one. That gap is corrected in place in the round-19 record too.

    Suggestions taken, all six: the not_here/unresolvable split requires a digit, as the tree-description guard already did, so "defaced" no longer reads as an object the checkout lacks (4); merge-base and diff are given the resolved sha, like for-each-ref (5); the shallow-clone cause-naming is no longer contradicted, because the present-object case it was false for is now its own state (6); the operator-supplied value is sanitised before being interpolated into a backtick span, a backtick becoming an apostrophe and a pipe a slash, so "we`ird|value" renders as "we-ird/value" rather than breaking the span (7); _RESOLVED is gone, the state and the resolved sha now sharing one memo key read through _resolved() (8); and the shim matches the subcommand in "$1" rather than "for-each-ref" anywhere in argv (9).

    Three harness cases added for the new branches: a recorded ref against the committed tree description, an object present but not a commit (HEAD^{tree}, which exists wherever HEAD resolves, so the case depends on no particular file), and an a-to-f word.

    Validation: 30 harness cases, 20 refusals, all behave as declared, both in this checkout and in a repository holding one empty commit; the pytest wrapper passes; the page is byte-identical to the committed one; align_audit.py untouched, sha256 4fa69f623798.
