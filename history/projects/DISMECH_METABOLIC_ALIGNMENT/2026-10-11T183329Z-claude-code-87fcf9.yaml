  summary: 'Review round 2: show the unaligned half, and separate contributes-to and
    shared-node matches'
  details: |
    Review round 2 for PR 4819. Three of the four findings are the same shape: the test was weaker than the page said it was, in a way the page's own disclosure section did not cover.

    The unaligned half of each row is now rendered. The audit already computed dismech_only, the node terms that matched no core function, and the page dropped it, so 56 of 161 principal rows showed only their matches and read as full agreement where agreement was partial. There is now an 'Unaligned node terms' column, a PARTIAL_ALIGNMENT flag, and a summary paragraph giving both counts (105 rows align every node term, 56 align some). LCT is the worked case: it aligns GO:0000016 lactase activity and leaves GO:0006366 transcription by RNA polymerase II unaligned, because the hypolactasia mechanism is the regulatory element that switches the gene off and transcribing its own gene is not a function of lactase. A partial row is usually not a defect in either repository, which is why it is printed rather than flagged as an error.

    A dismech node binds its GO terms at node level and may name several genes, and dismech has no per-gene attribution inside a node, so a term on a shared node is read for every gene on it. The committed report showed this from its own data: GLUD1 carried HADH's GO:0004857 enzyme inhibitor activity and HADH carried GLUD1's GO:0004353 glutamate dehydrogenase activity, mirror images from the single hyperinsulinism node that names both. Restricting a term to its own gene is not possible from the data, so the provenance is tracked instead: shared_node_terms records the terms a gene holds only because a partner shares its node, the table marks them, and ALIGNED_ON_SHARED_NODE_ONLY fires where every term a row aligned on came from a shared node (48 rows). Here both directions happen to be right, since HADH does inhibit GLUD1, which is why the case needs marking rather than trusting.

    contributes_to_molecular_function was folded into the core molecular-function set, so a complex-level activity aligned to a subunit the review says only contributes to it. It is now compared alongside core MF rather than inside it: excluding it would lose real agreement, because a subunit contributing to an activity is doing what the dismech node describes, but it is a weaker claim, so such a match is marked and ALIGNED_CONTRIBUTES_ONLY fires where a row's whole alignment rests on one. Exactly one row does: NDUFA1.

    That also corrected the stated reason for NDUFA1's MODULE_NOT_COVERING flag, which was wrong. The page blamed the MF/BP aspect divide. The real cause is an asymmetry about complex membership: the review's contributes_to GO:0008137 is accepted, while complex_i_accessory_subunits says the identical relation the GO-idiomatic way by giving its NDUFA1 annoton GO:0005198 structural molecule activity as part of complex I, and GO:0005198 does not relate to GO:0008137 by is_a/part_of - verified with the GO adapter, along with the fact that neither reaches GO:0006120. The module is still the right one and the row is still flagged; only the explanation changed. The same wrong account in the round-1 record is marked there as superseded by this one.

    The '148 of 161 principal rows' figure in the CREATE record 2026-10-11T013627Z-claude-code-9203cf.yaml is corrected in place rather than by another appended record. docs/history.md covers this case directly: a figure that was never true has no earlier state to preserve, so appending leaves a falsehood in the chain. The reason for the miscount is kept in the corrected text, PR 4819 is added to that record's links.prs, and the correcting paragraph is removed from the round-1 record, which no longer needs to carry it. Only target.slug and target.path are frozen, and neither record has been merged.

    Nine suggestions taken. homolog_of is read by the participant walk, and the dead branches for annoton inputs/outputs and a protein complex's components are removed, since ModuleAnnoton has only function/processes/locations and ProteinComplexDescriptor only active_units. The structural-versus-textual accession counts are emitted into the provenance block instead of being quoted as a one-off measurement a reader cannot reproduce. The module-flag section no longer conflates the two flags, naming each gene's flag and marking a row that is not causative, which is what UCP2 is. '(not covering)' prints only where MODULE_NOT_COVERING fires, not on rows whose other module is simply about their other function. The unused-reasons check compares against flagged genes rather than every gene in the report, and hard-fails like the missing side. A node term matching several core terms shows all of them rather than the alphabetically smallest. The HGNC symbol table is parsed with the csv module. The genes: frontmatter lists only genes matched to a review, so modifier and susceptibility genes with none do not inflate the project's gene count. Module names in the Modules column link to their rendered pages.

    The audit was re-run over the same two trees the committed report records, so the report and page are regenerated rather than hand-edited. It still cannot be re-run from this branch alone, because most of the reviews and modules it reads are added by the other themed PRs split out of 4690.
