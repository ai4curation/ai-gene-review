  details: |
    Round 9 for PR 4819: three qualifying and five optional findings, answered in one push.

    The qualifying findings were the same defect round 7 raised, surviving in the two branches flag_rows() had not been applied to, plus the round-8 tri-state fix stopping one state short.

    Explaining a movement from a net count. flag_rows() was applied only to the steady branch, so the fell and rose branches still asserted a single cause from the net. NO_MODULE_MEMBERSHIP's fall of 10 is 24 departures against 14 arrivals over 14 shared rows, and the 14 arrivals are not review-skipped rows at all - ABCG5, ABCG8 and POMC among them carry complete reviews on this branch and gained the flag because a module containing them is one of the eleven absent. The hedge that followed named the wrong alternative, offering that a module flag can also fall because modules were added, when the second tree has strictly fewer modules and what removing them did was add rows.

    Attributing a row's movement to the flag's group. The clause appended to the PARTIAL_COVERAGE row-set split said a differing module set is what moved the rows. Of the five departures only COX4I2 and ABHD5 moved for that reason: PEX5's covering module is present on both trees and it leaves because its review is a stub, while MC4R and LIPA carry NO_AIGR_REVIEW and the audit returns before any module test runs. Group membership says where in the audit a flag is computed, not why a given row moved.

    Both are fixed by the same change, which is the one the reviewer named: the movement accounting is now per row for every flag, not only for the steady ones. row_index() keys each gene row by (entry, gene, nth occurrence). Corrected in place per docs/history.md, because the reason given was never true: this record said a gene can hold several rows inside one entry and cited ABCC8 twice and APOB three times. Both do hold several rows, but each in a different entry - ABCC8 in Congenital_Isolated_Hyperinsulinism and Hyperinsulinemic_Hypoglycemia, APOB in three - which (entry, gene) already separates. Counted over both reports, no gene holds two rows in one entry, so the ordinal is always 0 and the keying change is inert on this data. It is kept as a guard against a future duplicate collapsing two rows silently, and round 10 records REPEATED_ROWS so the question is measured rather than claimed in a comment. move_cause() reads the row's own record on both trees in the audit's own control-flow order: a flag that counts absent or thin reviews is its own explanation, then an absent review on the other tree, then a thin one, then a differing module set, then a differing aligned-term set, then differing module contents. Every moved row on this run now has an established cause, where reading only the other side's flags left an arrival at a review-absence flag unexplained. Corrected in place per docs/history.md: this record gave that count as 144, which came from an intermediate version of the generator that no committed artifact records, so it cannot be recomputed and should not have been stated. The checkable claim is the one the committed page carries - no moved row is reported as unestablished. The page states the shared count, the departures and the arrivals with their causes, for each of the eight flags that move and for PARTIAL_COVERAGE whose total does not.

    The dirty-flag renderer conflating a recorded null with an absent key. PROV.get(k) returns None for both, so a report produced before these fields existed would have published a confident claim about a git failure that never happened - the absent-versus-empty distinction round 8 applied to flag_groups, term_aspects and aspect_unresolved, not applied to the three fields the provenance argument rests on. Four states now render separately, and where the companion run answers the same question for the same audit_sha256 the page says so rather than leaving "not established" standing beside a report that holds the answer.

    Five optional findings, all taken. The module-count clause now reads its own direction instead of printing "so fewer are available" unconditionally. show_rows() disambiguates a repeated symbol across both sides of a movement rather than within one side. A detached checkout no longer renders as "(branch HEAD)". The round-8 record's LIPA attribution is corrected in place per docs/history.md, since it reproduced the page's wrong reason. On aspect_unresolved's rendering branch being untestable on this run: it is exercised, by a tampered report carrying two unresolved terms, and it renders the clause and exits 0 - which is the answer the empty-term_aspects case did not have in round 8, when deleting the key and emptying it were behaviourally identical.

    Nineteen generator guards tested against tampered reports. Sixteen exit 1; the untampered run, the empty-term_aspects run and the unresolved-terms run exit 0, the last two printing the clause that is the point of their branch. The four dirty-flag states were each rendered from a tampered provenance block and print distinctly. Both reports carry audit_sha256 4fa69f623798 and no table row changed.
