  summary: 'New project: evaluate eggNOG-mapper 2.1.13 GO transfer on 520 reviewed
    proteins'
  details: |
    Created the eggNOG-mapper evaluation. Ran emapper 2.1.13 (DB 5.0.2, defaults) on a seeded, organism-stratified cohort of 520 completed reviews, in three runs: default; own species excluded; own species excluded with experimental GO evidence only. eggnog.db (41 GB) was served from a zstd-chunk store through a read-only SQLite VFS (byte-identical; length matched the SQLite header). Found and patched an emapper bug: normalize_target_taxa omits the named taxid itself, so --excluded_taxa 9606 kept human records. Scored predicted leaf terms (leaf reduction over GO 2019-07-01, 2020-12-08 and 2026-03-25) against review support/downgrade/reject sets and core_functions recall; removals of root/binding placeholders are not counted as rejections. Manually adjudicated (AI reviewers) 80 sampled leaves from the species-excluded run with the COR/LSP/UNC/PLI/NPI/REP scheme.
