  details: |
    Response to the ai4c-reviewer findings on PR #5030. Scoring now reads reviews and GOA at a pinned commit (b9da9839c, --reviews-at); rescoring at that snapshot reproduced all earlier numbers. UNDECIDED rows form their own category (44 of 586 former DOWNGRADED leaves in the default run). Cohort builders and scorer reject duplicate accessions, removing 3 double-counted P. putida proteins from the deep dive (847 proteins). Adjudication rates are reported by drawn stratum (round-1 UNRELATED 22/40 wrong, 6/40 correct), with 8 recategorised claims tallied separately; Hspa5 UNR-35 reassessed COR->LSP; rat Tp53 corrected. Caveat added that --excluded_taxa leaves the seed ortholog unblinded (species-excluded numbers are an upper bound). Blinded re-check of the 43 claims drawn as REJECTED plus 43 distractors: wrong rate 65% -> 67%, agreement 91%, Cohen's kappa 0.84. zchunk store verified byte-identical to eggnog.db by SHA-256. VFS uses os.pread; HOMOLOGY_PROPAGATION table row added.
