  details: |
    check_rule_tm_segments.py used [^T]*? to read a TRANSMEM feature, which stops at any capital T (a note such as Name=TM1) and would drop the segment. Fixed with a non-greedy match up to the next TRANSMEM entry, plus a doctest that fails on the old pattern. The rerun gave the same 141,582 segments and a summary identical to rule_tm_summary.yaml. The MF_01944 row now cites UniProt P24205's SUBCELLULAR LOCATION line (Cell inner membrane, ECO:0000269 from PubMed:9099672) instead of the abstract-only paper. The MF_01093 row, its review link and the mtrA2 genes entry are marked pending until PR #7088 merges, and the pattern number is dropped because main now uses 24.
