  summary: Add UniProt-literature isoform mismatch cases and a recording proposal
  details: |
    Added a section listing two cases where UniProt's isoform record disagrees with the literature: SYNGAP1 (the alpha1 PDZ-ligand C-terminus is absent from Swiss-Prot Q96PV0) and RASAL2 (phosphosite numbering follows non-displayed isoform Q9UJF2-2). Added both genes to the project gene list. Proposed, without implementing, schema support: non-Swiss-Prot mapping types for functional_isoforms, a MISSING_ISOFORM source defect reportable to UniProt, and a numbering_isoform field for residue-bearing statements.
