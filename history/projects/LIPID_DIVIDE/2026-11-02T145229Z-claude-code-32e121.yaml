  summary: Create LIPID_DIVIDE project page (scoping)
  details: |
    Created projects/LIPID_DIVIDE.md at maturity SCOPING from García-Domínguez & Devos 2026, Prokaryotes bridging the lipid divide (FEMS Microbiol Rev, PMID:42965973, doi:10.1093/femsre/fuag056), read from the accepted-manuscript PDF supplied by the user. Summarised the four parts of the divide and the bacterial exceptions, and set out GO angles: missing G1P acyltransferase MF terms (Rieche et al. 2026, PMID:42286214), missing archaeal-type/membrane-spanning lipid process terms (OLS searched), and a suspect GO:0000107 PANTHER IEA row on F. johnsoniae GGGPS A5FJK8. Listed 12 review targets in three parts; all accessions checked against UniProt REST (reviewed entries) and current GOA rows pulled from QuickGO. Deferred Mss, Tes, ElbD and the archaeal cardiolipin synthase for lack of confirmed reviewed entries. Added a card under Archaeal Projects in pages/projects/index.html.
