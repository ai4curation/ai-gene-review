  details: |
    Rechecked the Reactome gap-filling project page against the human ABCD3 review, the cached R-HSA-382575/R-HSA-1369062 Reactome summaries, and ABCD3 support from PMID:25168382, PMID:24333844, PMID:34564857, and PMID:39223112. Kept ABCD3 as the one pilot review, preserved the corrected 81-annotation count, and retained #4008 as the tracker for moving from the proof of concept to a systematic black-box-event inventory.

