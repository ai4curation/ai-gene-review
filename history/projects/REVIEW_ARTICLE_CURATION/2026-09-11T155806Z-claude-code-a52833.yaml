  summary: 'Scope project: review-article vs primary-literature curation'
  details: |
    Created projects/REVIEW_ARTICLE_CURATION.md scoping an experiment on whether a review article supports as much curation as the primary literature it summarizes, and whether it is cheaper to curate from. Re-analyzes the REVIEW_ONLY blind-ablation rows from EVIDENCE_SOURCE_SUFFICIENCY (4 of 7 available-source failures are granularity complaints; 22 of 29 assignments had no review available at all) to argue the prior 14.3% figure measures artefact/document granularity mismatch rather than review information content. Design proposes review-anchored sampling at gene/family/module tiers, a five-arm ablation including a parametric-memory floor arm, union adjudication, ontology-aware structural scoring, and separate cost metrics. No curated gene or module content changed.
