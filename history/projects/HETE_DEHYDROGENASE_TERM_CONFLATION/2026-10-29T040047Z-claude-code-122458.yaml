  summary: Document the GO:0097265 term conflation found during the CYP4F3 review
    and recommend repair
  details: |
    Created projects/HETE_DEHYDROGENASE_TERM_CONFLATION.md. GO:0097265 '5(S)-hydroxyeicosatetraenoic acid dehydrogenase activity' carries two mutually inconsistent readings: its label, three synonyms, GO:0016616 (NAD(P)-acceptor) parentage and defining xref PMID:1326548 describe a microsomal NADP+-dependent 5-HEDH oxidising 5(S)-HETE to 5-oxo-ETE, while its definition formula and RHEA:48656 xref describe a CYP4F omega-hydroxylation of 5-HETE to 5,20-diHETE. QuickGO term history (GO release releases/2026-09-27) dates the split to a single 2026-04-12 edit that deleted the dehydrogenase definition and added the omega-hydroxylation formula plus RHEA:48656, leaving label, synonyms and parentage untouched. Only two annotations exist (CYP4F3 9606, Cyp4f1 10116), both IEA via GO_REF:0000116 rhea2go, so no experimental annotation is at risk. Recommends repair rather than obsoletion: revert the definition, drop the RHEA:48656 and PMID:9675028 xrefs, and re-point RHEA:48656 in rhea2go to GO:0102033. Added the project card to pages/projects/index.html and rendered the page.
