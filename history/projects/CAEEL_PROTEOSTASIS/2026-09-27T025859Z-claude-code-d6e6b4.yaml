  summary: Correct DAF-21 'second HSP90 paralog' claims in CAEEL_PROTEOSTASIS sub-pages
  details: |
    CAEEL_PROTEOSTASIS-pathway.md section 1.5 described DAF-21 as a second C. elegans HSP90 paralog with UniProt P41887. That was never true: P41887 is the fission-yeast HSP90 Swo1 (HSP90_SCHPO), and daf-21 is a synonym of hsp-90 (Q18688, WBGene00000915). I replaced the section with a short correction pointing to the HSP-90 section 1.4. I also merged 'hsp-90, daf-21' mentions into one gene, removed the duplicate daf-21 row from the protein-binding table, and updated the daf-21 row in CAEEL_PROTEOSTASIS_CURATION_RECOMMENDATIONS.md to say the duplicate review was retired. The top-level projects/CAEEL_PROTEOSTASIS.md has the same error (it lists daf-21 as P41887 and as an HSP90 paralog), but it is under an open project-docs PR, so it was left unedited and reported.
