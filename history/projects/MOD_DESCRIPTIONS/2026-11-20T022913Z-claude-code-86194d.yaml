  details: |
    Added the slide deck presented at the Alliance Gene Descriptions call (Nov 2026) to manifest.slides. The deck covers GO curation as synthesis of multiple lines of evidence (IBA, GO-CAM), GO as a changing knowledge base, over-annotation (human ALAD), the AIGR workflow and action taxonomy, the SK example (automated text repeating the removed photoreceptor activity annotation), agent-as-a-judge scores of MOD, UniProt and Alliance automated descriptions, curated-text defects, and the take-home that agentic curation, GO synthesis and description authoring are one job. No curated review content was changed; corpus counts on the slides were computed from main on 2026-11-18.
