  summary: Establish fly ProtNLM census and 41-gene review cohort
  details: |
    Fetched all 94 published NCBITaxon:7227 prediction records and ordinary UniProt records, preserving raw evidence metadata and exact sequences. Resolved every entry to a distinct current FlyBase Dmel gene via the frozen FB2026_02 identifier table. Included all 41 GO/function records (50 GO claims and 13 function paragraphs) in the initial review cohort; retained 29 location/keyword-only records as a separate tier and 24 name-only records in the inventory. Added reproducible fetch/summarization scripts, snapshot checksums, a prioritized review queue and linked project page. Started exact-accession reviews of Lcp3, ftz-f1 and Ank2 using fly-focused research. Confirmed raw checksums, identifier uniqueness, cohort membership and preserved statement counts.
