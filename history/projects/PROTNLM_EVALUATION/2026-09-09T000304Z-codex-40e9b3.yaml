  summary: Review three fly serine-protease hypotheses with catalytic and isoform
    checks
  details: |
    Added reviewed CG43124, CG4793 and CG34171 cases to the fly page. All three positive ProtNLM serine endopeptidase predictions are NPI and conflict with current NOT GO annotations. Independent controlled alignments support two catalytic substitutions in CG43124, loss of the catalytic serine in CG4793, and loss of the serine-bearing region in native short CG34171-PC rather than the substitution present in longer PB. Preserved distinctions between intrinsic activity and biological-process participation, including experimentally supported CG4793 immune regulation. Added a coverage checker preserving exact accessions, GO IDs/labels, original function paragraphs and annotation polarity; it reports authored NEW proposals separately from existing GOA rows. Cohort coverage is six genes, six GO predictions, two function paragraphs and 50 existing GOA rows reviewed. Each gene has primary/source evidence, reproducible controls, provider research and its own history record.
