events:
- type: CREATE
  outcome: changed
  summary: 'Scope project on GO ''X production'' terms: readouts vs mechanisms'
  details: |
    Created projects/PRODUCTION_TERMS.md with a reproducible inventory script (scripts/inventory.py) over go-edit.obo (go-ontology main 06e2261), all gene reviews and gocams/index.tsv. Found 430 live production-named terms (137 production, 293 regulation; 116 production terms do-not-annotate) and 45 obsolete ones, and 1,236 review rows in 304 genes. Surveyed 59 go-ontology issue threads on production, biosynthesis and secretion terms and verified the 25 quotes used on the page against the threads. Analysed the terms from first principles: most read out shared signalling programmes, and a minority (IL-1 family processing, TNF shedding, TGF-beta activation, cytotoxic granules, interferon induction, immunoglobulin) rest on dedicated machinery; proposed one module per machine. Listed candidate upstream GO tickets (six unflagged cytokine production terms, a mis-leveled fractalkine merge) without filing them. No gene review or module edited.
- type: EDIT
  outcome: changed
  summary: Add GO-CAM usage analysis to the production terms project
  details: |
    Extended scripts/inventory.py to read the 35 cached GO-CAMs that place an activity on a production-named term and write data/gocam_models.yaml. Added a page section: 21 type I interferon models file every signalling step under a regulation-of-production term and only 4 name an interferon gene (IFNB1 as IRF3's input); 4 of the 10 'cytokine production involved in inflammatory response' models name the cytokine by an edge to its activity; 33 of 35 models are UniProt's. Recorded that the CHRNA7-STAT3 model already routes through ZFP36 (AU-rich mRNA decay) and that two XBP1 models use GO:1903409 (open obsoletion #23668). Reordered the module plan to put the IRF3/IRF7 interferon-induction arm first, and corrected an unverified claim that ADAM17 shedding and AU-rich decay covered the most existing review rows.
- type: EDIT
  outcome: changed
  summary: Link the first module from the production terms project
  details: |
    Promoted the IRF3/IRF7 interferon-induction arm from a module candidate to modules/irf3_irf7_interferon_induction.yaml, linked it from the mechanism table and the modules section, and ticked the first module in the plan. Recorded the follow-ups the module exposed: no gene reviews for MAVS, IRF7, IKBKE, TBKBP1 or CHUK; the AZI2 review's core function carries no GO id, so the module's molecular adaptor activity assertion reads as unsupported in QC; and no module deep-research report exists yet.
