  summary: 'Create gene model errors project: fused UniProt entries'
  details: |
    Created projects/GENE_MODEL_ERRORS.md with scripts tile_gene_model.py (phmmer tiling of a UniProt entry by another assembly's proteome streamed from UniParc; FUSION/SINGLE_GENE/INCONCLUSIVE call with InterPro domains per segment) and rhoto_fusion_genetics.py (maps parts to R. toruloides IFO0880 genes and RB-TDNAseq fitness; adjacency and genetic separation). Screened 59 reference entries longer than their IFO0880 match: 26 fusions, all with adjacent parts, 15 genetically separated (listed in frontmatter genes). Catalogued four existing reviews with gene model problems found by text search (9POAL NCGR_LOCUS27674 fused; ASPOR Q2U1U6, HORSE CTDSP2, WHEAT A0A3B6GK97 truncated) and proposed a gene_model_issues slot for GeneReview.
