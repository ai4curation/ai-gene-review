  summary: Fix the reaction-chemistry classifier and withdraw the aggregate claims
    built on it
  details: |
    Review of PR 5006 found a false claim ('all 17 oxo-forming reactions are unmapped (100%)') and then a false replacement caption, which traced to the classifier itself: classify_reaction attributed to the enzyme any group named anywhere in the equation, so omega-hydroxylation of an epoxy fatty acid counted as an epoxidation. It now counts a group as formed only when the pattern matches the product side and not the substrate side, treats saturated docosanoate/hexacosanoate as fatty acids rather than PUFAs, tolerates ChEBI locant names such as docosa-4,7,10,13,16,19-hexaenoate, and has a carboxylate-formation class (matching dioate, dicarboxylate or carboxy) for the third step of omega-oxidation. RETRACTED from this project page: the '31 oxo-forming reactions, 26 unmapped (84%)' figure, the ranked chemistry table and its caption. The page now states the cascade finding per reaction (22 reactions form an oxo group, 18 unmapped, all 17 outside the eicosanoid class unmapped, the 4 mapped ones all eicosanoid; the carboxylate step holds 3 reactions of which only the LTB4 template RHEA:48672 is mapped) and carries a section stating that no claim rests on the class aggregates, with both known failure modes and their counts. The structural figures are unaffected: 60 entries, 556 reaction annotations, 528 experimental, 297 distinct reactions, 96 mapped, 191 without an EC, tiers 52/4/4, zero closure-filtered propagation gaps.
