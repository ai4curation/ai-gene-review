  summary: 'Create Cytochrome P450 project: GO molecular function across the human
    superfamily'
  details: |
    New project page projects/CYTOCHROME_P450.md plus projects/CYTOCHROME_P450/cyp_go_audit.py and data/. Family-wide live audit of the 60 reviewed human CYP entries: 556 catalytic-activity lines (528 experimental) over 297 distinct reactions, of which 201 (68%) reach no GO term; 84 substrate-naming MF terms; data-derived hub threshold giving tiers 52 substrate-resolved / 4 partially-resolved / 4 unresolved; provenance 48 experimental / 4 IBA / 4 other; 0 closure-filtered propagation gaps. Flagship finding: the cascade-step asymmetry, where CYP4F3 has all three leukotriene-B4 omega-oxidation steps as mapped GO terms and only step 1 for the chemically identical C22/C26 route on the same protein. Records repo review coverage (13 of 60, all endogenous-substrate CYPs). Added SSSOM batch 8 (4 rows, 2 proposed terms) to the RHEA mapping set and linked the two projects; added the index card.
