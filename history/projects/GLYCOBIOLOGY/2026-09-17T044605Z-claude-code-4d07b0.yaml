  summary: Record Phase 3 mucin-type O-glycan batch (GALNT1, C1GALT1, C1GALT1C1, GCNT1)
  details: |
    Added a Phase 3 section covering four de-novo human gene reviews of mucin-type O-glycan initiation and early elongation (72 annotations; 45 ACCEPT / 14 MODIFY / 5 NON_CORE / 5 OVER / 2 REMOVE / 1 NEW), partly closing the O-glycosylation coverage gap identified when the pathway modules were indexed. Updated frontmatter genes list and the modules sub-page's statement of that gap. Findings recorded: the chaperone/enzyme boundary is already curated correctly (GOA carries GO:0016263 on C1GALT1C1 as a NOT annotation); generic-term collapse extends from molecular function to cellular component (six GO:0016020 membrane rows collapsed to Golgi membrane); guilt-by-substrate over-annotation concentrates where the glycan product has well-known physiology (GCNT1 selectin-ligand terms, GALNT1 viral protein processing); and C1GALT1, the committed enzyme of the pathway, had no O-glycosylation process annotation at all, added as the batch's single NEW after a comparator check against GALNT1, GCNT1 and its own chaperone. Also flagged PMID:17228361 as MISCITED. Note: an earlier draft of this section claimed the review-stub generator drops negated flags when seeding from GOA; that claim was tested by regenerating the stub, found to be false (the generator emits negated: true correctly), and removed before commit.
