- type: CREATE
  outcome: changed
  summary: 'New project: check every cited PMID against PubMed retraction metadata'
  details: |
    Nothing in the pipeline asked whether a cited paper had been retracted, so a retraction could sit behind a GO annotation indefinitely. projects/RETRACTIONS/check_retractions.py harvests every PMID with its citation site (references entry, annotation original_reference_id, supported_by reference_id) and queries PubMed efetch.

    First full run: 25,088 distinct PMIDs; 7 retracted, 13 expressions of concern, 659 errata (benign, dominated by a few interactome papers), 1 unresolved. Four of the seven retracted papers are an annotation's original_reference_id: human/TP53, mouse/Mtch2, human/BACE1, human/STAT3. No ACCEPTed core function rests on a retracted paper.

    Four of the seven retraction notices are 2025-2026, i.e. they postdate the reviews citing them, which is the argument for re-running periodically rather than treating this as a one-off audit. Notices are suppressed so a review that correctly cites a retraction notice is not itself flagged.
