  summary: Diagnose zero-IBA VEuPathDB taxa
  details: |
    Added a reproducible cross-clade diagnosis under projects/EUKARYOTIC_PATHOGENS/ for the VEuPathDB organisms whose UniProtKB proteomes have PANTHER family cross-references but zero QuickGO IBA rows. The audit compares P. vivax, P. berghei, T. cruzi, L. donovani, Aedes aegypti, Toxoplasma gondii ME49, Nakaseomyces glabratus CBS 138, and Cryptococcus neoformans H99 against GO's PAINT reference-species list, the PANTHER supported-genomes API, the PANTHER 19.0 per-species sequence-classification file set, the PAINT leaf GAF, GO per-mnemonic GAF/GPAD/GPI exports, and exact/species QuickGO IBA counts. The resulting report records that the zeros are PAINT reference-proteome/export gaps rather than strain-only QuickGO query mismatches, notes the CANGA GO-export-but-not-PAINT edge case and the CRYNJ/CRYD1 Cryptococcus JEC21 sibling, and includes a draft GO/PANTHER issue without filing it.
