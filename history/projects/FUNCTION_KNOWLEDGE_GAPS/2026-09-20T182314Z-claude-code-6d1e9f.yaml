- type: EDIT
  outcome: changed
  summary: Add the contested-function gap as a fourth gap kind, with a 2025-2026 read-list
  details: |
    Introduces the contested-function gap alongside the project's existing biology/curation/ontology taxonomy: cases where two lines of experimental work assign mutually incompatible molecular functions and no consensus has formed, so neither UNDECIDED nor ACCEPT fits.

    Adds the sub-page FUNCTION_KNOWLEDGE_GAPS/contested-functions-2025-2026.md: a ranked shortlist of 22 candidates with the dispute, current GOA exposure and repo review status; worked entries for TMEM175, TMEM120A, TMEM65/SLC8B1, the epitranscriptomic writer/eraser cluster, GSDMC, MEFV and PRSS23; and a 'checked and set aside' section so the same ground is not re-covered.

    Recurring finding: these disputes are often already encoded in GOA with experimental evidence on both sides. TMEM65 carries calcium:sodium antiporter activity twice, once enables/IDA and once NOT|enables/IDA, citing the two 2025 papers that disagree.
