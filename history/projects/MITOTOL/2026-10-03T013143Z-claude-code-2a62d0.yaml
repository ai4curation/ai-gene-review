  details: |
    Created projects/MITOTOL.md from Chen et al. Cell 2026 (PMID:42822426), the MitoCarta Tree of Life comparative and ancestral-reconstruction paper. Cached the publication and added the CC-BY full text from the curator-supplied PDF. The page frames the paper as a computational resource (DeepLoc2.0-mito predictions are not annotation evidence), uses its LECA reconstruction and lineage losses as a check on IBA mitochondrion node placement, and records a GOA scan showing none of the predicted propagation errors (human ERMES, yeast complex I or uniporter) among currently reviewed genes. No gene reviews were changed.
