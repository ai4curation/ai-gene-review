  details: |
    Added a Project Status entry noting that EIF2AK2 (PKR) is now reviewed, completing the four ISR eIF2alpha kinases alongside EIF2AK1, EIF2AK3 and EIF2AK4.

    Two judgments are recorded because they are likely to recur across the cohort:
    - The NF-kB and interferon-beta arms of PKR are kept non-core, because PMID:22948139 shows they follow from eIF2alpha-mediated translational loss of IkB-alpha rather than from a separate adapter activity. The same test (is the signalling output downstream of eIF2alpha phosphorylation?) applies to the other three kinases.
    - GO:0034198 cellular response to amino acid starvation is marked over-annotated on PKR, since that stress is sensed by EIF2AK4/GCN2. Expect the mirror-image check on EIF2AK4.

    No other section of the page changed; the candidate-gene table already listed EIF2AK2.
