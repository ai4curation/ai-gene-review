  summary: 'SynGO provenance: audit of every SynGO GO:0099507 annotation'
  details: |
    Listed every SynGO GO:0099507 annotation in QuickGO (99 rows, 25 gene-product claims, 19 papers) with a new script, cached all 19 papers plus the original of one erratum, ran the reference-level check on each, and recorded a per-paper verdict with a verbatim quote (19 quotes verified). 6 claims are supported, all rodent; none of the 12 human claims is. 14 claims come from channel studies with no presynaptic context, 3 from postsynaptic contexts, 1 cites an erratum notice (PMID:8137830 for PMID:8404844), and 1 is the known GRIN2B wrong-subunit case. The page frames the pattern as one systematic question for SynGO and extends the plan.
