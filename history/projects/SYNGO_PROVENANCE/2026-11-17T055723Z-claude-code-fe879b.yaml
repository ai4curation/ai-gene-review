  summary: Search IBA donors exhaustively; re-render the page
  details: |
    Bot review of 7750d49 found that swap_iba_donors.py only queried IBAs on the swapped terms themselves, so 'no other IBA' was unsupported: an IBD placed at a broader term would have been missed. The script now lists every IBA naming each swapped gene's MGI/RGD id (QuickGO withFrom query, which needs the MGI:MGI: form), keeps those whose term is a swapped term or an is_a/part_of ancestor of one, and records every donor's experimental support for that term excluding the swap papers. It raises if a donor matches no IBA at all, so an id-format change fails loudly. Result (2026-11-17): the swaps can feed three IBA terms. GO:0098982 GABA-ergic synapse (PTN008566841): mouse Gabrb1 and rat Gabrb2 rest only on the swap; eight of the nine other donors have their own rows, mouse Gabrr3 unchecked (no reviewed UniProt). GO:0045211 postsynaptic membrane (PTN008360792), newly found: rat Gabrb1 rests only on its swapped GO:0099634 row; the other three donors (rat Gabrb3, human GABRB3, bovine GABRB1) have their own. GO:0005886 plasma membrane (PTN001054635): both rat genes have independent support. Every node keeps independent support. Also: the rat Gabrb2 ISS note now records the independent IDA (PMID:9464994); the GPCR term is named by its full label; a long line was rewrapped; and pages/projects was re-rendered, which the previous push had missed.
