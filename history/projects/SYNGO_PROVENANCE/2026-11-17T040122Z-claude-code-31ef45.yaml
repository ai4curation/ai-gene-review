  summary: Full text of PMID:15174078 and PMID:16469775 for the GABA swap
  details: |
    Read in full, from PDFs supplied by the project owner, PMID:15174078 (Chen et al. 2004, GABA-B subunits in rat globus pallidus) and PMID:16469775 (Huntsman and Huguenard 2006, GABA-A beta1 in thalamic reticular nucleus). Chen 2004 uses only antibodies against the C-termini of GABA(B1) and GABA(B2); GABA-A receptors appear only in the introduction and discussion, so the swap to rat Gabrb1/Gabrb2 is confirmed on full text and the corrected genes (Gabbr1, Gabbr2) are no longer just a reading of the abstract. Huntsman 2006 is a genuine GABA-A beta1 study (GABA-B receptors were blocked; no presynaptic content), so SynGO's rat Gabrb1 rows from it are correct.
