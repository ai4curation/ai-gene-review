  summary: Correct the IBA statement for the GABA swaps; decompose record counts
  details: |
    The page said no IBA used the three swapped SynGO seeds. That check searched IBA WITH/FROM for the seeds' UniProt accessions, but PAINT lists donors by MGI/RGD identifier, so it could not match. The GABRB1 review (PR 6486) bot review flagged MGI:95619 as mouse Gabrb1 in the GO:0098982 IBA donor list. New script swap_iba_donors.py looks up each seed's MGI/RGD id and counts IBA rows naming it, per swapped term. Result (QuickGO 2026-11-17): all three swapped genes are donors of the GO:0098982 GABA-ergic synapse IBA at PTN008566841 (241 rows) and of no other IBA. For mouse Gabrb1 and rat Gabrb2 the swapped rows are their only experimental support for that term. Seven of the other eight donors were checked by hand and have their own SynGO experimental rows for the term; mouse Gabrr3 has no reviewed UniProt entry and was not checked. The IBA is biologically sound; the correction removes donors, not the node. Also from the earlier bot review of 6483: decomposed the 12 and 18 record counts (mouse: 3 terms x EXP/IDA/IMP with GO:0099528 under two occurs_in extensions; rat: each assertion appears as two IDA records, ECO:0006003 and ECO:0007719, so 18 records are 9 assertions); cited PMID:9153229 for the rho homo-oligomer qualifier; and made 'supplied by the curator' consistent.
