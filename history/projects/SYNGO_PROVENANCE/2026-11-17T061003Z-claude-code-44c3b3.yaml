  summary: Fix donor resolution for FlyBase and WormBase ids
  details: |
    Bot review of fd5e1dd found that swap_iba_donors.py built UniProt queries from GO database abbreviations (xref:fb-, xref:wb-), which UniProt does not index, so 14 fly and worm donors of the GO:0005886 IBA were recorded as having no reviewed UniProt entry. The script now maps abbreviations to UniProt index names (same mapping as genes/human/ARFGEF3/ARFGEF3-bioinformatics/uniprot.py), falls back to free text for WormBase gene ids and records that as a fallback, records the query used and the organism for every donor, keeps donors from all databases rather than a whitelist, and records an unhandled database as unresolved rather than dropping it. Re-run 2026-11-17: all 8 WormBase donors and 1 of 6 FlyBase donors now resolve; 5 FlyBase, 3 ZFIN and mouse Gabrr3 MGI:3588203 remain unresolved and are recorded as such with the query. No conclusion changes: the affected donors are all on the plasma membrane node. Also: the page now says Gabrr3 was not resolved rather than that it has no reviewed entry, the plasma membrane row gives its row count, and the verdicts file's rat Gabrb1 GO:0099634 note records its role in the GO:0045211 IBA.
