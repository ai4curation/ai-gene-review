- type: AUDIT
  outcome: changed
  summary: SynGO GABA-A/GABA-B name-collision check
  details: |
    Tracing human GABRB1's presynaptic annotations found SynGO rows on rat Gabrb1/Gabrb2 taken from a GABA-B receptor paper (PMID:15174078). New script gaba_receptor_swaps.py checked all SynGO annotations on GABA receptor genes (339 rows, 38 papers) against each paper's title and abstract and counted derived annotations per suspect seed. Two confirmed WRONG_GENE_PRODUCT / SYMBOL_COLLISION cases: PMID:11498050 (GABA(B1) knockout) gave mouse Gabrb1 the same three terms as Gabbr1, including G protein-coupled neurotransmitter receptor activity, projected by Ensembl to 58 rows in 57 species including human GABRB1; PMID:15174078 put GABA(B1)/(B2) locations on rat Gabrb1/Gabrb2, giving human GABRB1 its only presynaptic location. One flag (PMID:15749345) is not a swap. Verdicts with verbatim quotes in data/gaba_receptor_swaps-verdicts.yaml; project page section and plan updated; GABRB1 seed note records that its presynaptic support is computed or from the GABA-B paper.
