  details: |
    New project page tying the two new CRISPR modules together. Records why host immunity and phage counter-defence are modelled as separate modules (different taxon scope, non-nested GO branches, independent reuse), tabulates which host step each characterised Acr class attacks, and reads two asymmetries as biology rather than curation gaps: nothing characterised attacks adaptation, and Cas3 sequestration can have no class 2 counterpart because recognition and cleavage share one protein there. Also summarises the stoichiometric-versus-catalytic inhibition distinction, the Aca feedback loop, the six recorded knowledge gaps, and candidate gene reviews. Added a project-card entry to the manually maintained pages/projects/index.html and rendered the page.
