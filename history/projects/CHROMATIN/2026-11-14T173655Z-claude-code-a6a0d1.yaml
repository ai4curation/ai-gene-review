  summary: 'Create: CHROMATIN project page'
  details: |
    New project page on chromatin-acting complexes and GO's chromatin subtree. Records why chromatin is not part_of nucleus in GO (open mitosis, Eukaryota-only nucleus) and the measured cost of that choice for gene queries and for location-based GO-CAM drawing, then sets out the inconsistent part_of chromatin assertions on complexes, the GO:0000123 problem, and a module plan for yeast HAT complexes (HAT-B done; Rtt109-Vps75, NuA4, SAGA HAT module, NuA3, SAS-I next). Analysis scripts in projects/CHROMATIN/scripts reproduce the figures from go-basic.obo releases/2026-07-26, goa_human.gaf generated 2026-05-21 and gocams/index.tsv. Project card added to pages/projects/index.html.
