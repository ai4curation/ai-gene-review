  details: |
    PR #3251 merged the duplicate ARATH/P14713 review into ARATH/PHYB (both UniProt P14713), removing one gene from the GO-GPT three-level overlap cohort. Regenerated reports/gogpt-comparison-levels.json (scripts/gogpt_compare_levels.py) and the benchmark sidecars (write_benchmark_sidecars.py). Cohort 298 -> 297 genes, predictions 8,835 -> 8,822 (-13, mean 29.7 per gene). P14713's 53 GOA terms/3 overlaps, 52 post-review/3 and 12 core/1 left; the merged PHYB went 52 -> 51 GOA, 49 -> 46 post-review and 4 -> 7 core terms with its overlaps unchanged (3/1/1). New totals: GOA 2,879/1,023 (11.6%), post-review 2,702/849 (9.6%), core 1,210/355 (4.0%). Updated the supplement cohort row, cohort-count sentence, Table S8, denominator narrative and mean-per-gene sentence; the deck's gene count in slides.md and both slides.html copies; and the pinned totals in tests/test_gogpt_compare_levels.py and tests/test_bioreason_benchmark_policy.py.
