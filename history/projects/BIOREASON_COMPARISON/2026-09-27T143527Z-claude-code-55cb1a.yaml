  summary: Refresh GO-GPT overlap supplement after P93002 merged into NPR1 (#3253)
  details: |
    PR #3253 merged the duplicate ARATH/P93002 review into ARATH/NPR1 (both UniProt P93002), removing one gene from the GO-GPT three-level overlap cohort. Regenerated reports/gogpt-comparison-levels.json (scripts/gogpt_compare_levels.py) and the benchmark sidecars (write_benchmark_sidecars.py). Cohort 297 -> 296 genes, predictions 8,822 -> 8,806 (-16, mean 29.8 per gene). P93002's 32 GOA terms/3 overlaps, 28 post-review/1 and 4 core/0 left; the merged NPR1 went 32 -> 29 GOA and 29 -> 27 post-review terms, gaining one post-review overlap (1 -> 2, GO:0031348), with GOA overlaps (3) and core (4/0) unchanged. New totals: GOA 2,844/1,020 (11.6%), post-review 2,672/849 (9.6%), core 1,206/355 (4.0%). Updated the supplement cohort row, cohort-count sentence, Table S8, denominator narrative and mean-per-gene sentence; the deck's gene count in slides.md and both slides.html copies; and the pinned totals in tests/test_gogpt_compare_levels.py and tests/test_bioreason_benchmark_policy.py.
