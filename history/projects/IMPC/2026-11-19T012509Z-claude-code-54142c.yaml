  summary: 'IMPC project: human coverage of dark genes, IMPC-allele follow-up papers,
    IMPC-cited IMP rows, lethality vs DepMap'
  details: |
    Completed the four open plan items on projects/IMPC.md, each as a script in projects/IMPC/ writing to projects/IMPC/results/.
    1. go_coverage.py now also reads goa_human.gaf (2026-05-21) and maps the 3,325 dark mouse genes to human through IMPC's human_gene_symbol: 1,926 (58%) have an experimental human MF or BP, 198 have no human symbol, 1,399 (17% of genes with a call) are dark in both species.
    2. allele_followup.py: Europe PMC full-text search for 14 IMPC/KOMP/EUCOMM allele designations (1,396 records), 7 consortium resource/screen papers removed, fixed-seed sample of 200 classified with the ASSAY_TO_FUNCTION readout catalogue. Abstracts: 4% molecular, 9% cellular, 87% organism-only; full text (182 from PubMed Central): 52% molecular, 28% cellular, 20% organism-only, an upper bound because matches anywhere in the article count. Three catalogue patterns that mean something else in knockout papers (reconstitution, .edu, FLP flippase) are dropped in the script; the catalogue is unchanged.
    3. impc_imp_rows.py: no IMP/IGI row in any review cites an IMPC consortium or centre-screen paper; MGI's GO file has only 4 such IMP rows (all PMID:23870131, genes not reviewed here). Added one rubric bullet for high-throughput knockout results to .claude/skills/annotation-reviewer/SKILL.md.
    4. essentiality.py: the DepMap portal download API returned a verification page / HTTP 403, so the script uses DepMap's own figshare deposit of the 24Q4 public release (MD5-checked). 665 of 2,996 IMPC-lethal genes (22%) are DepMap common essentials, against 122 of 6,549 (2%) non-lethal genes.
    No gene review YAML was edited.
