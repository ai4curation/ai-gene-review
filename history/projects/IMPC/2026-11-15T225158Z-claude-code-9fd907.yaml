  summary: 'Create: IMPC knockouts and gene function'
  details: |
    Created the IMPC project page to ask whether mouse knockouts reveal molecular and cellular gene function. Fetched all 67,350 IMPC significant genotype-phenotype calls (IMPC Solr, 2026-11-15) and classified each by IMPReSS procedure (hand-curated procedure_readout_classes.yaml) and by the bearer named in its MP term's OWL logical definition (MP 2026-10-29, GO 2026-07-26). No call is defined on a GO molecular function; cellular-level calls are almost all blood-cell counts. Joined IMPC genes to the MGI GAF (2026-05-21) for experimental GO coverage and IMP qualifiers, and tabulated reviewer actions on mouse IMP/IGI/IDA rows across 228 reviews. Scripts and generated summaries are in projects/IMPC/; raw downloads stay in the git-ignored .cache/impc/. The disease-mechanism question is in the companion dismech project page.
