  details: |
    Answers the first review on PR 6541. (1) The count of IMPC MP terms whose definition names a GO term is recomputed from definition bearers: 49 (41 process, 8 component), not 129. A positive control over all 10,544 defined MP terms finds 151 defined on a GO molecular function, none used by IMPC, and 0 GO ids missing from go-basic. Generic GO roots (GO:0008150, GO:0009987, GO:0008152) now count as organ level, which moves MP:0005266 abnormal metabolism out of CELLULAR (cellular calls 5,235, all haematology or immunophenotyping). (2) GO_COVERAGE.md table ordering fixed. (3) The claim that IMPC data does not enter GO now rests on a join that can return a positive: IMPC allele symbols resolved to MGI allele ids through MGI_GenePheno.rpt and matched to the WITH/FROM column of MGI IMP rows. Positive control 26,076 IMP rows (43%) name an allele from the report; 407 IMP rows on 114 genes name an IMPC allele, all citing a PubMed paper. (4) review_actions.py now stratifies by GO aspect from go-basic; the page compares process rows only (IMP 69% non-core of 2,131, IDA 44% of 854) and states the aspect mix. (5) Key literature lists all nine consortium PMIDs the scripts use, titles checked against PubMed. Also: action table includes TOO_GENERAL and UNDECIDED, 67,349 footnote, phenotyped-gene count wording, designation count, readout-class comment, and the tested-absence converse in the annotation-reviewer rubric.
