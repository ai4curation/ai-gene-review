  details: |
    Created PANTHER family review for PTHR43795 (BIFUNCTIONAL ASPARTATE AMINOTRANSFERASE AND GLUTAMATE/ASPARTATE-PREPHENATE AMINOTRANSFERASE-RELATED, 55 reviewed entries in PTHR43795-entries.csv and 32 representative members across 16 curated subfamilies). Separated canonical class-Ib aspartate/prephenate and bacterial alanine/valine aminotransferases (SF2, SF64, SF100) and plant tryptophan/methionine aminotransferases (SF117/SF15/SF22 TAA1/TAR, SF12 ISS1/VAS1, SF85/SF46 ACS10/ACS12) from authentic land-plant 1-aminocyclopropane-1-carboxylate synthases (SF6, SF10, SF118, non-Brassicaceae SF74, plant SF39), catalytically inactive Brassicaceae ACS1 (SF74 PTN005183104 lacking the Thr-Asn-Pro tripeptide, PMID:8566772, PMID:12968022), fungal epidithiodiketopiperazine twin C-S lyases GliI/SirI (SF32, PMID:22936680), vertebrate cysteine-S-conjugate beta-lyases ACCS (SF17, GO:0047804 / GO:0016846, PMID:39876065), eutherian putative pseudoenzymes ACCSL (SF1), and divergent nematode C. elegans T04F3.1 (SF39). Audited all 19 PAINT snapshot 20260710 rows plus retired root node PTN002887088, defined 5 active-site residue sites anchored on human ACCS (Q96QU6) with verified UniProt positive/negative controls and 11 term_assessments (including GO:0047804 SUBFAMILY_ONLY on SF17), synced UniProt DE SubName labels on rat A0A8J8YIP6 and zebrafish A0A8M1N4R4, and cross-checked all 8 curated metazoan gene reviews with zero conflicts.
