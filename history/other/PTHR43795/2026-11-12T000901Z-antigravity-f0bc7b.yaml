  details: |
    Created PANTHER family review for PTHR43795 (BIFUNCTIONAL ASPARTATE AMINOTRANSFERASE AND GLUTAMATE/ASPARTATE-PREPHENATE AMINOTRANSFERASE-RELATED, 439 reference-proteome entries across 24 subfamilies). Separated canonical class-Ib aspartate/prephenate aminotransferases (SF2, SF64, SF100) and plant tryptophan/methionine aminotransferases (SF117 TAA1/TAR, SF12 ISS1/VAS1, SF85/SF88 ACS10/ACS12) from authentic land-plant 1-aminocyclopropane-1-carboxylate synthases (SF6, SF10, SF118, non-Brassicaceae SF74, plant SF39), catalytically inactive Brassicaceae ACS1 (SF74 PTN005183104 lacking the Thr-Asn-Pro tripeptide), fungal epidithiodiketopiperazine twin C-S lyases GliI/SirI (SF32), vertebrate cysteine S-conjugate sulfoxide beta-lyases ACCS (SF17), eutherian putative pseudoenzymes ACCSL (SF1), and divergent nematode C. elegans T04F3.1 (SF39). Audited all 24 PAINT snapshot 20260710 assertions plus retired root node PTN002887088, defined 7 active-site residue sites anchored on human ACCS (Q96QU6) and apple ACS-1 (P37821) with 243 verified residue checks, and cross-checked all 8 curated metazoan gene reviews with zero conflicts.
