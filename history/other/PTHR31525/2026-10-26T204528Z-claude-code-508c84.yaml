  details: |
    Created a structured PANTHER family review for PTHR31525 (HEME TRANSPORTER HRG1), which modules use as a participant. The review gives the family MOSTLY_COHERENT coherence: heme transport is shown for the HRG1 orthologs (SF1) and for C. elegans HRG-4 (SF3), but location differs, with endolysosomal SF1 and plasma-membrane HRG-4; HRG-5 and HRG-6 are uncharacterized. It assesses the five IBDs on the root PAINT node PTN002418776. Heme transmembrane transporter activity, heme binding and heme transport are SOUND. Lysosomal membrane is NEEDS_PRUNING, because it is seeded only by SF1 yet reaches plasma-membrane HRG-4 (SF3). Plasma membrane is UNRESOLVED. It adds a TMD2 histidine site (human HRG1 His56, worm HRG-1 His90, zebrafish His54) at CONTRIBUTES strength, since HRG-4 uses an E2-loop histidine instead. It cites the OpenScientist distribution analysis, which shows the family is almost entirely metazoan.
