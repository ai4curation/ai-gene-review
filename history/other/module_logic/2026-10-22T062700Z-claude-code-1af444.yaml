events:
- type: EDIT
  outcome: changed
  summary: Ground module atoms through participant.gene_product; add vacuous-satisfiability
    regression test
  details: |
    _atom_from_annoton read only participant.gene (plus family.representative_members), so a step grounded through participant.gene_product -- the shape ANY_WITH_FUNCTION steps use to name an exemplar protein -- produced an Atom with no gene symbol and no accession. No genome- or expression-keyed oracle can satisfy such an atom, so every module containing one was unsatisfiable in every context, silently and with no validation error. Corpus-wide this affected 1784 atoms across 295 modules; in the phage set it left 4 of 14 modules (attachment_and_genome_ejection, capsid_packaging_and_tail_assembly, genome_replication_and_transcription, virion_release_and_lysis) with every atom ungrounded. GeneProductDescriptor is_a Descriptor, like GeneDescriptor, so the existing symbol and accession rules apply unchanged; an explicit gene still takes precedence. Three ANY_WITH_FUNCTION steps that carry no descriptor at all remain ungrounded by design and would need a function-keyed oracle. Also adds test_no_curated_module_is_satisfied_by_an_empty_context, which asserts no curated module with leaf steps is satisfied when nothing holds -- the check that catches the all-parts-optional modelling error fixed in phage_single_gene_lysis.
