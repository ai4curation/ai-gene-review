  summary: Update PTHR43323 fungal HMG-CoA synthase review
  details: |
    Updated the PTHR43323 family review to include the fungal SF2 representative members now reviewed in S. cerevisiae, S. pombe, C. albicans, and Aspergillus fumigatus, and broadened the HMG-CoA synthase, acetyl-CoA metabolic process, and fungal ergosterol node assessments to reflect those completed reviews. Follow-up review clarified that the root acetyl-CoA metabolic process IBA is retained as non-core in HMGCS1 and the fungal ERG13/hcs1 members but as core in HMGCS2/Hmgcs2, where acetyl-CoA consumption is the ketogenic HMG-CoA synthase step.
