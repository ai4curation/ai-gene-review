  summary: Curate PTHR13393 family function boundaries
  details: |
    Curated RlmF/METTL16 and related SAM-dependent methyltransferases. Assessment: HETEROGENEOUS. The member inventory contains RlmF, METTL16 and small-molecule methyltransferases, whereas the integrated InterPro prose emphasizes the first two groups. Substrate class and RNA target therefore require subfamily-level evidence. Fungal NCU11362 should be compared with the METTL16 branch, not bacterial RlmF or specialized-metabolite enzymes. SF0 itself contains RlmF, METTL16 and PsiM entries, so this boundary cannot be represented by granting a substrate-specific term to SF0. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
