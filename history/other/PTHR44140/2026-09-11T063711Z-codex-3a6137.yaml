  summary: 'Complete family biological assessment: PTHR44140'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. TPR/J-domain cochaperones bind nonnative proteins and communicate with an Hsp70 partner. Direct P58/DNAJC3 experiments show that most molecules enter the ER lumen, its TPR-containing region binds misfolded clients, and BiP plus ATP promotes client release through a functional J-domain (PMID:18923430). ATPase chemistry belongs to BiP rather than the cochaperone. The related Jem1 and animal branches can differ in membrane attachment and clients; the broad cochaperone mechanism is coherent, but universal PKR inhibition, a cytosolic localization or one substrate is not established by the family name. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
