  summary: Create PTHR10059 GM-CSF family PAINT review
  details: |
    Created the PTHR10059 family review for the compact mammalian GM-CSF/CSF2
    cytokine family seeded by human CSF2. The family has one reviewed human
    Swiss-Prot member and one PAINT node, PTN000006643.

    Reviewed the three PAINT IBD assertions at PTN000006643, for extracellular
    region, cytokine activity, and myeloid cell differentiation, and recorded
    them as SOUND because the node is restricted to mammalian CSF2 orthologs
    and matches the direct human CSF2 review evidence.

    No module or GO-CAM review was added: the family is a single secreted ligand
    rather than a multi-protein biological module, and the receptor-side
    GM-CSF signaling mechanism is already covered by reviewed CSF2RA/CSF2RB
    work outside this ligand-family PR.
