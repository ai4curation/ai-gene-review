  summary: Take two subfamilies with no leaf below the node off the affected list
    of the class IB PI3K complex assessment
  details: |
    Follow-up to the tree re-read of the family node assessments (batch f001), after review of the pull request. For PANTHER:PTN000799659 GO:0005944 (TOO_DEEP) the reading, which the second agent checked, found that the assessment contradicts the PANTHER 19.0 tree: it listed SF107 (p110alpha), SF33 (p110beta) and SF35 (p110delta) as affected and called the node the class I node, whose term descends to the class IA catalytic subunits. The node is a Deuterostomia speciation node of 53 leaves holding SF107 (22 leaves) and SF34 (p110gamma, 20 leaves); SF33 (0 of its 20 leaves) and SF35 (0 of its 18) are not below it and join it one level up, at PTN000799657. Checked against the release tree on 2026-11-18; consistent with it, human PIK3CA carries the IBA row and human PIK3CD does not. The script had left the row for a curator because the claim is in affected_subfamilies, which it does not rewrite, and no replacement reason had been drafted.

    - affected_subfamilies: SF33 and SF35 removed; SF107 stays.
    - assessment_reason: says the term is asserted at a node above the p110gamma branch and descends to p110alpha (SF107), and adds what the tree shows: the single seed PIK3CG is 14 steps below the node in SF34, SF107 holds 22 of the node's leaves and no seed, and SF33 and SF35 have no leaves below it.
    - supported_by: quotes sentences 1 and 3 of the node's entry in PTHR10048-tree-nodes.yaml, which is now listed under references.

    The assessment (TOO_DEEP) is unchanged. The review validates.
