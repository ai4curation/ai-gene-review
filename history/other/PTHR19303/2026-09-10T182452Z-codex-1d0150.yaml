  summary: Curate PTHR19303 family function boundaries
  details: |
    Curated CENP-B and transposon-derived DNA-binding proteins. Assessment: HETEROGENEOUS. Direct Cbh1 binding experiments and pombe retrotransposon-surveillance studies support host DNA-binding functions, while the inventory includes multiple Tigger-derived and PDC2 proteins. Shared ancestry does not establish retained transposase activity. The generated InterPro passage about chaetoglobosin synthesis is not used as biological evidence for this family. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
