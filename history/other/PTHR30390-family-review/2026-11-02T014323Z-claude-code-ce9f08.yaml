  summary: Create family review for PTHR30390 (GmhA isomerase / DiaA replication factor)
  details: |
    New FamilyReview for the SIS-domain family that the ADP-heptose precursor biosynthesis module grounds its isomerization step to. Marked HETEROGENEOUS: PANTHER's own inventory splits GmhA phosphoheptose isomerases (SF7, incl. E. coli P63224) from DiaA replication-initiation factors (SF6, incl. E. coli P66817), but UniProt's PANTHER cross-reference assigns the module's Pseudomonas, Streptomyces and Methanococcus GmhA enzymes to SF6, the DiaA-named subfamily, so a subfamily label here is not a function claim. Assessed all five PAINT rows: the three isomerase-node rows at PTN002411455 (seeded by E. coli GmhA) are SOUND; the two DiaA-node rows at PTN000764072 (GO:0032298, GO:1990102, seeded by E. coli DiaA alone) are UNRESOLVED, because that IBA reaches Pseudomonas aeruginosa GmhA (Q9HVZ0), a characterized isomerase whose DnaA binding is untested rather than excluded, and the PSEPK ortholog Q88N89 does not receive it. This matches the UNDECIDED verdict in the Q9HVZ0 gene review. GO:0008968 is scoped SUBFAMILY_ONLY over both SF6 and SF7, since the activity tracks GmhA-group membership rather than either label.
