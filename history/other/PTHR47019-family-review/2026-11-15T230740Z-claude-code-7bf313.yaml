  summary: 'Create family review: PTHR47019'
  details: |
    New COMPLETE review of the LIPID II FLIPPASE MURJ family, declared MOSTLY_COHERENT: all 20 members of the inventory sit in the single subfamily PTHR47019:SF1 and 18 are canonical MurJ proteins of 449 to 516 residues, the identified exception being the Mycobacterium tuberculosis MviN pair P9WJK2 and P9WJK3 at 1184 residues. All five PAINT rows, all at PTN001341949 with Bacteria taxon and the E. coli enzyme as sole seed, assessed SOUND: GO:0015648, GO:0015836, GO:0009252, GO:0005886 and GO:0034204. The single-seed IBD is defended explicitly as the standard case against reading donor count as evidential strength, since the seed rests on the in vivo colicin-M flipping assay, rapid chemical inactivation, membrane-potential dependence and two crystal structures. GO:0034204 is sound but uninformative, and the recommendation is to refine the node row to its child GO:0034203 glycolipid translocation, which is true of the whole clade, held by the E. coli gene from an IMP and asserted at no node; GO:0034203 is therefore assessed as an additional FAMILY_WIDE term. One residue site: the five charged residues of the solvent-exposed central cavity (R18, R24, D39, R52, R270 of E. coli MurJ) from the alanine and cysteine scan, at CONTRIBUTES strength with three positive controls including both crystallised thermophilic enzymes, and deliberately no negative control, since no member is verified to lack flippase activity. The mycobacterial MviN divergence (alanine at the position corresponding to Arg52, fixed unambiguously by the invariant LPNL motif) is flagged in the site, the subfamily and the notes but not recorded as a member exception, because no cached evidence establishes that the term fails for those proteins. Unlike MurF, MraY and MurG this family has no stem-peptide granularity problem. Validated with the family schema, term, reference, local-quote, residue and family/gene cross-check validators (0 conflicts, no rows for this family). proposed_action was not used because this worktree's schema predates that slot.
