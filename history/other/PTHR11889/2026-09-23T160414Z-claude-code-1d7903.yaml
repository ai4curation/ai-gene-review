  summary: 'Create family review: PTHR11889 HEDGEHOG'
  details: |
    First family review for the Hedgehog ligand family, the partner of the PTHR11309 review created in the same session. Coherence is MOSTLY_COHERENT: all five subfamilies share the Hint/Hog precursor architecture, autoprocessing with cholesterol transfer, and Patched binding, with Desert hedgehog (PTHR11889:SF56) flagged as diverged on range and potency rather than chemistry. Eight node assessments across three PTN nodes: SOUND for patched binding, smoothened signaling pathway, extracellular region and cell fate specification at PTN001726121, UNRESOLVED for calcium ion binding (human-only seeds under a Eumetazoa placement) and for the untaxoned second oligodendrocyte-differentiation node PTN002484206. Eight term assessments, including FAMILY_WIDE for the autoprocessing and cholesterol-transferase activities that the Hedgehog module places on the ligand itself, and UNRESOLVED for morphogen activity pending in vivo measurement of DHH secretion. No residue_sites asserted: the calcium, zinc and catalytic-cysteine positions are exactly what the ResidueSite mechanism is for, but UniProt sequences are unreachable from this environment, so the calcium assessment is left open instead. Validated with linkml-validate -C FamilyReview (no issues); four supporting_text quotes verified verbatim; cross-check reports no conflicts against the curated SHH review.
