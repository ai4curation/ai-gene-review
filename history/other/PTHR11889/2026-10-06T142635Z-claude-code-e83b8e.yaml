  summary: Record the GO:0004175 endopeptidase disagreement as UNRESOLVED
  details: |
    The new FAMILY_FUNCTION_UNREVIEWED check flagged that the Hedgehog module
    types the hh_autoprocessing annoton GO:0004175 endopeptidase activity
    while this review never assessed that term. Investigating it turned up a
    genuine conflict rather than an oversight, and the first instinct was
    wrong.

    The instinct was to treat the module as the error and retype the annoton,
    because the curated reviews of both Drosophila hh and human SHH MODIFY
    GO:0004175 to GO:0140853 cholesterol-protein transferase activity, and
    this review already scopes GO:0140853 FAMILY_WIDE. The mechanism is not in
    dispute: the Hint/Hog domain does not hydrolyse the bond it breaks, it
    proceeds through a thioester resolved by cholesterol's 3-beta-hydroxyl,
    established on the Drosophila protein itself. On that reading cleavage and
    cholesterol transfer are one transesterification cycle, not a protease
    step followed by a transferase step, and the module's two separate
    annotons misdescribe one reaction as two.

    Checking the cached GO-CAM stopped that change. Model 696022cd00000016
    types its autocleavage activity GO:0004175 in the endoplasmic reticulum
    membrane, ORCID-attributed and dated January 2026, and the module's two
    annotons mirror two activities of that model faithfully. So the module is
    not diverging from the evidence, it is following a curator, and the
    divergence is between that curator and this project's own gene reviews.
    Stripping the term at family level would overrule them on a mechanistic
    reading they may have made knowingly, using the cleavage framing for the
    half-reaction that does break the bond.

    The term is therefore recorded UNRESOLVED with both sides stated, and
    nothing was changed in the module. The scope reason tells a propagator
    what to do in the meantime: prefer GO:0140853, which is unambiguous, and
    read a GO:0004175 row on a Hedgehog ligand as the same event described the
    other way rather than as a second activity. Resolving it properly needs a
    GO-level decision on whether a transesterification that severs a peptide
    bond is an endopeptidase activity, which is why the outcome is
    needs_followup rather than changed.
