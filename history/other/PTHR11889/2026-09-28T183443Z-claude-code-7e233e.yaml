- type: EDIT
  outcome: changed
  summary: Resolve the calcium assessment with a checkable residue site
  details: |
    Curating Drosophila hh settled the calcium question this review had left UNRESOLVED at node PTN001726121. The concern was that all three seeds are human paralogs while the node sits at Eumetazoa. Human SHH carries seven experimentally evidenced calcium-coordinating positions and Drosophila Hedgehog carries the same seven residue identities at the corresponding positions with the spacing preserved in both clusters, verified against the UniProt sequences. The node assessment is now SOUND and the term assessment is RESIDUE_DETERMINED rather than UNRESOLVED, scoped by a new residue_sites entry anchored on human SHH with the fly protein as a positive control. The site is recorded at CONTRIBUTES rather than REQUIRED: no family member is verified to lack both site and function, so there is no negative control, and the residue validator correctly rejected the stronger claim until it was downgraded. The site now passes validation against the real sequences.
