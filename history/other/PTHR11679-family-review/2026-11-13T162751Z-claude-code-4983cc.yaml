  summary: 'Create: PTHR11679 family review (Sec1/Munc18 proteins)'
  details: |
    New FamilyReview for PANTHER:PTHR11679. Verdict MOSTLY_COHERENT: syntaxin binding is shared, compartment and process differ by clade. Vesicle-mediated transport and syntaxin binding are family-wide; syntaxin-1 binding belongs to the Munc18-1/Rop subfamilies and syntaxin-3 binding to the STXBP2 subfamily. Two nodes are judged too deep: PTN000187656 for secretory granule (mammalian seeds, placed at Eukaryota, inherited by plant SEC1 proteins) and PTN000187659 for presynaptic dense core vesicle exocytosis (one worm unc-18 seed at Bilateria, inherited by STXBP2 and STXBP3). PTN007525790 is unresolved. The non-synaptic clades (Sly1, Vps45, Vps33, SCFD2) were recorded from PAINT rows without adjudication. Members read: human STXBP1, rat Stxbp1, worm unc-18. The PAINT slice was fetched for this review. Validated per file with linkml-validate, the term validator, the reference validator and quote_check.
