- type: REVIEW
  outcome: changed
  summary: 'Evolutionary re-review: PTHR11117'
  details: |
    Part of a joint evolutionary re-review of the succinyl-CoA synthetase subunit families PTHR11117 (alpha) and PTHR11815 (beta). Evidence: the PANTHER release 19 trees, a reproducible local analysis (genes/yeast/LSC2/LSC2-bioinformatics: paralog census, bootstrapped neighbor-joining and maximum-likelihood trees, position-20 residue comparison), cached literature, and two OpenScientist hypothesis runs. The GO:0004776 node assessment at the root changed from UNRESOLVED to NEEDS_PRUNING, with member exceptions for LSC1 and SPAC16E8.17c tied to the fungal node PTN000874203. Added the unassessed cytosol node on the FdrA clade, subfamily descriptions including the non-succinyl-CoA-synthetase members, and a GO:0004776 term assessment.
