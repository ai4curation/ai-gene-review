  summary: 'SF24 entry: record absence of the catalytic histidine in AllF'
  details: |
    One sentence of the SF24 subfamily entry changed. It said that whether the phosphohistidine chemistry of the alpha subunit is retained in the clade is not known. It now says that AllF has no histidine at the position of the catalytic histidine (His247 of E. coli SucD in UniProtKB:P0AGE9 numbering, His246 in the crystal structures): in a superposition on the AllF crystal structure (PDB 3DMY) the SucD segment that carries it has no counterpart, and at the Pfam PF00549 profile column of that histidine AllF, YahF and Salmonella FdrA have glutamine; for YahF and FdrA the loss is inferred from the profile and not from a structure, it was not surveyed across the subfamily, and whether any covalent intermediate forms is untested. The statement is about AllF and these two proteins, not about the whole clade. Two quotes from genes/ECOLI/allF/allF-bioinformatics/RESULTS.md were added to that entry and the file was added to references. No node verdict, proposed action or term assessment changed. Schema, term, reference and quote checks pass for the file (93 quotes verified); the family residue validator reports 0 failures.
