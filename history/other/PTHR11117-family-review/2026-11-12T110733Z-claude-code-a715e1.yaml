- type: AUDIT
  outcome: changed
  summary: 'Retrospective audit corrections: PTHR11117'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. Node verdicts changed. At PTN000122012: GO:0004775, GO:0009361 and GO:0006099 (IBD) SOUND -> NEEDS_PRUNING, because the SF24 clade PTN001671414 (E. coli AllF is an oxamate carbamoyltransferase subunit) and the Aquifex aeolicus leaf O67729 (inferred citryl-CoA synthetase small subunit) are leaves of the PAINT tree and are not succinyl-CoA synthetase subunits; GO:0006099 also reaches the hydrogenosomal Trichomonas vaginalis clade. At PTN000122014: GO:0005739 (IBD) SOUND -> NEEDS_PRUNING for the Trichomonas vaginalis clade PTN008961326. GO:0004776 at PTN000122012 stays NEEDS_PRUNING, with the SF24 clade and the Aquifex leaf added as branches. Statements corrected: the loss of the G-type beta gene holds for the 15 fungal genomes in the PANTHER tree and not for fungi as a kingdom (Mortierellomycota, Basidiobolus and Rozella keep a SUCLG2-type gene, and Saitoella complicata, in the same subphylum as S. pombe, has a Gln20 gene of unresolved origin); PTN000122012 is the LUCA node, not the root; assays for tobacco, Blastocystis, Trichomonas vaginalis and Dictyostelium are cited (Dictyostelium: the purified enzyme uses GTP and forms GTP from GDP; PMID:7771809, PMID:8448193, PMID:8240297). New member exceptions for O67729 and Blastocystis B3FHT4; subfamilies SF6 and SF26 added. Validated with the steps of just validate-families run on this file (schema, terms, references, quote check) and the corpus-wide residue, cross-check, gene residue claim and finding residue mapping validators.
