  summary: 'Family review update after nine new SCS gene reviews: PTHR11117'
  details: |
    Updated after the gene reviews written on 2026-11-18 (E. coli allF; Dictyostelium scsA, scsB, scsC; Blastocystis SCSa, SCSb; Trichomonas vaginalis ALPHA-SCS1 and Q03184; Actinomortierella ambigua A0A9P6TY68) and the reconciliation of the P. aeruginosa reviews. Members that had no gene review now cite one: AllF (SF24), scsA, ALPHA-SCS1, SCSa and P. aeruginosa SucD (SF2). No node verdict changed. The cytosol IBD at PTN001671414 stays UNRESOLVED but now cites the AllF review, which accepts the term on indirect grounds; the YahF seed paper was read as an abstract only. The Trichomonas pruning of GO:0006099 was a proposal and now rests on the full text of PMID:22079833. The Blastocystis B3FHT4 exception for GO:0004776 cites a second preparation (PMID:27478903) and records that the term reaches the protein as a TreeGrafter IEA. Dictyostelium wording now separates the partial reactions in the primary abstracts from the retrospective sentence in PMID:7771809. Every NEEDS_PRUNING row now carries proposed_action; rows with several requested changes are repeated, one entry per change (11 ADD_IRD actions: PTN001671414 and the Aquifex leaf PTN000122097 for GO:0009361, GO:0004775, GO:0004776, GO:0006099; PTN008961326 for GO:0006099 and GO:0005739; the fungal clade PTN000874203 for GO:0004776, flagged as a proposal to test). No action for the plant clade. The disagreement between the two Blastocystis gene reviews on the TreeGrafter mitochondrion row was recorded and later reconciled (see the follow-up below). All 11 actions pass the proposed-action tree check; quote check on the file passes.

    Follow-up after independent checks (same day). The two Blastocystis gene reviews were reconciled in favour of the usage comment of GO:0005739 (both mark the TreeGrafter mitochondrion row over-annotated and accept hydrogenosome), and the PTN000122014 row and the notes now say so. Seven papers cited in prose were added to the references list. The scsA gene review now cites PMID:35602934 itself.
