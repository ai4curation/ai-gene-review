  summary: 'Complete family biological assessment: PTHR19143'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Fibrinogen-like domains occur in secreted signaling and recognition proteins with different receptors and outputs. Fly CG10359 was identified as an angiopoietin-like candidate with radiation-responsive expression in a study of systemic radioprotection (PMID:24675716); this does not establish direct Tie binding, a GPCR mechanism or a fibrin polymerization reaction. Its signal peptide and fibrinogen domain support an extracellular interaction protein, while receptor identity and the conservation of angiopoietin-like signaling remain unresolved. Domain homology cannot replace a ligand-receptor experiment. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
