  details: |
    New FamilyReview for the PLP serine/threonine dehydratase family (HETEROGENEOUS: threonine deaminases, serine dehydratases, DsdA, and ThrC threonine synthases mixed into SF6). PTN002459384 (GO:0004794) and PTN002463966 (GO:1901705) assessed SOUND. GO:1901705 scoped to SF11/SF10. L-threonine catabolism and L-serine ammonia-lyase scoped to the catabolic subfamilies plus SF11 as a minor/secondary role. Noted that the PSEPK ilvA-I/II reviews treat L-threonine catabolic process as core.
