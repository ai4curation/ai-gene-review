  summary: 'Complete family biological assessment: PTHR46721'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Forkhead/winged-helix factors share sequence-specific DNA recognition but regulate different developmental programs. Fly jumu experiments establish chromatin/nucleolar localization and developmental requirements (PMID:10887088; PMID:20213139). Xenopus Foxn4 instead co-regulates multiciliated-cell genes with Foxj1, with distinct promoter and enhancer occupancy (PMID:27864379). These results support broad DNA-binding transcription-factor activity while preventing transfer of vertebrate thymic or multiciliogenesis programs to every jumu/FOXN-related protein. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
