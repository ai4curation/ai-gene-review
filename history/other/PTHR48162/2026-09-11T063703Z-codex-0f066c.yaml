  summary: 'Complete family biological assessment: PTHR48162'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. The actual SF1 member inventory places fly CG13096 alongside VZV ORF11 proteins P09263 and Q4JQW4. Direct ORF11 characterization establishes a viral tegument context (PMID:21276599), which cannot be transferred to a fly cellular protein. Conversely an L1-like domain does not demonstrate incorporation of CG13096 into the large ribosomal subunit. The exact benchmark accession H0RNN8 and the separately listed Q9VLK2 are not interchangeable sequence identifiers. A conserved molecular role remains unresolved because the available experiments and domain classification do not bridge these very different protein contexts. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
