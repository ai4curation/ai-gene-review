  summary: Complete evidence-grounded family review for PTHR11640
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. The classification extends beyond nephrin to kin-of-irre proteins, adhesion molecules and multidomain extracellular proteins. Thus nephrocyte diaphragm, muscle fusion, homophilic binding and kidney filtration cannot be universal family functions. Sns experimental findings should be interpreted with its nephrin-like architecture and relevant heterophilic partner, rather than generic adhesion prose. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
