  summary: Curate PTHR23068 family function boundaries
  details: |
    Curated DNMT3/DRM methyltransferases and noncatalytic relatives. Assessment: HETEROGENEOUS. Human DNMT3A and DNMT3L occupy different verified subfamilies, and the DNMT3A–DNMT3L structure distinguishes catalytic and regulatory subunits. Active plant DRM branches and inactive relatives add further boundaries. DNA methylation as a biological process may involve a regulator even when intrinsic DNA methyltransferase activity is absent. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
