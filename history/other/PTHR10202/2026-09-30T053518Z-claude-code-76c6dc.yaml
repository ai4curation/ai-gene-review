    Structured FamilyReview for presenilins for the Notch module. The GO:0007219 IBD at PTN000024430 (Unikonts) is TOO_DEEP: all seeds are bilaterian, and Dictyostelium psenA/psenB (no Notch) inherit the term. Recommend moving it to the Bilateria node PTN000024431 or adding an IRD. Flagged C. elegans SPE-4 (SF25) as having no Notch evidence, and noted that SF13 mixes bilaterian and non-bilaterian members. Amyloid-beta, gamma-secretase complex and ectodomain-proteolysis nodes left UNRESOLVED with reasons.
