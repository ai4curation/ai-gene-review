  summary: 'Family review: PTHR33442 (proline racemase superfamily)'
  details: |
    New family review; no earlier one existed and neither open PR #5077 nor #5078 adds one. Both subfamilies are mixed: SF1 holds bacterial 4-hydroxyproline epimerases together with the mammalian trans-3-hydroxy-L-proline dehydratases, SF5 holds proline racemases, dehydratases, the bifunctional P. aeruginosa LhpL and some epimerases. The family therefore asserts no subfamily scope for 4-hydroxyproline epimerase activity: that activity arose more than once in the superfamily and tracks with active-site residues, so it is UNRESOLVED with the needed evidence named. The GO:0047580 IBD node seeded by LhpL is also UNRESOLVED, because two studies of the purified protein find no 4-hydroxyproline epimerase activity while the seed rests on a regulatory IMP. The Opisthokonta hydro-lyase node is SOUND with exceptions for the two bacterial epimerases in SF1.
