  summary: Family review of PTHR12122 for the dismech vision-disorder alignment
  details: |
    First family review of the PDE6 gamma subunit family, written for projects/DISMECH_VISION_ALIGNMENT after the PDE6G and PDE6H gene reviews. Coherence COHERENT: both members inhibit their catalytic partners. Enzyme inhibitor activity and photoreceptor outer segment membrane are family-wide. Phosphodiesterase activity and cGMP binding, which reach the members by InterPro2GO and not by PAINT, are NOT_APPLICABLE. The two root-node process terms for positive regulation of EGF receptor and G protein-coupled receptor signalling are left UNRESOLVED: the only evidence is one study in cultured kidney cells and nothing outside mammals has been tested. Validated with the family schema, term, reference and quote checks; the family/gene cross-check reports no conflict.
