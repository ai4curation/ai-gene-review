  details: |
    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR10572-tree-nodes.yaml, from `just phylo-family PTHR10572`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

    - PANTHER:PTN000060347 GO:0005778 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the node is a Eukaryota speciation node with 232 leaves in 93 species, and the single seed, human HMGCR, is 19 steps below it. The term was placed far above its only evidence, which agrees with the view that it should not sit above the fungi.
    - PANTHER:PTN000060347 GO:0005789 (NEEDS_PRUNING): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the node is a Eukaryota speciation node with 232 leaves, and the 6 seeds sit in both of its branches, so the node is their common ancestor. Whether the short AN1593 paralog lacks the membrane region is a sequence question the tree cannot settle.
    - PANTHER:PTN000832055 GO:0006696 (NEEDS_PRUNING): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the node is a Fungi speciation node with 18 leaves in 15 species, all in SF24, and the single seed, yeast HMG1, is 8 steps below it. The tree does not contradict the request, and whether AN1593 is a secondary-metabolite paralog is not a question it can settle.

    Each row now quotes the family's node listing in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
