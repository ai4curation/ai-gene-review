  summary: Complete evidence-grounded family review for PTHR10937
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. Full-length GFAT1/GFAT2-type proteins conserve the coupled glutaminase and sugar-isomerase reaction, whereas related deaminase branches perform different chemistry. The native Gfat1-PF isoform A8Y5A1 retains the isomerase region but only a small part of the glutaminase module, so catalytic capability is not uniform even among gene products assigned to a single subfamily. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
