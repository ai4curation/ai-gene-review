  summary: 'Resolve exhaustive family-scope limitation: PTHR10937'
  details: |
    Follow-up family/gene consistency audit found that the listed benchmark subfamily was a positive example, not an exhaustive applicable set. Retained member evidence and changed machine-readable scope to UNRESOLVED with the specific biological boundary: The complete glutamine-dependent reaction is established for human GFPT1 and GFPT2 by structural and enzyme-kinetic studies (PMID:32019926; PMID:35229715), and thus is not exclusive to the fly-associated SF0. Within that SF0, however, benchmark A8Y5A1 is the native 434-residue Gfat1-PF isoform: the reproducible comparison retains only 40 of 299 glutamine-amidotransferase-domain residues while preserving the sugar-isomerase domains. This contradicts intrinsic execution of the complete two-module reaction by that exact protein, without contradicting the activity of full-length Gfat1. A safe scope therefore depends on both reaction branch and isoform/domain completeness; an unconditional subfamily grant cannot express it.
