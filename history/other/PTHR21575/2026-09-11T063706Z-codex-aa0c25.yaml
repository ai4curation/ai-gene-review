  summary: 'Complete family biological assessment: PTHR21575'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Direct mammalian localization and biochemical experiments identify HID1 as a peripheral membrane protein associated with medial/trans-Golgi and cytosol, rather than the multipass topology suggested by hydrophobicity prediction (PMID:21337012). Comparative phylogeny and fission-yeast genetics support a conserved relationship to Golgi organization, including disruption of Golgi stacks in the tested mutant (PMID:40899782). Dense-core-vesicle neurosecretion is a metazoan specialization, not a universal fungal function. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
