  details: |
    Family review for PANTHER PTHR32329 (BadF/BadG/BcrA/BcrD [4Fe-4S] ATPases). HETEROGENEOUS: SF2 holds the characterized 2-hydroxyacyl-CoA dehydratase activators (HgdC, HadI, FldI, LcdC) and benzoyl-CoA reductase subunits BcrA/BcrD; SF4 holds every characterized plasmalogen synthase (single-chain PlsA and C. perfringens PlsA/PlsR), flagged diverged_from_family. Terms: GO:0051539 FAMILY_WIDE; GO:0016887 and GO:0008047 SUBFAMILY_ONLY [SF2] (BcrA/BcrD excepted from activator activity); GO:0008611 SUBFAMILY_ONLY [SF4]; GO:0043717 UNRESOLVED (no member is a dehydratase, but 210 uncharacterized SF2 HGD-D fusions exist). Subfamily composition from a committed UniProt-xref profiling script. No PAINT node annotations exist for the family.
