  summary: 'Create family review: PTHR45718 Ci/GLI'
  details: |
    First family review for the Ci/GLI family, written after three gene curations in this project independently noted its absence. Records the family as HETEROGENEOUS: the Ci/GLI members transduce Hedgehog while GLIS1 and GLIS3 share the zinc-finger architecture without the pathway role. Seven node assessments across four nodes. The central one is PTN001836086, which carries the only Hedgehog assertion and is correctly confined to a Deuterostomia node seeded by vertebrate GLI paralogs; curating Drosophila ci confirmed the consequence from the other side, since ci carries no IBA from that node and rests on its own experimental record. Two assessments are UNRESOLVED because the cached PAINT slice reflects an older, broader partition of the family. The review documents a three-way classification discrepancy: the cached per-family member table and the InterPro API place the ZIC proteins, Odd-paired, GLIS2 and TRA-1 in this family, while PANTHER's current sequence classification places them in PTHR19818. The review follows the current classification, which is what the repository's membership check uses, and asserts no representative member the rebuilt index does not place here; all six were verified against it. Schema validation, live GO label validation, two verbatim quotes and the family/gene cross-check over 247 reviews all pass.
