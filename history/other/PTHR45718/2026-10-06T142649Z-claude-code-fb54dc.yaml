  summary: Adjudicate GO:0001228 and repair references orphaned by the member-index
    change
  details: |
    Three changes, two of them consequences of upstream work rather than of
    new curation.

    GO:0001228 DNA-binding transcription activator activity, RNA polymerase
    II-specific is now assessed, the mirror of the existing GO:0001227
    repressor assessment. It is scoped SUBFAMILY_ONLY to Ci (SF4) and GLI2
    (SF6), the two subfamilies with curated reviews in this repository that
    anchor the activity directly: Ci by genetic interaction with the dCBP
    coactivator and by mutational analysis of decapentaplegic activation, GLI2
    by direct assay as the major transcriptional activator of the pathway and
    typed with exactly this term in four cached GO-CAMs. GLI1 is almost
    certainly in scope on the same grounds and is deliberately left off,
    because it has no curated review here to anchor a subfamily grant. GLIS1
    and GLIS3 are explicitly not assessed either way: they have
    transcriptional activity of their own but are not Hedgehog effectors, and
    nothing here establishes whether this signed term holds for them, so their
    absence is recorded as unexamined rather than denied.

    Upstream made the PANTHER member index a build artifact and deleted the
    committed file, which left this review citing a path that no longer
    exists. The reference now points at panther-members-overrides.tsv, the
    committed curated-exceptions file, and the prose explains that the index
    is regenerated by ensure-panther-members from release-pinned
    classification files.

    The notes also overstated the KIF7 precedent. They cited it as a case
    where the cached table was simply the stale side, used to justify treating
    the current classification as authoritative. The rebuilt index shows
    otherwise: it carries both PTHR24115 and PTHR47969 for those accessions as
    acceptable alternates, so a disagreement between these sources does not by
    itself make the cached side wrong. The note now says so, and makes the
    narrower argument that actually applies to this family, where the two
    partitions differ over which proteins are members at all rather than over
    which subfamily a member sits in.
