  summary: Create PTHR24417 LMTK family review
  details: |
    Created a scoped PTHR24417 family review while reviewing human AATK, the
    missing reviewed human LMTK1 member. Cross-checked the existing human LMTK2
    and LMTK3 reviews against the PAINT file and recorded the family as
    heterogeneous outside conserved protein kinase activity.

    Assessed the broad PTN004704357 protein-kinase IBD as sound across animal
    LMTK kinases, the PTN002815112 LMTK1 tyrosine-kinase IBD as unresolved
    pending a residue-specificity review, PTN002815112 brain-development and
    neuron-apoptosis IBDs as LMTK1-scoped, and the PTN002814775
    endocytic-recycling IBD as LMTK2-scoped. Recorded the three human
    subfamilies so LMTK1-specific PAINT rows remain off LMTK2/LMTK3 and the
    LMTK2 endocytic-recycling row remains off AATK/LMTK3.
