  details: |
    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR43874-tree-nodes.yaml, from `just phylo-family PTHR43874`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

    - PANTHER:PTN008123536 GO:0003700 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree PTN008123536 is the duplication before Viridiplantae with 1245 leaves and three branches, and the five seeds (four type-B ARRs and APRR1/TOC1) sit in two of them. All the listed type-A subfamilies descend from the node and hold none of the seeds, consistent with pruning them.
    - PANTHER:PTN008123536 GO:0043565 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the four type-B seeds all sit in one branch whose common ancestor PTN005187769 lies 6 steps below the duplication node PTN008123536. The listed type-A subfamilies descend from the node and hold no seeds, so they inherit the term only through the root placement.
    - PANTHER:PTN008123536 GO:0006355 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the four seeds (APRR9, APRR7, APRR5 and rice RR22) sit in two of the three branches below the duplication node PTN008123536, which is their common ancestor. The listed type-A subfamilies descend from the node with none of the seeds, consistent with an IRD on the type-A clade.

    Each row now quotes the family's node listing in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
