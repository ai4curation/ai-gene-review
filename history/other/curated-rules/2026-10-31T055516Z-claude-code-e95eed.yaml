  summary: Literature review of the unusual CR-0003 cases
  details: |
    Searched PubMed for the Asgard, Methanoplasma and haloarchaeal UBC cases and cached 9 papers. Asgard ubiquitin systems are expressed and functional in vitro (PMID:31942073, 35697693, 38358888) but proteasomal coupling is not shown. Caldiarchaeum (PMID:29066714, 21169198) has no IPR000426 entry. Methanoplasma termitum has an E1-Ubl-E2-JAB cluster (Mpt1_c00340-00370) matching both archaeal eukaryote-like operons and bacterial anti-phage systems (PMID:39020165, 21547297); recorded as a known weakness of CR-0003 in its notes and RESULTS.md.
