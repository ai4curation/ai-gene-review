  summary: 'Create PANTHER family review: PTHR46197 (PROTEIN ABHD14B-LIKE)'
  details: |
    Created PANTHER family review for PTHR46197 (PROTEIN ABHD14B-LIKE) covering paralogous vertebrate subfamilies SF1 (PROTEIN ABHD14A, single-pass type II Golgi membrane alpha/beta-hydrolase with unknown physiological substrate) and SF2 (PROTEIN-LYSINE DEACYLASE ABHD14B-RELATED, soluble cytosolic/nuclear CoA-dependent protein-lysine deacetylase catalyzing RHEA:45950 via Ser111-Asp162-His188) and invertebrate subfamily SF3 (C. elegans abhd-14). Adjudicated all 3 PAINT IBD nodes, validated catalytic triad residue conservation across 7 model-organism members, and flagged upstream RHEA:45948 inverted lysine-acetyltransferase (GO:0061733) and Reactome R-HSA-156584 cytosolic sulfonation artifacts.
