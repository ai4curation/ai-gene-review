  summary: 'Create family review: PTHR46925'
  details: |
    First family review for PTHR46925 (G-PROTEIN COUPLED RECEPTOR TKR-1-RELATED), the metazoan tachykinin (neurokinin) receptors, written alongside the campaign gene reviews of human TACR3 and mouse Tacr3. The committed PAINT slice (fetched with just fetch-panther-paint PTHR46925) has ten IBD rows over six nodes, all assessed; no IRD/IKR. The root PTN001544873 (Bilateria) carries the family-wide genus terms tachykinin receptor activity and plasma membrane (SOUND). Three subfamily nodes carry the subtype-preferred ligand activities, each SOUND and correctly confined: substance P receptor activity at the SF4/NK1R node PTN002930711, substance K receptor activity at the SF3/NK2R node PTN002930710; the NK3R-specific neuromedin K receptor activity GO:0016498 has NO IBD at the SF1 node PTN002930712, a PAINT gap noted (same shape as the missing TSHB term in PTHR11515). The sperm-midpiece and sperm-motility rows at PTN002538240 (seeded only by the three human receptors from one immunocytochemistry/motility study) are left SOUND because the human TACR3 review keeps them non-core on its own evidence; the human-to-mouse divergence (only the NK2 receptor transcript found in mouse sperm) is handled as member_exceptions on mouse Tacr3 and mouse Tacr1 for both terms, rather than a node change, exactly as the task anticipated. The cross-check confirms the mouse Tacr3 exceptions agree (EXCEPTION_AGREEMENT OK) with the mouse review that marks both terms over-annotated. Two rows (PTN001201778, PTN008610149) sit at PTHR24238 nodes that reach this family only because InterPro cross-assigns the Drosophila TkR86C/TkR99D to SF2 while PANTHER's tree places them in PTHR24238 (confirmed from the TreeGrafter table); their terms are biologically correct, so they are assessed UNRESOLVED with no action, and the fly genes are discussed but not listed as SF2 representatives (the refreshed member index does not place them in SF2, confirming the choice). Four subfamilies: SF1 NK3R/TACR3, SF3 NK2R/TACR2, SF4 NK1R/TACR1, SF2 invertebrate TKR-1-related (C. elegans TKR-1, Ciona, amphioxus); all representative subfamily memberships verified against the refreshed PANTHER member index. Validated with linkml-validate (FamilyReview), linkml-term-validator --labels, quote_check (38 quotes verified), family_residue_validator (56 pass, 0 fail, 0 unresolved) and family_gene_crosscheck (0 conflicts, 2 consistent).
