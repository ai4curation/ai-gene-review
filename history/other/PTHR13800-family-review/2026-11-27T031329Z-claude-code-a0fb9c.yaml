  summary: Family review of PTHR13800 for the dismech vision-disorder alignment
  details: |
    First family review of the TRPM channel family, written for projects/DISMECH_VISION_ALIGNMENT after the TRPM1 gene review and read against the existing worm gon-2, gtl-1 and gtl-2 reviews. Coherence MOSTLY_COHERENT. Cation channel activity, plasma membrane, monoatomic cation transmembrane transport and metal ion transport are family-wide. Calcium channel activity and calcium ion transport are scoped to the calcium-permeable branches; the four IRDs that stop them for TRPM4 and TRPM5, which pass monovalent cations only, are judged supported. All assessed IBD placements are sound. Validated with the family schema, term, reference and quote checks; the family/gene cross-check reports no conflict.
