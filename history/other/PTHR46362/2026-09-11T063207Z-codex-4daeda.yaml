  summary: Complete evidence-grounded family review for PTHR46362
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. Gemin5 WD40-domain structures, binding calorimetry and mutagenesis establish recognition of the Sm site of pre-snRNAs (PMID:27881600). The classified family comprises Gemin5 orthologs rather than unrelated WD-repeat proteins, supporting snRNA binding as the shared function of intact RNA-recognition architecture. This broad activity does not require identical affinities for each snRNA or identical cap recognition; SMN assembly partnership and other translation functions are separate claims. Gemin5 is not itself the spliceosome’s RNA-splicing catalyst. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
