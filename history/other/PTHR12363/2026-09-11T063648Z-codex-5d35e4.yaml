  summary: 'Complete family biological assessment: PTHR12363'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Importin-13 is a bidirectional Ran-dependent transport receptor whose import and export cargoes differ (PMID:11447110); its MAGO-Y14 import complex has a defined structural recognition mechanism (PMID:20122403). Related transport receptors recognize different cargo surfaces. Bidirectional nuclear transport is not synonymous with recognition of a canonical nuclear-export-signal peptide, and Ran supplies the GTPase cycle rather than an intrinsic receptor ATPase. The distribution of GO:0005049 across this family remains unresolved despite positive evidence for transport by characterized members. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
