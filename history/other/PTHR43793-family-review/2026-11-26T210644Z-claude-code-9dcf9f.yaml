  summary: Re-review PTHR43793 against the PANTHER tree, family alignment, UniProt and QuickGO
  details: |
    First REVIEW pass since the CREATE record. The PANTHER 19 tree (26 leaves, 14 internal nodes) and PANTHER's family alignment (872 columns) were both obtained from the PANTHER API; UniProt records and QuickGO rows were read for every tree leaf and reviewed member. The method and all numbers are in interpro/panther/PTHR43793/tree_msa_check.py and its output PTHR43793-tree-msa-check.txt.

    Confirmed: functional_coherence HETEROGENEOUS; the family is the wrong anchor for the heptose adenylylation step; the GO:0016740 row at the root PTN000843327 is SOUND but uninformative; SF2 is the HldC clade (clade node PTN000077683, 9 leaves); the PTN000077680 seed Q58579 has IDA support for both asserted terms.

    Changed:
    - PTN000075336 (GO:0004140, GO:0015937) from SOUND to UNRESOLVED. The node is the root of the PTHR10695 tree and is not in this tree. It enters the slice through two archaeal CoaD members (Q58436, Q8ZY96) that are leaves of the PTHR10695 tree. The first version described the family as containing dephospho-CoA kinases and called coaD a dephospho-CoA kinase; both were wrong. GO:0004140 is now NOT_APPLICABLE to the family.
    - PTN000077680 (GO:0003919, GO:0006747) from SOUND to NEEDS_PRUNING, with ADD_IRD at leaf PTN002887060. That leaf, Nitrosopumilus A9A4T6, is matched by the archaeal CoaD signatures HAMAP MF_00647 and NCBIfam NF001985, not by the RibL rule MF_02115, and is the least RibL-like of the nine leaves in pairwise alignment. The request is classification-based; the protein is not assayed.
    - Withdrawn: the statement that PTN000843327 is a deep node spanning PTHR43793 and PTHR46969. It is the root of this tree only and reaches the PTHR46969 slice through H. pylori HldE (O25529), a leaf here. The PTHR46969 review still carries the earlier wording and was not edited.
    - Member counts corrected (59 of 71 reviewed members are ribL, not 69); SF1 described as the root label and not a clade.
    - reference_protein changed from Q63XZ4 to B. subtilis TagD P27623; an HXGH residue site added (conserved in all 26 leaves except Leu for the second histidine in Q8A705); term assessments added for GO:0016779, GO:0047348 and GO:0004140, with the experimental NOT of RibL for GO:0047348 as a member exception.
    - UniProtKB has deleted A0A2L1CD41 (not part of a reference proteome); its SF2 cross-reference is now quoted from the cached record.

    Not verified: no full text for PMID:20822113, PMID:12756245 or PMID:28727444 (abstracts and the citing UniProt records only; none is in the publications cache, so none is quoted). The three longer archaeal leaves under PTN000077680 and the three eukaryotic leaves are uncharacterised.
