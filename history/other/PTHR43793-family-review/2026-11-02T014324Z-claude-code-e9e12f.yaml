  summary: Create family review for PTHR43793 (FAD synthase fold; HldE adenylyltransferase
    subfamily)
  details: |
    New FamilyReview required because UniProt assigns two accessions grounded in the module (Q63XZ4, A0A2L1CD41) to PTHR43793:SF2. Marked HETEROGENEOUS and deliberately NOT adopted as the module's family term for the adenylylation step: the official family name is FAD SYNTHASE, 69 of 71 classified members are FAD synthases, and the family's PAINT nodes assert only FMN adenylyltransferase/FAD biosynthesis (PTN000077680), dephospho-CoA kinase/CoA biosynthesis (PTN000075336) and a bare transferase term (PTN000843327) - no node asserts any heptose activity. All five rows assessed SOUND, with the GO:0016740 row recorded as correct but vacuous and noted as a deep node shared with PTHR46969. The module instead grounds that step on PTHR46969 plus direct evidence and cites SF2 only as a subfamily pointer. PAINT slice fetched with just fetch-panther-paint.
