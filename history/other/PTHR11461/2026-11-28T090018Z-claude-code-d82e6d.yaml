  details: |
    Created with the SERPINA6 gene review. Assesses the root extracellular region IBD (SOUND) and the GO:0004867 IBD at PTN008970140 (NEEDS_PRUNING), requesting three separate IRDs: PTN008322172 (corticosteroid-binding globulin, 14 leaves), PTN008518322 (angiotensinogen, 20 leaves) and PTN000894615 (thyroxine-binding globulin, 13 leaves). Clade nodes were read from the cached PANTHER tree, not guessed. GO:0004867 is scoped FAMILY_WIDE with member exceptions for SERPINA6, AGT, SERPINA7 and human and mouse serpin H1. Not a survey of all 108 subfamilies; the other inhibitor IBD rows and clade B/E/F/H process rows are not assessed (review_status IN_PROGRESS). Validated with linkml-validate, the reference validator, quote_check, family_residue_validator and family_gene_crosscheck (0 conflicts).
