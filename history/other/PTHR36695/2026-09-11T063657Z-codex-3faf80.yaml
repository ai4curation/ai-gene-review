  summary: 'Complete family biological assessment: PTHR36695'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. The published Cys-loop phylogeny places Dmel NTR outside both nicotinic acetylcholine-receptor groups (PMID:30429615, Extended Data Figure 10d), and FlyBase classifies it with unclassified ligand-gated ion-channel subunits. This supports a channel-family mechanism without identifying acetylcholine, another transmitter or a particular ion as its ligand/substrate. No exact-target electrophysiological gating assay is available in the inspected sources, so the exhaustive activity grant remains unresolved. The additional methyltransferase-domain match is not evidence for a methyltransferase reaction. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
