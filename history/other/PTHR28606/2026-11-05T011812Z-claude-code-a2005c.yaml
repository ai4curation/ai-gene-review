  summary: 'PTHR28606: current state of GO:0038145; taxon and binding-site wording'
  details: |
    Supersedes the 2026-10-24 CREATE record, which described GO:0038145 (macrophage colony-stimulating factor signaling pathway) as a family-wide term. The merged file (squash commit 5aefe1e45c; intermediate PR commits are not in local history) does not match that description: the review assesses GO:0005125, GO:0061514, GO:0005157, GO:0005576, GO:0045651, GO:0045657 and GO:0008284 and does not assess GO:0038145, which is defined by CSF1 binding and is modified to GO:0061514 in the IL34 gene review; this is now stated in notes. This session also replaced 'jawed-vertebrate' with bony-vertebrate (Euteleostomi is the paint.tsv taxon), removed the unverified 'root' wording for PTN002823014 (documenting that all five terms are seeded only by Q6ZMJ4), and replaced the unsourced D2-D3 junction claim with the N-terminal immunoglobulin domains stated in PMID:22483114.
