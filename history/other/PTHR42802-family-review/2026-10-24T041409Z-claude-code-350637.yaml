  summary: 'Family review: PTHR42802'
  details: |
    Created the family review for PTHR42802 (siderophore N-hydroxylating class B flavoprotein
    monooxygenases) for the pyoverdine precursor-supply module. Reference protein is PAO1 PvdA
    (Q51548), whose gene review was completed in the same change. Coherence is MOSTLY_COHERENT:
    the family is uniform for FAD/NADPH-dependent N-hydroxylation of an omega-amino substrate in
    hydroxamate siderophore biosynthesis, which is why GO:0006879 intracellular iron ion homeostasis is
    scoped FAMILY_WIDE and the PAINT node PTN001009003 is assessed SOUND; but it is not uniform on
    substrate, since its single subfamily SF1 also contains the lysine N6-monooxygenases (IucD, MbtG)
    and putrescine N-hydroxylases (AlcA, PubA, FbsI). GO:0031172 is therefore scoped UNRESOLVED rather
    than granted: no subfamily separates the substrate classes, and the residues that would discriminate
    them have not been curated here, so no RESIDUE_DETERMINED scope or residue site is asserted. The
    review states explicitly that modules needing the ornithine-specific activity should ground it on
    member proteins, which is what the module does. The node assessment also records that the PAINT
    row's taxon (NCBITaxon:451864 Dikarya) is narrower than the set of recipients, flagged as a question
    about the recorded taxon rather than a placement error.
