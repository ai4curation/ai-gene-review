  summary: Curate PTHR10361 (SLC10/BASS) family review with structure-derived residue
    sites
  details: |
    New FamilyReview for PANTHER:PTHR10361 carrying two curated residue sites derived from the structural analysis under genes/human/SLC10A4/SLC10A4-bioinformatics/: na_coordination (the seven side-chain sodium ligands of human NTCP, read from ligand contacts in PDB 9QZQ and 7ZYI, deliberately excluding the eight main-chain-only contacts) and bile_salt_polar_anchors (N103, N262, Q264 from bound glycochenodeoxycholate in 7ZYI, recorded as CONTRIBUTES rather than REQUIRED because ASBT transports bile salts with only two of the three). Controls: ASBT, SOAT and rat Ntcp positive for the sodium site, SLC10A7 negative; rat and mouse Ntcp positive for the polar anchors. Every control position was verified against the live UniProt sequence before being written. A third candidate site, the preS1 myristoyl pocket, was considered and deliberately not curated: the residue-site validator rejected it because the only protein with both the pocket and the receptor function is the anchor itself, and because the pocket is generic hydrophobic residues so a paralogue that has lost the function still carries expected residues. Rodent Ntcp retains all six positions while restricting infection, so the pocket does not determine the function; the observation is kept in the GO:0001618 term assessment as a scoping statement instead. Also adds seven RETAINED residue claims to the SLC10A4 GO:0015721 removal, replacing residue_claims_not_applicable, so that removal cannot be misread as a claim of residue degeneration.
