  summary: Add atom-level contact provenance to residue sites after external review
  details: |
    External review of the SLC10 structural work made three corrections. (1) The AlphaFold paralogue models are apo and protein-only: the ions and bile salt are NTCP's, projected by superposition, so retention of the ligand set argues against one explanation of SLC10A4's orphan status but is not evidence that it binds sodium or transports anything. Wording tightened in both RESULTS.md files, the SLC10A4 review reason and the family review notes. (2) The bile-salt shell is fuzzier than the ion site; the curated set is now explicitly the polar pair N262/Q264, with N103 demoted to a peripheral contact after measuring that its nearest atom to the ligand is CB at 3.69 A with the amide ND2 at 3.98 A, consistent with ASBT substituting that position while still transporting bile salts. (3) A curated site should remember which atom makes the contact, not just that a residue is near a ligand. Added optional contact_atom, contact_via, contact_distance, contact_ligand and contact_structure slots to Residue with a ContactViaEnum, tests first, and populated them from the analysis. That immediately surfaced a provenance split the residue-level record hid: E257 coordinates sodium through its carboxylate (OE2, 2.76 A) in 7ZYI, while in 9QZQ the nearest atom of the same residue is the backbone O at 2.94 A, so a distance is only interpretable with its source entry attached.
