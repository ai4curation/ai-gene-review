  summary: Rescope the GO:0001618 assessment on PTHR10361
  details: |
    The GO:0001618 virus receptor activity assessment had granted the term at subfamily level (applicable_subfamilies: SF40). PTHR10361-entries.csv places human SLC10A1 (Q14973), mouse Slc10a1 (O08705) and rat Slc10a1 (P26435) all in SF40, yet rodent Ntcp does not support HBV entry, so no subfamily-level grant is correct. Changed scope to UNRESOLVED (the enum's 'investigated but undecided') and removed applicable_subfamilies from the file, with a scope_reason naming SF40 as tried and rejected and the rodent members as the reason. The missing mechanism - a taxon restriction narrower than a PANTHER subfamily - is recorded as a schema gap rather than hidden in a scope value.
