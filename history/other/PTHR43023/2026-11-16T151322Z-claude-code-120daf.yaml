  details: |
    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR43023-tree-nodes.yaml, from `just phylo-family PTHR43023`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

    - PANTHER:PTN000655692 GO:0120014 (NEEDS_PRUNING): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PTN000655692 is the LUCA family root over 3 subfamilies and the single MlaF seed sits 6 steps below it; the proposed exclusion of the Mkl/MceG clade rests on transporter substrate, which the tree cannot settle.
    - PANTHER:PTN000655704 GO:1990531 (WRONG_NODE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PTN000655704 is a Eubacteria speciation node with 18 leaves in one subfamily and the MlaF seed 4 steps below; the objection is to the complex type chosen, which no node placement can fix.
    - PANTHER:PTN000655704 GO:0120010 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree PTN000655704 is a Eubacteria node whose branches include an Actinomycetales clade separate from the Proteobacteria branch, and the single E. coli MlaF seed sits 4 steps below, so the actinobacterial branch inherits the term without a seed of its own.

    Each row now quotes the family's node listing in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.

