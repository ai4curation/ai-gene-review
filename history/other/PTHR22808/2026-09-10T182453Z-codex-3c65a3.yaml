  summary: Curate PTHR22808 family function boundaries
  details: |
    Curated Ncl1/Trm4-related RNA cytosine methyltransferases. Assessment: HETEROGENEOUS. The integrated family description establishes RNA C5-methylation chemistry but not one universal RNA target. The experimentally sourced Trm402 record distinguishes its tRNA-site spectrum and Trm4 paralog specificity. A C34-specific prediction requires direct target-site evidence and cannot be validated by the broad family label. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
