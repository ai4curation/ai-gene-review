    - PANTHER:PTN000438758 GO:0005948 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the 3 seeds bracket this LUCA node and lie in SF13 and SF170, while SF129, SF14, SF9 and SF166 lie below it with 15, 5, 5 and 36 leaves and none of the seeds, so pruning them removes no seed.
    - PANTHER:PTN000438682 GO:0003984 (NEEDS_PRUNING): the reason made a claim the tree contradicts; the reason was corrected. Added to the reason: In the PANTHER 19.0 tree the 7 seeds sit in one branch 1 step below this family root. SF9 and SF133 lie below the node with no seeds, but SF166 holds one seed, M. tuberculosis IlvG, so SF166 is not a HACL2-only subfamily and cannot be pruned whole.

