  summary: Independent re-review of the PTHR11438 family review against the PANTHER
    tree, family alignment, QuickGO and literature
  details: |
    First REVIEW pass on a file that had only a CREATE record. Every claim was checked against primary data.

    Data used. PANTHER 19 tree (71 leaves) and PANTHER family alignment fetched from the PANTHER API by the new interpro/panther/PTHR11438/tree_msa_check.py, which writes PTHR11438-tree-msa-check.txt (raw tree, alignment and UniProt payloads stay in the git-ignored .cache). Alignment rows of the reviewed leaves are identical to the current UniProt sequences, so residue numbers are UniProt numbering of the named accession. Experimental GO annotations for all 71 leaves and term-level comparator queries were read from QuickGO on 2026-11-26; each negative was checked against a query shape that returns positives. Literature: cached abstracts for PMID:7481766, PMID:7566152, PMID:8710928, PMID:7057924, PMID:10098940; PubMed abstracts only (not cached, not quoted) for PMID:8798582, PMID:11290742, PMID:14522087, PMID:15891003, PMID:17069980, PMID:20463905, PMID:20937278, PMID:21247980, PMID:22311985, PMID:6933569, PMID:11826101.

    Corrected.
    - The clade nodes of two subfamilies were swapped: PTN002605991 is the prodynorphin clade (SF4) and PTN002606008 the prepronociceptin clade (SF2). The node assessments for GO:0099013, GO:0097060 and GO:0007270 had been justified with the wrong protein (dynorphin evidence on prepronociceptin rows and the reverse).
    - SF5 (teleost prepronociceptin duplicate, node PTN000153743) was missing and has been added.
    - GO:0001515 opioid peptide activity at the root: SOUND changed to NEEDS_PRUNING with ADD_IKR at PTN000153720 (mammalian prepronociceptin). All 13 mammalian leaves encode the identical Phe1/Leu14 nociceptin and no Tyr-Gly-Gly-Phe core; that peptide does not activate opioid receptors (PMID:7481766). Non-mammalian prepronociceptin keeps Tyr1/Trp14 and is left unpruned. Term scope changed from FAMILY_WIDE to SUBFAMILY_ONLY (SF3, SF4), which now agrees with the human PNOC gene review. A residue site (opioid_message_tyr) records the position with controls.
    - GO:0097060 synaptic membrane at the prepronociceptin node: SOUND changed to UNRESOLVED. The seed (mouse Pnoc IGI, PMID:22311985) concerns nocistatin and NIPSNAP1 as far as the abstract shows; nocistatin is alignable only in therian mammals. Full text could not be obtained, so no PAINT action is proposed.
    - GO:0001515 was described as a child of GO:0005184; its parent is GO:0048018. Removed.
    - The request that PAINT add GO:0038003 and GO:0031635 at the root was withdrawn: the only experimental ligand row for GO:0038003 in the family is mouse Penk, which would support the proenkephalin node at most, and GO:0031635 has no ligand seed at all. Both remain FAMILY_WIDE as statements of biology, with ligand-level quotes for nociceptin.
    - functional_coherence COHERENT changed to MOSTLY_COHERENT.

    Confirmed. Root rows GO:0043025, GO:0031628, GO:0007218 and GO:0019233 remain SOUND (with recorded caveats on qualifier and on seeds present in only one or two child clades); GO:0099013 at the proenkephalin and prodynorphin nodes and GO:0007270 at the prepronociceptin node remain SOUND. The six N-terminal cysteines and the dibasic-flanked cores are conserved across the family.

    Not verified. The GO:0001515 seed (bovine PENK P01211) and the human PENK seed for GO:0019233 have no experimental row in QuickGO today. Seed papers PMID:16924480, PMID:2695900, PMID:7911809, PMID:8847409 and PMID:8849726 were not read. Opioid activity of non-mammalian nociceptins is untested in any tree species.

    Validation: just validate-families, just validate-quotes, just validate-history.
