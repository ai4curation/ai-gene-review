  summary: Add 4HB and 3HB dehydrogenase term scopes for SF102
  details: |
    Added the two adjudications the bacterial_4_hydroxybutyrate_oxidation module needed, which were reported as FAMILY_FUNCTION_UNREVIEWED. GO:0047577 4-hydroxybutyrate dehydrogenase activity is scoped SUBFAMILY_ONLY to SF102, established by the assayed Cupriavidus necator GHBDH (Q59104), with the same caveat the existing GO:0120542 entry carries: SF102 is a mixed subfamily PANTHER does not split, so the term is safe only for the GHBDH-type clade within it. A member_exception records P. putida PP_2650 (Q88JJ9), whose own review marks the substrate-specific term as an over-annotation. GO:0003858 3-hydroxybutyrate dehydrogenase activity is likewise scoped to SF102 on the assayed PP_2049 (Q88L86), noting that the classical bacterial enzymes for that reaction are short-chain dehydrogenases outside this family. Cross-check against the gene corpus reports no conflicts.
