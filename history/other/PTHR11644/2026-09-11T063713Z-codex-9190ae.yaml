  summary: 'Complete family biological assessment: PTHR11644'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. The actual SF2 inventory contains Aspergillus blasticidin-S deaminase P0C2P0 alongside cytidine deaminases. Substrate/intermediate/product structures establish deamination of the antibiotic's cytosine moiety (PMID:17959604), demonstrating that the same broad family and SF2 label do not uniquely identify free-cytidine salvage. Plant CDA4/CDA9 inactive labels remain hypotheses unless their catalytic architecture is independently verified; they are not used as proof of exact-target loss. CG8353's cytidine-deaminase assignment supports a deamination hypothesis but does not license RNA editing, dCMP deamination or every antibiotic substrate. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
