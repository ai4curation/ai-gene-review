    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR11972-tree-nodes.yaml, from `just phylo-family PTHR11972`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

