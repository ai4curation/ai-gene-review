  summary: Add term and node assessments for the PDE6 lineage to the PTHR11347 family
    review
  details: |
    The existing review of the cyclic nucleotide phosphodiesterase family had no term or node assessments. Added for projects/DISMECH_VISION_ALIGNMENT after the PDE6A, PDE6B and PDE6C gene reviews; the existing text is unchanged apart from one dated sentence in notes. The cAMP-directed terms at the family root PTN001682918 (cAMP phosphodiesterase activity and negative regulation of cAMP/PKA signalling) are kept family-wide with the node marked NEEDS_PRUNING for the three cGMP-specific PDE6 subfamilies, and PDE6A, PDE6B and PDE6C are recorded as member exceptions. cGMP phosphodiesterase activity at the root is left UNRESOLVED for the lineages PANTHER names cAMP-specific. Retina development at the rod PDE6A and PDE6B nodes is judged WRONG_NODE (the seeds are degeneration phenotypes); outer segment membrane at those nodes and visual perception at the PDE6C node are sound. Nodes off the PDE6 lineage were not assessed. Validated with the family schema, term, reference and quote checks; the family/gene cross-check reports no conflict.
