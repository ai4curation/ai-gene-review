    - PANTHER:PTN009019570 GO:0060306 (TOO_DEEP): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree this is the Chordata node, and its single seed, human AKAP6 in SF2, lies 11 steps below it, so the term sits well above its only evidence, consistent with restricting it to a vertebrate AKAP6 node.
    - PANTHER:PTN009019570 GO:1901897 (TOO_DEEP): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree this is the Chordata node, and its single seed, rat Akap6 in SF2, lies 9 steps below it, consistent with restricting the term to a vertebrate AKAP6 node.

