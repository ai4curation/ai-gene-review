  summary: 'Complete family biological assessment: PTHR11200'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Synaptojanin/OCRL-related proteins share phosphoinositide 5-phosphatase chemistry but differ in auxiliary domains and localization. Fly synaptojanin functions with endophilin in synaptic-vesicle recycling (PMID:14622578). Synaptojanin additionally contains a Sac1 phosphatase domain with distinct substrate chemistry; selective impairment of Sac1 and combined impairment of both phosphatase domains produce different experimental and disease associations (PMID:27435091). Sac1-dependent 4-phosphate removal cannot be assigned to relatives that possess only the 5-phosphatase module, and neuronal vesicle recycling is not the function of all OCRL/INPP5-like members. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
