  summary: Curate PTHR22594 family function boundaries
  details: |
    Curated Aspartyl/asparaginyl tRNA synthetase-related proteins. Assessment: HETEROGENEOUS. The official family definition explicitly spans Asp/Asn ligases, while biochemical characterization establishes DARS2 as mitochondrial AspRS. A DARS2 annotation should be scoped to the mitochondrial AspRS lineage rather than transferred across the amino-acid specificity boundary. DARS2 can also be assayed for misacylation of tRNA-Asn; that is a separate substrate question and does not make it an asparagine-activating enzyme. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
