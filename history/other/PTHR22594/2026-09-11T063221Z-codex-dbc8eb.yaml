  summary: Complete evidence-grounded family review for PTHR22594
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. The official family definition explicitly spans Asp/Asn ligases, while biochemical characterization establishes DARS2 as mitochondrial AspRS. A DARS2 annotation should be scoped to the mitochondrial AspRS lineage rather than transferred across the amino-acid specificity boundary. DARS2 can also be assayed for misacylation of tRNA-Asn; that is a separate substrate question and does not make it an asparagine-activating enzyme. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
