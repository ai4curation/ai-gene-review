  summary: Create family review for PTHR46969 (bifunctional HldE kinase/adenylyltransferase)
  details: |
    New FamilyReview for the family carrying both of the module's middle steps. Marked COHERENT: one subfamily holding both fused bifunctional HldE proteins and the split single-domain HldA kinases. The three PTN000062036 rows (seeded by E. coli HldE P76658) are SOUND; the GO:0016740 row at PTN000843327 is SOUND but vacuous and is seeded by an archaeal FAD synthase, the same deep node shared with PTHR43793. GO:0033786 is scoped SUBFAMILY_ONLY with an explicit member_exception for B4EB35 (Burkholderia cenocepacia HldA), a 316-residue split kinase that lacks the C-terminal cytidylyltransferase domain entirely, the adenylylation being carried by a separate HldC protein; this agrees with the REMOVE action in the hldA gene review and clears a family/gene cross-check conflict.
