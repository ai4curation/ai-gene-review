  summary: Record the E. coli HldE IDA grounding on the cytosol node assessment
  details: |
    Review follow-up on PR #5909, finding 4. Two gene reviews in this PR cite this node assessment for experimental grounding that the assessment did not contain: its reason said only that the family comprises soluble cytoplasmic enzymes acting on phosphorylated sugar intermediates, and never recorded that the node's single seed, E. coli HldE P76658, carries IDA cytosol rows. The assessment_reason now records that grounding and names the two independent E. coli proteomics studies behind those rows, the K-12 biochemical-fractionation proteome (PMID:15911532) and the cytosolic abundance proteome (PMID:18304323), both added to supported_by and declared in references. It also states honestly that neither paper names HldE in the text available here, so they establish the experiments behind the IDA rows rather than supplying target-specific peptide evidence, the per-protein assignment being the curator's. Finally it records that leaf rows in this family reach the term through TreeGrafter graft nodes, PTN002931072 for B4EB35 and PTN005327360 for Q88D93, whose descent from this node follows from the TreeGrafter mechanism and is not checkable in the committed PAINT slice.
