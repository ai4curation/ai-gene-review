  summary: Complete evidence-grounded family review for PTHR14338
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. Human XB130/AFAP1L2 interacts with SRC, and deletion or depletion experiments affect SRC signaling (PMID:17412687), providing direct adaptor evidence. AFAP1, AFAP1L1 and AFAP1L2 share PH-domain-associated scaffolding architecture but differ in actin and signaling partners. SRC activation and a particular phosphoinositide preference are not universal family properties. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
