  summary: 'Create: PTHR14234 family review (RIM-binding proteins)'
  details: |
    New FamilyReview for PANTHER:PTHR14234. Verdict MOSTLY_COHERENT; the RIMBP3 subfamily has diverged. The mitochondrion node PTN001022784 and the benzodiazepine receptor binding node PTN008554881 are seeded only by human TSPOAP1, whose experimental rows rest on one 1999 study that UniProt cautions against: the first is judged a wrong node and the second too deep (it also reaches RIMBP3), and both terms are assessed not applicable. Adaptor activity and the active-zone component are placed by PAINT only on the RIM-BP2 clade (sound); the review scopes them to the TSPOAP1 and worm rimb-1 subfamilies as well, which do the same bridging but receive no IBA. Members read: human TSPOAP1 and RIMBP2, worm rimb-1. Validated per file with linkml-validate, the term validator, the reference validator and quote_check.
