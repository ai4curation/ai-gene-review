  summary: Review PTHR30538, KamA-family radical SAM aminomutases
  details: |
    New family review, written because E. coli EpmB belongs here. The radical SAM/PLP 2,3-aminomutase chemistry and the [4Fe-4S] requirement are FAMILY_WIDE. GO:0050066 L-lysine 2,3-aminomutase activity is left UNRESOLVED on purpose: it is defined by the (3S)-forming clostridial reaction, so it fits KamA but not EpmB, whose product is the (R) enantiomer, nor the C. difficile glutamate 2,3-aminomutase, and no GO term exists for RHEA:44148. Both PTN000776770 IBD rows are assessed SOUND, with a note that the general intramolecular aminotransferase parent should not be refined to GO:0050066 family-wide. Notes record that SF1 holds both the EF-P-dedicated EpmB orthologs and the metabolic KamA enzymes, which is why the module grounds EpmB as a concrete protein.
