  details: |
    Follow-up on the CHANGES_REQUESTED review of PR #3139, addressing the three blocking items and three of the suggestions.

    1. GO ancestry path corrected (review_summary and go_specificity.notes). The review claimed GO:0140673 is a descendant of GO:0006366 'via GO:0006368 -> GO:0006354 -> GO:0006366'. GO:0006354 is not a step on that path. Verified against QuickGO's ontology graph: GO:0140673 part_of GO:0006368, GO:0006368 part_of GO:0006366, and GO:0006368 is_a GO:0006354, with GO:0006354 part_of GO:0006351 - so GO:0006354 is the pan-polymerase is_a parent of GO:0006368 and sits outside GO:0006366 entirely. The conclusion (over-breadth, not wrong-branch) is unaffected and survives via the direct part_of chain.

    2. The falcon report's zero-output inference is now explicitly overturned rather than left standing. Added a findings entry on the falcon reference quoting its claim verbatim, with finding_review finding_status OVERTURNED, superseded_by file:yeast/CHD1/CHD1-goa.tsv, and a verbatim GOA snippet in supported_by. Also annotated rule.reviewed_protein_count / unreviewed_protein_count as unsynced init-time placeholders rather than measurements: no -analysis.yaml exists because just analyze-rule refuses 55 condition sets, so the 0/0 pair must not be read as 'annotates nothing'. Live output confirmed against QuickGO: GO:0006366 IEA GO_REF:0000117 WITH ARBA:ARBA00028158 on P32657 (also present in this repo's genes/yeast/CHD1/CHD1-goa.tsv), P30561 and O94267.

    3. The spt16 suggested_modification was NOT changed to 'already retracted' as the review requested, because that premise is false. The review flagged that genes/SCHPO/spt16/spt16-goa.tsv has no GO:0006366 row. It does not, but that cached file's UniProt rows are dated 20260302, whereas QuickGO returns the row for O94267 dated 20260727 (re-checked 2026-10-18). The row is live; the repo cache is stale. Both the review_summary passage and suggested_modification #8 now carry that provenance so the apparent contradiction with the cached snapshot is resolved rather than re-flagged.

    Suggestions also applied, each verified first: taxon singletons recomputed from the rule's own condition_sets as 22 of 25 distinct constraints, not 21 (two places); CHD1's GO:0006357 IDA re-attributed to ComplexPortal, not SGD (QuickGO assignedBy, matching the repo GOA snapshot); the mouse Ahr GO:0006357 PAINT IBA described as seven WITH/FROM donor sources across four species (fly, mouse, human, zebrafish) rather than 'seven-species'; and CS6 removed from the PMID:38397413 finding's well-supported list so it matches review_summary, which deliberately excludes it because that clause reaches TAF4 only via the ubiquitous histone fold.

    Not addressed: the PR description's inversion of the confidence field's meaning. The body is PR metadata, not a repository file.

    just rules-validate passes. HTML re-rendered via render_rule_review_html directly, since just render-rule depends on analyze-rule, which refuses this rule.
