  summary: 'Review ARBA00028158 (GO:0006366): recommend SPLIT of a 55-clause Pol II
    mega-rule'
  details: |
    Initial review of ARBA00028158, which emits GO:0006366 (transcription by RNA polymerase II) from 55 OR-ed condition sets. Triggered by geneontology/go-annotation#6562, which reports the term on chromatin remodeller UniProtKB:O94267 (S. pombe spt16, FACT).

    Recommended action SPLIT. Eight InterPro-based clauses correctly identify Pol II machinery (Spt6, ELL, TFIIF-beta/RAP30, TAF4, TAF2, Elongin A) and the term is well supported for them. The remaining 47 clauses are keyed on CATH FunFams; 27 fire on a single FunFam and 13 have neither a second signature nor a taxon restriction, so under OR semantics any one over-broad clause independently triggers the annotation.

    Verified independently of the deep research: (1) S. cerevisiae CHD1 (P32657) matches condition set 14 exactly and carries the GO:0006366 IEA GO_REF:0000117 ARBA00028158 row despite already having GO:0006338 IDA, GO:0006357 IDA, GO:0006368 IGI/IPI and GO:0006369 IMP from SGD; (2) mouse Ahr (P30561) matches the Glires-restricted condition set 33 and carries the same ARBA row next to a seven-species GO:0006357 PAINT IBA; (3) GO:0140673 is a DESCENDANT of GO:0006366 via GO:0006368 and GO:0006354, so for FACT/CHD1 the complaint is over-breadth, not a wrong-branch error - CS33/AHR is the one genuinely mis-branched clause since GO:0006357 sits outside GO:0006366.

    Correction to the upstream report: none of O94267's five FunFams and none of its eleven InterPro entries appear anywhere in the current rule JSON, so the specific annotation complained of is not reproducible from the 2026-05-04 rule version and appears to be a stale row surviving a rule edit. The class of complaint is nonetheless real and reproducible via CS14.

    Left as IN_PROGRESS (needs_followup) because of two tooling limits, not open science: only one deep-research provider was reachable (perplexity HTTP 401 insufficient_quota, cyberian not registered, openai model_not_found for o3-deep-research-2025-06-26), against a two-provider convention; and 'just analyze-rule' refuses the rule because 55 condition sets exceed its maximum of 12, so there is no -analysis.yaml, no entries, and no computed pairwise overlap. The condition_overlap assessment is structural (shared CATH superfamilies across clauses) rather than protein-set-based.
