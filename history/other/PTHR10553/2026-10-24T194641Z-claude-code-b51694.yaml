  summary: 'PTHR10553: except SNRPGP15 pseudogene from family-wide RNA binding'
  details: |
    Added a member_exceptions entry for UniProtKB:A8MWD9 (SNRPGP15) on the FAMILY_WIDE GO:0003723 assessment. SNRPGP15 is a processed pseudogene of SNRPG whose reference sequence is interrupted by a TGA stop at codon 75, with no evidence of an expressed product; its gene review marks the IBA over-annotated. No pruned node is named because this is a retrocopy, not a clade-level loss. Resolves the family/gene cross-check FAMILY_GENE_DISAGREEMENT, which now reports EXCEPTION_AGREEMENT OK.
