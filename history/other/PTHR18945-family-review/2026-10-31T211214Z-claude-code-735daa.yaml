  summary: 'Family review: PTHR18945 neurotransmitter-gated ion channel'
  details: |
    New PANTHER family review (NEEDS_REVIEW). Node membership read from PANTHER's leaf GAF. 60 of 85 PAINT rows assessed against the 24 reviewed nAChR member gene reviews plus primary literature (PMID:32272141, PMID:18191228; the latter newly cached). Findings: PTN000434994 is the cation-lineage root despite its Eukaryota taxon label; PBO-5/PBO-6 proton-gated subunits wrongly inherit acetylcholine-gated activity, complex and cholinergic transmission (NEEDS_PRUNING on PTN000435512, PTN001825278, PTN001054960); the serotonin-gated gain at PTN004502671 is too deep (cancelled by three IRDs); the GO:0042391 IRDs on 5-HT3 nodes are contradicted; GO:0050910 at the alpha10 node is the wrong term; GO:0005231 (excitatory) on the anion-selective PTN001055382 is flagged. Follow-up: the 25 GABA-A/glycine/5-HT3 gain rows have no reviewed members and remain unassessed.
