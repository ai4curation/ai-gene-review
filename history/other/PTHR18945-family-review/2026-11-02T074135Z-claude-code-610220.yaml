- type: EDIT
  outcome: changed
  summary: Stop calling NtR a reviewed member of this family
  details: |
    The PTN000434994 rebuttal opened 'One reviewed member does dispute this row', which contradicts the rest of the file: notes enumerates the reviewed members as the 24 nAChR subunits, CRT1, GABRA1 and GABRB2, and NtR is deliberately not among them because its UniProt DR PANTHER lines place it in PTHR36695. That exclusion is what makes the count statements elsewhere true ('all 15 member reviews accept it', 'all 24 nAChR member reviews accept it'), so describing NtR as a reviewed member undercut them. Reworded to 'One gene with a review in this repository does dispute this row, though it is not among this family's reviewed members', which keeps the force of the dispute without placing NtR inside the population the counts exclude. Verified on the parsed value, not the file text: the clause reads correctly and no parsed reason in the file contains a doubled apostrophe.
