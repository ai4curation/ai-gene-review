  details: |
    The approving review on PR #5824 listed suggestions only, but three were defects introduced by this branch's own commits, so they are fixed here rather than deferred. (a) 'the 17 nAChR subunits, CHRFAM7A' double-counted CHRFAM7A in three places; human has 16 CHRN* subunits in this family (9 alpha, 4 beta, delta/epsilon/gamma), with CHRFAM7A separate, confirmed against the leaf GAF. (b) The PTN008360627/GO:0098794 assessment said GABRA1 'accepts the row' when its action is MODIFY; reworded to say it adjudicates by MODIFY, a refinement of grain rather than a dispute of placement, which is why the verdict stays SOUND. (c) The PTN008360627/GO:0004890 assessment asserted that GABRA1 accepts the activity on direct experimental evidence without citing it; GABRA1's IDA row is now quoted. Also: completed the two remaining mid-phrase quotes; reworded the GO:0007274 scope to-do, since the CHRNA3 seed question is about that seed's source paper and the tree check cannot answer it; and recorded that PTN008566881/GO:0022834 is redundant with GO:0160128 at the same node rather than merely correct. Not attempted, and stated on the PR: a subfamilies entry for the GABA-A clades, and residue_sites for the M2 GEK ring and loop-C cysteines.
