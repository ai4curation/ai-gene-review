- type: EDIT
  outcome: changed
  summary: Fix a literal doubled apostrophe introduced in the NtR clauses
  details: |
    The previous commit added the same NtR clause to three assessment_reason fields with a script that escaped the apostrophe as '' for all three. Only one of the three targets (PTN001054960) is a single-quoted YAML scalar, where that escaping is correct; the other two are plain scalars, where it is literal. PTN000435923 was written with a plain apostrophe and was fine, but PTN001825467 kept the doubled form, so its parsed text read 'the cause is NtR''s family assignment'. Fixed. Verified by parsing the document and scanning every string value rather than reading the raw text: zero parsed strings in the file now contain a doubled apostrophe, and all three NtR clauses parse identically. Nothing else changed. Lesson recorded for the next scripted edit: the escaping depends on the quoting style of the specific block being edited, so a single replacement string applied across blocks is unsafe.
