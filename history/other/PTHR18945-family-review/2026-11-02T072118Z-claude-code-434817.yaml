  summary: Fix generator boilerplate wording on two GABA-A node assessments
  details: |
    Two wording defects in text this branch wrote, both from one generator prefix applied to all eight rows at PTN008360627. (a) The GO:1904862 reason claimed GABRA1 'accepts the row' when its action is KEEP_AS_NON_CORE; it now says the row is retained rather than accepted as core, which is what that action means. (b) The GO:0098794 reason, rewritten in the previous commit, had a duplicated verb and the broken construction 'replaces the broad postsynapse term to postsynaptic membrane'; it now reads 'handles this row by MODIFY' and 'refines the broad postsynapse term to postsynaptic membrane'. Rather than fix only the two rows reported, every assessment claiming a cited review accepts a row was checked against that review's actual action: 42 accept-claims checked, the two above were the only real mismatches, and three apparent hits on PTN000436077 (GO:0007274, GO:0035094, GO:0099171) are correct prose that already distinguishes the accepting reviews from the UNDECIDED and non-core ones.
