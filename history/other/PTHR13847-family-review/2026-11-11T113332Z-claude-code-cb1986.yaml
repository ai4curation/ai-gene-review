  summary: Record PP_1255 in PTHR13847:SF289 as a mixed subfamily
  details: |
    SF289 is marked diverged and documented as mixed: ThiO glycine oxidases and the cyanide synthase subunit HcnC alongside the KT2440 cis-4-hydroxy-D-proline dehydrogenase PP_1255, which is a homomeric FAD enzyme acting on hydroxyproline rather than glycine. Glycine-oxidase and thiamine-biosynthesis terms must not reach PP_1255, and hydroxyproline terms must not reach ThiO or HcnC; the P. aeruginosa multi-subunit enzyme is of separate origin, so the activity is not an SF289-wide trait. The module consequently grounds its oxidase step on the PP_1255 exemplar and an InterPro signature rather than on this subfamily.
