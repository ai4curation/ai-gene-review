  summary: 'Create family review: PTHR10858'
  details: |
    Created a structured PANTHER family review for PTHR10858 (DEOXYRIBONUCLEASE II), which modules use as a participant. The review records 8 subfamilies with verbatim PANTHER labels and gives the family MOSTLY_COHERENT coherence: deoxyribonuclease II activity holds family-wide, but apoptotic DNA fragmentation does not. It assesses the root PAINT node PTN000092274 (taxon 2759): GO:0004531 is SOUND, consistent with the eukaryotic origin argued by Shpak et al. 2008. GO:0006309 is TOO_DEEP, because it is seeded only by worm nuc-1, crn-6 and crn-7 yet reaches Dictyostelium, Paramecium, Trichomonas and algal members; SF22 and SF25 are flagged. It adds a residue site for the DNASE2 His295 catalytic histidine (UniProt active site and mutagenesis), with mouse Dnase2 and worm nuc-1 controls, and term assessments for GO:0004531 (FAMILY_WIDE) and GO:0006309 (SUBFAMILY_ONLY).
