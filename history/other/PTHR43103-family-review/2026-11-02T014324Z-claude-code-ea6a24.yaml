  summary: Create family review for PTHR43103 (HldD ADP-heptose 6-epimerase)
  details: |
    New FamilyReview for the NDP-sugar epimerase family carrying the module's optional C-6 epimerization step. Marked MOSTLY_COHERENT: 161 of 166 classified members are in SF3, the heptose 6-epimerase subfamily, with five in a separate 4-epimerase subfamily acting on a different sugar and position. PAINT exposes one node, PTN000042090, seeded by the canonical E. coli HldD/RfaD (P67910); both its rows are SOUND. GO:0009244 is scoped SUBFAMILY_ONLY because it names the LPS-core outcome rather than the epimerization, so it is inappropriate for actinobacterial SepC-type members; no mis-propagation is observed, because the S. fimbriatus sepC entry carries no GO annotations at all. The PAINT slice did not exist in the repo and was fetched with just fetch-panther-paint.
