  summary: 'Create family review: PTHR21015'
  details: |
    New COMPLETE review of the MurG family, declared HETEROGENEOUS: PTHR21015:SF22, named only GLYCOSYLTRANSFERASE, holds the bacterial MurG enzymes together with nine mycobacterial PGL/p-HBAD glycosyltransferases and three fungal UDP-glucosyltransferases, while PTHR21015:SF27 is MurG again for the Bacillota, so the subfamily split is taxonomic rather than functional. All three PAINT rows assessed. GO:0016757 at the untaxoned PTN000470555 SOUND, the only activity term that survives the family's three donor-acceptor pairs. GO:0050511 at PTN000470572 SOUND despite being the L-lysine-stem term on a uniformly meso-DAP-type Pseudomonadota clade, because the seed E. coli MurG carries an IDA and an IMP for that exact term; the recommendation is to add the sibling GO:0051991 beside it, which is asserted at no node in the family. GO:0008194 at PTN005360456 UNRESOLVED: the row is eukaryote-restricted and seeded by 31 metazoan UDP-glucuronosyltransferases, yet the only member of this family verified to receive its IBA is Mycobacterium tuberculosis Rv2958c, a bacterium, while the family's own fungal members do not receive it; the node also appears in the PTHR48043 and PTHR48047 PAINT slices and its seeds are classified in PTHR48043, so the node straddles family boundaries and PANTHER should reconcile its taxon with its leaf set. Two id-less subfamily entries cover the eukaryotic UGT-like group and the mycobacterial glycolipid group inside SF22. GO:0008375 scoped RESIDUE_DETERMINED against a new residue site: the five UDP-GlcNAc donor contacts of E. coli MurG (T15, H18, N127, S191, Q288) from the structure and the alanine-scan, at REQUIRED strength with two positive controls and the fungal UgtA1 as a residue-checked negative control. Validated with the family schema, term, reference, local-quote, residue and family/gene cross-check validators (0 conflicts, no rows for this family). proposed_action was not used because this worktree's schema predates that slot.
