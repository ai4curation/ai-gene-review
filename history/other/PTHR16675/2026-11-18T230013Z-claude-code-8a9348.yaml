  details: |
    Follow-up to the tree re-read of the family node assessments (batch f007), after review of the pull request. For PANTHER:PTN002497567 GO:0002476 (NEEDS_PRUNING) the reading, which the second agent checked, found that the assessment contradicts the PANTHER 19.0 tree: it said the node propagates the term onto AZGP1 (SF289) and HFE (SF172) and listed both as affected. SF289 lies below the node with all 19 of its leaves; SF172 has none of its 12 leaves below it and joins it at PTN000422357. Checked against the release tree on 2026-11-18 and against QuickGO: human AZGP1 (P25311) carries the IBA rows for GO:0002476 and GO:0001916 from this node, and human HFE (Q30201) carries neither. The script had left the row for a curator because the claim is in affected_subfamilies, which it does not rewrite, and no replacement reason had been drafted.

    - affected_subfamilies: SF172 removed; SF289 stays.
    - assessment_reason: says that HFE is not below this node and does not receive either term from it, and adds what the tree shows: SF289 descends from the node with 19 of its 273 leaves and no seeds, and the 6 seeds share a common ancestor three steps below the node.
    - supported_by: quotes sentences 1 and 3 of the node's entry in PTHR16675-tree-nodes.yaml, which is now listed under references.

    The assessment (NEEDS_PRUNING) is unchanged, and the pruning it asks for now concerns AZGP1 only. The other assessment that names SF172, PANTHER:PTN000422452 GO:0042605, was not edited. The review validates.
