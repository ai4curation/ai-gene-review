  summary: Put back by hand the tree fact that spo9 is itself a seed of FPP biosynthesis
    at the family root; node listing quoted
  details: |
    Follow-up to the tree re-read of the family node assessments (batch f003), after review of the pull request's ninth merge with main.

    The re-read had added a sentence to the PANTHER:PTN000162949 GO:0045337 assessment (NEEDS_PRUNING) saying that S. pombe spo9 is itself a seed of that assertion. Main then rewrote the assessment (#6693). When main was merged on 2026-11-23 the row was taken as on main, and the sentence and its quotes went with it. Main's reason says the term reaches spo9 for the same reason as the FPPS activity. Both IBAs do reach spo9 by descent from the family root, but the tree files do not let the two terms stand alike: PomBase:SPBC36.06c (spo9) is among the seeds of GO:0045337 at this node and not among those of GO:0004337. The PAINT row, the assessment's own seed list and spo9's tree extract (self_seed: true for GO:0045337, false for GO:0004337) all say so; the annotation behind the seed is spo9's EXP row from PMID:17596513.

    By hand:

    - assessment_reason: one passage added after main's text. It says where the term sits (the family root at Eukaryota, seeds in both branches below it), that spo9 is itself one of the seeds here and not for the FPPS activity, and that a loss on spo9's branch would contradict spo9's own experimental annotation unless that annotation is first disputed. It gives no seed count: the PAINT snapshot and the node listing have 7 seeds, spo9's GOA row has 8.
    - supported_by: sentences 1 and 3 of the node's entry for this term in PTHR11525-tree-nodes.yaml are quoted.
    - references: the node listing is listed again.

    Main's text, the assessment (NEEDS_PRUNING) and the absence of a proposed action are unchanged. The GO:0004337 assessment on the same node was read against the tree as well and is left as on main: none of its seeds is spo9. The review validates after the edit.
