  summary: Complete evidence-grounded family review for PTHR13283
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. KRIT1 stabilizes endothelial cell junctions through Rap1-associated interactions (PMID:21633110), whereas FRMD8 stabilizes cell-surface iRhom/ADAM17 complexes and thereby sustains ligand shedding (PMID:29897336). Both are FERM-domain interaction proteins, but neither KRIT1-specific CCM signaling nor FRMD8-dependent sheddase stability is a family-wide process. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
