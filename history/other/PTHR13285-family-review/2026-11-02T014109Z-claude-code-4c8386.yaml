  summary: Create PTHR13285 MBOAT acyltransferase family review
  details: |
    New FamilyReview for PANTHER PTHR13285 (ACYLTRANSFERASE), the MBOAT family containing HHAT, HHATL, Rasp/GUP1 and the bacterial DltB/PatA/AlgI group. Reference protein human HHAT (Q5VTY9, complete gene review). Four subfamilies (SF18, SF19, SF20, SF23) with representatives verified against the PANTHER 19.0 member index. All nine PAINT rows assessed: six SOUND, the two HHATL IRD losses and the single-seed Hhatl regulation gain UNRESOLVED for lack of accessible HHATL biochemistry. GO:0016746 assessed FAMILY_WIDE for the alginate_o_acetylation module (HHATL excluded from inheritance by the PAINT IRD). Added the MBOAT catalytic-histidine residue site (HHAT H379, Rasp H381 positive control, both UniProt ACT_SITE). SF21/SF22 (no Swiss-Prot members) and the AlgI InterPro2GO node PTN002297068 (outside the cached PAINT slice) are noted as not assessed. Seed identities checked against MGI, SGD and the EBI Proteins API. Schema, term, reference, residue-site (47 checks) and family-gene cross-check validators pass.
