  summary: Create PTHR13285 MBOAT acyltransferase family review
  details: |
    New FamilyReview for PANTHER PTHR13285 (ACYLTRANSFERASE), the MBOAT family containing HHAT, HHATL, Rasp/GUP1 and the bacterial DltB/PatA/AlgI group. Reference protein human HHAT (Q5VTY9, complete gene review). Four subfamilies (SF18, SF19, SF20, SF23) with representatives verified against the PANTHER 19.0 member index. All nine PAINT rows assessed: six SOUND, the two HHATL IRD losses and the single-seed Hhatl regulation gain UNRESOLVED for lack of accessible HHATL biochemistry. GO:0016746 assessed FAMILY_WIDE for the alginate_o_acetylation module. Seed identities checked against MGI, SGD and the EBI Proteins API. Schema, term, reference, residue-site (membership) and family-gene cross-check validators pass.
