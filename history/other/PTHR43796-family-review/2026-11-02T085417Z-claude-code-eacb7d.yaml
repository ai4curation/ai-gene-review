  summary: 'Family review: PTHR43796 carboxynorspermidine synthase'
  details: |
    New family review for the carboxy(nor)spermidine dehydrogenase family that grounds the first step of the bacterial_carboxyspermidine_biosynthesis module. Judged MOSTLY_COHERENT: one conserved chemistry (NADPH-dependent reductive condensation of L-aspartate 4-semialdehyde with an amine) but diverging amine specificity, with the agmatine-specific Synechocystis member Q55131 recorded as a member exception to GO:0102143 rather than a subfamily scope, because PANTHER places it in SF2 with the Vibrio enzymes. Reference protein is Q9KRL3 (Vibrio cholerae VC_1624), whose gene review was written in the same session. PAINT holds no node-level annotations for this family, so no node assessments were written and none were invented; that is recorded in notes. Validated with the validate-families validators: schema, term labels, and supporting-text quotes all clean.
