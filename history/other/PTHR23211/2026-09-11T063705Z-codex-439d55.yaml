  summary: 'Complete family biological assessment: PTHR23211'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Fly rgn regulates the timing of blastema formation and regenerative cellular plasticity in imaginal discs (PMID:18485344). This is direct positive genetic evidence for the fly branch, not merely an uncharacterized sequence. However, the signal peptide and C-type-lectin-like architecture of the exact long rgn product do not by themselves establish trans-Golgi residence or a conserved TGN38 trafficking cycle. Neither the family name nor a regeneration phenotype specifies the molecular ligand, compartment or vesicular mechanism. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
