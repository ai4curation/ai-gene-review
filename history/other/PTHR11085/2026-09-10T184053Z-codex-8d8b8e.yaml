  details: |
    Follow-up family/gene consistency audit found that the listed benchmark subfamily was a positive example, not an exhaustive applicable set. Retained member evidence and changed machine-readable scope to UNRESOLVED with the specific biological boundary: SIRT5 is experimentally established as a protein desuccinylase, but this reaction is not exclusive to SIRT5: primary work reports SIRT7-dependent histone H3K122 desuccinylation (PMID:27436229). Substrate preference and assay context differ among sirtuins. The SIRT5 subfamily consequently cannot be used as an exhaustive allowed set, and neither its evidence nor the SIRT7 result warrants a universal desuccinylase grant to all sirtuins.
