  summary: Complete evidence-grounded family review for PTHR11085
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. The experimentally annotated SIRT5 record supports acidic-acyl lysine hydrolysis. Other sirtuins differ in deacetylation efficiency, longer-chain deacylation and reported ADP-ribosyl transfer reactions. A family label of deacetylase cannot replace substrate-specific evidence, and mitochondrial localization does not apply to the entire family. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
