  summary: 'ARBA00022670: MODIFY -> ACCEPT after a scan of all 1,010 sets'
  details: |
    UniProt does not derive a parent keyword from a child (unreviewed entries carry the parent with its own rule evidence), so overlap with child-keyword rules is not a parsimony defect. All 1,010 condition sets recorded with Swiss-Prot counts (24,550 of 24,551 carry KW-0645; the exception, Q7SQ98, is a polyprotein that contains a protease and lacks the keyword). The claim that covered sets cannot add an annotation is withdrawn.
