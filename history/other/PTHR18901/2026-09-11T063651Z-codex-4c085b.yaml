  summary: 'Complete family biological assessment: PTHR18901'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. HAD-superfamily phosphatases share a catalytic scaffold but vary in their cap domains and phosphometabolite recognition. Recombinant human HDHD1/PUDP hydrolyzes pseudouridine 5-prime-phosphate with high specificity, exceeding its activity on UMP by over three orders of magnitude (PMID:20722631). This is positive evidence for one substrate-specific branch, not a license to transfer pseudouridine-phosphate or 2-deoxyglucose-6-phosphate hydrolysis to every HAD member. CG5565 remains a phosphatase-family protein with unresolved physiological substrate. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
