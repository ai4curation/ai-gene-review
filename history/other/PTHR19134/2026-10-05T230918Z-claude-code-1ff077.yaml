  summary: 'Create family review: PTHR19134 (classical PTPs; Dictyostelium ptpC context)'
  details: |
    Structured FamilyReview for PANTHER PTHR19134 (RECEPTOR-TYPE TYROSINE-PROTEIN PHOSPHATASE), written while reviewing Dictyostelium ptpC/PTP3 (SF549). MOSTLY_COHERENT. GO:0004725 is FAMILY_WIDE, with member exceptions for C. elegans SDF-9 (catalytic Cys lost) and bracovirus PTP-J1 (C235S) and PTP-H1 (WPD Trp->Phe), which were shown or predicted inactive (PMID:16839187, PMID:17121799). Added a catalytic_cysteine residue site anchored on PTP3 C650, with positive (PTPRC C853, YopH C403, PTP-H2 C236) and negative (PTP-J1 S235, SDF-9 S223) controls. GO:0005001 is SUBFAMILY_ONLY for the 8 receptor-type subfamilies; it is not family-wide, because PTP3 and the other non-receptor PTPs are cytosolic. GO:0007165 is UNRESOLVED: bacterial and viral effector PTPs share subfamilies with endogenous enzymes. PAINT root node PTN008567661 (GO:0004725, GO:0007165) assessed SOUND; Bilateria node PTN000439254 (GO:0031175) left UNRESOLVED. Fetched PMID:17121799, PMID:16380146, PMID:12783794 and PMID:16839187 via just fetch-pmid.
