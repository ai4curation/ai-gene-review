  summary: 'Review pass on PTHR11486: cite claims previously asserted from memory'
  details: |
    Self-review of the PTHR11486 family review against the aigr-pr-review standard, checking the non-deterministic part the validators cannot see.

    Five substantive biological claims in the summary and subfamily descriptions had been written from memory and left uncited. All five turned out to be verbatim-citable, four of them in publications the review already listed, so they are now evidence rather than assertion:

    - the beta-trefoil fold (PMID:12815063)
    - the endocrine ligands' reduced heparin/heparan sulfate affinity (PMID:17623664, which also records that FGF19 retains more of it than FGF21 and FGF23)
    - Fgf15 as the mouse ortholog of human FGF19 (PMID:17623664)
    - FGF14 as the spinocerebellar ataxia 27 locus (PMID:22705208)
    - EGL-15 as the C. elegans FGF receptor (PMID:16495308, added as a reference)

    Two statements were overstated and are corrected. The EGL-15 claim had called it the single worm receptor, which nothing cited establishes; it is now just the worm FGF receptor, with a note that EGL-17 is not the only C. elegans FGF since the cached worm FGF pathway paper works through LET-756, which is not in that clade. The GO:0005737 TOO_DEEP reason had counted the three KEEP_AS_NON_CORE members as disputing the term and called the member response unanimous; keeping a term as non-core is agreement that it is true, so the reason now separates the seven outright rejections from the three non-core retentions and rests the verdict on the five REMOVEs.

    Two things recorded rather than changed. The GO:0022008 affected_subfamilies list carries two distinct cases, the endocrine three and FGF7, which would be two IRDs rather than one; this is now said in the reason. And the absence of residue_sites is now an explicit gap in the notes: the natural site is the set of FHF core residues responsible for the inability to activate FGF receptors, which would make the PTN000160077 divergence machine-checkable and settle the one FHF loss left unresolved, but the cached abstract states those residues exist without naming them and the full text is unavailable, so asserting a position would be a guess.

    Two claims were checked and upheld without change. The ontology-gap claim was verified against OLS: no GO class matches klotho, and all 16 children of GO:0008543 are precomposed tissue or process terms, none expressing a co-receptor requirement. The UNRESOLVED verdict on the FHF FGFR-binding IRD was re-examined under CLAUDE.md's rule against overruling curators from incomplete evidence and stands: the conflicting row is an IDA made from full text not available here, binding is a weaker claim than activation, and the FGF12 review itself leaves it UNDECIDED.

    Validation after the changes: LinkML schema clean, linkml-term-validator --labels passed, reference validator 60 snippets 0 issues, residue validator 154 pass, cross-check 0 conflicts, and the parsed-value assertion suite passes (quotes verbatim, member-action claims, tree-membership claims, PANTHER id/label pairs).
