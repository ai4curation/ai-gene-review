  summary: 'Family review: PTHR11486 (fibroblast growth factor)'
  details: |
    PANTHER family review of the fibroblast growth factor ligands, covering all 35 rows of the PAINT slice and grounded in the 13 member gene reviews in this repository (two zebrafish fgf8 paralogs and human FGF1, FGF2, FGF3, FGF7, FGF8, FGF9, FGF10, FGF12, FGF19, FGF21, FGF23).

    Node membership was established from the PANTHER 19 tree with interpro/panther/tree_check.py rather than from PAINT's taxon labels; the committed PTHR11486-tree-check.txt is the evidence, and every leaf count and subfamily claim in the review was checked against it.

    Headline finding: PAINT models one of the family's two functional divergences well and the other not at all. The FHF divergence is fully expressed at PTN000160077 (seven IRDs plus two gains). The endocrine divergence has no IRD anywhere, so FGF19, FGF21 and FGF23 each inherit paracrine mitogenic and migratory terms their own reviews remove one at a time. The structural reason is that the endocrine FGFs are not monophyletic here: FGF19 and FGF21 sit under PTN008519127 and FGF23 under PTN002608225, whose lowest common ancestor PTN008519135 also holds FGF4, FGF5, FGF6, FGF9, FGF16 and FGF20, so two IRDs are needed rather than one.

    Secondary finding: a correctly placed loss does not protect the leaf. The FHF IRDs do stop the PAINT propagation (FGF12 has no IBA row for the cancelled terms), but FGF12 carries those terms anyway from an automatic family-based mapping and from historical author statements, which a phylogenetic loss cannot reach. A curated rule under rules/curated/ conditioned on the FHF clade is the instrument for the mapping half; recorded as a recommendation, not written here.

    GO:0005737 cytoplasm at the family root is marked TOO_DEEP: ten of the twelve reviewed members that receive it dispute it, five by REMOVE, and three of those reviews independently name this node and attribute the gain to the intracellular members. GO:0008284, GO:0030334 and GO:0022008 are NEEDS_PRUNING with the endocrine subfamilies named.

    Six rows left UNRESOLVED for three distinct reasons: four IRDs at PTN000160186 act on a single uncharacterized Ciona intestinalis leaf; the extracellular-region IRD on the FGF22 group at PTN002608270 looks wrong on its face but no reviewed member sits below it; and the FGFR-binding IRD at the FHF node is separated from the other six FHF losses because the literature establishes inability to activate rather than absence of binding, and the FGF12 review holds an unreconciled IDA for binding.

    No term is scoped SUBFAMILY_ONLY. PANTHER does define per-FGF subfamilies and they are used throughout (every SF id read from the tree check, every label from panther.obo), but the cross-check places a gene in a subfamily from the :SF suffix of its UniProt PANTHER cross-reference and none of the 13 members has one; all 13 join the index with no subfamily, so the node-pruning check cannot fire for this family at all. The missing UniProt :SF suffixes are worth reporting upstream.

    Validation: LinkML schema clean; linkml-term-validator --labels passed; reference validator 54 snippets checked, 0 issues; residue validator 154 pass; family/gene cross-check 0 conflicts; 182 family/panther pytest tests pass. The document was generated with yaml.safe_dump and then checked against its own parsed values (156 supporting_text quotes verbatim, 37 member-action claims, 12 tree-membership claims, 48 PANTHER subfamily id/label pairs), applying the guard filed as issue #6073.
