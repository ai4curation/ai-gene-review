  summary: 'PTHR11486: full text of PMID:12815063 splits the FHF node verdict; add
    residue site'
  details: |
    The user supplied the full text of Olsen et al. 2003 (PMID:12815063), which the review had flagged as the one thing that could close its residue-site gap and settle the FHF receptor-binding row. Reading it, together with the cached full text of Sochacka et al. 2020 (PMID:32357892), changed more than expected.

    Correction first, because it was load-bearing. The previous draft said the FGF12 review held an unreconciled positive IDA for GO:0005104 from the 2003 paper, and used that to justify leaving that one loss UNRESOLVED. The GOA rows are NOT|IDA, negated, for both GO:0005104 and GO:0008543: they agree with the 2003 result and with the IRD rather than conflicting with either. The verdict happened to survive the correction but for a different reason, and three further rows did not survive.

    The real conflict is Sochacka et al. 2020, which the FGF12 review had already identified and which this family review had not. It reports direct interaction of FHF1 with all four major FGFRs, efficient receptor activation and downstream signalling, and names FHF1 an FGFR ligand, while agreeing with the 2003 work that FHF1 does not stimulate cell division. The seven IRDs at PTN000160077 therefore split three ways rather than standing as a block:

    - GO:0005576, GO:0008284, GO:0030334 stay LOSS_SUPPORTED. The first two are corroborated by the 2020 work, which states the FHFs lack a secretion signal and cannot induce proliferation; the 2020 study adds recombinant protein from outside, so it says nothing about export. Migration is simply untested by it, which is recorded.
    - GO:0005104, GO:0008543, GO:0043410, GO:0008083 become UNRESOLVED, because each names something the 2020 study reports happening. They are not called contradicted: that would overrule a curated NOT, and a GO curator weighing the two papers may well keep it.

    Consequences elsewhere. The GO:0008543 and GO:0008083 term assessments lost their FGF12 member exceptions, since an exception must be anchored in an adjudicated negative node and those nodes are no longer negative; both scopes become UNRESOLVED with the reason stated. The GO:0005576 exception stands, now citing the 2020 paper for the absence of a secretion signal. The summary and the FHF subfamily divergence description no longer assert that the FHFs cannot activate FGF receptors.

    Residue site added, closing the gap the previous review recorded. fhf_divergent_surface carries the two residues from the 2003 structure-based mutagenesis: Arg52 in the beta4-beta5 loop and Val95 in the beta9 strand of FHF1b, unique to FHFs, required for the IB2 interaction, and reducing FGF1's capacity to activate FGFRs when swapped in. The paper numbers them on isoform P61328-2 (181 aa); they are anchored to the displayed P61328 sequence as Arg114 and Val157, an offset of 62 verified against the sequence, with FGF1 Gly67 and Asn110 as negative controls, also verified. No required_for is asserted: the documented requirement is the IB2 interaction, which has no GO term beyond protein binding, and the FGFR consequence is the disputed claim. Note that the cached PubMed abstract places Val95 in the beta9 strand while the PDF renders it beta6; the cached text is followed.

    Validation: schema clean, --labels passed, reference validator 58 snippets 0 issues, residue validator 158 pass 0 fail (up from 154, the four new positions), cross-check 0 conflicts, parsed-value assertion suite passes with new checks that FGF12's GO:0005104 and GO:0008543 rows are negated and that it carries no proliferation row.
