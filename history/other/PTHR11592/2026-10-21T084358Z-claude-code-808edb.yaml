  summary: Extend thioredoxin-dependent peroxiredoxin scope to BtuE subfamily SF40
  details: |
    The GO:0140824 term assessment was scoped SUBFAMILY_ONLY to SF78 (fungal GPX-like peroxiredoxins). E. coli BtuE (SF40, same subfamily as the ARGO50 target Xanthomonas Q8P365) uses thioredoxin A or C as preferred reductant in purified-enzyme assays (PMID:20621065, already a reference of this family review). Added SF40 to applicable_subfamilies with that quote; resolves the family/gene cross-check conflict raised by the new ECOLI/btuE review.
