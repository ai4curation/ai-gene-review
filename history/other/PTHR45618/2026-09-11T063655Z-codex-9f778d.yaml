  summary: 'Complete family biological assessment: PTHR45618'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. The mitochondrial-carrier fold accommodates different anions, metabolites and uncoupling mechanisms. Direct reconstitution of fly Dic paralogs found typical dicarboxylate transport by DmDic1, narrower phosphate/sulfur-substrate transport by DmDic3, and no detectable transport by DmDic4 in the tested substrate panel (PMID:21130726). The Dic4 negative result is bounded by that panel and assay system; it neither establishes universal inactivity nor provides positive evidence for thiamine-pyrophosphate transport. Shared carrier architecture cannot select the substrate for the benchmark Dic4 protein. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
