  details: |
    Structured FamilyReview for the JAK family. Mapped subfamilies and PTN nodes with the PANTHER 19 treeinfo service (91-leaf tree; root PTN001975446 Eumetazoa with Trichoplax outside the Bilateria node PTN001562978; euteleostome four-way duplication polytomy PTN002521566 over TYK2/JAK1/JAK2/JAK3; no nematode, amoebozoan, fungal or plant leaf). Resolved PAINT seeds from the tree and UniProt. Verdict COHERENT: tyrosine kinase activity, cytokine receptor binding and JAK-STAT signaling family-wide; named cytokine pathways paralog-specific. Residue site jh1_ptk_catalytic (JAK1 K908/D1003/R1007; positive controls JAK2, JAK3, TYK2, hop; sequence-level negative control the Panagrolaimus fragment A0A914YCL6 with a Ser/Thr-type loop). Assessed all 36 PAINT rows: 31 SOUND, 2 NEEDS_PRUNING (GO:0005131, GO:0060333 reach JAK3 through the polytomy), 1 TOO_DEEP (GO:0060397, JAK2-only seeds on the duplication node), 1 WRONG_NODE (negated GO:0007259 IRD on the TYK2 node, contradicted by TYK2 IDA evidence), 1 UNRESOLVED (GO:0033209 TNF signaling on JAK2). GO:0007259 FAMILY_WIDE with a member exception for the TreeGrafter-annotated nematode fragment A0A914YCL6. Cached new PMIDs for hop, TYK2, JAK2, Dictyostelium kinome and JH2 papers. Proposed GO taxon constraints (GO:0007259 and GO:0046425 never_in Nematoda; only_in Metazoa or never_in Dictyostelia) reported to the caller, not written to the ontology.
