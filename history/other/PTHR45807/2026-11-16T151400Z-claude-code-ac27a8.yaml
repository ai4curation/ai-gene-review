  details: |
    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR45807-tree-nodes.yaml, from `just phylo-family PTHR45807`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

    - PANTHER:PTN002521566 GO:0005131 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree PTN002521566 is a duplication before Euteleostomi with four branches, and the four seeds (JAK1, JAK2, TYK2) sit in three of them. SF3 JAK3 (20 leaves) descends from the node with no seeds, consistent with an IRD on the JAK3 clade.
    - PANTHER:PTN002521566 GO:0060333 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the three seeds (rat Jak2, human JAK1, human TYK2) sit in three of the four branches below the duplication node PTN002521566. SF3 JAK3 (20 leaves) descends from the node with no seeds, consistent with an IRD on the JAK3 clade.
    - PANTHER:PTN002521566 GO:0060397 (TOO_DEEP): the reason made a claim the tree contradicts (the lowest node that covers them is the JAK2 clade node PTN002910276 -- the seeds' lowest common ancestor is PTN000700647, a Euarchontoglires speciation node 7 steps below PTN002521566). The reason was rewritten to correct it; the rest of its argument is kept.
    - PANTHER:PTN002910252 GO:0007259 (LOSS_CONTRADICTED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PTN002910252 is a Euteleostomi speciation node with 20 leaves, all in SF6 TYK2, and the IRD stops the term asserted at PTN001562978. PAINT places three cytokine-pathway IBDs on this same node, which fits the assessment, but TYK2 participation is a functional question.

    Each row now quotes the family's node listing in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
