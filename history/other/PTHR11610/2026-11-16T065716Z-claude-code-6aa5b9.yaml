  details: |
    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR11610-tree-nodes.yaml, from `just phylo-family PTHR11610`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

    - PANTHER:PTN000906454 GO:0004465 (TOO_DEEP): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree all four seeds are SF3 lipoprotein lipases under a Eutheria node of 13 leaves, 6 steps below PTN000906454, which has 147 leaves and 16 subfamilies. SF147, SF165 and SF108 lie below the node with 41 leaves between them and hold none of the seeds.
    - PANTHER:PTN000906454 GO:0008970 (TOO_DEEP): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the four seeds are in SF2, SF3 and SF13 and sit in 3 of the 4 branches below PTN000906454, so the node is their common ancestor. SF147 and SF108 lie below it and hold no seeds, so excluding them rests on the substrate-specificity evidence.
    - PANTHER:PTN000906454 GO:0034375 (TOO_DEEP): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the three seeds are in SF2 and SF13 and sit in 2 of the 4 branches below PTN000906454, so the node is their common ancestor. SF147, SF165, SF108 and SF3 lie below it and hold no seeds, so excluding them rests on the functional evidence.
    - PANTHER:PTN000906454 GO:0006633 (WRONG_NODE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the three seeds are in SF3 and SF2 and sit in 2 of the 4 branches below PTN000906454, so the node is their common ancestor. The placement follows the seeds, and the dispute rests on what the term means, which the tree cannot settle.
    - PANTHER:PTN000176957 GO:0005576 (LOSS_CONTRADICTED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PTN000176957 is a speciation node at Theria with 9 leaves in one subfamily, SF108, and its loss stops the term asserted at PTN008325466, as the assessment states. Whether these members are secreted rests on the experimental evidence.

