  summary: 'Complete family biological assessment: PTHR11733'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. M13 proteins include active zinc endopeptidases and divergent neprilysin-like proteins. The fly family analysis distinguishes seven Nep genes retaining the catalytic motifs from 21 Nepl genes predicted to lack catalytic competence; biochemical activity had been demonstrated for only a subset of Nep proteins (PMID:34189422). Metal-site mutagenesis establishes that altered ligands can abolish or greatly reduce NEP catalysis (PMID:8099556), while ECE-1 structure documents a related fold with a distinct peptide-processing role (PMID:18992253). Thus Nepl19 cannot inherit peptidase activity solely from its M13 assignment. Exact-target motif integrity and sequence completeness are separate requirements; neither universal activity nor universal inactivity is asserted. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
