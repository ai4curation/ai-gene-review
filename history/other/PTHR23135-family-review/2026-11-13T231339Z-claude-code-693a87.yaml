    New COMPLETE review of the MUR LIGASE FAMILY MEMBER family (MurE plus MurT and cyanophycin-synthetase branches), declared HETEROGENEOUS. All nine PAINT rows assessed: GO:0016874 at the family root PTN000566337 SOUND (seeds span both MurE specificities and a MurT); at the bacterial MurE node PTN000566406, GO:0009252 and GO:0005829 SOUND and GO:0008765 NEEDS_PRUNING with a proposed ADD_IKR at the Streptococcus pneumoniae leaf PTN001898754; the three IRD rows at PTN004610266 (the Ricinus communis B9T905 leaf) LOSS_SUPPORTED; and GO:0009507 and GO:0009658 at the streptophyte clade PTN008591326 SOUND. Because SF4 holds both the meso-DAP-adding E. coli MurE and the L-lysine-adding S. aureus MurE and is named after a chloroplastic homolog, specificity is scoped RESIDUE_DETERMINED for both GO:0008765 and GO:0047482 against a new residue site (Arg417 of the E. coli DNPR recognition motif, with three positive and three negative controls checked against UniProt sequences); GO:0016874 is FAMILY_WIDE and GO:0009252 UNRESOLVED. Validated with the family schema, term, reference, local-quote, residue and family/gene cross-check validators.
