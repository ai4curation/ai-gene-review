  summary: Incorporate sgg and worm gsk-3 gene reviews into PTHR24057 family review
  details: |
    Linked new gene reviews genes/DROME/sgg (P18431) and genes/worm/gsk-3 (Q9U2Q9) on the SF0 representatives. GO:0090090 scope_reason now cites sgg IMP/IGI/IDA and worm GSK-3 PRY-1/AXL-1 evidence, and notes the positive role of worm GSK-3 in embryonic Wnt/beta-catenin asymmetry (endoderm specification, PMID:10444600, PMID:11463373). GO:0030877 scope_reason: SF0 coverage rests on fly (sgg IDA, PMID:31189665) and vertebrate data; worm GSK-3 left unresolved (Y2H binding only, no IBA, no gene-level annotation), not excepted. SF18 description notes sperm/meiosis II roles belong to gskl-1/gskl-2 (PMID:35635101), not gsk-3. Notes record fly Hh/Ci and Timeless/circadian roles as lineage-specific, not propagated. No scope changes. New supporting_text verified verbatim against cached publications; cross-check 0 conflicts.
