  summary: Complete evidence-grounded family review for PTHR23049
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. Regulatory-light-chain phosphorylation controls nonmuscle myosin filament organization in HeLa experiments (PMID:11942626). Muscle and nonmuscle paralogs differ in myosin partner, expression and contractile context. MYL10 has no comparable direct partner or phosphorylation assay in the retrieved sources, so the family supports a regulatory-light-chain comparison without establishing cardiac contraction, a specific heavy chain or identical calcium sensing for MYL10. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
