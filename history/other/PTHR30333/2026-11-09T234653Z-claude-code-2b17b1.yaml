  summary: Create family review for PANTHER PTHR30333 (NapC/NirT/NrfH quinol dehydrogenases)
  details: |
    Reviewed the family ImcH belongs to, reached from the OmcZ work. Recorded as HETEROGENEOUS: it holds the NapC/NirT/NrfH inner-membrane quinol dehydrogenases and also OmcS, which has no transmembrane anchor, no PF03264/IPR005126 match, six heme motifs rather than four, and polymerises into extracellular filaments. The split crosses subfamily boundaries, since OmcS sits in SF1 next to NapC itself. Both PTN001251186 IBD rows assessed SOUND: only generic terms (GO:0009055, GO:0019645) sit there, which is what keeps them safe despite the heterogeneity. GO:0008121 scoped RESIDUE_DETERMINED against a new residue site, the CymA tetraheme CXXCH set, with NapC, NrfH and ImcH as positive controls. Noted that OmcZ has no PANTHER family at all, so the two Geobacter nanowire cytochromes are classified inconsistently.
