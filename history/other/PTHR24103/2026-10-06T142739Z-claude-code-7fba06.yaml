  details: |
    Created the PTHR24103 FamilyReview, prompted by PMID:42746740 (Dudley-Fraser and Rittinger 2026) and the family-wide pseudoligase screen PMID:40216791. Human membership comes from the PANTHER 19.0 classification file (61 genes). GO:0061630, GO:0004842 and GO:0016567 are scored RESIDUE_DETERMINED against a C3HC4 RING site anchored on TRIM21. The RING motif is necessary but not sufficient. PTN007774218 GO:0061630 is assessed NEEDS_PRUNING for the RING-less subfamilies (TRIM14, TRIM44, pyrin/MEFV, TRIML2, BSPRY) and for pseudoligase TRIM51. The TRIM6, TRIM15 and TRIM22 seeds, which conflict with the in vitro pseudoligase data, are left for gene-level curators. GO:0019789 is scored UNRESOLVED.
