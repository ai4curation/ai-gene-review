  summary: 'Complete family biological assessment: PTHR11586'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Complete TyrRS proteins combine tyrosine activation and tRNA charging domains, whereas related ancillary RNA-binding/EMAP-containing proteins need not catalyze aminoacylation. Fly TyrRS additionally has a context-specific extracellular role during cell competition, with proteolytic products affecting hemocyte attraction (PMID:26658841). This signaling activity is not the definition of all TyrRS or AIMP1/Arc1 relatives. Tyrosine-tRNA ligase activity requires the complete catalytic architecture; a shared ancillary domain or a secreted fragment does not suffice, and an exhaustive active-subfamily boundary is not established here. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
