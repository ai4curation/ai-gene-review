  summary: Re-review PTHR12560 against the PANTHER tree, family alignment and literature
  details: |
    First REVIEW pass over the family review created on 2026-10-10. Every claim was checked against primary data fetched in this session; nothing was reviewed from memory.

    Tree: PANTHER release 19 treeinfo for PTHR12560 (434 leaves, 371 internal nodes, 101 species, eukaryotes only), read with event types and species labels. Alignment: PANTHER familymsa for the family (leaf rows; match-state columns only), with human CERS6 (Q6ZMG9) and S. cerevisiae LAC1 (P28496) as reference rows, both equal to the UniProt canonical sequence. Both were obtained; neither is committed. The reproducible script tree_msa_check.py and its output PTHR12560-tree-msa-check.txt are in the family folder.

    Confirmed: functional coherence (COHERENT); the three root IBDs at PTN000285423 (endoplasmic reticulum, sphingosine N-acyltransferase activity, ceramide biosynthetic process) are SOUND, with seeds and QuickGO experimental annotations (queried by term id; positives returned) on both sides of the root, and the catalytic His-His pair conserved in every clade (H in 425 and 427 of 434 leaves).

    Changed: (1) Added the PAINT IKR at PTN000285611 (Caenorhabditis hyl-2, NOT sphingosine N-acyltransferase activity), which the first version did not assess. Verdict LOSS_CONTRADICTED with proposed_action REMOVE_LOSS: both hyl-2 leaves keep R87/H168/H169, UniProt records experimental EC 2.3.1.297 for C. elegans hyl-2, and the hyl-2(gnv1) His-His to Gln-Tyr allele abrogates activity. (2) Replaced the node reasons, which only said that reviewed recipients retain the IBA, with tree-, alignment- and annotation-based reasons, and added node_taxon and negated. (3) Corrected the subfamily section: SF0 is PANTHER's unplaced bin of 146 leaves from all lineages, not "S. pombe lag1 and fungal relatives"; fungal gene names do not track the two fungal clades; added CERS4, CERS5, CERS6, hyl-2 and the plant LOH3 subfamilies and clade nodes where the label is a clade. (4) Added the residue site lag1p_his_pair (strength CONTRIBUTES, no natural negative control). (5) Added an endoplasmic reticulum term assessment and rewrote the scope reasons. (6) Set review_status to NEEDS_REVIEW so the PAINT change request gets a second reader.

    Not verified: why PAINT placed the hyl-2 IKR; the function of three unreviewed leaves with a substituted catalytic histidine (one P. falciparum, one banana, one tobacco sequence), for which no pruning is requested. Publications not in the local cache were checked against PubMed by identifier and title and are cited without quotations.
