  summary: Re-review PTHR12922 (COQ4) against the PANTHER tree and alignment
  details: |
    Independent re-review of the COQ4 family review, which had only a CREATE record. Tree and alignment were both obtained from the PANTHER services (release 19; treeinfo and familymsa) by the new family_analysis.py, whose output is PTHR12922-analysis.txt; raw payloads are not committed.

    Confirmed: the two function IBDs (GO:0120539, GO:0006744) sit at PTN000308947, the Eukaryota speciation node with 126 of the 127 leaves, and the placement holds. The family has no ancient duplication (19 lineage-specific duplication nodes). The four zinc ligands of human COQ4 (H163, D164, H167, E179, Q9Y3A0 sequence version 3) are matched at the same alignment columns in 118 of 126 eukaryotic leaves and in the Gloeobacter outgroup. Experimental GO annotations of the tree leaves were pulled from QuickGO by gene product (positive control: 18 experimental rows on Q9Y3A0) and support each seed. The mitochondrion IBD at PTN000308948 (Unikonts) is sound for its clade.

    Changed: coherence COHERENT to MOSTLY_COHERENT; the claim of a single subfamily was wrong (SF9, three Brassica in-paralogs, added); reference protein changed to human COQ4, the member with experimental binding-site features; a zn_motif residue site added; the decarboxylase term scope kept FAMILY_WIDE; both function rows changed from SOUND to NEEDS_PRUNING with ADD_IKR at leaf PTN007596841 (C. briggsae coq-4.2, C0HL94: 155 residues, glycine at the motif glutamate column, UniProt caution that it may be non-functional), with matching member exceptions; a mitochondrion term assessment added; supporting quotes now come from the primary papers (PMID:38295803, PMID:38425362, PMID:24911838, PMID:11469793) and UniProt features instead of the yeast gene review prose.

    Not verified or not actionable: the coq-4.2 loss rests on sequence alone. The mitochondrion IBD could be moved up to PTN000308947 on Trypanosoma brucei localisation data (bikont leaf Q382H9), but the schema has no too-shallow verdict, so this is a note, not a proposed_action; PMID:36804636 and PMID:19022396 were not read in full text. Seven other leaves deviate at the motif columns: bovine Q05B52 only because PANTHER aligned a 151-residue sequence unlike the current UniProt entry, the rest are short or deleted unreviewed gene models; no action requested for them. The zn_motif requirement is recorded as CONTRIBUTES because no natural member lacking the motif has been assayed (no verified negative control). Validation: just validate-quotes passed over the corpus; just validate-families passed its schema, GO term and both quote stages over all families, and was stopped during the corpus-wide residue stage for time, after which the residue-site validator, the family/gene cross-check, the schema check and the quote check were run on this family alone and passed, as did the corpus-wide gene residue-claim and finding residue-mapping checks.
