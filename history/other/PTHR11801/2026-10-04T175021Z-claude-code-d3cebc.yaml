  summary: Weave STAT evolution reviews into PTHR11801 family review
  details: |
    Added Liongue & Ward 2013 (PMID:24058787) and Wang & Levy 2012 (PMID:24058748) quotes to the GO:0007259 SUBFAMILY_ONLY term assessment (bilaterian pathway assembly, older STAT-like proteins, separate Dictyostelium STAT clade); Kawata 2011 (PMID:21534947, abstract) and Wang & Levy to GO:0097696 (four Dictyostelium STATs); Taffoni & Pujol 2015 (PMID:26716073) to GO:0006952 (STA-2 AMP transcription). Sharpened the TOO_DEEP PTN000927860 GO:0007259 assessment_reason with the evolutionary framing. Notes record the reviews used, the Wang & Levy caveat that F58E6.1 (sta-2) was called not a bona fide STAT, and a pointer to the cross-gene briefing artifact. No assessments, scopes or subfamilies changed.
