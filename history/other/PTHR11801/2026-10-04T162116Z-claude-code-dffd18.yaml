    Structured FamilyReview for the STAT family from PANTHER 19 treeinfo (PTHR11801 and JAK family PTHR45807) and UniProt InterPro xrefs; reproducible script in PTHR11801-bioinformatics/. Verdict MOSTLY_COHERENT. Assessed all 31 PAINT rows: 23 SOUND, 4 NEEDS_PRUNING (root PTN000210448 GO:0000981/GO:0000978/GO:0006357 reach plant SHA/SHB, which lack the STAT DNA-binding domain; PTN000210451 GO:0043434 reaches STAT2), 2 TOO_DEEP (PTN000927860 GO:0007259 JAK-STAT placed at Unikonts, reaching JAK-less Dictyostelium and nematode STATs; PTN002623856 GO:0060397 above the STAT5/STAT6 split), 2 UNRESOLVED (PTN000927860 GO:0006952, where sta-1 also shows a regulatory sign inversion; PTN002623830 GO:0031663). GO:0007259 scoped to vertebrate subfamilies; Dictyostelium (SF65, SF50) and nematode (SF49, SF68) subfamilies excluded; SF43 catch-all not scoped. Plant SHA/SHB recorded as member exceptions on the three FAMILY_WIDE transcription-factor terms. Consistent with sta-1/sta-2 REMOVE of GO:0007259 and DICDI statA/statC MODIFY to GO:0097696.
