    Structured family review covering the ten subfamilies with reviewed members, all five PAINT nodes (all SOUND), and three residue sites. Checked the catalytic serine in all 27 reviewed members: present in every one, so no pseudo-enzyme branch and the molecular-function term is family-wide. The animal-only structural calcium site was confirmed by pairwise alignment with genuine negative controls (E. coli A282, yeast A278, S. pombe S260). Two universally retained sites carry no REQUIRED claim because the schema reserves that for sites with a negative control and none exists. Self-review corrected the seed description of the plasma-membrane node: RGD:2099 and RGD:621650 are rat intestinal enzymes, so the seeds span two branches. Validated with just validate-families.
