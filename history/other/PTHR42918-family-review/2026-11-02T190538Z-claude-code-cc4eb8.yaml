- type: EDIT
  outcome: changed
  summary: Re-assess PTN000502669 as NEEDS_PRUNING and fix its declared seeds (PR
    5912 review)
  details: |
    The GO:0004824 node assessment claimed EpmA descends from a separate node and does not inherit the activity. That was wrong on this PR's own data: PTHR42918-paint.tsv puts GO:0004824, GO:0000049 and GO:0006430 on PTN000502669, EpmA seeds that node's GO:0005737 row, and the epmA review removes all three IBAs. Changed it to NEEDS_PRUNING with affected_subfamilies SF6, and added a NEEDS_PRUNING assessment for the GO:0000049 row plus term assessments for GO:0000049 and the exclusion reasoning.

    CI's NODE_SEEDS check also failed because the GO:0004824 seed list declared UniProtKB:Q9ZPI1 (the Arabidopsis protein) while PAINT's with-list has AGI_LocusCode:AT3G11710. All four seed lists now match the with-lists in the PAINT slice verbatim.

    Two deliberate deviations from the review's wording, both recorded in notes. The SF6 exclusion is encoded as subfamily scope plus affected_subfamilies rather than a member_exceptions entry for P0A8N7: an exception on a term whose applicable_subfamilies already exclude that member's subfamily is vacuous, and family_gene_crosscheck flags it EXCEPTION_OUTSIDE_SCOPE (it did so earlier in this PR). And GO:0006430 is described in prose instead of as an assessment, because the repository label cache records it as obsolete while OLS and the local GO snapshot both report it live; grounding a term block on it fails label validation. Also corrected the notes claim that the module grounds this step on TIGR00462/IPR004525: it names EpmA as a UniProt gene product, and those signatures are described as the unused alternative.
