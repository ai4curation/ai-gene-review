  summary: Review PTHR42918, class II LysRS plus the EpmA paralog
  details: |
    New family review, written because E. coli EpmA belongs here. Functional coherence HETEROGENEOUS: the family shares the class II aminoacyl-adenylate core but the acceptor differs, tRNA(Lys) for the LysRS subfamilies versus the EF-P protein for SF6. Lysine-tRNA ligase activity is scoped to SF15/SF9/SF5 and deliberately excludes SF6; protein-lysine lysyltransferase activity is scoped to SF6 alone. Node assessments cover PTN000502669 for GO:0004824 (SOUND, and EpmA correctly does not inherit it) and for GO:0005737 (SOUND, with EpmA itself among the seeds). The remaining PAINT nodes concern aspartate-tRNA ligase, mitochondrial and vertebrate KARS1-specific claims outside this scope. Notes record that the family is too broad to ground the module's EF-P activation step, which uses NCBIfam TIGR00462 and InterPro IPR004525 instead.
