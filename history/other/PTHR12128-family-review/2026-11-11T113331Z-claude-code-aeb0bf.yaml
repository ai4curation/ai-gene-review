  summary: 'Family review: PTHR12128 (DapA/NanA superfamily)'
  details: |
    Family review written for the hydroxyproline-catabolism module, compatible with the templated draft in open maintainer PR #5077: same reference protein, PAINT nodes and subfamily ids, with corrections. SF72 is added for the KT2440 Pyr4H2C deaminase PP_1257 and SF19 (KDGDH) is marked diverged. The ancestral DHDPS node is NEEDS_PRUNING because TreeGrafter still reaches the KDGDH and deaminase lineages, which both gene reviews remove. HOGA1-specific terms carry exceptions for the bacterial DapA members that share SF66. Cytosol is UNRESOLVED rather than subfamily-scoped, because SF66 mixes cytosolic bacterial with mitochondrial animal members; the Enterobacteriaceae IRD node and the subfamily-level scope of the deaminase activity are UNRESOLVED with the missing evidence named. Subfamily counts were re-derived from the entries CSV with a real CSV parser.
