  summary: 'Complete family biological assessment: PTHR11742'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Class I/GH47 alpha-mannosidases differ in secretory-pathway location and glycan-trimming specificity. Recombinant fly mas-1 was active on oligomannosidic glycans in a study that explicitly distinguished GH47 class I enzymes from GH38 class II enzymes (PMID:23979800). This establishes a characterized fly class I branch without transferring the properties of ManIIb or acidic class II enzymes to alpha-Man-Ia. The target's reviewed IA-related classification is consistent with secretory-pathway glycan processing, while ER versus Golgi residence, individual linkage preferences and completion of a whole trimming pathway are not universal family properties. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
