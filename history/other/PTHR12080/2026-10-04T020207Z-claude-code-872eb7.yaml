  summary: 'Create family review: PTHR12080 (CD2/SLAM)'
  details: |
    New PANTHER family review for PTHR12080, written alongside the human, mouse and rat CD48 reviews. Classifies the family as heterogeneous (SLAM-related receptors and CD2 versus the GPI-anchored or ligand members CD48 and CD58, plus neuronal VSTM5). Assesses six PAINT node assertions: the CD48 receptor-ligand and CD2/CD48 NK-activation and adhesion nodes are sound; the root signaling receptor activity, T cell activation and outer-leaflet nodes need pruning because, in GOA, they reach 27 rodent PSG/CEACAM proteins and human CEACAM21 that UniProt now classifies in PTHR44427 (reproducible with iba_descendants.py). Validated with linkml-validate, linkml-term-validator and the family/gene cross-check.
