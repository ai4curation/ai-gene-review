  details: |
    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR12080-tree-nodes.yaml, from `just phylo-family PTHR12080`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

    - PANTHER:PTN008532944 GO:0030101 (NEEDS_PRUNING): the reason made a claim the tree contradicts; the reason was corrected. Added to the reason: In the PANTHER 19.0 tree the node is a Euteleostomi speciation node with 42 leaves in 19 species and 3 subfamilies, so it covers more than human, mouse and rat CD2 and CD48. The pruning rests on the rodent signalling data, not on the tree.
    - PANTHER:PTN000249437 GO:0038023 (NEEDS_PRUNING): the reason made a claim the tree contradicts; the reason was corrected. Added to the reason: In the PANTHER 19.0 tree the node is not the family root but a duplication node after Deuterostomia before Euteleostomi with 353 leaves, and the 3 seeds sit in 2 of its 6 branches, so the node is their common ancestor. The PSG/CEACAM argument rests on GOA and function.
    - PANTHER:PTN008532932 GO:0042110 (NEEDS_PRUNING): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the node is a Tetrapoda speciation node and both seeds sit in one branch, a duplication node after Theria before Eutheria 5 steps below it. The objection rests on GOA descendants and their lack of T cell evidence.
    - PANTHER:PTN008989435 GO:0009897 (NEEDS_PRUNING): the reason made a claim the tree contradicts; the reason was corrected. Added to the reason: In the PANTHER 19.0 tree the node is the family root with 362 leaves, and all 7 seeds sit in one branch whose common ancestor is 5 steps below it. HEPACAM is in this tree as subfamily SF59 under the root, so its membrane location is inherited within the family.

    Each row now quotes the family's node listing in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
