  details: |
    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR12080-tree-nodes.yaml, from `just phylo-family PTHR12080`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

    - PANTHER:PTN008532944 GO:0030101 (NEEDS_PRUNING): the reason made a claim the tree contradicts (The node's descendants are CD2 and CD48 in human, mouse and rat; the listing shows the node has 42 leaves in 19 species and 3 subfamilies, including SF125 CD48 ANTIGEN-LIKE.). The reason was rewritten to correct it; the rest of its argument is kept.
    - PANTHER:PTN000249437 GO:0038023 (NEEDS_PRUNING): the reason made a claim the tree contradicts (in GOA the root node also delivers this IBA; the listing shows PTN000249437 is a duplication node at depth 5, not the family root (the root is PTN008989435).). The reason was rewritten to correct it; the rest of its argument is kept.
    - PANTHER:PTN008532932 GO:0042110 (NEEDS_PRUNING): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the node is a Tetrapoda speciation node and both seeds sit in one branch, a duplication node after Theria before Eutheria 5 steps below it. The objection rests on GOA descendants and their lack of T cell evidence.
    - PANTHER:PTN008989435 GO:0009897 (NEEDS_PRUNING): the reason made a claim the tree contradicts (Descendants in GOA also include HEPACAM (PTHR44888); the listing shows subfamily SF59 HEPATIC AND GLIAL CELL ADHESION MOLECULE with 35 leaves below this PTHR12080 root.). The reason was rewritten to correct it; the rest of its argument is kept.

    Each row now quotes the family's node listing in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
