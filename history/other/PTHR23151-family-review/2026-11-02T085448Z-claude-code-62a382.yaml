  summary: Add Syntrophotalea acetoin E2 AcoC to PTHR23151 SF90
  details: |
    Syntrophotalea (Pelobacter) carbinolica AcoC (Q59658) is classified in SF90 by both PANTHER and UniProt and is now listed as an SF90 representative with its gene review. Notes record that it is an acetyltransferase of the acetoin system rather than a PDH E2, and that B. subtilis AcoC (O31550) is deliberately not listed because PANTHER's classification file (PTHR23151:SF90) and UniProt (PTHR43178:SF5) disagree about it.
