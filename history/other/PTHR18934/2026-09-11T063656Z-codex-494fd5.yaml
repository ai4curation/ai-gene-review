  summary: 'Complete family biological assessment: PTHR18934'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. DEAH helicase relatives diversify in auxiliary domains and RNA pathways. Mammalian YTHDC2 combines an RNA-stimulated ATPase/helicase module with m6A recognition and ankyrin-mediated XRN1 recruitment (PMID:29033321). Related helicases instead participate in splicing, germline RNA regulation or viral transcription. CG8915's verified YTHDC2-related classification supports a branch hypothesis, but m6A recognition, XRN1 recruitment and a particular RNA substrate require their relevant domains and cannot be inherited from the shared helicase core alone. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
