  summary: 'Complete family biological assessment: PTHR11782'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. NTPDase/apyrase proteins share nucleotide-phosphate hydrolysis but differ in substrate preference and membrane orientation. Direct characterization of the single fly NTPase/NTPDase6 found an intracellular, primarily ER-localized enzyme that hydrolyzes UDP, GDP and IDP efficiently, with other NDPs/NTPs poor substrates (PMID:19467631). Thus the family does not imply a cell-surface ATP-removing ectoenzyme for every member. The fly result supports a nucleotide-diphosphatase mechanism in an endomembrane context, while ATP preference, extracellular purinergic signaling and an exact glycosylation role require separate evidence. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
