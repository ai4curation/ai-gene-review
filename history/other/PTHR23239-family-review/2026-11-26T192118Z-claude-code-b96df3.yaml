  summary: 'Family review: PTHR23239 (type I keratins and phakinin)'
  details: |
    PANTHER family review written alongside the human KRT9 gene review. Established from the entries file and the PANTHER 19.0 tree that the family holds the type I keratins plus phakinin (BFSP2), not the whole intermediate filament superfamily. Assessed all 13 PAINT IBD rows in the fetched slice (PTHR23239-paint.tsv); six reach KRT9. Seed annotations were read from QuickGO by gene product and GO id. Verdicts: cytoskeleton (PTN001905729), keratin filament (PTN002757528, PTN002757475), intermediate filament organization (PTN008383948, PTN002757456) and the branch-specific rows are SOUND. Structural constituent of skin epidermis at PTN002757528 is NEEDS_PRUNING, with an IRD requested at the mammalian KRT12 node PTN000580219 because keratin 12 is a corneal keratin. Morphogenesis of an epithelium (PTN002757528) and epithelial cell differentiation (PTN008383948) are UNRESOLVED: their seeds are phenotype and expression annotations, read mostly from abstracts. No IRD or IKR lies on the KRT9 lineage. An asta family deep-research run returned only off-topic InterPro-database papers and was discarded; this is recorded in PTHR23239-notes.md.
