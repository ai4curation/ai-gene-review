  summary: 'Family re-review: PTHR42991 against the PANTHER 19 tree, alignment and
    literature'
  details: |
    Independent re-review of the CREATE-only family review. Tree: PANTHER 19 treeinfo (118 leaves) and PANTHER's own familymsa alignment were both obtained; tree_msa_check.py regenerates PTHR42991-tree-msa-check.txt (topology, residue table for all leaves at the UniProt site positions of S. mutans GapN Q59931, pairwise table for the 20 Swiss-Prot members that are not tree leaves, curated UniProt statements, QuickGO annotations, PubMed titles). Confirmed: HETEROGENEOUS; PTN000193241 GO:0008886 SOUND (seed Q1WIQ6 is a leaf with an IDA; 80 of 91 leaves keep the full GapN residue set, the other 11 are fragmentary or aberrant gene models; function probably older than the node but no experimentally annotated leaf outside Viridiplantae); GO:0016620 family-wide; GO:0004029 not valid for the NADP-specific GapN clade. Changed: PTN008677383 GO:0008911 stays TOO_DEEP but with corrected reasoning and a proposed action REMOVE_IBD. The node is the Archaea-Eukaryota child of the root (19 leaves), not a node deep in SF1; its Saccharolobus leaves SSO1629 and SSO1842 are characterized succinate semialdehyde dehydrogenases (PMID:23296511), the seed's sister Halobacterium leaf has archaeal-GapN-like substrate residues, and the 15 eukaryotic leaves are uncharacterized, so no internal node below it has a second supported member. The earlier claim that this node feeds the TreeGrafter rows on SlaB and SftD was wrong: those rows cite the sister eubacterial node, and 20 of 22 TreeGrafter rows for the term cite graft points outside the IBD clade. Added subfamilies SF7 and SF11 with clade nodes (both nested plant GapN paralog clades, not diverged), SF1 described as the residual root label, two residue sites (catalytic Cys284; phosphate-binding Arg437) with controls, reference protein changed to Q59931, and 18 PubMed-verified references. Not verified: full texts (abstracts and curated UniProt statements only; literature cited without quotations because the papers are not in the publication cache), function of the Halobacterium, Dictyostelium and streptophyte members of the Archaea-Eukaryota clade, and the source of the out-of-clade TreeGrafter rows. Validated with just validate-families and just validate-quotes.
