  summary: 'Family review: PTHR30024'
  details: |
    PANTHER family review written while completing the bacterial alkanesulfonate uptake and FMN-dependent desulfonation module (modules/bacterial_alkanesulfonate_uptake_desulfonation.yaml), which grounds one of its annoton roles to a subfamily of this family. Records functional coherence and its reason, the subfamilies that matter for substrate specificity with UniProt representatives, an assessment of every PAINT node in PTHR30024-paint.tsv read as a phylogenetic placement judgement, and term scopes for the terms the module uses. This family is the solute-binding-protein component (SsuA, TauA, NrtA/CmpA, OpuBC/OpuCC); its single PAINT node carries cellular response to sulfate starvation from E. coli TauA to the whole family and is assessed TOO_DEEP, with the nitrate and osmoprotectant subfamilies named as wrongly inheriting it. Reference protein: E. coli SsuA (P75853). The reference protein's gene review is COMPLETE. Validated with the validate-families steps: LinkML schema, GO term ids and labels, verbatim publication and local-file quotes, and the family/gene cross-check.
