  details: |
    Created a structured FamilyReview for PTHR24044 (NOTCH LIGAND FAMILY MEMBER) using the PANTHER 19.0 tree, sequence classification files and PAINT leaf GAF. The family is heterogeneous: Delta/Jagged DSL ligands plus DNER, NOTCH2NL, Weary, SNED1, attractin-like, Crumbs and two Notch receptors (NOTCH4, LIN-12). PTN002371879 (Notch binding) is the near-root node of this family's tree (not PTHR45836) and was assessed NEEDS_PRUNING; PTN001170801 Notch signaling and plasma membrane SOUND, negative regulation of Notch signaling NEEDS_PRUNING for the LIN-12 branch. Documented the disagreement between PANTHER classification files (DLL1 in SF380) and InterPro/UniProt DR PANTHER (DLL1 in PTHR24049:SF38).
