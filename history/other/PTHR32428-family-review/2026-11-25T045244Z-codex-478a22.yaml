  summary: Align PTHR32428 PAINT row assessments with seed evidence
  details: |
    Responded to review by tightening evidence support for the PTHR32428 PAINT rows. Replaced the generic TOR kinase quote on the GO:0019887 protein kinase regulator activity IBD with the PomBase bit61 seed paper and downgraded the row to UNRESOLVED because the seed establishes Bit61 as a TORC2-specific subunit but not its specific kinase-regulatory activity. Reworked the fungal GO:0007163 cell-polarity assessment around the A. nidulans hbrB/C8V1V6 seed paper and the budding-yeast BIT61 PAINT seed. Reclassified the metazoan PRR5/PRR5L GO:0051897 PI3K/AKT-signaling row as WRONG_NODE after reading the mouse Protor seed paper, which reports no Akt phosphorylation defect and instead supports an SGK1/NDRG1 effect. Added the missing GO:0051897 term assessment and the second fission-yeast SF2 representative support row.
