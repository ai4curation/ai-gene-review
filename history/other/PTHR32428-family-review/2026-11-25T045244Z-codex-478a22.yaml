  summary: Create PTHR32428 TORC2 family review
  details: |
    Created a structured PTHR32428 family review for Bit61/PRR5 TORC2 accessory subunits. Assessed the three opisthokont TORC2 complex, TORC2 signaling, and protein kinase regulator activity IBD rows as sound for fungal Bit61/Bit2 and metazoan PRR5/PRR5L proteins; scoped the fungal cell-polarity row to the Bit61/Bit2 branch; and recorded the metazoan positive PI3K/AKT-signaling row as unresolved pending primary seed review. Validated with the family schema, supporting-text quote checks, GO term validation, residue checks, and the family/gene cross-check.
- type: EDIT
  outcome: changed
