  summary: Create PTHR32428 TORC2 family review
  details: |
    Created a structured PTHR32428 family review for Bit61/PRR5 TORC2 accessory subunits. Assessed the three opisthokont TORC2 complex, TORC2 signaling, and protein kinase regulator activity IBD rows as sound for fungal Bit61/Bit2 and metazoan PRR5/PRR5L proteins; scoped the fungal cell-polarity row to the Bit61/Bit2 branch; and recorded the metazoan positive PI3K/AKT-signaling row as unresolved pending primary seed review. Validated with the family schema, supporting-text quote checks, GO term validation, residue checks, and the family/gene cross-check.
- type: EDIT
  outcome: changed
  sections:
  - family_review
  summary: Align PTHR32428 PAINT row assessments with seed evidence
  details: |
    Responded to review by tightening evidence support for the PTHR32428 PAINT rows. Replaced the generic TOR kinase quote on the GO:0019887 protein kinase regulator activity IBD with the PomBase bit61 seed paper and downgraded the row to UNRESOLVED because the seed establishes Bit61 as a TORC2-specific subunit but not its specific kinase-regulatory activity. Reworked the fungal GO:0007163 cell-polarity assessment around the A. nidulans hbrB/C8V1V6 seed paper and the budding-yeast BIT61 PAINT seed. Reclassified the metazoan PRR5/PRR5L GO:0051897 PI3K/AKT-signaling row as WRONG_NODE after reading the mouse Protor seed paper, which reports no Akt phosphorylation defect and instead supports an SGK1/NDRG1 effect. Added the missing GO:0051897 term assessment and the second fission-yeast SF2 representative support row.
- type: EDIT
  outcome: changed
  sections:
  - family_review
  summary: Export GO:0051897 PAINT removal action
  details: |
    Added the REMOVE_IBD proposed PAINT action to the PTHR32428 GO:0051897 assessment and reworded the WRONG_NODE reason to state directly that PTN001286150 does not support positive regulation of PI3K/AKT signaling.
- type: EDIT
  outcome: changed
  sections:
  - family_review
  summary: Ground GO:0051897 seed provenance
  details: |
    Added a compact QuickGO-derived receipt file for the MGI GO:0051897 rows on mouse Prr5 and Prr5l, cited those rows from the PTN001286150 assessment, and downgraded the family term-scope assessment from NOT_APPLICABLE to UNRESOLVED because the PAINT IBD is refuted by its seed paper but independent experimental support across metazoan PRR5/PRR5L members was not surveyed.
- type: EDIT
  outcome: changed
  sections:
  - family_review
  summary: Complete polarity and PRR5/PRR5L surveys
  details: |
    Responded to review on PTHR32428 by citing the direct hbrB loss-of-polarity sentences from PMID:14998529 and adding a QuickGO-derived receipt for the SGD BIT61 GO:0030950 actin-cytoskeleton-polarity row that supports the budding-yeast side of the PTN001286169 GO:0007163 IBD. Added provenance to the mouse Prr5/Prr5l GO:0051897 receipt file, added a complete QuickGO slice of current GO:0051897 rows for the reviewed human, mouse and rat PRR5/PRR5L accessions, and moved the GO:0051897 term assessment back to NOT_APPLICABLE after combining those current annotation rows with the independent PMID:22609986 PRR5L result that supports PKCdelta rather than AKT regulation.
- type: EDIT
  outcome: changed
