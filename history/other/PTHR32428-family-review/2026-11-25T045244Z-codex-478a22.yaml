    Narrowed the PTHR32428 GO:0051897 family term-scope assessment to UNRESOLVED while retaining the PTN001286150 REMOVE_IBD request, because PMID:22609986 supports PRR5L-specific PKCdelta selectivity but also reports in vitro PRR5L effects on AKT substrate preference that preclude a NOT_APPLICABLE verdict for every future metazoan PRR5/PRR5L member.
