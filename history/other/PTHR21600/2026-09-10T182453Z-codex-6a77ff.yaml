  summary: Curate PTHR21600 family function boundaries
  details: |
    Curated RluA-related RNA pseudouridine synthases. Assessment: HETEROGENEOUS. RNA class, modification position and compartment differ among the named member groups. The fly nociception study describes the proteins as putative pseudouridine synthases and does not establish a specific tRNA or mRNA target. The ARBA-derived target positions in the fly UniProt record are not independent substrate evidence. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
