  summary: 'Complete family biological assessment: PTHR21600'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. RluA-like pseudouridine synthases share uridine-isomerization chemistry but differ in RNA class, modification site and compartment across RluC/RluD/TruC and RPUSD-related branches. Fly RluA-1 and RluA-2 loss-of-function and rescue establish roles in nociceptive behavior (PMID:33028630), without identifying their modified RNA or nucleotide. The phenotype is therefore not evidence for an inherited bacterial rRNA site or a specific tRNA position. Exact substrate-site assignments remain branch-specific. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
