  summary: 'Family review: PTHR43408'
  details: |
    PANTHER family review written while completing the bacterial alkanesulfonate uptake and FMN-dependent desulfonation module (modules/bacterial_alkanesulfonate_uptake_desulfonation.yaml), which grounds one of its annoton roles to a subfamily of this family. Records functional coherence and its reason, the subfamilies that matter for substrate specificity with UniProt representatives, an assessment of every PAINT node in PTHR43408-paint.tsv read as a phylogenetic placement judgement, and term scopes for the terms the module uses. This family is the two-component NAD(P)H:FMN reductases (SsuE, MsuE/SfnF); the reductase activity and complex nodes are assessed SOUND, while the DNA damage response node is assessed WRONG_NODE because its only seed is E. coli SsuE's own expression annotation from a mitomycin-C array survey in which nearly 30% of genes changed. Reference protein: E. coli SsuE (P80644). The reference protein's gene review is COMPLETE. Validated with the validate-families steps: LinkML schema, GO term ids and labels, verbatim publication and local-file quotes, and the family/gene cross-check.
