  summary: Re-scope NADPH term to SF1; add NADH term for SF2
  details: |
    Review response on PR #5917. GO:0052873 (FMN reductase (NADPH) activity) was scoped FAMILY_WIDE, which the cited sources contradict: wild-type P. aeruginosa MsuE has a kcat/Km of (32 +/- 10) x 10^4 M-1 s-1 with NADH against (1.9 +/- 0.4) x 10^4 with NADPH, roughly seventeen-fold in favour of NADH, and PANTHER's member inventory names the SF2 members Q65YX0/Q3K9A2 (SfnF) and Q845S9 (SfnE) as NADH-dependent FMN reductases. The term is now SUBFAMILY_ONLY for PTHR43408:SF1, supported by the P. putida S-313 SsuE assay (NADPH-dependent activity, no activity with NADH) rather than by the NAD(P)H parent quote, which belongs to GO:0008752. Added the mirror assessment GO:0052874 (FMN reductase (NADH) activity) as SUBFAMILY_ONLY for SF2 on the same measured preference. coherence_reason now records the cosubstrate split explicitly. Also corrected the GO:1990202 node reason: P. aeruginosa MsuE was assessed by homology modelling from the SsuE and SfnF structures, not crystallographically. All quotes checked verbatim against the cached files, including the Unicode hyphen, plus/minus, multiplication and minus-sign characters in the MsuE kinetics sentence.
