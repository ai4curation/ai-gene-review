  summary: Adjudicate GPCR activity and PKA sequestering at family level
  details: |
    A new upstream check, FAMILY_FUNCTION_UNREVIEWED, compares the GO ids a
    module asserts at family level against the family review's own
    adjudications. It found that the Hedgehog module types two Smoothened
    annotons with terms this review never assessed, so the module was making
    family-level claims the family review was silent on.

    GO:0004930 G protein-coupled receptor activity is scoped SUBFAMILY_ONLY
    across the seven membrane-bound subfamilies: Smoothened plus the six
    Frizzleds. The point of the scoping is not to privilege Smoothened but to
    keep the term off the three secreted Frizzled-related subfamilies, which
    carry the cysteine-rich domain and no transmembrane region, so cannot be
    receptors of any class. The reason records a caution that matters for
    propagation: the term holds with very different strength across the
    members it covers. Smoothened's coupling to a heterotrimeric Gi protein is
    structurally resolved, while the Frizzleds signal principally through
    Dishevelled, which is why the curated FZD7 review keeps the term as a
    structural classification rather than a core function. Both are correct
    uses; the difference is in what the receptor does with the coupling.

    GO:0140311 protein sequestering activity is scoped to Smoothened alone,
    and for a subfamily-specific reason rather than a fold-level one. Its
    phosphorylated cytoplasmic tail carries a pseudosubstrate motif of the
    kind used by PKI proteins and type I PKA regulatory subunits, letting it
    hold PKA catalytic subunit at the ciliary membrane without being
    phosphorylated. No Frizzled has the motif and the secreted members have no
    cytoplasmic tail to carry one.

    Both assessments are supported by verbatim quotes checked against the
    cached publications, and PMID:31168089 and PMID:39198452 were added to the
    references. Both module warnings are now fully cleared.
