  summary: Expand GO:0004930 to all thirteen membrane-bound subfamilies
  details: |
    A review bot on PR #4404 found that the GO:0004930 assessment added
    earlier in this session contradicted itself. The scope_reason says the
    term is safe for every membrane-bound member, and cites the curated FZD7
    review as an example of a member the term covers, while
    applicable_subfamilies listed only seven subfamilies and omitted SF31
    FRIZZLED-7 along with SF34, SF75, SF79, SF86 and SF136. A propagator reads
    the list, not the prose.

    The cause was a bad construction rule. The list was built from the ten
    subfamilies this review declares under the subfamilies key, minus the
    three secreted Frizzled-related ones. That is internally coherent but it
    is not the rule the rest of the file uses, and the declared-subfamilies
    block is a description of what this review characterises in detail, not an
    enumeration of the family's membership.

    Checking the neighbouring assessments settles the correct set without
    judgement, and shows the file was already consistent before this entry was
    added. GO:0005886 plasma membrane lists exactly thirteen: the twelve
    Frizzled subfamilies plus SF35 Smoothened, drawing the identical
    membrane-bound line for the identical structural reason. GO:0042813 Wnt
    receptor activity lists the twelve Frizzleds and not Smoothened, which
    binds sterols. GO:0017147 Wnt-protein binding lists fifteen, the twelve
    plus the three secreted clades and not Smoothened, matching the
    cysteine-rich domain being the shared Wnt-binding module. The three
    Smoothened-specific terms list SF35 alone. GO:0004930 was the only
    outlier.

    It now carries the same thirteen as GO:0005886, with labels taken verbatim
    from that verified block rather than retyped, and the scope_reason says
    explicitly that the grant is the same thirteen as the plasma-membrane
    assessment and that the two lists should be kept in step, so the next
    reader has the construction rule rather than having to infer it. The
    caution about the term holding with different strength across the members
    is kept: Smoothened's Gi coupling is structurally resolved, while the
    Frizzleds signal principally through Dishevelled, which is why the FZD7
    review keeps the term non-core.

    The error was in the safe direction, under-claiming rather than
    over-claiming, but both halves of one block cannot be right.
    family_residue_validator now reports 2809 pass and 0 fail, up from 2793,
    the additional checks being the six subfamilies added here.
