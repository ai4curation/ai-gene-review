  summary: 'Create family review: PTHR11309 FRIZZLED'
  details: |
    First family review for the Frizzled/Smoothened class-F receptor family, written to adjudicate the PAINT nodes that the Hedgehog and Wnt modules both ground on. Records the family as HETEROGENEOUS across three groups: Wnt-receptor Frizzleds, Smoothened (PTHR11309:SF35, which PAINT marks as having lost Wnt receptor activity, Wnt-protein binding, canonical and non-canonical Wnt signaling at PTN000885245), and the secreted Frizzled-related proteins (PTHR11309:SF87, SF45, SF7, which lost plasma membrane and receptor activity while retaining Wnt binding). Sixteen node assessments across six PTN nodes: mostly SOUND, one TOO_DEEP (commissural neuron axon guidance asserted at Eumetazoa on two vertebrate seeds, where the sibling node PTN002601731 already provides a vertebrate-scoped placement), and three UNRESOLVED (Smoothened cilium at Eumetazoa against cilium-independent fly signaling; cytoplasm for secreted SFRP4; the sFRP1/sFRP2 node depth on mammal-only seeds). Seven term assessments bound Wnt and Hedgehog terms to their subfamilies. No residue_sites asserted because UniProt sequences are unreachable from this environment. Validated with linkml-validate -C FamilyReview (no issues); four supporting_text quotes verified verbatim against cached publications; family/gene cross-check reports no conflicts against the curated SMO review.
