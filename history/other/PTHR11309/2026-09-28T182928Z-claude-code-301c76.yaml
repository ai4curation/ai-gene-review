- type: EDIT
  outcome: changed
  summary: Resolve two node assessments from Drosophila gene curation
  details: |
    Curating Drosophila smo settled both assessments this review had left UNRESOLVED at node PTN000885245. The cilium row was questioned because fly Hedgehog transduction runs on a cytoplasmic Costal-2 complex, making a Eumetazoa-level ciliary assertion look like vertebrate biology leaking into flies. The implied fly annotation exists and is experimental: GO:0005929 by IDA from PMID:24768000, a study of cilia-mediated Hedgehog signalling in olfactory sensory neurons, corroborated by UniProt against the same paper. The contradiction dissolves on cell type, since the fly's developmental epithelia are unciliated while its sensory neurons are not. The dendrite row resolves by the same experiment, because an insect olfactory sensory neuron elaborates its cilium from the distal dendrite, so the two rows are one localization at two resolutions. Both are now SOUND. The TOO_DEEP assessment on commissural neuron axon guidance is unaffected and gains support: that row has no fly seed at all. Two UNRESOLVED assessments remain, both on the secreted Frizzled-related clades and unrelated to this work.
