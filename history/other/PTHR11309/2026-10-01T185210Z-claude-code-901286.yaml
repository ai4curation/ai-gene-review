  summary: Correct the GO:0035567 seed set to match PAINT's with-list
  details: |
    Post-rebase validation caught a seeding error this review introduced. The
    node assessment for GO:0035567 non-canonical Wnt signaling pathway at
    PTN000139394 listed human FZD3 (Q9NPG1) among the seeds, on the reasoning
    that the beta-catenin-independent branches would be seeded by the classic
    planar-polarity pair FZD3/FZD6. PAINT's with-list for that node and term
    does not contain FZD3. The accession was asserted from expectation about
    which Frizzleds carry PCP function rather than read off the IBD row, and
    family_residue_validator's NODE_SEEDS check rejected it.

    The actual with-list on the PTHR11309 IBD row (snapshot 20260828) is broad:
    UniProtKB O60353 (FZD6), Q9ULV1 (FZD4), Q13467 (FZD5), O75084 (FZD7),
    Q9ULW2 (FZD10), nine MGI and two ZFIN orthologue ids, FB:FBgn0016797 (fz2)
    and WB:WBGene00003397. The seeds now name four verified members of that
    list, and the assessment reason has been rewritten to describe the seeding
    as it is rather than as the PCP-specific set it was assumed to be. The
    assessment stays SOUND, but for a better reason: root placement of a
    pathway term is defensible because the seeding spans most of the family
    across three phyla, not because two specialist paralogs anchor it.

    Accession identities were confirmed against PTHR11309-entries.csv rather
    than recalled. The assessment is unchanged in substance; what changed is
    that its stated evidence is now the evidence that exists.
