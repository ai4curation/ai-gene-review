  summary: Complete evidence-grounded family review for PTHR10410
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. The exact fly CSN5 PB isoform retains the complete MPN domain and JAMM catalytic region despite two deletions outside that domain. This supports a COP9 component with NEDD8-deconjugation architecture, not synaptic-vesicle residence. A developmental or synaptic phenotype is not a localization assay. The broader grouping contains proteasomal, COP9 and translation-associated MPN proteins with different complexes, so synaptic vesicle is not a shared compartment and no exhaustive positive subfamily set is established. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
