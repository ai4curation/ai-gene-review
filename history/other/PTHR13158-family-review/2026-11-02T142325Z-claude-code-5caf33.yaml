  summary: 'Family review: PTHR13158 (NADK2)'
  details: |
    PANTHER family review of PTHR13158 (mitochondrial NAD kinase NADK2), with a reproducible survey script (PTHR13158-bioinformatics/family_survey.py) of the PANTHER 19 reference tree, UniProtKB membership and the GGDG catalytic block. Coherence MOSTLY_COHERENT: the eukaryotic clade (PTN000994636) is uniform and holds all experimental data, while about a third of UniProtKB members are bacterial, join at a horizontal-transfer root, carry a GQDGL/GGDN variant block and mostly lack Pfam PF01513; SF4 is a nematode nadk-1 paralog in a lineage without a PTHR20275 NADK. Node calls: mitochondrion at PTN000994636 SOUND; NAD+ kinase activity and NAD+ metabolic process at the root PTN004406956 TOO_DEEP (recommend PTN000994636, and GO:0006741 in place of GO:0019674). GGDG residue site recorded with mouse, nematode and Plasmodium positive and two bacterial negative controls. Validated with linkml-validate, the term validator, the reference validator, family_residue_validator (31 pass) and family_gene_crosscheck.
