- type: EDIT
  outcome: changed
  summary: Move reference_protein to an in-tree member (GRPR), and say why
  details: |
    Review finding on PR #6363. reference_protein named KISS1R (Q969F8), while the review's own central finding is that KISS1R is not a leaf of PANTHER's PTHR45695 tree at all: it sits in PTHR24230:SF78 and takes its IBA annotations from there, and it is a member here only by InterPro's HMM classification, which UniProt repeats.

    Decision: move the slot rather than justify KISS1R. The schema defines reference_protein as the best-characterized member used as the default anchor for residue positions, and family_residue_validator reads it as default_anchor for any residue_site with no explicit anchor. Anchoring family-level residue claims on a protein outside the family's own tree would put the default outside the clade those claims describe, silently, in the one slot machine tooling reads. The new anchor is human GRPR (P30550), a leaf of PTHR45695:SF7 below PTN000663291, the one node at which PAINT makes a specific molecular-function assertion inside this tree and, by the review's own summary, where the experimental evidence lies. The residue validator independently corroborates the choice: its 26 PANTHER_MEMBERSHIP findings for this family are all source disagreements, and no bombesin-clade member including P30550 is among them, whereas Q969F8 is. The accession, label, symbol and organism were copied from the SF7 representative_members block in this same file, not written from memory. gene_review is omitted because no GRPR review exists in this repository; nothing in the codebase reads that key.

    The notes gain a paragraph explaining the choice and why KISS1R nonetheless dominates the analysis: it is the receptor the two campaign gene reviews curate, so its IBA rows are what had to be traced, and tracing them is what established that they descend from PTHR24230. It is the family's worked counterexample, not its exemplar. This review declares no residue_sites, so nothing currently resolves against the anchor either way. No subfamily, node verdict, term assessment or quote changed.
