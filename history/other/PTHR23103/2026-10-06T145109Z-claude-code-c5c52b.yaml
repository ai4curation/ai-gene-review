  summary: Create PANTHER family review PTHR23103 (APP/APLP1/APLP2)
  details: |
    Created the FamilyReview for PTHR23103 (ALZHEIMER'S DISEASE BETA-AMYLOID RELATED). Subfamilies SF7, SF16, SF13, SF14 and SF15 placed on the PANTHER 19 tree (treeinfo service). All 17 PAINT IBD rows at four nodes were assessed: PTN000559854 (Bilateria: central nervous system development, axonogenesis), PTN000559933 (Ecdysozoa: neuron projection, neuronal cell body), PTN002749597 (Euteleostomi APLP1 clade: alpha-2A/2B/2C adrenergic receptor binding, plasma membrane, Golgi apparatus) and PTN002749606 (Euteleostomi APP clade: signaling receptor activator activity, signaling receptor binding, early endosome, Golgi apparatus, plasma membrane, cell surface, membrane raft); all judged SOUND. No amyloid-beta, amyloid fibril, KPI or copper term is asserted at any node. Three residue sites anchored to APP P05067 v3 (CuBD His147/His151/Tyr168, KPI P1 Arg301, Abeta 672-713 motif) were checked against UniProt sequences, and term assessments scope amyloid fibril formation to SF7/SF16, serine-type endopeptidase inhibitor activity to SF7/SF16/SF14, copper ion binding to the CuBD site, and heparin binding and axonogenesis family-wide. Supporting publications were cached with just fetch-pmid. Validated with the family_review schema, linkml-term-validator, family_residue_validator (69 pass, 0 fail), family_gene_crosscheck (0 conflicts).
