  summary: Create PTHR21340 (asymmetrical Ap4A hydrolase Nudix) family review
  details: |
    New FamilyReview for PANTHER PTHR21340. functional_coherence MOSTLY_COHERENT: SF0 holds the characterized asymmetrical Ap4A hydrolases (NUDT2 orthologs, C. elegans ndx-4, Drosophila Datp, Plasmodium) plus Thermus Ndx1 and large-DNA-virus Nudix enzymes (ASFV g5R: DIPP/decapping); SF7 is an uncharacterized actinobacterial subfamily. PAINT node PTN000482012 is the family root (LUCA) in PANTHER 19: GO:0004081 assessed SOUND; GO:0006167 AMP and GO:0006754 ATP biosynthetic process (seeded only by ndx-4 product-based IDA) assessed WRONG_NODE and NOT_APPLICABLE, with GO:0015967 diadenosine tetraphosphate catabolic process recommended. PTN005180687 (nudB functions) lies in the PANTHER 19 PTHR43736 tree, not PTHR21340; UniProt cross-references nudB to PTHR21340:SF0, so those assertions are UNRESOLVED/out of scope here. Added residue site nudix_catalytic_glutamates (ndx-4 E52/E56) with NUDT2, Plasmodium and Thermus Ndx1 positive controls. Added tree_check.py and its output PTHR21340-tree-check.txt as reproducible provenance for node placement. Cached PMIDs 17698004, 15024014, 11773415, 19695654, 15596429, 26829485, 8798731.
