  summary: 'Complete family biological assessment: PTHR10997'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Importin-beta-like receptors mediate Ran-dependent transport but recognize different cargoes. Fly DIM-7/Msk binds phosphorylated ERK and is required for its nuclear accumulation, with rescue restoring the phenotype (PMID:11262240). This is direct support for one fly cargo pathway; it does not establish that every importin-7/8/11-related member transports activated ERK or Smads. Nuclear import is a strong mechanism for characterized receptors, while the exact exhaustive family/subfamily grant remains unresolved rather than treating incomplete cargo coverage as a negative result. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
