  summary: 'Family review: PTHR43217 (Sad/GabD1 SSADH)'
  details: |
    New FamilyReview for the Sad/GabD1-type succinate-semialdehyde dehydrogenase family, which the bacterial_4_hydroxybutyrate_oxidation module grounds its two optional Pseudomonas candidates in (SF2 and SF1) and which had no review. Reference protein is E. coli Sad (P76149), reviewed in the same change. The PAINT slice was fetched; both node-level annotations sit at PTN000193476, and they are assessed differently: the GO:0004777 IBD is SOUND despite its single seed, while the GO:0006099 IBD is WRONG_NODE because it generalizes a mycobacterial TCA-bypass reading. Term scopes: GO:0009013 for SF1 and SF2, which cover every curated member; GO:0004777 for both subfamilies too, since the subfamily split does not track the nicotinamide acceptor and the SF2 member Sad-I carries NAD-dependent FunFam evidence; GO:0006099 left UNRESOLVED because SF1 holds both mycobacterial and enterobacterial members. No residue sites asserted.
- type: EDIT
  outcome: changed
  sections:
  - subfamilies
  - node_assessments
  details: |
    Second round, responding to the PR review. Corrected the SF2 description: P. putida KT2440 Sad-I is PP_2488, as its UniProt OrderedLocusNames line states, not PP_2673 (which is the unrelated Q88JH6). The rest of the branch was grepped for that locus tag. The GO:0006099 node assessment no longer argues from the number of descendants behind the IBD; it argues from the placement, namely that pathway membership here is a property of the host organism's cycle rather than inherited chemistry, so a bypass reading that depends on an incomplete surrounding cycle cannot descend to recipients whose cycle is complete.
  summary: Fix the Sad-I locus tag; argue the GO:0006099 node from placement, not donor count
