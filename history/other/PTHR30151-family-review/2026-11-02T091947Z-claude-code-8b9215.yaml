  summary: 'Family review: PTHR30151'
  details: |
    PANTHER family review written while completing the bacterial alkanesulfonate uptake and FMN-dependent desulfonation module (modules/bacterial_alkanesulfonate_uptake_desulfonation.yaml), which grounds one of its annoton roles to a subfamily of this family. Records functional coherence and its reason, the subfamilies that matter for substrate specificity with UniProt representatives, an assessment of every PAINT node in PTHR30151-paint.tsv read as a phylogenetic placement judgement, and term scopes for the terms the module uses. This family is the permease component (SsuC, TauC, NrtB/CmpB); its two PAINT nodes are both assessed SOUND, one narrow proteobacterial node carrying the sulfur-starvation process and one family-wide node carrying only plasma membrane. Reference protein: E. coli SsuC (P75851). The reference protein's gene review is COMPLETE. Validated with the validate-families steps: LinkML schema, GO term ids and labels, verbatim publication and local-file quotes, and the family/gene cross-check.
