  summary: Add curated rule CR-0007 (CDD cd21555 OmcS-like) and measure the authored-cdd2go
    question
  details: |
    CR-0007 assigns heme binding and electron transfer activity on CDD cd21555, which is unintegrated in InterPro and so reaches GOA by no route. Measured gain on 2026-11-10: heme binding 52 of 56, electron transfer activity 3 of 56. Deliberately excluded three higher-gain terms (anaerobic electron transport chain 54, cell surface 55, protein polymerization 56) as unsafe across all members; polymerization in particular is demonstrated per protein by cryo-EM and would be over-propagation. Added projects/NCBIFam/cdd_go_gap_probe.py, the CDD companion to ncbifam_go_gain.py, which cannot be reused because CDD has no GO to propagate. It measures integration (19902 models, 27.5 percent integrated, 0 with native GO) and a term-free MF headroom proxy. The 40-model sample found 26 reviewed headroom in total with 24 from one model, so a blanket authored cdd2go is not worth building; NCBIFam.md updated with that refinement, which agrees with its existing not-planned verdict for a second reason.
