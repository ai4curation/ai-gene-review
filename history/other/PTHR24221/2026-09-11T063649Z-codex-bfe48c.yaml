  summary: 'Complete family biological assessment: PTHR24221'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Intact ABCB-type transporters couple an ATP-binding cassette to membrane transport, but their substrates and compartments vary. Drosophila HMT1 rescues cadmium sensitivity and localizes to the vacuolar membrane in the tested yeast system, yet it does not transport cadmium-phytochelatin complexes (PMID:19001374). Human ABCB6 structures instead establish porphyrin/hemin recognition (PMID:35950458). These results support the broad ABC-type transporter mechanism while excluding a family-wide phytochelatin, cadmium or heme substrate assignment; complete transporter architecture remains necessary. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
