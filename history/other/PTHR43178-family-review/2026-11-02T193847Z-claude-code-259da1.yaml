  summary: Name all eight SF5 BCKDH-E2 members as GO:0004742 exceptions
  details: |
    PR #5918 review finding 2. The GO:0004742 assessment covered SF5 with human DBT as its only member exception, but SF5 holds eight BCKDH E2s that transfer branched-chain acyl groups rather than acetyl: O06159, P09062, P11181, P11182, P37942, P53395, Q23571 and Q9I1M0. All eight are now named, each quoting its entries.csv name. SF5 stays in scope rather than being dropped, because 20 of its 29 members are bacterial pdhC-type PDH E2s plus B. subtilis AcoC, and because restricting the scope to SF2/SF10/SF13 would re-create the two SCOPE_VIOLATION conflicts this file was written to resolve: M. tuberculosis DlaT (P9WIS7) and B. subtilis AcoC (O31550) are SF5 and their reviews accept GO:0004742. The scope_reason no longer calls the exceptions mitochondrial, since four of the eight are bacterial.
