  summary: 'Family review PTHR16955: KISS1 kisspeptin precursors, all 4 PAINT rows
    assessed'
  details: |
    New family review of PANTHER:PTHR16955 (METASTASIS-SUPPRESSOR KISS-1). Fetched the PAINT slice with just fetch-panther-paint: four IBD rows, all at the root PTN002704209 (Euteleostomi), no IRD or IKR rows. A reproducible tree-placement script (PTHR16955-bioinformatics/) shows the tree has 15 leaves, all in SF6: KISS1 orthologs of 14 mammals and zebrafish kiss1; PTN000424419 is the mammalian node; zebrafish kiss2 is not in the family. All four rows are judged SOUND: GO:0005576 extracellular region, GO:0031773 kisspeptin receptor binding (zebrafish seed rests on activation of a sturgeon receptor by zebrafish Kiss1, PMID:33301759), GO:0007186 GPCR signaling pathway (correct but general; GO:0007200 and GO:0007218 hold family-wide), and GO:0033686 positive regulation of LH secretion. For GO:0033686 the zebrafish leaf was examined: Kiss2 rather than Kiss1 raised gonadotropin subunit mRNA (PMID:18927220) and kiss mutants are fertile (PMID:25406015), but neither refutes the term, and sea bass KiSS-1 induces LH secretion (PMID:19084576), so no IRD is requested. Term assessments: GO:0048018, GO:0031773, GO:0005576, GO:0007200, GO:0007218 and GO:0033686, all family-wide. Coherence COHERENT; the human placental role that mouse lacks (PMID:25468546) is recorded as context to curate on genes, not at family nodes. Consistent with the human KISS1 and mouse Kiss1 gene reviews; the family/gene cross-check reports no conflicts. Not run: the PANTHER member index build (disk); membership of the four representative members was checked against their UniProt PANTHER cross-references and the tree leaves instead.
