  summary: Complete evidence-grounded family review for PTHR10380
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. The exact Lcp3 polypeptide is identical to the reviewed larval cuticle protein, supporting its larval-cuticle role. Related structural cuticle proteins are also directly isolated from pupal cuticle, with stage-dependent expression (PMID:12609518). Thus the broad cuticle structural role is coherent but a specifically larval term cannot be granted universally. Chitin-binding signatures alone do not resolve developmental stage or tissue-specific incorporation. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
