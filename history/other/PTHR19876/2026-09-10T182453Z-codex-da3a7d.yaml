  summary: Curate PTHR19876 family function boundaries
  details: |
    Curated Coatomer, LIS1 and other WD-repeat interaction proteins. Assessment: HETEROGENEOUS. The member inventory contains COPI alpha/beta-prime, LIS1 and Mdv1 proteins, and experimental Crt10 work supports a separate rRNA-quality-control role. The official coatomer name is not a safe family-wide functional label and does not establish Golgi trafficking for pombe Crt10. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
