  summary: Family review of PTHR24240 for the dismech vision-disorder alignment
  details: |
    First family review of the opsin family, written for projects/DISMECH_VISION_ALIGNMENT after the RHO, OPN1LW, OPN1MW and OPN1SW gene reviews. Coherence HETEROGENEOUS: the family root also holds the orphan receptors GPR52 and GPR88. Outer segment, transducin-mediated opsin signaling and visual perception are scoped to the rod and cone opsin subfamilies. Two PAINT placements are judged TOO_DEEP: photoreceptor outer segment at PTN000662150, which reaches OPN3, OPN5 and arthropod pteropsins, and G protein-coupled photoreceptor activity, phototransduction and cellular response to light stimulus at the family root PTN008398221, from which GPR52 and GPR88 inherit them. Node placements were judged from the leaves under each node in the cached PANTHER trees. Validated with the family schema, term, reference and quote checks; the family/gene cross-check reports no conflict.
