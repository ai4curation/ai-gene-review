  summary: Correct the HAD subfamily from IIIB to IIIA
  details: |
    Review follow-up on PR #5909, finding 3. The summary described GmhB as HAD superfamily subfamily IIIB. That is wrong: both the family's own reference protein, E. coli P63228, and the module's archaeal member A0A2L1CCN4 carry InterPro IPR006549 HAD-SF_hydro_IIIA and NCBIfam TIGR01662 HAD-SF-IIIA, and it contradicted the METMI gmhB gene review added in the same PR, which says IIIA. Corrected to IIIA. The field is free-text summary, so nothing validated it, which is why it needed a human-directed fix.
