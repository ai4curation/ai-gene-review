  details: |
    New FamilyReview for the HAD-superfamily phosphatase family carrying the module's C-7 dephosphorylation step. Marked COHERENT: a single functional subfamily (SF1) bearing the family name, with all reviewed members performing the same reaction. All three PAINT rows at PTN000566251 assessed SOUND; the GO:0034200 row is the strongest grounding in this module, carrying a 2026 snapshot and three independent experimental seeds (H. influenzae P46452, E. coli P63228, V. cholerae Q9KTJ4). GO:0009103 is scoped SUBFAMILY_ONLY rather than family-wide because it is a Gram-negative outcome context: actinobacterial members such as SepL route the same heptose into septacidin rather than lipopolysaccharide.
