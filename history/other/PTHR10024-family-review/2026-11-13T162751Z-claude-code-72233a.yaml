  details: |
    New, partial FamilyReview for PANTHER:PTHR10024. Verdict MOSTLY_COHERENT. Calcium-sensor claims were checked only for the synaptotagmin-1 subfamilies SF239 and SF227. Calcium ion sensor activity and calcium-dependent phospholipid binding are asserted at the family root PTN000001283, which is judged to need pruning: synaptotagmin-12 (SF252) binds neither calcium nor phospholipids (PMID:17190793) and the family has no IRD or IKR rows. SNARE binding, regulation of calcium ion-dependent exocytosis, vesicle-mediated transport, exocytic vesicle and plasma membrane are family-wide. Nodes PTN000740739 and PTN004120656 are unresolved. SYT2, SYT3, SYT5-11, SYT13, SYT15, SYT17 and the C2CD subfamilies were not examined. The PAINT slice was fetched for this review. Validated per file with linkml-validate, the term validator, the reference validator and quote_check.
