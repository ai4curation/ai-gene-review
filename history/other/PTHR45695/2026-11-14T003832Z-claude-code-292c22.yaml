  summary: Family review PTHR45695
  details: |
    Created the PANTHER family review for PTHR45695 (LEUCOKININ RECEPTOR-RELATED), functional_coherence HETEROGENEOUS, reference protein human KISS1R. Fetched the PAINT slice with just fetch-panther-paint (13 nodes, 28 rows) and wrote interpro/panther/PTHR45695/tree_check.py, which locates every PAINT node and every reviewed member in PANTHER's trees for PTHR45695, PTHR24230, PTHR24241, PTHR24243 and PTHR24228 and in PANTHER's TreeGrafter node table; its output is PTHR45695-tree-check.txt. Main finding: InterPro/UniProt classification and PANTHER's tree disagree. Only the GPR151, BRS3, GRPR, NMBR, CCHamide receptor and NPR-9 entries are PTHR45695 tree leaves; the mammalian galanin, kisspeptin, orexin, QRFP and FFAR4 receptors, GPR19 and NPR-15 are leaves of other trees, so 11 of the 13 slice nodes (24 of 28 rows) are other families' nodes. This is also why just paint-losses reports KISS1R and Kiss1r as not leaves of the tree; checked against the PTHR24230 tree, their lineages carry no IRD/IKR. Node verdicts: 22 SOUND, 2 NEEDS_PRUNING (GO:0008528 and GO:0007218 at the PTHR24230 root, inherited by leukotriene and GPR84 receptors), 1 TOO_DEEP (galanin receptor activity at PTN002796297, inherited by CysLT receptors, MCHR2 and RXFP3/4), 2 UNRESOLVED (GO:0046887 at PTN009086039, GO:0032870 at PTN001202348), 1 LOSS_SUPPORTED (FFAR4 IRD). No proposed_action was encoded, because every negative verdict is on a PTHR24230 node whose fix lies outside this family's tree. Seventeen subfamilies (every subfamily with a reviewed entry) described from the entries file; eleven term assessments. Agrees with the KISS1R and Kiss1r gene reviews (cross-check: no conflicts). Fetched 21 PMIDs. Validated with linkml-validate, term_validate.sh, the reference validator, just validate-quotes, family_residue_validator (0 fail; membership unresolved because the PANTHER member index was not built) and family_gene_crosscheck.
