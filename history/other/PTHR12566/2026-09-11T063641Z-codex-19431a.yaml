  summary: 'Complete family biological assessment: PTHR12566'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. CPEB proteins regulate translation through sequence-selective RNA recognition and assembly of regulatory complexes. Human CPEB structures establish the tandem-RRM/ZZ RNA-recognition architecture (PMID:24990967), and fly Orb/Orb2 CLIP establishes CPE-like RNA targets (PMID:27791065). Mechanisms differ even between Orb2 isoforms: Orb2A can supply a glutamine-rich assembly function without requiring its RNA-binding domain, whereas Orb2B requires RNA binding for memory (PMID:23083740). Broad translation regulation is conserved; direct RNA engagement by every isoform, particular target transcripts and neuronal or germline phenotypes are not interchangeable family properties. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
