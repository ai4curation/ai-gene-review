  summary: Add the NADP-specific SSADH term scope
  details: |
    Added a GO:0036243 succinate-semialdehyde dehydrogenase (NADP+) activity assessment, scoped SUBFAMILY_ONLY to SF5 and SF12, the same subfamilies as the cofactor-general parent. The family's SSADHs are dual-cofactor enzymes, so the NADP child is a cofactor branch of one reaction rather than a separate activity: ssd1, UGA2 and ssd2 retain it and the Cupriavidus GabD clone has measured activity with both acceptors. SF12 is included because ssd2 sits there and keeps the term, which a SF5-only scope would have flagged as a violation. The DavD member_exception is repeated, since its glutarate-semialdehyde substrate excludes both cofactor branches. Written while clearing the module's FAMILY_SCOPE_RESTRICTED warning, which was resolved in the module by asserting the cofactor-general term.
