  summary: Scope 2,5-dioxovalerate dehydrogenase activity to PTHR43353:SF3
  details: |
    SF3 is marked diverged and its KGSADH (EC 1.2.1.26) members recorded: A. baylyi KgsD, newly reviewed, and the KT2440 paralog PP_1256. A term assessment scopes GO:0047533 to SF3, noting that it is not family-wide within the subfamily, which also holds aldehyde dehydrogenases with other substrates, and that the cofactor branch of the term is weaker than the substrate claim because A. brasilense has both NAD+- and NADP+-preferring isozymes for the same substrate. Succinate-semialdehyde terms stay with SF5 and SF12.
