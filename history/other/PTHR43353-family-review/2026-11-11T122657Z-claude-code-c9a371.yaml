  summary: Reconcile the PTHR43353 GO:0047533 scope with its own reasoning
  details: |
    PR #6274 review found that the new GO:0047533 assessment declared SUBFAMILY_ONLY for SF3 while its scope_reason said the activity was not SF3-wide, so the machine-readable field licensed what the prose forbade. Re-deriving SF3's membership from the entries CSV resolved it in favour of the subfamily: five of its six Swiss-Prot members are EC 1.2.1.26 KGSADHs (A. brasilense KGSADH-III/LhpG and KGSADH-II, A. baylyi KgsD, C. necator KgsD, P. aeruginosa PA2217), two of them experimentally characterized, and only V. harveyi AldH acts on another substrate. The scope stays SUBFAMILY_ONLY, now with member exceptions. To keep the hydroxyproline and glucarate branches in agreement, the GO:0047533 assessment, both of its member exceptions (V. harveyi AldH, a fatty aldehyde dehydrogenase; and PP_3602, whose cofactor is unmeasured) and the accompanying FAMILY_WIDE GO:0004030 assessment were taken from the glucarate/galactarate branch at 361080c76a rather than written independently. One adaptation was needed: the PP_3602 exception quote there exists only on that branch, so an equivalent line from the PP_3602 review as it stands here is quoted instead, and the notes record the swap. The SF3 description and representative members gain A. brasilense LhpG, the one characterized terminal dehydrogenase of the hydroxyproline route, whose dual-cofactor kinetics are cited as the reason an unassayed member should take neither cofactor child.
