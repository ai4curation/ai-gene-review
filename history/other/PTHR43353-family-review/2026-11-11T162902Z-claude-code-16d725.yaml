  summary: Rewrite the PTHR43353 GO:0047533 scope reason and add the PP_1256 exception
  details: |
    Second #6274 review round. The scope_reason still carried the sentence that contradicted SUBFAMILY_ONLY, saying the subfamily holds other-substrate members in the plural where the re-derivation finds exactly one; it now states that the substrate claim holds subfamily-wide, names V. harveyi aldH as the single exception, and keeps the cofactor branch as the separate, weaker half. A Q88NF5 (PP_1256) member exception was added for parity with the existing Q88GW5 (PP_3602) one, since both are unassayed KGSADHs whose reviews now decline the NADP+ branch; it quotes PP_1256's own review. The subfamily's routes are given as aldarate and hydroxyproline, the two its named members support, in place of the earlier L-arabinose wording, because PMID:17202142 reports the L-arabinose isozyme KGSADH-I as poorly related to KGSADH-II and KGSADH-III; the module text was aligned to match. Edits were kept to these lines so the glucarate/galactarate branch, which shares this block, can re-merge cleanly.
