    New FamilyReview for PANTHER:PTHR16705. Verdict COHERENT. Six PAINT-propagated terms assessed against the human CPLX1, worm cpx-1 and squid cpx gene reviews and their sources: SNARE binding, synaptic vesicle exocytosis and regulation of synaptic vesicle fusion to presynaptic active zone membrane are family-wide; SNARE complex (node PTN001047612) and terminal bouton (node PTN000422952) are unresolved; modulation of chemical synaptic transmission is family-wide but redundant with the fusion-regulation term. Subfamilies SF5, SF7, SF9, SF12 and SF13, including the retinal complexins, were not examined. Validated per file with linkml-validate, the term validator, the reference validator and quote_check (22 quotes).
