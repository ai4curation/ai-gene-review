  details: |
    New COMPLETE review of the PHOSPHO-N-ACETYLMURAMOYL-PENTAPEPTIDE-TRANSFERASE family, declared HETEROGENEOUS: PTHR22926:SF5 (716 members) is MraY and PTHR22926:SF3 (20) is the WecA/TagO/GnpTA branch, whose reaction is GO:0036380 rather than the MraY reaction. All six PAINT rows assessed. GO:0016780 and GO:0005886 at PTN000531998 SOUND, both seeded across the two branches on purpose. GO:0044038 and GO:0071555 at the same node SOUND rather than pruned, because both seeds carry direct experimental annotations whose papers are not cached and because GO:0009276 Gram-negative-bacterium-type cell wall shows GO's sense of cell wall includes the O antigen; the PSEAE wbpL review's over-annotation call is recorded as a disagreement to adjudicate instead. GO:0009103 at PTN000532005 NEEDS_PRUNING: the IBA was verified in QuickGO to reach Bacillus subtilis TagO and Mycobacterium tuberculosis WecA, whose organisms have no outer membrane, so a loss is needed on the Terrabacteria branch; both are recorded as member exceptions anchored on that node. GO:0008963 at PTN000532041 SOUND despite being the L-lysine-stem term on a uniformly meso-DAP-type clade, because the seed E. coli MraY carries two independent IDA rows for it; the recommendation is to add the sibling GO:0051992 beside it, as PAINT already did for MurF. Both stem-specific terms scoped UNRESOLVED; GO:0036380 and GO:0009103 SUBFAMILY_ONLY for SF3. One residue site: the two aspartates of PROSITE's MraY family signature 2 in the third cytoplasmic loop of E. coli MraY, with the pattern scanned across both branches, at ASSOCIATED strength because no mutagenesis is cached. Validated with the family schema, term, reference, local-quote, residue and family/gene cross-check validators (0 conflicts; three expected adjudication rows). proposed_action was not used because this worktree's schema predates that slot.
