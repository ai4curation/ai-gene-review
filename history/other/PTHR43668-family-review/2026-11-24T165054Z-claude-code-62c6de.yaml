  summary: 'Round 3: correct the topology, encode ADD_IRD, and fix two reasons this
    PR falsified'
  details: |
    Three changes, all from the round-3 review of PR #6876.

    The exception_reason added in the previous commit stated the tree backwards, calling
    PTN000182407 the ancestor. Corrected: PTN000909483 is the ancestral gain node and PTN000182407 is
    a loss node below it where allantoinase, allantoin catabolism and purine catabolism were pruned
    and GO:0004151 asserted. pyrQ's leaf is PTN002462798, which descends from PTN000909483 but not
    from PTN000182407, confirmed with gene_paint_losses and the PANTHER tree.

    The GO:0004038 node assessment moves from SOUND to NEEDS_PRUNING with proposed_action
    paint_action ADD_IRD and target_node_id PANTHER:PTN002462798, and the member exception is now
    anchored to it with pruned_node_id. The node is still sound — it is well seeded and DAL1 retains
    the IBA — but the assertion over-reaches on one branch, which is what NEEDS_PRUNING means, and
    this is the shape projects/IBA_REVIEW.md prescribes for a loss on a branch PANTHER's subfamilies
    do not split. just export-paint-change-requests now emits it as a readable upstream request
    instead of leaving the ask in prose.

    Two statements this PR had falsified: the assessment_reason 'Every reviewed recipient retains
    this IBA: DAL1 (yeast).' was true until pyrQ became a second reviewed recipient that removes it,
    and the summary and coherence_reason described PyrC' as the family's only non-allantoinase when
    SF4 now also holds an active dihydroorotase. Both rewritten; review_date updated.
