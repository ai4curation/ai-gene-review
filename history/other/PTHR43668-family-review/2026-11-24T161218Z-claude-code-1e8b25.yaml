  summary: Add pyrQ (Q9HT33) as a member exception on the GO:0004038 term assessment
  details: |
    The family/gene cross-check in just validate-families flagged a CONFLICT: PTHR43668 scopes
    GO:0004038 allantoinase activity SUBFAMILY_ONLY over SF2 and SF4, PANTHER places P. aeruginosa
    pyrQ (Q9HT33) in SF4, and the gene review added in PR #6876 removes that term. The conflict is
    the reason this edit is in the content PR rather than deferred to a family PR as first intended;
    CI requires the two to agree in the same change.

    Added Q9HT33 as the second member exception, beside P. putida pyrC'. The two are complements:
    both are Pseudomonas pyrC-family proteins the allantoinase subfamily has absorbed, one
    catalytically dead (pyrC', the ATCase structural subunit) and this one catalytically active on
    the other substrate. PA5541 is pyrC2, whose cloned gene complements an E. coli pyrC mutant and
    whose double mutant with pyrC is an absolute pyrimidine auxotroph.

    The exception is grounded on PMID:15278241's abstract and on the family's own PAINT record,
    which excludes allantoinase activity from the dihydroorotase ancestor PTN000182407 with a negated
    IRD row — so the disagreement comes from where PANTHER places this leaf, not from anything wrong
    with the node. PMID:15278241 added to the family review's references. Noted in the exception that
    no allantoinase assay has been done on the protein and that P. aeruginosa PAO1 carries no
    EC 3.5.2.5 entry at all.
