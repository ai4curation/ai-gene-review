  summary: 'Round 4: request the GO:0006145 pruning separately; derive the leaf target'
  details: |
    PAINT prunes per annotation, and CLAUDE.md says to request each change separately, but only one
    of the two terms this review removes from pyrQ carried a targetable action: GO:0004038 had
    ADD_IRD with target PTN002462798 while GO:0006145's NEEDS_PRUNING assessment had no target, so
    export-paint-change-requests emitted half of what the review argues for.

    The GO:0006145 assessment now records both ways the IBD over-reaches - the taxonomic one it
    already described (purine catabolism fits organisms with urate oxidase; S. cerevisiae lacks the
    route) and the branch this PR found - and takes ADD_IRD with the same leaf target for the second,
    which is the one with a concrete fix today. The taxonomic over-reach needs a decision about which
    clades retain the route and is left for the family's next revision. The export now emits two
    requests for this family.

    Added to both the exception reason and the node assessment why the target is the leaf rather than
    a clade: PTN002462789 holds 34 leaves including E. coli AllB (P77671), one of this IBD's own
    seeds.
