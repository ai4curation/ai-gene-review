  details: |
    Created a structured FamilyReview for PTHR10811 (FRINGE-RELATED), a heterogeneous eukaryotic family of Fringe O-fucosylpeptide GlcNAc-transferases, B3GLCT beta1,3-glucosyltransferases and plant DUF604 proteins. Fringe-clade node PTN000087518 (GO:0033829, GO:0008593) assessed SOUND; the Eukaryota-level acetylglucosaminyltransferase node PTN000087478 assessed TOO_DEEP because B3GLCT (a glucosyltransferase) and plant members inherit it. Noted that SF5 FRINGE GLYCOSYLTRANSFERASE mixes Drosophila Fringe with plant proteins and that C. elegans lacks Fringe.
