  summary: Complete evidence-grounded family review for PTHR24256
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. The insect SP/SPH classification separates catalytic serine proteases from homologues lacking the canonical active-site constellation (PMID:30367934). The CG43124 and CG4793 sequence analyses evaluate complete native isoforms rather than treating short proteins as pipeline truncations. The immune phenotype of CG4793 (PMID:33644706) establishes biological participation, not a measured peptide-cleavage reaction. Intrinsic serine endopeptidase activity remains branch- and architecture-dependent, so a universal or exhaustive subfamily grant is not established. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
