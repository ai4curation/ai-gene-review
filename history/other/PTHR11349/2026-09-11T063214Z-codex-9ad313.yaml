  summary: Complete evidence-grounded family review for PTHR11349
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. Awd and classical NDKs catalyze nucleoside-diphosphate phosphorylation; the Awd killer-of-prune mutation changes protein stability without abolishing catalytic efficiency (PMID:1320004). The classification also includes NDK-like/domain-containing branches for which this source does not resolve a complete active-site and biochemical boundary. Awd activity is supported, but an unconditional grant to all classified NDK-like proteins remains unresolved. Notch regulation and other Awd-specific pathways are not universal NDK functions. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
