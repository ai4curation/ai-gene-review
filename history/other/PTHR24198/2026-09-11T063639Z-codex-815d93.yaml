  summary: 'Complete family biological assessment: PTHR24198'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Giant fly Ank2 organizes presynaptic microtubules and stabilizes synapses (PMID:18439405; PMID:18439406). The actual member inventory also contains latrotoxins, ASB proteins, RIPK4 and viral ankyrin proteins, including disparate architectures within SF165. Consequently neither toxin activity nor kinase activity is a family-wide property. The exact 697-residue Ank2 benchmark product requires isoform-specific interpretation; its placement does not make every function of a giant ankyrin experimentally established on that product. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
