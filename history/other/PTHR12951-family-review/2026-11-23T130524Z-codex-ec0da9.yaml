    Created a PTHR12951 family review covering UNC119 myristoyl-binding carriers. Recorded root lipid-binding and lipoprotein-transport PAINT assertions as sound, captured the existing UNC119A-clade IRDs that prune cilium and cilium assembly from the vertebrate UNC119A branch, and scoped centrosome, spindle and cytokinesis annotations to the UNC119A subfamily. Cross-checked the existing UNC119B human review and the primary-cilium module and left module and GO-CAM files unchanged because the cached module already models the ARL3-UNC119B-RP2 route and no UNC119A production GO-CAM is cached. Validated with the FamilyReview schema, the family PAINT validator, the family-gene cross-check, and validate-quotes.
