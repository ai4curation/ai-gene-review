  details: |
    New FamilyReview for PANTHER:PTHR11566. Verdict HETEROGENEOUS. GTPase activity, membrane and cytoplasm are family-wide; every other PAINT term belongs to one clade (classical dynamins; DRP1/Dnm1 mitochondrial and peroxisomal fission; OPA1/Mgm1 mitochondrial fusion; Mx antiviral defence). The root node PTN000170013 is judged too deep for microtubule and microtubule binding, which reach the OPA1, DRP1 and Mx clades; the placement proposed is inferred from seeds, not from the tree. Nucleus, endocytosis, clathrin-dependent endocytosis and phagocytosis nodes were not examined. Members read: human DNM1 and DNM2, worm dyn-1, yeast DNM1. Validated per file with linkml-validate, the term validator, the reference validator and quote_check.
