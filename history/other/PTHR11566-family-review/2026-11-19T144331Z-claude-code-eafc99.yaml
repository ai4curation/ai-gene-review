  summary: 'New scoped PTHR11566 dynamin family review: 8 IBD node assessments, 3
    IRD requests at the OPA1 clade'
  details: |
    Scoped to the eight IBD node/term pairs that reach S. cerevisiae VPS1, judged against the ten reviewed members (human DNM1, DNM2, DNM1L, OPA1; worm dyn-1, drp-1, eat-3; zebrafish opa1; yeast DNM1, VPS1).
    Tree facts from the PANTHER 19.0 tree (load_family) are in PTHR11566-tree-check.txt.
    SOUND: root GTPase activity, cytoplasm and membrane; PTN000902186 peroxisome; PTN002480314 endocytosis.
    NEEDS_PRUNING with ADD_IRD at PTN000170131 (metazoan OPA1 clade, SF67, intramitochondrial): root microtubule (GO:0005874), root microtubule binding (GO:0008017), and PTN008520527 peroxisome fission (GO:0016559). All three pass the tree check, and the gene crosscheck reports no conflicts.
    Deliberately not requested: moving microtubule binding to the classical-dynamin clade PTN000170172, because DNM1L reports contextual microtubule co-pelleting outside it. The fungal MGM1 clade (PTN008973437) is a likely second intramitochondrial case, left unrequested for lack of a review.
    Follow-up: remaining PAINT nodes (plant DRPs, Mx, classical-dynamin process IBDs) are unassessed, hence IN_PROGRESS.
