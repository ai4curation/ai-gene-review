  summary: Complete evidence-grounded family review for PTHR12563
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. The member inventory includes bacterial PlsB, mitochondrial GPAT1/GPAT2 and DAPAT proteins. Shared acyl transfer does not establish identical acceptor specificity, organelle localization or acyl-chain preference. The GPAT1 structure supports GPAM inference but does not establish the same substrate preference for every family member. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
