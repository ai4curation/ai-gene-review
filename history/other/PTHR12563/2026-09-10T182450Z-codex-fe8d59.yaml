  summary: Curate PTHR12563 family function boundaries
  details: |
    Curated GPAT/DAPAT lipid acyltransferases. Assessment: HETEROGENEOUS. The member inventory includes bacterial PlsB, mitochondrial GPAT1/GPAT2 and DAPAT proteins. Shared acyl transfer does not establish identical acceptor specificity, organelle localization or acyl-chain preference. The GPAT1 structure supports GPAM inference but does not establish the same substrate preference for every family member. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
