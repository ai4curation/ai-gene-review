  summary: Pin PANTHER 19 placements for seven TKL kinases (UniProt vs PANTHER conflicts)
  details: |
    Added override rows after comparing UniProt xref_panther (InterPro 110.0 HMM best hits, integrating PANTHER 19.0) with PANTHER 19.0 sequence-classification files, the PTHR23257/PTHR43289 treeinfo, and PAINT IBA provenance (paint_uniprot GAF WITH/FROM). PANTHER placement adopted for Dicty splB P18161 (PTHR23257:SF975), pyk3 Q54I36 (SF969), drkA Q54H46 (SF921), gbpC Q8MVR1 (SF711), phg2 Q54QQ1 (SF776) and worm mom-4 Q9XTC6 (SF958): each is a PTHR23257 leaf in a clade with orthologs/paralogs at ordinary branch lengths, and each takes its IBAs from PTHR23257 node PTN001148170 (all 166 reference-proteome leaves receiving IBAs from it are PTHR23257). UniProt value adopted for human MAP3K20 Q9NYL2 (PTHR44329:SF288): PANTHER grafts the human leaf at branch length 2.0 into a Homininae NEK6 clade of PTHR43289 (giving NEK6-derived IBAs), while mouse/rat/cow/Xenopus/zebrafish MAP3K20 are PTHR44329:SF288 in PANTHER's own files. DDB_G0282963 Q54RR9 (PTHR23257:SF758) got no row because no member-index-covered file cites it. Several rows target accessions not currently cited as representatives (refresh reports them as not applied); they are recorded so the decision survives future citation.
