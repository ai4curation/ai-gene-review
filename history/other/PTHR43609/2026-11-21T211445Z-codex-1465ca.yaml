  summary: Create PTHR43609 Ach1/CoaT family review
  details: |
    Created the PTHR43609 family review for fungal Ach1/CoaT acyl-CoA:carboxylate CoA-transferases, accepting the PAINT acetate CoA-transferase, acetate-metabolism and Ascomycota mitochondrion placements while documenting acetyl-CoA hydrolase as a retained non-core side activity.

    Review response:
    - revised functional coherence from COHERENT to MOSTLY_COHERENT to acknowledge ScpC-like bacterial members whose exact substrate specificity diverges from the fungal Ach1/CoaT acetate-acceptor branch
    - added a UniProtKB:Q88RH5 member exception to the GO:0003986 term assessment so the P. putida scpC review's over-annotation call is an adjudicated exception rather than an unresolved family/gene disagreement
    - grounded the GO:0003986, GO:0008775, GO:0006083 and GO:0005739 node/term assessments in cached Ach1 primary literature instead of quoting only other gene-review prose
    - recorded notes on the historical acetyl-CoA-hydrolase misnomer and on the absence of a taxon-scoped term assessment for the Ascomycota mitochondrial IBD
