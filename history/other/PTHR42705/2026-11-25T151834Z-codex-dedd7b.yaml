  summary: Separate LigD primase chemistry from replication-process scope
  details: |
    The H37Rv seed directly supports synthesis of unprimed oligoribonucleotides, and its experimental grounding is valid. GO:0006269 remains part_of DNA-templated DNA replication; its damage clause concerns primer chemistry and does not establish a replication role for the NHEJ family. Whole-node process scope is unresolved pending seed full-text review and assessment of the SF3 and nonbacterial leaves. Conserved polymerase/primase architecture does not settle that process question, and neither donor count nor self-seeding is evidence of failure.
