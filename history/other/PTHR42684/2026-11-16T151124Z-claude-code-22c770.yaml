  details: |
    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR42684-tree-nodes.yaml, from `just phylo-family PTHR42684`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

    - PANTHER:PTN000241343 GO:0004015 (TOO_DEEP): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PTN000241343 is the family root at LUCA with 202 leaves, and its four seeds sit in both branches below it, so the root is their common ancestor; the named subfamilies SF10, SF19, SF20, SF8 and SF1 lie below it and hold none of the seeds, so excluding them calls for losses on those clades.
    - PANTHER:PTN000241343 GO:0009102 (TOO_DEEP): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PTN000241343 is the family root at LUCA with 202 leaves, and its six seeds sit in both branches below it, so the root is their common ancestor; the named subfamilies SF10, SF19, SF20, SF8 and SF1 lie below it and hold none of the seeds.
    - PANTHER:PTN000241344 GO:0004141 (NEEDS_PRUNING): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PTN000241344 is a Eukaryota speciation node with 64 leaves split into Opisthokont and Bikont branches, and the single Arabidopsis seed leaf sits 16 steps below it; the exclusion of S. cerevisiae BIO3 rests on its domain architecture, which the tree cannot settle.
    - PANTHER:PTN000241344 GO:0005739 (NEEDS_PRUNING): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PTN000241344 is a Eukaryota speciation node with 64 leaves, and the single plant seed leaf sits 16 steps below it, so yeast BIO3 inherits the location from a distant seed; the objection rests on yeast localization data, which the tree cannot settle.

    Each row now quotes the family's node listing in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
