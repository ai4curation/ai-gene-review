  summary: 'Complete family biological assessment: PTHR15921'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Pcf11 proteins couple RNA polymerase II transcription to RNA-end processing through separable interaction domains. Yeast experiments distinguish CTD binding from other 3-prime-processing functions (PMID:12727883). Reconstituted mammalian CFII contains Pcf11 and Clp1; Pcf11 zinc fingers bind RNA, while the kinase is Clp1 and its kinase activity is dispensable for the tested cleavage reaction (PMID:30139799). The 86-residue fly benchmark product represents only a limited portion of this multidomain mechanism; family identity does not establish all full-length Pcf11 functions on that short exact product. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
