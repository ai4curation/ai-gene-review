  summary: Curate PTHR15921 family function boundaries
  details: |
    Curated Pcf11 transcription-termination and RNA-processing factors. Assessment: COHERENT. The curated InterPro family is functionally specific for Pcf11 across animals, fungi and plants. The benchmark fly record C0P8M6 is only 86 amino acids, so the gene-family assignment is meaningful but full termination-factor activity on that exact sequence is unresolved until its relationship to the complete isoform is established. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
