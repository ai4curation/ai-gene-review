events:
- type: REVIEW
  outcome: changed
  summary: 'Evolutionary re-review: PTHR46036 Ni2+-class glyoxalase I'
  details: |
    Independent re-review of the family review against primary data. Tree: PANTHER 19.0 treeinfo (177 leaves, root at LUCA; 13-leaf bacterial branch, and a branch with Halobacterium, Plasmodium GILP and 162 streptophyte leaves split by a tracheophyte duplication). MSA: PANTHER 19.0 familymsa; the four E. coli GloA metal ligands (His5, Glu56, His74, Glu122; P0AC81 sequence version 1) were mapped to alignment columns and read for every leaf, and the second VOC domain of two-domain members was checked by pairwise alignment. Annotations: QuickGO rows for all 177 leaf accessions, with a per-term positive control. Literature: primary papers on the E. coli, Yersinia, Pseudomonas, Neisseria, Arabidopsis, rice, maize and Plasmodium proteins. Reproducible script tree_msa_check.py and its output PTHR46036-tree-msa-check.txt are in the family folder; raw tree, MSA and API payloads are not committed. Changes: the two root IBD rows (GO:0004462, GO:0051596) moved from UNRESOLVED to NEEDS_PRUNING with ADD_IKR requests at the Plasmodium GILP leaf PTN001310399 and at the SF7 (PTN005273383) and SF8 (PTN005273433) paralog clades; the cytosol node is confirmed SOUND with tree and sequence evidence; the peroxisome node stays UNRESOLVED with its clade and seed now described. Added a residue site for the ligand set, subfamily entries for SF7, SF8 and SF12, a GO:0051596 term assessment and a GILP member exception; GO:0016151 now covers SF2 as well as SF5; the claim that SF16 is an uncharacterised VOC subfamily is withdrawn. Not verified: full texts of PMID:15843146, PMID:29150548 and PMID:20009535 (abstracts only), so the GILP IDA row is raised as a query; no SF7, SF8 or SF12 member has experimental data. Validated with just validate-families, just validate-quotes and just validate-history.
