  details: |
    Mechanical backfill of the record_section slot (added in PR 5299) on UniProt quotes in the SCHPO gene reviews, produced by just backfill-record-sections genes/SCHPO on current main. 420 of 576 review files gain 3580 inserted record_section lines; no other line changes (the tool refuses to write unless the reloaded document differs only by the added keys). Quotes the current locator cannot resolve (181; most are absent from the cited record, but quotes reduced to nothing searchable, such as a feature key with a single position, are also counted here) and quotes whose text occurs in more than one record section (103) are left without a value; a later batch may fill those the locator learns to resolve. This is the first of several per-organism batches; curated content is otherwise unchanged.
