  summary: 'Backfill record_section on UniProt quotes: human N–Z'
  details: |
    Mechanical backfill of the record_section slot (PR 5299, locator fixes in PR 5399) on UniProt quotes in the human N–Z gene reviews, produced by just backfill-record-sections on current main. 523 review files gain 7219 inserted record_section lines; the only other change is 16 supporting_text lines that lost their list-item dash to the new record_section line (counts as of the last sync with main; files later rewritten on main, e.g. STAR, were later resolved to main's version and re-backfilled) (the tool refuses to write unless the reloaded document differs only by the added keys, and only output that ruamel's safe loader reads). Tool summary: updated 524 of 972 files: added 7221, fixed 0; left 0 mismatched, 73 not located in the cited file, 5 with nothing searchable, 618 in more than one section, 0 unplaceable. Quotes the locator cannot resolve, quotes with nothing searchable, and quotes whose text occurs in more than one record section are left without a value. One of several batches following the SCHPO pilot (PR 5397); curated content is otherwise unchanged, except that eight finding quotes that strict validation of the now-changed files rejects as non-verbatim are replaced with verbatim text from the same source (PGRMC2: PMID:39263088; SLC25A22: PMID:15592994; TOP2B: PMID:38306051, PMID:39063016, PMID:38416769, PMID:39769331), with reference_section_type corrected where the verbatim text sits in a different section; and six TALDO1 cytosol ACCEPTs whose only support was the UniProt licence line (CC:COPYRIGHT) now quote the record's SUBCELLULAR LOCATION text, with a sentence in each reason on what that by-similarity cytoplasm statement does and does not establish; the SLC25A22 PMID:15592994 review_notes are updated now that its finding quotes the cached abstract.
