  summary: 'Backfill record_section on UniProt quotes: other organisms 9ARCH–EQUAS'
  details: |
    Mechanical backfill of the record_section slot (PR 5299, locator fixes in PR 5399) on UniProt quotes in the other organisms 9ARCH–EQUAS gene reviews, produced by just backfill-record-sections on current main. 417 review files gain 3060 inserted record_section lines; the only other change is 4 supporting_text lines that lost their list-item dash to the new record_section line (the tool refuses to write unless the reloaded document differs only by the added keys, and only output that ruamel's safe loader reads). Tool summary: updated 417 of 865 files: added 3060, fixed 0; left 0 mismatched, 89 not located in the cited file, 5 with nothing searchable, 150 in more than one section, 0 unplaceable. Quotes the locator cannot resolve, quotes with nothing searchable, and quotes whose text occurs in more than one record section are left without a value. One of several batches following the SCHPO pilot (PR 5397); curated content is otherwise unchanged, except that six TEP2 finding quotes that strict validation of the now-changed file rejects as non-verbatim are corrected: four are replaced with verbatim text from the same source (DOI:10.3389/fimmu.2017.00759 twice, DOI:10.1073/pnas.1010575107, DOI:10.1186/s12864-023-09887-0), and the two citing the abstract-only DOI:10.1126/science.1077136, whose abstract supports neither statement, lose their supporting_text.
