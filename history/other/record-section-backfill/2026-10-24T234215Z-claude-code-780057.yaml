  summary: 'Backfill record_section on UniProt quotes: human D–M'
  details: |
    Mechanical backfill of the record_section slot (PR 5299, locator fixes in PR 5399) on UniProt quotes in the human D–M gene reviews, produced by just backfill-record-sections. Final counts after syncing with main: 507 review files gain 7235 inserted record_section lines. As first cut the batch was 513 files and 7568 lines; FANCD2, IL22, HSD3B2, FANCL, FKBP4, FKBP5 and HSP90AA1 were rewritten on main while it was open, and each was resolved to main's version and re-backfilled (main already carried their values, except IL22, whose new quotes were re-derived). The tool refuses to write unless the reloaded document differs only by the added keys, and only output that ruamel's safe loader reads. Tool summary: updated 513 of 1033 files: added 7568, fixed 0; left 0 mismatched, 128 not located in the cited file, 1 with nothing searchable, 573 in more than one section, 0 unplaceable. Quotes the locator cannot resolve, quotes with nothing searchable, and quotes whose text occurs in more than one record section are left without a value. One of several batches following the SCHPO pilot (PR 5397); curated content is otherwise unchanged, except that two finding quotes that strict validation of the now-changed files rejects as non-verbatim are replaced with verbatim text from the same source: GLO1 (PMID:32296183, abstract) and LOXL2 (PMID:28332555, abstract).
