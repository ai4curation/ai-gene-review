  details: |
    New, partial FamilyReview for PANTHER:PTHR19957. Verdict MOSTLY_COHERENT. Only the syntaxin-1 subfamilies SF334 (human STX1B) and SF424 (worm unc-64) and the three PAINT nodes reaching them were examined. SNAP receptor activity, SNARE complex and vesicle fusion are family-wide; plasma membrane, exocytosis, synaptic vesicle fusion to presynaptic active zone membrane and presynaptic active zone membrane are assessed for the syntaxin-1 subfamilies only; the other twelve PAINT terms sit on nodes that were not examined and are left unresolved. Both members' GOA files carry a SNARE binding IBA citing PTN000461349 that is not in the current PAINT snapshot. Validated per file (22 quotes).
