  summary: Complete evidence-grounded family review for PTHR24086
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. FTZ-F1 was purified as a sequence-specific DNA-binding factor and binding-site mutation reduced target-gene expression (PMID:2113881). Mammalian NR5A proteins rescued fly ftz-f1 mutants and activated the fly target gene (PMID:23340581), providing unusually strong cross-species evidence for conserved DNA-binding transcriptional regulation. This supports the broad molecular function across intact NR5 DNA-binding/receptor architecture. Steroid ligand responsiveness, steroidogenesis, bile-acid regulation and developmental timing remain branch-specific properties. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
