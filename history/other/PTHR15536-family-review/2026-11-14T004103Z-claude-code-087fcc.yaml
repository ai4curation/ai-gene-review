  summary: 'Create family review: PTHR15536'
  details: |
    First family review for PTHR15536 (TACHYKININ-3), the vertebrate TAC3/tac3 neurokinin B precursors, written alongside the campaign gene reviews of human TAC3 and mouse Tac2. The family's PAINT slice was fetched with `just fetch-panther-paint PTHR15536` and holds exactly one row: GO:0045777 positive regulation of blood pressure, IBD at the root node PTN002694376 (Euteleostomi), seeded by rat Tac3 alone. That row is assessed WRONG_NODE with a REMOVE_IBD recommendation: the single seed rests on intracerebroventricular NK3 agonist injection whose pressor response is partly vasopressin-mediated, so it does not show the endogenous gene product regulating blood pressure, and with one seed of that kind there is no descendant evidence from which an ancestral gain can be inferred. The rat IDA itself is not disputed. This agrees with the MARK_AS_OVER_ANNOTATED action in both gene reviews, but is a stronger position than their statement that the node placement is reasonable; the disagreement is recorded in the review's notes and no gene review was changed. Eight term assessments cover the family: receptor ligand activity, extracellular region, the tachykinin and phospholipase C-activating tachykinin receptor signaling pathways and neuromedin K receptor binding are FAMILY_WIDE; the adenylate cyclase pathway, positive regulation of luteinizing hormone secretion, positive regulation of blood pressure and temperature homeostasis are UNRESOLVED, the LH one because zebrafish tac3a/tac3b mutants have unimpaired gametogenesis while the mammalian role is strongly supported. The single subfamily SF1 is coextensive with the family, so no subfamily-scoped judgement is expressible and mammal-restricted claims are left unresolved rather than scoped. No residue site is curated. Validated with linkml-validate (FamilyReview), linkml-term-validator --labels, quote_check (28 quotes verified), family_residue_validator (12 pass) and family_gene_crosscheck (0 conflicts, 2 consistent).
