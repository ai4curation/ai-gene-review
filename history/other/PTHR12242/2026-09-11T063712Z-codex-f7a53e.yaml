  summary: 'Complete family biological assessment: PTHR12242'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Fly Rolling stone is a membrane-associated protein whose mesodermal expression is required for myoblast fusion (PMID:9230076). This direct genetic result provides a positive biological role for the verified SF46 member O44252, while Headbutt Q9VK03 belongs to SF49 and has a multipass membrane architecture. Neither membrane topology nor the TLC/MARVEL-related labels establish an intrinsic solute transporter or lipid enzyme. A conserved molecular mechanism linking these branches remains unknown; the phenotype of Rolling stone is not treated as evidence that Headbutt is itself a fusogen. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
