  summary: 'Evolutionary re-review: PTHR19139'
  details: |
    First distinct review pass over the family review created on 2026-11-15, which assessed only the three seeded IRD rows. Evidence used: the PANTHER 19.0 treeinfo topology for PTHR19139 (231 leaves, 56 organisms, 44 duplication and 2 horizontal-transfer nodes), PANTHER's own family alignment (familymsa; anchor rows checked against UniProt for human AQP1 P29972, bovine AQP1 P47865 and rat AQP6 Q9WTY0), QuickGO experimental annotations of all tree leaves queried by term id with descendants (every query returned its UniProtKB seed leaves), and 23 cited papers, four of them as full text. The analysis is reproducible with interpro/panther/PTHR19139/tree_msa_check.py, which writes PTHR19139-tree-msa-check.txt.
    Confirmed: MOSTLY_COHERENT; LOSS_CONTRADICTED (REMOVE_LOSS) for the AQP6 carbon dioxide transport IRD at PTN001452348.
    Changed: the two AQP6 water IRDs (GO:0015250, GO:0006833) at PTN001452348 go from UNRESOLVED to LOSS_SUPPORTED, because all 10 leaves of the clade and no other leaf carry Asn at the column of rat AQP6 Asn60, and N60G converts rat AQP6 from an anion channel to a water channel.
    Added: assessments of the 23 PAINT rows on tree nodes that had none (26 of 26 in-tree rows now assessed). Disputed rows: apical and basolateral plasma membrane at the arthropod node PTN004504946 are TOO_DEEP (MOVE_IBD to the Drip clade PTN002709567 and the Prip clade PTN002709557), since the seed paper shows each Drosophila paralogue on one membrane; the IKR NOT water channel activity on the zebrafish Aqp0b leaf PTN000440779 is LOSS_CONTRADICTED (REMOVE_LOSS), with a second oocyte study positive and no key-residue difference from Aqp0a; water channel activity at PTN007668488 is NEEDS_PRUNING (ADD_IRD at the Drosophila Eglp4 leaf PTN002318035). Glycerol transmembrane transporter activity and hyperosmotic response on the AQP1 node PTN002709505 are UNRESOLVED. The other rows are SOUND or LOSS_SUPPORTED. Also added: nine subfamily descriptions (AQP6, Big brain and the entomoglyceroporins flagged as diverged), two residue sites (the Asn-Pro-Ala motifs on human AQP1, the AQP6 helix-crossing asparagine on rat AQP6) and three term assessments.
    Not done or not verified: seven rows of the cached PAINT slice sit on nodes of PTHR45665, PTHR45687 and PTHR45724 and are left to those families; most papers were read as abstracts only; AQP0 localisation in lens fibre cells and the human AQP1 hyperosmotic-response paper were not examined; three source queries (FlyBase membrane rows, a GeneDB Leishmania row citing a Trypanosoma brucei paper, a mis-named PANTHER subfamily) are recorded in the review notes and not asserted as errors. Validated with the family schema, GO label, reference, quote and residue/tree checks.
