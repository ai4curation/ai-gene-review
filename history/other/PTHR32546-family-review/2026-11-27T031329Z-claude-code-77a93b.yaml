  summary: Family review of PTHR32546 for the dismech vision-disorder alignment
  details: |
    First family review of the GPR158/GPR179 family, written for projects/DISMECH_VISION_ALIGNMENT after the GPR179 gene review and read against the existing GPR158 review. Coherence MOSTLY_COHERENT. PAINT holds no node rows for this family and neither human member carries an IBA, so the review has term assessments only: protein-membrane adaptor activity is scoped to both subfamilies, enzyme activator activity and G protein-coupled receptor activity to GPR158 only, and plasma membrane is family-wide. Validated with the family schema, term, reference and quote checks; the family/gene cross-check reports no conflict.
