  summary: 'Family review: PTHR42788'
  details: |
    PANTHER family review written while completing the bacterial alkanesulfonate uptake and FMN-dependent desulfonation module (modules/bacterial_alkanesulfonate_uptake_desulfonation.yaml), which grounds one of its annoton roles to a subfamily of this family. Records functional coherence and its reason, the subfamilies that matter for substrate specificity with UniProt representatives, an assessment of every PAINT node in PTHR42788-paint.tsv read as a phylogenetic placement judgement, and term scopes for the terms the module uses. This family is the ABC ATPase component (SsuB, TauB, NrtC/CmpD); both PAINT rows sit at one very deep node but carry only generic ABC architecture terms and are assessed SOUND. The review also records that SsuB-named proteins are split across SF13, SF17 and SF19, with SF13 and SF17 sharing an official PANTHER name. Reference protein: E. coli SsuB (P0AAI1). The reference protein's gene review is COMPLETE. Validated with the validate-families steps: LinkML schema, GO term ids and labels, verbatim publication and local-file quotes, and the family/gene cross-check.
