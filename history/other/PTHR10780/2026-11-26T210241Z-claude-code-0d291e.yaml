events:
- type: REVIEW
  outcome: changed
  summary: 'Family re-review: PTHR10780 against the PANTHER tree, family alignment
    and literature'
  details: |
    First distinct review pass on the family review. Checked against the PANTHER 19.0 tree (60 leaves, 34 species, 9 duplications) and PANTHER's family alignment, both fetched from the PANTHER API; the pinned PAINT snapshot 2026-08-28 (IBD.gaf re-read); QuickGO annotations of every leaf, queried by term id with a positive control on the seeds; UniProt; and PubMed.
    Confirmed: all four IBDs stay SOUND and no PAINT change is requested. COHERENT stays. GO:0055085 stays NOT_APPLICABLE. The GOA lag noted in the first review still holds on 2026-11-26 (no IBA yet from the 2026 root IBDs; retired mitochondrion and membrane IBAs from PTN001324730 still present).
    Changed: added the missing third subfamily SF18 (the root subfamily with every non-vertebrate member, including fly Mtch) and clade nodes for all three; corrected the claim that the root is the common ancestor of MTCH1 and MTCH2 (that is the duplication PTN001324730; the root is two speciation nodes above the seeds' last common ancestor, Bilateria) and justified the deeper placement from the alignment (the residue aligned to MTCH2 Asp189 is Asp or Glu in all 58 covering leaves) and from cross-species rescue reported in PMID:42308315; recorded that the fly GO:0045040 seed evidence is the new child term GO:7770059 and suggested it to PAINT as a refinement; recorded that the apoptosis IBD rests on an overexpression IEP for MTCH1 and that fly Mtch loss gives the opposite phenotype, so the term is scoped to the vertebrate subfamilies; added a residue site for the acidic groove residue (CONTRIBUTES), term assessments for GO:0045040, GO:0005741, GO:0043065 and GO:0017128 (UNRESOLVED, simulation only), and thirteen verified literature references.
    Added tree_check.py and msa_check.py with their result files; nothing is hard-coded and no raw tree, alignment or API payload is kept.
    Not verified: PMID:42308315 was read from PubMed Central but is not in the publication cache, so it is cited without quotes, and its supplementary list of tested homologs was not read. Several other papers were read as abstracts only (listed in the review notes). No experimental scramblase assay for an MTCH protein was found.
