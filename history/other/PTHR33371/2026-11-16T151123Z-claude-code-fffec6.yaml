  details: |
    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR33371-tree-nodes.yaml, from `just phylo-family PTHR33371`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

    - PANTHER:PTN002120837 GO:0120014 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree PTN002120837 is the family root, a Eubacteria speciation node with 51 leaves in 17 species, and the single seed leaf sits 4 steps below it, so the term reaches every branch of the family from one E. coli MlaD seed, consistent with excluding the actinobacterial Mce clade.
    - PANTHER:PTN002120837 GO:0120010 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree PTN002120837 is the family root, a Eubacteria speciation node with 51 leaves in 17 species, and the single MlaD seed leaf sits 4 steps below it, so the process descends to branches holding no seed, consistent with an IRD on the actinobacterial Mce clade.
    - PANTHER:PTN002530749 GO:0044409 (TOO_DEEP): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree PTN002530749 is a duplication node with 30 leaves in 2 species and 6 subfamilies, and the single seed leaf sits 3 steps below it, so the term spans all six actinobacterial Mce paralog groups from one seed.

    Each row now quotes the family's node listing in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
