  summary: Create PANTHER family review PTHR15186 (BNIP3/BNIP3L/DCT-1 mitophagy receptors)
  details: |
    Structured FamilyReview for PTHR15186 written alongside full reviews of all six model-organism members (human BNIP3, BNIP3L; mouse Bnip3, Bnip3l; C. elegans dct-1; Drosophila BNIP3). Adjudicated all 11 PAINT node assertions from the cached paint slice: GO:0140580 mitochondrion autophagosome adaptor activity is sound but placed far too shallow (reaches BNIP3 orthologs only); nucleus, positive regulation of apoptotic process and mitochondrial fragmentation involved in apoptotic process at the Eumetazoa node assessed TOO_DEEP (vertebrate-only seeds propagating to worm and fly). Added a lir_core residue site (BNIP3 W18/L21) verified against UniProt sequences, with mouse and human NIX positive controls. Validated with schema, term, quote, residue and family-gene cross-check validators.
