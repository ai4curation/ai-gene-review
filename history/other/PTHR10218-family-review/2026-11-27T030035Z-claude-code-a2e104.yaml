  summary: Family review of PTHR10218 for the dismech vision-disorder alignment
  details: |
    First family review of the G protein alpha subunit family, written for projects/DISMECH_VISION_ALIGNMENT after the GNAT1 and GNAT2 gene reviews. Coherence MOSTLY_COHERENT: the molecular function is shared and the effectors differ. G protein activity, GTPase activity, GTP binding and heterotrimeric complex membership are family-wide. Adenylate cyclase-modulating G protein-coupled receptor signaling (GO:0007188), which PAINT places at the family root, is scoped to the Gs, Gi/o, Gq/11 and Dictyostelium Galpha2 subfamilies; the root node NEEDS_PRUNING for the transducin subfamilies, whose effector is PDE6, in agreement with the removals in both transducin reviews. The bitter-taste node PTN002566474 on GNAT2 is judged WRONG_NODE: its only seed is a chimera experiment in heterologous cells. Two Dikarya IRD rows are UNRESOLVED. Validated with the family schema, term, reference and quote checks; no cross-check conflict.
