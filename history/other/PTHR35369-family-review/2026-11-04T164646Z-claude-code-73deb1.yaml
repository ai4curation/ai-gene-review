  summary: 'PR #5958 review response: PTHR35369'
  details: |
    PR #5958 blocking items 2 and 3. Corrected a factual error: the SF3 divergence description and the GO:0051782 term assessment said the cell-division term reached ImuA proteins from a signature the entry does not match. InterPro's entry-protein listing for Q88I84 does include IPR004596, which carries GO:0051782 and GO:0009432 in InterPro2GO, so the match is real and the mapping was applied correctly; the family entry IPR050356 that covers this PANTHER family carries no GO mapping at all and cannot reinstate the term. The scoping argument now rests on biology and on the ImuA/SulA homology that caused the historical misnaming, and the GO:0051782 assessment's supporting quotes were replaced: the former quote was the IPR047610 ImuA line, which did not support a SulA-scoping claim, and is now E. coli SulA's curated FtsZ-binding FUNCTION statement (UniProtKB:P0AFZ5).
