  summary: Complete evidence-grounded family review for PTHR24243
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. GHSR recognition of ghrelin is supported by ligand isolation (PMID:10604470) and a ghrelin-bound receptor–G-protein structure (PMID:35027551). The experimentally anchored SF7 branch supports this activity, but other GHSR-like and broader receptor branches have not been resolved into an exhaustive ligand-specific set. Seven-transmembrane architecture alone does not specify growth-hormone-secretagogue recognition, G-protein preference or an endocrine phenotype. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
