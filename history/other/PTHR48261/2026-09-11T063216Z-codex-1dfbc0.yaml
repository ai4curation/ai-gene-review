  summary: Complete evidence-grounded family review for PTHR48261
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. Mammalian EXT1/EXT2 structures and catalytic mutants distinguish active sites within a two-protein, four-domain co-polymerase (PMID:36593275). Native fly ttv-PC retains the C-terminal GT-A region and its mapped nucleotide-sugar/metal-binding residues, but lacks the N-terminal membrane anchor and GT-B region. The retained region has catalytic potential; isolated-domain behavior and missing targeting prevent inference of full physiological competence. Plant glycosyltransferases in the broader family act on different glycans. Consequently neither heparan-sulfate synthesis nor unconditional intrinsic glycosyltransferase activity is established for every classified protein. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
