  summary: Family review of PTHR10846 for the dismech vision-disorder alignment
  details: |
    First family review of the sodium/potassium/calcium exchanger family, written for projects/DISMECH_VISION_ALIGNMENT after the SLC24A1 gene review. Coherence MOSTLY_COHERENT. Calcium ion transmembrane transport, intracellular calcium ion homeostasis and plasma membrane are family-wide. The calcium, potassium:sodium antiporter term is scoped to the animal exchanger subfamilies: the root placement (PTN000090975) is judged TOO_DEEP because the prokaryotic YrbG-like branch inherits it and its one characterized member, MaX1, is a potassium-independent exchanger. Calcium channel activity at the root is judged WRONG_NODE (the single seed is a flux measurement in an NCKX2 knockout; no member is a channel). Long-term synaptic potentiation and depression at the Chordata node PTN000851795 are TOO_DEEP: the seed is the mouse NCKX2 knockout and rod NCKX1 inherits both. The NCKX5 plasma-membrane IRD is supported; a lancelet IRD is unresolved. Validated with the family schema, term, reference and quote checks; the family/gene cross-check reports no conflict.
