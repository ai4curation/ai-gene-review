  summary: Family review of PTHR24060 for the dismech vision-disorder alignment
  details: |
    First family review of the metabotropic glutamate receptor family, written for projects/DISMECH_VISION_ALIGNMENT after the GRM6 gene review and read against the existing GRM4 review. Coherence MOSTLY_COHERENT. Adenylate cyclase inhibiting G protein-coupled glutamate receptor activity is scoped to the group II and III receptors: its node PTN001173582 is placed at Eukaryota and is judged TOO_DEEP, because the Gq-coupled group I receptors GRM1 and GRM5 and Drosophila bride of sevenless inherit the term (confirmed in QuickGO on 2026-11-27: GRM1, GRM5 and boss each carry the IBA). The five IRD rows are left UNRESOLVED because the clades below them cannot be identified from the PAINT slice. Validated with the family schema, term, reference and quote checks; the family/gene cross-check reports no conflict.
