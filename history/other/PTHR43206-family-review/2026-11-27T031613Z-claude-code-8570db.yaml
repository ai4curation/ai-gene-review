  details: |
    Record of a change that a merge made to this review, and of the check of it.

    On 2026-11-23 another agent merged main into this pull request's branch. Main had rewritten the reason of the PANTHER:PTN000241230 GO:0005739 assessment (#6733): the loss is asked for at the S. cerevisiae UGA1 leaf, PTN000241277, and no longer for the fungal clade. The merge kept main's text and the first sentence that the tree re-read had added (batch f014; the record of 2026-11-16 under history/other/PTHR43206), and reworded the second sentence to fit main's text:

    - before: Pruning the fungal clade rests on UGA1 localization evidence, which the tree does not address.
    - after: Fungi share SF1 with vertebrate ABAT, so no whole subfamily is at issue, and the pruning decision rests on UGA1 localization evidence, which the tree does not address.

    No record said so, and the sentence in the record of 2026-11-16 is no longer in the review.

    On 2026-11-27 the reworded sentence was checked by hand against PTHR43206-tree-nodes.yaml and the PANTHER 19.0 release tree, and kept. The six seeds (fly, mouse, rat, human and bovine ABAT and Dictyostelium gabT) and the S. cerevisiae UGA1 leaf are all in SF1, the seeds sit in the Unikont branch 1 step below the node, and the wording the verifier had checked no longer fitted a text that does not prune the fungal clade.

    This record changes nothing in the review. The run record of the row (projects/IBA_REVIEW/tree-rereview/runs/f014.yaml) carries the same account as a correction, says what main changed and what the reading of main's text found, and vouches for the row as it now stands. The assessment (NEEDS_PRUNING) is unchanged.
