  summary: 'Complete family biological assessment: PTHR12449'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Mouse NOL4 variants interact differently with Mlr1 and Mlr2, and deletion of an NLS-containing region changes both binding and the direction of transcriptional regulation (PMID:25366156). The reporter host was Drosophila S2 cells, but the assayed regulatory proteins were mouse proteins; this is not a direct fly CG46301 functional experiment. The long fly protein shares family classification, without evidence that it uses the same partners or is a death receptor despite the domain-dominated family label. Coherence remains unknown at the level of a conserved molecular mechanism, rather than implying that no member has been studied. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
