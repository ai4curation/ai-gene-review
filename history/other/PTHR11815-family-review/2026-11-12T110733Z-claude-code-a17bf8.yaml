- type: AUDIT
  outcome: changed
  summary: 'Retrospective audit corrections: PTHR11815'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. Node verdicts changed. At PTN000212531: GO:0042709, GO:0004775 and GO:0006104 (IBD) SOUND -> NEEDS_PRUNING for the Aquifex aeolicus leaf O67330 (PTN000212656), a citryl-CoA synthetase large-subunit ortholog; GO:0006099 (IBD) SOUND -> NEEDS_PRUNING for the hydrogenosomal Trichomonas vaginalis clade PTN008982090 and the same Aquifex leaf. At PTN000929335: GO:0004776 (IBD) SOUND -> NEEDS_PRUNING for the Ustilago maydis leaf PTN002273929, which lacks the ATP-grasp domain. The IKR for GO:0004775 at PTN000929335 stays LOSS_SUPPORTED; SF12 was added to its affected subfamilies and the misplaced Xanthomonas SucC leaf is recorded as a tree defect. Statements corrected: Gln at position 20 is neither confined to the clade under PTN000929335 nor diagnostic of GDP specificity; plant, trypanosomatid and Trichomonas subunits are described by their own residues and assays; fungi did not all lose the G-type gene, and Saitoella complicata is named as a Gln20 gene of unresolved origin. Dictyostelium is no longer listed among the unassayed members below PTN000929335: the enzyme purified from D. discoideum uses GTP, its alpha subunit is phosphorylated with GTP and little or not at all with ATP, and it forms GTP from GDP (PMID:7771809, PMID:8448193, PMID:8240297, added as references); the assays are not assigned to the beta gene Q869S7. This agrees with PTHR11117 and with the corrected sentence of genes/yeast/LSC2/LSC2-bioinformatics/RESULTS.md, which is re-quoted. The residue site source is now UNIPROT_FEATURE. Validated as for PTHR11117.
