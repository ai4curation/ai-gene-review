  summary: 'Family review update after nine new SCS gene reviews: PTHR11815'
  details: |
    Updated after the gene reviews written on 2026-11-18 (Dictyostelium scsB and scsC; Blastocystis SCSb; Trichomonas vaginalis Q03184; Actinomortierella ambigua A0A9P6TY68; and the alpha-subunit reviews) and the reconciliation of the P. aeruginosa reviews. Members that had no gene review now cite one: scsC (SF1); scsB, SCSb, Q03184 and P. aeruginosa SucC (SF10). No node verdict changed. Statements corrected: the GO:0004776 scope said that the Gln20 genes of early-diverging fungi are outside PTN000929335 and open, but they are not leaves and the one checked (A0A9P6TY68) is grafted below the node and already carries the term; the GO:0042709 row said that reviewed recipients mark the term too general, and the five newer reviews accept it because those entries carry no nucleotide-specific complex row; the B3FHP0 exception said that no PAINT node is named, and its TreeGrafter rows name PTN000212530; the Trichomonas pruning of GO:0006099 now rests on the full text of PMID:22079833; the SF1 description now says that the Dictyostelium member is unassayed. Blastocystis recorded as a further organism without a complete tricarboxylic acid cycle, on proteins that are not leaves. Every NEEDS_PRUNING row now carries proposed_action; the GO:0006099 row is repeated for its two changes (7 ADD_IRD actions: PTN008982090 for GO:0005739 and GO:0006099; the Aquifex leaf PTN000212656 for GO:0042709, GO:0004775, GO:0006099, GO:0006104; the Ustilago leaf PTN002273929 for GO:0004776). SF10 was tried as an affected subfamily of the IKR row and withdrawn, because the family and gene cross-check then reads the loss as applying to SF10 members outside the node. The disagreement between the two Blastocystis gene reviews on the TreeGrafter mitochondrion row was recorded and later reconciled (see the follow-up below). All 7 actions pass the proposed-action tree check; quote check on the file passes.

    Follow-up after independent checks (same day). The two Blastocystis gene reviews were reconciled in favour of the usage comment of GO:0005739, and the PTN000212530 row and the notes now say so. Dictyostelium wording in the PTN000929335 rows now separates the partial reactions in the primary abstracts from the retrospective sentence in PMID:7771809, as the alpha review does. The GO:0042709 row names P. putida and P. aeruginosa SucC among accepting reviews and states that SCSb accepts the inherited row; the GO:0004776 row names P. aeruginosa SucC as a second unseeded bacterial subunit with an experimental row. The note on the A0A9P6TY68 double annotation was narrowed to entries that miss HAMAP MF_03221. Three papers cited in prose were added to the references list.
