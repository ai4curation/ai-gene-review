- type: REVIEW
  outcome: changed
  summary: 'Evolutionary re-review: PTHR11815'
  details: |
    Part of a joint evolutionary re-review of the succinyl-CoA synthetase subunit families PTHR11117 (alpha) and PTHR11815 (beta). Evidence: the PANTHER release 19 trees, a reproducible local analysis (genes/yeast/LSC2/LSC2-bioinformatics: paralog census, bootstrapped neighbor-joining and maximum-likelihood trees, position-20 residue comparison), cached literature, and two OpenScientist hypothesis runs. Coherence changed from COHERENT to MOSTLY_COHERENT. Added assessments for the previously unassessed PAINT rows (IKR and GDP-forming gain at PTN000929335, bacterial cytosol, the Xanthomonas IRD), changed the mitochondrion node to NEEDS_PRUNING for hydrogenosomal Trichomonas subunits, changed GO:0042709 from FAMILY_WIDE to SUBFAMILY_ONLY, added a GO:0004776 term assessment and a checked residue site for position 20. Validated with the family schema, term, quote, residue and family/gene cross-check validators.
