  summary: Curate PTHR21646 family function boundaries
  details: |
    Curated Diverse ubiquitin-specific proteases. Assessment: HETEROGENEOUS. The inventory spans USP4, USP5, USP8, USP13, USP20, USP22 and other paralogs. Shared ubiquitin-processing chemistry does not justify transferring an EGFR substrate, an endosomal localization or a particular linkage preference to every family member. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
