  details: |
    Follow-up family/gene consistency audit found that the listed benchmark subfamily was a positive example, not an exhaustive applicable set. Retained member evidence and changed machine-readable scope to UNRESOLVED with the specific biological boundary: FAM20C protein phosphorylation is supported directly by structural and biochemical studies, whereas FAM20B phosphorylates glycan-bound xylose and FAM20A regulates FAM20C without supplying that catalytic reaction. The classification also includes a separate fly CG31145 protein-kinase branch and less characterized FAM20-domain proteins. The human-named FAM20C subfamily is therefore not established as an exhaustive allowed set. A complete phylogenetic and substrate-evidence boundary is needed for the machine-readable scope; the protein-kinase versus glycan-kinase versus pseudokinase distinction remains well supported.
