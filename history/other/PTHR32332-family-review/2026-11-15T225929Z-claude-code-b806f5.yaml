  details: |
    PANTHER family review written for modules/type_ii_fatty_acid_synthesis.yaml: the FMN/TIM-barrel oxidoreductase fold that holds the FabK enoyl-ACP reductases, assessed HETEROGENEOUS. GO:0016491 is family-wide, GO:0004318 is scoped to SF20 on the characterized streptococcal exemplar, and GO:0018580 to the fungal nitronate monooxygenases of SF34; a fungal transcription-factor node is left UNRESOLVED for lack of inventory members. Reference protein S. pneumoniae fabK (a TrEMBL entry, so absent from the SwissProt inventory; family and subfamily come from its own UniProt cross-reference).
