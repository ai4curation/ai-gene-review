  summary: Curate PTHR20837 family function boundaries
  details: |
    Curated CC2D2A/CC2D2B ciliary-associated proteins. Assessment: MOSTLY_COHERENT. Direct mammalian complex studies support CC2D2A-dependent organization of the ciliary diffusion barrier. The member inventory includes the CC2D2B paralog, so a blanket grant of every CC2D2A function is premature without comparative localization and domain evidence for that branch. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
