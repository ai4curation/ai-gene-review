- type: EDIT
  outcome: changed
  summary: Check gene_product descriptors in symbol_label_warnings
  details: |
    Recorded as its own target per docs/history.md: PR 5333 changes module_gene_symbols.py as well as module_logic.py, and the earlier records for this PR were slugged module_logic only.

    symbol_label_warnings walked only descriptors under the key 'gene' (plus family representative_members). This PR made module_logic._atom_from_annoton derive symbols from participant.gene_product too, so an ambiguous gene_product label yielded no symbol at runtime and no advisory telling the curator why: the engine and validation had diverged silently, which is the bug class this PR is about. The walker now checks both keys.

    Raises 113 new SYMBOL_LABEL warnings across 47 modules. All advisory: module_validator treats warnings as non-blocking (see its is_valid property, 'True when there are no errors'), so nothing that passed before now fails. Examples are 'E. coli ArnE' and 'E. coli ArnF' in lipid_a_l_arabinose_modification and 'ThiS sulfur carrier protein (Pseudomonas putida KT2440)' in thiamine_diphosphate_biosynthesis, none of which is symbol-first. The engine already behaved safely for these because descriptor_symbol refuses an ambiguous label and the accession carries the grounding; what was missing was the advisory.
