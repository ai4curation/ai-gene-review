  summary: Define and validate pilot regulator-target evidence records
  details: |
    Documented the pilot gene sidecar format for target identity, effect, directness, experimental strain, condition, assay and independent pathway context. Added JSON Schema and local accession/locus/taxon/reference validation, with seven regression tests rejecting malformed or misidentified records and pathway-execution conflation. Validation checks structure and linkage, not biological truth or remote quotation accuracy; manual primary-source review remains required.
