  summary: Complete evidence-grounded family review for PTHR21467
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. Affinity purification and interaction mutagenesis establish PP4R4 as a stable, specific PP4c partner in a cytosolic complex (PMID:18715871). It does not bridge PP4c to the previously characterized regulatory subunits. The complex has lower phosphatase activity than free PP4c in the reported assays; this is regulatory-complex evidence, not intrinsic phosphatase catalysis by PP4R4. A shared PP4 regulatory role is supported, while physiological substrate selection remains unresolved. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
