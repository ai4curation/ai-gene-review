    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR11822-tree-nodes.yaml, from `just phylo-family PTHR11822`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

    - PANTHER:PTN000214284 GO:0005739 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the seeds bracket this Eukaryota node, sitting in both branches below it, while SF41 descends from the node with 3 of its 223 leaves and none of the seeds, consistent with pruning SF41.
    - PANTHER:PTN002483519 GO:0005777 (NEEDS_PRUNING): the reason made a claim the tree contradicts; the reason was corrected. Added to the reason: In the PANTHER 19.0 tree the seeds bracket this Opisthokont node, but SF21 holds 50 of its 58 leaves and 3 of its 5 seeds (mouse and rat Idh1 and an Emericella seed), so pruning SF21 as a unit would cut most of the evidence; any IRD must sit below the subfamily level.
    - PANTHER:PTN008982454 GO:0006099 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree this Eubacteria family root has a single seed, M. tuberculosis icd-1 in SF21, 1 step below it, and SF41 descends from the node with 3 leaves and no seed, consistent with pruning the eukaryotic branches.

    Each row now quotes the family's node listing in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
