  summary: Complete evidence-grounded family review for PTHR11863
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. Mouse and human CH25H cDNAs encode cholesterol 25-hydroxylases with experimentally required histidine clusters (PMID:9852097). This side-chain hydroxylation differs from C4 methylsterol oxidation and C5 desaturation in other branches of the sterol-enzyme grouping. C4 methylsterol oxidase activity is therefore not a family-wide grant and is not supported for CH25H; the exact positively supported sterol-oxidase subfamily set remains unresolved. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
