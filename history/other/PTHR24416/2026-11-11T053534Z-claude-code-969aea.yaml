  details: |
    Structured family review of the DDR clade of PTHR24416 with a tree-wide residue survey (PTHR24416-bioinformatics). The collagen-binding pocket is conserved only in the vertebrate DDR node PTN007801558, so the GO:0005518 and GO:0038062 IBDs at PTN002400507 (Eumetazoa) are assessed TOO_DEEP. The dipteran node PTN002400510 (Drosophila Ddr, Anopheles DDR) has lost the beta3 lysine, catalytic-loop asparagine and DFG aspartate; PTN001230349 GO:0004714 is assessed NEEDS_PRUNING with an IKR recommended at PTN002400510. Residue sites carry positive and negative controls checked against UniProt. Revised after review of PR 6266: the IKR is stated not to block GO:0038062 (both actions needed); conservation claims narrowed to match the survey output (Trp52 and/or Asp69; C. briggsae Ser at Cys73); site sources set to LITERATURE; PAINT MOD seeds added; GO:0038062 term assessment added; unavailable-row columns and retired-accession handling fixed in the script.
