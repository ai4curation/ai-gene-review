  summary: 'Complete family biological assessment: PTHR22969'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. IKK-family serine/threonine kinases have conserved kinase chemistry but different substrate and pathway relationships. Fly IKKepsilon regulates actin turnover, membrane ruffling and nonapoptotic DIAP1-dependent morphogenesis in tracheal and bristle cells (PMID:16887350). These direct fly experiments support a cytoskeletal signaling branch; they do not make I-kappaB phosphorylation, mammalian interferon induction or a single ubiquitin-pathway substrate universal across IKKalpha/beta and IKKepsilon/TBK1 relatives. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
