  summary: 'Complete family biological assessment: PTHR19861'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Swd2/WDR82 proteins are regulatory WD-repeat subunits rather than methyltransferases. Human WDR82 associates with SET1A/B complexes but not the other tested MLL complexes and influences H3K4 trimethylation (PMID:18838538). Yeast Swd2 participates in both Set1 and CPF-related functions; depletion affects transcription termination without abolishing cleavage/polyadenylation activity in the tested extract (PMID:15024081). Histone methylation and RNA-end-processing roles therefore have distinct complex and organism boundaries, and catalytic activities of partner enzymes cannot be attributed to Swd2/WDR82 itself. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
