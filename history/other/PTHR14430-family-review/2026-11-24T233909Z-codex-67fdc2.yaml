  summary: Create PTHR14430 Sec2/Rabin3 family review
  details: |
    Created a compact PTHR14430 family review covering the Opisthokonta Rab GEF node, the fungal long-Sec2 cell-tip node, and the animal Rab3IP cytosol node. The review separates fungal long Sec2, short S. pombe Spo13, animal Rab3IP, and animal Rab3IL1 subfamilies; accepts family-level GO:0005085; records that GO:0051286 is appropriate for true tip-growing long Sec2 proteins but needs pruning for S. cerevisiae SEC2; and cites the PAINT cache plus the existing yeast, S. pombe, C. albicans, and A. fumigatus gene reviews. Validated with linkml-validate -C FamilyReview and just validate-families using the retained shared runtime.
