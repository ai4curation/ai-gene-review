  summary: Complete evidence-grounded family review for PTHR10131
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. TRAF2 recruits cIAP proteins through its coiled-coil region, as shown by reconstitution, structure and binding-site mutagenesis (PMID:20447407). This directly supports signaling adaptor activity independently of whether TRAF2 has intrinsic E3 ligase activity. The PANTHER grouping also includes plant and other divergent TRAF-type proteins whose receptor partners and adaptor mechanism are not defined by the TRAF2 experiment. The exhaustive signaling-adaptor grant boundary remains unresolved; RING-dependent ubiquitination is a separate assessment. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
