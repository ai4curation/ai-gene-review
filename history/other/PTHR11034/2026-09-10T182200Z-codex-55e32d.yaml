    Created a substantive FamilyReview for benchmark-associated members. Assessed functional coherence as UNKNOWN. IPR004142 itself distinguishes regulation of NDRG1 from NDRG2/3 and leaves precise molecular functions unresolved. Its suggestion of enzymatic activity is based on remote fold similarity, not an assay. MESK2 is therefore an informative test of unsupported enzyme transfer, but calling it a proven pseudoenzyme would require a demonstrated ancestral catalytic reaction and checked loss features. Official names and representative subfamilies are source-verified; biological excerpts retain experimental versus inferred provenance. Status is NEEDS_REVIEW. No PAINT-node or residue-loss claims were invented.
