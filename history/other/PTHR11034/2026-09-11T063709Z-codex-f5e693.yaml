  summary: 'Complete family biological assessment: PTHR11034'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. NDRG2 structures lack catalytic signature residues and have an occluded substrate-binding site, while structure-guided mutagenesis supports a role in molecular interactions affecting TCF/beta-catenin signaling (PMID:21247902). This is a concrete fold-retaining nonenzyme example, not evidence that every homolog is an active hydrolase. The family also includes plant NDL/SF21 and other animal NDRG branches with different biological contexts. A universal molecular-interaction partner or tumor-suppressor mechanism is unresolved, and the exact fly MESK2 product is not assigned human NDRG2 substrates or residue losses without its own sequence evidence. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
