  summary: Create PTHR15696 PAINT family review
  details: |
    Created a structured PTHR15696 family review covering all eight cached PAINT rows. The review keeps the PTN000403280 telomerase holoenzyme, telomeric DNA-binding and telomerase RNA-binding IBDs unresolved for the Saccharomyces ESL1/ESL2 branch because telomere phenotypes do not assay physical binding or complex membership; records the four PTN008560932 Dikarya IRDs as off-lineage unresolved losses; and proposes ADD_IRD at PTN007651902 for GO:0000184 because Lai et al. directly found no accumulation of the tested NMD substrates in esl1, esl2 or double mutants. Validated with LinkML, exact supporting-text quote checks, family_gene_crosscheck, family_residue_validator and just validate-families.
