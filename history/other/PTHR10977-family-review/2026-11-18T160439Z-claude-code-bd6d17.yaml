  summary: 'Family review revised: PTHR10977 cross-species'
  details: |
    Revised after 13 new or existing member gene reviews across mammals, fungi, Dictyostelium, Arabidopsis and archaea. Coherence changed from COHERENT to MOSTLY_COHERENT: archaeal SF3 members catalyse phosphomevalonate decarboxylation (H. volcanii mvaD), mevalonate 3-kinase (P. torridus PTO1356) and ATP-independent mevalonate 3,5-bisphosphate decarboxylation (T. acidophilum Ta0893), recorded as member exceptions to GO:0004163. The PTN000104601 cytosol IBD is NEEDS_PRUNING with an IRD proposed at the Viridiplantae clade PTN008509376 (plant MVDs are peroxisomal). The decarboxylase IBD is SOUND but too shallow to reach the Gram-positive decarboxylases, noted in prose because the schema has no verdict for it. Validated with schema, term, reference, quote, residue/PAINT-action and family-gene cross-check validators.
