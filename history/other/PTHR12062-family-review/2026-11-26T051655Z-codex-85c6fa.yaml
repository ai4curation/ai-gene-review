  summary: Create PTHR12062 MGAT4 family review
  details: |
    Created a PTHR12062 family review covering human MGAT4A, MGAT4B, MGAT4C and MGAT4D. Scoped exact GnT-IV activity and N-linked glycosylation to MGAT4A/B/C, recorded that MGAT4D/SF10 has diverged into the GnT1IP inhibitor of MGAT1, recommended ADD_IRD at PTN008989299 for the broad catalytic IBD that reaches MGAT4D, and recommended moving the MGAT4D-seeded ER, ERGIC and Golgi stack IBDs to the SF10 clade. Validated with targeted validate-quotes across the MGAT4 family files, LinkML family schema validation, the family reference validator, and the family residue validator.
