  summary: Curate PTHR22883 family function boundaries
  details: |
    Curated DHHC protein S-acyltransferases. Assessment: MOSTLY_COHERENT. The curated InterPro entry and member inventory support a common S-acyltransferase lineage, but the family includes many paralogs with different targets and acyl-chain preferences. A blanket palmitate-only or synaptic-substrate rule is not justified without subfamily evidence, and a missing catalytic motif must be demonstrated on a complete sequence before claiming inactivity. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
