  summary: Complete evidence-grounded family review for PTHR22883
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. Structural and biochemical work on DHHC enzymes establishes membrane-interface thioester-exchange chemistry and acyl-chain selectivity (PMID:29326245). The family contains multiple palmitoyltransferase branches with different protein substrates, acyl-chain preferences and partner requirements. ZDHHC23 placement supports this enzyme-family comparison, but a substrate reported for ZDHHC20, ZDHHC16 or fungal Erf2 cannot be assigned to ZDHHC23 from shared DHHC architecture. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
