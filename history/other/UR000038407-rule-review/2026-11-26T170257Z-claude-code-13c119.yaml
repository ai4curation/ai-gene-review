    The previous round's sentence kept EC 7.2.1.4 on MtrH and MtrC/D/E and took it off MtrA. The reviewer pointed out that the review's own evidence puts MtrA in the chemistry: its cob(I)amide is methylated and demethylated in both half-reactions (PMID:11248186), and PMID:38530900 reports the MtrCDE coenzyme M and Na+ site only as putative, formed with MtrA. The suggestion now keeps the EC on MtrA and MtrH, leaves MtrC/D/E (closer to the ATP synthase membrane sector) to HAMAP's judgement, and takes it off MtrB, MtrF and MtrG. rules-validate and --online pass.
