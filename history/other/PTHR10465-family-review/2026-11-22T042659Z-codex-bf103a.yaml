  summary: Create PTHR10465 mitofusin family review
  details: |
    Created a PTHR10465 family review covering the mitofusin/Fzo mitochondrial outer-membrane GTPases. The review scopes mitochondrial PAINT assertions to the eukaryotic MFN/Fzo node PTN002573358, distinguishes human MFN1 and MFN2 subfamilies from the broader SF0 mixture of fungal Fzo proteins and bacterial dynamin-like outgroups, and records that GTPase activity is safe across the broader dynamin-like family whereas mitochondrial outer membrane and mitochondrial fusion terms are eukaryotic mitofusin-specific.
