  summary: Curate PTHR19847 family function boundaries
  details: |
    Curated DCAF11/WDR23 ubiquitin-ligase substrate adaptors. Assessment: MOSTLY_COHERENT. The member inventory is dominated by DCAF11/WDR23-related proteins. The independently retrieved canonical worm WDR23 record cites direct studies of lifespan, manganese responses and SKN-1 regulation, and human DCAF11 has experimental sources for a possible CUL4-DDB1 substrate-receptor role. These support the adaptor lineage, while exact substrate specificity and transfer of worm phenotypes to every member remain unresolved. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
