- type: REVIEW
  outcome: changed
  summary: 'Evolutionary re-review: PTHR21139'
  details: |
    First independent review pass of the PTHR21139 family review (the earlier record is its creation). Evidence: the PANTHER release 19 tree and family alignment (both fetched from the PANTHER services), UniProt records of all 323 tree leaves and of the 577 reviewed members outside the tree, QuickGO experimental annotations of the leaves (filtered locally, because the service ignores an evidence-code filter without error), cached literature and PubMed/Europe PMC lookups. The analysis is reproducible with interpro/panther/PTHR21139/family_check.py, which writes the tree-check, msa-check and go-check reports in the family folder.
    Confirmed: the root placement of triose-phosphate isomerase activity and the three process terms (all 16 activity seeds are leaves with experimental rows; catalytic His and Glu present in 287 of 323 leaves) and the bacterial cytosol IBD.
    Changed: functional coherence from COHERENT to MOSTLY_COHERENT. The family also holds L-erythrulose-1-phosphate isomerases (EryH/LerI, EC 5.3.1.33), which have Ser at the catalytic Asn; a six-leaf fungal paralog clade (PTN001079910) and Streptomyces SCO0578 carry the same signature, and three hominine gene models (SF23, PTN004532404) lack the catalytic His. The four root IBD rows are now NEEDS_PRUNING, with ADD_IKR requested at PTN001079910, PTN000474663 and PTN004532404 for each term (12 requests). Added the two PAINT rows the first version left out: the IRD at the Nematostella leaf PTN001079919 and the mitochondrion IBD at the angiosperm cytosolic clade PTN004532492, both UNRESOLVED with no change requested. Subfamilies extended from 3 to all 14 plus the unlabelled fungal clade; two residue sites added; term scopes for the activity and its processes changed from FAMILY_WIDE to RESIDUE_DETERMINED. Corrected the earlier claim that rat Tpi1 inherits the bacterial cytosol node.
    Not verified: no Ser-bearing fungal or Streptomyces member has been assayed, and residual triose-phosphate isomerase activity of EryH/LerI was not found tested; five cited papers are not in the publications cache and are cited without quotes (checked against PubMed abstracts, Europe PMC full text or the citing UniProt records).
