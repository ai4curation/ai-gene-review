  summary: Create PTHR43209 (ThiI) family review
  details: |
    New family review (NEEDS_REVIEW). The tree splits into a bacterial and an
    archaeal/eukaryotic clade; the rhodanese-domain thiazole role is confined to the
    gamma-proteobacterial clade PTN000769419. The PAINT thiazole IBD at the root
    PTN001804941 is TOO_DEEP and should move to PTN000769419. Residue sites: PP-loop
    D189/K321 (required), Cys456/Cys344 (contributes; essential only in the rhodanese
    clade), and rhodanese-domain presence as the thiazole determinant. MJ0421 (Q57864),
    a THUMP-SPOUT methylase that UniProt assigns to this family but PANTHER's tree places
    in PTHR14911, is recorded as a member exception.
