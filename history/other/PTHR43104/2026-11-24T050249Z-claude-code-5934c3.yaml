- type: EDIT
  outcome: changed
  summary: Add soxA as an SF2 member exception to PTHR43104's GO:0047545 scope
  details: |
    The family/gene cross-check reported one conflict on PR #6752: PTHR43104 scopes GO:0047545 (S)-2-hydroxyglutarate dehydrogenase activity as SUBFAMILY_ONLY over SF2 and SF4, covering soxA, while the new soxA gene review removes that row. Resolved with the mechanism this term assessment already uses for the three P. putida malate:quinone oxidoreductases: soxA (Q9HTE6) is added as a fourth member_exception, with its own reason - it is the alpha subunit of a heterotetrameric sarcosine oxidase, carries IPR006277 specific to that subunit, is 1005 residues against the clade's single-chain FAD oxidoreductases, adds GcvT folate-binding and 2Fe-2S domains with no counterpart in L2HGDH function, and lies in the soxBDAG operon whose mutants accumulate sarcosine. The node assessments are untouched: PTN002454638 remains SOUND, since its five seeds really are L-2-hydroxyglutarate dehydrogenases and the dispute is over whether this target belongs in the clade, not over the node. Worth recording why nothing flagged this earlier: soxA is absent from PTHR43104-entries.csv, which is a 198-member sample, so UniProt's own PANTHER cross-reference is what places it in SF2. After the edit the cross-check reports 0 conflicts.
- type: EDIT
  outcome: changed
  sections:
  - node_assessments
  - term_assessments
  summary: 'PR review round 2: qualify the GO:0005886 node and scope the term'
  details: |
    PTN000354478's assessment reason held that "bacterial members of this family are peripheral
    cytoplasmic-membrane quinone-reducing enzymes, so plasma membrane is a reasonable clade
    property". That is true of the seed, E. coli LhgD (P37339, SF2), whose own record gives cell
    inner membrane, and of the clade the node represents. It is not true of every bacterial
    member: P. aeruginosa SoxA sits in the same SF2 by UniProt's cross-reference and is the alpha
    subunit of a soluble cytoplasmic sarcosine oxidase, with no transmembrane segment, no membrane
    keyword and no SUBCELLULAR LOCATION line. The soxA review marks the node SOURCE_BAD, and with
    no term assessment for GO:0005886 the contradiction was invisible to the cross-check.

    The node stays SOUND, since the location is right for the enzymes the seed represents, and the
    reason now says so rather than generalising over bacterial members. A GO:0005886 term
    assessment is added at SUBFAMILY_ONLY scope over SF2 with Q9HTE6 as a member exception, in the
    same shape as the GO:0047545 and GO:0008924 assessments: membrane association follows from
    LhgD's role feeding electrons into the respiratory chain, not from the shared FAD/NAD-binding
    fold, so it does not reach a member with the fold and not the role.

    A paint_action is still not writable for this, for the reason recorded when the GO:0047545
    exception was added: target_node_id is validated against the cached PANTHER tree and Q9HTE6
    appears in neither PTHR43104-entries.csv nor PTHR43104-paint.tsv, so there is no leaf node to
    target. PAINT will regenerate the GOA row until PANTHER carries this protein in the family
    inventory, which the soxA review now states beside its DELETE_ROW request.
