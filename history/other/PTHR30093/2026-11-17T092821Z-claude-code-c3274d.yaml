  summary: Separate the reviewed SF44 members from the GspH proteins assigned to it
  details: |
    Sixth review round on PR 6489. The SF44 description said PANTHER's own classification assigns the GspH minor pseudopilins to the subfamily and named the module's two exemplars, which read as if they were reviewed members of the entry; the family's member file contains no GspH protein. The description now says that no GspH protein is among the eleven reviewed members and that GspH proteins reach the subfamily from outside that list, with the source named per protein: Q00515 by PANTHER's release classification, Q88P03 by UniProt's cross-reference. It also records that the reviewed GspH proteins of other systems are in PTHR39583:SF2, so PANTHER splits the role between two families. The notes carry the same correction. The eight-of-eleven count, the assessments, the term scopes and the member exceptions are unchanged.
