  details: |
    Seventh review round on PR 6489, non-blocking. The SF44 description said that GspH proteins reach the subfamily from outside the reviewed-member list without saying why the list omits a reviewed Swiss-Prot protein that PANTHER's own release classification places there. The cached entries listing was fetched from InterPro's PANTHER integration on 2026-08-11 (PTHR30093-metadata.yaml, _fetch_info) and holds no row for Q00515; the same API, queried on 2026-11-17 at entry/panther/protein/uniprot/Q00515/, returns PTHR30093 for that protein. The omission is therefore a difference of source and date rather than evidence against the SF44 placement, and the description now says so. No assessment, term scope, member exception or quote changed.
