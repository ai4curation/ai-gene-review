- type: REVIEW
  outcome: changed
  summary: Record the type IV pilins inside the GspG subfamily
  details: |
    Second review round on PR 6489. The subfamily description, the summary, the coherence reason and the notes said SF44 held the GspG major pseudopilins and that the family's type IV pilins sat in SF34 and SF47. The family's own member table shows three type IV major pilins inside SF44 as well (Myxococcus xanthus PilA Q59589, Thermus thermophilus PilA4 Q72JC0 and PilA5 Q72GL2). Those three are now named in the subfamily description and recorded as member_exceptions on both T2SS term assessments, the scope reasons say that SF44 is not a clean boundary, and the notes record that the module grounds GspG and GspH on InterPro rather than on this family.
