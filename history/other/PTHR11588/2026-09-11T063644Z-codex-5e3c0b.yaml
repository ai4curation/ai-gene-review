  summary: 'Complete family biological assessment: PTHR11588'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Tubulins diversify into alpha, beta, gamma, delta, epsilon and zeta subfamilies with distinct polymer, nucleation and basal-body roles; a phylogenomic analysis of 3524 tubulins documents their duplication and loss (PMID:25169981). GTP binding is not equivalent to GTP hydrolysis, especially for alpha versus beta tubulin in the heterodimer. Fly betaTub97EF increases microtubule stability under low-temperature conditions (PMID:29084803); that isoform-specific property is not a property of all tubulins. A universal GTPase grant is therefore unresolved without distinguishing nucleotide-site chemistry and branch architecture. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
