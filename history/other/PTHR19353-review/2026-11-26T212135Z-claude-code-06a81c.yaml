  summary: Re-review PTHR19353 against the PANTHER tree, family alignment and leaf annotations
  details: 'First REVIEW pass over a review that had only a CREATE record. Tree and alignment were both obtained: the PANTHER 19 tree (315 leaves, 98 species) and PANTHER''s own family alignment were fetched from the PANTHER API by interpro/panther/PTHR19353/family_analysis.py, whose output PTHR19353-analysis.txt also holds the experimental GO annotations of every tree leaf from QuickGO (queried by gene product and evidence class; 112 rows on 22 leaves).


    Confirmed: the three root IBDs (GO:0016717, GO:0016020, GO:0006629 at PTN002321280) are correctly placed. The root splits into a bacterial clade (PTN008570178) and a clade of Synechocystis DesD plus all eukaryotes (PTN004512925), and seeds resolve to leaves on both sides. The three histidine boxes are intact in 304 of 315 alignment rows.


    Changed: (1) the earlier NEEDS_PRUNING reason is withdrawn. It named the SF19 carotenoid ketolases and the ceramide hydroxylase CerH, which are HMM-assigned reviewed entries and not leaves of the tree, so they receive no IBA. (2) Two leaf-level losses under the GO:0016717 IBD are requested instead: ADD_IRD at PTN001833191 (Synechocystis P73428, ORF sll1468, CrtR beta-carotene hydroxylase, a monooxygenase with intact histidine boxes; PMID:9664719, PMID:10431816, abstracts only) and ADD_IKR at PTN002499979 (human FADS2B A8MWK0, Gln at the fourth position of histidine box 2, PE 5). (3) A histidine_boxes residue site anchored on human FADS2 O95864 was added, strength CONTRIBUTES because the per-histidine mutagenesis is from rat SCD, outside the family. (4) Subfamilies SF11, SF13, SF22 and SF30 were added and SF19 re-described as a non-clade residual group; SF11 (FADS3) joins the GO:0016717 scope, and a FAMILY_WIDE membrane term assessment was added.


    Not verified: the function of FADS6 and mouse Fads2b (no experimental data), the two small clades PTN001064320 and PTN009038787 (no annotated leaf), and whether the Bradyrhizobium rtxC leaf acts on a lipid. Curation follow-ups noted in the review: B. subtilis Des has no experimental GO annotation, and the GO:0004768 rows on fat-3, fat-4 and mouse Fads2 and the GO:0016213 row on DesA3 name a different position from their papers.


    Validation: schema, term labels, reference and file quotes (47 verified), residue sites and proposed-action tree checks (57 pass), and the family/gene cross-check all pass for this file. Four publication cache files were added for the papers quoted (PMID 9664719, 10431816, 11457919, 17087501).

    '
