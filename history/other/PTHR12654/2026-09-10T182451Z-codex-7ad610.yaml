  summary: Curate PTHR12654 family function boundaries
  details: |
    Curated GBA2 nonlysosomal glucosylceramidases. Assessment: MOSTLY_COHERENT. The available member inventory is consistently GBA2, but experimentally demonstrated isoform differences preclude an unconditional activity grant to every protein sequence. The 799-residue fly CG33090 sequence requires an isoform and domain-completeness check before human isoform results are transferred to it. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
