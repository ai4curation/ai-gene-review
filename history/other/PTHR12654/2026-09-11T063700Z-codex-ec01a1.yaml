  summary: 'Complete family biological assessment: PTHR12654'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. GBA2 is a nonlysosomal glucosylceramidase family whose complete membrane-associated architecture matters for activity. Expression of nine human GBA2 isoforms found only isoform 1 active in the tested fluorogenic-substrate and lipid assays (PMID:33261081), providing a direct counterexample to treating every GBA2 gene product as catalytically equivalent. The altered N terminus of the fly CG33090 benchmark isoform does not by itself prove catalytic loss, particularly when its catalytic-region sequence is retained. Conserved family chemistry is supported, but activity, substrate access and topology must be assessed on the exact product. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
