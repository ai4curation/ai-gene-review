  summary: Family review of PTHR28489 for the dismech vision-disorder alignment
  details: |
    First family review of the RD3 family, written for projects/DISMECH_VISION_ALIGNMENT after the RD3 gene review. Coherence UNKNOWN, because RD3L and the other RD3-like subfamilies are uncharacterized. The one PAINT row, retina development in camera-type eye at the tetrapod RD3 node PTN008623184, is judged WRONG_NODE: the seed is the rd3 mouse, whose retina develops normally and then degenerates. Retina homeostasis, guanylate cyclase inhibitor activity and protein localization to photoreceptor outer segment are scoped to the RD3 subfamily; PAINT propagates none of them. Validated with the family schema, term, reference and quote checks; the family/gene cross-check reports no conflict.
