  details: |
    New FamilyReview for the family I CoA-transferases (SCOT/OXCT, AtoDA, ScoAB, CtfAB, PcaIJ, IpdAB). Subfamilies SF23/SF28/SF30 (eukaryotic SCOT) and SF60/SF57 (bacterial A/B subunits, which mix substrate specificities and do not cleanly split subunit types); node assessments for PTN000344749 (CoA-transferase activity, NEEDS_PRUNING for the IpdAB hydrolase clade), PTN000344750 (SCOT activity, SOUND) and PTN001009021 (mitochondrion, SOUND within eukaryotic SCOT); catalytic-glutamate residue site anchored on OXCT1 E344 with PcaJ E50 positive and Mtb IpdB D58 negative controls; term assessments for GO:0008410, GO:0008260, GO:0047569 and GO:0005739. Reference protein OXCT1. Validated with the validate-families steps.
