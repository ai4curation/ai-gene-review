  summary: 'Complete family biological assessment: PTHR11208'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. The shared KH-containing RNA-recognition machinery supports broad RNA binding, with different recognition mechanisms in STAR/QKI and SF1 branches. QKI/GLD-1 structures show how Qua1 dimerization and the KH-Qua2 unit recognize a specific RNA element (PMID:23630077). This does not make every KH protein an identical sequence-specific translational regulator, nor does it transfer the SF1 splice-branchpoint role to qkr58E-1. RNA binding is the conserved broad molecular activity; target sequences, oligomerization requirements and splicing versus translational outputs remain branch-specific. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
