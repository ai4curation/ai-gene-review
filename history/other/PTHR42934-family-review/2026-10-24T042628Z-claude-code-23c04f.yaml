  summary: 'Create family review: PTHR42934 glycolate oxidase subunit GlcD'
  details: |
    New FamilyReview for PTHR42934 (reference protein E. coli GlcD P0AEP9). Subfamilies SF1 (canonical GlcD of GlcDEF; E. coli and P. putida GlcD; used by glycolate_glyoxylate_assimilation), SF2 (mixed: Bacillus GlcD plus standalone D-lactate dehydrogenases D4MUV9, O29853 and LctD H6LBS1; flagged partly diverged) and SF3 (uncharacterized, PANTHER-named D-lactate dehydrogenase). The single PAINT node PTN001714823 is the family root; its glycolate dehydrogenase activity and glycolate catabolic process IBDs are NEEDS_PRUNING, recorded as member exceptions for the SF2 D-lactate dehydrogenases. Term assessments: FAD binding FAMILY_WIDE; glycolate terms SUBFAMILY_ONLY SF1+SF2. Consistent with the E. coli glcD review (both IBAs ACCEPT). Validated with linkml-validate, term validator, reference validator, residue validator and family/gene cross-check (no issues).
