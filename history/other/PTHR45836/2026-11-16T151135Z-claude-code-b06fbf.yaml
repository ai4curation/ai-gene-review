    - PANTHER:PTN001556510 GO:0050919 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree PTN001556510 is a Chordata speciation node and all seeds are mammalian Slits whose common ancestor sits 2 steps below it. The named subfamilies SF6, SF11, SF10 and SF19 lie below the node and hold none of the seeds, consistent with pruning them.

