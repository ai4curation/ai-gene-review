- type: EDIT
  outcome: changed
  summary: Migrate modules to GO release 2026-07-26 (obsoletions and renames)
  details: |
    Repo-wide ontology-churn migration for modules/, triggered by a reported validation failure on modules/wnt_signaling.yaml (GO:0008374 now obsolete). Root cause: the local OAK semsql GO database was release 2026-03-25 while the reporting run used a newer release, so the failure did not reproduce locally. Refreshed go.db to 2026-07-26 (and regenerated cache/ontologies/go.tsv, 6820 to 12174 terms), which reproduced 52 errors across 21 module files - the reported line was one of them, the rest had scrolled off. All 52 now fixed; module_validator exits 0 with zero errors. Three classes of change. (1) Eleven pure label renames where GO added the cofactor to an enzyme name (GO:0003942, GO:0003842, GO:0004350, GO:0004491, GO:0008774, GO:0016621, GO:0019288, GO:0043824, GO:0048001, GO:0050608, GO:0102965): id unchanged, label refreshed from the ontology. (2) Seven obsoletions re-pointed to GO's own replaced_by, all of them route-qualifier generalisations that GO deliberately collapsed: GO:0019285 to GO:0031456, GO:0043640 to GO:0043639, GO:0009255 to GO:0061678, GO:0061624 to GO:0006001, GO:0033387 to GO:0009446, GO:0000750 to GO:0071507, GO:0061688 to GO:0006096. (3) Three cases where GO's replaced_by was judged unsuitable and overridden with justification recorded in the module. GO:0008374 redirects to GO:0016747 (generic acyltransferase); used GO:1990698 palmitoleoyltransferase activity instead, which is the specific descendant human PORCN actually carries in GOA by IBA, IEA and ISS, and which matches the annoton's existing preferred_term. GO:0070680 redirects to GO:0070981 L-asparagine biosynthetic process, which misstates the chemistry - the AspRS/GatCAB indirect route does not make free L-asparagine, it converts Asp already charged on tRNA(Asn); used GO:0043688 conversion of aspartyl-tRNA to asparaginyl-tRNA, which states exactly that and sits under charged-tRNA amino acid modification. GO:0005052, GO:0005053 and GO:0033328 (PTS1, PTS2 and mPTS binding) all redirect to the single term GO:0000268, which has no children, so Pex5, Pex7 and Pex19 now carry an identical molecular function; the redirect was applied because GO:0000268 is factually true of all three, but the lost granularity is recorded as an ONTOLOGY knowledge gap on peroxisome-lifecycle with a proposed replacement term. Labels throughout were taken from the refreshed semsql build rather than from the live GO API, because the validator compares against the semsql build and the two currently disagree (live GO is 2026-09-22 and renames further terms, e.g. GO:0006096 to glycolysis and GO:0005484 to helical-bundle zippering fusogenic activity); adopting live labels today would have created fresh mismatches.
