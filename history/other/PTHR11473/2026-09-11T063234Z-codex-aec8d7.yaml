  summary: Complete evidence-grounded family review for PTHR11473
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. Phenylalanine, tyrosine and tryptophan hydroxylases retain related oxygenation chemistry with different substrates. Within the phenylalanine-hydroxylase-associated group, the native Hn-PD input E8NH57 contains only a C-terminal portion of the catalytic domain. Retained iron ligands do not restore the missing substrate/cofactor architecture, so neither family nor subfamily identity can grant the complete reaction to every isoform. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
