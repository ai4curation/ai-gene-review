  summary: 'Create family review: PTHR43024'
  details: |
    New COMPLETE review of the UDP-N-ACETYLMURAMOYL-TRIPEPTIDE--D-ALANYL-D-ALANINE LIGASE family (MurF), declared HETEROGENEOUS because the family's single subfamily PTHR43024:SF1 holds, under the MurF name, three archaeal coenzyme F(430) synthetases (Q46FL3, Q57706, Q8TJZ6) alongside 18 bacterial MurF enzymes of both stem-peptide types. All four PAINT rows assessed SOUND: GO:0016874 at the untaxoned node PTN001138846, seeded by a meso-DAP-type and an L-lysine-type MurF, and GO:0008766, GO:0047480 and GO:0009252 at PTN000566380 restricted to Bacteria, which is what keeps the peptidoglycan terms off the archaeal branch. Both stem-specific activity terms are scoped UNRESOLVED, because MurF does not select the third stem residue (MurE does) and the two GO terms are siblings under GO:0016881 with no stem-agnostic parent; GO:0016874 is FAMILY_WIDE and GO:0009252 FAMILY_WIDE with the three cfbE members as member exceptions. One residue site curated: the Mur ligase superfamily region II pair Glu158/His188 of E. coli MurF, from the Eveland mutagenesis (PMID:9166795), with three positive controls checked against UniProt sequences. Validated with the family schema, term, reference, local-quote, residue and family/gene cross-check validators (0 conflicts).
