- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  summary: Backfill missing annotation qualifiers from GOA (54,252 rows, 1,520 reviews)
  details: |
    Older reviews omitted the qualifier field on existing_annotations rows, so qualifier-aware checks (the hierarchical action-consistency rules) could not tell is_active_in from located_in or contributes_to from enables. Each review's own GOA file supplied the qualifier, matched on (term, evidence, reference, negated) as ai-gene-review backfill-qualifiers does, and only where GOA gives exactly one qualifier; 108 ambiguous rows were left unset, as were rows absent from GOA. Edits are pure one-line insertions after original_reference_id: no other line changed (the backfill-qualifiers command would have re-dumped every file). Each file was re-parsed and checked to equal its original data plus the new qualifiers; all values are in AnnotationQualifierEnum. A validation sample of 25 files showed no new errors.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  summary: Make the backfill reproducible with the committed command
  details: 'The backfill above was produced by a one-off inserter script, not by the committed command,
    which then rewrote whole files with yaml.dump. In response to PR #5974 review, GOAValidator.backfill_qualifiers
    (ai-gene-review backfill-qualifiers) now inserts one line per row using load_marked key positions
    and refuses to write unless the reloaded file equals the original plus the new qualifiers. Run over
    every review at the pre-backfill commit, it reproduces this PR''s diff exactly: 54,252 qualifiers
    in 1,520 files, each file byte-identical to the committed version.'
