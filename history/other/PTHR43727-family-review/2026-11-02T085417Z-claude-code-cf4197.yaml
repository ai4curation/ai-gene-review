  summary: 'Family review: PTHR43727 group IV PLP decarboxylases'
  details: |
    New family review for the group IV (fold-type III) PLP-dependent decarboxylase family that contains the NspC enzymes of the bacterial_carboxyspermidine_biosynthesis module. Judged HETEROGENEOUS: subfamily SF2 holds the LysA diaminopimelate decarboxylases of lysine biosynthesis, subfamily SF1 the carboxy(nor)spermidine decarboxylases and the Synechocystis carboxyaminopropylagmatine decarboxylase, which are experimentally inactive on meso-diaminopimelate, lysine and arginine. The family's single PAINT node PTN000159906 carries both its IBD rows and is assessed NEEDS_PRUNING on each, because it propagates diaminopimelate decarboxylase activity and lysine biosynthesis into SF1; the resulting IBA rows are removed in the SF1 gene reviews. GO:0008836 and GO:0009085 are scoped SUBFAMILY_ONLY to SF2; carboxy-lyase activity, PLP binding and dimerization are family-wide. Reference protein is Q9KRL4 (Vibrio cholerae nspC). The family/gene cross-check lists one advisory disagreement, PSEPK lysA-I marking carboxy-lyase activity as over-annotated; the family-wide scope was kept and the advisory accepted. Validated with the validate-families validators.
