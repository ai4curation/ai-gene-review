  summary: 'Complete family biological assessment: PTHR23031'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Rhophilins are Rho-associated interaction scaffolds with Bro1/PDZ-containing architecture. Direct comparison found both RHPN1 and RHPN2 binding GDP- and GTP-bound RhoA in vitro, whereas only RHPN2 produced the tested stress-fiber-loss phenotype (PMID:12221077). Thus exclusive binding to activated RhoA and uniform inhibition of actin assembly are not family-wide properties. The common scaffold mechanism is coherent, but the nucleotide-state preference, downstream partners and actin outcome of fly Rhp remain distinct questions. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
