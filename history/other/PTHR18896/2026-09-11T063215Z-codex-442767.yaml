  summary: Complete evidence-grounded family review for PTHR18896
  details: |
    Completed the family assessment after checking source provenance, available primary publication findings, current member/domain boundaries, and exact representative accession links. The inventory contains classical animal and plant PLDs with conserved phospholipase architecture. Fly Pld loss and rescue experiments link phosphatidic-acid signaling to phototransduction (PMID:15883198), while separate experiments support vesicle trafficking during cellularization (PMID:17156430). These physiological outputs differ from the common lipid-hydrolysis reaction and should not be generalized to all PLDs. No catalytic-loss claim is supported for the exact fly input. Schema, official PANTHER labels and member assignments, reference-file presence, publication titles and verbatim source excerpts passed local validation. Biological uncertainty in a term grant is retained independently of completed review status.
