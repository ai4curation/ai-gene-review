  summary: Replace label-only UniProt support on 132 human rows and core functions
  details: |
    Human pass of the weak-UniProt-support sweep, after the SCHPO pass (#6030, #6031) and the checker fix (#6367). Worklist: 109 annotation rows (any action but ND) whose every supported_by item was a UniProt quote the checker flags as a label or unvetted prediction (DE protein name, KW keyword, DR GO line, ARBA or ECO:0000313 text), plus 23 core functions with at least one such item; 132 items in 39 review files. Each now quotes verbatim support suited to its action: curated Swiss-Prot FUNCTION, CATALYTIC ACTIVITY, SUBCELLULAR LOCATION and SIMILARITY text, family and domain lines, sequence features, Reactome, deep-research files and cached publications. References added to HES1: PMID:12666205, PMID:15821257, PMID:17065448, PMID:21300049. Action changes: 25 KEEP_AS_NON_CORE rows to UNDECIDED where the row is an orthology projection of a rodent experimental annotation whose paper is not cached and nothing else in the repo supports it (HES1 24 developmental-process rows, P3H1 1 row with propagation_review UNRESOLVED); the eight NBR1 bone, osteoblast and p38 MAPK rows stay KEEP_AS_NON_CORE, now citing the mouse study behind them (Whitehouse et al. 2010, PMID:20616007, newly cached); 10 RNF41 high-throughput bare protein-binding IPI rows to REMOVE under the protein-binding policy; KEEP_AS_NON_CORE to TOO_GENERAL where a carried term entails the row (BAAT 8, HES1 42, MVK 8) and MARK_AS_OVER_ANNOTATED to TOO_GENERAL for CDA cytoplasm and hydrolase activity and GPI 39; HES1 37 UNDECIDED to KEEP_AS_NON_CORE on PMID:17065448; HPX metal ion binding MODIFY to heme binding; PEDS1 ER (IDA) and DLAT mitochondrion (IDA) KEEP_AS_NON_CORE to ACCEPT under the root-organelle policy, since in both the location is where the core activity acts. HES1 row 37 also quotes the primary rodent study (Kamakura et al. 2004, PMID:15156153), and the five rodent HES1 references carry reference_review notes saying they are used by similarity. On review, quotes that did not bear on the claim were dropped rather than kept to satisfy the checker: the glycolysis text on eight GPI MARK_AS_OVER_ANNOTATED rows and the E3-ligase text on the ten RNF41 REMOVE rows; the argument stays in reason. Each edited file was backfilled with backfill-record-sections and validated.
