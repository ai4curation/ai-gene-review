  summary: Re-curate PSEPK rows whose only support was a weak UniProt quote, deep
    research or notes
  details: |
    Third organism of the weak-UniProt-support re-curation, after human (#5819) and DROME (#5842). 423 ACCEPT/NEW annotation rows and core functions in 234 Pseudomonas putida KT2440 review files had no real support: their supported_by entries quoted only weak UniProt text (a DE name or EC line, KW, the record's own DR GO line, the ID line, or a statement whose only evidence is ARBA, IEA or ECO:0000313), or that plus deep-research text, gene notes, GapMind/module pathway definitions or another gene's UniProt record. Each weak item was replaced with verbatim support: curated UniRule text (HAMAP, PIRNR, PIRSR, RuleBase function, reaction, pathway and location lines), family and domain classification (NCBIfam, PANTHER subfamily, InterPro, Pfam, PROSITE, CDD, PIRSF), sequence-analysis features (Phobius TRANSMEM, SignalP SIGNAL), or cached publications, several of them on orthologs. Each rewritten reason says whose evidence it is and how far it reaches; most support is family-level, not a KT2440 assay. Action changes, all MODIFY to a more specific descendant: nuoA, nuoC, nuoE and nuoK NADH dehydrogenase complex to respiratory chain complex I (GO:0045271), the complex these reviews' core functions use (carried in GOA by sibling subunits nuoB and nuoF, not by these four genes); the remaining targets are terms the gene already carries unless noted: nuoG respiratory electron transport chain to GO:0042773 and iron-sulfur cluster binding to GO:0051537 + GO:0051539 (asserted as NEW rows in the same review, not in GOA); tolC outer membrane to cell outer membrane; PP_1084 peroxiredoxin to thioredoxin peroxidase activity; tgt cytoplasm to cytosol (was KEEP_AS_NON_CORE with a reason calling it redundant); PP_3443 phosphorylating GAPDH (EC-mapped from a submitter name) to the general NAD(P) aldehyde oxidoreductase term, which becomes the accepted core function, in line with its ALDH family 11 non-phosphorylating GAPDH domain classification; rbsA-I NEW row and core function broadened from D-ribose to monosaccharide transport, with a suggested question on ribose versus allose. Further listed rows were left to main, which re-curated those files while this branch was open: four in catA and catA-II (#5371), and eight in PP_0664, hom and thrC (#5858, the aspartate-to-threonine route audit, which also deliberately retired the NEW L-methionine rows on hom and PP_0664). Each edited file was backfilled with backfill-record-sections and validated.
