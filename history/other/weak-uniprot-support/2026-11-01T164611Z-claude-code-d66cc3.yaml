  summary: Re-curate DROME rows whose only support was a label or unvetted UniProt
    quote
  details: |
    Second organism of the weak-UniProt-support re-curation, after the approved human pilot (#5819). 130 ACCEPT/NEW annotation rows and core functions in 51 Drosophila melanogaster review files cited only weak UniProt quotes: a label (DE name or EC line, KW, the record's own DR GO line), the sequence, or a statement whose only evidence is an unvetted prediction (mostly ARBA, since most of these entries are unreviewed TrEMBL records). Each weak quote was replaced with verbatim support: a cached publication, curated UniProt text (for spi, ECO:0000269 subcellular location), sequence-analysis features (Phobius TRANSMEM, SignalP SIGNAL) or family/domain classification (PANTHER subfamily, HAMAP, NCBIfam, InterPro, Pfam, PROSITE, PIRSF). Where the new support covers only the family, a partner, the complex or a mammalian ortholog, the reason now says whose evidence it is. Action changes: BNIP3 mitochondrial envelope, membrane and mitochondrial membrane rows MODIFY to mitochondrial outer membrane (GO:0005741, already carried); sea mitochondrial membrane MODIFY to mitochondrial inner membrane (GO:0005743), as its reason argued; PNPase RNA processing MARK_AS_OVER_ANNOTATED, since the fly paper detects no processing defect. Left unchanged and deferred: Uxs Golgi cisterna membrane (IEA), whose only location evidence is ARBA but which three other rows and the core function depend on; resolving it needs a localization paper. Briefed by pilot-brief lessons plus: name the record fields checked when relying on an absent feature; location quotes support only location terms; no cross-gene UniProt citations. Each edited file was backfilled with backfill-record-sections and validated.
