  summary: Re-curate human rows whose only support was a label or unvetted UniProt
    quote (pilot)
  details: |
    Pilot of the weak-UniProt-support re-curation. 97 ACCEPT/NEW annotation rows and core functions in 49 human review files whose only supported_by entries quoted a UniProt label (DE name or EC line, KW, the record's own DR GO line), a REF citation descriptor, or a statement whose only evidence is an unvetted prediction were re-curated row by row: each weak quote was replaced with verbatim support from a cached publication, Reactome, curated UniProt text (ECO:0000269/ECO:0000250 comments, binding sites, kinetics) or family/domain classification (CC SIMILARITY, Pfam, InterPro, PROSITE, HAMAP, NCBIfam, PANTHER). No action changed: every row had real support to cite. Reasons and summaries were adjusted only where they had argued from the removed quote. One listed row (FOXRED1) no longer existed on main and was skipped. Two rows (CAND2 cytosol, THBS2 integrin binding) still rest partly on deep-research text and are flagged for review. Each edited file was backfilled with backfill-record-sections and validated.
