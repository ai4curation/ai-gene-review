  summary: Re-curate human rows whose only support was a label or unvetted UniProt
    quote (pilot)
  details: |
    Pilot of the weak-UniProt-support re-curation. 97 ACCEPT/NEW annotation rows and core functions in 49 human review files whose only supported_by entries quoted a UniProt label (DE name or EC line, KW, the record's own DR GO line), a REF citation descriptor, or a statement whose only evidence is an unvetted prediction were re-curated row by row: each weak quote was replaced with verbatim support from a cached publication, Reactome, curated UniProt text (ECO:0000269/ECO:0000250 comments, binding sites, kinetics) or family/domain classification (CC SIMILARITY, Pfam, InterPro, PROSITE, HAMAP, NCBIfam, PANTHER). Every row had real support to cite, so no action changed for lack of support. Reasons and summaries were adjusted where they had argued from the removed quote or where the new support covers only a parent term or a weaker assay (DCAF11 nucleoplasm, FBXO5). One listed row (FOXRED1) no longer existed on main and was skipped. Following review: THBS2's self-added GO:0005178 integrin binding NEW row and its core function, which rested on deep-research text and a predicted RGD motif, were withdrawn and recorded as a suggested question; and seven rows that accepted a term their own reason called too general were changed to MODIFY with the more specific term the gene already carries (GMPS GO:0003921 x4 to GO:0003922, CYP39A1 GO:0008396 to GO:0033782, ADSS1 GO:0000166 to GO:0005525, LTN1 GO:0004842 to GO:0061630). CAND2 cytosol still cites deep-research text and is flagged for review. Each edited file was backfilled with backfill-record-sections and validated.
