  summary: Re-curate SCHPO rows whose only support was the UniProt protein name (part
    1 of 3, adi1-fum1)
  details: |
    Part 1 of 3 of the SCHPO (Schizosaccharomyces pombe) weak-UniProt-support re-curation, after human (#5819), DROME (#5842) and PSEPK (#5867). 242 ACCEPT annotation rows and core functions in 35 review files (adi1 to fum1, alphabetically) cited only the UniProt DE protein name as support. Each DE quote was replaced with verbatim support: curated Swiss-Prot text (CC FUNCTION, CATALYTIC ACTIVITY, PATHWAY, SUBCELLULAR LOCATION and SUBUNIT, with ECO:0000269 PubMed or ECO:0000250 by-similarity evidence), cached publications (for example PMID:24911838 for the coq genes, PMID:14519123 for dps1 and dlp1, PMID:12633877 for dsd1), family and domain classification, and sequence features. Each rewritten reason says whose evidence it is; much is by similarity to the S. cerevisiae ortholog. From this organism on, deep-research quotes count as support like a review article (user decision) and were kept. Action changes, all MODIFY to a more specific term the gene already carries: alg2 GO:0000033 to GO:0004378; coq7 GO:0031314 to GO:0099616; dps1 and dlp1 GO:0032476 to the heterotetrameric complex GO:0032478; dsd1 GO:0030148 to GO:0046512 and GO:0046513 on both its IEA and IMP rows, for consistency. After review, fum1's twelve non-ACCEPT rows that cited only the DE name (including the nucleus, cytoplasm, cytosol and DNA-damage rows, which the 'mitochondrial' name contradicts) were re-quoted from its CC FUNCTION, CATALYTIC ACTIVITY and SUBCELLULAR LOCATION text, and every core function in these files that still carried a DE quote had it replaced with the verbatim quotes already used on the gene's own annotation rows for the same molecular function, location and process. Each edited file was backfilled with backfill-record-sections and validated.
