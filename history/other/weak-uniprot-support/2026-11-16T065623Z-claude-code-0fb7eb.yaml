  summary: Replace label-only UniProt support on 73 DROME rows and core functions
  details: |
    DROME (Drosophila melanogaster) pass of the weak-UniProt-support sweep, after the human (#6378) and PSEPK (#6411) passes. Worklist: 61 annotation rows (any action but ND) whose every supported_by item was a UniProt quote the checker flags as a label or unvetted prediction (DE protein name, KW keyword, DR GO line, ARBA or ECO:0000313 text), plus 12 core functions with at least one such item; 73 items in 36 review files. Each now quotes support suited to its action: curated UniProt FUNCTION and CATALYTIC ACTIVITY text, family and domain classification (InterPro, Pfam, NCBIfam, PANTHER, HAMAP, PROSITE, CDD), sequence features, cached Drosophila and ortholog publications, and deep-research files including the FlyBase gene descriptions. Got1 adds PMID:27827456 (already cached) and PMID:7113743 (newly cached, rat), both used by similarity. Action changes, under the 2026-11-14 maintainer ruling that MODIFY needs the row's own evidence for the deeper term and TOO_GENERAL is for terms imprecise on their own: MODIFY to TOO_GENERAL where the row's evidence (often ARBA or a generic signature) stops at an imprecise term entailed by a carried one (Gcat transferase activity, Got1 and Snx1 cytoplasm, Mid1, Snx1, boi and na membrane, Snx6 endomembrane system, Ugp uridylyltransferase activity); KEEP_AS_NON_CORE to TOO_GENERAL (Acadvl fatty acid metabolic process, Lkb1 nucleotide binding, kinase activity and transferase activity); CG4610 tRNA wobble uridine modification MODIFY to ACCEPT, since its MnmG signature also covers bacterial MnmG and so supports only this respectably specific core term; HSPC300 cytoskeleton KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED. Under the root-organelle policy, organelle rows that had been MODIFIED down to a sub-compartment are ACCEPT (CG30022 and Sqor mitochondrion, Vps53 Golgi apparatus, twr endoplasmic reticulum); the core_functions.locations of Sqor, CG30022 and Vps53 now name the root organelle, since no fly evidence shows the sub-compartment where the core activity acts; NEW sub-compartment rows (Sqor inner membrane, Vps53 trans-Golgi network, CG30022 matrix) are noted for follow-up. The Uxs Golgi rows lead with the worm SQV-1 Golgi statement. Each edited file was backfilled with backfill-record-sections and validated.
