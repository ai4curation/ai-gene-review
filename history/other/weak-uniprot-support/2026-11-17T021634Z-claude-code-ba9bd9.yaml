  summary: Replace label-only UniProt support on 120 POPTR rows and core functions
  details: |
    POPTR (Populus trichocarpa) pass of the weak-UniProt-support sweep, after the human (#6378), PSEPK (#6411) and DROME (#6454) passes. Worklist: 83 annotation rows (any action but ND, including 3 NEW rows) whose every supported_by item was a UniProt quote the checker flags as a label or unvetted prediction (mostly RecName/AltName protein names and DR GO lines on plastid ribosomal, photosystem and ATP synthase subunits), plus 37 core functions with at least one such item; 120 items in 36 review files. Each now quotes the gene's own UniProt record: HAMAP rule lines, InterPro/Pfam/PROSITE/PANTHER family lines, SIMILARITY lines, and curated FUNCTION, SUBUNIT, SUBCELLULAR LOCATION and CATALYTIC ACTIVITY text with HAMAP-rule or by-similarity evidence; ADLE cites its ECO:0000269 FUNCTION text (PubMed:22392983). No references were added. Action changes: 17 generic ribosome (GO:0005840) rows KEEP_AS_NON_CORE to MODIFY, to the large or small ribosomal subunit term each review already carries, because each row's own family evidence (subunit-specific HAMAP/InterPro/PANTHER signature) identifies the subunit; this includes two IBA rows (rps12-A, rps12-B) and three unlisted rows (rps12-B IEA, rps14) brought in line for consistency. ADLE GO:0016854 racemase and epimerase activity (IBA, IEA and the unlisted IDA row) KEEP_AS_NON_CORE to TOO_GENERAL, entailed by the accepted GO:0016855. rps3 GO:0003723 RNA binding MODIFY to TOO_GENERAL, since its KH-domain InterPro2GO evidence stops at generic RNA binding and the carried rRNA binding entails it. Each edited file was backfilled with backfill-record-sections and validated.
