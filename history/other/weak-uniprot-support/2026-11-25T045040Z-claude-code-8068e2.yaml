  summary: Replace label-only UniProt support on 51 yeast, HETGA and worm rows and
    core functions
  details: |
    Yeast, HETGA (naked mole-rat) and worm pass of the weak-UniProt-support sweep, after the human (#6378), PSEPK (#6411), DROME (#6454), POPTR (#6468), MISSI (#6524) and DESRO+SACEN (#6747) passes. This record's target path names genes/yeast; the session also edits genes/HETGA and genes/worm files. Worklist: annotation rows (any action but ND) whose every supported_by item was a UniProt quote the checker flags as a label or unvetted prediction, plus core functions with at least one such item: yeast 23 items in 7 files (BAT1, BAT2, ILV3, ILV5, DCV1, JIP4, KSS1), HETGA 15 in 6 (Cd44, Hyal2, Ntrk1, Scn9a, Tac1, Trpv1), worm 13 in 11. Yeast replacements are the Swiss-Prot FUNCTION, CATALYTIC ACTIVITY and PATHWAY lines (ECO:0000269 or ECO:0000305 with PubMed), family lines and the cached papers PMID:8798704, PMID:8702755, PMID:20008079 and PMID:3027658. HETGA replacements are family lines, TRANSMEM features, the falcon deep research, naked mole-rat papers and the newly cached ortholog papers PMID:9472040 and PMID:29381137, used by similarity. Worm replacements are worm papers (PMID:15976086, PMID:16049479, PMID:26982032, PMID:17264081, PMID:19219036), mouse and human ortholog papers by similarity (PMID:25869670, PMID:39913640), RuleBase location text, TRANSMEM features and the falcon deep research; an unlisted hsp-60 mex-UPR quote that failed the substring check was replaced with a verbatim abstract sentence. Action changes: Trpv1 GO:0016020 membrane ACCEPT to TOO_GENERAL; Cd44, Ntrk1 and Scn9a GO:0016020 membrane and Scn9a GO:0055085 transmembrane transport MODIFY to TOO_GENERAL (imprecise on their own, with the accepted plasma membrane or sodium ion transmembrane transport rows entailing them); snn-1 GO:0045202 synapse ACCEPT to TOO_GENERAL (the accepted presynaptic periactive zone row is part_of synapse); tmem-138 GO:0012505 endomembrane system KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED (ARBA-only; the worm protein is at the ciliary transition zone). DCV1's core function drops the DR GO nuclear-envelope item. Each edited file was backfilled with backfill-record-sections and validated.
