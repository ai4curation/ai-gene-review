- type: EDIT
  outcome: changed
  sections:
  - review
  summary: Replace label-only UniProt support on 114 PSEPK rows and core functions
  details: |
    PSEPK (Pseudomonas putida KT2440) pass of the weak-UniProt-support sweep, after the human pass (#6378). Worklist: 79 annotation rows (any action but ND) whose every supported_by item was a UniProt quote the checker flags as a label or unvetted prediction (DE protein name, KW keyword, DR GO line, ARBA or ECO:0000313 text), plus 35 core functions with at least one such item; 114 items in 78 review files. Each now quotes support suited to its action, mostly family and domain classification from the gene's own record (InterPro, Pfam, NCBIfam, PANTHER, HAMAP, PIRSF, CDD, PROSITE), curated HAMAP, PIRNR and RuleBase FUNCTION, REACTION, SUBUNIT and SIMILARITY lines, sequence features, cached publications and deep-research files. Where nothing bears on a claim the weak item was dropped and the argument left in reason (hutF cytosol). bioH: every instance of the imported ECO:0000313 SubName 'Pimeloyl-[acp] methyl ester esterase', newly flagged by the checker fix in #6367, was replaced, including a NEW row and a reference finding. PP_2482 and PP_1969 REMOVE rows had quoted the moaA/moaC records of other genes; they now cite their own records and deep research. Action changes: KEEP_AS_NON_CORE to TOO_GENERAL where a carried term entails the row (fabB and glgB cytoplasm, folD1 and folD2 oxidoreductase activity, glgP carbohydrate metabolic process, scpC CoA-transferase activity under the accepted GO:0008775); MARK_AS_OVER_ANNOTATED to TOO_GENERAL where the row's own reason argued that a carried term entails a true claim (folD2 cytoplasm, folD1 catalytic activity, PP_1084 antioxidant and oxidoreductase activity under the KT2440-demonstrated GO:0008379, colR DNA binding under the accepted GO:0000976); hemB and hemBB porphyrin-containing compound biosynthetic process stay KEEP_AS_NON_CORE, since ALAD feeds the shared tetrapyrrole trunk and the broader GO:0033014 is accepted; hutF cytosol stays KEEP_AS_NON_CORE on the HutF family signatures; metF GO:0004489 KEEP_AS_NON_CORE to MODIFY to the carried NADH-specific child GO:0106312, on the bacterial MetF family signature and deep research. No references added. Each edited file was backfilled with backfill-record-sections and validated.
- type: EDIT
  outcome: changed
  summary: Correct the PSEPK pass record after five merges of main
  details: |
    Corrections to the first event. The hutF cytosol clause ("the weak item was dropped and the argument left in reason") is superseded: hutF cytosol cites the HutF family signatures (IPR010252, TIGR02022) beside main's IPR011059 and PF01979. Main superseded several of this pass's action changes while the PR was open, and the merges keep main's calls: folD1 and folD2 root, class and cytoplasm rows are MODIFY from the folate module (#6347), which also made the metF GO:0004489 MODIFY to GO:0106312 itself; hutF, hutH and hutI root and class rows are MODIFY from the histidine module (#6305); zwfA cytosol is ACCEPT from the pentose phosphate module (#6343); bhbP carries main's (R)-3-hydroxybutyrate reasoning from the ketone-body module (#6294). Overlapping quote replacements from #6290, #6300, #6307, #6325, #6349 and #6355 were merged by keeping main's quotes and adding this pass's family-signature quotes beside them (ivd, liuC, mccA, mvaB, davA, davD, serA, serB, fbp, pgi1, aacs, hbdH, pqqC, pqqE, metXS). This pass's remaining action changes are 7: fabB, glgB and glgP KEEP_AS_NON_CORE to TOO_GENERAL, scpC GO:0008410 KEEP_AS_NON_CORE to TOO_GENERAL, PP_1084 (two rows) and colR MARK_AS_OVER_ANNOTATED to TOO_GENERAL. The scpC GO:0016740 reason no longer calls GO:0008410 informative. The glgB cytoplasm change supersedes the 2026-09-24 TreeGrafter re-review's batch-04 record, declared there in superseded_by.
