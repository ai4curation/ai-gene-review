  summary: Replace label-only UniProt support on 114 PSEPK rows and core functions
  details: |
    PSEPK (Pseudomonas putida KT2440) pass of the weak-UniProt-support sweep, after the human pass (#6378). Worklist: 79 annotation rows (any action but ND) whose every supported_by item was a UniProt quote the checker flags as a label or unvetted prediction (DE protein name, KW keyword, DR GO line, ARBA or ECO:0000313 text), plus 35 core functions with at least one such item; 114 items in 78 review files. Each now quotes support suited to its action, mostly family and domain classification from the gene's own record (InterPro, Pfam, NCBIfam, PANTHER, HAMAP, PIRSF, CDD, PROSITE), curated HAMAP, PIRNR and RuleBase FUNCTION, REACTION, SUBUNIT and SIMILARITY lines, sequence features, cached publications and deep-research files. Where nothing bears on a claim the weak item was dropped and the argument left in reason (hutF cytosol). bioH: every instance of the imported ECO:0000313 SubName 'Pimeloyl-[acp] methyl ester esterase', newly flagged by the checker fix in #6367, was replaced, including a NEW row and a reference finding. PP_2482 and PP_1969 REMOVE rows had quoted the moaA/moaC records of other genes; they now cite their own records and deep research. Action changes: KEEP_AS_NON_CORE to TOO_GENERAL where a carried term entails the row (fabB and glgB cytoplasm, folD1 and folD2 oxidoreductase activity, glgP carbohydrate metabolic process, hemB and hemBB porphyrin-containing compound biosynthetic process); metF GO:0004489 KEEP_AS_NON_CORE to MODIFY to the carried NADH-specific child GO:0106312, on the bacterial MetF family signature and deep research. No references added. Each edited file was backfilled with backfill-record-sections and validated.
