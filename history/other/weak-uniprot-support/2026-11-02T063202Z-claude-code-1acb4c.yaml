  summary: Re-curate SCHPO rows whose only support was the UniProt protein name (part
    2 of 3, gcs2-SPAC1851.02)
  details: |
    Part 2 of 3 of the SCHPO (Schizosaccharomyces pombe) weak-UniProt-support re-curation; part 1 is #5906. 239 ACCEPT annotation rows and core functions in 42 review files cited only the UniProt DE protein name as support. Each DE quote was replaced with verbatim support: curated Swiss-Prot text (CC FUNCTION, CATALYTIC ACTIVITY, PATHWAY, SUBCELLULAR LOCATION and SUBUNIT, with ECO:0000269 PubMed or ECO:0000250 by-similarity evidence), cached publications (for example PMID:35008733 for lac1 and lag1, PMID:20388730 for imt1 and SPAC17G8.11c, PMID:7903653 for idh1 and idh2), HAMAP, NCBIfam, InterPro, Pfam and PANTHER classification, and sequence features. Each rewritten reason says whose evidence it is. Deep-research quotes count as support like a review article (user decision) and were kept. Action changes: MODIFY to a more specific term the gene already carries for SPAC17A5.13 GO:0009396 (to GO:0046654 and GO:0046656), SPAC17H9.13c and pyr1 cytoplasm (to cytosol GO:0005829), imt1 GO:0006673 and GO:0006688 (to GO:0051999), rki1 GO:0006098 (to GO:0009052), snz1 GO:0008615 (lateral, to GO:0042823 PLP biosynthesis, since the enzyme makes PLP directly), and ntp1 GO:0005991 on its IDA and IEA rows (to GO:0005993 trehalose catabolic process, for consistency). SPAC1486.06 cytosol IBA stays ACCEPT, now supported by NAPRTase family membership with the PAINT node argument in its reason (an earlier draft had UNDECIDED; review pointed out the IBA policy). Also fixed the scs7 description, which called the protein a cytochrome b5-domain enzyme although UniProt notes that it lacks that domain. Every core function in these files that still carried a DE quote had it replaced with the verbatim quotes already used on the gene's own annotation rows for the same molecular function, location and process. Each edited file was backfilled with backfill-record-sections and validated.
