  summary: Re-curate SCHPO non-ACCEPT rows whose only support was the UniProt protein
    name (part 2 of 2)
  details: |
    Part 2 of 2 of the SCHPO non-ACCEPT pass; part 1 is #6030. 146 KEEP_AS_NON_CORE, MODIFY, TOO_GENERAL and MARK_AS_OVER_ANNOTATED rows in 56 review files (cit1 to utr4, ASCII order) cited only the UniProt DE protein name. Each now quotes verbatim support suited to its action, from curated Swiss-Prot text, family and domain lines, sequence features and cached publications. References added, each cited as ortholog or pathway evidence: PMID:25686363 (oar2), PMID:22152483 and PMID:14597775 (sdh3, kgd1; S. cerevisiae), PMID:25165143 (kgd4), PMID:9368039 (scs7). Action changes: KEEP_AS_NON_CORE to MODIFY where the term was correct but general (fol3 GO:0009396 on its IBA and IEA rows to GO:0006761; hpt1 GO:0009168 and GO:0106380 to IMP, GMP and XMP salvage; mdh1 cytoplasm to mitochondrial matrix; plh1 cytoplasm to its three ER locations; ntp1 GO:0015927 to GO:0004555; rib1 GO:0019238 to GO:0003935; lcb1 and lcb2 membrane to ER membrane); KEEP_AS_NON_CORE to TOO_GENERAL where a carried term entails the row (coq6 GO:0050660, lcb1 cytoplasm on both rows, lcb2 cytoplasm, snz1 GO:0016843); KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED where the evidence argues against the term (kgd4 mitochondrial inner membrane, transferred from a bovine source whose only support is Reactome mitoribosome entries; urk1 pyrimidine nucleobase metabolic process, since its curated substrates are nucleosides; utr4 cellular detoxification). Every KEEP_AS_NON_CORE row was checked against the is_a/part_of closure of the gene's carried terms. After review, the sweep was widened: the repo's UniProt quote checker cannot locate DE quotes containing square brackets (for example 'Succinate dehydrogenase [ubiquinone] ...') or truncated mid-word, so it never flagged them and earlier worklists missed them. A text scan for RecName/AltName/SubName quotes found 127 such rows and core functions in 12 further SCHPO files (sdh1, sdh2, sdh4, kgd2, lat1, gpt2, bst1, SPCC1620.08, SPAC16E8.17c, SPAC22F8.05, SPAC2E11.16c, SPAC8E11.10), including ACCEPT rows; all were re-supported in this PR. Review fixes in the same round: plh1 re-quoted with PMID:26990381's direct ER localisation sentence; coq6 GO:0016712 (wrong donor class) and oar2 obsolete GO:0009107 (precursor supplier, not a participant) marked over-annotated; dsd1 membrane rows refined to ER membrane; fol3 GO:0009396 now lists both supported descendants; source_defects recorded for the SGD SCS7 GO:0102772 annotation and the Reactome-derived inner-membrane location of bovine KGD4. The SPAC22F8.05 and SPAC2E11.16c descriptions had an unfilled template placeholder, now replaced with the gene ids. propagation_review blocks were added on IBA and ISO rows whose action changed. Each edited file was backfilled with backfill-record-sections and validated.
