  summary: Replace label-only UniProt support on 75 long-tail rows and core functions
    in 32 organisms
  details: |
    Final long-tail pass of the weak-UniProt-support sweep, after the human (#6378), PSEPK (#6411), DROME (#6454), POPTR (#6468), MISSI (#6524), DESRO+SACEN (#6747) and yeast+HETGA+worm (#6946) passes. This record's target path names genes/ECOLI; the session edits 56 review files across 32 organisms (NICAT, BACSU, FELCA, SALRS, ECOLI, ARATH, 9ARCH, VIBCH, METEA, LAMBD, mouse, RHOPA, POLH7, MONBE, DESVH, BRADI, STAWA, STAHA, STAAT, SPHSM, ONCVO, NEUCR, MYCSM, METS5, DOROP, CANGA, CAEBR, BPT7, BPPHS, AILME, 9POAL, 9AVES). Worklist: annotation rows (any action but ND) whose every supported_by item was a UniProt quote the checker flags as a label or unvetted prediction, plus core functions with at least one such item: 75 items. Replacements are curated Swiss-Prot FUNCTION, CATALYTIC ACTIVITY, SUBUNIT and SUBCELLULAR LOCATION lines with PubMed, HAMAP or RuleBase evidence, family lines, sequence features, deep research and cached papers, eight of them newly cached (PMID:21343426, 24287136, 16665687, 39214468, 8168129, 10648537, 8419299, 21576986). Action changes: ureC1 and ureC2 hydrolase activity and GO:0016810 (ureC2's unlisted for consistency), nirK2 and POLH7 AJ80_06654 oxidoreductase activity, cds1 lyase activity, and mrdA carboxypeptidase, peptidase and hydrolase activity to TOO_GENERAL (each entailed by an accepted specific activity, checked with runoak); NaODC_candidate_DCOR and NaODC_candidate_ODC chloroplast KEEP_AS_NON_CORE to UNDECIDED (ARBA-only, no transit peptide, ortholog ODCs localise to the ER). An unlisted CRY1 supporting_text that was editorial commentary, not a quote, was moved into the reason. NCGR_LOCUS10166 cytoplasm additionally cites the chloroplastic HDH FunFam line. Each edited file was backfilled with backfill-record-sections and validated.
