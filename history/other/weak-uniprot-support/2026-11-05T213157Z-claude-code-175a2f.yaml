  summary: Re-curate SCHPO non-ACCEPT rows whose only support was the UniProt protein
    name (part 1 of 2)
  details: |
    Follow-up to the SCHPO ACCEPT-row sweep (#5906, #5907, #5908), covering rows whose action is not ACCEPT. 140 KEEP_AS_NON_CORE, MODIFY, TOO_GENERAL and MARK_AS_OVER_ANNOTATED rows in 55 review files (SPAC1093.02 to ayr1, ASCII order) cited only the UniProt DE protein name, or in two cases a keyword line. Each now quotes verbatim support suited to its action: evidence that a KEEP_AS_NON_CORE term is true, support for a MODIFY replacement, the support of the more specific term that entails a TOO_GENERAL row, and evidence for why a MARK_AS_OVER_ANNOTATED term over-reaches. Sources are curated Swiss-Prot text (FUNCTION, CATALYTIC ACTIVITY, PATHWAY, SUBCELLULAR LOCATION, COFACTOR, SIMILARITY), family and domain lines, sequence features and cached publications. Three references were added, each cited as ortholog evidence: PMID:17890783 (S. cerevisiae Lpt1, for ale1), PMID:19240034 (human E3BP, for SPCC1259.09c) and PMID:22204397 (S. cerevisiae Pof1, for SPAC694.03). Action changes: KEEP_AS_NON_CORE to MODIFY where the term was correct but general (alg9 GO:0000026 to GO:0052926 and GO:0052918; SPAC17G8.11c and SPCC4F11.04c GO:0000030 to GO:0103064; alg2 GO:0033164 to GO:0102704; SPAC1093.02 GO:0008615 laterally to GO:0042823); KEEP_AS_NON_CORE to TOO_GENERAL where a carried descendant entails the term (alg2 GO:0009101 and GO:0012505, SPAC1093.02 GO:0042816); KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED where the evidence argues against the term (SPAC24C9.06c cytosol, SPAC222.08c pyridoxine metabolic process, SPCC1259.09c acyltransferase activity, SPAC1805.16c nicotinamide riboside hydrolase activity). propagation_review blocks were added on the IBA and ISO rows whose action changed. After review, every KEEP_AS_NON_CORE row was checked against the is_a/part_of closure of the gene's carried terms (oaklib): alg1 GO:0009101, SPBC12C2.07c GO:0006596 and ayr1 cytoplasm became TOO_GENERAL because a carried descendant entails them, and SPAC694.03 GO:0016887 ATP hydrolysis became MARK_AS_OVER_ANNOTATED as in vitro activity of unknown relevance. Each edited file was backfilled with backfill-record-sections and validated.
