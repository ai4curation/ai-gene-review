  summary: Replace label-only UniProt support on 65 MISSI rows and core functions
  details: |
    MISSI (Miscanthus sinensis) pass of the weak-UniProt-support sweep, after the human (#6378), DROME (#6454), POPTR (#6468) and PSEPK (#6411) passes. Worklist: 18 annotation rows (any action but ND) whose every supported_by item was a UniProt quote the checker flags as a label or unvetted prediction, plus 47 core functions with at least one such item; 65 items in 47 review files, most of them stub reviews of plastid-encoded ribosomal, photosystem, ATP synthase and NDH subunits with no deep research. In these records most curated CC lines rest on ARBA alone, so the replacements are mainly the gene's own HAMAP, InterPro, Pfam, PROSITE, NCBIfam, PANTHER, CDD and FunFam lines, RuleBase or HAMAP-backed SIMILARITY, FUNCTION, CATALYTIC ACTIVITY, COFACTOR and SUBCELLULAR LOCATION text, and sequence features (TRANSMEM, BINDING, DOMAIN); MnSOD cites PMID:26334392 (the Miscanthus x giganteus homeolog) and COMT cites the newly cached PMID:23160900 (an M. sinensis COMT antisense construct phenotyped in tobacco), both by similarity. Where no acceptable quote supports a location or process a core function names, the flagged item was dropped and the term left unchanged (for example Adh1 cytosol, rps15 chloroplast, PhyB transcription regulation, several plastid locations); the Proteomes 'Plastid I' genome-component line was not used as location support. Action changes: APQ GO:0016020 membrane and LHS1 GO:0003677 DNA binding MARK_AS_OVER_ANNOTATED to TOO_GENERAL, entailed by the accepted plasma membrane and DNA-binding transcription factor rows; MnSOD GO:0005739 mitochondrion KEEP_AS_NON_CORE to ACCEPT under the root-organelle policy; MnSOD GO:0006801 superoxide metabolic process KEEP_AS_NON_CORE to MODIFY to the carried is_a child GO:0019430 removal of superoxide radicals, on the Mn/Fe SOD family and RuleBase reaction. Each edited file was backfilled with backfill-record-sections and validated.
