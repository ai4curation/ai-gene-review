  summary: Replace label-only UniProt support on 68 DESRO and SACEN rows and core
    functions
  details: |
    DESRO (Desmodus rotundus) and SACEN (Saccharopolyspora erythraea) pass of the weak-UniProt-support sweep, after the human (#6378), PSEPK (#6411), DROME (#6454), POPTR (#6468) and MISSI (#6524) passes. Worklist: annotation rows (any action but ND) whose every supported_by item was a UniProt quote the checker flags as a label or unvetted prediction, plus core functions with at least one such item: 43 DESRO items in 10 files and 25 SACEN items in 14 files. DESRO entries are unreviewed salivary/venom-gland proteins whose SUBCELLULAR LOCATION and SIMILARITY lines rest on ARBA alone; replacements are the gene's own signal-peptide and TRANSMEM features, InterPro/Pfam/PANTHER/PIRSF lines, the deep-research files, and human-ortholog papers used by similarity (PMID:11141064, PMID:23486063, PMID:17287217, and the newly cached PMID:17416904, PMID:16651416, PMID:11278278). SACEN replacements are family lines and the erythromycin-cluster papers PMID:38501175, PMID:17630700 and PMID:9563840 (abstract-only; ORF-to-gene mapping from the abstract). Action changes: K9IFT7 GO:0006952 defense response ACCEPT to TOO_GENERAL (entailed by the accepted antibacterial defense rows); K9IWH5 catalytic and hydrolase activity, K9J287 catalytic and hydrolase activity, and K9J2R0 hydrolase activity MODIFY to TOO_GENERAL (keyword or InterPro2GO rows whose evidence stops at the generic term, under the 2026-11-14 ruling); K9IZA2 GO:0030414 peptidase inhibitor activity MODIFY to TOO_GENERAL; K9IZA2 GO:0005737 cytoplasm ACCEPT to MARK_AS_OVER_ANNOTATED (ARBA-only; signal peptide and TM segment indicate a type I membrane protein); K9J287 GO:0005783 endoplasmic reticulum ACCEPT to MARK_AS_OVER_ANNOTATED (ARBA-only; the human ortholog DNase X is a GPI-anchored cell-surface protein, PMID:17416904), with the core-function location moved to GO:0005886 and the description updated; K9J2R0 proteolysis and serine-type peptidase activity MODIFY to KEEP_AS_NON_CORE (the first proposed an MF term for a BP row, the second a non-descendant); K9J2R0 lamellipodium membrane ACCEPT to KEEP_AS_NON_CORE (the ortholog abstract says pseudopodia); eryBVI GO:0016829 lyase activity ACCEPT to MODIFY to GO:0016836 hydro-lyase activity on the EvaA-like hexose 2,3-dehydratase family, with the core-function MF changed to match. Each edited file was backfilled with backfill-record-sections and validated.
- type: EDIT
  outcome: changed
  sections:
  - review
  summary: Address PR review of the DESRO pass (TOO_GENERAL criterion, K9IZA2, K9J2R0, K9J287)
  details: |
    Follow-up after review. The TOO_GENERAL reasons on K9IWH5 catalytic and hydrolase activity, K9J287 catalytic and hydrolase activity and K9J2R0 hydrolase activity are restated in terms of the term being imprecise on its own, not GO_REF provenance, since sibling keyword rows on respectably specific terms (glycosyl-bond hydrolase, endonuclease, peptidase) keep MODIFY on family signatures; the K9J287 catalytic row names its InterPro2GO source (IPR005135). K9IZA2 GO:0030414 peptidase inhibitor activity goes back to MODIFY to GO:0004867 on the Pfam Kunitz and PANTHER HAI-2 lines; the K9IZA2 GO:0004867 and GO:0005886 rows now cite those family lines and the SignalP/Phobius features instead of the DE name and the ARBA cell-membrane line; the K9IWH5 glycosyl-bond MODIFY no longer cites the ARBA catalytic-activity line. K9J2R0 GO:0042995 cell projection goes from MODIFY (to lamellipodium membrane) to KEEP_AS_NON_CORE, since the ortholog evidence supports a projection but not a lamellipodium. The K9J287 core function no longer asserts a location (the entry is a fragment and no row carries plasma membrane). This record's target path names genes/DESRO, but the session also edits 14 genes/SACEN files.
