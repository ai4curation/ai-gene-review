  summary: Drop label and unvetted UniProt quotes from PSEPK rows that keep other
    support
  details: |
    A UniProt quote that is a label (protein name or EC line DE, keyword KW, the record's own DR GO cross-reference, other identifier fields), the protein-existence line, or a statement whose only evidence is an unvetted prediction (ARBA, ECO:0000313, ECO:0008006, IEA) restates an annotation rather than supporting it (CLAUDE.md, 'Quote UniProt for evidence'). Where such a quote supported an ACCEPT annotation row that also has other real support, this removes only that supported_by item; actions, terms and all other text are unchanged. Flagging uses the validator's own classify_quote, so only quotes the validator warns on are removed. Other real support means a kept item that is not a UniProt record (a publication, Reactome, an analysis file) or a UniProt quote the classifier locates and does not flag; an unlocatable UniProt quote does not count, a subcellular-location statement counts only for a cellular-component term, a quote from another gene's UniProt record does not count, and neither does a quote from an AI-generated deep-research file a cached pathway-definition file (such as GapMind steps), a gene notes file, or a citation without a quote. Each file is rewritten by deleting the item's lines, never adjacent comment or blank lines, and only if the result loads to exactly the original data minus those items. Left untouched for manual re-curation: NEW rows (they carry the highest bar), core functions (a core function bundles several claims, so one quote may be the only support for its location or cofactor), rows whose summary or reason discusses the record itself (UniProt, IEA, keywords, EC numbers or EC-derived terms, names, existence, the record), rows without other real support, items carrying a YAML anchor, and rows whose remaining support a hand audit of every changed row judged not to address the row's term. PSEPK batch: 13 supported_by items removed from 11 review files (39 lines).
