  summary: Re-curate SCHPO rows whose only support was the UniProt protein name (part
    3 of 3, SPAC19G12.04-utr4)
  details: |
    Part 3 of 3 of the SCHPO (Schizosaccharomyces pombe) weak-UniProt-support re-curation; parts 1 and 2 are #5906 and #5907. 232 ACCEPT annotation rows and core functions in 48 review files cited only the UniProt DE protein name as support. Each DE quote was replaced with verbatim support: curated Swiss-Prot text (CC FUNCTION, CATALYTIC ACTIVITY, PATHWAY, SUBCELLULAR LOCATION and SUBUNIT, with ECO:0000269 PubMed or ECO:0000250 by-similarity evidence), cached publications (for example PMID:11004189 and PMID:12153582 for tpp1, PMID:8021171 for tps1, PMID:24177583 for the urate and allantoin genes, PMID:20388730 for SPCC4F11.04c), HAMAP, NCBIfam, InterPro, Pfam and PANTHER classification, and sequence features. One reference was added: PMID:17873082 (S. cerevisiae Abz2, cited as ortholog evidence for SPBC19G7.02). Each rewritten reason says whose evidence it is. Every core function in these files that carried a DE quote now cites the same curated quotes as its annotation rows. Deep-research quotes count as support like a review article (user decision) and were kept. Action changes, all MODIFY to a more specific term the gene already carries, applied to every row sharing the term: the general pentose-phosphate shunt GO:0006098 to the oxidative branch GO:0009051 (SPBC660.16 IDA and IEA rows, SPCC16C4.10) or the non-oxidative branch GO:0009052 (SPBC2G5.05 IBA and IEA, SPAC31G5.05c, tal1); SPAC694.03 GO:0009435 to NAD salvage GO:0034355; SPAC222.08c GO:0042823 to de novo PLP biosynthesis GO:0036001 on its IBA and IEA rows, with the core function process updated to match. The SPCC1450.15 description had its domain order reversed (the reductase is N-terminal, the PIGF domain C-terminal) and was corrected. Each edited file was backfilled with backfill-record-sections and validated.
