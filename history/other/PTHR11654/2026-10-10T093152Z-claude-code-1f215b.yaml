  details: |
    Revision after PR review. GO:0080054 low-affinity nitrate transmembrane transporter activity rescoped from UNRESOLVED to SUBFAMILY_ONLY over the seven single-member subfamilies whose Arabidopsis member has IDA (NPF1.1, 1.2, 2.12, 2.13, 5.11, 5.12, 5.16); the ARBA00084141 count of assayed group members corrected to four. Added node assessments for the two plant CC PAINT nodes: PTN000910018 plasma membrane (SOUND; reaches only NPF1-NPF3 in Arabidopsis) and PTN001703971 plant-type vacuole membrane (SOUND; reaches only NPF8.3-8.5). The survey script now keeps CC GOA rows and computes the global InterPro2GO/ARBA counts from QuickGO (global_electronic_counts.tsv); outputs were regenerated by rerunning it. Truncated supporting_text quotes extended to full sentences; Table 1 rows of PMID:41276884 cited for the nitrate subfamily list; the six previously uncited references now support specific claims. Added the MF/BP rationale at PTN000183463 and a note on the SF509/SF80 naming. Validated with linkml-validate FamilyReview, linkml-term-validator, family_residue_validator, family_gene_crosscheck and the repo supporting-text validator.
