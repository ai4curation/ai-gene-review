  summary: New family review of PTHR11654 (POT/PTR; plant NRT1/PTR FAMILY, NPF)
  details: |
    Created a family review for PANTHER PTHR11654 (OLIGOPEPTIDE TRANSPORTER-RELATED), which holds all 53 Arabidopsis NPF proteins together with SLC15, PTR2 and Dtp peptide transporters. The trigger was Morales de los Rios et al. 2026 (PMID:41276884). Membership comes from the UniProt PANTHER cross-reference. Subfamily ids come from the PANTHER 19 geneinfo API, with names verbatim from panther.obo.
    Findings: (1) PAINT IBA is conservative. The root node (PTN008522918) asserts only transmembrane transporter activity, transmembrane transport and membrane, which are safe family-wide. Substrate terms are confined to NPF8 (PTN001703849 di/tripeptide, SOUND), the NPF6.3 ortholog group (PTN000183463 nitrate, SOUND; response to nitrate UNRESOLVED because the NPF6.4 paralog inherits it), and the NPF5.2 group (PTN001703614 tripeptide, UNRESOLVED because NPF5.3 was negative in a yeast dipeptide screen). The eukaryote dipeptide node PTN000910039 excludes angiosperm NPFs and reaches only bryophyte and charophyte NPFs (UNRESOLVED).
    (2) The over-annotation comes from InterPro2GO. IPR044739 (an NPF5 CDD model) maps dipeptide and tripeptide transporter terms to every NPF5 (about 4,180 annotations per term), but Leran et al. 2015 found no Leu-Leu uptake for 12 NPF5 members. IPR018456 maps oligopeptide transport to about 9,670 plant proteins, including nitrate and hormone transporters. Both mappings are scoped SUBFAMILY_ONLY to the peptide-transporter subfamilies.
    (3) Nitrate transmembrane transporter activity is scoped SUBFAMILY_ONLY to single-member subfamilies with direct evidence. Low-affinity nitrate (ARBA00084141), ABA, GA and response to nitrate are UNRESOLVED. Glucosinolate:H+ symport is scoped to the GTR1-3 subfamilies.
    Added the residue site tm1_exxer_motif (NPF6.3 E41/E44/R45, CONTRIBUTES to solute:proton symporter activity). A reproducible survey script and its outputs (Arabidopsis members, GOA snapshot, ExxE[R/K] alignment) are in PTHR11654-bioinformatics/. Review status is NEEDS_REVIEW.
