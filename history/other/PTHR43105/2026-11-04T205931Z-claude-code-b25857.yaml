- type: EDIT
  outcome: changed
  summary: Re-scope SF9 donor-specific nitrate reductase terms and fix denitrification
    attribution
  details: |
    PR #5928 review round 3. GO:0047889 and GO:0050464 were SUBFAMILY_ONLY on SF9, which asserted them for all six Swiss-Prot SF9 members (counted with a CSV parser). They are now UNRESOLVED (per member), because SF9 mixes ferredoxin, NADH and NADPH donors and holds the Geobacter SfrA Fe(3+) reductases (Q74FU6, D7AF63), which lack the Mo cofactor. Per-member status is stated in each scope_reason, with quotes from cached UniProt records and literature, and PMID:28520412 is now cited. The SF9 description and divergence text now list all members. The GO:0019333 scope_reason attributes the propagation to UniPathway2GO (GO_REF:0000041, UPA00652) rather than an InterPro signature, and no longer reads as if SF10 were assimilatory.
