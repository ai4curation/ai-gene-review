  summary: 'Family review: PTHR43552'
  details: |
    Created the family review for PTHR43552 (diaminobutyrate--2-oxoglutarate aminotransferases) so the
    pyoverdine precursor-supply module can ground its diaminobutyrate step on the PANTHER family that
    the maintainer module-grounding branch (PR 5076) assigned. Reference protein is PAO1 PvdH (Q9I168),
    reviewed in the same change. Both subfamilies are described: SF1 (Dat/PvdH/RhbA, siderophore and
    other L-2,4-diaminobutyrate-dependent pathways) and SF2 (EctB, ectoine biosynthesis). Coherence is
    MOSTLY_COHERENT because every characterized member of both branches performs the same EC 2.6.1.76
    transamination and only the consuming pathway differs; the single reviewed member without
    characterized activity is P55628 (y4qG), covered by inference from membership alone. GO:0045303 is
    therefore scoped FAMILY_WIDE and GO:0030170 PLP binding likewise, and the PAINT node PTN002461253
    is assessed SOUND -- it is seeded by Q9I168 itself, so the assertion has experimental grounding on
    an extant member and is not circular; its weakness is granularity, which is why the gene review
    modifies the broad term rather than disputing the node. Notes record that family membership does not
    by itself say a member serves pyoverdine; that comes from the pyoverdine locus context.
