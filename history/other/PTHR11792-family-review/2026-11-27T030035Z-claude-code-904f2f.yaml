  summary: Family review of PTHR11792 for the dismech vision-disorder alignment
  details: |
    First family review of the arrestin family, written for projects/DISMECH_VISION_ALIGNMENT after the SAG gene review. Coherence MOSTLY_COHERENT. Receptor binding and cytoplasm are family-wide; opsin binding and photoreceptor segment locations are scoped to the visual arrestins; G protein-coupled receptor internalization to the beta-arrestins and Drosophila kurtz. The internalization node PTN001370087 NEEDS_PRUNING for the two visual arrestin clades, which lack the clathrin and AP-2 binding motifs; this agrees with the SAG review marking that IBA row as over-annotated. The IRD at PTN002623649 that blocks cytoplasm for the S-arrestin clade is judged LOSS_CONTRADICTED, since rod arrestin is a soluble cytoplasmic protein. Validated with the family schema, term, reference and quote checks; no cross-check conflict.
