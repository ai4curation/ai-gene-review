  summary: Add a positive-control requirement to the comparator check
  details: |
    Adds to CLAUDE.md, and to the annotation-reviewer and aigr-pr-review skills, a requirement that was missing from the comparator check: before trusting a negative result, confirm the query can return a positive at all.

    Why. The comparator check exists to stop a NEW annotation being proposed on the reasoning that every other pathway member carries a term. Its asymmetry had not been written down. A positive result is cheap to read and licenses only a weak conclusion. A negative result is what licenses the strong conclusion - do not propose - so it carries the argument, and it is also the result a broken query produces by default.

    This failed in practice in this repository, which is the example now recorded. A GZMB review declined to propose GO:0042742 defense response to bacterium on the reported grounds that none of GZMB, GZMA, GNLY or PRF1 carries any bacterial-defense term. The query asked QuickGO for each gene's biological-process annotations and filtered on the term-name field, which that call shape returns empty, so the filter matched nothing whatever the data held. It returned 200 results and raised no error. The only symptom was an unusually clean negative across all four genes. Re-run by term id, GNLY carries GO:0042742 by IDA together with GO:0031640 and GO:0061844, and GSDMB carries it by IBA. The correction is in history/genes/human/GZMB/2026-11-14T203751Z-claude-code-e45ecf.yaml.

    Two framings added alongside the mechanical rule, at the user's prompting that the check is useful as a guide rather than as gospel. First, that a result too tidy to be curation usually is not curation - the suspicious signal is the cleanliness of the negative, not its content. Second, that a positive result does not compel the annotation either: comparators establish whether a convention exists, never that the gene does any of the work, so the participation test still governs. That second point guards the opposite error from the one that prompted this, which is treating a favourable comparator result as sufficient.

    Scope: guidance only. No validator, gate or recipe changes, and no existing review was altered by this change - the GZMB correction it cites was made separately and is already merged.
