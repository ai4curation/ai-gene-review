- type: EDIT
  outcome: changed
  summary: Say what to do when the mapped set is empty, and bound the check
  details: |
    PR #6750 review round 2. The mapped-set rule added earlier in this PR said the record is exactly the cited signatures that carry the faulted term, and said nothing about the case where that set is empty - which it is for 3 of the corpus's 200 INTERPRO records, the GOC-derived and refined rows. Followed literally the rule would leave record: blank there, which is the problem the rule exists to prevent, and my own implementation had quietly used a different fallback without documenting it. Now stated: record the signature whose mapping produced the upstream row, and name that row in the explanation. RHOCA/fruA and AZOBR/fruA1 are given as the worked case, verified in their GOA files - GO:1902600 from GO_REF:0000108 derived from GO:0005351, whose row cites InterPro:IPR006327.

    Two limits added at the reviewer's suggestion. The mapping file is a committed snapshot (its !version date is 2025/09/01), so a signature added upstream since will not appear. And the mapped set finds candidates rather than deciding them: where a cited signature covers a shared structural domain rather than the activity, asking for its mapping to change over-reaches. That is why the 6 pre-existing under-named records are left as a per-record judgement rather than widened mechanically - 9EURY/mcrA's seven include sub-domain entries such as IPR009024, the ferredoxin-like fold.
