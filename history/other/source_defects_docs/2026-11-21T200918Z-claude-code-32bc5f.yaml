- type: EDIT
  outcome: changed
  summary: Document the InterPro record form; drop worked examples the corpus outgrew
  details: |
    Batch 4. Added the `record:` convention for INTERPRO defects: the signature as `InterPro:IPR006108`, several joined with `|` as GOA writes WITH/FROM, ids taken from the faulted term's GOA row intersected with those the explanation names - the intersection being what keeps a signature the explanation names only to ask for its EXCLUSION from becoming the record.

    Also removed a passage that had gone stale. It was pinned to commit 485113c854 and cited ECOLI/pssA, PSEPK/pssA, RHOCA/fruA and AZOBR/fruA1 as defects filed GOA_EBI naming no mapping in record:. All of them are now filed INTERPRO and carry one, so the examples were deleted rather than re-pinned; the rule they illustrated stands without them. This is the second instance in two batches of prose describing corpus state outliving the state - the first was seven defect explanations in #6518 - and the lesson is the same: a passage that describes the corpus goes stale the moment the corpus moves.
