  summary: Specify the mapped-set rule for InterPro records
  details: |
    PR #6750 review round 1. The paragraph added earlier in this PR described only the intersection of the explanation's ids with the row's WITH/FROM, which guards against over-naming but not under-naming. Replaced with the mechanical rule: of the signatures the faulted term's row cites, exactly those that carry that GO term in the committed rules/arba/_interpro2go.txt. That subsumes both directions - an exclusion signature is not mapped to the faulted term so it falls out, and a sibling signature the prose did not mention is caught. ECOLI/garK and rat/Kcnj16 are given as the worked cases for the two directions.
