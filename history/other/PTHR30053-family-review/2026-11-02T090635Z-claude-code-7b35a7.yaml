  summary: Review PTHR30053, the bacterial EF-P/EfpL family
  details: |
    New family review for the EF-P family, written because the efp_translation_stall_rescue module grounds its EF-P roles here. Both PTN000769376 IBD rows (GO:0003746 and GO:0005737, seeded by E. coli EF-P and its paralog EfpL) are assessed SOUND: the node spans both paralogous subfamilies, which is consistent with its seeds. Translation elongation factor activity and ribosome binding are scoped FAMILY_WIDE; polyproline stall rescue is restricted to SF12, because EfpL overlaps only partially with EF-P and its motif spectrum is narrower. Reference protein E. coli P0A6N4. SF15 has no reviewed members in the local inventory and is not assessed. The activating modification is noted as lineage-specific and therefore not a family-wide claim.
