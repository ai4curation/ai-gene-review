  summary: 'Complete family biological assessment: PTHR11012'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. The insect EcKL phylogeny identifies at least 13 subfamilies and places the two experimentally characterized ecdysteroid kinases in different subfamilies (PMID:38291829). Most members lack a known substrate; expression and comparative-genomic associations with xenobiotic metabolism are hypotheses rather than phosphorylation assays (PMID:32540344). CG31099 and CG6830 share SF6, but this does not establish conservation of an ecdysteroid substrate or its 22-hydroxyl acceptor. Small-molecule kinase chemistry is the supported family-level hypothesis, while the distribution of steroid specificity remains unresolved. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
