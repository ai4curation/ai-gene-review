  summary: 'Family review: PTHR36701 review follow-ups'
  details: |
    PR review follow-ups. The GO:0051539 scope reason no longer cites UniProt's ligand mapping as corroboration, since the Thermotoga structure shows that mapping is wrong; it now names the structure's own motifs and points at the member gene reviews' source defects. The Helicobacter pylori Hp0100 transamidosome note is now cited: PMID:23258533 was located by PubMed search, fetched into the publications cache, and checked to confirm it identifies Hp0100 in a stable tRNA-independent Asn-transamidosome that enhances AdT turnover about 35-fold. FamilyReview references carry no supporting_text slot, so the verbatim quote for that claim cannot be stored in the file; this is stated in the note itself.
