- type: EDIT
  outcome: changed
  summary: 'PTHR42737: except trypanothione reductase from the GO:0004362 subfamily
    scope'
  details: |
    The GO:0004362 term assessment scopes glutathione-disulfide reductase activity to SF2, SF5 and SF9. PANTHER places T. brucei trypanothione reductase (P39051) in SF2 on fold and sequence, but TryR and GR are sister enzymes with mutually exclusive disulfide specificity: the purified enzyme strongly prefers trypanothione disulfide over glutathione disulphide (PMID:19747949), and kinetoplastids have no glutathione reductase. Added P39051 as a member exception, which is also what the family/gene cross-check needs now that the new TRYBB TPR review removes that term; TryR's own activity, GO:0015042, is annotated separately.
