  summary: 'PTHR42737: except trypanothione reductase from the GO:0006749 scope too'
  details: |
    Follow-up to the GO:0004362 exception. The GO:0006749 glutathione metabolic process assessment is scoped SUBFAMILY_ONLY over the same SF2, so it also covers P39051, while the TRYBB TPR review replaces that term with GO:0046206 trypanothione metabolic process. QuickGO gives GO:0046206's ancestors as GO:0006790, GO:0008152 and GO:0009987, so it is not a descendant of GO:0006749 and the replacement is a lateral correction rather than a refinement: the two files disagreed. The cross-check did not report it because MODIFY is in neither RETAINING_ACTIONS nor SOFT_DISAGREEING_ACTIONS. Added the matching member exception, and added the PMID:10672177 quote for the 'kinetoplastids have no glutathione reductase' limb to both exceptions, which was previously the one uncited claim.
