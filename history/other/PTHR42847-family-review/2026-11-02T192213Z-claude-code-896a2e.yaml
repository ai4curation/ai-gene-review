  summary: Ground the TOO_DEEP reason in committed data only
  details: |
    Review response on PR #5917. The PTN000768559 TOO_DEEP reasons named three fungal descendants (SS1G_04086, SNOG_00264, NCU10015) that were read from an uncommitted PAINT GAF in the local cache and cannot be traced from any file in the repository, while the PAINT row's own taxon is taxon:2 (Bacteria). Both reasons now lead with the case that committed data do support: E. coli RutA (P75898), which PTHR42847-entries.csv places in the same subfamily as SsuD and which PMID:20369853 and PMID:16540542 show opens the uracil ring in the Rut pathway rather than desulfonating anything. The MsuD boundary case is kept and stated as not weakening the row, since methanesulfonate is itself an alkanesulfonate. The fungal clause is replaced by a hedged sentence about eukaryotic members whose relation to the node could not be resolved from committed data, explicitly not used as an argument. Added the entries.csv row for RutA as supporting text. The TOO_DEEP verdicts and the decision not to adopt PR #5076's ancestral-node assertion are unchanged.
