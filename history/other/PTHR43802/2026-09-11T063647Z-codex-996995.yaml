  summary: 'Complete family biological assessment: PTHR43802'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. This crotonase-fold grouping spans annotated enoyl-CoA hydratases and experimentally characterized carbon-carbon bond-cleaving enzymes. The actual SF1 inventory contains Rhodococcus Q93TU6, whose 6-oxocamphor hydrolase catalyzes a retro-Claisen ring-opening reaction demonstrated by product structures and mutagenesis (PMID:15138275). SF1 membership therefore does not identify an enoyl-CoA hydration reaction. Fly CG5611 retains a fold-based catalytic hypothesis, but its substrate and reaction cannot be resolved from this heterogeneous subfamily. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
