  details: |
    Re-read of the node assessments that dispute a PAINT placement against the PANTHER 19.0 tree (PTHR11670-tree-nodes.yaml, from `just phylo-family PTHR11670`). An agent read each assessment next to the listing's facts for the same node and term; a second agent checked each reading. Assessments are unchanged.

    - PANTHER:PTN000186700 GO:0003994 (NEEDS_PRUNING): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PTN000186700 is the family root at LUCA with 244 leaves, and the 17 seeds sit in both branches below it. Shewanella AcnD is one of them, in SF43, 6 steps below the root, so the clade to be pruned holds a seed and the loss rests on the substrate evidence.
    - PANTHER:PTN000186700 GO:0030350 (TOO_DEEP): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree PTN000186700 is the family root at LUCA with 244 leaves, and the nine seeds sit in both branches below it, among them Mycobacterium tuberculosis Acn in SF54. The root is therefore the seeds' common ancestor, and moving the term down rests on the scope of the term.
    - PANTHER:PTN000186788 GO:0006099 (NEEDS_PRUNING): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree PTN000186788 is a speciation node at Eubacteria with 22 leaves in 2 subfamilies, SF54 and the 2-methylcitrate dehydratase subfamily SF43. The single seed, Salmonella AcnA in SF54, is a leaf 5 steps below the node, so SF43 receives the term by descent alone.

    Each row now quotes the family's node listing in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
