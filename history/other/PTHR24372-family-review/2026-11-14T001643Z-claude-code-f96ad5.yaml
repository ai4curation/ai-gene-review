  summary: Family review PTHR24372
  details: |
    Created the PANTHER family review for PTHR24372 (GLYCOPROTEIN HORMONE RECEPTOR; the LGR family). Assessed all 28 PAINT rows on 11 nodes. Root PTN000689980: plasma membrane SOUND; GO:0008528 G protein-coupled peptide receptor activity TOO_DEEP with REMOVE_IBD, recommending GO:0004930 at the root instead (peptide ligands occur only in the relaxin-family and bursicon receptors; GO files the glycoprotein hormone receptor activities under GO:0016500); GO:0007189 and GO:0009755 NEEDS_PRUNING with ADD_IRD at the LGR6 clade PTN002809239, because zebrafish lgr6 still inherits them while the LGR4 and LGR5 clades are pruned. Clade nodes for LHCGR, FSHR, TSHR, LGR4 and LGR5 SOUND; the six existing IRDs LOSS_SUPPORTED. Five nodes in the slice are not in the PTHR24372 tree: they reach six LGR4/LGR6 entries that PANTHER 19 places in the PTHR45836 (SLIT) tree or in no tree of this family; Slit-node rows NEEDS_PRUNING without an action, generic LRR rows UNRESOLVED. Added a reproducible tree-placement analysis (PTHR24372-bioinformatics). Cross-checked with the human FSHR and LGR5 reviews (consistent) and the worm fshr-1 review, whose removal of GO:0009755 and GO:0016500 this review disagrees with; the gene review was not changed. Member-index checks were not run (index not built); subfamily membership of the representative members was confirmed from UniProt PANTHER cross-references.
