    Curated Polyprenol kinases including dolichol kinase. Assessment: MOSTLY_COHERENT. The sampled PANTHER entries are dolichol kinases, whereas the integrated polyprenol-kinase definition spans dolichol and phytol phosphorylation. Sec59 is supported as a dolichol-kinase ortholog by curated UniProt inference to budding-yeast Sec59; extension of that substrate to unsampled plant branches remains unresolved. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
