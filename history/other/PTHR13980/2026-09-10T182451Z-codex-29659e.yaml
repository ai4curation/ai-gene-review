  summary: Curate PTHR13980 family function boundaries
  details: |
    Curated Spt16 FACT histone chaperones. Assessment: COHERENT. The family members are Spt16 orthologs, and direct pombe structural evidence separates the conserved histone-binding module from the ancestral-looking enzyme fold. FACT participation is a strong family-level assignment; peptidase activity is not supported by the fold resemblance. Verified the official family/subfamily labels and representative PANTHER cross-references. Preserved provenance of database assertions and consulted available primary-publication excerpts. Schema, membership, source-quote and sequence-anchor validation are recorded in family-curation/results-c.json. This is a substantive first-pass family review requiring independent review; it does not assert an unexamined PAINT node placement.
