  summary: Reconcile two independently written PTHR32303 reviews
  details: |
    Resolved an add/add conflict between this branch's PTHR32303 review and the one main gained from PR #5360 (commit 8f60091ed8), which the lanthanide-switch PQQ module depends on. Main's version is the base and is kept whole: summary, HETEROGENEOUS coherence, PedH as reference protein, all three subfamilies with their clade_node_ids, every node assessment, the GO:0052934 SF20 scope with its Thauera boh member exception, the residue-free term scopes and all references. Folded in from this branch: a GO:0016614 term assessment, which the acetoin/2,3-butanediol module needs for the PedE/PedH butanediol entry steps. The two reviews agreed on every node verdict (PTN000793792 and PTN002088145 SOUND, root PTN002529367 TOO_DEEP for membrane) and on SF20 holding both the calcium and the lanthanide enzymes, so no verdict had to be adjudicated. Two deliberate choices where they differed: this branch's separate membrane term assessment was dropped in favour of main's node-level treatment, which records the same finding without scoping a term the reviewed members reject; and main's gene reviews for the SF4 members Gcd and QuiA shaped the GO:0016614 assessment. QuiA keeps the membrane term, so SF4 is not listed in the membrane node's pruning scope. The assessment is FAMILY_WIDE with BamB as its only member exception: a SUBFAMILY_ONLY scope over SF20 and SF4 was tried first but made the checker restrict the lanthanide module's more specific GO:0052934 assertions, adding two FAMILY_SCOPE_RESTRICTED warnings to that module, and FAMILY_WIDE is also the more accurate reading. Gcd and QuiA do oxidize a CH-OH donor; their reviews simply annotate the specific child term (GO:0008876, GO:0047519) and mark the broad parent over-annotated, which is a granularity difference recorded in the scope reason rather than a claim that they lack the activity, so they are not member exceptions. That leaves two FAMILY_GENE_DISAGREEMENT rows for them in the cross-check, reported to adjudicate rather than as conflicts. Validation after the merge: validate-families exits 0 over 793 families with 0 cross-check conflicts; module_validator reports 0 warnings for the acetoin module and, for the lanthanide module, the same 3 pre-existing two-component-relay template warnings it has on main with main's own copy of this file.
