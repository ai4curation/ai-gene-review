  summary: 'Complete family biological assessment: PTHR11347'
  details: |
    Completed biological assessment of the family, using checked member/domain context and primary publications where available. Cyclic-nucleotide phosphodiesterases share hydrolysis of a cyclic phosphodiester bond but include cAMP-selective, cGMP-selective and dual-specificity enzymes. The reviewed fly Pde4 record assigns the PDE4 subfamily and cAMP hydrolysis by similarity to a characterized homolog; the actual family inventory separately includes cGMP-directed PDEs. A general phosphodiesterase label therefore cannot determine the cyclic-nucleotide substrate. Learning, phototransduction and reproductive phenotypes remain substrate-, cell- and branch-dependent. Updated current-state rationale and retained bounded scientific uncertainty rather than a human review handoff. Checked exact accession identity of every gene-review link. Schema, source existence and literal quotations are validated separately in completion-c-validation.json.
