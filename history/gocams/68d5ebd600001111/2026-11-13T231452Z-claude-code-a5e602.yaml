  summary: Review GO-CAM 68d5ebd600001111
  details: |
    Reviewed all four activities of the human KISS1/KISS1R GnRH-neuron depolarization model (kisspeptin-10 chain, KISS1R, GNAQ, TRPC4) against the KISS1, KISS1R and GNAQ gene reviews and the cited literature. Confirmed the enabled_by entity UniProtKB:Q15726-PRO_0000021548 is Kisspeptin-10 (112-121) in the UniProt record and that its GO:0048018 receptor ligand activity matches the KISS1 review's core molecular function. Recorded three source defects: the process containment places positive regulation of gonadotropin secretion inside positive regulation of membrane depolarization on three activities, which inverts the model's own mechanism-to-outcome order; the nested gonadotropin-secretion context on the ligand activity carries ECO:0000314 on a rat-only study (PMID:15219839) in a human-taxon model; and no reference in the model links TRPC4 to kisspeptin or GnRH neurons, so the mouse studies that make that link (PMID:23744639, PMID:18434521) are requested as additions. KISS1R's generic GO:0004930 typing is recorded as GENERIC_MF with consistency MORE_GENERAL rather than as an error, since GO:0008188 is its descendant via GO:0008528. GNAQ's off-topic enabled_by reference (PMID:11024015) was checked and left alone: GNAQ's own GOA carries an accepted IDA row for GO:0003925 on that same publication. Cached PMID:23744639 for this review; PMID:12032305, PMID:16144838 and PMID:39478185 were cached while reading the model.
