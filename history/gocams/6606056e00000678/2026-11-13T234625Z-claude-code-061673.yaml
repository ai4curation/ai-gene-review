  summary: Review GO-CAM 6606056e00000678
  details: |
    Reviewed the three activities (UBR5 ligase, ESR1 nuclear receptor, NCOA1 coactivator) of the UBR5-ESR1 model, one of a series built from PMID:37478846. ESR1 OK (human MCF-7 ChIP/EMSA/transactivation; estrogen-dependent SRC-1 recruitment supports the ESR1-to-NCOA1 edge); NCOA1 CONSISTENT with the NCOA1 gene review; ESR1 and UBR5 have no gene review. For ER the study shows estradiol-induced direct UBR5-ER binding and UBR5-dependent ligand-induced ER reporter degradation, but no ubiquitination assay, no ER chromatin data and no ER-specific NCOA competition; the 'not associated with NCOAs' condition is shown for RARA (NCOA1 competition in vitro, time course) and GR, and extended to ER by generalisation. Recorded: CONFIRMED MISSING_STATEMENT (NCOA1 removes-input-for UBR5 edge has no evidence and NCOA1 has no has_input ESR1); SUSPECTED WRONG_TERM for part_of GO:0071630 (quality control of misfolded proteins vs agonist-triggered turnover), raised once for the series; SUSPECTED WRONG_CAUSAL_RELATION for the negative UBR5-to-ESR1 edge, since the study found UBR5 knockdown reduced RARA-induced transcription and called UBR5 a mediator of NR-induced transcription. Flagged UNRESOLVED_COMPARTMENT (chromatin) on all three activities. Cached PMID:37478846 and PMID:9338790.
