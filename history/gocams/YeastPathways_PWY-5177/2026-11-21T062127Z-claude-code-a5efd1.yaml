  summary: Cross-check GO-CAM YeastPathways_PWY-5177 against iMM904 and yeast-GEM
  details: |
    Added a reproducible comparison with two yeast genome-scale metabolic models (YeastPathways_PWY-5177-bioinformatics/gem_check.py, generated gem_reactions.md, RESULTS.md). Neither iMM904 nor yeast-GEM 9.1.1 has any glutaryl-CoA reaction. iMM904 constrains Erg10 (ACACT1r/ACACT1m) to the condensation direction; yeast-GEM keeps it reversible. yeast-GEM models the same C4 chain as peroxisomal: FOX2 (R)-specific hydratase and dehydrogenase (r_2254, r_2271) and POT1 thiolysis of acetoacetyl-CoA (r_2283). PHS1 is absent from iMM904 and ER-membrane-only in yeast-GEM. Added these as evidence to all four activities and a SUSPECTED CHECK suggesting POT1 as candidate enabler of the thiolysis step if the chain is relocated to the peroxisome. Verdicts and consistency unchanged.
