  summary: Review GO-CAM 68d5ebd600000043
  details: |
    Reviewed the three activities (TAC3 ligand, TACR3 receptor, GNAS G protein) of the NKB-NK3R Gs/adenylate cyclase model. MFs, locations, has_input and both direct positive edges are correct. The Gs branch has no human evidence in the model: TAC3 and TACR3 part_of GO:0007189 are ISS from rat Tac3/Tacr3, and the NK3R-to-Gs edge is a TAS to a hedged introduction sentence (PMID:22985858) that cites a rat-receptor CHO study (PMID:1370820). Recorded that as a PROBABLE source defect, and a SUSPECTED one for a rat with-object on the GNAS IDA location. Cached PMID:10200251, PMID:22985858 and PMID:7616392 (human NK3R cAMP study, not cited by the model). No gene review exists for Gs-alpha P63092; genes/human/GNAS reviews NESP55.
