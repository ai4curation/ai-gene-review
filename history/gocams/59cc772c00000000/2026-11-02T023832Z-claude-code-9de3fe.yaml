  details: |
    At the user's prompt, revised the CASP1 activity review. CASP1 cysteine-type endopeptidase activity occurs in the cytosol, yet it is asserted to directly positively regulate IL1B cytokine activity in the extracellular region. Mature IL-1beta leaves the cell by GSDMD-pore-mediated unconventional secretion, which CASP1 also triggers by cleaving GSDMD, so the edge compresses at least two steps. Verdict changed from OK to UNCERTAIN, with the DIRECT_VS_INDIRECT_CAUSAL flag and a WRONG_CAUSAL_RELATION source defect (RO:0002629 -> RO:0002407, or better, add a GSDMD pore activity in between). Added PMID:33883744 as evidence and updated the summary.
