  details: |
    First review of the model's seven activities. Verdicts: 1 OK, 5 UNCERTAIN, 1 WRONG. Snap25 carries the correct molecular function GO:0005484 but its enabled_by evidence cites PMID:12145198, a VAMP2/calmodulin paper. The G-alpha-o2 potassium channel activator activity on Kcnj6 is wrong: GIRK channels are opened by G-beta-gamma, which is already in the model. Several receptor to G-protein edges carry no evidence. No gene review exists for the mouse gene products. Validated with just validate-gocam-review; 10 quotes verified.
