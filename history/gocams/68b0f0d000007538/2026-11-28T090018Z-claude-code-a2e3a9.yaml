  summary: Review of mouse glucocorticoid biosynthesis GO-CAM containing Serpina6
  details: |
    Seeded and reviewed all seven activities. Serpina6 molecular carrier activity in the extracellular region is OK and has no part_of process, which agrees with removing glucocorticoid biosynthetic process from human SERPINA6; flagged as an orphan activity and suggested has_input corticosterone and part_of hormone transport. Cyp21a1 and Cyp11b1 OK; Hsd3b1 activities, Hsd11b1 and the placeholder transporter UNCERTAIN, read from abstracts of the model's cited papers (cached in this PR). One occurs_in reference (PMID:19042983) looks mis-keyed from its abstract and is recorded as a query in notes, not as a confirmed defect. No mouse gene reviews exist for the members, so consistency is NO_GENE_REVIEW throughout. Validated with just validate-gocam-review.
