  summary: 'Review GO-CAM 65bc474400000029: ZDHHC4-mediated palmitoylation of MAVS
    via CPT1A (Human)'
  details: |
    Reviewed all 4 activities: 3 OK, 1 UNCERTAIN, 0 WRONG. The CPT1A adaptor -> ZDHHC4 palmitoyltransferase -> MAVS adaptor -> TRAF3IP3 chain matches PMID:38016475, and the CPT1A activity is consistent with the CPT1A gene review, which accepts the same GO:0030674 and GO:0045089 IDA rows. Dismissed both flagged compartment edges: the ER-anchored ZDHHC4 acylating MAVS on the mitochondrial outer membrane, and CPT1A recruiting ZDHHC4, are ER-mitochondrion contact-site chemistry between two cytosol-facing membranes, not missing transport steps, so no NONADJACENT_COMPARTMENTS flag. The real defects are three mis-keyed references: PMID:35606353, a glioblastoma GSK3beta paper with no mention of MAVS or innate immunity, on ZDHHC4's innate-immune process and its edge to MAVS, and PMID:20451243 and PMID:16858409 on the MAVS-TRAF3IP3 relations. ZDHHC4's molecular function also stops at GO:0016409 where GO:0019706 was shown.
