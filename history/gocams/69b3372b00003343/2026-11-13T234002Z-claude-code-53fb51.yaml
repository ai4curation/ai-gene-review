  summary: Review GO-CAM 69b3372b00003343
  details: |
    Reviewed the seven activities (FSH complex, FSHR, GNAS P63092, PRKACA, AKAP8, CREB1, CYP19A1) of the FSH-to-granulosa-cell model. All six causal predicates have the right directness (four direct, two indirect summaries of AC/cAMP and transcription); no RO:0002413 misuse. Confirmed on human granulosa-cell evidence that AKAP8 (PMID:29397057, KGN and hLGCs) and CYP19A1 (PMID:30541132, primary cumulus GCs) belong in the FSH route. Consistency: FSHR, CREB1, CYP19A1 and the FSH complex (via CGA) CONSISTENT; GNAS P63092, PRKACA, AKAP8 NO_GENE_REVIEW. Recorded source defects: PROBABLE WRONG_REFERENCE PMID:27889227 on FSHR and on the FSH complex location/has_input; PROBABLE WRONG_REFERENCE on the PRKACA-to-CREB1 edge (MAP2c paper PMID:11029056) and on the CREB1-to-aromatase edge (SRCAP/PEPCK paper PMID:11522779); CONFIRMED malformed GO_REF:000024 without with/from on PRKACA and CREB1 part_of; PROBABLE WRONG_EVIDENCE_CODE ECO:0000250 for a human immunofluorescence study (PMID:37532169) on FSHR cell type; CONFIRMED self-nested part_of GO:0001541 on AKAP8; SUSPECTED WRONG_TERM GO:0140777 on AKAP8 (anchoring, suggest molecular adaptor activity). Dismissed the NONADJACENT GNAS-to-PKA lead as a deliberate indirect summary. Cached PMID:29397057, 11029056, 2573431, 37532169, 8754745 and 9473338 (AKAP95 binds RIIalpha; RIIalpha excluded from interphase nucleus).
