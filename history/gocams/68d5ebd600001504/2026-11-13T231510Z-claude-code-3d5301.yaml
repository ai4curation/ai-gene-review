  summary: Review GO-CAM 68d5ebd600001504
  details: |
    Reviewed all four activities of the human KISS1/KISS1R bone-resorption model (kisspeptin-10 chain, KISS1R, DUSP18, SRC) against the KISS1, KISS1R and SRC gene reviews and the full text of Li et al. 2024 (PMID:38346942), which is the model's single mechanistic source. The DUSP18 activity is the best-supported in either kisspeptin model: purified DUSP18 dephosphorylates Src at the activating Tyr 416 in vitro while the catalytically dead C104S mutant does not, so has_input SRC and the RO:0002630 directly-negatively-regulates edge are both correct, and the human leg of the process claim is the giant-cell-tumour osteoclast-formation experiment. Recorded five source defects. On KISS1R: the outgoing edge uses RO:0002413 provides input for, which asserts material transfer the receptor does not perform, where the sibling model uses RO:0002629 for the same kind of step; has_input SRC misstates a kinase the paper places upstream of complex assembly (interactions abolished by saracatinib and by Src knockdown), and SRC is already correctly the phosphatase's input; and the GO:0007200 pathway containment is contradicted for these steps by the paper's own inhibitor data, since neither the recruitment nor the Dusp18 up-regulation was blocked by U73122. On SRC: the generic GO:0004672 should be the tyrosine term, which the SRC gene review independently concludes for the same rows. On DUSP18: a request to state the osteoclast cell type, which no activity in the model declares, and a question about whether cytoplasm should be the cytoplasmic side of the plasma membrane, where the paper's immunofluorescence puts the phosphatase and its substrate. All mouse with_object orthologs were confirmed through the Alliance. Cached no new publications for this model; PMID:38346942 was already cached with full text.
