  summary: 'Review: GO-CAM 62b4ffe300000335 (perforin/granzyme killing)'
  details: |
    Reviewed all four activities alongside the human PRF1 gene review.

    Main finding, a source defect: the model is an NK-cell model by every piece of evidence it cites (FCGR3A/CD16A, GO:0043320 natural killer cell degranulation, and three references all about human NK cells including the one supplying the IDA for the cell type), but its only cell-type assertion is CL:0000814 mature NK T cell. CL:0000824 mature natural killer cell differs by one transposed digit. Recorded PROBABLE, not CONFIRMED, since an NKT model is not biologically absurd. If corrected, GO:0001913 on the perforin activity must become GO:0042267, the term the PRF1 gene review independently proposes as a gap.

    Other flags: GENERIC_MF on the FCGR3A activity (GO:0140375 immune receptor activity where the gene's own GO:0019772 low-affinity IgG receptor activity applies); BINDING_AS_FUNCTION on the perforin calcium-binding node; DIRECT_VS_INDIRECT_CAUSAL on the pore-to-granzyme edge, where RO:0002629 over-claims directness (the pore relocates the enzyme rather than changing its catalytic rate), the predicate arrived by an automated March 2023 change replacing RO:0002213, and the three sibling PRF1 models use the weaker RO:0002304 for the same step.

    Two findings withdrawn after corpus-wide checking, and this is the part worth remembering. Empty evidence on every molecular_function association, and an unnamed has input on the pore activity, both looked like defects. Neither is: 0 of 12,585 activities across all 2,036 cached models carry MF evidence, and 100 percent of the 19,378 molecular_associations in the corpus have a null entity. Both are artifacts of the gocam-py serialisation in our <id>-src.yaml cache, so they were removed from the activity reviews and recorded in the model notes as repository tooling issues instead. Consequence for future GO-CAM reviews here: has input correctness is one of the six things the gocam-curation skill asks a reviewer to assess, and it is currently unreviewable from the cache.
