    Amendment following the GZMB and FCGR3A gene reviews, which were written specifically to close the two unassessable consistency verdicts this review had to record.

    The FCGR3A activity (62b4ffe300000336) moves from NO_GENE_REVIEW to MORE_GENERAL. The gene review establishes the ontology fact that makes the earlier GENERIC_MF flag more than a matter of taste: GO:0140375 immune receptor activity is a strict ancestor of GO:0019772 low-affinity IgG receptor activity, which FCGR3A carries by direct assay and which that review accepts as the core molecular function. The model's claim is true and simply sits above the right term, which is what MORE_GENERAL means.

