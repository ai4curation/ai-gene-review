  summary: Reconcile IL6 receptor gene reviews in GO-CAM 5f46c3b700002685
  details: |
    Updated the IL6:sIL6R trans-signaling GO-CAM review after the final IL6R and IL6ST gene reviews merged. The IL6, IL6R and IL6ST activities now point at their gene reviews instead of carrying stale NO_GENE_REVIEW consistency values.

    The soluble IL6R activity is marked CONSISTENT with the IL6R core function while preserving the note that soluble IL6R presents IL-6 to membrane gp130. The IL6ST activity is marked RELATED because the model uses generic GO:0015026 coreceptor activity whereas the IL6ST review represents gp130 as a cytokine receptor beta chain contributing to ligand-specific receptor activities. The read-only source-defect checks on PMID:12433365 and PMID:9727029 were retained.
