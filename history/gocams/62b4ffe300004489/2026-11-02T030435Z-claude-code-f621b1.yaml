  details: |
    Reviewed all 5 activities of the IFN-gamma model. Two source defects recorded: the STAT1 -> EP300 causal edge cites PMID:11972023 with ECO:0000314 although that paper assays no coactivator (repoint to PMID:16257975, already on the EP300 node); and the kinase node is enabled_by CAMK2A while PMID:11972023 identifies CaMKII gamma/delta (CHECK, accessions not looked up). Also: no IFN/receptor/JAK component, CALM1 -> CALM1 same-gene chain, missing occurs_in on the cytosolic nodes, and this model asserts the CAMK2A -> STAT1 step as directly positively regulates where 62b4ffe300004525 uses causally upstream, positive effect. Incorporates cjm's manual review.
