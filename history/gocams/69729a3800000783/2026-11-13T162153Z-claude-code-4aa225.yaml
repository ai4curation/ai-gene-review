  summary: Review GO-CAM 69729a3800000783 (Stxbp1 SNARE assembly, rat)
  details: |
    First review of the model's three activities (Stxbp1, Unc13a, Vamp2). Verdicts: 2 UNCERTAIN, 1 WRONG. All three use a binding term as molecular function and lack a location. Vamp2 is typed SNARE binding where the SNARE fusogenic activity GO:0005484 applies; the Unc13a edge to Vamp2 cites PMID:9030619, a VAMP2 mutagenesis paper that does not involve Munc13. Stxbp1 syntaxin-1 binding is consistent with the rat Stxbp1 gene review; rat Unc13a and Vamp2 have no gene review. Validated with just validate-gocam-review; 4 quotes verified.
