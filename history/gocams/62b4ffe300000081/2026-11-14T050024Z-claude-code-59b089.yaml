  summary: 'Review: GO-CAM 62b4ffe300000081 (CASP7/SMPD1 repair of perforin pores)'
  details: |
    Reviewed all five activities; selected for review because it carries the GO:0009306 protein secretion framing that the PRF1 gene review re-levels.

    Graded one activity WRONG: the granzyme B activity asserts RO:0002629 directly positively regulates onto perforin's channel activity. Granzyme B does not regulate pore formation; the dependence runs the other way. The model's own evidence points elsewhere, both cited references being about granzyme B activating caspases, and this model contains the caspase-7 activity that evidence supports as the edge's object. Re-pointing it would also connect the chain correctly: pore, granzyme B, caspase-7, acid sphingomyelinase. Separately, the cited paper (PMID:9852092) states that granzyme B does not activate procaspase-7 directly in cells, requiring caspase-3 to remove the propeptide first, so even a corrected edge should be indirect and caspase-3 is a missing participant.

    Perforin problems: two PRF1 activities with identical molecular function, location and cell type differing only in process, one of them with no causal edge at all, so the model's granzyme-mediated death arm is disconnected from its membrane-repair arm (ORPHAN_ACTIVITY). Both sit in GO:0016020 membrane where the evidence and the hepatocyte context specify the plasma membrane. One is part_of GO:0009306 protein secretion, which the gene review re-levels to GO:0071806: caspase-7 escaping through a lytic pore is neither controlled nor a secretory route. Recorded as CONFLICT on that activity, with the note making clear the conflict is on the process, not the molecular function.

    Same two cache artifacts as in 62b4ffe300000335 (no MF evidence anywhere; all molecular_associations null) checked and withdrawn rather than flagged. This model declares three has input associations, a has output and, interestingly, a has small molecule inhibitor on one perforin activity, none of whose fillers can be read from the cache.
