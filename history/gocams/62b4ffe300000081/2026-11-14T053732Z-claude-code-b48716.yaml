  summary: 'Amend: resolve all four NO_GENE_REVIEW consistency verdicts in 62b4ffe300000081'
  details: |
    Amendment following the GZMB gene review, and correcting two verdicts that were wrong when first recorded.

    The GZMB activity (62b4ffe300000091) moves from NO_GENE_REVIEW to CONSISTENT. The consistency verdict describes the activity typing, which agrees with the gene review (GO:0004252 core, GO:0051604 protein maturation core, the right framing for an enzyme that activates substrates rather than degrading them). The WRONG verdict stands and is about the edge, which asserts that granzyme B directly positively regulates perforin's channel activity.

    Two corrections. The CASP7 and SMPD1 activities were recorded as NO_GENE_REVIEW, which was simply an error: both genes already have reviews in this repository and I did not check before asserting it. CASP7 (62b4ffe300000105) is CONSISTENT on every axis - GO:0004197 is accepted there twenty-six times and is a core function, GO:0051604 and GO:0005576 are accepted - which also means the extracellular placement of caspase-7 discussed in the notes is not an outlier in this repository's own curation. SMPD1 (62b4ffe300000154) is CONSISTENT too: that review accepts GO:0061750, the exact term the activity uses.

    One finding surfaced while checking SMPD1: its review carries GO:0046513 ceramide biosynthetic process twice with two different verdicts, ACCEPT and MARK_AS_OVER_ANNOTATED. That is an internal inconsistency in that review, and it slips past the action-consistency checker because only ACCEPT-versus-REMOVE is in the rule table. Recorded in this model's notes because the model depends on that term; not fixed here, as it belongs to the SMPD1 review.
