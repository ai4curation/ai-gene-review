  summary: Record the LhpBEF subunit check and the PMID:20665524 author-list caveat
  details: |
    PR #6274 review follow-up. Added a suggested_question recording the concrete, partly-completed check for the LhpBEF subunits: the operon is lhpABFE and lhpA is PA1268, so the subunits should be adjacent genes, but UniProt assigns no lhpB/lhpE/lhpF name anywhere in PAO1 and the adjacent candidates PA1267 and PA1266 are unnamed oxidoreductases, leaving a three-subunit enzyme with at most two candidates. Also noted in the PMID:20665524 reference_review that its author list is not a Pseudomonas group, which sharpens rather than softens the concern that the paper's assay model may not be this protein; the activity itself is established independently by PMID:17849014.
