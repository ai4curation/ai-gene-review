  summary: 'Create review: PA1268 (LhpA, P. aeruginosa 4-hydroxyproline 2-epimerase)'
  details: |
    New review for Q9I476, the P. aeruginosa hydroxyproline 2-epimerase, created for the hydroxyproline-catabolism module. All five GOA GO:0047580 rows are accepted: three EXP rows, an IEA EC/Rhea row concordant with them, and the PseudoCAP IMP from the lhp regulatory genetics. GO:0019470 is added as NEW because the enzyme performs the first chemical step of the route, matching the KT2440 ProR review. The PMID:20665524 row is accepted with its attribution left to the UniProt curator, since the cached abstract does not name the enzyme's source organism. Deep research was unavailable (the provider API returned 403), which is recorded in the notes file. Validation clean.
