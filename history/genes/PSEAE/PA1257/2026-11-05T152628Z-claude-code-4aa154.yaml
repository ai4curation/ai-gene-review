  details: |
    Checked the PTHR30614 topology with projects/PSEUDOCAP/panther_tree.py on 2026-11-05. PTN000770175 is a SPECIATION node (Proteobacteria), 18 leaves, all SF0, of mixed specificity: two HORIZ_TRANSFER subtrees (PTN008625440 with B. subtilis TcyB and B. cereus cystine permeases; PTN008625441 with YxeN and VC_0009), a Pseudomonas-specific DUPLICATION (PTN002413080: PA1257, PA1258, PA0313) and an Enterobacteriaceae clade (PTN002024099). --contains for the four cystine/YecS-named enterobacterial members returns exactly PTN002024099, so the TcyL-seeded cystine support stops there. Raised the GO_CENTRAL defect SUSPECTED -> CONFIRMED, named PTN002024099 as the target for both the GO:0015184 and GO:0015811 IBDs, and recorded GO:0015424 as the broader term the node itself would support. Added a PANTHER tree check section to the notes. Annotation actions unchanged (MARK_AS_OVER_ANNOTATED on both rows).
