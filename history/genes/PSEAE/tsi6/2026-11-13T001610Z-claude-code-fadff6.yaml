  summary: 'Create review: tsi6, cognate immunity protein of the Tse6 toxin'
  details: |
    Reviewed as the tse6/tsi6 shared-claim group from the tier-3 PseudoCAP worklist, where GO:0097351 toxin sequestering activity is annotated by IMP from PMID:24589350 to both halves of an effector-immunity bicistron. Both cited papers are cached with full text. The term is defined as binding a toxin to prevent it acting, which is what an immunity protein does, so annotating it to both the toxin and its antidote inverts the relationship for one of them. The full text states the direction outright: the Toxin_61 domain of Tse6 is a potent cytoplasmic toxin whose activity is specifically neutralized by Tsi6, with the specificity control that co-expression of Tsi6, but not of the non-cognate immunity protein Tsi2, gave full rescue. This is the shared-claim pattern the tier-3 worklist was built to surface: one pair-level experiment entered on both genes. Specific to tsi6: GO:0097351 is ACCEPTed as the core function, since this is the entry the term belongs to and the non-cognate Tsi2 control makes the neutralisation specific. GO:0033103 protein secretion by the type VI secretion system is MARK_AS_OVER_ANNOTATED: the paper describes tsi6 as a small ORF encoding a protein with predicted cytoplasmic localization and tests it as a PA0093-specific immunity determinant, and the row appears to derive from the pair-level competition experiment, which shows that tsi6 is required for the outcome of those competitions without showing that it does any of the work of protein secretion -- the line the project rule on involved_in draws. Marked over-annotated rather than removed because tsi6 is genuinely part of the H1-T6SS locus and a secretion-related role is not excluded by what is reported. A question is raised about whether Tsi6 neutralises Tse6 by occluding its active site or by preventing delivery or folding, which would also say whether GO:0097351 or an enzyme-inhibitor term is the better description.
