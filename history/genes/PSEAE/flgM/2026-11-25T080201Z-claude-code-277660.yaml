  summary: 'Review flgM: GO:0045892 kept general on purpose, with the reason stated'
  details: |
    GO:0016989 accepted on two independent lines: loss of flgM raises fliC promoter output and
    flagellin levels, and a two-hybrid assay shows direct interaction with sigma-28. The sigma factor
    is FliA, PA1455.

    GO:0045892 is kept rather than refined, and the review says why. Deepening it to GO:2000143, as
    the sibling PA2895 review carries for the same kind of protein, would fail the 2026-11-14 test:
    this row's evidence is the FlgM family signature, which identifies the sigma-28 binding domain but
    not which step of transcription is blocked. TOO_GENERAL does not apply either, since no more
    specific process term is asserted on this gene for it to be entailed by. What PA2895 has and this
    gene does not is a report that the antagonised sigma associates with RNA polymerase. The two
    reviews differ on evidence, not from inconsistency, and cross-gene symmetry would be the wrong
    reason to deepen a term.

    Recorded a strain caveat: the flagellin Western blot was done in PAK while the annotation is on the
    PAO1 locus.
