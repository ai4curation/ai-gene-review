  summary: PseudoCAP IBA-seed review of PA5458 (Q9HTB2), AT3-family CPA O-antigen
    acyltransferase
  details: |
    Full review from Hao et al. 2013 (PMID:23341552). Seed rows judged sound for the gene (GO:0009103 IMP modified to GO:0009243; GO:0009243 accepted, with a PSEUDOCAP defect for IDA->IMP). Both sole-seeded IBDs judged WRONG for their clades: PTN000546841 LPS biosynthesis covers Gram-positive peptidoglycan O-acetyltransferases (OatA) and 15/31 LPS-less leaves; PTN000546715 polysaccharide biosynthesis propagates to 109/113 eukaryotic (97 nematode) leaves. GO_CENTRAL defects recorded. Added PAINT node composition analysis in PA5458-bioinformatics.
