  summary: 'Review nudC: an IMP asserting a mutant phenotype the paper reports as
    absent'
  details: |
    GO:0016787 carries two defects that one sentence of its own reference fixes. The term is the
    hydrolase root while the paper reports the purified P. aeruginosa enzyme preferentially hydrolyses
    NADH in vitro, so both GO:0016787 rows MODIFY to GO:0035529, already on the gene. And the IMP code
    is contradicted by the paper's central result: the P. aeruginosa deletion and overproduction both
    had no visible impact on cells. An IMP is inferred from a mutant phenotype; this paper's finding is
    that there is none. Filed WRONG_EVIDENCE_CODE, IMP to IDA, at CONFIRMED.

    All three metal terms kept. Mg, Mn and Zn looked like a cluster to prune until the record showed two
    distinct cofactor blocks in HAMAP MF_00297: a catalytic cation that may be Mg or Mn, and a separate
    structural zinc, one per subunit. Pruning on the pattern would have removed two correct
    annotations. Only GO:0046872 is TOO_GENERAL.

    The deNADding activity GO:0110153 is taken as the core function from the curated rule, with the
    review stating that it has never been measured on the P. aeruginosa protein - only the NADH
    preference has. GO:0006742 NADP+ catabolic kept non-core as family-level substrate tolerance.

    Also recorded: the first version of this review fabricated the paper's title, having read the
    cached field through a truncating command and written a plausible second half from the abstract.
    The reference-title check rejected the file. The invented title also dropped the paper's own
    framing, intracellular redox balance, which is what links the NADH preference to the mutant's NADH
    accumulation; correcting it added a finding and deepened a knowledge gap.
