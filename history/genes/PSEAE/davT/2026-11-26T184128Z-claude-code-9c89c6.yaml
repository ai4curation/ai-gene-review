  details: |
    Pass projects/IBA_REVIEW/overannotated-2026-11-24 (batch N22). The IBA GO:0009450 GABA catabolic process (IBD at PTN000944876) was MARK_AS_OVER_ANNOTATED because GABA had not been tested on PA0266. On the PAINT tree the E. coli GabT seed (P22256) is in the same 7-leaf clade PTN000241472 as PA0266, and no loss is recorded. PA0266 is the PAO1 gabT (KEGG and STRING symbols), and the abstract of PMID:18192388 reports GabD, GabT and PA5313 identified for GABA utilization and a growth defect on GABA for a PA5313 gabT double mutant. Action changed to KEEP_AS_NON_CORE. The IEA row GO:0034386 4-aminobutyrate:2-oxoglutarate transaminase activity rested on the same reason and was changed to KEEP_AS_NON_CORE with it. PMID:18192388 added to references (abstract only; full text not available from PMC). The sentence that interpro/panther/PTHR11986 quotes from the old summary is kept verbatim in the new reason. Not changed: description, core_functions, the P. putida davT review, and the family review text saying GABA is untested on DavT. Validated with just validate PSEAE davT.
