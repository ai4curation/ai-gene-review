  summary: 'Create review: phuR, outer-membrane haem receptor of the phu system'
  details: |
    Reviewed as the hasR/phuR shared-claim group from the tier-3 PseudoCAP worklist. The substantive finding is that both haem receptors carry siderophore annotations: GO:0015344 and GO:0044718 by IBA, plus GO:0033214 inferred logically from them. All trace to PTN004738955, which was checked directly in the PANTHER tree with projects/PSEUDOCAP/panther_tree.py on 2026-11-13. The node is the LUCA root of PTHR30069, 149 leaves across 18 subfamilies, and its five seeds are siderophore or colicin receptors in five other subfamilies: Q9HVC0 (SF42), Q9HWM5 (SF37), Q9I527 ferric enterobactin receptor PirA (SF8), Q05098 ferric enterobactin receptor (SF51) and P17315 colicin I receptor (SF53). The targets sit in the haem subfamilies, whose PANTHER names state it: SF41 "Heme uptake outer membrane receptor HasR" and SF29 "Heme_hemoglobin uptake outer membrane receptor". The seeds are not the problem -- two of them, PA4675 and PA4156, were reviewed by this project in tier 2 and their own siderophore rows accepted as sound. The depth is: the node supports the shared TonB-dependent outer-membrane mechanism, not the substrate. Relocation was tested rather than assumed and does not work, because the smallest clade containing all five seeds is PTN002824128 (145 leaves), which also contains SF29 and SF41, so no child node holds the siderophore receptors alone; the remedy must be generalising the node terms or blocking them in the haem subfamilies. The GO_CENTRAL defect is recorded once, on hasR, at CONFIRMED, with phuR cross-referencing it so the upstream request is filed once. GO:0055085 is KEEP_AS_NON_CORE on both because GO:0015886 haem transport is not a descendant of it (checked in QuickGO), so refining would drop the transmembrane claim -- the same structural case the betT1 and PA5291 reviews handled this way. Specific to phuR: the strongest row is the GO:0015232 IMP, because the deletion phenotype on haem or haemoglobin as sole iron source was complemented by the gene on a plasmid, which is the control that makes a phenotype attributable. GO:0071281 cellular response to iron ion (EXP) is ACCEPTed on the mapped transcriptional start sites, iron-restricted expression and direct Fur control demonstrated by footprinting of two Fur boxes overlapping the promoter. Both GO:0019867 rows are MODIFYed to GO:0009279, GO:0022857 is TOO_GENERAL, and the three siderophore rows are REMOVEd with the node analysis cross-referenced to hasR.
