  summary: 'Audit: re-ground the PTN002824317 GO_CENTRAL leaf claim on domain architecture
    and verified experimental annotations'
  details: |
    Checked all 10 UniProt records of PTN002824317. The 'all 10 leaves are CysB or Cbl regulators' claim was name-derived; five leaves are SubName entries with ECO:0000313 and no experimental data. Reworded to rest on evidence: all 10 have exactly PF00126 HTH_1 plus PF03466 LysR_substrate and a CysB-type NCBIfam profile (NF009327 or NF009325), none carries a CysE or CysK biosynthetic domain, and the two leaves with experimental annotation are both regulators (E. coli CysB P0A9F3, IDA DNA binding and IDA cytosol, no experimental GO:0019344; E. coli Cbl Q47083, IDA positive regulation of sulfur utilization). The explanation now states that the core argument - CysB performs no step of cysteine synthesis and the auxotrophy shows necessity, not participation - is independent of the leaf list. Confidence held at CONFIRMED. Notes section added.
