  summary: Refine shallow Sec transport terms to MODIFY -> GO:0043952, add IBA supporting_entities
    and propagation_review, and mark COMPLETE
  details: |
    Promoted status from DRAFT to COMPLETE. Added GOA WITH/FROM supporting_entities
    (PANTHER:PTN000763987, UniProtKB:P0AG90, UniProtKB:P0AG93) and structured
    propagation_review blocks to both IBA rows (GO:0005886 plasma membrane and
    GO:0015031 protein transport). Refined shallow parent process terms GO:0015031
    (protein transport, IBA), GO:0006605 (protein targeting, IEA), GO:0006886
    (intracellular protein transport, IEA), and GO:0065002 (intracellular protein
    transmembrane transport, IEA) from KEEP_AS_NON_CORE to MODIFY with
    proposed_replacement_terms pointing to GO:0043952 (protein transport by the Sec
    complex). Removed contributes_to_molecular_function: GO:0015450 from
    core_functions because SecDF is a PMF-driven accessory subcomplex rather than a
    catalytic subunit of the SecA ATPase, and added reference_review to the
    bioreason-sft deep-research reference.
