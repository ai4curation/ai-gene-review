- type: REVIEW
  outcome: changed
  summary: Review femA, completing its PseudoCAP molecular-function shared claim
  details: |
    The substantive finding of this batch. femA is PA1910, and it does not belong to the
    GO:0016987 shared claim it was listed in at all: two experimental rows from PMID:18086184
    are swapped between femA and femI.

    The paper assigns the loci explicitly. It names the five ECF sigmas it overexpressed -
    PA0149, PA1912, PA2050, PA2093, PA4896 - and designates PA1912-PA1911-PA1910 as
    FemI-FemR-FemA. So PA1912/FemI is the sigma factor and PA1910/FemA, the gene reviewed here,
    is the TonB-dependent transducer. UniProt's names for the two entries agree.

    QuickGO was queried directly for femI (Q9I2J2) rather than read from the worklist, and the
    exchange is reciprocal: femA holds GO:0016987 sigma factor activity by IMP from this paper
    while femI has that term only by IEA and IBA; femI holds GO:0015344 siderophore uptake
    transmembrane transporter activity by IMP from the same paper while femA has it only by IBA.
    Each gene received the other's experimental molecular function and kept only electronic
    support for its own. The GO:0005829 cytosol NAS on femA belongs with the sigma factor too.
    The GO:0015891 process row, by contrast, is on both genes and defensible on both, so the
    exchange is confined to the two MF rows and the NAS - stated explicitly in the review so the
    defect is not read as a wholesale mix-up.

    Recorded at CONFIRMED. It does not need the full text and does not rest on
    PMID-proximity-style reasoning: the abstract defines which locus is which, which is the
    project's confident case, and the reciprocal row on the other gene is another. The record
    settles it independently - femA is an 804-residue multi-pass outer-membrane beta-barrel of
    the TonB-dependent receptor family by two curated UniRule systems, with a plug domain, an
    STN signalling domain, PE 1 and two PDB structures. An ECF sigma factor is a small
    cytoplasmic DNA-binding protein, which is why femI carries DNA-binding and
    transcription-factor rows and femA carries none. A useful check: the four merged members of
    this claim accept the term because "the ECF sigma domain architecture is complete", and femA
    fails that same criterion.

    Three rows removed. GO:0016987 and GO:0005829, each WRONG_GENE_PRODUCT / REPOINT to Q9I2J2
    at CONFIRMED. And GO:2000142 regulation of DNA-templated transcription initiation, whose
    supporting_entities is GO:0016987 itself: it is computed from the row being repointed and
    falls with it, recorded as an OVER_PROPAGATION consequence against GOA at PROBABLE rather
    than as a third wrong-gene claim, because the inference pipeline behaved correctly on a
    wrong input.

    GO:0034756 regulation of iron ion transport is KEPT, deliberately, and the reasoning is
    stated because the neighbouring rows went. FemA is a transducer, not a plain receptor: the
    STN domain transmits siderophore occupancy inward to FemR, releasing FemI. Initiating that
    cascade is doing part of the work of regulating iron transport, so the term is right on
    femA's own account. The review therefore gives femA two core functions, transport and
    signalling.

    The IBA node is sound and says so: every donor for PTN000793005 was resolved against the
    UniProt API and all are characterised TonB-dependent siderophore receptors - FhuA, FhuE and
    Fiu of E. coli, FptA, FpvA, foxA and fiuA of this organism. Two donors from the target
    species make it well grounded.

    Granularity calls: GO:0019867 outer membrane is TOO_GENERAL (it does not say which outer
    membrane; GO:0009279 is its child, verified in OLS) while GO:0015343 is KEPT rather than
    marked general, because it already names substrate and mechanism and GO:0015344 adds only
    direction - the 2026-11-14 ruling says keep a respectably specific term. Both GO:0015891 and
    GO:0033214 are kept: checked in OLS, neither is an ancestor of the other.

    Consequence for the claim: once repointed, the GO:0016987 group becomes the five sigmas the
    abstract names, with PA1912 in femA's place.

    One error of mine, caught and fixed before commit: a first draft invented a duplicate
    GO:0015343 row that is not in the GOA.

    Batch context: this gene is one of the nine-gene PseudoCAP tier-3 batch, and one of five that
    were each the LAST unreviewed member of a molecular-function shared claim whose other members
    are already merged. Reviewing them gene by gene was therefore sound - each closes a group
    rather than opening one - provided each was read against its merged siblings first, which is
    what the house-style comparisons recorded above are.

    The worklist's review_folder fields are NOT updated here. build_pseudocap_mf_worklist.py
    derives them by scanning for any *-ai-review.yaml on disk, so regenerating mid-batch would
    have marked the then-unreviewed stubs as done. Now that all nine of the batch are reviewed
    the worklist can be regenerated, which is also what the shared-claim audit script needs
    before it will report these groups as complete.
