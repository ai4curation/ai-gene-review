  summary: 'Review lhpL (PA1255): PseudoCAP 4-hydroxyproline epimerase seed is the
    wrong isomer'
  details: |
    Reviewed all 5 GOA rows. The three GO:0047580 rows (IBA from PTN002433936, ARBA IEA, PseudoCAP IMP from PMID:27145750) were MODIFYed to GO:0050346: Swiss-Prot records experimentally (ECO:0000269|PubMed:17849014) that Q9I489 has no trans-4-hydroxy-L-proline epimerase or proline racemase activity, and assigns it the trans-3-hydroxy-L-proline dehydratase/2-epimerase reactions (PMID:27929065). PAO1's real 4-hydroxyproline 2-epimerase is PA1268. The two GO:0050346 rows (EXP, IEA) were ACCEPTed as the core function. Source defects filed against PSEUDOCAP (WRONG_TERM on the IMP row) and GO_CENTRAL (WRONG_TERM on PTN002433936, sole-seeded, 35 GOA rows in with/from). Proposed a new term for the trans-3-hydroxy-L-proline 2-epimerase half of the activity. Added notes with a PseudoCAP IBA-seed assessment table (verdict WRONG) and a bioinformatics folder with the PANTHER node composition and QuickGO propagation counts.
