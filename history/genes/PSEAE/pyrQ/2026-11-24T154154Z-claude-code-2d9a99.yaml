  summary: 'Round 1 of review on PR #6876: refine GO:0006221 to GO:0044205'
  details: |
    GO:0006221 pyrimidine nucleotide biosynthetic process was accepted while its reason argued for
    the third step of de novo pyrimidine biosynthesis. Changed to MODIFY with GO:0044205 'de novo'
    UMP biosynthetic process, following the call the repo already made on the sibling enzyme
    (genes/PSEPK/pyrC marks GO:0006221 TOO_GENERAL and keeps GO:0044205; P. putida PyrC carries it
    in GOA).

    The row's own evidence reaches the specific pathway: complementing an E. coli pyrC mutant is
    complementing a de novo defect, and an absolute pyrimidine requirement is the phenotype of a
    cell that can no longer make pyrimidines de novo but can still salvage them, whereas pyrimidine
    nucleotide biosynthesis in general would also be satisfied by salvage.

    Stated explicitly in the reason that, unlike P. putida pyrC, Q9HT33 is an unreviewed entry with
    no CC PATHWAY line, so the de novo assignment is an inference from those two genetic results
    rather than a transcription from the record. core_functions.directly_involved_in moved with it.
