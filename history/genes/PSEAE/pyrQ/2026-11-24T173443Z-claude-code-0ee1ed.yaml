  summary: 'Round 5: one donor attributed to the wrong row of the same node, twice'
  details: |
    Escherichia coli AllB (P77671) seeds the GO:0004038 IBD at PTN000909483 but not the GO:0006145
    one, which rests only on AGI_LocusCode:AT4G04955 and UniProtKB:Q5B4C7. Two consequences of
    treating them as one:

    The GO:0006145 row's propagation_review listed P77671 as a source entity, but that row's own
    with/from, in both the review and the GOA file, is AT4G04955 | PTN000909483 | Q5B4C7. The block
    had been copied from the GO:0004038 row with only the SGD entry removed. P77671 dropped; it
    remains correctly on the GO:0004038 row.

    The notes generalised the leaf-target derivation across both terms using the seed argument, which
    holds only for GO:0004038. Split it. For GO:0004038, pruning at PTN002462789 would strip the term
    from a member that helped seed it. For GO:0006145 the reason is different and stronger: both of
    that IBD's seeds come from organisms with urate oxidase, while PTN002462789 holds E. coli AllB,
    which has none, so a loss there would decide for AllB's branch the taxonomic question the node
    assessment explicitly defers. The same sentence is now on the GO:0006145 node assessment, where
    a reader meets the target.
