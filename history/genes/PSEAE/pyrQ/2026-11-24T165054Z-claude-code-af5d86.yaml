  summary: 'Round 3: correct the inverted PAINT topology; the fix is ADD_IRD, not
    a re-rooting'
  details: |
    The review stated the PTHR43668 tree backwards in three places, calling PTN000182407 the
    ancestor and PTN000909483 the misplacement. The repository's own extraction settles the
    direction: panther_paint.py documents the with/from field of an IRD or IKR row as holding the
    ANCESTRAL gain node, and loss_nodes_by_ancestor maps an IRD at PTNa naming PTNb to
    {'PTNb': {'PTNa'}}. The three IRD rows sit AT PTN000182407 and name PTN000909483, so
    PTN000909483 is the ancestor and PTN000182407 is a loss node beneath it. An IRD at an ancestor
    would be inert, which is the internal tell.

    What PAINT actually did is a better story than the one the review told: it asserted allantoinase
    at the family node from four genuine allantoinases, then recognised a bacterial sub-clade that
    had switched chemistry, pruned all three allantoinase terms there, and asserted GO:0004151 from
    Aquifex aeolicus PyrC in their place.

    Resolved the leaf rather than inferring it. gene_paint_losses reports 'No IRD or IKR loss on this
    gene's lineage', and the tree gives the leaf as PTN002462798 with PTN000909483 in its ancestry
    and PTN000182407 absent. This excludes the alternative the reviewer raised: the 20260617 IRD rows
    have NOT withdrawn the 20200810 and 20170228 IBAs, because they do not lie on this lineage, so
    the cached GOA is current and the rows are mechanically correct.

    The conclusion is unchanged but the upstream ask is different: not a re-rooting of the leaf but
    an added loss on its branch, extending to PTN002462798 the pruning already done at PTN000182407.
    Both REMOVE actions stand. Rewrote the two reasons, both PANTHER source_entities labels (the
    PTN000182407 entry is now NOT_RELEVANT rather than SUPPORTS_TRANSFER, since it is not on this
    gene's lineage), and the notes section.
