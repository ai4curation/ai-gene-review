  summary: 'Review pyrQ (PA5541): confirmed dihydroorotase misplaced in the PANTHER
    allantoinase subfamily'
  details: |
    Created the review for PA5541. The IMP rows for GO:0004151 and GO:0006221 are accepted on
    PMID:15278241, whose abstract names PA5541 as pyrC2, reports complementation of an E. coli pyrC
    mutant, and reports that the pyrC pyrC2 double mutant is an absolute pyrimidine auxotroph while
    neither single mutant is.

    Removed GO:0004038 allantoinase activity and GO:0006145 purine nucleobase catabolic process, both
    IBA from PANTHER:PTN000909483. The argument is node placement, not donor strength: PTHR43668's
    PAINT file asserts GO:0004151 by IBD at the ancestor PTN000182407, seeded by Aquifex aeolicus PyrC
    (O66990, experimental EC evidence), and keeps the three allantoinase terms out of that ancestor
    with explicit negated IRD rows. The leaf is an experimentally confirmed dihydroorotase that sits
    on the wrong side of that boundary. Checked that P. aeruginosa PAO1 has no entry with EC 3.5.2.5
    at all, and that its other dihydroorotase (P72170, pyrC/PA3527) is annotated as one. Donors
    verified against the UniProt API and SGD: P77671 E. coli AllB, SGD:S000001466 DAL1, Q5B4C7
    Aspergillus nidulans, AGI_LocusCode:AT4G04955 Arabidopsis ALN - all genuine allantoinases, so the
    node is sound. propagation_review recorded on both rows.

    The three IEA class terms were split rather than treated alike, following the 2026-11-14 ruling:
    GO:0016787 (IPR006680) and GO:0016810 (IPR011059) are TOO_GENERAL because their signatures are
    superfamily-level, while GO:0016812 is MODIFY to GO:0004151 because its own supporting entity is
    IPR002195, Dihydroorotase_CS, matched on the record as PROSITE PS00483.

    A member exception for Q9HT33 on PTHR43668's GO:0004038 term assessment would be the matching
    family-review change; not made here, to keep this PR to its own slice.
