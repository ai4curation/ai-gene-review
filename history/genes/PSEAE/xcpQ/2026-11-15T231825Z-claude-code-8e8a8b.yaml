  summary: Propose a transporter activity for the XcpQ secretin
  details: |
    Answered this review's own open question: added a NEW IC row and a core molecular function for GO:0008320 transmembrane protein transporter activity. The secretin is the component that forms the pore, fifteen copies spanning the outer membrane, and loss of XcpQ blocks export of the Xcp substrates, so the activity belongs to it rather than to the complex. Matches the assignment already made for the KT2440 ortholog; the remaining question is whether a gated-channel term would be preferable.
