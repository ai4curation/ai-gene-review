  summary: Full review of P. aeruginosa pilN (PA5043); PseudoCAP IBA-seed assessment
    of the three PTN002220336 IBDs
  details: |
    Reviewed all 9 GOA rows. The PseudoCAP located_in type IV pilus IMP (PMID:7565110), sole seed of the PTN002220336 GO:0044096 IBD (added 2026-06-17, not yet in GOA for pilN), records a no-fimbriae mutant phenotype as a location; PilN is a bitopic inner-membrane alignment-subcomplex protein. Row removed with PSEUDOCAP and GO_CENTRAL defects (INDIRECT-PHENOTYPE). The motility and assembly seeds (IMP PMID:7565110, PMID:19857645) are SOUND; the node's 7 leaves are all PilN subfamily members, so those IBAs are accepted. Plasma membrane EXP and IEA accepted. Core function: inner-membrane anchor of PilMNOP linking PilM to PilO/PilP/PilQ.
