  summary: Refine the siderophore rows to GO:0044718 and raise the missing is_a
  details: |
    PR #6019 review item 2. Three MODIFY rows proposed GO:0015891 siderophore transport as a replacement for GO:0055085 transmembrane transport, which is not a descendant. The replacement is now GO:0044718 siderophore transmembrane transport, the only transmembrane-specific siderophore process term and one whose definition is explicitly membrane-crossing. go-basic.obo and QuickGO (checked 2026-11-06) show GO:0044718 is_a GO:0015891 only, so neither term sits under GO:0055085 and the refinement does not formally retain the transmembrane ancestry; the reasons state this, and a suggested_questions entry asks whether GO:0044718 should gain that is_a, noting that sibling terms such as GO:0034219 carbohydrate transmembrane transport do sit under GO:0055085. The node-level claim is not disputed.
