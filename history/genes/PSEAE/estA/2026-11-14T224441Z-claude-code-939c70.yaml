  summary: Re-review estA rows against the full text of PMID:17631636
  details: |
    The earlier estA review was made from the abstract of PMID:17631636 alone, because the repository cache for that PMID is abstract-only (ai-gene-review fetch-pmid --force retrieves nothing for PMC2045186 by either the HTML or PDF route). The publisher version (J Bacteriol 189:6695-6703, doi:10.1128/JB.00023-07) was supplied directly and read in full.

    Corrected two mechanistic claims the review had made from the abstract. GO:0048870 cell motility had attributed the motility defect to reduced rhamnolipid; the paper adds wild-type amounts of rhamnolipid back to the mutant's medium without restoring motility and concludes the rhamnolipid deficiency is not the reason for the motility defects. GO:0044010 biofilm formation had attributed the biofilm phenotype to rhamnolipid as well; the authors attribute it to the mutant's non-motility, since the biofilms show reduced surface coverage and clonal-only expansion.

    Strengthened without changing the two biosynthetic-process over-annotation calls. For GO:0008610 and GO:0009247 the authors state there is no obvious function in the rhamnolipid biosynthesis pathway requiring an esterase, report no intracellular rhamnolipid accumulation (excluding an export or turnover block), and find rhlB and rhlC downregulated in the mutant, placing EstA upstream of the enzymes that do the biosynthetic work. Escalation to REMOVE was considered and rejected: the requirement is real and depends on catalytic activity, so the rows assert the wrong relation for a genuine dependency rather than something false.

    Sharpened GO:0071973, which names the one motility form the paper cannot account for: type IV pilus genes are downregulated, explaining twitching and swarming, but no flagellar gene expression change was detected to explain the loss of swimming. Added the Ser38 identity to the GO:0052689 row, verified against the displayed O33407 sequence (GDSL motif, UniProt ACT_SITE 38 and MUTAGEN 38 citing this paper).

    No supporting_text quotes were added from the full text: quotes must be verbatim substrings of the cached publication, and the cache holds only the abstract, so the full-text findings are recorded as findings[].statement and in row reasons instead. No action values changed.
