  details: |
    Full reviews of SALTY sseJ, VIBCH VC_A0218, ARATH APG__Q9LU14 and ARATH At5g03810 tested the clade argument against evidence instead of leaf names, and corrected it twice. SseJ is a glycerophospholipid:cholesterol acyltransferase (PMID:19887681, PMID:18333886), so GO:0008610 is defensible for it by participation; it sits in the SF141 clade PTN005220549 with VC_A0218 and Xanthomonas EstA, separate from the SF139 autotransporter carboxylesterases that hold both seeds. OSP1 (Q9SJB4) is a characterised plant leaf with IDA thioesterase activity and a wax phenotype (PMID:32542680). Neither rescues the LUCA-level IBD, so the request changed from withdrawal to re-scoping, with requested_change CHECK.
