  summary: Make the P80357/P80358 SIMILARITY defect cross-reference symmetric
  details: |
    PR #6019, review suggestion. The astA entry restored in a8f5394 points at this one, so a curator reading the P80357 report learns that both chains of the heterotetramer carry the same wrong CC:SIMILARITY family line, while a curator reading the P80358 entry did not. The asymmetry was introduced by the consolidation, which rewrote the alpha-chain entry and left this one as it was. Added the matching sentence here, so each entry names the other and either entry point leads a curator to fix the pair together. Verified in the regenerated UNIPROT.md: both SIMILARITY entries now name the other accession.
