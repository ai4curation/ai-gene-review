  summary: 'Create review: pqsA, the anthranilate-CoA ligase priming the alkylquinolone
    pathway'
  details: |
    First review for pqsA (PA0996, Q9I4X3), one of the two tier-1 PseudoCAP genes whose review
    files the project page recorded as still to be written. Six GOA rows, four accepted, one
    TOO_GENERAL, none removed.

    The biology is clean. PqsA is the anthranilate--CoA ligase (EC 6.2.1.32) that primes
    anthranilate for the 2-alkyl-4(1H)-quinolone pathway: anthranilate + ATP + CoA ->
    anthraniloyl-CoA + AMP + diphosphate (RHEA:10828). PqsD then condenses that thioester with a
    malonyl donor to build the quinolone ring, and PqsH hydroxylates HHQ at C3 to give PQS.
    Direct evidence is a purified His-tagged enzyme (PMID:18083812), with a 3 uM Km for
    anthranilate against 22 uM for CoA and 71 uM for ATP, and the gene deletion abolishes not
    only PQS but DHQ and the other quinolines, so the enzyme sits at the single committed entry
    point to the whole family rather than to PQS alone.

    Two judgements are worth recording because they went against the obvious reading.

    The first is a NEW row I did not propose. GO:0009372 quorum sensing has a definition that
    explicitly covers "producing small, diffusible, signal molecules", and PQS is a
    quorum-sensing signal, so a synthase of it looks like a candidate. The comparator check the
    project prescribes says otherwise, and the check is trustworthy here because it returns
    positives: four PSEAE genes in this corpus carry GO:0009372 (fabY, hfq, mexT, ppx), so an
    absence is informative rather than a malformed query. Within the signal-making machinery
    the term is absent everywhere - lasI, the canonical AHL synthase, does not carry it, and no
    pqs gene does - while every pqs biosynthetic gene in the corpus carries GO:0044550 instead.
    That is a convention: the synthases get the biosynthesis term and the quorum-sensing term
    goes to the detectors and regulators. Filed as a suggested question so the convention is
    stated rather than rediscovered gene by gene.

    The second is the parent MF term. The IBA on GO:0016878 acid-thiol ligase activity comes
    from the PAINT IBD at PTN002458530, and the gene's own accession appears in its WITH/FROM,
    which is the expected marker of experimental grounding on the target rather than
    circularity. I kept the row rather than sharpening it or calling it uninformative. Not
    MODIFY, because this row's own evidence is a node spanning substrates - PANTHER's family is
    PTHR43352 "ACETYL-COA SYNTHETASE" and confines anthranilate specificity to subfamily SF1,
    and the WITH/FROM includes an M. tuberculosis member - so the node's claim cannot reach the
    substrate, and the deeper term is already asserted by IDA on its own row. Not TOO_GENERAL
    either, because EC 6.2.1 thioester chemistry is real mechanistic information and is the
    level at which the function is inherited. The ARBA row on bare GO:0016874 ligase activity is
    the one that is uninformative on its own, and that is where TOO_GENERAL went.

    The IMP on GO:0044550 is accepted with a caution rather than extended. The screen that
    identified the mutant scored pyocyanin, and pyocyanin loss is a regulatory consequence of
    losing the PQS signal, not evidence that PqsA acts in phenazine biosynthesis; no phenazine
    term is proposed. The row itself is sound because PQS, HHQ and DHQ are secondary
    metabolites made by this pathway.

    On specificity: the purified enzyme also turns over benzoate and halogenated anthranilates.
    That is substrate breadth of an AMP-binding enzyme rather than a second function - the Km
    for anthranilate is low micromolar, nothing in PAO1 draws on this locus for a benzoate
    thioester, and the deletion abolishes the quinolines - so no benzoate-CoA ligase term is
    proposed. It is recorded as a question and an experiment instead, since the same breadth is
    what makes anthranilate analogues useful inhibitors.

    One ontology gap proposed: a 2-alkyl-4(1H)-quinolone biosynthetic process term. GO has the
    molecular function GO:0102164 for the final PQS-forming step but no process term for the
    pathway, so the whole pqsABCDE operon sits on GO:0044550, which cannot distinguish
    alkylquinolone synthesis from pyoverdine or phenazine biosynthesis in the same organism.
    Checked before proposing: an OLS search for a quinolone biosynthetic process returns
    nothing while the same search style resolves GO:0102164, so the gap is real rather than a
    failed query.

    Provider deep research was attempted and is not usable. Perplexity is not a configured
    provider, and the asta run returned twenty citations - bioinformatics databases, grey seal
    influenza, bovine spermatozoa, saffron pharmacology, PCOS - none of which concern this gene
    or organism; the retrieval keyed on the template's boilerplate rather than on the gene. The
    output was discarded rather than committed under a provider name, and pqsA-notes.md records
    the research instead, as the project rule prescribes for a failed run.

    Validation: just validate PSEAE pqsA passes, its one warning being UV_NATIVE_TLS deprecation
    noise; quote_check verifies every supporting_text; record_section values were backfilled by
    the tool rather than written by hand (8 added, 0 mismatched).
