- type: EDIT
  outcome: changed
  sections:
  - proposed_new_terms
  summary: >-
    The GO:0018189 correction created a tension three lines below it: naming a live chemical-class
    ancestor while the next sentence says those co-parents are all obsolete.
  details: >-
    Fourth instance in one day of the same shape - fix the cited claim, leave the sentence that
    travels with it. The correction named GO:0044283 small molecule biosynthetic process as a live
    ancestor of the precedent term, and three lines later the justification still said "the
    chemical-class co-parents a reviewer would reach for are all obsolete". Before the correction
    that sentence raised no question; after it, a GO editor reading the exported request sees a live
    chemical-class branch named and then told the chemical-class options are all retired, and will
    reasonably ask why the proposed term should not sit there too.

    The sentence was not false - it means the heterocycle, aromatic-compound and organonitrogen
    classes, and those three are obsolete - but it was doing its scoping implicitly in a field that
    goes to GO. It now says explicitly that a live chemical-class branch exists, that it is not
    proposed as a co-parent, and why: alkylquinolones are secreted signalling metabolites, the whole
    pqsABCDE operon already sits on GO:0044550, and a chemical-class parent adds nothing a GO editor
    cannot place better than this request can. The three obsolete classes are then named as the
    specific ones a reviewer would reach for.

    Pushed although the PR had just been approved and this was a non-blocking suggestion, because it
    is a defect my own commit introduced in an outward-facing exported field, which the project rule
    says to fix now rather than defer. The approval will need to be given again.

    Noted and not acted on: the observation that the four GO ids now in the justification sit in
    free text that obsolete_authored_terms.py does not walk, so a retired id there would be
    invisible - which is how the "same branch" error survived two rounds. That is a validation gap
    for the queued code work, not a change to this file. The ids are current and their labels
    verbatim.

