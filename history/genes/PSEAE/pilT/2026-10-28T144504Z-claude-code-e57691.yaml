  summary: Full review of P. aeruginosa pilT (PA0395) retraction ATPase; PseudoCAP
    IBA-seed assessment of the PTN002020799 ATP hydrolysis IBD
  details: |
    Reviewed all 9 GOA rows. The sole seed of the PTN002020799 GO:0016887 IBD, PseudoCAP IDA PMID:18174131 (purified His-PilT ATPase assay with Asp/His Box mutants), is SOUND; the 8 leaves (PilT, YggR, DotB, YPO0940) are secretion NTPases with conserved catalytic motifs, so ATP hydrolysis suits the node. Accepted ATP binding, cytoplasm (EXP, IEA), cytosol IBA, ATP hydrolysis (IBA, IDA), motility and pilus retraction TAS. Removed the PseudoCAP TAS located_in type IV pilus (PMID:20595000) with a PSEUDOCAP defect: PilT is the cytoplasmic motor, not part of the fibre.
