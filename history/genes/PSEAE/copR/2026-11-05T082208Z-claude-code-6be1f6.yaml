  details: |
    Tier-2 PseudoCAP IBA-seed review, with the node-level judgement for PTN000724188 recorded here for the batch. Seed verdict for the GO:0045892 IDA row on PMID:17449606 (full text read) at PTN000724188 (33 seeds for GO:0006355, 475 leaf IBAs): SOUND - CopR overproduction lowers oprD mRNA and abolishes OprD protein in both the wild type and a czcRS deletion, so the repression is attributable to CopR; direct promoter binding remains an inference from the P. syringae cop box. No PSEUDOCAP or GO_CENTRAL defect. One NEW row proposed, GO:0045893, for the CopR-dependent activation of czcR-czcS and czcC measured in the same experiments. Actions: 8 ACCEPT, 1 NEW, 1 TOO_GENERAL, 1 KEEP_AS_NON_CORE.
