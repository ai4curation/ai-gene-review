  summary: 'Audit of the PTN001252377 GO_CENTRAL defect: dropped the leaf list, argued
    from the GO definition and E. coli MotA'
  details: |
    The GO_CENTRAL WRONG_TERM/REPOINT entry on PANTHER:PTN001252377 (GO:0071978 -> GO:0071973) previously argued that the leaves include Aquifex, Thermotoga, Helicobacter pylori, Leptospira and Rhodopirellula stator proteins 'which have not been shown to swarm'. Leaf membership is correct (panther_tree.py: 29 leaves, 19 taxa, PTHR30433:SF2/SF3/SF4), but the claim is absence of evidence and three of the five names are submitter SubNames with ECO:0000313 (Q9WZE3, Q8F0B9/Q8F896, Q7ULV0); O67122 and P65410 have curated RecNames but no experimental GO annotation at all. The leaf list has been removed. The rewritten explanation rests instead on the ontology and on the clade's one experimentally characterised member: GO:0071978 is_a GO:0071973 (QuickGO) and its definition adds a lifestyle context ('the smooth movement of a group of cells along a solid surface'; 'Swarming motility is observed in groups of bacteria'), while E. coli MotA (P09348), the seed of this node's own stator-complex IBD, carries GO:0071973 by IMP, GO:0015252 proton channel activity, GO:0120101 stator complex by IPI, and no experimental swarming annotation. The behavioural absence claim was replaced with one checked annotation-state fact: in QuickGO (2026-11-06) every GO:0071978 row on the 24 non-PAO1 leaves is IBA or IEA. The propagation_review comment and the corresponding notes paragraph were rewritten the same way. Confidence left at PROBABLE: the weak claim was withdrawn and replaced with verified ones, but the call remains a term-scoping recommendation a PAINT curator could reasonably answer differently. just validate PSEAE motC passes with 2 pre-existing warnings.
