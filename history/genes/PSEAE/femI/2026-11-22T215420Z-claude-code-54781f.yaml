- type: REVIEW
  outcome: changed
  summary: Review femI, the second half of the femA/femI transposition and a second
    signalling system
  details: |
    The other half of the femA finding from batch 4, reviewed immediately after it so the
    transposition could be corrected from both sides.

    PMID:18086184 designates PA1912-PA1911-PA1910 as FemI-FemR-FemA and names PA1912 among the
    five ECF sigmas it overexpressed, so femI is the sigma factor and femA the outer-membrane
    transducer. Reviewing both revealed that the exchange is wider than the femA review could
    see: it covers not just the two experimental molecular-function rows but the two
    GO_REF:0000108 inter-ontology inferences built on them.

      row                        femI (sigma)              femA (transducer)
      GO:0016987 sigma activity   IBA+IEA, no experimental   IMP  <- belongs on femI
      GO:0015344 transporter      IMP <- belongs on femA     IBA only
      GO:2000142 (from 0016987)   ACCEPT, correctly derived  removed, derived from wrong row
      GO:0033214 (from 0015344)   REMOVED, from wrong row    ACCEPT, correct by IBA
      GO:0005829 cytosol          absent                     NAS <- belongs on femI

    Each gene carries one misplaced experimental row AND the inference computed from it, while
    the row it should have keeps only electronic support. That mirror symmetry is a stronger
    signature than either gene shows alone: a single mis-keyed accession would not reproduce the
    same error twice in opposite directions. GO:0033214 is therefore REMOVEd here as an
    OVER_PROPAGATION consequence at PROBABLE, exactly as GO:2000142 was on femA, and nothing is
    lost upstream because femA already carries GO:0033214 legitimately by IBA.

    The record rules out the transporter row on its own: 168 residues, sigma-70 regions 2 and 4,
    a winged-helix DNA-binding fold, and PANTHER subfamily PTHR43133:SF63 named for FecI, the
    E. coli ferric-citrate ECF sigma that is the paradigm for this kind of system. No
    transmembrane segment, signal peptide, barrel or plug. The ARBA-only SIMILARITY statement is
    deliberately not cited; the DR signature lines carry the argument.

    A sample of the 17 GO:0016987 IBA donors was resolved against the UniProt API rather than read
    from accessions: P23484 is E. coli FecI, P0AGB6 RpoE, Q06198 AlgU, G3XCV1 PvdS, Q9I193 FpvI,
    P9WGG7 Mtb SigE. The node and the gene's own family assignment agree, both pointing at FecI.

    GO:0015891 siderophore transport is KEEP_AS_NON_CORE rather than ACCEPT. This sharpens what
    the femA review said about the row being "defensible on both genes": it is, but it is core on
    the transducer and peripheral on the sigma factor, which induces the transport genes without
    performing any transport. Only reviewing both could establish which way round.

    A SECOND-ORDER FINDING, recorded for a human and not fixed. Checking house style across the
    four merged ECF sigma factors (PA0149, PA2050, foxI, vreI) gives identical verdicts on every
    term femI shares with them except one: GO:0006355 regulation of DNA-templated transcription is
    TOO_GENERAL on PA0149, PA2050 and foxI but MODIFY to GO:2000142 on vreI. This review follows
    the 3:1 majority, which the 2026-11-14 ruling also supports, since GO:2000142 is already
    asserted and accepted on the gene so there is nothing to propose. The important part is that
    the shared-claim audit CANNOT detect this: the script reads the molecular-function worklist
    and groups by (term, reference) over IMP rows, while GO:0006355 here is a biological-process
    term carried by IBA and IEA. It is the same structural blindness that hid the GO:0009103
    divergence in the wbpX/wbpY pair.

    femR (PA1911), the anti-sigma factor of this system, has no folder and no IMP MF row, so the
    Fem system is two-thirds reviewed. Recorded as a curation gap, not a knowledge gap.

    Batch 5 context: this gene is one of six in the fifth PseudoCAP tier-3 batch, branched from
    current main rather than stacked on the unmerged batch-4 branch. The batch was built around
    the femA/femI transposition, with vreR and fpvA included to test whether the same
    architecture carries the same error elsewhere.

    Two counts corrected while selecting the batch, both recorded in the fetch commit. PA1268 was
    originally chosen as the only remaining true shared claim but already carries a COMPLETE
    review from PR #6274, so the committed worklist's review_folder is stale for it. Measured on
    disk, 22 tier-3 genes genuinely remain once batch 4 merges, not the 32 the worklist and the
    project page both report.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  summary: 'PR review round 1: GO:0015891 was non-core on an argument that fails participation'
  details: |
    The GO:0015891 siderophore transport row was KEEP_AS_NON_CORE while its own reason opened
    "FemI performs no step of siderophore transport". That is the participation test failing, not a
    peripheral role: non-core is for a claim as precise as warranted but away from the core
    function, and this one placed the protein inside a process it does no work in. The same PR
    makes exactly this correction on fpvA (GO:0002049 to GO:1900706), and merged foxI sets the
    direction for a Fem-type ECF sigma by MODIFYing its GO:0034756 row to the positive term.

    MODIFY to GO:0034758 positive regulation of iron ion transport - a lateral
    participation-to-regulation correction, the long-sanctioned use of MODIFY whose replacement is
    not a descendant.

    The missing term was checked against GO rather than the corpus cache. The earlier review said
    no regulation-of-siderophore-transport term exists, citing the corpus snapshot, which holds
    only terms the corpus already uses and so proves nothing about GO. Checked properly in OLS: a
    search for one returns nothing, while "siderophore transport" returns 18 classes and
    "regulation of iron ion transport" 7, so the query shape can return a positive and the absence
    is real. The only siderophore regulation terms are for biosynthesis (GO:1900705, GO:1900706).
    GO:0034758 therefore regulates GO:0006826 iron ion transport, an ancestor of GO:0015891, so
    the replacement trades siderophore specificity for a correct relation to the gene product.
    GO:1904440 was weighed and rejected: "across plasma membrane" names the inner membrane in a
    Gram-negative, and the uptake this sigma switches on is TonB-dependent at the outer membrane.

    A cytosol location was added to the core function and then withdrawn. The reviewer noted the
    notes say the cytosol NAS row belongs to femI, but that row sits on femA, in batch 4, with a
    source defect asking for it to be repointed here. A NEW row on femI would become a duplicate
    once the repoint lands, so locations stays unset and the notes table remains the record.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  summary: 'PR review round 2: the notes and the row summary still described the withdrawn action'
  details: |
    The round-1 edit changed the GO:0015891 action but left two texts describing the old one. The
    notes file still said the row "is kept, as KEEP_AS_NON_CORE", and the row's own summary still
    said the claim "is defensible on both genes, though for different reasons" - which was the
    framing the correction overturned, since the row is a participation claim the transducer earns
    and the sigma factor does not, not one claim held at two levels of centrality.

    Both rewritten. The notes paragraph now records the withdrawn reasoning explicitly rather than
    silently replacing it, along with why the action does not follow from it, the OLS scoping of
    the missing-term claim with its positive controls, and the GO:1904440 rejection.

    This is the same class of defect as the overstatements in batches 4, 6 and 7, seen from the
    other side: there the prose outran the evidence, here it outlived a change to the structured
    field beside it. A changed action needs its own sweep of the texts that describe it - the row
    summary, the notes journal, and the PR body - none of which any validator checks.
