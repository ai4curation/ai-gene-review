  summary: 'Reconcile bacterial succinyl-CoA synthetase reviews: PSEAE sucC'
  details: |
    Compared with the PSEAE sucD, PSEPK and ECOLI sucC/sucD reviews; PMID:10671455 re-read in full. No action changed. core_functions moved from molecular_function to contributes_to_molecular_function (activity assayed with the mixed subunits) and the second entry given cytosol. Rate wording removed (no kinetic constants were measured; GTP formed from GDP alone at 50 uM; equimolar result is a 10-minute end-point). GO:0046777 stays REMOVE, now on subunit grounds only (the labelled protein is the alpha subunit SucD); source defect changed from WRONG_TERM to WRONG_GENE_PRODUCT with corrected value Q51567, still DELETE_ROW and PROBABLE. GO:0004550 reason records that the alpha subunit alone gave the transfer and that a host contaminant is not excluded. GO:0046872 TOO_GENERAL reason rewritten and given the Mg2+ quote. Cytosol IBA now quotes HAMAP family membership. Description of the Ndk result corrected. Duplicate UniProt reference removed. Dated section appended to the notes.

    Follow-up after independent checks (same day). The paper assayed the ligase reaction with the mixture of both subunits and with neither subunit alone, so the word only was removed from the GO:0004775 and GO:0042709 rows. The GO:0046777 reason now says that the beta subunit may take part in phosphorylating the alpha subunit but is not itself phosphorylated.
