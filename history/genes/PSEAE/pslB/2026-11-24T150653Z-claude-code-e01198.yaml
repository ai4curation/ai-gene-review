  summary: 'Review pslB (PA2232): wrong isomerase term, and a biofilm IDA the paper
    contradicts'
  details: |
    Created the review for PA2232. The cited paper (PMID:19659934) has full text cached via
    PMC4409829, so both PseudoCAP rows could be checked against the results rather than the abstract,
    and both are at odds with them.

    GO:0050089 mannose isomerase activity is MODIFY to GO:0004476. GO defines GO:0050089 as
    D-mannose = D-fructose (EC 5.3.1.7, the free sugar); the paper calls the activity the phosphomannose
    isomerase (PMI) activity of PslB, which is mannose-6-phosphate isomerase, EC 5.3.1.8. The UniProt
    record gives the phosphorylated reaction and the entry matches NCBIfam TIGR01479 (GMP_PMI). Filed
    as WRONG_TERM / REPOINT at CONFIRMED. GO:0004476 is already on the gene from the EC mapping.

    GO:0044010 single-species biofilm formation (IDA) is marked over-annotated. The paper states that
    deletion of pslB produced no observable attachment defect and that the pslB mutant showed abundant
    attachment; the defect and the loss of Psl require the pslB wbpW double mutant, which is a
    demonstration of redundancy. The same GDP-mannose also feeds A-band LPS, which is not a biofilm
    process. A WRONG_EVIDENCE_CODE / CHECK query at PROBABLE records both that the data are genetic
    rather than direct and that the single mutant has no phenotype.

    Two core functions recorded, the isomerase and the guanylyltransferase halves, both feeding
    GO:0009298.
