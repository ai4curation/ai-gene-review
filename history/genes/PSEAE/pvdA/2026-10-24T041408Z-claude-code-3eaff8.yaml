  summary: 'Create review: PSEAE pvdA (Q51548)'
  details: |
    Created the review for P. aeruginosa PAO1 pvdA (Q51548, PA2386), the experimentally
    best-characterized exemplar of the ornithine hydroxylation step in
    modules/pseudomonas_pyoverdine_precursor_supply.yaml. All 11 GOA rows reviewed from the cached
    literature and the curated UniProt record: GO:0031172 accepted on the two direct biochemical rows
    plus the Rhea-mapped row; GO:0002049 accepted on all three rows (the IDA from PMID:20650894 was
    kept rather than disputed -- that paper's abstract foregrounds the fungal SidA enzyme but states
    that the effect was also observed with bacterial PvdA, and the full text is not cached, so there is
    no basis for a wrong-gene claim); cytoplasm accepted as the core location with plasma membrane kept
    as supported non-core, which is how the peripheral inner-membrane topology and the cytosolic bulk
    of the protein are both represented. The GO:0006879 IBA from PAINT node PTN001009003 was modified
    to GO:0002049 on granularity grounds, with propagation_review recording that the node placement
    itself is sound. Added GO:0050660 FAD binding as NEW from the structures and the curated cofactor
    statement. Core function: ornithine N5-monooxygenase activity in pyoverdine biosynthetic process.
    Notes file records the family-grounding decision and that no provider deep research could be run
    here (perplexity unavailable, falcon authentication failure); no deep-research file was fabricated.
    just validate PSEAE pvdA is clean.
