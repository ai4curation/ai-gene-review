- type: EDIT
  outcome: changed
  summary: 'Soften the GO:0016491 argument: NCBIfam does name a dehydrogenase'
  details: |
    Found while addressing the review on the sibling module PR #6835, not raised by a reviewer here. The earlier commit justified not MODIFYing the formylglycine-generating oxidase row to a general oxidoreductase term by saying nothing establishes that PvdO is itself an oxidoreductase. That is too absolute, and it is the same failure mode as the pvdN structural claim corrected in the previous commit: an absolute negative asserted without checking. NCBIfam's dedicated model for this protein, NF051459, carries the product name dihydropyoverdine dehydrogenase, mapped to GO:0002049, visible in this repository's own RefSeq results for the P. putida ortholog; a product name is a property of the HMM rather than of the organism it is applied to. So a curated resource does name both the substrate and the reaction type, and both match the step exactly. The verdict does not change, but the argument now states the case against itself and says what decides it: a family product name is a curated prediction, and the one measurement reported on this protein found it inactive and without a detectable cofactor, so a catalytic term would assert precisely what the only assay failed to show. The NCBIfam row is added as a new file reference with a finding recording that it is the case against this verdict, so a reader who weighs the prediction more heavily than the failed assay can see it.
