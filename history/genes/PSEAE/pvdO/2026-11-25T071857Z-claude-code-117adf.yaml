  summary: Core function said PvdO carries out the second oxidation; its own knowledge
    gap says that is unknown
  details: |
    The core function description opened 'carries out the second oxidation that converts
    dihydropyoverdine into the mature fluorophore', while the knowledge gap eight lines below it says
    'whether it performs the second oxidation on its own, or whether it needs a partner such as PvdP
    or a dedicated electron transport system' is not known. The row asserted a catalytic role the
    same entry says is unestablished.

    The evidence is a deletion phenotype: mutants lacking PvdO accumulate the dihydropyoverdines,
    which places the step after PvdP's and shows PvdO is needed for it. It does not show PvdO
    catalyses it, and no activity has been measured on the purified protein, which came out of a
    heterologous host with no detectable cofactor and inactive.

    Reworded to 'required for the second oxidation', with the catalyst-versus-accessory-factor
    question stated explicitly and the deletion-phenotype basis named. This is the formulation the
    merged module pseudomonas_pyoverdine_periplasmic_maturation uses — it models the step as one
    PvdO is required for, names the node an oxidation factor, and asserts no molecular function —
    so the gene review and the module now agree. No molecular function term was asserted on this
    core function before or after; only the prose overstated.

    The top-level description is deliberately left alone. 'Together with the tyrosinase PvdP it
    carries out the oxidative cyclisation' is a joint statement about the pair, and it apportions
    the steps with 'the second oxidation depends on PvdO', which is the correct hedge.

    One thing checked and deliberately not changed: the 13 reference_section_type: RESULTS values on
    PMID:30386787, a REVIEW article with no results section of its own. A corpus parse of 12316 gene
    reviews shows RESULTS already used 34 times on REVIEW-article PMIDs and LITERATURE_REVIEW used
    zero times, so these rows follow existing practice. Changing them on one gene would invent a
    convention in the worst place to introduce one; it is a corpus-wide question if it is one at all.
