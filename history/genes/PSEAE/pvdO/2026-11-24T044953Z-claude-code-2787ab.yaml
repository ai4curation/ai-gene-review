  summary: 'Review pvdO: formylglycine-generating oxidase row marked over-annotated'
  details: |
    Reviewed the FGE-fold protein that performs the second oxidation of the pyoverdine chromophore. Three GO:0002049 IMP rows ACCEPTed. The GO:0120147 formylglycine-generating oxidase IBA from PTN001139750 is MARK_AS_OVER_ANNOTATED, not REMOVEd. The donors were resolved against the UniProt API: Q8NBK3 human SUMF1, Q9F3C7 Streptomyces coelicolor FGE, I6Y8I5 Mycobacterium tuberculosis FGE. Two are bacterial, so the usual taxonomic-distance objection does not apply and the node is well seeded; the problem is substrate, not fold. The term names the cysteine in a sulfatase active site, while PvdO acts on a siderophore chromophore, and UniProt gives the protein its own NCBIfam, NF051459 pyoverdine_PvdO. Over-annotated rather than removed because the fold and oxidative chemistry class are right, the mechanism may be homologous, and no activity has ever been measured: purified PvdO had no detectable cofactor and was inactive, so there is no assay result to set against the PAINT judgement. No new term proposed for the step: the review's own language is putative oxidoreductase, which is not a precise enough reaction to write a definition from. Recorded as two BIOLOGY knowledge gaps instead.
