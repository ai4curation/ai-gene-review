  details: |
    Locus tag corrected from PA2390 to PA2395 in the description and notes, per the OrderedLocusNames line of the record fetched in this PR. Calcium-binding feature count corrected from six to five. Added the crystal structure to the over-annotation argument: PDB 5HHA, 1.24 A of residues 22-284 with calcium bound, which means the FGE fold is observed rather than predicted, and - more useful for the verdict - the people who solved it deposited it as Chromophore maturation protein, a second independent naming on the record that agrees with the pyoverdine reading over the sulfatase-maturation one. Also added the explanation the reviewer asked for on why the row was not MODIFYed to a general oxidoreductase term: the project's MODIFY bar needs this row's own evidence for the replacement, and nothing establishes that PvdO is itself an oxidoreductase - the review calls it putative, the purified protein was inactive and cofactorless, and it may work only in association with another component. A MODIFY would trade a term wrong about the substrate for one possibly wrong about whether this protein catalyses anything.
