- type: EDIT
  outcome: changed
  summary: Drop the false independence claim on the 5HHA deposition name
  details: |
    The approving re-review on PR #6826 noted that PDB 5HH9 and 5HHA come from the same lab in the same month, and that the two reviews weigh them differently without saying so. Verified: 5HH9's depositors are Xia, Bai, Liu, Li, Xu, Chen, Yao, Gu and 5HHA's are Yuan, Shang, Bai, Xia, Gu, so Xia, Bai and Gu are on both, and both were submitted to the PDB in January 2016. This review called NCBIfam and the depositors two independent namings, which is false, and the pvdN review discounts the same group's deposition title. The word independent is removed and the asymmetry is now stated with its reason: 5HH9's title claims Structural and Biochemical Characterization of a specific enzyme activity, a strong claim that publication would have tested, whereas 5HHA's title is only a name and asserts no activity, so a strong unpublished claim is discounted while a weak unpublished label is weak corroboration. The row's weight is also now stated to rest on the NCBIfam model and the mutant phenotype rather than on the deposition name. The verdict does not change.
