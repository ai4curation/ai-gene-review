  summary: 'Round 1 on #6966: the same overstatement survived in two review.reason
    fields'
  details: |
    The first commit fixed core_functions.description and left the identical catalytic claim in the
    review.reason of two of the three GO:0002049 rows in the same file. Line 154 read 'participation
    rather than mere necessity: PvdO performs the second oxidation of the chromophore itself' - which
    adjudicates, in favour of participation, exactly the question the commit had just said the
    deletion phenotype cannot settle. So the file argued both ways from one piece of evidence, and the
    stated goal was met in one of three places.

    Both ACCEPT verdicts stand; the reasons now rest on ground that holds either way, which is a
    stronger argument than the one they replace because it does not need the open question resolved:
    PvdO acts on dihydropyoverdine, an intermediate, in the compartment where the pathway's last steps
    occur, and is not a substrate of the pathway, so it does part of the work whether it catalyses the
    oxidation or enables it.

    Also reframed the core function's statement of what is open. Saying 'whether PvdO is the catalyst
    or an accessory factor is not established' overstated the uncertainty in the other direction: the
    pathway review puts PvdO and PvdP together as 'the only enzymes that are directly involved in the
    formation of the pyoverdine fluorophore', a quote already carried on this core function. What the
    review leaves open is the mechanism - alone, with PvdP, or with a dedicated electron acceptor - not
    the involvement.

    Correction to this chain's own provenance, recorded here because records are append-only. The
    record at 2026-11-25T071857Z states that a corpus parse found 'LITERATURE_REVIEW used zero times'.
    That is true only among REVIEW-typed PMIDs, which is what the parse was scoped to; corpus-wide the
    value appears 235 times across 62 gene reviews. The decision it supported - leave the 13
    reference_section_type RESULTS values on PMID:30386787 alone, because RESULTS is already used 34
    times on REVIEW-typed PMIDs - is unaffected, since that count was correctly scoped. The sentence
    was not.

    Three instances of one mechanism in this PR: a statement true of the narrower thing I checked,
    written as though true of the wider thing. The core function, then the two reasons, then my own
    note about the corpus.
