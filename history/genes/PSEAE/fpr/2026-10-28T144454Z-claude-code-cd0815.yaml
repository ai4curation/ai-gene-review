  details: |
    Initial review following projects/PSEUDOCAP/REVIEW_PROTOCOL.md. PseudoCAP IDA GO:0042167 heme catabolic process (PMID:17915950) sole-seeds the IBD at PTN002500048: OVER-SPECIFIC. Under the participation test FPR, as the direct electron donor of heme oxygenase (cofactor case), does part of the work, so the seed is accepted for fpr (comparator caveat: mammalian POR lacks the term, FDXR has steroid biosynthesis). Heme degradation is partner-specific and the node includes E. coli and Salmonella Fpr; GO_CENTRAL defect recorded. FNR activity ACCEPT; oxidoreductase MODIFY to GO:0004324; NEW GO:0003958 NADPH-hemoprotein reductase activity.
