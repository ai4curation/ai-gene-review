  summary: Correct the TIGR01708 InterPro attribution
  details: |
    Review round on PR 6489. The InterPro2GO rows said IPR022346 corresponds to NCBIfam TIGR01708. InterPro's own record shows otherwise: TIGR01708 is integrated by IPR049875 (Type II secretion system minor pseudopilin GspH), while IPR022346 is the Pfam PF12019 GspH domain and IPR002416 its parent family. The rows are still accepted; only the attribution is corrected.
