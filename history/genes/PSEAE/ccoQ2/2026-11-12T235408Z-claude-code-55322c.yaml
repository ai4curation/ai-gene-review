  summary: 'Create review: ccoQ2, uncharacterised small component of the cbb3-2 oxidase'
  details: |
    Reviewed as part of the cbb3 oxidase group from the new tier-3 PseudoCAP worklist, whose shared_claims block flags GO:0004129 / PMID:14763990 as one claim spread over six proteins. PseudoCAP entered that identical IMP row on 20190311 for all eight subunits of both cbb3 operons, so a whole-operon deletion phenotype was transferred to each subunit; the cached paper is abstract-only and reports only isoform-level results ("only loss of cbb3-1 influenced growth"). None of the six seeds a PAINT IBD node, so no propagation_review applies and the IBA rows on the ccoN entries are received. A structural check against the RCSB API established that PDB 8SMR and 8SNH, the two cryo-EM supercomplex models cross-referenced from the CcoO entries, were built with the orphan CcoN paralogue PA4133 (Q9HWP8) plus CcoO1 and CcoP1/CcoP2, and contain no CcoQ chain. The eight subunits were then differentiated on evidence rather than uniformly, following the principle stated in the human COX reviews that the catalytic activity resides in the subunit carrying the binuclear centre. Specific to ccoQ2: identical in every checkable respect to ccoQ1 (Pfam FixQ, 61 residues, one transmembrane helix at 6-26, no cofactor, protein existence 4) and carrying the same two GOA rows, so the same decisions apply for the cbb3-2 operon: MARK_AS_OVER_ANNOTATED on GO:0004129, KEEP_AS_NON_CORE on GO:1902600, and a BIOLOGY knowledge gap on what the chain does.
