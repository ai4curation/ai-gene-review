  summary: Full review of cif (PA2934, CFTR inhibitory factor epoxide hydrolase);
    PseudoCAP IBA-seed assessment of PTN002458043 and PTN000863140 (both SOUND)
  details: |
    New review of all 3 GOA rows plus 2 proposed rows. GO:0004301 epoxide hydrolase activity (IDA, PMID:20118260) ACCEPT and core: direct enzymology on purified protein, 1.8 A structure with the Asp129-His297-Glu153 triad, measured epibromohydrin (0.25 U/mg) and cis-stilbene oxide turnover, and tested absence of haloacetate and haloalkane dehalogenase activities. That row is the sole seed of PTN002458043 (38 leaf IBAs) - verdict SOUND - and one of 13 seeds of the broad PTN000863140 hydrolase activity IBD (791 leaf IBAs) - also SOUND, since the Asp-nucleophile alpha/beta hydrolases mix EH and dehalogenase specificities and the generic term is the cautious choice at that depth. The GO:0016787 IBA on this gene is MODIFY to GO:0004301 (granularity, node not disputed). GO:2001226 negative regulation of chloride transport ACCEPT with a PSEUDOCAP WRONG_REFERENCE CHECK defect: the cited PMID:16236828 used an unfractionated cell-free filtrate and predates Cif's identification, so PMID:17502391 (purified Cif, necessary and sufficient) is the proper citation. Two NEW rows: GO:1990215 symbiont-mediated perturbation of host vesicle-mediated transport (IDA, PMID:21455491, USP10/G3BP1 rerouting of endocytosed CFTR) and GO:0005576 extracellular region (IDA, PMID:17502391, secreted in outer-membrane vesicles; SignalP 1-24). One BIOLOGY knowledge gap on the unidentified endogenous epoxide substrate. Cached PMID:17502391 and PMID:21455491; wrote cif-notes.md with the seed assessment table.
