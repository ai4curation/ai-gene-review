  summary: Review phnA, completing its PseudoCAP molecular-function shared claim
  details: |
    The second, pyocyanin-specific anthranilate synthase alpha subunit; a Swiss-Prot reviewed
    entry whose curated FUNCTION cites the annotating paper with ECO:0000269.

    GO:0004049 anthranilate synthase activity, both rows ACCEPT. enables is right for this
    subunit specifically: PhnB supplies ammonia from glutamine and PhnA catalyses the
    chorismate-to-anthranilate step. The merged phnB review reached ACCEPT for the beta subunit
    while noting contributes_to would be arguable there, so the asymmetry between the two
    reviews of this shared claim is deliberate, not drift. Although coded IMP, the support is
    not a bare phenotype: the cloned phnA-phnB pair complements E. coli trpE and trpE(G)
    mutants, a heterologous gain of function.

    GO:0000162 L-tryptophan biosynthetic process MARK_AS_OVER_ANNOTATED. This needed care,
    because the obvious reading - a paralog over-annotation - is wrong: the paper's own title is
    about the interchangeability of the two anthranilate synthases, and the capability is real
    in both directions. What settles it is whether PhnAB does supply tryptophan, and two curated
    results say no. Double phnA-phnB deletions are tryptophan prototrophs (ECO:0000269,
    PubMed:23449919), so neither gene is required; and deleting trpE instead causes auxotrophy,
    so PhnAB does not cover for it at wild-type expression. The capability surfaces only in
    feedback-insensitive revertants. Marked over-annotated rather than REMOVEd because the
    enzyme really catalyses the same reaction, and deliberately not KEEP_AS_NON_CORE, which
    would assert a peripheral but genuine role that the prototrophy argues against.

    A propagation_review records the node reading. The donors were resolved against the UniProt
    API, and the sharpest fact is that P20580 is TRPE_PSEAE - the target organism's own TrpE,
    the paralog that actually serves tryptophan synthesis, and itself a member of this shared
    claim. The node hands phnA a role already correctly annotated on the gene next to it.
    root_cause is TERM_SCOPING_PROBLEM rather than PROPAGATION_BAD: the assertion is true of the
    family and of the reaction, and only the pathway context fails to transfer.

    GO:0002047 phenazine biosynthetic process ACCEPT, with one nuance recorded and not acted on.
    The curated FUNCTION routes PhnA's contribution through PQS, which induces the pyocyanin
    genes; if that induction is the whole story then a regulation term would fit better than
    involved_in. That is not something to settle against a 1990 curator who read the full text
    while our cache is abstract-only, so it is raised as a suggested question instead.

    No source defect is filed for this gene. The GO:0000162 row is a PAINT judgement and the
    term is not false, so there is nothing to request upstream.

    Batch context: this gene is one of the nine-gene PseudoCAP tier-3 batch, and one of five that
    were each the LAST unreviewed member of a molecular-function shared claim whose other members
    are already merged. Reviewing them gene by gene was therefore sound - each closes a group
    rather than opening one - provided each was read against its merged siblings first, which is
    what the house-style comparisons recorded above are.

    The worklist's review_folder fields are NOT updated here. build_pseudocap_mf_worklist.py
    derives them by scanning for any *-ai-review.yaml on disk, so regenerating mid-batch would
    have marked the then-unreviewed stubs as done. Now that all nine of the batch are reviewed
    the worklist can be regenerated, which is also what the shared-claim audit script needs
    before it will report these groups as complete.
