  summary: Full review of P. aeruginosa nmoA (PA4202); PseudoCAP IBA-seed assessment
    of the nitronate monooxygenase IBD at PTN001284536
  details: |
    Reviewed all 3 GOA rows. The sole seed of the GO:0018580 IBD at PTN001284536 (PTHR42747, 23 leaf IBAs in 19 taxa in the PAINT leaf GAF) is the PseudoCAP IDA to PMID:25002579: PA4202 was cloned, purified and kinetically characterised (P3N kcat 1300 s-1, Km 110 uM; inactive on nitroalkanes), with tightly bound FMN and a 1.44 A structure (PDB 4Q4K). Seed verdict SOUND. The node, however, is over-broad: a sibling leaf, P. aeruginosa PA0660 (Q9I5R1), was purified and has no NMO activity (NAD(P)H:quinone reductase, PMID:31075192), so a GO_CENTRAL WRONG_TERM/CHECK defect asks for a NOT at that branch or for the IBD to move to the class I four-motif group. ACCEPT for IDA, IEA (InterPro IPR004136) and IBA. Added two NEW rows: GO:0010181 FMN binding (IDA, PMID:25002579) and GO:0070458 cellular detoxification of nitrogen compound (IMP, PMID:25384477, where the deletion mutant is less tolerant of 3-NPA and loses dose-dependent nitrite release). Added PMID:25384477, PMID:20382807 and PMID:31075192 as references.
