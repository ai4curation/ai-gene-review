  summary: Review PA0681 (HxcT), major pseudopilin of the Hxc type II secretion system
  details: |
    Tier-2 PseudoCAP completion. All six GOA rows ACCEPT: three on GO:0015627 (IBA, IDA, InterPro IEA) and two on GO:0015628 reinforce each other, and GO:0005886 plasma membrane is correct because in a Gram-negative the plasma membrane is the inner membrane where an unassembled pseudopilin sits.

    Identified the gene as HxcT, the major pseudopilin of the Hxc system, from PMID:21586577, which is the paper the PseudoCAP IDA row cites. The substantive finding is that HxcT and XcpT are not interchangeable although major pseudopilins normally are: HxcT does not form a hyper-pseudopilus on overproduction and differs in sequence and multimerization, five substitutions revert it to XcpT-like behaviour, and the whole Hxc system is horizontally acquired and defines a new T2SS subfamily. The IBA (PTN000764351) is seeded by XcpT, XcpU and PA0681 itself; self-appearance is expected and marks experimental grounding, not circularity.

    Added GO:0005198 structural molecule activity as a NEW row, but IC rather than the IDA used in the merged xcpT review, because the same paper reports the opposite surface phenotype for HxcT. The polymerisation capacity is shown for the five-residue revertant, and wild-type assembly into a working pseudopilus is inferred from the system being secretion competent. The row says so explicitly.

    Kept GO:0015627 rather than refining: no pseudopilus term exists in GO, confirmed in OLS and in the repository GO snapshot. Recorded as a suggested question rather than a proposed term, since the project has one family of cases.

    Deliberately proposed no phosphate-starvation or virulence process term. The pseudopilin does the work of secretion; the exported phosphatase does the phosphate scavenging and the regulatory phenotypes are downstream of losing the system.

    Did not over-read the UniProt PROSITE caution. It records that a profile residue did not match, not that the prepilin cleavage and methylation motif is absent, and the sequence motif is canonical (mature FTLIE..., invariant Glu5). Tempting to link it to the five divergent residues of PMID:21586577, but those are different instruments and no published analysis connects them; recorded as an observation.

    Provider deep research unavailable: perplexity not configured in this environment, asta returned HTTP 429. Documented in PA0681-notes.md per project policy rather than writing a file named as a provider file.

