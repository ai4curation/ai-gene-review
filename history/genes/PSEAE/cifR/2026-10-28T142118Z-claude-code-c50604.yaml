  summary: Full review of P. aeruginosa cifR (PA2931); PseudoCAP/CollecTF IBA-seed
    assessment of the negative regulation of transcription IBD at PTN002934616
  details: |
    Reviewed all 9 GOA rows. The sole seed of the GO:0045892 IBD at PTN002934616 (PTHR47506, 25 leaf IBAs in 9 taxa per QuickGO) is cifR's own experimental evidence: PseudoCAP IMP PMID:18458065 plus CollecTF EXP and IEP PMID:22843844. Verdict SOUND: purified CifR binds two mapped operators in the cifR-morB intergenic region, chromosomal operator mutations raise cif and cifR transcription, epibromohydrin releases CifR from DNA, and the 2024 structures (PMID:39413156, PDB 6NSM/6NSN/6NSR) show a CifR dimer on its operator with Cys107 as the epoxide-sensing residue. Self in With/From recorded as expected grounding, not circularity. ACCEPT for all experimental rows and the IBA; MODIFY of the two generic IEA rows (DNA binding to cis-regulatory region binding; regulation to negative regulation of transcription). No source defects. Added PMID:39413156 as a reference.
