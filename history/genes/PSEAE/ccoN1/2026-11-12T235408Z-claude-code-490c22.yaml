  summary: 'Create review: ccoN1, catalytic subunit I of the cbb3-1 oxidase'
  details: |
    Reviewed as part of the cbb3 oxidase group from the new tier-3 PseudoCAP worklist, whose shared_claims block flags GO:0004129 / PMID:14763990 as one claim spread over six proteins. PseudoCAP entered that identical IMP row on 20190311 for all eight subunits of both cbb3 operons, so a whole-operon deletion phenotype was transferred to each subunit; the cached paper is abstract-only and reports only isoform-level results ("only loss of cbb3-1 influenced growth"). None of the six seeds a PAINT IBD node, so no propagation_review applies and the IBA rows on the ccoN entries are received. A structural check against the RCSB API established that PDB 8SMR and 8SNH, the two cryo-EM supercomplex models cross-referenced from the CcoO entries, were built with the orphan CcoN paralogue PA4133 (Q9HWP8) plus CcoO1 and CcoP1/CcoP2, and contain no CcoQ chain. The eight subunits were then differentiated on evidence rather than uniformly, following the principle stated in the human COX reviews that the catalytic activity resides in the subunit carrying the binuclear centre. Specific to ccoN1: the curated PIRSR cofactor records give one copper ion per subunit (copper B) and two hemes (high- and low-spin), and the chain matches PROSITE PS00077 COX1_CUB and NCBIfam TIGR00780, so oxygen reduction happens in this chain. The GO:0004129 rows are therefore ACCEPTed with enables and NO qualifier defect is filed, which is where this review parts company with its ccoP siblings; GO:1902600 is ACCEPTed rather than kept non-core because the proton channels of a heme-copper oxidase run through subunit I. GO:0006119 is MODIFYed to GO:0019646 (the ccoP precedent) and GO:0016020 to GO:0005886. A NEW IC row proposes GO:0005507 copper ion binding: copper B is curated on the record and the COX1_CUB site matches, yet only heme binding was annotated. A first draft cited the CATALYTIC ACTIVITY, PATHWAY and SUBCELLULAR LOCATION comments as support; the validator correctly flagged all three as ARBA-only unvetted predictions, and they were replaced with the TRANSMEM features and the family assignment.
