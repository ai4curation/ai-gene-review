  summary: PseudoCAP IBA-seed review of xcpR (GspE secretion ATPase)
  details: |
    Reviewed all 12 GOA rows. Both PseudoCAP rows sole-seed the PTN002016240 IBDs (T2SS complex from PMID:16168578; T2SS protein secretion from PMID:9818381) and both node conclusions are sound; the node is restricted to Gammaproteobacteria, which keeps the T2SS terms off the PilB-type members of PTHR30258. The GO:0015628 row cites a review (PMID:9818381), the same mis-keying as the xcpQ and xcpX seeds, recorded as a WRONG_EVIDENCE_CODE source defect (re-key to PMID:8102361 IMP or downgrade to TAS). GO:0008564 protein-exporting ATPase activity (EC2GO) kept as non-core: the EC assignment is a curator inference from Walker-site genetics and XcpR is the motor rather than the conduit.
