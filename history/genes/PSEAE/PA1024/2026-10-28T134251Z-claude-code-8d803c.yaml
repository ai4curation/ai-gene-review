  summary: New review of PA1024 (Q9I4V0), an NADH:quinone reductase, with PseudoCAP
    IBA-seed assessment
  details: |
    Initial review following projects/PSEUDOCAP/REVIEW_PROTOCOL.md. The PseudoCAP IDA oxidoreductase activity (PMID:27502282) is the sole seed of PTN002844975 (GO:0016491; 122 leaf IBAs). Verdict: SOUND. The seed comes from enzymology of the purified enzyme, and the generic node term suits a cross-kingdom clade. On PA1024, the IDA and IBA rows are MODIFIED to GO:0050136, which is ACCEPTED (EXP and IEA). The InterPro2GO nitronate monooxygenase IEA is REMOVED because enzyme assays contradict it; an upstream mapping defect is recorded. FMN binding is added as NEW.
