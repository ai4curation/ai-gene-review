  summary: 'Create review: ccoQ1, uncharacterised small component of the cbb3-1 oxidase'
  details: |
    Reviewed as part of the cbb3 oxidase group from the new tier-3 PseudoCAP worklist, whose shared_claims block flags GO:0004129 / PMID:14763990 as one claim spread over six proteins. PseudoCAP entered that identical IMP row on 20190311 for all eight subunits of both cbb3 operons, so a whole-operon deletion phenotype was transferred to each subunit; the cached paper is abstract-only and reports only isoform-level results ("only loss of cbb3-1 influenced growth"). None of the six seeds a PAINT IBD node, so no propagation_review applies and the IBA rows on the ccoN entries are received. A structural check against the RCSB API established that PDB 8SMR and 8SNH, the two cryo-EM supercomplex models cross-referenced from the CcoO entries, were built with the orphan CcoN paralogue PA4133 (Q9HWP8) plus CcoO1 and CcoP1/CcoP2, and contain no CcoQ chain. The eight subunits were then differentiated on evidence rather than uniformly, following the principle stated in the human COX reviews that the catalytic activity resides in the subunit carrying the binuclear centre. Specific to ccoQ1: the entry has two GOA rows in total and the operon-level IMP is its only molecular-function claim. The chain is 61 residues with one predicted transmembrane helix at 6-26, has no COFACTOR line of any kind, sits at protein existence 4 (Predicted, quoted only to show the entry rests on prediction), and is absent from both cryo-EM supercomplex models. Unlike CcoO and CcoP it carries no redox centre and performs no step of the reaction, so GO:0004129 is MARK_AS_OVER_ANNOTATED, following the human COX5A and COX8A precedent for structural subunits. Deliberately not REMOVE: that is the SURF1 case of a protein shown to be an assembly factor rather than a subunit, and nothing shows CcoQ is outside the complex, while absence from a cryo-EM model is weak evidence for a short single-helix chain. The unknown is recorded as a BIOLOGY knowledge gap with a single-gene deletion and holoenzyme purification as the experiment that would settle subunit versus assembly factor.
