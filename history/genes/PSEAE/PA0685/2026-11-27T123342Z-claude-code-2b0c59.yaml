  summary: Review PA0685 (HxcQ), the lipoprotein secretin of the Hxc type II secretion
    system
  details: |
    Tier-2 PseudoCAP completion. Eight GOA rows: six ACCEPT (three on GO:0015627, two on GO:0015628, and GO:0009279 cell outer membrane) and two MODIFY.

    Identified the gene as HxcQ from PMID:19815547, the paper the PseudoCAP IDA row cites. The biology is the point: HxcQ is a liposecretin. The paper shows it forms the heat- and SDS-resistant high-mass multimer that defines a secretin, that it is a lipoprotein, that lipidation is essential for function, and that a nonlipidated variant still multimerises but accumulates in the inner membrane, which is the phenotype of a secretin stranded without its pilotin. So the lipid anchor plays the pilotin role, confirmed in E. coli. Lipidation is a targeting determinant, not an assembly determinant, since the ring builds either way.

    UniProt corroborates independently: SIGNAL 1..27, CHAIN 28..803, and two LIPID features on residue 28 (N-palmitoyl cysteine, S-diacylglycerol cysteine) from PROSITE-ProRule PRU00303, with the sequence showing a canonical lipobox V-A-A-C at 25-28. An experimental and a sequence-based instrument agreeing.

    GO:0009279 ACCEPT is noted as unusually well grounded for an IEA row: the IDA paper demonstrates the location and identifies the mutant that abolishes it, so the row is falsifiable and not falsified.

    Both MODIFYs follow the merged xcpQ review. GO:0019867 outer membrane to GO:0009279: IPR013356 is GspD-specific and therefore bacterial, so this row own evidence reaches the child. GO:0009306 protein secretion to GO:0015628 is the harder one and is recorded transparently: IPR004846 spans T2SS and T3SS, so the signature alone supports the generic term plus a disjunction, and the disjunct is resolved by the gene other evidence rather than by the signature. Under the 2026-11-14 ruling that is arguably TOO_GENERAL. I checked the corpus: every reviewed gene carrying this row MODIFYs to its system-specific term (xcpQ to GO:0015628, pscC to GO:0030254, IV to GO:0099045), xcpQ own reason states the disjunction and MODIFYs anyway, and xcpQ history records run to 2026-11-17, after the ruling. Followed the convention so the secretins agree and stated the reasoning in the row, rather than diverging silently; if the ruling should reclassify this row it should do so for all four together.

    Added GO:0008320 protein transmembrane transporter activity as NEW (IC), as in the merged xcpQ review, since GOA gives the secretin no molecular function.

    Deliberately did not annotate GO:0044874 lipoprotein localization to outer membrane despite the self-piloting result. That term names what the Lol machinery does; HxcQ is the cargo, and supplying the acylated cysteine the pathway recognises is being the substrate rather than doing the work. Raised as a suggested question about how to record a substrate that carries its own targeting determinant. Also noted that GO:0046658 anchored component of plasma membrane is obsolete and would misdescribe an integral beta-barrel protein anyway.

    Provider deep research unavailable (perplexity unconfigured, asta HTTP 429); documented in PA0685-notes.md per project policy.

