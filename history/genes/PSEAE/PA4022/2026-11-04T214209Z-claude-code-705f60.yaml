  summary: 'Create review: PSEAE PA4022'
  details: |
    New P. aeruginosa PAO1 PA4022 (Q9HX05) review, added in the PR #5970 review round as the ethanolamine-operon representative of the non-acylating acetaldehyde dehydrogenase route. The three electronic rows (generic ALDH and oxidoreductase) are TOO_GENERAL; GO:0140087 is proposed NEW by ISS from ExaC (Q9ZAA1), supported by a reproducible pairwise analysis (PA4022-bioinformatics/: 98.2% identity to ExaC, 98.4% to PAO1 exaC PA1984, catalytic Glu262/Cys301 conserved), the shared NCBIfam NF050026 model and the PA4022-eat-eutBC operon assignment in PMID:27325678. No process term proposed; mutant phenotype recorded as a knowledge gap. Validated with just validate PSEAE PA4022. Deep research unavailable, noted in PA4022-notes.md.
