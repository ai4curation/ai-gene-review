- type: REVIEW
  outcome: changed
  summary: Review tatB, completing the GO:0008320/PMID:16621825 shared claim
  details: |
    tatB was the last unreviewed member of the GO:0008320 shared claim that PR #6499 recorded as an open divergence between tatA and tatC. Its GOA row shape is identical to tatC's - GO:0009977 as its own IBA row plus GO:0008320 by IEA and IMP - so it takes tatC's encoding: ACCEPT GO:0009977, TOO_GENERAL on both GO:0008320 rows. That makes the group 2:1 rather than 1:1 and shows the asymmetry is in GOA, not in the biology: PAINT gave tatA's node (the TatA/TatE node) the general term, so tatA's reviewer had to propose the specific term rather than accept it. Merged tatA is deliberately NOT touched; whether its MODIFY clears the 2026-11-14 bar remains open for a human. IBA donors were resolved against the UniProt API rather than read from accessions: P69425 is E. coli TatB, O48950 and Q9XFJ8 the maize chloroplast TATB and TATA. Four ontology relations were checked in OLS rather than asserted: GO:0009977 is_a GO:0008320, GO:0005886 is_a GO:0016020, GO:0015031 is an ancestor of GO:0043953, and GO:0065002 is not. PMID:16621825 is abstract-only and names no individual tat gene, so both IMP rows rest on a pathway-level export phenotype; recorded in the reference_review rather than held against the curator, who read the full text, and no source defect is raised since PseudoCAP used the same paper deliberately across the operon.
