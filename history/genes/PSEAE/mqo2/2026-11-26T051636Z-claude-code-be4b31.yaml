  summary: 'Review mqo2: GO:0016614 is TOO_GENERAL here where it was REMOVE on soxA,
    and UniProt is missing the paper'
  details: |
    PA4640 mqo2 (mqoB), the quinone-dependent malate oxidase. PMID:12480887 maps its own gene to this
    locus in its closing sentence, so the attribution needs no inference.

    GO:0016614 oxidoreductase activity, acting on CH-OH group of donors is TOO_GENERAL, not REMOVE.
    This looked like the defect found on soxA in batch 4, where the same term was removed as the wrong
    oxidoreductase branch. Checked in OLS instead of reasoning by analogy: GO:0008924's ancestors run
    GO:0016901 (CH-OH donor, quinone acceptor) to GO:0016614 to GO:0016491, so it is a true ancestor
    here - malate oxidation does act on a CH-OH group. soxA's GO:0008115 sits under GO:0016645, the
    CH-NH donor branch, with GO:0016614 nowhere among its ancestors. Same term, opposite verdicts,
    decided by looking each time. The three merged P. putida siblings mqo1, mqo2 and mqo3 all reached
    TOO_GENERAL on this term and ACCEPT on GO:0008924 and GO:0006099, so this is unanimity.

    UniProt source defect, MISSING_STATEMENT at PROBABLE. The entry cites two references - an EMBL
    submission of July 2002 (AY129296) and the PAO1 genome paper - and does not cite PMID:12480887 at
    all, although that paper reports a deletion phenotype, complementation and a measured dye-dependent
    MQO activity. The submission predates the paper by five months, so the record carries that group's
    sequence without the characterisation it was deposited for. The consequences are on the record:
    "Probable" in the name, PE 3 Inferred from homology, and every CC statement HAMAP-rule evidence.
    PROBABLE rather than CONFIRMED because the work was done in strain ATCC 17933 while the entry is
    PAO1, and whether that counts as protein-level evidence for this accession is UniProt's editorial
    call.

    GO:0005737 cytoplasm (IBA) kept as non-core with its granularity recorded. The donor list is
    entirely eukaryotic with no MQO in it, so the compartment is asserted across a wide flavoprotein
    clade rather than transferred from a characterised MQO. The claim is still true of a bacterial MQO's
    catalytic face, but the second substrate is a membrane quinone and nothing localises the protein -
    no SUBCELLULAR LOCATION line on the entry, and the assay reports no fraction. Recorded as a
    knowledge gap; no locations term asserted on the core function.

    Noted and not acted on: PTHR43104-review.yaml leaves the GO:0005737 node unresolved because "no
    reviewed TCA member receives it", and this gene is a reviewed TCA member that does. Keeping the row
    means nothing here conflicts with the family review, so no shared-file edit is forced into this PR.

    No deep research file: perplexity and falcon are unavailable here, asta retrieved only off-target
    database papers (it matched the prompt boilerplate, returning near-identical lists for four
    unrelated genes), openscientist did not finish. Research is in mqo2-notes.md with provenance.
