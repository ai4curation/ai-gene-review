- type: REVIEW
  outcome: changed
  summary: Review soxD as part of the four-subunit sarcosine oxidase group; repoint
    its wrong reference
  details: |
    The delta subunit, 106 residues, with no cofactor, no catalytic domain and nothing on the
    record beyond the SoxD family signature itself (IPR006279, PF04267); PE 4: Predicted.

    Wrong reference: the IMP row cites PMID:17951382, a S. mutans RelA stringent-response study
    (DOI 10.1128/JB.01395-07). WRONG_REFERENCE, REPOINT to PMID:17951379, CONFIRMED.

    Wrong qualifier: `enables GO:0008115` over-reaches on a subunit that does not carry the
    catalytic site. WRONG_QUALIFIER, enables -> contributes_to, cause SCOPE_OVER_REACH,
    confidence PROBABLE, following the merged ccoO1/ccoP1 precedent for the non-catalytic cbb3
    chains. Recorded once, on the IMP row, so the upstream report carries a single request per
    gene; the IEA row's reason points at it rather than duplicating the defect.

    Deliberately NOT the ccoQ1 over-annotation case. Three things separate it: the paper
    describes a heterotetramer rather than a core plus accessory chain, the operon is soxBDAG
    with delta among the four genes whose transposon mutants share the class II phenotype, and
    IPR006279 is a dedicated conserved subunit family. A protein with its own subunit family
    across the characterised systems is a structural subunit, not a passenger.

    The GO:0046653 process row is kept without a qualifier correction: involved_in does not
    assert that this chain performs the chemistry, so a subunit of a folate-dependent enzyme
    legitimately participates in folate metabolism.

    What the delta subunit does is genuinely unknown - assembly factor, structural brace, or
    contributor of residues to the active site - and is recorded as a BIOLOGY knowledge gap with
    a matching experiment rather than guessed at.

    Group-level findings common to all four sox reviews:

    All four GO:0008115 IMP rows cite a different wrong PMID, and all four wrong PMIDs are
    J Bacteriol papers e-published on 2007-10-19 - one issue's block of consecutive ids, which is
    why the four are evenly spaced two apart (17951380, 17951382, 17951384, 17951386). The
    intended paper, PMID:17951379, sits immediately below the block. Every title was verified
    against PubMed, and the wrong PMID was confirmed live in today's GOA rather than taken from
    the five-day-old worklist. The four rows should be repointed together.

    A side effect worth recording: these wrong references CONCEALED a shared claim. One term on
    four subunits of one complex from one paper is exactly the group the PseudoCAP audit exists to
    catch, but build_pseudocap_mf_worklist.py keys groups on (term, reference), so four bogus and
    mutually different PMIDs split it into four singletons. The group becomes visible only once
    the references are corrected.

    What the correct paper shows: the evidence is genetic and spectroscopic, never an enzyme
    assay. Transposon mutants in all of soxABDG share the class II growth phenotype, and a soxA
    mutant accumulates sarcosine under 13C-choline feeding. The authors hedge throughout -
    "predicted", "putative" - and the sox names were assigned from homology to the Corynebacterium
    system. So each GO:0008115 IMP row is the tier-3 pattern exactly: a molecular function
    asserted from a growth phenotype. The claim holds for the complex, but the phenotype cannot
    say which subunit carries the catalytic site, which is what the per-subunit apportionment
    above rests on instead.

    The worklist's review_folder fields are NOT updated in this change. build_pseudocap_mf_worklist.py
    derives them by scanning for any *-ai-review.yaml on disk, and this branch also carries stub
    reviews for phnA, PA5190, femA and pvdL, so regenerating now would falsely mark those four as
    reviewed. The audit script therefore still reports these genes as unreviewed; the worklist
    should be regenerated once the remaining four of the nine-gene batch are done.
