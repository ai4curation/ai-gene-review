    Deliberately not moved into the row's supported_by: a paper on PA2412 is not support
    for a PA2403 row, whatever it shows about the cluster. PMID:17502378 is recorded at
    relevance LOW for that reason and its finding statement says so explicitly.

    The source defect's explanation gained the one concrete lookup that would settle it,
    verified in the cached 2003 abstract: fourteen candidate genes were mutated and eight
    new pvd genes identified, so six were assayed and scored negative, and the abstract
    does not enumerate the fourteen. If PA2403 was among them it was assayed and scored
    negative, which is much stronger than never having been followed up; if it was not,
    the present reading stands. That list is in the 2003 full text, which is readable,
    rather than the 2002 full text, which has no PMC record. This sharpens the CHECK
    request without changing its confidence, which stays SUSPECTED.

