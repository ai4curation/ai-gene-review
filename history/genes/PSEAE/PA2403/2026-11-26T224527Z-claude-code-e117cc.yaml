- type: EDIT
  outcome: changed
  sections:
  - source_defects
  - description
  summary: Rescope the defect as the reference-level question it is, and name the 2003
    follow-up asymmetry
  details: |
    Review endorsed both flagged calls -- UNDECIDED on the rows, and SUSPECTED/CHECK rather than
    waiting for the 2002 full text -- and requested one change that is right and that I had
    missed by looking at one row instead of at the reference.

    Five PAO1 genes carry the identical PseudoCAP row, involved_in GO:0002049 by IMP from
    PMID:12207696, all dated 20190311: PA2403, PA2412, pvdN, pvdO and pvdP. I verified that from
    the GOA files rather than taking it on trust. CLAUDE.md asks for the reference-level view
    before claiming a mis-attribution and says in as many words that the same row made on the
    same day across a set is a deliberate practice rather than a slip. My defect was scoped as
    though PA2403's row were an isolated error, so export-source-defects would have handed
    PseudoCAP a one-row request for a question about how one reference was curated across five
    genes. The explanation now says so, and says PA2403 is named only because it is the gene
    under review.

    The reviewer also pointed at evidence in my favour that I had not looked for, and it is the
    best argument in the review. The 2003 follow-up PMID:12686626 did construct mutants and assay
    pyoverdine, and it yielded GO:0002049 IMP rows on ten genes -- PA2412, opmQ, pvdH, pvdL,
    pvdN, pvdO, pvdP, pvdQ, pvdR, pvdT -- which includes four of the five 2002-batch genes and
    not PA2403. So the one gene of that batch which never received an independent
    mutant-phenotype row is the one whose 2002 row is questioned here. Verified from the GOA
    files directly. It stays SUSPECTED, because an absent row is not evidence of an absent
    experiment, and that limit is written into the explanation rather than left implicit.

    The divergence from PA2412 is now stated in the row's reason. PA2412 carries the same row
    from the same reference and ACCEPTs it, reaching that on independent deletion-mutant data
    (PMID:17502378) while recording that the reference itself is unverified for IMP. PA2403 has
    no such data, so the same row resolves differently on the same reasoning rather than under a
    different rule -- which is the thing a reader comparing the two reviews would otherwise have
    to reconstruct.

    One suggestion taken: the description carried database-record commentary -- that the entry is
    unreviewed, that the name comes from a domain match, that protein existence is "Predicted" --
    which belongs in the notes and in reference_review, where it already is, rather than in a
    field meant for project-independent biology. Removed; the biological statement that nothing
    has been demonstrated for the protein stays.

    Nothing about the two actions changed. just validate passes; 31 quotes verified across both
    genes in this batch.
