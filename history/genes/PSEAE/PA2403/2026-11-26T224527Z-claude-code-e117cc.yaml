- type: CREATE
  outcome: changed
  summary: 'Create review: PA2403, an uncharacterised PepSY membrane protein whose
    sole annotation may record regulation as participation'
  details: |
    First review for PA2403 (Q9I178), the second of the two tier-1 PseudoCAP genes whose review
    files were outstanding. Two GOA rows, both UNDECIDED, one SUSPECTED source defect, no core
    functions asserted.

    What is known about the protein is almost nothing, and that is the finding. The UniProt
    entry is unreviewed TrEMBL with protein existence "Predicted" and no curated FUNCTION,
    CATALYTIC ACTIVITY, SUBUNIT or DISRUPTION PHENOTYPE block at all; its name, "PepSY
    domain-containing protein", comes from a Pfam match and its locus name from the submitter.
    What the sequence gives is four Phobius transmembrane helices, so a polytopic membrane
    protein, two PepSY modules (PF03413, PF03929), and PANTHER placement in PTHR34219, a family
    named for iron-regulated inner-membrane proteins. Family name and regulation agree that it
    is iron-responsive and say nothing about what it does.

    The substantive finding is about the evidence behind its one grounded annotation. The
    PseudoCAP IMP for GO:0002049 pyoverdine biosynthetic process cites PMID:12207696, a GeneChip
    study of the iron-starvation response, whose stated criterion for its novel pyoverdine
    biosynthesis genes is in the abstract: "expression of 26 genes or operons was reduced in a
    DeltapvdS mutant compared with wild type". That is PvdS-dependent transcription. The mutant
    whose phenotype was scored is pvdS, the pyoverdine sigma factor, and the readout is the
    candidate gene's own expression rather than pyoverdine production. Being transcribed under
    the control of the pyoverdine sigma factor is evidence of being regulated with the pathway,
    not of carrying out a step in it, and PvdS also controls genes outside pyoverdine synthesis,
    exotoxin A and PrpL protease among them. On the face of it the code should be IEP rather than
    IMP.

    It is filed as a query, not a correction, and the reasoning for that matters more than the
    finding. The abstract does not name PA2403; the paper has no PMC record, which
    convert_article_ids confirms by returning no PMCID; and the full text is exactly where a
    PA2403 deletion assayed for pyoverdine would be reported if one exists. PseudoCAP curators
    had the full text and I did not, so the project rule against overruling an experimental
    annotation from unread evidence applies directly. Both rows are UNDECIDED, which is what the
    enum reserves for an inability to access the relevant publication, and the evidence-code
    concern is a SUSPECTED defect with requested_change CHECK.

    The second row inherits the first. GO:0019290 siderophore biosynthetic process is an IBA
    from PTN009150613 whose only WITH/FROM entry is this gene, and GO:0002049 is a descendant of
    it, so the propagated parent claim rests entirely on the row above. The self-appearance is
    the expected marker of the target's own annotation being the descendant evidence and is not
    circularity; what matters is that it is the only such evidence. This is the sole-seed case
    the PseudoCAP tier-1 audit exists to find: if the seed is an expression pattern, the IBD
    cannot support propagating a biosynthetic process across the family, and that is said in the
    defect explanation so the two travel together.

    No core functions are asserted, and the validator's "No core functions defined" warning is
    correct and left standing. Naming a molecular function for a protein with no demonstrated
    activity would be fabrication, which is the opposite of what this review is for. A BIOLOGY
    knowledge gap records the real unknown instead, with MF_DARK as its aspect, paired with the
    experiment that would close it: an unmarked deletion with pyoverdine quantified by
    fluorescence and CAS assay.

    The PepSY domain is also worth a question rather than an inference. It is named after
    peptidase propeptides, so a membrane-anchored modulator of a periplasmic protease is a live
    alternative to a biosynthetic role, which would make both current annotations wrong in kind
    rather than in detail.

