  summary: Full review of P. aeruginosa lpxA (PA3644); PseudoCAP IBA-seed assessment
    of the lipopolysaccharide biosynthetic process IBD at PTN000602377
  details: |
    Reviewed all 9 GOA rows. The PseudoCAP IDA for GO:0009103 (PMID:1904818) cites Kulshin et al. 1991, a chemical/NMR structural analysis of purified P. aeruginosa lipid A that assays no enzyme and predates the cloning of lpxA; recorded as a PSEUDOCAP WRONG_REFERENCE defect repointing to PMID:9440522 (Dotson et al. 1998, expression cloning and assay of PAO1 LpxA as a 10-carbon-specific UDP-GlcNAc acyltransferase, reference [1] of Q9X6P4). Seed verdict: term and node SOUND (PTHR43480 is the Gram-negative LpxA family, 24 leaf IBAs), reference WRONG; suggested that the IBD would be sharper as GO:0009245 lipid A biosynthetic process, which E. coli LpxA has by IDA. The MF IBA comes from a different node, PTN000602373, seeded with E. coli LpxA and Arabidopsis AT4G29540. No REMOVE; generic terms (cytoplasm, lipid biosynthetic process, transferase activity) modified to cytosol, lipid A biosynthetic process and GO:0008780. Core function: acyl-ACP--UDP-GlcNAc O-acyltransferase in the cytosol.
