  summary: Full review of P. aeruginosa fliD (PA1094) flagellar cap; PseudoCAP IBA-seed
    assessment of the filament-cap IBD at PTN000767631
  details: |
    Reviewed all 9 GOA rows. The sole seed of the GO:0009421 IBD at PTN000767631 (PTHR30288, 20 leaf IBAs in 19 taxa, all FliD orthologues; the node also carries NOT IBDs for GO:0009421 and GO:0071973 at PTN004740641/642) is the PseudoCAP IDA to PMID:9488388. Verdict SOUND: the cap claim is the defining family function and is established directly for PAO1 FliD by the hexameric structure (PDB 5FHY, hexamer in crystal, solution and negative-stain EM) plus the non-motile fliD transposon mutant restored by PAO1 fliD (PMID:27664419, not cited in GOA). The weakness is the reference choice, since PMID:9488388 reports mucin adhesion and fliD regulation and treats the cap as background; full text is inaccessible, so no PseudoCAP defect was filed. ACCEPT for the three GO:0009421 rows and the GO:0071973 IBA (the latter seeded by E. coli P24216 and B. subtilis P96786). MODIFY GO:0009288 to GO:0009421. MARK_AS_OVER_ANNOTATED GO:0009424 flagellum hook (IEA from InterPro IPR003481) with an InterPro CHECK defect: FliD is the filament cap, the row appears on all FliD entries, and the legacy HAP2 name is the likely cause; not REMOVE because FliD sits at the hook-basal body distal end in filament-less Salmonella mutants. KEEP_AS_NON_CORE for GO:0005576 and both GO:0007155 cell adhesion rows (purified FliD competes mucin adhesion, so sound but secondary). No NEW rows: a QuickGO comparator check showed no FliD orthologue anywhere carries GO:0044780 flagellum assembly, which is a convention rather than a gap. Added a CONFIRMED UniProt source defect: SUBUNIT says homopentamer by similarity, whereas PAO1 FliD is a hexamer. Added PMID:27664419 and PMID:10678962 as references.
