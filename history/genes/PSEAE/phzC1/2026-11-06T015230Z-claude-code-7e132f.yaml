  summary: 'Audit of the PTN000481936 GO_CENTRAL defect: PA2843 housekeeping-DAH7PS
    claim traced to PMID:30242059 and verified'
  details: |
    The GO_CENTRAL WRONG_TERM entry on PANTHER:PTN000481936 (GO:0002047) turns on leaf Q9I000 (P. aeruginosa PA2843) being the organism's housekeeping type II DAH7PS, distinguished from the phz-cluster enzyme by structural work. The claim is backed by a real publication, not by a name, and the citation is now explicit. PMID:30242059 (cached full text) names both P. aeruginosa type II DAH7PSs by locus tag, states that the seeded enzyme is 'found as a part of the phzA-G PCA biosynthetic cluster' while PA2843 'is not found within the phzA-G PCA biosynthetic cluster', reports PA2843's solved structure (PDB 5UXM, its ref 33) with the inserted alpha2a/alpha2b helices and aromatic amino acid inhibition, and concludes that the type II enzymes 'diverged to deliver type II enzymes that function within either primary or secondary metabolism'. Three of those statements were added as verbatim supported_by quotes. Two independent checks: the sequence lengths are 405 aa (Q7DC82) and 448 aa (Q9I000), exactly the 43-residue difference the paper reports, and Q7DC82 is the merged entry for both PA1901 and PA4212, so the characterised PaeDAH7PSPA1901 is the seed protein itself. The other three leaves (O24947, Q8PC31, Q89NQ6) have RecNames and EC numbers only from UniRule RuleBase RU363071 and no experimental annotations; the entry now takes family membership from that rule but makes no pathway claim from the names, noting instead their full-length type II sequence lengths and that a UniProt gene query (2026-11-06) finds no phzB/D/E/F/G/M/S gene in H. pylori 26695, X. campestris pv. campestris ATCC 33913 or B. diazoefficiens USDA 110 against six in PAO1, flagged as suggestive rather than proof. Confidence raised PROBABLE -> CONFIRMED. A Leaf evidence check (2026-11-06) section was added to the notes. just validate PSEAE phzC1 passes with 2 pre-existing warnings.
