  summary: 'Review phzC1 (PA4212/PA1901): seed sound, but the phenazine IBD sits on
    a generic DAHP synthase node'
  details: |
    Reviewed all 5 GOA rows. Both GO:0002047 rows (PseudoCAP IDA from PMID:11591691 and the IBA from PTN000481936) were ACCEPTed: PhzC is the phz-operon DAH7PS, kinetically characterised and insensitive to allosteric control (PMID:30242059), and phzC deletion collapses phenazine output in P. chlororaphis (PMID:35053084). Noted that the IDA evidence is operon-level. Both GO:0003849 rows ACCEPTed as the core activity; GO:0009073 aromatic amino acid family biosynthetic process MARK_AS_OVER_ANNOTATED, since this paralogue serves secondary metabolism while PA2843 and the aro genes serve primary metabolism. One source defect filed against GO_CENTRAL: PTN000481936 is a generic Proteobacteria DAHP synthase clade whose other four leaves (H. pylori HP_0134, Xanthomonas dhs1, Bradyrhizobium blr3778 and P. aeruginosa's own housekeeping PA2843) have all inherited phenazine biosynthetic process. Added notes with a PseudoCAP IBA-seed assessment table (verdict: sound seed, wrong node) and a bioinformatics folder.
