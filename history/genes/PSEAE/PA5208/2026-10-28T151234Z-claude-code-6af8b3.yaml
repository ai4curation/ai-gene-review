  summary: Full review of P. aeruginosa PA5208 (UPF0111/TIGR00153 PhoU-like protein);
    PseudoCAP IBA-seed assessment of the PTN002194937 swarming IBD
  details: |
    Reviewed all 3 GOA rows. The sole seed of the PTN002194937 GO:0071978 swarming IBD, a PseudoCAP IMP from the Overhage 2007 Tn5 screen (PMID:17158671), is an INDIRECT-PHENOTYPE: the mutant also has a growth defect, the protein is a putative Pit-transporter accessory regulator, and the node propagates a flagellar term to non-flagellated Haemophilus and Coxiella. IBA removed with a GO_CENTRAL DELETE_ROW defect; swarming and biofilm IMPs marked over-annotated with PSEUDOCAP defects. No core function (activity unknown).
