  details: |
    The GO_CENTRAL WRONG_TERM entry on PANTHER:PTN002194937 (GO:0071978) made two claims that needed separating. (1) 'The family is a putative Pit phosphate transporter accessory/regulator': this is a prediction and is now said to be one. All five leaves (confirmed by panther_tree.py: 5 leaves, PTHR36536:SF3) match Pfam PF01865 PhoU_div, NCBIfam TIGR00153 and InterPro IPR018445, whose own name is 'putative phosphate transport regulator'; the two leaf names asserting a phosphate role are unvetted - Q83FC5 'Pit accessory protein' is a submitter SubName (ECO:0000313|EMBL) and Q9KPD1 'Phosphate transport regulator' is a ProtNLM machine name (ECO:0008006), as is the seed's own name. None of the five leaves has any experimental annotation; GO:0071978 by IBA from this node is the only GO process term any of them carries. The entry no longer asserts a phosphate role, only that no leaf carries a flagellar or motor domain. (2) The load-bearing taxon claim was verified by UniProt proteome query (rest.uniprot.org, 2026-11-06): the six core flagellar structural and motor genes fliF, flgB, flgE, flhA, fliC and motA return zero hits in Haemophilus influenzae Rd KW20 (taxon 71421, 1704 entries) and zero in Coxiella burnetii RSA 493 (taxon 227377, 1812 entries), against all six in P. aeruginosa PAO1 (208964) and all six in Shewanella oneidensis MR-1 (211586), the flagellated leaves of the same node; a free-text flagell* search over the two proteomes also returns no flagellar structural protein. Confidence raised PROBABLE -> CONFIRMED, since the decisive fact is a live resource query. The IBA row reason, the propagation_review comment and the PSEUDOCAP defect wording were updated to match, and a Leaf evidence check (2026-11-06) section added to the notes. just validate PSEAE PA5208 passes with 3 pre-existing warnings.
