  details: |
    Tier-2 PseudoCAP IBA-seed review. Seed verdict for the GO:0006636 IMP row on PMID:9286984 at PTN000918584 (8 seeds for GO:0006633, 436 leaf IBAs): SOUND - the unsaturated fatty acid auxotrophy of fabB mutants is the direct consequence of FabB's own condensation step on cis-3-decenoyl-ACP (PMID:35136566), so this is participation rather than necessity, and the node term is the parent GO:0006633, which suits a KAS node spanning bacteria, plants and human OXSM. No PSEUDOCAP or GO_CENTRAL defect. GO:0006633 kept alongside GO:0006636 because FabB also elongates saturated acyl-ACPs. Actions: 5 ACCEPT, 2 TOO_GENERAL.
