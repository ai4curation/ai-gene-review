  summary: Full review of P. aeruginosa thiI (PA5118); PseudoCAP IBA-seed assessment
    of thiazole biosynthetic process IBD at PTN001804941
  details: |
    Reviewed all 16 GOA rows. The PseudoCAP IDA for GO:0052837 thiazole biosynthetic process (PMID:9209060) cites a 1997 Salmonella typhimurium genetics paper with no P. aeruginosa experiment; recorded as a WRONG_EVIDENCE_CODE PSEUDOCAP defect. It is the sole seed of the thiazole IBD at PTN001804941, the ThiI family root, which also covers short rhodanese-less ThiI of Firmicutes and archaea not needed for thiamine (B. subtilis PMID:22773787, M. maripaludis PMID:22904325); GO_CENTRAL defect requests withdrawal from the root. Thiazole rows kept as non-core (plausible for PA5118 by rhodanese domain/Cys457/TIGR04271, PMID:21724998). Core function: tRNA-uracil-4 sulfurtransferase / tRNA 4-thiouridine biosynthesis. CCA tRNA nucleotidyltransferase IEA removed; general terms modified to specific ones.
