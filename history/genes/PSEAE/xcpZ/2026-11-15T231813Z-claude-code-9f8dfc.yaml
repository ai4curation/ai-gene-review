  summary: 'Create gene review: xcpZ, the GspM platform subunit'
  details: |
    New review of P. aeruginosa P25061 for modules/bacterial_type_ii_secretion.yaml. XcpZ is the bait of the co-purification that isolated the XcpYZ and XcpRSYZ subcomplexes, so its complex row is well keyed, unlike the pseudopilin rows; function rests on linker-insertion variants that separate XcpY stabilisation from secreton function. Unlike xcpY this entry carries no GO:0009276 row, so the InterPro defect is specific to IPR007812.
