  summary: 'Audit of the PTN000532509 GO_CENTRAL defect: replaced leaf-name arguments
    with experimental and domain evidence'
  details: |
    The GO_CENTRAL WRONG_TERM entry on PANTHER:PTN000532509 (GO:0015764) previously argued that N-acetylglucosamine transport is not clade-wide by listing what the other Enzyme I leaves are called (general PtsI, EI-Ntr/PtsP, and the multiphosphoryl proteins FruB, FryA, PtsA and FruI). Leaf membership was confirmed with panther_tree.py (43 leaves, 25 taxa, PTHR46244:SF1/SF3/SF4/SF6) and each cited leaf's UniProt entry was fetched. Findings: P08839 (E. coli PtsI) has a curated RecName and GO:0008965 by EXP, with a FUNCTION statement carrying three ECO:0000269 citations that it is the general, non-sugar-specific PTS component; P37177 (E. coli PtsP) has IDA GO:0008965 and IDA GO:0006468 plus a GAF domain (PF01590) that PtsI lacks; Q9HY55 (PA3562, 'fruI') has an ARBA-predicted RecName and an EMBL submitter gene name with no experimental GO, but PMID:18833300, the very paper that seeds this IBD, reports its knockout failing to grow on D-fructose and fructose induction of the gene; P77439, P32670 and P45597 have no experimental annotations, only ISS. The rewritten explanation rests on (i) the PA3562 fructose phenotype, (ii) P08839's experimental non-specificity, and (iii) the EIIA domain split - PA3760 carries a type-1 EIIA (PF00358, PS51093) while all four fused multiphosphoryl leaves carry a type-2 fructose-class EIIA (PF00359, PS51094, IPR004715) and P08839/P37177 carry no EIIA or HPr domain. It states explicitly that the FruB/PtsA/FruI sugar assignments implied by the leaf names are curated or predicted names and are not used as evidence. The IBA row reason and the propagation_review comment were rewritten the same way, and the fructose-phenotype quote added to supported_by. Confidence raised PROBABLE -> CONFIRMED. A Leaf evidence check (2026-11-06) table was added to the notes. just validate PSEAE PA3760 passes with 2 pre-existing warnings; backfill-record-sections made no changes.
