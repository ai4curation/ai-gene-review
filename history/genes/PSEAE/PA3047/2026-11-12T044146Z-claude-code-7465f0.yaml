  summary: Consolidate the duplicate Q9HZG1 review from genes/PSEAE/dacB; fix the
    GO:0004175 refinement
  details: |
    PR #6019 review items 1 and 2. main had gained its own review of UniProt Q9HZG1 at genes/PSEAE/dacB while this branch added genes/PSEAE/PA3047, and the differing folder names let both merge silently. PA3047 is the conventional folder name: GOA/PseudoCAP give the symbol as PA3047, and UniProt records no GN Name for the accession, only OrderedLocusNames=PA3047. Unlike the astA pair these two reviews contradicted each other on two rows, and the dacB pass was right on both. (1) GO:0004175 endopeptidase activity IDA was ACCEPT here, on the stated ground that GO has no term for the 4,3 DD-endopeptidase reaction on peptidoglycan. That premise was false: GO:0061785 peptidoglycan endopeptidase activity exists, is defined as an endopeptidase activity that uses peptidoglycan as a substrate, has been in cache/go/terms.csv since 2026-06-16, and OLS lists GO:0004175 among its ancestors (checked 2026-11-12). The row is now MODIFY with that replacement, and the second core function declares GO:0061785 instead of the bare parent. (2) GO:0006508 proteolysis IEA was MARK_AS_OVER_ANNOTATED; it is now REMOVE with the INTERPRO DELETE_VALUE defect on the IPR000667 -> GO:0006508 mapping, because PBP4 acts on peptidoglycan stem peptides and not on proteins, which makes the claim wrong rather than broad. Also ported: the NEW IC GO:0030288 periplasm row (SignalP signal peptide 1-22 plus the periplasmic location of the substrate), outer membrane-bounded periplasmic space as locations on both core functions, and PMID:27716106 with its in vivo finding. genes/PSEAE/dacB is retired and its four history records moved here with target.superseded_by.
