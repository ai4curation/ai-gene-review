  summary: 'Full review of nrdJa (PA5497, class II RNR catalytic subunit); PseudoCAP
    IBA-seed assessment of PTN000171476 (OVER-SPECIFIC: substrate clause)'
  details: |
    New review of all 7 GOA rows. ATP binding, cobalamin binding and deoxyribonucleotide biosynthetic process ACCEPT; nucleotide binding IEA MODIFY to GO:0005524; all three GO:0004748 rows (IBA, IDA, IEA) MODIFY to GO:0008998 ribonucleoside-triphosphate reductase (thioredoxin) activity, because the purified P. aeruginosa NrdJa-NrdJb enzyme prefers CTP over CDP by >60-fold (PMID:26225432) and neither published assay used thioredoxin. The PseudoCAP IDA row from PMID:15722359 is the sole seed of the PTN000171476 IBD (39 leaf IBAs, 33 taxa); verdict OVER-SPECIFIC - the cobalamin-dependent RNR activity claim is sound and the clade placement is right, but PTHR43371 mixes NDP- and NTP-specific members (rtpR), so a single substrate-specific term cannot fit the clade. PSEUDOCAP WRONG_TERM CHECK defect and GO_CENTRAL WRONG_TERM ADD defect on PTN000171476. Cached PMID:26225432 (Crona 2015, PMC4520616) and wrote nrdJa-notes.md with the seed assessment table.
