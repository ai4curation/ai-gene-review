  summary: Review pvdE
  details: |
    The inner-membrane ABC exporter that moves the pyoverdine precursor from the cytoplasm into
    the periplasm. An unusual case: main already carried 88 lines of notes and a committed
    bioinformatics folder from the tier-1 PR, including an explicit "Review decisions (summary)"
    list, but the review file itself never landed. This session implemented that analysis rather
    than redoing it, re-checking each call.

    GO:0015440 ABC-type peptide transporter activity re-verified in OLS: the label is right, the
    definition does name "siderophores from Gram-negative bacteria" among exported peptides, and it
    is a descendant of GO:0042626, GO:0140359 and GO:1904680.

    TWO DIVERGENCES FROM THE EARLIER DECISION LIST, both because those notes predate the
    2026-11-14 ruling. GO:0016020 membrane and GO:0000166 nucleotide binding were slated for
    MODIFY; both become TOO_GENERAL, because the specific terms (GO:0005886, GO:0005524) are
    already asserted and accepted on the gene as their own rows, so there is nothing to propose.
    CLAUDE.md names membrane as the canonical example of the action.

    ONE REFINEMENT THE LIST DID NOT MAKE. It sent GO:0042626, GO:0140359 and GO:1904680 all to
    GO:0015440. Keying each row to its own evidence splits them: the GO:0042626 IMP (the mutant
    accumulates no periplasmic precursor PEPTIDE) and the GO:1904680 IEA (IPR005898, the cyclic
    PEPTIDE transporter family) both carry substrate specificity and are MODIFYed, while the
    GO:0140359 IEA rests on IPR011527, a generic ABC transmembrane domain that says nothing about
    what is transported, so that row's evidence stops at the general term and it becomes
    TOO_GENERAL. The ruling requires a MODIFY to rest on this row's own evidence.

    The IBD over-propagation finding from the earlier bioinformatics stands and is recorded as a
    GO_CENTRAL WRONG_TERM defect at PROBABLE with requested_change CHECK, plus a propagation_review
    with root_cause TERM_SCOPING_PROBLEM. The substance: of 140 leaves inheriting the GO:0042626
    IBA from PTN000656738, 126 are NBD-only soluble ATPases and only 6 carry a membrane domain, so
    an `enables` transporter activity sits at a node defined by the nucleotide-binding domain. The
    node's other two IBDs are NBD-level, which corroborates. The seed is sound for PvdE itself.
    PROBABLE rather than CONFIRMED because the leaf classification uses UniProt TRANSMEM features
    and Pfam xrefs rather than a fresh topology prediction.

    pvdE appears in its own WITH/FROM and is in fact the sole seed; recorded as the expected marker
    of experimental grounding, explicitly not circular.

    Deliberately not annotated: GO:0180061 native siderophore export across plasma membrane, since
    its definition ends in the extracellular region while PvdE exports a precursor into the
    periplasm and mature pyoverdine leaves by PvdRT-OpmQ. The avirulence of a deletion mutant in
    keratitis is a downstream consequence of losing pyoverdine, not a function.

    Knowledge gap recorded with the pathway review's own words behind it: no in vitro transport
    assay for PvdE exists, so the substrate identity is inferred from what fails to accumulate in
    the mutant rather than measured.

    Four reference titles were written from memory on the first attempt and rejected by the
    reference validator; all were replaced with the cached values. That is the third time this
    session, and the fix is to read titles from the cache programmatically rather than type them.

    Batch 5 context: one of six genes in the fifth PseudoCAP tier-3 batch, branched from current
    main rather than stacked on the unmerged batch-4 branch. The batch centred on the femA/femI
    transposition found in batch 4; vreR returned a clean negative on whether that architecture
    carries the error elsewhere, fpvA produced a regulatory-effect-annotated-as-participation
    correction, and tse5 a third instance of the toxin/immunity term inversion.
