  summary: 'Audit: lower the PTN002215378 GO_CENTRAL defect to SUSPECTED; the ''no
    reported polysaccharide role'' claim was an absence'
  details: |
    Checked all 7 UniProt records of PTN002215378. The clade is homogeneous (all 310-321 aa, Pfam PF03888 + PF17188; six also NCBIfam NF006990), so that observation survives on domain architecture rather than on names, four of six being SubName or ARBA-derived. Only E. coli RseB (P0AFX9) has experimental annotation: IDA antisigma factor binding, IDA protein stabilization, EXP periplasm, IPI sigma factor antagonist complex, and nothing polysaccharide-related. The load-bearing 'no reported role in polysaccharide synthesis' claim was an absence and is withdrawn as stated: E. coli RseB binds LPS (curated ECO:0000269) and the sigmaE regulon includes LPS biogenesis genes, so the broad term may be defensible for the enterobacterial leaves by another route. The entry now asserts only that the alginate route is lineage-restricted (algD operon confined to Pseudomonas and Azotobacter) and queries the IBD. Confidence PROBABLE -> SUSPECTED. Notes section added.
