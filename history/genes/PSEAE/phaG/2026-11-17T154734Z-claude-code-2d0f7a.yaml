  summary: Resolve GO:0090499 IBA as over-annotated for PAO1 PhaG
  details: |
    The BioH-seeded IBA for pimelyl-ACP methyl ester esterase activity (PTN002455972) changes from UNDECIDED to MARK_AS_OVER_ANNOTATED. This applies the same standard as the sibling biotin-biosynthesis IBA row and the PTHR43194 member exception for KT2440 PhaG. PAO1 PhaG has a characterized acyl-routing role (PMID:10713430), and PAO1 has a dedicated BioH (PMID:36689471). Not REMOVE, because no purified PhaG assay against this substrate exists. The propagation_review metadata on both BioH-seeded rows (GO:0090499 and GO:0009102) is aligned with the over-annotation call: root_cause PROPAGATION_BAD, failure_modes FUNCTIONAL_DIVERGENCE, and source_status SUPPORTS_SOURCE_BUT_NOT_TARGET for PTN002455972 and P13001.
