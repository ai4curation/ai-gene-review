  summary: Full review of P. aeruginosa lasB (PA3724) elastase; PseudoCAP IBA-seed
    assessment of the proteolysis IBD at PTN002138658
  details: |
    Reviewed all 14 GOA rows. The sole seed of the GO:0006508 IBD at PTN002138658 (PTHR33794, 21 leaf IBAs in 10 taxa in the PAINT leaf GAF) is the PseudoCAP IDA to PMID:1597429, a supernatant proteolytic/elastolytic activity assay tied to the mature 33 kDa elastase and its zinc dependence. Verdict SOUND: the claim is the gene product's own activity and is independently certain (EC 3.4.24.26, thermolysin-like active site in PDB 1EZM, His-223 mutants inactive), and the node term is maximally conservative for a clade of M4 metalloproteinases; no PseudoCAP defect on that row. Two other PseudoCAP rows from PMID:9642203, GO:0015628 protein secretion by the T2SS and GO:0043952 protein transport by the Sec complex, annotate LasB as a participant in its own export; both MARK_AS_OVER_ANNOTATED with PROBABLE PseudoCAP WRONG_TERM/CHECK defects, matching the pattern already recorded for PaAP (genes/PSEAE/lap) from the same paper. Both GO:0004175 endopeptidase rows MODIFY to GO:0004222. GO:0044010 biofilm and GO:0071978 swarming (IMP, PMID:18245294) KEEP_AS_NON_CORE as complemented but downstream requirements. Three NEW rows: zinc ion binding and calcium ion binding (IDA, PMID:1899664) and protein autoprocessing (IMP, PMID:1744034). Two core functions: the secreted metalloendopeptidase and the autocatalytic zymogen maturation. Added PMID:1744034, PMID:1899664 and PMID:11533066 as references.
