  summary: Full review of P. aeruginosa pilA (PA4525) major pilin; PseudoCAP IBA-seed
    assessment of the PTN002013003 motility and type IV pilus IBDs
  details: |
    Reviewed all 18 GOA rows. Both PTN002013003 seeds are SOUND: PilA is the major subunit of the type IV pilus fibre (cryo-EM PMID:39666767) and drives twitching. Seed rows carry evidence-code problems recorded as PSEUDOCAP defects (PMID:12933890 is a mutant assay, IMP not IDA; PMID:9224878 is a review, TAS not IMP); the type IV pilus seed cites a strain PAK gene-sequencing paper (PMID:2985436) that is a weak basis but the claim holds. Generic pilus (EXP, IDA, IEA) and cell surface rows MODIFIED to type IV pilus. Host ER membrane (EXP, IEA) and regulation of calcium-mediated signaling marked over-annotated (heterologous intracellular expression; delta-pilA indirect). CACAO cytosol IDA left UNDECIDED (full text unavailable; pilin is inner-membrane). Biofilm rows kept as non-core.
