- type: REVIEW
  outcome: changed
  summary: Review PA5190, completing its PseudoCAP molecular-function shared claim
  details: |
    A 200-residue nitroreductase-family flavoprotein, and the last unreviewed member of the
    GO:0003955 claim from PMID:25085734; PA0949, PA1204, PA2580 and PA4975 are merged and all
    ACCEPT.

    GO:0003955 NAD(P)H dehydrogenase (quinone) activity ACCEPT, consistent with the four
    siblings. The paper assayed five P. aeruginosa quinone oxidoreductases in vitro and each
    reduced quinones with minimal semiquinone formation, so this is a direct measurement rather
    than a phenotype. Carried over from the merged PA0949 review rather than filed as new: IDA
    would be the natural code rather than IMP, but the same understatement is on all five rows
    of the claim, which makes it uniform practice, and the cache is abstract-only.

    GO:0016491 oxidoreductase activity TOO_GENERAL. Verified in OLS: GO:0003955's ancestors run
    GO:0003824, GO:0016491, GO:0016651 acting on NAD(P)H and GO:0016655 with quinone as
    acceptor, so this row sits two levels above a term already asserted on the gene and names
    neither donor nor acceptor.

    Which of the five named enzymes PA5190 is: the four siblings' own descriptions account for
    WrbA (PA0949), ChrR (PA1204), MdaB (PA2580) and NQO1 (PA4975), leaving NfsB, and PA5190 is a
    nitroreductase while NfsB is the classic enterobacterial nitroreductase. This correspondence
    is recorded as an inference and explicitly NOT asserted as fact: the entry carries only
    GN OrderedLocusNames=PA5190 with no gene name, the paper is abstract-only and gives names
    rather than locus tags, and nothing checkable states the mapping. The annotation does not
    depend on it either way. Raised as a suggested question to confirm from the full text.

    No nitroreductase activity row is proposed despite the family and the submitted name. No
    nitroaromatic substrate has been assayed for this protein, the DE name is an ECO:0000313
    submitter import and the family similarity statement's only evidence is ARBA - both unvetted
    under the project rules - so proposing an activity on that basis would be manufacturing an
    assertion. Recorded as a BIOLOGY knowledge gap and an experiment instead.

    Batch context: this gene is one of the nine-gene PseudoCAP tier-3 batch, and one of five that
    were each the LAST unreviewed member of a molecular-function shared claim whose other members
    are already merged. Reviewing them gene by gene was therefore sound - each closes a group
    rather than opening one - provided each was read against its merged siblings first, which is
    what the house-style comparisons recorded above are.

    The worklist's review_folder fields are NOT updated here. build_pseudocap_mf_worklist.py
    derives them by scanning for any *-ai-review.yaml on disk, so regenerating mid-batch would
    have marked the then-unreviewed stubs as done. Now that all nine of the batch are reviewed
    the worklist can be regenerated, which is also what the shared-claim audit script needs
    before it will report these groups as complete.
