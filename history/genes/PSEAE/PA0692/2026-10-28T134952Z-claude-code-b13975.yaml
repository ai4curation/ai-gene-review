  summary: PseudoCAP IBA-seed review of PA0692 (PdtB TpsB transporter)
  details: |
    Reviewed all 5 GOA rows (all ACCEPT) and added one NEW IC row for cell outer membrane (TpsB family architecture plus the paper's description of PdtB as the outer-membrane pore). Both PseudoCAP IMP rows (PMID:25009238) are sole seeds of PTN002160772 IBDs. The process seed is sound: PdtB is the transporter whose loss blocks PdtA export. The complex CC seed is true by family, but IMP cannot show complex membership, so it is recorded as a WRONG_EVIDENCE_CODE source defect (SUSPECTED; abstract-only paper). The GO:0046819 definition is written for autotransporters, which is raised as a suggested question.
