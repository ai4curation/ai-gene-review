  summary: 'Reconcile bacterial succinyl-CoA synthetase reviews: PSEAE sucD'
  details: |
    Compared with the PSEAE sucC, PSEPK and ECOLI sucC/sucD reviews; PMID:10671455 re-read in full. No existing action changed. core_functions moved to contributes_to_molecular_function; both entries now carry in_complex GO:0042709 and location cytosol. Added a NEW cytosol row (GO:0005829, IC), inferred from HAMAP family membership, the heterotetramer with SucC and 89% identity to E. coli SucD; not measured. Description length corrected from 288 (the paper) to 295 residues (UniProt Q51567). Rate wording removed from the GO:0004776 IBA reason and the second core function. GO:0004550 reason records that the alpha subunit alone gave the transfer and that a host contaminant is not excluded. GO:0009142 now quotes the four-NTP sentence. UniProt record added to references. Notes record that Q51567 is also a seed of the GO:0004776 IBD at PTN000122012.

    Follow-up after independent checks (same day). A leftover dual-specificity wording on the GO:0042709 IEA row was replaced, and the cytosol row now says that the alpha family has no cytosol IBD that reaches SucD (its only one is at the SF24 clade PTN001671414).
