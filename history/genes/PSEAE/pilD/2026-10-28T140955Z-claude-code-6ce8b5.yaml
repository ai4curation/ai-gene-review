  summary: Full review of P. aeruginosa pilD (PA4528); PseudoCAP IBA-seed assessment
    of aspartic-type endopeptidase and plasma membrane IBDs at PTN000766410
  details: |
    Reviewed all 13 GOA rows. The PseudoCAP IDA aspartic-type endopeptidase activity (PMID:23255525; with UniProt EXP PMID:8096341), sole seed of the PTN000766410 GO:0004190 IBD (33 leaf IBAs), is directly supported by in vitro leader-peptide cleavage by purified PilD, and the aspartic mechanism is family-wide (PMID:10625704): seed SOUND, IBA accepted. The PseudoCAP plasma membrane IDA (PMID:9466269), one of three seeds of the plasma membrane IBD, is a correct claim but its abstract has no PilD localization data: UNVERIFIABLE, accepted with a SUSPECTED PSEUDOCAP reference query; the IBD is sound. Modified N-methyltransferase activity to N-terminal protein N-methyltransferase activity, pilus assembly to type IV pilus assembly (plus a SUSPECTED IMP-vs-IDA query), and membrane to plasma membrane. Marked part_of type II protein secretion system complex as over-annotated (PilD is a shared maturation enzyme, not a complex subunit), with a PROBABLE PSEUDOCAP defect. Core functions: aspartic-type prepilin leader peptidase and zinc-dependent N-terminal protein N-methyltransferase in the inner membrane.
