  summary: 'Create review: liuD, biotin carboxylase subunit of methylcrotonyl-CoA
    carboxylase'
  details: |
    Reviewed as the liuB/liuD shared-claim group from the tier-3 PseudoCAP worklist: both subunits carry GO:0004485 methylcrotonoyl-CoA carboxylase activity by IMP and IDA from the same pair of papers. Both papers are cached with full text, which settled the group rather than deferring it. The decisive fact is how the IDA was obtained: PMID:18469096 reconstituted the enzyme by mixing the separately purified alpha and beta subunits and renaturing them, so the activity was measured on the pair and no single chain was shown active. PMID:22158123, the 750-kDa alpha6beta6 structure of this organism own enzyme, says why: the alpha subunit carries the biotin carboxylase and BCCP domains and the beta subunit supplies the carboxyltransferase activity, with about 80 A between the two active sites, so the carboxyl group is handed between chains. Both GO:0004485 rows on both subunits are therefore ACCEPT with a WRONG_QUALIFIER PseudoCAP defect at CONFIRMED (enables to contributes_to) -- CONFIRMED rather than PROBABLE because the reconstitution is in the full text, unlike the cbb3 group where only an abstract was available. GO:0005515 bare protein binding is REMOVEd on both per policy, losing nothing because the interaction it records is the alpha-beta pairing that the GO:1905202 complex rows state precisely, one of them IDA from the structure. Specific to liuD: it is the alpha subunit, and its InterPro content matches the mechanism exactly, including the MCC_alpha_BT domain that PMID:22158123 names as mediating the BC-CT contact. GO:0004075 biotin carboxylase activity is ACCEPTed as the subunit own molecular function and the most informative row on the entry. Three rows are TOO_GENERAL on relations verified in QuickGO: GO:0000166 (GO:0005524 is_a it), GO:0016879 (GO:0004075 is_a it) and GO:0008300 (GO:0046247 is_a it). GO:0046872 metal ion binding is KEEP_AS_NON_CORE because the reaction is MgATP-dependent but no metal site is curated on the entry, so refining would assert more than is known. A question is raised about whether LiuD and AtuF cross-pair with the opposite beta subunit, since the substrate-specificity paper could not cleanly separate the MCCase and GCCase activities in vivo.
