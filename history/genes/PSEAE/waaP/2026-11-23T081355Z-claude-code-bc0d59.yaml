  summary: Review waaP
  details: |
    The essential lipopolysaccharide core heptose kinase, and two findings.

    MEASURED ACTIVITY THAT IS NOT THE FUNCTION. The curated record carries two EC numbers, both
    with ECO:0000269 to PMID:11741974: EC 2.7.1.235 for phosphorylation of heptose I in the
    Kdo2-lipid A core, and EC 2.7.10.2 for protein tyrosine kinase activity. The paper's title
    asserts both. But what the tyrosine kinase evidence amounts to is autophosphorylation on Tyr
    residues plus phosphorylation of poly(Glu,Tyr), a generic artificial acceptor; no physiological
    protein substrate is known, and the activity whose loss is lethal is the sugar kinase. That is
    the middle tier of the project's promiscuous-activity rule - real in vitro activity of unknown
    relevance - so GO:0004713 (EXP and IEA rows) and GO:0004715 (IEA from EC:2.7.10.2, verified in
    OLS as its child) are all MARK_AS_OVER_ANNOTATED. Not REMOVE, since the activity is genuinely
    measured; not KEEP_AS_NON_CORE, which would assert an evolved secondary function the evidence
    does not support. The rule states the tiering applies even on a direct-evidence row, so the EXP
    code does not change it. No ec_class_conflict arises because EC 2.7.10.2 is on the record.

    AN ONTOLOGY GAP. The physiological activity has no GO term. GO:0016301 kinase activity, carried
    by four rows (IDA x2, IEA, IMP), is the root of the kinase branch and says nothing about the
    substrate. Searched in OLS: GO:0033785 heptose 7-phosphate kinase activity is a different
    reaction - the free sugar phosphate in ADP-heptose synthesis, not a heptose already
    incorporated into lipopolysaccharide - and no lipopolysaccharide heptose or core kinase term
    exists; a QuickGO text search returns only unrelated or upstream terms. So all four rows are
    MODIFYed with an NTR replacement and a top-level proposed_new_terms entry, "lipopolysaccharide
    core heptose kinase activity (EC 2.7.1.235)", parented at GO:0019200 carbohydrate kinase
    activity, and the core_functions entry uses proposed_molecular_function with molecular_function
    unset - the mechanism the project rules prescribe for an activity with no class. The gap is
    general: the KdkA/RfaP family is widespread and E. coli RfaP has the same problem. The reaction
    has an EC number, a Rhea entry and a dedicated InterPro family (IPR017172), which is what makes
    this an ontology gap rather than an evidence gap.

    The IEA row's own evidence reaches the proposed term rather than stopping at "kinase":
    IPR017172 is the lipopolysaccharide core heptose kinase family itself, not a generic kinase
    signature.

    Routine: GO:0009244 lipopolysaccharide core region biosynthetic process ACCEPT on all three
    rows (participation - WaaP performs the phosphorylation step); GO:0009103 lipopolysaccharide
    biosynthetic process TOO_GENERAL, the same call batch 4 made for this exact term on wbpX and
    wbpY, since LPS is lipid A plus core plus O antigen and the row does not say which;
    GO:0005737 cytoplasm ACCEPT on both rows.

    Batch 5 context: one of six genes in the fifth PseudoCAP tier-3 batch, branched from current
    main rather than stacked on the unmerged batch-4 branch. The batch centred on the femA/femI
    transposition found in batch 4; vreR returned a clean negative on whether that architecture
    carries the error elsewhere, fpvA produced a regulatory-effect-annotated-as-participation
    correction, and tse5 a third instance of the toxin/immunity term inversion.
