  summary: Full review of P. aeruginosa ccmC (PA1477); PseudoCAP IBA-seed assessment
    of catalase activity IBD at PTN001247822
  details: |
    Reviewed all 16 GOA rows. The six PseudoCAP IMP rows cite PMID:16824107 (an E. coli CcmABC biochemistry paper); their phenotypes match PMID:18174132 (Baert et al. 2008, P. aeruginosa ccmC mutant), recorded as WRONG_REFERENCE source defects. The catalase activity IMP (sole seed of the PTN001247822 IBD, 143 leaf IBAs) is an indirect mutant phenotype (loss of heme supply to heme catalases): REMOVE, with PSEUDOCAP and GO_CENTRAL source defects; also removed the downstream IBA and derived cellular oxidant detoxification IEA. Glycolipid, twitching and swarming IMP rows removed as indirect phenotypes; pyoverdine and swimming marked over-annotated. Membrane and cytochrome complex assembly modified to plasma membrane and cytochrome c biosynthetic process. Core functions: heme binding and heme export to CcmE for cytochrome c maturation.
