  summary: Review xqhA, the orphan secretin of the XphA/XqhA hybrid T2SS; flag a peptidoglycan-binding
    over-annotation from a structure-only InterPro superfamily
  details: |
    Tier-2 PseudoCAP completion, and the one of the three with a substantive annotation finding.

    Identity from PMID:17351035, the paper the PseudoCAP IDA row cites: XqhA is an orphan GspD-family secretin that with its neighbouring GspC/XcpP homologue XphA replaces the XcpP/XcpQ gatekeeper pair and runs a hybrid T2SS on the remaining Xcp components. Because the GspC/GspD pair sets substrate specificity, the hybrid machine exports every major Xcp-dependent exoprotein except the aminopeptidase PaAP, and xphA-xqhA is transcribed from an earlier growth stage than xcpP-xcpQ. So PAO1 has three GspD-family secretins (XcpQ, HxcQ, XqhA) sharing PANTHER node PTN000768388, each with its own experimental annotation.

    Nine rows. Six ACCEPT, two MODIFY on the same grounds and with the same corpus-consistency note as PA0685, one NEW (GO:0008320, IC), and one MARK_AS_OVER_ANNOTATED.

    The finding: GO:0042834 peptidoglycan binding, IEA from IPR036680. That entry is typed homologous_superfamily (Sporulation-like domain superfamily), a structural grouping, yet InterPro maps it to a specific ligand-binding molecular function, and its own description justifies the term from FtsN of E. coli and Caulobacter crescentus plus CwlM and RlpA, which are cell division and cell wall proteins. In xqhA the match is at residues 684-769, in the C-terminal extension past the secretin domain, and nothing else covers that region: no Pfam, no PROSITE, no NCBIfam, no family-level InterPro entry. Verified the match coordinates and the full domain architecture against the InterPro API rather than assuming.

    I first hypothesised that the match was on the N0 domain and that the transfer was a fold-only error there; checking the coordinates showed the match is C-terminal instead, so that hypothesis was wrong and was dropped rather than written up.

    The comparator check is what made this actionable, and it was run only after confirming the query returns positives, so a negative could not be a malformed-query artifact. GO:0042834 has 42,400 annotations overall and nine in PAO1. Of those nine, five (PA5052, PA5037, PA4278, PA3110, rlpA) match the domain-level entry IPR007730 as well as the superfamily, one (PA0667) comes by a LysM-like domain IPR007340, and one (fimV) is experimental IDA from PMID:21097635. xqhA is the sole protein in the organism assigned from the superfamily alone. IPR007730 is typed domain and InterPro maps the same GO term from it, so every other protein reaching the term by this route has the domain-level signature that the characterised members, rlpA included, actually match.

    Chose MARK_AS_OVER_ANNOTATED and not REMOVE. The claim is not demonstrably false and there is a plausible reading, since a secretin must traverse the peptidoglycan layer and C-terminal sacculus-gripping modules occur in related channel-forming families. But it is untested on XqhA, untested on any secretin with this fold, and transferred from proteins doing an unrelated job: an over-annotation of a structure match rather than a mapping that is wrong.

    Filed a source defect against InterPro, WRONG_TERM with requested_change CHECK and confidence SUSPECTED, scoped deliberately to the mapping tier rather than to this gene: should a homologous_superfamily entry carry a specific ligand-binding MF when the domain-level entry for the same fold exists and already carries it? The request states what it can show (the evidence tier, and the one-proteome demonstration of the effect) and what it cannot (whether XqhA C-terminus binds peptidoglycan), and says xqhA is named only because it is the gene under review.

    Added a suggested experiment that would settle the row directly: express residues ~605-776 and assay sacculus binding with a characterised SPOR domain as positive control and the secretin ring domains as negative.

    Provider deep research unavailable (perplexity unconfigured, asta HTTP 429); documented in xqhA-notes.md per project policy.

    just validate passes; quotes verified across all three reviews (61 total); notes inline quotes checked verbatim.
