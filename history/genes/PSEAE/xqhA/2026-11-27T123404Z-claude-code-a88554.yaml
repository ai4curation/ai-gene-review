  details: >-
    The previous event replaced "no family-level InterPro entry covers that region" with the
    narrower claim the GO:0042834 row actually needs, and did so only in the notes. The broader
    wording survived twice in the review itself: in the row's reason and in the source_defects
    explanation. The second is the one that matters, because export-source-defects sends that text
    to InterPro as a correction request, so an over-broad claim in it is a claim made to the
    resource rather than to a reader here.

    Both now say what the comparator table above them already evidences: no Pfam, PROSITE or
    NCBIfam signature reaches 684-769, and no entry mapped to GO:0042834 other than IPR036680 does
    either. The broader version was not false - IPR050810 stops at 612, IPR013356 at 605, and
    IPR001775's last motif at 598 - but it asserted more than the request needs and more than the
    table supports, and the guidance on wrong-gene and wrong-reference claims applies in the same
    way to any correction request: the confidence has to match what was actually seen.

    This is the sixth instance in two days of a fix landing on the instance that was cited while
    the same claim stood elsewhere, and the first where the surviving copy was the one addressed to
    an outside resource.

    One hypothesis checked and left out. The review suggested that a Pfam/HMMER match carries both
    an alignment and a wider envelope boundary, and that two resources publishing different ones
    would explain a single signature having two start coordinates. It was offered as untested. The
    InterPro API's match object for PF00263 on Q9I2M7 exposes one fragment, 359-597, with
    dc-status CONTINUOUS and a model score, and no second coordinate pair, so that endpoint neither
    confirms nor refutes it. The notes keep "not established here" rather than gaining a fourth
    mechanism-shaped story about this number; recording the check so it is not repeated.
