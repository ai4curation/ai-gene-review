  summary: >-
    Correcting an unsourced domain boundary in the notes, rescoping the C-terminal gap from MF_DARK
    to RESIDUAL_SUBGAP, and quoting the DR line under the GO:0015628 InterPro row.
  details: >-
    Three review suggestions, all taken, and the first is a wrong figure of my own rather than a
    style point. The notes gave the secretin beta-barrel as residues 359-597, among boundaries that
    were otherwise read straight off the UniProt feature table. The record carries only
    DOMAIN 429..597 for PF00263; 359 appears nowhere in it. It looks to have been produced by
    starting the barrel where the last NolW-like domain ends at 352, which assumes the domains abut
    and the record does not say so. Corrected to 429-597 with the feature named, and the unfeatured
    353-428 stretch stated as such rather than absorbed into the barrel. Nothing in the review
    depended on the number, which is how it survived: it sat in a sentence whose other four ranges
    were sourced, so it read as sourced too.

    The C-terminal gap was filed as MF_DARK, which says the gene's molecular function is unknown.
    It is not: the secretin channel activity is asserted and well supported, and the gap is one
    region of about 170 residues. RESIDUAL_SUBGAP is the value for exactly this shape - a core
    function that is solid with one sharp mechanistic hole left - so the gap now says what it is
    rather than overclaiming darkness across the whole aspect. The gap statement itself is
    unchanged, since it was already region-scoped in prose.

    The GO:0015628 InterPro row gained the DR InterPro quote its GO:0015627 sibling already
    carried, as for the other two genes in this batch.
- type: AUDIT
  outcome: changed
  sections:
  - notes
  summary: >-
    Withdrawing the previous event's claim that 359-597 was fabricated. It is InterPro IPR004846's
    match boundary, from the same API query as 48-605 and 684-769.
  details: >-
    The previous event said the notes' 359-597 for the secretin beta-barrel "appears to come from
    starting the barrel where the last NolW-like domain ends at 352, which assumes the domains
    abut", and that the record carries only DOMAIN 429..597. The second half is true of the UniProt
    flat file. The first half is false, and the arithmetic never worked: 352 abutting gives 353,
    not 359.

    A live InterPro query on Q9I2M7 gives the real source. IPR004846 "Type II/III secretion system,
    secretin-like domain" matches 359-597 exactly. IPR013356 matches 48-605, which is the other
    figure in that sentence, and IPR036680 matches 684-769, which is the figure the review already
    attributes to the API. All three came from one query; only the first was later checked against
    a file that does not carry it.

    So the original notes were not wrong, they were mixing two sources without saying so, and the
    correction replaced an InterPro boundary with a Pfam one while describing the InterPro boundary
    as invented. The notes now give both with their signatures, say why they differ - the InterPro
    entry covers the whole secretin-like region, the Pfam model its core - and state that every
    InterPro span in the file comes from the API query rather than the cached record.

    Worth recording how the false claim passed. Two parties reached it independently: the review
    observed that 359 has zero hits in the UniProt file and concluded it was computed, and I
    accepted that and supplied a mechanism for the computation. Neither of us queried the source
    the number actually came from, and the agreement between us read as corroboration. The absence
    was real and the inference from it was not: a figure missing from one source is evidence about
    that source, not about the figure. This is the same shape as the stamp counts audited on the
    PSEUDOCAP record today - an instrument narrower than the claim returning a clean, confident
    negative - and it is sharper here because the narrow instrument was the one I reached for while
    writing up a lesson about numbers that lack provenance.

    The GO:0042834 row and its source defect are unaffected: IPR036680's 684-769 match, the absence
    of IPR007730, and the SUSPECTED / CHECK confidence all stand, and the same query confirms them.
- type: AUDIT
  outcome: changed
  sections:
  - notes
  summary: >-
    The explanation written to replace the withdrawn claim was itself unsourced and is wrong. The
    two boundaries are the same Pfam signature read from two resources, not two signatures.
  details: >-
    The previous event attributed both spans and then wrote a causal sentence between them that was
    attributed to nothing: "the InterPro match starts about 70 residues earlier because it covers
    the whole secretin-like region rather than the Pfam model's core". The review asked for it to
    be sourced or dropped, and reasoned that an entry matching 70 residues wider than its member
    signature would need a second member signature to explain, with no candidate visible in the
    record's DR block.

    A member-level InterPro query on Q9I2M7 settles it, and against both of us. IPR004846
    integrates PF00263 and InterPro reports both at 359-597 - entry and member signature identical,
    no second signature contributing anything. UniProt's feature table carries that same PF00263
    match as DOMAIN 429..597. So the disagreement is not between an entry and its member, and not
    between two models of different scope. It is one signature with two different start
    coordinates depending on which resource is read, and the /note on the UniProt feature is
    IPR004846's own name, which is how UniProt labels a Pfam feature through its integrating entry.
    Why the two coordinates differ is not established, and the notes now say that rather than
    offering a mechanism.

    The shape is the same as the two rounds before it, one level further in. First a number was
    called invented on the strength of one file that did not carry it. Then, having found the
    number's real source, I supplied a reason for the discrepancy without querying whether the
    discrepancy was of the kind the reason described. Attributing the figures and then explaining
    them from nothing leaves the explanation carrying their borrowed credibility, which is the
    same mechanism as an unsourced range sitting among sourced ones - the thing this file was
    being edited about in the first place.

    One adjacent claim corrected with the same query. The notes said no family-level InterPro entry
    covers 684-769. That is true - IPR050810, the PANTHER-backed family entry, matches 30-612 - but
    it was asserted without the span and is not what the GO:0042834 row needs. The narrower claim
    is now stated: no entry mapped to GO:0042834 other than IPR036680 reaches 684-769. IPR001775 is
    also recorded as five short PRINTS motifs between 352 and 598 rather than one block, which is
    what the earlier "GspD/PilQ family entry" phrasing obscured.

    The GO:0042834 row, its source defect and every action in the three reviews are unchanged. The
    same query re-confirms IPR036680 at 684-769 and no IPR007730 anywhere on the protein.
