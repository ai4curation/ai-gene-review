  summary: Full review of P. aeruginosa motB (PA4953) MotAB stator subunit; PseudoCAP
    IBA-seed assessment of the PTN001251133 swarming IBD
  details: |
    Reviewed all 7 GOA rows. The sole seed of the PTN001251133 GO:0071978 swarming IBD (PseudoCAP IMPs, PMID:15629949, PMID:25349157) is OVER-SPECIFIC: MotB is a genuine stator subunit, but the single motAB mutant swarms like wild type (Toutain 2005) or better (Kuchma 2015), and swarming is a lifestyle context not shown for most of the 9 leaves; asked GO Central to repoint the node term to GO:0071973. Swarming rows kept as non-core with PSEUDOCAP defects (evidence code IGI-like; increased-swarming phenotype). Accepted plasma membrane, flagellum-dependent cell motility IMP and stator complex IBA; membrane modified to plasma membrane.
