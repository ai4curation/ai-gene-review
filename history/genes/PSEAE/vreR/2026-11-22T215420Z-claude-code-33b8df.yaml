- type: REVIEW
  outcome: changed
  summary: Review vreR, the second half of the femA/femI transposition and a second
    signalling system
  details: |
    The sigma factor regulator of the PUMA3 cell-surface signalling system
    (PA0674-PA0675-PA0676 = VreA receptor, VreI sigma, VreR regulator; vreI already merged, vreA
    absent). Selected for this batch as a second instance of the architecture in which batch 4
    found annotations transposed between components.

    A NEGATIVE RESULT WORTH RECORDING: there is no transposition here. Both of vreR's two rows
    describe a sigma factor regulator and both are right for this protein. That matters for how
    the femA/femI finding should be read - it looks like a specific accident with three adjacent,
    one-letter-apart fem symbols rather than a systematic failure in how these systems were
    curated.

    GO:0016989 sigma factor antagonist activity (IMP) ACCEPT, matching the merged foxR and PA0471
    reviews, which accept the same term on the same reasoning: the FecR_N/FecR domain pair
    identifies a cell-surface-signalling anti-sigma factor. GO:0045892 MODIFY to GO:2000143
    negative regulation of DNA-templated transcription initiation, again matching foxR and PA0471
    verbatim, so the three FecR-type regulators in the corpus now agree; GO:2000143 verified in
    OLS as a child of GO:0045892 and is the mirror of the GO:2000142 the cognate sigma reviews
    accept.

    The MODIFY/TOO_GENERAL contrast with femI in this same batch is deliberate and is stated in
    both files: femI already carried GO:2000142 as its own accepted row, so the specific term was
    asserted elsewhere in the review and TOO_GENERAL applied; vreR carries no GO:2000143 row, so
    the specific term has to be proposed, which is what MODIFY is for.

    AN ONTOLOGY GAP, which is the substantive finding. The paper states the regulator's role is
    dual: it "both inhibits the function of the ECF sigma factor and is required for its
    activity". GO:0016989 captures only the inhibition. Searched in OLS: GO has sigma factor
    activity (GO:0016987), sigma factor antagonist activity (GO:0016989), anti-sigma factor
    antagonist activity (GO:0043856), sigma factor antagonist complex (GO:1903865) and antisigma
    factor binding (GO:0045152) - a class for every other role in these systems and none for a
    protein required for a sigma factor's activity. PANTHER names this very family for the role GO
    cannot express (PTHR30273, "periplasmic signal sensor and sigma factor activator
    FecR-related"), which is independent evidence that the gap is in the ontology and not in the
    evidence.

    Recorded as a proposed_new_terms entry, "sigma factor activator activity", parented at
    GO:0140110 transcription regulator activity, with a second core_functions entry using
    proposed_molecular_function so both of the protein's activities are represented. Deliberately
    NOT a NEW annotation row: there is no term to annotate to, and inventing an id is exactly the
    hallucination the project rules warn against. GO:0043856 is not a substitute - it describes
    inhibiting an anti-sigma factor, which is a different relation and a different protein.

    The gap is general rather than vreR-specific: the merged foxR and PA0471 reviews carry the
    same single-sided encoding without remarking on it, and E. coli FecR is the paradigm case. If
    the term is created, those two merit the same addition.

    Batch 5 context: this gene is one of six in the fifth PseudoCAP tier-3 batch, branched from
    current main rather than stacked on the unmerged batch-4 branch. The batch was built around
    the femA/femI transposition, with vreR and fpvA included to test whether the same
    architecture carries the same error elsewhere.

    Two counts corrected while selecting the batch, both recorded in the fetch commit. PA1268 was
    originally chosen as the only remaining true shared claim but already carries a COMPLETE
    review from PR #6274, so the committed worklist's review_folder is stale for it. Measured on
    disk, 22 tier-3 genes genuinely remain once batch 4 merges, not the 32 the worklist and the
    project page both report.
