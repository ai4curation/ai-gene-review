  summary: 'Review PA4709 (phuS): heme-binding IMP cites a growth phenotype, not binding'
  details: |
    Identified the gene as phuS, which the entry does not: PA4710 is phuR, and the sequence carries His
    at 209 and 212, the ligands PMID:18020455 reports for a 354-residue, 39 kDa cytoplasmic protein.
    Both positions verified against the fetched record.

    GO:0020037 is accepted but its reference is queried. PMID:10658665 reports a growth defect for a
    phuSTUV four-gene deletion, which is neither phuS-specific nor a binding measurement; the direct
    evidence is PMID:18020455 (resonance Raman plus mutagenesis) and PMID:22451925 (holo- but not
    apo-PhuS complexes with HemO; His-212-Ala disrupts it). Both added to the references. Filed
    WRONG_REFERENCE at SUSPECTED with CHECK, since that paper is abstract-only here.

    GO:0006826 iron ion transport looked like an over-annotation on a cytoplasmic chaperone. OLS showed
    GO:0015886 heme transport descends from it via GO:1901678, so the row is a true parent and the fix
    is a refinement, not a removal. Checking prevented a wrong action.

    Added a NEW cytoplasm row as IC with three grounds stated: the papers' own description, the absence
    of any signal peptide or transmembrane segment, and the requirement that the transfer to the
    cytoplasmic HemO happen there. Filed a UniProt WRONG_STATEMENT at PROBABLE on the submitted name
    'Probable hemin degrading factor', which attributes HemO's activity to PhuS, noting the missing
    GN Name=phuS in the same explanation.
