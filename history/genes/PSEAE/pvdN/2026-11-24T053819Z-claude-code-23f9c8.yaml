- type: EDIT
  outcome: changed
  summary: 'Address review on PR #6826: name and rebut the PDB 5HH9 desulfurase claim;
    add PLP binding'
  details: |
    The review found that the first version asserted twice that nothing had been done on the purified protein, when the record it audits cites two crystal structures. Both claims are withdrawn and the structures are now engaged with. PDB 5I90 is published (PMID:27139833, added as a reference with three findings) and supports the removal rather than undercutting it: titled for a periplasmic aminotransferase, it assigns the fold to the type I aspartate aminotransferases rather than the class-V Csd subfamily the record's SIMILARITY line asserts, and calls the step uncharacterized. PDB 5HH9 is the real counter-evidence and is now named and rebutted in the source defect: its deposition title claims structural and biochemical characterization of a novel L-cystine desulfurase in pyoverdine biosynthesis. Three limits are recorded - it is a PDB deposition submitted January 2016 with no literature citation, so the asserted characterisation was never published; it names L-cystine, the disulfide, whereas the row's term and EC number are for the L-cysteine reaction, so at face value it is not evidence for GO:0031071 or EC 2.8.1.7; and it is contradicted by the published higher-resolution structure and by the in-frame deletion phenotype. That unresolved claim is now given as the reason for PROBABLE/CHECK rather than CONFIRMED, which is a better basis than the false one it replaces. Also added NF051467 peri_mod_PvdN, UniProt's own protein-specific model, named for periplasmic modification rather than sulfur mobilisation, which makes the record internally inconsistent. New NEW row for GO:0030170 pyridoxal phosphate binding by IDA on PMID:27139833: the cofactor is observed bound in both structures with structure-derived binding features (ECO:0007829), it is independently necessary for Tat export, and without it the gene would be left with no molecular function at all once both desulfurase rows are removed. Deliberately narrow: cofactor binding, not an activity.
