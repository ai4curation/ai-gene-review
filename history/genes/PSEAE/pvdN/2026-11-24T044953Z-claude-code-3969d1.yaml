  summary: 'Review pvdN: remove both cysteine desulfurase rows, defect against UniProt'
  details: |
    Reviewed the periplasmic pyoverdine side-chain tailoring enzyme. Five rows ACCEPTed (four GO:0002049, one GO:0030288 periplasm IDA). Both GO:0031071 cysteine desulfurase activity rows REMOVEd: the IBA from PTN008451775 and the IEA from EC 2.8.1.7. The donors of the PAINT node were resolved against the UniProt API, not read from the accessions: P77444 E. coli SufS, Q46925 E. coli CsdA, O32164 B. subtilis SufS, Q8IBT4 P. falciparum SufS. All are genuine cysteine desulfurases across four kingdoms, so the node is soundly seeded and the fault is in the transfer to this target, which shares only the class-V PLP-dependent aminotransferase fold. A WRONG_TERM source defect is recorded against UniProt at PROBABLE with requested_change CHECK, because the entire cysteine-desulfurase identity on the record - RecName, EC number, CATALYTIC ACTIVITY block and the Csd subfamily SIMILARITY statement - carries ARBA evidence and nothing else, so correcting the name and EC there would clear the derived GO rows at source. PROBABLE rather than CONFIRMED: nobody has assayed the purified protein for either activity, and the positive identification of its real reaction comes from a review rather than primary enzymology.
