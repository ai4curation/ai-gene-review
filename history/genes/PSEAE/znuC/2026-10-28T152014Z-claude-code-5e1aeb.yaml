  summary: 'Review znuC (PA5500): PseudoCAP ''response to zinc ion'' seed should be
    zinc import'
  details: |
    Reviewed all 10 GOA rows. Both GO:0010043 rows (IBA from PTN001952271, PseudoCAP IMP from PMID:24086521) were MODIFYed to GO:0071578 zinc ion import across plasma membrane: ZnuC is the ATPase subunit of the ZnuABC importer, and the zinc-sensing 'response' in the seeding paper belongs to Zur (Np20, PA5499). The seed evidence is a growth defect in LB + 0.5 mM EDTA. Generic rows GO:0042626, GO:0055085 and GO:0071577 were MODIFYed to the specific supported terms; GO:0015633, GO:0043190, GO:0005886, GO:0005524 and GO:0016887 were ACCEPTed. Source defects filed against PSEUDOCAP and GO_CENTRAL (WRONG_TERM; PTN001952271 is sole-seeded and carries 1455 GOA rows, 1448 of them TreeGrafter) and against UNIPROT (WRONG_QUALIFIER, enables -> contributes_to on the complex activity). Added notes with a PseudoCAP IBA-seed assessment table (verdict INDIRECT-PHENOTYPE) and a bioinformatics folder with node composition and propagation counts.
