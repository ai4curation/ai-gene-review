  summary: Remove supporting quotes that did not carry their rows
  details: |
    PR #6341 review suggestion 5. Three rows cited a supporting_text that established something other than the claim. GO:0020037 heme binding was supported by the operon sentence attributing haem binding to HasA rather than HasR -- the reason already said so, which left a quote in the evidence slot arguing against the row it supported. GO:0007166 and GO:0038023 were supported by the same operon quote, which establishes context and not signalling. All three verdicts stand (ACCEPT on curator deference for the binding row, KEEP_AS_NON_CORE on similarity for the two signalling rows) but no quote is now asserted for any of them, on the principle that asserting no quote is better than asserting one that does not carry the claim.
