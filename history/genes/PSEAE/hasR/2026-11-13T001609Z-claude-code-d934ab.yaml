  summary: 'Create review: hasR, outer-membrane haem receptor of the has system'
  details: |
    Reviewed as the hasR/phuR shared-claim group from the tier-3 PseudoCAP worklist. The substantive finding is that both haem receptors carry siderophore annotations: GO:0015344 and GO:0044718 by IBA, plus GO:0033214 inferred logically from them. All trace to PTN004738955, which was checked directly in the PANTHER tree with projects/PSEUDOCAP/panther_tree.py on 2026-11-13. The node is the LUCA root of PTHR30069, 149 leaves across 18 subfamilies, and its five seeds are siderophore or colicin receptors in five other subfamilies: Q9HVC0 (SF42), Q9HWM5 (SF37), Q9I527 ferric enterobactin receptor PirA (SF8), Q05098 ferric enterobactin receptor (SF51) and P17315 colicin I receptor (SF53). The targets sit in the haem subfamilies, whose PANTHER names state it: SF41 "Heme uptake outer membrane receptor HasR" and SF29 "Heme_hemoglobin uptake outer membrane receptor". The seeds are not the problem -- two of them, PA4675 and PA4156, were reviewed by this project in tier 2 and their own siderophore rows accepted as sound. The depth is: the node supports the shared TonB-dependent outer-membrane mechanism, not the substrate. Relocation was tested rather than assumed and does not work, because the smallest clade containing all five seeds is PTN002824128 (145 leaves), which also contains SF29 and SF41, so no child node holds the siderophore receptors alone; the remedy must be generalising the node terms or blocking them in the haem subfamilies. The GO_CENTRAL defect is recorded once, on hasR, at CONFIRMED, with phuR cross-referencing it so the upstream request is filed once. GO:0055085 is KEEP_AS_NON_CORE on both because GO:0015886 haem transport is not a descendant of it (checked in QuickGO), so refining would drop the transmembrane claim -- the same structural case the betT1 and PA5291 reviews handled this way. Specific to hasR: the haem rows rest on a deletion phenotype with a double-mutant control, and localisation on the outer-membrane fractionation of iron-starved cells. Both GO:0019867 rows are MODIFYed to GO:0009279 cell outer membrane. GO:0022857 is TOO_GENERAL since GO:0015232 is_a it. The two signalling rows, GO:0007166 and GO:0038023, are KEEP_AS_NON_CORE: the has system is a cell-surface signalling system, but these rows rest on similarity to other iron-starvation receptors rather than on a signalling experiment with HasR. On GO:0020037 heme binding, cited as IDA to the same genetics paper: the abstract describes hasA, not hasR, as the haem-binding protein, and we hold abstract only. Per the project rule that is not grounds to doubt an experimental row whose full text has not been read, and a haem receptor does bind haem, so the row is ACCEPTed with the ambiguity recorded rather than acted on.
