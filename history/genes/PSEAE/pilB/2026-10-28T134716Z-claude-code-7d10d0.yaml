  summary: Full review of P. aeruginosa pilB (PA4526); PseudoCAP IBA-seed assessment
    of ATP hydrolysis activity IBD at PTN001250205
  details: |
    Reviewed all 11 GOA rows. PMID:18174131 verified as the correct paper (Chiang et al. 2008, PilB/PilT/PilU ATPase assays), not a mis-keyed neighbour of PMID:18174132. The PseudoCAP IDA ATP hydrolysis activity (sole seed of PTN001250205, 90 leaf IBAs) is directly supported by the in vitro ATPase assay of purified PilB: seed SOUND, IBA accepted. Accepted cytoplasm, ATP hydrolysis (IBA/IDA/IEA), type IV pilus assembly and motility; plasma membrane IBA kept as non-core; pilus assembly and cell motility modified to the type IV pilus-specific terms. Two SUSPECTED/CHECK PseudoCAP defects record that PMID:1671384 (a pilD paper) is a weak basis for the IDA motility and assembly rows. Core function: ATP hydrolysis-driven type IV pilus extension.
