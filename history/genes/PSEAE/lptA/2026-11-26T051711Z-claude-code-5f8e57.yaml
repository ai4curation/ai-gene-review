  summary: 'PR review round 1: the record carries the complementation I said could not be traced'
  details: |
    The review's stated central limitation was false. lptA-uniprot.txt carries

      CC   -!- MISCELLANEOUS: Can complement the E.coli plsC mutant.
      CC       {ECO:0000269|PubMed:16079332}.

    ECO:0000269 with a PubMed id is the strongest UniProt support class. So "functional homologue of
    PlsC" was demonstrated by complementing a plsC null, a curator read it from the same paper, and
    it is in-species functional evidence about this gene product rather than a transfer from PlsC.
    Three passages said the opposite and are corrected; the MISCELLANEOUS line is now a supported_by
    entry on the GO:0042171 IMP row, the GO:0003841 ISS row and the core function, with
    record_section CC:MISCELLANEOUS backfilled.

    The first knowledge gap was wrong as written ("the only in-species evidence is a mutant's
    membrane composition") and is narrowed to what is genuinely unmeasured: kinetics, acyl-CoA
    chain-length preference, substrate breadth. Complementation shows the function is supplied and
    nothing more. The DISRUPTION PHENOTYPE line is now cited for the longer-chain C18 claim, which
    had appeared unsourced.

    The cause is worth recording because it has happened before. My first read of the CC block was
    piped through `head -20`, which stopped two lines before MISCELLANEOUS, and I then wrote about
    what the record contains on the strength of a view I had truncated myself. That is the same
    mechanism as the nudC title fabrication in batch 7: a truncating command produced output that
    looked complete, and the thing I needed was just past the cut. Asserting that a source does not
    contain something requires a read that is complete by construction.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - core_functions
  summary: 'PR review round 2: the quote added to source the C18 claim was itself truncated'
  details: |
    Round 2 found the same mechanism inside the round-1 fix. The supported_by entry added to source
    the longer-chain C18 claim read only "increasing the proportion of" - cut at the record's line
    wrap, one word before "longer-chain (C18) fatty acids", which is the thing it was added to
    support. It passed quote_check because it is verbatim, and asserted nothing.

    That is a truncated quote introduced in the very commit whose post-mortem was about truncation
    producing a false claim. Worth recording plainly rather than quietly fixing: diagnosing a failure
    mode in prose does not prevent it in the next action.

    Rather than fix only the quote the reviewer caught, every supporting_text across the four genes
    of this batch was audited for the same defect. Four more were cut mid-token at a UniProt line
    wrap and lost what they supported: the catalytic reaction quote here (twice, ending at
    "1,2-diacyl-" so the product was missing), the pathway quote here (ending at "CDP-" so the step
    number was missing), and the wapP co-expression quote on PA5007 (ending at "over 250-fold" with
    the MIC increases missing). All extended; a scripted re-audit for quotes ending on a hyphen or a
    dangling preposition now returns none.

    Extending them surfaced a second-order problem the validator caught: reproducing the source's
    wrap inside a YAML folded scalar renders the newline as a space, so the quote displayed as
    "1,2-diacyl- sn-glycero-3-phosphate" with a spurious gap. The quote checker accepts it, since it
    normalises the source's wrap too, but the stored value was wrong for a reader. Rewritten as
    single-line quoted scalars, which verify against the wrapped source and clear the
    folded-scalar warnings.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  summary: 'PR review round 3: a quote cut at the head, which the tail sweep could not see'
  details: |
    The GO:0006654 phosphatidic acid biosynthetic process row's only quote was "by incorporating
    acyl moiety at the 2 position." The record's sentence is "Converts lysophosphatidic acid (LPA)
    into phosphatidic acid by incorporating acyl moiety at the 2 position." - so the row for
    phosphatidic acid biosynthesis had taken the half of the sentence that does not name
    phosphatidic acid, while the other half was quoted on a different row. Extended to the full
    sentence.

    This is the same class as the five fixed in round 2 and it survived that sweep because the sweep
    tested only one direction of the error. It looked for quotes cut at the tail - ending on a hyphen
    or a dangling preposition - and this one is cut at the head and ends on a full stop.

    I tried to generalise the check and it does not generalise. A mechanical proxy - does any quote
    on a row name a distinctive word from the term the row claims - flags 17 rows across these four
    genes and nearly all are correct: a quote supporting L-malate dehydrogenase (quinone) activity
    is properly the reaction equation or "the wild-type expressed the dye-dependent MQO", and a
    quote supporting plasma membrane is properly a TRANSMEM feature line. Requiring a quote to
    restate its term label would be the quoting-for-labels anti-pattern the project rules forbid.

    So the honest position: the tail-truncation sweep is mechanisable and was run; head truncation
    is a per-quote judgement about whether the quote asserts what the row claims, and there is no
    cheap proxy for it. The thing to carry forward is the question rather than a script - when
    quoting part of a sentence, does the part quoted contain the claim, or the part left out.

    Recorded separately: the reviewer measured the corpus-wide extent of the tail case at 1212
    supporting_text values ending in a hyphen across 428 files, with zero in this batch. Those are
    candidates rather than confirmed defects, since a sibling quote may carry the row's claim, and
    they belong in a dedicated sweep PR rather than a content one.
