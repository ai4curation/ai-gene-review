  summary: 'Review lptA (PA0005): two GO terms for one reaction, and a total symbol
    collision with E. coli lptA'
  details: |
    PA0005, entry name PLSC_PSEAE: the PlsC-family 1-acyl-sn-glycerol-3-phosphate acyltransferase that
    installs the 2-position acyl chain of membrane phospholipids.

    Two GO terms for one reaction. GOA carries GO:0003841 1-acylglycerol-3-phosphate O-acyltransferase
    activity on three rows (IBA, IEA from EC:2.3.1.51, ISS from P26647) and GO:0042171 lysophosphatidic
    acid acyltransferase activity on one (IMP). Their definitions describe the same transformation under
    two naming conventions, because lysophosphatidic acid is 1-acyl-sn-glycerol-3-phosphate and
    phosphatidic acid is 1,2-diacyl-sn-glycerol-3-phosphate. Neither subsumes the other, checked in OLS:
    GO:0042171's ancestors are GO:0071617, GO:0016747, GO:0016746 and transferase activity, with
    GO:0003841 absent.

    Both rows are therefore ACCEPTed. The redundancy is the ontology's, not the annotation's, and
    dropping one to tidy the gene would discard a true annotation while leaving the ontology unchanged.
    Raised as a suggested_questions entry for an obsoletion or mapping pass, where the term usage can be
    counted across the corpus. core_functions uses GO:0003841, the EC-grounded term the curated reaction
    and three rows converge on.

    The symbol is a complete collision and is flagged in the description. lptA in E. coli and in most of
    the literature is the periplasmic LPS-transport protein of the Lpt bridge; this is an unrelated
    phospholipid acyltransferase, and the symbol abbreviates lysophosphatidic acid acyltransferase A
    from PMID:16079332. Nothing on the record is wrong - the entry name is PLSC_PSEAE and the gene name
    carries ECO:0000303 to the coining paper - so no source defect, but anyone matching on symbol alone
    lands on the wrong protein.

    Two granularity calls, both verified rather than assumed: GO:0008654 phospholipid biosynthetic
    process (IMP) is TOO_GENERAL because OLS puts it among GO:0006654's ancestors via GO:0046474, and
    GO:0016746 acyltransferase activity (IEA, generic IPR002123 signature) is TOO_GENERAL because it is
    an ancestor of the annotated GO:0042171. Neither is MODIFY: a generic acyltransferase signature does
    not carry the substrate, and a fatty-acid-profile phenotype does not pick out the phosphatidic acid
    step, so neither row's own evidence supports the deeper term.

    The honest provenance of the catalytic assignment is the ISS row, and the review says so: every
    functional statement on the record is ECO:0000250|UniProtKB:P26647, a curated transfer from E. coli
    PlsC. No activity has been measured on this protein; the only in-species evidence is the mutant's
    membrane composition. Recorded as a knowledge gap.

    No deep research file: perplexity and falcon unavailable, asta off-target (prompt-boilerplate
    retrieval, near-identical lists across four unrelated genes), openscientist did not finish. Research
    is in lptA-notes.md with provenance.
- type: EDIT
  outcome: changed
  sections:
