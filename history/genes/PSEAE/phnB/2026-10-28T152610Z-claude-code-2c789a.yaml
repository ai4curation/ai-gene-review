  summary: 'Review phnB (PA1002): phenazine seed is an indirect PQS-signalling phenotype;
    TrpGD fusion artefact at the same node'
  details: |
    Reviewed all 6 GOA rows. Both GO:0002047 rows (IBA from PTN000230115, PseudoCAP IMP from PMID:2153661) were MARK_AS_OVER_ANNOTATED: PhnAB is an anthranilate synthase, anthranilate is the precursor of the quinolone signal PQS, and PQS induces the phz operons, while the phenazine core is made from chorismate by PhzE via ADIC (PMID:23449919, PMID:21454481). The GO:0004048 IBA was REMOVEd: its sole seed is the 531-aa bifunctional E. coli TrpGD (P00904) and phnB is a 200-aa standalone GATase subunit with no TrpD region. Both GO:0004049 rows were ACCEPTed as the core function (with a contributes_to qualifier suggestion, since the reaction is the PhnA-PhnB heterotetramer's), and the GO:0000162 IBA was KEEP_AS_NON_CORE. Source defects filed against PSEUDOCAP (WRONG_TERM and WRONG_QUALIFIER) and GO_CENTRAL (two defects at PTN000230115, which carries 267 GOA rows per term, 260 of them TreeGrafter). Proposed a PQS biosynthetic process term. Added notes with a PseudoCAP IBA-seed assessment table (verdict INDIRECT-PHENOTYPE) and a bioinformatics folder.
