  summary: Record why the two DiaA IBA rows stay UNDECIDED
  details: |
    Re-examined the two DiaA-node rows (GO:0032298, GO:1990102) against the new PTHR30390 family review and deliberately retained UNDECIDED on both, extending each reason to say why. The family review records node PTN000764072 as UNRESOLVED for the GmhA isomerases that UniProt places in subfamily SF6, and notes that the PSEPK ortholog Q88N89 does not receive this IBA at all, so the propagation is uneven across equivalent members. Q9HVZ0 carries the DiaA-labelled SF6 placement and was structurally compared with DiaA in PMID:17699754, so an enzymatic GmhA identity does not by itself refute the annotation; only a DnaA-binding assay on a GmhA isomerase would settle it. The family-level analysis therefore corroborates the uncertainty rather than resolving it. Consequence recorded: this gene stays at 8/10 reviewed, so the module reports 15/16 rather than 16/16 complete, which is the honest outcome rather than a forced verdict. just validate clean.
