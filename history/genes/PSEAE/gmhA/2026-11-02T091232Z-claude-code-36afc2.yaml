  details: |
    Review follow-up on PR #5909, finding 5. The reviewer endorsed retaining UNDECIDED on the two DiaA-node rows, so no verdict changed; what was missing was the journal entry. Appended a dated notes section recording that this is a decision rather than an omission, that the new PTHR30390 family review assesses node PTN000764072 as UNRESOLVED for the GmhA isomerases UniProt places in subfamily SF6, that the SF6 label is not a function claim since PANTHER's own inventory puts E. coli GmhA at SF7 and E. coli DiaA at SF6, and that the propagation is uneven because the PSEPK ortholog Q88N89 does not receive the IBA at all. Also recorded the consequence deliberately: this gene stays at 8 of 10 rows reviewed, so the module reports 15/16 genes complete rather than 16/16, and forcing a verdict to move that counter would assert something the evidence does not support.
