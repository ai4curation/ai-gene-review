  summary: 'PR review round 1: defect type, locus position, and an omitted positive result'
  details: |
    Three corrections, none changing the UNDECIDED.

    The defect was filed as WRONG_REFERENCE; it is WRONG_GENE_PRODUCT. The reference is the right
    paper - what is in question is which gene the row sits on - and the explanation now says so.

    The description said PA5007 lies "immediately downstream of waaP". PA5008 is between them, as
    this review's own locus table shows. Corrected to "two loci from waaP (PA5009)".

    The reason summarised the wapP branch as having "no phenotype for an IMP to rest on", which was
    too flat. The abstract does carry one positive result bearing on it: co-expressing waaP and wapP
    together in the Salmonella waaP mutant gave far larger MIC increases than waaP alone, the only
    abstract evidence that a non-waaP cluster gene contributes a phosphate. It does not change the
    action - heterologous co-expression cannot ground an IMP, and because both genes went in
    together it does not separate wapP's contribution from a dosage effect on waaP's - but the
    distinction between having no evidence and having evidence of the wrong kind for the evidence
    code is worth keeping.
