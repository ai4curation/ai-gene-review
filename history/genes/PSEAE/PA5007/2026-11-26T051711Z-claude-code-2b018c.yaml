  summary: 'Review PA5007: UNDECIDED because no database names the locus the cited
    paper''s gene names refer to'
  details: |
    PA5007, Q9HUF8, one GOA row: GO:0016301 kinase activity, IMP, PMID:10692150. Left UNDECIDED, and the
    reason is an identity question I could not resolve.

    What the record offers is almost nothing: the protein name "Lipopolysaccharide kinase" is ProtNLM
    (ECO:0008006), excluded as evidence by the project rules; there is no gene name, only
    OrderedLocusNames=PA5007 from an unreviewed submitter import; PE 4 Predicted; no function, catalytic
    activity, cofactor, location or cited publication. The one solid item is the curated family
    assignment - PIRSF026326 InaA, IPR027023 Put_LipoPS_kinase_InaA, PF06293 Kdo - whose own name says
    putative.

    It is not a waaP-family heptose kinase, which was worth checking because waaP (PA5009, Q9HUF7) was
    reviewed in batch 5 and its proposed term "lipopolysaccharide core heptose kinase activity" would
    have been the obvious import for an adjacent locus with an adjacent accession. The signatures
    separate them: waaP carries PIRSF037318 RfaP, IPR017172 and the rfaP NCBIfam model, and PA5007
    carries none of those. They share only the PF06293 Kdo fold. Importing the term would have asserted
    a specific sugar position on the strength of a fold.

    The blocking problem: PMID:10692150 characterises three genes by name - a waaP homologue, plus wapP
    and wapQ - and its abstract gives no locus tags. The cache is abstract-only. And the databases
    decline to bridge it: KEGG and RefSeq give PA5006, PA5007 and PA5008 no symbol and the product
    "hypothetical protein", while PA5009 is waaP in both with KO K02848 and EC 2.7.1.235. So the wapP
    and wapQ names are attached to no locus in either database, and whoever made this annotation made
    that mapping themselves. pseudomonas.com, which secondary sources say lists PA5007 as wapG - a sugar
    transferase, not a kinase - returned HTTP 403 and could not be read.

    Every candidate identity undercuts the row, which is why this is not simple deference to a curator:
    wapQ means the kinase role was never demonstrated and the one mutant obtained had an unaltered
    novobiocin MIC with only a small SDS decrease, which the authors call a small effect; wapP means no
    mutant could be generated at all, so there is no phenotype for an IMP; wapG means the kinase term is
    wrong. But the three differ in what the correction should be, and I cannot tell them apart.

    So UNDECIDED per the enum, not REMOVE (the rules forbid overruling an experimental annotation from
    incomplete evidence, and the curator read a full text I cannot see) and not ACCEPT. Filed a
    WRONG_REFERENCE / CHECK query at SUSPECTED against PSEUDOCAP asking which of wapP, wapQ or wapG this
    locus is - one line that would let the review be finished. Outcome recorded as needs_followup.

    No deep research file: perplexity and falcon unavailable, asta off-target, openscientist did not
    finish. Research is in PA5007-notes.md with provenance.
