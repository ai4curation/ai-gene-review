  summary: 'Review pcs (PA3857): phosphatidylcholine synthase, all rows accepted'
  details: |
    Created the review for PA3857, the least contentious gene of the batch. All five GO:0050520 rows
    and all three GO:0008654 rows are accepted: the entry is reviewed at PE 1 with EC 2.7.8.24 carrying
    ECO:0000269 from two assay papers, and PMID:22363496 supplies in-frame deletions in PAO1 and PA14
    that completely lack PC, complemented in trans.

    GO:0016020 membrane and GO:0016780 phosphotransferase activity for other substituted phosphate
    groups are TOO_GENERAL, both mapped from IPR000462: the class-I CDP-alcohol phosphatidyltransferases
    differ precisely in their acceptor, and in a Gram-negative organism which membrane is the whole
    question. GO:0005886 is accepted on both the subcellular-location mapping and the ISS from
    Sinorhizobium meliloti Pcs, and is independently visible in the protein's eight transmembrane
    segments.

    Two knowledge gaps recorded, both from PMID:22363496: no phenotype was found for a PC-deficient
    mutant across antibiotic sensitivity, motility, biofilm formation, colonisation, a mouse infection
    model and a phenotypic microarray; and the route by which the inner-membrane enzyme's product
    reaches the outer membrane is unidentified. PC synthesis also requires exogenous choline, which
    the organism does not make.

    One observation not filed as a defect: PseudoCAP codes GO:0050520 from PMID:12169604 as IMP while
    UniProt codes the same term from the same paper as IDA. The abstract favours UniProt's reading but
    the full text is not cached, so it is recorded in the row's reason rather than reported.
