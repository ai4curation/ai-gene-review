  summary: 'Round 1 of review on PR #6876: refine the process term to GO:0006656'
  details: |
    The reviewer caught a factual error in the reason given for accepting GO:0008654: the review
    said no phosphatidylcholine-biosynthesis term exists that would fit better. GO:0006656
    phosphatidylcholine biosynthetic process does exist, is live, descends from GO:0008654 via
    GO:0046474, carries no taxon constraint (confirmed in OLS), and is already used in this repo on
    yeast CPT1, a member of the same class-I CDP-alcohol phosphatidyltransferase family making the
    same transfer onto choline.

    All three GO:0008654 rows are now MODIFY to GO:0006656 and core_functions.directly_involved_in
    moves with them. The two IDA rows reach the specific term on their own evidence; the InterPro2GO
    row does not, since a family-level signature cannot name the acceptor alcohol, and its reason
    says so while taking the same action, because a term is judged as a claim about the gene rather
    than row by row.

    Also added a sentence to the GO:0005886 row explaining why GO:0005887 integral component of
    plasma membrane is not added as a NEW row: the eight transmembrane segments are one line of
    ECO:0000255 sequence analysis and the curated multi-pass statement is an ISS restatement of the
    same inference, so there are not two independent lines.
