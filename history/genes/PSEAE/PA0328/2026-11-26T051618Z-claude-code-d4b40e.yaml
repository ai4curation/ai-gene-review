  summary: 'PR review round 1: the GO:0008235 MODIFY rested on a family claim its own paper contradicts'
  details: |
    The IEA GO:0008235 row was MODIFYed to GO:0070006 on the ground that "M28 is an aminopeptidase
    family rather than a general exopeptidase one", quoting the paper's phrase "the M28 family of
    aminopeptidases". The same cached full text says, in its introduction, "The M28 family
    encompasses both amino and carboxy specific peptidases which tetrahedrally coordinate two zinc
    ligands". The phrase I quoted appears where the paper introduces AaaA's own holotypes, which are
    aminopeptidases, so I read a statement about this protein's close relatives as a statement about
    the family. MEROPS M28 contains carboxypeptidases - glutamate carboxypeptidase II - which is
    presumably why InterPro2GO maps IPR045175 to the exopeptidase term rather than the
    aminopeptidase one.

    So that row's own evidence stops at metalloexopeptidase and the MODIFY bar is not met. Changed
    to TOO_GENERAL, replacement dropped, and nothing is lost: GO:0070006 is still asserted by the
    GO:0004177 IMP row, where the site-directed mutagenesis genuinely supports it. That row is
    unchanged apart from a sentence explaining why its sibling is not taking the same replacement.
    Its supported_by quote also cited IPR007484 while the row's supporting entity is IPR045175;
    re-quoted to match.

    This is the third instance in this session of one error shape - a sentence true at one scope
    written as though true at a wider one.

    Two strengthenings from the same review round. The motility REMOVE now cites the paper's
    complete supplementary inventory (S1 deletion construction and LB growth, S2 Met/Leu
    p-nitroanilide specificity, S3 LB growth after MiniCTX), which makes "no unread part of the
    paper could hold the result" a direct observation rather than an inference from absent
    vocabulary. And the proposed arginine aminopeptidase term records an extended negative check: the
    first search was on the label string, which would miss a term named for an enzyme rather than a
    residue, so "aminopeptidase B" (the trivial name of EC 3.4.11.6) was searched too and returns
    nothing, with the eight classes under GO:0004177 enumerated as the complete set. Figure S2's
    negative result - no methionine or leucine released - is cited as the measured basis for the
    specificity.
