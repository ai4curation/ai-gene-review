  summary: 'Review PA0328 (AaaA): a surface arginine aminopeptidase, and a motility
    row with no basis in its paper'
  details: |
    PA0328 is AaaA, named in PMID:22927813, whose full text is cached - which is what lets this review
    assert a wrong-gene defect at CONFIRMED rather than as a query.

    GO:0048870 cell motility is annotated IDA from that paper, and the paper contains no motility
    experiment at all. Counting every motility-family word in the full text: motilit, swarm, swimming
    and twitch twice each (the cached body duplicates, so one sentence), and motile, flagell, chemotax,
    pili and pilus zero times. The single sentence is in the introduction, concerns the unrelated
    autotransporter EstA, and cites references [35],[36] for the claim. The absence of any flagellar,
    pilus or chemotaxis vocabulary is what makes this safe on a full-text reading: a motility phenotype
    cannot be reported without naming the appendage or the assay. REMOVE with WRONG_GENE_PRODUCT /
    DELETE_ROW / CONFIRMED, and deliberately a deletion rather than a repoint to EstA, because this
    paper cites rather than reports the EstA result. Biofilm has the same shape - Discussion speculation
    with no assay - and produced no row, which argues for one mis-keyed annotation rather than the
    background section being read as data.

    GO:0004177 aminopeptidase activity (IMP) and GO:0008235 metalloexopeptidase activity (IEA) both
    MODIFY to GO:0070006 metalloaminopeptidase activity, which OLS confirms is a child of both. The
    mutagenesis behind the IMP probes the M28 co-catalytic metal centre, so each row's own evidence
    supports the conjunction, and the replacement unifies two rows rather than adding a third claim.

    GO has no arginine-specific aminopeptidase term. Checked with a positive control so the negative is
    readable: "aminopeptidase activity" returns 8 classes including the residue-specific GO:0016285,
    GO:0004230 and GO:0004239, while "arginine aminopeptidase activity" returns nothing. Filed as a
    proposed_new_terms entry rather than forced into an id.

    GO:0055085 transmembrane transport was checked against the participation test rather than accepted
    because it is an automatic inference: GO:0015474's definition puts transporter and cargo in the same
    polypeptide, so the protein performs the translocation and is not merely required for one. Kept
    non-core.

    No deep research file: perplexity is unavailable in this environment, asta retrieved 20 papers none
    of which concern the gene (it matched the prompt template's boilerplate - the same list came back
    for three other genes), openscientist did not finish, falcon is unavailable. Research is in
    PA0328-notes.md with provenance, per the project rule for when deep research fails.
