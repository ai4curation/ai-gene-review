  summary: Full review of fimT (PA4549, Q9HVN0); PseudoCAP GO:0016888 row assessed
    as a copied pilU id slip
  details: |
    Reviewed all 5 GOA rows. REMOVE GO:0016888 DNA endonuclease (PseudoCAP IDA, PMID:18174131): live QuickGO shows the same wrong id on the pilU row from the same paper and date (pilB/pilT got GO:0016887); FimT is a GspH-family minor pilin, not an NTPase, so the row is not repointed but flagged for deletion. Source defects: WRONG_TERM (CONFIRMED, CHECK) and WRONG_GENE_PRODUCT (PROBABLE, DELETE_ROW; abstract-only paper). REMOVE two InterPro2GO T2SS rows (GspH family shared with XcpU). ACCEPT plasma membrane (IEA) and type IV pilus assembly (IDA, PMID:8682785). NEW double-stranded DNA binding (IDA, PMID:35246533, EMSA of purified P. aeruginosa FimT). fimT seeds no PseudoCAP IBD and receives no IBA.
