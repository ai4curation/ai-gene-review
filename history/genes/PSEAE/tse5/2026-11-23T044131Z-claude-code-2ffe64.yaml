  summary: Review tse5
  details: |
    Added to batch 5 because it carries GO:0097351, the term on which the merged tse6/tsi6 pair
    holds a recorded wrong-gene divergence. It is a third instance of the same inversion, from a
    different paper and a different effector family.

    GO:0097351 toxin sequestering activity is REMOVEd with WRONG_GENE_PRODUCT / REPOINT at
    CONFIRMED to P0DTB6 (TSI5_PSEAE, Immune protein Tsi5, tsi5 / PA2683.1). The term describes
    binding a toxin to prevent it acting, which is the immunity protein's function; Tse5 is the
    toxin. Three independent statements fix the direction without going beyond the record and the
    abstract: the curated UniProt FUNCTION, carrying ECO:0000269 to both cited papers, calls Tse5 a
    toxin secreted by the H1-T6SS whose producing bacterium is protected by a cognate immunity
    protein; the curated DISRUPTION PHENOTYPE names that partner as Tsi5, so the gene that should
    hold the term is identified on Tse5's own record; and PMID:24794869 states that the RhsP1
    C-terminus is toxic and the producer is protected by a cognate immunity. The Tsi5 accession was
    resolved through the UniProt API, not guessed, since tsi5 has no folder in this corpus.

    Three instances now - tse6 (confirmed, merged), tsi6 (the correct half), tse5 - points to a
    pair-level toxin/immunity experiment entered against both halves of each bicistron rather than
    three unrelated slips. A reference-level sweep of GO:0097351 across the T6SS effector genes is
    recommended in the defect explanation.

    AN ERROR OF MINE, CAUGHT AND RECORDED. My first pass concluded that the structural basis which
    justifies tse6's GO:0033103 ACCEPT did not transfer to tse5, because tse5's InterPro list
    carries no PAAR signature where tse6's has IPR008727, and because PMID:24794869 frames VgrG1c
    as delivering RhsP1, which is cargo language. On that reading I was going to accept the rows on
    a visibly weaker footing. PMID:24589350 - full text, already in the cache, and cited on the IDA
    row - refutes it directly: it groups "Tse5 and Tse6" as effectors that "differ from
    Hcp-stabilized substrates by the presence of toxin-associated PAAR-repeat motifs", calls them
    "the PAAR domain-containing effectors" with a strict functional requirement for their cognate
    VgrG, and explains that the PAAR module tethers effectors to VgrGs as well as occupying the
    spike tip. It also notes that PAAR repeats occur in RHS/YD-repeat toxins, which is exactly
    tse5's architecture. So the rows are accepted on the same structural basis as tse6's.

    The lesson is the one CLAUDE.md states about negative results: I treated "no PAAR in the
    InterPro list" as evidence of absence when it was absent-signature rather than absent-domain,
    and the check that caught it was reading a paper already in the cache with
    full_text_available: true, which I had skipped on the assumption the record said enough. A
    negative drawn from a database listing needs the same scrutiny as one drawn from a query. The
    signature gap is recorded in the notes as an observation rather than filed as a source defect,
    since it is a coverage limitation and not a wrong assertion, and the row's reason states that
    the PAAR assignment here rests on the literature rather than the record.

    I also got PMID:24589350's title wrong from memory on the first write; the reference validator
    rejected it, and reading the paper to fix the title is what surfaced the PAAR correction above.

    No molecular function is asserted. The toxin domain's activity and target are unidentified, so
    despite this being a reviewed Swiss-Prot entry the review leaves core_functions without a
    molecular_function and records the gap.

    tsi5 has no folder in this corpus, so the repoint cannot be checked from the other side the way
    femI checked femA. Recorded as a curation gap.

    Batch 5 context: one of six genes in the fifth PseudoCAP tier-3 batch, branched from current
    main rather than stacked on the unmerged batch-4 branch. The batch centres on the femA/femI
    transposition found in batch 4, with vreR and fpvA included to test whether the same
    architecture carries the same error elsewhere; vreR returned a clean negative.
