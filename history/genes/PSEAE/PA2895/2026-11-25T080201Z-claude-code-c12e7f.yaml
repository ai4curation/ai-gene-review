  summary: 'Review PA2895 (sbrR): anti-sigma factor, both loci named by the paper'
  details: |
    Both rows accepted. The paper names sbrR (PA2895) and its cognate sigma SbrI (PA2896) explicitly,
    so attribution needs no inference - the failure mode this project sees most often. An N-terminal
    region interacts with SbrI directly and is sufficient to inhibit SbrI-dependent expression, which
    is stronger than the mutant phenotype the IMP code implies.

    GO:2000143's choice of the initiation level over a generic repression term is justified from this
    row's own reference, which reports that SbrI associates with RNA polymerase in vivo.

    The record contributes nothing usable: PE 4, no CC lines, and its only name carries
    ECO:0008006|Google:ProtNLM, a machine-generated name this project does not accept as support. One
    record feature is read against the paper rather than as support for it: Phobius places a single
    transmembrane helix at 65-87, the canonical membrane-anchored ECF anti-sigma architecture, which
    fits the paper's finding that an N-terminal region suffices. No location row is proposed, because
    the helix is a single prediction and the architectural argument restates the same inference.
