  summary: 'Create review: PSEAE pvdH (Q9I168)'
  details: |
    Created the review for P. aeruginosa PAO1 pvdH (Q9I168, PA2413), the exemplar whose enzymology and
    mutant phenotype ground the L-2,4-diaminobutyrate step of
    modules/pseudomonas_pyoverdine_precursor_supply.yaml. All 6 GOA rows reviewed: the three
    GO:0008483 transaminase rows (IBA, IDA, IEA) consistently modified to the specific GO:0045303
    L-2,4-diaminobutyrate:2-oxoglutarate transaminase activity that the purified PAO1 enzyme was shown
    to catalyse, which was also added as a NEW row since GOA carries only the parent here; GO:0002049
    accepted on both the IDA and the IMP row; GO:0030170 PLP binding kept as non-core, matching the
    KT2440 ortholog's review. The IBA's WITH/FROM contains Q9I168 itself; per the repo's IBA policy
    this is expected experimental grounding on the target and is explicitly not treated as circular --
    propagation_review records SUPPORTS_TRANSFER with a term-scoping root cause. Core function:
    GO:0045303 in pyoverdine biosynthetic process. Notes file records the PTHR43552 family grounding
    and the unavailability of provider deep research in this environment; nothing was fabricated.
    just validate PSEAE pvdH is clean.
