  summary: 'Create review: tse6, H1-T6SS NAD(P)+ glycohydrolase effector'
  details: |
    Reviewed as the tse6/tsi6 shared-claim group from the tier-3 PseudoCAP worklist, where GO:0097351 toxin sequestering activity is annotated by IMP from PMID:24589350 to both halves of an effector-immunity bicistron. Both cited papers are cached with full text. The term is defined as binding a toxin to prevent it acting, which is what an immunity protein does, so annotating it to both the toxin and its antidote inverts the relationship for one of them. The full text states the direction outright: the Toxin_61 domain of Tse6 is a potent cytoplasmic toxin whose activity is specifically neutralized by Tsi6, with the specificity control that co-expression of Tsi6, but not of the non-cognate immunity protein Tsi2, gave full rescue. This is the shared-claim pattern the tier-3 worklist was built to surface: one pair-level experiment entered on both genes. Specific to tse6: GO:0097351 is REMOVEd, with a WRONG_GENE_PRODUCT PseudoCAP defect at CONFIRMED asking for deletion of the row on Q9I739 and retention on Q9I740, since Tse6 is the toxin rather than the protein that sequesters one. Nothing is lost because the effector own activity is carried by GO:0050135 NADP+ nucleosidase (IDA, the assayed activity and the mechanism of toxicity) and GO:0003953 NAD+ nucleosidase, which are separate substrates rather than a general/specific pair and are both ACCEPTed. Both GO:0033103 rows are ACCEPTed: delivery strictly required a cognate VgrG, which is participation in the secretion process rather than mere requirement for its outcome. GO:0016020 membrane is KEEP_AS_NON_CORE, plausible for a PAAR-motif effector carried on a VgrG spike but with no compartment established and the toxin acting in the recipient cytoplasm. A first draft attributed the quote about Tse5 and Tse6 delivery requiring a cognate VgrG to PMID:24794869 when it is in PMID:24589350; the reference validator caught it and the row citing PMID:24794869 now quotes that paper own statement about VgrG1a-dependent toxicity and PA0093.
