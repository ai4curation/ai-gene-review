  summary: Anchor the catalytic rows to the right paper; rebase the secretion argument
    on the PAAR domain
  details: |
    PR #6341 review items 2 and 3. (1) GO:0050135 and GO:0003953, and the core function, were all anchored to a PMID:24589350 quote about Tsi6 neutralising the toxin, which says nothing about catalysis; PMID:26456113 was cached with full text in this same PR and states the activity outright. All three now cite it. (2) The GO:0033103 rows were ACCEPTed on the ground that delivery required a cognate VgrG, but being carried by a secretion system is being its cargo, and a substrate is not a participant -- the same rule used on tsi6 to downgrade the identical term, so the two calls read as one argument applied two ways. The verdict is unchanged but the basis is now structural: Tse6 is an evolved PAAR protein whose PAAR repeats fold into a pyramidal structure interacting with the VgrG spike tip, so it supplies a component the apparatus depends on, which is the scaffold case and is what actually distinguishes it from the immunity protein.
