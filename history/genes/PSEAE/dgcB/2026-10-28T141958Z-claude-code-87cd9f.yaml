  summary: Full review of dgcB (PA5399, dimethylglycine catabolism Fe-S subunit);
    PseudoCAP IBA-seed assessment of PTN000229983 (INDIRECT-PHENOTYPE)
  details: |
    New review of all 6 GOA rows. GO:0031457 glycine betaine catabolic process (IMP) ACCEPT and core; GO:0042426 choline catabolic process KEEP_AS_NON_CORE (gene acts three steps downstream, on DMG); GO:0051536 iron-sulfur cluster binding IEA MODIFY to GO:0051539 (two PROSITE PS51379 4Fe-4S ferredoxin domains); GO:0016491 oxidoreductase activity IBA ACCEPT as the most specific MF currently defensible. The two PseudoCAP MF rows, GO:0047865 dimethylglycine dehydrogenase activity and GO:0047866 dimethylglycine oxidase activity (both IDA, PMID:17951379), are MARK_AS_OVER_ANNOTATED: they are the sole seeds of the PTN000229983 IBD (33 leaf IBAs, 17 taxa), verdict INDIRECT-PHENOTYPE, because the cited paper is genetic and metabolomic (transposon-mutant growth on DMG plus 13C NMR accumulation) and its full text, read via PMC2293255, states that characterising the biochemical activities of DgcA and DgcB remains future work; the two terms also specify mutually exclusive chemistries (ETF-dependent vs O2-dependent), and the methyl-removing activity is more plausibly DgcA's FMN oxidoreductase, with DgcB (5 TM helices, two 4Fe-4S clusters, two CCG domains, PTHR43255 family of HdrC/FadF/EtfAB:quinone oxidoreductase electron-transfer subunits) the likely electron-transfer partner. Defects: PSEUDOCAP WRONG_EVIDENCE_CODE (IDA to IMP) and WRONG_TERM CHECK (mutually exclusive terms, possibly wrong subunit); GO_CENTRAL OTHER CHECK on PTN000229983 (sole seed unverified, node term itself defensible on domain grounds). One BIOLOGY knowledge gap on the uncharacterised reaction. Wrote dgcB-notes.md with the seed assessment table.
