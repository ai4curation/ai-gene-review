  summary: PseudoCAP IBA-seed review of pscC (T3SS secretin SctC)
  details: |
    Reviewed all 7 GOA rows. The PseudoCAP GO:0030254 IMP (PMID:8971719) sole-seeds the PTN009110345 IBD (25 leaf IBAs, 15 taxa); verdict SOUND - the node is the T3SS-specific subnode of PTHR30332 (T2SS terms sit on PTN000768388, and an IRD at PTN009110348 prunes a divergent subclade) and the claim is independently confirmed by pscC mutant studies (PMID:12421316, PMID:14977975, PMID:12385743) and by the purified PscC channel (PMID:25156426). The cached abstract does not pin the transposon insertions to pscC, so the gene-level attribution rests on the curator's full-text reading; no source defect recorded, unlike the xcpQ/xcpR review-cited IDA rows. The generic GO:0009306 InterPro2GO row modified to GO:0030254.
