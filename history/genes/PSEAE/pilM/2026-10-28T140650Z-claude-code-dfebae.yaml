  summary: Full review of P. aeruginosa pilM (PA5044); PseudoCAP IBA-seed assessment
    of type IV pilus and type IV pilus-dependent motility IBDs at PTN001286216
  details: |
    Reviewed all 10 GOA rows. The PseudoCAP located_in type IV pilus IMP (PMID:7565110), sole seed of the PTN001286216 GO:0044096 IBD, records a no-fimbriae mutant phenotype as a location; PilM is a cytoplasmic, PilN-docked component of the assembly machine, not the surface fibre. Seed WRONG; PseudoCAP row and IBA removed with PSEUDOCAP and GO_CENTRAL defects. The motility seed (IMP PMID:7565110, PMID:19857645) is SOUND for PilM, but PTN001286216 also covers E. coli and Salmonella EutJ and other non-pilus FtsA-like proteins, so a GO_CENTRAL node-scoping defect was recorded while the IBA is accepted for PilM. Cell division IEA (SHS2 FtsA domain) removed. Accepted cytoplasm, motility and assembly rows. NEW: ATP binding (IDA PMID:27022027) and cytoplasmic side of plasma membrane (IC). Core function: ATP-binding actin-like alignment-subcomplex protein coupling the motor to PilMNOPQ.
