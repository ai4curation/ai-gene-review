  summary: Full review of P. aeruginosa fimU (PA4550) minor pilin; PseudoCAP IBA-seed
    assessment of the PTN008624060 type IV pilus IBD
  details: |
    Reviewed all 8 GOA rows. The sole seed of the PTN008624060 GO:0044096 IBD, PseudoCAP IDA PMID:20338182 (antibody detection of FimU in sheared pili), is SOUND and confirmed by PMID:25389296; the 7 leaves are FimU/FimT-type minor pilins. Accepted type IV pilus (IBA, IDA), motility and type IV pilus assembly IMPs, plasma membrane IEA. Pilus assembly IDA modified to type IV pilus assembly. Removed the two InterPro2GO T2SS rows from IPR022346 GspH: FimU shares the GspH fold but is the T4P paralogue; the Xcp GspH is XcpU (PA3100). Added PMID:25389296 to the references.
