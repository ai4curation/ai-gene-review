  details: |
    Pass projects/IBA_REVIEW/overannotated-2026-11-24 (batch N22). The IBA GO:0042351 (IBD at PTN008684430) was MARK_AS_OVER_ANNOTATED with a reason that already said the term is wrong for this gene. GO defines the process as requiring GDP-L-fucose synthase (EC 1.1.1.271); a UniProt query of the PAO1 proteome for that EC number or InterPro IPR028614 returns nothing while the same query returns Fcl for E. coli K-12, and PAO1 converts the intermediate to GDP-D-rhamnose with Rmd. On the tree the five seeds are eukaryotic and sit in the child clades PTN009171938 and PTN009171928; Gmd is in the unseeded 3-leaf child PTN008684448. Action changed to REMOVE on lineage grounds, reason extended, propagation root cause set to PROPAGATION_BAD. The GO_CENTRAL source defect and every other row are unchanged. Validated with just validate PSEAE gmd.
