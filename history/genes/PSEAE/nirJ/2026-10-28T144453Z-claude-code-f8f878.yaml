  summary: New review of nirJ (G3XD10), radical SAM enzyme of heme d1 biosynthesis,
    with PseudoCAP IBA-seed assessment
  details: |
    Initial review following projects/PSEUDOCAP/REVIEW_PROTOCOL.md. PseudoCAP IMP GO:0006783 heme biosynthetic process (PMID:8982003) sole-seeds the IBD at PTN000132400: OVER-SPECIFIC. Heme d1 falls under GO's broad heme term (siroheme biosynthesis is_a GO:0006783) and ortholog biochemistry (PMID:29076625, 40318205) shows NirJ performs a step, so the seed is sound for NirJ; but the node is an archaeal SPASM radical SAM clade in which only Q8TLK1 (AhbC) is a heme-pathway enzyme; GO_CENTRAL defect recorded. Catalytic activity MODIFY to an NTR; Fe-S/metal binding MODIFY to GO:0051539; proposed NTRs for the NirJ activity and heme d1 biosynthetic process. Added PMID:20420837, 29076625, 40318205.
