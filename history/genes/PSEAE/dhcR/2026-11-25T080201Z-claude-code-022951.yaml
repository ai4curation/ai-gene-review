  summary: 'Review dhcR: a regulator annotated as performing transcription'
  details: |
    GO:0006351 DNA-templated transcription is MODIFY to GO:0006355. That term is the synthesis of RNA
    from a DNA template, which RNA polymerase performs; a transcription factor governs whether it
    happens. Two checks rather than assumptions: OLS confirms GO:0006355 is not a descendant of
    GO:0006351, so this is a distinct wrong claim and not a general version of a right one, which is
    why TOO_GENERAL does not apply; and the corpus has a dominant handling, 62 MODIFY of 168 rows, with
    regulation terms as the replacements. The replacement is the unsigned GO:0006355 rather than the
    positive term, because this row's evidence is a LysR-family UniRule that supports regulator but not
    direction - the direction comes from the paper, on other rows.

    GO:0009896 positive regulation of catabolic process is accepted as coarse but best available.
    GO:0042413 carnitine catabolic process exists, but a search found no regulation-of-carnitine-
    catabolism term; the only carnitine regulation terms are for transmembrane transport. A new term is
    deliberately not proposed, since GO does not mint a regulation term per pathway and this is ordinary
    coarseness rather than a missing concept.

    GO:0003677 TOO_GENERAL against the accepted sequence-specific binding. Strain caveat recorded: the
    screen was in PA14, the annotation on the PAO1 locus.
