  summary: 'Review dhcR: a regulator annotated as performing transcription'
  details: |
    GO:0006351 DNA-templated transcription is MODIFY to GO:0006355. That term is the synthesis of RNA
    from a DNA template, which RNA polymerase performs; a transcription factor governs whether it
    happens. Two checks rather than assumptions: OLS confirms GO:0006355 is not a descendant of
    GO:0006351, so this is a distinct wrong claim and not a general version of a right one, which is
    why TOO_GENERAL does not apply; and the corpus has a dominant handling, 62 MODIFY of 168 rows, with
    regulation terms as the replacements. The replacement is the unsigned GO:0006355 rather than the
    positive term, because this row's evidence is a LysR-family UniRule that supports regulator but not
    direction - the direction comes from the paper, on other rows.

    GO:0009896 positive regulation of catabolic process is accepted as coarse but best available.
    GO:0042413 carnitine catabolic process exists, but a search found no regulation-of-carnitine-
    catabolism term; the only carnitine regulation terms are for transmembrane transport. A new term is
    deliberately not proposed, since GO does not mint a regulation term per pathway and this is ordinary
    coarseness rather than a missing concept.

    GO:0003677 TOO_GENERAL against the accepted sequence-specific binding. Strain caveat recorded: the
    screen was in PA14, the annotation on the PAO1 locus.
- type: EDIT
  outcome: changed
  sections:
  - core_functions
  - existing_annotations
  summary: 'PR review round 1: core function asserted promoter binding its own knowledge gap denies'
  details: |
    The core function opened "binds a sequence in the PA1999-PA2000 promoter region and induces the
    operon", while a knowledge gap in the same block says no operator has been located and no direct
    binding to that promoter has been shown. The evidence in PMID:19406895 is transcript-level and
    genetic: induction of PA1999-PA2000 is PA1998-dependent. Sequence-specific DNA binding is a
    family-level IBA inference; binding at that promoter is not shown. Reworded to "acts through
    sequence-specific DNA binding to induce the operon", with the unmapped operator stated in the
    description itself so a reader who stops at core_functions is not left thinking it is known.

    This is the second instance in two days of the same defect: a core function stating as established
    the very thing its own knowledge_gaps entry records as open (pvdO, PR 6966). The two were written
    independently, which makes it a habit in how the synthesis gets drafted rather than a slip.

    Also recorded why no signed transcription row is proposed. GO:0045893 positive regulation of
    DNA-templated transcription would be squarely supported by the induction experiment, but it is a
    descendant of the GO:0006355 this gene already carries, and the standing rule on NEW rows rejects
    an ancestor or descendant of a carried term as redundancy rather than coverage. The sign is carried
    by the GO:0009896 row, on the same experiment.
