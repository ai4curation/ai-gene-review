- type: EDIT
  outcome: changed
  sections:
  - references
  summary: 'Correct the GO:0071474 reasoning: the mapping is over-broad, not a category
    error'
  details: |
    Revisiting the IPR023720 -> GO:0071474 mapping for the MAPPINGS project turned up evidence that
    disputes this review's own reasoning, so the reasoning is replaced while the action stands.

    What this review argued: the mapping confuses being regulated by a condition with participating in
    the response to it. GO:0071474 came from InterPro2GO on the periplasmic-trehalase entry, the E. coli
    observation behind it is osmotic induction (PMID:2820965), and I concluded that "nothing in the
    mapping identifies a step of osmotic adaptation that this protein carries out; if anything it
    destroys periplasmic trehalose rather than accumulating it".

    What refutes it: PMID:1825082 reports that E. coli treA nulls accumulate trehalose extracellularly
    specifically under osmotic stress, and reads the wild type as running a futile cycle by which the
    stressed cell sets its cytoplasmic trehalose level - overproduction, excretion, then periplasmic
    degradation to glucose that is reused. Degrading the excreted pool is therefore a limb of an
    osmotic-stress mechanism, and a loss-of-function phenotype confined to the stress condition is
    participation evidence rather than mere induction. The general principle I invoked is sound; it was
    the wrong principle for this case.

    The action does not change. GO:0071474 stays MARK_AS_OVER_ANNOTATED, now on two grounds that
    survive. The compartmental split is real and this enzyme is on the catabolic side of it -
    endogenously made trehalose is the protectant while externally supplied trehalose is carbon
    (PMID:8391102), and the trehalase acts on what has left the cell. And the osmotic content of the
    story lives in the circuitry around the enzyme (an osmotically regulated promoter, OtsAB-type
    synthesis, excretion), none of which a trehalase signature detects, while the entry propagates the
    term to 472 proteins.

    A point against my first version in the other direction, recorded because it weakens the removal
    case rather than strengthening it: PAO1 does accumulate trehalose under osmotic stress alongside
    glutamate and N-acetylglutaminylglutamine amide (PMID:8434912), so the substrate pool the cycle
    needs is present in this organism. The architecture is plausible here, merely unmeasured - no
    osmotic induction of PA2416 and no treA phenotype has been shown in P. aeruginosa.

    Encoding: the PMID:2820965 finding whose inference was wrong now carries a finding_review with
    finding_status DISPUTED and superseded_by PMID:1825082, which is the mechanism the project
    prescribes for a statement from one paper contradicted by another. DISPUTED rather than OVERTURNED
    because the measurement stands and the enzyme still performs no osmoprotective step itself; it is
    the inference drawn from the measurement that fails. Three references added with reference_review,
    all abstract-only in the cache and labelled as such. PMID:8434912 is deliberately not cited as
    support for the GO:0071474 row: an osmolyte inventory says nothing about whether this enzyme acts
    on the osmolyte or is induced with it.

    The corresponding mapping-level verdict is recorded in projects/INTERPRO/interpro2go.sssom.yaml as
    broadMatch rather than the removal the carried-forward note had anticipated. An outright removal
    has no rule cover - no other InterPro entry or UniRule supplies GO:0071474 to periplasmic
    trehalases - so it would strip the term from E. coli TreA, where it is earned.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  summary: 'PR review round 1: the file contradicted its own stated reasoning about PMID:8434912'
  details: |
    The commit stated in three places - this record, the PMID:8434912 reference_review, and the PR
    body - that the PAO1 osmolyte paper is deliberately NOT cited as support for the GO:0071474 row,
    because an osmolyte inventory does not show that this periplasmic enzyme acts on the osmolyte or
    is induced with it. It was then added to that row's supported_by anyway. The prose was right and
    the YAML was the slip, so the entry is removed; supported_by is the machine-readable claim that a
    quote supports the row's assertion, and this one does not.

    What makes it worth recording rather than just fixing: I wrote the principle and violated it two
    edits later in the same commit, and nothing caught it. Validation cannot - a verbatim quote from a
    real paper on a real row passes every check. Only reading the file against its own prose finds it,
    which is what the reviewer did. The citation now sits in review.reason with the PMID named inline
    and a clause saying why it is not in supported_by, so the next reader meets the reasoning at the
    point where the temptation recurs.

    Also carried from the same review: the GO:0071474 row now quotes PMID:8391102's most on-point
    sentence, "For trehalose catabolism under osmotic stress E. coli depends on the osmotically
    inducible periplasmic trehalase (TreA)." This states the earned-in-E.-coli half in one clause.
    Finding it took two attempts because the cached abstract wraps after "For trehalose", so a
    single-line search for the sentence returns nothing - the same line-wrap blind spot that produced
    the lptA complementation error in the previous batch, this time in the verification rather than in
    the quoting. The companion quote on the compartmental split is added to the row as well.
- type: EDIT
  outcome: changed
  sections:
  - references
  summary: 'PR review round 2: the PMID:8391102 reference_review understated what the file does with it'
  details: |
    The note said the review article is used "not as primary evidence for any annotation on this
    gene". By then it was cited twice in the GO:0071474 row's supported_by, so the note described an
    earlier state of the file. Worse, the two uses it enumerated - compartmental framing and
    route-selection logic - did not include the quote that actually matters: the sentence naming TreA
    as what E. coli depends on for trehalose catabolism under osmotic stress, which is what
    establishes that the term is earned by the characterised enzyme and therefore what makes the
    mapping broadMatch rather than a removal.

    Same class as the round-1 blocking finding - prose not matching what the file does - and in the
    same file, which is why it is fixed rather than deferred as optional. Both times the drift came
    from editing the row and not revisiting the reference_review that describes it; they sit about
    three hundred lines apart.

    Rewritten to name all three uses, to say which one is load-bearing and why it belongs in
    supported_by, and to state the weakness honestly: a review article's abstract is thinner support
    than primary work. The mitigation is checkable rather than asserted - Strom is an author of both
    this review and PMID:1825082, so the sentence summarises the authors' own primary result rather
    than a third party's, which is verifiable from the two cached author lists.
- type: EDIT
  outcome: changed
  sections:
  - references
  summary: 'PR review round 3: the same false clause was on the sibling reference, and I fixed only one'
  details: |
    PMID:1825082's review_notes said it was cited "not because it supports an annotation on this
    gene". It is in the GO:0071474 row's supported_by twice and has been since the first commit. The
    wording was nearly identical to the clause repaired on PMID:8391102 one entry below in round 2,
    so the two notes were siblings carrying the same defect and the round-2 fix landed on one of them.

    Third instance of one finding across three rounds. The cause of the first two was distance - the
    row and the prose describing it sit three hundred lines apart. The cause of this one is different
    and worse: having been shown the defect, I fixed the instance I was pointed at instead of
    searching the file for others of the same shape. A grep for the disclaimer wording would have
    found both in one pass.

    It also mattered more here than on the sibling. PMID:1825082 is the paper that reverses the
    expected removal, so the clause disclaimed exactly the role the rest of the review gives it. And
    the sentence was a false dichotomy on its own terms: disputing the row's earlier reasoning is how
    the paper becomes support for its new reasoning, not an alternative to it.

    Rewritten to say what the paper supports - the E. coli half, that a loss-of-function phenotype
    confined to the stress condition is participation evidence rather than induction, so the term is
    earned by the characterised enzyme - and why the row is still MARK_AS_OVER_ANNOTATED, nothing
    equivalent being measured in P. aeruginosa.

    Also from round 3, both carried because they are in files this PR already changes:

    relevance: MEDIUM read oddly beside a note calling a quote load-bearing, on both references.
    Resolved by naming the two axes rather than changing the value: ReferenceRelevanceEnum measures
    relevance to this gene's function, where MEDIUM is right because neither paper reports any
    P. aeruginosa work and the evidence reaches this entry through the E. coli ortholog; how
    load-bearing a quote is for this review's reasoning is a separate question, and on that axis the
    futile-cycle result and the TreA-dependence sentence are central. Stating the distinction is
    better than promoting the value, which would overclaim relevance to the gene.

    treA-notes.md did not contain the quote the review calls load-bearing. Added as the first of the
    three over-annotation points, since a reader of the notes should meet the earned-in-E.-coli
    sentence before the argument that the mapping is nevertheless too broad. All seven PMID quotes in
    the notes re-verified verbatim under whitespace normalisation, which is how the checker compares.

    A programmatic check was written for this round rather than a visual pass: list every reference
    appearing in any supported_by anywhere in the file, test each reference_review's notes for
    support-disclaiming wording with quoted historical text stripped, and report the intersection.
    It found exactly the two real cases and correctly did not flag PMID:8434912, whose disclaimer is
    true, or the round-2 correction that quotes the old clause. Zero live contradictions now.
