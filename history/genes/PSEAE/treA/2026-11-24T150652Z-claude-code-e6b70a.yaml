  summary: 'Review treA (PA2416): the single IMP row cites a 1987 E. coli paper'
  details: |
    Created the review for PA2416. The activity claim is accepted twice - GO:0004555 by IBA from
    PTN004635776 and by IEA from HAMAP-Rule MF_01060 - on the strength of curated family systems
    (NCBIfam NF009774/NF009775, PROSITE PS00927 and PS00928, InterPro IPR023720) plus the rule-placed
    active sites and the 30-residue signal peptide. The IBA's donors are all eukaryotic, which is not
    treated as a weakness: GH37 spans bacteria and eukaryotes and the target carries both trehalase
    patterns.

    The GO:0015927 IMP row cites PMID:2820965, a J Biol Chem paper on the E. coli enzyme whose mutants
    are named E. coli strains mapped at 26 min on the E. coli linkage map, published thirteen years
    before the PAO1 genome defined PA2416. The claim is kept and the row faulted as
    WRONG_EVIDENCE_CODE, IMP to ISS, at CONFIRMED - the merged pvdL precedent. Both GO:0015927 rows are
    TOO_GENERAL, since OLS confirms GO:0004555 descends from it and the general term also covers
    trehalose-6-phosphate hydrolases.

    GO:0071474 cellular hyperosmotic response is marked over-annotated. The observation behind the
    InterPro2GO mapping is that the E. coli enzyme is induced tenfold by 0.6 M sucrose, which is
    regulation by osmolarity rather than participation in the response to it, and the curated rule
    states the function as a nutritional one: it provides the ability to utilize trehalose at high
    osmolarity.
