  details: |
    Full review of 21 GOA rows for Q9HXC2. PMID:17660277 is a P. syringae OpuC paper; the only PA3891 data is a PAO1 genomic clone complementing a DC3000 opuCA mutant for osmoprotected growth on betaine or choline. Seeds for PTN001953445 (plasma membrane) and PTN001953060 (ABC-type glycine betaine transporter activity) judged INDIRECT-PHENOTYPE: claims plausible, IDA overstated. PSEUDOCAP WRONG_EVIDENCE_CODE and GO_CENTRAL CHECK defects recorded; IBAs kept. Core function: ATP hydrolysis contributing to glycine betaine ABC transport.
