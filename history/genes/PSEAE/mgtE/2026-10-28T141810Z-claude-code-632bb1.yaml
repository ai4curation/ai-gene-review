  summary: Full review of mgtE (PA0913, MgtE Mg2+ transporter); PseudoCAP IBA-seed
    assessment of PTN000227060 (transport seed sound; Mg2+-binding seed is an IMP,
    not binding evidence)
  details: |
    New review of all 12 GOA rows. GO:0015095 magnesium ion transmembrane transporter activity, GO:1903830 magnesium ion transmembrane transport and plasma membrane ACCEPT; GO:0015693 magnesium ion transport (IBA, IEA, IMP) MODIFY to GO:1903830; general cation transport/transporter and membrane IEA rows MODIFY to the Mg2+-specific terms or plasma membrane; GO:0000287 magnesium ion binding (IBA, IMP) KEEP_AS_NON_CORE. Seed verdicts for PMID:24722909 (Coffey et al. 2014, abstract only): GO:0015693 SOUND; GO:0000287 INDIRECT-PHENOTYPE (mutants of homology-predicted sites; binding true by similarity to T. thermophilus MgtE Q5SMG8, which is not a PTHR43773 tree leaf). Defects: PSEUDOCAP WRONG_EVIDENCE_CODE CHECK (IMP -> ISS) on GO:0000287; GO_CENTRAL OTHER CHECK on the PTN000227060 Mg2+-binding IBD (non-binding sole seed); GO_CENTRAL MISSING_NEGATION for six TM-less leaves (SCO5154, Rv1232c, CBO0203, TM_0892, A7T8Y4, VC_0300) that inherit magnesium ion transport. Added mgtE-bioinformatics (node composition, QuickGO checks, leaf Pfam/TM check, Tth Mg2+-site conservation alignment), notes with assessment table; cached 5 publications.
