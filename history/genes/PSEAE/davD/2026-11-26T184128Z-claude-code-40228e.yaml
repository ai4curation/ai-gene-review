  summary: 'Re-review of over-annotated IBA rows: SSADH activity and GABA catabolism
    moved to KEEP_AS_NON_CORE'
  details: |
    Pass projects/IBA_REVIEW/overannotated-2026-11-24 (batch N22). The IBA rows GO:0004777 succinate-semialdehyde dehydrogenase (NAD+) activity and GO:0009450 GABA catabolic process (IBDs at PTN008681047) were MARK_AS_OVER_ANNOTATED because succinate semialdehyde had not been tested on PA0265. On the PAINT tree the E. coli GabD seed (P25526) is in the same 6-leaf clade PTN000192661 as PA0265, and no loss is recorded. PA0265 is the PAO1 gabD (KEGG and STRING symbols), and the abstract of PMID:18192388 reports that the succinic-semialdehyde dehydrogenase activity of GabD and its induction by GABA were demonstrated in vitro. Both IBA rows changed to KEEP_AS_NON_CORE. For consistency the same-term IEA row GO:0009450 and the IEA parent row GO:0009013 succinate-semialdehyde dehydrogenase [NAD(P)+] activity were also changed to KEEP_AS_NON_CORE; the sentence that interpro/panther/PTHR43353 quotes from the GO:0009013 reason is kept verbatim. PMID:18192388 added to references (abstract only; cofactor and locus tag not read from the paper). Not changed: description, core_functions, the P. putida davD review, and the family review text on DavD. Validated with just validate PSEAE davD.
