    Independent re-review of the WRONG_GENE_PRODUCT / WRONG_REFERENCE source defects in this file (evidence re-read at the best available depth; identifiers verified by lookup; curator-deference rule applied).
    - GO:0015653 PMID:18156257 (WRONG_GENE_PRODUCT): WITHDRAWN. The defect claimed the GB data belong to PA3933. I read the 2008 full text (PMC2293270): Table 3 shows a PA5291 clone conferred growth on glycine betaine (and a PA3933 clone on choline) in DC3000 GB4, so the row is correctly on PA5291 by its own cited paper. The earlier reviewer relied only on Malek 2011's restatement without the 2008 primary data. Defect removed; the 2008 (GB) vs 2011 (choline) papers genuinely conflict on PA5291's substrate, so the row is left UNDECIDED as a literature discrepancy, not a source defect. Fixed the reference_review, suggested_question and a notes entry accordingly.
    - GO:0031460 PMID:18156257 (WRONG_GENE_PRODUCT): WITHDRAWN. Same as the GO:0015653 row: the 2008 cited paper directly tested PA5291 and found glycine betaine growth (Table 3), so this is not a wrong-gene mis-assignment. Defect withdrawn; left UNDECIDED (contested substrate).
