  summary: Full review of P. aeruginosa tgpA (PA2873); PseudoCAP/UniProt IBA-seed
    assessment of the transglutaminase IBD at PTN002126683
  details: |
    Reviewed all 6 GOA rows; all ACCEPT (GO:0003810 IBA, two IDA rows from PseudoCAP and UniProt, IEA from EC 2.3.2.13/RHEA:54816; GO:0005886 plasma membrane IDA and IEA). The sole seed of the GO:0003810 IBD at PTN002126683 (PTHR42736, 17 leaf IBAs in 15 taxa in the PAINT leaf GAF) is the IDA to PMID:23209712. Read in full, that paper assayed the His-tagged periplasmic domain (aa 180-544) expressed in E. coli with a colorimetric kit using CBZ-Gln-Gly as acyl donor and biotin-cadaverine as amine donor: activity about 45% of guinea-pig TGase and EDTA-insensitive. Verdict OVER-SPECIFIC rather than indirect-phenotype: the chemistry is real but is amine incorporation with surrogate substrates, whereas GO:0003810 is defined as protein-protein isopeptide cross-linking, no TgpA substrate is known and the catalytic triad (Cys404/His448/Asp464) is only inferred by similarity. The 17 leaves are named solely by domain content, PF01841 is a papain-like fold also used for proteolysis and deamidation, and the nearest characterised relative cited by the same authors, Bordetella WbmE, is an LPS O-antigen deamidase. Recorded a GO_CENTRAL WRONG_TERM/CHECK defect asking for a more general node term (e.g. GO:0016755) or restriction to Pseudomonas TgpA orthologues; no PseudoCAP defect, since the row matches UniProt's independent call. Essentiality (antisense and PrhaB depletion) is described but not annotated, and the unknown substrate is recorded as a BIOLOGY knowledge gap with three suggested experiments.
