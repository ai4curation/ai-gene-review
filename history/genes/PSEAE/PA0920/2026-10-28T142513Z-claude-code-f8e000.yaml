  summary: New review of PA0920 (Q9I537), alanyl-phosphatidylglycerol synthase, with
    PseudoCAP IBA-seed assessment
  details: |
    Initial review following projects/PSEUDOCAP/REVIEW_PROTOCOL.md. The PseudoCAP IDA rows (PMID:26261323) sole-seed three IBDs. GO:0047637 PG alanyltransferase at PTN005059806: SOUND (direct biochemistry; specificity caveat for 55 leaves). GO:0016755 aminoacyltransferase at PTN002162750: SOUND. GO:0055091 phospholipid homeostasis at PTN002162750: WRONG; the paper is a structure/in vitro study, the gene's own process is A-PG biosynthesis (homeostasis involves the PA0919 hydrolase), and the node contains fungal ergosteryl-glycine synthases. Both homeostasis rows MODIFIED to GO:0008654 with PSEUDOCAP and GO_CENTRAL defects. The ARBA-derived lysyltransferase IEA is REMOVED with a UniProt naming defect. Added literature PMID:19087229, 21392131, 22267511, 23792962.
