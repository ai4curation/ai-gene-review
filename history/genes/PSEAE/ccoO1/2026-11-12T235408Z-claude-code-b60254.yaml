  summary: 'Create review: ccoO1, monoheme cytochrome c subunit of the cbb3-1 oxidase'
  details: |
    Reviewed as part of the cbb3 oxidase group from the new tier-3 PseudoCAP worklist, whose shared_claims block flags GO:0004129 / PMID:14763990 as one claim spread over six proteins. PseudoCAP entered that identical IMP row on 20190311 for all eight subunits of both cbb3 operons, so a whole-operon deletion phenotype was transferred to each subunit; the cached paper is abstract-only and reports only isoform-level results ("only loss of cbb3-1 influenced growth"). None of the six seeds a PAINT IBD node, so no propagation_review applies and the IBA rows on the ccoN entries are received. A structural check against the RCSB API established that PDB 8SMR and 8SNH, the two cryo-EM supercomplex models cross-referenced from the CcoO entries, were built with the orphan CcoN paralogue PA4133 (Q9HWP8) plus CcoO1 and CcoP1/CcoP2, and contain no CcoQ chain. The eight subunits were then differentiated on evidence rather than uniformly, following the principle stated in the human COX reviews that the catalytic activity resides in the subunit carrying the binuclear centre. Specific to ccoO1: Pfam FixO, NCBIfam TIGR00781 and one PROSITE CYTC heme-c site, a single transmembrane anchor at 12-35, protein existence 1, and the CcoO chain present in both supercomplex structures. It carries a heme and relays electrons from CcoP to CcoN but has no catalytic site, so GO:0004129 is ACCEPTed as correct with a WRONG_QUALIFIER PseudoCAP defect at PROBABLE (enables to contributes_to), matching ccoP1 and ccoP2 exactly; the core function is GO:0009055 contributing to GO:0004129. GO:1902600 is KEEP_AS_NON_CORE because this chain has no proton channel.
