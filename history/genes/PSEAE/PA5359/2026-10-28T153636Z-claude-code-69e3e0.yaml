  details: |
    Reviewed both GOA rows. Both GO:0043448 rows (PseudoCAP IMP from PMID:14574114 and the IBA from PTN002217427) were left UNDECIDED: the seeding paper is not in PMC, only the abstract is cached, and an experimental annotation is not overturned from an abstract. Recorded the concerns as source defects instead. PSEUDOCAP: SUSPECTED WRONG_GENE_PRODUCT (CHECK) - the abstract characterises AlkB1, AlkB2, RubA1, RubA2 and RubB (PA2574, PA1525, PA5351, PA5350, PA5349), PA5359 is a 151-aa predicted lipoprotein with no alkane-oxidation component, and this is the only annotation in GOA keyed to the paper; PA5349 differs by one digit. GO_CENTRAL: PROBABLE over-propagation (CHECK) at PTN002217427, the PTHR39335 root, whose seven leaves are lipoprotein-repeat proteins from Streptomyces, Gloeobacter, Bradyrhizobium and tomato, and which now carries 764 GOA rows (757 TreeGrafter). No core function asserted. Added notes with a PseudoCAP IBA-seed assessment table and a bioinformatics folder.
