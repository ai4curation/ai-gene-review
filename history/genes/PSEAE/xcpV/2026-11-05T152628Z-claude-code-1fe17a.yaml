  summary: PANTHER tree check of PTN002446181 (T2SS IBDs); both GO_CENTRAL defects
    SUSPECTED -> CONFIRMED
  details: |
    Checked the PTHR38779 topology with projects/PSEUDOCAP/panther_tree.py on 2026-11-05. PTN002446181 is the family root: a SPECIATION node (Eubacteria) with 12 reference leaves, all SF2, whose children are two deep generic prepilin leaves (Aquifex ppdD3, Thermodesulfovibrio THEYE_A0597) and PTN002215342 (Proteobacteria, 10 leaves), which holds every T2SS-named leaf including XcpV. No PilV or MshD protein is a leaf of the tree; cross-checking the bioinformatics node_leaves.tsv shows the 12 reference leaves are all in the 49-protein QuickGO set and the PilV/MshD-named members are non-reference proteins grafted into the family by sequence. So the GspI/PilV split read from names is not a tree feature, but the IBD does sit one node too high. Raised both GO_CENTRAL defects (GO:0015627, GO:0015628) SUSPECTED -> CONFIRMED, changed the request to moving both IBDs to PTN002215342, re-pointed the defect supporting quotes to the RESULTS.md leaf-count line, and added a PANTHER tree check section to the notes. Annotation actions unchanged (both IBA rows stay ACCEPT: XcpV is inside PTN002215342).
