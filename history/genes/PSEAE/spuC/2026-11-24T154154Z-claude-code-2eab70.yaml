  summary: 'Round 1 of review on PR #6876: drop a slot misuse, file a UniProt INDUCTION
    defect'
  details: |
    Two changes.

    Removed GO:0030170 from core_functions.contributes_to_molecular_function. That slot is defined
    for a function a gene product contributes to as part of a complex but does not independently
    enable, and is used in this corpus only for genuine complex subunits. SpuC is a standalone
    class-III aminotransferase and the review accepts the enables GO:0030170 row, so the file was
    asserting both that SpuC enables PLP binding and that it does not. The PLP Schiff-base mechanism
    now appears in core_functions.description instead, and the GO:0030170 row's reason no longer
    describes it as a contributing function.

    Filed a WRONG_STATEMENT source defect against UniProt at CONFIRMED, found while reading
    PMID:12081945 and noticed by the reviewer as a divergence the review had quietly corrected
    without reporting. The CC INDUCTION line of Q9I6J2 reads 'By putrescine and agmatine' citing
    PubMed:12081945, and that paper's abstract concludes the opposite: the agmatine effect is
    abolished in an aguA mutant, so putrescine or spermidine, but not agmatine, is the inducer. The
    line also omits spermidine. Attached to the UniProt file's reference_review.
