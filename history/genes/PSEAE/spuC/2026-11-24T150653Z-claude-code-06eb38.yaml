  summary: 'Review spuC (PA0299): propose a GO term for EC 2.6.1.113; remove two BioA
    IBAs'
  details: |
    Created the review for PA0299. GO has no term for EC 2.6.1.113, the pyruvate-dependent putrescine
    aminotransferase reaction: a search returns only GO:0033094, the 2-oxoglutarate-dependent reaction
    (EC 2.6.1.82), which asserts the wrong acceptor and the wrong product. Both GO:0008483 rows are
    therefore MODIFY to a proposed new term, putrescine--pyruvate aminotransferase activity, with
    exactMatch mappings to EC:2.6.1.113 and RHEA:30707. The distinction is physiological, not
    cosmetic: because the pyruvate route makes alanine at every turnover, PMID:18192388 finds the
    alanine-pyruvate cycle indispensable for polyamine utilisation and couples SpuC to dadRAX.

    Added PMID:12081945 to the references. It is the gene's primary characterisation and the source
    UniProt uses for the EC number, but GOA carries no row citing it; its abstract states that
    enzymatic measurements identified pyruvate as the amino group receptor.

    Removed GO:0004015 and GO:0009102, both IBA from PTN000241343, a BioA node. Two checks: SpuC has
    target-specific evidence of a different activity (reviewed entry, EC 2.6.1.113 from assay,
    ECO:0000269 function statement, disruption phenotype, four PDB structures), and the comparator
    check points away from a gap - P. aeruginosa has its own bioA, PA0420 (Q9I693), and QuickGO returns
    both terms on it by IBA from the same GO_REF. propagation_review recorded on both rows.

    The GO:0008483 IMP cites PMID:21622750, whose abstract concerns pauA1-pauA6, pauB, pauC, pauD and
    bauRABCD and never mentions spuC; the full text is not cached. Raised as WRONG_REFERENCE / CHECK
    at SUSPECTED, and nothing in the review rests on that row.
