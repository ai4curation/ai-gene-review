  details: |
    Initial review following projects/PSEUDOCAP/REVIEW_PROTOCOL.md. Fur seeds five node-terms. PseudoCAP IMP GO:1900705 (PMID:8885270) is sound for Fur but its IBDs are OVER-SPECIFIC: sole seed at PTN002112483 (leaves include Neisseria, Helicobacter, Coxiella Fur, non-siderophore producers) and co-seed of GO:1900376 at the Fur-superfamily node PTN002112386 (Zur, PerR, Irr leaves); GO_CENTRAL defects recorded. Three multi-seeded CollecTF-based IBDs SOUND. CACAO siderophore biosynthesis IMP MODIFIED to the negative-regulation term; SOD-activity IMP MARK_AS_OVER_ANNOTATED; general TF/location terms MODIFIED.
