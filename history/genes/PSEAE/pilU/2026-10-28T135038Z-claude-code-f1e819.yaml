  summary: Full review of P. aeruginosa pilU (PA0396); PseudoCAP IBA-seed assessment
    of the two IBDs at PTN000766390
  details: |
    Reviewed all 7 GOA rows. PMID:18174131 verified as the correct paper (Chiang et al. 2008, ATPase assays of purified PilB, PilT, PilU), not a mis-keyed neighbour of PMID:18174132; reference VERIFIED. The PseudoCAP IDA 'DNA endonuclease activity, producing 5-prime-phosphomonoesters' (GO:0016888) is an off-by-one keying error for GO:0016887 ATP hydrolysis activity, which PseudoCAP assigned to PilB from the same paper on the same date: IDA MODIFY to GO:0016887 with a CONFIRMED PSEUDOCAP WRONG_TERM defect; the sole-seeded IBA at PTN000766390 (about 13 leaf IBAs) REMOVE with a GO_CENTRAL WRONG_TERM defect (verdict WRONG). The IMP type IV pilus-dependent motility seed (PMID:7854122) is SOUND; IMP and IBA accepted. ATP binding and cytoplasm accepted. Core function: PilT-dependent accessory type IV pilus retraction ATPase.
