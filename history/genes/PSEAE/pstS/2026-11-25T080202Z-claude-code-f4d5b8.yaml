  summary: 'Review pstS: two compartments, two separable functions, one wrong location
    term'
  details: |
    The periplasmic and extracellular rows are not in conflict. PstS is the periplasmic binding
    component of the Pst importer - purified from osmotic-shock fluid, one phosphate per molecule at
    Kd 0.34 micromolar, specific for inorganic over organic phosphates, and its loss removes the
    high-affinity uptake system - and is also exported to the cell surface by the Hxc type II secretion
    system under phosphate limitation, forming appendages.

    Both GO:0005576 rows MODIFY to GO:0009986 cell surface. GO's own comments make the two mutually
    exclusive: cell surface is for products attached to the plasma membrane or cell wall, extracellular
    region for those not attached, and OLS confirms neither is an ancestor of the other. The paper
    reports attached protein throughout. Filed WRONG_TERM against UniProt at PROBABLE, not CONFIRMED,
    because a type II system can release as well as display.

    GO:0044010 single-species biofilm formation is accepted, and the review contrasts it with pslB in
    batch 6, where the same term and evidence code were marked over-annotated because the single mutant
    had no defect. Here two mutations separate the functions in opposite directions: a point mutation
    abolishing phosphate binding leaves biofilm intact, and truncating a 15-residue N-terminal loop
    impairs biofilm without affecting binding or uptake. The biofilm role is a property of an identified
    structural element, not a consequence of disturbed phosphate acquisition.

    The virulence findings are not annotated: host-interaction outcomes several steps from anything
    PstS does molecularly.
