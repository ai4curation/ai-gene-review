  summary: 'Review pstS: two compartments, two separable functions, one wrong location
    term'
  details: |
    The periplasmic and extracellular rows are not in conflict. PstS is the periplasmic binding
    component of the Pst importer - purified from osmotic-shock fluid, one phosphate per molecule at
    Kd 0.34 micromolar, specific for inorganic over organic phosphates, and its loss removes the
    high-affinity uptake system - and is also exported to the cell surface by the Hxc type II secretion
    system under phosphate limitation, forming appendages.

    Both GO:0005576 rows MODIFY to GO:0009986 cell surface. GO's own comments make the two mutually
    exclusive: cell surface is for products attached to the plasma membrane or cell wall, extracellular
    region for those not attached, and OLS confirms neither is an ancestor of the other. The paper
    reports attached protein throughout. Filed WRONG_TERM against UniProt at PROBABLE, not CONFIRMED,
    because a type II system can release as well as display.

    GO:0044010 single-species biofilm formation is accepted, and the review contrasts it with pslB in
    batch 6, where the same term and evidence code were marked over-annotated because the single mutant
    had no defect. Here two mutations separate the functions in opposite directions: a point mutation
    abolishing phosphate binding leaves biofilm intact, and truncating a 15-residue N-terminal loop
    impairs biofilm without affecting binding or uptake. The biofilm role is a property of an identified
    structural element, not a consequence of disturbed phosphate acquisition.

    The virulence findings are not annotated: host-interaction outcomes several steps from anything
    PstS does molecularly.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - core_functions
  - references
  summary: 'PR review round 1: the biofilm role made a core function instead of a hedge'
  details: |
    The GO:0044010 row was ACCEPT, which the enum defines as retaining the annotation as a core
    function, while its reason closed "Kept non-core only in the sense that the molecular function is
    the binding activity" and core_functions named only phosphate binding and transport. The action,
    the reason and the synthesis disagreed, and the choice between them was substantive rather than
    cosmetic.

    Resolved in favour of core. The separation-of-function result is the whole argument for the row:
    the loop truncation impairs biofilm with phosphate binding and uptake intact, so the role belongs
    to a part of the protein that does nothing else. That is participation in its own right, not a
    downstream consequence of disturbed transport, and a review that recorded it only in prose would
    under-report the gene. Added a second core function carrying directly_involved_in GO:0044010, with
    no molecular_function and no locations: no activity has been identified for the N-terminal loop and
    the compartment in which it acts has not been established, so neither is asserted. The N-terminal
    loop knowledge gap moved onto that function, where it is the gap of the function it describes. The
    "kept non-core" clause is gone from the reason.

    Also added the methods evidence for the surface pool to PMID:18282104, which was reviewed on the
    paper's language alone: the pool is recovered after vortexing by a low-speed spin, so the detected
    protein was attached to the cell rather than free in the medium. That is what GO:0009986 asserts
    and GO:0005576 denies, so it strengthens the WRONG_TERM defect the review files against UniProt
    without changing its PROBABLE confidence.
