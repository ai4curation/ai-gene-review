  summary: 'Review PA2402: NRPS architecture annotated, pyoverdine claim deliberately
    withheld'
  details: |
    Reviewed the 5149-residue NRPS in the pvd cluster. GO:0003824 catalytic activity MODIFYed to GO:1904091 non-ribosomal peptide synthetase activity on the row's own cited IPR001242 condensation-domain signature, plus four TIGR01733 adenylation domains and the IPR010060 NRPS signature. The obsolete GO:0043041 MODIFYed to GO:0019184 nonribosomal peptide biosynthetic process. GO:0031177 phosphopantetheine binding and GO:0044550 secondary metabolite biosynthetic process both ACCEPTed; GO:0044550 is kept rather than treated as too general because the ancestors of GO:0019184 were checked in OLS and do not include it, so neither term entails the other. The substantive restraint: no GO:0002049 pyoverdine row is proposed and the GO:0043041 replacement is deliberately one level shallower than the merged pvdD, pvdJ and pvdL reviews use, because deepening it depends on identifying this locus as pvdI and no machine-readable source makes that link. UniProt has no Name= line at all, only OrderedLocusNames=PA2402; GOA's symbol, the KEGG xref and the PseudoCAP xref all agree, and just fetch-gene PSEAE pvdI fails for that reason. The identification is raised as a suggested question with the locus evidence that makes it plausible, rather than asserted. Folder named for the locus tag, following the PA5190, PA1268, PA0949, PA1204, PA2580 and PA4975 precedent. Also noted: a 5149-residue enzyme the field names as a core pyoverdine synthetase has four electronic rows and no experimental annotation of any kind, which is a curation gap rather than a knowledge gap.
