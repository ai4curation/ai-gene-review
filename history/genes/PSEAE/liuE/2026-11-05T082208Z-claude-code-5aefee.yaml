  summary: Review liuE (PA2011) bifunctional HMG-CoA/HIHG-CoA lyase and its two PseudoCAP
    IBA seeds
  details: |
    Tier-2 PseudoCAP IBA-seed review of both seedings at PTN000031222. GO:0006552 (3 seeds, IMP, PMID:19459965): SOUND - purified enzyme plus growth phenotype, and HMG-CoA cleavage is the terminal step of leucine catabolism. GO:0004419 (7 seeds, IMP, PMID:16517656): INDIRECT-PHENOTYPE - that paper calls the assignment probable and sequence-based; the activity was measured later, and UniProt already carries EXP rows, so one PSEUDOCAP WRONG_EVIDENCE_CODE defect (PROBABLE). Both IBDs stand on the mammalian HMGCL enzymes. One GO_CENTRAL defect (PROBABLE) asks PAINT to restrict the animal-seeded GO:0046951 ketone body biosynthesis IBD to the animal clade; the leaf row is marked over-annotated with a propagation_review. Actions: 9 ACCEPT, 1 MARK_AS_OVER_ANNOTATED, 3 TOO_GENERAL.
