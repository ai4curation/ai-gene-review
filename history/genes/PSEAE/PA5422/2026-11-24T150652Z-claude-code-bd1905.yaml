  summary: 'Review PA5422: two polyphosphate kinase IMP rows belong to PA5242 (ppk)'
  details: |
    Created the review for PA5422. Both PseudoCAP IMP rows (GO:0008976 polyphosphate kinase activity,
    GO:0006798 polyphosphate catabolic process, PMID:9734809) are removed as a wrong gene product and
    filed as WRONG_GENE_PRODUCT / IDENTIFIER_TRANSPOSITION at CONFIRMED.

    Three checks: the paper locates its subject as immediately following hemB, which is PA5243, making
    the subject PA5242 = UniProt P0DP44, PPK1_PSEAE, gene ppk, 690 aa; the paper describes a protein
    longer than a typical PPK while this entry is 318 aa with an aldose-epimerase fold and no kinase
    domain; and QuickGO returns GO:0008976 on P0DP44 with evidence code EXP from the same PMID, so the
    claim is already recorded where it belongs. PA5242 and PA5422 differ by a transposition of the
    middle digits.

    The process row is additionally wrong in direction - the paper demonstrates polyphosphate
    synthesis and P0DP44 carries GO:0006799 biosynthetic process - so no corrected gene product is
    requested for it.

    GO:0047938 is accepted as the gene's core function, stated as a family-level assignment: InterPro
    IPR025532 (G6P_1-epimerase subfamily, not the fold-level IPR008183 the entry also matches),
    PIRNR016020, and two proton donors placed by PIRSR016020-1. No assay exists on this protein, which
    is recorded as a knowledge gap. GO:0030246 carbohydrate binding is marked over-annotated: the
    protein binds its own substrate in its own active site, and neither supporting signature
    identifies a discrete carbohydrate-binding module.
