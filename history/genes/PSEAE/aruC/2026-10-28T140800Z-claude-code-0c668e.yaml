  summary: Full review of aruC (PA0895, succinylornithine/acetylornithine aminotransferase);
    PseudoCAP IBA-seed assessment of PTN000241318 and PTN000241033 (seeds sound; PTN000241318
    arginine-biosynthesis IBD over-propagates to LysJ/DABA-aminotransferase leaves)
  details: |
    New review of all 14 GOA rows. ACOAT activity (IBA, IDA, IEA), succinylornithine transaminase activity (IEA), L-arginine biosynthetic process (IBA, IDA, IEA), L-arginine catabolic process (IDA), cytoplasm and cytosol ACCEPT; transaminase activity MODIFY to GO:0043825 + GO:0003992; amino acid metabolic process and arginine metabolic process MODIFY to L-arginine catabolic + biosynthetic process; PLP binding KEEP_AS_NON_CORE. Core functions: SOAT in the AST catabolic pathway (main) and ACOAT in arginine biosynthesis (dual role, PMID:238949, PMID:16593724). The PseudoCAP IDA seeds from PMID:16593724 are judged SOUND for PTN000241318 (arginine biosynthesis sole seed; ACOAT 5 seeds) and PTN000241033 (arginine metabolic process, 8 seeds), with the caveat that the biosynthetic claim rests on enzymology and the classical dual-role interpretation (no auxotrophy test; paralog PA0530 in the same clade). GO_CENTRAL MISSING_NEGATION CHECK (SUSPECTED) defect: the PTN000241318 arginine-biosynthesis IBD reaches LysJ-type and diaminobutyrate-aminotransferase leaves. Cached PMID:238949, 103997, 9393691.
