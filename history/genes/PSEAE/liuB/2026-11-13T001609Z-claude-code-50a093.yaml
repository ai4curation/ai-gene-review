  summary: 'Create review: liuB, carboxyltransferase subunit of methylcrotonyl-CoA
    carboxylase'
  details: |
    Reviewed as the liuB/liuD shared-claim group from the tier-3 PseudoCAP worklist: both subunits carry GO:0004485 methylcrotonoyl-CoA carboxylase activity by IMP and IDA from the same pair of papers. Both papers are cached with full text, which settled the group rather than deferring it. The decisive fact is how the IDA was obtained: PMID:18469096 reconstituted the enzyme by mixing the separately purified alpha and beta subunits and renaturing them, so the activity was measured on the pair and no single chain was shown active. PMID:22158123, the 750-kDa alpha6beta6 structure of this organism own enzyme, says why: the alpha subunit carries the biotin carboxylase and BCCP domains and the beta subunit supplies the carboxyltransferase activity, with about 80 A between the two active sites, so the carboxyl group is handed between chains. Both GO:0004485 rows on both subunits are therefore ACCEPT with a WRONG_QUALIFIER PseudoCAP defect at CONFIRMED (enables to contributes_to) -- CONFIRMED rather than PROBABLE because the reconstitution is in the full text, unlike the cbb3 group where only an abstract was available. GO:0005515 bare protein binding is REMOVEd on both per policy, losing nothing because the interaction it records is the alpha-beta pairing that the GO:1905202 complex rows state precisely, one of them IDA from the structure. Specific to liuB: it is the beta subunit, confirmed independently by PMID:18469096 naming LiuB among the beta subunits and by the UniProt domain content (Pfam Carboxyl_trans plus both CoA-carboxyltransferase InterPro domains). GO:0016874 ligase activity is TOO_GENERAL since GO:0004485 is_a it (checked in QuickGO). GO:0008300 isoprenoid catabolic process is kept rather than refined because this entry carries no GO:0046247 row, unlike liuD; the asymmetry is in GOA, not the biology. A NEW IC row proposes GO:0016743 carboxyl- or carbamoyltransferase activity: every molecular-function row on the entry was either the holoenzyme activity or a generic ligase term, so the half-reaction this subunit actually performs was unannotated, and the full text names it.
