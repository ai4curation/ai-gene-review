  summary: Correct GO:0008300 to MODIFY, matching liuD
  details: |
    PR #6341 review item 1. GO:0008300 isoprenoid catabolic process was ACCEPT here and TOO_GENERAL on liuD, the other subunit of the same holoenzyme, for the same IMP row from the same paper -- a shared_claims group giving opposite verdicts to one claim. The stated reason argued from what GOA happens to assert (this entry carries no GO:0046247 row) rather than from the evidence, and contradicted the liuD review own sentence that the asymmetry is in GOA and not in the biology; CLAUDE.md forbids ACCEPT while arguing a term is too general, and says the replacement is preferably but not necessarily one the gene already carries. Now MODIFY to GO:0046247 terpene catabolic process with core_functions.directly_involved_in updated to match. Noted in the notes that the shared-claim grouping exists to stop exactly this drift and did not prevent it here.
