  summary: Full review of P. aeruginosa PA2580 (MdaB NAD(P)H quinone oxidoreductase);
    PseudoCAP IBA-seed assessment of PTN002922793
  details: |
    Reviewed all 8 GOA rows. The sole seed of the PTN002922793 GO:0034599 cellular response to oxidative stress IBD (PseudoCAP IMP, PMID:25085734: overexpression protects a katA mutant only) is weak but SOUND for the clade, since MdaB performs the protective two-electron quinone reduction and H. pylori MdaB (a leaf) has knockout oxidative-stress phenotypes (PMID:14977943); kept as non-core. The co-seeded quinone reductase activity row is sound but rests on purified-enzyme assays (PSEUDOCAP evidence code IMP to IDA). Catalytic activity and cytoplasm modified to specific terms; NADPH-specific EC row undecided. Cached PMIDs 14977943, 17923370, 16630630.
