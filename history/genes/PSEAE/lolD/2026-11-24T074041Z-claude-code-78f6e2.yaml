  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N21). GO:0055085 transmembrane transport IBA changed from MARK_AS_OVER_ANNOTATED to REMOVE. The IBD is at the family root PTN000655654 with three seeds (E. coli NikD and YejF, M. tuberculosis Rv2688c) in two other child clades; the child holding LolD has no seed. LolCDE lifts lipoproteins out of the outer leaflet of the inner membrane and does not move them across it, as the reconstituted P. aeruginosa complex shows, so the term is wrong for LolD and not merely broad. This matches the E. coli lolD review, where the same row is REMOVE. PAINT fix proposed in the batch record: a loss of the term at the LolD node PTN000656700. No other row changed.
