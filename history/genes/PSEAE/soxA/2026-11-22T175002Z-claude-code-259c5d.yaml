- type: REVIEW
  outcome: changed
  summary: Review soxA as part of the four-subunit sarcosine oxidase group; repoint
    its wrong reference
  details: |
    The alpha subunit, 1005 residues, and the richest of the four: three separate problems.

    Wrong reference: the IMP row cites PMID:17951384, a single-author transcription commentary
    indexed as Comment with no abstract (DOI 10.1128/JB.01611-07). WRONG_REFERENCE, REPOINT to
    PMID:17951379, CONFIRMED. The misdirection costs most here, because soxA is the one sox gene
    for which the correct paper reports subunit-resolved data: the 13C-choline NMR experiment was
    run on a soxA::TnM mutant, which accumulated sarcosine.

    Two IBA rows removed. Both trace to L-2-hydroxyglutarate dehydrogenase nodes, with donors
    resolved against the UniProt API: P37339 is E. coli LhgD, Q9H9P8 human L2HGDH, Q9LES4
    Arabidopsis L2HGDH. PANTHER's own whole-protein assignment for soxA is PTHR43104,
    "L-2-HYDROXYGLUTARATE DEHYDROGENASE, MITOCHONDRIAL", so the node placement is deliberate and
    the challenge is argued at that level per the project's IBA rule, not on similarity:
    architecture (donors are single-chain enzymes; soxA is one subunit of a heterotetramer,
    sharing only the FAD/NAD-binding domain, while its GcvT folate and 2Fe-2S domains have no
    counterpart in L2HGDH function), target-specific signature (IPR006277 is specific to the
    sarcosine oxidase alpha subunit), and target-specific evidence (the soxA mutant accumulates
    sarcosine). GO:0047545 and GO:0005886 both REMOVE, each with a propagation_review recording
    root_cause PROPAGATION_BAD and per-donor SUPPORTS_SOURCE_BUT_NOT_TARGET, and a WRONG_TERM
    defect at PROBABLE - not CONFIRMED, since the judgement rests on architecture and operon
    context rather than an assay excluding the activity. Donor count is deliberately not used as
    an argument anywhere, per the rule that a short WITH/FROM list is not weak support.

    A wrong oxidoreductase branch: GO:0016614 (CH-OH donors) is REMOVEd because sarcosine
    oxidation attacks a C-N bond. Checked in OLS - GO:0008115's ancestors run GO:0016491,
    GO:0016645 (CH-NH donors) and GO:0016647; GO:0016614 is not among them, so this is a sibling
    branch rather than a general ancestor. Its only evidence is an ARBA machine-learning rule.
    GO:0016491 by contrast IS a genuine ancestor, so that row is TOO_GENERAL.

    Removing the plasma-membrane row would have left this subunit with no cellular component at
    all, so a NEW cytoplasm row (IC) was added in its place, from three agreeing lines: the
    pathway runs on cytoplasmic substrates, soxA has no TM segment or membrane keyword, and the
    complex's catalytic subunit carries cytoplasm from an independent node.

    GO:0051536 iron-sulfur cluster binding is kept: three InterPro signatures and a Pfam match
    for a 2Fe-2S ferredoxin-type domain, and the one part of soxA's cofactor complement that does
    not rest on ARBA text.

    Group-level findings common to all four sox reviews:

    All four GO:0008115 IMP rows cite a different wrong PMID, and all four wrong PMIDs are
    J Bacteriol papers e-published on 2007-10-19 - one issue's block of consecutive ids, which is
    why the four are evenly spaced two apart (17951380, 17951382, 17951384, 17951386). The
    intended paper, PMID:17951379, sits immediately below the block. Every title was verified
    against PubMed, and the wrong PMID was confirmed live in today's GOA rather than taken from
    the five-day-old worklist. The four rows should be repointed together.

    A side effect worth recording: these wrong references CONCEALED a shared claim. One term on
    four subunits of one complex from one paper is exactly the group the PseudoCAP audit exists to
    catch, but build_pseudocap_mf_worklist.py keys groups on (term, reference), so four bogus and
    mutually different PMIDs split it into four singletons. The group becomes visible only once
    the references are corrected.

    What the correct paper shows: the evidence is genetic and spectroscopic, never an enzyme
    assay. Transposon mutants in all of soxABDG share the class II growth phenotype, and a soxA
    mutant accumulates sarcosine under 13C-choline feeding. The authors hedge throughout -
    "predicted", "putative" - and the sox names were assigned from homology to the Corynebacterium
    system. So each GO:0008115 IMP row is the tier-3 pattern exactly: a molecular function
    asserted from a growth phenotype. The claim holds for the complex, but the phenotype cannot
    say which subunit carries the catalytic site, which is what the per-subunit apportionment
    above rests on instead.

    The worklist's review_folder fields are NOT updated in this change. build_pseudocap_mf_worklist.py
    derives them by scanning for any *-ai-review.yaml on disk, and this branch also carries stub
    reviews for phnA, PA5190, femA and pvdL, so regenerating now would falsely mark those four as
    reviewed. The audit script therefore still reports these genes as unreviewed; the worklist
    should be regenerated once the remaining four of the nine-gene batch are done.
