  summary: Full review of P. aeruginosa ptrB (PA0612) DNA-damage-induced type III
    secretion repressor; PseudoCAP IBA-seed assessment of the PTN002215317 IBD
  details: |
    Reviewed all 3 GOA rows. The sole seed of the PTN002215317 GO:1900378 positive regulation of secondary metabolite biosynthetic process IBD, a PseudoCAP IMP citing Wu and Jin 2005 (PMID:16109947), is WRONG: the full text shows PtrB represses type III secretion and reports no secondary-metabolite phenotype; pyocin genes are activated by PrtN. Removed the IBA and IMP rows (PSEUDOCAP REPOINT and GO_CENTRAL DELETE_ROW defects); added NEW GO:0050709 negative regulation of protein secretion (IMP); zinc ion binding kept as non-core.
