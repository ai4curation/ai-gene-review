- type: REVIEW
  outcome: changed
  summary: Review fpvA
  details: |
    A Swiss-Prot reviewed entry (FPVA_PSEAE, 815 aa) and the best-characterised TonB-dependent
    transducer in this organism; included in batch 5 as a third instance of the femA/femI
    architecture and because it was a verified donor in femA's IBA node.

    THE SUBSTANTIVE CORRECTION. GO:0002049 pyoverdine biosynthetic process (IMP, PMID:12029043) is
    MODIFYed to GO:1900706 positive regulation of siderophore biosynthetic process. The cited
    paper's title invites the annotation it was given - "FpvA receptor involvement in pyoverdine
    biosynthesis" - but its full text, cached, states the mechanism: deleting fpvA reduced
    pyoverdine production "as a result of a decline in expression of genes (e.g., pvdD) associated
    with the biosynthesis of the pyoverdine peptide moiety". FpvA performs no step of the
    chemistry; pvdL, pvdD and pvdJ do, all reviewed in this corpus. The paper's own control
    settles it: an N-terminally truncated receptor still transports ferripyoverdine while no longer
    supporting pyoverdine production, which is only intelligible if the production effect is
    signalling. PMID:15968062 corroborates independently, describing FpvA as part of a signal
    transduction pathway that "controls production of" pyoverdine. Positive is the right sign since
    deletion reduced production. This is a lateral correction, not a refinement - GO:1900706 is not
    a descendant of GO:0002049 - which the project rules sanction, and this row's own evidence
    supports the replacement directly, as the 2026-11-14 ruling requires. GO has no
    pyoverdine-specific regulation term, so the replacement trades substance specificity for
    correctness of relation; proposing a child would be term churn and was not done.

    A REFERENCE THAT SUPPORTS A DIFFERENT TERM THAN ITS ROW. GO:0038023 signaling receptor activity
    carries an IMP from PMID:1903349 (Poole et al. 1991), whose reported result is a transport
    defect - a mutant lacking the 90 kDa IROMP transports barely detectable ferripyoverdine. The
    abstract says nothing about signal transduction, and cell-surface signalling by TonB-dependent
    transducers was not described until roughly a decade later, so the concept postdates the paper.
    The row is KEPT, because the term is right for this gene and is established by an IDA and by
    PMID:15968062, which is titled for the signal-transducing function; rows sharing a term must
    take consistent actions. The citation is recorded as WRONG_REFERENCE at PROBABLE with
    requested_change CHECK, suggesting a repoint to PMID:15968062. PROBABLE and CHECK rather than
    confident: the cache is abstract-only and an unmentioned function is the weaker of the
    project's two wrong-reference categories.

    Two core functions, as for femA, but here the separation is demonstrated rather than inferred:
    linker-insertion mutagenesis in PMID:15968062 produced mutants that lost transport or
    signalling independently, and localised signalling to a periplasmic N-terminal domain
    corresponding to the STN region on the record.

    Routine calls kept consistent with femA: GO:0019867 outer membrane TOO_GENERAL; GO:0016020
    membrane TOO_GENERAL even though it is an IDA, because the same experiment supports the
    accepted GO:0009279 at the right granularity; GO:0015343 kept rather than marked general, since
    it names substrate and mechanism and GO:0015344 adds only direction; GO:0015891 and GO:0033214
    both kept, neither being an ancestor of the other.

    The GO:0009279 IBA lists this gene in its own WITH/FROM. Recorded explicitly as expected rather
    than circular - fpvA has its own IDA for the term, so it was one of the descendant evidences
    behind the IBD - because marking it CIRCULAR_OR_REDUNDANT is the error the project rules single
    out.

    Batch 5 context: one of six genes in the fifth PseudoCAP tier-3 batch, branched from current
    main rather than stacked on the unmerged batch-4 branch. The batch centres on the femA/femI
    transposition found in batch 4, with vreR and fpvA included to test whether the same
    architecture carries the same error elsewhere; vreR returned a clean negative.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  summary: 'PR review round 1: two UniProt quotes matched two sections at once'
  details: |
    Both outer-membrane rows quoted the bare string "Cell outer membrane", which occurs in the
    record twice - on the CC SUBCELLULAR LOCATION line and in the KW keyword list. A keyword
    restates an annotation rather than supporting it, so an ambiguous quote leaves it open which
    kind of statement the row rests on, and backfill-record-sections could not place it (reported
    as "in more than one section"). Re-quoted as "SUBCELLULAR LOCATION: Cell outer membrane",
    which occurs only on the CC line, and record_section is now filled for both.
