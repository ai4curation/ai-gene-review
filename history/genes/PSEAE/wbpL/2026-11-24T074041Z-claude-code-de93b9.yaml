  summary: 'IBA over-annotation re-review: reasons for GO:0044038 and GO:0071555 corrected'
  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N21). Actions unchanged. The reasons and propagation comments for GO:0044038 and GO:0071555 said the cell-wall terms fit MraY-like members but not the WbpL branch. The tree shows the opposite arrangement of seeds: both seeds of the IBD at PTN000531998 are WecA enzymes in the WbpL branch (E. coli WecA in the same 9-leaf clade PTN000532025, T. maritima WecA in PTN000532005) and no MraY or TagO member is a seed. The over-annotation is therefore at the seeds (UniProt IDA rows from PMID:11700352 and PMID:18723618, transferase and O antigen papers read as abstracts only), which read an outer-membrane glycan as a cell-wall macromolecule. Reasons rewritten to say this. The family review rates the node SOUND; the disagreement is recorded in the batch notes.
