  summary: Assert wbpX D-rhamnosyltransferase activity as a NEW GO:0016758 row; correct stale prose
  details: 'Found by a cross-member audit of PseudoCAP shared claims rather than by re-reading the gene.
    wbpX and wbpY share the GO:0016757 claim from PMID:9680202 and had been reviewed inconsistently: wbpY
    refined it to GO:0016758 hexosyltransferase activity citing PMID:35166992 for both enzymes, while
    wbpX accepted the generic term on the stated ground that the donor and linkage had not been shown
    biochemically, and did not cite PMID:35166992 at all. That paper is titled for both enzymes, its full
    text is cached, and it reports both were expressed and assayed and transfer D-rhamnose from GDP-D-Rha
    onto the WbpZ product.


    Encoding. The specific activity is asserted as a NEW row, GO:0016758 with evidence IDA on PMID:35166992,
    and the three existing GO:0016757 rows (IBA, IEA, IMP) stay ACCEPT. A first version of this change
    made all three MODIFY to GO:0016758, copying wbpY. That is disallowed by the 2026-11-14 ruling in
    CLAUDE.md: a MODIFY needs this row''s own evidence for the deeper term, and none of the three has
    it, since the IBA inherits a node typed at GO:0016757, the IEA rests on the generic GT1 fold signature
    IPR001296, and the 1998 IMP is a mutant phenotype whose rhamnosyltransferase naming is the authors''
    own hedged inference. wbpY was changed the same way in the same PR so that the pair still agrees;
    that is a deliberate revisit of a merged review, on the ground that the shared claim is the unit this
    audit works on.


    Three statements in the file contradicted the newly cited paper and were corrected with it. The top-level
    description said the donor and linkage had not been shown by enzyme assay and that WbpX acts processively;
    the paper shows transfer from GDP-D-Rha directly and reports the WbpX/WbpY mixture to be non-processive.
    The core-function description said the alpha1-2 assignment remained inferred rather than shown; NMR
    in that paper shows WbpX makes both alpha1-2 and alpha1-3 linkages while WbpY makes only alpha1-3.
    suggested_questions and suggested_experiments asked for the donor, linkage and processivity work the
    paper had already done, and now ask how a single-domain enzyme switches between the two linkages.


    GO:0016758 was checked in OLS as an is_a child of GO:0016757. No GO_CENTRAL or PseudoCAP defect is
    recorded on wbpX: the node term was never wrong, and the request to re-seed the node with the PMID:35166992
    assays is recorded once, as a machine-readable source defect on wbpY, to avoid filing the same correction
    twice.'
