  summary: Refine wbpX glycosyltransferase rows to hexosyltransferase on direct enzymology
  details: |
    Found by a cross-member audit of PseudoCAP shared claims rather than by re-reading the gene. wbpX and wbpY share the GO:0016757 claim from PMID:9680202 and had been reviewed inconsistently: wbpY used MODIFY to GO:0016758 hexosyltransferase activity, citing PMID:35166992 for both enzymes, while wbpX used ACCEPT on the stated ground that the donor and linkage had not been shown biochemically, and did not cite PMID:35166992 at all.

    PMID:35166992 settles it against the wbpX reading. It is titled for both enzymes, its full text is cached, and it reports that both were expressed and assayed and transfer D-rhamnose from GDP-D-Rha onto the WbpZ product, with WbpX additionally extending the WbpY product. The sentence the earlier wbpX reasoning echoed (that the enzymes have not been biochemically characterised) is that paper's description of the prior state of the field, in its introduction.

    Changes: all three GO:0016757 rows (IBA, IEA, IMP) moved from ACCEPT to MODIFY with proposed_replacement_terms GO:0016758, matching wbpY; core_functions.molecular_function moved to GO:0016758 and its description no longer calls the transfer proposed, while still marking the alpha1-2 linkage assignment as inferred; PMID:35166992 added to references with three findings and a reference_review; the IBA row gained a propagation_review mirroring wbpY's for the same node, recording that the node conclusion is sound and the seeds are weak only in provenance, and that the gene appearing in its own WITH/FROM is expected rather than circular.

    GO:0016758 was checked in OLS as an is_a child of GO:0016757. No GO_CENTRAL or PseudoCAP defect is recorded: the node term was never wrong, only less specific than the target's own evidence now supports.
