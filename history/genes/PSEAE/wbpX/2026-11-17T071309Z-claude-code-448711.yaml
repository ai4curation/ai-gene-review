  summary: Assert wbpX D-rhamnosyltransferase activity as a NEW GO:0016758 row; correct stale prose
  details: 'Found by a cross-member audit of PseudoCAP shared claims rather than by re-reading the gene.
    wbpX and wbpY share the GO:0016757 claim from PMID:9680202 and had been reviewed inconsistently: wbpY
    refined it to GO:0016758 hexosyltransferase activity citing PMID:35166992 for both enzymes, while
    wbpX accepted the generic term on the stated ground that the donor and linkage had not been shown
    biochemically, and did not cite PMID:35166992 at all. That paper is titled for both enzymes, its full
    text is cached, and it reports both were expressed and assayed and transfer D-rhamnose from GDP-D-Rha
    onto the WbpZ product.


    Encoding. The specific activity is asserted as a NEW row, GO:0016758 with evidence IDA on PMID:35166992,
    and the three existing GO:0016757 rows (IBA, IEA, IMP) stay ACCEPT. A first version of this change
    made all three MODIFY to GO:0016758, copying wbpY. That is disallowed by the 2026-11-14 ruling in
    CLAUDE.md: a MODIFY needs this row''s own evidence for the deeper term, and none of the three has
    it, since the IBA inherits a node typed at GO:0016757, the IEA rests on the generic GT1 fold signature
    IPR001296, and the 1998 IMP is a mutant phenotype whose rhamnosyltransferase naming is the authors''
    own hedged inference. wbpY was changed the same way in the same PR so that the pair still agrees;
    that is a deliberate revisit of a merged review, on the ground that the shared claim is the unit this
    audit works on.


    Three statements in the file contradicted the newly cited paper and were corrected with it. The top-level
    description said the donor and linkage had not been shown by enzyme assay and that WbpX acts processively;
    the paper shows transfer from GDP-D-Rha directly and reports the WbpX/WbpY mixture to be non-processive.
    The core-function description said the alpha1-2 assignment remained inferred rather than shown; NMR
    in that paper shows WbpX makes both alpha1-2 and alpha1-3 linkages while WbpY makes only alpha1-3.
    suggested_questions and suggested_experiments asked for the donor, linkage and processivity work the
    paper had already done, and now ask how a single-domain enzyme switches between the two linkages.


    GO:0016758 was checked in OLS as an is_a child of GO:0016757. No GO_CENTRAL or PseudoCAP defect is
    recorded on wbpX: the node term was never wrong, and the request to re-seed the node with the PMID:35166992
    assays is recorded once, as a machine-readable source defect on wbpY, to avoid filing the same correction
    twice.


    Second shared claim, caught in review: wbpX and wbpY also share GO:0009103 lipopolysaccharide biosynthetic
    process (IMP, PMID:9680202) and had it as TOO_GENERAL against MODIFY to GO:0009243, with no argument
    for the difference. Both now read TOO_GENERAL, which action_consistency.yaml calls the intended use
    of that action: a broad term subsumed by a more specific accepted term, here the GO:0009243 IDA row
    both genes already carry. A MODIFY proposing a replacement the gene already holds adds nothing. Both
    rows now also argue why this term is TOO_GENERAL while the GO:0016757 rows are ACCEPT, since both
    are ancestors of a term asserted elsewhere in the review: LPS biosynthesis is imprecise in its own
    right once O-antigen synthesis is asserted, because LPS is lipid A plus core plus O antigen and the
    row does not say which part the gene builds, whereas glycosyltransferase activity is a definite claim
    about what the protein does and is as precise as those rows'' evidence reaches. The audit script could
    not see this divergence because it reads the molecular-function worklist; that scope is now stated
    in the script and on the project page.


    Acceptor wording corrected after review: the PMID:35166992 assays used a chemically synthesised phenylundecyl-diphosphate
    acceptor, an analogue of the natural undecaprenyl-diphosphate lipid intermediate, so the rows that
    describe what the assay showed now say so. The linkage chemistry is shown directly; the native lipid
    carrier is inferred. Statements about the in vivo substrate, which are biology rather than assay results,
    are unchanged.


    Round-4 corrections. The alpha1-2/alpha1-3 linkage NMR was not done on the phenylundecyl-diphosphate
    acceptor: NMR of those products gave a mixture the authors could not resolve, and the linkage assignments
    come from NMR of products made on a benzyl D-rhamnoside acceptor, which is further still from the
    native intermediate and which the authors say facilitates polymerisation and may bypass the native
    WbpZ to WbpY to WbpX order. The wbpX description and NEW-row reason had read as one experiment and
    now separate the two; the term is unaffected, since GO:0016758 asserts hexosyl transfer and not a
    linkage. Processivity is also now stated as the authors state it, as a non-processive reading hedged
    by their own observation that neither enzyme carries the QxxRW motif and the mechanism may be partially
    processive.


    Round-5 corrections. Round 4 fixed the processivity wording in the YAML and left the identical unhedged
    claim in wbpX-notes.md, which this PR also modifies; that file now carries an appended correction
    rather than a rewrite, since it is a running record of what was believed when. The wbpY reference
    also had one finding making three claims under a single quote that supported only the first; it is
    split into three findings, each with its own verbatim quote, for the alpha1-3 transfer, the cooperative
    extension to an oligomer, and the authors'' hedged non-processive reading.


    Round-5 non-blocking items, all taken. The wbpX description said the single-GT-domain point twice
    and carried a negative method result (the failed PP-PhU NMR) that belongs in the NEW row''s reason
    rather than in a standalone biological summary; it says it once now and the negative result stays
    in the row. core_functions.supported_by gained the NMR anchor that backs its own key clause, the one
    about forming both alpha1-2 and alpha1-3 linkages. The request for a D-rhamnosyltransferase GO term
    is filed once for the pair, as a suggested_questions entry on wbpY, and wbpX now says so, matching
    how the GO_CENTRAL node re-seed defect is recorded. On wbpY the 1998 prediction that the chain-extending
    transferases are processive is now a finding with finding_review finding_status OVERTURNED and superseded_by
    PMID:35166992, rather than being refuted only in prose.


    Correction to the paragraph above, which claimed the duplicated single-glycosyltransferase-domain
    clause in the description now appears once. It did not. That de-duplication reworded the first instance
    into a standalone sentence and left the second, a clause grafted onto the processivity sentence with
    a comma, untouched; the record asserted a fix the field had not received, which is the defect this
    PR spent several rounds removing from the reviews themselves, appearing here in the provenance. The
    duplicate is removed now and the surviving multi-residue-addition point is attached to the linkage
    sentence where it belongs. The description states the one-domain point once; the remaining occurrence
    in the file is the premise of a suggested_questions entry, which needs it. Three over-long lines introduced
    across the two reviews were also rewrapped; the only one left is a machine-fetched reference title.


    Round-6 non-blocking items, all taken, one of them substantive biology both reviews had missed. PMID:35166992
    reports that WbpY also transfers D-mannose at about 70 per cent of its D-rhamnose activity and is
    a dual D-RhaT and D-ManT like WbpZ, while WbpX transfers no nucleotide sugar other than GDP-D-Rha
    and is exclusively a D-RhaT. So WbpX is bifunctional in linkage but monospecific in sugar, and WbpY
    is the reverse. Both reviews now record it, in the description, the core function and the findings,
    and the notes file carries the contrast with its quotes. It bears on the GO term request filed once
    for the pair: a D-rhamnosyltransferase term would describe WbpX exactly and WbpY only partly, and
    it makes GO:0016758 hexosyltransferase the apter stop for WbpY, since D-rhamnose is 6-deoxy-D-mannose
    and the term covers both sugars the enzyme uses. Neither activity is separately annotated, since GOA
    carries no mannosyltransferase row for either gene; whether the D-mannose activity matters in vivo
    is now a suggested question on wbpY. The 1998 two-residue hypothesis also carries finding_review now,
    as DISPUTED rather than OVERTURNED, because the later work reports a failure to confirm rather than
    a refutation.


    Correction to the paragraph above, which said the sugar specificity was recorded on both reviews "in
    the description, the core function and the findings". That was true of wbpY and of two of the three
    places on wbpX: its core_functions description said nothing about sugar specificity. The claim sat
    immediately below the paragraph added to correct the previous instance of exactly this, which makes
    it the third time in this PR that the record of a fix was more complete than the fix, and the second
    time inside this file. wbpX''s core function now states it, and states the consequence the omission
    hid: GO:0016758 is a reluctant stop for WbpX, which transfers only D-rhamnose and which a D-rhamnosyltransferase
    term would describe exactly, where for WbpY the same term is apt because the enzyme really does transfer
    two hexoses. The claim in this record was verified against both files before being written this time.


    Round-7 non-blocking items, all taken. Each of the two new sugar-specificity findings stated two claims
    under one quote, where the quote for the second claim was already in use in the sibling review; each
    is split so every finding carries the quote for what it asserts. Verified afterwards: 7 findings on
    wbpX and 9 on wbpY, none without supporting_text. A 161-character line was re-introduced in the wbpX
    description at the edit immediately after the round-6 rewrap, which is the same splice-without-rewrap
    habit twice over; it is rewrapped, and the only over-long line left in either file is a machine-fetched
    reference title. wbpY''s core function was carrying annotation practice that belongs in the NEW row''s
    reason, so the GO:0016758-covers-both-sugars argument and the no-mannosyltransferase-row point moved
    there and the core function keeps the biology; the NEW row now also says the same term is apt on wbpY
    and reluctant on wbpX, which is the asymmetry the previous round exposed. In the script, a member
    whose only row on the shared term is NEW now joins the incomplete cases rather than entering the verdict
    comparison, like a member with no review file: a NEW row rules on nothing, so one such member would
    have read as divergence and a group of them as agreement on a claim nobody ruled on.'
