  summary: Full review of hom (PA3736, homoserine dehydrogenase); PseudoCAP IBA-seed
    assessment of PTN000752178 (claims sound, seed reference unverifiable)
  details: |
    New review of all 13 GOA rows. homoserine dehydrogenase activity (IBA, IDA, IEA, ISS), L-threonine biosynthetic process (IBA, IDA, IEA) and L-methionine biosynthetic process (ISS) ACCEPT; alcohol dehydrogenase (NAD+) activity (Rhea IEA) and oxidoreductase activity MODIFY to GO:0004412; amino acid metabolic process MODIFY to L-homoserine biosynthetic process; NADP binding and NAD+ binding KEEP_AS_NON_CORE. The PseudoCAP IDA seeds cite PMID:10220164 (Patte 1999, ThrH), whose abstract never mentions hom or HDH; the same PMID was batch-applied to thrB, hom and thrH. Verdict UNVERIFIABLE for the paper but the PTN000752178 IBDs (threonine biosynthesis sole seed; HDH activity with B. subtilis P19582) are biologically sound for an all-HDH clade. PSEUDOCAP WRONG_REFERENCE CHECK (SUSPECTED) defects suggest PMID:1333566 (Clepet 1992). Notes with assessment table added; cached PMID:1333566.
