  summary: Full review of gbuA (PA1421, guanidinobutyrase); PseudoCAP IBA-seed assessment
    of PTN004253691 (seeds sound; node over-propagates arginine catabolism and guanidinopropionase)
  details: |
    New review of all 10 GOA rows. guanidinobutyrase activity (EXP x2, IBA, IDA, IEA) and L-arginine catabolic process (IBA, IDA) ACCEPT; amidine hydrolase activity MODIFY to GO:0047971; metal ion binding MODIFY to manganese ion binding; guanidinopropionase activity IBA REMOVE (purified GbuA has no activity on 3-guanidinopropionate, PMID:12029055). PseudoCAP IDA seeds from PMID:3141581 (Jann 1988, fourth arginine catabolic pathway) judged SOUND for the PTN004253691 guanidinobutyrase (2 seeds) and L-arginine catabolic process (sole seed) IBDs; gbuA disruption abolishes L-arginine growth in an aruF background (PMID:17416670). The node is a guanidino acid hydrolase clade (vertebrate AGMAT, GpuA, GbuA), so the arginine catabolism node term over-reaches: GO_CENTRAL MISSING_NEGATION CHECK (SUSPECTED) for GpuA and vertebrate AGMAT leaves, and MISSING_NEGATION ADD (PROBABLE) NOT GO:0047972 at the GbuA leaf. Cached PMID:17416670, 17416668.
