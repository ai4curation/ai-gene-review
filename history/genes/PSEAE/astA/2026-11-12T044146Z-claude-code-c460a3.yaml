  summary: Consolidate the duplicate P80357 review from genes/PSEAE/aruF
  details: |
    PR #6019 review item 1. main had gained its own review of UniProt P80357 at genes/PSEAE/aruF (the AST-module pass) while this branch added genes/PSEAE/astA; the folder names differ, so git merged both silently and the corpus held two COMPLETE reviews of one accession. astA is the conventional folder name: GOA/PseudoCAP give the symbol as astA, UniProt has GN Name=astA with aruF only as a synonym, and the aruF file itself already carried gene_symbol: astA. The two reviews agreed on all five actions. Ported from the aruF pass, which was right where the two differed: core_functions now uses contributes_to_molecular_function rather than molecular_function for GO:0008791, since the enzyme is a heterotetramer of two different chains and no single chain is shown active alone, and the GO:0008791 IEA row gains the WRONG_QUALIFIER UniProt source defect (enables -> contributes_to) with the CC:SUBUNIT quote. The PTN000764516 GO:0009015 node defect stays here as the single canonical record; the duplicate in aruG was replaced by a comment pointing at it. genes/PSEAE/aruF is retired, and its history record moved here with target.superseded_by.
