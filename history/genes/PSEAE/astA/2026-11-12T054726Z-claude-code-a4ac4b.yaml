  summary: Restore the last structural residuals of the aruF consolidation
  details: |
    PR #6019. After the previous commit restored the dropped UniProt defect and the abstract-only flags, a field-path comparison of the retired aruF review against this one (every leaf path on both sides, not just existing_annotations and core_functions) found five more things the consolidation had left behind. Three are substantive: the core function lost its third supported_by entry, the NCBIfam TIGR03245 arg_AOST_alph signature, which is the alpha-chain-specific family evidence and valid computational support for membership; the GO_CENTRAL node defect carried no record field, so although its explanation names PTN000764516 the generated report had no machine-readable key to the node, and this entry is now the single canonical record for that upstream request after the consolidation removed the aruF and aruG copies; and the UniProt file reference lost its structured findings entry for the Pfam PF04958 statement. Two are optional metadata the retired pass carried: experts on the subunit-roles question and experiment_type on the reconstitution experiment. All five restored; the field-path comparison now reports nothing missing, and GO_CENTRAL.md keys the node defect to PANTHER:PTN000764516. The same comparison confirms the dacB to PA3047 consolidation lost nothing. The lesson recorded for later batches: comparing only the sections that carry annotation actions misses source defects, reference flags and provenance metadata, which live in references.
