  summary: Restore the P80357 UniProt defect and the abstract-only flags dropped in
    the consolidation
  details: |
    PR #6019 follow-up. The astA/aruF consolidation in 1cb853c ported existing_annotations and core_functions but not references, so three things the retired aruF pass carried were lost. (1) A WRONG_STATEMENT UNIPROT defect on UniProtKB:P80357 CC:SIMILARITY ("Belongs to the succinylarginine dihydrolase family"), which contradicts the records own Pfam PF04958 (AstA) and InterPro IPR007041. Its absence left an asymmetry inside one enzyme: the identical error on the beta chain is reported from aruG for UniProtKB:P80358 and reaches the UniProt report, while the alpha chain was not reported at all despite the same evidence. The astA notes had said it was deliberately not recorded "not tied to an annotation row", which is wrong, because references[].reference_review.source_defects is the slot for a record-level defect and is the slot aruG uses. Restored, cross-referencing the beta chain so both are corrected together. (2) The full_text_unavailable: true flags on PMID:16593724, PMID:7523119 and PMID:9393691, which had become prose in review_notes only. (3) A reference_review on the UniProt file reference. The per-resource reports were regenerated: UniProt goes 22 to 23 and the total 422 to 423, and projects/PSEUDOCAP.md updated to match.
