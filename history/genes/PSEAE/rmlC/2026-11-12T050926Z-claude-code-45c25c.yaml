  summary: Mark the polysaccharide-assembly rows over-annotated, per the PTHR21047
    family review
  details: |
    PR #6019, found by just validate-families after the merge from main: family_gene_crosscheck reported a PRUNING_CONFLICT because the PTHR21047 family review (which arrived whole in the merge) assesses the PTN000471580 GO:0000271 IBD as WRONG_NODE and recommends withdrawing it, while this review kept the term as TOO_GENERAL. The family review is right and this review was wrong. RmlC is a soluble C3/C5 epimerase that makes the nucleotide-sugar donor dTDP-L-rhamnose; it forms no glycosidic bond and adds no residue to a polymer, so by this project own rule on involved_in (participation requires doing some of the work, and necessity evidence is not participation) the downstream assembly processes are over-annotations rather than true-but-general terms. The GO:0009244 row had made the conflation explicit, calling precursor supply "a step of core synthesis" on the strength of a mutant phenotype. Changed from TOO_GENERAL/ACCEPT to MARK_AS_OVER_ANNOTATED: GO:0000271 (IBA and IDA), GO:0009103 (IDA and IEA) and GO:0009244 (IDA). GO:0009244 is also dropped from the core function directly_involved_in, leaving GO:0019305 dTDP-rhamnose biosynthetic process, which is the process RmlC does perform a step of. A propagation_review was added to the IBA row recording the node reading. This matches the three sibling reviews of the same clade, ECOLI rfbC and PSEPK rfbC and PSEPK rmlC, which all mark the propagated row over-annotated. The cross-check now reports 0 conflicts.
