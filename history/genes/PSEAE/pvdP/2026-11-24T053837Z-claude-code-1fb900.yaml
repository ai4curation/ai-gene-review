  details: |
    Two fixes from review. The locus tag in the description and notes said PA2386, which is pvdA; the record fetched in this PR gives OrderedLocusNames=PA2392. Corrected in both places. The reviewer was right to call this critical rather than cosmetic: a wrong locus tag in the description field names a different gene, and the rule against guessing identifiers covers locus tags as much as GO term ids. Separately, the tyrosinase ACCEPT rested on one paper when a second, independent group had confirmed the activity structurally. Added PMID:31899238 with three findings: a non-competitive phenylthiourea inhibitor co-crystallised with PvdP, binding an allosteric site rather than the active site; inhibition requiring the C-terminal lid region; and the allosteric site appearing confined to the fluorescent pseudomonads, which independently supports the small dedicated family the first paper described. An allosteric inhibitor with a co-crystal structure constrains the activity more tightly than an assay alone.
