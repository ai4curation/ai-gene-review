    Round-8 non-blocking items, all taken, two of them biology.


    The paper gives the two chain-extending enzymes different jobs, which both core functions had flattened
    to acting together: WbpY builds a short adapter or anchor on the WbpZ primer, and WbpX is the main
    polymerase, the latter because its broad acceptor specificity lets it work on substrates well away
    from the undecaprenyl-diphosphate carrier. Both core functions now say so.


    The paper also partly answers this review''s own question about the D-mannosyltransferase activity.
    CPA is reported to carry a small amount of D-mannose alongside other minor sugars, so the activity
    may well be used in vivo rather than being an artefact of D-rhamnose being 6-deoxy-D-mannose. Nothing
    ties this enzyme to those residues, so the question is sharpened rather than closed, and the core
    function says both that the minor sugar is present and that the connection is unmade.


