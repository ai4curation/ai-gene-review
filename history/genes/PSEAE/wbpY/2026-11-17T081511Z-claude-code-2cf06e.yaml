  summary: Move wbpY GO:0016757 rows back to ACCEPT; assert the assayed activity as
    a NEW GO:0016758 row
  details: |
    Harmonisation half of the wbpX/wbpY shared-claim fix. wbpY's three GO:0016757 rows (IBA, IEA, IMP) were MODIFY to GO:0016758 hexosyltransferase activity on the strength of the direct D-rhamnosyltransferase assays in PMID:35166992. The 2026-11-14 ruling in CLAUDE.md disallows that: a MODIFY needs this row's own evidence for the deeper term. None of the three has it. The IBA inherits a node typed at GO:0016757; the IEA rests on the generic GT1 fold signature IPR001296 plus an ARBA prediction, neither of which can distinguish hexosyl from any other glycosyl transfer; and the IMP row's own reason already stated that the 1998 mutant phenotype does not show the molecular activity, then refined the term anyway on another paper's assays, which is exactly the move the ruling names.

    The three rows are therefore ACCEPT, and the assayed activity is asserted as a NEW row, GO:0016758 with evidence IDA on PMID:35166992, carrying the demonstration quote and the NMR quote showing WbpY transfers a single D-Rha residue in alpha1-3 linkage. core_functions already used GO:0016758 and is unchanged, as are the description, suggested_questions and suggested_experiments, which were checked against the paper and are accurate.

    This revisits a merged review deliberately rather than leaving it to the separate corpus sweep the ruling mentions. The reason is that the shared claim, not the gene, is the unit the audit works on: changing only wbpX would have left the pair divergent again, which is the defect the audit exists to find. The GO_CENTRAL source defect asking for the node to be re-seeded with the PMID:35166992 assays stays on this review, where it was already recorded.
