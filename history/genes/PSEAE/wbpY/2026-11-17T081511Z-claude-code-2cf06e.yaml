  summary: Move wbpY GO:0016757 rows back to ACCEPT; assert the assayed activity as a NEW GO:0016758 row
  details: 'Harmonisation half of the wbpX/wbpY shared-claim fix. wbpY''s three GO:0016757 rows (IBA,
    IEA, IMP) were MODIFY to GO:0016758 hexosyltransferase activity on the strength of the direct D-rhamnosyltransferase
    assays in PMID:35166992. The 2026-11-14 ruling in CLAUDE.md disallows that: a MODIFY needs this row''s
    own evidence for the deeper term. None of the three has it. The IBA inherits a node typed at GO:0016757;
    the IEA rests on the generic GT1 fold signature IPR001296 plus an ARBA prediction, neither of which
    can distinguish hexosyl from any other glycosyl transfer; and the IMP row''s own reason already stated
    that the 1998 mutant phenotype does not show the molecular activity, then refined the term anyway
    on another paper''s assays, which is exactly the move the ruling names.


    The three rows are therefore ACCEPT, and the assayed activity is asserted as a NEW row, GO:0016758
    with evidence IDA on PMID:35166992, carrying the demonstration quote and the NMR quote showing WbpY
    transfers a single D-Rha residue in alpha1-3 linkage. core_functions already used GO:0016758 and is
    unchanged, as are the description, suggested_questions and suggested_experiments, which were checked
    against the paper and are accurate.


    This revisits a merged review deliberately rather than leaving it to the separate corpus sweep the
    ruling mentions. The reason is that the shared claim, not the gene, is the unit the audit works on:
    changing only wbpX would have left the pair divergent again, which is the defect the audit exists
    to find. The GO_CENTRAL source defect asking for the node to be re-seeded with the PMID:35166992 assays
    stays on this review, where it was already recorded.


    Second shared claim, caught in review: wbpX and wbpY also share GO:0009103 lipopolysaccharide biosynthetic
    process (IMP, PMID:9680202) and had it as TOO_GENERAL against MODIFY to GO:0009243, with no argument
    for the difference. Both now read TOO_GENERAL, which action_consistency.yaml calls the intended use
    of that action: a broad term subsumed by a more specific accepted term, here the GO:0009243 IDA row
    both genes already carry. A MODIFY proposing a replacement the gene already holds adds nothing. Both
    rows now also argue why this term is TOO_GENERAL while the GO:0016757 rows are ACCEPT, since both
    are ancestors of a term asserted elsewhere in the review: LPS biosynthesis is imprecise in its own
    right once O-antigen synthesis is asserted, because LPS is lipid A plus core plus O antigen and the
    row does not say which part the gene builds, whereas glycosyltransferase activity is a definite claim
    about what the protein does and is as precise as those rows'' evidence reaches. The audit script could
    not see this divergence because it reads the molecular-function worklist; that scope is now stated
    in the script and on the project page.


    Acceptor wording corrected after review: the PMID:35166992 assays used a chemically synthesised phenylundecyl-diphosphate
    acceptor, an analogue of the natural undecaprenyl-diphosphate lipid intermediate, so the rows that
    describe what the assay showed now say so. The linkage chemistry is shown directly; the native lipid
    carrier is inferred. Statements about the in vivo substrate, which are biology rather than assay results,
    are unchanged.


    Second GO:0009103 row, caught in round 3: this review has two rows on that term, an IBA from PTN000749272
    as well as the IMP, and the first harmonisation reached only the IMP. The IBA still read MODIFY to
    GO:0009243 on the ground that the gene already carries that term, which is the argument against the
    action rather than for it, and which the IMP row''s new reason explicitly refutes; the two rows contradicted
    each other inside one review. The IBA is now TOO_GENERAL like the IMP row. The ruling points the same
    way: PTN000749272 is typed at GO:0009103, so an IBA inheriting it cannot reach past that term, exactly
    as for the GO:0016757 IBA rows here and on wbpX. A full sweep of both reviews afterwards confirms
    no MODIFY rows remain on either gene and that the two are now consistent row for row.


    Round-4 corrections. The alpha1-2/alpha1-3 linkage NMR was not done on the phenylundecyl-diphosphate
    acceptor: NMR of those products gave a mixture the authors could not resolve, and the linkage assignments
    come from NMR of products made on a benzyl D-rhamnoside acceptor, which is further still from the
    native intermediate and which the authors say facilitates polymerisation and may bypass the native
    WbpZ to WbpY to WbpX order. The wbpX description and NEW-row reason had read as one experiment and
    now separate the two; the term is unaffected, since GO:0016758 asserts hexosyl transfer and not a
    linkage. Processivity is also now stated as the authors state it, as a non-processive reading hedged
    by their own observation that neither enzyme carries the QxxRW motif and the mechanism may be partially
    processive.


    Round-5 corrections. Round 4 fixed the processivity wording in the YAML and left the identical unhedged
    claim in wbpX-notes.md, which this PR also modifies; that file now carries an appended correction
    rather than a rewrite, since it is a running record of what was believed when. The wbpY reference
    also had one finding making three claims under a single quote that supported only the first; it is
    split into three findings, each with its own verbatim quote, for the alpha1-3 transfer, the cooperative
    extension to an oligomer, and the authors'' hedged non-processive reading.


    Round-5 non-blocking items, all taken. The wbpX description said the single-GT-domain point twice
    and carried a negative method result (the failed PP-PhU NMR) that belongs in the NEW row''s reason
    rather than in a standalone biological summary; it says it once now and the negative result stays
    in the row. core_functions.supported_by gained the NMR anchor that backs its own key clause, the one
    about forming both alpha1-2 and alpha1-3 linkages. The request for a D-rhamnosyltransferase GO term
    is filed once for the pair, as a suggested_questions entry on wbpY, and wbpX now says so, matching
    how the GO_CENTRAL node re-seed defect is recorded. On wbpY the 1998 prediction that the chain-extending
    transferases are processive is now a finding with finding_review finding_status OVERTURNED and superseded_by
    PMID:35166992, rather than being refuted only in prose.


    Round-6 non-blocking items, all taken, one of them substantive biology both reviews had missed. PMID:35166992
    reports that WbpY also transfers D-mannose at about 70 per cent of its D-rhamnose activity and is
    a dual D-RhaT and D-ManT like WbpZ, while WbpX transfers no nucleotide sugar other than GDP-D-Rha
    and is exclusively a D-RhaT. So WbpX is bifunctional in linkage but monospecific in sugar, and WbpY
    is the reverse. Both reviews now record it, in the description, the core function and the findings,
    and the notes file carries the contrast with its quotes. It bears on the GO term request filed once
    for the pair: a D-rhamnosyltransferase term would describe WbpX exactly and WbpY only partly, and
    it makes GO:0016758 hexosyltransferase the apter stop for WbpY, since D-rhamnose is 6-deoxy-D-mannose
    and the term covers both sugars the enzyme uses. Neither activity is separately annotated, since GOA
    carries no mannosyltransferase row for either gene; whether the D-mannose activity matters in vivo
    is now a suggested question on wbpY. The 1998 two-residue hypothesis also carries finding_review now,
    as DISPUTED rather than OVERTURNED, because the later work reports a failure to confirm rather than
    a refutation.


    Correction to the paragraph above, which said the sugar specificity was recorded on both reviews "in
    the description, the core function and the findings". That was true of wbpY and of two of the three
    places on wbpX: its core_functions description said nothing about sugar specificity. The claim sat
    immediately below the paragraph added to correct the previous instance of exactly this, which makes
    it the third time in this PR that the record of a fix was more complete than the fix, and the second
    time inside this file. wbpX''s core function now states it, and states the consequence the omission
    hid: GO:0016758 is a reluctant stop for WbpX, which transfers only D-rhamnose and which a D-rhamnosyltransferase
    term would describe exactly, where for WbpY the same term is apt because the enzyme really does transfer
    two hexoses. The claim in this record was verified against both files before being written this time.


    Round-7 non-blocking items, all taken. Each of the two new sugar-specificity findings stated two claims
    under one quote, where the quote for the second claim was already in use in the sibling review; each
    is split so every finding carries the quote for what it asserts. Verified afterwards: 7 findings on
    wbpX and 9 on wbpY, none without supporting_text. A 161-character line was re-introduced in the wbpX
    description at the edit immediately after the round-6 rewrap, which is the same splice-without-rewrap
    habit twice over; it is rewrapped, and the only over-long line left in either file is a machine-fetched
    reference title. wbpY''s core function was carrying annotation practice that belongs in the NEW row''s
    reason, so the GO:0016758-covers-both-sugars argument and the no-mannosyltransferase-row point moved
    there and the core function keeps the biology; the NEW row now also says the same term is apt on wbpY
    and reluctant on wbpX, which is the asymmetry the previous round exposed. In the script, a member
    whose only row on the shared term is NEW now joins the incomplete cases rather than entering the verdict
    comparison, like a member with no review file: a NEW row rules on nothing, so one such member would
    have read as divergence and a group of them as agreement on a claim nobody ruled on.


    Round-8 correction, and the third time the acceptor attribution has had to be fixed. The clause 4aff90e1
    added to separate the transfer assay from the linkage NMR separated them for WbpX and then swept WbpY''s
    result into the same breath, saying that on the benzyl acceptor WbpX forms both linkages whereas WbpY
    forms only alpha1-3. WbpY''s linkage NMR was run on the phenylundecyl-diphosphate acceptor, not the
    benzyl one, and the paper calls it a monofunctional alpha1,3-D-RhaT; the benzyl acceptor appears only
    in the WbpX experiment. The sentence written to stop two experiments being read as one did that very
    thing to a third. The same clause left the multi-residue point dangling off WbpY, which transfers
    a single residue, when it is WbpX that adds several, contradicting this review''s own finding a few
    lines above. The description now gives each enzyme''s result with the acceptor that produced it, the
    notes file carries the correction with its quotes, and all four facts were re-checked against the
    cache before this entry was written.


    Round-8 non-blocking items, all taken, two of them biology.


    The paper gives the two chain-extending enzymes different jobs, which both core functions had flattened
    to acting together: WbpY builds a short adapter or anchor on the WbpZ primer, and WbpX is the main
    polymerase, the latter because its broad acceptor specificity lets it work on substrates well away
    from the undecaprenyl-diphosphate carrier. Both core functions now say so.


    The paper also partly answers this review''s own question about the D-mannosyltransferase activity.
    CPA is reported to carry a small amount of D-mannose alongside other minor sugars, so the activity
    may well be used in vivo rather than being an artefact of D-rhamnose being 6-deoxy-D-mannose. Nothing
    ties this enzyme to those residues, so the question is sharpened rather than closed, and the core
    function says both that the minor sugar is present and that the connection is unmade.


    Two corrections to earlier entries in this record. The claim that the only over-long line left in
    either file is a machine-fetched reference title was about the file rather than about this PR''s edits,
    and was false on both readings: wbpX and wbpY each carry one pre-existing long line of prose, and
    the core-function edit in this round introduced another, since rewrapped. The accurate statement is
    that of the lines this PR adds or changes, the only one over 100 characters is the machine-fetched
    title. In the script, the incomplete printer had been labelling every uncomparable member ''unreviewed'',
    which discarded the distinction actions_for_term works to keep: a gene with no review file has not
    been looked at, while one whose only row is NEW has been reviewed and makes no ruling on this claim.
    The printer now names the reason per member.


    Round-9 corrections. Two items, and the first is the fourth instance of the same pattern.


    The D-mannose paragraph appended in the previous round was written once and appended to both records
    unchanged, but both of its claims are true only of wbpY: wbpY carries the question about whether the
    D-mannosyltransferase activity has an in vivo counterpart, and wbpY''s core function is where the
    minor sugar in CPA is recorded. wbpX has neither; its only suggested question asks what switches the
    enzyme between alpha1-2 and alpha1-3 linkages. The verification done last round covered the sugar-specificity
    claim across six cells and did not extend to the new paragraph written beside it, which is how a record
    shared between two genes came to describe one gene''s edit as the other''s.


    Second, the two new facts added last round -- the division of labour, and D-mannose being present
    in CPA -- were asserted in prose with no quote anywhere in either file, so the quote checker could
    not see them. Both now have findings entries with verbatim sentences, referenced from core_functions.supported_by;
    the quote count across the pair goes from 48 to 58. The division-of-labour sentence also fused two
    separate passages into one causal claim, saying WbpX is the main polymerase because its broad acceptor
    specificity frees it from the lipid carrier. The paper reaches the polymerase conclusion from the
    D-mannose argument and states the acceptor-proximity point separately. Both reviews now keep the two
    apart, and wbpX says explicitly that joining them is this review''s inference rather than the paper''s
    statement. The word ''short'' was also mine and is dropped; the paper says an adapter or anchor structure.


    For this gene specifically: wbpY is where the D-mannose question and the record of the minor sugar
    in CPA belong, and both are now backed by findings with verbatim quotes rather than by prose alone.


    Round-9 non-blocking items, all taken, and one is a functional point the reviews had reduced to a
    bare fact. The paper attributes the purity of the CPA polymer to WbpX using GDP-D-rhamnose alone,
    which turns WbpX''s sugar exclusivity from a specificity curiosity into a property of the product;
    wbpX''s core function and findings now say so. The paper also partly answers the D-mannose question
    itself: WbpY is judged unlikely to build a D-mannose polymer because its acceptor specificity is restricted,
    so any in vivo contribution would be single residues rather than stretches, which fits the minor sugar
    in CPA without showing WbpY is its source. The wbpY question is sharpened accordingly and both points
    carry verbatim quotes; the pair goes from 58 verified to 61. wbpX-notes.md reasoned from the superseded
    premise that no D-mannose appears in CPA at all, which its ''CPA repeat'' wording left literally true,
    and now carries the correction with the quotes. In the script, the incomplete bucket had been holding
    two different situations: a member with no review file is curation backlog, while a member whose only
    row is NEW has been reviewed and rules on nothing, so the group is complete with nothing to compare.
    They are separate buckets now, reported separately and counted separately.


    Round-10 correction. wbpY-notes.md was the one file of the pair this PR had never touched, and its
    2026-11-10 section, which declares that it supersedes the earlier notes, ended by saying that the
    MODIFY to GO:0016758 stands on the direct assays of PMID:35166992. This PR reversed exactly that:
    the review now carries no MODIFY, the three GO:0016757 rows are ACCEPT, and the assayed activity is
    a NEW GO:0016758 IDA row. A curator reading the notes was being told the opposite of what the review
    does, by the section that claims authority over the rest of the file. A dated section at the end now
    states the current encoding and the ruling behind it, and leaves the rest of the 2026-11-10 material
    standing.


    One tension is flagged rather than resolved there. That section records removing a source defect on
    GO:0016757 / PMID:9680202 because it was only a curation-improvement note rather than an identifiable
    error in the source record, while the review still carries a GO_CENTRAL defect asking that PTN005302544
    be re-seeded with the 2022 assays. That is arguably the same class of request aimed at a different
    resource. Whether it should stand under the same rule is a curator''s judgement, so it is named in
    the notes and left for a human rather than decided here.


    Round-10 non-blocking items. Two clauses of each gene''s core function rested on findings
    quotes that core_functions.supported_by did not anchor, so the quote checker verified them but
    nothing tied them to the sentences they support; both genes now carry those anchors. The audit
    script''s verdict tuple gained the negated flag, which round 1 had asked for alongside the
    replacement term and which only half shipped: a negated ACCEPT and a positive ACCEPT of the same
    term are the sharpest disagreement a shared claim can hold and compared equal until now. No
    current shared claim has a negated member -- thrH''s GO:0004413 row is the corpus''s only one -- so
    the output is unchanged, which is the point of adding it before a case appears rather than after.
    The project page documented two buckets where the script now has four; the incomplete/no-verdict
    split is the one a reader acts on, since the first is curation backlog and the second is a
    complete group with nothing to compare.


    For this gene specifically: the two anchors added are the main-polymerase sentence, which is a
    statement about the partner enzyme and is why wbpY is not itself the polymerase, and the narrow
    acceptor specificity sentence that confines WbpY to the lipid carrier.


    Correction to the dual-sugar paragraph above. Where it says "the notes file carries the contrast
    with its quotes", the notes file it meant was wbpX-notes.md, which is not what "the notes file" reads
    as in wbpY''s own record; wbpY-notes.md had no D-mannose material at all. That is now fixed at the
    source rather than only in the wording: wbpY-notes.md carries the contrast with its three quotes, and
    with the consequence the omission had been costing -- that GO:0016758 is the apt stop for this gene,
    since it covers both hexoses WbpY transfers, and the reluctant one for wbpX. The same section also
    adds the authors'' processivity hedge, which was the last unhedged occurrence across the four files,
    and splits the three claims the 2022-biochemistry bullet had been making under one quote that reached
    only the first.


    Round-12 non-blocking items. The finding that WbpX and WbpY each add a single residue is now
    qualified to the WbpZ-product acceptor, with Table 3''s contrast: given the isolated WbpY product
    instead, WbpX adds four in sequence, so the limit is the acceptor rather than the enzyme. A ragged
    stub left by an earlier rewrap in the core function is rewrapped.'
