    acceptor at all, which is why the authors call it a monofunctional alpha1,3-D-RhaT. So the limit is
    the acceptor for WbpX and the enzyme for WbpY, and that asymmetry is precisely the result behind the
    adapter-versus-polymerase reading both reviews state. The hedge is replaced by two findings carrying
    the paper''s own sentences, and wbpY-notes.md records the swap with its four quotes.


