    Round-8 correction, and the third time the acceptor attribution has had to be fixed. The clause 4aff90e1
    added to separate the transfer assay from the linkage NMR separated them for WbpX and then swept WbpY''s
    result into the same breath, saying that on the benzyl acceptor WbpX forms both linkages whereas WbpY
    forms only alpha1-3. WbpY''s linkage NMR was run on the phenylundecyl-diphosphate acceptor, not the
