- type: REVIEW
  outcome: changed
  summary: Review pvdL, completing its PseudoCAP molecular-function shared claim
  details: |
    The 4342-residue initiating NRPS of pyoverdine biosynthesis, and the last unreviewed member
    of the GO:0003824 claim from PMID:19854904; pvdJ is merged and MODIFYs that term to
    GO:1904091.

    Resolved in line with the merged siblings pvdJ and pvdD throughout: GO:0003824 catalytic
    activity MODIFY to GO:1904091 non-ribosomal peptide synthetase activity on all four rows;
    GO:0002049 pyoverdine biosynthetic process ACCEPT on all four; GO:0031177 phosphopantetheine
    binding ACCEPT; GO:0044550 secondary metabolite biosynthetic process TOO_GENERAL (GO:0002049
    is a descendant via secondary metabolic process, verified in OLS); and the obsolete
    GO:0043041 MODIFY to GO:0002049, which is how pvdD and pvdJ both handled it and which points
    at a term this gene already carries and accepts.

    The MODIFY to GO:1904091 has this gene's own direct evidence, which is what the 2026-11-14
    ruling requires: PMID:12354233 names PvdL by locus tag as an NRPS necessary for pyoverdine
    production and describes an N-terminal acyl ligase module followed by three amino-acid
    activation domains, matching the record's condensation, three TIGR01733 adenylation and
    carrier domains; and PMID:21892836 shows directly that the initial module adds myristate to
    the pyoverdine precursor. So unlike most tier-3 rows these molecular-function rows are not
    phenotype-only - two are IDA.

    PMID:21892836 is worth noting as a worked example of the project's warning about titles: it
    is titled for PvdQ but reports a direct biochemical result on PvdL, which is why the IDA row
    should not be doubted on title evidence.

    Two rows are specific to pvdL, both from the FAAL domain and both resting only on ARBA
    association rules. GO:0008610 lipid biosynthetic process is MARK_AS_OVER_ANNOTATED: PvdL
    does handle a fatty acyl group, but the myristate comes from the cell's pool, goes onto a
    peptide siderophore and is cut off again by PvdQ, so it is a temporary handle rather than a
    product - not false, hence marked rather than removed. GO:0071766 Actinobacterium-type cell
    wall biogenesis is REMOVEd with a WRONG_TERM / OVER_PROPAGATION defect at CONFIRMED:
    P. aeruginosa is a Pseudomonadota with no arabinogalactan-mycolate cell wall, so the process
    does not occur in this organism and no evidence about the protein could make the term true.
    That taxon argument is what separates it from the lipid row, where the chemistry at least
    exists. The route is almost certainly the FAAL domain shared with mycobacterial enzymes, so
    the rule should carry a taxonomic restriction.

    Found late and changing two rows: PMID:19854904 is not a P. aeruginosa paper. It is Taguchi
    et al. 2010 on Pseudomonas syringae pv. tabaci 6605, and all its mutants are in that
    organism, so it cannot be IMP evidence for the PAO1 gene. The GO:0002049 and GO:0003824 IMP
    rows citing it are KEPT - the claims are established several times over by the
    P. aeruginosa papers, and a true claim should not be lost over a coding error - with a
    WRONG_EVIDENCE_CODE defect, IMP to ISS, requested_change CHECK. The merged pvdJ review
    reached exactly this conclusion on exactly this reference and filed the same request, its
    explanation naming the delta pvdL mutants, so this is a consistent treatment of a shared
    claim and the defect asks that both genes be handled together. One defect is recorded, on
    the GO:0002049 row, naming both rows that cite the paper.

    PMID:12686626 is left UNVERIFIED rather than faulted: it is the right organism and pathway
    but its cached abstract does not name pvdL, so there is nothing to confirm and nothing to
    fault.

    Two errors of mine, caught before commit: a duplicated reference_section_type key, and a
    paraphrased title for PMID:12354233 that the reference validator rejected.

    Batch context: this gene is one of the nine-gene PseudoCAP tier-3 batch, and one of five that
    were each the LAST unreviewed member of a molecular-function shared claim whose other members
    are already merged. Reviewing them gene by gene was therefore sound - each closes a group
    rather than opening one - provided each was read against its merged siblings first, which is
    what the house-style comparisons recorded above are.

    The worklist's review_folder fields are NOT updated here. build_pseudocap_mf_worklist.py
    derives them by scanning for any *-ai-review.yaml on disk, so regenerating mid-batch would
    have marked the then-unreviewed stubs as done. Now that all nine of the batch are reviewed
    the worklist can be regenerated, which is also what the shared-claim audit script needs
    before it will report these groups as complete.
- type: EDIT
  outcome: changed
  sections:
  - description
  summary: 'PR review round 2: the description asserted a mechanism its own knowledge gap denies'
  details: |
    The description said the fatty acyl group "keeps the precursor membrane-associated during
    assembly", while the review's own knowledge gap says that whether the myristate "anchors the
    precursor to the membrane, enforces the order of assembly, or prevents premature iron binding
    has not been established", and PMID:21892836 shows only that the first module adds it.
    Reduced to what is established: the acyl group is a temporary feature of the precursor,
    removed late in maturation by PvdQ. Why the pathway needs it at all stays in knowledge_gaps.

    This is the same defect as the dhcR and pvdO core functions in batches 7 and 6 - a synthesis
    stating as settled the very thing its own gap entry records as open - which makes three
    instances across three batches and confirms it as a habit in drafting rather than a slip.
