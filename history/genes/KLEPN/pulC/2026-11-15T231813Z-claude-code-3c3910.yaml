  summary: 'Create gene review: pulC, the Klebsiella GspC connector'
  details: |
    New review of Klebsiella P15643 as the Pul exemplar of the GspC envelope connector for modules/bacterial_type_ii_secretion.yaml. All three GOA rows are electronic but the primary evidence is strong (inner-membrane fractionation and a secretion requirement, signal-anchor-mediated membrane association, co-immunoprecipitation with PulM, PulL and PulE, and resolution of PulC in the assembled machine at 2:1:1:1:1 stoichiometry with its HR domain on the secretin base), so all three are accepted on that evidence and the absence of experimental annotations is raised as a question. The outer-membrane fractionation is read as a periplasm-spanning bridge, not residence.
