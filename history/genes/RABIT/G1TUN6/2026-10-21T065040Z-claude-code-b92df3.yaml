  summary: Full re-review of rabbit UBE2L6 (G1TUN6), independent of ProtNLM2
  details: |
    Full re-review grounded in orthology (CTD 9246, Ensembl Compara, 79.7% full-length identity to human UBE2L6 vs 52% to UBE2L3, Cys86 conserved) and PAINT node PTN000631065 (Mammalia: ISG15 transferase activity, ISG15-protein conjugation). Changes: ubiquitin conjugating enzyme activity KEEP_AS_NON_CORE->ACCEPT (Ub E2 activity shown for UbcH8 in PMID:15131269), added as second core function; ubiquitin-like protein transferase activity ACCEPT->MODIFY to GO:0042296+GO:0061631; innate immune response KEEP_AS_NON_CORE->MARK_AS_OVER_ANNOTATED (donor IDA PMID:28724761 reports UBE2L6 loss had no effect; PAINT did not propagate the term); ATP binding and ligase activity remain REMOVE with ARBA-only UniProt quotes replaced by literature; description rewritten; deep-research file kept but no longer used as support. Added bioinformatics comparison (G1TUN6-bioinformatics/) and notes file.
