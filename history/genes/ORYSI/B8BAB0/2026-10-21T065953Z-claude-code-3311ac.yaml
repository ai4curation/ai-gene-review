  summary: 'Full re-review: B8BAB0 (indica OsBURP12 gene model)'
  details: |
    Full re-review independent of ProtNLM2 predictions. Identified B8BAB0 as the indica gene model of OsBURP12 (Q6ZA27, 95.6% identity) with a ~31 aa propeptide deletion and a divergent C-terminal tail lacking the fourth BURP CH motif. Placed it in the PANTHER 19 tree: nearest paralog OsBURP16 (grass duplication PTN000779097); the family's PAINT IBD (PTN004827911, cell wall terms) is restricted to Brassicaceae SF10, so no cell wall/MF/BP transfer. Removed unsupported core-function MF (enzyme regulator activity) and BP (cell wall organization); replaced non-verbatim quotes; added primary references (PMID:24237159, 19363683, 32005373, 1392611, 26106400) and a NEW ISM extracellular region annotation from the signal peptide. New analyses in B8BAB0-bioinformatics/ (*_rereview.py, RESULTS-rereview.md); new notes file.
