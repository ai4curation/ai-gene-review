  summary: Narrow the CrtB localization knowledge gap with an OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on whether CrtB docks on the membrane via amphipathic helices. Refuted: no amphipathic helix (max muH 0.45); the apolar patch is the buried substrate channel; there is no basic cluster; and the membrane modules of other family members are absent. A soluble cytoplasmic enzyme is favoured. Gap OPEN -> NARROWING.
