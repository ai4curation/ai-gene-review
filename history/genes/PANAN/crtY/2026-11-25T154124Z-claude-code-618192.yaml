  summary: Record OpenScientist amphipathic-face candidate for CrtY and refutation
    of the basic-patch mechanism
  details: |
    Ran an OpenScientist deep-research job (kgap-crty-membrane-docking) on the knowledge gap covering how CrtY associates with the membrane. The gap stays OPEN, now with a named candidate, a refuted mechanism and an explicit finding that the structural method is uninformative.

    The candidate is a bipartite amphipathic face formed by helix 311-321, QGFFRMLNRML, and helix 331-338, WRVMQRFY, both sequences confirmed in the local P21687 record. They carry the highest hydrophobic moments in the protein, hold their amphipathicity under selection across 200 bacterial lycopene cyclases far above a windowed background, beat the protein's own exposed control helix in a paired within-protein test, lose the signal in the fused plant and fungal enzymes that carry their own transmembrane segments, and donate Tyr338 and Tyr349 to the wall of the single enclosed cavity holding the catalytic Glu199. All four residues were confirmed locally. Buried-core control positions show no such signal, so the conservation is specific to the exposed face rather than an alignment artefact.

    The mechanism my hypothesis proposed is refuted. There is no basic patch above 173 square Angstrom anywhere on the surface; the largest charged patches are each two or three residues and the three largest sit well outside the fitted membrane plane, so an anionic-headgroup-reading mechanism of the PH or C2 kind is excluded. The eight interfacial basic residues, all confirmed in the local record, are spread along the C-terminal region rather than clustered, which is the geometry of snorkelling residues setting insertion depth.

    The structural half returns no usable answer, and the negative control I asked for is what demonstrates it. An implicit-membrane docking scan over 27,006 poses gives a best energy that, normalised per unit surface, falls between a monotopic cyclooxygenase and a soluble glutathione reductase, so it does not discriminate. The best pose is driven by a segment the model places with low confidence, and deleting that segment moves the pose to an unrelated face. CrtY also fails the aromatic-penetration test separating monotopic enzymes from soluble flavoproteins, though the run notes two controls that stop this being a refutation since one membrane-binding enzyme inserts no aromatic at all.

    The run's plain statement is recorded in the boundary: the model cannot distinguish a genuine membrane-binding element from an ordinary hydrophobic surface and does not even give a stable answer about which surface to consider, so the positive case rests entirely on the two lines that never use the fitted membrane. It also names the competing reading to exclude, that the conserved face is an oligomer interface, and the experiment that would separate them.

    The hydrophobic-moment statistics, ortholog comparisons, predicted-aligned-error values, docking scan, patch areas and penetration measurements were not independently recomputed. No annotation action was taken.
