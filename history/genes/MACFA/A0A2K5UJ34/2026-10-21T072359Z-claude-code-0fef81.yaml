  summary: Full re-review of A0A2K5UJ34 (macaque TTC39C), independent of ProtNLM2
  details: |
    Full re-review independent of ProtNLM2 predictions. Established identity: A0A2K5UJ34 is macaque TTC39C, an N-terminally truncated gene model equal to human TTC39C residues 39-583 (99.6% identity; new bioinformatics/RESULTS-rereview.md). Grounded on PANTHER SF1 and PAINT IBD nodes PTN001275223 (cilium assembly, Eumetazoa) and PTN002840059 (otolith morphogenesis), both seeded by zebrafish ttc39c. Re-fetched PMID:25860617 with full text. Otolith morphogenesis changed from MARK_AS_OVER_ANNOTATED to REMOVE (downstream morphant phenotype; primates lack otoliths). Cilium assembly kept as ACCEPT with full-text support. Core function dropped unsupported adaptor MF and cilium location (worm Pir et al. data not tied to SF1); description rewritten without TTC39B and worm-derived claims. Added notes file, references, suggested questions and experiments.
