  summary: 'Create review: A7RHZ4'
  details: |
    Reviewed all 5 IEA annotations for Nematostella vectensis MyD88 (A7RHZ4, an N-terminally truncated TrEMBL fragment with death and TIR domains). No experimental study of the Nematostella MyD88 protein exists; judgments rest on domain architecture, the single Nematostella TLR whose TIR binds human MYD88 and activates NEMO-dependent NF-kappaB in human cells (PMID:29109290), cnidarian gene surveys (PMID:17437634, PMID:27806695) and Hydra MyD88 knockdown (PMID:23112184). Accepted all five: TIR domain binding (core MF), MyD88-dependent toll-like receptor signaling pathway, positive regulation of canonical NF-kappaB signal transduction (with caveat; Nematostella has separate NF-kappaB and IkappaB proteins), signal transduction and cytoplasm. Explicitly did not transfer ligand-specific numbered TLR pathway terms or IL-1-mediated signalling. No NEW annotations. No deep research was queued for this gene. just validate passes with no warnings.
