  summary: 'Create review: NEIM8 cas9 (NmeCas9, C9X1G5)'
  details: |
    Completed the seeded review of Neisseria meningitidis 8013 cas9 (C9X1G5) as the type II-C exemplar for MODULE:crispr_cas_adaptive_immunity and the AcrIIC1 target, and wrote cas9-notes.md as the research journal (no deep-research provider available in this environment).

    All 5 seeded PENDING rows resolved: 4 MODIFY (GO:0003676 -> GO:0003723; GO:0004519 -> GO:0004520; GO:0046872 -> GO:0000287; GO:0051607 -> GO:0099048) and 1 ACCEPT (GO:0043571). Two NEW rows added (GO:0003690, GO:0005737). The substantive call is GO:0051607 defense response to virus: in this strain the only demonstrated interference substrate is DNA entering by natural transformation (plasmid and neisserial genomic DNA, PMID:23706818), with no viral or prophage target reported, so the UniRule transfer over-specifies the substrate and is refined to GO:0099048 CRISPR-cas system, which sits under clearance of foreign intracellular nucleic acids. This is an argument against an electronic inference, not against any experimental curator call. GO:0043571 is accepted on the crRNA-biogenesis limb only; the spacer-capture limb that carries the term in S. pyogenes is deliberately not claimed, because this locus lacks csn2, cas1/cas2 are dispensable for interference here, and adaptation has never been assayed in strain 8013.

    Three core functions: guide-directed recognition (proposed_molecular_function, no GO term), GO:0004520 cleavage, GO:0003723 guide stabilisation. Carries the same proposed new term as the type II-A exemplar, 'guide RNA-directed nucleic acid target recognition activity'. Type II-A results were not transferred: PAM class, size, locus content and anti-CRISPR target set are all stated from this organism's own literature. Direct structural evidence for this protein (PMID:31668930) supplies the sgRNA and dsDNA binding, the HNH-pocket Mg2+ ion, and the HNH-to-RuvC allosteric coupling that argues for modelling the dual-nuclease architecture as one function plus prose. Genome-editing use deliberately excluded.

    Validation: 'ai-gene-review validate --verbose --strict --terms' passes with no errors or warnings. Fetched PMID:23706818 and PMID:31668930 into the publication cache. Not committed or pushed.
