  summary: Retire duplicate OCBIM_22006518mg folder; canonical review is OCTBM/CRT1
  details: |
    genes/OCTBM/OCBIM_22006518mg and genes/OCTBM/CRT1 both reviewed the same protein, UniProt A0A0L8FVQ9 (CRT1_OCTBM, Chemotactile Receptor for Terpenes 1; ORF name OCBIM_22006518mg). Both were created in the CEPHALOPOD batch (#335/#351) from byte-identical uniprot, goa and openai deep-research files. A structural diff of the two reviews showed identical existing_annotations (10 rows, same actions), identical core_functions, and identical questions and experiments; the only differences are in CRT1, which additionally cites the CRT1 cryo-EM structure (PDB:8EIS) as a reference and supporting text. The ORF-named folder therefore held no unique content and was deleted; CRT1 (the UniProt-recommended name, and the symbol already used by both reviews' gene_symbol and by projects/CEPHALOPOD.md) is the canonical folder. No hand-authored page (projects/*.md, modules/, gocams/index.tsv) referenced the retired folder.
