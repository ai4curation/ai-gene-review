  details: |
    Review follow-up on PR 5632, carried-over observation B. The GO:0009375 MODIFY summary asserted that the term sits under intracellular protein-containing complex, a claim the source defect's explanation leans on but which was unverified. The GO ancestor closure over is_a and part_of for GO:0009375 returns GO:1902494, GO:0140535, GO:1990204, GO:0032991 and GO:0005575, so GO:0140535 intracellular protein-containing complex is indeed an ancestor; the summary now names that id and says the closure was checked, so the claim is traceable before the defect reaches InterPro. No action or term changed. Observation C concerns the PR description's wording (it calls the GO:0016020 row an over-propagated IBA where the row is IEA/GO_REF:0000118); the YAML is correct and nothing in the repository needed changing.
