  summary: Audit 3 ProtNLM prediction assessments against source-independence guidelines
  details: |
    Audited genes/CANLF/A0A8I3PI07/A0A8I3PI07-protnlm-predictions-review.yaml against the source-independence and final-state prose guidelines in .claude/skills/review-function-prediction/SKILL.md.

    Replaced rationale prose with the current assessment, traced biological claims to sequence/domain records, primary publications, and where relevant experimentally grounded curated annotations or reproducible analysis. Removed AI/OpenScientist verdicts as supporting evidence and unsupported error-mechanism claims. Source prediction terms and method/version metadata were preserved. Existing annotation overlap is separated from biological correctness and is not evidence of training-data contamination.

    GO:0005886 (plasma membrane): LSP -> LSP. The target is assigned to the CNNM4 subfamily and contains the CNNM transmembrane region and CBS domain. Mouse CNNM4 experiments show basolateral localization in transporting epithelia (PMID:24339795), supporting the conserved membrane localization inference for the canine protein. Plasma membrane is already annotated, and basolateral plasma membrane is an existing, more specific localization. The prediction is supported but less precise.

    GO:0022857 (transmembrane transporter activity): LSP -> LSP. The CNNM4 subfamily and membrane-spanning architecture support ion transport rather than an arbitrary membrane role. Mouse CNNM4 expression and knockout experiments establish a role in magnesium extrusion and epithelial magnesium transport (PMID:24339795). The target already has curated IBA magnesium ion transmembrane transporter activity, which is more specific than the predicted generic transmembrane transporter activity. The broad prediction is supported without resolving the detailed transport mechanism.

    GO:0006811 (monoatomic ion transport): LSP -> LSP. CNNM4-dependent magnesium transport is supported by mouse epithelial experiments (PMID:24339795) and by the target CNNM4 subfamily and membrane architecture. The target has a curated IBA annotation for magnesium ion transport. Ion transport is a broader process that discards the established ion specificity. The prediction is therefore supported but less precise.

    Validation: all 50 PredictionReview documents passed LinkML schema validation; all 77 predictions preserve their original source/term metadata and have category-consistent scores. Checked local evidence paths, cached PMID titles, and all 31 supporting excerpts against their sources. Substantive fields contain current reasoning; revision details are recorded here.
