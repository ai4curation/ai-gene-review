  summary: Resolve GO:0005737 cytoplasm to KEEP_AS_NON_CORE
  details: |
    Re-examined the one remaining UNDECIDED row. The compartment claim is sound, because SepL is a soluble HAD-superfamily phosphatase acting on an intracellular heptose bisphosphate in a cytoplasmic route, and the new PTHR42891 family review assesses the equivalent cytosol node SOUND on an E. coli GmhB experimental seed. Changed UNDECIDED to KEEP_AS_NON_CORE rather than ACCEPT, because the location is peripheral to the phosphatase function this review centres on. Deliberately not refined to cytosol, since no evidence distinguishes cytosol from other cytoplasmic locations in Streptomyces. The record's own ARBA support is an unvetted prediction and is not cited as evidence; the judgement rests on solubility, substrate compartment and the family-level assessment. just validate clean.
