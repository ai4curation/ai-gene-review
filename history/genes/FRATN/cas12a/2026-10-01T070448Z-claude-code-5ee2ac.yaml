  summary: 'Create review: FnCas12a/Cpf1 (A0Q7Q2), type V-A CRISPR effector'
  details: |
    Completed review from seeded stub. Both GOA GO:0004530 rows (EXP from PMID:28431230; IEA from EC:3.1.21.1) MODIFY -> GO:1990238 double-stranded DNA endonuclease activity, same reasoning as the Acidaminococcus ortholog; the EXP experiment is upheld, only the term is replaced. Two NEW rows: GO:0004521 RNA endonuclease activity (IDA, PMID:27096362, the EC 4.6.1.22 pre-crRNA processing activity missing from GOA) and GO:0099048 CRISPR-cas system (IMP, PMID:26422227 plasmid interference). GO:0051607 deliberately NOT asserted: no phage-challenge data for this ortholog. trans-ssDNase deliberately NOT asserted: PMID:29449511 is abstract-only and does not name FnCas12a. Two core_functions. One proposed new term (shared with the other three reviews). Recorded the literature conflict on one vs two nuclease active sites (PMID:27114038 vs PMID:28431230) as a finding_review DISPUTED. Notes file written in place of deep research (no provider API keys available).
