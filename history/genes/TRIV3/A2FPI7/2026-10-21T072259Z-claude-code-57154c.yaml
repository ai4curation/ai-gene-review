  summary: Full re-review of A2FPI7 independent of ProtNLM2 predictions
  details: |
    GOA has no annotations. Kept DNA binding (GO:0003677) as a NEW domain-level proposal, now supported by Iyer et al. 2002 (PMID:11897024) and a new family-context analysis (A2FPI7-bioinformatics/RESULTS.md: PTHR48135 is a phage/bacterial KilA-N lineage with 1308 of 1667 members in T. vaginalis; no characterised member; no pairwise similarity to Mbp1 APSES). Withdrew the nucleus (GO:0005634) NEW proposal and its core_functions location as an unsupported second-order inference. Rewrote the description to drop transcription-regulator framing and curation commentary, removed ProtNLM2 as evidence, corrected the genome-paper finding (LGT from bacteria) and quote attributions to the falcon artifact, added PMID:11897024 and PMID:31600629, created the notes file.
