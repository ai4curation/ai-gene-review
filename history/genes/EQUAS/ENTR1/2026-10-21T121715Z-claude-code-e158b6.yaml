  summary: Full re-review of donkey ENTR1 (DONKEY40), independent of ProtNLM2
  details: |
    Re-examined all 8 TreeGrafter rows (actions unchanged: 2 ACCEPT endosome terms, 6 KEEP_AS_NON_CORE cytokinesis/centrosome/cilium terms) with reasons now tied to the human PAINT nodes PTN002039065/PTN004793274. Withdrew the previously proposed NEW GO:0032456 endocytic recycling and its core-function process: PAINT curators propagated every other human ENTR1 term but not this 2014 IMP at either PAINT pass, and the human evidence is modest, cargo-selective RNAi data; recycling role kept in prose and raised as a suggested question. Added PMID:23108400 and PMID:24980502. New analysis (panther_subfamily_rereview.py, RESULTS-rereview.md) shows donkey in PTHR31259:SF3 and human ENTR1 in hominid-only SF6, an HMM split within one orthologous lineage. Accession confirmed as an N-terminally incomplete gene model lacking human residues 9-85. Deep research (falcon, perplexity-lite) failed on auth/quota.
