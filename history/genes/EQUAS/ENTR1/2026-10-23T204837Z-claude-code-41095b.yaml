- type: REVIEW
  outcome: no_change
  summary: ProtNLM2 prediction rescoring
  details: |
    Rescored both ProtNLM2 predictions against the re-reviewed donkey and human ENTR1 gene reviews and a PubMed search (ENTR1/SDCCAG3 with retromer or recycling; no new recycling evidence found). GO:0032456 endocytic recycling stays COR (2), resting on orthology transfer of human IMP evidence (PMID:25278552); the donkey review does not carry the term, because PAINT did not propagate it, and the term is absent from donkey GOA. The rationale now states correctly that donkey (PTHR31259:SF3) and human (SF6) are in different PANTHER subfamilies within one orthologous lineage, replacing the erroneous claim that they share a subfamily, and adds the GLUT1 quote and the Fas sorting caveat (PMID:31308371). GO:0030904 retromer complex stays UNC (1), now citing the WASH-mediated indirect association (PMID:24980502) and the human review's colocalizes_with-only acceptance. Counts before and after: COR 1, UNC 1.
