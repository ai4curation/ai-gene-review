  summary: 'Full re-review: GEMIN7 (donkey A0A9L0ICL9), independent of ProtNLM2'
  details: |
    Full re-review independent of ProtNLM2 predictions (DONKEY40 cohort). Identified A0A9L0ICL9 as a 206-aa N-terminally extended alternative transcript product of Ensembl gene ENSEASG00005033816; residues 76-206 equal the canonical-length 131-aa donkey product A0A9L0J5X5 (new reproducible analysis compare_gene_models_rereview.py / RESULTS-rereview.md). Grounded transfers in PANTHER PTHR14679:SF1 and the PAINT node (donors human Q9H840, S. pombe Gem7). Changed GO:0120114 Sm-like protein family complex from ACCEPT to MODIFY -> GO:0034719 SMN-Sm protein complex; removed the prior NEW GO:0032797 SMN complex row (descendant of an already-carried term; not propagated by PAINT), raised as a suggested question; core_functions in_complex now GO:0034719. Added PMID:33754639 (S. pombe SMN complex) as evidence for conservation. Deep research (falcon, perplexity-lite fallback) failed on auth/quota; recorded in notes.
