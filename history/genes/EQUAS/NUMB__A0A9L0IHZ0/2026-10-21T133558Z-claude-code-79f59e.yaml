  summary: 'Create review: donkey NUMB canonical A0A9L0IHZ0'
  details: |
    De-novo review of the canonical 652-aa donkey NUMB product (folder NUMB__A0A9L0IHZ0, because genes/EQUAS/NUMB holds isoform A0A9L0IQ95), done independently of ProtNLM2 predictions. Falcon deep research failed (authentication error); review used cached human/mouse literature and UniProt. Orthology established by PANTHER subfamily PTHR47368:SF5 shared with human P49757 and mouse Q9QZS3, plus a reproducible global alignment (96.9% identity to human, Thr-102 AAK1 site conserved). All 18 electronic rows reviewed: locations and cadherin binding accepted; catenin binding, neurogenesis, migration, synaptic and apical rows kept as non-core; lateral ventricle development and neuroblast division in SVZ marked over-annotated (postnatal cDKO tissue phenotype; source paper reports neuroblast survival, not division). Added NEW regulation of clathrin-dependent endocytosis (ISS from human PMID:18657069), noting PAINT did not propagate it. No donkey experimental data exist; all functions are ortholog inferences.
