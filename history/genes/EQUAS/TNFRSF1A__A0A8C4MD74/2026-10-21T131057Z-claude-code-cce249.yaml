  summary: 'Create review: donkey TNFRSF1A canonical product A0A8C4MD74'
  details: |
    New review of the canonical donkey TNFRSF1A product (Ensembl canonical transcript ENSEAST00005025834), the closest characterised relative of the ProtNLM2 benchmark entry A0A9L0JKX4 (exon-3-skipped model of the same gene), written independently of ProtNLM2 output. Fetched data, added a sequence comparison with human P19438 (76% identity, 24/24 ectodomain cysteines, intact CRD1-4, TM and death domain), and grounded functions on PANTHER PTHR46861:SF1 and PAINT node PTN002930098. All 35 IEA rows reviewed: core receptor, TNF binding, TNF signalling, NF-kappaB, inflammatory response and membrane locations accepted; general terms modified to specific ones; mouse knockout phenotypes and ARBA high-level terms marked over-annotated. Falcon and perplexity-lite deep research both failed (auth/quota); recorded in notes. All functions are inferred by orthology; none is experimentally established in donkey.
