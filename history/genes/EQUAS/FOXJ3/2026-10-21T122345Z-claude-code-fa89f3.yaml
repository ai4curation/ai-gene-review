  summary: 'Full re-review: donkey FOXJ3 (A0A9L0JKH1), independent of ProtNLM2'
  details: |
    Full re-review for the DONKEY40 cohort, independent of ProtNLM2 output. Established that A0A9L0JKH1 (580 aa) is an internal-deletion alternative transcript of Ensembl gene ENSEASG00005001210, identical to the 623-aa model A0A8C4PFN5 except for missing residues 211-253, with an intact fork-head domain (new RESULTS-rereview.md, compare_gene_models_rereview.py). All donkey models, human Q9UPW0 and mouse Q8BUR3 are in PTHR46078:SF3, grounding transfer. Cached and cited primary literature (PMID:19914232 mouse Mef2c ChIP/reporter/Gal4; PMID:40522413 Xenopus repression; PMID:27739607, PMID:37939221, PMID:41803108, PMID:15366017 for context). All 8 IEA actions unchanged (4 ACCEPT, 4 TOO_GENERAL) but now supported by the primary experiment; sign-neutral TF and process terms retained because orthologs act as activator and repressor. Rewrote description to be standalone and record isoform identity. Falcon deep research failed (403 auth), recorded in notes.
