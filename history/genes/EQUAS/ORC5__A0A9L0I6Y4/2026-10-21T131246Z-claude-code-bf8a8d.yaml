  details: |
    De-novo review of the canonical 435-aa donkey ORC5 product, independent of ProtNLM2 predictions. Grounded by PTHR12705:SF0 membership shared with human ORC5 and a new sequence/motif comparison (Walker A, DKAE Walker B, H398 conserved). Six IEA rows reviewed: two MODIFY to more specific terms already carried (GO:0005664, GO:0006270), four ACCEPT; NEW ATP binding from human structural and mutational evidence. Deep research failed (falcon auth, perplexity quota), so cached human ORC literature was used. All functions are inferred from human; none is experimental in donkey.
