    GO:0006511 ubiquitin-dependent protein catabolic process: UNC (1) -> NPI (0, FREQUENCY_BIAS). The term is in donkey GOA only via a family-wide UniRule that the re-reviewed gene review marks over-annotated; USP36 (PTHR24006:SF653, catalytic Cys/His conserved) deubiquitinates and stabilizes nucleophosmin, fibrillarin and c-Myc against proteasomal degradation (PMID:19208757, PMID:25775507), and a PubMed search found no report of it acting in a catabolic step. Added PMID:25775507 as support.
