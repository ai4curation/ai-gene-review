  summary: Full re-review of donkey RBM41 (A0A9L0IK51), independent of ProtNLM2 predictions,
    grounded on the human SF2 ortholog's experimental data (PMID:38499487)
  details: |
    Cached and used Norppa et al. 2024 (PMID:38499487), the first functional study of RBM41, from the human ortholog in the same PANTHER subfamily (PTHR16105:SF2). Re-supported ACCEPTs on U12 snRNA binding, U12-type spliceosomal complex and mRNA splicing via spliceosome with direct evidence, replacing paralog-only (RNPC3) InterPro text. Kept pre-mRNA intronic binding UNDECIDED (no direct intron contact shown) and nucleic acid/RNA binding as TOO_GENERAL. Added three NEW ISO rows: U6atac snRNA binding, U12 snRNP and Cajal body. Rewrote the description and core function: post-catalytic minor spliceosome role, distinct from 65K. Falcon deep research failed on authentication; this is recorded in the notes.
