  details: |
    Replaced 69 supporting_text citations of an ortholog GO-annotation listing (annotations cited as their own evidence) with quotes from donor publications, human UniProt, the PTHR23103 family review and the donkey UniProt PANTHER SF7 line. Read the donor abstracts behind the Ensembl Compara transfers: most process rows come from Alzheimer-model studies of overexpressed mutant APP or applied amyloid-beta. Changed learning or memory, learning, neuron projection maintenance (was ACCEPT), positive regulation of LTP, positive regulation of glycolysis, microglia development, positive regulation of T cell migration and negative regulation of cell population proliferation to MARK_AS_OVER_ANNOTATED; nuclear envelope lumen to UNDECIDED; dendritic spine and dendritic shaft from ACCEPT to KEEP_AS_NON_CORE. Description and core functions now state PANTHER SF7 placement and PAINT-node grounding. Falcon deep research failed (authentication) and is recorded in the notes.
