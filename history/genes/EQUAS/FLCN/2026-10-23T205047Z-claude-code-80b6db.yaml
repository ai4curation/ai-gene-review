- type: REVIEW
  outcome: changed
  summary: ProtNLM2 prediction rescoring
  details: |
    Rescored 5 ProtNLM2 predictions for A0A8C4MM62 against the re-reviewed donkey and human FLCN reviews plus PubMed. GO:0001701 in utero embryonic development COR(2) -> NPI(0): knockout lethality shows necessity not participation; human FLCN review marks it over-annotated on these grounds. GO:0007043 cell-cell junction assembly UNC(1) -> NPI(0): sole evidence is a knockdown junction-defect phenotype (PMID:22965878, now cited); human review marks it over-annotated. GO:0007179 TGF-beta receptor signaling pathway stays UNC(1); GO-line quote replaced with primary evidence PMID:21258407 and PMID:20573232 (regulation only, indirect). GO:0001934 positive regulation of protein phosphorylation stays UNC(1); added PMID:35358174 (FLCN loss abolishes TFE3 phosphorylation), noted GO:1904263 already carried and not a descendant (OLS4), and comparator check (FLCN/FNIP1/RRAGC/RRAGD lack the term). GO:0004857 enzyme inhibitor activity stays COR(2); dropped DR GO-line quote, noted more specific GO:0160193.
