  summary: 'Full re-review: donkey SLC16A11 (A0A9L0JV53), independent of ProtNLM2'
  details: |
    Full re-review for the DONKEY40 ProtNLM2 cohort, independent of the predictions. New analysis compare_gene_models_rereview.py / RESULTS-rereview.md shows the five donkey SLC16A11 UniProt entries are transcripts of one Ensembl gene (ENSEASG00005017919); A0A9L0JV53 is an alternative transcript model lacking TM1-TM3 whose C-terminal 332 residues match the full-length model A0A8C4PS96 exactly. Removed the NEW GO:0050833 pyruvate transporter row: PAINT did not propagate it from the human IDA, mouse MCT11 transports lactate (PMID:39516648), and one quote was a DR GO restating line. Core MF is now GO:0008028. Moved support from the human UniProt record to cached primary papers (PMID:24390345, PMID:28666119) and added reference reviews for the disputed T2D-mechanism papers. GOA row actions are unchanged (4 ACCEPT, 2 TOO_GENERAL). Falcon deep research failed to authenticate; recorded in notes.
