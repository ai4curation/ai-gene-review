  summary: 'Create review: donkey SLC16A11 (A0A8C4PS96), full-length MCT11 transcript
    model'
  details: |
    New folder for the full-length donkey SLC16A11 transcript model (A0A8C4PS96), the canonical-gene relative of ProtNLM2 benchmark entry A0A9L0JV53 and reviewed independently of the ProtNLM2 predictions. Falcon and perplexity-lite deep research both failed (auth/quota), so the review uses the cached full-text human papers PMID:24390345 and PMID:28666119. A new alignment (bioinformatics/align_to_human.py, RESULTS.md) shows all 447 human MCT11 residues align at 90.6% identity, with a probable 73-residue gene-model N-terminal extension. Transfer is grounded in the shared PANTHER subfamily PTHR11360:SF80 and the PAINT node PTN000888455 (GO:0008028, human Q8NCK7 a donor). Of 6 electronic rows: ACCEPT for plasma membrane, GO:0008028 and GO:0015718; KEEP_AS_NON_CORE for ER membrane; MODIFY GO:0022857 to GO:0008028 and GO:0055085 to GO:1905039. No pyruvate-specific or lipid-metabolism annotation was added, because PAINT did not propagate the pyruvate terms and the lipid change is an overexpression readout. No function is experimentally established in donkey.
