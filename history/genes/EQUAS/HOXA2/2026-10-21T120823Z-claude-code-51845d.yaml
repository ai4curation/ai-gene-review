  summary: Full re-review of donkey HOXA2 (A0A9L0JBM7), independent of ProtNLM2
  details: |
    Full re-review for the DONKEY40 ProtNLM2 cohort; ProtNLM2 predictions not consulted. Confirmed A0A9L0JBM7 is the full-length canonical product (373 aa vs 376 human; homeodomain and hexapeptide identical) and that donkey, human and mouse HOXA2 share PANTHER subfamily PTHR45664:SF3. Replaced support quotes drawn from a QuickGO ortholog annotation listing with quotes from cached primary mouse papers (PMID:15634706, 18787068, 16221728, 25889273, 10536059, 7903600, 7903601). GO:0043565 and GO:1990837 changed ACCEPT->TOO_GENERAL (ancestors of accepted GO:0000978). GO:0061061 muscle structure development changed KEEP_AS_NON_CORE->MARK_AS_OVER_ANNOTATED (neural-crest overexpression study, non-cell-autonomous effect on mesoderm-derived muscle). Core function now includes pharyngeal and embryonic skeletal development. Falcon deep research failed (Edison 403); recorded in notes. Next relative: mouse Hoxa2 P31245 (no review in repo).
