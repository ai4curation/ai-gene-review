  summary: 'Create review: donkey NADK2 full-length model A0A8C4M4D0'
  details: |
    New review of the full-length donkey NADK2 gene model A0A8C4M4D0, made independently of ProtNLM2 predictions. Folder is NADK2__A0A8C4M4D0 because genes/EQUAS/NADK2 holds the isoform-2-like model A0A9L0K2P4. Four IEA rows reviewed: NAD+ kinase activity, mitochondrion and mitochondrial matrix accepted; NAD+ metabolic process changed to NADP+ biosynthetic process (an is_a descendant, checked in OLS). Each transfer rests on PANTHER subfamily PTHR13158:SF5 membership shared with experimentally characterised human NADK2, and on the PAINT IBDs at PTN004406956 and PTN000994636. Homodimerization was left out because PAINT did not propagate it. Sequence evidence reuses genes/EQUAS/NADK2/NADK2-bioinformatics/RESULTS-rereview.md: the model is gap-free against human Q4G0N4, retains GGDG and the S402/K413/W415 positions, and has a 96-residue N-terminal extension. Falcon and perplexity-lite deep research both failed (authentication and quota errors), as recorded in the notes. No function has been tested experimentally in donkey.
