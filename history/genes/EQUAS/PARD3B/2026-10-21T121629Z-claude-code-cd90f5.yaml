  summary: 'Full re-review: PARD3B (donkey A0A9L0JEY6), independent of ProtNLM2'
  details: |
    Full re-review using newly cached primary literature (PMID:12459187, PMID:12234671, PMID:16458856, PMID:24859006). PARD3B does not bind aPKC/PAR6, so the PAR3-family-root process terms were downgraded: establishment of cell polarity ACCEPT to KEEP_AS_NON_CORE; epithelial apical/basal polarity ACCEPT to MARK_AS_OVER_ANNOTATED; microtubule cytoskeleton organization and intracellular protein localization to MARK_AS_OVER_ANNOTATED. Establishment of centrosome localization was REMOVED: it is a TreeGrafter row with no counterpart in the current PAINT IBA set for PARD3, PARD3B or Pard3b (node PTN001046835). NEW GO:0004860 protein kinase inhibitor activity (ISS from mouse Par3L-LKB1 data, PMID:24859006) is now the core MF; its grounding is PANTHER SF4 membership plus a new analysis showing the LKB1-binding PDZ2-PDZ3 linker is conserved (RESULTS-rereview.md). Description rewritten; the contested PARD6B interaction dropped as support. Falcon deep research failed (auth; perplexity quota) and this is recorded in the notes. ProtNLM2 files were not consulted.
