  summary: 'Create review: donkey STX3 syntaxin 3A (A0A8C4LHZ8)'
  details: |
    New review of the UniProt gene-centric canonical donkey STX3 product (syntaxin 3A form), the characterised relative of ProtNLM2 benchmark model A0A9L0J901; independent of ProtNLM2 output. All 15 electronic GOA rows reviewed: 6 ACCEPT (SNARE binding, fusogenic activity, plasma membrane, exocytosis, vesicle fusion, SNARE complex), 4 KEEP_AS_NON_CORE (intracellular protein transport, endomembrane system, postsynapse and AMPAR exocytic insertion from the syntaxin-3 lineage PAINT node), 3 MODIFY to specific terms the gene already carries, 2 ARBA rows MARK_AS_OVER_ANNOTATED. Added NEW apical plasma membrane (ISS) from mammalian syntaxin 3A experiments plus the conserved FMDE targeting motif. Ortholog grounding via PANTHER PTHR19957:SF34 and a new reproducible sequence comparison (bioinformatics/RESULTS.md); 3B-specific retinal functions deliberately not transferred. Deep research failed (falcon auth, perplexity quota); literature cached with fetch-pmid.
