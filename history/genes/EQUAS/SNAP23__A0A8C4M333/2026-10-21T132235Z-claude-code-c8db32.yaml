  summary: 'Create review: donkey SNAP23 (A0A8C4M333)'
  details: |
    De-novo review of the full-length gene-centric canonical donkey SNAP23 product, the characterised relative of ProtNLM2 benchmark entry A0A8C4M285, done without ProtNLM2 output. Orthology was grounded by PANTHER PTHR19305:SF4 membership with human O00161 and mouse O09044, a gapless alignment (89.6% identity to human) conserving both SNARE motifs and the palmitoylated cysteine cluster, and the PAINT nodes (PTN000447753/4/2) behind the human IBA rows. Accepted fusogenic activity, plasma membrane, exocytosis, vesicle fusion and SNARE complex, all inferred from human and mouse experiments. Marked synaptic vesicle priming, synaptic vesicle fusion to the presynaptic active zone membrane and the derived presynapse row as over-annotations: they come from a node ancestral to SNAP23 and SNAP25, and SNAP23 rescue and localisation data show divergence. Falcon deep research failed (403), and the perplexity-lite fallback timed out; noted in the notes file.
