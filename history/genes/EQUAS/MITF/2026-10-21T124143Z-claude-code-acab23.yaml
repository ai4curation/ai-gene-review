  summary: Full re-review of donkey MITF (A0A9L0JBN5), independent of ProtNLM2 predictions
  details: |
    Identified A0A9L0JBN5 as one of five unreviewed donkey MITF transcript models (all ENSEASG00005002172): an isoform A-type, X2-type product with a 115-residue Arg/Pro/Gly-rich N-terminal extension, probably a gene-model artefact, and missing the segment matching human A1 138-162 (new gene_model_rereview.py and RESULTS-rereview.md). Grounded transfers in PANTHER PTHR45776:SF4 and PAINT nodes: the family-root IBDs at PTN005248237 for DNA binding, TF activity, transcription regulation and nucleus, and the MITF-lineage IBD at PTN000000820 for melanocyte differentiation. Changed GO:0006357 (ACCEPT) and GO:0006355 (TOO_GENERAL) to MODIFY, both to GO:0045944 positive regulation of transcription by RNA polymerase II, and updated core_functions to match. Added references PMID:9647758, PMID:23401004 and PMID:16822840, plus the PAINT tsv. Rewrote the description and suggested questions. Falcon and perplexity-lite deep research both failed (auth/quota); this is recorded in the notes.
