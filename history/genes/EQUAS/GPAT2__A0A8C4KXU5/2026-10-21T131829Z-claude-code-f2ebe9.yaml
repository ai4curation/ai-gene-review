  details: |
    New review of the 800-aa donkey GPAT2 entry, the full-length model and closest characterised relative of ProtNLM2 benchmark entry A0A9L0ILJ0. Grounded by PANTHER PTHR12563:SF15 shared with mouse Q14DK4 and a new ortholog alignment (bioinformatics/RESULTS.md). All 14 IEA rows reviewed: GPAT activity, PA biosynthesis and piRNA processing accepted as transfers from mouse experiments; mitochondrial locations refined to mitochondrial outer membrane; AGPAT activity kept non-core (crude-membrane evidence, not propagated by PAINT); fatty acid metabolism marked over-annotated; general terms marked too general. Falcon and perplexity-lite deep research failed (auth/quota); review uses cached mouse primary papers. Independent of ProtNLM2 predictions.
