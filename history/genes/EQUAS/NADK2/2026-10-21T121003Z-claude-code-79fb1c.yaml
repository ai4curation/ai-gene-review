  summary: Full re-review of donkey NADK2 (A0A9L0K2P4), independent of ProtNLM2 predictions
  details: |
    Compared all three donkey NADK2 gene models with human NADK2 (new compare_gene_models_rereview.py / RESULTS-rereview.md): A0A9L0K2P4 is an isoform-2-like splice model lacking the segment equivalent to human 288-319, which carries the positions mapped to the NAD+-binding site; A0A8C4M4D0 is the full-length canonical-equivalent. Rewrote description; kept NAD+ kinase activity, mitochondrion and mitochondrial matrix as ACCEPT with PANTHER SF5/PAINT grounding and PMID:24847004 support; changed NAD+ metabolic process from ACCEPT to MODIFY -> NADP+ biosynthetic process and dropped the redundant NEW row. Deep research (falcon, perplexity-lite fallback) failed to authenticate.
