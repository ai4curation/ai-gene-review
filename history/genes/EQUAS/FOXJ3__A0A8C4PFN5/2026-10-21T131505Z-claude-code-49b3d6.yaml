  summary: 'Create review: donkey FOXJ3 full-length model A0A8C4PFN5'
  details: |
    De-novo review of the full-length donkey FOXJ3 model (A0A8C4PFN5, 623 aa), the closest characterised relative of the ProtNLM2 benchmark A0A9L0JKH1 (same Ensembl gene, exon-skipped). Independent of ProtNLM2 output. Deep research failed (falcon auth, perplexity quota); review built from primary mouse/human/Xenopus literature. Orthology grounded by shared PANTHER PTHR46078:SF3 with mouse Q8BUR3 and human Q9UPW0 and a new alignment (95.3%/98.2% identity, fork-head domain near-identical; FOXJ3__A0A8C4PFN5-bioinformatics/RESULTS.md). 13 IEA rows reviewed: Pol II sequence-specific DNA-binding TF activity, activator activity, cis-regulatory DNA binding, dsDNA binding, nucleus and Pol II transcription regulation accepted on mouse Foxj3 Mef2c ChIP/reporter data (PMID:19914232); broad DNA binding, DNA-binding TF activity and regulation of DNA-templated transcription marked TOO_GENERAL; spermatogenesis kept as non-core (mouse cKO, PMID:27739607); male meiosis I marked over-annotated (transcriptional requirement, not participation; PAINT did not propagate it). No NEW terms; mouse knockout phenotypes (muscle fibre type, thermogenesis, cortical lamination) not transferred.
