  summary: 'Create review: donkey PIKFYVE canonical product A0A8C4L106'
  details: |
    New review of the full-length donkey PIKFYVE product (A0A8C4L106, Ensembl canonical transcript of ENSEASG00005003072), the characterised relative of ProtNLM2 benchmark entry EQUAS/PIKFYVE (A0A9L0JQ61); independent of ProtNLM2 output. All 36 GOA rows are IEA (donkey is not a PAINT reference proteome). Transfer grounded on PANTHER PTHR46715:SF1 membership shared with human Q9Y2I7 and mouse Q9Z1T6, plus a reproducible alignment showing a full-length model with conserved catalytic Lys-1887 and FYVE zinc ligands. Accepted PtdIns3P 5-kinase, PtdIns 5-kinase, early/late endosome membrane and PAS complex; refined general MF/CC/BP terms; kept PAINT-placed cell-type processes as non-core; marked ARBA Golgi membrane, PI4P 5-kinase, protein localization terms, virus endocytosis and DEP-domain signal transduction as over-annotated. Falcon and perplexity-lite deep research both failed (auth/quota); cached mammalian PIKfyve literature used instead.
