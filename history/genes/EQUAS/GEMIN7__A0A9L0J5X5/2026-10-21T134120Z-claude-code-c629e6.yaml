  summary: 'Create review: donkey GEMIN7 canonical product A0A9L0J5X5'
  details: |
    De-novo review of the 131-aa canonical donkey GEMIN7 product (same Ensembl gene as ProtNLM2 benchmark entry A0A9L0ICL9), independent of ProtNLM2 output. Falcon and perplexity-lite deep research failed (auth/quota), so the review rests on cached human and S. pombe SMN-complex literature. Function transfer is grounded on PANTHER PTHR14679:SF1 membership shared with human Q9H840 and S. pombe gem7 (new bioinformatics/compare_orthologs.py, 87.8% identity to human). Of 7 IEA rows: ACCEPT spliceosomal snRNP assembly, SMN-Sm protein complex, Sm-like protein family complex, cytoplasm; KEEP_AS_NON_CORE nucleoplasm and gems; MARK_AS_OVER_ANNOTATED RNA binding (Sm-domain signature only, no direct RNA-binding evidence). SMN complex (GO:0032797) not added because PAINT did not propagate it; raised as a question. No function is experimentally established in donkey.
