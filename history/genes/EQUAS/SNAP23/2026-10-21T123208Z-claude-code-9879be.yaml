  summary: 'Full re-review: SNAP23 (donkey A0A8C4M285), independent of ProtNLM2'
  details: |
    Full re-review of the 97-aa donkey SNAP23 product. New Ensembl exon analysis (RESULTS-rereview.md, compare_transcripts_rereview.py) shows it is an alternative-terminal-exon product of the single SNAP23 gene; gene-centric canonical is A0A8C4M333. Actions unchanged (plasma membrane ACCEPT; fusogenic activity, exocytosis, vesicle fusion, SNARE complex UNDECIDED because the product lacks the Qc SNARE motif; synaptic vesicle priming, SV fusion to active zone, presynapse MARK_AS_OVER_ANNOTATED), but support strengthened with literature: PMID:12859899 and PMID:17728451 (SNAP23 does not support primed pools or synchronous release in Snap25-null rescue), PMID:12556468 (N-terminal SNARE motif assembly), PMID:8663154, PMID:30811271. Description now records the gene-model identity and PANTHER SF4 placement. Replaced an ARBA-only SIMILARITY quote with the PANTHER SF4 cross-reference. Added a suggested question on the PTN000447754 synaptic-term node placement. Falcon and perplexity-lite deep research both failed (auth/quota).
