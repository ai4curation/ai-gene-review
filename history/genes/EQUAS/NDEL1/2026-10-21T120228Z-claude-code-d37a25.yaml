  summary: Full re-review of donkey NDEL1 (A0A9L0IJ72), independent of ProtNLM2
  details: |
    Full re-review, ProtNLM2 output not consulted. Identified A0A9L0IJ72 as one of ten donkey NDEL1 gene models: collinear with human isoform 1 through residue 338, then a 143-residue C-terminal tail (339-481) found in no human isoform; all mapped functional sites retained (new analysis NDEL1-bioinformatics/RESULTS-rereview.md). PANTHER PTHR10921:SF0, same subfamily as human NDEL1. MTOC ACCEPT->MODIFY (centrosome); microtubule associated complex ACCEPT->KEEP_AS_NON_CORE; regulation of intracellular protein transport support replaced (was a DR GO line) with PMID:21283621; NEW nuclear migration along microtubule, microtubule anchoring at centrosome and molecular adaptor activity, matching human review core functions; primary-paper quotes added; description corrected. Falcon deep research failed (Edison 403); recorded in notes.
