  details: |
    New review of the canonical, colinear donkey GPC3 product (A0A9L0JGR2), the same-gene relative of the ProtNLM2 benchmark model A0A9L0J2B1; ProtNLM2 output not used. Grounded in PTHR10822:SF4 membership shared with human P51654 and mouse Q8CFZ4 and in PAINT node placements. New ortholog comparison (compare_orthologs.py): 96.21% identical to human, no indels, signal peptide and convertase/heparan sulfate/GPI sites conserved. Accepted plasma membrane, cell surface and positive regulation of canonical Wnt; kept extracellular region, cell migration and regulation of protein localization to membrane as non-core; regulation of signal transduction TOO_GENERAL; extracellular matrix over-annotated (not inherited by GPC3 lineage in PAINT). Added ISS frizzled binding (human), hedgehog family protein binding and negative regulation of smoothened signaling (mouse). No donkey experimental data exist; falcon deep research failed (auth).
