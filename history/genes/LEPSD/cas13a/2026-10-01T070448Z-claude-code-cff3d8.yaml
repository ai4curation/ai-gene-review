  summary: 'Create review: LshCas13a/C2c2 (P0DOC6), type VI-A RNA-targeting CRISPR
    effector'
  details: |
    Completed review from seeded stub; GOA held zero annotations, so all three rows are NEW. GO:0004521 RNA endonuclease activity (IDA, PMID:27256883) covering both the HEPN target/collateral cleavage and the separate pre-crRNA processing site, since GO cannot distinguish them; GO:0099048 CRISPR-cas system (IMP) and GO:0051607 defense response to virus (IMP), the latter on a 3-4 log10 MS2 plaque reduction abolished by each of four HEPN catalytic point mutants. Chose GO:0004521 over GO:0016891/GO:0016892 because both children stipulate a hydrolytic mechanism and a particular phosphomonoester product. Two core_functions (HEPN target+collateral; pre-crRNA processing at the Helical-1 site). Two proposed new terms: guide RNA-dependent nucleic acid endonuclease activity, and defense response to virus by induction of host dormancy (under GO:0051607; the existing dormancy terms sit under GO:0032502 developmental process and would be a branch error). Dormancy NOT asserted as an annotation because PMID:31142834 is on the Listeria seeligeri ortholog. Diagnostics applications deliberately excluded. Notes file written in place of deep research (no provider API keys available).
