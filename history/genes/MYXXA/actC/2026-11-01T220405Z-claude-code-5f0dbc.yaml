  details: |
    De-novo review of all 8 GOA rows for Q93P57 (3 CACAO IMP from PMID:11359579, 5 IEA): 2 ACCEPT, 3 MODIFY, 1 KEEP_AS_NON_CORE, 1 TOO_GENERAL, 1 REMOVE (GO:0004029, an aldehyde-dehydrogenase assertion over-propagated from PANTHER node PTN005180820 to ~1,300 proteins), plus a NEW GO:0010629 row for ActC's own action of restraining csgA expression. Tested the predicted cross-isolate-transfer shape and found it absent: NCBITaxon:34 and NCBITaxon:246197 are two UniProtKB representations of the same DK1622 loci (Q93P57 and Q1D7F7 are byte-identical and share RefSeq WP_011553262.1), with the real defect being entry redundancy that strands the experimental rows off the reference proteome.
