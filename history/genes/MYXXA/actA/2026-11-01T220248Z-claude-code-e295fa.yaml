  details: |
    De-novo review of the three GOA rows on Q93P59 (M. xanthus act operon response regulator ActA): the InterPro receiver-domain GO:0000160 row accepted, and both CACAO IMP rows from PMID:11359579 refined with MODIFY (GO:0009966 to GO:0009967 positive regulation of signal transduction, since the actA null caps C-signal at a quarter of wild type; GO:0043937 to GO:0042173, the cellular-spore child, since myxospores are cellular spores). Tested the batch-3 cross-isolate-transfer prediction and found it absent: both taxon ids denote DK1622 and Q93P59 derives from the paper's own AF350253 sequence; what the screen detected is instead redundant unmerged UniProt entries for one locus (Q93P59 versus Q1D7F9 actA MXAN_3213), recorded as a source defect.
