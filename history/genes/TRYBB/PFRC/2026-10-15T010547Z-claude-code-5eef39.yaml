  summary: 'Review-fix round: PFRC'
  details: |
    Harmonised PFRC with its partner subunit PFRA, whose GOA file is row-for-row identical. GO:0031514 motile cilium changed from ACCEPT to MODIFY with proposed replacement GO:0097740 paraflagellar rod: QuickGO ancestors of GO:0097740 (is_a + part_of) include GO:0097729 9+2 motile cilium and GO:0031514, so the row is correct but general rather than non-redundant (OLS getAncestors shows only the is_a chain to GO:0099080, which is why the part_of link was missed). Dropped GO:0031514 from core_functions.locations, where it was listed alongside its own descendant GO:0097740. GO:0005516 calmodulin binding changed from KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED: the previous reason rested on absence of contradiction, whereas the evidence is an InterPro2GO transfer off a structural domain, an ECO:0000255 predicted region, and complex-level direct-or-indirect interactions; added PMID:19879876 to the references and supported_by so the row cites the actual calmodulin-Sepharose evidence, which was run on a bulk PFR protein pool that does not resolve PFR1 from PFR2. PFRA's equivalent row was deliberately left as KEEP_AS_NON_CORE and the divergence is recorded in PFRC-notes.md.
