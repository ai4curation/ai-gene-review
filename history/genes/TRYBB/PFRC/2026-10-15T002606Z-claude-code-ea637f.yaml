  summary: 'Create review: PFRC'
  details: |
    Created the review of T. brucei PFRC (Q26789), the 73 kDa paraflagellar rod protein (PFR1 in modern nomenclature; the 69 kDa PFRA is PFR2). Automated deep research was unavailable, so a manual literature review was done instead (UniProt, PubMed, and 11 newly cached papers including Deflorin 1994, Bastin 1999/2000, Portman 2009, Ginger 2013, Alves 2020 and Zhang 2021 cryo-ET) and recorded in PFRC-notes.md. Of the three IEA rows, motile cilium was accepted, cytoskeleton was modified to paraflagellar rod (GO:0097740), and calmodulin binding was kept as non-core because only a predicted motif and complex-level binding support it. Added NEW structural molecule activity (GO:0005198; GO:0005200 not used because the PFR is not classified under cytoskeleton in GO) and cilium-dependent cell motility (GO:0060285, IMP). Paraflagellar rod assembly (GO:0120268) was moved to suggested_questions under the participation test. These calls were harmonised with the partner subunit PFRA. The core function is a structural PFR subunit acting in flagellar motility, located in the paraflagellar rod and the motile cilium.
