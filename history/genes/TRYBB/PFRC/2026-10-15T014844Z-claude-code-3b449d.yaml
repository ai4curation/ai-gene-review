  details: |
    Correction round for PR #5029, superseding part of the quote-expansion record earlier this session. Three over-expanded quotes in PFRA and TPR were reverted to their pre-expansion form, because the cached text fuses a paragraph into a DOI, a figure caption or a reference list, so the next period is not a sentence boundary and the shorter quote was already the complete claim. The expansion rule was then corrected to skip abbreviation and single-capital periods, to treat a period followed directly by a capital as a fused boundary, to refuse any candidate containing a DOI or figure id, and to cover supporting_text inside references[].findings[], which the first pass missed; the affected quotes were re-expanded under the corrected rule.
