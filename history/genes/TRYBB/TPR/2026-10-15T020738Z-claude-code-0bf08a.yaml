  summary: 'Quote re-revert round: TPR'
  details: |
    Re-revert round for PR #5029. The abbreviation-aware expansion rule judges a quote incomplete when it does not end in terminal punctuation, which is exactly how the two quotes deliberately shortened in the previous round looked, so the rule expanded them again: PFRA's back into 'PFR259,60.' (flattened superscript reference markers that read as a protein named PFR259) and TPR's into a bracketed citation plus a fused next paragraph. Both are restored to their deliberately short form. Because no regex guard distinguishes a deliberate short quote from a clipped one - a digit-collapse guard would have saved PFRA and still re-expanded TPR - each gene's notes now carries a 'Deliberately short supporting_text (do not complete)' section naming these quotes and the reason, and the expander is not to be re-run on this branch.
