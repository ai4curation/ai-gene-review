  summary: 'Create review: TPR'
  details: |
    Reviewed all 13 electronic GOA annotations for T. brucei trypanothione reductase (P39051). Automated deep research was unavailable, so a manual literature review (UniProt plus PubMed-verified PMIDs 10672177, 19747949, 1453951, 3883489, 1444271, 1779986, 20735352) was recorded in TPR-notes.md. Key calls: TreeGrafter glutathione-disulfide reductase activity REMOVED (paralog over-annotation; TbTryR strongly prefers trypanothione disulfide over GSSG); generic oxidoreductase parents MODIFIED to trypanothione-disulfide reductase (NADPH) activity; glutathione metabolic process MODIFIED to trypanothione metabolic process; cytoplasm MODIFIED to cytosol; mitochondrion left UNDECIDED pending access to the 1991 subcellular fractionation study; redox homeostasis and oxidative stress response accepted on the basis of the Krieger 2000 conditional knockdown.
