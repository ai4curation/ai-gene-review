  summary: 'Create review: PFRA'
  details: |
    Created the GO annotation review for T. brucei PFRA/PFRB (P22225), the 69 kDa paraflagellar rod protein PFR2, based on a manual literature review instead of automated deep research, which was unavailable (Falcon/OpenAI auth failure). Seven PubMed-verified papers were cached and quoted (the cloning paper, PFRA RNAi studies, the Portman and Gull PFR review, the PFR interaction map, the 2021 cryo-ET structure and the calmodulin RNAi paper). Of the three IEA annotations, calmodulin binding was kept as non-core (PFR-pool CaM-Sepharose binding, not resolved to PFR2 alone). Cytoskeleton and motile cilium were both modified to GO:0097740 paraflagellar rod. NEW structural molecule activity (core MF) and cilium-dependent cell motility were added, based on RNAi paralysis and loss of the PFR. The original single-protein/two-conformation model of the 1989 paper was marked as overturned. PFR1/PFR2 naming inversions were resolved by anchoring to the 69 kDa protein.
