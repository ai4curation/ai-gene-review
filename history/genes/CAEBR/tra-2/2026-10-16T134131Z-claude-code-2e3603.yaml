  summary: Source tra-2 FEM-3 binding as protein sequestering activity; migrate protein-binding rows
  details: |
    Gave the TRA-2 binding activity exact support and corrected the term. GO:0030674 protein-macromolecule adaptor activity (coordinating partners) did not fit TRA-2 repressing FEM-3 by binding it, so the FEM-3 GO:0005515 IPI row (PMID:12477393) is now MODIFY to GO:0140311 protein sequestering activity (the protein-ligand child of GO:0140313, since FEM-3 is a protein), and the matching core function uses the same term. Both carry verbatim PMID:12477393 quotes (species-specific FEM-3/TRA-2 interaction; tra-2 is the upstream repressor of fem-3). The TRA-1 GO:0005515 IPI row (PMID:11250902) is REMOVE under the GO:0005515 policy, because no sourced informative MF (neither sequestration nor bridging) exists for that binding. The redundant NEW GO:0030674 row was dropped. Core functions now point directly_involved_in at the accepted specific process terms GO:0040021 and GO:0042001 instead of GO:0007530. Status set to DRAFT (no PENDING rows; warnings remain).
