  summary: Verify she-1 primary paper and tighten core-function support
  details: |
    Refreshed the PMID:19836240 cache (previous copy lacked the abstract; no PMC full text exists), verified the citation against PubMed, and marked the reference VERIFIED with abstract-quoted findings. Core functions now carry verbatim support: the process core function uses GO:0040021 hermaphrodite germ-line sex determination (she-1 acts upstream of tra-2, the fog-2 position; C. elegans fog-2 carries GO:0040021 by IMP) instead of sex determination plus male gamete generation, and no longer repeats the adaptor MF. The SCF substrate-adaptor core function is explicitly labelled provisional and supported only by the F-box identity (abstract plus the UniProt Pfam match), with the abstract's finding that SHE-1 does not bind GLD-1 added. No SCF complex id (GO:0019005) is asserted, because SCF assembly is undetermined; that question is recorded as a knowledge gap. Status set to DRAFT.
