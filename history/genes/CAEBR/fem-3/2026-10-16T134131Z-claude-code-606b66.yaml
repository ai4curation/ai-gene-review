  summary: Withdraw FEM-3 substrate-adaptor NEW MF; model as CRL2-FEM cofactor
  details: |
    Added primary C. elegans evidence PMID:17609115 (Starostina et al. 2007), whose abstract states FEM-1 is the substrate-recognition subunit and FEM-2/FEM-3 are cofactors of the CUL-2 ligase that degrades TRA-1. Comparator check in QuickGO: C. elegans FEM-1 carries GO:1990756 (IBA) but FEM-3 does not. The NEW GO:1990756 row was therefore withdrawn and the core function rewritten as contributes_to GO:0061630 within GO:0031462, with process core terms male sex determination and masculinization of hermaphroditic germ-line. The bare protein-binding IPI row moved from MARK_AS_OVER_ANNOTATED (with a GO:1990756 replacement) to REMOVE per the GO:0005515 policy, and the Cul2 complex row gained verbatim support. Status set to DRAFT.
