  details: |
    Review round 3 on PR #5650. (1) The core_functions rationale for contributes_to_molecular_function GO:0015408 cited genes/GLUOX/pstS and genes/GLUOX/pstC as naming the specific GO:0015415; genes/GLUOX/ does not exist on main (it is only on the unmerged PR #5634) and all four phosphate-ABC subunits actually in the tree stop at the generic parent GO:0005315 (genes/ECOLI/pstC:315, genes/ECOLI/pstA:323, genes/PSEPK/pstC:153, genes/PSEPK/pstA:131, all verified 2026-10-28). The false precedent claim was removed from the YAML and restated honestly in fbpA-notes.md, which now records the four counter-examples and says the term choice rests on the GO:0015408 definition alone. The term itself is unchanged. (2) Ontology bookkeeping (enum membership, is_a closure check, repo paths) was moved out of core_functions[].description, which the renderer publishes verbatim as the core function's h3 heading, and now lives only in the notes. (3) The last clause of the top-level description was rephrased from an argument about which cations belong together into a plain statement of the Cu(II) binding mode, grounded in PMID:23884152.
