  summary: Create gene review for Neisseria gonorrhoeae FbpA (Q50964), the FbpABC
    periplasmic ferric-binding protein
  details: |
    Reviewed both GOA rows on the unreviewed TrEMBL entry Q50964: ACCEPT GO:0030288 outer membrane-bounded periplasmic space (TreeGrafter IEA, confirmed against the SignalP signal peptide and the pulse-chase periplasmic-binding-protein evidence in PMID:7934822); MODIFY GO:0055085 transmembrane transport to GO:0034755 iron ion transmembrane transport, since the InterPro IPR006061 conserved-site mapping can only reach the unqualified parent. Added three NEW rows: GO:0008199 ferric iron binding (IDA, PMID:7947682 plus the PDB 1D9Y-derived FT BINDING sites), GO:0033212 iron import into cell (IMP, PMID:21041493 conditional fbpABC mutants) and GO:0055052 ABC transporter complex substrate-binding subunit-containing (IC, PMID:8606197 operon structure). Core functions follow the genes/ECOLI/pstS and pstC precedent: molecular_function GO:0008199 for the binding activity and contributes_to_molecular_function GO:0015091 for the complex-level transporter activity, rather than asserting that the solute-binding protein enables primary active transport. No source defects recorded; the Hf(IV) and Cu(II) cluster chemistry that places this protein in the CMMMech critical-minerals corpus is cell-free and supports no annotation beyond iron, so it is recorded in the notes file and in suggested_experiments.
