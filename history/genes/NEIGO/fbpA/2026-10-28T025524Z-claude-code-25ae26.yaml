  summary: Apply non-blocking review suggestions on PR 5650 for NEIGO/fbpA
  details: |
    Addressed the four blue suggestions on the approved review. (1) contributes_to_molecular_function moved from the generic GO:0015091 to GO:0015408 ABC-type ferric iron transporter activity, which is defined by exactly the FbpABC reaction; the contributes_to relation already carries the qualification that FbpA does not itself enable primary active transport, and the sibling phosphate-ABC reviews genes/GLUOX/pstS and genes/GLUOX/pstC both name the specific GO:0015415, so the generic term would have been internally inconsistent. GO:0015408 verified live, in the molecular-function validation enum, and with GO:0015091 in its is_a closure. (2) Corrected the precedent attribution in fbpA-notes.md: genes/ECOLI/pstS has no contributes_to_molecular_function, so it is the precedent for GO:0055052 only; genes/ECOLI/pstC is the contributes_to precedent. (3) Split Cu(II) out of the hard, highly charged cation clause of the description, since it is divalent and much softer and binds as dinuclear oxo-Cu2 centres rather than as part of that set. (4) Added to the GO:0033212 reason an explicit statement of why GO:0033214 siderophore-iron import into cell must not be substituted as a refinement, with the paper mechanism quote as additional supported_by. Also recorded the two ontology hierarchy checks the automated reviewer could not run in its sandbox (GO:0055085 in GO:0034755 is_a closure; GO:0033212 and GO:0034755 mutually non-entailing).
