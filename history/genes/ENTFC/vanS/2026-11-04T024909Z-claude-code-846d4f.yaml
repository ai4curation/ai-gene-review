  summary: 'Full review of Enterococcus faecium vanS (Q06240): 12 GOA rows reviewed,
    one REMOVE, one NEW row added'
  details: |
    Reviewed all 12 GOA rows for vanS (Q06240). Actions: 4 ACCEPT (GO:0000155 phosphorelay sensor kinase activity, the core function; GO:0000160 phosphorelay signal transduction system; GO:0004721 phosphoprotein phosphatase activity, kept generic because GO has no response-regulator aspartyl-phosphate phosphatase term; GO:0005886 plasma membrane), 5 MODIFY (all four GO:0004673 protein histidine kinase activity rows refined to the descendant GO:0000155 the gene already carries, since the assays show His autophosphorylation plus selective transfer to a cognate regulator; GO:0016020 membrane refined to GO:0005886), 2 TOO_GENERAL (GO:0016772 and GO:0007165, ancestors of terms accepted here), 1 REMOVE (GO:0016036 cellular response to phosphate starvation, a TreeGrafter over-propagation from PANTHER:PTN008690706 in PTHR45453 PHOSPHATE REGULON SENSOR PROTEIN PHOR; recorded with a propagation_review, and PMID:8664263's ten-thousand-fold preference for VanR over PhoB argues directly against a shared role. The module declines to assert any PANTHER term for VanS for the same reason), 1 NEW (GO:0046677 response to antibiotic). Two core functions, the kinase and the phosphatase arms of one switch. The activation controversy is handled at reference level rather than by any annotation action: PMID:28511809 (glycopeptides bind and activate) and PMID:30677074 (full-length VanS insensitive to vancomycin) are both marked DISPUTED, and the question is recorded as a BIOLOGY knowledge gap; no activator is asserted. The GO-CAM's vancomycin activator edge, evidenced from a cytosolic-domain paper that never tested the drug, is raised as a question rather than duplicated as a source defect, since gocams/671ae02600002832 already records it. Fitness data unavailable. Search recorded in vanS-notes.md.
