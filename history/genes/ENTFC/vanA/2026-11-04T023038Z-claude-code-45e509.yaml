  summary: 'Full review of Enterococcus faecium vanA (P25051): 13 GOA rows reviewed,
    one NEW row added'
  details: |
    Reviewed all 13 GOA rows for vanA (P25051). Actions: 6 ACCEPT (two GO:0160220 D-alanine-(R)-lactate ligase rows, two GO:0009252 peptidoglycan biosynthesis rows, GO:0005524 ATP binding, GO:0005829 cytosol, GO:0046872 metal ion binding kept generic because the cofactor note gives magnesium or manganese), 4 KEEP_AS_NON_CORE (two GO:0008716 D-Ala-D-Ala ligase rows, the ancestral activity that is nonetheless real since vanA transcomplements a temperature-sensitive E. coli ddl mutant; two GO:0005886 plasma membrane rows, a peripheral cytoplasmic-face association from PMID:2266943 while catalysis is cytosolic), 1 MODIFY (GO:0005737 cytoplasm refined to GO:0005829 cytosol, a part_of descendant already carried), 1 TOO_GENERAL (GO:0016881 acid-amino acid ligase activity, an ARBA row that is an ancestor of GO:0008716 and does not cover the ester-forming reaction at all), 1 NEW (GO:0046677 response to antibiotic, absent from GOA for the whole van cluster although the operon is defined by inducible glycopeptide resistance; the process term used by modules/glycopeptide_resistance_depsipeptide.yaml and gomodel:671ae02600002832). One core function: ATP-dependent D-alanine-(R)-lactate ligase making the depsipeptide terminus that glycopeptides bind weakly. One BIOLOGY knowledge gap on the acceptor-site determinants of the specificity shift. No source defects. Three extra papers fetched for context (PMID:1556077, PMID:8852545, PMID:7873524); fitness data not available for this organism. Search recorded in vanA-notes.md.
