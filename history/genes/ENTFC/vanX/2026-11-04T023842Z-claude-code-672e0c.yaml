  summary: 'Full review of Enterococcus faecium vanX (Q06241): 5 GOA rows reviewed,
    two NEW rows added'
  details: |
    Reviewed all 5 GOA rows for vanX (Q06241); every row is electronic and none cites a publication, so each was judged against the primary literature and the curated UniProt record. Actions: 3 ACCEPT (GO:0160237 D-Ala-D-Ala dipeptidase activity, the core function from RHEA:20661/EC 3.4.13.22; GO:0008237 metallopeptidase activity, which is not an ancestor of GO:0160237 and is an independent true claim about a zinc M15D enzyme whose k_cat rises from 4.7 to 788 per second with divalent metal; GO:0008270 zinc ion binding, backed by three curated zinc ligands), 2 MODIFY (GO:0016805 dipeptidase activity refined to the specific child GO:0160237 the gene already carries, as modules/glycopeptide_resistance_depsipeptide.yaml notes the GO-CAM stops at the generic parent; GO:0006508 proteolysis re-pointed to GO:0043171 peptide catabolic process, because VanX hydrolyses a free dipeptide and GO defines proteolysis over proteins). Two NEW rows: GO:0046677 response to antibiotic and GO:0005829 cytosol as an IC inference, since the entry has no cellular-component annotation, no membrane or export feature, and acts on the cytoplasmic dipeptide pool. One core function: zinc D-Ala-D-Ala dipeptidase whose hundred-thousand-fold discrimination against D-Ala-D-lactate is what makes the resistance switch clean. One BIOLOGY knowledge gap on the structural basis of that amide-versus-ester discrimination. No source defects. PMID:7873524, PMID:1556077 and PMID:8852545 fetched for support since GOA cites none. Fitness data unavailable for this organism. Search recorded in vanX-notes.md.
