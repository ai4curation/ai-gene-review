  summary: 'Full review of Enterococcus faecium vanY (P37711): 4 GOA rows reviewed,
    one NEW row added'
  details: |
    Reviewed all 4 GOA rows for vanY (P37711). Actions: 2 ACCEPT (GO:0005886 plasma membrane, EXP from PMID:1510448 plus the mapped row; the enzyme has a single N-terminal transmembrane helix and acts on membrane-handled precursors, and E. faecium has only one membrane), 2 MODIFY (GO:0008233 peptidase activity refined to the descendant GO:0009046 zinc D-Ala-D-Ala carboxypeptidase activity, which names the measured reaction and the metal class, the metallo assignment being supported functionally by the activity's resistance to beta-lactams as well as by the curated M15B zinc site; GO:0006508 proteolysis re-pointed to GO:0000270 peptidoglycan metabolic process, because the substrates are UDP-MurNAc-pentapeptide and the VanA depsipeptide, not proteins). One NEW row: GO:0046677 response to antibiotic, pitched at participation rather than requirement, since UniProt states vanY is not necessary for resistance in BM4147 and PMID:8852545 that it only slightly raises the level. One core function: membrane-anchored zinc D,D-carboxypeptidase trimming assembled precursors downstream of VanX, and cleaving the depsipeptide as well, which is why it is a blunt and dispensable instrument. One BIOLOGY knowledge gap on which precursor pool it trims in vivo and the topology of its catalytic domain. No source defects. Fitness data unavailable for this organism. Search recorded in vanY-notes.md.
