  summary: 'Full review of Enterococcus faecium vanR (Q06239): 8 GOA rows reviewed,
    two NEW rows added'
  details: |
    Reviewed all 8 GOA rows for vanR (Q06239); every row is electronic and none cites a publication, so each was judged against the primary literature and the curated UniProt record. Actions: 4 ACCEPT (GO:0000156 phosphorelay response regulator activity, supported by the Asp53 phosphorylation site and by measured phosphotransfer and dephosphorylation; GO:0000160; GO:0000976 transcription cis-regulatory region binding, with UniProt naming the vanH and vanR promoters and the phosphorylation-dependent affinity increase; GO:0005829 cytosol), 2 MODIFY (GO:0005737 cytoplasm refined to GO:0005829, a part_of descendant already carried; GO:0006355 refined to GO:0045893 positive regulation of DNA-templated transcription, the direction established by reporter fusions and RNA mapping), 1 TOO_GENERAL (GO:0003677 DNA binding, ancestor of the accepted promoter-binding term), 1 KEEP_AS_NON_CORE (GO:0032993 protein-DNA complex, true but an entailment of the DNA-binding function with no characterised complex). Two NEW rows: GO:0001216 DNA-binding transcription activator activity, which GO:0000156 does not entail since the two terms are unrelated in the hierarchy and a response regulator need not be a transcription factor, and GO:0046677 response to antibiotic. Two core functions, the activator and the receiver halves. One BIOLOGY knowledge gap on how Asp53 phosphorylation is relayed to the DNA-binding domain and on the unexplained report that VanS inhibits VanR DNA binding. No source defects: the GO-CAM's duplicate VanR node and its has_input on the VanH protein are already recorded in gocams/671ae02600002832 and are raised here as a question instead. Also flagged that UniProt carries both Activator and Repressor keywords while only activation is documented. Fitness data unavailable. Search recorded in vanR-notes.md.
