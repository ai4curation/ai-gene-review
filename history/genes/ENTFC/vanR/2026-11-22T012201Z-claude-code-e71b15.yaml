  summary: Name the GO-CAM model and activity nodes in the source defects' records
  details: |
    Batch 4, second half. Both defects are against a GO-CAM model and the gene carries no GOA row for GO:0001216, so the exporter's row fallback yields a near-empty tuple.

    The duplication defect names both VanR activity individuals, read from the cached model: gomodel:671ae02600002832/6792e70800000096 and .../6796b94c00000312, which the cache does show as two nodes with the same enabled_by (UniProtKB:Q06239) and the same molecular function (GO:0001216).

    The has_input defect records the activity gomodel:671ae02600002832/6792e70800000096, which is VanR (enabled_by UniProtKB:Q06239, molecular_function GO:0001216) and does carry the asserted input: molecular_associations predicate RO:0002233 -> molecule gomodel:671ae02600002832/6792e70800000106, typed UniProtKB:Q05709 (VanH). The sibling VanR node 6796b94c00000312 has no molecular_associations, so the activity is unambiguous. The defect is confirmed against the cache.

    Correction to this record's first draft, written before PR #6750 was reviewed: it said the cached model contains no has_input on any activity, that the model's only Q05709 was the VanH enabled_by, and that the defect should not be read as verified. All three were wrong, and the reviewer caught it. gocam-py serialises has_input as a molecular_associations entry with predicate RO:0002233, never as a literal has_input key, so grepping that key returned nothing and the conclusion followed from the spelling rather than from the data - the model in fact has four RO:0002233 predicates, and two Q05709 references. This is the failure mode CLAUDE.md records for the GZMB comparator query: a query that cannot return a positive gives a confident false negative, and an unusually clean negative is the tell. Corrected in place rather than by a successor record because nothing merged depends on it; the false sentence existed only in this unmerged PR.
