  summary: 'Full review of Enterococcus faecium vanH (Q05709): 12 GOA rows reviewed,
    two NEW rows added'
  details: |
    Reviewed all 12 GOA rows for vanH (Q05709). Actions: 11 ACCEPT, 1 TOO_GENERAL, plus 2 NEW. The multiple molecular-function terms are not duplicates: UniProt gives this enzyme three EC numbers and five Rhea reactions on experimental evidence, so GO:0008720 (NAD+ lactate, the physiological reaction), GO:0140175 (generic NAD+ 2-hydroxyacid, a broader claim that is demonstrated and not entailed by the lactate child) and GO:0050578 (the NADP+ counterpart, with NADPH the slightly preferred donor) are each accepted, as is GO:0051287 NAD binding. GO:0047809 D-lactate dehydrogenase activity is accepted rather than marked too general because GOA derives it from RHEA:62968, the NADP+-dependent lactate reaction, for which GO has no cofactor-specific child; the missing term is raised as a suggested question. GO:0016616, the EC-class parent of all of them, is TOO_GENERAL. NEW rows: GO:0046677 response to antibiotic (absent from GOA for the entire van cluster) and GO:0005829 cytosol as an IC inference, since vanH had no cellular-component annotation at all despite being a soluble dehydrogenase with no membrane features acting on cytosolic metabolites. One core function: D-specific 2-keto acid reductase supplying the D-lactate that VanA esterifies. One BIOLOGY knowledge gap on the anion and redox dependence and the absent structure. No source defects. Fitness data unavailable for this organism. Search recorded in vanH-notes.md.
