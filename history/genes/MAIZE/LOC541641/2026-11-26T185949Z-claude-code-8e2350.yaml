  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N29). GO:0070417 cellular response to cold: the IBD at PTN008117964 is seeded by Arabidopsis AHK2 and AHK3 (IMP, PMID:20463025; cold induction of type-A ARR genes runs through AHK2 and AHK3 without a change in cytokinin content). ZmHK2 sits in the AHK3 orthologue clade PTN005179416 with the AHK3 seed. The earlier reason rested on the absence of maize data and on the monocot-dicot split, neither of which is a ground, so the row moved from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE. Summary, reason, supported_by and propagation_review rewritten; PMID:20463025 (already cached) added to references. GO:0010029 regulation of seed germination left as over-annotated: its seeds are receptor mutant germination phenotypes that TAIR annotates as acts_upstream_of_or_within. Validated with just validate MAIZE LOC541641.
