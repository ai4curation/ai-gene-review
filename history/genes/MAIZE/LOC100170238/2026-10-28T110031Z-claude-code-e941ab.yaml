  details: |
    New review of maize ZmTSA (LOC100170238, A0A804Q7I2), the plastid tryptophan synthase alpha subunit, based on full text of PMID:18430213 and PMID:31090986, with gene identity confirmed by matching native-complex MS peptides and cloning primers to the sequence. All four IEA rows accepted (L-tryptophan biosynthesis, IGP lyase activity, tryptophan synthase activity, chloroplast); the tryptophan synthase activity row carries a WRONG_QUALIFIER source defect (enables to contributes_to) because the overall reaction needs the TSB subunit. Core function: IGP lyase activity, contributing to tryptophan synthase activity, in L-tryptophan biosynthesis in the chloroplast.
