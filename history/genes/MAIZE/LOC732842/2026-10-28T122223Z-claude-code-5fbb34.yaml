  details: |
    Created the review of maize LOC732842 (K7TTR0, orp1/TSB1, chloroplast tryptophan synthase beta subunit). Read PMID:18430213 in full: recombinant ZmTSB1 has the beta-reaction alone and forms an alpha2beta2 complex with ZmTSA that performs the overall reaction. Accepted the IBA/IEA L-tryptophan biosynthesis and tryptophan synthase rows (contributes_to), recorded a WRONG_QUALIFIER source defect on the IEA enables GO:0004834 row, modified the IBA cytoplasm row to chloroplast, accepted the chloroplast IEA row, and added a NEW IDA row for GO:0052684 (indole + L-serine beta-reaction). Added a small reproducible sequence comparison against Swiss-Prot P43283 and the TSB2 paralog K7TR93.
