  summary: Full re-review of A0A804UIX9 independent of ProtNLM2 predictions
  details: |
    No GOA annotations exist. Rewrote the description to record that the canonical T001 gene model (375 aa) appears to end in a frame-shifted, non-conserved C-terminal tail (residues ~298-375), based on comparison with the alternative transcript T002 (A0A804R394) and the tandem paralog Zm00001eb380900 (A0A804R017). Corrected the family framing: PANTHER PTHR24177 'CASKIN' contains only plant proteins (12,734 of 12,734 in Viridiplantae; human CASKIN1 is in PTHR24174), and ACD6/ITN1/NPR4 sit in a different family (PTHR24186), so ACD6 is a domain-level relative only and no functions were transferred. Replaced a non-verbatim falcon quote with UniProt Phobius features and the new bioinformatics/RESULTS-rereview.md (gene_model_rereview.py). Flagged the OpenScientist report as DISPUTED for its cross-kingdom CASKIN claim. Core function is unchanged (root MF, membrane). Started an append-only notes file.
