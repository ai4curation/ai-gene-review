  summary: 'Create review: C6F010'
  details: |
    New review of maize ZmrbohD alpha splice variant (C6F010, GeneID 100136880), identified from the 932-aa ORF in the cloning paper (PMID:19592501). All six IEA rows reviewed: peroxidase activity and the derived cellular oxidant detoxification removed as a wrong InterPro2GO mapping of IPR013623 (with source_defects), oxidoreductase rows modified to superoxide-generating NADPH oxidase activity, membrane modified to plasma membrane, calcium ion binding kept as non-core. Key paper PMID:20693409 read in full (expression evidence only). ZmRBOH4 genetics (PMID:38238629) probably refer to this locus but are left as a suggested question. Added a reproducible identity analysis against Arabidopsis RBOHs.
