  details: |
    New review of maize brd1/CYP85A1 (A0A804M0I4, GeneID 100193331 = GRMZM2G103773), the brassinosteroid C-6 oxidase. All 5 IEA rows reviewed: monooxygenase and paired-donor oxidoreductase rows modified to steroid hydroxylase activity and the flavoprotein-donor P450 class; iron and heme binding kept as non-core; membrane accepted. Added NEW ISS brassinosteroid biosynthetic process based on CYP85A1 ortholog biochemistry (PMID:11402205) and the brassinolide-rescuable brd1-m1 null (PMID:22292043, full text read). Proposed a brassinosteroid 6-oxidase activity term. Manual literature synthesis written because no deep-research provider was available.
