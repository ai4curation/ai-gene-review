  details: |
    New review of maize LOC100135422 (A0A804RGV6, ZmPMP3-1, PMP3/RCI2 family proteolipid). Mapped the locus to ZmPMP3-1 of PMID:22348040 (the paper's EU364580 is a typo for EU364508). The single IEA membrane row was modified to plasma membrane and a NEW plasma membrane IDA row was added from the GFP plasmolysis assay. No MF or BP was asserted because the family has no known molecular activity and yeast complementation and overexpression phenotypes do not meet the NEW-term bar.
