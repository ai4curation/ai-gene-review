  summary: 'Create review: LOC100037794'
  details: |
    New review of maize ZmrbohB (A0A1D6ND49, GeneID 100037794), a plant respiratory burst oxidase homologue with no experimental GOA rows. Removed the InterPro2GO peroxidase activity row and the derived cellular oxidant detoxification row (with source defects), modified the IBA H2O2-forming NAD(P)H oxidase row and the generic oxidoreductase rows to superoxide-generating NADPH oxidase activity (source defect against PAINT node PTN000944270), accepted plasma membrane, refined membrane to plasma membrane and kept calcium ion binding as non-core. PMID:20693409 was read in full and supports only BR-induced ZmrbohB expression, so no new process terms were added.
