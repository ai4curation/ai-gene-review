  summary: 'Create review: id1'
  details: |
    Created the review of maize INDETERMINATE1 (O65215). All 9 GOA rows were reviewed: the IBA DNA-binding transcription factor activity and both nucleus rows were accepted, grounded in direct maize evidence (in vitro ID-domain DNA binding, PMID:15020707; nuclear immunolocalization, PMID:17307745). Sequence-specific DNA binding, regulation of transcription and regulation of timing of the vegetative-to-reproductive transition were accepted. Positive regulation of transcription was kept as non-core because activation is shown only for the rice ortholog. The rice-projected long-day and short-day photoperiodism-of-flowering rows were marked over-annotated because ID1 acts in the photoperiod-independent autonomous pathway. PMID:21730358 was read in full. A manual literature synthesis was written in place of deep research.
