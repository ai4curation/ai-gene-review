  details: |
    Created the O2 (Opaque-2) review on the Swiss-Prot entry P12959, which fetch-gene resolved in place of the task-named TrEMBL entry B4FHZ3; NCBI Gene 542375 lists both as products of the same locus. Reviewed all 7 GOA rows: transcription factor activity, cis-regulatory region binding and regulation of transcription (IBA and IEA) were refined to DNA-binding transcription activator activity, cis-regulatory region sequence-specific DNA binding and positive regulation of DNA-templated transcription; nucleus rows were accepted. Added one NEW row, regulation of starch biosynthetic process, from direct O2 transactivation of PPDK1, PPDK2 and SSIII promoters. Literature work was done manually (deep-research-manual and notes), including full text of PMID:22937104.
