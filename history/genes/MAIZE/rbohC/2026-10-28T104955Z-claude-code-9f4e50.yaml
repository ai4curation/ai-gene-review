    Created the review of maize rbohC (ZmrbohC, UniProt A5H238, GeneID 100101532, Zm00001d038762). All 6 IEA rows reviewed: peroxidase activity and the derived cellular oxidant detoxification removed as a wrong InterPro2GO mapping (source_defects recorded); oxidoreductase activity and NAD(P)H oxidase (O2 acceptor) activity modified to superoxide-generating NADPH oxidase activity (GO:0106292); membrane modified to plasma membrane; calcium ion binding kept as non-core. Literature work done manually (no deep-research key): cloning paper PMID:19592501, brassinosteroid expression study PMID:20693409, and genetic studies PMID:36045577 and PMID:41792868 whose ZmRBOHC identity is probable but not confirmed, so no NEW process rows were added.
