  summary: 'Create review: LOC100273383'
  details: |
    New review of maize pr1 (red aleurone1, ZmF3'H1/CYP75B3; UniProt A0A1D6HC18, GeneID 100273383, GRMZM2G025832). Identity confirmed via NCBI Gene aliases and the cloning paper (PMID:21385724). All seven GOA rows (six IEA, one IBA) reviewed: flavonoid 3'-monooxygenase activity accepted as core on the basis of tt7 complementation and pr1 mutant chemistry (PMID:21385724, PMID:23113982); generic monooxygenase, oxidoreductase (IBA) and paired-donor oxidoreductase rows modified to GO:0016711; heme and iron binding kept as non-core; membrane accepted. One NEW IMP row for flavonoid biosynthetic process, since the enzyme catalyses the 3'-hydroxylation step in both anthocyanin and 3-deoxyflavonoid branches. Manual literature notes added in place of deep research.
