  summary: 'Create review: MRP1'
  details: |
    Created the review of maize MRP1 (ZmMRP1, Q6Y3I1), a full-size ABCC/MRP ABC transporter. All six GOA rows are IEA domain inferences: ABC-type transporter activity, ATP hydrolysis activity, membrane and transmembrane transport were accepted as as precise as the evidence allows; ATP binding kept as non-core; nucleotide binding marked TOO_GENERAL. The literature (cloning paper and three RT-PCR induction studies) gives only expression data, so no NEW terms were added. A local NBD motif scan confirmed one consensus ATP site. A UniProt ARBA phytic-acid FUNCTION statement transferred from the lpa1/ABCC5-like subfamily was recorded as a CHECK source defect.
