  summary: 'Create review: SXD1'
  details: |
    Created the SXD1 (maize tocopherol cyclase, Q94FY8) review. All 8 GOA annotations were accepted: tocopherol cyclase activity (EXP, IBA, IEA) is supported by in vitro activity of recombinant SXD1 and Synechocystis complementation (PMID:12913173); vitamin E biosynthetic process (IBA, IEA) by the absence of tocopherols in sxd1 mutants (PMID:17924136); chloroplast (IEA) by experimental localization (PMID:11340186); plastoglobule (IBA, IEA) by orthology to Arabidopsis VTE1 (PMID:16414959). No NEW terms were proposed: the sucrose-export, callose and plasmodesma phenotypes are indirect consequences of tocopherol deficiency. Literature synthesis was done manually (no deep-research provider).
