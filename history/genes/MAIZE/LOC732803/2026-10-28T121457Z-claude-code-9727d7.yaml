  summary: 'Create review: LOC732803'
  details: |
    New review of maize LOC732803 (K7TR93; orange pericarp 2, TSB2, chloroplast tryptophan synthase beta subunit). Symbol fetch first resolved to the alternative transcript entry A0A804RDH5; re-fetched pinned to K7TR93 (GeneID 732803), which carries its own six GOA rows. Accepted L-tryptophan biosynthesis (IBA, IEA), contributes_to tryptophan synthase activity (IBA) and chloroplast (IEA); accepted the IEA enables tryptophan synthase activity row with a WRONG_QUALIFIER source defect (should be contributes_to); modified the IBA cytoplasm row to chloroplast. Added a NEW IC row for the beta-reaction GO:0052684 based on beta activity in tsb1 single-mutant leaf extracts (PMID:18430213), flagged for expert review given the GO convention of annotating type-1 TSBs only to GO:0004834. Added a sequence comparison (PLP lysine K174; QALNVFR peptide shared by TSB1 and TSB2) and manual literature notes.
