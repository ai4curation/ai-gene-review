  details: |
    New review of maize ZmbZIP60 (B6SNH0, Zm00001d046718), the unspliced ER-anchored precursor of the IRE1-spliced UPR transcription factor. All five IEA rows reviewed: DNA-binding TF activity, sequence-specific DNA binding and nucleus accepted; ER membrane kept as non-core; regulation of transcription modified to positive regulation. Added NEW endoplasmic reticulum unfolded protein response (IC) after a comparator check against Arabidopsis bZIP60 and XBP1. Recorded the missing 258-aa spliced product as a functional isoform with a UniProt MISSING_ISOFORM source defect. Literature: PMID:22417282 (full text), PMID:22307781 and PMID:32843434 (abstract only), PMID:30008724.
