  details: |
    New review of maize LOC542352 (A0A804Q7E0), an acidic PR-1 type CAP-domain protein with a predicted signal peptide. The single GOA row (extracellular region, InterPro2GO IEA) was accepted on signal peptide plus PR-1 family evidence. Core function uses the root MF term in the extracellular region, since sterol binding and antimicrobial defence are family-level inferences not tested for this gene. PMID:23113982 and PMID:21385724, associated with this gene via its PR1 alias, concern the unrelated pr1 (red aleurone1) flavonoid 3'-hydroxylase locus and were recorded as MISCITED; the NCBI gene2pubmed link is flagged as an upstream symbol-collision error.
