  details: |
    De novo review of maize LOC542140 (ZmGT1, OPT-family glutathione transporter), UniProt A0A804M424 (re-fetched with --uniprot-id after fetch-gene first resolved sibling entry A0A804M423 of the same gene Zm00001eb057440). Reviewed all 6 GOA rows: oligopeptide transporter activity (IBA, IEA) and oligopeptide transmembrane transport (IEA) set UNDECIDED because the authors' yeast GSH-uptake claim is uninspectable and the 80%-identical ortholog AtOPT3 transports Fe/Cd/Cu; plasma membrane IBA accepted; membrane IEA modified to plasma membrane; transmembrane transport accepted. Added one NEW IC row for transmembrane transporter activity as the core MF, plus manual literature notes and a reproducible pairwise-identity analysis.
