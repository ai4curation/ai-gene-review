  summary: 'Create review: LOC542106'
  details: |
    Created review of maize LOC542106 (K7WCD1, beta-expansin EXPB1b, a Zea m 1 group-1 pollen allergen ~98% identical to EXPB1/Zea m 1d P58738). The single GOA row (extracellular region, IEA InterPro2GO) was modified to plant-type cell wall based on Zea m 1d cell-wall/GAX binding plus signal peptide and CBD-like domain. Added NEW plant-type cell wall loosening (ISS from Zea m 1d wall-extension data). PMID:17225858 was read in full: its Mu allele is assigned to the EXPB1 cDNA AY197353 (P58738), so the pollen-competition phenotype was treated as paralog background and no pollen-tube process term was added. Core function uses a proposed nonenzymatic cell wall loosening MF.
