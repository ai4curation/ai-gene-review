  summary: 'Create review: LOC541618'
  details: |
    New review of maize ZmMPK5 (LOC541618, K7VAM9), a TEY-type group A MAP kinase most similar to Arabidopsis MPK6. All 12 IBA/IEA rows reviewed: MAP kinase activity and MAPK cascade accepted as core; generic kinase, transferase, Ser/Thr kinase and intracellular signal transduction rows refined (MODIFY) to MAP kinase activity and MAPK cascade; nucleotide binding refined to ATP binding; nucleus and cytoplasm IBA rows accepted on BiFC support. Evidence from PMID:20693409, PMID:23956414 and PMID:26096642 (immunocomplex kinase assays on MBP, ZmMAP65-1a and ZmABA2 Ser173). No NEW process terms, since BR/ABA/H2O2 roles rest on pharmacology and transient expression. Added manual research notes and a small motif/identity analysis.
