  summary: 'Create review: BX1'
  details: |
    New review of maize BX1 (P42390), the chloroplast indole-3-glycerol phosphate lyase at the branch point of benzoxazinoid biosynthesis. All 8 IBA/IEA rows reviewed against Kriechbaumer 2008 (full text), Frey 2000 (full text) and abstracts of Frey 1997, Kulik 2005 and Richter 2021. The indole-3-glycerol-phosphate lyase activity and chloroplast rows were accepted. Tryptophan synthase activity rows were modified to indole-3-glycerol-phosphate lyase activity and L-tryptophan biosynthesis rows to indole biosynthetic process, because BX1 does not bind TSB and is absent from the tryptophan synthase complex. The bacterial-donor cytosol IBA was removed. Chloroplast stroma was added as a NEW IC location. Source defects were recorded for the PAINT and UniProt propagations and for a suspect UniProt kcat value, and a benzoxazinoid biosynthetic process term was proposed.
