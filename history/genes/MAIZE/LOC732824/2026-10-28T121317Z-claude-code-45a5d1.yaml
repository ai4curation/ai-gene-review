  details: |
    New review of maize ZmCCaMK (LOC732824, A0A804P0P6), a calcium and calcium/calmodulin-dependent protein kinase. All 8 GOA rows are IEA molecular-function rows: calcium/calmodulin-dependent protein kinase activity and calcium ion binding accepted as core, ATP binding kept as non-core, protein kinase and protein serine/threonine kinase activity modified to the Ca2+/CaM-dependent kinase term, and kinase, transferase and nucleotide binding marked too general. Two NEW rows were added from maize literature not yet in GOA: nucleus (YFP fusion and BiFC, PMID:22865912, PMID:27208250) and calmodulin binding (PMID:33864702). No process term was added; ABA/BR-induced antioxidant signalling is raised as a suggested question. Literature compiled manually (no deep-research provider).
