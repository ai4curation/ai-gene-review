  summary: 'Full re-review: A0A8C5FPT8 (cod tbc1d14), independent of ProtNLM2'
  details: |
    Full re-review independent of ProtNLM2 predictions. A new MAFFT/NJ analysis (bioinformatics/RESULTS-rereview.md) shows A0A8C5FPT8 is an alternative gene model of ENSGMOG00000018292, with a non-conserved N-terminus and 48-aa C-terminal tail. It groups with vertebrate TBC1D14 rather than TBC1D12, which contradicts the PANTHER SF15 placement. GTPase activator activity changed UNDECIDED -> MARK_AS_OVER_ANNOTATED (no GAP activity for the ortholog across 47 Rabs, PMID:22613832). Enzyme binding -> MODIFY to small GTPase binding plus protein kinase binding. Cytoplasmic vesicle -> MODIFY to recycling endosome. Added NEW regulation of autophagosome assembly (TBC1D14-clade PAINT node PTN008586039 plus ortholog mechanism). Rewrote description and core function; added PMID:22613832, PMID:26711178 and file references; created notes file.
