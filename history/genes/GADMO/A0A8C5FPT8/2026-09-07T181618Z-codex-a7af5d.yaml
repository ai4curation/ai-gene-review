    GO:0005776 (autophagosome): CNN -> COR. The target has TBC1D14-like architecture and a strong phmmer match to reviewed bovine TBC1D14 A6H7I8 (reported score 791.8 in the raw evidence record). QuickGO records human TBC1D14 Q9P2M4 at autophagosomes with an IDA assigned by BHF-UCL from PMID:22613832, alongside a curated IBA; these are verified annotation records rather than an AI verdict. The paper emphasizes recycling endosomes and Golgi redistribution, so the localization should not be read as exclusive or constitutive autophagosome residence. The conserved sequence relationship and experimentally grounded curator annotation support broad localization transfer to cod despite the differing PANTHER subfamily label. The target itself lacks this term in cached GOA/UniProt, making this a supported additional annotation, not a target experiment or an existing target match.

