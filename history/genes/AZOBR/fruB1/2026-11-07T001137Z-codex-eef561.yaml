  summary: Address fructose PTS review evidence clarity for AZOBR/fruB1
  details: |
    The primary reference now records native PTS1 induction, promoter evidence and the architecture inference separately. It does not measure purified domain-to-domain kinetics or phosphosite chemistry. The EIIA-to-EIIB proposal uses the same definition as PSEPK and RHOCA, with the Sp7-specific evidence limits retained. [PMID:39817736 "Analysis of the proteome of A. brasilense Sp7 grown on fructose as sole carbon source showed upregulation of all the three components of a fructose PTS (designated as Fru-PTS1); FruA (AMK58_25875), FruK (AMK58_25880), and FruB (AMK58_25885)."] Original row fields/order and protected sources are preserved; focused validation, rendering and source hashes are recorded in the round1 audit.
