  summary: 'Create review: LhpG (A. brasilense KGSADH-III, hydroxyproline-pathway
    terminal dehydrogenase)'
  details: |
    Created during PR #6274 review follow-up, after the PTHR43353:SF3 membership was re-derived and showed that the subfamily contains the only characterized terminal dehydrogenase of the hydroxyproline pathway. Q08IB7 is KGSADH-III, purified from hydroxy-L-proline-grown A. brasilense and hydroxyproline-inducible, as against the aldarate-inducible KGSADH-II of the same organism. The EXP GO:0047533 row and the electronic GO:0044104 row are both accepted: UniProt curates both cofactor reactions from the same study, with a roughly 75-fold lower Km for NADP+ but a higher Vmax with NAD+, so these are two cofactor branches of one reaction rather than competing claims. The two broad oxidoreductase IEA rows are changed to those two children. GO:0019470 is added as NEW with evidence_type IEP, because the assignment of this isozyme to the hydroxyproline route rather than the aldarate route rests on induction and on the growth substrate used for purification. Deep research unavailable (provider API 403). This review gives the module terminal step a characterized in-pathway exemplar and settles the cofactor question raised in review of PP_1256.
