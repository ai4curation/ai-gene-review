  summary: New full review of A. gambiae CLIPA8, noncatalytic CLIP-SPH reference for
    PTN000667087 transfer
  details: |
    Created the CLIPA8 (A0A1S4H5S2) review from scratch as the experimentally characterised noncatalytic relative of DROME/scaf at PAINT node PTN000667087, independent of ProtNLM2 predictions. Falcon deep research failed (Edison 403) and the perplexity-lite fallback failed; literature was found via PubMed E-utilities and cached (PMID:16922859, 24039584, 31765430, 37918462, 37703846, 28780069). Added a catalytic-triad motif scan (CLIPA8-bioinformatics/) showing the catalytic Ser is Gly. All 16 GOA rows reviewed: REMOVE serine-type endopeptidase activity and proteolysis (IEA InterPro; pseudoenzyme, CLIPA8 is a substrate not a protease); ACCEPT extracellular region (IBA, 3 IDA, IEA), the IMP immune/melanization/protein-processing rows and the innate immune response IBA. No NEW terms and no MF asserted, because a cofactor activity has not been shown biochemically; recorded as a BIOLOGY knowledge gap. Notes record that only node-level IBA claims (extracellular, innate immunity) are shared with Scaf by descent.
