  summary: 'Create review: sseJ (Q9FD10), testing the PTN005219546 GO:0008610 IBD
    on a leaf'
  details: |
    Full de-novo review of Salmonella Typhimurium SseJ (UniProtKB:Q9FD10), all 15 GOA rows actioned, plus a notes file with inline provenance (genes/SALTY/sseJ/sseJ-notes.md). No deep-research provider file; notes written from primary literature (PMC full text for PMID:19887681, PMID:16177296, PMID:18996344, PMID:12496192; abstract-only for PMID:18333886 and PMID:22740689, flagged with full_text_unavailable).

    Commissioned to test, on a leaf, the argument in genes/PSEAE/estA that the PAINT IBD for GO:0008610 lipid biosynthetic process at PANTHER node PTN005219546 does not hold for its clade. Answer: the claim IS supported for SseJ, on evidence independent of the seed, but the IBD is still unsound as a node assertion. SseJ is a glycerophospholipid:cholesterol acyltransferase: purified protein activated by RhoA-GTP converts phosphatidylcholine plus cholesterol to lysophosphatidylcholine plus cholesteryl ester with products identified by TLC (PMID:19887681), and infection raises cholesteryl ester and lipid droplets in host cells (PMID:18333886). SseJ itself performs the acyl-transfer step, so this is participation, not necessity, and GO:0008610 is ACCEPTed (no cholesteryl-ester biosynthesis term exists; proposed_new_terms raises one). Tree inspection with projects/PSEUDOCAP/panther_tree.py (2026-11-06) shows SseJ is in PTHR45642:SF141 with Vibrio VC_A0218 and Xanthomonas estA under node PTN005220549, not in EstA's SF139 carboxylesterase subfamily, so the source_defects entry asks GO Central to re-scope the LUCA IBD and consider a new IBD at PTN005220549 seeded by SseJ's own IDA rows. This corrects a statement in the earlier estA GO_CENTRAL defect report that SseJ offers no positive evidence for a biosynthetic process.

    Other actions: GO:0034736 and GO:0047178 (both AgBase IDA, PMID:19887681) MODIFYed to GO:0004607 phosphatidylcholine-sterol O-acyltransferase activity, because the assays contain no CoA and neither term's definition matches the reaction; recorded as source_defects. GO:0016298 (x2), GO:0016788 and GO:0052689 MODIFYed to GO:0106435 carboxylesterase activity (the assayed substrates are p-nitrophenyl esters). GO:0005515 MODIFYed to GO:0031267 per the protein-binding policy. GO:0031267 (x2) and GO:0044174 (x2) ACCEPTed. GO:0033644 MODIFYed to GO:0140221 pathogen-containing vacuole membrane. GO:0030430 TOO_GENERAL (entailed by GO:0044174). GO:0005576 MARK_AS_OVER_ANNOTATED (SubCell Secreted keyword mapping; no extracellular pool shown).

    Validated with 'just validate SALTY sseJ' (valid, no errors) and 'just backfill-record-sections genes/SALTY/sseJ' (added 5 record_section values).
