  summary: 'Create dashboard PredictionReview: ybbO (AYCY01000026.1_161)'
  details: |
    Created the KBase gene-annotate dashboard PredictionReview for Salmonella enterica AYCY01000026.1_161. It follows the earlier genes/BACSU/ybbH/ybbH-dashboard-predictions-review.yaml (#5754). The dashboard's GO:0016491 (oxidoreductase activity) call is assessed CNN (confidence 2): GOA already holds exactly that term for Q7CR11 as an IBA, so LSP cannot apply. Evidence sidecars in ybbO-dashboard-prediction-evidence/: prediction.json (the dashboard call and query sequence) and identity_results.json (query 99.6% identical to Q7CR11, single substitution I244L outside the N105/S133/Y146/K150 catalytic tetrad; 91.0% global identity to E. coli YbbO P0AFP4). Function is supported by PMID:27134112 and PMID:25108218 (E. coli YbbO, NADP(+)-dependent aldehyde reductase). PR review fixes removed an unquoted critique of the dashboard pipeline and reconciled the 91.0/90.6 identity figures. If the companion review's MODIFY to GO:0008106 lands in GOA, this assessment would become LSP.
