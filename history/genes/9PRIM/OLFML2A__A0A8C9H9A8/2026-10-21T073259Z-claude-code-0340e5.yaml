  summary: 'Create review: OLFML2A (Piliocolobus tephrosceles A0A8C9H9A8)'
  details: |
    De-novo review of the full-length red colobus OLFML2A (A0A8C9H9A8), independent of ProtNLM2 predictions. Falcon deep research failed (authentication; perplexity-lite fallback out of quota), recorded in notes. Orthology to human Q68BL7 and mouse photomedin-1 Q8BHP7 grounded by shared PANTHER subfamily PTHR23192:SF29 and a reproducible pairwise comparison (97.5% / 84.0% identity, signal peptide, CXCXCX9C motifs). Extracellular region IEA accepted; TreeGrafter signal transduction left UNDECIDED (PAINT IBD seeded from noelins/myocilin, not Olfml2a). Added NEW extracellular matrix binding and extracellular matrix location as ortholog (ISS) inferences from mouse IDA; no function is experimentally established in this species.
