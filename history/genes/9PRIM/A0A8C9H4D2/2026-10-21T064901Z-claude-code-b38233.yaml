  summary: 'Full re-review: A0A8C9H4D2 (OLFML2A short isoform)'
  details: |
    Full re-review independent of ProtNLM2 predictions. Identified A0A8C9H4D2 (439 aa, XP_023072933.1) as the short alternative-first-exon isoform (human isoform 3 counterpart) of Piliocolobus OLFML2A, lacking the signal peptide, both CXCXCX9C motifs and the coiled coil; full-length same-gene product is A0A8C9H9A8. Added alignment analysis (A0A8C9H4D2-bioinformatics/). Extracellular region IEA changed ACCEPT -> MARK_AS_OVER_ANNOTATED (no signal peptide on this product); signal transduction IEA changed MARK_AS_OVER_ANNOTATED -> UNDECIDED (deliberate PAINT IBD placement, consistent with human OLFML2A). Replaced unsupported core function GO:0005201 ECM structural constituent with caveated GO:0050840 ECM binding from mouse photomedin-1 (PMID:15836428). Rewrote description; added notes file.
