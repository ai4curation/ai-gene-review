  details: |
    Audited genes/9PRIM/A0A8C9H4D2/A0A8C9H4D2-protnlm-predictions-review.yaml against the source-independence and final-state prose guidelines in .claude/skills/review-function-prediction/SKILL.md.

    Replaced rationale prose with the current assessment, traced biological claims to sequence/domain records, primary publications, and where relevant experimentally grounded curated annotations or reproducible analysis. Removed AI/OpenScientist verdicts as supporting evidence and unsupported error-mechanism claims. Source prediction terms and method/version metadata were preserved. Existing annotation overlap is separated from biological correctness and is not evidence of training-data contamination.

    GO:0031012 (extracellular matrix): COR -> COR. The target has an olfactomedin domain and an OLFML2A subfamily assignment in the sequence record. Mouse photomedins are secreted and bind extracellular glycosaminoglycans (PMID:15836428), supporting matrix association by transfer within this vertebrate subfamily. This is a family-based localization inference, not a localization experiment on the primate protein; the deposited sequence has no annotated signal peptide, so its completeness and secretion route remain unresolved. Extracellular matrix is absent from the cached GOA/UniProt annotations and is more specific than their extracellular region/space terms.

    GO:0030198 (extracellular matrix organization): COR -> UNC. Mouse photomedin secretion and glycosaminoglycan binding support extracellular matrix association (PMID:15836428). They do not demonstrate assembly, rearrangement, or disassembly of the matrix, which is the process predicted here. Neither the target olfactomedin domain nor its OLFML2A placement establishes that additional role. Matrix organization is absent from the cached annotations, and a functional study of a sufficiently close relative or the target is needed to support this process.

