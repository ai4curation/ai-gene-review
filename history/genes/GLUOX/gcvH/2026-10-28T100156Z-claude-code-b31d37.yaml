  summary: Correct reference_review enum, replace a non-bearing supporting quote,
    complete a truncated quote, and record the METEA/gcvH follow-up
  details: |
    Three defects found in pre-review triage of PR #5652. (1) PMID:40301604 reference_review.correctness read MISCITED, which machine-asserts that this review miscites the paper; it does not. The review cites it for the B58 screen and for the Table 2 / Discussion TypA identification, both accurately quoted, and the existing review_notes already said it was correctly cited. Set to VERIFIED with relevance LOW, and reworded the notes to locate the misattribution upstream in the curation handoff that equated GO_1096 with Q5FRY1 rather than in this review. (2) The GO:0005737 to GO:0005829 MODIFY carried only the CC:SUBUNIT composition quote, which says nothing about localization and cannot support a cytosol refinement. Replaced with the CC:FUNCTION shuttling quote already used on the sibling GO:0005829 row, record_section updated and confirmed by backfill-record-sections. (3) The GO:0009249 RESULTS.md quote ended mid-sentence at octanoyl-ACP, and; completed to include GcvH is one acceptor among several, in both the supported_by entry and the references findings entry. All three altered quotes were negative-controlled: each perturbation produced the expected not a verbatim substring error and was then restored. Also added an explicit follow-up section to gcvH-notes.md recording that genes/METEA/gcvH on main both ACCEPTs GO:0009249 and lists it under core_functions.directly_involved_in, which this PR's acceptor-versus-donor argument contradicts; a UniProtKB REST check of organism_id 272630 finds LipB and LipA and no lipM or lipL match, so M. extorquens AM1 is on the E. coli side of the line too. That gene was deliberately not edited here, and per CLAUDE.md the item is a curation gap and so belongs in notes rather than knowledge_gaps.
