  summary: Create gene review for Gluconobacter oxydans gcvH (Q5FRY1), the glycine
    cleavage system H protein
  details: |
    Reviewed all 5 GOA rows (all IEA). MODIFY GO:0005737 cytoplasm to GO:0005829 cytosol; ACCEPT GO:0005829, GO:0005960 glycine cleavage complex and GO:0019464 glycine decarboxylation via GCS; MARK_AS_OVER_ANNOTATED GO:0009249 protein lipoylation with a propagation_review (GcvH is the lipoyl acceptor, and the Bacillus-type LipM/LipL donor relay requires enzymes absent from this genome); added one NEW IC row for GO:0140104 molecular carrier activity as the unrepresented core molecular function. Added a reproducible UniProt REST survey under gcvH-bioinformatics showing a complete P/T/H/L system with a gcvTHP operon at GOX1095-GOX1097 and a LipB-type lipoylation route. Notes record that the CMMMech neodymium record grounds this accession to the Marecos 2025 strain B58 locus GO_1096, which that paper assigns to the GTP-binding protein TypA/BipA (GOX0636, Q5FT83 in 621H), so the grounding rests on a locus-tag coincidence and not orthology.
