  summary: Create ai-gene-review for Gluconobacter oxydans 621H GOX1598 (Q5FQK7),
    an uncharacterised aldo-keto reductase with no GO annotations
  details: |
    Reviewed UniProtKB Q5FQK7 (TrEMBL, PE 4, locus GOX1598). GOA and QuickGO return zero annotations; none of IPR023210/IPR036812/IPR050523 has an interpro2go mapping and PAINT places no node annotation on the lineage, so there was nothing to review and one NEW row was added: GO:0016616 oxidoreductase activity acting on the CH-OH group of donors NAD or NADP as acceptor, ISS, enables. Support is four independent AKR signature matches plus a reproducible alignment analysis (GOX1598-bioinformatics/) that maps curated ACT_SITE/SITE/BINDING features of five reviewed AKRs onto an intact catalytic tetrad Asp62/Tyr67/Lys101/His147; cofactor preference and substrate are explicitly left unresolved and recorded as knowledge gaps. Filed one source defect requesting an interpro2go mapping of IPR023210 to GO:0016491. Documented that the CMMMech grounding of this accession to the Marecos 2025 strain-B58 locus GO_1598 is a locus-tag collision: that locus is an orotate phosphoribosyltransferase whose 621H counterpart is pyrE/GOX1998 (Q5FPG2).
