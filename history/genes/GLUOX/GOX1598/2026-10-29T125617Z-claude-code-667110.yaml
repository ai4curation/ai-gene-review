  summary: Scope the Tas nearest-relative claim to the CDD cd19094 assignment; correct
    the interpro2go defect rationale and record its query
  details: |
    Review-response correction (PR #5653, CHANGES_REQUESTED). (1) BLOCKING: the phrase "closest reviewed relative" / "closest characterised relative" for E. coli Tas was an unsourced superlative over reviewed UniProt. map_akr_catalytic_sites.py aligns five hand-picked references (REFERENCES, lines 44-50) and runs no database search, so it can rank only those five. The claim it was carrying - that Tas is the characterised protein to reason from - now rests on evidence that designates the group independently of any identity panel: the entry's own cross-reference "DR   CDD; cd19094; AKR_Tas-like; 1.", verified present in GOX1598-uniprot.txt and already quoted in this review with record_section DR:CDD. The 50.4% figure is retained everywhere with its bound stated ("the most similar of the five references aligned here"). Eight occurrences were corrected, two more than the review enumerated: description, the RESULTS.md findings[1].statement and its supporting_text, the PMID:14517983 findings[0].statement, that reference's review_notes, the first knowledge_gaps gap_statement, GOX1598-notes.md section 3 and section 4, and RESULTS.md. RESULTS.md also now states in the Method section that the script runs no database search and that the identity column ranks only those five proteins. The superseded wording is folded into GOX1598-notes.md as an explicit marked withdrawal; a folder-wide grep including the rendered HTML confirms zero surviving live assertions. No term, action, evidence code, core function or knowledge gap changed. (2) The interpro2go source defect's explanation gave cofactor heterogeneity as the reason to request nothing narrower than GO:0016491. That rationale was wrong - GO:0016616 is itself "NAD or NADP as acceptor" and so accommodates both - and the explanation ships to the InterPro/GO external2go maintainers verbatim. Rewritten on donor-group heterogeneity, checked rather than transcribed: IPR023210 also matches human AKR1D1 (UniProtKB:P51857, verified DR InterPro; IPR023210 and Pfam PF00248), a Delta(4)-3-oxosteroid 5-beta-reductase of EC 1.3.1.3 with ECO:0000269 evidence, whose donor is a CH-CH group (GO:0016628). QuickGO is_a ancestor sets confirm GO:0016616 and GO:0016628 share no ancestor below GO:0016491, so GO:0016491 is the most specific term holding for every match. The review's suggestion that the AKR6 potassium-channel beta subunits are non-catalytic was not adopted: UniProt Q13303 (KCNAB2) does credit them with NADPH-dependent aldoketoreductase activity, by similarity and without a physiological substrate, so they are recorded that way instead. The conclusion (GO:0016491, requested_change ADD, confidence CONFIRMED) is unchanged. (3) The load-bearing P0A9T4 / IPR020471 contrast, and the statement that Tas's GO:0008106 rests only on NAS:EcoCyc, were asserted without provenance. Both come from one QuickGO query, now recorded in the defect explanation and in GOX1598-notes.md section 2 in the same form as the existing Q5FQK7 zero-hits query: 5 rows for UniProtKB:P0A9T4, including GO:0016491 IEA GO_REF:0000002 withFrom InterPro:IPR020471 assignedBy InterPro, and exactly one GO:0008106 row, NAS from PMID:14517983 assignedBy EcoCyc. Negative control run on the one altered quote: perturbing it makes the validator fail at references[1].findings[1].supporting_text with "Supporting text is not a verbatim substring of file:GLUOX/GOX1598/GOX1598-bioinformatics/RESULTS.md"; restored and clean. backfill-record-sections reports 0 changes and 0 mismatches, just validate GLUOX GOX1598 passes, render regenerated.
