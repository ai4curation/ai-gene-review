  summary: Correct over-reaching source citations in GOX1598 review
  details: |
    Triage correction: three places where a source was asked to carry more than it can. (1) The PTHR43364:SF4 substrate-heterogeneity argument cited PTHR43364-entries.csv for "a dozen uncharacterised bacterial members"; that file is a 55-row sample (21 of them :SF4) of a family whose own metadata counters give proteins: 68362 in subfamilies: 11, so no count is supportable from it. The count is dropped, named characterised and uncharacterised members are given instead, and both the notes and RESULTS.md now state that the entries CSV is a sample and that the metadata counters are the artifact for any membership number. The substrate-heterogeneity conclusion is unchanged: it rests on AKR7A2/A3, YdjG, IolS and Tas having unrelated substrates. (2) The annotation reason claimed PAINT "placed no ancestral annotation on the lineage this protein descends from", sourced to PTHR43364-paint.tsv. That file carries nodes, GO ids, seeds and taxon scopes and no tree topology, so it cannot establish descent, and PTN000199659 does carry GO:0008106 (F, IBD), which made the wording misleading. The claim now rests on the route the review already gave: Q5FQK7 has no GOA row at all and therefore no IBA, so nothing was propagated to it. No tree-position assertion is made anywhere. (3) The interpro2go source defect said the missing mapping "is why UniProtKB:Q5FQK7 carries no GO annotation of any kind". Softened to the scoped claim: no entry matched by this protein (IPR023210, IPR036812, IPR050523) has a mapping, so it receives no InterPro-derived GO annotation; other AKR entries are mapped, and E. coli Tas (P0A9T4) does get GO:0016491 by IEA GO_REF:0000002 through IPR020471, which Q5FQK7 does not match. requested_change ADD, resource and confidence unchanged. The corresponding suggested_question was scoped the same way. No action, term, evidence code, core function or knowledge gap changed; no conclusion was weakened.
