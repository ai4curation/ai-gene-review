  summary: 'Rest GO:0006007 on chemistry, not necessity; align label convention: gdh'
  details: |
    PR #6790 round-2 review follow-up (blocking item 2, suggestions 6 and 9).

    Item 2. The round-1 reason on the GO:0006007 NEW row asserted that mGDH catalyses 'the first and
    committing step of glucose breakdown in this organism' and that 'the route stops when it is
    removed'. Its own supporting quote refutes that: the mutants 'completely consumed the glucose but
    produced neither gluconate nor the secondary products 2-ketogluconate and 2,5-diketogluconate'
    (PMID:20453146). Glucose catabolism continues without mGDH; what stops is gluconate formation.
    This was the necessity-for-participation substitution CLAUDE.md warns about.

    GO:0006007 is unchanged and now rests on the direct-chemistry ground alone: mGDH itself oxidizes
    free D-glucose to D-glucono-1,5-lactone, a glucose-catabolizing reaction carried out by this
    protein. The committing-step and route-stops framing is deleted from both the summary and the
    reason, and the knockout result is cited as what it is, a loss of gluconate and ketogluconates.

    Suggestion 9. The proposed_new_terms justification now says outright that the case for the term is
    ontological: the quoted evidence establishes only the oxidation and the gluconate loss, and the
    argument for a dedicated class rests on the state of the ontology after the GO:0019595 and
    GO:0046178 obsoletions and on the breadth of the route across the Acetobacteraceae and
    pseudomonads, for which no systematic survey is cited.

    Suggestion 6. This PR had used two opposite label-vs-cache conventions. The convention adopted for
    both files is GO's current label, with the transient validation warning accepted until the shared
    cache/go/terms.csv is refreshed in its own PR. Accordingly the authored slots here
    (proposed_replacement_terms on the oxidoreductase rows and core_functions[0].molecular_function)
    now read 'glucose dehydrogenase (PQQ, quinone) activity' instead of the demoted synonym
    'quinoprotein glucose dehydrogenase activity' (QuickGO, checked 2026-11-23). The GOA-sourced row
    already carried the current name, so the file no longer says two different things about GO:0008876.

    just validate GLUOX gdh passes with 2 warnings, one of which is the expected and documented
    'Label mismatch for GO:0008876'.
