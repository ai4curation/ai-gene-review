events:
- type: EDIT
  outcome: changed
  summary: Restate NEW row from obsolete GO:0019595 to GO:0006007; propose replacement
    term
  details: |
    Corpus scan (issue 6783) found an obsolete GO term asserted on an author-supplied
    `action: NEW` row, which validation does not catch because
    `existing_annotations[].term.id` is deliberately not hard-validated.

    The term: GO:0019595 "non-phosphorylated glucose catabolic process", on a NEW IC
    row citing PMID:20453146, and repeated in `core_functions[].directly_involved_in`.
    Verified obsolete against QuickGO on the GO 2026-11-21 release. GO's comment: it
    overlaps GO:0019255 glucose 1-phosphate catabolic process and GO:0061678
    Entner-Doudoroff pathway. No `replaced_by`, only those two `consider` targets.

    Both `consider` targets were rejected for this protein, a Gluconobacter oxydans
    membrane-bound PQQ glucose dehydrogenase:

    - GO:0019255 requires a phosphorylated hexose. No phosphorylated intermediate
      occurs in the periplasmic route; mGDH oxidizes free D-glucose directly.
    - GO:0061678 names dehydration and aldol cleavage via 6-phosphogluconate to
      pyruvate plus glyceraldehyde(-3-phosphate). mGDH performs none of that
      chemistry, and most of its product leaves the cell as gluconic acid, so the
      term would fail the participation test.

    GO:0046178 "D-gluconate biosynthetic process", the obvious third candidate, is
    also obsolete, with the comment that D-gluconate "is formed as a product of
    glucose and glucose 1-phosphate catabolism, and is not the output of a dedicated
    biosynthetic process". That ruling is what settles the choice: GO itself places
    gluconate formation from glucose inside glucose catabolism.

    Decision: the NEW row was restated at GO:0006007 "glucose catabolic process"
    (verified live), with evidence code, qualifier and supporting quotes unchanged;
    `core_functions[].directly_involved_in` updated to match; and the `reason`
    rewritten to argue for GO:0006007 and to record why each alternative was
    rejected. GO:0006007 is the direct live parent of the obsoleted term, and its
    other live children (GO:0019658, GO:0061621, GO:0061633, GO:0061718) are all
    wrong for a periplasmic oxidase, so it is the most specific live term available.
    The gene's GOA record carries no biological-process annotation at all, so the row
    still adds coverage.

    A `proposed_new_terms` entry was added ("periplasmic oxidative glucose catabolic
    process", proposed parent GO:0006007), because the granularity was lost to the
    obsoletions rather than to the evidence. GO:0006007 does not distinguish this
    route from glycolysis.

    Not edited here, but carrying the same obsolete id and needing the same fix:
    `genes/PSEPK/gcd/gcd-ai-review.yaml` (NEW IMP row plus
    `core_functions[].directly_involved_in`) and
    `modules/pseudomonad_2_ketogluconate_loop.yaml` (module top-level concept).
    QuickGO on 2026-11-23 still shows E. coli Gcd (UniProtKB:P15877) annotated to
    GO:0019595 from EcoCyc on EXP evidence (PMID:2228962), so GOA has not propagated
    the obsoletion and there is no upstream remapping to follow.

    Also recorded in gdh-notes.md. `just validate GLUOX gdh` passes (2 warnings, both
    pre-existing uv/tooling noise); `just validate-quotes` passes corpus-wide.
