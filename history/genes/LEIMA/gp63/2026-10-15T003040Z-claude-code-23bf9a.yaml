  summary: 'Create review: gp63'
  details: |
    Created the full GO annotation review for Leishmania major gp63 (leishmanolysin, P08148, peptidase M8). Automated deep research was unavailable in this environment, so the review rests on a manual literature review recorded in gp63-notes.md: the UniProt record, the four cached PMIDs from the stub, and nine further primary papers verified against PubMed and cached (crystal structure, GPI anchor, HEXXH mutagenesis, gp63 1-6 and 1-7 knockouts, PTP cleavage, mTOR cleavage, antimicrobial peptide and extracellular matrix degradation). All twelve GOA rows were reviewed: metalloendopeptidase activity and both proteolysis rows accepted as core, both GO:0141115 complement rows accepted, JAK-STAT suppression and perturbation of host inflammatory response accepted, symbiont-mediated activation of host signal transduction kept as non-core, generic membrane marked TOO_GENERAL, plasma membrane modified to external side of plasma membrane (the anchored-component terms are obsolete), generic metallopeptidase activity modified to metalloendopeptidase activity, and the InterPro-derived generic cell adhesion term modified to adhesion of symbiont to host cell. Two NEW annotations were proposed, zinc ion binding from the 1.86 A structure and symbiont-mediated suppression of host translation from GP63 cleavage of host mTOR. No removals; no new ontology terms proposed. Validation passes.
