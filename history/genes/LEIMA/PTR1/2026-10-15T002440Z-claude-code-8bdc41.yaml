  summary: 'Create review: PTR1'
  details: |
    Reviewed all 8 GOA annotations for L. major pteridine reductase 1 (Q01782) from a manual literature review; automated deep research was unavailable. Five PMIDs from the UniProt record were PubMed-verified and cached, plus two localization papers (PMID:20545846 for T. brucei, PMID:17275814 for L. donovani). Accepted pteridine reductase activity (IDA/IEA/ISO), the tetrahydrobiopterin biosynthetic process (salvage from biopterin) and cytosol. Kept 6,7-dihydropteridine reductase activity as non-core: Ong 2011 supersedes the 1994 negative report, but LmQDPR is about 20-fold more efficient. Modified the generic oxidoreductase rows (IBA, ISM) to pteridine reductase and dihydrofolate reductase activity. Added NEW dihydrofolate reductase activity (GO:0004146) from Luba 1998, the basis of methotrexate resistance.
