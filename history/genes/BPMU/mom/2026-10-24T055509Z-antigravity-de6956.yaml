  summary: Complete end-to-end curation of Escherichia phage Mu gene mom (P06018)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene mom (UniProtKB:P06018). Reviewed 9 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in mom-notes.md.

    Biological summary: Methylcarbamoylase mom (Mom) is a 241-amino-acid GNAT-superfamily tRNA-dependent DNA aminoacyltransferase of Escherichia phage Mu that acts in the host cell cytoplasm to hypermodify adenine residues in double-stranded DNA to N6-carbamoylmethyladenine (6-NcmdA). Mom hijacks host charged glycyl-tRNAGly to transfer a glycyl group onto the N6 position of adenine within 5'-C/G-A-G/C-N-Py-3' sequences, forming an N6-glycyl-deoxyadenosine intermediate that subsequently undergoes an O2-dependent on-base rearrangement to 6-NcmdA, thereby rendering the viral genome resistant to cleavage by a broad range of host restriction endonucleases.
