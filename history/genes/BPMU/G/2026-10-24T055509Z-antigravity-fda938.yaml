  summary: Complete end-to-end curation of Escherichia phage Mu gene G (Q01261)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene G (UniProtKB:Q01261). Reviewed 3 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in G-notes.md.

    Biological summary: Virion morphogenesis and putative head-tail adaptor protein gp31 (gpG, Mup31; 156 aa, 17.2 kDa) of Escherichia phage Mu, containing a conserved phage virion morphogenesis domain (InterPro IPR006522 / Pfam PF05069 Phage_tail_S / NCBIfam TIGR01635). Encoded in the late head morphogenesis operon between gene F (Mup30) and the protease/scaffolding gene I/Z (Mup32/Mup33) and translated from a non-canonical GUG start codon under the control of the late transcription activator C, gpG localizes to the host cytoplasm and the virion capsid and is required for infectious virion head assembly and head-tail joining.
