  summary: Complete end-to-end curation of Escherichia phage Mu gene com (Q38621)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene com (UniProtKB:Q38621). Reviewed 5 GO annotations, synthesized 3 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in com-notes.md.

    Biological summary: Translational activator com (Com) is a 62-amino-acid Cys4 zinc-finger RNA-binding protein of Escherichia phage Mu that acts in the host cell cytoplasm to positively regulate translation of the late mom DNA-modification mRNA. Coordinating a single structural Zn2+ ion per monomer, Com binds specifically to the 5' translation initiation region of the bicistronic com-mom transcript and destabilizes an inhibitory RNA stem-loop structure, thereby exposing the mom Shine-Dalgarno sequence and start codon for ribosome recruitment.
