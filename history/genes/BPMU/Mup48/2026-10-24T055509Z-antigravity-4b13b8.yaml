  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup48 (Q9T1V1)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup48 (UniProtKB:Q9T1V1). Reviewed 5 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in Mup48-notes.md.

    Biological summary: Baseplate wedge protein gp48 (Mup48, also known as gpR or BW3) of bacteriophage Mu that forms an essential peripheral subunit of the contractile tail baseplate wedge. During baseplate morphogenesis, Mup48 binds directly to Mup47 (BW2) to form an initial heteromeric subcomplex that subsequently recruits Mup46 (BW1), generating three dimeric Mup46-Mup47-Mup48 wedges (six copies of Mup48 per baseplate) that assemble around the central Mup43-Mup44 (N-P) hub and provide the docking site for the tail fibers.
