  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup37 (Q9T1V8)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup37 (UniProtKB:Q9T1V8). Reviewed 4 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in Mup37-notes.md.

    Biological summary: Tail terminator protein (gp37 / gpK) of bacteriophage Mu that forms a hexameric ring at the head-proximal end of the tail tube. Once the polymerizing tail tube reaches the length determined by the tape measure protein, gp37 caps the tube to arrest further polymerization, prevent depolymerization, and create the docking interface for head attachment; loss of gp37 causes accumulation of free heads and abnormally long, variable-length tails.
