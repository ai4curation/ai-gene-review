  summary: Complete end-to-end curation of Escherichia phage Mu gene ner (P06020)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene ner (UniProtKB:P06020). Reviewed 6 GO annotations, synthesized 2 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in ner-notes.md.

    Biological summary: Negative regulator of transcription Ner is an 8 kDa helix-turn-helix DNA-binding transcription repressor of Escherichia phage Mu that functions as the functional counterpart of phage lambda Cro. Acting in the host cell cytoplasm, Ner binds two 12-bp sites within the operator region between the divergent Pe and PcM promoters to shut off PcM-driven expression of the lysogenic repressor Repc—thereby committing the phage to lytic development and replicative transposition—while also negatively autoregulating the early promoter Pe to maintain homeostatic expression of the early transposition operon.
