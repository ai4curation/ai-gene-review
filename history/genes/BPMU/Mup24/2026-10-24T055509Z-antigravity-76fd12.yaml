  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup24 (Q9T1X0)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup24 (UniProtKB:Q9T1X0). Reviewed 1 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in Mup24-notes.md.

    Biological summary: Uncharacterized 64-amino-acid late protein gp24 (Mup24, 7.3 kDa) of Escherichia phage Mu, encoded within the Plys late transcript between the spanin genes (Mup23/Mup23.1) and the releasin gene (Mup25). Lacks predicted transmembrane helices or signal peptides, contains a C-terminal CxxC/CxxC-like cysteine-histidine motif (Cys36, Cys39, His58, Cys60), and is expressed during the late phase of the viral lytic cycle under the control of the phage late transcription activator C; its molecular function and specific role in the phage life cycle remain unknown.
