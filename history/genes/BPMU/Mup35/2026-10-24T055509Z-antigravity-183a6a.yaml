  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup35 (Q9T1W0)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup35 (UniProtKB:Q9T1W0). Reviewed 1 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in Mup35-notes.md.

    Biological summary: Uncharacterized 136-amino-acid protein (gp35) of bacteriophage Mu encoded in the late head-tail morphogenetic gene cluster between the major capsid gene T (Mup34) and the neck gene J (Mup36). Expressed during the late phase of the viral lytic cycle under activation by the viral late transcription activator C, gp35 contains a conserved N-terminal FluMu_N domain (IPR041227 / PF17891) shared with Mu-like prophages and localizes to the host cell cytoplasm.
