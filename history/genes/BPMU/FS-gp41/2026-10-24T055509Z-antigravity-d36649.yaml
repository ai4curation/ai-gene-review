  summary: Complete end-to-end curation of Escherichia phage Mu gene FS-gp41 (P0DJY4)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene FS-gp41 (UniProtKB:P0DJY4). Reviewed 3 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in FS-gp41-notes.md.

    Biological summary: Extended tail assembly chaperone isoform (FS-gp41) of bacteriophage Mu produced by a programmed -2 ribosomal frameshift at codon 136 during translation of the Mup41 transcript. Sharing its N-terminal 136 residues with gp41 (P79680) and bearing a distinct C-terminal extension (analogous to bacteriophage lambda gpGT), FS-gp41 acts together with gp41 in the host cell cytoplasm to promote assembly of the tape measure protein (gp42) and tail tube protein (gpM / gp40) into a functional tail shaft.
