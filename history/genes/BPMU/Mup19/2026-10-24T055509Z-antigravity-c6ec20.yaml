  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup19 (Q38646)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup19 (UniProtKB:Q38646). Reviewed 1 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in Mup19-notes.md.

    Biological summary: Uncharacterized 120-amino-acid multi-pass membrane protein gp19 (Mup19, also designated E19 protein; 13.4 kDa) of Escherichia phage Mu, encoded in the middle region between Mup18 and Mup20 upstream of the late transcription activator gene C. Contains four predicted transmembrane alpha-helices (residues 9-29, 32-52, 68-88, and 94-114) and is expressed during the intermediate phase of the viral replicative cycle; its specific biochemical role in the bacterial host membrane during phage Mu development remains unknown.
