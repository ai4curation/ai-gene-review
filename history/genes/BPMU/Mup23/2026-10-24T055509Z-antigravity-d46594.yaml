  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup23 (Q9T1X1)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup23 (UniProtKB:Q9T1X1). Reviewed 4 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in Mup23-notes.md.

    Biological summary: Inner membrane spanin subunit gp23 (i-spanin, Mup23) of Escherichia phage Mu, a 128-amino-acid type II single-pass inner membrane protein with an N-terminal transmembrane helix (residues 7-23) and a predominantly alpha-helical periplasmic coiled-coil ectodomain. Pairs with the outer-membrane lipoprotein spanin subunit gp23.1 (o-spanin, Mup23.1) to form a two-component periplasm-spanning spanin complex (Rz/Rz1 equivalent). Following degradation of the peptidoglycan meshwork by the SAR-endolysin gp22, the gp23-gp23.1 spanin complex undergoes a conformational change that disrupts the host Gram-negative outer membrane, completing the final step of programmed host cell cytolysis and virion release.
