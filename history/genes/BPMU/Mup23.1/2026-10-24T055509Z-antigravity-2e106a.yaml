  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup23.1 (P0DTL7)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup23.1 (UniProtKB:P0DTL7). Reviewed 5 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in Mup23.1-notes.md.

    Biological summary: Outer-membrane lipoprotein spanin subunit gp23.1 (o-spanin, Mup23.1) of Escherichia phage Mu, encoded by a reading frame overlapping the 3' region of the i-spanin gene Mup23. Synthesized as a 113-amino-acid precursor with an N-terminal lipoprotein signal peptide (residues 1-28) cleaved by host signal peptidase II, generating a mature proline-rich polypeptide (residues 29-113) lipid-anchored via N-palmitoyl and S-diacylglycerol modifications at Cys29 to the periplasmic leaflet of the host outer membrane. Complexes across the periplasmic space with the inner membrane spanin subunit gp23 (Mup23) to disrupt the host outer membrane after SAR-endolysin-mediated peptidoglycan degradation, executing the final step of host cell cytolysis and virion release.
