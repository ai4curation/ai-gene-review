  summary: Complete end-to-end curation of Escherichia phage Mu gene kil (P03046)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene kil (UniProtKB:P03046). Reviewed 1 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in kil-notes.md.

    Biological summary: Protein kil is a 74-amino-acid early accessory protein of Escherichia phage Mu that localizes to the host cell cytoplasm. Its expression induces pronounced morphological changes in the Escherichia coli host cell, causing the bacteria to become enlarged and spherical and ultimately leading to cell death, potentially through a direct or indirect perturbation of the host actin-like cytoskeletal protein MreB.
