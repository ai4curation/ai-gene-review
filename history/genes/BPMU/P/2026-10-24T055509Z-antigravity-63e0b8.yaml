  summary: Complete end-to-end curation of Escherichia phage Mu gene P (P08558)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene P (UniProtKB:P08558). Reviewed 7 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in P-notes.md.

    Biological summary: Baseplate hub protein gp44 (Mup44, also designated BH2) of bacteriophage Mu that forms the central cylindrical hub of the contractile tail baseplate. Three copies of P assemble into a ring-shaped trimer with an inner diameter of approximately 25 Angstroms together with three copies of DNA circularization protein N (Mup43/BH1), nucleating the recruitment of three dimeric Mup46-Mup47-Mup48 baseplate wedges during tail morphogenesis and forming a continuous channel extension of the tail tube through which the viral genome is ejected into the host cell.
