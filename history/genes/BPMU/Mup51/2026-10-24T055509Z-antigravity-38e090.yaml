  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup51 (P0DJY5)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup51 (UniProtKB:P0DJY5). Reviewed 11 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in Mup51-notes.md.

    Biological summary: Tail fiber assembly protein U' (Mup51/gp51/gpU') of bacteriophage Mu that acts as a dedicated molecular chaperone required for the folding and assembly of the alternate tail fiber protein S' (Mup52/gp52). Encoded within the invertible 3-kb G-segment and expressed when the G-segment is in the G(-) orientation, U' binds nascent S' subunits in the host cytoplasm to produce soluble, functional tail fibers that confer tropism for hosts such as Citrobacter freundii and Shigella sonnei, and remains associated with the assembled fiber. In vitro, U' is also functionally interchangeable with U (Mup50/gp50) and can fold the G(+) tail fiber subunit S (gp49).
