  summary: Complete end-to-end curation of Escherichia phage Mu gene M (P79679)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene M (UniProtKB:P79679). Reviewed 8 GO annotations, synthesized 1 core function(s) across 6 literature/database references, and authored detailed mechanistic notes in M-notes.md.

    Biological summary: Major tail tube protein (gpM / Mup40) of bacteriophage Mu. Homomultimers of gpM polymerize around the tape measure protein (gp42) from the baseplate hub to form the central tail tube surrounded by the contractile tail sheath (gpL); disruption of gene M abolishes tail synthesis. Upon host cell attachment and sheath contraction, the gpM tail tube penetrates the bacterial cell envelope and serves as the channel for viral genome ejection.
