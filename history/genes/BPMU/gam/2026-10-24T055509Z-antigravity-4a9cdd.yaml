  summary: Complete end-to-end curation of Escherichia phage Mu gene gam (P06023)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene gam (UniProtKB:P06023). Reviewed 7 GO annotations, synthesized 2 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in gam-notes.md.

    Biological summary: Putative DNA ends protecting protein gam (Mu Gam) is a 174-amino-acid homodimeric double-stranded DNA-binding protein of Escherichia phage Mu that functions in the host cell cytoplasm. Structurally related to prokaryotic and eukaryotic Ku proteins, Mu Gam binds directly to linear double-stranded DNA ends irrespective of terminal overhang geometry (without binding single-stranded DNA or RNA) to shield viral DNA termini from degradation by host exonucleases.
