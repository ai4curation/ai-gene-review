  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup12 (Q38488)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup12 (UniProtKB:Q38488). Reviewed 1 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in Mup12-notes.md.

    Biological summary: Uncharacterized 176-amino-acid early protein gp12 (Mup12, also designated E13; 19.9 kDa) of Escherichia phage Mu, encoded in the semi-essential (SE) region of the early Pe operon between Mup11 and Mup13. Belongs to the conserved Phage_Mu_Gp12 domain family (Pfam PF26885 / InterPro IPR059625) and lacks predicted signal peptides or transmembrane helices. Expressed in the host bacterial cytoplasm during the early phase of the viral replicative cycle under the transcriptional control of Repc and Ner; its specific molecular function in phage Mu development remains unknown.
