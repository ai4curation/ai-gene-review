  summary: Complete end-to-end curation of Escherichia phage Mu gene gin (P03015)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene gin (UniProtKB:P03015). Reviewed 9 GO annotations, synthesized 2 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in gin-notes.md.

    Biological summary: Serine recombinase Gin (G-segment invertase, Mup53/gp53) of bacteriophage Mu that catalyzes site-specific inversion of the 3-kb viral G-segment to switch phage host tropism. Gin comprises an N-terminal catalytic resolvase/invertase domain containing the active-site nucleophile Ser-9 and a C-terminal helix-turn-helix DNA-binding domain that recognizes the 34-bp palindromic gix recombination sites flanking the G-segment. In the presence of the Escherichia coli host factor Fis bound to the recombinational enhancer, two gix-bound Gin dimers assemble into a synaptic tetramer, introduce staggered double-strand breaks via transient 5'-phosphoserine covalent intermediates at Ser-9, undergo a 180-degree subunit rotation, and religate the DNA strands to alternate expression between the S-U (G+) and S'-U' (G-) tail fiber operons.
