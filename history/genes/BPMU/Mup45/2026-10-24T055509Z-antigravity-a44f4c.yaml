  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup45 (Q9T1V4)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup45 (UniProtKB:Q9T1V4). Reviewed 8 GO annotations, synthesized 2 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in Mup45-notes.md.

    Biological summary: Baseplate puncturing device gp45 (Mup45, also known as gpQ or baseplate spike BS) of bacteriophage Mu that forms the homotrimeric central needle-like spike at the distal tip of the contractile tail baseplate. Its C-terminal triple beta-helix tip coordinates one calcium ion, one iron cation, and one chloride ion per trimer, where the bound Ca(2+) ion is required for interaction with the host cell membrane. During infection, the gp45 spike acts as the distal plug of the tail tube channel and punctures the host cell envelope upon tail sheath contraction to enable tail tube insertion and viral DNA ejection.
