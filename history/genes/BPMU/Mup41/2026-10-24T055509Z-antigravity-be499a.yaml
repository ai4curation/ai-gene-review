  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup41 (P79680)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup41 (UniProtKB:P79680). Reviewed 3 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in Mup41-notes.md.

    Biological summary: Tail assembly chaperone (gp41) of bacteriophage Mu produced by conventional translation of the Mup41 open reading frame, whereas a programmed -2 ribosomal frameshift within the same transcript produces the extended isoform FS-gp41. Together with FS-gp41 (analogous to the bacteriophage lambda gpG/gpGT chaperone pair), gp41 acts in the host cell cytoplasm to mediate the interaction between the tape measure protein (gp42) and the tail tube protein (gpM / gp40), directing tail tube polymerization to form a tail shaft of the proper length.
