  summary: Complete end-to-end curation of Escherichia phage Mu gene mor (P23848)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene mor (UniProtKB:P23848). Reviewed 5 GO annotations, synthesized 2 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in mor-notes.md.

    Biological summary: Middle operon regulator Mor is a 129-amino-acid homodimeric winged helix-turn-helix DNA-binding transcription activator of Escherichia phage Mu. Functioning in the host cell cytoplasm, Mor binds a dyad-symmetric operator centered at position -43.5 of the middle promoter (Pm) and interacts with the C-terminal domains of the Escherichia coli RNA polymerase alpha and sigma subunits to activate middle operon transcription, including synthesis of the late transcription activator C.
