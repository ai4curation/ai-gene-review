  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup42 (Q9T1V6)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup42 (UniProtKB:Q9T1V6). Reviewed 4 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in Mup42-notes.md.

    Biological summary: Tail tape measure protein (gp42 / gpY) of bacteriophage Mu. Assembled onto the baseplate prior to tail tube polymerization, gp42 forms a central trimeric filament inside the lumen of the growing tail tube and acts as the physical template that determines the exact length of the contractile tail; disruption of Mup42 completely abolishes tail synthesis. During infection, gp42 is thought to be ejected from the tail lumen ahead of the viral genome.
