  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup20 (Q38623)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup20 (UniProtKB:Q38623). Reviewed 1 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in Mup20-notes.md.

    Biological summary: Uncharacterized 39-amino-acid single-pass membrane protein gp20 (Mup20; 4.3 kDa) of Escherichia phage Mu, encoded in the middle operon immediately downstream of Mup19 and upstream of the late transcription activator gene C (Mup21). Contains a C-terminal helical transmembrane segment (residues 18-38) following a short hydrophilic N-terminal tail (residues 1-17) and is expressed during the intermediate phase of the viral replicative cycle; its specific molecular role in phage Mu infection remains unknown.
