  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup26 (Q9T1W8)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup26 (UniProtKB:Q9T1W8). Reviewed 1 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in Mup26-notes.md.

    Biological summary: Uncharacterized 96-amino-acid late protein gp26 (Mup26, 10.9 kDa) of Escherichia phage Mu, encoded in the Plys late operon immediately downstream of the releasin gene Mup25 and upstream of the small terminase subunit gene Mup27. Contains a predicted winged-helix DNA-binding domain superfamily fold (InterPro IPR036390 / SUPFAM SSF46785) and is expressed in the host cytoplasm during the late phase of the viral lytic cycle under the control of the phage late transcription activator C; its specific molecular target and biological role remain uncharacterized.
