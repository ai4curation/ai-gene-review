  summary: Complete end-to-end curation of Escherichia phage Mu gene L (P79678)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene L (UniProtKB:P79678). Reviewed 8 GO annotations, synthesized 1 core function(s) across 6 literature/database references, and authored detailed mechanistic notes in L-notes.md.

    Biological summary: Contractile tail sheath protein (gpL / Mup39) of bacteriophage Mu. Homomultimers of gpL polymerize into an extended helical sheath surrounding the central baseplate-tail tube complex during tail morphogenesis; disruption of gene L abolishes tail synthesis. Upon attachment of the virion to the bacterial host cell, the sheath undergoes a large-scale conformational contraction that drives the inner tail tube through the host cell envelope to mediate viral genome ejection.
