  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup47 (Q9T1V2)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup47 (UniProtKB:Q9T1V2). Reviewed 5 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in Mup47-notes.md.

    Biological summary: Baseplate wedge protein gp47 (Mup47, also known as gpW or BW2) of bacteriophage Mu that forms the core scaffold of the peripheral baseplate wedge. During tail morphogenesis, Mup47 associates directly with Mup48 (BW3) and subsequently recruits Mup46 (BW1) to form three dimeric baseplate wedges (six copies of Mup47 per baseplate) that surround the central Mup43-Mup44 (N-P) hub at a 3:3:6:6:6 stoichiometry.
