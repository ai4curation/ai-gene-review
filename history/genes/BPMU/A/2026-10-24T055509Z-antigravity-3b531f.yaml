  summary: Complete end-to-end curation of Escherichia phage Mu gene A (P07636)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene A (UniProtKB:P07636). Reviewed 21 GO annotations, synthesized 3 core function(s) across 9 literature/database references, and authored detailed mechanistic notes in A-notes.md.

    Biological summary: DDE-recombinase A (MuA) is the 663-amino-acid transposase of Escherichia phage Mu that catalyzes both initial viral genome integration into the host chromosome and subsequent lytic viral DNA genome replication via replicative transposition. Operating as a homotetramer within the transpososome in the host cell cytoplasm, MuA binds viral attL/attR end sequences and the internal activation sequence (IAS) via N-terminal winged helix-turn-helix domains—competing with the lysogenic repressor Repc in the latency-replication decision—while its RNase H-like DDE catalytic core coordinates Mg2+ ions to perform 3'-end donor DNA cleavage and concerted strand transfer, and a cryptic endonuclease in domain IIIalpha resects 5' flanking host DNA flaps after initial infection.
