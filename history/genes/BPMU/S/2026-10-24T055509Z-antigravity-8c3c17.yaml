  summary: Complete end-to-end curation of Escherichia phage Mu gene S (Q9T1V0)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene S (UniProtKB:Q9T1V0). Reviewed 9 GO annotations, synthesized 2 core function(s) across 6 literature/database references, and authored detailed mechanistic notes in S-notes.md.

    Biological summary: Receptor-binding tail fiber protein S (Mup49/gp49/gpS) of bacteriophage Mu expressed when the invertible 3-kb G-segment is in the G(+) orientation. Protein S consists of a conserved N-terminal baseplate-binding domain encoded upstream of the G-segment and a variable C-terminal receptor-binding domain encoded within the G-segment that binds specific lipopolysaccharide (LPS) structures on the surface of Escherichia coli K-12 and related hosts. Its folding and assembly into functional trimeric tail fibers require the cognate tail fiber assembly chaperone U (Mup50/gp50), although S can also be folded by the alternate chaperone U' (Mup51/gp51) in vitro.
