  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup27 (Q9T1W7)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup27 (UniProtKB:Q9T1W7). Reviewed 5 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in Mup27-notes.md.

    Biological summary: Terminase small subunit gp27 (also known as gpD, pacase small subunit, or Mup27; 191 aa, 21.6 kDa) of Escherichia phage Mu. Specifically recognizes the phage genome packaging initiation site (pac) near the left end of integrated Mu DNA and heterooligomerizes with the terminase large subunit gp28 (gpE / Mup28) at the portal vertex of the procapsid to regulate its ATPase and endonuclease activities during headful viral DNA genome packaging.
