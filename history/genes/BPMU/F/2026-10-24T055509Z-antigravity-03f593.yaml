  summary: Complete end-to-end curation of Escherichia phage Mu gene F (Q01259)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene F (UniProtKB:Q01259). Reviewed 3 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in F-notes.md.

    Biological summary: Capsid assembly and minor head protein gp30 (gpF, Mup30; 439 aa, 49.4 kDa) of Escherichia phage Mu, containing a conserved phage head morphogenesis domain (InterPro IPR006528 / Pfam PF04233, NCBIfam TIGR01641 SPP1 gp7-like family). Encoded in the late morphogenetic operon immediately downstream of the portal protein gene H (Mup29) and upstream of gene G (Mup31), gp30 is expressed in the host cytoplasm under the control of the viral late transcription activator C, associates with the viral capsid as a minor capsid component, and is required for productive phage head morphogenesis.
