  summary: Complete end-to-end curation of Escherichia phage Mu gene U (Q9T1U9)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene U (UniProtKB:Q9T1U9). Reviewed 11 GO annotations, synthesized 1 core function(s) across 6 literature/database references, and authored detailed mechanistic notes in U-notes.md.

    Biological summary: Tail fiber assembly protein U (Mup50/gp50/gpU) of bacteriophage Mu that acts as a dedicated molecular chaperone required for the folding and assembly of tail fiber protein S (Mup49/gp49). Encoded entirely within the invertible 3-kb G-segment downstream of gene S and expressed when the G-segment is in the G(+) orientation, protein U binds nascent S subunits in the host cytoplasm to produce soluble, functional tail fibers and remains associated with the assembled fiber. Although co-regulated exclusively with S in vivo, U is also capable of binding and folding the alternate tail fiber subunit S' (Mup52/gp52) in vitro.
