  summary: Complete end-to-end curation of Escherichia phage Mu gene T (Q9T1W1)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene T (UniProtKB:Q9T1W1). Reviewed 6 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in T-notes.md.

    Biological summary: Major capsid protein (gpT / Mup34) of bacteriophage Mu that self-assembles to form an icosahedral capsid approximately 54 nm in diameter. During head morphogenesis in the host cell cytoplasm, gpT is recruited with the scaffolding protein Z onto an early 25S initiator complex composed of the portal protein and viral protease I to form the immature prohead in a process requiring the host GroEL/GroES chaperonin system.
