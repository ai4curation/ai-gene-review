  summary: Complete end-to-end curation of Escherichia phage Mu gene I (Q01267)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene I (UniProtKB:Q01267). Reviewed 8 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in I-notes.md.

    Biological summary: Bifunctional prohead maturation protease I (gp32 / gpI, Mup32; 361 aa, 38.9 kDa, isoform Q01267-1) and internal capsid scaffolding protein Z (gp33 / gpZ, Mup33; 183 aa, residues 179-361, isoform Q01267-2) of Escherichia phage Mu, produced by alternative in-frame translational initiation from the same gene. Full-length protease I contains an N-terminal peptidase U35 family prohead protease domain (InterPro IPR061919 / Pfam PF10123) fused to the C-terminal scaffolding domain (InterPro IPR012106), whereas isoform Z initiates at an internal start site (Met179) and consists solely of the C-terminal coiled-coil scaffolding domain. Protease I interacts with the portal protein H (gp29) to form an early 25S initiator complex, recruits scaffolding protein Z and major capsid protein T (gp34) in a host GroEL/GroES-dependent reaction to assemble immature proheads, and subsequently cleaves the C-terminus of the portal protein H (and removes the internal scaffold) to yield mature procapsids competent for DNA packaging.
