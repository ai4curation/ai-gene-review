  summary: Complete end-to-end curation of Escherichia phage Mu gene Mup14 (Q38492)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene Mup14 (UniProtKB:Q38492). Reviewed 1 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in Mup14-notes.md.

    Biological summary: Uncharacterized 100-amino-acid early protein gp14 (Mup14, also designated E15; 11.7 kDa) of Escherichia phage Mu, encoded in the semi-essential (SE) region of the early Pe operon between Mup13 and Mup15. Belongs to the conserved mulikevirus gp14 protein family and lacks predicted signal peptides or transmembrane helices. Expressed in the host bacterial cytoplasm during the early phase of the viral replicative cycle under the transcriptional control of Repc and Ner; its specific biochemical function in phage Mu infection remains unknown.
