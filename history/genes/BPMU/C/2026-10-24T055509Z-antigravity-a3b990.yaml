  summary: Complete end-to-end curation of Escherichia phage Mu gene C (P06022)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene C (UniProtKB:P06022). Reviewed 6 GO annotations, synthesized 2 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in C-notes.md.

    Biological summary: Late transcription activator C is a 140-amino-acid homodimeric winged helix-turn-helix DNA-binding transcription activator of Escherichia phage Mu that mediates the transition from middle to late viral gene expression in the host cell cytoplasm. Activated by Mg2+ binding, protein C binds and activates the four late promoters (Plys, PI, PP, and Pmom)—unwinding promoter DNA to realign core elements and recruiting host RNA polymerase—to drive transcription of the viral lysis, head/tail morphogenesis, and mom DNA modification genes.
