  summary: Complete end-to-end curation of Escherichia phage Mu gene H (Q9T1W5)
  details: |
    Completed comprehensive gene review for Escherichia phage Mu (NCBITaxon:2681603) gene H (UniProtKB:Q9T1W5). Reviewed 8 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in H-notes.md.

    Biological summary: Portal protein gp29 (gpH, head-tail connector, Mup29; 512 aa, 56.9 kDa) of Escherichia phage Mu (InterPro IPR009279 / Pfam PF06074; cryo-EM structures PDB:9KHX, PDB:9KNU). Multimerizes into a ring-shaped homododecamer with a central axial channel located at a unique 5-fold vertex of the icosahedral capsid. Forms an early 25S initiator complex with the viral protease I (gp32) and nucleates host GroEL/GroES-dependent assembly of the scaffolding protein Z (gp33) and major capsid protein T (gp34) into immature proheads. C-terminal cleavage of gp29 by protease I renders the procapsid competent for headful DNA packaging via docking of the gp27-gp28 terminase motor, subsequent attachment of neck and contractile tail proteins, and DNA genome ejection into the host cell during infection.
