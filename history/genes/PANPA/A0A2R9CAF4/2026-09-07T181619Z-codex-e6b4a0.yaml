    Audited genes/PANPA/A0A2R9CAF4/A0A2R9CAF4-protnlm-predictions-review.yaml against the source-independence and final-state prose guidelines in .claude/skills/review-function-prediction/SKILL.md.

    Replaced rationale prose with the current assessment, traced biological claims to sequence/domain records, primary publications, and where relevant experimentally grounded curated annotations or reproducible analysis. Removed AI/OpenScientist verdicts as supporting evidence and unsupported error-mechanism claims. Source prediction terms and method/version metadata were preserved. Existing annotation overlap is separated from biological correctness and is not evidence of training-data contamination.

    GO:0008509 (monoatomic anion transmembrane transporter activity): LSP -> LSP. The target has the SLC26/SulP transport domain, multiple transmembrane segments, and a STAS domain. Experimental characterization of SLC26A11 supports chloride conduction as well as sulfate transport (PMID:42509233), providing family-level grounding for anion transport. The cached target annotations include the more specific chloride channel activity. The generic anion-transporter prediction is therefore supported but less precise.

    GO:0016020 (membrane): LSP -> LSP. Multiple transmembrane segments in the target provide direct sequence-architecture support for membrane residence. This agrees with the membrane transport behavior characterized for SLC26A11 (PMID:42509233). The cached annotations identify specific membranes, including lysosomal and plasma membranes. Membrane is a valid but less precise localization and is not an error merely because it is broad.

