  summary: 'Create review: AMO (HPAO-1), reference relative of SCHPO cao1'
  details: |
    De novo full review of H. polymorpha AMO/HPAO-1 (P12807), independent of ProtNLM2 predictions. Deep research failed (falcon auth error, perplexity quota), so the review rests on UniProt and 22 cached primary papers. Accepted primary methylamine oxidase activity (2 EXP + IEA) and copper ion binding. Peroxisome modified to peroxisomal matrix (native-host PTS2 targeting, PMID:7805876/8511963/7192080). Amine metabolic process modified to methylamine metabolic process + amine catabolic process. Quinone binding marked over-annotated because TPQ is a self-derived residue. Recorded PANTHER SF86 and PAINT root PTN000067313 placement, and which functions are experimentally established in this species versus not transferable to cao1 (peroxisomal PTS2 localization, methylamine physiology).
