  summary: 'Create review: LOC117183218 isoform X1 (A0A6I8W805)'
  details: |
    De-novo review of the longest product (X1) of D. pseudoobscura LOC117183218, written independently of ProtNLM2 predictions as the reference relative for benchmark entry A0A6I8W8A2. GOA has no annotations, so no existing_annotations rows and no NEW terms. New analysis (A0A6I8W805-bioinformatics/map_to_herc4.py) shows X1 residues 50-270 match blades 1-4 of the Herc4 RCC1-like domain (76% D. pseudoobscura, 63% D. melanogaster), no HECT domain, closest relative the RCC1-only paralog LOC6903915, AlphaFold mean pLDDT 58.8. Herc4 is in PTHR45622:SF76 while this gene is PTHR22872 without a subfamily, so Herc4 E3 ligase / Smoothened-ubiquitination functions (PMID:30925584) are not transferred; no function is experimentally established in this species. Falcon and perplexity-lite deep research both failed (auth / quota); recorded in notes.
