    GO:0016874 (ligase activity): NPI -> NPI. The deposited sequence is a short RCC1-repeat protein with RCC1/BLIP-II fold assignments and no HECT or other ligase catalytic module. An RCC1 region from a larger HERC-like protein does not carry the catalytic activity of that protein's separate HECT domain. The prediction of intrinsic ligase activity is therefore incompatible with the available domain architecture. This assessment concerns the deposited sequence; it does not establish whether a longer gene model at the locus encodes a ligase.

