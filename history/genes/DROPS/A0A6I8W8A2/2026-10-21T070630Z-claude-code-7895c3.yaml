  summary: 'Full re-review: A0A6I8W8A2 (LOC117183218 isoform X3)'
  details: |
    Full re-review independent of ProtNLM2 predictions (no GOA rows). Established that A0A6I8W8A2 is RefSeq isoform X3 of LOC117183218 (X3 6-169 = X1 A0A6I8W805 119-282) and that no product of the gene has a HECT domain; the HERC3 name is a homology label. New reproducible analysis (A0A6I8W8A2-bioinformatics/) places the gene as an RCC1-only partial duplicate of the Herc4 RCC1-like domain in D. pseudoobscura (Herc4 in PTHR45622:SF76, this gene in PTHR22872 without subfamily; isoform X2 in PTHR22870). Rewrote description; removed root MF and unsupported cytoplasm location from core_functions; replaced deep-research/ProtNLM-based support with UniProt features and the new analysis; marked the falcon report MISCITED (wrongly transfers HERC3 HECT functions). Added notes file.
