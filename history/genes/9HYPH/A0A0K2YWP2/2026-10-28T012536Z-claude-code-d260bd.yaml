  summary: Correct the PMID:26236307 reference_review enum and apply PR review polish
  details: |
    Correction session answering the PR 5649 review. The blocking finding was a
    controlled-vocabulary error: reference_review.correctness for PMID:26236307 was
    MISCITED, which the schema defines as "Paper is correctly identified but does not
    actually support the claim it is cited for". The paper is cited here for the
    LN864498 sequence provenance and the qRT-PCR expression data, which it does support,
    and these notes already said "It is the right paper for the sequence provenance and
    expression data" - so the enum contradicted its own prose. Changed to DISPUTED
    ("Correctly cited, but the paper's central claim is contradicted or contested by
    other evidence"), which is what is at issue: the paper's own MCO/laccase
    interpretation of the gene. review_notes rewritten accordingly.

    Also applied, from the review's suggestions. The GO:0005737 cytoplasm ACCEPT cited a
    quote about alignment span, cut mid-sentence, which carries no weight for a cellular
    component term; it has been replaced with the family's own PAINT evidence, a
    bacterial-root (taxon:2) IBD for GO:0005829 cytosol at PTN000770199 seeded by
    UniProtKB:P33644, the E. coli PgeF. The line was verified in the committed
    interpro/panther/PTHR30616/PTHR30616-paint.tsv, P33644 confirmed as PGEF_ECOLI, and
    that file added to this review's references. The reason notes that GO:0005829 is
    part_of GO:0005737, so the IBD entails the cytoplasm claim while being one step more
    specific, and says why the row stays at cytoplasm: cytosol and cytoplasm are
    different terms, and a 54-residue fragment gives no ground for narrowing.
