  summary: Correct mature-chain comparison boundaries, qualify CMMMech path, add Methods
    signal-peptide anchor
  details: |
    Non-blocking review findings on the approved PR 5644, addressed as follows.

    1. Bioinformatics mature-chain comparison. compare_lanm.py applied Hans-LanM's
       23-residue signal boundary to both sequences, starting Mex-LanM (C5B164) two
       residues inside its own experimentally evidenced mature chain
       (SIGNAL 1..21, CHAIN 22..133, ECO:0000269|PubMed:30351021). The script now
       parses each entry's own FT CHAIN feature, so the comparison is
       Hans-LanM 24-133 against Mex-LanM 22-133. Re-ran the script and committed the
       recomputed compare_lanm_output.txt; the mature-chain figure becomes
       38 identical residues, 34.5% of the Hans-LanM mature chain (33.6% of
       alignment columns), replacing the previous 37 / 33.6%. The headline
       full-length identity (45 residues, 33.8%), which is the figure cited in the
       notes and compared with the paper's 33%, is unchanged.
    2. Notes provenance. The CMMMech record-check section cited
       data/records/rare-earth-element-commodities.yaml without saying which
       repository it is in. Qualified as the separate CultureBotAI/CMMMech
       repository. The four overstatement findings are unchanged.
    3. Signal peptide anchor. Added the paper's Methods statement that the construct
       was expressed "without its native 23-residue signal peptide" as a finding on
       PMID:37259003, with the caveat recorded in the finding statement and in the
       notes that it rests on the same SignalP (v6.0) call UniProt records as
       FT SIGNAL 1..23 and is therefore not a second independent line of evidence
       for export or a periplasmic location. No location term was added.
    4. Declined: giving homodimerization its own core_functions entry. The
       light-lanthanide-induced dimerization is the mechanism by which the metal
       selectivity is sharpened rather than a separate activity, so it stays folded
       into the single core-function entry's prose.
