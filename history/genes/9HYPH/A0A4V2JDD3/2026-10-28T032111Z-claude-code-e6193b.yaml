  summary: Correct the GO:0005509 KEEP_AS_NON_CORE rationale in the Hans-LanM review
  details: |
    Review follow-up on PR #5644. The GO:0005509 (calcium ion binding, IEA) row's review.reason ended with a clause saying the row was not refined because no GO term for lanthanide binding exists, which read as if this row were awaiting a MODIFY to the proposed lanthanide ion binding term. QuickGO confirms GO:0046872 metal ion binding is an is_a ancestor of GO:0005509, so a lanthanide ion binding child of GO:0046872 would be calcium ion binding's sibling, not its descendant, and no refinement is pending. The clause was replaced with the actual KEEP_AS_NON_CORE rationale: calcium ion binding is as specific as the Ca(II) evidence warrants and the Ca(II) binding (Kd,app 60 uM, n = 1.0, partial conformational change; PMID:37259003) stands independently of GO's treatment of lanthanides. No term ids, actions, supporting_text, proposed_new_terms or core_functions were changed; the HTML was re-rendered.
