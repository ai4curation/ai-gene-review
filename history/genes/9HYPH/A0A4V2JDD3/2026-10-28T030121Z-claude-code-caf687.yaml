  summary: Type the core activity as the proposed lanthanide ion binding term, drop
    the unsupported Sec attribution, and fix the mature-chain denominator label
  details: |
    Second correction session on PR 5644, answering the approving review's three
    non-blocking suggestions. No existing history record was modified.

    1. proposed_molecular_function (accepted). The single core_functions entry typed the
    core activity as GO:0046872 metal ion binding while its own prose said that term is a
    placeholder for a lanthanide ion binding term GO does not have. That is exactly the
    case the schema's proposed_molecular_function slot describes, so molecular_function
    is now unset and proposed_molecular_function is "lanthanide ion binding", matching
    the existing top-level proposed_new_terms entry by proposed_name. The validator's
    conditions are met: the two are not both set, the name matches a proposed entry, and
    the core function carries supported_by.

    The NEW GO:0046872 row is kept, with the reason rewritten to say why rather than
    leaving the question implicit. The review's previous defence of the row - that it is
    not redundant with GO:0005509 because it asserts lanthanide binding - does not
    survive the reviewer's sharper point: GO:0046872 is a strict ancestor of the
    GO:0005509 row the gene carries, so as a term it adds nothing the true-path rule does
    not entail, and the lanthanide claim lives in the summary and reason, not in the
    term. The reason now states that limitation plainly and gives the two reasons for
    retention anyway: it is the most specific term that exists today, so it is the only
    lanthanide-motivated row a curator can act on before the proposed term exists, and it
    marks that the metal-binding claim rests on direct measurement on purified protein
    (ICP-MS, chelator-buffered CD, two crystal structures) rather than on the
    EF-hand-derived calcium prediction behind GO:0005509. Mex-LanM's own GOA carries both
    terms side by side. The reason also says the row should be replaced when GO creates
    the lanthanide term.

    2. "Sec signal peptide" (accepted). The description said "a predicted 23-residue Sec
    signal peptide". Checked both cited sources: A0A4V2JDD3-uniprot.txt records only
    FT SIGNAL 1..23 with ECO:0000256|SAM:SignalP and KW Signal, with no translocon class,
    and the cached PMID:37259003 contains no mention of Sec, SecA or a Sec-dependent
    pathway anywhere - only SignalP. "Sec" is dropped from the description; the same
    unsupported wording in A0A4V2JDD3-notes.md is corrected there with the reason
    recorded, so a later reader sees the correction rather than a silent change.

    3. compare_lanm_output.txt label (accepted, fixed in the script and re-run). The
    f-string printed "% of Hans-LanM length" for both runs although len(x) is the
    110-residue mature chain on the second. The loop now carries a per-run denominator
    label and prints the length it used, so the artifact is self-describing: "33.8% of
    Hans-LanM full-length sequence (133 aa)" and "34.5% of Hans-LanM mature chain
    (110 aa)". The committed compare_lanm_output.txt is the regenerated run, not a hand
    edit; a diff against the previous output shows only the two label lines changing, with
    every identity count, percentage and alignment block byte-identical, which is the
    expected result of a label-only change. RESULTS.md already stated the mature figure
    correctly and needed no change.

    Checks: just backfill-record-sections (no changes), just validate 9HYPH A0A4V2JDD3
    (valid), just render 9HYPH A0A4V2JDD3, just validate-history on this record.

    Note for future sessions: compare_lanm.py reads genes/METEA/lanM/lanM-uniprot.txt, so
    a sparse worktree must include genes/METEA/lanM/ or the script exits with no output.
