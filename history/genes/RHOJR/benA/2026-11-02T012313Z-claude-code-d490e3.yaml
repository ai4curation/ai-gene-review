  summary: 'Address PR review: make the no-biphenyl-term decision explicit for RHA1
    benA'
  details: |
    PR #5366 review round (ai4c-reviewer review 5636943045). Suggestion taken. PMID:11673430 concludes the ben genes are essential 'not only in benzoate catabolism but also in biphenyl catabolism', and the review mentioned this in description but proposed nothing, leaving a silent omission. Added a suggested_questions entry stating the reasoning for proposing no biphenyl term: benzoate is a product of the biphenyl upper pathway, so BenA acts on its output rather than performing a step of biphenyl catabolism, and the mutant's diminished growth on biphenyl is necessity rather than participation under the CLAUDE.md participation test. A curator who disagrees is asked which step BenA itself performs. Notes file rewritten with gene-specific content, including the Rieske motif position verified directly against the sequence (CSHRGAMLCRRKTDNRTTFTCPFH at residue 97 of 458), which is the basis for accepting GO:0051537 despite the UniProt ProRule caution. just validate passes.
