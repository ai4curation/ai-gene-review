  summary: 'Create review: AVR-Pita'
  details: |
    Created the full GO annotation review for Pyricularia oryzae effector AVR-Pita (F7J183) from UniProt, the cached literature and PubMed lookups; no deep-research file was available, which is recorded in AVR-Pita-notes.md. All three GOA rows were reviewed (1 ACCEPT: extracellular region; 1 KEEP_AS_NON_CORE: GO:0008237 metallopeptidase activity, retained because the aspzincin HExxH motif is intact but no catalytic activity, substrate or product has ever been shown and the gene is dispensable for pathogenicity; 1 MARK_AS_OVER_ANNOTATED: GO:0004222 metalloendopeptidase activity from InterPro IPR029463, which adds unverified endopeptidase and lysine-specificity claims). Three NEW annotations were added from the literature: GO:0033650 host cell mitochondrion and GO:0052034 effector-mediated suppression of host pattern-triggered immunity (OsCOX11 binding, raised COX activity, suppressed chitin-triggered ROS, PMID:33443630), and GO:0080185 effector-mediated activation of plant hypersensitive response by symbiont, noting that recognition depends on Ptr rather than the NLR Pi-ta (PMID:38834685). Two core functions (virulence suppression of PTI at host mitochondria; avirulence/HR elicitation) with no molecular function asserted. just validate and just validate-changed both pass with no warnings; status COMPLETE.
