  summary: Full re-review of A0A8B6BFL6, independent of ProtNLM2
  details: |
    Re-review independent of ProtNLM2 output. Placed the protein as a DIRS-type RT-RNase H (PTHR33050:SF7, aligns with Dictyostelium DIRS-1 ORF2 O96849 across RT and RNase H; no similarity to the DIRS-1 tyrosine recombinase). New sequence comparison in A0A8B6BFL6-bioinformatics/compare_sequences_rereview.py and RESULTS-rereview.md. Removed unsupported core-function claims (DNA integration and DNA recombination, which belong to the separate YR; nucleus and cytoplasm, which were LINE-1 analogies). Corrected the PANTHER family name. Added RNase H core function, NEW ISS rows for GO:0003964 and GO:0032197, and PMID:32170321. Flagged the deep-research LINE assumption and the ProtNLM2 file as not used as support. Created notes file.
