  details: |
    Audited genes/MYTGA/A0A8B6BFL6/A0A8B6BFL6-protnlm-predictions-review.yaml against the source-independence and final-state prose guidelines in .claude/skills/review-function-prediction/SKILL.md.

    Replaced rationale prose with the current assessment, traced biological claims to sequence/domain records, primary publications, and where relevant experimentally grounded curated annotations or reproducible analysis. Removed AI/OpenScientist verdicts as supporting evidence and unsupported error-mechanism claims. Source prediction terms and method/version metadata were preserved. Existing annotation overlap is separated from biological correctness and is not evidence of training-data contamination.

    GO:0003677 (DNA binding): LSP -> COR. The target contains a reverse-transcriptase domain at residues 174–349 and a DNA/RNA polymerase fold assignment. Reverse transcription entails interaction with a DNA primer or nascent DNA product, providing a mechanistic basis for broad DNA binding. This inference does not specify a recognition sequence, chromosomal target, or recombinase activity. The cached GOA/UniProt record has no DNA-binding annotation, so this is a supported additional function.

    GO:0006310 (DNA recombination): COR -> UNC. The sequence supports a reverse-transcriptase relationship but has no identified recombinase domain or documented complete mobile-element context. Experimental DIRS retrotransposition work distinguishes cDNA production from completion of an element's integration cycle (PMID:32170321); it does not establish that this mussel protein belongs to that element class. An RT can participate in a larger recombination pathway, so lack of its own recombinase domain is not a decisive refutation of the biological process. The process is absent from the cached annotations and requires verified element context or functional evidence.

    GO:0015074 (DNA integration): COR -> UNC. A reverse-transcriptase domain establishes a plausible role in cDNA synthesis, not necessarily chromosomal integration. DIRS experiments demonstrate that productive retrotransposition depends on the element and its proteins together (PMID:32170321), but the target's element identity and integration machinery are not established in the inspected sources. The prediction is a biological process, so a protein could contribute without catalyzing integration itself. DNA integration is absent from the cached annotations and remains uncertain pending element-context evidence.

