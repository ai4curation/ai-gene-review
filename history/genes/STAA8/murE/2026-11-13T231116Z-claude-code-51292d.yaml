  summary: Create complete gene review for Staphylococcus aureus NCTC 8325 murE (Q2FZP6)
  details: |
    New review of all 11 GOA rows for the L-lysine branch of the MurE step in the peptidoglycan precursor module. Core function GO:0047482 (UDP-MurNAc-L-Ala-D-Glu--L-lysine ligase), supported by two experimental rows and by Patin et al. 2010, which shows the purified enzyme is strictly L-lysine specific. GO:0016874 (IBD node PTN000566337) and GO:0016881 are TOO_GENERAL as entailed parents; cell shape and cell division InterPro2GO rows are marked over-annotated as necessity rather than participation. Curator notes added in murE-notes.md; no provider deep research was available.
