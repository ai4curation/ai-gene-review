  summary: Replace the signature receipts on the GO:0016881 MODIFY with the measured
    L-lysine specificity
  details: |
    Review round on PR #6492. The MODIFY to the L-lysine-specific GO:0047482 cited NCBIfam TIGR01085 and InterPro IPR004101, neither of which can establish third-residue specificity: IPR004101 is the Mur ligase C-terminal domain shared by MurC, MurD, MurE and MurF, and the MurE-specific entries on this record (IPR005761, subfamily PTHR23135:SF4) are named for the meso-diaminopimelate reaction. That is the same argument used to decline MODIFY on the MurG and MraY parent rows, so the receipt is now the organism's measured specificity: PMID:20659527, where the purified enzyme is strictly L-lysine specific and rejects meso-diaminopimelate, plus the curated catalytic-activity reaction. The action and replacement term are unchanged.
