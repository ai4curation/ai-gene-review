  summary: Refine the GO:0016881 row to the specific L-lysine ligase term (murE)
  details: |
    GO:0016881 acid-amino acid ligase activity moves from TOO_GENERAL to MODIFY with GO:0047482 as the replacement, matching how the same row is handled on the Escherichia coli K-12 and Pseudomonas putida KT2440 MurE reviews and across the other Mur ligases of the peptidoglycan precursor module. The row's own evidence supports the deeper term: the MurE-specific NCBIfam model TIGR01085 and the Mur ligase central and C-terminal signatures are in this protein's record. GO:0016874 ligase activity stays TOO_GENERAL, since it is one level broader and is the only molecular function the shared PANTHER family PTHR23135 can carry.
