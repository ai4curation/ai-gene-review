  summary: Resolve GO:0005829 cytosol to ACCEPT from the PTHR46969 family node
  details: |
    Re-examined the one remaining UNDECIDED row now that the PTHR46969 family review exists. The cytosol assertion at PAINT node PTN000062036 is seeded by E. coli HldE itself, whose own cytosol annotation is experimental (IDA), and the family review assesses that node SOUND, so the claim is inherited from experimental grounding rather than resting on a bare electronic localization. HldA was purified and crystallized as a soluble enzyme and acts on cytoplasmic sugar phosphates, and no competing compartment is proposed anywhere in the family. Changed UNDECIDED to ACCEPT for consistency with the E. coli and KT2440 hldE rows, which accept the same claim. That native J2315 HldA was never localized directly limits the strength of the evidence, not the correctness of the compartment. just validate clean.
