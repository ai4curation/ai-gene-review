  details: |
    De-novo review of all 32 GOA rows for Zaire ebolavirus VP35 (Q05127) for the CACAO audit, written from the cached publications and the curated UniProt record because no deep-research provider was available. The eight CACAO rows were judged individually: GO:0039502 was modified to the RIG-I and IRF3 inhibition terms because PMID:16698997 assays interferon induction while the term names receptor signalling, which PMID:12829834 shows VP35 does not block; GO:0039505 was marked over-annotated (MHC class II measured only as a dendritic-cell maturation marker); GO:0010629 and GO:0052562 were refined; the other four were kept.
