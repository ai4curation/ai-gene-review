  details: |
    De-novo review of all 34 GOA rows for Zaire ebolavirus VP40 (Q05128) for the CACAO audit: 15 ACCEPT, 11 KEEP_AS_NON_CORE, 7 MODIFY, 1 MARK_AS_OVER_ANNOTATED, no REMOVE. Of the six CACAO rows, three are refined from a parent to the plasma-membrane/plasma-membrane-budding child the cited assay actually resolves, GO:0075733 intracellular transport of virus is corrected to viral budding from plasma membrane (the paper has no transport assay), and the membrane raft and viral budding from plasma membrane rows are accepted; deep research and the GONUTS wiki were both unavailable, as recorded in VP40-notes.md.
