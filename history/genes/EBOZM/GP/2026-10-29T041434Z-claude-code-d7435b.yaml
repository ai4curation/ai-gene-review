  summary: 'Create review: GP'
  details: |
    De-novo review of all 31 GOA rows for Zaire ebolavirus envelope glycoprotein GP (Q05320), part of the CACAO audit: 22 ACCEPT, 4 KEEP_AS_NON_CORE, 5 TOO_GENERAL, plus two NEW molecular functions (GO:0046789 host cell surface receptor binding, GO:0035662 Toll-like receptor 4 binding) for a protein GOA leaves without a receptor-binding MF. Of the five CACAO rows, the two from PMID:11877482 (membrane raft, viral budding from plasma membrane) and the GO:0046718 entry row from PMID:20202662 are well supported; the host-cell-ER row from PMID:21223600 is kept as non-core with an evidence-code defect; and the host-cell-cytoplasm IDA row from PMID:20202662 is marked TOO_GENERAL with a CONFIRMED WRONG_REFERENCE source defect, because the paper's full text contains no GP-localisation assay. Deep research was unavailable (no API keys) and the GONUTS wiki was offline, so the literature was read directly from the cached publications plus PubMed Central.
