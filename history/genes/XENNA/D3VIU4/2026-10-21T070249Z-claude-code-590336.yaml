  summary: 'Full re-review: D3VIU4 (XNC1_0570) family-3 cystine-binding SBP'
  details: |
    Full re-review independent of ProtNLM2 predictions (ARGO50 cohort). Established that D3VIU4 is in PANTHER PTHR35936:SF34 with B. subtilis TcyA, not SF35 with E. coli TcyJ/FliY, so the earlier draft's direct E. coli orthology and Km transfer were dropped. Re-grounded cystine-binding SBP function on SF34 membership, conserved Ngo0372 pocket Tyr49/Trp87 and the XNC1_0570-0572 SBP-ATPase-permease cluster (new D3VIU4-bioinformatics/RESULTS-rereview.md and script). cell envelope changed from KEEP_AS_NON_CORE to MODIFY -> periplasmic space; proposed complex refined from GO:0043190 to GO:0055052; added PMIDs 15262924, 22138345, 26350134; deep-research report retained but marked DISPUTED; started notes journal.
