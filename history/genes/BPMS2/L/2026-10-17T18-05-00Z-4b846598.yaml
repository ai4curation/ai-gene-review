  summary: Initial curation of BPMS2 L (lysis protein) gene review
  details: |
    Initial curation of Escherichia phage MS2 lysis protein L (P03609).
    Reviewed 4 existing GOA annotations: accepted GO:0019076 (viral release from
    host cell) and GO:0044659 (viral lysis of host bacterial cell); kept
    GO:0044167 (host cell inner membrane) as non-core; modified GO:0016020
    (membrane) to GO:0044167 based on biochemical and genetic studies of MS2 L
    and DnaJ-assisted cell envelope disruption (PMID:1933688, PMID:2651787,
    PMID:29133583).
