  summary: Initial curation of BPMS2 cp (capsid protein) gene review
  details: |
    Initial curation of Escherichia phage MS2 capsid protein cp (P03612).
    Reviewed 9 existing GOA annotations: accepted GO:0039660 (structural
    constituent of virion), GO:0030371 (translation repressor activity),
    GO:1904972 (negative regulation of viral translation), and GO:0039617
    (T=3 icosahedral viral capsid); modified GO:0003729 (mRNA binding),
    GO:0003723 (RNA binding), and GO:0019013 (viral nucleocapsid) to more
    specific supported terms based on crystal structures and operator RNA
    binding studies (PMID:2102488, PMID:7935307, PMID:7651822, PMID:10964512).
