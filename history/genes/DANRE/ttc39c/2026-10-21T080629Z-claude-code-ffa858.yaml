  summary: 'Create review: ttc39c'
  details: |
    De novo review of zebrafish ttc39c (Q1LXE6), independent of ProtNLM2 predictions, as the experimental reference for TTC39C (PTHR31859:SF1) orthologs. Deep research failed (falcon 403 auth; perplexity fallback failed), so the review was built from the full text of Xu et al. 2015 (PMID:25860617), the abstract of the mouse muscle study PMID:31188487, and PANTHER/PAINT data. Cilium assembly (IMP and IBA, PTN001275223 on the TTC39C branch, absent from TTC39A/B) was accepted as the core process. Otolith morphogenesis (IMP and IBA, Euteleostomi node) and heart L/R asymmetry (IMP; deliberately not propagated by PAINT) were kept as non-core downstream organismal phenotypes. The ND cellular_component was accepted because no localization data exist. No NEW terms were added; the molecular function is recorded as a knowledge gap.
