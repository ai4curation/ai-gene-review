  details: |
    Re-examined all six GOA rows. Established that PANTHER SF3 (zebrafish) vs SF2 (mammalian DCXR) is a mammal vs non-mammal lineage split: the PAINT node PTN001211870 has donors in SF1, SF2 and SF3, and SF3 C. elegans dhs-21 has measured NADPH L-xylulose reductase activity (PMID:21477590). Added independent UniProt-fetched sequence comparison (RESULTS-rereview.md). GO:0006006 changed from KEEP_AS_NON_CORE to MODIFY -> GO:0042840 D-glucuronate catabolic process (PMID:40737316; mouse GO-CAM 6246724f00000078). Other actions unchanged (GO:0050038, GO:0004090, GO:0005997, ND ACCEPT; GO:0016616 MODIFY). Added carbonyl reductase core function, new references, rewritten description, appended notes.
