  summary: 'Pair-review corrections: cryabb lens vs muscle core processes'
  details: |
    Targeted edits from the DANRE_DUPLICATION cryaba/cryabb pair comparison (projects/DANRE_DUPLICATION/pairs/cryaba_cryabb/). Based on CRISPR null mutants (PMID:29162721): GO:0036438 maintenance of lens transparency KEEP_AS_NON_CORE -> ACCEPT (cryabb nulls have dosage-sensitive lens defects, partially rescued by lens-specific cryabb); GO:0007519 skeletal muscle tissue development and GO:0030239 myofibril assembly ACCEPT -> KEEP_AS_NON_CORE (morpholino-only evidence, PMID:25866181, contradicted by cryabb, cryaba and double nulls with no muscle phenotype; not REMOVE because compensation by other sHSPs cannot be excluded; now matches cryaba). GO:0060047 heart contraction kept ACCEPT with added null-mutant support (slower heart rate, dexamethasone-reduced shortening fraction). core_functions: replaced the two muscle processes with maintenance of lens transparency. Description updated (null vs morpholino, Nrf2/glucocorticoid-specific induction of cryabb, PMID:26378715 binding data). Added references PMID:26378715, PMID:29162721, PMID:36572168, PMID:37577747.
