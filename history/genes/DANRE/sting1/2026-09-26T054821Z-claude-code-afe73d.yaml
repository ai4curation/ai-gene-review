  summary: Review zebrafish sting1 GO annotations
  details: |
    Reviewed all 36 GOA annotations for zebrafish sting1/MITA (E7F4N7): 30 ACCEPT, 5 KEEP_AS_NON_CORE (inherited autophagy terms), 1 MODIFY (generic protein binding to TRAF6 changed to molecular adaptor activity, supported by the STING C-terminal tail/TRAF6 co-crystal PMID:31018131). Unlike Drosophila, teleosts have a type I interferon system, so IFN-production terms are biologically appropriate and were accepted. core_functions: molecular adaptor activity driving cGAS/STING signaling and type I IFN, 2',3'-cGAMP binding, proton channel activity driving macroautophagy. Notes compiled manually (deep-research providers unavailable). Validated with just validate DANRE sting1.
