  summary: 'Address PR #3344 review: GO:0015252 to KEEP_AS_NON_CORE with the real
    proton-channel paper'
  details: |
    PR shepherd response to the CHANGES_REQUESTED review on PR #3344.

    Item 3: GO:0015252 proton channel activity was an ISS transfer from human STING (Q86WV6) with
    action ACCEPT and a reason ending 'Retained as by-similarity' - which contradicts what ACCEPT
    means - and it was elevated to core function 3. Its supported_by cited PMID:30842662 and
    PMID:24922577, both autophagy papers that do not report proton-channel activity.

    Changed to KEEP_AS_NON_CORE and re-grounded supported_by on PMID:37535724 'Human STING is a
    proton channel', the founding study that actually measured proton transport in
    reconstituted proteoliposomes and is the donor of the ISS transfer. Added that reference with
    a reference_review noting relevance MEDIUM because the assay is on the human protein.

    Removed the GO:0015252 core_functions entry: KEEP_AS_NON_CORE and core membership are
    contradictory, and there is no measured zebrafish molecular function for the autophagy branch.
    The autophagy process itself is not lost - GO:0016239 remains ACCEPT in existing_annotations
    with zebrafish IDA support (PMID:30842662). Added a suggested_question applying the same
    inferred-versus-measured caution the file already applies to CDN binding. Validated with
    just validate; status COMPLETE is unchanged and still the computed value.
