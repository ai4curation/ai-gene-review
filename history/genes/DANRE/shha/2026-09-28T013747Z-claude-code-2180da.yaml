  summary: 'Create review: DANRE shha (117 GOA rows)'
  details: |
    De-novo review of zebrafish shha run from outside the repo via the go-skills gene-review front door (first test of that skill). Deep research unavailable (no provider keys); manual literature synthesis in shha-notes.md from 54 cached GOA-cited papers plus PMID:8824192, PMID:7583153, PMID:8269518. All 117 GOA rows reviewed: 13 ACCEPT, 92 KEEP_AS_NON_CORE, 7 MARK_AS_OVER_ANNOTATED, 4 MODIFY, 1 REMOVE, 0 NEW. MODIFY: GO:0004175 endopeptidase -> GO:0140853 cholesterol-protein transferase; 3x GO:0001756 somitogenesis -> GO:0061053 somite development. REMOVE: GO:0016539 intein-mediated protein splicing (InterPro Hint homology artefact). Over-annotated: axon guidance (PMID:19846707 attributes phenotype to muscle contraction), MHB development (MO-only), blood circulation, 4 broad ARBA terms. Core functions mirror genes/human/SHH: patched binding / smoothened pathway in extracellular region; cholesterol-protein transferase / protein autoprocessing in ER. Validated with just validate DANRE shha (clean).
