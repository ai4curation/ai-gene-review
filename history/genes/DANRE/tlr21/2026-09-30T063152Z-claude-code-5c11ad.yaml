  summary: 'Create review: tlr21'
  details: |
    Created the full review for zebrafish tlr21 (F1QMN8) in INNATE_IMMUNITY batch 1. Entry identity confirmed (RefSeq NP_001186264, GeneID 402884, ZFIN ZDB-GENE-040220-4; the 989-residue length matches the receptor characterised in the literature). All 10 rows reviewed: both GO:0002224 rows modified to GO:0035682 toll-like receptor 21 signaling pathway; GO:0038023 modified to GO:0038187 pattern recognition receptor activity; GO:0005783 endoplasmic reticulum accepted; GO:0005886 IBA marked as over-annotated, since the receptor acts intracellularly and its activation is chloroquine-sensitive; GO:0002221, GO:0019731, GO:0007165 and GO:0016020 kept as non-core; and GO:0061809 NAD+ nucleosidase activity REMOVED. That removal is the most consequential decision: the row is an IEA mapping of EC:3.2.2.6 inherited from the RefSeq DE line, evidently a mis-generalisation from the NADase activity of plant TIR proteins and SARM1, and UniProt states on its reviewed entries of this family that Toll-like receptors are unlikely to have NADase activity. Validation: clean.
