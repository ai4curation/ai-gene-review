  summary: 'Cross-check review against Falcon deep research: tlr21'
  details: |
    Compared tlr21-deep-research-falcon.md with the completed review. The report independently reaches the same conclusions on ligand, motif preference, intracellular localisation and the functional-analogy-not-orthology relationship to TLR9, and notably agrees that the EC:3.2.2.6 assignment is an annotation error, which is now cited as concurrence on the GO:0061809 REMOVE row. One addition taken up as a question rather than an annotation: adaptor usage for this receptor is unresolved, with the comparative literature split between a MyD88-associated model and a TRIF-exclusive model for fish TLR21 and no zebrafish experiment either way. CpG-ODN protection against Vibrio vulnificus not used (ligand treatment, not receptor manipulation); interferon and IRF3/IRF7 outputs not used, being extrapolated from chicken TLR21. No annotation action changed and no new annotations.
