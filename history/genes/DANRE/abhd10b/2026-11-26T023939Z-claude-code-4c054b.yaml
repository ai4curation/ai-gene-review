  summary: Record OpenScientist refutation of a sequence-predictable substrate split
    between the zebrafish abhd10 ohnologs
  details: |
    Ran an OpenScientist deep-research job (kgap-abhd10b-paralog-divergence) on the knowledge gap covering the endogenous processes and substrate partitioning of zebrafish abhd10b against its whole-genome-duplication paralog abhd10a. It refutes the substrate half of the gap, leaves the process half untouched, and does so by failing a test the prompt set up to be falsifiable.

    The ohnolog relationship is confirmed rather than assumed, by double-conserved synteny: tagln3a/tagln3b, gtf3aa/gtf3ab and wasf3a/wasf3b each have one copy flanking each locus, and the human ABHD10-TAGLN3-TMPRSS7 microsyntenic block is retained in both copies. Every sequence-accessible test of divergence then came back negative or symmetric. Both paralogs keep a complete Ser-Asp-His triad, abhd10b at Ser136-Asp233-His263 and abhd10a at Ser131-Asp228-His258, with both oxyanion-hole amide donors and an identical GSSMGGW nucleophile elbow; the local E7F9Y7 record confirms the triad, the elbow at 134-140 and the 289-residue length. Of the 27 acyl-channel lining residues, 19 are identical between the paralogs and all 7 strictly invariant across 26 single-copy tetrapod orthologs are identical in both.

    The decisive test asked where the 8 differing channel positions sit relative to vertebrate constraint, and they sit exactly where they would not if substrate preference had been partitioned: mean entropy 1.643 bits against 0.710 at the agreeing positions, one-sided p = 0.0047, none of the 8 invariant anywhere in tetrapods against 7 of 19. Neither copy is ancestral, each matching the tetrapod consensus at 18 of 27 positions. A Tajima relative-rate test against five single-copy outgroups gives p = 0.23 to 0.86 with the direction flipping between outgroups, and the dN/dS version is reported as not computable rather than estimated because synonymous sites are saturated. Zebrafish has a single prdx5 whose substrate site sits in a window identical at 17 of 17 positions, so a one-substrate-per-paralog partition is not available.

    The leading remaining alternative, subfunctionalization by expression domain, could not be tested, for two reasons the run keeps apart. Access: the EBI Expression Atlas gene endpoint returned 404 and Bgee returned 403 behind a bot challenge. Structural, and persisting with access: Ensembl has no abhd10b gene on the primary zebrafish assembly. The 289-residue ORF is transcript tagln3b-201 of ENSDARG00000058394, displayed as tagln3b; the coding exons of the transgelin transcripts and of the abhd10b transcript do not overlap at all, sharing only 583 base pairs of UTR that merge the two genes into one model, while NCBI keeps them separate as GeneID 492622 and GeneID 797861. Any Ensembl-keyed expression value for abhd10b therefore sums it with a highly expressed neuronal transgelin.

    That merge is recorded in the gap boundary rather than as a gene_model_issues entry, because the defect lies in a third-party gene model and not in this entry's sequence: E7F9Y7 is a single real gene product, so FUSED_GENE_MODEL, which the schema defines as a predicted protein joining two genes, would assert something false.

    Two cautions were also captured for anyone extending this work. The acyl channel is a detected cavity in an apo structure whose only ligand sits 16.2 Angstrom from the catalytic serine, not an observed substrate path, and the 230 cubic Angstrom volume difference is residue-volume arithmetic over eight substitutions rather than a remodelled cavity. And the obvious outgroups are unsafe: the spotted gar model that Ensembl calls a one-to-one ABHD10 ortholog has lost the catalytic serine through a mis-predicted exon, and the chicken model aligns at 17.5 to 27.8 per cent against 57 to 78 per cent for every other ortholog, so a curator reaching for the gar sequence could wrongly conclude the pre-duplication ancestor was already degenerate.

    Gap status moved from OPEN to NARROWING, since the substrate-partitioning sub-question now has a measured negative while the organismal process roles remain wholly unassayed. No annotation action was changed. Not recomputed here: the abhd10a numbering, the entropy and relative-rate analyses, the channel definition from PDB 6NY9, the synteny survey, the Ensembl and NCBI coordinates, and the gar and chicken assessments.
