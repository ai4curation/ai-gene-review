  summary: 'Re-review: glceb'
  details: |
    Re-reviewed all ten glceb annotations, replacing templated one-line reasons and the UniProt FUNCTION line that had been pasted under localization terms with evidence specific to each claim. Cached Ghiselli and Farber 2005, the zebrafish paper UniProt cites but the review omitted, which confirms glce-B identity, maternal deposition and the BMP dorsoventral context; no NEW term was proposed from it because the epimerase does no work in axis formation. Changed GO:0005794 Golgi apparatus IBA from ACCEPT to KEEP_AS_NON_CORE as the redundant parent of the annotated Golgi membrane term, and rebuilt the catalytic and pathway rows on the zebrafish crystal structure and mutagenesis data. Added reference_review to both PMIDs and rewrote the description and core function. Validation: zero errors, zero warnings.
