  summary: 'Pair-review corrections: cryaba chaperone and wrong-copy citations'
  details: |
    Targeted edits from the DANRE_DUPLICATION cryaba/cryabb pair comparison (projects/DANRE_DUPLICATION/pairs/cryaba_cryabb/). (1) Description and PMID:16420472 finding corrected: the 0.16% lens abundance, broad heart/brain/muscle/liver RT-PCR expression and 25-30 C chaperone data in Smith 2006 refer to alphaB2 (cryabb), not cryaba; replaced with PMID:10542326 (lens-restricted expression) and PMID:18449354 (alphaBa ~2.56% of lens protein). (2) IBA unfolded protein binding: removed a Smith 2006 supporting quote about alphaB2 (wrong copy) and the falcon 'lower baseline chaperone activity' quote; added PMID:26378715 binding-assay quotes showing alphaBa binds substrate with higher affinity than alphaBb and human alphaB. Smith 2006 'nonchaperone role' finding marked DISPUTED (superseded_by PMID:26378715, PMID:29162721). (3) Added PMID:29162721 (CRISPR nulls) support to maintenance of lens transparency, skeletal muscle tissue development (no muscle phenotype in nulls), myofibril assembly and heart contraction (stress-induced edema). No actions changed. (4) Chaperone core_function description rewritten to reflect assay-dependent activity. Added references PMID:10542326, PMID:18449354, PMID:26378715, PMID:29162721, PMID:36572168, PMID:37577747.
