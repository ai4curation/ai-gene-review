  summary: 'Create review: dnajc6 (zebrafish auxilin, A0A8M9Q6X2)'
  details: |
    De-novo full review independent of ProtNLM2 predictions, as the characterised same-gene reference for A0A8M9QG43. Deep research failed (falcon auth, perplexity quota); built from PMID:20082716 (only zebrafish experimental study: heterologous HeLa localization, J-domain-dependent rescue of Drosophila auxilin), PMID:20826345 (auxilin PTEN-like domain is a pseudophosphatase) and mouse donor PMID:20160091. Added a P-loop/HPD sequence check (dnajc6-bioinformatics). Removed the two UniRule phosphatase/hydrolase MF rows (degenerate P-loop TCSDGRAPS); refined cytoplasm to cytosol and vesicle to clathrin-coated vesicle; marked postsynaptic density over-annotated (donor is phosphoproteomics fraction detection); accepted clathrin binding, synaptic vesicle uncoating, clathrin-dependent endocytosis and CCV as orthology inferences.
