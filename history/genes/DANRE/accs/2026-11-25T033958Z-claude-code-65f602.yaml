- type: EDIT
  outcome: changed
  summary: Record OpenScientist analysis inverting the Arg351 polarity for zebrafish
    accs
  details: |
    Ran an OpenScientist deep-research job (kgap-accs-teleost-betalyase-pocket) on the knowledge gap covering whether zebrafish accs retains cysteine S-conjugate beta-lyase activity given its Cys302 substitution at the mammalian Arg351 pocket position. The run confirms the residue mapping by two independent alignment algorithms, and all ten mapped active-site positions verify against the local A0A8M1N4R4 record, as do human Arg351, Lys323 and Arg457 against the local Q96QU6 record and both anchoring motifs.

    The evolutionary reading in the gap is inverted by the result. Arg at that column is a mammal-restricted innovation, present in 80 of 81 mammals and 0 of 226 non-mammalian vertebrates across a 307-ortholog survey, with Tyr as the ancestral vertebrate state and six different states across 19 ray-finned fishes. The mammalian pocket determinant therefore postdates the teleost-tetrapod split, and the zebrafish Cys is one draw from a variable distribution rather than loss of an ancestral determinant. The catalytic machinery is intact, with the PLP Schiff-base Lys274 and substrate-anchoring Arg408 retained and near-invariant.

    Status moved from OPEN to NARROWING. The activity question still needs the recombinant assay the resolution already proposes, but its framing changes: the Cys302 substitution is no longer evidence for lost function. Two caveats are recorded. The run reports the C-terminal extension as 104 residues against the 95 stated in the gap, and that discrepancy was not independently checked. Its one annotation lead, that GO:0009693 ethylene biosynthetic process is an ARBA over-annotation, is already recorded in this review as a REMOVE with a source defect, so it corroborates rather than changes the review.
