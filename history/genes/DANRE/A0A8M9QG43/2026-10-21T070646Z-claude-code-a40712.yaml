  details: |
    Full re-review independent of ProtNLM2 predictions. Identified A0A8M9QG43 as a 974-aa alternative-splice isoform of zebrafish dnajc6 (5-residue N-terminal deletion vs UniProt gene-centric canonical A0A8M9Q6X2, all domains intact). UniRule phosphoprotein phosphatase and hydrolase rows changed MARK_AS_OVER_ANNOTATED -> REMOVE: bovine auxilin 1 (same PANTHER SF4) PTEN-like region has no detectable activity (PMID:20826345) and zebrafish shares the non-PTEN P loop. Replaced ARBA-derived UniProt quotes with primary literature (PMID:8524399, PMID:20082716) and PAINT root-node PTN000571055 IBDs. Added NEW clathrin binding; dropped redundant NEW clathrin-dependent endocytosis (ancestor of clathrin coat disassembly). Added core function for clathrin binding. New analysis compare_isoforms_rereview.py / RESULTS-rereview.md.
