  summary: 'Revise kita GO:0038093 removal rationale and core-function orthology framing
    (PR #3319 review)'
  details: |
    Follow-up to the PR #3319 review. SUPERSEDES the rationale recorded in history/genes/DANRE/kita/2026-09-27T181758Z-claude-code-c60847.yaml, which described the GO:0038093 (Fc receptor signaling pathway) removal as a 'spurious Fc receptor signaling InterPro2GO mapping'. That framing was withdrawn: GO:0038093 is a process term (it does not assert kita is an Fc receptor) and the IPR027263 mapping is grounded in mammalian FcepsilonRI/KIT mast-cell crosstalk (human KIT keeps the identical mapping as KEEP_AS_NON_CORE on PMID:20100931). The removal is retained but now justified on taxonomic grounds: teleosts lack IgE and an FcepsilonRI alpha subunit. Also reframed core function #2 so the dimerization/kinase-activation mechanism is inferred by orthology to human KIT (added PMID:17662946 with a verbatim quote) rather than resting on genetic epistasis; completed the truncated PMID:17257055 quote. Re-validated (0 errors) and re-rendered.
