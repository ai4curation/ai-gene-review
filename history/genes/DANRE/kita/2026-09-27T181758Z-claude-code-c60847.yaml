  summary: 'Create review: zebrafish kita (SCF receptor / KIT co-ortholog, sparse)'
  details: |
    Reviewed all 53 seeded GOA annotations for zebrafish kita (Q8JFR5), the teleost-WGD co-ortholog of mammalian KIT (the sparse mutant), distinct from the diverged paralog kitb. Actions: 10 ACCEPT, 3 MODIFY (protein kinase->transmembrane RTK activity GO:0004714; growth-factor/cytokine binding->stem cell factor receptor activity GO:0005020), 1 REMOVE (spurious Fc receptor signaling InterPro2GO mapping), 39 KEEP_AS_NON_CORE (melanocyte/pigmentation/hematopoietic lineage outputs). Two core functions: stem cell factor receptor activity and transmembrane receptor protein tyrosine kinase activity initiating Kit signaling. Corroborated by the committed Falcon deep research; consulted the human KIT review. Reviewed as an alternate-species exemplar for the Kit signaling module. Validated (0 errors).
