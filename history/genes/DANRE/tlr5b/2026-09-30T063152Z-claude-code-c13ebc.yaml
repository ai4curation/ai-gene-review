  summary: 'Create review: tlr5b'
  details: |
    Created the full review for zebrafish tlr5b (A0ACM8R384) in INNATE_IMMUNITY batch 1. Entry identity confirmed: RefSeq NP_001124067 and GeneID 403139 are zebrafish tlr5b. All 5 rows are electronic and all were reviewed: GO:0002224 modified to GO:0034146 toll-like receptor 5 signaling pathway; GO:0004888 modified to GO:0038187 pattern recognition receptor activity; GO:0006955 and GO:0007165 kept as non-core; GO:0016020 accepted and deliberately not refined, because the paralogues were observed in vesicle-like compartments rather than at a defined surface location. Key decision for the project's ligand-transfer question: the mammalian TLR5 ligand specificity does transfer, and unusually the structural evidence is on this very protein, since the reference TLR5-flagellin crystal structure was solved with the zebrafish TLR5b ectodomain; what does not transfer is the receptor configuration, because zebrafish TLR5 is an obligate heterodimer of tlr5b with tlr5a and neither paralogue signals alone. The core function therefore records the activity under contributes_to_molecular_function. Validation: clean.
