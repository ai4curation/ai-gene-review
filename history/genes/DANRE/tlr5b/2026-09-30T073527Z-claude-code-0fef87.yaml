  summary: 'Cross-check review against Falcon deep research: tlr5b'
  details: |
    Compared tlr5b-deep-research-falcon.md with the completed review; it agrees on every decision, including the caution that the grass carp dsRNA result has not been shown for zebrafish. Fetched PMID:26208853, which supplies the in vivo evidence the review lacked: morpholino knockdown in embryos prevents flagellin-induced il1b up-regulation, with a partial effect for this paralogue alone and a complete block when both are targeted, the asymmetry an obligate heterodimer predicts. Added to the GO:0034146 row and core_functions. Also made the location reason precise, since the primary paper's marker data (stronger association with LAMP-1 than EEA-1 vesicles; UNC93B1 shifting both receptors toward LAMP-1 compartments) were more specific than the review's wording, while the annotation stays at generic membrane because the data are from heterologous overexpression. No annotation action changed and no new annotations.
