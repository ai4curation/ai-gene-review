  summary: 'Create review: zebrafish kitlga (Kita ligand / SCF co-ortholog)'
  details: |
    Reviewed all 15 seeded GOA annotations for zebrafish kitlga (Q56JH6), the teleost-WGD co-ortholog of mammalian KITLG that functions as the Kita ligand. Actions: 6 ACCEPT, 9 KEEP_AS_NON_CORE (melanocyte differentiation and by-similarity projection localizations kept as zebrafish-specific developmental outcomes). Two core functions: stem cell factor receptor binding (GO:0005173) and cytokine activity (GO:0005125). Key evidence PMID:17257055 (kitla morphants phenocopy kita null; kita-dependent hyperpigmentation on overexpression). Added as an alternate-species exemplar for the Kit signaling module documenting teleost subfunctionalization (kitlga vs kitlgb). Validated (0 errors).
