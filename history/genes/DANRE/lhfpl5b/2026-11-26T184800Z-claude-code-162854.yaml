  details: |
    Re-review of the IBA row for GO:0007605 sensory perception of sound (batch N25 of projects/IBA_REVIEW/overannotated-2026-11-24). Action changed from MARK_AS_OVER_ANNOTATED to REMOVE (ground TARGET_LOSS). The IBD at PTN000968268 (83 leaves) is seeded by mouse Lhfpl5 and fly Tmhs; mouse Lhfpl5 shares the 21-leaf LHFPL5 clade PTN002647973 with lhfpl5b, so the node is not the problem. The evidence already quoted in the row (lhfpl5b mutants have normal inner ear function, and the gene is not expressed in ear hair cells at larval or adult stages) is evidence that this copy does not take part in hearing, which the protocol treats as removal with a loss on the branch. The reason was rewritten with the clades and still states that adult mutants were not tested. Quotes unchanged. just validate passes.
