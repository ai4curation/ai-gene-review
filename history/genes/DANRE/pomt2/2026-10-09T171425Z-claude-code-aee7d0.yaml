  details: |
    Kept molecular_function GO:0004169 on the core function after confirming GOA uses the enables qualifier for zebrafish pomt2 and human POMT2 (Q9UKY4); added sentences to the core description and the IGI row reason explaining that Pomt2 is itself a GT39-fold catalytic subunit of the obligate Pomt1-Pomt2 heteromer, unlike the non-catalytic electron-donor subunit dph2 which only contributes_to its partner's activity. Added in_complex GO:0031502 dolichyl-phosphate-mannose-protein mannosyltransferase complex (verified in QuickGO; human POMT1/POMT2 part_of by IPI).
