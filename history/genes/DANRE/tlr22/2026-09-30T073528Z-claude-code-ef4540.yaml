  summary: 'Cross-check review against Falcon deep research: tlr22'
  details: |
    Compared tlr22-deep-research-falcon.md with the completed review. The report independently confirms the review's central judgment, stating that the zebrafish protein itself has never been tested for ligand binding and listing as unresolved exactly the four things the review declined to annotate (ligand, localisation, adaptor, downstream pathway); added as a reference and cited on the generic membrane row. One refinement: the cross-species localisation transfer the review declined would not even have had a single target, since the fugu work places TLR22 at the cell surface while recent fish-TLR reviews describe it as endosomal and lysosomal; recorded in that row's reason. Mycobacterium-induced expression of zebrafish tlr22 traces only to a 2024 review, no primary source found, and would in any case be transcript-level, so the UNDECIDED GO:0009617 row stays UNDECIDED. No annotation action changed and no new annotations. Also removed duplicated reference entries.
