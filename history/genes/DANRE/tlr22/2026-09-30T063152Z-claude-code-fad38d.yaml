  summary: 'Create review: tlr22'
  details: |
    Created the full review for zebrafish tlr22 (A0A2R8RTN4) in INNATE_IMMUNITY batch 1; the thinnest evidence base of the eight genes, so the review is deliberately conservative. Entry identity confirmed (RefSeq NP_001122147, GeneID 403135, ZFIN ZDB-GENE-040220-5). All 4 rows reviewed: GO:0002221 modified to GO:0002224 toll-like receptor signaling pathway; GO:0016020 accepted; GO:0007165 kept as non-core; GO:0009617 response to bacterium (ZFIN IDA) left UNDECIDED because the cached publication is abstract-only and its abstract, while confirming that this transcript was measured after bacterial inoculation, does not report how it behaved. This gene answers the project's question about missing numbered pathway terms: GO:0002224 is sufficient and no toll-like-receptor-22 term should be requested yet, because neither ligand nor adaptor has been demonstrated for the zebrafish protein, the fish tlr21/tlr22/tlr23 names are unstable (this gene's own synonym is TLR21.2), and the only functional characterisation of any TLR22 is in fugu, so no dsRNA-binding, interferon-pathway or cell-surface annotation was proposed. Validation: clean.
