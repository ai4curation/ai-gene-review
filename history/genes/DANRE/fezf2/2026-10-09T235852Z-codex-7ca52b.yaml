  summary: Keep fezf2 commissural axon guidance as non-core
  details: |
    Revisited the two GO:0071679 commissural neuron axon guidance annotations from PMID:21471212 during PR review follow-up. Changed both from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE because the full-text paper directly reports transient anterior and post-optic commissure crossing defects in tof mutants and fezf2 morphants, and acts_upstream_of_or_within covers Fezf2's upstream transcriptional activation of lhx2b. Left the phenotype outside core_functions because it recovers by 48 hpf and is downstream of Fezf2's core cis-regulatory DNA-binding transcription-factor activity. Validated with just validate DANRE fezf2 and rendered with just render DANRE fezf2.
