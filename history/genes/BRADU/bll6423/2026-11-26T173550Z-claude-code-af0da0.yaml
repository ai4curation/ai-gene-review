- type: EDIT
  outcome: changed
  summary: 'Wire OpenScientist benchmarked negative: cupin metal site absent, metal-free
    clade, substrate unnamed'
  details: |
    Wired an OpenScientist run (kgap-bll6423-cupin-metal-site) into the single
    knowledge gap on bll6423, the third gene of this operon to be run. Status OPEN ->
    NARROWING. The constraint runs in two directions, and the negative half is the more
    useful.

    Metal site absent, and absent completely rather than degenerate. Both cupin
    consensus motifs fail to match the 194-residue sequence, there is no His-x-His pair
    at any position, and the local UniProt record carries no BINDING feature, no metal
    annotation and no COFACTOR comment. A geometric metal-site detector returns zero
    clusters for a predicted model of this protein and zero for PDB 3ES1, a 1.91 A
    experimental structure of a 37.9% identical relative whose only heteroatoms are one
    chloride and waters.

    The run benchmarked that detector before trusting the zero, which is what makes the
    negative usable: across 88 experimentally determined cupin chains it fires on 75
    (85.2%), finds a bound transition metal in 47 of 48 cases (sensitivity 0.979), and
    places its centroid a median 1.40 A from the nearest metal. So a cupin chain
    returning zero has no site, with a measured error rate rather than an unquantified
    absence. This protein has gone further than its own clade: the His-x-His pair that
    FdeH, VirC and StrC still carry, and which sits empty even where kept, is replaced
    here by Pro70 and Thr73.

    Positive half: subfamily placement with a large effect size plus a conserved ligand
    pocket. Ranked against all 1001 reviewed members of the RmlC-like cupin superfamily
    with a length-calibrated shuffled-query null, the nine top-scoring proteins are all
    virC/oryJ-clade cupins with no annotated cofactor (z = 14.7 to 40.3); the best
    metal-dependent cupin enzyme anywhere in the set is
    1-hydroxy-2-naphthoate 1,2-dioxygenase at z = 7.2, with OxdC at 4.1 and quercetin
    2,3-dioxygenase at 4.4 - a gap of 33.1 SD from the top clade hit. Dioxygenase,
    decarboxylase, phosphoglucose-isomerase-like and epimerase readings are therefore
    specifically disfavoured, not merely unsupported. What is conserved is a buried
    141 A^3 cavity, within 10% of the 129 A^3 pocket holding a real ligand in the
    closest characterised relative, lined by His123, Asp129, His162 and Trp164, which
    map one for one onto the four StrC residues contacting a bound cyclohexenone in PDB
    8X0V.

    FdeH is Hsero_1010 and has no reaction assigned anywhere in the characterised
    Herbaspirillum pathway: never mutated, never assayed, and its UniProt entry carries
    no EC number, cofactor or binding site. bll6423 is its direct ortholog at 67.0%
    identity over 188 residues, so it is the syntenic equivalent of FdeH rather than
    another cistron, and that equivalence transfers nothing about chemistry. This is the
    same prop the bll6421 run had to remove, for the same reason.

    What survives: if there is a reaction at all it is an intramolecular rearrangement
    on a small cyclic molecule performed without a metal, and non-catalytic
    small-molecule binding remains live. No substrate can be named and no
    metal-dependent catalytic term should be carried.

    Carried forward from the two earlier runs on this operon and not re-derived: the
    gene-for-gene synteny with the Herbaspirillum naringenin operon, the NodW-dependent
    genistein induction, the missing meta-cleavage product hydrolase, bll6422's
    placement on the carbon-carbon hydrolase side of the FAH superfamily, and bll6421's
    NAD-dependent epimerase/reductase chemistry with an absent nucleotide-sugar subsite.

    Verified here against the entry's own record (194 residues): His123, Asp129, His162,
    Trp164, Pro70, Thr73; the absence of any His-x-His pair anywhere in the sequence,
    confirmed independently with my own scan; and zero BINDING, METAL and COFACTOR
    lines. Not reproduced here: the motif scans, the structural detection and its
    88-chain benchmark, the 1001-protein ranking and null, the cavity volume and the
    ligand-contact mapping.

    No annotation action changed and no core function added.
