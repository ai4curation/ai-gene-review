  summary: Resolve round-2 flavonoid review for BRADU/bll6428
  details: |
    Broad GO:0016787 hydrolase activity is retained in the core synthesis as a family/fold/conserved-candidate inference, without selecting ester versus C-C chemistry, substrate, or native process participation. The independent sequence check corrects the provider report's Asp358 to actual Asp359 in PP_3195. Its H405 candidate corresponds to bll6428 Q374, while alignment of characterized Q93NG6 S217/D300/H329 maps to PP_3195 S268/D359/H394, Hsero_1004 S233/D324/H359 and bll6428 S237/D328/H363. Candidate correspondence is not proof of target geometry or catalytic loss. See PP_3195-bioinformatics/fdeb-round2/RESULTS.md and the reproducible round2 maps. The C-C family comparator is now cited directly to the primary PMID:16321959 (hydrolytic cleavage) and official reviewed Q93NG6 record; PMID:17275835 supports the comparator structure/mutagenesis context. Both fetched papers are abstract-only; no target experiment is attributed to them. Focused validation, rendering, action/retirement accounting and source preservation are recorded in the round2 audit.
