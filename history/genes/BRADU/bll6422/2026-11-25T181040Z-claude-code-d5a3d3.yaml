  summary: Record OpenScientist reaction assignment for bll6422 with substrate left
    unconstrained
  details: |
    Ran an OpenScientist deep-research job (kgap-bll6422-reaction-and-context) on the knowledge gap covering the physiological substrate and catabolic contribution of bll6422. The run splits the gap cleanly: the reaction is constrained more tightly than a family label would give, while the substrate is not constrained at all, and the two halves are recorded separately.

    On reaction, bll6422 is a fumarylacetoacetate hydrolase superfamily protein, which the local record carries as PF18288 with PF01557, SSF56529 and the FAH C-terminal Gene3D entry. Three independent structural comparisons converge on the same four-carboxylate metal site and the same catalytic histidine, with equivalences landing on His91, Glu140, Glu142, Asp171, Arg175, Lys192, Thr264 and Asp84, every one of which was confirmed in the local Q89GC3 record. A family-wide alignment ranking across reviewed members places bll6422 on the carbon-carbon hydrolase side of the superfamily rather than the hydratase side with a large effect size. The predicted reaction is therefore metal-dependent hydrolysis of a carbon-carbon bond in a ketonic substrate, and the run notes that the 2-oxopent-4-enoate hydratase assignment RefSeq gives to two shorter paralogs in this genome should not be propagated here.

    On substrate, the run is explicit that nothing it found measures one. The gene sits in an eight-gene operon with a divergent LysR regulator that is a gene-for-gene syntenic copy of the genetically defined Herbaspirillum naringenin degradation operon, and the operon responds to the soybean isoflavone genistein in a way that requires NodW. But no flavonoid has been shown to be consumed by this organism, no product of this locus has been assayed, no enzyme in the operon is flavonoid-specific by sequence, and the operon lacks the meta-cleavage product hydrolase that would name the compound bll6422 receives. Synteny and induction are both real and both silent about chemistry.

    Status moved from OPEN to NARROWING on the reaction half. Caveats recorded with the reaction claim, as the run states them: every structural statement rests on a predicted model rather than an experimental structure of this protein; the closest characterised enzyme is at about 29 per cent identity, which transfers chemistry and not substrate; the induction is roughly 2.3-fold at operon level from a single laboratory's series with no per-gene significance; and the one position with experimental bearing on specificity points at a subfamily whose upstream ring-cleavage chemistry this operon does not encode, so that lead is uncorroborated.

    The superpositions, family-wide ranking and its statistics, operon coordinates and spacings, synteny call and expression analysis were not independently recomputed. No annotation action was taken.
