- type: EDIT
  outcome: changed
  summary: 'Wire OpenScientist split verdict: epimerase-type NAD chemistry, nucleotide-sugar
    subsite absent, substrate unconstrained'
  details: |
    Wired an OpenScientist run (kgap-bll6421-reaction-class) into the single knowledge
    gap on bll6421. The verdict is the same split the bll6422 run produced: the
    chemistry narrows well below the family label, the substrate stays unconstrained.
    Status left OPEN, because the substrate half is untouched and that is what the gap
    statement asks.

    Chemistry. The catalytic set is complete and of the epimerase/reductase type:
    Ser117, Tyr140, Lys144 in the YxxxK arrangement, superposing on the E. coli
    UDP-glucose 4-epimerase triad within 1.21, 0.79 and 0.51 A of CA-CA. The
    4,6-dehydratase acid-base pair is absent, replaced by Ile118 and Ala119 at a column
    carrying a glutamate in 46 of 46 reviewed NDP-sugar 4,6-dehydratases and 0 of 235
    4-epimerases. The cofactor is NAD: Asp33 makes the bidentate contact to the
    adenosine 2'/3' hydroxyls across three holo frames, and the 2'-phosphate pocket is
    lined by Leu34 plus five uncharged residues with no basic side chain within 8 A.

    Substrate. Of the 23 UDP-glucose contact positions in the reference epimerase, 4
    are kept by superposition and 3 by sequence, with 3 of 4 charged ligand contacts
    lost; UDP-glucose in the reference pose gives 68 heavy-atom clashes within 2.6 A
    against 1 for the reference, seven of them main-chain. A divergence-matched control
    forecloses the "any distant homolog would fail this" objection: across 68 reviewed
    4-epimerases contact conservation tracks identity (r = 0.871), the fit predicts 8.5
    contacts at this protein's 26% identity, the observed 3 is -1.90 SD, and all 15
    reviewed 4-epimerases in the matched 20-35% band score higher. So the
    nucleotide-sugar subsite is absent rather than eroded, which removes the
    nucleotide-sugar reading without supplying a replacement.

    The run also removes a prop this gap leaned on. bll6421 is the syntenic equivalent
    of FdeJ (50.8% identity; next-best cistron far below), but the defining genetic
    study mutated only fdeA and fdeR, no assay of FdeJ exists, and FdeJ's EC 5.1.3.2 is
    automatic genome annotation of the same kind that produced the label here. A
    family label cannot be inherited from an unassayed ortholog.

    Carried forward from bll6422 and not re-derived: the gene-for-gene synteny with the
    Herbaspirillum naringenin operon, the NodW-dependent genistein induction, and the
    operon's missing meta-cleavage product hydrolase.

    A suggested_questions entry now asks whether the NADP keyword on this entry should
    become NAD. The keyword carries ECO:0000256|ARBA, an automatic association-rule
    assertion this project does not treat as support, and the structural analysis
    contradicts it. Raised as a question rather than filed as a source defect because
    the geometry rests on a predicted model, not an experimental structure of this
    protein, and no cofactor has been measured for it.

    Verified here against the entry's own UniProt record (312 residues): all sixteen
    positions the argument rests on - Asp33, Leu34, Pro77, Arg90, Ser117, Ile118,
    Ala119, Tyr140, Lys144, Met208, Arg267, Thr271, Gly273 and the Rossmann glycines at
    7, 10 and 13 - with the N-terminal motif reading GAGGFIGS and 140-144 reading
    YGAHK, and the NADP keyword confirmed as ARBA-sourced. Not reproduced here: the
    superposition distances, pLDDT values, clash counts, reviewed-set column tallies
    and the divergence-matched regression.

    No annotation action changed, and no core function was added: the run's own
    conclusion is that no compound should be named in an annotation.
