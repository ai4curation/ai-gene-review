  details: |
    Reviewed the two InterPro IEA rows on Q2YIM3 and added two NEW rows. Generic oxidoreductase activity modified to GO:0030604 1-deoxy-D-xylulose-5-phosphate reductoisomerase activity (a descendant via GO:0016616), supported by the in vitro DXP to MEP assay and complementation of a dxr-deleted E. coli strain (PMID:20660776); NADP binding kept as non-core cofactor binding. NEW IDA row for GO:0030604 and NEW IGI row for GO:0019288, the latter justified because DRL performs the pathway step itself. Crystal-structure paper PMID:22442144 fetched for this review (abstract-only in cache). Added DRL-notes.md. Validated with just validate BRUA2 DRL (valid, no errors).
