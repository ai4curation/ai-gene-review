  summary: 'Create review: phoU (A0A0H2MBK2, VPARA_10440)'
  details: |
    Created review for Variovorax paradoxus TBEA6 phoU (UniProtKB:A0A0H2MBK2, VPARA_10440, 233 aa), the tandem PhoU-domain accessory regulatory protein of the PstSCAB-PhoBR phosphate signaling complex on contig JZWI01000005. Accepted GO:0030643 (intracellular phosphate ion homeostasis), GO:0045936 (negative regulation of phosphate metabolic process), and GO:0005737 (cytoplasm), and added NEW GO:0030145 (manganese ion binding) and GO:0000287 (magnesium ion binding) based on its conserved Glu96/Arg97 and Glu198/Arg199 metal-coordinating clusters across its two Pfam:PF01895 bundles (22-108 and 129-210) and PMID:24563032.
