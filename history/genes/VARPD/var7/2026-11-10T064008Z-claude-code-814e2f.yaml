  summary: Curate Variovorax paradoxus var7 (A0A0N9LYB5) terminal variobactin NRPS-thioesterase
  details: |
    Curated Variovorax paradoxus P4B var7 (A0A0N9LYB5, ALG65342.1, GenBank KT362218) using evidence from PMID:26412281, PMID:27023373, and PMID:38590537. Refined GO:0003824, GO:0043041, and GO:0044550, accepted GO:0005737 and GO:0031177, and added NEW GO:0016881 (acid-amino acid ligase activity, IC), GO:0016790 (thiolester hydrolase activity, IC), GO:0019184 (nonribosomal peptide biosynthetic process, TAS), and GO:0019290 (siderophore biosynthetic process, IC).
