  summary: Curate Variovorax paradoxus var4 (A0A0N7FMV9) hybrid PKS/NRPS and beta-aspartyl
    dioxygenase
  details: |
    Curated Variovorax paradoxus P4B var4 (A0A0N7FMV9, ALG65339.1, GenBank KT362218; ortholog of Variovorax varG) using chemical, genomic, and knockout evidence from PMID:26412281, PMID:27023373, and PMID:38590537. Removed TreeGrafter over-propagations to fatty acid synthase (GO:0004312, GO:0006633), refined broad IEA terms, and added NEW GO:0016706 (2-oxoglutarate-dependent dioxygenase activity, ISS), GO:0030639 (polyketide biosynthetic process, ISS), GO:0019184 (nonribosomal peptide biosynthetic process, TAS), GO:0019290 (siderophore biosynthetic process, ISS), and GO:0005737 (cytoplasm, IC).
