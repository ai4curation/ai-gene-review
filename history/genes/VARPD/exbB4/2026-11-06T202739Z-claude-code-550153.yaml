  summary: 'Create review: Variovorax paradoxus exbB4 (A0A0H2MHH3, VPARA_25810)'
  details: |
    Curated Variovorax paradoxus TBEA6 exbB4 (A0A0H2MHH3, VPARA_25810, 238 aa), the three-TM inner-membrane MotA/TolQ/ExbB proton-channel stator subunit (Pfam PF01618, residues 100-201) encoded in the exbD5-exbB4-tonB-bfrD1 (VPARA_25800-VPARA_25830) ferric-siderophore uptake operon. Removed TreeGrafter GO:0017038 (protein import) over-propagated from colicin toxin parasitism, accepted GO:0005886 (plasma membrane), and added GO:0015078 (proton transmembrane transporter activity), GO:1902600 (proton transmembrane transport), GO:0015891 (siderophore transport), and GO:0098797 (plasma membrane protein complex) supported by PMID:37219427 and PMID:20420522.
