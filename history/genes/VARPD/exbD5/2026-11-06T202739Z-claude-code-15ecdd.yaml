  summary: 'Create review: Variovorax paradoxus exbD5 (A0A0H2M1F3, VPARA_25800)'
  details: |
    Curated Variovorax paradoxus TBEA6 exbD5 (A0A0H2M1F3, VPARA_25800, 137 aa), the single-pass type II inner-membrane proton-coupling rotor subunit (Pfam PF02472, PANTHER PTHR30558) carrying the conserved transmembrane Asp23 residue in the exbD5-exbB4-tonB-bfrD1 (VPARA_25800-VPARA_25830) operon. Refined GO:0022857 to GO:0015078 (proton transmembrane transporter activity) and GO:0055085 to GO:1902600 (proton transmembrane transport) and GO:0015891 (siderophore transport), and added GO:0030288 (outer membrane-bounded periplasmic space) and GO:0098797 (plasma membrane protein complex) supported by PMID:37219427 and PMID:20420522.
