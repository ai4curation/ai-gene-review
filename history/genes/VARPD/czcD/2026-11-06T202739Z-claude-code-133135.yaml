  summary: 'Create review: Variovorax paradoxus czcD (A0A0H2M558, VPARA_15480)'
  details: |
    Curated Variovorax paradoxus TBEA6 czcD (A0A0H2M558, VPARA_15480, 320 aa), the 6-TM inner-membrane Cation Diffusion Facilitator (CDF) Zn(2+)/Co(2+)/Cd(2+) efflux antiporter (NCBIfam TIGR01297, Pfam PF01545) preserving intramembrane Site A ligands (His59, His62, His188, Asp192) and a 15-histidine cytoplasmic loop (residues 152-179). Accepted GO:0005385 (zinc ion transmembrane transporter activity), GO:0071577 (zinc ion transmembrane transport), and GO:0006882 (intracellular zinc ion homeostasis), and refined GO:0016020 to GO:0005886 (plasma membrane) supported by PMID:10559151 and PMID:27797207.
