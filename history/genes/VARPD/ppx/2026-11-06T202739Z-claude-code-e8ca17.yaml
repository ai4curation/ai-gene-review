  summary: 'Create review: Variovorax paradoxus ppx (A0A0H2MBK5, VPARA_10490)'
  details: |
    Curated Variovorax paradoxus TBEA6 ppx (A0A0H2MBK5, VPARA_10490, 506 aa), the cytosolic exopolyphosphatase (EC 3.6.1.11, PANTHER PTHR30005:SF14, InterPro IPR030673) containing an N-terminal ASKHA catalytic domain (Pfam PF02541, residues 23-307; P1 11-DLGSNSFR-18 and P2 142-DIGGRSTE-149) and a C-terminal polyP-binding domain (Pfam PF21447, residues 315-480). Accepted GO:0004309 (exopolyphosphatase activity) and GO:0006798 (polyphosphate catabolic process), marked GO:0016462 (pyrophosphatase activity) as TOO_GENERAL, and added GO:0005829 (cytosol) supported by PMID:23687963.
