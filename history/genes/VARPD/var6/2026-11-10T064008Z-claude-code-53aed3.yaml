  summary: Curate Variovorax paradoxus var6 (A0A0N9LX43) bimodular variobactin NRPS
  details: |
    Curated Variovorax paradoxus P4B var6 (A0A0N9LX43, ALG65341.1, GenBank KT362218) using natural product discovery and structural evidence from PMID:26412281, PMID:27023373, and PMID:38590537. Refined broad/obsolete IEA terms and added NEW GO:0016881 (acid-amino acid ligase activity, IC), GO:0019184 (nonribosomal peptide biosynthetic process, TAS), GO:0019290 (siderophore biosynthetic process, IC), and GO:0005737 (cytoplasm, IC).
