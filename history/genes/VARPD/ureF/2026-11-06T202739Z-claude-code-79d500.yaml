  summary: 'Create review: Variovorax paradoxus ureF (A0A0H2LZ72, VPARA_50930)'
  details: |
    Curated Variovorax paradoxus ureF (A0A0H2LZ72, VPARA_50930, 223 aa), the cytoplasmic urease accessory protein that docks UreG onto the UreD-apourease scaffold and gates its GTPase activity (HAMAP MF_01385, InterPro IPR002639, PANTHER PTHR33620:SF1). Removed over-propagated GO:0016151 (nickel cation binding) and added GO:0018237 (urease activator activity), GO:0030695 (GTPase regulator activity), and GO:0043419 (urea catabolic process) based on PMID:22369361.
