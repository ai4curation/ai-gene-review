  details: |
    Created review for Variovorax paradoxus TBEA6 fox (UniProtKB:A0A0H2M811, VPARA_05580, 474 aa), the FAD-dependent oxidoreductase of the 3,3'-thiodipropionate (TDP) catabolic cluster on contig JZWI01000003. Accepted GO:0071949 (FAD binding), marked GO:0050660 as TOO_GENERAL, modified GO:0003824 to GO:0016491 (oxidoreductase activity), removed GO:0022904 (respiratory electron transport chain) with source_defects on InterPro:IPR006076, and added NEW annotations for GO:0016491, GO:0044273 (sulfur compound catabolic process), and GO:0005829 (cytosol) supported by PMID:19001372.
