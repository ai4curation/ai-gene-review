  summary: 'Create review: mdo (B9U5L8, VPARA_05600)'
  details: |
    Created review for Variovorax paradoxus TBEA6 mdo (UniProtKB:B9U5L8, VPARA_05600, 195 aa), the mononuclear non-heme Fe2+-dependent 3-mercaptopropionate dioxygenase (EC 1.13.11.66) of the TDP catabolic cluster on contig JZWI01000003. Accepted GO:0008198 (ferrous iron binding) and GO:0016702 (dioxygenase activity), marked GO:0005506 (iron ion binding) as TOO_GENERAL, added NEW annotations for GO:0044273 (sulfur compound catabolic process) and GO:0005829 (cytosol), and proposed a specific 3-mercaptopropionate dioxygenase activity term supported by PMID:19001372.
