  summary: 'Create review: Variovorax paradoxus czcB (A0A0H2LX82, VPARA_44900)'
  details: |
    Curated Variovorax paradoxus TBEA6 czcB (A0A0H2LX82, VPARA_44900, 455 aa), the periplasmic HME-RND membrane-fusion adaptor protein (NCBIfam TIGR01730, InterPro IPR006143) encoded between czcA3 (VPARA_44890) and czcC (VPARA_44910), featuring an N-terminal 10-histidine metal-binding region (residues 41-121) and four CzcB/CusB periplasmic domains. Generalized CusB-transferred copper terms (GO:0015679, GO:0060003) to GO:0098655 (monoatomic cation transmembrane transport), refined GO:0022857 to GO:0015562 (efflux transmembrane transporter activity) and GO:0008324, and accepted GO:0046914 (transition metal ion binding) and GO:0030288 supported by PMID:10559151.
