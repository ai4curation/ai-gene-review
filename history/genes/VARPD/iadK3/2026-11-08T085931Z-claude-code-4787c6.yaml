  details: |
    Curated Variovorax paradoxus iadK3 (A0A0H2LZ84, VPARA_32100) using biophysical and structural comparison data from PMID:37459330. Removed over-projected GO:0006865 (amino acid transport, IEA from IPR000709) and added NEW GO:0031406 (carboxylic acid binding, IDA, reflecting weak association with oxIAA and absence of IAA binding due to S104V/W172L pocket substitutions) and GO:0042597 (periplasmic space, IC).
