  summary: 'Create review: zur (A0A0H2LYR2, VPARA_33720)'
  details: |
    Created review for Variovorax paradoxus TBEA6 zur (UniProtKB:A0A0H2LYR2, VPARA_33720, 149 aa), the Fur-family Zn2+-sensing transcriptional repressor Zur encoded adjacent to the znuCBA operon on contig JZWI01000017. Accepted GO:0000976 (transcription cis-regulatory region binding), GO:0008270 (zinc ion binding), and GO:0045892 (negative regulation of DNA-templated transcription), modified GO:0003700 to GO:0001217, marked GO:1900376 (regulation of secondary metabolite biosynthetic process) as MARK_AS_OVER_ANNOTATED with source_defects on InterPro:IPR002481, marked GO:0003677, GO:0005737, and GO:0006355 as TOO_GENERAL, and added NEW annotations for GO:0001217, GO:0006882 (cellular zinc ion homeostasis), and GO:0005829 (cytosol).
