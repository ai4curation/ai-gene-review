  summary: 'Create review: act (B9U6P4, VPARA_05450)'
  details: |
    Created review for Variovorax paradoxus TBEA6 act (UniProtKB:B9U6P4, VPARA_05450, 398 aa), the CaiB/BaiF family III acyl-CoA-transferase that activates 3-sulfinopropionate (3SP) to 3SP-CoA during TDP catabolism on contig JZWI01000003. Accepted GO:0008410 (CoA-transferase activity), marked GO:0003824 as TOO_GENERAL, removed GO:0033877 (succinyl-CoA:(R)-benzylsuccinate CoA-transferase activity) with source_defects (WRONG_TERM on UNIPROT from EMBL EC:2.8.3.15), added NEW annotations for GO:0044273 (sulfur compound catabolic process) and GO:0005829 (cytosol), and proposed succinyl-CoA:3-sulfinopropionate CoA-transferase activity in proposed_new_terms supported by PMID:19001372 and PMID:24317404.
