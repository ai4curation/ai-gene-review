  summary: Curate Variovorax paradoxus act (B9U6P4) succinyl-CoA:3-sulfinopropionate
    CoA-transferase
  details: |
    Curated Variovorax paradoxus TBEA6 act (B9U6P4, VPARA_05450, Act(TBEA6)) using direct biochemical and genetic evidence from PMID:23772073, PMID:19001372, and PMID:24317404. Removed spurious EC 2.8.3.15 mapping (GO:0033877, succinyl-CoA:(R)-benzylsuccinate CoA-transferase activity) with a structured UNIPROT WRONG_TERM source_defects entry, refined GO:0003824 to GO:0008410, accepted GO:0008410 (CoA-transferase activity), and added NEW annotations for GO:0044273 (sulfur compound catabolic process, IDA) and GO:0005829 (cytosol, IC), plus a proposed new GO term for succinyl-CoA:3-sulfinopropionate CoA-transferase activity.
