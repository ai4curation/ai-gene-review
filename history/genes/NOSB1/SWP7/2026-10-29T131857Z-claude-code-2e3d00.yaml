  details: |
    De-novo review of all 11 GOA rows for Nosema bombycis SWP7 (B3STP1) as part of the CACAO audit: 4 ACCEPT (spore wall x3, adhesion of symbiont spore to host IDA), 1 ACCEPT with a WRONG_EVIDENCE_CODE source defect on the duplicate CACAO IMP adhesion row, 5 KEEP_AS_NON_CORE (cytoplasm x2, polar tube x3) and 1 REMOVE (bare GO:0005515 under the protein-binding policy). The full text of the sole experimental reference PMID:25605761 is unreachable (PMC4363453 not open access) and the GONUTS wiki is offline, so localization claims were cross-checked against UniProt ECO:0000269 statements and the independent immunoelectron microscopy in newly cached PMID:28031263.
