  summary: Complete end-to-end curation of Bacillus phage phi29 gene 17 (P03686)
  details: 'Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 17 (UniProtKB:P03686). Reviewed
    4 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic
    notes in 17-notes.md.


    Biological summary: Early replication auxiliary protein (gp17, p17) of Bacillus phage phi29 that is conditionally required
    for the initial rounds of protein-primed viral DNA replication at low multiplicity of infection. Although p17 does not
    bind DNA directly, it interacts with the viral histone-like nucleoprotein p6 to enhance and optimize p6 binding at the
    terminal viral replication origins when viral templates and initiation factors are limiting.'
