  summary: Complete end-to-end curation of Bacillus phage phi29 gene 14 (P11188)
  details: 'Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 14 (UniProtKB:P11188). Reviewed
    5 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic
    notes in 14-notes.md.


    Biological summary: Dual-start holin/antiholin membrane protein (gp14) of Bacillus phage phi29 containing three transmembrane
    helices that integrates into the host cytoplasmic membrane during late infection. Translation from Met-3 yields the 129-residue
    holin isoform, which oligomerizes at a programmed concentration to form micron-scale lesions in the host plasma membrane,
    collapsing the proton-motive force and allowing the cytoplasmic gp15 endolysin to access the peptidoglycan layer for host
    cell cytolysis and progeny virion release; translation from Met-1 yields the 131-residue antiholin isoform that inhibits
    premature pore assembly.'
