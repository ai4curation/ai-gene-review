  summary: Complete end-to-end curation of Bacillus phage phi29 gene 7 (P13848)
  details: |
    Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 7 (UniProtKB:P13848). Reviewed 3 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in 7-notes.md.

    Biological summary: Transient internal prohead scaffolding protein gp7 that forms homodimers in the host cell cytoplasm and bridges the dodecameric portal protein gp10 and major capsid protein gp8 to nucleate and direct the fidelity of T=3, Q=5 prolate procapsid assembly. Approximately 147 to 180 copies of gp7 arrange as concentric internal shells within the nascent procapsid before exiting intact upon viral DNA genome packaging, leaving gp7 absent from the mature virion.
