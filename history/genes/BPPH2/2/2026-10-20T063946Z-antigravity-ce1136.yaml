  summary: Complete end-to-end curation of Bacillus phage phi29 gene 2 (P03680)
  details: 'Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 2 (UniProtKB:P03680). Reviewed
    18 GO annotations, synthesized 2 core function(s) across 7 literature/database references, and authored detailed mechanistic
    notes in 2-notes.md.


    Biological summary: Monomeric protein-primed family B DNA-directed DNA polymerase (gp2, p2) that catalyzes all synthetic
    steps of Bacillus phage phi29 genome replication. It forms a heterodimer with the viral terminal protein gp3 to catalyze
    template-directed deoxynucleotidylation of gp3 Ser232 with 5''-dAMP at the replication origins, followed by highly processive
    elongation via intrinsic strand displacement without requiring an accessory helicase. It also contains an N-terminal 3''-5''
    exonuclease domain responsible for proofreading during viral DNA synthesis.'
