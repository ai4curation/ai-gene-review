  summary: Complete end-to-end curation of Bacillus phage phi29 gene 12 (P20345)
  details: |
    Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 12 (UniProtKB:P20345). Reviewed 12 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in 12-notes.md.

    Biological summary: Pre-neck appendage protein (gp12) of Bacillus phage phi29 that assembles into homotrimers via a C-terminal intramolecular autochaperone domain, which is subsequently removed by autocleavage between Ser-691 and Asp-692 and released in an ATP-dependent manner. Twelve mature gp12* homotrimers hang from the gp11 lower collar as the virion neck appendages (tail fibers), mediating receptor-specific adsorption to Bacillus subtilis cell wall teichoic acids and enzymatically degrading poly(glycerol phosphate) teichoic acid chains to facilitate phage penetration of the host cell envelope.
