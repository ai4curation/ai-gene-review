  summary: Complete end-to-end curation of Bacillus phage phi29 gene 13 (P15132)
  details: |
    Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 13 (UniProtKB:P15132). Reviewed 17 GO annotations, synthesized 2 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in 13-notes.md.

    Biological summary: Bifunctional tail-tip peptidoglycan hydrolase and tail knob morphogenetic factor (gp13) of Bacillus phage phi29. Packaged at the distal tip of the gp9 tail knob, gp13 is required alongside gp9 for assembly of an active tail knob and acts during infection as a two-domain cell-wall-degrading enzyme with an N-terminal lysozyme-like glycosidase domain that cleaves the peptidoglycan polysaccharide backbone and a C-terminal Zn2+-dependent M23 metalloendopeptidase domain that cleaves peptidoglycan peptide cross-links, facilitating viral genome entry across the Bacillus subtilis cell wall.
