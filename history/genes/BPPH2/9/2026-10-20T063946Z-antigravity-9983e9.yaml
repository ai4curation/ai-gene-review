  summary: Complete end-to-end curation of Bacillus phage phi29 gene 9 (P04331)
  details: |
    Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 9 (UniProtKB:P04331). Reviewed 6 GO annotations, synthesized 1 core function(s) across 3 literature/database references, and authored detailed mechanistic notes in 9-notes.md.

    Biological summary: Distal tail knob protein (gp9) of Bacillus phage phi29 that assembles as a homohexameric cylindrical tube at the distal end of the gp11 lower collar. In the mature virion, six internal hydrophobic loops of gp9 plug the tail tube lumen to retain the pressurized dsDNA genome; during infection, after gp13 degrades the peptidoglycan layer, the hydrophobic loops evert and insert into the Bacillus subtilis plasma membrane to form a transmembrane pore for viral genome ejection into the host cytoplasm.
