  summary: Complete end-to-end curation of Bacillus phage phi29 gene 8 (P13849)
  details: 'Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 8 (UniProtKB:P13849). Reviewed
    7 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic
    notes in 8-notes.md.


    Biological summary: Major capsid protein gp8 that polymerizes into 11 pentamers and 30 hexamers (235 subunits in total)
    to form the prolate T=3, Q=5 icosahedral capsid shell of Bacillus phage phi29, enclosing the packaged dsDNA genome. Each
    monomer comprises an N-terminal HK97-like shell domain that forms the contiguous capsid wall and a C-terminal immunoglobulin-like
    BIG2 protrusion domain that stabilizes inter-capsomer contacts and anchors the gp8.5 head fibers at quasi-3-fold axes.'
