  summary: Complete end-to-end curation of Bacillus phage phi29 gene 8.5 (B3VMP4)
  details: |
    Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 8.5 (UniProtKB:B3VMP4). Reviewed 6 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in 8.5-notes.md.

    Biological summary: Capsid head fiber protein gp8.5 that assembles into 55 homotrimeric fibers decorating the quasi-3-fold symmetry positions of the Bacillus phage phi29 procapsid and mature virion capsid. Each trimer comprises a pseudohexagonal base anchored to the BIG2 domains of the major capsid protein gp8 and a 110-Angstrom protruding shaft built from a supercoiled triple repeating helix-turn-helix motif; although dispensable for virion morphogenesis and infectivity under laboratory conditions, the head fibers may facilitate initial virion contact with the Bacillus subtilis cell wall.
