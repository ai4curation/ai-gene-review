  summary: Complete end-to-end curation of Bacillus phage phi29 gene 1 (P03679)
  details: 'Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 1 (UniProtKB:P03679). Reviewed
    11 GO annotations, synthesized 1 core function(s) across 8 literature/database references, and authored detailed mechanistic
    notes in 1-notes.md.


    Biological summary: Early membrane-associated replication scaffold protein (gp1, p1) of Bacillus phage phi29 that self-assembles
    via its C-terminal domain into two-dimensional protofilament sheet structures attached to the host bacterial membrane.
    Through its N-terminal region, p1 interacts with the viral primer terminal protein gp3 to compartmentalize and anchor
    the viral replisome at the host membrane during protein-primed viral DNA replication.'
