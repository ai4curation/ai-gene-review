  summary: Complete end-to-end curation of Bacillus phage phi29 gene 16.7 (P16517)
  details: |
    Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 16.7 (UniProtKB:P16517). Reviewed 7 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in 16.7-notes.md.

    Biological summary: Early single-pass membrane protein (gp16.7, p16.7) of Bacillus phage phi29 that anchors viral DNA replication intermediates to the host cell plasma membrane. It contains an N-terminal transmembrane helix required for membrane insertion and a C-terminal cytoplasmic domain that dimerizes, multimerizes, and binds both single-stranded and double-stranded viral DNA as well as the viral terminal protein gp3, promoting spatial organization and efficiency of protein-primed viral DNA replication.
