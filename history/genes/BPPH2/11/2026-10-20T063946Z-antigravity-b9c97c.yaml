  summary: Complete end-to-end curation of Bacillus phage phi29 gene 11 (P68930)
  details: |
    Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 11 (UniProtKB:P68930). Reviewed 5 GO annotations, synthesized 1 core function(s) across 4 literature/database references, and authored detailed mechanistic notes in 11-notes.md.

    Biological summary: Proximal tail tube protein (lower collar protein gp11) of Bacillus phage phi29 that assembles as a dodecameric ring immediately distal to the gp10 head-tail connector after viral DNA packaging. It forms the proximal section of the axial tail tube conduit for dsDNA genome ejection into the Bacillus subtilis host cell and provides the radial attachment scaffold for the twelve gp12* neck appendages.
