  summary: Complete end-to-end curation of Bacillus phage phi29 gene 15 (P11187)
  details: |
    Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 15 (UniProtKB:P11187). Reviewed 12 GO annotations, synthesized 1 core function(s) across 8 literature/database references, and authored detailed mechanistic notes in 15-notes.md.

    Biological summary: Modular endolysin (lysozyme gp15) of Bacillus phage phi29 comprising an N-terminal GH24 muramidase catalytic domain and a C-terminal cell-wall-binding domain with two LysM repeats. Synthesized in the host cytoplasm during late infection, gp15 traverses the cytoplasmic membrane through pores formed by the gp14 holin and hydrolyzes beta-1,4-glycosidic linkages of the Bacillus subtilis peptidoglycan sacculus to cause host cell cytolysis and release of mature progeny virions.
