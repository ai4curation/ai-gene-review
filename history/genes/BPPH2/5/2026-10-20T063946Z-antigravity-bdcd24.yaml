  details: 'Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 5 (UniProtKB:Q38504). Reviewed
    6 GO annotations, synthesized 1 core function(s) across 5 literature/database references, and authored detailed mechanistic
    notes in 5-notes.md.


    Biological summary: Single-stranded DNA-binding protein (gp5, p5) required for the elongation phase of Bacillus phage
    phi29 protein-primed DNA replication. It binds cooperatively to the long single-stranded DNA stretches displaced during
    strand-displacement synthesis, protecting replication intermediates from nuclease degradation, destabilizing secondary
    structures, and preventing non-productive binding of the viral DNA polymerase to ssDNA.'
