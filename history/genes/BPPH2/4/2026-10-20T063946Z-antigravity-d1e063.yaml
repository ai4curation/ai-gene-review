  summary: Complete end-to-end curation of Bacillus phage phi29 gene 4 (P03682)
  details: 'Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 4 (UniProtKB:P03682). Reviewed
    8 GO annotations, synthesized 1 core function(s) across 8 literature/database references, and authored detailed mechanistic
    notes in 4-notes.md.


    Biological summary: Homodimeric sequence-specific DNA-binding transcriptional regulator (gp4, p4) of Bacillus phage phi29
    that mediates the early-to-late transcriptional switch. It binds inverted-repeat sequences in the intergenic promoter
    region, induces a strong DNA bend, and interacts with both the alpha-subunit C-terminal domain of host Bacillus subtilis
    sigma-A RNA polymerase and the viral nucleoprotein p6 to activate the late A3 promoter while repressing the early A2b
    and A2c promoters.'
