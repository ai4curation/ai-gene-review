  summary: Complete end-to-end curation of Bacillus phage phi29 gene 6 (P03685)
  details: 'Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 6 (UniProtKB:P03685). Reviewed
    13 GO annotations, synthesized 1 core function(s) across 9 literature/database references, and authored detailed mechanistic
    notes in 6-notes.md.


    Biological summary: Abundant histone-like architectural double-stranded DNA-binding nucleoprotein (gp6, p6) that binds
    cooperatively across the Bacillus phage phi29 genome, wrapping viral dsDNA into a right-handed toroidal superhelix around
    a multimeric protein core and compacting it approximately 4-fold. High-affinity binding of p6 to the replication origins
    at both ends of the genome induces local DNA unwinding required for initiation of protein-primed viral DNA replication,
    while binding at early promoters C2, A2b, and A2c (alone or cooperatively with the transcriptional regulator p4) represses
    early viral transcription and facilitates the early-to-late transcriptional switch.'
