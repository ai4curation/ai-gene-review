  summary: Complete end-to-end curation of Bacillus phage phi29 gene 10 (P04332)
  details: |
    Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 10 (UniProtKB:P04332). Reviewed 7 GO annotations, synthesized 2 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in 10-notes.md.

    Biological summary: Head-tail connector (portal) protein gp10 that self-assembles into a ring-shaped homododecamer at the unique five-fold vertex of the prolate procapsid and mature virion capsid. During morphogenesis, the gp10 portal complex nucleates prolate capsid assembly with gp7 and gp8, recruits the prohead packaging RNA (pRNA) ring via its basic N-terminal 14 amino acids, and operates as a one-way valve channel for ATP-driven viral dsDNA packaging before docking with the gp11 lower collar to form the genome ejection conduit.
