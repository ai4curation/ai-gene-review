  summary: Complete end-to-end curation of Bacillus phage phi29 gene 0.8 (Q38503)
  details: |
    Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 0.8 (UniProtKB:Q38503). Reviewed 2 GO annotations, synthesized 1 core function(s) across 2 literature/database references, and authored detailed mechanistic notes in 0.8-notes.md.

    Biological summary: Early homodimeric acidic protein p56 (gene 0.8 product) of Bacillus phage phi29 that inhibits host Bacillus subtilis uracil-DNA glycosylase (UDG). By acting as a DNA mimic that occupies the DNA-binding cleft of host UDG and displaces UDG from uracil-containing DNA, p56 prevents host base excision repair from introducing abasic sites and strand nicks into replicating viral DNA templates.
