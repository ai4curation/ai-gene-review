  summary: Complete end-to-end curation of Bacillus phage phi29 gene 16 (P11014)
  details: |
    Completed comprehensive gene review for Bacillus phage phi29 (NCBITaxon:2884424) gene 16 (UniProtKB:P11014). Reviewed 9 GO annotations, synthesized 3 core function(s) across 5 literature/database references, and authored detailed mechanistic notes in 16-notes.md.

    Biological summary: DNA packaging motor ATPase and DNA translocase gp16 that transiently assembles onto the prohead RNA (pRNA) ring at the procapsid portal vertex in the host cell cytoplasm to pump unit-length gp3-linked viral dsDNA into the prohead. It comprises an N-terminal P-loop NTPase domain with canonical Walker A, Walker B, and arginine-finger motifs that hydrolyzes approximately one ATP molecule per two base pairs packaged, and a C-terminal non-catalytic DNA-binding domain that contacts both the viral genome and the CCA bulge of the pRNA A-helix before dissociating upon packaging completion.
