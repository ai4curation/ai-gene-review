  details: |
    Full re-review independent of ProtNLM2 predictions (ARGO50 cohort). GOA has no rows. New analysis Q2U1U6-bioinformatics/gene_model_check.py shows Q2U1U6 (134 aa) equals residues 280-408 of the 408-aa A. flavus ortholog A0A7U2MCM8; the missing exon 1 is encoded upstream in RIB40 (AP007170.1) and joined by a 65-nt GT-AG intron containing the annotated start ATG, so AO090138000091 is a truncated gene model. No PANTHER/Pfam/CAZy family; only fold-level IPR008929/SSF48230, and no characterized relative can be placed phylogenetically. Description rewritten (removed GAG-substrate analogy); core function GO:0016837 kept as hedged fold-level prediction for the full-length product; removed directly_involved_in GO:0000272; knowledge gaps, questions and experiments rewritten; reference_review added to all references; genome-paper title-only quote replaced with a methods quote.
