  summary: Reassess complete fungal sulfate-assimilation member review
  details: |
    All 16 rows and core functions reviewed; original machine annotation payloads preserved and no row added. Sir1 supplies the sulfite-reducing siroheme/[4Fe-4S] module to the assembled enzyme, with alpha-subunit electron input. The broad Fe-S binding term is refined to the supported [4Fe-4S] site. A positive PF00258/Flavodoxin_1 match at residues 728–876 supports inferred FMN binding; the holoenzyme FMN assay is from budding yeast (PMID:6751400), not isolated native Sir1. PMID:11319255 uses old S. pombe O14167; mapping that historical accession to Q1K9C2 has not been independently completed and is not silently assumed. PMID:10224084 foregrounds Hmt2 in the abstract, which does not establish that sir1 controls or mutants were absent from the full text. The biologically supported native sulfite-reduction claim is retained with curator deference, not falsely removed as misattributed. All localization and secondary phenotype rows were considered. Normal Falcon/fallback attempts failed with provider access/quota errors; publication caching succeeded and manual evidence assessment is documented in the appended notes. Focused validation, rendering and record-section backfill accompany this review.
