  summary: Create S. pombe tom6 TOM-complex review
  details: |
    Created the initial S. pombe tom6 review for the small TOM-complex subunit. The review accepts mitochondrial outer-membrane localization and proposes TOM complex membership plus mitochondrial outer membrane translocase complex assembly by sequence similarity to budding-yeast Tom6, whose evidence supports a Tom22-Tom40 assembly and stability role. Automated provider deep research was unavailable, so manual research and notes were recorded in the gene directory.
