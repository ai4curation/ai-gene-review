  summary: 'Audit fungal arginase-pathway enzyme car1: all rows and core functions'
  details: |
    Full PMID:20435771 results directly assay native urea production in single and double arginase mutants; car3 in that paper is current aru1/SPAC3H1.07. Iron regulates Car1, but deletion of aru1/car3 induces car1 approximately fivefold, so single-mutant activities cannot simply be summed to obtain wild-type partitioning. Full PMID:20460254 and 26075619 distinguish measured isotope conversion from the proposed detailed arginine re-synthesis route. The latter explicitly includes OTC Arg3 and defeats the old non-ureotelic objection to existing cycle terms. Native conversion is nearly eliminated, rather than universally abolished, by double deletion under the measured conditions. Cytosolic location is retained from combined evidence; the inaccessible 1994 full text is not claimed to contain a newly inspected fractionation experiment. Preserved all 21 annotation payloads; no new rows. Normal caching and failed provider attempts documented honestly. Initial focused validation passed; final backfill/term/reference/render/history checks are logged. Independent annotation-reviewer consultation confirmed cycle topology, structural core properties and bounded localization uncertainty.
