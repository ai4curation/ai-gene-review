  summary: 'Create review: mss116 (S. pombe mitochondrial DEAD-box RNA helicase)'
  details: |
      New review of S. pombe mss116 (O13622) centred on PMID:38604460 (Wang, Feng,
      Huang 2024, Mitochondrion), whose cached record is abstract only; the full
      text could not be obtained (not OA in Europe PMC, bgpt quota exhausted, web
      search found only abstract mirrors). Added and cached the S. cerevisiae
      ortholog papers PMID:28520979 (full text) and PMID:15618406 (abstract).
      Decisions on the 11 GOA rows: RNA helicase activity (IBA, IEA, ISO) ACCEPT;
      nucleic acid binding MODIFY to RNA binding; ATP binding and ATP hydrolysis
      activity KEEP_AS_NON_CORE; mitochondrion (HDA, IBA) ACCEPT; mitochondrial
      matrix (IEA, ISS) ACCEPT; mitochondrial mRNA processing (ISS) ACCEPT, now
      backed by the intron-dependent cox1/cob1 mRNA defect. One NEW row:
      mitochondrial ribosome assembly (GO:0061668, IMP, PMID:38604460). Its
      participation argument rests on the budding-yeast ortholog's physical,
      early incorporation into mtLSU assembly intermediates. Mitochondrial
      translation was deliberately not added because the authors attribute it
      to the assembly defect. Subunit refinement (GO:1902775), intron-splicing
      terms and catalytic requirement need the full text. Validated with
      just validate SCHPO mss116; record sections backfilled.
