  summary: Revise mss116 review against full text of PMID:38604460
  details: |
    Revised the mss116 review after the full text of PMID:38604460 (user-supplied PDF) was cached. The paper shows that spMss116 does not co-sediment with mitoribosomes, that proteins of both subunits are destabilised, that no catalytic mutants were tested, and that the translation defect is global; the authors only conclude mss116 'may participate' in mitoribosome assembly. S. pombe mtDNA encodes an mtSSU protein, so assembly and translation defects cannot be ordered causally. The proposed NEW GO:0061668 (mitochondrial ribosome assembly) was therefore withdrawn as necessity-only evidence and moved to suggested_questions; GO:0032543 is still not proposed. GO:0090615 mitochondrial mRNA processing (ISS) changed from ACCEPT to UNDECIDED: intron-retaining cox1/cob1 precursors accumulate, but splicing depends on intron-encoded maturases made by mitochondrial translation, the authors leave a splicing role open, and budding-yeast Mss116 does not complement. Localisation experiments (fractionation, protease protection, carbonate extraction) were folded into the mitochondrion and matrix rows; a NEW mitochondrion IDA row was rejected by validation because the term is already in GOA. Removed full_text_unavailable, rewrote the PMID:38604460 reference_review and findings with full-text quotes, corrected the description (four mitochondrial DEAD-box proteins in S. pombe), changed the core function location to mitochondrion, and added a BIOLOGY knowledge gap. Validated with just validate SCHPO mss116; record sections backfilled.
