  details: |
    Re-examined all 22 existing annotations. A new live PANTHER subfamily lookup (vas2-bioinformatics/panther_subfamily_rereview.py, RESULTS-rereview.md) places vas2 in PTHR11753:SF5 with S. cerevisiae APS1. Human AP1S1 is in SF14. Changes: cytoplasm (EXP/IEA) MODIFY to cytosol; cytosol HDA KEEP_AS_NON_CORE; protein transport IEA MODIFY to GO:0099638; vesicle-mediated transport (IBA/IEA) MODIFY to GO:0042147 and GO:0099638, with propagation_review recording sound PAINT placement at PTN000204281; nucleus (HDA/IEA) MARK_AS_OVER_ANNOTATED; clathrin binding ISO MARK_AS_OVER_ANNOTATED, because the SGD APS1 donor no longer carries the term in QuickGO and the activity belongs to the complex. Description and core function rewritten; suggested questions and experiments added; notes appended. Next relative: yeast APS1 (P35181), which has no review.
