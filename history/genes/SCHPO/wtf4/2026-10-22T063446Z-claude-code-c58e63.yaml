  summary: De novo review of SCHPO wtf4 (Q9P3V0), a wtf-family poison-antidote meiotic
    driver
  details: |
    First review for a wtf-family meiotic driver in this repo. Fetched with fetch-gene; 17 GOA rows all adjudicated.

    Identity resolved before curation: PomBase SPCC548.03c = wtf4 = Q9P3V0. Three naming hazards documented in wtf4-notes.md - Q9P3V0 lists 'wtf13' as a synonym although wtf13 is a separate gene (O74420, WTF13_SCHPO); Q8TF80 (WTF5_SCHPO) lists 'wtf4' among its own gene names; and A0A218N034 (WTF4_SCHKA) is the S. kambucha ortholog under its own taxon.

    Actions: 12 ACCEPT, 2 MARK_AS_OVER_ANNOTATED, 1 MODIFY, 1 REMOVE.

    Three ontology facts verified via QuickGO drove the non-ACCEPT calls:
    - GO:0140549 spore inner membrane is only_in_taxon Bacteria and defined on the endospore core, so it cannot apply to an ascomycete. The row exists because the term's exact synonym 'spore membrane' matches UniProt's subcellular-location wording. REMOVE, with no replacement asserted: GO:0005628 prospore membrane is the Ascomycota counterpart and is named in the reason, but the imaging resolves vacuole, ER and dispersed aggregates rather than a membrane rim, so nothing supports the transfer.
    - GO:0090729 toxin activity is never_in_taxon Schizosaccharomyces and requires acting on 'another (target) organism'; GO:0097351 toxin sequestering activity is never_in_taxon Eukaryota. So GO has no MF for an intra-organismal gamete killer, which is why PomBase carries GO:0003674 ND (re-affirmed 2026-07-24). Proposed 'gamete-killing poison activity' for the poison arm rather than forcing a wrong term, and MODIFIED the ND row to GO:0140311 protein sequestering activity, which fits the antidote's co-assembly-plus-relocalization activity almost verbatim.
    - GO:0072324 ascus epiplasm has no cytoplasm ancestor despite its definition, so GO:0005737 could not be called TOO_GENERAL on that basis; raised as an ontology question instead.

    GO:0005789 ER membrane marked over-annotated: the source authors attribute the ER colocalization to the nitrogen starvation used to induce meiosis, and the vegetative control gives a Sec63 correlation of -0.1 against 0.69 for the vacuole.

    Species caveat recorded throughout rather than used to remove anything: both experimental papers assayed the S. kambucha allele (82% aa identity to Sp wtf4), so the 972 allele's own transmission bias has never been measured. GO:0110134 IMP accepted per the guidance against overruling curators, with the evidence-strength issue raised as a suggested question and the missing assay as a suggested experiment. PMID:16823372 (ORFeome) is the only source unambiguously about the 972 protein and is explicitly endorsed by PMID:33108274, which rescues the HDA rows.

    Added PMID:32790622, cited by UniProt as the ECO:0000269 FUNCTION source but absent from GOA.

    Noted as a schema gap, not worked around silently: FunctionalIsoformTypeEnum has no value for alternative initiation, which is how the poison/antidote pair arises. SPLICE_VARIANT used as the closest placeholder and flagged as mechanistically wrong in both isoform descriptions and the notes.
