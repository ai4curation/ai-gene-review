  summary: 'Audit fungal arginase-pathway enzyme car2: all rows and core functions'
  details: |
    Native car2 deletion strongly reduces arginine-carbon conversion into proline/glutamate-related amino acids (PMID:20460254); PMID:26075619 shows that deleting car2 does not remove the arginase-dependent heavy-nitrogen/urea route. Thus car2 deletion and car1/aru1 double deletion are not interchangeable mechanistically. Cytosolic localization is supported, but the old mitochondrial IBA REMOVE overreached: cytoplasmic/nuclear observations and an unverified impression of targeting sequence do not exclude dual localization. The mitochondrial row is now UNDECIDED with source-specific PTN metadata. The proline-producing role is retained non-core, with labeling conditions stated. The exact pro3/put1/put2 shuttle in pombe remains to be tested. Preserved all 10 annotation payloads; no new rows. Normal caching and failed provider attempts documented honestly. Initial focused validation passed; final backfill/term/reference/render/history checks are logged. Independent annotation-reviewer consultation confirmed cycle topology, structural core properties and bounded localization uncertainty.
