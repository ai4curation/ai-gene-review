  details: |
    Grounded the Wss1 function transfer in PANTHER PTHR46622:SF1 shared with S. cerevisiae WSS1 (P38838) and conserved zinc-site spacing. Showed that the S. pombe Wss1b structural data belong to the paralog Wss2 (O94580, PTHR47795) and excluded them. Added S. pombe formaldehyde and acetaldehyde genetics (PMID:32034465, PMID:27687866). Changed the DNA repair IBA and metallopeptidase IBA rows to MODIFY toward GO:0106300 and GO:0004222, and changed translesion synthesis ISO to KEEP_AS_NON_CORE. Rewrote description and core function, and added a paralog-check script and RESULTS-rereview.md.
