    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'ACCEPT': 10, 'KEEP_AS_NON_CORE': 3}. Summary: SPAC24C9.06c (aco1; UniProt O13966) encodes the mitochondrial aconitase (EC 4.2.1.3), a [4Fe-4S] hydratase that isomerises citrate to isocitrate via cis-aconitate, the second step of the TCA cycle. It is distinct from the aconitase-bL21m fusion aco2, whose essential role is in mitochondrial translation. It is mitochondrial in localisation studies.
