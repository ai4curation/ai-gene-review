  details: |
    All 10 rows and core functions reviewed; original machine annotation payloads preserved and no row added. PMID:18388974 native complementation and yeast met3 complementation support ATP sulfurylase activity. PMID:14723223 establishes cysteine auxotrophy and rescue by sulfite, thiosulfate, cysteine or glutathione but not methionine, reflecting the different sulfur-amino-acid physiology from budding yeast. The description does not transfer the budding-yeast reverse-transsulfurylation phenotype indiscriminately. Native oligomer stoichiometry is unresolved; the kinase-like domain is an ortholog-based architectural inference and does not confer the separate met14 reaction. Broad sulfur-compound metabolism is refined to sulfate assimilation while preserving upstream participation in the multistep sulfide biosynthetic process. Normal Falcon/fallback attempts failed with provider access/quota errors; publication caching succeeded and manual evidence assessment is documented in the appended notes. Focused validation, rendering and record-section backfill accompany this review.
