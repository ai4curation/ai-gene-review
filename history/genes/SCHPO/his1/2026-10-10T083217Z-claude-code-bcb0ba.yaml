    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'ACCEPT': 8, 'KEEP_AS_NON_CORE': 1}. Summary: his1 (SPAC25G10.05c; UniProt P40373) encodes ATP phosphoribosyltransferase (HisG; EC 2.4.2.17). It condenses ATP and PRPP to N'-(5'-phosphoribosyl)-ATP, the first and committed step of histidine biosynthesis and, in other organisms, the main point of feedback control by histidine. The S. pombe cDNA complements an S. cerevisiae his1 mutant. A genome-wide screen places it in the cytosol.
