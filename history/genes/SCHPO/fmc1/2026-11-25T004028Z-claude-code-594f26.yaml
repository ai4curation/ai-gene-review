  summary: Narrow the fmc1 molecular-activity gap with an OpenScientist fold and interface
    analysis
  details: |
    Ran OpenScientist (3 iterations) on fmc1. Small four-helix LYRM protein, no nucleotide site, no substrate groove, no PDB structural relative: cannot fold F1 subunits itself. Conserved helix-3 patch (F65, S68, H72, L75, R78, H79, H80, P81; checked locally) nominated from conservation and then matching the predicted human FMC1-ATPAF2 interface, which is disjoint from the ATPAF2 face used for F1-alpha. Proteome-scale screen finds no FMC1-F1 pair. Adaptor/stabiliser favoured. Run also flags the unbounded UniProt transit-peptide feature and that the residue-level interface is not conserved in fungal Atp12. Gap OPEN -> NARROWING; run reference UNVERIFIED.
