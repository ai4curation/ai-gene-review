  summary: ProtNLM2 prediction rescoring
  details: |
    GO:0046872 metal ion binding: LSP (2) -> COR (2). The earlier LSP rested on an existing zinc-specific annotation, but the gene's GOA set has no metal- or zinc-binding term (only ubiquitin protein ligase activity, not an ancestor/descendant per OLS4), so the prediction is novel; correctness is supported by the PROSITE PHD finger with intact Cys4-His-Cys3 ligands and the atypical RING finger. PubMed searches (SPCC126.07c, asr1 pombe, PHRF1 zinc, Asr1 ubiquitin ligase) found no direct metal-binding experiment. Added RING-type 1 feature quote; file description rewritten.
