  details: |
    Re-review of IBA rows marked REMOVE (projects/IBA_REVIEW/rereview-2026-11-21, batch N04). GO:0031106 septin ring organization IBA: the PAINT IBD sits at PTN001853010 and mid1 (PomBase:SPCC4B3.15) is itself one of its three seeds through the PomBase IMP from PMID:15385632; mid2 is not a member of PTHR21538. The earlier reason (no experimental support, mid1/mid2 conflation in propagation) misread the tree. Whether the IMP seed was keyed to mid1 in error could not be settled: the cached PMID:15385632 text lacks the results section and PMC serves no full text. Both the IBA row and the IMP row it rests on were changed from REMOVE to UNDECIDED, with the annotation pattern (PomBase annotates the septins and mid1 but not mid2 from this paper) recorded as a query for PomBase. The mid2 systematic id in the old text (SPCC18B5.04) was wrong; UniProt Q9P7Y8 gives SPAPYUG7.03c. The reference finding for PMID:15385632 was reworded to say the results section was not read. Added propagation_review to the IBA row. just validate: the one error (PMID:30853434 quote) predates this change.
