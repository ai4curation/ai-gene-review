  summary: 'Retrospective audit corrections: SPAC16E8.17c'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. Action changes: GO:0006104 succinyl-CoA metabolic process (ISS) KEEP_AS_NON_CORE -> ACCEPT, because the audit found the term names the reaction the enzyme catalyses and the four fungal and the bacterial reviews should treat it alike. GO:0003824 catalytic activity (IEA) MODIFY (to GO:0004775) -> TOO_GENERAL; the reason is now worded the same way in all eleven subunit reviews (true but uninformative, entailed by the accepted specific activity). GO:0004776 (IBA) stays MARK_AS_OVER_ANNOTATED; its reason now says the absence of a G-type beta gene is not kingdom-wide and names Saitoella complicata, a Taphrinomycotina species with a Gln20 SUCLG2-type gene of unresolved origin. Description reworded. Validated with just validate SCHPO SPAC16E8.17c.
