  summary: 'Add family-tree evidence to the GDP-forming IBA row: SPAC16E8.17c'
  details: |
    Part of a joint evolutionary re-review of the succinyl-CoA synthetase subunit families PTHR11117 (alpha) and PTHR11815 (beta). Evidence: the PANTHER release 19 trees, a reproducible local analysis (genes/yeast/LSC2/LSC2-bioinformatics: paralog census, bootstrapped neighbor-joining and maximum-likelihood trees, position-20 residue comparison), cached literature, and two OpenScientist hypothesis runs. Action unchanged (MARK_AS_OVER_ANNOTATED on GO:0004776). The reason now cites the placement of the S. pombe beta subunit in the A-type lineage and the loss of the G-type paralog in fungi, and explains why the action stays short of the REMOVE used for S. cerevisiae LSC1.
