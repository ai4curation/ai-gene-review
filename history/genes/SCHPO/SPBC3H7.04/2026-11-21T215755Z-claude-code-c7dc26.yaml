  summary: 'IBA REMOVE re-review: cytoplasm IBA changed to MODIFY'
  details: |
    Re-review of IBA rows marked REMOVE (projects/IBA_REVIEW/rereview-2026-11-21, batch N10). The GO:0005737 cytoplasm IBA was REMOVE on the grounds that the seeds were superoxide dismutase paralogs and that mitochondrion is not under cytoplasm in GO. Both statements were wrong. The PAINT IBD sits at the family root PTN002461864 with five seeds; three of them (S. cerevisiae RSM26 SGD:S000003862 and MRP1 SGD:S000002755, N. crassa rsm26 Q7S2H6) are mitoribosomal proteins in the same 17-leaf fungal clade PTN000150161 as this protein, annotated to mitochondrion and mitochondrial small ribosomal subunit (QuickGO, queried by GO id with descendants). SGD:S000002755 is MRP1, not SOD2 (UniProt P10662 cross-reference). GO:0005739 mitochondrion is part_of GO:0005737 cytoplasm (QuickGO ancestors). The row is therefore true but general, and the action is now MODIFY with replacement GO:0005763 mitochondrial small ribosomal subunit. Summary, reason and propagation_review of that row were rewritten; no other row changed. just validate passes with the same warnings as before.
