    De-novo review of S. pombe Pek1/Skh1, the cell integrity MAPKK and closest experimentally characterised relative of NEUCR/mek-1 (PTHR47448:SF5 / PTHR48013:SF6; PAINT PTN001220604 donor). Falcon deep research failed (403 auth) and perplexity-lite fallback failed; review based on cached literature. 21 GOA rows reviewed: MAPKK activity (EXP/IDA/IBA/IEA) and cell integrity MAPK cascade (IDA/IBA) accepted as core; generic MAPK cascade and protein kinase activity MODIFY to specific terms; Pmk1 protein-binding row MODIFY to MAPK binding, Mkh1 row REMOVE; Rhea serine kinase marked over-annotated (Thr/Tyr substrate sites); Ca2+ signalling and Atf1-linked cell wall terms kept non-core as Pmk1-mediated outputs; HDA nucleus non-core. Notes distinguish S. pombe experimental functions from inferred ones. ProtNLM2 predictions not consulted.
