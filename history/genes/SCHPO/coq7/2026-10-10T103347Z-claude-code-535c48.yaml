  details: |
    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'KEEP_AS_NON_CORE': 2, 'ACCEPT': 19}. Summary: coq7 (SPBC337.15c; UniProt O74826) encodes the di-iron 5-demethoxyubiquinone hydroxylase (CLK-1/COQ7 family). It hydroxylates demethoxyubiquinol at C6, the penultimate step of CoQ synthesis. coq7 deletion cells accumulate demethoxyubiquinone-10 instead of CoQ10 and share the respiratory-defect phenotypes of other coq mutants. It is a peripheral inner-membrane protein on the matrix side.
