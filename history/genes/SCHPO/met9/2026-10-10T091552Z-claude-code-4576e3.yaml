  details: |
    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'ACCEPT': 9, 'KEEP_AS_NON_CORE': 4}. Summary: met9 (UniProt Q10258) encodes one of two non-redundant methylenetetrahydrofolate reductases (MTHFR; EC 1.5.1.53) of fission yeast, met9 and met11. Using FAD and NAD(P)H, it reduces 5,10-methylene-THF to 5-methyl-THF, the methyl donor for methionine synthase (met26). The two genes cannot complement each other, and both mutants need methionine. met9 provides the major share (80-85%) of cellular MTHF
