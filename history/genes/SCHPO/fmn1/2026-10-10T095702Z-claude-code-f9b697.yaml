  details: |
    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'KEEP_AS_NON_CORE': 4, 'ACCEPT': 7, 'MARK_AS_OVER_ANNOTATED': 1}. Summary: fmn1 (SPCC18.16c; UniProt O74866) encodes riboflavin kinase (EC 2.7.1.26), which phosphorylates riboflavin to FMN with ATP, the first step in making flavin cofactors; FAD synthetase (nad1) then makes FAD. The 1.6 Å crystal structure of S. pombe riboflavin kinase, with ADP and FMN bound, defined a new beta-barrel phosphoryl-transfer fold. The enzyme is cytosolic in a genome-wide screen.
