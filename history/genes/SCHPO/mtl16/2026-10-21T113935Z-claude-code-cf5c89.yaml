  summary: 'Create review: mtl16 (SPAC27D7.08c), reference relative for NCU11362'
  details: |
    De-novo review of all 15 GOA rows from full-text primary literature (PMID:28525753, 34050143, 37637271, 40841561); falcon/perplexity deep research failed (auth/quota) and is recorded in notes. Accepted U6 snRNA m6A37 methyltransferase (IBA/IEA/IMP), snRNA adenine-N6 methylation and nucleus; splicing (IBA/IGI), mRNA m6A MTase IBA (no S. pombe mRNA substrate; sam1 unaffected), cytoplasm/cytosol kept non-core; methyltransferase activity TOO_GENERAL; post-transcriptional regulation IBA marked over-annotated (vertebrate/nematode SAM circuit not shown in S. pombe); 23S rRNA A1618 MTase ISO from E. coli RlmF removed (bacterial substrate, not propagated at the eukaryotic PAINT node). Notes record experimentally established vs inferred functions and the +13 residue-numbering offset between literature and UniProt O42662, for use when transferring to NEUCR/NCU11362. ProtNLM2 predictions were not consulted.
