  summary: Reassess complete fungal sulfate-assimilation member review
  details: |
    All 11 rows and core functions reviewed; original machine annotation payloads preserved and no row added. The alpha subunit contributes the NADPH/FAD electron-input portion of the sulfite-reductase complex. Exact fungal subunit architecture is inferred from conserved domains and budding-yeast primary studies, not claimed as purified native fission-yeast holoenzyme measurements. FMN binding on alpha remains rejected with the existing PTHR19384 fungal-subfamily adjudication: positive PF00258 flavodoxin-domain evidence is on Sir1, whereas met10 lacks that module. PMID:11319255 full text contains an old S. pombe sequence identifier; its mapping to current Sir1 Q1K9C2 was not independently established, so the current Sir1 domain record remains the target-specific computational support. The competing broad UniProt cofactor inference is acknowledged rather than attributed to a guessed donor. Native experimental annotations are not removed from incomplete abstracts. Normal Falcon/fallback attempts failed with provider access/quota errors; publication caching succeeded and manual evidence assessment is documented in the appended notes. Focused validation, rendering and record-section backfill accompany this review.
