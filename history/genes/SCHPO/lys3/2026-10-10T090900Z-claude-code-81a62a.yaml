    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'KEEP_AS_NON_CORE': 1, 'ACCEPT': 11}. Summary: lys3 (SPAC227.18; UniProt Q09694), the ortholog of S. cerevisiae LYS1, encodes saccharopine dehydrogenase (NAD+, L-lysine-forming; EC 1.5.1.7). It cleaves saccharopine oxidatively to L-lysine and 2-oxoglutarate, the final step of the alpha-aminoadipate pathway. lys3 mutants are classical lysine auxotrophs used as genetic markers. It is cytoplasmic in a genome-wide screen.
