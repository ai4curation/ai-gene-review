  details: |
    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'ACCEPT': 9, 'KEEP_AS_NON_CORE': 4, 'MODIFY': 1}. Summary: met26 (SPAC9.09; UniProt Q9UT19) encodes the cobalamin-independent methionine synthase (MetE family; EC 2.1.1.14), a zinc-dependent enzyme that moves the methyl group of 5-methyltetrahydropteroyltriglutamate to L-homocysteine to make L-methionine. This is the last step of de novo methionine synthesis and also regenerates methionine in the methyl cycle. met26 disruptants are methionine auxotrophs.
