    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'ACCEPT': 6, 'KEEP_AS_NON_CORE': 1, 'MODIFY': 1}. Summary: gna1 (SPAC16E8.03; UniProt O13738) encodes glucosamine-6-phosphate N-acetyltransferase (EC 2.3.1.4), a GNAT-family enzyme that acetylates glucosamine 6-phosphate with acetyl-CoA to give N-acetylglucosamine 6-phosphate. This is the second step of the hexosamine pathway to UDP-GlcNAc. Function is assigned by orthology to S. cerevisiae GNA1; a genome-wide screen places it in the cytosol and nucleus.
