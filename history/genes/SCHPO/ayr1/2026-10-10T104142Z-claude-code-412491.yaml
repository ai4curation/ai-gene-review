  details: |
    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'ACCEPT': 10, 'KEEP_AS_NON_CORE': 9}. Summary: ayr1 (SPAC23D3.11; UniProt Q09851) encodes the NADPH-dependent 1-acyldihydroxyacetone-phosphate reductase (EC 1.1.1.101). It reduces 1-acyl-DHAP to lysophosphatidic acid in the DHAP route of phosphatidic acid synthesis. By similarity to S. cerevisiae Ayr1, it sits on the ER and lipid droplets and may have a minor triacylglycerol lipase activity. It is in the ER in a genome-wide screen.
