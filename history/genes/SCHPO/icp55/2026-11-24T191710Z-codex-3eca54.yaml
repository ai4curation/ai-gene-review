  summary: Create S. pombe icp55 gene review
  details: |
    Reviewed all 11 seeded GOA annotations for S. pombe icp55 in GO-CAM 69729a3800007453. Kept the mitochondrial, matrix, matrix-side inner-membrane, metalloaminopeptidase, manganese-binding, and mitochondrial protein processing claims; refined broad PAINT aminopeptidase and proteolysis rows to metalloaminopeptidase activity and mitochondrial protein processing; and marked the ARBA cytoplasm row as too general beside the accepted mitochondrial locations. Perplexity deep research was unavailable in this runtime, so the review records a manual synthesis from the cached GOA references, UniProt, the S. cerevisiae Icp55 primary paper, and the GO-CAM source. An earlier draft misread the model's flat GO term object list as giving icp55 a stale activity label, but GO:0070006 is correctly labelled in the source model and the final notes carry no such GO-CAM relabel request.
