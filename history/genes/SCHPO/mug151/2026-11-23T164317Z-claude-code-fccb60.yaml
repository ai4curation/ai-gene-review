  details: |
    Ran OpenScientist (3 iterations) to assign a structural fold to mug151. The fold is SAP30BP/HCNGP (top hit human SAP30BP, 94% coverage). It lacks the RBM17-recruiting UHM-ligand motif, and S. pombe has no RBM17, so that route does not transfer. Recorded as an unverified lead (paper not cached): a reported SAP30BP-fold scaffolding of CDK11-cyclin L for SF3B1 phosphorylation, with S. pombe cdk11/lcp1 orthologs. Gap OPEN -> NARROWING.
