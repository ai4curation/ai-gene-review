  details: |
    Full review of 19 GOA rows for S. pombe spa2 (O42869, SPAC3G9.05) during the PTHR21601 family pass, respecting PomBase experimental curation. Results: 14 ACCEPT, 2 REMOVE (the GO:0005078 MAP kinase scaffold IBA from root node PTN004550576 and its derived GO:0000165 IEA, both against negative MAPK data in PMID:25428987 and PMID:40931936), 1 MODIFY (GO:0005515 Cdc15 IPI to GO:0017124 SH3 domain binding), 1 MARK_AS_OVER_ANNOTATED (2008 ISO actin cytoskeleton organization), and 1 UNDECIDED (PomBase IMP GO:0120207 endocytosis, site selection; the cached full text describes exocytosis focusing, so a query to PomBase was raised rather than overruling the curator). Added a description, core functions (adaptor at growing tips; ring intermediate layer via SH3 binding), questions, an experiment and spa2-notes.md, and cited the Falcon deep research. Validated with just validate SCHPO spa2.
