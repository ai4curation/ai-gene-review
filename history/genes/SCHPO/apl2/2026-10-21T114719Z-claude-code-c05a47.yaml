    New review of S. pombe apl2 as the experimentally characterised AP-1 beta ortholog of NEUCR/NCU09721, independent of ProtNLM2 output. All 20 GOA rows reviewed: AP-1 complex (IDA/IBA/NAS), endosome IDA, TGN IBA, endosome-to-Golgi and endosome-to-PM transport IDA, clathrin binding and contributes_to clathrin-cargo adaptor accepted; general IEA locations/processes MODIFY to the specific terms the gene carries; Golgi apparatus IDA refined to TGN; plasma membrane IEA (family boilerplate SubCell, AP-2 location) removed; endocytosis IBA from deep node PTN000123671 marked over-annotated because fungi have a separate AP-2 beta (apl1) and apl2 lacks the appendage domain. Added sequence-motif analysis (clathrin box LLDLD 623-627, no appendage) in apl2-bioinformatics/. Cached PMIDs 23028933, 21304827, 23840894, 15047861, 18257517. Falcon and perplexity-lite deep research both failed (auth/quota); recorded in notes.
