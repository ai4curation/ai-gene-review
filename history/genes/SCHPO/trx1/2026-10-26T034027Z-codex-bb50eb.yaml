  summary: Reassess complete fungal sulfate-assimilation member review
  details: |
    All 26 rows and core functions reviewed; original machine annotation payloads preserved and no row added. Native cytosolic Trx1 donates reducing equivalents to multiple substrates, including the sulfate-assimilation system; it is not itself PAPS reductase or methionine-sulfoxide reductase. PMID:18758731 supports native deletion, sulfite rescue and stress physiology; PMID:22245228 supports competition among oxidized protein substrates and Tpx1. Electron transfer and antioxidant activities are core at the verified GO definitions. The ROS-response claim is accepted using independent native evidence, while the original PMID:12020831 abstract foregrounds mitochondrial Trx2 and cannot settle the complete assay scope. No wrong-paralog inference is made. PMID:28640807 supports redox/RNR context, but a pathway schematic does not establish the exact met16 catalytic intermediate. The PAPS-system core uses electron transfer rather than asserting an experimentally demonstrated Met16 disulfide substrate. Other peroxide, osmotic, thermal, protein repair and localization assertions were reviewed independently. Normal Falcon/fallback attempts failed with provider access/quota errors; publication caching succeeded and manual evidence assessment is documented in the appended notes. Focused validation, rendering and record-section backfill accompany this review.
