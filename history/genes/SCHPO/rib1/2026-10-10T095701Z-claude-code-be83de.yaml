    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'MODIFY': 1, 'ACCEPT': 6, 'KEEP_AS_NON_CORE': 3}. Summary: rib1 (SPAP27G11.09c; UniProt Q9P7M9) encodes GTP cyclohydrolase II (EC 3.5.4.25), which opens the imidazole ring of GTP to 2,5-diamino-6-ribosylamino-4(3H)-pyrimidinone 5'-phosphate, releasing formate and pyrophosphate. This is the first committed step of riboflavin biosynthesis. Function is assigned by orthology to S. cerevisiae RIB1; it is cytosolic in a genome-wide screen.
