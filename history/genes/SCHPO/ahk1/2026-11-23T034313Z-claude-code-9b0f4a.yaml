  summary: Narrow the ahk1 localization knowledge gap with an OpenScientist run; mark
    predicted membrane location over-annotated
  details: |
    Ran OpenScientist (3 iterations) on whether the three UniProt-predicted TM helices of ahk1 are real membrane spans. Four concordant lines say they are the buried core of a soluble fold: burial above benchmark TM helices, non-bilayer crossing angles, unfavourable Sec61 insertion energies, and no TM call in 8 orthologs; a sister-species ortholog gains lysines in segment 1. GO:0016020 membrane (IEA, from the ECO:0000255 prediction) changed KEEP_AS_NON_CORE -> MARK_AS_OVER_ANNOTATED. Description reworded. Localization gap OPEN -> NARROWING (compartment still unknown).
