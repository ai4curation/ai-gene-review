    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'ACCEPT': 7, 'KEEP_AS_NON_CORE': 1, 'MARK_AS_OVER_ANNOTATED': 1}. Summary: SPAC17A5.13 (UniProt O13774; the fission yeast FOL2 ortholog) encodes GTP cyclohydrolase I (EC 3.5.4.16), which converts GTP to 7,8-dihydroneopterin triphosphate, the first step of de novo folate (pterin moiety) synthesis. Yeasts make no tetrahydrobiopterin, so in fungi the product goes only to folate. Function is assigned by orthology; it is cytosolic in a genome-wide screen.
