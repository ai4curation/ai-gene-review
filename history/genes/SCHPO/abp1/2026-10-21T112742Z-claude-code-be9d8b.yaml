  summary: 'Create review: abp1'
  details: |
    De novo full review of S. pombe Abp1 (P49777), the closest experimentally characterised relative (PTHR19303:SF73, PAINT PTN002712198 co-donor) of ProtNLM2 benchmark gene cbh1, written independently of ProtNLM2 output. Falcon deep research failed (twice), so the review rests on 21 cached primary papers. All 18 GOA rows actioned: centromeric DNA binding, chromatin-protein adaptor activity, chromatin, centromeric region and nucleus accepted; generic nucleic-acid/DNA/sequence-specific DNA binding rows (incl. IBA) refined to sequence-specific dsDNA binding; chromatin organization refined to pericentric heterochromatin formation and transposable element silencing; donor selection, mat heterochromatin and rDNA-heterochromatin regulation kept as non-core. One NEW term, transposable element silencing (Abp1 binds Tf2 LTRs and recruits HDACs). Evolutionary grounding per Casola 2008: convergent domestication, so only DNA binding and nucleus are inherited from the PAINT node; replication-fork, meiotic-HR and S-phase phenotypes deliberately not annotated.
