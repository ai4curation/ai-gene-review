  summary: 'Retrospective audit corrections: SPCC1620.08'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. Action changes: GO:0006104 succinyl-CoA metabolic process (IBA) KEEP_AS_NON_CORE -> ACCEPT, for the reason given for the alpha subunit SPAC16E8.17c. GO:0003824 catalytic activity (IEA) MODIFY (to GO:0004775) -> TOO_GENERAL; the reason is now worded the same way in all eleven subunit reviews (true but uninformative, entailed by the accepted specific activity). Description reworded so that it does not generalise about fungi. Validated with just validate SCHPO SPCC1620.08.
