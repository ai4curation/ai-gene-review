  details: |
    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'MODIFY': 2, 'ACCEPT': 11, 'KEEP_AS_NON_CORE': 10}. Summary: fum1 (SPCC18.18c; UniProt O94552) encodes class II fumarate hydratase (fumarase; EC 4.2.1.2), which hydrates fumarate to L-malate in the mitochondrial TCA cycle. By similarity to S. cerevisiae and human fumarase, a single gene may make both mitochondrial and extramitochondrial forms, and the cytosolic/nuclear pool may help the DNA damage response, but none of this has been shown in S. pombe.
