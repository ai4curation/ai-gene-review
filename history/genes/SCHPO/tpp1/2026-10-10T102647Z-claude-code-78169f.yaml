  details: |
    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'MODIFY': 1, 'ACCEPT': 12, 'REMOVE': 4}. Summary: tpp1 (SPAC19G12.15c; UniProt P78875) encodes the main trehalose-6-phosphate phosphatase (EC 3.1.3.12) of fission yeast, which dephosphorylates trehalose 6-phosphate to trehalose, the second step of trehalose synthesis. tpp1 disruption causes trehalose-6-P to accumulate on heat shock and prevents growth at 37-40 °C. Tpp1 forms complexes with Tps1 and the neutral trehalase Ntp1.
