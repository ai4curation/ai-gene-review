  summary: Full re-review of sus1 (Q7LL15) independent of ProtNLM2 predictions
  details: |
    Re-examined all 26 GOA rows against fission yeast SAGA and DUB-module evidence (PMID:19056896, 31748520, 20838651) and against budding-yeast ortholog evidence, which is grounded through PAINT node PTN000282153 in PANTHER family PTHR12514 (no subfamily split). Added a pairwise sequence comparison (sus1-bioinformatics/RESULTS-rereview.md) mapping the budding-yeast Sus1 interface mutants onto conserved S. pombe residues. Changes: P-body and cytoplasm UNDECIDED to KEEP_AS_NON_CORE (conditional budding-yeast pool, PMID:20230609); transcription elongation ACCEPT to KEEP_AS_NON_CORE (ortholog-only, PMID:18923079); nucleus, mRNA export from nucleus, and positive regulation of DNA-templated transcription changed to MODIFY toward specific terms the gene already carries. Rewrote the description and core functions (DUBm scaffold; inferred TREX-2 export role) and added references and suggested experiments.
