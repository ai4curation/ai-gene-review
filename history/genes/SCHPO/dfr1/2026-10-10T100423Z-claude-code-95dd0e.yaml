  details: |
    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'ACCEPT': 6, 'KEEP_AS_NON_CORE': 6}. Summary: dfr1 (SPCC1223.08c; UniProt P36591) encodes dihydrofolate reductase (EC 1.5.1.3) fused at its N-terminus to an FSH1-like alpha/beta serine hydrolase domain. The DHFR domain reduces dihydrofolate to tetrahydrofolate with NADPH, completing de novo THF synthesis and regenerating THF after thymidylate synthesis. The cDNA confers trimethoprim resistance in E. coli and methotrexate resistance in yeasts.
