  details: |
    New full review of S. pombe vps1302 (O42926), independent of ProtNLM2 predictions, as the sequence relative of spo2. Deep research failed (falcon 403, perplexity-lite quota), recorded in notes. Established PANTHER PTHR16166:SF93 membership shared with S. cerevisiae VPS13 (vps1301 is SF145) and verified by script that Spo2 equals Vps1302 residues 2999-3131. Reviewed all 11 GOA rows: accepted phospholipid transfer activity (IBA/ISS), intermembrane phospholipid transfer (TAS), endosome membrane and mitochondrial outer membrane (IBA); refined intermembrane lipid transfer (IBA/ISS) to GO:0120010; kept phospholipid binding, Golgi apparatus, mitochondrion organization and macroautophagy as non-core. No NEW terms: no S. pombe experimental GO evidence exists and unpropagated S. cerevisiae terms were treated as deliberate. Cached supporting S. cerevisiae Vps13 and S. pombe screen publications.
