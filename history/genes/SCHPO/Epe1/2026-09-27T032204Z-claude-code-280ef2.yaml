  summary: 'Epe1: attribute H297A phenotypes by assay; fix Bao 2019 PMID'
  details: |
    The GO:0032452 IBA reason said the H297A mutant retains anti-silencing function (Bao 2019), which contradicted the Audergon 2015 rows (H297A behaves like epe1 deletion). Read the full texts: Audergon 2015 (PMID:25838386) tested endogenous-level H297A in the tethered-Clr4 inheritance assay (phenocopies deletion); Sorida 2019 (PMID:31206516) found H297A fails to remove established ectopic heterochromatin but still suppresses variegation; Bao 2019 (PMID:30573453, cached) shows only overexpressed H297A still disrupts pericentric silencing, SAGA-dependently, and itself states endogenous H297A resembles epe1 deletion. Rewrote the reason to attribute each result to its assay, added verbatim supporting_text from all three, added PMID:30573453 to references (the summary md had cited PMID:30531922, an unrelated glioma paper), and corrected the summary md. Re-rendered the review HTML, visual SVG and pathway HTML (which still carried the HVD claim and the wrong PMID).
