  summary: 'Epe1: engage counter-evidence to the pseudoenzyme framing; fix disowned
    quotes'
  details: |
    Added the strongest cached counter-evidence to the pseudoenzyme framing, without changing any action: Ayoub 2003 (jmjC domain essential for Epe1 activity), Zofall and Grewal 2006 (JmjC domain required, mechanism may differ from demethylases), Raiymbek 2020 (JmjC domain proposed to read H3K9me), and Wang 2015 (active-site mutants interpreted as enzymatic redundancy with Mst2). The GO:0032452, GO:0016491 and GO:0051213 reasons now weigh this explicitly; residue 374 of UniProt O94603 is Thr, not His, and is not a triad residue, so Wang's epe1-H374A cannot be mapped. Added to the description, a new core-function-1 knowledge gap, the summary md, CONTESTED_FUNCTION.md and PSEUDOENZYMES.md. Replaced supporting quotes that their rows' reasons disown (pericentric deep-research ChIP sentence; falcon and deep-research quotes overstating Fe-residue loss or Swi6-binding loss), made the GO:0046872 UniProt quotes position-specific (FT BINDING 297/299), added Ayoub quotes for mat-locus functional evidence and PEV, Sorida own-result island quotes, and removed a ChIP-seq claim from the summary md.
