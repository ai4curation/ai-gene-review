  summary: 'Epe1: Y307 identity (2-OG site) from Sorida and Raiymbek; unengaged Raiymbek/Sorida
    findings; Sorida arm split in decks'
  details: |
    Round 24. Added Sorida 2019's statement that Epe1Y307A 'retains the metal-binding residues' (citing a background reference, [12], not resolvable from the cache) and Raiymbek 2020's assignment of Y307 to the alpha-ketoglutarate site ('epe1 H297A and epe1 Y307A, respectively') to the counter-evidence in GO:0032452, GO:0016491, GO:0051213 and both GO:0032454 rows, plus core function 4's knowledge gap. The sources agree that Y307 is a 2-oxoglutarate-site residue, not an Fe(II) ligand, so the Y307A loss-of-function record implicates the cofactor pocket but does not isolate catalysis; Wang 2015's enzymatically-dead reading of Y307A is consistent with that but not a measurement. Also added, verbatim: Y307A fails to co-localize with Swi6 (conflicting at least in degree with Sorida's cited Swi6 interaction with Epe1Y307A); recombinant H297A has wild-type denaturation temperature; Fe(II)/alpha-ketoglutarate/ascorbate do not change Epe1-Swi6 binding in vitro (with the authors' caveat); H297A prevention nearly but not fully retained ('contributes to full suppression to some extent'); prevention acts independently of JmjC demethylation and heterochromatin association; Sorida's own conformational-change mechanism for the alternative explanation; Raiymbek's latent-activity speculation and DMM-1 analogy in the knowledge gap. PMID:32195666 added to the GO:0032454 EXP row's additional_reference_ids. CONTESTED_FUNCTION deck: 'against' slide now carries only the retained arm and 'for' slide only the lost arm, each labelled as one experiment read two ways with a cross-reference. PSEUDOENZYMES.md and deck name the arm split. exemplar-actions.svg gets a distinct UNDECIDED legend swatch (#d9a520) replacing the inline text. No action changes.
