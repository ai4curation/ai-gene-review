  summary: 'Epe1: reverse GO:0034728 NEW row (fails participation test)'
  details: |
    Reverses the GO:0034728 nucleosome organization NEW row added in the previous record. The evidence (reduced heterochromatic histone turnover in pob3 epe1 vs pob3, PMID:34731638) shows necessity, and FACT and other chaperones/remodelers perform nucleosome disassembly and reassembly; every repo gene on GO:0034728 is a chaperone or remodeler, and PomBase has not annotated Epe1 to it, so it fails the CLAUDE.md NEW-process participation test. Removed the NEW row and the term from core function 4, which keeps its GO:0042393 MF anchor and now describes the turnover role in prose and knowledge_gaps. No regulation term fits: positive regulation of histone exchange (GO:1900051) is obsolete and positive regulation of nucleosome disassembly (GO:0140887) is narrower than the measured turnover; a suggested question for PomBase/GO was added instead, and no proposed_new_terms entry since GO obsoleted the closest term. GO:0006325 and GO:0006338 remain KEEP_AS_NON_CORE, with consistent reasons now resting on GO:0033696. Murawska 2021 is kept as evidence for the description. Also switched the GO:0032452 and GO:0016491 file: quotes to the result sentences and dropped the SAGA association quote from the GO:0006338 row.
