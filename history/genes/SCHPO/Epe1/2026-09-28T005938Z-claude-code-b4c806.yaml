  details: |
    Round-4 review response. Corrected the GO:0046872 reason: the UniProt BINDING 297/299 Fe cation features carry ECO:0000255 PROSITE-ProRule:PRU00538, so the chain is JmjC domain, PRU00538, BINDING, KW-0479, GO:0046872 (domain-derived); UNDECIDED retained because binding is unmeasured. Added verbatim single-line UniProt quotes (FT BINDING ligand/evidence lines; DE EC=1.14.11.27 by similarity to P40034; Rhea RHEA:42032 line). In Epe1-sft-predictions.yaml, corrected the stale statement that GO:0046872 is removed (it is UNDECIDED). The NPI codes on GO:0005506 and GO:0031409 were left unchanged because Epe1 is in the pinned ARGO95 SFT benchmark and changing them moves manuscript numbers; that reassessment is deferred to a benchmark-refresh decision. Added suggested questions on the O94603 UniProt inconsistency and the PomBase GO:0032454 evidence code, and suggested experiments for direct Fe(II)/2OG binding and latent activity. Fixed stale summary md sentences, extended the RESULTS.md correction note to section 4 and the Summary, and made CONTESTED_FUNCTION, PSEUDOENZYMES and the two decks state the post-merge outcome in the present tense like OVER_ANNOTATION_PATTERNS.
