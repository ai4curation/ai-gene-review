  summary: 'Epe1: ground nucleosome-turnover core function histone binding in Raiymbek
    2020'
  details: |
    The nucleosome-turnover core function used GO:0042393 histone binding with only a turnover quote. A search of the cited publications found direct evidence in PMID:32195666 (purified MBP-Epe1 preferentially associates with H3K9me3 over H3K9me0 peptides and selectively interacts with H3K9-methylated histones), so GO:0042393 is kept and two verbatim quotes are added. A knowledge_gaps entry records that the mechanism of turnover and its link to histone binding are unknown, and why GO:0062072 H3K9me2/3 reader activity was not used. Aligned PSEUDOENZYMES, CONTESTED_FUNCTION and the summary md.
