  summary: 'Epe1: prose-claims audit of reasons and summaries'
  details: |
    Audited 102 attribution, method, locus and residue claims in reason, summary, core-function and knowledge-gap prose; 24 failed and all were fixed. Undeclared or unquoted citations were quoted verbatim and declared (Raiymbek 2020 on GO:0016491, GO:0051213 and the GO:0000792 IDA row; Bao 2019 on GO:0006357 and GO:0003712; Audergon 2015 on GO:0046872; Tsukada 2006 on GO:0032452). GO:0051213 now quotes Raiymbek's mass-spec negative instead of a hedged synthesis and an 'unresolved' sentence. Unsupported method claims (ChIP, ChIP-seq, immunofluorescence attributed to abstract-only 2003/2006 papers) and locus claims were removed or softened; the mating-type row states the abstract limitation and cites Trewick 2007's mat-locus result. Corrected claims contradicted by their sources: Asanuma 2022 says Epe1 acts without disrupting heterochromatin; Wang 2015 says the epe1-mst2 interaction does not involve Bdf2-dependent boundary activity; Isaac 2007 shows functional, not physical, interaction. additional_reference_ids now declares every PMID quoted or cited on a row, with no empty or null slots. Reference reviews: PMID:16762840 'five' rows; PMID:25831549 and PMID:29214404 correctness VERIFIED with the cache limitation in notes.
