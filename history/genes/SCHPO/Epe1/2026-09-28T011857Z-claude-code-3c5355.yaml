  details: |
    Round-5 review response. The Bdf2-recruitment core function used GO:0042826 histone deacetylase binding although Bdf2 is a BET bromodomain protein; replaced with GO:0030674 protein-macromolecule adaptor activity (OLS-verified; no bromodomain-protein binding term exists) and added the PMID:24013502 quote that Bdf2 interacts with Epe1 and is recruited in an Epe1-dependent manner. The Clr3-competition entry keeps GO:0140030: Epe1 competes with Clr3 for Swi6, it is not shown to bind Clr3, so GO:0042826 is not supported there either. The GO:0005515 MODIFY now proposes GO:0140030, GO:0035035 and GO:0030674 to match its Swi6/SAGA/Bdf2 argument. Replaced the Rhea continuation-line quote with the UniProt Reaction= and Evidence=P40034 lines. Added YAML comments in Epe1-sft-predictions.yaml marking the GO:0005506/GO:0031409 NPI to UNC reassessment as deferred to the benchmark snapshot follow-up. Aligned the summary md core function 1 MF and hedged OVER_ANNOTATION_PATTERNS and PSEUDOENZYMES sentences.
