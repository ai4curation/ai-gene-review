  summary: 'Epe1: cite Raiymbek 2020 (PMID:32195666); reconcile REMOVE vs UNDECIDED'
  details: |
    Resolved the Raiymbek 2020 eLife paper (doi 10.7554/eLife.53155) to PMID:32195666 via NCBI esearch and cached it with just fetch-pmid (full text). The summary md had cited it as PMID:32433969, an unrelated NF45/NF90 paper. Added PMID:32195666 and PMID:16362057 (Tsukada 2006, cited by the UniProt CAUTION) to references with reference_review, and added verbatim PMID:32195666 quotes for the in vitro negative, the Y370 His-to-Tyr substitution and the H297A Swi6 binding defect. Hedged the description, which said Epe1 lacks catalytic activity, to match the UNDECIDED GO:0032454 rows (no activity detected, non-canonical triad, latent activity unresolved). Added a sentence to the GO:0032452, GO:0016491, GO:0046872 and GO:0051213 REMOVE reasons stating that the removal targets the PAINT/keyword inference of canonical JHDM1 activity, not latent activity, and removed the unsupported 'cannot coordinate metal' claim. Corrected the GO:0032454 reason, which said the JmjC mutations disrupt Swi6 binding: Raiymbek 2020 reports H297A compromises binding, while Sorida 2019 reports only a slight binding defect but a large localization loss. Re-grounded the SFT 2-oxoglutarate binding NPI call on the absence of measured 2OG binding (K314 is retained). Updated the annotation summary counts, the bioreason-rl review wording, the BIOINFORMATICS_FIXES.md key finding (retracted) and the RESULTS.md JmjC boundaries (UniProt 243-402).
