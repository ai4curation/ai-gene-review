    Round-3 review response. Changed GO:0046872 metal ion binding from REMOVE to UNDECIDED: the IEA comes from the UniProt Metal-binding keyword resting on BINDING 297/299 Fe cation features, H297 and E299 are retained, and metal binding has not been measured; added the verbatim PMID:32195666 quote that Fe(II)/2OG-site mutants attenuate Swi6 binding. Rewrote the GO:0140680 REMOVE row: dropped the unsupported claim that mass-spec assays tested H3K36 (the cited assays used H3K9 peptides only) and the unhedged pseudo-enzyme wording, added the reconciliation sentence, and grounded the removal on the family-level transfer of H3K36 specificity from budding-yeast Jhd1, which is distinct from Epe1. Removed the three remaining supporting_text entries from the retracted RESULTS.md motif analysis (GO:0016491, GO:0051213, GO:0140680). Hedged the summaries of GO:0032452, GO:0016491 and GO:0051213 to match their reasons, and described Raiymbek's H297A Swi6 result as a pull-down. Updated the annotation summary counts (4 REMOVE, 3 UNDECIDED), the bioreason-rl review, and the PR #3229 notes in CONTESTED_FUNCTION, PSEUDOENZYMES and OVER_ANNOTATION_PATTERNS.
