  summary: 'Create review: S. pombe pos5 (mitochondrial NADH kinase)'
  details: |
    New review of S. pombe pos5 (Q9UT98), centred on Nishihara et al. 2026
    (PMID:41926382, full text), with ScPos5 background from PMID:12727869 (abstract,
    fetched this session). All 10 GOA rows were reviewed. ACCEPT: mitochondrion HDA/IEA,
    mitochondrial matrix IBA, NADP+ biosynthetic process IEA, NADH kinase activity IBA/IEA.
    MODIFY: kinase activity and phosphotransferase (alcohol acceptor) to NADH kinase
    activity; NAD+ metabolic process to NADP+ biosynthetic process. KEEP_AS_NON_CORE:
    cellular response to oxidative stress IBA. No NEW rows: the S. pombe IDA (mitochondrion)
    and IMP (NADP+ biosynthesis) evidence duplicates terms already in GOA and is recorded in
    the reasons. GO:0006744 ubiquinone biosynthetic process was deliberately not added. Pos5
    supplies NADPH but performs no identified CoQ step, and the comparator check (QuickGO)
    shows no NADPH-generating enzyme carries the term in S. pombe, S. cerevisiae or human.
    This is recorded as a BIOLOGY knowledge gap and a suggested question. Wrote
    pos5-notes.md. Validated with just validate SCHPO pos5 (only environment warnings);
    record_section backfilled.
