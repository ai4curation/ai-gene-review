    New S. pombe exemplar review for the YeastPathways module crosswalk. Annotation actions: {'ACCEPT': 7, 'KEEP_AS_NON_CORE': 3, 'MARK_AS_OVER_ANNOTATED': 2, 'MODIFY': 1}. Summary: adi1 (SPBC887.01; UniProt O94286) encodes acireductone dioxygenase (ARD; EC 1.13.11.54), a cupin-fold metalloenzyme. In its Fe2+ form it oxidises 1,2-dihydroxy-3-keto-5-methylthiopentene to 4-methylthio-2-oxobutanoate (the methionine keto acid) and formate, the penultimate step of the MTA cycle; a transaminase then completes methionine regeneration. Function is assigned by orthology to S. cerevisi
