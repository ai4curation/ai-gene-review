  details: |
    Follow-up to the tree re-read of 2026-11-11 (record 2026-11-11T171130Z-claude-code-aee34b), after review of the pull request.

    - GO:0004140 (REMOVE): the re-read had replaced WRONG_ORTHOLOG_OR_PARALOG by PSEUDO_OR_SUBACTIVITY_LOSS because the extract called all 6 seeds one-to-one orthologs of cab4. Both steps were wrong. The review's summary argues that the subfamily placement (PTHR10695:SF46, 274 of the family's 305 leaves) is what lumps PPAT-only, DPCK-only and bifunctional proteins, so the tree's ortholog call does not answer it; and the kinase domain is absent from cab4, not present and inactive, so PSEUDO_OR_SUBACTIVITY_LOSS does not describe it (it also asks for residue claims the row cannot give). The failure modes are back to WRONG_ORTHOLOG_OR_PARALOG.
    - The extract itself was wrong about the seeds: four of the six are separated from cab4 by horizontal-transfer nodes and are no longer counted as one-to-one orthologs (generator fix of 2026-11-16). The reason now gives the corrected relations: human and mouse COASY are one-to-one orthologs, and E. coli and M. tuberculosis CoaE, Arabidopsis COAE and human DCAKD are orthologs across horizontal-transfer nodes.
    - The quotes follow the regenerated extract, and sentence 4 (the seeds bracket the node, 2 of them on cab4's own branch) is quoted as well.

    The verdict is unchanged. The review validates, without the missing_residue_evidence warning the earlier edit had caused.
