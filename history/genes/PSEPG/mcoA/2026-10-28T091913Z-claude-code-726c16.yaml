  summary: Correct PANTHER family membership claim, align proposed-term stoichiometry
    with ExplorEnz, and fix Mn oxide product valence (PR 5643 follow-up)
  details: |
    Three non-blocking review items. (1) The GO:0005507 reason and mcoA-notes.md asserted that the bare family PTHR48267 (CUPREDOXIN SUPERFAMILY PROTEIN) 'also contains single-domain type-1-only cupredoxins with no trinuclear cluster'. That is false: PTHR48267-metadata.yaml gives subfamilies 1, proteins 7748 and integrated IPR045087, and all 36 rows of PTHR48267-entries.csv are PTHR48267:SF1, so family and subfamily are coextensive in membership and the family does carry the three-domain multicopper oxidase claim via IPR045087. The text now cites SF1 because the bare family's NAME is uninformative, not because the family is broader, and the metadata file is cited as a new file: reference with its own finding. (2) proposed_new_terms definition equation was halved relative to the ExplorEnz EC 1.16.3.3 overall reaction quoted in justification; it now reads 4 Mn(2+) + 2 O2 + 4 H2O = 4 Mn(IV)O2 + 8 H(+), matching the entry's canonical form, and still states the reaction only with the one-electron mechanism kept in justification. (3) 'Mn(III/IV) oxide(s)' in description and core_functions.description is now 'Mn(IV)', matching PMID:42757987 ('form nanoscale layer-type Mn(IV) oxides'; 'Both MnxG and McoA can oxidize Mn(II) to Mn(III) and Mn(III) to Mn(IV), resulting in a Mn(IV) oxide product'). No action, term or contributes_to changed.
