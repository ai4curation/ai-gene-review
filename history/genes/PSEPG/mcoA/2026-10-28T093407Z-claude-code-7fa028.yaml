  summary: Replace the unsupported PTHR48267/SF1 equal-count claim with the panther.obo
    single-subfamily reading, and mark the entries.csv reference as a sample (PR 5643
    follow-up)
  details: |
    Second correction to the same PANTHER passage (PR 5643 follow-up). The previous
    session replaced a false claim ("the bare family PTHR48267 also contains
    single-domain type-1-only cupredoxins with no trinuclear cluster") with a
    different unsupported one: that PTHR48267 and PTHR48267:SF1 report the same
    7,748 member proteins and are therefore coextensive in membership. That
    equal-count claim is superseded here and must not be restated. The cited file
    does not carry it: PTHR48267-metadata.yaml gives subfamilies 1 (line 19),
    matches 7748 (line 22) and proteins 7748 (line 24), all for the FAMILY, with no
    member count for SF1 anywhere in the file; and one subfamily does not entail
    that every family member carries a subfamily assignment, since PANTHER
    routinely places proteins at family level with none. PTHR48267-entries.csv is
    also only a 36-row sample of those 7,748 proteins, so "all rows are SF1" proves
    nothing about coextension. The argument now rests on what the repository
    artifacts do establish: PANTHER:PTHR48267:SF1 is the only term in
    interpro/panther/panther.obo with is_a PANTHER:PTHR48267, so there is no second
    subfamily by which the family could be broader, matching the subfamilies 1
    counter. panther.obo is added as a cited file reference with its own finding and
    a verbatim quote of the SF1 stanza; the entries.csv reference title and finding
    now state that the file is a sample and not the full membership. mcoA-notes.md
    records both superseded drafts in one paragraph rather than leaving two
    accounts. The naming argument is unchanged: CUPREDOXIN SUPERFAMILY PROTEIN does
    not state the type-1-plus-trinuclear architecture, SF1's name and member
    composition do, and the family-level assignment already carries the architecture
    via IPR045087. No action, term, qualifier, contributes_to, proposed_definition or
    Mn valence wording changed; the two supporting quotes added in the previous
    commit are untouched.
