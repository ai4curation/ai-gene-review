  details: |
    Curated all 16 GOA annotations for Medicago truncatula STR (STUNTED ARBUSCULE, D3GE74), the half-size ABCG transporter that heterodimerises with STR2 in the periarbuscular membrane and is required for arbuscule development. Actions: 10 ACCEPT, 5 KEEP_AS_NON_CORE, 1 MODIFY (protein binding IPI with STR2 -> protein heterodimerization activity), 0 REMOVE, 0 NEW. Molecular function kept substrate-agnostic (ABC-type / ATPase-coupled transmembrane transporter activity) because the proposed 2-monoacylglycerol cargo has not been shown biochemically; expression-response terms kept non-core; NOT nodulation and NOT homodimerization accepted. Added rice STR1/STR2, WRI5a, ERM1/ERF12, FatM/RAM2 and transporter-review references. Validation passed with no warnings.
