  summary: Add checked residue claims (HRD Asp retained, DFG Asp lost) to NFP kinase-activity
    removals
  details: |
    Converted the prose argument that NFP lacks key catalytic kinase residues into structured propagation_review.residue_claims on its electronic kinase-activity rows, with root cause PROPAGATION_BAD and failure mode PSEUDO_OR_SUBACTIVITY_LOSS. A global pairwise alignment to the active Arabidopsis LysM receptor kinase CERK1 (A8R7E6), produced by NFP-bioinformatics/align_to_anchor.py and archived as NFP_vs_CERK1.aln.fasta, shows NFP keeps the catalytic-loop (HRD) aspartate that UniProt annotates as its ACT_SITE and has lost the Mg2+-binding DFG aspartate (Asn453). Actions are unchanged. The case came from the paper's scripted residue-loss audit, where the UniProt ACT_SITE flag fired on the retained HRD residue rather than the residue the prose meant. All residue-claim checks pass, including the new alignment_file check.
