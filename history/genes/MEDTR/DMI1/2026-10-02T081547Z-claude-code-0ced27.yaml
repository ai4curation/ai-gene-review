  summary: 'Create review: DMI1'
  details: |
    Curated Medicago truncatula DMI1 (Q6RHR6), the POLLUX-type nuclear-envelope cation channel of the common symbiosis pathway. Reviewed all 7 GOA rows: ACCEPT 3 (potassium ion transport IEA; nuclear membrane EXP and IEA), MODIFY 4 (three protein binding IPI rows with CNGC15a/b/c to ion channel regulator activity GO:0099106, based on Cook et al. 2025 showing DMI1 activates and paces CNGC15; monoatomic ion transport to monoatomic cation transmembrane transport). Added 3 NEW: monoatomic cation channel activity (IDA, bilayer data; kept generic to match Lotus CASTOR), nodulation and arbuscular mycorrhizal association (IMP, Ane 2004), with CNGC15A/B, CCaMK and CYCLOPS as comparators. Cached 9 additional PMIDs. Validation passes with no warnings; status COMPLETE.
