  summary: Create ai-gene-review for Geobacter sulfurreducens OmcE (Q74FJ0)
  details: |
    GOA is empty for Q74FJ0, so all five rows are NEW: heme binding (IDA), electron transfer activity (IC), anaerobic electron transport chain (IMP), protein polymerization (IDA) and cell surface (IDA). The molecular function is deliberately IC rather than IDA: unlike OmcS and OmcZ, OmcE has never been purified and shown to reduce an acceptor, and Wang 2022 measured no conductivity on OmcE filaments, inferring electron transport from matching heme geometry while warning against attributing conductivity to a single protein. Two full-text corrections to what the abstract implies are recorded: the filaments were enriched from omcS-mutant strains and read by the authors as compensation, not taken from wild type, and the surface glycosylation is a hypothesis about unidentified densities (the protein has no N-X-S/T sequon at all). No outer membrane term proposed, consistent with the OmcS review. Noted but did not review PTHR35038, whose family name is a dissimilatory sulfite reductase and whose SF6 is named for a decaheme lipoprotein while holding tetraheme OmcE alongside MtrA and a hydroxylamine oxidoreductase.
