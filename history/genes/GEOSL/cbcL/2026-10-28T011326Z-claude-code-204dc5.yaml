  summary: Pin the sequence the CXXCH scan expects so a refetch cannot silently desynchronise
    the recorded result
  details: |
    Review follow-up on PR 5638. cxxch_scan.py read cbcL-uniprot.txt without pinning the sequence, so a later fetch-gene bringing a different sequence version would have left the table in RESULTS.md, and the review description's motif-span claim, stale with nothing failing. The script now recomputes the UniProt CRC64 of the residues it parsed (ISO 3309, reflected, implemented in the script) and exits non-zero unless the sequence is 619 aa with CRC64 12CE553CC08B6BA0; both values were verified against the committed cbcL-uniprot.txt SQ line, and the recomputed CRC64 reproduces the one the flat file declares. The guard was exercised by perturbing the expected length, which fails as intended. The script also prints the motif span, so the description's residues 35-262 is derived rather than asserted. RESULTS.md records the pinned length and CRC64 beside the table, includes the verbatim output of the run, and says to re-run the scan rather than edit the table if the pins ever fail. The table is unchanged because the re-run produces the same nine motifs at 35, 58, 83, 106, 130, 159, 187, 230 and 258.
