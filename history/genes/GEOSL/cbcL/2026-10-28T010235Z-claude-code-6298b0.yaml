  summary: Correct NrfB propagation source_status, record comparator and PANTHER checks,
    add reproducible CXXCH scan
  details: |
    Review follow-up on PR 5638. (1) The NrfB (UniProtKB:P0ABL1) propagation_review source entity carried source_status SUPPORTS_SOURCE_BUT_NOT_TARGET while its own comment said NrfB is functionally close to CbcL; the status is now SOURCE_WEAK_OR_INFERRED and the comment states that the weak link is the seed's own generic oxidoreductase assignment, consistent with the declared TERM_SCOPING_PROBLEM root cause. (2) Adding GO:0005887 integral component of plasma membrane alongside GO:0005886 was declined on checking: OLS reports GO:0005887 obsolete and replaced by GO:0005886, and QuickGO resolves the id to plasma membrane with the integral-component name as a narrow synonym. The cell-envelope MODIFY reason now records that plasma membrane is the most specific term available. (3) The ImcH and CymA comparator accessions were verified against UniProt and QuickGO (Q747K6 IMCH_GEOSL, Q8E8S0 CYMA_SHEON; both carry GO:0009055 and GO:0019645 by IBA and GO:0005886 on experimental evidence) and the verification is recorded in the notes. (4) The CXXCH motif count now has a reproducible artifact, cbcL-bioinformatics/cxxch_scan.py plus RESULTS.md, cited from the GO:0020037 row; the scan reproduces the nine motifs at 35, 58, 83, 106, 130, 159, 187, 230 and 258. (5) A note explains that the PTHR35038:SF6 name is misleading rather than a defect. The suggested GO_Central source defect was declined: the node genuinely spans catalysts and carriers, so the generic term is a judgement at the node rather than an asserted_value to corrected_value correction.
