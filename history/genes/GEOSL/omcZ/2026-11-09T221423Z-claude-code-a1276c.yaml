  summary: Create ai-gene-review for Geobacter sulfurreducens OmcZ (Q74BG5)
  details: |
    De-novo review. GOA is empty for Q74BG5, so all five annotations are NEW: electron transfer activity (IDA, PMID:20400562), heme binding (IDA, PMID:36732469), bacterial biofilm matrix (IDA, PMID:23761253), anaerobic electron transport chain (IMP, PMID:19461962) and protein polymerization (IDA, PMID:36732469). Proposed a new CC term for extracellular cytochrome filaments, which GO lacks. Literature assembled by hand from PubMed (no provider deep research available); cached 19 PMIDs. Wissink et al. 2026 (DOI:10.1038/s41467-026-78976-x) was supplied as a CC-BY PDF and cached under its DOI as it is not yet in PubMed; it is comparative for the Geobacter protein. Recorded the ferrihydrite-phenotype conflict between PMID:37881251 and PMID:19461962/PMID:36732469, and the conductivity dispute, without resolving either.
