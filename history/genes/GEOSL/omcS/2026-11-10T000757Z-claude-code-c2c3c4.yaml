  summary: Create ai-gene-review for Geobacter sulfurreducens OmcS (Q74A86)
  details: |
    Reviewed all 10 GOA rows. Both IBA rows (GO:0009055, GO:0019645) accepted, consistent with the SOUND verdicts on node PTN001251186 in the PTHR30333 family review and backed by OmcS's own direct evidence. All four GO:0009986 cell surface rows accepted. All four GO:0009279 cell outer membrane rows marked over-annotated, kept consistent: the entry records no transmembrane segment or lipid anchor, the protein is curated and described as only loosely bound to the outer surface, the 2005 paper's outer-membrane assignment is explicitly a prediction, and the mature form is a polymerised extracellular filament (PDB 6EF8, 6NEF). Recorded as a UniProt OUTDATED_STATEMENT source defect asking for a check, not a deletion. Added NEW rows for heme binding and protein polymerization. Declined GO:0016722: what Qian 2011 measured is oxidation of pre-reduced OmcS, not catalytic turnover. Re-proposed the extracellular cytochrome filament term first raised in the OmcZ review, deliberately, since two genes needing it is the argument for creating it. Also updated the PTHR30333 family review to link the new gene review and to record CDD cd21555 OmcS-like and TCDB 5.B.3.1.1 as independent classifications that treat OmcS as its own family.
