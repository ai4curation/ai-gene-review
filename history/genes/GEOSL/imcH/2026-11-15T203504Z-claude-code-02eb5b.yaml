  summary: Record the GO:0008121 transporter-parent problem as structured ontology
    changes
  details: |
    The review already argued in prose, in a suggested question and in the proposed_new_terms justification, that GO:0008121 quinol-cytochrome-c reductase activity carries transmembrane proton-transporter parents inherited from the cytochrome bc1 archetype which are false for the NapC/NirT/NrfH family. That is a change to an existing term, so it now also exists as two structured proposed_ontology_changes entries and is picked up by export-ontology-changes as an open upstream request. Verified against GO on 2026-11-15 that GO:0015078 and GO:0015453 are asserted parents, and recorded that GO:0022853 is a third asserted transporter parent not inherited through GO:0015078. No change_dsl is given because KGCL models removal of a subClassOf edge as RemoveUnder, which OntologyChangeTypeEnum does not carry, so the nearest available EDGE_DELETION is used and the mismatch is explained in the justification rather than papered over; the exporter renders the DSL itself. The existing new-term proposal is retained as the alternative fix.
