  summary: Correct GO:0008121 ontology reasoning and related review-feedback fixes
    for imcH
  details: |
    Addressed PR #5640 review. (1) The GO:0008121 row had claimed the term is not an ancestor or descendant of the GO:0009055 row; verified against QuickGO that GO:0008121 is_a GO:0009055, removed the false claim, and marked the GO:0009055 IBA row TOO_GENERAL with a propagation_review instead of ACCEPT. (2) Collapsed the two redundant core_functions entries into one at GO:0008121. (3) Recorded that GO:0008121 is_a GO:0015078 proton transmembrane transporter activity, which contradicts the measured electroneutrality of ImcH; kept the term as the only one naming both donor and acceptor (GO:0016681 obsolete) and recorded the mismatch in the row reason, a new suggested_questions entry and a new proposed_new_terms entry for an electroneutral menaquinol:cytochrome c oxidoreductase activity under GO:0016679. (4) Reordered GO:0008121 and core_function supporting quotes to lead with the paper's own results rather than its restatement of the prior model. (5) Fixed source_defects asserted_value to the heme count 4 with slot CC:PTM and corrected_value 7. (6) Split the pmf framing into membrane-potential and pH-gradient components in description, findings, suggested_questions and suggested_experiments. (7) Added explicit reasons for declining GO:0005887 and GO:0048038.
