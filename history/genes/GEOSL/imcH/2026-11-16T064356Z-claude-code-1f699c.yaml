  summary: Withdraw the GO:0008121 edge-deletion request after checking the term's
    EC cross-reference
  details: |
    Review on PR 6413 asked whether GO:0008121 is cross-referenced to a translocase EC number, noting that if it is, the transporter parentage is the term's identity and an edge-deletion request would be closed upstream. Checked against QuickGO: GO:0008121 carries xrefs EC:7.1.1.8, RHEA:11484, MetaCyc:RXN-15816 and Reactome:R-HSA-164651, and EC class 7 is the translocases, created for vectorial reactions. Its definition opens 'Enables the transfer of a solute or solutes from one side of a membrane to the other according to the reaction: a quinol + 2 Fe(III)-cytochrome c = a quinone + 2 Fe(II)-cytochrome c + 2 H+(out).' The transporter parents are therefore correct for the term as defined rather than an accident inherited from the cytochrome bc1 archetype, and deleting them would leave the term contradicting its own definition and both reaction cross-references.

    The two EDGE_DELETION entries proposing exactly that are removed, and with them the whole proposed_ontology_changes block. Neither had been filed upstream, so nothing needs retracting externally. The reasoning is preserved rather than deleted: the suggested question is rewritten to ask what the electroneutral NapC/NirT/NrfH-family members should use instead of GO:0008121, and records that the edge-deletion framing was tried and withdrawn with the evidence that refuted it. The GO:0008121 annotation row's own reason now carries the EC and Rhea finding and the conclusion that the only coherent fix is a separate electroneutral term, which this review already requests in proposed_new_terms.

    The annotation itself is unchanged and remains a NEW IDA row. Its reasoning did not depend on the parentage being wrong: it asserts the term because it is the only one naming both the quinol donor and the cytochrome c acceptor, states that the transporter entailment is false for ImcH, and flags a derived GO:1902600 row as a future over-annotation, matching the resolution already reached for the family member CymA. This also resolves two further review points in passing: GO:0022853, noted in the withdrawn entry as a third transporter parent needing removal, no longer needs its own record because no edge deletion is being requested, and the objection that three edge deletions would leave the term's transporter definition standing is answered by not requesting them.
