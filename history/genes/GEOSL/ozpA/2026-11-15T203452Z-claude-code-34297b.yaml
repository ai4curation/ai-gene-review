  summary: Create ai-gene-review for Geobacter sulfurreducens OzpA (Q74BG6)
  details: |
    Reviewed all 5 GOA rows, every one of which comes from the subtilisin S8 domain signature and would read the same for any S8 protease in any organism. Accepted both GO:0004252 rows, GO:0008236 and GO:0006508; marked GO:0008233 peptidase activity TOO_GENERAL as the one term that is imprecise on its own, following the 2026-11-14 ruling that keeps respectably specific terms such as serine-type peptidase activity. Added GO:0016485 protein processing as IDA, the one characterised role GOA records nothing of: purified OzpA cuts OmcZ50 to OmcZ30, which then self-assembles. Deliberately declined any extracellular electron transfer or current-production term despite the knockout abolishing current, because OzpA transfers no electrons and necessity is not participation, and declined protein polymerization because OmcZ polymerises while OzpA only removes the block. No cellular-component row proposed: the signal peptide and the supernatant activity agree only that OzpA is exported and do not discriminate surface attachment from release, which GO:0005576 turns on.
