  summary: Verify the GO:0005576 reasoning and state what the published fractionation
    already settles
  details: |
    Two review points on PR 6413, one answered with evidence and one accepted.

    Answered: the review declines a cellular-component row partly because GO:0005576 is reserved for products not attached to the cell surface, and review suggested that was the wrong reason, on the understanding that GO:0005576 is the broad root used for bacterial secreted proteins regardless of surface association. Checked against QuickGO: GO:0005576 carries the comment 'Note that this term is intended to annotate gene products that are not attached to the cell surface. For gene products at the cell surface, consider annotating to external side of plasma membrane ; GO:0009897.' The stated reason therefore stands and the row stays declined. Recorded in the notes with the date of the check.

    Accepted: the wording understated the published evidence. PMID:33837010 compared the culture supernatant, the loosely bound outer surface and the intracellular fractions and found OmcZL-cleaving activity in the supernatant alone, which excludes an intracellular location and a loosely attached surface one; the review said the signal peptide and supernatant activity 'agree only that it is exported'. The suggested question now says what the comparison excludes and what remains open, which is narrower: activity in a fraction is not protein in a fraction, since a small released pool could account for all the activity, and a tightly attached surface protein would not shear into a loosely bound fraction either. The first suggested experiment partly restated published work and is rewritten to say it repeats that fractionation following the protein rather than the activity, and to foreground the step the published assay could not perform, a protease-accessibility test on intact cells.

    Also checked, and no change made: review raised a parity concern that GO:0008233 peptidase activity is marked TOO_GENERAL while GO:0006508 proteolysis is accepted, the two sitting at comparable levels of abstraction in their aspects. A corpus count settles it as deliberate convention rather than inconsistency. Across all gene reviews GO:0006508 is ACCEPT in 153 of 327 rows and TOO_GENERAL in 3, while GO:0008233 is MODIFY in 99 of 182, TOO_GENERAL in 22 and ACCEPT in 33. MODIFY, the dominant treatment of GO:0008233, is unavailable for this row because its evidence is an IEA from GO_REF:0000117, an ARBA association rule, which the project's own guidance treats as an unvetted prediction that cannot reach the deeper term. TOO_GENERAL on the term with ACCEPT on proteolysis is therefore both defensible and in line with how the corpus treats each term.
