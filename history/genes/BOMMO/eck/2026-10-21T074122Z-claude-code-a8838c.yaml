  summary: 'Create review: eck (BmEc22K, ecdysteroid 22-kinase)'
  details: |
    De-novo review of B. mori eck/BmEc22K (Q0PCR8) as the experimentally characterised EcKL reference relative of DROME/CG31099, independent of ProtNLM2 predictions. Falcon deep research failed (auth; perplexity fallback 401), so the review was built from cached literature (PMID:16899460, 18828659, 19456376, 19524123, 38291829, 39208453). Accepted the sole GOA IDA (GO:0106389 ecdysteroid 22-kinase activity). Added NEW GO:0045455 ecdysteroid metabolic process (eck catalyses the step) and NEW GO:0005829 cytosol (enzyme purified from ovary cytosol). Recorded EcKL subfamily A / PTHR11012:SF54 placement and that AgEcK2 (subfamily D) and CG31099 (SF6) lie in other subfamilies, so the 22-kinase function should not be transferred across subfamilies. Added a motif-scan bioinformatics script (Brenner motif 236-243).
