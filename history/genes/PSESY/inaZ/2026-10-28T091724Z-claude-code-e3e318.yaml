  summary: 'Correct the notes'' provenance claim for GO:0019833: the MF aspect has
    a committed enum-cache anchor'
  details: |
    Non-blocking correction on an approved PR 5645. The two earlier records for
    this gene are left untouched; this record carries the correction to the
    wording of the second one.

    inaZ-notes.md over-conceded the provenance of the GO:0019833 claim. Its
    "In-repo anchors" section said that the term's aspect (molecular function
    under GO:0050825 ice binding) and its definition text both "rest on the live
    OLS/QuickGO lookups of 2026-10-28 and left no cached artifact". The aspect
    does have a committed in-repo artifact behind it. Verified in this session:
    cache/enums/gomolecularactivityenum_d457a56b08d3.csv, the committed expansion
    of the molecular-function dynamic enum (10,130 CURIEs plus header), lists
    GO:0019833 at line 3435 and GO:0050825 at line 7271; and
    src/ai_gene_review/schema/gene_review.yaml binds
    core_functions.molecular_function.id to that same GOMolecularActivityEnum
    (reachable_from GO:0003674, obligation_level REQUIRED). The enum caches are
    the term-validator's own dynamic-enum caches, as documented in
    src/ai_gene_review/tools/cache_lint.py. So the molecular-function aspect of
    both terms is checkable from a repository file, and a wrong-branch term in
    that slot is a blocking validation error rather than something only a live
    lookup would catch.

    The notes section now records the enum cache and the schema binding as a
    second in-repo anchor beside cache/go/terms.csv line 4483, and confines the
    "no cached artifact" statement to what it is actually true of: the term's
    definition *wording* quoted in suggested_questions, which came from the live
    OLS lookup of 2026-10-28.

    Correction to this gene's record 2026-10-28T011233Z-claude-code-366e3d, which
    states that the GO:0019833 "aspect, definition text" claims "still rest on
    the live OLS and QuickGO lookups with no cached artifact". That is accurate
    for the definition text and wrong for the aspect, for the reason above. The
    earlier record is append-only and was not edited; this entry supersedes that
    sentence.

    No change to inaZ-ai-review.yaml: no action, term, supporting_text,
    reference_review or source_defect was touched, and the TCDB propagation
    evidence stays in review.reason rather than supported_by (it is evidence that
    the curation gap is real, not evidence that the protein nucleates ice).

    Validation: just backfill-record-sections genes/PSESY/inaZ (updated 0 of 1
    files), just validate PSESY inaZ (valid; the 2 warnings are UV_NATIVE_TLS
    environment noise), just render PSESY inaZ (the HTML diff is confined to the
    rewritten notes bullet).
