  summary: Correct the notes' provenance claim for the GO:0019833 is_a edge, and add
    the enables qualifier
  details: |
    Second non-blocking correction on approved PR 5645, in one commit. The three
    earlier records for this gene are append-only and were not touched.

    1. inaZ-notes.md, "In-repo anchors for the GO:0019833 claim". The previous
    commit (b5650de) corrected an under-claim about the molecular-function aspect
    but over-extended in the other direction, ending the third bullet: "What does
    rest on the live OLS lookup of 2026-10-28, and left no cached artifact, is
    *only* the term's definition wording quoted in suggested_questions." The word
    "only" was one claim too strong, because the term's placement under GO:0050825
    ice binding has no repository anchor either.

    Verified in this session:
      - cache/enums/gomolecularactivityenum_d457a56b08d3.csv has the single column
        header "curie". It is a flat list of molecular-function-branch-reachable
        CURIEs, not an edge list, so GO:0019833 (line 3435) and GO:0050825
        (line 7271) both appearing in it establishes that each is *a* molecular
        function and nothing about one being the other's parent.
      - cache/go/terms.csv carries GO:0019833 (line 4483) but not GO:0050825.
      - cache/ontologies/go.tsv (term_id/label/is_obsolete/fetched_date) carries
        neither term.
      - `rg --no-ignore --hidden -l is_a cache/` returns zero files: there is no
        is_a edge artifact anywhere under cache/, so no parentage claim about any
        term has a repository anchor.

    The bullet now makes three separate statements, each accurate: the
    molecular-function aspect is anchored in the enum cache plus the schema binding
    (and a wrong-branch term in that slot is still a blocking validation error);
    the id's existence and non-obsolete label are anchored in cache/go/terms.csv;
    and the is_a edge to GO:0050825, GO:0050825's own label "ice binding", and the
    definition wording quoted in suggested_questions are anchored nowhere and rest
    on the live OLS lookup of 2026-10-28. The notes record why that matters rather
    than treating it as pedantry: the placement is asserted in the review's reason
    text for the GO:0019833 row and the ontology-feedback item in
    suggested_questions argues precisely that the "Catalysis of..." definition
    wording conflicts with it, so the placement is load-bearing and needs the same
    provenance label as the wording. The notes passage at line 113 already credited
    OLS for the parentage, so the file is now internally consistent.

    2. inaZ-ai-review.yaml, one field added: `qualifier: enables` on the GO:0019833
    NEW row, which previously carried no qualifier while the GO:0009279 row in the
    same file carries located_in. Both grounds were checked rather than assumed.
    `enables` is a permissible value of AnnotationQualifierEnum, the range of the
    qualifier slot, and is the enum's designated molecular-function qualifier for a
    gene product that independently has the activity (as opposed to
    contributes_to), which is correct here: InaZ itself presents the templating
    surface. On the corpus snapshot at 902831c, 7207 of 9348 genes/*/*/*-ai-review.yaml
    files contain `qualifier: enables` (89066 occurrences), so it is the corpus
    convention for a molecular-function row by a wide margin. Adding the qualifier
    also makes this first-ever annotation of GO:0019833 directly usable as a GAF
    row. Nothing else in the YAML changed: no action, term, evidence_type,
    supporting_text, reference_review or source_defect was touched, and the four
    wrapped quotes are byte-unchanged.

    Validation: just backfill-record-sections genes/PSESY/inaZ (updated 0 of 1
    files), just validate PSESY inaZ (valid; the 2 warnings are UV_NATIVE_TLS
    environment noise), just render PSESY inaZ. The HTML diff is confined to the
    rewritten notes bullet and the one added qualifier line in the appended YAML
    block. cache/* and uv.lock were dirtied by tooling and reverted; no
    publications file was modified.
