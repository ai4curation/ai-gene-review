  summary: Create gene review for Pseudomonas syringae inaZ ice nucleation protein
    (P06620)
  details: |
    Reviewed the single existing GOA row (GO:0009279 cell outer membrane, IEA/GO_REF:0000120) as ACCEPT, grounding it on the marker-controlled fractionation in PMID:2520825 and the envelope localization in PMID:9698431 rather than on the InterPro signature alone. Added one NEW molecular function row, GO:0019833 ice nucleation activity (IDA, PMID:9698431), after verifying via OLS that the term is current and via QuickGO that it carries no annotations in any species, an absence explained by the term having been reinstated from obsolete rather than by a curation convention. Recorded the core function at the outer membrane with a knowledge gap on the stoichiometry of the functional ice nucleus, raised the GO:0019833 definition wording (catalysis language, lineage-specific teleology) as a question for GO, and wrote inaZ-notes.md including an assessment of the CMMMech anatase record's use of this protein as a surface-display anchor.
