  summary: Strengthen the GO:0019833 NEW row's evidence and reconcile the two InaZ
    membrane-interaction models
  details: |
    Correction session answering the CHANGES_REQUESTED review on PR 5645. The
    earlier CREATE record for this gene is left untouched.

    GO:0019833 NEW row (existing_annotations). The row's evidence statement was
    weaker than the cached text allows, which matters because this would be the
    first annotation of GO:0019833 anywhere in GO. Two additive fixes, no change
    of action:
      - Added the decisive IDA sentence from PMID:9698431 as the primary
        supporting_text ("Ice nucleation protein was partially purified from the
        membrane fraction of E. coli carrying inaZ from Pseudomonas syringae."),
        which is what ties a measured ice nucleation activity to the inaZ
        product. Previously the only quote from that paper was the phospholipase
        C / phosphatidylethanolamine sentence, i.e. about lipid reconstitution
        rather than about ice nucleation by this protein.
      - Softened the review.reason clause that credited the phospholipase C
        abolition and phosphatidylethanolamine restoration with excluding a
        contaminating nucleant. It does not: a co-purifying lipid-dependent
        nucleant in a partially purified membrane preparation would behave
        identically. The reason now says the control shows lipid dependence, and
        attributes exclusion of a contaminant to the heterologous gain of
        function, with PMID:2520825's verbatim conclusion added as support
        ("Therefore, the iceC gene product is located at and is maximally active
        in or on the outer membrane of cells of the source strain and
        heterologous strains.").
    Also recorded the two in-repo anchors for the gap argument in the same
    reason: cache/go/terms.csv line 4483 (id present, non-obsolete, fetched
    2026-07-26) and projects/TCDB/data/propagation_evidence.tsv line 195, an
    independent analysis flagging 9.B.133.1.1 / GO:0019833 / P06620 as a
    GAP_CANDIDATE.

    core_functions and references. The core function cited PMID:8355267's
    two-faced model (one face of the repeat region contacts the membrane) behind
    a sentence asserting an N-terminal anchor, which is PMID:33608518's separate
    architecture. The description now states that the two models differ and that
    the anchor reading follows PMID:33608518, with that paper's own hedged
    sentence added as support ("At cell surfaces, based on current models, InaZ
    is anchored through its N-terminal domain"). PMID:8355267's reference_review
    note records the divergence rather than implying the models agree.

    Notes file. Recorded Green & Warren 1985 (Nature 317:645-648), UniProt
    reference [1], as the founding inaZ paper, together with the reason it is
    not added to references: UniProt's RN [1] block carries no PubMed or DOI
    cross-reference and PubMed E-utilities searches return no hits, so it cannot
    be cached and no quote from it could validate. No identifier was invented
    for it. The same section records the in-repo anchors above and states which
    GO:0019833 claims (aspect, definition text) still rest on the live OLS and
    QuickGO lookups with no cached artifact.

    Validation: just backfill-record-sections (no changes), just validate PSESY
    inaZ (valid, warnings are environment noise only), just render PSESY inaZ.
