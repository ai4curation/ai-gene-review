  summary: 'Fix obsolete GO term on NEW row: MSP1'
  details: |
    Corrected an obsolete GO term asserted on a manually added NEW row (issue #6783).
    The row used GO:0031362 anchored component of external side of plasma membrane, obsoleted by
    GO on 2022-08-26 "because it represents protein topology, not a cellular component", with
    replaced_by GO:0009897 external side of plasma membrane. Verified against the QuickGO term
    history for GO:0031362 on 2026-11-23 (the returned id was GO:0031362 itself, not a silently
    resolved merge target). Validation did not catch it because existing_annotations[].term.id is
    deliberately not hard-validated, and the row still carried the pre-obsoletion label.
    Decision: kept the row and swapped the term to GO:0009897, rather than dropping it. The
    replacement is weaker (outer leaflet only, no anchoring topology) but still non-redundant here:
    MSP1's GOA carries only GO:0005886 plasma membrane across seven rows and no sidedness term, and
    GO:0009897 is a part_of descendant of GO:0005886, so the row continues to add the one fact those
    rows omit. This differs from the comparable merge in PR #6268, where the replacement restated a
    term the gene already carried and the row was dropped.
    The GPI-anchoring topology that the obsoletion removes from the component hierarchy is no longer
    asserted as an annotation; it is retained in prose in the reason of the PMID:8992312 GO:0005886
    row, in the reason of the new GO:0009897 row, and in the notes, supported by PMID:8992312 and
    PMID:18769730. Also updated the PMID:8992312 reference_review note that described the row by its
    old term, and added a dated correction section to MSP1-notes.md. No evidence, supporting_text
    quote or reference was changed; core_functions was unaffected (all three already use GO:0005886
    as their location). just validate PLAF7 MSP1 passes with only pre-existing environment warnings.
