  summary: 'Create review: MSP1'
  details: |
    Manual curation of the full GOA set for P. falciparum MSP1 (Q8I0U8); automated deep research was unavailable in this environment (Falcon auth failure, invalid OpenAI key), so the review rests on a manual literature review recorded in MSP1-notes.md, built from the UniProt record and the cached publications plus six additional PMIDs fetched into publications/. All 22 existing annotations were reviewed with no PENDING left and no REMOVE: the seven GO:0005886 plasma membrane rows and the two GO:0005774 vacuolar (food vacuole) membrane rows were accepted, the eight GO:0005576 extracellular region rows kept as non-core (the shed complex), the four bare GO:0005515 rows kept as non-core per project policy with partners named, GO:0016020 membrane (InterPro IEA) marked TOO_GENERAL, and GO:0085017 entry into host cell by a symbiont-containing vacuole accepted as core. Seven NEW rows were added for functions absent from GOA: GO:0031362, GO:0046789, GO:0030507 spectrin binding, GO:0140378 protein complex scaffold activity, GO:0035891 exit from host cell, GO:0052039 and GO:0052170. Three core functions were written (spectrin-binding egress role, host receptor adhesion, surface-coat scaffold), plus one proposed new term (food vacuole membrane, which GO lacks), three expert questions and three suggested experiments.
