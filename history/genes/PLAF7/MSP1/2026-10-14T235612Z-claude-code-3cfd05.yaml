  summary: 'Create review: MSP1'
  details: |
    Manual curation of the full GOA set for P. falciparum MSP1 (Q8I0U8); automated deep research was unavailable in this environment (Falcon auth failure, invalid OpenAI key), so the review rests on a manual literature review recorded in MSP1-notes.md, built from the UniProt record and the cached publications plus six additional PMIDs fetched into publications/. All 22 existing annotations were reviewed with no PENDING left and no REMOVE: the seven GO:0005886 plasma membrane rows accepted as the core location, GO:0085017 entry into host cell by a symbiont-containing vacuole accepted as core, the eight GO:0005576 extracellular region rows and the two GO:0005774 vacuolar membrane rows kept as non-core, and GO:0016020 membrane (InterPro IEA) marked TOO_GENERAL. All four bare GO:0005515 protein binding rows were MODIFYed to evidence-backed functions: GO:0140378 protein complex scaffold activity (RhopH3/RAP1/CLAG9 and MSPDBL1 rows), GO:0046789 host cell surface receptor binding (band 3 5ABC row) and GO:0044548 S100 protein binding (host S100P row). The GO:0005774 rows were deliberately held at non-core: the localisation is directly observed but represents the post-invasion endocytic fate of the GPI-anchored p19 remnant, with any functional role flagged Probable by UniProt, so the previously proposed new term 'food vacuole membrane' was dropped. Three NEW rows remain, each passing the participation test: GO:0031362 (GPI-anchored on the external face of the plasma membrane), GO:0030507 spectrin binding and GO:0035891 exit from host cell. Candidate NEW rows for GO:0052170 (host innate immune suppression, single in vitro study) and GO:0052039 (host cytoskeleton perturbation, inferred not measured) were dropped and recorded as suggested_questions instead. Three core functions were written (spectrin-binding egress role, host receptor adhesion, surface-coat scaffold), with four expert questions and three suggested experiments.
