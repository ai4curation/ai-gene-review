  summary: 'Create review: AMA1'
  details: |
    Created the first full review of Plasmodium falciparum apical membrane antigen 1 (AMA1, PF3D7_1133400, UniProt Q7KQK5) from a manual literature review, because automated deep research was unavailable in this environment (no -deep-research file was written); notes with inline provenance are in AMA1-notes.md. All seven GOA rows were adjudicated: the two bare protein-binding IPI rows (RON4, RON2) were MODIFIED to host cell surface binding, since the RON complex is inserted into the erythrocyte membrane before AMA1 engages it; the IEA membrane row was MODIFIED to plasma membrane and the 1989 TAS apical complex row to microneme, the specific compartments the later immuno-EM work supports; the IDA microneme, IMP symbiont entry into host and IDA host cell surface binding rows were ACCEPTED, with a note that the attachment experiments behind the last were done in P. berghei and T. gondii and that the conclusion of PMID:24108241 is disputed by the P. falciparum conditional knockdown. Two core functions were recorded (RON2 capture at the erythrocyte surface, and merozoite entry into the erythrocyte), plus a proposed new cellular component term for the apicomplexan moving (tight) junction, which GO currently lacks. Validation passes.
