  summary: 'Create review: HAP2'
  details: |
    Manual literature review of Plasmodium falciparum HAP2/GCS1 (PF3D7_1014200, UniProt Q8IJQ3) replacing automated deep research, which was unavailable in this environment; primary papers were fetched into publications/ and read directly. The two GOA rows were reviewed: GO:0005886 plasma membrane (IEA) ACCEPT, corroborated by GFP tagging and surface immunofluorescence on non-permeabilized microgametes; GO:0005783 endoplasmic reticulum (IBA from PTN000788722) KEEP_AS_NON_CORE as a sound but biosynthetic-transit propagation with no Plasmodium-specific data. Two NEW annotations were added from Kumar et al. 2022 (PMID:36241929): GO:0140522 fusogenic activity (IDA, BHK cell-cell fusion) and GO:0009566 fertilization (IMP, knockout abolishes zygotes and oocysts with male-restricted sterility in genetic crosses); the taxon-neutral fertilization term was chosen over GO:0007342, whose multicellular-organism parentage does not fit a protist, and that mismatch was raised as a suggested question. A single core function (gamete fusogen at the microgamete plasma membrane) was recorded, with questions and experiments on fusion directionality and the PfHAP2p paralog. Follow-up on PR #5028 review-bot findings: four reference findings whose supporting_text had been clipped at source line-wrap boundaries (PMID:18403203, PMID:29212032, PMID:41498187, PMID:24042109) were re-quoted as complete verbatim sentences from the cached publications, and the PfHAP2 domain-3 structure statement was trimmed to the PDB id since the cached text gives no residue range.
