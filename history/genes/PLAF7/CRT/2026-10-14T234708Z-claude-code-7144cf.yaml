  summary: 'Create review: CRT'
  details: |
    Manual literature review of Plasmodium falciparum PfCRT (Q8IBZ9) since automated deep research was unavailable: read the UniProt record and all cached publications, and fetched five further primary papers (PMID:25733858, PMID:26420308, PMID:31776516, PMID:32764664, PMID:35507548) into publications/ so quotes could be verbatim. All twelve GOA rows were reviewed: food vacuole and vacuolar membrane accepted as the core location; endoplasmic reticulum kept as non-core biosynthetic transit; generic membrane marked TOO_GENERAL; the generic transmembrane transporter IBA modified to oligopeptide transmembrane transporter activity and the inferred transmembrane transport process modified to peptide transport; both glutathione transport rows (plant-CLT-seeded IBA and the mutant-allele oocyte IDA) marked as over-annotation in light of the in-situ substrate screen in PMID:32764664; the xenobiotic transport and xenobiotic transmembrane transporter activity rows kept as non-core, allele-dependent capabilities. Two NEW rows (GO:0035673, GO:0015833) and a single core function capture proton-dependent export of host-haemoglobin-derived 4-11-residue peptides from the digestive vacuole, with a knowledge gap for the unidentified co-substrate, a proposed food vacuole membrane term, notes in CRT-notes.md, and clean just validate. Follow-up on PR #5028 review-bot findings: supporting_text quotes were re-anchored so each states the claim it backs — GO:0016020 membrane and GO:0009410 response to xenobiotic stimulus now quote the integral-membrane and predicted chloroquine-efflux sentences of PMID:15240840 instead of its drug/metabolite-transporter family assignment, the PMID:25378409 quinine/quinidine/verapamil quote was completed, GO:0005774 vacuolar membrane now quotes the full threonine-416 sentence naming the digestive vacuolar membrane, and the GO:0005783 endoplasmic reticulum supported_by entry was removed because no cached publication mentions the ER (the KEEP_AS_NON_CORE action is unchanged).
