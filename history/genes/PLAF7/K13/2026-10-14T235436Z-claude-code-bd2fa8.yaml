  summary: 'Create review: K13'
  details: |
    Manual curation of Plasmodium falciparum Kelch13 (PF3D7_1343700, UniProt Q8IDQ2). Automated deep research was unavailable in this environment, so the review rests on a manual literature review recorded in K13-notes.md: the UniProt flat file, the GOA-cited papers, and additional primary papers whose PMIDs were verified through PubMed before caching (Straimer 2015, Birnbaum 2020, Gnaedig 2020, Sharma 2022, Schmidt 2023, Behrens 2024). All three GOA rows were adjudicated: the GO:0005515 protein-binding IPI with PfPI3K was REMOVEd as uninformative while accepting the interaction itself, since the KEAP1-analogy E3-adaptor reading is not corroborated and no supportable molecular function exists to modify to; GO:0009410 response to xenobiotic stimulus was MARK_AS_OVER_ANNOTATED because artemisinin resistance is a loss of Kelch13 activity reducing drug activation rather than an induced xenobiotic response; GO:0051260 protein homooligomerization was KEEP_AS_NON_CORE, corroborated by crystal dimers and a SAXS hexamer. Two NEW annotations were added for the function the literature converges on, GO:0006897 endocytosis and GO:0044002 acquisition of nutrients from host, and a single core function describes Kelch13-dependent uptake of host erythrocyte cytosol at the cytostome-adjacent Kelch13 compartment. Two new terms are proposed: cytostome-mediated endocytosis of host cell cytosol, and a Kelch13 compartment cellular component.
