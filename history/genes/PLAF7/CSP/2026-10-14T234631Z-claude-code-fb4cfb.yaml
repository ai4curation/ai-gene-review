  summary: 'Create review: CSP'
  details: |
    Manual curation of the full GOA set for P. falciparum CSP (Q7K740, PF3D7_0304600): all 11 seeded annotations reviewed with no PENDING left. Automated deep research was unavailable in this environment, so CSP-notes.md records a manual literature review of the cached UniProt record and the five cited publications instead of a *-deep-research-*.md file. Calls: the three plasma membrane rows (IDA/IEA/ISS), cell surface (InterPro2GO), heparan sulfate proteoglycan binding (IDA, PMID:8478608), host cell surface binding (IDA), symbiont entry into host (IDA, PMID:12244064) and both entry-into-host-cell-by-a-symbiont-containing-vacuole rows (IMP, PMID:29554084 and PMID:32150583) were ACCEPTed; the two cytoplasm rows were kept as non-core because that localisation is a transient oocyst-stage biosynthetic stage rather than the functional site. No REMOVE or MODIFY was warranted. Two NEW annotations were proposed: GO:0044650 adhesion of symbiont to host cell and GO:0071976 cell gliding, each with a participation argument (CSP is itself the adhesin) and a comparator check against other P. falciparum invasion adhesins. Three core functions (HSPG binding, host cell surface engagement, adhesion-driven motility and invasion), two knowledge gaps, four suggested questions and three suggested experiments were added. Protist-specific checks found no animal/plant term mis-transfers, no organelle mismatch and correct symbiont/host term direction.
