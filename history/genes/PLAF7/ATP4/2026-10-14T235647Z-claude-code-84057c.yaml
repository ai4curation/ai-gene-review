  summary: 'Create review: ATP4'
  details: |
    Manual curation of the PfATP4 (PF3D7_1211900, A0A143ZZK9) GO annotation set. Automated deep research was unavailable in this environment, so the review rests on a manual literature review recorded in ATP4-notes.md, drawing on the UniProt Swiss-Prot record and the cached full texts of Spillman 2013 (PMID:23414762), Rosling 2018 (PMID:29986883), Qiu 2022 (PMID:36180431), Dennis 2018 (PMID:29555632) and the newly fetched 2025 cryo-EM paper (PMID:41115914). All 16 seeded annotations were reviewed: the P-type sodium transporter activity (IBA, IEA/EC) and plasma membrane (IBA, IEA) rows were accepted as the core function and location; the potassium annotations (GO:0008556, GO:0006813, GO:0071805) and intracellular calcium ion homeostasis (GO:0006874) were removed, since the cipargamin-sensitive PfATP4-associated ATPase activity is unaffected by K+ across 0-150 mM and insensitive to Ca2+, and the Ca2+-ATPase assignment was never confirmed (UniProt CAUTION); the general transport rows (GO:0006814, GO:0034220 x2, GO:0035725) were modified to GO:0036376 sodium ion export across plasma membrane, GO:0016020 to plasma membrane, GO:0000166 to ATP binding and GO:0016887 to GO:0008554. Two NEW rows were added (GO:0036376 and GO:0006883 intracellular sodium ion homeostasis), one core function was recorded, and knowledge gaps were logged for the unknown counter-ion and the role of the apicomplexan-specific partner PfABP.
