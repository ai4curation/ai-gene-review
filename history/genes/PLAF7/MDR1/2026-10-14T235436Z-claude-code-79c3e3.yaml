  summary: 'Create review: MDR1'
  details: |
    Curated the full GO annotation set for PfMDR1 (Q7K6A5, PF3D7_0523000), the digestive-vacuole ABC transporter of Plasmodium falciparum. Automated deep research was unavailable in this environment (Falcon auth failure, invalid OpenAI key), so no deep-research file was generated; instead a manual literature review was written to MDR1-notes.md from the UniProt record and the cached primary papers (PMID:1674943, PMID:8097560, PMID:10706290, PMID:35507548, PMID:37527341, the last two newly cached). All 14 GOA rows were reviewed with no removals: 5 ACCEPT (ATP binding, ATP hydrolysis activity, ABC-type xenobiotic transporter activity, vacuolar membrane, food vacuole) and 9 MODIFY, all refinements to supported descendants - membrane and cytoplasm to vacuolar membrane, ABC-type transporter activity and ATPase-coupled transmembrane transporter activity to ABC-type xenobiotic transporter activity, and transmembrane transport, xenobiotic transport and response to xenobiotic stimulus to GO:0006855 xenobiotic transmembrane transport. The three IBA rows carry propagation_review blocks recording that the ABCB ancestral node placement is sound and only the term granularity was at issue. A single core function was synthesised (ATP-driven import of amphipathic xenobiotics from the parasite cytosol into the food vacuole lumen), with knowledge gaps on the unknown endogenous substrate and on untested essentiality, plus a proposed new cellular-component term 'food vacuole membrane'.
