  summary: 'Create review: RH5'
  details: |
    Curated the full GO annotation set for Plasmodium falciparum RH5 (Q8IFM5, PF3D7_0424100) from scratch. Automated deep research was unavailable in this environment (Falcon auth failure, invalid OpenAI key), so the review rests on a manual literature review recorded in RH5-notes.md, drawing on the UniProt record and the sixteen cached primary publications, with every GO id checked in OLS. All 50 GOA rows were reviewed: the core molecular function is host cell surface receptor binding (GO:0046789) to erythrocyte basigin, with adhesion of symbiont to host cell and symbiont entry into host cell as the core processes, and rhoptry lumen, host extracellular region and host cell plasma membrane as locations. Key calls: GO:0005923 bicellular tight junction was REMOVEd as an animal epithelial term imported on the word 'tight junction', which in this literature denotes the apicomplexan moving junction; the seven GO:0044409 symbiont entry into host rows were MODIFYed to the descendant GO:0046718 that the gene already carries; GO:0033644 host cell membrane was MODIFYed to GO:0020002 host cell plasma membrane; the seven protein-binding rows naming basigin were MODIFYed to GO:0046789, while the nine naming the parasite partners CyRPA, PfRipr and P113 were kept as non-core; GO:0032991 was MODIFYed to a proposed new term for the RH5-CyRPA-Ripr invasion complex; heparin binding was kept as a non-core in vitro property. One NEW annotation was added, GO:0141134, for the RH5-basigin agonism that triggers host erythrocyte calcium signalling. Validation passes with no errors.
