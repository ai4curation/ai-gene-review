  summary: 'Create review: RH5'
  details: |
    Curated the full GO annotation set for Plasmodium falciparum RH5 (Q8IFM5, PF3D7_0424100) from scratch. Automated deep research was unavailable in this environment (Falcon auth failure, invalid OpenAI key), so the review rests on a manual literature review recorded in RH5-notes.md, drawing on the UniProt record and the sixteen cached primary publications, with every GO id checked in OLS. All 50 GOA rows were reviewed: the core molecular function is host cell surface receptor binding (GO:0046789) to erythrocyte basigin, with adhesion of symbiont to host cell and symbiont entry into host cell as the core processes, and rhoptry lumen, host extracellular region and host cell plasma membrane as locations. Key calls: GO:0005923 bicellular tight junction was REMOVEd as an animal epithelial term imported on the word 'tight junction', which in this literature denotes the apicomplexan moving junction; the seven GO:0044409 symbiont entry into host rows were MODIFYed to the descendant GO:0046718 that the gene already carries; GO:0033644 host cell membrane was MODIFYed to GO:0020002 host cell plasma membrane; the seven protein-binding rows naming basigin were MODIFYed to GO:0046789, while the nine naming the parasite partners CyRPA, PfRipr and P113 were kept as non-core; GO:0032991 was MODIFYed to a proposed new term for the RH5-CyRPA-Ripr invasion complex; heparin binding was kept as a non-core in vitro property. One NEW annotation was added, GO:0141134, for the RH5-basigin agonism that triggers host erythrocyte calcium signalling. In follow-up to a review-bot finding on PR #5028, the invasion process anchor was revised again: OLS confirms GO:0085017 entry into host cell by a symbiont-containing vacuole is a descendant of both GO:0044409 and GO:0046718 and is defined as invasion that forms the vacuole in which the symbiont resides, which is exactly moving-junction merozoite invasion, so the nine GO:0044409 rows, the two EXP GO:0046718 rows and the core function were all pointed at GO:0085017, the term GOA itself uses for P. falciparum MSP1 and CSP. In a further follow-up to the same PR review, the GO:0005923 bicellular tight junction row was changed from REMOVE to MODIFY with proposed_replacement_terms [NTR moving junction], since the IDA in PMID:19000690 is a genuine localisation of RH5 to the parasite-host structure and PMID:28186186 describes the same relocation as being to the moving junction; a matching top-level proposed_new_terms entry for moving junction was added, worded consistently with the one in the PLAF7 AMA1 review, and both entries now use GO:0030054 cell junction as proposed_parent in place of GO:0110165, confirmed in OLS as a specialized region of connection between two or more cells. Validation passes with no errors.
