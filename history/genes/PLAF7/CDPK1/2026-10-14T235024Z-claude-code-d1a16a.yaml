  summary: 'Create review: CDPK1'
  details: |
    Created the de novo review for P. falciparum CDPK1 (P62344) by manual literature review (automated deep research was unavailable: Falcon auth failed and the OpenAI key was invalid). Reviewed all 71 existing annotation rows. Core calls: generic kinase terms (GO:0004672/0004674) and the IBA Ca2+/calmodulin-dependent term (GO:0004683) MODIFYed to GO:0009931 calcium-dependent protein serine/threonine kinase activity, since CDPKs carry their own calmodulin-like domain and are activated by Ca2+ alone (PMID:8142371, PMID:23204525). Removed GO:0005516 calmodulin binding (IBA; CaMK-branch property, not CDPK) and GO:0009410 response to xenobiotic stimulus (in-vitro inhibitor screening is not a biological process), and two bare protein-binding IPI rows (substrate interactions captured by the kinase core function; the third was MODIFYed to 14-3-3 protein binding). Marked nucleus (IBA) as over-annotated for this acylated membrane kinase. Accepted plasma membrane, Ca2+ kinase activity, protein phosphorylation and microneme-secretion (GO:1903307) roles; kept PV/PVM/host-membrane/cytoplasm/cilium as non-core. Added two core_functions (Ca2+ kinase; invasion/microneme effector) and fetched PMID:29311293 for gametogenesis essentiality.
