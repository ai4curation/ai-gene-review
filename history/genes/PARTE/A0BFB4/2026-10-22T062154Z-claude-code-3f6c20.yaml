  outcome: changed
  summary: 'A0BFB4: broad catalytic rows ACCEPT to TOO_GENERAL after PR #5300 review'
  details: |
    PR #5300 review found that the four broad catalytic/nucleotide rows (GO:0000166, GO:0004672, GO:0016301, GO:0016740) conceded the entailment in their own reasons and then argued for ACCEPT on the ground that the terms are not false, which is not an argument against TOO_GENERAL, and that the same PR applied the opposite convention to TETTS TERT. Changed all four to TOO_GENERAL with rewritten reasons, after verifying against QuickGO that each is a strict is_a/part_of ancestor of a term accepted in the same file (GO:0005524 for nucleotide binding, GO:0004674 for the other three). This does not reverse the earlier rounds' decision, which was against KEEP_AS_NON_CORE rather than against TOO_GENERAL. Also moved the Falcon absence statement on the GO:0004674 IBA row out of supported_by into reason and cited the report's positive Ser/Thr call instead. No other action changed; the autophagy dispositions stand.

