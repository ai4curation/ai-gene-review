  summary: 'Full re-review of A0A8B8L1Z3: SUVH-SDJ-type nuclear coactivator, not Hsp70
    cochaperone'
  details: |
    Full re-review independent of ProtNLM2 predictions. PANTHER 19.0 places A0A8B8L1Z3 in PTHR45496:SF19 with Arabidopsis EIP9/SDJ1/DNAJ1 (At5g64360, ~46% identity, similar length; not a fragment). PAINT node PTN002896004 (flowering plants) spans SF1/SF10/SF19/SF32 seeds and asserts nucleus and transcriptional activation. J domain lacks HPD (as in SDJ1), so the previous protein-folding-chaperone/cytoplasm core function and HPD claim were withdrawn. New core function: transcription coactivator activity (GO:0003713) in nucleus, positive regulation of DNA-templated transcription, based on SUVH1/SUVH3-recruited DNAJ1/SDJ transactivation (PMID:30523112, PMID:30589221). Added two NEW ISS rows (nucleus, GO:0003713); GO:0003713 chosen over PAINT's GO:0001228 because SDJs lack DNA-binding domains (raised as suggested question). Flowering time, RdDM and protein binding deliberately not transferred. Added bioinformatics RESULTS-rereview.md and compare_sequences_rereview.py; created notes file. GOA has no annotations for this accession.
