  summary: 'Create review: Ta0893 (Thermoplasma acidophilum)'
  details: |
    Reviewed T. acidophilum Ta0893 (Q9HJS1), the ATP-independent mevalonate 3,5-bisphosphate decarboxylase of the Thermoplasma-type mevalonate pathway (PMID:28004831; ortholog structure PMID:35690147). Accepted all 3 GOA rows: GO:0016831 (most specific existing MF, since GO has no term for EC 4.1.1.110), GO:0008299 and GO:0019287. Proposed the new term mevalonate 3,5-bisphosphate decarboxylase activity (RHEA:56500) as the core proposed_molecular_function and recorded a biology knowledge gap on GGPP activation. Validated with just validate (clean, term checks on) and quote_check.
