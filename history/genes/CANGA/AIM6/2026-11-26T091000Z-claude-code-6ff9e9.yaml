  summary: Record OpenScientist finding that the AIM6 phosphodiesterase barrel is
    competent and unrelated to Rtt109, and flag a conflict over the GO:0008081 action
  details: |
    Ran an OpenScientist deep-research job (kgap-aim6-fold-competence) on the gap recording that C. glabrata AIM6 has no established molecular function. It answers the question in the gap's own significance clause, whether the apparent PLC-like fold is active or whether the subfamily diverged into something non-catalytic, and the answer is competent.

    The degenerate-relic reading is excluded outright. Targeted superposition gives TM-scores of 0.618 against a Thermus thermophilus glycerophosphodiester phosphodiesterase, 0.559 against the rat PLC-delta1 catalytic barrel, 0.433 and 0.400 against two bacterial phosphodiesterases and 0.327 against a generic barrel control, but only 0.247 against Candida albicans Rtt109, which is the score two unrelated proteins give each other. So AIM6 is not a decayed version of the acetyltransferase fold at any level structure can detect, despite sharing PANTHER family PTHR31571 with Rtt109 on sequence grounds.

    The active site survives three independent tests. Carrying the crystallographic calcium from two unrelated reference structures into the AIM6 frame puts the same three carboxylates on the metal, Asp149 at 1.65 to 1.93 Angstrom, Asp232 at 2.49 to 2.95 and Glu147 at 2.60 to 3.91, reproducing the i, i+2 Glu/Asp spacing both references use; all three are confirmed in the local record, which is 411 residues. An enclosed 89 cubic Angstrom cavity sits at the barrel axis, lined by 23 residues with five acidic against two basic and a Coulomb potential of -6.16, placing AIM6 with glycerophosphodiester phosphodiesterase sites and away from the electropositive inositol-phosphate sites. And the catalytic positions are the most conserved part of the domain family-wide, 79.1 per cent identity against a 31.8 background in 150 fungal genera and 49.3 against 21.0 in 150 bacterial genera, both at permutation p = 2.0e-4.

    Location is unresolved and the run is explicit about why: every signal-peptide call across AIM6 orthologs carries sequence-analysis evidence only, an independent topology run was refused by the server, no AIM6 protein in any organism has a measured location, and SGD assigns no-biological-data to the S. cerevisiae ortholog in all three aspects. The local record's SIGNAL annotation at 1..29 is a prediction on the same footing.

    One disagreement with this review is recorded rather than resolved. The run holds that phosphoric diester hydrolase activity should be retained and is better supported than its IEA provenance suggests, offering glycerophosphodiester phosphodiesterase activity as a more specific candidate at prediction level, whereas this review marks the diester hydrolase row as over-annotated. The two positions rest on different things: the review's action reflects that no activity has ever been assayed for this protein, the run's rests on an intact and selected site. Nothing was changed, because flipping an action on one computational analysis is a curator's call and the measurement still does not exist; the conflict is recorded in the boundary and as a suggested question so it is visible at the point of decision. The run agrees with this review that the lipid metabolic process row is the weaker of the two and that no cellular-component term should be asserted.

    Gap status moved from OPEN to NARROWING. No annotation action was changed. Verified locally: the 411-residue length, Glu147, Asp149, Asp232, the PTHR31571 and AIM6 Pfam cross-references, protein-existence level 3 and the predicted SIGNAL at 1..29. Not recomputed: the TM-scores and superpositions, the metal-transfer distances, the cavity volume and electrostatics, the six-structure protocol, and the 150-genus conservation statistics.
