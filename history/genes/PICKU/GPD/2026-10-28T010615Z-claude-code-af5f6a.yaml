  summary: Record the GO:0006973 decision, scope the presequence argument, extend
    the localisation experiment and the UniRule defect evidence
  details: |
    Review follow-up on PR 5639. (1) GPD-notes.md now records why GO:0006973 intracellular accumulation of glycerol was not added as a NEW row: the only accumulation data for this protein are from a heterologous S. cerevisiae host whose osmotic machinery and Fps1 channel are not P. kudriavzevii's, no osmotic or intracellular-glycerol phenotype has been measured in the native host, and the knockout data measure glycerol in the broth rather than retained in the cell. (2) The cytosol ACCEPT reason now scopes its no-cleavable-presequence sub-argument to the reviewed 388-residue model and points at the 27-residue extension on the reference-proteome model, and the matching suggested_questions entry names mitochondrial import as the hypothesis to test, the extension MFLISKSLHFTRSFSNTIKTLNRSNIK being basic, Ser/Thr-rich and free of acidic residues. (3) The localisation experiment now scores the peroxisomal pool and a pex7 background, since PMID:20026609 shows Gpd1p is imported by an N-terminal PTS2 read by Pex7p, and asks for the two gene models to be tested separately. (4) In the UniRule source defect, the bare quote is now paired with its context so the exported report says what was deleted, and the explanation states that GpsA is EC 1.1.1.94 rather than EC 1.1.1.8, so the family-level argument runs through the shared PANTHER family PTHR11728 (GpsA, UniProtKB:P0A6S7, is among the PTN000198006 donors) and not through the EC number, which is the same open scope question the PROBABLE confidence already hedges. (5) A notes entry records that GO:0006072 is MODIFY here but ACCEPT in the merged genes/yeast/GPD1 review and that aligning the yeast review is a follow-up there. The suggested exemption for SQ-line record-identity quotes in uniprot_quote_source.py is a tooling change outside this review.
