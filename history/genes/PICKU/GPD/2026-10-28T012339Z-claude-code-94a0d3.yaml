  summary: Correct the CMMMech cross-check note on the 14.72 g/L oxalic acid titer
  details: |
    Review follow-up on PR 5639. Point 3 of the CMMMech cross-check in GPD-notes.md claimed that 14.7 g/L is the paper's running-text figure for JL02 and that 14.72 was presumably read from the source data. That premise is false: PMID:41617712 gives both numbers in the same main-text paragraph for two different fermentations, 14.7 g/L for the Fig. 2c bioreactor comparison and 14.72 g/L for the fed-batch fermentation of JL02 in SC-URA with glucose feeding. Verified against the cached publication. CMMMech therefore quotes 14.72 correctly, and acting on the original note would have made the record less accurate. The point is rewritten as the weaker and still useful observation that the record's evidence explanation pairs 14.72 with Fig. 2c, whose own number is 14.7, so only the fermentation attributed needs adjusting. Both titers are now quoted verbatim with provenance. No annotation, core function or reference call changed.
