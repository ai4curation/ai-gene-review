  details: |
    Addressed ai4c-reviewer feedback on PR #5626. Metal ion binding (GO:0046872) changed from KEEP_AS_NON_CORE to MODIFY -> manganese ion binding (GO:0030145): the UniProt record annotates four Mn(2+)-binding sites by PIRSR001594-3, and the earlier reason conceded a more specific term was supported. Magnesium ion binding not proposed (no Mg(2+) site features). Cytoplasm (GO:0005737) changed from ACCEPT to MODIFY -> cytosol (GO:0005829), since the reason argued cytosol is the supported location (yeast fractionation/immunocytochemistry, PAINT Fungi-node cytosol); core_functions location set to cytosol. Corrected the cytoplasm summary's PANTHER node from PTN001050939 (basidiomycete node) to PTN001447571, matching this gene's GOA row. Notes: recorded the PANTHER 19 tree ancestry of the TreeGrafter node (checked via PANTHER treeinfo API, 2026-10-28) and why the SF2 subfamily name 'mitochondrial' does not bear on fungal localization.
