  details: |
    Reviewed all 13 GOA rows for M. brevicollis Warts/LATS (A9UVF9, a 380-aa fragment covering mainly the kinase domain). Kinase MF and cytoplasm accepted; generic MF parents kept as non-core. Of the four PTN002390470 IBAs, organ growth removed (strictly unicellular organism), apoptosis and G1/S marked over-annotated, and hippo signaling left UNDECIDED because M. brevicollis shows predicted loss of an intact Hippo kinase and of consensus Warts sites on its Yorkie homolog (PMID:38729842). Propagation reviews added; consistent with SALRS warts. Notes file written; no deep research available.
