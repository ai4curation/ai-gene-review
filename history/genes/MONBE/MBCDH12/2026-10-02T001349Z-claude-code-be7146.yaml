    Reviewed all 9 GOA rows for M. brevicollis cadherin A9V8Y4 (MBCDH12) together with the three S. rosetta SF422 cadherins. The 5 IBA rows come from IBDs placed at the PTHR24027 root PTN008601603 (Metazoa-Choanoflagellida), of which A9V8Y4 is the only choanoflagellate leaf; beta-catenin binding and catenin complex removed (no Pfam PF01049 Cadherin_C domain), cadherin binding, cell migration and cell-cell adhesion marked over-annotated, each with a propagation_review on PTN008601603. Calcium ion binding undecided (no canonical EC calcium motifs), membrane accepted. Added MBCDH12-bioinformatics (cadherin_nodes.py, PANTHER tree/InterPro/UniProt REST) shared by the four reviews; no NEW rows; automated deep research unavailable.
