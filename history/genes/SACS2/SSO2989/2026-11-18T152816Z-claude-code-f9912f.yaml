  summary: 'Create review: SSO2989 (Saccharolobus solfataricus)'
  details: |
    Reviewed the 8 GOA rows for S. solfataricus SSO2989 (Q97UL5), a classical diphosphomevalonate decarboxylase (PMID:23378249; structures and Asp281 mechanism PMID:28003359; in-cell disulfide-linked dimer PMID:26303832). The three IBAs from PTN000104601 (GO:0004163, GO:0019287, GO:0005829) were judged sound: SSO2989 is a direct leaf of that node in the PANTHER 19 tree and has its own experimental support; no PAINT loss on the lineage. Accepted all rows except GO:0016831 (TOO_GENERAL: IPR005935 spans DMD, PMD and MBD, so the row cannot support MODIFY). Validated with just validate (clean, term checks on) and quote_check.
