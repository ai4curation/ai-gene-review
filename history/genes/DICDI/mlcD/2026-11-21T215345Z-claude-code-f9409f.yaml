  details: |
    IBA REMOVE re-review of 2026-11-21 (projects/IBA_REVIEW/rereview-2026-11-21, batch N04), read against the PTHR23050 tree with treeview.py and QuickGO seed lookups by GO id. GO:0030234 enzyme regulator activity: IBD at PTN000549861 (1127 leaves) with three seeds, one of which, S. pombe Cam2 (PomBase:SPAC29A4.05), is a class I myosin light chain annotated IPI PMID:21693583 with has_input myo1. The earlier REMOVE argued that a light chain is not an enzyme regulator, which the seed contradicts, so the action is now KEEP_AS_NON_CORE; summary, reason and source_entities rewritten (P62203 is Plasmodium falciparum calmodulin, not human). GO:0000226 microtubule cytoskeleton organization: IBD at PTN000549862 with four calmodulin seeds all in the 190-leaf child PTN000549863; MlcD is a derived paralog in the Dictyostelium expansion PTN000550364 with direct evidence of divergence from calmodulin (MyoD-only binding, low calcium affinity). REMOVE stands; summary and reason rewritten to rest on that divergence and the tree, not on absence of data. Quotes unchanged. Validated with just validate.
