  summary: 'IBA REMOVE re-review: grlE GPCR heterodimeric complex reason'
  details: |
    Re-review of IBA rows marked REMOVE against the PAINT tree (projects/IBA_REVIEW/rereview-2026-11-21, batch 02). GO:0038039 G protein-coupled receptor heterodimeric complex (IBA, PTHR10519 node PTN000828857, 178 leaves): REMOVE upheld as a misplaced IBD. All four seeds (human GABBR1 Q9UBS5 and GABBR2 O75899, Drosophila GABA-B-R1 and GABA-B-R2) sit in the metazoan clade PTN008947271 (65 leaves), the common ancestor of the R1 and R2 subunits; GrlE sits in the Dictyostelium clade PTN004165360 (7 leaves). The action did not change. The reason was rewritten because it called GrlE a single-gene receptor, which the tree contradicts (three D. discoideum paralogs in the clade), and leaned on the absence of experimental support. One propagation_review comment was corrected in the same way. PAINT fix proposed: move the IBD to PTN008947271.
