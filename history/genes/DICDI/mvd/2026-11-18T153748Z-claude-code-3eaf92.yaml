  summary: 'Create review: mvd (Dictyostelium discoideum)'
  details: |
    New review of D. discoideum diphosphomevalonate decarboxylase mvd (Q54YQ9, DDB_G0278607, PTHR10977:SF3); PE 3, function by orthology. All 13 GOA rows reviewed: 9 ACCEPT (GO:0004163 IBA/IEA/ISS, GO:0019287 IBA/IEA, cytosol IBA/IEA/ISS, GO:0008299 IEA), 3 TOO_GENERAL (cytoplasm IEA and ISS, carboxy-lyase activity IEA) and 1 MODIFY: the UniPathway GO:0006695 cholesterol biosynthetic process row becomes GO:0016126 sterol biosynthetic process, because Dictyostelium makes dictyosterol by way of cycloartenol (PMID:11607106, PMID:10783001), with a PROBABLE UniProt CC:PATHWAY source defect (CHECK). The PTN000104601 IBAs were checked against the PTHR10977 tree: the target sits with D. purpureum in PTN000861769, sister to the opisthokont clade, with no PAINT loss. Cytosol is supported by GFP fusions in a 2014 Sheffield PhD thesis (url: reference, unrefereed), which found the upstream phosphomevalonate kinase peroxisomal; a BIOLOGY knowledge gap records how diphosphomevalonate reaches the cytosolic enzyme. Validated with just validate DICDI mvd (UV_NATIVE_TLS noise warnings only) after backfill-record-sections.
