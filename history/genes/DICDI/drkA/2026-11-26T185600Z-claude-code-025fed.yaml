  details: |
    Re-judged the IBA row for GO:0005737 cytoplasm against the PAINT tree (PTHR23257, IBD at PTN001148170, 26 seeds). Action unchanged (MARK_AS_OVER_ANNOTATED). The earlier text said the term reflected soluble family members outside the receptor-like subfamily and that it mis-describes a membrane protein. The tree shows two seeds (gbpC, rckA) inside DrkA's own 25-leaf Dictyostelium clade PTN004623322, and one seed, drkC, is a receptor-like kinase whose evidence is location on the phagocytic vesicle membrane and macropinosome. Summary, reason and propagation comment rewritten to rest the doubt on DrkA's predicted transmembrane topology and the unknown membrane. Validated with just validate.
