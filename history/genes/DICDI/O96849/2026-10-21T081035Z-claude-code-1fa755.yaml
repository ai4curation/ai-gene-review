  summary: 'Create review: DIRS-1 ORF2 RT-RNase H (O96849)'
  details: |
    De-novo review of the DIRS-1 ORF2 RT-RNase H protein (O96849; identical-length copy Q23898), the closest experimentally characterised relative of a ProtNLM2 benchmark gene, done independently of ProtNLM2 output. Falcon and perplexity-lite deep research both failed (auth/quota); review based on cached literature (PMID:32170321 full text and others) plus a new HMMER catalytic-motif analysis (O96849-bioinformatics/motif_check.py, RESULTS.md). All 10 IEA annotations reviewed: ACCEPT RNA-directed DNA polymerase activity and RNA-templated DNA biosynthetic process; MODIFY transferase/nucleotidyltransferase to GO:0003964, DNA biosynthetic process to GO:0006278, nucleic acid binding to GO:0004523; KEEP_AS_NON_CORE DNA-directed DNA polymerase; MARK_AS_OVER_ANNOTATED adenine DNA methyltransferase and DNA binding because the C-terminal Dam-like domain has a degenerate motif IV (FPPP for NPPY); REMOVE DNA restriction-modification system. NEW: RNA-DNA hybrid ribonuclease activity (ISM) and retrotransposition (IC). Experimental support is element-level genetics only (trans-acting RT in rrpC- cells); no biochemical assay of the protein exists, and this is stated explicitly. Integration/recombination deliberately not assigned (separate tyrosine recombinase).
