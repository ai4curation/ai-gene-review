  summary: 'Create review: scsB'
  details: |
    New review of Dictyostelium discoideum scsB (UniProtKB:Q869S7, DDB_G0274449), the G-type (SUCLG2-like) beta subunit of mitochondrial succinyl-CoA synthetase, written as a follow-up to the evolutionary reviews of the beta family PTHR11815 and the alpha family PTHR11117. The gene is a leaf below PTN000929335, the node where PAINT places the gain of GDP-forming and the loss of ADP-forming activity.

    All 16 GOA rows reviewed; none is experimental and none is a no-data row. Accepted: GO:0004776 succinate-CoA ligase (GDP-forming) activity (IBA from PTN000929335, IEA) as the core activity, the NOT annotation for GO:0004775 succinate-CoA ligase (ADP-forming) activity (IBA, loss at PTN000929335), GO:0006099 tricarboxylic acid cycle (IBA, IEA), GO:0006104 succinyl-CoA metabolic process (IBA, IEA), GO:0005739 mitochondrion (IBA from PTN000212530, ISS, IEA; root-organelle policy) and GO:0042709 succinate-CoA ligase complex (IBA from the LUCA node; the row's evidence stops at the nucleotide-neutral complex and the gene has no row for a specific complex). MODIFY: GO:0005524 ATP binding to GO:0005525 GTP binding, a lateral correction as in the human SUCLG2 review. Kept as non-core: GO:0005525 GTP binding and GO:0000287 magnesium ion binding. TOO_GENERAL: GO:0003824 catalytic activity and GO:0046872 metal ion binding. One NEW row: GO:0005759 mitochondrial matrix (IC), added beside the mitochondrion rows.

    Main finding. No publication studies this gene product. The enzyme assays of 1993 to 1995 (PMID:8448193, PMID:8240297, PMID:8060491, PMID:7771809) are on the enzyme and its alpha subunit and do not identify the beta subunit, so the GDP-forming activity is assigned to scsB by descent and agrees with the enzyme-level data. The only direct data on the protein are from a mitochondrial proteome (PMID:35602934): Q869S7 is enriched in Percoll-purified mitochondria (relative enrichment ratio 0.799, cutoff 0.392; supplementary tables read directly), as are the alpha subunit scsA and the A-type beta subunit scsC. Both beta subunits are therefore in the same mitochondria of growing cells, and Q869S7 was one of the reference proteins used to scale the ratio.

    Bioinformatics. A small reproducible analysis (genes/DICDI/scsB/scsB-bioinformatics) aligns Q869S7 to seven reference beta subunits: six place their mature start on Leu27, leaving a 26-residue N-terminal extension with four basic and no acidic residues, and position 20 of the mature subunit is Gln46. The alignment does not show cleavage; a targeting predictor reported in PMID:35602934 finds no presequence.

    Depth: PMID:35602934 and PMID:18452512 were read in full; the other eight publications are abstract-only in the cache. PMID:35602934 was fetched with just fetch-pmid. The perplexity deep-research provider was not available (no provider file written); the literature search is recorded in the notes file. PANTHER node ids PTN000212532, PTN000929353 and PTN000212642 on the path to this leaf were read from the PANTHER treeinfo service on 2026-11-18 and are recorded in the notes only.

    Validation: just validate DICDI scsB passes with 0 errors and one content warning (core_functions names GO:0045244 succinate-CoA ligase complex (GDP-forming), which is not an annotation row; it is not proposed as NEW because it is a child of GO:0042709, which the gene carries, and rests on the same inference as the activity). Quote check: 89 verified, 0 failures. Four BIOLOGY knowledge gaps (nucleotide specificity of the scsA/scsB heterodimer, division of labour between scsB and scsC, import and sub-mitochondrial location, subunit that mediates stimulation by low GDP).

    Follow-up after independent checks (same day). The ISS mitochondrion row no longer offers percent identity as support for orthology (scsB is 57.9% identical to its paralog scsC); orthology rests on the tree placement, and RESULTS.md now gives the scsC value. The neighbor-joining and maximum-likelihood trees are described as two methods on one 64-sequence panel, independent of PANTHER and not of each other. The matrix row notes, as a comparator, that mouse Suclg2 carries GO:0005759 by IDA (PMID:27496549, not read).
