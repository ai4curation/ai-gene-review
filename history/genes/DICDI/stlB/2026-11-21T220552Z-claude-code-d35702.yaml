  details: |
    Re-review of IBA rows marked REMOVE (projects/IBA_REVIEW/rereview-2026-11-21, batch N12). The GO:0006633 fatty acid biosynthetic process IBA keeps REMOVE, but its summary, reason and propagation_review source label were rewritten because they named the wrong source. The earlier text said the term was over-propagated from the metazoan type I FAS family. The PAINT IBD is at PTN001711534, a 100-leaf polyketide synthase clade whose seeds are M. tuberculosis mycolipanoate synthase (A0A089QRB9, IDA for methyl-branched fatty acid biosynthesis, PMID:12207710) and D. discoideum pks5 (DDB_G0271520, IMP PMID:36252029). The type I FAS IBD is at a different node (PTN000196555) that is not on the StlB lineage in the treeview output. The ground for REMOVE is now stated as product divergence on the StlB branch (PTN000918798): the characterised product is the acylphloroglucinol THPH, not a fatty acid. Supporting quotes were not changed. No other row was touched; the IEA row for the same term stays MARK_AS_OVER_ANNOTATED and was outside the scope of this pass. Seed annotations were checked in QuickGO by GO id; just validate DICDI stlB passes with the same two environment warnings as before the edit.
