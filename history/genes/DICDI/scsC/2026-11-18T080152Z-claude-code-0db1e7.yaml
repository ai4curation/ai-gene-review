  summary: 'Create review: scsC'
  details: |
    New review of Dictyostelium discoideum scsC (UniProtKB:Q55AI5, DDB_G0271842), the A-type (SUCLA2-like) beta subunit of mitochondrial succinyl-CoA synthetase, written as a follow-up to the evolutionary reviews of the beta family PTHR11815 and the alpha family PTHR11117 and after the reviews of scsA and scsB. The gene is a leaf of the A daughter clade PTN008330414 and is not below PTN000929335, the node where PAINT places the loss of ADP-forming activity.

    All 15 GOA rows reviewed; none is experimental and one is a no-data row. Accepted: GO:0003674 molecular_function (ND, nd_case TRUE_GAP, with the literature search cited from the notes file and the enzyme papers), GO:0004775 succinate-CoA ligase (ADP-forming) activity (IBA from the LUCA node PTN000212531, IEA) as the core activity, GO:0006099 tricarboxylic acid cycle (IBA, IEA), GO:0006104 succinyl-CoA metabolic process (IBA), GO:0005739 mitochondrion (IBA from PTN000212530, ISS, IEA; root-organelle policy) and GO:0042709 succinate-CoA ligase complex (IBA from the LUCA node; the row's evidence stops at the nucleotide-neutral complex and the gene has no row for a specific complex). Kept as non-core: GO:0005524 ATP binding and GO:0000287 magnesium ion binding. TOO_GENERAL: GO:0003824 catalytic activity, GO:0046872 metal ion binding and GO:0005737 cytoplasm. One NEW row: GO:0005759 mitochondrial matrix (IC), added beside the mitochondrion rows.

    Main finding. No publication studies this gene product. The enzyme assays of 1993 to 1995 (PMID:8448193, PMID:8240297, PMID:7771809) are on the enzyme and its alpha subunit, do not identify a beta subunit, and describe a GTP-using enzyme after purification, which is the form expected of the paralog scsB. No ADP-forming enzyme has been isolated from the species, so the ADP-forming activity of scsC rests on descent and the family rule alone. For that reason the no-data row is recorded as a true gap (family known, nucleotide specificity not) and not as inferable, and the core function names the complex at the nucleotide-neutral level (GO:0042709), unlike the scsB review. The only direct data on the protein are from a mitochondrial proteome (PMID:35602934): Q55AI5 is enriched in Percoll-purified mitochondria (relative enrichment ratio 0.854, cutoff 0.392) and is predicted by TargetP-2.0 to have a mitochondrial targeting peptide. The supplementary tables were downloaded from Europe PMC and read directly. Q55AI5 was one of the 47 reference proteins used to scale the ratio.

    Bioinformatics. A small reproducible analysis (genes/DICDI/scsC/scsC-bioinformatics), with the method of the scsB analysis, aligns Q55AI5 to reference beta subunits: six place their mature start on Leu35, leaving a 34-residue N-terminal extension with seven basic and no acidic residues, and position 20 of the mature subunit is Pro54. The transit peptide of the UniProt record (1..17, from HAMAP MF_03220) is half that length; the cleavage site is unmeasured, so this is recorded as an open point and not as a source defect. Q55AI5 is more identical to its paralog scsB (57.9%) than to human SUCLA2 (54.6%) or SUCLG2 (52.8%), so its A-type placement rests on the trees of the LSC2 analysis (maximum likelihood, ultrafast bootstrap 98; 127 of 200 neighbor-joining bootstrap trees) and not on identity.

    Depth: PMID:35602934 was read in full with its supplementary tables. PMID:33923051 was searched for the gene name and accession, and of PMID:18452512 and PMID:15877282 only the abstract statements quoted were used; all three have full text in the cache. The other eight publications are abstract-only in the cache (six enzyme and family papers and the two genome papers). The perplexity deep-research provider was not available (no provider file written); the literature search is recorded in the notes file. No publication had to be fetched; all were already in the cache.

    Validation: just validate DICDI scsC passes with 0 errors and 2 warnings, both of which are a tool deprecation message captured from the term and reference validators and not about the review. Quote check: 86 verified, 0 failures. Four BIOLOGY knowledge gaps (nucleotide specificity of the scsA/scsC heterodimer, whether an scsA/scsC enzyme exists and its share of the flux, the mature N-terminus and sub-mitochondrial location, a role in mitochondrial DNA maintenance).

    Follow-up after independent checks (same day). The donor list of the GO:0004775 IBA row named pig where P53593 is Pseudomonas aeruginosa SucC; corrected. The no-data row keeps nd_case TRUE_GAP, with a sentence explaining why the true-gap subcase is used although the IBA test is met for the reaction (the ortholog assignment is ambiguous for the nucleotide). The two genome papers are now flagged as abstract-only.
