  summary: Record OpenScientist analysis of scsC nucleotide specificity and the limits
    of the beta-subunit determinants
  details: |
    Ran an OpenScientist deep-research job (kgap-scsc-nucleotide-specificity) on the first knowledge gap of scsC, covering the unmeasured nucleotide specificity of the enzyme scsC forms with scsA. It settles the scsB half of the question, leaves the scsC half where it was with a quantified reason, and confirms with structural measurements the point the existing boundary already made.

    The primary literature assigns nucleotide discrimination in this family to exactly one residue, Gln20beta of the pig GTP-specific enzyme, 2.58 Angstrom from the guanine O6/N1/N2 edge in the deposited GTP complex; the six other residues within 4 Angstrom pack hydrophobically, and the arginine named in the same paper binds the gamma-phosphate. Read at those seven positions the two Dictyostelium beta subunits split: scsB carries the guanine-reading glutamine and a superposed model places its side chain 2.59 Angstrom from the guanine edge, within 0.01 Angstrom of the pig measurement, while scsC carries proline 5.68 Angstrom back, in the position of the water-substituted Thermus aquaticus proline.

    Every residue was confirmed in the local records: scsC Pro54, Val78, Leu103, Arg142, His143, Leu145 and Met253 in the 445-residue Q55AI5, which also carries TRANSIT 1..17 and the HAMAP MF_03220 ADP-forming assignment; scsB Gln46, Val69, Leu95, Ser134, Val135, Pro137 and Met245 in the 420-residue Q869S7, which has no annotated transit peptide and carries HAMAP MF_03221. The analysis therefore gives the scsB GDP-forming HAMAP call a structural basis, while scsC's ATP assignment rests on the absence of that glutamine plus two lineage-confounded second-shell substitutions.

    The limit is quantified rather than asserted: across nine beta subunits with measured or orthology-assigned nucleotide use, six of the seven positions separate the strictly specific enzymes, but none also places the two dual-specificity enzymes on the side they actually prefer, and the discriminating power comes almost entirely from one contrast between three near-identical animal GTP-specific and three near-identical animal ATP-specific sequences. No structure of any ATP-specific succinyl-CoA synthetase with a bound adenine nucleotide exists, so the ATP-specific pattern has never been observed reading an adenine.

    Two further points are settled. A mixed outcome, one ATP-type and one GTP-type beta subunit in the same mitochondrion, is consistent with the purified GTP-utilising enzyme, which constrains which holoenzyme survives purification rather than what the genome encodes. And expression does not explain the GTP-only result: in one baseline RNA-seq dataset both beta loci are in the top 4 per cent of expressed genes in growing cells at close to 1:1, with the alpha level approximating their sum, and the ratio shifting through development.

    One premise of the hypothesis this review sent was wrong, and the error was mine rather than the run's or the review's: the prompt said this gap treats the proline as informative, whereas the boundary already stated the opposite. The run does correct the numbering: Pro54 sits at mature position 20 only if the presequence is 34 residues, while the local record's TRANSIT 1..17 would put it at mature position 37. The structural equivalence holds either way, and the mature N-terminus is itself a separate open gap on this gene.

    Gap status moved from OPEN to NARROWING. No annotation action was changed; the recomputed PDB distances, AlphaFold superpositions, nine-subunit scoring and expression values were not recomputed here, and the reference is recorded as UNVERIFIED with those items listed.
