  summary: 'Create review: mvk (Dictyostelium discoideum)'
  details: |
    New review of D. discoideum mevalonate kinase mvk (Q86AG7, DDB_G0272018, PTHR43290:SF2); no published enzymology, function by orthology. All 13 GOA rows reviewed: 8 ACCEPT (GO:0004496 IBA/IEA/ISS x2, GO:0019287 IBA/IEA, cytosol IBA, GO:0008299 IEA), 4 KEEP_AS_NON_CORE (ATP binding IEA/ISS, magnesium ion binding ISS, phosphorylation IC) and cytoplasm IEA TOO_GENERAL (cytoplasm includes the peroxisome, the alternative at issue). The PTN000048555 IBAs were checked against the PTHR43290 tree: the target is in PTN000825261 with the fungal and animal MVKs, and the Eukaryota IRD PTN002214956 lies on the plant glucuronokinase branch. Cytosol is supported by GFP fusions in amoebae reported in a 2014 Sheffield PhD thesis (cited as a url: reference, unrefereed), which also found PMK peroxisomal; FDPS is peroxisomal (PMID:22849378). A BIOLOGY knowledge gap records the unexplained cytosol-peroxisome split of the pathway. Validated with just validate DICDI mvk (UV_NATIVE_TLS noise warnings only) after backfill-record-sections.
