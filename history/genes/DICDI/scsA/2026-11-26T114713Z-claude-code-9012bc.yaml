- type: EDIT
  outcome: changed
  summary: Record OpenScientist refutation of an intrinsic GDP site and flag the 1997
    trans-acting inhibitor paper missing from this review
  details: |
    Ran an OpenScientist deep-research job (kgap-scsa-gdp-regulatory-site) on the gap asking where micromolar GDP acts to stimulate phosphoenzyme formation. It refutes the structural half and then undermines the premise of the gap itself, using a paper from the same laboratory that this review's evidence base never took up.

    On structures the answer is unambiguous. A PDB sequence search with the E. coli alpha and beta subunits returned 84 entries, 48 in this family, of which 14 carry a nucleotide, and contact analysis assigns every catalytic nucleotide exclusively to beta-chain residues, the alpha subunit contributing none of the lining residues in six of eight complexes and one of nineteen in the other two. The apparent exception is not a second site: the extra GTP in pig 2FP4 packs against the outer face of the same beta loop that grips the catalytic nucleotide 7.44 Angstrom away, with 10 of its 32 atoms having no protein heavy atom within 5 Angstrom, 3.3 protein contacts per ligand atom against 8.5 for the catalytic GTP, a mean B factor of 41.8 against 29.3 for protein CA, absence from five sibling structures across three space groups including the same one, and its only alpha contact arising from a lattice neighbour after symmetry expansion; it was crystallised in 5 mM GTP while the matched GDP-grown crystal in the same buffer and space group has one nucleotide only. Cavity detection gives the alpha subunit a largest pocket of 31 cubic Angstrom against roughly 300 needed for a guanine nucleotide, with the beta catalytic pocket recovered at 342 as a positive control, and no depositor in the family asserts a site outside the beta ATP-grasp domain.

    The larger point concerns the premise. This gap's boundary offers two observations as evidence for an intrinsic site, that the effect survives purification and that it is seen with pig heart enzyme. The run finds that the same laboratory reported in 1997, in PMID:9344470, that the GDP effect depends on a protein distinct from the synthetase, that this effector separates by ammonium sulfate fractionation, and that reconstitution shows the protein inhibits the synthetase with the inhibition relieved by GDP and the inhibitor recognising both bacterial and eukaryotic forms. A trans-acting inhibitor accounts for both observations. That paper is cited twice in this gene's notes file but appears in none of this review's references and is not cached here, so the gap as written rests on the earlier exclusion arguments without the later result that reinterprets them. A suggested question now asks for it to be fetched and for the gap to be reframed as a question about a trans-acting inhibitor rather than a site on this protein.

    The kinetics do exclude three alternatives, catalytic-site occupancy, classical substrate inhibition and a change in subunit association, but not a relieved rate-limiting step such as slow product release, which is exactly what a faster apparent rate with an unchanged phosphorylated fraction would give; and no dissociation constant, Hill analysis, stoichiometry or direct binding measurement for the stimulatory site has been published. A second-occupancy explanation of the beta site also fails, since the nearest binding measurement is on the E. coli tetramer where one or two sites map onto its two catalytic sites, and an alternating-sites mechanism cannot apply to the pig or Dictyostelium enzymes, both alpha-beta dimers with a single catalytic site.

    No annotation action follows, because no current annotation asserts a nucleotide site on the alpha subunit, so the hypothesis would have required adding a term rather than correcting one and the structural evidence does not support that. Gap status moved from OPEN to NARROWING; the other three gaps on this gene were left untouched.

    Not verified here: the PDB search counts, the contact analyses, the 2FP4 artefact metrics, the cavity volumes and the E. coli binding measurements. PMID:9344470 is not cached, so its content is attributed in prose rather than quoted as supporting text.

    Incidental: the first two attempts at this edit used YAML round-trips that reflowed every scalar in the file, giving a 906-line diff for a one-gap change. A semantic comparison confirmed nothing outside the intended edits had altered, but the edit was redone with scoped line surgery to bring the diff to 88 insertions.
