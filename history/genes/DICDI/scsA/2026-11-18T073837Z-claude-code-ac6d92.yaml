  summary: 'Create review: scsA'
  details: |
    New review of Dictyostelium discoideum scsA (UniProtKB:P36967), the alpha subunit (p36) of mitochondrial succinyl-CoA synthetase, written as a follow-up to the evolutionary reviews of the alpha family PTHR11117 and the beta family PTHR11815, where scsA is a PAINT seed for GO:0004776 at the LUCA node PTN000122012.

    All 13 GOA rows reviewed. Accepted as core: GO:0004776 succinate-CoA ligase (GDP-forming) activity (IDA from PMID:8448193, IBA, IEA), GO:0006099 tricarboxylic acid cycle (IBA, IEA), GO:0006104 succinyl-CoA metabolic process (TAS) and GO:0005739 mitochondrion (IBA from the eukaryotic node PTN000122014, IEA; root-organelle policy). Kept as non-core: GO:0004775 succinate-CoA ligase (ADP-forming) activity (IBA, IEA) and GO:0009361 succinate-CoA ligase complex (ADP-forming) (IBA); the node placement holds and the genome has an A-type beta gene (scsC), but no ADP-forming enzyme has been assayed in Dictyostelium. MODIFY: GO:0003824 catalytic activity, to GO:0004774 succinate-CoA ligase activity (first written as TOO_GENERAL; see the follow-up below). UNDECIDED: GO:0016020 membrane (IDA, PMID:8448193); the abstract reports only recovery in crude membranes and the full text was not read, so the row is not overruled. Two NEW rows: GO:0005759 mitochondrial matrix (IC; cleaved presequence, soluble alpha/beta dimer, TCA-cycle function) and GO:0045244 succinate-CoA ligase complex (GDP-forming) (alpha/beta dimer that forms GTP from GDP, PMID:8240297).

    Depth: every paper from 1989 to 1995 on this protein is abstract-only in the cache; only PMID:33923051 (mitochondrial proteome) was read in full. Seven publications were fetched with just fetch-pmid. The perplexity deep-research provider was not available (no provider file written); the literature search is recorded in the notes file. just fetch-gene failed on a timeout of the EBI Ontology Lookup Service while resolving the taxon label, so the stub was seeded by the same command with the NCBITaxon:44689 label supplied.

    Validation: just validate DICDI scsA passes with 0 errors; quote check 0 failures. Four BIOLOGY knowledge gaps (beta partner and ADP-forming enzyme, allosteric GDP site, loss-of-function phenotype, sub-mitochondrial location).

    Follow-up after independent checks (same day). GO:0003824 changed from TOO_GENERAL to MODIFY with GO:0004774 succinate-CoA ligase activity, because IPR005810 is specific to succinyl-CoA synthetase alpha subunits without fixing the nucleotide, so the row's own evidence reaches the nucleotide-neutral term. PMID:35602934 (Percoll-purified mitochondria) added to the references, both mitochondrion rows and the matrix row; its supplementary tables were read directly (P36967 relative enrichment ratio 1.021 against the cutoff 0.392; one of the 47 reference proteins, so the classification is not independent of prior annotation). The three ADP-forming rows stay KEEP_AS_NON_CORE, with the reason now saying that non-core is used because no ADP-forming enzyme has been shown in the organism and not because the activity would be peripheral. Two knowledge gaps moved to RESIDUAL_SUBGAP. Mutant queries were run (Europe PMC and PubMed, no hit; dictyBase strain records could not be retrieved) and the review now says that no mutant was found in the recorded searches. The matrix row no longer says that S. pombe carries a proposed row; its row is an existing IC annotation.

    Follow-up after PR review (same day). GO:0003824 returned to TOO_GENERAL so that the three new alpha-subunit reviews (scsA, Blastocystis SCSa, T. vaginalis ALPHA-SCS1) treat the identical InterPro row the same way: the InterPro2GO mapping stops at the root term, and GO:0004774 is an ancestor of the accepted GO:0004776. The proposed GO:0045244 complex row changed from IDA to IC, because which complex the observed dimer is was inferred.
