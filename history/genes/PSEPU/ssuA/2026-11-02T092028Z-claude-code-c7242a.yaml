  summary: Resolve UNDECIDED membrane row
  details: |
    Resolved the UNDECIDED GO:0016020 (membrane) IEA row while completing the bacterial alkanesulfonate uptake and desulfonation module. The IEA derives from the InterPro SsuA-family mapping, which covers the whole ABC import system and so carries a generic membrane term; SsuA itself has a cleavable signal peptide (residues 1-28) and no transmembrane segment or lipid anchor in the record, and the integral-membrane role in this system belongs to SsuC. The row is therefore MODIFY to GO:0042597 (periplasmic space), the term this gene already asserts and accepts, following the same lateral correction already applied to the equivalent row of E. coli ssuA. Transient docking onto SsuBC during transport is expected of any periplasmic binding protein and is not a membrane location. Validated with just validate PSEPU ssuA and just backfill-record-sections.
