  summary: 'Quote-expansion correction round: ROP18'
  details: |
    Correction round for PR #5028, superseding the quote-expansion record earlier this session. The expansion rule treated the period in abbreviations (Fig., Table.) and in genus abbreviations (P., T.) as a sentence end, leaving quotes dangling on a severed abbreviation, and missed a fused boundary where the cache drops the space after a period. The rule now skips abbreviation and single-capital periods, treats a period followed directly by a capital as a fused boundary, and refuses any candidate containing a DOI or figure id. It also now covers supporting_text inside references[].findings[], which the first pass skipped because those entries carry no adjacent reference_id. Redone from the pre-expansion state rather than patched on top; verified that non-quote content is byte-identical, every original quote is still contained in its expansion, and no dangling abbreviations or DOI/figure artifacts remain.
