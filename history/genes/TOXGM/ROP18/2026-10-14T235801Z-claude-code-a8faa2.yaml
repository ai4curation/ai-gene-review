  summary: 'Create review: ROP18'
  details: |
    Manual literature review (automated deep research was unavailable: Falcon auth failed and the OpenAI key was invalid), with notes in ROP18-notes.md and primary papers fetched into publications/. All nine GOA rows were reviewed: protein serine/threonine kinase activity and ATP binding ACCEPTed as core; nucleotide binding, protein kinase activity, kinase activity and transferase activity marked TOO_GENERAL as ancestors of the accepted terms; the RHEA-derived protein serine kinase activity MODIFYed to protein serine/threonine kinase activity because the mapped Irga6 sites are threonines; and the two TreeGrafter terms from the animal PANTHER family PTHR44167, nucleus and mitotic DNA damage checkpoint signaling, REMOVEd as metazoan functions wrongly grafted onto a secreted apicomplexan rhoptry kinase. Three NEW annotations were added with direct evidence: rhoptry, symbiont-containing vacuole membrane (the parasitophorous vacuole membrane) and symbiont-mediated suppression of host innate immune response. One core function was recorded, a vacuole-membrane-tethered Ser/Thr kinase that phosphorylates host immunity-related GTPases to block interferon-driven clearance, with the host-range caveat that the IRG arm is rodent-specific.
