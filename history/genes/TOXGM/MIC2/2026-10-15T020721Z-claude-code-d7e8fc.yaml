  summary: 'Quote-trim round: MIC2'
  details: |
    Trim round for PR #5028. Two MIC2 quotes had been extended by the quote-expansion pass to include 'the inability to support lethal infection in a murine model of acute toxoplasmosis', which is the claim this same review records as OVERTURNED, superseded by the clean knockout in PMID:28630943; one of the two was the supported_by of the GO:0085017 NEW row, so the annotation's machine-readable evidence asserted a virulence claim the review refutes. Both now stop after the helical gliding clause, which is what the statement and the annotation claim. The OVERTURNED finding keeps the full clause, which is its purpose. Three CSP quotes were trimmed in the same round because the expansion ran through 'hepatocytes9,12.', where 9,12 are flattened superscript reference markers. RH5's 'basigin1,2' is the same shape but predates this work and trimming it would drop the essential-step clause the row relies on, so it was left. All 20 reviews across both tracks were checked for quotes containing the supporting_text of an OVERTURNED or DISPUTED finding; these were the only instances.
