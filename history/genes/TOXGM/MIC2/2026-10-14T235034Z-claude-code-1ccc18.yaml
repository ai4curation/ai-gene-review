  summary: 'Create review: MIC2'
  details: |
    Manual literature review (automated deep research unavailable: Falcon auth failure, invalid OpenAI key), recorded in MIC2-notes.md with inline PMID provenance. Reviewed the single GOA row (GO:0005576 extracellular region, IEA from UniProt SubCell) as KEEP_AS_NON_CORE, since the shed MIC2 ectodomain genuinely reaches the medium but the functional compartments are the microneme and the parasite surface. Added six NEW annotations: microneme and cell surface locations, cell adhesion mediator activity and heparin binding, adhesion of symbiont to host cell, and cell surface adhesin-mediated gliding motility, plus entry into host cell by a symbiont-containing vacuole as a non-core contribution. Core functions capture MIC2 as the TRAP-family surface adhesin and as the traction element coupling host-ligand binding to the actomyosin motor via aldolase. Flagged the virulence claim of PMID:16933991 as overturned by the clean knockout PMID:28630943 and the hexameric MIC2-M2AP stoichiometry as disputed by PMID:24639528.
