  summary: 'Full re-review: Q9RSY6 (bS1/RpsA, DR_1983), independent of ProtNLM2'
  details: |
    Full ARGO50 re-review independent of ProtNLM2 output. Confirmed Q9RSY6 is the full-length bS1 product in PANTHER PTHR10724:SF7, the same subfamily as E. coli RpsA (PAINT donor). Kept the 4 IBA rows and the IEA mRNA binding row as ACCEPT. Changed IEA nucleic acid binding from MARK_AS_OVER_ANNOTATED to MODIFY (replacement: mRNA binding) and IEA cytoplasm from KEEP_AS_NON_CORE to MODIFY (replacement: cytosolic small ribosomal subunit), because both terms are correct but too general. Replaced support quotes that cited ARBA keywords and DE names with literature and family signatures. Added PMID:35856907 (D. radiodurans RpsA RNA binding, essentiality, PNPase interaction), PMID:38474204 and PMID:9451450. Added a structural-constituent core function, suggested questions and suggested experiments, and created a notes file. No NEW terms.
