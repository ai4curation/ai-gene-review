  summary: 'Create review: PTO1356 (Picrophilus torridus)'
  details: |
    Reviewed P. torridus PTO1356 (Q6KZB1), a PTHR10977 member that is a mevalonate 3-kinase, not a decarboxylase: ATP-dependent phosphorylation of (R)-mevalonate at C3 to (R)-mevalonate 3-phosphate, no activity on MVA-5P or MVAPP, no decarboxylation (PMID:25636853, 13C NMR). Accepted the single GOA row (GO:0019287 IEA, UniPathway). Added NEW GO:0016773 (IDA, PMID:25636853) as the most specific existing MF, following the Ta1305 convention, and proposed the missing term mevalonate 3-kinase activity (EC 2.7.1.185, RHEA:42884) used as the core proposed_molecular_function. Validated with just validate (clean, term checks on) and quote_check.
