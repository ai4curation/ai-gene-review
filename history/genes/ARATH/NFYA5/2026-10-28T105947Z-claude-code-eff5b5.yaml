  summary: 'Create review: NFYA5'
  details: |
    New review of Arabidopsis NFYA5 (Q9SYH4), all 17 GOA rows. Core function is contributes_to RNA polymerase II-specific DNA-binding transcription factor activity as the CCAAT-specificity subunit of the nuclear NF-Y complex. Drought response (GO:0009414) is accepted as the main physiological role, from knockout and overexpression phenotypes. The general DNA binding, transcription factor activity and transcription regulation rows were modified to their specific children. Rows for embryo, seed, somatic embryogenesis, blue light, ABA signalling and transcriptional repression are kept as non-core because they rest on overexpression or single abstract-only studies. The enables qualifier on the transcription factor rows is queried upstream as contributes_to. No NEW terms. Literature synthesis was done by hand, since no deep-research API was available.
