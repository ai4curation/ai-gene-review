  summary: New review of FRK1 (SIRK) for ARATH_SINGLE_CELL_FUNGAL project
  details: |
    De novo review of 14 GOA annotations: 5 ACCEPT (kinase activity, ATP binding, membrane/plasma membrane), 1 KEEP_AS_NON_CORE (response to bacterium IBA), 3 MODIFY (two defense response to bacterium rows -> GO:0009617 response to bacterium, since FRK1 is a MAMP marker gene with no loss-of-function evidence; response to bacterium IEP from a flg22-only study -> GO:0002237 response to molecule of bacterial origin), 5 REMOVE (4 protein binding IPI from a high-throughput ectodomain screen; extracellular region ISM for a type I receptor kinase), plus NEW GO:0009620 response to fungus (IEP, PMID:37741284). Kinase motif analysis in FRK1-bioinformatics/ shows intact catalytic motifs. A claim in the coordinator's prompt that FRK1 phosphorylates RLCK VII substrates was unsourced and could not be verified; recorded as such.
