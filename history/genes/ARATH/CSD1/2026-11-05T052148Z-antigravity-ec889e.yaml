  summary: 'Create review: ARATH CSD1 (remove GO:0035195 substrate mis-annotation)'
  details: |
    Created AI gene review and notes for Arabidopsis thaliana CSD1 (P24704 / AT1G08830, cytosolic/nuclear Cu/Zn superoxide dismutase 1). Reviewed all 38 GOA annotations: accepted core superoxide dismutase activity (GO:0004784), superoxide radical removal (GO:0019430), copper ion binding (GO:0005507), cellular response to oxidative stress (GO:0034599), and cytosol/nucleus localization; removed GO:0035195 (miRNA-mediated post-transcriptional gene silencing, IEP from PMID:16861386) because CSD1 mRNA is the cleaved substrate of miR398-RISC rather than an actor in the silencing pathway; removed bare GO:0005515. Validated with 0 issues.
