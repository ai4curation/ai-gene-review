  summary: 'Create review: SERK2'
  details: |
    New review of Arabidopsis SERK2 (Q9XIC7, At1g34210). All 31 GOA rows reviewed: generic kinase IEA rows modified to transmembrane receptor Ser/Thr kinase activity; IBA receptor kinase, plasma membrane, receptor kinase binding (ERECTA/ERL1/BIR1), cell surface receptor Ser/Thr kinase signalling and microsporogenesis rows accepted; brassinosteroid signalling rows kept as non-core because SERK2 is a weak, largely dispensable BRI1 co-receptor (PMID:22253607); nuclear HDA marked over-annotated; bare protein binding rows removed per policy. Core functions describe SERK2 as a kinase-active LRR co-receptor for peptide receptors and, redundantly with SERK1, as EMS1 co-receptor in tapetum specification (PMID:27920157). Manual literature synthesis written in SERK2-deep-research-manual.md; no NEW annotations proposed.
