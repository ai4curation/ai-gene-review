  summary: 'Create review: CBL4'
  details: |
    Created the CBL4/SOS3 (O81223) review from scratch: reviewed all 29 GOA rows against 14 GOA-cited papers plus 9 additional cached papers (no deep-research provider available; notes written from cached literature and UniProt). Removed the legacy ISS calcium-dependent Ser/Thr phosphatase activity and calcineurin complex annotations (plants lack calcineurin A; SOS3 activates the SOS2 kinase instead), corrected the IMP hypotonic salinity response to hyperosmotic salinity response, refined protein-binding IPI rows to protein serine/threonine kinase activator activity (CIPK24) or protein kinase binding (CIPK1), and proposed NEW rows for intracellular sodium ion homeostasis, protein-membrane adaptor activity and protein localization to plasma membrane. Core functions: Ca2+-dependent CIPK24 activation and lipid-anchored plasma-membrane recruitment of CIPK complexes. Validated with just validate ARATH CBL4 (no errors) plus an independent verbatim-quote check.
