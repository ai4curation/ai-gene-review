  details: |
    Re-review of the IBA REMOVE on GO:0036503 ERAD quality control pathway (IBD at PTHR11742 root PTN000201533). The action stands on target-specific negative evidence (mns1 mns2 does not suppress BRI1-5/BRI1-9, PMID:24737672). The summary and the propagation comment said no Golgi-clade member is a seed; that misstated the tree, because human MAN1A1 (P33908, IDA PMID:27108681) is a seed and sits in the animal half (PTN000201535) of the Golgi clade PTN000201534. Summary, reason and source comment were rewritten to say that the seeds are the ER-type clade PTN002482736 plus MAN1A1, and that the unseeded land plant clade PTN008525833 holds MNS1. No action changed; quotes untouched.
