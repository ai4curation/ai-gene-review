  summary: Correct the claim that no seed of the ERAD IBA lies in MNS1's own branch,
    in summary, reason and source note
  details: |
    Follow-up to the tree re-read of 2026-11-17 (record 2026-11-17T234518Z-claude-code-4cec38), after review of the pull request. For GO:0036503 (REMOVE) the reading found that the review contradicts the PANTHER 19.0 tree: the summary, the last sentence of the reason and a source note said that every seed is an ER-type or EDEM/Htm1-type enzyme and that none comes from the clade PTN000201534 that contains MNS1. MNS1-phylo.yaml gives 7 seeds in both branches below the root node, 1 of them in MNS1's own branch: human MAN1A1 (UniProtKB:P33908, PTHR11742:SF31), an ortholog of MNS1 across later duplications. The other six are in the other branch: five in PTHR11742:SF55 (yeast MNS1, fission yeast SPAC2E1P5.01c, mouse Man1b1, chicken A0A8V1ABV1, human MAN1B1) and yeast MNL2 in PTHR11742:SF103. The script left the row for a curator because it rewrites a reason only when the contradicted claim is nowhere else; the reading and its corrected reason had been checked by the second agent, so the row was corrected by hand.

    - reason: replaced by the checked text. It keeps the genetic argument (mns1 mns2 does not suppress BRI1-5 or BRI1-9, PMID:24737672) and says that one seed lies in MNS1's own clade, so the removal rests on the target-specific genetic evidence and not on node placement. The sentence that the term "was over-propagated from the root to the Golgi clade" is gone.
    - summary: says that six of the seven seeds are in the other branch below the root and that human MAN1A1 lies in the branch that contains MNS1.
    - propagation_review.source_entities: the note on PANTHER:PTN000201533 says the same.
    - supported_by: quotes sentences 1, 4 and 5 of the row's extract summary, including the sentence that one seed shares MNS1's own branch.

    The verdict and the failure modes are unchanged. The review validates.
