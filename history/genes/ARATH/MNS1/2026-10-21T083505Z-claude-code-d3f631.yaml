  summary: 'Create review: MNS1 (Golgi class I alpha-mannosidase, PTHR11742:SF6 relative
    of fly alpha-Man-Ia)'
  details: |
    De-novo review of Arabidopsis MNS1 (Q9C512), done without ProtNLM2 output, as the experimental reference for SF6 relatives such as DROME alpha-Man-Ia. Falcon deep research failed on authentication and the perplexity fallback failed on quota; the review is built from cached primary papers (PMID:19914916, 20023195, full-text 24737672, 29409894), UniProt and the PTHR11742 PAINT file. Accepted the core terms: GO:0004571 mannosyl-oligosaccharide 1,2-alpha-mannosidase activity, GO:0006491 N-glycan processing, GO:0000139 Golgi membrane, GO:0000137 Golgi cis cisterna. REMOVED the ERAD IBA, which reached MNS1 from root node PTN000201533; mns1 mns2 is dispensable for ERAD of BRI1-5/BRI1-9 and plant ERAD uses MNS4/MNS5. REMOVED the AtSubP plasma membrane prediction. Marked the root-level ER IBA and the LOPIT TGN/endosome rows as over-annotated, because LOPIT merged Golgi and TGN into one class. MODIFIED general terms (Golgi apparatus, membrane, alpha-mannosidase activity, carbohydrate metabolic process) to the specific terms. Added propagation_review blocks for the ER and ERAD IBAs. Proposed no NEW process terms; salt-stress, root and cell-wall phenotypes are downstream of failed glycan maturation.
