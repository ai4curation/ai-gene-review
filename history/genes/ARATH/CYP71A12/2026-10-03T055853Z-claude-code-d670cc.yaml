  details: |
    Curated all 17 GOA rows for Arabidopsis CYP71A12 (O49340) plus one NEW row: 6 ACCEPT, 6 KEEP_AS_NON_CORE, 2 MODIFY (membrane to ER membrane), 3 MARK_AS_OVER_ANNOTATED (iron ion binding; both induced systemic resistance rows, since the Pf.SS101 response is SA-dependent and the gene makes metabolites rather than signalling), 1 REMOVE (protein binding with CYP71B15), 1 UNDECIDED (ER lumen IDA cited to deleted duplicate PMID:33831160, resolved to PMID:31511315 via reference_review.replacement), 1 NEW (indole-containing compound biosynthetic process, for the ICOOH and ICN/4-OH-ICN branches). Core function: ER-membrane P450 monooxygenase alpha-hydroxylating IAOx to indole-3-cyanohydrin, minor contributor to camalexin. GO:0047720 dehydratase deliberately not asserted (18O2 data, consistent with the camalexin module); new MF and ICN biosynthesis terms proposed. Cached PMID:24151049, 25953104, 31411742. Validation passes with only the documented advisory warning for PMID:33831160.
