  details: |
    New review of Arabidopsis diphosphomevalonate decarboxylase MVD2 (At3g54250, F4JCU3; TAIR symbol MDD2). All 12 GOA rows reviewed. MDD activity (IBA, IEA, IDA from Henry 2015 via curated UniProt kinetics) and IPP-via-mevalonate rows accepted; carboxy-lyase TOO_GENERAL. Peroxisome rows (UniProt IEA and ISS, both by similarity to MVD1) accepted with the caveat that MVD2 has never been localised; cytosol IBA and InterPro2GO rows and the AtSubP nucleus prediction marked over-annotated. Added a CC knowledge gap on MVD2 location and in planta contribution. Validated with just validate (only UV_NATIVE_TLS noise warnings) and backfill-record-sections.
