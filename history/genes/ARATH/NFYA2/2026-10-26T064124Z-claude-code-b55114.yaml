  summary: 'Create review: NFYA2'
  details: |
    Created a full review of Arabidopsis NFYA2 (Q9M9X4, AtHAP2b), the NF-YA subunit of the CCAAT-binding NF-Y complex. Reviewed all 13 GOA rows: accepted the IBA Pol II-specific DNA-binding TF activity, CCAAT-binding factor complex, nucleus and positive regulation of transcription; refined general GO:0003700 and GO:0006355 rows to GO:0000981 and GO:0006357; kept heat response and double fertilization as non-core. Added one NEW process annotation (regulation of timing of transition from vegetative to reproductive phase) based on direct FT/SOC1 promoter binding and genetics. Literature synthesis done manually from cached full texts (PMID:9662544, 25490919, 23118940, 27977687, 28469131) and abstracts.
