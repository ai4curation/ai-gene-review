  summary: New review of MYB122 for ARATH_SINGLE_CELL_FUNGAL project
  details: |
    De novo review of 12 GOA annotations: 8 ACCEPT (incl. GO:0050832 defense response to fungus from Tang et al. 2023, PMID:37741284; noted that the evidence is a mutant phenotype, IMP rather than IDA), 3 KEEP_AS_NON_CORE (response to stress, response to other organism, response to insect), 1 MARK_AS_OVER_ANNOTATED (plasmodesma HDA from a contaminant-rich proteome), plus NEW GO:0010439 regulation of glucosinolate biosynthetic process (IMP; comparator check against MYB28/29/76). Camalexin regulation not added (conflicting evidence; raised as a question). Synthesized from overexpression/mutant metabolite data, promoter targets, partner interactions, signalling and family context; Tang 2023 key-resources table lists myb122 lines under AT3G25800 (clerical error), recorded in reference_review.
