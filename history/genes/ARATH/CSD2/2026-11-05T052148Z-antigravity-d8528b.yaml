  details: |
    Created AI gene review and notes for Arabidopsis thaliana CSD2 (O78310 / AT2G28190, chloroplastic Cu/Zn superoxide dismutase 2). Reviewed all 31 GOA annotations: accepted core superoxide dismutase activity (GO:0004784), superoxide radical removal (GO:0019430), copper ion binding (GO:0005507), cellular response to oxidative stress (GO:0034599), and chloroplast/stroma/thylakoid localization; removed GO:0035195 (miRNA-mediated post-transcriptional gene silencing, IEP from PMID:16861386) as a substrate-vs-actor mis-annotation and removed GO:0048046 (apoplast) as a plastid-lysis contaminant. Validated with 0 issues.
