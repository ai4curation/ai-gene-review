    Created the LPXD1 (At4g05210, F4JGP6) review for the RAR_MISANNOTATION project. All 13 GOA rows reviewed. Mitochondrion (IDA, IBA, IEA) accepted; cytoplasm modified to mitochondrion; chloroplast (ISM) removed (GFP not chloroplastic). LpxD activity GO:0103118 (IBA, IEA, IMP) and lipid A biosynthetic process (IEA) left UNDECIDED: in Li et al. 2011 (PMID:21709257, full text) the atlpxd1-1 null does not lower lipid X, LPXD1 has R293K and lacks two acceptor-binding aromatics, and an LpxA-like role is raised. Acyltransferase activity GO:0016747 accepted as the most specific supported MF; transferase activity TOO_GENERAL. Obsolete lipid X metabolic process: IBA UNDECIDED, IMP REMOVE (no phenotype). No NEW annotations. Added a reproducible alignment (LPXD1-bioinformatics) and a manual notes file (deep research failed).
