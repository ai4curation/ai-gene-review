  summary: 'Create review: LPXB'
  details: |
    Full review of all 12 GOA annotations for Arabidopsis LPXB (At2g04560, F4IF99) using the full text of Li et al. 2011 (PMID:21709257). Lipid-A-disaccharide synthase activity (IBA/IEA/IMP), lipid A biosynthetic process (IBA/IEA) and mitochondrion (IBA/IDA/IEA/IMP) accepted; the RAR (Wei et al. 2020) lipid A misannotation flag is refuted by lpxb-1/lpxb-2 accumulation of both LpxB substrates (lipid X 42-fold, UDP-2,3-diacyl-GlcN). Chloroplast ISM removed (GFP not co-localised with chloroplasts; mitochondrial transit peptide). Two IMP rows to obsolete GO:2001289 lipid X metabolic process modified to GO:0009245. No NEW rows, since all supported terms are already in GOA; experimental evidence was added to the existing rows. Notes written to LPXB-notes.md.
