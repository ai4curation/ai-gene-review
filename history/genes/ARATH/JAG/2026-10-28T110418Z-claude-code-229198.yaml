  details: |
    Created the JAG (Q6S591, At1g68480) review from 18 GOA rows. JAG is a nuclear SUPERMAN-type C2H2 zinc-finger transcriptional repressor; ChIP and cycloheximide-insensitive repression of BP, BEL1, PTL, KRP2 and KRP4 justified refining GO:0003700 rows to GO:0001217 and GO:0006355 to GO:0045892. Flower development and floral organ development rows were refined to floral organ morphogenesis and phyllome development to leaf morphogenesis. Specification of floral organ identity (IBA and TAIR IMP) was marked as over-annotated with a TAIR source defect; abaxial cell fate specification (abstract-only source) left undecided; bare protein binding (HAN) removed per policy. No NEW terms proposed. Manual literature synthesis written because no deep-research API was available.
