  summary: 'Create review: CSLD3 (KOJAK), reference member of the CSLD2/CSLD3 clade'
  details: |
    De-novo review of all 19 GOA annotations from primary literature (falcon and perplexity-lite deep research both failed on auth/quota; recorded in notes). Independent of ProtNLM2 predictions. Core function set to experimentally established UDP-Glc-dependent beta-1,4-glucan synthase (GO:0016760, ACCEPT; PMID:32169960 reconstitution) at the apical plasma membrane of root hairs (PMID:21765420). Both mannan synthase rows (IDA PMID:21904114, ARBA IEA) REMOVEd: CSLD3 alone was inactive in the microsome assay (PMID:21471331) and purified CSLD3 does not use GDP-Man. Golgi apparatus rows MODIFY to Golgi membrane; membrane MODIFY to plasma membrane; cytoplasm/endomembrane TOO_GENERAL; cold response (IEP, ARBA) MARK_AS_OVER_ANNOTATED; ER/TGN/endosome kept non-core. NEW root hair elongation (GO:0048767) with participation and comparator (CSLD2 IMP) checks. Noted PAINT did not propagate cellulose synthase activity to the CSLD lineage (PTN001410221 carries only PM and primary wall biogenesis).
