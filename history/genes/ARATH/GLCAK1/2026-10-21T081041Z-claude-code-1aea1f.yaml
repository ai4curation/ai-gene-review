  summary: 'Create review: GLCAK1 (Arabidopsis glucuronokinase 1)'
  details: |
    De novo full review of At3g01640, the experimental reference relative for wheat ProtNLM2 benchmark protein A0A3B6NKR6, done independently of any ProtNLM2 output. Falcon and perplexity deep research both failed (auth 403 / quota 401), so the review rests on primary literature: PMID:19951951 (full-text biochemistry), PMID:30102814 (CRISPR glcak1 flux genetics), PMID:23857351 and PMID:24586965 (context), plus PTHR38710 PANTHER/PAINT data (SF1 membership; GLCAK1 seeds the GO:0047940 IBD at PTN008680403). All 13 GOA rows reviewed. glucuronokinase activity and the 4 NOT sugar-kinase rows ACCEPTED. inositol metabolic process MODIFIED to UDP-glucuronate biosynthetic process. cytoplasm MODIFIED to cytosol. cytosol IBA ACCEPTED. ATP binding and cell wall biogenesis KEEP_AS_NON_CORE. poly(U) RNA binding MARK_AS_OVER_ANNOTATED. pollen tube development (expression-only TAS) REMOVED. Notes record which functions are experimental in Arabidopsis and which are inferred.
