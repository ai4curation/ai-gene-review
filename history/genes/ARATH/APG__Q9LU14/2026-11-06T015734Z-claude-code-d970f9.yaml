  summary: De novo review of Arabidopsis APG/AT3G16370 (Q9LU14), testing the PTN005219546
    GO:0008610 IBD on a leaf
  details: |
    First review of UniProtKB:Q9LU14 (APG2_ARATH, AT3G16370, GGL19/AtGELP67). Fetched by accession with --alias APG__Q9LU14 because 'just fetch-gene ARATH APG' resolves to the different entry P40602 (AT1G20130, anther-specific proline-rich protein APG); folder follows the SYMBOL__ACCESSION convention.

    Purpose: test, from the leaf side, the claim in genes/PSEAE/estA that the GO:0008610 lipid biosynthetic process IBD at PANTHER node PTN005219546 does not fit the clade.

    Findings. (1) Nothing in this gene's own literature or curated record supports a lipid biosynthetic role. No experimental function annotation of any kind; PubMed 'At3g16370' returned 0 hits and Europe PMC full-text 'AT3G16370' 17 hits, all transcriptome/proteome surveys plus PMID:34621289, which reports promoter-GUS expression for GGL19 and nothing else (GGL19 was neither localised nor phenotyped there). (2) Node topology re-checked with projects/PSEUDOCAP/panther_tree.py: PTN005219546 is a SPECIATION node at LUCA, 960 leaves, 952 eukaryotic (940 Viridiplantae) and 8 eubacterial; GO:0008610 IBD sole seed UniProtKB:O33407; 885 leaf IBAs across 48 taxa per QuickGO. (3) Correction to the estA review: the clade is NOT devoid of biosynthetic evidence. OSP1/AT2G04570 (Q9SJB4, PTHR45642:SF32), a leaf of the same node, is experimentally required for cuticular wax synthesis and has thioesterase activity on C22:0/C26:0 acyl-CoAs (PMID:32542680), curated by TAIR as GO:0016297 IDA with no BP term. It is 892 leaves away (MRCA PTN008693276) and angiosperm-specific, so it cannot license a LUCA-level IBD. Verdict: GO:0008610 row MARK_AS_OVER_ANNOTATED, node defect reported to GO_CENTRAL.

    Other actions: GO:0052689 IBA ACCEPT as core MF; GO:0048046 apoplast HDA ACCEPT (corroborated by PMID:37876907, PMID:25852701, PMID:26862584); GO:0005576 IEA ACCEPT (apoplast is not a GO descendant of extracellular region, checked via OLS); GO:0003824 and GO:0016788 TOO_GENERAL; GO:0009507 chloroplast ISM REMOVE as a wrong AtSubP prediction. Also flagged UniProt's use of the gene name APG for this entry as a probable naming carry-over from P40602.

    Follow-up for the estA review and projects/PSEUDOCAP: its defect text asserting that no clade member has evidence for lipid biosynthesis should be amended, and a narrow plant-clade IBD seeded from OSP1 considered instead.
