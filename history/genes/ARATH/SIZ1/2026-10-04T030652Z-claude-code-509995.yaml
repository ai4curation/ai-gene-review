  summary: 'Create review: SIZ1 (Arabidopsis)'
  details: |
    Reviewed all 43 GOA annotations for Arabidopsis SIZ1 (Q680Q4), the plant SP-RING/PIAS SUMO E3 ligase, against cached primary literature (15 annotation papers plus 5 newly cached PMIDs) and the OpenScientist deep research report. Actions: 21 ACCEPT, 11 KEEP_AS_NON_CORE, 5 MODIFY, 4 MARK_AS_OVER_ANNOTATED, 2 REMOVE. Key decisions: heat acclimation -> response to heat (paper shows basal not acquired thermotolerance); detection of phosphate ion -> regulation of cellular response to phosphate starvation; ABA regulation -> negative regulation; protein binding with SCE1 -> ubiquitin-like protein conjugating enzyme binding, GTE3/GTE5 rows removed; SA-dependent cell division/cell growth and secondary pollen tube guidance marked over-annotated. Core functions: SUMO ligase activity in protein sumoylation plus substrate-specific roles (PHR1, ICE1, ABI5/MYB30, NIA1/2, FLD). Validated with just validate ARATH SIZ1.
