  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (EIN2-phylo.yaml, from `just phylo ARATH EIN2`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0006879 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree EIN2 is inside the clade the 12 seeds span, but the seeds are 3 orthologs across later duplications and 9 paralogs of EIN2; the tree cannot show whether EIN2 kept the transport-based function, so the verdict rests on the absence of detected metal transport, not on placement.
    - GO:0030026 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree EIN2 is inside the clade the 4 seeds span, and the seeds are 3 orthologs across later duplications and 1 paralog of EIN2; the tree does not show whether EIN2 kept metal transport, so the verdict rests on the absence of detected transport and of manganese-specific evidence.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The file is listed under references. The review validates after the edit.
