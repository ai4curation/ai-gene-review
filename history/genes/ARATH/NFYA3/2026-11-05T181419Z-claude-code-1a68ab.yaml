  summary: Re-filed 1 InterPro2GO source defect from GOA_EBI to INTERPRO
  details: |
    Re-filed 1 source defect on this review to a resource whose per-resource
    report the defect can actually reach. No other field changed.

    - WRONG_QUALIFIER: resource GOA_EBI -> INTERPRO. asserted_value enables.
      Fix is to the InterPro2GO mapping, which the schema assigns to INTERPRO.

    The test applied is the one SourceResourceEnum's own INTERPRO description
    sets: the fix is to the entry's GO mapping or its description, not to any
    gene's annotation. Every defect re-filed here asks for an InterPro2GO
    mapping to be withdrawn, re-pointed, restricted to a subfamily, or added,
    so the fix lands at InterPro and the per-resource report should route
    there.

    This one was filed GOA_EBI rather than OTHER, so it was already reaching a
    report - just the wrong one. GOA_EBI is GOA's own curation; an InterPro2GO
    mapping that GOA merely materialises is not. Left alone where the ask is
    genuinely GOA's: genes/worm/dpm-1 asks for a minimum-coverage requirement
    before InterPro2GO transfer, which is the transfer pipeline rather than
    the mapping, and keeps resource: GOA_EBI.

    Batch re-filing on branch source-defect-other-migration, the migration
    deferred from PR #5984. Only the resource value changed: defect_type,
    requested_change, slot, asserted_value, corrected_value, cause,
    confidence, explanation and supported_by are untouched, and no annotation,
