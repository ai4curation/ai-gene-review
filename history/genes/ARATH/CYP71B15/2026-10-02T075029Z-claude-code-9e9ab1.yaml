  summary: 'Create review: CYP71B15'
  details: |
    Curated all 32 GOA rows for CYP71B15/PAD3, the bifunctional ER P450 that converts Cys(IAN) to dihydrocamalexic acid and then to camalexin. Actions: 13 ACCEPT, 8 KEEP_AS_NON_CORE, 4 MARK_AS_OVER_ANNOTATED, 2 MODIFY, 2 REMOVE, 3 UNDECIDED, 0 NEW. Key changes: membrane rows modified to endoplasmic reticulum membrane; ER lumen IDA left UNDECIDED because it conflicts with type-I P450 topology and its source PMID:33831160 does not resolve in PubMed or Europe PMC; verifiable protein-binding IPI rows from the metabolon paper removed as uninformative; IEP rows for drought, ABA and regulation of SAR marked over-annotated; iron ion binding marked over-annotated (heme iron). Core functions: dihydrocamalexic acid decarboxylase activity in camalexin biosynthesis, and defense response to fungus as the physiological role. A new MF term, dihydrocamalexate synthase activity (RHEA:10452), is proposed for the Cys(IAN) step. Added PMID:10476063 and PMID:12848825. just validate passes with one unavoidable warning (unfetchable PMID:33831160), so status is DRAFT.
