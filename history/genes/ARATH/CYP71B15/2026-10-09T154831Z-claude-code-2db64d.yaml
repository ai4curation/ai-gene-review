  summary: ER lumen row to ER membrane, matching CYP71A12/A13
  details: |
    Changed the GO:0005788 ER lumen IDA (PMID:33831160, deleted duplicate of PMID:31511315) from UNDECIDED to MODIFY with GO:0005789 ER membrane. A full-text reading of Mucha 2019 recorded in the merged CYP71A13/CYP71A12 reviews shows the evidence is confocal colocalization of CYP71A12, CYP71A13 and CYP71B15 fusions with the ER luminal marker RFP-HDEL, which cannot separate lumen from membrane; PAD3 has a single N-terminal anchor and a cytosol-facing catalytic domain. Removed the now-answered suggested question about the row's basis.
