  details: |
    New review of Arabidopsis MVP1/ERMO3/GOLD36/NUC (Q7XA74), a catalytically inactive GDSL-lipase-like secretory protein required for ER morphology. Reviewed 18 GOA rows using full text of PMID:23155454 and PMID:19880612 and abstracts of the other papers: accepted ER organization (IBA/IMP), ER and vacuole locations and the NOT lipase activity IBA; kept the ER-to-Golgi and intracellular protein transport IMP rows and ER body as non-core (transport defects secondary to ER disorganization); marked the tonoplast IDA and plasmodesma HDA as over-annotated; removed the AtSubP chloroplast ISM and the InterPro2GO ester-hydrolase IEA (pseudoenzyme) with source defects, plus a UniProt CHECK on the G59S 'restored lipase activity' feature; added plant-type vacuole lumen (IDA) as NEW. Core function: ER organization in the ER, molecular activity unknown.
