  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (JMJ25-phylo.yaml, from `just phylo ARATH JMJ25`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0003712 (MARK_AS_OVER_ANNOTATED): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree the term sits at the family root while both seeds, mouse Kdm3a and Hr, fall in one vertebrate duplication clade 7 steps below it, and JMJ25 is outside that clade, 19 steps and 3 duplications from the root at 28% identity or less, which agrees with a mammal-specific role propagated too deep.
    - GO:0031490 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the gene is itself a seed and the other seed, JMJ29, is a paralog at 46% identity, as the review states; both sit in an angiosperm clade 9 steps below the family root where the term was placed, and the verdict rests on what ChIP can show.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
