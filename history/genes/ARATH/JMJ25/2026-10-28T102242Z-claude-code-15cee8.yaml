  summary: 'Create review: JMJ25'
  details: |
    Created the IBM1/JMJ25 (Q9SSE9) review from cached literature (full text of PMID:22772985, 27697902, 19262562, 24404182, 33986281, 41036628; abstracts of others) and the UniProt record. Core function is H3K9me2/me1 demethylase activity (GO:0140683) in nucleus/chromatin, keeping transcribed genes free of ectopic H3K9me2 and CHG methylation. General H3K9 demethylase, catalytic and regulation-of-gene-expression rows were modified to the specific terms; ChIP-based chromatin DNA binding, ARBA DNA binding and IBA coregulator rows marked over-annotated; the ARBA heterochromatin formation row was sign-corrected to negative regulation of heterochromatin formation with source defects recorded, including a suspected UniProt misattribution of TE silencing to IBM1. Developmental phenotype rows kept as non-core.
