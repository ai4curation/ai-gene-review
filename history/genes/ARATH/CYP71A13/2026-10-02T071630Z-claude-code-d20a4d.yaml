  summary: Resolve PMID:33831160 as duplicate of PMID:31511315; ER lumen -> ER membrane
  details: |
    PubMed redirection notice (provided by the project lead): PMID:33831160 was deleted as a duplicate of PMID:31511315 (Mucha et al. 2019). Recorded replacement with reason DUPLICATE_RECORD and is_invalid on the old reference. Mucha full text (PMC6881122, not cacheable) shows ER localization by colocalization with the lumenal marker RFP-HDEL and describes these P450s as ER-membrane anchored and cytosol-facing, so the GO:0005788 ER lumen IDA changed from UNDECIDED to MODIFY -> GO:0005789 endoplasmic reticulum membrane. Suggested question rewritten as a TAIR curation query (also affects CYP71B15).
