  summary: 'Full re-review: FTSH12 (A0A1P8ARD2 alternative gene model)'
  details: |
    Full re-review independent of ProtNLM output. Bioinformatics script now reads the sequence from the UniProt flat file instead of a prediction-source JSON; A0A1P8ARD2 recorded as a 991-aa alternative gene model identical to Q9SAJ3 over 1-983 with a different 8-aa C-terminus and all features retained. Peptidase/metalloendopeptidase/proteolysis rows changed from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE (intact, conserved HEXXH/D849 zinc site but no demonstrated substrate; H769Y complements). Added NEW part_of Ycf2/FtsHi complex (GO:0062091), contributes_to chloroplast protein-transporting ATPase activity (GO:0016464) and involved_in protein import into chloroplast stroma (GO:0045037) from PMID:30309901; core function now uses contributes_to GO:0016464 in GO:0062091. Flagged PAINT PTN000554085 mitochondrial m-AAA propagation to canonical Q9SAJ3 as a placement concern, since Kikuchi et al. derive FTSH12 from the cyanobacterial FtsH/FtsHi clade. Removed the reference to the prediction-source file; rewrote the notes.
