    Correction to record 2026-10-21T113916Z-claude-code-8b6eb7, which says NEW part_of Ycf2/FtsHi complex (GO:0062091) and involved_in protein import into chloroplast stroma (GO:0045037) rows were added. Both rows were withdrawn before commit and are not in FTSH12-ai-review.yaml. The canonical product of AT1G79560, FTSH12__Q9SAJ3, already carries these annotations in GOA (TAIR IDA GO:0062091, IMP GO:0045037, PMID:30309901), and GOA attaches experimental annotations to one product per gene. The terms remain in core_functions (with contributes_to GO:0016464), supported by the literature, which applies to both gene models (identical over residues 1-983). This follow-up adds a sentence to that core-function description explaining why no annotation row exists. The three protease rows here stay MARK_AS_OVER_ANNOTATED; the canonical review was brought into line with them.
