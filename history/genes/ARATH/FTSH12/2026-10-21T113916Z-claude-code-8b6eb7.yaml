  summary: 'Full re-review: FTSH12 (A0A1P8ARD2 alternative gene model)'
  details: |
    Full re-review, independent of the ProtNLM2 predictions. Recorded that A0A1P8ARD2 is a 991-aa alternative AT1G79560 gene model identical to canonical Q9SAJ3 over residues 1-983 (divergent C-terminal tail only; all motifs retained), via new compare_gene_models_rereview.py / RESULTS-rereview.md. Kept the three protease rows MARK_AS_OVER_ANNOTATED with added evidence (no FtsH12 pore-loop residues, PAINT/TAIR-ISS context on the canonical entry). Re-grounded ATP binding and ATP hydrolysis ACCEPTs on Walker A/B motifs. Kept cytoplasm MODIFY to chloroplast inner membrane. Added NEW part_of Ycf2/FtsHi complex (GO:0062091) and involved_in protein import into chloroplast stroma (GO:0045037). Rewrote the description and core functions (contributes_to GO:0016464, in_complex GO:0062091). Kept the old RESULTS.md and protnlm-source references but no longer cite them as support. Flagged the mitochondrial m-AAA PAINT IBA rows on Q9SAJ3 for the canonical review.
