  summary: 'Create review: IAMH2'
  details: |
    De-novo review of IAMH2 (AT4G37560; UniProt F4JS40) requested by the user. Automated deep research failed (no provider API keys), so the literature was searched manually via PubMed and documented in IAMH2-notes.md. Cached full text of PMID:32327358 (Gao et al. 2020) and PMID:42844995 (X. Gao et al. 2026; the user-supplied PDF matched the PMC text). Decisions: cytosol HDA ACCEPT; GO:0016811 IEA MODIFY to GO:0043864 indoleacetamide hydrolase activity; NEW GO:0009684 indoleacetic acid biosynthetic process (IMP, PMID:42844995), after a comparator check against AMI1/TAA1/YUC7 in QuickGO. Caveat: no in vitro assay of purified IAMH2 has been reported.
