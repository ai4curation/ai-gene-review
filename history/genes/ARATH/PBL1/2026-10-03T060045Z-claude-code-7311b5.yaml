  summary: 'Create review: PBL1'
  details: |
    Curated all 15 GOA annotations for Arabidopsis PBL1 (At3g55450, RLCK-VII, BIK1 paralog): 10 ACCEPT, 1 KEEP_AS_NON_CORE (cytosol HDA), 1 MODIFY (GO:0004672 to GO:0004674), 1 MARK_AS_OVER_ANNOTATED (regulation of defense response to bacterium; PMID:25522736 states PBL1 is not needed for flg22-induced Pseudomonas resistance), 3 REMOVE (chloroplast ISM; two bare protein binding IPIs for FLS2 and PEPR1). Core function: plasma-membrane myristoylated Ser/Thr kinase relaying FLS2/EFR/PEPR/MIK2 signalling to Ca2+ and root-growth outputs, with direct PHT1;1/1;4 and CAX1/3 substrates. Added references for Dindas 2022, Wang 2024, Hou 2021, Kadota 2014. Noted that direct RBOHD phosphorylation by PBL1 and a role in chitin signalling are not established (pbl1 has normal chitin Ca2+ response). Validation passes with no warnings.
