  summary: New review of GLH3 (AT5G55720), trichome papilla pectate lyase
  details: |
    Created the GLH3 review with just fetch-gene ARATH Q9FM66 --alias GLH3; UniProt lists no GLH3 symbol, and the locus came from the TAIR gene aliases file (gene_aliases_20260930). Deep research (falcon, fallback perplexity-lite) failed because no provider API keys were set; the literature was gathered manually from PubMed and recorded in GLH3-notes.md. The key cloning paper PMID:42555921 (2026) is cached abstract-only. Reviewed 4 GOA rows: ISM extracellular region MODIFY to plant-type cell wall (GLH3-GFP accumulates in papillae); IBA and IEA pectate lyase activity ACCEPT; IEA pectin catabolic process ACCEPT. Added NEW GO:1905499 trichome papilla formation (IMP, PMID:42555921) after the participation and comparator checks (MED25, MED16 and ECR already carry it from PMID:24014871). Added a bioinformatics check (GLH3-bioinformatics) showing conservation of the catalytic Arg and Ca2+-binding Asp residues against the A. nidulans PAINT seeds.
