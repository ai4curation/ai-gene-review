  summary: 'Create review: EIP9 (SDJ1, At5g64360)'
  details: |
    De-novo review of EIP9/SDJ1 (Q9FMF3) as the experimentally characterised SF19 reference for ProtNLM2 benchmark gene ABRPR/A0A8B8L1Z3; ProtNLM2 output was not consulted. Corrected stub accession (fetch-gene resolved B9DFS0; re-fetched with Q9FMF3). Falcon deep research failed (auth) and perplexity-lite fallback failed (quota); review is based on cached PMIDs 30523112 (full text), 33445404 (full text), 30589221, 21700722, 34185870, 40331371. GO:0001228 (IBA, IDA) MODIFY to GO:0003713 transcription coactivator activity because SDJ1 is recruited to methylated DNA by SUVH1/SUVH3 and has no DNA binding of its own; four GO:0005515 rows removed per protein-binding policy; nucleus and positive regulation of Pol II transcription accepted; cytoplasm, flowering and RdDM methylation rows kept as non-core. Added J-domain HPD-motif analysis (EIP9-bioinformatics/) showing HPD is absent, so Hsp70 co-chaperone activity is not inferred.
