  summary: Audit 2 ProtNLM prediction assessments against source-independence guidelines
  details: |
    Audited genes/ARATH/F4JLB7/F4JLB7-protnlm-predictions-review.yaml against the source-independence and final-state prose guidelines in .claude/skills/review-function-prediction/SKILL.md.

    Replaced rationale prose with the current assessment, traced biological claims to sequence/domain records, primary publications, and where relevant experimentally grounded curated annotations or reproducible analysis. Removed AI/OpenScientist verdicts as supporting evidence and unsupported error-mechanism claims. Source prediction terms and method/version metadata were preserved. Existing annotation overlap is separated from biological correctness and is not evidence of training-data contamination.

    GO:0016310 (phosphorylation): PLI -> UNC. The deposited sequence contains an N-terminal signal peptide and leucine-rich repeats but no protein kinase domain. This architecture does not support intrinsic kinase activity. However, the cached IBA signaling receptor annotation leaves open participation in phosphorylation through an associated kinase or signaling complex. The predicted biological process is absent from the cached annotations, and no pathway evidence establishes or excludes that participation.

    GO:0016301 (kinase activity): PLI -> NPI. The 450-residue deposited protein comprises a signal peptide and an LRR-rich receptor-like region, with no kinase catalytic domain. The cached IBA assignment is signaling receptor activity, consistent with that architecture. A kinase activity cannot be transferred from an LRR-containing multidomain kinase merely through the shared LRR region. The sequence provides contrary evidence to intrinsic kinase activity; the RIC7 name in the record does not establish a CRIB-domain ROP effector identity.

    Validation: all 50 PredictionReview documents passed LinkML schema validation; all 77 predictions preserve their original source/term metadata and have category-consistent scores. Checked local evidence paths, cached PMID titles, and all 31 supporting excerpts against their sources. Substantive fields contain current reasoning; revision details are recorded here.

    Follow-up: reconcile the separate main gene-review YAML with the evidence limitations identified in this prediction audit. This session does not change its curation decisions or biological synthesis.
