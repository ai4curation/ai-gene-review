  summary: 'Create review: MPK18'
  details: |
    De-novo review of Arabidopsis MPK18 (Q9C5C0) as the experimentally characterised relative of melon A0A1S3BTE3, independent of ProtNLM2 predictions. Deep research failed (falcon auth error; perplexity-lite 403), so the review rests on UniProt and cached papers (PMID:19392697, PMID:28848569 full text). All 26 GOA rows reviewed. MAP kinase activity accepted as core but flagged as inferred (no MPK18 kinase activity or substrate shown; MPK18 did not phosphorylate MBP). MAPK cascade UNDECIDED (only non-canonical MKKK20-to-MPK18 phosphorylation known). Cortical microtubule organization IMP modified to regulation of microtubule cytoskeleton organization. PHS1 and MKKK20 protein-binding rows modified to protein phosphatase/kinase binding; HT-Y2H DELLA/BRX rows removed per policy. Nucleus non-core, cytoplasm accepted.
