  summary: Record OpenScientist analysis of MPK18 catalytic competence and why sequence
    cannot nominate its substrates
  details: |
    Ran an OpenScientist deep-research job (kgap-mpk18-catalytic-competence) on the knowledge gap covering MPK18's undemonstrated kinase activity and unknown substrate. It separates the two halves of the gap: the catalytic machine is intact, and the substrate half is blocked for a stated clade-level reason rather than merely unexamined.

    Every catalytic element of the kinase domain is present and canonical, and all were confirmed in the local Q9C5C0 record: GKGSYG at 32-37, VAIK with Lys54 at 51-54, Glu72, HRDLKPKN at 149-156 with Asp151, DFG at 169-171, TDY at 187-189, APE at 197-199, with the activation segment DFGLARVAFNDTPTTVFWTDYVATRWYRAPE. The scan carries a working negative control inside the same clade, since the paralog MPK17 carries DLG in place of DFG. A curation trap worth recording: the local sequence also contains FFTEYGD at 15-21, so a full-sequence TEY regex miscalls this TDY group D kinase as a TEY MAPK.

    On substrates the run returns the negative with a reason. The MPK18 common docking site is LSKIEREPS at 319-327 (confirmed locally), net charge zero, with a lysine where ERK2 carries the first of its two CD aspartates. The TEY clade averages +2.38 net acidity at that window against +0.38 for the TDY clade, and the split replicates in rice, so the degeneracy is a conserved group D architecture rather than a lesion in MPK18. It therefore cannot be used to argue that MPK18 is not a genuine MAPK, and equally there is no canonical CD groove for transferring a docking-based substrate prediction. The DEF pocket is explicitly a failed control: MPK6, whose substrates are established, is the most diverged of every protein tested at those columns.

    The run also corrects two framing points: MKK3 does not interact with MPK18 and the MAP3K MKKK20 phosphorylates it directly, skipping the MAP2K tier; and the cortical microtubule phenotype has never been attributed to MPK18 catalysis, the primary paper offering the PHS1-MPK18 switch as a proposed model and assaying MPK18 only as a phosphoacceptor.

    One claim of the run is wrong and is corrected in the gap boundary. It states that no kinase assay exists with MPK18 as the enzyme and makes such an assay its first proposed experiment, but PMID:28848569, cached here and already cited in this review, reports that recombinant MPK18 alone did not autophosphorylate. Unactivated MAPKs commonly fail to autophosphorylate, so this does not refute the predicted competence; the outstanding experiment is specifically an assay on MKKK20-activated MPK18.

    The run independently corroborates a judgment this review had already made, that PMID:11544109 is a commentary that does not discuss MPK18 and cannot carry the GO:0004707 ISS. No annotation action was changed: the AlphaFold distances and pLDDT values, the Mann-Whitney statistics, the cross-species scan, the DEF-pocket column assignments and the QuickGO row counts were not recomputed here, and PMID:24120637, PMID:19095804 and PMID:42247714 are not cached. Gap status moved from unset to NARROWING; the reference is recorded as UNVERIFIED with the verified and unverified items listed.
