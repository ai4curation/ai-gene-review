  summary: 'Create review: FTSH12 (Q9SAJ3, At1g79560 canonical product)'
  details: |
    De-novo review of the Swiss-Prot canonical FTSH12 product as the experimental reference for the ProtNLM2 benchmark model A0A1P8ARD2, independent of ProtNLM2 output. Falcon and perplexity-lite deep research failed (auth/quota), so evidence came from cached full texts (PMID:30309901, PMID:33216923) and a sequence motif check. Core function set to contributing to chloroplast protein-transporting ATPase activity as a Ycf2/FtsHi motor subunit in the inner envelope. Removed m-AAA complex and mitochondrial protein processing IBAs (mitochondrial node, compartment mismatch), thylakoid membrane (contradicted; UniProt source defect), plasma membrane ISM and six bare protein binding rows; peptidase/proteolysis/ATP hydrolysis kept non-core as sequence-only inferences since the zinc site is dispensable; general plastid locations modified to chloroplast inner membrane.
