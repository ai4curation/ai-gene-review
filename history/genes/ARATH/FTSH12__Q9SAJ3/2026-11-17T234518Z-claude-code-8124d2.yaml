  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (FTSH12__Q9SAJ3-phylo.yaml, from `just phylo ARATH FTSH12__Q9SAJ3`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0004222 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the 2 seeds, both orthologs across later duplications, sit in one branch whose common ancestor is 6 steps below the family-root node, and FTSH12 is outside that clade; the verdict rests on the unmeasured activity and dispensable zinc site, which the tree cannot settle.
    - GO:0005745 (REMOVE): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree all 9 seeds sit in one branch whose common ancestor is an Opisthokont speciation node 2 steps below the PAINT node, and FTSH12 is outside that clade, the seeds being orthologs across later duplications; this agrees that the mitochondrial m-AAA complex belongs to a lineage FTSH12 is not in.
    - GO:0034982 (REMOVE): the tree agrees with the stated reason. Added to the reason: In the PANTHER 19.0 tree all 6 seeds sit in one branch whose common ancestor is a duplication node before Eumetazoa 4 steps below the PAINT node, and FTSH12 is outside that clade, the seeds being orthologs across later duplications; this agrees that mitochondrial protein processing belongs to a lineage FTSH12 is not in.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The file is listed under references. The review validates after the edit.

    Some rows of this review shared a supported_by list through a YAML alias. The list was written out in full in each of them so that the new quotes go to one row only; the content of the other rows is unchanged.
