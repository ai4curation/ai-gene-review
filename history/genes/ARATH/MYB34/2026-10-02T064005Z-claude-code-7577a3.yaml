  summary: New review of MYB34 (ATR1) for ARATH_SINGLE_CELL_FUNGAL project
  details: |
    De novo review of 17 GOA annotations: 10 ACCEPT, 2 MODIFY (GO:0009759 -> GO:0010439 regulation of glucosinolate biosynthetic process; GO:0000162 -> GO:2000284 positive regulation of amino acid biosynthetic process, gain-of-function evidence only), 1 KEEP_AS_NON_CORE (defense response to insect), 3 MARK_AS_OVER_ANNOTATED (response to stress, cellular response to sulfur starvation, response to other organism - MYB34 is not pathogen/wound induced, unlike MYB51/MYB122), 1 REMOVE (protein binding), plus NEW GO:0010439 (IMP) and GO:0001228 (IDA). Proposed term: positive regulation of indole glucosinolate biosynthetic process. Synthesized from mutant/overexpression/metabolite, promoter trans-activation, Y1H and partner-interaction literature plus falcon deep research; Tang et al. 2023 used as context (MYB34 not induced at infection sites).
