  summary: 'Create review: AT4G38370__F4JTN4 (F4JTN4)'
  details: |
    De-novo review of the At4g38370 reference-proteome entry F4JTN4 (identical sequence to Q0WW53), done independently of ProtNLM2 predictions. Reviewed the 3 TAIR GOA rows: ND MF and ND BP accepted (no experimental data; literature rechecked), nucleus ISM (AtSubP) left UNDECIDED (single classifier prediction, no NLS or signal peptide found by new sequence_features.py). PTHR47821 has no characterised member and no PAINT annotations, so no function was transferred; core function is predicted histidine-dependent phosphotransfer catalysis (His17/Glu109/His173 retained) with no GO MF asserted. Falcon deep research failed (auth error; perplexity fallback out of quota); the same-locus falcon report in genes/ARATH/AT4G38370 was cited instead.
