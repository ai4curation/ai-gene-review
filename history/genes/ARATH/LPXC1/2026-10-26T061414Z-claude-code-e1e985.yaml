  summary: 'Create review: LPXC1'
  details: |
    Created the full review of Arabidopsis LPXC1, one of five tandem LpxC (UDP-3-O-acyl-GlcNAc deacetylase) paralogs, treated consistently across the cluster. LPXC1 (At1g24793) encodes AtLpxC1.1, the only locus-specific construct in Li et al. 2011 (mitochondrial GFP fusion); this review also hosts the shared cluster notes and a reproducible bioinformatics check (LPXC1-bioinformatics) showing the five canonical AtLpxC products are 100% identical and conserve all E. coli LpxC Zn ligands and catalytic residues. Deacetylase MF (IBA/IEA/ISS/IMP), mitochondrion and lipid A biosynthetic process rows were accepted, refuting the Wei et al. 2020 RAR misannotation flag. The AtSubP chloroplast ISM row was removed as contradicted by GFP. The obsolete lipid X metabolic process rows were modified to lipid A biosynthetic process. No NEW rows, because every experimentally supported term is already in GOA for this locus.
