  summary: 'Create review: IAMH1'
  details: |
    De-novo review of IAMH1 (AT4G37550; UniProt A0A178UXH8, the accession that carries TAIR's GO annotations) requested by the user. Automated deep research failed (no provider API keys); the literature was searched manually and documented in IAMH1-notes.md. Decisions: cytosol HDA ACCEPT; plant-type vacuole and plasma membrane HDA KEEP_AS_NON_CORE; chloroplast ISM (AtSubP) MARK_AS_OVER_ANNOTATED; GO:0016811 IEA MODIFY to GO:0043864 indoleacetamide hydrolase activity; NEW GO:0009684 indoleacetic acid biosynthetic process (IMP, PMID:32327358), with the caveat that the evidence concerns exogenous or iaaM-derived IAM.
