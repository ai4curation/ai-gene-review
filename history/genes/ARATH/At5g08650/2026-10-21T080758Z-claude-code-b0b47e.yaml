  summary: 'Create review: At5g08650 (cpLEPA)'
  details: |
    De-novo review of Arabidopsis chloroplast LepA/EF4 homolog (Q9FNM5), independent of ProtNLM2 predictions, as the experimental reference for ARTAN/A0A2U1PS28. Falcon deep research failed (auth) and perplexity-lite fallback failed (quota), so the review uses cached literature (PMID:23166764 full text, E. coli LepA PMID:17110332, yeast Guf1 PMID:18442968) and a new sequence comparison (At5g08650-bioinformatics) confirming PANTHER PTHR43512:SF4 placement with E. coli LepA, separate from mitochondrial GUF1 (SF7). All 11 GOA rows reviewed: GTPase/GTP binding, chloroplast, ribosome binding and positive regulation of translation accepted (IBA node PTN002460656); mRNA binding (RIC) kept as non-core; plasma membrane (HDA) and TOC132 protein domain specific binding (import-substrate interaction) marked over-annotated. NEW: chloroplast thylakoid membrane (IDA) and plastid translation (IMP) from PMID:23166764. Review separates experimentally established functions (location, requirement for plastid protein synthesis) from inferred ones (GTPase, ribosome binding, back-translocation).
