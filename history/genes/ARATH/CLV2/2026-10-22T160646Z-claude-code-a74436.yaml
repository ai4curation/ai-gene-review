  summary: CLE-peptide binding rows changed from MODIFY (peptide hormone binding)
    to UNDECIDED after OpenScientist adjudication of direct CLV2-CLV3 binding
  details: |
    Nine GO:0005515 IPI rows whose partners are CLE peptides (eight from PMID:20626648, one CLE14 row from PMID:28586647) previously proposed MODIFY to GO:0017046 peptide hormone binding. Direct CLE binding by CLV2 is contested between radioligand binding (PMID:20626648, Kd about 32 nM) and photoaffinity labelling with arabinosylated CLV3 (PMID:25754504, no binding). An OpenScientist run (CLV2-hypotheses/clv2-direct-clv3-binding) judged binding refuted, but its key premise that the 2010 peptide was non-arabinosylated is not stated in the 2010 paper, so the verdict was not adopted; the report is cited with correctness DISPUTED. All nine rows set to UNDECIDED with both lines of evidence; core function (coreceptor activity) unchanged. Decisive experiment: quantitative binding of purified CLV2 ectodomain to arabinosylated and non-arabinosylated CLV3 with CLV1 as positive control.
