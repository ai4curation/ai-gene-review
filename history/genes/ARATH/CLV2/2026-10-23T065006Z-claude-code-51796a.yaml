  summary: Corrected UNDECIDED reasoning on CLV2 CLE-binding rows after PR review
  details: |
    Review on PR #5336 found two errors in the first pass. (1) Guo et al. 2010 (PMID:20626648, full text) do address peptide modification in their Discussion, attributing binding-vs-genetics inconsistencies to CLE peptides needing posttranslational modification in vivo; the reasons and the OpenScientist review_notes had said the paper was silent. (2) PMID:22241782 (TMM binds EPF2) is cached with full text; it had been described as not cached. The eight PMID:20626648 UNDECIDED reasons now rest on the tracer probably being unmodified yet still binding CLV1, host-partner co-purification not excluded, PMID:25754504 being abstract-only, and TMM showing kinase-less LRR receptor-like proteins can bind peptides directly. Added PMID:22241782 to references and supporting text, quoted Guo's Discussion, and replaced the OpenScientist file: quote with its self-contained verdict sentence. Actions unchanged (UNDECIDED); core function unchanged.
