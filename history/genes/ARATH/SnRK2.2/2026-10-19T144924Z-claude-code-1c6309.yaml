  details: |
    New review of Arabidopsis SnRK2.2/SRK2D (Q39192, At3g50500), a subclass III SnRK2 ABA- and osmotic-stress-activated Ser/Thr kinase. All 36 GOA rows reviewed: 18 ACCEPT, 3 KEEP_AS_NON_CORE (salt stress x2, response to gibberellin), 3 MODIFY (kinase activity and protein kinase activity refined to protein serine/threonine kinase activity GO:0004674), 12 REMOVE (bare protein binding IPI rows per policy). One NEW row: abscisic acid-activated signaling pathway (GO:0009738), justified by participation (SnRK2.2 phosphorylates ABF/AREB/ABI5 bZIPs) and comparator check (paralogs OST1 and SnRK2.3 carry the term). gene_symbol set to SnRK2.2 following the OST1 precedent. No deep-research provider was available; literature notes written manually in SnRK2.2-notes.md and six additional PMIDs cached.
