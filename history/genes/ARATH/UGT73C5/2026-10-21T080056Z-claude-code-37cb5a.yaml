  summary: 'Create review: UGT73C5'
  details: |
    De-novo review of UGT73C5 (Q9ZQ94) as the experimentally characterised reference for the PTHR48047 UGT73C cluster (PAINT node PTN008730368), independent of ProtNLM2 predictions. Deep research failed (falcon auth error, perplexity quota); built from cached primary literature and curated UniProt. All 15 GOA rows reviewed: ACCEPT UDP-glucosyltransferase activity (IBA; target is a seed), brassinosteroid metabolic process and detoxification; MODIFY UDP-glycosyltransferase and glucosyltransferase rows to GO:0035251; zeatin and quercetin glucosyltransferase activities kept as non-core in vitro activities; hypoxia HEP and membrane IEA marked over-annotated; ER HDA kept non-core; AtSubP chloroplast removed. Core functions: brassinosteroid 23-O-glucosylation and deoxynivalenol detoxification. Notes record that PAINT propagated only the donor-level activity, so acceptor-specific activities must not be transferred to relatives in other subfamilies. Proposed new term brassinosteroid 23-O-glucosyltransferase activity.
