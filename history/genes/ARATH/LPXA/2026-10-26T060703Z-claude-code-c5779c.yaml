  summary: 'Create review: LPXA'
  details: |
    Full review of Arabidopsis LPXA (At4g29540, Q9SU91), the mitochondrial UDP-GlcNAc acyltransferase of the plant lipid A precursor pathway. All 13 GOA rows reviewed using full text of PMID:21709257 and PMID:22545860: LpxA activity (IDA/IBA/IEA) and mitochondrion (IDA/HDA/IBA/IEA) accepted; cytoplasm rows modified to mitochondrion; lipid biosynthetic process and the obsolete lipid X metabolic process rows modified to lipid A biosynthetic process; AtSubP chloroplast prediction removed (GFP not chloroplastic). Added NEW lipid A biosynthetic process (IDA, PMID:22545860; in vitro activity and E. coli lpxA complementation), refuting the Wei et al. 2020 RAR misannotation flag for this gene.
