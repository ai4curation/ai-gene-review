  summary: Retire duplicate ARATH/AAU94417 folder; canonical review is ARATH/AT1G06680
  details: |
    genes/ARATH/AAU94417 and genes/ARATH/AT1G06680 both reviewed UniProt Q42029 (PSBP1_ARATH; OrderedLocusNames=At1g06680). Neither folder is named by the gene symbol. AT1G06680 is kept because an AGI locus is a stable, species-standard identifier already used for 10 other ARATH folders, and it is the folder cited in hand-authored project pages (projects/BIOREASON_COMPARISON/article/supplemental-benchmark-details.md) and tests (tests/test_gogpt_compare_levels.py); AAU94417 is a GenBank protein accession, which no other ARATH folder uses. The AT1G06680 review also carries the falcon deep research evidence and the PAINT propagation reviews. The two reviews held conflicting verdicts on 23 of 32 shared rows; they were reconciled row by row in AT1G06680 (see the AT1G06680 EDIT record in the same PR). The duplicate's NAS NEW placeholder rows were not carried over. Its perplexity report moved to AT1G06680-deep-research-perplexity-lite.md.
