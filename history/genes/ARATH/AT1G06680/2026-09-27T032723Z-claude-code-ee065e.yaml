  details: |
    AT1G06680-goa.tsv and AT1G06680-uniprot.txt were refreshed from QuickGO/UniProt (34 rows). GOA now attributes GO:0009523 photosystem II and GO:0015979 photosynthesis to GO_REF:0000002 (InterPro2GO) instead of GO_REF:0000120, so the two stale GO_REF:0000120 rows were dropped and the new rows reviewed (both ACCEPT). A new ARBA IEA row GO:0009534 chloroplast thylakoid (GO_REF:0000117) was added and ACCEPTed. The IPI GO:0019904 row for PMID:24736607 is now split per partner (atToc159 O81283, atToc132 Q9SLF3); both are MARK_AS_OVER_ANNOTATED. gene_symbol was corrected from AT1G06680 to PSBP1 (UniProt Name=PSBP1), and status set to COMPLETE. The two reviews disagreed on 23 of 32 shared rows; each row was reconciled on its merits: general compartment rows (thylakoid, chloroplast, chloroplast thylakoid) stay ACCEPT rather than MODIFY to GO:0009543, which is already annotated; extrinsic component of membrane (IEA and TAS) takes the duplicate's ACCEPT; stroma HDA rows go to KEEP_AS_NON_CORE (import transit pool) instead of ACCEPT or the duplicate's REMOVE; apoplast, extracellular region and envelope HDA rows stay KEEP_AS_NON_CORE rather than the duplicate's REMOVE, because removal would overrule experimental curator annotations without evidence; salicylic acid binding HDA takes KEEP_AS_NON_CORE; calcium ion binding, mRNA binding, poly(U) RNA binding and protein domain specific binding stay MARK_AS_OVER_ANNOTATED, with specific reasons replacing boilerplate. Each changed row's reason names the verdict the duplicate proposed. core_functions are unchanged; the duplicate's two NAS NEW placeholder rows (GO:0140777, GO:0042549) had no evidence and were not carried over. The AAU94417 perplexity report moved to AT1G06680-deep-research-perplexity-lite.md.
