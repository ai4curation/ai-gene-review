  summary: 'Create review: At3g08840'
  details: |
    New review of Arabidopsis At-DDL (A0A1I9LPE3), a fused two-module D-Ala-D-Ala ligase homolog in the chloroplast stroma, done for projects/RAR_MISANNOTATION.md. All 7 GOA rows reviewed: D-alanine-D-alanine ligase activity IBA and IEA accepted (target inside the plant DDL clade; moss Pp-DDL is genetically shown to be a ligase; a reproducible residue check finds no Arabidopsis-specific loss of catalytic or Mg2+-binding residues relative to moss, though activity is untested); ATP binding and chloroplast (HDA) accepted; nucleotide binding, metal ion binding and cytoplasm modified to ATP binding, magnesium ion binding and chloroplast stroma. Concludes the Wei et al. 2020 BP flag (peptidoglycan biosynthesis, now gone from GOA) holds for Arabidopsis for plastid, not cell-wall, reasons, while the MF IBA is defensible. Added notes, bioinformatics script/results, and cached PMIDs 41351887, 28158764, 19647785, 18036201.
