  summary: 'Create review: PRORP2 (nuclear protein-only RNase P)'
  details: |
    De-novo review of all 15 GOA rows for Arabidopsis PRORP2, done as the experimental reference for the tobacco SF13 ortholog A0A1S3Y076 and independent of ProtNLM2 predictions. Deep research failed (falcon auth error, perplexity quota), so the review rests on primary literature: PMID:22549728 (full text re-fetched from PMC), 26655022, 20473316, plus newly cached 37945696, 28874505, 28696260, 28499021, 30414965. Accepted RNase P activity, tRNA 5'-leader removal and nucleus (experimental, IBA and IEA rows). Marked mRNA processing (IMP and IEA) as over-annotated, because the paper's in vivo mRNA (nad6) evidence is from PRORP1 VIGS plants, and recorded a PROBABLE TAIR WRONG_GENE_PRODUCT source defect with requested_change CHECK. Removed the chloroplast ISM prediction, which nuclear-only localisation contradicts. Kept snoRNA processing as non-core. Evolutionary grounding: PTHR13547:SF13 and PAINT node PTN001005190.
