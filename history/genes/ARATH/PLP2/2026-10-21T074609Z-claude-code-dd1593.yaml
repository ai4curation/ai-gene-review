  summary: 'Create review: PLP2 (O48723), reference relative for wheat A0A3B6GK97'
  details: |
    De-novo review of Arabidopsis PLP2/pPLAIIalpha (At2g26560), independent of ProtNLM2 predictions. Deep research failed (falcon auth; perplexity quota), so the review rests on cached literature (PMID:16297072, 19271961, 22259021, 12226489, 14634163) and UniProt. All 23 GOA rows reviewed: glycerophospholipase IBA and cytoplasm/membrane/PCD accepted; lipase activity MODIFY to glycerophospholipase + galactolipase activity; lipid metabolic process MODIFY to phospholipid catabolic process; chloroplast ISM removed (GFP cytosolic); peroxisome HDA undecided; generic protein binding removed; HR, oxylipin, virus, Cd, hypoxia kept non-core. Evolutionary scope recorded: PTHR32176:SF109; deep MF node PTN001282408 vs Brassicaceae-only HR node PTN004927362, so only catalytic activity should transfer to grass out-paralogs (SF103/SF26).
