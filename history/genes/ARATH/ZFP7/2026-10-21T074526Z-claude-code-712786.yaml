  summary: 'Create review: ZFP7'
  details: |
    De-novo review of Arabidopsis ZFP7 (Q39266) as the closest characterised relative of soybean C6T1A2, independent of ProtNLM2 predictions. Deep research (falcon, perplexity-lite fallback) failed with an authentication error; review is based on cached publications plus a PubMed search, adding PMID:38250442 (ZFP7 silencing and overexpression transcriptomics) and PMID:7599312 (cloning). All 18 GOA rows reviewed: transcription cis-regulatory region binding (IBA + five eY1H IPI), DNA-binding TF activity, nucleus (4 rows), regulation of transcription and the ABA negative-regulation term (IBA + overexpression IMP) accepted; glucosinolate metabolic process kept as non-core; two bare protein-binding rows (TCP13) removed per policy; bZIP1 heterodimerization left UNDECIDED (abstract-only). Core functions record that ZFP7's ABA evidence is gain-of-function only and that the ABA PAINT term sits on the ZFP7/ZFP4 node. Added a motif-scan bioinformatics folder (QALGGH finger, LxLxL EAR-like motifs) and a notes file.
