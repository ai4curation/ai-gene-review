  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (LCYB-phylo.yaml, from `just phylo ARATH LCYB`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0005739 (REMOVE): the reason made a claim the tree contradicts (The target is outside the clade that inherited the mitochondrial ubiquinone function -- the seeds sit in both branches below the node, the node is their common ancestor, and 2 seeds share LCYB's own branch (PTN008123702).). The reason was rewritten to correct it; the rest of its argument is kept.
    - GO:0006744 (REMOVE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree all 6 seeds sit in an Opisthokont clade 2 steps below the node that LCYB is outside, and the tree relates every seed to LCYB as an ortholog across later duplications; the review disputes the fold-based placement of LCYB in the COQ6 family, so that ortholog call does not refute it.
    - GO:0016491 (REMOVE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree all 3 seeds sit in an Opisthokont clade 2 steps below the node that LCYB is outside, as orthologs across later duplications; the verdict rests on the redox-neutral chemistry of lycopene cyclization and the scope of the term, which the tree cannot settle.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The file is listed under references. The review validates after the edit.
