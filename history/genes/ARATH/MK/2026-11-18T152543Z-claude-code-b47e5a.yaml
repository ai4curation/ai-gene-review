  summary: 'Create review: MK (Arabidopsis thaliana)'
  details: |
    New review of Arabidopsis mevalonate kinase MK (At5g27450, P46086; TAIR symbol MK). All 13 GOA rows reviewed (ISS, IBA and IEA only in GOA); experimental support added from Cho et al. 2022 (recombinant enzyme assay, cytosolic YFP in protoplasts, mvk-1/mvk-2 metabolite profiles) and Riou 1994 (yeast erg12 complementation). MK activity, IPP-via-mevalonate and cytosol rows accepted; cytoplasm IDA and IEA rows modified to cytosol; ATP and Mg2+ binding kept as non-core. A QuickGO check showed the Aryal 2014 cytosol HDA set also contains catalases, glycolate oxidase and HPR, so that row is accepted on the YFP evidence rather than the fraction. Validated with just validate (only UV_NATIVE_TLS noise warnings) and backfill-record-sections.
