  summary: 'Create review: MVD1 (Arabidopsis thaliana)'
  details: |
    New review of Arabidopsis diphosphomevalonate decarboxylase MVD1 (At2g38700, O23722). All 16 GOA rows reviewed. MDD activity and IPP-via-mevalonate rows (IBA, IEA, IDA from Dellas 2013 and Henry 2015, TAS from Lange 2003) accepted; carboxy-lyase marked TOO_GENERAL (signature shared with MPDs); identical protein binding modified to protein homodimerization activity (two-hybrid). Peroxisome rows (IDA Simkin 2011, UniProt IEA) accepted under the root-organelle policy. All three cytosol rows (HDA Aryal 2014, IBA from animal-seeded PTN000104601, InterPro2GO) marked over-annotated: a QuickGO check showed the Aryal cytosol HDA set also contains catalases, glycolate oxidase and HPR, so the fraction does not separate cytosol from peroxisomal matrix. Validated with just validate (only UV_NATIVE_TLS noise warnings) and backfill-record-sections.
