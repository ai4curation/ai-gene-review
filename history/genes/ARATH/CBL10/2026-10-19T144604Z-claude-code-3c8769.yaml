  details: |
    Created the CBL10/SCaBP8 (Q7FRS8) review from cached publications (5 new PMIDs cached: 19448033 full text, 19832944, 22253446, 26979332, 31858132) plus the UniProt record, with a manual research journal in CBL10-notes.md (no deep-research provider available). Reviewed all 23 GOA rows: 13 ACCEPT (calcium ion binding, detection of calcium ion, plasma membrane, plant-type vacuole membrane, calcium-mediated signaling, hyperosmotic salinity response), 2 KEEP_AS_NON_CORE (cytoplasm, endosome), 7 MODIFY (protein binding IPIs to protein kinase activator activity, protein kinase binding and potassium channel inhibitor activity; kinase binding to protein kinase activator activity; vacuolar membrane to plant-type vacuole membrane; regulation of K+ transport to negative regulation; monoatomic ion homeostasis to sodium ion homeostasis) and 1 REMOVE (nucleus ISM prediction). Four core functions: CIPK24/CIPK8 activation at the plasma membrane, tonoplast recruitment of CIPK24, Ca2+ binding, and CIPK-independent AKT1 inhibition. Validated with just validate ARATH CBL10 (valid; only environment warnings).
