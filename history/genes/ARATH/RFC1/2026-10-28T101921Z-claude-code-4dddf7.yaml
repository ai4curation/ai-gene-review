    Created the RFC1 (At5g22010, Q9C587) review from 15 GOA rows plus one NEW chromosome IDA row. Literature synthesis was manual (full text of PMID:23144629, PMID:20639449, PMID:29971074; abstracts of PMID:22974522, PMID:17556804, PMID:24053948). Clamp loader, RFC complex, nucleus, DNA replication, DNA repair and the meiotic recombination-intermediate IMP row were accepted; DNA damage response was refined to DNA repair and meiotic cell cycle to reciprocal meiotic recombination; DNA binding, ATP hydrolysis and the TGS-release epigenetic row were kept as non-core. Core functions record ATP binding with contributes_to DNA clamp loader activity in RFC, and the class I crossover role downstream of RAD51.
