  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (PHYB-phylo.yaml, from `just phylo ARATH PHYB`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0000155 (REMOVE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree 5 of the 9 seeds share PHYB's own branch below the node, and the seeds are 7 orthologs across horizontal-transfer nodes and 2 paralogs; the verdict holds in spite of the shared branch because it rests on loss of histidine kinase catalytic residues in the phytochrome lineage, which the tree cannot show.
    - GO:0000160 (REMOVE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree 5 of the 6 seeds share PHYB's own branch below the node, and the seeds are 5 orthologs across horizontal-transfer nodes and 1 paralog; the verdict holds in spite of the shared branch because it rests on the absent His-to-Asp phosphotransfer in PHYB signalling, which the tree cannot show.
    - GO:0005886 (REMOVE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree 4 of the 8 seeds share PHYB's own branch below the node, and the seeds are 6 orthologs across horizontal-transfer nodes and 2 paralogs; the verdict holds in spite of the shared branch because it rests on the seeds' transmembrane sensor domains, which PHYB lacks, a domain question the tree cannot settle.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The file is listed under references. The review validates after the edit.

    Some rows of this review shared a supported_by list through a YAML alias. The list was written out in full in each of them so that the new quotes go to one row only; the content of the other rows is unchanged.
