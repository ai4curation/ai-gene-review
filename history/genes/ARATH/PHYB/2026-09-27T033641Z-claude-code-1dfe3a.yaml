  details: |
    PHYB-goa.tsv and PHYB-uniprot.txt were refreshed from QuickGO/UniProt (116 rows). Eight rows no longer in GOA were dropped: IBA nucleus, IEA GO:0000160 (GO_REF:0000108), IEA GO:0003677 and GO:0010017 (GO_REF:0000043), IEA GO:0009585 and GO:0009881 (GO_REF:0000120, now GO_REF:0000002, reviews carried over as ACCEPT), IPI GO:0005515 PMID:11260718, and IMP GO:0071588 PMID:36401805 (now GO:0006979 response to oxidative stress, KEEP_AS_NON_CORE). Twenty-seven new rows were reviewed. The 16 per-partner GO:0005515 IPI rows split out of existing rows are REMOVE under the GO:0005515 policy (the interactions are not disputed). In response to PR review, the 27 legacy MARK_AS_OVER_ANNOTATED GO:0005515 rows were also migrated to REMOVE, so all 44 GO:0005515 rows are REMOVE except one MODIFY. EXP cytoplasm and nuclear speck (PMID:15707897, abstract-only) are ACCEPT with curator deference. IBA far-red light photoreceptor activity is ACCEPT and IBA phototropism is KEEP_AS_NON_CORE; both come from PTN005179043, seeded by PHYA and PHYB. IBA GO:0000155 and GO:0000160 and IEA GO:0000155 are REMOVE with propagation_review PSEUDO_OR_SUBACTIVITY_LOSS: PTN000703785 is seeded only by canonical histidine kinases, and plant phytochrome HKRDs lack residues critical to HK activity (PMID:19286967, full text). IBA and ISM plasma membrane are REMOVE (soluble cytoplasmic/nuclear protein; the ISM REMOVE comes from the P14713 duplicate). The two IMP response to temperature stimulus rows move from KEEP_AS_NON_CORE to ACCEPT, following P14713: PHYB itself is the thermosensor. A thermosensor core function was added from P14713, but its sequence-specific DNA binding MF was not adopted, because this file MODIFYs that IDA row to promoter-specific chromatin binding. All other PHYB verdicts are unchanged; they were more detailed and better supported than P14713's. P14713-notes.md moved to PHYB-notes.md with a dated merge entry. Also in response to review: the primary core function's citation PMID:11337401 (a plastid-division review that does not mention PHYB) was replaced with verified quotes from PMID:24982198 and PMID:23321421; its GO:0010017 was replaced by GO:0010161 (GO:0009585 is already a descendant of GO:0010017) and cytoplasm and nuclear body were added as locations; description, GO:0007165 summary, and the OPM kinase question and experiment were reworded so they no longer assert histidine kinase activity; the photobody assembly proposed parent became GO:0065003. Status set to COMPLETE.
