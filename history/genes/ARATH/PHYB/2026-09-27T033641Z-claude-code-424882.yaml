  summary: Retire duplicate ARATH/P14713 folder; canonical review is ARATH/PHYB
  details: |
    genes/ARATH/P14713 and genes/ARATH/PHYB both reviewed UniProt P14713 (PHYB_ARATH). PHYB is kept under the ARATH symbol-named-folder convention (cf. #2129, #3231); it was also the more heavily curated review, with falcon evidence, reasons and supported_by on most rows. The two reviews disagreed on 42 rows, 30 of them GO:0005515 policy differences. They were reconciled in PHYB (see the PHYB EDIT record in the same PR). The duplicate's NAS NEW placeholder row (GO:0032991 protein-containing complex) was not carried over. Its falcon research and citations files were byte-identical to PHYB's and were dropped. Its perplexity-lite report was a separate run duplicating PHYB's and was dropped; it remains in git history. Its notes moved to PHYB-notes.md.
