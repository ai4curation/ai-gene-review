  summary: Record OpenScientist finding that AT5G03810 is a selected seed-expressed
    gene with detectable protein but unassignable chemistry
  details: |
    Ran an OpenScientist deep-research job (kgap-at5g03810-family-context) on the gap recording that what AT5G03810 does is entirely unknown. The constraint from context turns out to be negative on chemistry and positive on everything else, and it corrects the premise this review gave the run.

    On chemistry the answer is the one the hypothesis named as expected. All 5,995 pairwise alignments of the 109 reviewed Arabidopsis GDSL proteins place this gene in a four-member neighbourhood, AT5G03820 at 90.1 per cent, AT3G53100 at 59.9, AT5G22810 at 59.5 and AT3G16370 adjoining at 54.4, in which no protein has a measured substrate; the nearest member with any published hydrolytic measurement is EXL4 at 33.7 per cent and the nearest with a measured substrate series is AT3G26430 at 26.0. Restricting to the catalytic groove does not rescue it: over the 44 residues within 10 Angstrom of the nucleophile, characterised members match at 45.5 to 59.1 per cent while the nearest uncharacterised neighbour matches at 86.4, a 27.3 point gap. No substrate class beyond generic carboxylic-ester hydrolysis can be assigned.

    The redundancy explanation this gap offers for the absent phenotype is supported more strongly than the gap assumed: 319 of 354 aligned columns match between the tandem pair, the pocket is 97.7 per cent identical, and zero differences fall on the Ser37-Asp328-His331 triad or any of the six oxyanion-hole donors, the only pocket difference being a conservative Val to Ile 5.4 Angstrom from the nucleophile.

    Two findings change the curation picture. The protein is detected: a 30-tissue proteomic atlas quantifies it in 11 of 30 tissues, the three highest values being mature imbibed seed, embryo stage 10 seed and mature dry seed, matching transcript maxima in silique stage 1 and embryo stage 7, with the pair positively co-expressed rather than reciprocal at both transcript and protein level. And the gene is under strong purifying selection since the duplication, dN/dS 0.224 over 353 codons at p = 2.34e-11. So this is a functional, selected, seed-expressed gene of low abundance rather than a decaying duplicate.

    The correction needs stating precisely, because the description was right about what it claimed and wrong in the impression it left. The local record is indeed protein-existence level 3, inferred from homology, with no mRNA among its EMBL cross-references, both confirmed here, so there is no cDNA or proteomic evidence in the UniProt record; what was wrong is the implication that none exists anywhere. The description has been qualified accordingly, and it carries the run's own caveat, which matters: the detections come from a processed abundance matrix that does not list supporting peptides, so paralog-specific assignment is inferred rather than verified against a tandem paralog 90.1 per cent identical, though 19 family-unique tryptic peptides covering 52.7 per cent of the sequence make it mechanically possible.

    The run also reports the GOA record as over-annotating and contradicting itself, naming an acyltransferase term from an ARBA keyword rule and a lipid biosynthetic process term from IBA sitting against the TAIR biological-process ND on the same entry. That is a description of GOA rather than a new action, and this review already corrects both, removing the acyltransferase term and marking the biosynthetic term over-annotated while accepting the ND; under this project's ND policy an IBA in the same aspect is not literature on the gene and so does not make the ND stale, which is why no contradiction survives in the review itself.

    One claim the hypothesis invited is qualified rather than granted: the tandem may not be Arabidopsis-specific. All 14 Brassicaceae ortholog genes map one-to-many or many-to-many to both A. thaliana genes and two relatives are single-copy at the syntenic position with a gap too small to hide a missed paralog, but synonymous divergence dates the duplication at 7.4 to 15.9 million years against an A. thaliana to A. lyrata split of 5 to 13, so lineage-specific origin and loss in relatives both remain consistent.

    Gap status moved from OPEN to NARROWING. No annotation action was changed. Two further caveats are recorded: the pocket comparison uses predicted side-chain positions with no substrate-bound structure, and the clustering is distance-based, so clade means a distance neighbourhood rather than a supported tree node.

    Incidental: the first wiring attempt inserted the boundary into core_functions because the gap_kind anchor was not scoped to the knowledge_gaps section. Schema validation caught it, the file was reverted and the anchor scoped.
