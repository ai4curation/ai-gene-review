  summary: De novo review of Arabidopsis AT5G03810 (Q9FFN0), a dark GDSL enzyme, testing
    the PTN005219546 GO:0008610 IBD
  details: |
    First review of UniProtKB:Q9FFN0 (GDL72_ARATH, AT5G03810). Fetched by accession with --alias At5g03810 (the entry has no gene symbol; GOA uses the locus id as the symbol).

    Purpose: test, from the leaf side, the claim in genes/PSEAE/estA that the GO:0008610 lipid biosynthetic process IBD at PANTHER node PTN005219546 does not fit the clade.

    Findings. (1) This gene is genuinely dark. PubMed 'At5g03810' returned 0 hits; Europe PMC full-text 'AT5G03810' returned 2 hits, both about other species; Europe PMC 'Q9FFN0' returned 0 hits. No experimental annotation, no cDNA/EST/proteomics (PE 3, inferred from homology), and TAIR has a biological_process ND. Nothing supports a lipid biosynthetic role. (2) Node topology re-checked with projects/PSEUDOCAP/panther_tree.py: PTN005219546 is a LUCA SPECIATION node, 960 leaves (952 eukaryotic, 940 Viridiplantae; 8 eubacterial); the GO:0008610 IBD has the sole seed UniProtKB:O33407 and reaches 885 leaf IBAs in 48 taxa (QuickGO). (3) Same correction as recorded for the paralog APG/AT3G16370: OSP1/AT2G04570 (Q9SJB4) is a leaf of this node with real wax-biosynthesis evidence (PMID:32542680), so the estA review's blanket 'no biosynthetic evidence in the clade' claim is wrong, although that evidence is angiosperm-specific and 892 leaves away and so cannot license the IBD as placed. Verdict: GO:0008610 row MARK_AS_OVER_ANNOTATED.

    Other actions: GO:0052689 IBA ACCEPT as core MF; GO:0008150 ND ACCEPT with nd_case TRUE_GAP plus a WHOLLY_DARK BIOLOGY knowledge gap, citing the documented literature searches; both GO:0005576 rows (IEA, ISM) ACCEPT; GO:0016298 lipase activity MODIFY to GO:0052689 (overly specific substrate claim from IPR008265); GO:0006629 lipid metabolic process MARK_AS_OVER_ANNOTATED; GO:0016746 acyltransferase activity (ARBA) REMOVE as a family-wide unvetted rule asserting the opposite chemistry; GO:0016788 TOO_GENERAL.

    Also checked and recorded: the five Arabidopsis GELPs with demonstrated suberin-biosynthetic roles (PMID:33686223) sit in PTHR45966/PTHR45648/PTHR45650, not PTHR45642, so they are outside this clade.
