  details: |
    Reconciled the merged stomatal-lineage review with an independent chitin-perception review (PR 4451). Changed: both GO:0106310 protein serine kinase activity rows (EXP PMID:11875555, IEA GO_REF:0000116) went ACCEPT -> MODIFY to GO:0004708 MAP kinase kinase activity, because MKK5 phosphorylates the Thr/Tyr of the MPK3/MPK6 TEY loop and the serine label is an EC 2.7.12.2 Rhea expansion. Kept from base despite disagreement: protein-binding MODIFYs to MAPK/MAPKKK binding (now raised as a question), mitochondrion ISM MARK_AS_OVER_ANNOTATED (re-justified: PMID:19516975 shows a predicted N-terminal chloroplast transit sequence), cell division MARK_AS_OVER_ANNOTATED, defense response ACCEPT (matches MKK4), and NEW GO:2000122, which the stomatal lineage module uses. Merged description detail, immune core-function evidence (PMID:27679653 CERK1-PBL27 pathway, PMID:35652263), references (PMID:35652263, PMID:18378893, PMID:19516975, falcon deep research), and suggested questions and experiments on PRR signalling, camalexin, ABA specificity and EC-derived serine kinase rows.
