  summary: Full review of Arabidopsis plastidial cystathionine gamma-synthase CGS1
  details: |
    Reviewed all 15 GOA rows from stub. ACCEPT GO:0003962 (IDA PMID:9531508, ISS, IEA), L-methionine biosynthetic process (IBA, IMP mto1 PMID:12232133 backed by PMID:10558994), chloroplast (HDA, IEA, ISM) and chloroplast stroma (HDA); MODIFY catalytic activity to GO:0003962 and obsolete transsulfuration to GO:0071269; L-methionine metabolic process TOO_GENERAL; PLP binding and selenium compound metabolism non-core. Proposed new MF term for O-phospho-L-homoserine-dependent cystathionine gamma-synthase activity (RHEA:80891, EC 2.5.1.160) since GO:0003962 is defined with O-succinyl-L-homoserine. Cached PMID:25146485, 10558994, 12121993, 9002610. Wrote CGS1-notes.md; status COMPLETE.
