  summary: 'Create review: Arabidopsis SCL27'
  details: |
    Created a de-novo SCL27/AT2G45160 review for GO-CAM 67e5e74400000148 and audited the 13 current GOA rows returned for Q7XJM8 after a forced QuickGO refetch. The review accepts SCL27 as a nuclear GRAS DNA-binding transcription factor, modifies the broad cell-division and cell-differentiation process rows to regulatory terms, keeps root-hair tip growth as a non-core HAM-clade output, and proposes new signed transcription-regulation rows plus regulation of meristem development from the SCL27/HAM literature. The review notes that the GO-CAM model's H4K5 acetyltransferase activity for SCL27 is inconsistent with AT2G45160 and likely reflects a HAM1 symbol collision with the unrelated MYST acetyltransferase at AT5G64610.
