  summary: 'Create review: PMK (Arabidopsis thaliana)'
  details: |
    New review of Arabidopsis GHMP-type phosphomevalonate kinase PMK (At1g31910, Q9C6T1). All 12 GOA rows reviewed. PMK activity and IPP-via-mevalonate rows (IBA, IEA, IDA from Dellas 2013 kinetics and in vitro pathway reconstitution) accepted. Peroxisome rows (IDA Simkin 2011, UniProt IEA, IBA from PTN000781523) accepted under the root-organelle policy, with the caveats that the evidence is an overexpressed YFP fusion in periwinkle cells and that the annotated PTS2 motif does not match the PTS2 consensus (motif scan in PMK-bioinformatics); PTN000781523 is noted as placed too deep (fungal ERG8 inherits it). Cytoplasm ISM and ARBA rows marked TOO_GENERAL; ATP binding non-core. No sub-compartment row added. Added a CC knowledge gap on the import route. Validated with just validate (only UV_NATIVE_TLS noise warnings) and backfill-record-sections.
