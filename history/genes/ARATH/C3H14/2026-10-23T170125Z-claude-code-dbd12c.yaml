  summary: New review of Arabidopsis C3H14 (AT1G66810), a TTP-type tandem CCCH zinc-finger
    mRNA-binding protein
  details: |
    Created the review from GOA (11 rows) plus manual literature review; deep research providers falcon and perplexity were unavailable in this environment. Refined the three mRNA binding rows to mRNA 3'-UTR binding (GO:0003730) and metal ion binding to zinc ion binding. Proposed a sign correction for TAIR's IMP GO:1901347 (negative regulation of secondary cell wall biogenesis, PMID:25228083) to GO:1901348, recorded as a source_defect: the paper reports enhanced phloem fiber formation on overexpression, and PMID:25732536 shows thinner walls in double mutants. Removed the two CrY2H-seq protein binding rows. Kept positive regulation of transcription and negative regulation of unidimensional cell growth as non-core. Added NEW cytoplasm, 3'-UTR-mediated mRNA destabilization, transcription cis-regulatory region binding, negative regulation of defense response to bacterium, and regulation of defense response to fungus. PMID:25228083 was read through Wiley Scholar Gateway passages. PMID:25732536, 41758611, 42711403, 32279333 and 19674407 are abstract-only; full texts would allow PROBABLE findings to be confirmed.
