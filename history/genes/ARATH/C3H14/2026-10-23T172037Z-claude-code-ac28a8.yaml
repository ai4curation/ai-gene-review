  summary: Incorporate curator-supplied full texts of PMID:25228083, 25732536, 41758611
    into the C3H14 review
  details: |
    Read full-text PDFs supplied by the curator (not committed; copyrighted publisher copies). Kim 2014 Figure 7 and Results heading confirm that overexpression causes ectopic and enhanced phloem fiber secondary walls, so the GO:1901347 source defect was raised from PROBABLE to CONFIRMED (correct term GO:1901348). Added Chai 2015 loss-of-function wall data (thinner fiber and vessel walls, less cellulose, xylose and lignin), GFP-C3H14 nuclear and cytoplasmic-foci localization, poly(rU) binding, N-terminal transactivation, and the taller double mutant. From Xue 2026: native-promoter C3H14-VENUS has the same pattern as C3H15; the DCP1, P-body and RNA pull-down data are C3H15-only (C3H15 targets 96% coding region). Revised the GO:0061158 rationale and core-function text accordingly. P-body still not proposed for C3H14.
