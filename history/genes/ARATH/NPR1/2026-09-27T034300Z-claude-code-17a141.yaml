  summary: Merge P93002 duplicate into NPR1; refresh GOA; review 42 new rows
  details: |
    NPR1-goa.tsv and NPR1-uniprot.txt were refreshed from QuickGO/UniProt. Six rows no longer in GOA were dropped: the GO_REF:0000043 keyword IEAs GO:0006952, GO:0008270, GO:0009626 and GO:0046872, and the GO_REF:0000117 IEAs GO:0042742 and GO:0050832. The last two are now supplied via GO_REF:0000120, and their ACCEPT reviews were carried over. Forty-two new rows were reviewed. 34 are per-partner GO:0005515 IPI rows split out of existing rows. Each was decided by partner class: TGA1-7 partners are MODIFY to GO:0003712 transcription coregulator activity, matching the existing TGA rows. NIMIN-1/2/3, NPR2/3/4, CUL3A, SUMO3, WRKY70, RFC4 and MHJ24.13 partners are REMOVE under the GO:0005515 policy, because NPR1 does not coactivate them (several make NPR1 the substrate). The same partner rule, taken from the P93002 duplicate's REMOVE, was applied to three existing rows: PMID:22699612 and PMID:32788727 with NPR4 (MODIFY to REMOVE), and PMID:19490895 with CUL3A (MARK_AS_OVER_ANNOTATED to REMOVE). For PMID:19490895 the backfilled supporting_entities were realigned so that the reviewed row, whose reason discusses CUL3, carries Q9ZVH4, and the new row carries TGA2. EXP nucleus and cytoplasm (PMID:12837250, PMID:11148282) and ISM nucleus are ACCEPT. The new involved_in row for IDA GO:0045893 (PMID:17172357) copies the ACCEPT of the TAIR row. IEA GO:0080027 response to herbivore (Ensembl Compara projection from rice NH1) is MARK_AS_OVER_ANNOTATED. IMP GO:0031348 (PMID:16732289, abstract-only, abstract does not mention NPR1) moves from REMOVE to UNDECIDED, per the rule against overruling experimental annotations from abstract-only records. Salicylic acid binding stays MARK_AS_OVER_ANNOTATED rather than P93002's ACCEPT and core function, since PMID:32788727 shows minimal SA binding by NPR1. core_functions are unchanged. P93002-notes.md moved to NPR1-notes.md with a dated merge entry. Status set to COMPLETE.
