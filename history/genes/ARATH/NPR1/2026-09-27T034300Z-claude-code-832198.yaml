  summary: Retire duplicate ARATH/P93002 folder; canonical review is ARATH/NPR1
  details: |
    genes/ARATH/P93002 and genes/ARATH/NPR1 both reviewed UniProt P93002 (NPR1_ARATH). NPR1 is kept under the ARATH symbol-named-folder convention (cf. #2129, #3231). It was also the more recently curated review, re-reviewed for evidence-aware compliance in #2996. The reviews disagreed on 31 rows, 12 of them GO:0005515. The GO:0005515 disagreements were resolved by partner class, and the rest mostly by keeping NPR1's verdicts (see the NPR1 EDIT record in the same PR). The duplicate's salicylic acid binding core function was not adopted. Its falcon research and citations files were byte-identical to NPR1's and were dropped. Its perplexity-lite report was a separate run duplicating NPR1's and was dropped; it remains in git history. Its notes moved to NPR1-notes.md.
