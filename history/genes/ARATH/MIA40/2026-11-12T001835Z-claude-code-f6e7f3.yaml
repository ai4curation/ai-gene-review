  summary: 'Initial review of Arabidopsis MIA40 (Q8GYJ4): 15 GOA rows adjudicated'
  details: |
    Fetched source data and generated Claude Code deep research. Key primary paper PMID:20829360 is abstract-only (full text refused by PMC, Europe PMC and JBC), so its experimental rows were accepted or kept with that caveat rather than overruled. GO:0015035 rows accepted because the term definition is direction-neutral and AtMIA40 oxidizes AtCOX19 with AtERV1 in vitro (PMID:38001802). GO:0045041 rows modified to the disulfide-relay child GO:0160203. Chloroplast ISM row marked over-annotated. Open items: peroxisomal mechanism, MIA40-dependent substrates, GOA marks GO:0070585 obsolete while OLS lists it active.
