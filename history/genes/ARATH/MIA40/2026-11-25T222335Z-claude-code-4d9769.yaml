  summary: Record OpenScientist refutation of motif-based prediction of MIA40 substrate
    dependence
  details: |
    Ran an OpenScientist deep-research job (kgap-mia40-substrate-motifs) on the knowledge gap covering which intermembrane-space substrates strictly require MIA40 in Arabidopsis. The premise is refuted, and the one significant signal runs opposite to the expected direction.

    Twin CX3C or twin CX9C is present in none of the five established MIA40-dependent proteins and in seven of the nine established independent ones, so the canonical Mia40 substrate signatures mark the Arabidopsis proteins that do not need MIA40. The only rule writable from these data is the negative one, lacking a twin motif therefore dependent, and it misclassifies two of the independent set.

    That rule then breaks on a direct counterexample the run found by scanning the reference proteome: five complex I subunits carry a genuine twin CX9C motif, and complex I amount and capacity fall in mia40 mutants, so counting those subunits as dependent puts twin CX9C on both sides of the split and collapses the statistic from significant to nothing. The proposed docking feature, a hydrophobic or aromatic residue upstream of the first cysteine, does not discriminate at all on either formulation.

    The run then answered the power question the hypothesis asked it to address, and that is the part worth keeping. The sets are not only small but smaller than they look, because three of the five dependent proteins lie on one linear maturation pathway, so the effective contrast is about three against nine, where the most extreme attainable two-sided p for a perfectly separating binary feature is about 0.005, essentially at the correction threshold for the ten features scanned. Of those ten only an even cysteine count clears correction, and that is a correlate of protein size and class rather than a docking determinant. Compartment annotation is collinear with motif and separates the identical partition at similar significance, so with fourteen proteins no analysis can choose between them. On motif class versus disulfide thermodynamics, the run's answer is a third thing, access to the ERV1 and glutathione redox route plus compartment.

    Status left OPEN. The quantitative IMS proteomics already named in the resolution is what would settle it; what changed is that the motif-prediction route is closed and the reason is quantified rather than asserted.

    Verified locally: the 162-residue length, the CHCH domain assignment, and a twin CX9C arrangement in MIA40 itself with cysteines at 68, 70, 79, 89, 102 and 112, which is recorded in the boundary since it means the motif marks the machinery as well as the substrates that do not need it. Of the fourteen substrate-set proteins only CSD1 is in this repository, so the motif calls on both sets, the proteome scan, the Fisher tests, the power calculation and the compartment collinearity were not independently recomputed. No annotation action was taken.
