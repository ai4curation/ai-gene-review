  summary: 'Create review: LPXC4'
  details: |
    Created the full review of Arabidopsis LPXC4, one of five tandem LpxC (UDP-3-O-acyl-GlcNAc deacetylase) paralogs, treated consistently across the cluster. LPXC4 encodes a canonical product identical to AtLpxC1.1; no locus-specific experiment exists, so experimental rows (family-wide RNAi, AtLpxC1.1 GFP) are accepted on sequence identity, with the caveat recorded. Deacetylase MF (IBA/IEA/ISS/IMP), mitochondrion and lipid A biosynthetic process rows were accepted, refuting the Wei et al. 2020 RAR misannotation flag. The AtSubP chloroplast ISM row was removed as contradicted by GFP. The obsolete lipid X metabolic process rows were modified to lipid A biosynthetic process. No NEW rows, because every experimentally supported term is already in GOA for this locus.
