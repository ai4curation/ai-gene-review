  summary: 'Create review: LPXK'
  details: |
    Full review of all 8 GOA annotations for Arabidopsis LPXK (At3g20480, Q8LEA0) using the full text of Li et al. 2011 (PMID:21709257). Lipid-A 4'-kinase activity (IBA/IEA/IMP), mitochondrion (IDA/IEA) and lipid A biosynthetic process (IEA) accepted; three lpxk null alleles accumulate the LpxK substrate disaccharide 1-phosphate, which refutes the RAR (Wei et al. 2020) plant lipid A misannotation flag. ATP binding (IEA) kept as non-core. The IMP to obsolete GO:2001289 lipid X metabolic process was modified to GO:0009245. No NEW rows, since all supported terms are already in GOA; experimental evidence was added to the existing rows. Notes written to LPXK-notes.md.
