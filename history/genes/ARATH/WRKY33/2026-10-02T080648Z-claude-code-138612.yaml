  details: |
    Reviewed all 40 GOA annotations for Arabidopsis WRKY33 (W-box transcription factor downstream of MPK3/MPK6 and MPK4-MKS1). Actions: 20 ACCEPT, 11 KEEP_AS_NON_CORE, 2 MODIFY, 7 REMOVE. Key corrections: IMP camalexin biosynthetic process modified to positive regulation of camalexin biosynthetic process (GO:1901183), since CYP71A13/PAD3 catalyse the steps and WRKY33 activates their transcription (consistent with the MPK3 review); SIB1 protein binding modified to transcription coregulator binding; other generic protein binding rows removed; abiotic stress, SAR, autophagy and bacterial defense rows kept as non-core. Added PMID:21498677 and PMID:22392279. Core functions: DNA-binding TF activity in nucleus; cis-regulatory binding driving positive regulation of camalexin biosynthesis and defense against necrotrophic fungi. just validate passes with no warnings.
