  summary: 'Create review: RGLG4'
  details: |
    De-novo full review of Arabidopsis RGLG4 (Q9SAL0), the experimentally characterised PTHR45751:SF16 relative of rice Q6YYC5, done independently of ProtNLM2 predictions. Deep research failed (falcon 403, perplexity quota), so the review rests on cached literature (PMID:22898498, 23073017, 25788731, 27497447, 28887381, plus paralog papers 35743207 and 17586653), UniProt and PAINT node PTN002247669. All 16 GOA rows reviewed: ligase rows refined from GO:0004842 to GO:0061630; UBC30 protein-binding refined to GO:0031624 ubiquitin conjugating enzyme binding; GRXS17/GLB3 bare protein binding removed; nucleus/cytoplasm accepted; mitochondrion HDA and defense response to bacterium marked over-annotated; JA signaling IMP modified to GO:2000022 regulation of JA mediated signaling pathway; wounding kept as non-core. Notes record that PAINT deliberately did not propagate RGLG1/2 K63-linked ubiquitination or plasma-membrane localization, consistent with RGLG3/4 forming a distinct K48-type, non-myristoylated subclade; those functions are not transferred. No NEW terms.
