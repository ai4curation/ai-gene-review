  summary: Retire duplicate ARATH/AT5G05410 folder; canonical review is ARATH/DREB2A
  details: |
    genes/ARATH/AT5G05410 and genes/ARATH/DREB2A both reviewed UniProt O82132 (DRE2A_ARATH). DREB2A is kept as the canonical folder because of the ARATH convention in this repo: folders are named by gene symbol where one exists. PR #2129 applied it, removing the accession-named APO1 duplicate (Q9XIR4) in favour of APO1; 114 of the 132 ARATH folders are symbol-named (13 are named by AGI locus and 5 by accession); and UniProt gives Name=DREB2A with At5g05410 as the ordered locus name. Content merge: the AT5G05410 review had been built from an older GOA snapshot that included PAINT IBA rows, which the DREB2A review lacked. Rather than copy those rows, DREB2A-goa.tsv was refreshed from QuickGO, and every current row missing from the DREB2A review was added and reviewed there (see the DREB2A EDIT record in the same PR). The IBA reasoning follows the AT5G05410 review where it still applied. The GO:0006950 IBA and the GO_REF:0000120 DNA-binding IEA are no longer in GOA, and three NAS 'align core_functions' placeholder rows had no evidence, so none of these were carried over. The AT5G05410 perplexity report moved to DREB2A-deep-research-perplexity.md, and AT5G05410-notes.md was appended to DREB2A-notes.md. The AT5G05410 falcon report (a separate run duplicating DREB2A's own falcon report) and its artifacts were dropped; they remain in git history.
