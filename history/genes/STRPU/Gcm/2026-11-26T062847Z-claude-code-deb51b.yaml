- type: EDIT
  outcome: changed
  summary: Record OpenScientist finding of no predictable Gcm site at gataE, with
    the negative's power measured, and split the directness claim
  details: |
    Ran an OpenScientist deep-research job (kgap-gcm-gatae-sites) on the gap recording that Gcm binding to the gataE cis-regulatory module is inferred from kinetics, knockdown and Notch-independence rather than from mapped sites. It finds no predicted site and, unusually, measures the power of its own negative instead of leaving it to be over-read.

    A scan of 57,225 base pairs spanning the complete gataE intergenic and genic space, 20 kb upstream to 37 kb downstream of the transcription start, finds exactly one ATGCGGRY match, at -12,448 on the minus strand. It scores 5.09 bits against an empirical genomic threshold of 10.48, and the adenine at its degenerate position occurs 0 times in 21,467 counts at that position in the GCM1 HT-SELEX matrix. Rescoring all three loci with three independent GCM-family matrices, without restricting to the exact consensus, gives 0, 0 and 1 stringent hits in gataE, and that hit breaks the invariant GCGG core at a base-read position and has zero occurrences in 238,569 base pairs of the orthologous Lytechinus variegatus region.

    The positive controls requested in the hypothesis both pass: the same pipeline recovers each cis-perturbation-supported sea urchin Gcm site as the single top-scoring position in its own locus, gcm at -4,062 with 14.63 bits and pks at -1,437 with 15.20 bits, both above the stricter 13.24-bit threshold. The alternative that this protein reads a different sequence is closed off by structure: parsing the murine GCMa complex gives 18 residues within 4 Angstrom of DNA, four contacting bases, and Q8MMJ4 retains 12 of 18 and three of the four base-reading residues, confirmed locally as Asn99, Asn101 and His103 in its 794 residues, with the only base-contact substitution being mouse Ile100 to Thr136, also confirmed, which the run records as its single stated uncertainty.

    What makes the result usable is that the run declines to call it a refutation. At measured genomic rates a window of this size expects 1.49 ATGCGGRY and 0.50 ATGCGGGY occurrences, so observing none has probability 0.226 and 0.609, and a random window of that size carries at least one stringent hit 68.2 per cent of the time. A best-score statistic does not flag even the validated gcm site, at p = 0.357 to 0.614 across the three matrices, while pks is flagged at 0.067 to 0.109. The run also reports testing three statistics and discarding two, and that its cross-species conservation analysis gives a consistent negative at gataE while failing one of its own positive controls, so it lacks the resolution to call an 8 base-pair site. Motif analysis at this locus size therefore withholds support for a direct mechanism at gataE without refuting one, which is what the hypothesis named as the expected answer for a short degenerate consensus. The discriminating observation is the identity of the matches rather than their density: both validated targets carry a perfect ATGCGGGY and gataE carries none.

    The description was amended, because it asserted that Gcm directly drives both gataE and pks. The run supports the pks half, where a perfect consensus site with cis-perturbation support is mapped and top-scoring, so the edit distinguishes the two rather than hedging both: direct binding is mapped only at pks, while at gataE directness is inferred from kinetics, knockdown and Notch-independence, with no site mapped and none predictable from sequence.

    Gap status moved from OPEN to NARROWING, since the hypothesis space is now characterised with calibrated power and the different-consensus escape is closed, while no site has been mapped. No annotation action was changed. Not recomputed here: the scan and its coordinates, the matrix scores and thresholds, the HT-SELEX counts, the Lytechinus comparison, the parsing of PDB 1ODH, and the power calculations.
