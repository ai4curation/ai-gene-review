  summary: 'Create review: Gcm (sea urchin pigment-cell GRN node)'
  details: |
    De-novo AI review of Sp-Gcm (UniProt Q8MMJ4), the glial-cells-missing-family transcription factor that is the immediate Delta/Notch target in veg2 mesoderm and the driver of aboral non-skeletogenic mesoderm (pigment cell) specification. Electronic rows reviewed against the primary literature (Ransick 2002/2006/2012, Calestani & Rogers 2010, Materna & Davidson 2012/2013); the IBA gliogenesis row was REMOVED with a propagation_review (Drosophila-specific glial deployment; sea urchin gcm is confined to the pigment lineage). NEW rows proposed for mesodermal cell fate specification and positive regulation of pigment cell differentiation; experimental evidence for activator MF, cis-regulatory DNA binding and positive regulation of Pol II transcription was merged into the corresponding existing GOA rows rather than duplicated as NEW rows. The review agent was cut off by a rate limit after writing the YAML; the orchestrating session performed the merge, validated (just validate STRPU Gcm, clean) and scaffolded this record.
