  summary: 'Create review: Dri (sea urchin skeletogenic and oral-ectoderm GRN node)'
  details: |
    De-novo AI review of Sp-Dri (dead ringer homolog, UniProt Q8MQH7), the ARID-domain transcription factor activated in the skeletogenic micromere lineage downstream of alx1/ets1 (Amore et al. 2003) and later a maintainer of oral ectoderm identity. Electronic rows reviewed against the primary literature; generic DNA binding rows MODIFIED to the RNA polymerase II cis-regulatory child with a propagation_review on the IBA. NEW rows for activator activity and positive regulation of Pol II transcription (cyp1 target sites), positive regulation of biomineral tissue development, ectodermal cell fate specification, and a sign-neutral Pol II transcription factor activity row for the oral-ectoderm role. The review agent was cut off by a rate limit after writing the YAML; the orchestrating session added the propagation_review and the sign-neutral MF row, validated (just validate STRPU Dri, clean) and scaffolded this record.
