  summary: 'Create review: FoxA (sea urchin endomesoderm GRN node)'
  details: |
    Literature-driven review of Sp-FoxA (Q1PA44), the forkhead-A endoderm regulatory gene of the veg2 endoderm GRN. Audited all 12 electronic rows (IBA/IEA): accepted the IBA DNA-binding, TF-activity, nucleus and Pol II regulation rows and the IEA sequence-specific DNA binding and nucleus rows; modified generic DNA binding, TF activity, regulation of transcription, cell differentiation and anatomical structure morphogenesis rows to specific descendants; marked protein domain specific binding as over-annotated. Proposed four NEW rows from Oliveri et al. 2006 (PMID:17038513) and de-Leon and Davidson 2010 (PMID:20479235): GO:0001227 repressor activity (IDA, autorepression site mutagenesis), GO:0000122, GO:0042662 negative regulation of mesodermal cell fate specification (gcm repression) and GO:0001714 endodermal cell fate specification. Notes file written with PMID-anchored quotes; just validate STRPU FoxA passes with no errors or warnings.
