  summary: 'Create review: Lim1 (sea urchin endomesoderm GRN node)'
  details: |
    Wrote the Lim1 (Q7YT18) review from the cached sea urchin literature. Found that lim1 is a veg1/border ectoderm regulatory gene (Su 2009, Li 2012, McIntyre 2013), not a veg2 endoderm gene; the Peter and Davidson endoderm GRN papers do not mention it. Accepted the PAINT/InterPro transcription factor, DNA binding and nucleus rows, modified the two generic IEA parents to their RNAPII-specific children, kept zinc ion binding and neuron differentiation as non-core, and added one IEP NEW row (ectoderm development) because no lim1 loss-of-function study exists. just validate STRPU Lim1 passed clean.
