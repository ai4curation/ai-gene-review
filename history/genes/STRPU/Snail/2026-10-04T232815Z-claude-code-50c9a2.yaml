  summary: 'Create review: Snail (sea urchin endomesoderm GRN node)'
  details: |
    Reviewed all six electronic GOA rows (4 IBA, 2 IEA) for the Snail-family zinc-finger repressor Q6UCK0; all ACCEPT as sign-neutral TF/nucleus terms consistent with the family. Added two NEW rows, GO:0001227 (repressor activity) and GO:0001837 (epithelial to mesenchymal transition), coded ISS because the only functional data (cadherin repression, requirement for PMC ingression) come from the Lytechinus variegatus orthologue (Wu and McClay 2007; Saunders and McClay 2014); S. purpuratus-specific expression data are conflicting per Shashikant et al. 2018 and this is recorded as a knowledge gap. Cached PMIDs 17287249, 16958110, 24604781, 16997293 and wrote Snail-notes.md. just validate STRPU Snail passes with no errors.
