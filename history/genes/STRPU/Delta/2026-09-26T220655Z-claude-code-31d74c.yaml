  summary: 'Create review: Delta (sea urchin endomesoderm GRN node)'
  details: |
    Literature-driven review of the S. purpuratus Notch ligand Delta (Q8T4N9). Audited all 10 electronic GOA rows: accepted plasma membrane, membrane and Notch signaling pathway; kept calcium ion binding as non-core; modified cell communication to Notch signaling pathway and ARBA neuron development to negative regulation of neurogenesis; removed ARBA extracellular region, cytoplasm, gliogenesis and cell morphogenesis as unsupported transfers for a membrane-tethered contact-dependent ligand. Proposed three NEW rows by IMP: receptor ligand activity (PMID:22306924), mesodermal cell fate specification (PMID:22306924, 18413610, 11934860) and negative regulation of neurogenesis (PMID:28851710), after participation and comparator checks (Drosophila Dl GO-CAM, mouse Dll1, Drosophila pyr/ths). Notes in Delta-notes.md; just validate STRPU Delta passes with no errors or warnings.
