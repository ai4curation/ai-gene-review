  summary: 'Create review: Six12 (sea urchin endomesoderm GRN node)'
  details: |
    De-novo AI review of Sp-Six1/2 (UniProt H6WNA5, EMBL JQ264781), the SIX-class homeodomain transcription factor of the aboral non-skeletogenic mesoderm GRN; identity to the Davidson six1/2 gene confirmed from the JQ264781 accession cited in Ransick & Davidson 2012 and Materna et al. 2013. All nine electronic GOA rows (five PAINT IBA, four IEA) reviewed against the primary literature: seven ACCEPT with merged sea urchin evidence, two generic IEA rows (DNA binding, regulation of DNA-templated transcription) MODIFY to GO:0000978 and GO:0045944. Two NEW rows proposed from the gcm late-module cis/trans perturbation data (GO:0001228 activator activity, GO:0045944 positive regulation of Pol II transcription; IMP, PMID:22509525). No lineage-specification, pigment-differentiation, left/right or cell-migration BP terms were added because six1 knockdown has no pigment phenotype and the coelomic pouch/left-right evidence is expression-only in S. purpuratus or comes from Lytechinus. just validate STRPU Six12 passes clean.
