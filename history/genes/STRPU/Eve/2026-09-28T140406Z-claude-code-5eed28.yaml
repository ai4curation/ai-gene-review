  details: |
    Literature-driven review of Sp-Eve (Q8MMJ3), the even-skipped homeodomain factor of the veg1 lineage. All five electronic GOA rows reviewed (4 ACCEPT, GO:0006355 MODIFY toward Pol II sign-specific children). Six NEW IMP rows proposed from Peter and Davidson 2010/2011 and Cui et al. 2014: activator and repressor MF terms, positive/negative regulation of Pol II transcription, endodermal (veg1 hindgut) and ectodermal (veg1 ectoderm) cell fate specification. The Blimp1 input reported by Smith et al. 2008 is recorded as a DISPUTED finding superseded by the blimp1 MASO result of Peter and Davidson 2010. Notes file quotes re-verified against the cache; just validate is clean.
