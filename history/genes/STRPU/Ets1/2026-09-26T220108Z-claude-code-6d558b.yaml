  summary: 'Create review: Ets1 (sea urchin skeletogenic GRN node)'
  details: |
    De-novo AI review of Sp-Ets1 (Ets1/2; UniProt Q26645, the 'ETS homologue' cDNA of Chen et al.), the ETS-family activator switched on in micromeres by the Pmar1/HesC double-negative gate and required for skeletogenic mesenchyme specification, alx1 cross-regulation and PMC ingression. All existing rows are electronic (IEA/IBA) and were reviewed against the primary literature; 5 NEW rows proposed. The generic IBA 'cell differentiation' row was MODIFIED to mesodermal cell fate specification with a propagation_review (granularity mismatch). The review agent was cut off by a rate limit after writing the YAML; the orchestrating session fixed two unquoted colon-containing supporting_text scalars, added the propagation_review, validated (just validate STRPU Ets1, clean) and scaffolded this record.
