  summary: 'Create review: Blimp1 (sea urchin endomesoderm GRN node)'
  details: |
    Confirmed that TrEMBL Q2VF23 (mRNA DQ177152 Blimp1/Krox1b, RX PMID:16798107) is the early 1b isoform of the blimp1/krox (formerly SpKrox1) gene of the endomesoderm GRN. Reviewed all 10 electronic rows: accepted the IBA/IEA rows for DNA-binding TF activity, cis-regulatory DNA binding, Pol II repressor activity, regulation and negative regulation of Pol II transcription and nucleus (all confirmed by cis-regulatory work), kept the cytoplasm IBA as non-core, and modified the generic cell fate commitment IBA (with propagation_review) and cellular developmental process IEA to GO:0001714 endodermal cell fate specification. Proposed three NEW rows from primary literature: GO:0001228 activator activity (IDA; wnt8, otx beta1/2 and eve site mutagenesis), GO:0045944 (IDA) and GO:0001714 (IMP; blimp1 MASO blocks endomesoderm specification). Added notes file with PMID-anchored quotes, eleven literature references with reference_review, two core functions. just validate STRPU Blimp1 passes with no errors or warnings.
