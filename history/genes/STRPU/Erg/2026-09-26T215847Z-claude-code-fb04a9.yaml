  summary: 'Create review: Erg (sea urchin skeletogenic GRN node)'
  details: |
    De-novo AI review of Sp-Erg (UniProt Q6R7X7), the ETS-family transcription factor of the skeletogenic micromere GRN (erg/hex/tgif feedback subcircuit downstream of ets1 and alx1, later expressed in non-skeletogenic mesoderm). All existing rows are electronic (IEA/IBA) and were reviewed against the primary literature; 3 NEW rows proposed from perturbation and GRN evidence. Activator MF and EMT terms deliberately not proposed for lack of direct S. purpuratus assays. Validated with just validate STRPU Erg (clean). The review agent was cut off by a rate limit after validation, so this history record was scaffolded by the orchestrating session.
