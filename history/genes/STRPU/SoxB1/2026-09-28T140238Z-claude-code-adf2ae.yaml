  summary: 'Create review: SoxB1 (sea urchin ectoderm-side antagonist of the endomesoderm
    GRN)'
  details: |
    De-novo AI review of SpSoxB1 (UniProt Q9Y0D7), the maternal SoxB-group HMG-box factor cleared from vegetal nuclei by beta-catenin-dependent turnover that antagonises nuclear beta-catenin/Tcf and sets the ectoderm/endomesoderm boundary. Electronic rows reviewed against Kenny 1999/2003, Angerer 2005 and later ectoderm GRN papers; the IBA brain development row was marked over-annotated with a propagation_review (echinoderms have no brain). NEW rows for RNA polymerase II activator function, ectodermal cell fate specification and negative regulation of canonical Wnt signaling. The review agent was cut off by a rate limit after writing the YAML; the orchestrating session corrected truncated reference titles and one paraphrased quote, added the propagation_review, validated (just validate STRPU SoxB1, clean) and scaffolded this record.
