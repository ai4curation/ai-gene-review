  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch N29). GO:0007420 brain development stays MARK_AS_OVER_ANNOTATED. The earlier reason stated flatly that the term has no counterpart in echinoderms, which is a lineage claim and would be a removal ground if secure. It is not secure: GO limits the term to Bilateria, which includes echinoderms, and PMID:41191750 argues for a brain-like organization of the juvenile sea urchin nervous system. The tree was also not described: the seeds (vertebrate Sox1/2/3 and fly Dichaete) bracket the sea urchin leaf inside the SoxB1 clade PTN008941861, so node placement is not the issue. Reason, summary and propagation_review rewritten as target doubt (no brain in the embryo and larva where SoxB1 was studied; no data in the post-metamorphic nervous system). PMID:41191750 added to references and quoted. Validated with just validate STRPU SoxB1.
