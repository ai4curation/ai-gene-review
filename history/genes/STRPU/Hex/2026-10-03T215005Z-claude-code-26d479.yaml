  summary: 'Create review: Hex (sea urchin endomesoderm GRN node)'
  details: |
    De-novo AI review of Sp-Hex (UniProt A0A7M7R9J9), the single HHEX-class homeodomain transcription factor of the skeletogenic micromere GRN, identified with the GRN gene hex of Oliveri, Tu and Davidson 2008 (hub of the erg-hex and hex-tgif positive feedback subcircuit downstream of ets1 and alx1; later oral non-skeletogenic mesoderm expression). All seven existing rows are electronic (IEA/IBA) and were reviewed against the primary literature (4 ACCEPT, 2 KEEP_AS_NON_CORE, 1 MODIFY of generic DNA binding to sequence-specific DNA binding); 3 NEW IMP rows proposed from the Oliveri 2008 morpholino/QPCR and skeleton-minus phenotype data (positive regulation of transcription by RNA polymerase II, mesodermal cell fate commitment, positive regulation of biomineral tissue development). Activator MF and EMT terms deliberately not proposed (no direct binding assay in S. purpuratus; EMT role documented only in L. variegatus and conflicting with the normal ingression of Sp hex morphants). Validated with just validate STRPU Hex (clean).
