  summary: 'Create review: Tcf (sea urchin endomesoderm GRN node)'
  details: |
    Literature-driven review of SpTcf/Lef (Q9Y0B2), the single sea urchin Tcf/Lef factor and nuclear effector of the maternal beta-catenin system. Audited the three electronic GOA rows (DNA binding and nucleus accepted; generic Wnt signaling pathway modified to canonical Wnt signaling pathway GO:0060070). Proposed six NEW rows from primary literature: RNA pol II activator activity (IMP, Huang 2000 dominant-negative SpTcf/Lef), repressor activity and negative regulation of transcription (IDA, Minokawa 2005 Tcf-site mutation in the wnt8 module), canonical Wnt signaling pathway, endodermal and mesodermal cell fate specification (IMP). Species caveats recorded for Range 2005 (Lytechinus), Rottinger 2006 (Paracentrotus) and Vonica 2000 (species not stated in abstract). just validate STRPU Tcf passes with no errors or warnings.
