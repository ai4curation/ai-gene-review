  summary: 'Create review: Twist (sea urchin endomesoderm GRN node)'
  details: |
    Wrote Twist-notes.md and a full Twist-ai-review.yaml for S. purpuratus Twist (A7Z0B7), the Twist-family bHLH regulator of the skeletogenic PMC lineage that acts downstream of Alx1 and feeds back on alx1. Identity: A7Z0B7 derives from GenBank DAA06084, the 204-aa protein that Wu, Yang and McClay 2008 (PMID:18495103) identified in silico; all functional data are from Lytechinus variegatus (92% identical orthologue), which is recorded as an organism caveat on every row. Reviewed all 8 electronic GOA rows (6 ACCEPT; GO:0032502 developmental process and GO:0046983 protein dimerization KEEP_AS_NON_CORE) and proposed 3 NEW IMP annotations (GO:0010718, GO:0070169, GO:0001710) anchored on PMID:18495103 with Saunders and McClay 2014 (PMID:24598159) as corroboration; no activator/repressor term because directness is untested. just validate STRPU Twist passes with no errors or warnings.
