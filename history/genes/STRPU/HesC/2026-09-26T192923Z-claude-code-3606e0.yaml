  summary: 'Create review: HesC (sea urchin endomesoderm GRN node)'
  details: |
    Confirmed that TrEMBL A0A7M7RIK0 (LOC592057, XM_791599.5) is the hesC gene of Revilla-i-Domingo et al. 2007: the published hesC morpholino target (first 25 bp of the CDS) encodes the N-terminus MLTSSGYQ of this protein and is present in the RefSeq CDS and the EST CX199264 used as the in situ probe. Reviewed all 11 electronic rows: accepted the IBA repression/DNA-binding/TF/nucleus rows and the UniRule nucleus row, modified the generic DNA binding, DNA-templated transcription and regulation-of-transcription IEA rows to the specific GO:0000978/GO:0000122, kept protein dimerization and regulation of neurogenesis as non-core, and marked the anterior/posterior pattern specification IBA over-annotated with a propagation_review. Proposed two NEW rows from the primary literature: GO:0001227 DNA-binding transcription repressor activity, RNA polymerase II-specific (IDA, cis-regulatory site mutagenesis in delta and alx1) and GO:0042662 negative regulation of mesodermal cell fate specification (IMP, hesC morpholino). Added notes file with PMID-anchored quotes, ten literature references with reference_review, one core function. just validate STRPU HesC passes with no errors or warnings.
