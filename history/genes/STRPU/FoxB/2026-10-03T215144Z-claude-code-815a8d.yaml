  summary: 'Create review: FoxB (sea urchin endomesoderm GRN node)'
  details: |
    Confirmed that UniProt Q9XZM6 (fkh1, GeneID 373496, NCBI alias FoxB; Class II forkhead per David et al. 1999) is the foxb node of the Davidson skeletogenic GRN. Reviewed all 11 GOA rows (6 IBA, 5 IEA): accepted the IBA MF/CC/transcription rows and IEA nucleus and sequence-specific DNA binding, modified the generic IEA DNA binding, DNA-binding TF activity and regulation of transcription rows to their RNA polymerase II-specific children, modified IBA cell differentiation to positive regulation of biomineral tissue development, and kept IBA anatomical structure morphogenesis as non-core. Proposed two NEW IMP rows from Oliveri et al. 2008 (GO:0045944, GO:0070169); the Lytechinus EMT requirement (Saunders and McClay 2014) was recorded in notes and suggested_questions rather than annotated. Wrote FoxB-notes.md with PMID-anchored quotes. just validate STRPU FoxB passes with no errors or warnings.
