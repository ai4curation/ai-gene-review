  summary: 'Create review: Pmar1 (sea urchin endomesoderm GRN node)'
  details: |
    Wrote Pmar1-notes.md and a complete review for Q8WRE9 (Pmar1), the micromere-specific paired-class homeodomain repressor that opens the pmar1-hesC double-negative gate. Both IEA rows (DNA binding, nucleus) accepted. Three NEW rows proposed from the primary literature: GO:0001227 repressor activity (IMP, PMID:12027443), GO:0000122 negative regulation of Pol II transcription of hesC (IMP, PMID:17636127), and GO:0007501 mesodermal cell fate specification (IMP, PMID:12781680 chimera rescue). Downstream Delta/Notch and endomesoderm-induction effects deliberately not annotated. Two knowledge gaps recorded (no mapped Pmar1 site on hesC; possible hesC-independent targets). just validate STRPU Pmar1 passes clean.
