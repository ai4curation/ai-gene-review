  summary: 'Create review: Otx (sea urchin endomesoderm GRN node)'
  details: |
    Wrote Otx-notes.md and a complete Otx-ai-review.yaml for Q26417 (SpOtx). All eight electronic GOA rows (IBA/IEA: GO:0000978, GO:0000981 x2, GO:0003677, GO:0005634 x2, GO:0006355, GO:0006357) were ACCEPTed with literature support from the Klein-lab cis-regulatory and perturbation papers (Gan 1995, Mao 1994/1996, Li 1997/1999) and the Davidson-lab GRN papers (Yuh 2004, Peter and Davidson 2010/2011, Oliveri 2008). Five NEW rows were proposed: GO:0001228 activator activity (IDA), GO:0045944 (IDA), GO:0001714 endodermal cell fate specification (IMP), GO:0001715 ectodermal cell fate specification (IMP) and GO:0005737 cytoplasm (IDA). No mesodermal/micromere specification term was proposed because Otx is only one input to pmar1 and no Otx loss-of-function evidence exists for that step. The isoform field was not used because Q26417 has no UniProt isoform accessions; this is recorded as a knowledge gap. just validate STRPU Otx passed with no errors or warnings.
