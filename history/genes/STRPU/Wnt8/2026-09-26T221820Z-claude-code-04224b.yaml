  summary: 'Create review: Wnt8 (sea urchin endomesoderm GRN node)'
  details: |
    Literature-driven review of the S. purpuratus secreted Wnt ligand Wnt8 (Q6RFL8; the UniProt record cites only the Wikramanayake cDNA submission, PMID:15282746 located by eutils). Audited all 9 electronic GOA rows: accepted frizzled binding (IBA), extracellular region (IBA and IEA) and canonical Wnt signaling pathway (IBA); modified signaling receptor binding (IEA) and cytokine activity (IBA) to receptor ligand activity, Wnt signaling pathway (IEA) to canonical Wnt signaling pathway, and cell fate commitment (IBA) to endodermal and mesodermal cell fate specification; marked neuron differentiation (IBA) as over-annotated. Proposed four NEW rows by IMP: receptor ligand activity, endodermal cell fate specification and mesodermal cell fate specification (PMID:15282746, 19104065, 18413610, 16289024, 18061160, 17975065) and non-core anterior/posterior pattern specification (PMID:23335859), after participation and comparator checks (C. elegans mom-2, Xenopus wnt8). Notes in Wnt8-notes.md; just validate STRPU Wnt8 passes.
