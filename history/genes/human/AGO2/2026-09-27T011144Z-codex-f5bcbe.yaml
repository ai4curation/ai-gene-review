  summary: Re-review AGO2 source mechanisms and core RNA-silencing functions
  details: |
    Substantively audited all 267 original source assertions, preserving every
    field outside review, both alternative products, and all 173 original
    reference identifier/title pairs. Final decisions are 175 ACCEPT,
    24 KEEP_AS_NON_CORE, 10 UNDECIDED, 57 REMOVE and one MODIFY, with no NEW or
    PENDING annotations. Generic protein-binding removals enforce the repository
    policy without asserting that the physical interactions are absent.

    Replaced generic binding with GO:0060698 endoribonuclease inhibitor activity
    for the bounded recombinant Dicer inhibition experiments in PMID:14749716;
    substrate-sequestration and physiological limits are explicit, and this
    activity is excluded from core. Cap binding, P-body assembly, promoter DNA
    recognition and legacy translation-initiation annotations retain specific
    uncertainties. Three integrated cores distinguish target slicing,
    recruitment-mediated repression and decay, and guide loading/maturation.
    Reassessed all references and source propagation, including the Expression
    of Concern linked to PMID:25446899, without mislabeling it as a retraction.

    The canonical symbol, aliases, absence of overlapping open PRs and exact
    source baseline were checked. The genuine Falcon invocation and fallback
    failed before provider execution because dependency retrieval failed DNS;
    no provider text was fabricated. Normal publication caching confirmed all
    82 original PMIDs. Additional normal retrievals failed for PMID:19159466,
    PMID:21475248, PMID:20473314, PMID:33199684 and PMID:40930611. These records
    were independently verified through primary web sources, but remain missing
    repository caches. Reactome R-HSA-203862 also remains uncached after its
    supported fetch failed DNS. Machine-sourced UniProt, GOA and Falcon files
    retain their baseline hashes.

    The parent independently read all 267 biological judgments and the three
    cores, and checked the full PMID:14749716 Figures 3–4 and Methods against
    the live inhibitor-term definition. The biological decisions were accepted.
    The parent's subsequent pass through all PMID and GO_REF assessments and
    grouped Reactome notes found no blocker.
    Final just validate human AGO2 passed with two warning groups: the five
    missing PMID caches and the unused Falcon annotation-evidence advisory.
    A separate ontology-term validation passed; only that additional invocation
    skipped reference checking. The notes-inclusive check found 87 cited PMIDs,
    82 cached, and exactly the five missing records above. HTML rendering passed.
    Status is DRAFT because these cache gates remain unresolved. No Git or
    remote publication changes were made in this session.
