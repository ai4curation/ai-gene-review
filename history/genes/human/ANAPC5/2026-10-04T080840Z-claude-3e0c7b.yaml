  summary: 'Initial review of human ANAPC5: APC/C platform subunit; 55 rows accepted,
    spindle, PTEN binding and meiotic NAS non-core'
  details: |
    Reviewed 59 GOA rows. Accepted the APC/C complex, catabolism, chain-type, mitotic metaphase/anaphase regulation and location rows. Kept spindle (IDA/IEA), PTEN protein phosphatase binding and the meiotic NAS as non-core. Core function: platform subunit linking APC2/11 to the TPR lobe (PMID:25043029, PMID:12956947). No protein-binding rows and no NEW terms.
- type: EDIT
  outcome: changed
  sections:
  - core_functions
  summary: 'Add GO:0140378 protein complex scaffold activity as the core molecular function'
  details: |
    Added GO:0140378 protein complex scaffold activity as core_functions.molecular_function, keeping contributes_to GO:0061630, for consistency with the ANAPC16 review (#4058). No NEW GOA row is proposed, because small APC/C subunits carry no scaffold MF in GOA.
- type: EDIT
  outcome: changed
  sections:
  - core_functions
  - existing_annotations
  - references
  summary: 'Round 2 (#4060 review): core MF to GO:0160072 per the APC1 precedent; GO:0045842 evidence no longer contradicts the row; worm meiosis evidence; reason fixes'
  details: |
    Changed core_functions.molecular_function from GO:0140378 to GO:0160072 ubiquitin ligase complex scaffold activity, following nuc2/APC1, cut9, CDC27 and ANAPC2, and citing PMID:21307936 and PMID:27601667. The GO:0045842 IBA reason now states the securin/cyclin B rationale, and the contrary fly quote is in prose only. GO:0007346 is noted as subsumed by GO:0045842 (checked in OLS). The meiotic NAS reason cites PMID:20944012. Removed a non-sequitur from the PTEN row. Tailored the BP reasons and added core locations.
