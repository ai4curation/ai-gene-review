  summary: 'Initial review of human ANAPC5: APC/C platform subunit; 55 rows accepted,
    spindle, PTEN binding and meiotic NAS non-core'
  details: |
    Reviewed 59 GOA rows. Accepted the APC/C complex, catabolism, chain-type, mitotic metaphase/anaphase regulation and location rows. Kept spindle (IDA/IEA), PTEN protein phosphatase binding and the meiotic NAS as non-core. Core function: platform subunit linking APC2/11 to the TPR lobe (PMID:25043029, PMID:12956947). No protein-binding rows and no NEW terms.
- type: EDIT
  outcome: changed
  sections:
  - core_functions
  summary: 'Add GO:0140378 protein complex scaffold activity as the core molecular function'
  details: |
    Added GO:0140378 protein complex scaffold activity as core_functions.molecular_function, keeping contributes_to GO:0061630, for consistency with the ANAPC16 review (#4058). No NEW GOA row is proposed, because small APC/C subunits carry no scaffold MF in GOA.
