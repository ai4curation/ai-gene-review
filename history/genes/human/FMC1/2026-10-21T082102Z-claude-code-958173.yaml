  summary: 'Create review: FMC1'
  details: |
    De-novo review of human FMC1 (Q96HJ9), the sole experimental donor at PAINT node PTN001271866 (PTHR31716:SF1), written independently of ProtNLM2 predictions. Falcon deep research and perplexity-lite fallback both failed; review based on cached literature (PMID:28719601 full text; PMID:11096112, 25686363, 35881696, 42295981, 34800366). Accepted GO:0033615 (IMP, IBA) as core process and all four GO:0005739 rows; removed bare GO:0005515 IPI (ATPAF2) per protein-binding policy. Recorded that yeast Fmc1 (P40491) is in PANTHER PTHR28015, not PTHR31716, so yeast matrix localization and heat-stress findings were not transferred. No NEW terms; no MF assigned because no activity has been measured.
