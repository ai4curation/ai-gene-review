  summary: 'Create: CFAP57 (WDR65) GO annotation review'
  details: |
    New review of all 4 GOA rows for CFAP57 (WDR65), an extended axonemal scaffold that targets docking of a subset of single-headed inner dynein arms. Actions: 2 ACCEPT (axoneme, sperm flagellum), 2 MODIFY (cilium HPA IDA and ARBA IEA -> GO:0031514 motile cilium), 3 NEW (GO:0036159 inner dynein arm assembly and GO:0003341 cilium movement, comparators CCDC39/CCDC40; GO:0005200 structural constituent of cytoskeleton). Sperm flagellum assembly was not proposed because cilium movement is among its GO ancestors; raised as a suggested question along with long/short isoform tissue specificity. Falcon deep research failed (Edison authentication error) and perplexity was unavailable; manual literature research is recorded in CFAP57-notes.md. New publication caches: PMID 31483737, 32764743, 36752199, 41466333, 41793497, 39671309. Validated with just validate human CFAP57 (only UV_NATIVE_TLS warnings) and just validate-references.
