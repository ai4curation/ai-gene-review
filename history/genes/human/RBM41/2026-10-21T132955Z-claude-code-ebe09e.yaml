  summary: 'Create review: RBM41'
  details: |
    De-novo review of human RBM41 (Q96IZ5, PTHR16105:SF2) as the experimentally characterised SF2 reference for the donkey RBM41 ProtNLM2 benchmark entry; ProtNLM2 output not used. Falcon deep research failed (Edison 403 auth; perplexity-lite fallback also failed), so the review rests on the full text of PMID:38499487. The four IBA rows come from PTN000413238 with only SF0 (U11/U12-65K) donors; U12 snRNA binding, U12-type spliceosomal complex and mRNA splicing via spliceosome were accepted because human RBM41 data corroborate them, while pre-mRNA intronic binding was marked over-annotated (no direct intron binding; intron recognition is a 65K/di-snRNP-stage function). IEA RNA/nucleic acid binding modified to U12 and U6atac snRNA binding; 39 high-throughput protein binding rows removed per policy. Added NEW IDA rows for U6atac snRNA binding, U12 snRNP and Cajal body. No post-catalytic process term proposed, because the paper only suggests that stage and DHX8 performs it.
