  summary: 'Integrate falcon deep research: PLCG1'
  details: |
    Integrated the falcon deep research report as a LOW_QUALITY secondary reference and checked its leads against primary papers fetched into publications/ (PMID:31889510 Hajicek 2019, PMID:11387210 Takahashi 2001, PMID:33929486 Zeng 2021). Description gained the structural autoinhibition mechanism (regulatory array over the catalytic core, cSH2-C2 clasp released by pY783), VEGFR2 pY1175 docking, and SH2/SH3-mediated LAT condensate scaffolding with CD45 protection. Added a NEW GO:0048010 VEGFR signaling pathway row (IDA, PMID:11387210; participation and comparator checks passed) and added it to the catalytic core function; added primary-paper support to the core functions. Changed GO:2000353 positive regulation of endothelial cell apoptotic process from UNDECIDED to KEEP_AS_NON_CORE because the PMID:27464494 title states the direction (independent of the report). COP9 signalosome and lysophospholipase C stay UNDECIDED (the report does not address them). Added three suggested questions (LAT scaffold MF, focal adhesion/nuclear localization, SH3-AKT conflict) and two experiments.
