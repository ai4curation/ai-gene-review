  summary: Initial AI review of human PLCG1 (PLC-gamma-1) annotations for the FGFR
    signaling module
  details: |
    Reviewed all 230 GOA annotations. Core functions: GO:0004435 PIP2 phospholipase C activity (phosphatidylinositol-mediated signaling, ER Ca2+ release; PM/cytosol/ruffle membrane) and GO:0001784 phosphotyrosine residue binding for SH2 recruitment to RTKs (EGFR, FGFR) and the LAT signalosome (TCR). 73 protein binding IPIs: MODIFY to GO:0001784 where the abstract shows pTyr/SH2-dependent binding, otherwise REMOVE. GO:0004629 modified to GO:0004435. COP9 signalosome IDA (PMID:22561606) removed as a mis-mapping of 'TCR signalosome'. Rat-ISS lysophospholipase C, miRNA-based endothelial apoptosis and Reactome FCGR3A-IL10 terms marked over-annotated. Added NEW GO:0008543 FGFR signaling pathway (IMP, PMID:1379697) after participation and comparator checks (FRS2 carries it; PLCG1 carries EGFR analog). Validation passes.
