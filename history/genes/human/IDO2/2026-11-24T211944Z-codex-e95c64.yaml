  details: |
    Created a de novo human IDO2 review for the PTHR28657 IDO/BNA2 family. Reviewed all 17 GOA rows, accepted the direct and propagated indoleamine 2,3-dioxygenase and L-tryptophan catabolism annotations, modified the TDO-labelled GO:0004833 and generic GO:0046872 rows to the IDO/heme-specific molecular-function terms, kept cytoplasmic localization as non-core context, and marked the yeast-BNA2-rooted obsolete GO:0034354 de novo NAD biosynthesis IBA as over-annotated for human IDO2. Added manual notes because the configured deep-research providers were unavailable; checked the fetched GOA file was not header-only; skipped module and GO-CAM edits because the existing kynurenine-NAD module already carries the established TDO2/IDO1 first-step enzymes and no production GO-CAM indexes human IDO2.
