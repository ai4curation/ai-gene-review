- type: EDIT
  outcome: changed
  summary: 'Addressed the three blocking review items on PR #3094; two of the three
    also improved the underlying argument.'
  details: |
    Item 1, and the one I had genuinely got wrong. I had marked the target's own accession CIRCULAR_OR_REDUNDANT in the GO:0005085 IBD and used a CIRCULAR_PROPAGATION failure mode on GO:0007264, and had described the GO:0005886 node as a round trip. CLAUDE.md prohibits exactly this by name. An IBD is a curator's judgment about where a function arose, made from the experimental annotations of all extant members, so the target appearing in its own WITH/FROM marks experimental grounding on the target rather than circularity, and a short donor list is not weak support either. All three blocks now use SUPPORTS_TRANSFER with the redundancy stated in comment, and the root causes are NO_FAILURE_NON_CORE. The prose had been saying the right thing while the enum said something else, which is the drift nothing in this repo validates. Item 2, the tight-junction term, verified rather than accepted on its face. Confocal colocalisation along a junctional belt cannot separate bicellular from tricellular contacts, and occludin is not confined to bicellular junctions in any case since PMID:40878853 reports that occludin loss displaces tricellulin from tricellular junctions. GO:0005923 is therefore one level too specific and the proposal moved to GO:0070160, current in QuickGO and OLS4 alike. That also settled a reviewer suggestion in the opposite direction from the one suggested. GO:0005923 carries GO:0043296 among its hierarchical parents in both services while GO:0070160 does not, so the companion apical junction complex row would have been redundant under the original term and is genuinely complementary under the new one. Item 3, the ISS reference. GO_REF:0000024 covers transfer of experimentally verified annotation data to orthologs, which presupposes an annotation on the donor, and the review's own reason text states the mouse record carries none. The canonical GO_REF text could not be retrieved, three routes returning 403 or 404, but the internal contradiction is decisive on its own. The row now cites PMID:29876405 directly and keeps ISS with the mouse ortholog as supporting entity. Two suggestions taken. The MODIFY on GO:0035023 now carries its clade level warrant, namely that both IBD seeds are themselves exchange factors and an exchange factor is by definition a positive regulator of its GTPase, so the positive sign is warranted at the node and not only from target data. Three over short supporting_text values were replaced with full sentences, which required adding single line bottom line statements to RESULTS.md since file quotes are not validated and must be grep checkable on one physical line. One suggestion declined with reasons in a PR reply, namely dropping RAC1 from core_functions substrates.
