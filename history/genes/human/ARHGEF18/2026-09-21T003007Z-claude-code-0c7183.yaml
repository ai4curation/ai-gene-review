  summary: Reviewed all 32 GOA rows for ARHGEF18 (p114RhoGEF); the record is a coverage
    failure, not an over-annotation problem.
  details: |
    19 of 23 primary ARHGEF18 papers have produced no GO annotation on any gene in any species, verified species-blind by reference against QuickGO in the committed reference_coverage.py; none is undetermined. The zeros include the founding in-vitro exchange assay (PMID:11085924), the Nat Cell Biol junction paper (PMID:21258369), the AJHG disease paper (PMID:28132693), the only structure of any part of the protein (PMID:29876405, PDB 6BCB) and a vertebrate knockout (PMID:23698346). Four new annotations are proposed, all from papers GO has never used: GO:0005923 and GO:0043296 by IDA and GO:0120192 by IMP from PMID:21258369, and GO:0031267 by ISS from PMID:29876405 with the mouse ortholog as the supporting entity. One MODIFY, GO:0035023 to GO:0035025, because every primary experiment shows activation and UniProt already phrases the RP78 variant effect that way. One MARK_AS_OVER_ANNOTATED for GO:0070062. No REMOVE. Substrate specificity is inexpressible by design: GO:0005089 and the Rac, Ras, ARF, Rab and Ran equivalents are all merged into GO:0005085, which has zero is_a children, and GO:0017048 is merged into GO:0031267, which also has none; checked across QuickGO, OLS4 and the GO API. Substrate identity is carried in core_functions substrates and recorded as an ONTOLOGY knowledge gap rather than proposed as a term. The committed dh_domain.py resolves the two published loss-of-function substitutions onto the current canonical sequence, Arno Thr270 to Thr-458 and Terry Y260 to Tyr-606, shows that the conserved Dbl tyrosine is pan-family and therefore uninformative about substrate, validates a structure-anchored substrate classifier at 8 of 8 on held-out proteins and then declines to push its ARHGEF18 answer because a Cdc42-specific GEF scores in the same band, and maps the ten RhoA-contacting PH residues of PDB 6BCB onto identical human positions. Three PAINT observations registered rather than repaired: the GO:0005085 IBD seeds now sit across two PANTHER families after a lineage split, and the GO:0005886 and GO:0007264 IBDs are seeded only by the target gene itself.
