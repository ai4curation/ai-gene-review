  summary: 'Revert: restore CORO1A review status to DRAFT'
  details: |
    Reverts a status promotion I made earlier today.

    I had changed this review from DRAFT to COMPLETE because all 71 rows were adjudicated, reference_review was present on all 40 references, and the review verified clean. That is not what status means for this gene. CORO1A is a ClinGen Mendelian campaign gene, reviewed under the campaign on 2026-10-13 via PR #4952, and left at DRAFT. Its row in that checkpoint table predates the schema that carries a review-status column, so unlike GSDME there is no explicit per-gene status assertion to point at; the revert rests on the campaign's general position, stated in its progress log, that existing reviews receive a substantive audit and that a COMPLETE status does not certify assessment against the campaign's current evidence and curation rules, together with the fact that the campaign reviewed this gene and did not promote it.

    No content was changed in either direction - the promotion was a one-line status edit and this restores it. The nine protein_binding_policy warnings remain retained and reported, which is correct under the project's standing instruction and was never the issue.
