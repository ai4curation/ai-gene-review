  summary: 'Complete: human CORO1A review'
  details: |
    Promoted DRAFT to COMPLETE. No content change.

    All 71 rows were already adjudicated with no PENDING and no UNDECIDED, 109 supporting quotes, reference_review on all 40 references, a description, a core function (actin filament binding), and both suggested questions and experiments. The status flag was the only thing outstanding, and the review verifies clean.

    The nine protein_binding_policy warnings are retained and reported rather than fixed. CORO1A is a ClinGen Mendelian project gene, and that project's standing curation instruction explicitly permits supported generic binding to remain KEEP_AS_NON_CORE when no evidence-backed specific function is available, while noting that the generic validator still warns and that the computed status should be retained and reported. Changing those actions to satisfy the validator would have contradicted the project instruction.

    Reviewed in this batch because CORO1A is the one human gene GO carries a NOT annotation for on GO:0001771 immunological synapse formation - the term this project removed from PRF1 and proposed for FCGR3A - so its record is the direct precedent for both of those decisions.
