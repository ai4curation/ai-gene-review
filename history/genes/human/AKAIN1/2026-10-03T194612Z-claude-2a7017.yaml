  summary: First review of human AKAIN1, a PKA RII-binding disruptor of AKAP anchoring
  details: |
    5 rows: 2 MODIFY, 2 ACCEPT, 1 REMOVE. GO:0051018 (IDA, IEA) refined to GO:0034237 protein kinase A regulatory subunit binding, which PMID:25653177 states directly and which RII-binding AKAPs 1, 5 and 11 carry. GO:0008104 accepted rather than modified to a negative-regulation term, because MGI, curating the mouse ortholog from the same paper, kept GO:0008104 and separately added GO:0031333; the human-side absence of GO:0031333 is recorded as a CURATION knowledge gap rather than added as NEW, since the endogenous-protein work used a mouse cell line. Cytosol accepted on the mouse IDA. The HuRI protein-binding row with ROPN1 removed per the GO:0005515 policy, with the ropporin docking-domain connection raised as a question. An independent PubMed search found no functional paper beyond PMID:25653177.
