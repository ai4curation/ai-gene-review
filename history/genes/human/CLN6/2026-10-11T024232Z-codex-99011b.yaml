  summary: Review CLN6 lysosomal-enzyme recruitment and binding evidence
  details: |
    Reviewed all 54 fetched human CLN6 annotations, preserving both alternative-product objects and all 17 original reference identities. The final review contains 9 ACCEPT, 9 MODIFY, 33 KEEP_AS_NON_CORE, and 3 UNDECIDED decisions, with no NEW assertions. Nine interaction refinements combine the exact measured pair with verified partner class; generic measured interactions remain non-core where a more informative activity was not established. Three source-specific uncertainties retain the original assertions without inferring contradiction from incomplete access.

    The descriptive core records CLN6-dependent lysosomal-enzyme recruitment with CLN8 at the endoplasmic-reticulum membrane. The corrected EGRESS study and its corrigendum support that role, while pairwise association and mutual dependence do not uniquely establish an autonomous cargo-receptor or adaptor geometry. The review records the source-internal loop-deletion coordinate discrepancy and distinguishes selected corrected figure and supplement inspections from whole-supplement access. Older primary studies support topology, dimerization, lysosomal degradation, localization, and lipid binding within their actual construct and assay limits.

    Normal validation, status checking, and rendering passed with 23 documented advisories: 22 campaign-policy generic-binding retentions and one source-specific membrane ACCEPT/UNDECIDED distinction. The ordinary derived status remains DRAFT. Source preservation, 87 literal interaction records with 42 fields, 31 source joins, all 54 current GOA assertions, and aggregate primary quotation limits passed. Falcon timed out and the fallback returned an authorization/quota error; no provider report was fabricated. Existing source caches remain unchanged, with genuine external full-text access documented separately. Independent whole-review assessment and exact publication applicability are checked separately before ROOT publication.
