  summary: 'Create review: TLR10'
  details: |
    Reviewed all 39 GOA annotations for human TLR10 (Q9BXR5) against cached primary literature, including nine TLR10 functional papers fetched for this review. Evidence establishes TLR10 mainly as an inhibitory TLR: it heterodimerises with TLR2 and recruits MyD88 but fails to activate NF-kappaB, and it suppresses MyD88- and TRIF-dependent TLR responses, B cell proliferation and pDC responses. Propagated TLR signaling pathway, lipopeptide binding and lipopeptide response terms kept as non-core (not removed); NEW negative regulation of toll-like receptor signaling pathway and negative regulation of B cell proliferation added. Protein binding rows modified to TLR2 or Toll-like receptor binding where co-IP supported, otherwise removed. Falcon deep research had not finished. just validate passes with no warnings; reference validation passes.
