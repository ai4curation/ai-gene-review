  summary: De-novo review of all 15 GOA annotations for SLCO4A1 (OATP4A1), ubiquitous
    thyroid-hormone/organic-anion antiporter
  details: |
    Reviewed every GOA row for SLCO4A1 (Q96BD0, OATP4A1). Ubiquitous; UniProt-curated organic anion ANTIPORTER (Na+-independent secondary-active exchange). Substrates: thyroid hormones (T3>T4, rT3), PGE2, taurocholate, estrone-3-sulfate, benzylpenicillin; placental syncytiotrophoblast role in maternal-fetal TH transfer. Core MF GO:0015349 thyroid hormone transmembrane transporter activity (QuickGO: is_a GO:0015291 secondary-active -> GO:0022857); GO:0015347/GO:0008514 obsolete so the broad multispecific character is carried by directly_involved_in GO:0043252 Na-independent organic anion transport + GO:0070327 TH transport + the description, not an MF id. location GO:0005886; substrates T3/T4/rT3/estrone-3-sulfate/taurocholate/PGE2 as ChEBI. Because OATP4A1 is a curated antiporter (secondary-active), the GO:0015349 placement under secondary-active transport FITS (did NOT flag the facilitative mismatch raised for the facilitative MCT8/MCT10/OATP1C1; raised mechanism/counterion uncertainty as a suggested_question, which UniProt flags unresolved). Actions (15): 5 ACCEPT (PM, GO:0015349 IBA, GO:0043252, GO:0070327), 5 TOO_GENERAL (GO:0016020, GO:0022857 x3 incl 2 IDA, GO:0055085), 3 KEEP_AS_NON_CORE (GO:0015132 PGE2 transporter + GO:0015732 PG transport, cell junction HPA), 1 MARK_AS_OVER_ANNOTATED (GO:0016323 basolateral IBA, conflicts with apical placental estrone-sulfate uptake evidence, propagation_review TERM_SCOPING_PROBLEM), 1 REMOVE (bare GO:0005515, GPR25). proposed_new_terms: none. source_defects: none. Batch 12.
