  summary: Clarify DNAAF11 localization and retain cilium assembly
  details: |
    Distinguished conserved germ-cell cytosol from directly imaged human-airway DynAP localization, retaining valid broad source observations and the PAINT inference. Accepted the existing motile-cilium assembly assertion because dynein-arm formation participates in assembling functional cilia; current ancestry does not make the arm terms descendants of that term. Included cytosol and the already accepted protein-localization process in the single assembly core. Added source-specific HuRI identifiers, original-only section locators, and bounded human-versus-mouse evidence without changing cached availability flags. All 53 source objects, two products, machine reference fields and inherited notes are preserved; no NEW annotation or autonomous molecular activity is invented. Canonical normal/strict validation, status inspection, rendering and history validation were performed.
