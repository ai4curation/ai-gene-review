  summary: 'Create review: MAP2K5'
  details: |
    Created the human MAP2K5 (MEK5) review: all 73 GOA annotations actioned, with core functions set as MAP kinase kinase activity (GO:0004708) in the ERK5 cascade (GO:0070375) and endothelial response to laminar shear stress (GO:0071499). Generic kinase MF terms were modified to GO:0004708 and signal transduction to ERK5 cascade, consistent with the sibling MAP2K reviews. Protein-binding IPIs were modified to MAP3K binding (MAP3K2/3), MAPK binding (MAPK7) or Hsp90 binding (HSP90AB1), or removed for screen-only partners. Rat-derived downstream endothelial phenotypes from PMID:20551324 were kept as non-core or marked over-annotated. Smooth-muscle anti-apoptosis was modified to the cardiac muscle term after the PMC full text of PMID:20724525 was checked. The mouse spindle IEA was left UNDECIDED. The audit removed an unsupported cytoplasm core-function location, and references were given reference_review assessments.
