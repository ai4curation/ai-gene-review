  summary: 'Create review: KDM4C (reference relative for EQUAS KDM4C)'
  details: |
    De-novo review of human KDM4C (Q9H3R0) as the experimentally characterised PTHR10694:SF104 relative of donkey KDM4C, independent of ProtNLM2 predictions. Falcon and perplexity-lite deep research failed (Edison 403 auth), so the review uses UniProt plus cached primary papers (five newly cached, two already present). All 36 GOA rows reviewed: generic histone, H3K9 and H3K36 demethylase rows MODIFIED to the me2/me3-specific terms GO:0140684 and GO:0140681 (dual H3K9/H3K36 specificity is a vertebrate KDM4A-C property per PMID:21914792, absent from KDM4D/E); obsolete GO:0050681 AR binding MODIFIED to GO:0016922 nuclear receptor binding; broad IBA regulation of gene expression refined to GO:0045944; AR pathway, proliferation, pericentric heterochromatin, zinc and LSD1 enzyme binding kept as non-core. NEW: GO:0140002 H3K4me3 reader activity (double Tudor domain, human protein tested, PMID:24396064). No process NEWs (mouse ESC phenotypes are redundant/necessity evidence).
