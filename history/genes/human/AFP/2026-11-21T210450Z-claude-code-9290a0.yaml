  summary: 'IBA REMOVE re-review: response to nutrient levels row, seed evidence corrected'
  details: |
    Re-review of the IBA REMOVE on GO:0031667 response to nutrient levels (IBD at the PTHR11385 root PTN000147344). The action stands on bad-seed grounds, but the earlier text misstated the seed evidence. It said no experimental evidence was found for rat Gc and that the chicken ALB vitamin A row was unrelated. QuickGO by GO id with descendants shows rat Gc (P04276) holds GO:0031667 by IEP from PMID:12144717, and chicken ALB (P19121) holds GO:0033189 response to vitamin A, a descendant term, by IDA from PMID:2746374. Both abstracts (read through PubMed) describe plasma concentrations under dietary manipulation, not participation of the protein in a response. The summary, reason and the two source_entities comments were rewritten to count five experimental papers and to describe these two; the chicken ALB source status was changed from CIRCULAR_OR_REDUNDANT to SOURCE_WEAK_OR_INFERRED. No action changed; quotes untouched. Elsewhere in the file a reference finding still calls the rat albumin IEP the only experimental row on the endogenous protein in the donor set; that text was outside the row and was not edited.
