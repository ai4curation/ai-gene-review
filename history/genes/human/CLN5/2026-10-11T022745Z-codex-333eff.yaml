  summary: Review CLN5 lipid-enzyme functions and lysosomal trafficking
  details: |
    Reviewed all 51 original CLN5 annotation scopes while preserving their source objects, qualifiers, supporting entities and the 24 original reference identities. Synthesized a lysosomal BMP-forming lipid-enzyme core with explicit stereochemical and cellular-context limits. Retained synthetic-probe thioesterase activity as non-core and left the acyl-CoA, glycosyl-hydrolase and inaccessible source-specific evidence unresolved. Distinguished glycan carriage and precursor processing from the molecular activity of the annotated protein. Refined five authenticated binding assertions by partner class without inventing catalytic or physiological effects. Added primary-source notes, source provenance, reference assessments, rendered review and independent scientific review. Genuine research-provider failures are documented; no generated provider report was fabricated. Added no new GO assertions.
