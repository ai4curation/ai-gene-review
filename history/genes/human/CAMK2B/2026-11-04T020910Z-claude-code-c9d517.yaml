  summary: Initial review of CAMK2B annotations
  details: |
    Reviewed all 78 GOA rows for CaMKII beta. Accepted CaM-dependent kinase activity, holoenzyme membership, PSD/synapse, LTP and spine-plasticity terms; refined generic kinase, cytoskeleton, ER membrane, signal transduction and autophosphorylation rows; removed uninformative high-throughput protein-binding rows and mapped paralog-subunit binding to protein serine/threonine kinase binding. Added NEW actin filament binding and actin filament bundle assembly for the kinase-independent F-actin bundling role. Literature search recorded in CAMK2B-notes.md.
