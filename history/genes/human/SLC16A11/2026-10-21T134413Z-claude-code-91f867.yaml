  summary: 'Create review: SLC16A11 (Q8NCK7) as experimental reference for horse SLC16A11'
  details: |
    De novo review of human SLC16A11 (MCT11), the PTHR11360:SF80 ortholog and PAINT donor (PTN000888455 GO:0008028; PTN002260587 GO:0005886) for horse F6YMY3. Deep research failed (falcon auth failure, perplexity-lite quota), so the review rests on full texts of PMID:28666119 and PMID:24390345 plus six PubMed-retrieved papers. All 13 GOA rows reviewed: pyruvate transporter IDA refined to GO:0005477 (proton coupling shown by BCECF in the same paper); GO:0022857 and GO:0055085 refined; plasma membrane and monocarboxylate transport accepted; ER membrane kept as non-core (overexpressed steady-state pool); lipid metabolic process IDA marked over-annotated (downstream metabolomic effect, no participation); bare BSG protein binding removed per policy. Lactate transport noted as mouse-only evidence (PMID:39516648), not asserted for human. ProtNLM2 predictions not consulted.
