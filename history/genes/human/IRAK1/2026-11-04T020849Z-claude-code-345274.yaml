  summary: Full review of human IRAK1 (175 GOA rows)
  details: |
    Reviewed all 175 GOA rows. Kept protein serine/threonine kinase activity as core (autophosphorylation, Pellino/Mal/IRF7 substrates; required for TLR7/9-IRF7) alongside signaling adaptor activity as core (kinase-dead IRAK1 complements IL-1 signalling; TRAF6/NEMO scaffold). Refined generic kinase/binding/process terms, removed bare protein-binding rows, flagged an unverifiable negative-regulation-of-NF-kappaB IMP as UNDECIDED, and modified the Drosophila Toll signaling IBA to MyD88-dependent TLR signalling.
