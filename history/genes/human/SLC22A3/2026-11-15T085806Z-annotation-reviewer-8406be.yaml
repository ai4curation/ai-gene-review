  summary: De-novo review of all 109 GOA annotations for SLC22A3 (OCT3/EMT), extraneuronal
    monoamine/organic cation transporter
  details: |
    Reviewed every GOA row for SLC22A3 (O75751, OCT3/EMT). The extraneuronal monoamine transporter (uptake-2): low-affinity, high-capacity, corticosterone-sensitive clearance of noradrenaline/adrenaline/dopamine/serotonin/histamine/tyramine, complementing the high-affinity neuronal uptake-1 (NET/DAT/SERT); also polyspecific organic cations/drugs (MPP+, metformin). Electrogenic, Na+-independent, bidirectional; widespread (heart, placenta, glia, vessels). Two core MF (live, QuickGO non-obsolete; GO:0015101/GO:0015695 organic-cation grouping terms OBSOLETE): GO:0008504 monoamine transmembrane transporter activity (EMT role) + GO:0015651 quaternary ammonium group transmembrane transporter activity (polyspecific cation/TEA/MPP+). Actions (109): 46 ACCEPT, 22 REMOVE (21 bare GO:0005515 PDZ-scaffold partners of OCT3 C-terminal PBM; 1 GO:0072530 obsolete), 21 TOO_GENERAL (roots), 11 MARK_AS_OVER_ANNOTATED (mitochondrial/nuclear/endomembrane localizations = mouse-ISS/By-similarity only, no human; GO:0098793 presynapse inter-ontology inference inconsistent with extraneuronal/glial uptake-2), 9 KEEP_AS_NON_CORE (low-affinity choline KM~9.9mM, polyamine ISS, basal PM, neuronal cell body, BBB NAS). proposed_new_terms: none (used substrate-specific live terms; did not re-propose the obsoleted organic-cation grouping term - the GO-sanctioned approach the batch harmonized to). source_defects: none. Batch 13. Review-response (PR #6391): added a NEW GO:0030165 PDZ domain binding row (IPI, PMID:36115835, partners PDZK1/MPDZ) - the informative replacement for the 20 removed bare protein-binding rows, mirroring the OCTN1 paralog; trimmed the PDZ suggested_question to the genuine biological unknown. Tally now includes 1 NEW.
