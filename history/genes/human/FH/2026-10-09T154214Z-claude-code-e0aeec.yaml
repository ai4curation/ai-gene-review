  details: |
    De novo review of human FH (P07954), chosen from projects/MITOTOL.md (class I/class II fumarase pair, PMID:42822426, which is cited only for evolutionary context). All 59 GOA rows were reviewed. Fumarate hydratase activity, TCA cycle, fumarate/malate metabolism and the mitochondrion/matrix/cytosol/nucleus/chromosome locations were accepted. Catalytic activity was modified to fumarate hydratase activity, and the H2A.Z protein-binding row was modified to histone binding. Thirteen high-throughput protein-binding rows were removed. Arginine metabolic process, cold-induced thermogenesis and extracellular exosome were marked over-annotated. Urea cycle was kept as non-core. Two NEW annotations were added from PMID:26237645: positive regulation of DSB repair via NHEJ, and site of double-strand break. Core functions cover the mitochondrial TCA-cycle enzyme, the cytosolic fumarase, and nuclear fumarate-mediated NHEJ promotion.
