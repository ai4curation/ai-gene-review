  summary: 'Create review: GRM4'
  details: |
    New review of all 29 GOA rows for GRM4 (mGluR4). Core function: group III metabotropic glutamate receptor coupling to Gi/o to inhibit adenylyl cyclase (adenylate cyclase-inhibiting glutamate receptor activity and signaling); also activates MAPK. Localization: plasma membrane, presynaptic, with extracellular glutamate-binding Venus flytrap domain exposed. Generic GPCR/glutamate receptor activity and GPCR signaling modified to the adenylate cyclase-inhibiting descendants; membrane modified to plasma membrane; synaptic transmission, neurotransmitter secretion, MAPK, neuron apoptosis and regulation of glutamatergic transmission kept as non-core; synapse/presynapse accepted. Deep research providers unavailable; research in GRM4-notes.md.
