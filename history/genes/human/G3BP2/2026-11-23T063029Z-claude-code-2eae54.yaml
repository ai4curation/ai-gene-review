  details: |
    Created the human G3BP2 gene review for the stress-granule cohort. Fetched UniProt/GOA/publications, wrote G3BP2-notes.md from the cached literature (no deep-research provider key was available), and reviewed all 64 GOA rows. Core functions: RNA-dependent molecular condensate scaffold activity (GO:0140693) driving cytoplasmic stress granule assembly, and protein sequestering activity (GO:0140311) for cytoplasmic anchoring of IkappaB-alpha and TWIST1. Added one NEW row, ribosomal small subunit binding (GO:0043024), which G3BP1 already carries by IDA from the same experiment. Kept the ComplexPortal deubiquitination and both regulation rows as non-core, marked the generic cytoplasm, nucleic acid binding and membraneless organelle assembly rows TOO_GENERAL, and removed the bare protein-binding rows per the protein-binding policy. Validated with just validate human G3BP2 and just validate-quotes.
