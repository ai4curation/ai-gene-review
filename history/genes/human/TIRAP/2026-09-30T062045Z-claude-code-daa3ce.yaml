  summary: 'Create review: TIRAP'
  details: |
    Reviewed all 109 GOA rows for human TIRAP (Mal): 41 ACCEPT, 29 KEEP_AS_NON_CORE, 19 MODIFY, 15 REMOVE, 4 MARK_AS_OVER_ANNOTATED, 1 UNDECIDED. Core functions: signaling (bridging) adaptor activity coupling TLR4/TLR2 to MyD88 at the cytoplasmic face of the plasma membrane, TLR4 and TLR2 binding, and PIP2 binding. Key decisions: protein binding rows modified to TLR4 binding, RAGE receptor binding, PI3K regulatory subunit binding, protein kinase binding or signaling adaptor activity where the cited paper supports it, otherwise removed (high-throughput and pathogen-protein rows); positive regulation of TLR2/TLR4 signaling IMP rows modified to pathway membership terms; generic adaptor MF rows modified to GO:0035591; positive regulation of TLR3 signaling (ISS) removed as contradicted by knockout and reconstitution data; TLR1:TLR2 IDA generalized to TLR2 signaling because the paper used a generic TLR2 ligand; cell surface IDA modified to extrinsic component of cytoplasmic side of plasma membrane; IFN-beta regulation, myeloid differentiation, neutrophil chemotaxis and 3'-UTR mRNA stabilization marked over-annotated. just validate and validate-references pass.
