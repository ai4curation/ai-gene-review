  summary: 'Create: LEPR gene review'
  details: |
    Created the LEPR (P48357) review from the fetch-gene stub: all 65 GOA annotations reviewed with actions and evidence-backed reasons, standalone description, three core functions (leptin receptor activity at the plasma membrane; the leptin-mediated signalling pathway via STAT; hypothalamic regulation of feeding and energy homeostasis), questions and suggested experiments. Deep research providers were unavailable (falcon timed out, agentapi missing), so literature work was manual via PubMed and the publications cache, recorded in LEPR-notes.md. Notable calls: four uninformative protein-binding rows removed and three whose partner is leptin retermed to GO:0038021; GO:0150104 transport across blood-brain barrier marked over-annotated because blocking the leptin-receptor interface did not prevent translocation in a human BBB model and ObRa overexpression did not increase permeation; GO:0043235 IDA cited to a PX-FERM paper whose cached full text does not mention LEPR was accepted deferring to the curator with the limitation recorded. Validated with just validate human LEPR.
