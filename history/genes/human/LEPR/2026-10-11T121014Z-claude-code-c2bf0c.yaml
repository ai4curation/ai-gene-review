  summary: 'Review round 1: LEPR'
  details: |
    Review round 1 for PR 4814. Two changes. First, the notes header said deep research providers were unavailable and no report file existed; the report exists and was checked against the review, confirming the LEPRb/JAK2/STAT3 core annotation and the ER-as-biogenesis-compartment treatment, and adding the Saxton 2023 cryo-EM activation mechanism. Second, corrected the reason on both GO:0150104 transport across blood-brain barrier rows, which contradicted their own evidence by presenting PMID:20977476 as a null result when its finding is that ObRb over-expression increased leptin permeation. Restated: the refuted claim is specifically that the short isoform ObRa is the shuttle, since ObRa had no effect while astrocytic ObRb did increase permeation across the endothelial monolayer, which is LEPR signalling regulating transport performed by the endothelium rather than LEPR carrying leptin across. PMID:27037668 is now quoted on its actual conclusion, that ObR is not the primary leptin transporter at the human BBB. Action stays MARK_AS_OVER_ANNOTATED, with the reason now saying why it is not REMOVE.
