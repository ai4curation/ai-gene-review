  summary: 'De-novo review of human SLC10A7 (Q0GE19): resolved Golgi vs plasma membrane
    vs ER localization conflict, re-scoped the heparin biosynthesis term to heparan
    sulfate, and marked bone development non-core'
  details: |
    Reviewed all 18 seeded annotations (4 ACCEPT, 4 MARK_AS_OVER_ANNOTATED, 3 REMOVE, 3 UNDECIDED, 2 MODIFY, 2 KEEP_AS_NON_CORE). Localization: Golgi rows accepted as the physiological compartment (PMID:29878199 examined the human protein directly and contrasted it with yeast); all four plasma-membrane rows (EXP PMID:30082715, IDA PMID:17628207, IBA GO_REF:0000033, IEA GO_REF:0000044) marked over-annotated because both source observations are overexpressed epitope-tagged constructs without a surface marker and the IBA node is seeded by fungal/bacterial members; the two ER rows plus their IEA mirror left UNDECIDED because PMID:17628207 is abstract-only in the cache and its abstract reports only the plasma membrane. GO:0030210 heparin proteoglycan biosynthetic process MODIFYed (IMP and IEA rows) to GO:0015012 heparan sulfate proteoglycan biosynthetic process: heparin was never assayed, SLC10A7 catalyses no biosynthetic step, and the authors place Ca2+ deregulation upstream; comparator check (TMEM165 and SLC35D1 carry only transport terms, SLC35B2 carries GO:0050650 by IMP) is mixed, so the term was re-scoped rather than removed. GO:0060348 bone development kept as non-core on both rows as a pleiotropic developmental consequence. Three generic GO:0005515 rows (all DPY19L4/Q7Z388, from three high-throughput AP-MS screens) REMOVEd as uninformative. GO:0006874 ACCEPTed as the one directly measured, yeast-conserved mechanistic function. One core function recorded with GO:0022857 and an MF_DARK knowledge gap (substrate unidentified); no new terms proposed. Deep research providers were unavailable in this container, so the literature synthesis went into SLC10A7-notes.md.
