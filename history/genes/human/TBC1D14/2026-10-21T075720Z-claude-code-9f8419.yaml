  summary: 'Create review: TBC1D14'
  details: |
    De-novo full review of human TBC1D14 as the experimental reference for the cod ortholog A0A8C5FPT8, independent of ProtNLM2 predictions. Deep research failed (falcon 403, perplexity-lite timeout), so the review uses cached full text of PMID:22613832, PMID:26711178, PMID:17562788 and PMID:17646400. All 19 GOA rows were reviewed. The root-node IBA for GTPase activator activity was marked over-annotated: TBC1D14 keeps R472/Q508 but has no detectable GAP activity on 47 Rabs, and PAINT gave its own clade nodes no GAP term. Bare protein-binding rows were modified to protein kinase binding (ULK1) and small GTPase binding (RAB11B), and the HuRI NXF1 row was removed. Endosome was refined to recycling endosome, and autophagosome was kept as non-core. Added NEW molecular adaptor activity (Rab11-TRAPPIII bridge, PMID:26711178). Core functions are the Rab11 effector/TRAPPIII adaptor role in recycling-endosome-to-Golgi ATG9 traffic and regulation of autophagosome assembly.
