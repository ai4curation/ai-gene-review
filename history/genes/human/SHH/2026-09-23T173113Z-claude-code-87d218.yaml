  details: |
    Cleared 18 of the 19 unresolved annotations (18 UNDECIDED plus 1 PENDING) left in the SHH review, using the cached publications and the Hedgehog family review created in the same session. Left-right asymmetry (three rows, IEA/NAS/ISS), regulation of nodal signaling, dopaminergic neuron differentiation and its negative regulation, the eight ureter and kidney smooth-muscle differentiation rows, extracellular matrix (HDA matrisome detection) and regulation of proteolysis are all KEEP_AS_NON_CORE as context-specific downstream outcomes of ligand activity. Androgen metabolic process is MARK_AS_OVER_ANNOTATED: SHH performs no step of androgen metabolism and the steroidogenic enzymes do the chemistry. The bare protein-binding row is MODIFY to GO:0005113 patched binding, since its GOA record names PTCH1 as the partner and the cited structure paper proposes the same SHH pseudo-active-site groove as the Patched recognition surface, quoted verbatim in supported_by. Laminin-1 binding remains UNDECIDED: it is an ISS row with no publication and nothing local could adjudicate it. Validated with just validate human SHH (valid, no warnings) and re-rendered.
