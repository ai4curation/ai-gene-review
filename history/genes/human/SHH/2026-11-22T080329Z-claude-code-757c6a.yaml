  summary: Add positive regulation of cerebellar granule cell precursor proliferation
  details: |
    The module exemplar process check flagged human SHH in modules/cerebellum_development.yaml: the module places SHH in GO:0021940 and the review carried only the unsigned GO:0021930 by electronic orthology transfer. Added GO:0021940 as a NEW row, ISS from mouse Shh (UniProtKB:Q62226), citing PMID:10027293 (abstract only), which states that Shh applied to granule cell precursors induces a sustained proliferative response and that blocking Shh in vivo reduces their proliferation. Comparator check by term id: 10 annotations, all mouse (Shh, Egf, Fgf2, Igf1, Gpr37l1) or rat by ISO, none human, so the absence on human SHH is a species gap. Not added to core functions. just validate human SHH passes; the one best-practice warning (annotation 71) predates this change.
