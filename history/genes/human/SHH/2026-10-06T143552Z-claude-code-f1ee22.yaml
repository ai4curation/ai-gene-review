  summary: Revert 16 unsupported KEEP_AS_NON_CORE rows to UNDECIDED
  details: |
    A review bot on PR #4404 found that an earlier pass in this session flipped
    roughly sixteen annotation rows from UNDECIDED to KEEP_AS_NON_CORE without
    adding a single supported_by entry. The finding is correct and the rows are
    reverted.

    The failure mode is worth recording because the diff looked like
    improvement. Each flip replaced a summary saying the evidence was not
    exposed with a reason explaining why the biology is well established. The
    replacements were not false: SHH really is a central input to vertebrate
    left-right patterning, and midbrain dopaminergic induction really is one
    of its best-known outcomes. But that is background knowledge about the
    gene, not evidence for the annotation, and the action field records
    whether this annotation's evidence was verified. CLAUDE.md is explicit
    that UNDECIDED is the action when the relevant publications cannot be
    accessed, and three of these rows kept the admission in the new summary
    while changing the action, so the file asserted both that the cited paper
    does not assay SHH and that the annotation is retained.

    All sixteen KEEP_AS_NON_CORE rows are restored to their original review
    blocks: six IEA and six ISS rows on left-right asymmetry and the
    ureter/kidney smooth-muscle pairs, the two NAS rows on PMID:17507406, the
    HDA row on PMID:28344315, the TAS row on PMID:24431302, and the ISS
    regulation-of-proteolysis row, whose retention rested on what the term
    "most plausibly refers to".

    Two of the eighteen action changes stand. GO:0008209 androgen metabolic
    process moves to MARK_AS_OVER_ANNOTATED, which is an argument against an
    ISS-propagated term on participation grounds rather than a retention
    needing positive support: SHH performs no step of androgen metabolism and
    the steroidogenic enzymes do. GO:0005515 protein binding moves to MODIFY
    with GO:0005113 patched binding and a verbatim quote from PMID:19561609.

    The bot also asked for the reference_review blocks on PMID:17507406,
    PMID:24431302 and PMID:28344315 to move from UNVERIFIED to MISCITED. That
    part is declined, and in the opposite direction from the rest of this fix.
    All three are abstract-only in the cache, so MISCITED, which asserts the
    paper does not support the claim, is a stronger statement than an abstract
    licenses, and the curators who made these annotations read full text this
    repository does not have. Restoring the original hedged summaries removes
    the contradiction the bot identified without manufacturing a claim about
    papers that have not been read. UNVERIFIED is the accurate value.

    Status moved from IN_PROGRESS to DRAFT: GeneReviewStatusEnum defines
    IN_PROGRESS as having at least one PENDING annotation, and this review has
    none, while the seventeen UNDECIDED rows and one pre-existing validation
    warning rule out COMPLETE.
