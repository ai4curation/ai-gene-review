  summary: 'Create review: human GZMH'
  details: |
    First review of human GZMH (UniProtKB:P20718). All 12 GOA rows reviewed, plus two proposed NEW rows.

    No deep research available: only openscientist and claude_code are registered as providers in this environment, and the one openscientist run attempted in this batch (for GZMK) was stopped by the session's background limit without output. No -deep-research-*.md file was written; the manual research is in GZMH-notes.md with inline provenance.

    Core function: GO:0004252 serine-type endopeptidase activity, described as the chymase it is - a Thr-Gly-Gly S1 triad selecting bulky aromatics at P1, plus an RKR motif unique to this granzyme that additionally requires acidic residues at P3' and P4'.

    Proposed (2 rows), both IDA from PMID:17363894, the one paper that gave this orphan granzyme a function: GO:0051607 defense response to virus, and GO:0045071 negative regulation of viral genome replication. Checked in the ontology that the two are in unrelated branches so neither entails the other. Comparator check with a verified positive control: of seven granule effectors reviewed in this project, perforin carries GO:0051607 three times in its own GOA file and the six granzymes plus granulysin carry it zero times; the absence reads as this gene's annotation state rather than a convention, since perforin's rows rest on necessity evidence from knockout mice while granzyme H's rest on direct cleavage of the viral substrate.

    Re-levelled: the two GO:0006915 apoptotic-process rows, both NAS from 1990 cloning papers whose own abstracts call the involvement in cytolysis a postulate, to GO:0140507, which this gene lacked. Recorded in the reason that this is a lateral MODIFY rather than a refinement, checked in the ontology: GO:0140507 sits under programmed cell death and signaling, not under apoptotic process.

    Marked over-annotated: GO:0016020 membrane (HDA, NK membrane proteome), as the same row was on granzyme B. TOO_GENERAL does not apply because no more specific membrane term is asserted on this gene.

    Kept as non-core: GO:0051604 protein maturation (IBA). Every established granzyme H substrate is destroyed rather than matured, and the one case that looks like maturation is indirect - relieving the adenoviral 100K inhibition restores granzyme B without cleaving it. That is a weaker reading than this project gave the same propagation on granzymes A, B and K, and the reason is recorded.

    Source defect: UniProt CC:FUNCTION carries the antiviral sentence evidenced to PubMed:22156497 and PubMed:23269243, neither of whose abstracts mentions a virus; PMID:17363894 is named as the candidate, located by a PubMed title search and read at abstract level. WRONG_REFERENCE, PROBABLE, requested_change CHECK, with the depth of the claim stated.

    Validation: just validate clean, 23 quotes verified, record sections backfilled.
