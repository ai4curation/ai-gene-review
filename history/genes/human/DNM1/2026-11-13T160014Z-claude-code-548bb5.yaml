  details: |
    Checked why the DNM1 review is still DRAFT. Re-fetched GOA: DNM1-goa.tsv unchanged and every GOA row already reviewed, so no rows added or withdrawn; the newer UniProt record was not overwritten. Validation has no errors; its nine warnings are the protein_binding_policy warnings on GO:0005515 rows kept as KEEP_AS_NON_CORE under the ClinGen Mendelian project instruction, so the computed status is DRAFT and was left so. Re-read the two UNDECIDED rows: extracellular exosome (HDA, PMID:23533145) cannot be settled because the DNM1 identification is only in an unreadable supplementary table; clathrin coat assembly involved in endocytosis (ISS from mouse P39053, PMID:35220002) is not measured by the donor paper. Both stay UNDECIDED. Core functions: the fission core description now states synaptic vesicle endocytosis explicitly, with a verbatim PMID:35220002 quote; added a second core function, SH3 domain binding (GO:0017124) by the proline-rich domain, the term 16 protein-binding rows are modified to, quoting PMID:9922133 and PMID:15703209. Notes file appended. No annotation actions changed.
