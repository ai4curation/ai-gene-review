  summary: Create human CSF2 GM-CSF annotation review
  details: |
    Created a de novo human CSF2 annotation review from the fetched UniProt and
    QuickGO rows, preserving all 73 GOA rows including repeated Reactome
    extracellular-region assertions and distinct IntAct WITH/FROM partners.

    Accepted the core secreted GM-CSF cytokine calls for cytokine activity,
    GM-CSF receptor binding, extracellular region, GM-CSF receptor complex
    membership, receptor/JAK-STAT signaling, and myeloid differentiation based
    on expression-cloning, receptor-structure, UniProt, and PAINT evidence.

    Removed only bare GO:0005515 protein-binding rows under the protein-binding
    policy, bounded old cell-culture annotations to UNDECIDED or non-core
    actions when cached abstracts did not expose the CSF2-specific assay, and
    marked rat Ensembl-Compara phenotype transfers as over-annotations rather
    than core human GM-CSF functions.
