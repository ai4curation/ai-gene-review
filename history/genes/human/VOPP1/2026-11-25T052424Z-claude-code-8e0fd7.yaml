  summary: Record OpenScientist topology and determinant analysis for VOPP1 scaffolding
  details: |
    Ran an OpenScientist deep-research job (kgap-vopp1-scaffold-determinants) on the knowledge gap covering VOPP1's scaffolding architecture beyond the PPPY motif. The topology it derives matches the local Q96AW1 record exactly: cleaved signal peptide 1-22, folded cysteine-rich lumenal module 23-60 with six cysteines, a single transmembrane helix 61-81, and a 91-residue cytoplasmic tail 82-172 that is 27.5 per cent proline and largely disordered, with every candidate interaction motif on the cytoplasmic face. All three PPxY positions (116, 154, 162), the invariant RRRM patch at 82-85, the six lumenal cysteine positions, the C-terminal PPPPYEQVVKAK and the absence of any dileucine or NPxY motif were confirmed directly in the local sequence.

    The run argues against the multivalent-scaffold reading at the level of tested function, and that is the substantive result. The YxxPhi signal YEQV 165-168 is not an independent determinant: it shares the single tyrosine Y165 with PPPY 162-165, so WW-domain occupancy and AP mu-subunit recognition are mutually exclusive uses of one residue, and phosphorylation of Y165 would block both. Y165 also fails both positional requirements of the canonical lysosomal tyrosine signal, sitting seven residues from the C-terminus and preceded by proline where LAMP1, LAMP2, CD63 and TSPAN6 place theirs three residues from the end after glycine. The only mutagenesis available, curated into UniProt from PMID:30285739 and present verbatim in the local record, points the same way: Y119A and Y157A leave WWOX binding unchanged and only Y165A reduces it.

    Status moved from OPEN to NARROWING. What the run adds positively is a ranked determinant set beyond PPPY, namely a second PPxY at 154-157 retained as PPxY class in all 27 aligned orthologs, the 100 per cent conserved RRRM juxtamembrane basic patch satisfying the positive-inside rule, and the disulfide-stapled lumenal module. Its reading is that VOPP1 is a single-motif adaptor for WWOX specifically, that the conserved but WWOX-dispensable PPAY at 154-157 is a candidate docking site for a different WW-domain protein, and that multivalency survives only as an architecture-level prediction rather than an observation. That framing is recorded as the run states it, including the caveat.

    No annotation action was taken; the gap concerns compartment architecture rather than any existing row, and the cellular-component annotations the review already accepts are unaffected.
