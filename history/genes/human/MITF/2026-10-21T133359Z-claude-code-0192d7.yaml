  summary: 'Create review: human MITF (reference for EQUAS MITF ortholog)'
  details: |
    De-novo review of all 130 GOA rows for human MITF (O75030), reviewed as the experimentally characterised ortholog (PANTHER PTHR45776:SF4; seed of MiT/TFE root IBDs at PTN005248237) for donkey MITF A0A9L0JBN5, independent of ProtNLM2 predictions. Falcon deep research failed (authentication) and perplexity-lite fallback hit quota, recorded in notes; review built from cached publications, UniProt, Reactome and PAINT. Core: Pol II-specific DNA-binding transcription activator binding E-box/M-box (human EMSA/reporter/ChIP), nucleus, melanocyte differentiation (tetrapod IBD). Generic regulation/initiation terms MODIFIED to positive regulation of transcription by RNA polymerase II; protein binding rows MODIFIED to heterodimerization (TFE3/TFEB) or DNA-binding TF binding (SOX9), or REMOVED (SUMO1, USP13 substrate interactions); in vitro co-IP complex terms marked over-annotated; cytoplasm/lysosomal membrane kept as non-core regulatory locations. Lysosome organization/autophagy terms not transferred: PAINT places them only on the TFEB/TFE3 node.
