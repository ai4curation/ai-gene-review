  summary: De-novo review of all 76 GOA annotations for SLC16A7 (MCT2), proton-coupled
    high-affinity lactate/pyruvate transporter
  details: |
    Reviewed every GOA row for SLC16A7 (O60669, MCT2). Two core MF (QuickGO-verified): GO:0015650 lactate:proton symporter activity (is_a GO:0015129 / GO:0015355 / GO:0015293 symporter) and GO:0005477 pyruvate secondary active transmembrane transporter activity (is_a GO:0050833 / GO:0015355; no pyruvate:proton-symporter term exists, so most specific available). H+-coupled high-affinity (pyruvate Km~25uM) neuronal/testis transporter. EMBIGIN (Q6PCB8) partnership debated (PMID:32415067); NOT asserted as complex membership (see review-response below). Both core_functions at GO:0005886; substrates (S)-lactate/pyruvate/hydron ChEBI. Actions (76+1 NEW=77): 39 REMOVE (bare protein binding, overwhelmingly C-terminal PDZ scaffolds DLG4/GRIP/MPDZ/MAGI/SCRIB etc.), 21 ACCEPT (incl. homodimer GO:0042802), 10 KEEP_AS_NON_CORE (cytoplasm, basolateral/synaptic localizations), 3 MODIFY (GO:0015293 symporter->GO:0015355 secondary-active monocarboxylate x2, membrane->PM), 2 TOO_GENERAL (root terms), 1 MARK_AS_OVER_ANNOTATED (GO:0150104 BBB transport = MCT1 not MCT2, participation-test fail), 1 NEW (GO:0015650 lactate:proton symporter, the combined core MF). source_defects: none. Review-response (PR #6383): (a) the two GO:0015293 symporter MODIFY rows retargeted GO:0015650->GO:0015355 because their only evidence is H+-coupled PYRUVATE, not lactate; the lactate:proton symporter core is instead asserted as an explicit NEW GO:0015650 row (lactate IDA + proton-coupling synthesis). (b) the NEW GO:1902495 EMBIGIN complex row and core_functions in_complex were DROPPED - the support was UniProt By-similarity (rodent) with human cryo-EM contradiction, which does not clear the NEW bar (unlike MCT4/SLC16A3 BSG, which has direct human IDA); EMBIGIN kept as a suggested_question. Batch 11.
