  details: |
    Full review of human MAPK14/p38 alpha (Q16539): all 195 GOA rows reviewed (67 ACCEPT, 71 MODIFY, 29 KEEP_AS_NON_CORE, 11 MARK_AS_OVER_ANNOTATED, 17 REMOVE). Core functions: MAP kinase activity in the p38MAPK/stress-activated MAPK cascade (cytosol and nucleus) and nuclear phosphorylation of Pol II transcription factors. 85 bare protein-binding IPI rows resolved by partner to protein kinase binding (MK2/MK3/MSK/MNK/ERK1/CK1d), MAP kinase kinase binding (MKK3/MKK6) or protein phosphatase binding (DUSPs, PTPRR, PPM1A), with non-enzyme partners removed. MAP kinase kinase activity TAS removed as a term-selection error; neutrophil-degranulation compartments and inhibitor-only downstream processes marked as over-annotated; MAPK p38 binding on MAPK14 modified to protein kinase binding. Added notes file, description, reference reviews and suggested questions/experiments.
