  summary: 'IBA REMOVE re-review: GO:0043066 changed from REMOVE to MARK_AS_OVER_ANNOTATED'
  details: |
    Re-review of the IBA row GO:0043066 (negative regulation of apoptotic process) against the PTHR11256 tree (projects/IBA_REVIEW/rereview-2026-11-21, batch 05). The IBD sits at the family root PTN000135648 with 23 seeds. The earlier reason said the row crossed a pro/anti-apoptotic split; the tree has no such single split (BAX clade PTN008515428 sits beside the MCL1 and BCL2A1 clades) and one seed, mouse Bax (MGI:99702), lies inside the BAX clade. QuickGO shows its rows under the term are MGI acts_upstream_of_or_within rows (GO:0043524 IDA PMID:8625820; GO:2001234 IGI PMID:18436203); the PMID:8625820 abstract reports that overexpressed Bax rescued NGF-deprived sensory neurons. Because an ortholog carries real, if context-specific, experimental support, none of the four REMOVE grounds holds, and the action was changed to MARK_AS_OVER_ANNOTATED with a rewritten summary, reason, supported_by quote and propagation_review. PMID:8625820 was added to references. No other row was touched. Validated with just validate human BAX (valid; warnings pre-existing).
