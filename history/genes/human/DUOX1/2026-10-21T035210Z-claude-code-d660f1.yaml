- type: REVIEW
  outcome: changed
  summary: 'Full re-review of human DUOX1 (Q9NRD9): all 75 annotations re-decided,
    superoxide rows corrected to H2O2 on PAINT node evidence, nematode cuticle IMP
    removed'
  details: |
    Re-reviewed every existing annotation independently of ProtNLM2 output. Twenty rows that were UNDECIDED are now decided. Key changes: the two superoxide rows (GO:0016175 IBA, GO:0042554 IBA and NAS) are MODIFYed to their H2O2 counterparts (GO:0016174, GO:0050665) because PAINT places superoxide generation at the deep NOX/DUOX node PTN000239643, seeded by NOX-branch members, and H2O2-forming activity at the DUOX-specific node PTN000944147, seeded by DUOX1 itself; direct measurement agrees (PMID:15972824, PMID:22814254). GO:0042335 cuticle development (IMP) is removed as a C. elegans RNAi phenotype transferred onto the human protein, with bli-3 in subfamily SF175 rather than SF75 and a heme-binding peroxidase domain the human protein lacks. GO:0006979 response to oxidative stress (InterPro IPR010255 mapping) is removed: the signature is the peroxidase-homology domain that binds no heme in human DUOX1, and the mapping inverts oxidant generation into oxidant response. The five bare GO:0005515 rows become GO:0046982 (DUOXA1/DUOXA2 heterodimerization) under the protein-binding policy; GO:0019221 becomes GO:0071345 because the evidence is transcript induction; GO:0050661 becomes GO:0070402; GO:0009615 is marked TOO_GENERAL under GO:0140374. The NOT GO:0004601 row is kept with new structural support and the conflicting PMID:11514595 recorded as DISPUTED in its reference_review. Description rewritten project-independently, one core_function recorded, a proposed_new_term added for the NAADPH-oxidizing reaction (Rhea:86235) that GO lacks, one knowledge gap recorded for the peroxidase-homology domain, and reference_review added to all 15 literature references. Deep research could not be regenerated: falcon errored and perplexity-lite timed out; this is recorded in the notes rather than substituted.
