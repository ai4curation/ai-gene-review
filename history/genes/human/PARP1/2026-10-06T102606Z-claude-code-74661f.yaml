  summary: 'Correct cell-death terms after review: PARP1'
  details: |
    The parthanatos ISS row to GO:0060545 positive regulation of necroptotic process changed from ACCEPT to MODIFY with GO:0097300 programmed necrotic cell death, because necroptosis is defined by RIPK1/RIPK3 and MLKL and parthanatos needs neither. Removed the parthanatos core function: parthanatos is regulated but not programmed death and is non-core for PARP1. Corrected a false justification claiming AIFM1 carries GO:0060545 by convention (its row is UNDECIDED). Suggested question now asks whether GO should keep parthanatos as a synonym of necroptotic process.
