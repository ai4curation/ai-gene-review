  summary: 'Create review: FUS'
  details: |
    De-novo review of human FUS (P35637) for the Stress Granule Assembly Project
    (issue 3953), which lists FUS among its 16 candidate genes. All 137 seeded GOA
    rows were adjudicated and three NEW rows added.

    No provider deep-research file: `just deep-research` reported no available
    provider in this environment, so the research record is FUS-notes.md, with every
    assertion cited to a primary paper, the UniProt record, or a resolved database
    record.

    Main decisions:
    - No stress-granule annotation. The comparator check is positive (TIA1, ATXN2 and
      TARDBP all carry GO:0010494), so the absence on FUS is not a term-level
      convention, but the gene-level literature says GOA is right: endogenous FUS is
      dispensable for granule assembly (PMID:23092511), recruitment requires prior
      cytoplasmic mislocalisation (PMID:22563080), and the association is explicitly a
      mutant-specific phenotype (PMID:24090136). Recorded as a BIOLOGY knowledge gap
      with a matching suggested experiment instead. These three PMIDs were fetched and
      added to references with findings.
    - GO:0048255 mRNA stabilization (IDA, PMID:27378374) MODIFYed to GO:0043488
      regulation of mRNA stability, with a WRONG_TERM source defect against MGI: the
      paper's own counts show FUS loss stabilised 330 transcripts and destabilised 44,
      i.e. the annotated direction is backwards.
    - Both GO:1990000 amyloid fibril formation rows MARK_AS_OVER_ANNOTATED: both cited
      papers state the fibrils are unlike pathogenic amyloid, and the meaningful content
      is already on GO:0140693 and GO:0140694.
    - Both GO:0043484 rows MODIFYed to GO:0000381, which is what each row's own
      alternative-splicing assay measured.
    - GO:0003676 and both GO:0006355 rows TOO_GENERAL under the accepted GO:0003723 and
      GO:0006357 rows.
    - 56 bare GO:0005515 rows REMOVEd per the protein-binding policy; the DROSHA row's
      content recovered as the NEW GO:0031053 row.
    - NEW: GO:0003697 and GO:0003690 (IDA, PMID:10567410 -- GOA had the HR-repair
      process row from that paper but no DNA-binding function) and GO:0031053 (IMP,
      PMID:23232809), the latter following the DDX5/SRRT/SRSF3/HNRNPA2B1 convention
      rather than the near-unused GO:2000636 regulation term.

    `just validate human FUS` is clean (no errors, no warnings); repo-wide
    `just validate-quotes` reports 0 failures with 131 quotes verified in this file.
