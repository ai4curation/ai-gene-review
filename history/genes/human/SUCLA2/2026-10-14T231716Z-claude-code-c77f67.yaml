  summary: 'Round 24: drop version narration and the round reference from the GO:0003824 reason, state three of six rows as EXP, and record the organelle-level localization decision in the gene notes'
  details: |
    Round 24 of PR #4810. Both items were metadata and prose rather than any call, and both are taken.

    The first removed version narration from two curated reason fields. The SUCLA2 GO:0003824 reason and
    the MTFMT GO:0003824 reason each ended by naming the action the row previously carried, and the
    SUCLA2 one also cited "round 22" of this pull request. Round 4 of this same PR removed that shape
    from TARS2 by agreement, on the ground that a sentence about an earlier version of the review is a
    session note committed as curated content, and a round number is a reference a reader of the gene
    folder cannot resolve at all. Both reasons state the whole argument without it - the term is true
    but uninformative because a named descendant is accepted in the review, and that descendant is a
    confirmed is_a descendant in the QuickGO closure - so the clauses were dropped and nothing was added
    in their place. The history records already carry the action change. A scan of all eighteen changed
    reviews for round numbers, PR references and earlier-version phrasing returns nothing further; the
    "refined here for the same reason as the GO:0005737 row in this review" cross-references in FBXL4,
    TARS2 and UCP2 point at current file content and are left alone.

    The second was a sections list that described the round rather than each record's own target. All
    three round-23 records declared existing_annotations and notes while each touched one of the two.
    The schema describes sections as the target sections "considered or changed", which covers TRMT10C
    (notes changed; the eight GO:0005739 rows were read and the decision not to refine them is what the
    notes addition records) and MTFMT (notes changed; the four rows were converted and reverted). It
    does not cover SUCLA2, whose record claimed notes when nothing in SUCLA2-notes.md was read or
    written that round - which is the same gap the first suggestion found from the other side. That
    record's sections is corrected in place to existing_annotations alone, per the never-true rule in
    docs/history.md; the frozen target fields are untouched.

    Three suggestions, all taken. The organelle-level decision recorded in round 23 reached MTFMT and
    TRMT10C and missed SUCLA2, which holds the largest group of the three at ten GO:0005739 ACCEPT rows
    against TRMT10C's eight and MTFMT's four. The clause is now in SUCLA2-notes.md on the same ground,
    with one addition the other two did not need - all ten SUCLA2 reasons describe the protein as a
    matrix TCA-cycle enzyme, naming a compartment narrower than the row annotates, so the note says
    explicitly that background on the protein is not the same as an argument that the row's term should
    be refined, since that is the distinction the rule turns on. The ten reasons were read rather than
    pattern-matched to establish it. The GO:0003824 reason's "six rows including an EXP one" is now
    "six rows, three of them EXP", which is what the file shows at the three EXP rows. And the
    paragraph rewritten in place in the round-22 record carried six-space continuation lines inside a
    four-space literal block, which rendered with two leading spaces no other paragraph had; it is
    dedented, with the text unchanged.

    Validation: both changed reviews pass. SUCLA2 has two warnings and MTFMT three, all pre-existing -
    the unreferenced falcon deep-research file in each, and MTFMT's standing core_functions.locations
    warning for GO:0005759, which is the warning the round-23 experiment cleared and the revert
    restored.
