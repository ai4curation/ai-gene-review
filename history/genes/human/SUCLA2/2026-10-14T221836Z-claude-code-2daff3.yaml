  summary: 'Round 20: reword the GO:0006105 reason rather than change its action,
    since GO:0006099 is not in an ancestor relation with it'
  details: |
    Round 20 of PR #4810. One row in this review was flagged under a rule that arrived with the
    Shepherd's merge of main, and the outcome is a reworded reason rather than a changed action.

    The merge (5b65d4a3f) brought CLAUDE.md line 184 from PR #4881 - never ACCEPT or KEEP_AS_NON_CORE
    while arguing that the term is too general. The GO:0006105 succinate metabolic process row (IEA from
    GO_REF:0000107) carried KEEP_AS_NON_CORE with the reason "Succinate metabolic process is correct
    (succinate is a product/substrate) but more general than the TCA-cycle step." The prose argued
    generality, so the row read as the pattern the rule forbids.

    But the rule is about refinement, and refinement does not apply here. GO:0006099 tricarboxylic acid
    cycle, the core step this row was being compared against, is neither an ancestor nor a descendant of
    GO:0006105 - checked in both directions against the QuickGO ontology ancestors endpoint under
    is_a/part_of, and neither contains the other. So there is no more specific supported term for a
    MODIFY to propose, and the rule's own provision governs instead: if the general term is already as
    precise as the evidence allows, keep it, ACCEPT if core and otherwise KEEP_AS_NON_CORE.

    The action therefore stands and the reason is rewritten to stop asserting a generality relation that
    does not hold. It now says the term is as precise as this inference warrants, since SUCLA2 produces
    succinate from succinyl-CoA, and that it is kept as non-core rather than refined because the two
    terms are separate branches rather than a general and a specific form of one claim - with the
    closure check recorded, so a later reader does not have to redo it or re-reach for MODIFY.

    This is the case where taking the reviewer's flag at face value and converting the action would have
    been wrong. The flag was correct about the prose and correct to raise the row; the remedy it
    suggested as possible - that this one may need only a reworded reason - is the one the ontology
    supports, and it was checked rather than assumed in either direction.

    Verification: ai-gene-review validate passes, with two warnings, both pre-existing and unrelated to
    this change. A re-scan for ACCEPT or KEEP_AS_NON_CORE rows whose reason argues generality now returns
    zero for this file. The action, term and supporting_text are untouched; only the reason prose moved.
    No colon-space sequence in the new prose, asserted before writing.
