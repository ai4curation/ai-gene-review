  summary: 'Retrospective audit corrections: SUCLA2'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. Action changes: GO:0110052 toxic metabolite repair (IDA, PMID:40108300) MARK_AS_OVER_ANNOTATED -> UNDECIDED, as for SUCLG1. GO:0046872 metal ion binding (IEA) KEEP_AS_NON_CORE -> MODIFY to GO:0000287 magnesium ion binding, which the gene already carries. GO:0003824 catalytic activity (IEA) stays TOO_GENERAL; the reason is now worded the same way in all eleven subunit reviews (true but uninformative, entailed by the accepted specific activity). Other changes: core function GO:0004775 moved from molecular_function to contributes_to_molecular_function. Affinage DISPUTED -> LOW_QUALITY with the dispute on its GO-grounding finding; its supported_by entry on the GO:0004775 IBA row was removed (the row keeps PMID:15877282). Itaconyl-CoA formation is described as reported but contested. Status COMPLETE -> DRAFT, because the GO:0110052 row is UNDECIDED until the published text of PMID:40108300 is read. Validated with just validate human SUCLA2; one advisory warning (no annotation cites the Affinage file) follows from the removal and is accepted.
