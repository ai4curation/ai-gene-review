  details: |
    The published full text of PMID:40108300 could not be obtained (no PMCID, publisher paywall; the cache stays abstract-only), so the GO:0110052 toxic metabolite repair IDA row stays UNDECIDED and the status was not changed. The reason, summary and supported_by of that row were rewritten. The UniProt annotation extension (QuickGO by reference) shows the curator attached the term to itaconyl-CoA formation (GO:0016878 part_of GO:0110052, input itaconate), not to malyl-CoA formation, so the earlier lean toward over-annotation was removed and the open point is now term fit. The supporting quote on CLYBL repairing malyl-CoA was replaced by the curated UniProt FUNCTION sentence and the abstract sentence on itaconyl-CoA and methylmalonyl-CoA mutase. The PMID:40108300 reference note now lists what was read outside the cache (published Supplementary Information and Table 1 source data; bioRxiv version 2 as web-fetch excerpts) with the kinetic values. Suggested questions were updated. Notes record the routes tried and the sources read.

    Follow-up after independent checks (same day). The forecast that the row would become KEEP_AS_NON_CORE was removed from the GO:0110052 reason: the cached abstract and the preprint excerpts assign the repair role to CLYBL acting on malyl-CoA, so the open choice is between KEEP_AS_NON_CORE and MARK_AS_OVER_ANNOTATED. The abstract sentence on CLYBL as a repair enzyme for malyl-CoA was restored as a supporting quote. The reference note says the computed ratios are close to, not equal to, the preprint folds.
