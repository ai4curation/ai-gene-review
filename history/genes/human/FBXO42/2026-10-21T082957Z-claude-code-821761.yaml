  summary: 'Create review: FBXO42'
  details: |
    De-novo review of human FBXO42 (Q6P3S6), the PTHR46432:SF1 ortholog of fly Fbxo42 (Q9W281), written independently of ProtNLM2 predictions. Deep research could not be run: falcon failed authentication and perplexity-lite returned 401 (quota), which is recorded in the notes. The review is built from primary papers (PMID:19509332, 21127074, 36129980, 41484364, 41986709, 39134694, 33539788). Actions: 9 GO:0005515 IPI rows removed under the protein-binding policy. SCF complex (IBA, NAS), substrate-adaptor activity (IBA, IDA), SCF-dependent proteasomal catabolism (IDA, NAS) and nucleus (IDA, IEA) accepted. Two NEW annotations from PMID:36129980: protein K63-linked ubiquitination (RBPJ K175) and positive regulation of Notch signaling. The notes flag that UniProt's description of K48-linked degradation of PP4 subunits is not what PMID:41484364 reports (it reports non-degradative, K33-preferring ubiquitination).
