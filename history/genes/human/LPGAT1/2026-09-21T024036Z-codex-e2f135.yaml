  details: 'Reviewed all 31 rows; 12 action changes. All source fields preserved. All 31 annotation rows
    were reassessed. Broad ER/endomembrane/membrane and acyltransferase annotations were restored. Secondary
    MGAT capacity is retained as non-core rather than rejected merely for weakness (mouse ortholog evidence
    PMID:20018982). TG biosynthesis, PG and PI remodeling remain explicitly unresolved. PMID:36049524
    reports "The sn-1 LPLAT activities for LPI and LPG were also lower but still present in the KO mice."
    This is incompatible with treating poor substrate usage as a categorical negative. PMID:15485873 reported
    positive human LPG acylation but negatives for now-established LPC/LPE activity; assay conditions
    and positional mixtures matter. PMID:42173283 provides substantial newer human Huh7 and mouse evidence
    for PC/PE/PS remodeling and limited PG effects; its proposed acyl-migration explanation is not proof
    that the original LPG assay was artifactual. PMID:37917582 provides the conflicting ER-PG-remodeling/mitochondrial-transport
    model.


    GO:0106263 specifies the opposite lysophosphatidylserine positional reaction from the best established
    sn-1 acylation. The primary detailed positional product experiment uses LPC, so do not turn predominant
    sn-1 preference into proof that every LPS sn-2 reaction is impossible. Keep this exact reaction uncertain
    pending coordinated adjudication. The two LPA-specific Reactome mappings remain MODIFY because an
    LPG reaction and an LPA reaction have different chemical participants; this correction does not claim
    all trace LPA turnover absent.


    The two pre-existing NEW PC/PS remodeling assertions were retained after participation and redundancy
    checks: LPGAT1 performs the reacylation chemistry; these sibling processes add head-group coverage
    alongside PE remodeling. PMID:42173283 directly reports Huh7 loss of stearoyl-unsaturated PC and PS;
    mouse results alone were not used as human-specific proof. The description/core were adjusted to avoid
    overstating exclusivity or treating acyl migration as a demonstrated explanation. PAINT PTHR10983
    uses PTN000105009 for endomembrane/acyltransferase and PTN000105011 for ER/PI remodeling. No donor-count
    or target-self-inclusion objection was used. No pre-existing OpenScientist cache match was found;
    root coordinates the pending focused report.'
