  summary: 'SPRY2: OpenScientist confirms CBL TKB motif for GO:1990948; motif not
    SPRY2-specific'
  details: |
    OpenScientist (3 iterations; report SPRY2-hypotheses/spry2-cbl-tkb-motif/openscientist.md) tested whether SPRY2 Tyr55 lies in a canonical CBL TKB-binding motif absent from SPRY4. Verdict: partially supported.
    - Tyr55 (NEYTEGP) matches the consensus 4/4 and is conserved across vertebrate SPRY2 orthologs, supporting the NEW GO:1990948 ubiquitin ligase inhibitor activity.
    - SPRY1 carries the identical window and SPRY4 a 3/4 match. The SPRY2-vs-SPRY4 difference therefore rests on CIN85-binding proline-arginine motifs, not the TKB motif.
    Added Rubin 2003 (PMID:12593795, PubMed-verified and cached) and Fong 2003 (PMID:12815057) as supporting text, cited the report, and recorded the paralog caveat in the reason.
