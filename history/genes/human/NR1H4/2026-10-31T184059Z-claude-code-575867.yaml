  summary: 'Create: NR1H4 (FXR) gene review'
  details: |
    First review of NR1H4/FXR, curated because the four bile-acid modules in this repository (bile_acid_biosynthesis, bile_acid_synthesis_ring_modification, bile_acid_synthesis_sidechain_conjugation, enterohepatic_bile_salt_cycling) all name FXR-mediated feedback as the regulation of the flux they carry, while neither FXR nor its downstream repressors NR0B2/SHP and NR5A2/LRH-1 had a review here. The FGFR4/beta-Klotho receptor end of the intestinal arm was already covered in the fgfr_signaling module; this review covers the ligand-sensing end.

    All 112 seeded GOA rows reviewed: 62 ACCEPT, 32 KEEP_AS_NON_CORE, 6 TOO_GENERAL, 5 REMOVE, 4 MARK_AS_OVER_ANNOTATED, 2 MODIFY, 1 UNDECIDED. Three core functions recorded, anchored on bile acid nuclear receptor activity (GO:0038186), the two-arm feedback repression of CYP7A1/CYP8B1, and the transcriptional control of bile-acid conjugation, export and reuptake.

    Judgement calls worth flagging for a reviewer:

    GO:0010903 negative regulation of VLDL particle remodeling (IDA, PMID:27471003) -> MODIFY. GO:0034372 defines remodeling as post-secretory acquisition/loss/modification of protein or lipid within the particle, including lipase-mediated triglyceride hydrolysis. The citing study measured hepatic VLDL-TG secretion, repressed via SHP-mediated suppression of HNF4A-driven PLA2G12B. FXR's recorded effects on actual remodeling run the other way, since it induces APOC2 and represses the lipase inhibitors APOC3 and ANGPTL3. GO has no regulation-of-VLDL-assembly term, so the replacement is the lateral triglyceride homeostasis term the entry already carries and the gap is recorded in proposed_new_terms.

    GO:0015721 bile acid and bile salt transport (TAS, involved_in) -> MARK_AS_OVER_ANNOTATED. FXR transports nothing; it induces ABCB11, ABCC2 and ABCB4 and represses SLC10A1. The regulation is central to its function but is mis-stated as participation, and GO has no regulation-of-transport child to modify to. Second proposed_new_terms entry.

    GO:0032740 positive regulation of interleukin-17 production (IDA, PMID:21242261) -> UNDECIDED. The direction contradicts everything else that study reports and IL-17 is absent from the cached abstract; the full text is not available in this repository. Not challenged, per the rule against overruling curators from incomplete evidence.

    GO:0000050 urea cycle and GO:2001250 -> KEEP_AS_NON_CORE rather than over-annotated. PMID:21757002 maps an FXRE in the human and mouse NAGS promoters by EMSA, ChIP and reporter assay, and N-acetylglutamate is the obligate activator of the cycle's first enzyme, so this is a direct-target effect. The acts_upstream_of qualifiers already keep FXR outside the process.

    GO:0003677, GO:0003700, GO:0006355, GO:0006357, GO:0045893 -> TOO_GENERAL, as generic ancestors of specific terms accepted on direct evidence in the same review. GO:0005515 protein binding (5 rows) -> REMOVE under the protein-binding policy; the meaningful partners are captured by GO:0016922 and GO:0001221. GO:0046965 (obsolete nuclear retinoid X receptor binding) -> MODIFY to GO:0016922, preserving a correct and central claim on a live term.

    Evidence discipline: every supporting_text was checked as a whitespace-normalised substring of its source using the repository's own normalizer (ai_gene_review.validation.local_source_text) before being written, including the UniProt flat-file line-code unwrapping. Three record_section values initially said CC:FUNCTION for a quote that sits in CC:SUBUNIT and were corrected after backfill-record-sections reported the mismatch.

    An OpenScientist deep-research run completed and is committed with its artifacts. It is recorded in references with reference_review (relevance MEDIUM, correctness UNVERIFIED) and is deliberately not cited as supporting_text for any annotation, so the validator's advisory warning about unused deep-research files is expected rather than an omission. It agreed with the curated UniProt record and the primary papers on every point checked, and surfaced three primary references that were then fetched and quoted directly: PMID:12393883 (four FXR transcripts; the four-residue hinge insert raises FXRE affinity, which is the mechanism behind the isoform-specific SDC1 induction in PMID:12660231), PMID:30275017 (FXR/RXRalpha LBD heterodimer structure) and PMID:31201556 (biallelic FXR truncation patients with severe early-onset PFIC).

    Validation: ai-gene-review validate passes with 2 warnings, one of them an unrelated uv environment-variable deprecation notice.

    Follow-up this review does not do: NR0B2/SHP and NR5A2/LRH-1 still have no gene reviews, and ABCB11, FABP6 and SLC51B are named as parts of enterohepatic_bile_salt_cycling without reviews (its own note at line 82 records this, and now lists SLC51A stalely, since SLC51A has since been reviewed).
