  summary: 'NR1H4 review round 1: fix a wrong CURIE in the source defect, sign the
    bile-acid regulation term'
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on #5845. Every finding was independently re-verified against QuickGO and the cached sources before being acted on; all were correct.

    Critical, and the one that mattered. The source_defects entry on GO:0032740 proposed GO:0032703 as the expected replacement term. GO:0032703 is negative regulation of interleukin-2 production; the IL-17 term is GO:0032700. Corrected. This is worth recording rather than quietly fixing for two reasons. First, source_defects is the only field in a review that is exported and sent upstream, so just export-source-defects would have handed UniProt a WRONG_TERM report naming a term about a different cytokine, which is worse than filing nothing. Second, it is exactly the failure the 'every CURIE is read from a source in the same step it is written' rule exists to prevent: the identifier was written from memory, it was plausible, and the same file already used GO:0032703 correctly for IL-2 eleven hundred lines earlier while the gene's own UniProt flat file states its label on line 1048. Nothing compared them, because a CURIE inside corrected_value is free text as far as validation is concerned.

    GO:0070857 regulation of bile acid biosynthetic process moved from ACCEPT to MODIFY with proposed_replacement_terms GO:0070858 negative regulation of bile acid biosynthetic process, and core_functions entry 2 directly_involved_in follows. The row's own reason said FXR represses CYP7A1 and CYP8B1 and its PMID:10334992 quote states the direction outright, so accepting the unsigned parent was accepting a term while arguing it was too general, which CLAUDE.md forbids directly. FXR has no characterised positive effect on bile-acid synthesis, so there is no pleiotropy argument for the parent. Verified the precedent the reviewer cited: FGFR4 carries MODIFY to GO:0070858 on all four of its GO:0070857 rows and KLB uses GO:0070858 in core_functions, so FXR, FGFR4 and KLB now agree on the term for one circuit.

    Three rows (GO:0001678, GO:0042593, GO:0046628) quoted 'GW4064 evoked a time-dependent increase in the cellular concentration of PA', which is about phosphatidic acid and does not support a glucose or insulin reason. Replaced with the sentence the reasons were already paraphrasing, verified verbatim in the cached paper: 'DGKtheta was also required for bile-acid-dependent decreased glucose production'. The PA quote stays where it belongs, on GO:1905695.

    The 'GO has no regulation child of GO:0015721' claim was checked properly and was too broad. QuickGO 2026-11-01: GO:0015721 indeed has no regulation child (children are GO:0015125, an MF, and GO:0015722), but the bile-acid space does have GO:0120188/9/90 regulation of bile acid secretion, which GO files under regulation of transport rather than under a bile-acid-transport regulation node. So the export arm of what FXR does is annotatable: its induction of the canalicular pumps is GO:0120189 positive regulation of bile acid secretion, and the row is now MODIFY to that instead of MARK_AS_OVER_ANNOTATED. The genuine remaining gap is the uptake arm - FXR represses SLC10A1/NTCP and GO has no bile-acid import process term at all, so there is nothing for a regulation term to attach to. The second proposed_new_terms entry is rewritten from 'regulation of bile acid and bile salt transport' to 'regulation of bile acid import across plasma membrane', with the searches and their results recorded in the justification.

    Took the reviewer's suggestions as well, in the same push. Added a WRONG_QUALIFIER source defect against REACTOME on the GO:0015721 row, since the involved_in qualifier from R-HSA-159418 is the thing asserting participation FXR does not have, and Reactome's own pathway places FXR as a regulator rather than a transporter. core_functions entry 3 molecular_function moved from GO:0004879 to GO:0038186, removing a parent/child pair across the three core functions in a review that marks GO:0003700 TOO_GENERAL on exactly that reasoning. The GO:0000791 euchromatin reason now leads with what its quotes establish (promoter occupancy by FXRE mapping and ChIP) and says the compartment call is being left as the curator made it, rather than leading with an expectation argument. The IL-17 write-up corrected from 'one row of three' to one of four: GO:0043124 canonical NF-kappaB is a third negative row from the same 2016-01-19 session, which strengthens the argument.

    Validation: ai-gene-review validate passes with the same two warnings as before (an unrelated uv deprecation notice, and the expected unused-deep-research advisory). backfill-record-sections reports no mismatches.
