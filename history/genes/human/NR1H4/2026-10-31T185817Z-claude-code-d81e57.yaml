  summary: 'NR1H4: record the IL-17 row as a suspected UniProt sign error'
  details: |
    Follow-up on the GO:0032740 (positive regulation of interleukin-17 production, IDA, PMID:21242261) row that the create session left UNDECIDED with no further detail. Re-examined on the question of whether the term class is appropriate and whether the citing paper supports it.

    Finding: the contradiction is internal to UniProt rather than a disagreement between this review and a curator. UniProt's curated CC FUNCTION block cites PubMed:21242261 for the opposite claim - that FXR down-regulates inflammatory cytokine expression in several types of immune cells including macrophages and mononuclear cells - and the two sibling GOA rows UniProt created from the same paper in the same curation session (2016-01-19) are both negative regulation terms, GO:0032689 (type II interferon) and GO:0032720 (TNF). One row of the three carries the opposite sign to the other two and to the resource's own prose. The paper's stated conclusion is that FXR activation inhibits proinflammatory cytokine production. IL-17 appears in neither its abstract, its MeSH terms, nor the 16-citation deep-research report for this gene.

    Could not be checked: the full text. The paper is not in PMC and both Europe PMC and the BMJ site refuse access, so the scenario that would make the row correct - an IL-17 panel in one of the four assayed human immune populations showing a genuine positive effect against the anti-inflammatory trend - cannot be excluded from outside.

    Action: left UNDECIDED, since the rule against overruling an experimental annotation whose full text has not been read applies. Added a review.source_defects entry (defect_type WRONG_TERM, resource UNIPROT, requested_change CHECK, confidence SUSPECTED) proposing GO:0032703 as the expected term if IL-17 was measured at all, and noting the row should be deleted if it was not. Expanded review.reason to carry the evidence. The defect now appears in the UniProt section of the export-source-defects report and is marked NOT_REPORTED, so it still needs filing upstream.

    Also assessed the term class, recorded in the notes file rather than the review: GO:0032740 is coarse but not defective. Its definition spans any member of the interleukin-17 family, lumping IL-17A/F with IL-17E/IL-25 and IL-17B/C/D, and 'production' conflates transcription, translation and secretion, so it does not say which step a regulator acts on. Across the eight human genes carrying it in this corpus, the three reviews that ACCEPT it are IL15, IL21 and IL23R - genes that are themselves IL-17-axis components - while every regulator (MYD88, OPA1, PRKCQ, SPHK1) carries it as KEEP_AS_NON_CORE. Had the direction been right here, KEEP_AS_NON_CORE rather than ACCEPT would have been the action for a transcription factor.
