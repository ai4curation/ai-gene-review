  summary: 'NR1H4 review round 2: retype the Reactome defect, drop an unsupported
    claim, record the secretion-term labels'
  details: |
    Addresses the round-2 ai4c-reviewer review on #5845. Three findings and two suggestions, all legitimate; one of the three turned out to be a false alarm but asked for verification that was owed anyway.

    GO:0120189's sign was challenged and is correct. The reviewer reasoned that GO:0070857/8/9 runs regulation/negative/positive, so GO:0120188/9/90 might too, which would make GO:0120189 the negative child and invert a MODIFY replacement and a corrected_value headed upstream. Queried per-term against QuickGO on 2026-11-01: GO:0120188 is regulation of bile acid secretion, GO:0120189 is POSITIVE regulation, GO:0120190 is negative. This triple runs regulation/positive/negative, the opposite order to GO:0070857/8/9, so the hypothesis was reasonable and wrong. No id changed. All three labels plus the GO:0120189 and GO:0120190 definitions are now recorded verbatim in NR1H4-notes.md as a table, the way the GO:0034379 check is, together with the GO:0015721 children and the negative search result for an import term - so the sign is checkable from the repository rather than from a claim about a query. The reviewer was right to hand this back rather than adjudicate it: the label sits in proposed_replacement_terms and source_defects.corrected_value, and fix_labels.py deliberately skips the former while the latter is a plain string, so nothing in the pipeline would have caught an inverted sign.

    The Reactome source defect was typed wrong and is retyped. It was defect_type WRONG_QUALIFIER with slot Qualifier and asserted_value 'involved_in GO:0015721', while its corrected_value was a GO term; export_source_defects.py renders that as 'Field: Qualifier / Change: involved_in GO:0015721 to GO:0120189', which does not parse because the Qualifier column never holds a GO id. The substantive half of the finding is the better point: once the term is a regulation-of-secretion term, involved_in is the correct qualifier, so the term was always the defect and not the qualifier. Now WRONG_TERM / slot GO term / asserted_value GO:0015721, matching the shape of the IL-17 defect in the same file, and it agrees with the row's own MODIFY action instead of contradicting it. Confirmed by running the exporter: the Reactome report now reads 'GO:0015721 -> GO:0120189 (positive regulation of bile acid secretion)'.

    The defect explanation asserted something about Reactome's model that its own cached entry does not support, and the sentence is removed. It claimed R-HSA-159418 'places FXR as a regulator of that pathway rather than as a transporter in it'. Checked reactome/R-HSA-159418.md: it names SLC10A2, FABP6, ABCC3, SLC10A1, SLCO1A2/1B1/1B3 and ABCB11 and mentions neither FXR nor NR1H4 nor any regulator. The reviewer's further point is also right - a TAS involved_in row is generated from NR1H4 being a participant, so the claim made the row's existence harder to explain rather than easier. This was a statement about a source that the source did not make, which is the same class of error as the round-1 CURIE, and it went to a curator who could have checked their own model in one click. The defect stands on 'FXR is a transcription factor and transports nothing', which is quoted and uncontested.

    Both suggestions taken. The four GO:0004879 rows carried 'and the anchor used in core_functions', which stopped being true when core_functions[2] moved to GO:0038186 in round 1; they now justify the rows on the family-level-activity half alone, citing GO's own usage guidance, and say explicitly that core_functions no longer anchors on the term. The proposed term is split in two: the import process (parent GO:0015721) and its regulation (parent GO:0034762 regulation of transmembrane transport, regulating the first). The reviewer was right that a regulation term's is_a parent is a regulation class rather than the process it regulates, and that the prerequisite process term was described in prose instead of being proposed. Note the reviewer suggested GO:0044070 as the parent; that is regulation of monoatomic anion transport, and bile acids are organic anions, so GO:0034762 is used instead.

    One incidental YAML hazard hit while editing: the replacement justification for the GO:0004879 rows contained ': ' inside an unquoted plain scalar, which made the file unparseable. Rephrased to avoid the colon rather than quoting, since the surrounding rows are unquoted.

    Validation: ai-gene-review validate passes with the same two warnings; backfill-record-sections reports no mismatches; export-source-defects renders both defects readably.
