  summary: 'NR1H4 review round 4: reconcile the IL-17 sibling count, widen two quotes,
    complete the term table'
  details: |
    Addresses the round-4 ai4c-reviewer review on #5845. One finding and three suggestions; all round-3 findings were confirmed closed and the reviewer found nothing new of substance in the curation itself.

    The finding is a miss I had reported as fixed. The GO:0032740 row's review.reason still said 'the two sibling GOA rows ... are both negative regulation terms (GO:0032689, GO:0032720)', while the source_defects.explanation seventeen lines below on the same row said three negatives and one of four. In round 1 I recorded the correction as made 'in the YAML explanation, the notes and the PR description' - all three of which were in fact correct - and missed the reason field on the same row. So one block of the file asserted two different counts about one fact. The GOA file settles it: PMID:21242261 produced exactly four rows, all dated 20160119, three negative and one positive. The reason now says three siblings, all negative, naming GO:0043124, and states that the positive row is the only one of the four that disagrees. Verified afterwards that no 'both negative', 'one of three' or 'row out of three' phrasing survives anywhere in the entry, and that every remaining sibling-count mention agrees.

    Worth recording why this one slipped twice. The round-1 fix was driven from the reviewer's description of where the error appeared rather than from a search of the file, and the reply then asserted the narrower claim as complete. A grep for the count would have caught it in round 1 and did catch it now.

    Suggestions, all three taken.

    The regulation proposal's quote established the process rather than FXR's regulation of it. 'and SLC10A1/NTCP (involved in hepatic uptake of conjugated BAs)' is the right fragment for the import-process entry, since it establishes that hepatic uptake is a real process, but for the regulation entry the verb sits in the clause before it. The quote now runs from 'indirectly inhibiting CYP7A1 and CYP8B1' through 'conjugated BAs)', which carries the repression and its target in one substring; verified as a normalised substring across the CC wrap before use. This is the same truncation boundary that produced the round-3 finding, one clause further along, which is the second time a quote on this row has been cut at a clause that changed what it supported.

    The Reactome defect's supported_by covered only the induction half of its own explanation, which asserts both induction of ABCB11/ABCC2/ABCB4 and repression of SLC10A1/NTCP. The uptake quote is added beside the ABCB11 one so the defect's evidence covers both clauses of its claim.

    GO:0004879 added to the notes label table with its term comment quoted verbatim, including the C4-type zinc finger and direct-DNA-binding criteria and the note that FXR meets both (FT ZN_FING 137..157 and 173..197, and DNA binding as an RXRA heterodimer at FXREs). It was the fifth QuickGO lookup this review rests on and the only one not in that table; all five are now in one place.

    Validation: ai-gene-review validate passes with the same two warnings; backfill-record-sections reports no mismatches; the colon-in-plain-scalar guard reports no risky lines.
