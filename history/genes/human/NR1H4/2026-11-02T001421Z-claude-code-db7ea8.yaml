  summary: 'NR1H4 review round 3: quote the uptake arm, correct the GO:0004879 clause,
    extend the term table'
  details: |
    Addresses the round-3 ai4c-reviewer review on #5845. One blocking finding and four suggestions; all three round-2 findings were confirmed closed.

    The blocking finding, and it is a real one. Both new proposed_new_terms entries existed to record that FXR's repression of SLC10A1/NTCP has nowhere to go, and neither was supported by a quote about uptake. The import-process entry carried 'In the liver activates transcription of the corepressor NR0B2 thereby indirectly inhibiting CYP7A1 and CYP8B1', which is about repression of bile-acid synthesis and is the evidence for core_functions[1] and the GO:0070858 call. The regulation entry carried that plus the ABCB11/BSEP export quote, which supports the export arm this very review says is already annotatable as GO:0120189 - the half that is not the gap.

    The reviewer's sharper observation is the one worth recording: SLC10A1 appeared in zero supporting_text anywhere in the review. Confirmed by grep. The uptake arm is asserted in the entry description, in the GO:0015721 reason, in the Reactome defect explanation, in core_functions[2]'s description and in both proposal justifications, and was quoted in none of them. It was the load-bearing claim of round 2's changes and the one claim with no quote behind it.

    The fix was one clause of text already in the repository. UniProt states the uptake claim in the same CC FUNCTION sentence the synthesis quote is taken from, one clause after that quote stops: 'and SLC10A1/NTCP (involved in hepatic uptake of conjugated BAs)'. Verified as a normalised substring across the CC line wrap before use. Both proposals now carry it, and the regulation entry no longer carries the export quote. What happened here is that a quote was truncated at the clause supporting a different claim, and nothing downstream noticed, because proposed_new_terms support is checked for being verbatim and not for being on topic - the same shape as the round-1 CURIE and the round-2 Reactome claim, all three in upstream-facing fields.

    Suggestions, all four taken. The GO:0004879 clause rewritten in round 2 was inaccurate in the other direction: it said 'both entries carrying a molecular function now use GO:0038186' when all three core functions carry one and core_functions[1] uses GO:0001228. Now states that no core function anchors on GO:0004879, that the two bile-acid-sensing entries use GO:0038186 and that the transactivation entry uses GO:0001228. The reviewer noted their own round-2 shorthand had seeded the error; the inaccuracy was still mine to catch. Same clause, third round, so it is now written from the file rather than from the previous round's description of it.

    That clause also rested on an unquoted claim about GO's usage guidance, which is the genus of the round-2 Reactome finding. The term comment is now quoted verbatim from QuickGO: 'GO:0004879 is intended for annotation of nuclear receptors that regulate transcription by binding directly to DNA'.

    GO:0034762 and GO:0032782 added to the notes label table with their definitions, since both became load-bearing this round and neither label is in cache/go/terms.csv or cache/ontologies/go.tsv. SLC10A1 and SLC10A2 named in the import proposal's justification with the state of their GOA - neither carries any directional transport term - stated explicitly in prose and not as a supported_by reference, since a GOA file can never be one and the claim is about the state of annotation rather than evidence.

    One process note. The same YAML hazard bit twice in two rounds: a ': ' inside an unquoted plain scalar on a reason or justification line makes the file unparseable. Both times I rephrased rather than quoted, to match the surrounding unquoted rows, and I now run a regex guard over reason/justification/explanation/description lines before validating rather than discovering it from the parser.

    Validation: ai-gene-review validate passes with the same two warnings; backfill-record-sections reports no mismatches.
