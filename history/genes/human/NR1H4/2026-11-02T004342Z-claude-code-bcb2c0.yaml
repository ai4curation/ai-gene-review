  summary: 'NR1H4 review round 5: cover the NTCP repression clause in core_functions[2]'
  details: |
    Addresses the one advisory point in the round-5 ai4c-reviewer review on #5845, which approved the PR. The reviewer offered it as droppable; taken because it is the same defect class as every finding in rounds 1 to 4 and the last place the round-4 pass had not reached.

    core_functions[2]'s description asserts transcriptional control of 'conjugation, export and hepatic reuptake' and closes 'while repressing SLC10A1/NTCP', but its supported_by quotes covered conjugation and export (SLC27A5/BAAT/ABCB11 with CARM1), detoxification (UGT2B4/SULT2A1), BA homeostasis, and PFIC5 - nothing about uptake. The reuptake half of the claim, which is also the half that distinguishes this core function from a generic bile-acid-export statement, rested on no quote.

    The uptake quote is now its fourth supported_by item, placed beside the homeostasis one and before the disease ones. It is the same clause the regulation proposed term and the Reactome source defect use, verbatim across the CC wrap, so this is the fourth use of one quote rather than a new assertion about the record. backfill-record-sections confirms the CC:FUNCTION section and locates the quote in the cited file, with nothing left mismatched.

    Worth recording what the five rounds have in common, since the reviewer put it well: the curation itself was sound from round 1, and every finding since was an unverified claim about a source in a field no validator reads - a CURIE written from memory into source_defects.corrected_value, a claim a cached Reactome entry does not make, a quote truncated at a clause that changed what it supported, a count inconsistent with the field beside it, and now a description clause its own quotes did not cover. The mechanical half of that is cheap to close: label-validating GO CURIEs in corrected_value and proposed_replacement_terms the way core_functions ids already are. That belongs in an issue rather than this PR.

    Validation: ai-gene-review validate passes with the same two warnings; backfill-record-sections reports no mismatches; the colon-in-plain-scalar guard reports no risky lines; 112 rows and three core functions unchanged.
