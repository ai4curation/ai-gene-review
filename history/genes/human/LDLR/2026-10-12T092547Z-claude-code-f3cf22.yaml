  summary: 'Round 3: say why the SARS-CoV-2 spike row is REMOVE and not MODIFY'
  details: |
    The GO:0005515 IPI row whose partner is SARS-CoV-2 spike (UniProtKB:P0DTC2, PMID:33420426) carried the same generic REMOVE boilerplate as the five other protein-binding rows, which does not explain why it is not treated like the VSV G row three entries above - that one is MODIFY to GO:0001618 virus receptor activity on a comparable viral-glycoprotein interaction. The distinction is in the cited study, which is an AXL-receptor paper. LDLR was one of three docking-predicted candidates and did pull down spike in co-IP, but the functional tests exclude it: overexpression did not enhance pseudotype infection, where ACE2 and AXL both did, and knockdown did not reduce infection, where AXL knockdown did. So the paper reports the interaction while positively excluding the receptor function, and GO:0001618 would assert the opposite of the evidence. The reason now states this and cites both the co-IP and the knockdown sentences.
