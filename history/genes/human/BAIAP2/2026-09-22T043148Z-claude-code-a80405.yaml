  summary: 'Audit pass on BAIAP2: fix fabricated citations, re-decide six mis-traced
    IEA calls, refresh stale GOA'
  details: |
    Audit of an existing COMPLETE review (from the PAINT no-IBA batch, PR #2956) that
    validated cleanly. Four defect classes found; the file went from 118 to 131
    annotations and from 2 to 4 core functions, and now contains no
    MARK_AS_OVER_ANNOTATED calls.

    1. Fabricated citations invisible to validation. Seven supported_by entries cited
       bare DOIs absent from the references list, so the substring validator had nothing
       to check them against. Six quotes were verbatim text from
       BAIAP2-deep-research-falcon.md attributed to primary papers they were never taken
       from (one still carried its bullet label, "Sites of action: ..."); a seventh
       occurs in no source at all. DOI:10.1242/jcs.262064 resolves to PMID:39404604,
       "HIV-1 assembly - when virology meets biophysics", cited in support of adaptor
       activity. Three rode on rows GOA has since retired; the other four were
       re-grounded on PMID:37747150, PMID:24639075 and PMID:15673667 with quotes verified
       verbatim.

    2. Six IEA calls dismissed on rationales that misstate provenance. Each
       MARK_AS_OVER_ANNOTATED row was justified as "not supported" or "may be transferred
       from ortholog data". Tracing every GO_REF:0000107 transfer to its source shows all
       six rest on a rodent experimental annotation by RGD or SynGO:
       GO:0001221 <- rat IPI PMID:10332026 (atrophin-1, a transcriptional corepressor);
       GO:0005874 <- rat IDA PMID:24639075 (immunogold EM);
       GO:0030141 <- rat IDA PMID:17120053;
       GO:0098685 <- mouse SynGO IDA+IMP PMID:19193906 (Baiap2 knockout, recording at the
       named synapse);
       GO:0099523 and GO:0099524 <- rat SynGO IDA PMID:15673667.
       All re-decided per the rule against overruling curators from incomplete evidence.
       "Overly specific" is not a defect in a SynGO annotation.

    3. Two NEW annotations cited a generated summary as IDA evidence. GO:0140090 and
       GO:0005546 both used
       original_reference_id: file:human/BAIAP2/BAIAP2-deep-research-falcon.md, and the
       first rationale said only "eLife 2023" with no identifier. Re-grounded on
       PMID:37747150 (Quiroga, the paper meant) and PMID:17371834 (Mattila), with
       PMID:38724689 corroborating. Comparator check supports GO:0140090: ARFIP2, ICA1
       and PICK1 all carry it by IDA from PMID:29768204, so it is established practice
       for BAR-superfamily proteins.

    4. proposed_replacement_terms invented from bulk interaction data. Thirteen REMOVE
       rows from high-throughput screens proposed a specific MF inferred from the fact of
       a binding; withdrawn. The mirror error too: GO:0003779 was proposed on a row whose
       evidence is an ACTB co-immunoprecipitation.

    Additions. GO:0003779 actin binding added as NEW and as a fourth core function --
    BAIAP2 carried GO:0051017 and GO:0051764 as processes but had no actin-binding MF
    anywhere in GOA. Evidence is in vitro on purified IMD and actin (PMID:14752106) with
    residues mapped (PMID:15635447). GO:0180020 membrane bending activity was considered
    and rejected: no BAR-superfamily protein in human carries it, which reads as a
    convention rather than a gap; raised in suggested_questions instead.

    GOA refresh. The cached tsv predated a release. After fetch-gene --force, 30 rows
    were seeded and reviewed and 18 retired rows dropped. Three were experimental
    annotations the review had no row for: GO:0009898 IDA PMID:38149472 (lissencephaly
    variant blocking membrane localization) and GO:0046847 / GO:0048812 IMP PMID:41133935
    (gain-of-function DEE variants escaping 14-3-3 autoinhibition).

    Also: stripped scraped journal-date prefixes from ten title-only supporting_text
    values and replaced the highest-value ones with result sentences; removed IRTKS
    (paralog) quotes from the four PMID:19366662 rows and flagged that reference
    full_text_unavailable, keeping the annotations per the no-overruling rule; added
    seven references and eight reference_review blocks; extended description to cover the
    postsynaptic role, 14-3-3 autoinhibition and disease genetics.
