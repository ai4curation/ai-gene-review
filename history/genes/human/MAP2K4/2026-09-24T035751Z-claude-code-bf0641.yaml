  summary: 'Create review: MAP2K4'
  details: |
    Created the MAP2K4 (MKK4/SEK1/JNKK1) review from the PENDING stub: reviewed all 41 GOA rows (17 ACCEPT, 15 MODIFY, 5 KEEP_AS_NON_CORE, 2 MARK_AS_OVER_ANNOTATED, 1 REMOVE, 1 UNDECIDED) and added one NEW p38MAPK cascade (GO:0038066) annotation. Core functions are JUN kinase kinase activity in the JNK cascade (Tyr185-preferring, cooperating with MKK7) and MAP kinase kinase activity in the p38 cascade. Bare protein binding rows to JNK1/JNK2/p38alpha were modified to mitogen-activated protein kinase binding and MEKK1 to MAP3K binding, matching MAP2K3/MAP2K6; the TRIB1 row was removed as uninformative. Generic protein kinase / serine / tyrosine kinase rows were modified to MAP kinase kinase activity. The IEP cellular response to mechanical stimulus row (PMID:19593445) was left UNDECIDED because the cited BAD/prostate cancer paper does not mention MKK4. Fetched PMID:12788955 and PMID:9003778; wrote MAP2K4-notes.md.
