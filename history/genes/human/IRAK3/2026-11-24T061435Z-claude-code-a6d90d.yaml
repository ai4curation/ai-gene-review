  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H13). GO:0008063 Toll signaling pathway (IBD at PANTHER:PTN000701353) changed from MARK_AS_OVER_ANNOTATED to MODIFY with replacement GO:0002755 MyD88-dependent toll-like receptor signaling pathway, which IRAK3 already carries (TAS, ACCEPT) and which is the replacement recorded for the same IBA on IRAK1, IRAK2, IRAK4 and MYD88. Both seeds, fly Pelle and Tube, are in the invertebrate clade PTN000701449; the vertebrate IRAK clade PTN000701378 holds the target. The ancestral role is sound for IRAK3 and the term, defined by the receptor Toll, is the wrong one for a vertebrate protein. Supporting quotes unchanged.
