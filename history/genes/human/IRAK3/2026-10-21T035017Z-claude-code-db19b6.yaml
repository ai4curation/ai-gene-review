  summary: 'Full re-review: IRAK3 (ProtNLM2 benchmark Q9Y616, independent of predictions)'
  details: |
    Replaced templated UNDECIDED reviews with considered actions for all 75 annotations (ACCEPT 31, KEEP_AS_NON_CORE 20, MODIFY 13, REMOVE 7, MARK_AS_OVER_ANNOTATED 4). Removed protein kinase activity, protein serine/threonine kinase activity, protein phosphorylation and magnesium ion binding: IRAK3 lacks the HRD catalytic Asp (CGS, Ser-293) and DFG (DFA), shows no Mg/ATP thermal shift and only negligible autophosphorylation (PMID:33238146, PMID:10383454). ATP binding kept non-core (Kd ~196 uM). Refined general terms (cytokine-mediated signaling -> IL-1/IL-33 signaling; MAPK -> p38MAPK; regulation -> negative regulation; NF-kB regulation -> both directions). Toll signaling IBA and response to virus marked over-annotated. TRAF6 protein binding -> ubiquitin protein ligase binding; PIN1 protein binding removed (IRAK3 is the PIN1 substrate). Rewrote description and core_functions; added PMIDs 23376919, 25481771, 31664109, 38268724.
