- type: CREATE
  outcome: changed
  summary: 'Review human AHDC1: correct a sequence-specific TF term that no experiment
    measured'
  details: |
    First review of human AHDC1 (Q5TGY3, "Gibbin"), the Xia-Gibbs syndrome gene.
    15 GOA rows reviewed (TSV rows, fetch-gene stub entries and QuickGO hits all
    agree at 15, so no stub collapse), plus 5 NEW proposals.

    Headline correction. GO:0003700 DNA-binding transcription factor activity is
    an IDA from PMID:35585237, but that paper never purified the protein, ran no
    binding assay, called no motif, and states that occupancy is not restricted to
    the loci AHDC1 regulates; its own model puts the sequence specificity in the
    zinc-finger partners. MODIFY to GO:0003712 transcription coregulator activity
    (a verified sibling under GO:0140110, not a demotion), with GO:0003682
    chromatin binding added as a NEW row so the ChIP-seq evidence is preserved.

    The predicted InterPro2GO AT-hook mapping does NOT exist: InterPro matches only
    IPR032757 and IPR039225, both with empty interpro2go, no AT-hook signature
    matches the protein at all, PTHR15617 carries no GO, and PAN-GO has zero
    annotations. Reported as a non-confirmation. Of the two UniProt AT-hooks only
    one is canonical (KRKRGRPPKNLLL at 544-556 holds the sole RGRP core in 1603
    residues; RRKAGRGRKADAG at 396-408 is GRGRK with no proline), and neither
    DNA_BIND feature carries an evidence tag.

    Other actions: GO:0140585 MARK_AS_OVER_ANNOTATED (the term asserts bridging;
    the evidence is a knockout and the paper routes the loop loss through DNA
    methylation and CTCF) with GO:1902275 proposed instead - GO:0140588 was
    rejected on its definition, which describes SMC loop extrusion. GO:0006355
    MODIFY to GO:0006357, because the GO_REF:0000108 derivation is voided by the
    MF change (verified: GO:0006355 is an ancestor of GO:0003700 but not of
    GO:0003712) while the process itself stands on the human knockout RNA-seq.
    The three GO:0005515 rows split per partner. An earlier draft of this review
    said NbExp=12 for HTT was one IntAct experiment logged twelve times; dumping
    the full records refuted that and the claim was corrected before review. The
    twelve rows are four HTT bait constructs multiplied by three Y2H sub-method
    labels, so the sub-method inflation is threefold and the rest is the screen's
    standard huntingtin panel. ATXN1 rows KEEP_AS_NON_CORE, because PMID:16713569
    maps the binding region onto ATXN1's AXH domain (557-699, "sufficient to bind")
    and a second laboratory replicates the pair; HTT row MARK_AS_OVER_ANNOTATED,
    one laboratory and a 1,216-partner hub. Both GO_REF:0000107 rows ACCEPT with
    root_cause EVIDENCE_CIRCULAR_OR_REDUNDANT: the mouse donor holds both terms by
    IMP from the same publication that already supports the human IDAs, and Compara
    runs the transfer in both directions.

    Also recorded: UniProt coded the same paper's loss-of-function experiments IDA
    on human and IMP on mouse; a coverage census showing only 1 of 28 UniProt
    references reports function and only 2 of 28 produced any GO annotation; and an
    ontology gap, since GO:0044030 regulation of DNA methylation is obsolete with no
    replacement. Negative checks reported explicitly: no projection defect on
    PMID:35585237 (7 annotations over 2 entities), no retraction or erratum on any
    relied-on PMID, all partner accessions reviewed canonical, and no human paralog
    to cross-check against.

    Verification: just validate human AHDC1 clean on the merged tree; 56 quotes
    audited with a strict duplicate-key loader, 0 problems; cache_lint exit 0 before
    and after the merge; terms.csv gained 2 rows with no deletions and no duplicates.
