  summary: Reassess AHDC1 chromatin and transcription evidence
  details: 'Substantively rereviewed all 15 seeded assertions and five pre-existing NEW proposals
    against full cached primary evidence, live term definitions, historical MGI provenance
    and additional primary PMID:36194562. All machine source objects and all 12 original reference
    identifier/title pairs were preserved. The baseline matches the coordinator-provided current-main
    preflight. No Git, remote, shared-project or machine-artifact mutations were made.


    Removed three uninformative generic protein-binding annotations without denying the pairs.
    Corrected Compara source assessments: the mouse and human experiments share a paper but
    do not form a circular inference chain. Kept broad source-level localizations, and retained
    developmental processes as non-core. Preserved a coregulator replacement while removing
    categorical claims that broad occupancy disproves sequence preference or that hexanediol
    necessarily filtered particular AHDC1 contacts. Replaced loop anchoring with ChIP-supported
    chromatin binding, retaining uncertainty about direct physical bridging.


    Withdrew all five prior NEW proposals: chromatin binding duplicated the replacement, chromatin
    location duplicated a nested compartment, GATA3 binding exceeded the proximity/epistasis
    evidence, and separate chromatin-organization regulation did not establish distinct mechanistic
    coverage. Independent review found that the epigenetic-regulation proposal also exceeded
    the evidence: occupancy and perturbation do not distinguish AHDC1 epigenetic work from
    indirect transcriptional consequences. Withdrew that proposal and core process after participation,
    parent/redundancy, comparator and GO-CAM review. Comparator endpoint failures are explicit;
    no absence-based annotation gap is inferred. Synthesized one integrated core with the
    direct-DNMT-mechanism knowledge gap.


    Concurrent genuine Falcon/fallback research failed before provider execution because PyPI
    DNS resolution failed. All eight original PMIDs were already cached. Normal additional
    PMID:36194562 and historical notes PMID:16713557 fetches failed DNS; no cache or provider
    report was fabricated. The added source was independently verified through PubMed and
    full primary PLOS access; citation verification is distinct from cache availability. The
    review remains DRAFT.


    The immutable legacy prose-audit script was run and exited 1 with eight outdated phrase/shape
    failures, while reporting complete source coverage and current counts. No false claim
    of a passing legacy audit or new bioinformatics analysis is made. Targeted schema/reference/term,
    render and history validation outcomes are recorded after completion.

    Rewrote all inherited knowledge gaps to remove categorical absence and ontology claims,
    and acknowledged the independently recovered Ewing sarcoma study. Missing-cache status
    is explicit despite external full-primary access. Final actions are five ACCEPT, four
    KEEP_AS_NON_CORE, three MODIFY and three REMOVE; no NEW remains.


    Final targeted validation passed with three warning groups: unavailable PMID:36194562,
    unused Affinage evidence, and an intentional synthesized-core chromatin-location advisory.
    Rendering, history and source-preservation checks passed. The notes-inclusive cache check
    covers 11 PMIDs and retains two missing-cache gates (PMID:16713557 and PMID:36194562).
    All five preflight blobs match publication base 9541f70405e9e9bef718106c32ec1a54a8051bda.
    The final legacy script remains failed with eight recorded obsolete phrase/shape checks.

