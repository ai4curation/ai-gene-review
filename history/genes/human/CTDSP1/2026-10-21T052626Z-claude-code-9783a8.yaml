  summary: 'Create review: CTDSP1 (SCP1)'
  details: |
    De-novo review of human CTDSP1 as the experimentally characterised SCP-clade relative of CTDSP2 (PTHR12210 SF139 vs SF187, co-seeds of PAINT node PTN000954535 for GO:0008420). Deep research failed (falcon auth, perplexity quota); literature gathered via PubMed and 15 primary papers cached. All 55 GOA rows reviewed: CTD phosphatase (IBA/IDA/IEA) and Ser/Thr phosphatase (EXP/IEA) accepted; regulation of Pol II transcription modified to negative regulation (GO:0000122); phosphatase activity refined; exosome marked over-annotated; 40 bare protein-binding rows removed, SMAD1 row modified to GO:0004722. NEW: negative regulation of BMP signaling pathway (PMID:16882717, comparator MTMR4) and protein stabilization (REST degron, PMID:25197063, PMID:30217818). Independent of ProtNLM2 predictions.
