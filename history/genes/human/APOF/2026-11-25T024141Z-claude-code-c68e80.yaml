- type: EDIT
  outcome: changed
  summary: Record blinded OpenScientist analysis of APOF maturation and glycosylation
    sites
  details: |
    Ran an OpenScientist deep-research job (kgap-apof-glycosylation-maturation) on the knowledge gap covering apolipoprotein F's incompletely captured maturation. The run was blinded to the local APOF bioinformatics analysis and reproduced its sequence findings independently: exactly three N-X-S/T sequons at Asn-118, Asn-139 and Asn-267, no N-X-C site, RVGR at 161-164 as the only R-X-X-R outside the signal peptide, and a mature chain 165-326 beginning SLPTEDCENEKEQA. All of these were re-checked against the local Q13790 record, as were the two CARBOHYD features at 118 and 274.

    New material added to the gap boundary: GlyGen site-specific glycoproteomics reports glycopeptides at all three sequons and at five O-sites, putting four experimentally supported sites on the mature chain (Asn-267, Thr-274, Ser-302, Ser-303) against the one annotated there, while UniProt's own cross-reference strings already declare three N-glycan and six O-glycan sites; an R-X-X-R in the equivalent positional window is present in 120 of 122 mammalian orthologs, with mature-chain length held at a median of 158 residues while precursor length varies by 140.

    Two parts of the prior picture did not survive and are recorded as such. No mature-chain glycosite lies in an amphipathic segment (Eisenberg moment 0.10 at Asn-267 against a mature-chain maximum of 0.47), so the premise that the glycans decorate a lipoprotein-binding amphipathic face is not supported. A maximal sialylated glycan model reaches only 21.6 kDa, so glycan mass alone does not close the distance to the 29-33 kDa apparent masses; the run attributes the remainder to anomalous migration of a strongly acidic sialoglycoprotein. An unresolved conflict is also recorded: glycopeptides covering the propeptide sites Asn-118 and Asn-139 are reported from serum and plasma, which is hard to reconcile with complete propeptide removal before secretion, and no reported peptide spans the Arg-164 junction.

    Status moved from OPEN to NARROWING. The curation half of the gap is now well characterised, but the biological half, what the propeptide cleavage and the glycans contribute beyond allowing secretion, is untouched and still needs the Asn-267 mutant comparison.
