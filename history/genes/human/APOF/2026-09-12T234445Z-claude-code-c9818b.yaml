  summary: 'Create review: APOF'
  details: |
    Full end-to-end review of human APOF (Q13790, PANTHER PTHR15011). Headline: the 14-row GOA record contains no annotation for the activity the protein is named for - APOF is lipid transfer inhibitor protein, and its characterised activity is selective inhibition of CETP-mediated lipid transfer on LDL; PMID:9880564, which established that identity, carries zero GO annotations anywhere in the corpus. Actions: ACCEPT 7, MODIFY 2, REMOVE 2, MARK_AS_OVER_ANNOTATED 2, KEEP_AS_NON_CORE 1, NEW 3. Removed GO:0005102 (no receptor ever reported; fails the definition under either reading) and GO:0015485 (particle TLC composition is not protein-ligand binding; measured binding tracks LDL particle size, and the protein lacks the amphipathic helices that mediate lipid binding in the classical apolipoproteins). Modified GO:0005319 to GO:0030169 (lipid carrier activity is the parent of the transfer activity apoF suppresses) and GO:0006869 to GO:0032375 (regulator not agent; CETP carries the mirror term GO:0032376 by IDA). Added GO:0030169, GO:0034362 and GO:0034364: the LDL and HDL pools coexist, the LDL one active and the HDL one inactive, which resolves an apparent 40-year literature conflict. Both IBAs on node PTN002687490 (taxon:117571 Euteleostomi) graded NO_FAILURE_CORE with full source_entities; the GO:0005576 IBA is self-seeded by the target, the GO:0008203 IBA by mouse Apof's knockout IMP, which is CETP-independent because mice lack CETP. No GO:0141110 or GO:0004857 proposed because apoF binds the substrate particle, not CETP; two proposed_new_terms filed instead. Six knowledge gaps, including a UniProt glycosylation-annotation defect. Validated: just validate clean with one explained warning, checkquotes 67/67 verbatim, a GOA-to-YAML reconciliation script passing 14 to 14, no terms.csv deletions.
