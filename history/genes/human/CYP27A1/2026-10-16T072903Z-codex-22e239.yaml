  summary: Augment CYP27A1 sterol oxidation and localization review
  details: |
    Augmented the existing human CYP27A1 review while preserving all 69 historical annotation source objects and 38 original reference identities. Reassessed sterol-side-chain oxidation and cholesterol hydroxylation as two catalytic cores with heme and adrenodoxin-dependent chemistry integrated. Retained vitamin D3 hydroxylation as secondary activity without treating the CYP2R1 efficiency comparison as evidence that CYP27A1 activity is nonphysiological; excluded the obsolete replacement term. Accepted matrix-facing peripheral inner-membrane topology and refined three broad mitochondrial assertions as TOO_GENERAL. Corrected the MitoCoP interpretation to literature-pool inclusion rather than new experimental detection. Replaced the prior breadth-only lipid-biosynthesis overannotation judgment with directly performed bile-acid biosynthesis. Distinguished wild-type chemistry from defective-variant Reactome events, preserved three unavailable historical records without inventing their reactions, and reconstructed actual PAINT, donor, rule and GO-CAM support. Added five genuine supporting publication caches, seven reference findings and a compact YAML source guide. Retained the exact 5,251-byte notes prefix and appended corrections. Independent whole-review acceptance, source preservation, normal validation, term validation, status and rendering checks passed. This updates an existing review and does not by itself create new project completion credit.
