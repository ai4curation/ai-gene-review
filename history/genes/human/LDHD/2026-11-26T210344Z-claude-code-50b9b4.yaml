  summary: 'Create review: LDHD (with D-lactate dehydrogenase deficiency variant analysis)'
  details: |
    De novo review of human LDHD (Q86WU2), done as the gene half of a gene/disease co-review with the dismech entry for D-lactate dehydrogenase deficiency (MONDO:0009505). All 24 GOA rows reviewed: the FAD, cytochrome and (2R)-2-hydroxycarboxylate dehydrogenase terms, lactate catabolic process and mitochondrion accepted; inner membrane accepted with the membrane face recorded as a knowledge gap; lactate dehydrogenase activity (IDA) and the NAD+ IBA modified to GO:0140170; catalytic activity TOO_GENERAL; FAD binding non-core; protein binding removed. No NEW rows. One UniProt source defect (cytochrome c acceptor not recorded), one proposed GO term (D-lactate catabolic process) and one proposed definition change (GO:0004457 names NAD+). Literature: PubMed searches recorded in the notes; 19 papers digested with 234 machine-checked verbatim quotes. Deep research: Falcon and Perplexity were unavailable, Asta retrieval generated; an OpenScientist deep-research run was stopped at the 2 h limit without output, and three OpenScientist hypothesis runs (isoform-1 insert, T463M mechanism, membrane topology) were launched. Bioinformatics (LDHD-bioinformatics/, reproducible with just all): each reported variant checked against both RefSeq transcripts and placed on the mouse LDHD crystal structure 8JDE; isoform exon comparison; gnomAD v4 and ClinVar summary. Findings used in the review: published missense variants are numbered on isoform 1 while ClinVar, gnomAD and the mouse structure use isoform 2 numbering; PMID:37021930 prints c.206C>T for what is c.206T>C p.Val69Ala; the commonest gnomAD stop-gain allele is specific to the isoform-1-only segment. No GO-CAM contains LDHD. Validated with just validate human LDHD (no errors).
