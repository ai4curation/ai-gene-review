  details: |
    Re-review of the two IBA rows marked REMOVE (GO:0032281 AMPA glutamate receptor complex, GO:0004971 AMPA glutamate receptor activity; projects/IBA_REVIEW/rereview-2026-11-21, batch H02). Both REMOVE actions stand: all seeds (human GRIA1, GRIA3, GRIA4, mouse Gria1, rat Gria1-4) sit in the AMPA clade PTN002317264 (113 leaves), GRID1 sits in the sister delta clade PTN002708598 (64 leaves) under PTN008567347, and no delta-clade leaf has an experimental annotation to either term (QuickGO, queried by GO id over all leaves under PTN000438081). The written reasons were corrected because they misstated the tree: they said the IBD node PTN000438081 sat on the AMPA clade with GRID1 outside it, whereas PTN000438081 (187 leaves) is an ancestor shared by the AMPA and delta clades. The reasons and the shared propagation_review comment now describe the node as one split too deep. No quote was altered. Validated with just validate human GRID1.
