  summary: De-novo review of all 31 GOA annotations for SLC6A12 (BGT1), Na+/Cl--dependent
    betaine/GABA symporter
  details: |
    Reviewed every GOA row for SLC6A12 (P48065, BGT1). Two core MFs: GO:0005332 GABA:sodium:chloride symporter (high-affinity; Rhea RHEA:70731) and GO:0140814 glycine betaine:sodium:chloride symporter (osmolyte branch, renal medulla/liver; Rhea RHEA:71175). The monocarboxylic-acid rows (GO:0008028/GO:0015718, IDA PMID:29175673) resolved as MARK_AS_OVER_ANNOTATED: they encode a real but minor guanidinoacetate secondary activity via a chemically-correct generic genus term (not a mapping error, so no source_defect). Symporter-ancestor MF and BP generics TOO_GENERAL (OLS-verified). GO:0003333 MODIFY to GABA transport (lateral, different branch); membrane MODIFY to plasma membrane; basolateral PM ACCEPT; presynapse MARK_AS_OVER_ANNOTATED (non-neuronal). 4 bare GO:0005515 REMOVEd. Actions: 15 ACCEPT, 5 TOO_GENERAL, 4 REMOVE, 3 MODIFY, 3 MARK_AS_OVER_ANNOTATED, 1 KEEP_AS_NON_CORE. Batch 9.
