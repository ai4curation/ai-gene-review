  summary: 'Create review: human ALPG (germ cell alkaline phosphatase)'
  details: |
    Reviewed 9 GOA annotations and proposed 5 new ones. GOA gave ALPG no metal-binding term despite 98% identity to ALPP with no differences at metal ligand positions; added zinc, magnesium, calcium binding and homodimerization by ISS, and external side of plasma membrane by IDA on the PI-PLC release evidence in PMID:2162249. No physiological substrate known; recorded as a knowledge gap. Validated with just validate human ALPG (0 warnings).
