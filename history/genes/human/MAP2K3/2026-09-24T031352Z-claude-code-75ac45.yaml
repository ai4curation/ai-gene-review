  summary: 'Create review: MAP2K3'
  details: |
    Reviewed all 54 GOA annotations for human MAP2K3/MKK3 (P46734) against cached publications, UniProt, Reactome and falcon deep research. Accepted the core MAP kinase kinase activity (IDA/IBA/TAS/IEA) and p38MAPK cascade annotations; modified generic kinase residue-type terms (protein kinase, tyrosine kinase, serine kinase) to GO:0004708 following the MAP2K2 review; modified 11 bare protein-binding rows to MAP kinase binding (MAPK14), MAPKKK binding (MAP3K5) or protein kinase binding (LRRK2, DYRK1B) and removed the screen-only TINF2 row; kept downstream p38 contexts (VEGF response, endothelial migration, Hippo, senescence, LPS, sorbitol, ischemia) as non-core; marked heart development, indirect positive regulation of transcription and regulation of intracellular signal transduction as over-annotated. Added notes, description, reference reviews, one core function and suggested questions/experiments.
