  details: |
    Removed 10 supported_by citation(s) of this gene's own GOA file (MCTS1-goa.tsv), which records the annotations under review rather than evidence for them (new blocking check supporting_text_goa_file). 9 existing-annotation review(s) had the GOA row as their only support. Each was re-curated: 4 kept their previous action with non-circular support (a verbatim quote from the cited publication, curated UniProt text, deep research, or the row's own argument about the term; experimental rows whose cached abstract does not name the gene defer to the curator's full-text reading); 5 bare GO:0005515 row(s) were set to REMOVE under the generic protein-binding policy. So that GO:0005515 has one verdict throughout the review, 1 further bare protein-binding row(s) that had not cited GOA were also set to REMOVE under the policy. A core function whose rows had lost their support was given its own supported_by quote. Bulk strip by scripts/strip_self_goa_support.py (each file checked against the parsed transform); protein-binding rows by scripts/restore_goa_flipped_rows.py; other rows re-curated row by row. Validated with the best-practice and reference rules.
