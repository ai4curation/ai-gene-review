  summary: 'Create review: ENTR1 (reference for HORSE/ENTR1)'
  details: |
    De-novo review of human ENTR1 (Q96C92) as the experimental donor for the HORSE/ENTR1 PAINT nodes PTN002039065 and PTN004793274; independent of ProtNLM2 predictions. Deep research failed (falcon 403, perplexity quota), so the review rests on cached literature from a PubMed search. All 31 GOA rows reviewed: 5 protein-binding rows REMOVE per policy, 2 cytoplasm rows TOO_GENERAL, remaining localization (early/recycling endosome, centrosome, basal body, midbody, retromer colocalization) and process rows (endocytic recycling, regulation of cytokinesis, positive regulation of cilium assembly and of protein localization to cilium) ACCEPT. Added NEW GO:0008333 endosome to lysosome transport from the full-text human Fas sorting study PMID:31308371. Noted PANTHER SF6 (human) vs SF3 (mouse/horse) split among one-to-one orthologs.
