  summary: First review of PDE6H for the dismech vision-disorder alignment
  details: |
    First annotation review of human PDE6H (cone PDE6 inhibitory gamma subunit), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1) together with the other PDE6 subunits. 21 GOA rows reviewed: 9 ACCEPT, 9 REMOVE, 2 KEEP_AS_NON_CORE, 1 MODIFY. Core function: GO:0004857 enzyme inhibitor activity in GO:0141190 at the cone disc membrane. Removed, as for PDE6G: the InterPro mappings of phosphodiesterase activity and cGMP binding, and bare protein-binding rows from interactome screens. The visual perception IMP row rests on one 5-prime UTR variant in one family (PMID:15629837); it is kept because the process claim holds on other evidence. Validated with just validate human PDE6H: no errors.
