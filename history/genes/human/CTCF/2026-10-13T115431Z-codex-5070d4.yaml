  summary: Review CTCF chromatin-loop anchoring and transcription regulation
  details: |
    Review all 67 original CTCF GO assertions with source-specific primary evidence and explicit product and assay limits. Synthesize chromatin-loop anchoring and RNAPII DNA-binding transcription regulation as two core functions, without assigning cohesin motor activity or assuming equal function of the 399-residue product. Refine supported binding partners to appropriate classes, preserve contextual generic interactions as non-core under project instructions, and retain uncertainty for CGGBP1 coregulator classification and centromeric sister cohesion. Distinguish an original looping citation mismatch from independent support for the biological function. Preserve original source fields, qualifiers, reference identities, official products and existing caches; include notes and a portable evidence index. Independent whole review and normal validation, status, rendering and history checks accompany publication.
