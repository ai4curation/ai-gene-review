  summary: De-novo review of all 107 GOA annotations for SLC6A4 (SERT), Na+/Cl--dependent
    serotonin reuptake symporter
  details: |
    Reviewed every GOA row for SLC6A4 (P31645, SERT). Core MF GO:0005335 serotonin:sodium:chloride symporter activity (Na+/Cl--dependent presynaptic reuptake transporter; also platelet 5-HT uptake). GO:0008504 (x4) TOO_GENERAL (is_a ancestor of GO:0005335, QuickGO-verified, harmonized with NET/DAT); GO:0005326 (x2) ACCEPT (parallel branch, not an ancestor; harmonized with NET/DAT). Bona fide presynaptic reuptake → neurotransmitter reuptake / serotonin uptake ACCEPT; platelet 5-HT uptake ACCEPT; platelet aggregation / secretion / peripheral roles KEEP_AS_NON_CORE. Large behavioral/drug/physiological set (cocaine/MDMA/SSRIs, memory, circadian, vasoconstriction, etc.) held to the participation test (24 MARK_AS_OVER_ANNOTATED). 5 bare GO:0005515 REMOVEd (meaningful partners kept via specific terms). Amino-acid-transport IBA over-annotated via propagation_review. Actions: 35 ACCEPT, 30 KEEP_AS_NON_CORE, 20 MARK_AS_OVER_ANNOTATED, 17 MODIFY/TOO_GENERAL, 5 REMOVE (post-harmonization). Batch 10.
