  details: |
    De-novo review of human YTHDC2 (Q9H6S0) as the characterised SF213 relative of fly CG8915, independent of ProtNLM2 output. Falcon and perplexity-lite deep research both failed (auth/quota); review built from directly read primary literature (6 extra PMIDs cached). All 41 GOA rows reviewed: core MF 3'-5' RNA helicase (GO:0034458, human IDA) and RNA binding; generic helicase/RNA helicase/ATP-dependent-on-RNA/nucleic acid binding rows MODIFY to specific terms; m6A reader rows KEEP_AS_NON_CORE because m6A-pocket mutants are fertile (PMID:35058317, PMID:35305312); germline mitotic-to-meiotic switching ACCEPT as core (mouse-ortholog transfer within PTHR18934:SF213); spermatid development and TNF/IL-1 response MARK_AS_OVER_ANNOTATED (downstream phenotype / expression-only); four bare protein-binding IPIs REMOVE per policy. NEW ribosomal small subunit binding (human CRAC, PMID:29970596). Notes distinguish human-established from mouse-inferred functions and record the PAINT IRD NOT helicase on a Drosophila node.
