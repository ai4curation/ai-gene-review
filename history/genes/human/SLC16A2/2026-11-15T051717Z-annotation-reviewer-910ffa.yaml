  summary: De-novo review of all 48 GOA annotations for SLC16A2 (MCT8), facilitative
    thyroid hormone transporter
  details: |
    Reviewed every GOA row for SLC16A2 (P36021, MCT8). Core MF GO:0015349 thyroid hormone transmembrane transporter activity (facilitative/equilibrative, Na+/H+/ATP-independent, bidirectional T3/T4/rT3/3,3'-T2; distinct from the proton-coupled lactate MCTs and needs no BSG/EMBIGIN chaperone). Core location GO:0005886 (+ apical GO:0016324); core processes GO:0070327 thyroid hormone transport, GO:0150104 transport across BBB. Actions (48): 29 ACCEPT, 5 KEEP_AS_NON_CORE (homodimer, iodotyrosine DIT/MIT efflux, TH metabolic context), 4 MARK_AS_OVER_ANNOTATED (monocarboxylate family-name misnomer per PMID:9425115, downstream neural-precursor/AA-metabolism), 2 TOO_GENERAL (root transporter/transport), 2 REMOVE (bare protein binding). IBA rows handled with propagation_review (self in WITH/FROM = grounding, not circular). source_defects: WRONG_REFERENCE x2 (PMID:4036896 -> PMID:40368961 digit-drop transposition on 2025 IMP rows). reference_review MISCITED on PMID:26305885 (LAT-focused). Shared GO:0015349 + facilitative-vs-secondary-active ontology quirk (suggested_question) with MCT10/SLC16A10. Batch 11 (SLC16 MCT family).
