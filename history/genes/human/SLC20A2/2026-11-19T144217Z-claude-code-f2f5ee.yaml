  details: |
    Reviewed every GOA row for SLC20A2 (Q08357, PiT2/GLVR2). Core MF GO:0005436 sodium:phosphate symporter activity (~2 Na+:Pi) at the plasma membrane (many IMP from primary-familial-brain-calcification loss-of-function mutations + IDA); core BP GO:0035435. Apical/brush-border location in polarized epithelia (GO:0016324, GO:0031526 ACCEPT). Support from curated UniProt CC:FUNCTION/CC:SUBCELLULAR LOCATION via file: citations. Actions (37 rows, 14 terms): ACCEPT (GO:0005436, GO:0005886, GO:0035435, GO:0016324, GO:0031526), TOO_GENERAL (GO:0005315, GO:0006817), MODIFY (GO:0016020->plasma membrane; GO:0038023 signaling receptor activity->GO:0001618 virus receptor activity, lateral), KEEP_AS_NON_CORE (GO:0001618 incidental gammaretroviral receptor IMP; GO:0046718 viral entry; GO:0030501 bone mineralization via phosphate supply, indirect; GO:0070062 exosome HDA; GO:0035725 sodium co-transport). propagation_review on IBA core rows. source_defects: none. Batch 26.
