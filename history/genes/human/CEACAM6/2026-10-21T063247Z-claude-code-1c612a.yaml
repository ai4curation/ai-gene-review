  summary: 'Create review: CEACAM6'
  details: |
    Created the CEACAM6 review: all 68 GOA annotations reviewed. CEACAM6 is GPI-anchored on the outer leaflet of the plasma membrane (apical glycocalyx in polarized epithelium, granule-stored and surface-delivered in neutrophils), with the whole mature protein extracellular. Core functions are IgV-mediated homophilic and heterophilic CEACAM adhesion, including neutrophil-endothelial and tumour-endothelial adhesion, plus inhibition of anoikis. Twenty-seven uninformative protein-binding rows from systematic screens were removed, CEACAM1/CEACAM8 interaction rows were modified to cell adhesion molecule binding, and the generic membrane row was modified to plasma membrane and cell surface.
