  summary: 'Create review: MYD88'
  details: |
    Reviewed all 229 seeded GOA annotations for human MYD88 (Q99836): 112 ACCEPT, 41 MODIFY, 36 KEEP_AS_NON_CORE, 35 REMOVE, 4 MARK_AS_OVER_ANNOTATED, 1 UNDECIDED. Core functions: signaling adaptor activity in MyD88-dependent TLR and IL-1R-family signalling, TIR domain binding, death domain binding (Myddosome with IRAK4), and endosomal TLR7/8/9 adaptor. Key decisions: GO:0008063 Toll signaling pathway (IBA PTN000386853 and rat IEA) modified to GO:0002755 because GO:0008063 is the Drosophila Toll pathway and is not an ancestor of GO:0002224; Toll binding modified to Toll-like receptor binding; death receptor binding modified to interleukin-1 receptor binding; mouse-sourced ATP-dependent histone chaperone activity, chromatin organization and chromatin remodeling removed (indirect phenotype from PMID:18319258); phagocytosis marked over-annotated (human siRNA negative in PMID:30883606); type I IFN-mediated signaling marked over-annotated; protein binding IPI rows modified to TIR domain, TLR, death domain, protein kinase or TNFR-superfamily binding where the paper supports it, otherwise removed. No NEW annotations (IL-18 pathway comparator check showed the adaptor layer is systematically unannotated). just validate passes with no errors or warnings; all supporting_text quotes were checked as verbatim substrings of the cached publications.
