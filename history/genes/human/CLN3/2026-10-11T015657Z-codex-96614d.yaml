  details: |
    Completed the first systematic human CLN3 review, preserving all 174 seeded source assertions, seven alternative-product objects and 40 original reference identity pairs. Added one human experimentally supported chloride-channel molecular function and synthesized separate chloride-channel and Rab7-binding cores. Reviewed all 175 final decisions and 51 reference entries using source-specific primary evidence, literal interaction and donor records, official ontology definitions and bounded independent consultations. Kept lipid binding and trafficking evidence while leaving precise aqueous-carrier, intracellular-water, autophagosome-fusion and osmotic-regulation allocations unresolved where the inspected evidence did not settle them. No new biological process was added.

