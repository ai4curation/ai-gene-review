  summary: 'Create review: SUCLG1'
  details: |
    Written as part of the evolutionary review of the succinyl-CoA synthetase subunit families PTHR11117 and PTHR11815, using the family analysis in genes/yeast/LSC2/LSC2-bioinformatics. All 35 GOA rows reviewed. Both nucleotide-specific activities accepted as core for the shared alpha subunit, with the GDP-forming IBA accepted here and contrasted with its over-propagation to fungi. Side activities kept as non-core, RNA binding and toxic metabolite repair marked over-annotated, protein binding rows removed under the policy. Affinage record fetched and reviewed as a reference (DISPUTED grounding; no annotation imported). One knowledge gap on the mechanism of mtDNA depletion. Validated with just validate human SUCLG1.
