  summary: 'Retrospective audit corrections: SUCLG1'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. Action change: GO:0110052 toxic metabolite repair (IDA, PMID:40108300) MARK_AS_OVER_ANNOTATED -> UNDECIDED, because the published full text was not read and the preprint supports both readings. GO:0003824 catalytic activity (IEA) stays TOO_GENERAL; the reason is now worded the same way in all eleven subunit reviews (true but uninformative, entailed by the accepted specific activity). Other changes: status INITIALIZED -> DRAFT. The Affinage record went from DISPUTED to LOW_QUALITY with the dispute moved to its GO-grounding finding, and its supported_by entry on the GO:0004774 row was removed (the row keeps the PMID:27484306 rescue quotes). The negative itaconate finding of PMID:34492704 and the UniProt itaconyl-CoA statement are DISPUTED findings. The description no longer calls the fungal alpha subunit single, and PTN000122012 is called the LUCA node, not the root. Validated with just validate human SUCLG1; one advisory warning (no annotation cites the Affinage file) follows from the removal and is accepted.
