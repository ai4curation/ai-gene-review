  details: |
    Created full AI gene review for human ACSL1 (P33121). Provider deep research failed (Falcon HTTP 402 Payment Required; perplexity not configured), so a manual literature synthesis with inline provenance was written to ACSL1-notes.md from the UniProt record, cached GOA-referenced publications, and five additional papers fetched with just fetch-pmid (PMID:38480892, 19648649, 21245374, 22308341, 30190326). Reviewed all 56 GOA annotations (35 ACCEPT, 18 KEEP_AS_NON_CORE, 3 REMOVE for IEP-derived 'response to' IEA terms); fatty acid uptake/transport terms kept as non-core (metabolic trapping). Core functions: GO:0004467 long-chain fatty acid-CoA ligase activity at mitochondrial outer membrane (beta-oxidation channeling) and ER membrane (triglyceride biosynthesis). Lipid droplet localization was checked and is not experimentally supported for ACSL1, so no lipid droplet terms were added; raised as a suggested question. Validated with just validate human ACSL1 (passes, no warnings); all supporting_text quotes verified verbatim.
