  details: 'Created the human SREBF1 (SREBP-1) review from 128 GOA rows plus one NEW
    E-box binding proposal. Falcon deep research failed to authenticate, so notes
    were compiled from cached publications, UniProt and Reactome. Accepted core activator,
    SRE/cis-regulatory DNA binding, nucleus/ER/Golgi/SREBP-SCAP complex locations,
    SREBP signaling pathway and positive regulation of cholesterol biosynthesis. Modified
    general DNA-binding, location and lipid/cholesterol metabolic process terms to
    specific or regulation terms, and corrected the sign of GO:0090209 to positive
    regulation of triglyceride biosynthesis. Removed nuclear receptor activity (SF1
    is the nuclear receptor), its inferred intracellular receptor signaling row, and
    four bare protein-binding rows. Marked expression-driven response-to-X and indirect
    mitophagy rows as over-annotations. Added functional isoforms for SREBP-1a, SREBP-1c,
    the anchorless Delta variants and the processed nuclear form. Reconciled with
    the SREBF2 review in the same session: GO:0006357 rows MODIFY to GO:0045944, ER
    to Golgi transport vesicle membrane ACCEPT, and isoform_specific_terms removed
    from functional_isoforms because those terms are also annotated to the gene as
    a whole.

