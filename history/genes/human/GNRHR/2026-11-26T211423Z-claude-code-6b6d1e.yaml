  summary: 'Create review: GNRHR, with variant-on-structure analysis'
  details: |
    De novo review of human GNRHR (P30968). All 22 GOA rows reviewed: 17 ACCEPT, 4 MODIFY (GO:0007186 TAS to GO:0007200; GO:0016020 TAS to GO:0005886; GO:0016500 to GO:0004968; GO:0032274 to GO:0032278), 1 TOO_GENERAL (GO:0016020 IEA); no NEW rows. One core function (GnRH receptor activity, Gq/11 and phospholipase C signalling, plasma membrane). Literature: own PubMed search, 46 papers cached, 41 cited. No provider deep research is kept: falcon and perplexity are not configured here, the Asta retrieval was off-target and was discarded, and the OpenScientist deep-research job hit the two-hour limit without writing a report. Reproducible analysis in GNRHR-bioinformatics/ places 41 disease-associated missense variants on PDB 7BR3 (human, inactive) and 9U4W (pig, GnRH and Gq bound), with GPCRdb numbering, AlphaFold, ClinVar and gnomAD v4; it supports loss of function mainly by misfolding of buried transmembrane positions, finds no Glu90-Lys121 salt bridge in the crystal structure (recorded as an OVERTURNED finding on PMID:19095769), and finds that Q106R and R262Q homozygotes are not depleted in gnomAD (recorded as a knowledge gap). PANTHER family PTHR24241 reviewed for the nodes that reach GNRHR. No GO-CAM contains GNRHR. No module was created or edited. An OpenScientist hypothesis job on the Glu90 mechanism was launched; its report was not available when this record was written. Validated with just validate human GNRHR: valid, with two same-term action-mix warnings that follow the 2026-11-14 ruling. The companion disease entry (hypogonadotropic hypogonadism 7) is curated in a separate session in the dismech repository.
