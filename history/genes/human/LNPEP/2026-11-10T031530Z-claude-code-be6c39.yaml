  details: |
    Independent re-review of the WRONG_GENE_PRODUCT / WRONG_REFERENCE source defects in this file (evidence re-read at the best available depth; identifiers verified by lookup; curator-deference rule applied).
    - GO:0004177 PMID:11062501 (WRONG_GENE_PRODUCT): STRENGTHENED. Traced to Reactome reaction R-HSA-983162 (cytosolic trimming): its catalyst set lists TPP2, LNPEP, BLMH, NPEPPS while its summary names TPP2, PSA, BH and "leucine aminopeptidase (LAP)", i.e. cytosolic LAP3 (P28838) was entered as the membrane enzyme LNPEP. Settled by the Reactome record (ContentService participants + cached summary), so CONFIRMED, REPOINT to UniProtKB:P28838, record Reactome:R-HSA-983162, cause SYMBOL_COLLISION. The paper itself is about PSA and BLMH (abstract only read). That the papers' LAP is LAP3 rests on it being the cytosolic leucine aminopeptidase; UniProt P28838 does not itself cite these papers.
    - GO:0004177 PMID:9668046 (WRONG_GENE_PRODUCT): STRENGTHENED. Same Reactome set-membership error as the PMID:11062501 row (R-HSA-983162 lists LNPEP where the summary and this paper's abstract mean IFN-gamma-induced cytosolic LAP). CONFIRMED, REPOINT to UniProtKB:P28838 (LAP3), record and cause added. Abstract only read for the paper; LAP = LAP3 is inferred from "cytosolic leucine aminopeptidase", not from a sequence in the paper.
    - GO:0004177 PMID:15691326 (WRONG_REFERENCE): WITHDRAWN. TAS row (HGNC-UCL). The abstract itself names placental leucine aminopeptidase (P-LAP = LNPEP) as one of three closely related aminopeptidases, which is exactly what a traceable author statement records; the same paper gave HGNC-UCL TAS rows on ERAP1 and ERAP2. Nothing in the source record is identifiably wrong, only weak, so the defect was deleted and the reason rewritten (abstract quote moved to review.supported_by). Full text (Wiley) returned 403.
