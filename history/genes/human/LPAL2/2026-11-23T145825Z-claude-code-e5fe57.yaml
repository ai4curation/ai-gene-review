  details: |
    Ran OpenScientist (3 iterations) on LPAL2 coding potential. An apo(a) kringle-IV-lineage duplicate with a premature TAG at codon 223 shared by African apes, an independent stop in orangutan, and frameshifting deletions in other primates. No constraint against a local neutral calibration (PLG constrained as control), and no MS evidence. Transcribed-pseudogene signatures. Gap OPEN -> NARROWING.
