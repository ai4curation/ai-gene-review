  details: |
    Completed and audited the MAP3K2 (MEKK2) review. All 30 GOA annotations actioned: 15 MODIFY (bare protein-binding IPIs to 14-3-3 protein binding, protein kinase binding for MEK5, ubiquitin protein ligase binding for CHIP/STUB1; intracellular signal transduction to ERK5 cascade), 10 ACCEPT, 3 KEEP_AS_NON_CORE, 1 REMOVE (SMYD3 protein binding, uninformative) and 1 UNDECIDED (cellular response to mechanical stimulus IEP citing PMID:19593445, an apparent mis-citation). Audit replaced deep-research support for 14-3-3 binding with primary papers (PMID:23963453, PMID:9452471), added reference_review to all references, and refined the description. Core function: MAP3K activity driving the MEK5-ERK5 cascade via PB1-PB1 recruitment of MEK5.
