  details: |
    Full review of 949 GOA rows for human GRB2 plus one NEW (GO:0050852 TCR signaling, PMID:25870599). The 564 GO:0005515 protein binding rows were resolved per paper and partner (UniProt REST): 56 MODIFY to phosphotyrosine residue binding, 19 to proline-rich region binding, 7 to GEF adaptor activity, 6 to RTK adaptor activity, 4 to protein-macromolecule adaptor activity, 472 REMOVE (mostly proteome-scale screens). Reactome cytosol/plasma membrane TAS rows accepted; COP9 signalosome, RNA binding and exosome over-annotated; SH3 domain binding modified to proline-rich region binding (direction reversed); NK cytotoxicity IDA removed as unsupported by the cited full text. Core functions: RTK adaptor, SH2 phosphotyrosine binding, SOS GEF adaptor, LAT signalosome adaptor.
