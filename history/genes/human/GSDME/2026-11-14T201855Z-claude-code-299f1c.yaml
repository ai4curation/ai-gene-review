  summary: 'Revert: restore GSDME review status to DRAFT'
  details: |
    Reverts a status promotion I made earlier today that overrode a recorded campaign decision.

    I had changed this review from DRAFT to COMPLETE on the reasoning that all 35 rows were adjudicated with no PENDING and no UNDECIDED. That reasoning was wrong, because status here is not a function of content completeness. GSDME is a ClinGen Mendelian campaign gene and was accepted as campaign gene 745 on 2026-11-08 via PR #6187. Completion checkpoint 747 records its review status as DRAFT in the accepted table, states that each of the four genes in that window retains its genuine DRAFT status, and states that campaign acceptance records completed review and verified delivery without erasing scientific uncertainty or changing computed review status. The campaign's progress log separately states that a COMPLETE status does not certify assessment against its current evidence and curation rules. So DRAFT was deliberate and dated six days before I changed it.

    Retained: the three suggested_experiments added in the same change. Those are additive content and make no claim about curation state.

    How I got it wrong: I inferred campaign membership from a bare grep of the project page, which shows a mention rather than membership, and I never looked at the review-progress log, which is where assignments and accepted statuses are recorded. The membership itself turned out to be correct - GSDME is in projects/CLINGEN_MENDELIAN/clingen-gene-disease-validity.csv - but I was right by luck, and the status decision was there to be read and I did not read it.
