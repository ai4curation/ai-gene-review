  summary: 'Complete: human GSDME review'
  details: |
    Promoted DRAFT to COMPLETE and added the missing suggested_experiments.

    All 35 rows were already adjudicated with no PENDING and no UNDECIDED, with a description, a core function (wide pore channel activity), 42 supporting quotes and suggested questions. The gaps were the status flag and an empty suggested_experiments.

    Added three experiments, drawn from questions the review and the surrounding work leave open: whether granzyme B drives GSDME-dependent pyroptosis mainly through caspase-3 rather than by cleaving GSDME directly, which Reactome states is inefficient; whether the GSDME N-terminal fragment forms the same oligomeric pore as the other gasdermins, which would justify the wide pore channel activity annotation on its own structural evidence rather than by family inference; and whether GSDME expression is what switches lymphocyte-induced death between apoptosis and pyroptosis.

    GSDME grounds the pyroptotic variant of the new cytotoxic_lymphocyte_granule_killing module, which is why it was completed in this batch. It is also a ClinGen Mendelian project gene.
