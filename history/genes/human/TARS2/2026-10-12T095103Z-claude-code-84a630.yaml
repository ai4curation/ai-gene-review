  summary: 'Round 3: add the editing activity as a second core function'
  details: |
    The review ACCEPTed GO:0002161 aminoacyl-tRNA deacylase activity on direct assay of the purified enzyme and foregrounded post-transfer proofreading in the description, but core_functions carried only GO:0004829. Post-transfer editing is a second catalytic activity rather than an aspect of aminoacylation: the chemistry is deacylation of a finished aminoacyl-tRNA, the substrate is the erroneous product, and PMID:26811336 measures proofreading as an activity separable from Thr activation and aminoacylation, losing all three in the P282L disease allele. A second core function now pairs GO:0002161 with GO:0106074, and the GO:0106074 row moves from KEEP_AS_NON_CORE to ACCEPT to match - its previous reason, that proofreading is a secondary aspect of aminoacylation, confused being in service of a function with being part of it. The paper does not state that editing sits on a separate domain, so that is not asserted. Also split summary from reason on the eight non-ACCEPT rows where the two were byte-identical.
