  summary: 'Round 3: state the proton-transport versus uncoupler asymmetry'
  details: |
    GO:0015078 proton transmembrane transporter activity was KEEP_AS_NON_CORE while GO:0017077 oxidative phosphorylation uncoupler activity was MARK_AS_OVER_ANNOTATED, and neither reason said why those verdicts differ, leaving an obvious objection unanswered. They differ in what the terms assert: GO:0015078 names a transport capability, directly measured in reconstitution under fatty-acid activation and purine-nucleotide inhibition, while GO:0017077 names its physiological consequence, the leak being large enough to uncouple respiration from ATP synthesis, which the same evidence does not support and which UniProt denies for thermogenesis. Both reasons now state this, and the UniProt Does not mediate adaptive thermogenesis line is cited on the GO:0017077 row. Note the review found five GO:0015078 rows carrying the identical reason (IBA, three IDA and an IEA), not the three the review comment counted; all five were updated.
