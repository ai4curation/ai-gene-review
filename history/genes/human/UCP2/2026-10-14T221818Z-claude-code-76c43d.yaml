  summary: 'Round 20: GO:0005739 to MODIFY with GO:0005743, and GO:0055085 to TOO_GENERAL,
    under the merged MODIFY-vs-general rule'
  details: |
    Round 20 of PR #4810. Three rows in this review violated a rule that arrived with the Shepherd's
    merge of main rather than a defect in the curation as reviewed.

    The merge (5b65d4a3f) brought CLAUDE.md line 184 from PR #4881 - the action must match the reason,
    and one must never ACCEPT or KEEP_AS_NON_CORE while arguing that the term is too general. Three rows
    did that, and they take two different remedies, which is the distinction worth recording.

    Two rows take MODIFY. Both GO:0005739 mitochondrion rows (HTP from PMID:34800366 and IDA from
    GO_REF:0000052) carried ACCEPT with the reason "Correct; UCP2 is a mitochondrial carrier (inner
    membrane is more specific)." They are now MODIFY with proposed_replacement_terms GO:0005743
    mitochondrial inner membrane, which is the replacement the rule prefers because the gene already
    carries it - seven ACCEPTed rows across IBA, IEA, ISS, NAS and TAS - and the reason says so.

    One row takes TOO_GENERAL instead, and the reason it differs is the point. GO:0055085 transmembrane
    transport carried ACCEPT with the reason "Correct general term." MODIFY would require naming the
    specific supported term, and for this row there is no single one - the review already ACCEPTs
    GO:0071423 malate transmembrane transport and GO:1990542 mitochondrial transmembrane transport, with
    further oxaloacetate, aspartate, proton and chloride rows below the same ancestor. That is the
    TOO_GENERAL enum description exactly, a term true of the gene but uninformative because a more
    specific term asserted elsewhere in this review already entails it, and the consistency table gives
    TOO_GENERAL ANCESTOR_OF ACCEPT severity OK with the rationale "the intended use of TOO_GENERAL, a
    broad term subsumed by a more specific accepted term."

    So the MODIFY-versus-TOO_GENERAL split here is whether one specific term is the established one or
    several are. That is a judgement rather than a mechanical consequence of the rule, and it is stated
    in both reasons so a reviewer can disagree with it on the record.

    Verified before editing, not assumed, all against the QuickGO ontology ancestors endpoint rather
    than from memory: GO:0005743 is a descendant of GO:0005739, and GO:0071423 and GO:1990542 are both
    descendants of GO:0055085, under is_a/part_of. The seven GO:0005743 rows and the descendant transport
    rows were read from the file and their actions confirmed as ACCEPT before either remedy was chosen.

    This review had no TOO_GENERAL row before this change, so the consistency table did not fire on the
    slice at all; it now does, with the OK rule above.

    Verification: ai-gene-review validate passes, with two warnings, both pre-existing and unrelated -
    the UV_NATIVE_TLS environment warning and a suggestion that no annotation references the
    UCP2-deep-research-falcon.md file. A re-scan for ACCEPT or KEEP_AS_NON_CORE rows whose reason argues
    generality now returns zero for this file. No colon-space sequence in the new prose, asserted before
    writing.
