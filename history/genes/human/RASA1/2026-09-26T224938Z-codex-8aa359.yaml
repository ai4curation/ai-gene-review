  summary: Cite RASA1 OpenScientist scaffold review
  details: |
    Reviewed the OpenScientist RASA1 GAP-independent scaffolding report, added it as a first-class reference, and revised the p190RhoGAP scaffold core function from bare protein binding to phosphotyrosine residue binding. The edit keeps the SH2/p190RhoGAP migration-polarity role separate from the catalytic Ras-GAP arm that best explains CM-AVM vascular development.

    Follow-up review replaced the duplicated phosphotyrosine-binding core MF with protein-macromolecule adaptor activity, added the primary p190RhoGAP/FAK papers that directly support SH2-dependent complex assembly, GAP-independent catalysis, and migration/polarity effects, and added a matching NEW annotation review for the noncatalytic adaptor activity.
