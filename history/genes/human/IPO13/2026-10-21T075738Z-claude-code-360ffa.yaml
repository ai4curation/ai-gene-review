  summary: 'Create review: IPO13'
  details: |
    De-novo review of human importin-13, the experimentally characterised SF33/PTN000270925 relative of DROME/cdm, done independently of ProtNLM2 predictions. Falcon deep research failed (403 auth) and the perplexity-lite fallback timed out, so the review used cached primary literature (Mingot 2001, Ploski 2004, Kahle 2005, Bono 2010, Grunwald & Bono 2011, Grunwald 2013, Baade 2018 and others). Accepted import (GO:0061608, GO:0006606) and export (GO:0005049) receptor activity and small GTPase binding as core, all experimentally established in human. MODIFIED general transport terms to protein import into nucleus and protein export from nucleus, and MODIFIED cargo and Ran protein-binding rows to receptor or small GTPase binding terms. REMOVED 11 high-throughput Y2H protein-binding rows per policy. Kept nuclear envelope IBA as non-core. Coloboma and eye phenotypes were deliberately not annotated as process participation.
