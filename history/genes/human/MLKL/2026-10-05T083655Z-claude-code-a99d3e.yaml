    Created full AI gene review for human MLKL (Q8NB16). Provider deep research failed (Falcon HTTP 402 Payment Required; Perplexity not configured), so a manual literature synthesis was written to MLKL-notes.md from the UniProt record and cached publications. Fetched 8 additional key MLKL papers via just fetch-pmid (PMIDs 22421439, 24012422, 24813885, 24366341, 25288762, 23835476, 24703947, 28388412). Reviewed all 48 GOA annotations (31 ACCEPT, 11 KEEP_AS_NON_CORE, 4 MODIFY, 2 MARK_AS_OVER_ANNOTATED); NOT kinase-activity annotations accepted (MLKL is a pseudokinase); protein binding (RIPK3) modified to protein kinase binding; protein homotrimerization modified to protein homooligomerization. Added 2 NEW MF annotations (phosphatidylinositol phosphate binding, inositol hexakisphosphate binding). Core functions: executioner of necroptosis (GO:0097528) at the plasma membrane via PIP binding; IP6-dependent activation. Validated with just validate human MLKL and a verbatim-quote check.
