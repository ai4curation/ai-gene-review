  details: |
    Reviewed every GOA row for SLC6A2 (P23975, NET). Core MF GO:0005334 norepinephrine:sodium symporter activity (Na+/Cl--dependent presynaptic reuptake transporter; monomeric, non-heteromeric). Generic monoamine/Na:Cl-symporter ancestors (GO:0008504, GO:0015378) TOO_GENERAL (ancestry QuickGO-verified; OLS getAncestors was glitching); GO:0005326 neurotransmitter transporter ACCEPT (parallel branch, cannot be TOO_GENERAL). As a bona fide presynaptic reuptake transporter, neurotransmitter reuptake (GO:0098810) and NE uptake ACCEPT; dopamine secondary-substrate activity KEEP_AS_NON_CORE. Behavioral/drug-response process terms held to the participation test (non-core). Amino-acid-transport IBA REMOVEd via propagation_review (SLC6-clade functional divergence). 3 bare GO:0005515 and synaptic-vesicle-membrane over-annotation handled. Actions: 23 ACCEPT, 19 KEEP_AS_NON_CORE, 8 TOO_GENERAL, 4 REMOVE, 2 MODIFY, 1 MARK_AS_OVER_ANNOTATED. Canonical-surfaceome backfill batch 10.
