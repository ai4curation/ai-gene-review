  summary: Initial full review of human FGF21 GO annotations as an endocrine FGF acting
    via beta-Klotho-FGFR1c
  details: |
    Reviewed all 35 GOA rows. Accepted FGFR binding, FGFR signaling, extracellular region, MAPK/ERK activation. MODIFY: KLB protein-binding IPIs to signaling receptor binding (GO:0005102); growth factor activity to hormone activity (GO:0005179) because FGF21 is non-mitogenic; signal transduction TAS to FGFR signaling pathway. REMOVE: nine high-throughput Y2H protein-binding rows and IBA cytoplasm, cell proliferation, neurogenesis and cell migration (functional divergence of the endocrine clade; propagation_review added). Glucose import, cold-induced thermogenesis and LDL clearance kept as non-core downstream physiology. Core functions: FGFR binding in FGFR signaling, and hormone activity. Cached PMIDs 15902306, 17452648, 17550778, 23933984, 25130400. No NEW terms proposed.
