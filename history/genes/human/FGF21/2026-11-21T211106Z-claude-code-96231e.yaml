  summary: 'IBA re-review: four IBA rows changed from REMOVE to MARK_AS_OVER_ANNOTATED'
  details: |
    IBA REMOVE re-review of 2026-11-21 (projects/IBA_REVIEW/rereview-2026-11-21, batch 07), judged against the PANTHER tree and the pinned PAINT IBD snapshot. GO:0005737 cytoplasm. The cytoplasm IBD at the FGF family root PTN000160075 has 13 seeds. The earlier text attributed it to FGF1, FGF2 and the intracellular FGFs only; the seed list also holds located_in rows on secreted FGFs (Golgi apparatus for mouse Fgf7 and Fgf22, lysosome for zebrafish fgf8a, cytoplasm for mouse Fgf3, rat Fgf18 and worm let-756), checked in QuickGO. With those seeds there is no tree ground for REMOVE; the term is true as secretory transit and wrong as a site of activity, so the action is now MARK_AS_OVER_ANNOTATED and the summary and reason were rewritten. PAINT suggestion: place the IBD on the cytosolic clades PTN000160077 and PTN000896537. GO:0008284 positive regulation of cell population proliferation: mouse Fgf21, the ortholog (common node PTN000160408, 6 leaves), is an experimental seed of the root IBD (IGI, acts_upstream_of_or_within, PMID:18187602, BaF3 cells with FGFR1c and beta-Klotho), with human FGF19 and zebrafish fgf19 seeds in the same 37-leaf clade, so the non-mitogenicity paper (PMID:15902306) does not establish loss; marked over-annotated and one verbatim quote from PMID:18187602 added. GO:0022008 neurogenesis and GO:0030334 regulation of cell migration: the earlier reasons rested on absence of evidence; no loss, misplaced node or bad seed was found (zebrafish fgf19 is a neurogenesis seed in the FGF19/FGF21 clade), so both are marked over-annotated as plausible, unverified family-level inferences. Validated with just validate.
