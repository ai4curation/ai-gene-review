  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H13). GO:0008395 steroid hydroxylase activity (IBD at PANTHER:PTN001211310) changed from MARK_AS_OVER_ANNOTATED to MODIFY with replacement GO:0033782 24S-hydroxycholesterol 7-alpha-hydroxylase activity. The earlier reason was that the term is a correct broad ancestor subsumed by a specific term, which is not a ground for over-annotation. Human CYP39A1 is itself one of the seven seeds (EXP PMID:25201972 on GO:0033782, an is_a descendant per QuickGO) and all seeds sit in the animal clade PTN002387346 that holds it, so the term is true and less specific than the evidence. No other row changed.
