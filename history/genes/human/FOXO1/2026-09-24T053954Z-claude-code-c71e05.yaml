  summary: Six re-grounded, two deleted
  details: |
    Part of a single sweep repairing fabricated supporting_text across the gene reviews written in PR #2956. Those reviews set full_text_unavailable: true on supported_by entries whose cited publication is cached in full; that flag suppresses the repo's verbatim-substring validator, so every quote it covered entered the repo unverified. 76 of the 79 flagged entries quoted text that is not in the cited paper.

    Each entry was either re-grounded on a verified verbatim quote from the same paper, or the citation was deleted and its claim moved into review.reason as an explicit inference. No curation decision was changed: action, term, evidence_type, original_reference_id and proposed_replacement_terms are untouched unless stated below.

    6 re-grounded against PMID:37891184 and PMID:38466341, 2 deleted (both PMID:37710009). The deleted pair includes a 'FOXO family members can act as pioneer factors' quote that was its annotation's only citation; both claims moved into review.reason with a note that no cached reference supports them.

    Note: the fabricated DBE consensus 5'-TTGTTTAC-3' was replaced with the cited paper's own statement about DBE binding affinity. True statements about FOXO1 are not the same as quoted ones.

    A misleading verbatim sentence in PMID:37891184 was deliberately avoided: it states FOXO1 decreases hepatic glucose production, contradicting the rest of that section, and would have passed validation while supporting the opposite of the annotation.

    Cache bug: PMID_37710009.md declares full_text_html but holds an abstract plus a repository landing page.
