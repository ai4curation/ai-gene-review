  summary: 'DeepTMHMM2 topology audit: Qualify topology; refine location'
  details: |
    The S20 hairpin analogy cites stomatin (PMID:28575093), not a structure of STOML1. Human STOML1 imaging/sorting analysis (PMID:19696025) establishes late-endosomal targeting and relocation after sorting-signal mutation, not the predicted 57-70 geometry. Remove the contradictory single-spanning-helix summary, qualify the monotopic anchor as proposed, and refine generic membrane to late endosome membrane. Other context-dependent plasma-membrane rows were not re-adjudicated here. Source: supplied DeepTMHMM2 v1 supplement, S20 row 31. Review YAML and notes updated. Baseline and final validation are recorded in projects/DEEPTMHMM2/validation.tsv. No new GO annotation row was added.
