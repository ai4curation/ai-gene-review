  summary: Narrow the AADACL2 signal-anchor vs signal-peptide knowledge gap with an
    OpenScientist run
  details: |
    Ran OpenScientist (3 iterations, local bioinformatics withheld) on the CC_DARK gap: is the AADACL2 N-terminal segment an uncleaved type II signal anchor or a cleaved signal peptide? The run favours the anchor using discriminators that don't depend on a predictor: P1 signal-peptidase compatibility in 7/59 vertebrate orthologs, a conserved n-region lysine, insertion free energy inside the anchor distribution, and a 60.6% false-signal-peptide rate for the predictor class on short-tail type II anchors. Gap status OPEN -> NARROWING; annotation actions unchanged because no experiment exists. The run's claim that AADAC's anchor is not experimentally validated was not adopted, because the AADAC review cites experimental type II topology for the rat 50-kDa esterase.
