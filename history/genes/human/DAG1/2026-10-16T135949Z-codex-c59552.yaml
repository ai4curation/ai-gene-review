    Retain all three focal-adhesion assertions as contextual, changing two previous UNDECIDED actions to KEEP_AS_NON_CORE. The complete PMID9117347 abstract explicitly reports human aortic smooth-muscle localization and rat REF52 localization with cell/ligand limits. The original platelet panel and HDA target assignment remain unverified; independent human corroboration is not presented as recovery of those experiments. The final actions are 38 ACCEPT, 107 KEEP_AS_NON_CORE, eight MODIFY, two TOO_GENERAL, one MARK_AS_OVER_ANNOTATED and ten UNDECIDED. No NEW annotation was added.

    The exact finite change comprises 19 YAML leaves, eight source-guide changes and an append-only notes update. ROOT read those complete changes, source passages and both independent core assessments, and reproduced their checkers. Ordinary isolated validation, status checking and rendering passed; ROOT repeats the required canonical checks and validates this new history. Five advisories are documented: three standing-policy generic-binding exceptions, an older cached term label, and the synthesized core term lacking a separate NEW annotation. Prior history, source caches, products and unrelated user edits remain unchanged. Completion credit awaits fresh exact-head approval, merge and actual-main validation.
