  summary: Review DAG1 matrix receptor function and processed products
  details: |
    Reviewed all 166 original GO assertions without changing their source identities. The result retains 38 core annotations and 105 contextual annotations, refines eight, identifies two broad redundant terms and one substrate-based overannotation, and leaves 12 source-specific assertions unresolved. No NEW assertion is introduced. Alpha- and beta-dystroglycan are modeled as processed products of the 895-residue precursor, with one integrated laminin-receptor core.

    Primary-source assessment distinguishes intrinsic SEA processing from MMP9 cleavage of a substrate, the recombinant calcium-binding fragment from physiological occupancy, synthetic peptide binding from native accessibility, and alpha-derived extracellular-vesicle peptides from intact beta-chain cargo. Platelet originals and two defective-POMT compartment assignments remain explicitly unresolved. Source reconstruction includes nine actual ancestral IBD assertions, 751 donor records, 143 interaction records, 284 Reactome objects and authentic supplementary workbook cells. Added donor citations document curated-source provenance and do not imply independent reading of every donor paper.

    Independent annotation, core-coherence and calcium consultations were read and reproduced. ROOT read all annotation decisions and the final source guide. Genuine default Falcon and configured fallback requests failed; no provider report was fabricated. Required fetched references are included, existing caches and the user's unrelated edits are preserved, and all eight quotations remain exact cached substrings.

    Ordinary default and CI-equivalent validation, status checking and rendering passed in the isolated workspace. ROOT repeats the required canonical validation and history check before publication; completion credit remains pending exact-head approval, merge and actual-main validation.
