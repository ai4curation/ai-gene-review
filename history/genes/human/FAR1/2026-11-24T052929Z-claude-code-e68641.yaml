  details: |
    Re-judged the GO:0080019 IBA (PTN000110226, PTHR11011) against the PAINT tree. Mouse Far1 (in the FAR1 ortholog clade) and human FAR2 are among the eleven seeds, with IDA rows from PMID:15220348. QuickGO term history shows GO:0080019 was named fatty-acyl-CoA reductase (alcohol-forming) activity until 2023, when it was renamed to the very long-chain activity, and the abstract of PMID:15220348 reports a C16 or C18 preference for FAR1. The reductase activity is soundly seeded and only the chain length is wrong, so the IBA row and the InterPro IEA row were changed from MARK_AS_OVER_ANNOTATED to MODIFY, keeping the existing replacement GO:0102965. Validated with just validate human FAR1.
