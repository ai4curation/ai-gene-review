  summary: Reviewed all 39 GOA rows for human AKAP10; 26 MODIFY, 3 NEW from a paper
    with zero GOA annotations, 1 over-annotation, 0 REMOVE
  details: |
    First review of human AKAP10 (D-AKAP2, O43572). 39 GOA rows reviewed, 3 NEW
    proposals added, so existing_annotations has 42 entries. The fetch-gene stub
    seeded all 39 rows without collapsing any of the 23 GO:0005515 partner rows.

    Precision changes. 22 bare protein-binding rows became GO:0030165 PDZ domain
    binding, which is what the holdup survey in PMID:36115835 actually measured -
    the AKAP10 C-terminal PDZ-binding motif against purified PDZ domains. Four
    PKA-related rows became GO:0034237 protein kinase A regulatory subunit
    binding, because every experiment on this protein assays the regulatory
    subunit dimerization/docking domain and none assays the catalytic subunit;
    that includes the InterPro2GO row from IPR037719, filed as an upstream
    mapping fix that would correct every AKAP10 orthologue at once.

    Coverage finding, the main one. PMID:19797056 established that the tandem RGS
    domains bind Rab4 and Rab11 and that the protein restrains transferrin
    recycling, and QuickGO returns zero annotations for that reference across all
    of GOA - no gene, no species. Three NEW rows come from it: GO:0031267 (IPI),
    GO:2001136 (IMP), GO:0055037 (IDA). GO:0017137 was confirmed merged into
    GO:0031267 before choosing the term, so no substrate-specific child was
    proposed; Rab identities are recorded with RO:0002233 extensions.

    Two predicted defects checked and reported as non-confirmations. There is no
    GTPase-activator annotation to remove, and no cardiac annotation to remove.
    A committed reproducible analysis nonetheless shows both RGS domains retain
    0 of 5 RGS4 Galpha transition-state contacts, matching an AXIN1 negative
    control against RGS16 and RGS9 positive controls at 5 of 5.

    PAINT. All three IBA rows come from node PTN001775426 and every protein donor
    carries its own experimental evidence, so all three are ACCEPT. The
    reciprocal direction is a defect worth fixing upstream: that node spans all
    six reviewed members of PTHR13155, so a mouse-seeded mitochondrion assertion
    also reaches S. cerevisiae RAX1 and S. pombe rax1, whose own experimental
    localisations are plasma membrane/bud neck and endoplasmic reticulum.

    One validation warning is left standing on purpose - the request to cite the
    provider record inside an annotation - because a provider sentence is a lead
    rather than evidence; its assessment is in references[].reference_review.
