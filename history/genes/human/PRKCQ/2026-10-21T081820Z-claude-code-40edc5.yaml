  summary: 'Create review: PRKCQ (PKC-theta), reference relative for ProtNLM2 XENTR
    target'
  details: |
    De-novo review of human PRKCQ (Q04759), done as the closest characterised relative (PTHR24351 paralog, family-level only) of XENTR A0A8J1IYX6 and independent of ProtNLM2 output. Deep research failed (falcon authentication error, perplexity quota) and this is recorded in the notes. All 76 GOA rows were reviewed from cached literature, UniProt and Reactome. General kinase rows were modified to GO:0004699, which is EXP-supported. Bare protein-binding rows were removed, except the Lck row, which was modified to SH3 domain binding (PMID:21964608 V3 PxxP motif). Transcription-regulation and ectodomain-proteolysis transfers and Reactome axon guidance were marked as over-annotated. The telomerase RNAi-screen row was left UNDECIDED. Th2/Th17, platelet, apoptosis, chemotaxis and insulin-signalling roles were kept as non-core. Added NEW T cell receptor signaling pathway (CARD11 linker phosphorylation; participation and comparator checks done). Added five supporting PMIDs.
