- type: EDIT
  outcome: changed
  summary: Record OpenScientist finding that gamma-secretase substrate features are
    null and the substrate list is ascertainment-biased
  details: |
    Ran an OpenScientist deep-research job (kgap-psen1-substrate-features) on the knowledge gap covering the in-vivo substrate scope of PSEN1-containing gamma-secretase. The hypothesis asked whether scope is predictable from substrate features and instructed the run to say so plainly if the question cannot be posed. The answer is no, and the way it arrived there is the valuable part.

    Every feature with a strong mechanistic claim behind it is null. The transmembrane helix-destabilising residue fraction gives an area under the curve of 0.481 with identical medians in substrates and background; the glycine-proline fraction 0.526, again with identical medians; the small-x-x-x-small motif count 0.511. None survives correction.

    The decisive finding is an ascertainment effect the run looked for without being asked. A protein's reference count alone separates reported substrates from the type I background at 0.810, better than all ten structural features together at 0.703, and adding reference count to those features changes nothing, so the structural features contribute essentially nothing beyond how much a protein has been studied. The run then built a study-intensity-matched permutation null, which it reports as correcting its own iteration-1 over-claim, and localised the small residual signal to cytoplasmic juxtamembrane basic content and domain size rather than any transmembrane composition feature, with ectodomain length pointing the opposite way to the usual rule. Its reading is that these features describe what kind of protein a reported substrate is, a type I signalling receptor with a long basic-rich tail, which describes how a cleavage event gets detected rather than whether it happens.

    What fits instead is a permissive induced-fit active site gated upstream by ectodomain shedding, with main-chain recognition any polypeptide can supply, and a ruler rather than a motif: across the UniProt census only four human proteins have an annotated gamma-secretase cleavage site, and all four initial cuts fall within three residues of the cytoplasmic end of the transmembrane helix despite no sequence similarity at the site.

    Status moved from OPEN to NARROWING. The computational route to deciding which candidate substrates reflect evolved PSEN1 function is closed, and the caution is the useful output for curation: a reported-substrate list assembled from the literature is biased towards heavily studied receptors, so a protein's absence from it is weak evidence and its presence reflects detectability as much as biology. The endogenous substrate profiling already named in the gap's resolution remains the only route. Nothing in this run was independently recomputed; only the local P49768 record's basic features were checked. No annotation action was taken.
