  summary: 'ARHGEF16: address the dismissed PR review, refute one premise, and add
    a guard for quote/claim mismatch'
  details: |
    Follow-up session on PR #3084, responding to a CHANGES_REQUESTED review that the
    merge gate auto-dismissed when a checkpoint commit moved the head. The review is
    addressed here explicitly so that its history is not lost.

    Item 1, REFUTED rather than applied. The reviewer stated that UniProtKB:Q05BK6 is
    TNS3 (Tensin-3) and that calling it TFG was a copy-paste from the adjacent row.
    Checked against UniProt three ways: Q05BK6 has gene name TFG, entry Q05BK6_HUMAN,
    protein "TFG protein", 366 aa, unreviewed TrEMBL, from EMBL clone BC041600; no
    entry anywhere lists Q05BK6 as a secondary accession, so it was never merged into
    anything; human TNS3 is Q68CZ2 (TENS3_HUMAN, 1445 aa) with no secondary
    accessions. Q05BK6's only domain is PB1, which is TFG's domain, not the SH2/PTB
    pair the reviewer cited for Tensin-3. The label was therefore left as TFG, since
    changing it would have asserted something false.

    The half of item 1 that does hold was taken. The two PMID:25416956 rows had
    identical prose, which is what made the row look like a copy-paste. They are now
    distinguished, and the real observation is recorded: Q05BK6 and Q92734 are the
    same protein under an unreviewed and a reviewed accession, so GOA counts one
    binding partner twice - a duplicate-partner artefact rather than two findings.

    Item 2, ACCEPTED and fixed. The two Reactome cytosol rows were generated from one
    loop that attached the same quote to both, so the row arguing that R-HSA-205039's
    asserted output is Rac and Cdc42 was citing the RhoA negative. Each row now
    carries the negative matching its own asserted output, and the reason says which
    negative it is and what the positive control was.

    All three non-blocking suggestions were taken, because each was a field saying
    something its own surrounding prose disclaimed. correctness on the two Reactome
    references moved MISCITED -> DISPUTED, since the claim GOA actually draws from
    them is cytosol and that claim is correctly supported; what is contested is the
    set-level GTPase output, which never reaches GOA. The affinage record moved
    MISCITED -> LOW_QUALITY, since nothing in it is miscited - its six citations are
    all genuinely about this protein - and the defect is an incomplete,
    symbol-keyed retrieval. The cadherin row's supporting_text was a paper title,
    carrying no evidential content; it is replaced by the committed PDZ-partner
    overlap, which quantifies the indirect route as eleven junctional scaffolds among
    the thirty-seven PDZ partners. The two BioPlex 14-3-3 rows now say why an
    affinity-purification row is retyped there while the cadherin AP-MS row is marked
    over-annotated.

    New committed guard: quote_claim_coherence.py. Item 2 is a defect class no
    validator in this repository catches - the reference validator checks a
    supporting_text against its source publication, never against the claim it sits
    under, and that quote was a perfectly verbatim substring of exactly the right
    paper. The guard collects the GTPases named by each row's claim (RO:0002233
    has_input extensions and the "catalysed output is" clause) and by the union of its
    quotes, and requires them to intersect. Five rows are checkable; zero violations.
    Its central self-test is a regression that reintroduces the original bug and
    requires the guard to fire, then restores the correct quote and requires the row
    to go clean.

    Self-test defect found and fixed in pdz_partner_check.py. Its name-independence
    check asserted has_pdz("Q9H5P4") is True, but PDZD7 is itself named for PDZ, so a
    classifier keyed on the gene name rather than the domain list would have passed
    it - the check could not fail for the reason it was named for. The classifier was
    split into a pure function so the self-test can feed it hand-built records: a
    protein named PDZD99 whose only domain is an RRM, one carrying a PDZ domain under
    an unrelated name, and one whose PDZ sits under the wrong feature type. A
    zero-match guard was also added, asserting that each injected accession is absent
    from its target bucket before injection, since a no-op injection would pass while
    testing nothing.

    Both guards were then mutation-tested by breaking them on purpose and RUNNING the
    suite, not by reasoning about the outcome. Eight mutations across the two scripts,
    every anchor asserted to match exactly once, every restore verified by SHA-256
    against the original file. All eight dropped the pass count, and the results are
    tabulated in RESULTS.md. The name-keyed mutation takes pdz_partner_check.py from
    8/8 to 4/8; under the old tautological check it would have scored 8/8.

    Validation at time of writing: just validate human ARHGEF16 passes with the one
    best-practice warning about GO:0031267 carrying three actions, which remains
    deliberate and argued in the RhoG row. gene_residue_claims: 3 pass, 0 fail, 0
    unresolved. just validate-families: passed, with one pre-existing UNRESOLVED on
    PANTHER:PTHR11699, a family this work does not touch. Script self-tests: 6/6,
    10/10, 6/6, 7/7, 8/8, 8/8.

    No action, term, evidence code or core_functions entry changed in this session.
