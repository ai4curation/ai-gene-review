- type: CREATE
  outcome: changed
  summary: 'Review human ARHGEF16 (Ephexin-4): retype a GAP molecular function that
    is already projected to 81 species'
  details: |
    Reviewed all 77 GOA rows on human ARHGEF16 / Ephexin-4 (Q5VV41) and added four
    committed, self-testing bioinformatics analyses under
    genes/human/ARHGEF16/ARHGEF16-bioinformatics/.

    Actions: 50 MODIFY, 16 KEEP_AS_NON_CORE, 10 ACCEPT, 1 MARK_AS_OVER_ANNOTATED,
    1 NEW, 0 REMOVE.

    Principal finding. GO:0005096 GTPase activator activity is annotated IDA from
    PMID:21139582, a paper that measured nucleotide exchange. GO:0005096 is the GAP
    term, defined by increased GTP hydrolysis; the protein has no GAP domain, and the
    same curator on the same paper chose the correct process term. The row is retyped
    to GO:0005085 with CDC42 as has_input. QuickGO reports 83 annotations across 81
    taxa carrying UniProtKB:Q5VV41 in WITH/FROM for GO:0005096, all Ensembl Compara
    IEA or ISO, and mouse Arhgef16 carries it twice while having no experimental
    annotation of its own. The name collision that produced it is documented: the
    gene also carries GO:0090630 activation of GTPase activity, which reads like the
    GAP molecular function but is defined by GDP-to-GTP replacement, and which is
    correct.

    Ephexin-family check, run in both directions. No annotation reached this gene
    incorrectly from a sibling: the GO:0005085 IBA carries Ephexin-1, -3 and -5 as
    donors and is sound, but only because the term is coarse, since ARHGEF16 is the
    one family member that does not act on RhoA. Two Reactome reactions do show the
    set-level pattern: R-HSA-419166 has a 54-member DefinedSet catalyst assembled by
    DH domain rather than specificity, whose output is the GTPase PMID:20679435
    failed to detect. Only the cytosol term reaches GOA, so this is recorded as
    provenance on the TAS rows, not as a GO error.

    Ontology limit, checked on three independent services (GO API, OLS4, QuickGO).
    GO:0005089, GO:0030676 and GO:0005088 are merged into GO:0005085; GO:0017048 into
    GO:0031267; GO:0032860 and GO:0032861 into GO:0090630; GO:0005100 into GO:0005096.
    All four parents have zero is_a children. Both QuickGO caveats from the campaign
    brief reproduced: it silently resolved all seven merges, and its only children of
    GO:0005085 and GO:0005096 are capable_of and negatively_regulates. No new term is
    proposed; substrate identity is carried in core_functions[].substrates and
    RO:0002233 has_input, and the limit is recorded as an ONTOLOGY knowledge gap.

    DH/PH assessment, reported in both directions. Exchange-surface contacts were
    computed at 4.0 A from six SIFTS-mapped DH-GTPase complexes spanning three
    substrates. ARHGEF16 retains 0.50-0.70 of the surface at every anchor, inside the
    range of bona fide Dbl-family GEFs; each anchor's own GEF scores 1.00. The panel
    does not encode substrate: read naively it names Cdc42, while the measured
    substrate is RhoG, and the same GEF bound to two different GTPases gives a
    contact-set Jaccard of 0.731 that moves the target score by 0.06. Retention does
    not imply activity, and this protein is the counter-example, being autoinhibited
    until de-repressed; absence would not imply inactivity, since the DOCK4 out-group
    catalyses exchange with no DH domain. One control artefact is reported rather
    than hidden: at 1FOE the non-DH out-group scored 0.35, +0.22 above its own
    shuffle, which is why the out-group is controlled on DH presence and the positive
    control is each protein against its own composition-matched shuffle.

    Interactome rows. 49 of the 57 GO:0005515 rows are retyped: 42 to GO:0030165 PDZ
    domain binding, because every partner carries PDZ domains and binds one
    C-terminal ...ETDV motif whose occupancy relieves one of the two autoinhibitory
    modes, and 7 to GO:0071889 14-3-3 protein binding. The remaining 8 are one-off
    screen hits with no PDZ explanation, kept as non-core.

    One NEW annotation: GO:2000811 negative regulation of anoikis, from knockdown
    plus rescue in human cells in PMID:21621533, corroborated through an orthogonal
    perturbation of EphA2 in PMID:23772378.

    No REMOVE. The Cdc42 disagreement between PMID:21139582 and PMID:20679435 is
    recorded as a finding_review DISPUTED and reconciled on cofactor-conditionality,
    with both Cdc42 rows demoted rather than adjudicated away.

    Residue claim corrected for species. PMID:30445756's autoinhibition mutant E295A
    is murine (cDNA NM_001112744, Q3U5C8, 713 aa); human Q5VV41 position 295 is a
    serine. residue_mapping.py places it at human E291, and the review's residue_claim
    is anchored on the human position. The script's self-test asserts that the naive
    same-number reading fails, so the conclusion is not vacuous.

    Deep research. The affinage provider record was fetched with clean trust gates
    (pairwise win, faith_pct 100.0) and all six of its citations verified as genuinely
    about this protein. Its recall was poor: PubMed returns 26 records for the
    protein's names and affinage returned 6, missing PMID:20679435, which supplies 8
    of the gene's 12 experimental GO rows. Every mechanistic paper it missed is titled
    Ephexin4 rather than ARHGEF16. Its record names Cdc42 as the core biochemical
    activity and never mentions RhoG. Separately, of those 26 papers only two produced
    any GO annotation on the human or mouse protein.

    Validation at time of writing: just validate human ARHGEF16 passes with one
    best-practice warning, that GO:0031267 carries three different actions. That
    divergence is deliberate and is argued in the RhoG row: the rows differ by
    WITH/FROM partner, and binding the substrate is a different claim from binding a
    GTPase that is never exchanged. Script self-tests: 6/6, 10/10, 6/6, 7/7.
    gene_residue_claims reports 3 pass, 0 fail, 0 unresolved.
