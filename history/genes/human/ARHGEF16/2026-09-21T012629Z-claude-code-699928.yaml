  summary: 'ARHGEF16: address the live re-review - result-stating quotes, TAX1BP3
    in the PDZ panel, and a file: quote verifier'
  details: |
    Second follow-up on PR #3084, addressing the live re-review submitted on the
    coordinator's checkpoint commit. Three items, none touching an action, term,
    evidence code or core_functions entry.

    Item 3, ACCEPTED, and the strongest catch across both review rounds. The 42
    retyped PDZ rows carried the file: quote "The motif is confirmed first, since
    the whole argument rests on it", which announces that a check was run rather
    than stating its result - it would have read identically had the check failed.
    A quote invariant to the outcome cannot be evidence of the outcome. Replaced
    with the result-stating line "Every partner on the PDZ side carries at least
    one PDZ domain". The cadherin row's citation was repointed to the same
    sentence, because the line it had cited was obsoleted by the section-5 rewrite.

    Item 1, REFUTED again, on a new premise. The first review said Q05BK6 is TNS3;
    the re-review correctly doubts that and instead proposes Q05BK6 is a secondary
    accession resolving to TFG, noting that outbound network was blocked in the
    runner. Neither holds. A sec_acc:Q05BK6 query returns zero entries, so it is
    not a secondary accession of anything, including TFG; it is its own primary
    TrEMBL entry, Q05BK6_HUMAN, 366 aa, from EMBL clone BC041600. TNS3 (Q68CZ2)
    lists no secondary accessions either. So the two rows are the same protein
    under two independent primary accessions, one reviewed and one not - which is
    what the review now says.

    Item 2 was already fixed in the previous session and needed no further change.

    Both non-blocking points taken, and both were right. The "11 partners" figure
    was 11 accessions but only 10 distinct proteins, TFG appearing under both
    accessions; the script now reports accession and protein counts separately and
    names the duplicated symbol. More importantly, the panel had been skipping the
    one row GOA already types GO:0030165 - TAX1BP3 - because the partition only
    inspected GO:0005515 rows. That excluded the single partner the ontology has
    already adjudicated, which is the strongest available positive: a disagreement
    there would indict the classifier rather than the review. TAX1BP3 is now inside
    the panel, carries one PDZ domain, and a self-test asserts its presence so it
    cannot silently drop out again. Revised counts: PDZ side 43 rows / 38 partners
    / 147 PDZ domains; outside 15 rows / 11 accessions / 10 proteins / 0 PDZ
    domains.

    Second validator gap closed. conf/reference_validator_config.yaml lists file
    under skip_prefixes, so every file: supporting_text in the repository is
    checked against nothing - a quote from a committed artifact can be paraphrased,
    stale or invented and CI stays green. This review carries 47 of them.
    quote_claim_coherence.py now verifies each against its source; all 47 are
    verbatim, and its self-test tampers with one and requires the rejection, with
    the tamper anchor asserted to match exactly once.

    Mutation testing was redone at the new baselines rather than extrapolated from
    the previous run, because a mutation table is itself a claim. Ten mutations
    across the two guards, every anchor asserted to match exactly once, every
    restore verified by SHA-256 against the original file, both runs ending
    byte-identical to their starting state. pdz_partner_check.py, baseline 9/9:
    name-keyed classifier 5/9, always-yes classifier 4/9, drop reverse guard 8/9,
    drop forward guard 8/9, revert the partition to skip GOA's own GO:0030165 rows
    8/9. quote_claim_coherence.py, baseline 11/11: never record a violation 10/11,
    vacuous claim extraction 8/11, RhoG matched as a substring 10/11, drop
    has_input 10/11, file: verifier stops comparing 10/11.

    Validation at time of writing: just validate human ARHGEF16 passes with the one
    best-practice warning about GO:0031267 carrying three actions, unchanged and
    still argued in the RhoG row. gene_residue_claims: 3 pass, 0 fail, 0 unresolved.
    just validate-families: exit 0. Script self-tests: 6/6, 10/10, 6/6, 7/7, 9/9,
    11/11. Zero REMOVE rows, so the action-versus-retention-prose check is vacuous
    here; verified with a positive control confirming the detector fires rather
    than assumed.
