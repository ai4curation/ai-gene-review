    The negated GO:0004674 row (PMID:26829474) had been given the positive kinase summary. It now has its own review and is REMOVED, because the gene-level NOT contradicts the paper's own wild-type data (K215 acetylation stimulates activity), and the negative probably refers to a mutant or unacetylated condition. Telomere maintenance (abstract-only screen) changed from over-annotated to UNDECIDED, quoting the screen's own sentence. Kinase binding now reflects the PLK1 partner. The B-cell and UV rows and the PMID:20959462 note now state what the full text does discuss (germinal-centre and CD40L/IL-4 B cells) and does not (UV). Removed the chromatin-remodeling hedge after checking the GO definition. Mitotic cell cycle is no longer labelled core. Added the centromeric region to core function 1. Fixed the H1.4 quote start.
