  summary: 'Create review: STK36'
  details: |
    Reviewed all 43 seeded GOA annotations for human STK36 (Q9NRP7): 20 ACCEPT, 9 MODIFY, 7 KEEP_AS_NON_CORE, 5 REMOVE, 2 MARK_AS_OVER_ANNOTATED, none left UNDECIDED. The review turns on reconciling two apparently contradictory bodies of evidence: mouse Stk36 knockouts respond normally to Hedgehog and die postnatally of hydrocephalus (PMID:16055717, PMID:19305393), while purified STK36 phosphorylates GLI2 on conserved Fused sites at the ciliary tip (PMID:31279575, PMID:38096226). The resolution is demonstrated paralogue redundancy with ULK3 - double knockdown epistasis places STK36 with ULK4 in one pathway and ULK3 in parallel - so the smoothened-pathway and positive-regulation rows were ACCEPTED as core with the redundancy recorded in the rationale rather than used as grounds for a downgrade. Two separable core functions recorded, both with MF GO:0004674: ciliary-tip phosphorylation of GLI2 with the ULK4 adaptor (GO:0045880, GO:0007224, GO:0097542), and construction of the central pair apparatus of motile cilia (GO:0035082, GO:0044458, GO:0005930). MODIFY calls: GO:0004672 to GO:0004674; the two SUFU protein-binding rows to GO:0001222, already on the record from the same paper; the two ULK4 protein-binding rows to GO:0004674, since ULK4 is an STK36 substrate phosphorylated on Thr1021/Thr1023; the ARBA GO:0007017 row to GO:0035082; and all three GO:0060271 cilium assembly rows to GO:0044458 motile cilium assembly, because STK36-null cells build primary cilia normally and every reported ciliary defect is in motile 9+2 cilia. REMOVED the five yeast-two-hybrid neurodegeneration-interactome protein-binding rows. Both GO:0009791 post-embryonic development rows MARK_AS_OVER_ANNOTATED as a whole-organism outcome four steps downstream of the kinase activity. The cached PMID:10806483 record holds citation metadata only with no abstract; the six rows citing it were adjudicated against the structured UniProt annotations that cite it with experimental evidence codes rather than left UNDECIDED, and each is independently corroborated. Wrote STK36-notes.md with inline verbatim citations, documenting why GO:0090660, GO:0003341/GO:0003356 and a non-catalytic adaptor term were rejected as NEW on the participation and comparator tests. Added four verified references to the cache. Confirmed PTHR22983:SF6 shared with Drosophila fu against panther-members.tsv; consistent with modules/hedgehog_signaling.yaml and GO-CAM model 696022cd00001645.
