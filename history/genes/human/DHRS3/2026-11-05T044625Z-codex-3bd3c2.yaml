  details: |
    PMID:30104359 reports cysteine scanning of DHRS3 and identifies a partially buried amphipathic helix in lipid-droplet monolayers and the ER cytoplasmic leaflet. Its abstract supplies direct topology evidence even though full text was not recovered. Replace the multi-pass biological description and annotation rationale, retain the ER membrane claim, and refine generic membrane to the existing ER and photoreceptor outer-segment membrane locations. Record the conflicting UniProt topology as a source defect. The predictor supports discovery of this paper; it is not the evidential basis of the correction. Source: supplied DeepTMHMM2 v1 supplement, S20 row 46. Review YAML and notes updated. Baseline and final validation are recorded in projects/DEEPTMHMM2/validation.tsv. No new GO annotation row was added.
