  summary: Correct fold claim and strengthen evidence after two OpenScientist hypothesis
    runs
  details: |
    Ran two blinded OpenScientist function-assignment hypotheses on the two Cosmc claims whose in-review evidence was weakest. (1) GO:0016263 negation: verdict SUPPORTED (high confidence), confirming the ACCEPT of GOA's NOT annotation, but it corrected the stated reason. The review had asserted Cosmc has 'no glycosyltransferase fold'; the local UniProt record in fact assigns Cosmc to the glycosyltransferase 31 family, Beta3-Gal-T subfamily -- the same family as its client C1GALT1 -- and carries an explicit CAUTION that it was originally published as a glycosyltransferase before being shown to have no transferase activity. Reworded to describe Cosmc as a degenerate GT31 member, a pseudoenzyme retaining the family relationship while having lost catalysis, which also explains why the explicit negation is necessary: family-based inference will keep proposing the activity. (2) GO:0000139 Golgi membrane: verdict refuted, independently corroborating the MODIFY to endoplasmic reticulum membrane and identifying the annotation as compartment carry-over from the Reactome reaction of the Golgi-resident client. The run surfaced PMID:21262965, which maps the ER-retention determinant to Cosmc's own 18-residue transmembrane domain; that paper plus PMID:18695044 and PMID:19923218 were fetched, cached with full text, and cited directly rather than relied on through the report. A guessed title for PMID:19923218 was caught by the reference validator and corrected from the cached record. All 36 supporting_text quotes verified verbatim.
