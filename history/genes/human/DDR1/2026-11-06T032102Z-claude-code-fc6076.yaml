  details: |
    Completed the review of human DDR1 (Q08345), the collagen-activated receptor tyrosine kinase. All 47 GOA rows reviewed: generic kinase MF rows refined to GO:0038062 and generic RTK signaling to GO:0038063 (consistent with the DDR2 review and the collagen_ddr_signaling module); five bare protein-binding IPI rows refined to SH2 domain binding (NCK2, PTPN11), WW domain binding (WWC1) and receptor tyrosine kinase binding (DDR2); cell adhesion TAS refined to cell-matrix adhesion; ARBA developmental grouping term marked over-annotated. Core function: GO:0038062 at the plasma membrane, directly involved in GO:0038063 (fibrillar collagens I-III and collagen IV). No deep-research provider was available; research used cached publications, PMID:24725424 and newly cached PMID:11283268, recorded in DDR1-notes.md. just validate human DDR1 passes.
