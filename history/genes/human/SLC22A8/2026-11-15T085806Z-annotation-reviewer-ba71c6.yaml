  summary: De-novo review of all 32 GOA annotations for SLC22A8 (OAT3), renal organic
    anion/dicarboxylate exchanger
  details: |
    Reviewed every GOA row for SLC22A8 (Q8TCC7, OAT3). Renal proximal-tubule basolateral organic anion transporter 3 - tertiary-active organic anion:dicarboxylate ANTIPORTER (exchanges extracellular organic anion uptake for intracellular 2-oxoglutarate/alpha-KG efflux; outward alpha-KG gradient set by Na+-dicarboxylate cotransporters NaDC3/SLC13A3, so coupling to Na+ is indirect - NOT a facilitative or Na+/H+ symporter). Broad substrates: urate, estrone-3-sulfate, cAMP, methotrexate, NSAIDs, beta-lactams, diuretics, PAH. CRITICAL obsolescence handling: GO:0008514 (organic anion TTA), GO:0015347 (Na-independent organic anion TTA), GO:0015301 (anion:anion antiporter) AND GO:0015711 (organic anion transport BP) are ALL OBSOLETE - avoided. Core MF (live, QuickGO non-obsolete): GO:0015297 antiporter activity (the alpha-KG/dicarboxylate exchange mechanism) + GO:0042910 xenobiotic transmembrane transporter activity (drug/toxin core) + NEW GO:0015143 urate transmembrane transporter activity (urate secretion defining, absent from GOA). Actions (32+1 NEW=33): 10 ACCEPT, 13 TOO_GENERAL (GO:0022857 x9, GO:0055085 x3, GO:0016020 - roots), 8 KEEP_AS_NON_CORE (prostaglandin MF/BP, apical PM tissue-specific vs core renal basolateral, xenobiotic transport BP, exosome HDA, BBB NAS), 1 MODIFY (GO:0005452 solute:INORGANIC anion antiporter -> GO:0015297 antiporter - OAT3's counter-substrate is the ORGANIC dicarboxylate so 'inorganic' mischaracterizes; not REMOVE, paper is OAT4-titled but curator applied to OAT3, deferred per policy), 1 NEW (GO:0015143 urate). proposed_new_terms: 1 ('organic anion:dicarboxylate antiporter activity', parent GO:0015297 - specific mechanism term filling the gap left by the obsoleted organic-anion grouping terms for SLC22 anion exchangers OAT1/OAT3/URAT1; distinct from the obsoleted generic grouping terms). source_defects: none. Batch 13.
