  summary: Review CANT1 nucleotidase activity and proteoglycan synthesis evidence
  details: 'First manual review of human CANT1/Q8WVQ1 preserves all 37 normal GOA assertions, including
    original term identities, evidence codes, references, qualifiers and supporting entities, and all
    three fetched alternative products. The 401-residue current human sequence and CRC64 were independently
    checked. Historical precursor numbering and product-dependent membrane anchors are distinguished.


    Decisions are 24 ACCEPT, eight KEEP_AS_NON_CORE and five UNDECIDED, with no NEW annotations. The single
    core is calcium-dependent nucleoside-diphosphate hydrolysis in the secretory pathway, supporting the
    existing proteoglycan-biosynthesis assertion. UDP feedback relief and UMP exchange remain a proposed
    mechanism, not measured human luminal nucleotide flux. The human patient-cell study''s xyloside-stimulated
    synthesis defect is separated from its shorter-chain assay performed without xyloside. EDM7 is reviewed-UniProt
    clinical context; the directly read patient study concerns Desbuquois dysplasia type 1.


    The preferred UDP/GDP/IDP chemistry is distinguished from weak wild-type ADP activity and engineered
    platelet inhibition. Calcium-dependent self-association does not imply that monomers are inactive.
    The two supplemental normal publication caches remain abstract-only; independent official PMC reading
    of PMID18067325 provides full-text evidence without modifying its cache. The indexed publisher erratum
    to PMID15006348 adds omitted insect-apyrase citations, with no stated human-result change. Original
    inaccessible kinetic/localization tables are not claimed to have been read.


    The CLRN1 interaction is retained as non-core based on the exact curated edge and indexed primary
    HuRI entry. The FAM209A target table, exosome target proteomic detection, two plasma-membrane source
    assertions and NF-kappaB reporter result remain uncertain. Neutrophil granule/extracellular cargo
    locations do not establish exocytosis machinery. No IBA donor-count, target-self-source circularity,
    guessed ancestral node or family identifier claim is made.


    Normal Falcon and configured perplexity-lite fallback research attempts failed with connection errors
    and produced no report; the notes record manual evidence work. A distinct whole scientific peer and
    ROOT acceptance are required before this application. All 19 preimages are checked and all 18 source/cache
    files preserved byte-for-byte. Normal validation has one expected generic-binding policy warning under
    the standing project override; normal status remains DRAFT with all annotations reviewed. Standard
    rendering and this CREATE history record are validated. No source-cache edits or remote mutations
    occur in the application helper.'
