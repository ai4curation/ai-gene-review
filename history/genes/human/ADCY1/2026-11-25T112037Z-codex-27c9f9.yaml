  summary: Create human ADCY1 review
  details: |
    Created the initial human ADCY1 review for GO-CAM 59dc728000000351. Seeded 59 QuickGO annotations, reviewed every existing annotation against UniProt, Reactome, PANTHER PAINT and the cached ADCY1 literature, accepted the core calcium/calmodulin-responsive adenylyl cyclase function, kept conserved neuronal contexts as non-core and marked generic Reactome/ARBA hormone and shear-stress contexts as over-propagated where ADCY1-specific evidence was absent. Added ADCY1 notes with the GO-CAM consistency finding that the model's ADCY1 MF and plasma-membrane cAMP step are generic and do not establish ADCY1 as the FSHR-specific cyclase isoform.
