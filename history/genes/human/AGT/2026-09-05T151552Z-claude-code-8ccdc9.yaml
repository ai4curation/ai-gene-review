  summary: 'Drop the two NEW angiotensin-maturation rows: substrate-side annotation
    is not a GO gap'
  details: |
    Removed the two NEW rows proposed on PR #2972 (GO:0002003 angiotensin maturation
    and GO:0002002 regulation of angiotensin levels in blood), and rewrote the
    supporting section of AGT-notes.md to record why the absence of angiotensinogen
    from those terms is correct rather than a curation gap.

    Grounds, each checked live:

    1. GO:0002003 is_a GO:0016486 peptide hormone processing, under GO:0016485
       protein processing / GO:0051604 protein maturation / GO:0006508 proteolysis.
       The term describes the cleaving. Renin and ACE cleave; angiotensinogen is
       cleaved and contributes no chemistry to its own conversion.

    2. GO treats every comparable prohormone the same way. INS (P01308) is absent
       from GO:0030070 insulin processing; POMC, GCG, PDYN and NPPA are absent from
       GO:0016486 (CORIN, which cleaves pro-ANP, is on it; pro-ANP is not); APP is
       absent from GO:0034205 amyloid-beta formation. Only proteases and processing
       machinery are annotated.

    3. GO-CAM 6246724f00000549 "Renin-angiotensin pathway (Human)" types REN
       (GO:0004190) and ACE (GO:0008241) part_of GO:0002003, and puts AGT in the
       same model as GO:0005179 hormone activity part_of GO:0002034, plus three
       UniProtKB:P01019 molecule instances standing as the proteases' input and
       output. The absence is a modelling decision, not an oversight, and AGT is
       not invisible in the pathway.

    4. GO:0002003 is part_of GO:0002002, so the two proposed rows were parent and
       child of one another.

    Partial counterexamples recorded rather than explained away: thyroglobulin on
    GO:0006590, fibrinogen on GO:0042730, C3 on GO:0006956 - all substrates that
    also do chemistry or structure, unlike angiotensinogen.

    Consequential edits: core_functions[0].directly_involved_in retargeted from the
    two removed terms to GO:0003081 regulation of systemic arterial blood pressure
    by renin-angiotensin, which AGT already carries in GOA and which is an ancestor
    of both; two reference_review notes that referred to "both NEW rows" reworded;
    one suggested_question added asking the GO editorial office whether has_input
    extensions on the proteases' rows are the intended way to make a prohormone's
    substrate role machine-readable. AGT_decisions.py (the generator) updated first
    and AGT-ai-review.yaml regenerated from it, so the two stay in step.

    Validation after the change: ai-gene-review validate --terms passes with the one
    pre-existing warning (no annotation references the affinage deep-research file);
    check_goa_reconciliation.py reports 113 entries from 114 GOA rows, 0 NEW,
    15/15 propagation reviews present.
