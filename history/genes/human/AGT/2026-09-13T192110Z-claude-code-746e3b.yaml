  details: |
    Follow-up session on the same branch, after PR #2972 was squash-merged. Three
    things, none of them a change to a curation decision.

    1. Rebase hygiene. The branch still carried the ten pre-squash paint/AGT commits,
       so PR #2973 was proposing the whole merged review again and conflicted
       add/add on three AGT files against main's byte-identical copies. Dropped the
       already-merged commits and replayed only the follow-up ones onto current main
       (git rebase --onto origin/main 3974143ce), which applied without conflict. A
       cache/go/terms.csv row (GO:0031703) had been appended before GO:0031704
       existed on main; rebasing left it out of sort order and it was moved back.

    2. Guidelines. CLAUDE.md gained "Do not add what curators deliberately declined
       to add" - the participation rule that should have blocked the two NEW rows -
       plus the previously blank ActionEnum NEW description, filled in from the
       schema so all seven now match gene_review.yaml verbatim. The same
       participation and comparator tests went into the annotation-reviewer and
       aigr-pr-review skills. A first draft asserted that a term under GO:0006508
       proteolysis "names the catalyst, not the substrate"; that is falsified by
       GO:0016540 protein autoprocessing, which sits under the same GO:0016485
       parent as GO:0002003 and is carried by the substrate because there the
       substrate does the cleaving. Reworded in all three files to "names whatever
       does the cleaving".

    3. Review findings from ai4c-reviewer, addressed across two commits. The
       retracted proteolysis clause had survived in both skill files after only the
       CLAUDE.md copy was fixed. The three substrate-side annotations GO does make -
       thyroglobulin on GO:0006590, fibrinogen on GO:0042730, C3 on GO:0006956 -
       were recorded only in AGT-notes.md, where a future agent would not read them,
       so they moved into the guideline with the mechanism for each: the thyroid
       hormone's bonds form inside the thyroglobulin chain, fibrin acts as a
       cofactor for plasminogen activation, C3's internal thioester is exposed by
       cleavage and C3b uses it to bond the target surface. And the
       suggested_questions entry on substrate-side representation now names its
       concrete instance, the GO:0005515 -> GO:0002020 protease binding MODIFY on
       the renin interaction.

    The only curated-content change in this session is that suggested_questions
    entry; existing_annotations and core_functions are untouched since the two NEW
    rows were dropped. AGT_decisions.py was edited before each regeneration of
    AGT-ai-review.yaml, so generator and output remain in step.

    Declined with reasons, all raised by the reviewer and all still open: five
    prose-cited PMIDs absent from publications/ (PMID:8348686, 8252633, 12242043,
    34615811, 7539791) need fetches plus a judgement about which quotes to anchor;
    the angiotensin-(1-7)/MAS1 sentence placement is cosmetic and sits in another
    session's prose; the creation session 887eead06 has no record of its own. The
    2026-09-05 record in this directory says "PDYN" where the comparator is PENK
    (proenkephalin-A, P01210) - the notes and CLAUDE.md carry the correct symbol,
    and that record stands unedited because records are append-only.

    Validation: review valid with the one pre-existing deep-research warning;
    reconciliation 113 entries from 114 GOA rows, 0 NEW, 15/15 propagation reviews;
    terms.csv 9835 rows, 0 duplicates, 0 out-of-order pairs; the CLAUDE.md ActionEnum
    block parses and matches the schema.
