  summary: Split the angiotensin-receptor core function into its AGTR1 and AGTR2 arms
  details: |
    Addresses the blocking item in the ai4c-reviewer CHANGES_REQUESTED review of PR #2973.

    core_functions carried one entry covering both receptor limbs, whose prose described the AGTR1 and AGTR2 arms together but whose single-valued molecular_function was GO:0031702 alone, so the AGTR2 limb was invisible to a consumer reading only core_functions - even though the GO:0031703 row at existing_annotations is reviewed ACCEPT as a core molecular function. Split into two entries (the reviewer's preferred option, rather than generalising to the parent GO:0031701, because the opposition between the receptors is the review's own framing):

    - AGTR1 arm: GO:0031702, supported by PMID:1378723 (high-affinity AII binding, inositol phosphate coupling), PMID:1567413 (calcium mobilisation in oocytes) and the UniProt PRO_0000032458 interaction line; directly_involved_in GO:0038166 and GO:0007200.
    - AGTR2 arm: GO:0031703 (label verified against GO via OLS, not obsolete), supported by the two PMID:10406457 sentences on AT2-mediated apoptosis/ERK inhibition and SHP-1 as proximal effector, plus the UniProt PRO_0000032459 line; directly_involved_in GO:0038166 only. GO:2001238 is deliberately not listed here: that row is reviewed KEEP_AS_NON_CORE.

    Also addressed one non-blocking review point: the Cys18-Cys138 vs Cys18-Cys137 numbering was not an inconsistency but a species difference, so the knowledge_gap now states it. Human UniProt has SIGNAL 1..24, CHAIN 25..476 and DISULFID 42..162, giving mature Cys18-Cys138; PMID:25691624 is a mouse knock-in study and numbers the same conserved bond Cys18-Cys137.

    Per the previous session's convention, AGT_decisions.py (the generator) was edited first and AGT-ai-review.yaml regenerated from it with build_review.py, so the two stay in step.

    Validation after the change: just validate human AGT passes with the one pre-existing warning (no annotation references the affinage deep-research file); check_goa_reconciliation.py still reports 113 entries from 114 GOA rows, 0 NEW, 15/15 propagation reviews present.

    Not addressed here, and left for the PR author: five prose-cited PMIDs are still absent from publications/.
