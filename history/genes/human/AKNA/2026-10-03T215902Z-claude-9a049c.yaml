  details: |
    29 GOA rows reviewed (14 ACCEPT, 12 KEEP_AS_NON_CORE, 2 REMOVE, 1 MARK_AS_OVER_ANNOTATED); no NEW. Centrosomal and delamination rows accepted from the mouse study (PMID:30787442). The transcription-factor MF and the microtubule-nucleation MF are recorded as MF_DARK knowledge gaps: AKNA has no DNA-binding or transcription-factor MF in any species, PAINT propagates only centrosomal functions, and the comparator subdistal-appendage proteins lack positive regulation of microtubule nucleation. Protein-binding rows were removed per policy.
