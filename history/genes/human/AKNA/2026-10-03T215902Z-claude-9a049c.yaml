    The reviewer showed that the comparator argument against GO:0090063 was wrong: AKNA's interactor DCTN1 carries both GO:0120103 and GO:0090063 by IDA (verified in DCTN1-ai-review.yaml on main). The MF_DARK boundary now withholds the term on evidential grounds instead (cellular necessity plus recruitment, versus DCTN1's direct in vitro nucleation). It cites the UniProt recruitment sentence and the SUBUNIT partners (DCTN1, MAPRE1, ODF2, CAMSAP3). Added suggested questions for GO:0090063 and for located_in versus is_active_in on the family-wide microtubule IBA. The microtubule rows now note that their IBA comes from node PTN000487658 rather than PTN002726534. The fibrillar-center row no longer cites a nucleus-only quote. The HuRI quote is now a full sentence. The affinage review_notes flag two unverified 2025 bioRxiv findings.
