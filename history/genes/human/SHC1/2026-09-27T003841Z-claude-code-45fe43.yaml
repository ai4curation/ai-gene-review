  details: |
    Created the full SHC1 (P29353) review from the GOA stub: all 253 annotations judged (159 ACCEPT, 27 MODIFY, 56 REMOVE, 8 KEEP_AS_NON_CORE, 3 MARK_AS_OVER_ANNOTATED). The 82 bare protein-binding IPI rows were resolved per partner and paper: phosphotyrosine recognition by the PTB/SH2 domains (EGFR/ERBB, INSR, JAK2, CEACAM1, APP, PEAK1, MET/KIT/GAB1/AR, ALK) became GO:0001784, receptor-to-GRB2/SOS bridging became GO:0005068, and GRB2-SH2 peptide studies plus high-throughput interactome rows were removed as uninformative. EGF binding (IEA) was corrected to EGFR binding, and Chlamydia Tarp knockdown-derived defense-response and transcription terms were marked over-annotated. Added description, isoform-aware notes (p46 mitochondrial matrix, p66 oxidative stress), reference reviews, two core functions (RTK adaptor activity; phosphotyrosine residue binding), questions and experiments; cached PMIDs 10580504, 16051147, 14573619.
