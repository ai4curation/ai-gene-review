  summary: Drop the parent term from core function 1, and migrate the GO:0005515 row to REMOVE
  details: |
    Review round 2 suggestion for PR 4813. core_functions[0].directly_involved_in carried both GO:0016562 protein import into peroxisome matrix, receptor recycling and its ancestor GO:0016558 protein import into peroxisome matrix. Confirmed the ancestry with the GO adapter (is_a/part_of): GO:0016558 is an ancestor of GO:0016562, so the pair is redundancy rather than added coverage, which is what CLAUDE.md rejects. Kept the child and dropped the parent, because the receptor-recycling step is the one PEX10 performs: with PEX12 it monoubiquitinates PEX5 at Cys11, which is what allows the receptor to return to the cytosol. The same shape was fixed earlier in this run on KCNJ11 (GO:0050796 dropped as the parent of GO:0046676) and LIPA (GO:0046461 dropped as an ancestor of GO:0019433).

    Also migrated the GO:0005515 IPI row (PMID:10837480) from MARK_AS_OVER_ANNOTATED to REMOVE. This was not raised in review; the repository's own validator warns on it, because the protein-binding policy excludes MARK_AS_OVER_ANNOTATED for GO:0005515 by name - the problem is that the term carries no functional information, not that it claims more than the evidence supports. It is the single remaining occurrence across this PR, a straggler from the same migration already applied to GPD1, LPIN1 and SCP2 in PR 4812 and to ATP7B and HMOX1 in PR 4817, so leaving it would have been an inconsistency rather than a deliberate exception. The reason keeps the biology unchanged and now states explicitly that removal does not mean the PEX12, PEX2 and PEX5 interactions are false, and names where the evidence is actually carried: complex membership by the proposed NEW GO:0000151 row, the catalytic function by the existing GO:0061630 IDA. Validation warnings on the file drop from three to two.
