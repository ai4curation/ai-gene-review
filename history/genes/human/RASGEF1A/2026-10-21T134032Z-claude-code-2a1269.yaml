  details: |
    New full review of human RASGEF1A (Q8N9B8, PTHR23113:SF172), written as the experimentally characterised reference for the donkey ortholog and independent of the ProtNLM2 predictions. All 10 GOA rows were reviewed. GEF activity (GO:0005085: IBA, 2 IDA, IEA) is accepted as core, together with small GTPase-mediated signal transduction (IEA). Ras protein signal transduction (IBA), positive regulation of Ras signalling (IDA), cell migration (overexpression IDA), cytosol (Reactome TAS) and plasma membrane (IBA) are kept as non-core. The substrate is disputed: purified-protein data (PMID:19645719) show Rap2 specificity and no Ras-subfamily activity, while PMID:17121879 reported H/K/N-Ras exchange. No NEW terms were added; Rap protein signal transduction is raised as a question. Falcon deep research failed (Edison 403) and the perplexity-lite fallback timed out, as recorded in the notes.
