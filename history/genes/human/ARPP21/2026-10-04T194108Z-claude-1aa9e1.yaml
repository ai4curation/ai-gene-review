  summary: 'Address PR #4206 review: add positive regulation of translation, restate ISO basis'
  details: |
    Added NEW ISO GO:0045727 positive regulation of translation, from the MS2 tethering, eIF4G-dependence and unchanged-mRNA results of PMID:29581509, and added it to core directly_involved_in. The parent was chosen over GO:0045948 because initiation specificity is inferred. The GO:0050775 ISO comment now states that MGI has no such row for Arpp21 and the ISO rests on the paper's mouse experiments. The MODIFY reason says the 3'-UTR call is a homology inference. Added the Rag1 3'-UTR finding, a thymocyte/RAG1 suggested question, and a fuller PMID:29581509 reference note.
