  summary: Review ENG coreceptor function and source-specific annotations
  details: |
    Reviewed all 104 human ENG source contexts, preserving five NOT flags, three contributes_to relations, all imported fields and the two natural products. Synthesized one independently reviewed plasma-membrane coreceptor function from direct BMP9/BMP10 ligand recognition, receptor association and signaling experiments, keeping construct, ligand and cellular context explicit. Decisions: 29 ACCEPT, 62 KEEP_AS_NON_CORE, one MODIFY, two MARK_AS_OVER_ANNOTATED and ten UNDECIDED. Lectin recognition of glycans on ENG is distinguished from ENG sugar-binding activity; porcine glycosaminoglycan evidence and selected developmental assertions remain unresolved. Added source guide with original links/assay locators, verified bibliography, three expert questions and an offline source-context analysis. No NEW annotation, publication quotation or structured source-defect report added. Normal and verbose term validation, computed DRAFT status, rendering, exact source/product preservation and independent core review pass. Sixteen advisories remain: fourteen campaign generic-binding annotations, deliberate source-specific glycan action differences and a current-official-label versus older ontology-label mismatch. Existing publication caches were preserved; 26 genuine cited normal caches added and eight reused. Historical optional warning-as-error diagnostics remain documented in private provenance.
