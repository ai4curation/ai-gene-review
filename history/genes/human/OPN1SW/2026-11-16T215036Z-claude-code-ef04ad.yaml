  summary: First review of OPN1SW for the dismech vision-disorder alignment
  details: |
    First annotation review of human OPN1SW (cone opsin), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1, phototransduction), together with the other two cone opsins so that the three use one scheme. Core functions: GO:0008020 G protein-coupled photoreceptor activity in GO:0141190 transducin-mediated opsin signaling pathway at the cone photoreceptor disc membrane, and GO:0005502 11-cis retinal binding in absorption of visible light (added as a NEW row, matching RHO). General function, pathway and membrane rows are refined to those terms; plasma membrane rows go to the cone disc membrane, which GO places under plasma membrane. Bare protein binding is removed. Evidence on transducin activation is from human pigment expressed in cultured cells with bovine rod transducin for the L opsin and by transfer for the others; the review says which. Validated with just validate human OPN1SW: no errors; warnings left for IBA MODIFY rows without propagation_review metadata.
