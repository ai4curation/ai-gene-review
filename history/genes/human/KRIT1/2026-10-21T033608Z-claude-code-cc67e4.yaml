  summary: Full re-review of human KRIT1 (O00522) for the ProtNLM2 HORSE40 benchmark,
    independent of ProtNLM2 output
  details: |
    Re-examined all 51 GOA rows against the literature and PTHR13283 PAINT nodes. Removed horse-review text that had leaked into the human file. Brought 19 GO:0005515 rows into line with the protein-binding policy (RAP1A row to small GTPase binding, PMID:23007647 HEG1/CCM2 rows to protein-macromolecule adaptor activity, CDH5 row to cadherin binding, the rest removed). Removed the A/P axis specification IBA, whose only seed is a zebrafish knockdown acts_upstream phenotype. Refined integrin activation to its positive regulation, regulation of angiogenesis to negative regulation, cytoplasm/cytoskeleton to microtubule cytoskeleton, and anchoring junction to adherens junction. Made the angiogenesis and polarity rows consistently non-core. Added NEW negative regulation of Rho protein signal transduction (comparators HEG1 and RASIP1 carry it). Rewrote the description and core functions (Rap1 effector, HEG1-CCM2 junctional adaptor, PI(4,5)P2/microtubule binding, ICAP1 antagonism). Cached five more publications.
