  summary: First review of GNAT1 for the dismech vision-disorder alignment
  details: |
    First annotation review of human GNAT1 (rod transducin alpha subunit), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1, phototransduction). All 61 GOA rows were reviewed: 22 MODIFY, 14 ACCEPT, 14 KEEP_AS_NON_CORE, 9 MARK_AS_OVER_ANNOTATED, 2 REMOVE. The two removed rows are adenylate cyclase-modulating G protein-coupled receptor signalling (IBA from the G alpha root node and an InterPro IEA): the effector of transducin is PDE6, through its gamma subunits. General rows are refined to GO:0003925 G protein activity, GO:0141190 transducin-mediated opsin signaling pathway and GO:0120202 rod photoreceptor disc membrane. Bitter-taste, jejunal apical membrane and cGMP catabolic process rows are marked as over-annotation. Two IDA location rows cite PMID:2534964, whose abstract reports cone transducin staining only; they are kept in deference to the curator and the reference is marked UNVERIFIED because only the abstract was available. Validated with just validate human GNAT1: no errors.
