  summary: 'Create review: TLR7'
  details: |
    Reviewed all 108 seeded GOA annotations for human TLR7 (Q9NYK1): 84 ACCEPT, 15 KEEP_AS_NON_CORE, 3 MODIFY, 3 MARK_AS_OVER_ANNOTATED, 2 REMOVE, 1 UNDECIDED. Wrote a standalone description of TLR7 as a dual-site endolysosomal RNA-degradation-product sensor (guanosine/2',3'-cGMP at pocket 1, uridine-containing ssRNA at pocket 2) and three core functions (pattern recognition receptor activity, guanosine binding, single-stranded RNA binding). Key decisions: GO:0070305 response to cGMP (IMP, PMID:35477763) MODIFYed to GO:1905108 guanosine binding because the term is defined for guanosine 3',5'-cyclophosphate whereas the TLR7 ligand is the 2',3'-cyclic isomer released by RNase T2 and PLD3/PLD4 (PMID:38697119); GO:0034158 toll-like receptor 8 signaling pathway REMOVEd as an Ensembl Compara transfer of a term defined by TLR8 ligand binding; GO:0032729 type II interferon IDA MODIFYed to GO:0034346 type III since PMID:16286015 measured IFN-alpha/beta and IFN-lambda only, matching the TLR9 review, while the ARBA row was kept as non-core on the strength of the IFN-gamma defect in PMID:32706371; GO:0003725 dsRNA binding MODIFYed to ssRNA binding and GO:0035197 siRNA binding marked over-annotated; the UNC93B1 protein-binding IPI removed as uninformative; GO:0071260 left UNDECIDED and GO:0043235 kept with real support after verifying that their cited references (PMID:19593445, PMID:23382219) do not mention TLR7 at all, both flagged via reference_review as wrong identifiers. Deep research failed for this gene and is noted as absent in TLR7-notes.md. just validate human TLR7 passes with one warning (deliberately divergent actions on the two GO:0032729 rows); all 200-plus supporting_text quotes verified verbatim against cached publications.
