  summary: 'Create review: AP1S2'
  details: |
    Full de novo review of human AP1S2 (sigma1B, P56377, PANTHER PTHR11753). All 50 GOA rows reviewed (24 ACCEPT, 14 KEEP_AS_NON_CORE, 9 MODIFY, 3 MARK_AS_OVER_ANNOTATED) plus 4 NEW ISS rows covering the sigma1B-specific biology GOA omits entirely: GO:0036466 and GO:0016182 (endosomal synaptic-vesicle recycling and budding), GO:2000642 (Rabex-5-dependent negative regulation of endosome maturation) and GO:0061462 (sortilin delivery to lysosomes), all coded ISS from the mouse orthologue Q9DB50 rather than IMP on human. 15 propagation_review blocks with 27 traced source entities. The single IBA (GO:0016192, node PANTHER:PTN000204281) is NO_FAILURE_CORE: the node's seeds span AP-1, AP-2 and AP-3 sigma subunits across nine species, so the AP-complex-wide term is the correct LCA rather than a granularity mismatch, and the target sits inside the inheriting clade. Key corrections: GO:0060155 platelet dense granule organization and GO:1903232 melanosome assembly are ComplexPortal projections from a commentary whose only platelet statement is an explicit prediction about Rab38 and whose AP-1 experiments use pan-AP-1 reagents (reference projection: 178 annotations over 48 gene products from 5 terms); the GO:0005737 ARBA row cannot be reproduced from ARBA00026971's own 2388 condition sets. A new bioinformatics analysis (live UniProt fetch, no hardcoded results) maps the four sigma-side dileucine-signal residues from PMID:21097499 onto AP1S2 as R14/V87/L100/I102, all RETAINED, encoded as residue_claims, and independently reproduces the 87 percent sigma1B/sigma1A identity reported in PMID:9733768 as 87.3 percent. Validated with just validate (valid, 1 warning), checkquotes.py (94 quotes, 0 failures), gene_residue_claims (91 pass, 0 fail) and a purpose-written GOA-row/YAML-entry reconciliation script.
