  summary: Clarify CSF1R evidence links, core functions and viral-process specificity
  details: |
    Addressed review feedback on PR4979 by adding explicit support pointers to all 116 annotation judgments and source-exact short evidence anchors. The single receptor-kinase core now explicitly includes autophosphorylation and major phagocyte differentiation/proliferation outcomes, using the CSF1-CSF1R complex only for the CSF1-bound assembly. The viral-process annotation changes from non-core retention to over-annotation because the positive pharmacological p24 phenotype does not resolve receptor-specific process attribution; the original Igf2r/Csf1r-Cre miscitation remains explicit. Axon guidance remains uncertain after full main-text access, reflecting mechanistic uncertainty rather than unavailable evidence. The biological description and experiment hypotheses are clarified. All original source objects, products, caches, provider artifacts, previous notes and histories are preserved. Duplicate reference and support-pointer entries identified during review were removed before publication. Validation, status checking and rendering pass with four scoped advisories; DRAFT remains the ordinary derived status.
