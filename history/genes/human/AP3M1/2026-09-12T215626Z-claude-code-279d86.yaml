  summary: 'Create review: AP3M1'
  details: |
    Full end-to-end review of the 53 GOA rows on human AP3M1 (Q9Y2T2), the medium subunit of the ubiquitous AP-3A adaptor complex. Actions: 6 ACCEPT, 19 KEEP_AS_NON_CORE, 25 MARK_AS_OVER_ANNOTATED, 2 MODIFY, 1 REMOVE, plus 2 NEW rows; 19 propagation_review blocks with source_entities built by script from each row's supporting_entities. Key verdicts: GO:0030131 clathrin adaptor complex removed, because GO places AP-3 outside that class (its only children are AP-1 and AP-2) and the interpro2go signature IPR001392 covers every AP medium subunit; the GO:0035615 IBA modified to GO:0140312 because PANTHER node PTN000055849 is the whole mu-subunit family and its seeds are exclusively AP-1/AP-2 donors; GO:0035654 generalised to GO:0035459 to drop a clathrin commitment the 2026 cryo-ET reconstitution contradicts. New rows: GO:0005048 for the mu3A YxxPhi sorting-signal activity, matching the AP2M1 curation precedent and supported by five independent lines plus the 2024 human AP-3 cryo-EM structure, and GO:0008333 as TAS for the endosome-to-lysosome step. The five mouse-derived IEA/ISS rows were kept non-core after reading PMID:21998198, whose AP-3 genetics use the Ap3d1 mocha allele and never assay mu3A. A new uv bioinformatics project measures the cargo pocket from PDB 9C5B and 1BXX, encoded as 8 machine-checked residue_claims. Validated with just validate (clean, no warnings), checkquotes.py (167 quotes, 0 failures), gene_residue_claims (103 pass), a duplicate-key check, terms.csv deletion and duplicate checks, and a GOA-to-YAML reconciliation script asserting row-key and supporting_entities equality.
