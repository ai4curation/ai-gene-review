  summary: 'Create review: FOLH1'
  details: |
    Reviewed all 33 seeded GOA annotations for FOLH1 (Q04609, PSMA); provenance notes are in FOLH1-notes.md because deep-research providers were unavailable. Localization conclusion is plasma membrane as a type II single-pass protein with the large glycosylated catalytic domain extracellular and surface-accessible, which is the basis of PSMA imaging; all six plasma-membrane rows and the cell-surface row were accepted, the three generic membrane rows refined to plasma membrane, and the two cytoplasm rows kept as non-core because UniProt assigns that location specifically to the PSMA-prime splice isoform. Metallocarboxypeptidase activity, substrate-binding terms for Ac-Asp-Glu and folyl-polyglutamate, proteolysis, glutamate biosynthesis and intestinal folate absorption were accepted; carboxypeptidase activity and peptidase activity rows were marked TOO_GENERAL; dipeptidase activity and the glutamate receptor signalling rows were kept as non-core. One core function was recorded.
