  summary: Review DCDC2 ciliary function and source-specific annotation evidence
  details: |
    Reviewed all 62 imported DCDC2 annotations with source-specific literature, actual PAINT ancestry and donor evidence, and the original interaction records. Preserved every source object and five existing publication caches. Distinguished microtubule/ciliary function from canonical Wnt inhibition, assay-dependent binding from partner activity, and the two official products from engineered constructs. Corrected the antisense RU2AS antigen attribution using the original paper. Independent core and annotation consultation informed the review; primary and fallback provider failures remain documented. Retained supported generic binding as non-core under the explicit project instruction. Generated HTML and ran ordinary gene, term, status and history checks.
