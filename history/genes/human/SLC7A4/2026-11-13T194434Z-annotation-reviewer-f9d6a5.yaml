  summary: De-novo review of all 12 GOA annotations for SLC7A4 (CAT-4), pH-gated L-leucine
    transporter
  details: |
    Reviewed every GOA row for SLC7A4 (O43246, CAT-4). Transport function resolved by recent literature (PMID:41904136, 2026): pH-gated L-leucine transporter, activity potentiated at acidic pH; does NOT transport cationic amino acids, so the CAT-4 family name is a homology label. Core function ACCEPTed as L-leucine transport (MF GO:0015190, BP GO:1903801, substrate CHEBI:57427). Contradicted 1998 Arg/Lys claim recorded as OVERTURNED finding_review on PMID:9598310 (superseded by PMID:41904136); GO:0015174 + GO:1990822 basic-AA rows REMOVEd. Not heteromeric. 1 proposed_new_term (pH-gated leucine transport). Actions: 4 ACCEPT, 6 MODIFY, 2 REMOVE. Batch 8.
