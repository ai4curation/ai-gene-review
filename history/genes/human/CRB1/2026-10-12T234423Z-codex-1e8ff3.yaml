  summary: Review CRB1 polarity function and isoform-specific evidence
  details: |
    Reviewed all 41 CRB1 source annotations using target literature, explicit orthology and phylogenetic source evidence, and sequence-authenticated products. The review contains 21 ACCEPT, 11 MODIFY, six KEEP_AS_NON_CORE, two UNDECIDED and one MARK_AS_OVER_ANNOTATED decisions, with no NEW rows. Synthesized a canonical-tail PDZ-domain-binding core in epithelial apicobasal polarity at the apical plasma membrane. Distinguished direct PALS1 binding from bridged partners, modern lettered retinal isoforms from five official products, and the current resolving PAINT tree from protected older family cache records. Preserved positive mouse CRB1-B outer-segment evidence with species and product limits. Independent whole review and ROOT assessment corrected both an initially incomplete localization interpretation and overbroad wording about a family cache. Preserved all machine source objects and products, existing shared source caches and unrelated work. Ordinary validation, status consistency and rendering passed with five intentional generic-binding advisories. Added the evidence index and source-access limitations; genuine history was scaffolded and validated.
