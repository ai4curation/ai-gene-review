  details: |
    Round 5 approved the review and left one trivial nit: the GO:0051880 reason carried a 124-character source line where the file wraps near 78, introduced by the round-4 rewrite, to be folded in only if the branch were touched again for another reason. That reason arrived. The deterministic auto-merge controller skipped the PR with 'checks not passing: claude-review=cancelled, suite (3.12)=cancelled, test (3.12)=failure, validation (3.12)=cancelled'. Those four check runs belong to run 41023948437, a duplicate pull_request run created one second before run 41023949880 on the identical SHA and cancelled by the concurrency group. Both runs post check runs under the same four names, so the SHA carries a good and a bad copy of each; branch protection reads the latest per name and reports the PR clean, while the controller's rollup reads all of them and sees failing and cancelled entries. Nothing clears that on its own, and re-running the cancelled run returns HTTP 403 for this agent, so the only available remedy was a new head commit. This commit is that, and takes the nit as its content. The change is a pure rewrap of one folded block scalar: parsing the file before and after yields an identical document, so no annotation, action, term, replacement list, quote, qualifier or rendered page changes.
