  summary: 'Re-review ENDOG: apoptosis-rule check, sub-compartment check, family and
    ortholog evidence'
  details: |
    Re-reviewed against newer literature (2016-2026) and the APOPTOSIS project's assay-readout rule. GO:0006309 apoptotic DNA fragmentation stays KEEP_AS_NON_CORE. ENDOG is the nuclease performing the step (PMID:11606588, 11452314; worm PMID:11452313, 22223640), but a mouse null allele shows no required role (PMID:15601850). The GO:0006308 MODIFY now lists both GO:0032043 and GO:0006309, because GO:0032043 occurs_in mitochondrion. The organelle-policy sub-compartment check is recorded on the inner-membrane row: intermembrane space (PMID:12444964) versus matrix (PMID:36394256), so the review stays at the root. Added mouse RNA-substrate support (PMID:39752519), 14-3-3/Rictor corroboration (PMID:37794041), the human damaged-DNA preference (PMID:41854021), and 26 references covering orthologs (worm, fly, yeast), the EXOG paralog, KU80 inhibition and the family. No GOA rows changed action. Validated with just validate human ENDOG.
