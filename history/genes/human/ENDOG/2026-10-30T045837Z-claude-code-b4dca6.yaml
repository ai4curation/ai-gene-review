  summary: 'Address review round 3 on PR #5618'
  details: |
    Two blocking items, both prose asserting more than the source does; both verified before editing. (1) The PMID:18187503 EndoG construct is bovine, not human: its methods say 'human EXOG, and, for comparison, of bovine EndoG' and Table 1 lists B. taurus for EndoG. The GO:0005743 reason had called this direct evidence for membrane association of ENDOG itself. Reworded to name the bovine ortholog expressed in human cells, with species added as a third stated limit. Action unchanged, since bovine EndoG is not a PAINT donor and the evidence remains independent of the inherited annotations. (2) GO:0004520 and GO:0004521 are not descendants of GO:0003676. Checked against the local GO build: both have GO:0004518 and GO:0003824 as ancestors and neither GO:0003676 nor GO:0005488; only GO:0051880 descends from GO:0003677 and GO:0003676. The reason now frames the two catalytic replacements as a lateral correction, which CLAUDE.md sanctions for a non-descendant MODIFY, with GO:0051880 as the one genuine descendant. Also took the qualifier suggestion: GO:0005743 is inherited as is_active_in while all its support is localization, so a WRONG_QUALIFIER source defect against GO_CENTRAL records located_in as the better fit, at PROBABLE confidence and as a query rather than a correction. Validated with just validate human ENDOG.
