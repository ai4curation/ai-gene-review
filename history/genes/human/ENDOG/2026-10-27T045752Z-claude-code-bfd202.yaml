  summary: 'Wire in OpenScientist H2 (sub-mitochondrial localization): import route
    settled, compartment not'
  details: |
    Ran hypothesis submitochondrial-localization-ims-vs-matrix via OpenScientist (3 iterations). The run saved executed code as provenance and computed sequence features for ENDOG against eight matrix and seven intermembrane-space reference proteins, with EXOG, worm CPS-6 and yeast NUC1 as controls. Verified independently against the local UniProt record that transit peptide 1-48, mature chain 49-297, three cysteines at 84/113/196, presequence 16.7 percent Arg with net charge +5, and absence of twin CX9C/CX3C are all correct. Solid finding is a negative: ENDOG uses the TIM23 presequence route and is not a MIA40 disulfide-relay substrate, excluding the twin-cysteine IMS class. It does not discriminate matrix from presequence-sorted IMS: the classifier reached only 60 percent LOO-CV against a 53 percent baseline and failed on DIABLO and HTRA2, the signature is shared with EXOG, and no external predictor was reachable. The run also did not retrieve the supplied context papers. Added the report as a file: reference with verified quotes and recorded the import-route finding on the inner-membrane sub-compartment check. No action changed and no annotation added; the root mitochondrion decision stands and is better argued. Did not adopt its suggestion to add GO:0042645 mitochondrial nucleoid, which needs a curator reading PMID:36394256.
