  details: |
    Covers two things the previous record did not: the YAML edit made in merge commit 04b1d8e (the PMID:14663139 reference_review and full_text_unavailable flag, corrected after main's full-text cache superseded this branch's abstract-only fetch), and review round 2. Round 2 blocking item: PMID:3286639 was cited in a reason and a supported_by but absent from the references list, so it had no title cross-check and no reference_review while carrying the yeast half of the GO:0005743 donor check; now declared, abstract-only state stated, and its quote extended from a bare prepositional fragment to the clause containing its subject. Four suggestions taken. Figure 3B of PMID:18187503 is immunogold EM whose legend places both tagged proteins at the cristae, which is inner membrane, so the limit the GO:0005743 row conceded about inner-versus-outer is replaced by positive support, with the paper's internal discrepancy recorded (running text describes the EM for EXOG and cites earlier work for EndoG; tagged expressed protein throughout). The GO:0006309 closing clause had discounted PMID:14663139 and then relied on its heterozygote result, which PMID:15601850 names as the suspect datum; replaced with PMID:11606588 and PMID:11452314, which carry the claim independently. GO:0051880 added to the GO:0003676 MODIFY replacement list and that row's stale reason rewritten, since it had argued no binding function was supported. Validated with just validate human ENDOG.
