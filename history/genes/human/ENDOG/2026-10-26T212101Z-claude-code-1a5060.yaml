  summary: 'Wire in OpenScientist H1 (mtDNA breakpoint motif enrichment): negative/qualifying
    result'
  details: |
    Ran hypothesis mtdna-breakpoint-motif-enrichment via OpenScientist (3 iterations, 22 min). The run computed rather than summarised, fetching rCRS, MitoBreak, the PMID:36198798 supplementary NUMT tables and the UCSC NumtS track for a GC-matched permutation test. Deletion breakpoints are enriched at G4/C-rich motifs but only where a direct repeat is present, and not at all in repeat-free deletions, so the signal is collinear with slipped replication. NUMT breakpoints show no enrichment in three datasets, refuting that arm. Verified independently that the reported rCRS composition is correct and that the 9-bp hotspot is the C-rich direct repeat ACCCCCTCTAC at 8271-8281. The run saved only HTML and PDF, no code, so statistics are not replayable; recorded in the reference_review. No GOA action changed and no annotation added. Qualified the core-function sentence about the 9-bp deletion, added the report as a file: reference with verbatim quotes, and added the decisive ENDOG-null breakpoint-mapping experiment. The run's own GO suggestions (GO:0051880) were not adopted, since they should come from the primary assay.
