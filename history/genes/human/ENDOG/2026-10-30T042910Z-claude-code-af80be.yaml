  summary: 'Address review round 1 on PR #5618'
  details: |
    Addressed four blocking items. (1) GO:0005743 inner membrane had no positive support for its own term; ran the organelle-policy donor check, which found both PAINT donors carry GO:0005743 (yeast Nuc1 via PMID:3286639 inner-membrane purification; human EXOG by IDA from PMID:18187503). PMID:18187503 also subfractionated human mitochondria expressing tagged EndoG and found it in membrane fractions while excluding the soluble IMS and matrix, which is direct membrane evidence for ENDOG itself. Row kept KEEP_AS_NON_CORE with that support and with two limits recorded: tagged expressed protein, and co-staining for both inner and outer markers so inner-vs-outer is not resolved. (2) Added GO:0051880 G-quadruplex DNA binding as a NEW IDA row on PMID:36394256; the earlier reason for declining was wrong because that paper was read and already cited for a core function. Caveat recorded that selectivity is shown by IP and imaging, not by measured affinity. (3) Extended the GO:0004521 quote past 'could be cleaved' to the demonstration. (4) Changed root_cause to NO_FAILURE_NON_CORE on the two KEEP_AS_NON_CORE rows. Also took four suggestions: added the nuclear-half quotes to the GO:0006308 MODIFY, cited the run-1 report on the core-function claim derived from it, replaced the run-1 background quote with its result line, trimmed the run-2 quote, and added the PMID:14663139 versus PMID:15601850 reconciliation to the GO:0006309 reason. GO:0042645 stays declined, now for the reviewer's sharper reason. Validated with just validate human ENDOG.
