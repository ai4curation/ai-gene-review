  summary: 'Create review: SEC61G'
  details: |
    Created the full AI gene review for human SEC61G (P60059), reviewing all 29 GOA annotations. Established the endoplasmic reticulum membrane as the sole site of action for this single-pass intracellular subunit, modifying the generic membrane row to ER membrane and marking the Reactome cytosol row over-annotated. Defined one core function: the gamma subunit of the Sec61 protein-conducting channel that clamps SEC61A1 so the complex can act as a ribosome receptor and gated pore, translocating signal-peptide-bearing precursors cotranslationally and post-translationally and inserting the first transmembrane segments of membrane proteins. Accepted translocon complex membership, transmembrane protein transporter activity, ribosome binding and the specific targeting and translocation processes, marked the generic protein transport and targeting parents TOO_GENERAL, kept the phylogenetically inferred Ssh1 translocon complex row as non-core since humans lack that complex, and removed the nine generic protein binding rows under the project policy. Deep research providers were unavailable; evidence came from cached publications and UniProt and is recorded in SEC61G-notes.md.
