    Added NEW GO:0098632 cell-cell adhesion mediator activity (ISO from mouse, PMID:8602532) and set it as the core MF. The knowledge gap is narrowed to the unknown glial counter-receptor, and the MF_DARK label from the original event was dropped. Both endosome rows are now KEEP_AS_NON_CORE, matching the clathrin-coated vesicle row. Wrote term-specific reasons for plasma membrane, external side of plasma membrane and membrane, and for the InterPro neuron-migration IEA. Re-fetched PMID:20573900 with full text and quoted its Results on endosome and clathrin colocalization and C-terminal surface exposure.
