    Rebuilt from a clean stub with affinage deep research. All 11 rows are IBA or IEA derived from mouse Astn1. Accepted neuron migration, neuron cell-cell adhesion (neuron-glia binding), endosome and the membrane rows. Kept clathrin-coated vesicle and perikaryon as non-core. Cited the mouse cloning, knockout and ASTN2-trafficking papers and the 2026 human bi-allelic cohort. Recorded the unknown glial counter-receptor as an MF_DARK knowledge gap.
