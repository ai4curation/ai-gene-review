  details: |
    Reviewed all 121 GOA annotations for TF/serotransferrin (P02787). Core: secreted plasma glycoprotein binding two ferric ions and delivering iron via transferrin receptor binding. Ferric iron binding, iron ion transport, transferrin receptor binding and extracellular region accepted as core; generic iron ion binding modified to ferric; generic endosome modified to early endosome; vesicle marked too general; membrane marked over-annotated (secreted, not membrane-anchored); ferrous iron binding left UNDECIDED (atypical, abstract-only source); numerous transferrin-cycle locations (clathrin pit, endosomes, recycling/perinuclear) and physiological roles kept non-core; protein-binding IPIs removed. Deep research providers unavailable; notes from UniProt and cached literature.
