  summary: 'Follow-up on ARHGAP36: read the decisive GAP result first-hand from Muller
    2020''s supplementary tables, added the MGI molecular_function ND corroboration,
    curated the isoform split, and took the PR review feedback'
  details: |
    Follow-up to 2026-09-19T034350Z-claude-code-16e5d9, which is append-only and whose
    details are superseded on two points recorded here: it says the Muller 2020 result is
    quoted second-hand (it is now first-hand) and that the gene folder holds two committed
    scripts (it holds three).

    1. The decisive GAP result is now read first-hand. PMID:32203420 is not open access --
    Europe PMC returns no PMC id and isOpenAccess N -- so the cached record is abstract-only
    and the review had been quoting it through PMID:33999959. Its supplementary workbook is
    freely downloadable. scan_muller_supplementary.py fetches it and reads Supplementary
    Table 2: ARHGAP36 scores negative for RhoA, Rac1 and Cdc42, with ARHGAP35 (RhoA+, Rac1+)
    and ARHGAP1 (RhoA+, Cdc42+) positive in the same run. Supplementary Table 1 records the
    screened construct as human isoform 2, 517 aa -- ruling out the objection that an
    inactive splice variant was tested -- and gives the authors' own domain call verbatim as
    "GAP-like (arginine finger missing)".

    The caveat is measured, not omitted: 15 of the 65 scorable GAP rows are all-negative
    (23%) and ARHGAP17/RICH1, a characterised Cdc42 GAP, is one of them. Four of the six
    arginine-finger-less PROSITE-RhoGAP proteins present in the screen are all-negative,
    ARHGAP36 included; two of those four (OCRL, INPP5B) are paralogs, so the effective
    independent count is smaller than four of six.

    2. MGI has already recorded the ortholog's molecular function as unknown. Mouse Arhgap36
    (MGI:MGI:1922654, UniProtKB:B1AUC7) carries the same three IBA rows and one IEA row as
    the human gene, plus GO:0003674 molecular_function with evidence ND from GO_REF:0000015,
    whose stated purpose is to record that a curator found no data supporting a more specific
    term. It also carries GO:0007224 smoothened signaling pathway by IMP from PMID:31305241,
    which is the precedent for the MODIFY. Read from QuickGO and api.geneontology.org, which
    agree.

    3. alternative_products (dropped in error by the first pass) restored, and a curated
    functional_isoforms split added: isoform 1 is UniProt's displayed canonical sequence and
    is the one variant reported perinuclear and Gli-inactive, while isoforms 2 to 5 reach the
    plasma membrane and activate Gli. No GO term is declared isoform-specific.

    4. Review feedback on PR #3079 taken across two rounds. Round one, four of five
    suggestions: the notes decision table corrected (it had recorded a GO:0005813 centrosome
    NEW that the review declines), the GO:0045880 framing made explicit, a duplicative
    proposed_replacement_terms dropped from the REMOVE row, and the overexpression caveat
    moved onto the GO:0005886 row. The fifth, a whitespace-only publications diff, was
    reverted only after confirming validation still passed against the restored file.

    Round two, both blocking items: the two Muller findings had been attached to the
    file: reference for RESULTS.md, which does not contain them -- they are now on the
    PMID:32203420 reference, where they belong, as statement-only entries since the cache is
    abstract-only. And this record itself is the second item.

    One reviewer premise did not hold and the correction is recorded rather than silently
    worked around: the review asked for "a new record with an UPDATE event", but
    HistoryEventTypeEnum has no UPDATE (GENERAL, CREATE, EDIT, REVIEW, AUDIT), and the
    AKAP12 precedent the review cited uses EDIT four times after one CREATE. The mechanism
    was right and is followed; the event name is EDIT.

    Also fixed in the scan script: ARHGAP17 had been listed as a positive control when it is
    the screen's all-negative false-negative exemplar. It is now a named FALSE_NEGATIVE_EXEMPLAR
    with a guard that fails the run if it ever stops being all-negative, since the report
    prints a caveat that asserts exactly that.

    Verification at the time of this record: just validate human ARHGAP36 green; all three
    self-tests green at their documented counts (analyze_arhgap36 16, check_review 10,
    scan_muller 10); analyze_arhgap36.py re-run from a cleared cache reproduced results.json
    and RESULTS.md byte-identically.
