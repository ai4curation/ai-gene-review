  summary: 'Reviewed ARHGAP36: removed the IBA GTPase activator activity, whose catalytic
    arginine finger is substituted in both human and mouse, and proposed the PKA inhibitor
    activity the gene actually has'
  details: |
    ARHGAP36 (Q6ZRI8) had four GO annotations and no experimental one. Three were IBA
    from a single IBD on PANTHER node PTN000973894 at taxon:6072 (Eumetazoa), seeded by
    mouse Arhgap6 (MGI:MGI:1196332) in subfamily PTHR12635:SF6; ARHGAP36 is in SF8. The
    fourth was IEA from InterPro IPR000198.

    Actions: 1 REMOVE, 2 MARK_AS_OVER_ANNOTATED, 1 MODIFY, 2 NEW. The tally is produced
    by genes/human/ARHGAP36/ARHGAP36-bioinformatics/check_review.py rather than counted
    by hand.

    GO:0005096 GTPase activator activity -> REMOVE. The argument is about node placement,
    not donor count. Three controls carrying their own annotated arginine finger (human
    ARHGAP1 R282, mouse Arhgap6 R435, human ARHGAP6 R433) all project onto ARHGAP36
    position 258, which holds threonine, and each recovers every other control's finger;
    the nearest arginine is 7 residues away. Mouse Arhgap36 (B1AUC7, same subfamily SF8)
    carries threonine at its own annotated Site 246, and human 258 and mouse 246 project
    onto each other reciprocally, dating the loss to before the rodent-primate split and
    therefore inside the clade the Eumetazoan node propagates into. Three published
    numberings for this residue (UniProt T258, Thr227 in PMID:33999959, T246 in
    PMID:25024229) all fall out of the splice-variant arithmetic independently.

    The residue argument is stated as insufficient on its own, because the sibling
    ARHGAP11B review (PR #3073) measured the converse: a retained arginine finger in an
    experimentally GAP-dead protein. The functional evidence is what closes it -- a
    systematic RhoGEF/RhoGAP screen reporting no effect on RAC1, CDC42 or RHOA
    (PMID:32203420, quoted through PMID:33999959, whose reference [25] was resolved
    against the PLOS bibliography rather than inferred), plus PMID:25024229,
    PMID:27481945 and PMID:40378841.

    REMOVE is scoped to catalysis. UniProt records an experimental RAC1 interaction via
    the Rho-GAP domain (PubMed:35986704); OCRL is the precedent for binding a GTP-loaded
    RHO protein without stimulating hydrolysis, and the 1TX4 GAP:GTPase interface
    projects onto ARHGAP36 at 8/25 identical positions against 9/25 for mouse Arhgap6.
    The two actin rows are MARK_AS_OVER_ANNOTATED rather than REMOVE because
    PMID:41644816 does connect ARHGAP36 to actomyosin, through the wrong domain, in the
    activating direction and indirectly -- unsupported as propagated, not contradicted.

    GO:0007165 -> MODIFY to GO:0045880, with the PMID:30598432 step-level exception
    (centrosomal ARHGAP36 restrains Smoothened ciliary translocation) recorded in the
    reason rather than omitted. NEW: GO:0004862 cAMP-dependent protein kinase inhibitor
    activity (IDA, PMID:27713425, human Q6ZRI8-2, in vitro kinase assay on recombinant
    PKAC against PKI in the same assay) and GO:0005886 plasma membrane.

    GO has no Hedgehog pathway term that is not anchored on Smoothened, and GO:0007228
    and GO:1990787 are obsolete. That negative is load-bearing for the MODIFY and was
    checked on OLS4, QuickGO and the GO API.

    Two committed scripts with self-tests, both run and passing at the time of this
    record: analyze_arhgap36.py (16 assertions, including two negative controls that
    must stay silent) and check_review.py (10 assertions; re-resolves all four residue
    claims against UniProt and guards the folded-scalar reflow trap). Each caught a real
    bug, both documented in the directory README: PDB numbering is not UniProt numbering
    in 1TX4, and the reflow guard's first implementation flagged 43 lines on a clean file
    because a nested `supporting_text: >-` opener itself ends in a hyphen.

    Deep research: affinage, no blocking gate, soft gate tripped (pairwise = tie). It
    missed both papers that settle the GAP question, the only functional reference in the
    UniProt entry, and the published versions of two preprints it cited without PMIDs.
