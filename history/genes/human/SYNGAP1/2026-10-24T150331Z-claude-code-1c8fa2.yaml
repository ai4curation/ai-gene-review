  summary: Restrict PDZ-ligand claim to the SynGAP-alpha1 isoform
  details: |
    The description and the GO:0014069 review reason attributed a C-terminal PDZ-binding motif to SynGAP as a whole. Only the alpha1 C-terminal splice form carries the class I PDZ ligand (-QTRV); alpha2, beta and gamma lack it (PMID:32579114, cached, full text). None of the four Swiss-Prot isoforms of Q96PV0 ends in QTRV (checked against the live entry, version 197). The alpha1 C-terminus exists in human as RefSeq NP_001123538.1 (1292 aa, ends PWVQQTRV), cross-referenced by Q96PV0 without an isoform assignment, and as unreviewed UniProtKB B7ZCA0 and A0A2R8Y6T2. Reworded both statements, added PMID:32579114 with two verbatim findings, and added a functional_isoforms entry SYNGAP1_ALPHA1 with maps_to left empty because no Swiss-Prot isoform corresponds. No actions or terms changed. The case is also recorded in projects/ISOFORMS.md.
