  summary: Review CPS1 chemistry, contextual functions and evidence limits
  details: |
    Reassessed all 81 historical/current CPS1 annotation objects (79 active, two retired source forms), retaining 78 exact historical source objects, 49 omitted WITH/FROM lists, 30 reference identities/findings, three products and the exact historical notes prefix. The review assigns 23 ACCEPT, 34 KEEP_AS_NON_CORE, 12 MODIFY and 12 UNDECIDED, with no NEW annotations. The single ammonia-dependent catalytic core retains its original substrates.

    Source-specific assessments distinguish actual PAINT ancestry from human chemistry, binding classes from partner activities, measured expression responses from proposed mechanisms, and original cancer-metabolism evidence from its operative Nature correction. Independent chemistry, PAINT, secondary-activity and whole-review assessments informed the final decisions. Official product reconstructions, literal interaction rows, donor joins and original proteomic cells are reproducible; incomplete older source access remains explicit.

    Preserved genuine existing provider and selected source caches. Genuine fetched GOA/UniProt outputs and newly obtained source caches are accompanied by an evidence index, compact original-table excerpts, appended notes and rendered review. Current-main and complete open-PR qualification protects the shared PAINT cache; an off-human-path IRD in another PR is assessed separately. Three identical existing publication caches are protected no-ops. Ordinary validation, derived-status checking, rendering and history validation are required before publication.
