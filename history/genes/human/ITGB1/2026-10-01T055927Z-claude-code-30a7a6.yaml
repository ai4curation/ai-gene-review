  summary: 'Create review: ITGB1'
  details: |
    Track B (Origins of multicellularity) review of human ITGB1. All 349 GOA rows reviewed: 160 ACCEPT, 95 KEEP_AS_NON_CORE, 26 MODIFY, 52 REMOVE, 14 MARK_AS_OVER_ANNOTATED, 2 UNDECIDED, no NEW. Generic protein binding rows were replaced by talin, filamin, fibronectin, extracellular matrix, C-X3-C chemokine, small GTPase, tyrosine kinase, protease binding, virus receptor or signaling receptor terms where the paper supported them, and otherwise removed; PMID:10676904 flagged as a wrong identifier. Homophilic cell-cell adhesion and cellular defense response (TAS, PMID:10201960) removed. Core functions: cell adhesion receptor activity in cell-matrix adhesion, fibronectin binding (alpha5beta1), talin binding by the cytoplasmic tail. Premetazoan context from PMID:20479219 and PMID:32857975: integrin beta with conserved cation sites and NPxY motif is present in Capsaspora and used for filopodial substrate adhesion, and was lost in choanoflagellates.
