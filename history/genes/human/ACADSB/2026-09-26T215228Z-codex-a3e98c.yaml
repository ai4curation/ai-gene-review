  summary: Complete ACADSB substrate-scope and source-evidence review
  details: |
    Completed a substantive review of all 28 existing ACADSB assertions, five cited cached publications, propagated sources, reference scope and core synthesis. Preserved every seeded assertion field, both alternative-product records, and machine-owned GOA/UniProt/publication caches. Final actions: 24 ACCEPT and four KEEP_AS_NON_CORE; no NOT or NEW annotations. Added 13 propagation reviews with traced sources and explicit unresolved ARBA predicates. Restored broad core catalytic/process/location annotations; retained measured C6 activity as non-core because the live medium-chain term includes C6; corrected the incorrect assumption that the short-chain term is limited to straight-chain substrates. Distinguished positive recombinant substrate reports from the COS-7 butyryl-null assay, and bounded fatty-acid physiological claims. Consolidated three overlapping core entries into one FAD-dependent matrix isoleucine-catabolic enzyme mechanism.

    Checked source access individually: cached 11013134 contains download boilerplate rather than partial paper text, whereas PubMed provides relevant figure captions and some PMC methods were accessible. Cached 21430231 lacks methods/results/tables; used available text and primary figure captions. Retained HTP and broad Reactome matrix annotations with curator deference and independent support, without inventing supplementary measurements or ACADSB-specific LONP1 assays. Falcon with 1200-second timeout and automatic perplexity-lite fallback both failed at PyPI client bootstrap DNS, before either backend was reached. No provider report was fabricated. Concurrent publication fetch found all five papers already cached. Additional supported retrieval of 11013134 and 12855692 failed DNS and changed no cache.

    Validation: just validate human ACADSB passed with no warnings. just render human ACADSB passed; parsed rendered content contains the revised medium-chain, COS-7 and cofactor statements. Parsed comparison confirmed all 28 source assertions and alternative products unchanged; GOA and UniProt bytes are unchanged. just validate-history passed. Independent read-only reviewer annotation_aars2 examined all 28 actions, the core, all reference reviews and notes, checked primary 2011 figure captions and human 2JIF structural evidence, and reported no blocking concern or requested edits. No Git or remote publication writes were performed by this author.
