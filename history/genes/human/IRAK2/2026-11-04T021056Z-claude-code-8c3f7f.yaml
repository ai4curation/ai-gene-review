  details: |
    Reviewed all 81 GOA rows: 24 ACCEPT, 32 KEEP_AS_NON_CORE (plasma membrane and endosome Reactome rows, ATP binding, nucleus, dimerization IPIs, MAPK regulation), 15 REMOVE (14 bare protein binding; NLRP3 inflammasome assembly NAS contradicted by PMID:36865541), 8 MODIFY (IRAK4 binding to death domain binding; Toll signaling to MyD88-dependent TLR pathway; general signalling/adaptor terms to specific ones), 1 MARK_AS_OVER_ANNOTATED (protein phosphorylation TAS: negligible human autophosphorylation, Asn335 in place of catalytic Asp), 1 UNDECIDED (negative regulation of NF-kappaB IMP, abstract-only). Core function: signaling adaptor activity in IL-1 and MyD88-dependent TLR signalling to NF-kappaB, cytosol, Myddosome. No kinase activity proposed. Literature search recorded in IRAK2-notes.md.
