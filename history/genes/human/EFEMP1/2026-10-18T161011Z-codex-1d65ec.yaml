  summary: Review EFEMP1 function and source-specific annotations
  details: |
    Review 79 imported human EFEMP1 assertions while preserving every source dictionary and all five official product identities. Record 21 ACCEPT, 29 MODIFY, 22 KEEP_AS_NON_CORE, three UNDECIDED, one MARK_AS_OVER_ANNOTATED and three REMOVE decisions, with no NEW assertions or quotations.

    Refine receptor activity to EGFR binding and distinguish receptor-mediated phosphorylation from EFEMP1 catalysis. Retain contextual carcinoma signaling and chondrogenesis observations. Identify the verified FBN1/FBN2/FBN3 citation mismatch underlying three eye-expression annotations. Assess each positive interaction using its actual partner class and construct features, preserving supported generic binding under the project exception. Record unresolved visual-perception, exosome-target and basement-membrane evidence.

    Add two qualified core functions: extracellular matrix structural contribution and EGFR binding in the measured carcinoma context. Document exact natural-product differences without experimental-equivalence claims. Add source-specific reference/access assessments, biological notes, a source guide and a reproducible extract of interaction records, proteomic target tables and the PAINT lineage. Preserve all pre-existing source caches and publish six unedited missing normal publication caches plus the normal GOA/UniProt snapshots. No source retirement or canonical family/cache replacement is made.

    Owner verification used saved-input source equality, checksums, reference identity, local-link checks, whitespace checks and a raw-input reproduction. Canonical normal and term-aware validation, computed status, rendering and history validation passed. The 18 generic-binding advisories match the explicit ClinGen project policy. All 333 protected source/runtime paths and eight unrelated files were preserved.
