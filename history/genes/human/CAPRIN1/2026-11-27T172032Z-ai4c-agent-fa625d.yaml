  summary: 'Address the CHANGES_REQUESTED review on the human CAPRIN1 review (PR #6731)'
  details: |
    Answered the CHANGES_REQUESTED review on PR #6731 (ai4c-reviewer, 2026-11-23): the one
    blocking item plus all six non-blocking suggestions.

    Blocking item - CAPRIN1-notes.md contradicted the shipped decision on the IBA GO:0003723
    row, saying it "stays ACCEPT" while the YAML had it as MODIFY to GO:0003729. Resolved by
    keeping MODIFY and rewriting the notes paragraph (the reviewer's option 2). The stated
    basis is now the row's own evidence rather than the node placement: for an IBA the
    evidence is the set of descendant experiments the PAINT curator used to place the IBD,
    which is what the WITH/FROM lists, and here those are mRNA-specific (human CAPRIN1's own
    IDA for MYC and CCND2 mRNA in PMID:17210633 and the rat IDA in PMID:20516077), with the
    curated record stating that caprin-1 binds its target mRNAs but not rRNA. The paragraph
    also now says explicitly that the MODIFY is not a request to move the IBD, since
    GO:0003723 remains the right node-level statement at PANTHER:PTN001116222. All four
    GO:0003723 rows therefore carry the same action.

    Suggestions acted on:
    - GO:0043232 intracellular membraneless organelle (IDA, PMID:31439799): TOO_GENERAL ->
      MODIFY to GO:0036464 cytoplasmic ribonucleoprotein granule. The row's own reference is
      one of the two UniProt cites for the curated location "Cytoplasm, Cytoplasmic
      ribonucleoprotein granule" with ECO:0000269, so the row's own evidence reaches the
      descendant, which is the MODIFY case under the 2026-11-14 ruling rather than the
      TOO_GENERAL one. No TOO_GENERAL rows remain in the review.
    - GO:0106288 regulation of deadenylation-dependent decapping of nuclear-transcribed mRNA
      (IDA, PMID:31439799): ACCEPT -> MODIFY to GO:0060213 positive regulation of
      nuclear-transcribed mRNA poly(A) tail shortening. The term names the decapping step,
      while every piece of evidence on the row is poly(A) shortening via CNOT7 recruitment;
      decapping is downstream and is not assayed by the paper or the curated record, so an
      effect there would be indirect. GO:0060213 carries "positive regulation of mRNA
      deadenylation" as a synonym, so it names the assayed step and keeps the direction. A
      lateral correction within the pathway, not a generalisation; it disagrees with the
      UniProt curator's term choice, not with the annotation's substance.
    - GO:0140677 molecular function activator activity: the comment the MODIFY rests on was
      confirmed verbatim against the live ontology through OLS ("This term should only be
      used in cases when the regulator directly interacts with the enzyme, but does not
      result in a covalent modification.") and is now quoted exactly in the reason and in the
      notes. Unchanged from the paraphrase, so the MODIFY stands.
    - core_functions: the adaptor activity now lands in the synthesis. GO:0060090 molecular
      adaptor activity is a fourth core function, with GO:0060213 as its process and the
      cytoplasmic ribonucleoprotein granule as its location, instead of being described only
      in the prose of the condensate-scaffold core function. GO:0106288 was dropped from the
      scaffold core function's directly_involved_in to match the row's MODIFY. This also
      removes the case where two core functions shared GO:0140693 and one carried the
      mRNA-fate process.
    - GO:0005524 ATP binding x2: action unchanged (KEEP_AS_NON_CORE), but the reason now
      argues the alternative explicitly. The relevance of the ATP association is established
      rather than unknown - UniProt curates it as an activity-regulation statement and the
      enhancement/inhibition switch sits in the millimolar range of cellular ATP - which is
      the KEEP_AS_NON_CORE tier rather than the MARK_AS_OVER_ANNOTATED one. What would be
      over-annotation is reading the term as a nucleotide-binding active site, which the row
      says it is not.
    - GO:0030425 dendrite: reason reworded. UniProt's "Cell projection, dendrite" statement
      carries human experimental evidence (ECO:0000269|PubMed:35979925), so the earlier
      "inherited from the rodent RNA-granule literature" described the IEA row's provenance
      but misdescribed the curated record. Action unchanged.

    Action tally after the changes: 28 ACCEPT, 11 KEEP_AS_NON_CORE, 15 REMOVE, 8 MODIFY,
