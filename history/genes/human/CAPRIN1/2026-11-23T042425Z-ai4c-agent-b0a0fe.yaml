  summary: Create human CAPRIN1 gene review for the stress granule project
  details: |
    First review of human CAPRIN1 (Q14444), one of the nine unreviewed candidates in
    projects/STRESS_GRANULES.md. Created the gene folder with `just fetch-gene human CAPRIN1`
    and reviewed all 62 seeded GOA rows, plus one proposed NEW row.

    Provider deep research could not be generated in this environment: the perplexity
    provider is unavailable and the claude_code provider needs `agentapi`, which is not on
    PATH. The literature synthesis is therefore in CAPRIN1-notes.md, not in a
    `-deep-research-<provider>.md` file.

    Actions across the 63 rows: 29 ACCEPT, 11 KEEP_AS_NON_CORE, 15 REMOVE (14 bare
    GO:0005515 rows per the protein-binding policy, plus GO:0016020 membrane), 6 MODIFY,
    1 TOO_GENERAL, 1 NEW.

    Decisions worth recording:
    - GO:0016020 membrane (HDA, PMID:19946888) REMOVEd. CAPRIN1 has no transmembrane
      segment, signal peptide or lipid anchor, and UniProt carries an explicit caution that
      the protein "Was originally thought to be a GPI-anchored membrane protein" - the
      source of its obsolete names GPI-anchored protein p137 and M11S1. A hit in a crude
      NK-cell membrane fraction revives exactly that refuted claim.
    - GO:0035591 signaling adaptor activity MODIFYed to GO:0060090 molecular adaptor
      activity. The adaptor claim (CAPRIN1 brings CNOT7 deadenylase to condensed mRNA) is
      right; GO:0035591's definition restricts it to signaling pathways, and deadenylase
      recruitment inside an mRNP condensate is RNA processing. Recorded explicitly because
      the same term types the CAPRIN1 and FMR1 nodes of production GO-CAM
      gomodel:63894f2500001378, so this argues with a modelling decision rather than
      filling a gap.
    - GO:0140677 molecular function activator activity MODIFYed to GO:0140693. The term's
      own comment restricts it to direct activation of an enzyme; CAPRIN1's target is
      G3BP1's condensation propensity, not an enzyme.
    - The four GO:0003723 RNA binding rows MODIFYed to GO:0003729 mRNA binding. Both HDA
      rows are oligo(dT) poly(A)+ interactome captures, the rat ISS traces to an IDA showing
      mRNA binding, and the IBA row carries a propagation_review recording that the node
      placement at PANTHER:PTN001116222 is sound and only the granularity is refined for
      this gene - not a request to move the IBD.
    - GO:0043232 intracellular membraneless organelle marked TOO_GENERAL: GO:0010494 and
      GO:0036464 are both asserted and both entail it.
    - NEW GO:0008298 intracellular mRNA localization (ISS from mouse Q60865). Mouse Caprin1
      carries it by IMP from PMID:20861386, and the same mouse gene is already the source of
      this review's GO:0050775 and GO:0061003 rows. Comparator check run by term id (not by
      filtering term names, which returns a false empty): the human GO:0008298 cohort is
      non-empty (20 annotations) and includes STAU1, STAU2, PUM2, QKI and ZNF385A, i.e. RBPs
      in the same cargo-carrying role.

    `just validate human CAPRIN1` is clean with no warnings (status COMPLETE);
    `just validate-quotes` passes repo-wide. Record sections on the UniProt quotes were
    filled by `just backfill-record-sections`.
