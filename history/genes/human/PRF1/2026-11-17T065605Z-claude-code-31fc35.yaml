  summary: 'Review round 1: address PR review on the PRF1 review'
  details: |
    Addresses the ai4c-reviewer CHANGES_REQUESTED review on PR 6385 (items 1-3 blocking, 4-8 suggestions).

    GO:0016020 membrane, four rows (HDA PMID:19946888, IBA, IDA PMID:20889983, IEA): MODIFY -> GO:0005886 changed to TOO_GENERAL, proposed_replacement_terms dropped. Two of the four reasons conceded that the row's own assay could not resolve a sub-compartment, which is incompatible with MODIFY, and the same file already treats the structurally identical GO:0031410 cytoplasmic vesicle as TOO_GENERAL. The specific locations stay where they are supported: the four accepted GO:0005886 rows and the proposed GO:0010008 endosome membrane. Note that CLAUDE.md's canonical MODIFY example is 'membrane vs plasma membrane', so this is not the rule-following case the review described; the change rests on TOO_GENERAL's own definition (true, but entailed by a more specific term asserted elsewhere in the review) and on consistency within the file.

    GO:0001771 immunological synapse formation, both REMOVE rows: dropped the clause 'and conjugate with targets'. Neither cited quote reports conjugate formation, no cached publication for this gene does, and the review's own suggested_experiments entry says no such measurement is published. The REMOVE stands on the participation argument and the term definition. The same clause is corrected in PRF1-notes.md; the CREATE record of 2026-11-14 also contains it and is left intact as the append-only record of that session.

    GO:0001909 leukocyte mediated cytotoxicity: dropped the clause saying the parent is needed for 'lineages that have no child term of their own', which contradicted the GO:0006915 MODIFY reasoning elsewhere in the same file (NKT cells are T cells, so GO:0001913 covers them). The lineage-independence argument for keeping the parent is unaffected.

    GO:0009306 protein secretion, both MODIFY rows: added the UniProt CC:FUNCTION quote that the re-levelling actually turns on ('Perforin pores allow the release of mature caspase-7 (CASP7) into the extracellular milieu') to supported_by, record_section filled by just backfill-record-sections. The reason now records that this statement is carried By similarity from mouse P10820 (ECO:0000250), not by ECO:0000269 as the review stated, so nobody reads it as experimental support on the human protein.

    GO:0005886 plasma membrane, the two located_in rows: reworded the shared sentence that described them as is_active_in rows.

    Declined: swapping the GO:0042267 NEW row's original_reference_id from PMID:11179007 to PMID:10583959. PMID:10583959's abstract says only 'defective cytotoxic activity' and never names NK cells, so it cannot carry an NK-specific term as the primary reference; PMID:11179007 states the NK defect explicitly. It is already in supported_by, and the row already records the caveat about its primary reference's sentence being framing.

    Validation: just validate human PRF1 clean; 127 quotes verified, 0 failures.

    Correction, same round. The paragraph above says CLAUDE.md's canonical MODIFY example is 'membrane vs plasma membrane', so the change was not the rule-following case the review described. That was asserted after searching CLAUDE.md alone, and it is wrong twice over. docs/action_consistency.md:192, committed on this same branch, gives 'membrane beside an accepted endoplasmic reticulum membrane' as the canonical TOO_GENERAL example. And main carries a 2026-11-14 maintainer ruling, absent from this branch's base and merged in later in this round, which states the rule directly: MODIFY needs this row's own evidence for the deeper term, and TOO_GENERAL is for terms that are imprecise on their own, 'such as membrane (which membrane?)'. The reviewer was therefore quoting a real ruling, from main rather than from this branch, and the four rows land exactly where it puts them. The original claim is left standing above as the record of what was asserted; this is the correction to it. The same error was corrected in the PR thread.

    Also in this round: GO:0001909 leukocyte mediated cytotoxicity stays ACCEPT, with the reason now citing the same ruling's carve-out for respectably specific terms, since dropping the NKT clause had made the TOO_GENERAL reading a closer call. origin/main was merged into the branch, where CLAUDE.md merged cleanly and keeps both of main's maintainer rulings alongside this branch's comparator-check paragraph. Everything was re-validated after the merge against main's newer checks, including the new ec_class_conflict validator that the two protease reviews pass: all five gene reviews clean, both GO-CAM reviews clean, 566 quotes verified with 0 failures.
