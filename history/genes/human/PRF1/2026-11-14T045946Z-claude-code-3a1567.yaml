  summary: 'Create: human PRF1 (perforin-1) review'
  details: |
    First review of human PRF1 (UniProtKB:P14222). All 64 GOA annotations reviewed, plus two proposed NEW rows.

    Deep research unavailable: just deep-research-falcon human PRF1 --fallback perplexity-lite failed for both providers in this environment (neither falcon nor perplexity is registered; only openscientist and claude_code were available). No -deep-research-*.md file was written. Research was done by hand from the cached publications, the UniProt record and QuickGO, and recorded in PRF1-notes.md with inline provenance.

    Core functions: GO:0022829 wide pore channel activity (primary), GO:0005509 calcium ion binding (the C2-domain switch), GO:0042802 identical protein binding (oligomerisation is the act of building the pore).

    Removed (2 rows): GO:0001771 immunological synapse formation, IBA and IDA. Perforin is cargo released into a synapse built by TCR/adhesion-molecule clustering, which is the mechanism the term's own definition names; perforin-null lymphocytes conjugate with targets and fail at lysis, not at synapse assembly. The IDA traces to a Syntaxin-7 study in which perforin antibody is the lytic-granule marker. The underlying localisation observation is kept as the CC term GO:0001772.

    Proposed NEW (2 rows): GO:0042267 natural killer cell mediated cytotoxicity (comparator check: GZMB carries it by IDA and IMP, and ARL8B/KIF5B/PLEKHM2, which only traffic the granules, carry it by IMP; mouse Prf1 lacks it too, so that record likely wants the same addition). GO:0010008 endosome membrane is_active_in, from the direct demonstration that perforin forms pores in the gigantosome membrane.

    Re-levelled: GO:0009306 protein secretion and GO:0016020 membrane to GO:0071806 and GO:0005886; GO:0006915 apoptotic process to GO:0140507; GO:0006968 cellular defense response to GO:0001913.

    Term choice checked and deliberately NOT changed: GO:0022829 vs GO:0140911. From the definitions alone GO:0140911 pore-forming activity looks the better fit and a MODIFY was drafted. The comparator check reversed it: GO:0022829 carries perforin's whole complement family (C6, C7, C8A, C8B, C8G, C9) plus MPEG1, GSDMD and GSDME, nearly all by IDA, while GO:0140911's human annotations are DEFA1-6 plus two IEA rows. Moving perforin would have made it the only member of its family on a different term. Both are kept; the mismatch is an ontology problem raised as a question.

    Reference problems flagged: PMID:21438968 MISCITED for GO:0001771; PMID:9756476 a poor reference for GO:0140507 (it is a granulysin antimicrobial paper), recorded as a re-referencing suggestion rather than an error since the full text is not cached; PMID:11911826 DISPUTED (pore-independent granzyme delivery, correctly cited but contested).
