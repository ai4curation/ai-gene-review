  summary: De-novo review of all 122 GOA annotations for SLC22A1 (OCT1), hepatic polyspecific
    organic cation transporter
  details: |
    Reviewed every GOA row for SLC22A1 (O15245, OCT1). Electrogenic, Na+-independent, membrane-potential-driven bidirectional (facilitated) UNIPORTER of polyspecific organic cations; hepatic sinusoidal. Signature substrate metformin (hepatic uptake -> glucose-lowering). Core MF (all live, QuickGO-verified non-obsolete; the grouping term GO:0015101 organic cation transmembrane transporter activity is OBSOLETE as an unnecessary grouping term, so substrate-specific terms carry the function): GO:0008504 monoamine transmembrane transporter activity + GO:0015651 quaternary ammonium group transmembrane transporter activity (TEA/MPP+/NMN) + GO:0015234 thiamine transmembrane transporter activity. Mechanism = facilitated uniporter (NOT symporter). Actions (122): 47 ACCEPT, 32 KEEP_AS_NON_CORE, 27 TOO_GENERAL (GO:0022857/GO:0055085/GO:0016020 roots), 10 REMOVE (bare GO:0005515 x3; GO:0005330 dopamine:Na+ & GO:0005334 norepinephrine:Na+ symporter = wrong Na+-dependent mechanism; GO:1901235/GO:1902270 (R)-carnitine = UniProt CAUTION human OCT1 does not transport carnitine; GO:0072530 obsolete purine-compound x2; GO:0098793 presynapse over-propagation), 4 MARK_AS_OVER_ANNOTATED (xenobiotic metabolic process - transports not metabolizes; electrochemical-gradient establishment - driven by not establishing; metanephric tubule development - expression not participation; organic hydroxy compound transport vague IEA), 2 UNDECIDED (GO:0051620 norepinephrine uptake - genuine IDA-vs-CAUTION conflict). proposed_new_terms: none (the organic-cation grouping NTR was dropped in the review-response/harmonization; the GO:0015101-obsoletion gap is flagged as a suggested_question). source_defects: none. Batch 13 (SLC22 OCT/OAT family).
