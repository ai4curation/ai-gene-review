  summary: 'Re-review of over-annotated IBA: light intermediate chain binding removed'
  details: |
    Re-judged the GO:0051959 dynein light intermediate chain binding IBA (PTN000743491, PTHR10676) against the PAINT tree. The IBD is at the family root and its three seeds are cytoplasmic dynein 1 heavy chains in clade PTN000072732; DNAH10 is in a separate child clade, PTN002241869, with no seed. The review already cited evidence that the I1/f arm has no light intermediate chain and that DNAH10 is unaffected by DNALI1 loss, which is the same misplaced-IBD ground on which the outer arm heavy chains (DNAH5, DNAH8, DNAH9, DNAH11, DNAH17) are REMOVE. The IBA row and the InterPro IEA row on the same term were changed from MARK_AS_OVER_ANNOTATED to REMOVE, and the IBA reason now states the tree. Suggested PAINT fix: move the IBD to PTN000072732. Validated with just validate human DNAH10.
