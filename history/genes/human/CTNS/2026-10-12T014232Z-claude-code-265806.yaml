  summary: 'Review round 3: drop the duplicate GO:1904919 NEW row'
  details: |
    Review round 3 for PR 4816. GO:1904919 L-cystine transmembrane transport from lysosomal lumen to cytosol was asserted four times: as the proposed_replacement_terms target on three MODIFY rows (GO:0006520 NAS, GO:0034486 IBA, GO:0034486 IDA) and again as a standalone action: NEW row. The NEW row was a literal duplicate of what applying the IDA MODIFY produces - same evidence_type IDA, same original_reference_id PMID:11689434, same two supporting_text quotes - so it added no coverage, and its own reason ('existing annotations use only the general L-cystine transport and vacuolar transmembrane transport terms') was the justification for those MODIFYs rather than for a new assertion. CLAUDE.md's NEW checklist rejects a term that duplicates one already being proposed; validation could not catch this because GO:1904919 is genuinely absent from CTNS-goa.tsv, so the GOA duplicate-NEW check passes. The NEW row is removed and the three MODIFYs, which already deliver the term, are unchanged. The six ACCEPTed GO:0015811 rows are left alone: keeping an accurate generic parent alongside a specific child is a separate question.
