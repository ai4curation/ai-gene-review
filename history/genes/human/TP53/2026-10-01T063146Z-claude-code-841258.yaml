  summary: Add premetazoan-origin assessment
  details: |
    Additive ORIGINS_OF_MULTICELLULARITY Track B pass. p53-family genes predate animals: choanoflagellates (PMID:18273011, PMID:17924139) and Capsaspora, ichthyosporeans and Corallochytrium (PMID:31861340) have homologs with a conserved DNA-binding domain but no transactivation domain, and none has been studied experimentally. In the sea anemone, the p63-like nvp63 mediates DNA damage-induced germ cell death (PMID:17848985). Fly and nematode p53 proteins act mainly in germ cells (PMID:20081368). Vertebrate TP53 arose by duplication of a p63/p73-like ancestor (PMID:20516129). Added two sentences to the description, six references with reference_review, and two suggested questions, and created TP53-notes.md. Track C: the PTN000893833 IBAs (including GO:0042981 regulation of apoptotic process) reach two Monosiga proteins; a TreeGrafter IEA from PTN000154790 reaches Capsaspora, with DNA-binding and transcription terms only. No animal tissue or development terms reach unicellular organisms. No review actions changed.
