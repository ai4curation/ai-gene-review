  summary: 'Create review: GEMIN7 (reference relative for HORSE/EQUAS GEMIN7)'
  details: |
    De-novo review of human GEMIN7 (Q9H840), the experimentally characterised PTHR14679:SF1 ortholog and PAINT donor (PTN001027441) for horse GEMIN7, written independently of ProtNLM2 predictions. Falcon deep research failed (Edison 403 auth; perplexity-lite fallback also failed), recorded in notes; review based on cached primary literature and UniProt. All 48 GOA rows reviewed: SMN complex, SMN-Sm protein complex, cytosol and spliceosomal snRNP assembly accepted; GEMIN6 protein-binding rows modified to protein heterodimerization activity (Gemin6-Gemin7 Sm-fold heterodimer crystal structure), other bare protein-binding rows removed as uninformative; cytoplasm->cytosol and nuclear body->Gemini of Cajal bodies; Sm-like protein family complex IBA marked TOO_GENERAL (PAINT node choice judged deliberate given the reduced fission yeast complex); mRNA splicing TAS and Sm-domain RNA binding IEA marked over-annotated. Notes distinguish human-experimental from IBA-sanctioned claims for transfer.
