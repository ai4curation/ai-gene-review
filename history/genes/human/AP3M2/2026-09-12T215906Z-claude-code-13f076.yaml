  summary: 'Create review: AP3M2'
  details: |
    De-novo review of human AP3M2 (P53677, mu3B-adaptin), the medium subunit of the neuronal AP-3B adaptor complex. All 26 GOA rows reviewed plus 1 NEW; the gene has no experimental annotation of any kind, so the work is a propagation audit. Actions: 9 ACCEPT, 9 KEEP_AS_NON_CORE, 7 MODIFY, 1 MARK_AS_OVER_ANNOTATED, 1 NEW (GO:0061534, ISS from the mouse mu3B knockout). All four IBAs come from PANTHER PTHR10529, whose slice was fetched and committed: PTN002237676 (AP-3 mu clade, seeded by yeast APM3 and Dictyostelium apm3) is sound and accepted as NO_FAILURE_CORE, while the other three arrive from the family-root node PTN000055849 and leak across subfamily boundaries - GO:0035615 clathrin-cargo adaptor activity is seeded only by AP-1 and AP-2 mu donors (TERM_SCOPING_PROBLEM, modified to GO:0140312), GO:0005802 trans-Golgi network only by AP-1 and AP-4 mu (PROPAGATION_BAD, modified to GO:0005769), and GO:0006896 Golgi to vacuole transport describes the fungal ALP route (PROPAGATION_BAD, modified to GO:0008333). Three further propagation defects: the InterPro2GO GO:0030131 clathrin adaptor complex mapping is wrong-branch since GO:0030123 is not a descendant of it; ARBA00026971 confers GO:0005737 through 2,388 condition sets of which none can fire on this protein; and four rows (GO:0008089 and GO:0048490, IEA plus ISS each) trace to a mouse IMP citing PMID:21998198, whose cached full text contains no mention of Ap3m2 and whose only AP-3 allele is mocha/Ap3d1. Two synaptic-vesicle rows were moved off the endocytic branch to GO:0016182 synaptic vesicle budding from endosome. A uv bioinformatics project defines the AP-3 tyrosine-cargo site empirically from PDB 9C5B (human AP-3 with the LAMP1 GYQTI peptide) and finds it intact in mu3B at 8 of 9 positions, encoded as four residue_claims; the mu2 outgroup from PDB 1BXX shows the AP-3 medium subunits diverged from the AP-2 pocket while still using it, with the alignment-only and structure-observed routes agreeing on 9 of 9 positions. Human Protein Atlas data show the human gene is not neuron-restricted. Validated with just validate (one known warning, the same one the campaign exemplar genes/human/AGT carries), checkquotes.py at 75 quotes and 0 failures, the residue-claim validator at 91 pass and 0 fail, a duplicate-key scan, terms.csv deletion and duplicate checks, and a committed GOA-to-YAML reconciliation script that confirms 26 GOA rows map one-to-one onto 26 reviewed entries and that every propagation_review's source_entities equal the row's seeded supporting_entities.
