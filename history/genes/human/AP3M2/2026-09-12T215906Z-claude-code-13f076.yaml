  summary: 'Create review: AP3M2'
  details: |
    De-novo review of human AP3M2 (P53677, mu3B-adaptin), the medium subunit of the neuronal AP-3B adaptor complex. All 26 GOA rows reviewed plus 1 NEW; the gene has no experimental annotation of any kind, so the work is a propagation audit. Final actions after three bot review rounds: 7 ACCEPT, 11 KEEP_AS_NON_CORE, 7 MODIFY, 1 MARK_AS_OVER_ANNOTATED, 1 NEW (GO:0061534, ISS from the mouse mu3B knockout). All four IBAs come from PANTHER PTHR10529, whose slice was fetched and committed: PTN002237676 (AP-3 mu clade, seeded by yeast APM3 and Dictyostelium apm3) is sound and accepted as NO_FAILURE_CORE, while the other three arrive from the family-root node PTN000055849 and leak across subfamily boundaries - GO:0035615 clathrin-cargo adaptor activity is seeded only by AP-1 and AP-2 mu donors (TERM_SCOPING_PROBLEM, modified to GO:0140312), GO:0005802 trans-Golgi network only by AP-1 and AP-4 mu (PROPAGATION_BAD, modified to GO:0005769), and GO:0006896 Golgi to vacuole transport describes the fungal ALP route (PROPAGATION_BAD, modified to GO:0008333). The same GO:0035615 row, same node and same four donors, also sits on human AP3M1 and AP4M1, so the leak reaches three genes. Counting rather than asserting: 20 of the 26 GOA rows carry a WITH/FROM and so carry a propagation_review, and 13 of those 20 come back with a non-NO_FAILURE root cause through seven distinct causes - the family-root subfamily leak (3 rows); a mouse IMP citing PMID:21998198, whose cached full text contains no mention of Ap3m2 and whose only AP-3 allele is mocha/Ap3d1 (4 rows, plus 1 more derived from them by inter-ontology inference); the InterPro2GO GO:0030131 mapping, which is wrong-branch since GO:0030123 is not a descendant of it; ARBA00026971, which confers GO:0005737 through 2,388 condition sets of which none can fire on this protein; a synaptic-vesicle proteome whose authors call AP-3 a visitor; a subunit annotated as a binder of its own complex; and one SynGO branch choice the donor paper itself argues against. Two synaptic-vesicle rows were moved off the endocytic branch to GO:0016182 synaptic vesicle budding from endosome. GO:0035654 carries the same clathrin commitment but is kept as ACCEPT, because it is the only AP-3-specific cargo-loading term and generalising would discard the AP-3 identity; the term-name defect is filed instead as the second of two proposed_new_terms, both of which are ontology change requests rather than missing terms. A uv bioinformatics project defines the AP-3 tyrosine-cargo site empirically from PDB 9C5B (human AP-3 with the LAMP1 GYQTI peptide) and finds it intact in mu3B at 8 of 9 positions, encoded as five residue_claims. A second, independent AP-3 cargo complex - PDB 4IKN, the rat mu3A C-terminal domain with the TGN38 DYQRL peptide, named by PTHR10529's own metadata as the family's representative structure - returns 10 contacts of which 9 are exactly the 9C5B set, so the site is not an artefact of one structure, cargo or species; the tenth is D182, the conserved aspartate of the tyrosine pocket. The mu2 outgroup from PDB 1BXX shows the AP-3 medium subunits diverged from the AP-2 pocket while still using it, with the alignment-only and structure-observed routes agreeing on 9 of 9 positions. Human Protein Atlas data show the human gene is not neuron-restricted. A cross-review inconsistency with AP3B2, which ACCEPTs the two rows this review modifies, is filed as issue 3027 rather than edited, since AP3B2 is neither this gene's folder nor a donor in any of its rows. Validated with just validate (one known warning, the same one the campaign exemplar genes/human/AGT carries), checkquotes.py at 80 quotes and 0 failures, the residue-claim validator at 352 pass and 0 fail across 20 gene reviews, a duplicate-key scan, terms.csv deletion and duplicate checks, and a committed GOA-to-YAML reconciliation script that confirms 26 GOA rows map one-to-one onto 26 reviewed entries and that every propagation_review's source_entities equal the row's seeded supporting_entities.
