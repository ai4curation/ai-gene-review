  summary: Re-review phosphatase and IL-2R annotations against the full text of PMID:15044455
  details: |
    The full text of Guo et al. 2004 (PMID:15044455) was supplied by the curator and cached (CC BY). The four phosphatase annotations (three IDA, one ARBA IEA) move from KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED: the activity was measured only on GST fusions from E. coli with no catalytic-site mutant, at an acidic pH optimum, with no physiological substrate, on a protein lacking the D-x-D-x-(T/V) motif. The interleukin-2 receptor binding REMOVE now cites the full text (the paper concerns DR4/DR5 only, with no endogenous interaction). Added eight findings and a reference_review for PMID:15044455.
