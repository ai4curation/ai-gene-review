  summary: 'Create review: DSG4'
  details: |
    Reviewed all 27 seeded GOA annotations for DSG4 (Q86SJ6); research from the cached monilethrix paper, UniProt and PubMed is recorded in DSG4-notes.md because deep-research providers were unavailable. Localization conclusion is plasma membrane and desmosome with the cadherin ectodomain extracellular; the two cornified-envelope rows were marked as over-annotation because DSG4 protein is documented in the inner root sheath, matrix and precortex rather than the cornified layer and the assignment comes from cornification-pathway membership. Generic membrane and cell-cell junction rows were refined to plasma membrane and desmosome, cell adhesion was marked TOO_GENERAL, and the bare protein-binding row was modified to gamma-catenin binding on the strength of the plakoglobin co-immunoprecipitation. The two rodent-derived lymphocyte-migration rows were kept as non-core. One core function was recorded.
