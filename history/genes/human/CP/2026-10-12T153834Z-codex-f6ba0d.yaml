  summary: Review CP ferroxidase function and source-specific evidence
  details: |
    Created a complete manual review of human CP after an authenticated identity, catalogue and complete open-PR ownership intake. The genuine normal fetch seeded 45 source assertions and 28 references; all original annotation objects and source references were preserved. The final review has 45 decisions, 36 references, no authored alternate-product accession, one integrated ferroxidase/iron-homeostasis core and no NEW annotation. Actions are 26 ACCEPT, 10 KEEP_AS_NON_CORE, six UNDECIDED and three MODIFY.

    Genuine default Falcon research timed out; the configured Perplexity-lite fallback failed with an insufficient-quota response. Those failures and owned process termination were retained, and no provider artifact was fabricated. Manual notes, exact cache selection and a structured YAML source-evidence sidecar document the literature assessment. External original text was kept distinct from protected cached abstracts. The bounded independent core consultation addressed iron chemistry, rat GPI-splicing constructs and the separate human GEYP transcript evidence. Whole peer corrections improved actual crystallography access scope, official FunFam evaluation and one notes citation.

    The current PANTHER tree/MSA, 33 donor joins with 69 same-term record occurrences, all 294 ARBA condition sets and 12 target-directed Reactome paths were examined. The official FunFam signatures support ARBA00027769 branch 7; the initial evaluator omission is preserved and corrected. No current ARBA00027128 branch matches, without implying that the historical annotation or independently supported secretion is false. The official/MSA E544/D544 difference is recorded without inferring a functional loss.

    The final YAML differs from the first complete draft in 13 parsed entries covering description wording, source anchors, access/rule provenance and genuine derived status; no biological action, source object or core changed. A notes-only cuprous-oxidation citation correction is separately recorded. Ordinary validation, status checking and rendering pass, with three source-specific mixed-action advisories retained intentionally. The stale INITIALIZED status was removed only after the ordinary updater demonstrated that it would not replace a mismatched scalar, then the normal updater derived DRAFT.

    The dated applicability proof covers actual main 5375ac52c3f4c4ab078b8beeec63b11853088bcb, 339 complete inventories, 35 selected source paths and 16 unchanged tooling roots. Publication has 23 finite additions, including byte-identical PMID19159218 shared with active PR4814; 19 existing/shared source files remain exact. The owner performed no canonical, Git, remote, history or publication mutation. This text is proposed history detail only; the publisher must create and validate a genuine history record and qualify subsequent relevant changes.

    ROOT subsequently read the complete first draft, final thirteen changes, notes and independent whole-peer report, and reproduced both owner and peer verifiers. A separate final application supplement qualifies the later actual main and open-PR changes before publication. Genuine publisher validation, status, render and preservation checks accompany this history record.
