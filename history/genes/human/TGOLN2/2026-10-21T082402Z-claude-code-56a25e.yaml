  summary: 'Create review: TGOLN2'
  details: |
    De-novo review of TGOLN2 (TGN46) as the experimentally characterised relative of fly rgn (PTHR23211:SF0, PAINT node PTN000575073), independent of ProtNLM2 predictions. Deep research failed (falcon 403 auth, perplexity-lite timeout), so the review uses GOA-cited papers plus newly cached PMIDs 38466628, 8907712, 9084986, 9794796, 20138391. All 32 GOA rows reviewed: TGN rows accepted; Golgi apparatus refined to TGN and transport vesicle to TGN transport vesicle (MODIFY); plasma membrane and clathrin-coated endocytic vesicle membrane kept as non-core cycling stations; ER lumen removed (type I membrane protein, Reactome FAM20C compartment artifact); generic protein binding removed per policy. Added NEW GO:0043001 Golgi to plasma membrane protein transport (IMP, PMID:38466628: TGN46 KO cuts PAUF secretion and CARTS loading; lumenal domain necessary and sufficient for sorting). No cargo receptor MF asserted because direct cargo binding was not shown; rodent TGN38 interaction data noted but not transferred.
