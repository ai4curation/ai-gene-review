  summary: 'Create GO annotation review: UNC13A (Munc13-1)'
  details: |
    Reviewed all 30 GOA rows for human UNC13A (Munc13-1). Core functions: syntaxin-1 binding (GO:0017075) driving synaptic vesicle priming (GO:0016082) and positive regulation of SNARE complex assembly (GO:0035543, added as a NEW ISS row from the MUN-domain reconstitution study PMID:21499244), and diacylglycerol binding (GO:0019992) by the C1 domain (PMID:9697857, PMID:11792326). Refined phospholipid binding to calcium-dependent phospholipid binding (C2B, PMID:20154707, which carries a 2025 expression of concern and is used only for non-core rows), chemical synaptic transmission and neurotransmitter secretion to synaptic vesicle priming, and neuron projection to terminal bouton. Marked synaptic vesicle membrane (IBA) and positive regulation of dendrite extension (IDA, melanocyte C2-domain overexpression screen; GO dendrite is a neuron projection) as over-annotated. Fetched nine primary papers into publications/. Validation, record-section backfill and quote check clean (54 quotes verified).
