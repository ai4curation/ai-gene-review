  summary: Refine ELP2 localization and correct transcription evidence
  details: |
    Corrected the historical assay attribution: PMID:11714725 supports polymerase and early-elongation-complex association, whereas PMID:11818576 distinguishes positive acetyl-CoA-dependent nuclear-extract rescue from failure in a defined reconstituted system. Retained four existing transcription-era annotations as non-core on their positive biochemical evidence, with unresolved physiological and initiation-versus-elongation limits. Refined three nucleus annotations to nucleoplasm using independent target-specific HPA evidence, consistent with the existing cytosol refinements; historical source resolution remains explicit. Added direct original URLs and section/figure locators, adjusted background reference relevance, clarified positive mouse binary kinase association versus a negative ternary-complex result, and added two biological questions. All 20 imported source objects, seven natural products, complete core-function object, normal caches and availability flags remain unchanged. No new publication quotations or annotation rows. Normal validation and verbose GO term checks pass without gene-review warnings; computed COMPLETE status, rendering, unchanged offline replay and independent scientific review pass. Current main is merged while preserving the exact original payload and unrelated user changes. Campaign completion still requires accepted integration.
