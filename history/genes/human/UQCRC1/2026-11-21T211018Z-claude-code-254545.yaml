  summary: 'IBA REMOVE re-review: MPP complex reason rewritten against the PAINT tree'
  details: |
    Re-review of the IBA REMOVE on GO:0017087 mitochondrial processing peptidase complex (IBD at PTN000220169). The action stands, but the old reason rested on the lack of direct mammalian evidence and described removal from the core review set, neither of which is a ground. Rewritten to the tree: the seeds are true MPP subunits (QuickGO: human PMPCB O75439 IDA PMID:29301859); the vertebrate duplication PTN000747152 gives PMPCB (PTN002627016) and the UQCRC1 clade PTN002627006, on which PAINT already records a NOT IRD for GO:0004222 metalloendopeptidase activity; PAINT negates GO:0017087 on the core 2 clades (PTN001724261, PTN008528666) but not on the UQCRC1 clade. The fix is an IRD at PTN002627006. Quotes untouched; summary left as it was.
