  details: |
    Re-review of the two IBA rows marked REMOVE (GO:0005634 nucleus, GO:0000785 chromatin; projects/IBA_REVIEW/rereview-2026-11-21, batch H02), both projected from the PTHR21052 node PTN000471721. Both REMOVE actions stand on target-specific relocation: human ALKBH7 and mouse Alkbh7 are mitochondrial matrix proteins by direct assay, and the early nuclear report used an N-terminally tagged fusion. The nucleus reason was corrected because it said the trypanosome seed Q383D9 had only IBA support for nucleus; QuickGO (queried by GO id) shows it carries a nuclear lumen IDA from GO_REF:0000109 beside mitochondrial HTP and RCA rows, so it is a genuine seed in the other root child PTN007684737. The inline quote of the notes line making that claim was removed from the reason, the seed positions (fungal clade PTN001078047 sister to the metazoan clade PTN001078030) were added, and the Q383D9 source_status was changed from NOT_RELEVANT to SUPPORTS_SOURCE_BUT_NOT_TARGET. The chromatin row was not edited. Note that line 11 of ALKBH7-notes.md still carries the outdated statement about Q383D9. Validated with just validate human ALKBH7.
