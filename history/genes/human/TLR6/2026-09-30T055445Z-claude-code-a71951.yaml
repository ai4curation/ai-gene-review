  summary: 'Create review: TLR6'
  details: |
    Reviewed all 120 GOA annotations for human TLR6 (Q9Y2C9). Core function framed as TLR2 heterodimer partner that contributes to pattern recognition receptor activity (GO:0038187) for diacylated lipopeptides, with TLR2 binding, TLR2-TLR6 complex, plasma membrane and TLR6:TLR2 signaling (GO:0038124). LPS immune receptor activity (IDA, contributes_to) modified to GO:0038187 and the derived LPS-mediated signaling IEA removed; amyloid-beta binding (IC) removed because the cited paper assigns recognition to CD36; NIK activation (NAS) and NO metabolic process (IEA) removed; NLRP3 inflammasome assembly and extrinsic apoptotic signaling marked over-annotated (priming and cell-non-autonomous effects); protein binding rows modified to TLR2/Toll-like receptor binding or removed (TLR1 TM-peptide and BioPlex). CD36-TLR4-TLR6 sterile-inflammation terms kept as non-core. No NEW annotations. Falcon deep research failed, review made from UniProt and cached publications. just validate passes with no errors or warnings.
