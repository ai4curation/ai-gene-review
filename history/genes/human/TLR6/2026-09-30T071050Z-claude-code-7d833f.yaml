  summary: 'Cross-check review against Falcon deep research: TLR6'
  details: |
    Compared the completed TLR6 review with TLR6-deep-research-falcon.md, which arrived after the review was drafted. The report agrees that the TLR2:TLR6 heterodimer is the functional unit, that Phe343 and Phe365 block the TLR1-like channel and set diacyl specificity, that the location is the plasma membrane with CD36, CD14 and LBP as accessory receptors, and that signalling runs through TIRAP, MyD88, TRAF6, TAK1 to NF-kappaB and the MAPKs, so no annotation action, term, description or core function was changed. The report's statement that the glycerol and peptide head group contact both receptors bears on the open question of whether TLR6 itself touches the ligand, but is carried only by secondary reviews, so the lipopeptide-binding rows were left as they were. Trained immunity, blood-brain-barrier expression, H. pylori desensitisation and polymorphism associations were not annotated. The report's claim of exclusively MyD88-dependent signalling concerns the canonical TLR2:TLR6 route and was not used to drop the non-core TRIF-dependent rows derived from the CD36-TLR4-TLR6 work. Only change to the YAML: a corroborating file: citation to the deep-research report added to the supported_by of the GO:0042498 row. Notes file updated with a Deep-research cross-check (2026-09-30) section, replacing the statement that deep research had failed. just validate human TLR6 passes with no errors or warnings.
