  summary: 'Weekly compliance: improve CMAS review evidence scaffolding'
  details: |
    Weekly evidence-aware compliance pass. CMAS weighted compliance 47.62 -> 91.43. All nine annotation actions were left unchanged; the pass added the missing justification and provenance. Added review.reason to all nine annotations. Two reasons required real adjudication rather than boilerplate: GO:0006054 is kept non-core rather than modified because it concerns metabolism of the substrate N-acetylneuraminate while GO:0006055 concerns biosynthesis of the product CMP-N-acetylneuraminate, so CMAS participates in both and the UniPathway row is accurate at its own level of description; and GO:0016020 membrane retains MARK_AS_OVER_ANNOTATED because here the defect genuinely is a claim exceeding the evidence, with the authors of PMID:19946888 themselves stating that only about 40 percent of their 1843 identifications were plausible membrane proteins and describing the rest as transiently associated. The contrasting treatment of the two high-throughput rows is now explained: the sperm-nucleus HDA row is accepted because the preparation was over 99.9 percent pure and the compartment is independently established by UniProt's experimental Nucleus line, with the mature-spermatozoa cell-type caveat recorded. Added findings to all nine previously bare references including four on the UniProt entry, with verbatim supporting_text wherever a source is cached; the five GO_REF findings are statement-only because those documents are not cached. Added a second finding to PMID:31121216 capturing the within-panel contrast that does the real evidential work, namely that CMP-sialic acid is only dramatically reduced in GNE and NANS knockouts but undetectable in CMAS knockout. Added descriptions for both alternative products, noting that isoform 2 lacks the entire C-terminal half and that its ability to form the active dimer of dimers is untested. Added four suggested_questions and three suggested_experiments where none existed, centred on UniProt's own observation that the BC2 motif both directs nuclear import and contains the active site while nuclear localization is not required for activity, and on whether CMAS discriminates kinetically between Neu5Ac and dietary Neu5Gc. Added reference_section_type to the three core_functions quotes. No GO term id or label was changed and no action was changed. Deliberately left open: five GO_REF findings supporting_text slots, and literature_support on the two rows that carry no PMID at all (GO:0005730 nucleolus from the HPA curation GO_REF and GO:0005654 nucleoplasm from Reactome). Also recorded that PMID:11602804, the primary experimental source, is absent from the publications cache. just validate clean.
