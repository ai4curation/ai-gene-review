  summary: 'Create review: FLT3'
  details: |
    Reviewed all 131 seeded GOA annotations for FLT3 (P36888); provenance notes are in FLT3-notes.md because deep-research providers were unavailable. Localization conclusion is plasma membrane with the immunoglobulin-like ligand-binding ectodomain exposed at the cell surface, so all 64 plasma-membrane rows were accepted, the generic membrane row refined, the endoplasmic reticulum lumen row kept as non-core because it describes immature and ITD-mutant receptor, and the endosome membrane row kept as non-core internalisation. The VEGF receptor activity row and the derived VEGF signaling pathway row were removed with source_defects entries, since the cited cloning paper places FLT3 with CSF1R and KIT and its ligand is FLT3LG; the obsolete nuclear glucocorticoid receptor binding row was also removed. Of thirteen bare protein-binding rows, six kinase partners were modified to protein kinase binding and the PIK3R1 row to phosphatidylinositol 3-kinase binding, while six adapter, RasGAP and microarray hits were removed. Ten rows were marked TOO_GENERAL. Two core functions were recorded.
