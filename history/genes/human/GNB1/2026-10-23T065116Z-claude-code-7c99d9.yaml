  summary: 'Create review: GNB1'
  details: |
    De-novo review of all 150 GOA rows (20 ACCEPT, 95 KEEP_AS_NON_CORE, 22 MODIFY,
    12 REMOVE, 1 MARK_AS_OVER_ANNOTATED). Deep research (falcon, with perplexity-lite
    fallback) failed on authentication or provider availability, so the review rests on
    UniProt, cached full-text and abstract publications, and GNB1-notes.md. Core
    functions: heterotrimeric G-protein beta subunit / receptor complex adaptor in GPCR
    signaling, GIRK potassium channel activator, and PLC-beta activator. GTPase activity
    (IDA/TAS) was removed because Gbeta has no catalytic site. Protein binding rows were
    refined to G-protein alpha- or gamma-subunit binding, or removed. The 79 Reactome
    cytosol rows were kept as non-core. PMID:42870023 (muOR-Gi smFRET; human Gbeta1gamma2;
    AHD affixed against Gbeta) was cited as background.
