  summary: 'Create: SNAP25 gene review'
  details: |
    Reviewed all 95 GOA rows for human SNAP25 against the UniProt record, the cached publications and the deep-research report. Core functions: Qbc-SNARE activity (GO:0005484) in synaptic vesicle priming and fusion at the presynaptic membrane, and in calcium-regulated dense-core vesicle exocytosis. Removed neurotransmitter uptake (NAS, unsupported by the cited paper), electronic potassium channel activity and potassium transport, a synaptic vesicle membrane NAS contradicted by its own cited paper, and uninformative protein binding rows; modified general terms (membrane, synapse, exocytosis, vesicle fusion, chemical synaptic transmission, neurotransmitter secretion, neuron projection) to supported specific terms; marked BLOC-1 complex membership, neutrophil granule membranes, Kv channel complex and ARBA protein-localization rows as over-annotated. Cytoskeleton IDA left UNDECIDED because the cached text does not mention SNAP-25. Validation passed with no errors; 114 quotes verified.
