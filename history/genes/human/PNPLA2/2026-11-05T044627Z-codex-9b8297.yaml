  details: |
    The S20 text describes the predicted PNPLA2 element using a basic patch in PNPLA5. PMID:23741432 directly distinguishes these mechanisms: PNPLA5/Brummer use basic residues, while human ATGL/PNPLA2 uses a hydrophobic region, including deletion/truncation analyses around residues 320-360. The predicted 345-354 segment lies within that region but does not map its full determinant or establish its geometry. Keep existing lipid-droplet annotations; do not transfer the PNPLA5 basic-patch mechanism. Source: supplied DeepTMHMM2 v1 supplement, S20 row 37. Review YAML retained; audit appended to gene notes. Baseline and final validation are recorded in projects/DEEPTMHMM2/validation.tsv. No new GO annotation row was added.
