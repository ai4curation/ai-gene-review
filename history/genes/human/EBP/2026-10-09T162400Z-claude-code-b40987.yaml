  summary: 'Complete review: EBP isomerase term corrected to GO:0047750'
  details: |
    Checked GO definitions in OLS: GO:0000247 C-8 sterol isomerase activity is defined on the fungal fecosterol/episterol pair and GO:0004769 steroid Delta-isomerase activity is the 3-oxo-Delta5 to Delta4 steroidogenic isomerase (a sibling, not a parent). Human EBP catalyses lathosterol = 5alpha-cholest-8-en-3beta-ol (RHEA:15281), which is exactly GO:0047750 cholestenol delta-isomerase activity (3 EXP annotations). Changed GO:0000247 (IBA, ISS, IEA) and GO:0004769 (IBA, EXP x2, IDA x2, IMP) to MODIFY -> GO:0047750, with propagation_review on the IBAs; core MF switched to GO:0047750. Bare protein binding IPIs -> REMOVE. Fixed a folded-hyphen split. Status INITIALIZED -> COMPLETE. Aligned with dismech X-linked_Chondrodysplasia_Punctata_2 and MEND_Syndrome. Validated with just validate human EBP.
