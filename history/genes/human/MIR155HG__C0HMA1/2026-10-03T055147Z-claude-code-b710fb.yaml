  details: |
    Reviewed all 6 GOA rows for the alt-ORF micropeptide miPEP155/P155 (C0HMA1, host MIR155HG): accepted the IDA negative regulation of dendritic cell antigen processing and presentation, the IPI Hsp70 protein binding (HSPA8) and cytoplasm rows, kept nucleus (IDA and SubCell IEA) as non-core since no nuclear activity is known. Proposed one NEW MF, GO:0042030 ATPase inhibitor activity, from direct inhibition of recombinant human HSPA8 ATP hydrolysis, and recorded the species caveat that the cellular and in vivo work used mouse dendritic cells treated with the human peptide.
