  summary: Review all 47 human ABCG8 annotations and synthesize heterodimeric sterol
    export
  details: |
    Reviewed all 47 initialized human ABCG8 assertions, preserving every seeded term,
    evidence code, original reference, supporting entity, qualifier and both alternative
    products. The immutable UniProt and GOA files were not edited. Source3 supplied
    normal-fetched seed and cache bytes; the intact full PMID:12208868 record was
    selected by the parent after an independent variant/provenance assessment.

    Refined broad transporter activities and aqueous cholesterol-carrier annotations
    to GO:0034041 ABC-type sterol transporter activity; refined signaling-receptor
    complex membership to the experimentally established ABC transporter complex.
    Corrected the IC intestinal-absorption interpretation to negative regulation,
    preserving the original source and the unresolved intestinal-versus-biliary
    contribution in the human-transgene mouse experiment. The core records ABCG8
    contribution to heterodimeric transport, not an autonomous half-transporter.
    Generic MESD binding is uninformative; removal does not reject the reported pair.

    Read cached primary sources and recovered external full or indexed primary
    sections for PMID:14504269, PMID:16870176, PMID:16893193, PMID:16867993 and
    PMID:34404721. Kept human protein, mouse protein and experimental-host scopes
    distinct, including the mouse-pair rescue in the 2003 study and human constructs
    in the 2016 study. Five rat-derived response/homeostasis rows remain UNDECIDED
    with their term-specific historical IEP chains and unresolved full-assay limits.
    Independent ABCG5-lane review found no biological action/core blocker; incorporated
    its correction that the PMID:25263431 abstract does not itself name Abcg8.

    Genuine Falcon and perplexity-lite fallback invocations failed before provider
    dispatch on PyPI DNS resolution. No provider artifact was created. The concurrent
    standard cache command found all seven seeded PMIDs already present. A single
    shared normal donor-source fetch failed 0/11 with DNS errors. Six required caches
    remain missing: PMID:15710224, PMID:16867993, PMID:17109865, PMID:23117815,
    PMID:25263431 and PMID:34404721. Their primary identities/access scopes are
    documented separately from local availability; status remains DRAFT. No NEW
    annotation, fabricated cache, Git mutation or remote publication was performed.

    Final distribution is 30 ACCEPT, 11 MODIFY, five UNDECIDED and one REMOVE.
    Full targeted validation passed with one grouped missing-reference warning.
    All 95 supporting excerpts matched cached text, and the final source-scope
    wording passed schema validation. Source and reference-identity preservation,
    history validation and HTML rendering passed. The recursive gene-tree citation
    census includes notes and any provider reports and confirms the six gates above.
