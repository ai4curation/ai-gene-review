  summary: First review of human AK4P3, a transcribed pseudogene with a translation-competent ORF
  details: |
    19 ACCEPT, no removals - unusual for this campaign and the honest answer.

    AK4P3 carries 19 GO annotations describing a working mitochondrial adenylate kinase, all IEA
    or IBA applied by automatic pipelines (chiefly HAMAP-Rule MF_03170) on similarity to AK4
    (P27144), while HGNC names the locus a pseudogene. That looked like a clean over-annotation
    case and is not.

    A sequence analysis written for this review (genes/human/AK4P3/AK4P3-bioinformatics/, fetches
    live from the UniProt REST API, hardcodes nothing) finds the ORF 99.1% identical to AK4 - two
    conservative substitutions - with the Walker A P-loop intact at the same position. So the
    pipelines are not misfiring on a decayed relic and there is no biochemical ground to remove
    anything.

    Falcon surfaced PMID:33971925, which no GO annotation on this gene cites: long-read cDNA
    sequencing recovered a spliced AK4P3 transcript with an intact ORF from human RNA, and that
    ORF proved translation-competent in HEK293T cells from a tagged construct. Endogenous protein
    production and any enzymatic assay remain unshown.

    The caveat is therefore carried on the rows rather than in the actions: each catalytic row
    records that no AK4P3 protein has been assayed. core_functions puts ATP binding in
    molecular_function and AMP kinase activity in contributes_to_molecular_function, because
    binding follows from an intact structural motif while catalysis would be a claim about an
    untested protein.

    The bioinformatics also found two fully tryptic peptides unique to AK4P3, so UniProt's PE=1 is
    attributable in principle and targeted MS would settle it - recorded as the cheapest decisive
    experiment.

    A suspicion checked and dropped: GO:0050145 appeared to be mapped from an EC number absent
    from the entry. EC 2.7.4.4 is present in the catalytic-activity block, and genuine AK4 carries
    the same term. Recorded in the row so the false lead is not re-run.

    affinage returned no record for this locus at all, consistent with its gene set excluding
    pseudogenes.
- type: REVIEW
  outcome: changed
  sections:
  - existing_annotations
  - core_functions
  - notes
  summary: Round 2 - move an unmeasured-activity hedge out of contributes_to_molecular_function
  details: |
    contributes_to_molecular_function was used to signal "this activity has never been measured".
    That slot means "contributes to as part of a complex" and is for accessory and structural
    subunits; AK3/AK4-family adenylate kinases are monomeric, so the file asserted machine-readably
    that AK4P3 is an accessory subunit of something. It was also inconsistent with the same entry's
    directly_involved_in and locations, both of which entail the catalysis it was hedging.

    molecular_function now carries GO:0004017 at the same confidence as the process and location
    terms, and the hedge moved to knowledge_gaps, which was empty. Two gaps recorded: BIOLOGY /
    MF_DARK for whether endogenous protein is made and whether it has activity, with the boundary
    stating what the sequence and transcription evidence do establish; and CURATION / MF_DARK for
    whether UniProt's PE=1 rests on the two AK4P3-discriminating tryptic peptides, which is
    resolvable from existing data.

    Four process rows (GO:0006172, GO:0009142, GO:0046034, GO:0046039) carried a boilerplate
    sentence written for molecular function rows, calling them specific catalytic activities. A
    separate process variant now says they presuppose the catalysis asserted elsewhere.

    Two file: quotes were not byte-verbatim - an em dash transliterated to a hyphen, and an
    apostrophe where the source has a prime character. Neither is catchable by CI, which
    existence-checks file: refs only. Verification switched from normalized to byte-exact matching.
