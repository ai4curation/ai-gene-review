  summary: Address review feedback on TIMMDC1 compliance pass
  details: |
    PR-shepherd follow-up to the two blocking items in the ai4c-reviewer review of PR #3070. (1) PMID:33961781 finding #2 inferred that the TIMMDC1-NDUFB11 edge is genuine from the paper's statement about interactions SHARED across the 293T and HCT116 networks; nothing establishes that this edge is shared, and BioPlex 3.0 is the 293T network. The statement now reports the shared-vs-cell-specific distinction as the paper's own finding, says explicitly that the paper does not place this edge in the shared set, and re-anchors plausibility to NDUFB11 being a Complex I membrane-arm (ND) subunit. supporting_text unchanged and still verbatim. (2) GO:0005654 nucleoplasm carried action KEEP_AS_NON_CORE with a reason describing the signal as likely HPA antibody cross-reactivity; an artefact is not a true-but-peripheral localization. Action changed to MARK_AS_OVER_ANNOTATED (not REMOVE, since it is an experimental IDA) with summary and reason adjusted to match. No GO term ids changed.
