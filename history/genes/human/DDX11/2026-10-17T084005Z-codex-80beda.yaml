  summary: Review DDX11 helicase activity and source-specific evidence
  details: |
    Reviewed all 87 imported human DDX11 annotations against source-specific evidence, preserving the original dictionaries and NOT flag. The review records 36 ACCEPT, 37 KEEP_AS_NON_CORE, 11 MODIFY and 3 UNDECIDED decisions, with one directional DNA helicase core, five sequence products and 22 references. No NEW annotations were proposed.

    Original studies distinguish DNA substrates, historical construct lengths, RNA-stimulated ATPase activity, replication/cohesion assays and interaction contexts. Unresolved viral E2, second FUZ and exosome assertions remain UNDECIDED. The evidence guide links original full texts and identifies abstract-only limits. Automated research providers failed authentication or quota; no provider report was fabricated.

    Normal validation, term checks, status inspection and rendering passed. Eight generic-binding advisories follow the explicit project retention policy; four action differences reflect different supporting experiments. Existing sources and runtime files were preserved. Publication requests fresh peer review and claims no completion credit.
