  summary: First review of SLC24A1 for the dismech vision-disorder alignment
  details: |
    First annotation review of human SLC24A1 (rod Na/Ca-K exchanger NCKX1), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1). 38 GOA rows reviewed: 24 ACCEPT, 9 MODIFY, 4 REMOVE, 1 MARK_AS_OVER_ANNOTATED. Core function: GO:0008273 calcium, potassium:sodium antiporter activity at the photoreceptor outer segment membrane, in calcium export across the plasma membrane, calcium homeostasis and light adaption; this agrees with the phototransduction module. Removed: calcium channel activity (IBA; an exchanger is not a channel), long-term synaptic potentiation and depression (IBA from a node seeded by the mouse Slc24a2/NCKX2 knockout), and one bare protein-binding row. A 2002 annotation to GO:0019867 outer membrane where the paper says outer segments is recorded as a source defect and refined to the photoreceptor outer segment membrane. Location evidence is bovine. Validated with just validate human SLC24A1: no errors.
