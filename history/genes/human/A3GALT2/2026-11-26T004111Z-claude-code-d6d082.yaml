  summary: Record OpenScientist finding that no lesion explains A3GALT2's weak activity,
    and that lesion tests cannot measure turnover
  details: |
    Ran an OpenScientist deep-research job (kgap-a3galt2-catalytic-integrity) on the knowledge gap asking whether endogenous human A3GALT2 catalyses any measurable reaction. It removes two candidate explanations for the weak measured activity and states plainly that it cannot supply the measurement the gap needs.

    The whole mutagenesis-validated GT6 catalytic set is present, and every residue was confirmed in the local U3KPV4 record: the DXD-equivalent metal motif Asp199-Val200-Asp201, whose two aspartates UniProt independently annotates as Mn-binding, the catalytic Glu291, the donor-specificity His254, the acceptor-pocket tryptophans Trp223, Trp288 and Trp330, the architectural Arg176 with Asp290, the donor-region His289 and Ser292, and the C-terminal UDP contacts Lys333 and Arg339, in a 340-residue protein carrying PF03414 and IPR005076.

    The decisive comparison returns exactly one hit out of 16 audited positions across human and 11 mammalian orthologs: Glu to Gly at 334, confirmed locally as Gly334. It is shared with chimpanzee so it predates the human lineage, the aligned position carries Asn in catalytically active human ABO and Asp in active GBGT1, and in the superposition it lies 9.21 Angstrom from UDP, outside contact range. The only other non-identity, Val200, differs because marmoset carries Ile, so human holds the mammalian consensus. No pseudogenisation signature is present: ATG to TAG with no internal stop, four of four canonical GT..AG introns, and Nei-Gojobori dN/dS showing no human-lineage relaxation at 0.41 for human-marmoset against 0.40 for macaque-marmoset. The type II signal anchor is intact, matching the local TRANSMEM 13..32, so mislocalisation is excluded at sequence level. After superposition on the bovine GGTA1 structure at 1.38 Angstrom over 285 CA pairs, the two aspartates land 2.28 and 2.76 Angstrom from the crystallographic manganese and Arg339, Lys333 and Arg176 land 2.79, 3.45 and 4.16 Angstrom from bound UDP.

    The run states its own limit, which is why the gap moves only to NARROWING: an enzyme can carry a perfect catalytic constellation and still be slow for reasons sequence does not record, including acceptor-pocket shape, loop dynamics, donor or acceptor affinity, expression level and Golgi residence time. The conclusion is that no lesion explains the weak activity, not that the enzyme is fast. A second result cuts the other way and is new to this review: within modern humans the gene is unconstrained for loss of function, with a gnomAD LOEUF of 1.32, pLI of about 6e-05 and 14 observed predicted loss-of-function alleles against 16.6 expected. That is the profile of a dispensable gene and is equally compatible with an intact but redundant enzyme and with a first phase of pseudogenisation that has not reached the coding sequence. The run also notes that its dN/dS of about 0.4 is weak constraint in absolute terms and came from a local implementation because the Compara value was null.

    Two of its curation leads were declined. It suggests assigning a Golgi membrane term by similarity and an iGb3 synthase activity term qualified as low activity; the rows stay as they are, because the endogenous full-length expression gap on this gene is unresolved and the measurable-activity question is exactly what remains open. Its advice against letting the GGTA1 reaction leak across by paralogy agrees with the UNDECIDED already recorded on both GO:0047276 rows, and the acceptor-pocket divergence it cites for that, bovine Trp250 aligning to His224, is confirmed as His224 locally but remains an alignment inference. The run notes it would refute any claim that this gene is a pseudogene or has a degraded active site; this review makes no such claim, recording the activity as unresolved, so nothing was corrected.

    No annotation action was changed. Not recomputed here: the ortholog panel and its identities, the splice-site check, the dN/dS values, the gnomAD metrics, the AlphaFold superposition and ligand distances, and the bovine position equivalences. The reference is recorded as UNVERIFIED with those items listed.
