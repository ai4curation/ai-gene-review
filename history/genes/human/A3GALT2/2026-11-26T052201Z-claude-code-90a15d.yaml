  details: |
    human A3GALT2: fix a boundary that contradicted its own gap status

    A consistency audit across the 184 gaps carrying an OpenScientist verdict in this
    campaign found two candidate mismatches between a gap's status and the wording of its
    boundary. One was a false positive: the DMS3-30 boundary says a competing mechanism
    "stays open", which is about the mechanism and not the gap. The other was real. This
    gap is NARROWING, but its boundary read "the limit is the reason this gap stays open",
    which a reviewer would reasonably read as contradicting the status.

    The status is the part that was right: the run excluded a broken active site, excluded
    mislocalisation, found no pseudogenisation signature, and added the gnomAD constraint
    fact, so the hypothesis space did narrow even though no turnover was measured. The
    wording is now "narrowed rather than closed", which is the phrasing used elsewhere in
    the campaign for exactly this situation.

    Status distribution across those 184 gaps, for the record: 152 NARROWING, 31 OPEN, 1
    RESOLVED.

