  details: |
    Rebuilt from a clean stub with affinage deep research. Accepted cytosol, the Atg12-Atg5-Atg16 complex rows, and the NOT autophagosome assembly and NOT autophagosome rows. Left NOT autophagy UNDECIDED, because later mouse knockouts report a positive role in LPS-induced autophagy. Left HPA nucleoplasm UNDECIDED, because the mouse study judged the nuclear signal a tagging artifact. No NEW terms.
