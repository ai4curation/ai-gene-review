  summary: 'Address PR #4330 review: consistent NOT-autophagy call, E3-like MF in core_functions'
  details: |
    Changed NOT involved_in autophagy from UNDECIDED to ACCEPT: the later knockout data show regulation of the ATG16L1 complex, which is compatible with a NOT participation row, matching the autophagosome assembly reasoning. Added contributes_to_molecular_function GO:0019776 Atg8-family ligase activity to core_functions, supported by the membrane-targeted Atg12-5-16L2-N E3-like data. Added a reference_review for PMID:23202584 and a disease finding for PMID:31451676. Noted that the HPA reliability score was not checked.
