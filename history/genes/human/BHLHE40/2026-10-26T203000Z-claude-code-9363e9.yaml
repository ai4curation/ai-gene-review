  details: |
    New AI review of human BHLHE40 (DEC1/STRA13, O14503) covering all 153 GOA rows. The core is an RNA Pol II DNA-binding repressor that binds CACGTG E-boxes, with circadian regulation of gene expression accepted. Five small-scale protein-binding rows were modified to informative terms (bHLH TF, nuclear RXR or p53 binding), and seventy-seven bare protein-binding rows from interactome screens, viral partners and UBC9 were removed. Broad DNA-binding and regulation terms were marked TOO_GENERAL, and the HES-node IBA for anterior/posterior pattern specification was marked over-annotated. Three NEW rows were added: RXR transcription corepressor activity (IDA), and negative regulation of IL-10 production and positive regulation of macrophage proliferation (ISS from mouse ChIP-seq/knockout studies). Notes file written from a manual Europe PMC survey; thirteen new PMIDs cached.
