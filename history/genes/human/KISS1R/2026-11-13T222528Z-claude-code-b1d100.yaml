  summary: 'Create review: KISS1R'
  details: |
    De novo review of human KISS1R (GPR54/AXOR12, Q969F8), kisspeptin receptor. Reviewed all 40 GOA rows. Receptor MF: ACCEPT neuropeptide receptor activity (GO:0008188, IBA+IDA) as the most specific MF; GO:0004930 (x3) and GO:0008528 TOO_GENERAL as its ancestors. GO:0007200 PLC-activating GPCR signalling ACCEPT (core, IDA Kotani/Wacker); GO:0007218 neuropeptide signalling ACCEPT; GO:0007186 TOO_GENERAL. Plasma membrane rows (8) ACCEPT; cilium IDA (PMID:28154160, overexpression) KEEP_AS_NON_CORE; membrane (GO:0016020 x2) TOO_GENERAL vs plasma membrane; cell surface KEEP_AS_NON_CORE. GO:0032278 positive regulation of gonadotropin secretion ACCEPT (core, human LOF IMP Seminara/Semple); GO:0046887 TOO_GENERAL. Bone/osteoclast rows (GO:0045671, GO:0045779 x2) KEEP_AS_NON_CORE, mechanism from Li 2024 PMID:38346942 largely mouse with human GCT osteoclast confirmation. GO:0060090 molecular adaptor activity MARK_AS_OVER_ANNOTATED (activation-dependent SRC/DUSP18 scaffolding, not a dedicated adaptor). Depolarization/cation rows: GO:1904181 and GO:1904062 KEEP_AS_NON_CORE (downstream GnRH-neuron ion mechanism), GO:0003254 and GO:0051049(ARBA) TOO_GENERAL. Five bare GO:0005515 rows: REMOVE for KISS1 ligand, RAMP1/2/3 (per protein-binding policy); MODIFY to GO:0001965 (GNAQ, Wacker direct Galpha_q co-purification) and GO:0051721 (PPP2CA, Evans Y2H/pull-down). Could not verify PMID:12359743 (not cached; mouse cell-surface IPI, only feeds mouse ortholog). Two cached GO-CAMs (68d5ebd600001111 GnRH, 68d5ebd600001504 bone) read for consistency; both model KISS1R Gq->PLC at plasma membrane, consistent with this review. validate clean (0 warnings with UV_NATIVE_TLS unset); validate-quotes 45/45 verified.
