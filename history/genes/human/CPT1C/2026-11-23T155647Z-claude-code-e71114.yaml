- type: EDIT
  outcome: changed
  summary: Drop NEW row on obsolete GO:0002084 protein depalmitoylation
  details: |
    Corpus scan (issue 6783) found an obsolete GO term asserted on an author-supplied
    `action: NEW` row, which validation does not catch because
    `existing_annotations[].term.id` is deliberately not hard-validated.

    The term: GO:0002084 "protein depalmitoylation", on a NEW IDA row citing
    PMID:30135643, and repeated in `core_functions[].directly_involved_in`.
    Verified obsolete against QuickGO on the GO 2026-11-21 release (it resolves as
    "obsolete protein depalmitoylation"). GO's comment: the term represents a
    molecular function, not a biological process; consider the MF
    'palmitoyl-(protein) hydrolase activity' (GO:0008474). No `replaced_by`.

    Decision: the NEW row was dropped, and GO:0002084 removed from
    `core_functions[].directly_involved_in` (GO:0099072 retained there). Reasons:

    1. The `consider` target GO:0008474 is already annotated to CPT1C twice in GOA,
       including by IDA from the same PMID:30135643, and both rows are ACCEPT in this
       review; GO:0008474 is already the review's core molecular function. A NEW row
       is "a proposed annotation, not one that exists in the existing GO annotations",
       so re-proposing it would be a duplicate and would also breach the NEW bar's
       rule against a term the gene already carries.
    2. The BP fallback the old `reason` leaned on, GO:0098734 "macromolecule
       depalmitoylation", is ALSO obsolete in the current release, for the same
       aspect reason. This is recent: the 2026-07-26 go-basic release still has both
       terms live, and OLS and api.geneontology.org were still serving them as
       non-obsolete when checked on 2026-11-23.
    3. The live ancestors (GO:0035601, GO:0098732) would reintroduce the aspect error
       GO obsoleted the branch to remove. The biological consequence is already
       asserted on this gene as GO:0099072 and as the NEW row GO:1904719 (both
       verified live), so nothing is lost.

    No replacement term was invented and no `proposed_new_terms` entry added: GO's
    obsoletion was a deliberate ruling that this chemistry is a molecular function,
    not an accidental gap.

    Left alone deliberately: the existing GOA IEA row on GO:0098734 (GO_REF:0000108)
    keeps its id and ACCEPT action, since existing-annotation ids come from GOA and
    are not rewritten here; the obsoletion is upstream GOA's to propagate. Its
    `reason` prose does read as the same aspect confusion and is worth revisiting
    separately.

    Also recorded in CPT1C-notes.md. `just validate human CPT1C` passes (6 warnings,
    all pre-existing and unrelated); `just validate-quotes` passes corpus-wide.
