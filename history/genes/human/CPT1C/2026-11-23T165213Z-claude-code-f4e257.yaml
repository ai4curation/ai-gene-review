  summary: Modify the obsolete GO:0098734 row to GO:0008474
  details: |
    Round-3 follow-up to the PR #6790 review. The GOA IEA row on GO:0098734 was
    ACCEPT; it is now MODIFY with proposed_replacement_terms GO:0008474
    palmitoyl-(protein) hydrolase activity. The reviewer found that four merged
    reviews carry the identical GOA row (GO:0098734 + IEA + GO_REF:0000108 +
    WITH/FROM GO:0008474) and none accepts it: DANRE/abhd10a and DANRE/abhd10b
    modify it to GO:0008474, human/ABHD12 removes it citing the GO editors'
    tracker threads, and human/CLN5 marks it over-annotated on substrate scope.
    Verified all four independently. An ACCEPT recorded the obsoletion in its own
    reason while asserting the aspect the obsoletion denies; the defence that a
    review does not rewrite GOA-sourced ids answers a question nobody asked of the
    action, since the action and the replacement are the review's own. The id is
    untouched. Also corrects a factual overclaim in the round-2 note: the
    obsoletion was NOT visible only in QuickGO. The GOA files of ABHD12, CLN5,
    abhd10a and abhd10b all carry the obsolete-prefixed label, so it was
    discoverable from committed content; CPT1C's own goa.tsv is simply a stale
    fetch (20260106 against 20260727), which is why this gene alone still shows
    the pre-obsoletion label. Validates clean.
