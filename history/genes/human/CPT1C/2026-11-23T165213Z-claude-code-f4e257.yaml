  summary: Record the GO:0098734 obsoletion in the retained GOA row
  details: |
    Follow-up to the PR #6790 review: the retained GOA IEA row on GO:0098734 had its aspect confusion fixed in round 2 but still read as an unqualified ACCEPT, giving a reader of that row alone no hint that the id is dead. Its reason now records that GO:0098734 went obsolete in the GO release of 2026-11-21, for the same aspect reason as GO:0002084, with GO:0008474 named as the consider target for protein substrates, and states why the id is nevertheless kept: it is GOA-sourced, and a review does not rewrite GOA-sourced ids, so propagating the obsoletion is upstream GOA's to do. Documentation only; no id, action, evidence code or quote changed. Validates clean.
