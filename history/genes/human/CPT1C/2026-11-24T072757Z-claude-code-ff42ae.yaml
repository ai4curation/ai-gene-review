  summary: Modify the obsolete GO:0098734 row to GO:0008474 (rounds 4-5)
  details: |
    Supersedes the prose of the earlier record 2026-11-23T165213Z-claude-code-f4e257, which covers only commit 44c4ae1dd0 (documentation on the retained row; no action changed). That statement was accurate for its own commit and is restored there; this record covers what came after, per docs/history.md's rule that later work moving past a true statement is appended rather than edited in. PR #6790 rounds 4-5, commits 0e7142fa97 and 8c2ded2753. The GOA IEA row on GO:0098734 went from ACCEPT to MODIFY with proposed_replacement_terms GO:0008474 palmitoyl-(protein) hydrolase activity; the GOA-sourced id is untouched. Reason: the reviewer found four merged reviews carrying the identical GOA row (GO:0098734 + IEA + GO_REF:0000108 + WITH/FROM GO:0008474) and none accepting it - DANRE/abhd10a and DANRE/abhd10b modify it to GO:0008474, human/ABHD12 removes it citing the GO editors' tracker threads, human/CLN5 marks it over-annotated on substrate scope. All four verified independently. An ACCEPT recorded the obsoletion in its own reason while asserting the aspect the obsoletion denies, and the defence that a review does not rewrite GOA-sourced ids answers a question nobody asked of the action, since the action and the replacement are the review's own. Round 5 then made the row summary and two CPT1C-notes.md passages match the new action, since both still read as they had under ACCEPT. Also corrects a factual overclaim made in round 2: the obsoletion was NOT visible only in QuickGO. The GOA files of ABHD12, CLN5, abhd10a and abhd10b all carry the obsolete-prefixed label dated 20260727, so it was discoverable from committed content; CPT1C's own goa.tsv is a stale 20260106 fetch, which is why this gene alone still shows the pre-obsoletion label.
