  summary: 'Fix two ACCEPT rows whose reasons argued against themselves: CPT1C'
  details: |
    PR #6790 round-2 review follow-up (suggestion 7). Only the action and reason were changed; no
    GOA-sourced term id was touched.

    GO:0003824 catalytic activity (IEA, GO_REF:0000117) was ACCEPT with a reason reading 'this is a
    root-level term that provides minimal information'. CLAUDE.md forbids accepting a term while
    arguing that it is too general. The action is now TOO_GENERAL, the case the enum describes: the
