    the molecular-function branch.

    GO:0098734 macromolecule depalmitoylation (IEA, GO_REF:0000108) is a biological-process row whose
    reason called it 'the core molecular function of CPT1C'. It stays ACCEPT and the reason now calls
    it the core biological process, points at GO:0008474 for the molecular function, and records the
    earlier mislabelling.

    just validate human CPT1C passes with 6 warnings, all pre-existing.
