  summary: Review all 428 human SMAD4 annotations and synthesize shared co-SMAD function
  details: |
    Manual primary-source research following established provider failures. Preserved all seeded annotation fields and reviewed 428 rows consistently by biological claim. Grounded shared activin/TGF-beta/BMP transcriptional co-SMAD activity, DNA binding, heteromeric complexes and conditional developmental outputs. Distinguished inhibitory and activating ERK/hypertrophy contexts, transcriptional miRNA effects, hepcidin/IL6 responses, and crystal sulfate binding. Added primary early myocardial deletion evidence for ventricular morphogenesis; retained uncertainty on inaccessible hypoxia, conduction-system, homodimer stoichiometry and exact myofibril-assembly claims. Added notes, findings and provenance; applied generic protein-binding policy without rejecting interactions. Verified seeded row preservation and ran record-section backfill and gene validation.
