  summary: 'Create review: MTMR12'
  details: |
    De-novo review of human MTMR12 (Q9C0I1, PTHR10807:SF37) as the experimentally characterised reference for the rat Mtmr12 ortholog. Deep research failed (falcon auth, perplexity quota); review built from cached PMID:11504939, 12847286, 23818870, Reactome and PAINT data. Four protein-binding IPI rows MODIFY to phosphatase binding (MTM1/MTMR2); phosphatase activator activity MODIFY to phosphatase regulator activity because MTMR12 controls MTM1 abundance/localization, not specific activity; PI biosynthetic process marked over-annotated (non-catalytic; PAINT withheld dephosphorylation terms); sarcomere MODIFY to junctional membrane complex (mouse triad data); cytoplasm/cytosol accepted; membrane and SR kept as non-core. NEW protein stabilization (ortholog data from mouse C2C12 and zebrafish within SF37; comparator MTMR9 IDA). Human-established vs ortholog-inferred functions distinguished in notes and core_functions.
