  summary: De-novo review of all 54 GOA annotations for SLC41A2, a plasma-membrane
    magnesium transporter
  details: |
    Reviewed every GOA row for SLC41A2 (Q96JW4), a plasma-membrane magnesium transporter (SLC41/MgtE family, PANTHER PTHR16228 / PTN001045280). Core MF GO:0015095 magnesium ion transmembrane transporter activity; core BP GO:0015693 / GO:1903830 Mg2+ (TM) transport (Mg2+ transport IDA PMID:16984228, Goytain & Quamme 2006); core location GO:0005886 plasma membrane (IDA + IBA + TAS). Support cites curated UniProt CC:FUNCTION/CC:SUBCELLULAR LOCATION (ECO:0000269) via file: references. Actions (54 rows): 33 REMOVE (bare GO:0005515 protein binding IPI, high-throughput interactome PMID:32296183 x32 + PMID:25416956, per policy); 9 ACCEPT (Mg transporter MF+BP and PM location); 8 MARK_AS_OVER_ANNOTATED (GO:0015675 nickel / GO:0006824 cobalt / GO:0006826 iron / GO:0006828 manganese transport - all By-similarity/ISS from mouse ortholog Q8BYR8, in-vitro divalent permeation of unestablished physiological relevance; the physiological substrate is Mg2+; the divalent series is attributed to the mouse ortholog in the description, and PMID:16984228's failure to reproduce the oocyte currents in DT40 cells is cited on those rows); 4 TOO_GENERAL (GO:0022857, GO:0008324, GO:0006812, GO:0030001 class terms). No Na+-coupled antiporter term asserted (not established in human, unlike SLC41A1). propagation_review on the GO:0005886 IBA (PTN001045280, SUPPORTS_TRANSFER). source_defects: none. No deep-research provider file; notes synthesized from the curated UniProt record and GOA-cited primary literature. Batch 28.
