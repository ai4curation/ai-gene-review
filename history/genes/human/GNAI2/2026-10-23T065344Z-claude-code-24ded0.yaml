  summary: 'Full de novo review of human GNAI2 (Gαi2): all 100 GOA annotations reviewed,
    core functions and notes written'
  details: |
    Reviewed all 100 seeded GOA annotations (34 ACCEPT, 33 KEEP_AS_NON_CORE, 17 MODIFY, 14 REMOVE, 1 MARK_AS_OVER_ANNOTATED, 1 TOO_GENERAL) and added 1 NEW (GO:0010855 adenylate cyclase inhibitor activity, IDA PMID:8119955; comparator GNAI1 carries the same term by IDA from the same paper). Core functions: G protein activity in adenylate cyclase-inhibiting GPCR signaling at the cytoplasmic side of the plasma membrane; adenylate cyclase inhibitor activity; GTPase activity; GPCR binding. Notable decisions: rodent-projected GO:0007189 (AC-activating) MODIFY to GO:0007193 as a sign correction (rat source PMID:27912212 describes AC inhibition); GO:0007584 response to nutrient (TAS PMID:8587610, an insulin-action paper) REMOVE; protein binding rows MODIFY to GPCR binding (OPRM1, CXCR5) or Gbeta/gamma complex binding (GNB1, GNB2), others REMOVE as uninformative. Deep research (falcon, fallback perplexity-lite) failed (Edison auth failure, perplexity unavailable); documented in GNAI2-notes.md. PMID:42870023 checked and not cited (construct is human Galphai1). Additional PMIDs fetched: 7663509, 8119955, 8327893, 20508603, 22459149, 22966200, 25617475, 26976957, 27787898, 27912212, 39249692.
