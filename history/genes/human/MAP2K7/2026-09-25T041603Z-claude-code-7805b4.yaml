  summary: 'Create review: MAP2K7'
  details: |
    Created the MAP2K7/MKK7 review: all 54 GOA annotations reviewed (21 ACCEPT, 14 KEEP_AS_NON_CORE, 13 MODIFY, 3 REMOVE, 2 MARK_AS_OVER_ANNOTATED, 1 UNDECIDED). Core MF is JUN kinase kinase activity (GO:0008545) in the JNK cascade, with MKK7 preferentially phosphorylating the JNK TPY Thr and being essential for TNF/IL-1-induced JNK activation. Generic kinase/Rhea MF rows were modified to MAP kinase kinase activity; bare protein-binding rows were modified to MAPKKK binding (TAK1), scaffold protein binding (JIP1), protein kinase binding (LRRK2), Hsp90 or 14-3-3 protein binding, or removed for inhibitor partners (TRIB3, c-FLIPL, GADD45B). The unverifiable telomere-maintenance RNAi screen row was left UNDECIDED and the non-canonical ApoE-DLK-MKK7-ERK findings were kept as non-core. Added notes and reference reviews.
