  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (AGO3-phylo.yaml, from `just phylo human AGO3`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0031054 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree AGO3 is itself a seed and the other seeds are 4 paralogs of AGO3. The tree does not bear on the verdict, which objects to the term as a description of an Argonaute effector and is applied equally to the gene's own experimental row.
    - GO:0003727 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree AGO3 is itself a seed and the other seeds are 5 orthologs across later duplications and 3 paralogs of AGO3. The tree does not bear on the verdict, which concerns the generality of the term and is applied equally to the gene's own experimental row.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
