  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H11). GO:0003727 single-stranded RNA binding (IBD at PTN000527276, 9 seeds, AGO3 itself a seed through its IDA from PMID:19966796): the IBA, IEA and IDA rows were MARK_AS_OVER_ANNOTATED because the term is more general than miRNA binding. That is not a ground, miRNA binding is not a GO descendant of the term, and the cached full text shows AGO3 unwinding a small-RNA duplex and keeping the single-stranded guide. All three rows changed to ACCEPT. GO:0031054 pre-miRNA processing (IBD at PTN000527278, 6 seeds) stays MARK_AS_OVER_ANNOTATED; the IBA reason now states the ground: the AGO1, AGO3 and AGO4 seeds are IDA rows from PMID:19966796, a RISC-loading paper that concludes RISC assembly is uncoupled from dicing, and the supported seeds are in the AGO2 clade PTN002739870. One quote from PMID:19966796 added to each rewritten IBA row.
