  summary: De novo AI review of human THBD (thrombomodulin).
  details: |
    Reviewed all 51 GOA rows and added 3 NEW. Core functions: thrombin cofactor for protein C activation (GO:0061133 endopeptidase activator activity; negative regulation of blood coagulation) and for TAFI activation (negative regulation of fibrinolysis), on the external side of the plasma membrane. Removed 24 bare protein-binding rows (23 HuRI, plus PN-1); refined the thrombin binding row to protease binding; sign-corrected three blood coagulation rows to negative regulation of blood coagulation; marked signaling receptor, proteolysis and zymogen activation rows over-annotated (thrombin does the cleaving; comparator check F5/F8/PROS1/PROCR vs positive control F10). NEW: endopeptidase activator activity, negative regulation of complement activation, HMGB1 binding. Draft prepared by a review agent; finished and validated in the coordinator session after the agent was interrupted. Deep research (asta) returned only off-topic papers and was discarded.
