  summary: De-novo review of all 37 GOA annotations for SLC6A19 (B0AT1), Na+-dependent
    Cl--independent neutral-AA transporter
  details: |
    Reviewed every GOA row for SLC6A19 (Q695T7, B0AT1). Core MF GO:0005295 neutral L-amino acid:sodium symporter activity (Na+-coupled, CHLORIDE-INDEPENDENT system B0 — distinct from the Cl--dependent SLC6 symporters; no Cl--coupling terms accepted). Surface expression requires ACE2 (intestine) / collectrin (kidney): modeled as complex membership via GO:1902495 transmembrane transporter complex (ACCEPT) + NEW GO:1990184 amino acid transport complex (in_complex), with 3 bare ACE2-binding GO:0005515 rows REMOVEd; not modeled as an SLC3 HAT. Apical / brush-border locations ACCEPT. SARS-CoV-2 viral-life-cycle (ACE2-receptor artifact) and neurotransmitter-transport (SLC6-family-name artifact) MARK_AS_OVER_ANNOTATED. amino acid import/transport ACCEPT; generic AA terms TOO_GENERAL. Hartnup disease noted. Actions: 25 ACCEPT, 3 REMOVE, 3 TOO_GENERAL, 3 MARK_AS_OVER_ANNOTATED, 2 MODIFY, 1 KEEP_AS_NON_CORE, 1 NEW. Batch 10.
