  summary: 'Create review: SPIC'
  details: |
    Created the first full review of human SPIC (Q8N5J4), an ETS/SPI-subgroup transcription factor that specifies iron-recycling macrophages. Reviewed all 16 GOA rows: 10 ACCEPT (Pol II DNA-binding TF activity, cis-regulatory DNA binding, activator activity, regulation of Pol II transcription, nucleus, chromatin), 4 MODIFY (general GO:0003700, GO:0043565 and GO:0006355 to the specific terms SPIC already carries; IBA cell differentiation to GO:0030225 macrophage differentiation, based on the Spic-/- red pulp and bone marrow macrophage phenotype in PMID:19037245 and PMID:24630724), and 2 REMOVE (bare protein binding from HuRI). No NEW rows. Added description, two core functions, 16 verified literature references with reference_review, suggested questions and experiments, and literature notes in SPIC-notes.md.
