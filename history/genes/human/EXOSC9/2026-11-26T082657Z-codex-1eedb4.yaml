  summary: 'Create review: EXOSC9'
  details: |
    Created a de-novo human EXOSC9/RRP45/PM-Scl75 review in the PTHR11097 family PR.
    Reviewed all 80 GOA rows one-for-one and accepted RNA exosome complex membership, AU-rich RNA binding, mRNA decay, and conserved nuclear RNA-processing IBAs.
    Removed the old 3'-5' RNA exonuclease NAS row because EXOSC9 is an inert Exo-9 scaffold subunit rather than a catalytic ribonuclease.
    Marked immune response, cell growth, extracellular-exosome, transcription-factor-binding, positive transcription-regulation and TRAMP-dependent tRNA-surveillance rows as over-annotated relative to the cited evidence and the core RNA exosome role.
    Removed bare GO:0005515 protein binding rows under the project protein-binding policy.
    Checked gocams/index.tsv and did not add a GO-CAM or module review because no production GO-CAM names EXOSC9 and the larger RNA exosome is already represented by Reactome and ComplexPortal.
