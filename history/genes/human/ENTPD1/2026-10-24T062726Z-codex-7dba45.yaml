    Review all 70 human ENTPD1 annotation contexts: 53 ACCEPT, eight MODIFY, three KEEP_AS_NON_CORE, one REMOVE and five UNDECIDED. Preserve source fields, six natural products and normal caches. One independently reviewed apyrase core describes sequential ATP-to-ADP-to-AMP hydrolysis with phosphate release, nucleotide catabolism and a contribution to inhibition of platelet aggregation; CD73 performs the separate AMP-to-adenosine step. Record bounded source queries for the UniProt DOI and mouse basement-membrane annotation. Preserve unresolved adhesion, narrow nucleotide-substrate and exosome evidence. Include reproducible natural-product sequence projections with an independent rat control, without assigning equivalent function to untested isoforms. No new annotations or publication quotations. Canonical normal/term/status/render checks pass with two documented advisories and computed DRAFT status.
