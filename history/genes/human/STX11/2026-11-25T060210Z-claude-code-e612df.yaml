  summary: 'Create: STX11 (syntaxin-11) review, 175 rows'
  details: |
    First review of STX11, the FHL4 gene, and the largest single gene review in this campaign: 175 GOA rows, of which 133 are bare GO:0005515. Result: 123 KEEP_AS_NON_CORE, 34 ACCEPT, 13 MODIFY, 3 TOO_GENERAL, 2 MARK_AS_OVER_ANNOTATED.

    Every one of the 133 binding rows comes from a high-throughput interaction dataset except two (the FHL5 papers, partner STXBP2), spread across fourteen distinct screens. Partner accessions were resolved to gene symbols through the UniProtKB REST API rather than written from memory - 100 of 100 resolved, giving 98 distinct partners - and replication across datasets was computed, finding 21 partners in more than one reference. Each row's reason names its dataset, what a hit from that dataset means, whether anything else recovers the same pair, and what kind of protein the partner is. Thirteen rows whose partner is a SNARE are refined onto GO:0000149 SNARE binding; the rest are kept as non-core under the ClinGen Mendelian project's standing instruction, which is also why the review carries 120 expected protein_binding_policy warnings.

    Eight of those rows are the STXBP2 and STXBP1 interactions, and they expose an ontology asymmetry worth raising: Munc18-2's record can state this very interaction as GO:0019905 syntaxin binding, while syntaxin-11's record cannot state the reverse, because GO has no term for binding a Sec1/Munc18 protein. The interaction is direct, disease-linked on both sides and mapped by UniProt to residues 1-25 of syntaxin-11, and it is nonetheless kept as bare protein binding for want of a term.

    One reference needed its method stated rather than assumed: PMID:30886144 is an L3 network link-prediction study, not a screen. It did test its top predictions experimentally against an independent interactome, so the pair it carries was predicted first and tested second, and the row says so.

    The GO:0031201 row from the macrophage study is a NOT annotation, which the review keeps with a declared consistency_exception rather than deleting. Both polarities are right in their own setting: in a macrophage endosome syntaxin-11 regulates VTI1B's complexes without forming a trans-SNARE complex of its own, while in an activated cytotoxic T lymphocyte it contributes the Qa helix of a STX11/SNAP23/VAMP8 complex characterised six years later. The scope reservation is recorded too, since GO negations are gene-level.

    The two synaptic rows are marked over-annotated and recorded as a SUSPECTED source defect against PANTHER - one confidence step below the equivalent claim in the companion STXBP2 review, deliberately, because here the two strongest arguments are unavailable: UniProt calls syntaxin-11 broadly expressed, and the cloning paper reports an in vitro complex with VAMP2. The comparator check still shows the pattern, with STX11, STX19 and STX2 carrying both presynaptic terms alongside STX1A and STX1B.

    The trans-Golgi network row is kept only as non-core on the strength of UniProt's reading of the same experiment, which attributes that detection to overexpression and does not list the compartment as a location; the late endosome rows are accepted, because a second paper confirmed them on endogenous protein in macrophages and measured a function there.

    A stale row in the committed GO term cache is documented in the notes rather than fixed here: cache/go/terms.csv still carries 'SNAP receptor activity' for GO:0005484, whose current name is 'helical-bundle zippering fusogenic activity'. The module annoton uses the cache's label to match the three existing modules that use the term; refreshing the row would invalidate 27 existing uses and belongs in a dedicated cache-refresh PR.
