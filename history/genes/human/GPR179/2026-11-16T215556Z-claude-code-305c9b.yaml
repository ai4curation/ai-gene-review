  summary: First review of GPR179 for the dismech vision-disorder alignment
  details: |
    First annotation review of human GPR179, written for projects/DISMECH_VISION_ALIGNMENT (tranche 1). 19 GOA rows reviewed: 9 ACCEPT, 9 MODIFY, 1 MARK_AS_OVER_ANNOTATED. Core function: GO:0043495 protein-membrane adaptor activity, anchoring the RGS7 and RGS11 GTPase-activating complexes at the ON-bipolar dendritic tip, in protein localization to plasma membrane; this agrees with the activity GO-CAM gomodel:689e7a5d00000901 gives it. G protein-coupled receptor activity is marked over-annotated because no ligand and no G protein activation are known. Protein-binding rows are refined to heparan sulfate proteoglycan binding (pikachurin). Validated with just validate human GPR179: no errors.
