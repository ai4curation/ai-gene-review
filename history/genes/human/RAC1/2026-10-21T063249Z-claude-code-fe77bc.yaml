  summary: 'Create review: RAC1'
  details: |
    Created the full AI gene review for human RAC1 (P63000), reviewing all 403 GOA annotations. Fixed the localization picture for an intracellular, prenylated GTPase: plasma membrane accepted explicitly as the cytoplasmic inner leaflet, cytosol, cell cortex, lamellipodium, ruffle membrane and postsynapse accepted, cytoplasm marked TOO_GENERAL, generic membrane and cytoskeleton modified to the specific supported terms, and pericentriolar material and kinocilium marked over-annotated. Three core functions were defined: the GTPase switch driving branched actin polymerization and migration, the NADPH oxidase subunit role generating superoxide, and postsynaptic spine morphogenesis at glutamatergic synapses. The 84 generic protein binding rows were removed under the project policy while GTP-dependent protein binding, protein kinase binding and RhoGDI binding were accepted; pleiotropic developmental and tissue-specific outputs were kept as non-core. Deep research providers were unavailable; evidence came from cached publications and UniProt and is recorded in RAC1-notes.md.
