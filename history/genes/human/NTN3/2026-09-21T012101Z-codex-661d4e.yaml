  summary: Re-review NTN3 evidence and context-dependent IBA transfer
  details: |
    Separated specific DNA-binding mismatch from broader transcription uncertainty; corrected human versus mouse reference attribution, refined existing receptor binding and removed its redundant NEW descendant; updated biological description and core evidence. The POU-seeded PTN000180816 trace is insufficient for the two specific DNA-recognition molecular functions, retained as REMOVE, while the broader Pol II transcription-regulation process is UNDECIDED. The source mismatch does not demonstrate that a netrin ligand cannot influence transcription. The description now distinguishes the original human cloning study [PMID:9143507, “The NTN2L gene encoding a novel human netrin maps to the autosomal dominant polycystic kidney disease region on chromosome 16p13.3.”] from the direct mouse ortholog receptor-binding and outgrowth experiments [PMID:10366627, “Netrin-3, a mouse homolog of human NTN2L, is highly expressed in sensory ganglia and shows differential binding to netrin receptors”]. Mouse netrin-3 binds DCC, neogenin and UNC5 receptors; lower DCC affinity and developmental expression support a prominent peripheral context without proving exclusivity. The existing receptor-binding row is refined to netrin receptor binding, and its redundant NEW descendant row is removed. Cytoplasm includes the endomembrane system; the retained broad intracellular assignment does not require mature netrin-3 in soluble cytosol. Core function is now grounded in the direct mouse study. All current annotations were screened and just validate human NTN3 passed. Exact non-NEW source fields were preserved. Audit: projects/IBA_REVIEW/rereview-2026-09-20/context-transfer.yaml.
