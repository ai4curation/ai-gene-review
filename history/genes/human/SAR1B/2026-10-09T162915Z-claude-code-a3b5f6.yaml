  summary: Create SAR1B review (76 GOA annotations, core functions)
  details: |
    New review of human SAR1B (Q9Y6B6) created from the just fetch-gene stub. Every one of the 76 GOA annotations was reviewed. The COPII GTPase, coat, ER exit site, cargo-loading, ER-to-Golgi and lipoprotein-transport terms were accepted, as were the leucine-sensor/TORC1 terms (PMID:34290409). Four high-throughput protein-binding rows were removed. The MHC class I antigen-presentation (Reactome), positive regulation of ER-to-Golgi transport (NAS) and Golgi cisterna membrane (IEA) terms were marked as over-annotated. Generic process terms were kept as non-core. The PMID:34015269 rows (abstract-only, about TMEM41B) were deferred to the curator. Three core functions were defined: the COPII GTPase switch at ER exit sites, paralog-specific lipoprotein (chylomicron/VLDL) ER export with SURF4, and the leucine sensor upstream of mTORC1. These align with the dismech Chylomicron_Retention_Disease entry (GO:0003924 DECREASED). The Falcon deep research timed out, so the literature work was done manually and is recorded in SAR1B-notes.md. Validated with just validate human SAR1B.
