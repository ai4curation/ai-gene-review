  summary: 'Review round 2: SAR1B'
  details: |
    Review round 2 for PR 4812, non-blocking item. The review suggested moving the leucine-sensor core function to KEEP_AS_NON_CORE because it rests on a single study. Kept as a core function and made the evidence base explicit instead: PMID:34290409 is the source of the GO:0140785 IDA, of the ARBA IEA derived from it, and of the lysosomal-membrane location, and UniProt curates the activity and the location from it. It is a mechanistically distinct, experimentally demonstrated, GTPase-independent activity with its own molecular function term and its own subcellular location rather than a facet of the COPII role, which is why it stays core; but a GTPase-independent amino-acid-sensing role for a COPII GTPase is a striking claim on one paper, so the description now says so and a suggested question asks for independent replication of the leucine binding, the GATOR2/MIOS interaction and the mTORC1 repression, in a cell type where the COPII role is also measurable.
