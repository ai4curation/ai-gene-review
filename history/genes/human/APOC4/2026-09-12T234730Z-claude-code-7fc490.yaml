  summary: 'Create review: APOC4'
  details: |
    Full review of all 41 GOA rows for human APOC4 (P55056): 11 ACCEPT, 7 KEEP_AS_NON_CORE, 23 MARK_AS_OVER_ANNOTATED (the single HuRI two-hybrid screen, PMID:32296183, whose 23 partners include no secreted protein), plus one NEW row (GO:0005543 phospholipid binding, ISS from rabbit P55057, grounded in the discoidal-micelle measurement of PMID:8576182). Seven propagation_review blocks were written, each with source_entities built by script from the row's seeded supporting_entities. PTHR32288 is an apoC-IV-only family, so no apoC-II/C-III biology leaks through its single IBD node PTN000792756 at taxon:9347; but three of that node's four IBDs carry a single seed, human APOC4 itself. VLDL particle is NO_FAILURE_CORE, HDL particle and triglyceride homeostasis NO_FAILURE_NON_CORE, and lipid storage SOURCE_WEAK_OR_INFERRED because its 2025 IBD rests on one 2008 Huh-7 transfection and now reaches eleven species. The Ensembl-Compara VLDL IEA is EVIDENCE_CIRCULAR_OR_REDUNDANT: its mouse donor's own IDA is the same publication as the human target's, and its two WITH/FROM identifiers are one gene product. Checked and cleanly negative: no lipase-regulation or chylomicron term is present or warranted, and the APOC4-APOC2 readthrough is a separate accession (K7ER74) contributing no row. A reproducible bioinformatics project was added with two live analyses: the PTHR32288 taxonomic span (185/189 members inside Eutheria, corroborating the node placement and PMID:31722659) and an Eisenberg hydrophobic-moment scan placing the human mature chain inside the exchangeable-apolipoprotein band. Validated with just validate (Valid, no warnings), checkquotes.py (148/148 quotes verbatim), linkml-validate, linkml-term-validator, a duplicate-key check, a terms.csv deletion/duplicate check, and a GOA-to-YAML reconciliation script that maps all 41 GOA lines to exactly one YAML entry and back.
