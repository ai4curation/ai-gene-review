  summary: 'Integrate falcon deep research: CD3G'
  details: |
    Integrated the falcon deep research report (added as a file: reference with reference_review). Verified its key claims against primary papers fetched for this purpose (PMID:15778375, PMID:8647168, PMID:29653965, PMID:31921117) and the cached Xin 2024 human gamma-delta TCR-CD3 cryo-EM (PMID:38657677). Description now notes ZAP-70 binding by the phospho-ITAM, the K128 requirement of the CD3G (D/E)xxxLL AP-2 internalization signal, CVID-like to autoimmune phenotypic range with Treg diversity/suppression defects, and that human gamma-delta TCR-CD3 structures contain CD3 epsilon-delta as well as epsilon-gamma (previous text implied CD3 gamma-epsilon alone, based on mouse data). GO:0042106 part_of stays ACCEPT with human structural support added. Core functions gained supporting quotes; two suggested questions added (human gamma-delta CD3 composition; phenotype variability). No annotation actions changed and no NEW terms added.
