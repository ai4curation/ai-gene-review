  details: |
    Created the CD3G (P09693) review for the ADAPTIVE_IMMUNITY T cell receptor trunk. All 111 GOA rows were actioned: 9 HuRI protein binding IPI rows removed as uninformative; protein transport IMP modified to receptor internalization (GO:0031623) reflecting the PKC-phosphoserine/di-leucine sorting motif; knockout-phenotype process rows (cell polarity, lymphocyte apoptosis regulation, positive thymic selection) kept as non-core per necessity-vs-participation guidance; MHC class II receptor activity marked over-annotated, consistent with CD247. Core functions: signaling receptor complex adaptor activity (GO:0030159) contributing to transmembrane signaling receptor activity (GO:0004888) in the alpha-beta TCR complex, and TCR internalization. Five UniProt-cited papers were cached via fetch-pmid; all supporting_text quotes are verbatim from cached publications. Validated with just validate human CD3G (schema, term and reference checks pass).
