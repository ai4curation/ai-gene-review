  details: |
    OMICS_EVIDENCE vesicle-row manual review (projects/OMICS_EVIDENCE.md; dossiers and decisions in projects/OMICS_EVIDENCE/htp/vesicle_review/). The rule-based vesicle disposition was withdrawn; each protein was judged from its dossier using the MISEV2018 protein categories (PMID:30637094) as a guide. Manual re-review of GO:0070062 extracellular exosome (PMID:19056867): ACCEPT -> KEEP_AS_NON_CORE. Basis: ESCRT-III subunit acting on the cytosolic face of endosomes; its presence in EVs follows from ILV formation, but the exosome is a destination, not where it acts. Cytosolic protein (UniProt); cytosolic proteins, including abundant enzymes and cytoskeletal proteins, are expected and often promiscuous EV contents (MISEV2018 category 2). True, but not its core location.
