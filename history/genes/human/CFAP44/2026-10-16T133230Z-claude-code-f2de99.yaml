  summary: 'Create review: CFAP44'
  details: |
    New review of all 10 GOA rows for CFAP44 (Q96MT7), the tether/tether-head partner of CFAP43 (MMAF, SPGF20). Falcon deep research failed (authentication error) and Perplexity was not available, so no deep-research file was written; the literature was researched manually and recorded in CFAP44-notes.md. Axoneme, motile cilium, sperm axoneme assembly (IBA/IEA/IMP) and flagellated sperm motility were accepted. Microtubule cytoskeleton organization was marked TOO_GENERAL. Protein binding (HuRI) was removed. Both peptidase activity rows (IDA PMID:28887034, abstract only, and the IBA node grounded only in that IDA) are UNDECIDED. Structural constituent of cytoskeleton was proposed as NEW. New publication caches: PMID:28887034 (via fetch-gene), PMID:29277146. Validated with just validate human CFAP44.
