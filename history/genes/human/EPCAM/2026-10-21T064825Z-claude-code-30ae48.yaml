  summary: 'Create review: EPCAM'
  details: |
    Reviewed all 40 seeded GOA annotations for EPCAM (P16422); notes with provenance are in EPCAM-notes.md since deep-research providers were unavailable. Localization conclusion is plasma membrane with the EpEX ectodomain extracellular and antibody-accessible, concentrated at the lateral membrane and tight junctions; basolateral rows accepted, the kidney apical row kept as non-core, the generic membrane row refined to lateral plasma membrane, the IBA extracellular-region row kept as non-core because it reflects the shed ectodomain, and exosome rows kept as non-core. Of six bare protein-binding rows, the claudin-7 row was modified to cell adhesion molecule binding and the E-cadherin row to cadherin binding, while four high-throughput interactome hits were removed. The IBA cadherin binding involved in cell-cell adhesion row was modified to cell-cell adhesion mediator activity because EpCAM adhesion is homophilic and calcium-independent and its documented effect on cadherin adhesion is to weaken it. Two core functions were recorded, for homophilic adhesion and for EpICD nuclear signalling.
