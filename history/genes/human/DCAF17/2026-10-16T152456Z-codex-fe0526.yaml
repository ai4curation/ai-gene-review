  summary: Clarify DCAF17 core localization and uncertain membrane and ligase roles
  details: |
    Address the formal and inline review of the initial DCAF17 submission. Add the independently demonstrated nucleolar location to the single cullin-association core while retaining nucleoplasm. Distinguish protein localization from the site of a demonstrated DCAF17-dependent ubiquitination reaction. Clarify that the HPA record was inspected while antibody images were not.

    Retain membrane UNDECIDED with an affirmative evidence-conflict rationale: the long-product hydrophobic predictions and the experimental nucleolar observations remain unreconciled, and membrane insertion, topology and product-specific partitioning are unresolved. Retain ubiquitination UNDECIDED while explicitly recognizing that noncatalytic structural or substrate-recruitment work could qualify as participation; the available DCAF17 evidence does not establish its performed step. Accept the supported CUL4B membership consistently with CUL4A instead of using unquantified band intensity to assign different core status. State explicitly that the cullin-binding refinement does not cover the separately supported DDB1 association; a bounded official search did not establish a suitable DDB1-specific binding descendant. Product descriptions now contain concise biology, with clone and activity limits retained in the source guide and core context.

    The finite change preserves all 15 source objects, 17 reference entries, both product identities and sequence metadata, both existing quote objects and one core. Eleven YAML leaves and seven guide leaves change, with an append-only notes section. Final counts are 11 ACCEPT, one MODIFY, one KEEP_AS_NON_CORE and two UNDECIDED, with no NEW assertion. ROOT read the complete feedback and finite delta and reproduced the sealed source checker; prior original-source and figure assessments remain separately attributed. All initial source caches and history are preserved. Ordinary canonical validation, status checking, rendering and new-history validation are recorded. No campaign completion credit is claimed before approval, normal merge and actual-main verification.
