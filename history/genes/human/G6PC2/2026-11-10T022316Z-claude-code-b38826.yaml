  summary: 'Create review: G6PC2'
  details: |
    De novo review of human G6PC2 (Q9NQR9), 13 GOA rows, as the human counterpart of the completed mouse G6pc2 review in the BGEEDB_EXPRESSION project. Glucose-6-phosphatase activity accepted as core on three rows, now with human-specific support from PAP2-motif mutagenesis (PMID:38095063) and microsomal assays of the human ORF (PMID:34954144). ER kept as an informative root organelle term on both synthesis rows, ER membrane accepted on the SubCell IEA and the Reactome TAS, and the generic membrane IBA modified to ER membrane. All three gluconeogenesis rows removed as over-propagation to the islet paralog: the PAINT IBD at PTN000971890 has no G6PC2 seed and no IRD on the lineage, the UniProt PATHWAY line is an unevidenced G6PC1 carry-over, and the Reactome TAS rests on the islet reaction R-HSA-3266566 sitting inside a pathway whose own summary confines gluconeogenesis to liver and kidney. The nominal human clamp association of PMID:19669124 and a 2025 review that lumps the paralogs (PMID:39426930) were weighed explicitly and do not overturn the removal. Glucose homeostasis accepted; regulation of insulin secretion modified to GO:0061179, with the direction taken from the IMP source itself. One NEW row added, GO:0070094 positive regulation of glucagon secretion (IMP, PMID:39742505), on alpha-cell-specific deletion in mouse reproduced by knockdown in primary human alpha cells. Source defects recorded for GO_CENTRAL, UniProt (PATHWAY and FUNCTION) and Reactome. Notes file written with inline provenance; record sections backfilled; env -u UV_NATIVE_TLS just validate human G6PC2 passes with no errors.
