  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (TK2-phylo.yaml, from `just phylo human TK2`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0005737 (MARK_AS_OVER_ANNOTATED): the reason made a claim the tree contradicts; the reason was corrected. Added to the reason: In the PANTHER 19.0 tree the node is the family root at LUCA, TK2 is itself a seed, and the other seeds are 1 one-to-one ortholog at 83% identity, 1 ortholog across later duplications and 5 paralogs. The term therefore rests partly on TK2's own evidence and is not simply a leak from paralogs.
    - GO:0004136 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the node is a speciation node at Eumetazoa, TK2 is 14 steps below it across 0 duplications, and the single seed is an ortholog across later duplications of TK2 at 44% identity. The verdict rests on the measured substrate specificity of TK2, which the tree cannot settle.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
