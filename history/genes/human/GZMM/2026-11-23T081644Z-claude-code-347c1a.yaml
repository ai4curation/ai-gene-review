  summary: 'Create review: human GZMM'
  details: |
    First review of human GZMM (UniProtKB:P51124). All 15 GOA rows reviewed, plus two proposed NEW rows.

    No deep research available, as for the other two genes in this batch; the manual research is in GZMM-notes.md with inline provenance.

    Core function: GO:0004252 serine-type endopeptidase activity, as the Met-ase - cleaving after methionine, leucine or norleucine, a specificity no other human granzyme has.

    Proposed (2 rows): GO:0140507 granzyme-mediated programmed cell death signaling pathway (IDA, PMID:20406824) and GO:0044194 cytolytic granule (IDA, PMID:8245461). Both from comparator checks with verified positive controls - granzyme A, granzyme B and perforin carry GO:0140507 in their own GOA files and granzyme K carries it by IBA; five granule effectors carry GO:0044194 and this gene did not, although its own cloning paper localised the activity to the granules.

    Accepted where granzyme H was re-levelled: GO:0006915 apoptotic process stays, because for this granzyme the route is established - truncating survivin destabilises the survivin-XIAP complex, XIAP is degraded, and caspase-9 and caspase-3 activation is amplified. The contrast with granzyme H, where no paper establishes which death programme is engaged, is recorded in both reviews.

    Flagged as too general: GO:0004175 endopeptidase activity (IEA) and both GO:0008236 serine-type peptidase activity rows, all parents of the accepted GO:0004252, consistent with the same action on granzymes A and B.

    Removed: both GO:0005515 protein binding rows under the protein-binding policy. One is the SERPINB4 serpin-protease complex, which is real and well characterised but has no molecular-function term for the direction that matters - SERPINB4 inhibits granzyme M - so there was nothing to MODIFY it into; the relationship is kept in the description and notes instead.

    Marked over-annotated: GO:0016020 membrane (HDA, NK membrane proteome), as on granzyme B and granzyme H.

    Kept as non-core: GO:0051604 protein maturation (IBA), for the same reason as on granzyme H - nothing granzyme M cleaves is matured, and the caspase activation it causes is performed two steps away by other proteins.

    Two references the record was missing were added with reviews, both cited by UniProt but by no GOA row on this gene: PMID:18523284 (ezrin and alpha-tubulin) and PMID:20406824 (survivin).

    Validation: just validate clean, 23 quotes verified, record sections backfilled.
