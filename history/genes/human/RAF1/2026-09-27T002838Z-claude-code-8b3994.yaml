  summary: 'Create review: RAF1'
  details: |
    Reviewed all 352 GOA rows for human RAF1/CRAF (P04049). Core functions: MAP3K activity phosphorylating MEK1/2 in the MAPK cascade (cytosol/plasma membrane), RAS-GTP binding via RBD/CRD, BRAF heterodimerization, and kinase-independent suppression of apoptosis (MST2/ASK1 binding, mitochondrial pool). 225 bare protein-binding rows mapped by WITH/FROM partner to terms matching the BRAF review (14-3-3, small GTPase, MAPKK, heterodimerization, Hsp90/chaperone, E3 ligase, scaffold, kinase, phosphatase, TF binding) or removed where no informative RAF1-side MF exists. Corrected the sign of the apoptotic-process TAS row (to negative regulation), removed the NOT small GTPase binding row (Di-Ras-specific result negating a general term), kept pleiotropic Ensembl/Reactome/TAS process rows as non-core, and left PMID:9765203 UNDECIDED (no cached text). Added reference_review to all PMIDs and a provenance-cited notes file.
