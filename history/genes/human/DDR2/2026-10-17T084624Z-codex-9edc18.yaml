  summary: Review DDR2 collagen receptor activity and source evidence
  details: |
    Reviewed all 74 imported DDR2 annotations, preserving their source dictionaries. Final decisions are 17 ACCEPT, 40 KEEP_AS_NON_CORE, 14 MODIFY, 2 UNDECIDED and 1 TOO_GENERAL. The review records one 855-residue precursor and one integrated collagen-activated receptor tyrosine-kinase core; no NEW annotations or alternative-product functions were proposed.

    Original studies and source records distinguish collagen recognition, receptor phosphorylation, binding partners and physiological contexts. Six PAINT placements were checked against their actual ancestral paths and experimental descendants. Human domain experiments with bovine collagen II are distinguished from imported ligand metadata. Unavailable original cell-adhesion and vascular-smooth-muscle experiments remain UNDECIDED. Two supported CDC37 interactions are retained as non-core because the narrower folding-chaperone class was not established.

    Normal validation, term validation, status inspection, rendering and history validation passed. The two generic-binding advisories follow the explicit project policy. Existing source files and runtime were preserved; provider failures are documented without fabricated reports. Fresh peer review is requested and no completion credit is claimed.
