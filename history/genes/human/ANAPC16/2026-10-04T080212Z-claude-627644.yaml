  summary: 'Initial review of human ANAPC16: metazoan-specific APC/C subunit recruiting
    APC7 to APC3; 57 rows accepted, kinetochore non-core, protein binding removed'
  details: |
    Reviewed 60 GOA rows. Accepted the APC/C complex, catabolism, ubiquitination (incl. K11/K48/branched), cell-cycle regulation and location rows; the meiotic NAS is supported by worm emb-1 meiosis I arrest (PMID:21775471). Kept the kinetochore IDA/IBA as non-core (outer-kinetochore APC/C pool, PMID:20813266). Removed the HSF2BP protein-binding IPI. Core function: APC/C subunit bridging APC3 and APC7 (PMID:25490258), needed for activity (PMID:20392738).
- type: EDIT
  outcome: changed
  sections:
