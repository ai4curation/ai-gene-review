  - existing_annotations
  - references
  summary: 'Round 2 (#4058 review): add GO:0140378 protein complex scaffold activity as the core MF; distinguish kinetochore qualifiers; core locations; seed reference_reviews'
  details: |
    Added GO:0140378 protein complex scaffold activity as core_functions.molecular_function (APC16 bridges APC3 and APC7, PMID:25490258), keeping contributes_to GO:0061630. No NEW MF row: the comparator check found no small APC/C subunit carrying a scaffold or adaptor MF in GOA. The kinetochore IBA (is_active_in) and IDA (located_in) now have distinct reasons. Added cytosol and nucleoplasm to core_functions.locations. Noted that the PMID:29033132 quote is a general statement. Added reference_review to the four seed PMIDs.
