  details: |
    De novo review of human TWNK (Q96RR1), the hexameric 5'-3' mtDNA replicative helicase. All 61 GOA rows reviewed: experimental helicase, ATP hydrolysis, ssDNA binding, mtDNA replication and nucleoid rows accepted; DNA helicase activity (IBA/IEA) refined to 5'-3' DNA helicase activity; DNA replication and DNA-templated DNA replication refined to mitochondrial DNA replication; mitochondrial transcription IMP marked over-annotated as an indirect phenotype with a WRONG_TERM CHECK source defect; bare protein binding removed. Literature synthesized manually (no deep-research API) in TWNK-deep-research-manual.md, adding the mouse conditional knockout (PMID:23393161) and Drosophila adPEO models (PMID:22952820).
