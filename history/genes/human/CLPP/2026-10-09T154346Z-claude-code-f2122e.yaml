  summary: 'Review CLPP (merged with concurrent review from #4426)'
  details: |
    De novo review of human CLPP (Q16740), the serine peptidase subunit of mitochondrial ClpXP, chosen from projects/MITOTOL.md (Chen et al. 2026, PMID:42822426, used only as LOW-relevance evolutionary context for the ClpXP/ClpYQ pair). All 55 GOA annotations reviewed: core serine-type endopeptidase activity, ATP-dependent peptidase activity, ATPase binding (CLPX docking), mitochondrial matrix, protein catabolism and protein quality control accepted; GO:0009368 IDA/IPI modified to mitochondrial endopeptidase Clp complex (GO:0009841); CLPX protein-binding IPIs modified to ATPase binding; 22 high-throughput Y2H protein-binding rows removed as uninformative; peptidase activity TAS modified to serine-type endopeptidase activity; PINK1 membrane protein proteolysis and identical protein binding kept as non-core. No NEW terms; mitoribosome assembly via ERAL1 and the absence of a mammalian UPRmt role recorded as questions. Added references for ERAL1, complex I N-module turnover, UPRmt, Perrault syndrome variants and imipridone pharmacology. Falcon deep research timed out in the wrapper but the client completed and wrote CLPP-deep-research-falcon.md, which was cross-checked afterwards.
