  summary: 'ORGANELLES batch 1: mitochondrion rows for ABHD18'
  details: |
    Examined the two GO:0005739 rows (IEA GO_REF:0000044, HTP PMID:34800366); both stay ACCEPT, with reasons recording the check. Added a NEW GO:0005743 mitochondrial inner membrane row (IC). The lines of evidence are the predicted transit peptide 1-55 with no TM segment, the cardiolipin substrate being made on and largely held in the inner membrane (PMID:40378955), and the functional homologue yeast Cld1 being an interfacial inner-membrane protein that faces the matrix (PMID:23637464, cached). The last line is an analogy rather than orthology. GO:0099617 was not used because the leaflet is not shown for ABHD18, and core function locations were left at mitochondrion.
