  details: |
    Full review of all 247 GOA rows for human MAPK3/ERK1 (P27361). Core function: MEK-activated proline-directed MAP kinase activity (GO:0004707) in the ERK1 and ERK2 cascade and protein phosphorylation, cytosol and nucleus, plus ATP binding. Receptor-context and downstream process rows (EGFR, insulin, IL-1, IL-34, BMP, macrophage, myelination, pain, cholesterol efflux, PD-1, DEPTOR) kept as non-core; compartment-restricted localizations (endosome, Golgi, mitochondrion, cytoskeleton, ER lumen, plasma membrane) and indirect processes (cyclase activity, telomere maintenance, stress-activated MAPK cascade, autophosphorylation) marked over-annotated. 48 GO:0005515 rows modified to phosphatase/kinase/MAPKK/TF/scaffold binding (matching MAPK1 choices) or removed for substrate and high-throughput partners. IEP GO:0071260 from the PMID:19593445 batch miscitation set UNDECIDED with reference_review NONE/MISCITED; two unverifiable IDA rows (PMID:11096076 amino acid starvation, PMID:24854121 neuroinflammation) UNDECIDED.
