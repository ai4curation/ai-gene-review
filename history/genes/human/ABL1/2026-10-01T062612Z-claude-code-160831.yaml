  summary: Add premetazoan-origin assessment
  details: |
    Additive premetazoan-origin pass. Read the only biochemical study of a premetazoan Abl (PMID:26090675, choanoflagellate MbAbl2) plus kinome papers (PMID:18621719, PMID:22550341, PMID:18273011, PMID:27746046). Tyrosine kinase activity with Abl-type substrate preference and activation-loop autophosphorylation is ancestral. Myristoyl/cap autoinhibition and the C-terminal F-actin- and DNA-binding region are animal additions. Actin-regulatory and DNA-damage roles in unicellular holozoans are untested. Appended two sentences to the description, added five references with reference_review, and added three suggested_questions. Created ABL1-notes.md with a premetazoan-origin section and a Track C check of the ABL1 IBA PTN nodes. Only the broad tyrosine kinase node PTN002521457 reaches unicellular holozoans (M. brevicollis: MF tyrosine kinase activity and CC plasma membrane); no process terms do. No review actions changed.
