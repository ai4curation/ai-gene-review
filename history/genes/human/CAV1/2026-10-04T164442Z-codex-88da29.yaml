  summary: Review CAV1 caveolar scaffolding and selected regulatory functions
  details: 'Reviewed all 273 original CAV1 assertions, corresponding to 274 raw annotation rows, while
    preserving exact source objects, qualifiers and both alternative-initiation products. The review retains
    59 ACCEPT, 162 KEEP_AS_NON_CORE, 15 MODIFY and 37 UNDECIDED decisions, 110 reference assessments and
    three distinct core functions: integral caveolar-complex scaffolding, selected partner recruitment
    and nitric-oxide-synthase inhibition. No NEW annotations were added. Primary structural evidence distinguishes
    bacterial detergent-solubilized 8S complexes from native caveolae, experimental leaflet reconstitution
    from simulation results, and species-specific or peptide assays from full-length human protein evidence.
    Four frozen disease associations are retained without strengthening limited associations. Nine short
    verbatim anchors were checked against immutable caches. Validation reports 48 standing-policy generic-binding
    advisories, one uninspected-propagation advisory, two source-specific action-consistency advisories
    and three core-coverage advisories. DRAFT retains unresolved biological and source questions. Normal
    validation, status, rendering and standard CREATE-history checks are recorded separately. All 103
    directly relevant source files, 150 auxiliary caches and two frozen inventory files are protected;
    auxiliary caches and inventory files are excluded from the gene publication.'
