  summary: 'Create review: PPP1R15A (GADD34)'
  details: |
    Created the PPP1R15A/GADD34 gene review for the integrated stress response project (#3951), adjudicating all 54 GOA rows. Refined GO:0060090 molecular adaptor activity to GO:0140767 enzyme-substrate adaptor activity and the five GO:0019888 protein phosphatase regulator activity rows to GO:0072542 protein phosphatase activator activity, on the grounds that PP1 and eIF2alpha bind GADD34 independently (PMID:26095357), the substrate-binding region traps phospho-eIF2alpha on its own (PMID:34847777), and the direction of PP1 regulation is substrate-dependent (PMID:11564868). Root organelle rows kept per projects/ORGANELLES.md; six bare GO:0005515 rows handled under the protein-binding policy; GO:1901798 and GO:0051726 marked over-annotated; GO:0006915 and GO:0051246 marked too general. Recorded a WRONG_WITH_FROM source defect for the DisProt rows that name UniProtKB:Q9BY44 (EIF2A) where PMID:34847777 assays EIF2S1 (P05198). No NEW annotations proposed. Automated deep research was unavailable (no provider API keys), so the synthesis was hand-built in PPP1R15A-notes.md from cached publications and the UniProt record. Validated with just validate human PPP1R15A and just validate-references (88 snippets, 23 titles, 0 issues).
