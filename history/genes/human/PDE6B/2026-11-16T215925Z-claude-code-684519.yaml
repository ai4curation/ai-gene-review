  summary: First review of PDE6B for the dismech vision-disorder alignment
  details: |
    First annotation review of human PDE6B (rod cGMP phosphodiesterase beta subunit), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1) together with the other PDE6 subunits. 26 GOA rows reviewed: 10 MODIFY, 9 ACCEPT, 7 MARK_AS_OVER_ANNOTATED; one NEW row, cGMP binding by ISS from the bovine structure. Core function as for PDE6A: GO:0047555 within the rod PDE6 complex, in GO:0141190 at the rod disc membrane. Marked over-annotated in addition to the cAMP rows: circadian entrainment (the mouse study used rd1 only to remove photoreceptors) and retinal cell apoptotic process. The night-blindness allele is given as His258Asp in the cached abstract of PMID:8075643 and as H258N in UniProt; an erratum exists and was not available. Validated with just validate human PDE6B: no errors.
