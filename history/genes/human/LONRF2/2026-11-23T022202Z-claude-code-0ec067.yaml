  summary: Narrow the LONRF2 N-terminal RING integrity knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations, local bioinformatics withheld) on whether the N-terminal RING-like region (143-193) is an intact two-zinc RING. The AlphaFold model has one canonical Zn(Cys)4 site (C143/C146/C163/C166) and the RING core fold. Site II is lost: Leu160 sits at the ligand-4 His position, and C190/C195 are displaced by an insertion. Residues were checked against the UniProt sequence. The site-II His is retained in non-eutherian orthologs and in LONRF1/LONRF3, so the loss is eutherian-specific. The region is an atypical single-zinc RING-derived module. Gap OPEN -> NARROWING.
