  summary: 'Address PR #4152 re-review: ortholog script tests NCBI lineage for Mammalia; PAINT reason corrected'
  details: |
    panther_orthologs.py now tests every entry's NCBI lineage for class Mammalia and prints all organisms with their class (57/57 Mammalia), replacing a four-genus denylist; it asserts the query is not truncated. RESULTS.md was regenerated, and its PAINT note now gives the operative reason (the only experimental annotation is a protein binding IPI, which PAINT does not propagate). The receptor row links the mammal-wide ortholog result to the mouse hepatocyte claim in PMID:42225205 and quotes the InterPro signature line. Affinage review note corrected (HUVECs are not tumour cells).
