  summary: 'Address PR #4152 review: adjudicate PMID:42225205 and PMID:38806323; ortholog check shows ANXA2R is mammal-specific'
  details: |
    Added PMID:42225205 (hepatocyte ANXA2R downstream of muscle ANXA2; the in vivo deletion is of the ligand) and PMID:38806323 (methylation-driven downregulation, melanocyte apoptosis) to references and to the receptor-row reasoning. Softened the knowledge gap to "no receptor knockout". Noted that the IEA comes from the family-coextensive Pfam/InterPro signature. Added a reproducible PTHR38820 ortholog check (ANXA2R-bioinformatics) showing 92 members in 57 mammals, contradicting the human-specific claim; the description was corrected. Added PMID:25944712 (only MS detection). CNOT1 removal reworded to rest on uninformativeness.
- type: EDIT
