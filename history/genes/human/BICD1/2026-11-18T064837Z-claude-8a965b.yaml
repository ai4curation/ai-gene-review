  details: |
    Cytoskeletal adaptor (GO:0008093) worked example from the MOLECULAR_ADAPTOR_ACTIVITY worklist. Reviewed all 54 GOA annotations: ACCEPT 29, KEEP_AS_NON_CORE 17, MODIFY 2, REMOVE 2, MARK_AS_OVER_ANNOTATED 4. Legacy 1997-paper terms triaged: GO:0005200 structural constituent of cytoskeleton MODIFY -> GO:0008093 (BICD1 is an adaptor, not structural); GO:0006396 RNA processing and GO:0009653 morphogenesis MARK_AS_OVER_ANNOTATED; GO:0008298 mRNA localisation KEEP_AS_NON_CORE. protein binding: GSK3B (P49841) MODIFY -> GO:0019901 protein kinase binding; viral P08318 and STAT3 (P40763) REMOVE. Motor-side (dynactin/dynein/dynein IC binding) and cargo-side (Rab6 small GTPase binding) ACCEPTed as core, as is minus-end organelle transport. Core function: GO:0008093 cytoskeletal adaptor activity, grounded in PMID:12447383 and PMID:20089649 (verbatim quotes). Added notes and reference_review. Validates.
