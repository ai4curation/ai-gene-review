  summary: 'Create review: IL1B'
  details: |
    Created a de-novo human IL1B review for the IL-1 signaling module. Reviewed all 184 seeded GOA annotations, synthesized mature extracellular IL-1 beta cytokine activity in IL-1-mediated signaling as the core function, retained direct cytokine/receptor-binding/extracellular annotations, accepted or kept canonical downstream NF-kappaB/MAPK, LPS, cytokine-output, angiogenic, proliferative and immune readouts, and marked narrow target-cell metabolic, adhesion, neurogenesis and inflammasome-output rows as over-annotated with cluster-specific rationale. Modified over-general IL-1, NF-kappaB and ERK ancestor terms to the more specific child terms IL1B already carries, removed unsupported rows for wrong-reference PMID:28720735 and PMID:19593445, downgraded the PMID:26753638 neuroinflammation row, recorded structured source defects for the wrong or weak citations, and removed the secretory-granule row.
