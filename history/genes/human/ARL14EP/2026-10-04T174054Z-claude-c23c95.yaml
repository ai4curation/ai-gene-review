  summary: 'Review round 1: Q96T68 rows corrected to SETDB2; NEW histone binding and adaptor activity'
  details: |
    Reviewer noted the five "SETDB1" IPI rows are SETDB2 (Q96T68). Summaries renamed and now lead with the SETDB2 MBD/CRD crystal structure (PMID:38159574). NEW histone binding (IDA, PMID:31511512: recombinant C11orf46 recognizes H3 tail modifications on a peptide array and binds H3 independently of its CRD). NEW protein-macromolecule adaptor activity (IMP, PMID:21458045) as the ARL14-to-myosin 1E bridge, now a core function; cytoplasm row accepted as its location. Nucleus row quotes the immunohistochemistry result. ATF7IP REMOVE reason reworded around GO:0005515 policy. Suggested question added on why no chromatin process term is proposed.
