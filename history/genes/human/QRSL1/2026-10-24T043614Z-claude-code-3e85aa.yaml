  summary: 'Create: QRSL1 review'
  details: |
    De novo review of all 28 GOA annotations for human QRSL1 (Q9H0R6), the GatA glutaminase subunit of mitochondrial GatCAB. 8 protein-binding IPI rows (partners GATB, GATC) removed as uninformative, captured by GO:0030956. Obsolete GO:0070681 (3 rows) modified to GO:0019988 charged-tRNA amino acid modification, consistent with the GATC review and the QuickGO obsoletion comment; GO:0006412 modified to GO:0032543; GO:0003824 modified to GO:0004359; GO:0004359 kept as non-core because ammonia is channelled rather than released. Core function: contributes_to GO:0050567 in GO:0030956. Deep research (claude-code) ran only 2 web searches and was used as leads only. Added PMID:30283131 and PMID:26741492. Validated with just validate human QRSL1.
