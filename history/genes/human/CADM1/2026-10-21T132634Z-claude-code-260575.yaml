  summary: 'Create review: CADM1 (human reference for HORSE/CADM1)'
  details: |
    De-novo review of all 72 GOA annotations for human CADM1 (Q9BY67), independent of ProtNLM2 predictions; deep research (falcon, perplexity-lite fallback) failed on auth/quota so the review is built from cached literature and UniProt. Rodent Cadm1 transfers grounded by shared PANTHER subfamily PTHR45889:SF2 and PAINT nodes PTN002913382/PTN001910345. Accepted adhesion, CRTAM-ligand (signaling receptor binding, NK susceptibility) and PDZ-binding terms with human experimental evidence; kept synaptic/lymphoid-migration terms as rodent-inferred non-core; marked detection of stimulus and synaptic vesicle as over-annotated; refined cytokine production to type II interferon production; protein binding rows refined (CRTAM, CADM2, MPP3, DAL-1) or removed; recorded a WRONG_REFERENCE source defect for the UniProt MPP3 IPI keyed to PMID:29099056; added NEW cell-cell adhesion mediator activity (IDA, PMID:12050160).
