  summary: Review CHST14 dermatan sulfation and annotation evidence
  details: |
    Reviewed all 20 original CHST14 annotations with source objects and 11 original reference identities preserved. Defined dermatan GalNAc C4 sulfation and its Golgi biosynthetic role from human biochemical and cellular evidence. Refined broad annotations and the experimentally recorded CFTR interaction, retained exosome detection as non-core, and distinguished PAPS-contact predictions from phosphate-ion binding. Kept wild-type activity separate from Reactome's defective-mutant reaction. Added six references and source provenance; proposed no new annotation. Independent catalytic and whole-review peers and ROOT primary-evidence review passed. Normal validation, status and rendering passed before publication; existing source caches and unrelated work were preserved.
