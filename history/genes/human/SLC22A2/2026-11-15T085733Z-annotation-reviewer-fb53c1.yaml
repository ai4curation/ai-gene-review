  summary: De-novo review of all 111 GOA annotations for SLC22A2 (OCT2), renal polyspecific
    organic cation transporter
  details: |
    Reviewed every GOA row for SLC22A2 (O15244, OCT2). Electrogenic, Na+-independent facilitated UNIPORTER; renal proximal-tubule basolateral; first step in renal secretion of organic cations. Substrates: creatinine (clinically central), monoamines, metformin, cisplatin (nephrotoxicity), TEA/NMN/MPP+. Core MF (live, QuickGO non-obsolete; GO:0015101 organic cation TTA and GO:0015695 BP are OBSOLETE grouping terms): GO:0015651 quaternary ammonium group transmembrane transporter activity (TEA/NMN/MPP+/choline, IDA PMID:9260930) + GO:0008504 monoamine transmembrane transporter activity (extraneuronal uptake-2). Actions (111): 55 ACCEPT, 26 TOO_GENERAL (roots), 19 KEEP_AS_NON_CORE, 8 MARK_AS_OVER_ANNOTATED (amino-acid-specific terms from a low-affinity L-Arg Km>10mM study, dedicated CAT2 exists; pyrimidine-nucleoside drug-analog; detoxification), 3 REMOVE (GO:0072530 obsolete x2; GO:0098793 presynapse over-propagation - OCT2 is extraneuronal uptake-2 not presynaptic reuptake). proposed_new_terms: none (organic-cation grouping NTR dropped in harmonization; gap flagged as suggested_question). Review-response/harmonization (coordinator): core MF #1 changed from a re-proposed 'organic cation transmembrane transporter activity' NTR to the live GO:0015651 (OCT2 carries it by IDA), matching OCT1/OCT3 and following GO's intent (GO:0015101 was obsoleted as unnecessary). source_defects: none. Batch 13.
