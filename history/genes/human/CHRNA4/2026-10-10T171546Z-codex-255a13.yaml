  summary: Review CHRNA4 acetylcholine receptor function and evidence
  details: |
    Review all 100 original CHRNA4 annotations while preserving original source objects, two alternative-product records and 30 reference identity pairs. The final decisions are 57 ACCEPT, 21 KEEP_AS_NON_CORE, 18 MODIFY and four UNDECIDED, with no NEW assertion. Synthesize alpha4 contribution to acetylcholine-gated cation channels using human receptor electrophysiology and structure, retaining construct, stoichiometry and product limits. Refine broad channel and transport terms, distinguish presynaptic modulation of inhibitory currents from the receiving cell inhibitory conductance, and assess behavioral nicotine assertions at their source-specific experimental scope. Retain unresolved repair, stress, prenatal exposure and neuromuscular propagation evidence. Record bounded new cardiac tissue context without a new process or clinical-efficacy claim. Preserve the raw date-duplicate GOA rows, existing shared source caches and actual provider-failure receipts. Independent whole-gene review and normal validation, derived-status checking and rendering pass with nine explained advisories.
