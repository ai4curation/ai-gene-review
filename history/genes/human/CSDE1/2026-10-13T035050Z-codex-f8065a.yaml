  summary: Clarify CSDE1 RNA-binding core and complex identity
  details: |
    Direct mRNA recognition is now represented as a distinct core function alongside protein-RNA adaptor activity. The GO:0070937 IBA is removed because its c-MYC-complex identity mis-scopes c-FOS mCRD evidence; the existing correct GO:0106002 IBA remains, with the original node and donor preserved. RNA-silencing-complex association is explicit in the regulatory synthesis. Translation and deadenylation reasons distinguish direct molecular participation from protein-output assays and intrinsic nuclease catalysis. The description omits curation framing. All 31 original annotation objects, reference records, five products, source files and previous notes/history remain preserved; only notes are appended. No NEW assertion is introduced. Source-specific follow-up reading covered original mCRD, RISC and HCC Methods/Results and current ontology definitions.
