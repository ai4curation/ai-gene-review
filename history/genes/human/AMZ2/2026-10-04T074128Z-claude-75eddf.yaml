  summary: 'Round 2 (#4053 review): cite non-retracted testis expression source (PMID:17074343, UniProt), add CarG non-catalytic question, document zinc-ion-binding decision'
  details: |
    Replaced the unsupported testis-expression wording: it now cites PMID:17074343 and UniProt's TISSUE SPECIFICITY line, both independent of the withdrawn PMID:15972818. Added a suggested question on a possible non-catalytic nuclear role, based on the inactive bacterial archaemetzincin CarG (PMID:22937112). Noted in AMZ2-notes.md why GO:0008270 zinc ion binding was not proposed. Added the reproduce command to RESULTS.md.
