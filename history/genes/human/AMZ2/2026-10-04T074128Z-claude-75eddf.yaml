  summary: 'Initial review of human AMZ2: intact archaemetzincin zinc motif, InterPro
    peptidase IEAs accepted as predictions; the only activity paper is withdrawn'
  details: |
    Reviewed 4 GOA rows. PMID:15972818, the only AMZ2 activity report, was withdrawn in 2019 (PMID:30808005) and is marked is_invalid. A motif check (AMZ2-bioinformatics/zinc_motif_check.py) shows the three zinc-binding histidines are intact. The peptidase, metallopeptidase and proteolysis IEAs are accepted as family-level predictions. The HPA nucleoplasm IDA is accepted. No core function, no NEW terms; WHOLLY_DARK knowledge gap. The 2023 sperm-variant paper (PMID:37459044) is recorded as candidate-gene evidence only.
