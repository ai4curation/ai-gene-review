  summary: 'Create review: human GZMK'
  details: |
    First review of human GZMK (UniProtKB:P49863). All 37 GOA rows reviewed, plus one proposed NEW row. The richest record of the three granzymes in this batch, and the only one whose principal function was described in the last two years.

    Deep research attempted and failed: falcon is not registered in this environment, and the openscientist run was stopped by the session's background limit after about fifty minutes without producing output (exit 143). No -deep-research-*.md file was written; the manual research is in GZMK-notes.md with inline provenance.

    Core function: GO:0004252 serine-type endopeptidase activity, as a tryptase whose specificity rests on exosite contacts rather than a P1 consensus. The review's frame is the shift in this protein's reading from cytotoxin to extracellular pro-inflammatory enzyme, which the receptor paper states in its own conclusion.

    Accepted as core: the three GO:0160257 complement activation, GZMK pathway rows - a term GO created for this gene in 2025 - plus the five GO:0050729 inflammatory-response rows, both GO:0031638 zymogen activation rows, all three GO:0051604 protein maturation rows, GO:0008228 opsonization, GO:0005539 glycosaminoglycan binding and the cell-surface and extracellular rows.

    Kept as non-core: GO:0090200 positive regulation of cytochrome c release and the GO:0140507 IBA. Both are true and directly shown, through Bid cleavage, but the weight of the 2014-2025 literature is extracellular and the record should not present the two arms as equally central. This is the opposite adjustment from the one made on granzymes H and M in the same batch, where that term was added because it was missing; the asymmetry is explained in each review.

    Proposed (1 row): GO:0044194 cytolytic granule (IDA, PMID:3262682), the same gap as on granzyme M and from the gene's own 1988 esterase-purification paper, which localised the activity to the cytoplasmic granules. GOA currently cites that paper for extracellular region instead, which is a poor fit for what it reports.

    Removed: the single GO:0005515 protein binding row under the protein-binding policy. This record has informative binding terms already - glycosaminoglycan binding, cell surface, symbiont cell surface - so nothing is lost.

    Source defect, and the main finding of this review. UniProt CC:FUNCTION says GZMK "First acts as a pattern recognition receptor, which specifically recognizes and binds heparan sulfate glycosaminoglycans on the pathogen surface to drive opsonization (PubMed:39914456)". The full text of that paper was read for this review. Heparan sulfate is a host glycosaminoglycan and bacteria do not display it; the binding experiments are on human endothelial cells, synovial fibroblasts and monocytes; and the paper's only mention of pattern recognition receptors is background about the soluble receptors that start the classical and lectin pathways, which the authors contrast with GZMK. Counted across the whole text, "pathogen" appears six times - twice in "disease pathogenesis", once as "pathogenesis", three times in the mouse housing description - and no microbe is assayed. The statement looks like a conflation with PMID:24711407, cited elsewhere in the same block, which does show binding to Gram-negative bacteria and LPS. Recorded as WRONG_STATEMENT against UNIPROT at PROBABLE with requested_change CHECK, because how to split the sentence between its two sources is UniProt's call.

    Two GOA rows inherit that framing and were handled without changing their terms, since both claims are true of the gene: GO:0038187 pattern recognition receptor activity (the PAMP is LPS, from PMID:24711407, not heparan sulfate) and one of the two GO:0106139 symbiont cell surface rows. Both are accepted with their support re-pointed to the paper that establishes them, and the mismatch recorded in the reason and in the reference review.

    Two NEW proposals were considered and declined on comparator checks, both run by term id with verified positive controls. GO:0070493 thrombin-activated receptor signaling pathway: thrombin itself carries it, so the convention admits the activating protease, but the definition is specific to thrombin binding its receptor. GO:0032755 and GO:0032757 (positive regulation of IL-6 and IL-8 production): thrombin, the closest same-role comparator, carries neither, nor GO:0050729 - for receptor-activating proteases GO annotates the receptor and the downstream signalling. Recorded in the notes and raised as suggested questions rather than asserted.

    Ontology observation raised as a question rather than a defect: GO:0160257 is defined as a pathway "which allows for the direct killing of microbes and the regulation of other immune processes", but neither paper behind the term shows microbial killing - both are disease studies and the knockout phenotype is protection from inflammation.

    Validation: just validate clean, 62 quotes verified, record sections backfilled.
