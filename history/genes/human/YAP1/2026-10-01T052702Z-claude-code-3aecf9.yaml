  summary: 'Create review: YAP1'
  details: |
    Created a DRAFT review of human YAP1 covering all 314 GOA rows, as part of Track B of ORIGINS_OF_MULTICELLULARITY. Coactivator, TEAD-YAP complex, hippo signaling, nuclear/cytoplasmic localization and PPxY binding accepted as core. Protein-binding IPI rows were replaced with DNA-binding transcription factor binding (TEAD/p73 partners) or 14-3-3 protein binding where supported, and otherwise removed as uninformative. Sequence-specific DNA-binding rows were removed because YAP1 lacks a DNA-binding domain. Animal tissue-growth and differentiation processes were kept as non-core. The description and core functions add Capsaspora coYki evidence that TEAD coactivation under Hippo control is ancestral while proliferation control is an animal innovation.
