  details: |
    Re-review of the IBA REMOVEs on GO:0015116 (IBD at PTN000929279) and GO:1902358 (IBD at PTN000212046). Both stand on direct negative evidence on pendrin (PMID:10192399, no sulfate transport in oocytes or Sf9 cells). The old reasons said the whole metazoan chloride/bicarbonate exchanger branch PTN000929177 lost sulfate cargo. That misstated the tree: SLC26A2, SLC26A6, SLC26A7 and SLC26A8 are seeds of these nodes and sit with pendrin in the vertebrate SLC26 radiation PTN002273826. Reasons and source comments now place the loss at the pendrin clade PTN002624472 (26 leaves, vertebrate SLC26A4 orthologs). No action changed; quotes untouched.
