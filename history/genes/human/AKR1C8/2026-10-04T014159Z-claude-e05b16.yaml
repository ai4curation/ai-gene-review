    GO:0016491 no longer cites the disputed affinage PGFS sentence; it cites affinage's GO grounding line and UniProt PE 1. The core MF is now GO:0016616 (CH-OH donor, NAD or NADP acceptor), verified via OLS as an ancestor of both GO:0008106 and GO:0047023. GO:0047023 moves from MARK_AS_OVER_ANNOTATED to MODIFY, generalizing to GO:0016616. PE 1 is folded in, and the expression question is narrowed to tissue, abundance and isoform. The description now carries the pig orthology caveat. The tetrad_check.py docstring has the correct run command.
