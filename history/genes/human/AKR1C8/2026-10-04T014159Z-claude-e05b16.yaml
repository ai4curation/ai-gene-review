  summary: 'Review human AKR1C8: an uncharacterized AKR1C paralog with an intact catalytic
    tetrad'
  details: |
    12 GOA rows (2 ACCEPT, 1 KEEP_AS_NON_CORE, 4 MARK_AS_OVER_ANNOTATED, 5 REMOVE); no NEW. A reproducible tetrad check (AKR1C8-bioinformatics) shows D53/Y58/K87/H120 conserved, supporting generic oxidoreductase activity. ARBA substrate and pathway terms are marked over-annotated because no substrate has been tested and AKR1C paralogs diverge in specificity. Pig PGFS (AKR1CL1 in GenBank) evidence is recorded as an MF_DARK gap, since its orthology to human AKR1C8 is not established.
