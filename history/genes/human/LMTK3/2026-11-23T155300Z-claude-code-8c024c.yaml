  summary: 'Fix obsolete GO term on NEW row: LMTK3'
  details: |
    Corrected an obsolete GO term asserted on a manually added NEW row (issue #6783).
    The row used GO:1905750 negative regulation of endosome to plasma membrane protein transport,
    obsoleted by GO on 2026-09-20 because the regulated process GO:0099638 was itself obsoleted and
    replaced by GO:0032456 endosome to plasma membrane transport, with replaced_by GO:2001136.
    Verified against the QuickGO term history for GO:1905750 on 2026-11-23 (the returned id was
    GO:1905750 itself, not a silently resolved merge target). Validation did not catch it because
    existing_annotations[].term.id is deliberately not hard-validated, and the row still carried the
    pre-obsoletion label.
    Decision: kept the row and swapped the term to GO:2001136 negative regulation of endosome to
    plasma membrane transport, in both places the obsolete id appeared, the annotation row and the
    directly_involved_in list of the RAB11FIP1/RCP core function. This obsoletion was a consequence
    of restructuring the regulated process, not a judgement that the claim was wrong: GO:2001136
    negatively regulates GO:0032456, whose definition is the recycling of internalized transmembrane
    proteins back to the plasma membrane, exactly the EPHA2 recycling route measured in
    PMID:28294115. The dropped "protein" qualifier was redundant with that definition, and the cargo
    identity remains explicit in the has_input (RO:0002233) extension naming UniProtKB:P29317.
    One expected warning remains: just validate human LMTK3 reports a label mismatch for GO:2001136
    because the committed shared term cache (cache/go/terms.csv, snapshot 2026-09-12) predates GO's
    rename of that term on 2026-10-20, when "negative regulation of endocytic recycling" became a
    narrow synonym. The label written here is GO's current one; the stale cache is deliberately not
    touched, since shared single-file caches are refreshed in dedicated refresh PRs.
    A dated correction section was added to LMTK3-notes.md, and the pre-existing notes line that
    named the old id now points to the new one. No evidence, supporting_text quote, extension or
    reference was changed. LMTK3's other validation warnings are pre-existing UniProt-label quotes.
