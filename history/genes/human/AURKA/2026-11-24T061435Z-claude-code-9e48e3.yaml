  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H13). GO:0032133 chromosome passenger complex (IBD at PANTHER:PTN000681967) keeps MARK_AS_OVER_ANNOTATED; the reason, which held only two UniProt location quotes, was rewritten and a quote from PMID:19357306 added. The nine seeds are Aurora-B-type CPC kinases; human AURKA is in the vertebrate AURKA clade PTN004696469, sister of the seeded AURKB and AURKC clade PTN002806146 under the duplication node PTN000681971. Doubt is specific to the target: PMID:19357306 reports that Aurora-A joins INCENP and survivin only with the G198N change, while PMID:29187526 reports an association of Aurora A with INCENP in mitosis, so the row is neither removed nor accepted. Both papers read as abstracts only. Existing quotes unchanged.
