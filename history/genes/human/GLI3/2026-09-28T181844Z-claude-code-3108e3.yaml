  summary: 'Create review: GLI3'
  details: |
    Reviewed all 124 seeded annotations (ACCEPT 78, MODIFY 23, KEEP_AS_NON_CORE 18, REMOVE 5; no UNDECIDED, no NEW). Wrote the top-level description covering both GLI3 products: the full-length activator (UniProtKB:P10071-PRO_0000047202) and the PKA/CK1/GSK3- and SCF(beta-TrCP)-generated N-terminal repressor GLI3R (UniProtKB:P10071-PRO_0000406137). Populated core_functions with three GO-CAM-like entries: GO:0000978 GLI-site DNA binding, GO:0001227 repressor activity for GLI3R (GO:0045879 / GO:0000122, nucleus, in transcription repressor complex GO:0017053), and GO:0001228 activator activity for the full-length form (GO:0007224 / GO:0045944, nucleus), matching gocams 693b3c0900000157 and 693b3c0900001501 and the ci_gli_repressor annoton of modules/hedgehog_signaling.yaml. MODIFY proposals raise the four generic GO:0003700 rows to the form-specific GO:0001227/GO:0001228, lift generic transcription-regulation and DNA-binding parents to GO:0006357/GO:0000122/GO:0045944/GO:1990837, and replace 11 of the 16 uninformative GO:0005515 rows with evidence-backed partner-class terms (GO:0008134, GO:0001222, GO:0031625, GO:0036033, GO:0019894); the five SUFU and DZIP1 protein-binding rows were removed as uninformative, with the GLI-SUFU association retained via GO:1990788. Developmental and thymic outcome terms kept as non-core. Added GLI3-notes.md with inline verbatim citations, plus suggested_questions and suggested_experiments.
