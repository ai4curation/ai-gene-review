  summary: 'Create review: AP3S1'
  details: |
    Full review of the 30 GOA rows for human AP3S1 (sigma3A, Q92572), plus one NEW row. Actions: ACCEPT 13, KEEP_AS_NON_CORE 12, MODIFY 3, MARK_AS_OVER_ANNOTATED 1, REMOVE 1, NEW 1. The single IBA (GO:0016192, PANTHER node PTN000204281 of PTHR11753, 11 gene-level donors spanning AP-1, AP-2 and AP-3 sigmas) was graded NO_FAILURE_CORE: the donors disagree on pathway so vesicle-mediated transport is their correct least common ancestor, and Q92572 is not among the IBD seeds so the row is not self-referential. GO:0035651 AP-3 adaptor complex binding was REMOVEd as a role conflation, a defect shared by all seven human AP-3 subunit genes; the bare tyrosinase protein-binding IPI was MODIFYed to GO:0140312 cargo adaptor activity; GO:0006896 was MODIFYed to GO:0008333 (the InterPro mapping carries the fungal donor compartment); and GO:0016183 was MODIFYed to GO:0016182 (the terms definition describes plasma-membrane coated pits). One NEW row, GO:0005198 structural molecule activity by IDA from the human AP-3 cryo-EM structure that contains this protein as chain S. A new bioinformatics analysis verifies the five literature-named sigma3A pocket residues on the live sequence, reproduces the published sigma2-to-sigma3A correspondences, and reports two negative results: the verified non-binder sigma4 scores as well at the pocket as the binders, and sigma3A and sigma3B are identical at every pocket position. Validated with just validate (clean), checkquotes.py (168 quotes, 0 failures), the residue-claim validator (3 claims, all passing) and a scripted GOA-row to YAML-entry reconciliation that also asserts every propagation_review source_entities list equals its rows supporting_entities.
