  summary: 'Create review: DTD1 canonical product Q8TEA8'
  details: |
    New review of the canonical DTD1 product Q8TEA8 in genes/human/DTD1__Q8TEA8, the same-gene reference for the HORSE40 ProtNLM2 benchmark product A0A2R8YCT7, done independently of ProtNLM2 output. All 14 GOA rows reviewed. Deacylase MF rows (GO:0051499, GO:0051500 IBA, GO:0106026) and GO:0106074 accepted. The human core activity is from PMID:17264083 and the cellular D-amino-acid protection from PMID:18700836. Gly-tRNA(Ala) activity is inferred from SF5 orthologs including zebrafish dtd1 (PMID:28362257); PAINT did not propagate it by IBA. GO:0002161 modified to GO:0051499 and GO:0006399 modified to GO:0106074 (correct but general). Cytoplasm and nucleus accepted. DNA binding (EXP) and mitochondrion (HTP) kept as non-core. The single-lab DNA-replication role was left as a suggested question, not annotated. Falcon and perplexity-lite deep research both failed (auth/quota); recorded in notes.
