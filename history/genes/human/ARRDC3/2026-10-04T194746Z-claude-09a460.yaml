  - existing_annotations
  - core_functions
  - references
  - suggested_questions
  summary: 'Address PR #4208 review: cite cached and deep-research papers, adjudicate thermogenesis mechanism'
  details: |
    The ADRB2 rows now cite the PMID:25220262 basic-patch result and the ligand-independent binding in PMID:27226565. Cached and cited nine deep-research papers: PAR1/ALIX/WWP2 (PMID:26490116, PMID:29348172), Nedd4 WW Kd (PMID:24379409), YAP/ITCH (PMID:29416926), TAZ sequestration (PMID:33722977), ARRDC3 ubiquitination and the Y394 switch (PMID:37223976, PMID:40409556), and adipocyte deletion (PMID:28291835). The PMID:21982743 beta-adrenergic mechanism finding is marked DISPUTED, and the thermogenesis rows no longer assert it. The Hippo IMP row now quotes its own full-text reference, PMID:24114784. GO:0051443 is changed to MARK_AS_OVER_ANNOTATED. Added NEW GO:0016567 protein ubiquitination (IMP, ALIX), after a comparator check against ARRDC1/4 and ARRB1/2. PMID:23886940 gets a reference_review, the IBA comments are row-specific, and the deep-research reference_review is corrected. The description, core function and questions are updated.
