  summary: 'Initial review of human ARRDC3: alpha-arrestin NEDD4-family substrate
    adaptor for beta-adrenergic receptors'
  details: |
    95 GOA rows. Plasma membrane, endosome, early endosome and beta-3 adrenergic receptor binding accepted; molecular adaptor activity modified to ubiquitin-like ligase-substrate adaptor activity; HECT E3, ADRB2 and ITGB4 binding rows modified to specific binding terms; remaining protein binding removed; lysosome, cytoplasm, Hippo, ubiquitin-transferase regulation and thermogenesis non-core.
- type: EDIT
  outcome: changed
  sections:
