    Re-review of the four IBA rows marked REMOVE (projects/IBA_REVIEW/rereview-2026-11-21, batch H02) against the PANTHER tree (family PTHR22802 in the cached tree; the review text calls it PTHR22803, the id under which the entries file is stored). GO:0005537 D-mannose binding and GO:0042806 fucose binding keep REMOVE: the single seed CLEC17A sits in PTN008374124 (10 leaves) and ASGR2 sits in the sister clade PTN008374126 (32 leaves) of galactose and GalNAc specific lectins, so the IBD at PTN004568004 is one split too deep. GO:0038187 pattern recognition receptor activity keeps REMOVE: every experimentally annotated family member other than ASGR1 itself is in the myeloid CLEC4D/CLEC4E/CLEC6A clade PTN009053172, across the PTN008582225 split from the ASGR clade PTN009053161. GO:0006955 immune response was changed from REMOVE to MARK_AS_OVER_ANNOTATED: the IBD at PTN001105054 (654 leaves) is seeded in several lineages including invertebrates, no loss is shown for the ASGR clade, and the earlier reason rested on the receptor having a different known role, which is not a ground for removing an IBA. Seed positions were read with QuickGO queried by GO id with descendants over all leaves under the node. Supporting quotes unchanged. Validated with just validate human ASGR2.
