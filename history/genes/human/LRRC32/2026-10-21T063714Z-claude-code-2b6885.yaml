  summary: 'Create review: LRRC32'
  details: |
    New review of the 29 GOA annotations for LRRC32 (GARP), the cell-surface docking receptor for latent TGF-beta on regulatory T cells and platelets. Accepted TGF-beta binding, receptor ligand inhibitor activity, plasma membrane, cell surface, and establishment of protein localization to extracellular region; refined generic protein-binding rows (TGFB1/TGFB2 partners) to TGF-beta binding and removed the remaining generic and interactome rows; removed the nucleoplasm HPA row as topologically inconsistent; marked family-propagated signaling receptor activity as over-annotated (GARP presents rather than transduces); kept TGF-beta signaling, negative regulation and palate development as non-core. Localization is genuine cell surface with LRR ectodomain exposed. Deep research providers were unavailable; notes from literature and UniProt.
