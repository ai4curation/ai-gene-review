  summary: 'Create review: TLR3'
  details: |
    Reviewed all 126 existing GOA annotations for human TLR3 (O15455), the endosomal dsRNA-sensing Toll-like receptor. Wrote a standalone description, three core_functions (GO:0038187 PRR activity, GO:0003725 dsRNA binding, GO:0004888 transmembrane signalling receptor activity), suggested_questions and suggested_experiments. Key decisions: accepted dsRNA binding/PRR activity/TRIF-dependent signalling and endosomal locations as core; MODIFY identical protein binding to protein homodimerization activity (functional ligand-driven dimer) and NIK activation to canonical NF-kappaB; REMOVE generic protein-binding IPI rows (PIK3R1, TICAM1, WDFY1, UNC93B1) as uninformative, plus defense response to bacterium (TLR2/lipoprotein paper) and hyperosmotic response (unsupported); split plasma-membrane rows so is_active_in (IBA/IDA/IEA) is MARK_AS_OVER_ANNOTATED while located_in (TAS) is non-core, since TLR3 signals from acidified endosomes; UNDECIDED for cellular response to mechanical stimulus (PMID:19593445 full text is about BAD/prostate cancer, no TLR3) and positive regulation of angiogenesis (untraceable source). Falcon deep research failed (exit 1); review based on cached publications and UniProt. Validation passes with one biologically-justified consistency warning; all 235 supporting_text quotes verified as verbatim.
