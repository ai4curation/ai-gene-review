  details: |
    Compared the completed TLR3 review with TLR3-deep-research-falcon.md. The report agrees on endosomal acidic-pH dsRNA sensing, UNC93B1 trafficking, backbone-contacting LRR ectodomain recognition, the 40-50 bp dimer minimum, and TRIF-dependent IRF3 and NF-kappaB branches with RIPK3 necroptosis, so no annotation action, term, description or core function was changed. Two report claims could not be verified against a primary paper and were recorded as suggested_questions instead: lateral higher-order multimerisation of TLR3 dimers along long dsRNA, and a reported TRIF-dependent MyD88 contribution in mouse macrophages. A corroborating file: citation to the deep-research report was added to the supported_by of the GO:0003725 IDA row. The report's framing of functional cell-surface TLR3 conflicts with the MARK_AS_OVER_ANNOTATED is_active_in plasma membrane rows; it is supported only by secondary reviews, so the decision stands and the existing suggested question covers it. Notes file updated with a Deep-research cross-check (2026-09-30) section, replacing the statement that deep research had failed. just validate human TLR3 passes with no errors; the one warning about split plasma-membrane actions pre-dates this session.
