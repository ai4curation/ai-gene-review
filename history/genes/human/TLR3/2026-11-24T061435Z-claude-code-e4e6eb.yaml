  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H13). GO:0005886 plasma membrane, is_active_in (IBD at PANTHER:PTN001224703) keeps MARK_AS_OVER_ANNOTATED; summary, reason and the propagation_review source entry rewritten. The earlier text said the IBA reflects the surface receptors TLR1, TLR2, TLR4, TLR5 and TLR6 and that the node could not be recovered. Those receptors are not in this family. The node (676 leaves) is near the root of the leucine-rich repeat family PTHR24373 and has 23 seeds, cell-surface LRR proteins of many kinds and TLR3 itself through its own IDA row. The ground is doubt on the target (signalling from acidic endosomes, PMID:21266579), not placement. Actions of the IDA, IEA and TAS rows on the same term were not changed.
