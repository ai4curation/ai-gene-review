  summary: 'Correct GZMB: propose defense response to bacterium after a broken comparator
    check'
  details: |
    Reverses a decision in the GZMB review of earlier today and records why it was wrong.

    That review declined to propose GO:0042742 defense response to bacterium for granzyme B, despite accepting the evidence that it disassembles bacterial ribosomes and blocks bacterial protein synthesis (PMID:29107333). The stated reason was a comparator check reporting that none of GZMB, GZMA, GNLY or PRF1 carries any bacterial or antimicrobial defense term, which was read as a convention about granule effectors rather than a gap.

    The check was broken. It queried QuickGO for each gene's biological-process annotations and filtered the results on the term-name field, which that query shape returns empty, so the filter matched nothing and would have reported an absence whatever the truth was. Re-run by explicit term id, GNLY carries GO:0042742 by IDA together with GO:0031640 killing of cells of another organism and GO:0061844, and GSDMB carries GO:0042742 by IBA. There is no convention excluding granule effectors.

    Changes: GO:0042742 added as a NEW row with the Dotiwala substrate and ribosome-disassembly evidence; the GO:0017148 negative regulation of translation row's reasoning corrected, since it had asserted the antibacterial arm had no annotatable home at all; and the suggested question that rested on the same broken check rewritten to ask instead whether granzyme A and perforin should follow, noting that perforin's contribution is to give another effector access rather than to attack the microbe itself.

    What the earlier review got right and keeps: the comparator check as a method, and the GO:0017148 point that GO has a symbiont-suppresses-host translation family but no host-suppresses-symbiont counterpart, so the plain regulatory term still cannot say whose translation is blocked.

    The lesson is narrower than cheap scepticism about comparator checks. The query returned 200 results and no error; the only visible symptom was an unexpectedly clean negative across four genes, which I read as a finding instead of as a reason to confirm the query could ever return a positive.
