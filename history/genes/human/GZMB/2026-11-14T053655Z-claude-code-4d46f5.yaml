  summary: 'Create: human GZMB (granzyme B) review'
  details: |
    First review of human GZMB (UniProtKB:P10144). 51 GOA rows reviewed plus one proposed: 42 ACCEPT, 3 REMOVE, 3 TOO_GENERAL, 1 MARK_AS_OVER_ANNOTATED, 1 KEEP_AS_NON_CORE, 1 MODIFY, 1 NEW. 103 quotes verified verbatim. Selected because it was the gene I had to mark NO_GENE_REVIEW in two perforin GO-CAMs, and because it was the comparator that justified proposing GO:0042267 for PRF1.

    No deep research file: the providers are unavailable in this environment, as for PRF1. Research done by hand from the cached publications, UniProt, Reactome and QuickGO.

    One core function: GO:0004252 serine-type endopeptidase activity. GZMB is a one-activity enzyme, an Asp-ase, and GO has no granzyme-specific MF term, so that generic term is as precise as the ontology allows. Everything else is the same reaction on a different substrate, and the distinction that matters when reading the record is activating cleavage (protein maturation) versus destructive cleavage (catabolism).

    MODIFY: GO:1903749 is obsolete with no replacement and no consider term (verified in QuickGO rather than assumed). The underlying Reactome claim, that GZMB cleaves BID to tBID which translocates to mitochondria, is sound, so proposed GO:1901030 positive regulation of mitochondrial outer membrane permeabilization involved in apoptotic signaling pathway as the current term.

    NEW: GO:0022617 extracellular matrix disassembly. PMID:8258716 is a dedicated paper on GZMB degrading cartilage aggrecan and is already cited three times on this record, but never for a process. Comparator check supports it: the term's 42 human genes include the aggrecanases ADAMTS4/5 and the other immune granule serine proteases (chymase, cathepsin G, elastase, tryptase); GZMB is the one missing.

    A NEW I considered and rejected on comparator grounds: defense response to bacterium. GZMB demonstrably kills bacteria by cleaving their translation machinery (PMID:29107333), but none of GZMB, GZMA, GNLY or PRF1 carries any bacterial or antimicrobial defense term, so the absence is systematic across all four granule effectors and reads as a convention rather than a gap. Raised as a question instead. GO:0008656 caspase-activator activity was likewise raised rather than asserted.

    Three rows cite granzyme A papers (GO:0001772 and GO:0006915 from PMID:12524539; GO:0005634 from PMID:11909973). All three claims are true of granzyme B and supported by other references here, so they were ACCEPTed with the references flagged MISCITED, not removed on the strength of an abstract.

    Contrast worth recording: GO:0006915 apoptotic process was MODIFYed away on PRF1 but ACCEPTed here, because granzyme B executes steps of the programme while perforin only opens the door.
