  summary: 'Create review: GPC3 (reference ortholog for HORSE/GPC3)'
  details: |
    De-novo review of human GPC3 (P51654), done independently of ProtNLM2 predictions, as the experimentally characterised PTHR10822:SF4 ortholog of HORSE/GPC3. Falcon deep research failed (Edison 403 auth) and the perplexity-lite fallback failed; review built from cached literature and UniProt. All 78 GOA rows reviewed: plasma membrane/cell surface and Wnt-regulation rows accepted (human IDA/EXP plus PAINT nodes PTN002585559, PTN000850517); mouse-ISS negative regulation of smoothened accepted with species basis stated; GO:0060422 modified to peptidase inhibitor activity because DPP4 is an N-terminal dipeptidyl-peptidase; developmental knockout/morphant phenotype rows (coronary vasculature, gastrulation cell migration, anatomical structure morphogenesis) marked over-annotated; kidney rows non-core; uninformative protein-binding rows removed or modified to protease binding. Added NEW frizzled binding, Wnt-protein binding (human IDA) and hedgehog family protein binding (ISS from mouse).
