  summary: 'Create review: CDK16'
  details: |
    De-novo review of human CDK16 (PCTAIRE-1, Q00536) as the experimentally characterised comparator for the BALMU A0A8B8WEG2 CDK16 model. Falcon deep research failed (authentication error), so the review uses cached GOA-cited and additional CDK16 publications, the UniProt record and PTHR24056 PAINT data. All 65 GOA rows reviewed: kinase MF refined to cyclin-dependent Ser/Thr kinase activity; rodent-derived exocytosis, growth hormone secretion and neuron projection development rows recast as regulation terms; CMGC-wide nucleus IBA marked over-annotated; protein-binding rows modified to cyclin binding or 14-3-3 protein binding, or removed.
