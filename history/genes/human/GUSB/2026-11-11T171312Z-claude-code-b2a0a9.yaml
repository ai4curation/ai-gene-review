    - GO:0030246 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree the single seed is a one-to-one ortholog of GUSB, so the transfer itself is close; the objection is that the binding term is subsumed by the catalytic activity, which the tree cannot settle.

