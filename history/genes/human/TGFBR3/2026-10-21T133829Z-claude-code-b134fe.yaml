  summary: 'Create review: TGFBR3 (reference ortholog for EQUAS TGFBR3)'
  details: |
    De-novo review of all 127 GOA rows for human TGFBR3 (Q03167), independent of ProtNLM2 predictions, as the experimentally characterised reference for donkey TGFBR3 (A0A8C4M6Z6; same PANTHER subfamily PTHR14002:SF7 and PAINT clade PTN002678643). Deep research failed (falcon auth, perplexity quota), so the review rests on cached literature, UniProt, PAINT and Reactome. GO:0005024 rows modified to the type III child GO:0070123 (no kinase domain); generic protein-binding IPIs converted to inhibin complex, TGF-beta, PDZ domain and arrestin family protein binding (FGFR4 screen hit removed); GAG/heparin binding marked over-annotated (covalent GAG substitution, not binding); Reactome cytosol and SNP-association immune response removed; mouse knockout-derived fine-grained cardiac/hematopoietic ISS terms marked over-annotated as phenotypes rather than participation; NEW negative regulation of activin receptor signaling (inhibin coreceptor). Added mouse developmental and inhibin papers to references, and created the notes file.
