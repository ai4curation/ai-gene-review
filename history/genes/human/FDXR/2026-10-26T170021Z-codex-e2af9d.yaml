  summary: Review FDXR ferredoxin reduction, steroid synthesis and ubiquinone evidence
  details: |
    FDXR transfers electrons from NADPH to ferredoxins, supporting mitochondrial steroid and ubiquinone biosynthesis. This review separates that conserved redox activity from source-specific localization inference and splice-product targeting. All 27 imported contexts are reviewed: 25 ACCEPT, one KEEP_AS_NON_CORE and one TOO_GENERAL. Preserve all source objects/order, seven seeded products and 19 original reference identities/findings; add four whole reference assessments for 23 total. Keep one conservative ferredoxin-NADP+ reductase core. Distinguish ancestral COQ6 reconstitution from extant-human assays, and tagged-cell isoform targeting from endogenous cleavage/topology. No NEW annotation or quotation. All six canonical checks pass, covering standard validation, strict GOA, authored terms, focused components, computed status and rendering; all 56 narratives render. COMPLETE has zero review advisories. Reference checks verify nine PMID titles and perform zero snippet comparisons because no quotation is present. All 31 normal sources and both machine snapshots remain exact. Genuine Falcon and Perplexity attempts failed authentication/quota; no provider report was fabricated.
