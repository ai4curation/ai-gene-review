  summary: 'Retrospective audit corrections: SUCLG2'
  details: |
    Corrections after a retrospective audit (2026-11-12) of the succinyl-CoA synthetase reviews (eleven subunit reviews, the families PTHR11117 and PTHR11815, and the tca_cycle module), followed by a cross-file consistency pass. This record supersedes the reading in the 2026-11-11 records where they differ. No annotation action changed. GO:0003824 catalytic activity (IEA) stays TOO_GENERAL; the reason is now worded the same way in all eleven subunit reviews (true but uninformative, entailed by the accepted specific activity). Statements corrected: Gln20 is not confined to the clade under PTN000929335 and does not by itself mark GDP specificity (PMID:18452512 added and quoted on the NOT GO:0004775 row, which stays ACCEPT); GDP specificity is no longer called a derived state. Status INITIALIZED -> DRAFT. Knowledge gap dark_aspect BP_DARK -> RESIDUAL_SUBGAP. Reference verdicts: PMID:34415331 UNVERIFIED -> VERIFIED, PMID:28380382 VERIFIED -> UNVERIFIED, Affinage DISPUTED -> LOW_QUALITY with the dispute on its GO-grounding finding; its supported_by entry on the GO:0005739 IBA row was removed (the row keeps PMID:25370487 and PMID:30470562). The notes line on a curated rule for the InterPro2GO ATP binding mapping now limits the claim to the characterised pig and human members and names the misplaced Xanthomonas and Ustilago leaves. Validated with just validate human SUCLG2; one advisory warning (no annotation cites the Affinage file) follows from the removal and is accepted.
