  details: |
    Written as part of the evolutionary review of the succinyl-CoA synthetase subunit families PTHR11117 and PTHR11815, using the family analysis in genes/yeast/LSC2/LSC2-bioinformatics. All 32 GOA rows reviewed. GDP-forming activity accepted as core; the NOT ADP-forming IBA accepted on descent, the Gln20 residue and orthologous enzymes; ATP binding from the ATP-grasp signature modified to GTP binding; the parent complex IBA marked too general; protein binding rows removed under the policy. Affinage record fetched and reviewed as a reference (DISPUTED grounding; no annotation imported). One knowledge gap on the role of the GTP-forming enzyme. Validated with just validate human SUCLG2.
