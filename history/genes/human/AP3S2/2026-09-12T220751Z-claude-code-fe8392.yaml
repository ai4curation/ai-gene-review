  summary: 'Create review: AP3S2'
  details: |
    Full review of human AP3S2 (sigma-3B, P59780), a near-dark AP-3 small subunit with 25 GOA rows, one IBA and a single experimental annotation. All 25 rows reviewed (ACCEPT 12, KEEP_AS_NON_CORE 8, MODIFY 3, MARK_AS_OVER_ANNOTATED 2) plus 2 NEW rows, with propagation_review and script-built source_entities on all 16 rows carrying a WITH/FROM. The IBA on PTHR11753 node PTN000204281 was graded NO_FAILURE_CORE after resolving all ten IBD seeds, two of which are AP-3 sigma orthologs; the parent process term is the correct LCA because the seeds disagree about destination. Established that no row transfers from the paralog AP3S1: the ISS/IEA donors are mouse and rat Ap3s2, and human and mouse AP3S2 are byte-for-byte identical. The decisive literature find, missed by the automated deep research, is PMID:14691137, which tested a delta-sigma3B hemicomplex directly and showed it binds the LIMP-II acidic dileucine signal with the same residue requirements as delta-sigma3A; a live-fetch alignment confirms AP3S2 retains sigma-3A Val94 and Leu109. Three MODIFY calls follow from reading term definitions rather than labels (GO:0016183 to GO:0016182, GO:0035654 to GO:0035459, GO:0006896 to GO:0008333), and GO:0035615 was deliberately not reused from the merged AP1S1/AP1S3 reviews because its definition commits to clathrin, which AP-3 does not use. Five knowledge_gaps are the main deliverable. Validated with just validate (Valid, no warnings), checkquotes.py (134 quotes, 0 failures), a GOA-to-YAML reconciliation script, a YAML duplicate-key check, and cache/go/terms.csv deletion and duplicate checks.
