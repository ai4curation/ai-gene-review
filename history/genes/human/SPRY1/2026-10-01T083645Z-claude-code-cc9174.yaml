  summary: 'SPRY1: drop GRB2-sequestration proposal after OpenScientist; core MF is
    inherited kinase inhibitor activity'
  details: |
    OpenScientist (2 iterations; report SPRY1-hypotheses/spry1-grb2-sh3-motif/openscientist.md) found SPRY1 lacks the C-terminal PxxPxR GRB2 SH3 motif, which is exclusive to SPRY2. SPRY1-GRB2 binding is supported only by an abstract-only paper and is disputed (Gross 2001), and GRB2 binding is dispensable for ERK inhibition even in SPRY2 (Martinez 2007, PMID:17689925). Changes:
    - Deleted the NEW GO:0140311 annotation.
    - Changed the IBA GO:0004860 from KEEP_AS_NON_CORE to ACCEPT and made it the core MF.
    - Rewrote the description to present GRB2 binding as contested.
    - Cited the report, Martinez 2007 and Lao 2007 (PMID:17255109); both PMIDs were PubMed-verified and cached.
