  summary: Benchmark local DeepTMHMM2 CPU inference on SPTLC2 and DPM1
  details: |
    Created an isolated, version-pinned DeepTMHMM2 benchmark under SPTLC2-bioinformatics/deeptmhmm2-benchmark using canonical cached SPTLC2 and DPM1 sequences. Preserved raw CLI and API predictions, model hashes, runtime, and memory measurements. Identified a singleton-batch postprocessing bug in the upstream Python API and verified a local adapter against the unmodified CLI on both inputs and repeated predictions. SPTLC2 inference took 1.33-1.36 seconds and DPM1 0.63-0.71 seconds on eight M1 Max CPU threads, with about 5 GiB peak process RSS. Documented setup costs, marginals overhead, predicted interfacial segments, and limits in RESULTS.md. Curated gene review assertions are unchanged.
