  summary: Create review for human ACCS (Q96QU6) with Affinage evaluation
  details: |
    Created full curation review for human ACCS (UniProtKB:Q96QU6, PTHR43795:SF17) incorporating primary enzymology, AlphaFold2/AutoDock Vina active-site modeling, and mutagenesis from Koch et al. 2001 (PMID:11470512) and Gao et al. 2025 (PMID:39876065) alongside Affinage deep-research evaluation. Reviewed all 11 existing GOA annotations: accepted NOT GO:0016847 (IDA, separating experimental absence of ACC synthase activity from the AlphaFold2/AutoDock Vina Tyr132 SAM steric-hindrance hypothesis), both GO:0030170 rows (IEA, NAS), and all four GO:0042802 homodimerization IPI rows; removed two bare GO:0005515 IPI rows per policy and two stale IBA rows (GO:0006520 resting on Arabidopsis PAT transamination rather than GO:0006575 modified amino acid metabolic process, and GO:0008483) from retired PAINT node PTN002887088; proposed NEW IDA GO:0047804 (cysteine-S-conjugate beta-lyase activity, EC 4.4.1.13) from PMID:39876065 based on Michaelis-Menten saturation kinetics on S-phenyl-L-cysteine alongside cysteine S-sulfoxides. Verified active-site residue mappings (K323, D286, R457, Y132, W135, R351), isoform Q96QU6-2 truncation, BP_DARK/CC_DARK biology knowledge gaps, and OUTDATED_STATEMENT source defect on UniProtKB:Q96QU6 CC:FUNCTION.
