  summary: 'Create: FBP1 gene review'
  details: |
    New review of human FBP1 (P09467). All 80 GOA annotations reviewed: FBPase activity, gluconeogenesis and cytosol accepted as core; bare protein binding IPIs removed; xenobiotic-response (in vitro inhibitor chemistry) and rodent-expression IEA responses removed; HIF-repression moonlighting (PMID:25043030) kept as non-core; regulation-of-gluconeogenesis, Ras-signalling and cell-growth annotations marked over-annotated. Falcon deep research timed out after 600s, so the literature work used cached PubMed abstracts and full texts fetched with just fetch-pmid. Core function aligned with the dismech Fructose-1,6-Bisphosphatase_Deficiency trigger node (GO:0042132, GO:0006094, cytosol). Validated with just validate human FBP1.
