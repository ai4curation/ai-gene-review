  summary: 'Create review: MPP7'
  details: |
    De-novo review of human MPP7 (Q5T2T1) as the characterised vertebrate relative of DROME/metro (PTHR23122:SF39 vs SF42, shared PAINT clade node PTN001137125). This review does not use ProtNLM2 output. Falcon and perplexity-lite deep research both failed (auth/quota), so the review is built from cached literature (PMID:17237226, 17332497, 20702775, 26481050) plus newly cached mouse PMID:29091764. Changes to the 64 GOA rows: bare protein-binding rows are removed, except the LIN7 rows from 17237226, which are modified to L27 domain binding. Adaptor terms are modified to protein complex scaffold activity. General location terms, including the two clade-level IBAs, are modified to lateral plasma membrane, adherens junction and bicellular tight junction. Cadherin binding (proximity HDA) and CRB3 domain binding (indirect) are marked over-annotated. Core functions: MPP7-DLG1-LIN7 complex scaffold directing DLG1 to adherens junctions, and L27-mediated DLG1 binding needed for functional tight junctions. No NEW annotations.
