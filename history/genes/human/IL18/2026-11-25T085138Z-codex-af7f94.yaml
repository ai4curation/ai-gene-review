  summary: 'Create review: IL18'
  details: |
    Created a de-novo human IL18 review for the NLRP3 inflammasome GO-CAM. Verified that UniProtKB:Q14116 had no GOA rows after fetch, proposed new cytokine activity, IL-18-mediated signaling, and extracellular-region annotations for mature IL-18, synthesized extracellular IL18R1/IL18RAP agonist cytokine activity as the core function, and recorded the GO-CAM context that model activity gomodel:635b1e3e00001811/635b1e3e00001943 is now covered by the gene review. Documented failed Falcon/perplexity-lite deep-research provider access in IL18 notes and cached the two missing IL18 publications needed for the review.
- type: EDIT
