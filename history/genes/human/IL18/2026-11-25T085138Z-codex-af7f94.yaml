  summary: Correct IL18 GOA fetch artifact and review all seeded rows
  details: |
    Corrected the earlier event's premise that UniProtKB:Q14116 had no GOA rows. The header-only IL18-goa.tsv was a transient QuickGO/fetch artifact: a forced refetch retrieved 98 real GOA annotations, which were seeded into IL18-ai-review.yaml and manually reviewed. The original three NEW rows for cytokine activity, IL-18-mediated signaling, and extracellular region were converted to adjudications of their corresponding GOA rows, GO:0032729 positive regulation of type II interferon production was covered, the weak PMID:25261253 background quote on the signaling row was replaced with direct ternary-complex/NF-kappa-B evidence, and every remaining PENDING row was assigned an action.
