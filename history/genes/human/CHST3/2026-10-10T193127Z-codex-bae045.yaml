  summary: Review CHST3 chondroitin sulfation and substrate evidence
  details: |
    Reviewed all 29 original CHST3 annotations with original source objects and 14 reference identities preserved. Defined the principal function as chondroitin GalNAc 6-sulfation during proteoglycan biosynthesis, supported by recombinant human enzyme and patient-cell evidence. Refined broad terms, retained keratan utilization as a secondary capability, and recorded three explicit uncertainties concerning GlcNAc-specific propagation and an obsolete process grouping. Kept historical PAINT uncertainty separate from verified target biochemistry and distinguished failed-mutant Reactome events from wild-type activity. Added three primary references and an authored provenance artifact without proposing new annotations. Independent substrate and whole-review peers, ROOT primary-evidence review, normal validation, status and rendering passed; protected source caches and unrelated work were preserved.
