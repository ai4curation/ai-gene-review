  summary: 'Create review: DLK1'
  details: |
    Created the DLK1 review: all 21 GOA annotations reviewed. DLK1 is a single-pass type I plasma-membrane protein whose six EGF-like repeats are exposed extracellularly and whose ectodomain is shed as circulating fetal antigen 1, so both membrane and secreted pools are real. Core functions are non-canonical (DSL-less) inhibition of Notch signalling and negative regulation of osteoblast differentiation and ossification, with osteoclast/resorption effects kept as non-core because they are indirect. Generic membrane rows were modified to plasma membrane, generic cell differentiation rows to the supported bone terms, the InterPro calcium ion binding row marked over-annotated, and two interactome protein-binding rows removed.
