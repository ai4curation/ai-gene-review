  summary: 'PAINT review of ASZ1 (GASZ): germline mitochondrial/nuage scaffold for
    piRNA-mediated transposon silencing'
  details: |
    Rebuilt from a clean stub with affinage deep research. Accepted the pi-body, RNP granule, cytoplasm and transposable element silencing rows. Kept spermatogenesis and male meiotic nuclear division as non-core: the meiotic arrest is a downstream knockout phenotype. Removed 11 generic protein-binding IPIs (HuRI and SARS-CoV-2). Added NEW mitochondrial outer membrane (ISO from mouse GASZ, PMID:26711429); comparator PLD6 carries it by IDA. piRNA processing was not proposed, and is raised as a question.
- type: EDIT
