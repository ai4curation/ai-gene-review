  - references
  summary: 'Address PR #4326 review: mitofusion finding, MF decision, ISO supporting_entities, ANK count'
  details: |
    Added NEW GO:0010636 positive regulation of mitochondrial fusion (ISO from mouse GASZ, PMID:26711429), based on MFN1/MFN2 binding via SAM/ZIP and faster PAGFP-measured fusion; comparators are PLD6, MIEF1 and MSTO1. Added it to core_functions. No MF is asserted, for the reason recorded in an MF_DARK knowledge gap: the mammalian evidence is binding and stabilization, not demonstrated bridging. Added supporting_entities UniProtKB:Q8VD46 to the ISO rows. The description now gives six ankyrin repeats, per human UniProt.
