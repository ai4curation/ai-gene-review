  summary: De-novo review of all 54 GOA annotations for SLC6A9 (GlyT1), glial Na+/Cl--dependent
    glycine symporter
  details: |
    Reviewed every GOA row for SLC6A9 (P48067, GlyT1). Core MF GO:0015375 glycine:sodium symporter activity (most specific EXISTING term; GO has no glycine:Na+:Cl- term, so a proposed_new_term was filed rather than inventing a Cl-bearing id, mirroring the GlyT2/SLC6A5 precedent). 2 Na+:1 Cl-:1 glycine (vs GlyT2 3:1:1), predominantly glial. Used GO:0001504 neurotransmitter uptake (GO def includes glial cells) and GO:1903804 glycine import rather than presynaptic-reuptake terms (GlyT1 is glial, not presynaptic). GO:0015187 glycine transmembrane transporter is a parallel branch (not an ancestor of GO:0015375) → ACCEPT not TOO_GENERAL. Symporter ancestors TOO_GENERAL (OLS-verified). propagation_review vs GlyT2. BBB NAS rows UNDECIDED (cited reviews do not mention glycine). Actions: 21 ACCEPT, 17 KEEP_AS_NON_CORE, 4 TOO_GENERAL, 4 UNDECIDED, 3 MARK_AS_OVER_ANNOTATED, 2 MODIFY. 1 proposed_new_term. Batch 10.
