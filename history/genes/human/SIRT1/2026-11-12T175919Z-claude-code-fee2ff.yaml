  details: |
    Follow-up to the REMOVE re-review of human reviews (ai4curation/ai-gene-review#6257, merged): a second look at the rows that pass left UNDECIDED because the paper behind each could not be read. No full text could be obtained this time either (the papers are not open access and PMC refuses the repository's fetchers), so a row was settled only where other accessible evidence decides the claim: the provenance of the annotation in QuickGO (which gene products were annotated from the paper, when and by which group), curated UniProt statements tied to a publication, the abstract of a donor paper, or an independent primary paper. Rows settled: [206] maintenance of nucleus location (GO:0051658; IDA, PMID:15692560): UNDECIDED -> MODIFY (replacement maintenance of protein location in nucleus, GO:0051457); [289] positive regulation of cAMP-dependent protein kinase activity (GO:2000481; IMP, PMID:18687677): UNDECIDED -> MODIFY (replacement positive regulation of protein serine/threonine kinase activity, GO:0071902); [300] single strand break repair (GO:0000012; IMP, PMID:20097625): UNDECIDED -> MODIFY (replacement double-strand break repair via single-strand annealing, GO:0045002). The reason of each row states the evidence, and verbatim quotes were added to supported_by. Source defects recorded, each asking the source to check because the full text was not read: rows [206] (WRONG_TERM, PROBABLE), [289] (WRONG_TERM, PROBABLE), [300] (WRONG_TERM, PROBABLE). Added to the references list: file:human/SIRT1/SIRT1-uniprot.txt. Validated with ai-gene-review validate --terms: no error and no new warning against a baseline taken before the edit.
