  details: |
    Reviewed all six GOA rows on the nuclear humanin-like locus MTRNR2L9 (P0CJ76, PE2, HGNC pseudogene); all six marked MARK_AS_OVER_ANNOTATED since every row traces to humanin (Q8IVG9) via ISS/IEA subcellular-location transfer or IBA descent from PANTHER:PTN002141596 and no HN9 peptide has been detected. HN9 loses Pro3, Leu12, Ser14, Glu15 and Ile16 but keeps both secretion determinants; the only locus-specific literature is an intergenic KHDRBS2-MTRNR2L9 GWAS label (PMID:32918910) that supports no annotation. No core functions, no new terms.
