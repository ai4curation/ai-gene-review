  summary: 'Create review: PDIA4 (HORSE40/donkey ProtNLM2 reference relative)'
  details: |
    De-novo review of human PDIA4 (P13667), the PTHR18929:SF210 ortholog reference for HORSE/PDIA4, done independently of ProtNLM2 predictions. Deep research failed (falcon auth error; perplexity-lite quota 401), so the review uses UniProt, PAINT nodes PTN000432607/PTN001448731 and 22 cached papers. All 34 GOA rows reviewed: PDI activity, protein-disulfide reductase (human IDA oxidase assay), ER/ER lumen accepted; protein folding IBA/ISS modified to protein folding in ER; MATN3 IPI rows modified to misfolded protein binding; other generic protein-binding rows removed; RNA binding (HeLa interactome capture) marked over-annotated; protein secretion TAS removed (paper assayed ERp72's own KEEL retention); cell surface, extracellular region, melanosome and response to ER stress kept non-core. No NEW terms: mouse platelet IMP terms were not propagated by PAINT and are raised as a question.
