  summary: 'Create review: CTNNA1'
  details: |
    Created DRAFT review of human CTNNA1 (alpha-E-catenin) for Track B of ORIGINS_OF_MULTICELLULARITY. All 129 GOA rows reviewed (48 ACCEPT, 48 REMOVE, 14 MODIFY, 11 KEEP_AS_NON_CORE, 8 MARK_AS_OVER_ANNOTATED, 0 NEW). Generic protein binding rows were converted to beta-catenin, gamma-catenin or vinculin binding where the partner defines a direct interaction, and removed otherwise (including 21 PDZ fragmentomics rows). Cadherin binding was marked over-annotated because alpha-catenin binds cadherin indirectly through beta-catenin. Rat IEP-derived developmental transfers were removed. Core functions: beta-catenin binding, force-dependent actin filament binding, cytoskeletal adaptor activity at the zonula adherens. A PANTHER tree query showed the CTNNA1 IBAs sit at the eumetazoan root of PTHR18914, while Dictyostelium ctnnA is in the vinculin family PTHR46180. Added the Dictyostelium catenin-epithelium papers (PMID:21393547, PMID:22902739) and the mechanistic papers PMID:16325582, PMID:16325583 and PMID:25359979.
