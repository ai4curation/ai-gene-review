  summary: Restore BBS9 ciliary core roles and distinguish screening associations
    from scaffold evidence
  details: |
    Independent biological review accepted six screening-derived BBS1, BBS2 and BBS5 associations as non-core while retaining targeted scaffold refinements supported by their own sources. The single scaffold core now includes ciliary protein localization, cilium assembly, ciliary membrane and cilium, with human complex-localization evidence distinguished from mouse IMCD3 and zebrafish ciliogenesis experiments. All 69 machine-source assertions and seven alternative products are preserved. The human isolated beta-propeller finding is restored without implying that the fold proves scaffold activity or a physiological homodimer. GO_REF:0000015 remains the ND source but no longer supports the biological mechanism. Three literal short anchors remain within source quotation limits; other supporting citations are preserved without quotations. Focused validation and rendering passed. Twenty generic-binding advisories remain under the supplied ActionEnum; no blanket interaction removal or repository-wide validation pass is claimed. Previous journal entries and curation history remain intact.
