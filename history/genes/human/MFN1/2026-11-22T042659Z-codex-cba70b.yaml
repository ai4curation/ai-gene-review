  summary: Create human MFN1 review
  details: |
    Created a de-novo human MFN1 review for reviewed Swiss-Prot accession Q8IWA4 in PANTHER PTHR10465:SF2. The first QuickGO fetch produced a header-only MFN1-goa.tsv despite existing UniProt GO cross-references; the review follow-up force-refetched GOA, recovered 47 rows, and reviewed them all. The final review accepts the existing GTPase activity, mitochondrial outer membrane, mitochondrial fusion, identical protein binding, and outer mitochondrial membrane protein complex rows; proposes mitochondrial outer membrane fusion as the membrane-specific core step; keeps mitochondrion localization and isoform 2 cytoplasm as non-core rows; and removes only bare protein-binding rows under the protein-binding policy. The notes document the repaired GOA fetch, the unavailable configured deep-research providers, the PTHR10465:SF4 omission, and the decision not to assert MFN2-specialized ER-contact, mitochondrial-transport, or mitophagy roles for MFN1.
