  summary: 'Create review: MAP3K3'
  details: |
    Created the MAP3K3 (MEKK3) review. All 55 GOA annotations actioned: 41 MODIFY (38 bare protein-binding IPIs to 14-3-3 protein binding, protein kinase binding for MEK5, ubiquitin protein ligase binding for TRAF7 and scaffold protein binding for CCM2; intracellular signal transduction to ERK5 cascade and MAPK cascade) and 14 ACCEPT. Added description, reference_review for all references, and two core functions: MAP3K activity driving the PB1-dependent MEK5-ERK5 cascade (restrained by the CCM complex in endothelium) and direct IKK phosphorylation in TNF/IL-1R/TLR4 NF-kappaB activation. Blood vessel development was not proposed as NEW; raised as a suggested question. Kept consistent with the MAP3K2 review.
