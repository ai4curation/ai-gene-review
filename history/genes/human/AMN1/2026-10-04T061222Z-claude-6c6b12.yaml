  summary: 'Review human AMN1: an uncharacterized LRR protein without the F-box its
    family IBAs assume'
  details: |
    3 GOA rows. The SCF complex and SCF-catabolism IBAs (PTN002547163) are marked over-annotated: AMN1 has no recognizable F-box (new MAFFT check in AMN1-bioinformatics). The microvillus membrane IEA was removed on biological grounds; its mouse source looks like an Amn/Amn1 symbol mix-up, raised as a question. Affinage described yeast Amn1 (a real symbol collision), so it was quarantined and not written. Gene recorded as WHOLLY_DARK.
