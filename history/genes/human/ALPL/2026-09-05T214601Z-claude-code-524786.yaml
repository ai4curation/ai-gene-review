  summary: 'Create review: human ALPL (TNAP)'
  details: |
    Reviewed all 71 GOA annotations and proposed 4 new ones (external side of plasma membrane, zinc and magnesium ion binding from the human TNAP structure, protein homodimerization). Removed GO:0140928 inhibition of non-skeletal tissue mineralization as directionally inverted: its mouse IDA source shows TNAP overexpression increased aortic calcification. Marked osteoblast differentiation over-annotated (expression marker, not participant); modified three pyrophosphatase rows to inorganic diphosphate phosphatase and generalised terms to specific ones. Three core functions recorded: PPi hydrolysis driving mineralization, PLP dephosphorylation gating vitamin B6 uptake, phosphocholine/phosphoethanolamine hydrolysis. Falcon deep research used; validated with just validate human ALPL (0 warnings).
