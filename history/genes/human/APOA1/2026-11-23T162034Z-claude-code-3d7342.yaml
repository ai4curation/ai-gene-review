  summary: 'New review of human APOA1: 204 GOA rows reviewed, NEW apoA-I-mediated
    signaling pathway row, LPA wrong-gene rows removed'
  details: |
    New gene review for human APOA1 (P02647), LIGANDS_IN_SIGNALING campaign (APOA1
    signaling, section 3 category A gap on GO:0038027). All 204 GOA rows reviewed:
    89 ACCEPT, 49 KEEP_AS_NON_CORE, 34 REMOVE, 21 MARK_AS_OVER_ANNOTATED, 7 MODIFY,
    3 UNDECIDED, 1 TOO_GENERAL, plus 1 NEW.
    - NEW involved_in GO:0038027 apolipoprotein A-I-mediated signaling pathway (IDA,
      PMID:19783654; also PMID:14668333, PMID:16443932, PMID:21339300, PMID:26989082):
      apoA-I is the ligand that binds and activates ABCA1 (JAK2/STAT3, Cdc42).
    - MODIFY GO:0007186 GPCR signaling (PMID:16443932) -> GO:0038027; GO:0034190,
      GO:0034191 and GO:0005102 receptor-binding rows -> GO:0048018 receptor ligand
      activity; GO:0019899 enzyme binding -> GO:0060228; GO:0034205 amyloid-beta
      formation (DisProt) -> GO:1990000 amyloid fibril formation.
    - REMOVE 8 UniProt rows citing PMID:23726972, which studies apolipoprotein(a) (LPA,
      P08519), not apoA-I (full text read); WRONG_GENE_PRODUCT source defect, REPOINT.
    - REMOVE GO:0006656 PC biosynthetic process (LCAT consumes PC), 2 Reactome cytosol
      rows, and 23 generic protein-binding rows (policy).
    - UNDECIDED: GO:0010903 (PMID:14967812), GO:0055091 and GO:0070328 (PMID:21571275).
    Core functions: cholesterol transfer/lipid acceptor in ABCA1 efflux, phospholipid
    binding HDL scaffold, LCAT activator, receptor ligand for ABCA1 signaling.
    No deep-research provider was available; manual PubMed research is in APOA1-notes.md.
