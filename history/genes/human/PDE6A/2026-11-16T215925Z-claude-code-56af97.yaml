  summary: First review of PDE6A for the dismech vision-disorder alignment
  details: |
    First annotation review of human PDE6A (rod cGMP phosphodiesterase alpha subunit), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1) together with the other four PDE6 subunits so that the five reviews agree. 22 GOA rows reviewed: 10 ACCEPT, 7 MODIFY, 5 MARK_AS_OVER_ANNOTATED; one NEW row, cGMP binding by ISS from the bovine structure (PMID:33007200). Core function: GO:0047555 3',5'-cyclic-GMP phosphodiesterase activity as the subunit's own activity, within the rod photoreceptor phosphodiesterase 6 complex (GO:7770030), in GO:0141190 at the rod disc membrane. The activity is recorded as the subunit's own because the human catalytic domain hydrolyses cGMP when expressed as a chimera (PMID:20940301); natively it works only in the PDE6A/PDE6B heterodimer. cAMP phosphodiesterase and cAMP/PKA rows propagated from a cAMP-directed node, retina development and plasma membrane are marked over-annotated. The visual perception IMP row cites a PDE6B paper (PMID:8394174) and the PDE6B row a PDE6A paper; neither full text was available, so both rows are kept and the possible swap is reported, not recorded as a defect. Validated with just validate human PDE6A: no errors.
