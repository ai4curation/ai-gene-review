  summary: First review of GRK1 for the dismech vision-disorder alignment
  details: |
    First annotation review of human GRK1 (rhodopsin kinase), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1, phototransduction). All 36 GOA rows were reviewed: 14 ACCEPT, 18 MODIFY, 4 KEEP_AS_NON_CORE. Generic kinase rows are refined to GO:0050254 rhodopsin kinase activity and generic signalling rows to GO:0016059 negative regulation of opsin-mediated signaling pathway. Core function: GO:0050254 at the photoreceptor disc membrane, in GO:0016059 and GO:0036368 photoresponse recovery. Literature input: the GOA-cited papers (all cached as abstracts only), the UniProt record and an OpenScientist deep-research report used as a lead. Recoverin inhibition, farnesylation and the structure are from bovine protein and the review says so. Validated with just validate human GRK1: no errors; warnings left for one IBA row without propagation_review metadata and for the deep-research file not being cited.
