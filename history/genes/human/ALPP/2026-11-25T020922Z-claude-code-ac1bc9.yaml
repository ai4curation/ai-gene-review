- type: EDIT
  outcome: changed
  summary: Record OpenScientist active-site analysis narrowing the ALPP substrate
    gap
  details: |
    Ran an OpenScientist deep-research job (kgap-alpp-active-site-specificity) on the knowledge gap covering ALPP's unknown physiological substrate. The run measured PDB 1EW2 directly and found the 6-Angstrom catalytic shell 88 percent identical to ALPL against a 55 percent chain background, a 0.31-Angstrom Calpha RMSD against TNAP (7YIW) with the zincs within 0.34 Angstrom, and only three differences inside the shell (mature Gly93, Ser155, Glu429 = UniProt Gly115, Ser177, Glu451), each already assigned experimentally to uncompetitive inhibitor binding, metal-site stability or heat resistance. The collagen-binding crown domain is no more conserved than background and sits a median 23.8 Angstrom from the catalytic core, and the widest approach channel to the catalytic serine measures 3.28 Angstrom.

    Status moved from OPEN to NARROWING. The active site predicts broad small-phosphomonoester specificity of the ALPL kind and still cannot name the physiological substrate, so the gap is not closed; what the computation does argue against is the crystallographers' suggestion that the substrate is a phosphorylated protein, with the caveat that 1EW2 has product phosphate bound. The catalytic serine, both zinc sites, the magnesium ligands, Tyr389 and Glu451 were checked against the local UniProt record using the 22-residue signal-peptide offset; the superposition and identity statistics were not recomputed. The run's suggested annotation changes (substrate-level MF terms transferred from ALPL, an evidence upgrade from ISS to IDA, a GPI-anchor CC term) were not adopted: it states itself that direct ALPP kinetics are missing, and they are leads rather than evidence.
