  details: |
    Reviewed every GOA row for SLC6A5 (Q9Y345, GlyT2). Core MF GO:0015375 glycine:sodium symporter activity (the most specific EXISTING GO term; GO has no glycine:Na+:Cl- symporter term, so a proposed_new_term was filed rather than inventing a Cl-bearing id). 3 Na+:1 Cl-:1 glycine electrogenic stoichiometry (Rhea RHEA:70695); presynaptic glycine reuptake at glycinergic synapses; LOF causes hyperekplexia. Added a NEW GO:0098810 neurotransmitter reuptake row (comparator check vs other SLC6 members). Glycinergic-transmission rows KEEP_AS_NON_CORE (participation test); chemical synaptic transmission / neurotransmitter transport TOO_GENERAL; Na+ co-transport KEEP_AS_NON_CORE. Synapse MODIFY to presynapse; endosome KEEP_AS_NON_CORE; dense-core-granule ISS UNDECIDED. propagation_review on IBA/ISS rows ruling out GlyT1 (SLC6A9) cross-paralog leakage via sarcosine-insensitivity. Actions: 18 ACCEPT, 4 KEEP_AS_NON_CORE, 3 MODIFY, 3 TOO_GENERAL, 1 UNDECIDED, 1 NEW. 1 proposed_new_term. Batch 9.
