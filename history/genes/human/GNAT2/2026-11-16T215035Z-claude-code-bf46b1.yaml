  summary: First review of GNAT2 for the dismech vision-disorder alignment
  details: |
    First annotation review of human GNAT2 (cone transducin alpha subunit), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1, phototransduction). 45 GOA rows reviewed: 15 ACCEPT, 14 MODIFY, 9 KEEP_AS_NON_CORE, 4 REMOVE, 3 MARK_AS_OVER_ANNOTATED. Core function: GO:0003925 G protein activity in the heterotrimeric G-protein complex, in GO:0141190 transducin-mediated opsin signaling pathway at the cone photoreceptor disc membrane; kept consistent with the GNAT1 review. Removed: the two adenylate cyclase-modulating signalling rows (as for GNAT1), G protein-coupled photoreceptor activity (NAS; that activity belongs to the opsin), and synapse (Ensembl Compara from a mouse study that used Gnat2 mutants only as a cone-less background, PMID:24403163). Bitter-taste and cytosolic calcium rows rest on a rat chimera experiment (PMID:12917372) and are marked over-annotated. Validated with just validate human GNAT2: no errors.
