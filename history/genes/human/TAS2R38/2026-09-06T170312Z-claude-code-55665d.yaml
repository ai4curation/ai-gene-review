  summary: 'Create review: TAS2R38'
  details: |
    De-novo AI review of human TAS2R38 (PTC/PROP bitter taste receptor). Fetched GOA (19 annotations), UniProt, and PANTHER family PTHR11394 data; ran falcon deep research; reviewed each annotation against literature and IBA/PAINT phylogenetic evidence per repo curation guidelines. Modified 3 generic 'membrane' rows and 1 generic 'sensory perception of taste' row to more specific plasma-membrane/bitter-taste-detection terms already independently supported for this gene. Accepted a PMID:12379855-sourced IDA row despite the cached abstract foregrounding the paralog TAS2R16, per the 'do not overrule curators from incomplete evidence' rule (UniProt's own TAS2R38 reference list cites the same PMID). Extraoral/sinonasal innate-immune role captured as knowledge_gaps rather than an unverifiable new GO term. Validated with just validate human TAS2R38 (clean).
