  summary: 'Manual review of HTP vesicle-type annotations: APOE'
  details: |
    OMICS_EVIDENCE vesicle-row manual review (projects/OMICS_EVIDENCE.md; dossiers and decisions in projects/OMICS_EVIDENCE/htp/vesicle_review/). The rule-based vesicle disposition was withdrawn; each protein was judged from its dossier using the MISEV2018 protein categories (PMID:30637094) as a guide. Manual re-review of GO:0072562 blood microparticle (PMID:22516433): ACCEPT -> MARK_AS_OVER_ANNOTATED. Basis: Apolipoprotein E on lipoprotein particles, recovered from a plasma microvesicle preparation; the earlier ACCEPT described APOE's lipoprotein biology, not EV localization. Major constituent of non-EV structures co-isolated with EVs from body fluids (MISEV2018 category 3 negative marker for plasma/serum EVs); detection does not establish EV localization.
