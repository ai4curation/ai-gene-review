  details: |
    Round 3 re-approved and raised three non-blocking points; the two that concern the file are fixed. First, removing the methodological clause from description in the previous commit left the sentence reading that the tethered DNA is of mitochondrial origin and carries oxidative damage, then that on B cells this surface DNA is removed by the secreted enzyme. The demonstrative points back to the mitochondrial, oxidatively damaged DNA, so it re-attached the mtDNA identity to the B-cell result, which was the round-1 blocker; dropping the single word closes it without reintroducing methodology. The unscoped first clause stays, since it is the published paper's own framing in both abstract and title. This is the fourth instance in this review of a careful claim in a structured field and a loose one in prose, after the substrate identity, the preprint attribution and the cohort wording. Second, the proposed-term justification gave the descendant query as sqlite:go.db, which resolves only with a go.db in the working directory; it now uses sqlite:obo:go, verified to resolve to the same build and return the same four lines, since reproducibility was the purpose of adding the query. The third point corrected a PR comment rather than the file: the claim that both halves of the new description are the published abstract's own is wrong, because the DNASE1 comparator is preprint content, the same published-versus-preprint distinction corrected earlier on the GO:0006308 row. No file change is needed for it as description is uncited and the preprint is cited elsewhere for that result.
