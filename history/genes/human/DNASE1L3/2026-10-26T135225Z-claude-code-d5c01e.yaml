  summary: Drop locational GO:0032043; support existing GO:0006308 with surface-mtDNA evidence
  details: |
    Curator review pointed out that GO:0032043 mitochondrial DNA catabolic process is a locational term. Its logical definition is GO:0006308 DNA catabolic process occurs_in GO:0005739 mitochondrion, so it asserts that breakdown happens inside mitochondria. DNASE1L3 degrades DNA of mitochondrial origin outside the cell. The NEW GO:0032043 row is removed. GO:0006308 is already in GOA (IEA), so a NEW row for it is not allowed; PMID:42838054 and its preprint PMID:41280093 are instead added as experimental support on the accepted GO:0006308 row. The third core function now uses GO:0006308. The justification for the proposed term 'extracellular DNA catabolic process' now records that no GO:0006308 descendant occurs in the extracellular region. Validated with just validate human DNASE1L3.
