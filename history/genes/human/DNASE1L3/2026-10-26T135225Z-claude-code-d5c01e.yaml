  summary: Replace GO:0032043 with GO:0006308 for extracellular mtDNA breakdown
  details: |
    Curator review pointed out that GO:0032043 mitochondrial DNA catabolic process is a locational term. Its logical definition is GO:0006308 DNA catabolic process occurs_in GO:0005739 mitochondrion, so it asserts that breakdown happens inside mitochondria. DNASE1L3 degrades DNA of mitochondrial origin outside the cell. The NEW IDA row and the third core function now use GO:0006308. The justification for the proposed term 'extracellular DNA catabolic process' now records that no GO:0006308 descendant occurs in the extracellular region. Validated with just validate human DNASE1L3.
