  summary: 'Round 2: homozygotes not carriers; move the method clause out of description;
    make the descendant query re-runnable'
  details: |
    Round 2 approved the review with three non-blocking points; all three are taken. First, core function 1 attributed the excess surface DNA to carriers of the R206C variant, where this file's own finding statement says homozygotes for the secretion-defective R206C risk allele, which is what the preprint measured. The word carriers remains correct for PMID:36708011's systemic-sclerosis plasma result but not for the surface-DNA result. This is the third instance in this review of prose disagreeing with a structured field in the same file. Second, the top-level description had acquired the clause that the mitochondrial origin and 8-oxo-dG enrichment were established in cell lines rather than sequenced from primary B cells, which is methodology rather than biology and belongs outside a field the description-quality rule reserves for a project-independent biological summary. The caveat is unchanged in core function 1 and in the GO:0006308 reason; the description now states declaratively that the tethered DNA is of mitochondrial origin and carries oxidative damage and that B-cell surface DNA is removed by the secreted enzyme and not by DNASE1, both of which are the published abstract's own claims. Third, the proposed term justification now gives the re-runnable query for the descendant check rather than only its provenance, which was the reviewer's stated residual after it corroborated the three terms from the materialized BP enum cache but could not confirm completeness from a cache that carries no parent-child edges.
