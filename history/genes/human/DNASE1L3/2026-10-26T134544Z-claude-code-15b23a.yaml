  summary: Add NEW mtDNA catabolic process (GO:0032043), surface-mtDNA core function,
    proposed extracellular DNA catabolism term
  details: |
    Follow-up to the earlier same-day record, after curator feedback that the cell-surface DNA finding deserved GO representation. Read the open preprint (PMID:41280093) of PMID:42838054 in full. Recombinant DNASE1L3, but not DNASE1, removes surface DNA from primary human B cells. R206C homozygotes (secretion-defective, PMID:36708011) have more of it. Surface DNA is mitochondrial and 8-oxo-dG-rich, as shown in cell lines. Added NEW GO:0032043 mitochondrial DNA catabolic process (IDA). Comparator check: only ENDOG carries it in human/mouse, and the definition has no location restriction. Added a third core function for this activity. Location kept as GO:0005576 (secreted); GO:0009986 cell surface was not added, because the protein is not shown to reside there. Proposed a new term, extracellular DNA catabolic process. Added six supporting references (PMID:36708011, 30593563, 33022220, 33783474, 22019780, 32454024). Validated with just validate human DNASE1L3.
