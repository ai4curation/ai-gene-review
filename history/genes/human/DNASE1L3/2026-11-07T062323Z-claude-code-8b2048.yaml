  summary: 'Round 1: correct the B-cell substrate claim; merge a duplicate core function'
  details: |
    Review round 1 raised two blocking items and three suggestions; all are taken. First, the top-level description and the second core function stated that DNASE1L3 removes oxidized mitochondrial DNA from the surface of B cells. The published abstract separates those claims, saying that mitochondrial DNA is tethered to the surface of select mammalian cells and, distinctly, that human and murine B cell surfaces contain DNA cleared by the secreted nuclease. The mitochondrial identity and 8-oxo-dG enrichment were shown in cell lines. The file's own reference_review for the preprint already recorded that the identity was not sequenced from primary B cells, so the two most reader-facing fields contradicted a caveat already in the file. Both now separate the claims. Second, the second core function was machine-identical to the first in molecular function, process and location, differing only in prose substrate, while the same change had folded circulating plasma DNA into the first entry rather than giving it its own. Surface DNA is now a substrate of the first core function with its three evidence quotes moved there, leaving two genuinely distinct core functions, extracellular and nuclear. Of the suggestions, the GO:0006308 reason no longer attributes the DNASE1 comparator result or the R206C variant identity to the published paper, since both are read from the preprint, and it now states why the row stays ACCEPT rather than becoming a MODIFY onto the proposed term. The proposed term justification replaces an unverified claim with an enumeration checked against the pinned GO build: GO:0006308 has exactly three live descendants, GO:0006309, GO:0032043 and GO:7770014, none extracellular, and the former endonucleolytic and exonucleolytic children GO:0000737 and GO:0000738 are obsolete.
