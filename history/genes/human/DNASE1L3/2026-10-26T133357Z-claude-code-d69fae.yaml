  summary: Add PMID:42838054 (DNASE1L3 clears cell-surface mitochondrial DNA)
  details: |
    Added Porat et al. 2026 Mol Cell (PMID:42838054). Abstract-only: no PMC record, and the publisher refused automated fetch. The paper shows that mitochondrial DNA is tethered to the surface of select cells through surface proteins and heparan sulfate proteoglycans, and that secreted DNASE1L3 clears it from human and mouse B cells. Carriers of an autoimmunity-associated DNASE1L3 missense variant have more surface DNA. The paper is cited as a third extracellular substrate under the existing GO:0004530/GO:0006308/GO:0005576 core function. No existing annotation changed, and no NEW annotation or cell-surface location was added, because the abstract shows the substrate at the surface, not the protein residing there. Added one suggested question and one suggested experiment. Validated with just validate human DNASE1L3.
