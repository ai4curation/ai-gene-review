  summary: 'Weekly compliance: improve NMNAT2 review evidence scaffolding'
  details: |
    Weekly evidence-aware compliance pass on the largest file in this batch (28 annotations, 13 references). NMNAT2 weighted compliance 46.10 -> 96.62. No annotation action was changed. Added review.reason to all 28 annotations. Key points recorded: the four IBA rows come from two different PANTHER nodes and the split is correct, with the two catalytic activities and the salvage process from the deep node PTN000247701 whose descendants span plant, yeast, fly, mouse, bacterial NadD and both human paralogs, while Golgi localization comes from the much shallower PTN002635346 seeded only by mouse and human NMNAT2 because membrane anchoring is the isoform-specific trait dependent on palmitoylation of Cys-164/165 rather than on the conserved catalytic fold; Q9BZQ4 appearing in its own WITH/FROM on two rows is recorded as expected rather than circular, per projects/IBA_REVIEW.md; and the differing actions on the generic versus specific activity rows are explained by signature specificity, with IPR004821 being a broad cytidylyltransferase-like fold that can only emit the branch root while IPR045094 is family-specific. GO:0005737 cytoplasm is kept ACCEPT rather than modified to cytosol because NMNAT2 occupies a soluble pool, the cytoplasmic face of the Golgi membrane and Golgi-derived axonal vesicles, so collapsing to the child would lose the membrane-anchored pools. GO:0061564 axon development is kept non-core with an explicit argument that the strong necessity evidence from Nmnat2-null and compound-heterozygote mice does not establish participation, because what NMNAT2 contributes to axon development is NAD+ rather than any step of axon extension. Flagged one term-fit concern for curator input without acting on it: GO:0140768 is defined as an enzyme-substrate adaptor that brings a transferase and its substrate together, implying bridging separable from catalysis, yet UniProt records that the catalytically dead variants H24D and W92G abolish both adenylyltransferase activity and the ability to promote ribosome mono-ADP-ribosylation, which points to local NAD+ supply as the mechanism; the action is unchanged and the issue is recorded as a suggested_question plus a mechanism-separating experiment. Added findings to all thirteen references, including the negative results from Sorci et al. that bound the substrate range. Both Reactome TAS rows now quote the Berger et al. primary source they trace to, and the cytosol and cytoplasm rows gained Challa et al. corroboration, labelled as corroboration since neither row cites that paper. Added descriptions for both alternative products, noting that isoform 2 removes the critical ATP-binding His-24 and would be expected catalytically dead though untested. Expanded suggested_questions from three to six and suggested_experiments from two to three, adding the hypothesis field that both existing entries lacked. Added reference_section_type to the core_functions quotes. Also rewrapped the four pre-existing folded scalars that split hyphenated compounds, resolving all four validation warnings. Deliberately left open: the seven GO_REF findings supporting_text slots, as those documents are not cached. just validate clean.
