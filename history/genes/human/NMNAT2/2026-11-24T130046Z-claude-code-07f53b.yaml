  summary: Correct the GO:0140768 mechanism reading and four factual slips after PR
    review
  details: |
    PR Shepherd pass addressing the CHANGES_REQUESTED review on PR 4454.

    Blocking item. The GO:0140768 KEEP_AS_NON_CORE reason argued that because the catalytically dead H24D and W92G variants abolish both adenylyltransferase activity and ribosome MARylation, that catalysis-dependence pointed to local NAD+ supply rather than adaptor bridging, implying the bridging component the term requires was missing. The cached full text of PMID:34314702 settles it the other way: Challa et al. ran the co-IP with wild-type and W92G side by side precisely to separate binding from catalysis, and report that NMNAT-2 and PARP-16 interact in cells independently of NMNAT-2 catalytic activity while only wild-type enhances PARP-16 auto-MARylation. Binding and catalysis are separable and are not competing explanations, so the physical association GO:0140768 requires is demonstrated and the catalysis-dependence governs the magnitude of the enhancement, which the authors attribute to NAD+ supply. KEEP_AS_NON_CORE was already the right action and is unchanged; what changed is the inference behind it. The verbatim WT-vs-W92G sentence was added to the row's supported_by. The same misreading was propagated to the PMID:34314702 reference_review.review_notes, suggested_questions[1], suggested_experiments[2] and NMNAT2-notes.md, and was corrected in all four; the open question is reframed to the narrower one the experiment actually tests, namely whether contact is required for the enhancement or whether raising cytosolic NAD+ by any route would suffice.

    Minor factual corrections, each checked against the cited source. Isoform 2: VAR_SEQ 1..28 replaces the first 28 residues with MEIQELEEIQACQGLWEVFVTLS, which is 23 residues not 24, giving a 302-residue isoform from the 307-residue canonical. GO:0004515 reason no longer rests on a monomer premise, since the same UniProt record annotates the ATP sites His-24 and 271..274 with ligand shared between dimeric partners and in other chain; enables is retained because the assays measure the activity of NMNAT2 itself, and the internal tension is stated rather than leaned on. PMID:17402747 reason no longer calls the substrate-binding order specific to NMNAT2: the abstract gives ATP-before-NMN for both NMNAT1 and NMNAT2 and the opposite order only for NMNAT3. core_functions[0].supported_by[0] now quotes the central-enzyme-of-the-NAD-biosynthetic-pathway sentence from PMID:16118205 instead of the Golgi-localization sentence, which did not support a catalytic-reaction description.

    No term id, label, qualifier or action was changed. just validate human NMNAT2 is clean.
