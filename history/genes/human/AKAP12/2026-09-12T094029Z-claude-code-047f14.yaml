  details: |
    De novo review of human AKAP12 (gravin / SSeCKS / AKAP250, Q02952) under the
    PAINT + affinage campaign.

    Coverage: the GOA TSV has 38 data rows and the fetch-gene stub seeded 38 entries;
    a programmatic 1:1 match on (term, evidence, reference, with/from) returned zero
    missing and zero extra, so this gene is not affected by the stub-collapse defect
    seen on ADAMTSL5 and ACTR5. Final document has 42 existing_annotations = 38 GOA
    rows + 4 NEW proposals. Actions: 11 ACCEPT, 17 KEEP_AS_NON_CORE, 5 MODIFY,
    5 MARK_AS_OVER_ANNOTATED, 4 NEW, 0 REMOVE.

    Principal findings:

    1. PMID:9000000 (Nauert/Scott, Curr Biol 1997) maps both anchoring determinants on
       the human protein in one experiment - RII binding at 1526-1780 and PKC binding at
       265-556 - and is absent from the affinage record entirely. It was found in the
       UniProt RN reference list. It is the basis of UniProt's own PKC-binding region
       and of the NEW GO:0005080 row. Same recall pattern as ADAMTSL1 and ACTG2: the
       decisive paper is titled for something other than the function.

    2. PMID:27683220 (AKAP12 -> PKA -> ATR-S435 -> nucleotide excision repair) is
       RETRACTED for fabricated/falsified data (PMID:33091128). Affinage cites it
       unflagged as a High-confidence finding, and it is the sole source of that
       record's DNA-repair claims and its Reactome R-HSA-73894 grounding. Marked
       is_invalid; no annotation rests on it and no NER/ATR term was proposed.

    3. GO:0043116 negative regulation of vascular permeability reaches human AKAP12 by
       Ensembl Compara from a rat IMP whose own cited paper (PMID:20454828) reports the
       opposite sign - depleting SSeCKS protected the endothelial barrier, and the
       authors conclude SSeCKS drives hyperpermeability. The term nevertheless holds for
       AKAP12 on independent mouse evidence the transfer never used, so the row is kept
       as non-core with propagation_review root_cause SOURCE_BAD and failure_modes
       [REGULATORY_SIGN_INVERSION], and an RGD re-examination request was filed in
       suggested_questions.

    4. Per-partner GO:0005515 judgement from expanded IntAct records, counted by
       distinct publication x detection method rather than by NbExp: PRKAR2A x2 modified
       to GO:0034237 (filter binding plus OpenCell endogenous-tag coIP); CTNNB1 x2
       modified to GO:0008013 (mRNA display plus OpenCell); FHL1 x3 kept non-core; EGFR
       x2 marked over-annotated because both trace to the same split-ubiquitin MYTH
       platform with overlapping authors. All four partners resolved to reviewed
       canonical Swiss-Prot entries of the expected length.

    5. Sequence analysis run for this review: the PKC-binding consensus published for
       rodent SSeCKS (PMID:21903576) matches the human sequence at 605-633 and 754-782,
       coinciding with UniProt's AKAP CaM-binding motifs 1 (607-627) and 2 (756-776).
       The PKC and calmodulin determinants are the same element, which supplies a
       mechanism for PKC phosphorylation antagonising CaM binding. Framed as an additive
       UniProt suggestion, not a correction: the separate 266-557 region comes from
       PMID:9000000's human mapping and is a genuinely distinct determinant.

    6. Ontology gap proposed: cyclic-nucleotide phosphodiesterase binding under
       GO:0019899. Verified by enumerating the parent's 28 children rather than by
       keyword search alone. GO can annotate binding to the enzyme that makes cAMP
       (GO:0008179) but not to the one that degrades it, so the PKA half of AKAP12's
       best human experiment is annotatable and the PDE4D half is not.

    Hazards handled: no tumour-suppressor, growth-arrest or metastasis term was
    proposed, because that literature is ectopic over-expression in transformed rodent
    lines; the scaffold's clients' catalytic activities were not imported, with
    GO:0035591 signaling adaptor activity chosen as the bridging MF; and AKAP12
    (PTHR23209) was verified to share no PANTHER family with the concurrently reviewed
    AKAP10 (PTHR13155), so nothing was imported across.

    Negative results reported rather than omitted: the granularity check on GO:0007165
    failed to confirm - the donors genuinely disagree (zebrafish akap12b carries
    Rho/cytoskeletal IMPs, the human protein's measured signalling is cAMP/PKA and PKC),
    so signal transduction is the honest LCA and the row was ACCEPTed. The reciprocal
    half became a PAINT coverage-gap suggestion.

    A per-gene audit script asserting duplicate-key-free YAML, raw-vs-parsed
    reference_id counts, GOA row coverage, source_entities derived from the WITH/FROM
    field, root_cause/action agreement and species discipline on NEW rows caught a real
    defect in the draft: a dropped supporting_entities entry that `just validate`
    reported as Valid. Its first species check was a keyword blacklist that produced a
    false positive and was replaced with the positive invariant.

    Verification: `just validate human AKAP12` Valid on the merged tree with one
    non-blocking warning left standing (no file: quotes were used, since CI does not
    validate them); 82 supporting_text quotes verified verbatim; cache_lint exit 0;
    cache/go/terms.csv unmodified by this branch.
