  details: |
    Review round 3 on PR #3007. (1) The description asserted for human AKAP12 that it 'associates with a detergent-resistant cortical cytoskeletal matrix and modulates PKC-driven actin remodelling'. Both halves are rodent: the matrix is PMID:9744295, ectopic SSeCKS expression in mouse NIH3T3; the actin effects are PMID:12083796 (NIH3T3/rat embryo fibroblasts) and PMID:20018890 (rat MAT-LyLu) and are mutually opposed, which is why this review declined GO:0051015. Rewritten to attribute the link to rodent work and state that no actin-related MF is asserted for the human protein. This is the third clause of this shape corrected in this review. (2) akap12_audit_selftest.py mutated the real AKAP12-ai-review.yaml and restored it in a finally block, so an interrupted run could leave corrupted YAML in the tree; akap12_audit.py now takes an optional path argument and the self-test audits a tempfile copy, asserting at the end that the curated file was never written. (3) Added a mutation that actually exercises the root_cause-vs-action coherence guard (MARK_AS_OVER_ANNOTATED row flipped to root_cause NO_FAILURE_CORE); the entry previously named for that guard was really a prose control and has been renamed. All 8 guards fire, both controls stay silent. (4) Corrected stale notes: scratchpad paths now point at AKAP12-bioinformatics/, reference_id count 50 -> 53, quote count 77 -> 83, self-test described as ten mutations not nine.
