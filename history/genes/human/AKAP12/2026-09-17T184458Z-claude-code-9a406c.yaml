  details: |
    Review round 4 on PR #3007. (1) The round-3 hedge fixed the species problem but introduced a different one: the description ended 'so no actin-related molecular function is asserted for the human protein here', which is exactly the should/should-not-be-annotated commentary CLAUDE.md excludes from description. Nothing lints that field. Rewritten to state the evidence and stop, matching the cyclin-D hedge in the same paragraph; the annotation-level rationale already lives in the GO:0051015 rows and suggested_questions. (2) The same clause mis-located the disagreement. The opposed pair is PMID:12083796 (co-sedimentation with F-actin, NIH3T3/rat embryo fibroblasts) versus PMID:9885289 (network distinct from F-actin, rat mesangial cells); PMID:20018890 is the ERK1/2 paper and is not part of it. Verified against the document's own reasoning at the GO:0051015 rows. (3) Added an anchor-ambiguity check to the self-test: an anchor matching more than once is as bad as matching none, because replace(...,1) silently mutates whichever row comes first. It fired immediately on a pre-existing ambiguous anchor the reviewer had not flagged (the MODIFY GO:0034237 mutation matched both GO:0034237 rows), as well as on the new root_cause mutation. Both anchors extended to unique text. (4) README: the two remaining bare python3 invocations corrected to uv run python.
