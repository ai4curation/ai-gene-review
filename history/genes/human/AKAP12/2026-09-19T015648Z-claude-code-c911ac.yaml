  summary: 'Post-merge fix: folded-scalar hyphen split and an inverted tet-off description'
  details: |
    PR #3007 was merged with eleven unresolved review threads; main requires conversation resolution, so it only landed via --admin. Two of those threads held real defects, both introduced by the round-5 reflow that was believed cosmetic. (1) description is a >- folded scalar, so a newline folds to a space; the 95-column rewrap split 'A-kinase-anchoring' across lines, rendering as 'A-kinase- anchoring' on the published page. Rewrapped with textwrap break_on_hyphens=False; no line in the block now ends in a hyphen. (2) The clause read 'Tetracycline-induced expression of SSeCKS', but PMID:9744295 is tet-off: 'The induction of SSeCKS (removal of tet) caused significant cell flattening and the elaboration of an SSeCKS-associated cortical cytoskeletal matrix resistant to Triton X-100 extraction.' Corrected to 'Tet-regulated induction of SSeCKS, on removal of tetracycline'. (3) Extended the PKC knowledge_gaps boundary to state that directly_involved_in GO:0090036 inherits the rodent-only support, since it is the damping rather than the binding that makes it regulation of PKC signalling. The reviewer asked this entry to mirror the calmodulin knowledge_gaps pattern; it already had a fuller block, so only the GO:0090036 inheritance clause was missing.
