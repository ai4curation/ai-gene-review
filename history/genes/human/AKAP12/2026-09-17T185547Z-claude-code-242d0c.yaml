  details: |
    Review round 5 on PR #3007. The round-4 clause said the detergent-resistant cortical matrix 'co-sediments with F-actin', fusing two different experiments from two papers. Verified against the cached abstracts: the matrix is PMID:9744295 (tet-induced SSeCKS in mouse NIH3T3, 'elaboration of an SSeCKS-associated cortical cytoskeletal matrix resistant to'), while the co-sedimentation is PMID:12083796 and is of 'bacterially expressed, unphosphorylated SSeCKS cosedimented with F-actin in ultracentrifugation assays' - purified protein in vitro, not the cellular matrix. PMID:12083796 moreover contrasts the two: 'in FAK-/- cells, SSeCKS costains along F-actin stress fibers, in contrast to FAK+/+ cells, where most SSeCKS stains at the cell edge and along a cortical cytoskeletal matrix'. The description now reports the three results at the level each was obtained and names the FAK-phosphorylation-dependent alternation rather than merging the states. Also corrected 'rat mesangial cells' to 'mesangial cells': PMID:9885289 states 'human and rodent mesangial cells' and never gives the immunofluorescence species, so the narrower wording overstated the source. Notes extended to record the anchor-ambiguity check and the pre-existing ambiguous anchor it exposed. Description block rewrapped to a uniform 95 columns. PR body was already current as of the previous round - all four figures the reviewer flagged were corrected before this review ran.
