- type: EDIT
  outcome: changed
  summary: Apply the generic-protein-binding policy to seven GO:0005515 rows
  details: |
    A post-merge audit of this batch's twelve merged reviews checked every GO:0005515 row against the annotation-reviewer policy in .claude/skills/annotation-reviewer/SKILL.md. AKAP12 and ARHGAP6 deviated; the other ten comply. The policy states: do not use MARK_AS_OVER_ANNOTATED for GO:0005515, because its problem is lack of functional information rather than a claim exceeding the evidence; use MODIFY where the cited paper supports a more informative molecular function, otherwise generally REMOVE, explaining that the generic annotation is uninformative and that removal does not mean the reported interaction is false. Provenance checked rather than assumed: the policy landed 2026-09-13 in commit b1cff30014, before this review was written, so the carve-out for older untouched reviews does not apply. Seven rows changed from MARK_AS_OVER_ANNOTATED (4: two EGFR rows PMID:20029029 and PMID:31980649, two CTNNB1 rows PMID:20195357 and PMID:35271311) and KEEP_AS_NON_CORE (3: the FHL1 rows PMID:21900206, PMID:23414517, PMID:35271311) to REMOVE. Each row's existing analysis already argued the annotation carries no functional information - hub partners recovered in abundance-sensitive screens, one assay platform logged twice, no binding determinant mapped - so no evidence assessment changed; none of the seven licensed a more informative term. Five reasons additionally had trailing clauses that justified the old action (kept rather than removed, both FHL1 rows are kept, left as protein binding) and would have contradicted the new one; those were rewritten to state the policy basis, since a machine-readable action contradicted by its own prose is the defect class this campaign has hit repeatedly. Final GO:0005515 split is 2 MODIFY and 7 REMOVE. Neither just validate nor the PR reviewer caught the original deviation.
