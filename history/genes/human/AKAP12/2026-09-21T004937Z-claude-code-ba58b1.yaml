  details: |
    Round 2 on #3095. The reviewer found a REMOVE row whose prose still argued for retention - the same defect class the PR exists to fix, in the PR that fixes it. Row 3 (FHL1, PMID:21900206) read 'It is retained but not upgraded'. My verification had scanned for three specific phrasings I remembered writing ('kept rather than', 'both FHL1 rows are kept', 'Left as protein binding'); this row used none of them. The method lesson is the reviewer's: scanning for strings you remember writing cannot catch a clause you did not write this pass. Replaced with a scan keyed on retention VERBS (retain|retained|keep|kept|left as|not removed|remains non-core) over every REMOVE row regardless of term, which finds exactly one row and now reports none. The GO:0030274 argument in that reason is load-bearing as the reason for no MODIFY and was preserved. Also took both non-blocking items: two reference_review notes were stale in the same prose-contradicts-decision way ('promoted the PRKAR2A and CTNNB1 rows' when nothing is promoted for CTNNB1 any more, and 'Usable only because' for a now-removed row), and 14 prose lines exceeded the file's wrap width. Rewrapped with break_on_hyphens=False and verified no folded-scalar mid-compound split was introduced, since a folded newline renders as a space. Confirmed by re-parsing that the only semantic change against the previous head is row 3's reason, and that description is unchanged.
