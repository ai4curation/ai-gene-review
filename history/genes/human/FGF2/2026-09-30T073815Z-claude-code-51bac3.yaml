  summary: Full AI review of human FGF2 annotations (309 GOA rows) with core functions
    FGFR binding and heparin binding
  details: |
    Reviewed all 309 GOA rows. Core functions: FGFR binding (GO:0005104; FGFR signaling + positive regulation of MAPK cascade, extracellular region) and heparin binding (GO:0008201, proposed NEW, comparator FGF1 carries it). Converted 13 FGFR 'protein binding' IPI rows to FGFR binding; removed 7 uninformative protein binding rows for regulators (FGFBP1, PTX3, CASP1, CEP57, RPS19, API5). Kept cytoplasm and nucleus (leaderless unconventional secretion; nuclear HMW isoforms). Angiogenesis/endothelial/developmental terms kept as non-core given viable Fgf2 knockout. MODIFY receptor-receptor interaction to FGFR binding, cytokine activity to growth factor activity, scratch-assay wound healing to negative regulation of fibroblast migration. UNDECIDED for rat-derived H3K9me2/3 reader and derived chromatin organization, and a negative-regulation EC migration IDA from a TSP-1 paper.
