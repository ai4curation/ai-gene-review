    Preserved all 61 prior source objects and actions, 49 reference identities and access flags, two alternative products, the functional cleavage-product mapping and both core identities. Added four clinical annotation anchors and two core anchors, and relocated the existing attachment excerpt to the new assertion. Predicted assembly effects remain distinct from measured experiments, and abstract-only access remains explicit. Removed 14 repeated Reactome caveats without changing their assessments. No publication cache was changed.

    ROOT and the independent peer reviewed the complete finite change, actual selected primary-source sections and current ontology definitions. All 17 quotation occurrences were checked with a maximum of 24 words per source. Normal validation, status initialization and rendering passed with zero advisories; three justified UNDECIDED judgments remain. Four curated files changed, with 54 source/history paths protected. The initial overly restrictive reading of the adhesion child term is superseded by the corrected candidate and independent consultation.
