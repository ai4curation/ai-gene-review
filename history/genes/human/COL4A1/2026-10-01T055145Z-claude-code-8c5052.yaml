  details: |
    Created a DRAFT review of human COL4A1 (P02462) for Track B of ORIGINS_OF_MULTICELLULARITY as an animal-innovation comparator. All 60 GOA rows reviewed: 47 ACCEPT, 8 KEEP_AS_NON_CORE, 2 REMOVE (generic protein binding with COL4A2, already captured by collagen type IV trimer; NAS collagen fibril organization, since collagen IV is network-forming), 2 MARK_AS_OVER_ANNOTATED (brain development, epithelial cell differentiation), 1 UNDECIDED (branching involved in blood vessel morphogenesis, abstract-only source), no NEW. Core function: ECM structural constituent conferring tensile strength in the collagen type IV trimer at the basement membrane, in basement membrane organization. Added PMID:28418331 and PMID:24344311 (full text read) for the absence of collagen IV in unicellular relatives and its presence in ctenophores, placozoans and homoscleromorph sponges. No deep-research provider was available; notes file written manually.
