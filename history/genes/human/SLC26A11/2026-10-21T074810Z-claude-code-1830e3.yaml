  summary: 'Create review: SLC26A11'
  details: |
    De-novo review of human SLC26A11 (Q86WA9), independent of ProtNLM2 predictions. Falcon and perplexity-lite deep research both failed, so the review was built from primary literature read directly, chiefly PMID:42509233 (human protein: electroneutral 1 H+ + 1 sulfate / 1 chloride exchange in proteoliposomes, cryo-EM homodimer, chloride channel gated by the transport cycle, lysosomal location). PANTHER tree check placed Q86WA9 in PTHR11814:SF55 under PAINT nodes PTN002483418, PTN000929279 and PTN000212046 (not under the NOT plasma-membrane node PTN000929309). All 38 GOA rows reviewed: sulfate transport, sulfate:proton symport, chloride channel, chloride transport and lysosomal membrane accepted; broad MF/BP terms marked TOO_GENERAL; membrane MODIFY to lysosomal/plasma membrane; plasma membrane, ER, Golgi, exosome, mouse-derived apical/basolateral, oxalate and proton transport kept as non-core; chloride:bicarbonate antiporter marked over-annotated (mouse COS-7 only, contradicted by guinea pig and purified human data, not propagated by PAINT); SMIM1 protein binding removed per policy. Added NEW GO:0160044 sulfate:chloride antiporter activity (IDA PMID:42509233). Lysosomal sulfate export left as a suggested question since it is inferred, not measured in cells.
