  summary: 'Round 2 (#4081 review): NEW coactivator row from human RFX7 data; corepressor row to ISO with mouse Ankra2; core MF transcription coregulator; affinage BLS miscitation recorded'
  details: |
    Added NEW GO:0003713 transcription coactivator activity (IMP, PMID:39181888: ANKRA2 binds the PDCD4 X-box with RFX7 and is needed to activate RFX7 targets). The GO:0003714 corepressor row is now ISO with supporting_entities UniProtKB:Q99PE2, and the core MF is the parent GO:0003712. The RFX7 MODIFY gains functional support. The affinage reference_review is MISCITED, because PMID:15655668 says ANKRA2 cannot complement BLS cells.
