  summary: Audit ATP7B copper transport and localization annotations
  details: |
    Reviewed all 61 original annotations, preserving their source objects and all
    five alternative products: 48 ACCEPT, 10 KEEP_AS_NON_CORE and three UNDECIDED.
    Consolidated one ATP-dependent Cu(I)-transport core with supported copper
    import into organelles, export, homeostasis and detoxification. Omitted the
    redundant broad vesicle location from the core while retaining its original
    annotation. Added no new annotation rows.

    Independent annotation review, primary-source and term checks, and a final
    source-closure consultation informed the changes. Added normal cached
    references PMID:38032054 and PMID:9600907 without modifying existing caches,
    raw GOA/UniProt records or the existing Falcon report. Preserved prior notes
    and appended the source-specific reasoning and read-scope limitations.
    ATP7B-containing microsomal transport assays do not establish purified
    reconstitution or a fixed copper/ATP stoichiometry. Context-dependent MDCK
    localization does not establish universal plasma-membrane copper flux; the
    reported mitochondrial 140-kDa product is not assigned to a specific splice
    product. Abstract-only evidence does not justify rejecting curator-assayed
    ATP7B on the basis of an ATP7A-focused paper title.

    Focused gene validation passed on 2026-09-29 with seven nonblocking warnings:
    five supported generic interactions retained as non-core under the supplied
    action definitions, source-specific mitochondrial decisions, and the
    preserved but uncited Falcon report. Rendering passed. Repository-wide
    validation was still running when this record was finalized; no global
    validation success is asserted. Publication uses native remote operations
    without changing local Git metadata.
