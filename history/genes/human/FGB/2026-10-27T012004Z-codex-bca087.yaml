  details: |
    FGB encodes the beta chain of fibrinogen, a secreted plasma complex containing two copies each of the alpha, beta and gamma chains. The beta chain contributes to interchain assembly, the coiled coils and the terminal globular domains of the complex. Thrombin releases the N-terminal fibrinopeptide B, exposing a binding sequence used during fibrin assembly. Beta chains provide structure within the resulting extracellular fibrin network; thrombin and Factor XIII perform the proteolytic and cross-linking reactions. FGB-containing fibrinogen also participates in platelet-associated and extracellular-matrix interactions, whose experimental effects often depend on the assembled complex. Preserve and review all 113 imported source contexts, 82 complete references, zero natural splice products and two accepted functional cleavage products. One accepted core and the documented unresolved contexts remain. No NEW annotation or publication quotation is introduced. Preserve all 80 selected normal sources and both machine snapshots byte-for-byte, with 6 normal additions and 74 exact main reuses at installation. The 13 previously shared FGA sources are now accepted exact-main reuses. No existing source is overwritten. All six canonical commands pass; the actual status remains DRAFT with five ROOT-accepted advisories. All 239 narratives render. The accepted exact-candidate reference check validates 33 PMID titles with zero snippet comparisons. The new scaffolded history validates.
