  summary: 'Create review: EFNA4'
  details: |
    Reviewed all 32 seeded GOA annotations for EFNA4 (P52798). Deep-research providers were unavailable, so research came from the cached publications, UniProt and PubMed and is recorded in EFNA4-notes.md. The main correction is the TAS row for transmembrane-ephrin receptor activity, a receptor term applied to a GPI-anchored ligand; it is modified to ephrin receptor binding, and the cited mapping paper is flagged MISCITED for that use while remaining correct for the ligand description. Four of the six bare protein-binding rows were modified to ephrin receptor binding because the partners are EphA4 and EphA10, and the two high-throughput interactome hits were removed as uninformative. Localization conclusion is plasma membrane with the protein GPI-anchored on the extracellular face, so all plasma-membrane rows were accepted and the generic membrane row refined; the extracellular-region row was kept as non-core because it reflects the secreted isoform 2. Cell communication and signaling were marked TOO_GENERAL, axon guidance kept as a non-core inherited family role, and one core function recorded.
