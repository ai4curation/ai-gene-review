  summary: Review GOLPH3, the PI4P-binding Golgi COPI vesicle adaptor
  details: |
    Core_adaptor gene from the MOLECULAR_ADAPTOR_ACTIVITY worklist. Reviewed all 60 GOA annotations: ACCEPT 32, KEEP_AS_NON_CORE 20, REMOVE 7, MARK_AS_OVER_ANNOTATED 1. Core MFs: GO:0140312 cargo adaptor activity (broad-spectrum COPI adaptor sorting Golgi glycosyltransferases into retrograde intra-Golgi vesicles; PMID:34473204) and GO:0070273 PI4P binding (PMID:19837035, bridges PI4P and actomyosin via MYO18A). Core processes: Golgi organization, protein retention in Golgi, Golgi vesicle budding, ribbon formation, protein targeting to Golgi. 7 bare protein-binding IPI -> REMOVE. GO:0010467 gene expression -> MARK_AS_OVER_ANNOTATED (implausibly broad; downstream readout). mTOR/migration/apoptosis/minor-mitochondrial rows -> KEEP_AS_NON_CORE. Added notes. Validates.
