  summary: Audit ALDH5A1 enzymology, pathway participation and source provenance
  details: |
    Substantively reviewed all 25 existing annotations, all 16 original references
    and four traced donor references, with one integrated catalytic core and 12
    propagation reviews. Preserved all original annotation source objects, two
    alternative products, reference identities, and immutable GOA/UniProt files.
    Refined GO:0009013 and GO:0016491 to the measured NAD+-dependent SSADH activity;
    the NAD(P)+ parent does not require both cofactors in one enzyme. Accepted
    homotetrameric association as integral enzyme assembly and accepted succinate
    and glutamate metabolism using direct catalytic work and the verified GABA-shunt
    parent relationships. Retained the existing CNS-development IMP as a bounded
    non-core clinical association after reading the full PMID:9683595 study.
    Corrected substrate-versus-product and visible-NAD+-moiety interpretation in
    PMID:19300440, the exception in the PMID:14635103 variant-activity statement,
    and rat-versus-human experimental scope in PMID:7814412. Distinguished curated
    proteomic localization from independently extracted gene-specific peptide data.
    Traced PAINT IBD ancestors, mouse MGI/MouseMine references and GO-CAM
    68d5ebd600002976 without treating target self-evidence as circular. Three new
    donor references, PMID:11544478, PMID:17854388 and PMID:12065715, remain uncached
    after the standard fetcher failed DNS retrieval (0/3). PMID:14651853 was already
    cached. Genuine Falcon plus automatic perplexity-lite fallback both failed
    during PyPI dependency retrieval before provider contact; no provider artifact
    was authored. Standard GOA publication caching found all nine original PMIDs.
    The annotation-reviewer peer independently read the clinical source and the
    parent independently reviewed all decisions, reference assessments and core
    with no biological changes requested. Kept DRAFT for the documented source
    gates. Checked 43 cached supporting quotations case-sensitively with whitespace
    normalization and the external clinical excerpt against original page 407.
