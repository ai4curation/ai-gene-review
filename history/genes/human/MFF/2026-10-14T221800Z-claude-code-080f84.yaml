  summary: 'Round 20: convert the two GO:0005739 ACCEPT rows to MODIFY with GO:0005741
    under the merged MODIFY-vs-general rule, and fix the UniProt line citations'
  details: |
    Round 20 of PR #4810. This round answers a rule that arrived with the Shepherd's merge of main
    rather than a defect in the curation as reviewed.

    The merge (5b65d4a3f) brought CLAUDE.md line 184 from PR #4881 - correct but general terms are
    MODIFY, not KEEP_AS_NON_CORE, whose operative clause is that the action must match the reason and
    one must never ACCEPT or KEEP_AS_NON_CORE while arguing the term is too general. Two rows in this
    review did exactly that: both GO:0005739 mitochondrion rows (HTP from PMID:34800366 and IDA from
    GO_REF:0000052) carried ACCEPT with the reason "Consistent with the well-established outer-membrane
    localization; correct, if less specific."

    MFF is the clearest case in the slice because this file already resolved the identical argument the
    other way, and that inconsistency predates the merge. The GO:0031966 mitochondrial membrane row
    carries MODIFY with proposed_replacement_terms GO:0005741 and the reason "Correct but less specific
    than the established outer-membrane location; MFF is a tail-anchored outer-membrane protein."
    GO:0031966 sits between GO:0005739 and GO:0005741 in the hierarchy, so the file was treating the
    intermediate term as a refinement and its own broader ancestor as acceptable, on one argument.

    Both rows are now MODIFY with proposed_replacement_terms GO:0005741 mitochondrial outer membrane.
    That is the replacement the new rule prefers, because the gene already carries it - five ACCEPTed
    rows including IDA and EXP, and it is in core_functions locations. The reason says so, and points
    at the GO:0031966 row as the same remedy, so a reader meeting either row sees one treatment.

    Verified before editing, not assumed: GO:0005741 is a descendant of GO:0005739 under is_a/part_of,
    checked against the QuickGO ontology ancestors endpoint rather than from memory. The consistency
    table in src/ai_gene_review/schema/action_consistency.yaml carries no MODIFY rule in either
    direction, so MODIFY beside the ACCEPTed GO:0005741 rows fires nothing; this was a latent
    inconsistency in prose rather than a validation failure, which is why nothing had caught it.

    Also in this push, the round-19 SUGGESTION, which became eligible by the condition stated when it
    was deferred. The notes cited ARFGEF2-uniprot.txt:6 and ARFGEF1-uniprot.txt:6 for those accessions
    where the AC line is line 2 in both files and line 6 is the DE RecName line. Both pointers are now
    :2. The accessions themselves were already right, so only the citations moved. The line number came
    from the round-18 review comment and was taken on trust; the round-18 reply had quoted both AC lines
    correctly, so the means to check it was already in hand and was not used.

    Verification: ai-gene-review validate passes on the review, with only the UV_NATIVE_TLS environment
    warning; 34 action entries against 34 MFF-goa.tsv data rows; a re-scan for ACCEPT or
    KEEP_AS_NON_CORE rows whose reason argues generality now returns zero for this file; no colon-space
    sequence in the new prose, asserted before writing.
