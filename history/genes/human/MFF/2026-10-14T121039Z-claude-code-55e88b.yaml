  summary: 'Round 18: correct the ARFGEF1 accession in the filter control (Q9Y6D5
    was ARFGEF2) and add accession-level legs plus a symbol-coverage count'
  details: |
    Round 18 of PR #4810. The one IMPORTANT item, and the fold-in it came with, in one push. The
    review file is unchanged; this round touches MFF-notes.md only.

    IMPORTANT, and verified against the local files before acting. The filter control added in round 17
    cited Q9Y6D5 as ARFGEF1's accession. Q9Y6D5 is ARFGEF2. ARFGEF1 is Q9Y6D6, which is the accession
    on its own GOA row (genes/human/ARFGEF1/ARFGEF1-goa.tsv, the NOT|enables GO:0005096 IDA row) and on
    its UniProt AC line; ARFGEF2's AC line is Q9Y6D5. ARFGEF2 holds no GO:0005096 row at all, so the
    accession leg was not a weak check on ARFGEF1 but a vacuous check on a gene that was never a
    carrier, and its negative result was uninformative. The reviewer's characterisation is exact. What
    makes it worth more than a typo correction is where it sat - it was the leg added in response to a
    suggestion asking for a provenance control, in the round whose subject was provenance, and it named
    the paralog of its own subject.

    The control's conclusion was already carried by its other legs and did not depend on the misnamed
    one. ARFGEF1 is absent from the 486 symbols, and the only qualifier value anywhere in the 2122
    results is enables, which settles the filter's semantics on its own. Both are restated and the
    accession leg is corrected to Q9Y6D6, which is also absent.

    The fold-in, which is the more substantial half. With the accession leg misattributed, the file had
    no working accession-level check, while both load-bearing checks were symbol-based over the 486 and
    the result set holds 1772 accessions. As the reviewer notes, absence from the 486 symbols equals
    absence from the carrier set only if every one of the 1772 accessions carries a symbol in the
    response, and a 3.6-fold ratio is equally consistent with isoform accessions sharing a parent
    symbol or with some accessions returning no symbol - the two being indistinguishable from the
    figures recorded.

    Re-ran the query counting that directly. All 2122 results carry a symbol, none without, so the
    equivalence holds and the ratio is the isoform explanation rather than the missing-symbol one. That
    is now recorded as the reason the symbol-level checks are sound, rather than left as an assumption.

    Both load-bearing checks also gained an accession leg, with every accession read from UniProt by
    exact gene symbol rather than written from memory, which is the rule the IMPORTANT item above
    exists to enforce. The four DRP1 receptors are absent at accession level as well as symbol level -
    MFF Q9GZY8, MIEF1 Q9NQG6, MIEF2 Q96C03, FIS1 Q9Y3D6 - and DNM1L O00429 is present among the 1772,
    which is the positive control the set of absences needed. L0R8F8, the AltMIEF1 alternative-ORF
    peptide that UniProt files under the MIEF1 symbol, is absent too, so the MIEF1 leg holds for both
    UniProt entries carrying that symbol rather than only for the canonical one.

    Verification: ai-gene-review validate still passes on the review, which this round does not touch;
    the diff is one file; ARFGEF1 and ARFGEF2 accessions were read from their UniProt AC lines and
    ARFGEF1's also from its GOA row, and ARFGEF2's zero GO:0005096 count from grep on its GOA file;
    the symbol-coverage count, the accession memberships and the qualifier set all come from a fresh
    run of the query rather than from either earlier run's output; the accessions in the new legs were
    resolved through the UniProt REST API by exact gene symbol and organism, with the returned primary
    accession and gene name both printed and checked.
