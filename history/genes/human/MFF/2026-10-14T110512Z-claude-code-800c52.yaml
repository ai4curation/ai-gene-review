  summary: Replace the false universal in the GO:0005096 question with the narrow
    claim the corpus supports, and scope the DRP1 control to what the paper measures
  details: |
    Round 13 of PR #4810, answering one IMPORTANT finding and two suggestions, all three on the prose
    added in round 12 rather than on any action or term.

    Finding 1, and it is my error. The suggested_questions entry added last round asserted that "every
    human carrier of that term is a catalytic activator with a GAP or TBC domain". That absolute is
    false, and this repository's own corpus falsifies it. Verified directly against the GOA files:
    ARHGEF16 carries GO:0005096 by IDA (PMID:21139582), C9orf72 by IMP (PMID:32303654), SOS1 by TAS
    (PMID:9790532), LRRK2 by IDA (PMID:17442267) plus IEA, ALS2 by two IDAs (PMID:12837691,
    PMID:15247254), RGS20 by IBA and TAS, and RP2 across six rows including three IDAs. None of those
    is a GAP- or TBC-domain catalytic activator: ALS2 is a VPS9 RabGEF, RGS20 carries an RGS box, RP2 a
    TBCC domain, and the rest are GEFs or a kinase. So neither half of the conjunction holds.

    The worse part is where it came from. Round 12's review stated the same generalisation with its
    exception attached -- "GAP-domain proteins ... or GEFs carrying it by TAS/IDA (SOS1, ARHGEF16)" --
    and in condensing it I dropped the exception and hardened a qualified claim into a universal. That
    is the defect this PR's review thread has been working on for nine rounds, committed one field
    further out, in the premise of a question addressed to GO rather than in a reason.

    The question survives on the narrower claim, which is both true across all 35 carriers and the one
    that actually bears on MFF: no human carrier is a receptor or adaptor for a self-assembling
    dynamin-family GTPase. The entry now says that, and names the carrier classes it does contain --
    GAP-domain proteins, other catalytic activators such as ALS2 and RGS20, and GEFs and kinases
    carrying it by IDA, IMP or TAS -- so a GO curator cannot read the GEF rows as a counterexample and
    dismiss the question on that basis.

    Suggestion 1, taken. The GO:0090141 reason said an oligomerization-defective DRP1 "is not stimulated
    at all", where the paper measures the narrower thing: the Drp1 401-404 AAAA mutant "is not activated
    by the Mff/actin combination". The clause now says that, and the sentence is added to the row's
    supported_by, so the only leg of the mechanism argument that had no quote behind it now has one.

    Suggestion 2, recorded here because history is append-only. The round-12 record for MFF says "All
    three PMID:34347505 quotes are preserved, moved to that row's supported_by together with the GFP-CC
    control sentence, so no verified evidence is lost by the removal." That is wrong twice over. Two of
    the three moved; the GFP-CC sentence is the third of them rather than an additional fourth; and the
    quote "Mff-deltaTM stimulates Drp1 GTPase activity poorly at low concentrations similar to those
    tested previously" was dropped, not preserved. Dropping it was right -- it supported the low-avidity
    framing that the removed row made and the surviving row does not -- so nothing is left unsupported,
    but "no verified evidence is lost" overstated it. The row now carries four quotes, three of them
    from round 12's set plus the actin-combination sentence added above.

    Validation: MFF-ai-review.yaml validates with one pre-existing warning.
