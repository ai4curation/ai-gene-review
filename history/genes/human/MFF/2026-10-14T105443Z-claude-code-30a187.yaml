  summary: Drop the MFF GO:0005096 NEW row; the GTPase stimulation is DRP1's own,
    so it belongs with the fission-regulation row and the adaptor activity
  details: |
    Round 12 of PR #4818's sibling PR #4810, answering the review's one IMPORTANT finding: the MFF
    `action: NEW` row for GO:0005096 GTPase activator activity failed the comparator check that
    CLAUDE.md requires of `NEW`.

    Verified the finding against primary sources before acting, rather than taking the reviewer's word:

    - GO:0005096 appears in 35 human GOA files in this repository, matching the review's count.
    - ARFGEF1 carries `NOT|enables GO:0005096` by IDA (PMID:15644318), and ARHGAP11B -- an inactive
      GAP -- carries two further NOT rows. GO reserves the term for actual GAP catalysis and has
      explicitly negated it for a protein that affects a GTPase without being one.
    - DNM1L's own review in this repository REMOVEs its GO:0005096, with the reason "effectors bind
      active GTPases but are not GAPs, and no stimulation of Rab32 GTP hydrolysis by DNM1L was shown."
      That is the same question answered the other way, on DRP1 itself.
    - The cited paper's own controls locate the activity in DRP1, not MFF: "GFP-CC itself has no
      ability to stimulate Drp1 GTPase activity ... showing that the Mff-CC alone is not capable of
      Drp1 activation", and an oligomerization-defective DRP1 "is not activated by the Mff/actin
      combination".
    - GO:0005096 occurs zero times in MFF-goa.tsv, so the row's own reason -- which said the activity
      "is kept as a non-core function" -- described retaining an annotation that does not exist.

    Under CLAUDE.md's "name the entity that performs the step" test the activation is delivered by
    DRP1's assembly interface; MFF supplies the clustering, which is GO:0043495 protein-membrane
    adaptor activity and is already this review's sole core molecular function.

    Resolution, following CLAUDE.md's guidance for a term proposal whose convention is unresolved:

    - The GO:0005096 NEW row is removed.
    - The quantitative stimulation is folded into the GO:0090141 positive regulation of mitochondrial
      fission row, whose ACCEPT reason already made the weaker and correct form of the claim. Its reason
      now carries the 10-fold/EC50 measurement and states explicitly that the rate increase is DRP1's
      own rather than a GAP activity of MFF, citing the two negative controls.
    - All three PMID:34347505 quotes are preserved, moved to that row's supported_by together with the
      GFP-CC control sentence, so no verified evidence is lost by the removal.
    - A suggested_questions entry asks GO whether a receptor that raises a dynamin-family GTPase's
      hydrolysis rate by clustering it, rather than by supplying catalytic residues, is intended to
      carry GO:0005096 -- recording the unresolved convention instead of asserting past it.

    Validation: MFF-ai-review.yaml validates (1 pre-existing warning). A first draft of the folded
    reason put a colon-space inside a plain YAML scalar and failed the scanner; reworded.
