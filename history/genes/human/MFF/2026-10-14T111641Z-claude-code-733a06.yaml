  summary: Correct the GO:0005096 carrier count and name DNM1L's IC row as the comparable
    precedent rather than excepting it from a taxonomy that excluded it
  details: |
    Round 14 of PR #4810, answering one IMPORTANT finding and two suggestions, all on the question text
    added in rounds 12 and 13.

    The finding is correct and the count was wrong in both directions at once. Verified by counting the
    corpus directly rather than from the review's table: 35 human symbols carry a GO:0005096 row, 34 of
    them a positive enables, because ARFGEF1's only row is NOT|enables by IDA. So calling it "the 35
    carriers" counted ARFGEF1 as a carrier in the same sentence that named it the negation. And of the
    34 positive carriers, 33 are catalytic; the 34th is DNM1L, by IC from its binding to GTP-bound
    Rab32 (WITH/FROM GO:0031267|GO:0030742), which is neither a GAP-domain protein, nor another
    catalytic activator, nor a GEF or kinase, and whose IC is not among the IDA, IMP or TAS the sentence
    listed. LRRK2's IEA row made that evidence list short for its own class too, so the enumeration of
    codes is gone rather than patched.

    The reframing the review proposed is better than a correction, and is what the entry now says.
    DNM1L is the one structurally comparable case anywhere in the corpus: a non-catalytic engagement of
    a GTPase, with the term assigned by curator inference from effector binding rather than from any
    catalysis, and removed by this project's own DNM1L review because effectors bind active GTPases but
    are not GAPs. That precedent was sitting in a subordinate clause while the taxonomy above it
    implicitly denied such a carrier existed. Stated the other way round, the question now shows that
    the one case resembling MFF's was already decided the way the question anticipates.

    I had found the DNM1L half myself before the verdict landed, from enumerating the carrier rows, and
    missed the ARFGEF1 half - my own enumeration printed its NOT|enables qualifier and I did not notice
    that this put it outside the carrier count I was asserting.

    Suggestion 1, recorded here because history is append-only. The round-13 record says "The row now
    carries four quotes, three of them from round 12's set plus the actin-combination sentence added
    above." That is right for the PMID:34347505 set and wrong as a statement about the row, which
    carries six supporting_text entries - the four from PMID:34347505 plus one each from PMID:23921378
    and PMID:23530241.

    Suggestion 2, taken: the three-word line the previous edit left mid-paragraph is re-wrapped.

    Validation: MFF-ai-review.yaml validates with one pre-existing warning. A first attempt at this
    edit again put a colon-space inside a plain YAML scalar - "are catalytic: GAP-domain proteins" - and
    failed the scanner, the same trap as round 12. Caught before committing both times; the lasting fix
    is to stop writing a colon into those sentences at all.
