  summary: 'Round 17: narrow the carrier-set claim to what the query reaches, add
    the ARFGEF1 filter control, correct 486 proteins to 486 symbols over 1772 accessions'
  details: |
    Round 17 of PR #4810. The one IMPORTANT item and both SUGGESTIONs, in one push.

    IMPORTANT, and the reviewer's diagnosis is exactly right. Round 16 set out to source the headline
    universal with a QuickGO query, and the query answers a narrower question than the claim. The
    sentence said that across the whole human carrier set no carrier is a receptor or adaptor for a
    self-assembling dynamin-family GTPase. The two logged checks establish (1) which carriers are
    themselves dynamin-family GTPases, which is a claim about the GTPases in the set and not about
    anybody's adaptors, and (2) whether DRP1's four receptors carry the term. The universal ranges
    over the receptors and adaptors of every dynamin-family GTPase - DNM1, DNM2, DNM3, OPA1, the
    mitofusins, the EHDs, the atlastins - and neither check touches any of them.

    What makes this different from rounds 11 through 16 is that sourcing cannot close it. Is a receptor
    or adaptor for a dynamin-family GTPase is not a field any annotation set returns, so there is no
    third query that would make the sentence sourced; establishing it would mean classifying 486 gene
    products by a property GO does not record. So the fix is to narrow rather than to source again.

    The sentence now asserts only the two checked claims, in the reviewer's own formulation: of the
    four mammalian outer-membrane DRP1 receptors - MFF, MIEF1, MIEF2 and FIS1 - none carries the term,
    and the only self-assembling dynamin-family GTPase that does is DRP1 itself. That is what the MFF
    case needs, it is what the log reaches, and a GO curator can re-run both legs rather than being
    asked to accept a classification over 486 gene products. The receptors are named rather than
    quantified over, so the claim does not depend on that set being exhaustive.

    MFF-notes.md gains a paragraph recording what the two checks do not establish and why no query can,
    because the first version of that section overreached and a note that merely stopped claiming it
    would leave the next reader to rediscover the limit.

    SUGGESTION 1, a control on the filter semantics. The notes called the result positive enables rows,
    which assumes QuickGO's qualifier=enables excludes NOT|enables, and the file supplies the control
    two clauses away. Re-ran the query capturing qualifiers and accessions: ARFGEF1 is absent from the
    486 symbols, its accession Q9Y6D6 is absent from all accessions, and the only qualifier value
    anywhere in the 2122 results is enables. ARFGEF1-goa.tsv carries a NOT|enables row by IDA and no
    positive row, so the control holds and now ties the in-corpus arithmetic to the query in both
    directions. Recorded as a third check in the notes and named in the question.

    Corrected in place in round 18, per the "never true, correct it in place" rule in
    docs/history.md, whose named example is a wrong identifier. This paragraph as first written gave
    ARFGEF1's accession as Q9Y6D5, which is ARFGEF2 - ARFGEF1 is Q9Y6D6, the accession on its own
    GOA row and on its UniProt AC line. The reason is kept here because a paralog accession is
    exactly the kind of value that gets quietly "corrected" back. What the round-17 session actually
    ran was the Q9Y6D5 lookup, so that session's accession leg was a vacuous check on ARFGEF2, a
    gene holding no GO:0005096 row; its conclusion rested on the other two legs, and round 18 re-ran
    the control on Q9Y6D6 and added accession-level legs for the proteins the checks turn on.

    SUGGESTION 2, and this one was a real error rather than a wording choice. The question said 486
    distinct proteins where the notes said 486 distinct symbols. Re-running the query with both counted
    separately gives 1772 distinct geneProductId accessions against 486 distinct gene symbols, a factor
    of 3.6, because a gene is annotated under more than one accession. So distinct proteins was wrong,
    not merely differently labelled. Both numbers are now recorded in the notes with the reason they
    differ, and the question says 2122 positive enables annotations across 1772 accessions and 486
    distinct gene symbols.

    Also fixed, in the edit script rather than in the content: the span detector used to apply these
    rewrites broke on a continuation line beginning InterPro:IPR001164, which matches a YAML-key
    pattern, so the first attempt replaced only the first 2751 characters of the question and left the
    old tail appended. It was caught by the round-trip assertion before anything was written to the
    branch, and the detector now relies on indentation alone. Round 16 was unaffected because that line
    fell mid-line under its wrapping, which is what made this latent rather than visible.

    Verification: ai-gene-review validate passes on the review, with only the UV_NATIVE_TLS environment
    warnings; the rewritten question round-trips through a yaml parse byte-identical to the drafted
    text; three suggested_questions entries, 34 action entries, and core_functions still GO:0043495 as
    the sole molecular function; no colon-space sequence in the new prose, asserted before writing; the
    ARFGEF1 and accession figures come from a re-run of the query rather than from the earlier run's
    output.
