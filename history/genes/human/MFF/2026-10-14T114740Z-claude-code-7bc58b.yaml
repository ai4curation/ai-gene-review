  summary: 'Round 16: fix the DNM1L self-engagement clause, split the five questioned
    rows from the three settled, source the carrier-set universal from QuickGO'
  details: |
    Round 16 of PR #4810. Both IMPORTANT items and both SUGGESTIONs taken in one push, all four in
    the same suggested_questions entry.

    IMPORTANT 1, the self-engagement clause. The entry said DNM1L is the structurally closest of the
    five precedents, being a non-catalytic engagement of the very GTPase MFF clusters. But DNM1L IS
    the GTPase MFF clusters, and the GTPase it engages in that row is Rab32 - verified at
    DNM1L-ai-review.yaml:583, whose summary reads inferred from DNM1L binding to GTP-bound Rab32
    family proteins, with the supporting quote that Drp1 is an effector protein for Rab32 family
    proteins. As written the clause had DNM1L non-catalytically engaging itself. The clause now gives
    the relation that actually makes it the closest precedent, and says explicitly that it is not the
    engagement of DRP1 - it is that DNM1L is the only self-assembling dynamin-family GTPase in the
    carrier set, so a protein of DRP1's own class received the term from non-catalytic GTPase binding
    and this project removed it.

    IMPORTANT 2, two counts stronger than their sources. The entry said this project had resolved the
    molecular function away five times, under an antecedent asserting each row sat on a protein that
    engages a GTPase without catalysing. Checked against the two ArfGAP rows, both overstate.
    AGFG2-ai-review.yaml:176 is UNDECIDED and its reason says they do not prove inactivity and that
    absent assays and Thr89 divergence do not refute it; AGFG1-ai-review.yaml:694 is
    MARK_AS_OVER_ANNOTATED on evidence that predicts substantially reduced GAP activity rather than
    proving its complete absence. The entry now says five rows questioned and three settled against
    the molecular function, names the three REMOVEs (DNM1L by IC, ARHGAP11B by Reactome TAS against
    two IDA negations, ARHGAP36 by IBA) separately from the two ArfGAP IEA transfers where catalysis
    is judged reduced but not disproven, and keeps the span across IC, TAS, IBA and IEA. That is the
    reviewer's own reformulation and it is both true and stronger than the single analogue of round 14.

    SUGGESTION 1, the headline universal, carried over from round 15 where it did not ride the push.
    The clause no human carrier of that term is a receptor or adaptor for a self-assembling
    dynamin-family GTPase was asserted over all human carriers but sourced from the 35 folders in this
    repository, out of 2958 human folders. The reviewer named six canonical carriers with no folder
    here. Rather than scoping the claim with a phrase, it is now sourced, as the reviewer preferred,
    from a QuickGO query logged in MFF-notes.md the way TRMT10C-notes.md logs its three curls - so the
    premise is checkable by the GO curator it is addressed to.

    The query, for positive enables rows on GO:0005096 in human, returns numberOfHits 2122 over 22
    pages of 100, giving 486 distinct symbols. Two checks over that set. First, the only
    dynamin-superfamily member among the 486 is DNM1L itself, checked against DNM1, DNM2, DNM3, DNM1L,
    OPA1, MFN1, MFN2, MX1, MX2, EHD1 to EHD4, GBP1 to GBP7 and ATL1 to ATL3. Second, none of the DRP1
    receptors or adaptors carries the term - MFF, MIEF1, MIEF2 and FIS1 are all absent. The same query
    confirms the reviewer's finding that the folder set is not the carrier set: ARHGAP1, ARHGAP5,
    ARHGAP35, RACGAP1, RABGAP1 and TSC2 are each in the result and none has a folder here. It also
    grounds the replacement clause in IMPORTANT 1 above, since only-dynamin-family-member-in-the-set is
    now a statement about the whole set rather than about the sample.

    The five dispositions stay scoped to this repository, because they are claims about its own
    reviews, and the question says so.

    SUGGESTION 2, cosmetic. The GO:0090141 reason scalar is re-wrapped so the three-word line left by
    the round-14 re-wrap is gone rather than moved again; the value is unchanged.

    Verification: ai-gene-review validate on the review passes, with only the UV_NATIVE_TLS
    environment warnings; the rewritten question round-trips through a yaml parse byte-identical to the
    drafted text; no colon-space sequence is present in the new prose, asserted before writing, since
    that has broken the scanner twice in this file's history; the DNM1L, AGFG1 and AGFG2 lines were
    read directly before being described rather than taken from the review comment.
