  summary: Stop quantifying catalytic membership in the GO:0005096 question and list
    the five precedents this project has already resolved away from the MF
  details: |
    Round 15 of PR #4810. One IMPORTANT finding, and it is the fifth consecutive round in which the
    defect sits in the same place - a quantifier over a class in this one sentence - so this round
    removes the quantifier rather than correcting it again.

    The finding is right. "33 of those 34 are catalytic" is contradicted for four of the 33 by this
    repository's own reviews, each verified at the cited line:

    - ARHGAP11B-ai-review.yaml:388 is REMOVE. Its UniProt RecName is "Inactive Rho GTPase-activating
      protein 11B", and the positive GO:0005096 row is a Reactome TAS set-level projection standing
      against two IDA negations on the same gene.
    - ARHGAP36-ai-review.yaml:243 is REMOVE, summarised as "Convergent sequence and cellular activity
      evidence supports loss of conventional catalytic GAP activity".
    - AGFG1-ai-review.yaml:694 is MARK_AS_OVER_ANNOTATED, on an IEA transfer from InterPro:IPR001164.
    - AGFG2-ai-review.yaml:176 is UNDECIDED, summarised as "The ArfGAP-domain activity inference is
      unresolved", on the same IEA transfer.

    ARHGAP11B is the one that should not have happened. I supplied it myself in the round-13 reply, as
    the inactive GAP whose two NOT rows sharpen the point, and then counted it among the catalytic 33 one
    round later - in the sentence whose only job is to separate catalysts from non-catalysts.

    Rounds 11 to 15 have each turned on a claim about a whole class in this sentence: first "every human
    carrier is a catalytic activator with a GAP or TBC domain", then "the 35 carriers", then "33 of those
    34 are catalytic". Correcting the count a third time would leave the same shape in place, so the
    entry now asserts no count of catalytic members at all. It keeps only what was checked by command -
    35 symbols with a GO:0005096 row, 34 with a positive enables, ARFGEF1's only row NOT|enables - says
    that the term is conventionally applied to catalytic activators without quantifying how many of the
    34 are, and then lists the five positive rows this project has resolved away from the molecular
    function, with their evidence codes and dispositions. That is a stronger premise than the one it
    replaces, because it offers GO five precedents across IC, TAS, IBA and IEA rather than a single
    analogue, and because every element of it is a file this reviewer or any reader can open.

    Validation: MFF-ai-review.yaml validates with one pre-existing warning. The edit script asserted the
    absence of colon-space in the new scalar before writing, after that mistake twice in three rounds.
