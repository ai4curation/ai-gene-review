  summary: 'Create review: CD14'
  details: |
    Reviewed all 151 GOA annotations for human CD14 (P08571) against cached primary literature and Falcon deep research. CD14 is treated as the GPI-anchored/soluble LPS and acyl-PAMP carrier that delivers ligand from LBP to TLR4-MD-2 and TLR2 heterodimers: core MF molecular carrier activity (matching the production TLR4 and TLR1-TLR2 GO-CAMs) plus LPS binding, in the LPS receptor complex, participating in TLR4 and cell-surface PRR signalling. LPS immune receptor activity was modified to molecular carrier activity because CD14 has no transmembrane signalling domain; peptidoglycan immune receptor activity was modified to peptidoglycan binding; TLR protein-binding rows were modified to Toll-like receptor binding; FSTL1 and MYO18A protein-binding rows and the apoptotic process TAS were removed; opsonin receptor activity marked over-annotated; cytokine, Golgi, endosome, granule and exosome terms kept as non-core. No NEW annotations. Actions: 93 ACCEPT, 47 KEEP_AS_NON_CORE, 6 MODIFY, 4 REMOVE, 1 MARK_AS_OVER_ANNOTATED. just validate passes; all 261 supporting quotes verified as verbatim substrings.
