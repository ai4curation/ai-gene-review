  summary: First review of RHO for the dismech vision-disorder alignment
  details: |
    First annotation review of human RHO (rhodopsin), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1, phototransduction). All 75 GOA rows were reviewed: 32 MODIFY, 19 KEEP_AS_NON_CORE, 18 ACCEPT, 5 REMOVE, 1 MARK_AS_OVER_ANNOTATED. Core functions: GO:0008020 G protein-coupled photoreceptor activity in GO:0141190 transducin-mediated opsin signaling pathway at the rod photoreceptor disc membrane, and GO:0005502 11-cis retinal binding in absorption of visible light. Four bare protein-binding rows are removed as uninformative under the protein-binding policy. The Ensembl Compara cell-cell junction row is removed: its mouse donor annotation cites a T cell immunological-synapse paper (PMID:23793062), recorded as a source defect. Three IDA location rows cite PMID:11767049, whose cached abstract is a kidney extracellular-matrix study that does not mention rhodopsin; the locations are kept on other evidence and the reference is recorded as a suspected mis-keyed PMID. Literature input: GOA-cited papers, UniProt record, and an OpenScientist report used as a lead; classic biochemistry is on bovine rhodopsin and the review says so. Validated with just validate human RHO: no errors; warnings left for three IBA MODIFY rows without propagation_review metadata.
