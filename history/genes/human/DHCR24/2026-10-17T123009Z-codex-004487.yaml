  summary: Review DHCR24 sterol reduction and p53 binding
  details: |
    Augmented the existing human DHCR24 review while preserving all 50 historical source annotations and prior source caches, Falcon research, pathway and history. Reviewed 14 ACCEPT, 8 KEEP_AS_NON_CORE, 21 MODIFY and 7 UNDECIDED actions, with no NEW annotations. Consolidated sterol reduction into one ER-membrane catalytic unit and documented a distinct experimentally separable p53-binding unit. Corrected reaction scope, specific protein-partner binding and membrane-mediated regulatory roles; retained source-access and 516/475-residue product limits. Added a public evidence guide, new notes, seven genuine publication caches and three genuine Reactome caches. Normal validation, terms, DRAFT status and rendering passed with two scoped generic-binding advisories and one unused-provider advisory. Preserved earlier obsolete-term migration provenance. ROOT independently checked all annotation decisions, original core evidence and the linked Figure1-label correction PMID25924892; the correction does not alter the interaction or assay evidence used here.
