  summary: AI review of TSPOAP1 (RIM-BP1) GO annotations
  details: |
    Reviewed all 26 GOA rows for TSPOAP1 (O95153). Two protein binding IPI rows with CACNA1A modified to transmembrane transporter binding; protein binding with ADAM19 (SH3 array screen) removed as uninformative. Mitochondrion (IDA, IBA, IEA) and benzodiazepine receptor binding (IPI, IBA) marked over-annotated: all rest on the 1999 PRAX-1 study (PMID:9915832), UniProt records a caution that the TSPO association was not found in rat brain, and the IBAs are seeded by this protein's own annotations. Voltage-gated calcium channel activity (IEA from mouse) removed: RIM-BP1 is a cytoplasmic scaffold without channel activity. Regulation of neurotransmitter secretion (IMP, PMID:33539324) accepted. Cytoplasm, Reactome cytosol, calyx of Held, glutamatergic synapse and regulation of presynaptic cytosolic calcium kept as non-core. Added NEW presynaptic active zone and structural constituent of presynaptic active zone (ISS, PMID:33539324, PMID:11988172, PMID:10748113), matching the RIMBP2 and rimb-1 reviews. Fetched PMIDs 10748113 and 11988172. Validated with just validate (clean) and quote_check (36 verified).
