  summary: Refine BICRA BRD4 adaptor activity and developmental evidence
  details: |
    Independently reviewed the final follow-up prepared by bckdk_seed. Refined
    the two BRD4 interaction annotations to protein-macromolecule adaptor
    activity using the inspected human interaction-network/GBAF evidence and
    the explicit UniProt bridge annotation. The separate remodeling core
    retains contributes_to, without assigning ATPase chemistry to BICRA.
    Added the verified normal, abstract-only PMID33232675 source and described
    human developmental disease separately from zebrafish and fly experiments.
    Clarified positive UniProt corroboration of NCK1/CRK while retaining three
    source-specific peptide access uncertainties and one unresolved spatial
    transcription-activator mechanism. Preserved all 22 annotation source
    objects, both alternative products, existing references, raw sources and
    prior history. Final decisions: 10 ACCEPT, 5 MODIFY, 3 KEEP_AS_NON_CORE,
    4 UNDECIDED, two core functions, no NEW annotations. ROOT science peer
    bc87a7 preceded exact canonical application dcd1e5. Focused canonical
    validation, rendering and history checks are recorded in the final
    biological manifest; no whole-paper, supplementary or PAINT-tree audit
    is claimed.
