  summary: 'Create review: FOLR1'
  details: |
    Reviewed all 83 seeded GOA annotations for FOLR1 (P15328); provenance notes are in FOLR1-notes.md because deep-research providers were unavailable. Localization conclusion is GPI-anchored on the outer leaflet of the plasma membrane with the folate-binding domain extracellular and surface-accessible, plus the clathrin-coated vesicle and endosome recycling route, all accepted; the 21 Reactome rows covering ER membrane, ERGIC, ER-to-Golgi vesicles, Golgi membrane and transport vesicles were kept as non-core because they describe GPI-anchoring and secretory transit, as were the shed extracellular form and the single reported nuclear pool. Both signaling receptor activity rows were modified to folic acid receptor activity, which GO places under cargo receptor activity, with a propagation review on the IBA row; tetrahydrofolate biosynthetic process was marked as over-annotation since FOLR1 imports folates rather than reducing them; the high-throughput protein-binding row was removed; rodent-derived developmental and signalling rows were kept as non-core. One core function was recorded.
