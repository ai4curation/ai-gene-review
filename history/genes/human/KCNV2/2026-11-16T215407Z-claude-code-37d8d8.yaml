  summary: First review of KCNV2 for the dismech vision-disorder alignment
  details: |
    First annotation review of human KCNV2 (Kv8.2), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1). 17 GOA rows reviewed: 8 MODIFY, 7 ACCEPT, 1 REMOVE, 1 MARK_AS_OVER_ANNOTATED; two NEW rows by ISS from the mouse knockout (PMID:34652420): photoreceptor inner segment and regulation of resting membrane potential. Kv8.2 is silent alone and modifies Kv2.1 channels, so the core function is contributes_to GO:0005249 voltage-gated potassium channel activity within the voltage-gated potassium channel complex. Two source defects are recorded: an InterPro-derived row that gives enables where contributes_to applies, and protein homooligomerization for a subunit that does not form homomers (refined to heterooligomerization). Validated with just validate human KCNV2: no errors.
