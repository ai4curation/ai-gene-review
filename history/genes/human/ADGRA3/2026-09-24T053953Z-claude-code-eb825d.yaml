  summary: Seven flags removed, six restored after a tooling error
  details: |
    Part of a single sweep repairing fabricated supporting_text across the gene reviews written in PR #2956. Those reviews set full_text_unavailable: true on supported_by entries whose cited publication is cached in full; that flag suppresses the repo's verbatim-substring validator, so every quote it covered entered the repo unverified. 76 of the 79 flagged entries quoted text that is not in the cited paper.

    Each entry was either re-grounded on a verified verbatim quote from the same paper, or the citation was deleted and its claim moved into review.reason as an explicit inference. No curation decision was changed: action, term, evidence_type, original_reference_id and proposed_replacement_terms are untouched unless stated below.

    Net effect: one flag correctly removed, six restored.

    The audit tool used for this sweep reported all seven of this file's flagged entries as 'quote is real, drop the flag'. Six of those sat on abstract-only caches where the flag was correct; the tool's check fired before testing whether the source had full text, so it mislabelled correct flags as wrong, and the brief built on it said to delete them. The tool was fixed and the six flags restored. Only PMID:24550280 genuinely had a false flag.

    No quote in this file was ever fabricated.
