  summary: 'Initial review of human ANAPC4: APC/C platform subunit; HLA-paper TAS
    row flagged as wrong identifier, stress-foci nuclear-periphery IBA over-annotated'
  details: |
    Reviewed 76 GOA rows. Accepted the APC/C complex, catabolism, chain-type, location and mitotic-regulation rows. MODIFY the GO:0004842 TAS (PINC) to contributes_to GO:0061630; its PMID:6180011 is a 1982 HLA paper (WRONG_IDENTIFIER). MARK_AS_OVER_ANNOTATED the nuclear-periphery IBA, whose only donor is yeast Apc4 in stress-induced INQ foci (PMID:25817432). KEEP_AS_NON_CORE PTEN binding and the meiotic NAS. Removed 15 protein-binding IPIs. The affinage record tripped its trust gate and is not used.
- type: EDIT
  outcome: changed
  sections:
  - core_functions
  summary: 'Add GO:0140378 protein complex scaffold activity as the core molecular function'
  details: |
    Added GO:0140378 protein complex scaffold activity as core_functions.molecular_function, keeping contributes_to GO:0061630, for consistency with the ANAPC16 review (#4058). No NEW GOA row is proposed, because small APC/C subunits carry no scaffold MF in GOA.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - core_functions
  - references
  summary: 'Round 2 (#4059 review): GO:0004842 MODIFY target and core MF to GO:0160072 per the repo APC/C scaffold convention; protein-binding reasons; core locations'
  details: |
    Re-pointed the GO:0004842 MODIFY from GO:0061630 to GO:0160072 ubiquitin ligase complex scaffold activity, and set core_functions.molecular_function to GO:0160072 (replacing GO:0140378). This follows the repo convention for APC/C scaffold subunits (APC1/nuc2, cut9, CDC27, CDC16, ANAPC2), citing PMID:21307936 and PMID:27601667. The 15 protein-binding REMOVE reasons now explain why co-purifications are removed rather than re-pointed. Added core locations. The notes now say the WRONG_IDENTIFIER reference_review is what records the PMID:6180011 miscitation.
