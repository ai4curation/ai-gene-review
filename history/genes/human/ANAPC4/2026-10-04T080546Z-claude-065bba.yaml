  details: |
    Reviewed 76 GOA rows. Accepted the APC/C complex, catabolism, chain-type, location and mitotic-regulation rows. MODIFY the GO:0004842 TAS (PINC) to contributes_to GO:0061630; its PMID:6180011 is a 1982 HLA paper (WRONG_IDENTIFIER). MARK_AS_OVER_ANNOTATED the nuclear-periphery IBA, whose only donor is yeast Apc4 in stress-induced INQ foci (PMID:25817432). KEEP_AS_NON_CORE PTEN binding and the meiotic NAS. Removed 15 protein-binding IPIs. The affinage record tripped its trust gate and is not used.
