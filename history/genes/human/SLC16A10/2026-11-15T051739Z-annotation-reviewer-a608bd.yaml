  summary: De-novo review of all 43 GOA annotations for SLC16A10 (MCT10/TAT1), facilitative
    aromatic-AA and thyroid hormone transporter
  details: |
    Reviewed every GOA row for SLC16A10 (Q8TF71, MCT10/TAT1). Two core MF (QuickGO-verified): GO:0015173 aromatic amino acid transmembrane transporter activity (IDA PMID:11827462; system-T facilitated Na+/H+/Cl--independent Trp/Tyr/Phe/L-DOPA transport; its is_a children are exactly the gene's substrate-specific MF terms GO:0015196/GO:0005302/GO:0015192) and GO:0015349 thyroid hormone transmembrane transporter activity (IDA PMID:18337592, PMID:21315799; facilitative T3/T4, as active as MCT8). Locations GO:0005886 + basolateral GO:0016323. Actions (43): 30 ACCEPT, 4 MODIFY (GO:0015171 AA->GO:0015173 aromatic x2; GO:0003333/GO:0006865 AA transport->GO:0015801 aromatic AA transport; lateral substrate-accuracy replacements, non-descendant, permitted), 3 TOO_GENERAL (root transporter/transport), 3 REMOVE (bare protein binding, HuRI Y2H), 1 KEEP_AS_NON_CORE (cell junction, single HPA IF). proposed_new_terms: none; raised suggested_question on GO:0015349 active-transport classification vs MCT10's demonstrably facilitative mechanism. Shares GO:0015349 + facilitative-vs-active ontology quirk with MCT8/SLC16A2. source_defects: none. Batch 11.
