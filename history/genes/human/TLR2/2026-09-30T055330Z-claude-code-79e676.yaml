  summary: 'Create review: TLR2'
  details: |
    Reviewed all 145 GOA annotations for human TLR2 (86 ACCEPT, 21 KEEP_AS_NON_CORE, 19 REMOVE, 10 MARK_AS_OVER_ANNOTATED, 7 MODIFY, 2 UNDECIDED) and added one NEW MF, diacyl lipopeptide binding (IDA, PMID:19931471 structure). Core functions: pattern recognition receptor activity in the TLR1:TLR2 and TLR2:TLR6 heterodimers, triacyl lipopeptide binding, and Toll-like receptor binding. The LPS immune receptor TAS row was removed because the cited review assigns LPS to TLR4; the LPS IDA rows are UNDECIDED because their full texts are not cached. Protein-binding rows were changed to Toll-like receptor binding or TIR domain binding where the paper supports it and removed otherwise. Mouse ISS neural terms and indirect regulation terms were marked over-annotated. just validate passes with no warnings and validate-references passes. Falcon deep research had not finished when the review was completed.
