  details: |
    Create a new human CD44 review from seeded GOA, fetched publication and Reactome caches, failed deep-research attempts recorded in notes, manual source review and annotation-reviewer consultation. Review all 88 imported annotations; final actions are 38 ACCEPT, 30 KEEP_AS_NON_CORE, 9 MODIFY, 5 TOO_GENERAL, 4 REMOVE and 2 UNDECIDED. The review accepts core hyaluronan binding, cargo-receptor uptake and transmembrane scaffold signaling roles, including the CD74/MIF receptor instance; revises generic binding and monocyte-aggregation rows to more informative terms; settles weak collagen-binding and adhesion rows with UniProt curated text; and records source_defects for the non-human FMDV GOA provenance and the NK T to NK GO-CAM term error. Add three core functions plus follow-up questions and experiments. Focused validation, local quote validation, record-section backfill, rendering and history validation pass.
