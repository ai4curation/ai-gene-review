  summary: 'Create review: CRLS1'
  details: |
    De novo review of human CRLS1 (CDP-type cardiolipin synthase, Q9UJA2), selected from projects/MITOTOL.md (Chen et al. 2026, PMID:42822426). All 30 GOA rows reviewed: CMP-forming cardiolipin synthase activity, cardiolipin biosynthesis and mitochondrial (inner) membrane rows accepted; broad InterPro/ARBA IEA rows accepted after confirming they lie on the CDP-type (not PLD-type GO:0008808) branch. Two Reactome TAS rows mapping LPG acylation to lysophosphatidic acid acyltransferase terms (GO:0003841, GO:0047144) removed as wrong-substrate mappings of a single-lab claim (PMID:20025994); PG acyl-chain remodeling (GO:0036148) left UNDECIDED. Added Nie 2010, Kasahara 2020, Serricchio 2018, a 2026 cardiac Crls1 KO study and the Chen 2026 comparative paper as references.
