  summary: Review CACNA2D4 auxiliary calcium-channel regulation and retinal evidence
  details: |
    Reviewed all seven original human CACNA2D4 annotations and preserved every source field and all six alternative products. Four annotations are ACCEPT, two channel-activity assertions are refined to calcium channel regulator activity, and the specific light-detection IMP remains UNDECIDED because the original human retinal full text was inaccessible. One core describes active auxiliary regulation in the voltage-gated calcium-channel complex and participation in calcium transport, without assigning the alpha1 pore to alpha2delta-4. Direct human coexpression evidence and two normally fetched mouse retinal studies support the mechanism; rod photocurrents, downstream synaptic transmission, cone ribbon versus postsynaptic-triad outcomes, residual channel activity, and cellular association versus purified binding are distinguished. Proteolytic processing and the complete PAINT ancestral reconstruction remain explicit limits. No NEW annotation was added. Independent ROOT review covered all seven rows, the core and notes; the final requested amendments added reference-only core pointers and corrected PMID-link formatting. Normal final TMP validation and rendering passed; canonical validation and rendering passed before this generated history record. Original UniProt/GOA and all four publication caches are preserved exactly. The failed Falcon and perplexity-lite research attempt is documented without a fabricated provider report.
