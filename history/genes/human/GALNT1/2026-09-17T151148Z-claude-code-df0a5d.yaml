  summary: Downgrade extracellular region to over-annotated after OpenScientist run
  details: |
    Blinded OpenScientist function-assignment run on GO:0005576 returned weakly supported and overturned this review's earlier ACCEPT. Verified its checkable claims independently: the UniProt 'Secreted' subcellular-location line on the soluble-form chain carries no ECO evidence code (confirmed in the local record), and PMID:35279766 was fetched and searched, confirming that the SPPL3-shedding mechanism which would justify the term is validated for GALNT2, not GALNT1 -- GALNT1 has zero word-boundary mentions in that paper, its apparent hits being substrings of B4GALNT1. Action changed ACCEPT -> MARK_AS_OVER_ANNOTATED; retained rather than removed because the shedding mechanism is real and a shed GALNT1 species remains plausible. One report claim, that HPA classifies GALNT1's secretome location as 'Intracellular and membrane', could not be verified because the HPA API does not serve that column, and is explicitly not relied on.
