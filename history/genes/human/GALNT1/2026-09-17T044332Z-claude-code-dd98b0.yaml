  summary: 'Create review: GALNT1 (mucin-type O-glycan initiation, GLYCOBIOLOGY)'
  details: |
    De-novo review of human GALNT1 -- GalNAc-T1; initiates mucin-type O-glycosylation -- as part of the GLYCOBIOLOGY project's Phase 3 mucin-type O-glycan batch, which closes the O-glycosylation coverage gap identified when the project's pathway modules were indexed. Deep-research tooling was unavailable in this environment (invalid OPENAI_API_KEY), so no -deep-research-PROVIDER.md file was generated; the review is grounded instead in the cached publications for every PMID cited by GOA, all of which were present. Every supporting_text quote was verified as a verbatim substring of the cached publication, and every proposed GO term was checked against QuickGO for existence, aspect and obsolescence before use.
