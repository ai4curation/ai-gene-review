  summary: Expand YAML aliases so quotes are readable inline; reconcile quote counts
  details: |
    PR #3058 review flagged that published quote counts disagreed (project page 124, commit message 164, PR body 148). Root cause found: the GALNT1 build script reused the same Python dict objects across annotations, so yaml.safe_dump emitted 3 anchors and 16 aliases. The file was valid and safe_load resolved them, which is why validation passed and why a structured count saw 164 while a grep for supporting_text literals saw only 33 for this gene. Both counts were honest and measured different things. Aliases expanded by deep-copying every node before dump, so each quote now appears in full at its point of use rather than as *id001, which also makes the file reviewable and diffable and consistent with the other three genes, none of which had aliases. Structured and literal counts now agree per gene (GALNT1 64, C1GALT1 25, C1GALT1C1 36, GCNT1 39) for 164 total, all verified verbatim. Project page corrected 124 -> 164.
