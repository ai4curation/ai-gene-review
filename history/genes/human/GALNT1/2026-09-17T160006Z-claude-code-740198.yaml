  summary: 'Address PR #3058 review findings; add curation notes journal'
  details: |
    Acted on the ai4c-reviewer bot review of PR #3058. Verified each finding before acting. Fixed: C1GALT1 angiogenesis KEEP_AS_NON_CORE rested on an uncited appeal to the mouse literature, so PMID:14745002 (Xia et al., defective angiogenesis and fatal embryonic haemorrhage in T-synthase-null mice) was looked up via PubMed rather than guessed, fetched, and cited, which also makes the asymmetry with the kidney development row rest on evidence. GCNT1 was missing one GOA row: two GO:0005515 IPI rows differing only in assigned_by (IntAct vs UniProt) had been collapsed into one, which the schema validator does not catch because it dedupes; the duplicate was added with the same REMOVE verdict, taking GCNT1 from 21 to 22 annotations. C1GALT1C1 core_functions.directly_involved_in GO:0006493 was dropped for internal consistency: Cosmc catalyses no step and contributes neither structure nor cofactor activity, which is the same standard used to demote GCNT1 leukocyte tethering and C1GALT1 angiogenesis; the existing-annotation ACCEPTs are unchanged. GALNT1 now cites PMID:9394011 (Roettger et al.), UniProt's own GALNT1-specific Golgi localisation reference, on the Golgi CC rows, and the GO:0005576 wording no longer rests on a contrast that does not hold, since the Golgi location line is also uncoded. REJECTED one finding with evidence: GO:0000139 is not an ancestor of GO:0032580 under is_a or is_a,part_of per QuickGO, so the GALNT1 core_functions locations are not parent/child redundant. Added GENE-notes.md journals for all four genes per CLAUDE.md, recording the HPA comparator queries, the SPPL3 word-boundary check and the comparator tests that previously survived only inside review.reason. All 164 YAML quotes and 22 notes quotes verify verbatim.
