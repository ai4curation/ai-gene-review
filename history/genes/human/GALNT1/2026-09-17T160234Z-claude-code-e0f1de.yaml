  summary: Hedge description clause left asserting the demoted extracellular localisation
  details: |
    PR #3058 re-review found that the top-level description still stated 'with a proteolytically released soluble ectodomain also found in the extracellular space' as established fact, although the GO:0005576 row had been downgraded to MARK_AS_OVER_ANNOTATED in commit e9016f5. This was a genuine miss: the correction landed in the annotation review and in suggested_questions but not in description, which is the field a biologist reads standalone without the annotation table. Reworded to state what is actually supported -- UniProt records a soluble form as a separate chain, and SPPL3-mediated shedding of Golgi glycosyltransferases is a real class phenomenon, but release of a soluble GALNT1 ectodomain is not established for this enzyme specifically, the validated GALNT-family substrate being GALNT2. Checked the rest of the file for other places the downgrade had not propagated; none found.
