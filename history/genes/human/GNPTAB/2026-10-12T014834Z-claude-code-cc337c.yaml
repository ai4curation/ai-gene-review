  summary: State the real strength of the calcium-binding signature evidence
  details: |
    Review round 3 suggestion 3 for PR 4816. The GO:0005509 KEEP_AS_NON_CORE reason said UniProt annotates an EF-hand domain while quoting only the bare string 'EF-hand', which undersold its own support: UniProt carries per-residue Ca(2+) BINDING features, in the EF-hand domain at 1005..1040 and in the LNR repeats. The reason now says that, and quotes both the domain note and a ligand line. The action does not change, and neither does the caveat: every one of those features is ECO:0000255, inferred from a sequence model rather than measured, so calcium binding by GNPTAB and its functional relevance still have not been demonstrated experimentally. The row is non-core on the strength of the evidence rather than on doubt about the signature, which is what the reason now says rather than implying the signature is thin.
