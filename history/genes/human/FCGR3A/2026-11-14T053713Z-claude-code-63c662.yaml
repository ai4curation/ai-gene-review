  summary: 'Create: human FCGR3A (CD16A) review'
  details: |
    First review of human FCGR3A (UniProtKB:P08637). 75 GOA rows reviewed plus two proposed: 66 ACCEPT, 5 REMOVE, 3 TOO_GENERAL, 1 MARK_AS_OVER_ANNOTATED, 2 NEW. 144 quotes verified verbatim. Selected to settle the generic-molecular-function flag raised against GO-CAM 62b4ffe300000335.

    No deep research file; providers unavailable in this environment. Research by hand from cached publications, UniProt and QuickGO.

    Core function: GO:0019772 low-affinity IgG receptor activity, with the Fc-gamma receptor III complex as in_complex, since CD16A has no signalling motif of its own and depends on CD247 or FcepsilonRI gamma for both signalling and surface expression.

    Settles the GO-CAM flag with an ontology fact rather than an opinion: GO:0140375 immune receptor activity is a strict ancestor of GO:0019772, which this gene carries by IDA. So the model types the activity with a term that says nothing about what CD16A recognises. Marked TOO_GENERAL on the gene record and the GO-CAM activity re-graded from NO_GENE_REVIEW to MORE_GENERAL.

    Deliberately NOT marked too general: GO:0019770 IgG receptor activity. It omits only the affinity class and still says the gene is an IgG Fc receptor, so it is kept per the rule that a broader term which still says something stays ACCEPT. Also not marked too general: the 38 plasma membrane rows, 29 of them Reactome. For a type I transmembrane receptor the plasma membrane is the accurate location for the whole product, and the external-side rows describe where the ectodomain sits rather than correcting it.

    NEW, both about the immunological synapse and both offered with the PRF1 contrast explicit. GO:0001772 immunological synapse (located_in), from Grier et al. identifying the CD16-CD2 association biochemically and at the synapse, with CD2 engagement eliciting CD16 signalling there. And GO:0001771 immunological synapse formation, the same term this project removed from PRF1: perforin is cargo released into a synapse built by others, whereas CD16A binds antibody on the opposing membrane, bridges the two cells and triggers the contact, and shedding it disassembles the synapse and releases the cell. Two caveats recorded on that row: the source paper is framed around disassembly rather than a dedicated assembly experiment, and it distinguishes the less stable CD16-triggered contact from the stable NKG2D-triggered synapse.

    A process deliberately not proposed: ADAM17 shedding of CD16A. The receptor is the substrate of that cleavage, not a participant in it, so by the participation rule it earns no proteolysis process term however consequential the shedding is. Raised as a question.

    GO:0070062 extracellular exosome marked over-annotated: a single shotgun-proteomic hit in urinary prostatic-secretion exosomes, an unrelated tissue context, where the gene's genuine cell-free pool is the ADAM17-shed soluble ectodomain rather than an exosomal membrane protein.
