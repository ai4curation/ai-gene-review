  summary: Remove hand-written citation strings from reference reviews
  details: |
    A self-audit of this branch found 72 reference_review notes written as 'PubMed-verified (<journal> <year>;<volume>:<pages>)'. Twenty-one of the 72 carried the wrong journal, volume and pages: the bibliographic detail was written from memory rather than read from the cached record, under a phrase asserting verification. The PMIDs themselves are right - every one resolves to a cached publication whose title the reference validator matches, and three review rounds confirmed the PMIDs and the verbatim quotes - but nothing validates free text in review_notes, so the wrong citations would have merged unnoticed.

    The fix removes the parenthetical from all 72 rather than correcting the 21. The PMID is the identifier and the cached record holds the citation, so hand-copied bibliographic data adds nothing and is the same trap for the next editor. 'PubMed-verified' itself stays: it means the PMID was checked against the cached PubMed record, whose title match is machine-enforced.

    This file carried 21 of them, the largest share.

    This file's annotation content, actions, reasons and supporting quotes are untouched. Re-validated: just validate clean, quote check 0 failures.
