  summary: 'Create review: SPINK5'
  details: |
    De-novo review of human SPINK5 (LEKTI) as the experimentally characterised co-ortholog reference for fly CG32354, independent of ProtNLM2 predictions. Falcon deep research failed (403 auth) and the perplexity-lite fallback timed out, so the review rests on 16 cached primary papers plus a new PANTHER 19 tree analysis (SPINK5-bioinformatics/panther_tree.py). Serine-type endopeptidase inhibitor activity accepted as core (IBA at Theria node PTN000099251 plus two IDA). Extracellular region rows modified to extracellular space. Differentiation, T cell, anagen and ECM terms marked over-annotated because they rest on expression-marker or downstream phenotype evidence. Negative regulation of angiogenesis and hair cell differentiation removed. No NEW terms.
