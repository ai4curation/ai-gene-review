    Cross-repo cGAS-STING review. Filled the cyclic-GMP-AMP-hydrolase core function's empty directly_involved_in with GO:0160049 negative regulation of cGAS/STING signaling pathway, supported by PMID:30356045 (WT but not S514L ENPP1 suppresses STING-driven IFN-beta in human THP-1 cells). Added a conservative NEW existing_annotation for GO:0160049 (IDA, PMID:30356045), since GOA carries only the generic IEA GO:0006955 immune response and the specific negative-regulation process - ENPP1's defining role in the cGAS-STING cohort as the dominant extracellular 2'3'-cGAMP hydrolase - was not represented. Improved the cGAMP core description. Status kept DRAFT: the ~21 UNDECIDED annotations (phosphodiesterase I GO:0004528, dinucleotide phosphatase GO:0004551, cAMP PDE GO:0004115, exonuclease, nucleic-acid binding) remain evidence-access-limited per the repo rule to use UNDECIDED when the original assay publications are inaccessible, and were not overruled. Two pre-existing action-inconsistency warnings (GO:0030505, GO:0036221) left as-is. validate human ENPP1 passes.
