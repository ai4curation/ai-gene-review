  summary: Create MEGF10 gene review
  details: |
    New review of all 37 GOA annotations for human MEGF10 (CED-1 ortholog engulfment receptor): 13 ACCEPT, 20 KEEP_AS_NON_CORE (muscle/satellite-cell and Notch rows), 1 MODIFY (homotypic cell-cell adhesion to cell-cell recognition; Kay 2012 full text shows homotypic repulsion), 1 REMOVE (apoptotic process involved in development; ISS from a mouse clearance-defect phenotype), 1 MARK_AS_OVER_ANNOTATED (cell development), 1 UNDECIDED (positive regulation of cell-cell adhesion; abstract-only source), plus NEW synapse pruning (Chung 2013). Core functions: scavenger receptor activity in engulfment of apoptotic cell; C1q complex binding. Provider deep research failed (Falcon 402, OpenAI invalid key), so the literature synthesis in MEGF10-notes.md was made by hand from cached publications.
