  summary: 'Create review: CDKAL1'
  details: |
    Completed the first review of human CDKAL1, the ER-membrane tail-anchored e-MtaB radical SAM methylthiotransferase that converts t6A37 to ms2t6A37 in cytosolic tRNA-Lys(UUU). All 22 GOA rows reviewed: the t6A37 methylthiotransferase activity (GO:0035598), tRNA methylthiolation, 4Fe-4S binding and ER membrane accepted. Generic catalytic, transferase, methylthiotransferase, iron-sulfur, tRNA modification, ND root, ER and membrane rows modified to the specific terms following the RADICAL_SAM treatment table. Three high-throughput protein-binding rows removed. Maintenance of translational fidelity and rough ER kept as non-core. No insulin-secretion or glucose-homeostasis process terms were added, because CDKAL1 acts upstream of these processes (necessity, not participation). Added Arragain 2010, Wei 2011 and Santos 2020 as references.
    Added a NEW GO:1904047 S-adenosyl-L-methionine binding row (ISS, PMID:23542644) and a matching core function, for consistency with the LIAS and ELP3 reviews.
