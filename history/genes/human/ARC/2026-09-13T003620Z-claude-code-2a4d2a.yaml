  summary: 'Create review: ARC'
  details: |
    Full de-novo review of human ARC (Q7LC44), the neuronal immediate-early Gag-derived capsid protein. All 57 GOA rows reviewed plus 5 NEW rows: 38 ACCEPT, 13 KEEP_AS_NON_CORE, 5 MARK_AS_OVER_ANNOTATED, 1 MODIFY, 5 NEW, 0 REMOVE, with 48 propagation_review blocks enumerating 70 source entities. Central finding: PANTHER PTHR15962 places Drosophila Arc1 (Q7K1U0) in the same subfamily SF0 as vertebrate Arc, but the family's single IBD node PTN008562333 is scoped to taxon:32523 (Tetrapoda), so none of the six IBAs mixes the two independently domesticated Ty3/gypsy lineages; verified by QuickGO, which shows dArc1 carrying 19 annotations and zero IBAs. Five IBAs are NO_FAILURE_CORE, including two self-referential ones seeded by the target's own IDA. GO:0071598 neuronal ribonucleoprotein granule was downgraded to KEEP_AS_NON_CORE with SOURCE_WEAK_OR_INFERRED because its sole seed, PMID:23936366, is a TOG/Ckap5 knockout in which Arc is the reporter transcript rather than a demonstrated protein constituent. MODIFY GO:0030665 to GO:0005905 clathrin-coated pit on the evidence of PMID:24945773. NEW rows for nucleus, protein-macromolecule adaptor activity, long-term synaptic depression, synapse pruning and dendritic cell migration, all coded ISS on rodent donors. Two ontology gaps proposed for non-viral capsid assembly and structural constituent terms. No affinage deep-research record exists: the API returned NOL3 (O60936) under the ARC symbol collision and the wrong-protein gate refused the write, so the reference set was built from UniProt, the PAINT slice and QuickGO donor tracing. Validated with just validate (Valid, no warnings), checkquotes.py (159 quotes, 0 failures), a GOA-to-YAML reconciliation script, a duplicate-key check and the cache/go/terms.csv deletion check.
