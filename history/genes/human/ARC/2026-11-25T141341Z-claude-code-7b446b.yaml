- type: EDIT
  outcome: changed
  summary: Record OpenScientist finding that no mammalian Arc capsid structure exists
    to compute burial against
  details: |
    Ran an OpenScientist deep-research job (kgap-arc-capsid-vs-oligomer) on the knowledge gap covering whether the Arc capsid is the species that drives AMPA receptor endocytosis. The run reports that the structural test the question invites cannot be run, and the reason is a fact about the structural record rather than a limit of method.

    There is no assembled mammalian Arc capsid in the Protein Data Bank. Every deposited Arc entry is a fragment, the largest Arc content of any single entry being 8 chains, and pooling observed residues across them leaves about half of the 396-residue sequence with no coordinates anywhere, including 1-98 and 133-198. The only Arc-family capsid coordinates are Drosophila dArc1 and dArc2, which cannot stand in for the mammalian protein. The local record is consistent, cross-referencing only short ranges such as 99-132, 207-277 and 277-370. So any burial figure quoted for the endophilin or dynamin determinants in an Arc capsid would be modelled or invented, and none was recorded.

    What can be measured argues against mutual exclusivity rather than for it. On the one experimentally determined self-association interface, the antiparallel coiled-coil dimer of residues 99-132, the endophilin determinant abuts the interface without entering it: of residues 89-100 only Gln99 contributes buried surface and Glu100 contributes none, while 89-98 have no coordinates in any Arc structure. The resolved part of the dynamin determinant is an extended, relatively exposed arm at the end of a predicted-disordered linker. The N-lobe peptide-binding pocket shares no residue with the oligomerisation surface defined by mutagenesis, and the CaMKII phosphosites Ser260 and Thr278 lie on that second surface about 100 residues from the N-terminal coil interface.

    Status moved from OPEN to NARROWING. The operational conclusion recorded is the run's own, weaker than the gap's framing and the honest one: a self-association state above a dimer is required for Arc-facilitated endocytosis, and no deposited structure or published experiment identifies which state, so the separation-of-function mutants already named in the resolution remain the only route.

    One competing assignment is carried forward because the local record supports it independently: the run notes that the 89-100 endophilin determinant overlaps a documented palmitoylation motif, and the local record does annotate palmitoylation as anchoring the protein in the membrane while residues 89-100 read KSIKACLCRCQE and carry three cysteines. The same residues therefore have two candidate roles.

    Verified locally: the 396-residue length, all eight named residues, the 89-100 sequence, the fragment-only PDB cross-references and the palmitoylation note. The buried-surface figures, relative accessibility values, pLDDT values and the 17-entry audit totals were not independently recomputed. No annotation action was taken; the run's suggestion of a molecular function term for short linear motif binding by the Gag N-lobe was not acted on, since this review already records its own proposed-term position for Arc.
