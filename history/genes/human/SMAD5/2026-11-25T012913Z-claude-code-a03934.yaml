    Created a de-novo human SMAD5 review for the BMP4 GO-CAM campaign. Reviewed all 95 seeded GOA rows from the YAML, retained BMP R-SMAD DNA-binding transcription factor, BMP signaling, SMAD signal-transduction, SMAD4-complex and nuclear localization assertions, added NEW cytoplasmic HK1-binding, HK1 enzyme-activation, and glycolysis-regulation rows from PMID:28675158, retained cytoplasmic HK1-linked enzyme activation as a second core function, kept mitochondrial localization plus developmental, hepcidin, AMH, DDX5 and ubiquitin-ligase contexts as non-core, marked broad parent terms as too general where a more specific row is present, and removed the bare protein-binding rows under the project policy. Added manual notes documenting the unavailable Falcon/perplexity-lite providers and the consistency of SMAD5 with GO-CAM 66e382fb00001232.
