  details: |
    OMICS_EVIDENCE vesicle-row manual review (projects/OMICS_EVIDENCE.md; dossiers and decisions in projects/OMICS_EVIDENCE/htp/vesicle_review/). The rule-based vesicle disposition was withdrawn; each protein was judged from its dossier using the MISEV2018 protein categories (PMID:30637094) as a guide. Manual re-review of GO:0070062 extracellular exosome (PMID:23533145): ACCEPT -> MARK_AS_OVER_ANNOTATED. Manual re-review of GO:0072562 blood microparticle (PMID:22516433): ACCEPT -> MARK_AS_OVER_ANNOTATED. Manual re-review of GO:0070062 extracellular exosome (PMID:19199708): ACCEPT -> MARK_AS_OVER_ANNOTATED. Manual re-review of GO:0070062 extracellular exosome (PMID:19056867): ACCEPT -> MARK_AS_OVER_ANNOTATED. Basis: Secreted clusterin (UniProt isoform 1: secreted); the earlier ACCEPT rested on its being secreted, which does not establish EV localization. Applies to the plasma microvesicle row too. Secreted or lumenal protein (UniProt); MISEV2018 category 5 says EV association of such proteins needs the cognate EV-surface receptor to be shown, and none is shown for this protein.
