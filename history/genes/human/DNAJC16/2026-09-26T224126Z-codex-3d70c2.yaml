  summary: Revisit DNAJC16 OpenScientist J-domain evidence
  details: |
    Audited the DNAJC16 OpenScientist J-domain/TRX report and added it as a first-class file reference for the unresolved molecular-function gap.

    Post-review, changed the report's topology-dependent BiP/HSPA5 exclusion from verified to disputed because PMID:32492081 describes the J and TRX domains as ER-luminal while UniProt predicts a cytoplasmic type-IV orientation. Restored BiP/HSPA5 and HSPA8/HSPA1A as topology-contingent candidate HSP70 partners, added a direct J-domain topology experiment, and updated the knowledge-gap boundary to make the unresolved membrane orientation explicit.
