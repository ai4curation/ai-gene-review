  summary: Re-review HSPD1 full gene evidence and disputed inherited functions
  details: |
    Restored primary-controlled extracellular immune and RNA/cold-response contexts, resolved source identities, preserved matrix/membrane compatibility and separated genuinely unresolved nucleoid, dsRNA, complex and import claims. All 178 annotation rows were screened. The previous blanket immune UNDECIDED rationale overlooked explicit primary controls: PMID:15371451 separates endotoxin-dependent macrophage TNF effects from retained T-cell costimulation using low-endotoxin human and eukaryotically expressed Hsp60; PMID:16148103 uses human Hsp60 on mouse B cells and reports TLR4/MyD88 dependence and LPS controls; PMID:17164250 directly tests LPS binding and distinguishes LPS-associated and IFN-alpha-associated immune effects; PMID:18256040 tests endotoxin-free costimulation. These support context-specific non-core immune annotations, not a universal cytokine activity. PMID:10663613 independently supports tumor-surface immune recognition. The vertebrate IBA node PTN002900230 includes human HSPD1 experimental grounding; that is not circular support. Detailed IgG-switch and stable LPS-receptor-complex claims remain UNDECIDED where the retrieved experiments do not resolve those precise assertions.

    The ISS DNA-binding donor is yeast Hsp60/P19882, with real gel-shift/crosslinking evidence in PMID:10869431; human origin-specific/nucleoid conservation remains uncertain. The cold-response donor is chicken Q5ZL72 with PMID:23636703, not an unresolved horse experiment. The human RNA HDA observation is retained as non-core; the exact HSPD1 dsRNA entry from PMID:21266579 still needs table/supplement recovery and is not rejected from a Raftlin-focused title. Hsp60-p53/survivin statements now cite their own PMID:18086682 experiment.

    The inner-membrane IBA PTN000143509 remains compatible with a principal matrix pool. The import IBA PTN000143510 is separately UNDECIDED: PMID:1347713 reports antifolding/export of cytochrome b2, whereas PMID:7911803 finds stop-transfer sorting of cytochrome-b2-presequence fusion proteins without Hsp60 exposure. A neutral OpenScientist request will assess substrate/route differences and human conservation. Neither matrix localization nor a single yeast donor refutes participation. Generic protein binding is removed for informativeness without denying its interaction evidence. just validate human HSPD1 passed. Non-NEW source metadata preserved exactly. Audit: projects/IBA_REVIEW/rereview-2026-09-20/actin-and-compartments.yaml.
