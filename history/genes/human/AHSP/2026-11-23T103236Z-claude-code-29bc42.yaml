  summary: Narrow the AHSP nuclear-function knowledge gap with an OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on whether AHSP has nuclear-targeting signals. None: no NLS in 89/89 mammalian orthologs, no PY-NLS, no nucleic-acid module, NES matches at background and buried; it is small enough for passive entry. A projection-imaging model shows nucleus-excluded proteins can appear mostly nuclear in late erythroblasts. Gap OPEN -> NARROWING; no nucleus annotation proposed.
