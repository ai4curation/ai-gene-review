- type: CREATE
  outcome: changed
  summary: 'Review human AHSP: removed a hemoglobin-complex annotation its own citation
    refutes, and recorded the chaperone-term gap that produced it'
  details: |
    First review of human AHSP (Q9NZD4). 24 GOA rows, each reconciled one-to-one
    against AHSP-goa.tsv on the full key (term, evidence code, reference,
    WITH/FROM); the fetch-gene stub did not collapse any rows on this gene. Two
    NEW proposals bring existing_annotations to 26.

    Actions: 10 ACCEPT, 8 MARK_AS_OVER_ANNOTATED, 5 MODIFY, 1 REMOVE, 2 NEW.

    REMOVE: GO:0005833 hemoglobin complex / part_of / NAS / PMID:12066189. The
    cited paper's own abstract states AHSP binds free alpha-haemoglobin but not
    haemoglobin A; UniProt says the same from two crystallographic papers; and
    the term definition requires two pairs of globin chains, whereas the AHSP
    complex is a 1:1 heterodimer with one non-globin chain and is not
    oxygen-carrying. The cause is recorded alongside: GO has no term for the
    complex AHSP actually forms, so the tetramer term was the nearest available.
    Proposed as a new CC term rather than leaving only the deletion.

    Ontology work, which is the substance of this review. Definitions and
    parentage were fetched from QuickGO before any term was proposed.
    GO:0051082 is obsolete with no replaced_by. GO:0140309 unfolded protein
    holdase activity is excluded twice over: it is a protein carrier activity
    that escorts its client, and its term comment requires the client to be kept
    unfolded, whereas AHSP translocates nothing and its client is
    crystallographically ordered. GO:0044183 protein folding chaperone is the
    honest partial fit and was added as a NEW IDA row on purified human
    components, with the residual mismatch filed as an ONTOLOGY KnowledgeGap.
    This is a different shape from the small heat-shock proteins stranded by the
    same obsoletion (repo issue #2222), which fail only the carrier clause.

    GO:0016209 antioxidant activity was tested and rejected: its definition
    requires the entity itself to be preferentially oxidized or to trap
    radicals, and all seven of its is_a children are redox enzymes, while AHSP
    has no redox-active group and instead remodels its client's haem
    coordination sphere. Recorded as a second ONTOLOGY gap; the behaviour is
    captured as NEW GO:1903427, generic in ROS species because the literature
    implicates O2 autoxidation, H2O2, ferryl haem and protein radicals in
    sequence. The wrong-ROS-propagation check came back negative - GOA carries
    no ROS term on this gene.

    Two new terms proposed: globin chaperone activity, as a sibling of
    GO:0140713 histone chaperone activity under GO:0140597 protein carrier
    activity; and AHSP-alpha-globin complex under GO:0032991.

    Three GO:0005515 rows naming HBA (x-ray diffraction, bio-layer
    interferometry, AP-MS; MI-score 0.71 each) were MODIFYed to GO:0030492 with
    a has_input extension, since protein binding cannot be the conclusion where
    a structure exists. The remaining eight are single Y2H screens; IntAct shows
    six partners logged three times as array / prey-pooling / validated, i.e.
    UniProt NbExp=3 is one screen counted three ways - the third instance of
    that pattern in this campaign.

    Propagation is the cleanest set encountered here. All four IBA rows come
    from mouse Ahsp (Q9CY02, reviewed, 102 aa, a one-to-one orthologue), which
    carries its own IDA or IMP at exactly the propagated term, so no
    propagation_review is warranted and all four are ACCEPT. PTHR15914 has one
    subfamily; querying all human family members including unreviewed returns
    three entries that are all AHSP itself, so there is no human paralogue.

    Erratum sweep over 26 PMIDs via CommentsCorrections/RefType found one
    unflagged Publisher Correction (PMID:41039152 on PMID:40205054); its scope
    was read rather than assumed and concerns a duplicated Methods equation, not
    the interaction data.

    GO:0005634 nucleus was deliberately not annotated despite a human
    erythroblast imaging study, and is filed as a BIOLOGY/CURATION knowledge gap
    instead.

    Verification: just validate passes on the merged tree; 60 YAML and 15 notes
    supporting_text quotes verified with the repo's own SupportingTextValidator
    under a strict duplicate-key loader, with raw and parsed counts equal; both
    the quote checker and the GOA reconciler were break-tested before their
    clean runs were believed; cache_lint exit status 0 checked directly rather
    than after a pipeline; terms.csv gained one row in sorted position with no
    deletions and no duplicate curies. No file: supporting_text is used anywhere
    in this review.
