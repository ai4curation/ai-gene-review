  summary: Re-review HSPA13 function specificity and evidence transfer
  details: |
    All 20 source rows and the core synthesis were re-reviewed. PMID:36244454 was read in full: ER-luminal proximity labeling and microsomal enrichment support a principal tested ER pool, but cytosolic TTR mistargeting is not localization of HSPA13 itself and the experiment does not establish exclusive residence. PMID:33672238 uses human STCH with murine NKCC2 in a heterologous system and infers a cytoplasmic-side interaction, not an independently measured soluble pool. Nuclear, plasma-membrane and cytosolic IBAs are therefore UNDECIDED pending separate compartment assessment. PAINT PTN002500132 currently retains nucleus/cytosol IBDs; the plasma-membrane row differs between GOA and the current table. The existing folding report was read, including its explicit "No direct in vitro chaperone assay for HSPA13" and failure to access full tree topology. Canonical substrate-binding-domain loss is real, but GO:0044183 also covers assistance through a protein-containing complex. PMID:36244454 identifies ER chaperone/translocon associations and reports that BiP overexpression can also impair translocation, undermining the report's use of an antagonistic overexpression phenotype as universal exclusion. Folding/refolding remain UNDECIDED; heat-shock-protein binding and broad organelle localization are accepted. The unsupported ubiquitin-like-protein-binding core was withdrawn: PMID:10675567 explicitly says "While the N-terminal UbL domains were not essential for Stch binding" and instead identifies a required Sti1-like repeat. Binding a ubiquilin/BAG6-family protein is not automatically binding a small conjugating ubiquitin-like protein. Generic protein-binding rows were removed for lack of functional information, without denying the interactions. No source annotation was deleted or new annotation manufactured. Original source metadata preserved; just validate human HSPA13 passed. Audit: projects/IBA_REVIEW/rereview-2026-09-20/chaperone-and-silencing-specificity.yaml.
