  details: |
    New review of all 22 GOA rows for CFAP69 (A5D8W1; MMAF, SPGF24). Falcon deep research failed (authentication error) and Perplexity was not available; the literature was researched manually and recorded in CFAP69-notes.md. Sperm midpiece, sperm axoneme assembly and flagellated sperm motility were accepted. Olfactory behavior, response to odorant and non-motile cilium (mouse OSN data) were kept as non-core. Positive regulation of flagellated sperm motility was modified to flagellated sperm motility. Positive regulation of fertilization was marked as over-annotated. Cilium and motile cilium were marked TOO_GENERAL. Cytoplasm IDA is UNDECIDED. New publication caches: PMID:29606301 and PMID:30415212 (via fetch-gene), PMID:28495971, PMID:37392306; PMID:34083607 was already cached. Validated with just validate human CFAP69.
