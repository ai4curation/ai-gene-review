  summary: 'Create review: LBP'
  details: |
    Created the human LBP review for the 5fb9cc0600000727 TLR1-TLR2 triacyl lipopeptide GO-CAM. Reviewed all 79 seeded GOA rows and added one NEW GO:0038123 TLR1:TLR2 signaling row supported by PMID:23430250. Action distribution: 29 ACCEPT, 40 KEEP_AS_NON_CORE, 6 MARK_AS_OVER_ANNOTATED, 2 REMOVE, 1 MODIFY, 1 TOO_GENERAL and 1 NEW. Core functions capture extracellular molecular carrier activity, LPS binding, LTA binding and lipopeptide binding. The GO-CAM LBP activity is consistent with the gene review; the coreceptor row was modified to molecular carrier activity, bare protein-binding rows were removed, cell-surface and respiratory-burst rows were marked over-annotated, and cytokine/macrophage/organism-defense outputs were kept as non-core. Falcon and fallback deep research were unavailable, so LBP-notes.md records the manual synthesis from cached publications, Reactome and the GO-CAM review.
