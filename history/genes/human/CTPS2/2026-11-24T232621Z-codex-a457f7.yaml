    Created a de-novo human CTPS2 review from fetched UniProt and GOA rows, manual notes after the configured deep-research providers were unavailable, the existing CTPS1 review, the PTHR11550 family review, the de_novo_pyrimidine_synthesis module and cached CTPS2 publications. Reviewed all 35 GOA annotations, accepting the conserved CTP synthase activity, CTP biosynthesis, cytosol, cytoplasm, cytoophidium and self-association rows; removing only the two uninformative SPG21 bare protein-binding rows; narrowing CTPS1 partner rows to enzyme binding; treating the MitoCoP mitochondrion row as over-annotated; and correcting broad or mis-scoped process parents to the CTP-biosynthesis chemistry. Validated with just validate human CTPS2, just validate-quotes on the CTPS2 and PTHR11550 reviews, scoped family/module validators and git diff --check.
