  summary: 'Create review: TRUB2'
  details: |
    De-novo full review of human TRUB2 (O95900) as experimental reference for the HORSE40/ProtNLM2 cohort pigeon ortholog, independent of ProtNLM2 output. Falcon deep research failed (auth error, perplexity fallback timed out), so the review uses full text re-fetched for PMID:27974379, PMID:33023933 and PMID:31477916 plus cached papers. All 29 GOA rows reviewed: tRNA Psi55 synthase activity, mitochondrial tRNA pseudouridine synthesis, pseudouridine synthase activity, mitochondrial matrix and RNP granule accepted; mRNA pseudouridine synthesis kept non-core because Antonicka et al. judge TRUB2's COX1/COX3 effect secondary to RPUSD3; positive regulation of mitochondrial translation kept non-core as necessity evidence; general IEA process terms and mitochondrion rows modified to specific terms. Notes record that PAINT node PTN000324318 propagates matrix, Psi synthase activity, mRNA Psi synthesis and mito-translation regulation but not the tRNA Psi55 terms.
