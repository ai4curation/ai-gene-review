- type: REVIEW
  outcome: changed
  summary: Full re-review of RHOJ G3V4H1 (NMD-transcript product)
  details: |
    Full independent re-review of G3V4H1. Established that G3V4H1 is the 153-aa product of Ensembl NMD-biotype transcript ENST00000557447 (RHOJ-204), identical to canonical Q9H4E5 for residues 1-103 but lacking G4/G5 guanine-recognition motifs, the 121-129 distal loop and the CAAX prenylation site. Changed all three IEA MF rows (GTPase activity, G protein activity, GTP binding) from UNDECIDED to MARK_AS_OVER_ANNOTATED: true for the gene, unsupported for this product. Rewrote description, notes and the bioinformatics script (now reads the UniProt flat file and live Ensembl biotypes, not ProtNLM files); removed ProtNLM source from references; added gene-level references PMID:21148427, PMID:21628409, PMID:32347571; added suggested experiments.
