  summary: Full re-review of RHOJ G3V4H1 (NMD-transcript gene model), independent
    of ProtNLM2
  details: |
    Independent re-review of benchmark accession G3V4H1. New reproducible analysis (RHOJ-bioinformatics/compare_sequences_rereview.py, RESULTS-rereview.md/.txt) using UniProt and Ensembl REST shows G3V4H1 is translated from ENST00000557447 (biotype nonsense_mediated_decay): identical to canonical Q9H4E5 for residues 1-103, then a 50-residue tail read from the canonical 3' UTR, losing the G4/G5 guanine-base motifs, the 121-129 distal loop and the CAAX box. All three IEA rows (GTPase activity, G protein activity, GTP binding) moved from UNDECIDED to MARK_AS_OVER_ANNOTATED: true for the gene and for Q9H4E5 (PAINT root PTN000632671 donor; PMID:10967094) but unsupported for this half G-domain product. Description rewritten (gene-level biology plus product-identity boundary); added PMID:21628409 and PMID:30158707 as gene-level context; ProtNLM source reference retained but marked unused. Notes appended. Relative for next review: canonical Q9H4E5 (PTHR24072:SF17), no review exists.
