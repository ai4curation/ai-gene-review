  summary: 'Create full ABCB6 gene review: porphyrin/heme ABC transporter, endolysosomal
    metal sequestration, melanosome role'
  details: |
    First review of human ABCB6 (Q9NP58), created as the experimentally characterised reference for the DROME Hmt-1 (Q9VF20) transfer case; both are in PANTHER subfamily PTHR24221:SF654, ABCB6 is the sole seed of PAINT eumetazoan node PTN001199916 (heme transporter activity, heme binding, heme transport) and a co-seed with Hmt-1 of opisthokont node PTN008609345 (vacuolar membrane).

    All 101 GOA rows were given a considered action. Core functions recorded: (1) ATP-driven export of heme and other porphyrins at the plasma membrane (GO:0015439, GO:0035351), (2) ATP-dependent sequestration of heavy-metal species into lysosomes/endolysosomes (GO:0140359, GO:0098849), (3) transport across the early melanosome membrane required for PMEL amyloid matrix formation (GO:1903232). Each rests on direct human experiments: K629A/K629M/K629G Walker A mutants abolishing transport, purified liposome-reconstituted protein, hemin and coproporphyrin III cryo-EM structures, rescue of S. pombe and C. elegans hmt-1 mutants, and siRNA-plus-rescue in MNT-1 melanocytic cells.

    Notable decisions. (a) Mitochondrial localization rows, both positive and the two NOT rows, are UNDECIDED: the dispute between overexpression/fractionation studies and endogenous-protein imaging is unresolved and UniProt itself flags it. (b) The NOT heme B biosynthetic process row is ACCEPTed and the positive porphyrin biosynthetic process row is UNDECIDED, on the strength of the K562 knockdown result and the absence of any phenotype in ABCB6-null Lan-negative humans. (c) Metabolic-process terms for porphyrin, tetrapyrrole and heme were MODIFYed to heme transmembrane transport: ABCB6 moves these compounds but catalyses no step of their chemistry. (d) The NAS iron homeostasis row was REMOVEd - the claim traces to yeast atm1-1 rescue, and ATM1's human ortholog is ABCB7, not ABCB6. (e) GO:0007420 brain development and GO:0043588 skin development, both IMP from PMID:22100072, were REMOVEd with UNIPROT source_defects entries: that paper is about ELOVL4 and never mentions ABCB6. (f) The vacuolar membrane IBA was MODIFYed to lysosomal membrane with a propagation_review recording that the node placement is sound and only the granularity is at issue; ABCB6 appearing in its own WITH/FROM is expected for an IBD seed, not circular. (g) Cadmium detoxification is kept as an ACCEPTed human IDA but is explicitly not treated as transferable, since PAINT propagated no cadmium term anywhere in PTHR24221 and Drosophila HMT-1 confers cadmium tolerance without transporting cadmium-phytochelatin complexes.

    A new term, ABC-type porphyrin transporter activity, is proposed: GO's only ABC tetrapyrrole term covers heme alone, while ABCB6's curated substrates include several metal-free porphyrins.

    Deep research failed and no deep-research file exists: falcon returned an Edison authentication error and the perplexity-lite fallback returned HTTP 401 for insufficient quota. The review therefore rests on the cached publications, the UniProt record, the PAINT table in interpro/panther/PTHR24221/ and the Reactome cache; this is recorded in ABCB6-notes.md. The ProtNLM2 prediction files were deliberately not opened.
