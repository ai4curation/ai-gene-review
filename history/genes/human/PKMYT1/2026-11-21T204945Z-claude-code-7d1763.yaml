  details: |
    Re-review of IBA rows marked REMOVE (projects/IBA_REVIEW/rereview-2026-11-21, batch 04). Action unchanged (REMOVE). The earlier reason implied the nuclear seeds were all WEE1-type or eIF2-alpha kinases. The tree (PTHR11042, IBD at root PTN000113601, 15 seeds) shows two seeds inside the Myt1 clade PTN000867843 that holds PKMYT1: mouse Pkmyt1 (MGI:2137630, UniProt IDA PMID:20083600) and C. elegans wee-1.3 (WBGene00006940, WB IDA PMID:25298536). Full text of both was read (Europe PMC / PMC BioC): the mouse paper states YFP-Myt1 was excluded from the nucleus (nuclear only as a Myt1-NLS chimera), and the worm paper reports perinuclear, nuclear-envelope and ER localisation. The reason now states this, and propagation_review gains source entries for the two seeds. The mouse Pkmyt1 nucleus IDA looks wrong at the source and should be queried with UniProt; no source_defects entry was added. Suggested PAINT fix: IRD for nucleus at PTN000867843. just validate human PKMYT1 passes.
