  details: |
    Reviewed all 91 seeded GOA annotations for human GLI2 (P10070), replacing every PENDING action: 31 ACCEPT, 47 KEEP_AS_NON_CORE, 10 MODIFY, 2 MARK_AS_OVER_ANNOTATED, 1 REMOVE, 0 UNDECIDED. Wrote the top-level description (project-independent summary of GLI2 as the principal activator-forming Ci/GLI paralog), two core_functions (GO:0001228 activator activity in GO:0007224/GO:0045944 in the nucleus; GO:0000978 Pol II cis-regulatory DNA binding in GO:0006357), suggested_questions, suggested_experiments, and reference_review blocks for all 13 cited PMIDs. Added genes/human/GLI2/GLI2-notes.md as the research journal with inline verbatim citations. Key calls: the four informative GO:0005515 rows were modified to GO:0001222 (SKI), GO:0046332 (SMAD3), GO:0031625 (BTRC) and GO:0008134 (FOXC1), and the phage-display TSG101 row was removed; all four GO:0043565 rows modified to GO:0000978 and GO:0010468 modified to GO:0006357 as too general; GO:0045740 positive regulation of DNA replication and GO:0005730 nucleolus marked over-annotated; all 25 mouse-Gli2 ISS developmental transfers and the seven extranuclear ciliary/cytosolic locations kept as non-core, with the nucleus as the sole active location, matching the ci_gli_activator annoton in modules/hedgehog_signaling.yaml and the four cached GO-CAMs containing P10070. No NEW terms proposed: GO:0045880 fails the participation test because the kinases, not GLI2, regulate the pathway. All 89 supporting_text quotes verified verbatim against the publications cache.
