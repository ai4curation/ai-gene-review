  summary: Review CACNA1G T-type calcium conductance and nodal physiology
  details: |
    Reviewed all 41 source annotations and preserved 35 alternative products from authenticated human UniProt/GOA. One core function captures low-voltage calcium conductance and direct plasma-membrane calcium import. Corrected the inherited high-voltage activity to the experimentally established T-type activity without inventing an ancestral-loss scenario. Retained tissue-specific nodal physiology as inferred non-core context and two explicit uncertainties concerning morphogenesis and contraction-linked action potentials. Reconciled the human cloning corrigendum and two normal mouse nodal reference caches. Independent ROOT review checked every decision, biological notes, source projection, current evidence limits and exact quotations; candidate normal validation passed with no warnings. Both normal research providers failed, documented in notes without fabricated reports.
