  summary: Refine CXCR4 signaling, source specificity and evidence limits
  details: |
    Refined the CXCR4 review after primary-source and ontology checks. Preserved all 117 original annotation objects, both official products, all source caches and the prior history record. Changed the unresolved dendritic-cell chemotaxis assertion to UNDECIDED, refined cytokine binding to C-X-C chemokine binding and the electronic junction mapping to immunological synapse, and marked the redundant broad complex term TOO_GENERAL. Added the already accepted inhibitory G-protein signaling pathway to the existing core using original cAMP measurements and the curated GO-CAM. Retained positive actin/myosin and RAMP3 associations within their measured scope and the standing project policy. Added source-exact short quotations, a biological notes synthesis, WHIM context and scoped experiments. Frozen default validation, CI-equivalent term validation, status checking, rendering and history validation passed. Existing notes are an exact prefix and prior history is unchanged.
