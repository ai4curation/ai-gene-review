  summary: 'Create review: AP1S1'
  details: |
    Reviewed all 53 GOA rows for human AP1S1 (P61966, sigma1A, PANTHER PTHR11753) and added one NEW row: ACCEPT 32, KEEP_AS_NON_CORE 19, REMOVE 1, MARK_AS_OVER_ANNOTATED 1, NEW 1. Central finding, absent from GOA and from the affinage record: sigma1A supplies the hydrophobic pockets of the dileucine cargo-signal binding site, which is formed jointly by the gamma1-sigma1A hemicomplex and by no single subunit (PMID:14691137, PMID:17360967, PMID:21097499, PMID:24843023). REMOVEd GO:0006898 receptor-mediated endocytosis on a definitional/compartment argument (plasma-membrane process; AP-1 is Arf1/PI4P-recruited at the TGN; the cited TAS paper has no endocytosis experiment), while ACCEPTing the superficially similar GO:0005905 clathrin-coated pit because its definition explicitly covers TGN and endosomal pits. The single IBA (GO:0016192) was traced to node PTN000204281 with all 11 gene-level donors resolved individually; because they span AP-1, AP-2 and AP-3 sigma subunits across fungi, nematode, fly, rodent and human, vesicle-mediated transport is the correct LCA and the row is NO_FAILURE_CORE rather than a granularity failure. 13 propagation_review blocks with 27 source_entities, all generated from each row's supporting_entities by script with a two-way assertion so they cannot drift. NEW row GO:0005198 structural molecule activity (IMP, PMID:39269494) with both perturbation directions. A reproducible bioinformatics analysis fetches nine AP sigma subunits live from UniProt, verifies all five literature-named sigma1A residues, independently reproduces the stated homologies, and reports an honest negative: the verified non-binder AP4S1 retains the same 4/5 pocket residues, so conservation alone does not establish the activity; encoded as 4 residue_claims and a RESIDUAL_SUBGAP knowledge gap. Proposed new GO term 'dileucine sorting signal binding' after confirming GO has only the tyrosine-motif counterpart GO:0089710. Validated with just validate (Valid, no errors or warnings), checkquotes.py (175 quotes, 0 failures), the residue-claim validator (91 pass, 0 fail), a duplicate-key check, terms.csv deletion/duplicate checks, and a GOA-to-YAML reconciliation script that matches all 53 rows one-to-one including normalized WITH/FROM.
