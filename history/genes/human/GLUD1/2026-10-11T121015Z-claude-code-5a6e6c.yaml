  details: |
    Review round 1 for PR 4814: the notes did not mention the committed falcon report. Checked it against the review and recorded four points: leucine activates but is not the substrate and glutamine needs an upstream glutaminase; the pH-dependent rise in ammonia Km that bears on reaction direction; the Fang 2002 mutagenesis separating GTP inhibition from ADP activation, which supports annotating them separately; and the GLUD2 confound on the renal and brain claims, together with the warning not to read the SIRT4/ornithine transcarbamylase result as evidence about GLUD1. The header did not claim a failed run, so nothing there needed correcting.
