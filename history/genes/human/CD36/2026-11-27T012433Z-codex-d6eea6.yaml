  summary: Create human CD36 review
  details: |
    Created a complete human CD36 review for the PTHR11923 class B scavenger receptor family. Reviewed 219 GOA rows with one YAML entry per GOA row, preserving WITH/FROM values including the exact duplicate GO:0043235 IPI rows that differ only by GOA date in the source file. Accepted the core fatty-acid import, oxLDL/modified-LDL receptor, thrombospondin/TLR co-receptor and cell-surface localization rows; kept supported antiangiogenic, TLR, amyloid-beta, malaria, platelet and tissue-output rows as non-core; marked or left unresolved electronic and abstract-only transfers that overstated direct CD36 function. Grounded decisions in the UniProt flatfile, PAINT PTHR11923 rows, Reactome records and newly cached GOA publications.
    A final self-review tightened three evidence/action calls: mouse/Ensembl downstream-expression rows now cite the CD36 curation notes rather than generic UniProt receptor text, the experimental TLR4:TLR6 complex-assembly row is kept as non-core, and the abstract-only TREM2 ComplexPortal protein-containing-complex-binding row is unresolved pending full-text or ComplexPortal detail.
