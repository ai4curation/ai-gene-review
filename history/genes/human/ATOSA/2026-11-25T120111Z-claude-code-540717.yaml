  summary: Record OpenScientist Porthos/DDX47 orthology and over-annotation assessment
    for ATOSA
  details: |
    Ran an OpenScientist deep-research job (kgap-atosa-porthos-axis) on the knowledge gap covering whether human ATOSA regulates transcription and acts through a Porthos ortholog. The run splits the gap into three parts with three different answers.

    The helicase identification is settled. Fly Porthos is pths/CG9253, already named an ATP-dependent RNA helicase DDX47 in UniProt, and its single human ortholog is DDX47 by reciprocal best hit in both directions, with 13 of 13 orthology tools agreeing against 2 of 13 for the runner-up and an independent alignment giving 71.3 per cent identity over 449 residues.

    Whether human ATOSA acts through DDX47 is unresolved rather than refuted. No DEAD-box or DEAH-box protein appears in any public interaction record for this entry, the available records being yeast two-hybrid and text-mining only; co-expression with DDX47 ranks 24th of 36 helicase genes and sits at the quantification floor; and the Human Protein Atlas places ATOSA in nucleoplasm against DDX47 in nucleoli. The run states that two affinity-proteomics resources could not be queried, so its interaction search is incomplete by its own account. One detail reframes the question: the fly paper reports that nuclear Atossa increases porthos mRNA, not that the two proteins form a complex, so a human ATOSA-DDX47 binding claim would exceed the fly precedent before any missing human data is considered.

    The third part matters most for curation. Asserting DNA-binding or transcription-factor activity is an over-annotation risk: the only well-folded module with a recognisable fold is a HORMA domain over residues 1-230, a peptide-binding fold; the sequence contains no zinc finger, RING, PHD, AT-hook, HMG box, homeodomain or bZIP basic region; and ATOSA is absent from the human transcription factor census. The local Q32MH5 record is consistent, carrying Pfam Chromosome_seg and DUF4210 with no zinc-finger feature, and its FUNCTION line calling the protein a transcription regulator carries ECO:0000250 from the mouse entry, a similarity transfer that itself rests on the single fly publication.

    Status moved from OPEN to NARROWING. No annotation action was taken and none is needed: GOA carries no transcription term, and this review's core function already hedges the transcription role as predicted by orthology, a hedge the run's analysis now justifies better than before. The run's own caveat is recorded, that a fold assignment is not a function and a HORMA domain at 8 to 10 per cent identity could in principle have lost closure-motif binding.

    Verified locally: the 1076-residue length, the absence of any zinc-finger feature, the two Pfam assignments, and the ECO:0000250 evidence code on the UniProt FUNCTION line. The orthology scores, the Foldseek assignment and TM-scores, the interaction-database queries, the co-expression ranking and the census check were not independently verified.
