  summary: 'Correct the GO:0030917 ISS donor and weaken its qualifier: OTX2'
  details: |
    Review-response edits on PR #3130. The reviewer asked whether the NEW GO:0030917 row's ISS WITH actually pointed at a gene carrying the term. It did not, and checking it turned up a second problem.

    Wrong similarity donor. The row cited UniProtKB:P80206 (mouse Otx2) in supporting_entities. QuickGO returns zero GO:0030917 annotations for P80206, and zero for human P32243, so the WITH named a gene that does not hold the term - which is not a similarity transfer at all. The orthologues that do hold it are zebrafish: otx2 (UniProtKB:Q91981, Swiss-Prot), otx2a and otx2b, all IGI from PMID:16611693. The donor is now Q91981, the reviewed entry, and original_reference_id moves from PMID:10490024 to PMID:16611693, the paper behind the donor's own annotation. PMID:10490024 remains as mechanistic grounding in additional_reference_ids and supported_by. PMID:16611693 is added to the references list with a reference_review recording how the donor was verified.

    Qualifier too strong. The row said involved_in. Every one of the 146 experimental GO:0030917 annotations in mouse (8) and zebrafish (138) uses acts_upstream_of_or_within; the involved_in rows on the term are all IEA/ARBA electronic inferences. An ISS must not strengthen the assertion it transfers. The project's own NEW rule points the same way: the boundary structure is built by the isthmic organizer genes, and what OTX2 contributes is where it forms, so necessity-and-position evidence does not license a participation claim. Now acts_upstream_of_or_within.

    Consequence for core_functions. GO:0030917 is removed from directly_involved_in, because listing it there re-asserts the participation the annotation now declines to claim. The core_functions description states the omission and the reason; the border-positioning role remains in prose.

    Also in this round. The GO:0021978 sentence in the review kept the unqualified descendant wording that the preceding record retired; it now states that GO:0021978 reaches GO:0030900 by BFO:0000050 part_of and is not under GO:0009952 at all. The notes record the donor and qualifier corrections with the QuickGO counts and both verbatim quotes, and note why the error was invisible: the term id and label were right, the comparator argument was right, the mechanism was right and the donor accession was a real mouse Otx2 entry, so schema, label and redundancy checks all passed. Nothing in the pipeline asks whether an ISS WITH gene carries the term being transferred.
