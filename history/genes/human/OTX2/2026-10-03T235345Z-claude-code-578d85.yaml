  summary: 'Settle the GO:0009952 withdrawal on a verified part_of edge: OTX2'
  details: |
    Review-response edits on PR #3130, and a correction to the record 2026-09-20T163726Z-claude-code-af5f68.

    Supersession. That record's details state that "GO:0090009 is a descendant of GO:0009952". Records are append-only, so this entry is the mechanism that corrects the trail: the word descendant there is unqualified and wrong for this edge, and this record replaces it. Queried against the local oaklib sqlite:obo:go entailed_edge closure, GO release 2026-07-26: GO:0090009 primitive streak formation has exactly one is_a parent, GO:0048646 anatomical structure formation involved in morphogenesis, and its is_a closure contains no term in the regionalization branch - there is no is_a path to GO:0009952. GO:0009952 is reached only through BFO:0000050 part_of (and RO:0002131 overlaps). The same is true of GO:0030917, the term that did survive; GO:0021797, cited as a Six3 comparator, is the one genuine rdfs:subClassOf descendant among the terms checked.

    The withdrawal of GO:0009952 is unchanged and now rests on a stated relation rather than an unqualified one, because GO annotation propagation follows part_of as well as is_a: an annotation to GO:0090009 entails GO:0009952 either way, so the proposal would still have added an ancestor of an existing annotation. Recorded because an is_a-only reading of the closure makes GO:0009952 look proposable, and that reading was argued across four review passes before the closure was queried.

    Other edits in this round. GO:0005654 nucleoplasm lost a supporting_text that did not support the row (the quote described a different experiment); the review now explains the deliberate omission in its reason, and the row is GO_REF:0000052 rather than a PMID so no supporting_text is required. GO:0030426 growth cone now leads with the verbatim internalization result from PMID:16267555 and keeps the setup sentence as a second entry. cache/ontologies/go.meta.json was reverted to main, so this PR carries no ontology-cache change. The notes file gained the full ancestry query above, replacing the retracted descendant wording in its own section 7.
