  summary: 'Create review: OTX2'
  details: |
    De-novo review of human OTX2 (P32243), seeded by PMID:42760324 (Two parallel neural ectoderm progenitors contribute to the developing brain, Nat Neurosci 2026), which makes OTX2 the marker of the anterior neural ectoderm progenitor and is the prerequisite for the planned neural_ectoderm_anteroposterior_specification module. Deep research via falcon provider. All 36 GOA annotations reviewed: 18 ACCEPT, 14 KEEP_AS_NON_CORE, 2 MARK_AS_OVER_ANNOTATED, 1 MODIFY, 1 UNDECIDED, plus 1 NEW. Main QC finding: a block of five TAS annotations dated 2005-06-07 all cite PMID:15705863 (a medulloblastoma copy-number study); GO:0008190 eukaryotic initiation factor 4E binding is demonstrably sourced from PMID:15247416 instead (human OTX2 GST pull-down), and GO:0008589 and GO:0040036 cannot be traced to the cited abstract - the paper is not open access so those two are flagged rather than removed (GO:0008589 left UNDECIDED). GO:0007411 axon guidance marked over-annotated: PMID:16267555 did assay OTX2 (so not a paralog mis-attribution) but its published conclusion is that OTX2 lacks the divergent turning response. GO:0005515 protein binding MODIFY to GO:0008134. NEW: GO:0009952 anterior/posterior pattern specification, proposed after a comparator check showing mouse Otx2, Hoxa1, Gbx2 and Six3 all carry this term or its descendants experimentally while their human orthologues carry none - a species artefact rather than a GO convention; GO:0021999 was explicitly rejected by the same check.
