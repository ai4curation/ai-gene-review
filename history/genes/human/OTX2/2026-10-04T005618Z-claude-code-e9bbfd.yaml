  summary: 'Take two review suggestions on the GO:0030917 row: OTX2'
  details: |
    Review-response edits on PR #3130, both non-blocking suggestions from the pass on 5e1e0ed92.

    core_functions description. The closing paragraph added in the preceding round explained which slot GO:0030917 occupies and why, which is schema commentary in a field a biologist reads for function. The reasoning is already in review.reason, the notes and the preceding history record; three places is enough. Replaced with the biology it was protecting: what OTX2 supplies at the midbrain-hindbrain boundary is its position, and the boundary tissue itself is built by the isthmic organizer genes.

    original_reference_id. The NEW row uses PMID:16611693 where OTX2's four existing ISS rows use GO_REF:0000024, and a reader could take the inconsistency for an oversight. The reason now states that the departure is deliberate: a GO_REF names the transfer method, which is the right citation for a transfer a curator has already made, whereas this row is a proposal and what a curator weighing it needs to see is the paper that put the term on the donor.
