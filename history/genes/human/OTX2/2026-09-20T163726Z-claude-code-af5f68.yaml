  summary: 'Correct NEW term proposal: OTX2'
  details: |
    Self-correction to the NEW annotation added in the preceding record. The proposed term GO:0009952 anterior/posterior pattern specification was withdrawn: human OTX2 already carries GO:0090009 primitive streak formation by ISS, and GO:0090009 is a descendant of GO:0009952, so the proposal added an ancestor of an existing annotation rather than new coverage - which the project's NEW rules reject. The earlier justification also asserted, incorrectly, that the term was neither an ancestor nor a descendant of anything OTX2 carries; that error was introduced by running the comparator query against a wrong SIX3 accession and not re-checking OTX2's own hits under the same query. Replaced with GO:0030917 midbrain-hindbrain boundary development (ISS from PMID:10490024, WITH UniProtKB:P80206), which passes all three checks: OTX2 performs part of the work, since the organizer forms at the OTX2 caudal border and relocates when ectopic GBX2 moves that border; the comparator check is positive rather than merely neutral, because GO:0030917 is annotated to mouse Gbx2, Fgf8 and Wnt1 by IMP and to zebrafish otx2a by IGI; and it is a sibling of GO:0030900 and GO:0030901 under GO:0007420 brain development rather than an ancestor or descendant of either. core_functions updated to match. The notes file records both the withdrawn and the accepted proposal.
