  summary: Full review of human UCHL5 (UCH37), the characterised SF16 relative of
    S. pombe uch2
  details: |
    New review of all 81 GOA rows for UCHL5, written independently of the ProtNLM2 predictions; deep research failed (falcon auth, perplexity quota), so the review was built from cached literature plus seven newly cached primary papers (Yao 2006, Lam 1997, Deol 2020, Song 2021, Du 2022, Vander Linden 2015, Sahtoe 2015). Accepted the deubiquitinase, proteasome binding, deubiquitination, INO80 complex and localisation rows. Removed GO:0004866 endopeptidase inhibitor activity, which its own abstract contradicts. INO80 remodeler-level phenotypes (chromatin remodeling, DNA replication, strand elongation, transcription, cell cycle) are marked over-annotated, because UCHL5 is inactive in INO80 and sits in a module not needed for remodeling; the cached full text of PMID:25016522 never mentions UCHL5. The GO:0033044 IBA (Eumetazoa node) and its IMP seed are kept as non-core. Proteasome-subunit protein-binding rows were modified to proteasome binding and the rest removed. Added NEW K48-linked deubiquitinase activity and proteasome regulatory particle. Notes record which functions are human-experimental and which are metazoan-specific and must not be transferred to pombe uch2.
