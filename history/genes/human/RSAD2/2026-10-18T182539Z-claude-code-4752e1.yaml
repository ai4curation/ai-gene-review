  summary: 'Create review: RSAD2'
  details: |
    Created the full RSAD2 (viperin, Q8WXG1) gene review as part of the RADICAL_SAM project Phase 1 human set. All 57 seeded GOA rows were reviewed and two NEW molecular-function rows added; the project's treatment rule for generic radical-SAM rows was applied (GO:0003824 MODIFY to a proposed new term for the CTP to ddhCTP dehydratase activity, which GO lacks; GO:0051536 MODIFY to GO:0051539; GO:0046872 and GO:1904047 were absent from GOA, and GO:1904047 was added as NEW on the strength of the EPR SAM-coordination evidence). Core functions recorded are the radical-SAM CTP dehydratase producing the flavivirus chain terminator ddhCTP, [4Fe-4S] cluster binding, SAM binding, and the catalysis-independent IRAK1/TRAF6 adaptor function in TLR7/TLR9 signalling; the generic protein-binding rows were removed as uninformative and the mouse-derived T-cell/Th2 and infection-driven Golgi and mitochondrial rows kept as non-core. Literature came from the cached primary papers (several newly fetched) plus the asta deep-research retrieval file, which was used because the falcon deep-research provider failed with an authentication 403 and was not retried; the asta file returned only generic database papers, so no annotation cites it.
