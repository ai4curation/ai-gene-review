  outcome: changed
  summary: 'Review human ARGLU1: remove a mitochondrion IBA traced to one Candida
    TLO paralog; 3 NEW terms'
  details: |
    De-novo review of all 29 GOA rows for human ARGLU1 (Q9NWB6), plus 3 NEW
    proposals. The fetch-gene stub seeded 28 entries; the collapsed row (a second
    GO:0005515 / IPI / PMID:30698747 / UniProtKB:P26368 row differing only in
    assigning database) was restored, and the 29 + 3 = 32 count is asserted
    programmatically rather than by eye.

    Headline finding. GO:0005739 mitochondrion (IBA) was REMOVED with a
    propagation_review. PANTHER node PTN001271790 propagates both nucleoplasm and
    mitochondrion to exactly the same 111 gene products across 64 NCBI taxa, so
    the terms differ only in donor quality: nucleoplasm has three donors with
    their own experimental evidence, all reviewed Swiss-Prot ARGLU1 orthologs
    (human, mouse, Drosophila), while mitochondrion has exactly one, the
    unreviewed Candida albicans TLO16 (A0A1D8PRM3) with a single IDA from
    PMID:22923044. All 111 mitochondrion rows name that accession. TLO16 is
    architecturally not an ARGLU1 ortholog (InterPro adds IPR021017 Med2 and the
    AH/BAR superfamily), and its source paper confines the mitochondrial
    localisation to the gamma clade of a Candida-specific 14-copy expansion.
    Recorded in suggested_questions as a PAINT recommendation: detaching the term
    from that node would correct 111 annotations in one edit, and the node is
    sound for nucleoplasm. This REMOVE diverges from the corpus (213 merged
    reviews carry a GO:0005739 IBA row, modal verdict ACCEPT) and says so.

    Other actions. GO:0045296 cadherin binding -> MARK_AS_OVER_ANNOTATED: the
    source is proximity biotinylation ("in the vicinity of" the E-cadherin tail)
    that produced 272 annotations over 272 distinct gene products, against a
    control where the ARGLU1 primary paper annotates 4; ARGLU1 is nuclear in every
    curated location. This follows the modal verdict across the 38 merged reviews
    already carrying that exact row. Three SRPK2 GO:0005515 rows -> MODIFY to
    GO:0019901 protein kinase binding, supported by three independent studies
    using three orthogonal methods, the decisive one being an IntAct record typed
    as phosphorylation by in vitro protein kinase assay; corroborated structurally
    by a measured RS-repeat N-terminus. Six U2AF2/PUF60/JMJD6 GO:0005515 rows ->
    REMOVE as uninformative, with the absence of any spliceosome-binding MF term
    recorded as an ontology gap rather than papered over. Remaining rows ACCEPT.

    Three NEW annotations, each filling a measured coverage gap: GO:0036033
    mediator complex binding (the 2011 paper's title finding produces no MF
    annotation anywhere in GOA), GO:0048025 negative regulation of mRNA splicing
    via spliceosome (GOA carries only the unsigned GO:0000381 while the
    autoregulatory circuit is specifically inhibitory), and GO:0042921 nuclear
    receptor-mediated glucocorticoid signaling pathway.

    Restraint. GO:0030374 nuclear receptor coactivator activity is obsolete, so
    GO:0003713 is already maximal and no replacement child was proposed. No
    GR-binding term (no purified-protein binding assay exists), no DNA-repair term
    (overexpression-only phenotypes), and no pausing or elongation term
    (GO:0160239 has no children and the elongation terms would misstate the
    measurement) - the last recorded as an ONTOLOGY knowledge gap. The protein has
    no domain-level signature at all, so no MF was inferred from its fold.

    Provider assessment: affinage passed its trust gates but cited a RETRACTED
    paper (PMID:35082911, RetractionIn PMID:37503407) without flagging it, and
    returned 11 of the 28 PubMed records, missing PMID:42641889 which identifies
    ARGLU1 as a PAK1 substrate at Ser-77.

    Six reproducible analyses committed under ARGLU1-bioinformatics/, including an
    invariant audit of the finished review with 16 guards and a mutation-based
    self-test. Two defects in that self-test, both found by the test itself, were
    fixed: a numeric guard that only checked digit presence anywhere, and a case
    that fired via a different check than the one it was written for.
