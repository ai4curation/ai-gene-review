  summary: 'Create review: CLDN18'
  details: |
    Created the CLDN18 review: all 48 GOA annotations reviewed. Claudin-18 is a tetraspan plasma-membrane protein concentrated at bicellular tight junctions, with only two short extracellular loops exposed; isoform A2 (CLDN18.2) is the gastric/tumour isoform targeted by antibodies. Core functions are structural tight-junction strand formation controlling the alveolar and gastric paracellular barrier, and PDZ-motif scaffolding of ZO proteins and phosphorylated YAP1. Sixteen protein-binding rows from a PDZ fragmentomics screen were modified to PDZ domain binding and two HuRI rows removed; cell-cell junction and membrane rows were modified to the specific compartments. Human experimental data are sparse; most process terms are mouse-transferred and kept as non-core.
