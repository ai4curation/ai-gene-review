  summary: 'Full re-review: UBE2F (F8WDQ9 truncated product)'
  details: |
    Full independent re-review of benchmark accession F8WDQ9, a 101-aa alternative Ensembl product of UBE2F identical to Q969M7 1-94 plus a 7-aa tail; lacks catalytic Cys116 and most of the UBC core. GOA has zero rows; no NEW terms proposed and core_functions left empty because NEDD8 conjugase activity cannot transfer to a product lacking the active site. Rewrote description (gene-level baseline plus explicit truncation), added PMID:23201271 (retained acetylated N-terminal DCNL-binding segment) and UniProt CAUTION reference, removed the prediction-file reference, repointed the sequence-mapping script to read the UniProt flat file, rewrote notes with PANTHER PTHR24067/PTHR24068 release-skew and PAINT PTN000630367 context, and added suggested experiments on expression and DCNL binding.
