  details: |
    Rewrote the description to separate the gene-level NEDD8-E2 function of canonical Q969M7 from the F8WDQ9 product, which keeps residues 1-94 (UBA3/DCNL-binding N-terminus) but lacks canonical residues 95-178 including HPN and Cys116. Added PMID:23201271 and the UniProt CAUTION as support. core_functions kept empty and no NEW terms, because a product without an active site has no function that can be transferred (the PAINT node PTN000630367 is not applied). Marked the protnlm-source reference as unused. Added suggested questions and experiments. The relative is canonical Q969M7 (PR #5303).
