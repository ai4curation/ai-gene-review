  summary: 'Address PR #4316 review: engage the human/rodent expression split; proton rows over-annotated'
  details: |
    Engaged the review paper's species comparison: human BASIC transcript is intestinal and testicular, not in brain or liver. The two mouse-projected neuronal action potential rows are now MARK_AS_OVER_ANNOTATED (context mismatch). The rat apical-membrane rows are non-core and dropped from core locations. Proton channel and proton transport rows are MARK_AS_OVER_ANNOTATED (BASIC is not proton-sensitive; no source shows proton conduction; GOA provenance is the mouse projection). The core-function description and gene description now state human expression, human-relevant bile acids (CDCA/DCA; HDCA is absent from human bile) and weak resting amiloride sensitivity. PMID:24365967 is raised to HIGH with new findings, and the Reactome reference reviews note the proton-gated framing.
