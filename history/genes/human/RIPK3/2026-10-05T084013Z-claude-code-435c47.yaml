    Completed the AI gene review of human RIPK3 (Q9Y572). Reviewed all 139 GOA annotations: 66 ACCEPT, 16 KEEP_AS_NON_CORE, 16 MODIFY, 16 REMOVE, 25 MARK_AS_OVER_ANNOTATED. REMOVE was used for uninformative protein binding rows (non-RIPK1 partners) and for the unsupported transcription coactivator activity TAS and its derived IEA. RIPK1 protein binding rows were changed by MODIFY to GO:0120283. Wrote a project-independent description, two core functions (protein serine/threonine kinase activity in necroptotic signaling within the ripoptosome/necrosome, which phosphorylates MLKL; and RHIM-mediated RIPK1 binding/amyloid necrosome assembly), suggested questions and suggested experiments. Every supporting_text quote was checked verbatim against cached publications/ and reactome/ files. Sources: RIPK3-notes.md literature synthesis, the UniProt record, cached PMIDs and Reactome. Provider deep research (Falcon) failed with HTTP 402, so no deep-research file exists. Validated with just validate human RIPK3 (no errors or warnings).
