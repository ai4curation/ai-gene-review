events:
- type: EDIT
  outcome: changed
  summary: Record OpenScientist chimera-boundary correction and candidate repair element
    for ANO5
  details: |
    Ran an OpenScientist deep-research job (kgap-ano5-nonscrambling-activity) on the knowledge gap covering which ANO5 activity supports membrane repair independently of phospholipid scrambling. The run corrects how much the chimera result can carry and then nominates a specific element.

    The correction matters for curation. The scrambling-defective construct is not a point mutant but a 35-residue cassette swap, human ANO5 530-564 replaced by the aligned mouse ANO1 segment, so it retains 878 of 913 residues, including the entire 299-residue cytosolic N-terminus, the complete canonical calcium site and the cytosolic C-terminus. Elimination therefore cannot narrow the activity at all; the rescue excludes only the lipid-permeation groove. The run notes that the construct paper's abstract calls it a scramblase-defective mutant, which reads as a point substitution, and recovered the true boundaries verbatim from that paper's Methods.

    Positive narrowing converges on residues 48-64, AKRFNLFLRRRLMFQKN, which ranks first of all 897 overlapping 17-residue windows in the protein on a basic-hydrophobic score, above the MARCKS effector domain, K-Ras4B and the gelsolin PIP2 site, is far stronger than the equivalent maximum in ANO6 or ANO1, sits as a local missense-constraint peak in an otherwise tolerant disordered tail, and contains the pathogenic variants R57W and R58W.

    Verification was unusually productive here. The 913-residue length, the 48-64 motif, the 530-564 swapped segment and the arginines at 57 and 58 all match the local Q75V66 record, and the local record independently annotates variant 58 as R to W in LGMDR12, pathogenic, resulting in defective sarcolemma repair in cultured muscle cells. So a pathogenic substitution inside the nominated element is already tied to repair failure by UniProt itself, which corroborates the run's central lead from material already in the repository.

    Status moved from OPEN to NARROWING. Two limits are recorded as the run states them: the architecture cannot distinguish the candidate activities, since the chemistry that makes 48-64 look like an inner-leaflet phosphoinositide or phosphatidylserine binder is the same chemistry that makes it an electrostatic docking site for an acidic partner, with AHNAK the direct precedent for one peptide doing both; and the motif is less conserved across vertebrates than the swapped scrambling domain, with no match in 25 species carrying a full-length N-terminus.

    No annotation action was taken. The run explicitly cautions against reading the chimera rescue as grounds to demote scramblase activity in the GO record, since the swapped domain carries the highest pathogenic-variant density of any annotated element, and that caution is recorded in the boundary.
