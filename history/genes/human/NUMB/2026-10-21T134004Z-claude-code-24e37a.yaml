  summary: 'Create review: NUMB (reference for HORSE/NUMB transfer)'
  details: |
    De-novo review of human NUMB (P49757), PANTHER PTHR47368:SF5, as the experimentally characterised ortholog reference for HORSE/NUMB A0A5F5PK46; independent of ProtNLM2 predictions. Deep research failed (falcon 403, perplexity quota), so the review relies on cached literature and UniProt. All 49 GOA rows reviewed: specific protein-binding rows modified to clathrin-cargo adaptor activity, EH domain binding, p53 binding, ubiquitin protein ligase binding and beta-catenin binding, screen-only rows removed; regulation of endocytosis modified to clathrin-dependent endocytosis; cytoplasmic vesicle refined to clathrin-coated vesicle; mouse-derived developmental terms kept non-core and lateral ventricle development marked over-annotated. Added NEW negative regulation of Notch signaling pathway from direct human evidence. Core functions separate human-established adaptor, Notch and p53 roles from mouse-only neurodevelopmental findings.
