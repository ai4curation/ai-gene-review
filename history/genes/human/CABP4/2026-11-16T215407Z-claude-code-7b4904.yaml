  summary: First review of CABP4 for the dismech vision-disorder alignment
  details: |
    First annotation review of human CABP4, written for projects/DISMECH_VISION_ALIGNMENT (tranche 1). 18 GOA rows reviewed: 8 ACCEPT, 5 MODIFY, 2 MARK_AS_OVER_ANNOTATED, 1 KEEP_AS_NON_CORE, 1 REMOVE, 1 UNDECIDED. Core function: GO:0005246 calcium channel regulator activity at the presynapse and photoreceptor ribbon synapse, consistent with the CACNA1F review. Removed: extracellular region (NAS), which the cited paper does not support and which is recorded as a suspected source defect. Phototransduction is marked over-annotated because CaBP4 acts at the synapse, not in the cascade. Sensory perception of sound (IBA from a node seeded by mouse Cabp2) is UNDECIDED: no cached paper tests hearing in CABP4 deficiency. Validated with just validate human CABP4: no errors.
