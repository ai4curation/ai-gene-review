  details: |
    Reviewed every GOA row for SLC6A3 (Q01959, DAT). Core MF GO:0005330 dopamine:sodium symporter activity (Na+/Cl--dependent presynaptic reuptake transporter; monomeric). GO:0008504 (x5) and GO:0015370 TOO_GENERAL (is_a ancestors of GO:0005330, verified); GO:0005326 ACCEPT and GO:0090494 dopamine-uptake terms ACCEPT (parallel branches). Bona fide presynaptic reuptake → dopamine uptake / uptake-in-synaptic-transmission ACCEPT; NE secondary substrate KEEP_AS_NON_CORE. Large behavioral/drug-response set (cocaine/amphetamine/nicotine/ethanol, iron/leptin, etc.) held to the participation test (KEEP_AS_NON_CORE or MARK_AS_OVER_ANNOTATED). 34 bare GO:0005515 REMOVEd; postsynaptic-membrane over-annotation REMOVEd (DAT is presynaptic); amino-acid-transport IBA REMOVEd via propagation_review. Actions: 36 ACCEPT, 36 REMOVE, 14 KEEP_AS_NON_CORE, 8 TOO_GENERAL, 6 MARK_AS_OVER_ANNOTATED, 2 MODIFY. Batch 10.
