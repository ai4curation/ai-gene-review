  details: |
    The new verbatim check on file: quotes (validation/local_source_text.py, PR #4378) found three supporting_text values citing file:human/IGFBP5/IGFBP5-deep-research-falcon.md that do not occur in that file, in any committed version of it. (1, 2) 'IGFBP-5 is a secreted ligand-binding regulator—not an enzyme or an IGF receptor.' appeared in existing_annotations[102].review.supported_by[2] and references[33].findings[0]; the source sentence (line 160) is 'IGFBP-5 is a **ligand-binding regulator, not an enzyme or transporter**.', which is now quoted verbatim in both places. (3) The finding 'The IGFBP5 profibrotic response in human fibroblasts is IGF-independent and does not require nuclear entry.', quoted as '...does not require IGF binding, nuclear entry or stable ECM association by IGFBP-5', is not in the source, and the source does not support its composite claim: it says nuclear localization is not required for every phenotype, including fibrosis (line 177), but never that the profibrotic response is IGF-independent, and the nuclear-entry passage the quote resembles (line 191) concerns a survival phenotype in osteosarcoma cells where IGF binding was required. The finding was removed rather than re-quoted, since no text in the cited file supports its IGF-independence claim. No annotation action, term or reason changed. The reference_review.review_notes for the Falcon file now records these corrections first (correctness left UNVERIFIED: the file itself was not shown wrong, the review misquoted it).
