  summary: 'Create review: DCXR (L-xylulose reductase), reference ortholog for DANRE/dcxr'
  details: |
    De-novo full review of human DCXR (Q7Z4W1), independent of ProtNLM2 predictions, as the experimentally characterised 1:1 ortholog of zebrafish dcxr (Q567K5; PAINT node PTN001211870, PANTHER PTHR44252 SF2 vs SF3). Falcon deep research and perplexity-lite fallback both failed; review based on UniProt and cached literature (PMID:11882650, 22042873, 40737316, 15103634, 15906319, 19337691). All 34 GOA rows reviewed: L-xylulose reductase (NADPH) and carbonyl reductase (NADPH) activity, xylulose metabolic process and D-glucuronate catabolic process accepted as core; glucose metabolic process and orthology/HTP locations kept as non-core; generic CH-OH oxidoreductase modified to the two specific activities; ROS regulation, sperm-nucleus and microtubule rows marked over-annotated; bare protein binding removed per policy. Notes record which terms PAINT propagated (MF pair, xylulose and glucose metabolism) versus those resting on human-only evidence (glucuronate catabolism IMP, quinone reductase IDA).
