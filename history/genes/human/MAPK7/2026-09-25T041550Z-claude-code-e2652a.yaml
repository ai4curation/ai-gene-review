  summary: 'Create review: MAPK7'
  details: |
    Full review of 65 GOA annotations for human MAPK7/ERK5 (Q13164) plus one NEW MF (transcription coactivator activity, GO:0003713, from the ERK5 C-terminal transactivation domain; PMID:11046135, PMID:32170057). Generic MAPK cascade (ISS) and signal transduction (TAS) refined to ERK5 cascade (GO:0070375), matching MAP2K5; protein kinase activity refined to MAP kinase activity. Protein binding rows: MAP2K5 partners to MAPKK binding, HSP90AB1-CDC37 to Hsp90 protein binding, MEF2A to DNA-binding transcription factor binding, PML and high-throughput-only partners removed. MAPK binding IPI with NFE2L2 as partner modified to transcription factor binding. NAS enzyme inhibitor activity and AC-activating GPCR signalling (PMID:16177794) removed. Downstream endothelial/stress response terms kept as non-core. Added 7 fetched publications and reference_review for all PMIDs; core functions, questions and experiments written; validated clean.
