  summary: Initial review of STXBP1 (Munc18-1) GO annotations
  details: |
    Reviewed all 109 GOA rows for human STXBP1 (P61764) against cached literature (Verhage 2000, Voets 2001, Shen 2007, Ma 2013, Dulubova 2007) and the deep-research report. Core functions: syntaxin-1 binding (GO:0017075), SNARE assembly template as protein-macromolecule adaptor activity (GO:0030674, added as NEW), and vesicle docking activity (GO:0160321). Regulation-of-priming and regulation-of-fusion rows were modified to the processes themselves (GO:0016082, GO:0031629), because Munc18-1 is part of that machinery. All 27 bare high-throughput protein-binding rows were removed as uninformative, and the STX1A pulldown row was modified to syntaxin-1 binding. Mitochondrion, RNA binding, exosome, tethering, Ca2+-triggering, scrambling and axon-target-recognition rows were marked over-annotated. Identical protein binding was left UNDECIDED.
