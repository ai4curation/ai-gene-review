  details: |
    Created the full MAP2K1/MEK1 review: all 193 GOA rows individually judged (68 ACCEPT, 45 MODIFY, 35 KEEP_AS_NON_CORE, 27 MARK_AS_OVER_ANNOTATED, 14 REMOVE, 4 UNDECIDED). Core functions are MAP kinase kinase activity in the ERK1/ERK2 cascade (cytosol) and non-catalytic MAP kinase scaffold activity via KSR-driven BRAF activation (PMID:29433126). Protein-binding rows were converted to MAPKKK binding (RAF1/BRAF/MOS), scaffold protein binding (KSR1) or MAP kinase binding (ERK1/2), or removed for screen-only partners. Activator-activity rows were modified to MAP kinase kinase activity because they rest on catalytic ERK activation. The ARBA stress-activated MAPK cascade row was removed. Rat-derived pharmacological process IEAs were marked over-annotated. The MGI rows citing PMID:22572157 were flagged as a probable digit transposition of PMID:22752157, recorded as WRONG_IDENTIFIER with a replacement. Also wrote MAP2K1-notes.md with provenance.
