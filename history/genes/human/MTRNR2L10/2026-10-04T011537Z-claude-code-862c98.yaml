  summary: 'Create review: MTRNR2L10'
  details: |
    Reviewed all six GOA rows on the nuclear humanin-like locus MTRNR2L10 (P0CJ77, PE2, HGNC pseudogene): both extracellular rows and both PANTHER:PTN002141596 IBA rows REMOVE, both cytoplasm rows MARK_AS_OVER_ANNOTATED. HN10 substitutes Pro19 and Val20 (both humanin secretion determinants), Ser14->Arg (an abolishing humanin substitution) and Thr13->Ile (measured to reduce HN5 cytoprotection), so the humanin transfers fail on the target side. Flagged PMID:38630326 as circular, since it selected the locus by the propagated GO:1900118 term. No core functions, no new terms.
