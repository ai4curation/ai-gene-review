  summary: De-novo review of all 15 GOA annotations for SLC16A6 (MCT7), facilitative
    ketone-body/taurine transporter (orphan-grade)
  details: |
    Reviewed every GOA row for SLC16A6 (O15403, MCT7); sparsely characterized (Tdark). Two distinct experimentally-grounded core MF leaves (QuickGO-verified separate branches): GO:0097253 beta-hydroxybutyrate transmembrane transporter activity (is_a GO:0008028 monocarboxylate; NEW row + core, substrate (R)-3-hydroxybutyrate CHEBI:17066) and GO:0005368 taurine transmembrane transporter activity (sulfur-compound branch is_a GO:1901682; substrate taurine CHEBI:507393). Facilitative/uniport, pH- and Na+-independent (no H+ coupling asserted). Core location GO:0016323 basolateral PM / GO:0005886. Zebrafish slc16a6 is primary ketone-export evidence (PMID:22302940, PMID:30692937) but human protein rescues the zebrafish defect (treated as ortholog-bridged human evidence, graded in notes); taurine is ISS from rat ortholog assays (flagged no direct human assay). Actions (15+1 NEW): 9 ACCEPT, 5 TOO_GENERAL (organic-acid/membrane/transport umbrellas), 1 REMOVE (bare binding WFS1 Y2H), 1 NEW. proposed_new_terms: 1 (beta-hydroxybutyrate transmembrane transport BP, parent GO:0015718). source_defects: none (UniProt omission of ketone role noted in notes, not a defect). Batch 11.
