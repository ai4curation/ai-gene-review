  details: |
    The review's primary identifier is an RNAcentral URS id whose GOA file is header-only and whose cached rnacentral.json holds publications and length but no gene cross-reference, so the id had no in-branch corroboration. A notes file now records the HGNC REST API query and its rna_central_id response, which matches the id in the review, together with the codons read under the vertebrate mitochondrial code. The length claim is deliberately limited to the mt-tRNAs reviewed here rather than asserted across all 22 human mt-tRNAs, since only the former was checked.
