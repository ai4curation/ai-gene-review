  summary: First review of GNB3 for the dismech vision-disorder alignment
  details: |
    First annotation review of human GNB3 (G protein beta-3 subunit), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1, phototransduction). 36 GOA rows reviewed: 16 KEEP_AS_NON_CORE, 11 MARK_AS_OVER_ANNOTATED, 5 ACCEPT, 2 REMOVE, 1 MODIFY, 1 UNDECIDED. Two core functions, both as contributes_to GO:0003925 G protein activity within the heterotrimer: cone transducin (GO:0141190, cone photoreceptor disc membrane) and ON-bipolar glutamate signalling (GO:0007216, dendrite). Removed: GTPase activity (TAS), because GTP hydrolysis is the alpha subunit's, and one bare protein-binding row. Rows from an overexpression mouse study (PMID:29206867), including two NOT rows, are marked over-annotated. Retina evidence is mainly mouse plus the human night-blindness genetics. Validated with just validate human GNB3: no errors; three core-function terms have no annotation row and no NEW row was added, since GNB1 and GNGT1 do not carry GO:0141190 either.
