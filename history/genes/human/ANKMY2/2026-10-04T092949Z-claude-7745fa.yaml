  summary: 'Initial review of human ANKMY2: cytosolic adenylyl cyclase trafficking
    factor for primary cilia; cilium IEA corrected to cytosol; NEW ciliary protein
    localization'
  details: |
    Reviewed 3 GOA rows. MODIFY the cilium IEA (UniProt by-similarity) to cytosol, since mammalian ANKMY2 is cytosolic (PMID:32702291). Accepted the enzyme binding IEA. Removed the TINF2 IPI. NEW GO:0097499 protein localization to non-motile cilium (IMP, human kidney cells, PMID:41474822; comparator worm daf-25). Core MF adenylate cyclase binding. PTHR24150 has no PAINT nodes despite worm and mouse donor evidence: a candidate for PAINT curation.
