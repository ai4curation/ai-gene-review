  summary: 'Weekly compliance: improve AMDHD1 review evidence scaffolding'
  details: |
    Weekly evidence-aware compliance pass. AMDHD1 weighted compliance 44.44 -> 92.00. Added review.reason to all 14 pre-existing annotations, naming the specific InterPro signature behind each subsumed hydrolase row (IPR006680 and IPR011059 are superfamily-level and yield only generic ancestors; IPR005920 is family-specific and yields the correct process term). Migrated the two bare GO:0005515 protein-binding IPI rows from MARK_AS_OVER_ANNOTATED to REMOVE per the generic-protein-binding policy (just validate warned on both); MODIFY was unavailable because neither BioPlex screen tests whether AMDHD1 is a CUL3-KLHL23 substrate. Added one NEW annotation, GO:0008270 zinc ion binding with ISS evidence and supporting_entities UniProtKB:P42084, which also resolves the pre-existing warning that core_functions[1] was not reflected in existing_annotations; the comparator check was run first and supports it (P. putida HutI ortholog carries GO:0008270 and GO:0005506 by IEA GO_REF:0000104; human ACMSD in the same superfamily carries GO:0008270 by IDA twice), so the absence on AMDHD1 is a UniProt cofactor-pipeline coverage gap rather than a curatorial decision. Added findings to all nine references including four on the UniProt entry; GO_REF findings are statement-only because those documents are not cached. Added four suggested_questions and three suggested_experiments where none existed, centred on the fact that the human enzyme has never been purified or assayed (UniProt says Probable imidazolonepropionase; Reactome R-HSA-70906 states existence of the human enzyme is inferred only from high-throughput screening). Added reference_section_type to the four core_functions quotes. No existing GO term id or label was changed. Deliberately left open: four GO_REF findings supporting_text slots and literature_support on the three Reactome TAS rows, which would require a PMID/DOI quote that no paper in this review supplies. just validate clean, all three prior warnings resolved.
