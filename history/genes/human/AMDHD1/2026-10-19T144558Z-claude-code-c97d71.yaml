  summary: 'Address review feedback: generalize metal-binding term to GO:0046872'
  details: |
    PR shepherd response to the CHANGES_REQUESTED review on PR 4448.

    Blocking item: the NEW annotation and core_functions[1] asserted
    GO:0008270 zinc ion binding, resolved from UniProt's two COFACTOR
    entries by reading the listed order as a ranking. UniProt gives
    Zn(2+) and Fe(3+) as an explicit either/or at equal evidential
    strength (both ECO:0000250|UniProtKB:P42084; "Binds 1 zinc or iron
    ion per subunit"; residues 260 and 334 each carry a BINDING line for
    either metal). Both slots now assert GO:0046872 metal ion binding,
    with the Zn-vs-Fe specifics kept in review.reason and
    suggested_questions. supporting_entities gained UniProtKB:A0KF84,
    the donor for the Fe site assignments. GOA carries neither
    GO:0046872 nor either child, so action: NEW still applies.

    Non-blocking corrections, each re-derived from UniProt rather than
    taken from the review: Q9HU91 is HUTI_PSEAE (Pseudomonas aeruginosa),
    not a "Pseudomonas/Agrobacterium" enzyme; P42084 is HUTI_BACSU
    (Bacillus subtilis), which the notes had called Agrobacterium
    (Agrobacterium fabrum is Q8U8Z6); residue 336 binds the product
    N-formimidoyl-L-glutamate, so the substrate-only sites are 159, 192
    and 263; and the "liver and skeletal muscle" expression qualifier is
    now anchored in the notes to the UniProt HPA cross-reference
    (ENSG00000139344, "Tissue enhanced (liver, skeletal muscle)").

    No GO term id or label was invented: GO:0046872 was confirmed via
    OLS, and the three donor accessions via the UniProt REST API.
    just validate human AMDHD1 passes with no warnings.
