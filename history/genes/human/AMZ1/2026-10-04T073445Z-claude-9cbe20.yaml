  summary: 'Initial review of human AMZ1: the only activity paper (PMID:15972818) is withdrawn and AMZ1 lacks the third zinc-binding His, so the peptidase IEAs are undecided'
  details: |
    Reviewed 4 GOA rows. The only AMZ1 activity paper (PMID:15972818) was withdrawn in 2019 (PMID:30808005) and is marked is_invalid. A motif check (AMZ1-bioinformatics/zinc_motif_check.py) shows Asn271 in place of the third zinc-binding His, consistent with PMID:22937112. The peptidase, metallopeptidase and proteolysis IEAs are UNDECIDED. The CC ND row is accepted. No core function, no NEW terms; WHOLLY_DARK knowledge gap. A first draft of this PR accepted the IEAs on the withdrawn paper and was reworked before merge.
