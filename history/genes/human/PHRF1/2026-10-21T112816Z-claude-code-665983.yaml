  summary: 'Create review: PHRF1 (closest characterised SF20 relative of S. pombe
    asr1)'
  details: |
    De novo review of human PHRF1, independent of ProtNLM2 predictions; deep research failed (falcon 403, perplexity quota) so the review was built from cached primary literature. All 5 GOA rows reviewed: 3 CSNK2B protein-binding IPIs removed per policy; HDA membrane marked over-annotated (bulk membrane proteomics, nuclear protein); ISS RNA polymerase binding modified to RNA polymerase II CTD binding (rat donor in same PANTHER subfamily PTHR12618:SF20). Added NEW ubiquitin protein ligase activity, protein monoubiquitination (TopBP1), histone H3 reader activity (PHD reads unmodified H3 N-terminus; H3K36me3 claim recorded as disputed), nuclear speck, site of double-strand break, positive regulation of NHEJ and positive regulation of TGF-beta receptor signalling. Organismal phenotypes (tumour suppression, memory, CSR) not annotated. Notes record which functions are safe to transfer to SF20 relatives.
