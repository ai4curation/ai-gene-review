- type: CREATE
  outcome: changed
  summary: 'Full GO review of human ARFGEF2 (BIG2): 66 GOA rows reviewed plus 2 NEW;
    found a 20-row double projection from one rat paper, a paralog-derived myosin-binding
    chain, a TNF receptor/ligand conflation, and a coverage gap rather than disease
    over-annotation.'
  details: |
    De-novo review. All 66 GOA rows given an action (27 ACCEPT, 25 KEEP_AS_NON_CORE,
    10 REMOVE, 3 MARK_AS_OVER_ANNOTATED, 1 MODIFY) plus 2 NEW rows, 3 core functions,
    35 references with reference_review on 25 of them.

    Structural findings, all backed by committed analyses under
    genes/human/ARFGEF2/ARFGEF2-bioinformatics/:

    - 20 of the 66 rows (13 GO terms) are projections of rat Arfgef2 (Q7TSU1), 17 of
      them resting solely on PMID:15198677, arriving twice - once as UniProt ISS
      (GO_REF:0000024) and once as Ensembl Compara IEA (GO_REF:0000107). The
      complex-projection discriminator is NEGATIVE: that reference annotates only 2
      entities in all of GOA, so it is per-gene curation and the synaptic rows are
      kept as non-core rather than removed.
    - GO:0017022 myosin binding reaches human ARFGEF2 only through a rat row made
      from PMID:15644318, a paper titled for the paralog BIG1 that placed 6
      annotations on human ARFGEF1 and none on human ARFGEF2. The term is
      independently true of BIG2 via PMID:23918382, so it is kept with a
      propagation_review and a recommendation to re-reference, not removed.
    - GO:0032760 positive regulation of TNF production is a receptor/ligand
      conflation (the paper measures TNFR1 release). MODIFY to GO:1903543.
    - Two GO:0005879 axonemal microtubule rows marked over-annotated. A 13-accession
      cilium census confirms ARFGEF2 is the only large-ArfGEF holder and only by this
      projection; the donor paper's full text is paywalled, so the rat row is filed
      for re-examination rather than contradicted. The census also found EXOC7, BIG2's
      exocyst partner, holds GO:0036064 ciliary basal body - reported as the result
      that cuts against the argument.
    - GO:0005086 ARF GEF activity was merged into GO:0005085, so the general term is
      already maximal; ARF1/ARF3 recorded via core_functions substrates and RO:0002233
      has_input extensions, and filed as an ONTOLOGY KnowledgeGap.
    - The disease-gene over-annotation trap is ABSENT: no cortex, neuron-migration or
      heterotopia term exists on this gene. The defect is coverage - 26 of 43
      literature PMIDs produce zero GO annotations anywhere. PVNH2 material is kept in
      the description and suggested_questions, out of existing_annotations.

    Self-corrections recorded rather than hidden: the cilium census initially
    hardcoded Q9Y678 as GBF1 (it is COPG1), so cohort accessions are now derived by
    gene-name lookup with the resolved symbol asserted; and eight supporting_text
    entries were re-attached after re-reading each quote against its own claim.

    audit_claims.py commits 12 self-tested guards covering duplicate YAML keys,
    verbatim quotes (including the file: quotes CI does not check), reference titles,
    supporting_entities drift against GOA, row coverage, numeric drift, cohort
    membership and retracted phrasings.
