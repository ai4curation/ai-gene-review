  summary: First review of RD3 for the dismech vision-disorder alignment
  details: |
    First annotation review of human RD3, written for projects/DISMECH_VISION_ALIGNMENT (tranche 1). 34 GOA rows reviewed: 12 KEEP_AS_NON_CORE, 8 MODIFY, 8 REMOVE, 6 ACCEPT. Core functions: GO:0030251 guanylate cyclase inhibitor activity (GO:0031283 negative regulation of guanylate cyclase activity) in the photoreceptor inner segment, and, at process level because GO has no molecular function for it, GO:1903546 protein localization to photoreceptor outer segment (delivery of retinal guanylate cyclase out of the endoplasmic reticulum). All eight removals are bare protein-binding rows from interactome screens and one guanylate kinase binding report; no kinase activator activity is proposed because the stimulation was not reproduced in mouse retina (PMID:33539922). Retina development is refined to GO:0001895 retina homeostasis, since rd3 mice develop normally before degenerating. Nucleus and cytoplasm EXP rows from PMID:26100624 could be read only as an abstract and are kept as non-core. Validated with just validate human RD3: no errors.
