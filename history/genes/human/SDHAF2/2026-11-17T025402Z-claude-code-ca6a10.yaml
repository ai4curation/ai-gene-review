  summary: Make the summaries of two IBA rows agree with their corrected reasons
  details: |
    Follow-up to the tree re-read of 2026-11-11, after review of the pull request. For GO:0006121 and GO:0006099 (both MARK_AS_OVER_ANNOTATED) the re-read wrote a reason saying the IBA is not propagated from the catalytic SDH subunits: the seeds are SDHAF2 itself and its yeast ortholog SDH5 (GO:0006121), and SDH5 alone (GO:0006099). The rows had no reason before, and the false claim was in their summaries, which the script does not rewrite, so each row contradicted itself.

    Both summaries now say that the IBA is seeded by the assembly factors themselves, so the over-annotation lies in those seed annotations. Verdicts and reasons are unchanged. The reader's note that root_cause PROPAGATION_BAD no longer fits is in projects/IBA_REVIEW/tree-rereview/needs-curator.yaml.
