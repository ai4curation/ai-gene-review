    - GO:0006099 (MARK_AS_OVER_ANNOTATED): the reason made a claim the tree contradicts; the reason was corrected. Added to the reason: In the PANTHER 19.0 tree the node is the root of the SDHAF2 family and the single seed (1 of 1 resolved) is a one-to-one ortholog of SDHAF2, so the term was not transferred from catalytic subunits and the over-annotation lies in the assembly-factor seed annotation itself.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
