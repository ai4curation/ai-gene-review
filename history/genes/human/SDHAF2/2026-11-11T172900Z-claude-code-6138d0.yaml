  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (SDHAF2-phylo.yaml, from `just phylo human SDHAF2`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0006121 (MARK_AS_OVER_ANNOTATED): the reason made a claim the tree contradicts (Review summary: 'Over-annotation propagated by IBA from the catalytic SDH subunits in the shared PANTHER family'. Tree: the family is PTHR12469 (SDHAF2 / EMI5 homolog) and the 2 seeds are SDHAF2 itself (self seed) and yeast SDH5 (SGD:S000005432), a one-to-one ortholog and itself the assembly factor; no catalytic SDH subunit is among the seeds or in this family.). The reason was rewritten to correct it; the rest of its argument is kept.
    - GO:0006099 (MARK_AS_OVER_ANNOTATED): the reason made a claim the tree contradicts (Review summary: 'This is an over-annotation transferred by IBA from the catalytic subunits'. Tree: the only seed is yeast SDH5 (SGD:S000005432), the SDH assembly factor 2 and a one-to-one ortholog of SDHAF2 in family PTHR12469; no catalytic SDH subunit is a seed or a member of this family.). The reason was rewritten to correct it; the rest of its argument is kept.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
