  summary: 'Create review: F2'
  details: |
    Reviewed all 103 seeded GOA annotations for prothrombin F2 (P00734); provenance notes are in F2-notes.md because deep-research providers were unavailable. Localization conclusion is secreted extracellular plasma protein, so the 31 extracellular-region rows were accepted, the ER-lumen and Golgi-lumen rows were kept as non-core secretory transit compartments, and the six Reactome plasma-membrane rows were modified to external side of plasma membrane, which the gene already carries by IDA. The thrombospondin receptor activity row was removed with a source_defects entry, because the cited paper isolates an 88-kDa platelet membrane glycoprotein, CD36, as the thrombospondin binding site while thrombin is only the agonist used. Growth factor activity and receptor ligand activity were marked as over-annotations since thrombin activates protease-activated receptors by cleaving them. Ten bare protein-binding rows were removed, endopeptidase and peptidase activity and three pathway or regulation parents were marked TOO_GENERAL, and both directions of coagulation regulation were accepted because thrombomodulin binding switches thrombin specificity. Three core functions were recorded.
