  details: |
    De-novo review of DYNLT1 (Tctex-1): all 66 GOA annotations reviewed, using falcon deep research (succeeded on a 2400 s timeout rerun) plus cached literature. Added Li 2011, Palmer 2011, Yeh 2013 and Saito 2017. Core functions: (1) dimeric dynein-1/dynein-2 light chain binding dynein intermediate chains, contributing to retrograde IFT and cilium length; (2) dynein-independent phospho-T94 pool at the ciliary transition zone that drives Cdc42/branched-actin-dependent ciliary resorption. Added NEW GO:0061523 cilium disassembly (IMP; comparator NEDD9/AURKA/HDAC6) and GO:0035869 ciliary transition zone (IDA). Generic protein binding rows removed, except DYNLT3/DYNLT2B partners, which were modified to heterodimerization and self-binding modified to homodimerization. Reactome granule/extracellular rows marked over-annotated. host cell removed. Two NAS rows undecided. Consistent with the module stage-7 role; HPA has no cilia call. just validate: clean (no errors or warnings).
