  summary: 'Revert: restore SMPD1 review status to INITIALIZED'
  details: |
    Reverts a status promotion I made earlier today, while keeping the content fix from the same change.

    I had changed this review from INITIALIZED to COMPLETE because all 102 rows were adjudicated with no PENDING and no UNDECIDED. SMPD1 is a ClinGen Mendelian gene (present in projects/CLINGEN_MENDELIAN/clingen-gene-disease-validity.csv) that the campaign has not yet reached - it does not appear in the review-progress log - so unlike GSDME and CORO1A there was no campaign status decision to override here. The revert is for a different and simpler reason: COMPLETE was not mine to assert. The campaign's own position is that a COMPLETE status does not certify assessment against its current evidence and curation rules, and on the repository's own comparative standard this review is less finished than CORO1A, which sits at DRAFT with reference_review on all 40 of its references while this one has none on any of its 37.

    Retained, because it is a genuine correction independent of status: the GO:0046513 ceramide biosynthetic process row cited to PMID:19279011 now reads ACCEPT rather than MARK_AS_OVER_ANNOTATED, with the defect moved to the reference and recorded as MISCITED. The reasoning is unchanged from when it was made - that paper manipulates GBA1 and SMPD1 appears only as a previously implicated substrate source, but ceramide biosynthesis is the product side of acid sphingomyelinase's defining reaction and is accepted on seven other rows here, so the term is not the thing that over-reaches.

    Worth a curator's attention and deliberately not acted on: INITIALIZED is almost certainly a stale default for a review that carries 102 adjudicated rows and 100 verbatim-verified quotes. DRAFT would describe it better. Left alone rather than substituting my own judgement for the campaign's a second time.
