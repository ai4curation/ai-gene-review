  summary: 'Complete: human SMPD1 review'
  details: |
    Promoted INITIALIZED to COMPLETE, and harmonized one annotation action.

    All 102 rows were already adjudicated with no PENDING and no UNDECIDED, a description, a core function and suggested questions and experiments in place; the status flag was the only thing missing.

    One substantive change. The GO:0046513 ceramide biosynthetic process row cited to PMID:19279011 carried MARK_AS_OVER_ANNOTATED. The previous reviewer's reading of that paper is correct and is preserved: it is a study of acid beta-glucosidase 1 in the ceramide salvage pathway, its IMP evidence manipulates GBA1, and SMPD1 appears only as a previously implicated substrate source. But MARK_AS_OVER_ANNOTATED is a statement about the term, and ceramide biosynthesis is not an over-annotation for acid sphingomyelinase: it is the product side of the enzyme's defining reaction, accepted on seven other rows here including three IDA and two IMP. Saying the term over-reaches on one row while accepting it on seven is incoherent about the gene, even though the action-consistency table does not catch it because only ACCEPT-versus-REMOVE is in its rules. Changed to ACCEPT and the defect moved to the reference, recorded as MISCITED on PMID:19279011 - the same pattern used for PRF1 (GO:0140507 cited to a granulysin paper) and for three granzyme A-referenced rows on GZMB.

    Also corrected my own earlier description of this: the review of GO-CAM 62b4ffe300000081 had called it an internal inconsistency worth resolving, which I had inferred from aggregate action counts without reading the rows. That note has been rewritten to describe what is actually there.

    The protein_binding_policy warnings this review emits are retained and reported, not fixed: SMPD1 is a ClinGen Mendelian project gene, and that project's standing instruction permits supported generic binding to remain KEEP_AS_NON_CORE.
