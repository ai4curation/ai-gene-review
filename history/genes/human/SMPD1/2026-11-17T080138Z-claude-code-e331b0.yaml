  summary: Correct a fabricated citation string and state the MISCITED grade's depth
  details: |
    A self-audit of this branch found 72 reference_review notes written as 'PubMed-verified (<journal> <year>;<volume>:<pages>)'. Twenty-one of the 72 carried the wrong journal, volume and pages: the bibliographic detail was written from memory rather than read from the cached record, under a phrase asserting verification. The PMIDs themselves are right - every one resolves to a cached publication whose title the reference validator matches, and three review rounds confirmed the PMIDs and the verbatim quotes - but nothing validates free text in review_notes, so the wrong citations would have merged unnoticed.

    The fix removes the parenthetical from all 72 rather than correcting the 21. The PMID is the identifier and the cached record holds the citation, so hand-copied bibliographic data adds nothing and is the same trap for the next editor. 'PubMed-verified' itself stays: it means the PMID was checked against the cached PubMed record, whose title match is machine-enforced.

    This file carried 1 of them, and it was one of the wrong ones: the note on PMID:19279011 read 'PubMed-verified (J Lipid Res 2009;50:1178-87)' where the cached record is J Biol Chem 2009;284(19):12972-8. That is the note this branch added when it moved the GO:0046513 row to ACCEPT, so the fabricated citation sat directly under a MISCITED grade about somebody else's citation.

    This file's annotation content, actions, reasons and supporting quotes are untouched. Re-validated: just validate clean, quote check 0 failures.

    Separately, addressing the one new suggestion from round 3 of the PR review: the MISCITED note asserted that the paper's experiments are GBA1-only, from an abstract-only cache (full_text_available: false). It now says so, states what the abstract does show (GBA1 silencing and forced expression; acid sphingomyelinase named only in the opening sentence as previously implicated, with a citation to another paper), and records that the full text could still contain an ASM experiment - which is why the row is ACCEPT and the defect sits on the reference rather than on the annotation. This matches the parallel PRF1 note on PMID:21438968, which already stated its depth, and the 2026-11-16 maintainer ruling on stating what depth a claim rests on.
