  summary: First review of SAG for the dismech vision-disorder alignment
  details: |
    First annotation review of human SAG (S-arrestin), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1, phototransduction). 24 GOA rows reviewed: 8 ACCEPT, 7 MODIFY, 5 KEEP_AS_NON_CORE, 2 REMOVE, 1 MARK_AS_OVER_ANNOTATED, 1 UNDECIDED; one NEW row proposes GO:0030547 signaling receptor inhibitor activity (IC), the role arrestin plays in capping phosphorylated rhodopsin. Core function: GO:0030547 in GO:0016059 negative regulation of opsin-mediated signaling pathway and GO:0036368 photoresponse recovery at the photoreceptor disc membrane. Removed: protein phosphatase inhibitor activity (TAS, PMID:2550422), because the cited bovine study shows arrestin protects the rhodopsin substrate and does not inhibit the phosphatase; and one bare protein-binding row. G protein-coupled receptor internalization (IBA) is marked over-annotated as a beta-arrestin function. Spectrin binding (Ensembl Compara from rat) is UNDECIDED because the source paper was not available. Validated with just validate human SAG: no errors.
