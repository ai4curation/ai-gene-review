  summary: 'FGFR4: correct reasoning for removing NOT response to bile acid'
  details: |
    Rewrote the reason for REMOVE on NOT GO:1903412 (IMP, PMID:19085950). The negation rests on an FGFR4 protein-abundance null, which is an expression observation and not evidence that FGFR4 lacks a function. A positive response-to-bile-acid annotation is not warranted either, because the paper states CDCA is not itself an activator of FGFR4 (it acts via FXR-induced FGF19). Added that sentence as verbatim supporting text. The earlier text wrongly implied the positive data supported FGFR4 responding to bile acid.
