  summary: Initial full review of human FGFR4 GO annotations
  details: |
    Reviewed all 128 GOA annotations (95 ACCEPT incl. 47 Reactome PM TAS, 22 KEEP_AS_NON_CORE, 7 REMOVE, 2 MODIFY, 1 MARK_AS_OVER_ANNOTATED, 1 UNDECIDED) and added 1 NEW (GO:0070858). Removed 6 generic protein binding IPIs and the NOT response to bile acid IMP (PMID:19085950), which the full text does not support. Modified positive regulation of gene expression to negative (GO:0010629) and DNA biosynthesis regulation to cell proliferation. Deferred to curators on experimental annotations from abstract-only FGFR1/FGFRL1 papers; transport vesicle left UNDECIDED. Core functions: FGFR activity (GO:0005007) in FGFR signaling/ERK1-2 and negative regulation of bile acid biosynthesis via FGF19-KLB; FGF binding (GO:0017134); plasma membrane.
