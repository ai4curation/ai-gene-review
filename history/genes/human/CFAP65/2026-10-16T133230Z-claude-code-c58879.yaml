  summary: 'Create review: CFAP65'
  details: |
    New review of all 30 GOA rows for CFAP65 (Q6ZU64; MMAF, SPGF40). Falcon deep research failed (authentication error) and Perplexity was not available; the literature was researched manually and recorded in CFAP65-notes.md. Core: structural component of the C2a central-pair projection (PMID:39853433, PMID:33988244). Axonemal central apparatus was modified to axonemal central pair projection. Cytoplasm, axoneme and spermatogenesis were marked TOO_GENERAL. Acrosomal vesicle, sperm midpiece and acrosome assembly were kept as non-core. Acrosomal membrane and mitochondrial sheath assembly were marked as over-annotated. Protein binding was removed and RNA binding (HDA) is UNDECIDED. Structural constituent of cytoskeleton was proposed as NEW. New publication caches: PMID:31413122 and PMID:33472045 (via fetch-gene), PMID:39853433, PMID:34231842, PMID:31501240, PMID:31571197. Validated with just validate human CFAP65.
