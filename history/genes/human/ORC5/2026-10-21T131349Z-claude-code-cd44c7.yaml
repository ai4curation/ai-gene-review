  summary: 'Create review: ORC5'
  details: |
    De-novo review of human ORC5 (O43913) as the experimentally characterised reference for HORSE/ORC5 (same PANTHER subfamily PTHR12705:SF0; PAINT PTN000295037 donor). Falcon deep research failed (Edison 403 auth) and the perplexity-lite fallback failed, so the review rests on cached literature (OBI1, cryoEM, ORCA, ORC1 BAH full texts; others abstract-only) and UniProt. All 52 GOA rows reviewed: 14 bare protein-binding IPI rows removed; ORC, chromosome, DNA replication and nucleotide binding modified to nuclear ORC, chromatin, DNA replication initiation and ATP binding; telomeric region and regulation of DNA replication (OBI1 ubiquitylation) kept as non-core; IBA origin binding, nuclear ORC and replication initiation accepted. Core functions separate human experimental support (ATP-dependent assembly, chromatin association, DNA-proximal beta-hairpin, ubiquitylation-dependent firing) from family-level inference. ProtNLM2 predictions not consulted.
