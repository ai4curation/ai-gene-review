  summary: 'Complete GO review of human ARHGAP21: 47 GOA rows reviewed, 3 NEW added;
    records a contested GAP substrate GO cannot express and seven uncurated primary
    papers'
  details: |
    De-novo review of all 47 GOA rows plus 3 NEW annotations. Actions: 19 ACCEPT,
    3 KEEP_AS_NON_CORE, 8 MODIFY, 17 REMOVE, 3 NEW. Row count reconciled against
    the GOA TSV by multiset comparison; the fetch-gene stub did not collapse rows
    for this gene.

    Two ontology gaps recorded rather than worked around:

    1. GAP substrate specificity is inexpressible. GO:0005099 (Ras), GO:0005100
       (Rho), GO:0008060 (ARF) and GO:0005097 (Rab) GAP terms are all MERGED into
       GO:0005096, which has zero is_a children, so GO:0005096 is already maximal.
       ARHGAP21's substrate is genuinely disputed - Cdc42 "preferentially" (Dubois
       2005, PMID:15793564), RhoA and Cdc42 (Sousa 2005, PMID:16184169), RhoA
       (Anthony 2011, PMID:21173159), RhoA and RhoC in PC3 but not LNCaP (Lazarini
       2013, PMID:23200924). The disagreement is recorded, not adjudicated. No
       proposed_new_terms entry was filed, since the merge was deliberate;
       substrate identity is carried in core_functions[].substrates and RO:0002233
       has_input extensions instead.
    2. GO has no term for the PDZ-domain side of a PDZ/PDZ-binding-motif pair.
       GO:0030165 is defined "Binding to a PDZ domain of a protein" (the ligand
       side) and has no descendants, so ten holdup-assay rows mapping to ARHGAP21
       residues 50-159 are removed as uninformative.

    A curation gap dominates this gene: 7 of 10 primary papers produced no GO
    annotation anywhere in GOA (verified by querying QuickGO by reference; none of
    the ten result sets was paginated). Every paper reporting RhoA or RhoC activity
    is in that set. PMID:16184169, a Nature Cell Biology paper titled for
    ARHGAP21's requirement in alpha-catenin recruitment, produced two annotations,
    both on alpha-catenin and none on ARHGAP21. The three NEW rows recover part of
    this: GO:0045294 alpha-catenin binding (IPI), GO:0034333 adherens junction
    assembly (IMP), GO:0032956 regulation of actin cytoskeleton organization (IMP).

    Correction to a common reading of this protein: ARHGAP21 is an ARF effector,
    not an ArfGAP. Residues 930-1097 form an ARF-binding domain (PH domain plus a
    C-terminal helix); PMID:16527809 classifies it an effector while contrasting it
    with the two Arf GAPs assayed alongside it. GOA carries no ARF-GAP annotation,
    which is correct.

    Negative results recorded explicitly: no annotation from any primary paper
    landed on the modern ARHGAP10 (A1A4S6) despite both 2005 papers using that
    symbol, so the rename collision has not corrupted GOA; the single Xeno WITH/FROM
    accession is mouse Arf1 (P84078), sequence-identical to human ARF1 (P84077),
    so the flag is bookkeeping; no retractions among 30 cited PMIDs and the one
    erratum (PMID:36477203 on PMID:36115835) is cosmetic; all 7 IBA rows are
    self-referential and classified NO_FAILURE_CORE.

    14-3-3 binding is corroborated across 4 publications and 3 orthogonal IntAct
    methods, so those 6 protein-binding rows were modified to GO:0071889 rather
    than removed - per-partner judgement rather than a blanket policy.

    Six rerunnable checks committed under ARHGAP21-bioinformatics/ with RESULTS.md
    and JSON outputs, including a self-tested audit that reconciles the review
    against the GOA TSV, rejects duplicate YAML keys via a strict loader, and
    verifies all 48 supporting_text quotes (including file: quotes, which CI does
    not check). Two defects in my own work were found and fixed: an IntAct id
    parser that reported 0 partners from 502 rows, and two rows whose verbatim,
    correctly-attributed quote described a different paper's method than the
    summary claimed.
