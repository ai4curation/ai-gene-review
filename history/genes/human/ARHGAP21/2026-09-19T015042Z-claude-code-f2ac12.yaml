- type: EDIT
  outcome: changed
  summary: 'Round-2 review fixes: re-source or remove four mis-attached quotes, de-dark
    the PDZ knowledge gap against PMID:41957357, add GO:0031005 filamin binding, complete
    references'
  details: |
    Addresses the CHANGES_REQUESTED review on PR #3059. All six items were
    evidence-attachment or citation-completeness problems; no term choice or action
    changed, and the parts the reviewer validated (row reconciliation, the GAP-term
    merge finding, the GO:0005515 REMOVE/MODIFY split, recording substrates in
    core_functions rather than requesting a merged-away term) were left untouched.
    Every item was verified against the cached files before being acted on.

    1. GO:0032956 summary asserted "depletion produces cell spreading and accumulation
       of F-actin stress fibres". Grep-verified: that string appears nowhere in
       PMID:15793564's cached abstract. It is UniProt's MISCELLANEOUS line, which spans
       a CC continuation (lines 274-275) and therefore cannot be quoted verbatim on one
       physical line at all. The clause was removed rather than re-sourced. The row now
       records that the direction of the F-actin effect is not fixed across systems,
       citing PMID:25744409 (mouse islets, antisense knockdown REDUCES F-actin), which
       is itself the reason a sign-agnostic regulation term is the right choice.
    2. The same row's reason justified its evidence code by "the two-hybrid partner is
       human alpha-catenin" - copy-pasted from the adherens-junction row, where that
       partner belongs (PMID:16184169). This was my own round-1 bug: a species caveat
       written to improve honesty was pasted onto a row it did not describe. Replaced
       with a row-appropriate caveat.
    3. GO:0051684 maintenance of Golgi location was quoted with the nocodazole-washout
       sentence, which measures re-establishment after dispersal and so is establishment
       evidence (GO:0051683). Swapped for the steady-state sentence, verified verbatim
       in the cached full text.
    4. GO:0005794 IDA was quoted with an introduction sentence ending in reference
       callouts "(23, 24)" - prior work restated, not this paper's observation, so it
       cannot support an IDA. Swapped for the figure result, verified verbatim.
    5. The PDZ knowledge gap was tagged dark_aspect MF_DARK and called the PDZ "the one
       module of the protein with no assigned cellular role". Refuted by PMID:41957357,
       a file this same PR adds, which reports the PDZ domain mediates binding to
       filamin A. The darkness framing is removed; the ONTOLOGY gap survives unchanged,
       since finding a ligand does not create a term for the PDZ-domain side. Added a
       fourth NEW row, GO:0031005 filamin binding (IPI, human HCC cells), scoped to the
       binding the paper states outright rather than to the PDZ-dependence it hedges as
       a "potential mediator". That GO can express this one interaction only because a
       partner-specific term happens to exist is itself recorded as evidence that the
       gap needs a general fix.
    6. References added for every PMID the document names: PMID:21173159, PMID:22922005,
       PMID:29212046, PMID:25744409, PMID:41957357 and PMID:36477203. A one-shot fix
       script checked that every PMID string in the document resolved to a reference
       entry, but that script is not committed, so at the end of this round the
       invariant held by hand only. (Corrected in round 3, which moved the check into
       the committed audit_review.py; the original wording here claimed it "cannot
       silently regress", which was not true of anything in the repository.)

    Two corrections to the reviewer, checked rather than conceded: it missed
    PMID:36477203 (named in the review with no reference entry), and two of the PMIDs it
    listed as omitted from references were not actually named in the document until this
    round cited them.

    Counts after this round: 47 GOA data rows -> 47 non-NEW entries + 4 NEW = 51, with
    50 supporting_text quotes verified verbatim. just validate is green and the committed
    audit_review.py self-test passes.
