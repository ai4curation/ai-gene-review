  summary: 'Create review: FAM20B'
  details: |
    De-novo review of human FAM20B (O75063), the reference for SF14 transfer to fly CG3631; it does not use ProtNLM2 predictions. Falcon deep research failed (Edison auth 403) and the perplexity-lite fallback also failed, so the review rests on cached primary literature (PMIDs 19473117, 25331875, 29572475, 37828045, 24425863, 40422215, 23395820). GO:0016773 xylose 2-O-kinase activity accepted (IBA/IDA/TAS). IBA GO:0030166 modified to GO:0120532 GAG-protein linkage region biosynthetic process. Reactome TAS GO:1902729 negative regulation of proteoglycan biosynthesis removed: it is contradicted by loss-of-function data, and the phosphorylated linker is a transient intermediate. All 11 GO:0005515 rows removed (decorin is a substrate; the rest come from interactome screens). Golgi locations accepted; cytoplasm marked TOO_GENERAL. A new MF term for the linkage-region xylose 2-O-kinase (RHEA:19461) is proposed. Notes file created.
