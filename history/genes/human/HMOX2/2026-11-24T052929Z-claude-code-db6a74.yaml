  summary: 'Re-review of over-annotated IBA: plasma membrane rows kept as non-core'
  details: |
    Re-judged the GO:0005886 plasma membrane IBA (PTN007456885, PTHR10720) against the PAINT tree. Human HMOX2 is itself one of the three seeds (IDA, PMID:15528406; the others are rat Hmox2 and Candida albicans HMX1), and the abstract of PMID:15528406 reports HO-2 as part of the BK channel complex, enhancing channel activity. The earlier call rested on the location being peripheral to the ER membrane core, which is not a ground for over-annotation. The IBA row, the IDA row and the Reactome TAS row on this term were changed from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE, and the IBA propagation_review was updated to match. Only the abstract of PMID:15528406 is cached. Validated with just validate human HMOX2.
