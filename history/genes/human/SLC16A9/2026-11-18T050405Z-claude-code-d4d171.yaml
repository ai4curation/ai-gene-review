  summary: De-novo review of all 17 GOA annotations for SLC16A9 (MCT9), a creatine/carnitine
    transporter with urate GWAS link
  details: |
    Reviewed every GOA row for SLC16A9 (Q7RTY1, MCT9). Not a classical lactate carrier: experimentally an extracellular-pH- and Na+-sensitive low-affinity creatine transporter (Futagi 2020, PMID:31784090, Xenopus oocyte IDA) and an experimentally validated carnitine efflux transporter (Suhre 2011 Nature, PMID:21886157). SLC16A9 locus robustly GWAS-associated with serum urate/gout (PMID:19503597). Core MF GO:0005308 creatine TMT + GO:0015226 carnitine TMT at the plasma membrane. Actions (17): 9 ACCEPT (GO:0005308 IEA+IDA; GO:0015881 IEA+IDA; GO:0015226 IDA; GO:1902603 IDA; GO:0005886 PM IBA/IEA/IDA), 3 TOO_GENERAL (GO:1905039 entailed by GO:0015881; GO:0022857; GO:0055085), 3 REMOVE (bare GO:0005515 protein binding IPI x3, PMID:25416956), 1 KEEP_AS_NON_CORE (GO:0008028 monocarb-MF IBA: true family-level substrate-class term, creatine is_a monocarboxylate, non-core vs the specific creatine/carnitine activities), 1 MARK_AS_OVER_ANNOTATED (GO:0046415 urate metabolic process IMP; robust GWAS association, not demonstrated urate transport/metabolism -- participation-test fail). Creatine IDA kept with the caveat that Km (24-237 mM) is far above physiological creatine. propagation_review on IBA rows. source_defects: none. Addressed PR #6515 review (ai4c-reviewer). Batch 25.
