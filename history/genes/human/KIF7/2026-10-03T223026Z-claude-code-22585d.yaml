  summary: 'Create review: KIF7'
  details: |
    De-novo review of KIF7: all 29 GOA annotations reviewed, using falcon deep research (succeeded on the second 2400 s rerun) plus cached He 2014, Jiang 2019, Haque 2022, Yue 2022, Liem 2009, Endoh-Yamagami 2009, Cheung 2009 and Putoux 2011. KIF7 is a non-motile kinesin-4, so microtubule motor activity (IBA/IEA/IDA) was MODIFIED to microtubule plus-end binding. Microtubule-based movement and cytoskeleton-dependent transport were REMOVED (IBA rows have propagation_review: subactivity loss). GLI co-IP rows were modified to DNA-binding transcription factor binding (direct GLI2 zinc finger binding, Haque 2022); other protein binding rows were removed. NEW GO:0031115 negative regulation of microtubule polymerization (IDA, purified protein). Core functions: ciliary tip length control by plus-end growth inhibition, and dual Hedgehog regulation via GLI at the tip compartment. Consistent with module stage 6 and the HPA primary cilium/tip (Supported) calls. just validate: clean.
