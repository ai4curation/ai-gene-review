  summary: 'Create review: KIF7'
  details: |
    Reviewed all 29 seeded GOA annotations for human KIF7 (Q2M1P5): 13 ACCEPT, 11 MODIFY, 3 REMOVE, 2 KEEP_AS_NON_CORE, none left UNDECIDED. The pivotal evidence is that KIF7 is an immotile kinesin: purified protein binds microtubule plus ends but shows no detectable motility (PMID:24952464), and side-by-side kinesin-4 kinetics attribute the immotility of both KIF7 and Drosophila Cos2 to a failure to release ADP on microtubule binding (PMID:29351996). All three GO:0003777 microtubule motor activity rows were therefore MODIFIED to GO:0051010 microtubule plus-end binding and GO:0008017 microtubule binding; both GO:0007018 rows MODIFIED to GO:0031115 negative regulation of microtubule polymerization; GO:0030705 cytoskeleton-dependent intracellular transport REMOVED on the strength of the direct negative result that IFT rates and ciliary entry of Hh components are unaffected in Kif7 mutants. ATP binding and ATP hydrolysis were ACCEPTED, since hydrolysis is measured and is required for catastrophe promotion; what KIF7 lost is the coupling of hydrolysis to stepping. Of eight GO:0005515 rows, six were MODIFIED to GO:0030674 protein-macromolecule adaptor activity (GLI3, Gli1, Sufu, and three P4HA2 rows validated by PMID:38909089) and two REMOVED (SMO, NPHP1) as bare rows with no supported informative function. Two core functions recorded: ciliary-tip scaffolding of the GLI-SUFU complex (GO:0030674) and plus-end binding that limits axonemal microtubule growth (GO:0051010). Wrote KIF7-notes.md with inline verbatim citations and recorded why three candidate NEW terms were rejected on the comparator check. Added nine verified references to the cache and reference_review blocks for fifteen references. Confirmed the corrected PANTHER grounding PTHR24115:SF445 against panther-members.tsv; consistent with modules/hedgehog_signaling.yaml.
