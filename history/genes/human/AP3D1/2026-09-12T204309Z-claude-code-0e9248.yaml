  summary: 'Create review: AP3D1'
  details: |
    Full end-to-end review of human AP3D1 (delta-adaptin, O14617), the large delta subunit of the AP-3 adaptor complex: 64 rows (59 GOA-derived + 5 NEW) with ACCEPT 11, KEEP_AS_NON_CORE 38, MODIFY 5, MARK_AS_OVER_ANNOTATED 3, REMOVE 2, and propagation_review on all 42 propagated rows (10 IBA plus 32 IEA/ISS/IC with supporting_entities), 14 of them carrying 51 residue_claims. Key verdicts: PTHR22781 contains only AP-3 delta subunits (betas are PTHR11134, alpha/gamma/epsilon PTHR22780), so the ten IBAs cannot leak from another adaptin; they trace to ten IBD rows correctly split between a Eukaryota node PTN000513025 (complex, endosome membrane, vacuole targeting) and a Bilateria node PTN000513028 (all six neuronal terms), with every seed resolved to a real experimental annotation on a delta ortholog and the target's own accession legitimately present in the GO:0010008 WITH/FROM. Only GO:0006896 Golgi to vacuole transport is scoped wrong (the yeast ALP route does not transfer to mammals; MODIFY to GO:0008333). Two REMOVEs rest on positive arguments: GO:0010496 intercellular transport, whose ARBA rule fires on one unguarded AP3D1-specific FunFam while the term means between cells, and GO:1990742 microvesicle, whose GO definition is an extracellular vesicle while the mouse donor annotation concerns intracellular AP-3/BLOC-1 vesicles. The clathrin premise behind GO:0035654 fails on both subunit attribution (the clathrin contact is beta-3's) and function (clathrin is dispensable for AP-3 budding; AP3:ARF1 coats form without a clathrin lattice). Five NEW rows add the two missing subunit-level molecular functions, GO:0031267 small GTPase binding (delta is AP-3's primary ARF1 site) and GO:0000149 SNARE binding (the delta hinge binds the VAMP7 longin domain), plus GO:0006622 and the two degranulation terms. A reproducible uv bioinformatics project aligns the nine reviewed PTHR22781 members against four out-of-family adaptin large subunits with MAFFT, asserting all eleven published interface residues against O14617 before aligning, and a reconciliation script proves every GOA row maps to exactly one YAML entry with identical supporting_entities and that no source_entities id was introduced by hand. Validated with just validate (clean apart from one deliberately retained deep-research warning), checkquotes.py (131 quotes, 0 failures), gene_residue_claims (232 pass, 0 fail), duplicate-key and terms.csv checks.
