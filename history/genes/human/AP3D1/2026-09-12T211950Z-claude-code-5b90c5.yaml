  summary: 'Respond to review rounds 1-2: AP3D1'
  details: |
    Review-response session for PR 3020, superseding the tallies in the CREATE record for this gene, which describe the artifact as first pushed. Round 1 (two findings from ai4c-reviewer, both verified against the artifact before acting): core_functions[3], the entry arguing that delta holds AP-3 together, carried molecular_function GO:0000149 SNARE binding, which duplicated core_functions[1] and was supported by none of its own three quotes; it now carries GO:0005198 structural molecule activity ('the action of a molecule that contributes to the structural integrity of a complex') with contributes_to_molecular_function GO:0140312, and a sixth NEW row for GO:0005198 (IMP, PMID:26744459) makes that assertion traceable to an annotation. The MODIFY on GO:0140916 zinc ion import into lysosome was withdrawn to KEEP_AS_NON_CORE after confirming on the QuickGO ancestors endpoint that the proposed replacement GO:0061462 is an ancestor of GO:0006622, a NEW row added in the same file, so the substitution would have traded zinc-specific content for a parent the file already carried; GO has no zinc-preserving alternative for an upstream trafficking factor, and for a biological process involved_in tolerates indirect-but-required participation in a way a molecular-function term would not. The agent-versus-machinery observation is retained as a caveat in review.reason. Round 2 (one informational finding, treated as substantive): two supporting_text strings transliterated the Greek delta the papers print, 'delta-adaptin' for PMID:22521722's 'delta-adaptin' written with the Greek character and 'AP3delta' for PMID:26744459's equivalent; both passed checkquotes.py and the CI reference validator because both normalise before matching, which means a transliterated quote is accepted while ceasing to be findable in the paper by searching for it. Both restored, and goa_reconcile.py now runs a strict literal-substring test over every quote (whitespace normalised, citation markers stripped from the source only) which found exactly those two and nothing else. Final state of the artifact: 65 rows = 59 GOA-derived plus 6 NEW, with ACCEPT 11, KEEP_AS_NON_CORE 39, MODIFY 4, MARK_AS_OVER_ANNOTATED 3, REMOVE 2, NEW 6; propagation_review on all 42 propagated rows, 14 of them carrying 51 residue_claims; 47 references each with a reference_review; 135 supporting_text quotes. The ten IBA verdicts, both REMOVEs, the clathrin argument and the bioinformatics are unchanged from the CREATE session. Re-validated after each round with just validate (clean apart from one deliberately retained deep-research warning), checkquotes.py (135 quotes, 0 failures), gene_residue_claims (232 pass, 0 fail), goa_reconcile.py (PASS, including the new strict verbatim check), plus the duplicate-key and terms.csv checks.
