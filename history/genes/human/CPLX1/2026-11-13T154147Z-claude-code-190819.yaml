  summary: 'Create: CPLX1 gene review'
  details: |
    Reviewed all 47 GOA rows for human complexin-1 (O14810). Core function: SNARE binding (GO:0000149), directly involved in regulation of synaptic vesicle fusion to presynaptic active zone membrane (GO:0031630) and synaptic vesicle exocytosis (GO:0016079), in presynapse and cytosol, part of GO:0070032. Evidence: the human complexin-1/prefusion SNARE crystal structure papers (PMID:21785414, PMID:21785412; cached full text), the complexin discovery paper (PMID:7553862, abstract only), and the UniProt record and deep-research reports. The two protein-binding IPI rows were changed to SNARE binding with MODIFY. General terms (exocytosis, chemical synaptic transmission, neurotransmitter transport, regulation of exocytosis, modulation of chemical synaptic transmission, synapse, SNARE complex, protein-containing complex) were changed with MODIFY to specific terms the gene already carries; their ancestry was checked in QuickGO. Postsynaptic, synapse-type, soma and insulin-secretion rows are kept as non-core. The syntaxin-3 complexin complex rows (GO:0070554) were left UNDECIDED because their only support is ARBA and a TAS to a general review whose abstract does not mention complexin. There are no REMOVE or NEW rows. just validate is clean except for environment-variable warnings, and the quote check verified 73 quotes.
