  summary: Record OpenScientist analysis excluding ADAM10/17 and MT-MMPs as HEMO sheddases
  details: |
    Ran an OpenScientist deep-research job (kgap-hemo-shedding-protease) on the knowledge gap covering the protease responsible for HEMO ectodomain shedding. The run narrows the gap by excluding the leading candidates rather than by naming one, and the negative is well supported. The decisive measurement is a distance: the mapped Gln432-Arg433 bond sits 57 residues N-terminal to the first transmembrane residue, whereas every ADAM10 or ADAM17 cleavage site annotated in human UniProt lies 11 to 26 residues out. The 56 residues retained on the cell are not a flexible stalk but the gammaretroviral transmembrane-subunit core, disulfide-clamped by a CX6CC motif at 437-445 and heptad-patterned, with a single proline in 43 residues. Since ADAM10 and ADAM17 position cleavage by measuring distance along an extended juxtamembrane segment, the sequence positively disfavours those families and the membrane-type MMPs, while leaving the class-level metalloproteinase attribution from PMID:28739914 intact.

    Supporting negatives: the P4-P4 prime octamer PTTQ-RQTA matches zero subsites across seven protease families scored, there is no furin R-X-[KR]-R motif anywhere in the chain, and the invariance of Thr430-Thr431-Gln432-Arg433-Gln434 across orthologs is attributable to the adjacent CX6CC motif defining the Env transmembrane fold rather than to selection on a protease recognition site. BACE2, the one protease with demonstrated physical engagement of HEMO, is stated by its discoverers not to be the sheddase.

    Verification against the local Q9H9K5 record confirms the topology, the scissile bond, the exact 56-residue retained stub sequence, the CX6CC motif, the P4-P4 prime octamer, both the DHVLDIPTTQ and KDHVLDIPTTQR peptides, and the absence of a furin motif. One small error is recorded: the run names the first transmembrane residue as Leu489 where the local sequence has Ser489. The position, and therefore the 57-residue distance and every conclusion drawn from it, are unaffected.

    Status moved from OPEN to NARROWING. The run also proposes a discriminating test that needs no new wet work, a semi-tryptic reanalysis of deposited raw files for the neo-C-terminal peptide DHVLDIPTTQ, noting that the region is demonstrably accessible because the bond-spanning tryptic peptide has been detected, and that the peptide's absence from current searches is a search-space artefact carrying no evidence either way. No annotation action was taken; the core function already describes the shedding as metalloproteinase-mediated at the class level, which this analysis supports rather than changes.
