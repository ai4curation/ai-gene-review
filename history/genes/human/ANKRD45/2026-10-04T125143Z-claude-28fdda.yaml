  summary: 'Initial review of human ANKRD45: midbody-ring and cleavage-furrow protein;
    locations accepted, proliferation kept as non-core'
  details: |
    12 GOA rows. All location rows accepted (midbody IBA seeded by ANKRD45 itself). Cell population proliferation (IBA, IMP) kept as non-core because the evidence is apoptosis after loss, not a measured proliferation defect. MAGEA2B Y2H binding removed; MF ND accepted. Recorded as an MF_DARK knowledge gap.
