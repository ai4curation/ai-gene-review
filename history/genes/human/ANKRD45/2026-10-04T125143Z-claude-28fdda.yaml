  summary: 'Reviewer round 2: correct the proliferation reasons, which wrongly said no proliferation defect was measured; description adds the G0/G1 delay and reduced BrdU'
  details: |
    PMID:31208154 measures proliferation directly (CCK-8, BrdU, G0/G1 accumulation) and shows division defects by time-lapse. The GO:0008283 rows stay KEEP_AS_NON_CORE, now justified as a population-level outcome confounded by apoptosis, with the zebrafish no-defect statement quoted. The description adds the proliferation and cell-cycle phenotype, and the knowledge gap now centres on the midbody-localization versus G0/G1-delay mismatch.
