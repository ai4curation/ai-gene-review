  summary: 'Create review: AP4M1'
  details: |
    Full review of human AP4M1 (mu4-adaptin, O00189, PANTHER PTHR10529). 53 GOA rows seeded 52 entries (two GO:0005515 IPI PMID:32073997 rows differing only in DATE collapse into one); 2 NEW rows added, 54 total. Actions: 23 ACCEPT, 14 KEEP_AS_NON_CORE, 7 MARK_AS_OVER_ANNOTATED, 4 MODIFY, 4 REMOVE, 2 NEW. Central finding: the GO:0035615 clathrin-cargo adaptor activity IBA is placed on the pan-mu ancestral node PTN000055849 and seeded exclusively by AP-1 and AP-2 mu subunits, while AP-4 is a non-clathrin TGN export coat, so it is MODIFY to GO:0140312 with root_cause PROPAGATION_BAD and failure mode COMPARTMENT_OR_COMPLEX_MISMATCH. The other four IBAs sit at the AP-4 mu node PTN000242612 or at nodes seeded by AP-4 subunits including AP4M1 itself and are NO_FAILURE_CORE or NO_FAILURE_NON_CORE. Four REMOVEs: GO:0030131 clathrin adaptor complex (interpro2go over-call contradicted by immunogold EM and by GO placing AP-4 outside that branch), GO:0008320 and GO:0071806 (a coat adaptor is not a translocase), GO:0031904 endosome lumen (the adaptor is not inside its cargo compartment). Two NEW rows: GO:0031267 small GTPase binding from the direct nucleotide-independent mu4-ARF1 interaction (PMID:11707398), and GO:0030120 vesicle coat. propagation_review with scripted source_entities on all 18 IBA/ISS/IEA rows that carry supporting_entities; reference_review on all 37 references. Three reproducible bioinformatics analyses fetch live from UniProt: the mu4 cargo-site conservation test (which returns the negative result that F255 is family-wide and so carries no mu4-specific information), an ARBA rule reproducibility test (the cytoplasm rule does not reproduce; the two trafficking rules do), and a GOA-to-YAML reconciliation. Validated with just validate (valid, 1 deliberate warning), checkquotes (116 quotes, 0 failures), gene_residue_claims (82 pass, 0 fail) and the reconciliation script (0 errors).
