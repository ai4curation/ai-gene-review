  summary: Correct and narrow the AP4M1/ATG9A sorting-signal knowledge gap via an
    OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on the ATG9A signal read by mu4. It identified YQRLE (8-12) as the sole candidate; the cached ATG9A UniProt record confirms this is an experimentally mapped motif (MOTIF 8..11, ECO:0000269 PMID:29180427, mutagenesis of Y8-E12), so the gap's claim that the motif was unpublished was corrected. Open question: canonical vs noncanonical mu4 site (canonical favoured: no aromatic +3; Arg283 not conserved). Gap OPEN -> NARROWING.
