  summary: Refine DKC1 snoRNA-guided reaction scope and reference attribution
  details: |
    Refined broad rRNA-pseudouridylation annotations to the supported snoRNA-guided target mechanism while preserving valid PAINT ancestry and mammalian rule support. Corrected PMID:15240872 to mutation-specific mouse embryonic stem-cell evidence and distinguished the yeast RNP reconstitution in PMID:22085967. Replaced generic Reactome findings with nine event-specific explanations that retain dyskerin's RNA-associated or pseudouridylation role without assigning TERT polymerization to DKC1. Added explanatory typed ontology paths and structured propagation metadata. Preserved all 89 imported source records, 54 references, two products, two core functions, existing quotations and the complete prior notes prefix. Independent evidence review and saved artifact verification passed; normal validation, term checks, status inspection, rendering and history validation were run in the publication checkout.
