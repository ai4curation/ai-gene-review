  summary: 'Create review: CD4'
  details: |
    Created the CD4 gene review from the fetched stub for the ADAPTIVE_IMMUNITY T cell receptor trunk: all 161 GOA rows actioned (76 ACCEPT, 33 KEEP_AS_NON_CORE, 21 MODIFY, 18 REMOVE, 8 MARK_AS_OVER_ANNOTATED, 5 UNDECIDED) plus one NEW row for the immunological synapse. The 21 generic protein-binding rows were replaced with virus receptor activity (gp120), MHC class II protein complex binding (HLA-DR) or protein tyrosine kinase binding (LCK), or removed where only an uninformative interaction was reported, including the Nef/Vpu rows where CD4 is the host target. Core functions are MHC class II protein complex binding, protein tyrosine kinase binding (the LCK zinc clasp) and coreceptor activity, matching the T cell receptor signaling GO-CAM and the GO:0042609 CD4 receptor binding row on LCK. Virus-receptor and viral-entry terms are kept non-core; knockout and transgenic phenotype processes are kept non-core; the IL-16 binding/receptor rows and the IL-15 and GM-CSF rows cited to an abstract-only paper are left UNDECIDED. The Falcon deep research report was generated for this review and integrated afterwards: it added the CD4-CD3 FRET macrocomplex, microvillar-tip localization, the short LCK-binding isoform 2, the 2024 inherited CD4 deficiency cohort and macrophage recycling, each traced to a primary paper that was cached and quoted verbatim; it changed no annotation action. Notes record the adopted and rejected claims. just validate human CD4 passes with 0 errors and 0 warnings.
