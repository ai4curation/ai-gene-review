  summary: 'Create: VAMP2 GO annotation review (171 rows)'
  details: |
    First full review of the 171 GOA rows for human VAMP2 (synaptobrevin-2, P63027).

    Core: two core functions, helical-bundle zippering fusogenic activity (GO:0005484) and syntaxin-1 binding (GO:0017075), involved in vesicle fusion, synaptic vesicle exocytosis, calcium-ion regulated exocytosis and SNARE complex assembly, located on the synaptic vesicle membrane and the plasma membrane, in the SNARE complex. Human-specific functional support comes from the de novo variant study with its reconstituted lipid-mixing assay; most other rows rest on ISS from the rat and mouse orthologues, on the synaptobrevin PAINT node, or on Reactome.

    The 42 bare protein binding rows were removed as uninformative, with two modified to syntaxin-1 binding where the paper names a syntaxin partner. Regulation-flavoured terms (regulation of exocytosis, regulation of vesicle-mediated transport, positive regulation of intracellular protein transport) and response to glucose were marked over-annotated: VAMP2 is the fusion machinery rather than a modulator of it. Cytosol rows were marked over-annotated for a tail-anchored protein, as was voltage-gated potassium channel complex membership (the modulatory KCNB1 claim is kept separately). Reactome's clathrin-sculpted transmitter-loading vesicle membranes sit under clathrin-coated vesicle membrane rather than synaptic vesicle membrane and were kept as non-core retrieval-compartment locations, alongside the CALM-dependent endocytic rows. All four NOT rows (neutrophil, natural killer, mucus and mast cell secretion) were accepted as supported; the positive eosinophil row survives as non-core. The NOT secretory granule membrane row carries a consistency_exception because the negative is granulocyte-specific while the neuroendocrine granule pool is real.

    No row left UNDECIDED. Validation clean (one warning about mixed actions on the exception term); all quotes verified.
