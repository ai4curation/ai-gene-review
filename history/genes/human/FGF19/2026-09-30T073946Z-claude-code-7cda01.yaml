  summary: Complete AI review of human FGF19 GO annotations
  details: |
    Reviewed all 68 existing GOA annotations (no PENDING) plus one NEW. Core function: FGF19 is a secreted endocrine FGFR ligand (GO:0005104) that, with beta-Klotho co-receptor, activates FGFR4 signaling to repress CYP7A1/bile acid synthesis (GO:0008543, GO:0070858) and drives insulin-independent hepatic glycogen synthesis (NEW GO:0045725, Kir 2011). REMOVE: cytoplasm IBA (secreted protein; over-propagated from intracellular FGFs) and response to ethanol IEA (rat expression transfer). MODIFY: protein binding->GO:0005102 signaling receptor binding (KLB/KL partners); negative regulation of gene expression->GO:0070858. MARK_AS_OVER_ANNOTATED nervous system development TAS. KEEP_AS_NON_CORE for proliferation, glucose uptake, JNK (contested), growth factor activity, neurogenesis, migration. Aligns with FGFR signaling module.
