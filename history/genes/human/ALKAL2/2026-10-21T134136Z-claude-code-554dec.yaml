  summary: 'Create review: ALKAL2 (human, Q6UX46)'
  details: |
    De-novo review of human ALKAL2 as the experimental reference for the donkey ALKAL2 ortholog (PTHR28676:SF2), done independently of ProtNLM2 predictions. Deep research failed (falcon auth error, perplexity quota), so the review uses cached primary literature. 51 GOA rows reviewed: cytokine activity, RTK binding, RTK signaling and extracellular region accepted; GO:0030298 changed to GO:0030297 on all 6 rows (sibling term; the old wording refers to cytoplasmic downstream kinases, but ALK/LTK are transmembrane RTKs); protein binding with ALK changed to receptor tyrosine kinase binding; plasma membrane changed to external side of plasma membrane; ERK1/2, ERK5 and neurite outgrowth regulation kept as non-core. Added PMID:26630010, PMID:33411331, PMID:25331893 and the UniProt file as references.
