  summary: Incorporate recovered pexophagy report with independent primary checks
  details: |
    The shared PIK3C3 report supplied useful complex context but did not settle WIPI paralog usage. A primary search identified PMID:37621214, whose full Fig. EV3B directly measures Keima-SKL pexophagy in HeLa cells and finds complete blockade in WIPI2 knockout after phenanthroline. The IBA is retained as noncore with direct target corroboration. The same paper describes context-dependent initiation order; it does not establish universal dependence on upstream ULK1/VPS34 in every selective-autophagy route. Nucleophagy and glycophagy remain separately unresolved. Original source assertion fields preserved; no new provider request.
