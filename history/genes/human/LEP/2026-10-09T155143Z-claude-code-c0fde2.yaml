  summary: Full review of human LEP
  details: |
    Created the LEP review from just fetch-gene stubs (136 GOA annotations). Every annotation has an action, reason and supported_by quotes validated against cached publications, UniProt P41159 or Reactome. Core functions: hormone activity / leptin receptor binding, leptin-mediated signaling pathway, negative regulation of appetite by leptin-mediated signaling pathway, energy homeostasis; extracellular region. Peripheral immune, angiogenic, reproductive and bone effects kept as non-core; ortholog-transferred response-to-stimulus terms marked over-annotated as expression regulation; cytosol and DNA binding removed; screen-derived protein binding removed and LEPR protein binding modified to leptin receptor binding. Two IDA annotations from PMID:17957153 left UNDECIDED (abstract does not support them, full text not cached). A first Falcon deep-research run timed out; a retry completed after drafting, is consistent with the review, and is cited in core_functions. Literature work recorded in LEP-notes.md. Aligned with the dismech Congenital_Leptin_Deficiency node (GO:0005179 hormone activity, GO:0033210 leptin-mediated signaling pathway). just validate human LEP passes.
