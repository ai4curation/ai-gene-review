  summary: 'KRTAP family review: human KRTAP29-1'
  details: |
    SIRH-adjacent hair keratin-associated protein (KAP) family batch review. KAPs treated as structural matrix proteins of the keratinizing hair/wool cortex or cuticle. Family-level calls: bare GO:0005515 protein binding from HuRI/Y2H screens removed per policy; GO:0005198 structural molecule activity refined (MODIFY) to GO:0030281 structural constituent of cutaneous appendage, or proposed NEW where absent; GO:0045095 keratin filament accepted as location; GO:0031424 keratinization as the process; GO:0005829 cytosol kept non-core (synthesized in cytoplasm, acts in the keratin matrix). Core function per gene is a cutaneous-appendage structural constituent in the keratin filament matrix, involved in keratinization, with an UBERON hair site. No established human disease association was found for any KAP; sheep/goat ortholog wool-trait associations recorded as context only. OpenScientist deep research used as leads where available and verified against primary papers.
