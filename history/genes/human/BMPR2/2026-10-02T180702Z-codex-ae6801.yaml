  summary: Create evidence-reviewed human BMPR2 annotation review
  details: |
    Applied the exact independently reviewed BMPR2 YAML and manual notes. All 152
    source annotation objects, four NOT qualifiers, original partner fields and
    two named alternative products are preserved. Decisions are 39 ACCEPT,
    66 KEEP_AS_NON_CORE, nine MODIFY and 38 UNDECIDED, with no new annotation
    rows or removals. One BMP receptor core combines ligand recognition and
    type-II-to-type-I receptor phosphorylation upstream of R-SMAD activation.
    References distinguish directly inspected experiments, abstract-only access,
    supplemental artifact readings and unresolved donor contexts. Supported
    generic-binding rows remain non-core under the user's explicit ClinGen-task
    instruction; this is not a change to repository-wide review policy.

    The scientific owner and an independent reviewer approved the exact candidate
    before application. Normal applied validation passed with seven disclosed
    warnings: four retained generic-binding rows, one missing structured PAINT
    propagation review, one evidence-specific SMAD action difference, and the
    current GO:0043235 label differing from the local ontology-cache label.
    No source caches or machine-derived files were changed. The normal research
    provider and fallback produced no research output; manual notes are named
    honestly and no provider-labelled file was authored.
