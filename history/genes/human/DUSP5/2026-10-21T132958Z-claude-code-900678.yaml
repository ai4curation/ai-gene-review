  summary: 'Create review: DUSP5 (Q16690), SF40 reference for donkey DUSP5'
  details: |
    De-novo review of human DUSP5 as the experimentally characterised PTHR10159:SF40 relative of donkey DUSP5 (A0A8C4MED2), independent of ProtNLM2 predictions. Deep research failed (falcon 403 auth, perplexity 401 quota); review built from cached literature (PMID:7961985, 15713638, 19666109, 39749114, 25519881, 27739308, 25489104, 28053233). Core: ERK1/2-selective MAP kinase Tyr/Ser/Thr phosphatase (GO:0017017) acting in the nucleus in negative regulation of ERK1/2 cascade (GO:0070373), plus KIM-mediated MAPK binding that anchors ERK2 in the nucleus. General MF/BP rows modified to these terms; MAPK cascade/ERK cascade TAS rows modified to the negative-regulation term; endoderm formation IBA removed (only donor a zebrafish dusp4 morpholino); cytoplasm IBA marked over-annotated (DUSP5 is nuclear); 18 PDZ fragmentomics protein-binding rows removed, MAPK1 IPI modified to GO:0051019.
