  details: |
    Four bracketed quotes in MIF-notes.md presented as verbatim were not in the cached sources (PMID:19454686, PMID:12782713, PMID:17045821, PMID:21817065). Each was replaced with an exact quote supporting the statement, checked with whitespace normalisation against publications/PMID_*.md and MIF-uniprot.txt. Claims the cited papers do not make were removed or corrected: ABCA1-dependent export (not in PMID:19454686), PKA-dependent phosphorylation (not in the PMID:17045821 abstract, the only cached text), and a D-DT Kd of 1.07e-8 M (the paper reports 5.42e-9 M for D-DT and 1.40e-9 M for MIF). The catalytic-site statement is now sourced to UniProt FT/CC lines instead of an unrelated intestinal tumorigenesis paper, and the CXCR2 statement carries quotes from PMID:19602265 and PMID:20534506. The review YAML was not changed.
