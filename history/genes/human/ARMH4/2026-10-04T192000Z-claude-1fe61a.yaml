  summary: 'Initial review of human ARMH4 (UT2): transmembrane inhibitor of mTORC2
    and inflammatory signalling'
  details: |
    6 GOA rows. Membrane and TORC2 complex binding (ISS from mouse UT2) accepted; regulation of inflammatory response and regulation of TORC2 signaling modified to the negative-regulation terms; ELAPOR2 binding removed. Propagation reviews on the mouse ISS rows.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - core_functions
  summary: 'Review round 1: annotate the GP130/STAT3 axis; kinase inhibitor MF'
  details: |
    Added NEW cytokine receptor binding (IPI, IL6ST) and negative regulation of receptor signaling pathway via JAK-STAT (IDA), both PMID:26927669, plus a second core function; the earlier species-based decline was contradicted by UniProt's ECO:0000269 curation. Added NEW protein serine/threonine kinase inhibitor activity (ISO from mouse UT2, PMID:25418727) as the mTORC2 core MF.
- type: EDIT
  outcome: changed
  sections:
  - description
  - existing_annotations
  - core_functions
  - references
  summary: 'Address PR #4201 round 2: annotate IGF1R/FGFR1 binding and plasma membrane'
  details: |
    Added NEW IPI GO:0070851 growth factor receptor binding (PMID:41390521: HEK293 co-IP, endogenous IP from heart, 611-621 ectodomain mapping) and NEW IDA GO:0005886 plasma membrane (immunofluorescence), each with core-function entries. The aging phenotype is deliberately not annotated. TORC2 complex binding now has its own core entry, resolving the two-core-MF wording. Added a PMID:36220098 finding (cytoplasmic domain, endocytosis), recorded PMID:31655130 in the affinage reference_review, and removed the temporal framing from the description.
