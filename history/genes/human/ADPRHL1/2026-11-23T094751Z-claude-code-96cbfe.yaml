  summary: Narrow the ADPRHL1 localization knowledge gap with an OpenScientist run
  details: |
    Ran OpenScientist (3 iterations) on whether ADPRHL1 carries any targeting signal. None was found: no SP/TM/NLS/NES and no mitochondrial presequence (no pre-core extension in 371 vertebrate orthologs, unlike ARH3; the N-terminal helix is buried). Consistent with a soluble cytoplasmic/sarcomeric protein. Gap OPEN -> NARROWING; endogenous imaging is still needed.
