  details: |
    Created full curated review for human ABI1 (Q8IZP0, PTHR10460:SF2; 78 GOA annotations) harmonized with the PTHR10460 family review, mouse/rat Abi1 orthologs, and pre-existing ABI2/ABI3 paralog reviews across all three core molecular functions—GO:0035591 (WRC subunit and C-terminal SH3 scaffolding of SOS1 and rodent-characterized ProSAP2/Shank3), GO:0017124 (polyproline/PxxDY binding to partner SH3 domains of EPS8, NCK1, ABL1, SPTA1, and TOCA-1/FNBP1L backed by direct PMID:19798448 TOCA-1 SH3 binding quotes and deduplicated core_functions support), and GO:0030296 (c-Abl tyrosine kinase co-activation)—and cytosol/leading-edge compartments. Evaluated Affinage deep research (ABI1-deep-research-affinage.md) with structured reference_review and source_defects documenting an Arabidopsis thaliana ABI1 PP2C homonym collision (PMID:38683723) and domain/residue numbering issues.
