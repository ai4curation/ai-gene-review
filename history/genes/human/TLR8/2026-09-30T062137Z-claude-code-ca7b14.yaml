  summary: 'Create review: TLR8'
  details: |
    Reviewed all 54 seeded GOA annotations for human TLR8 (Q9NR97): 32 ACCEPT, 8 MODIFY, 5 KEEP_AS_NON_CORE, 4 MARK_AS_OVER_ANNOTATED, 4 REMOVE, 1 UNDECIDED. Wrote a standalone description of TLR8 as the dominant nucleic-acid-sensing TLR of human myeloid cells, a Z-loop-cleaved pre-formed dimer that senses RNase T2 degradation products at two sites (uridine at the protomer interface, a short oligonucleotide on the concave LRR face), plus two core functions (pattern recognition receptor activity, single-stranded RNA binding). Key decisions, kept consistent with the TLR7 review done in the same session: the localisation rows were re-based on PMID:22164301, which shows endogenous TLR8 in the early endosome and ER but explicitly not in late endosome, lysosome or Golgi, so the two endolysosome-membrane rows were MODIFYed to GO:0031901 early endosome membrane and the two Reactome Golgi rows marked over-annotated, while endosome membrane and ER membrane rows were accepted; GO:0009897 external side of plasma membrane (IDA, PMID:24942581) was REMOVEd after retrieving that paper's open full text, which measures TLR8 by intracellular staining and calls it intracellular, though its other two TLR8 rows were accepted because the same full text does assay TLR8 with ssRNA40; both GO:0003725 dsRNA-binding rows MODIFYed to ssRNA binding since PMID:33718825 used GU-rich ssRNA only; GO:0003723 RNA binding and GO:0038023 signaling receptor activity MODIFYed to the informative ssRNA binding and pattern recognition receptor activity; GO:0009615 response to virus MODIFYed to GO:0051607; GO:0003677 DNA binding marked over-annotated and GO:0016064 immunoglobulin mediated immune response REMOVEd as unsupported by the regulatory T cell paper cited for both; the two UNC93B1 protein-binding IPIs removed as uninformative; GO:0032729 type II interferon handled as in TLR9 (IDA MODIFYed to GO:0034346, ARBA row over-annotated); GO:0071260 left UNDECIDED with its reference flagged as a wrong identifier. The Falcon deep research file was read but cites internal handles rather than PMIDs, so every claim is anchored to a cached publication. just validate human TLR8 passes with two warnings (the deliberate GO:0032729 action split and the unreferenced deep-research file); all supporting_text quotes verified verbatim.
