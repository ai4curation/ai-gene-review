  summary: 'Create review: LGR5'
  details: |
    New review of the 31 GOA annotations for LGR5, the R-spondin receptor that potentiates canonical Wnt signaling in adult stem cells. Accepted transmembrane signaling receptor activity, plasma membrane and trans-Golgi network membrane localization, and positive regulation of canonical Wnt signaling; removed G protein-coupled receptor activity and GPCR signaling (explicitly contradicted: LGR5 does not couple to G proteins or beta-arrestin); refined protein-hormone receptor activity, generic membrane, Golgi and protein-binding (R-spondin) terms to the receptor and TGN terms. Localization is plasma membrane (ectodomain exposed) but constitutively internalized, so mostly intracellular. Deep research providers were unavailable; notes from literature and UniProt.
