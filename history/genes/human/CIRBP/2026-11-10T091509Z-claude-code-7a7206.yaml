  summary: Re-read the two overruled splicing IBA rows against the PANTHER tree; node
    and seed identities corrected
  details: |
    Verdicts unchanged: GO:0000398 (mRNA splicing, via spliceosome) and GO:0005681 (spliceosomal complex), both IBA at PTN000391532, stay overruled. Two errors in the reasons are corrected from the PANTHER 19.0 tree and its leaf ids. (1) PTN008729690 was called CIRBP's own subfamily node; it is the PTHR48034 family root. The branch CIRBP shares with RBM3 is PTN008483167 (Euteleostomi). (2) The seeds RGD:1565256 and RGD:1306751 were called rat Tra2; the PANTHER leaf ids resolve them to rat Rbmx (Q4V898) and rat Rbmxrtl (P84586). The reasons now state what the tree shows: PTN000391532 is a speciation node at Eukaryota one step below the root covering 373 of 405 leaves, every seed sits in one branch below it and none in the CIRBP/RBM3 branch, and by the tree the seeds are paralogs of CIRBP (one fly tra2 ortholog across later duplications for GO:0000398). Both rows gained a propagation_review block (PROPAGATION_BAD; WRONG_ORTHOLOG_OR_PARALOG, FUNCTIONAL_DIVERGENCE) and quote CIRBP-phylo.yaml (generated by just phylo human CIRBP). Checked with just validate human CIRBP: valid, no tree-evidence warning.
