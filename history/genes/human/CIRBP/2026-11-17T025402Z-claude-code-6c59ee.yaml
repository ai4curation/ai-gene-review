  summary: State the adverse tree facts in the two overruled splicing IBA rows
  details: |
    After review of the pull request. The reasons of GO:0000398 and GO:0005681 (both MARK_AS_OVER_ANNOTATED) said that the seeds "all sit in one branch below" the PAINT node PTN000391532 and that "CIRBP's own branch (PTN008483167) holds none of them". The two uses of "branch" are nodes 14 steps apart, and the quotes took the sentences of the extract on either side of the one that says "CIRBP is inside that clade".

    Both reasons now state what the extract and the PANTHER 19.0 tree say at the node's own level: every seed lies in the same branch below the node as CIRBP (PTN000391533, Unikonts), and CIRBP is inside the clade the seeds span. They then make the argument the verdict rests on: a duplication separates CIRBP from each seed (rat Rbmx, rat Rbmxrtl and human RBMX at PTN009224850; TRA2A and TRA2B at PTN004472736; fly tra2 at the Bilateria speciation with four duplications and a horizontal-transfer node between), no seed lies in the clade that holds CIRBP and RBM3 (PTN008483167, 45 leaves; checked against the release tree), and CIRBP has no experimental splicing evidence.

    - supported_by: each row now quotes sentences 1-2 and 4-6 of its extract summary, including "CIRBP is inside that clade".
    - propagation_review.source_entities: the note on PANTHER:PTN000391532 says the same.
    - The sentences recording an earlier correction ("An earlier version of this reason ...") are out of the reasons; that correction is in CIRBP-notes.md and in record 2026-11-10T091509Z-claude-code-7a7206.
    - The extract was regenerated on 2026-11-16: fly tra2 is an ortholog across horizontal-transfer nodes, where it was listed as across later duplications.
    - CIRBP-notes.md has a section on the tree placement of the two rows.

    Verdicts are unchanged.
