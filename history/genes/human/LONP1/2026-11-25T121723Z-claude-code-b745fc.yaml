  summary: Record OpenScientist electrostatic analysis separating LONP1 nucleic-acid
    binding from the substrate path
  details: |
    Ran an OpenScientist deep-research job (kgap-lonp1-nucleic-acid-site) on the knowledge gap covering the causal role of LONP1 nucleic-acid binding. The run settles the separability question with a number and is explicit that the site assignment itself remains a lead.

    The strongest basic patch on the hexamer is on an outer surface at the apex of the N-terminal substrate-recognition domain, recurring on all six protomers, with the contiguous Arg154-Arg155-Lys156-x-Arg158 motif at its centre. That motif, every patch residue the run names, the catalytic Ser855 and the pore-loop Tyr565 were all confirmed in the local P36776 record, where the patch residues fall inside the annotated 124-370 domain. The patch centroid sits 107.1 Angstrom from the nearest catalytic serine and 77.2 Angstrom from the pore loop, so a nucleic-acid contact there and the substrate-translocation path through the axial channel are structurally separable.

    The axial channel is not a positively charged conduit: its mean surface potential is slightly negative, as is the AAA+ ring band, and the single positive patch inside it sits at the distal product-exit face of the proteolytic ring, 164 Angstrom along the axis from the N-terminal patch, so an intact strand could not reach it without threading the entire channel. It is also the worst-conserved candidate across vertebrates, and the run recommends dropping it as a recruitment site.

    The site assignment is weaker than the geometry, and the run supplies the checks that limit it rather than leaving them to the reader. The only experimentally mapped Lon DNA-binding residues, from a bacterial Lon, align to human positions that are not basic and sit at negative or near-neutral potential. The comparative control is decisive: if electropositivity picked out DNA-binding Lon proteins, human LONP1 should resemble E. coli LonA, and instead its global surface is closer to an archaeal LonB with no reported DNA binding, which removes any purely electrostatic argument. And no experiment has ever localised the site on the human protein, since the defining mutant was both ATPase-dead and protease-dead while still binding nucleic acid, proving separability from catalysis without placing a residue.

    Status moved from OPEN to NARROWING. The run names Arg154, Arg155, Lys156 and Arg158 as the quadruple alanine substitution that would test the assignment without disabling proteolysis, 107 Angstrom from the catalytic dyad, basic-retained in 97 per cent of vertebrates and carrying no annotated disease allele. The boundary records the run's own framing, that this is a computational lead with a named experiment and never evidence for a binding site. The electrostatic calculations, patch areas, inter-site distances, bacterial alignment and conservation figures were not independently recomputed. No annotation action was taken.
