  summary: Full re-review of NARF J3KS48 (ProtNLM2 benchmark, independent of predictions)
  details: |
    Re-reviewed the single GOA annotation (GO:0005634 nucleus, IEA SubCell): changed UNDECIDED to ACCEPT, because nuclear localization is experimental for the NARF gene product (PMID:10514485, PMID:36490339) and the NARF subfamily PTHR11615:SF124 is placed at the nuclear lamina by PAINT node PTN002614243; refinement to lamina terms was declined because J3KS48 lacks reference residues 129-173 and 259-456. Rewrote the description and notes to drop ProtNLM-derived content; added Yang 2022 (PMID:36490339) on the OCT4/KDM6A coactivator role; added a core function (nucleus only) and suggested experiments. Rewired the bioinformatics script to read J3KS48 from the UniProt flat file instead of the ProtNLM source JSON and added cysteine mapping (C172, C374, C378 lost). Recorded PANTHER subfamily placements (NARF SF124, NARFL/CIAO3 SF322); no CIA/Fe-S function transferred from the paralog (PMID:18270200).
