  details: |
    PR shepherd response to the CHANGES_REQUESTED review on PR #3344.

    Item 4: GO:0045738 negative regulation of DNA repair (IEA) was action ACCEPT while its own
    reason said 'Retain as non-core-level regulatory function', and the specific child GO:2000042
    is KEEP_AS_NON_CORE. Changed to KEEP_AS_NON_CORE so the broad IEA does not outrank the
    specific experimental term in the core set.

    Item 5: the GO:0071360 cellular response to exogenous dsRNA propagation_review asserted
    source_status SUPPORTS_SOURCE_BUT_NOT_TARGET for MGI:MGI:2442261 while its comment said the
    dsRNA term is not a demonstrated cGAS function in mouse either. Set root_cause and both
    source_status values to SOURCE_BAD, dropped WRONG_ORTHOLOG_OR_PARALOG from failure_modes
    (FUNCTIONAL_DIVERGENCE covers an IBD node-placement problem), and corrected the reason prose:
    interpro/panther/PTHR10656/PTHR10656-paint.tsv line 18 shows the PTN002579681 IBD for
    GO:0071360 is seeded only by MGI:MGI:2442261, not by RNA-sensing invertebrate cGLRs, so the
    previous 'over-propagation from cGLRs' explanation was not supported by the PAINT data. This
    matches the independently-curated HETGA Cgas treatment of the same propagation.

    Item 1: status IN_PROGRESS was unreachable from compute_status_from_data (no PENDING
    annotations); set to COMPLETE, the value the tool computes. Validated with just validate.
