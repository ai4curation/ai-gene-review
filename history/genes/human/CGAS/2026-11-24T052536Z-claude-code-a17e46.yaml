  summary: 'Re-review of over-annotated IBA: dsRNA response row removed'
  details: |
    Re-judged the GO:0071360 cellular response to exogenous dsRNA IBA (PTN002579681, PTHR10656) against the PAINT tree. The IBD has one seed, mouse Cgas, whose rows (IMP PMID:23258413 and three IDA rows) come from papers on the cytosolic DNA response. PMID:23258413, read in full, reports that cGAS knockdown did not affect IRF3 activation by Sendai virus and that biotinylated RNA did not bind cGAS. The seed carries the wrong stimulus term (dsRNA for dsDNA), so the IBA row and the Ensembl Compara IEA row on the same term were changed from MARK_AS_OVER_ANNOTATED to REMOVE. Suggested PAINT fix: remove the IBD at PTN002579681 and correct the mouse source rows. Validated with just validate human CGAS.
