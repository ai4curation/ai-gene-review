events:
- type: CREATE
  outcome: changed
  summary: 'Review human AHI1 (Jouberin): species-mismatched experimental codes, a
    ComplexPortal process projection, and the Wnt axis GO has never annotated'
  details: |
    Full review of all 37 GOA rows for human AHI1 (Q8N157, Jouberin), plus 3 NEW
    proposals. Row counts reconcile exactly: GOA TSV 37 data rows, QuickGO 37
    annotations, existing_annotations 37 reviewed + 3 NEW. The fetch-gene stub did not
    under-seed this gene - all five GO:0005515 rows arrived one-per-partner.

    Actions: 9 ACCEPT, 21 KEEP_AS_NON_CORE, 1 MODIFY, 6 MARK_AS_OVER_ANNOTATED, 3 NEW.
    No REMOVE.

    Three findings drove the review.

    1. Experimental evidence codes attached to non-human experiments, in the shipped
       GOA. GO:0060271 cilium assembly carries IMP from PMID:21959375, a paper whose
       only systems are zebrafish morpholinos and siRNA against MOUSE Ahi1 in mouse
       IMCD3 cells. The tell that this is a defect rather than a judgement call: QuickGO
       by reference shows the same curator gave GO:0034329 from the same paper to mouse
       Ahi1 alone, while GO:0060271 went to mouse and human. GOA also already carries
       the species-correct encoding as a GO:0060271 ISS row from UniProtKB:Q8K3E5.
       Human evidence for the term exists in a different paper (PMID:23532844, Joubert
       patient fibroblasts). Term ACCEPTed, defect reported. PMID:18633336 supplies five
       human IDA rows from mouse mIMCD3 and canine MDCK cells - stated explicitly in its
       abstract, which is the only case where an organism caveat is safe from an
       abstract-only record.

    2. Complex-to-subunit projection of a process term. PMID:22179047 supplies
       GO:1904491 protein localization to ciliary transition zone to 15 entities -
       ComplexPortal:CPX-2531 plus its 14 subunits - every one by NAS, zero experimental
       annotations in any organism, and the paper's own knockouts were B9D1 and TMEM231.
       The membership term GO:0036038 from the same reference carries 18 IDA, so
       membership was measured and the process term was distributed.
       GO:1904491 -> MARK_AS_OVER_ANNOTATED; GO:0036038 and GO:0035869 kept.

    3. A coverage gap, not an over-annotation. The jouberin/beta-catenin Wnt axis is
       established by three Nature-family papers and cited by UniProt's own FUNCTION and
       SUBUNIT blocks at ECO:0000269, yet QuickGO returns ZERO Wnt or beta-catenin
       annotations for human AHI1 (37), mouse Ahi1 (75) or rat Ahi1 (63). Proposed
       GO:0008013 beta-catenin binding (IPI) and GO:0090263 positive regulation of
       canonical Wnt signaling pathway (ISS, because the in vivo work is mouse).

    Also: GO:0044458 motile cilium assembly IBA marked over-annotated - its sole
    non-node donor is zebrafish ahi1 (TrEMBL only), one morpholino IMP in Kupffer's
    vesicle, against a human protein annotated to non-motile cilium. Three Reactome
    GO:0005829 cytosol rows shown to be a compartment label on the basal-body complex
    entity (one reaction supplies cytosol to 87 entities). GO:0008104 MODIFYed to
    GO:0061512 protein localization to cilium on human patient-fibroblast evidence.
    GO:0030674 protein-macromolecule adaptor activity proposed as ISS on the single
    published bridging experiment (OTUD1/TYK2, mouse macrophages, with the reciprocal
    control); the BCR-ABL/JAK2 ternary complex was checked and rejected as adaptor
    evidence because no dependency test exists.

    Negative checks run and recorded: no retraction, erratum or expression of concern
    on any of 21 cited PMIDs; all five partner accessions resolve to reviewed canonical
    Swiss-Prot entries with matching lengths; paralogue transfer is impossible because
    PTHR44499 has one human gene; UniProt NbExp counts sub-methods not experiments
    (HAP1 NbExp=3 is one study logged three ways).

    Verification: just validate (Valid, 1 warning left standing), 72/72 supporting_text
    quotes verbatim with raw==parsed, a committed-equivalent invariant audit with a
    5-mutation self-test (which caught a real bug in the audit itself), and cache_lint
    exit 0.
