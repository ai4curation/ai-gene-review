  details: |
    Follow-up to PR #3078, which left all 22 GO:0005515 rows on KEEP_AS_NON_CORE - an action the policy in .claude/skills/annotation-reviewer/SKILL.md does not offer for protein binding. Policy provenance checked: it landed 2026-09-12 in b1cff30014, before that review, so the older-untouched-reviews carve-out does not apply. No automated check enforces the policy (compliance.py contains no GO:0005515 rule), which is why neither validation nor four review rounds caught it. MODIFY rather than REMOVE because the cited paper supports a more informative term, established per pair rather than assumed: the cached full text of PMID:36115835 never names ARHGAP6 (the pairs are in the supplementary peptide library), so a new committed check, check_binding_evidence.py, reads IntAct's curated record of that paper. All 22 pairs are typed direct interaction and detected by holdup assay (MI:2437); MAST2 and SNX27 carry fps (MI:0053) as well, which corroborates the same determinant rather than splitting the set. Combined with the existing PDZ analysis (22/22 partners carry PDZ domains; ARHGAP6 ends ...LPETLV, class I), GO:0030165 restates the measurement without inferring a function from it. The new script refuses to report when zero partners match, after an earlier version read the wrong id field and returned a plausible-looking 22/22 unmatched. Nothing outside the binding rows changed: description, core_functions and the arginine-finger and propagation findings are identical, asserted by diffing the parsed documents.
