  summary: Full re-review of PPP4R4 (ProtNLM2 benchmark Q6NUP7), independent of predictions
  details: |
    Full re-review of Q6NUP7 (canonical 873-aa entry; isoform 2 is a 120-aa truncation lacking HEAT repeats). Falcon deep research failed (403 auth; perplexity-lite timeout); reviewed from PMID:18715871 abstract and UniProt. Six PPP4C protein-binding IPI rows MODIFY->protein phosphatase binding (were UNDECIDED). Two phosphatase-inhibitor IDA rows MODIFY->protein phosphatase regulator activity because reduced activity vs free PP4c is shared by PP4R2-PP4R3 and is a generic holoenzyme effect. Cytoplasm rows MODIFY->cytosol; Ser/Thr phosphatase complex rows MODIFY->protein phosphatase 4 complex (GO:0030289). Cytosol and IBA regulator activity accepted. Description and core function rewritten; reference_review added. PTHR21467 single subfamily SF0; human is the only characterised member; family review agrees. No NEW terms.
