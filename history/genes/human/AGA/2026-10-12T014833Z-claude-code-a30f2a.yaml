  summary: Align the IBA cytoplasm row with NAGA's treatment
  details: |
    Review round 3 suggestion 2 for PR 4816. AGA and NAGA both carry an IBA is_active_in cytoplasm row propagated from a PANTHER node, on soluble lysosomal acid hydrolases, and they were handled differently: AGA MARK_AS_OVER_ANNOTATED, NAGA MODIFY to GO:0043202 lysosomal lumen. Changed AGA to match NAGA. The reasoning is the qualifier: is_active_in says where the activity happens, so replacing the term keeps the qualifier and gains precision, where marking it over-annotated discards the claim instead of sharpening it. Cytoplasm is not false, since lysosome is part of the cytoplasm in GO, but it does not say where a soluble acid hydrolase works. Supported by the existing PMID:27906067 quote naming AGA as a lysosomal enzyme plus the UniProt SUBCELLULAR LOCATION: Lysosome line. Note the earlier review grouped FUCA1's cytoplasm row with these two; that one is a TAS located_in from PMID:4074382, a different footing, and is left alone.
