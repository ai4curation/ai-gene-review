  summary: Review CAV3 caveolar organization and channel regulation
  details: Reviewed all 116 original CAV3 assertions, corresponding to 117 raw annotation rows, while
    preserving exact machine objects and the absence of declared alternative products. The review retains
    24 ACCEPT, 53 KEEP_AS_NON_CORE, 35 UNDECIDED, 3 MODIFY and 1 MARK_AS_OVER_ANNOTATED decisions, 31
    reference assessments and three core functions covering caveolar organization with protein recruitment
    and selected calcium- and sodium-channel regulation. No NEW annotations were added. Source-specific
    reasoning distinguishes human heterologous constructs, rodent cardiac and repair models, wild-type
    controls and mutant late-current effects. The heart-rate extension is marked over-annotated because
    its cited rationale extrapolates an untested CAV3 variant from a separate SCN5A mechanism; narrower
    physiological questions remain undecided. Broad adaptor assertions are refined using hERG/NEDD4-2
    recruitment evidence. Frozen caveolinopathy Definitive and long-QT Limited associations are unchanged.
    The PMID:25556234 placeholder title is reconciled to the preserved normal cache; source bytes and
    original identifiers remain exact. Eight short verbatim anchors were checked. Validation reports eleven
    standing-policy binding advisories, two uninspected-propagation advisories and one source-specific
    cell-differentiation action advisory. DRAFT retains unresolved biology and donor access. Normal validation,
    status, rendering and standard CREATE-history checks are recorded separately. All 26 directly relevant
    sources, 30 auxiliary caches and two frozen inventory files are protected; auxiliary and inventory
    files are excluded from the gene publication.
