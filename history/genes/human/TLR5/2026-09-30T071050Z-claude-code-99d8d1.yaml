  details: |
    Compared the completed TLR5 review with TLR5-deep-research-falcon.md, which arrived after the review was drafted. The report agrees on flagellin D1-domain recognition of a determinant buried in the assembled filament, monomer rather than filament sensing, plasma-membrane and basolateral epithelial localisation, the 2:2 flagellin-TLR5 complex, and MyD88-myddosome-TRAF6-TAK1 signalling to NF-kappaB and MAPK, so no annotation action, term, description or core function was changed. The silent-commensal-flagellin work rests on a 2024 preprint cited only through the report and was not asserted. The report's claim that TLR5 signals exclusively through MyD88 conflicts with the review crediting TRIF in intestinal epithelium, which is supported by a verbatim quote from PMID:20855887; the review was left unchanged and the existing suggested question records the tension. Only change to the YAML: a corroborating file: citation to the deep-research report added to the supported_by of the GO:0038187 IDA row. Notes file updated with a Deep-research cross-check (2026-09-30) section, replacing the statement that deep research had not completed. just validate human TLR5 passes with no errors or warnings.
