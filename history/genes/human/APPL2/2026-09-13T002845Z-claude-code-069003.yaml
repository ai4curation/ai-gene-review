  summary: 'Create review: APPL2'
  details: |
    Full review of human APPL2 (Q8NEU8, DP13B_HUMAN): 124 seeded GOA rows plus 2 NEW, with actions ACCEPT 40, KEEP_AS_NON_CORE 49, MODIFY 22, MARK_AS_OVER_ANNOTATED 13, NEW 2, and 65 propagation_review blocks whose source_entities are generated from each row's own supporting_entities by script. Both IBAs descend from PTHR46415's Bilateria node PTN000572460: GO:0010008 endosome membrane is NO_FAILURE_CORE, and GO:0023052 signaling is NO_FAILURE_NON_CORE rather than a granularity mismatch because the node's seeds APPL1 and APPL2 have opposite-sign signalling roles, making the generic parent the correct LCA. PAINT placed protein kinase B binding and insulin receptor signalling at the separate Tetrapoda node PTN008708200 inside the APPL1 subfamily, which APPL2 does not inherit, corroborated by PMID:17030088. GO:0051289 protein homotetramerization was MODIFYed to GO:0051260 because PMID:23055524 never uses the word tetramer and its cross-linking and MALLS data both give a dimer; 22 bare protein-binding IPIs were re-termed to GO:0031267 small GTPase binding (Rab partners; GO:0017137 is merged into it, verified on QuickGO) and GO:0046982 protein heterodimerization activity (APPL1 partner). NEW rows: GO:0090263 (IMP, PMID:19433865) and GO:0140311 (ISS from mouse Appl2, PMID:19661063). No affinage deep-research record exists: the service returned Q06481 (APLP2) for the symbol APPL2 and the wrong-protein gate refused the write, so the review was built from UniProt, GOA, the PAINT slice and papers retrieved directly, eight of which are absent from the GOA reference list. A uv bioinformatics project measures human-mouse APPL2 identity at 92.7 percent and APPL2-APPL1 paralog identity at 53.9 percent and verifies the PH-domain residues and the 151-PKKKENE-157 motif. Validated with just validate (clean, no warnings), checkquotes.py (325 quotes, 0 failures), a GOA-row to YAML-entry reconciliation script, a duplicate-key check and the cache/go/terms.csv deletion and duplicate checks, all re-run after merging origin/main.
