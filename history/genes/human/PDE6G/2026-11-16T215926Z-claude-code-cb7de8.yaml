  summary: First review of PDE6G for the dismech vision-disorder alignment
  details: |
    First annotation review of human PDE6G (rod PDE6 inhibitory gamma subunit), written for projects/DISMECH_VISION_ALIGNMENT (tranche 1) together with the other PDE6 subunits. 26 GOA rows reviewed: 9 MODIFY, 7 ACCEPT, 6 REMOVE, 3 KEEP_AS_NON_CORE, 1 MARK_AS_OVER_ANNOTATED; one NEW row, GO:0141190 by ISS from bovine PDE6. Core function: GO:0004857 enzyme inhibitor activity within the rod PDE6 complex; GO has no molecular function term for inhibiting a phosphodiesterase. Removed: the InterPro mappings of phosphodiesterase activity and cGMP binding, which belong to the catalytic subunits, and four bare protein-binding rows. SH3 protein-binding rows are refined to SH3 domain binding. The role with RGS9 in speeding transducin shut-off is supported for bovine and mouse protein only and is left as a question. Validated with just validate human PDE6G: no errors.
