  summary: 'Create the human EIF2S1 (eIF2alpha) gene review: all 102 GOA rows adjudicated,
    mitochondrial outer membrane added, two core functions'
  details: |
    First review for human EIF2S1 (eIF2alpha, P05198), the hub gene of the integrated
    stress response project (issue #3951) and also a listed candidate of the stress
    granules project (issue #3953). Files fetched with `just fetch-gene human EIF2S1`:
    102 GOA annotations and 54 seeded references. No provider deep-research file was
    available (no `deep-research` recipe in the justfile and no provider key present),
    so a hand-written `EIF2S1-notes.md` carries the provenance instead; nothing was
    named `-deep-research-*`.

    All 102 GOA rows adjudicated, plus one NEW row: ACCEPT 37, MODIFY 35,
    KEEP_AS_NON_CORE 14, REMOVE 9, MARK_AS_OVER_ANNOTATED 7, NEW 1.

    Decisions worth recording:

    - GO:0005741 mitochondrial outer membrane added as a NEW IC row beside the retained
      GO:0005739 rows, per projects/ORGANELLES.md. Three independent lines agree
      (fractionation with an ER-marker control that excludes MAMs, quantified TOM20
      colocalization, and Fis1-anchored outer-membrane tethering that reconstitutes the
      phenotype), and the cytosolic topology is forced because eIF2alpha has no
      presequence and no transmembrane segment. The organelle rows were kept, not
      modified away.
    - GO:0000423 mitophagy MODIFYd to GO:1901526 positive regulation of mitophagy. The
      evidence shows eIF2alpha supplies the signal; the authors state the downstream
      mechanism is unresolved, so it does none of the work of engulfment. This also
      aligns the gene with the GO:1901526 row already on EIF2AK1 (HRI) for the same
      pathway. A lateral regulation-of shift, not a refinement.
    - Four correct-but-general families refined to descendants the gene already carries:
      GO:0003743 -> GO:0160296 + GO:0160297, GO:0006413 -> GO:0002183,
      GO:0034976 -> GO:0036499 + GO:0036490, GO:0006446 -> GO:0032057,
      GO:0003676 -> GO:0003723, GO:0003723 -> GO:0003729, GO:0005737 -> GO:0005829.
      The GO:0006413 and GO:0005737 refinements match the sibling EIF2S3 review, so the
      two eIF2 subunits now agree.
    - 25 bare GO:0005515 rows handled per the protein-binding policy: 11 -> GO:0031369
      (eIF2/eIF2B subunits), 4 -> GO:0019901 (the PKR/PERK kinases, whose eIF2alpha
      docking surface is mapped), 1 -> GO:0019903 (PPP1CA via the GADD34 scaffold), and
      9 REMOVEd as uninformative (ABCF1 x2, DDX3X x2, TBL2, ACTN1, VAC14, PRMT7 x2).
    - Over-annotations flagged rather than removed: generic membrane and extracellular
      exosome (HDA fractionation inventories), nucleus and glial limiting end-foot
      (Ensembl-Compara transfers), response to kainic acid and response to
      manganese-induced ER stress (treatment-specific rat experiments), and positive
      regulation of type B pancreatic cell apoptotic process (a directional, chronic-
      stress outcome asserted at a node whose outcome is context-dependent).
    - Residue numbering pinned throughout: the literature's S51 is Ser52 of P05198
      (position 51 of the displayed sequence is a leucine). Recorded as a numbering
      convention in the notes, not as a source defect and not as an isoform mismatch.
    - Two IBA rows carry propagation_review (TERM_SCOPING_PROBLEM /
      GRANULARITY_MISMATCH); P05198 appearing in its own WITH/FROM is recorded as
      expected experimental grounding on the target, not as circularity.

    Two top-level knowledge_gaps and one core-function gap, all BIOLOGY: what reads
    phospho-eIF2alpha on the outer membrane (peroxisomal tethering does not induce
    pexophagy, so a mitochondria-specific co-factor is required), whether the
    mitochondrial pool also changes local translation, and whether Ser49 is a real
    human site independent of Ser52.

    `projects/INTEGRATED_STRESS_RESPONSE.md` is stale about this gene (it still says
    EIF2S1 has no gene folder) but was deliberately left untouched: PR #4527 ("Audit
    project pages I-P") is already open against that file, and a second concurrent edit
    would be a conflict rather than progress.

    `just validate human EIF2S1` passes clean with no warnings; `just
    backfill-record-sections` placed 160 record_section values; `just
    backfill-isoforms` found nothing to change. The 67 distinct supporting_text quotes
    were checked as verbatim substrings of the cached sources before the file was
    written.
