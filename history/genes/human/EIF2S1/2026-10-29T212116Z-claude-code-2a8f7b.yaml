  summary: 'Create review: EIF2S1 (eIF2alpha), the ISR hub'
  details: |
    Reviewed all 102 seeded GOA rows for human EIF2S1 (P05198) and added one NEW row. The NEW row is GO:1990624 guanyl nucleotide exchange factor inhibitor activity: phospho-eIF2 binds eIF2B in the nucleotide-exchange-inactive mode, which is the integrated stress response's molecular mechanism and had no molecular function annotation on human EIF2S1; the comparator check favours adding it because PomBase already carries the term on S. pombe tif211 (P56286) with TAS from PMID:31048492, whose structures contain the human eIF2alpha chain (PDB 6K71/6K72). GO:0140467 was deliberately not proposed, being an ancestor of the already-accepted GO:0036499 and GO:0140468 (following the EIF2AK3 call in PR 3219). Mitochondrion was kept at the root organelle term with no outer-membrane row, per projects/ORGANELLES.md, since this is stress-triggered recruitment of a soluble cytosolic protein to the organelle surface; the cited paper's ER-marker control was negative. 25 bare GO:0005515 rows were removed per the protein-binding policy with the informative claim named in each case. Four TOO_GENERAL groups were each verified against QuickGO as strict ancestors of a term accepted elsewhere. One knowledge gap was recorded on the mitophagy core function, which therefore carries no molecular_function term. Deep research was unavailable (no provider API keys), so background work is in EIF2S1-notes.md; five publications not in GOA for this gene were fetched to support ISS/IEA-only rows and the NEW row. Every supporting_text was verified against the cached source with local_source_text.quote_matches before writing. Validated with just validate human EIF2S1 (passes) and just backfill-record-sections (no mismatches). Also refreshed the stale counts and status in projects/INTEGRATED_STRESS_RESPONSE.md.
