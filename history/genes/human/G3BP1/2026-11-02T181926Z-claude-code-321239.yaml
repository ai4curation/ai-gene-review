  summary: 'Create review: G3BP1'
  details: |
    First review of human G3BP1 (Q13283) for the Stress Granule Assembly project. All 139 GOA rows adjudicated. Core function recorded as RNA-dependent molecular condensate scaffold activity (GO:0140693) nucleating stress granules, plus a second core function priming the cytosolic sensors cGAS and RIG-I. Removed all 12 DNA/RNA helicase and ATP hydrolysis rows (GO:0003678, GO:0003724, GO:0033677, GO:0016887): every row traces to one unreproduced 1999 report (PMID:9889278) that assigned a HeLa nuclear-extract unwinding activity to G3BP by microsequencing a gel band, and a new reproducible motif/signature analysis (genes/human/G3BP1/G3BP1-bioinformatics) finds no Walker A, Walker B, DExD/H box or helicase family signature in G3BP1 while cleanly flagging DDX3X, EIF4A3, BLM and UPF1 and clearing the NTF2 and RRM+RGG fold controls. A source_defects entry asks UniProt to retire the two EC numbers, the ATP-dependent DNA helicase VIII alternate name and the helicase CC statements, and a propagation_review records that PANTHER node PTN002581351 has no descendant grounding beyond the target's own bad IDA. GO:0007265 Ras protein signal transduction and GO:0005925 focal adhesion marked over-annotated; cytoplasm, RNA binding and nucleic acid binding modified to cytosol and mRNA binding; the four ComplexPortal rows kept as non-core except GO:0140694, which is TOO_GENERAL under the accepted GO:0034063; all 71 bare GO:0005515 rows removed under the protein-binding policy. No deep-research provider was reachable, so the research record is in G3BP1-notes.md. Validated with just validate human G3BP1 (clean), validate-references (244 snippets, 0 issues) and validate-terms.
