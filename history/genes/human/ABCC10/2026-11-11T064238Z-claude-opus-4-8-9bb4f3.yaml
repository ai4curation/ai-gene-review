  summary: De-novo review of ABCC10 (MRP7) canonical surfaceome annotations
  details: |
    Reviewed all 30 existing GOA annotations: 22 ACCEPT, 2 MODIFY (membrane->plasma membrane; leukotriene metabolic process->leukotriene transport), 3 TOO_GENERAL (GO:0140359 x2 and GO:0042626, entailed by accepted GO:0008559/GO:0015431), 1 MARK_AS_OVER_ANNOTATED (lysosomal membrane HDA). Synthesized 2 core functions (GSH-conjugate/organic-anion export GO:0015431; xenobiotic efflux GO:0008559) at basolateral plasma membrane. Added description, references with reference_review, suggested questions/experiments, and ABCC10-notes.md.
