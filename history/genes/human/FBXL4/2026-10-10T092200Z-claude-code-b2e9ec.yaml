  details: |
    Full review of 29 GOA annotations plus 1 NEW (protein ubiquitination, IDA PMID:36896912). Core function: substrate receptor of the mitochondrial outer-membrane SCF-FBXL4 ligase that ubiquitinates BNIP3/NIX for proteasomal degradation, restraining mitophagy. Intermembrane-space IDA (PMID:23993194) removed as contradicted by protease-protection and alkaline-extraction data (PMID:36896912, PMID:37161784); generic ubiquitin ligase complex, ubiquitin-dependent catabolism and mitophagy terms modified to SCF-specific and negative-regulation terms; Reactome cytosol rows marked over-annotated; two protein-binding IPIs removed. Literature added: PMID:37161784, 37102372, 37568009, 40025034, 23993193. Deep research unavailable (falcon 402, perplexity-lite unavailable, openai key rejected); documented in FBXL4-notes.md. just validate human FBXL4 passes.
