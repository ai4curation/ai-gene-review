  summary: 'Round 22: GO:0005739 to MODIFY with GO:0005741, so the file does not refine
    cytoplasm while accepting mitochondrion'
  details: |
    Round 22 of PR #4810. The reviewer verified all nine round-21 action changes and both corrections to
    its round-21 table, then found a regression this branch created in round 21 and a row in a third
    disposition, and corrected my reasoning about the scan. All three are taken.

    The regression, which is the real finding. Round 21 refined GO:0005737 cytoplasm to a specific
    location in FBXL4 (to GO:0005741) and TARS2 (to GO:0005759) while leaving GO:0005739 mitochondrion
    as ACCEPT in both files. The part_of chain is cytoplasm, then mitochondrion, then the specific
    compartment, so each file ended up refining the broader term and accepting the one sitting between
    it and the refinement target. That is the inverse of the MFF inconsistency flagged in round 20 and
    the TRMT10C one flagged in round 21 - one argument treated two ways inside one file - and it was
    created by the push that fixed those. Both GO:0005739 rows are now MODIFY to the same replacement
    their GO:0005737 rows name, with the reason saying why, so the chain is handled once per file.

    The correction to my reasoning matters more. Round 21 reported the structural scan as having failed,
    on the ground that 73 candidates for a real set of nine is too noisy to be a method. The reviewer
    points out that 73 across 18 reviews is about four per file, which is a read-list rather than a
    result, and that FBXL4's own GO:0005739-versus-GO:0005741 pair was in it. That is right, and the
    demonstration is exact: FBXL4's reason reads "consistent with colocalization studies and
    outer-membrane residence", which is MFF's pre-round-20 claim minus the five words that made MFF a
    grep hit. No prose-keyed scan of any phrase list reaches a row whose reason omits the tell, because
    the tell is what it keys on. The structural relation generates candidates and reading decides them;
    round 21 had the first half right and discarded it.

    The third-disposition row. MTFMT GO:0003824 catalytic activity was MARK_AS_OVER_ANNOTATED with the
    reason that it is "correct but uninformative, since the specific activity (methionyl-tRNA
    formyltransferase activity, GO:0004479) is annotated with experimental support". That is the
    TOO_GENERAL enum's definition nearly word for word, while MARK_AS_OVER_ANNOTATED asserts an
    over-annotation the same sentence disowns by calling the term correct. GO:0004479 is accepted twice
    in the file and is a confirmed descendant of GO:0003824. The row is now TOO_GENERAL. It also marks
    the other edge of the scan - keying on ACCEPT and KEEP_AS_NON_CORE follows the rule's letter, and a
    correct-but-general term parked under a third action is outside the letter and inside the purpose.

    The explicit decision the reviewer asked for, on mitochondrion-level localization across the slice.
    After this push GO:0005739 is MODIFY in four files (FBXL4 1, MFF 2, TARS2 1, UCP2 2) and ACCEPT in
    three (MTFMT 4, SUCLA2 10, TRMT10C 8). Those 22 rows are deliberately left as ACCEPT, on three
    grounds rather than by omission.

    First, the rule governs an action/reason mismatch, and none of those 22 reasons argues that the term
    is too general - they give the proteome evidence and the gene's function. The six rows that were
    refined were refined because their own prose argued generality, or because the same file refined a
    broader term on that argument. A row whose reason is sound is not reached by this rule.

    Second, MTFMT cannot take either remedy. It has no specific-location row in existing_annotations at
    all - GO:0005759 appears only in core_functions.locations, which the validator already notes - so
    MODIFY would propose a term the gene does not carry as an annotation, and TOO_GENERAL would assert
    that a row entails it when no such row exists.

    Third, converting SUCLA2's ten and TRMT10C's eight would be a slice-wide re-curation of
    mitochondrion-level localization on an argument the rule does not make, in a PR that has been open
    through twenty-two review rounds. Those two genes have no internal inconsistency to resolve: nothing
    in either file refines a mitochondrial-location ancestor, so neither contradicts itself the way
    FBXL4 and TARS2 did. Whether GOA's organelle-level rows should be refined wherever a compartment row
    exists is a real question, and it is the systemic one - the same question as the repo-wide scan that
    timed out in round 20. It belongs in a change of its own.

    Two smaller items, both from the reviewer's suggestions and both correct.

    TRMT10C's new TOO_GENERAL reason said three complex terms were "accepted in this review" when the
    third, GO:1902555 endoribonuclease complex, is KEEP_AS_NON_CORE. The reason now says "kept", with
    the two accepted ones named as accepted and GO:1902555 as kept as non-core, which is how the TARS2
    row written in the same commit already put it. The quantifier-over-a-list shape again, at the
    smallest scale it has appeared in this thread.

    SUCLA2's GO:0005524 ATP binding reason said "correct but subsumed by the core MF". Subsumption is
    the exact relation the last three rounds have been adjudicating, and it does not hold here:
    GO:0005524 and GO:0004775 are in different branches, confirmed in both directions against the
    QuickGO is_a/part_of closure. The reason now states the part-of-the-reaction point it was making and
    says explicitly that no refinement target exists, so a reader running the structural check is not
    sent looking for a parent/child pair that is not there.

    Verification: every ancestry relation was confirmed against QuickGO before being written - six pairs
    this round, including both directions for GO:0005524 and GO:0004775; ai-gene-review validate passes
    on all five changed reviews, with no new warnings (MTFMT's two and the others' are pre-existing, the
    UV_NATIVE_TLS environment noise, the deep-research suggestions, and MTFMT's core_functions location
    note that is itself the evidence for the second ground above); each of the five changes was checked
    to have landed on its intended term and action; row counts unchanged at FBXL4 29, MTFMT 12, SUCLA2
    55, TARS2 28, TRMT10C 48.
