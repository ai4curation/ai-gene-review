  summary: Resolve BMP6 source-specific ligand and process evidence
  details: |
    Apply the independently reviewed follow-up while preserving all 81 source annotation
    objects, original partner accessions, qualifiers and source reference identifiers.
    Twenty review objects are refined using source-specific primary reading and twelve
    additional normal publication caches. Final actions are 26 ACCEPT, 45 KEEP_AS_NON_CORE,
    two MODIFY, one MARK_AS_OVER_ANNOTATED and seven UNDECIDED; no NEW rows are added.

    Distinguish BMP receptor binding from experimentally demonstrated BMP2/BMP6
    heterodimerization contributing cytokine activity. The second core records recombinant
    capacity without asserting obligatory endogenous assembly. Retain curated organ-development
    annotations with MGI deference where the precise complementation assays remain unread.
    Separate proliferation from differentiation, ligand-mediated transcription regulation
    from DNA binding, murine macrophage mechanisms from human-cell confirmation, and BMP6
    endothelial assays from the same paper's BMP9 experiments.

    Mark the PMID:29695288 iron-homeostasis assignment over-annotated relative to the
    inspected variant-genotyping and localization/secretion experiments. This does not
    reject established wildtype BMP6 iron regulation. Unrecovered historical donor chains
    and vesicle evidence remain unresolved. Ten additional caches are abstract-only;
    selected main-text Results/Methods and available primary captions support the other
    refinements without a claim to full supplementary or image inspection.

    Normal focused gene validation passed with three advisories: two supported generic
    ERFE interactions are retained as non-core under the task instructions, and different
    iron-homeostasis actions deliberately reflect different source experiments. The separate
    reference command reports zero checks and is not counted as an independent quotation
    audit. All ten quotation fields were independently checked against immutable sources
    and remain within 25 words per source. Earlier history, raw gene records and all
    publication cache bytes are preserved.
