  - references
  - suggested_questions
  summary: 'Reviewer round 2: add human Jurkat evidence (chaperone binding, centrosome, CCT assembly, synapse formation, TCR signaling) and Th1/IL-17 ISO rows; reframe localization conflict'
  details: |
    Added NEW GO:0051087 (IPI), GO:0005813 (IDA), GO:0031334, GO:0001771 and GO:0050862 (IMP) from human Jurkat data in PMID:41090353, plus GO:0045627 and GO:0032740 by ISO from mouse. The core function now has an MF. The nuclear-vs-mitochondrial conflict is framed as construct vs endogenous protein. PMID:31620119's CCT4 and mitochondrial hits are noted, and the PMID:27183579 erratum leaves its correctness unset.
- type: EDIT
  outcome: changed
  sections:
