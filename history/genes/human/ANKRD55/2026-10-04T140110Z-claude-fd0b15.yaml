  summary: 'Initial review of human ANKRD55: autoimmune risk gene; 22 HuRI rows removed;
    NEW nucleus, mitochondrion and Th17-differentiation terms'
  details: |
    All 22 GOA rows were HuRI protein-binding hits and are removed. Added NEW GO:0005634 nucleus (IDA, PMID:27183579), GO:0005739 mitochondrion (ISO from mouse, PMID:40932625) and GO:2000321 positive regulation of T-helper 17 cell differentiation (ISO, PMID:41090353, with independent support from PMID:40932625). The conflicting human-nuclear and mouse-mitochondrial localizations are stated and raised as a question.
- type: EDIT
