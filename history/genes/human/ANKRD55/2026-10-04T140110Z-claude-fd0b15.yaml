  - existing_annotations
  - suggested_questions
  summary: 'Reviewer round 4: mitochondrion row is IDA on endogenous human ANKRD55 (human TH17 cells), not ISO from mouse; species dropped from the localization discussion'
  details: |
    PMID:40932625 stained endogenous human ANKRD55, with an sgRNA-validated antibody, in human TH17 cells and fractionated the same cells, because no mouse antibody existed. The GO:0005739 row is now IDA without the mouse supporting entity, and its summary and reason are corrected. The nucleus row cites the paper's VDAC1 contamination caveat, and species is no longer offered as an explanation for the localization discrepancy. The IL-17 row cites the LKB1 rescue.
- type: EDIT
  outcome: changed
