  - references
  summary: 'Reviewer round 3: replace the fractionation-marker quote with the result sentence; cite the human mitochondrial interactome evidence'
  details: |
    The PMID:31620119 quote now states that ANKRD55 isoforms were found in all three fractions, adding that ANKRD55 was poorly detectable in the nucleus by imaging. The mitochondrion row now cites the SLC25 interactome sentence. The IL-17 row no longer carries an unrelated localization quote.
- type: EDIT
  outcome: changed
  sections:
