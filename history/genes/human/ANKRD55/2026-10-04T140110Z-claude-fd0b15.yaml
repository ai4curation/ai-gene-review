  summary: 'Reviewer round 5: PMID:40932625 finding and notes now say human for the localization; second core function for the mitochondrial/IL-17 arm'
  details: |
    The PMID:40932625 finding states the human TH17 localization, and the mouse knockout phenotype is attributed separately. Its review_notes and the PMID:41090353 review_notes now describe what each paper sources. A second core_functions entry covers the mitochondrial arm (mitochondrion, positive regulation of IL-17 production). The stale species framing in the notes is corrected.
