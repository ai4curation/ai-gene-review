  summary: 'Create review: human GALK2'
  details: |
    Created the first human GALK2 review in the PTHR10457 GHMP sugar-kinase family. `just fetch-gene human GALK2` returned a real 17-row GOA cache rather than a header-only failure. Direct evidence from PMID:8798585 and PMID:16006554 supports ATP-dependent N-acetyl-D-galactosamine kinase activity as the core molecular function, with cytosolic placement inherited from the PAINT cytosol row. The four galactokinase activity rows and the two galactose metabolic process rows are MARK_AS_OVER_ANNOTATED rather than REMOVE: the abstracts separate GALK2 from the canonical chromosome-17 GALK1 Leloir enzyme but report weak GalNAc-kinase phosphorylation of galactose at millimolar concentrations. Broad cytoplasm, carbohydrate metabolism, kinase activity, and phosphotransferase parent rows were marked TOO_GENERAL against retained cytosol, carbohydrate phosphorylation, and N-acetylgalactosamine kinase rows. No module or GO-CAM review was added because the cached galactose Leloir module is GALK1-specific and no production GO-CAM in `gocams/index.tsv` covers a human GALK2 GalNAc-salvage step.
