  summary: 'SPRY4: OpenScientist confirms SPRY4 lacks the SPRY2 GRB2 SH3 motif; RAF1
    arm is Ras-independent'
  details: |
    OpenScientist (3 iterations; report SPRY4-hypotheses/spry4-raf-not-grb2/openscientist.md) confirmed the C-terminal PxxPxR GRB2 SH3-binding motif is unique to SPRY2: all 7 reviewed SPRY2 orthologs carry it and all 3 SPRY4 orthologs lack it. The cysteine-rich core is conserved. The run also qualified the RAF1 arm as Ras-independent, with TESK1 as the clearest direct kinase target; this agrees with the existing core-function text. Added the missing-motif point with support from Lao 2006 (PMID:16893902) and the report. Kept GO:0046580: the Tyr75-dependent arm lowers Ras activation, and the run's caveat concerns only the RAF1 arm.
