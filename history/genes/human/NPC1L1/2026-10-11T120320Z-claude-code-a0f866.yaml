  summary: 'Review round 1: NPC1L1'
  details: |
    Review round 1 for PR 4812: the single core function carried only GO:0015485 cholesterol binding, which understates the gene. Split it into the binding step and the uptake step, and gave the uptake step a proposed molecular function rather than an existing GO id. GO:0015248 sterol transporter activity is obsolete; the current GO:0120015 and GO:0120020 transfer-activity terms are not obsolete but require the gene product to carry the sterol through the aqueous phase between membranes, which PMID:34407950 rules out for NPC1L1 (an intramolecular channel through a membrane-embedded protein). GO:0120020 also has_part GO:0015485, so it would have restated the binding term. Recorded the gap as a proposed_new_terms entry.
