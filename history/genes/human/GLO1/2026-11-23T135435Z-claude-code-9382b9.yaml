  summary: Narrow the GLO1 isoform-2 catalytic-competence knowledge gap with an OpenScientist
    run
  details: |
    Ran OpenScientist (3 iterations) on whether GLO1 isoform 2 (lacking 105-119) is catalytically competent. Structural mapping on 1QIN: no zinc ligands or direct substrate contacts are in the segment, and only ~4% of the interface. But 105-119 is the inter-module crossover connector, and its excision would require bonding Cα atoms ~23 A apart, so isoform 2 is predicted fold-incompetent. Gap OPEN -> NARROWING.
