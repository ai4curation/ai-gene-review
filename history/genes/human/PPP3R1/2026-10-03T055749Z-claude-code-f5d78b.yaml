  details: |
    Created the PPP3R1 (calcineurin B1) review for ADAPTIVE_IMMUNITY. All 80 GOA rows were reviewed: 34 ACCEPT, 14 KEEP_AS_NON_CORE, 1 MARK_AS_OVER_ANNOTATED, 10 MODIFY, 21 REMOVE. The phosphatase-activity rows were changed to calcium-dependent protein serine/threonine phosphatase regulator activity (GO:0008597), since CnB has no catalytic domain. Calmodulin binding was removed, and a row citing a withdrawn paper was removed. Generic protein binding was either changed to GO:0008597 (structural CnA partners) or removed (screens, RCAN1, ASK1, SPATA33). Core functions are GO:0008597, contributing to GO:0033192 in GO:0005955 calcineurin complex and the calcineurin-NFAT cascade, plus calcium ion binding; these match PPP3CA and PPP3CB. The Falcon deep research arrived after the review and was integrated as leads only; it confirmed the review and changed no action. just validate passes with 0 errors and 0 warnings.
