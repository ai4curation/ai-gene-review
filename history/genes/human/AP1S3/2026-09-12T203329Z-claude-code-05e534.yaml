  summary: 'Create review: AP1S3'
  details: |
    Full end-to-end review of human AP1S3 (Q96PC3, sigma-1C of the AP-1 clathrin adaptor, PANTHER PTHR11753). All 45 GOA rows reviewed and reconciled one-for-one against the GOA tsv by script (ACCEPT 37, KEEP_AS_NON_CORE 5, MODIFY 3), plus two NEW rows. The review is built on two structures that contain AP1S3 itself and that the affinage deep-research pass missed because both are titled for the partner: PMID:36261523 (2.34 A cryo-EM, PDB 7R4H chain S = Q96PC3 1-154) resolves the dileucine cargo pockets L65/F67/H85/V88/V98 and the K60/R61 phosphoserine patch, and PMID:40752490 (1.68 A, PDB 9DDT) shows the AAGAB assembly chaperone capping that same pocket. On that basis the two bare protein-binding IPIs (partner AAGAB) were modified to GO:0051087 and the TLR3 IMP was modified from GO:0006605 to GO:0036010. The single IBA (GO:0016192, node PANTHER:PTN000204281) was traced to the committed PTHR11753 PAINT slice, all eleven WITH/FROM donors were resolved via UniProt xref lookups and checked against their own GO records via QuickGO, and the root cause recorded as NO_FAILURE_CORE: ten donors carry experimental evidence but in different descendant branches, so the parent is the correct LCA and not a granularity failure. Eleven propagation_review blocks were generated from each row's supporting_entities by script; the ARBA rule was fetched and its matching condition set identified. A reproducible uv bioinformatics project fetches four sigma sequences live from UniProt, asserts their lengths, and resolves 23 published residue positions: 22 match AP1S3 numbering, one does not (PMID:40752490 names L104 where every AP-1 sigma has I104), and the analysis shows residue numbering alone cannot separate AP1S3 from AP1S1. That finding, together with the AP1S1 plasmid used for the cell-based sigma mutants in PMID:36261523, is why no STING or type-I-interferon process row was proposed. Eight residue_claims encode the cargo pocket against AP2S1. Validated with just validate (clean, no warnings), checkquotes.py (149 quotes, 0 failures), the residue-claim validator (24 checks, 0 failures), a duplicate-key check, the terms.csv deletion and duplicate checks, and a GOA-to-YAML reconciliation script.
