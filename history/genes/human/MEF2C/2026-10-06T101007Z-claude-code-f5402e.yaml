  summary: 'Create review: MEF2C'
  details: |
    Full review of 148 GOA annotations for human MEF2C. Core functions are Pol II DbTF activity in cardiac muscle cell differentiation (ventricular differentiation, NKX2-5 positive loop), skeletal myoblast differentiation, partner-TF binding (HAND1/2, TBX5, NKX2-5, MyoD) and class II HDAC binding. Generic protein binding rows were changed to informative terms. Pleiotropic bone, neural, immune and vascular processes were kept as non-core. Over-annotations flagged: MAPK cascade, synaptic signalling physiology, primary heart field specification. The postsynapse IEA was removed. Unverifiable kidney and other ISS terms were left UNDECIDED. Deep research providers were unavailable; notes are based on cached and newly fetched PubMed abstracts.
