  summary: 'Create review: DSG3'
  details: |
    Reviewed all 57 annotation rows for DSG3 (P32926), plus one NEW row. Deep-research providers were unavailable, so research came from cached publications, UniProt and PubMed, recorded in DSG3-notes.md. Localization: plasma membrane and desmosome are core, with the adhesive cadherin ectodomain extracellular; the two cornified-envelope rows were marked as over-annotation because DSG3 is confined largely to basal and spinous layers and the assignment comes from pathway membership; the Reactome cytosol row was kept as non-core because it describes the caspase-released cytoplasmic fragment; generic membrane, cell junction and anchoring junction rows were refined to plasma membrane, cell-cell junction and desmosome. The six bare protein-binding rows were handled under the protein-binding policy, four modified to delta-catenin binding, cadherin binding or small GTPase binding and two removed as uninformative. A NEW cell-cell adhesion mediator activity row was added, and two core functions were recorded for adhesion and for the non-junctional signalling scaffold.
