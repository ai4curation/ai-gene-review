  summary: 'Create review: TLR9'
  details: |
    Reviewed all 136 GOA annotations for human TLR9 (Q9NR96). Core functions: pattern recognition receptor activity and unmethylated CpG binding, toll-like receptor 9 signaling pathway, endolysosome membrane. Key decisions: type II interferon IDA (PMID:16286015) modified to positive regulation of type III interferon production because the paper measured IFN-lambda; siRNA binding IMP (PMID:15723075) left undecided (abstract attributes siRNA sensing to TLR7, full text unavailable); extracellular region NAS and self-regulation of the TLR9 pathway removed; rat-derived IEAs (LPS response, metal ion, gonad development) marked over-annotated; plasma membrane rows kept as non-core since surface TLR9 is non-functional in macrophages. Falcon deep research timed out, so the review used cached and six newly fetched primary papers. just validate passes with one justified warning.
