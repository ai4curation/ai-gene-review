  summary: 'Create review: NPHS1 (nephrin)'
  details: |
    De-novo review of human nephrin as the experimental reference for DROME/sns (same PANTHER subfamily PTHR11640:SF136; IBA node PTN002267852). Deep research failed (falcon 403, perplexity-lite timeout); built from cached literature, UniProt and Reactome; ProtNLM2 output not consulted. All 33 GOA rows reviewed: slit diaphragm, slit diaphragm assembly, cell adhesion molecule binding and plasma membrane accepted as core; NCK1 protein binding -> SH2 domain binding, SYG-1 protein binding -> cell adhesion molecule binding, IQGAP1 protein binding removed; IBA cell-cell junction -> slit diaphragm and cell-cell adhesion -> homophilic + heterophilic cell-cell adhesion; GBM development (marker IEP), focal adhesion and skeletal muscle tissue development marked over-annotated; myoblast fusion (not propagated by PAINT; mouse necessity data only), myosin binding, synapse protein localization (heterologous worm rescue), exosome and podocyte development kept non-core. Added 9 references.
