  details: |
    De-novo review of human WDR76 (Q9H967) as experimental reference for PAINT node PTN000381277 (PTHR14773:SF0; shared with yeast CMR1 and Arabidopsis DRS1). Falcon deep research failed (Edison auth 403) and the perplexity-lite fallback failed (quota 401); review built from 13 directly fetched publications. All 13 GOA rows reviewed: nucleus (IBA, IDA) and site of DNA damage ACCEPT; DNA binding IBA ACCEPT as yeast-inherited (human binding not directly shown); heterochromatin, DNA damage response, regulation of DNA damage checkpoint and enzyme binding (PARP1, XRCC5) KEEP_AS_NON_CORE; three bare protein binding rows (CBX1/3/5) REMOVE per policy. Added NEW ubiquitin-like ligase-substrate adaptor activity and proteasome-mediated ubiquitin-dependent protein catabolic process from human cell-line RAS degradation studies, flagged as human/mouse-specific and not to be transferred within the family.
