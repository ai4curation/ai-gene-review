  details: |
    New full review of human WDR76 (Q9H967), independent of ProtNLM2 predictions, as the experimentally characterised PTHR14773:SF0 relative of ARATH/DRS1. All 13 GOA rows reviewed: nucleus and site of DNA damage accepted from human imaging data; DNA binding IBA accepted as an inferred core activity from yeast Cmr1 (same subfamily and PAINT node PTN000381277), flagged as untested in human; heterochromatin, DNA damage response, regulation of DNA damage checkpoint (IBA) and PARP1/XRCC5 enzyme binding kept as non-core; three CBX protein binding rows removed per GO:0005515 policy. Added NEW GO:0043161 for WDR76-mediated RAS polyubiquitination/proteasomal degradation (two independent labs; cullin partner disputed, so no complex term). Falcon deep research failed (403 auth) and perplexity-lite fallback timed out; recorded in notes. Cached 12 additional publications.
