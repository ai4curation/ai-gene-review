  summary: 'Review round 1: HNF4A'
  details: |
    Review round 1 for PR 4814: the notes header said falcon deep research timed out. The report exists and was checked against the review. It agrees on the DR1-binding homodimer annotation and qualifies the fatty-acid ligand claim in the direction the review already takes: linoleic acid occupancy is real and reversible, but ligand-free HNF4A binds DNA and adding linoleic acid did not activate transcription in the tested reporters, so HNF4A must not be annotated as requiring a ligand. Also recorded the Chandra multidomain structure evidence for the LBD allosteric contribution to DNA binding, the P1/P2 isoform split, HNF4G compensation, and the acute-phase restriction result showing HNF4A is not purely an activator.
