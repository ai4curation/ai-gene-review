  summary: 'Initial review of human ANKRD6 (Diversin): core PCP protein and Wnt switch;
    Wnt regulation IBA refined to its two directions'
  details: |
    Four GOA rows. Nucleus, cytoplasm and cell polarity accepted. The regulation of Wnt signaling IBA is modified to negative regulation of canonical Wnt signaling plus positive regulation of the Wnt/PCP pathway, the terms the mouse ortholog carries by IDA. Affinage's blocking symbol-collision gate was a false positive (Diversin is the fly Diego ortholog).
- type: EDIT
  outcome: changed
