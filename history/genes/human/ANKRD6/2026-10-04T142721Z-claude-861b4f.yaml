  - core_functions
  - references
  summary: 'Reviewer round 2: cell polarity IBA modified to establishment of planar polarity; PCP branch typed as GO:0060071; cytoplasm quote on-claim'
  details: |
    GO:0007163 is now MODIFY to GO:0001736. The GO:0030111 replacements are GO:0090090 plus GO:0060071, typing ANKRD6 as a core PCP participant rather than a regulator of the pathway. The cytoplasm row quotes the Xenopus puncta sentence.
