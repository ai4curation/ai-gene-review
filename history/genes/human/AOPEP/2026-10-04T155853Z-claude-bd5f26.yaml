  summary: 'Initial review of human AOPEP: the only enzymology paper is withdrawn,
    so aminopeptidase specificity is left undecided; motif-based metallopeptidase
    activity and mouse-based nucleolus accepted'
  details: |
    Eight GOA rows, all IEA/ISS/IBA. Nucleolus and cytoplasm accepted (mouse GFP-fusion, NoLS mapped); IBA from PTN000898498 seeded by mouse only. Metallopeptidase activity and zinc binding accepted on the retained M1 catalytic motif. Metalloaminopeptidase activity left UNDECIDED because the only biochemical study (PMID:15687497) was withdrawn (PMID:30808004); flagged is_invalid. WHOLLY_DARK knowledge gap recorded.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - references
  - suggested_questions
  summary: 'Address PR #4153 review: GXMEN motif scan and UniProt by-similarity function for the aminopeptidase row'
  details: |
    The GO:0070006 UNDECIDED reason now acknowledges UniProt's by-similarity aminopeptidase function, and argues against it with a reproducible motif scan (AOPEP-bioinformatics) showing AOPEP lacks the GXMEN exopeptidase motif present in ANPEP, LTA4H and RNPEP. Cited the UniProt retraction CAUTION. MF rows now note that isoforms 2 and 4 lack the catalytic site. Added the is_active_in caveat on the nucleolus IBA, a suggested question on HPA cell-junction staining versus nucleolus, and correctness LOW_QUALITY on the withdrawn paper.
