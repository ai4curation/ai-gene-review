  summary: Review CRX transcriptional regulation and partner-specific binding
  details: |
    Reviewed all 150 original CRX GOA assertions with source identities, qualifiers, order and multiplicity preserved: 27 ACCEPT, 51 MODIFY, 71 KEEP_AS_NON_CORE and one UNDECIDED. Synthesized one integrated nuclear DNA-binding transcription-factor core, grounded in human binding/activation and human retinal-organoid activation/repression evidence. The displayed 299-residue product is distinguished from untranslated transcript variation. Partner-specific binding judgments use authenticated positive pairs and independently supported partner classes, with species, construct, compartment and assay limits explicit. Literal reconstruction covers 327 used interaction records, 654 participant sequence hashes, 802 donor records, the actual family ancestry and 372 rule branches. Preserved existing caches and distinct source extraction variants; source tables and quotation limits checked. The original bounded donor projection was restored to its authenticated hash after an accidental enrichment; the enrichment is separately preserved with an explicit additive record. Independent core, whole-review and bounded partner-class consultations completed before ROOT publication qualification. Normal validation, status and rendering pass with 74 documented advisories and derived DRAFT status. Genuine provider failures remain documented without fabricated output.
