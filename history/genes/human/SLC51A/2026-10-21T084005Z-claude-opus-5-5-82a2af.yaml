  summary: Create full gene review for human SLC51A (OSTalpha)
  details: |
    New review of SLC51A (Q86UW1), created as the experimentally characterised human reference for DROME/CG6836 and independent of any ProtNLM2 prediction output. Fetched gene data and cached 7 GOA publications plus 5 further papers (PMID:17650074, PMID:22535958, PMID:18292224, PMID:31863603, PMID:35462858) found via PubMed; deep research was attempted with falcon and the perplexity-lite fallback and both failed (403 authentication error, then a 600 s timeout), which is recorded in the notes file. All 29 seeded annotations were given considered actions: the bile acid transporter activity (contributes_to), bile acid transport and secretion, basolateral plasma membrane, heterodimerization and complex rows were accepted as core; ER membrane and homodimerization kept as non-core; plasma membrane, membrane, generic transmembrane transporter activity and transmembrane transport modified to the specific supported terms, with propagation_review blocks on the two IBA rows; three bare protein binding rows from high-throughput interactome screens removed and the two SLC51B rows modified to protein heterodimerization activity. Added a project-independent description, two core functions, suggested questions and experiments. No NEW terms were proposed: the one unannotated established activity, transport of sulfated steroids, has no fitting GO term and is raised as a question instead. just validate human SLC51A passes.
