  summary: Full re-review of AFAP1L2 (ProtNLM2 benchmark HORSE40 pair), independent
    of ProtNLM2
  details: |
    I re-examined all 18 GOA rows against the primary XB130 literature (PMID:17412687, 19060924, 21084565, 22496359, 26446840, 27462298, 34470464) and against the PAINT nodes PTN002682769 and PTN001023816 (PTHR14338:SF4). Inflammatory response and positive regulation of DNA-templated transcription change from KEEP_AS_NON_CORE to MARK_AS_OVER_ANNOTATED, since both are cell-line cytokine or reporter readouts; propagation_review blocks were added for the IBA rows. Positive regulation of EGFR signaling changes from ACCEPT to KEEP_AS_NON_CORE. Five NEW rows were added: PI3K regulatory subunit binding, positive regulation of PI3K/PKB signal transduction, actin filament binding (ISS from mouse SF4 ortholog), lamellipodium, and apical plasma membrane (ISS from mouse). I rewrote the description and the three core functions, added 6 references with reference_review, and set status COMPLETE. ProtNLM2 predictions were not used.
