  summary: 'Create: DNAH12 gene review (SPGF100 axonemal dynein)'
  details: |
    Fresh review of DNAH12 (Q6ZR08) from just fetch-gene stubs (12 GOA rows). Evidence: full text of PMID:40146200 (eLife 2025) and PMID:39071892; abstracts of PMID:42321500, PMID:42522280, PMID:34089056, PMID:39267058, PMID:42838247. Key judgement: DNAH12 lacks a microtubule-binding domain, so the IEA minus-end-directed motor activity and microtubule-based movement rows are MARK_AS_OVER_ANNOTATED (not REMOVE, because the paper shows an MT-like region). Dynein complex was modified to inner dynein arm. Proposed NEW inner dynein arm assembly (GO:0036159). Dynein intermediate chain binding left UNDECIDED. A falcon deep-research run was started but had not finished when this review was written, so the review does not use it. Validated with just validate human DNAH12.
