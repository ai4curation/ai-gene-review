  summary: 'DNAH12: mouse ortholog, PANTHER family split, PAINT context'
  details: |
    Added the mouse ortholog (Dnah12, MGI:107720, Q3V0Q1) and the inner-arm family context to the description. Found that human DNAH12 has no IBA while mouse Dnah12 has 8, from PAINT nodes PTN000743491, PTN008951089 and PTN008503981 (QuickGO). The PANTHER 19 API shows the cause: human Q6ZR08 is in PTHR46532:SF11 and mouse Q3V0Q1 is in PTHR10676:SF255, the family containing those nodes. The InterPro/UniProt cross-references put both in PTHR22878:SF70. The GO:0008569 reason now frames the over-annotation as lineage-specific loss after PTN000743491. The NEW GO:0036159 reason now notes that PAINT already asserts it at PTN008951089. Added a suggested question asking PANTHER to reunite the orthologs. No actions changed.
