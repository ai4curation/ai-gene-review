  summary: 'Create review: APOOL'
  details: |
    Full end-to-end review of human APOOL/MIC27 (Q6UXV4, PANTHER PTHR14564): all 27 GOA rows reviewed plus one NEW row, with propagation_review on both IBAs and on the five IEA/IC rows carrying supporting_entities. Removed three name-driven annotations: GO:0005576 extracellular region and GO:0031093 platelet alpha granule lumen, which are a single Reactome projection over 67 gene products traceable to a 2004 platelet-releasate screen (PMID:14630798) and refuted by PMID:37279200 and PMID:23704930; and GO:0001401 SAM complex, an outer-membrane complex that an inner-membrane protein cannot be part of, where the same reference's MIB and MICOS rows already record the real relationship. Added GO:1901612 cardiolipin binding (IDA, PMID:23704930), the protein's only demonstrated molecular activity and absent from both GOA and the UniProt DR GO block. Modified the GO:0007007 IC row to the descendant GO:0042407. Marked the three bare protein-binding IPIs over-annotated rather than promoting them to a yeast-derived oligomer-stabilisation MF that human knockouts contradict. Both IBAs (PTN001803267) verdict NO_FAILURE_CORE; the cristae-formation node is seeded by MIC26 alone and is now independently corroborated on MIC27 by PMID:32788226. New bioinformatics analysis (APOOL-bioinformatics) shows the family's basic inter-transmembrane loop, APOOL 130-137 RKGSKFKK net +5, retained in 10/10 PTHR14564 members. Validated with just validate (valid, one deliberate deep-research warning), checkquotes.py (75 quotes, 0 failures), a duplicate-key loader, terms.csv deletion and duplicate checks, and a GOA-to-YAML reconciliation script.
