  summary: 'Create review: B2M'
  details: |
    De-novo review of human B2M (P61769), beta-2-microglobulin invariant light chain for MHC class I, MHC class Ib, CD1, MR1, HFE, and FcRn complexes. Curated all 176 GOA annotations, modifying GO:0002477 to GO:0002476 (endogenous peptide presentation via MHC class Ib for HLA-E/F/G) or GO:0019885 (endogenous peptide presentation via MHC class I for classical HLA-A2/Cw4) and GO:0005886 to GO:0009897 (external side of plasma membrane), removing over-propagated MHC class II IBA annotations and bare GO:0005515 rows, and separating core structural subunit roles in antigen-presenting versus non-antigen-presenting (HFE/FcRn) heavy-chain complexes.
