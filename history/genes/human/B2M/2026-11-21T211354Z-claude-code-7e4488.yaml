  details: |
    Re-review of the seven IBA rows marked REMOVE (projects/IBA_REVIEW/rereview-2026-11-21, batch H02), all projected from the PTHR19944 root node PTN000460629. Five rows (GO:0002503, GO:0019886, GO:0023026, GO:0042605, GO:0042613) keep REMOVE unchanged: they name the MHC class II complex or its peptide groove, every seed is an MHC class II or HLA-DM chain, and no leaf of the tetrapod B2M clade PTN000460891 has an experimental annotation to them (QuickGO, queried by GO id). Two rows, GO:0005765 lysosomal membrane and GO:0031902 late endosome membrane, were changed from REMOVE to MARK_AS_OVER_ANNOTATED. The earlier reason argued that B2M does not traffic in class II complexes, which is true of the seeds but does not exclude the compartment: the same review keeps Reactome early endosome membrane and phagocytic vesicle membrane rows for B2M bound to class I heavy chains. The node placement is doubtful for B2M and the term is unverified, so it is no longer asserted to be false. Validated with just validate human B2M (valid, no new warnings).
