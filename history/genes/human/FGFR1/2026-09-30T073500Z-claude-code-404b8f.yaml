  summary: Initial AI review of human FGFR1 GO annotations (196 rows) with core functions
  details: |
    Reviewed all 196 GOA rows: 127 ACCEPT, 20 KEEP_AS_NON_CORE, 18 MODIFY, 31 REMOVE, 0 UNDECIDED. Generic protein binding rows were modified to fibroblast growth factor binding (FGF-ligand partners) or phospholipase binding (PLCG1), otherwise removed as uninformative; MAPK cascade and MAP kinase activity terms modified to positive regulation of MAPK cascade; identical protein binding modified to protein homodimerization activity. Core functions: FGF receptor activity, FGF binding, heparin binding, protein tyrosine kinase activity at the plasma membrane. Added PMID:12627230 (Kallmann) and PMID:17623664 (FGF21/beta-Klotho) references; noted FGFR1c-Klotho FGF23 evidence (PMID:19966287) relevant to the FGFR signaling module.
