  summary: 'Fix domain architecture in description: RASAL2'
  details: |
    Corrected the description's domain architecture. It said 'N-terminal pleckstrin homology (PH) domains, tandem calcium-binding C2 domains (C2A and C2B), and a catalytic GAP domain at the C-terminus'. UniProt Q9UJF2 FT DOMAIN lines give one PH domain (41-158), one C2 domain (149-267) and the Ras-GAP domain (343-551) of 1139 aa, so the GAP domain is central, not C-terminal. Tandem C2 domains are the GAP1 subfamily layout (RASA2, RASA3, RASA4, RASAL1), not the SynGAP layout the same description assigns RASAL2 to. Annotations unchanged.
