  summary: Add residue-numbering caveat for RASAL2 phosphosites
  details: |
    The cited phosphosites S351 (PMID:33563064, AMPK) and Ser237 (PMID:33096593) are serines only in isoform 2 (Q9UJF2-2, 1280 aa; VAR_SEQ 1..4 replaces MQTP with a 152-residue extension, a +148 shift). In canonical Q9UJF2-1, position 237 is Lys and 351 is Asp. Converted to canonical numbering, Ser237 is Ser89, inside the PH domain (41-158), consistent with the source, and S351 is Ser203, in the C2 domain (149-267), contradicting the perplexity deep-research claim that S351 lies in the PH domain. Added caveats to the GO:0009749 review summary and to two curator-authored findings statements; verbatim supporting_text quotes left unchanged. No actions or terms changed. Follow-up to the review of PR 5338.
