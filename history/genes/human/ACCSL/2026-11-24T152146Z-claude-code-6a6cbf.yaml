  summary: Narrow the ACCSL gap with an OpenScientist PLP-site analysis; confirm Arg529
    is the majority allele
  details: |
    Ran OpenScientist (3 iterations) on ACCSL vs PLP-bound ACC synthases 1IAX/1B8G. Complete PLP site (K395, D358, R403, S394, N330, Y361; checked locally): PLP binding predicted for both alleles. SAM subsite degraded clade-wide (F272, F246, GCC loop) and Y423 at ACCS R351: ACC synthase activity predicted absent. Independently confirmed via gnomAD v4 that rs2074051 alternate (C529R) AF is 0.776 genomes / 0.759 exomes, so Arg529 is the majority allele, contradicting PMID:39876065. Gap OPEN -> NARROWING; run reference UNVERIFIED.
