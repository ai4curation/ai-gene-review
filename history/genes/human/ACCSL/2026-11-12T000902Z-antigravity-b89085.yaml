  summary: Create review for human ACCSL (Q4AC99) with Affinage evaluation
  details: |
    Created full curation review for human ACCSL (UniProtKB:Q4AC99, PTHR43795:SF1) with Affinage deep-research evaluation and active-site divergence analysis from Gao et al. 2025 (PMID:39876065). Documented retention of Lys395, Asp358, and Trp207 alongside loss-of-function active-site substitutions Cys529 (polymorphic rs2074051 p.Cys529Arg at hACCS Arg457) and Tyr423 (at hACCS Arg351). Removed two stale IBA rows (GO:0006520, GO:0008483) from retired PAINT node PTN002887088, marked InterPro2GO IEA GO:0030170 as MARK_AS_OVER_ANNOTATED on this unassayed putative pseudoenzyme, and recorded a WHOLLY_DARK biology knowledge gap.
