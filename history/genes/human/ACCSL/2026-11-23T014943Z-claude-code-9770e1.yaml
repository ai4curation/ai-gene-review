  summary: 'OpenScientist residue-loss test: Cys529 is the minor rs2074051 allele;
    withdrew C529 loss claims'
  details: |
    Ran a focused OpenScientist hypothesis (residue-loss-transaminase) on the contested GO:0008483 IBA, asking only whether the PLP lysine and the substrate alpha-carboxylate arginine are conserved; review decision withheld. The run found Lys395 conserved and showed that the reference Cys529, used by the review and PMID:39876065 as a natural loss of the arginine, is the minor allele of rs2074051. Verified with Ensembl REST: Arg allele 0.7586 gnomAD exomes, 0.776 gnomAD genomes, 0.794 1000 Genomes, ancestral. Withdrew the three Cys529 LOST residue claims, rewrote the description, IBA/IEA reasons and core function, and noted the haplotype issue on the PMID:39876065 reference. IBA REMOVE actions kept: they rest on the retired PAINT node PTN002887088 and plant-only donors, not on residue loss.
