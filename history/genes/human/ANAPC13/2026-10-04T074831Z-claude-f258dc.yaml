  summary: 'Initial review of human ANAPC13: core APC/C TPR-lobe stabilizing subunit;
    16 rows accepted, 7 protein-binding IPIs removed'
  details: |
    Reviewed 23 GOA rows. Accepted the APC/C complex, catabolism, ubiquitin chain-type, nucleus and cell-cycle regulation rows. The meiotic-regulation NAS is now supported by oocyte-arrest genetics (PMID:41997520). Removed 7 generic protein-binding IPIs (6 CDC23 interactome hits, already captured by the complex rows, and 1 WFS1 hit). Core function: keeps CDC16/CDC27 in the APC/C and is needed for ligase activity (PMID:15060174).
