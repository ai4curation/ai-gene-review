  summary: 'Initial review of human ANAPC13: core APC/C TPR-lobe stabilizing subunit;
    16 rows accepted, 7 protein-binding IPIs removed'
  details: |
    Reviewed 23 GOA rows. Accepted the APC/C complex, catabolism, ubiquitin chain-type, nucleus and cell-cycle regulation rows. The meiotic-regulation NAS is now supported by oocyte-arrest genetics (PMID:41997520). Removed 7 generic protein-binding IPIs (6 CDC23 interactome hits, already captured by the complex rows, and 1 WFS1 hit). Core function: keeps CDC16/CDC27 in the APC/C and is needed for ligase activity (PMID:15060174).
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - references
  - core_functions
  - suggested_questions
  summary: 'Round 2 (#4056 review): cite Arc Lamp position, nucleus row to non-core on mixed human evidence, second infertility cohort, citation hygiene'
  details: |
    Cited PMID:25490258 for APC13's Arc Lamp position. Changed the nucleus IEA from ACCEPT to KEEP_AS_NON_CORE: yeast Swm1p is nuclear (PMID:10022899), but overexpressed wild-type human APC13 is mainly cytoplasmic (PMID:40238067). Added PMID:40238067 to the meiosis row, noting that it shares the p.D2E variant with PMID:41997520. The CDC23 REMOVE reasons no longer rely on yeast data. The affinage reference_review now accounts for all its citations. Added an adaptor-MF question and fixed a label typo.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - references
  summary: 'Round 3 (#4056 review): correct the PMID:40238067 allele framing; spell out the overexpression caveat on the nucleus row'
  details: |
    Corrects the round-2 claim that PMID:40238067 adds a second family but not an independent allele. Its case 3 carries p.D2E with an independent frameshift (p.P39QfsTer25), so p.D2E recurs independently. The meiosis row now quotes that sentence. The nucleus KEEP_AS_NON_CORE reason now notes that the cytoplasmic wild-type result is an overexpression readout. PMID:10022899 relevance raised to MEDIUM.
