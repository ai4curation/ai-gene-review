  summary: 'Create review: human ACP1'
  details: |
    Created the human ACP1 gene review from UniProt, GOA, PANTHER/PAINT and cached publication evidence. Reviewed all 20 GOA rows, retaining generic acid-phosphatase activity as non-core, accepting non-membrane-spanning protein tyrosine phosphatase activity as ACP1's core molecular function, refining broad protein tyrosine phosphatase and cytoplasm rows, removing bare protein-binding rows by policy, and marking rat-derived synapse and HDA exosome rows as over-annotations. Manual notes record the failed deep-research attempts, the PAINT pass and the abstract/full-text evidence used for the localization and interaction calls. Validated the review with just validate human ACP1 and just validate-quotes.
