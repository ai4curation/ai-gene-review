  summary: 'Create review: CTNNB1'
  details: |
    Created a DRAFT review of human beta-catenin (P35222) for Track B of ORIGINS_OF_MULTICELLULARITY. All 723 GOA rows reviewed (254 ACCEPT, 112 KEEP_AS_NON_CORE, 217 MODIFY, 126 REMOVE, 13 MARK_AS_OVER_ANNOTATED, 1 UNDECIDED). The 335 generic protein-binding rows were MODIFIED to partner-defined MFs (cadherin, alpha-catenin, DNA-binding TF, nuclear receptor, protein kinase/phosphatase, E3 ligase, PDZ domain, HAT/HDAC, coregulator binding) or REMOVED. Substrate-type ubiquitination/catabolism process rows were removed, obsolete GO:0030331 was mapped to GO:0016922, and GO:0070602 was corrected to centriole-centriole cohesion. Core functions: TCF/LEF transcription coactivator activity, cadherin binding and alpha-catenin binding. Manual notes replace deep research (no provider keys). A UniProt/PANTHER census in CTNNB1-bioinformatics finds no beta-catenin-family members outside animals and places Dictyostelium Aardvark in a different ARM family. Validated with just validate human CTNNB1 (1 warning).
