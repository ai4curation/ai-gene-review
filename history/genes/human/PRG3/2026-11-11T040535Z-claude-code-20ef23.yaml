  summary: Bring the extracellular matrix rows into line with the family review
  details: |
    Follow-up to the REMOVE re-review of this file, after running the family/gene cross-check that CI runs on changed gene reviews. The extracellular matrix rows [3] and [5] (HDA; PMID:28344315, PMID:25037231) had been moved from REMOVE to KEEP_AS_NON_CORE on the ground that two matrix proteomics studies detected the protein. The curated review of its PANTHER family (interpro/panther/PTHR22803/PTHR22803-review.yaml) scopes GO:0031012 as NOT_APPLICABLE, so a gene review may not retain the term, and detection in a matrix-enriched preparation does not establish residence in the matrix for a secreted eosinophil granule protein. The rows are now MARK_AS_OVER_ANNOTATED: the observation is not treated as false, and the location is not retained. Validated with ai-gene-review validate --terms (valid, no new warning) and with python -m ai_gene_review.validation.family_gene_crosscheck (0 conflicts; 2 before the change).
