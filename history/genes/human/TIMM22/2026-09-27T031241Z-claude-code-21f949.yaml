  summary: Replace obsolete GO:0030943 (mitochondrion targeting sequence binding)
  details: |
    GO:0030943 is obsolete in GO release 2026-07-26 (consider GO:0140436 / GO:0008320; confirmed in OLS4). GOA rows keep term.id; the change is expressed as proposed_replacement_terms. TIMM22 is the TIM22 carrier-pathway channel/insertase, not a receptor. Its IBA row (PTN000364156, the same node as yeast TIM22) was first kept as MARK_AS_OVER_ANNOTATED, then harmonized with yeast TIM22 in review round 1 to MODIFY -> GO:0008320, folding into the GO:0008320 IBA TIMM22 already carries (nothing new asserted).
