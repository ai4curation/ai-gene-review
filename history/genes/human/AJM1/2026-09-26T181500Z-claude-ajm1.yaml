  summary: First review of human AJM1, whose eight annotations reduce to one worm protein
  details: |
    7 ACCEPT, 1 REMOVE. Human AJM1 has no experimental GO annotation, and seven of its eight rows
    trace to C. elegans ajm-1 (UniProtKB:A0A1C3NSL9 / WB:WBGene00000100). The set looks diverse -
    three evidence codes across four GO_REFs - but the three UniProt SubCell IEAs are second-order,
    since every SUBCELLULAR LOCATION statement in the human entry is a by-similarity inference from
    the worm protein. Only the InterPro row (IPR038825) is independent of the worm gene.

    The removal is GO:0005929 cilium. The human IEA derives from UniProt SubCell, which derives from
    UniProt's by-similarity cilium statement, whose worm source is itself only IEA - inference on
    inference with no measurement at any step. The worm's one experimentally grounded ciliary
    annotation is GO:0036064 ciliary basal body (IDA), from a study that confines the AJM-1 mechanism
    to nematodes and reserves the conserved claim for Girdin.

    An objection was raised and withdrawn: GO:0043296 apical junction complex looked like a lineage
    mismatch, since the nematode CeAJ is not built from vertebrate parts. The term DEFINITION spans
    both vertebrate and invertebrate apical junctions deliberately, so the objection does not stand.

    core_functions asserts no molecular_function. The worm donor's only MF annotation is cytoskeletal
    protein binding with TAS evidence, too weak and generic to transfer, and minting a
    structural-constituent term for a protein with zero human data would be over-annotation.

    Deep research: affinage REFUSED to write a record, its symbol-collision trust gate tripping
    BLOCKING on a C. elegans narrative for a human record. Inspection of the quarantined output
    confirmed the gate was right. Falcon was used as the fallback and handled the ambiguity
    correctly.
- type: REVIEW
  outcome: changed
  sections:
  - existing_annotations
  - references
  - notes
  summary: Round 2 - correct two mis-anchored file quotes and commit a donor GOA snapshot
  details: |
    Two supporting_text quotes pointed at the wrong lines, which CI cannot catch because it does not
    substring-check file: references. The GO:0005929 cilium row anchored its claim about UniProt's
    by-similarity CILIUM statement to the apical-cell-membrane line; it now cites "Cell projection,
    cilium". The GO:0005912 row cited the FUNCTION line to support a location transfer; it now cites
    "Cell junction, adherens junction".

    Six load-bearing facts about the donor's own GOA existed only as prose, including "worm
    GO:0005929 is itself only IEA", which is the removal itself. Added
    AJM1-donor-goa-check.json following the SAMD8-reaction-donor-check.json convention: the full
    19-row QuickGO snapshot with query URL, retrieval timestamp, sha256 of the raw response, and a
    claims_this_supports block in which each claim names the row that would falsify it.

    The GO:0005912 row argued against itself - recording that AJM-1 sits basal to and distinct from
    the cadherin-catenin complex, calling that "a neighbouring-domain description", then accepting.
    The reasoning was withdrawn rather than the action: that reading came from the abstract, whereas
    the WormBase curator who made the IDA read the full text.

    Round 3 additionally scoped the UniProt references[] finding to what its quote can actually show,
    since UniProt places each location's ECO tag after the statement across a CC line wrap so no
    contiguous quote can prove a single location's by-similarity status; the three-way claim remains
    in review_notes where it is correct. The donor snapshot also gained its own references[] entry
    with reference_review, having been cited seven times without one.
