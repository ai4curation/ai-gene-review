  summary: Full re-review of BCAT2 (O15382) independent of ProtNLM2 predictions
  details: |
    Full re-review of all 41 GOA rows for ProtNLM2 benchmark target O15382 (canonical Swiss-Prot entry, not a fragment), grounded in PANTHER PTHR11825:SF39 and PAINT nodes PTN000214535/PTN000214536. Seven bare GO:0005515 IPI rows (HSPD1, YBEY) changed KEEP_AS_NON_CORE -> REMOVE per the protein-binding policy. GO:0009081 ACCEPT -> MODIFY to the already-carried GO:0009083 (refinement rule). GO:1903444 involved_in negative regulation of brown fat cell differentiation -> MARK_AS_OVER_ANNOTATED: the human GO-CAM puts that term on EP300 and has BCAT2 upstream as the BCAA-catabolic enzyme, a role kept via the acts_upstream_of_negative_effect GO:0050873 row. GO:0097009 energy homeostasis (IEA from mouse) -> MARK_AS_OVER_ANNOTATED as a downstream organismal phenotype. Other actions, description and core function were re-examined and kept. Next relative: mouse Bcat2 O35855 (same subfamily SF39, PAINT seed), not yet reviewed.
