  summary: Review human CEP120 centriole construction and microtubule binding
  details: |
    First substantive ClinGen campaign review of all 21 human CEP120 annotations, preserving exact source objects, ten original reference IDs and titles, and three UniProt products. Retain the specific CEP162 interaction separately from direct human microtubule binding. Refine three broad electronic processes to the supported duplication, elongation and cilium assembly functions; 17 ACCEPT, one KEEP_AS_NON_CORE and three MODIFY, with no NEW assertions. Distinguish original PMID27185865 preservation of CEP295 recruitment after CEP120 depletion from independently supported recruitment of other distal components in PMID30988386. Preserve partial ciliation rescue, concentration dependence and mouse quiescent-cell evidence scope. Represent the directly assayed microtubule-binding core without assigning a specific polymerase mechanism from inaccessible assembly kinetics. Include literal interaction and mouse donor extracts, nine genuine normal missing publication caches, and two exact-main cache reuses. ROOT independently read all decisions, references, notes and core, selected actual human binding Methods and Figures4–5, original CEP295 recruitment Results, and independent human recruitment/rescue evidence, and reproduced literal machine-source extraction. Normal validation, status, rendering and history pass with two explained advisories. Genuine research-provider failures are disclosed and no provider report is fabricated.
