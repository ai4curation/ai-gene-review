  summary: 'Create review: UNC93B1'
  details: |
    Curated all 65 GOA annotations for UNC93B1, an ER chaperone/trafficking factor for nucleotide-sensing TLRs. Core functions set to protein carrier chaperone (GO:0140597) + Toll-like receptor binding (GO:0035325) with intracellular protein transport (GO:0006886); ER/endosome/lysosome/Golgi locations accepted. Applied the participation test to the TLR3/7/9 and general TLR signalling-pathway process terms (GO:0034138/0034154/0034162/0002224): UNC93B1 is necessary for these pathways but acts upstream as a trafficking chaperone and is dispensable for ligand recognition/signal initiation (PMID:18305481), so these experimental (IMP/IBA) annotations are retained as KEEP_AS_NON_CORE rather than removed, deferring to the curators. Two generic protein-binding rows with TLR8 (PMID:22164301, PMID:33961781) MODIFY to Toll-like receptor binding; 27 generic protein-binding rows from high-throughput interactome/proteomics screens (HuRI PMID:32296183, ISG-AP-MS PMID:30833792, SARS-CoV-2 PMID:33845483) REMOVE as uninformative. Validation passes (1 non-blocking warning: GO:0140597 core MF not in existing_annotations); reference validation passes.
