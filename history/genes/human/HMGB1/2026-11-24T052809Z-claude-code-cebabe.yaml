  summary: Re-quote two PMID:15014079 rows from the abstract instead of a date-plus-title
    fragment
  details: |
    Two rows cited PMID:15014079 with supporting_text '2004 Mar 9. Evidence for involvement of HMGB1 protein in human DNA mismatch repair.': the GO:0005515 MODIFY row (replacement GO:0044877) and the GO:0032425 IDA ACCEPT row. That text is a PubMed Epub date joined to the paper title, not a finding, and it matched only because the cached record is in a layout that repeats the MEDLINE citation block in its body; re-caching the record in the reference validator's own layout would break both quotes. Replaced both with the abstract sentence 'Evidence is also presented that HMGB1 physically interacts with MutSalpha and is required at a step prior to the excision of mispaired nucleotide in mismatch repair.', which supports the MutSalpha interaction behind the MODIFY and the mismatch-repair involvement behind the ACCEPT. Actions, reasons and replacement terms are unchanged.
