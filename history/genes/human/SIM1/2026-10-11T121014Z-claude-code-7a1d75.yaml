  summary: 'Review round 1: SIM1'
  details: |
    Review round 1 for PR 4814. The notes header said deep research failed; the report exists and was checked against the review. It answers suggested question 1, which asked whether SIM1 has a postnatal role separable from PVN development: postnatal CNS deletion of Sim1 in mouse is by itself sufficient to cause hyperphagic obesity, dosage-dependently, with reduced hypothalamic Oxt and PVN Mc4r and without global PVN hypocellularity or loss of the examined projections. Fetched and cited the primary source (PMID:20220015, Tolson 2010) and rewrote the question so it asks the part that is still open, namely whether the adult requirement is direct transcriptional maintenance of Oxt and Mc4r or maintenance of the neuronal identity, and whether the same holds in human carriers.
