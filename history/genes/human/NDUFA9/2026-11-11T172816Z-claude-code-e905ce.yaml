    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (NDUFA9-phylo.yaml, from `just phylo human NDUFA9`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

