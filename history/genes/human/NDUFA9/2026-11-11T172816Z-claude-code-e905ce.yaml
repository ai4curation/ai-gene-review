  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (NDUFA9-phylo.yaml, from `just phylo human NDUFA9`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0006744 (REMOVE): the reason made a claim the tree contradicts (Propagation_review describes PomBase:SPCC1840.09 as a 'Fission yeast Complex I-related family member' whose term 'conflates acting on ubiquinone with synthesizing it', and the summary says the propagation 'likely conflated acts on ubiquinone with makes ubiquinone' - the two seeds are S. pombe coq11 (ubiquinone biosynthesis protein) and S. cerevisiae COQ11, in subfamily SF16, paralogs of NDUFA9 joined at a pre-eukaryotic duplication with 22% identity; the term is not a conflation at the source but a transfer from a paralogous subfamily via the family root.). The reason was rewritten to correct it; the rest of its argument is kept. The script also changed the row's failure modes as the reading proposed (removed ROLE_CONFLATION; added WRONG_ORTHOLOG_OR_PARALOG).
    - GO:0044877 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree NDUFA9 is itself the single seed, 23 steps below the family root across 2 duplications and 1 horizontal-transfer node, so for NDUFA9 the row rests only on its own experimental annotation and the verdict rests on the informativeness of the term.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
