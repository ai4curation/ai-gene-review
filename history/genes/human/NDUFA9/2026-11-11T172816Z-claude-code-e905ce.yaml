    - GO:0044877 (MARK_AS_OVER_ANNOTATED): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree NDUFA9 is itself the single seed, 23 steps below the family root across 2 duplications and 1 horizontal-transfer node, so for NDUFA9 the row rests only on its own experimental annotation and the verdict rests on the informativeness of the term.

    Each row now quotes its own extract in supported_by; the quotes were assembled from the file's sentences by projects/IBA_REVIEW/tree-rereview/tree_rereview.py and checked verbatim. The review validates after the edit.
