  summary: De-novo GO annotation review of human SLC10A4 (Q96EP9), an orphan SLC10/BASS
    carrier
  details: |
    Reviewed all 13 seeded annotations. Tally: 4 ACCEPT (negated GO:0008508 IMP, GO:0016020 IEA, GO:0022857 IBA, GO:0055085 IEA), 2 KEEP_AS_NON_CORE (GO:0005886 located_in IDA and IEA), 1 MODIFY (GO:0005886 is_active_in IBA -> GO:0030672 synaptic vesicle membrane), 6 REMOVE (5x GO:0005515 protein binding from HuRI PMID:32296183 as uninformative; GO:0015721 bile acid and bile salt transport IBA as an over-propagation contradicted by the record's own NOT annotation and by four independent transport studies). Key judgement: the GO:0008508 row is NOT|enables (negated); PMID:23589386 opens by stating SLC10A4 has no bile acid transport activity and hedges its protease-activation conclusion, and UniProt's FUNCTION comment from the same paper records no significant activity, so the negation was accepted rather than challenged. No core molecular function could be assigned beyond the substrate-agnostic parent GO:0022857; a BIOLOGY/MF_DARK knowledge gap records the unidentified substrate. Deep research providers were unavailable in the container (Falcon 402, OpenAI 401, perplexity unregistered); synthesis was written manually into SLC10A4-notes.md and 10 publications were newly cached. One advisory validator warning remains for differing actions across the three GO:0005886 rows, which is deliberate and tracks the is_active_in versus located_in distinction.
