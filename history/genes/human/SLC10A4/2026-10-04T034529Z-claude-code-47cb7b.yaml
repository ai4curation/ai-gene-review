  summary: Add SLC10 pocket-conservation structural analysis; wire into SLC10A4 and
    SLC10A7 reviews
  details: |
    Reproducible structural analysis in genes/human/SLC10A4/SLC10A4-bioinformatics/. Functional sites were defined from ligand contacts in experimental human NTCP cryo-EM structures (sodium in 7ZYI and 9QZQ; N-tetradecanoylglycine, the HBV preS1 myristoyl anchor, in 8RQF) rather than from memory, with author numbering verified to index into UniProt Q14973. Each paralogue was compared via its AlphaFold DB v6 model, with TM-align for fold similarity and a global BLOSUM62 alignment for residue correspondence. A method control on the SLC10A1 model itself rejected an initial geometric nearest-neighbour correspondence, which frame-shifted the control by four residues; the sequence-based mapping recovers the control exactly (13/13, 12/12, 6/6). Result: SLC10A4 retains 11 of 12 sodium-contacting positions (only C260 to S338), refuting the hypothesis that structural degeneration explains its orphan status and supporting the existing argument that GO:0022857 should stay at the uninformative parent. SLC10A7 retains only 3 of 12, including E257 to phenylalanine and N106 to alanine, while SLC10A2 and SLC10A6 (both experimentally sodium-coupled) retain the site, making SLC10A7 the sole divergent member. The myristoyl/preS1 pocket is NTCP-specific; no paralogue retains it. Cited as file: references supporting structural premises only; no review action was changed on prediction-based evidence.
