  summary: Full review of PLD6/MitoPLD; cardiolipin phospholipase D (RHEA:44884) rows
    kept as non-core contested activity, ssRNA endonuclease taken as core
  details: |
    Created the full review of all 33 GOA rows for human PLD6 (Q8N2A8), part of a
    batch checking genes behind GO Rhea cross-references (RHEA:44884).
    GO:0035755 cardiolipin phospholipase D activity (IBA, IDA x2, IEA/Rhea): all
    KEEP_AS_NON_CORE. Cardiolipin hydrolysis was reported for the human protein
    (PMID:17028579) and catalysis-dependent mitochondrial-surface PA is seen in cells
    (PMID:21397848, PMID:41640016), but purified mouse PLD6 showed no cardiolipin
    hydrolysis (PMID:23064227) and lipidomics found no PA change (PMID:24599962).
    The ssRNA endonuclease (GO:0016891; human nuclease assay PMID:28063496) is the
    core MF, with piRNA processing; mitochondrial fusion kept as a second core role
    without an asserted MF, plus a BIOLOGY knowledge gap on the PA source.
    Protein binding x3 REMOVE (policy); Golgi IEA, phospholipid biosynthesis IDA,
    oogenesis IBA and meiotic cell cycle x3 MARK_AS_OVER_ANNOTATED.
    Literature search recorded in PLD6-notes.md; no deep-research provider file.
