  summary: 'Create review: MRPS22'
  details: |
    De-novo review of MRPS22 (mS22), a participant of modules/mitochondrial_translation.yaml. All 25 GOA rows reviewed: 11 ACCEPT, 12 KEEP_AS_NON_CORE (mitochondrial inner membrane, Reactome TAS/NAS), 2 REMOVE (protein binding to MRPS18B). Core function: structural constituent of the mitochondrial small ribosomal subunit supporting mitochondrial translation. Evidence from Koc 2000 proteomics, the human mitoribosome cryo-EM structure, and COXPD5 patient studies (Saada 2007; Smits 2011, fetched) with cDNA rescue of 12S rRNA and OXPHOS. Claude Code deep research was thin (2 web searches) and used as leads only. Validated with just validate human MRPS22.
