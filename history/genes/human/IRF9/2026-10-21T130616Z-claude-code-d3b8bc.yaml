  summary: 'Create review: IRF9 (Q00978)'
  details: |
    De-novo review of human IRF9 as the experimentally characterised PTHR11949:SF26 relative of donkey A0A9L0I7X9, independent of ProtNLM2 predictions. Deep research (falcon and perplexity-lite fallback) failed with authentication errors, so the review rests on cached literature (PMID:1630447, PMID:30143481, PMID:24065129, PMID:29317535, PMID:17923090, PMID:9078371, PMID:11846981). All 40 GOA rows reviewed: ISRE DNA binding, RNAPII DbTF activity, ISGF3 complex, positive regulation of RNAPII transcription and nuclear/cytoplasmic locations accepted; general terms (GO:0000976, GO:0003700, GO:0006355, GO:0006357, GO:0006366, GO:0007166, GO:0002376) modified to specific terms the gene carries; STAT2 protein-binding rows from low-throughput papers modified to DNA-binding transcription factor binding, IFNAR2 row to cytokine receptor binding, high-throughput protein-binding rows removed. Added NEW GO:0060337 type I interferon-mediated signaling pathway (IMP, PMID:30143481) after a comparator check showing STAT1 and STAT2 carry it experimentally while IRF9 does not. Cached 5 additional publications.
