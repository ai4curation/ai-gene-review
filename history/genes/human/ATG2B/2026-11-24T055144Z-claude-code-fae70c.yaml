  summary: 'IBA over-annotation re-review: GO:0032266 changed to KEEP_AS_NON_CORE'
  details: |
    Re-review of IBA rows marked MARK_AS_OVER_ANNOTATED against the PAINT tree (projects/IBA_REVIEW/overannotated-2026-11-24, batch H08). GO:0032266 phosphatidylinositol-3-phosphate binding changed from MARK_AS_OVER_ANNOTATED to KEEP_AS_NON_CORE. The IBD sits on the family root PTN000324023 with one seed, yeast ATG2, whose IDA (PMID:27498190) is a direct binding assay on an APT1-containing fragment. ATG2B is inside the seeded clade (joins the seed at PTN000324025) and no loss is recorded on its lineage. The earlier reason was absence of an ATG2B-specific assay and that ATG2B binds liposomes without PI3P, neither of which argues against the term. Non-core because the defining activity is lipid transfer. Consistent with the human ATG2A review, which accepts the same inherited row.
