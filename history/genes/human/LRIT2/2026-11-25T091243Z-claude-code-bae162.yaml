- type: EDIT
  outcome: changed
  summary: Record OpenScientist isoform analysis refuting a domain-content difference
    in LRIT2
  details: |
    Ran an OpenScientist deep-research job (kgap-lrit2-isoform-domains) on the knowledge gap covering comparison of LRIT2 isoforms 1 and 2. The run refutes the premise of the question: the two isoforms do not differ in domain content. Isoform 2 is the canonical sequence carrying a single 10-residue in-frame insertion, GLLGGKHLTP after Asp297, at 100 per cent identity over the canonical length with no substitutions, and every annotated feature is present in both, simply shifted by ten residues downstream of the insertion point. The local A6NDA9 record states exactly this as VAR_SEQ 297, D to DGLLGGKHLTP, and every feature boundary the run quotes was confirmed there: signal peptide 1-19, LRRNT 23-54, the four leucine-rich repeats, LRRCT 200-252, the immunoglobulin-like domain 253-341, the 274-327 disulfide, N-glycosylation at Asn52, fibronectin type-III 361-451 and the transmembrane helix 466-486. Both are predicted single-pass type I membrane proteins, neither is secreted, and there is no alternative start, internal exon replacement or truncation.

    The run further argues the isoform annotation should not carry functional weight, on five independent lines: the 30-nucleotide cassette exon that creates the insertion has no vertebrate constraint, no primate-specific constraint, no human population constraint, its transcript has zero median expression across all 54 GTEx tissues, and its only cDNA comes from a library pooled across non-retinal tissues while the single adult retina cDNA skips the exon. Its own framing is the careful one, a splice-competent cryptic or low-frequency alternative exon rather than a sequencing error or a functional isoform. The local record independently supports the clone-provenance argument, since the isoform rests on an author statement from a cDNA paper, evidence code ECO:0000303.

    Status moved from OPEN to NARROWING, with the boundary noting that the gap is largely dissolved rather than answered: there is no domain-content difference to compare. The gap's existing significance note, that isoform 2 alters the immunoglobulin-like domain, is right about the location, since the insertion sits mid-strand in an Ig-domain beta hairpin two strands from the structural disulfide, but should not be read as altered domain composition; that distinction is now recorded explicitly.

    Three limits are recorded with the result. Nothing here is experimental, no LRIT2 isoform having been assayed and no quantitative retinal isoform ratio existing, and since GTEx contains no retina the expression result bounds non-retinal tissue only. Isoform 2 was never folded because the structure-prediction service failed on every attempt, so the fold-destabilisation claim is inference from the isoform 1 model. And the run records a self-correction, a splice-site percentile reported mid-run that did not replicate against independent background sets and was revised downward. No annotation action was taken.
