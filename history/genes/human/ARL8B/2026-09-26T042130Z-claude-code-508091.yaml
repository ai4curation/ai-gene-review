  outcome: changed
  summary: Remove a full_text_unavailable declaration that is false
  details: |
    Follow-up to the record written earlier in this PR. The reviewer noted that commit
    1ae5eb567's message says "The 32 full_text_unavailable declarations from the previous
    revision are reverted" while the declarations are still present. That claim is false:
    the PR adds 26 such lines against origin/main and removes none.

    Auditing all 33 declarations in the changed files against the cache showed 32 are
    accurate - the cited record genuinely has no cached full text - and one is not:
    PMID:38296963 on ARL8B was declared full_text_unavailable while the cache does hold
    its full text. That one is removed here.

    The other 32 are kept deliberately. Under this PR's rule the flag no longer excuses a
    mismatch, so it is inert with respect to validation, but it remains true and useful
    metadata about the cached record, which is what the code comment in validator.py says
    it is for. What was wrong was the commit message, not the data; append-only means the
    correction goes here rather than into a rewritten message.
