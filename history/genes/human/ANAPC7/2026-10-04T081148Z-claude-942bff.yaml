  summary: 'Initial review of human ANAPC7: TPR subunit needed for APC/C substrate
    recruitment; heterochromatin IMP over-annotated, mitotic and location rows non-core'
  details: |
    Reviewed 70 GOA rows. Accepted the APC/C complex, enzyme-substrate adaptor activity, catabolism, ubiquitination, nucleus and Reactome location rows. MARK_AS_OVER_ANNOTATED the heterochromatin IMP: Ki-67, not APC7, is shown there (PMID:34942119). Kept as non-core the mitotic IBAs and NAS (APC7 loss does not lengthen mitosis), brain development, spindle/microtubule/midbody locations, PTEN binding and the meiotic NAS. Affinage tripped its trust gate and is not used.
- type: EDIT
  outcome: changed
  sections:
  - existing_annotations
  - core_functions
  - references
  summary: 'Round 2 (#4061 review): heterochromatin IMP to MODIFY GO:0120261; core locations; positive support for cytoskeletal rows'
  details: |
    Changed the heterochromatin IMP from MARK_AS_OVER_ANNOTATED to MODIFY with GO:0120261 regulation of heterochromatin organization, citing the major-satellite transcription result in PMID:34942119, and added that term to core_functions. Added cytosol and nucleoplasm to core_functions.locations. The cytoskeletal KEEP_AS_NON_CORE rows now cite UniProt's spindle/microtubule note, the HPA-only intercellular bridge row states it has no quotable source, and the GO:0005856/GO:0015630 redundancy is noted. The PMID:29033132 catabolism row quotes its own paper, and PMID:15678131 has a reference_review.
