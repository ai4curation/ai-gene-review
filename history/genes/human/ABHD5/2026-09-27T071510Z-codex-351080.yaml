  summary: Review ABHD5 catalytic evidence and lipid-enzyme regulatory functions
  details: |
    Audited all 44 normal-fetched source assertions for human ABHD5/Q8WTS1,
    preserving every source field, the NOT GO:0004806 qualifier, partner isoform
    identifiers, 11 original reference id/title pairs and exact UniProt/GOA bytes.
    Final decisions are 15 ACCEPT, 28 REMOVE and 1 MODIFY, with no NEW assertion.
    Twenty generic binding removals do not deny the reported interactions.
    Contaminant-controlled PMID:24879803, including human ABHD5 expressed in yeast,
    challenges direct LPA acyltransferase and its direct phosphatidic-acid synthesis
    mechanism; family lipid hydrolase transfers are assessed against target-specific
    biochemical divergence. The separate reported HDAC4 proteolysis is retained in
    contextual prose, without a blanket claim that ABHD5 lacks catalytic activity.
    Two core units distinguish ATGL activation from PNPLA1 spatial/regulatory
    support. Human constructs, mouse proteins, cell hosts, mutant rescue and assay
    substrate boundaries are explicit. No intrinsic transacylase or speculative
    process function is manufactured from necessity evidence.
    The required fresh Falcon/fallback invocation and concurrent seed-cache command
    failed during dependency resolution before provider dispatch on PyPI DNS errors.
    Installed normal PMID fetching subsequently failed on five required records:
    PMID:25315780, PMID:30361410, PMID:31742248, PMID:37087101 and PMID:40818613.
    No provider report or publication record was fabricated or modified. Primary
    external full-text access is documented separately from local cache availability.
    Root independently read all decisions, 19 reference assessments, both cores and
    questions and rechecked the key primary assays; biological review passed.
