  details: |
    Re-read of the overruled IBA rows against the PANTHER 19.0 tree and family alignment (ABHD5-phylo.yaml, from `just phylo human ABHD5`). An agent read each row's verdict and reasons next to the extract's facts for the same row; a second agent checked every correction and a sample of the rest. Verdicts are unchanged.

    - GO:0004620 (REMOVE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree ABHD5 is 21 steps below the node across 2 duplications and the seeds are 3 orthologs across later duplications and 1 paralog of ABHD5. The tree neither supports nor contradicts the removal, which rests on assays of the human protein and its active-site residue.
    - GO:0006654 (REMOVE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree ABHD5 is itself a seed and the other seed is an ortholog across later duplications of ABHD5. The tree does not bear on the verdict, which rejects the seed evidence itself and overrules the gene's own experimental row for the same reason.
    - GO:0042171 (REMOVE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree ABHD5 is itself a seed and the other seeds are 2 orthologs across later duplications of ABHD5. The tree does not bear on the verdict, which rejects the seed evidence itself and overrules the gene's own experimental row for the same reason.
    - GO:0052689 (REMOVE): the verdict rests on evidence the tree does not speak to, and the tree contradicts nothing stated. Added to the reason: In the PANTHER 19.0 tree ABHD5 is 21 steps below the node across 2 duplications and the seeds are 3 orthologs across later duplications and 1 paralog of ABHD5. The tree neither supports nor contradicts the removal, which rests on assays of the human protein and its active-site residue.

