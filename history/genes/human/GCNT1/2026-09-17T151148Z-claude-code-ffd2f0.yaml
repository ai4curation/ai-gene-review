  summary: Strengthen nuclear speck REMOVE with verified HPA comparator evidence
  details: |
    Blinded OpenScientist function-assignment run on GO:0016607 corroborated this review's REMOVE and supplied a stronger argument than the topological one alone: enzymes with genuine nuclear background (GCNT4, ST6GALNAC1, FUT8) retain a Golgi call alongside it, whereas GCNT1's nuclear call replaces the Golgi entirely, which is the signature of an antibody that misses its true target. The comparator panel was re-queried directly against the Human Protein Atlas API. Central claim confirmed: of the eight panel genes with informative IF records, GCNT1 is the only one called 'Nuclear speckles'. A subsidiary claim in the report is WRONG and is recorded as such in reference_review rather than repeated: it asserts GCNT1 uniquely carries no Golgi call and lists C1GALT1 and GCNT2 as having no HPA data, but both have records and C1GALT1 is called 'Nuclear bodies, Cytosol' with no Golgi call either. Added two suggested questions: a possible antibody-class artefact across core-1/core-2 O-glycan enzymes, and a gated lead that PMID:35279766 reports shed peptides mapping to GCNT1, recorded as a lead only for consistency with the GALNT1 downgrade.
