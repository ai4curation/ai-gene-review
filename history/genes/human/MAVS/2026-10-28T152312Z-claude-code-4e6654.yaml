  summary: Create the human MAVS gene review; review all 230 GOA rows
  details: |
    New review for Q7Z434, written in response to the litscan:module-member handoff #3923 (MAVS maintains mitochondrial import competence, PMID:42808786) and because PR #5620 identified genes/human/MAVS as a missing prerequisite for any MAVS-regulation arm of modules/rig_i_signaling.yaml.

    All 230 GOA rows reviewed: 109 ACCEPT, 64 REMOVE (every one a bare GO:0005515 row, under the protein-binding policy), 42 MODIFY, 11 KEEP_AS_NON_CORE, 4 MARK_AS_OVER_ANNOTATED. Three core functions: signalling adaptor activity at the mitochondrial outer and peroxisomal membranes; CARD-mediated sensor engagement and self-templated polymerisation; adaptor for NLRP3 recruitment to mitochondria.

    Notable judgements, all argued in MAVS-notes.md: GO:0060337, GO:0060340 and GO:0035458 are interferon-direction errors modified to the interferon-production terms the gene already carries; GO:0051262 protein tetramerization is modified to GO:0051258 protein polymerization because the word tetramer appears nowhere in PMID:31390091 and oligomerisation there was enforced with GCN4 peptides; GO:0031966 is refined to GO:0005741 while the root organelle terms GO:0005739 and GO:0005777 are kept per projects/ORGANELLES.md; GO:0140693 molecular condensate scaffold activity is ACCEPTed deferring to its deliberate use for MAVS in two GO-CAM models, with the filament-versus-condensate question raised as a suggested question and a BIOLOGY+ONTOLOGY knowledge gap.

    No NEW annotation proposed. The 2026 mitochondrial-import result is recorded as a knowledge gap with a matched suggested experiment rather than asserted: single paper, abstract-only cache (no PMC record), and the causal order between loss of TOM assembly and the fragmentation/mitophagy phenotype cannot be read from the abstract.

    Determination for #3923: not added to modules/rig_i_signaling.yaml, and that file is deliberately untouched so this does not conflict with the open PR #5620, which edits the same module notes.

    just deep-research human MAVS --provider perplexity failed (no API keys in this environment); no deep-research file was written or fabricated, and MAVS-notes.md carries the literature synthesis instead.
