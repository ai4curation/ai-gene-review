  summary: Initial review of PTK2B/Pyk2 (145 GOA rows)
  details: |
    Reviewed all 145 GOA rows. Core: non-receptor tyrosine kinase (GO:0004715) autophosphorylating at Tyr402 to recruit SRC-family kinases; integrin/GPCR signalling, actin cytoskeleton, cell adhesion and migration, ERK/JNK cascades. Removed GO:0004683 CaMK activity (Pyk2 is a tyrosine kinase; Ca2+ activation is indirect). Flagged PMID:8497321 as probable mis-citation (describes an SH3-containing Cdc42-binding kinase, not Pyk2). MODIFIED generic kinase and SRC/FYN protein-binding rows to specific terms; removed uninformative protein-binding IPI rows per policy. Recorded the interferon/STAT1 branch (module context) as a knowledge gap: only inhibitor evidence links Pyk2 to that pathway.
