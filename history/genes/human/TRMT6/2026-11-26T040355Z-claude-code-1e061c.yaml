- type: EDIT
  outcome: needs_followup
  summary: 'Flag the TRMT6 proposed new term as pending: its remodelling clause is
    unsupported and a run judged no new term is needed'
  details: |
    Flagged the TRMT6 proposed new term, "tRNA substrate adaptor activity", as pending before it goes out for review in the forthcoming human knowledge-gap PR. This closes a follow-up recorded when the TRMT6 gap was wired in batch 39, where the dispute was noted in the gap boundary but not at the point where a curator would act on it.

    Two caveats were appended to the term's justification. First, the remodelling clause in the proposed definition, and the loop-splaying the justification attributes to TRMT6, are not supported by the measurement in the OpenScientist run kgap-trmt6-trna-contacts: superposing the bound tRNA on free canonical tRNA put TRMT6's exclusive footprint at the canonical-fold baseline, statistically indistinguishable from nucleotides contacting no protein, while the displaced D-loop nucleotides fell to TRMT61A. Since substrate remodelling is the feature that distinguishes this proposed term from the existing GO:0140767 enzyme-substrate adaptor activity, the term would need rewording or withdrawing if that result holds, and the superposition should be recomputed before either. Second, the same run judged that GO:0000049 tRNA binding already fits TRMT6's own activity and that no new term is needed, which is a direct argument against the proposal rather than an incidental remark.

    Nothing else was changed. The description, the core function and the NEW row on GO:0140767 still carry the original attribution, and the MODIFY of GO:0003723 RNA binding to tRNA binding is unaffected and is the action the run endorses. No annotation action was changed and the proposal was not withdrawn, because withdrawing it is a curator's decision and the recomputation has not been done.

    Incidental: the justification is a plain YAML scalar rather than a block scalar, so an inserted "measurement: superposing" broke parsing until the colon was removed. Validation and the quote check both pass afterwards.
