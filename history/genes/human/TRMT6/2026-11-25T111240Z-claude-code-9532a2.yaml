  summary: Record OpenScientist contact analysis grounding TRMT6 tRNA binding and
    disputing the remodelling attribution
  details: |
    Ran an OpenScientist deep-research job (kgap-trmt6-trna-contacts) on the knowledge gap recording that TRMT6's molecular function is structurally understood but unannotated. The run supplies the residue-level grounding a term would need, and it contradicts an attribution this review makes.

    Grounding. Measured on the deposited coordinates, TRMT6 contacts the tRNA through 37 residues and TRMT61A through 80, the two sets almost disjoint. The TRMT6 contacts touch 24 nucleotides across the T-stem, T-loop, variable loop, anticodon stem and the D-stem and D-loop boundary, with no contact to the acceptor stem, and the TRMT6-tRNA interface buries more surface than the catalytic subunit buries against the same tRNA; that surface is conserved above both the protein background and the protein-protein interface across eight eukaryotic orthologs. The enables-versus-contributes_to question is settled by distance: TRMT6 contributes no residue to the catalytic pocket and none to the S-adenosylmethionine site, its nearest heavy atom 4.14 Angstrom from the cofactor and 8.46 Angstrom from the target N1, where TRMT61A reaches 2.53 and 3.15. The local Q9UJA5 record agrees at profile level, carrying only IPR017423 and PF04189 and none of the methyltransferase signatures, and it cross-references the three structures the run measured.

    No annotation change was needed. The run concludes GO:0000049 tRNA binding already fits and no new term is required for TRMT6's own activity, which is exactly what this review already proposes: the generic GO:0003723 row is already MODIFY with GO:0000049 as the replacement, and the gap's resolution already names that curation.

    The contradiction is about remodelling, and it is recorded rather than acted on. This review attributes the splaying of the T- and D-loops to TRMT6, in its description, its core function and the definition of its proposed new term. The run tested that by superposing the bound tRNA on free canonical tRNA and reports that TRMT6's exclusive footprint sits at the canonical-fold baseline, statistically indistinguishable from nucleotides contacting no protein at all, while the displaced D-loop nucleotides 15-19 are held by TRMT61A, and every broken tertiary pair of the elbow has its displaced partner contacted by TRMT61A and not TRMT6. Its summary is that TRMT6 clamps the tRNA in register and TRMT61A opens the elbow. The cited literature quote describes the splaying as a property of the complex without attributing it to either subunit, so this review's attribution is an inference that the measurement contradicts.

    Status moved from OPEN to NARROWING. The description, core function and proposed new term that rest on the remodelling attribution were left unchanged, because the superposition was not recomputed here and one unverified computation should not rewrite a core function. Recomputing it is now the first thing to do before that proposed term is submitted anywhere, since its proposed definition asserts the remodelling. Minor discrepancy noted: the run describes six GO:0005515 rows where the local GOA has eight, which does not affect its argument.
