  summary: Add NEW part_of gamma-delta TCR complex for human CD3D
  details: |
    Resolved issue 4221. Added NEW part_of GO:0042106 gamma-delta T cell receptor complex (IDA, PMID:17923503; additional PMID:38657677) on human primary-cell biochemistry (PBMC gamma-delta TCRs contain CD3 delta; NAMOS stoichiometry TCRgammadelta CD3epsilon2 gamma delta zeta2) and human Vgamma9Vdelta2 and Vgamma5Vdelta1 cryo-EM structures. The absence from GOA reflected murine composition (NAS PMID:16418397), not human data; comparator CD3E, CD3G and CD247 carry the term. Corrected the claim that human CD3 delta-deficient patients retain gamma-delta T cells. Replaced the resolved suggested question with one about re-sourcing the human NAS rows. Validated with just validate human CD3D.
