  summary: 'Create review: CD3D'
  details: |
    De novo review of human CD3D (P04234) for the ADAPTIVE_IMMUNITY TCR trunk. All 62 seeded GOA annotations were actioned (no PENDING) and one NEW MF added (GO:0030159 signaling receptor complex adaptor activity, justified by the cryo-EM TCR-CD3 structure and a comparator check showing CD3E and CD3G already carry it). Core functions: transmembrane signaling receptor activity (ITAM-bearing signaling subunit, TCR signaling pathway, alpha-beta TCR complex) and a structural role in TCR-CD3 assembly. Bare protein binding (HuRI SGTB) removed; identical protein binding marked over-annotated; knockout-derived and broad process terms kept non-core. Deep research (falcon with perplexity-lite fallback) failed and is noted in CD3D-notes.md. All 49 supporting_text quotes were checked verbatim against cached publications and Reactome entries, and just validate human CD3D passed with no errors or warnings.
