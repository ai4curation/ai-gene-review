  summary: 'Create: STXBP2 (Munc18-2) review, 44 rows'
  details: |
    First review of STXBP2, the FHL5 gene, alongside its partner STX11 and the priming factor UNC13D.

    44 GOA rows: 21 ACCEPT, 14 KEEP_AS_NON_CORE, 5 MODIFY, 2 REMOVE, 1 MARK_AS_OVER_ANNOTATED, 1 TOO_GENERAL. No proposed annotations; the record is already rich and nothing was missing.

    Four of the five MODIFY rows are the bare GO:0005515 rows whose WITH/FROM names STX11, refined onto GO:0019905 syntaxin binding; GO retains only syntaxin-1 and syntaxin-3 binding as children, the other partner-specific terms having been merged into the parent, so there is no syntaxin-11 binding term to use. The fifth refines GO:0001909 leukocyte mediated cytotoxicity onto GO:0043320 natural killer cell degranulation, which is a descendant through GO:0042267 and is what this row's own evidence measured: impaired NK cytotoxic granule exocytosis in patient lymphoblasts, rescued by ectopic wild-type STXBP2.

    The two REMOVE rows are GO:0099525 presynaptic dense core vesicle exocytosis and the GO:0098793 presynapse row logically inferred from it. The comparator check, run by term id with the hit count checked non-zero first, returns six human rows on GO:0099525 - RAB3A, SNAP25 and all three Munc18 paralogs - which is the signature of one assertion placed above their divergence rather than three findings, and only STXBP1 is neuronal. Three further grounds: UniProt's tissue specificity for this protein lists no neural tissue; its partners are syntaxin-11, syntaxin-3 and syntaxin-2, none the neuronal t-SNARE; and the term requires a neuronal dense core vesicle and a presynapse, neither of which this protein meets. The neurological features FHL5 patients sometimes show are not a counter-argument, since UniProt attributes them in the same sentence to lymphocyte and macrophage infiltration. Recorded as a PROBABLE OVER_PROPAGATION source defect against PANTHER at requested_change CHECK, since the node rather than this row is what needs fixing.

    Two calls deliberately resist mechanical application of TOO_GENERAL. GO:0030141 secretory granule is kept because the protein acts on at least five distinct kinds of secretory granule, and because the best-evidenced one - the cytolytic granule - is a secretory lysosome whose term sits under lysosome and so does not entail this one. GO:0006886 intracellular protein transport is kept because the propagated claim turns out to be independently true of this paralog for its own reason: it carries syntaxin-11 from an internal membrane to the cell surface.

    The GO:0005576 extracellular region row is marked over-annotated on the strength of its own source: Reactome's summary of the platelet-releasate event says the releasate holds proteins that do not originate in storage granules and that platelet lysis may be why they are detected.

    Core function recorded on GO:0030674 protein-macromolecule adaptor activity, with the caveat that an SM protein templates rather than adapts and GO has no term for that; two knowledge gaps and three experiments follow from it.
