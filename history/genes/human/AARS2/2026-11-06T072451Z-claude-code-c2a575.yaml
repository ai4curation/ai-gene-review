  summary: Migrate AARS2 off the obsoleted mitochondrial alanyl-tRNA aminoacylation
    term
  details: |
    Part of the tRNA aminoacylation BP obsoletion migration tracked in issue #2747.

    GO has obsoleted the 43 amino-acid-specific tRNA aminoacylation biological processes, GO:0070143 mitochondrial alanyl-tRNA aminoacylation among them, on the ground that the amino acid is already carried by the paired molecular function. Verified in go-edit.obo: GO:0070143 is is_obsolete true with replaced_by GO:0070127, and its comment names GO:0004813 alanine-tRNA ligase activity as the molecular function. Across the batch, 40 of the 43 carry a replaced_by matching the project page's mapping, so the substitution is sanctioned and not merely inferred from prose. Correcting an earlier draft of this record, which said none of the 43 carries a replaced_by or consider: that was read off QuickGO's term endpoint, which omits the field entirely, and an absent API field is not an absent axiom. GO:0070681 is the genuine exception, carrying consider targets and no replaced_by, which is what makes it the special case the tracking issue describes.

    Five edits, all resolving to GO:0070127 tRNA aminoacylation for mitochondrial protein translation. The IBA row on GO:0070143 and the IMP row on GO:0070143 moved from ACCEPT to MODIFY, since a row whose term is obsolete cannot be accepted as it stands; the GOA-sourced ID and label are preserved, per the rule that existing-annotation ids are machine-sourced and not rewritten. The GO:0006419 row and the GO:0043039 row both proposed GO:0070143 and are repointed. The core_functions directly_involved_in slot, which is hard-validated, carried GO:0070143 and now carries GO:0070127.

    The reasons needed rewriting rather than an id swap, because they argued for the obsoleted term: one said the mitochondrial child was both available and directly established, another that the organelle- and substrate-specific child was preferable. The distinction that makes the new reasoning correct is that the obsoletion removed amino-acid specificity and not compartment specificity. GO:0070127 is still live and, checked against QuickGO's ancestors, still an is_a descendant of GO:0006418, so refining to it remains legitimate; what is no longer expressible as a process is the alanine.

    The IMP row's reason keeps its existing evidence caveat verbatim, that the 2011 full text modeled variant effects rather than measuring aminoacylation kinetics and reported no translation defect in the patient cells tested. The term change and the evidence assessment are independent and the reason now says so.

    One near-miss worth recording: that caveat is shared verbatim by two rows, the MF GO:0004813 row and the BP GO:0070143 row. A first attempt anchored on the reason text alone matched both, which would have converted the correct MF ACCEPT into a MODIFY pointing at a process term. An occurrence-count assertion caught it; the edit now targets the second occurrence only, and the three GO:0004813 rows still read ACCEPT.

    Validation: ai-gene-review validate --terms passes with 2 warnings, the same count the file had before these edits; backfill-record-sections reports nothing mismatched.
