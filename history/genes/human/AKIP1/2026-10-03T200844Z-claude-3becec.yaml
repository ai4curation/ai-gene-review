  summary: 'First review of human AKIP1: a PKA catalytic-subunit partner acting on
    canonical NF-kappaB'
  details: |
    27 rows: 20 MODIFY, 4 REMOVE, 3 ACCEPT. Of 23 protein-binding IPI rows, the PRKACA row from the discovery paper is refined to GO:0034236 protein kinase A catalytic subunit binding (AKIP1 binds the catalytic subunit A helix, not RII - it is not an AKAP); 18 PDZ-domain partners from a PDZ-PBM affinity screen are refined to GO:0030165 PDZ domain binding, which has a sequence basis in AKIP1's C-terminal class II motif F-P-V; four screen-only partners are removed. The InterPro IPR033214 mapping to GO:1901222 regulation of non-canonical NF-kappaB is modified to GO:0043122 regulation of canonical NF-kappaB signal transduction, since the mechanism is PKA phosphorylation of p65 Ser-276 and InterPro's own description concerns p65. Mitochondrial localization, shown only in rat myocytes and curated for no species, is recorded as a knowledge gap rather than added.
- type: REVIEW
  outcome: changed
  sections:
  - existing_annotations
  - references
  - description
  - core_functions
  - suggested_questions
  summary: Round 2 - set NF-kappaB direction from isoform evidence, add the direct p65 contact
  details: |
    The NF-kappaB MODIFY had rested on two uncited paraphrases of the InterPro entry description. It
    now quotes PMID:23319652, which states that the effect depends on splice variant: AKIP1b recruits
    SIRT1 and represses transcription, while AKIP1a enhances it. The canonical UniProt isoform is
    AKIP1a, so the replacement moves from the direction-neutral GO:0043122 to GO:0043123 positive
    regulation of canonical NF-kappaB signal transduction; the AKIP1b repression would belong on an
    isoform-specific annotation.

    PMID:18178962, which UniProt cites with an experimental code for this function but which no GO
    annotation cites, is now included. It shows AKIP1 binds p65 directly (two-hybrid, pull-down and
    co-immunoprecipitation), that the PKA catalytic subunit is in the AKIP1-p65 complex and
    phosphorylates p65, and that knockdown abolishes the response. With the catalytic-subunit binding
    this grounds a NEW GO:0035591 signaling adaptor activity row, now the core molecular function,
    with catalytic-subunit binding kept as a second core function. No IPI partner accession is
    recorded because the abstract does not state the species of the co-immunoprecipitation.

    A nuclear-retention process term was considered and recorded as a question instead: both
    supporting results are from overexpression, and the retention mechanism is not shown.
