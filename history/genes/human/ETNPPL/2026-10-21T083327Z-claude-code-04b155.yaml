  summary: 'Create review: ETNPPL (closest characterised relative of DROME/CG8745)'
  details: |
    De novo review of human ETNPPL (Q8TBG4), independent of ProtNLM2 predictions. Falcon deep research failed (authentication), so literature was retrieved from PubMed and cached (11 papers). Accepted ethanolamine-phosphate phospho-lyase activity (IDA, IBA from PAINT node PTN002904331 limited to the vertebrate SF1 clade, IEA) and PLP binding. Removed two bare protein binding rows (ZC3HC1 screens). Set mitochondrion and mitochondrial matrix rows to UNDECIDED: UniProt location is curator inference and antibody studies in human and mouse brain show nuclear/cytoplasmic staining. Added NEW organophosphate catabolic process and NEW nucleus, and proposed a phosphoethanolamine catabolic process term. Recorded that CG8745 lies in PANTHER SF13, not ETNPPL SF1, so the SF1-specific substrate should not be transferred by membership alone.
